、准周期及混沌运动及其连续转变，否证了一维玻姆轨迹混沌不可能性的既有论断。\n3. 这为理解量子混沌在玻姆力学中的表现及初始条件敏感性的物理机制提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "O. F. de Alcantara Bonfim"}], "featured_authors": [{"name": "O. F. de Alcantara Bonfim"}], "author_count": 1}, {"id": "2604.25137", "category": "quant-ph", "title": "Quantum Dynamics via Score Matching on Bohmian Trajectories", "abstract": "We solve the time-dependent Schrödinger equation by learning the score function, the gradient of the log-probability density, on Bohmian trajectories. In Bohm's formulation of quantum mechanics, particles follow deterministic paths under the classical potential supplemented by a quantum potential depending on the score function of the evolving density. These non-crossing Bohmian trajectories form a continuous normalizing flow governed by the score. We parametrize the score with a neural network and minimize a self-consistent Fisher divergence between the network and the score of the resulting density. We prove that the zero-loss minimizer of this self-consistent objective recovers Schrödinger dynamics for nodeless wave functions, a condition naturally met in quantum vibrations of atoms. We demonstrate the approach on wavepacket splitting in a double-well potential and anharmonic vibrations of a Morse chain. By recasting real-time quantum dynamics as a self-consistent score-driven normalizing flow, this framework opens the time-dependent Schrödinger equation to the rapidly advancing toolkit of modern generative modeling.", "url": "https://arxiv.org/abs/2604.25137", "type": "理论+数值", "summary": "1. 该工作通过波姆轨迹上的得分匹配学习概率密度的梯度，从而求解含时薛定谔方程。\n2. 其技术核心在于将量子动力学重写为自洽得分驱动的连续正则化流，并用神经网络参数化得分函数以最小化Fisher散度。\n3. 这为将现代生成建模工具引入实时量子动力学模拟开辟了道路，特别适用于无节点波函数的原子振动问题。", "summary_source": "deepseek", "authors": [{"name": "Lei Wang"}], "featured_authors": [{"name": "Lei Wang"}], "author_count": 1}, {"id": "2604.25141", "category": "quant-ph", "title": "Nonreciprocal magnon blockade based on nonlinear effects", "abstract": "We present an alternative scheme to achieve nonreciprocal unconventional magnon blockade (NUMB) in a hybrid system formed by two microwave cavities and one yttrium iron garnet (YIG) sphere, where the pump and signal cavities interact nonlinearly with each other and the signal cavity is coupled to the YIG sphere. It is found that the nonlinear coupling occurs between the pump cavity and magnon modes due to the dispersive interactions among three bosonic modes. Meanwhile, the Kerr nonlinearity is present in the pump cavity. Based on these nonlinear effects, a nonreciprocal magnon blockade could be achieved with the help of weak parametric driving of the pump cavity. The present work provides an alternative method to prepare single magnon resource, which may be helpful for quantum information processing.", "url": "https://arxiv.org/abs/2604.25141", "type": "理论", "summary": "1. 该工作在双微波腔与钇铁石榴石球混合体系中，利用泵浦腔与磁子模间的色散相互作用及Kerr非线性，提出了实现非互易非常规磁子阻塞的替代方案。\n2. 其核心卖点在于通过弱参量驱动泵浦腔，结合非线性耦合效应，无需强磁场即可在单一方向压制磁子双占据，实现非互易单磁子发射。\n3. 这为制备可操控的单磁子资源开辟了新路径，对基于磁子的量子信息处理中非互易单量子态产生具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Han-Qiu Zhang"}, {"name": "Shuang-Shuo Chu"}, {"name": "Jian-Song Zhang"}, {"name": "Wen-Xue Zhong"}, {"name": "Guang-Ling Cheng"}], "featured_authors": [{"name": "Han-Qiu Zhang"}, {"name": "Shuang-Shuo Chu"}, {"name": "Jian-Song Zhang"}, {"name": "Wen-Xue Zhong"}, {"name": "Guang-Ling Cheng"}], "author_count": 5}, {"id": "2604.25148", "category": "quant-ph", "title": "Extending UNIQuE: Quantum Simulation Speedup for the HHL Algorithm", "abstract": "In an extension of the Unconventional Noiseless Intermediate Quantum Emulator, this work introduces a classical emulation of the quantum Harrow-Hassidim-Lloyd algorithm for sampling from the solution space of linear systems. The emulated HHL algorithm scales exponentially with the number of qubits required to represent the linear system, which is an advantage over the state vector simulation of the HHL algorithm, which scales exponentially as a function of both the size of the linear system and the magnitude of its largest (scaled) eigenvalue. We benchmark our emulator by comparing it with the Intel Quantum Simulator and demonstrate a runtime advantage for small linear systems.", "url": "https://arxiv.org/abs/2604.25148", "type": "数值", "summary": "1. 该工作扩展了UNIQuE方法，实现了针对线性系统解空间采样的HHL算法的经典模拟。\n2. 其技术卖点在于模拟所需资源仅随量子比特数指数增长，避免了态矢量模拟同时随系统规模和最大特征值指数膨胀的双重瓶颈。\n3. 这为在经典计算机上高效模拟特定量子算法求解线性系统提供了可扩展的替代方案，并已在小规模实例上验证了运行时优势。", "summary_source": "deepseek", "authors": [{"name": "Reece Robertson"}, {"name": "Ameya Bhave"}], "featured_authors": [{"name": "Reece Robertson"}, {"name": "Ameya Bhave"}], "author_count": 2}, {"id": "2604.25194", "category": "quant-ph", "title": "Quantum-enhanced Network Tomography", "abstract": "Network tomography refers to the use of inference techniques for inferring internal network states from end-to-end probes. Quantum probes, implemented by sending blocks of $n$ coherent-state pulses augmented with continuous-variable (CV) squeezing ($n=1$) or weak temporal-mode entanglement ($n>1$) over a lossy channel to a receiver with homodyne detection capabilities, are known to carry information about the channel transmissivity. Assuming a subset of nodes in an optical network is capable of sending and receiving such probes through intermediate nodes with all-optical switching capabilities, we leverage these quantum probes to estimate link transmissivities. To determine how to route the probes in a network, we propose a probe construction algorithm that guarantees link identifiability, while maximizing the number of information orthogonal sets of transmissivities. A set of probes induces a Fisher information matrix (FIM). We then derive two metrics, the determinant of the FIM and the trace of its inverse, to evaluate the performance of the probes. In particular, our results can be used to characterize the quantum improvement in estimating link transmissivities in a general optical network.", "url": "https://arxiv.org/abs/2604.25194", "type": "理论+数值", "summary": "1. 该工作利用连续变量压缩或弱时域纠缠的量子探针，结合全光交换网络，实现了对链路透射率的量子增强网络层析成像。\n2. 其技术核心在于提出一种探针构造算法，通过最大化Fisher信息矩阵的行列式并最小化其逆的迹，保证了链路可识别性并量化了量子改进。\n3. 这为一般光学网络中利用量子探针提升网络状态估计精度提供了理论度量和实验指引。", "summary_source": "deepseek", "authors": [{"name": "Yufei Zheng"}, {"name": "Zihao Gong"}, {"name": "Saikat Guha"}, {"name": "Don Towsley"}], "featured_authors": [{"name": "Yufei Zheng"}, {"name": "Zihao Gong"}, {"name": "Saikat Guha"}, {"name": "Don Towsley"}], "author_count": 4}, {"id": "2604.25195", "category": "quant-ph", "title": "A simple method to fabricate Josephson junctions", "abstract": "A minimal method to fabricate Al/AlO$_x$/Al Josephson junctions (JJs) using photolithography and argon etching, before metallization and oxidation, is demonstrated. JJs with areas ranging from 1 to 6 $\\mu$m$^2$ can be fabricated and, with the appropriate oxidation conditions, the junction resistance can be varied by $\\sim$2 orders of magnitude. Transmission electron microscopy reveals the successful fabrication of JJs with few grain boundaries suggesting reduced energy loss from two-level-systems. Superconducting QUantum Interference Devices (SQUIDs) fabricated from this methodology exhibit reduced resistance variation of over multiple chips, compared with electron beam lithography, and the devices can sustain repeated thermal cycles to 10 mK with the excellent flux response remaining unchanged. The quantum applications of this technology are demonstrated by embedding a SQUID resonator into a 3D cavity and parametrically amplifying low photon numbers with gains of $\\sim$40 dB. This work establishes the simplest approach to fabricating JJs to date, and it could prove pivotal to the widespread utilization of superconducting circuit-based quantum technologies.", "url": "https://arxiv.org/abs/2604.25195", "type": "实验", "summary": "1. 该工作提出一种基于光刻与氩气刻蚀的极简方法制备Al/AlOx/Al约瑟夫森结，无需电子束曝光即可实现1–6 μm²结面积与两量级电阻可调。\n2. 其技术核心在于通过氧化条件调控结电阻，透射电镜证实结中晶界极少，从而降低二能级系统引起的能量耗散。\n3. 该工艺制备的SQUID器件片间电阻离散低、耐受多次热循环，并在3D腔中实现约40 dB参量增益，为超导量子电路的大规模实用化提供了简化路线。", "summary_source": "deepseek", "authors": [{"name": "Imran Mahboob"}, {"name": "Satoshi Sasaki"}, {"name": "Takaaki Takenaka"}], "featured_authors": [{"name": "Imran Mahboob"}, {"name": "Satoshi Sasaki"}, {"name": "Takaaki Takenaka"}], "author_count": 3}, {"id": "2604.25275", "category": "quant-ph", "title": "Graph-Conditioned Meta-Optimizer for QAOA Parameter Generation on Multiple Problem Classes", "abstract": "We study parameter transferability for the Quantum Approximate Optimization Algorithm (QAOA) across multiple combinatorial optimization problem classes from a parameter generation perspective. Specifically, a meta-optimizer is trained on one problem class and deployed on another during test time. Prior work employs a Long Short-Term Memory network to emulate QAOA optimization trajectories, but the learned dynamics usually collapse to near-identical paths, limiting cross-problem transfer efficiency. In this paper, we present a problem-aware graph-conditioned meta-optimizer for QAOA that learns to generate parameter trajectories over a fixed horizon, providing strong initializations with only a few steps. The optimizer is conditioned on compact graph embeddings and trained end-to-end using differentiable feedback from the QAOA objective, avoiding the need for ground-truth angles. We evaluate across multiple graph problem classes, including MaxCut, Maximum Independent Set, Maximum Clique, and Minimum Vertex Cover. We report both solution quality and feasibility-aware metrics where constraints apply. Results across a comprehensive empirical study consisting of 64 settings show that the learned optimizer can reduce optimization effort and improve performance over standard initialization, while exhibiting transferable behavior across graph families and problem types.", "url": "https://arxiv.org/abs/2604.25275", "type": "理论+数值", "summary": "1. 该工作提出一种图条件元优化器，在MaxCut、最大独立集等多类图问题上生成QAOA参数轨迹，实现跨问题类别的参数迁移与高效初始化。\n2. 其技术核心在于利用图嵌入条件化和QAOA目标的端到端可微反馈训练生成器，无需真实角度，显著提升参数生成效率和跨问题迁移性能。\n3. 这为QAOA在不同组合优化问题中提供鲁棒的参数初始化通用框架，有望降低经典-量子混合算法的优化成本与计算开销。", "summary_source": "deepseek", "authors": [{"name": "Kien X. Nguyen"}, {"name": "Ilya Safro"}], "featured_authors": [{"name": "Kien X. Nguyen"}, {"name": "Ilya Safro"}], "author_count": 2}, {"id": "2604.25311", "category": "quant-ph", "title": "Entanglement Dynamics in a Two Transmon Qubit System under Continuous Measurement and Postselection", "abstract": "We investigate the role of continuous measurement and postselection in the dynamics and entanglement of a transmon-cavity-transmon coupled system. In the dispersive regime, characterized by a large detuning between the transmons and the cavity, the two transmons interact via virtual excitation of the cavity, giving rise to an effective transmon-transmon coupling. In addition to this coherent interaction, each transmon undergoes spontaneous emission, which is continuously monitored through independent detection channels. By incorporating realistic detector inefficiencies, we analyze both efficient and imperfect monitoring scenarios and demonstrate that postselection significantly slows down the decay of entanglement compared to the unmonitored case. We formulate the stochastic master equation for the coupled system, derive the corresponding postselected master equation, and investigate the dynamics through the Liouvillian superoperator spectrum. In the interaction frame, we identify the emergence of an exceptional point and characterize the associated broken and unbroken PT-symmetric phases. We show how these phases influence the system dynamics and the corresponding entanglement behavior. Our results provide insight into how continuous measurement and postselection affect entanglement in dissipative quantum systems, with potential applications in quantum information processing.", "url": "https://arxiv.org/abs/2604.25311", "type": "实验", "summary": "1. 该工作通过随机主方程与后选择主方程，理论研究了色散耦合双transmon系统中连续测量与后选择对纠缠动力学的调控作用。\n2. 其核心在于揭示了后选择能显著减缓纠缠衰减，并发现Liouvillian超算子谱中的异常点及其对应的PT对称破缺与未破缺相。\n3. 这为耗散量子系统中通过连续测量与后选择操控纠缠提供了明确机制，对量子信息处理具有潜在启发。", "summary_source": "deepseek", "authors": [{"name": "Roson Nongthombam"}, {"name": "Amarendra K. Sarma"}], "featured_authors": [{"name": "Roson Nongthombam"}, {"name": "Amarendra K. Sarma"}], "author_count": 2}, {"id": "2604.25333", "category": "quant-ph", "title": "Sign Embedding Quantum Algorithms for Matrix Equations and Matrix Functions", "abstract": "We develop a systematic sign-embedding framework of operator-output quantum algorithms for matrix equations and matrix functions. Differing from the contour-integral treatment, we start with the matrix-sign embedding route: an augmented matrix $M$ whose half-plane matrix sign compresses the target operator either as a block of $\\text{sign}(M)$ or, in projector form, through $(I-\\text{sign}(M))/2$; we then construct a logarithmic-sinc approximation for the half-plane sign operator and combine it with structure-aware scaled multiplexing and nodewise rebalancing of shifted inverse families. For ordinary Sylvester equations, we offer an explicit block-encoding of the target matrix solution with query complexity linear in the inverse-conditioning parameters and logarithmic in the target error tolerance, under non-normal and non-diagonalizable settings given a field-of-values (FoV) gap or strip-resolvent hypotheses. These algorithms propagate the same overlap-based normalization bookkeeping to ordinary and generalized Sylvester equations, generalized Lyapunov equations, principal square roots and inverse square roots, matrix geometric means, and continuous-time algebraic Riccati equations (CARE). These results identify matrix-sign embeddings and nodewise rebalancing as reusable design principles for structured operator-output quantum linear algebra.", "url": "https://arxiv.org/abs/2604.25333", "type": "理论+数值", "summary": "1. 该工作构建了系统性的符号嵌入量子算法框架，用于高效求解矩阵方程与矩阵函数。\n2. 其核心在于通过增广矩阵的半平面符号压缩目标算子，采用对数-正弦近似结合结构感知缩放复用与节点再平衡，在非正规非对角化且满足场值域间隙假设下，以线性于逆条件参数、对数于误差容限的查询复杂度实现Sylvester方程的显式块编码。\n3. 该框架的归一化簿记机制可推广至Lyapunov方程、矩阵平方根及代数Riccati方程等多种问题，为结构化算子输出量子线性代数提供了可复用的设计原则。", "summary_source": "deepseek", "authors": [{"name": "Yanqiao Wang"}, {"name": "Jin-Peng Liu"}], "featured_authors": [{"name": "Yanqiao Wang"}, {"name": "Jin-Peng Liu"}], "author_count": 2}, {"id": "2604.25424", "category": "quant-ph", "title": "A graph-aware bounded distance decoder for all stabilizer codes", "abstract": "We formulate a bounded distance decoding strategy applicable to all stabilizer codes including both CSS and non-CSS code-families. The framework emerges out of the local Clifford equivalence between arbitrary stabilizer states and graph states. Using the graphical representation of the stabilizers and the syndromes, we constitute the bounded distance decoding as an adaptable generalization of maximum likelihood decoding, ensuring correction of all errors with weights upper bounded by a target weight. We show that strategic pruning associated with a feed-forward network structure of the graph can reduce the search space and subsequently the runtime of the designed decoder. We demonstrate satisfactory performance of the bounded distance decoder in the case of the optimal non-CSS codes up to distance $d=11$ subjected to the depolarizing error on all qubits, and near-optimal decoding for the color and the surface codes, both belonging to the CSS family, under the bit-flip errors on the qubits. We also develop an open-source library, QGDecoder, enabling the graph-aware bounded distance decoding of arbitrary stabilizer codes.", "url": "https://arxiv.org/abs/2604.25424", "type": "理论", "summary": "1. 该工作提出了一个适用于所有稳定子码（含CSS与非CSS码族）的有界距离解码通用框架。\n2. 其核心卖点在于基于稳定子态与图态的局部Clifford等价，利用图的前馈网络结构剪枝，将解码转化为最大似然解码的自适应推广。\n3. 这为任意稳定子码提供了可纠正目标权重以内错误的高效解码方案，并开源QGDecoder库，有望推动容错量子计算中解码器的统一设计。", "summary_source": "deepseek", "authors": [{"name": "Harikrishnan K J"}, {"name": "Amit Kumar Pal"}], "featured_authors": [{"name": "Harikrishnan K J"}, {"name": "Amit Kumar Pal"}], "author_count": 2}, {"id": "2604.25425", "category": "quant-ph", "title": "Elucidating mechanism of optical cavities in superconducting strip single photon detectors using transmission line and impedance models", "abstract": "We clarified the physical mechanism of superconducting strip single photon detectors (SSPDs) with optical cavities by using transmission line and impedance models. By introducing the transmission line model, we derived the analytical formulae for the absorptance of SSPDs with optical cavities. We compared the absorptance obtained from the analytical formulae for SSPDs with single-side, double-side, and dielectric multi-layer optical cavities against the results of numerical simulations. The comparison showed that the results were nearly identical. By introducing the impedance model, it was clearly shown that the SSPDs with optical cavities achieved the maximum absorptance when their input impedance of the SSPDs with optical cavities matched the impedance of the input medium. The design concepts proposed in this study are applicable to other superconducting detectors, such as microwave kinetic inductance detectors and transition-edge sensors.", "url": "https://arxiv.org/abs/2604.25425", "type": "理论+数值", "summary": "1. 该工作利用传输线与阻抗模型，解析推导了光学腔增强超导带单光子探测器的吸收率公式，并阐明其物理机制。\n2. 技术核心在于通过阻抗匹配条件最大化吸收率，解析结果与数值模拟高度吻合，显著提升探测器效率。\n3. 此设计概念可推广至微波动力学电感探测器和过渡边缘传感器，为超导光子探测器件优化提供通用指导。", "summary_source": "deepseek", "authors": [{"name": "Hiroki Kutsuma"}, {"name": "Taro Yamashita"}], "featured_authors": [{"name": "Hiroki Kutsuma"}, {"name": "Taro Yamashita"}], "author_count": 2}, {"id": "2604.25503", "category": "quant-ph", "title": "Quantum-Accelerated Gowers $U_2$ Norm for Bent Boolean Functions", "abstract": "Bent Boolean functions extremal objects that maximally resist affine approximation are notoriously hard to construct for large numbers of variables. We propose a hybrid quantum-classical genetic algorithm (GA) that uses a \\emph{quantum circuit} to evaluate the Gowers $U_2$ norm as the evolutionary fitness function. Our central contribution is a complexity-theoretic separation: the quantum evaluation circuit requires only $3n$ qubits and $\\bigO(n^2)$ two-qubit gates per function query, whereas the classical computation of the exact Gowers $U_2$ norm demands $\\bigO(2^{2n})$ arithmetic operations an exponential overhead that renders it infeasible for $n \\gtrsim 25$. We validate the framework on $n=6$ and $n=8$ variable systems. For $n=8$, our classical GA run extended to 1000 generations achieves best fitness $\\Utwof = 0.250000$ \\emph{exactly} the theoretical bent threshold $2^{-n/4}$ with average fitness $0.257267$, confirming that the Gowers $U_2$ norm is a superior fitness criterion over Walsh-Hadamard spectral flatness. Quantum-assisted evaluation faithfully reproduces the classical trajectory up to finite-sampling noise, and our complexity analysis demonstrates that for $n > 25$ the quantum evaluator provides a decisive computational advantage on fault-tolerant hardware.", "url": "https://arxiv.org/abs/2604.25503", "type": "理论+数值", "summary": "1. 该工作提出混合量子-经典遗传算法，用量子电路计算Gowers U2范数作为适应度函数以构造Bent布尔函数。\n2. 其技术核心在于展示量子评估仅需3n量子比特和O(n²)双量子比特门，而经典计算需指数级O(2^{2n})操作，实现复杂度分离。\n3. 这为在容错量子硬件上高效构造高变量Bent函数提供了确凿的复杂度优势，并启发了量子算法在组合优化中的实际应用。", "summary_source": "deepseek", "authors": [{"name": "Rajdeep Dwivedi"}, {"name": "C. A Jothishwaran"}, {"name": "Sugata Gangopadhyay"}, {"name": "Vishvendra Singh Poonia"}], "featured_authors": [{"name": "Rajdeep Dwivedi"}, {"name": "C. A Jothishwaran"}, {"name": "Sugata Gangopadhyay"}, {"name": "Vishvendra Singh Poonia"}], "author_count": 4}, {"id": "2604.25531", "category": "quant-ph", "title": "Quantum Optimization Methods for the Generalized Traveling Salesman Problem", "abstract": "This paper studies quantum optimization baselines for the Generalized Traveling Salesman Problem (GTSP), a clustered routing problem that naturally models variant selection and sequencing problems under discrete alternatives. We propose a novel GTSP QUBO formulation focused on maintaining feasible solutions for quantum annealing, as well as a hardware-executable gate-based pipeline utilizing the Quantum Approximate Optimization Algorithm (QAOA). We implement a constrained QAOA variant using an XY-mixer, which preserves the stepwise Hamming weight in the ideal circuit model, while feasibility with respect to the full GTSP constraints is tracked explicitly during post-processing. We compare the two quantum optimization paradigms on problem instances from GTSPLIB, an established benchmark dataset, and validate against classical state-of-the-art solvers. To mitigate current quantum hardware size limitations, we further extend a preprocessing method to reduce the node count in instance clusters, constructing new NISQ-friendly instances from reduced subsets. Across all tested instances, quantum solvers often produce competitive solution quality when tested on smaller graphs, but exhibit higher runtimes and a sharp degradation in feasibility and scalability as instance size grows. Our evaluation highlights where quantum optimizers can already succeed and which algorithmic bottlenecks, like sampling rates, runtime issues, and other practical failure modes, remain as open problems.", "url": "https://arxiv.org/abs/2604.25531", "type": "理论+数值", "summary": "1. 该工作针对广义旅行商问题，提出了适用于量子退火的QUBO公式和基于QAOA的门电路管线，并在GTSPLIB基准上与经典求解器进行了比较。\n2. 技术核心在于采用XY-mixer的约束QAOA变体，在理想电路中保持逐步汉明权重，后处理显式跟踪全约束可行性，并扩展了预处理方法减少节点数以适配NISQ硬件。\n3. 评估显示量子求解器在小图上竞争质量，但随实例增大可行性锐降且运行时间偏高，这指出采样率、后处理瓶颈等开放问题对可扩展性的制约。", "summary_source": "deepseek", "authors": [{"name": "Maximilian Zorn"}, {"name": "Melinda Braun"}, {"name": "Michael Ertl"}, {"name": "Tommy Kiss"}, {"name": "Sara Juarez Oropeza"}, {"name": "Claudia Linnhoff-Popien"}, {"name": "Jonas Stein"}], "featured_authors": [{"name": "Maximilian Zorn"}, {"name": "Melinda Braun"}, {"name": "Michael Ertl"}, {"name": "Sara Juarez Oropeza"}, {"name": "Claudia Linnhoff-Popien"}, {"name": "Jonas Stein"}], "author_count": 7}, {"id": "2604.25532", "category": "quant-ph", "title": "Bond-dimension scaling of a local-refinement advantage over hyperoptimized tensor-network contraction on Sycamore like topologies", "abstract": "We identify a missing local-refinement stage in the cotengra tensor-network contraction pipeline and show that its impact grows monotonically with bond dimension on the \\emph{connectivity graph} of Sycamore-like topologies. Appending a nearest-neighbor interchange (NNI) search to the \\cotengra{} output at matched 8-s wallclock yields a median \\emph{predicted} cost-model gap $\\Delta\\fT$ at $n{=}500$ that grows monotonically and approximately linearly in $\\chi$, from $\\sim\\!15$~bits at $\\chi{=}2$ to $\\sim\\!116$~bits at $\\chi{=}16$ (Fig.~\\ref{fig:chi_sweep}), with the refiner winning on $25/25$ seeds at every tested $\\chi$. Two control families -- random $3$-regular and QAOA $p{=}2$ interaction graphs -- show median $|\\Delta\\fT| \\leq 0.71$~bits across both controls at every $\\chi$, with refiner win rate falling toward chance as $\\chi$ grows; the signal is topology-specific, not a generic refinement-budget effect. An ablation establishes that refinement itself, not the four-axis Pareto acceptance rule, drives the gain ($|\\Delta\\fT| \\lesssim 0.1$ bits between scalar and Pareto arms at $\\chi{=}2$). The Sycamore-circuit envelope (App.~\\ref{em:sec:results:syccirc}) reports the corresponding refinement on actual random circuits at depths $m \\in \\{4, 6, 8, 10, 12\\}$, where the refiner wins on $5/5$ instances at every depth. The advantage is therefore largest precisely in the bond-dimension regime relevant to physical contraction.", "url": "https://arxiv.org/abs/2604.25532", "type": "理论+数值", "summary": "1. 该工作发现cotengra张量网络收缩流程中缺失的局域细化阶段，并证明在Sycamore-like拓扑上其优势随键维数χ在χ=2至16区间内单调增长，中位预测成本差距从约15比特增至约116比特。\n2. 技术卖点在于邻域互换搜索细化驱动的增益是拓扑特定的，而非通用细化预算效应，且在物理相关的高键维数区（χ≥8）优势最显著。\n3. 这为量子优势实验中的张量网络收缩提供了明确的优化方向，暗示高键维数下局域细化可能是降低收缩成本的关键策略。", "summary_source": "deepseek", "authors": [{"name": "Rubén Darío Guerrero"}], "featured_authors": [{"name": "Rubén Darío Guerrero"}], "author_count": 1}, {"id": "2604.25610", "category": "quant-ph", "title": "Optimizing ground state preparation protocols with autoresearch", "abstract": "Artificial intelligent language-model based coding agents have significantly changed the way we interact with computers in our day-to-day, as it is common to use them to create, improve, and run programming scripts only using natural language. Agent code updates can be better guided when such programs can be executed and scored automatically rather than judged by human preference. In quantum computing and classical quantum simulation settings, ground-state preparation has a parallel structure: candidate protocols can be ranked by estimated energies and other proxies indicating proper quantum-state convergence. In this work, we study how autoresearch, a code optimization strategy based on coding agents, can be used to optimize hyperparameter choices of different ground-state preparation and sampling protocols, including the variational quantum eigensolver (VQE), density matrix renormalization group (DMRG), and auxiliary-field quantum Monte Carlo (AFQMC). We validate the viability and capacity of this method on simple spin models and molecular Hamiltonians. Across all three settings, the agent mutates simple baselines into complex protocols with improved energy proxies while operating under constrained space-time computational budgets. We conclude with discussions of other quantum routines that support executable scalar scoring, enabling evolutionary coding agents to automate a substantial portion of the protocol-tuning work that would otherwise be required manually.", "url": "https://arxiv.org/abs/2604.25610", "type": "理论+数值", "summary": "1. 该工作研究利用基于编码代理的自动研究策略优化变分量子本征求解器、密度矩阵重正化群和辅助场量子蒙特卡洛等基态制备协议的超参数选择。\n2. 其核心卖点在于代理在受限时空计算预算下，通过自动变异基线协议为复杂协议改善能量收敛代理，实现协议调优的自动化。\n3. 这为其他支持可执行标量评分的量子算法提供了自演化调优范式，有望大幅减少手动调参工作量。", "summary_source": "deepseek", "authors": [{"name": "Luis Mantilla Calderón"}, {"name": "Jérôme F. Gonthier"}, {"name": "Ignacio Gustin"}, {"name": "Varinia Bernales"}, {"name": "Alán Aspuru-Guzik"}], "featured_authors": [{"name": "Luis Mantilla Calderón"}, {"name": "Jérôme F. Gonthier"}, {"name": "Ignacio Gustin"}, {"name": "Varinia Bernales"}, {"name": "Alán Aspuru-Guzik"}], "author_count": 5}, {"id": "2604.25631", "category": "quant-ph", "title": "Local tensor-train surrogates for quantum learning models", "abstract": "A key bottleneck in quantum machine learning is the computational cost of repeated quantum circuit evaluations during the inference phase. To address this, we present a framework for constructing fast, cheap, provably accurate classical tensor-train surrogates of fully trained quantum machine learning models within local patches of their input data space. The approach combines Taylor polynomial approximation with a tensor-train (TT) representation and embeds it in a statistical learning paradigm via empirical risk minimization. In our analysis, the Taylor-TT construction serves as a deterministic error certificate proving that the TT hypothesis class contains a good approximation; empirical risk minimization then provably recovers a surrogate with controlled generalization error and explicit bounds. This translates into three independently controllable error sources: (i) Taylor truncation error controlled by the patch radius $r$ and polynomial degree $p$, (ii) TT approximation error controlled by the bond dimension $\\chi$, and (iii) statistical estimation error. While the parameter count scales polynomially in the number of data dimensions $N$, i.e., $d_{\\mathrm{eff}} = N(p+1)\\chi^2$ rather than the naive $(p+1)^N$, the worst-case constants inherit an exponential factor through the tensor-product feature norm during Taylor polynomial embedding onto TT. This cleanly separates representation complexity from feature-induced constants. Our risk bounds and sample complexity depend explicitly on the local patch radius $r$.", "url": "https://arxiv.org/abs/2604.25631", "type": "理论+数值", "summary": "1. 该工作提出在输入空间局部区域内，为训练好的量子机器学习模型构建快速精确的经典张量列替代模型框架。\n2. 关键卖点在于结合泰勒多项式与张量列表示，通过经验风险最小化将误差分解为截断、逼近与估计三项可控来源，参数随数据维度多项式增长。\n3. 这为量子机器学习推理阶段提供了低成本高精度的替代方案，并给出了显式的泛化误差界与样本复杂度依赖。", "summary_source": "deepseek", "authors": [{"name": "Sreeraj Rajindran Nair"}, {"name": "Christopher Ferrie"}], "featured_authors": [{"name": "Sreeraj Rajindran Nair"}, {"name": "Christopher Ferrie"}], "author_count": 2}, {"id": "2604.25644", "category": "quant-ph", "title": "Efficient Complex-Valued State Preparation on Bucket Brigade QRAM", "abstract": "Efficient quantum state preparation is a critical component in quantum algorithms that process large classical data, and it is fundamental to realizing quantum advantage in domains such as machine learning, quantum linear algebra, and quantum finance. Building on the framework of~\\cite{berti2025efficient}, which integrates Bucket Brigade QRAM (BBQRAM) with a segment tree to achieve amplitude encoding in polylogarithmic query time, we present two improvements within the same architecture-aware framework. First, we remove the $U_{2\\mathrm{CR}}$ subroutine by classically precomputing the rotation angles determined by the segment tree and storing these angles directly in the BBQRAM cells. The tradeoff is that the classically loaded QRAM stores precomputed fixed-point angles rather than raw subtree weights. Second, we extend the construction to complex-valued matrices $A \\in \\mathbb{C}^{M \\times N}$ by storing a leaf phase alongside each precomputed rotation angle and using a two-step magnitude-then-phase procedure; the real signed case is naturally subsumed as a one-bit phase specialization. At unchanged $\\mathcal{O}(\\log_2^2(MN))$ BBQRAM query complexity, the QPU procedure reduces to BBQRAM retrievals and controlled-rotation cascades, with $\\mathcal{O}(MN)$ memory cells per matrix and no reversible arithmetic on the QPU.", "url": "https://arxiv.org/abs/2604.25644", "type": "理论+数值", "summary": "1. 本文在桶链量子随机存取存储器（BBQRAM）框架内，通过将分段树确定的旋转角度经典预计算并直接存储于QRAM单元，移除了U_2CR子程序，同时引入两步幅值-相位过程实现复数值矩阵的态制备。\n2. 卖点在于经典预计算将量子处理单元操作简化为BBQRAM检索与受控旋转级联，无需量子可逆算术，在保持O(log^2(MN))查询复杂度下实现复数值幅值编码，实数有符号情形作为特例纳入。\n3. 这为基于QRAM的大规模经典数据量子加载提供了更简洁的架构感知方案，可望降低容错量子计算机中态制备的量子资源开销，推动量子机器学习与量子线性代数等领域的实用性进展。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Berti"}, {"name": "Francesco Ghisoni"}], "featured_authors": [{"name": "Alessandro Berti"}, {"name": "Francesco Ghisoni"}], "author_count": 2}, {"id": "2604.25660", "category": "quant-ph", "title": "Nanoscale Sensing of Solid-State Samples with High Frequency Resolution", "abstract": "To meet the growing demand for nanoscale surface analysis, nitrogen-vacancy (NV) centers offer a high-sensitivity alternative by leveraging their ability to operate in immediate proximity to the sample. In this work, we propose a quantum control protocol designed to overcome the inherent challenges of solid-state environments, specifically by mitigating anisotropy and strong dipole-dipole interactions to enable the detection of isotropic chemical shifts at the nanoscale. To achieve this, our scheme synchronizes a slowly rotating magnetic field with tailored RF decoupling and MW control of the NV sensors. We provide an analytical mapping that explicitly links the measured spectrum to the control sequence features and the underlying system parameters, enabling a straightforward characterization of the sample.", "url": "https://arxiv.org/abs/2604.25660", "type": "理论", "summary": "1. 该工作提出一种基于氮-空位中心的量子控制协议，用于在固态样品中实现纳米级各向同性化学位移检测，克服了各向异性和强偶极相互作用的挑战。\n2. 其核心卖点是同步旋转磁场与定制射频去耦及微波控制的方案，并建立了测量谱与序列特征及系统参数的解析映射，使样品表征直接明了。\n3. 这为纳米尺度表面分析的高频分辨率传感提供了可行途径，尤其适用于复杂固态环境中的化学成像与材料研究。", "summary_source": "deepseek", "authors": [{"name": "P. Alsina-Bolívar"}, {"name": "D. B. Bucher"}, {"name": "J. Casanova"}], "featured_authors": [{"name": "P. Alsina-Bolívar"}, {"name": "D. B. Bucher"}, {"name": "J. Casanova"}], "author_count": 3}, {"id": "2604.25715", "category": "quant-ph", "title": "Ground-state energies of Ising models calculated using the samples from a quantum computer that simulates short-time evolution", "abstract": "We find the ground-state energy of the Ising model using the Cascaded Variational Quantum Eigensolver (CVQE) algorithm with the Guided-Sampling Ansatz (GSA) using up to 63 qubits on a quantum computer. We study a heavy-hex lattice to match the qubit architecture, allowing us to perform calculations in the quantum utility regime. We study both a homogeneous and random-coupling model. We locate the boundary of acceptable quantum errors as a function of the number of qubits and coupling strength. An entropic analysis is performed giving insights into the quantum computing performance. A subspace analysis is performed that suggests that the Ising model is especially suited for near-term quantum computing.", "url": "https://arxiv.org/abs/2604.25715", "type": "理论+数值", "summary": "1. 该工作采用级联变分量子本征求解器结合引导采样拟设，在最多63量子比特的量子计算机上计算了重六角晶格Ising模型的基态能量。\n2. 技术关键在于利用与量子处理器架构匹配的晶格实现量子效用区计算，并确定了可容忍量子误差边界随量子比特数和耦合强度的变化。\n3. 熵分析与子空间分析表明，Ising模型特别适合近期含噪声量子计算，为在中等规模量子设备上开展实用计算提供了依据。", "summary_source": "deepseek", "authors": [{"name": "John P. T. Stenger"}, {"name": "C. Stephen Hellberg"}, {"name": "Daniel Gunlycke"}], "featured_authors": [{"name": "John P. T. Stenger"}, {"name": "C. Stephen Hellberg"}, {"name": "Daniel Gunlycke"}], "author_count": 3}, {"id": "2604.25790", "category": "quant-ph", "title": "The mixed-dimensional quantum MacWilliams identity: bounds for codes and absolutely maximally entangled states in heterogeneous systems", "abstract": "As emerging quantum architectures evolve into heterogeneous networks combining different physical substrates, such as qubits for logic and higher-dimensional qudits for robust communication, the traditional scalar metrics of quantum error correction become insufficient. To address this, we introduce a mathematical framework based on dimension multisets to characterize quantum error-correcting codes (QECC) and absolutely maximally entangled (AME) states in mixed-dimensional Hilbert spaces. By replacing scalar weights with multisets, we accurately capture the exact physical composition of error supports across these diverse systems. Our central result is the mixed-dimensional quantum MacWilliams identity, which establishes the formal algebraic relationship between Shor-Laflamme enumerators and unitary weight enumerators. From this foundation, we deduce the mixed-dimensional shadow identity and derive rigorous, generalized constraints on code parameters, explicitly formulating the mixed-dimensional quantum Hamming, Singleton and Scott bounds, and developing a linear program to systematically evaluate code viability. For the Singleton bound, a tighter bound that has no homogeneous analogue is derived for pure mixed-dimensional codes. Finally, we deploy this enumerator machinery to thoroughly analyze AME states, utilizing shadow inequalities to constrain their existence and introducing a combinatorial grid method for the explicit construction of mixed-dimensional tripartite AME states.", "url": "https://arxiv.org/abs/2604.25790", "type": "理论+数值", "summary": "1. 该工作针对异构量子网络中的混合维度希尔伯特空间，引入基于维度多重集的数学框架，建立量子纠错码与绝对最大纠缠态的统一描述。\n2. 核心贡献在于推导混合维度量子MacWilliams恒等式，形式化关联Shor-Laflamme枚举子与酉权重枚举子，并导出比均匀情形更紧的纯码Singleton界等广义约束。\n3. 该框架支持线性规划系统评估码参数可行性，并为多分部混合维度绝对最大纠缠态的显式构造提供了组合网格方法。", "summary_source": "deepseek", "authors": [{"name": "David González-Lociga"}, {"name": "Simeon Ball"}], "featured_authors": [{"name": "David González-Lociga"}, {"name": "Simeon Ball"}], "author_count": 2}, {"id": "2604.25801", "category": "quant-ph", "title": "Pseudo-Hermiticity of the Nakajima-Zwanzig Projected Liouvillian in the Jaynes-Cummings Model", "abstract": "The Nakajima-Zwanzig projected Liouvillian QLQ, the generator of the exact memory kernel in open quantum dynamics, is manifestly non-Hermitian yet has been reported to possess a purely real spectrum in the Jaynes-Cummings model -- an anomaly unexplained since observation. We resolve this anomaly by showing that QLQ is pseudo-Hermitian in the Mostafazadeh sense: a positive-definite metric eta>0 exists such that (QLQ)^dag eta = eta (QLQ), forcing the spectrum to be real. The pseudo-Hermiticity is genuine: the Delta N = 0 and Delta N = +/-2 sectors are individually non-Hermitian (residuals 1.70 and 5.06, respectively), yet the global spectrum is protected by eta. The metric survives the bath-truncation limit (N_max = 3--20, matrix dimension up to 1764 x 1764) with intertwining residual <10^{-11}. A continuous deformation to the full Rabi model reveals a re-entrant pseudo-Hermitian phase with two exceptional-point boundaries, in which the metric condition number diverges. The result supplies a structural reason for Hardy-space analyticity of the memory kernel in the canonical quantum-optical model.", "url": "https://arxiv.org/abs/2604.25801", "type": "理论", "summary": "1. 该工作通过证明Jaynes-Cummings模型中Nakajima-Zwanzig投影Liouvillian的Mostafazadeh伪厄米性，解析了其谱实性异常的物理根源。\n2. 尽管ΔN=0与±2扇区单独非厄米且残差分别达1.70和5.06，正定度量η的存在强制全局谱为实，该度量在浴截断至1764维下交织残差低于10^{-11}，且连续形变至Rabi模型时呈现具有异常点边界的重入伪厄米相。\n3. 这一结构结果为规范量子光学模型中记忆核的Hardy空间解析性提供了实质依据，并为开放系统非厄米谱约束分析开辟了路径。", "summary_source": "deepseek", "authors": [{"name": "Kejun Liu"}], "featured_authors": [{"name": "Kejun Liu"}], "author_count": 1}, {"id": "2604.25825", "category": "quant-ph", "title": "A Quantum Spectral Framework for Solving PDEs", "abstract": "Partial differential equations (PDEs) are fundamental across numerous scientific fields. As these problems scale to high dimensions, classical numerical schemes introduce severe computational bottlenecks, known as the curse of dimensionality. Attempts to solve this problem typically rely on either classical sparsity and low-rank decompositions, or neural network surrogate models. On the other hand, Quantum Computing offers a promising alternative, as it allows us to operate in significantly larger spaces while demanding far fewer resources. In this work, we present a quantum subroutine to solve second-order linear PDEs by exploiting the structural properties of the filter in Fourier space using Quantum Block Encoding (QBE) with quantum reversible arithmetic. This approach serves as a specialized alternative to standard quantum matrix inversion, which typically relies solely on Quantum Singular Value Transformation (QSVT) without exploiting the inherent structural properties of the matrix. We validate the proposed methodology against its classical counterpart to prove its correctness. This framework provides a foundation for extending these methods toward quantum group Fourier transforms, wavelet-based analysis, and equivariant quantum neural networks (EQNNs), offering a promising path toward solving broader classes of problems, including nonlinear PDEs.", "url": "https://arxiv.org/abs/2604.25825", "type": "理论+数值", "summary": "1. 该工作提出了基于量子谱方法的量子子程序框架，利用量子块编码与量子可逆算术在傅里叶空间中高效求解二阶线性偏微分方程，以突破高维经典计算的维度灾难。\n2. 其核心优势在于直接利用傅里叶滤波的结构性质作为标准量子矩阵求逆的专门替代，避免了量子奇异值变换的通用开销，显著降低资源需求并验证了正确性。\n3. 该框架为推广至量子群傅里叶变换、小波分析与等变量子神经网络奠定基础，并有望将量子求解范式拓展至非线性偏微分方程等更广问题类。", "summary_source": "deepseek", "authors": [{"name": "Chih-Kang Huang"}, {"name": "Giacomo Antonioli"}, {"name": "Frédéric Barbaresco"}], "featured_authors": [{"name": "Chih-Kang Huang"}, {"name": "Giacomo Antonioli"}, {"name": "Frédéric Barbaresco"}], "author_count": 3}, {"id": "2604.25854", "category": "quant-ph", "title": "Quantum channels preserving sigma-additivity and Ulam measurable cardinals", "abstract": "This paper investigates the interplay between the properties of quantum states on the Hilbert space \\(\\ell_2(\\kappa)\\) and the set-theoretic nature of the cardinal $\\kappa$. We focus on the existence of singular $\\sigma$-additive states~ -- functionals whose induced measures are $\\sigma$-additive yet vanish on singletons. While the existence of such states is known to be equivalent to the Ulam measurability of $\\kappa$, their structural and dynamical properties remain largely unexplored. We prove that any $\\sigma$-additive state on the diagonal algebra is representable as a Pettis integral over a singular $\\sigma$-additive measure, extending the classical representation theory to the non-normal sector. Furthermore, we construct a class of quantum channels using $\\sigma$-complete ultrafilters that map normal states to singular $\\sigma$-additive states, effectively <<archiving>> information into the singular part of the state space.", "url": "https://arxiv.org/abs/2604.25854", "type": "理论", "summary": "1. 该工作探究希尔伯特空间ℓ₂(κ)上量子态性质与基数κ集合论本质的关联，聚焦于奇异σ-可加态的存在性。\n2. 技术核心在于证明对角代数上任意σ-可加态可表示为奇异σ-可加测度的Pettis积分，并利用σ-完全超滤子构造将正规态映射至奇异σ-可加态的量子信道。\n3. 这揭示了量子信道通过奇异态实现信息存档的机制，为非正规态空间的结构与动力学研究开辟了集合论新途径。", "summary_source": "deepseek", "authors": [{"name": "S. V. Dzhenzher"}], "featured_authors": [{"name": "S. V. Dzhenzher"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
