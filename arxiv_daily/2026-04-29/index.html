<head>
  <meta charset="utf-8">

  <title>arXiv 2026-04-29 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2604.24789", "category": "cond-mat", "title": "Conductance fluctuations in random resistor networks with hyperuniform disorder", "abstract": "We study conductance fluctuations in random resistor networks with hyperuniform bond disorder, where the fluctuations of the number of bonds present in a test volume $V$ scale as $V^{-a}$ with $a > 1/2$. Since small changes in the concentration of bonds present in a local region give rise to a proportionate increase in the locally averaged conductance, one may expect that in hyperuniform disorder, conductance fluctuations will also show suppressed fluctuations. We argue that this is not the case: conductance fluctuations scale as $L^{-d/2}$ for a sampling size $L$. We show numerical results for $d=2$.", "url": "https://arxiv.org/abs/2604.24789", "type": "数值", "summary": "1. 该工作研究了含超均匀键无序的随机电阻网络中电导涨落的标度行为。\n2. 其核心发现是尽管键数目涨落被显著抑制（标度指数a>1/2），电导涨落却仍遵循标准扩散标度L^{-d/2}，与直觉预期相悖。\n3. 这揭示了超均匀无序中输运涨落与结构涨落解耦的普遍机制，为相关无序系统的标度理论提供了新约束。", "summary_source": "deepseek", "authors": [{"name": "Bikram Pal"}], "featured_authors": [{"name": "Bikram Pal"}], "author_count": 1}, {"id": "2604.24802", "category": "cond-mat", "title": "Thermoinformational State Construction: Generative Energies, Entropies, and H-Theorem Consistency", "abstract": "We introduce a constructive framework for assigning thermodynamic structure to an arbitrary data system from its measured microstates. Starting from an empirical distribution over configurations, we first infer a data-driven energy function by fitting a Boltzmann-type model to the observed statistics, thereby defining an energy axis that is intrinsic to the system. We then push the empirical distribution onto this energy coordinate and pose an inverse maximum-entropy problem: we learn a strictly concave trace-form entropy functional whose maximizer, under a small set of constraints extracted from the data, reproduces the observed energy-space histogram. With energy and entropy defined in this coupled, system-specific manner, macroscopic variables such as internal energy, an entropy-energy relation S(U), and a thermoinformational temperature T^(-1)= dS/dU follow consistently along admissible families of states. We demonstrate the construction on canonical unimodal and multimodal examples, including a harmonic well (recovering the classical equilibrium limit up to gauge) and a bistable double-well where global-constraint MaxEnt surrogates can obscure barrier and coexistence structure. The resulting formulation provides a principled route from microstate data to thermodynamically consistent macroscopic descriptors, with an optimized entropy matched to the empirical system.", "url": "https://arxiv.org/abs/2604.24802", "type": "理论+数值", "summary": "1. 本文构建了一个从任意数据系统微观态测量出发，通过拟合玻尔兹曼模型定义数据驱动能量函数并求解逆最大熵问题以学习严格凹迹形式熵泛函，从而赋予系统热力学结构的框架。\n2. 其核心卖点在于能量与熵以耦合的系统特定方式定义，使得内能、熵–能量关系及热信息温度沿状态族一致导出，并在单峰与双稳示例中验证了与经典极限的一致性及对全局约束导致势垒模糊的克服。\n3. 该工作为从微观态数据到热力学一致宏观描述提供了有原则的构建路径，并通过H-定理一致性检验确保了框架的动力学合理性，启发复杂系统数据驱动的热力学建模。", "summary_source": "deepseek", "authors": [{"name": "George-Rafael Domenikos"}, {"name": "Lock Yue Chew"}, {"name": "Victoria Leong"}], "featured_authors": [{"name": "George-Rafael Domenikos"}, {"name": "Lock Yue Chew"}, {"name": "Victoria Leong"}], "author_count": 3}, {"id": "2604.24816", "category": "cond-mat", "title": "Trillion-atom molecular dynamics simulations with ab initio accuracy", "abstract": "Material properties are fundamentally dictated by multiscale phenomena, which often reach mesoscale in size. The {\\mu}m mesoscale is also the size which can be observed directly under an optical microscope, bridging the atomistic microscopic description with the continuous model macroscopic world. In this work, we report an unprecedented molecular dynamics (MD) simulation comprising 1.62 trillion atoms. Utilizing the neuroevolution potential (NEP) framework, we attained ab initio accuracy on China's New-generation Intelligent Supercomputer. Our implementation achieves a time-to-solution (s/step/atom) 100 times faster than previous state-of-the-art machine learning force field simulations, and 1,000 times faster than the Gordon Bell Prize-winning application from six years ago. Furthermore, we demonstrate an 86.9% weak scaling efficiency from a single GPGPU to 45,000 GPGPUs. These results redefine atomistic simulation boundaries, enabling direct mesoscopic modeling with quantum-level precision.", "url": "https://arxiv.org/abs/2604.24816", "type": "理论+数值", "summary": "1. 该工作利用神经进化势框架在新一代智能超级计算机上实现了1.62万亿原子的分子动力学模拟，精度达到从头算水平。\n2. 其技术卖点在于每步每原子计算时间相比此前最先进的机器学习力场模拟快100倍，且从单GPU到4.5万GPU的弱扩展效率达86.9%。\n3. 这为直接以量子精度模拟介观尺度材料行为开辟了新途径，重新定义了原子模拟的规模边界。", "summary_source": "deepseek", "authors": [{"name": "Pengfei Suo"}, {"name": "Wudi Cao"}, {"name": "Xingxing Wu"}, {"name": "Wenjie Zhang"}, {"name": "Zheyong Fan"}, {"name": "Shuanghan Xian"}, {"name": "Rui Wang"}, {"name": "Cheng Qian"}, {"name": "Chao Liang"}, {"name": "Qinghong Yuan"}, {"name": "Xiaoshuang Chen"}, {"name": "Pengfei Guan"}, {"name": "Jingde Bu"}, {"name": "Hongzhen Tian"}, {"name": "Yanjing Su"}, {"name": "Feng Ding"}, {"name": "Lin-Wang Wang"}], "featured_authors": [{"name": "Pengfei Suo"}, {"name": "Wudi Cao"}, {"name": "Xingxing Wu"}, {"name": "Yanjing Su"}, {"name": "Feng Ding"}, {"name": "Lin-Wang Wang"}], "author_count": 17}, {"id": "2604.24840", "category": "cond-mat", "title": "Quantum Rotors on the Fuzzy Sphere and the Cubic CFT", "abstract": "The three-dimensional cubic conformal field theory governs the critical behaviour of Heisenberg magnets with cubic anisotropy. Studying this theory non-perturbatively is challenging, because its most easily accessible observables are numerically very close to those of the more symmetric $O(3)$ model. In this work, we overcome this difficulty using the fuzzy sphere regularisation method. By adding a cubic-invariant two-body interaction to the quantum rotor Hamiltonian used for the $O(3)$ model, we break the continuous rotational symmetry by construction and unambiguously isolate the cubic critical point. Using exact diagonalisation and the density matrix renormalisation group, we calculate the scaling dimensions of several key operators, including the leading scalar singlets, and resolve the splitting of the $O(3)$ rank-two traceless symmetric tensor into the $E_g$ and $T_{2g}$ representations of the cubic group. Our results are consistent with existing Monte Carlo, conformal perturbation theory, and $\\varepsilon$ expansion benchmarks, demonstrating the power of the fuzzy sphere in resolving closely spaced universality classes.", "url": "https://arxiv.org/abs/2604.24840", "type": "理论+数值", "summary": "1. 该工作利用模糊球正则化方法，通过添加立方不变两体相互作用打破O(3)对称性，明确隔离并研究了三维立方共形场论的临界点。\n2. 其核心技术卖点在于，在量子转子哈密顿量中精确构造出立方各向异性，从而在数值上分辨O(3)模型与立方CFT本征值谱的近简并，并计算了Eg与T2g表示的标度维度。\n3. 这为在模糊球框架内解决紧密相邻的普适类区分问题提供了明确范例，并可推广至其他具有弱破缺对称性的强关联临界系统。", "summary_source": "deepseek", "authors": [{"name": "Andreas Stergiou"}], "featured_authors": [{"name": "Andreas Stergiou"}], "author_count": 1}, {"id": "2604.24848", "category": "cond-mat", "title": "Magnetic phases of the anisotropic triangular Hubbard model from the ghost-Gutzwiller approximation in the rotating spin-frame", "abstract": "We investigate the magnetic phase diagram of the half-filled Hubbard model on the anisotropic triangular lattice using the Gutzwiller approximation (GA) and its ghost generalization (ghost-GA). By combining a rotating spin-frame formulation with high-resolution momentum grids, we determine magnetic ground states through direct total-energy minimization over the ordering wavevector. We benchmark standard GA and ghost-GA against dynamical mean-field theory (DMFT) and dual-fermion results. We show that GA already captures the qualitative structure of the phase diagram, but systematically overestimates the stability of magnetic order due to the absence of dynamical fluctuations. We find that introducing a small number of auxiliary ''ghost'' orbitals is sufficient to recover most dynamical effects and significantly improves quantitative agreement with DMFT. Exploring the full Brillouin zone, we obtain a phase diagram comprising paramagnetic and various magnetic phases. In contrast to ladder dual-fermion susceptibility-based predictions, we find that the one-dimensional antiferromagnetic phase is never stabilized, despite being the leading instability in certain regimes. Our results establish ghost-GA as an efficient and systematically improvable framework for studying magnetism in frustrated systems, capable of achieving near-DMFT accuracy at a fraction of the computational cost. They also highlight that standard GA performs qualitatively well for capturing the general phase diagram, enabling the investigation of incommensurate magnetic orders in more complex systems.", "url": "https://arxiv.org/abs/2604.24848", "type": "理论+数值", "summary": "1. 该工作采用旋转自旋框架下的鬼戈茨维勒近似，直接通过总能量最小化确定各向异性三角晶格半填充Hubbard模型的磁性基态相图。\n2. 其技术核心是在动量空间精细网格中引入少量辅助鬼轨道以恢复动力学涨落效应，从而以远低于动力学平均场理论的计算成本实现近DMFT精度的定量描述。\n3. 这确立了鬼戈茨维勒近似作为研究阻挫磁体中非公度磁有序的高效且可系统改进的计算框架。", "summary_source": "deepseek", "authors": [{"name": "Azin Kazemi-Moridani"}, {"name": "Samuele Giuli"}, {"name": "Tsung-Han Lee"}, {"name": "A.-M. S. Tremblay"}, {"name": "Michel Côté"}, {"name": "Nicola Lanatà"}, {"name": "Olivier Gingras"}], "featured_authors": [{"name": "Azin Kazemi-Moridani"}, {"name": "Samuele Giuli"}, {"name": "Tsung-Han Lee"}, {"name": "Michel Côté"}, {"name": "Nicola Lanatà"}, {"name": "Olivier Gingras"}], "author_count": 7}, {"id": "2604.24859", "category": "cond-mat", "title": "Dispersion of Anyon Bloch Bands", "abstract": "Fractional Chern insulators (FCIs) are zero magnetic field analogs of fractional quantum Hall states. While the electrons forming an FCI are not subject to an external magnetic field, their anyonic excitations experience a magnetic field with finite-flux due to a many-body Berry phase, whose lattice periodicity generically induces some dispersion. From Laughlin wavefunctions at filling 1/m, we analytically construct single-anyon Bloch states in an ideal band, providing a basis to efficiently compute the dispersion. The anyon spectrum exhibits an $m$-fold degeneracy in the reduced magnetic Brillouin zone (BZ), which originates from the topological degeneracy of the FCI. From our wavefunctions, we derive the m^2-fold degeneracy seen in previous works, showing it to be a splicing of anyon momenta into the electronic BZ. Finally, we find that the anyon dispersion bandwidth is controlled by quantum geometry non-uniformity, growing linearly at weak modulation and saturating at strong modulation. Remarkably, higher harmonics of the quantum geometry alone strongly suppress the dispersion, which we attribute to emergent magnetic translation symmetries. When combined with the first harmonic, a positive (negative) second harmonic drives the system toward a second- (first-) harmonic-dominated regime, thereby reducing (enhancing) the bandwidth. Our results offer an analytically controlled method for evaluating anyon spectra in ideal band FCI, shedding light on how non-uniform quantum geometry and emergent symmetries shape the dispersion of anyons.", "url": "https://arxiv.org/abs/2604.24859", "type": "理论", "summary": "1. 该工作从Laughlin波函数解析构造了填充因子1/m理想能带中的单任意子布洛赫态，并系统计算了其能带色散。\n2. 技术要点在于揭示了任意子谱在约化磁布里渊区中的m重简并源于FCI拓扑简并，且发现带宽由量子几何非均匀性主导，而高次谐波因涌现磁平移对称性显著抑制色散。\n3. 这为理想带FCI中任意子谱的解析调控提供了方法，并阐明非均匀量子几何与对称性如何共同决定任意子输运行为。", "summary_source": "deepseek", "authors": [{"name": "Kishore Iyer"}, {"name": "Andreas Feuerpfeil"}, {"name": "Valentin Crépel"}, {"name": "Nicolas Regnault"}, {"name": "Christophe Mora"}], "featured_authors": [{"name": "Kishore Iyer"}, {"name": "Andreas Feuerpfeil"}, {"name": "Valentin Crépel"}, {"name": "Nicolas Regnault"}, {"name": "Christophe Mora"}], "author_count": 5}, {"id": "2604.24868", "category": "cond-mat", "title": "Dynamical dimer structure factor of the triangular $S=1/2$ Heisenberg antiferromagnet", "abstract": "The dynamical dimer structure factor is an observable probing spin-singlet excitations of quantum magnets distinct from those commonly studied by the spin structure factor. We report the dimer response for the extended spin-$1/2$ antiferromagnetic Heisenberg model on the triangular lattice using large-scale GPU-accelerated matrix-product-state simulations. We investigate the ordered phases with $120^\\circ$ coplanar, collinear stripe, and tetrahedral spin order, as well as candidate quantum spin-liquid (QSL) regimes, comprising an expected gapless $U(1)$ Dirac QSL and a chiral QSL at finite spin-scalar-chirality coupling. In the ordered phases, we find low-energy modes below the onset of the two-magnon continuum illustrating avoided quasiparticle decay. Within the candidate gapless QSL, we observe absolute dispersion minima at momenta of half the Brillouin zone corners, $X\\equiv K/2$, in agreement with field-theory predictions that singlet monopole excitations of the $U(1)$ Dirac spin liquid become gapless at these points. Thus, the high-resolution dynamical dimer response provides support for a $U(1)$ Dirac QSL with singlet monopole excitations.", "url": "https://arxiv.org/abs/2604.24868", "type": "理论+数值", "summary": "1. 该工作通过大规模GPU加速矩阵乘积态模拟，计算了三角晶格扩展自旋1/2海森堡反铁磁体的动态二聚体结构因子。\n2. 在候选U(1) Dirac量子自旋液体中，观察到布里渊区角一半（X≡K/2）处的绝对色散极小值，与场论预言的单极子激发行为一致。\n3. 这为利用二聚体响应探测奇异自旋单态激发提供了可靠途径，并可能推广至其他阻挫磁体的量子自旋液体鉴定。", "summary_source": "deepseek", "authors": [{"name": "Markus Drescher"}, {"name": "Laurens Vanderstraeten"}, {"name": "Roderich Moessner"}, {"name": "Frank Pollmann"}, {"name": "Johannes Knolle"}], "featured_authors": [{"name": "Markus Drescher"}, {"name": "Laurens Vanderstraeten"}, {"name": "Roderich Moessner"}, {"name": "Frank Pollmann"}, {"name": "Johannes Knolle"}], "author_count": 5}, {"id": "2604.24872", "category": "cond-mat", "title": "Anomaly and symmetry-charge flow in mixed states", "abstract": "The $(1+1)$-dimensional chiral anomaly is a paradigmatic exact result in quantum field theory, traditionally formulated for zero-temperature pure states where it arises from spectral flow induced by external gauge fields and captures universal ground-state properties. In mixed states, however, the participation of many states and charge exchange with the environment invalidate this mechanism. Naive extensions yield model-dependent anomaly coefficients, calling its universality into question. Here, we resolve this problem for Abelian symmetries by deriving the anomaly from an algebraic relation between the symmetry and its flux-insertion operator. We obtain symmetry-charge flow, a mixed-state generalization of spectral flow, in which an applied field redistributes statistical weight across symmetry-resolved charge sectors. Fixed solely by symmetry, the anomaly restores universality and applies to both pure and mixed states in fermionic and bosonic systems. We substantiate these results in tight-binding fermionic models with continuous symmetry and in spin models with discrete symmetries.", "url": "https://arxiv.org/abs/2604.24872", "type": "理论+数值", "summary": "1. 该工作从对称性与其通量插入算符的代数关系出发，推导了混合态中阿贝尔对称性的(1+1)维手征反常。\n2. 其核心在于提出对称性电荷流作为光谱流的混合态推广，使得反常仅由对称性固定，恢复普适性并适用于费米子和玻色子系统。\n3. 这为混合态中量子反常的普适刻画提供理论基础，并可直接推广到离散对称性系统与更高维情形。", "summary_source": "deepseek", "authors": [{"name": "Ze-Min Huang"}, {"name": "Sebastian Diehl"}], "featured_authors": [{"name": "Ze-Min Huang"}, {"name": "Sebastian Diehl"}], "author_count": 2}, {"id": "2604.24883", "category": "cond-mat", "title": "Uncovering Exotic Paired States in the 2D Spin-Imbalanced Fermi Gas with Neural Wave Functions", "abstract": "We study the zero-temperature phase diagram of the 2D spin-imbalanced Fermi gas with short-ranged attractive interactions using the recently developed neural network variational Monte Carlo method with the AGPs FermiNet Ansatz. The Fulde-Ferrell-Larkin-Ovchinnikov phase is observed in the weakly interacting BCS limit and a polarised superfluid is seen in the strongly interacting BEC limit. When the interactions are strong, the minority-spin momentum density is reduced almost to zero in the momentum-space region occupied by the unpaired majority-spin electrons. When the interactions are very strong, phase separation occurs, with regions containing bosonic pairs and unpaired regions occupied by the remaining majority-spin particles. In addition, we observe translational symmetry breaking at intermediate interaction strengths, where the system forms an exotic crystal of Cooper pairs in a Fermi fluid of unpaired majority-spin particles. We provide a possible explanation for the formation of the crystalline phase, explain the origins of the k-space momentum-density hole when the pairs are tightly bound, and discuss how our approach opens new directions for future work.", "url": "https://arxiv.org/abs/2604.24883", "type": "理论+数值", "summary": "1. 该工作利用神经网络变分蒙特卡洛方法（AGPs FermiNet）系统计算了二维自旋不平衡费米气体在短程吸引作用下的零温相图。\n2. 其核心发现包括弱耦合BCS极限下的FFLO相、强相互作用BEC极限下的极化超流，以及中间耦合强度下伴随平移对称性破缺的Cooper对晶体相。\n3. 这为理解自旋不平衡超流体系中奇异配对机制与动量空间空穴起源提供了新视角，并展示了神经网络波函数方法在强关联费米子问题中的潜力。", "summary_source": "deepseek", "authors": [{"name": "Wan Tong Lou"}, {"name": "Gino Cassella"}, {"name": "Andres Perez Fadon"}, {"name": "Halvard Sutterud"}, {"name": "David Pfau"}, {"name": "James S. Spencer"}, {"name": "Johannes Knolle"}, {"name": "W.M.C. Foulkes"}], "featured_authors": [{"name": "Wan Tong Lou"}, {"name": "Gino Cassella"}, {"name": "Andres Perez Fadon"}, {"name": "James S. Spencer"}, {"name": "Johannes Knolle"}, {"name": "W.M.C. Foulkes"}], "author_count": 8}, {"id": "2604.24887", "category": "cond-mat", "title": "Symmetry-Protected Topological Phases in the Triangular Majorana-Hubbard Ladder", "abstract": "We map the phase diagram of the triangular-lattice Majorana-Hubbard model on a four-leg ladder using DMRG and variational uniform matrix product states, revealing a richer variety of phases than previously known. Analysis of entanglement-spectrum degeneracies and adiabatic connections identifies multiple symmetry-protected topological (SPT) phases. These phases could be realized in arrays of vortex-bound Majorana modes on the surface of a topological superconductor.", "url": "https://arxiv.org/abs/2604.24887", "type": "理论+数值", "summary": "1. 该工作利用DMRG与变分均匀矩阵乘积态，系统绘制了四腿三角晶格Majorana-Hubbard模型的相图。\n2. 通过纠缠谱简并性与绝热连接分析，识别出多个对称保护拓扑相，揭示了比先前认知更丰富的相结构。\n3. 这些SPT相有望在拓扑超导体表面涡旋束缚Majorana模阵列中实现，为相关量子模拟提供可行平台。", "summary_source": "deepseek", "authors": [{"name": "Will Holdhusen"}, {"name": "Alberto Nocera"}, {"name": "Jian-Xin Zhu"}, {"name": "Armin Rahmani"}], "featured_authors": [{"name": "Will Holdhusen"}, {"name": "Alberto Nocera"}, {"name": "Jian-Xin Zhu"}, {"name": "Armin Rahmani"}], "author_count": 4}, {"id": "2604.24917", "category": "cond-mat", "title": "Theory of Anderson localization on the hyperbolic plane", "abstract": "The two-dimensional hyperbolic plane, $\\mathbb{H}^2$, is an unusual system in that dimensionality changes with scale: locally two-dimensional and planar at short distances, but effectively infinite-dimensional at large scales, it provides an interesting paradigm for the study of (quantum) phase transitions, notably the disorder-driven Anderson transition. Generalizing previous work, which treated short and large distance scales separately, we develop a unified framework interpolating between the principles of low- and high-dimensional Anderson localization. As a main result, we derive a two-parameter flow in a plane spanned by scale-dependent curvature (setting the system's effective dimensionality) and conductivity, with an extended critical line separating metallic and insulating phases.", "url": "https://arxiv.org/abs/2604.24917", "type": "理论", "summary": "1. 该工作建立统一理论框架，将二维双曲面上安德森局域化的短程平面性与大尺度高维性无缝衔接。\n2. 其技术核心在于推导出由尺度依赖曲率与电导率张成的双参数重整化流方程，揭示扩展临界线分隔金属与绝缘相。\n3. 这为理解有效维度随尺度演变的无序诱导量子相变提供了可解析处理的范例，并启发对负曲率空间局域化行为的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Alexander Altland"}, {"name": "Tobias Micklitz"}, {"name": "Devasheesh Sharma"}, {"name": "Maksimilian Usoltcev"}, {"name": "Carolin Wille"}], "featured_authors": [{"name": "Alexander Altland"}, {"name": "Tobias Micklitz"}, {"name": "Devasheesh Sharma"}, {"name": "Maksimilian Usoltcev"}, {"name": "Carolin Wille"}], "author_count": 5}, {"id": "2604.24948", "category": "cond-mat", "title": "On the Mathematics of Information-Thermodynamics", "abstract": "We present a validation of the asdf method, an information-theoretic framework for computing thermodynamic entropy from molecular configurations. The method reformulates entropy estimation as the Shannon entropy of a residual mapping distribution defined between two decorrelated microstates. We demonstrate analytically that for the closed-form Hamiltonians with known solutions, the classical ideal gas and the one-dimensional harmonic oscillator's entropy obtained from the compressibility of the residual mapping object reproduces the exact thermodynamic entropy. In each case, the conditional entropy of the residual mapping object with respect to an uncorrelated microstate is shown to coincide with the ensemble entropy derived from the canonical partition function. These results establish consistency between the asdf formalism and classical statistical mechanics for analytically solvable systems. We further discuss how the framework generalizes to interacting Hamiltonians. The analysis supports the interpretation of thermodynamic entropy as an information measure encoded geometrically in inter-microstate mappings and motivates application of the method to complex condensed phases.", "url": "https://arxiv.org/abs/2604.24948", "type": "理论", "summary": "1. 该工作从数学上验证了asdf方法，将分子构型热力学熵的计算重构为去相关微观态间残差映射分布的香农熵。\n2. 其核心在于对经典理想气体与一维谐振子解析证明，残差映射对象压缩性导出熵与正则配分函数熵严格一致。\n3. 这为将框架推广至相互作用哈密顿系统提供了理论基础，并启发了复杂凝聚相中熵的几何信息解释与计算。", "summary_source": "deepseek", "authors": [{"name": "Dallin Fisher"}, {"name": "Qi-Jun Hong"}], "featured_authors": [{"name": "Dallin Fisher"}, {"name": "Qi-Jun Hong"}], "author_count": 2}, {"id": "2604.25060", "category": "cond-mat", "title": "Statistical mechanics in continuous space with tensor network methods", "abstract": "Tensor network (TN) methods are well established for computing partition functions in statistical mechanics, though this use has traditionally been limited to lattice models. We extend the scope of TN methodology to interacting particle systems in continuous space. Through a real-space discretization combined with a cell-based coarse-graining scheme, we formulate an effective lattice model that explicitly preserves spatial locality. The partition function of this model is represented as a TN, and the thermodynamic quantities are computed via boundary contraction. We apply this framework to the two-dimensional hard-disk problem and demonstrate the strengths of the TN formulation compared to existing Monte Carlo simulations.", "url": "https://arxiv.org/abs/2604.25060", "type": "理论+数值", "summary": "1. 本文通过实空间离散化与单元粗粒化，将张量网络方法拓展至连续空间粒子系统的统计力学计算。\n2. 其技术内核在于构造保持空间局域性的有效格点模型，并利用边界收缩高效求解配分函数。\n3. 该方法为二维硬球系统等连续模型提供了超越蒙特卡洛模拟精度与效率的新计算范式。", "summary_source": "deepseek", "authors": [{"name": "Gunhee Park"}, {"name": "Tomislav Begušić"}, {"name": "Si-Jing Du"}, {"name": "Johnnie Gray"}, {"name": "Garnet Kin-Lic Chan"}], "featured_authors": [{"name": "Gunhee Park"}, {"name": "Tomislav Begušić"}, {"name": "Si-Jing Du"}, {"name": "Johnnie Gray"}, {"name": "Garnet Kin-Lic Chan"}], "author_count": 5}, {"id": "2604.25075", "category": "cond-mat", "title": "Influence of Heterogeneity on the Response of Architected Metamaterials", "abstract": "Architected metamaterials like foams and lattices exhibit complex responses governed by microstructural instabilities, localization, and phase-transition-like phenomena. Their behavior is further affected by heterogeneities inherent in their microstructure often caused through manufacturing processes. In this study we extend a gradient-enhanced, nonlocal continuum formulation to incorporate stochastic material heterogeneity through Gaussian random fields imposed on selected constitutive parameters. The framework enables independent control of both the amplitude and spatial correlation of material fluctuations while preserving thermodynamic consistency and regularization of localization. It also introduces a characteristic lengthscale ratio between the nonlocal and correlation lengthscales, that enables modeling at the limit of random or spatially correlated microstructures. Finite element simulations of confined compression and indentation show that heterogeneity fundamentally alters phase nucleation, localization morphology, and macroscopic response. Overall, the proposed framework provides a unified approach for linking stochastic material variability to instability-driven mechanics in architected metamaterials, enabling improved understanding of imperfection sensitivity, stability and design. It showcases how heterogeneity alone can influence characteristic features of the response, such as stability, slope of the plateau region, and elimination of the initial elastic regime.", "url": "https://arxiv.org/abs/2604.25075", "type": "理论+数值", "summary": "1. 该工作将梯度增强非局部连续体框架拓展至含高斯随机场的随机材料异质性，用于研究构造超材料在约束压缩与压痕下的失稳响应。\n2. 其核心在于引入非局部与关联长度尺度比，独立控制材料涨落幅度与空间相关性，并保持热力学一致性与局部化正则化。\n3. 这为揭示异质性单独主导的相成核、局部化形貌及宏观响应特征（如稳定性和平台区斜率）提供了统一框架，有助于理解缺陷敏感性与设计优化。", "summary_source": "deepseek", "authors": [{"name": "Sarvesh Joshi"}, {"name": "Jingye Tan"}, {"name": "Craig M. Hamel"}, {"name": "Stavros Gaitanaros"}, {"name": "Nikolaos Bouklas"}], "featured_authors": [{"name": "Sarvesh Joshi"}, {"name": "Jingye Tan"}, {"name": "Craig M. Hamel"}, {"name": "Stavros Gaitanaros"}, {"name": "Nikolaos Bouklas"}], "author_count": 5}, {"id": "2604.25093", "category": "cond-mat", "title": "Ultrafast Energy Absorption in Silicon Controlled by Two-Color Double Pulses", "abstract": "We theoretically show that energy absorption in crystalline silicon can be controlled by two-color femtosecond double-pulse irradiation, in which two temporally separated pulses with different wavelengths interact sequentially with the system. Using time-dependent density functional theory, we systematically examine the wavelength and intensity dependence of the absorbed energy over peak intensities of $2\\times10^{11}$-$10^{13}$ W/cm$^2$ and wavelengths of 515, 1030, and 2060 nm. We find that the mechanism governing energy absorption and the optimal wavelength combination strongly depend on the intensity regime. In the low-intensity regime, multiphoton interband absorption is dominant, and energy absorption is enhanced for pulse pairs composed of shorter wavelengths. In contrast, in the high-intensity regime, the contributions of tunneling ionization and intraband acceleration become significant, leading to enhanced absorption for longer-wavelength combinations. In the intermediate-intensity regime, a pronounced enhancement is observed when a short-wavelength pulse precedes a long-wavelength pulse. Our analysis reveals that the nonequilibrium electronic state prepared by the first pulse modifies the excitation process induced by the second pulse, thereby enhancing the absorbed energy through an increased energy gain per excited electron. In this regime, the energy absorption is governed not only by the number of excited carriers but also by the energy gain per excited electron, which can be strongly modified by the pulse sequence. These results indicate that ultrafast energy transfer in semiconductors is tunable by appropriately designing the wavelength and intensity combination of the two pulses, and provide microscopic insight into two-color strong-field excitation.", "url": "https://arxiv.org/abs/2604.25093", "type": "理论+数值", "summary": "1. 该工作利用含时密度泛函理论，理论上展示了通过双色飞秒双脉冲辐照可控制晶体硅中的超快能量吸收。\n2. 其核心在于揭示了不同强度区间的主导机制：低强度下多光子带间吸收占优，高强度下隧穿电离与带内加速显著，而中等强度下短波长前置脉冲通过增大每个激发电子的能量增益来增强吸收。\n3. 这为通过设计双脉冲的波长与强度组合来调控半导体中超快能量转移提供了微观基础，并启发了对双色强场激发过程的深入理解。", "summary_source": "deepseek", "authors": [{"name": "Eiyu S. Gushiken"}, {"name": "Mizuki Tani"}, {"name": "Hiroki Katow"}, {"name": "Kenichi L. Ishikawa"}], "featured_authors": [{"name": "Eiyu S. Gushiken"}, {"name": "Mizuki Tani"}, {"name": "Hiroki Katow"}, {"name": "Kenichi L. Ishikawa"}], "author_count": 4}, {"id": "2604.25095", "category": "cond-mat", "title": "Markovian thermodynamics of non-Markovian Langevin equations", "abstract": "We develop the thermodynamics of non-Markovian generalized Langevin equations by embedding them in a high-dimensional Markovian representation involving auxiliary degrees of freedom. If the memory is linear and satisfies detailed balance with the noise, we provide an explicit construction of the embedding for non-Markovian dynamics with many degrees of freedom and hydrodynamic interactions. Moreover, while the embedding is generally not unique, we show that it results in unique values of thermodynamic quantities of the Markovian system. This allows us to define the Markovian entropy production of a non-Markovian system, which, in contrast to the definition based directly on the non-Markovian dynamics, is guaranteed to increase monotonically with time. Moreover, the Markovian representation allows us to identify the apparent decrease in the non-Markovian entropy with heat and information exchange between the system and the auxiliary degrees of freedom.", "url": "https://arxiv.org/abs/2604.25095", "type": "理论", "summary": "1. 该工作通过将非马尔可夫广义朗之万方程嵌入含辅助自由度高维马尔可夫表示，发展了其热力学形式。\n2. 其核心在于利用记忆核与噪声的细致平衡条件实现显式嵌入，并证明即使嵌入不唯一，热力学量仍唯一确定，从而定义出严格单调递增的马尔可夫熵产生。\n3. 这为解析非马尔可夫系统中熵视在减少与热、信息交换的物理图像，以及拓展其涨落定理和热力学框架提供了清晰路径。", "summary_source": "deepseek", "authors": [{"name": "Andreas Dechant"}, {"name": "Kiyoshi Kanazawa"}], "featured_authors": [{"name": "Andreas Dechant"}, {"name": "Kiyoshi Kanazawa"}], "author_count": 2}, {"id": "2604.25125", "category": "cond-mat", "title": "Identifying strong correlation using only the Kohn-Sham density of one-electron states", "abstract": "Strongly correlated systems have long been a central and highly non-trivial topic in condensed matter physics. At the non-interacting level, strong correlation can be associated with powerful (near) degeneracies between occupied and unoccupied states, which leads to a high density of states near the Fermi level in metallic configurations. Such regimes are commonly treated with beyond-density functional theory (DFT) approaches, such as DFT+U or DFT+DMFT while maintaining symmetric configurations. Here, we explore the hypothesis that symmetry breaking in the Kohn-Sham (KS) non-interacting system can qualitatively account for the energetic effects of strong correlation in the corresponding interacting system within standard DFT. By lifting near-degeneracies around the Fermi level, symmetry breaking diminishes the potential correlation effects, reducing the need for an explicit treatment of electron correlation, transforming an otherwise strongly correlated symmetric configuration into a normally correlated one, thus avoiding the need for interacting methods beyond DFT. This naturally connects nonmagnetic to magnetic states. We apply this idea to both strongly and normally correlated metals and observe that spin symmetry breaking leads to a pronounced reduction of the density of states at the Fermi level and a significant lowering of the total energy in strongly correlated cases. To describe the degree of correlation that the interacting system would have relative to the KS state, we introduce a correlation parameter ($\\Gamma$), defined as the ratio between the Kohn-Sham density of one-electron states at the Fermi level and that of a corresponding uniform electron gas. This parameter distinguishes strongly correlated systems, which would require explicit treatment, from normally correlated ones, which do not.", "url": "https://arxiv.org/abs/2604.25125", "type": "理论+数值", "summary": "1. 该工作提出仅利用Kohn-Sham单电子态密度在费米能级处的比值定义关联参数Γ，以区分强关联与正常关联金属。\n2. 其核心在于发现自旋对称性破缺通过提升费米面附近近简并，显著降低态密度并降低总能，从而将强关联问题转化为正常关联，避免超越DFT的显式关联处理。\n3. 这为在标准DFT框架内识别和简化强关联电子系统提供了明确的定量判据，有望拓展其应用范围。", "summary_source": "deepseek", "authors": [{"name": "Daniel D. Rivera"}, {"name": "Gustavo M. Dalpian"}, {"name": "John P. Perdew"}], "featured_authors": [{"name": "Daniel D. Rivera"}, {"name": "Gustavo M. Dalpian"}, {"name": "John P. Perdew"}], "author_count": 3}, {"id": "2604.25169", "category": "cond-mat", "title": "Nonlocal Cooper pairs in finite topological superconductors and their relation to Majorana nonlocality", "abstract": "We identify two fundamental properties of the Gor'kov Green's function of finite one-dimensional topological superconductors. In the low-frequency (low-energy) regime, the normal and anomalous Green's functions, which describe single-particle and Cooper-pair correlations, respectively, become identical up to a phase factor. Moreover, they exhibit pronounced nonlocality: correlations between the two ends of the system grow exponentially with system length, whereas local correlations at either end vanish in the zero-frequency limit. These striking features signify the emergence of unconventional nonlocal Cooper pairs associated with a nonlocal fermionic mode composed of hybridized Majorana end modes. The nonlocal Cooper pairs are directly linked to fermion parity and to the nonlocal transport properties of finite topological superconductors. By focusing on pair correlations, our analysis advances the understanding of Majorana nonlocality, a key concept in topological quantum computation.", "url": "https://arxiv.org/abs/2604.25169", "type": "理论", "summary": "1. 该文识别了有限一维拓扑超导体中Gor'kov格林函数的两个低频基本性质。\n2. 主要卖点是发现低频下正常与反常格林函数除相位因子外相同，且两端非局域关联随长度指数增长而局域关联消失。\n3. 这揭示了由杂化马约拉纳端模形成的非局域库珀对与费米子宇称及非局域输运的直接联系。", "summary_source": "deepseek", "authors": [{"name": "Hiroto Mizoguchi"}, {"name": "Yutaro Nagae"}, {"name": "Yasuhiro Asano"}, {"name": "Satoshi Ikegaya"}], "featured_authors": [{"name": "Hiroto Mizoguchi"}, {"name": "Yutaro Nagae"}, {"name": "Yasuhiro Asano"}, {"name": "Satoshi Ikegaya"}], "author_count": 4}, {"id": "2604.25245", "category": "cond-mat", "title": "Hierarchy of entropy production and thermodynamic trade-off relations in non-Markovian systems", "abstract": "Non-Markovian dynamics arise when a system is coupled to a bath with finite correlation time, giving rise to memory effects that allow the bath to temporarily store and return excitations. However, how memory modifies irreversibility and whether it can be exploited to improve thermodynamic performance is not well established. We address this question by employing a Markovian embedding of generalized Langevin dynamics, in which bath memory is encoded in auxiliary modes and irreversible dissipation in a residual Markovian bath. Here we show that the entropy production defined for the original non-Markovian system upper bounds that of the embedded system, thereby establishing a hierarchy of entropy production under Markovian embedding. Leveraging this hierarchy, we derive non-Markovian extensions of the thermodynamic uncertainty relation, speed limit, and power-efficiency trade-off. For underdamed generalized Langevin systems, sufficiently structured baths allow finite heat currents at vanishingly small entropy production, whereas Carnot efficiency at finite power remains unattainable for ordinary spectral densities. In the overdamped regime, memory effects can simultaneously reduce entropy production and current fluctuations, thereby enhancing the precision-to-dissipation ratio. We further discuss the extension of the hierarchy to generic bath models and the quantum regime. These results provide a quantitative framework for exploiting memory as a thermodynamic resource and for designing energy-efficient protocols in structured environments.", "url": "https://arxiv.org/abs/2604.25245", "type": "理论", "summary": "1. 该工作通过马尔可夫嵌入方法，建立了非马尔可夫系统中熵产生的层级结构，证明原系统熵产生上界于嵌入系统。\n2. 其技术卖点在于利用此层级导出非马尔可夫热力学不确定关系、速度极限和功率-效率权衡，揭示记忆可降低熵产并抑制涨落。\n3. 这为将记忆作为热力学资源设计高效协议提供了定量框架，并指向在结构化环境中实现低熵产有限热流与过阻尼下精密-耗散比提升。", "summary_source": "deepseek", "authors": [{"name": "Ken Funo"}, {"name": "Tan Van Vu"}, {"name": "Keiji Saito"}], "featured_authors": [{"name": "Ken Funo"}, {"name": "Tan Van Vu"}, {"name": "Keiji Saito"}], "author_count": 3}, {"id": "2604.25248", "category": "cond-mat", "title": "Anomalous Mixed-State Floquet Topology in One-Dimensional Open Quantum Systems", "abstract": "We investigate the non-equilibrium topology of a periodically driven, dissipative Su-Schrieffer-Heeger chain using the ensemble geometric phase (EGP) $\\phi_{\\mathrm{EGP}}$-a generalisation of the Zak phase to open quantum systems. In contrast to earlier work, we use Floquet-Born-Markov theory to describe the coupling to thermal reservoirs microscopically. We show that the steady state can be characterised by a Hermitian purity spectrum, providing a direct analogue of band topology for mixed states. The periodic drive induces nontrivial winding and a quasienergy spectrum with distinct $0$ and $\\pi$ band gaps, with protected edge modes in each gap. We identify a pair of topological invariants $(\\phi^{0}_{\\mathrm{EGP}}, \\Delta \\phi^{\\pi}_{\\mathrm{EGP}})$, revealing a structure consistent with a $\\mathbb{Z}\\times\\mathbb{Z}$ classification known from isolated Floquet SSH systems, and show how it extends to a dissipative, finite-temperature setting in regimes where the steady-state structure remains well defined. Our results demonstrate when and how known Floquet topology survives in a driven-dissipative Gaussian steady state and establish Floquet topology as a robust concept beyond isolated zero-temperature systems. The underlying formalism provides a general framework for quadratic fermionic systems with linear bath couplings.", "url": "https://arxiv.org/abs/2604.25248", "type": "理论", "summary": "1. 该工作利用系综几何相位和厄米纯度谱，研究了一维驱动-耗散SSH链稳态中的反常Floquet拓扑。\n2. 其核心在于将孤立系统中的Z×Z拓扑分类推广至有限温度开放量子系统，并证明0和π带隙边缘模在混合态中依然受保护。\n3. 该形式主义为二次费米子系统与线性库耦合提供了统一框架，表明Floquet拓扑在耗散条件下具有鲁棒性。", "summary_source": "deepseek", "authors": [{"name": "Görkem D. Dinc"}, {"name": "Alexander Schnell"}, {"name": "Andy M. Martin"}], "featured_authors": [{"name": "Görkem D. Dinc"}, {"name": "Alexander Schnell"}, {"name": "Andy M. Martin"}], "author_count": 3}, {"id": "2604.25262", "category": "cond-mat", "title": "Benchmarking Universal Machine-Learned Interatomic Potentials for High-Temperature Metal-Organic Framework Chemistry", "abstract": "Universal machine-learned interatomic potentials (uMLIPs) offer a promising approach to performing atomistic simulations at near-DFT accuracy with greatly reduced computational cost. Here, we present a new high-temperature benchmarking dataset of 40~ps ab~initio molecular dynamics (AIMD) trajectories simulated at 300, 1000, and 2000 K for nine zinc- and zirconium-based metal-organic frameworks (MOFs): ZIF-8, CALF-20, MOF-10, MOF-5, MIP-206, UiO-66, UiO-67, UiO-66-NH2, and NU-1000. These trajectories capture equilibrium dynamics, thermally induced distortions, and early-stage decomposition events, including linker degradation and metal node aggregation. Subsequently, we use this dataset to benchmark five leading uMLIPs: ORB-v3, MACE-MP-0a, MACE-MPA-0, fairchem ODAC23, and fairchem OMAT. Our results reveal that ORB-v3 and fairchem OMAT achieve the lowest energy, force, and stress errors across all temperatures. However, all models exhibit significant error under high-temperature conditions. Long-timescale molecular dynamics simulations produced with ORB-v3 demonstrate that the generative error of uMLIPs far exceeds model losses captured during static validation, highlighting the limitations of current universal models for simulating high-temperature MOF dynamics. This work provides a benchmark for assessing the robustness of uMLIPs in extreme regimes and guides future development of potentials capable of accurately modeling the chemistry of high-temperature MOF dynamics.", "url": "https://arxiv.org/abs/2604.25262", "type": "理论+数值", "summary": "1. 该工作构建了涵盖九种锌/锆基金属有机框架在300至2000K温度区间的40皮秒从头算分子动力学轨迹基准数据集，并系统评估了五种通用机器学习原子间势函数的性能。\n2. 研究表明ORB-v3与fairchem OMAT在能量、力与应力误差上表现最优，然而所有模型在高温下误差显著膨胀，且长时模拟中生成误差远超静态验证损失。\n3. 该基准凸显了当前通用势函数在模拟高温MOF动力学与分解化学中的根本性局限，为开发能准确描述极端条件下材料行为的势函数提供了明确指引。", "summary_source": "deepseek", "authors": [{"name": "Connor W. Edwards"}, {"name": "Jack D. Evans"}], "featured_authors": [{"name": "Connor W. Edwards"}, {"name": "Jack D. Evans"}], "author_count": 2}, {"id": "2604.25302", "category": "cond-mat", "title": "Moving Cooling Source Induced Phase Separation in Binary Liquids: an interplay of competing velocities", "abstract": "We investigate phase separation dynamics in a binary mixture subjected to a moving cooling source from which cold temperature fronts propagate radially outward into the mixture. The motion of the source introduces two distinct velocity scales: $v_s$ associated with the translation of the source, and $v$ related to the propagation of the cooling thermal fronts. Competition between the two velocities determines how long a region of the fluid experiences a temperature change, which directly controls phase separation. A modified Cahn Hilliard Cook framework is employed, incorporating explicit coupling between the time-dependent temperature and concentration fields. Our numerical simulation results reveal that the evolving patterns and kinetics strongly depend on both the ratio and absolute magnitudes of these two competing velocities. Same value of $v_s/v$ yields distinctly different patterns for different $v$. The temperature profile delineating spatial regions with local temperatures above and below the demixing temperature controls the shape of the patterns formed. The rich parameter space enables one to engineer desired pattern structures by tuning the two velocities.", "url": "https://arxiv.org/abs/2604.25302", "type": "数值", "summary": "1. 该工作研究了移动冷却源下二元混合物中由源平移速度与热前沿传播速度竞争驱动的相分离动力学。\n2. 其核心在于揭示相同速度比值下不同绝对速度导致迥异相分离模式，且温度廓线直接控制图案形状。\n3. 这为通过调节两种速度参数工程化设计相分离图案结构提供了明确的调控思路。", "summary_source": "deepseek", "authors": [{"name": "Lakshmipriya K"}, {"name": "Harssh Karn"}, {"name": "Sutapa Roy"}], "featured_authors": [{"name": "Lakshmipriya K"}, {"name": "Harssh Karn"}, {"name": "Sutapa Roy"}], "author_count": 3}, {"id": "2604.25328", "category": "cond-mat", "title": "Microscopic Theory of Chiral-Phonon-Induced Orbital Selectivity in Helical Crystals", "abstract": "We present a microscopic theory of chirality-induced orbital selectivity (CIOS) in helical crystals, in which truly chiral phonons selectively transfer angular momentum to electronic orbital degrees of freedom. For a threefold helical crystal with line-group symmetry $L3_1$, we show that phonon-induced local rotations generate a rotational electron--phonon interaction proportional to $\\hat{L}^{\\pm}$, which drives the orbital transfer $m_{\\ell}\\to m_{\\ell}-m_{s}$ in accordance with crystal angular momentum (CAM) conservation, where $m_{s}=\\pm 1$ denotes the eigenvalue of the phonon rotational mode. Evaluating $\\langle\\hat{L}^{z}\\rangle$ to leading order in perturbation theory, we find that the orbital response is suppressed near the $\\Gamma$ point and the BZ boundary, and enhanced at intermediate wave vectors -- a feature intimately tied to the degeneracy structure of the phonon bands.", "url": "https://arxiv.org/abs/2604.25328", "type": "理论", "summary": "1. 该工作构建了螺旋晶体中手性声子诱导轨道选择性(CIOS)的微观理论，基于线群对称性L3_1三重螺旋模型。\n2. 核心揭示了旋转电子-声子耦合项\\hat{L}^{\\pm}驱动轨道量子数按晶体角动量守恒转移，且轨道响应在中间波矢增强源于声子带简并结构。\n3. 这为在手性晶格中通过声子调控轨道极化和设计手性功能物态提供了可验证的微扰理论框架。", "summary_source": "deepseek", "authors": [{"name": "Tomomi Tateishi"}, {"name": "Akihito Kato"}, {"name": "Alexander S. Ovchinnikov"}, {"name": "Jun-ichiro Kishine"}], "featured_authors": [{"name": "Tomomi Tateishi"}, {"name": "Akihito Kato"}, {"name": "Alexander S. Ovchinnikov"}, {"name": "Jun-ichiro Kishine"}], "author_count": 4}, {"id": "2604.25343", "category": "cond-mat", "title": "Proximity Ferroelectricity Driven by Mobile High-Miller-Index Domain Walls", "abstract": "Wurtzite ferroelectrics such as scandium-doped aluminum nitride (AlScN) are promising for next-generation memory because of their compatibility with semiconductor processes and strong spontaneous polarization. Ferroelectric switching in these materials is typically attributed to doping-induced softening of the bulk switching barrier. However, recent reports of proximity ferroelectricity, in which undoped AlN layers up to 500 nm thick fully switch in AlN/AlScN multilayers, challenge this view. Here, we reveal an alternative switching mechanism mediated by high-Miller-index domain walls, long overlooked due to their complex geometry and presumed instability. Using first-principles calculations and machine-learning molecular dynamics simulations, we show that these walls, once nucleated, migrate with exceptionally low barriers. The Sc dopants play a dual role: they stabilize high-index walls and thereby promote nucleation, while also introducing pinning that hinders wall motion. In multilayers, our simulations demonstrate that mobile domain walls nucleated in AlScN can propagate deep into adjacent AlN, where they move easily without dopant pinning, enabling low-field switching across thick undoped layers. This microscopic divide-and-conquer mechanism resolves the puzzle of proximity ferroelectricity and highlights high-index interfaces as an underexplored lever for controlling ferroelectric switching.", "url": "https://arxiv.org/abs/2604.25343", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算与机器学习分子动力学模拟，揭示了高米勒指数畴壁在AlN/AlScN多层膜中驱动邻近铁电性的微观机制。\n2. 其核心物理发现是移动的高米勒指数畴壁能在无掺杂AlN层中以极低势垒传播，而Sc掺杂兼具稳定畴壁与引入钉扎的双重作用。\n3. 这为利用高指数界面作为未充分开发的杠杆调控铁电开关行为提供了新视角，并解释了厚未掺杂层完全开关的悖论。", "summary_source": "deepseek", "authors": [{"name": "Changming Ke"}, {"name": "Shi Liu"}], "featured_authors": [{"name": "Changming Ke"}, {"name": "Shi Liu"}], "author_count": 2}, {"id": "2604.25350", "category": "cond-mat", "title": "Electrohydrodynamic lubrication theory", "abstract": "The free motion of charged colloids within ionic solutions and in the vicinity of charged boundaries, is a phenomenon that occurs in various natural, biological and industrial settings. Here, we develop an electrohydrodynamic lubrication theoretical framework, in order to characterize such a motion in the case of an infinite rigid cylinder near a rigid wall. Combining hydrodynamic lubrication theory, Debye-H\\''uckel electrostatics, and Nernst-Planck electrokinetics, we derive the three coupled equations of motion for the normal, longitudinal and rotational degrees of freedom of the cylinder, which are then investigated numerically and through asymptotic analysis. Our results reveal complex behaviours, beyond existing asymptotic electroviscous-lift expressions, and extend the classical Faxen-Brenner-like mobility matrix when surface charges and dissolved ions are incorporated.", "url": "https://arxiv.org/abs/2604.25350", "type": "理论+数值", "summary": "1. 该工作建立了电液动润滑理论框架，用于系统描述无限长刚性带电圆柱体在离子溶液中靠近带电刚性壁面时的法向、纵向与旋转运动。\n2. 其核心卖点在于将润滑流体力学、Debye-Hückel静电学与Nernst-Planck输运方程统一耦合，导出三自由度运动方程，并通过渐近与数值分析揭示了超越经典电粘升力表达式的非线性高阶效应。\n3. 该理论将表面电荷与离子分布效应融入Faxén-Brenner类迁移率矩阵，为限域带电胶体动力学提供了更严格的解析基础，对微纳流控及生物界面输运研究具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Anirban Chatterjee"}, {"name": "Yacine Amarouchene"}, {"name": "Thomas Salez"}], "featured_authors": [{"name": "Anirban Chatterjee"}, {"name": "Yacine Amarouchene"}, {"name": "Thomas Salez"}], "author_count": 3}, {"id": "2604.25351", "category": "cond-mat", "title": "Spinodal-like scaling behavior after a temperature quench across the first-order phase transition in three-dimensional $q$-state Potts models", "abstract": "We study the out-of-equilibrium spinodal-like behavior of three-dimensional (3D) $q$-state Potts models (for $q\\ge 3$), observed when the temperature is quenched across the first-order transition (FOT) point $\\beta_{\\rm fo}=T_{\\rm fo}^{-1}$. We consider a standard quench protocol, in which high-temperature configurations, thermalized at $\\beta_i<\\beta_{\\rm fo}$, are driven across the FOT by a purely relaxational dynamics at $\\beta>\\beta_{\\rm fo}$. We focus on the emergence of spinodal-like behaviors in the thermodynamic limit, associated with the dynamic phase change. We argue that, if the nucleation of smooth droplets is the relevant mechanism of the post-quench phase change, for sufficiently small $\\beta_{\\rm fo}-\\beta_i>0$, the time-dependent energy density should scale in terms of $\\rho = (\\ln t)^{3/2} \\delta$, where $\\delta = \\beta/\\beta_{\\rm fo}-1$, with a discontinuity at a particular value $\\rho=\\rho_s>0$. This implies the emergence of a spinodal-like behavior, whose time scale $\\tau$ increases exponentially as $\\ln \\tau \\approx (\\rho_s/\\delta)^{2/3}$ in the limit $\\delta\\to 0^+$. We present a numerical analysis of the quench protocol in the 3D $q=6$ Potts model, which supports the above spinodal-like scenario.", "url": "https://arxiv.org/abs/2604.25351", "type": "理论+数值", "summary": "1. 该工作研究了三维q态Potts模型在温度淬火穿过一级相变点后的旋节线标度行为。\n2. 其卖点在于论证了时间依赖能量密度按ρ=(ln t)^{3/2}δ标度，且在ρ=ρ_s处存在不连续，对应时间尺度τ随δ→0+呈指数增长。\n3. 这为一级相变动力学中的旋节线行为提供了普适标度理论启发，并得到数值验证。", "summary_source": "deepseek", "authors": [{"name": "Andrea Pelissetto"}, {"name": "Davide Rossini"}, {"name": "Ettore Vicari"}], "featured_authors": [{"name": "Andrea Pelissetto"}, {"name": "Davide Rossini"}, {"name": "Ettore Vicari"}], "author_count": 3}, {"id": "2604.25401", "category": "cond-mat", "title": "Raman Characterization of Two-Dimensional Quasiperiodic Antiferromagnets on Various Lattices: Spin-Orbit Mechanism", "abstract": "We study first-order (single-magnon) inelastic light scatterings in spin-$\\frac{1}{2}$ two-dimensional quasiperiodic antiferromagnets in comparison with those emergent on periodic lattices. Unlike second-order (two-magnon) Raman scatterings based on an exchange interaction between neighboring spins, the present observations involve an indirect electric-dipole coupling which proceeds through a spin-orbit interaction. We discuss the nearest-neighbor antiferromagnetic XXZ Hamiltonian on various quasiperiodic and periodic bipartite lattices. The first-order spectra, of our present interest, consist only of rotation-invariant and mirror-symmetric magnons, while the second-order ones cannot select any particular magnon. With the exchange anisotropy moving away from the Ising limit toward the Heisenberg isotropic point, every initial delta-function peak bifurcates or divides into more in each individual manner on quasiperiodic lattices, while it remains singly peaked all the way on periodic lattices. Such splittings depend on how many types of isocoordinated sites for each coordination number and relative positions between those of the same type. A perpendicular-space representation of the first-order Raman spectrum serves as a fingerprint of each quasiperiodic tiling.", "url": "https://arxiv.org/abs/2604.25401", "type": "理论", "summary": "1. 该工作通过一阶（单磁子）拉曼散射研究自旋1/2二维准周期反铁磁体中的自旋-轨道耦合机制，并与周期晶格对比。\n2. 其卖点在于发现准周期晶格上磁子谱峰随交换各向异性从Ising极限到Heisenberg点呈个体化分叉，分裂取决于等配位位点类型及相对位置。\n3. 一阶拉曼谱的垂直空间表示可作准周期拼图的指纹，为识别准周期磁性结构提供了光谱学判据。", "summary_source": "deepseek", "authors": [{"name": "Takashi Inoue"}, {"name": "Shoji Yamamoto"}], "featured_authors": [{"name": "Takashi Inoue"}, {"name": "Shoji Yamamoto"}], "author_count": 2}, {"id": "2604.25493", "category": "cond-mat", "title": "Non-magnetic floating phases in frustrated Haldane chains with a single-ion anisotropy", "abstract": "We investigate the effect of a single-ion anisotropy on the bilinear-biquadratic spin-1 J1-J2 chain, focusing on the quantum phase transitions out of the trimerized phase. Using large-scale density matrix renormalization group simulations, we uncover a rich phase diagram comprising five gapped phases and, remarkably, two critical floating phases. These incommensurate Luttinger liquid phases emerge from the proliferation of non-magnetic domains - 0-states and dimers - within a trimerized background and are confined to the zero magnetization sector, while magnetic excitations remain gapped. We show that the transition between the topological Haldane phase and the floating phases are governed by a composite critical line with central charge c=2, consistent with a coexistence of magnetic and non-magnetic critical modes. Our results shed new light on the long-standing problem of the Haldane-trimerized transition.", "url": "https://arxiv.org/abs/2604.25493", "type": "理论+数值", "summary": "1. 利用大规模密度矩阵重正化群模拟，研究了单离子各向异性作用下自旋-1双线性-双二次J1-J2阻挫链中三聚化相量子相变，揭示了包含五个有能隙相和两个临界浮动态的丰富相图。\n2. 卖点在于发现这些非公度Luttinger液体浮动态由三聚化背景中非磁性畴（零态和二聚体）增殖产生，局限于零磁化扇区，而磁性激发保持有能隙，且Haldane相到浮动态的转变由中心荷c=2的复合临界线主导。\n3. 该结果对长期悬而未决的Haldane-三聚化相变问题提供了新见解，并为阻挫自旋链中非磁性临界相与拓扑相的关联研究启发了方向。", "summary_source": "deepseek", "authors": [{"name": "Bowy M. La Riviere"}, {"name": "Natalia Chepiga"}], "featured_authors": [{"name": "Bowy M. La Riviere"}, {"name": "Natalia Chepiga"}], "author_count": 2}, {"id": "2604.25553", "category": "cond-mat", "title": "Doping-Induced Brightening of Dark Excitons and Trions in a WSe$_2$ Monolayer", "abstract": "Optically dark excitonic states play a critical role in the valleytronic, electronic, and optical properties of monolayer semiconducting transition metal dichalcogenides. Here, we investigate how electrostatic doping affects the in-plane magnetic-field-induced activation of dark excitonic complexes in a gated WSe$_2$ monolayer. By continuously tuning the carrier density via gate voltage, we access $n$-type, charge-neutral, and $p$-type regimes and track the corresponding brightening dynamics. We find that the brightening rates of the dark negative trion ($T^{D-}$), dark neutral exciton ($X^{D}$), and dark positive trion ($T^{D+}$) exhibit a strong and nontrivial dependence on doping. In particular, the pronounced asymmetry in the brightening behaviour of the neutral $X^{D}$ complex and the charged $T^{D-}$ and $T^{D+}$ trions reveals distinct underlying carrier interactions, which we describe using a rate-equation model for their steady-state populations. These findings highlight the key role of dark excitonic complexes in governing the optical response and carrier dynamics of doped S-TMD monolayers.", "url": "https://arxiv.org/abs/2604.25553", "type": "理论", "summary": "1. 该工作通过静电掺杂连续调控WSe₂单层的载流子密度，系统研究了面内磁场诱导的暗激子复合物的亮化行为。\n2. 其卖点在于发现暗中性激子（Xᴰ）与暗带电三子（Tᴰ⁻和Tᴰ⁺）的亮化速率呈现显著不对称的掺杂依赖性，揭示了不同的载流子相互作用机制。\n3. 这为理解掺杂单层过渡金属硫族化合物中暗激子复合物主导的光学响应与载流子动力学提供了关键实验约束。", "summary_source": "deepseek", "authors": [{"name": "Grzegorz Krasucki"}, {"name": "Artur O. Slobodeniuk"}, {"name": "Kacper Walczyk"}, {"name": "Katarzyna Olkowska-Pucko"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Adam Babiński"}, {"name": "Maciej R. Molas"}], "featured_authors": [{"name": "Grzegorz Krasucki"}, {"name": "Artur O. Slobodeniuk"}, {"name": "Kacper Walczyk"}, {"name": "Takashi Taniguchi"}, {"name": "Adam Babiński"}, {"name": "Maciej R. Molas"}], "author_count": 8}, {"id": "2604.25576", "category": "cond-mat", "title": "Tuning magnitude and direction of lattice thermal conductivity in transition metal dichalcogenide heterobilayers", "abstract": "We investigate the nanoscale mechanisms determining lattice thermal conductivity (LTC) of pristine and W-doped MX$_2$-M$^\\prime$X$^\\prime_2$ transition metal dichalcogenide heterobilayers from first principles, using the exact solution of the linearised Boltzmann transport equation in both phonon and relaxon bases. Pristine heterobilayers exhibit isotropic in-plane LTC with preserved ordering across temperature. Relaxon analysis identifies descriptors linking LTC to phonon properties such as the phonon group velocity and layer localisation. While systems with lighter atoms generally favour higher LTC, a sufficiently large mass contrast is required to induce layer localisation of the transport-relevant vibrational modes. Further, we show through the thermal viscosity that the relative distribution of vibrational states between metal/non-metal sublattices influences the balance between Normal and Umklapp scattering processes. On the other hand, doped systems exhibit reduced and anisotropic in-plane LTC, retain a well-defined layer character, but are strongly affected by enhanced phonon-phonon scattering due to mass disorder. Notably, we find that both configuration and temperature dictate the direction of maximum thermal transport, which opens the possibility to tune the direction of maximum (and minimum) conductivity via doping in novel 2D functional materials. Thanks to its general formulation, the analysis protocol can be readily extended to other van der Waals heterostructures, and the descriptors may be implemented in high-throughput engines to identify promising layered materials with tailored thermal transport characteristics.", "url": "https://arxiv.org/abs/2604.25576", "type": "理论", "summary": "1. 该工作基于第一性原理精确求解线性化玻尔兹曼输运方程，揭示了原始与W掺杂过渡金属二硫族化物异质双层中晶格热导率的纳米尺度调控机制。\n2. 通过relaxon分析识别群速度和层局域化等描述符，并发现质量对比与亚晶格振动态分布共同决定热导率的各向异性及Normal/Umklapp散射平衡。\n3. 协议可推广至其他范德华异质结构，描述符有望植入高通量引擎以筛选具有定向热输运特性的新型二维功能材料。", "summary_source": "deepseek", "authors": [{"name": "Elliot Perviz"}, {"name": "Antonio Cammarata"}], "featured_authors": [{"name": "Elliot Perviz"}, {"name": "Antonio Cammarata"}], "author_count": 2}, {"id": "2604.25581", "category": "cond-mat", "title": "Self-consistent vertex corrected $GW$ with static and dynamic screening using tensor hypercontraction: assessment of molecular ionization potentials", "abstract": "In this work, we benchmark tensor hypercontraction (THC)-accelerated fully self-consistent $GW$ (sc$GW$) and vertex-corrected self-consistent $GW$ (sc$GW\\Gamma$) methods for predicting molecular first ionization potentials (IPs). The vertex function, $\\Gamma$, is inserted into the self-energy in a fully self-consistent manner, and representative sc$GW$ and sc$GW\\Gamma$ variants are assessed across the $G_0W_0\\Gamma29$ and $GW100$ data sets. We find that the THC decomposition introduces negligible errors into self-consistent $GW$ ionization potentials, indicating that the acceleration preserves the underlying fully self-consistent results. Across both benchmark sets, vertex-corrected sc$GW\\Gamma$ methods primarily produce systematic shifts in the IPs relative to sc$GW$ rather than consistent accuracy improvements. These results identify THC as a reliable route to lower-cost sc$GW$ and sc$GW\\Gamma$ calculations", "url": "https://arxiv.org/abs/2604.25581", "type": "数值", "summary": "1. 该工作利用张量超收缩加速的全自洽GW与顶点修正自洽GW方法，系统评估了分子第一电离势的预测精度。\n2. 其技术要点在于THC分解引入的误差可忽略，而顶点修正主要导致电离势的系统性偏移而非一致性改进。\n3. 这为降低高阶自洽GW计算成本提供了可靠加速途径，并为相关电子结构方法发展指明方向。", "summary_source": "deepseek", "authors": [{"name": "Munkhorgil Wang"}, {"name": "Ming Wen"}, {"name": "Pavel Pokhilko"}, {"name": "Chia-Nan Yeh"}, {"name": "Miguel A. Morales"}, {"name": "Dominika Zgid"}], "featured_authors": [{"name": "Munkhorgil Wang"}, {"name": "Ming Wen"}, {"name": "Pavel Pokhilko"}, {"name": "Chia-Nan Yeh"}, {"name": "Miguel A. Morales"}, {"name": "Dominika Zgid"}], "author_count": 6}, {"id": "2604.25626", "category": "cond-mat", "title": "Physical properties of transition metal hydride superconductors Mg2TmH6 (Tm = Rh, Pd, Ir, Pt) by first-principles calculations", "abstract": "In this work, a comprehensive first-principles investigation of the structural, hydrogen storage potential, electronic, elastic, mechanical, thermophysical, superconducting, and optical properties of Mg2TmH6 (Tm = Rh, Pd, Ir, Pt) hydrides is presented. Obtained results demonstrate that Mg2TmH6 hydrides combine favorable hydrogen storage, mechanical robustness, superconductivity, and multifunctional optical properties, making them promising candidates for energy storage, superconducting and advanced optoelectronic applications.", "url": "https://arxiv.org/abs/2604.25626", "type": "数值", "summary": "1. 采用第一性原理计算全面研究了Mg2TmH6（Tm=Rh, Pd, Ir, Pt）系列氢化物超导体的结构稳定性、电子能带、力学性质、超导转变及光学响应等物理特性。\n2. 其核心卖点在于该体系同时展现出优异的储氢容量、机械鲁棒性、超导电性及宽波段光学吸收，实现了多功能的协同组合。\n3. 这为设计基于过渡金属氢化物的能源存储、超导及光电子多功能集成材料提供了理论候选体系与设计思路。", "summary_source": "deepseek", "authors": [{"name": "Md Ashraful Alam"}, {"name": "Md Abdul Hadi Shah"}, {"name": "F. Parvin"}, {"name": "S. H. Naqib"}], "featured_authors": [{"name": "Md Ashraful Alam"}, {"name": "Md Abdul Hadi Shah"}, {"name": "F. Parvin"}, {"name": "S. H. Naqib"}], "author_count": 4}, {"id": "2604.25638", "category": "cond-mat", "title": "Collective and separate metal-insulator transitions in correlated vanadium dioxide", "abstract": "Deciphering the complicated interplay between collective and separate behaviors lies at the heart of first-order metal-insulator transition (MIT) in correlated electron systems, enabling the rational design of exotic electronic states and functionalities. The critical balance between collective and separate behaviors defines a fundamental collective length scale, typically shorter than 5 nm, that governs emergent quantum orders, yet active control over this dichotomy remains elusive. Here, we realize on-demand manipulation of the collective and separate MIT within the correlated VO2 system in a reversible fashion. Artificially designing the oxygen deficiency in VO2/VO2-x homojunction fosters a collective MIT with an extended collective length scale, whereas the introduction of a TiO2 interlayer drives a crossover from this collective to a two-step separate MIT via decoupling of the electronic order parameter. Incorporating mobile hydrogens into the VO2/TiO2/VO2-x trilayer enables reversible control over electronic phase modulations, transitioning a two-step MIT towards either a one-step MIT or collective electron localization. This ionic control over the electronic band structure of VO2 flexibly triggers multi-state MIT, a process governed by hydrogen-related band filling. Our findings transform the collective length scale from a passive threshold into a dynamic design parameter, establishing a viable handle for engineering collective and separate MIT for adaptive correlated electronics.", "url": "https://arxiv.org/abs/2604.25638", "type": "理论", "summary": "1. 该工作通过对二氧化钒同质结和异质结中氧缺陷及氢离子的设计，实现了集体与分离金属-绝缘体转变的可逆调控。\n2. 其核心在于将集体长度尺度从被动阈值转化为主动设计参数，通过电子序参量解耦与氢相关的能带填充驱动多态转变。\n3. 这为可自适应关联电子器件的理性设计提供了动态调控集体与分离行为的有效手段。", "summary_source": "deepseek", "authors": [{"name": "Xuanchi Zhou"}, {"name": "Xiaohui Yao"}, {"name": "Wentian Lu"}, {"name": "Chunwei Yao"}, {"name": "Xiaomei Qiao"}], "featured_authors": [{"name": "Xuanchi Zhou"}, {"name": "Xiaohui Yao"}, {"name": "Wentian Lu"}, {"name": "Chunwei Yao"}, {"name": "Xiaomei Qiao"}], "author_count": 5}, {"id": "2604.25706", "category": "cond-mat", "title": "Validity of DFT+U band gaps in all its known functional forms", "abstract": "The Density Functional Theory plus Hubbard $U$ (DFT+$U$) technique is one of the most widely used tools by condensed matter physicists and solid state chemists for the simulation of transition-metal and lanthanide bearing crystals, and increasingly of much more diverse chemistries. Although often synonymous with the corrective functionals of Dudarev et al. and Liechtenstein et al., there exists a wide variety of DFT+$U$-type functionals ready to be utilized, and no doubt yet to be developed. Since the earliest days, the gap in the DFT+$U$ single-particle eigenspectrum has been associated with the fundamental band gap, and the method has typically found more success for spectra than for total-energy derived properties. There has been some doubt, however, as to the conceptual validity of this association. Here, extending findings from recent years regarding local and semi-local functionals, we prove that the DFT+$U$ eigenspectrum gap is indeed valid, in the sense that it matches its own fundamental gap calculated using total-energy differences. This is true for pristine periodic systems with converged $k$-point sampling but not, however, for defective ones or isolated systems. We show that bandgap validity for solids holds in the presence of pseudopotentials and PAW potentials, when using hybrid functionals, and in DFT+$U$(+$J$) irrespective of the level of subspace projection onto the band-edge states. We survey every DFT+$U$-type functional known to have been published to date, within a unified notation. We verify analytically under which conditions the eigenvalue gap equals its fundamental gap for each functional, and analyze its effect on total energies and gaps for the hydrogen lattice in the Mott-Hubbard limit.", "url": "https://arxiv.org/abs/2604.25706", "type": "理论+数值", "summary": "1. 该工作证明在所有已知泛函形式下，DFT+U计算获得的单粒子本征谱隙在周期性完美体系中与其基于总能差的基本带隙严格等价。\n2. 其核心在于通过解析推导，系统检验了多种DFT+U型泛函、赝势及投影方案下的能隙有效性条件，并验证了Mott-Hubbard极限下氢原子晶格的总能与能隙行为。\n3. 这为DFT+U方法在固体能带计算中的可靠性奠定了严格理论基础，同时明确指出其不适用于缺陷体系或孤立系统，为后续修正与发展提供了方向。", "summary_source": "deepseek", "authors": [{"name": "Andrew C. Burgess"}, {"name": "David D. O'Regan"}], "featured_authors": [{"name": "Andrew C. Burgess"}, {"name": "David D. O'Regan"}], "author_count": 2}, {"id": "2604.25712", "category": "cond-mat", "title": "Exact results for the Hubbard model on bipartite lattices in spatial dimensions $d>1$: Seven theorems from the full [SU(2)$\\times$SU(2)$\\times$U(1)]/$\\mathbb{Z}_2^2$ symmetry", "abstract": "There are few exact results for the Hubbard model on bipartite lattices of spatial dimension $d>1$. Nevertheless, the Hubbard model with transfer integral $t$ and onsite repulsion $U$ on bipartite lattices with $N_a$ sites, such as the square, honeycomb, cubic, body-centered cubic, face-centered cubic, and diamond lattices, provides the simplest toy model for describing electronic correlations in many condensed-matter systems and is therefore a quantum problem of considerable physical interest. Seven exact theorems that provide new physical insight into the model are established. Overall, the exact framework based on physical spins and physical $\\eta$-spins for the Hubbard model on bipartite lattices of spatial dimension $d>1$ introduced in this paper offers a robust foundation for future studies of the model, as well as of the condensed-matter materials, such as cuprate superconductors, graphene and graphene-derived systems, and other quantum systems, that it describes.", "url": "https://arxiv.org/abs/2604.25712", "type": "理论", "summary": "1. 该工作利用完整的[SU(2)×SU(2)×U(1)]/Z₂²对称性，在空间维数d>1的二部晶格Hubbard模型上建立了基于物理自旋和η-自旋的精确框架，并证明了七个新定理。\n2. 其核心卖点在于从完全对称性出发，在平方、蜂窝、立方及金刚石等晶格上导出了关于基态简并、能隙及对称性破缺的精确解析结果。\n3. 这为深入理解铜氧化物超导体、石墨烯及相关强关联材料的电子关联行为，并为未来严格求解Hubbard模型提供了可靠的理论基础。", "summary_source": "deepseek", "authors": [{"name": "J. M. P. Carmelo"}], "featured_authors": [{"name": "J. M. P. Carmelo"}], "author_count": 1}, {"id": "2604.25775", "category": "cond-mat", "title": "Pareto Frontier of Neural Quantum States: Scalable, Affordable, and Accurate Convolutional Backflow for Strongly Correlated Lattice Fermions", "abstract": "Neural Quantum States (NQS) are now among the most accurate methods for studying strongly correlated many-fermion systems, outperforming existing many-body approaches for large systems. However, NQS calculations remain extremely resource-intensive. Here, we introduce a new Pareto frontier of efficiency and accuracy for NQS in simulating strongly correlated lattice fermions, defined by two complementary backflow-related architectures: the Sparse Convolutional Ansatz for Lattice Electrons (SCALE) (state-of-the-art efficiency) and the Accurate Convolutional ansatz for lattice Electrons (ACE) (state-of-the-art accuracy), benchmarked on the iconic Hubbard and $t-J$ models for large lattices. SCALE uses a tailored convolutional design enabling efficient local updates via low-rank determinant updates, reducing computational scaling from $O(N^4)$ to $O(N^3)$ in backflow methods and yielding a >40$\\times$ practical speed-up in tests while maintaining high variational accuracy. As an application, we study the previously inaccessible 1/8-doped pure Hubbard model up to $32 \\times 32$, finding no significant energy difference between horizontal and vertical filled stripe states - contrasting with half-filled stripe states when next-nearest-neighbor hoppings are included. ACE employs a deep convolutional stack to maximize expressive power, achieving unprecedented accuracy on large systems. Extensive benchmarks on Hubbard and $t-J$ models show SCALE delivers variational energies competitive with leading methods at a fraction of the cost, while ACE sets a new accuracy benchmark, surpassing recent results with only 1/6 the runtime for $16 \\times 4$ systems. These new NQS approaches provide scalable, affordable, and accurate tools for exploring strongly correlated fermionic physics, such as the microscopic mechanism of unconventional superconductivity.", "url": "https://arxiv.org/abs/2604.25775", "type": "理论+数值", "summary": "1. 本文提出了两种基于卷积反流架构的神经量子态SCALE和ACE，分别定义强关联晶格费米子模拟在效率和精度上的帕累托前沿。\n2. SCALE借助低秩行列式更新实现高效局部更新，将反流方法计算标度从O(N^4)降至O(N^3)并获得超40倍实际加速；ACE以深度卷积堆栈最大化表达能力，在Hubbard及t-J模型上创下大型体系精度新基准。\n3. 应用SCALE模拟32×32 1/8掺杂纯Hubbard模型，发现水平与垂直填充条带态能量无显著差异，为探索非常规超导微观机理拓展了可规模化、经济且准确的计算工具。", "summary_source": "deepseek", "authors": [{"name": "Yuntian Gu"}, {"name": "Zeyao Han"}, {"name": "Wenrui Li"}, {"name": "Zhiyu Xiao"}, {"name": "Tao Xiang"}, {"name": "Mingpu Qin"}, {"name": "Liwei Wang"}, {"name": "Dingshun Lv"}], "featured_authors": [{"name": "Yuntian Gu"}, {"name": "Zeyao Han"}, {"name": "Wenrui Li"}, {"name": "Mingpu Qin"}, {"name": "Liwei Wang"}, {"name": "Dingshun Lv"}], "author_count": 8}, {"id": "2604.25805", "category": "cond-mat", "title": "Geometric Rashba Control of Polar Pairing at LaAlO$_3$/KTaO$_3$ Interfaces", "abstract": "At LaAlO$_3$/KTaO$_3$ interfaces, the superconducting $T_c$ exhibits a striking quasi-linear dependence on crystallographic orientation, coexisting with switchable polar nanoregions (PNRs). We propose an effective minimal Eliashberg framework in which overdamped PNR fluctuations provide the pairing glue, while geometric Rashba coupling controls its angular dependence. Within a reduced isotropic helicity-band description, the dynamic Rashba vertex scales as $\\sin(\\theta)$, yielding a pairing strength $\\lambda(\\theta)=\\lambda_0+C\\sin^2(\\theta)$. Exact Matsubara-Eliashberg numerical solutions show that this non-linear mapping naturally yields the same qualitative quasi-linear $T_c(\\theta)$ dependence within the reduced model. Because the Rashba-activated polar channel is amplified by the large atomic spin-orbit coupling of Ta $5d$ orbitals, the same framework also rationalizes why KTaO$_3$ interfaces exhibit both a much stronger orientational dependence and a substantially higher $T_c$ scale than their SrTiO$_3$ counterparts.", "url": "https://arxiv.org/abs/2604.25805", "type": "理论+数值", "summary": "1. 该工作提出一个有效Eliashberg框架，解释LaAlO₃/KTaO₃界面超导转变温度随晶向的准线性变化及其与可切换极性纳米区的共存关系。\n2. 其核心在于过阻尼极性纳米区涨落提供配对胶，而几何Rashba耦合通过动态顶点sin(θ)引入配对强度λ(θ)=λ₀+C sin²(θ)的角依赖，精确Matsubara-Eliashberg数值解再现准线性Tc(θ)。\n3. 该机制将大原子自旋轨道耦合增强的Rashba激活极性通道归因于KTaO₃相比SrTiO₃界面更强的取向依赖和更高Tc尺度，为氧化物界面超导工程设计提供明确指引。", "summary_source": "deepseek", "authors": [{"name": "Yi Zhou"}], "featured_authors": [{"name": "Yi Zhou"}], "author_count": 1}, {"id": "2604.25837", "category": "cond-mat", "title": "Restoration of Ensemble Equivalence by Quantum Fluctuations", "abstract": "We study the thermodynamic phase diagram of a one-dimensional quantum spin chain subjected to both mean-field and nearest-neighbor interactions, and to a transverse magnetic field $h$. The purpose is to determine the effect of the quantum fluctuations, due to the transverse field, on the phase diagram, in particular with respect to the occurrence of ensemble inequivalence. We denote our model as a quantum Nagle-Kardar model. To perform the calculation of the canonical partition function, we show that, due to the presence of the mean-field term, in the thermodynamic limit one can use the Hubbard-
