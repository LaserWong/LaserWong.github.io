Stratonovich transformation in spite of the non-commutativity of the different operators appearing in the Hamiltonian, and we adopt a procedure of successive approximations that lead to the determination of the phase diagram thanks to a scaling property of the phase transition lines. The results show that the ensemble inequivalence, present in the classical Nagle-Kardar model, is removed above a threshold value $h_c$ for the transverse field. For $h$ larger than $h_c$ the phase diagram exhibits only second-order phase transition lines, implying therefore restoration of ensemble equivalence.", "url": "https://arxiv.org/abs/2604.25837", "type": "理论+数值", "summary": "1. 该工作通过研究具有平均场和最近邻相互作用的量子Nagle-Kardar自旋链，揭示了横向场诱导的量子涨落对系综等价性恢复的关键作用。\n2. 其技术核心在于利用Hubbard-Stratonovich变换处理非对易算符，并结合相变线标度性质与逐次近似方法确定正则配分函数，从而给出完整的相图。\n3. 这为理解量子涨落如何消除统计力学中的系综不等价性提供了明确机制，对长程相互作用量子系统的热力学分类具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Campa"}, {"name": "Andrea Trombettoni"}], "featured_authors": [{"name": "Alessandro Campa"}, {"name": "Andrea Trombettoni"}], "author_count": 2}, {"id": "2604.25882", "category": "cond-mat", "title": "Excluded volume and molecular field in the Lennard-Jones fluid: a modified first-order perturbation theory", "abstract": "The equation of state and, more generally, the thermodynamics of the Lennard-Jones fluid have long served as a benchmark problem in the statistical theory of fluids. Among available theoretical approaches, first-order perturbation theory occupies a special position: only at this level does the correction to the Helmholtz free energy admit an exact statistical-mechanical expression. In this work, we present a systematic, simulation-based assessment of a non-classical first-order perturbation theory in which the reference system incorporates the entire short-range part of the interaction, while the perturbation is confined to the remaining long-range tail. We show that this range-based decomposition transforms the perturbation contribution into a small, smoothly varying, near-mean-field quantity over a broad supercritical thermodynamic domain. When its density and temperature derivatives are consistently retained, the resulting equation of state reproduces high-accuracy reference data with excellent fidelity. The results demonstrate that the success of first-order perturbation theory is governed primarily by the physical content of the reference system and by the consistent treatment of its state dependence, rather than by the formal truncation order of the expansion.", "url": "https://arxiv.org/abs/2604.25882", "type": "理论+数值", "summary": "1. 该工作基于相互作用范围分解，提出一种改进的一阶微扰理论，将Lennard-Jones流体的短程排斥作用纳入参考系，仅保留长程尾作为微扰。\n2. 其技术关键在于，该分解使微扰贡献在超临界域成为平滑的近平均场小量，且一致保留其密度和温度导数时，状态方程高精度复现参考数据。\n3. 这表明一阶微扰理论的成功主要取决于参考系统的物理内容及其状态依赖的恰当处理，而非微扰展开的形式截断阶数。", "summary_source": "deepseek", "authors": [{"name": "A. Trokhymchuk"}, {"name": "V. Hordiichuk"}, {"name": "R. Melnyk"}, {"name": "I. Nezbeda"}], "featured_authors": [{"name": "A. Trokhymchuk"}, {"name": "V. Hordiichuk"}, {"name": "R. Melnyk"}, {"name": "I. Nezbeda"}], "author_count": 4}, {"id": "2604.25908", "category": "cond-mat", "title": "Structure Prediction and Bonding Analysis of B$_{18}$Ag$_2$ Clusters Featuring Double-Ring Motifs", "abstract": "The structural stability, electronic structure, and bonding characteristics of the silver-doped boron cluster B18Ag2 were investigated using density functional theory (DFT) combined with global optimization techniques. Basin-hopping searches identify a bent double-ring structure as the global minimum, consisting of two stacked B9 rings symmetrically stabilized by Ag atoms located above and below the boron framework. The UV-Vis absorption spectrum exhibits weak transitions in the near-infrared region and intense bands in the visible and near-ultraviolet regions, reflecting delocalized electronic excitations within the boron framework. Charge analysis indicates moderate electron redistribution from Ag atoms to the boron scaffold. Real-space bonding analyses based on the electron localization function (ELF), reduced density gradient (RDG), and molecular electrostatic potential (MEP) reveal that bonding is dominated by {$\\sigma$}-delocalization over the boron skeleton, while Ag-B interactions are weak, non-directional, and primarily electrostatic. The continuous annular electron delocalization within the double-ring structure suggests an aromatic-like character. These findings establish B18Ag2 as a silver-stabilized boron double-ring cluster in which global electron delocalization governs structural stability, while Ag atoms act as axial stabilizing centers that modulate the electronic structure. This work provides new insight into the role of coinage-metal doping in stabilizing extended boron nanostructures.", "url": "https://arxiv.org/abs/2604.25908", "type": "理论+数值", "summary": "1. 该工作采用密度泛函理论与全局优化对B18Ag2团簇进行结构预测与键合分析，确认弯双环结构为全局最小。\n2. 其核心发现是硼骨架的σ离域主导整体稳定性和芳香特征，而Ag原子以弱静电作用充当轴向稳定中心。\n3. 这为理解贵金属掺杂如何稳定扩展硼纳米结构提供了新的电子与几何调控视角。", "summary_source": "deepseek", "authors": [{"name": "Peter Ludwig Rodríguez-Kessler"}], "featured_authors": [{"name": "Peter Ludwig Rodríguez-Kessler"}], "author_count": 1}, {"id": "2604.24830", "category": "hep-th", "title": "Emergent Features in $U(N) \\times U(\\tilde{N})$ Bi-adjoint Cubic Theory", "abstract": "This work investigates the role of the $U(N) \\times U(\\tilde{N})$ global symmetry in tree-level scattering amplitudes of the bi-adjoint $\\phi^3$ theory from three perspectives: combinatorics, correlation functions, and a massive extension of the CHY formalism. We derive a planar scattering potential whose extrema reproduce Dolan and Goddard's massive scattering equations, providing physical intuition of the construction. This potential enables the counting of kinematic invariants via maximally symmetric Ferrers shapes, and it is expressed in terms of conformally invariant cross-ratios. We find that the $U(1)$ decoupling identity provides a physical interpretation of two different Catalan recursion relations, and also reveals an interplay between Catalan and Narayana numbers in the $U(1)$ splitting. Finally, we construct correlation functions for a fixed particle ordering using the CHY formalism, offering new insights into the dynamics of such amplitude structures. We derive a closed form expression of the reduced number of solutions for this set-up, as well as an off-shell scattering potential.", "url": "https://arxiv.org/abs/2604.24830", "type": "理论", "summary": "1. 该工作从组合学、关联函数及大质量CHY形式论三方面，揭示了全局对称性在双伴随三次理论树图散射振幅中的涌现特征。\n2. 其核心在于推导出平面散射势，其极值重现了大质量散射方程，并利用最大对称Ferrers形状计数运动学不变量，同时以U(1)解耦恒等式物理解释了Catalan递推关系与Catalan-Narayana数关联。\n3. 这为理解振幅结构动力学提供了封闭形式解的数量公式及离壳散射势，启发后续对非线性Sigma模型等理论的类似对称性分析。", "summary_source": "deepseek", "authors": [{"name": "Lauren Smyth"}], "featured_authors": [{"name": "Lauren Smyth"}], "author_count": 1}, {"id": "2604.24834", "category": "hep-th", "title": "Revisiting near-extremal and near-BPS black holes in AdS3 supergravity", "abstract": "Despite the archetypal status of the BTZ background in quantifying quantum aspects of black holes, several features at low temperatures remain imprecise and incomplete. Here, we systematically investigate the behaviour of the Euclidean path integral at low temperatures in the context of AdS3 supergravity, including an analysis of quantum fluctuations in both the near-horizon and asymptotic regions. We clarify and rectify aspects of the bosonic fluctuations, highlighting the role of boundary conditions in AdS3, and show in particular that the gravitational path integral in the near-horizon region is inequivalent to that around BTZ at low temperature. We further account in detail for the contributions of Chern-Simons fields and spin-3/2 modes, thereby refining the disparities between the near-extremal and near-BPS limits at low temperature. Altogether, our analysis sharpens the distinction between near- and far-region dynamics and demonstrates a disagreement in the gravitational path integral at the quantum level.", "url": "https://arxiv.org/abs/2604.24834", "type": "理论", "summary": "1. 该工作重新审视了AdS3超引力中近极端和近BPS黑洞在低温极限下的欧几里得路径积分行为。\n2. 其技术核心在于系统解析近视界与渐近区域量子涨落，尤其阐明Chern-Simons场和自旋3/2模贡献，并揭示边界条件导致近视界路径积分与低温BTZ不等价。\n3. 这尖锐化了近极端与近BPS极限间的量子级分歧，为规范引力对偶中精确量子黑洞熵计算提供了必要修正约束。", "summary_source": "deepseek", "authors": [{"name": "Adam Bac"}, {"name": "Alejandra Castro"}, {"name": "Diksha Jain"}], "featured_authors": [{"name": "Adam Bac"}, {"name": "Alejandra Castro"}, {"name": "Diksha Jain"}], "author_count": 3}, {"id": "2604.24839", "category": "hep-th", "title": "Upgrading Extremal Flows in the Space of Derivatives", "abstract": "The method of extremal flows has presented an alluring alternative approach to numerically solving bootstrap constraints. Here I present the development and adaptation of that approach to a more general class of flows with apparent discontinuities. I focus on upgrading solutions of gap maximization for the spinning modular bootstrap from low to high numerical order, though the methodology is generic to a broader class of bootstrap constraints and flows. This methodology presents various nontrivialities and nuances which reflect a richness of the space of bootstrap solutions. The result is a prototype which successfully upgrades solutions in a simple test case at small scale.", "url": "https://arxiv.org/abs/2604.24839", "type": "理论", "summary": "1. 该工作将极值流方法推广至包含明显不连续性的更一般流，用于数值求解自举约束并升级间隙最大化解。\n2. 其技术卖点在于成功将自旋模自举解从低数值阶升级到高数值阶，方法具有通用性并揭示了自举解空间的丰富结构。\n3. 这为处理更复杂自举约束及高维系统提供可扩展的数值原型，启发后续开展更大规模测试与理论深化。", "summary_source": "deepseek", "authors": [{"name": "Rajeev S. Erramilli"}], "featured_authors": [{"name": "Rajeev S. Erramilli"}], "author_count": 1}, {"id": "2604.24843", "category": "hep-th", "title": "Optimal paths across potentials on scalar field space", "abstract": "Motivated by the Swampland Distance Conjecture, we study distances in field space using the framework of Optimal Transport. The associated optimisation problem naturally leads to a notion of distance in terms of a (generalised) Wasserstein distance between probability distributions over field space. In the absence of dynamical gravity, we relate the transport problem to Hamilton-Jacobi and continuity equations arising from a WKB expansion of a Schrödinger equation associated with the physical configuration. We then formulate an extension in the presence of dynamical gravity. Using the ADM formalism, we establish the corresponding transport problem through the Wheeler-DeWitt equation, giving rise to different possible choices of cost functions. The resulting notions of distances are naturally defined on the full configuration space, while an interpretation in terms of a genuine scalar field distance requires additional modifications. We further discuss several applications and examples, and indicate possible implications for different themes within the Swampland program.", "url": "https://arxiv.org/abs/2604.24843", "type": "理论", "summary": "1. 该工作利用最优输运理论在标量场空间定义广义Wasserstein距离，以研究Swampland Distance Conjecture中的场空间距离。\n2. 主要进展在于通过WKB展开将输运问题与Schrödinger方程的Hamilton-Jacobi和连续性方程关联，并在引入动力学引力后利用ADM形式与Wheeler-DeWitt方程构建输运框架。\n3. 这为在全配置空间上定义场空间距离提供了新途径，并可能对Swampland程序中的若干主题产生启发。", "summary_source": "deepseek", "authors": [{"name": "Saskia Demulder"}, {"name": "Dieter Lust"}, {"name": "Carmine Montella"}, {"name": "Thomas Raml"}], "featured_authors": [{"name": "Saskia Demulder"}, {"name": "Dieter Lust"}, {"name": "Carmine Montella"}, {"name": "Thomas Raml"}], "author_count": 4}, {"id": "2604.24844", "category": "hep-th", "title": "Three-Gluon Scattering Amplitude in de Sitter Spacetime", "abstract": "We study three-gluon scattering amplitudes in global de Sitter spacetime, in the angular momentum basis of SO(1,4) symmetry representations. At the tree level, they are determined by the intertwiner integrals of harmonic one-forms on the three-sphere. We derive a general formula valid for all helicity configurations of incoming and outgoing gluons and express the amplitudes in terms of Wigner 3j symbols.", "url": "https://arxiv.org/abs/2604.24844", "type": "理论", "summary": "1. 该工作系统研究了全局de Sitter时空中三胶子散射振幅，基于SO(1,4)对称表示的角动量基构建了树图级散射过程。\n2. 其核心在于将振幅简化为三维球面上调和1-形式的intertwiner积分，并导出适用于所有螺旋度组态的一般公式，最终以Wigner 3j符号显式表达。\n3. 这为理解de Sitter时空非微扰散射结构提供了解析框架，并为弯曲背景下的非阿贝尔规范场量子场论研究奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Tomasz R. Taylor"}, {"name": "Bin Zhu"}], "featured_authors": [{"name": "Tomasz R. Taylor"}, {"name": "Bin Zhu"}], "author_count": 2}, {"id": "2604.24864", "category": "hep-th", "title": "On the structure of higher-dimensional integrable field theories", "abstract": "We propose a general framework for integrable field theories in arbitrary spacetime dimension $d+1$ which is based on $d$-term $L_\\infty$-algebras. Specifically, we introduce cyclic $L_\\infty$-algebras describing topological-holomorphic higher Chern-Simons theories on $M \\times \\mathbb{C}P^1$ with suitable singularity structures and boundary conditions, controlled by a meromorphic $1$-form on $\\mathbb{C}P^1$. Using homological perturbation theory and homotopy transfer, we construct weakly equivalent models describing $(d+1)$-dimensional field theories on $M$. Their integrability is witnessed by a natural map to an $L_\\infty$-algebra describing higher Lax connections, yielding conserved charges associated with higher-dimensional cycles in $M$. The resulting theories admit natural action functionals and recover the Costello-Yamazaki construction in $2$ dimensions.", "url": "https://arxiv.org/abs/2604.24864", "type": "理论", "summary": "1. 该工作提出基于d项L∞-代数的通用框架，在任意d+1维时空上构建可积场论。\n2. 其技术核心在于通过同调扰动论与同伦转移，将M×ℂP¹上具有奇性与边界的拓扑全纯高Chern-Simons理论弱等价于M上的场论模型，并由映射至高Lax联络L∞-代数生成高维守恒荷。\n3. 这为高维可积系统的构造提供了代数统一的途径，并自然推广了二维Costello-Yamazaki方案。", "summary_source": "deepseek", "authors": [{"name": "Marco Benini"}, {"name": "Ryan A. Cullinan"}, {"name": "Alexander Schenkel"}, {"name": "Benoit Vicedo"}], "featured_authors": [{"name": "Marco Benini"}, {"name": "Ryan A. Cullinan"}, {"name": "Alexander Schenkel"}, {"name": "Benoit Vicedo"}], "author_count": 4}, {"id": "2604.24873", "category": "hep-th", "title": "Amplitudes in self-dual (higher-spin) theories", "abstract": "Self-dual theories are powerful toy models of their completions. It was shown recently that there are infinitely many SD-theories once massless higher-spin fields are allowed. The maximal SD-theory is chiral higher-spin gravity. Following the recent [ arXiv:2602.12176 ] we show that all SD-theories, including those with massless higher-spin fields, have nontrivial tree-level amplitudes in Kleinian signature or complex Minkowski kinematics. Within celestial holography, the nontriviality of amplitudes in chiral higher-spin gravity provides the missing ingredient needed to complete the celestial analogue of the vector-model/higher-spin AdS/CFT duality.", "url": "https://arxiv.org/abs/2604.24873", "type": "理论", "summary": "1. 该工作证明所有自对偶理论（包括含无质量高自旋场者）在Kleinian号差或复闵氏运动学中均存在非平凡树图振幅。\n2. 其技术核心是跟随近期方法，揭示了手性高自旋引力中振幅的非平凡性为天体全息中完成矢量模型/高自旋AdS/CFT对偶的天体类比提供了关键缺失成分。\n3. 这为高自旋引力振幅结构与天体全息对偶的完善指明了具体路径，并为相关理论计算与对偶验证提供了基础启发。", "summary_source": "deepseek", "authors": [{"name": "Mattia Serrani"}, {"name": "Evgeny Skvortsov"}], "featured_authors": [{"name": "Mattia Serrani"}, {"name": "Evgeny Skvortsov"}], "author_count": 2}, {"id": "2604.25035", "category": "hep-th", "title": "The Thermodynamics of Cosmological Horizons and Their Holographic Description in de Sitter Space", "abstract": "We analyse the laws of thermodynamics governing the behaviour of cosmological horizons in de Sitter space and their map to a holographic description at future infinity, $\\mathcal{I}^+$. In this case, the boundary can receive signals from two cosmological horizons. We find a universal form for the first law of thermodynamics, valid in general circumstances, when matter-energy crosses both horizons and impinges on the boundary. This universal form leads to a well defined notion of entropy in the holographic dual. It is specified on a co-dimension one surface of the boundary, and can be expressed as a function of two boundary charges, pressure and angular momentum, both of which are derived from the Brown-York stress tensor. Additional comments on the second law, confusing factors of $i$ which arise, and comments pertaining to JT gravity, are included towards the end.", "url": "https://arxiv.org/abs/2604.25035", "type": "理论", "summary": "1. 该工作分析了德西特空间中宇宙学视界的热力学定律及其到未来无穷远边界的全息描述映射。\n2. 核心发现是当物质能量穿过两个视界并抵达边界时，第一定律具有普遍形式，并基于边界荷定义了全息对偶中的熵。\n3. 这为德西特空间全息原理及视界热力学的统一理解提供了新视角与理论基础。", "summary_source": "deepseek", "authors": [{"name": "Indranil Dey"}, {"name": "Kanhu Kishore Nanda"}, {"name": "Akashdeep Roy"}, {"name": "Deepak Kumar Sharma"}, {"name": "Sandip P. Trivedi"}], "featured_authors": [{"name": "Indranil Dey"}, {"name": "Kanhu Kishore Nanda"}, {"name": "Akashdeep Roy"}, {"name": "Deepak Kumar Sharma"}, {"name": "Sandip P. Trivedi"}], "author_count": 5}, {"id": "2604.25052", "category": "hep-th", "title": "Path integral for the closed superstring and the matrix model", "abstract": "The IKKT matrix model, which is proposed as a non-perturbative formulation of superstring theory, has an issue typical of zero-dimensional theory -- ambiguity in the definition of its path integral. To tackle this issue, we revisit the path-integral formulation of perturbative string theory. In this article, we review recent progress in the string world-sheet path-integral formulation, especially in the Minkowski signature. We first derive the Minkowskian path integral of the Nambu-Goto type equivalent to Polyakov's Euclidean path integral for critical closed string theory, showing equivalences among the Nambu-Goto-, Schild- and Polyakov-type formulations both in the Minkowskian and Euclidean signatures. We also show that ``stringy causality'' is realised in the path-integral formulation at the level of string perturbation theory. We then obtain the matrix model with a property like the stringy causality, which turns out to be a Minkowskian version of the NBI-type IKKT matrix model, by matrix regularisation of the path integral for perturbative type IIB string theory.", "url": "https://arxiv.org/abs/2604.25052", "type": "理论", "summary": "1. 该工作重新审视微扰闭弦理论的Minkowski符号路径积分，建立其与IKKT矩阵模型的关联。\n2. 其核心是证明Nambu-Goto、Schild与Polyakov型表述在Minkowski和Euclid符号下的等价性，并揭示弦因果性在路径积分中的实现。\n3. 这为通过矩阵正则化获得具有因果性的Minkowski版本NBI型IKKT矩阵模型提供了基础，有助于解决零维理论路径积分的定义问题。", "summary_source": "deepseek", "authors": [{"name": "Yuhma Asano"}], "featured_authors": [{"name": "Yuhma Asano"}], "author_count": 1}, {"id": "2604.25100", "category": "hep-th", "title": "Thermodynamic Phase Transitions in Einstein-Maxwell-Scalar-Gauss-Bonnet Gravity", "abstract": "Although asymptotically flat black holes generically lack thermodynamic phase transitions, we show that curvature-induced scalarization of electrically charged black holes in Einstein-Maxwell- Scalar-Gauss-Bonnet theory provides a natural setting for nontrivial thermodynamic behavior, without invoking external confining mechanisms or an extended thermodynamic formalism. Working within the canonical ensemble and employing the Euclidean approach, we identify the coexistence of locally stable scalarized and small Reissner-Nordström thermal states, which promotes free-energy crossings to bona fide phase transitions between equilibrium phases. For weak coupling, a second-order phase transition coincides with the second bifurcation point, at which the scalarized branch reconnects with the Reissner-Nordström branch and scalar hair is spontaneously shed. As the coupling strength increases, this transition becomes zeroth order, the scalarized branch shrinks, and a fish-like structure develops in its Helmholtz free energy, rendering locally stable thermal states partially metastable, and yielding up to three phase transitions. In the strong-coupling limit, the scalarized branch reduces to a Schwarzschild-like solution, and the Reissner-Nordström phase ultimately emerges as the sole thermodynamically preferred configuration", "url": "https://arxiv.org/abs/2604.25100", "type": "理论", "summary": "1. 该工作在Einstein-Maxwell-Scalar-Gauss-Bonnet引力中，证明曲率诱导的带电黑洞标量化可产生无需外约束或扩展形式的热力学相变。\n2. 其技术核心在于正则系综下标量化与小型Reissner-Nordström热态的共存导致自由能交叉，弱耦合时二级相变对应第二分岔点，强耦合时变为零级且出现鱼形自由能结构。\n3. 这为渐近平直黑洞体系中平衡相变存在性提供了明确例证，并揭示了标量化耦合强度调控相变级次与亚稳态的物理机制。", "summary_source": "deepseek", "authors": [{"name": "Cristián Erices"}, {"name": "Stella Kiorpelidi"}], "featured_authors": [{"name": "Cristián Erices"}, {"name": "Stella Kiorpelidi"}], "author_count": 2}, {"id": "2604.25103", "category": "hep-th", "title": "Rethinking Dimensional Regularization in Critical Phenomena", "abstract": "We show that it is possible to use dimensional regularization (DR) beyond the usual $\\varepsilon$-expansion in the context of renormalization group (RG) calculations in Critical Phenomena. Based on this fact, we propose a new functional RG scheme - Functional Dimensional Regularization (FDR) - and apply it to a scalar theory in three dimensions. We compute the critical exponents of the Ising universality class directly in $d=3$ under various typical approximations. The method that emerges combines the agility typical of DR with the generality proper of functional RG. Moreover, at a given order of approximation, FDR seems to provide faster convergence and better estimates than other functional RGs.", "url": "https://arxiv.org/abs/2604.25103", "type": "理论", "summary": "1. 该工作提出功能维度正规化（FDR）方案，将维度正规化用于临界现象重整化群计算，超越传统ε展开，直接在三维修正Ising普适类临界指数。\n2. 其技术卖点在于FDR结合维度正规化的运算敏捷性与功能重整化群的普适性，在标量场论中提供比现有功能RG更快的收敛和更优的临界指数估值。\n3. 这为临界现象和量子场论中维度正规化的应用开辟了新途径，并可推广至其他普适类或高阶近似计算。", "summary_source": "deepseek", "authors": [{"name": "P. Beretta"}, {"name": "A. Codello"}], "featured_authors": [{"name": "P. Beretta"}, {"name": "A. Codello"}], "author_count": 2}, {"id": "2604.25226", "category": "hep-th", "title": "A nonabelian Wilson surface on a lattice", "abstract": "We analyze the nonabelian surface holonomy on a bipartite hypercubic lattice following a proposal in arXiv:1002.4636 [hep-th]. The bipartite structure of the lattice enables us to introduce spike string configurations. These spikes play a crucial role for the time evolution of the string when the total number of color indices changes.", "url": "https://arxiv.org/abs/2604.25226", "type": "理论", "summary": "1. 该工作基于arXiv:1002.4636的提议，分析了二分超立方格点上非阿贝尔面全纯量的性质。\n2. 其技术核心在于利用格点的二分结构引入尖刺弦位形，揭示了颜色指标总数变化时弦时间演化的关键机制。\n3. 这为格点规范理论中弦动力学及非阿贝尔拓扑激发的进一步研究提供了明确的理论框架与数值途径。", "summary_source": "deepseek", "authors": [{"name": "Andreas Gustavsson"}], "featured_authors": [{"name": "Andreas Gustavsson"}], "author_count": 1}, {"id": "2604.25240", "category": "hep-th", "title": "Simple Analytical Solutions of the Wheeler-DeWitt Equation in the Classical Hamilton-Jacobi Limit", "abstract": "We investigate the Wheeler-DeWitt equation for a flat, homogeneous, and isotropic Universe containing a canonical scalar field with a potential. We show that under the constraint $|\\Psi|=1$, where the Wheeler-DeWitt equation exactly becomes the classical Hamilton-Jacobi equation, the form of the potential is completely determined depending on the value of the operator ordering parameter. Furthermore, we demonstrate that the classified potentials admit simple forms, such as the exponential, quadratic with a negative cosmological constant, and cosine-type potential with a negative cosmological constant. Several of these have already been explored in the context of inflation or dark energy. Finally, focusing on the system with the cosine-type potential and a negative cosmological constant in the classified potentials, we derive the analytical solutions for the scale factor and the scalar field and discuss the cosmological implications.", "url": "https://arxiv.org/abs/2604.25240", "type": "理论", "summary": "1. 该工作研究了平坦、均匀各向同性宇宙中含规范标量场势的Wheeler-DeWitt方程在经典Hamilton-Jacobi极限下的简单解析解。\n2. 其核心在于揭示在|Ψ|=1约束下，势能形式完全由算子排序参数决定，并分类出指数型、带负宇宙学常数的二次型和余弦型势。\n3. 这为暴胀与暗能量模型提供了精确可解的解析框架，尤其余弦型势导出的尺度因子与标量场解有明确的宇宙学意义。", "summary_source": "deepseek", "authors": [{"name": "Naoto Maki"}, {"name": "Chia-Min Lin"}, {"name": "Kazunori Kohri"}], "featured_authors": [{"name": "Naoto Maki"}, {"name": "Chia-Min Lin"}, {"name": "Kazunori Kohri"}], "author_count": 3}, {"id": "2604.25270", "category": "hep-th", "title": "Integrand Analysis, Leading Singularities and Canonical Bases beyond Polylogarithms", "abstract": "In this paper, we elaborate on the connection between leading singularities and canonical bases of Feynman integrals beyond polylogarithms. We start by discussing a notion of leading singularities in dimensional regularization, which can be generalized from the Riemann sphere to more complex geometries, and use it to demonstrate how selecting Feynman integrals with unit leading singularities necessitates introducing new transcendental functions related to the periods of the underlying geometries. Integrals with unit leading singularities in this generalized sense, satisfy $\\epsilon$-factorized differential equations, and the new transcendental functions are in direct correspondence to the new differential forms appearing in their Gauss-Manin connection. We argue that this construction is mathematically equivalent to the splitting of the period matrix into semi-simple and unipotent parts plus a clean-up step, and demonstrate its use with examples of increasing complexity that require the interplay of multiple geometries.", "url": "https://arxiv.org/abs/2604.25270", "type": "理论", "summary": "1. 该工作阐述了超越多对数函数的费曼积分中主奇点与规范基的深层关联，并演示了如何通过广义主奇点引入新超越函数。\n2. 其核心卖点在于将主奇点概念从黎曼球面推广至复杂几何，证明具有单位主奇点的积分满足ε因式分解微分方程，且新超越函数直接对应高斯-曼宁联络中的新微分形式。\n3. 这一构造等价于周期矩阵的半单-幂单分解加清理步骤，为高阶费曼积分中规范基的系统构建及多几何耦合问题的处理提供了明确数学框架。", "summary_source": "deepseek", "authors": [{"name": "Felix Forner"}, {"name": "Cesare Carlo Mella"}, {"name": "Christoph Nega"}, {"name": "Lorenzo Tancredi"}, {"name": "Fabian J. Wagner"}], "featured_authors": [{"name": "Felix Forner"}, {"name": "Cesare Carlo Mella"}, {"name": "Christoph Nega"}, {"name": "Lorenzo Tancredi"}, {"name": "Fabian J. Wagner"}], "author_count": 5}, {"id": "2604.25463", "category": "hep-th", "title": "Liouville Blocks from Spectral Networks", "abstract": "In this paper, we investigate the role of spectral networks in quantum Liouville theory, with particular emphasis on spectral networks of Fenchel-Nielsen-type. In the first part, we construct q-parallel transport for Fenchel-Nielsen networks through q-nonabelianisation, and compare with quantum parallel transport computed using the Moore-Seiberg formalism. This motivates a proposal for a quantum version of the NRS proposal. In the second part, we reproduce Liouville conformal blocks through the standard free-field formalism with Fenchel-Nielsen-type integration contours. However, we observe that this approach is not complete with respect to wall-crossing. We therefore develop an extension of the free-field formalism to smooth spectral coverings, with the Maulik-Okounkov R-matrix playing a central role. We conjecture that this new formalism generates the full spectrum of Liouville conformal blocks, and provides a first-principle definition for Goncharov-Shen conformal blocks.", "url": "https://arxiv.org/abs/2604.25463", "type": "理论", "summary": "1. 本文通过Fenchel-Nielsen型谱网络研究量子Liouville理论，构造其q-平行输运并对比Moore-Seiberg形式，提出量子版NRS方案。\n2. 技术核心在于将自由场形式扩展至光滑谱覆盖，利用Maulik-Okounkov R矩阵解决跨越墙变换不完整性，生成新形式。\n3. 该新形式猜想给出Liouville共形块完整谱，并为Goncharov-Shen共形块提供第一性原理定义，推动共形场论研究。", "summary_source": "deepseek", "authors": [{"name": "Lotte Hollands"}, {"name": "Subrabalan Murugesan"}], "featured_authors": [{"name": "Lotte Hollands"}, {"name": "Subrabalan Murugesan"}], "author_count": 2}, {"id": "2604.25495", "category": "hep-th", "title": "Phase Transitions and Chaos Bound in Horava Lifshitz Black Holes using Lyapunov Exponents", "abstract": "We probe the thermodynamic phase structure of four dimensional Horava Lifshitz black holes by Lyapunov exponent analysis. For both massless and massive test particles, the Lyapunov exponent exhibits a multivalued dependence on temperature in regimes with a first-order phase transition, with distinct branches corresponding to small, intermediate, and large black hole phases, and this behaviour disappears at the critical point. The discontinuity in the Lyapunov exponent acts as an effective order parameter with critical exponent $\\delta=1/2$, consistent with mean-field universality. We also find that the chaos bound is generically violated below a threshold horizon radius, with the violation occurring within the thermodynamically stable phase and persisting even in the absence of a phase transition. These results establish the robustness and universality of Lyapunov exponents as probes of black hole thermodynamics in alternative theories of gravity.", "url": "https://arxiv.org/abs/2604.25495", "type": "理论", "summary": "1. 该工作通过分析无质量与有质量测试粒子的Lyapunov指数，探测四维Horava-Lifshitz黑洞的热力学相结构，在一级相变区域观测到指数对温度的多值依赖。\n2. 其核心发现是Lyapunov指数不连续性可作为有效序参量，临界指数δ=1/2符合平均场普适类，且混沌束缚在热力学稳定相中普遍被违反。\n3. 这为在替代引力理论中使用Lyapunov指数作为黑洞热力学稳健探针提供了依据，并启发混沌与相变关联的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Mozib Bin Awal"}, {"name": "Prabwal Phukon"}], "featured_authors": [{"name": "Mozib Bin Awal"}, {"name": "Prabwal Phukon"}], "author_count": 2}, {"id": "2604.25518", "category": "hep-th", "title": "Criticality of ISCOs and AdS/CFT", "abstract": "We study the trajectories of massive particles in spherically symmetric black holes in arbitrary dimensions, and find certain universal features based on the topological classification of the fixed points. If the system admits a center, we find two possible outcomes: regardless of the value of the angular momentum, the center always survives, which is realized in global AdS spacetimes or, the center disappears below a critical value of angular momentum, which happens for various spherically symmetric black holes. For the latter case, we find that irrespective of the details of the black hole, there must always be a saddle point. Topological arguments show that there exists a certain critical value of energy, angular momentum and the angular velocity, where the center and the saddle coalesce. This happens at a special point in the parameter space where the trajectories are the limiting innermost stable circular orbits (ISCOs). At the critical point, conserved quantities show universal, van der Waals-like mean-field scaling typical of a second-order phase transition. The anomalous dimensions $\\gamma$ of the double-twist operators in the CFT are found, both using AdS/CFT and through the the heavy-heavy-light-light four point correlators, giving negative and positive values for the center and saddle, respectively, including the emergence of certain non-analytic behaviour at the ISCO. For the center, we also find subleading corrections in $\\frac{1}{\\Delta_H}$ to $\\gamma$ in the dual CFT, and dsicuss the implications of our results.", "url": "https://arxiv.org/abs/2604.25518", "type": "理论", "summary": "1. 该工作通过拓扑分类不动点，研究了任意维球对称黑洞中质量粒子轨道的普适特征，发现极限内稳定圆轨道处存在临界现象。\n2. 其卖点在于揭示ISCO临界点守恒量呈现范德瓦尔斯型平均场二级相变标度，且AdS/CFT对偶给出双迹算子反常维数的正负值与非解析行为。\n3. 这为黑洞轨道临界性与边界CFT的关联提供了明确框架，并指出中心轨迹在1/Δ_H阶修正下的次领头效应。", "summary_source": "deepseek", "authors": [{"name": "Chandrasekhar Bhamidipati"}, {"name": "Parashar Chatterjee"}, {"name": "Sudipta Mukherji"}, {"name": "Yogesh Kumar Srivastava"}], "featured_authors": [{"name": "Chandrasekhar Bhamidipati"}, {"name": "Parashar Chatterjee"}, {"name": "Sudipta Mukherji"}, {"name": "Yogesh Kumar Srivastava"}], "author_count": 4}, {"id": "2604.25569", "category": "hep-th", "title": "Curvature-Assisted Dynamical Compactification in a Pre-Inflationary Higher-Dimensional Universe", "abstract": "We investigate a pre-inflationary dynamical compactification scenario in which a higher-dimensional expanding universe evolves into an effectively four-dimensional one through curvature-assisted modulus trapping. To obtain a calculable semiclassical realization, we consider a simple five-dimensional $S^1$ compactification in a time-dependent open FRW background. Bulk quantum fields generate both the late-time Casimir contribution that stabilizes the radion and the early-time Kaluza-Klein thermal contributions relevant for the cosmological evolution. We show that negative curvature can sustain tracker-like radion evolution, allowing the radion to be trapped in a compactified vacuum before a subsequent four-dimensional inflationary phase dilutes the curvature remnant. While our analysis is performed in a 5D toy model, it illustrates a broader mechanism by which dynamical compactification can arise in a pre-inflationary higher-dimensional cosmology.", "url": "https://arxiv.org/abs/2604.25569", "type": "理论", "summary": "1. 该工作在前暴胀五维开放FRW宇宙中实现了曲率辅助的动力学紧致化，使高维膨胀宇宙演化为有效四维。\n2. 核心卖点是负曲率诱导tracker型radion演化，体量子场的Casimir与Kaluza-Klein热贡献分别稳定真空并驱动宇宙学演化。\n3. 这为高维宇宙学中动态紧致化与后续四维暴胀的衔接提供了可计算半经典框架，并预示了更一般的机制。", "summary_source": "deepseek", "authors": [{"name": "Yusuke Yamada"}], "featured_authors": [{"name": "Yusuke Yamada"}], "author_count": 1}, {"id": "2604.25739", "category": "hep-th", "title": "Graphical Functions by Examples", "abstract": "Graphical functions have emerged as a powerful framework for evaluating multi-loop Feynman integrals in perturbative quantum field theory. Defined as massless three-point position-space integrals, they reveal rich analytic structures and have enabled major advances, including the highest-loop results currently known in several quantum field theories. Their role extends to conformal field theory, and recent algorithmic developments now allow many graphical functions to be computed automatically. This review, based on graduate-level lectures held by O.S. in 2025/26 at the University of Hamburg, introduces the central ideas behind graphical functions, covering periods, Feynman residues, and the treatment of regular and singular cases in both integer and non-integer dimensions. It also discusses connections to momentum space and self-duality, and provides guidance for further study, offering a coherent entry point into a topic not addressed in standard textbooks.", "url": "https://arxiv.org/abs/2604.25739", "type": "理论", "summary": "1. 该工作以具体示例为核心，系统介绍了图形函数在微扰量子场论中用于计算多圈费曼积分的基本框架与核心方法。\n2. 其技术要点在于涵盖周期与费曼留数、正则与奇异情形，并处理整数与非整数维度下图形函数的解析结构及与动量空间、自对偶性的联系。\n3. 这为自动化计算多圈费曼图、探索共形场论中的高阶关联函数，以及深化对图函数解析性质的理解提供了系统化工具和明确入门路径。", "summary_source": "deepseek", "authors": [{"name": "Mrigankamauli Chakraborty"}, {"name": "Marco Klann"}, {"name": "Sven-Olaf Moch"}, {"name": "Pooja Mukherjee"}, {"name": "Tobias Porsche"}, {"name": "Oliver Schnetz"}, {"name": "Leonid A. Shumilov"}], "featured_authors": [{"name": "Mrigankamauli Chakraborty"}, {"name": "Marco Klann"}, {"name": "Sven-Olaf Moch"}, {"name": "Tobias Porsche"}, {"name": "Oliver Schnetz"}, {"name": "Leonid A. Shumilov"}], "author_count": 7}, {"id": "2604.25803", "category": "hep-th", "title": "Kodaira-Spencer theory for flux backgrounds", "abstract": "We give an explicit description (in component fields) of a holomorphic theory associated to a general supersymmetric background of $\\mathcal N=1$ supergravity in ten dimensions. Conjecturally, this provides a sought-for holomorphic realisation of the supergravity twist in such backgrounds, generalising the minimal type I BCOV theory for Calabi-Yau manifolds. Our theory unpacks the recently introduced Courant contact model associated to a holomorphic Courant algebroid. We also show that a coisotropic reduction of this model reproduces the recent model of ref [1], which is formulated in terms of constrained fields.", "url": "https://arxiv.org/abs/2604.25803", "type": "理论", "summary": "1. 该工作针对十维 N=1 超引力中的一般超对称通量背景，给出了其全纯理论在分量场层次的显式构造，被推测为该背景下超引力扭曲的缺失全纯实现，并将 Calabi-Yau 流形上的最小 I 型 BCOV 理论进行了系统推广。\n2. 其核心进展在于系统阐述并详尽展开了一个与 holomorphic Courant algebroid 关联的 Courant contact 几何模型，并证明该模型的共各向同性约化可精确重构文献[1]中基于约束场的理论，从而统一了此类通量背景的几何框架与场论描述。\n3. 这为探索通量背景下全纯异常方程、拓扑弦振幅及超引力扭曲的严格数学结构提供了关键框架性启发，有望推动在更一般超对称形变下的理论与应用推广。", "summary_source": "deepseek", "authors": [{"name": "Caleb Jonker"}, {"name": "Julian Kupka"}, {"name": "Ingmar Saberi"}, {"name": "Charles Strickland-Constable"}, {"name": "Fridrich Valach"}], "featured_authors": [{"name": "Caleb Jonker"}, {"name": "Julian Kupka"}, {"name": "Ingmar Saberi"}, {"name": "Charles Strickland-Constable"}, {"name": "Fridrich Valach"}], "author_count": 5}, {"id": "2604.25820", "category": "hep-th", "title": "Candidate Gaugings of Categorical Continuous Symmetry", "abstract": "Different gaugings of the global symmetry of a quantum field theory are closely related to its various phases. In this work, we study candidate gaugeable symmetries by analyzing candidate Lagrangian algebra data in the Drinfeld center of a symmetry category $\\mathscr{C}^k(G)$ associated to a QFT with continuous global $G$-symmetry and possible 't Hooft anomaly labeled by an integer $k$. We use the combination of the $BF$ theory and the level-$k$ Chern-Simons theory with gauge group $G$ as a semiclassical kernel-theoretic model for the corresponding SymTFT. Under two explicit assumptions, namely that this $BF{+}k$CS theory provides the relevant SymTFT model and that the common $+1$ eigenspaces of the resulting modular kernels detect candidate Lagrangian algebra data in the continuous setting, we derive candidate modular $S$- and $T$-kernels from Hopf-link and framing correlators in $S^3$ semi-classically. We then use these kernels to obtain candidate modular invariants and candidate gaugings. The resulting formulas recover the established cases and suggest a possible extension of this kernel-theoretic picture to compact Lie groups.", "url": "https://arxiv.org/abs/2604.25820", "type": "理论", "summary": "1. 该工作通过分析对称范畴$\\mathscr{C}^k(G)$的Drinfeld中心中的候选Lagrangian代数数据，利用$BF$与level-$k$ Chern-Simons组合理论作为对称张量场论的半经典核模型，研究具有连续$G$对称性的量子场论的可规范对称性。\n2. 其技术关键在于借助$S^3$上Hopf-link与framing关联子半经典推导候选模$S$与$T$核，并通过其公共$+1$本征空间检测连续情形下的候选Lagrangian代数，从而获得候选模不变量与候选规范。\n3. 该公式不仅复现了已知规范结果，还建议将核理论图像扩展至紧李群，为统一描述更广泛的连续对称性规范提供了方向。", "summary_source": "deepseek", "authors": [{"name": "Qiang Jia"}, {"name": "Cheng Ma"}, {"name": "Jiahua Tian"}], "featured_authors": [{"name": "Qiang Jia"}, {"name": "Cheng Ma"}, {"name": "Jiahua Tian"}], "author_count": 3}, {"id": "2604.25821", "category": "hep-th", "title": "Categorical Symmetries via Operator Algebras", "abstract": "We propose that the symmetry category associated to a 2D quantum field theory with 0-form $G$-symmetry with 't Hooft anomaly $k\\in H^4(BG,\\mathbb{Z})$ for a large class of Lie groups $G$ is the category of twisted measurable fields of Hilbert spaces over $G$ denoted by $\\mathrm{Hilb}^k(G)$, which is equivalent to the category of unitary representations of $C_0(G)$ with convolution product twisted by a multiplicative bundle gerbe labeled by $k$ denoted by $\\textbf{Rep}^k(C_0(G))$. We find that the Drinfeld center of the symmetry category $\\mathcal{Z}(\\mathrm{Hilb}^{k}(G))$ equivalent to the category of unitary representations of the groupoid $C^*$-algebra of the Fell line bundle $\\Sigma_k$ over the conjugation action groupoid $G//_{\\rm Ad} G$, denoted by $\\textbf{Rep}(C^*(G//_{\\rm Ad}G,\\Sigma_k))$, where the twist is characterized by the transgression $\\tau(k)\\in H^2(G//_{\\rm Ad}G,U(1))$. To the full generality, our framework applies to a Lie group $G$ that is a direct product of a compact connected Lie group and a number of $\\mathbb{R}$ or $GL(1,\\mathbb{C})$ factors. We compute the braiding of anyon lines in the bulk 3D SymTFT from this formalism. Finally we provide physical examples for abelian and non-abelian $G$, and discuss the physical consequences of flat gauging continuous global symmetries.", "url": "https://arxiv.org/abs/2604.25821", "type": "理论", "summary": "1. 该工作利用算子代数框架，将带有’t Hooft反常的二维量子场论中连续全局对称性的对称性范畴刻画为扭变可测场Hilb^k(G)的范畴。\n2. 核心在于证明该范畴等价于扭变卷积下C_0(G)的幺正表示范畴，并揭示Drinfeld中心等价于共轭作用群胚上Fell线丛群C*代数的表示范畴。\n3. 此框架适用于紧致连通李群及含ℝ或GL(1,ℂ)因子的群，可系统计算三维对称性张量场论中的任意子编织，并阐明平坦规范连续对称性的物理后果。", "summary_source": "deepseek", "authors": [{"name": "Qiang Jia"}, {"name": "Ran Luo"}, {"name": "Jiahua Tian"}, {"name": "Yi-Nan Wang"}, {"name": "Yi Zhang"}], "featured_authors": [{"name": "Qiang Jia"}, {"name": "Ran Luo"}, {"name": "Jiahua Tian"}, {"name": "Yi-Nan Wang"}, {"name": "Yi Zhang"}], "author_count": 5}, {"id": "2604.25844", "category": "hep-th", "title": "(Super-)renormalizable hairy meronic black holes", "abstract": "We construct an analytical black hole solution in the Einstein-Maxwell-Yang-Mills theory with a conformally coupled scalar field in four dimensions, which generalizes the charged Martínez-Troncoso-Zanelli (MTZ) black hole in the presence of self-gravitating non-Abelian gauge fields. The internal gauge group is determined by the horizon curvature, becoming $SU(N)$ in the case of positive curvature and $SU(N-1,1)$ when the curvature is negative. Moreover, this solution is employed as a conformal seed to obtain new meronic spacetimes dressed with all (super-)renormalizable contributions of the scalar field, which provides the generalization of the Anabalón-Cisterna (AC) solution when self-gravitating non-Abelian gauge fields are included. Finally, we consider the non-Noetherian extension of the conformal scalar fields, which still yields a second-order conformally invariant scalar equation, even though the action is not. In that case, we show that static black hole solutions can also be charged with Yang-Mills fields.", "url": "https://arxiv.org/abs/2604.25844", "type": "理论", "summary": "1. 该工作构造了四维爱因斯坦-麦克斯韦-杨-米尔斯理论中带共形耦合标量场的解析黑洞解，推广了带电MTZ黑洞及Anabalón-Cisterna解。\n2. 其核心在于视界曲率决定内规范群（正曲率SU(N)，负曲率SU(N-1,1)），并以共形种子生成包含所有（超）可重整化标量贡献的新型meronic时空。\n3. 这揭示了非诺特推广下即使作用量不共形不变，仍可保持标量方程二阶共形不变并支持杨-米尔斯电荷，为研究超可重整化毛状黑洞提供新途径。", "summary_source": "deepseek", "authors": [{"name": "Luis Avilés"}, {"name": "Borja Diez"}], "featured_authors": [{"name": "Luis Avilés"}, {"name": "Borja Diez"}], "author_count": 2}, {"id": "2604.25916", "category": "hep-th", "title": "Nonlocal-in-time tail effects in gravitational scattering to fifth Post-Minkowskian and tenth self-force orders", "abstract": "Using the worldline effective field theory formalism, we derive the nonlocal-in-time conservative contributions arising from tail effects in gravitational scattering to fifth Post-Minkowskian (5PM) and tenth self-force (10SF) orders. The result features multiple polylogarithms of up to weight three. This challenging computation relies on state-of-the-art integration techniques, including a novel integration-by-parts algorithm: the Sparse Integral Reducer (SpideR). We find perfect agreement in the overlap with all existing literature through sixth post-Newtonian order. The results presented here provide a key ingredient for isolating the local-in-time component of the conservative two-body dynamics of binary inspirals at 5PM order.", "url": "https://arxiv.org/abs/2604.25916", "type": "理论", "summary": "1. 该工作利用世界线有效场论形式，推导了引力散射中尾效应产生的非定域保守贡献至第五后闵可夫斯基与第十自引力阶。\n2. 其技术核心在于引入新型按分部积分算法SpideR，获得含最高权重三多重对数的解析结果，并与六阶后牛顿理论完美吻合。\n3. 该结果为隔离五阶后闵可夫斯基保守二体动力学的定域部分提供关键输入，推动双星旋近精确建模。", "summary_source": "deepseek", "authors": [{"name": "Christoph Dlapa"}, {"name": "Gregor Kälin"}, {"name": "Zhengwen Liu"}, {"name": "Rafael A. Porto"}], "featured_authors": [{"name": "Christoph Dlapa"}, {"name": "Gregor Kälin"}, {"name": "Zhengwen Liu"}, {"name": "Rafael A. Porto"}], "author_count": 4}, {"id": "2604.25918", "category": "hep-th", "title": "de Sitter in String Theory vs. Gibbons & Hawking", "abstract": "This paper corroborates a statement that perturbative string theory does not admit a solution whose spacetime metric is de Sitter times a closed manifold, to all orders in the $\\alpha'$ and $g_s$ expansions, under the assumption that the logarithm of the sphere partition function of Euclidean quantum gravity receives a nonzero contribution proportional to $\\frac{1}{G_N}$ in a saddle-point approximation. This assumption is related to the Gibbons-Hawking proposal that the entropy of the cosmological horizon of the static patch is $\\frac{A}{4G_N}$. Evidence for the statement comes from independent approaches to the effective action of string theory, all of which agree that the tree-level action vanishes for closed Euclidean target-space solutions. One possible implication is that the state of the Universe will depart from an asymptotically de Sitter spacetime.", "url": "https://arxiv.org/abs/2604.25918", "type": "理论", "summary": "1. 该文在微扰弦论框架下证实，至α'与g_s展开所有阶，不存在德西特时空与闭流形直积的解，前提是欧几里得量子引力球面配分函数之鞍点近似含非零1/G_N项。\n2. 其关键论证在于此假设与Gibbons-Hawking宇宙学视界熵公式一致，且独立弦论有效作用方法均表明闭欧几里得靶空间解之树图有效作用为零。\n3. 这暗示宇宙状态必然偏离渐近德西特时空，为弦论中的宇宙学模型提供了不可回避的结构性约束。", "summary_source": "deepseek", "authors": [{"name": "Yoav Zigdon"}], "featured_authors": [{"name": "Yoav Zigdon"}], "author_count": 1}, {"id": "2604.24847", "category": "math-ph", "title": "The Classification of Pauli Stabilizer Codes: A Lattice and Continuum Treatise", "abstract": "We classify mobile Pauli stabilizer codes up to gapped interfaces and coarse-graining using the framework of algebraic $\\mathrm{L}$-theory. We compare this classification with that of framed TQFTs, theories that arise naturally in the continuum, highlighting a close structural relationship between the two. Our approach is formulated in the category of perfect chain complexes equipped with quadratic functor over the Laurent polynomial ring $R = \\mathbb{Z}/p[x_1^{\\pm 1}, \\ldots, x_n^{\\pm 1}]$, within which the collection of topological operators of Pauli stabilizer codes arise naturally as objects. In particular, we establish a bulk-boundary correspondence for lattice theories: the equivalence class of a Pauli stabilizer code up to gapped interface is described by a Clifford QCA in one dimension higher. This is done using the universal target category for stabilizer codes, which is the categorical spectrum whose existence and universal properties are introduced in this work. We conclude by highlighting subtle differences between the classification of Pauli stabilizer codes and TQFTs, leading to qualitative distinctions between lattice and continuum theories.", "url": "https://arxiv.org/abs/2604.24847", "type": "理论", "summary": "1. 该工作利用代数L-理论框架对移动泡利稳定子码在有能隙界面和粗粒化下进行了分类，并与框架化拓扑量子场论做结构比较。\n2. 其技术核心在于建立了体-边对应，将稳定子码的有能隙界面等价类映射为高一维Clifford量子胞元自动机，并引入具有普适性质的稳定子码泛目标范畴。\n3. 这揭示了格点理论（稳定子码）与连续理论（拓扑量子场论）分类之间的定性差异，为量子纠错码的拓扑相分类及边界态构造提供了代数工具。", "summary_source": "deepseek", "authors": [{"name": "Bowen Yang"}, {"name": "Matthew Yu"}], "featured_authors": [{"name": "Bowen Yang"}, {"name": "Matthew Yu"}], "author_count": 2}, {"id": "2604.24865", "category": "math-ph", "title": "Prefactorization algebras of superselection sectors", "abstract": "This paper revisits the theory of superselection sectors in algebraic quantum field theory from the modern perspective of prefactorization algebras. Under the standard assumptions of Haag duality and a locally faithful vacuum representation, it is shown that every AQFT defined over a filtered orthogonal category of spacetime regions, satisfying some mild additional geometric hypotheses, has an associated locally constant $C^\\ast$-categorical prefactorization algebra of superselection sectors over the same orthogonal category. In the case of double cones in the $(n\\geq 2)$-dimensional Minkowski spacetime, our approach provides a conceptual explanation for the well-known $\\mathbb{E}_n$-monoidal structure on the $C^\\ast$-category of superselection sectors as the combination, through Dunn-Lurie additivity $\\mathbb{E}_n\\simeq \\mathbb{E}_1\\otimes \\mathbb{E}_{n-1}$, of the familiar $\\mathbb{E}_1$-monoidal structure from Haag duality and an $\\mathbb{E}_{n-1}$-monoidal structure from Lorentzian geometry. A refinement of our results to equivariant contexts under a discrete group $G$ is also provided.", "url": "https://arxiv.org/abs/2604.24865", "type": "理论", "summary": "1. 该工作从前因子化代数角度重新表述代数量子场论中的超选择扇区理论，证明在Haag对偶性和真空表示局部忠实假设下，每个AQFT都关联一个局部常数C*-范畴前因子化代数。\n2. 技术核心在于通过Dunn-Lurie可加性将Haag对偶性导出的E₁-幺半结构与洛伦兹几何蕴含的Eₙ₋₁-幺半结构组合，为闵可夫斯基时空双锥中超选择扇区C*-范畴的Eₙ-幺半结构提供概念性解释。\n3. 该框架自然推广至离散群等变情形，为理解时空维度与对称性在局域量子场论中的编织关系及超选择结构的几何起源提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Marco Benini"}, {"name": "Victor Carmona"}, {"name": "Alexander Schenkel"}], "featured_authors": [{"name": "Marco Benini"}, {"name": "Victor Carmona"}, {"name": "Alexander Schenkel"}], "author_count": 3}, {"id": "2604.25066", "category": "math-ph", "title": "Invariant Measures in Hamiltonian Systems: The Analytical Foundations of Statistical Physics", "abstract": "We construct a measure in the hamiltonian function level sets that is invariant under the hamiltonian flow for short times and flow preserving for arbitrarily long times. This allows a probabilistic approach to the study of hamiltonian systems, in the space of states with fixed energy. We prove that this measure generates the microcanonical partition function employed in physics and show that it can be transformed into the canonical partition function in an asymptotic limit, hence reproducing classical Statistical Physics. We also argue that this gives an alternative solution to Simon's second problem.", "url": "https://arxiv.org/abs/2604.25066", "type": "理论", "summary": "1. 本文在哈密顿系统的能量等值面上构造了一类短时不变且长时流保持的测度。\n2. 该测度严格生成微正则配分函数，并在渐近极限下转化为正则配分函数，从而复现经典统计力学的数学结构。\n3. 此工作为统计物理的分析基础提供了新路径，并给出了西蒙第二问题的一个替代解。", "summary_source": "deepseek", "authors": [{"name": "Luis A. Cedeño-Pérez"}, {"name": "Alexis E. López-Velázquez"}], "featured_authors": [{"name": "Luis A. Cedeño-Pérez"}, {"name": "Alexis E. López-Velázquez"}], "author_count": 2}, {"id": "2604.25078", "category": "math-ph", "title": "Gegenbauer polynomials and fluctuation properties of the one-dimensional Riesz gas", "abstract": "The Riesz gas in one-dimension consists of particles interacting via a pair potential, ${\\rm sgn}(s) |x - x'|^{-s}$, $s \\ne 0$ and $-\\log | x - x'|$ for $s=0$. In the infinite density limit, with the particle support the interval $[-1,1]$, we apply a functional derivative method due to Beenakker to compute the covariance of two smooth linear statistics for the Riesz gas with exponent $s \\in (-1,1)$, $s \\ne 0$. This we give in terms of a sum over Fourier components of the linear statistics with respect to a Gegenbauer polynomial $\\{C_n^{(s/2)}(x) \\}$ basis, which generalises a known form in the case $s=0$ involving a cosine expansion. For the power sum linear statistic, our general formula can be reduced to a product of gamma function form, and compared against recent exact results in the literature for this case.", "url": "https://arxiv.org/abs/2604.25078", "type": "理论", "summary": "1. 该工作利用Beenakker泛函导数方法，计算了相互作用势为sgn(s)|x−x'|^{-s}的一维Riesz气体在无限密度极限下两个光滑线性统计量的协方差。\n2. 其核心卖点在于将协方差公式表示为以Gegenbauer多项式{C_n^{(s/2)}(x)}为基的傅里叶分量求和，推广了s=0时的余弦展开形式，并针对幂和统计量简化为伽马函数乘积。\n3. 这一解析框架与近期精确结果一致，为理解一维Riesz气体的涨落性质及可积系统关联函数提供了明确的理论途径。", "summary_source": "deepseek", "authors": [{"name": "Peter J. Forrester"}], "featured_authors": [{"name": "Peter J. Forrester"}], "author_count": 1}, {"id": "2604.25079", "category": "math-ph", "title": "Lie symmetry classification and invariant solutions of time-fractional telegraph systems with variable coefficients", "abstract": "Time-fractional telegraph equations provide fundamental mathematical models for transport processes that exhibit memory and nonlocal effects in industrial and physical systems. These models arise naturally in heat transport in materials with thermal memory, wave propagation in viscoelastic media, and charge transport in spatially heterogeneous semiconductor devices. In this study, we investigate a class of time-fractional telegraph systems with spatially varying coefficients using Lie symmetry analysis and the Riemann--Liouville fractional derivative. We establish a complete Lie group classification for sufficiently differentiable coefficient functions and determine all functional forms that admit such symmetry extensions. The symmetry structure is shown to depend fundamentally on the relationship between the transport coefficient and the potential function, resulting in three distinct symmetry classes. For each case, optimal systems of one-dimensional Lie subalgebras are constructed, and the governing fractional partial differential equations are systematically reduced to fractional ordinary differential equations. Exact invariant solutions are obtained in closed form and expressed in terms of Mittag--Leffler functions, generalized Wright functions, and Fox $H$-functions. These analytical solutions provide valuable insights into fractional telegraph-type transport phenomena and serve as important benchmarks for validating numerical methods in industrial transport modeling and fractional evolution systems.", "url": "https://arxiv.org/abs/2604.25079", "type": "理论", "summary": "1. 该工作对一类具有空间变系数的时间分数阶电报系统完成了李对称分类与不变解的构造。\n2. 其技术核心是依据传输系数与势函数关系将对称结构分为三类，并构建最优一维子代数系统将分数阶偏微分方程约化为分数阶常微分方程。\n3. 所得以Mittag-Leffler函数和Fox H函数表达的精确解为分数阶输运现象提供了理论基准，可用于验证工业建模中的数值方法。", "summary_source": "deepseek", "authors": [{"name": "Sodbaatar Adiya"}, {"name": "Khongorzul Dorjgotov"}, {"name": "Bayarmagnai Gombodorj"}, {"name": "Bayarpurev Mongol"}, {"name": "Uuganbayar Zunderiya"}], "featured_authors": [{"name": "Sodbaatar Adiya"}, {"name": "Khongorzul Dorjgotov"}, {"name": "Bayarmagnai Gombodorj"}, {"name": "Bayarpurev Mongol"}, {"name": "Uuganbayar Zunderiya"}], "author_count": 5}, {"id": "2604.25535", "category": "math-ph", "title": "The SK model with a sparse variance profile: free energy and AMP algorithm for TAP equations at high temperature", "abstract": "A generalization of the Sherrington-Kirkpatrick (SK) model for spin glasses is considered, in which the interaction matrix is endowed with a variance profile that has no particular structure an may be sparse. In the first part of this paper, an asymptotic equivalent of the free energy is derived at sufficiently high temperatures, regardless of the signature of the variance profile matrix. In the second part, the mean of the spin vector under the Gibbs measure is estimated using an Approximate Message Passing algorithm based on the Thouless-Anderson-Palmer equations. The dynamical approach of Adhikari this http URL . (J. Stat. Phys., 2021), originally developed for the classical SK model, is adapted to the present setting to obtain these results.", "url": "https://arxiv.org/abs/2604.25535", "type": "理论", "summary": "1. 该工作将SK自旋玻璃模型推广至相互作用矩阵具有稀疏无结构方差分布的情形，并在高温下导出了自由能的渐近等价形式。\n2. 技术核心在于基于Thouless-Anderson-Palmer方程的近似消息传递算法被拓展至该稀疏方差设定，并改编了Adhikari等人的动力学方法以证明结果。\n3. 这为解析复杂稀疏相互作用系统的统计力学行为以及设计高效的迭代算法提供了理论框架与方法论启发。", "summary_source": "deepseek", "authors": [{"name": "Walid Hachem"}], "featured_authors": [{"name": "Walid Hachem"}], "author_count": 1}, {"id": "2604.25622", "category": "math-ph", "title": "Geometry of Logarithmic Topological Recursion: Dilaton Equations, Free Energies and Variational Formulas", "abstract": "One of the most important applications of topological recursion concerns spectral curves for which the functions $(x,y)$ defining the spectral curve are allowed to have logarithmic singularities. This occurs for instance for Seiberg-Witten curves and mirror curves computing Gromov--Witten invariants of toric Calabi--Yau threefolds. A recently introduced extension of topological recursion, the so-called logarithmic topological recursion, exhibits the correct behavior under certain limits of those spectral curves. In this article, we derive the dilaton equations in the setting of logarithmic topological recursion, as well as variational formulas, and provide a definition of the free energies in situations where standard topological recursion was known to fail. We present examples in which the new definition of the free energies \\textit{directly} (without any computation) reproduces the full perturbative part of the Nekrasov--Shatashvili partition function of 4d $\\mathcal{N}=2$ pure supersymmetric gauge theory, as well as the all-genus free energies of mirror curves of strip geometries, including in particular the topological vertex and the resolved conifold.", "url": "https://arxiv.org/abs/2604.25622", "type": "理论", "summary": "1. 该工作针对具有对数奇异性的谱曲线，建立了对数拓扑递归中的dilaton方程与变分公式，并给出了标准拓扑递归失效情形下自由能的统一定义。\n2. 其关键在于新定义的自由能可直接、无需计算地重现Nekrasov–Shatashvili全微扰部分及多条带镜像曲线的全亏格自由能，涵盖拓扑顶点与解结流形。\n3. 这一进展为理解拓扑递归中奇异极限行为提供了统一框架，并有望简化Seiberg–Witten理论与Gromov–Witten不变量的计算。", "summary_source": "deepseek", "authors": [{"name": "Alexander Hock"}, {"name": "Olivier Marchal"}, {"name": "Nicolas Orantin"}], "featured_authors": [{"name": "Alexander Hock"}, {"name": "Olivier Marchal"}, {"name": "Nicolas Orantin"}], "author_count": 3}, {"id": "2604.25662", "category": "math-ph", "title": "On phase retrieval for continuous and discrete Fourier transforms", "abstract": "We continue studies on phase retrieval for continuous and discrete Fourier transforms in multidimensions. Using finite difference operators, we give a large class of unexpected examples of non-uniqueness for this problem, including examples with the sparsity condition. A prototype of this construction in the continuous case is given in the work Novikov, Xu (JFAA, 2026), using linear differential operators. The construction of the present work also yields a large class of non-trivial Pauli partners, i.e., different functions with the same intensities in both configuration and Fourier domains. Besides, our construction yields examples that solve an old open question in phase retrieval with background information arising in many areas including Fourier holography.", "url": "https://arxiv.org/abs/2604.25662", "type": "理论", "summary": "1. 该工作利用有限差分算子，系统构造了多维连续与离散傅里叶变换相位恢复问题中大量非唯一性反例，涵盖稀疏情形。\n2. 其核心在于生成非平凡Pauli伙伴，即位置域与频域强度相同但函数不同的实例，并解决背景信息下相位恢复的长期开放问题。\n3. 这为傅里叶全息等涉及背景先验的相位恢复提供了否定性构造，暗示该类反例的普遍存在性。", "summary_source": "deepseek", "authors": [{"name": "Roman Novikov"}, {"name": "Tianli Xu"}], "featured_authors": [{"name": "Roman Novikov"}, {"name": "Tianli Xu"}], "author_count": 2}, {"id": "2604.25682", "category": "math-ph", "title": "Co-rotating Vortices on Surfaces of Variable Negative Curvature: Hamiltonian Structure and Drift Dynamics", "abstract": "Vortices in fluids and superfluids underpin phenomena ranging from Bose--Einstein condensates and superfluid films to neutron stars and hydrodynamic micro-rotors, where geometry can strongly influence their motion. Curvature can induce vortex motion with no planar analogue. We study Hamiltonian vortex motion on a catenoid, a minimal surface of variable negative curvature, and derive explicit equations of motion, conserved quantities, and reductions for co-rotating vortex pairs. For two identical vortices we find an exact antipodal solution in which the pair rotates rigidly at fixed latitude, with angular velocity $\\Omega=(\\Gamma/16\\pi)\\,K'(V)/\\sqrt{-K(V)}$, where $K(V)$ is the Gaussian curvature. Thus the motion is governed by the curvature gradient rather than the curvature itself. The symmetric state is linearly unstable, with growth rate $\\lambda=\\sqrt{3}|\\Omega|$, in agreement with numerical simulations. For generic equal-strength pairs, conservation of the Hamiltonian and rotational momentum reduces the nonlinear dynamics to a single quadrature, yielding bounded relative oscillations together with a secular azimuthal drift. Simulations of the full equations confirm the reduced theory and reveal the same curvature-induced transport mechanism in a localized many-vortex cluster, motivating a broader theory of collective vortex drift on curved surfaces.", "url": "https://arxiv.org/abs/2604.25682", "type": "理论", "summary": "1. 该工作研究了变负曲率曲面（悬链面）上共转涡旋对的哈密顿动力学，导出了显式运动方程、守恒量及约化描述。\n2. 其关键发现是涡旋运动由高斯曲率梯度而非曲率本身主导，并给出了反足刚体旋转解的角速度公式与线性不稳定性增长率。\n3. 这为理解曲率诱导的集体涡旋漂移机制提供了理论基础，并启发建立弯曲表面上多涡旋系统的广义动力学理论。", "summary_source": "deepseek", "authors": [{"name": "Gaurang Mangesh Joshi"}, {"name": "Rickmoy Samanta"}], "featured_authors": [{"name": "Gaurang Mangesh Joshi"}, {"name": "Rickmoy Samanta"}], "author_count": 2}, {"id": "2604.25697", "category": "math-ph", "title": "Griffiths inequalities and Gibbs-Bogoliubov inequality for general gauge glasses with Gaussian disorder on Nishimori line", "abstract": "We consider a class of gauge glass models with Gaussian disorder on the Nishimori line, including the Ising spin glass, the $XY$ gauge glass, the $Z_q$ gauge glass, and the gauge-invariant Potts model. We prove that the first and second Griffiths inequalities hold for these models on arbitrary lattice structures. As a consequence, both the pressure and the correlation functions are monotonically increasing with respect to the inverse temperature along the Nishimori line. Furthermore, we establish an analogue of the Gibbs--Bogoliubov inequality for this class of models. This result implies that, on the Nishimori line, the approximate quenched free energy obtained via the replica method with a replica-symmetric mean-field approximation is always greater than the true quenched free energy. Our results provide a broad generalization of previous results established for the Ising spin glass with Gaussian disorder on the Nishimori line.", "url": "https://arxiv.org/abs/2604.25697", "type": "理论", "summary": "1. 该工作证明了一类含高斯无序的规范玻璃模型（包括伊辛自旋玻璃、XY规范玻璃等）在Nishimori线上满足第一、第二Griffiths不等式及Gibbs-Bogoliubov不等式。\n2. 其核心在于将先前仅适用于伊辛自旋玻璃的严格不等式推广至任意晶格结构下的多种规范模型，并揭示压力和关联函数沿Nishimori线随逆温度单调递增。\n3. 这一结论为复制对称平均场近似下淬火自由能的上界性质提供了严格约束，并为相关无序系统的统计力学分析奠定了更广泛的基础。", "summary_source": "deepseek", "authors": [{"name": "Manaka Okuyama"}, {"name": "Masayuki Ohzeki"}], "featured_authors": [{"name": "Manaka Okuyama"}, {"name": "Masayuki Ohzeki"}], "author_count": 2}, {"id": "2604.25703", "category": "math-ph", "title": "Long-time asymptotics of the Newell equation on the line", "abstract": "In 1978, A. C. Newell [SIAM J. Appl. Math. 35(4) (1978) 650-664] proposed an exactly solvable model called Newell equation, which simulates the investigation of significant interaction mechanism between long and short waves. Nearly fifty years have passed, yet the long-time asymptotics of the Newell equation remains an open problem to date, with no results reported. In this work, the long-time asymptotic behaviors of the solutions to this model under Schwartz class initial conditions are studied by using the Riemann-Hilbert formulation. Through direct and inverse scattering analysis, the corresponding Riemann-Hilbert problem is formulated, and its relationship with the solution to the initial-value problem of the Newell equation is established. The existence and uniqueness of the solution to the Riemann-Hilbert problem is proved by vanishing lemma. Subsequently, the asymptotic expressions of the solution to the initial-value problem in the dispersive wave region are obtained by using the Deift-Zhou nonlinear steepest descent method. This work extends Newell's original results, providing a rigorous proof for the findings presented in Section 4 of his paper, along with explicit expressions. Furthermore, the comparison between direct numerical simulations and the theoretical results obtained in this paper demonstrates the reliability of the asymptotic expressions.", "url": "https://arxiv.org/abs/2604.25703", "type": "理论", "summary": "1. 该工作利用Riemann-Hilbert方法，严格推导了Newell方程在直线上的Schwartz类初始条件下解的长时间渐近行为，获得了色散波区域的显式渐近表达式。\n2. 其技术核心在于通过直接与逆散射分析构建Riemann-Hilbert问题，并应用Deift-Zhou非线性最速下降法导出渐近公式，数值模拟验证了理论结果的可靠性。\n3. 这一结果严格证明了Newell原论文第四节的经验结论，为长短波相互作用可积模型提供了精确长时间描述，并对类似系统的渐近分析具有示范意义。", "summary_source": "deepseek", "authors": [{"name": "Deng-Shan Wang"}, {"name": "Yingmin Yang"}], "featured_authors": [{"name": "Deng-Shan Wang"}, {"name": "Yingmin Yang"}], "author_count": 2}, {"id": "2604.25729", "category": "math-ph", "title": "Derivations on the triplet $W$-algebras with $\\mathfrak{sl}_2$-symmetry", "abstract": "We construct derivations on the triplet $W$-algebras $\\mathcal{W}_{p_+,p_-}$ by refining the Frobenius homomorphisms of Tsuchiya-Wood and show that the property of the Adamović-Milas derivation for $\\mathcal{W}_{2,p}$ extends to our derivations. As an application, we show that the $\\mathfrak{sl}_2$-symmetry of $\\mathcal{W}_{p_+,p_-}$ arises naturally from our construction. We further show that our method applies to the triplet $W$-superalgebra $\\mathcal{SW}(m)$ and that the full automorphism group ${\\rm Aut}(\\mathcal{SW}(m))$ is $PSL_2(\\mathbb{C})\\times \\mathbb{Z}_2$.", "url": "https://arxiv.org/abs/2604.25729", "type": "理论", "summary": "1. 该工作通过改进Frobenius同态构造了具有sl₂-对称性的三重W-代数W_{p+,p-}上的导子，并将Adamović-Milas导子的性质推广至此。\n2. 技术核心在于导子构造自然揭示W_{p+,p-}的sl₂-对称性，且该方法可推广到三重W-超代数SW(m)，进而确定其全自同构群为PSL₂(C)×ℤ₂。\n3. 这为深入理解对数共形场论中W-代数的对称结构提供了代数基础，并对相关顶点算子代数的分类与表示理论有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Hiromu Nakano"}], "featured_authors": [{"name": "Hiromu Nakano"}], "author_count": 1}, {"id": "2604.25785", "category": "math-ph", "title": "Level Crossing in Random Matrices. III. Analogs of Girko's circular and Wigner's semicircle laws", "abstract": "We study the asymptotic distribution of level crossings for random matrix pencils A_n+\\lambda B_n in several ensembles, including complex and real i.i.d. matrices and Gaussian/Hermitian settings. We derive a representation of the normalized log-discriminant in terms of pairwise eigenvalue interactions and formulate conditions under which its limit is governed by a deterministic potential. Under assumptions combining a uniform circular law, logarithmic tail control, and small-spacing (repulsion) estimates, we prove convergence of the empirical measure of level crossings to an explicit deterministic limit. In the complex Gaussian case these assumptions are verified (modulo a uniformity step), while in the general i.i.d. setting the results are conditional and motivated by universality theory. We further analyze the real case, showing that any limiting measure does not concentrate on the real projective line under suitable hypotheses, and discuss analogous phenomena for elliptic/Hermitian ensembles. Our results highlight the role of logarithmic energy and universality in governing spectral degeneracies of random matrix pencils.", "url": "https://arxiv.org/abs/2604.25785", "type": "理论", "summary": "1. 该工作研究随机矩阵束 A_n+λB_n 中水平交叉的渐近分布，通过归一化对数判别式的表示及均匀圆律、对数尾控制与小间距估计，证明了经验测度收敛于显式确定性极限。\n2. 其核心卖点在于将 Girko 圆律和 Wigner 半圆律类比推广至水平交叉谱，在复高斯系综中验证假设，并在一般 i.i.d. 情形下基于普适性理论建立条件性结果，同时分析了实系综与椭圆/Hermitian 系综的对应现象。\n3. 这为理解随机矩阵谱退化的普适行为提供了对数势能与排斥机制的视角，并为后续跨系综水平交叉分布的理论研究明确了动机与框架。", "summary_source": "deepseek", "authors": [{"name": "B.Shapiro"}], "featured_authors": [{"name": "B.Shapiro"}], "author_count": 1}, {"id": "2604.24792", "category": "quant-ph", "title": "Quantum gravimetry with intrinsic quantum time uncertainty", "abstract": "We study quantum gravimetry when the interrogation time carries intrinsic uncertainty, motivated by a fundamental limit on temporal resolution associated with the energy--time uncertainty relation. For linearly gravity-coupled gravimeters, we obtain the effective gravity information by profiling the interrogation time from the two-parameter quantum Fisher information (QFI) matrix. In this class, the time-information block is quadratic in the gravitational parameter, and for quadratic background dynamics, the gravity--time cross term becomes affine in $g$. These properties yield a normalized expression for the fraction of standard single-parameter gravity QFI that remains once interrogation time is treated as a nuisance parameter, with an affine numerator and a Lorentzian denominator. We work out these results in three benchmark models: a freely falling Gaussian wavepacket, the Kasevich--Chu light-pulse atom interferometer, and an idealized closed-unitary optomechanical model. The Gaussian free-fall benchmark yields an exact closed-form expression for the effective gravity information and shows explicitly how nuisance-time profiling suppresses the momentum-spread-dependent part of the standard single-parameter gravity QFI. In the Kasevich--Chu interferometer, internal state population readout gives a rank-deficient measured two-parameter geometry unless independent timing information is supplied, whereas full access to the final motional and internal states restores a full-rank geometry with retention controlled by the competition between initial velocity spread and gravitationally accumulated motion. In atom-interferometric benchmarks, the framework yields explicit conditions for minimizing nuisance-time information loss, together with corresponding constraints on momentum spread, spatial localization, and long-interrogation-time operation.", "url": "https://arxiv.org/abs/2604.24792", "type": "理论", "summary": "1. 该工作研究了内禀量子时间不确定性对量子重力测量的影响，通过两参数量子Fisher信息矩阵分析询问时间作为干扰参数时的重力信息提取。\n2. 技术核心在于揭示时间-重力交叉项在线性耦合下为参数二次型、在二次动力学下为仿射型，从而导出标准单参数重力QFI保留份额的归一化表达式，具有仿射分子与洛伦兹分母。\n3. 这为自由落体高斯波包、Kasevich-Chu原子干涉仪及光机械模型提供了量化条件，以最小化时间干扰导致的信息损失，并指导动量展宽、空间局域化及长询问时间操作的优化。", "summary_source": "deepseek", "authors": [{"name": "Salman Sajad Wani"}, {"name": "Sundus Abdi"}, {"name": "Rushda Naik"}, {"name": "Saif Al-Kuwari"}], "featured_authors": [{"name": "Salman Sajad Wani"}, {"name": "Sundus Abdi"}, {"name": "Rushda Naik"}, {"name": "Saif Al-Kuwari"}], "author_count": 4}, {"id": "2604.24850", "category": "quant-ph", "title": "Emergent prethermal Bethe integrability in a periodically driven Rydberg chain", "abstract": "We study a chain of periodically driven Rydberg atoms and identify a class of drive protocols for which the system exhibits emergent prethermal Bethe integrability at special drive frequencies. We provide a perturbative analytic expression of its Floquet Hamiltonian in the large drive amplitude regime. We demonstrate integrability of the leading term of this Floquet Hamiltonian at special drive frequencies, which we identify, by mapping it to the Hamiltonian of the paradigmatic spin-$1/2$ ${\\rm XXZ}$ chain. We support our analytical results by exact diagonalization studies on finite chains. Our numerical results on level statistics, half-chain entanglement entropy, and longitudinal magnetization of the driven chain brings out its emergent integrable nature at the special drive frequencies which persists up to a large prethermal timescale.", "url": "https://arxiv.org/abs/2604.24850", "type": "理论+数值", "summary": "1. 该工作研究了一维周期驱动里德伯原子链，发现特定驱动频率下系统涌现预热Bethe可积性，并在大幅驱动区给出了Floquet哈密顿量的微扰解析形式。\n2. 其核心在于将Floquet哈密顿量的主导项映射到自旋1/2 XXZ链，从而严格证明其在特定频率处的可积性，数值上的能级统计、纠缠熵与纵向磁化均证实该可积行为持续至长预热时间尺度。\n3. 这为人为调控驱动量子多体系统中的可积性、延长预热态寿命提供了明确的理论依据与实现路径，可推广至其他周期性驱动的强关联平台。", "summary_source": "deepseek", "authors": [{"name": "Saptadip Roy"}, {"name": "Arnab Sen"}, {"name": "Diptiman Sen"}, {"name": "K. Sengupta"}], "featured_authors": [{"name": "Saptadip Roy"}, {"name": "Arnab Sen"}, {"name": "Diptiman Sen"}, {"name": "K. Sengupta"}], "author_count": 4}, {"id": "2604.24854", "category": "quant-ph", "title": "Randomised measurements of a disorder-induced entanglement transition in a neutral atom quantum processor", "abstract": "The development and spread of entanglement in complex quantum systems is central to exploring many-body phenomena out of equilibrium. Measuring entanglement dynamics can shed light on information scrambling and thermalisation, namely on transitions from many-body quantum chaos to localisation in disordered, interacting systems. In quantum computing systems, entanglement entropy and other nonlinear functions of the density matrix have been recently measured, in particular by using the randomised measurement toolbox. However, it is difficult to implement the required arbitrary unitary rotations on specific subsystems without universal local control. Here we devise and demonstrate the measurement of entanglement entropy in a programmable analogue quantum simulator using a randomised measurement protocol that leverages local energy tuning together with a global field to bypass the need for local gate control. We implement this on a commercially available neutral-atom quantum simulator, QuEra's Aquila, and use it to show how programmable disorder in the local Hamiltonian parameters leads to a transition from chaotic to localised entanglement dynamics. Given current decoherence times, we clearly resolve disorder-specific, time-dependent entanglement spreading in small systems. Our work extends the utility of programmable analogue quantum simulators, and opens further opportunities for wider randomised measurement toolboxes in a range of other analogue systems.", "url": "https://arxiv.org/abs/2604.24854", "type": "实验", "summary": "1. 该工作在中性原子可编程模拟量子处理器上利用随机测量协议直接测量纠缠熵，并演示了无序哈密顿量参数导致的从混沌到局域的纠缠动力学转变。\n2. 其技术要点是通过局部能量调节结合全局场实现子系统上的随机幺正操作，从而避免了对局部门控的依赖，成功提取了纠缠熵等非线性可观测量。\n3. 这扩展了可编程模拟量子模拟器的测量能力，并为在其他模拟系统中推广随机测量工具箱以研究非平衡多体物理提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Apollonas S. Matsoukas-Roubeas"}, {"name": "Oscar Scholin"}, {"name": "Lucas Sá"}, {"name": "Arinjoy De"}, {"name": "Majd Hamdan"}, {"name": "Alexei Bylinskii"}, {"name": "Andrew J. Daley"}, {"name": "Dorian A. Gangloff"}], "featured_authors": [{"name": "Apollonas S. Matsoukas-Roubeas"}, {"name": "Oscar Scholin"}, {"name": "Lucas Sá"}, {"name": "Alexei Bylinskii"}, {"name": "Andrew J. Daley"}, {"name": "Dorian A. Gangloff"}], "author_count": 8}, {"id": "2604.24962", "category": "quant-ph", "title": "Use case study: benchmarking quantum breadth-first search for maximum flow problems", "abstract": "The maximum flow problem asks to find the largest possible flow from a source to a sink in a capacitated network. It arises frequently in scheduling, project selection, and as a core subroutine in broader optimisation tasks. Classically, it can be efficiently solved using Dinic's algorithm, which repeatedly performs breadth-first search (BFS) and blocking flow computations on the graph. As a potential candidate for quantum speedups, these BFS subroutines can be naturally replaced with quantum BFS (qBFS), an instantiation of Grover's search algorithm. In this paper, we evaluate the expected performance of qBFS on standard classical datasets. These instances are too large to be solved directly on current quantum hardware, so we adopt a hybrid benchmarking approach: (i) we run a classical implementation of Dinic's algorithm and isolate the runtime of its BFS subroutines; (ii) we analytically estimate the minimum number of quantum cycles required to implement qBFS, where we use the classically logged data. Our results indicate that achieving a practical quantum advantage for realistic problem sizes would translate to quantum gate operation times surpassing physical limitations.", "url": "https://arxiv.org/abs/2604.24962", "type": "数值", "summary": "1. 本文对最大流问题中量子广度优先搜索子例程的执行效率进行了混合基准评估。\n2. 其方法结合经典Dinic算法运行日志与解析估计，量化了量子BFS所需最小周期数。\n3. 结果表明，对实际规模问题实现量子优势需量子门操作时间突破当前物理极限。", "summary_source": "deepseek", "authors": [{"name": "Andreea-Iulia Lefterovici"}, {"name": "Lara Lelakowski"}, {"name": "Michael Perk"}], "featured_authors": [{"name": "Andreea-Iulia Lefterovici"}, {"name": "Lara Lelakowski"}, {"name": "Michael Perk"}], "author_count": 3}, {"id": "2604.24973", "category": "quant-ph", "title": "Approximate Sparse State Preparation with the Grover-Rudolph Algorithm", "abstract": "Sparse quantum state preparation is a common subroutine in quantum algorithms, where classical data with few nonzero entries must be loaded into a quantum state. In this work, we consider the Grover-Rudolph algorithm, which has recently been shown to efficiently prepare sparse states, and we propose two improvements. First, we extend an existing gate-merging procedure by allowing rotations to merge with virtual zero-angle gates on unreachable branches of the preparation tree, reducing the number of CNOTs and control qubits. Second, we introduce an approximate variant in which rotations with similar but not identical angles are merged at the cost of a small, controllable error in the prepared state. We derive a classically computable estimate of the resulting overlap with the target state, which is used to guide the merging decisions.", "url": "https://arxiv.org/abs/2604.24973", "type": "数值", "summary": "1. 该工作改进了Grover-Rudolph算法，通过扩展门合并策略和引入近似变体，实现更高效的稀疏量子态制备。\n2. 主要技术点在于将旋转门与虚拟零角度门在不可达分支上合并以减少CNOT和控制比特，并通过合并相似角度旋转引入可控误差，同时提供经典可计算的保真度估计引导合并。\n3. 这为量子算法中稀疏经典数据的加载提供了实用优化方案，其可控近似误差和可计算保真度估计有助于平衡电路深度与制备精度。", "summary_source": "deepseek", "authors": [{"name": "Debora Ramacciotti"}, {"name": "Martin Steinbach"}, {"name": "Bence Temesi"}, {"name": "Andreea-Iulia Lefterovici"}, {"name": "Antonio F. Rotundo"}], "featured_authors": [{"name": "Debora Ramacciotti"}, {"name": "Martin Steinbach"}, {"name": "Bence Temesi"}, {"name": "Andreea-Iulia Lefterovici"}, {"name": "Antonio F. Rotundo"}], "author_count": 5}, {"id": "2604.25026", "category": "quant-ph", "title": "Networked Realization of Quantum LDPC Codes", "abstract": "Quantum low-density parity-check (QLDPC) codes with good parameters are promising candidates for low-overhead fault-tolerant quantum computing, but their non-local stabilizers require long-range connectivity and frequent qubit movement, introducing practical challenges. Prior work has studied the networked implementation of topological codes, where each node only holds one or a few qubits of the entire code, and demonstrated competitive performance under practical constraints such as the quality of network-provided entanglement. However, since these codes are already geometrically local, such a networked setting might not be essential. In this work, we propose and study the networked implementation of better QLDPC codes, specifically bivariate bicycle codes due to their similarity to surface codes and the controlled amount of long-range connections in their stabilizers. We begin by recreating networked surface codes in Stim, with one code qubit per node, and provide additional insights into their circuit-level noise performance. We then extend this approach to bipartitions of bivariate bicycle codes, using balanced min-cut partitioning on their combined X-Z Tanner graph to identify optimal qubit splits. For stabilizers spanning nodes, we implement teleported CNOTs and vary the Bell pair fidelity enabling these gates. Through circuit-level noise simulations with BP-OSD decoding, we provide the first insights into networked realizations of these codes and compare their performance with monolithic implementations. We conclude by outlining advantages, limitations, and future directions.", "url": "https://arxiv.org/abs/2604.25026", "type": "理论+数值", "summary": "1. 该工作针对量子LDPC码非本地稳定器带来的长程连接与频繁比特移动难题，提出并模拟实现了双变量自行车码的网络化架构，每个网络节点仅持有码的少数量子比特。\n2. 其技术卖点在于利用平衡最小割划分对X-Z联合坦纳图进行最优分割以最小化跨节点稳定器数，并在Stim平台中通过可调保真度贝尔态实现遥传CNOT门，从而支持电路级噪声模拟。\n3. 结合BP-OSD解码器的模拟首次揭示了网络化QLDPC码与单片实现的性能对比，展现了其在有限连接性约束下的实践优势与局限，为低开销容错量子计算架构指明了设计方向。", "summary_source": "deepseek", "authors": [{"name": "Swayangprabha Shaw"}, {"name": "Narayanan Rengaswamy"}], "featured_authors": [{"name": "Swayangprabha Shaw"}, {"name": "Narayanan Rengaswamy"}], "author_count": 2}, {"id": "2604.25048", "category": "quant-ph", "title": "Bohmian Trajectories in a Bistable Potential Well", "abstract": "We analyze the dynamics of a quantum particle in a one-dimensional bistable potential within the framework of Bohm's quantum mechanics. We give arguments that evidence the fallacy of certain claims found in the literature dealing with the impossibility of chaotic behavior of Bohmian trajectories in one-dimensional systems. We find that an appropriate choice for the initial position and wave packet causes the particle to undergo periodic, quasiperiodic, or chaotic motion. The transitions between these regimes occur in a continuos fashion.", "url": "https://arxiv.org/abs/2604.25048", "type": "理论", "summary": "1. 该工作分析了双稳势阱中量子粒子在玻姆框架下的轨迹动力学。\n2. 其卖点在于通过恰当选择初始位置与波包，展示了周期
