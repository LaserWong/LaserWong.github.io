  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);

      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;

      --both: #5d4a99;

      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);

      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }

    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }

    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }

    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }

    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }

    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }

    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }

    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2606.04000", "category": "cond-mat", "title": "SPLIT-PINN: Separable Probability Learning Technique via Physics-Informed Neural Networks for High-Dimensional Probabilistic Modeling", "abstract": "We present a probabilistic modeling framework for incorporating small-scale spatial heterogeneity into macroscopic descriptions of material behavior for polycrystalline metallic materials. Spatially heterogeneous material state fields are represented using probability density functions (PDFs), providing a principled statistical description of microstructural variability and state evolution across different computational polycrystalline realizations. The framework is built on the inverse identification of a probabilistic transport model, formulated as a Liouville equation with an unknown drift term. To enable accurate, stable, and interpretable inference of this drift field in high-dimensional, transport-dominated settings, we develop a Separable Probability Learning Technique via Physics-Informed Neural Networks (SPLIT-PINN). This method incorporates a marginal-correction drift decomposition, orthogonality constraints, and residual-based adaptive training to enhance well-posedness, numerical stability, and physical consistency without imposing restrictive parametric assumptions. Using SPLIT-PINN, the drift field governing the temporal evolution of joint state PDFs is inferred directly from data. After benchmark validation, the framework is applied to physical computational datasets describing the evolution of polycrystalline microstructural states, including von Mises stress, dislocation density, and equivalent plastic strain rate. The learned Liouville model, trained on a single dataset, is subsequently used in forward predictions of the temporal evolution of joint and marginal PDFs for multiple unseen polycrystal realizations. Quantitative comparisons with reference PDFs demonstrate that the proposed framework yields accurate and robust probabilistic predictions and generalizes effectively across datasets.", "url": "https://arxiv.org/abs/2606.04000", "type": "理论+数值", "summary": "1. 该工作针对多晶金属材料，提出了基于物理信息神经网络的可分离概率学习框架，用以高维概率传输模型的逆识别。\n2. 其技术核心在于引入边缘修正漂移分解、正交约束与残差自适应训练，在无需强参数假设下提升反问题的适定性、数值稳定性与物理一致性。\n3. 该框架仅以单一数据集训练所得李乌维尔模型即可泛化预测多个未见过多晶实现的状态概率演化，为材料微观异质性统计建模提供了稳健手段。", "summary_source": "deepseek", "authors": [{"name": "Pouria Behnoudfar"}, {"name": "Deekshith Naidu Ponnana"}, {"name": "Noah J. Schmelzer"}, {"name": "Janith Wanni"}, {"name": "George T. Gray III"}, {"name": "Dan J. Thoma"}, {"name": "Curt A. Bronkhorst"}, {"name": "Nan Chen"}, {"name": "Wenxiao Pan"}], "featured_authors": [{"name": "Pouria Behnoudfar"}, {"name": "Deekshith Naidu Ponnana"}, {"name": "Noah J. Schmelzer"}, {"name": "Curt A. Bronkhorst"}, {"name": "Nan Chen"}, {"name": "Wenxiao Pan"}], "author_count": 9}, {"id": "2606.04005", "category": "cond-mat", "title": "Entropy-Compatible Reconstruction for High-Weissenberg Viscoelastic Flow", "abstract": "Log-conformation and square-root reconstructions preserve positive definiteness in high-Weissenberg viscoelastic simulations, but positivity alone does not guarantee compatibility with the discrete free-energy balance. We identify three reconstruction-level mechanisms by which strictly positive tensors can still generate nonphysical behavior: Jensen-type entropy bias, exponential amplification of logarithmic perturbations in highly stretched states, and sign-indefinite polymeric-work defects caused by using incompatible tensors in stress work and entropy variables. We formulate an entropy-compatible reconstruction principle and a corrected logarithmic reconstruction selected by a least-damping entropy constraint. The correction is local, positive, computable by bisection, spectrally controlled, and compatible with coupled velocity--pressure--conformation time stepping. We prove existence of the maximal admissible parameter, convexity of the entropy profile along the logarithmic path, a compatible free-energy estimate, a defect-budget estimate for noncompatible reconstructions, asymptotic inactivity on high-order admissible defects, and a conditional high-stretch resolution advantage in log-relative and entropy metrics. Reproducible diagnostics compare logarithmic, square-root, and linear reconstructions and verify the predicted entropy defects, work defects, stress-force errors, and high-Weissenberg accumulation.", "url": "https://arxiv.org/abs/2606.04005", "type": "数值", "summary": "1. 本文针对高Weissenberg数粘弹性流动模拟，提出一种熵兼容重构原理及基于最小阻尼熵约束的修正对数重构方法，以解决正定张量在离散自由能平衡中引发的非物理行为。\n2. 该方法通过识别Jensen型熵偏差、高拉伸态对数扰动指数放大及应力功与熵变量中张量不兼容导致的功缺陷三类机制，采用局部、正定、可二分计算且谱控制的熵约束修正，同时保持热力学一致性与高拉伸分辨率优势。\n3. 该工作为高Weissenberg数粘弹性流动的稳定高保真数值模拟提供了具有严格理论保证的重构框架，并可拓展至其他需兼顾构象正定性与离散熵兼容性的连续介质力学问题。", "summary_source": "deepseek", "authors": [{"name": "Sai Peng"}], "featured_authors": [{"name": "Sai Peng"}], "author_count": 1}, {"id": "2606.04012", "category": "cond-mat", "title": "Deformable Charge Dynamics in Biological Environments: An Extended Structural Dynamics Foundation for Biological Electrostatics", "abstract": "The point-charge approximation is one of the most successful idealizations in molecular biophysics, but it becomes strained in strong fields, confined geometries, and crowded aqueous environments. We develop a minimal Extended Structural Dynamics (ESD) model in which charged entities are treated as finite, deformable objects with an internal breathing mode rather than as structureless points. Starting from a Hamiltonian description and a controlled coarse-graining procedure, we derive an effective generalized Langevin equation for the center-of-mass motion. The reduced dynamics contain a memory kernel with three physically distinct contributions: finite-size causal delay, inertial deformation, and crowding-induced deformation. The derivation rests on explicit assumptions of small deformation, local dielectric screening, one dominant internal mode, and adiabatic elimination of the fast structural coordinate. Parameters are determined by independently measurable inputs -- ionic radius, charge, mass, and the high-frequency dielectric constant of water -- with one exception: the dimensionless coupling lambda governing crowding-induced deformation, discussed in detail in the paper. Two primary predictions follow. First, transport through confined geometries should show dynamical deviations from point-charge baselines scaling with ionic deformability, beyond static potential-of-mean-force predictions. Second, polarization response should preserve ionic-radius ordering across alkali ions. Two secondary consequences are identified: a field-dependent effective charge radius and a deformation-dependent correction to near-surface mobility. Amplification of these effects in confined settings is treated as a plausible extension rather than a derived result. The framework recovers standard electrostatic models as limiting cases.", "url": "https://arxiv.org/abs/2606.04012", "type": "理论", "summary": "1. 该工作提出扩展结构动力学模型，将带电实体视为具有内禀呼吸模式的有限可变形体，以克服点电荷近似在强场、受限几何与拥挤水环境中的局限性。\n2. 其技术核心是从哈密顿描述出发经粗粒化导出广义朗之万方程，记忆核包含有限尺寸因果延迟、惯性变形与拥挤诱导变形三项清晰可辨的物理贡献，且所有参数除一个无量纲耦合常数外均由独立可测量输入确定。\n3. 这为预测输运与极化响应偏离点电荷基线的动力学偏差提供了可检验框架，并暗示受限环境下可变形效应的放大作为合理外延，有望启发下一代生物静电学实验与理论修正。", "summary_source": "deepseek", "authors": [{"name": "Patrick BarAvi"}], "featured_authors": [{"name": "Patrick BarAvi"}], "author_count": 1}, {"id": "2606.04042", "category": "cond-mat", "title": "Uncertainty-Aware Symbolic Regression through Bayesian Support Selection", "abstract": "The Sure Independence Screening and Sparsifying Operator (SISSO) framework is a powerful symbolic-regression method for extracting compact and interpretable descriptors from large nonlinear feature spaces. However, standard SISSO is deterministic: it returns a single descriptor and point prediction, without quantifying uncertainty in descriptor selection, regression coefficients, or predictions. Here we introduce a probabilistic extension in which the sure independence screening (SIS) stage is kept deterministic to preserve scalability, while the sparsifying operator (SO) stage is reformulated as Bayesian inference over the SIS-screened support space. The resulting deterministic-SIS/Bayesian-SO framework yields posterior probabilities for competing descriptor supports, feature-inclusion probabilities, Bayesian-model-averaged predictions, and predictive credible intervals, while recovering the deterministic SO descriptor of standard SISSO in the maximum-a-posteriori limit. Applied to an $X_2YZ$ Heusler-alloy magnetic-moment dataset, the approach gives modest improvements in five-fold cross-validation RMSE and near-nominal empirical coverage of the 95$\\%$ predictive intervals. More importantly, the posterior exposes competing, physically related symbolic descriptor families that would appear artificially unique in a deterministic analysis. These results suggest that deterministic-SIS/Bayesian-SO can be used as an uncertainty-aware diagnostic extension of SISSO: a tool for assessing descriptor confidence, stability, and non-uniqueness in small-data materials regression problems.", "url": "https://arxiv.org/abs/2606.04042", "type": "理论", "summary": "1. 本工作将SISSO符号回归框架的稀疏化步骤改造为贝叶斯支持选择，实现描述符选择与预测的不确定性量化。\n2. 其卖点在于保持确定性筛选的可扩展性，同时通过贝叶斯推断获得竞争性描述符家族的后验概率、特征包含概率和预测可信区间。\n3. 这为小数据材料回归问题提供了评估描述符置信度、稳定性和非唯一性的不确定性感知诊断扩展。", "summary_source": "deepseek", "authors": [{"name": "Satadeep Bhattacharjee"}], "featured_authors": [{"name": "Satadeep Bhattacharjee"}], "author_count": 1}, {"id": "2606.04086", "category": "cond-mat", "title": "Quantum String Interactions Revealed by Full Counting Statistics", "abstract": "How quantum strings interact is a basic question for extended objects in quantum many-body physics. Even the simplest hard-core constraint (no crossing), can generate a nontrivial effective potential, whose microscopic form is difficult to determine because the relative distance between the strings is intrinsically nonlocal. Here we show that this nonlocality is naturally captured by full counting statistics (FCS). For two hard-core quantum strings, we derive an analytic FCS expression for the emergent interaction by identifying the virtual process in which the two strings touch and hop back. Using the FCS--entanglement relation, we find the effective potential has the entanglement-controlled asymptotic form $\\ln\\Delta E(r)\\sim -\\pi^2 r^2/(12 S_\\ell)$ up to subleading terms, where $S_\\ell$ is the entanglement entropy between the two halves of a quantum string. We confirm the theory using high-precision numerical calculations and finite-size FCS estimates. Our results reveal FCS as a direct route to effective interactions between quantum topological line-defects, which may also be extended to higher-form charge.", "url": "https://arxiv.org/abs/2606.04086", "type": "理论+数值", "summary": "1. 该工作利用全计数统计（FCS）解析推导了两条硬核量子弦间的有效相互作用势，并给出了纠缠熵控制的渐近形式。\n2. 其核心在于通过识别弦接触与回跳的虚过程，将非局域相对距离自然纳入FCS框架，并建立了FCS与纠缠熵的关系。\n3. 这揭示了FCS作为量子拓扑线缺陷有效相互作用的直接探针，并可推广至更高形式电荷系统的相互作用研究。", "summary_source": "deepseek", "authors": [{"name": "Chang-Yan Wang"}, {"name": "Xue-Feng Zhang"}], "featured_authors": [{"name": "Chang-Yan Wang"}, {"name": "Xue-Feng Zhang"}], "author_count": 2}, {"id": "2606.04187", "category": "cond-mat", "title": "Emergence of Macroscopic Quantum Order via Translational Zero Modes", "abstract": "Macroscopic quantum coherence in solids, such as in superfluids, superconductors, and condensates, is generally limited to low temperatures because order forms within a fixed excitation spectrum whose competing states become thermally populated as temperature rises. Here, we show that strong coupling between electronic excitations and a deformable lattice enables a different route. Above a critical density, this coupling nucleates self generated confining potentials that trap the very excitations generating them. Unlike rigid external traps, these potentials can translate through the host lattice without changing their internal structure, defining a translational zero mode. Coupling to this zero mode provides a shared dynamical coordinate that lowers and isolates a single collective many body configuration, opening a density dependent gap that suppresses thermal occupation of competing states and supports off diagonal long range order at elevated temperatures. As a concrete realization, we identify high-temperature superfluorescence in lead halide perovskites as the radiative instability of this zero mode dressed ordered excitonic state. More broadly, this establishes a general route to macroscopic quantum order: not cooling within a fixed spectrum, nor pairing instabilities, but a self generated mobile confining structure whose translational zero mode reconstructs the many-body spectrum to protect coherence.", "url": "https://arxiv.org/abs/2606.04187", "type": "理论", "summary": "1. 该工作提出一种通过平移零模实现宏观量子有序的新机制，即电子激发与可变形晶格的强耦合自生成可移动约束势。\n2. 其核心物理在于该约束势的平移零模为集体多体态提供共享动力学坐标，打开密度依赖能隙并抑制竞争态的热占据。\n3. 这为理解并设计高温超荧光等宏观量子相干现象提供了超越传统配对不稳定性的普适路径。", "summary_source": "deepseek", "authors": [{"name": "Kenan Gundogdu"}], "featured_authors": [{"name": "Kenan Gundogdu"}], "author_count": 1}, {"id": "2606.04256", "category": "cond-mat", "title": "Morphogenesis driven by nematic defects in active biological networks", "abstract": "Cellular morphogenesis, the process by which biological tissues acquire shape and structure, remains a fundamental challenge in understanding pattern formation and the coordinated remodeling of cellular assemblies. Under appropriate conditions, cytoskeletal filaments can organize into a nematic phase exhibiting partial orientational order. Topological defects within this nematic organization generate localized mechanical stresses that destabilize the tissue and promote deformation and structural rearrangements to relieve internal stresses. We develop a continuum framework that models living tissues as active biological networks represented as nematic polymer networks capable of heterogeneous growth and remodeling. The model captures macroscopic effects through spatial variations in the fiber order parameter which drives the system away from equilibrium. Morphogenesis is described as a sequence of quasi-static equilibrium states governed by the coupling between nematic order, elasticity, stress-driven growth, and adaptive relaxation. Finite element simulations illustrate Hydra regeneration and development when topological defects are prescribed according to the mature organism's expected morphology. The results show that defect topology controls stress localization and shape evolution: $+1$ defects drive protrusion formation, while $-1/2$ defects act as structural stabilizers with minimal growth. By varying the initial defect configuration, we model diverse morphogenetic outcomes, including uniaxial regeneration, tentacle formation, and biaxial development.", "url": "https://arxiv.org/abs/2606.04256", "type": "理论+数值", "summary": "1. 该工作建立连续介质框架，将活性生物网络建模为能异质生长和重塑的向列聚合物网络，并通过有限元模拟描述Hydra再生中缺陷驱动的形态发生。\n2. 核心卖点是揭示向列缺陷拓扑主导应力局域化与形状演化：+1缺陷驱动突起形成，-1/2缺陷抑制生长起结构稳定作用。\n3. 这为利用缺陷拓扑编程调控生物组织形态（如单轴再生、触手形成与双轴发育）提供了可检验的物理机制和理论框架。", "summary_source": "deepseek", "authors": [{"name": "Silvia Paparini"}, {"name": "Giulio G. Giusteri"}, {"name": "L. Angela Mihai"}], "featured_authors": [{"name": "Silvia Paparini"}, {"name": "Giulio G. Giusteri"}, {"name": "L. Angela Mihai"}], "author_count": 3}, {"id": "2606.04331", "category": "cond-mat", "title": "Effect of cations on van der Waals interactions between particles in aqueous alkali nitrate electrolytes", "abstract": "The van der Waals interaction has been extensively studied for colloidal forces and resultant emergent phenomena such as colloidal stability, aggregation, and suspension rheology, but the effect of electrolytes on this interaction, especially at intermediate and high electrolyte concentrations, remains incompletely understood. We have extended the Lifshitz theory for van der Waals interactions in pure water to alkali nitrate solutions at arbitrary concentrations by developing a dielectric response model for alkali nitrate solutions that is based on electronic structure calculations of the molecular constituents. Due to their importance in catalysis, ceramics, and coating technologies, the Hamaker constants for rutile, boehmite, and alumina nanoparticles suspended in alkali nitrate solutions are calculated as a function of salt concentration. Contrary to prevailing assumptions, increasing the concentration of sodium (Na), potassium (K), and rubidium (Rb) nitrate solutions causes appreciable increases of the Hamaker constants relative to pure water instead of decreases, whereas cesium nitrate (CsNO3) has almost no effect on the Hamaker constant. We discussed the influence of the solution molar volume, the polarizability of the dissolved ions, and optical properties of the interacting particles in the context of previously published work. Our study indicates a non-vanishing role of van der Waals interactions on colloidal stability at intermediate and high electrolyte concentrations, leading to physical insights on emergent phenomena associated with nanoparticles.", "url": "https://arxiv.org/abs/2606.04331", "type": "理论+数值", "summary": "1. 该工作将Lifshitz范德华相互作用理论扩展至任意浓度的碱金属硝酸盐溶液，通过建立基于分子电子结构计算的介电响应模型。\n2. 其核心发现是揭示了Na、K、Rb硝酸盐浓度的增加会显著增大纳米颗粒的Hamaker常数，而CsNO₃几乎无影响，与普遍假设相反。\n3. 这提示在中高电解质浓度下范德华相互作用对胶体稳定性具有不可忽略的作用，为相关催化和涂层等领域的涌现现象提供了机理启发。", "summary_source": "deepseek", "authors": [{"name": "Micah P. Prange"}, {"name": "Jaehun Chun"}, {"name": "Gregory K. Schenter"}, {"name": "Elias Nakouzi"}, {"name": "Yihui Wei"}, {"name": "Aurora E. Clark"}, {"name": "Kevin M. Rosso"}, {"name": "Carolyn I. Pearce"}], "featured_authors": [{"name": "Micah P. Prange"}, {"name": "Jaehun Chun"}, {"name": "Gregory K. Schenter"}, {"name": "Aurora E. Clark"}, {"name": "Kevin M. Rosso"}, {"name": "Carolyn I. Pearce"}], "author_count": 8}, {"id": "2606.04533", "category": "cond-mat", "title": "Vibrational model of entropy in dense two-dimensional fluids", "abstract": "A vibrational paradigm of atomic dynamic in dense fluids is known to provide useful insight on the transport and thermodynamic properties of fluids in three dimensions. In this paper, a vibrational model is generalized to describe the excess entropy of two-dimensional (2D) fluids. A simple practical implementation of this model is demonstrated to deliver accurate results for various systems, such as one-component plasmas with Coulomb and logarithmic interactions, a 2D fluid of dipole particles, and a 2D Yukawa fluid. The applicability limits, relevance to three-dimensional fluids, relations to other 2D phenomena, and potential practical applications are briefly discussed.", "url": "https://arxiv.org/abs/2606.04533", "type": "理论", "summary": "1. 该工作将三维稠密流体的振动熵模型推广至二维体系，用于描述二维流体的过量熵。\n2. 其核心在于以简单实用的方式准确处理库仑、对数、偶极及Yukawa等多种二维相互作用系统的过量熵。\n3. 这为理解二维流体热力学性质提供了有效工具，并为进一步拓展至非平衡现象及其他维度体系奠定了基础。", "summary_source": "deepseek", "authors": [{"name": "Sergey Khrapak"}], "featured_authors": [{"name": "Sergey Khrapak"}], "author_count": 1}, {"id": "2606.04605", "category": "cond-mat", "title": "Contact-network organization and motion statistics in shear-thickening suspensions", "abstract": "We use lubricated-flow discrete-element-method (LF-DEM) simulations to examine how contact-network organization shapes particle motion in dense shear-thickening suspensions. The primary system studied is a two-dimensional bidisperse monolayer where rigid clusters are identified by the $(3,3)$ pebble game; three-dimensional simulations are shown to have qualitatively similar rotational velocity statistics. Across the stress--solid-fraction state diagram, frictional contact number, $k\\ge 3$ percolation, and rigid-cluster fluctuations all strengthen in the same region where translational velocity correlations grow, consistent with rigid clusters translating coherently while the surrounding non-rigid particles accommodate a disproportionate share of the local velocity gradient. Rotational motion provides a complementary view: non-affine angular-velocity distributions broaden, near-contact rotations become increasingly anti-correlated, and rigid and non-rigid particles carry distinct statistics. Connectivity, rigidity, and velocity correlations are related but distinct signatures of the constrained collective motion that accompanies shear-thickening and the approach to shear jamming.", "url": "https://arxiv.org/abs/2606.04605", "type": "数值", "summary": "1. 该工作通过润滑流离散元模拟，研究了二维和三维剪切增稠悬浮液中接触网络组织对颗粒运动统计的影响。\n2. 其核心卖点在于利用(3,3)卵石游戏识别刚性团簇，并揭示出平移与旋转非仿射运动中连接性、刚性和速度关联是描述约束集体运动的互补特征。\n3. 这为通过颗粒尺度运动统计来区分剪切增稠与剪切堵塞的微观机制提供了定量框架，并启发未来实验或模拟对类似悬浮液状态的表征。", "summary_source": "deepseek", "authors": [{"name": "Michel Orsi"}, {"name": "Rahul Pandare"}, {"name": "Brolin Adu-Poku"}, {"name": "Bulbul Chakraborty"}, {"name": "Jeffrey F. Morris"}], "featured_authors": [{"name": "Michel Orsi"}, {"name": "Rahul Pandare"}, {"name": "Brolin Adu-Poku"}, {"name": "Bulbul Chakraborty"}, {"name": "Jeffrey F. Morris"}], "author_count": 5}, {"id": "2606.04608", "category": "cond-mat", "title": "Correlated States in Quantum Dot Clusters Coupled to a Common Superconductor", "abstract": "We study an effective model of regular quantum dot clusters coupled to a common superconductor. By applying a canonical transformation, we map the system onto a particle-number-conserving representation, making it directly accessible to standard fermionic neural-network quantum-state variational Monte Carlo methods. We show that the superconducting gap closes at a particular high-symmetry point, which, in finite non-interacting systems, corresponds to crossings between singlet ground states of different character. Combining exact methods, density matrix renormalization group, and neural quantum-state variational Monte Carlo calculations, we identify three distinct interacting regimes: a trivial superconducting singlet phase, a strongly correlated regime connected to an effective Heisenberg model, and a critical intermediate regime with qualitatively different behavior in one and two dimensions. In one-dimensional systems, the intermediate regime exhibits a sequence of singlet-doublet transitions and becomes gapless in the thermodynamic limit even for finite Coulomb interaction. In two-dimensional clusters, we find robust triplet ground states. Furthermore, our results demonstrate that relatively standard fermionic neural quantum states provide an efficient approach for correlated superconducting nanostructures.", "url": "https://arxiv.org/abs/2606.04608", "type": "理论+数值", "summary": "1. 该工作研究耦合至公共超导体的量子点团簇有效模型，通过规范变换映射至粒子数守恒表示，结合精确对角化、密度矩阵重正化群与神经网络变分蒙特卡洛方法求解。\n2. 其核心在于揭示超导能隙在特定高对称点闭合，并识别出平庸超导单态、关联有效海森堡模型及临界中间区三种相互作用区域，一维与二维表现出定性不同的基态行为。\n3. 这为利用标准费米子神经网络量子态高效处理关联超导纳米结构提供了明确路径，并启发对低维量子点阵列中超导-磁性竞争的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Martin Žonda"}, {"name": "Jakub Rękas"}, {"name": "Tobiáš Poláček"}, {"name": "Jana Kodrlová"}, {"name": "Vladislav Pokorný"}, {"name": "Martin Friák"}], "featured_authors": [{"name": "Martin Žonda"}, {"name": "Jakub Rękas"}, {"name": "Tobiáš Poláček"}, {"name": "Jana Kodrlová"}, {"name": "Vladislav Pokorný"}, {"name": "Martin Friák"}], "author_count": 6}, {"id": "2606.04614", "category": "cond-mat", "title": "Curvature-Controlled Infrared Regularization of Crystalline Membranes", "abstract": "We show that negative Gaussian curvature regularizes the infrared sector of crystalline membranes. In a covariant formulation of embedded elasticity, the Green strain contains a symmetry-required linear coupling between the normal phonon and extrinsic curvature. Integrating out the in-plane phonons converts this coupling into a finite quadratic contribution to the inverse flexural response. Anomalous roughening is thereby replaced by curvature-controlled saturation, and the mechanism survives on minimal hyperbolic patches. Hyperbolic geometry preempts anomalous elasticity before the flat infrared regime is reached, implying the absence of a crumpling phase. The same Gaussian-order coupling admits sound propagation in the infrared.", "url": "https://arxiv.org/abs/2606.04614", "type": "理论", "summary": "1. 该工作证明负高斯曲率可调控晶体膜的红外行为，替代反常粗糙化为曲率控制的饱和。\n2. 其核心在于协变弹性表述中格林应变与外在曲率的线性耦合，积分面内声子后产生有限二次曲率项。\n3. 这表明双曲几何在平直红外区前即抑制反常弹性，消除皱折相，并在红外区支持声传播。", "summary_source": "deepseek", "authors": [{"name": "Pablo A. Morales"}, {"name": "Pavel Castro-Villarreal"}], "featured_authors": [{"name": "Pablo A. Morales"}, {"name": "Pavel Castro-Villarreal"}], "author_count": 2}, {"id": "2606.04723", "category": "cond-mat", "title": "Finite-Basis Duality Estimate for the Surface-Code Threshold under Correlated Bit-Flip Errors", "abstract": "We apply finite-basis duality to a statistical-mechanical model introduced by Chubb and Flammia for the surface code under spatially correlated bit-flip noise. Their mapping gives a random-bond Ising model with both two-body edge interactions and four-body face interactions. The single-equation estimate based on the duality analysis is slightly deviated from their Monte Carlo estimate \\(p_c=0.1004(6)\\). Following the finite-basis and graph-polynomial strategy, we instead use periodic and twisted-periodic sectors on toroidal bases. We have obtained an improved estimate of the critical point, $p_c = 0.10348$.", "url": "https://arxiv.org/abs/2606.04723", "type": "理论+数值", "summary": "1. 该工作采用有限基对偶方法，对空间关联比特翻转噪声下表面码的容错阈值给出改进估计，得到临界点p_c=0.10348。\n2. 其技术亮点在于利用环面上的周期与扭曲周期扇区结合图多项式策略，有效处理了随机键伊辛模型中的四体面相互作用，修正了单方程对偶估计的偏差。\n3. 该结果不仅为容错表面码在关联噪声下的阈值研究提供了更精确的理论基准，而且验证了有限基对偶方法处理复杂统计力学模型的可行性。", "summary_source": "deepseek", "authors": [{"name": "Masayuki Ohzeki"}], "featured_authors": [{"name": "Masayuki Ohzeki"}], "author_count": 1}, {"id": "2606.04748", "category": "cond-mat", "title": "Percolation Criticality of Amorphous-Amorphous Transitions in Compressed Glasses", "abstract": "The low-to-high-density transition in compressed silica glass is investigated using percolation theory. Large-scale molecular dynamics simulations of SiO$_2$ glasses, with system sizes of up to 10$^6$ atoms and pressures ranging from 0 to 35 GPa, were carried out to investigate the emergence of structural motifs and their growth to system-spanning length scales under compression. On this basis, we introduced long-range descriptors that complement conventional local and medium-range structural measures. The results reveal critical percolation transitions of SiO$_Z$-SiO$_Z$ clusters with increasing coordination number $Z$. The critical exponents slightly deviate from the standard (random) correlation, a behavior that seems to be more pronounced for higher coordinated polyhedra than for tetrahedra, suggesting a possible rigidity percolation mechanism. SiSi$_z$-SiSi$_z$ clusters were also analyzed using the non-bonded approach. Bonded and non-bonded approaches complement each other in a particularly illuminating way for describing pressure-induced structural transformations and common mechanisms shared by bonded glasses, such as SiO$_2$, and non-bonded glasses, such as amorphous ice.", "url": "https://arxiv.org/abs/2606.04748", "type": "理论+数值", "summary": "1. 该工作通过大规模分子动力学模拟，系统研究了压缩SiO₂玻璃中低密度到高密度非晶-非晶转变的渗流临界行为。\n2. 其核心在于引入长程结构描述符，发现SiO_Z团簇的临界渗流指数偏离标准随机逾渗，且高配位多面体的偏离更显著，暗示存在刚性渗流机制。\n3. 这一发现揭示了键合与非键合玻璃在压力诱导转变中的共通渗流特征，为理解非晶多形转变的临界普适类提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Julien Perradin"}, {"name": "Simona Ispas"}, {"name": "Ricardo V. Paredes"}, {"name": "Anwar Hasmy"}, {"name": "Bernard Hehlen"}], "featured_authors": [{"name": "Julien Perradin"}, {"name": "Simona Ispas"}, {"name": "Ricardo V. Paredes"}, {"name": "Anwar Hasmy"}, {"name": "Bernard Hehlen"}], "author_count": 5}, {"id": "2606.04791", "category": "cond-mat", "title": "Surface Charge Doping for Ion-Pairing Criticality in Confined Electrolytes", "abstract": "Dielectric confinement strengthens Coulomb correlations in quasi-two-dimensional electrolytes and can promote Bjerrum pairing in charge-neutral slits. Here we use a generalized Debye-Huckel-Bjerrum theory to show that weak surface charge changes this picture by stoichiometrically doping the slit with mobile counterions. These counterions maintain a finite screening floor, decouple microscopic pairing from macroscopic ionicity, and shift association-driven criticality to lower temperatures. The critical-temperature suppression collapses onto a single scaled perturbation variable, revealing how surface charge and dielectric confinement jointly control charged nanofluidic slits. Brownian-dynamics tests further show that the same counterions are not always fully bulk-like diffusive: at low intrinsic salt density, explicit wall charge slows in-plane diffusion, whereas at higher intrinsic density the wall-induced diffusion penalty decreases and the mobile-counterion description becomes dynamically accurate. These results identify surface charge as a thermodynamic doping field that tunes both correlated ionic stability and the diffusion mechanism in nanofluidic confinement.", "url": "https://arxiv.org/abs/2606.04791", "type": "理论", "summary": "1. 该工作通过广义Debye-Hückel-Bjerrum理论与布朗动力学模拟，揭示了表面电荷掺杂如何调控受限准二维电解质中的离子配对临界性。\n2. 其核心在于发现弱表面电荷通过掺杂可移动反离子维持有限屏蔽下限，将关联驱动的临界温度抑制统一为一个标度扰动变量。\n3. 这为理解纳米流体狭缝中表面电荷作为热力学掺杂场同时调控离子热力学稳定性和扩散机制提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Na Shen"}, {"name": "Yabei Wu"}, {"name": "Wenqing Zhang"}], "featured_authors": [{"name": "Na Shen"}, {"name": "Yabei Wu"}, {"name": "Wenqing Zhang"}], "author_count": 3}, {"id": "2606.04862", "category": "cond-mat", "title": "Variational approach to determine the properties of dislocations at finite deformation", "abstract": "A generalised version of the continuum theory of curved dislocations describing the spatial and temporal evolution of the fields: statistically stored dislocation density, geometrically necessary dislocation density, and curvature has recently been proposed. The dynamics of the system are derived from a scalar functional of the relevant fields that cannot increase during the evolution of the system. However, the framework was established only for small deformations. The aim of the present paper is to discuss the fundamentals of the elasticity theory of finite deformation in cases where individual dislocations are present in the system. The equilibrium equations are derived within a variational formalism. It is shown that introducing dislocations into the finite deformation framework is a nontrivial task. Moreover, if the deformation is large, the force acting on a dislocation segment is not the well-known Peach-Koehler force. In a forthcoming paper, the results obtained will be applied to the generalisation of the dislocation continuum theory of curved dislocations.", "url": "https://arxiv.org/abs/2606.04862", "type": "理论+数值", "summary": "1. 该工作基于变分形式发展了有限变形下含单个位错弹性理论的基本方程。\n2. 其核心在于揭示大变形时位错段所受作用力不再由经典Peach-Koehler公式描述，且将位错引入有限变形框架本身具非平凡性。\n3. 这为后续推广至包含位错密度与曲率演化的连续位错理论提供了形式基础，并对有限变形位错动力学研究具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "István Groma"}], "featured_authors": [{"name": "István Groma"}], "author_count": 1}, {"id": "2606.04926", "category": "cond-mat", "title": "Adiabatic Ramp Dynamics Across the ETH--MBL Transition in Disordered XXZ Spin Chain", "abstract": "Many-body localization(MBL) provides a mechanism by which isolated interacting quantum systems with disorder can avoid thermalization unlike ergodic systems satisfying the eigenstate thermalization hypothesis(ETH). Many-body localized systems retain signatures of their initial conditions at long times, whereas systems obeying ETH lose such information as they approach thermal equilibrium. Studying Non-equilibrium dynamics across ETH-MBL crossover is an important problem in condensed matter physics. Adiabatic control of parameters in interacting disordered systems provides a powerful framework to investigate MBL phases and their dynamical robustness. Using exact diagonalization and time-dependent numerical methods we study the effects of adiabatically ramped interactions in a disordered spin-1/2 XXZ chain, a paradigmatic model for exploring the many-body localization transition. By monitoring diagonal entropy density and entanglement entropy density growth across various ramp speeds, and system sizes. Our study incorporates Finite-size effects of spectral observables to probe the transition between ergodic and localized phases. The numerical results show that localized dynamical behavior remains largely intact under sufficiently slow ramp evolution, while increasing the driving rate promotes stronger excitation generation and larger entropy growth. This trend highlights the strong dependence of nonequilibrium adiabatic dynamics in disordered interacting quantum many-body systems.", "url": "https://arxiv.org/abs/2606.04926", "type": "理论+数值", "summary": "1. 该论文通过精确对角化和含时数值方法，研究无序XXZ自旋链中跨越ETH-MBL转变的绝热斜坡动力学。\n2. 其技术要点在于监测对角熵密度与纠缠熵密度在不同斜坡速度和系统尺寸下的增长，并结合谱量有限尺寸效应探测遍历-局域相变。\n3. 结果揭示慢斜坡下局域行为基本保持，快斜坡则促进激发产生与熵增长，突显驱动速率对无序量子多体系统非平衡绝热动力学的关键调控。", "summary_source": "deepseek", "authors": [{"name": "Nidhi Kumari"}, {"name": "Vinod Ashokan"}], "featured_authors": [{"name": "Nidhi Kumari"}, {"name": "Vinod Ashokan"}], "author_count": 2}, {"id": "2606.04936", "category": "cond-mat", "title": "Stabilizing the parquet problem", "abstract": "We systematically analyze the stability of the iterative solution of the parquet equations by studying the spectrum of the Jacobian associated with the commonly used damped fixed-point iteration procedure. In this context, we provide an explicit criterion that determines when the physical fixed point of the parquet iteration becomes unstable. Importantly, we demonstrate that misleading convergence issues, observed in parquet calculation at intermediate-to-high interaction values, are not restricted to parameter regions where the two-particle irreducible vertex diverges, but can also arise in absence of vertex divergences. Hence, the misleading convergence issues of parquet-based algorithms are not directly caused by the crossings of two solutions of the (multivalued) Luttinger-Ward functional, that are associated with vertex divergences. Building on these insights, we introduce a controlled stabilization strategy that allows the convergence to the physical solution in the instability regimes. We apply this procedure to the zero-point model and the Hubbard model in the atomic limit, where we successfully stabilize the physical solution deep in the non-perturbative regime, even across multiple divergence lines.", "url": "https://arxiv.org/abs/2606.04936", "type": "理论+数值", "summary": "1. 该工作通过Jacobian谱分析系统研究了parquet方程迭代解的稳定性，并给出了物理不动点失稳的明确判据。\n2. 其关键发现是中间到强耦合区内的误导性收敛问题并非源于双粒子不可约顶点的发散，因此提出了不受顶点发散线约束的受控稳定化策略。\n3. 这为强关联电子系统非微扰区的自洽计算提供了可靠算法基础，可推广至多轨道及更复杂相互作用的数值求解。", "summary_source": "deepseek", "authors": [{"name": "Herbert Eßl"}, {"name": "Stefan Rohshap"}, {"name": "Marcel Gievers"}, {"name": "Markus Wallerberger"}, {"name": "Alessandro Toschi"}, {"name": "Anna Kauch"}], "featured_authors": [{"name": "Herbert Eßl"}, {"name": "Stefan Rohshap"}, {"name": "Marcel Gievers"}, {"name": "Markus Wallerberger"}, {"name": "Alessandro Toschi"}, {"name": "Anna Kauch"}], "author_count": 6}, {"id": "2606.04948", "category": "cond-mat", "title": "Many body localization in Disordered One-Dimensional Fermi-Hubbard Model", "abstract": "We investigate the non-equilibrium dynamics of the disordered one-dimensional Fermi-Hubbard model with a focus on many-body localization. The system is initialized in a charge-density-wave-state, and its time evolution is analyzed through sublattice imbalance (spin and charge), and bipartite entanglement entropy. A clear crossover from ergodic to non-ergodic behavior is observed with increasing disorder strength. In the weak disorder regime, rapid decay of imbalance and the fast growth of entanglement indicate efficient thermalization. In contrast, a strong disorder leads to persistent imbalance and slow dynamics, signaling the breakdown of ergodicity. The charge and spin sectors exhibit distinct relaxation behavior, providing evidence for partial decoupling between these degrees of freedom. Furthermore, in the interacting regime, the entanglement entropy shows slow logarithmic growth, reflecting the dephasing-driven dynamics characteristic of the many-body localized phase. These results highlight the interplay between disorder and interactions in determining the dynamical properties of the system and establish robust signatures of many-body localization in the Fermi-Hubbard model.", "url": "https://arxiv.org/abs/2606.04948", "type": "理论", "summary": "1. 该工作通过对一维无序Fermi-Hubbard模型电荷密度波初态的非平衡动力学模拟，利用子晶格失衡与纠缠熵刻画了从热化到多体局域化的交叉行为。\n2. 其核心发现是电荷与自旋自由度呈现不同的弛豫行为，揭示了强无序下二者部分退耦合的物理机制，且纠缠熵呈现对数增长。\n3. 这为在Fermi-Hubbard模型中确立多体局域化的普适特征提供了数值证据，并启示了无序相互作用体系中自由度选择退耦合的动力学效应。", "summary_source": "deepseek", "authors": [{"name": "Harmanjeet Kaur"}, {"name": "Vinod Ashokan"}], "featured_authors": [{"name": "Harmanjeet Kaur"}, {"name": "Vinod Ashokan"}], "author_count": 2}, {"id": "2606.04953", "category": "cond-mat", "title": "Electron-Phonon Coupling and Charge Density Wave Instabilities in W2N and Halogen-Functionalized W2N Monolayers", "abstract": "The interplay between charge-density-wave (CDW) order and superconductivity is a central problem in condensed-matter physics because both phenomena often originate from the same electron-phonon coupling (EPC) mechanism. Here, we investigate the structural, electronic, vibrational, and superconducting properties of monolayer W2N and halogen-functionalized W2N (W2NF2 and W2NCl2) using first-principles calculations. Pristine W2N exhibits pronounced phonon instabilities near the M and K points driven by exceptionally strong EPC associated with softened low-frequency phonons. The coincidence between phonon softening and enhanced phonon linewidths identifies the instability as EPC-driven and indicative of a CDW tendency. Inclusion of van der Waals interactions stabilizes the lattice and yields strong-coupling superconductivity with {\\lambda} = 1.00 and Tc = 13.2 K, while fluorination further weakens the soft-phonon anomaly, resulting in a moderate-coupling superconductor with {\\lambda} = 0.67 and Tc = 5.3 K. In contrast, W2NCl2 exhibits a re-emergence of CDW-related phonon softening that can be continuously suppressed by compressive strain or electron doping. Under -3% compressive strain, the EPC constant decreases from {\\lambda} = 1.35 to {\\lambda} = 0.71, giving rise to superconductivity with Tc = 5.8 K. Across the entire W2N family, the low-energy physics is governed by softened ZA phonons near the M point, establishing a unified framework in which CDW order and superconductivity emerge as competing manifestations of the same soft-phonon-driven EPC mechanism.", "url": "https://arxiv.org/abs/2606.04953", "type": "数值", "summary": "1. 该工作利用第一性原理计算研究了单层W2N及卤素功能化衍生物（W2NF2与W2NCl2）中电荷密度波不稳定性与超导电性的竞争关系。\n2. 核心发现是软化的ZA声子模在M点附近极强的电子-声子耦合驱动CDW倾向，而氟化或压缩应变可抑制该软模异常并诱导超导，统一框架下两者源于同一机制。\n3. 这为在二维过渡金属氮化物家族中通过应变和掺杂调控CDW与超导的相互转换提供了明确模型系统。", "summary_source": "deepseek", "authors": [{"name": "Jakkapat Seeyangnok"}, {"name": "Udomsilp Pinsook"}], "featured_authors": [{"name": "Jakkapat Seeyangnok"}, {"name": "Udomsilp Pinsook"}], "author_count": 2}, {"id": "2606.04954", "category": "cond-mat", "title": "Triangular Charge-Density Waves (T-CDW) Stabilize Janus Group-VI Chalcogenide Hydrides", "abstract": "Hydrogenation is an effective strategy for enhancing electron--phonon coupling (EPC) and superconductivity in two-dimensional materials. However, excessively strong EPC can also induce lattice instabilities, leading to charge-density-wave (CDW) formation and structural phase transitions. Here, using first-principles calculations, we investigate CDW order in the Janus transition-metal chalcogenide hydrides 1T-WSH and 1T-WSeH. We find that the high-symmetry phases exhibit pronounced phonon softening at the M point, driving a transition to a commensurate $2\\times2$ distorted structure characterized by an emergent triangular charge-density-wave (T-CDW) pattern. Analysis of the electronic structure, susceptibility, and phonon spectrum reveals that the instability is not driven by conventional Fermi-surface nesting but originates from strong momentum-dependent EPC. The T-CDW transition reconstructs the electronic structure and reduces the density of states at the Fermi level, leading to a substantial renormalization of the EPC strength. Consequently, the electron--phonon coupling constants decrease from $\\lambda=2.04$ to $1.50$ in 1T-WSH and from $\\lambda=3.94$ to $1.06$ in 1T-WSeH, while superconductivity remains robust in CDW phase with predicted transition temperatures of $T_c=12.28$ K and $7.75$ K, respectively. Together with previous results for MoSH and MoSeH, our findings establish a universal mechanism in the 1T-$MCH$ family ($M=\\mathrm{Mo},\\mathrm{W}$ and $C=\\mathrm{S},\\mathrm{Se}$), where the primary role of the T-CDW phase is not to eliminate superconductivity but to stabilize the lattice through EPC renormalization. The T-CDW phase therefore acts as an intrinsic self-stabilizing response that relieves excessively strong EPC while preserving phonon-mediated superconductivity.", "url": "https://arxiv.org/abs/2606.04954", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算，研究了Janus硫族氢化物1T-WSH与1T-WSeH中三角电荷密度波（T-CDW）的序参量及其对超导电性的影响。\n2. 其核心发现是T-CDW并非源于常规费米面嵌套，而是由动量依赖的强电子-声子耦合驱动，并通过重整化将耦合常数从2.04降至1.50（WSH）和3.94降至1.06（WSeH），同时保留超导转变温度12.28K和7.75K。\n3. 这表明T-CDW作为自稳定响应在1T-MCH族（M=Mo,W; C=S,Se）中普遍存在，为理解强电子-声子耦合体系中超导与电荷序的竞争与协同提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Jakkapat Seeyangnok"}, {"name": "Udomsilp Pinsook"}, {"name": "Graeme J. Ackland"}], "featured_authors": [{"name": "Jakkapat Seeyangnok"}, {"name": "Udomsilp Pinsook"}, {"name": "Graeme J. Ackland"}], "author_count": 3}, {"id": "2606.04973", "category": "cond-mat", "title": "SLUSCHI-UP: A Web Infrastructure for SLUSCHI Melting-Temperature Calculations Using Universal Machine-Learning Interatomic Potentials", "abstract": "Melting temperature is a critical property for high-temperature materials design, but first-principles melting calculations based on finite-temperature molecular dynamics can require substantial computational resources. The SLUSCHI method reduces this cost by using small-cell solid--liquid coexistence simulations and statistical analysis of many short molecular-dynamics trajectories. Here I present SLUSCHI-UP, a deployed web service for atomistic melting-temperature estimation that couples the SLUSCHI workflow to selectable pretrained universal machine-learning interatomic potentials (uMLIPs) and asynchronous GPU execution. Users submit a crystal structure through a Materials Project identifier or POSCAR input, select a uMLIP backend, and launch a queued melting calculation without local installation of simulation software. The current production interface supports mace-mpa-0-medium, Allegro-OAM-L, and DPA-3.2-5M-OMat24, while beta deployments expose additional models. On the compact MeltBench-10 validation set, the three production backends produce raw coexistence mean absolute errors in the range of approximately 178--327 K. Across the broader set of materials tested so far in MeltBench, the current deployed-job snapshot contains 119 raw uMLIP entries, and PBE-corrected Allegro-OAM-L predictions reach a mean absolute error of approximately 166 K. These values should be interpreted as screening-level infrastructure validation rather than a definitive ranking of uMLIPs. The results demonstrate that SLUSCHI-UP provides a practical, provenance-aware deployment layer between fast scalar melting-temperature predictors and much more expensive first-principles coexistence calculations, while retaining the usual limitations of uMLIP transferability, finite-size sampling, and high-temperature trajectory stability.", "url": "https://arxiv.org/abs/2606.04973", "type": "理论+数值", "summary": "1. 该工作部署了SLUSCHI-UP网络基础设施，将SLUSCHI小晶胞固液共存方法与可选择的预训练通用机器学习原子间势及异步GPU执行相结合，用于材料熔点计算。\n2. 其技术卖点在于用户通过材料项目标识符或POSCAR输入提交晶体结构后，可选取mace-mpa-0-medium等势后端，无需本地软件安装即启动队列计算，在MeltBench-10验证集上原始共存平均绝对误差约178–327 K，PBE校正后Allegro-OAM-L达约166 K。\n3. 该平台为高通量材料筛选提供了介于快速标量预测器与昂贵第一性原理计算之间的实用部署层，但需注意势函数可转移性、有限尺寸采样及高温轨迹稳定性等固有局限。", "summary_source": "deepseek", "authors": [{"name": "Qi-Jun Hong"}], "featured_authors": [{"name": "Qi-Jun Hong"}], "author_count": 1}, {"id": "2606.04976", "category": "cond-mat", "title": "Effective and Floquet Hamiltonians for High Frequency Driving and Floquet-induced Heating in Quantum Spin Chains", "abstract": "We study the non-equilibrium dynamics of a disordered periodically driven quantum spin chain, with the competition between the interaction, disorder, and Floquet driving being of particular interest. We study dynamics of entanglement entropy, energy absorption to characterize dynamical regimes of the system whether it stays in the Floquet-MBL(many-body localization) region or thermalized region. Starting with a product state in the computational basis, followed by reduced density matrix which in turn gives rise to the entanglement entropy density. With the strength of the interaction, the transverse field, the parallel field, the disorder strength W and the driving frequency, we discover the distinct behaviors of fast delocalization and logarithmic entanglement growth and long-lasting memory of the initial state, indicative of localized or prethermal Floquet regimes. We observe that strong disorder arrests transport and enables slow entanglement dynamics, whereas strong driving frequency arrests energy absorption and creates a long-lived non-equilibrium state. Conversely, weak disorder or low driving frequency leads to delocalization. The outcomes show strong support for non-equilibrium phases in driven many-body systems.", "url": "https://arxiv.org/abs/2606.04976", "type": "理论", "summary": "1. 本文通过研究无序周期驱动量子自旋链中纠缠熵和能量吸收的动力学，区分了Floquet多体局域化与热化区域。\n2. 其卖点在于发现强驱动频率可抑制能量吸收并延拓非平衡态寿命，而强无序则阻碍输运导致缓慢纠缠增长，从而支持预热Floquet相的存在。\n3. 这为驱动多体系统中非平衡相与Floquet诱导加热之间的竞争机制提供了定量依据，并启发对高频驱动下局域化行为的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Mayukh Bandyopadhyay"}, {"name": "Vinod Ashokan"}], "featured_authors": [{"name": "Mayukh Bandyopadhyay"}, {"name": "Vinod Ashokan"}], "author_count": 2}, {"id": "2606.05013", "category": "cond-mat", "title": "Coherent State Path Integral Monte Carlo", "abstract": "We propose a new quantum simulation method for a many body quantum liquid of identical particles at finite (non-zero) temperature. The new scheme expands the high temperature density matrix on the overcomplete set of single particles coherent states of John Rider Klauder instead of the usual plane waves as in conventional path integral methods. One is free to tune the elastic constant and/or the mass of the harmonic oscillator subtending the coherent states so as to maximize the computational efficiency of the algorithm. We prove that in the limit of an extremely stiff harmonic oscillator the results for the internal energy tends towards the correct expected values. Moreover we suggest that a stiff harmonic oscillator could allow the use of larger (imaginary) timesteps. This additional degree of freedom is the characteristic feature of our new algorithm and is not available in more conventional path integral methods.", "url": "https://arxiv.org/abs/2606.05013", "type": "数值", "summary": "1. 该工作提出一种基于相干态路径积分的蒙特卡洛方法，用于有限温度下全同粒子的量子液体模拟。\n2. 其技术核心在于利用过完备单粒子相干态展开密度矩阵，通过可调谐振子弹性常数与质量参数优化计算效率，并证明硬谐振子极限下内能收敛且允许更大虚时间步长。\n3. 这为有限温度量子多体系统的高效模拟提供了超越传统路径积分方法的额外自由度，启发了算法设计与连续介质计算的应用方向。", "summary_source": "deepseek", "authors": [{"name": "Riccardo Fantoni"}], "featured_authors": [{"name": "Riccardo Fantoni"}], "author_count": 1}, {"id": "2606.05033", "category": "cond-mat", "title": "Crossover from Rabi oscillations to adiabatic population switching in the Faraday optical control of quantum dot spins", "abstract": "Stimulated Raman transitions in Faraday geometry allow for simultaneous single-shot qubit readout and qubit control. It involves driving an unbalanced $\\Lambda$ system via an auxiliary excited state. Due to the simultaneous driving of both transitions with unequal detuning, the resulting time-dependent Stark shift gives rise to additional resonance conditions beyond the conventional picture. We identify a distinct regime in which repeated passages through avoided crossings lead to step-like population inversion arising from Landau-Zener-Stückelberg interference. By changing the detuning beatnote, we demonstrate a controlled continuous crossover from Rabi-like oscillations to adiabatic population switching. These findings establish the oscillating Stark shift as a mechanism for engineering and controlling spin dynamics in Faraday geometry.", "url": "https://arxiv.org/abs/2606.05033", "type": "理论+数值", "summary": "1. 该工作在法拉第几何下利用受激拉曼跃迁驱动不平衡Λ系统，通过时间相关斯塔克位移诱导的附加共振条件，识别出由朗道-齐纳-施特克尔贝格干涉导致的阶梯状布居反转新区域。\n2. 其核心机制在于通过调控失谐节拍，实现从拉比振荡到绝热布居切换的受控连续交叉，揭示了振荡斯塔克位移作为自旋动力学工程工具的优势。\n3. 这为法拉第几何中基于光学斯塔克效应的自旋态操控和量子比特读出提供了可调谐方案，有助于发展固态自旋的量子控制与测量技术。", "summary_source": "deepseek", "authors": [{"name": "Jan M. Kaspari"}, {"name": "Zhe Xian Koong"}, {"name": "Dorian A. Gangloff"}, {"name": "Michał Gawełczyk"}, {"name": "Doris E. Reiter"}], "featured_authors": [{"name": "Jan M. Kaspari"}, {"name": "Zhe Xian Koong"}, {"name": "Dorian A. Gangloff"}, {"name": "Michał Gawełczyk"}, {"name": "Doris E. Reiter"}], "author_count": 5}, {"id": "2606.05057", "category": "cond-mat", "title": "Bulk and surface excitons in the van der Waals magnet CrSBr: Magneto-optical studies to 55 tesla", "abstract": "In thin layers of the 2D magnetic semiconductor CrSBr, very recent studies identified two distinct band-edge optical resonances, believed to arise from distinguishable bulk and surface excitons. This behavior reportedly originates from the highly anisotropic nature of CrSBr -- particularly in its antiferromagnetic state -- where excitons are effectively confined within individual monolayers, such that excitons in the two surface layers \"see\" a different local dielectric environment and have a lower resonance energy. To explore this scenario, here we investigate optical absorption properties of few-layer CrSBr in magnetic fields. In addition to the fundamental exciton resonance at ~1.36eV, we observe an absorption resonance ~20 meV lower in energy. Compared to the fundamental transition, this resonance redshifts only half as much in small magnetic fields that induce ferromagnetic order, while in high fields to 55T it exhibits a smaller diamagnetic shift. Both behaviors point to distinguishable populations of bulk and surface excitons in CrSBr.", "url": "https://arxiv.org/abs/2606.05057", "type": "理论", "summary": "1. 该工作通过高达55特斯拉的磁光吸收实验，鉴别了二维磁性半导体CrSBr少层中能量相差约20meV的体激子和表面激子。\n2. 其核心在于利用低场诱导铁磁序时表面激子红移减半与高场抗磁位移更小的对比，证实了表面层激子受局域介电环境调控的物理图像。\n3. 这为利用高各向异性范德华磁体中表界面效应调控激子行为提供了明确途径，并启示磁场可作为区分其本征体态与表面态的灵敏探针。", "summary_source": "deepseek", "authors": [{"name": "Junho Choi"}, {"name": "Yihyun Moon"}, {"name": "Doohyeon Lee"}, {"name": "Iva Plutnarova"}, {"name": "Zdenek Sofer"}, {"name": "Vinod M. Menon"}, {"name": "Scott A. Crooker"}], "featured_authors": [{"name": "Junho Choi"}, {"name": "Yihyun Moon"}, {"name": "Doohyeon Lee"}, {"name": "Zdenek Sofer"}, {"name": "Vinod M. Menon"}, {"name": "Scott A. Crooker"}], "author_count": 7}, {"id": "2606.05065", "category": "cond-mat", "title": "Mechanoluminescence in crystalline inorganic materials: local disorder and the elastic distortion hypothesis", "abstract": "In this exploratory work, we aim to understand the mechanoluminescence (ML) phenomenon manifested by various inorganic compounds by focusing on the influence of mechanical loading on local distortion and loss of symmetry at active sites. To this end, we have analyzed the elastic deformation of several relevant crystalline phases and shown, through a kinematic analysis based on elastic constants, that the loading-induced distortion is smaller than, but remains comparable in magnitude to, the intrinsic structural distortion as quantified by the Baur descriptor. Although the structural distortion has previously been proposed as a structural fingerprint of the ML potential of a compound, it is by nature a static parameter, and must be supplemented by a dynamic distortion contribution that develops under mechanical load. By approximating the crystal deformation by that of simple polygonal motifs, we have been able to propose a rationale for otherwise puzzling observations: in particular, the marked differences in sensitivity to hydrostatic pressure and to shear, the appearance of an intense ML peak upon unloading in certain compounds, and the contrast in behavior depending on whether the preliminary UV irradiation is performed under load or at rest.", "url": "https://arxiv.org/abs/2606.05065", "type": "理论", "summary": "1. 该工作通过基于弹性常数的运动学分析，考察了无机晶体机械发光中机械加载对活性位点局部畸变与对称性丧失的影响。\n2. 其核心论点是静态结构畸变需辅以加载诱导的动态畸变贡献，并利用多边形晶体变形近似统一解释了压力与剪切敏感性差异、卸载发光峰及辐照时机效应。\n3. 这一弹性畸变假说为机械发光动力学提供了可定量检验的框架，并引导未来材料设计需关注静态畸变与加载路径耦合的动态构型。", "summary_source": "deepseek", "authors": [{"name": "T. Rouxel"}, {"name": "X. Rocquefelte"}, {"name": "S. Tanabe"}], "featured_authors": [{"name": "T. Rouxel"}, {"name": "X. Rocquefelte"}, {"name": "S. Tanabe"}], "author_count": 3}, {"id": "2606.05095", "category": "cond-mat", "title": "Soliton-antisoliton pairs in the supersymmetric gapped phase of an interacting Majorana chain", "abstract": "A strongly interacting chain of Majorana fermions realizes the supersymmetric tricritical Ising phase, with supersymmetry (SUSY) extending into a symmetry-broken ordered phase adjacent to the tricritical point. Although the signatures of SUSY at the tricritical point are well understood, their behavior in the gapped phase remains less clear. Here, we address two key questions: how SUSY manifests in the gapped phase and what is the nature of the excitations in this phase. We show that, in the thermodynamic limit, a conventional SUSY diagnostic that remains finite at the tricritical point diverges immediately on the Ising side, yet decays continuously to zero deeper in the gapped phase, signaling the persistence of SUSY. Focusing on the lowest excited states in the supersymmetric gapped regime, we find that the excitations consist of soliton-antisoliton pairs separating distinct ordered regions. Each soliton binds an emergent localized Majorana mode, and together the pair forms a nonlocal Dirac fermion. The occupation of this Dirac mode distinguishes eigenstates with even and odd fermion parity.", "url": "https://arxiv.org/abs/2606.05095", "type": "理论", "summary": "1. 本文解析研究了相互作用Majorana链中超对称能隙相的最低激发态，发现其为分隔不同有序区的孤子-反孤子对。\n2. 每个孤子束缚局域Majorana模，对构成非局域Dirac费米子，占据态区分偶奇费米子宇称；超对称诊断在热力学极限下从临界点发散并连续衰减至能隙深处，标志超对称持续存在。\n3. 这为理解强关联Majorana体系中超对称的非临界涌现及拓扑激发提供了清晰物理图像，并启示了在量子模拟平台探测此类孤子对及Majorana模的可行路径。", "summary_source": "deepseek", "authors": [{"name": "Alberto Nocera"}, {"name": "Mobin Shakeri"}, {"name": "Armin Rahmani"}, {"name": "Ian Affleck"}], "featured_authors": [{"name": "Alberto Nocera"}, {"name": "Mobin Shakeri"}, {"name": "Armin Rahmani"}, {"name": "Ian Affleck"}], "author_count": 4}, {"id": "2606.05128", "category": "cond-mat", "title": "Quantum Hall effect in vacancy-engineered $β$-Ag$_2$Te", "abstract": "Accessing surface quantum transport in topological insulators is hampered by residual bulk conduction arising from lattice defects. Here, we demonstrate a novel synthesis pathway for realizing high mobility $\\beta$-Ag$_2$Te thin films where surface transport is dominant. An \\textit{in-situ} vacancy engineering step as part of the molecular beam epitaxy growth process acts to modify the stoichiometry and suppress donor-type defects, enabling continuous tuning of the sheet carrier density over more than an order of magnitude through the charge-neutrality point without an external gate electrode. In the lower-carrier-density films, a fully developed $\\nu=1$ quantum Hall state is observed, and Landau-level energies extracted across samples collapse onto the $E_N=v_\\mathrm{F}\\sqrt{2e\\hbar NB}$ relation, providing evidence for the massless Dirac dispersion of the top and bottom surface states. These results establish stoichiometry-driven vacancy engineering as a versatile lithography- and gate-free approach to accessing quantum Hall transport in epitaxial topological-insulator thin films.", "url": "https://arxiv.org/abs/2606.05128", "type": "理论", "summary": "1. 该工作通过分子束外延中的原位空位工程制备高迁移率β-Ag₂Te薄膜，调控化学计量比抑制施主型缺陷，使表面输运主导并实现量子霍尔效应。\n2. 其核心在于无需外部栅极即可连续调节二维载流子密度超过一个数量级并穿过电荷中性点，低密度样品呈现完整ν=1量子霍尔态，且朗道能级严格服从E_N=v_F√(2eℏNB)关系，证实了顶底面表面态的无质量狄拉克色散。\n3. 这为拓扑绝缘体薄膜中无需光刻和静电栅极的量子霍尔输运研究提供了通用方法，并表明空位工程可推广至其他拓扑体系以精确控制电子性质。", "summary_source": "deepseek", "authors": [{"name": "Mizuki Ohno"}, {"name": "Veronica Show"}, {"name": "Reiley Dorrian"}, {"name": "Joseph Falson"}], "featured_authors": [{"name": "Mizuki Ohno"}, {"name": "Veronica Show"}, {"name": "Reiley Dorrian"}, {"name": "Joseph Falson"}], "author_count": 4}, {"id": "2606.05147", "category": "cond-mat", "title": "MicroCup: A Cryogenic Specimen Preparation Strategy for Atom Probe Tomography of Organic Molecular Liquids", "abstract": "Atom probe tomography (APT) of organic molecular liquids is limited by poorly reproducible specimen geometry, reduced milling rates, and beam sensitivity during cryo-FIB preparation. Here we introduce a MicroCup strategy that confines liquids in a FIB-prepared nanoscale cavity prior to phase separation, reduces deposited volume to increase preparation throughput, enables reproducible specimen geometry, and minimizes beam exposure in the region of interest. Using the liquid crystals 4'-octyl-4-cyanobiphenyl (8CB) and 4'-octyloxy-4-cyanobiphenyl (8OCB) as model systems, we establish stable and reproducible field evaporation conditions, enabling the detected intact ion molecular preservation above 70% in smectic-like phases with interpretable fragmentation behavior. Comparative analysis further shows that the oxygen atom in 8OCB promotes preferential cleavage pathways associated with bond polarization under high electric fields. By inducing partial crystallization within the MicroCup cavity, distinct regions could be resolved: 8CB shows broadly similar evaporation behavior across crystalline and amorphous regions, whereas 8OCB exhibits clearer regional contrast, with smectic-like regions dominated by intact molecular or large fragments and crystalline domains producing small alkyl fragments and ether-type species. These results provide spatially resolved evidence of a solid-liquid interface in a freeze-prepared organic liquid by APT and establish a reproducible workflow for probing local phase behavior in soft materials.", "url": "https://arxiv.org/abs/2606.05147", "type": "理论+数值", "summary": "1. 该工作提出一种名为MicroCup的低温样品制备策略，用于有机分子液体的原子探针断层扫描分析。\n2. 其技术核心在于利用FIB制备纳米腔体限制液体并控制相分离，实现高于70%的完整分子离子保存率与可解释的碎裂行为。\n3. 通过揭示液晶中氧原子诱导的优先裂解路径及结晶与非晶区域的蒸发对比，为软物质中固液界面的空间分辨研究建立了可重复的工作流程。", "summary_source": "deepseek", "authors": [{"name": "Kuan Meng"}, {"name": "Florian Groll"}, {"name": "Sebastian Eich"}, {"name": "Guido Schmitz"}], "featured_authors": [{"name": "Kuan Meng"}, {"name": "Florian Groll"}, {"name": "Sebastian Eich"}, {"name": "Guido Schmitz"}], "author_count": 4}, {"id": "2606.05164", "category": "cond-mat", "title": "Floquet-Engineered Parity Anomaly Staircase in a Cold Atom Dirac Lattice", "abstract": "We propose a Floquet-engineered cold atom realization of a parity anomaly inspired anomalous Hall staircase in a two dimensional $\\pi$-flux lattice. The effective model hosts massive Dirac fermions generated by the combined action of a time reversal symmetry breaking Floquet mass and a static inversion breaking mass offset. An additional momentum dependent scalar displacement term shifts different Dirac sectors in opposite energy directions without modifying their Bloch eigenvectors. As a result, the Berry curvature contribution associated with individual massive Dirac sectors can be selectively occupied, allowing the anomalous Hall response to evolve stepwise as a function of chemical potential or scalar displacement term. Evaluating the full lattice Berry curvature integral, we find plateau-like responses near $0$, $e^2/2h$, and $e^2/h$, corresponding respectively to the activation of zero, one, and two effective massive Dirac sector contributions. We analyze the associated low energy Dirac theory, band topology, Berry curvature structure, and two parameter response maps, and discuss a possible realization using Raman-assisted tunneling, off-resonant Floquet driving, and auxiliary AC-Stark dressing in ultracold atomic optical lattices.", "url": "https://arxiv.org/abs/2606.05164", "type": "理论", "summary": "1. 该工作提出在冷原子π-通量光晶格中利用Floquet工程实现宇称反常诱导的阶梯状反常霍尔响应。\n2. 其核心在于通过时域破缺Floquet质量与静态反演质量偏移协同产生有质量狄拉克费米子，并利用动量依赖标量位移项选择性占据各狄拉克扇区的贝里曲率贡献。\n3. 这为在超冷原子体系中模拟分数化霍尔电导以及探索拓扑相变与宇称反常的关联提供了可调控平台。", "summary_source": "deepseek", "authors": [{"name": "Binayyak Roy"}, {"name": "Vito Scarola"}, {"name": "Sumanta Tewari"}], "featured_authors": [{"name": "Binayyak Roy"}, {"name": "Vito Scarola"}, {"name": "Sumanta Tewari"}], "author_count": 3}, {"id": "2606.04085", "category": "hep-th", "title": "Coarse graining from within: Wilson-Fisher universality on $S^3$", "abstract": "Wilsonian renormalization is usually formulated in momentum space, but on curved backgrounds momentum shells have no invariant meaning. We replace them by an intrinsic spectral cutoff, ordering modes by the covariant Laplacian and setting the cutoff resolution by the system size in renormalization group (RG) units. For a scalar field on $S^3$, this yields a covariant, momentum-free RG flow whose trace is an exact sum over spherical harmonics. The standard flat-space flow is recovered when the sphere is large compared with the coarse-graining scale. As a nontrivial test, the compact spectral flow realizes Wilson-Fisher universality without momentum shells: the interacting fixed point survives at finite resolution, has one relevant direction, and approaches its flat-space counterpart smoothly, with critical exponents only weakly affected by the compact spectrum.", "url": "https://arxiv.org/abs/2606.04085", "type": "理论", "summary": "1. 该工作针对三维球面$S^3$上的标量场，提出用协变拉普拉斯算符的本征谱截断替代传统动量壳层，以重整化群单位下的系统大小作为截断分辨率，构建了背景无关的协变重整化群流。\n2. 其关键技术在于RG流是球谐函数项的确切求和，无需动量空间定义，在大球极限下自然恢复平空间标准流形，并成功在紧致谱上实现了Wilson-Fisher普适性，固定点具有单一相关方向且临界指数仅受微弱影响。\n3. 该工作为弯曲背景上的重整化群方法提供了可行而严格的框架，临界指数对紧致谱的低敏感性表明该方案可推广至其他非平庸几何与相互作用场论体系，为后续相关研究提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Alfio M. Bonanno"}, {"name": "Renata Ferrero"}, {"name": "Giovanni Oglialoro"}], "featured_authors": [{"name": "Alfio M. Bonanno"}, {"name": "Renata Ferrero"}, {"name": "Giovanni Oglialoro"}], "author_count": 3}, {"id": "2606.04088", "category": "hep-th", "title": "Closed string trajectories from a new \"tiling\"", "abstract": "Based on an efficient technology for the excavation of entire open string trajectories of physical states, we propose an algorithmic method of constructing the largely unknown closed string trajectories. Due to combinatorial complexity, the \"double copy\" of open strings is limited in efficiency as a means of building closed string trajectories. We bypass this technical difficulty by employing one open string as the fundamental seed and then dressing it by a suitable selection of generators of a symplectic algebra that acts on both the left and the right sector. By applying Howe duality, the dressed seeds amount to closed string trajectory candidates, finding the physical subset of which is possible by solving systems of equations involving Diophantine-like recursion relations, which we also illustrate with examples.", "url": "https://arxiv.org/abs/2606.04088", "type": "理论", "summary": "1. 该工作基于高效提取完整开弦轨迹的技术，提出一种新的“铺砌”算法以系统构建先前未知的闭弦轨迹。\n2. 其核心在于以单个开弦为种子，通过选定辛代数生成元同时作用于左右扇区进行修饰，并利用Howe对偶性导出闭弦轨迹候选。\n3. 这一方案通过解类丢番图递归关系筛选物理子集，为闭弦态空间的系统性构造与能谱研究提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Thomas Basile"}, {"name": "Chrysoula Markou"}], "featured_authors": [{"name": "Thomas Basile"}, {"name": "Chrysoula Markou"}], "author_count": 2}, {"id": "2606.04318", "category": "hep-th", "title": "The Awada-Gibbons-Shaw Algebra in de Sitter Space and SUSY Breaking", "abstract": "We rederive the Cosmological Supersymmetry Breaking Relation $m_{3/2} = \\frac{C}{\\sqrt{R_{dS} L_P}}$ from a deformation of the Awada-Gibbons-Shaw local supersymmetry algebra.", "url": "https://arxiv.org/abs/2606.04318", "type": "理论", "summary": "1. 该工作从de Sitter时空中的Awada-Gibbons-Shaw局部超对称代数的形变出发，重新推导了宇宙学超对称破缺关系$m_{3/2} = C/\\sqrt{R_{dS} L_P}$。\n2. 其核心物理卖点在于揭示时空曲率与普朗克尺度通过代数形变直接耦合，使得引力微子质量由de Sitter半径和普朗克长度决定，为dS超对称破缺提供了代数根源。\n3. 这为理解弯曲时空超对称性自发破缺机制及其在弦论中的实现提供了代数框架，并可推广至其他具有正宇宙常数背景的量子引力研究。", "summary_source": "deepseek", "authors": [{"name": "T. Banks"}], "featured_authors": [{"name": "T. Banks"}], "author_count": 1}, {"id": "2606.04470", "category": "hep-th", "title": "Multi-entropy in random tensor networks", "abstract": "We study the evaluation of Rényi multi-entropies $S^{(q)}_n$ in Random Tensor Network (RTN) states in the large bond-dimension limit. For the case of Rényi index $n=2$ and arbitrary number of parties $q$, we prove that that multi-entropies are determined by minimal multiway cuts through the network. When the minimal multiway cut is degenerate, we characterize the full minimizer set via compatible families of minimal cuts and give a criterion for all minimizers to come from ordinary cut partitions. For $n=2$, this gives a natural generalization of the minimal cut description of bipartite entanglement to multipartite systems with arbitrarily many parties. For the case of integer $n>2$, we show that the minimal multiway cut conjecture is in general \\emph{not true} by providing explicit counter examples for both the single random tensor and for the network built from isometric tilings. We discuss the implication for our results on the multipartite entanglement structures in RTN and holography.", "url": "https://arxiv.org/abs/2606.04470", "type": "理论", "summary": "1. 该工作在大键维极限下研究了随机张量网络态中Rényi多熵的计算问题。\n2. 对于Rényi指数n=2，证明了多熵由最小多路切割决定，并刻画了简并情形下的极小元集；对于n>2，通过显式反例表明最小多路切割猜想不成立。\n3. 这为随机张量网络及全息对偶中多体纠缠结构的描述提供了关键约束和新的理论视角。", "summary_source": "deepseek", "authors": [{"name": "Miao Hu"}, {"name": "Simon Lin"}, {"name": "Ion Nechita"}], "featured_authors": [{"name": "Miao Hu"}, {"name": "Simon Lin"}, {"name": "Ion Nechita"}], "author_count": 3}, {"id": "2606.04542", "category": "hep-th", "title": "On Cosmologies and Vacua Driven by Tension and Curvatures", "abstract": "We investigate the effects of the exponential potentials typical of non-supersymmetric strings in cosmologies whose spatial and internal slices are maximally symmetric spaces with curvatures labeled by a pair of integers $k$ and $k'$ ($=\\pm 1$). We classify the solutions according to their singularity structure and asymptotic behavior and present a semi-quantitative picture of the generic dynamics in the physically most relevant cases with flat spatial slices. The analysis relies on exact solutions emerging when one of the effects dominates, special solutions arising when two or more effects are comparable, scaling asymptotics, and some numerical tests.", "url": "https://arxiv.org/abs/2606.04542", "type": "理论", "summary": "1. 该工作研究了非超对称弦理论中指数势在空间与内禀切片均为最大对称空间（曲率由整数k, k'标记）的宇宙学中的效应，并基于奇点结构与渐近行为对解进行了系统分类。\n2. 其核心技术在于利用主导效应时的精确解、效应可比时的特殊解以及标度渐近与数值验证，在半定量精度上刻画了平坦空间切片情形下的通用动力学，凸显了张力与曲率的竞争。\n3. 这为理解非超对称弦真空及其宇宙学演化提供了可靠的理论框架，并启发了对曲率-张力驱动系统中精确解与数值模拟的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "J. Mourad"}, {"name": "A. Sagnotti"}], "featured_authors": [{"name": "J. Mourad"}, {"name": "A. Sagnotti"}], "author_count": 2}, {"id": "2606.04575", "category": "hep-th", "title": "Emergent Closed Universes in Symmetric Orbifold CFTs", "abstract": "We identify closed universe sectors in large $N$ symmetric orbifold CFTs with holographic duals. Starting from tensor product states built out of a finite dimensional low energy subspace of the seed theory, we show that the large $N$ Hilbert space decomposes into superselection sectors labeled by occupation number distributions. Before imposing the orbifold gauge constraint, these sectors have exponentially large dimensions, and the maximally entropic sector dominates the ungauged Hilbert space. We argue that this sector exhibits several characteristic features expected of a closed universe Hilbert space: pure states become indistinguishable from a mixed state at the level of simple correlation functions, and the associated operator algebra is naturally a hyperfinite type II$_1$ von Neumann algebra. We then impose the $S_N$ gauge constraint. The large gauge redundancy drastically reduces the number of independent states. In particular, in the large $N$ limit, the dimension of the physical Hilbert space grows only polynomially with $N$. Consequently, each superselection sector after imposing the constraint is one dimensional in this limit. This reproduces the qualitative behavior suggested by gravitational path integral calculations with wormholes. We then show why, in this setup, the Hartle-Hawking type semiclassical approximation for the dominant closed universe fails to reproduce the CFT results. Nevertheless, the dominant saddle point approximation for gravitational path integral calculation is reconstructed once the CFT degrees of freedom are coupled to external observer degrees of freedom.", "url": "https://arxiv.org/abs/2606.04575", "type": "理论", "summary": "1. 该工作在对偶全息的大N对称orbifold共形场论中识别出闭宇宙扇区，并刻画其希尔伯特空间结构。\n2. 核心在于揭示这些扇区在无约束时满足纯态与混合态不可区分性及超有限II_1型冯诺依曼代数性质，经S_N规范约束后希尔伯特空间维数仅多项式增长。\n3. 这为从边界场论重构引力路径积分中虫洞与半经典主导鞍点近似提供了严格框架，并指出Hartle-Hawking型近似在该设定下的失效原因。", "summary_source": "deepseek", "authors": [{"name": "Akihiro Miyata"}, {"name": "Keigo Horikoshi"}, {"name": "Hiromasa Tajima"}, {"name": "Tomonori Ugajin"}], "featured_authors": [{"name": "Akihiro Miyata"}, {"name": "Keigo Horikoshi"}, {"name": "Hiromasa Tajima"}, {"name": "Tomonori Ugajin"}], "author_count": 4}, {"id": "2606.04626", "category": "hep-th", "title": "Self-dual higher spin theory: Poincaré invariance and new solutions", "abstract": "In this paper we study the self-dual higher spin theory in $4d$ recently proposed in arXiv:2209.01966 . The typical vacuum of higher spin theories is an empty AdS space-time. We consider solutions of special form: space-time geometry associated with spin $S=2$ field is an AdS, and other fields may have nonzero values, such that the global space-time symmetry of the vacuum is broken to $3d$ Poincaré. We show that the only field possessing this property is a two-parametric scalar vacuum. We also provide a new family of solutions that generalize this scalar vacuum. In addition to the scalar, the family consists of a fermion $S = 1/2$ in the bulk propagating along the radial direction in Poincaré coordinates and trivial fields of all spins. Fields are trivial in the sense that they do not have gauge fields in the bulk and correspond to trivially conserved currents (i.e. constants) on the conformal boundary.", "url": "https://arxiv.org/abs/2606.04626", "type": "理论", "summary": "1. 该工作系统研究了四维自对偶高自旋理论中的特殊真空解，其中自旋2场对应AdS时空，而其他自旋场非零致全局对称性破缺为三维庞加莱不变性。\n2. 技术核心是证明仅两参数标量场真空可实现该对称性破缺，并构造了包含沿径向传播的费米子及所有自旋平凡场的新解族。\n3. 这些解揭示了高自旋理论中对称性破缺的实现机制，为边界共形场论中守恒流与体态对应提供了可检验范例。", "summary_source": "deepseek", "authors": [{"name": "I. S. Faliakhov"}], "featured_authors": [{"name": "I. S. Faliakhov"}], "author_count": 1}, {"id": "2606.04841", "category": "hep-th", "title": "Chiral Transport in Metric-Affine Geometries", "abstract": "Anomalous transport in equilibrium fermionic fluids chirally coupled to background Weyl-type nonmetricity is studied. A formal descent analysis is carried out in which the dependence of the anomaly polynomial on the nonmetricity tensor is encoded in a Weyl invariant four-form. The constitutive relation of the axial-vector current is evaluated from the equilibrium partition function obtained using transgression techniques, showing the existence of nonmetricity-mediated chiral separation effects driven by the fluid's vorticity and the Weyl magnetic field. A second nonminimal coupling of fermionic matter to metric-affine geometries proposed in the literature is also discussed.", "url": "https://arxiv.org/abs/2606.04841", "type": "理论", "summary": "1. 该工作研究了平衡费米子流体手性耦合于Weyl型非度量性的反常输运，通过形式化下降分析推导了含非度量性张量的手征反常多项式。\n2. 利用transgression技术得到平衡配分函数，揭示了由流体涡度与Weyl磁场驱动的非度量性介导手征分离效应。\n3. 这为探索度规-仿射几何中非度量性诱导的反常输运现象及进一步的非最小耦合方案提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Miguel A. Vazquez-Mozo"}], "featured_authors": [{"name": "Miguel A. Vazquez-Mozo"}], "author_count": 1}, {"id": "2606.04854", "category": "hep-th", "title": "Resonance transformations for the $(2,2p+1)$ minimal string via $x-y$ swap: a proof of Artemev's conjecture", "abstract": "This paper contains a proof of a recent conjecture of Artemev that connected the resonance transformations for the $(2,2p+1)$ minimal string to the $x-y$ swap in the theory of topological recursion.", "url": "https://arxiv.org/abs/2606.04854", "type": "理论", "summary": "1. 该工作证明了Artemev猜想，揭示了(2,2p+1)最小弦理论的共振变换与拓扑递归中x-y对换的等价关系。\n2. 其核心在于通过构造精确的变换对应，将两类看似无关的数学结构统一在同一框架下。\n3. 这为探索最小弦理论的对称性及其与拓扑递归的深层联系提供了严格基础，并可能推广至更一般的弦论模型。", "summary_source": "deepseek", "authors": [{"name": "Kornelis Dekinga"}, {"name": "Sergey Shadrin"}, {"name": "Erik Verlinde"}], "featured_authors": [{"name": "Kornelis Dekinga"}, {"name": "Sergey Shadrin"}, {"name": "Erik Verlinde"}], "author_count": 3}, {"id": "2606.04933", "category": "hep-th", "title": "$\\text{AdS}_D\\times I$ solutions in axio-dilaton gravity", "abstract": "We study non-supersymmetric $
