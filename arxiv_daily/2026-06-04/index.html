\\mathrm{AdS}_D\\times I$ solutions in the context of $(D+1)$ dimensional gravity coupled to an axio-dilaton with arbitrary runaway potential for the dilaton and arbitrary exponential coupling of the dilaton to the axion kinetic energy. We analyze the equations of motion, reformulate them in terms of a first order autonomous dynamical system, and discuss the set of fixed points, their physical interpretation and their stability conditions. We find a few special classes of analytic solutions for arbitrary $D$, including $\\mathrm{AdS}_9\\times I$ backgrounds in type IIB supergravity. We conclude by discussing the properties of numerical flows including the massive IIA supergravity case.", "url": "https://arxiv.org/abs/2606.04933", "type": "理论", "summary": "1. 本文在非超对称框架下，系统研究了耦合轴子-胀子引力中AdS_D × I解的存在性与分类。\n2. 其技术核心是将运动方程约化为一阶自治动力系统，解析导出了包括IIB超引力中AdS_9×I背景在内的多类精确解。\n3. 该工作为理解含逃跑势的轴子-胀子系统中的全息背景及寻找IIA超引力中的类似解提供了动力系统分析框架。", "summary_source": "deepseek", "authors": [{"name": "Giuseppe Dibitetto"}, {"name": "Nicolò Petri"}], "featured_authors": [{"name": "Giuseppe Dibitetto"}, {"name": "Nicolò Petri"}], "author_count": 2}, {"id": "2606.04938", "category": "hep-th", "title": "AdS$_9$ solutions in type II supergravities", "abstract": "We present new solutions in type II supergravities describing AdS$_9$ geometries warped over an interval. In type IIB, we construct an analytic family of backgrounds supported by a non-trivial axio-dilaton profile. Despite the presence of strong-coupling singularities at both ends of the interval, these solutions exhibit both a finite Euclidean on-shell action and a finite holographic central charge. Moreover, they possess a $\\mathbb Z_2$ symmetry under which the axion transforms as $C_0\\rightarrow -C_0$. We also investigate AdS$_9$ backgrounds in massive IIA supergravity supported by the Romans mass and the dilaton. Numerical integration reveals solutions with a strong-coupling singularity whose asymptotic behavior is consistent with the characteristic D8/O8 profile. In contrast to the type IIB case, our analysis indicates that the Euclidean on-shell action diverges. Finally, we identify a family of perturbative dS$_9$ solutions in massive IIA supergravity.", "url": "https://arxiv.org/abs/2606.04938", "type": "理论", "summary": "1. 该工作在IIB和massive IIA超引力中构造了由区间卷曲的AdS$_9$新解族。\n2. 其关键是IIB解具有有限欧几里得壳作用量与全息中心荷及$\\mathbb Z_2$对称性，而massive IIA解则显示发散作用量与D8/O8型渐近行为，并发现微扰dS$_9$解。\n3. 这些AdS$_9$与dS$_9$背景为探索高维全息对偶及弦理论中dS真空的实现提供了新的理论平台。", "summary_source": "deepseek", "authors": [{"name": "Giuseppe Dibitetto"}, {"name": "Nicolò Petri"}], "featured_authors": [{"name": "Giuseppe Dibitetto"}, {"name": "Nicolò Petri"}], "author_count": 2}, {"id": "2606.04949", "category": "hep-th", "title": "Off-shell Thermodynamics and Kinetics of Holographic CFTs Dual to Charged AdS Black Holes", "abstract": "We study the thermodynamics and phase structure of holographic conformal field theories dual to spherically symmetric charged AdS black holes using an off-shell free energy. We consider three ensembles of the dual CFT with fixed: $(\\tilde Q,{\\cal V},C)$, $(\\tilde \\Phi,{\\cal V},C)$, and $(\\tilde Q,{\\cal V},\\mu)$ and present their corresponding phase diagrams. For the fixed $(\\tilde Q,{\\cal V},C)$ and $(\\tilde \\Phi,{\\cal V},C)$ ensembles, we study the transitions between competing states using a stochastic description on the various phases given by off-shell free energy. This is described by an ensemble dependent Fokker-Planck equation, allowing us to compute the first-passage-time distribution, including the mean first passage time and its fluctuations over a range of temperatures. We also examine how the phase structure and the associated kinetics depend on the electric charge $\\tilde Q$ and the central charge $C$.", "url": "https://arxiv.org/abs/2606.04949", "type": "理论", "summary": "1. 该工作基于离壳自由能方法，系统构建了与球对称带电AdS黑洞对偶的全息共形场论在固定电荷、势或化学势三个系综下的热力学相图。\n2. 其技术核心在于引入依赖系综的Fokker-Planck方程描述竞争态间的随机跃迁，从而计算首通时间分布、平均首通时间及其随温度的涨落。\n3. 这揭示了电荷与中心荷对相变动力学的调控机制，为在全息对偶框架内定量研究有限温度相变速率及潜在量子引力效应提供了可检验的理论工具。", "summary_source": "deepseek", "authors": [{"name": "Debabrata Sahu"}, {"name": "Chandrasekhar Bhamidipati"}], "featured_authors": [{"name": "Debabrata Sahu"}, {"name": "Chandrasekhar Bhamidipati"}], "author_count": 2}, {"id": "2606.04999", "category": "hep-th", "title": "Path integral quantization of tensionless bosonic strings with Carroll-Weyl ghosts", "abstract": "We revisit the path integral quantization of the null, or tensionless, bosonic string from the viewpoint that all local gauge symmetries of the Carrollian worldsheet must be gauge fixed before the quantum theory is defined. In the tensile-string construction the $bc$ ghosts are the Faddeev-Popov determinant for fixing $\\mathrm{Diff}\\times\\mathrm{Weyl}$. In the ILST tensionless string this logic gives the BMS $bc$ system. However, a Carrollian worldsheet admits an additional volume-preserving Carroll-Weyl scaling, whose Hamiltonian generator is $C_3=P\\cdot X$. Keeping this scaling as a genuine local gauge symmetry adds one more Faddeev-Popov row. The correct ghost system is therefore a $bcs$ system: the BMS $bc$ ghosts plus a scalar ghost $s$ and scalar antighost $b^s$ for Carroll-Weyl scaling. We derive the revised path integral, the $bcs$-ghost action, its residual symmetry equations, mode expansion, and its relation to the extended BMS algebra. The result changes the BRST complex and the anomaly problem: the usual $D=26$ check based only on the old BMS $bc$ ghosts is a partially gauge-fixed calculation, while the Carroll-Weyl covariant quantum theory must include the $s,b^s$ sector.", "url": "https://arxiv.org/abs/2606.04999", "type": "理论", "summary": "1. 该工作从Carrollian世界面所有局域规范对称性必须完全规范固定的角度，重新审视了零张力玻色弦的路径积分量子化。\n2. 其核心卖点在于发现额外的体积保持Carroll-Weyl缩放对称性（生成元C₃=P·X）需要引入标量幽灵s与反幽灵bˢ，形成bcs幽灵系统并修正了路径积分与BRST复形。\n3. 这一结果指示通常基于BMS bc幽灵的D=26反常消除条件是部分规范固定的，完整的Carroll-Weyl协变量子理论必须包含s、bˢ扇区，对临界维度问题及张力弦理论研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Sarthak Duary"}, {"name": "Sourav Maji"}], "featured_authors": [{"name": "Sarthak Duary"}, {"name": "Sourav Maji"}], "author_count": 2}, {"id": "2606.05049", "category": "hep-th", "title": "Generalized Heisenberg algebra from $o(2,4)$", "abstract": "It is well known that the algebra $o(2,4)$ generates the conformal group, but it can also be used to define some variants of the Yang model of noncommutative geometry on a curved spacetime. Starting from these examples, we construct a new physical model based on $o(2,4)$, that can be interpreted as a generalization of the Heisenberg algebra on phase space, with flat positions and momenta, but nontrivial commutation relations between positions and momenta and with the Planck constant promoted to an operator.", "url": "https://arxiv.org/abs/2606.05049", "type": "理论", "summary": "1. 该工作从共形代数o(2,4)出发，构建了一个相空间上广义Heisenberg代数的物理模型。\n2. 其关键特征在于位置与动量保持平坦但对易关系非平凡，且将普朗克常数提升为算符。\n3. 这为探索非交换几何与共形对称性的深层联系提供了新的代数框架。", "summary_source": "deepseek", "authors": [{"name": "Tea Martinic Bilac"}, {"name": "Stjepan Meljanac"}, {"name": "Salvatore Mignemi"}], "featured_authors": [{"name": "Tea Martinic Bilac"}, {"name": "Stjepan Meljanac"}, {"name": "Salvatore Mignemi"}], "author_count": 3}, {"id": "2606.05059", "category": "hep-th", "title": "Thermal effective action for the $O(N)$ vector model", "abstract": "We compute the leading coefficients of the thermal effective action for the critical O(N) vector model in three dimensions, in the large-N limit in presence of non vanishing angular twist. At high temperature, the partition function on a product of a two-dimensional spatial manifold and a thermal circle admits a Kaluza-Klein reduction to a local effective action on the spatial slice, whose coefficients encode universal CFT data such as the Casimir energy and the response to a Kaluza-Klein gauge field. We determine these coefficients through two independent computations: an evaluation of the twisted partition function on the two-sphere in the high-temperature limit, and a direct path-integral computation on a generic weakly curved background. The two methods yield consistent results, providing a non-trivial check of the thermal effective action framework.", "url": "https://arxiv.org/abs/2606.05059", "type": "理论", "summary": "1. 该工作计算了三维临界O(N)矢量模型在大量N极限及存在角向扭曲时热有效作用量的领头阶系数。\n2. 其技术要点在于通过扭结配分函数的高温极限与弱弯曲背景上的路径积分两种独立计算，获得一致结果并提取Casimir能量等普适CFT数据。\n3. 这为在高温下利用局域有效作用量描述带扭曲CFT的响应与热力学性质提供了可靠框架，可望推广至更一般的共形场论。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo Mauro"}, {"name": "Alessandro Vichi"}], "featured_authors": [{"name": "Lorenzo Mauro"}, {"name": "Alessandro Vichi"}], "author_count": 2}, {"id": "2606.05086", "category": "hep-th", "title": "Fermionic Kaluza-Klein mode mixing in braneworlds", "abstract": "We investigate fermionic Kaluza-Klein (KK) mode mixing in thick braneworld models subjected to generic background perturbations. Conventionally, isolated static backgrounds are completely described by a Schroedinger-like formulation, which yields an unperturbed orthogonal basis of KK eigenstates. However, generic perturbations possess a non-trivial spatial profile along the extra dimension. When the full interacting Dirac operator is expanded in this original basis, the spatial variation inevitably yields non-vanishing overlap integrals between distinct KK levels, thereby inducing off-diagonal couplings in the 4D effective mass matrix. Consequently, the original eigenstates are no longer exact physical eigenmodes of the perturbed system. To rigorously preserve the underlying 5D chiral structure and resolve the true physical states, we employ an exact Singular Value Decomposition (SVD) of the full, off-diagonal Dirac mass matrix. Our exact analysis reveals that this mode mixing introduces small but highly structured corrections to the mass eigenvalues. Specifically, parity-odd perturbation operators strictly induce same-parity mixing that preserves the macroscopic Z2 spatial symmetry, whereas parity-even operators trigger cross-parity mixing that shatters the Z2 symmetry, resulting in severe spatial polarization of the KK probability densities. Phenomenologically, such polarization shifts the wave functions toward the brane, turning probability zeros into non-zero values, which directly illuminates previously \"dark\" KK modes.", "url": "https://arxiv.org/abs/2606.05086", "type": "理论", "summary": "1. 本文研究厚膜世界模型中背景扰动导致的费米子Kaluza-Klein模混合，并采用奇异值分解精确处理全离对角狄拉克质量矩阵。\n2. 关键物理在于揭示奇偶性扰动分别诱导同宇称混合（保留Z2对称性）与交叉宇称混合（破坏Z2对称性），导致KK概率密度强烈空间极化。\n3. 该极化效应可将概率零点转化为非零值，使原先“暗”的KK模变为可观测，为膜世界现象学提供新探测途径。", "summary_source": "deepseek", "authors": [{"name": "Chun-E Fu"}, {"name": "Wen-Xuan Ma"}], "featured_authors": [{"name": "Chun-E Fu"}, {"name": "Wen-Xuan Ma"}], "author_count": 2}, {"id": "2606.05136", "category": "hep-th", "title": "Thermal Positivity", "abstract": "We argue that Lorentz invariance and unitarity impose sharp constraints on thermodynamic quantities. By relating thermal vacuum diagrams to forward scattering amplitudes, we derive an infinite family of sign conditions on finite-temperature observables in perturbative theories of relativistic massless bosons. In particular, we prove that all low-temperature corrections from interactions to the pressure, or equivalently the negative free energy density, of the form T^{2D-4+4k} with k>0 in D spacetime dimensions, are strictly positive. These positivity conditions are inherited by analogous terms in the entropy density and specific heat. Our results apply to any effective field theory that is free of long-range forces and descends from a weakly coupled ultraviolet completion, in which case higher-loop and higher-multiplicity thermal diagrams are parametrically subleading.", "url": "https://arxiv.org/abs/2606.05136", "type": "理论", "summary": "1. 该工作从洛伦兹不变性与幺正性导出热力学量约束，通过关联热真空图与前向散射振幅，证明相对论性无质量玻色子微扰理论中低温修正项满足严格符号条件。\n2. 其核心卖点在于推导出D维时空中压力低温修正T^{2D-4+4k}（k>0）的严格正定性，并推广至熵密度与比热，且适用于无长程力、来自弱耦合紫外完备化的有效场论。\n3. 这为热力学正性从微扰理论向非微扰区域的拓展提供了基础，也为通过符号条件约束有效场论参数空间和检验紫外完备性指明方向。", "summary_source": "deepseek", "authors": [{"name": "Clifford Cheung"}, {"name": "Rachel A. Rosen"}], "featured_authors": [{"name": "Clifford Cheung"}, {"name": "Rachel A. Rosen"}], "author_count": 2}, {"id": "2606.04024", "category": "math-ph", "title": "Delta-pulse solution in Zener viscoelastic model", "abstract": "We derive the integral representation of the solution for the propagation of a delta-pulse (impulsive wave) in a semi-infinite, homogeneous, linear viscoelastic medium governed by the Zener model. Starting from the Bromwich integral representation of the response function, we obtain a closed-form integral representation by analytically inverting the relevant Laplace transforms. The result is expressed in terms of modified Bessel functions of the first kind and Macdonald functions of half-integer order, and is shown to reduce to the known Maxwell model solution in the appropriate limit. As an independent computational approach, we derive the steepest descent path (SDP) associated with the phase function of the Bromwich integral, characterizing its saddle points and showing that the SDP can be expressed explicitly as the zero locus of a sixth-degree polynomial in the imaginary part of the complex variable. The two methods are compared numerically for several values of the model parameters, confirming their agreement. While the integral representation provides analytical insight into the structure of the solution, the steepest descent method requires no explicit inversion of the Laplace transform and may therefore prove especially valuable in more general viscoelastic settings where a closed-form integral representation is not available.", "url": "https://arxiv.org/abs/2606.04024", "type": "理论", "summary": "1. 该工作推导了Zener粘弹性模型中δ脉冲传播的闭式积分表示，并发展了相应的最陡下降路径分析方法。\n2. 其技术卖点在于通过解析反演拉普拉斯变换获得以修正Bessel函数和Macdonald函数表达的精确解，且该解在极限下可还原为Maxwell模型。\n3. 这为一般粘弹性问题中无法获得闭式积分表示时提供了一种无需显式拉普拉斯反演的数值分析方法。", "summary_source": "deepseek", "authors": [{"name": "Andrea Mentrelli"}, {"name": "Juan Luis Gonzalez-Santander"}, {"name": "Francesco Mainardi"}], "featured_authors": [{"name": "Andrea Mentrelli"}, {"name": "Juan Luis Gonzalez-Santander"}, {"name": "Francesco Mainardi"}], "author_count": 3}, {"id": "2606.04041", "category": "math-ph", "title": "$A$-Generalized Hessian pre-Lie algebras and $A$-Generalized Yang--Baxter Equations", "abstract": "Inspired by the problem of constructing ($\\omega$-)pre-Lie algebra structures on the dual space of a pre-Lie algebra, we introduce the \\(A\\)-generalized Yang--Baxter equation as a generalization of the Yang--Baxter equation of pre-Lie algebras. We study its symmetric solutions through \\(A\\)-generalized Hessian pre-Lie algebras and split these solutions into two types. We further consider factorizable solutions of this equation and establish a one-to-one correspondence between them and generalized quadratic Rota--Baxter pre-Lie algebras of nonzero weight. By studying the structure of these algebras, we find all factorizable solutions. Finally, we study the structure of \\(A\\)-generalized Hessian pre-Lie algebras. In particular, we obtain a structural description via central and double extensions and classify low-dimensional non-trivial \\(A\\)-generalized Hessian pre-Lie algebras.", "url": "https://arxiv.org/abs/2606.04041", "type": "理论", "summary": "1. 该工作受预李代数对偶空间上构造(ω-)预李代数结构的启发，引入A-广义Yang-Baxter方程作为预李代数Yang-Baxter方程的自然推广，并系统研究了其对称解与可分解解。\n2. 技术核心在于通过A-广义Hessian预李代数将对称解划分为两类，并建立可分解解与非零权重广义二次Rota-Baxter预李代数之间的精确一一对应，从而完整求解所有可分解解。\n3. 该工作进一步给出A-广义Hessian预李代数经由中心和双扩张的结构描述，并完成低维非平凡代数的完全分类，为预李代数及其对偶空间上的结构理论提供了系统代数框架与分类结果。", "summary_source": "deepseek", "authors": [{"name": "Yining Sun"}, {"name": "Zeyu Hao"}, {"name": "Ziyi Zhang"}, {"name": "Liangyun Chen"}], "featured_authors": [{"name": "Yining Sun"}, {"name": "Zeyu Hao"}, {"name": "Ziyi Zhang"}, {"name": "Liangyun Chen"}], "author_count": 4}, {"id": "2606.04162", "category": "math-ph", "title": "An Elementary Perspective on the Dirac Equation and its Closest Relatives", "abstract": "We consider the Dirac equation in a real setting to show its close relationship to Maxwell's equation. In addition to analysing the classical Dirac mass term, we also inspect the alternative Majorana mass term and discuss their quaternionic structure and its consequences.", "url": "https://arxiv.org/abs/2606.04162", "type": "理论", "summary": "1. 该工作从实空间视角重新审视狄拉克方程，揭示其与麦克斯韦方程组的深层结构关联。\n2. 技术亮点在于分析狄拉克与马约拉纳质量项的四元数代数结构，阐明二者对称性差异的物理后果。\n3. 这为统一描述费米子与玻色子的经典极限，以及探索更广泛粒子物理代数框架提供了基础启发。", "summary_source": "deepseek", "authors": [{"name": "Rainer Picard"}, {"name": "Sascha Trostorff"}, {"name": "Marcus Waurick"}], "featured_authors": [{"name": "Rainer Picard"}, {"name": "Sascha Trostorff"}, {"name": "Marcus Waurick"}], "author_count": 3}, {"id": "2606.04515", "category": "math-ph", "title": "Discussion on the Physics Problem of a Boat Crossing a River", "abstract": "This study addresses the boat river-crossing problem under non-uniform flow velocities by constructing three models: constant flow (Model 1), linear distribution (Model 2), and even-power function distribution (Model 3, adjustable via parameter n ). By using the vector addition, combined with the solutions of calculus and differential equations, the analytical expression of the ship's spatial trajectory under a fixed heading angle relative to the water flow is derived. For the shortest-time control problem, the Lagrange multiplier method is introduced to construct a constrained optimization model, and the analytical solution of the optimal heading angle that satisfies the boundary condition of reaching the direct opposite bank is solved. The research results provide theoretical support for the path planning of inland ship intelligent navigation systems, and the proposed multi-model analysis framework can effectively simulate the complex flow velocity distribution scenarios of real rivers.", "url": "https://arxiv.org/abs/2606.04515", "type": "理论", "summary": "1. 该工作建立了非均匀流速条件下船渡河问题的三个模型，推导了固定航向角下轨迹的解析表达式并求解了最短时间最优航向角。\n2. 其技术核心在于结合矢量加法、微积分与微分方程，并引入拉格朗日乘子法处理约束优化，获得解析解。\n3. 研究为内河船舶智能导航系统的路径规划提供理论支撑，所提多模型框架可有效模拟真实河流复杂流速分布。", "summary_source": "deepseek", "authors": [{"name": "Kyle Kou Yuchang"}, {"name": "Simon Meng Zimin"}, {"name": "Paul Zhang Yixing"}], "featured_authors": [{"name": "Kyle Kou Yuchang"}, {"name": "Simon Meng Zimin"}, {"name": "Paul Zhang Yixing"}], "author_count": 3}, {"id": "2606.04643", "category": "math-ph", "title": "On the Conicality of Causally Simple, Future Cohesive Spacetimes", "abstract": "The notion of conicality, recently introduced in [ 2403.00916 ], captures the extent to which the joint future of a finite set in spacetime uniquely determines the generating subset via its light cone structure. In the same paper it was mentioned that conicality holds for Minkowski spacetime of dimension $1+N$ with $N\\geq 2$ and it has been conjectured that this property holds more generally. In this work, we show that neither homotopy with Minkowski space nor global hyperbolicity alone are sufficient for the spacetime to satisfy conicality. We then establish that causally simple, future cohesive spacetimes of dimension $1+N$ with $N\\geq 2$ satisfy the condition. This class of spacetimes in particular includes TIP spacetimes, which can be understood as the timelike past of an observer. This is in line with the origin of causal modeling since the past of an observer is the natural domain for the description of experiments.", "url": "https://arxiv.org/abs/2606.04643", "type": "理论", "summary": "1. 本文证明了在维数1+N(N≥2)的时空流形中，因果简单且未来内聚的时空满足锥性，而全局双曲性或与闵可夫斯基时空同伦均不足以保证该性质。\n2. 其核心卖点在于将锥性成立的充分条件精确定位于因果简单性与未来内聚性的组合，而非更强的拓扑假设，并指出该类包含观察者时间过去(TIP)时空。\n3. 这一结果为通过光锥结构唯一确定有限点集生成区域提供了精确的因果几何判据，从而深化了对因果建模中实验描述域理论基础的理解。", "summary_source": "deepseek", "authors": [{"name": "Claudio F. Paganini"}], "featured_authors": [{"name": "Claudio F. Paganini"}], "author_count": 1}, {"id": "2606.04837", "category": "math-ph", "title": "Maximal Minimal Spacing for Random Points", "abstract": "From $N+1$ random points on a line we wish to select $M+1$ points so as to maximize the minimal spacing between them. We consider an initial configuration with independent and identically distributed spacings. The problem is equivalent to optimally grouping consecutive gaps into $M$ blocks and maximizing the smallest block sum. For general gap distributions, and for all $M\\leq N$, we derive exact distributional identities for the optimal spacing and obtain its asymptotic behavior. The problem admits a reformulation in terms of a threshold-resetting random walk. The walk advances by successive random increments and is reset to the origin upon exceeding a fixed threshold. The probability that the optimal spacing exceeds a given value coincides with the probability that the walk completes at least $M$ reset cycles within $N$ steps. This yields an exact representation in terms of first-passage functionals of the walk. The same mapping suggests a numerical scheme for the max-min spacing problem in the regime of large $N$ and $M$, whose accuracy is tested against the exact results obtained here.", "url": "https://arxiv.org/abs/2606.04837", "type": "理论", "summary": "1. 本文针对直线上独立同分布间距的随机点，推导了最大化所选点间最小间距问题的精确分布恒等式与渐近行为。\n2. 其核心在于将该问题映射为阈值重置随机游走，使最优间距的超概率等价于游走完成给定重置周期数的首次通过概率。\n3. 该映射为大规模随机点最大最小间距问题提供了高效数值方案，且所获精确解可直接检验其准确性。", "summary_source": "deepseek", "authors": [{"name": "Fabio Deelan Cunden"}, {"name": "Noemi Cuppone"}, {"name": "Giovanni Gramegna"}, {"name": "Pierpaolo Vivo"}], "featured_authors": [{"name": "Fabio Deelan Cunden"}, {"name": "Noemi Cuppone"}, {"name": "Giovanni Gramegna"}, {"name": "Pierpaolo Vivo"}], "author_count": 4}, {"id": "2606.04038", "category": "quant-ph", "title": "Graphical and algebraic methods for Boolean factoring", "abstract": "The problem of factoring Boolean polynomials has significant applications in both classical and quantum computing technology. In this paper we have developed novel algorithms for factoring both ESOP and SOP expressions. Our aim is to optimize the AND-count. The AND-count plays a key role in determining the number of AND and Toffoli gates required to implement a reversible function with classical and quantum circuits, respectively. The first type of algorithms that we develop, are graphical. We reduce the problem of Boolean factoring to covering a bipartite graph with bicliques, and so optimizing the number of bicliques required to cover the bipartite graph, leads to reduced number of factors, and hence AND-count. The second type of algorithm is algebraic, and is derived from multivariate Horner method. We have compared the performances of our algorithms with existing popular methods like EXORCISM-4 and EPOEM2, on random functions of up to 12 variables. We have observed that our multivariate Horner method is substantially faster, while our biclique-based method achieves the maximum AND-count reduction. In fact, compared to EXORCISM-4 our biclique based method achieves up to 5 times reduction in AND-count.", "url": "https://arxiv.org/abs/2606.04038", "type": "理论+数值", "summary": "1. 该工作针对布尔多项式因式分解问题，分别提出了基于二分图双团覆盖的图形算法与基于多元霍纳法的代数算法，以优化AND计数。\n2. 核心卖点在于图形法将因式分解等价为双团覆盖问题，实现高达5倍的AND计数缩减；代数法则在随机函数上比EXORCISM-4等方法显著更快。\n3. 这为经典与量子电路中Toffoli门数量的优化提供了明确路径，并对可逆逻辑综合的算法设计具有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Simon Martiel"}, {"name": "Priyanka Mukhopadhyay"}], "featured_authors": [{"name": "Simon Martiel"}, {"name": "Priyanka Mukhopadhyay"}], "author_count": 2}, {"id": "2606.04055", "category": "quant-ph", "title": "Boson Models with Interactions of Arbitrary Order", "abstract": "The paper considers quantal many-boson systems that are described by a rotationally invariant and boson-number conserving Hamiltonian. The properties of a generic model are studied which treats N bosons of p different kinds with non-zero angular momenta l_1,l_2,...,l_p, possibly augmented with a (number of) scalar s boson(s). The order k of the interaction between the bosons is arbitrary and closed formulas are given for matrix elements between N-boson states for any k if p=1 and p=2. A recursive procedure is defined for arbitrary k and p. With the expressions derived in the paper it is possible to express symbolically a Hamiltonian matrix element between N-boson states as a linear combination of k-body interaction matrix elements. More generally, the formulas allow the evaluation of matrix elements of tensor operators that are not necessarily scalar nor boson-number conserving. The numerical implementation of the formalism is discussed and illustrated with a few examples.", "url": "https://arxiv.org/abs/2606.04055", "type": "理论+数值", "summary": "1. 该工作为含有p种角动量分别为l1,…,lp的非零角动量玻色子（可附加标量s玻色子）、哈密顿量满足旋转不变性和玻色子数守恒的多体系统，推导了任意相互作用阶数k下的N玻色子态矩阵元的通用表达式。\n2. 其核心是通过对单组分与双组分系统给出k体相互作用的闭式矩阵元公式，并建立适用于任意p和k的递归算法，从而将任意算符（包括非标量、非数守恒张量）的矩阵元表示为一系列k体矩阵元的线性组合。\n3. 该形式体系连同数值实现在符号计算层面为处理高阶多体相互作用玻色模型提供了系统化框架，为超越两体相互作用的量子多体物理研究开辟了道路。", "summary_source": "deepseek", "authors": [{"name": "P. Van Isacker"}], "featured_authors": [{"name": "P. Van Isacker"}], "author_count": 1}, {"id": "2606.04080", "category": "quant-ph", "title": "Essential Unitarity for Higher-Order Quantum Computation", "abstract": "We develop a semantic framework for higher-order quantum computation based on a boundary-centric presentation of compact closed categories, building on Kelly--Laplaza and this http URL are polarized boundary linkings composed by execution, with a unit-free monoidal sum providing reversible control and branching. We identify a notion of \\emph{essential unitarity} generalizing unitarity from first-order processes to higher-order interfaces;at first order it coincides with standard unitarity, and at higher order it characterizes when information is preserved relative tothe boundary. Essential unitarity is the unique predicate compatible with dagger-monoidal structure, coherence reindexing, and currying, and reducing to ordinary unitarity at first order. Every morphism of the quantum core is essentially unitary. The framework realizes the coherent quantum switch and other one-slot, equal-ratio, purity-preserving supermaps as coherent pure-comb dilations. Extended Abstract appears in QPL 2026", "url": "https://arxiv.org/abs/2606.04080", "type": "理论", "summary": "1. 该工作基于边界中心的紧致闭范畴表示，为高阶量子计算构建了一个语义框架。\n2. 其关键贡献在于提出“本质幺正性”概念，将幺正性从一阶过程推广至高阶界面，并与dagger-幺半结构及curry化相容，量子核中所有态射均满足该性质。\n3. 该框架可统一描述相干量子开关等纯度保持超映射的相干纯组合膨胀，为高阶量子信息处理的形式化研究提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Samson Abramsky"}, {"name": "Radha Jagadeesan"}], "featured_authors": [{"name": "Samson Abramsky"}, {"name": "Radha Jagadeesan"}], "author_count": 2}, {"id": "2606.04186", "category": "quant-ph", "title": "Quantum Information Harvesting with the Parallel Quantum Flow Algorithm", "abstract": "The Quantum Flow (QFlow) algorithm provides a resource-efficient framework for describing correlated many-body systems on hybrid quantum-classical architectures. By enabling parallel utilization of quantum and classical resources, QFlow offers a scalable pathway toward simulations of realistic systems. In this Letter, we report a high-performance computing (HPC) implementation of the QFlow formalism based on a singles-and-doubles model. We demonstrate its performance for target spaces comprising 82 and 114 orbitals, where the flow includes all 6 active electrons in 6 active orbitals type active spaces. In the largest QFlow simulations, we optimize 1.17 million wave function parameters using the equivalent of 12 qubits. Despite the modest qubit requirements of the underlying active-space problems, the method recovers over $95\\%$ of the total correlation energy obtained with the coupled cluster singles and doubles (CCSD) approach for systems dominated by dynamical correlation effects, which remain challenging for existing quantum algorithms. We further show that the QFlow formalism retains high accuracy in extended basis sets with diffuse functions, highlighting its potential for realistic large-scale quantum chemistry simulations.", "url": "https://arxiv.org/abs/2606.04186", "type": "理论+数值", "summary": "1. 该工作报道了基于单双激发模型的并行量子流算法在高性能计算上的实现，可处理包含82至114个轨道的目标空间。\n2. 其核心卖点在于以等效12量子比特优化117万个波函数参数，对动力学关联主导的系统恢复超过95%的CCSD总关联能。\n3. 这为在含弥散函数的扩展基组中保持高精度，进而实现现实尺度量子化学模拟提供了可扩展的混合量子-经典路径。", "summary_source": "deepseek", "authors": [{"name": "Nicholas P. Bauman"}, {"name": "Ajay Panyala"}, {"name": "Chenxu Liu"}, {"name": "Muqing Zheng"}, {"name": "Meng Wang"}, {"name": "Karol Kowalski"}], "featured_authors": [{"name": "Nicholas P. Bauman"}, {"name": "Ajay Panyala"}, {"name": "Chenxu Liu"}, {"name": "Muqing Zheng"}, {"name": "Meng Wang"}, {"name": "Karol Kowalski"}], "author_count": 6}, {"id": "2606.04312", "category": "quant-ph", "title": "Characterization of errors in photon-heralded quantum operations between non-interacting quantum emitters", "abstract": "We develop an analytic perturbative framework that enables the analysis of small Markovian errors in probabilistic, photon-heralded quantum operations between non-interacting emitters. Building on and extending the Zero-Photon-Generation (ZPG) framework, we derive closed-form perturbative solutions that capture both ideal (zero-order) and noisy (low-order) gate dynamics conditioned on time-integrated photon counting. Our framework provides analytic solutions to process matrices and Pauli error weights up to leading order, bridging the gap between detailed physical imperfections of a system and its corresponding abstract Pauli noise models. Moreover, our framework captures imperfections across the full physical system stack, from photon generation to optical manipulation. We benchmark the resulting perturbative predictions on a repeat-until-success CZ gate against numerical simulations, demonstrating accurate modeling of source-induced noise, and then apply the same framework to analyze coherent phase-shifter miscalibrations as a representative example of optical-manipulation errors. The methods developed in this work enable physics-informed parameter tuning to optimize gate designs and develop tailored quantum error correction protocols toward fault-tolerant quantum computing using hybrid light--matter quantum systems.", "url": "https://arxiv.org/abs/2606.04312", "type": "理论+数值", "summary": "1. 该工作发展了一个解析微扰框架，用于分析非相互作用量子发射器之间光子触发量子操作中的小马尔可夫误差。\n2. 其核心在于，基于扩展的零光子生成框架，推导出条件过程矩阵和泡利误差权重的解析解，定量关联了物理系统缺陷与抽象噪声模型。\n3. 这为通过物理参量调优优化门设计，以及面向容错量子计算定制纠错协议提供了理论指引。", "summary_source": "deepseek", "authors": [{"name": "Mahsa Karimi"}, {"name": "Samuel Mister"}, {"name": "Christoph Simon"}, {"name": "Stephen C. Wein"}], "featured_authors": [{"name": "Mahsa Karimi"}, {"name": "Samuel Mister"}, {"name": "Christoph Simon"}, {"name": "Stephen C. Wein"}], "author_count": 4}, {"id": "2606.04353", "category": "quant-ph", "title": "Spectral Fusion for Identifying Early State Exclusion in Symmetric Quantum Spin Chains", "abstract": "Perfect state transfer (PST) in one-dimensional quantum spin chains provides a natural setting in which quantum information transport can be analyzed using spectral methods. In the single-excitation subspace, the dynamics of a chain with nearest-neighbor interactions are governed by a Jacobi matrix, allowing questions of state transfer to be formulated in terms of eigenvalue distributions and symmetry properties of eigenvectors. In this work, we investigate the phenomenon of \\emph{early state exclusion} (ESE), whereby the overlap of the time-evolved state with the initial state vanishes at a time strictly earlier than the first occurrence of perfect state transfer. Building on earlier constructions of Hamiltonians exhibiting PST with and without ESE, we provide explicit Jacobi matrix realizations for arbitrary odd-length chains and establish general conditions under which ESE occurs or does not occur. We propose the process of \\emph{spectral fusion} (SF) to build infinite families of such Hamiltonians. These results broaden the known class of spin chains displaying early state exclusion and further clarify the role of spectral structure of the Hamiltonians.", "url": "https://arxiv.org/abs/2606.04353", "type": "理论", "summary": "1. 该工作通过谱融合方法构造了任意奇数长度对称自旋链的Jacobi矩阵实现，严格建立了早期态排除（ESE）发生的充要条件。\n2. 其技术核心在于提出谱融合过程，将具有或不具有ESE的完美态传输哈密顿量扩展为无限族，并利用本征值分布与本征矢对称性解释ESE机制。\n3. 这为设计特定量子信息传输协议提供了系统化的可解模型框架，并进一步揭示了哈密顿量谱结构对态转移动力学的决定性影响。", "summary_source": "deepseek", "authors": [{"name": "Mia Escobar"}, {"name": "Valentin Garcia"}, {"name": "Anastasiia Minenkova"}], "featured_authors": [{"name": "Mia Escobar"}, {"name": "Valentin Garcia"}, {"name": "Anastasiia Minenkova"}], "author_count": 3}, {"id": "2606.04386", "category": "quant-ph", "title": "Optimizing the Sensitivity-Noise Trade-off in Non-Hermitian Sensing via Off-Exceptional-Deficiency Operation", "abstract": "A central challenge in non-Hermitian sensing is that spectral singularities simultaneously amplify both the signal and environmental noise. We address this predicament in a double-chain Hatano-Nelson model featuring unidirectional interlayer coupling. At the exceptional deficiency (ED) limit, the system exhibits a macroscopically degenerate complex spectrum and a pronounced non-Hermitian skin effect (NHSE), yielding a sensitivity that scales exponentially with lattice size $N$ while remaining robust across a six-order-of-magnitude detuning range. By introducing diagonal spatial disorder, we demonstrate that the NHSE is progressively suppressed, whith eigenspace cosine similarity analysis quantifying a well-defined fault-tolerance threshold. To reconcile the sensitivity-noise trade-off, we delineate \"At-ED\" and \"Off-ED\" operating regimes. While the At-ED configuration imposes fractional-order noise amplification (SNR $\\propto \\delta^{-1/2}$) that saturates at a suboptimal plateau, migrating to the Off-ED regime eliminates this geometric singularity and restores a linear scaling law (SNR $\\propto \\delta^{-1}$), achieving an SNR enhancement of several orders of magnitude. Crucially, this improvement is achieved while fully preserving the exponential sensitivity scaling, albeit at a slightly reduced absolute sensitivity compared to the strict At-ED limit. Our findings establish the Off-ED framework as a concrete paradigm for next-generation topological sensors that reconcile extreme sensitivity with robust noise immunity.", "url": "https://arxiv.org/abs/2606.04386", "type": "理论+数值", "summary": "1. 该工作利用双链Hatano-Nelson模型，系统研究了非厄米传感中通过偏离例外缺陷（Off-ED）操作优化灵敏度与噪声权衡的问题。\n2. 其核心在于对比At-ED与Off-ED工作区间：At-ED导致分数阶噪声放大（信噪比∝δ^{-1/2}）并饱和，而Off-ED消除几何奇点，恢复线性信噪比标度（∝δ^{-1}），同时完全保持指数灵敏度（∝e^N）且绝对灵敏度略有降低。\n3. 这为设计下一代同时具备极端灵敏度与鲁棒噪声免疫力的拓扑传感器提供了明确的Off-ED范式启发。", "summary_source": "deepseek", "authors": [{"name": "Shangxuan Li"}, {"name": "Bin Guo"}], "featured_authors": [{"name": "Shangxuan Li"}, {"name": "Bin Guo"}], "author_count": 2}, {"id": "2606.04548", "category": "quant-ph", "title": "Distributed Variational Quantum Optimisation by Entanglement-Selective Transport", "abstract": "Distributed quantum optimisation is challenging because computing the problem cost function across multiple quantum processors requires non-local gates, which can incur overhead in latency and fidelity. Here we introduce QESTO, a distributed variational ansatz for graph-based discrete optimisation that requires only persistent pre-shared Bell pairs for remote operations. Using local operations, it encodes local constraint information in the Bell pairs that is leveraged to produce amplitude transfer towards globally valid distributed solution states. QESTO requires one Bell pair per distributed edge of the problem graph and, after initialisation of the Bell states, uses no non-local gates. On two bounded weighted Wang tile-matching problem ensembles, QESTO achieves stronger convergence to low-cost tilings than equivalently partitioned QAOA with no distributed gates at ansatz depths of two or higher, and exceeds the mean performance of monolithic QAOA at the deepest studied depth in both ensembles. These results suggest that persistent entanglement can support useful variational communication while reducing per-layer non-local gate overhead.", "url": "https://arxiv.org/abs/2606.04548", "type": "理论+数值", "summary": "1. 该工作提出分布式变分量子优化方法QESTO，利用持久预共享贝尔对代替非局域逻辑门，实现图离散优化问题的远程操作。\n2. 其技术核心在于通过局域操作将约束信息编码至贝尔对，驱动振幅向全局有效解转移，避免了逐层非局域门开销。\n3. 在加权的王瓷砖匹配问题中，QESTO在较深电路下超越分区QAOA和单块QAOA，表明持久纠缠可支撑分布式变分量子通信。", "summary_source": "deepseek", "authors": [{"name": "Edric Matwiejew"}, {"name": "Pascal Elahi"}, {"name": "Ugo Varetto"}], "featured_authors": [{"name": "Edric Matwiejew"}, {"name": "Pascal Elahi"}, {"name": "Ugo Varetto"}], "author_count": 3}, {"id": "2606.04679", "category": "quant-ph", "title": "Hybrid quantum-classical physics-informed neural networks for solving nonlinear PDEs: when and where hybridization is effective?", "abstract": "Physics-informed neural networks (PINNs) often struggle on nonlinear partial differential equations (PDEs) with sharp gradients, stiff dynamics, high-frequency content, or multiscale structure. Such limitations, rooted in spectral bias, ill-conditioned optimization, and unstable convergence, restrict PINN accuracy in regimes where advanced solvers are most needed. In this work, we develop a hybrid quantum-classical physics-informed neural network (HQPINN) that integrates a classical neural-network backbone with a parameterized quantum circuit (PQC) to enrich the solution representation. The framework is benchmarked against a classical PINN on three representative nonlinear PDEs: Burgers' equation, the Allen-Cahn equation, and the Korteweg-de Vries (KdV) equation. The framework is further examined through a systematic sensitivity analysis of qubit count, circuit depth, PQC placement, collocation density, and classical-network width. Across all benchmarks, HQPINNs exhibit smoother training dynamics, reduced loss oscillations, and improved final accuracy, with the largest gains occurring in stiff and multiscale regimes. Relative L2 error decreases by about fourfold for Burgers' equation and fivefold for the Allen-Cahn equation, while improvements for the KdV equation are more moderate. Overall, the results demonstrate that carefully co-designed hybrid quantum-classical architectures can mitigate key limitations of classical PINNs and provide practical design guidance for near-term quantum-enhanced PDE solvers.", "url": "https://arxiv.org/abs/2606.04679", "type": "理论+数值", "summary": "1. 该工作开发一种混合量子-经典物理信息神经网络（HQPINN），集成经典神经网络骨架与参数化量子电路，用于求解Burgers、Allen-Cahn和KdV这类非线性偏微分方程。\n2. 其技术卖点在于通过系统超参数灵敏度分析，揭示在刚性和多尺度区域中混合架构能平滑训练动力学、减少损失振荡，并使相对L2误差降低四至五倍。\n3. 这为克服经典PINN在复杂PDE上的谱偏差与优化困难提供了设计准则，并为近期量子增强求解器的应用场景选择给出定量指导。", "summary_source": "deepseek", "authors": [{"name": "Kaveh Zabihi"}, {"name": "Hamid Montazeri"}, {"name": "Akke S.J. Suiker"}], "featured_authors": [{"name": "Kaveh Zabihi"}, {"name": "Hamid Montazeri"}, {"name": "Akke S.J. Suiker"}], "author_count": 3}, {"id": "2606.04681", "category": "quant-ph", "title": "Protecting Quantum States via the Super-Zeno Effect and Anticoherence", "abstract": "We consider a spin system coupled to a noisy environment via an interaction Hamiltonian $H$ which is a polynomial of degree $n$ in the spin operators $S_i$ ($n$-magnetic Hamiltonian), and show that the use of the quantum super-Zeno effect in conjunction with a spin-anticoherent subspace, is highly effective in protecting the spin from the noise. When $n=1$, as in the case of unwanted rotations induced by stray magnetic fields, our scheme provides a quantum gyroscope, a concept that generalizes naturally to higher $n$ values (a quantum $n$-gyroscope). The gist of the proposed protocol is to use the quantum super-Zeno effect to confine a state to the subspace, and then exploit anticoherence to freeze its evolution within it.", "url": "https://arxiv.org/abs/2606.04681", "type": "理论", "summary": "1. 本文考虑自旋系统与n阶自旋算符多项式耦合的噪声环境，利用量子超Zeno效应与自旋反相干子空间联合保护量子态。\n2. 其核心在于通过超Zeno效应将量子态囚禁于特定子空间，并借助反相干性冻结其内部演化，从而实现对n=1情形下杂散磁场诱导旋转的量子陀螺仪功能及其高阶推广。\n3. 该方案为抗噪声量子态保护提供了基于反相干子空间与超Zeno效应的新机制，并可拓展至更复杂的自旋相互作用环境中的量子控制与测量。", "summary_source": "deepseek", "authors": [{"name": "C. Chryssomalakos"}, {"name": "A. G. Flores-Delgado"}, {"name": "E. Guzmán-González"}, {"name": "L. Hanotel"}], "featured_authors": [{"name": "C. Chryssomalakos"}, {"name": "A. G. Flores-Delgado"}, {"name": "E. Guzmán-González"}, {"name": "L. Hanotel"}], "author_count": 4}, {"id": "2606.04689", "category": "quant-ph", "title": "QPredSGG: Hybrid Quantum Predicate Learning for Long-Tailed Scene Graph Generation", "abstract": "Scene Graph Generation (SGG) requires relational reasoning over objects and their interactions, but performance is often limited by severe long-tail predicate imbalance. Classical SGG models frequently rely on dataset statistics, leading to biased predictions toward frequent relations rather than fine-grained semantic predicates. Although existing debiasing strategies improve mean recall, predicate classification in current frameworks still often depends on large classical decision modules with high parameter cost. This work introduces a hybrid quantum predicate classifier for SGG by replacing the classical predicate head in Causal Feature Enhancement Network (CFEN) with a Quantum Predicate Head (QP-Head) trained using weighted cross-entropy. To the best of our knowledge, this is among the first studies to evaluate a hybrid quantum architecture for scene graph predicate classification on Visual Genome 150. We study the effect of qubit count, encoding strategy, entangling structure, and circuit depth on relational prediction. The best 4-qubit QP-Head uses Amplitude Embedding and Strongly Entangling Layers to compress 4096-dimensional pair features into a 16-dimensional quantum-compatible representation, corresponding to a 256$\\times$ reduction. It achieves an mR@100 of 57.25%, compared with 41.1% for the classical CFEN reference, while using only 96 trainable quantum parameters. Scaling to 8 qubits maintains strong long-tail performance, reaching an mR@100 of 55.38% with 384 quantum parameters, while the depth analysis shows a trade-off between expressibility and runtime overhead. These results suggest that compact hybrid quantum predicate heads can support parameter-efficient long-tail relational classification in complex visual reasoning tasks.", "url": "https://arxiv.org/abs/2606.04689", "type": "理论+数值", "summary": "1. 该工作提出用混合量子谓词分类器（QP-Head）替代经典谓词头，在Visual Genome 150数据集上实现长尾场景图生成。\n2. 核心在于4-量子比特振幅嵌入与强纠缠层将4096维对特征压缩至16维，仅96个可训练参数达mR@100为57.25%，优于经典参考的41.1%。\n3. 这显示紧凑量子谓词头能以参数高效方式支持长尾关系分类，为复杂视觉推理中的量子-经典架构提供有益借鉴。", "summary_source": "deepseek", "authors": [{"name": "Prerana Ramkumar"}, {"name": "Nouhaila Innan"}, {"name": "Muhammad Shafique"}], "featured_authors": [{"name": "Prerana Ramkumar"}, {"name": "Nouhaila Innan"}, {"name": "Muhammad Shafique"}], "author_count": 3}, {"id": "2606.04721", "category": "quant-ph", "title": "Quantification of Entanglement in Three-Qubit Systems", "abstract": "This study presents an analytical investigation of entanglement quantification in three-qubit pure states through the Acín canonical representation, which serves as a generalization of the two-qubit Schmidt decomposition. Driven by the intricacies of multipartite entanglement and the shortcomings of current measures, we employ a global concurrence measure derived from the generalized concurrence of various bipartitions within the system. The characteristics of this measure are explored both analytically and numerically across a range of SLOCC entanglement classes, such as product, biseparable, GHZ-type, and W-type states. When compared to the three-tangle and tripartite negativity, our findings indicate that this measure yields complementary insights into multipartite correlations. The outcomes underscore the significance of this measure in elucidating the structure and distribution of entanglement within three-qubit quantum systems.", "url": "https://arxiv.org/abs/2606.04721", "type": "理论+数值", "summary": "1. 该工作通过Acín规范表示解析量化三量子比特纯态纠缠，并采用基于各二分划广义并发度的全局并发度测量。\n2. 其技术核心在于在SLOCC纠缠类（可分离、GHZ型及W型等）中解析与数值探究该测量特性，揭示其与三-tangle及三分负值的互补关联。\n3. 该测量为阐明三量子比特系统纠缠结构与分布提供了有效工具，并可能拓展至更多体多分纠缠的量化研究。", "summary_source": "deepseek", "authors": [{"name": "Zikra Aram"}], "featured_authors": [{"name": "Zikra Aram"}], "author_count": 1}, {"id": "2606.04759", "category": "quant-ph", "title": "Efficient Description of Parametric Amplification of Quantum Pulses", "abstract": "A single quantum pulse undergoing parametric amplification feeds into at most two pulses in the output. In this work, we present an efficient, analytical method for finding the quantum state of these output modes. Our method applies the amplification to the vacuum rather than to the input state, and subsequently applies a transformed version of the operator that creates the input state from vacuum. Given the input and output pulse mode functions, the method is analytical, and therefore computationally very efficient, and it can be readily generalized to multiple non-vacuum input modes. We exemplify the method by computing the output quantum states resulting from the input of a coherent, a Schrödinger cat, and a single photon input quantum state. We further employ the method to obtain the quantum state in one of the two output modes heralded upon detection of vacuum in the other, least populated, mode.", "url": "https://arxiv.org/abs/2606.04759", "type": "理论", "summary": "1. 本工作提出了一种解析且计算高效的方案，用于求解参量放大过程中量子脉冲输入对应的输出多模量子态。\n2. 其技术核心是将参量放大作用于真空而非输入态，再通过变换输入态的产生算符来获取输出态，从而避免直接演化并支持多模推广。\n3. 该方法适用于相干态、薛定谔猫态及单光子等多种输入，并可基于真空检测实现输出模式的纠缠或条件态制备，为量子信息处理提供实用工具。", "summary_source": "deepseek", "authors": [{"name": "Victor Rueskov Christiansen"}, {"name": "Klaus Mølmer"}, {"name": "Emanuel Hubenschmid"}], "featured_authors": [{"name": "Victor Rueskov Christiansen"}, {"name": "Klaus Mølmer"}, {"name": "Emanuel Hubenschmid"}], "author_count": 3}, {"id": "2606.04761", "category": "quant-ph", "title": "Comment on \"Possibility of superradiant neutrino emission by atomic condensate\" by M. Blasone, L. Gastaldo and F. Romeo, Phys. Rev. D 113, 053010 (2026)", "abstract": "We show that the recent proposal for superradiant emission of neutrinos cannot evade our proof that superradiant neutrino emission is fundamentally impossible. Pairing two fermions in a molecule does not remove the cancellation of interference terms in neutrino emission due to fermionic anticommutators.", "url": "https://arxiv.org/abs/2606.04761", "type": "理论", "summary": "1. 该评论指出，通过分子配对两个费米子无法规避因费米子反对易关系导致的中微子发射干涉项抵消，从而否定原子凝聚体中微子超辐射的可能性。\n2. 其核心论据是：无论费米子以何种形式结合，量子统计导致的发射振幅相消机制依然有效，超辐射发射在根本上不可能实现。\n3. 这一结论对基于原子或分子系统实现中微子超辐射的实验与理论探索提出了严格的根本性限制。", "summary_source": "deepseek", "authors": [{"name": "Wolfgang Ketterle"}, {"name": "Hanzhen Lin"}, {"name": "Yu-Kun Lu"}], "featured_authors": [{"name": "Wolfgang Ketterle"}, {"name": "Hanzhen Lin"}, {"name": "Yu-Kun Lu"}], "author_count": 3}, {"id": "2606.04763", "category": "quant-ph", "title": "Imaginarity witness", "abstract": "Imaginarity has shown to be an important resource in quantum information. The witness theory of quantum resource, such as entanglement witness, coherence witness, and imaginarity witness, has been established, in particular entanglement witness and coherence witness have been extensively explored. We present here another class of imaginarity witnesses beyond the one in [{Phys. Lett. A} \\textbf{530}, 130135 (2025)]. Within our framework, any nonreal Hermitian operator under the reference basis is an imaginarity witness and only finite of them can detect all the imaginarity states. As the common approaches that were explored in the witness theories of entanglement and coherence, we then explore the relations between these imaginarity witnesses in different cases: (i) when they can detect common imaginary states, (ii) when they can detect the same sets of imaginary states, and (ii) when they obey the finer relation. Finally, we define an imaginarity measure in terms of witnesses, termed witnessed imaginarity, and prove that it coincides with both the trace norm of imaginarity and the robustness of imaginarity.", "url": "https://arxiv.org/abs/2606.04763", "type": "理论", "summary": "1. 该工作提出了一类超越已有框架的虚数性见证人，基于任意非实厄米算符在参考基下均可作为虚数性见证人的理论。\n2. 其核心在于证明仅需有限个此类见证人即可探测所有虚数态，并系统刻画了不同见证人间探测虚数态集合的包含、等价与精细关系。\n3. 这为量子资源理论中虚数性的度量化提供了新途径，所定义的见证虚数性等价于迹范数与鲁棒性虚数性度量。", "summary_source": "deepseek", "authors": [{"name": "Zhiqi Liang"}, {"name": "Yufan Lin"}, {"name": "Yu Guo"}, {"name": "Yuqi Sun"}], "featured_authors": [{"name": "Zhiqi Liang"}, {"name": "Yufan Lin"}, {"name": "Yu Guo"}, {"name": "Yuqi Sun"}], "author_count": 4}, {"id": "2606.04817", "category": "quant-ph", "title": "Effect of isotropic errors on the complexity of Grover's algorithm", "abstract": "Isotropic errors have been shown to be immune to conventional error correction techniques. While general theoretical frameworks have been proposed to model such errors, there have been no studies so far analysing their concrete impact on practical use-cases. Here we explore the effect of isotropic errors on the complexity of Grover's search algorithm through numerical simulations, with an analysis of the impact on the algorithm's performance and success probability. The results provide insights into the robustness of Grover's algorithm against isotropic errors, highlighting potential challenges for implementations on noisy quantum hardware. All results presented here are obtained through numerical simulations using the open-source python library \\texttt{isotropic} developed as part of this work. The source code, numerical simulations and documentation for the library are available online at this https URL .", "url": "https://arxiv.org/abs/2606.04817", "type": "理论+数值", "summary": "1. 该工作通过数值模拟，定量分析了各向同性错误对Grover搜索算法查询复杂度与成功概率的影响。\n2. 其核心在于揭示了各向同性错误会导致算法成功率急剧下降，并使最优查询次数偏离理想值。\n3. 这警示了在噪声量子硬件上实现Grover算法时，针对非传统错误模式的纠错方案需额外考量。", "summary_source": "deepseek", "authors": [{"name": "Anurag Saha Roy"}, {"name": "Jesús Lacalle"}], "featured_authors": [{"name": "Anurag Saha Roy"}, {"name": "Jesús Lacalle"}], "author_count": 2}, {"id": "2606.04835", "category": "quant-ph", "title": "Reconciliation of effective Hamiltonians for intense light-matter interaction", "abstract": "Essential-state models are central for quantum control and technology in broad regimes of light-matter interaction. The canonical effective Hamiltonian is obtained equivalently from adiabatic elimination, the Markov approximation, and the pole approximation. These approximations are known to break down at high intensities, significantly limiting their applicability to moderate light-matter interaction. We show how this limitation can be addressed by applying quasi-degenerate Rayleigh-Schrödinger perturbation theory (QD-RSPT). We reconcile QD-RSPT with adiabatic elimination and propose a quasi-degenerate extension of adiabatic elimination that is robust when the detuning of the essential states is non-negligible. The accuracy of QD-RSPT is demonstrated in both the low- and high-frequency regime, showing excellent agreement with Floquet calculations at high intensities. The crucial corrections to adiabatic elimination make the eigenvectors of the effective Hamiltonian non-orthogonal. Physically, this allows us to account for the asymmetric strength with which different essential states couple to the non-essential states. We expect that our systematic approach to effective Hamiltonians from QD-RSPT will constitute a new state of the art in intense light-matter interaction and quantum optics with novel forms of strong coupling and quantum control phenomena being conceivable.", "url": "https://arxiv.org/abs/2606.04835", "type": "理论+数值", "summary": "1. 本文通过准简并瑞利-薛定谔微扰理论调和了强光-物质相互作用中的有效哈密顿量，克服了绝热消除在高强度下的失效。\n2. 核心在于提出准简并绝热消除方法，并揭示有效哈密顿量的本征矢非正交性可描述不同能级与非必需态耦合的不对称性。\n3. 该系统性方法有望成为强光-物质相互作用与量子光学领域的新基准，为强耦合及非厄米量子控制机制提供理论支撑。", "summary_source": "deepseek", "authors": [{"name": "Jakob Nicolai Bruhnke"}, {"name": "Jan Marcus Dahlström"}], "featured_authors": [{"name": "Jakob Nicolai Bruhnke"}, {"name": "Jan Marcus Dahlström"}], "author_count": 2}, {"id": "2606.04843", "category": "quant-ph", "title": "Decoded Quantum Interferometry Beyond Hamming: Rank-Metric and Translation Association Schemes", "abstract": "Decoded Quantum Interferometry (DQI) uses coherent decoding and a quantum Fourier transform to find high-quality solutions of structured optimisation problems. Existing analyses are closely tied to Hamming space, which underlies the optimisation objective, Dicke state preparation and the decoding step of the algorithm. Here we extend the core DQI mechanism beyond Hamming space to finite geometries with translation symmetry, where points are grouped into shells by their distance from a basepoint. Mathematically, these geometries are translation association schemes. In this setting the algorithm can be analysed by tracking one amplitude per shell, and biasing the prepared state towards high-quality solutions becomes a finite tridiagonal eigenvalue problem. As a non-Hamming example, we develop an efficient DQI protocol for finding an m x n finite-field matrix with smallest rank difference to a target matrix. Initial states are uniform superpositions over fixed-rank matrices, and Gabidulin codes provide candidates for efficient low-rank decoding up to a cutoff l. For this objective, this finds solutions with an effective-rank proxy near min(m,n)-l, and the corresponding expected score can be converted into a constant-probability bound on the residual rank of a sample. For Gabidulin nearest-codeword instances, a covering-radius obstruction shows that this bound does not imply an additive guarantee for the true optimum, and we do not claim a quantum advantage for the rank-metric construction. The results instead identify the geometric and coding ingredients for DQI beyond Hamming space.", "url": "https://arxiv.org/abs/2606.04843", "type": "理论+数值", "summary": "1. 该工作将解码量子干涉法从汉明空间推广至具有平移对称性的有限几何（平移结合方案），并构造了针对有限域矩阵秩差优化问题的有效协议。\n2. 其核心卖点在于利用陪集结构中振幅按壳层衰减的机制，将偏向高质量解的状态制备简化为有限三对角特征值问题，并借助Gabidulin码实现截止秩内的低效解码。\n3. 这一推广揭示了超越汉明空间的几何与编码要素，为在更一般结合方案中设计量子干涉算法提供了结构化的理论路径。", "summary_source": "deepseek", "authors": [{"name": "Alexandre Krajenbrink"}, {"name": "Colin Krawchuk"}, {"name": "Ansis Rosmanis"}, {"name": "Matthias Rosenkranz"}], "featured_authors": [{"name": "Alexandre Krajenbrink"}, {"name": "Colin Krawchuk"}, {"name": "Ansis Rosmanis"}, {"name": "Matthias Rosenkranz"}], "author_count": 4}, {"id": "2606.04940", "category": "quant-ph", "title": "Convergence rates of Sum-of-Hermitian-Squares Hierarchies for the Pauli algebra", "abstract": "Moment/Sum-of-Hermitian-Squares relaxations for noncommutative polynomial optimization problems have become an important tool for analyzing problems within quantum theory. Despite their widespread success, little is known about their rate of convergence and, consequently, their accuracy. In this work, we develop explicit convergence rates for relaxations of noncommutative polynomial optimization problems generated from the Pauli algebra -- covering applications to the ground state energy problem for n-qubit systems. In particular, we show that the rate of convergence can be bounded in terms of the smallest roots of a family of orthogonal polynomials known as Krawtchouk polynomials. Our result represents the first quantitative analysis of the rate of convergence for relaxations of noncommutative polynomial optimization problems.", "url": "https://arxiv.org/abs/2606.04940", "type": "理论+数值", "summary": "1. 该工作导出了Pauli代数上非交换多项式优化问题松弛的显式收敛速率。\n2. 其技术核心是将收敛速率上界关联到Krawtchouk正交多项式的最小根。\n3. 这为n量子比特基态能量问题中矩松弛的精度提供了首次定量保证。", "summary_source": "deepseek", "authors": [{"name": "Ali Almasi"}, {"name": "Dávid Bugár"}, {"name": "Cambyse Rouzé"}, {"name": "Peter Brown"}], "featured_authors": [{"name": "Ali Almasi"}, {"name": "Dávid Bugár"}, {"name": "Cambyse Rouzé"}, {"name": "Peter Brown"}], "author_count": 4}, {"id": "2606.04955", "category": "quant-ph", "title": "Expressibility, Noise, and Error Mitigation in VQE Ansatz Selection", "abstract": "The variational quantum eigensolver (VQE) is a promising algorithm for near-term quantum chemistry applications, but selecting optimal ansatz circuits remains challenging. Expressibility, a metric quantifying a circuit's ability to explore the Hilbert space, has been proposed as a guide for ansatz selection, but recent work showed it inconsistently predicts VQE performance under realistic noise for $H_2$. We extend this investigation to cover both $H_2$ and $H_3^+$ under four execution scenarios: ideal, noisy, and noisy with zero-noise extrapolation (ZNE) or probabilistic error cancellation (PEC). We find that error mitigation does not reliably restore expressibility's predictive power. ZNE reduces error for only 4 of 12 $H_2$ circuits and 4 of 6 $H_3^+$ circuits, while PEC actually increases error in 11 of 12 $H_2$ circuits and all 6 $H_3^+$ circuits. We reproduce and extend Saib et al.'s key finding that circuit rankings scramble under noise (Spearman $\\rho \\approx -0.1$ between ideal and noisy rankings), and identify a new result: ZNE largely preserves noisy rankings ($\\rho = +0.80$ for $H_2$) while PEC actively reorders them ($\\rho = -0.22$). Noisy expressibility, computed from density matrix simulations, strongly predicts unmitigated performance for $H_3^+$ (Pearson $r = +0.91$, $p = 0.01$), but this metric is computationally intractable at scale. We demonstrate that zero-cost circuit topology metrics such as two-qubit gate count provide comparable or superior predictive power for PEC degradation ($r = +0.96$ for $H_3^+$), while standard expressibility best predicts noisy and ZNE performance for $H_2$ ($r = +0.74$ and $r = +0.77$).", "url": "https://arxiv.org/abs/2606.04955", "type": "数值", "summary": "1. 该工作扩展研究了表达性指标在含噪及误差缓解场景下对VQE性能的预测能力，针对H₂和H₃⁺分子进行了全面比较。\n2. 主要发现包括：零成本电路拓扑指标（如两比特门数）可更好地预测概率误差消除的性能退化，而标准表达性仍适用于无缓解情形。\n3. 这提示在实用VQE中需结合电路拓扑与噪声特性选择ansatz，而非单独依赖表达性指标。", "summary_source": "deepseek", "authors": [{"name": "Peter Annis"}, {"name": "Abe Kassem"}, {"name": "Evan Coleman"}], "featured_authors": [{"name": "Peter Annis"}, {"name": "Abe Kassem"}, {"name": "Evan Coleman"}], "author_count": 3}, {"id": "2606.05010", "category": "quant-ph", "title": "Measurement-induced state transitions in multi-qubit transmon processors", "abstract": "Dispersive readout of the transmon qubit in circuit QED is known to lose its quantum non-demolition character at small to moderate measurement drive amplitudes. This phenomenon is understood to originate from Laundau-Zener transitions at accidental multi-photon resonances, where $n$ drive photons can promote the transmon by $m$ levels. This interpretation has been shown to be in agreement with experiments characterizing the dispersive readout of a single transmon. The impact of these measurement-induced state transition (MIST) of a transmon embedded in a multi-qubit chip, however, remains largely unexplored. Here, we show that the presence of other components, such as qubits and couplers, can affect the MIST threshold of a measured transmon. To arrive at these results, we present a general method to characterize measurement-induced transition when the qubit under readout is coupled to other circuit elements, a ubiquitous situation in circuit QED-based quantum processors. As an example, we consider the case of two transmon qubits, and we show that the spectator qubit can be impacted by the measurement-induced transition of the readout qubit and, conversely, that the presence of the spectator qubit can lower the MIST threshold of the readout qubit. Finally, we explore how adding a coupler mode between the two qubits further modifies these effects.", "url": "https://arxiv.org/abs/2606.05010", "type": "实验", "summary": "1. 该工作实验和理论表征了多量子比特transmon处理器中测量诱导态跃迁，发现旁观量子比特与耦合器可调变被测量子比特的跃迁阈值并相互影响。\n2. 其核心技术是建立一种通用方法，分析量子比特耦合其他电路元件时的测量诱导跃迁，并以两量子比特系统揭示旁观者降低阈值及耦合器额外调制的反馈机制。\n3. 该结果为大规模超导量子处理器中读取误差抑制与保真度优化提供了理论依据，并增进了对多体耦合测量退相干物理的理解。", "summary_source": "deepseek", "authors": [{"name": "Baptiste Hoyau"}, {"name": "Alexander McDonald"}, {"name": "Boris M. Varbanov"}, {"name": "Manuel H. Muñoz-Arias"}, {"name": "Alexandre Blais"}], "featured_authors": [{"name": "Baptiste Hoyau"}, {"name": "Alexander McDonald"}, {"name": "Boris M. Varbanov"}, {"name": "Manuel H. Muñoz-Arias"}, {"name": "Alexandre Blais"}], "author_count": 5}, {"id": "2606.05032", "category": "quant-ph", "title": "Gaussian mean width strong converse bound on the classical identification capacity of quantum channels", "abstract": "We establish a single-letter and efficiently computable strong converse bound on the classical identification capacity of quantum channels. By equipping the $n$-fold channel output space with a product state-weighted $\\sigma$-Euclidean geometry, we allow trace-distance separation constraints for identification codes to be controlled by Euclidean covering estimates. Using Sudakov's inequality, we bound the covering numbers of the $n$-fold channel outputs via their Gaussian mean widths in the weighted geometry, whose exponential growth in $n$ is governed by the operator norm of a single-letter positive operator. Upon optimizing over all weighing states $\\sigma$, this yields a strong converse bound on the identification capacity of the channel, which also admits a semidefinite representation. Our method improves the best known converse bounds on the identification capacity of several important examples, such as depolarizing, Pauli, erasure, and amplitude damping channels. We also discuss extensions of this method to more general Euclidean geometries on the output space.", "url": "https://arxiv.org/abs/2606.05032", "type": "理论+数值", "summary": "1. 该工作建立了量子信道经典识别容量的单字母、可高效计算的强逆界。\n2. 核心技术在于利用σ-加权欧几里得几何和Sudakov不等式，将信道输出的覆盖数控制为高斯平均宽度，其指数增长由单字母正算子的算子范数决定。\n3. 该强逆界具有半定规划表示，显著改进了去极化、Pauli、擦除和振幅阻尼等信道的已知上界，并可推广至更一般的输出空间欧几里得几何。", "summary_source": "deepseek", "authors": [{"name": "Satvik Singh"}], "featured_authors": [{"name": "Satvik Singh"}], "author_count": 1}, {"id": "2606.05044", "category": "quant-ph", "title": "Generalized Bicycle Codes as Cyclic Submodules and their Automorphism Structure", "abstract": "Automorphisms of quantum codes, when they exist, offer a pathway toward fault-tolerant gate implementation via qubit relabeling. Although useful, the conditions under which automorphisms appear in a given code remain poorly understood. In this paper, we develop an algebraic framework for systematically analyzing and engineering automorphisms in Generalized Bicycle (GB) codes. Central to our approach is the derivation of a three-space dependency between the polynomial ring space, the parity check matrix space, and the $\\mathbb{F}_2^{2\\ell}$ qubit space, similar to the structure found in the study of classical cyclic codes. By expressing GB codes as a pair of cyclic submodules of $R_\\ell^2$, where $R_\\ell \\cong \\mathbb{F}_2[x]/\\langle x^\\ell-1\\rangle$, we reduce the search for code automorphisms to a deterministic algebraic problem, deriving necessary and sufficient conditions for the existence of block-separable automorphisms built from cyclic shifts, ring automorphisms and block-swaps. We connect these conditions to the fold-transversal gate framework, providing explicit criteria for the existence of $H$-, $S$-, and $CX$-type fold-transversal gates. We further discuss structured bases for logical operators in order to determine the logical action of a given automorphism. Finally, we introduce the Maximal Cube Root (MCR) code family, a family of GB codes constructed around the principle of maximizing automorphism flexibility and fold-CX gates. We demonstrate a collection of $k=2$ MCR codes up to $d=13$ generating the 2-qubit Clifford group via automorphism and fold-transversal gates, with stabilizer weight ranging from 8 to 16, and $k>2$ MCR codes with a minimum of 20 distinct logical gates achievable from automorphisms. This serves as a first demonstration of inverse design: using these methods to build codes around a rich automorphism structure from the ground up.", "url": "https://arxiv.org/abs/2606.05044", "type": "理论", "summary": "1. 该工作发展了一套代数框架，将广义自行车码表示为多项式环上的循环子模对，从而系统分析与工程设计其自同构结构。\n2. 核心在于将码自同构搜索转化为可由块移位、环自同构与块交换描述的确定性代数条件，并以此建立与折叠横向H、S、CX门存在的严格判据。\n3. 这启示了逆设计思路，即通过最大化自同构灵活性来构造Maximal Cube Root码族，实现低码重下逻辑门的丰富性与Clifford群生成。", "summary_source": "deepseek", "authors": [{"name": "AJ Davenport"}, {"name": "John Blue"}, {"name": "Isaac Chuang"}], "featured_authors": [{"name": "AJ Davenport"}, {"name": "John Blue"}, {"name": "Isaac Chuang"}], "author_count": 3}, {"id": "2606.05099", "category": "quant-ph", "title": "Quantum Time Lower Bounds by Permutation Invariance", "abstract": "Tight bounds on quantum sample complexity and quantum query complexity have been known for various computational problems in the literature, whereas tight bounds on quantum time complexity (i.e., the size of quantum circuits) remain unresolved. In this paper, we provide a framework to establish lower bounds on the quantum time complexity for testing permutation-invariant properties of quantum states, via a reduction from quantum sample complexity. As an application, we obtain a series of matching lower bounds when given sample access to the input quantum states, including: 1. The SWAP test due to Buhrman, Cleve, Watrous, and de Wolf (Phys. Rev. Lett. 2001) is time-optimal to estimate the purity $\\operatorname{tr}(\\rho^2)$ and the inner product $\\operatorname{tr}(\\rho\\sigma)$. 2. The Shift test due to Ekert, Alves, Oi, Horodecki, Horodecki, and Kwek (Phys. Rev. Lett. 2002) is time-optimal to estimate the high-order functionals $\\operatorname{tr}(\\rho^k)$. 3. The productness tester for multipartite pure states due to Harrow and Montanaro (J. ACM 2013) is time-optimal. 4. The LMR protocol due to Lloyd, Mohseni, and Rebentrost (Nat. Phys. 2014) is time-optimal to implement the reflection operator about a pure state. 5. The samplizer due to Wang and Zhang (IEEE Trans. Inf. Theory 2025) is time-optimal for pure states. 6. The estimator for pure-state trace distance and fidelity due to Wang and Zhang (ICALP 2026) is time-optimal. To the best of our knowledge, this is the first method that allows us to systematically establish tight lower bounds on quantum time complexity.", "url": "https://arxiv.org/abs/2606.05099", "type": "理论+数值", "summary": "1. 该工作提出一个基于置换不变性的归约框架，将量子态置换不变性质测试的时间下界转化为样本复杂度下界。\n2. 其技术核心是通过置换不变性统一证明SWAP测试、Shift测试、乘积性检验器、LMR反射协议及纯态距离估计等多个协议的时间最优性。\n3. 这为系统建立量子时间复杂度的紧下界提供了首例通用方法，并启示了更多量子算法时间最优性的可证明性。", "summary_source": "deepseek", "authors": [{"name": "Qisheng Wang"}], "featured_authors": [{"name": "Qisheng Wang"}], "author_count": 1}, {"id": "2606.05125", "category": "quant-ph", "title": "Experimentally probing the Quantum Physics in the Inverted Harmonic Oscillator", "abstract": "When a quantum system passes through an unstable fixed point the local dynamics reduces to the inverted harmonic oscillator (IHO). It exponentially amplifies along one quadrature while squeezing the other, producing macroscopically extended quantum states from microscopic zero-point fluctuations. We realize this dynamics with a Bose-Einstein condensate on an AtomChip. Radio-frequency dressing flips the transverse harmonic confinement into an IHO. Through phase-space tomography we follow the full Wigner function of the evolving quantum state, observe sub-vacuum squeezing of 10.6(1.3) dB, and test coherent reversibility by time-reversing the IHO evolution. Matter-wave interference between the two daughter clouds confirms quantum coherence over timescales far beyond the initial expansion. Our experiment establishes ultra-cold atoms as a clean, controlled, many-body platform for unstable quantum dynamics opening a route to force sensing with time-reversal-based coherence certification and to analog studies of the amplification of quantum fluctuations in inflationary field dynamics.", "url": "https://arxiv.org/abs/2606.05125", "type": "实验", "summary": "1. 该工作在AtomChip上利用玻色-爱因斯坦凝聚体实现了倒谐振子动力学，实验研究了其量子行为。\n2. 其核心卖点在于通过射频缀饰将横向谐波陷阱翻转成倒谐振子，并结合相空间层析测量Wigner函数，观察到10.6 dB的亚真空压缩及时间反演相干性。\n3. 这为基于时间反演相干性验证的力传感和暴胀场涨落放大模拟提供了可控的多体平台。", "summary_source": "deepseek", "authors": [{"name": "Si-Cong Ji"}, {"name": "Philipp Schüttelkopf"}, {"name": "Nataliia Bazhan"}, {"name": "Federica Cataldini"}, {"name": "Mohammadamin Tajik"}, {"name": "Frederik S. Møller"}, {"name": "Igor Mazets"}, {"name": "Sebastian Erne"}, {"name": "Jörg Schmiedmayer"}], "featured_authors": [{"name": "Si-Cong Ji"}, {"name": "Philipp Schüttelkopf"}, {"name": "Nataliia Bazhan"}, {"name": "Igor Mazets"}, {"name": "Sebastian Erne"}, {"name": "Jörg Schmiedmayer"}], "author_count": 9}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
