guel A. L. Marques"}], "featured_authors": [{"name": "Thalis H. B. da Silva"}, {"name": "Hai-Chen Wang"}, {"name": "Miguel A. L. Marques"}], "author_count": 3}, {"id": "2610.23627", "category": "cond-mat", "title": "Grain boundary strength and corrosion cracking susceptibility in TiN coatings under fission product segregation", "abstract": "During fuel-cladding chemical interaction (FCCI), lanthanide fission products generated in the fuel can migrate into cladding grain boundaries (GBs), where segregation may reduce GB strength and promote corrosion cracking. We use first-principles segregation, decohesion, and bonding calculations to quantify Nd and Ce effects on six coincident-site lattice GBs in bcc Fe and TiN. For each material, segregation energies, work-of-separation values for complete interfacial cleavage, and traction-separation curves measuring ideal resistance to crack opening were evaluated within a consistent computational framework. Nd and Ce segregate favorably to both materials, and the median segregation energies are more negative in TiN, showing that TiN does not simply exclude these species from internal interfaces. The mechanical responses of Fe and TiN differ sharply. In Fe, Nd and Ce consistently reduce work of separation and peak traction, with median work-of-separation retentions of 0.72 and 0.65 and median peak-traction retentions of 0.47 and 0.43. In TiN, most decorated GBs preserve much of the clean response, with median work-of-separation retentions of 1.00 and 0.97 and median peak-traction retention of 0.85 for both fission products. Bonding analysis shows weak, occupied antibonding X-Fe replacement bonds in Fe, whereas the surrounding Ti-N network remains largely preserved after Nd/Ce segregation in TiN. These results provide atomistic support for the use of TiN and related nitride coatings to reduce FCCI damage by retaining GB strength if fission products segregate to coating internal interfaces. This retention of GB strength also provides a mechanistic descriptor for assessing coating susceptibility to FCCI-assisted corrosion cracking and environmentally assisted intergranular fracture.", "url": "https://arxiv.org/abs/2610.23627", "type": "理论+数值", "summary": "1. 该工作采用第一性原理偏析、分离功与成键计算，在统一框架下量化Nd和Ce对bcc Fe与TiN中六个重合位置点阵晶界的影响。\n2. 其卖点是TiN虽对Nd/Ce偏析能更负，却使多数晶界分离功中位保持率约1.00/0.97、峰值牵引力约0.85，而Fe分别降至0.72/0.65和0.47/0.43，成键上对应Fe的弱反键X-Fe替换键与TiN保留的Ti-N网络。\n3. 这为TiN及相关氮化物涂层通过保留晶界强度缓解FCCI损伤提供原子尺度支持，并为评估涂层对FCCI辅助腐蚀开裂与环境辅助沿晶断裂的敏感性提供机制性描述符。", "summary_source": "deepseek", "authors": [{"name": "Jia-Hong Ke"}, {"name": "Rongjie Song"}], "featured_authors": [{"name": "Jia-Hong Ke"}, {"name": "Rongjie Song"}], "author_count": 2}, {"id": "2610.23674", "category": "cond-mat", "title": "Plastic Flow Rule Based on Dislocation Link Velocity", "abstract": "We develop a theory for the plastic shear rate $\\dot{\\gamma}_i$ on each slip system $i$ of face-centered cubic (FCC) single crystals, by integrating the shear rate contributions $\\dot{\\gamma}_i(l)$ from dislocation links of length $l$. A generalized Orowan equation expresses $\\dot{\\gamma}_i(l)$ in terms of the link density $n_i(l)$ and the average link velocity $v_i(l)$. This model accurately reproduces the discrete dislocation dynamics (DDD) shear-rate data for all 12 slip systems across 99 loading orientations. In particular, it explains why the plastic shear rate depends exponentially on the resolved shear stress $\\tau_i$, as reported previously, in the absence of any thermally activated mechanism. This dependence arises from the exponential tail of $n_i(l)$ filtered through the threshold-like velocity function $v_i(l)$. Furthermore, $v_i(l)$ is well approximated by a single two-dimensional function $v(\\tau_i,l)$ for all these slip systems. The link velocity is therefore governed mainly by $\\tau_i$ and $l$, with only a minor effect from the complex interactions between slip systems. These interactions instead manifest themselves mainly through $n_i(l)$. As a demonstration of the effect of the link-length distribution on the slip rate, we show that even when $\\tau_i$ is limited to a narrow window, the shear rates still span two orders of magnitude. The supply of long links is therefore the dominant factor controlling slip-system activity, outweighing the direct effect of $\\tau_i$ on the link velocity.", "url": "https://arxiv.org/abs/2610.23674", "type": "理论+数值", "summary": "1. 该工作基于位错链接速度构建了面心立方单晶各滑移系的塑性剪切率理论，将长度l的链接贡献积分，并以广义Orowan方程用链接密度和平均速度表达。\n2. 其核心卖点在于该模型复现了99个加载取向下12个滑移系的离散位错动力学数据，并解释无热激活时剪切率对分切应力的指数依赖源于链接密度指数尾经阈值型速度函数筛选，且链接速度可近似为统一的v(τ,l)。\n3. 这启示长链接供给而非分切应力对链接速度的直接影响主导滑移系活动，为塑性流动规则及跨滑移系相互作用建模提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Hanfeng Zhai"}, {"name": "Sh. Akhondzadeh"}, {"name": "Ryan B. Sills"}, {"name": "Nicolas Bertin"}, {"name": "Wei Cai"}], "featured_authors": [{"name": "Hanfeng Zhai"}, {"name": "Sh. Akhondzadeh"}, {"name": "Ryan B. Sills"}, {"name": "Nicolas Bertin"}, {"name": "Wei Cai"}], "author_count": 5}, {"id": "2610.23687", "category": "cond-mat", "title": "Finite-temperature phase diagram of dipolar bosons in a cylindrical setup", "abstract": "Temperature plays a non-trivial role in dipolar systems, being able to either induce or destroy spatial density modulations. In order to shed light into the interplay between thermal effects and quantum correlations, we employ the path integral Monte Carlo method (PIMC) to obtain the phase diagram of a system of dipolar bosons in an infinite cylindrical geometry and at finite temperatures. For a fixed total density, we vary the scattering length of the interaction and the temperature, and characterize the structure and superfluidity of the emerging phases. The PIMC method accounts for thermal effects and quantum correlations at all orders, and can be used to quantitatively estimate the superfluid fraction of the system. Remarkably, we find a regime of parameters where, starting from a supersolid, the spatial order vanishes with temperature before the superfluidity does. We also find a region of the phase diagram where the superfluid fraction displays a non-monotonous dependence with temperature. Our results extend previous descriptions, relying on Bogoliubov theory, to larger temperatures in the thermodynamic limit and illustrate how spatial modulations and superfluidity are lost as temperature is increased.", "url": "https://arxiv.org/abs/2610.23687", "type": "理论+数值", "summary": "1. 该文用路径积分蒙特卡洛方法在无限圆柱几何中计算有限温度偶极玻色子相图，固定总密度并扫描散射长度与温度，表征各相的空间结构和超流性。\n2. 其技术要点在于全阶计入热效应与量子关联并可定量估计超流分数，揭示了从超固相升温时空间序先于超流消失，以及超流分数随温度非单调变化。\n3. 这将此前基于Bogoliubov理论的结果推广至热力学极限下更高温度，并说明空间调制与超流如何随升温丧失，为偶极量子气体实验提供可检验启示。", "summary_source": "deepseek", "authors": [{"name": "Juan Sánchez-Baena"}, {"name": "Raúl Bombín"}, {"name": "Jordi Boronat"}], "featured_authors": [{"name": "Juan Sánchez-Baena"}, {"name": "Raúl Bombín"}, {"name": "Jordi Boronat"}], "author_count": 3}, {"id": "2610.23699", "category": "cond-mat", "title": "Symmetry constraints on magnon-induced dynamics of skyrmion helicity in frustrated magnets", "abstract": "The helicity of a magnetic skyrmion in a centrosymmetric frustrated magnet is a soft collective coordinate and a candidate variable for encoding quantum information. Its coherence is ultimately influenced by coupling to the magnon environment, which is commonly incorporated only phenomenologically. Here we combine a microscopic Keldysh treatment of the helicity--magnon coupling to resolve the contribution of individual magnon modes to the effective helicity dynamics. In the U(1)-symmetric model, the magnon bath generates, to leading order, a reactive helicity mass renormalization. When U(1) symmetry is broken, additional direct helicity--magnon couplings become allowed. In the presence of finite magnon lifetimes, these couplings generate an Ohmic contribution to the low-frequency helicity dynamics. The spatial symmetry of the perturbation determines which magnon sectors contribute to this damping, providing mode-resolved selection rules for the helicity--magnon coupling. Thus, we establish a microscopic connection between helicity dynamics and the excitation spectrum of frustrated skyrmions and identify the symmetry constraints governing dissipation of helicity-based quantum states.", "url": "https://arxiv.org/abs/2610.23699", "type": "理论+数值", "summary": "1. 该工作结合微观Keldysh方法处理中心对称阻挫磁体中磁斯格明子螺旋度与磁振子环境的耦合，并分辨各磁振子模式对螺旋度有效动力学的贡献。\n2. 其核心在于：U(1)对称时磁振子浴主要导致反应性螺旋度质量重整化，对称性破缺后新增直接耦合并在有限磁振子寿命下产生低频Ohmic阻尼，且扰动的空间对称性给出模式分辨的选择定则。\n3. 这建立了螺旋度动力学与阻挫磁斯格明子激发谱的微观联系，并为螺旋度编码量子态的耗散提供由对称性支配的判据。", "summary_source": "deepseek", "authors": [{"name": "Gabriel Mayor"}, {"name": "Christina Psaroudaki"}], "featured_authors": [{"name": "Gabriel Mayor"}, {"name": "Christina Psaroudaki"}], "author_count": 2}, {"id": "2610.23717", "category": "cond-mat", "title": "Learning the self-energy through equivariant neural networks", "abstract": "The electronic self-energy determines the single-particle Green's function and, through it, quasiparticle energies and spectral functions, but computing it from first principles is expensive and it is a difficult machine-learning target: complex-valued, matrix-valued in a local-orbital basis, and dependent on a continuous frequency. We predict the dynamical correlation part of the imaginary-frequency G_0W_0 self-energy matrix of molecules from atomic species and coordinates with an E(3)-equivariant message-passing network, the rotational covariance of the orbital-space matrix being imposed by the architecture itself and the static exchange part taken from the density-functional reference. Frequency enters either as an explicit network input or through frequency-specific output heads, and the predicted matrices are continued to the real axis in a representation in which causality and a non-negative spectral density hold by construction. The frequency-conditioned model reproduces matrix elements to below 1 meV on the imaginary axis for the systems studied here, and that accuracy survives the continuation: for water clusters, including a tetramer absent from the training set, and for chemically diverse molecules from QM9, the reconstructed spectral functions follow the G_0W_0 reference peak by peak and the frontier quasiparticle levels are recovered to a few tens of meV. Learning the self-energy on the imaginary axis is therefore a practical route to real-frequency spectra: once the model is trained, and given the density-functional reference it is built on, a new geometry costs no explicit G_0W_0 calculation.", "url": "https://arxiv.org/abs/2610.23717", "type": "理论+数值", "summary": "1. 该工作用E(3)等变消息传递网络，从原子种类和坐标预测分子在虚频上的G0W0自能矩阵的动态关联部分，静态交换部分取自密度泛函参考。\n2. 关键卖点是将轨道空间矩阵的旋转协变性内嵌于网络架构，并以保持因果性和非负谱密度的表示把频率作为输入或输出头，从而将虚轴预测稳健延拓到实轴谱函数。\n3. 在本文体系中虚轴矩阵元误差低于1 meV，延拓后水团簇（含训练集外四聚体）与QM9分子的谱函数逐峰吻合、前沿准粒子能级误差仅数十meV，表明训练后无需显式G0W0即可由新几何获得实频谱。", "summary_source": "deepseek", "authors": [{"name": "Wudong Shen"}, {"name": "Yang Zhong"}, {"name": "Min-Ye Zhang"}, {"name": "Xinyang Dong"}, {"name": "Hongjun Xiang"}, {"name": "Xinguo Ren"}], "featured_authors": [{"name": "Wudong Shen"}, {"name": "Yang Zhong"}, {"name": "Min-Ye Zhang"}, {"name": "Xinyang Dong"}, {"name": "Hongjun Xiang"}, {"name": "Xinguo Ren"}], "author_count": 6}, {"id": "2610.23720", "category": "cond-mat", "title": "Magnetic tunnel junctions of twisted La2/3Sr1/3MnO3 freestanding bilayers", "abstract": "Transition metal oxides (TMOs) host a variety of emergent spintronic or multiferroic functionalities owing to the intricate interplay between lattice, orbital, charge, and spin degrees of freedom. Recent advances in epitaxial lift-off and dry transfer techniques using water-soluble sacrificial layers enables stacking and twisting of freestanding membranes of such strongly correlated oxides, providing even richer physical properties and functionalities. To date, the twisted junctions of TMOs have been mainly investigated in insulators, focusing on their structural and dielectric properties. Here, we demonstrate that the twisted bilayer membranes of La2/3Sr1/3MnO3, a prototypical half-metallic ferromagnetic metal TMO, offer a magnetic tunnel junction (MTJ) with their van der Waals (vdW) gap acting as a tunnel barrier. The twisted junctions of La2/3Sr1/3MnO3 exhibit tunnelling magnetoresistance (TMR) effect with respect to relative orientation of magnetizations of top and bottom membranes. In addition, high-field magnetoresistance shows uniaxial anisotropy, which can be assigned to tunnelling anisotropic magnetoresistance (TAMR) effect reflecting rhombohedral distortion of fully-relaxed La2/3Sr1/3MnO3. The demonstration of TMR and TAMR effects suggests that spin and in-plane momentum degrees of freedom of 3d electrons are conserved across the twisted junctions of TMOs, opening a new avenue for realizing strongly correlated twistronics utilizing electron coherence through tunnelling processes.", "url": "https://arxiv.org/abs/2610.23720", "type": "理论", "summary": "1. 该工作将外延剥离得到的La2/3Sr1/3MnO3自支撑双层膜扭角堆叠，利用层间范德华间隙作为隧穿势垒，构建了半金属铁磁金属氧化物磁性隧道结，并观察到随上下层磁化相对取向变化的隧穿磁阻。\n2. 其关键卖点是在高场磁阻中观测到可归因于完全弛豫La2/3Sr1/3MnO3菱方畸变的隧穿各向异性磁阻，暗示自旋与面内动量自由度经扭角氧化物结的隧穿过程得以保持。\n3. 这为利用隧穿电子相干性发展强关联扭角电子学、并在氧化物平台探索自旋与面内动量相关功能提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Kota Kanda"}, {"name": "Shiho Irie"}, {"name": "Kodai Niitsu"}, {"name": "Masayuki Ochi"}, {"name": "Takumi Yamazaki"}, {"name": "Kouta Kondou"}, {"name": "Kohei Ueda"}, {"name": "Takeshi Seki"}, {"name": "Jobu Matsuno"}, {"name": "Junichi Shiogai"}], "featured_authors": [{"name": "Kota Kanda"}, {"name": "Shiho Irie"}, {"name": "Kodai Niitsu"}, {"name": "Takeshi Seki"}, {"name": "Jobu Matsuno"}, {"name": "Junichi Shiogai"}], "author_count": 10}, {"id": "2610.23761", "category": "cond-mat", "title": "Type 1.5 vortex bags in single component Ginzburg-Landau models with higher order potentials", "abstract": "We demonstrate the existence of type 1.5 like superconductivity in a single component Ginzburg-Landau model with a higher order potential. The model exhibits two competing superconducting Meissner states (MS), each of which has its own pair of length scales (coherence length and penetration depth). The solutions take the form of bags that contain vortices of one vacuum inside the other. This gives rise to four different types of vortex interaction, where one set of length scales determines vortex interactions inside the bags and the other set between the bags. Hence, within the bag the vortices can repel or attract and the bags themselves can repel or attract depending on the hierarchy of four length scales. When vortices repel within the bag, solutions act similarly to those in type 1.5 multicomponent superconductors, but in a single component system.", "url": "https://arxiv.org/abs/2610.23761", "type": "理论", "summary": "1. 该文在含高阶势的单分量金兹堡-朗道模型中证明类1.5超导的存在，并构造出由一种迈斯纳真空包裹另一种真空涡旋的“涡旋袋”解。\n2. 其核心卖点是模型存在两个相互竞争的迈斯纳态，各自具有独立的相干长度与穿透深度，四个长度尺度分别支配袋内涡旋相互作用与袋间相互作用，使袋内涡旋和袋本身可各自表现为吸引或排斥。\n3. 这表明类1.5的混合相互作用并不依赖多分量序参量，为在单分量体系中研究涡旋袋、长度尺度层级及其相图提供了明确切入点。", "summary_source": "deepseek", "authors": [{"name": "Martin Speight"}, {"name": "Thomas Winyard"}], "featured_authors": [{"name": "Martin Speight"}, {"name": "Thomas Winyard"}], "author_count": 2}, {"id": "2610.23770", "category": "cond-mat", "title": "Scaling of entanglement with distance between subsystems: detection of phase transitions in the $t'$-$π$-flux model", "abstract": "The system-size scaling of bipartite entanglement can be used to detect phase transitions. We develop a related approach for strongly correlated electron models where large density matrices or large system size scaling are inaccessible. To this end, we demonstrate that phase transitions of various kinds are signaled by a sharp signature in the first- or second-order logarithmic derivatives of the negativity measuring entanglement between small clusters at varying distances. Crucially, we show how to mitigate the effect of quantum Monte Carlo noise at large distances when computing the negativity. Our focus is on the $t'$-$\\pi$-flux Hubbard model using auxiliary-field quantum Monte Carlo simulations. It has the particular advantage of showing three distinct phase transitions in a single model: semimetal to band insulator, semimetal to antiferromagnetic Mott insulator, and a magnetic order-disorder transition belonging to the Gaussian, Gross-Neveu, and O(3) Wilson-Fisher universality classes, respectively.", "url": "https://arxiv.org/abs/2610.23770", "type": "理论+数值", "summary": "1. 该工作发展了基于小簇间负度随距离变化的系统尺寸标度方法，用以探测强关联电子模型中的相变，并在辅助场量子蒙特卡罗模拟的 $t'$-$\\pi$-通量哈伯德模型上予以实施。\n2. 其核心卖点是相变表现为负度对距离的一阶或二阶对数导数的尖锐特征，并给出在大距离处抑制量子蒙特卡罗噪声的处理方案，从而绕开大密度矩阵或大尺寸标度的困难。\n3. 该模型在单一体系中呈现半金属—能带绝缘体、半金属—反铁磁莫特绝缘体及磁有序—无序三个相变，分属高斯、Gross-Neveu 与 O(3) Wilson-Fisher 普适类，为受限条件下的相变判别提供了可迁移的探针。", "summary_source": "deepseek", "authors": [{"name": "Maksim Ulybyshev"}, {"name": "Gergő Roósz"}, {"name": "Gabriele Bellomia"}, {"name": "Karsten Held"}, {"name": "Fakher Assaad"}, {"name": "Frederic Bippus"}], "featured_authors": [{"name": "Maksim Ulybyshev"}, {"name": "Gergő Roósz"}, {"name": "Gabriele Bellomia"}, {"name": "Karsten Held"}, {"name": "Fakher Assaad"}, {"name": "Frederic Bippus"}], "author_count": 6}, {"id": "2610.23781", "category": "cond-mat", "title": "Transport and thermalization under noncommuting localized constraints", "abstract": "We investigate the effects of spatially localized conserved quantities on transport and thermalization in quantum and classical many-body systems. We consider several related models: the integrable quantum Volterra model, its nonintegrable classical limit, and two cellular automata derived from the latter. Although localized constraints are often associated with lattice gauge theories, our models do not admit such an interpretation. In systems with discrete degrees of freedom, these constraints induce uniform fragmentation of the Hilbert or configuration space. In the quantum Volterra model, we derive an exact mapping of the dynamics within each Hilbert-space fragment onto a quantum chiral Potts chain. We find that energy transport is ballistic, with identical transport coefficients across all fragments. In the nonintegrable classical limit, energy transport is diffusive, and we similarly find the diffusion constant to be independent of whether or not the constraints are fixed (resolved). Finally, in the cellular automata, we show that, despite leaving transport unaffected, localized constraints lead to a strong breakdown of local ergodicity.", "url": "https://arxiv.org/abs/2610.23781", "type": "理论+数值", "summary": "1. 该工作系统考察了空间局域约束对量子与经典多体系统中输运和热化的影响，涉及可积量子Volterra模型、其不可积经典极限及两种元胞自动机。\n2. 核心卖点是：离散自由度下约束导致希尔伯特/构型空间均匀碎裂，量子Volterra各碎片可精确映射为量子手性Potts链且能输运为弹道型、系数与碎片无关；经典极限呈扩散且扩散常数不依赖约束是否固定，元胞自动机中约束虽不改变输运却强烈破坏局域遍历性。\n3. 这表明局域约束可在不改变宏观输运的同时显著改变局域热化与遍历性，为区分输运系数与遍历性破坏、检验碎片化约束在非规范模型中的作用提供了可计算范例。", "summary_source": "deepseek", "authors": [{"name": "Amir Nesturov"}, {"name": "Attila Takács"}, {"name": "Lenart Zadnik"}], "featured_authors": [{"name": "Amir Nesturov"}, {"name": "Attila Takács"}, {"name": "Lenart Zadnik"}], "author_count": 3}, {"id": "2610.23783", "category": "cond-mat", "title": "Sampling the XY model with an attention-based neural network", "abstract": "We present a transformer-based variational autoregressive network for sampling lattice systems with continuous degrees of freedom and apply it to the two-dimensional XY model near the Berezinskii-Kosterlitz-Thouless transition. The architecture is combined with physics-informed ingredients: locality-informed attention and approximate probabilities. The resulting sampler significantly outperforms existing neural samplers. We train the model on lattices up to $96\\times96$, verify with a mode-dropping estimator that no parts of the configuration space are missed, and reproduce the energy, magnetization and helicity modulus obtained with the traditional Markov Chain Monte Carlo algorithm.", "url": "https://arxiv.org/abs/2610.23783", "type": "理论+数值", "summary": "1. 该工作提出一种基于transformer的变分自回归网络，用于对连续自由度的二维XY模型进行采样，并聚焦Berezinskii-Kosterlitz-Thouless相变附近区域。\n2. 其核心是将局部性约束注意力与近似概率等物理先验嵌入架构，使采样器显著优于现有神经采样器，并可在最大96×96格点上训练。\n3. 借助模式丢弃估计器验证未遗漏构型空间区域，并复现能量、磁化强度与螺旋模量，表明该框架可可信地替代传统MCMC用于连续对称格点模型采样。", "summary_source": "deepseek", "authors": [{"name": "Piotr Białas"}, {"name": "Christian D. Morales"}, {"name": "Tomasz Stebel"}, {"name": "Dawid Zapolski"}], "featured_authors": [{"name": "Piotr Białas"}, {"name": "Christian D. Morales"}, {"name": "Tomasz Stebel"}, {"name": "Dawid Zapolski"}], "author_count": 4}, {"id": "2610.23784", "category": "cond-mat", "title": "Anti-synchronized collective rotation in magnetic colloidal particles under rotating magnetic fields", "abstract": "Collective synchronization is a common response of interacting magnetic particles subjected to rotating external fields. Here we demonstrate a distinct nonequilibrium state in a two-dimensional cluster of magnetic colloidal particles in which the ordered crystalline core rotates, on average, opposite to the direction of the applied rotating magnetic field, while the defect-rich outer region continues to rotate with the drive. We term this state anti-synchronized collective rotation. By combining structural, spectral, bond-resolved, and layer-resolved torque analyses, we show that anti-synchronization is associated with a broader defect-rich interface, enhanced and dynamically heterogeneous bond deformation, and a reorganization of torque transmission between the surface and the crystalline interior. In the synchronized state, steric torques compensate the opposing dipolar contribution in the outer core, maintaining a positive net interaction torque. In the anti-synchronized state this compensation becomes insufficient, producing a negative net torque in theouter core and enabling core-surface rotational decoupling. Increasing the driving frequency restores coherent rotation through a transition characterized by competing positive- and negative-angular-velocity populations and hysteresis, consistent with a discontinuous, first-order-like dynamical transition. These results demonstrate how deformation and spatial redistribution of interaction torques can generate counter-rotating collective states in driven colloidal matter.", "url": "https://arxiv.org/abs/2610.23784", "type": "数值", "summary": "1. 该工作在旋转磁场下二维磁性胶体颗粒簇中揭示了一种非平衡态：有序晶核平均反向于驱动旋转，而缺陷富集的外层仍随场同向转动，称为反同步集体旋转。\n2. 结合结构、频谱、键分辨与分层力矩分析，作者表明反同步源于更宽的缺陷界面、增强且动态非均匀的键形变，以及表层—晶核间力矩传递重组；外层核区中空间位阻力矩不足以补偿反向偶极力矩，导致净力矩转负并实现核—面转动解耦。\n3. 提高驱动频率可通过具有正负角速度群体竞争和滞回的一阶类动力学转变恢复同向相干旋转，这揭示了形变与相互作用力矩空间重分布可驱动胶体物质产生反向旋转集体态。", "summary_source": "deepseek", "authors": [{"name": "Adithya Bharath"}, {"name": "A. V. Anil Kumar"}], "featured_authors": [{"name": "Adithya Bharath"}, {"name": "A. V. Anil Kumar"}], "author_count": 2}, {"id": "2610.23814", "category": "cond-mat", "title": "Orbital Angular Momentum Currents and Textures in a Multiorbital Double Helix", "abstract": "The microscopic origin of chirality induced spin selectivity (CISS) in biomolecular structures has traditionally been discussed in terms of spin orbit coupling and spin angular momentum. However, orbital angular momentum (OAM) is increasingly recognized as a more direct electronic response to molecular chirality. A helical hopping network built only from s orbitals can support an itinerant orbital moment and an orbital Edelstein response, but such a basis has no local atomic OAM and therefore omits the complementary contribution arising from coherence among active p orbitals. Here we construct a six-band multiorbital double helix model parameterized by characteristic B form DNA geometry and hopping scales. The model incorporates major minor groove asymmetry, an axial base pair offset representing stagger, and compositional inequivalence between the two strands, providing structural control parameters with which the orbital response can be tuned. Inter strand hybridization generates a full three component atomic OAM texture in the corotating local helical frame, including a radial component absent in the corresponding single helix model. We separately evaluate the itinerant OAM using the Bloch wave packet formulation of orbital magnetization and identify an additional inter-strand circulation channel unique to the double-helix connectivity. The resulting atomic and itinerant responses have distinct microscopic origins, magnitudes, and temperature dependences, establishing a multiorbital framework for geometry controlled angular momentum generation and transport in chiral molecular conductors.", "url": "https://arxiv.org/abs/2610.23814", "type": "理论+数值", "summary": "1. 该工作构建了参数化于B型DNA几何与跃迁尺度的六带多轨道双螺旋模型，并纳入主次沟不对称、碱基对轴向错位及两链组分不等价等结构控制量，以研究轨道角动量纹理与电流。\n2. 其核心卖点在于链间杂化在共旋局部螺旋系中产生包含径向分量的三分量原子轨道角动量纹理，并在Bloch波包轨道磁化框架下识别出双螺旋连接所特有的链间循环通道。\n3. 原子与巡游轨道响应具有不同微观起源、幅度和温度依赖，这为手性分子导体中几何调控的角动量产生与输运提供了多轨道框架。", "summary_source": "deepseek", "authors": [{"name": "Danny Cordova"}, {"name": "Edwin Vásconez"}, {"name": "Ernesto Medina"}], "featured_authors": [{"name": "Danny Cordova"}, {"name": "Edwin Vásconez"}, {"name": "Ernesto Medina"}], "author_count": 3}, {"id": "2610.23815", "category": "cond-mat", "title": "Anyonic Neural Network Wavefunctions", "abstract": "The macroscopic behavior of a non-interacting gas of Abelian anyons has remained unsettled for many decades. Prior numerical methods employing exact diagonalization in the continuum and on the plane have been limited to small system sizes, at most $N = 4$ anyons. Using the rapidly developing technology of neural network wavefunctions, we develop variational ansatze appropriate for studying continuum models of the Abelian anyon gas. The neural network architecture, which we call \"AnyNet\", is capable of exactly enforcing the non-analytic short-distance behavior induced by the anyonic statistics. We demonstrate excellent agreement with exact diagonalization for $N=4$ anyons, obtain accurate results up to $N = 16$ for intermediate statistics, and study up to $N=20$ for almost-fermionic anyons, matching perturbative results within a 0.4% discrepancy. We use this methodology to study anyons in a harmonic trap, and anyonic atoms as a model for anyon binding to impurities. We study the structure of anyonic wavefunctions as the statistics parameter is varied. We focus on the single-particle density, the pair density, the angular momentum, and the scaling of the wavefunction as multiple anyons coalesce. This work opens doors to understanding the macroscopic behavior of anyons, for which rich phases have been predicted theoretically.", "url": "https://arxiv.org/abs/2610.23815", "type": "理论+数值", "summary": "1. 该工作提出用于连续介质阿贝尔任意子气体的神经网络变分波函数框架AnyNet，并将可研究规模从至多4个任意子扩展至中间统计16个、近费米统计20个。\n2. 其核心在于网络架构可精确嵌入任意子统计导致的短距离非解析行为，从而在N=4与精确对角化一致，并在近费米极限与微扰结果偏差0.4%以内。\n3. 该框架被用于谐阱与任意子-杂质束缚问题并刻画单/对密度、角动量和多粒子聚合标度，为探索理论预言的任意子宏观相提供可扩展变分途径。", "summary_source": "deepseek", "authors": [{"name": "Andres Perez Fadon"}, {"name": "Pok Man Tam"}, {"name": "Leyna Shackleton"}], "featured_authors": [{"name": "Andres Perez Fadon"}, {"name": "Pok Man Tam"}, {"name": "Leyna Shackleton"}], "author_count": 3}, {"id": "2610.22429", "category": "hep-th", "title": "Dilaton-Axion Wormhole Partition Function Away from the BPS Endpoint", "abstract": "I determine the leading finite-radius correction to the two-boundary response of a charged axion wormhole near its BPS endpoint. With $\\delta=a_*^2$, exact radial matching in a product axion--dilaton/saxion system gives a boundary eigenvalue that vanishes as $O(\\delta)$ and an off-diagonal Hessian entry of order $O(\\delta^2)$. Their combination produces a cross-boundary covariance linear in $\\delta$, with a negative first sub-leading correction on the branch studied here. I determine the semiclassical range in which the quadratic approximation remains controlled and identify the first finite-radius angular resonance, $\\delta^2\\log(\\delta/\\delta_0)$. Under a uniform rescaling of all active charges, the coefficient of the linear cross-boundary response scales as the inverse square of the charge scale. I then average the inverse response over the chiral Gaussian ensemble describing the BPS endpoint. Boundary reduction preserves the hard-edge index. Multiplication by the matched BPS sector weight converts the normalized response into the leading finite-radius two-source coefficient.", "url": "https://arxiv.org/abs/2610.22429", "type": "理论", "summary": "1. 该工作在BPS端点附近，用轴子-伸缩子/萨克斯子乘积体系的精确径向匹配，求出了带电轴子虫洞双边界响应的首个有限半径修正。\n2. 其核心是边界本征值按O(δ)消失、海森矩阵非对角元为O(δ²)，二者组合给出线性于δ的跨边界协方差（该分支次领头修正为负），并确定二次近似可控范围、首个角向共振δ²log(δ/δ0)，以及电荷整体重标度下线性响应按电荷标度平方反比。\n3. 将逆响应在手征高斯系综中平均可保持硬边指数，再乘匹配的BPS扇区权重即得领先有限半径双源系数，为近BPS虫洞配分函数提供定量约束。", "summary_source": "deepseek", "authors": [{"name": "Soo-Jong Rey"}], "featured_authors": [{"name": "Soo-Jong Rey"}], "author_count": 1}, {"id": "2610.22478", "category": "hep-th", "title": "A non-prompt null ray cures its own singularity", "abstract": "In AdS/CFT correlators, bulk cone singularities arise when two points that are timelike separated on the AdS boundary may be connected by a null geodesic through the bulk. We consider corrections to these correlators away from the $G_N\\to 0$ limit arising from the backreaction of this null geodesic. A peculiar property of this geodesic is that it is not prompt, meaning that there exist points on it that are timelike separated. This implies that it may gravitationally affect itself. We show that this leads to an energy-dependent delay in the time elapsed along this geodesic. This coupled with possible inelastic effects due to gravitational radiation are the leading mechanisms that resolve the singularity. The resolved singularity is accompanied by oscillations and hence zeroes in the real and imaginary parts of the correlator. We comment on the role that additional inelastic effects play in damping these oscillations. Finally, we provide a concrete example in $2+1$D where we can compute the energy-dependent time delay effect explicitly by studying the boundary graviton mode.", "url": "https://arxiv.org/abs/2610.22478", "type": "理论", "summary": "1. 该文在AdS/CFT框架中研究体类光测地线背反作用对边界关联函数的修正，并说明非即时零测地线如何消解自身造成的体锥奇点。\n2. 其关键机制是这类测地线含有类时分离点、可与自身发生引力作用，导致沿测地线的能量依赖延迟，并与引力辐射等非弹性效应共同抹平奇点，同时在关联函数实部和虚部产生振荡与零点。\n3. 作者在2+1维给出借助边界引力子模显式计算该延迟的实例，并讨论非弹性效应对振荡的阻尼，为有限引力常数下体锥奇点及关联函数结构提供了具体启示。", "summary_source": "deepseek", "authors": [{"name": "Gauri Batra"}], "featured_authors": [{"name": "Gauri Batra"}], "author_count": 1}, {"id": "2610.22485", "category": "hep-th", "title": "Topological Aspects of the $c=2$ Model in the Continuum and on the Lattice", "abstract": "We discuss the continuum two-dimensional conformal field theory, whose target space is a two-torus. In addition to its standard zero-form internal symmetries, the model also has a $-1$-form symmetry associated with its $\\theta$-parameter, which is also known as a background $B$-field. These symmetries combine into a higher group with anomalies. A spatially winding $B$-field generically breaks the spatial translation symmetry completely, and reduces the continuous target-space (internal) momentum symmetry to a (projectively realized) discrete subgroup. When $B$ varies linearly, a discrete translation subgroup survives, and it combines with the internal symmetry into a non-Abelian group, while the other translations survive as non-invertible symmetries. Even though the model lacks the standard spatial translation symmetry, the non-invertible translation symmetry explains why it is solvable via a Fourier decomposition. We then consider a lattice version of this system, using its modified Villain formulation. Surprisingly, all these subtleties in the symmetries of the continuum model exist on a finite lattice. Finally, we discuss various generalizations of this model, demonstrating that the phenomena we uncovered are more broadly valid.", "url": "https://arxiv.org/abs/2610.22485", "type": "理论", "summary": "1. 该文分析了靶空间为二维环面的连续c=2共形场论，其中普通内部零形式对称性与θ参数（背景B场）对应的−1形式对称性组成带反常的高群。\n2. 其核心是卷绕B场完全破坏空间平移并将内部动量降为投影离散子群，而线性B场使离散平移与内部对称性结合成非阿贝尔群、其余平移成为非可逆对称性，从而解释傅里叶分解可解性；有限格点的修改Villain表述重现这些细节。\n3. 该工作把连续与格点中的高群、非可逆对称性和可解性联系起来，并通过模型推广表明相关现象具有更广适用性，为对称性反常的格点实现提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Yichul Choi"}, {"name": "Nathan Seiberg"}, {"name": "Sahand Seifnashri"}, {"name": "Wucheng Zhang"}], "featured_authors": [{"name": "Yichul Choi"}, {"name": "Nathan Seiberg"}, {"name": "Sahand Seifnashri"}, {"name": "Wucheng Zhang"}], "author_count": 4}, {"id": "2610.22502", "category": "hep-th", "title": "Superstring theory in $AdS_5\\times S^5$ background: half-BPS vertex operators", "abstract": "In this paper, we construct all vertex operators associated with the gravity supermultiplet in the $AdS_5 \\times S^5$ background, relevant for worldsheet scattering amplitude computations, via global $PSU(2,2|4)$ transformations. Although one such operator was previously constructed in the pure spinor formalism using a special superspace parametrization, implementing the full global symmetries proved challenging due to the mixing of bosonic and fermionic coordinates. We resolve this issue by introducing a judicious sequence of reparametrizations that disentangle these coordinates. We then advance the formulation of superstring theory in this background by constructing the corresponding integrated vertex operators in both the pure spinor and the B-RNS-GSS formalisms.", "url": "https://arxiv.org/abs/2610.22502", "type": "理论", "summary": "1. 该工作在 AdS5×S5 背景中通过全局 PSU(2,2|4) 变换构造了与引力超多重态相关的全部半BPS顶点算符，并推进至纯旋量与 B-RNS-GSS 形式下的积分顶点算符。\n2. 其核心技巧是设计一组有序重参数化，将原本混合的玻色与费米坐标解耦，从而绕开此前纯旋量形式中实现完整全局对称性的障碍。\n3. 该结果可直接服务于世界面散射振幅计算，并为在 AdS5×S5 背景下系统发展超弦理论提供算符层面的基础。", "summary_source": "deepseek", "authors": [{"name": "Thiago Fleury"}, {"name": "Lucas N. S. Martins"}, {"name": "Dennis Zavaleta"}], "featured_authors": [{"name": "Thiago Fleury"}, {"name": "Lucas N. S. Martins"}, {"name": "Dennis Zavaleta"}], "author_count": 3}, {"id": "2610.22506", "category": "hep-th", "title": "No cosmic horizons from a strengthened higher-dimensional strong energy condition", "abstract": "Time-dependent supergravity compactifications lie beyond the setting of the Gibbons/Maldacena-Nuñez no-de Sitter theorem and can even support eternal cosmic acceleration, raising the question of whether they can also produce future cosmic horizons. For general higher-dimensional matter, the strong energy condition alone does not exclude such horizons. Here, we demonstrate that a theory fulfilling a strengthened version of the strong energy condition cannot be compactified down to a lower-dimensional theory able to support a future cosmic horizon. For 10d and 11d supergravities reduced to at least four large spacetime dimensions, this energy condition is fulfilled by the sources that already fulfill the strong energy condition in the higher-dimensional theory. Our assumption on the dimensional reduction is that it is performed on a smooth compact and boundaryless space.", "url": "https://arxiv.org/abs/2610.22506", "type": "理论", "summary": "1. 该工作研究强化高维强能量条件下时间依赖超引力紧化能否产生未来宇宙视界，并证明此类紧化不能导出支持未来视界的低维理论。\n2. 其核心在于：若高维源满足强化强能量条件，且内空间光滑、紧致、无边界，则约化到至少四维大时空的低维理论无法支持未来宇宙视界；10d与11d超引力中满足普通强能量条件的源亦满足该强化条件。\n3. 这为时变紧化中的永恒加速与视界形成划出能量条件边界，并提示高维超引力模型可仅凭强化强能量条件排除未来宇宙视界。", "summary_source": "deepseek", "authors": [{"name": "Flavio Tonioni"}], "featured_authors": [{"name": "Flavio Tonioni"}], "author_count": 1}, {"id": "2610.22591", "category": "hep-th", "title": "Perturbative Defect CFT Data in Scalar Models and Consistency Conditions", "abstract": "We compute defect CFT data through $O(\\epsilon)$ for scalar line defects in the $O(N)$, hypercubic, hypertetrahedral, $O(m)\\times O(n)$ biconical, and $MN$ models in $d=4-\\epsilon$. The $O(N)$ theory provides a benchmark; the datasets for the other four models are new. For the branches considered, we determine spectra, operator mixing, two- and three-point coefficients in a specified perturbative basis, and four-point functions with identical or paired external operators of integer dimension $n\\leq2$ at $\\epsilon=0$. We propose a framework for verifying perturbative defect CFT data by combining crossing symmetry, OPE reconstruction, and the applicable broken-symmetry integral identities. We also identify a new universal defect-direction sector whose one-loop data follow from the defect fixed-point equation. All applicable conditions are satisfied at the perturbative orders considered. The model data are collected in the supplemental notebook, this http URL .", "url": "https://arxiv.org/abs/2610.22591", "type": "理论", "summary": "1. 该工作在 d=4−ε 下将标量线缺陷 CFT 数据算至 O(ε)，覆盖 O(N)、超立方、超四面体、O(m)×O(n) 双锥与 MN 模型，其中仅 O(N) 为基准、其余四类为新数据。\n2. 其在指定微扰基下确定谱、算符混合、两点与三点系数及 ε=0 时整数维 n≤2 外算符的四点函数，并以交叉对称、OPE 重构和破缺对称积分恒等式构建缺陷 CFT 数据校验框架。\n3. 该工作识别出新的普适缺陷方向扇区，其一圈数据由缺陷不动点方程给出；所考虑阶数下所有适用条件均满足，为后续微扰计算与一致性检验提供可复用数据集与判据。", "summary_source": "deepseek", "authors": [{"name": "Ziwen Kong"}], "featured_authors": [{"name": "Ziwen Kong"}], "author_count": 1}, {"id": "2610.22633", "category": "hep-th", "title": "Maximizing the spectral gap for free bosonic CFTs", "abstract": "We study the spectral gap $\\Delta_1$ of Narain CFTs, the smallest scaling dimension of a nonvacuum $U(1)^c_L\\times U(1)^c_R$ primary, as a function on the Narain moduli space. Using the exceptional isomorphisms for $SO^+(2,2)$ and $SO^+(3,3)$, we prove the sharp bounds $\\Delta_1\\le 2/3$ at $c=2$ and $\\Delta_1\\le 3/4$ at $c=3$, with equality exactly at the $SU(3)_1$ and $SU(4)_1$ WZW models up to $O(c)\\times O(c)$, and we describe local maxima of $\\Delta_1$. For $4\\le c\\le 12$, we compare the Narain moduli space with the densest known Euclidean lattices: an arithmetic obstruction excludes five candidates, a computer-assisted classification shows that $E_8$, $K_{12}$, and $BW_{16}$ each admit a unique Narain structure up to lattice automorphisms, and a conceptual argument excludes the Leech lattice.", "url": "https://arxiv.org/abs/2610.22633", "type": "理论", "summary": "1. 该工作研究Narain CFT非真空原初最小标度维数Δ1在Narain模空间上的函数，证明c=2、3时Δ1≤2/3、3/4，等号仅在SU(3)_1、SU(4)_1 WZW模型（模O(c)×O(c)）取得，并刻画局部极大。\n2. 技术上借助SO^+(2,2)、SO^+(3,3)特殊同构给出严格界；对4≤c≤12，将模空间与最密欧氏格对照，以算术障碍排除五候选，计算机辅助分类确认E8、K12、BW16的唯一Narain结构，并概念性排除Leech格。\n3. 这揭示自由玻色型CFT谱隙最大化与最密格问题的深层联系，为高维Narain模空间极值分类提供判据，并启发一般CFT谱隙界与格构造的对应研究。", "summary_source": "deepseek", "authors": [{"name": "Hyeongjoe Chu"}, {"name": "Yuchan Jung"}], "featured_authors": [{"name": "Hyeongjoe Chu"}, {"name": "Yuchan Jung"}], "author_count": 2}, {"id": "2610.22806", "category": "hep-th", "title": "Hidden Supersymmetry in AdS/QCD models for Fermions", "abstract": "We show that the chiral modes splitted from the Dirac equation satisfying Schrodinger-like equations in the context of deformed AdS/QCD model are isospectral, since the chiral effective potentials are SUSY partners. In particular, we show how to perform truncations of these potentials that preserve isospectrality of the chiral modes. Following this prescription, we compare a quadratic approximation of the deformed AdS model with the dressed soft wall model for fermions and show how the spectra of both models can coincide.", "url": "https://arxiv.org/abs/2610.22806", "type": "理论", "summary": "1. 该文在形变 AdS/QCD 模型中证明，由狄拉克方程分离出的手征模式所满足的薛定谔型方程具有互为超对称伙伴的有效势，因而手征模式等谱，并给出保持该等谱性的势截断方案。\n2. 其技术卖点是用超对称量子力学构造手征有效势的等谱截断，并据此将形变 AdS 模型的二次近似与费米子修饰软墙模型对照，显示两者谱可以重合。\n3. 这为 AdS/QCD 中费米子谱的等价描述与模型约化提供了可操作工具，并提示后续需检验具体形变、截断及唯象参数下这种等谱对应是否仍具物理意义。", "summary_source": "deepseek", "authors": [{"name": "Rafael A. Costa-Silva"}, {"name": "Henrique Boschi-Filho"}], "featured_authors": [{"name": "Rafael A. Costa-Silva"}, {"name": "Henrique Boschi-Filho"}], "author_count": 2}, {"id": "2610.22923", "category": "hep-th", "title": "Asymmetric multiscalar fixed points from equiangular tight frames", "abstract": "In their work on multiscalar RG flows, Rychkov and Stergiou posed the question of whether there exist real fixed points of the one-loop renormalization group for scalar field theories in $d=4-\\epsilon$ which respect no extra symmetry beyond the universal $\\mathbb{Z}_2$ field inversion. In this note, we report on a construction of a large number of such fixed points in the theory of $22001$ scalar fields, thus resolving the question. The construction uses the geometry of an equiangular tight frame in order to reduce the (up to two-loop) fixed point equation to a two-dimensional space of couplings without assuming any extra symmetry. The main technical hurdle is then to establish the existence of such a frame whose corresponding lines preserve no symmetry. This can be achieved using the Steiner frame construction of Fickus, Mixon, and Tremain.", "url": "https://arxiv.org/abs/2610.22923", "type": "理论", "summary": "1. 该文在 \\(d=4-\\epsilon\\) 的标量场重整化群中，用22001个标量场构造出大量仅保留普适Z₂场反演对称性的实不动点，从而回应了里奇科夫与斯特吉乌的问题。\n2. 其技术核心是用等角紧框架的几何把至两圈的不动点方程约化到二维耦合空间且不预设额外对称性，并借助菲库斯、米克森与特雷曼的斯坦纳框架构造证明对应直线不保持任何对称性。\n3. 这表明非对称多标量不动点可由框架几何系统生成，为后续重整化群流与相关标量理论提供了可检验的构造性起点。", "summary_source": "deepseek", "authors": [{"name": "Christopher Beem"}], "featured_authors": [{"name": "Christopher Beem"}], "author_count": 1}, {"id": "2610.23184", "category": "hep-th", "title": "Optical conductivity of holographic striped superconductors", "abstract": "Based on a holographic model exhibiting Mott-like insulating behavior on an ionic lattice, we construct a holographic striped superconductor (SSC), which is characterized by the interplay between the charge density wave (CDW) and superconductivity (SC). We present the phase diagram on the $e$-$T$ plane, where the SSC phase emerges within an intermediate window of $e$, revealing both cooperative and competitive relations between the CDW order and SC order. For small charge $e$, the system undergoes the phase transition from metallic phase to CDW phase, and then to SSC phase upon cooling; while for large $e$, it transitions from metallic phase to SC phase directly, and then to SSC phase. We compute the optical conductivity of the system for these two cases and demonstrate its distinct behavior. It turns out that the imaginary part of the conductivity exhibits a divergent behavior below the critical temperature $T_{\\mathrm{SSC}}$ along both pathways, so that the superconductivity of SSC phase is justified for the first time in the holographic framework. Along the CDW-to-SSC pathway the pseudogap and the pinning effect are inherited from the CDW phase, whereas along the SC-to-SSC pathway the spontaneous stripe strongly suppresses the coherent normal-fluid channel while the superfluid pole is enhanced. In addition, we demonstrate the commensurate lock-in behavior of the striped superconductor in the $p$-$T$ diagram.", "url": "https://arxiv.org/abs/2610.23184", "type": "理论", "summary": "1. 该工作在离子晶格上类Mott绝缘的全息模型中构建条纹超导体，给出e-T相图并表明电荷密度波与超导在中间e窗口共存且兼具合作与竞争。\n2. 其卖点是计算光学电导并发现沿两条进入条纹超导相的路径，电导虚部在临界温度以下均发散，由此首次在全息框架中确认该相超导性，并区分CDW到SSC继承的赝能隙与钉扎及SC到SSC中自发条纹对正常流体和超流极点的相反调控。\n3. 该工作还揭示条纹超导在p-T图中的公度锁定，为利用光学电导诊断全息条纹超导及理解CDW-SC相互作用提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Fang-jing Cheng"}, {"name": "Kai Li"}, {"name": "Yi Ling"}, {"name": "Meng-He Wu"}], "featured_authors": [{"name": "Fang-jing Cheng"}, {"name": "Kai Li"}, {"name": "Yi Ling"}, {"name": "Meng-He Wu"}], "author_count": 4}, {"id": "2610.23281", "category": "hep-th", "title": "Exact $T\\bar{T}$-Like Flows in Nonlinear Electrodynamics", "abstract": "We derive an exact nonperturbative $T\\bar T$-like flow for the class of one-scale, self-dual nonlinear electrodynamics theories admitting a Courant--Hilbert representation. The flow has a universal parametric form in terms of the defining Courant--Hilbert function and, on any physical branch where the relevant invariant map is invertible, becomes an autonomous function of the two quadratic stress-tensor invariants, $\\partial_\\lambda\\mathcal L=X\\,\\mathcal F(Y/X)$. The function $\\mathcal F$ is model dependent, and global autonomy is assumed when the invariant map is one-to-one. Born--Infeld theory yields a quadratic stress-tensor flow, whereas the causal Russo--Townsend logarithmic model gives an exact nonlinear expression involving the Lambert $W$ function whose weak-field expansion reproduces the known perturbative result. We also establish the equivalence with the Russo--Townsend auxiliary-field formulation. These results provide an exact construction of autonomous irrelevant flows for a broad, explicitly specified class of self-dual nonlinear electrodynamics theories.", "url": "https://arxiv.org/abs/2610.23281", "type": "理论", "summary": "1. 该文为一类具有Courant–Hilbert表示的单尺度自对偶非线性电动力学构造了精确非微扰的类$T\\bar T$流。\n2. 其核心是流的普适参数形式及在可逆不变量映射下的自治性$\\partial_\\lambda\\mathcal L=X\\mathcal F(Y/X)$，并给出Born–Infeld的二次流与Russo–Townsend对数模型的Lambert $W$精确表达及弱场微扰吻合。\n3. 这为广泛而明确指定的自对偶非线性电动力学提供了自治无关流的精确构造，并可启发后续对可积形变与辅助场表述的研究。", "summary_source": "deepseek", "authors": [{"name": "Zahra Pezhman"}, {"name": "H. Babaei-Aghbolagh"}, {"name": "Komeil Babaei Velni"}], "featured_authors": [{"name": "Zahra Pezhman"}, {"name": "H. Babaei-Aghbolagh"}, {"name": "Komeil Babaei Velni"}], "author_count": 3}, {"id": "2610.23369", "category": "hep-th", "title": "Scalar Casimir Effect from Bilocal Correlations in a Wormhole Foam", "abstract": "We determine how spatially bilocal correlations induced by a dilute ensemble of virtual Euclidean wormholes modify the scalar Casimir interaction between parallel Dirichlet plates. From the leading monopole action, we isolate an equal-Euclidean-time sector and construct a point-throat, first-order matched spectator model with fixed foam statistics. Global two-plate inclusion-exclusion over all mouth-pair center positions yields a continuous fixed-separation kernel free of the logarithmic image structures produced by a restricted translation sector. The kernel is quadratically suppressed at coincidence, changes sign near 0.695 plate spacings, and tends to a positive large-separation plateau. Averaging over truncated-Gaussian, log-normal, and Gamma distributions with a common relative width yields closely spaced energy curves but a finite shape dependence. Differentiating the dimensional energy at fixed ensemble parameters gives a leading-order pressure threshold of 0.05 in the large-separation limit. In the truncated-Gaussian scan extending to twelve plate spacings, an amplitude of 0.06 yields a crossover near a separation ratio of 3.17, whereas amplitudes of 0.02 and 0.04 remain attractive and 0.05 is critical. The scalar cavity therefore provides a scale-selective probe of spatial bilocality whose leading boundary response can change sign within the declared model.", "url": "https://arxiv.org/abs/2610.23369", "type": "理论", "summary": "1. 该工作针对稀薄虚欧几里得虫洞系综诱导的空间双局域关联，构建点喉一阶匹配模型并在全部喉对中心位置上做双板容斥，计算其对平行狄利克雷板间标量卡西米尔相互作用的影响。\n2. 其卖点是得到无对数镜像结构的连续固定间距核：核在重合处二次压低、约0.695板间距变号并趋于正的大间距平台，分布平均显示有限形状依赖，大间距压力阈值约0.05，振幅0.06时交叉出现在约3.17间距比。\n3. 这表明标量腔可作为空间双局域性的尺度选择探针，其领头边界响应在声明模型内可改变符号，为后续实验与理论研究提供可判别启发。", "summary_source": "deepseek", "authors": [{"name": "Celio R. Muniz"}, {"name": "M. C. Araújo"}, {"name": "Edson Otoniel"}, {"name": "Jonathan A. Rebouças"}], "featured_authors": [{"name": "Celio R. Muniz"}, {"name": "M. C. Araújo"}, {"name": "Edson Otoniel"}, {"name": "Jonathan A. Rebouças"}], "author_count": 4}, {"id": "2610.23384", "category": "hep-th", "title": "Spinors, Doppelgängers and the Non-Perturbative Classical Double Copy", "abstract": "We develop a geometric and spinorial formulation of the non-perturbative classical double copy between the Corrigan--Fairlie--'t Hooft--Wilczek sector of complexified SU(2) Yang--Mills theory and four-dimensional conformally flat gravity. We identify the gauge potential with the positive-chiral spin connection of the conformally flat metric, establishing an exact relation between the Yang--Mills field strength and the chiral projection of the Riemann tensor. This provides a four-dimensional realisation of the doppelgänger viewpoint, in which gauge and gravitational fields arise from different interpretations of common connection data. Within this sector, the sourceless Yang--Mills equations require constant scalar curvature, explaining the shared nonlinear scalar equation and extending the gravitational correspondence from traceless matter to matter with constant energy--momentum trace. By representing adjoint colour indices as symmetric pairs of spinor indices, we derive exact relations mapping the gauge field-strength spinors to the scalar-curvature and trace-free Ricci components of the gravitational curvature. These relations retain nontrivial curvature information despite the vanishing Weyl tensor. We illustrate the construction using anti-de Sitter and de Sitter spacetimes, together with $\\mathrm{AdS}_{3}\\times\\mathbb{R}$ supported by a scalar field, demonstrating the extension to matter with nonzero constant trace", "url": "https://arxiv.org/abs/2610.23384", "type": "理论", "summary": "1. 该文构建了复化SU(2)杨–米尔斯理论CFTW扇区与四维共形平坦引力之间非微扰经典双拷贝的几何与旋量表述，并将规范势等同于共形平坦度规的正手征自旋联络。\n2. 其卖点是以共同联络数据的不同解释实现四维“二重身”图像，给出场强与黎曼张量手征投影及标量曲率/无迹里奇分量的精确旋量映射，并在无源杨–米尔斯方程要求常标量曲率时把双拷贝推广到常迹物质。\n3. 该构造在AdS、dS及标量场支撑的AdS3×R中示例成立，为非零常迹物质背景下的经典双拷贝及规范与引力的几何统一提供了明确出发点。", "summary_source": "deepseek", "authors": [{"name": "Kymani Armstrong-Williams"}], "featured_authors": [{"name": "Kymani Armstrong-Williams"}], "author_count": 1}, {"id": "2610.23447", "category": "hep-th", "title": "Compensator-free $\\mathcal N=2$ extension of ModMax and scalar propagation", "abstract": "We construct a compensator-free $\\mathcal N=2$ superconformal and electric--magnetic duality-invariant extension of ModMax electrodynamics in ordinary flat superspace. The action is built entirely from the Abelian vector multiplet, using a derivative composite of its field strength, and the self-duality equation is solved to all orders as a formal series in the coupling. Upon setting the additional $\\mathcal N=1$ chiral multiplet to zero, the action is equivalent off shell to the $\\mathcal N=1$ ModMax action of Bandos, Lechner, Sorokin and Townsend through a local vector-prepotential redefinition. Since the complex scalar of the $\\mathcal N=2$ multiplet is set to zero in this reduction, we add one superconformal interaction that leaves the reduction unchanged and is chosen to ensure causal scalar propagation. On constant non-null electromagnetic backgrounds with vanishing scalar expectation value, the higher-order scalar coefficients are fixed by requiring the scalar quadratic action to satisfy the stress-tensor square-root flow, modulo equations of motion and a total derivative. We determine the quadratic action of the full multiplet on these backgrounds to all orders. Its analytic continuation to finite $\\gamma\\geq0$ gives causal scalar propagation, with transverse speed squared $e^{-\\gamma}$ and unit longitudinal speed, the ModMax photon cones, luminal gauginos with positive kinetic coefficients, and auxiliary fields with algebraic equations of motion.", "url": "https://arxiv.org/abs/2610.23447", "type": "理论", "summary": "1. 该文在普通平直超空间中构造了无补偿场的 N=2 超共形、电磁对偶不变的 ModMax 电动力学扩展，仅用阿贝尔矢量多重态及其场强导数复合项，并以耦合形式级数全阶求解自对偶方程。\n2. 其核心技巧是借助局部矢量预势重定义证明关闭额外 N=1 手征多重态后与 N=1 ModMax 离壳等价，并加入保持该约化的超共形相互作用来约束标量因果传播。\n3. 在标量期望值为零的恒定非零电磁背景下，该框架给出全阶二次作用；解析延拓至有限 γ 后标量横向速度平方为 e^{-γ}、纵向为光速，光子锥同 ModMax、规范微子类光且动能正，为对偶不变超共形理论的因果传播提供依据。", "summary_source": "deepseek", "authors": [{"name": "Ariunzul Davgadorj"}], "featured_authors": [{"name": "Ariunzul Davgadorj"}], "author_count": 1}, {"id": "2610.23509", "category": "hep-th", "title": "When Conformal Interfaces Become Logarithmic", "abstract": "We construct conformal interfaces having defect conformal manifolds between two-dimensional rational CFTs, at least one of which is non-unitary. In a continuous family, interfaces with real and complex spectra can be marginally deformed to each other via their defect moduli parameters. An exceptional point then arises along the trajectory in the conformal manifold, where two interface operators with complex conjugate weights coalesce into a logarithmic pair. We reconstruct the entire trajectory of this novel spectral collision, independently, from self-annulus partition functions and bulk two point correlators in the presence of the interfaces.", "url": "https://arxiv.org/abs/2610.23509", "type": "理论", "summary": "1. 该工作在二维有理共形场论之间构造了具有缺陷共形流形的共形界面，并允许其中至少一个理论为非幺正。\n2. 其核心在于：连续族中可通过缺陷模参数将实谱与复谱界面边际变形相互连接，并在轨迹上出现例外点，使两个复共轭权重的界面算符合并为对数配对。\n3. 作者进一步用自环形配分函数与含界面的体两点关联函数独立重建该谱碰撞全过程，为理解非幺正缺陷共形流形上的对数界面及谱合并提供了可检验框架。", "summary_source": "deepseek", "authors": [{"name": "Jin Chen"}], "featured_authors": [{"name": "Jin Chen"}], "author_count": 1}, {"id": "2610.23514", "category": "hep-th", "title": "Timelike entanglement entropy with gravitational anomaly from complexified geometry", "abstract": "We investigate the timelike entanglement entropy (TEE) in a two-dimensional conformal field theory with a gravitational anomaly, $c_L\\neq c_R$, dual to topologically massive gravity in AdS$_3$. Holographically, the TEE is determined by the on-shell action of a massive spinning particle on a single complex geodesic anchored at the endpoints of the timelike interval. This action consists of the complex geodesic length and the twist of a parallel-transported normal frame. We carry out the computation in Poincaré AdS$_3$, non-extremal and extremal rotating BTZ backgrounds, and provide an equivalent Chern-Simons derivation in which the bulk connection stays real while only the saddle of the Wilson-line probe becomes complex. In each case, the holographic result matches the corresponding TEE in dual field theory. The real part of the TEE is fixed unambiguously whereas its imaginary part depends on the boundary $i\\epsilon$ prescription and the orientation of the interval. In the bulk, the dependence on orientation reflects an ambiguity in the choice of framing. Along the complex geodesic, the residual frame group becomes $SO(2,\\mathbb C)\\simeq\\mathbb C^*$, so the endpoint conditions determine the frame twist only up to integer multiples of $2\\pi i$. The difference between the two orientations, $\\frac{c_L-c_R}{6}\\,i\\pi$, is fixed entirely by the gravitational anomaly and persists for the Rényi pseudo-entropies.", "url": "https://arxiv.org/abs/2610.23514", "type": "理论", "summary": "1. 该文在具有引力反常（c_L≠c_R）的二维共形场论及其AdS3拓扑大质量引力对偶中，系统研究了类时纠缠熵。\n2. 其卖点在于把全息类时纠缠熵映射为单条复测地线上大质量自旋粒子的在壳作用（复长度加平移法架扭转），在庞加莱AdS3、非极端与极端旋转BTZ背景及Chern-Simons表述中均复现场论结果。\n3. 该分析表明实部无歧义而虚部依赖边界iε与区间取向，体侧取向差异对应法架选择歧义，且两种取向之差(c_L-c_R)iπ/6完全由引力反常固定并延续至Rényi伪熵。", "summary_source": "deepseek", "authors": [{"name": "Minwoo Lim"}, {"name": "Himanshu Parihar"}, {"name": "Junggi Yoon"}], "featured_authors": [{"name": "Minwoo Lim"}, {"name": "Himanshu Parihar"}, {"name": "Junggi Yoon"}], "author_count": 3}, {"id": "2610.23529", "category": "hep-th", "title": "Renormalization Group Domain Walls from Phantom Symmetries", "abstract": "We develop a systematic construction of renormalization group (RG) domain walls between two-dimensional rational conformal field theories. Using phantom currents, we consider an auxiliary chiral extension linked to the folded ultraviolet--infrared theory by a topological interface. The construction of RG walls then reduces to identifying suitable automorphism-twisted Cardy states in the auxiliary theory. We find two such types of automorphisms: outer automorphisms exchanging identical current algebra factors, as in Gaiotto's construction, and continuous inner automorphisms generated by the zero modes of spin-one phantom currents. In the latter case, the RG domain walls generically admit a continuous defect conformal manifold. We further show that, when an RG flow can be orbifolded to another one, the orbifold may lift defect conformal moduli of the RG brane constructed using inner automorphisms. The two types of RG branes can then be mapped to each other via a topological interface defined by the orbifold. We demonstrate the two types of RG brane construction via various examples of flows between non-unitary minimal models, from parafermions to minimal models, and between generalized parafermions. Many physical observables of the RG walls are computed non-perturbatively, including boundary entropies and spectra, and UV--IR operator mixings. We also find interesting nontrivial boundary monodromy: a closed cycle in the defect conformal moduli space can carry an RG domain wall into other distinct non-trivial conformal interfaces.", "url": "https://arxiv.org/abs/2610.23529", "type": "理论", "summary": "1. 该工作以phantom流为工具系统构造二维有理共形场论间的重整化群畴壁，并把构造约化为辅助手征理论中自动同构扭曲Cardy态的识别。\n2. 其技术卖点是区分交换相同流代数因子的外自同构与由自旋一phantom流零模生成的连续内自同构，后者使RG畴壁普遍具有连续缺陷共形模空间，且orbifold可提升相应模量并通过拓扑界面联系两类RG膜。\n3. 作者在非幺正极小模型、parafermion到极小模型及广义parafermion流中非微扰计算边界熵、谱与UV-IR算符混合，并发现模空间闭合回路可将RG畴壁变为其他非平凡共形界面。", "summary_source": "deepseek", "authors": [{"name": "Jin Chen"}], "featured_authors": [{"name": "Jin Chen"}], "author_count": 1}, {"id": "2610.23580", "category": "hep-th", "title": "Holographic two-point functions across a PT symmetry-breaking transition", "abstract": "In parity-time (PT)-symmetric non-Hermitian systems, an exceptional point, where eigenvalues and eigenvectors coalesce, typically separates a real spectrum from complex-conjugate eigenvalues. In logarithmic conformal field theories (LCFTs), such an exceptional point appears in the spectrum of scaling dimensions. Holographic models of LCFTs, such as the dipole model, are built exactly at this point. Here, we deform the holographic dipole model so that its two coalescing scaling dimensions split into either two real ones or a complex-conjugate pair. We obtain the renormalized two-point functions in closed form. They change continuously from a linear combination of two power laws, through the logarithmic form of the LCFT at the exceptional point, to log-periodic oscillations. For any pair of scalar primary operators with real mixing under dilatations, the conformal Ward identities fix this form up to two normalization constants, which the holographic dictionary determines. In PT-symmetric theories with such a dilatation operator, real and complex-conjugate scaling dimensions correspond to the PT-unbroken and PT-broken phases. In the BTZ black hole at finite temperature, the difference between the quasinormal frequencies associated with the two scaling dimensions changes from purely imaginary to purely real across the real-to-complex spectral transition. Correspondingly, the linear response changes from overdamped to underdamped, with critical damping at the exceptional point.", "url": "https://arxiv.org/abs/2610.23580", "type": "理论", "summary": "1. 该工作通过形变全息偶极模型，使原本在例外点重合的两个标度维度分裂为两个实维度或一对复共轭维度，并给出重整化两点函数的闭式结果。\n2. 其核心卖点在于两点函数连续地从两个幂律组合经例外点处的对数共形场论形式过渡到对数周期振荡，且共形Ward恒等式将形式固定到两个由全息字典确定的归一化常数；在有限温BTZ黑洞中，准正规模频率差由纯虚变为纯实，线性响应相应从过阻尼转为欠阻尼并在例外点临界阻尼。\n3. 这为在全息框架下刻画PT对称破缺、例外点及临界阻尼提供了可计算的范例，并提示可将非厄米谱转变与对数共形场论响应统一研究。", "summary_source": "deepseek", "authors": [{"name": "Zuo Wang"}, {"name": "Liang He"}], "featured_authors": [{"name": "Zuo Wang"}, {"name": "Liang He"}], "author_count": 2}, {"id": "2610.23743", "category": "hep-th", "title": "Runaways in the no-boundary wavefunction", "abstract": "We study the no-boundary wavefunction of Einstein gravity with positive cosmological constant. We identify families of weakly curved bulk saddles, including fillings of anisotropic late-time universes $\\mathbb{S}^p\\times\\mathbb{S}^q$, whose weights grow exponentially with geometric parameters of the late-time boundary. These runaways threaten the normalizability of the no-boundary state within gravitational effective field theory. Whether these saddles contribute remains open. Many of the runaway families we study violate the Kontsevich-Segal-Witten criterion, although several are minus asymptotically hyperbolic geometries whose one-loop determinants appear well-defined for pure gravity. For $\\mathbb{S}^1\\times\\mathbb{S}^q$ universes with $q\\equiv 0\\pmod4$, we construct a contour integral model that excludes the runaway at large $\\mathbb{S}^q$.", "url": "https://arxiv.org/abs/2610.23743", "type": "理论", "summary": "1. 该工作研究正宇宙学常数下爱因斯坦引力的无边界波函数，识别出包含各向异性晚期宇宙 S^p×S^q 填充在内的一类弱弯曲体鞍点，其权重随边界几何参数指数增长。\n2. 关键在于指出这些失控鞍点会威胁无边界态在引力有效场论中的可归一性，并考察其与 Kontsevich-Segal-Witten 判据及纯引力单圈行列式良定义性的关系。\n3. 针对 q≡0 mod4 的 S^1×S^q 宇宙，所构造的围道积分模型能在大的 S^q 极限排除失控，为筛选无边界态贡献提供线索，但这些鞍点是否最终计入仍待确定。", "summary_source": "deepseek", "authors": [{"name": "Jordan Cotler"}, {"name": "Prateksh Dhivakar"}, {"name": "William Harvey"}, {"name": "Victor Ivo"}, {"name": "Kristan Jensen"}], "featured_authors": [{"name": "Jordan Cotler"}, {"name": "Prateksh Dhivakar"}, {"name": "William Harvey"}, {"name": "Victor Ivo"}, {"name": "Kristan Jensen"}], "author_count": 5}, {"id": "2610.22396", "category": "math-ph", "title": "General Relativity in Three Lines", "abstract": "We show that complex general relativity can be formulated directly in terms of three affine lines assigned to each spacetime point. The lines are represented by Plücker bivectors, and Urbantke's construction applied to the associated two-forms reconstructs the conformal spacetime metric. Starting from the chiral Plebański action, the simplicity constraints turn the three two-forms into a null internal basis of simple bivectors and thereby into three projective lines. A $3+1$ decomposition then yields a first-order canonical theory whose configuration variable is the weighted triple of lines and whose conjugate variable is a line momentum. The resulting constraint system consists of three internal Gauss constraints, three vector constraints, and one Hamiltonian constraint. A notable feature of the line formulation is that the equation obtained by varying the line momentum is pointwise algebraic after the spatial integrations by parts. Consequently the momentum can be eliminated explicitly wherever the corresponding Legendre map is invertible, giving a second-order action whose only dynamical configuration variable is the weighted triple of lines. The line curvature separates naturally into a cosmological trace and the Weyl matrix of the selected chiral sector. The Legendre map becomes singular on a distinguished null-evolution locus where the spacetime metric remains nondegenerate. There its rank drops from nine to six, giving three algebraic compatibility conditions. We construct a finite invariant partial Legendre transform and a smooth constrained second-order continuation through this locus. This analysis provides a regular framework for regimes in which the evolution direction becomes null and may be useful in the study of near-horizon geometries and related gravitational phenomena.", "url": "https://arxiv.org/abs/2610.22396", "type": "理论", "summary": "1. 该文将复广义相对论直接表述为每个时空点上的三条仿射线：以Plücker双矢量和Urbantke构造从三个二形式重构共形度规，由手征Plebański作用量的简单性约束得到射影线，并建立以加权三线为位形变量、线动量为共轭变量的3+1一阶正则理论及三Gauss、三矢量、一Hamiltonian约束。\n2. 其卖点在于线动量变分方程经空间分部积分后逐点代数，可在Legendre映射可逆处显式消去动量而得到仅含加权三线的二阶作用量，并对零演化轨迹上映射秩由九降至六的奇异性构造有限部分Legendre变换与光滑约束延拓。\n3. 这为演化方向变为类光、近视界几何及相关引力现象提供了正则且光滑的分析框架。", "summary_source": "deepseek", "authors": [{"name": "Pawel Nurowski"}], "featured_authors": [{"name": "Pawel Nurowski"}], "author_count": 1}, {"id": "2610.22767", "category": "math-ph", "title": "Asymptotic evaluation of multidimensional oscillatory integrals", "abstract": "Oscillatory integrals appear throughout physics, from diffraction and gravitational lensing to real-time path integrals. Their asymptotic evaluation is complicated by the need to determine which real and complex saddle points contribute, and how they are connected by Stokes phenomena. In multiple dimensions, this traditionally requires computing steepest descent manifolds in a high-dimensional complex space. Here, we develop an algebraic alternative for integrals with polynomial and rational exponents. Using integration by parts and Brieskorn reduction, we construct a finite-dimensional Gauss-Manin system that generates the asymptotic expansion of all saddle points. Its Borel transform yields a Fuchsian system, whose mondromy determines the Stokes constants and hence the adjacency of the saddle points. Combined with the recent South-East rule, this identifies the contributing saddles and enables superasymptotic and hyperasymptotic approximations without computing gradient flows. We demonstate the method for the parabolic umbilic diffraction integral and a Lorentzian lens as examples, obtaining agreement to machine precision. The methods are implemented in an accompanying open-source Julia package this http URL", "url": "https://arxiv.org/abs/2610.22767", "type": "理论", "summary": "1. 该文针对多维振荡积分，提出基于分部积分与Brieskorn约化的代数渐近展开方法，避免直接计算高维复空间中的最速下降流形。\n2. 其卖点是构造有限维Gauss–Manin系统生成所有鞍点的渐近展开，并经Borel变换得到Fuchsian系统，由单值性确定Stokes常数和鞍点邻接，再结合South-East规则选出贡献鞍点。\n3. 抛物脐衍射积分与洛伦兹透镜算例达到机器精度，显示该框架无需计算梯度流即可实现超渐近与超超渐近近似，并具备开源Julia实现。", "summary_source": "deepseek", "authors": [{"name": "Samuel Crew"}, {"name": "Job Feldbrugge"}], "featured_authors": [{"name": "Samuel Crew"}, {"name": "Job Feldbrugge"}], "author_count": 2}, {"id": "2610.23320", "category": "math-ph", "title": "Folding to the Bessel-Clifford system, and Equivariant Topological Recursion", "abstract": "We study the interplay between symmetry reductions of meromorphic connections, folding, and topological recursion. As a motivating example, we realize the Bessel-Clifford system as a folding of a symmetry-invariant subspace of the $0-$member of the Painlevé IV hierarchy. We introduce equivariant topological recursion for spectral curves with a Klein four-group $\\mathbb Z_2\\times\\mathbb Z_2$ symmetry and prove that the corresponding equivariant correlators can be folded to the ordinary topological recursion correlators on the quotient spectral curve. We further establish the compatibility of this folding with the associated wave functions and quantum curves. In the Bessel-Clifford example, this yields an explicit relation between the equivariant and folded wave functions and recovers the corresponding quantum curve reduction. These results provide a framework for relating symmetry reductions of integrable systems to folding operations in topological recursion.", "url": "https://arxiv.org/abs/2610.23320", "type": "理论", "summary": "1. 该文将Bessel-Clifford系统实现为Painlevé IV层级零成员对称不变子空间的折叠，并针对具Klein四元群对称的谱曲线引入等变拓扑递归。\n2. 其卖点是证明等变关联子可折叠为商谱曲线上的普通拓扑递归关联子，且折叠与波函数、量子曲线相容，并在Bessel-Clifford例中给出显式关系并恢复相应量子曲线约化。\n3. 这为将可积系统的对称约化与拓扑递归中的折叠操作相关联提供了框架，并启发后续对约化、量子曲线与等变递归对应关系的研究。", "summary_source": "deepseek", "authors": [{"name": "Mohamad Alameddine"}, {"name": "Alexander Hock"}], "featured_authors": [{"name": "Mohamad Alameddine"}, {"name": "Alexander Hock"}], "author_count": 2}, {"id": "2610.23355", "category": "math-ph", "title": "Randomness from initial conditions: The challenge of incompleteness", "abstract": "Certain prima facie deterministic theories, notably Bohmian mechanics and kinetic theory, require ``random'' initial conditions in order to achieve their goals. I analyze recent proposals that this idea should be implemented using algorithmic randomness, seen as a mathematical sharpening of the typicality arguments originally used to understand these theories. On the one hand my analysis includes a critique of these arguments and hence a defense of this sharpening. On the other hand, I argue that Chaitin's incompleteness theorems for random sequences make it impossible for a dynamical theory to either process given random initial conditions beyond some finite (but not arbitrary) number of their digits, or else to state such conditions with arbitrary precision without compromising their randomness (these are two sides of the same coin). This challenges the ability of such theories to make any other predictions than those that hold typically in the usual sense of the word (like macroscopic statements), and moves their alleged determinism high up the metaphysical ladder.", "url": "https://arxiv.org/abs/2610.23355", "type": "理论", "summary": "1. 该文系统分析了将算法随机性作为玻姆力学与动理论等确定性理论“随机”初条件基础的近期提议，并批判其典型性论证、捍卫随机性细化方案。\n2. 其核心论点是Chaitin关于随机序列的不完备定理迫使这类动力理论要么只能处理初条件的有限位数字，要么无法在不破坏随机性的前提下以任意精度陈述初条件，而二者实为一体两面。\n3. 这限制了此类理论除通常意义上的典型宏观预测外的预言能力，并将所谓确定性推至更玄远的形而上学层面。", "summary_source": "deepseek", "authors": [{"name": "Klaas Landsman"}], "featured_authors": [{"name": "Klaas Landsman"}], "author_count": 1}, {"id": "2610.22476", "category": "quant-ph", "title": "Typical Superpositions are Magical", "abstract": "The non-stabilizerness, or \"magic\", of a quantum state is a common metric for the hardness of simulation on a classical computer, and is often quantified by the stabilizer Rényi entropy (SRE). We show how random superpositions of classically simulable states saturate the SRE to the symmetry-restricted Haar-random maximum. For any large-$N$ random pure-state ensemble satisfying the conditions of Schur's lemma, the average SRE of the $m$-component superposition $\\langle M_2(m)\\rangle=N-\\log_2[\\langle W(m)\\rangle]$ is governed by an average witness $\\langle W(m)\\rangle$ that universally decomposes into a Haar floor and an ensemble-specific excess. As the number of components $m$ increases, the excess is suppressed, resulting in a logarithmic scaling of the SRE before plateauing at the Haar-valued maximum. We derive a general closed form for $\\langle W(m)\\rangle$ in the thermodynamic limit, and numerically verify our result for random stabilizer states and random Gaussian states.", "url": "https://arxiv.org/abs/2610.22476", "type": "理论+数值", "summary": "1. 该工作研究了经典可模拟量子态的随机叠加所产生非稳定子性，并基于稳定子Rényi熵推导大N随机纯态系综中m分量叠加的平均魔法度量。\n2. 其核心是将平均SRE写成N−log2⟨W(m)⟩，把平均见证量⟨W(m)⟩普适分解为Haar下限与系综相关超额，证明随m增大超额受抑、SRE先对数增长后饱和至对称受限Haar最大值，并给出热力学极限闭式及稳定子态与高斯态的数值验证。\n3. 这为理解典型叠加如何普适地产生魔法、评估经典模拟难度以及设计基于叠加的量子资源方案提供了可检验的标度依据。", "summary_source": "deepseek", "authors": [{"name": "Joshuah T. Heath"}, {"name": "Andrew Urilyon"}, {"name": "Damien Quinn"}, {"name": "Graham Kells"}], "featured_authors": [{"name": "Joshuah T. Heath"}, {"name": "Andrew Urilyon"}, {"name": "Damien Quinn"}, {"name": "Graham Kells"}], "author_count": 4}, {"id": "2610.22489", "category": "quant-ph", "title": "Multi-Time States in Quantum and Operational Probabilistic Theories: An Axiomatic Framework", "abstract": "Quantum states over time were introduced, in part, to extend Bayesian probability to quantum theory and have since found applications across diverse areas, ranging from quantum causality and open-system dynamics to tests of macroscopic realism. While axiomatic characterizations of these states exist for Markovian dynamics, a general framework accommodating non-Markovian dynamics is still lacking. Moreover, extending this framework beyond quantum mechanics to general physical theories also remains elusive. In this work, we develop an axiomatic framework for multi-time states within a class of operational probabilistic theories (OPTs) that includes quantum mechanics as a special case. Based on three assumptions---compositionality, reconstructibility, and spatio-temporal marginal consistency---the framework accommodates both Markovian and non-Markovian dynamics, and provides sufficient conditions to certify signaling and temporal memory within OPT. As a concrete application of our OPT framework, we fully characterize the unique multi-time state in boxworld and develop a method for Bayesian retrodiction of physical transformations there. Our general framework is consistent with quantum theory, reproducing several existing results. In the non-Markovian quantum dynamics, we establish a correspondence between multi-time states and the process-matrix framework, and fully characterize the multi-time states compatible with general dynamics. This correspondence also lets us infer quantum causal models from multi-time states, and as a proof of principle, we propose a semidefinite program to infer causal order from quantum multi-time states. These results provide a unified framework for studying spatio-temporal states, causal relations, and Bayesian reasoning within OPTs, with implications for both fundamental and applied research.", "url": "https://arxiv.org/abs/2610.22489", "type": "理论", "summary": "1. 该文在包含量子力学的操作概率论框架内，基于组合性、可重构性与时空边际一致性三条假设，建立了可涵盖马尔可夫与非马尔可夫动力学的多时间态公理化体系。\n2. 其核心在于用统一公理刻画多时间态，并给出判定信号传递与时间记忆的充分条件，同时在盒世界中完整表征唯一多时间态并发展物理变换的贝叶斯回溯方法。\n3. 在非马尔可夫量子动力学中，该框架与过程矩阵对应，可刻画一般动力学允许的多时间态、推断量子因果模型，并给出由多时间态推断因果序的半定规划，为时空态、因果关联与贝叶斯推理的统一研究提供启示。", "summary_source": "deepseek", "authors": [{"name": "Kaumudibikash Goswami"}, {"name": "Archana Barvar"}, {"name": "Manabendra Nath Bera"}], "featured_authors": [{"name": "Kaumudibikash Goswami"}, {"name": "Archana Barvar"}, {"name": "Manabendra Nath Bera"}], "author_count": 3}, {"id": "2610.22548", "category": "quant-ph", "title": "A thermally and perturbatively stable classical spin model in two dimensions", "abstract": "We show that the 2D classical spin model constructed in arXiv:2605.10943 hosts many metastable states at non-zero temperature which are stable to arbitrary Hamiltonian perturbations, providing the first such example. Our proof relies on a recursive application of the cluster expansion.", "url": "https://arxiv.org/abs/2610.22548", "type": "理论", "summary": "1. 该工作证明了一个二维经典自旋模型在非零温度下可拥有大量亚稳态，且这些亚稳态对任意哈密顿量微扰保持稳定，并称其为首个此类例子。\n2. 其核心卖点是把递归团簇展开用于逐层控制微扰与热涨落，从而同时给出热稳定性和微扰稳定性，而非仅依赖数值或特定参数。\n3. 这为二维经典自旋系统中亚稳态的严格稳定性分析提供了可复用的团簇展开范式，并提示可在更一般的有限温模型或平台中寻找类似稳健的亚稳态结构。", "summary_source": "deepseek", "authors": [{"name": "Shankar Balasubramanian"}, {"name": "Margarita Davydova"}, {"name": "Ting-Chun Lin"}, {"name": "Ryan Thorngren"}], "featured_authors": [{"name": "Shankar Balasubramanian"}, {"name": "Margarita Davydova"}, {"name": "Ting-Chun Lin"}, {"name": "Ryan Thorngren"}], "author_count": 4}, {"id": "2610.22689", "category": "quant-ph", "title": "Circuit Synthesis for Variational Quantum Algorithms: The Depth of Algebra and Geometry", "abstract": "The analysis of Hamiltonian Variational Ansätze centers on three fundamental questions: which states are exactly reachable from a given initial state, what native control depth suffices for local and global synthesis, and whether a bounded circuit extension can expose a direction of decreasing cost at a suboptimal output. We address these challenges by leveraging the dynamical Lie algebras (DLAs) associated with the circuits and the geometry of the initial state's orbit under the action of the corresponding dynamical Lie group $G$. We show that an initial state has a closed projective orbit whenever it is a nondegenerate eigenstate of a control Hamiltonian. Combined with asymptotic QAOA convergence, this guarantees exact, finite depth ground state preparation for architectures employing diagonal problem Hamiltonians and irreducible stoquastic mixers. We bound the number of native control exponentials required for local unitary synthesis and state preparation using DLA commutator filtration growth alongside reachable orbit dimensions. Complementing these local results, we construct global frameworks on invariant sectors equipped with full unitary or special unitary dynamical Lie algebras. These constructions yield explicit applications to Pauli-generated systems and constrained maximum independent set multi-angle QAOA circuits; specifically, we show that their native control costs are directly determined by commutator filtration depth and independent-set toggle-group geometry, respectively. Finally, if the dynamical Lie group is compact, the observable $H_P$ generates an admissible evolution ($iH_P \\in \\mathfrak{g}$, where $\\mathfrak{g}$ is the DLA), and the projective orbit of the initial state contains a ground state ray of $H_P$, then a bounded depth, identity-initialized circuit extension exhibits either first-order descent or negative curvature at every suboptimal circuit output.", "url": "https://arxiv.org/abs/2610.22689", "type": "理论+数值", "summary": "1. 该工作利用动力学李代数与初始态轨道几何，系统分析哈密顿变分拟设的可达态、局部与全局合成所需原生控制深度以及亚优输出处的成本下降方向。\n2. 其核心是证明控制哈密顿量非简并本征态具有闭合射影轨道，结合QAOA渐近收敛，为对角问题哈密顿量与不可约随机型混合器给出有限深度精确基态制备，并用交换子过滤增长与轨道维数界定原生控制指数算符数，还应用于泡利生成系统与约束最大独立集多角度QAOA线路。\n3. 在紧致动力学李群等条件下，有界深度、恒等初始化的电路扩展可在每个亚优输出处呈现一阶下降或负曲率，这为变分拟设的深度设计与可合成性提供了明确判据。", "summary_source": "deepseek", "authors": [{"name": "Boris Tsvelikhovskiy"}], "featured_authors": [{"name": "Boris Tsvelikhovskiy"}], "author_count": 1}, {"id": "2610.22737", "category": "quant-ph", "title": "Metric and Dispersive Dynamics of Phase Perturbations in Bohmian Quantum Mechanics", "abstract": "By linearizing the hydrodynamic equations associated with the Madelung transformation in the context of Bohmian dynamics, we derive an effective metric for the phase perturbation around a background state. We show that the metric previously obtained previously by the same authors arises naturally as a particular case of a more general structure, in which the complete functional variation of the quantum potential is retained and external classical potentials can be incorporated. This generalization preserves the dependence of the quantum potential on the density and its spatial derivatives, generating additional terms that introduce dispersive corrections and act as sources in the effective Klein-Gordon equation. To organize these contributions, we introduce differential operators that separate the local sector responsible for the effective geometry from the corrections associated with the complete functional structure of the quantum potential. We identify the conditions under which these additional terms become negligible, recovering homogeneous propagation and the effective geometry for the Gaussian wave packet of a free particle.", "url": "https://arxiv.org/abs/2610.22737", "type": "理论", "summary": "1. 该工作通过线性化玻姆动力学中Madelung变换对应的流体力学方程，导出背景态附近相位扰动的有效度规，并推广至保留量子势完整泛函变分且可含外部经典势的情形。\n2. 其关键推进在于将作者先前的度规视为该一般结构的特例，显式保留量子势对密度及空间导数的依赖，由此产生色散修正与有效Klein-Gordon方程源项，并用微分算符分离有效几何的局域部分与泛函修正。\n3. 该框架进一步给出额外项可忽略的条件，并恢复自由粒子高斯波包的均匀传播及相应有效几何，为界定这一有效几何近似的适用边界提供了判据。", "summary_source": "deepseek", "authors": [{"name": "Felipe S. Escórcio"}, {"name": "Hermano Velten"}], "featured_authors": [{"name": "Felipe S. Escórcio"}, {"name": "Hermano Velten"}], "author_count": 2}, {"id": "2610.22750", "category": "quant-ph", "title": "The Classical Boundary of Quantum Computation: History-Resolved Causal Stochastic Machines and the Cost of Classicalization", "abstract": "What separates quantum computation from classical computation when a classical model may retain every branch history and arbitrary causal memory? We study this question using history-resolved causal stochastic machines (HCSMs), which describe positive causal history laws. Probabilistic Turing machines (PTMs) embed in stochastic-ensemble models (SEnMs), which in turn embed in HCSMs. We prove that HCSM history laws coincide exactly with the fixed-basis, prefix-preserving diagonal sector of ideal quantum processes, denoted by $\\mathsf{PTM}_{\\rm proc}$ and distinguished here from algorithmic quantum Turing machines (QTMs). Coherent quantum processes extend strictly beyond this sector. The boundary is already visible in reversibility. Born-probability shadows of unitary gates preserve inverse composition exactly for basis permutations with phases. Outside this class, an exact positive stochastic simulation that supports universal quantum continuations must retain predictive information absent from visible probabilities. An inverse-recovery identity quantifies this phase ledger, and universal continuation forces the retained probability law to be tomographically sufficient for the quantum state. Under continuous full-state encoding assumptions, this requirement yields quantum-state dimension lower bounds. The familiar slogan $\\mathsf{PTM}\\subseteq\\mathsf{QTM}$ is thereby sharpened into a precise classical boundary and a no-free-classicalization principle. Complete classical branching does not remove the predictive information needed to represent
