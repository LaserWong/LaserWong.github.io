 quantum coherence.", "url": "https://arxiv.org/abs/2610.22750", "type": "理论+数值", "summary": "1. 该工作提出历史分辨因果随机机（HCSM），将概率图灵机经随机系综模型嵌入其中，并证明 HCSM 历史律恰为理想量子过程固定基、保持前缀的对角扇区，而相干过程严格越界。\n2. 其技术卖点是以可逆性和逆恢复恒等式量化“相位账本”：除带相位的基置换外，欲精确正随机模拟并支持通用量子延拓，必须保留可见概率之外的预测信息，且在连续全态编码下导出量子态维数下界。\n3. 这为 PTM⊆QTM 给出精确经典边界和“无免费经典化”原则，表明完整经典分支仍不能消除表示量子相干所需的预测信息。", "summary_source": "deepseek", "authors": [{"name": "Kyoungho Cho"}, {"name": "Junghee Ryu"}, {"name": "Minsu Kim"}, {"name": "Jeongho Bang"}], "featured_authors": [{"name": "Kyoungho Cho"}, {"name": "Junghee Ryu"}, {"name": "Minsu Kim"}, {"name": "Jeongho Bang"}], "author_count": 4}, {"id": "2610.22761", "category": "quant-ph", "title": "Quantumness of Entanglement in Schwarzschild de Sitter Spacetime", "abstract": "We investigate genuine multipartite entanglement and genuine tripartite nonlocality of a noisy generalized GHZ state in Schwarzschild-de Sitter spacetime. The genuine multipartite concurrence and optimized Svetlichny parameter are employed to characterize these two quantum correlations. It is shown that the black hole and cosmological event horizons redistribute genuine multipartite entanglement differently among the physically accessible and inaccessible reduced states, while Svetlichny violation occurs only in the physically accessible state. We find that genuine multipartite entanglement can survive in the physically inaccessible states even when genuine tripartite nonlocality is absent. In addition, initial white noise suppresses both correlations, with Svetlichny nonlocality surviving over a narrower parameter region. Furthermore, in the Nariai limit, under the normalization adopted here, the correlations become concentrated in the physically accessible state. These results demonstrate the different robustness of genuine multipartite entanglement and genuine tripartite nonlocality under horizon effects and initial noise.", "url": "https://arxiv.org/abs/2610.22761", "type": "理论+数值", "summary": "1. 该文研究了Schwarzschild-de Sitter时空中含噪声广义GHZ态的真正多体纠缠与真正三体非定域性，并用多体concurrence和优化Svetlichny参数分别刻画二者。\n2. 其核心在于揭示黑洞与宇宙学视界会以不同方式在物理可及与不可及约化态间重新分配多体纠缠，而Svetlichny违背仅出现在物理可及态，且不可及态中纠缠可在非定域性缺失时存续。\n3. 这表明视界效应与初始白噪声对不同量子关联的鲁棒性存在层级差异，并为Nariai极限下关联集中于可及态及后续弯曲时空量子信息研究提供明确参照。", "summary_source": "deepseek", "authors": [{"name": "Sumeng Wang"}, {"name": "Xiaofen Huang"}], "featured_authors": [{"name": "Sumeng Wang"}, {"name": "Xiaofen Huang"}], "author_count": 2}, {"id": "2610.22876", "category": "quant-ph", "title": "Quantum approximate stochastic combinatorial optimisation", "abstract": "Two-stage stochastic combinatorial optimisation concerns discrete decisions made before all relevant information is known. An initial decision is made; once uncertainty is resolved, it can be adapted to the realised scenario, at a cost. The aim is to find the initial decision that minimises the upfront cost plus the expected cost of optimal adaptation. The first-stage decision problem is often NP-hard, and computing the expected minimum recourse cost can be $\\#\\mathrm{P}$-hard for a single first-stage candidate. We introduce Quantum Approximate Stochastic Combinatorial Optimisation (QASCO), a variational quantum-walk ansatz that coherently incorporates scenario-dependent recourse into its dynamics to search over first-stage decisions without explicitly evaluating expected minimum recourse costs. We demonstrate QASCO for MaxCut with stochastic edge weights, obtain a circuit with polynomial per-layer gate complexity, and study the ansatz via exact state-vector simulation. Across the instances considered, QASCO concentrates amplitude more effectively on stochastic-optimal first-stage decisions than a previously proposed two-stage QAOA construction. We further show that the ansatz can be calibrated using a depth-independent number of parameters and applied to unseen instances without further circuit-parameter optimisation, including joint decision--scenario--recourse spaces spanning more than $2^{32}$ configurations. Under a query-cost model, comparison with the tested classical heuristics using sample-average approximations of the expected minimum recourse cost shows that QASCO more reliably reaches globally optimal first-stage solutions while requiring fewer cut evaluations. These results show how to incorporate scenario-dependent recourse into the ansatz dynamics, providing a general framework for variational quantum walks in two-stage stochastic combinatorial optimisation.", "url": "https://arxiv.org/abs/2610.22876", "type": "理论+数值", "summary": "1. 该工作提出QASCO变分量子行走拟设，将场景相关追索相干嵌入动力学，无需显式计算期望最小追索成本即可搜索两阶段随机组合优化的第一阶段决策，并在随机边权MaxCut上以多项式逐层门复杂度和精确态矢量模拟演示。\n2. 其卖点在于较先前两阶段QAOA构造更有效地把振幅集中到随机最优第一阶段解，可用与深度无关的参数标定并迁移至未见实例，覆盖超过2^32个联合决策—场景—追索构型，且在查询成本模型下以更少割评估更可靠地达到全局最优。\n3. 这为把场景相关追索纳入拟设动力学提供了通用框架，并启发变分量子行走用于更广泛的两阶段随机组合优化。", "summary_source": "deepseek", "authors": [{"name": "Edric Matwiejew"}, {"name": "Paulo E. Santos"}, {"name": "Jingbo B. Wang"}, {"name": "Ugo Varetto"}], "featured_authors": [{"name": "Edric Matwiejew"}, {"name": "Paulo E. Santos"}, {"name": "Jingbo B. Wang"}, {"name": "Ugo Varetto"}], "author_count": 4}, {"id": "2610.22983", "category": "quant-ph", "title": "Quantum Tsallis Entropy Estimation: Near-Optimal Bounds and High-Precision Improvements", "abstract": "Estimating statistical properties of probability distributions is a fundamental problem in statistics and theoretical computer science. We develop quantum algorithms for estimating the $q$-Tsallis entropy $\\mathrm{H}_q^{\\mathrm{Tsa}}(P) =\\frac{\\sum_{i=1}^n p_i^q-1}{1-q}$ when $0<q<1$, given purified quantum query access to a distribution $P$ on $[n]$. When $0<q\\leq \\frac{1}{2}$, we provide a quantum algorithm with query complexity $\\widetilde{O}\\rbra{\\left(\\frac{n}{\\varepsilon}\\right)^{\\frac{1}{2q}}}$, which is optimal up to polylogarithmic factors. When $\\frac{1}{2}<q<1$, we introduce a two-stage simultaneous probability estimation procedure, yielding a quantum algorithm with query complexity $\\widetilde{O}\\left(\\frac{n^{\\frac12+\\frac{1}{2q}}}{\\varepsilon^{\\frac{1}{2q}}}+\\frac{n^{1-q}}{\\varepsilon}\\right)$, which improves the result given by Chen et al. (ICALP 2026) when $\\varepsilon=O\\rbra{n^{1-2q}}$.", "url": "https://arxiv.org/abs/2610.22983", "type": "理论+数值", "summary": "1. 该工作研究了在纯化量子查询访问下估计离散分布的 q-Tsallis 熵（0<q<1），并给出分段的量子算法与查询复杂度界。\n2. 其核心在于：对 0<q≤1/2 给出 ~O((n/ε)^{1/(2q)}) 查询算法并在多对数因子内最优；对 1/2<q<1 引入两阶段同时概率估计，得到 ~O(n^{1/2+1/(2q)}/ε^{1/(2q)}+n^{1-q}/ε)，在 ε=O(n^{1-2q}) 时改进 Chen 等的结果。\n3. 这为量子熵与统计性质估计建立了近最优框架，并提示两阶段概率估计可推广到其他非线性分布泛函的量子算法设计。", "summary_source": "deepseek", "authors": [{"name": "Chengshen Gao"}, {"name": "Zongxing Xiong"}, {"name": "Lvzhou Li"}], "featured_authors": [{"name": "Chengshen Gao"}, {"name": "Zongxing Xiong"}, {"name": "Lvzhou Li"}], "author_count": 3}, {"id": "2610.23043", "category": "quant-ph", "title": "Discrete time crystals and classical logic gates in coupled open Dicke models", "abstract": "We investigate the dynamics of coupled discrete time crystals (DTCs) in the coupled Dicke model or Dicke dimer (DD) with dissipation. By numerically simulating the mean-field dynamics of the system, we show that coupling two DTCs decreases their oscillation amplitude following a transient relaxation period. For sufficiently strong coupling, the coupled DTCs become unstable, resulting in the system relaxing towards the normal phase (NP). We demonstrate that the relaxation time diverges near the critical coupling strength, suggesting a continuous phase transition. Using the truncated Wigner approximation (TWA), we explore how the dynamics are affected by the introduction of quantum fluctuations. We also consider a scenario in which an NP is briefly coupled to a DTC, seeding the NP to transform into a DTC that is either synchronized or anti-synchronized relative to the DTC. We investigate the robustness of this phenomenon in the presence of noise. Using these results, we propose a scheme to perform NAND and NOR operations with three DTCs by sequentially coupling the input and output sites. We identify the parameter regimes in which the logic gate architecture remains valid, and investigate how the protocol is affected by the presence of quantum fluctuations.", "url": "https://arxiv.org/abs/2610.23043", "type": "理论+数值", "summary": "1. 该工作数值模拟了耗散耦合Dicke二聚体的平均场动力学，研究两个耦合离散时间晶体（DTC）的弛豫、同步与失稳行为。\n2. 其核心结果是耦合先抑制DTC振荡幅度，并在临界耦合处出现弛豫时间发散的连续相变；借助截断Wigner近似进一步刻画量子涨落对正常相被“种子化”为同步或反同步DTC及该现象噪声鲁棒性的影响。\n3. 基于此提出以三个DTC顺序耦合实现NAND与NOR操作的方案，并界定其在量子涨落下仍有效的参数区间，为耗散时间晶体用于逻辑计算提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Emmanuel D.G. U"}, {"name": "Roy D. Jara Jr."}, {"name": "Jayson G. Cosme"}], "featured_authors": [{"name": "Emmanuel D.G. U"}, {"name": "Roy D. Jara Jr."}, {"name": "Jayson G. Cosme"}], "author_count": 3}, {"id": "2610.23090", "category": "quant-ph", "title": "Concrete Functions in Private Simultaneous Quantum Messages: Quantum Advantages and Structural Limitations", "abstract": "Private simultaneous quantum messages (PSQM) provide a minimal model of noninteractive secure multiparty quantum computation, yet their communication complexity for concrete functions remains poorly understood. We show that familiar total functions already exhibit both genuine quantum advantages and strong structural limitations. For three-party equality on $n$-bit inputs, which determines whether the players' $n$-bit strings are identical, we construct an entanglement-assisted protocol with asymptotic communication $(1.633\\ldots)n$ qubits, whereas every perfectly correct protocol without prior entanglement requires at least $3n$ qubits. For three-bit majority, one shared GHZ state and one transmitted qubit per player suffice for perfect correctness and perfect privacy, reducing the communication from the optimal classical cost of six bits to three qubits. Three-bit AND behaves differently. No perfectly correct and perfectly private protocol exists when the players share an arbitrary three-qubit state, apply arbitrary local unitary encodings, and transmit one qubit each. However, increasing the local dimension overcomes this obstruction: one shared three-qutrit GHZ state and one transmitted qutrit per player yield a one-shot protocol with total communication $3\\log_2 3$. Together with the six-bit classical lower bound, this gives a strict quantum communication advantage. More generally, for every $k\\geq 3$, we construct a perfectly correct and perfectly private one-shot protocol for $k$-bit AND using one qudit of dimension at most $k$ per player, and hence at most $k\\log_2 k$ qubits in total.", "url": "https://arxiv.org/abs/2610.23090", "type": "理论", "summary": "1. 该工作研究私有同时量子消息中具体函数的通信复杂度，围绕三方相等性、三位多数与三位与函数构造协议并给出下界，揭示量子优势与结构限制。\n2. 其核心卖点是：三方相等性以纠缠辅助约1.633n量子比特突破无纠缠至少3n的下界；三位与函数在任意三量子比特共享态与每人一量子比特下不可完美私密，但提高局域维度至三能级后以3log2 3总通信实现严格量子优势。\n3. 这为无交互安全多方量子计算中具体函数的资源—通信权衡提供判据，并启发利用纠缠与局域维度突破经典极限，同时正视不可逾越的结构性限制。", "summary_source": "deepseek", "authors": [{"name": "Harumichi Nishimura"}], "featured_authors": [{"name": "Harumichi Nishimura"}], "author_count": 1}, {"id": "2610.23096", "category": "quant-ph", "title": "Nonequilibrium Dynamical Quantum Phase Transitions in the Extended Agassi Model", "abstract": "We investigate dynamical quantum phase transitions (DQPTs) in the extended Agassi model following sudden quenches of same level pairing ($\\Sigma$), monopole-monopole ($\\chi$) and cross level pairing ($\\Lambda$) strengths. Using exact diagonalization, we characterize the non-equilibrium dynamics through the Loschmidt echo and intensive return-rate function. Quenches across equilibrium phase boundaries produce cusp-like structures in the return rate that shows non-analyticities with increasing system size. Equilibrium finite size to large scaling identifies the $\\chi$-driven transition as a second order phase transition similar to mean-field, Dicke, and Lipkin-Meshkov-Glick (LMG) models critical behaviour with the exponent of the order parameter $\\beta \\simeq 1/2$, while the $\\Sigma$- and $\\Lambda$-driven transitions are first order. We further characterize the associated dynamical singularities through a local scaling exponent $\\alpha$, with $\\alpha_\\chi \\simeq 2/3$, $\\alpha_\\Lambda \\simeq 1/3$, and $\\alpha_\\Sigma \\simeq 3/2$ of all three parameters. The distinct scaling behaviours across the parameter channels show that dynamical criticality is not determined solely by the equilibrium order of the transition, revealing multiple dynamical scaling regimes. These non-analyticities are associated with the Fisher zeros of the Loschmidt amplitude, which cross the real time axis at critical times and the time derivatives of the return-rate function to characterize the order of DQPTs within the extended Agassi model.", "url": "https://arxiv.org/abs/2610.23096", "type": "理论+数值", "summary": "1. 该工作用精确对角化研究扩展Agassi模型在同能级配对Σ、单极-单极χ和跨能级配对Λ强度突然淬火后的动力学量子相变，并以Loschmidt回波和强度回返率函数刻画非平衡演化。\n2. 其卖点是跨越平衡相边界淬火会在回返率中产生随系统尺寸增强的尖点非解析性；有限尺度标度显示χ驱动为二阶相变（β≈1/2），Σ和Λ驱动为一阶，而局域标度指数αχ≈2/3、αΛ≈1/3、αΣ≈3/2表明动力学临界性不由平衡相变阶数单独决定。\n3. 这些非解析性对应Loschmidt振幅Fisher零点穿越实时间轴，回返率时间导数可判定DQPT阶数，为多通道淬火下的动力学临界标度提供了可检验框架。", "summary_source": "deepseek", "authors": [{"name": "Ritesh Kumar Palai"}, {"name": "Rajiv Kumar"}, {"name": "Venktesh Singh"}, {"name": "Sunil K. Mishra"}], "featured_authors": [{"name": "Ritesh Kumar Palai"}, {"name": "Rajiv Kumar"}, {"name": "Venktesh Singh"}, {"name": "Sunil K. Mishra"}], "author_count": 4}, {"id": "2610.23111", "category": "quant-ph", "title": "Liouvillian Non-Invertible Symmetry", "abstract": "Non-invertible symmetries extend conventional symmetries beyond group-like transformations and play an important role in quantum field theory and many-body physics. However, a general framework of non-invertible symmetries in open quantum systems is still lacking. Here, we formulate a general Liouville-space duality framework that extends Hilbert-space non-invertible dualities to open quantum systems. The resulting defect relates Liouvillians with dual Hamiltonian and dissipative parameters and becomes an exact symmetry at self-duality. We apply this framework to the periodic transverse-field Ising chain with two collective Lindblad channels exchanged by Kramers--Wannier (KW) duality. A strong $\\mathbb{Z}_2$ symmetry divides Liouville space into four parity sectors, while the defect acts nontrivially only in the even-even sector. At self-duality, the KW defect imposes a momentum-resolved selection rule on Liouvillian Jordan blocks. Modes with different Liouville momenta or KW-defect eigenvalues cannot form a common exceptional Jordan block. For a three-site chain, a global Rényi-2 KW asymmetry dynamically identifies the self-dual conditions. At the same time, the spectral structure exhibits both a semisimple degeneracy and a self-dual exceptional point with a perturbation-selective response. These results extend non-invertible dualities to Markovian quantum dynamics and establish a symmetry-based selection rule for Liouvillian Jordan structures.", "url": "https://arxiv.org/abs/2610.23111", "type": "理论+数值", "summary": "1. 该工作建立Liouville空间对偶框架，把Hilbert空间非可逆对偶推广至开放量子系统，并用于两个集体Lindblad通道经Kramers-Wannier对偶交换的周期横场Ising链。\n2. 其核心物理在于所构造缺陷关联对偶哈密顿量与耗散参数、在自对偶时成为严格对称，并在偶-偶宇称扇区对Liouvillian Jordan块施加动量分辨选择规则：不同Liouville动量或KW缺陷本征值的模式不能共享例外Jordan块。\n3. 这扩展了非可逆对偶至马尔可夫动力学，并给出Liouvillian Jordan结构的对称性选择规则；三站点链的Rényi-2 KW不对称性可动态标识自对偶条件，谱中同时出现半单简并与扰动选择性响应的自对偶例外点。", "summary_source": "deepseek", "authors": [{"name": "Ying-Cheng Yang"}, {"name": "Jhen-Dong Lin"}, {"name": "Yueh-Nan Chen"}], "featured_authors": [{"name": "Ying-Cheng Yang"}, {"name": "Jhen-Dong Lin"}, {"name": "Yueh-Nan Chen"}], "author_count": 3}, {"id": "2610.23138", "category": "quant-ph", "title": "Sample-Based Quantum Linear Solver and Bounds on Krylov-State Sampling", "abstract": "To solve linear systems $Ax=b$, we propose a sample-based quantum linear solver combining quantum Krylov-state sampling with classical variational diagonalization. Rather than simulating the cost Hamiltonian $H_b(A)=A^\\dagger(I-|b\\rangle\\langle b|)A$, we measure quantum Krylov states $e^{-iAT}|b\\rangle$ generated by the original Hermitian operator $A$ in the computational basis. We then classically diagonalize the projected cost Hamiltonian to reconstruct an approximate solution. Using a representation of $A^{-1}|b\\rangle$ as a linear combination of quantum Krylov states, we derive lower bounds on computational-basis sampling probabilities from solution amplitudes. We establish support-discovery guarantees for finite nonnegative-time grid sampling and signed-time sampling, which permits both positive and negative evolution times. The former bounds the maximum evolution time, whereas the latter improves ideal shot complexity at the cost of occasional long evolutions. For a condition-number bound $\\kappa$ on $A$, a lower bound $\\beta_L$ on the solution probability weight of each of $L$ target basis states, and failure probability $\\delta$, signed-time sampling achieves $O(\\kappa^2\\beta_L^{-1}\\log(L/\\delta))$ shots, matching a worst-case lower bound up to constants within an evolution-only observation model in a specified parameter regime. Finally, we analyze the effects of finite-length qDRIFT compilation and circuit reuse on sampling and derive an infidelity bound for the reconstructed solution.", "url": "https://arxiv.org/abs/2610.23138", "type": "理论+数值", "summary": "1. 该工作提出一种基于采样的量子线性求解器，将量子Krylov态采样与经典变分对角化结合来求解线性系统Ax=b。\n2. 其技术要点是直接测量由原Hermitian算符A生成的Krylov态e^{-iAT}|b⟩的计算基采样，并经典对角化投影后的代价哈密顿量以重构近似解，同时由解振幅导出采样概率下界及非负时间与带符号时间采样的支撑发现保证。\n3. 在条件数界κ、目标基态概率权重下界β_L和失败概率δ下，带符号时间采样达到O(κ²β_L^{-1}log(L/δ))次测量并与特定观测模型下的最坏情况下界常数匹配，且给出qDRIFT有限长度编译与电路复用对重构解保真度的影响界，为采样型量子线性求解的复杂度与实现误差提供了可检验标尺。", "summary_source": "deepseek", "authors": [{"name": "Byeongyong Park"}, {"name": "Keunhong Jeong"}, {"name": "Doyeol Ahn"}], "featured_authors": [{"name": "Byeongyong Park"}, {"name": "Keunhong Jeong"}, {"name": "Doyeol Ahn"}], "author_count": 3}, {"id": "2610.23192", "category": "quant-ph", "title": "Controlled PROP: Theory and Applications to Quantum Circuits", "abstract": "Control is a fundamental concept in quantum and reversible computational models. It enables the conditional application of a transformation to a system, depending on the state of another system. We introduce a general framework for diagrammatic reasoning featuring control as a constructor. To this end, we provide an elementary axiomatization of control functors, extending the standard formalism of PROPs to controlled PROPs. As an application, we show that controlled PROPs facilitate diagrammatic reasoning for quantum circuits. In particular, they admit a simple and complete axiomatization involving at most three qubits, whereas in the standard PROP setting, completeness necessarily requires axioms involving arbitrarily many qubits.", "url": "https://arxiv.org/abs/2610.23192", "type": "理论", "summary": "1. 该工作把控制提升为图解语言中的构造子，给出控制函子的基本公理化，并将标准PROP形式体系扩展为受控PROP，用于条件变换的图解推理。\n2. 其技术卖点是把该框架应用于量子线路时得到简洁且完备的公理化：只需至多三量子比特的规则，而标准PROP的完备性本质上要求涉及任意多量子比特的公理。\n3. 这表明控制可作为量子与可逆计算模型图解推理的一等结构，并为以有限规模公理刻画量子线路、简化相关形式化验证提供了一条可检验的路径。", "summary_source": "deepseek", "authors": [{"name": "Noé Delorme"}, {"name": "Simon Perdrix"}], "featured_authors": [{"name": "Noé Delorme"}, {"name": "Simon Perdrix"}], "author_count": 2}, {"id": "2610.23264", "category": "quant-ph", "title": "Anticommuting Displacement Operators, Exact Pauli Algebras,and the Singlet State from the Oscillator Vacuum", "abstract": "We give an explicit construction of a pair of anticommuting Weyl displacement operators for a harmonic oscillator and use bounded functional calculus to obtain exact dichotomic representatives of the Pauli algebra. Two independent oscillators provide commuting Pauli algebras for Alice and Bob. The standard singlet-sector projector, written entirely in terms of these bounded oscillator observables, is then applied to the two-oscillator vacuum. We show explicitly that the projected vacuum has nonzero norm, so its normalization is well defined, has the exact singlet correlations, and reaches the Tsirelson value $2\\sqrt2$ for the usual Bell--CHSH settings. We also clarify that the construction generally realizes a singlet sector with multiplicity, rather than selecting a unique vector in the full oscillator Hilbert space, and we compare the construction with the older pseudospin approach to continuous-variable Bell tests.", "url": "https://arxiv.org/abs/2610.23264", "type": "理论", "summary": "1. 该工作显式构造谐振子的一对反交换Weyl位移算符，借助有界泛函演算得到Pauli代数的精确二分代表，并在两个独立谐振子上建立Alice与Bob的交换Pauli代数后将单态扇区投影子作用于双振子真空。\n2. 其卖点是投影真空具有非零范数、可良定义归一化并给出精确单态关联，在常规Bell–CHSH设置下达到Tsirelson值2√2，且明确指出该构造一般实现的是带多重度的单态扇区而非唯一矢量。\n3. 这为连续变量贝尔检验提供了严格的算符层面构造，并有助于厘清其与旧赝自旋方案的关系以及投影态在完整振子希尔伯特空间中的定位。", "summary_source": "deepseek", "authors": [{"name": "S. P. Sorella"}], "featured_authors": [{"name": "S. P. Sorella"}], "author_count": 1}, {"id": "2610.23405", "category": "quant-ph", "title": "Quantum Circuits for Variable-Coefficient Vlasov Dynamics via Schrödingerisation", "abstract": "High-dimensional Vlasov equations present promising use cases for quantum simulation, but their transport coefficients must be implemented coherently in order to preserve a compact quantum representation. We develop explicit Schrödingerised circuits for prescribed external field Vlasov dynamics without classical field updates. In 1D1V, velocity-dependent streaming is compiled directly from the encoded velocity register, while a non-linear cubic field is evaluated using reversible fixed-point arithmetic. For fixed polynomial degree, the field workspace scales linearly with the coordinate register width, while the field evaluation subroutine has polynomial depth. As a proof of concept, we simulate a minimal coupled 3D3V anharmonic Penning system and realise mixed electric-field terms and transverse magnetic coupling on a six-dimensional phase space in agreement with classical calculations. Resource analysis shows approximately linear growth with the number of time steps, while identifying the auxiliary register as the dominant depth bottleneck. Structured preparation and register recovery of the auxiliary state reveal an interplay between loading cost and readout. Together, our algorithm demonstrates a fully coherent quantum simulation of high-dimensional Vlasov dynamics with variable coefficients and identifies the practical resource costs that must be controlled for large-scale quantum implementation.", "url": "https://arxiv.org/abs/2610.23405", "type": "理论+数值", "summary": "1. 该工作提出了基于Schrödingerisation的显式量子线路，用于实现含预设外场且系数随速度变化的Vlasov动力学，避免经典场更新。\n2. 其技术要点是在一维一速度情形下由编码速度寄存器直接编译速度依赖平流项，并以可逆定点算术相干求值非线性立方场，使固定多项式阶数下的场工作区随坐标寄存器宽度线性增长、场评估子程序保持多项式深度。\n3. 三维三速度非谐Penning系统的概念验证与经典计算一致，资源分析表明深度随时步近似线性增长且辅助寄存器为主要瓶颈，为大规模相干量子模拟中加载成本、读出与资源控制提供了明确约束。", "summary_source": "deepseek", "authors": [{"name": "Fong Yew Leong"}, {"name": "Dax Enshan Koh"}, {"name": "Wei-Bin Ewe"}, {"name": "Qiubo Chen"}, {"name": "Zhun-Yong Ong"}], "featured_authors": [{"name": "Fong Yew Leong"}, {"name": "Dax Enshan Koh"}, {"name": "Wei-Bin Ewe"}, {"name": "Qiubo Chen"}, {"name": "Zhun-Yong Ong"}], "author_count": 5}, {"id": "2610.23415", "category": "quant-ph", "title": "ConQUESTA: Topology-Aware Post-Training Structural Pruning of Quantum Neural Networks", "abstract": "Deploying quantum neural networks (QNNs) on sparse hardware requires preserving task accuracy while reducing compiler-induced two-qubit gates, SWAPs, and depth. We present ConQUESTA (\\underline{C}onstrained \\underline{Qu}antum \\underline{E}ntangler \\underline{S}election with \\underline{T}opology \\underline{A}wareness), a post training pruning framework that combines task saliency with compiler cost, screens candidate entanglers, and searches complete pruning masks under an explicit accuracy constraint. Unlike one-shot ranking, each mask is transpiled as a whole across multiple coupling topologies. Across 4-, 6-, and 8-qubit QNNs and eight model seeds at 55% pruning, ConQUESTA achieves mean resource reductions of 61.6% on Breast Cancer, 72.0% on Digits01, and 82.2% on Iris, exceeding the strongest matched simple baseline by 3.5, 1.7, and 8.9 percentage points, respectively. Fixed-mask recovery raises feasibility from 16/24 to 22/24 runs. In a fixed-k=4 scaling study on a scaling probe of 4 to 12-qubits, the raw mask space grew from 495 to 12.1M while the evaluated masks increase only from 189 to 305. Resource-weight changes alter depth/routing priorities with at most a 0.44-point mean validation shift.", "url": "https://arxiv.org/abs/2610.23415", "type": "理论+数值", "summary": "1. 该工作提出ConQUESTA，一个面向量子神经网络的后训练结构化剪枝框架，在显式精度约束下结合任务显著性与编译代价筛选纠缠门并搜索完整剪枝掩码。\n2. 其关键在于不采用一次性排序，而是将每个掩码整体跨多种耦合拓扑转译评估，从而在55%剪枝下实现约61.6%—82.2%的资源下降并优于匹配基线。\n3. 固定掩码恢复将可行运行数由16/24提升至22/24，且资源权重仅带来至多0.44点验证集变化，表明该方法为稀疏硬件上的QNN部署提供了可扩展且可控的实用路径。", "summary_source": "deepseek", "authors": [{"name": "Saim Rehman"}, {"name": "Muhammad Shafique"}], "featured_authors": [{"name": "Saim Rehman"}, {"name": "Muhammad Shafique"}], "author_count": 2}, {"id": "2610.23429", "category": "quant-ph", "title": "Cayley access models for matrix functions: reachable class and cost", "abstract": "We study how to compute $f(A)b$ on a quantum computer, where $A$ is Hermitian. When $f$ is nonsmooth or has localized difficulty in the spectrum, classical numerical linear algebra approximates it with rational functions rather than polynomials. We propose the Cayley transform, parameterized by $\\sigma \\in \\mathbb{R}$ and $\\gamma > 0$, as an alternative to the standard quantum access model. The two parameters let one concentrate accuracy where $f$ is difficult, which standard models can achieve only by raising the polynomial degree globally. This transformation converts Hermitian matrices to unitaries, allowing generalized quantum signal processing to apply Laurent polynomials bounded on the unit circle. We compare three access models (block encoding, matrix exponential, and Cayley encoding) in terms of query complexity and of the cost of their circuit realization. When the difficulty of $f$ is localized in the spectrum, the Cayley encoding reduces the required degree by a factor of three to four, and it represents the shifted resolvent exactly at degree one. For spectral projectors, the standard models cannot reach the target accuracy at fixed degree, because their approximants cannot concentrate resolution near the discontinuity. Realizing the Cayley encoding from a block encoding requires solving a shifted linear system, whose cost offsets its query-complexity gain over the standard models. For structured matrices arising in practice, however, low-depth circuits for the encoding can be constructed directly, and the gain is preserved at the circuit level.", "url": "https://arxiv.org/abs/2610.23429", "type": "理论+数值", "summary": "1. 该工作研究厄米矩阵函数 f(A)b 的量子计算，提出以参数 σ、γ>0 的凯莱变换替代标准量子访问模型，并在广义量子信号处理的单位圆有界洛朗多项式框架下，与块编码和矩阵指数编码比较查询复杂度及线路实现代价。\n2. 其卖点是凯莱编码可将精度集中到 f 在谱上难近似处：困难局域时所需多项式次数降低三至四倍，移位预解式在一阶即可精确表示；而谱投影子在固定阶数下，标准模型因无法在间断附近集中分辨率而达不到目标精度。\n3. 最稳妥的启示是：由块编码实现凯莱编码需解移位线性系统，其代价会抵消查询复杂度收益；但对实际结构化矩阵可直接构造低深度编码线路，从而在电路层面保留增益。", "summary_source": "deepseek", "authors": [{"name": "Gianna M. Del Corso"}], "featured_authors": [{"name": "Gianna M. Del Corso"}], "author_count": 1}, {"id": "2610.23507", "category": "quant-ph", "title": "Solving Large-Scale Parameter Inference in Controllable Nuclear Fusion via Coherent Ising Machines and Block Coordinate Descent", "abstract": "Bayesian inference enables self-consistent plasma parameter inversion in tokamak integrated data analysis by fusing multi-source diagnostics. However, under nonlinear Gaussian likelihoods, finding the maximum a posteriori (MAP) estimate typically relies on sampling methods whose high computational overhead precludes real-time plasma control. To address this bottleneck, we propose a Bayesian inversion framework using a Coherent Ising Machine (CIM)-a quantum computing architecture based on coupled degenerate optical parametric oscillators (DOPOs). With native all-to-all connectivity, the CIM directly maps the negative log-posterior potential onto a spin Hamiltonian and leverages quantum vacuum fluctuations for rapid state-space search during pitchfork bifurcation. Validated on plasma current profile inversion for the EAST tokamak, this method achieves a single-run solution time of approximately 1 ms. Although current qubit limits necessitate a block-wise iterative scheme that prevents full real-time execution today, rapidly scaling quantum hardware offers a clear pathway toward real-time tokamak control.", "url": "https://arxiv.org/abs/2610.23507", "type": "理论", "summary": "1. 该工作提出了结合相干伊辛机与分块坐标下降的贝叶斯反演框架，用于托卡马克多源诊断融合下的等离子体参数推断。\n2. 其核心是将负对数后验势映射为全连接自旋哈密顿量，并利用简并光学参量振荡器在叉式分岔中的量子真空涨落快速搜索，在EAST电流剖面反演中实现约1 ms的单次求解。\n3. 当前量子比特规模限制仍需分块迭代而尚不能完全实时，但量子硬件扩展为走向实时托卡马克控制提供了清晰路径。", "summary_source": "deepseek", "authors": [{"name": "Zijie Liu"}, {"name": "Wenchao Liu"}, {"name": "Wenxin Li"}, {"name": "Anzhe Jiang"}, {"name": "Hongdong Zhu"}, {"name": "Qi Gao"}, {"name": "Yin Ma"}, {"name": "Hai Wei"}, {"name": "Yao Huang"}, {"name": "Yuehang Wang"}, {"name": "Kai Wen"}, {"name": "Jiangang Li"}], "featured_authors": [{"name": "Zijie Liu"}, {"name": "Wenchao Liu"}, {"name": "Wenxin Li"}, {"name": "Yuehang Wang"}, {"name": "Kai Wen"}, {"name": "Jiangang Li"}], "author_count": 12}, {"id": "2610.23560", "category": "quant-ph", "title": "Electrostatic Limits on Quantum Spatial Search", "abstract": "We prove that a quantum walker cannot search a two-dimensional lattice in Grover's $O(\\sqrt N)$ time, resolving the long-standing open question posed by Aaronson and Ambainis in 2003. A walker that hops between neighbouring sites of an $L\\times L$ lattice, $N=L^2$, needs $\\Omega(\\sqrt{N\\log N})$ local steps at least to find a marked vertex, even with unlimited memory and free queries. Hence, Tulsi's algorithm is asymptotically optimal. Our proof rests on a surprising correspondence with classical electrostatics. We treat the marked vertex as a point charge and weight the overlap between the walker's states with and without the mark by the potential drop, which vanishes where queries act. Only local steps change this weighted overlap, at a rate limited by the field energy, so the lower bound is set by the self-potential of the charge. In the plane this self-potential grows logarithmically with system size, like the Coulomb potential, leading to the extra root-logarithmic factor. Several marked vertices turn the charge into a conductor, and the lower bound depends on their arrangement through its capacitance.", "url": "https://arxiv.org/abs/2610.23560", "type": "理论+数值", "summary": "1. 该工作证明二维格点上的量子行走者无法在Grover式O(√N)时间内搜索标记顶点，其局域步数下界为Ω(√(N log N))，并表明Tulsi算法渐近最优。\n2. 其技术卖点是建立与经典静电学的对应：把标记点视为点电荷，以势降加权有/无标记态重叠，下界受场能和电荷自势限制。\n3. 这解决了Aaronson与Ambainis提出的长期开放问题，并揭示多标记顶点可视为导体、其排布通过电容影响下界，为二维空间搜索极限提供明确判据。", "summary_source": "deepseek", "authors": [{"name": "Weikang Li"}], "featured_authors": [{"name": "Weikang Li"}], "author_count": 1}, {"id": "2610.23645", "category": "quant-ph", "title": "Partially isophase electro-magnetic configurations", "abstract": "Separation of variables in Schrödinger equation allows an infinite-dimensional family of physically distinct field configurations that are dynamically indistinguishable in one selected sector, labeled by a conserved quantum number, while differing in all others. We call such a symmetry a partial isophase symmetry. Two main examples are considered: axially symmetric magnetic backgrounds (a rigid spectral flow of the Fock--Darwin oscillator, purely magnetic isophase families, and a two-channel extension) and a Cartesian slab geometry (magnetic barriers in two-dimensional electron gases, treated in the Appendices). We further discuss the consequences of this symmetry for the inverse spectral problem and consider its quasiclassical counterpart.", "url": "https://arxiv.org/abs/2610.23645", "type": "理论", "summary": "1. 该文借助薛定谔方程分离变量，构造出一族无限维、物理上不同但在某一守恒量子数标记的扇区内动力学不可区分的电磁场构型，并称之为部分等相对称性。\n2. 关键贡献在于对轴对称磁场给出福克-达尔文振子的刚性谱流、纯磁等相族与双通道推广，并考察直角板几何中的磁垒及讨论逆谱问题和半经典对应。\n3. 这一结果意味着逆谱重建在部分等相场中本质不唯一，并为设计仅在特定扇区可观测等效的电磁势及半经典分析提供明确启发。", "summary_source": "deepseek", "authors": [{"name": "Andrey M. Pupasov-Maksimov"}], "featured_authors": [{"name": "Andrey M. Pupasov-Maksimov"}], "author_count": 1}, {"id": "2610.23695", "category": "quant-ph", "title": "Recursive Operator Localization and Spectral Gap Descent via the Geometry of Local Spectral Expansion", "abstract": "We introduce Recursive Operator Localization (ROL), a framework for constructing hierarchies of local energy problems linked by linear maps between Hilbert spaces. To address spectral-gap problems, including those arising in quantum systems, we study a realization of ROL by nested subspaces indexed by a weighted simplicial complex. Using spectral gaps of auxiliary classical random walks on links, we propagate geometric estimates upward and use them to turn local spectral gaps at the bottom of the hierarchy into a spectral-gap bound for the global operator. For weighted scalar-valued functions on facets, the ROL decomposition becomes the law of total variance, recovering classical spectral-gap bounds from local link expansion (Alev and Lau, STOC 2020). Moreover, for positive binary spin distributions, conditional influence describes the overlap of the corresponding subspaces, yielding known heat-bath gap bounds from spectral independence (Anari, Liu, and Oveis Gharan, FOCS 2020). The framework also offers a route toward quantum Gibbs sampling, with applications requiring model-specific geometric estimates and energy comparisons.", "url": "https://arxiv.org/abs/2610.23695", "type": "理论", "summary": "1. 该文提出递归算子局域化框架，用希尔伯特空间间的线性映射串联层级化局部能量问题，并以加权单纯复形索引的嵌套子空间给出具体实现。\n2. 其关键在于借助链环上辅助经典随机游走的谱隙逐层传播几何估计，将底层局部谱隙转化为全局算子的谱隙界，并复现Alev和Lau及谱独立性给出的经典界。\n3. 该框架为量子吉布斯采样提供了一条潜在路径，但应用仍需具体模型的几何估计与能量比较。", "summary_source": "deepseek", "authors": [{"name": "Ryu Hayakawa"}], "featured_authors": [{"name": "Ryu Hayakawa"}], "author_count": 1}, {"id": "2610.23834", "category": "quant-ph", "title": "Task-aligned spectral inductive biases in parameterized quantum circuits", "abstract": "Parameterized quantum circuits are widely investigated in quantum machine learning, yet how their architecture can provide task-aligned inductive biases remains poorly understood. We study data reuploading quantum circuits with two distinct inputs: a signal that varies between samples and a fixed, task-defined spectral query that specifies how the signal should be probed. We show that encoding the query can change the circuit's hypothesis class over the signal by modulating how its existing signal frequencies are combined, without introducing new sample-dependent information. This mechanism matches tasks built on nonuniform Fourier transforms, whose evaluation frequencies specify the query and whose sampling positions guide its encoding. We examine this connection in a classification task inspired by synthetic aperture radar, where acquisition geometry determines a query for classifying unfocused spectral patches before image formation. Across small-scale spectral and radar-like tasks, aligned queries improve learning from limited data over parameter-matched circuits with mismatched or absent queries. These results provide a route from known spectral task structure to the design and validation of inductive biases in parameterized quantum circuits.", "url": "https://arxiv.org/abs/2610.23834", "type": "理论+数值", "summary": "1. 该工作研究数据重上传参数化量子电路中，将固定、任务定义的频谱查询与随样本变化的信号分别编码，并在小型频谱与类合成孔径雷达分类任务上检验这种任务对齐归纳偏置。\n2. 其核心在于证明编码查询不会引入新的样本相关信息，而是通过调制电路已有信号频率的组合来改变信号上的假设类，从而对应非均匀傅里叶变换中由查询指定评估频率、由采样位置引导编码的机制。\n3. 结果表明，在有限数据下对齐查询可优于参数匹配但查询缺失或错配的电路，为从已知频谱任务结构出发设计和验证参数化量子电路的归纳偏置提供了可操作路径。", "summary_source": "deepseek", "authors": [{"name": "Felix Frohnert"}, {"name": "Adrián Pérez-Salinas"}, {"name": "Sebastian Lange"}, {"name": "Marcus Schwaebisch"}, {"name": "Evert van Nieuwenburg"}, {"name": "Vedran Dunjko"}], "featured_authors": [{"name": "Felix Frohnert"}, {"name": "Adrián Pérez-Salinas"}, {"name": "Sebastian Lange"}, {"name": "Marcus Schwaebisch"}, {"name": "Evert van Nieuwenburg"}, {"name": "Vedran Dunjko"}], "author_count": 6}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
