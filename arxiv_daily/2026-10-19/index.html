  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);

    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }

    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }

    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }

    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }

    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2610.22385", "category": "cond-mat", "title": "Universal link between structural relaxation and self-diffusion in simple supercooled liquids", "abstract": "Despite a vigorous effort, a comprehensive and satisfactory understanding of the dynamics underlying the glass transition in finite-dimensional systems has not yet emerged. One key hallmark of supercooled liquids approaching the glass transition is the breakdown of the classical Stokes-Einstein (SE) relation, manifested as the decoupling between the self-diffusion coefficient and structural relaxation time, commonly described by a fractional SE relation. Whether and how the fractional SE exponents vary remains an ongoing debate, even for the simplest supercooled liquids. In this work, we numerically establish a universal relation between the self-diffusion coefficient and structural relaxation time by introducing characteristic scales that are revealed under the condition of constant dynamical heterogeneity. Moreover, this universal relation could also capture literature data for supercooled water and silica. Remarkably, we find that the fractional SE exponent is invariant across various supercooled liquids studied spanning a wide range of fragility, thereby challenging the prevailing view that the fractional SE exponent is correlated with fragility. Our study demonstrates that investigating dynamical heterogeneity yields more valuable insights into understanding glassy dynamics than expected.", "url": "https://arxiv.org/abs/2610.22385", "type": "理论+数值", "summary": "1. 该工作通过引入在恒定动力学不均匀性条件下提取的特征尺度，数值建立了简单过冷液体中自扩散系数与结构弛豫时间之间的普适关系，并用于水与二氧化硅的文献数据。\n2. 其核心卖点在于发现分式Stokes-Einstein指数在所研究的宽脆性范围内保持不变，从而挑战该指数与脆性相关的流行观点，并凸显动力学不均匀性对理解玻璃态动力学的价值。\n3. 这一结果提示，以动力学不均匀性为组织变量可统一描述过冷液体的输运—弛豫耦合，并为检验不同玻璃形成体系的普适性与脆性关联提供明确方向。", "summary_source": "deepseek", "authors": [{"name": "Mingyu Zhu"}, {"name": "Xinyu Chang"}, {"name": "Licun Fu"}, {"name": "Yiming Zheng"}, {"name": "Lijin Wang"}], "featured_authors": [{"name": "Mingyu Zhu"}, {"name": "Xinyu Chang"}, {"name": "Licun Fu"}, {"name": "Yiming Zheng"}, {"name": "Lijin Wang"}], "author_count": 5}, {"id": "2610.22386", "category": "cond-mat", "title": "Noise-Induced Restoration of Entropy Concavity Near Gaussian Equilibrium", "abstract": "We study a quantitative form of noise-induced restoration of entropy concavity for one-dimensional nonequilibrium states relaxing toward a Gaussian thermal equilibrium. A partially thermalized state is modeled by $X_q=\\sqrt q\\,X+\\sqrt{1-q}\\,G$, where $G$ is Gaussian equilibrium noise and $q$ is the retained signal fraction. For two independently prepared copies we ask when the entropy of the mixed state $h(\\sqrt{1-t}\\,X_q+\\sqrt t\\,Y_q)$ is concave in the mixing parameter. The problem is motivated by entropy geometry along Ornstein--Uhlenbeck/Fokker--Planck relaxation, where the relative score is the nonequilibrium thermodynamic force and relative Fisher information is entropy-production rate. We derive an exact symmetric endpoint-curvature formula, separating a nonnegative Ornstein--Uhlenbeck restoring term from a fourth-cumulant correction, and extend it to nonsmooth generalized-Gaussian states $e^{-a|x|^p}$ for $p>3/2$. For half thermalization of a symmetric log-concave input, posterior-variance identities give a quantitative outer-region theorem confining any endpoint obstruction to two explicitly bounded near-equilibrium sectors. We also give spectral and MMSE reformulations of the auxiliary inequality $A\\ge2\\delta$, prove it in an explicit nonlinear neighborhood of Gaussian equilibrium, and show how it sharpens the endpoint bounds. The main all-mixing result concerns the leading symmetric non-Gaussian Hermite mode: for $p_a=\\phiG(1+a\\He_4)$, $0<a\\le10^{-2}$, we prove strict entropy concavity for every $0<t<1$ and every $0<q\\le5/8$, hence throughout the currently unresolved symmetric range $0<q\\le4/7$ for this explicit nonequilibrium family. Numerical searches over broader log-concave families are reported only as supporting evidence.", "url": "https://arxiv.org/abs/2610.22386", "type": "理论+数值", "summary": "1. 该工作研究一维非平衡态向高斯热平衡弛豫时噪声诱导的熵凹性恢复，以部分热化态 \\(X_q=\\sqrt q X+\\sqrt{1-q}G\\) 的两拷贝混合熵关于混合参数的凹性为判据。\n2. 其核心贡献是给出精确的对称端点曲率公式，将非负 Ornstein–Uhlenbeck 回复项与四阶累积量修正分离，并推广至 \\(p>3/2\\) 的广义高斯态、半热化对数凹输入的外区定理及谱/MMSE 重构。\n3. 最稳妥的意义是对领头对称非高斯 Hermite 模式在 \\(0<a\\le10^{-2}\\) 时证明 \\(0<t<1\\)、\\(0<q\\le5/8\\) 的严格熵凹性，从而覆盖当前未解决的对称范围 \\(0<q\\le4/7\\)，为弛豫熵几何提供明确基准。", "summary_source": "deepseek", "authors": [{"name": "Fayez Abu-Ajamieh"}], "featured_authors": [{"name": "Fayez Abu-Ajamieh"}], "author_count": 1}, {"id": "2610.22391", "category": "cond-mat", "title": "Thermodynamics of coupled electromagnetic and mass fields", "abstract": "We formulate a unified thermodynamic framework for chemical, mechanical, and electromagnetic transport by extending the Gibbs--Duhem relation to include kinetic free-energy contributions associated with material and field motion. The resulting kinetic Gibbs--Duhem relation establishes a thermodynamic connection between free-energy variations, generalized chemical potentials, pressure, and transport momentum, while preserving the invariance of the system free energy under changes of reference frame. Within a Lagrangian formulation of free-energy evolution, the relation provides a common structure for diffusion, momentum transport, and electromagnetic dynamics. For nonuniform chemical systems, the framework recovers the coupling between Cahn--Hilliard dynamics and the Korteweg stress arising from composition gradients. Its extension to electromagnetic systems incorporates electric, magnetic, charge, and mechanical contributions into the same thermodynamic formulation, yielding a unified description of electromagnetic and momentum evolution. The framework further separates dissipative from nondissipative transport and establishes a common thermodynamic form for mechanical and electromagnetic propagation. In the isentropic limit, the characteristic propagation velocity is determined by the derivative of the thermodynamic pressure with respect to density, yielding the speed of sound for mechanical systems and the speed of light for electromagnetic systems. These results show that kinetic contributions can be incorporated consistently into the Gibbs--Duhem framework, providing a common thermodynamic basis for coupled chemical, mechanical, and electromagnetic transport without introducing separate thermodynamic principles for each mechanism.", "url": "https://arxiv.org/abs/2610.22391", "type": "理论", "summary": "1. 该文将物质与场运动的动能自由能项纳入Gibbs–Duhem关系，建立化学、力学与电磁输运的统一热力学框架。\n2. 其核心是动能Gibbs–Duhem关系联系自由能变分、广义化学势、压力与输运动量并保持参考系不变，且在Lagrangian表述下统一扩散、动量输运与电磁动力学，并恢复Cahn–Hilliard动力学与Korteweg应力耦合及区分耗散/非耗散输运。\n3. 等熵极限下传播速度由压力对密度导数决定，分别给出声速与光速，表明耦合输运可由共同热力学基础描述而无需各设独立原理。", "summary_source": "deepseek", "authors": [{"name": "Fei Wang"}], "featured_authors": [{"name": "Fei Wang"}], "author_count": 1}, {"id": "2610.22414", "category": "cond-mat", "title": "Semiclassical Analysis of Wave Dynamics via Wigner Transforms: Applications to the Quantum Harmonic, Anharmonic, and Dirac Oscillator", "abstract": "In this Master's thesis, we give a pedagogical introduction to the semiclassical analysis of wave dynamics in single-band and multi-band systems. We show how the semiclassical evolutions of Wigner functions can approximate the dynamics of wave packet centers and wave packet deformations. Three systems of increasing complexity are considered: the quantum harmonic oscillator and the quantum anharmonic oscillator as single-band systems, and the Dirac oscillator as a two-band system. We explain the origins of the first-order semiclassical corrections (Moyal, Littlejohn-Flynn, and Berry) in the equations of motion and examine their effects on predictive accuracy. Another focus is set on the conditions for validity of the semiclassical analysis. For both the quantum anharmonic and the Dirac oscillators, a dimensionless parameter controlling the accuracy of the approximation is identified. In multi-band systems, the formalism applies only to states within a single adiabatic subspace, which, for the Dirac oscillator, corresponds to an energy branch. This motivates the construction of single-branch almost coherent states: approximately Gaussian wave packets formed by superpositions of states from a single energy branch. Their centers undergo oscillations with an aperiodic envelope. These states enable comparison between semiclassical Wigner function evolution and the commonly used Sundaram-Niu formalism. We show that semiclassical Wigner function evolution captures deformation-related dynamics, including the initial decay of oscillations, which the Sundaram-Niu formalism cannot describe by construction. Additionally, exact quantum evolution reveals partial relocalization of these single-branch almost coherent states, a phenomenon that cannot be captured by the semiclassical evolution.", "url": "https://arxiv.org/abs/2610.22414", "type": "理论", "summary": "1. 该硕士论文以Wigner变换为工具，对单带与多带波动力学作半经典分析，并以量子谐振子、非谐振子和狄拉克振子为逐级复杂的示例，考察波包中心与形变的半经典近似。\n2. 其技术要点是追溯Moyal、Littlejohn-Flynn与Berry一阶修正的来源，识别控制近似精度的无量纲参数，并构造单能支近相干态以比较Wigner演化与Sundaram-Niu形式，显示前者能描述后者构造上无法刻画的形变相关动力学（含振荡初始衰减）。\n3. 精确量子演化呈现半经典图像遗漏的部分重局域化，这既界定了多带单绝热子空间近似的适用边界，也为改进半经典波包方法提供了明确检验基准。", "summary_source": "deepseek", "authors": [{"name": "August Burg"}], "featured_authors": [{"name": "August Burg"}], "author_count": 1}, {"id": "2610.22473", "category": "cond-mat", "title": "Anyon bound states in MoTe$_2$ Fractional Chern Insulators", "abstract": "Binding anyons to optically active excitons offers a route to manipulate fractional excitations and reveal the internal spatial structure of anyons. We establish the formation of anyon bound states between a mobile dipolar exciton and an $e/3$ quasihole in a twisted bilayer MoTe$_2$ fractional Chern insulator. Using exact diagonalization of a continuum-based interacting model, we identify a regime of meV-scale binding and strong exciton-quasihole entanglement controlled by exciton mobility and the distance between the exciton and the FCI. Spatial correlations resolve a localized depletion core carrying approximately $e/3$ charge around the exciton, providing a real-space characterization of the bound state. Beyond its fractional charge, the quasihole exhibits a moiré-induced octupolar structure. Interlayer tunneling anisotropy strongly deforms this structure while leaving the enclosed charge nearly unchanged, linking the internal profile of the anyon to the underlying electronic quantum geometry. These findings establish conditions for robust exciton-anyon binding in moiré heterostructures and show how these composites provide access to properties of fractional excitations beyond their total charge.", "url": "https://arxiv.org/abs/2610.22473", "type": "理论+数值", "summary": "1. 该工作在连续介质相互作用模型的精确对角化框架下，研究扭转双层MoTe2分数陈绝缘体中可移动偶极激子与e/3准空穴形成的任意子束缚态。\n2. 其技术卖点是给出meV量级结合能与强激子—准空穴纠缠，并通过空间关联分辨出携带约e/3电荷的局域耗尽核，同时揭示准空穴具有莫尔势诱导的八极结构且层间隧穿各向异性可在几乎不改变包围电荷的情况下强烈形变该结构。\n3. 这确立了莫尔异质结中稳健激子—任意子结合的条件，并表明此类复合体可用于探测分数激发超出总电荷的内部结构与量子几何信息。", "summary_source": "deepseek", "authors": [{"name": "Tianhong Lu"}, {"name": "Luiz H. Santos"}], "featured_authors": [{"name": "Tianhong Lu"}, {"name": "Luiz H. Santos"}], "author_count": 2}, {"id": "2610.22486", "category": "cond-mat", "title": "Comment on \"Skyrmion Hall Effect in Altermagnets\"", "abstract": "In their Letter, Jin et al. [Phys. Rev. Lett. 133, 196701 (2024)] predict a transverse velocity $v_y$ for skyrmions driven by spin-transfer torque (STT), known as skyrmion Hall effect (SkHE), in d-wave altermagnets. Usually, the SkHE emerges from the skyrmion's topological charge which here cancels between sublattices. Instead, Jin et al. attribute the SkHE to the dimensionless quadrupole tensor $A_{ij}$. The result in their Eq. (12) is fitted to micromagnetic simulations, yielding a finite value for $A_{xy}$. However, via the divergence theorem, $A_{ij}$ simplifies to a boundary integral that vanishes for a sufficiently smooth and localized texture. In this Comment, we substantiate our claim from Ref. [2] that the numerically observed SkHE by Jin et al. for a micromagnetic model with standard Zhang-Li STT in the individual sublattices is merely a discretization artefact.", "url": "https://arxiv.org/abs/2610.22486", "type": "理论+数值", "summary": "1. 该评论重新审视了Jin等人在d波交错磁体中由自旋转移矩驱动斯格明子横向速度、即斯格明子霍尔效应的预言，并指出其归因于四极张量A_ij的机制不成立。\n2. 其核心论据是利用散度定理将A_ij化为边界积分，对足够光滑且局域的织构该积分消失，因而拟合得到的有限A_xy缺乏连续极限支撑，标准Zhang-Li自旋转移矩下数值观察到的效应只是离散化伪影。\n3. 这提醒交错磁体中斯格明子输运研究需严格检验离散化与边界项，并在亚晶格分辨的连续模型里重新确认霍尔效应来源后再讨论四极张量机制。", "summary_source": "deepseek", "authors": [{"name": "Nicolai Timon Bechler"}, {"name": "Jan Masell"}], "featured_authors": [{"name": "Nicolai Timon Bechler"}, {"name": "Jan Masell"}], "author_count": 2}, {"id": "2610.22500", "category": "cond-mat", "title": "Quantum-interference correction to conductivity in disordered electronic bands with non-uniform quantum geometry", "abstract": "Weak localization in two-dimensional disordered electron systems originates from constructive interference between time-reversed scattering paths, giving rise to a logarithmically divergent quantum-interference correction to the dc conductivity. This behavior is generally suppressed when time-reversal symmetry (TRS) is broken. In this study, using a band-projected framework motivated by spin- and valley-polarized rhombohedral $N$-layer graphene (RNG), we show that nonuniform quantum geometry can qualitatively modify quantum-interference corrections to dc transport. In particular, continuously tuning the quantum geometry can change the sign of the conductivity correction, corresponding to a crossover between localization and antilocalization tendencies. Remarkably, at special values of the parameter controlling the quantum geometry, weak-localization (WL) or weak-antilocalization (WAL) can re-emerge despite broken microscopic TRS. At these special points, the orbital structure of the Bloch states gives rise to an emergent antiunitary symmetry that protects a gapless Cooperon mode and restores the logarithmically divergent quantum-interference correction characteristic of WL or WAL. Our results establish nonuniform quantum geometry as a mechanism for controlling quantum interference and electron localization in multiorbital electronic systems.", "url": "https://arxiv.org/abs/2610.22500", "type": "理论", "summary": "1. 该工作基于受自旋/谷极化菱面体N层石墨烯启发的带投影框架，研究无序多轨道电子带中非均匀量子几何对直流电导量子干涉修正的影响。\n2. 其卖点在于连续调节量子几何可翻转电导修正符号并实现局域化—反局域化转变，且在特殊参数点即使微观时间反演对称性破缺，布洛赫态轨道结构诱导的涌现反幺正对称性仍保护无隙库珀子模式、恢复对数发散修正。\n3. 这确立非均匀量子几何作为多轨道电子系统中调控量子干涉与电子局域化的机制，并为菱面体N层石墨烯等平台的输运研究提供启示。", "summary_source": "deepseek", "authors": [{"name": "Yip Chun Wong"}, {"name": "Asimpunya Mitra"}, {"name": "Yong Baek Kim"}], "featured_authors": [{"name": "Yip Chun Wong"}, {"name": "Asimpunya Mitra"}, {"name": "Yong Baek Kim"}], "author_count": 3}, {"id": "2610.22510", "category": "cond-mat", "title": "Magnetic flux ring splitting near a Navier-Stokes singularity", "abstract": "OpenAI reports a forced Navier-Stokes flow that becomes singular in finite time, raising the question of its physical consequences. Magnetic reconnection offers a test through the splitting and merging of flux structures. We use resistive magnetohydrodynamics to simulate a magnetic ring driven by an imposed, regularized flow that reproduces the geometry and scaling of the collapsing core. At the nominal singular time, we remove the imposed drive and allow the system to evolve freely. Reconnections before and after release split the ring into two or more daughter rings through bifurcations of the poloidal flux function, with Lorentz feedback selecting the bifurcation type. Unequal winding by the swirl above and below the midplane produces asymmetric toroidal magnetic stresses, unfolding the kinematic pitchfork-like transition into a fold. For single-island splits, the cusp normal form predicts the asymmetry of the daughter rings without adjustable parameters. Three-dimensional simulations retain the splits and merger, confirming that approach to hydrodynamic blow-up can trigger magnetic restructuring.", "url": "https://arxiv.org/abs/2610.22510", "type": "理论+数值", "summary": "1. 该工作用电阻磁流体力学模拟受迫纳维-斯托克斯流有限时间奇点附近的磁环，并在标称奇点时刻撤去驱动后自由演化。\n2. 磁重联使环经极向磁通函数分岔裂成多个子环，洛伦兹反馈选择分岔类型；上下旋涡不对称绕数导致环向磁应力不对称，将运动学叉式分岔展开为折叠分岔，单岛分裂的尖点规范型无参数预测子环不对称性。\n3. 三维模拟保持分裂与并合，表明趋近流体力学爆炸可触发磁场重构，为奇点物理后果提供可检验的磁重联判据。", "summary_source": "deepseek", "authors": [{"name": "Antti J. Niemi"}], "featured_authors": [{"name": "Antti J. Niemi"}], "author_count": 1}, {"id": "2610.22585", "category": "cond-mat", "title": "Bulk-Defect Correspondence in Algebraic Classical Spin Liquids", "abstract": "Local constraints in algebraic classical spin liquids give rise to singular momentum-space correlations. This so called pinch-point singularity carries a momentum-space winding number that determines the low-energy structure of the algebraic spin liquid. We show that nonmagnetic vacancies in two dimensions reveal this topological invariant in the real-space winding of the surrounding spin textures. Under explicit conditions, we prove this bulk-defect correspondence for rank-$n$ $\\mathrm{U}(1)$ spin liquids and verify it numerically for the Coulomb spin liquids of the kagome and checkerboard lattices and the rank-2 $\\mathrm{U}(1)$ spin liquid of the honeycomb-snowflake model. In this way we show that vacancies can be used as general probes for distinguishing the emergent gauge theories of strongly correlated classical disordered magnets.", "url": "https://arxiv.org/abs/2610.22585", "type": "理论+数值", "summary": "1. 该工作提出并证明非磁性空位可通过其周围自旋织构的实空间绕数，揭示代数经典自旋液体中动量空间捏点奇点所携带的绕数拓扑不变量。\n2. 其核心卖点是在明确条件下对秩-n U(1)自旋液体建立体-缺陷对应，并在笼目、棋盘格库仑自旋液体及蜂窝雪花模型秩-2 U(1)自旋液体中数值验证。\n3. 这表明空位可作为区分强关联经典无序磁体涌现规范理论的通用探针，并为后续以缺陷诊断自旋液体拓扑结构提供可操作思路。", "summary_source": "deepseek", "authors": [{"name": "Rafael Flores-Calderón"}], "featured_authors": [{"name": "Rafael Flores-Calderón"}], "author_count": 1}, {"id": "2610.22590", "category": "cond-mat", "title": "Segregation of cylindrically confined cross-linked polymers", "abstract": "Entropic repulsion between polymer chains under confinement in a narrow channel tends to induce segregation. Recent computer simulation studies have provided indirect evidence that internal cross linking of ring polymers, which creates internal loops, enhances the entropic force. Such topologically enhanced entropic forces are thought to contribute to the segregation of bacterial chromosomes during replication. In this study, we use Monte Carlo computer simulations of a coarse-grained hard-sphere chain model to measure the configurational free energy of two cross-linked ring polymers as a function of the separation distance between the polymer centers of mass. We examine the effects of varying the polymer architecture as well as the confinement dimensions on the free energy functions. In addition, we use the results to make a quantitative assessment of the accuracy of a simple theoretical model built on the de Gennes blob model that has been used in past studies to estimate the overlap free energy of confined polymers. Consistent with indirect evidence from previous simulations studies of segregation dynamics, we find that increasing the number of internal loops and selecting binding sites to enforce a side-loop configuration tends to increase the overlap free energy. Analysis of the whole-polymer and interior-loop extension and overlap lengths reveal a sequence of overlap domains that explain subtle variations in the free energy functions. For all architectures examined, the theoretical model provides a reasonably accurate prediction for how the cross linking and degree of confinement affects the free energy, with quantitative discrepancies comparable to those observed in previous studies using linear polymers and ring polymers without cross links.", "url": "https://arxiv.org/abs/2610.22590", "type": "理论+数值", "summary": "1. 该工作用粗粒化硬球链模型的蒙特卡洛模拟，测量圆柱受限下两个交联环状聚合物的构型自由能随质心间距的变化，并系统改变链结构与受限尺寸。\n2. 其核心结果是增加内部环及采用侧环绑定位点会增强重叠自由能，且自由能细微变化可由整体与内环伸展及重叠长度所划分的重叠区域解释，同时定量检验了德热纳团块模型的精度。\n3. 这为拓扑增强熵力参与复制过程中细菌染色体分离的假说提供了更直接的定量支持，并为受限交联聚合物理论模型的适用边界提供了可检验基准。", "summary_source": "deepseek", "authors": [{"name": "James M. Polson"}, {"name": "Tyler M. Dickieson"}, {"name": "Matthew R. O'Connell"}], "featured_authors": [{"name": "James M. Polson"}, {"name": "Tyler M. Dickieson"}, {"name": "Matthew R. O'Connell"}], "author_count": 3}, {"id": "2610.22611", "category": "cond-mat", "title": "Zeta potential of magnetic-field-controlled silver nanoparticles", "abstract": "Magnetic-field-dependent nanoparticle size does not by itself determine zeta potential, which also depends on interfacial charge, electrolyte screening, and the location of the slipping plane. We extend the sphere-packing description of silver nanoparticles by distinguishing the structural surface, the effective charge plane, and the hydrodynamic slipping plane. The model uses structural radii of \\SI{20}{nm} and \\SI{5}{nm} at zero field and \\SI{250}{mT}, with reported zeta potentials of \\SI{-13.2}{mV} and \\SI{-10.0}{mV}. Effective charge is related to the defective-shell atom count. For field-independent interfacial parameters, the linear response without additional charge weighting decreases with decreasing radius. Its normalized form depends on three electrokinetic lengths through only two sums, preventing their independent determination from a field-dependent zeta curve. At \\((\\kappa^{-1},t_{\\mathrm{lig}},\\delta_{\\mathrm{slip}})=(3,0,1)\\,\\mathrm{nm}\\), nonlinear Poisson--Boltzmann electrostatics changes the fitted shell coefficient from 0.316 to 0.299. Constant total charge still predicts an increase in zeta magnitude, opposite to the observed trend in the evaluated scenarios. Independently calibrated shell and area charge laws differ by less than \\SI{0.05}{mV}, so the endpoint agreement does not distinguish these mechanisms. Propagating the initial size frequencies gives a narrower endpoint size distribution than measured. With charge parameters determined from the measured size populations, its predicted mean zeta potential is \\SI{-9.131}{mV}, with standard deviation \\SI{0.994}{mV}. Imposing the measured mean by charge recalibration does not remove the discrepancy in size width. The combined structural and electrokinetic model thus identifies both the size-dependent contribution to zeta potential and the interfacial information needed to interpret it.", "url": "https://arxiv.org/abs/2610.22611", "type": "理论+数值", "summary": "1. 该工作将磁场调控银纳米颗粒的球堆积模型扩展为结构表面、有效电荷面与流体滑移面三层描述，并用20/5 nm结构半径和−13.2/−10.0 mV的ζ电位检验粒径与界面电荷的耦合。\n2. 其卖点是将有效电荷与缺陷壳层原子数关联，并指出场无关界面参数下归一化ζ响应仅由三个电动长度的两个和决定，故单条场依赖曲线不能独立反演这些长度；非线性泊松–玻尔兹曼静电使拟合壳层系数由0.316变为0.299。\n3. 该框架可分解粒径对ζ电位的贡献并指明解释所需界面信息，但恒定总电荷预测的ζ幅值增大与观测相反，且端点吻合不足以区分壳层与面积电荷律，后续需独立界面标定和更完整粒径分布。", "summary_source": "deepseek", "authors": [{"name": "Y. Tawalbeh"}, {"name": "M.F. Pereira"}], "featured_authors": [{"name": "Y. Tawalbeh"}, {"name": "M.F. Pereira"}], "author_count": 2}, {"id": "2610.22642", "category": "cond-mat", "title": "Physics-Informed Machine Learning for Response Tensors in Crystalline Magnets: Application to Kagome Metals", "abstract": "The prediction of response tensors from magnetic textures is a crucial challenge in the study of noncollinear magnets. Existing methods for constructing descriptors of a given response tensor are limited to first-order multipole expansions or restricted to simple magnetic structures. In this work, we construct a complete symmetry-invariant descriptor basis for arbitrary crystal structures and magnetic textures, providing interpretable features for machine learning modeling of response tensors. We modify the standard principal component analysis framework and derive uncorrelated order parameters that are hierarchically stable: extending the order parameter space to include higher-degree spin order introduces additional order parameters that are uncorrelated to the previous ones. We apply this framework to regression and classification of the anomalous Hall conductivity (AHC) in a magnetic kagome lattice. In particular, in the regime where AHC is well modeled by linear regression of the symmetry-invariant order parameters, we find that the squared regression coefficients, ranked by their magnitude, obey a Zipf-like power law: $\\beta_{r}^2 \\propto r^{-\\alpha}$. Our method provides a systematic route to construct interpretable order parameters of all spin orders that connect the symmetry of a magnetic crystal to its response tensors.", "url": "https://arxiv.org/abs/2610.22642", "type": "理论+数值", "summary": "1. 该工作为任意晶体结构与磁织构构建了完备的对称不变量描述符基，并将其用于磁响应张量的可解释机器学习建模及磁性笼目晶格中反常霍尔电导的回归与分类。\n2. 其技术卖点在于改进主成分分析框架，导出层级稳定的不相关序参量：引入更高阶自旋序所增序参量与已有者不相关，并在线性回归区发现回归系数平方按幅值排序呈齐普夫型幂律。\n3. 这为系统构造覆盖各阶自旋序的可解释序参量、连接磁晶体对称性与响应张量提供了路径，并可启发非共线磁体和笼目金属的机器学习建模。", "summary_source": "deepseek", "authors": [{"name": "Yu-Hsuan Lin"}, {"name": "Joel E. Moore"}], "featured_authors": [{"name": "Yu-Hsuan Lin"}, {"name": "Joel E. Moore"}], "author_count": 2}, {"id": "2610.22799", "category": "cond-mat", "title": "Generalized length-gauge time-dependent Liouville equation", "abstract": "The length-gauge (LG) time-dependent Liouville equation is a major workhorse to simulate ultrafast dynamics. The equation features the commutator between the density operator $\\hat{\\rho}$ and the position operator ${\\bf r}$, $\\langle n{\\bf k}|[{\\bf r},\\hat{\\rho}]|m{\\bf k}'\\rangle$, where $|n{\\bf k}\\rangle$ and $|m{\\bf k}'\\rangle$ are Bloch states for bands $n$ and $m$ at crystal momenta ${\\bf k}$ and ${\\bf k}'$, respectively. This commutator has two irreconcilable versions: Kohn and Luttinger (Phys. Rev. ${\\bf 108}$, 590 (1954)) have two partial derivatives with respect to ${\\bf k}$ and ${\\bf k}'$, but Aversa and Sipe (AS) (Phys. Rev. B ${\\bf 52}$, 14636 (1995)) have one partial derivative and one Dirac delta. For several decades, this outstanding discrepancy has received little attention. Here, we show that the generalized LG time-dependent Liouville equation has two partial derivatives, but no Dirac delta. Physically, the ${\\bf k}$-off-diagonal matrix elements of the position operator provide a channel by which the electric field generates ${\\bf k}$-off-diagonal matrix elements for $\\hat{\\rho}$ in LG. The discrepancy emerges when the position matrix is assumed to be diagonal in ${\\bf k}$. Consequently the AS' equation is a limiting case of our generalized Liouville equation, where the relative momentum ${\\bf Q}$ between two states is ignored. Our numerical test reveals that the ${\\bf k}$-diagonal formalism yields qualitatively different results and underestimates both energy absorption and polarization by a factor of 7. Our study establishes a general formalism for the length-gauge time-dependent Liouville equation and opens the door for future research on the ultrafast time scale, while prior results based on the ${\\bf k}$-diagonal only equation may need to be revisited.", "url": "https://arxiv.org/abs/2610.22799", "type": "理论+数值", "summary": "1. 该工作推导了推广的长度规范含时刘维尔方程，以澄清科恩-卢廷格与阿韦尔萨-西佩在位置算符对易子上的长期分歧。\n2. 其关键在于保留位置算符的波矢非对角矩阵元，证明方程应含两个波矢偏导而无狄拉克δ项，并表明阿韦尔萨-西佩方程只是忽略相对动量的极限情形。\n3. 数值检验表明仅取波矢对角的形式会给出定性错误并把能量吸收与极化低估约七倍，故该推广形式适用于超快动力学并提示既有相关结果需重审。", "summary_source": "deepseek", "authors": [{"name": "G. P. Zhang"}, {"name": "M. S. Si"}], "featured_authors": [{"name": "G. P. Zhang"}, {"name": "M. S. Si"}], "author_count": 2}, {"id": "2610.22850", "category": "cond-mat", "title": "Interplay between high-entropy effects and the superionic transition in fluorite oxides: A liquid-like perspective", "abstract": "Minor actinide (MA)-bearing mixed oxide (MOX), a prominent high-entropy ceramic (HEC), is a promising candidate for advanced fast reactor fuels. Using a hybrid Monte Carlo/Molecular Dynamics (MC/MD) approach, we reveal that Np and Am segregation establishes a distinct short-range order (SRO) that induces severe lattice distortion. We uncover a competitive mechanism between localized high-entropy blocking effects and collective superionic dynamics, where the anionic kinetic and structural evolution within the 2000-2800 K range is partitioned and governed by the Tammann crossover temperature and superionic transition temperature. In the low-temperature regime, severe lattice distortions induced by the SRO structures create localized electrostatic and strain-coupled potential wells, which spatially confine the O-ions and lead to their sluggish diffusion. The system exhibits increased dynamical heterogeneity as thermal activation alleviates these structural constraints. Crucially, these localized traps spontaneously transform into a highly interconnected, string-like polyhedral topological network. Driven by the maximization of configurational entropy, this structural change creates low-viscosity transport pathways that trigger confinement-enhanced diffusion. Consequently, a dramatic kinetic inversion occurs, where the O-ion mobility of SRO model surpasses that of random solid solution (RSS) model via an entropy-driven compensation mechanism. Finally, through Gibbs free energy minimization and defect analysis, structural and thermodynamic origins of the superionic transition in HEC are elucidated. This study unveils how local chemical ordering regulates ion transport under extreme conditions, providing theoretical support for the design of high-performance nuclear fuels with both superior radiation tolerance and optimized mass transfer capabilities.", "url": "https://arxiv.org/abs/2610.22850", "type": "理论+数值", "summary": "1. 采用混合Monte Carlo/分子动力学方法，揭示含Np/Am的高熵萤石氧化物中短程有序诱导的严重晶格畸变及其与超离子转变的耦合。\n2. 其核心在于阐明局域高熵阻塞与集体超离子动力学的竞争：氧离子在2000–2800 K内由局域静电/应变陷阱中的缓慢扩散，转变为由构型熵最大化驱动的互联链状多面体网络和低黏度通道，并出现SRO迁移率反超RSS的熵驱动补偿。\n3. 结合Gibbs自由能最小化与缺陷分析，该工作给出高熵陶瓷超离子转变的结构与热力学起源，为兼顾抗辐照与优化传质的高性能核燃料设计提供理论依据。", "summary_source": "deepseek", "authors": [{"name": "Fengnian Zhuang"}, {"name": "Gaosheng Yan"}, {"name": "Hong Chen"}, {"name": "Yi Zhang"}, {"name": "Wenshan Yu"}, {"name": "Minglong Xu"}, {"name": "Shengping Shen"}], "featured_authors": [{"name": "Fengnian Zhuang"}, {"name": "Gaosheng Yan"}, {"name": "Hong Chen"}, {"name": "Wenshan Yu"}, {"name": "Minglong Xu"}, {"name": "Shengping Shen"}], "author_count": 7}, {"id": "2610.22888", "category": "cond-mat", "title": "Adaptive Crack-Tip Localization of Phase-Field Fracture Computations", "abstract": "Phase-field models of fracture provide a unified framework for simulating crack nucleation and propagation, but their computational cost remains high because the governing equilibrium and phase-field equations are typically iteratively solved over the entire domain at every staggered iteration. We present an extension of the recently developed adaptive mesh refinement and coarsening framework that localizes not only spatial resolution but also repeated solution effort to a small active patch around the crack tip for linear elastic brittle materials. The inactive exterior is eliminated through a Schur complement and condensed onto the patch interface, and its factorization is reused as long as the patch remains fixed. The phase field is frozen in the exterior, introducing only a small approximation in the crack wake. The method is implemented in FEniCSx and evaluated for quasi-static crack propagation, dynamic crack branching, three-dimensional mixed-mode crack growth, and coalescence of multiple cracks in a unit cell. Across these problems, the condensed formulation reproduces the reference solutions with differences in global quantities below 0.5%, while substantially reducing the number of active degrees of freedom. In the quasi-static surfing problem, wall time speedups increase from 6.9 to 22.8 as the domain size is doubled, demonstrating increasing computational advantage for large-scale phase-field fracture simulations.", "url": "https://arxiv.org/abs/2610.22888", "type": "理论+数值", "summary": "1. 该工作把自适应网格加密/粗化框架扩展至相场断裂，只在裂纹尖端附近活性区反复求解，并以舒尔补凝聚外部非活性域、复用其分解。\n2. 其卖点是冻结外部相场并将界面凝聚，显著减少活跃自由度；在准静态、动态分叉、三维混合模式和多裂纹合并算例中，全局量误差低于0.5%。\n3. 域尺寸加倍时准静态冲浪问题的墙钟加速比由6.9升至22.8，显示该方法对大规模相场断裂模拟具有可扩展优势，并提示需评估裂纹尾迹冻结近似。", "summary_source": "deepseek", "authors": [{"name": "Aarosh Dahal"}, {"name": "Aditya Kumar"}], "featured_authors": [{"name": "Aarosh Dahal"}, {"name": "Aditya Kumar"}], "author_count": 2}, {"id": "2610.22965", "category": "cond-mat", "title": "Kitaev, semi-Dirac, and spinon quantum spin Hall liquids on the square-hexagon-dodecagon lattice: A parent projective symmetry group classification", "abstract": "The square-hexagon-dodecagon (SHD) lattice hosts an exactly solvable Kitaev spin liquid, while further-neighbor couplings frustrate its Heisenberg magnet into classically degenerate lines where quantum fluctuations can melt the Néel order. To place this state among the lattice's spin liquids, we classify fermionic parton mean-field states with singlet and spin-orbit-coupled triplet amplitudes by their projective symmetry groups (PSGs). As SHD sites lack site symmetry, its $Z_2$ PSGs are the projective classes of $p6mm$ with time reversal, from which those of every single-orbit $p6mm$ lattice follow. In the idealized Kitaev model, where lattice operations do not rotate spins, these liquids carry a single $Z_2$ PSG descending from the $SU(2)$ Lieb-flux state, and their projections are exact eigenstates. The PSG's sixfold-rotation sign, fixed by the dodecagon flux, doubles all Majorana bands, and the mirrors exclude a chiral phase in any uniform field, so only a sublattice-staggered three-spin term drives the non-Abelian Ising phase. Beyond the Kitaev state, we find a critical semi-Dirac spin liquid, with mean-field correlations $\\propto r^{-3}$ along three directions and $r^{-6}$ otherwise, and extended Dirac phases with up to $48$ fermion flavors, among them an $N_f=12$ state whose PSG forbids every singlet mass. Out-of-plane Dzyaloshinskii-Moriya couplings gap the Dirac states of its $U(1)$ class into a mean-field spinon counterpart of the Kane-Mele quantum spin Hall insulator, with spin Chern number $1$ or $3$ and spin-carrying monopoles. Chiral states imply Kalmeyer-Laughlin, semion$\\times$semion, and three-fermion orders, rotation-breaking ones show $q\\to -q$ asymmetric neutron spectra, and sign-alternating fluxes break time reversal alone. Masses and monopoles in these many-flavor phases and the energetics of frustrated SHD Heisenberg models are natural next steps.", "url": "https://arxiv.org/abs/2610.22965", "type": "理论", "summary": "1. 该工作按投影对称群分类了正方-六边-十二边形晶格上单态与自旋轨道耦合三重态振幅的费米子部分子平均场自旋液体。\n2. 技术核心是SHD格点无格点对称，使Z2 PSG由p6mm与时间反演的投影类决定；十二边形通量固定六重旋转符号并双重化马约拉纳带，镜像排除均匀场手性相。\n3. 由此给出半狄拉克自旋液体、最多48味狄拉克相及面外DM耦合诱导的自旋陈数1或3的自旋子量子自旋霍尔相；质量项、单极子和阻挫海森堡模型能量学是自然后续。", "summary_source": "deepseek", "authors": [{"name": "Harsh Raj"}, {"name": "Yasir Iqbal"}], "featured_authors": [{"name": "Harsh Raj"}, {"name": "Yasir Iqbal"}], "author_count": 2}, {"id": "2610.22974", "category": "cond-mat", "title": "Parity-dependent sublattice structure of local $2\\times2$ correlations in domino tilings of the Aztec diamond", "abstract": "We study local $2\\times2$ correlations in uniformly random domino tilings of the Aztec diamond $\\mathrm{AZ}(n)$, a dimer model with frozen corners and a liquid region bounded by the Arctic circle, and compare them with the square chessboard. For every elementary square the probabilities $P_H$ and $P_V$ of the two coverings by a pair of parallel dominoes satisfy $P_H=P_V=P_1P_2+P_3P_4$, where $P_1,\\dots,P_4$ are the probabilities of the four surrounding edges. This known identity, a case of Kuo's graphical condensation, reduces the spatial profile of $P_H$ to single-edge probabilities, which we compute exactly from the inverse Kasteleyn matrix for all squares of $\\mathrm{AZ}(n)$. The squares form two interleaved sublattices, distinguished by the color of their lower-left cell. The parity of $n$ decides which sublattice dominates near the center: the one containing the central square for odd $n$, and the other one for even $n$. This sign rule holds for the averaged sublattice contrast for all $4\\le n\\le22$. It also fixes the location of the global maximum of $P_H$, which lies at or next to the center for odd $n$ and several lattice spacings away for even $n$. Within the central sublattice, the preferred square follows a mod-4 pattern that matches the exactly pinned mean height of the center. On the $L\\times L$ chessboard the same rule holds with $n$ replaced by the half-width $L/2$, but the contrast is two to six times weaker, the central edge probability never equals $1/4$, and the maxima of $P_H$ are pinned to the corners. The exact $1/4$ values and the interior, parity-selected maxima are therefore features of the Aztec geometry.", "url": "https://arxiv.org/abs/2610.22974", "type": "理论", "summary": "1. 该工作利用Kuo图形凝聚恒等式和逆Kasteleyn矩阵，精确计算Aztec菱形AZ(n)随机多米诺铺砌中所有基本方格的局部2×2关联，并与L×L棋盘格对比。\n2. 其卖点在于将P_H=P_V=P1P2+P3P4的凝聚关系与精确解结合，发现方格按左下格颜色构成两个交错子晶格，n的奇偶性决定中心附近占优子晶格，并在4≤n≤22验证该符号规则、锁定P_H全局极大值。\n3. 与棋盘格中对比度弱2–6倍、中心边概率不取1/4且极大值固定在角点的结果相比，这些精确1/4值与内部奇偶选择的极大值应归因于Aztec几何，为二聚体模型和高度函数局部关联研究提供判据。", "summary_source": "deepseek", "authors": [{"name": "Chaeyeon Kim"}, {"name": "Suhwan Yoo"}, {"name": "Jeehoon Choi"}, {"name": "Hee Young Kwon"}, {"name": "Changyeon Won"}], "featured_authors": [{"name": "Chaeyeon Kim"}, {"name": "Suhwan Yoo"}, {"name": "Jeehoon Choi"}, {"name": "Hee Young Kwon"}, {"name": "Changyeon Won"}], "author_count": 5}, {"id": "2610.23013", "category": "cond-mat", "title": "Transport Signatures of a Kinetically Self-Trapped Nagaoka Polaron", "abstract": "Nagaoka polarons are canonical examples of kinetic magnetism. Although their spin structure is well understood, their transport remains unexplored. We compute the dynamical mobility of a single hole in the square-lattice $t$-model using resummation-based quantum Monte Carlo and analytic continuation. Upon cooling, an incoherent Drude-like response gives way to a finite-frequency peak as the dc mobility vanishes. The peak signals an internal mode of a hole confined by its ferromagnetic cloud. Our results establish transport as an incisive probe of polaron formation and kinetic self-trapping.", "url": "https://arxiv.org/abs/2610.23013", "type": "理论+数值", "summary": "1. 该工作采用基于重求和的量子蒙特卡洛与解析延拓，计算方晶格t模型中单个空穴的动力学迁移率，系统考察Nagaoka极化子的输运响应。\n2. 其核心卖点在于：降温过程中非相干Drude型响应让位于有限频率峰，同时直流迁移率趋于消失，并且该峰可指认为空穴被铁磁云束缚所形成的内禀模式。\n3. 这一结果将输运测量确立为探测极化子形成与动理学自束缚的灵敏手段，并为理解动能磁性及相关强关联晶格模型提供可检验的启发。", "summary_source": "deepseek", "authors": [{"name": "Yusong Xiao"}, {"name": "Yuan Wan"}], "featured_authors": [{"name": "Yusong Xiao"}, {"name": "Yuan Wan"}], "author_count": 2}, {"id": "2610.23015", "category": "cond-mat", "title": "Crystal Field-Phonon Coupling in ErFeO$_3$ Single Crystal Via Inelastic Neutron Scattering", "abstract": "Crystal-field (CF) excitations and their coupling to lattice vibrations were investigated in ErFeO$_3$ using inelastic neutron scattering. Pronounced modifications of the excitation spectra, including energy shifts, intensity redistribution, and linewidth changes, were observed as a consequence of CF-phonon coupling. Significant renormalization of the first and second CF excitations, located near 5 meV and 12 meV, respectively, was detected along both transverse and longitudinal directions in the vicinity of the reciprocal-space point Q = (2, 0, 4). The coupling effects become more prominent as the temperature increases from 300 K to 650 K, while a slight suppression is observed at 750 K. Remarkably, CF excitation peaks that are strongly weakened by thermal population effects re-emerge in specific momentum regions through interaction with phonon modes. The coupled excitations exhibit characteristic signatures of hybridization, including energy renormalization, intensity enhancement, and linewidth narrowing. Density-functional-theory-based phonon calculations further support the interpretation of CF-phonon coupling in ErFeO3. These results demonstrate that strong interactions between CF excitations and lattice vibrations can substantially modify the excitation spectra in rare-earth orthoferrites.", "url": "https://arxiv.org/abs/2610.23015", "type": "理论+数值", "summary": "1. 该工作以非弹性中子散射研究了ErFeO3单晶中晶体场激发及其与晶格振动的耦合。\n2. 其核心在于在Q=(2,0,4)附近沿横纵方向观测到约5与12 meV前两支晶体场激发的显著重正化，并伴随能移、强度重分布和线宽变化；耦合在300–650 K增强、750 K略受抑制，热占据削弱的峰可在特定动量区经声子混合重新显现，DFT声子计算亦支持该图像。\n3. 这揭示稀土正铁氧体中晶体场-声子强耦合能实质性改写激发谱，并为后续中子散射与晶格动力学建模提供明确约束。", "summary_source": "deepseek", "authors": [{"name": "Guochu Deng"}, {"name": "Xiaoxuan Ma"}, {"name": "Wanting Yang"}, {"name": "Wei Ren"}, {"name": "Shixun Cao"}, {"name": "Zhenxiang Cheng"}, {"name": "Garry J. McIntyre"}], "featured_authors": [{"name": "Guochu Deng"}, {"name": "Xiaoxuan Ma"}, {"name": "Wanting Yang"}, {"name": "Shixun Cao"}, {"name": "Zhenxiang Cheng"}, {"name": "Garry J. McIntyre"}], "author_count": 7}, {"id": "2610.23017", "category": "cond-mat", "title": "Diffusion-controlled reactions with time-dependent surface reactivity", "abstract": "We investigate diffusion-controlled reactions on a reactive surface with time-dependent reactivity. Starting from a conventional formulation via diffusion equation with Robin boundary condition for the macroscopic concentration of particles, we aim at quantifying how temporal variations of reactivity affect the survival probability and the associated first-reaction time (FRT) of a single particle on the reactive surface. Using an adiabatic description, we first identify five long-time regimes of the first-reaction time distribution, ranging from exponential and stretched-exponential to power-law decay. In particular, sufficiently rapid decay of the reactivity leads to a nonzero probability of never reacting, despite diffusion in a bounded domain. Second, we provide a probabilistic reformulation of this problem and compare it with a different scenario of encounter-dependent reactivity. Our theoretical predictions are validated via extensive Monte Carlo simulations.", "url": "https://arxiv.org/abs/2610.23017", "type": "理论+数值", "summary": "1. 该工作研究了具有时变表面反应性的扩散控制反应，基于Robin边界条件的扩散方程并采用绝热描述，量化反应性随时间变化对单粒子存活概率及首次反应时间（FRT）分布的影响。\n2. 其核心在于识别出FRT分布的五个长时区间（从指数、拉伸指数到幂律衰减），并揭示反应性足够快衰减时即使有界域内扩散仍存在永不反应的有限概率，同时给出概率重构并与遭遇依赖反应性情景比较、经Monte Carlo验证。\n3. 该结果将时变反应性纳入扩散控制反应的长时统计，为理解表面反应动力学中的非平衡记忆效应及其实验观测提供可检验的定量框架。", "summary_source": "deepseek", "authors": [{"name": "Denis S. Grebenkov"}, {"name": "Yilin Ye"}], "featured_authors": [{"name": "Denis S. Grebenkov"}, {"name": "Yilin Ye"}], "author_count": 2}, {"id": "2610.23105", "category": "cond-mat", "title": "Nonergodicity from Hilbert-Subspace Cloning", "abstract": "We identify a class of nonintegrable quantum many-body systems composed of single Pauli strings that possess an extensive number of noncommuting local conserved quantities and exhibit partial ergodicity breaking due to exponentially degenerate energy spectra. We show that such systems exhibit a novel mechanism, Hilbert-subspace cloning, where the identical chaotic Hamiltonian acts on each of exponentially many disconnected Hilbert subspaces. Although the dynamics within each clone thermalizes, quantum coherence between clones remains protected and detectable by local observables. Consequently, the long-time behavior of local observables is described by a coherence-preserving partial Gibbs ensemble, where the hidden subsystem retains its initial quantum coherence.", "url": "https://arxiv.org/abs/2610.23105", "type": "理论", "summary": "1. 该工作识别了一类由单个泡利串构成、具有大量非对易局域守恒量和指数简并能谱的非可积量子多体系统，并指出其出现部分遍历破缺。\n2. 其核心机制是希尔伯特子空间克隆：同一混沌哈密顿量作用于指数多个互不连通的子空间，各克隆内部热化，而克隆间量子相干受保护并可由局域可观测量探测。\n3. 由此，长时间局域可观测量由保相干的部分吉布斯系综描述，隐藏子系统保留初始量子相干，为刻画部分热化与探测子空间相干保护提供了可检验框架。", "summary_source": "deepseek", "authors": [{"name": "Yuuya Chiba"}, {"name": "Ryusuke Hamazaki"}], "featured_authors": [{"name": "Yuuya Chiba"}, {"name": "Ryusuke Hamazaki"}], "author_count": 2}, {"id": "2610.23124", "category": "cond-mat", "title": "Field-induced incommensurate--commensurate transitions in anisotropic magnets", "abstract": "We study field-induced incommensurate--commensurate transitions (ICTs) in classical spin chains with Dzyaloshinskii-Moriya interaction (DMI) $D$, strong easy-plane anisotropy, and weak easy-axis anisotropy $A$ within the easy plane. This model describes systems with ferromagnetic layers coupled by exchange interaction with DMI. The magnetic field $\\bf H$ is applied in the easy plane at an arbitrary angle $\\delta$ to the easy axis stabilizing a soliton lattice in the ground state. We consider ferromagnetic and antiferromagnetic in-chain exchange interactions within the continuum limit and show that the easy-axis anisotropy leads to qualitatively different effects in these two cases: the ferromagnetic chain is described by a double-sine-Gordon-type equation with phase-shifted harmonics, whereas the antiferromagnetic chain reduces to a sine-Gordon equation. For the latter case, phase boundaries between incommensurate and commensurate states are found analytically in $(H,A,D,\\delta)$ space and confirmed by numerical calculations for certain $D$ and $\\delta$ values. Close to all ICTs, results of the continuum consideration become invalid due to a stochastic destruction of near-separatrix solutions which either make an ICT a first-order transition or stabilize states with spatially irregular soliton and antisoliton arrangements.", "url": "https://arxiv.org/abs/2610.23124", "type": "理论+数值", "summary": "1. 该文在连续极限下研究含Dzyaloshinskii-Moriya相互作用、强易面与面内弱易轴各向异性的经典自旋链中由面内磁场诱导的不可公度—公度转变，并区分链内铁磁与反铁磁交换。\n2. 其核心是易轴各向异性使铁磁链由带相位偏移谐波的双正弦-Gordon型方程描述、反铁磁链约化为正弦-Gordon方程，并解析给出反铁磁情形在(H,A,D,δ)空间的相界且经数值验证，同时揭示近分界线解在转变附近发生随机破缺。\n3. 这意味着一阶转变或空间不规则孤子—反孤子排布可在ICT附近出现，提示后续需超越连续极限并纳入随机与离散效应。", "summary_source": "deepseek", "authors": [{"name": "P.T. Bolokhova"}, {"name": "A.V. Syromyatnikov"}], "featured_authors": [{"name": "P.T. Bolokhova"}, {"name": "A.V. Syromyatnikov"}], "author_count": 2}, {"id": "2610.23197", "category": "cond-mat", "title": "Non-Adiabatic Spin-Induced Currents in Magnetic Weyl Semimetals", "abstract": "We theoretically study dc electric currents induced by rapid spin precession in noncentrosymmetric magnetic Weyl semimetals using the Floquet--Keldysh Green's-function formalism. The spin dynamics act as a time-dependent chiral gauge field and the geometric structure of electric currents is expressed in terms of the Berry curvature, the quantum metric, and the shift vector. For an isotropic Weyl cone, only an injection current is generated. This current scales quadratically with the driving frequency and linearly with the relaxation time associated with coupling to a fermionic bath. We further show that a finite Weyl-cone tilt modifies the available interband-transition phase space, smooths the frequency dependence of the current, and allows for a shift current and another type of injection current, both of which flow in directions determined by the tilt and the direction of the precession. A finite net current can remain after summing contributions from Weyl nodes of opposite chiralities when their transition phase spaces are inequivalent.", "url": "https://arxiv.org/abs/2610.23197", "type": "数值", "summary": "1. 该工作用弗洛凯-凯尔迪什格林函数理论研究非中心对称磁性外尔半金属中快速自旋进动诱导的直流电流，并将自旋动力学视为含时手征规范场。\n2. 其核心是将电流几何结构表达为贝里曲率、量子度规和位移矢量；各向同性外尔锥仅产生随频率平方增长、与费米浴弛豫时间线性的注入电流，而外尔锥倾斜改变带间跃迁相空间、平滑频率依赖并产生位移电流及另一类注入电流，流向由倾斜和进动方向决定。\n3. 相反手征外尔节点跃迁相空间不等价时，贡献求和后仍可保留有限净电流，为自旋驱动几何电流探测和手征输运调控提供依据。", "summary_source": "deepseek", "authors": [{"name": "Kota Watanabe"}, {"name": "Akihiro Ozawa"}, {"name": "Hiroaki Ishizuka"}, {"name": "Hiroki Isobe"}, {"name": "Kentaro Nomura"}], "featured_authors": [{"name": "Kota Watanabe"}, {"name": "Akihiro Ozawa"}, {"name": "Hiroaki Ishizuka"}, {"name": "Hiroki Isobe"}, {"name": "Kentaro Nomura"}], "author_count": 5}, {"id": "2610.23210", "category": "cond-mat", "title": "Fractionalized Fermi Liquid and d-wave Superconductivity in Ba2CuO3+x", "abstract": "Strongly enhanced superconductivity (SC) (Tc = 73 K) in Ba2CuO3+x (BCO) challenges the longheld paradigm of the irrelevance of the dz2-like states in cuprates. Using tight-binding band structure plus dynamical mean-field theory (TB+DMFT), we find that a fractionalized Fermi liquid (FFL) is the normal state for the parameters realistic for BCO. Transport properties exhibit strange metal behavior above Tcoh~38 K, supporting a direct instability of this strange metal to SC. Irrelevance of one-fermion inter-band mixing, itself a non-trivial consequence of the FFL state, preferentially enhances two-fermion hopping processes and provides a novel route for both SC and competing excitonic order(s) arising directly from the FFL. The proposed scenario also clarifies the role of dz2 band in shaping the physical responses of BCO.", "url": "https://arxiv.org/abs/2610.23210", "type": "理论", "summary": "1. 该工作采用紧束缚能带结合动力学平均场理论，针对Ba2CuO3+x的现实参数研究其正常态与超导机制，发现分数化费米液体是该体系的正常态。\n2. 其核心卖点在于：FFL使单费米子带间混合变得无关紧要，从而优先增强双费米子跃迁，并在Tcoh约38 K以上给出奇异金属行为及向超导的直接不稳定性，同时可自然产生竞争性激子序。\n3. 这一图像将dz2带纳入统一框架，为理解BCO中增强的超导及铜氧化物中奇异金属到超导的转变提供了可检验的新思路。", "summary_source": "deepseek", "authors": [{"name": "M. S. Laad"}, {"name": "S. Koley"}, {"name": "A. Taraphder"}], "featured_authors": [{"name": "M. S. Laad"}, {"name": "S. Koley"}, {"name": "A. Taraphder"}], "author_count": 3}, {"id": "2610.23217", "category": "cond-mat", "title": "Emergence of Correlations Between Records and Maximum in Random Time Series", "abstract": "We compute exactly the covariance between the maximum $M$ and the number of records $K$ in a discrete time series of $n$ entries as a quantitative probe of the history leading to an extreme event. For continuous IID series, with a common probability distribution function (PDF) $p(x)$, we find the striking result that $M$ and $K$ are uncorrelated for any $n \\geq 1$. We show that this independence is rather fragile and the covariance $C_q(n)$ between $M$ and $K$ becomes nonzero when $p(x)$ becomes discontinuous due to a delta-component at $x=0$ with an amplitude $0< q < 1$. This time series models the occurrence of dry days with probability $q$ in a precipitation time series when there is no rainfall. We show that there is an interesting shape transition at a critical value $q_c$ where the covariance $C_q(n)$, as a function of $n$, changes from monotonic ($q<q_c$) to non monotonic behavior (for $q>q_c$). We compute the critical strength $q_c$ exactly. Furthermore, for large $n$, we show that $C_q(n)$ decays as a power law, with an exponent that depends on the tail of $p(x)$. We then compare our theoretical predictions with real precipitation data from several weather stations across Germany, finding a very good agreement.", "url": "https://arxiv.org/abs/2610.23217", "type": "理论", "summary": "1. 该工作精确计算了离散随机时间序列中最大值M与纪录数K的协方差，用以量化极端事件之前的历史，并证明对任意n的连续独立同分布序列二者不相关。\n2. 其关键卖点是揭示该独立性十分脆弱：在分布于零处加入幅度为q的δ分量后协方差非零，且C_q(n)随n在临界q_c处由单调转为非单调，并精确求出q_c及大n下依赖尾部的幂律衰减。\n3. 该结果将干日概率引入降水序列的纪录—极值关联建模，并与德国多站实测降水数据良好吻合，为用纪录统计诊断极端事件历史及检验分布假设提供了可检验启发。", "summary_source": "deepseek", "authors": [{"name": "Satya N. Majumdar"}, {"name": "Sanjib Sabhapandit"}, {"name": "Gregory Schehr"}], "featured_authors": [{"name": "Satya N. Majumdar"}, {"name": "Sanjib Sabhapandit"}, {"name": "Gregory Schehr"}], "author_count": 3}, {"id": "2610.23221", "category": "cond-mat", "title": "Inducing Extraordinary-log Criticality through a Quantum Spin Chain", "abstract": "We demonstrate the emergence of extraordinary-log criticality in a quantum many-body system by coupling a spin-$1/2$ Heisenberg chain to a two-dimensional quantum critical Heisenberg bilayer. Under the quantum-to-classical mapping, the chain acts as a plane defect in a three-dimensional critical environment for which the extraordinary-log universality class has recently been predicted. Using large-scale sign-problem-free quantum Monte Carlo simulations, we directly probe the renormalization-group flow of the effective defect coupling through the spin stiffness. We observe the characteristic logarithmic growth with linear system size $L$, corresponding to a stable weak-coupling fixed point and a running coupling $g(L)\\sim 1/\\log L$. Furthermore, the extracted step-scaling function quantitatively follows the universal renormalization-group flow predicted for the extraordinary-log universality class, including the leading and subleading universal coefficients. Our results establish extraordinary-log criticality in a genuine quantum many-body setting and show that its universal behavior persists despite the topological $\\theta$-term present in the low-energy field theory of the isolated spin chain.", "url": "https://arxiv.org/abs/2610.23221", "type": "理论+数值", "summary": "1. 该工作将自旋-1/2海森堡链耦合到二维量子临界海森堡双层，并用大规模无符号问题量子蒙特卡洛把链视为三维临界环境中的平面缺陷，从而诱导并检验异常对数临界性。\n2. 其卖点在于通过自旋刚度探测有效缺陷耦合的重整化群流，观察到随线性尺度L的对数增长、稳定弱耦合不动点及g(L)~1/log L，且阶跃标度函数定量符合包括领头与次领头普适系数在内的异常对数普适类预测。\n3. 该结果在真实量子多体体系中确立异常对数临界性，并表明即使孤立自旋链低能场论含拓扑θ项，其普适行为仍可保持，为后续量子模拟与实验检验提供明确启发。", "summary_source": "deepseek", "authors": [{"name": "Grigorios Makris"}, {"name": "Francesco Parisen Toldin"}, {"name": "Stefan Wessel"}], "featured_authors": [{"name": "Grigorios Makris"}, {"name": "Francesco Parisen Toldin"}, {"name": "Stefan Wessel"}], "author_count": 3}, {"id": "2610.23244", "category": "cond-mat", "title": "Simulation of centrifugal separation of particles with equal sedimentation velocities", "abstract": "Conventional centrifugal sedimentation cannot readily separate particles with the same sedimentation velocities. Density gradient centrifugation, although highly selective, exposes delicate particles such as drug delivery system (DDS) nanoparticles and exosomes to high osmotic pressure that can cause shrinkage, rupture, or expansion. To separate particles with equal or similar sedimentation velocities while preserving their properties, we propose two methods that exploit thermal fluctuations (Brownian motion): the centrifugal Brownian ratchet method, which uses asymmetric structures, and the centrifugal wavy-channel method, which uses geometric barriers. Two-dimensional Brownian dynamics simulations combining Stokes-Einstein diffusion with centrifugal sedimentation were performed, and particle transport was analyzed using the Péclet number. In the ratchet method, particles with identical sedimentation velocities but different Péclet numbers showed statistically distinct mean arrival positions and times. In the wavy-channel method, periodic entropic barriers interacting with differences in transport properties produced arrival-time differences, achieving temporal separation even for particles with identical sedimentation velocities or Péclet numbers. Both methods separate particles without relying on sedimentation-velocity differences and are expected to preserve particle properties. Because they neither depend on electrical properties nor require a change of medium, they may also be applicable to particles in liquid metals, oils, organic solvents, and ionic liquids.", "url": "https://arxiv.org/abs/2610.23244", "type": "数值", "summary": "1. 该工作提出离心布朗棘轮与离心波状通道两种利用热涨落分离沉降速度相同颗粒的方法，并用二维布朗动力学模拟检验其输运与分离行为。\n2. 其核心是将Stokes-Einstein扩散与离心沉降耦合，以Péclet数分析：非对称结构使不同Péclet颗粒的平均到达位置和时间呈统计差异，周期熵垒则产生到达时间差，实现同沉降速度甚至同Péclet数颗粒的时间分离。\n3. 该策略不依赖沉降速度差、电学性质或更换介质，有望在保持DDS纳米颗粒和外泌体等敏感颗粒性质的同时，推广至液态金属、油、有机溶剂和离子液体等体系。", "summary_source": "deepseek", "authors": [{"name": "Yurika Miyake"}, {"name": "Natsuki Asami"}, {"name": "Ken-ichi Amano"}], "featured_authors": [{"name": "Yurika Miyake"}, {"name": "Natsuki Asami"}, {"name": "Ken-ichi Amano"}], "author_count": 3}, {"id": "2610.23260", "category": "cond-mat", "title": "Equal-spin pairing at finite Cooper-pair momentum in $p$-wave magnets", "abstract": "The realization of Fulde-Ferrell (FF) superconducting states has long been pursued but remains challenging because of the large Zeeman splitting required. Here, we demonstrate that $p$-wave magnets can host equal-spin finite-pair-momentum states with $p$-wave symmetry, termed FF states, at arbitrarily weak fields. Our Bogoliubov-de Gennes analysis shows that, owing to the displacement of the Fermi surface, two equal-spin electrons in the FF states pair at the same energy, just as in the opposite-spin zero-pair-momentum states of the same gap symmetry. At zero field, the FF states are therefore exactly degenerate with these zero-pair-momentum counterparts. An arbitrarily weak Zeeman field lifts this degeneracy and makes the FF states the superconducting ground state, since they remain stable owing to their equal-spin nature, whereas their counterparts are suppressed by the formation of Bogoliubov Fermi surfaces. These findings identify the fermiology of $p$-wave magnets as a promising route toward long-sought finite-momentum superconductivity.", "url": "https://arxiv.org/abs/2610.23260", "type": "理论", "summary": "1. 该工作通过Bogoliubov-de Gennes分析证明，p波磁体可在任意弱Zeeman场下承载具有p波对称性的等自旋有限对动量Fulde-Ferrell态。\n2. 其关键机制是费米面位移使两枚等自旋电子在相同能量配对，从而在零场与同对称性零对动量态严格简并；弱场解除简并，且等自旋性质使FF态免受Bogoliubov费米面抑制而成为超导基态。\n3. 这些结果将p波磁体的费米面性质确立为实现长期追寻的有限动量超导的可信路径，并提示可在弱场p波磁体平台中寻找FF超导。", "summary_source": "deepseek", "authors": [{"name": "Jaeyong Lee"}, {"name": "Kyoung-Min Kim"}], "featured_authors": [{"name": "Jaeyong Lee"}, {"name": "Kyoung-Min Kim"}], "author_count": 2}, {"id": "2610.23285", "category": "cond-mat", "title": "When Cooling Meets Flow: Advection-Driven Orientation Selection in Phase Separation around a Moving Cooling Source", "abstract": "We investigate phase separation in a binary fluid subjected to a moving Gaussian cooling source and externally imposed material flow. Unlike conventional homogeneous quenches, the moving thermal field initiates phase separation at different times across the system, creating a spatially varying thermal history and local age. The interplay of a moving cooling source, phase separation and external flow field introduces directional bias, resulting in anisotropic pattern formation. Using an advective Cahn-Hilliard-Cook model coupled to a spatially and temporally varying temperature field, we examine how front propagation, thermal diffusion, phase separation, and material transport jointly select the evolving morphology. In the absence of flow, increasing the cooling-source velocity drives a transition from nearly symmetric structures to asymmetric spiral-like patterns and, at higher velocities, to narrow elongated domains as the thermal front increasingly lags behind the source. Advection reorganizes the phase-separated domains by transporting, stretching, and reorienting them. At low flow velocities, competing thermal and advective histories produce distinct regions of flow-aligned and vertical layers. A stronger flow aligns the domains predominantly along the flow direction. Our results demonstrate that a moving thermal history can encode a spatial record of non-equilibrium phase separation. This work provides a route to controlled morphology selection through the competition between front propagation, thermal diffusion, and material flow.", "url": "https://arxiv.org/abs/2610.23285", "type": "理论", "summary": "1. 该工作采用与时空变化温度场耦合的对流Cahn-Hilliard-Cook模型，研究二元流体在移动高斯冷却源与外加强制流动共同作用下的相分离和形貌演化。\n2. 其核心卖点是揭示移动热场造成空间非均匀热历史与局部年龄，并通过前沿传播、热扩散、相分离和对流的竞争产生方向偏置，使结构由近对称转变为螺旋状、细长畴并在强流下沿流向排列。\n3. 这表明移动热历史可编码非平衡相分离的空间记录，并为通过冷却源运动与物质流竞争实现可控形貌选择提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Lakshmipriya K"}, {"name": "Sutapa Roy"}], "featured_authors": [{"name": "Lakshmipriya K"}, {"name": "Sutapa Roy"}], "author_count": 2}, {"id": "2610.23300", "category": "cond-mat", "title": "Topological edge and domain-wall phonons in the mass-dimerized diatomic chain: complex band structure, Zak phase, and spectral unfolding", "abstract": "The one-dimensional chain with alternating masses is the simplest mechanical system with a topological band structure. We give a fully analytical account of its localized vibrations built on the complex band structure. The evanescent Bloch waves available at each frequency are matched directly to force balance at a free end or a domain wall, without transfer matrices, which yields closed-form frequencies and decay lengths for every localized mode. The free-end mode sits at a branch point of the complex band structure, where the acoustic and optical sheets join and the decay is fastest. For uniform springs, a sharp wall between the two mass orderings hosts one in-gap mode, symmetric at the light$\\mid$light wall and antisymmetric at the heavy$\\mid$heavy wall, and an adiabatic construction shows that these are the same topological mode; the light$\\mid$light wall also binds a non-topological mode above the optical branch. Spectral unfolding makes this classification visible in momentum space: the sign of the Bloch factor sets the zone-center or zone-boundary character of each mode, and its magnitude sets the width. The Zak phase, quantized by inversion, identifies the modes of topological origin and fixes a half-integer mode count per band at a wall, while the chiral symmetry known to be hidden in strain coordinates explains which frequencies are pinned.", "url": "https://arxiv.org/abs/2610.23300", "type": "理论", "summary": "1. 该工作对质量二聚化双原子链中的边界与畴壁局域声子给出全解析描述，基于复能带将各频率可用的倏逝Bloch波直接与自由端或畴壁的力平衡匹配，无需转移矩阵即可得到闭式频率与衰减长度。\n2. 其核心卖点在于揭示自由端模位于复能带支点且衰减最快，并借谱展开、Zak相位与隐含手征对称性统一分类轻-轻和重-重畴壁模的对称性、拓扑来源及频率钉扎。\n3. 这为机械与声学超材料中拓扑边缘态的解析识别和设计提供了可推广判据，并启发将复能带匹配与谱展开用于更复杂晶格及实验表征。", "summary_source": "deepseek", "authors": [{"name": "Vincent Meunier"}], "featured_authors": [{"name": "Vincent Meunier"}], "author_count": 1}, {"id": "2610.23310", "category": "cond-mat", "title": "Fundamental Bounds on the Oscillation Efficiency of Markov Networks", "abstract": "Stochastic oscillations are commonly identified through peaks in their power spectra, yet the fundamental limits on their strength and energetic cost remain unclear. Here we establish universal dynamical and thermodynamic bounds on oscillation efficiency in Markov networks, showing how finite state spaces constrain spectral peak enhancement. In particular, we demonstrate that networks maximizing modal coherence need not maximize oscillation efficiency. We further derive dissipation bounds that connect oscillation efficiency to the relaxation speed and stationary probabilities, revealing an unavoidable energetic cost of maintaining pronounced oscillations at a specified relaxation timescale. These bounds remain strictly positive in regimes where existing explicit spectral dissipation estimates vanish, with stronger constraints for normal networks and uniform rings. Our results distinguish spectral oscillatory strength from modal coherence and reveal how network dynamics and thermodynamic dissipation jointly limit stochastic oscillations.", "url": "https://arxiv.org/abs/2610.23310", "type": "理论", "summary": "1. 该工作针对马尔可夫网络中的随机振荡，建立了振荡效率的普适动力学与热力学上界，并阐明有限状态空间如何限制功率谱峰值的增强。\n2. 其核心在于证明最大化模态相干性的网络未必最大化振荡效率，并给出将振荡效率与弛豫速度和稳态概率相联系的耗散界，该界在既有显式谱耗散估计消失时仍严格为正，且在正规网络与均匀环上约束更强。\n3. 这区分了谱振荡强度与模态相干性，揭示网络动力学与热力学耗散如何共同限制随机振荡，为后续理论分析与网络设计提供了可检验的约束框架。", "summary_source": "deepseek", "authors": [{"name": "Chen Jia"}], "featured_authors": [{"name": "Chen Jia"}], "author_count": 1}, {"id": "2610.23314", "category": "cond-mat", "title": "Interfacial Faraday instability driven by interspecies-interaction modulation in a phase-separated binary Bose-Einstein condensate", "abstract": "We investigate interfacial Faraday instabilities in a quasi-two-dimensional, phase-separated binary Bose-Einstein condensate driven by periodic modulation of the interspecies scattering length. In the strongly immiscible regime, the interspecies interaction energy is concentrated near the internal interface, linking the modulation to interfacial tension and the capillary restoring force. We quantify the first-order tension response through its logarithmic sensitivity and account for nonlinear tension variations at finite modulation amplitudes. A sharp-interface capillary model and Floquet analysis yield discrete azimuthal-mode frequencies and primary instability tongues that shift toward higher driving frequencies with increasing mode order. Gross-Pitaevskii simulations reveal star-shaped interface patterns with threefold to eightfold rotational symmetry. The eightfold mode exhibits subharmonic oscillations and approximately exponential growth of its period-averaged amplitude over a small-deformation interval. These results provide a route to frequency-selective excitation of interfacial capillary modes through interspecies-interaction control.", "url": "https://arxiv.org/abs/2610.23314", "type": "理论+数值", "summary": "1. 该文研究了由种间散射长度周期调制驱动的准二维相分离二元玻色-爱因斯坦凝聚界面法拉第不稳定性，并用界面毛细模型、弗洛凯分析和格罗斯-皮塔耶夫斯基模拟进行刻画。\n2. 其卖点在于强不可混区种间相互作用能集中于内界面，使调制通过界面张力的一阶对数灵敏度及有限幅度非线性修正作用于毛细回复力，给出离散方位角模式、随阶数向高频移动的主不稳定舌，以及三至八重星形界面纹样和八重模式的子谐波振荡与周期平均幅度近指数增长。\n3. 这为通过种间相互作用调控实现界面毛细模式的频率选择性激发提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Yating Huang"}, {"name": "Yan Li"}], "featured_authors": [{"name": "Yating Huang"}, {"name": "Yan Li"}], "author_count": 2}, {"id": "2610.23413", "category": "cond-mat", "title": "Stability and Nonlinear Dynamics of Field-Driven Extended Domain Walls with Interfacial Dzyaloshinskii-Moriya Interaction", "abstract": "We analyze the stability and non-linear dynamics of extended domain walls (DWs) with Dzyaloshinskii-Moriya interaction (DMI) driven by an external magnetic field in the clean limit (i.e., in the absence of disorder and thermal fluctuations). We show that for moderate DMI strengths, the dynamics in both the low- and high-field regimes are accurately described by a rigid-wall Walker model that neglects flexural degrees of freedom. At intermediate fields, however, the system undergoes a transition into a non-trivial spatio-temporally chaotic regime characterized by dynamically roughened domain walls displaying single- or multi-valued profiles. The phase boundaries delimiting this regime in the magnetic field-DMI phase space are computed using a linear stability analysis based on Floquet theory applied to the extended domain wall, explicitly accounting for DMI and internal phase dynamics. Our theoretical analysis and predicted phase diagram are fully supported by numerical micromagnetic simulations solving the full Landau-Lifshitz-Gilbert equation.", "url": "https://arxiv.org/abs/2610.23413", "type": "理论+数值", "summary": "1. 该文在洁净极限下结合Floquet线性稳定性分析与全LLG微磁模拟，研究外磁场驱动、含界面Dzyaloshinskii-Moriya相互作用的扩展畴壁稳定性与非线性动力学。\n2. 其关键在于区分DMI强度区间：低/高场可由忽略弯曲自由度的刚性Walker模型描述，而中间场区出现动态粗糙化畴壁及单值/多值剖面的时空混沌，并给出磁场-DMI相图边界。\n3. 这强调DMI与内相位动力学决定扩展畴壁失稳和混沌相边界，为场驱动畴壁可控性及微磁模型简化判据提供依据。", "summary_source": "deepseek", "authors": [{"name": "Enzo Fabrizio Pusiol"}, {"name": "Alberto Rosso"}, {"name": "Alejandro B. Kolton"}], "featured_authors": [{"name": "Enzo Fabrizio Pusiol"}, {"name": "Alberto Rosso"}, {"name": "Alejandro B. Kolton"}], "author_count": 3}, {"id": "2610.23473", "category": "cond-mat", "title": "Magnetic Field-assisted Crystallographic Selection During Grain Growth in Non-Magnetic Polycrystals: A Phase-Field Study", "abstract": "Magnetic fields drive grain boundary migration in non-magnetic systems through anisotropic susceptibility, yet how the local orientation can affect the resulting collective grain growth behavior remains unclear. We employ a phase-field model to investigate magnetic-field-assisted grain growth in the diamagnetic Bi. This study provides a mechanistic basis for using static and dynamically varied magnetic fields to control texture development and grain growth kinetics in weakly magnetic materials. We also identify the conditions under which magnetic-field-driven orientation selection produces a distinct bimodal grain-size distribution. The bicrystal studies establish that boundary migration is governed by the magnetic free-energy difference between differently oriented grains, while polycrystalline field-sweep simulations reveal a transition from capillary-dominated coarsening to magnetically biased texture selection. For unbiased orientation distributions, magnetic selection remains distributed; however, when a small population of grains is strongly favored, the driving force localizes and exhibits bimodal coarsening characterized by enlarged favored grains embedded within a fine-grained matrix, even without grain boundary energy anisotropy, particle pinning, or heterogeneity. The field removal and field reorientation simulations further show that magnetic field history can redirect the coarsening pathway.", "url": "https://arxiv.org/abs/2610.23473", "type": "理论+数值", "summary": "1. 该工作用相场模型研究了抗磁性Bi多晶在磁场辅助下的晶粒生长与取向选择，并结合双晶和场扫描模拟分析组织演化与粗化动力学。\n2. 其核心机制是不同取向晶粒间的磁自由能差驱动晶界迁移，使多晶体系由毛细力主导粗化转向磁场偏置的织构选择，并在少量取向被强烈偏好时形成粗大优选晶粒嵌入细晶基体的双峰分布。\n3. 该结果提供了用静态或动态磁场调控弱磁材料织构与晶粒生长动力学的机理依据，并表明磁场历史可重定向粗化路径，为后续实验设计提供可检验启发。", "summary_source": "deepseek", "authors": [{"name": "Rakesh Maurya"}, {"name": "Soumya Bandyopadhyay"}, {"name": "Somnath Bhowmick"}, {"name": "Rajdip Mukherjee"}], "featured_authors": [{"name": "Rakesh Maurya"}, {"name": "Soumya Bandyopadhyay"}, {"name": "Somnath Bhowmick"}, {"name": "Rajdip Mukherjee"}], "author_count": 4}, {"id": "2610.23512", "category": "cond-mat", "title": "topas-editor and TOPilot: tools for AI-driven analysis of diffraction and total scattering data", "abstract": "This paper describes topas-editor and TOPilot, which provide a powerful interface to the TOPAS software suite and allow generative AI-driven automation of complex crystallographic tasks. topas-editor is a TOPAS-aware VS Code extension designed for the rapid creation and editing of TOPAS input files and for interacting with the software. It knows TOPAS syntax, has crystallographic-aware editing features and provides in-line user guidance via hover tips and automated links to reference manuals. TOPilot is a collection of Python routines and machine-accessible reference documents that allow AI-driven automated analysis in TOPAS. It uses a transferable topas-inp-writer skill that can be applied in all TOPAS application areas. We demonstrate the power and reliability of the approach using examples including: a complex Rietveld refinement with sample- and data-related complications; automatic analysis of multiple data sets; a pipeline from indexing through structure solution to refinement; automatic identification of the phases present in a sample; single crystal and powder diffraction analysis of incommensurate structures; and fitting PDF data. TOPilot can be used directly alongside topas-editor, via a stand-alone topilot-wizard, or via command line interfaces or desktop apps from major AI providers. TOPilot was developed and tested using Claude large language models, but can be configured to use other cloud or local models. topas-editor and TOPilot are freely available.", "url": "https://arxiv.org/abs/2610.23512", "type": "理论", "summary": "1. 该工作开发了 topas-editor 与 TOPilot 两套开放工具，通过 TOPAS 感知的 VS Code 扩展和 Python 例程及机器可读参考文档，实现衍射与全散射数据分析的生成式 AI 自动化。\n2. 核心技术卖点是可迁移的 topas-inp-writer 技能，统一覆盖 Rietveld 精修、批量数据处理、从指标化到结构解析与精修的流程、物相自动识别、单晶与粉末非公度结构分析以及 PDF 拟合，并兼容云端与本地模型。\n3. 这为复杂晶体学工作流的人机协同与自动化提供了可复用范式，其价值取决于在更多数据与模型配置下对可靠性及可迁移性的持续验证。", "summary_source": "deepseek", "authors": [{"name": "John S. O. Evans"}, {"name": "Oliver J. Wagstaff"}, {"name": "Ivana R. Evans"}, {"name": "Arnt Kern"}, {"name": "Alan A. Coelho"}], "featured_authors": [{"name": "John S. O. Evans"}, {"name": "Oliver J. Wagstaff"}, {"name": "Ivana R. Evans"}, {"name": "Arnt Kern"}, {"name": "Alan A. Coelho"}], "author_count": 5}, {"id": "2610.23545", "category": "cond-mat", "title": "Linear response for machine-learned interatomic potentials: phonons at arbitrary wave vectors from the primitive cell", "abstract": "Phonon calculations with machine-learned interatomic potentials are almost exclusively performed with finite displacements in supercells, an approach that is exact only at wave vectors commensurate with the supercell and whose error depends on the range of the force constants. In message-passing networks this range grows with the number of layers, and reaches 140 angstrom for the deepest universal models. Here we show that the dynamical matrix of a message-passing potential can be obtained exactly in the primitive cell, at any wave vector, as the linear response of the forces to a displacement modulated by a Bloch phase, in the spirit of density-functional perturbation theory. The phase enters only where the features of neighboring atoms are gathered, and the trained model is used without modification. One further derivative yields group velocities and mode Grüneisen parameters analytically. We apply the method to NequIP and Prophet, and reproduce the Hessians of supercells to machine precision. Using these results as a reference, we find that the supercells commonly employed in high-throughput calculations lead to errors of several tenths of a THz in the phonon frequencies, and that these errors decrease slowly with the size of the supercell, in particular for deep models. For a low-symmetry silicate, the supercell predicts a dynamical instability that the model does not have. Quantities that depend on derivatives of the dispersion, such as the group velocities and the Grüneisen parameter at low temperature, are considerably more affected than the frequencies themselves. When both approaches are used to obtain the same force constants, their computational cost is comparable for crystals with symmetry.", "url": "https://arxiv.org/abs/2610.23545", "type": "理论+数值", "summary": "1. 该工作提出面向消息传递型机器学习原子间势的线性响应方法，在原胞内用布洛赫相位调制位移精确构造任意波矢的动力学矩阵。\n2. 其关键在于相位仅进入邻域特征聚合且无需改动已训练模型，可解析获得群速度与模格林艾森参数，并将超胞Hessian复现到机器精度，同时揭示常用超胞有限位移造成约零点几THz声子频率误差且随超胞增大收敛缓慢。\n3. 这为高通量声子计算提供可靠基准，并提示深层模型与低对称晶体中尤需警惕超胞方法导致的虚假动力学不稳定及色散导数相关量的更大偏差。", "summary_source": "deepseek", "authors": [{"name": "Thalis H. B. da Silva"}, {"name": "Hai-Chen Wang"}, {"name": "Mi
