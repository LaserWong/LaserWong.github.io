2604.11051", "type": "理论", "summary": "1. 该工作研究了IIA型弦论中的单矢量形变，展示了D0膜背景的自映射以及其它极端背景与溶解D0膜电荷的结合态生成。\n2. 其技术核心在于通过单矢量形变显式构造出F1-D0与D2-D0束缚态背景，并将非极端弦的形变与热F1-D0态精确对应。\n3. 这为理解临界单矢量形变与M理论离散光锥量子化（DLCQ）的深层关联提供了具体切入点，有望推动相关非微扰结构的研究。", "summary_source": "deepseek", "authors": [{"name": "Sergei Barakin"}, {"name": "Kirill Gubarev"}, {"name": "Edvard T. Musaev"}], "featured_authors": [{"name": "Sergei Barakin"}, {"name": "Kirill Gubarev"}, {"name": "Edvard T. Musaev"}], "author_count": 3}, {"id": "2604.11158", "category": "hep-th", "title": "Entanglement inequalities for timelike intervals within dynamical holography", "abstract": "This paper extends our previous work ( arXiv:2504.14313 ) of a single timelike subregion to two, in the framework of AdS$_3$-Vaidya holography. We confirm the positivity of timelike mutual information and the statement of weak monotonicity when the subregions are non-overlapping. We also study entanglement inequalities such as Araki-Lieb inequality and strong subadditivity when the intervals start to overlap. In line with the recent findings in the literature, we provide explicit working examples showing that the timelike version of the strong subadditivity is generally violated in these setups, even though the statements of subadditivity and Araki-Lieb inequality hold true.", "url": "https://arxiv.org/abs/2604.11158", "type": "理论", "summary": "1. 本工作在AdS3-Vaidya全息动力学框架下，将类时子区域的纠缠不等式研究从单个扩展至两个，并系统考察了非重叠与重叠情形下的多种不等式。\n2. 其核心物理发现在于通过具体算例证实子区域重叠时类时强次可加性普遍被违反，同时验证了非重叠下类时互信息正定性、弱单调性及重叠下Araki-Lieb不等式的成立。\n3. 这为全息对偶中类时纠缠熵的理论构建及量子信息不等式在动力学时空中的适用范围修正提供了关键案例与明确方向。", "summary_source": "deepseek", "authors": [{"name": "Gaurav Katoch"}, {"name": "Debajyoti Sarkar"}, {"name": "Bhim Sen"}], "featured_authors": [{"name": "Gaurav Katoch"}, {"name": "Debajyoti Sarkar"}, {"name": "Bhim Sen"}], "author_count": 3}, {"id": "2604.11277", "category": "hep-th", "title": "Updating the holomorphic modular bootstrap", "abstract": "We update the holomorphic modular bootstrap incorporating a recent result that computes the exact S-matrix within the Modular Linear Differential Equation (MLDE) setting. Further, using knowledge of the allowed exponents modulo one, we obtain admissible solutions to all MLDE's with up to six characters and Wronskian index < 6 and one accessory parameter with c_eff <= 24. We then identify which of the admissible solutions have good fusion rules -- we call such solutions tenable. When possible, we identify the CFT and in the unitary cases the MTC class they belong to.", "url": "https://arxiv.org/abs/2604.11277", "type": "理论", "summary": "1. 该论文更新了全纯模自举方法，融入了在模线性微分方程（MLDE）框架下计算精确S矩阵的新进展，并求解了字符数≤6、Wronskian指数<6、附带参数为一个且c_eff≤24的所有MLDE的可容许解。\n2. 其技术优势在于基于允许指数模一的知识，系统鉴别了可容许解中具有良好融合规则的“可维持”解，并对幺正情况下的共形场论及其模张量范畴类进行了指认。\n3. 这为在受限参数空间内对二维共形场论进行系统分类建立了方法，并对未来研究更广泛模自举问题或高维推广提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Suresh Govindarajan"}, {"name": "Akhila Sadanandan"}], "featured_authors": [{"name": "Suresh Govindarajan"}, {"name": "Akhila Sadanandan"}], "author_count": 2}, {"id": "2604.11404", "category": "hep-th", "title": "GlobalCY I: A JAX Framework for Globally Defined and Symmetry-Aware Neural Kähler Potentials", "abstract": "We present \\emph{GlobalCY}, a JAX-based framework for globally defined and symmetry-aware neural Kähler-potential models on projective hypersurface Calabi--Yau geometries. The central problem is that local-input neural Kähler-potential models can train successfully while still failing the geometry-sensitive diagnostics that matter in hard quartic regimes, especially near singular and near-singular members of the Cefalú family. To study this, we compare three model families -- a local-input baseline, a globally defined invariant model, and a symmetry-aware global model -- on the hard Cefalú cases $\\lambda=0.75$ and $\\lambda=1.0$ using a fixed multi-seed protocol and a geometry-aware diagnostic suite. In this benchmark, the globally defined invariant model is the strongest overall family, outperforming the local baseline on the two clearest geometric comparison metrics, negative-eigenvalue frequency and projective-invariance drift, in both cases. The gains are strongest at $\\lambda=0.75$, while $\\lambda=1.0$ remains more difficult. The current symmetry-aware model improves projective-invariance drift relative to the local baseline, but does not yet surpass the plain global invariant model. These results show that global invariant structure is a meaningful architectural constraint for learned Kähler-potential modeling in hard quartic Calabi--Yau settings.", "url": "https://arxiv.org/abs/2604.11404", "type": "理论", "summary": "1. 该研究开发了基于JAX的全局定义与对称性感知神经Kähler势框架GlobalCY，并在硬四次Calabi--Yau几何的Cefalú家族（λ=0.75和λ=1.0）上通过固定多种子协议进行了系统基准测试。\n2. 其技术优势在于全局定义不变量模型在几何敏感诊断（如负特征值频率和投影不变性漂移）中整体表现最强，显著优于局部输入基线，尤其在λ=0.75时增益突出。\n3. 这为硬四次Calabi--Yau设置中学习Kähler势建模的架构设计提供了明确启示，表明全局不变量结构是关键约束，可指导后续模型优化与扩展研究。", "summary_source": "deepseek", "authors": [{"name": "Abdul Rahman"}], "featured_authors": [{"name": "Abdul Rahman"}], "author_count": 1}, {"id": "2604.11474", "category": "hep-th", "title": "`Seeing' the quantum ripples of spacetime", "abstract": "We propose a novel way of detecting gravitons using emission of photons from charged array of quantum harmonic oscillators placed inside of a cavity while the cavity is being pumped with low frequency photons. We observe that when the detector is in its ground state, a single graviton is absorbed by the detector while it jumps a single energy level by simultaneously emitting a photon. We also observe that while the detector de-excites from an higher energy level, it spontaneously emits a high frequency graviton, by absorbing a single photon. This analytical outcome encourages us to propose a very simple tabletop graviton detector model as the transition probabilities can be significantly enhanced by pumping photons in the initial state of the system. This mechanism gives us a physical way to `visualize' the effect of gravitons with a relativistic system.", "url": "https://arxiv.org/abs/2604.11474", "type": "理论", "summary": "1. 该工作提出了一种基于光腔内带电量子谐振子阵列的新型桌面引力子探测器模型，通过泵浦低频光子来增强探测信号。\n2. 其核心物理机制在于，探测器可通过吸收单个引力子并跃迁能级而发射光子，或在退激时吸收光子而发射高频引力子，这一协同过程可通过初始态的光子泵浦显著增强跃迁概率。\n3. 此方案将引力子效应转化为可观测的光子信号，为在相对论性量子系统中实验“可视化”引力子、进而探索量子引力效应提供了切实可行的新思路。", "summary_source": "deepseek", "authors": [{"name": "Soham Sen"}], "featured_authors": [{"name": "Soham Sen"}], "author_count": 1}, {"id": "2604.11602", "category": "hep-th", "title": "Celestial 1-form symmetries", "abstract": "The $S$-algebra originally arose as a chiral algebra of asymptotic symmetries of Yang-Mills theory. We show that in the self-dual sector of Yang-Mills, the $S$-algebra gets upgraded to an infinite-dimensional algebra of $1$-form symmetries in the bulk. The associated 2-form currents encode the integrability and hierarchies of self-dual Yang-Mills. As an application, we prove the equality of Carrollian corner charges with modes of the celestial chiral algebra by expressing them as integrals of the same 2-form currents over homologous 2-cycles.", "url": "https://arxiv.org/abs/2604.11602", "type": "理论", "summary": "1. 该工作将源于杨-米尔斯理论渐近对称性的celestial chiral $S$代数，推广到自对偶杨-米尔斯理论中的体无限维1-形式对称性代数。\n2. 其核心在于构造了与该对称性相关的2-流形，它们编码了自对偶杨-米尔斯的可积结构与层次，并建立了Carroll拐角荷与celestial chiral代数模的等式关系。\n3. 这为在celestial全息框架下统一描述渐近对称性、可积系统与守恒荷提供了新的理论基石，并启示了对更高形式对称性的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Laurent Freidel"}, {"name": "Atul Sharma"}], "featured_authors": [{"name": "Laurent Freidel"}, {"name": "Atul Sharma"}], "author_count": 2}, {"id": "2604.11736", "category": "hep-th", "title": "Poisson Gauge Theories in Three Dimensions: Exact Solutions and Conservation Laws", "abstract": "We investigate Maxwell-Chern-Simons theory on a three-dimensional noncommutative spacetime endowed with a constant spacelike Poisson structure. By exploiting the residual rotational symmetry, we construct exact classical solutions corresponding to pointlike electric and magnetic charges. We demonstrate that noncommutativity acts as a natural regulator, ensuring a finite total electromagnetic energy and thereby resolving the classical self-energy divergence. Furthermore, some of these solutions exhibit a non-perturbative dependence on the noncommutativity parameter and allow for the generation of an arbitrary magnetic flux. We also present a noncommutative generalization of Gauss's law, providing a robust framework for the physical interpretation of these exact solutions.", "url": "https://arxiv.org/abs/2604.11736", "type": "理论", "summary": "1. 该工作在具有恒定类空间泊松结构的三维非对易时空上，研究了Maxwell-Chern-Simons理论，并构造了对应于点电荷与磁荷的精确经典解。\n2. 其核心在于揭示了时空非对易性可作为自然的紫外截断，消除了经典自能发散，且部分解展现出对非对易参数的非微扰依赖及任意磁通生成能力。\n3. 这为构建非对易规范理论的守恒律与物理解释框架奠定了基础，并可能激发对高维非对易场论精确解及相关拓扑效应的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Alexey Sharapov"}, {"name": "David Shcherbatov"}], "featured_authors": [{"name": "Alexey Sharapov"}, {"name": "David Shcherbatov"}], "author_count": 2}, {"id": "2604.09908", "category": "math-ph", "title": "Strictly correlated electrons in a quantum ring: from Kohn-Sham to Kantorovich potentials", "abstract": "Our goal in this paper is twofold. First, we characterize the class of pairwise interactions for which the Seidl conjecture on the structure of optimal plans for the symmetric multimarginal optimal transport problem with one-dimensional marginal holds. This extends previous results by Colombo, De Pascale, and Di Marino [Can. Jou. Math., 67 (2015), this https URL ], which treated the case of translation-invariant, convex and decreasing interactions. In particular, our results apply to physically relevant interactions for electrons living on a quantum ring. The second main goal of the paper is to rigorously derive the leading order asymptotics of the adiabatic connection potential for strongly interacting systems. More precisely, we show that for electrons in a quantum ring (or one-dimensional interval), not only the Lieb density functional converges to the optimal transport (or strictly correlated) functional in the semiclassical limit, but also the representing potential converges to a regular Kantorovich potential. As an intermediate step, we also extend previous results on the strongly interacting limit of the Lieb functional to periodic systems in arbitrary dimensions.", "url": "https://arxiv.org/abs/2604.09908", "type": "理论", "summary": "1. 该工作将对称多边际最优输运问题中Seidl猜想成立的条件从平移不变、凸且递减的相互作用推广至更一般情形，并严格导出了强相互作用体系绝热连接势的主导阶渐近行为。\n2. 其核心突破在于证明了量子环上电子的Lieb密度泛函在半经典极限下不仅收敛于最优输运泛函，其表示势也收敛于正则Kantorovich势，从而在密度泛函理论与最优输运间建立了精确对应。\n3. 这为将强相互作用极限下的严格关联电子理论推广至任意维周期系统提供了数学基础，并对一维与环状量子体系中相关能泛函的构造与计算提供了新范式。", "summary_source": "deepseek", "authors": [{"name": "Thiago Carvalho Corso"}], "featured_authors": [{"name": "Thiago Carvalho Corso"}], "author_count": 1}, {"id": "2604.10162", "category": "math-ph", "title": "Dual contractions and algebraic families", "abstract": "We introduce a duality for Inönü-Wigner contractions attached to real symmetric Lie algebras. Starting from a symmetric pair $(\\mathfrak{g},\\theta)$, we define a dual real form $\\mathfrak{g}^{*}$ inside the complexification of $\\mathfrak{g}$ and consider the corresponding contraction with respect to the common fixed-point subalgebra $\\mathfrak{g}^{\\theta}$. The main result shows that the original contraction and its dual appear as real fibers of a single algebraic family of complex Lie algebras equipped with an anti-holomorphic involution. This places the two contractions in one geometric framework and connects them with the algebraic-family methods developed in recent work on contractions, real forms, and hidden symmetries.", "url": "https://arxiv.org/abs/2604.10162", "type": "理论", "summary": "1. 该工作针对实对称李代数引入了伊诺努-威格纳收缩的对偶性。\n2. 其卖点在于原始收缩与对偶收缩作为配备反全纯对合的单一复数李代数代数族的实纤维出现。\n3. 这为基于代数家族方法的收缩、实形式及隐藏对称性研究提供了统一的几何框架。", "summary_source": "deepseek", "authors": [{"name": "Eyal Subag"}], "featured_authors": [{"name": "Eyal Subag"}], "author_count": 1}, {"id": "2604.10270", "category": "math-ph", "title": "A second order upper bound to the free energy of the two dimensional Bose gas", "abstract": "We consider a two-dimensional Bose gas in the dilute regime where $\\rho a^2$ is small. For temperatures below the Berezinskii-Kosterlitz-Thouless critical temperature, we derive an explicit upper bound for the free energy density using Bogoliubov theory. Our result captures the contribution of quasiparticle modes with dispersion relation $\\sqrt{p^4 + 8\\pi \\rho\\, \\delta\\, p^2}$ and where $\\delta = 2 / (|\\log(\\rho a^2)| + \\log |\\log(\\rho a^2)|)$.", "url": "https://arxiv.org/abs/2604.10270", "type": "理论", "summary": "1. 该工作针对稀薄区 ($\\rho a^2$ 小) 下温度低于 BKT 转变点的二维玻色气体，利用 Bogoliubov 理论导出了自由能密度的一个显式上界。\n2. 其主要技术要点在于，结果精确包含了色散关系为 $\\sqrt{p^4 + 8\\pi \\rho\\, \\delta\\, p^2}$ (其中 $\\delta$ 含双重对数修正) 的准粒子模式的贡献。\n3. 这一严格上界为二维玻色气体在临界温度附近的热力学行为提供了可靠的定量基准，并为研究其与更高维体系的交叉行为奠定了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Florian Haberberger"}, {"name": "Lukas Junge"}], "featured_authors": [{"name": "Florian Haberberger"}, {"name": "Lukas Junge"}], "author_count": 2}, {"id": "2604.10416", "category": "math-ph", "title": "Higher (gauged) Wess--Zumino--Witten terms based on Lie crossed modules", "abstract": "We derive higher Wess--Zumino--Witten (WZW) and gauged WZW (gWZW) terms within strict higher Chern--Simons (CS) gauge theory. Starting from the Cartan homotopy formula, we obtain the $(2n+2)$-dimensional higher CS forms and transgression forms for strict Lie 2-groups presented by Lie crossed modules. Given two 2-connections related by a higher gauge transformation, higher transgression forms yield canonical higher WZW and gWZW terms. We prove that, for the symmetric invariant polynomial associated with differential crossed modules, the pure-gauge higher WZW term vanishes identically, whereas the higher gWZW term is exact. Consequently, the higher CS action is higher-gauge invariant on closed manifolds, and on manifolds with boundary all gauge dependence is encoded in boundary terms.", "url": "https://arxiv.org/abs/2604.10416", "type": "理论", "summary": "1. 该工作从严格高阶陈-西蒙斯规范理论出发，基于李交叉模描述的严格李2群，推导了高阶Wess–Zumino–Witten项及其规范版本。\n2. 核心在于证明了对于微分交叉模的对称不变多项式，纯规范高阶WZW项恒为零，而规范高阶WZW项是恰当形式，从而确保了规范不变性。\n3. 这明确了闭流形上高阶陈-西蒙斯作用量的高阶规范不变性，并指出在带边流形上所有规范依赖性均由边界项编码。", "summary_source": "deepseek", "authors": [{"name": "Danhua Song"}], "featured_authors": [{"name": "Danhua Song"}], "author_count": 1}, {"id": "2604.10559", "category": "math-ph", "title": "Periods of N-body Systems Determined Through Dimensional Analysis", "abstract": "Using augmented dimensional analysis to rule out several alternative generalizations, we provide mathematical justifications of conjectures by Sun on the period of a Newtonian orbital n-body system and by Semay and Sun on the quantum-theoretical counterpart of the period of an n-body system, both of which generalize corresponding results for two-body systems.", "url": "https://arxiv.org/abs/2604.10559", "type": "理论", "summary": "1. 该工作运用增强的量纲分析方法，为Sun关于牛顿轨道n体系统周期的猜想以及Semay和Sun关于其量子理论对应物的猜想提供了数学证明。\n2. 该方法的关键在于通过系统性的量纲排除，否定了其他可能的推广形式，从而确立了从二体到n体系统周期标度律的普适性。\n3. 这为将量纲分析严格应用于更复杂的经典与量子多体问题，以及检验相关数值与理论结果的普适性提供了清晰的框架。", "summary_source": "deepseek", "authors": [{"name": "Dan Jonsson"}], "featured_authors": [{"name": "Dan Jonsson"}], "author_count": 1}, {"id": "2604.10838", "category": "math-ph", "title": "No-Go Theorem for Quasiparticle BEC", "abstract": "We discuss a no-go theorem for Bose-Einstein condensation (BEC) of quasiparticles (phonons) from the viewpoint of operator algebras, using the van Hove model. The $\\beta$-KMS states of the van Hove model satisfy the self-consistency condition of arXiv:1207.4621 . However, the self-consistency condition is a constraint concerning the definition of the field, and is insufficient to establish the no-go theorem for BEC. In this paper, we prove the no-go theorem for BEC via two routes. First, imposing time cluster properties on the $\\beta$-KMS states precludes BEC. Second, under nonlinear dispersion with $s > 2$, the treatment of infrared divergences automatically reduces the algebra of physical observables, and BEC is mathematically excluded on the reduced algebra. In particular, the latter property admits an interpretation in terms of the ideal theory of the resolvent algebra.", "url": "https://arxiv.org/abs/2604.10838", "type": "理论", "summary": "1. 该工作利用范霍夫模型及算子代数，严格证明了声子等准粒子玻色-爱因斯坦凝聚的不可能性定理。\n2. 核心突破在于通过施加β-KMS态的时间团簇性质，以及在非线性色散下处理红外发散导致的物理可观测量代数约化，从两条路径数学上排除了凝聚。\n3. 这为代数量子场论中运用理想理论处理类似约束提供了范式，并对其他准粒子凝聚体系的理论构建具有明确启示。", "summary_source": "deepseek", "authors": [{"name": "Yoshitsugu Sekine"}], "featured_authors": [{"name": "Yoshitsugu Sekine"}], "author_count": 1}, {"id": "2604.11460", "category": "math-ph", "title": "Finite-difference zeta function regularisation and spectral weighting in effective actions", "abstract": "Standard zeta function regularisation enforces a scale-independent prescription for spectral aggregation, effectively fixing the relative weight of spectral contributions. We relax this constraint by replacing the derivative at $s=0$ with a finite-difference construction based on $\\zeta_{A}(0)$ and $\\zeta_{A}(q-1)$. In finite systems, it gives rise in the macroscopic limit to Tsallis-type quantities and a $q$-controlled information-geometric structure. In infinite dimensions, it yields an effective action whose variation $\\delta\\Gamma_{q}=\\mathrm{Tr}(A^{-q}\\delta A)$ realises scale-dependent spectral weighting. Within this framework, zeta function regularisation, effective action, nonextensive scaling, and information geometry emerge as manifestations of a common principle of finite-difference spectral aggregation.", "url": "https://arxiv.org/abs/2604.11460", "type": "理论", "summary": "1. 本研究通过将zeta函数正规化在s=0处的导数替换为基于ζ_A(0)和ζ_A(q-1)的有限差分构造，提出了一种广义谱加权方案。\n2. 该方法的关键优势在于实现了尺度依赖的谱加权，在有限系统中导出Tsallis型非广延量，在无限维情形下得到变分δΓ_q=Tr(A^{-q}δA)的有效作用量。\n3. 此框架首次将zeta正规化、有效作用量、非广延标度律与信息几何统一于有限差分谱聚合的共同原理之下，为量子场论与统计物理的交叉研究开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Keisuke Okamura"}], "featured_authors": [{"name": "Keisuke Okamura"}], "author_count": 1}, {"id": "2604.11464", "category": "math-ph", "title": "Passive two-plateau relaxation from Tricomi confluent hypergeometric kernels", "abstract": "Anomalous relaxation with memory spectra arises in disordered solids, soft matter, biological tissues and electrochemical interfaces. Fractional-order models capture broad power-law behaviour efficiently, but they can obscure spectral structure and are not always convenient for passive realisation or finite-dimensional simulation. We introduce a non-fractional passive framework based on the Tricomi confluent hypergeometric function, combined with a bounded Moebius normalisation that enforces prescribed low-frequency and high-frequency plateaux while preserving a broad dispersive transition. The resulting family contains the Debye and Cole-Cole responses as exact subcases, while extending them to asymmetric two-plateau dispersive laws with independently tunable low- and high-frequency exponents. For an admissible parameter range, we prove that the bounded block admits a Stieltjes representation with nonnegative spectral density, implying complete monotonicity, passivity, causality and compatibility with standard circuit and state-space descriptions. Building on this structure, we derive a passive Gauss-Stieltjes discretisation leading to Foster-type rational approximations and first-order state-space realisations with positive poles and residues. Numerical experiments show convergence of these finite-dimensional approximations across moderate-memory and long-tail regimes, enabling passive reduced-order representations of broad-memory responses. The framework is then validated on broadband dielectric data and battery electrochemical impedance spectra. In tissues, multi-block Tricomi mixtures improve complex-domain fitting accuracy relative to classical Cole-Cole baselines while preserving interpretable modal structure.", "url": "https://arxiv.org/abs/2604.11464", "type": "理论", "summary": "1. 本研究基于Tricomi合流超几何函数构建了一个非分数阶无源框架，用于描述具有低、高频双平台特征的异常弛豫响应。\n2. 通过有界Möbius归一化技术，该模型能独立调控高低频指数，在保持严格Stieltjes表示与无源因果性的前提下，统一并拓展了Debye与Cole-Cole模型。\n3. 该框架导出的有理逼近与状态空间实现为宽记忆响应的无源降阶建模提供了精确工具，有望在介电谱、电化学阻抗等领域替代传统经验模型。", "summary_source": "deepseek", "authors": [{"name": "Marc Tudela-Pi"}, {"name": "Ivano Colombaro"}], "featured_authors": [{"name": "Marc Tudela-Pi"}, {"name": "Ivano Colombaro"}], "author_count": 2}, {"id": "2604.11612", "category": "math-ph", "title": "Feynman's linear divergence problem", "abstract": "First, we consider generalized wave and scattering operators and derive modifications of commutation relations (between scattering operators and unperturbed operators) when the corresponding deviation factors behave as $\\exp\\{i t {\\mathcal C}_{\\pm}\\}$ for $t\\to \\pm \\infty$. Then, we construct so called secondary generalized scattering operators for the related case of linear divergence in QED, which gives a positive answer (in that case) to the well-known problem of J. R. Oppenheimer regarding scattering operators in QED: \"Can the procedure be freed of the expansion in $\\varepsilon$ and carried out rigorously?\"", "url": "https://arxiv.org/abs/2604.11612", "type": "理论", "summary": "1. 该论文研究了广义波算符与散射算符，推导了当偏差因子以exp{i t C_±}形式渐近时对易关系的修正，并针对量子电动力学中的线性发散问题构造了次级广义散射算符。\n2. 其技术核心在于通过处理时间无穷极限下的偏差因子，实现了散射算符与未微扰算符对易关系的严格修正，从而在线性发散情形中避免了ε展开。\n3. 这为奥本海默关于QED散射理论能否脱离微扰展开并严格实施的长期问题提供了肯定答案，为非微扰量子场论的散射算符研究奠定了新基础。", "summary_source": "deepseek", "authors": [{"name": "Alexander Sakhnovich"}, {"name": "Lev Sakhnovich"}], "featured_authors": [{"name": "Alexander Sakhnovich"}, {"name": "Lev Sakhnovich"}], "author_count": 2}, {"id": "2604.11756", "category": "math-ph", "title": "Trapped bosons in mean field QED, nonlinear resonance cascades and dynamical BEC formation", "abstract": "In this paper, we study a system of bosons trapped in a confining potential, interacting with a quantized field of coherent photons in the mean field description of non-relativistic Quantum Electrodynamics (QED) obtained by [N. Leopold and P. Pickl , 2017]. We derive the effective nonlinear cascade equations governing the emission and absorption of coherent photons by the boson subsystem in a combined weak-coupling and kinetic-scaling limit. We demonstrate that solutions to this nonlinear cascade describe a monotone decreasing energy flow in the boson subsystem. Thereby, we prove that a Bose-Einstein condensate (BEC) forms dynamically, under conservation of the total boson $L^2$ mass. We note that this process is crucially different from thermal relaxation to the ground state, and fundamentally depends on the nonlinear nature of the cascade dynamics.", "url": "https://arxiv.org/abs/2604.11756", "type": "理论", "summary": "1. 该工作研究了势阱中玻色子与量子化相干光场在平均场QED框架下的相互作用，推导了弱耦合与动力学标度极限下支配相干光子发射与吸收的非线性级联方程。\n2. 关键物理机制在于非线性共振级联导致玻色子子系统能量单向流动，从而在总粒子数守恒条件下严格证明了动力学BEC形成。\n3. 此非平衡凝聚机制显著区别于基态热弛豫，为开放量子系统中基于辐射场相互作用的玻色子动力学研究提供了新范式。", "summary_source": "deepseek", "authors": [{"name": "Thomas Chen"}, {"name": "Ali Mezher"}], "featured_authors": [{"name": "Thomas Chen"}, {"name": "Ali Mezher"}], "author_count": 2}, {"id": "2604.09735", "category": "quant-ph", "title": "Classical and Quantum Dynamics in an Information Theoretic Space", "abstract": "We study elementary classical and quantum dynamics in an information geometric space corresponding to a Bernoulli random variable, extending work by Goehle and Griffin [Chaos, Solitons & Fractals, 188, 115535, (2024)], who study the information theoretic analog of the spring-mass system. Information geometric constructions are useful in both statistical physics and in physical interpretations of Friston's free energy principle, a form of the Bayesian brain hypothesis. In this letter, we derive the spectrum for the Laplace-Beltrami operator in Bernoulli space and find Green's functions for the Helmholtz equation, which provides solutions to the wave, heat, and Poisson equations. We then show how to quantize momentum in Bernoulli space and obtain energies and wavefunctions for both a free particle and a variety of quantum (harmonic) oscillators in this space. In particular, we show that quadratic approximation of the Kullback-Leibler potential used by Goehle and Griffin results in a quantum oscillator in information space that is equivalent to a quantum pendulum in Euclidean space.", "url": "https://arxiv.org/abs/2604.09735", "type": "理论", "summary": "1. 该论文在伯努利信息几何空间中系统研究了经典与量子动力学，推导了拉普拉斯-贝尔特拉米算子的谱和亥姆霍兹方程的格林函数，从而提供波动、热及泊松方程的解，并实现了动量量子化以获得自由粒子与量子振子的能量和波函数。\n2. 其物理核心在于通过Kullback-Leibler势的二次近似，揭示了信息空间中的量子振子等价于欧几里得空间中的量子摆，建立了信息几何与经典物理系统的直接对应关系。\n3. 这为统计物理学中信息几何工具的应用、自由能原理的物理解释以及量子动力学在非传统空间中的进一步理论研究奠定了明确的基础和启发。", "summary_source": "deepseek", "authors": [{"name": "Sean Golder"}, {"name": "Christopher Griffin"}], "featured_authors": [{"name": "Sean Golder"}, {"name": "Christopher Griffin"}], "author_count": 2}, {"id": "2604.09766", "category": "quant-ph", "title": "Sector length distributions of recursively definable graph states through analytic combinatorics", "abstract": "The sector length distribution or Shor-Laflamme distribution (SLD) of quantum states is governed by the $k$-body correlations amongst the different systems, and has been used to study entanglement and error correction. A succinct description of a quantum state's SLD can be obtained by representing it through the coefficients of an appropriate weight enumerator polynomial, yielding bounds on fidelity under depolarizing noise and on multipartite entanglement. However, such expressions quickly grow out of hand and are generally difficult to achieve analytically, reflecting the computational hardness of the SLD. We sidestep this problem and, instead of a single state's SLDs, encode a family of quantum state's SLD as a generating function. We then find closed-form expressions for a large class of graph states which we call `recursively definable' and which include many common graphs such as path graphs, cycle graphs, star graphs, grid graphs, and more. As direct corollary, we obtain analytical expressions for such graph states' concentratable entanglement, bounds on their depolarizing fidelity, and a multipartite entanglement criterion. Our work opens up the use of generating functions and more generally analytic combinatorics to solve problems in quantum information theory.", "url": "https://arxiv.org/abs/2604.09766", "type": "理论", "summary": "1. 本研究将解析组合学中的生成函数方法应用于递归可定义图态的扇区长分布分析。\n2. 通过生成函数编码态族扇区长分布，为路径、环、星形等常见图态得到了闭式解及其可浓缩纠缠等衍生量。\n3. 这为将解析组合学系统性地应用于量子信息论中的态表征与纠缠分析开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Eloïc Vallée"}, {"name": "Kenneth Goodenough"}, {"name": "Paul E. Gunnells"}, {"name": "Tim Coopmans"}, {"name": "Jordi Tura"}], "featured_authors": [{"name": "Eloïc Vallée"}, {"name": "Kenneth Goodenough"}, {"name": "Paul E. Gunnells"}, {"name": "Tim Coopmans"}, {"name": "Jordi Tura"}], "author_count": 5}, {"id": "2604.09837", "category": "quant-ph", "title": "Planted-solution SAT and Ising benchmarks from integer factorization", "abstract": "We present a family of planted-solution benchmark instances for satisfiability (SAT) solvers and Ising optimization derived from integer factorization. Given two primes $p$ and $q$, the construction encodes the arithmetic constraints of $N = p \\times q$ as a conjunctive normal form (CNF) formula whose satisfying assignments correspond to valid factorizations of~$N$. The known pair $(p,q)$ serves as a built-in ground truth, enabling unambiguous verification of solver output. We show that for two $d$-bit primes the total number of carry contractions is on the order of $d^4$. Empirical benchmarks with SAT solvers show that median runtime grows exponentially in the bit-length of the factors over the range tested. The construction provides a scalable, structured, and verifiable benchmark family controlled by a single parameter, accompanied by open-source generation software.", "url": "https://arxiv.org/abs/2604.09837", "type": "数值", "summary": "1. 该工作提出了一类基于整数分解的可满足性问题（SAT）与伊辛优化基准实例，通过将素数乘积的算术约束编码为合取范式公式来生成。\n2. 其核心优势在于利用已知素数对作为内置真值，确保求解器输出的可验证性，并证明对于d位素数，进位收缩次数约为d^4量级。\n3. 这为评估经典与量子优化算法提供了可扩展、结构化且参数可控的基准体系，附带开源生成工具推动相关研究。", "summary_source": "deepseek", "authors": [{"name": "Itay Hen"}], "featured_authors": [{"name": "Itay Hen"}], "author_count": 1}, {"id": "2604.09847", "category": "quant-ph", "title": "A Polylogarithmic-Depth Quantum Multiplier", "abstract": "We present a quantum algorithm for multiplying two $n$-bit integers with overall circuit depth and $T$-depth both bounded by $O(\\log^{2} n)$, while using $O(n^{2})$ gates and ancillary qubits. Our construction generates partial products via indicator-controlled copying and adds them using a binary adder tree, enabling parallel accumulation with logarithmic depth overhead per level. To the best of our knowledge, our design has the lowest $T$-depth among all multiplication algorithms using the Clifford + $T$ model. By optimizing both circuit depth and $T$-depth, our construction advances the practical feasibility of large-scale fault-tolerant quantum algorithms.", "url": "https://arxiv.org/abs/2604.09847", "type": "理论+数值", "summary": "1. 该工作设计了一个电路深度和T深度均以O(log^2 n)为界的量子整数乘法算法。\n2. 其技术优势在于通过指示控制复制和二进制加法器树实现并行累积，在Clifford+T模型中具有最低T深度。\n3. 这通过同时优化深度提升了大规模容错量子算法的实际可行性。", "summary_source": "deepseek", "authors": [{"name": "Fred Sun"}, {"name": "Anton Borissov"}], "featured_authors": [{"name": "Fred Sun"}, {"name": "Anton Borissov"}], "author_count": 2}, {"id": "2604.09869", "category": "quant-ph", "title": "Q-PIPE A Practical Quantum Phase Encoding Method", "abstract": "A major hurdle in Quantum Image Processing (QIMP) is efficiently transferring classical, high-dimensional image data into quantum states. Current methods face trade-offs: amplitude encoding (FRQI) is computationally expensive in gate complexity and limited arithmetic capabilities, while basis encoding (NEQR) incurs heavy initialization overhead scaling with image resolution and intensity bit-depth. Frequency-domain approaches further demand complex transformations for basic pixel-wise arithmetic and extensive post-processing to reconstruct pixel information. To address the lack of practical phase encodings, we introduce Q-PIPE (Quantum-Gray Phase Injection for Pixel Encoding). Exploiting the quantum phase kickback mechanism and optimized spatial traversal via a Gray-code sequence, Q-PIPE efficiently maps continuous intensity values into the computational basis with an elementary gate count of $O(qN)$ a $O(\\text{log}N)$ improvement over standard basis encoding. Operating directly in the phase domain enables native computation of finite differences without deep arithmetic circuits. Classical readout vulnerabilities, including phase aliasing and spectral leakage, are mitigated by mapping inputs to $[-\\pi, \\pi]$ and introducing a probability threshold equation that scales inversely with the dimension of the spatial register. A proof-of-concept performing Quantum Edge Detection (QED) via directional derivatives demonstrates strong accuracy, yielding exact reconstructions for quantized inputs and low Mean Absolute Error (MAE) for continuous data across multiple benchmark datasets. Ultimately, Q-PIPE establishes a highly parallelizable, NISQ-compatible subroutine that advances quantum computer vision while reducing input/output (I/O) data-loading overhead in broader Quantum Machine Learning (QML) workflows.", "url": "https://arxiv.org/abs/2604.09869", "type": "理论+数值", "summary": "1. 该工作提出了一种名为Q-PIPE的量子相位编码方法，用于高效地将经典高维图像数据映射为量子态。\n2. 其核心创新在于利用量子相位回馈机制与格雷码优化的空间遍历，以O(qN)的门复杂度实现强度值编码，并支持在相位域内原生计算有限差分。\n3. 这为噪声中等规模量子设备提供了一个高度可并行化的数据加载子程序，有望显著降低量子机器学习工作流中的输入/输出开销。", "summary_source": "deepseek", "authors": [{"name": "Brian García Sarmina"}, {"name": "Emmanuel Martínez-Guerrero"}, {"name": "Janeth De Anda Gil"}, {"name": "Sun Guo-Hua"}, {"name": "Dong Shi-Hai"}], "featured_authors": [{"name": "Brian García Sarmina"}, {"name": "Emmanuel Martínez-Guerrero"}, {"name": "Janeth De Anda Gil"}, {"name": "Sun Guo-Hua"}, {"name": "Dong Shi-Hai"}], "author_count": 5}, {"id": "2604.09888", "category": "quant-ph", "title": "Detuning-Controlled Phase Transition from Passive to Active Regimes in Non-Markovian Quantum Batteries", "abstract": "We investigate a two-qubit quantum battery where coherent charger-battery coupling competes with non-Markovian environmental interactions. By tuning the coupling strengths and detuning, we identify regimes in which environmental memory enhances energy storage and charging power, while strong dissipation suppresses ergotropy by driving the battery into passive states. We show that detuning plays a dual role: reducing dissipation and inducing a phase shift in the memory kernel that controls the interference between coherent energy exchange and environment-induced backflow. As a result, although the stored energy varies smoothly, the extractable work exhibits a discontinuous onset at a critical detuning, signaling a first-order phase transition in ergotropy. The corresponding phase diagram in the coupling-detuning plane reveals a sharp boundary between thermodynamically inactive and work-producing regimes. Our results demonstrate that phase-controlled coherence and non-Markovianity provide a powerful mechanism for optimizing work extraction in open quantum batteries, offering practical strategies for noise-resilient quantum energy storage.", "url": "https://arxiv.org/abs/2604.09888", "type": "理论+数值", "summary": "1. 该工作研究了两比特量子电池中相干充电与非马尔可夫环境相互作用的竞争，通过调控耦合强度与失谐，揭示了环境记忆增强储能与功率的机制。\n2. 其核心发现是失谐具有双重作用：抑制耗散并诱导记忆核相移，从而调控相干能量交换与环境回流间的干涉，导致可提取功在临界失谐处发生不连续跃变。\n3. 这为实现基于相位调控相干性与非马尔可夫性的噪声鲁棒量子能量存储提供了新原理，并为开放量子电池的功提取优化开辟了可操作的相图设计思路。", "summary_source": "deepseek", "authors": [{"name": "Meysam Helmi Barati Farimani"}, {"name": "Ali Mortezapour"}], "featured_authors": [{"name": "Meysam Helmi Barati Farimani"}, {"name": "Ali Mortezapour"}], "author_count": 2}, {"id": "2604.09892", "category": "quant-ph", "title": "Enhanced dissipative criticality at an exceptional point", "abstract": "Exceptional points (EPs) represent non-Hermitian degeneracies where eigenvalues and eigenvectors coalesce, giving rise to enhanced sensitivity and critically damped dynamics. We demonstrate that when an EP coincides with a dissipative phase transition in an extended open Dicke model of two cavities coupled to a collective spin, the critical fluctuations are strongly amplified and governed by modified critical exponents. Numerical results reveal enhanced critical scaling in both the normal and superradiant phases, in agreement with an analytical theory based on EP-induced Jordan-block dynamics. Our results establish EPs as a mechanism to engineer critical scaling in open quantum systems, with potential applications to critical quantum sensing.", "url": "https://arxiv.org/abs/2604.09892", "type": "理论+数值", "summary": "1. 该研究通过在两个腔场耦合集体自旋的扩展开放Dicke模型中，实现了异常点与耗散相变在参数空间中的重合。\n2. 核心物理发现是，异常点诱导的乔丹块动力学使临界涨落显著放大，并导致普适类发生改变，数值模拟与解析理论在两类相中均证实了增强的临界标度行为。\n3. 这确立了异常点可作为调控开放量子系统临界标度的普适机制，为基于临界增强的量子传感等应用提供了新路径。", "summary_source": "deepseek", "authors": [{"name": "Jongjun M. Lee"}], "featured_authors": [{"name": "Jongjun M. Lee"}], "author_count": 1}, {"id": "2604.09900", "category": "quant-ph", "title": "Inequivalence of Landau-Lifshitz and Landau-Lifshitz-Gilbert dynamics for a single quantum spin", "abstract": "We examine the relation between the quantum Landau-Lifshitz equation ($q$-LL) [Phys. Rev. Lett. 110, 147201 (2013)] and quantum Landau-Lifshitz-Gilbert equation ($q$-LLG) [Phys. Rev. Lett. 133, 266704 (2024)]; two non-linear purity preserving master equations that extend classical atomistic spin dynamics into the quantum regime. While the classical LL and LLG counterparts for any number of spins are known to be equivalent, i.e., give identical spin trajectories up to a rescaling of the time parameter, the quantum formulations are equivalent only in certain cases, such as for pure states or for arbitrary single spin-$\\frac{1}{2}$ states. Here, we demonstrate that this equivalence breaks down even at the level of a single spin, provided $s \\geq 1$. Focusing on a spin-1 particle in an anisotropic crystal field, we show that the $q$-LL and $q$-LLG equations generate inequivalent time evolution. We introduce temporal rescaling misfits that quantify the inequivalence of the two types of dynamics. Although our results highlight fundamental differences in dissipation mechanisms encoded in these equations, the resulting trajectories remain qualitatively similar for this system.", "url": "https://arxiv.org/abs/2604.09900", "type": "理论", "summary": "1. 本文研究了描述单量子自旋的量子朗道-利夫希茨方程与量子朗道-利夫希茨-吉尔伯特方程之间的动力学不等价性。\n2. 研究通过引入时间重标度失配参数，定量揭示了这两种纯度保持主方程在自旋s≥1时即产生不可忽略的轨迹差异，突显了其内禀耗散机制的根本不同。\n3. 这一发现促使未来在构建更普适的量子自旋动力学模型时，需审慎选择主方程形式，并对相关量子器件的退相干模拟具有明确启示。", "summary_source": "deepseek", "authors": [{"name": "Yuefei Liu"}, {"name": "Olle Eriksson"}, {"name": "Erik Sjöqvist"}], "featured_authors": [{"name": "Yuefei Liu"}, {"name": "Olle Eriksson"}, {"name": "Erik Sjöqvist"}], "author_count": 3}, {"id": "2604.09915", "category": "quant-ph", "title": "Phase-enhanced excitations in pumped collective nuclear systems", "abstract": "The quantum dynamics of an externally driven ensemble of nuclear two-level systems embedded in a leaky broadband cavity is investigated theoretically. In the considered scenario both the nuclear ensemble and the cavity mode are coherently pumped by two externally applied x-ray electromagnetic fields. When the frequencies of the applied coherent fields are identical, cross-correlations among the existing decay channels increase the nuclear excitation probabilities depending on the phase difference of the applied fields. Our results show that the excited state of the nuclear ensemble may exhibit sub- to super-Poissonian nuclear statistics, demonstrating induced correlations during photon absorption or emission processes. The role of cross-correlations for the superradiant decay and the collective Lamb shift of the ensemble is also investigated.", "url": "https://arxiv.org/abs/2604.09915", "type": "理论", "summary": "1. 该工作理论上研究了被双外场相干泵浦的核二能级系综在泄漏宽带腔中的量子动力学。\n2. 其核心发现是，当泵浦频率相同时，通道间的交叉关联能通过外场相位差调控核激发概率，并使激发态呈现亚泊松至超泊松统计。\n3. 这为通过调控关联与相位来操纵核系综的超辐射衰变与集体兰姆位移等集体量子效应提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Mihai A. Macovei"}, {"name": "Fabian Richter"}, {"name": "Adriana Pálffy"}], "featured_authors": [{"name": "Mihai A. Macovei"}, {"name": "Fabian Richter"}, {"name": "Adriana Pálffy"}], "author_count": 3}, {"id": "2604.09956", "category": "quant-ph", "title": "Logical Compilation for Multi-Qubit Iceberg Patches", "abstract": "Recent advancements in quantum computing have enabled practical use of quantum error detecting and correcting codes. However, current architectures and future proposals of quantum computer design suffer from limited qubit counts, necessitating the use of high-rate codes. Such codes, with their code parameters denoted as $[[n, k, d]]$, have more than $1$ logical qubit per code (i.e., $k > 1$). This leads to reduced error tolerance of the code, since $\\lceil (d-1)/2\\rceil$ errors on any of the $n$ physical qubits can affect the logical state of all $k$ logical qubits. Therefore, it becomes critical to optimally map the input qubits of a quantum circuit to these codes, in such a way that the circuit fidelity is maximized. \\par However, the problem of mapping program qubits to logical qubits for high-rate codes has not been studied in prior work. A brute force search to find the optimal mapping is super exponential (scaling as $O(n!)$, where $n$ is the number of input qubits), making exhaustive search infeasible past a small number of qubits. We propose a framework that addresses this problem on two fronts: (1) for any given mapping, it performs logical-to-physical compilation that translates input gates into efficiently encoded implementations utilizing Hadamard commutation and gate merging; and (2) it quickly searches the space of possible mappings through a merge-optimizing, noise-biased packing heuristic that identifies high-performing qubit assignments without exhaustive enumeration. To the best of our knowledge, our compiler is the first work to explore mapping and compilation for high-rate codes. Across 71 benchmark circuits, we reduce circuit depth by $34\\%$, gate counts by up to $31\\%$ and $17\\%$ for one-qubit and two-qubit gates, and improve total variation distance by $1.75\\times$, with logical selection rate improvements averaging $86\\%$ relative to naive compilation.", "url": "https://arxiv.org/abs/2604.09956", "type": "理论+数值", "summary": "1. 该工作为高码率量子纠错码中的逻辑比特映射问题提出了首个编译框架。\n2. 其核心贡献在于结合了利用Hadamard对易性的门编译优化与基于噪声偏置的启发式搜索，高效实现了量子线路的深度与门数削减。\n3. 这项工作为在有限物理比特资源下实现高保真度逻辑层量子计算提供了切实可行的编译方案，并确立了针对多逻辑比特编码的优化基准。", "summary_source": "deepseek", "authors": [{"name": "Cordell Mazzetti"}, {"name": "Sayam Sethi"}, {"name": "Rich Rines"}, {"name": "Pranav Gokhale"}, {"name": "Jonathan Mark Baker"}], "featured_authors": [{"name": "Cordell Mazzetti"}, {"name": "Sayam Sethi"}, {"name": "Rich Rines"}, {"name": "Pranav Gokhale"}, {"name": "Jonathan Mark Baker"}], "author_count": 5}, {"id": "2604.09980", "category": "quant-ph", "title": "A parallel and distributed fixed-point quantum search algorithm for solving SAT problems", "abstract": "Boolean satisfiability (SAT) problem is of fundamental importance in computer science and many application domains. For Grover's algorithm, solving the SAT problem requires $\\mathcal{O}(\\sqrt{2^n})$ queries--where n denotes the number of logic variables in the problem. However, Grover's algorithm suffers from the Souffle problem: specifically, when the number of solutions is unknown, terminating the algorithm too early or too late leads to a significant reduction in the probability of obtaining a solution. In this paper, we propose a parallel fixed-point (PFP) search algorithm to solve the SAT problem. By exploiting entanglement, each clause in the conjunctive normal form (CNF) formula can be processed independently, leading to a significant reduction in circuit depth. We also discuss how to perform the algorithm in distributed manner. These make the PFPS algorithm particularly suitable for the noisy intermediate-scale quantum (NISQ) era.", "url": "https://arxiv.org/abs/2604.09980", "type": "理论+数值", "summary": "1. 本文提出了一种用于求解可满足性问题的并行定点量子搜索算法。\n2. 其技术核心在于利用纠缠使合取范式中的各子句可被独立处理，从而显著降低电路深度。\n3. 该算法支持分布式执行，为其在含噪声中等规模量子器件上的应用提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "He Wang"}, {"name": "Jinyang Yao"}], "featured_authors": [{"name": "He Wang"}, {"name": "Jinyang Yao"}], "author_count": 2}, {"id": "2604.10122", "category": "quant-ph", "title": "Unitary Designs from Two Chaotic Hamiltonians and a Random Pauli Operation", "abstract": "The realization of unitary designs is of fundamental interest in quantum science and typically requires the ability to implement structured quantum circuits. Recent developments have explored the possibility of generating unitary designs using only a small number of quantum quenches, in which the evolution during each interval is governed by a static Hamiltonian. In particular, it has been established that at least three chaotic Hamiltonians are required when only Hamiltonian evolutions are employed. In this work, we propose the emergence of unitary designs in the temporal ensemble of qubit systems evolved under two distinct chaotic Hamiltonians for sufficiently long times, supplemented by an intermediate random Pauli operation inserted between them. This result follows from the universal Pauli spectrum of chaotic Hamiltonians, a central concept in the study of non-stabilizerness. Our theoretical predictions are verified numerically using explicit examples, including Gaussian unitary ensemble Hamiltonians and random spin models. We further investigate finite-time and finite-size corrections to the protocol. Our results provide new insights into the dynamical generation of quantum randomness and offer a new route toward realizing unitary designs in chaotic systems.", "url": "https://arxiv.org/abs/2604.10122", "type": "理论+数值", "summary": "1. 该工作提出了一种仅需两个混沌哈密顿量及其中间插入的随机泡利操作，即可通过长时间演化产生幺正设计的协议。\n2. 其核心机制依赖于混沌哈密顿量的普适泡利谱这一与非稳定子性相关的关键性质，从而突破了此前需至少三个哈密顿量的限制。\n3. 该结果为在混沌系统中动力学生成量子随机性提供了新途径，并对考虑有限时间和有限尺寸效应的实际实现具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Ning Sun"}, {"name": "Pengfei Zhang"}], "featured_authors": [{"name": "Ning Sun"}, {"name": "Pengfei Zhang"}], "author_count": 2}, {"id": "2604.10128", "category": "quant-ph", "title": "A Framework for Predicting Entanglement Spectra of Gapless Symmetry-Protected Topological States in One Dimension", "abstract": "The concept of gapped symmetry-protected topological (SPT) states has been generalized to gapless SPT (gSPT) states. Similar to gapped SPT states, gSPT states in one dimension exhibit universal degeneracies in their entanglement spectra. The entanglement spectra of gSPT states are further described by boundary conformal field theories, whose systematic prediction is a key open question. To address this problem, we focus on the class of gSPT states that are obtained by applying unitary SPT entanglers to trivial, critical states in one dimension. We find that the reduced density matrix of a non-trivial gSPT state can be obtained, either exactly or approximately, by applying a quantum channel to the reduced density matrix of the trivial gSPT state. This quantum channel acts only near the entanglement cut and modifies its corresponding conformal boundary condition, allowing us in turn to predict the boundary conformal field theory describing the entanglement spectra. We apply this framework to gSPT states protected by various symmetries and having different central charges, and further analyze the stability of boundary conditions of the entanglement cut. Our work thereby provides a framework for systematically analyzing and understanding the entanglement spectra of gSPT states.", "url": "https://arxiv.org/abs/2604.10128", "type": "理论", "summary": "1. 该研究构建了一个解析框架，用于系统预测一维无能隙对称保护拓扑态的纠缠谱及其对应的边界共形场论。\n2. 其核心在于，通过将SPT缠绕子作用于平凡临界态得到的非平凡gSPT态，其约化密度矩阵可由一个仅作用于纠缠截断附近的局域量子信道从平凡态的约化密度矩阵获得，从而修改共形边界条件。\n3. 此框架适用于不同对称性与中心荷的体系，并分析了边界条件的稳定性，为系统研究更广泛的强关联无能隙拓扑态的纠缠性质及其高维推广奠定了基础。", "summary_source": "deepseek", "authors": [{"name": "Wen-Tao Xu"}, {"name": "Frank Pollmann"}, {"name": "Michael Knap"}], "featured_authors": [{"name": "Wen-Tao Xu"}, {"name": "Frank Pollmann"}, {"name": "Michael Knap"}], "author_count": 3}, {"id": "2604.10155", "category": "quant-ph", "title": "Encrypted clones can leak: Classification of informative subsets in Quantum Encrypted Cloning", "abstract": "Encrypted cloning enables the redundant storage of an unknown qubit while remaining compatible with the no-cloning theorem, since only one clone can later be recovered through key-consuming decryption. Because encryption in this protocol is introduced to enable cloning-compatible redundancy rather than to guarantee confidentiality by design, its secrecy properties must be assessed explicitly. Here we classify the subsets of the encrypted-clone storage register into authorized, completely non-informative, and partially informative sets. We show that intermediate non-authorized subsets may retain only a restricted residual dependence on the input state, and we characterize exactly when this dependence occurs. The resulting leakage pattern is parity-dependent, revealing a structural confidentiality limitation of encrypted cloning.", "url": "https://arxiv.org/abs/2604.10155", "type": "理论", "summary": "1. 该工作系统分析了量子加密克隆协议中存储寄存器子集的信息可获取性，将其分类为授权集、完全无信息集和部分信息集。\n2. 研究揭示了非授权子集对输入态存在残余依赖性的精确条件，其泄露模式具有奇偶依赖性，这暴露了加密克隆协议固有的保密性结构局限。\n3. 这一分类框架为量子保密通信和分布式存储中冗余编码方案的安全性评估提供了明确的理论依据，提示需重新审视依赖后处理加密的克隆协议的设计前提。", "summary_source": "deepseek", "authors": [{"name": "Gabriele Gianini"}, {"name": "Omar Hasan"}, {"name": "Corrrado Mio"}, {"name": "Stelvio Cimato"}, {"name": "Ernesto Damiani"}], "featured_authors": [{"name": "Gabriele Gianini"}, {"name": "Omar Hasan"}, {"name": "Corrrado Mio"}, {"name": "Stelvio Cimato"}, {"name": "Ernesto Damiani"}], "author_count": 5}, {"id": "2604.10428", "category": "quant-ph", "title": "Worst-case Harrow-Hassidim-Lloyd algorithm with average-case correct quantum Fourier transform", "abstract": "In [\\href{ this https URL }{Quantum 6, 872, 2022}], Linden and de Wolf proposed a lightweight protocol for verifying the average-case correct behavior of the quantum Fourier transform (QFT). They proved that good average-case QFT performance suffices for good worst-case performance in several quantum tasks. Here we provide another application of this worst-case-to-average-case reduction, using a strengthened Linden-de Wolf protocol. We show that, across three distinct scenarios, the Harrow-Hassidim-Lloyd algorithm can be executed with provably good worst-case performance, assuming only that the QFT is correct on average.", "url": "https://arxiv.org/abs/2604.10428", "type": "数值", "summary": "1. 该工作将最坏情况到平均情况的规约应用于Harrow-Hassidim-Lloyd算法，并扩展了Linden-de Wolf协议。\n2. 其技术关键在于证明了仅在量子傅里叶变换平均正确的前提下，该算法在三种不同场景中仍能保证最坏情况下的良好性能。\n3. 这为基于平均行为验证的量子算法性能保障框架提供了新的应用场景和理论支持。", "summary_source": "deepseek", "authors": [{"name": "Changpeng Shao"}], "featured_authors": [{"name": "Changpeng Shao"}], "author_count": 1}, {"id": "2604.10562", "category": "quant-ph", "title": "The spontaneous disentanglement hypothesis and causality", "abstract": "The hypothesis that disentanglement spontaneously occurs in quantum systems is motivated by some outstanding issues in the foundations of quantum mechanics. However, for some cases, spontaneous disentanglement enables the violation of the causality principle. To mitigate the conflict with causality, a formulation for the hypothesis, which is based on the maximum entropy principle, is proposed. The method of Lagrange multipliers is implemented to ensure consistency with causality. The proposed formulation is applicable for any quantum system having a Hilbert space of finite dimensionality.", "url": "https://arxiv.org/abs/2604.10562", "type": "理论", "summary": "1. 本文针对量子系统中自发退纠缠假说与因果性原理的潜在冲突，提出了基于最大熵原理的表述框架。\n2. 其技术核心在于引入拉格朗日乘子方法，系统性地约束退纠缠过程以确保因果性不被破坏。\n3. 该表述适用于所有有限维希尔伯特空间的量子系统，为协调基础量子理论与因果结构提供了普适的规范路径。", "summary_source": "deepseek", "authors": [{"name": "Eyal Buks"}], "featured_authors": [{"name": "Eyal Buks"}], "author_count": 1}, {"id": "2604.10625", "category": "quant-ph", "title": "Symplectic Constraints in Quantum Reaction Dynamics: Squeezed-State Suppression and Candidate Width Scales", "abstract": "Classical reaction dynamics suggests transport through an index-1 saddle is organized not just by flux, but by local symplectic width scales of bounded proxy neighborhoods near the bottleneck. We investigate if a related geometric effect appears in the quantum regime for highly squeezed Gaussian wavepackets. Building on de Gosson's symplectic approach, we analyze how transverse bath-mode squeezing modifies transmission across a quantum normal-form (QNF) bottleneck. To avoid the instability of propagating states with extreme phase-space eccentricity, we use the Weyl-symbol formulation of the QNF. For the quadratic saddle-center model, we derive an exact baseline transmission formula by convolving the bath's squeezed-state number distribution with the 1D Kemble transmission factor. For anharmonic truncated QNF models, we enforce strict algebraic energy conservation and evaluate exact Gaussian expectation-value diagnostics of the Weyl symbol via Wick-Isserlis moment formulas. Results reveal a pronounced squeeze-induced suppression of transmission. As the squeezed state's bath-plane geometric scale grows relative to the classical candidate width, the expected bath action grows rapidly. Consequently, effective reactive energy is strongly depleted, driving transmission into a severely suppressed regime. We interpret this as evidence of a quantum geometric suppression mechanism consistent with the classical candidate symplectic-width picture. While not yet a rigorous quantum non-squeezing theorem, this work provides a concrete framework linking squeezed-state covariance geometry, normal-form action scales, and mode-specific quantum reactivity near an index-1 saddle.", "url": "https://arxiv.org/abs/2604.10625", "type": "理论+数值", "summary": "1. 该工作研究了高度压缩高斯波包在量子正则形式瓶颈处的透射，探讨了经典辛宽度尺度概念在量子区域的对应几何效应。\n2. 通过使用外尔符号表述并推导精确透射公式，揭示了横向浴模压缩导致有效反应能量耗竭，从而强烈抑制透射的量子几何机制。\n3. 这为将经典辛约束图像与近指数-1鞍点的模特异性量子反应性相联系，提供了一个基于压缩态协方差几何与作用量尺度的具体理论框架。", "summary_source": "deepseek", "authors": [{"name": "Stephen Wiggins"}], "featured_authors": [{"name": "Stephen Wiggins"}], "author_count": 1}, {"id": "2604.10651", "category": "quant-ph", "title": "Role of Asymmetry in the Performance Optimization of a Relativistic Quantum Otto Engine", "abstract": "We present an analytical study of the relativistic quantum Otto cycle driven by a time-dependent harmonic oscillator. By imposing an asymmetry on the two adiabatic processes of this cycle, we obtain distinct scenarios of sudden compression and sudden expansion, and analyze how asymmetry affects the performance of the relativistic quantum Otto engine. By leveraging the Omega function as a unified performance metric, we analytically characterize the efficiency in both scenarios. Our findings demonstrate that the efficiency approaches unity in the sudden compression case, while it is restricted to one-half for the sudden expansion case. Furthermore, we investigate the impact of increasing oscillator velocity on the extracted work and identify parameter regimes where either sudden compression or sudden expansion dominates. Additionally, we examine the optimal operating point using parametric efficiency-work plots, whose loop-shaped structure shows that increasing oscillator velocity enhances both work output and efficiency. Finally, through a detailed phase diagram analysis of the Otto cycle, we observe that the operational region corresponding to the engine mode expands with increasing oscillator velocity, while the refrigeration regime shrinks correspondingly.", "url": "https://arxiv.org/abs/2604.10651", "type": "理论+数值", "summary": "1. 本研究对时间依赖谐振子驱动的相对论量子奥托循环进行了理论解析，通过在两绝热过程中引入非对称性，构建了突然压缩与突然膨胀场景，系统分析了非对称性对引擎性能的优化作用。\n2. 其物理核心在于利用Omega函数作为统一性能指标，揭示出突然压缩时效率趋近于1而突然膨胀时效率上限为1/2，并阐明了振荡器速度对输出功和效率参数区间的支配影响。\n3. 基于参数效率-功图及相图分析，发现增加振荡器速度可同时提升功输出与效率并扩展引擎模式操作区，这为量子热机的性能优化与工作点设计提供了明确理论启示。", "summary_source": "deepseek", "authors": [{"name": "Monika"}, {"name": "Shishram Rebari"}], "featured_authors": [{"name": "Monika"}, {"name": "Shishram Rebari"}], "author_count": 2}, {"id": "2604.10762", "category": "quant-ph", "title": "An Information-Theoretic Bound on Thermodynamic Efficiency and the Generalized Carnot's Theorem", "abstract": "We derive a bound on the efficiency of thermal engines that can be sharper than Carnot's limit. It is a function of statistical correlations between the engine internal state and Hamiltonian, can be saturated even in finite-time cycles, and applies to both classical and quantum engines. Specifically, the bound establishes the exact maximal efficiency of engines operating with multiple baths, tightening the upper limit set by Carnot's theorem. Then, we show that an engine made of a quantum dot coupled with fermionic baths can achieve the bound, even when operating beyond the quasistatic regime. The result provides a design principle for realistic energy harvesting machines.", "url": "https://arxiv.org/abs/2604.10762", "type": "理论", "summary": "1. 该工作推导了热机效率的新型信息理论界限，该界限可比卡诺极限更严格，且适用于经典与量子多体系统。\n2. 其核心在于将效率上限与内态和哈密顿量间的统计关联相联系，并证明该界限在有限时间多热源循环中仍可达到饱和。\n3. 这为超越准静态区间的实际能量采集装置（如量子点热机）提供了明确的设计准则与优化方向。", "summary_source": "deepseek", "authors": [{"name": "Anna Gabetti"}, {"name": "Fabrizio Dolcini"}, {"name": "Davide Girolami"}], "featured_authors": [{"name": "Anna Gabetti"}, {"name": "Fabrizio Dolcini"}, {"name": "Davide Girolami"}], "author_count": 3}, {"id": "2604.10794", "category": "quant-ph", "title": "Symplectic perspective to quantum computing for Hamiltonian systems", "abstract": "This work develops a symplectic framework for quantum computing to be applied to classical Hamiltonian systems, exploiting the intrinsic geometric compatibility between unitary quantum evolution and symplectic phase-space dynamics in a two-fold way. The first part is devoted in establishing an exact correspondence between quantum evolution and classical Hamiltonian flow on a Kahler manifold. This correspondence enables a geometric quantization scheme that identifies a family of classical Hamiltonian systems admitting exponentially compressed quantum representations-appropriate for quantum simulation. In the second part we demonstrate that Liouville-integrable Hamiltonian dynamics induce finite-dimensional unitary evolution through action-angle variables and Koopman-von Neumann encoding. This allows efficient quantum representation and parallel evolution of large phase-space ensembles, where entangled encodings provide exponential compression in ensemble size and enable quantum speed-ups in observable estimation via amplitude estimation techniques. For non-integrable systems, Lie canonical perturbation theory is incorporated to construct near-symplectic transformations that map dynamics to approximately integrable forms, preserving unitary evolution up to a controlled error. We derive the resulting quantum computational complexity of the proposed quantum-symplectic scheme, revealing both an exponential compression in memory requirements and a potential polynomial speed-up with respect to the system size. Finally, the transport evolution equation governing the quantum phase-space observables is obtained.", "url": "https://arxiv.org/abs/2604.10794", "type": "理论+数值", "summary": "1. 该工作发展了应用于经典哈密顿系统的量子计算的辛几何框架。\n2. 其核心在于通过凯勒流形上的几何量子化方案，为可积系统实现了指数压缩的量子表示，并对非可积系统构建了受控误差的近似的幺正演化。\n3. 这为利用量子算法模拟经典动力系统并提供潜在计算加速，提供了一个系统性的几何途径。", "summary_source": "deepseek", "authors": [{"name": "Efstratios Koukoutsis"}, {"name": "Kyriakos Hizanidis"}, {"name": "Lucas I Inigo Gamiz"}, {"name": "Oscar Amaro"}, {"name": "Christos Tsironis"}, {"name": "Abhay K. Ram"}, {"name": "George Vahala"}], "featured_authors": [{"name": "Efstratios Koukoutsis"}, {"name": "Kyriakos Hizanidis"}, {"name": "Lucas I Inigo Gamiz"}, {"name": "Christos Tsironis"}, {"name": "Abhay K. Ram"}, {"name": "George Vahala"}], "author_count": 7}, {"id": "2604.10861", "category": "quant-ph", "title": "Training single-electron and single-photon stochastic physical neural networks", "abstract": "The computational demands of deep learning motivate the investigation of alternative approaches to computation. One alternative is physical neural networks~(PNNs), in which learning and inference are performed directly via physical processes. Stochastic PNNs arise when the underlying neurons are realized by the dynamics of a stochastic activation switch. Here we propose novel electronic and photonic stochastic neurons. The electronic realization is implemented by single-electron tunneling through a quantum dot. The photonic realization is implemented via a single-photon source driving one of two modes coupled via a controllable beam-splitter-like interaction. In the electronic case, the charge state of the quantum dot forms the basis for the stochastic neuron, whereas in the photonic case the occupation of the undriven mode serves as the basis for the stochastic neuron. Training of stochastic PNNs is performed with models of stochastic neurons, as well as with coherently-driven, single-photon detector stochastic neurons previously introduced. Several training strategies for MNIST handwritten digit classification have been investigated using single-hidden-layer stochastic PNNs, including varying the number of trials in each layer to control forward pass stochasticity and employing either true probability or empirical outputs in the backward pass to evaluate their influence on gradient estimation. We show that when empirical outputs are used in the backward pass, the network achieves more than 97\\% test accuracy with few trials per layer. Despite the simplicity of the model architecture, high test accuracy is maintained in the presence of a high degree of noise and model uncertainty. The results demonstrate the potential of embracing stochastic PNNs for deep learning.", "url": "https://arxiv.org/abs/2604.10861", "type": "理论+数值", "summary": "1. 该工作提出了基于单电子隧穿量子点与可控分束器耦合单光子源的新型随机物理神经元，并研究了在MNIST手写数字分类任务中单隐层随机物理神经网络的多种训练策略。\n2. 其创新在于分别利用量子点电荷态与未被驱动光学模式的占据作为随机神经元基础，并通过控制每层试验次数调节前向随机性，以及在后向传播中比较真实概率与经验输出对梯度估计的影响。\n3. 这为在深度学习中充分利用随机物理系统的内在噪声容错特性，以及开发基于量子载体的低功耗神经形态硬件提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Tong Dou"}, {"name": "Shiro Kumara"}, {"name": "Josh Burns"}, {"name": "Ethan Sigler"}, {"name": "Parth Girdhar"}, {"name": "David Petty"}, {"name": "Gerard Milburn"}, {"name": "Jo Plested"}, {"name": "Matt Woolley"}], "featured_authors": [{"name": "Tong Dou"}, {"name": "Shiro Kumara"}, {"name": "Josh Burns"}, {"name": "Gerard Milburn"}, {"name": "Jo Plested"}, {"name": "Matt Woolley"}], "author_count": 9}, {"id": "2604.10880", "category": "quant-ph", "title": "Effective schemes for fusion of hyperentangled W states", "abstract": "Hyperentangled states are fascinating resources in quantum information processing as they can significantly increase the channel capacity and enhance noise resistance. We explore a hyperfusion mechanism to fuse one n photon hyper-W state and one m-photon hyper-W state into a large-scale (n+m-2)-photon hyper-W state. Another mechanism to fuse one n-photon hyper-W state, one m-photon hyper-$W$ state, and one $t$-photon hyper-W state into an (n+m+t-3)-photon hyper-W state is also proposed. These two hyperfusion mechanisms are constructed employing only polarizing beam splitters, balanced beam splitters, half-wave plates, single-photon detectors, and cross-Kerr nonlinearities. Conditional quantum gates, path couplers, and ancillary photons are not required in our constructions. Moreover, our fused $W$ states are hyperentangled in the polarization and spatial degrees of freedom of single-photon systems. The presence of only one garbage output state demonstrates that high efficiency can be achieved in our schemes.", "url": "https://arxiv.org/abs/2604.10880", "type": "理论", "summary": "1. 该工作提出了两种高维超纠缠W态的融合方案，可将小规模超纠缠W态高效组合为大规模超纠缠W态。\n2. 方案仅需常规线性光学元件与交叉克尔非线性介质，无需辅助光子或条件量子门，且仅产生一个废弃态，显著提升了实验可行性与效率。\n3. 这为基于偏振-路径自由度超纠缠的大规模多光子W态制备提供了高效且可扩展的途径，有望推动量子网络与分布式量子计算的发展。", "summary_source": "deepseek", "authors": [{"name": "Wen-Xiu Zhang"}, {"name": "Wen-Qiang Liu"}, {"name": "Hai-Rui Wei"}], "featured_authors": [{"name": "Wen-Xiu Zhang"}, {"name": "Wen-Qiang Liu"}, {"name": "Hai-Rui Wei"}], "author_count": 3}, {"id": "2604.10886", "category": "quant-ph", "title": "The non-local Hong-Ou-Mandel effect", "abstract": "Two-photon interference effects arise because photons are indistinguishable particles. In the wellknown Hong-Ou-Mandel (HOM) effect, the transmission of two photons at a beam splitter interferes destructively with the reflection of both photons, requiring both photons to \"bunch up\" by leaving the beam splitter on the same side. Here, we show that the interference between locally propagating photons and photons exchanged by a mode swap can be implemented by post-selecting spatially separated photon outputs of a four-path interferometer. Even though the photons detected at spatially separated locations must have travelled along paths that never met up at the same beam splitter, the Hong-Ou-Mandel effect can be observed in correlations between the output ports that originate from the association of detection events with non-local output modes defined by the two single photon inputs. Local phase shifts can be used to map out non-classical correlations between the photons detected at different output locations, clarifying the role of linear optics in generating entanglement between spatially separated photons. Our work thus establishes a fundamental relation between multiphoton interference and entanglement, opening the door to new possibilities in optical quantum technologies.", "url": "https://arxiv.org/abs/2604.10886", "type": "理论", "summary": "1. 双光子干涉效应的产生是因为光子是无法区分的粒子。\n2. 因此，我们的工作建立了多光子干涉和纠缠之间的基本关系，为光学量子技术的新可能性打开了大门。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Yuki Kodama"}, {"name": "Jonte R. Hance"}, {"name": "Holger F. Hofmann"}], "featured_authors": [{"name": "Yuki Kodama"}, {"name": "Jonte R. Hance"}, {"name": "Holger F. Hofmann"}], "author_count": 3}, {"id": "2604.11022", "category": "quant-ph", "title": "SPATE: Spiking-Phase Adaptive Temporal Encoding for Quantum Machine Learning", "abstract": "Most quantum machine learning (QML) pipelines still rely on static encodings such as angle and amplitude maps, and this limits their ability to handle temporal information. To address this limitation, this paper uses spike-based data representation as an effective encoding mechanism that incorporates temporal structure into quantum feature preparation. Specifically, we propose Spiking-Phase Adaptive Temporal Encoding (SPATE), a novel spike-driven temporal encoding method that converts real-valued tabular features into leaky integrate-and-fire spike trains and maps spike statistics to quantum rotations, augmented with a small set of temporal qubits through controlled phase operations. An encoding-centric evaluation protocol is also introduced to assess representation quality independently of the classifier, covering centered kernel-target alignment (CKTA), Fisher-style separability, inter/intra-class distance ratios, silhouette score, normalized entropy, and pairwise total-variation (TVpair) collapse indicators. Under stratified cross-validation, SPATE yields stronger representations across multiple datasets. For example, SPATE reaches a CKTA of 0.966 and a Fisher score of 7.37 on Blobs, compared with a CKTA of 0.632 and a Fisher score of 0.70 using angle encoding, and achieves a CKTA of 0.506 on Moons, compared with 0.015 using angle or amplitude encoding. These gains translate into stronger hybrid quantum neural network performance within a fixed qubit budget across several tasks, including an accuracy of 0.826 and an AUC of 0.978 for Wine, as well as an accuracy of 0.840 and an AUC of 0.923 for Moons. These results demonstrate that SPATE provides a practical spike-to-phase interface for building more informative quantum feature representations under constrained resources.", "url": "https://arxiv.org/abs/2604.11022", "type": "理论+数值", "summary": "1. 该工作提出了SPATE，一种基于脉冲相位自适应时序编码的量子机器学习特征映射方法，将实数值特征转换为脉冲序列并映射到量子旋转操作。\n2. 其技术核心在于通过泄露积分激发脉冲生成机制和受控相位操作引入时序量子比特，实现了数据时空结构到量子特征的高效编码。\n3. 这为在有限量子比特资源下构建更具表达力的量子特征表示提供了可行路径，推动了时序敏感量子机器学习框架的发展。", "summary_source": "deepseek", "authors": [{"name": "Nouhaila Innan"}, {"name": "Rachmad Vidya Wicaksana Putra"}, {"name": "Muhammad Shafique"}], "featured_authors": [{"name": "Nouhaila Innan"}, {"name": "Rachmad Vidya Wicaksana Putra"}, {"name": "Muhammad Shafique"}], "author_count": 3}, {"id": "2604.11059", "category": "quant-ph", "title": "Automorphism-Induced Entanglement Bounds in Many-Body Systems", "abstract": "We derive an upper bound on the maximum balanced bipartite entanglement entropy of ground states of many-body Hamiltonians defined on a graph, agnostic to any particular model, that possesses a nontrivial automorphism group. We show that the entropy is bounded by the logarithm of a weighted sum of multiplicities of irreducible representations of the bipartition-preserving automorphism subgroup. This bound complements the known degeneracy-based bound, with neither universally dominating the other. For the complete graph $K_n$, the new bound yields an exponential improvement from linear to logarithmic scaling in the system size, consistent with the exact value of the entropy.", "url": "https://arxiv.org/abs/2604.11059", "type": "理论", "summary": "1. 该工作推导了具有非平凡自同构群的图结构多体哈密顿量基态平衡二分纠缠熵的普适上界。\n2. 其关键在于利用保持二分结构的自同构子群的不可约表示权重和的对数构造上界，对完全图$K_n$可实现从线性到对数尺度的指数改进。\n3. 这一与简并度上界互补的新理论框架，为分析对称性约束下多体系统纠缠结构提供了新的理论工具和研究方向。", "summary_source": "deepseek", "authors": [{"name": "Saikat Sur"}], "featured_authors": [{"name": "Saikat Sur"}], "author_count": 1}, {"id": "2604.11113", "category": "quant-ph", "title": "Schrödinger-Navier-Stokes Equation for the Quantum Simulation of Navier-Stokes Flows", "abstract": "The search for quantum-like wave formulations of the Navier-Stokes (Schrödinger-Navier-Stokes, SNS for short) equations describing classical dissipative fluids has met with increasing attention in the recent years, due to the large portfolio of potential applications in science and engineering. A SNS formulation of classical fluids was first presented in a largely un-noticed paper by Dietrich and Vautherin back in 1985(Journal de Physique). In this paper, we revisit this specific SNS approach and assess its viability for quantum implementations based on Carleman embedding/linearization techniques. Specifically, we i) Clarify in full mathematical detail why the SNS dissipator presents a steep challenge for quantum computers and propose a way out strategy based on the Hamilton-Jacobi (HJ) formulation of fluid dynamics; ii) Develop a corresponding quantum algorithm using a new technique based on a tensor-network representation of Carleman embedding of the HJ equations (CHJ) which permits substantial memory savings; iii) Emulate the CHJ quantum algorithm on a classical computer and analyse its convergence and accuracy for the specific case of Kolmogorov-like flows at moderate Reynolds numbers. To the best of our knowledge, this is the first quantum algorithm based on a quantum-like wave formulation of the genuine Navier-Stokes equations, including pressure, dissipation and vorticity.", "url": "https://arxiv.org/abs/2604.11113", "type": "理论+数值", "summary": "1. 该研究重新审视了Schrödinger-Navier-Stokes方程这一经典流体力学波形式表述，并系统评估了其基于Carleman嵌入技术的量子实现可行性。\n2. 其核心在于通过Hamilton-Jacobi流体表述规避耗散项量子化难题，并基于张量网络表示Carleman嵌入开发了具有显著内存优势的新型量子算法。\n3. 该工作为真实纳维-斯托克斯方程的量子模拟开辟了新途径，针对中等雷诺数流动的数值验证为进一步研究湍流等复杂流动现象奠定了基础。", "summary_source": "deepseek", "authors": [{"name": "Luca Cappelli"}, {"name": "Sauro Succi"}, {"name": "Monica Lacatus"}, {"name": "Alessandro Zecchi"}, {"name": "Alessandro Roggero"}], "featured_authors": [{"name": "Luca Cappelli"}, {"name": "Sauro Succi"}, {"name": "Monica Lacatus"}, {"name": "Alessandro Zecchi"}, {"name": "Alessandro Roggero"}], "author_count": 5}, {"id": "2604.11409", "category": "quant-ph", "title": "When T-Depth Misleads: Predicting Fault-Tolerant Quantum Execution Slowdown under Magic-State Delivery Constraints", "abstract": "The efficient execution of fault-tolerant quantum algorithms is fundamentally limited by the production rate of magic states required for non-Clifford operations. While circuit optimization typically targets T-depth, static T-depth does not reliably predict executable performance under bounded T-state delivery. We introduce a model that captures demand-supply imbalance using two key quantities: slack ratio, a structural indicator of scheduling flexibility, and Delta_max, a measure of cumulative demand surplus. We show that Delta_max is a strong schedule-level indicator of execution slowdown and yields a provable lower bound on executable makespan for a fixed schedule. Empirical evaluation on constructed directed acyclic graph (DAG) families, with arithmetic circuits and exact quantum Fourier transform (QFT) traces providing additional grounding, shows that slack ratio is a stronger structural predictor than T-depth for stall and inversion risk, while Delta_max is the strongest predictor of slowdown. Across 4,904 instances, the lower bound shows zero violations, with 88.9% of cases within one cycle. These results highlight the importance of explicitly modeling delivery constraints in fault-tolerant quantum compilation.", "url": "https://arxiv.org/abs/2604.11409", "type": "理论+数值", "summary": "1. 本文构建了一个量化容错量子算法执行中魔法态供应受限导致性能下降的模型，引入了空闲率与最大累计盈余两个关键指标。\n2. 模型证明了最大累计盈余可提供可执行工期下界，且实证表明该下界无违例，其预测性能优于传统T深度指标。\n3. 此工作揭示了显式建模资源传输约束的重要性，为容错量子编译器的调度优化提供了新的理论工具与评估基准。", "summary_source": "deepseek", "authors": [{"name": "Boshuai Ye"}, {"name": "Arif Ali Khan"}, {"name": "Peng Liang"}], "featured_authors": [{"name": "Boshuai Ye"}, {"name": "Arif Ali Khan"}, {"name": "Peng Liang"}], "author_count": 3}, {"id": "2604.11455", "category": "quant-ph", "title": "Noise-Induced Resurrection of Dynamical Skin Effects in Quasiperiodic Non-Hermitian Systems", "abstract": "The non-Hermitian skin effect (NHSE) refers to the accumulation of an extensive number of eigenstates at system boundaries under open boundary conditions (OBCs). As a dynamical consequence, wave packets in such systems drift and ultimately accumulate at a boundary, giving rise to the dynamical skin effect (DSE). While strong quasiperiodic potentials are known to suppress the DSE by inducing localization, we show that the introduction of Ornstein-Uhlenbeck (OU) noise unexpectedly restores it. Using perturbative analysis, we demonstrate that noise effectively maps the non-Hermitian Schrödinger dynamics onto a non-reciprocal master equation, whose complex spectrum develops a noise-induced point gap. This mechanism enables delocalization, reinstates directional transport, and revives the DSE even in regimes where the static NHSE is absent. Moreover, the relaxation dynamics exhibit a non-monotonic dependence on noise strength, reflecting a competition between noise-assisted delocalization and noise-induced decoherence. Our results uncover a noise-enabled mechanism for resurrecting the DSE and suggest a new route for controlling transport in quasiperiodic, open quantum systems.", "url": "https://arxiv.org/abs/2604.11455", "type": "理论", "summary": "1. 该工作揭示了在强准周期势抑制动力学趋肤效应的非厄米系统中，引入Ornstein-Uhlenbeck噪声能够意外地恢复波包定向输运与边界聚集现象。\n2. 其核心机制在于噪声将非厄米薛定谔动力学映射至非互易主方程，噪声诱导产生的点隙光谱有效抵消了局域化，从而重建了定向输运。\n3. 这一发现为通过噪声调控准周期开放量子系统的输运性质提供了新途径，并揭示了退局域化与噪声退相干竞争导致的非单调弛豫动力学。", "summary_source": "deepseek", "authors": [{"name": "Wuping Yang"}, {"name": "H. Huang"}], "featured_authors": [{"name": "Wuping Yang"}, {"name": "H. Huang"}], "author_count": 2}, {"id": "2604.11478", "category": "quant-ph", "title": "Accuracy-Cost Trade-offs for Reference VQE Calculations of H$_2$ on IBM Quantum Hardware", "abstract": "We present a hardware-validated reference dataset for variational ground-state energy calculations of the hydrogen molecule H\\(_2\\) on several IBM Quantum processors available in 2026. Using a standardized workflow, we benchmark the impact of shot count, backend choice, optimization strategy, and runtime variability on the achievable energy accuracy relative to exact diagonalization. The resulting dataset and analysis provide a transparent baseline for assessing the current capabilities and limitations of IBM Quantum hardware for quantum-chemistry applications, and are meant to ease the entry for new users by providing a comprehensive overview of choices and their effects as well as runtime efforts and costs that can be expected. Across the configurations studied here, circuit simplification through tapered mappings provides the most consistent accuracy gains, resilience level 1 improves accuracy at a substantial cost premium, and session-based execution yields no systematic accuracy advantage over single-job execution despite markedly higher billed time.", "url": "https://arxiv.org/abs/2604.11478", "type": "数值", "summary": "1. 本工作为2026年可用IBM量子处理器上的氢分子变分基态能量计算，建立了一套经硬件验证的参考数据集。\n2. 其技术关键在于系统量化了比特数、后端选择、优化策略及运行时波动对能量精度的影响，并揭示电路锥形映射能最稳定提升精度。\n3. 该数据集与分析为评估当前量子硬件在量子化学应用中的性能边界提供了透明基准，并为新用户的选择权衡与成本预期提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Julen Larrucea"}, {"name": "Marita Oliv"}, {"name": "Jeanette Lorenz"}], "featured_authors": [{"name": "Julen Larrucea"}, {"name": "Marita Oliv"}, {"name": "Jeanette Lorenz"}], "author_count": 3}, {"id": "2604.11532", "category": "quant-ph", "title": "Tackling instabilities of quantum Krylov subspace methods: an analysis of the numerical and statistical errors", "abstract": "Krylov subspace methods are among the most extensively studied early fault-tolerant quantum algorithms for estimating ground-state energies of quantum systems. However, the rapid onset of ill-conditioning might make accurate energies difficult or even impossible to retrieve. In this communication, we analyse the numerical stability and statistical problems of these methods using numerical simulations both in the presence and absence of sampling noise. While in ideal numerical simulations the generalized eigenvalue problem indeed becomes unstable with increased Krylov subspace size, we find that, in realistic noisy settings, these methods do not primarily suffer from ill-conditioning. Instead, statistical fluctuations dominate and can prevent reliable solution extraction unless appropriate regularization or filtering techniques are employed. We consequently introduce two new metrics, the imaginary and unitary filters, that successfully assess the reliability of the obtained solutions without any knowledge of the true eigenspectrum.", "url": "https://arxiv.org/abs/2604.11532", "type": "数值", "summary": "1. 该工作通过数值模拟分析了量子Krylov子空间方法在含与不含采样噪声情形下的数值稳定性与统计问题。\n2. 核心发现是，在实际噪声环境下，这些方法的主要困难并非病态性，而是统计涨落主导了求解误差，需借助正则化或滤波技术。\n3. 由此引入的虚部滤波器和酉滤波器两种新度量，可在未知真实能谱的情况下有效评估所获解的可靠性。", "summary_source": "deepseek", "authors": [{"name": "Maria Gabriela Jordão Oliveira"}, {"name": "Karl Michael Ziems"}, {"name": "Nina Glaser"}], "featured_authors": [{"name": "Maria Gabriela Jordão Oliveira"}, {"name": "Karl Michael Ziems"}, {"name": "Nina Glaser"}], "author_count": 3}, {"id": "2604.11534", "category": "quant-ph", "title": "Quantum circuit optimization for arbitrary high-dimensional bipartite quantum computation", "abstract": "Implementation of high-dimensional (HD) quantum gates shows very promising perspectives for HD quantum computation. A bipartite quantum system with arbitrary dimensions $n$ and $m$ is termed a quNit-quMit. Here we propose a synthesis scheme to construct the quantum circuit for general quNit-quMit gates with controlled increment (CINC) gates and local gates. This shows that CINC gates combined with local gates form a universal gate set for HD quantum computation. An upper bound of $O(n^2)$ CINC gates is achieved for arbitrary quNit-quMit gate implementation in the proposed scheme, which is the best known result. Especially for the controlled quNit-quMit gates, our scheme requires only 2 CINC gates, whereas the previous scheme required $2n$.", "url": "https://arxiv.org/abs/2604.11534", "type": "理论+数值", "summary": "1. 该工作提出了一种用于构建任意维度 n 与 m 的 quNit-quMit 量子门的通用电路综合方案。\n2. 方案证明了受控增量门结合局部门构成通用门集，并实现了 O(n^2) 的上界，特别地将受控门的所需数量从先前的 2n 降至仅需 2 个。\n3. 这一资源高效的综合方法为实际实现高维量子计算及优化相关算法提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Gui-Long Jiang"}, {"name": "Hai-Rui Wei"}], "featured_authors": [{"name": "Gui-Long Jiang"}, {"name": "Hai-Rui Wei"}], "author_count": 2}, {"id": "2604.11620", "category": "quant-ph", "title": "Quantum state transfer on a scalable network under unital and non-unital noise", "abstract": "We investigate quantum state transfer on a class of bipartite graphs, namely the butterfly graphs, within the framework of discrete-time quantum walks. These graphs facilitate the construction of scalable quantum networks that enable communication between a sender and a receiver via perfect state transfer. Our analysis demonstrates that state transfer occurs across different butterfly graphs, thereby extending the known families of networks that support high-fidelity quantum state transfer. In addition to the ideal n
