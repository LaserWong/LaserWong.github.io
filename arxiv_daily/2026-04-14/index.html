oiseless dynamics, we further investigate the robustness of quantum state transfer in the presence of non-Markovian environmental noise, specifically, random telegraph noise, modified Ornstein-Uhlenbeck noise, which are examples of unital noise and non-Markovian amplitude damping noise, non-unital noise. These noise models capture different types of system-environment interactions and memory effects that influence the coherence of the quantum walk. These findings contribute to the theoretical understanding of how butterfly graph constructions influence quantum transport phenomena.", "url": "https://arxiv.org/abs/2604.11620", "type": "理论", "summary": "1. 本文研究了基于蝶形二分图的离散时间量子行走中的量子态传输，考察了理想无噪声情形及非马尔可夫环境噪声下的传输鲁棒性。\n2. 研究将支持高保真度量子态传输的网络家族扩展至蝶形图结构，并系统比较了酉噪声与非酉噪声对传输相干性的不同影响机制。\n3. 该结果为基于特定图结构设计可扩展量子网络提供了理论依据，并为探索非马尔可夫环境中的拓扑保护传输开辟了新方向。", "summary_source": "deepseek", "authors": [{"name": "Monika Rani"}, {"name": "Subhashish Banerjee"}, {"name": "Nikhil Swami"}, {"name": "Supriyo Dutta"}], "featured_authors": [{"name": "Monika Rani"}, {"name": "Subhashish Banerjee"}, {"name": "Nikhil Swami"}, {"name": "Supriyo Dutta"}], "author_count": 4}, {"id": "2604.11643", "category": "quant-ph", "title": "NV-ensemble enabled microwave/NV parametric amplifier with optimal driving", "abstract": "We present a fast, memory-efficient, unitarity-preserving numerical method beyond the rotating-wave approximation for the closed Tavis-Cummings model in which a multilevel spin system interacts with a cavity mode. This model can describe the interaction of an ensemble of spins with a cavity mode in which the spin frequency and other parameters are time-dependent. The method exploits the fact that, while the Tavis-Cummings model is not tri-diagonal, it can be brought into tri-diagonal form by a change of basis that can be implemented purely by re-indexing (permuting basis elements), which is a fast operation. By truncating the Fock basis of the cavity mode, the computational complexity of the method is linear in the total dimension of the coupled system in both time and memory. The method can be employed to simulate any closed quantum system whose Hamiltonian terms can be brought into tri-diagonal form.", "url": "https://arxiv.org/abs/2604.11643", "type": "理论+数值", "summary": "1. 该工作提出了一种超越旋波近似、快速且内存高效的数值方法，用于模拟多能级自旋系综与腔模耦合的封闭Tavis-Cummings模型。\n2. 其技术关键在于通过纯重标引操作实现基变换，将哈密顿量转化为三对角形式，从而在截断腔模Fock基后，使计算复杂度在时间和内存上均与耦合系统总维度呈线性关系。\n3. 该方法可推广至任何能化为三对角形式的封闭量子系统模拟，为含时参数复杂光-物质相互作用体系的精确计算提供了有效工具。", "summary_source": "deepseek", "authors": [{"name": "Roman Ovsiannikov"}, {"name": "Kurt Jacobs"}, {"name": "Andrii G. Sotnikov"}, {"name": "Matthew E. Trusheim"}, {"name": "Denys I. Bondar"}], "featured_authors": [{"name": "Roman Ovsiannikov"}, {"name": "Kurt Jacobs"}, {"name": "Andrii G. Sotnikov"}, {"name": "Matthew E. Trusheim"}, {"name": "Denys I. Bondar"}], "author_count": 5}, {"id": "2604.11667", "category": "quant-ph", "title": "A Comparative Study of Hybrid Quantum and Classical Genetic Algorithms in Portfolio Optimization", "abstract": "This work investigates the performance of a Hybrid Quantum Genetic Algorithm (HQGA) compared to a classical Genetic Algorithm (GA) for solving the portfolio optimization problem. Our results indicate that the HQGA converges faster to the optimal solution than its classical counterpart, while also maintaining a higher level of population diversity throughout the optimization process. In addition, the HQGA requires significantly fewer evaluations-to-solution than a brute-force approach to reach the global optimum.", "url": "https://arxiv.org/abs/2604.11667", "type": "数值", "summary": "1. 该研究针对投资组合优化问题，比较了混合量子遗传算法与经典遗传算法的性能。\n2. 混合量子算法显示出更快的收敛速度，并在整个优化过程中保持了更高的种群多样性，从而以远低于暴力搜索的计算量达到全局最优。\n3. 这为在金融优化等复杂组合问题中应用含噪声中型量子处理器提供了具体范例和性能基准。", "summary_source": "deepseek", "authors": [{"name": "Romeu Rossi Junior"}, {"name": "José Augusto Miranda Nacif"}, {"name": "Leonardo Antônio Mendes Souza"}, {"name": "Marcus Henrique Soares Mendes"}], "featured_authors": [{"name": "Romeu Rossi Junior"}, {"name": "José Augusto Miranda Nacif"}, {"name": "Leonardo Antônio Mendes Souza"}, {"name": "Marcus Henrique Soares Mendes"}], "author_count": 4}, {"id": "2604.11688", "category": "quant-ph", "title": "Frustration-Induced Expressibility Limitations in Variational Quantum Algorithms", "abstract": "Geometric frustration, arising from competing interactions that prevent simultaneous energy minimization, presents a fundamental challenge for variational quantum algorithms applied to quantum many-body systems. We investigate the transverse-field Ising model on a square lattice with frustrated diagonal coupling and show that geometric frustration leads to strongly inhomogeneous correlations that are difficult to capture using standard Hamiltonian-inspired ansätze with global parameters. As a result, the required circuit depth increases significantly in the intermediate-field regime. We demonstrate that this limitation is not caused by optimization difficulties such as barren plateaus, but instead arises from insufficient expressibility of the ansatz. By introducing bond-resolved variational parameters, we recover accurate results at reduced circuit depth. We also study low-energy excitations and find that near-degenerate spectra in the frustrated regime further challenge variational methods. Our results provide a clear physical explanation for the limitations of variational quantum algorithms in frustrated systems and suggest improved ansatz design strategies for quantum simulation.", "url": "https://arxiv.org/abs/2604.11688", "type": "理论+数值", "summary": "1. 该工作研究了具有几何阻挫的横向场伊辛模型中变分量子算法的表现受限问题。\n2. 其核心发现是，阻挫导致的强非均匀关联使得全局参数化试探波函数表达能力不足，而非优化困难，从而显著增加所需电路深度。\n3. 这为针对阻挫等多体系统的变分算法设计，特别是引入局域分辨的变分参数，提供了明确的物理指导与改进方向。", "summary_source": "deepseek", "authors": [{"name": "Sandip Maiti"}], "featured_authors": [{"name": "Sandip Maiti"}], "author_count": 1}, {"id": "2604.11758", "category": "quant-ph", "title": "Hybrid Quantum-Classical Optimization Workflows for the Shipment Selection Problem", "abstract": "We present a quantum optimization framework for the Shipment Selection Problem (SSP) in electric freight logistics, developed jointly by IonQ and Einride. Idle gaps arising from stochastic shipment cancellations reduce fleet utilization and revenue; filling them optimally requires solving a combinatorial assignment problem with quadratic inter-gap dependencies. We formulate the SSP as a Mixed-Integer Quadratic Program, map it to an Ising cost Hamiltonian, and solve it using Iterative-QAOA, a non-variational warm-start extension of the Quantum Approximate Optimization Algorithm (QAOA) with a fixed linear-ramp parameter schedule. An end-to-end hybrid workflow integrates Einride's vehicle routing problem (VRP) solver with IonQ's quantum simulations, enabling evaluation on real, anonymized logistics data spanning up to 130 qubits. We assess solution quality through application-level performance metrics, including Shipments Delivered (SD), Schedule Compatibility Score (SCS), and Total Drive Distance (TDD). When the quantum assignment is passed to the classical solver as a warm start, the resulting hybrid workflow achieves improvements of up to 12\\% in SD and a reduction of up to 6\\% in total drive distance per shipment for specific instances, while total operational cost remains effectively unchanged. These results show that Iterative-QAOA can generate compatibility-aware assignments that become operationally valuable when embedded in a hybrid logistics optimization workflow.", "url": "https://arxiv.org/abs/2604.11758", "type": "理论+数值", "summary": "1. 该工作由IonQ与Einride合作提出了一个混合量子经典优化框架，用于解决电动货运物流中的货物选择问题，通过将问题建模为混合整数二次规划并映射到伊辛哈密顿量，采用迭代-QAOA算法在真实匿名物流数据上评估了多达130量子比特的量子模拟。\n2. 其技术卖点在于迭代-QAOA作为非变分热身扩展，使用固定线性斜坡参数调度生成兼容性感知的量子分配，并集成到经典车辆路径规划求解器中作为热身启动，从而在特定实例中实现交付货物数量提升高达12%且每货物行驶距离减少达6%。\n3. 这展示了量子优化在现实物流工作流程中的操作价值，为量子计算嵌入经典系统以解决组合优化问题提供了可行范例，并启发了混合量子经典方法在更广泛工业应用中的扩展研究。", "summary_source": "deepseek", "authors": [{"name": "Miguel Angel Lopez-Ruiz"}, {"name": "Daiwei Zhu"}, {"name": "Jonas Hatzenbuhler"}, {"name": "Shudian Zhao"}, {"name": "Claudio Girotto"}, {"name": "Willie Aboumrad"}, {"name": "Jonas Alm"}, {"name": "Julia Kompalla"}, {"name": "Mena Issler"}, {"name": "Ananth Kaushik"}, {"name": "Martin Roetteler"}], "featured_authors": [{"name": "Miguel Angel Lopez-Ruiz"}, {"name": "Daiwei Zhu"}, {"name": "Jonas Hatzenbuhler"}, {"name": "Mena Issler"}, {"name": "Ananth Kaushik"}, {"name": "Martin Roetteler"}], "author_count": 11}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
