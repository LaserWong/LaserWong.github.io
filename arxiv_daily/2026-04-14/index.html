  <style>
    :root {

    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }

    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }

selection and flow conditions.", "url": "https://arxiv.org/abs/2604.09684", "type": "理论+数值", "summary": "1. 该研究通过布朗动力学模拟，系统探究了稀溶液中多链两亲性嵌段共聚物在不同链长、拓扑结构、组成及剪切速率下的自组装与流变行为。\n2. 核心发现是三嵌段共聚物通过疏水端桥接形成具有优异结构完整性的三维网络，其溶液粘度可比二嵌段体系高半个数量级，并在高剪切下呈现高度伸长的扁长体结构。\n3. 这些结果为基于拓扑结构选择和流动条件调控的聚合物载药体系理性设计提供了关键物理依据。", "summary_source": "deepseek", "authors": [{"name": "Ehsan Kamali Ahangar"}, {"name": "Dominic Robe"}, {"name": "Elnaz Hajizadeh"}], "featured_authors": [{"name": "Ehsan Kamali Ahangar"}, {"name": "Dominic Robe"}, {"name": "Elnaz Hajizadeh"}], "author_count": 3}, {"id": "2604.09758", "category": "cond-mat", "title": "Heterogeneous Molecular Signatures of Human Odor Perception", "abstract": "Understanding how molecular structure gives rise to odor perception remains a long-standing challenge, with ongoing debate over whether olfaction is primarily governed by molecular shape, vibrational properties, or their interplay at the level of olfactory receptors. Here, we ask whether different odors rely on common molecular determinants or instead emerge from distinct physicochemical regimes. Using interpretable machine-learning models trained on molecular descriptors derived from first-principles calculations that span electronic, vibrational, and structural properties, we analyze feature contributions for odor categories and their associated receptors. We find that no single descriptor class universally dominates odor prediction; instead, different odors exhibit strongly odor-specific patterns of feature importance, with substantial variability across physicochemical domains. This heterogeneity is consistent across different models, suggesting that a universal encoding scheme does not capture odor perception but reflects receptor- and odor-dependent structure-odor relationships. Our results provide statistical constraints on competing olfactory theories and offer a data-driven framework for organizing odor space.", "url": "https://arxiv.org/abs/2604.09758", "type": "理论+数值", "summary": "1. 本工作采用基于第一性原理计算的电子、振动和结构分子描述符，训练可解释机器学习模型，以探究气味感知的分子基础及其与嗅觉受体的关联。\n2. 关键物理发现是不同气味的预测不依赖于单一的物理化学描述符类别，而是表现为强烈气味特异性的异质特征重要性模式，这否定了普遍的嗅觉编码方案。\n3. 该结果为竞争性嗅觉理论提供了统计约束，并建立了一个数据驱动的框架来组织气味空间，为后续跨学科研究提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "P. Zanineli"}, {"name": "E. V. C. Lopes"}, {"name": "G. R. Schleder"}, {"name": "L. N. Lemos"}, {"name": "F. Crasto de Lima"}, {"name": "A. Fazzio"}], "featured_authors": [{"name": "P. Zanineli"}, {"name": "E. V. C. Lopes"}, {"name": "G. R. Schleder"}, {"name": "L. N. Lemos"}, {"name": "F. Crasto de Lima"}, {"name": "A. Fazzio"}], "author_count": 6}, {"id": "2604.09768", "category": "cond-mat", "title": "Proof of entropic order in Generalized Ising Models", "abstract": "Ordering at arbitrarily high temperature - entropic order - has been argued to take place in a class of generalized Ising models parameterised by a real interaction parameter $p$ when $p\\ge 1$. We give a rigorous proof of this conjecture. We further show that on arbitrary graphs, these models solve graph packing problems - crucially, the Maximum Independent Set optimisation problem. Due to the NP-hardness of this packing problem on generic graphs, some lattice systems will exhibit glassy phases. We call this phenomenon $entropic$ $glass$.", "url": "https://arxiv.org/abs/2604.09768", "type": "理论", "summary": "1. 该工作严格证明了广义伊辛模型在相互作用参数 p ≥ 1 时于任意高温下存在熵有序性，并揭示该模型能等效求解任意图上的最大独立集优化问题。\n2. 核心物理进展在于通过将统计物理模型映射到NP难的图打包问题，首次从理论上推导出因计算复杂性导致的玻璃相——熵玻璃的存在。\n3. 这一成果为理解高熵体系中的有序现象、复杂优化问题的物理实现以及非平衡统计力学中的玻璃相研究提供了新的理论框架和实验启示。", "summary_source": "deepseek", "authors": [{"name": "Enrico Andriolo"}, {"name": "Mendel Nguyen"}, {"name": "Emily Richards"}, {"name": "Tin Sulejmanpasic"}], "featured_authors": [{"name": "Enrico Andriolo"}, {"name": "Mendel Nguyen"}, {"name": "Emily Richards"}, {"name": "Tin Sulejmanpasic"}], "author_count": 4}, {"id": "2604.09801", "category": "cond-mat", "title": "Symmetry Protected Bulk-Boundary Correspondence in Interacting Topological Insulators", "abstract": "We establish a quantitative bulk boundary correspondence in interacting topological insulators by relating many-body topological invariants to characteristic degeneracy structures in the entanglement spectrum. Focusing on generalized Su Schrieffer Heeger chains with higher winding number, we construct a gauge-invariant many-body winding invariant based on Pancharatnam geometric phases that remains well defined in the presence of interactions. We show that this invariant uniquely determines the low-lying entanglement-spectrum degeneracy, which exhibits a universal 4 to the power nu scaling with the winding number nu, providing a concrete formulation of bulk boundary correspondence beyond single-particle topology. Using exact diagonalization, we demonstrate the robustness of this correspondence under interactions and symmetry preserving disorder, and identify inversion symmetry as a minimal protecting symmetry that stabilizes both the quantization of the invariant and the associated entanglement degeneracies. Our results unify geometric-phase invariants and entanglement diagnostics within a many-body framework and provide a route to identifying interacting topological phases beyond band theory.", "url": "https://arxiv.org/abs/2604.09801", "type": "理论+数值", "summary": "1. 该工作通过建立多体拓扑不变量与纠缠谱简并结构之间的定量关系，为相互作用拓扑绝缘体确立了体边对应的普适表述。\n2. 核心发现在于基于Pancharatnam几何相位构建的规范不变多体绕数不变量，其唯一确定了低能纠缠谱中遵循4^ν标度律的简并结构（ν为绕数）。\n3. 该框架将几何相位不变量与纠缠谱诊断统一于多体体系，为超越能带理论的相互作用拓扑相识别提供了具体路径。", "summary_source": "deepseek", "authors": [{"name": "Kiran Babasaheb Estake"}, {"name": "Dibyendu Roy"}], "featured_authors": [{"name": "Kiran Babasaheb Estake"}, {"name": "Dibyendu Roy"}], "author_count": 2}, {"id": "2604.09842", "category": "cond-mat", "title": "Self-compensation by silicon $DX$ centers in ultrawide-bandgap nitrides", "abstract": "\\textit{DX} behavior limits $n$-type carrier concentrations in ultrawide-bandgap nitrides such as aluminum nitride (AlN) and cubic boron nitride ($c$-BN). Instead of acting as effective-mass donors, \\textit{DX} centers capture two electrons, stabilizing a negative charge state that leads to self compensation. Silicon is the most effective $n$-type dopant in this class of materials; in AlN, its \\textit{DX} level [(i.e., the (+/$-$) transition level] is $\\sim$270 meV from the conduction-band minimum. This implies that many silicon impurities incorporated into AlN will be negatively charged and compensate the intended $n$-type doping. By combining density functional theory calculations of temperature-dependent band gaps and Si dopant transition levels, we show here that significant compensation occurs in silicon-doped AlN, even in the absence of any other defects. This compensation strongly limits free electron concentrations which become independent of doping concentration, and donor activation is only significant for light doping scenarios. Higher free carrier concentrations can be achieved in AlGaN alloys or in $c$-BN, where the \\textit{DX} level sits closer to the conduction-band minimum.", "url": "https://arxiv.org/abs/2604.09842", "type": "理论+数值", "summary": "1. 该工作结合温度依赖带隙和硅掺杂转变能级的密度泛函理论计算，揭示了在无其他缺陷时硅掺杂氮化铝中DX中心引起的显著自补偿效应。\n2. 其物理核心在于DX中心捕获两个电子稳定为负电荷态，导致自由电子浓度强烈受限且与掺杂浓度无关，仅在轻掺杂下激活明显。\n3. 这为在DX能级更接近导带底的AlGaN合金或立方氮化硼中提升载流子浓度提供了明确途径，对超宽带隙氮化物器件设计具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "John L. Lyons"}, {"name": "Darshana Wickramaratne"}], "featured_authors": [{"name": "John L. Lyons"}, {"name": "Darshana Wickramaratne"}], "author_count": 2}, {"id": "2604.09979", "category": "cond-mat", "title": "A Minimal Model of Representation Collapse: Frustration, Stop-Gradient, and Dynamics", "abstract": "Self-supervised representation learning is central to modern machine learning because it extracts structured latent features from unlabeled data and enables robust transfer across tasks and domains. However, it can suffer from representation collapse, a widely observed failure mode in which embeddings lose discriminative structure and distinct inputs become indistinguishable. To understand the mechanisms that drive collapse and the ingredients that prevent it, we introduce a minimal embedding-only model whose gradient-flow dynamics and fixed points can be analyzed in closed form, using a classification-representation setting as a concrete playground where collapse is directly quantified through the contraction of label-embedding geometry. We illustrate that the model does not collapse when the data are perfectly classifiable, while a small fraction of frustrated samples that cannot be classified consistently induces collapse through an additional slow time scale that follows the early performance gain. Within the same framework, we examine collapse prevention by adding a shared projection head and applying stop-gradient at the level of the training dynamics. We analyze the resulting fixed points and develop a dynamical mean-field style self-consistency description, showing that stop-gradient enables non-collapsed solutions and stabilizes finite class separation under frustration. We further verify empirically that the same qualitative dynamics and collapse-prevention effects appear in a linear teacher-student model, indicating that the minimal theory captures features that persist beyond the pure embedding setting.", "url": "https://arxiv.org/abs/2604.09979", "type": "理论+数值", "summary": "1. 该工作引入了一个纯嵌入的最小模型，在分类-表示的学习框架下，通过闭式分析梯度流动力学与不动点，研究自监督学习中表征坍缩的机制。\n2. 其核心发现是，少数无法被一致分类的“受挫”样本会引入一个慢时间尺度，导致坍缩发生；而训练动态中的停止梯度操作能够稳定非坍缩解，在受挫情况下保持有限的类间分离。\n3. 该最小理论揭示的定性动力学与坍缩预防效应，在线性师生模型中得到实证，表明其机制可能超越纯嵌入设定，为理解更广泛表示学习系统的失败模式提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Louie Hong Yao"}, {"name": "Yuhao Li"}, {"name": "Shengchao Liu"}], "featured_authors": [{"name": "Louie Hong Yao"}, {"name": "Yuhao Li"}, {"name": "Shengchao Liu"}], "author_count": 3}, {"id": "2604.10004", "category": "cond-mat", "title": "Universality and ambiguity in extremes of anomalous diffusion", "abstract": "Many biophysical processes begin when the fastest searcher finds a target out of many random searchers, which is called an extreme or fastest first passage time (fFPT). In some models, (i) the fFPT vanishes logarithmically as the number of searchers grows, and (ii) the fFPT can be faster for subdiffusive search compared to normal diffusion. Though mathematically rigorous, the relevance of (i) and (ii) to actual physical systems is suspect since their derivations involve searchers which move with unbounded speed. Indeed, we previously proved that the fFPT for searchers with bounded speed converges exponentially to a strictly positive minimal search time as the number of searchers grows. In this paper, we study fFPTs for a broad class of anomalous and normal diffusion models with bounded or unbounded speed. These models include scaled Brownian motion, Riemann-Liouville fractional Brownian motion, and fractional Brownian motion. For all of these models, we show that the fFPT decays logarithmically in the number of searchers and that subdiffusion can be faster than normal diffusion (we further show that superdiffusion can be slower than normal diffusion). In this sense, features (i) and (ii) are rather universal. On the other hand, we show that the parameter regimes in which (i) and (ii) are valid depend on the particulars of the individual model, and thus ambiguities remain in the relevance of these features to specific physical systems.", "url": "https://arxiv.org/abs/2604.10004", "type": "理论", "summary": "1. 本工作针对具有有界或无界速度的广泛扩散模型，包括标度布朗运动、Riemann-Liouville分数布朗运动及分数布朗运动，深入探究了最快首次通过时间的极端统计特性。\n2. 研究证实了最快通过时间随搜寻者数量对数衰减以及次扩散相比正常扩散可能更快的普适性规律，同时揭示了超扩散可能更慢的现象，但所有特征的生效参数范围均因模型细节而异。\n3. 因此，这些发现强调了在将极端搜寻理论应用于具体生物物理系统时，必须考虑模型特异性以避免误解，为后续实验与理论工作提供了关键警示和指导。", "summary_source": "deepseek", "authors": [{"name": "Sean D Lawley"}], "featured_authors": [{"name": "Sean D Lawley"}], "author_count": 1}, {"id": "2604.10019", "category": "cond-mat", "title": "Exchange Frustration and Topological Magnetism in Electrostatically Doped SrRuO3", "abstract": "Magnetism in transition-metal systems emerges from exchange interactions that depend sensitively on carrier density. Yet leveraging this sensitivity to deliberately engineer exchange frustration and associated topological spin textures remains largely unexplored. Here, combining first-principles calculations with atomistic Monte Carlo simulations, we demonstrate that ferroelectric polarization enables electrostatic control of exchange frustration in the itinerant ferromagnet SrRuO3. We show that electrostatic hole doping renormalizes competing exchange interactions, driving SrRuO3 away from its bulk ferromagnetic ground state toward frustrated regimes, whereas electron doping largely preserves ferromagnetism. At BaTiO3/SrRuO3 interfaces, polarization-induced charge depletion modulates layer dependent exchange couplings, enhancing competition among J1, J2 and J3. The resulting exchange frustration stabilizes a sequence of magnetic phases as a function of thickness and applied magnetic field, including stripe and spiral states, topological meron and bimeron textures, and diverse skyrmionic objects. A minimal spin model identifies exchange frustration as the primary control parameter governing these crossovers, with magnetic anisotropy, Dzyaloshinskii-Moriya interaction, and external field selecting the emergent topology. Our results establish electrostatic doping as a route to engineer frustrated and topological magnetism in itinerant oxide metals.", "url": "https://arxiv.org/abs/2604.10019", "type": "理论+数值", "summary": "1. 该研究结合第一性原理计算与原子蒙特卡洛模拟，建立了通过静电掺杂调控SrRuO₃中交换相互作用的方法。\n2. 其核心发现是静电空穴掺杂可重整化竞争性交换作用，诱导交换阻挫并稳定条纹相、螺旋序及麦纫等多种拓扑磁织构。\n3. 这为利用多铁异质结的静电调控实现氧化物金属中阻挫与拓扑磁性的按需设计提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Naafis Ahnaf Shahed"}, {"name": "Himanshu Mavani"}, {"name": "Zhonglin He"}, {"name": "Kai Huang"}, {"name": "Mohamed Elekhtiar"}, {"name": "Evgeny Y. Tsymbal"}], "featured_authors": [{"name": "Naafis Ahnaf Shahed"}, {"name": "Himanshu Mavani"}, {"name": "Zhonglin He"}, {"name": "Kai Huang"}, {"name": "Mohamed Elekhtiar"}, {"name": "Evgeny Y. Tsymbal"}], "author_count": 6}, {"id": "2604.10026", "category": "cond-mat", "title": "Strong Electron-Phonon Coupling and Multiband Superconductivity in Hexagonal BP3 Monolayer", "abstract": "We investigate the structural, electronic, and superconducting properties of a hexagonal BP3 monolayer using first-principles calculations combined with anisotropic Migdal-Eliashberg theory. The optimized structure exhibits a stable, slightly buckled configuration, as confirmed by phonon dispersion analysis and ab initio molecular dynamics simulations. The phonon spectrum indicates high-frequency vibrational modes associated with B-P bonding. Electronic band structure calculations reveal a multiband metallic state, with states near the Fermi level predominantly derived from pz orbitals of both boron and phosphorus atoms, forming two distinct Fermi surface sheets. The electron-phonon coupling is relatively strong, with a total coupling constant of lambda = 1.59, dominated by low- and intermediate-frequency phonon modes. Solving the anisotropic Migdal-Eliashberg equations yields a superconducting transition temperature of Tc = 9.7 K. The superconducting state is characterized by a nodeless but anisotropic gap structure, exhibiting two distinct gap values of approximately 2.25 and 1.74 meV associated with different Fermi surface sheets. These results identify the BP3 monolayer as a strongly coupled, multiband two-dimensional superconductor and provide insight into the role of orbital hybridization in electron-phonon-mediated superconductivity in low-dimensional systems.", "url": "https://arxiv.org/abs/2604.10026", "type": "理论+数值", "summary": "1. 该工作结合第一性原理计算与各向异性Migdal-Eliashberg理论，系统研究了六方BP3单层膜的结构、电子及超导性质。\n2. 研究揭示了体系存在较强的电子-声子耦合（λ=1.59）并实现Tc=9.7 K的多带超导，其无节点但各向异性的能隙结构与两个费米面片层明确关联。\n3. 这一结果不仅确立了一种新型强耦合二维多带超导体，更为理解低维体系中轨道杂化对电声子介导超导的作用提供了具体范例。", "summary_source": "deepseek", "authors": [{"name": "Jakkapat Seeyangnok"}, {"name": "Udomsilp Pinsook"}], "featured_authors": [{"name": "Jakkapat Seeyangnok"}, {"name": "Udomsilp Pinsook"}], "author_count": 2}, {"id": "2604.10043", "category": "cond-mat", "title": "Quantum geometry of the non-Hermitian skin effect", "abstract": "The non-Hermitian skin effect is nonreciprocity-induced localization phenomena in which a macroscopic number of eigenstates accumulate anomalously at the boundary, accompanied by the extreme sensitivity to boundary conditions. Here, we develop a geometric characterization of the non-Hermitian skin effect. We demonstrate that the localization length scale associated with the skin effect is encoded in the quantum metric defined solely from right eigenstates, but not in the biorthogonal quantum metric. Moreover, we show that the quantum metrics exhibit the power-law divergences at gapless points that depend on the different boundary conditions. We also reveal that cusps of the generalized Brillouin zone in non-Bloch band theory are signaled by discontinuities in the quantum metrics. We illustrate these behavior using prototypical non-Hermitian models, such as the Hatano-Nelson model and the non-Hermitian, nonreciprocal Su-Schrieffer-Heeger model.", "url": "https://arxiv.org/abs/2604.10043", "type": "理论", "summary": "1. 本文为研究非厄米趋肤效应构建了量子几何理论框架，并利用典型模型进行了验证。\n2. 关键在于揭示了仅由右本征态定义的量子度规可编码趋肤效应的局域化长度，且在能隙闭合点呈现依赖边界条件的幂律发散行为。\n3. 该研究建立了量子度规不连续性与非布洛赫能带理论中广义布里渊区尖点间的对应关系，为理解非厄米体系边界敏感性提供了几何视角。", "summary_source": "deepseek", "authors": [{"name": "Ken-Ichiro Imura"}, {"name": "Kohei Kawabata"}], "featured_authors": [{"name": "Ken-Ichiro Imura"}, {"name": "Kohei Kawabata"}], "author_count": 2}, {"id": "2604.10046", "category": "cond-mat", "title": "Concise overview of methods to enhance the thermoelectric efficiency of SnTe", "abstract": "SnTe is a potential thermoelectric material in the mid temperature range. Detailed techniques to enhance the figure of merit by increasing the Power Factor, and reducing thermal conductivity, of SnTe-based TE materials are discussed. The key factors governing the figure of merit of a thermoelectric material are discussed to facilitate the optimization of the efficiency. Various techniques to synthesis bulk and nanostructured SnTe are presented. Efforts are made to reveal the optimization techniques for figure of merit of SnTe based materials through band structure engineering and reduction in thermal conductivity. Nano-structuring is one of the important approaches to decouple the interrelated material properties and reduce thermal conductivity. Band structure engineering is employed to enhance the Power Factor.", "url": "https://arxiv.org/abs/2604.10046", "type": "数值", "summary": "1. 该工作系统综述了提升 SnTe 基热电材料中温区热电优值的多种方法。\n2. 其核心在于通过能带工程和纳米结构分别优化功率因子与降低热导率。\n3. 这为解耦热电参数、指导其他热电材料的性能优化提供了清晰思路。", "summary_source": "deepseek", "authors": [{"name": "Diptasikha Das"}, {"name": "Kartick Malik"}], "featured_authors": [{"name": "Diptasikha Das"}, {"name": "Kartick Malik"}], "author_count": 2}, {"id": "2604.10133", "category": "cond-mat", "title": "Hidden Universal Metal in Cuprate Superconductors", "abstract": "Nuclear relaxation is a powerful probe of temperature dependent electronic excitations in superconducting metals. Their emergence from a condensed state near the critical temperature, $T_\\mathrm{c}$, is of particular interest. In cuprate superconductors, the behavior is still not understood. Here, based on planar Cu and O relaxation data available in the literature, a simple phenomenology is developed. At its core is a universal metal, characterized by $1/{^{63}T}_{1\\perp} T_\\mathrm{c} \\approx 25$/Ks, found in all materials, i.e. $T_\\mathrm{c}$ is directly related to the Cu nuclear relaxation rate. Above $T_\\mathrm{c}$, as a function of temperature, this universal metal crosses over into a strange metal regime where relaxation increasingly lags behind that of the universal metal. The latter is also tied to the metallic planar O relaxation, which only deviates from it at lower energies in underdoped materials with a doping dependent, but temperature independent pseudogap described earlier. Planar O relaxation has the expected fixed anisotropy, but for Cu it is doping dependent and varies between about 3.6 for lower and 1 for high doping levels. It is this doping-related anisotropy that sets the maximum critical temperature of the family and in that sense is tied to the universal metal. This likely requires two components of relaxation. The new phenomenology will be discussed and should give a better foundation for the understanding of the phase diagram of the cuprates.", "url": "https://arxiv.org/abs/2604.10133", "type": "理论+数值", "summary": "1. 该研究基于文献中的平面Cu与O核弛豫数据，为铜氧化物超导体建立了一个简单的现象学模型。\n2. 其核心发现是所有材料中均存在一个普适金属态，其特征是Cu核弛豫率与临界温度Tc直接相关，且该普适金属在Tc以上会过渡到奇异金属行为。\n3. 这一新现象学揭示了弛豫各向异性与家族最大Tc的关联，为系统理解铜氧化物的相图提供了更坚实的基础。", "summary_source": "deepseek", "authors": [{"name": "Abigail Lee"}, {"name": "Juergen Haase"}], "featured_authors": [{"name": "Abigail Lee"}, {"name": "Juergen Haase"}], "author_count": 2}, {"id": "2604.10157", "category": "cond-mat", "title": "Accelerated Dopant Screening in Oxide Semiconductors via Multi-Fidelity Contextual Bandits and a Three-Tier DFT Validation Funnel", "abstract": "Band gap engineering of oxide semiconductors through doping is critical for photocatalysis and optoelectronics, yet the combinatorial space of dopant elements, substitution sites, and co-doping combinations far exceeds typical density functional theory (DFT) budgets. We screen doped candidates across five oxide hosts (ZnO, TiO2, SrTiO3, SnO2, MgO), culminating in a 529-candidate ZnO co-doping campaign, and identify Cu-containing co-doped ZnO systems as consistently achieving visible-light-range band gaps (1.0-1.8 eV), with Y2Cu2 co-doped ZnO as the optimal candidate (1.84 eV). A three-tier validation funnel (PBE, PBE+U, ionic relaxation) reveals that no single level of theory suffices: V-doped ZnO shifts from near-metallic to wide-gap upon Hubbard U correction, while Cu-doped SrTiO3 enters the visible-light window only after correcting for d-electron localization. To make this screening tractable, we introduce a multi-fidelity screening strategy that replaces 81% of DFT evaluations with computationally inexpensive surrogate predictions, reducing a 529-candidate closed-loop Quantum ESPRESSO campaign from an estimated 440 to 62 CPU-hours while finding the global optimum in 100% of 50 independent trials (p = 5.0e-8 versus random screening, Wilcoxon signed-rank). Cross-host analysis of the dopant-host interaction matrix reveals that dopant performance is governed by just two latent chemical dimensions, enabling prediction of rankings in unseen hosts. All 583 DFT calculations, screening code, and stability proofs are released as an open benchmark.", "url": "https://arxiv.org/abs/2604.10157", "type": "理论+数值", "summary": "1. 该研究开发了结合多保真度上下文赌博机算法与三层次密度泛函理论验证漏斗的计算框架，用于在五种氧化物半导体（ZnO、TiO2等）中高效筛选出具有可见光范围带隙的掺杂体系。\n2. 其技术关键在于多保真度策略用低成本代理模型替代了81%的DFT计算，将529个ZnO共掺杂候选体系的筛选时间从440 CPU小时降至62小时，并通过掺杂-宿主相互作用矩阵揭示性能仅由两个潜在化学维度主导。\n3. 这为大规模掺杂设计建立了可推广的预测范式，所发布的583个DFT计算数据集与开源代码为氧化物半导体能带工程提供了基准平台与可扩展工具。", "summary_source": "deepseek", "authors": [{"name": "Abhinaba Basu"}], "featured_authors": [{"name": "Abhinaba Basu"}], "author_count": 1}, {"id": "2604.10168", "category": "cond-mat", "title": "Spectral Signatures of Active Fluctuations in Semiflexible Polymers", "abstract": "We study how an active bath is transduced into the internal fluctuation spectrum of a semiflexible polymer. Starting from the statistics of active forces exerted by an explicit bath of active Brownian particles, we derive an effective description in terms of temporally persistent and spatially correlated noise, and test it against simulations of both explicit-bath and implicit-noise models. We find that activity reorganizes polymer fluctuations spectrally rather than uniformly: increasing the active force predominantly enhances the lowest modes, while increasing persistence shifts the spectral weight toward progressively longer wavelengths. The theory captures this mode-level reorganization well and explains the strong qualitative correspondence between explicit and implicit active baths over a broad parameter range. In contrast, global size measures such as the radius of gyration are systematically underestimated, which we trace to activity-induced bond stretching and contour-length renormalization absent from the present fixed-contour theory. Our results show that a semiflexible polymer acts as a multiscale probe of active matter, resolving the temporal and spatial structure of nonequilibrium forcing through its mode spectrum.", "url": "https://arxiv.org/abs/2604.10168", "type": "理论+数值", "summary": "1. 该研究从显式活性布朗粒子浴的力统计出发，推导出时空持续与空间关联噪声的有效描述，并通过对比显性与隐式噪声模型的模拟，系统探究了活性浴向半柔性聚合物内部涨落谱的转导机制。\n2. 其物理卖点在于理论准确揭示了涨落谱的频谱特异性重组：增加活性力主要增强最低阶模态，而增加噪声持续性则使谱权重向更长波长方向转移，从而解释了显隐浴模型在宽参数范围内的强定性对应。\n3. 这为将半柔性聚合物用作活性物质非平衡驱动时空结构的多尺度模态谱探针提供了明确依据，但固定轮廓理论因未计入活性诱导的键拉伸与轮廓长度重整化，导致对回转半径等全局尺寸的系统性低估。", "summary_source": "deepseek", "authors": [{"name": "Love Grover"}, {"name": "Anil Kumar Dasanna"}, {"name": "Abhishek Chaudhuri"}], "featured_authors": [{"name": "Love Grover"}, {"name": "Anil Kumar Dasanna"}, {"name": "Abhishek Chaudhuri"}], "author_count": 3}, {"id": "2604.10184", "category": "cond-mat", "title": "Brittle-to-ductile fracturing transition: A chemo-mechanical phase-field framework", "abstract": "In chemically reactive environments, the mechanical integrity of geomaterials is fundamentally compromised by solid matrix dissolution. In this study, we propose a fully coupled chemo-mechanical phase-field framework to capture the dynamic interplay between mineral dissolution and fracture propagation. A key feature of the proposed model is the dynamic coupling of local mass removal to the fracture length scale, while also incorporating the damage-accelerated reaction-diffusion processes. Our results capture the development of an enlarged fracture process zone driven by chemical mass removal. This chemically induced widening blunts the sharp crack tip, alleviating the near-tip stress concentrations and causing a pronounced degradation in material stiffness before failure. Furthermore, we reveal a distinct ductilization effect, characterized by a more gradual accumulation of damage and a delayed onset of macroscopic failure. We show that the transition between brittle and ductile failure modes is dictated by the competing timescales of chemical degradation and mechanical deformation. Highly acidic environments enhance matrix dissolution and promote ductile fracture, whereas rapid mechanical loading limits chemical interaction and preserves brittle failure mode.", "url": "https://arxiv.org/abs/2604.10184", "type": "理论", "summary": "1. 该研究建立了一个全耦合的化学-力学相场模型，用于研究化学溶解作用下的断裂行为。\n2. 模型的核心在于将局部质量移除动态耦合到断裂长度尺度，并引入了损伤加速的反应-扩散过程，从而揭示了化学溶解拓宽断裂过程区、钝化裂纹尖端并降低材料刚度的物理机制。\n3. 这项工作为理解和预测地质材料在酸性等恶劣化学环境中的失效模式转变（由脆性转为韧性）提供了理论框架，将微观化学过程与宏观力学行为联系起来。", "summary_source": "deepseek", "authors": [{"name": "Fanyu Wu"}, {"name": "Chong Liu"}, {"name": "Manolis Veveakis"}, {"name": "Manman Hu"}], "featured_authors": [{"name": "Fanyu Wu"}, {"name": "Chong Liu"}, {"name": "Manolis Veveakis"}, {"name": "Manman Hu"}], "author_count": 4}, {"id": "2604.10190", "category": "cond-mat", "title": "Local topological markers for Chern insulators in ribbon geometry", "abstract": "Local topological markers are used to characterize Chern insulators in the presence of spatial inhomogeneities, such as boundaries and disorder. In this paper, we study the local Chern marker in systems with partial translational symmetry. We express the local Chern marker in the hybrid position-momentum basis for both open and periodic boundary conditions. We calculate the local Chern marker for a Haldane model ribbon. We show that the behavior at the two boundaries is qualitatively different from fully open geometries. We further compare the local Chern marker with the local Středa marker and show agreement in the bulk and small deviations at the boundaries that diminish with increasing system size. The correspondence between the two markers remains good if disorder is introduced, provided its magnitude remains below large values that cause substantial change of the Chern number due to Anderson physics. Finally, by exploiting the numerical efficiency due to partial translational symmetry, we study equilibrium critical behavior and the Kibble-Zurek mechanism in a weakly disordered Qi-Wu-Zhang Chern insulator. We extract relevant scaling exponents from the local Chern marker configuration and show that they converge to the analytically predicted values with increasing system size.", "url": "https://arxiv.org/abs/2604.10190", "type": "理论+数值", "summary": "1. 本文在具有部分平移对称性的系统中研究了表征陈绝缘体的局域陈标记，重点考察了Haldane模型带状结构在开放与周期边界条件下的行为。\n2. 核心发现在于揭示了带状几何中两个边界的行为与完全开放几何存在定性差异，并通过混合位置-动量基表示高效计算了局域陈标记，其与局域Středa标记在体区一致、边界存在微小偏差。\n3. 该方法为利用数值效率研究弱无序陈绝缘体中的平衡临界行为与Kibble-Zurek机制提供了有效途径，所得标度指数随系统尺寸增大收敛于理论预测值。", "summary_source": "deepseek", "authors": [{"name": "Maks Repše"}, {"name": "Tomaž Rejec"}, {"name": "Jernej Mravlje"}], "featured_authors": [{"name": "Maks Repše"}, {"name": "Tomaž Rejec"}, {"name": "Jernej Mravlje"}], "author_count": 3}, {"id": "2604.10211", "category": "cond-mat", "title": "Concentration regimes in salt-free aqueous xanthan solutions under shear", "abstract": "Concentration regimes in polymer and polyelectrolyte solutions can be identified by scaling laws for the relation between specific zero-shear viscosity and concentration. Recently, we have shown that the same is true for the infinite-shear viscosity plateau. The shear-thinning range is usually accessed by focusing on the viscosity functions for the respective concentration regime. For salt-free aqueous xanthan solutions, we find power-law dependencies of the specific viscosity on concentration throughout the entire shear-rate range. We distinguish six different concentration regimes. Apart from those already known for the zero-shear viscosity of polyelectrolyte solutions, i.e. dilute, semidilute unentangled, semidilute entangled and neutral semidilute entangled, we identify a linear regime for low shear rates at high concentrations, where the solution gels and a regime at both, higher concentrations and higher shear rates. Within some regimes, the power-law exponents change smoothly with shear rate, particularly, when deviating from the zero-shear viscosity plateau before the power-law of the viscosity function. Some regimes merge as their power-law exponents approach each other. The fact that the regimes extend smoothly from the zero-shear regime into finite shear rates, i.e. away from thermodynamic equilibrium, shows that indicators such as critical concentrations remain valid at finite shear rates. This motivates us to interpret the data in the light of existing scaling laws and current knowledge about shear-rate dependent interaction mechanisms in polyelectrolyte solutions, particularly in xanthan solutions. It allows to follow the shift of relevant interaction mechanisms with shear rate. We think that the consideration of scaling laws under shear can be particularly helpful for identifying, for instance, thresholds for shear-induced disentanglement or disaggregation.", "url": "https://arxiv.org/abs/2604.10211", "type": "理论", "summary": "1. 该工作通过测量无盐黄原胶水溶液在宽剪切速率范围内的比浓黏度，识别出跨越整个剪切速率区间的六个不同浓度标度区。\n2. 研究的关键在于揭示了从零剪切平台到高剪切区的标度律指数连续变化，表明平衡态下的临界浓度在有限剪切速率下依然有效。\n3. 这为基于标度律分析剪切依赖的相互作用机制提供了框架，有助于确定如剪切诱导解缠结等过程的阈值。", "summary_source": "deepseek", "authors": [{"name": "Ammar El Menayyir"}, {"name": "Markus Neuner"}, {"name": "Polina Fuks"}, {"name": "Vahid A. Z. Alashloo"}, {"name": "Halim Altuntas"}, {"name": "Zehau Luo"}, {"name": "Melike Özgül"}, {"name": "Claudia Seeberger"}, {"name": "Sharadwata Pan"}, {"name": "Andreas Wierschem"}], "featured_authors": [{"name": "Ammar El Menayyir"}, {"name": "Markus Neuner"}, {"name": "Polina Fuks"}, {"name": "Claudia Seeberger"}, {"name": "Sharadwata Pan"}, {"name": "Andreas Wierschem"}], "author_count": 10}, {"id": "2604.10216", "category": "cond-mat", "title": "Spectral Softening and the Structural Breakdown of Thermodynamic Equilibrium", "abstract": "Under sufficiently slow driving, thermodynamics predicts reversible evolution through a sequence of equilibrium states. We show that this expectation fails near spectral degeneracy in driven quadratic Hamiltonian systems. As the soft-mode frequency collapses, the intrinsic dynamical timescale diverges and quadratic confinement is lost, leading to a breakdown of timescale separation and the failure of adiabatic following even under arbitrarily slow driving. More precisely, adiabaticity is lost once the soft-mode frequency falls below a finite, drive-dependent threshold, implying that the breakdown extends over a finite regime rather than being confined to a singular limit. Crucially, this dynamical instability is accompanied by a divergence of the canonical partition function, rendering equilibrium ensembles ill-defined and eliminating the foundation of quasistatic thermodynamic processes. This breakdown does not arise from unbounded Hamiltonians or critical slowing down, but emerges structurally from spectral softening within a bounded quadratic system. Analysis of the Wigner phase-space representation, together with its classical counterpart, reveals the same singular structure, demonstrating that this limitation is not uniquely quantum but originates from the underlying Hamiltonian phase-space geometry. These results show that thermodynamic reversibility is fundamentally constrained, as a direct consequence of the breakdown of equilibrium, whenever spectral softening removes an intrinsic frequency scale.", "url": "https://arxiv.org/abs/2604.10216", "type": "理论", "summary": "1. 该工作研究了受驱二次哈密顿系统中光谱软化导致的平衡态热力学过程的结构性失效。\n2. 核心机制在于软模频率坍塌导致固有动力学时间尺度发散，破坏了绝热跟踪所需的尺度分离，即使驱动无限缓慢。\n3. 这表明光谱软化会从基础上瓦解平衡系综的成立，对经典与量子系统的可逆热力学过程均构成了普适性限制。", "summary_source": "deepseek", "authors": [{"name": "Ilki Kim"}], "featured_authors": [{"name": "Ilki Kim"}], "author_count": 1}, {"id": "2604.10230", "category": "cond-mat", "title": "A Scalable Configuration-Interaction Impurity Solver via Active Learning", "abstract": "Finite-Hamiltonian impurity solvers provide direct real-frequency spectra and a natural route to enlarged impurity Hamiltonians, but their applicability is limited by the rapid Hilbert-space growth with the number of bath or other added one-particle orbitals. We introduce an active-learning extension of adaptive-truncation configuration interaction (AL-ATCI) that identifies the determinant manifold relevant to the correlated state. The approximation is systematically controlled by the query size N_query, which also provides an internal convergence parameter when no external benchmark is available. Over the benchmark range studied here, the computational cost grows only weakly with bath size, because enlarging the bath mainly expands the combinatorial determinant space rather than the physically relevant manifold. In dynamical mean-field-theory benchmarks for the one-dimensional Hubbard model, AL-ATCI reproduces exact-diagonalization accuracy and extends cellular calculations to clusters as large as N_c = 10. For a three-orbital rotationally invariant Sr2RuO4 impurity problem, we demonstrate systematic convergence of dynamical quantities and a highly compressed configuration space as N_b is increased from 9 to 18. These results substantially alleviate the bath-discretization bottleneck of exact-diagonalization- and configuration-interaction-based impurity solvers and make large-bath and enlarged-orbital calculations more practical.", "url": "https://arxiv.org/abs/2604.10230", "type": "理论+数值", "summary": "1. 该工作提出了基于主动学习的自适应截断构型相互作用方法，显著扩展了有限哈密顿量杂质求解器的可计算规模。\n2. 其技术核心在于通过主动学习识别与关联态相关的决定子流形，使计算成本随浴轨道数目仅微弱增长，突破了希尔伯特空间组合爆炸的限制。\n3. 这为精确对角化及构型相互作用类杂质求解器消除了浴离散化瓶颈，使大尺度浴和扩展轨道体系的多轨道强关联材料精确模拟成为可能。", "summary_source": "deepseek", "authors": [{"name": "Jeongmoo Lee"}, {"name": "Ara Go"}], "featured_authors": [{"name": "Jeongmoo Lee"}, {"name": "Ara Go"}], "author_count": 2}, {"id": "2604.10231", "category": "cond-mat", "title": "Quantifying chirality of phonons", "abstract": "Recent years have witnessed growing interest in chiral phonons, lattice vibrations carrying angular momentum and exhibiting handedness, as revealed by helicity-dependent optical phenomena. Despite this progress, a quantitative characterization of phonon chirality as a dynamical property has remained elusive. In this work, we propose a theoretical framework to quantify the dynamical chirality of lattice vibrations. We introduce two quantitative measures: momentum-resolved dynamical chirality, which provides a mode- and wave-vector-resolved picture of phonon chirality, and the bulk dynamical chirality, which characterizes the collective behavior of thermally populated chiral phonons. Using first-principles calculations for both chiral and achiral materials, we demonstrate how these quantities capture the handedness and population imbalance of phonon modes and serve as a means to distinguish the enantiomers of chiral crystals.", "url": "https://arxiv.org/abs/2604.10231", "type": "数值", "summary": "1. 该研究提出了一种量化晶格振动手征性的理论框架，引入了动量分辨与整体动力学手征性两种定量描述符。\n2. 其核心在于通过第一性原理计算，展示了这些描述符如何刻画声子模式的手性及布居不平衡，并能区分手性晶体的对映体。\n3. 这为在手性与非手性材料中定量分析声子手征动力学及其在热输运、拓扑物态等领域的应用提供了基础。", "summary_source": "deepseek", "authors": [{"name": "Yu-Chi Huang"}, {"name": "Gakuto Kusuno"}, {"name": "Yusuke Hashimoto"}, {"name": "Dominik Maximilian Juraschek"}, {"name": "Hiroaki Kusunose"}, {"name": "Takuya Satoh"}], "featured_authors": [{"name": "Yu-Chi Huang"}, {"name": "Gakuto Kusuno"}, {"name": "Yusuke Hashimoto"}, {"name": "Dominik Maximilian Juraschek"}, {"name": "Hiroaki Kusunose"}, {"name": "Takuya Satoh"}], "author_count": 6}, {"id": "2604.10254", "category": "cond-mat", "title": "Algorithmic overlaps as thermodynamic variables: from local to cluster Monte Carlo dynamics in critical phenomena", "abstract": "We investigate the spatial overlap of successive spin configurations in Markov chain Monte Carlo simulations using the local Metropolis algorithm and the Swendsen-Wang and Wolff cluster algorithms. We examine the dynamics of these algorithms for two models in different universality classes: the Ising model and the Potts model with three components. The overlap of two successive Wolff clusters reflects critical behavior and can be used as an order parameter for the algorithm's dynamics. In the case of the Swendsen-Wang algorithm, similar behavior is demonstrated by the variation in the overlap of two consecutive lattice configurations, which behaves like order parameter. Nothing similar is observed for the Metropolis algorithm, and the dynamics in the critical region are determined by the spin flip frequency, which is equivalent to the acceptance rate. Thus, the critical behavior of Wolff cluster overlap and the variation of configuration overlap in the Swendsen-Wang algorithm are naturally related to the critical behavior of geometric objects - Fortuin-Kastelein clusters. Interestingly, in all cases, the geometric quantity - configuration overlap or its variation - reflects the thermodynamics of the phase transition.", "url": "https://arxiv.org/abs/2604.10254", "type": "理论+数值", "summary": "1. 本研究系统比较了局部Metropolis算法与Swendsen-Wang、Wolff团簇算法在临界区域中的蒙特卡罗动力学，通过分析连续自旋构型的空间重叠来表征算法行为。\n2. 核心发现是Wolff算法的连续团簇重叠可作为其动力学的序参量并反映临界行为，Swendsen-Wang算法的构型重叠变化具有类似序参量特性，而Metropolis算法的动力学仅由自旋翻转频率主导。\n3. 这表明算法特定的几何重叠量能反映相变热力学，为将算法重叠作为热力学变量来理解蒙特卡罗动力学的临界行为提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Ian Pilé"}, {"name": "Youjin Deng"}, {"name": "Lev Shchur"}], "featured_authors": [{"name": "Ian Pilé"}, {"name": "Youjin Deng"}, {"name": "Lev Shchur"}], "author_count": 3}, {"id": "2604.10309", "category": "cond-mat", "title": "Emergent Topological Universality and Marginal Replica Symmetry Breaking in Gauge-Correlated Spin Glasses", "abstract": "Recent tensor-network samplings of modified Nishimori spin glasses have revealed robust finite-temperature critical transitions in two dimensions, defying the standard Edwards-Anderson lower critical dimension boundary ($d_{l}\\approx2.5$). We present a theoretical framework demonstrating that the discrete $Z_{2}$ gauge constraints utilized to bypass Monte Carlo kinetic traps fundamentally alter the system's universality class. By mapping the algorithmic disorder distribution to the 2D Ising Conformal Field Theory (CFT), we prove the emergent spatial variance generates a fractional momentum operator that drives the dynamic upper critical dimension to zero ($d_{u}\\rightarrow0$). This marginal topology dynamically suppresses the replica-coupling vertices, yielding an infinite-order Berezinskii-Kosterlitz-Thouless (BKT) transition and a non-integrable replicon divergence that predicts a massive instability toward 1-step Replica Symmetry Breaking (1-RSB). Leveraging a spectral Corner Transfer Matrix Renormalization Group (CTMRG) architecture up to macroscopic scales ($L=1024$), we quantitatively validate the topological scaling argument $\\mathcal{G}((T-T_{c})\\ln(L/L_{0}))$. By isolating the continuum field theory from microscopic lattice artifacts, we recover the fundamental lattice metric $L_{0}\\approx 0.94$, unequivocally confirming the existence of a distinct, topologically driven spin-glass phase.", "url": "https://arxiv.org/abs/2604.10309", "type": "理论+数值", "summary": "1. 本研究通过张量网络采样与理论分析，揭示了规范约束如何改变二维自旋玻璃的普适类并引发拓扑驱动相变。\n2. 核心在于将算法无序分布映射到二维Ising共形场论，证明动态上临界维数降为零导致边际拓扑与无限阶BKT转变。\n3. 所提取的连续场论与晶格度量$L_0$为区分拓扑驱动自旋玻璃相与常规无序系统提供了严格基准。", "summary_source": "deepseek", "authors": [{"name": "Alok Yadav"}], "featured_authors": [{"name": "Alok Yadav"}], "author_count": 1}, {"id": "2604.10468", "category": "cond-mat", "title": "Dynamical Facilitation in Active Glass Formers: Role of Morphology and Persistence", "abstract": "Understanding dynamical facilitation in nonequilibrium glass-forming systems driven by active forces remains an open challenge. In particular, it is unclear whether facilitation survives in active glasses, where persistent self-propulsion breaks detailed balance and introduces directional memory. Here, we use large-scale simulations of a two-dimensional athermal Ornstein-Uhlenbeck particle model to investigate how persistent active forcing modifies cooperative relaxation. We analyze the morphology of cooperatively rearranging regions (CRRs) and the spatial transport of mobility excitations. A spatially resolved core-shell decomposition reveals distinct responses of the core and shell to activity: the core undergoes global morphological changes while retaining internal plasticity, whereas the shell acts as a rigid scaffold that supports primarily axial deformation and facilitates transport. Dynamical observables, including modal displacement, shell occupation probability, and facilitation length, exhibit a pronounced non-monotonic dependence on persistence time. This behavior reflects the competition between persistence and effective noise, leading to either coherent or trapping-dominated dynamics at large persistence, depending on temperature. Despite significant morphological changes, the facilitation length shows an approximate scaling collapse when rescaled by the persistence length, $l_p=\\sqrt{T_{\\mathrm{eff}}\\tau_p}$. This is consistent with a diffusive-like time-length coupling, $\\xi_{\\mathrm{fac}} \\sim \\tau_{\\alpha}^{1/2}$, indicating that activity reshapes facilitation pathways without altering their large-scale transport character. Our results support a generalized facilitation framework for active glass formers.", "url": "https://arxiv.org/abs/2604.10468", "type": "理论+数值", "summary": "1. 该工作通过大规模模拟二维非热奥恩斯坦-乌伦贝克粒子模型，系统研究了活性玻璃形成体中动力学促进的形态演化与持久性依赖。\n2. 其物理卖点在于空间分辨核-壳分解揭示核心与壳层对活性响应迥异：核心全局形态变而内塑性存，壳层刚性支架主轴向变形促输运，且促进长度等观测量随持久时间非单调变化源于持久性与有效噪声竞争。\n3. 这为活性玻璃体系确立了广义促进框架，促进长度以持久长度标度后近似塌缩，印证了扩散型时间-长度耦合，表明活性重塑促进路径而不改其大尺度输运本质。", "summary_source": "deepseek", "authors": [{"name": "Dipanwita Ghoshal"}], "featured_authors": [{"name": "Dipanwita Ghoshal"}], "author_count": 1}, {"id": "2604.10483", "category": "cond-mat", "title": "Topological Magnon-Phonon Hybrid Bands in Ferromagnetic Skyrmion Crystals", "abstract": "We investigate magnon-phonon (MP) excitations in a Neel-type two-dimensional ferromagnetic skyrmion crystal (SkX) stabilized on a triangular spin lattice by Dzyaloshinskii-Moriya interaction (DMI). Although the lowest two magnon bands of the bare SkX are topologically trivial, we show that coupling to lattice vibrations reconstructs the low-energy sector and generates topological MP hybrid bands. Starting from a spin-lattice Hamiltonian in which phonons couple to magnons through fluctuations of the DMI vectors, we derive the bosonic Hamiltonian for the SkX and compute the hybrid band structure by Bogoliubov diagonalization. MP coupling opens gaps at low-energy magnon-phonon crossings, lifts phonon degeneracies associated with supercell folding, and yields nontrivial Chern numbers for the lowest hybrid bands. The resulting low-energy topology and associated edge states remain robust under magnetic-field variation, while higher-energy hybrid bands can undergo field-driven topological phase transitions. These results extend topological magnon-phonon hybridization to noncoplanar SkXs.", "url": "https://arxiv.org/abs/2604.10483", "type": "理论", "summary": "1. 该工作研究了三角晶格DMI稳定的二维Néel型铁磁斯格明子晶体中的磁振子-声子耦合激发。\n2. 其核心在于揭示了声子耦合通过重构低能磁振子能带，在原本平庸的能隙处打开拓扑非平庸的杂化能带并赋予非零陈数。\n3. 这为在非共面磁性体系中实现鲁棒的拓扑声-磁杂化态及其场控拓扑相变提供了理论依据与研究框架。", "summary_source": "deepseek", "authors": [{"name": "Doried Ghader"}, {"name": "Bilal Jabakhanji"}], "featured_authors": [{"name": "Doried Ghader"}, {"name": "Bilal Jabakhanji"}], "author_count": 2}, {"id": "2604.10489", "category": "cond-mat", "title": "The effect of grain boundaries on magnetic exchange interactions in iron", "abstract": "This work investigates how grain boundaries (GBs) modify magnetic exchange interactions in bcc iron, with particular focus on the effect of phosphorus segregation. Using density-functional theory combined with the Liechtenstein-Katsnelson-Antropov-Gubanov Green's-function approach, we calculate Heisenberg exchange parameters for three symmetric tilt GBs, $\\Sigma5(310)$, $\\Sigma13(510)$, and $\\Sigma13(320)$, and use these parameters in Monte Carlo simulations to evaluate finite-temperature magnetic behavior. All clean GBs exhibit strong local deviations from bulk exchange interactions, including antiferromagnetic coupling across the boundary plane. These negative exchange interactions are not governed by interatomic distance alone, but arise primarily from the altered local coordination and symmetry breaking at the GB. Phosphorus segregation, modeled in both substitutional and interstitial configurations at the $\\Sigma5(310)$ GB, suppresses the antiferromagnetic couplings and significantly redistributes the local exchange landscape through chemical and electronic effects. Monte Carlo results show that, despite pronounced local perturbations, realistic GB densities cause only a small reduction in the Curie temperature because bulk-like regions dominate the global magnetic transition. A substantial decrease in Curie temperature appears only when the GB volume fraction is artificially increased. The results demonstrate that GBs strongly influence local magnetic interactions while having a limited effect on global magnetic ordering, and they establish a general framework for linking atomistic interfacial structure and chemistry to mesoscale magnetic behavior in Fe-based materials.", "url": "https://arxiv.org/abs/2604.10489", "type": "理论+数值", "summary": "1. 该工作结合密度泛函理论与蒙特卡罗模拟，研究了三种对称倾斜晶界及其磷偏析对bcc铁磁交换作用与有限温度磁性的影响。\n2. 研究发现清洁晶界处因局域配位与对称性破缺产生面内反铁磁耦合，而磷偏析通过化学与电子效应显著抑制该反磁耦合并重构局域交换作用分布。\n3. 结果表明实际晶界密度下居里温度仅小幅降低，这为从原子界面结构/化学出发预测铁基材料介观磁行为建立了普适框架。", "summary_source": "deepseek", "authors": [{"name": "Martin Zelený"}, {"name": "Martin Heczko"}, {"name": "Petr Šesták"}, {"name": "Denis Ledue"}, {"name": "Renaud Patte"}, {"name": "Miroslav Černý"}], "featured_authors": [{"name": "Martin Zelený"}, {"name": "Martin Heczko"}, {"name": "Petr Šesták"}, {"name": "Denis Ledue"}, {"name": "Renaud Patte"}, {"name": "Miroslav Černý"}], "author_count": 6}, {"id": "2604.10538", "category": "cond-mat", "title": "Quantum to classical relaxation dynamics of the dissipative Rydberg gas", "abstract": "We investigate the relaxation dynamics of a Rydberg gas in regimes where coherent processes and dissipation compete. In the strongly dissipative limit, the dynamics is known to be governed by an effective classical rate equation and to exhibit kinetically constrained, glassy relaxation towards a trivial stationary state. This behaviour originates from the Rydberg blockade, which prevents simultaneous excitations within a characteristic blockade radius. However, the fate of kinetic constraints in the weakly dissipative limit remains unexplored in large systems above one dimension. To access large system sizes and two-dimensional geometries, we employ the truncated Wigner approximation, a phase-space method that captures correlated many-body dynamics beyond classical rate equations. To probe the emergence of kinetic constraints on timescales where coherent and dissipative processes are comparable, we analyse the relaxation dynamics starting from two initial states: a fully polarised state and a Néel state, which belongs to a manifold of so-called quantum scars. In both cases, we observe a pronounced slowdown in the relaxation of the magnetisation towards the stationary state and identify transient signatures of quantum kinetically constrained dynamics in one and two dimensions.", "url": "https://arxiv.org/abs/2604.10538", "type": "理论", "summary": "1. 该工作利用截断Wigner近似研究了二维里德堡气体在弱耗散区域的量子至经典弛豫动力学。\n2. 其核心发现是，在相干与耗散过程相当的时域内，体系在多种初态下均呈现磁化弛豫的显著减缓，并在一维与二维中观测到量子动力学约束的瞬态特征。\n3. 这一结果为在量子模拟器平台中探索耗散诱导的动力学约束与非平衡物态提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Viktoria Noel"}, {"name": "Igor Lesanovsky"}], "featured_authors": [{"name": "Viktoria Noel"}, {"name": "Igor Lesanovsky"}], "author_count": 2}, {"id": "2604.10552", "category": "cond-mat", "title": "The class C quantum network model with random tunneling and its nonlinear sigma model representation", "abstract": "The spin quantum Hall effect is a relative of the integer quantum Hall effect, characterized by integer quantized spin Hall conductance. In this work, we formulate and investigate a quantum network model consisting of $\\textsf{N}$ channels per chiral link, preserving the fundamental symmetries of the spin quantum Hall effect. We demonstrate that, in the general case, the triplet sector of the theory remains coupled to the singlet sector. In the large-$\\textsf{N}$ limit, we systematically derive the effective long-distance, low-energy field theory, identified as a nonlinear sigma model. Our analysis reveals that while triplet modes are typically massive and do not influence the large-$\\textsf{N}$ nonlinear sigma model, specific conditions exist where these modes become `soft', thereby increasing the ultraviolet cutoff length of the effective theory. Furthermore, by calculating the bare longitudinal and spin Hall conductances, we show that the standard saddle-point approximation fails in regimes with significant tunneling asymmetry between even and odd links. Finally, we establish that the introduction of a Zeeman field not only breaks the SU(2) symmetry of the nonlinear sigma model action but also generates a term that explicitly violates inversion symmetry.", "url": "https://arxiv.org/abs/2604.10552", "type": "理论", "summary": "1. 该工作构建并研究了一个具有随机隧穿、每手征链含N通道的C类量子网络模型，并系统推导出其大N极限下的有效长程低能场论——非线性σ模型。\n2. 其核心发现是：尽管三重态模式通常有质量而不影响大N非线性σ模型，但在特定条件下它们会“软化”从而提高有效理论的紫外截断能标；同时标准鞍点近似在隧穿不对称性显著时会失效。\n3. 这为理解对称性破缺效应提供了明确线索：塞曼场的引入不仅破坏非线性σ模型作用的SU(2)对称性，还会产生显式破坏空间反演对称的项，这对相关拓扑输运研究具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "D. S. Katkov"}, {"name": "M. V. Parfenov"}, {"name": "I. S. Burmistrov"}], "featured_authors": [{"name": "D. S. Katkov"}, {"name": "M. V. Parfenov"}, {"name": "I. S. Burmistrov"}], "author_count": 3}, {"id": "2604.10576", "category": "cond-mat", "title": "Microscopic model for the ground state, 1/3 plateau and excitations of $γ$-Mn$_3$(PO$_4$)$_2$", "abstract": "We present a magnetic model for an antiferromagnetic compound $\\gamma$-Mn$_3$(PO$_4$)$_2$, which was previously shown to exhibit a 1/3 magnetization plateau due to the trimer-based structure of the lattice of magnetic Mn$^{2+}$ ions with $S=5/2$. An exchange Hamiltonian that yields observed field transitions is obtained from fitting magnetization data. It is shown that both biquadratic coupling and single-ion anisotropy are necessary to be present in the magnetic model to explain multiple phase transitions in the magnetic susceptibility data. The calculated magnetic spectrum is in agreement with the low-temperature specific heat data.", "url": "https://arxiv.org/abs/2604.10576", "type": "理论", "summary": "1. 该工作为反铁磁化合物γ-Mn3(PO4)2建立了微观磁模型，解释了其基态、1/3磁化平台及相关激发。\n2. 模型的核心在于，必须同时引入双二次交换耦合与单离子各向异性，才能准确复现磁化率数据中观测到的多个相变。\n3. 计算得到的磁激发谱与低温比热数据吻合，验证了模型的可靠性，并为研究其他类似三聚体晶格体系提供了可移植的理论框架。", "summary_source": "deepseek", "authors": [{"name": "P. A. Maksimov"}, {"name": "L. V. Shvanskaya"}, {"name": "O. S. Volkova"}, {"name": "A. N. Vasiliev"}], "featured_authors": [{"name": "P. A. Maksimov"}, {"name": "L. V. Shvanskaya"}, {"name": "O. S. Volkova"}, {"name": "A. N. Vasiliev"}], "author_count": 4}, {"id": "2604.10581", "category": "cond-mat", "title": "Strain-tunable interface electrostatics in Janus MoSSe/silk vdW heterostructure for triboelectric nanogeneration", "abstract": "Understanding and engineering interfacial electrostatics in hybrid two-dimensional (2D) and biomolecular material systems is essential for advancing high-performance triboelectric nanogenerators (TENGs). In this work, we systematically investigate the strain-dependent electronic structure and triboelectric response of Janus MoSSe, silk fibroin, and their van der Waals (vdW) heterostructure using first-principles calculations. Tensile strain induces a pronounced band-gap reduction in the MoSSe/silk interface, exceeding that of the isolated constituents and indicating enhanced interlayer electronic coupling. The vdW heterostructure exhibits a significant work-function shift and a substantially larger dipole moment compared to MoSSe and silk alone, revealing strong interfacial charge redistribution driven by Fermi-level alignment and asymmetric polarization. This enhanced polarization directly amplifies the triboelectric surface charge density, producing values more than double those of pristine MoSSe and several orders of magnitude higher than silk. Consequently, the open-circuit voltage and overall triboelectric output are markedly improved across all strain levels. These results demonstrate that synergistic interfacial polarization and strain engineering can effectively elevate charge separation, storage, and transfer efficiencies, establishing the MoSSe/silk vdW heterostructure as a promising material for next-generation high-efficiency TENGs.", "url": "https://arxiv.org/abs/2604.10581", "type": "数值", "summary": "1. 本文通过第一性原理计算系统研究了应变对Janus MoSSe/丝素蛋白范德华异质结电子结构与摩擦电响应的影响。\n2. 应变引发的显著界面带隙缩减与费米能级对齐导致强电荷重分布，使异质结偶极矩与表面电荷密度大幅超越单一组分。\n3. 该工作为通过协同界面极化与应变工程提升电荷分离与转移效率提供了明确的材料设计策略。", "summary_source": "deepseek", "authors": [{"name": "Deobrat Singh"}, {"name": "Raquel Lizarraga"}], "featured_authors": [{"name": "Deobrat Singh"}, {"name": "Raquel Lizarraga"}], "author_count": 2}, {"id": "2604.10630", "category": "cond-mat", "title": "Electrochemical stability and lithium insertion at the Li|Li3OCl solid electrolyte interface", "abstract": "Solid-state lithium batteries have attracted considerable attention due to their potential to provide improved safety and higher energy density compared with conventional liquid electrolyte batteries. However, the stability of the interface between Li metal anodes and solid electrolytes remains a critical issue that strongly influences battery performance. In this work, first-principles density functional theory calculations are performed to investigate the interfacial properties of a solid-state battery system composed of Li metal anode and Li3OCl solid electrolyte. The structural stability, electronic structure, and electrochemical behavior of the Li|Li3OCl interface are systematically analyzed. Several interface orientations are constructed and compared in order to identify the most energetically favorable configuration. The electronic properties and interfacial charge redistribution are further examined to understand the nature of the interaction between Li metal and the Li3OCl electrolyte. Our results indicate that the Li|Li3OCl interface exhibits stable structural and electronic characteristics, with localized charge redistribution occurring near the interface region. The electrochemical stability against the insertion of an additional Li atom is also evaluated, showing that Li incorporation is energetically unfavorable in most layers of the electrolyte. These results suggest that the Li3OCl electrolyte maintains good electrochemical stability in contact with Li metal. The present study provides atomic-scale insight into the interfacial behavior of Li|Li3OCl and highlights the potential of Li3OCl as a promising solid electrolyte for solid-state lithium batteries.", "url": "https://arxiv.org/abs/2604.10630", "type": "理论+数值", "summary": "1. 该工作基于第一性原理密度泛函理论计算，系统研究了锂金属负极与Li3OCl固体电解质界面的结构稳定性、电子性质及电化学行为。\n2. 其技术核心在于通过比较多种界面取向，揭示了界面电荷局域重分布和额外锂原子插入在电解液多数层中能量不利的关键特征。\n3. 这为理解固态锂电池界面原子尺度行为提供了理论基础，并支持Li3OCl作为高性能固体电解质的进一步开发与优化。", "summary_source": "deepseek", "authors": [{"name": "Deobrat Singh"}, {"name": "Li-Yun Tian"}, {"name": "Moyses Araujo"}, {"name": "Raquel Lizarraga"}], "featured_authors": [{"name": "Deobrat Singh"}, {"name": "Li-Yun Tian"}, {"name": "Moyses Araujo"}, {"name": "Raquel Lizarraga"}], "author_count": 4}, {"id": "2604.10653", "category": "cond-mat", "title": "On stress-assisted boundary migration during recrystallization", "abstract": "This study investigates the boundary migration mechanisms near the sample surface of recrystallizing grains in high-purity Al subjected to cryogenic rolling. Local strain and stress tensors were characterized during \\textit{in situ} annealing by combining high-resolution electron backscatter diffraction with microstructure-based digital image correlation strain analysis. The results reveal local residual strains on the order of $10^{-3}$ within the recrystallizing grain, with values several times higher in the adjacent deformed matrix. The residual stresses in recrystallizing grains are a passive response to those developed within the surrounding deformed grains; the latter being strongly influenced by the local geometry and characteristics of dislocation boundaries, as well as by constraints imposed by neighboring grains. No evidence of shear-coupled motion was observed during the recrystallization boundary migration, despite the presence of shear stress across the boundary. In contrast, detailed analysis of the principal strain components reveals a clear correlation between residual strain patterns and boundary migration directions. These findings indicate that recrystallization boundary migration is modulated by the anisotropy of the local internal stress state.", "url": "https://arxiv.org/abs/2604.10653", "type": "理论", "summary": "1. 该研究通过结合高分辨率电子背散射衍射与基于微观结构的数字图像相关应变分析，对深冷轧制高纯铝中原位退火过程的再结晶晶界迁移机制进行了定量表征。\n2. 研究发现迁移方向与残余应变模式显著相关，且尽管存在切应力却未观察到剪切耦合运动，表明再结晶晶界迁移受局部内应力各向异性调制。\n3. 这为理解再结晶过程中晶界迁移的驱动力与动力学提供了新视角，并对调控金属微观组织与性能的加工工艺具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Yubin Zhang"}, {"name": "Qiwei Shi"}, {"name": "Guilin Wu"}], "featured_authors": [{"name": "Yubin Zhang"}, {"name": "Qiwei Shi"}, {"name": "Guilin Wu"}], "author_count": 3}, {"id": "2604.10663", "category": "cond-mat", "title": "Confined kinetics and heterogeneous diffusion driven by fractional Gaussian noise: A path integral approach", "abstract": "Many complex systems are described by Langevin-type equations in which the noise exhibits long-range correlations and couples to the system in a state-dependent, multiplicative manner, leading to heterogeneous non-Markovian diffusion. Here, we investigate the problem of diffusion driven by fractional Gaussian noise with a general multiplicative coefficient from a path-integral perspective. Using a stationary-phase approximation, we derive a Gaussian propagator expressed in terms of the Lamperti transform of the process. In the additive limit, our results recover the path-integral representation of fractional Brownian motion based on its Riemann-Liouville formulation and establish its equivalence with the Langevin construction. We further analyze the effect of subordinating the process to a killing rate within the Feynman-Kac framework, and develop a general procedure to derive kinetic equations in terms of effective local Hamiltonians. We show that the interplay between multiplicative diffusion and confinement induces an effective drift term, leading to probability accumulation in regions of low noise amplitude.", "url": "https://arxiv.org/abs/2604.10663", "type": "理论", "summary": "1. 该工作从路径积分角度研究了由分数阶高斯噪声驱动、且具有一般乘性系数的非马尔可夫扩散过程，并分析了其在Feynman-Kac框架下服从灭活率约束的动力学。\n2. 其核心在于通过平稳相位近似推导出高斯传播子，并揭示了乘性扩散与空间约束的相互作用会诱导出等效漂移项，导致概率在噪声振幅较低区域累积。\n3. 这为基于有效局域哈密顿量推导复杂非平衡系统的动力学方程提供了普适框架，可推广至其他具有长程关联和状态依赖噪声的体系。", "summary_source": "deepseek", "authors": [{"name": "David Santiago Quevedo"}, {"name": "Felipe Segundo Abril-Bermúdez"}, {"name": "Cristiane Morais Smith"}], "featured_authors": [{"name": "David Santiago Quevedo"}, {"name": "Felipe Segundo Abril-Bermúdez"}, {"name": "Cristiane Morais Smith"}], "author_count": 3}, {"id": "2604.10709", "category": "cond-mat", "title": "Geometric control of powder jet dynamics and energy dissipation", "abstract": "Applying an impulsive force to a powder layer shaped with a concave surface generates a sharp powder jet. This phenomenon has been proposed as a method for evaluating the flowability of powders from small amount of samples. In this study, we systematically varied the radius of the initial concave shape as a controllable parameter and quantitatively examined the resulting jet dynamics, focusing on ejection velocity and maximum height. Our high-speed observations revealed that increasing the concave radius led to broader jets with significantly reduced velocity and maximum height. These dynamic quantities followed a scaling relation with drop height, while the scaling coefficient decreased with the concave radius, indicating that the surface geometry directly governs the extent of energy dissipation. Furthermore, a minimal mechanical model incorporating the sliding distance and velocity squared type dissipation of the powder flow reproduces the observed linear dependence of the jet height on the concave radius. These findings establish powder jets as a sensitive probe of dissipation in dynamic powder flow and provide a quantitative framework for comparing powder specific interactions such as humidity, particle size and particle shape.", "url": "https://arxiv.org/abs/2604.10709", "type": "理论", "summary": "1. 该研究系统改变粉末层初始凹面半径，定量分析粉末射流动力学，聚焦喷射速度与最大高度。\n2. 其揭示凹面半径通过滑动距离与速度平方型耗散控制射流高度，最小力学模型复现线性依赖关系。\n3. 这为动态粉末流耗散提供灵敏探针，并建立量化比较湿度、粒径等粉末相互作用的框架。", "summary_source": "deepseek", "authors": [{"name": "Kazuya U. Kobayash"}, {"name": "Komei Jinbo"}, {"name": "Riku Kodama"}, {"name": "Masakazu Muto"}, {"name": "Rei Kurita"}], "featured_authors": [{"name": "Kazuya U. Kobayash"}, {"name": "Komei Jinbo"}, {"name": "Riku Kodama"}, {"name": "Masakazu Muto"}, {"name": "Rei Kurita"}], "author_count": 5}, {"id": "2604.10731", "category": "cond-mat", "title": "Anderson localization via Peierls phase modulation", "abstract": "We investigate a two leg ladder system subjected to an external magnetic field. In the absence of a magnetic field, the system is described by a clean tight binding model, with no disorder in either the onsite potential or the hopping amplitudes. The effect of magnetic field in this system is studied by introducing the Peierls phases in the hopping amplitudes along a leg (appropriate when the Landau gauge is chosen). For a uniform magnetic field, characterized by a constant Peierls phase, we find that all eigenstates remain delocalized. In contrast, random Peierls phases, representing a random magnetic field, lead to complete localization of the eigenstates. We further show that a quasiperiodic modulation of the Peierls phase can drive a transition from a fully delocalized to a fully localized phase upon tuning the quasiperiodicity. For a two parameter quasiperiodic Peierls phase, varying analogously to a generalized Aubry Andre type potential, we construct the phase diagram of the system. The phase diagram exhibits regions of delocalized and localized phases, separated by intermediate regimes of mixed phase. We also perform a semiclassical analysis that qualitatively yields a similar phase diagram, capturing the localization transition. Our results demonstrate a mechanism for controlling transport properties via the Peierls phase engineering.", "url": "https://arxiv.org/abs/2604.10731", "type": "理论+数值", "summary": "1. 该工作通过Peierls相位调制研究了双腿梯子系统中安德森局域化现象，绘制了准周期调制下的相图并完成了半经典分析验证。\n2. 其核心发现在于揭示了随机Peierls相位可导致完全局域化，而准周期调制能驱动从扩展到局域化的相变，且半经典分析与量子结果定性一致。\n3. 这为通过Peierls相位工程调控量子输运提供了新机制，对人工量子系统中可控局域化的实现具有明确指导意义。", "summary_source": "deepseek", "authors": [{"name": "Arpita Goswami"}, {"name": "Pallabi Chatterjee"}, {"name": "Ranjan Modak"}, {"name": "Shaon Sahoo"}], "featured_authors": [{"name": "Arpita Goswami"}, {"name": "Pallabi Chatterjee"}, {"name": "Ranjan Modak"}, {"name": "Shaon Sahoo"}], "author_count": 4}, {"id": "2604.10768", "category": "cond-mat", "title": "Structural Reconstruction Induced d-wave Altermagnetism in $\\mathrm{V_{2}X_2}$ ($X = \\mathrm{S, Se}$) monolayer", "abstract": "Altermagnetism, featuring momentum-dependent spin splitting without relativistic effects, holds promise for next generation spintronic applications. In this study, we investigate the momentum-dependent spin splitting in the electronic band structure of a reconstructed $V_{2}X_{2}$ ($X=\\mathrm{S, Se}$) lattice, achieved by introducing chalcogen cluster vacancies in trigonal $VX_{2}$ ($X=\\mathrm{S, Se}$) monolayer. The reconstructed structure forms an inverse Lieb lattice of vanadium atoms, comprising two magnetic sublattices related by $C_{4}$ lattice rotational symmetry and $C_{2}$ magnetic symmetry, resulting in zero net magnetization despite the breaking of time-reversal ($\\mathcal{T}$) and combined inversion time-reversal ($\\mathcal{PT}$) symmetries. The electronic structure exhibits strongly anisotropic spin splitting on the Fermi surface, pronounced along $\\Gamma\\!-\\!X$ and $\\Gamma\\!-\\!Y$ and vanishing near $M$ point, revealing symmetry-enforced nodal features. The spin splitting follows a fourfold angular modulation consistent with $d_{x^{2}-y^{2}}$-type altermagnetism, while the real-space spin density exhibits a corresponding $d$-wave pattern localized on vanadium sites. Our findings demonstrate that vacancy-driven reconstruction provides an effective route realizing two-dimensional d-wave altermagnets, opening a new avenue for advanced spintronic technologies.", "url": "https://arxiv.org/abs/2604.10768", "type": "理论", "summary": "1. 该研究通过在三角晶系VX₂单层中引入硫族元素团簇空位，实现了晶格重构，并系统研究了重构后V₂X₂单层的动量依赖自旋劈裂电子结构。\n2. 其核心在于重构形成的钒原子逆李晶格具有C₄晶格旋转与C₂磁对称性，在破坏时间反演与联合反演对称性却保持净磁化强度为零的条件下，产生了符合d_{x²-y²}波对称性的四重角调制自旋劈裂。\n3. 这证明空位驱动的结构重构是实现二维d波交替磁体的有效途径，为基于对称性工程设计的新型自旋电子器件提供了明确材料平台。", "summary_source": "deepseek", "authors": [{"name": "Geethanjali S"}, {"name": "Sasmita Mohakud"}], "featured_authors": [{"name": "Geethanjali S"}, {"name": "Sasmita Mohakud"}], "author_count": 2}, {"id": "2604.10775", "category": "cond-mat", "title": "Thermalization Fronts in the Hubbard-Holstein Model", "abstract": "We investigate the nonequilibrium dynamics of the weak-coupling Hubbard-Holstein model after a sudden switch-on of the electron-phonon interaction within nonequilibrium dynamical mean-field theory (DMFT). Using the self-consistent Migdal approximation for the electron-phonon coupling together with second-order perturbation theory for the electron-electron interaction, we show that the relaxation dynamics exhibits a crossover between electron-dominated and phonon-dominated regimes, extending to finite Hubbard interaction the scenario previously identified in the Holstein model. To investigate the microscopic buildup of the thermal state, we analyze the dynamics within the Step-by-Step DMFT framework. In the plane of real time and DMFT iteration number, thermalization is marked by a sharp propagating front. This front appears in electronic observables already for weak quenches within the simulated time window, whereas the phononic sector exhibits a visible front only at sufficiently strong coupling. Thus, at weak coupling the local dispersionless phonons show a delayed onset of front formation, while near and beyond the crossover the front develops on comparable timescales in both the electronic and phononic sectors. Whenever both fronts are resolved, they propagate with the same velocity, showing that thermalization spreads coherently through the coupled electron-phonon system.", "url": "https://arxiv.org/abs/2604.10775", "type": "理论+数值", "summary": "1. 该工作基于非平衡动力学平均场理论，研究了弱耦合Hubbard-Holstein模型中电子-声子相互作用突然开启后的弛豫动力学与热化过程。\n2. 通过结合Step-by-Step DMFT框架分析，发现热化在实时与DMFT迭代数构成的平面上表现为尖锐的传播前沿，且在可分辨时电子与声子前沿速度一致，揭示了耦合系统中热化的相干传播特性。\n3. 该微观热化前沿的分析方法为理解有限相互作用下多体系统非平衡动力学的电子-声子耦合机制提供了新视角，并可拓展至其他关联量子模型的研究。", "summary_source": "deepseek", "authors": [{"name": "Antonio Picano"}, {"name": "Marco Schiro"}], "featured_authors": [{"name": "Antonio Picano"}, {"name": "Marco Schiro"}], "author_count": 2}, {"id": "2604.10839", "category": "cond-mat", "title": "Emergent Quantum Droplets in Logarithmic Klein-Gordon Models of Bose-Einstein Condensates", "abstract": "We study a relativistic scalar field model for self-bound Bose-Einstein condensates (BECs) by analyzing a nonlinear Klein-Gordon equation with cubic and logarithmic interactions. This framework captures essential features of quantum droplets, such as self-trapping and finite energy configurations, which emerge from the interplay between attractive and repulsive terms. By performing the non-relativistic limit, we derive a generalized Gross-Pitaevskii equation with a logarithmic correction, consistent with recent models used to describe ultra-cold atomic gasses beyond mean-field theory. We construct the corresponding Lagrangian density, identify conserved quantities via Noether's theorem, and compute the energy-momentum tensor. Numerical solutions of the BEC parameters are shown, establishing the foundations for a field theoretical description of relativistic condensates with a logarithmic interaction. This model provides a unified approach to investigate relativistic effects in quantum droplets and enriches the theoretical landscape of Bose-Einstein condensates with non-standard interactions. The resulting dynamics exhibit stable oscillatory regimes consistent with self-bound condensate configurations.", "url": "https://arxiv.org/abs/2604.10839", "type": "理论+数值", "summary": "1. 该工作通过分析含立方项与对数项相互作用的非线性克莱因-戈登方程，研究了自束缚玻色-爱因斯坦凝聚体的相对论性标量场模型。\n2. 其核心在于从非相对论极限导出了具有对数修正的广义格罗斯-皮塔耶夫斯基方程，并利用诺特定理构建了守恒量与能量-动量张量。\n3. 这为研究对数相互作用下相对论性凝聚体的场论描述奠定了基础，并为探索量子液滴中的相对论效应提供了统一的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Kevin Hernández"}, {"name": "Elías Castellanos"}], "featured_authors": [{"name": "Kevin Hernández"}, {"name": "Elías Castellanos"}], "author_count": 2}, {"id": "2604.10887", "category": "cond-mat", "title": "A Lightweight Universal Machine-Learning Interatomic Potential via Knowledge Distillation for Scalable Atomistic Simulations", "abstract": "We introduce a lightweight universal machine-learning interatomic potential (uMLIP), SevenNet-Nano, based on the graph neural network architecture SevenNet and enabled by a knowledge-distillation framework. The model inherits the broad generalization capability of a large multi-task foundation model, SevenNet-Omni, trained on diverse materials datasets across chemical, configurational, and computational spaces. By learning chemical representations from high-quality inference data generated by the teacher model within a unified computational framework, SevenNet-Nano achieves high accuracy and strong transferability despite its compact architecture. The model also accurately captures a wide range of interatomic interactions, enabling reliable simulations under both equilibrium and extreme conditions, including plasma etching of SiO$_2$. Comprehensive benchmarks on static and dynamical properties--such as Li-ion diffusion and liquid densities--demonstrate its broad applicability with minimal fine-tuning. Importantly, SevenNet-Nano significantly reduces computational cost, achieving over an order-of-magnitude speedup and enabling large-scale atomistic simulations involving thousands of atoms.", "url": "https://arxiv.org/abs/2604.10887", "type": "理论+数值", "summary": "1. 该工作通过知识蒸馏框架，开发了基于图神经网络的轻量化通用机器学习原子间势SevenNet-Nano。\n2. 其关键在于模型通过向大型教师模型学习统一的化学表示，在保持紧凑架构的同时获得了优异的迁移性与准确性，例如精确模拟了SiO$_2$等离子体刻蚀等极端条件。\n3. 这使得在保证精度的前提下，计算效率大幅提升，为实现涉及数千原子的大规模原子模拟提供了高效工具。", "summary_source": "deepseek", "authors": [{"name": "Sangmin Oh"}, {"name": "Jinmu You"}, {"name": "Jaesun Kim"}, {"name": "Jiho Lee"}, {"name": "Hyungmin An"}, {"name": "Seungwu Han"}, {"name": "Youngho Kang"}], "featured_authors": [{"name": "Sangmin Oh"}, {"name": "Jinmu You"}, {"name": "Jaesun Kim"}, {"name": "Hyungmin An"}, {"name": "Seungwu Han"}, {"name": "Youngho Kang"}], "author_count": 7}, {"id": "2604.10890", "category": "cond-mat", "title": "Forecasting Return Time of Extreme Precipitation by Large Deviation Theory", "abstract": "Forecasting extreme precipitation is essential yet challenging due to its rarity and complexity. We develop a large deviation framework to estimate the return times of extreme precipitation events. We first find that the Landau distribution, originally introduced in plasma physics, accurately captures extreme precipitation at approximately 93% of global locations, outperforming conventional extreme value distributions with 76% matched locations under the same accuracy criterion. Enriching rare event samples by the fitted Landau distribution, we obtain more accurate estimates of large deviation rate functions and return times, enabling forecasts beyond historically observed precipitation intensities. Mapping historical return times to future projections from the Coupled Model Intercomparison Project Phase 6 (CMIP6), we show that return time curves under different emission scenarios collapse onto a unified relation, revealing a sharply increased lifetime exposure to extreme precipitation for 21st-century birth cohorts under most future emission scenarios.", "url": "https://arxiv.org/abs/2604.10890", "type": "理论", "summary": "1. 该研究建立了一个基于大偏差理论的框架，用于预测极端降水事件的重现时间。\n2. 其技术优势在于朗道分布在全球约93%位置更优拟合极端降水，并通过丰富稀有事件样本提升了大偏差率函数和重现时间的估计精度。\n3. 通过将历史重现时间映射到CMIP6未来投影，揭示了不同排放情景下曲线坍缩为统一关系，从而定量预示21世纪出生群体极端降水暴露风险的急剧增加。", "summary_source": "deepseek", "authors": [{"name": "Haotian Xie"}, {"name": "Haoxian Liu"}, {"name": "Jingfang Fan"}, {"name": "Ying Tang"}], "featured_authors": [{"name": "Haotian Xie"}, {"name": "Haoxian Liu"}, {"name": "Jingfang Fan"}, {"name": "Ying Tang"}], "author_count": 4}, {"id": "2604.10984", "category": "cond-mat", "title": "opt-DDAP: Optimisable density-derived atomic point charges via automatic differentiation", "abstract": "Interatomic potentials which accurately describe long-range electrostatics require atom-centred charges. One such method to determine these atom-centred charges from density functional theory (DFT) calculations is the density-derived atomic point (DDAP) charge method. DDAP fits atom-centred Gaussians to the ground-state DFT charge density and preserves the multipole moments that govern long-range electrostatics. While these charges accurately predict long-range behaviour, in practice, they are limited by their reliance on fixed, heuristic parameters and a constrained solver that becomes numerically unstable for complex or covalent systems. In this work, we present opt-DDAP, which solves this limitation by reformulating the algorithm as a differentiable computational graph. This reformulation allows for the optimisation of Gaussian basis parameters and the reciprocal-space cutoff using automatic differentiation. To ensure numerical robustness through this automatic differentiation process, we replace the conventional Lagrange-multiplier approach with a pseudo-inverse solution followed by charge renormalisation, maintaining stability even in the presence of ill-conditioned matrices. We validate the framework on NaCl vacancy supercells and on MoS$_2$, demonstrating faithful reconstruction of both absolute and difference charge densities. The optimised charges are intended to serve as inputs to effective electrostatic models in machine-learning and empirical interatomic potentials that incorporate long-range interactions.", "url": "https://arxiv.org/abs/2604.10984", "type": "理论+数值", "summary": "1. 该工作提出了opt-DDAP方法，通过将密度导出原子点电荷计算重构为可微分计算图，并在一系列体系上验证了其电荷密度重构精度。\n2. 其核心在于利用自动微分技术优化高斯基组参数与倒空间截断，并以伪逆解结合电荷重整化替代传统拉格朗日乘子法，确保了复杂共价体系中的数值稳定性。\n3. 这为机器学习势与经验势中精确描述长程静电作用的有效电荷模型提供了可优化、高稳健性的电荷生成方案。", "summary_source": "deepseek", "authors": [{"name": "Mohith H."}, {"name": "Sudarshan Vijay"
