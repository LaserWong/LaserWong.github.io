}], "featured_authors": [{"name": "Mohith H."}, {"name": "Sudarshan Vijay"}], "author_count": 2}, {"id": "2604.11015", "category": "cond-mat", "title": "Scar subspaces stabilized by algebraic closure: Beyond equally-spaced spectra and exact solvability", "abstract": "We construct a class of quantum many-body systems hosting an $\\mathfrak{su}(3)$-invariant scar subspace, extending the conventional paradigm of quantum many-body scars beyond equally spaced spectra and single-directional tower structures. Our construction is based on local constraints that realize an algebraic closure within the scar subspace. As a result, the spectrum in the subspace is no longer equally spaced, but instead forms a multidirectional lattice structure parametrized by multiple independent quantum numbers. This leads to qualitatively new dynamical signatures: instead of single-frequency revivals, the system exhibits multifrequency oscillations governed by integer linear combinations of distinct energy scales. Importantly, the stability of the scar subspace does not rely on exact solvability of individual eigenstates. We show that algebraic closure preserves the invariant subspace even under perturbations that render the eigenstates analytically intractable, thereby realizing quantum many-body scars on an unsolvable reference state. Our results identify algebraic closure as a unifying mechanism underlying scar subspaces beyond the conventional $\\mathfrak{su}(2)$ paradigm, and open a route toward richer nonthermal dynamics in nonintegrable quantum systems.", "url": "https://arxiv.org/abs/2604.11015", "type": "理论", "summary": "1. 该工作构建了一类具有𝔰𝔲(3)不变疤痕子空间的量子多体系统，突破了传统疤痕所要求的等间距能谱和单向塔状结构。\n2. 其核心机制在于通过局域约束实现疤痕子空间内的代数闭包，从而产生由多个独立量子数参数化的多方向能谱结构，并展现出由不同能标整数线性组合主导的多频振荡动力学。\n3. 这揭示了代数闭包作为超越传统𝔰𝔲(2)范式的统一机制，为在不可精确求解的参考态上实现稳定的疤痕子空间及更丰富的非平衡动力学开辟了道路。", "summary_source": "deepseek", "authors": [{"name": "Chihiro Matsui"}], "featured_authors": [{"name": "Chihiro Matsui"}], "author_count": 1}, {"id": "2604.11054", "category": "cond-mat", "title": "Topological charge of fermions and Landau theory of Fermi liquid", "abstract": "In the fermionic liquids, the Fermi surface is topologically stable,\\cite{Volovik2003} which is at the origin of the applicability of the Landau theory of Fermi liquid (LFL). The LFL exists under special condition, when the Green's function has a pole with nonzero residue $Z$. Otherwise one has non-Landau Fermi liquid (NLFL), such as Luttinger liquid, which is described by the same topological invariant. It appears that in general this topological invariant is the property of the fermionic particle, i.e. the particle charge (or the electric charge of electron) is equivalent to the topological charge of the fermion. The conservation of the fermionic charge is equivalent to the conservation of the topological charge. We consider the application of this topological charge to the Landau theory of Fermi liquids. We also consider the application to non-Fermi liquids and crystalline insulators in relation to the Luttinger theorem.", "url": "https://arxiv.org/abs/2604.11054", "type": "理论", "summary": "1. 该论文通过拓扑不变量阐明了费米子电荷与拓扑电荷的等效性，并将此概念应用于朗道费米液体理论及非费米液体体系。\n2. 其核心在于揭示了费米液体与非朗道费米液体（如Luttinger液体）可由同一拓扑不变量描述，且格林函数极点的非零留数Z对应了费米液体的特殊存在条件。\n3. 这为在更广泛的强关联体系与晶体绝缘体中理解Luttinger定理及相关拓扑特性提供了统一的理论视角。", "summary_source": "deepseek", "authors": [{"name": "G.E. Volovik"}], "featured_authors": [{"name": "G.E. Volovik"}], "author_count": 1}, {"id": "2604.11074", "category": "cond-mat", "title": "Parent Hamiltonian Construction of Generalized Calogero-Sutherland Models", "abstract": "The Calogero-Sutherland model is a paradigmatic integrable system describing one-dimensional non-relativistic particles with inverse-square interactions. At interaction strength $\\lambda=2$, the CSM exhibits a deep connection to anyon physics, featuring the Laughlin-Jastrow polynomial as its exact ground state. Motivated by this structure, we develop a general reverse-engineering construction of positive semi-definite continuum parent Hamiltonians for trial states admitting a rational conformal field theory description with central charge $c<1$. By leveraging the null-vector structure of the underlying primary fields and the associated Belavin-Polyakov-Zamolodchikov equations, we derive corresponding many-body annihilation operators. We then apply this construction explicitly to the Moore-Read and $k=3$ Read-Rezayi states - relating to Ising and Fibonacci anyons, respectively - obtaining continuum Hamiltonians for which these Jack-polynomial states are exact zero modes. We emphasize, however, that our construction does not by itself establish ground-state uniqueness or determine the nature of the excitation spectrum.", "url": "https://arxiv.org/abs/2604.11074", "type": "理论", "summary": "1. 该工作提出了一种针对具有有理共形场论描述的试验态构造连续母哈密顿量的反向工程方法，并应用于Moore-Read和k=3 Read-Rezayi态。\n2. 其技术核心在于利用底层共形场原初场的零模结构和BPZ方程，系统地推导出对应的多体湮灭算符，从而保证目标波函数成为精确零模。\n3. 此框架为研究非阿贝尔任意子关联的物理系统提供了明确的哈密顿量实现方案，但基态唯一性和激发谱性质仍需后续独立研究确定。", "summary_source": "deepseek", "authors": [{"name": "Hari Borutta"}, {"name": "Andreas Feuerpfeil"}, {"name": "Yasir Iqbal"}], "featured_authors": [{"name": "Hari Borutta"}, {"name": "Andreas Feuerpfeil"}, {"name": "Yasir Iqbal"}], "author_count": 3}, {"id": "2604.11132", "category": "cond-mat", "title": "Regular and Anomalous Motion of Individual Magnetic Quincke Rollers Under Rotating Magnetic Field", "abstract": "We report the motion of individual magnetic Quincke rollers composed of silica particles doped with superparamagnetic iron oxide nanoparticles, whose activity arises from the coupling between Quincke rolling and an externally applied rotating magnetic field. We applied a clockwise (CW) rotating magnetic field of magnitude approximately 11 mT and rotational frequencies ranging from 0.2 to 2.75 Hz. At low frequencies, the dominant mode of motion is a CW helical trajectory. Circular trajectories emerge as a limiting case of this helical motion, in which lateral translation vanishes and the particle traces overlapping closed loops in the xy-plane. At higher frequencies, a second regular mode becomes prevalent, characterized by helical wavy trajectories in which the particle follows a CW helical path with a spatially varying curvature. Under specific conditions, however, we observe the unexpected emergence of anomalous counterclockwise (CCW) trajectories, in which individual particles roll in a direction opposite to that of the applied CW rotating magnetic field. A theoretical model incorporating electrostatic interactions, far-field hydrodynamic coupling, and a magnetic dipole approximation indicates that the anomalous behavior results from the interplay among the magnitude and orientation of the initial magnetic dipole moment, the frequency of the rotating magnetic field, and the magnitude of the initial translational velocity. Together, these factors determine the likelihood of a particle exhibiting regular or anomalous rotational motion.", "url": "https://arxiv.org/abs/2604.11132", "type": "理论", "summary": "1. 本工作通过实验研究了单个磁性Quincke滚子在旋转磁场作用下的运动，观察到其在不同频率下呈现螺旋、圆形及波动螺旋等规则模式，以及在特定条件下出现与磁场旋转方向相反的异常反向运动。\n2. 该研究的核心在于通过结合静电相互作用、远场流体力学耦合及磁偶极子近似的理论模型，揭示了初始磁矩方向、磁场频率与初始平动速度三者间的非线性相互作用是诱发异常反向轨迹的物理机制。\n3. 这项研究为理解并调控活性物质系统的非互易相互作用提供了范例，对设计基于旋转磁场的微尺度机器人或可控输运系统具有明确的启示。", "summary_source": "deepseek", "authors": [{"name": "Zoran M. Cenev"}, {"name": "Ville S.I. Havu"}, {"name": "Jaakko V.I. Timonen"}], "featured_authors": [{"name": "Zoran M. Cenev"}, {"name": "Ville S.I. Havu"}, {"name": "Jaakko V.I. Timonen"}], "author_count": 3}, {"id": "2604.11139", "category": "cond-mat", "title": "GPU acceleration of plane-wave density functional theory calculations in Abinit", "abstract": "We report on the GPU porting of the Abinit high-performance simulation code for plane-wave DFT calculations. Large-scale electronic structure calculations require computing the electronic wave function by solving the Kohn-Sham problem discretized over a large number of plane-wave basis functions. Porting such calculations over hundreds of GPU nodes relies not only on extensive usage of vendor libraries from a development perspective, but also on algorithmic revisions of the iterative diagonalization procedure in the resolution of the Kohn-Sham problem to identify GPU-efficient mathematical operations (linear algebra, FFTs) applied to wave functions distributed in memory. The present contribution discusses the Abinit implementation on multi-GPU architectures, providing detailed performance results to compare CPU nodes versus heterogeneous CPU-GPU nodes. Particular attention is given in the comparison of two different diagonalization algorithms, that is Locally Optimal Block Preconditioned Conjugate Gradient and Chebyshev polynomial filtering, in terms of their GPU efficiency.", "url": "https://arxiv.org/abs/2604.11139", "type": "理论+数值", "summary": "1. 该工作实现了Abinit平面波密度泛函理论计算代码在GPU集群上的移植，并系统对比了CPU节点与CPU-GPU异构节点的计算性能。\n2. 其技术关键在于为适应GPU架构，对求解Kohn-Sham方程的迭代对角化流程进行了算法重构，并对比了局部最优块预处理共轭梯度法与切比雪夫多项式滤波法两种算法的GPU效率。\n3. 这为大规模电子结构计算提供了一种高效的异构计算方案，并为其他第一性原理代码的GPU移植与算法选择提供了重要参考。", "summary_source": "deepseek", "authors": [{"name": "Ioanna-Maria Lygatsika"}, {"name": "Marc Sarraute"}, {"name": "Lucas Baguet"}, {"name": "Pierre Kestener"}, {"name": "Marc Torrent"}], "featured_authors": [{"name": "Ioanna-Maria Lygatsika"}, {"name": "Marc Sarraute"}, {"name": "Lucas Baguet"}, {"name": "Pierre Kestener"}, {"name": "Marc Torrent"}], "author_count": 5}, {"id": "2604.11155", "category": "cond-mat", "title": "Tensor-Network Population Annealing", "abstract": "We propose a hybrid sampling method, tensor-network population annealing (TNPA), which combines tensor-network (TN) initialization with population annealing (PA). We apply this method to the two-dimensional Edwards-Anderson Ising spin glass. The approach is motivated by the limitations of existing methods: TN-based samplers can become numerically unstable in frustrated spin systems at low temperatures, whereas conventional PA requires a long annealing schedule when started from the high-temperature limit. In TNPA, TN contractions are used only within a reliable temperature range to generate initial configurations that are close to the equilibrium distribution. The subsequent low-temperature equilibration is then carried out by PA. To stabilize the initialization process, we introduce a diagnostic based on the effective sample size that adaptively selects the initialization temperature. The proposed framework provides a practical and physically motivated route to low-temperature sampling by combining the complementary strengths of TN and PA.", "url": "https://arxiv.org/abs/2604.11155", "type": "数值", "summary": "1. 本研究提出了一种混合采样方法——张量网络群体退火（TNPA），并将其应用于二维Edwards-Anderson伊辛自旋玻璃体系。\n2. 该方法的核心在于通过基于有效样本量的自适应诊断选择初始化温度，从而在可靠温度范围内利用张量网络生成接近平衡分布的初态，再通过群体退火完成低温平衡采样。\n3. 这一框架为结合张量网络精确表征与蒙特卡洛采样优势、实现复杂无序系统的低温高效模拟提供了新路径。", "summary_source": "deepseek", "authors": [{"name": "Takumi Oshima"}, {"name": "Yuma Ichikawa"}, {"name": "Koji Hukushima"}], "featured_authors": [{"name": "Takumi Oshima"}, {"name": "Yuma Ichikawa"}, {"name": "Koji Hukushima"}], "author_count": 3}, {"id": "2604.11169", "category": "cond-mat", "title": "Emergence of the unexpected charge-density-wave phase driven by artificial gauge field in three-leg Bose-Hubbard ladder", "abstract": "We investigate hard-core bosons at half filling on a three-leg ladder under the uniform artificial gauge field. By analyzing current patterns and correlation functions, we uncover a rich quantum phase diagram containing multiple superfluid and insulating phases. In bosonic ladder systems, increasing the gauge flux typically destabilizes the Meissner phase and leads to vortex phases characterized by circulating currents. In the present system, however, we find that charge-density-wave (CDW) phases emerge precisely in such a flux regime despite the presence of only an on-site interaction, where vortex states are naturally expected and are indeed realized in nearby parameter regions. While part of this behavior can be qualitatively understood from a strong-coupling perspective, we also identify an isolated CDW region that cannot be connected to such limits. Furthermore, upon increasing the artificial gauge flux, we observe a reentrant sequence of quantum phase transitions, CDW $\\to$ vortex-superfluid $\\to$ CDW, revealing a strong competition between the vortex phase and the density-wave order.", "url": "https://arxiv.org/abs/2604.11169", "type": "理论+数值", "summary": "1. 该工作研究了均匀人工规范场下三腿梯状格点中半填充硬核玻色子的相图，揭示了包括超流与绝缘相在内的丰富量子相。\n2. 其核心发现是在通常预期出现涡旋态的通量区间内，仅凭在位相互作用便涌现了电荷密度波相，并观察到CDW→涡旋超流→CDW的重入型量子相变序列。\n3. 这为理解几何约束与规范场共同作用下新奇量子序的稳定机制提供了范例，对调控光晶格中玻色系统的拓扑物态具有启示意义。", "summary_source": "deepseek", "authors": [{"name": "Takayuki Yokoyama"}, {"name": "Yasuhiro Tada"}], "featured_authors": [{"name": "Takayuki Yokoyama"}, {"name": "Yasuhiro Tada"}], "author_count": 2}, {"id": "2604.11173", "category": "cond-mat", "title": "Sluggish quantum mechanics of noninteracting fermions with spatially varying effective mass", "abstract": "We analyze a class of one-dimensional quantum systems characterized by a position-dependent kinetic term arising as the continuum limit of an inhomogeneous tight-binding model with spatially varying hopping amplitudes. In this limit, the Schrodinger equation takes the so-called BenDaniel-Duke form with an effective mass, scaling as $m_{eff}(x) = m_{eff}|x|^{\\alpha}$ with $\\alpha > 0$, leading to a framework we term sluggish quantum mechanics, where particle motion is progressively suppressed at larger distances. Both without any external potential and with $V_{ext}(x)=\\frac{1}{2}m_{eff}\\omega^2 |x|^{\\alpha+2}$, we obtain the eigenfunctions and the quantum propagators exactly. We then investigate the problem of $N$ noninteracting spinless fermions in the trap, determining the many-body ground-state wavefunction and the joint probability density function of the positions of the $N$ fermions. We show that the many-body quantum probability density in the ground state forms a determinantal point process whose correlation kernel can be computed for any $N$, giving access to the average density as well as higher order correlation functions for any finite $N$. Moreover, we analyze the scaling form of this kernel in the large $N$ limit in the bulk, near the edge, and close to the origin. Our results show that the scaled average density profile for large $N$ has a finite support symmetric with respect to the origin, but has a non-monotonic shape with a vanishing minimum at the origin for any $\\alpha>0$. One of the key findings of our work is that the scaled kernel near the origin $x=0$ for $\\alpha>0$ is neither the Bessel nor the Airy kernel (that are standard for trapped fermions), but is new, and is given by a sum of two Bessel kernels with different indices. Our results thus provide a framework relevant to engineered optical lattices with position-dependent tunneling.", "url": "https://arxiv.org/abs/2604.11173", "type": "理论+数值", "summary": "1. 该工作精确求解了具有空间依赖有效质量 \\( m_{\\text{eff}}(x) \\propto |x|^\\alpha \\) 的一维非相互作用费米子系统的单体能谱、传播子及多体基态关联性质。\n2. 核心发现是体系在原点附近（\\( x=0 \\)）的标度化关联核并非囚禁费米子中标准的贝塞尔或艾里核，而是由两个不同指标的贝塞尔核之和构成的新形式。\n3. 这为研究隧穿振幅随位置变化的光晶格等工程化体系提供了一个可精确计算密度分布与关联函数的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Giuseppe Del Vecchio Del Vecchio"}, {"name": "Manas Kulkarni"}, {"name": "Satya N. Majumdar"}, {"name": "Sanjib Sabhapandit"}], "featured_authors": [{"name": "Giuseppe Del Vecchio Del Vecchio"}, {"name": "Manas Kulkarni"}, {"name": "Satya N. Majumdar"}, {"name": "Sanjib Sabhapandit"}], "author_count": 4}, {"id": "2604.11186", "category": "cond-mat", "title": "High-Pressure Structural Evolution of Na2ZrSi2O7 and Na2ZrSi2O7.H2O: Topology-Driven Compression Behaviors, Phase Stability, and Electronic Transitions", "abstract": "Silicate frameworks exhibit diverse structural responses under extreme conditions, which are strongly influenced by hydration. Here, we present a comparative high-pressure synchrotron X-ray diffraction study of Na2ZrSi2O7 and its hydrated analogue Na2ZrSi2O7.H2O up to 30 GPa, combined with electronic structure calculations. At ambient conditions, both phases share the same primary building units (PBUs: [ZrO6] and [SiO4]) but differ in secondary building units (SBUs, M2T4 vs. M2T6). Under compression, Na2ZrSi2O7 undergoes a phase transition near 15 GPa, while the hydrated phase remains stable throughout the pressure range. The anhydrous compound exhibits a higher bulk modulus (B0 = 77.1 GPa) and less anisotropic compression compared with the hydrated phase (B0 = 66.3 GPa). Distinct deformation mechanisms are observed: the anhydrous framework accommodates pressure through [ZrO6] octahedral distortion, whereas the hydrated framework compresses via [Si2O7] group tilting. Electronic structure calculations indicate band gap widening with pressure in both phases; notably, Na2ZrSi2O7 shows a direct-to-indirect band gap transition, whereas the hydrated phase retains a direct gap. These results reveal how hydration-driven topological modifications at the secondary building unit scale dictate the pressure-induced structural evolution, phase stability, and electronic properties of zirconosilicate frameworks.", "url": "https://arxiv.org/abs/2604.11186", "type": "理论+数值", "summary": "1. 本研究通过高压同步辐射X射线衍射结合电子结构计算，对比研究了Na2ZrSi2O7及其水合物Na2ZrSi2O7·H2O在30 GPa内的结构演化与电子性质。\n2. 核心发现揭示了水合作用通过改变次级结构单元拓扑（M2T4→M2T6），调控了压缩行为：无水相在15 GPa发生相变并以[ZrO6]畸变主导压缩，而水合相保持稳定并通过[Si2O7]倾转适应压力，且两者体弹性模量与带隙演变路径显著不同。\n3. 该结果为通过次级结构单元尺度的拓扑设计来调控硅酸盐框架材料的高压稳定性、力学响应及电子性质提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Peijie Zhang"}, {"name": "Pablo Botella"}, {"name": "Neha Bura"}, {"name": "Xiao Dong"}, {"name": "Catalin Popescu"}, {"name": "Yellampalli Raghavendra"}, {"name": "Rakesh Shukla"}, {"name": "Srungarpu Nagabhusan Achary"}, {"name": "Daniel Errandonea"}], "featured_authors": [{"name": "Peijie Zhang"}, {"name": "Pablo Botella"}, {"name": "Neha Bura"}, {"name": "Rakesh Shukla"}, {"name": "Srungarpu Nagabhusan Achary"}, {"name": "Daniel Errandonea"}], "author_count": 9}, {"id": "2604.11236", "category": "cond-mat", "title": "Surface correlation functions of dead-leave models", "abstract": "The pore-surface and surface-surface correlation functions are structural characteristics that play an important role in theoretical materials science and in small-angle scattering theory. Exact analytical expressions for the surface correlation functions are available only for very few models, and we here derive such expressions for the general class of dead-leave models. Within these models, a two-phase pore/solid structure is created by sequentially and randomly filling space with pore-like or solid-like grains that overlap any preexisting structure, in the same way as dead leaves fall on the ground. The obtained mathematical expressions are valid for any grain shape, in arbitrary dimension. The results are illustrated with monodispersed spherical grains, as well as with a dead-leave realization of a Debye random medium. In the latter case, the size distribution of the grains is designed to produce a structure having exponential two-point correlation function. Compared to Debye random media obtained by numerical reconstruction, the dead-leave structure has almost identical surface-surface correlation function, but distinctly different pore-surface correlation function. As a byproduct of our analysis, we also submit a general expression for the pore-surface and surface-surface correlation functions of the Boolean model, valid for arbitrary grains.", "url": "https://arxiv.org/abs/2604.11236", "type": "理论+数值", "summary": "1. 本文为死叶模型这一广泛类别推导了孔表面与表面-表面关联函数的精确解析表达式。\n2. 所得数学表达式适用于任意维度和任意颗粒形状，其普适性是主要技术亮点，并通过球形颗粒和Debye随机介质的死叶实现予以例证。\n3. 结果揭示了死叶模型与数值重建的Debye随机介质在表面关联函数上的异同，这为通过设计颗粒序列来调控多孔介质表面结构特性提供了理论依据与新的思路。", "summary_source": "deepseek", "authors": [{"name": "Cedric J. Gommes"}], "featured_authors": [{"name": "Cedric J. Gommes"}], "author_count": 1}, {"id": "2604.11242", "category": "cond-mat", "title": "Magnetic Order of Dresselhaus-type Antiferromagnet EuIr$_4$In$_2$Ge$_4$ Studied by Single Crystal Neutron Diffraction", "abstract": "The magnetic order of EuIr$_4$In$_2$Ge$_4$, which crystallizes in a Dresselhaus-type noncentrosymmetric tetragonal structure, was investigated using two complementary single-crystal neutron diffraction approaches. Time-of-flight single-crystal diffraction reveals antiferromagnetic Bragg reflections with propagation vector $q = (1, 0, 0)$ below the Néel temperature $T_{\\rm N}$ = 2.5 K, indicating a breaking of body-centered translational symmetry. Polarized neutron diffraction on a triple-axis spectrometer demonstrates that the ordered Eu$^{2+}$ $4f$ moments lie within the basal plane and form a collinear antiferromagnetic structure with antiparallel alignment between corner and body-center sites. Despite the Dresselhaus-type spin splitting in the conduction bands, the magnetic order remains simple, implying weak coupling between localized moments and itinerant electrons.", "url": "https://arxiv.org/abs/2604.11242", "type": "理论", "summary": "1. 本研究结合飞行时间与极化中子单晶衍射，首次确定了EuIr₄In₂Ge₄在奈尔温度以下的反铁磁有序结构。\n2. 技术亮点在于通过互补的衍射手段，揭示了局域Eu²⁺磁矩在基面内形成沿q=(1,0,0)的共线反铁磁排列，且传导电子的Dresselhaus自旋劈裂对磁序影响微弱。\n3. 这一发现表明该体系中局域磁矩与巡游电子耦合较弱，为理解非中心对称晶体结构中磁相互作用与电子能带拓扑的关联提供了新的实验基准。", "summary_source": "deepseek", "authors": [{"name": "Chihiro Tabata"}, {"name": "Koji Kaneko"}, {"name": "Akiko Nakao"}, {"name": "Takashi Ohhara"}, {"name": "Tatsuma D. Matsuda"}, {"name": "Yoshichika Ōnuki"}], "featured_authors": [{"name": "Chihiro Tabata"}, {"name": "Koji Kaneko"}, {"name": "Akiko Nakao"}, {"name": "Takashi Ohhara"}, {"name": "Tatsuma D. Matsuda"}, {"name": "Yoshichika Ōnuki"}], "author_count": 6}, {"id": "2604.11367", "category": "cond-mat", "title": "Strain-Induced Curvature in Monolayer Graphene: Effects on Electronic Structure, Phonon Dynamics, and Lattice Thermal Conductivity", "abstract": "We present a comprehensive set of calculations to investigate the effect of strain-induced x-y topological perturbation in the monolayer graphene sheet. We show that the induced curvature with the defined strain constraint, energetically stabilizes the systems. The electronic properties are modified when the amplitude of the curvature of the sheet increases, which induces Van Hove singularities of the electronic Density of States to approach the Fermi energy. The highly curved system exhibits coexisting flat and linear dispersions close to the Fermi level, which is a promising feature for thermoelectric applications. We also demonstrate, through the phonon dispersion curves, that respective systems are dynamically stable within the studied range of strains/curvatures. Moreover, the flexural acoustic mode transitions from quadratic to linear dispersion under strain, mimicking the 3D behavior and enhancing phonon scattering. The increase of phonon scattering will therefore decrease the value of the lattice thermal conductivity, $\\kappa_L$. Such results allows us to conclude that it is possible to tune $\\kappa_L$ by applying x-y strain to the monolayer sheet, and inducing different topological curvatures.", "url": "https://arxiv.org/abs/2604.11367", "type": "理论+数值", "summary": "1. 该工作通过系统计算研究了单层石墨烯中应变诱导的xy平面拓扑扰动及其对电子结构、声子动力学和晶格热导率的综合影响。\n2. 其核心物理在于应变诱导的曲率使电子态密度的范霍夫奇点接近费米能，并在费米能级附近同时产生平带与线性色散，同时弯曲声学模色散由二次型转变为线性，增强了声子散射。\n3. 这为通过施加平面应变调控石墨烯拓扑曲率，从而主动设计其热电输运性质提供了清晰的理论途径。", "summary_source": "deepseek", "authors": [{"name": "M. C. Santos"}, {"name": "E. Lora da Silva"}, {"name": "D. S. Baptista"}, {"name": "T. Santos"}, {"name": "M. Molinari"}, {"name": "F. J. Manjón"}, {"name": "Yin Cui"}, {"name": "Xidong Lin"}, {"name": "Tao Yang"}], "featured_authors": [{"name": "M. C. Santos"}, {"name": "E. Lora da Silva"}, {"name": "D. S. Baptista"}, {"name": "Yin Cui"}, {"name": "Xidong Lin"}, {"name": "Tao Yang"}], "author_count": 9}, {"id": "2604.11392", "category": "cond-mat", "title": "Absence of thermalization after a local quench and strong violation of the eigenstate thermalization hypothesis", "abstract": "Absence of thermalization after a global quantum quench is a well-established numerical observation in integrable many-body systems, and can be empirically related to a violation of the eigenstate thermalization hypothesis (ETH) in such models. Still, in many of those examples a weaker version of the conventional ETH (wETH) has been numerically reported or even rigorously proven. In this paper we show analytically and illustrate numerically that the absence of thermalization is already possible after a local quench. A closely related finding is a strong violation of the ETH, meaning that not even the wETH is fulfilled anymore. In our analytical explorations we focus on XX-spin-chain models with open boundary conditions, where the local quench is generated by initiating the system in thermal equilibrium and then suddenly switching on (or slightly changing) a single-spin impurity either at the end or in the center of the chain. Numerically we observe qualitatively similar phenomena also for more general XXZ-models in the case of an end-impurity, but not in the case of a central impurity.", "url": "https://arxiv.org/abs/2604.11392", "type": "理论+数值", "summary": "1. 该工作通过解析与数值方法展示了局部量子淬火后热化缺失及其对本征态热化假说的强违反。\n2. 其技术核心在于在开放边界XX自旋链中，解析证明了单自旋杂质淬火导致即使弱化版本ETH也不成立。\n3. 这为探索更一般XXZ模型中末端杂质类似效应及热化行为的几何依赖性提供了明确研究方向。", "summary_source": "deepseek", "authors": [{"name": "Peter Reimann"}, {"name": "Christian Eidecker-Dunkel"}], "featured_authors": [{"name": "Peter Reimann"}, {"name": "Christian Eidecker-Dunkel"}], "author_count": 2}, {"id": "2604.11397", "category": "cond-mat", "title": "Revealing Dislocation Interactions Controlling Mechanical Properties of Metals", "abstract": "During plastic deformation, metals change shape while continuously becoming stronger. The microscopic origin of these processes lies in the proliferation and movement of line defects, dislocations, and the subsequent self-organisation and pinning of dislocations on lattice imperfections, including other dislocations. The nature of these multiscale processes has remained elusive because in situ observations have not been feasible. We present 3D movies of how dislocations pile up near an obstacle, deeply within a mm-sized pure Al sample and during tensile deformation. Cross-slip is found to provide a mechanism for the dislocations to escape the pile-up, leading to pronounced intermittent behaviour. Such data support a new generation of dislocation dynamics and micro-mechanics modelling.", "url": "https://arxiv.org/abs/2604.11397", "type": "理论", "summary": "1. 该工作在毫米尺度纯铝样品拉伸变形过程中，实现了位错在障碍物附近三维堆积动态过程的原位观测。\n2. 研究发现交滑移为位错逃离堆积提供了关键机制，并导致显著的间歇性塑性行为。\n3. 这些高分辨率实验数据为新一代位错动力学与微观力学模型的验证与构建提供了直接依据。", "summary_source": "deepseek", "authors": [{"name": "Felix Frankus"}, {"name": "Sina Borgi"}, {"name": "Albert Zelenika"}, {"name": "Basit Ali"}, {"name": "Raquel Rodriguez-Lamas"}, {"name": "Henning Friis Poulsen"}, {"name": "Grethe Winther"}], "featured_authors": [{"name": "Felix Frankus"}, {"name": "Sina Borgi"}, {"name": "Albert Zelenika"}, {"name": "Raquel Rodriguez-Lamas"}, {"name": "Henning Friis Poulsen"}, {"name": "Grethe Winther"}], "author_count": 7}, {"id": "2604.11420", "category": "cond-mat", "title": "Exact Criterion for Ground-State Overlap Dominance after Quantum Quenches", "abstract": "Recently, conjectured and verified in TIFM model that for a sudden quench within the same physical phase region, the overlap of the initial ground state with the final eigenstates is maximal for the final ground state. We solve this problem exactly for a broad class of translationally invariant free-fermion systems. For Hamiltonians that factorize into independent $2\\times2$ sectors, the final ground state is uniquely maximal if and only if the initial and final sector Bloch vectors have positive dot product. This exact criterion proves the conjecture for large classes, but also shows that it is false in general: in Kitaev chains there are same-phase quenches for which the final ground state is not the maximal-overlap state. The same mechanism has a direct dynamical consequence, implying that same-phase quenches can generate DQPTs without crossing an physical phase boundary.", "url": "https://arxiv.org/abs/2604.11420", "type": "理论", "summary": "1. 该工作针对一类平移不变自由费米子系统，精确求解了量子淬火后基态重叠是否主导的问题，建立了普适解析判据。\n2. 其核心是通过分析哈密顿量分解为独立2×2扇区时布洛赫矢量的点积正负性，给出最终基态重叠唯一最大化的充要条件，从而证实并反驳了特定猜想。\n3. 这一机制直接导致相同物理相区内淬火可在不跨越相边界时引发动力学量子相变，为非平衡量子动力学研究提供了新方向。", "summary_source": "deepseek", "authors": [{"name": "Taisanul Haque"}], "featured_authors": [{"name": "Taisanul Haque"}], "author_count": 1}, {"id": "2604.11441", "category": "cond-mat", "title": "Optimization of cooling power of a thermoelectric refrigerator: A unified approach", "abstract": "We analyze the steady-state formalism for optimizing the cooling power of a thermoelectric refrigerator (TER), unifying the endoreversible and exoreversible approximations within one framework. Although the cooling power is non-optimizable within the endoreversible model based on Newtonian heat-transfer law, we show that the issue can be circumvented in the near-reversible regime where the external thermal conductances are large, but finite. We extend this analysis to optimize the cooling power in the presence of both internal and external irreversibilities and derive a closed-form expression for the coefficient of performance (COP) that depends on the thermoelectric figure of merit and the ratio of internal to external thermal conductances. The model reproduces the endoreversible and the exoreversible limits as special cases. We conclude that for small temperature differences, the combined irreversibilities reduce the COP to values below 1/2, which aligns with the observed performance of the single-stage TER, and can provide realistic estimates for the COP.", "url": "https://arxiv.org/abs/2604.11441", "type": "理论+数值", "summary": "1. 该工作构建了统一内可逆与外可逆近似的理论框架，用以优化热电制冷器的制冷功率，并导出了性能系数的显式表达式。\n2. 其核心在于揭示了在外部热导有限但较大的近可逆区域中，制冷功率可被优化，且内、外不可逆性共同作用将性能系数压低至1/2以下。\n3. 该模型为单级热电制冷器的实测性能提供了合理解释，并能对实际器件的性能系数给出更现实的预估。", "summary_source": "deepseek", "authors": [{"name": "Rajeshree Chakraborty"}, {"name": "Ramandeep S. Johal"}], "featured_authors": [{"name": "Rajeshree Chakraborty"}, {"name": "Ramandeep S. Johal"}], "author_count": 2}, {"id": "2604.11476", "category": "cond-mat", "title": "Nexus-CAT: A Computational Framework to Define Long-Range Structural Descriptors in Glassy Materials from Percolation Theory", "abstract": "Nexus-CAT (Cluster Analysis Toolkit) is an open-source Python package for cluster detection and percolation analysis of atomistic simulation trajectories. Standard structural tools, such as the pair distribution function or structure factor, fail to capture the long-range connectivity changes underlying amorphous-amorphous transitions in glassy materials. Nexus-CAT addresses this gap by reading extended XYZ trajectory files and identifying clusters via a Union-Find algorithm with path-compression. Four clustering strategies, i.e., distance-based, bonding, coordination-filtered, and shared-neighbor, are implemented through a Strategy Factory design pattern, enabling the treatment of diverse network topologies. The program computes key percolation properties with percolation detection based on a rigorous period vector algorithm. The package is validated against theoretical predictions and applied to glasses with different bonding environments, namely vitreous silica, vitreous ice, and amorphous silicon. One original result is the observation of a percolation transition prior to crystallization in the latter, indicating that pressure-induced crystallization is initially driven by an amorphous transformation with similar coordination number. The code is also designed to be readily extended to gels, cements, and other disordered materials. Nexus-CAT is fully available on GitHub and PyPI.", "url": "https://arxiv.org/abs/2604.11476", "type": "理论+数值", "summary": "1. 本研究开发了开源Python工具包Nexus-CAT，用于原子模拟轨迹中的团簇检测与渗流分析，以捕捉玻璃材料中传统结构表征方法难以探测的长程连通性变化。\n2. 其技术核心在于通过策略工厂模式集成了四种团簇识别算法，并结合严谨的周期向量渗流检测方法，能系统处理不同键合环境的非晶网络拓扑结构。\n3. 该框架在非晶硅中首次观测到结晶前的渗流转变，这不仅揭示了压力诱导结晶的新机制，也为研究凝胶、水泥等更广泛的 disordered materials 提供了可扩展的分析工具。", "summary_source": "deepseek", "authors": [{"name": "Julien Perradin"}, {"name": "Simona Ispas"}, {"name": "Anwar Hasmy"}, {"name": "Bernard Hehlen"}], "featured_authors": [{"name": "Julien Perradin"}, {"name": "Simona Ispas"}, {"name": "Anwar Hasmy"}, {"name": "Bernard Hehlen"}], "author_count": 4}, {"id": "2604.11486", "category": "cond-mat", "title": "Inverse engineering of cooling protocols: from normal behavior to Mpemba effects", "abstract": "When a cup of hot coffee is suddenly put into a cold environment, it cools down as a function of time $t$ until the internal temperature $T_\\text{int}$ of the coffee equals the external ambient temperature $T_\\text{ext}$. This instantaneous shock-freezing corresponds to an imposed cooling protocol of the external temperature $T_\\text{ext}(t)$, ideally described as a step-function in time, causing the time-dependent change of the internal temperature $T_\\text{int}(t)$. While the effect of different given protocols $T_\\text{ext}(t)$ on the resulting system cooling behaviour, embodied in $T_\\text{int}(t)$, has been studied extensively, we consider here the inverse question: for a given system cooling $T_\\text{int}(t)$ how can an appropriate protocol $T_\\text{ext}(t)$ be engineered to produce the desired prescribed $T_\\text{int}(t)$. We use both the phenomenological Newtonian equation for cooling and microscopic models, such as a discrete two-level system and a Brownian harmonic oscillator with time-dependent noise, to compute analytically the protocol $T_\\text{ext}(t)$ needed to achieve a prescribed $T_\\text{int}(t)$. We then discuss the same question for phenomenological generalizations of the Newtonian law which include anomalous Mpemba effects, overcooling, asymmetries in cooling and heating as well as delay phenomena. It is shown that backward-engineered protocols do not always exist and can be non-unique. The results are important for steering the cooling behavior by time-varying external heat sources in a systematic way.", "url": "https://arxiv.org/abs/2604.11486", "type": "理论+数值", "summary": "1. 该工作通过牛顿冷却定律、离散两能级系统和含时噪声布朗谐振子等模型，逆向设计外场温度调控协议以实现指定的系统内部冷却曲线。\n2. 研究揭示了逆工程协议可能不存在或非唯一的数学特性，并将该框架拓展至包含反常姆潘巴效应、过冷及加热不对称性等非牛顿冷却现象。\n3. 这为通过时变外场热源系统调控热动力学行为提供了理论基础与设计方法学。", "summary_source": "deepseek", "authors": [{"name": "Hartmut Löwen"}], "featured_authors": [{"name": "Hartmut Löwen"}], "author_count": 1}, {"id": "2604.11494", "category": "cond-mat", "title": "Machine Learning-Enabled Mechanical Analysis and Optimization of Bioinspired Functionally Graded Materials", "abstract": "Tendon-bone enthesis connects tendon and bone, two mechanically dissimilar materials, while effectively minimizing stress concentrations, a capability rarely achieved in engineering materials. Its hierarchical organization and graded variations in composition or mineralization are widely recognized as key contributors to its exceptional performance. Here, we investigate the mechanics of enthesis, focusing on the insertion of interface collagen fibers into bone where hierarchical collagen fibril structures and graded mineralization are present, and translate these insights into bioinspired engineering material design using a convolutional neural network-based field predictor (CNNFP). We first construct a three-dimensional finite element model (FEM) of the interface fiber-bone enthesis, in which local material properties depend on mineralization level, mean fibril orientation, and angular dispersion, informed by a multiscale continuum theory. We introduce a scalar risk factor that integrates local stress states and constituent fibril organizations to quantify local vulnerability. Simulation results demonstrate that graded and spatially heterogeneous configurations markedly reduce stress concentrations, supporting prevailing biomechanical hypotheses. We then train the CNNFP as an accurate surrogate for FEM and embed it within a kernel-based gradient optimization framework to efficiently identify optimal field configurations. The optimized designs are validated against FEM ground truth, establishing a generalizable AI-enabled pathway for the optimization of bioinspired functionally graded materials.", "url": "https://arxiv.org/abs/2604.11494", "type": "理论+数值", "summary": "1. 该工作通过构建胶原纤维-骨界面的三维有限元模型，并融合卷积神经网络场预测器，实现了对生物启发的功能梯度材料的力学分析与优化。\n2. 其技术核心在于引入综合局部应力状态与纤维组织特征的标量风险因子量化局部脆弱性，并利用CNN代理模型显著加速了梯度优化过程。\n3. 这为基于多尺度生物力学原理、并借助人工智能高效优化材料性能场分布的设计范式提供了可推广的路径。", "summary_source": "deepseek", "authors": [{"name": "Zhangke Yang"}, {"name": "Zhaoxu Meng"}], "featured_authors": [{"name": "Zhangke Yang"}, {"name": "Zhaoxu Meng"}], "author_count": 2}, {"id": "2604.11515", "category": "cond-mat", "title": "Electron localization, charge redistribution, and emergence of topological states at graphite junctions", "abstract": "Low-energy electronic behavior in graphite crystals is highly dependent on the relative stacking arrangement of the constituent layers. Topologically non-trivial electronic states can arise due to interrupted rhombohedral (ABC) stacking, localized at the edges of the stacking region, but not in the case of Bernal (AB) stacking. Here, we study the electronic properties of junctions between half-crystals of graphite of either Bernal or rhombohedral stacking, using a charge self-consistent tight-binding method and embedding potentials to account for the influence of layers far from the junction. We find junction-localized electronic states to be a ubiquitous feature, and all systems but one involving a rhombohedral half-crystal support a flat-band expected to exhibit electronic instabilities and strongly-correlated states. Nascent flat-band states associated with finite rhombohedral stacking sequences extend the physics into pure Bernal systems.", "url": "https://arxiv.org/abs/2604.11515", "type": "理论", "summary": "1. 本研究采用电荷自洽紧束缚方法结合嵌入势，系统计算了石墨晶体中伯纳尔(AB)与菱面体(ABC)堆垛半晶体构成结的电子性质。\n2. 研究发现结局域电子态普遍存在，且几乎所有涉及菱面体半晶体的体系均支持预示电子不稳定性和强关联态的平带，该平带物理甚至能延伸至纯伯纳尔体系。\n3. 此结果为在传统石墨堆垛结构中实现平带诱导的强关联电子态及拓扑物理提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Luke Soneji"}, {"name": "Simon Crampin"}, {"name": "Marcin Mucha-Kruczynski"}], "featured_authors": [{"name": "Luke Soneji"}, {"name": "Simon Crampin"}, {"name": "Marcin Mucha-Kruczynski"}], "author_count": 3}, {"id": "2604.11595", "category": "cond-mat", "title": "Pt-wedge squeegee cleaning of two-dimensional materials and heterostructures", "abstract": "The surface of ultra-thin materials plays a crucial role in determining the properties. This is particularly important in two-dimensional (2D) materials where the surface-bulk distinction is no longer present. While mechanical cleaning of two-dimensional materials to remove interfacial and surface contaminants is used to achieve better sample quality, low throughput and the challenging optimization of cleaning procedures hinder their widespread adoption. Here, we report on atomic force microscope (AFM)-based mechanical cleaning with modified AFM cantilevers for high-throughput and easy-to-implement cleaning of 2D materials and their heterostructures. A Pt-wedge is deposited via focused ion beam on the cantilever to improve the mechanical cleaning of samples and streamline the cleaning procedures. We demonstrate that a cleaning rate of 3 {\\mu}^2/s can be achieved with our modified cantilevers, compared to the 0.01 {\\mu}^2/s effective cleaning rate in pointy-tip cleaning. As showcases, we demonstrate that monolayer WS2 on h-BN exhibits much sharper photoluminescence (PL) emission at room temperature after AFM cleaning, and WS2 monolayers exhibit a higher quality contacts to cleaned Au electrodes as compared to uncleaned electrodes. We also showed that h-BN encapsulated heterostructures can be cleaned rapidly using the improved method. Overall, our results exhibit a feasible and facile path for the large-scale application of AFM-based cleaning of integrated 2D materials.", "url": "https://arxiv.org/abs/2604.11595", "type": "数值", "summary": "1. 本工作开发了一种基于原子力显微镜的机械清洁方法，采用经聚焦离子束沉积铂楔形结构的改良探针对二维材料及其异质结构进行高效清洁。\n2. 该技术通过优化探针结构将清洁速率提升至3微米²/秒，较传统针尖清洁速率提高两个数量级，并显著改善WS₂单层的光致发光峰宽与金属接触质量。\n3. 这为二维材料器件的大规模集成提供了一种可行且高效的表面处理方案，有望推动高性能电子与光电器件的制备工艺发展。", "summary_source": "deepseek", "authors": [{"name": "Emine Yegin"}, {"name": "Doruk Pehlivanoğlu"}, {"name": "T. Serkan Kasırga"}], "featured_authors": [{"name": "Emine Yegin"}, {"name": "Doruk Pehlivanoğlu"}, {"name": "T. Serkan Kasırga"}], "author_count": 3}, {"id": "2604.11596", "category": "cond-mat", "title": "Loop-dependent entangling holonomies in localized topological quartets", "abstract": "A spectrally isolated quartet can preserve a local two-qubit description at each point in parameter space while still acquiring a loop holonomy that does not lie in the local subgroup $\\U(2)\\otimes\\U(2)$. We demonstrate this in three localized topological settings: a BHZ ribbon, a spinful SSH chain, and a BBH corner quartet. On a given quartet, changing only the loop moves the transport between almost local and strongly entangling regimes. The clearest contrast appears in BHZ: co-rotating and counter-rotating edge-field loops carry nearly identical eigenphase data, yet the former remains almost local whereas the latter realizes an Ising-like entangler. SSH isolates the controlled-rotation mechanism in a numerically stable setting, while BBH extends the phenomenon to a higher-order corner multiplet. Standard topological diagnostics, including Berry phases, Chern numbers, determinant phases, and eigenphase spectra, do not distinguish these cases. The primary diagnostic is the distance of the loop holonomy to the extracted local subgroup; canonical two-qubit coordinates are introduced only after reduction failure has been established, in order to identify the resulting gate class. In the sense of Ref.[ arXiv:2601.13764 ], these results provide microscopic, loop-resolved manifestations of entangling gluing.", "url": "https://arxiv.org/abs/2604.11596", "type": "理论+数值", "summary": "1. 该工作实证了局域化拓扑四重态中环路依赖的纠缠霍尔莫尼，基于BHZ、SSH和BBH模型。\n2. 其核心在于仅改变环路即可调控纠缠性质，并提出距离局部子群的诊断方法超越传统拓扑指标。\n3. 这为拓扑系统中纠缠胶合的微观机制及量子门设计提供了环路分辨的视角。", "summary_source": "deepseek", "authors": [{"name": "Kazuki Ikeda"}, {"name": "Yaron Oz"}], "featured_authors": [{"name": "Kazuki Ikeda"}, {"name": "Yaron Oz"}], "author_count": 2}, {"id": "2604.11606", "category": "cond-mat", "title": "The Widom line in the Ising model on a decorated bilayer lattice", "abstract": "There has been much recent interest devoted to a class of frustrated one-dimensional statistical mechanics lattice models which exhibit sharp thermodynamics. In this work, we study an extension of one of these models to two dimensions; the Ising model on a decorated bilayer lattice. We show that the pseudo-transitions of the one-dimensional models become a real first order phase transition in this two-dimensional analogue. Moreover, the pseudo-transition is found to still exist above a bi-critical point. This can be characterised as a Widom line, which allows a re-interpretation of the physics in the previously studied one-dimensional models.", "url": "https://arxiv.org/abs/2604.11606", "type": "理论", "summary": "1. 该工作将一维阻挫统计力学模型中出现的赝转变问题扩展至二维，研究了装饰双层晶格上的伊辛模型。\n2. 核心发现是二维类比中赝转变会演化为真实的一级相变，并在双临界点之上以Widom线的形式持续存在。\n3. 这为重新理解先前一维模型中观察到的尖锐热力学行为提供了明确的物理图像与理论框架。", "summary_source": "deepseek", "authors": [{"name": "Joseph Chapman"}, {"name": "Justas Gidziunas"}, {"name": "Bruno Tomasello"}, {"name": "Sam Carr"}], "featured_authors": [{"name": "Joseph Chapman"}, {"name": "Justas Gidziunas"}, {"name": "Bruno Tomasello"}, {"name": "Sam Carr"}], "author_count": 4}, {"id": "2604.11690", "category": "cond-mat", "title": "Geometry-controlled magnon-polariton excitations in a bilayer planar cavity", "abstract": "Planar cavity magnonics has been developed predominantly for a single magnetic film, leaving the role of multiple magnetic layers in a cavity-scattering framework with spatial resolution largely unexplored. In this study, we introduce a bilayer planar cavity in which two magnetic films are embedded inside the same microwave cavity and interact through the cavity field and their relative placement within the standing-wave pattern. First, we derive a full two-film scattering theory in the macrospin limit and recover the exact zero-gap half-thickness limit to benchmark it against the known one-film planar result. This formulation reveals that the bilayer does not simply strengthen the magnon-photon interaction by adding magnetic material but instead enables position-dependent control of the collective bright channel. Antinode-compatible placements enhance effective coupling, whereas node-compatible placements suppress it. We then show that weak symmetry breaking between the two films transfers the finite cavity weight to a mode that is dark in the symmetric limit, producing an additional spectroscopic branch without immediately destroying the main avoided crossing. To extend the analysis beyond the macrospin regime, we formulate a reduced multimode bilayer theory for $J\\neq 0$, where odd standing-spin-wave families reorganize into family-resolved bright and dark bilayer channels. Our results show that bilayer planar cavities are a minimal but versatile setting for controlling the collective magnon-polariton structure through geometry, symmetry, and exchange-driven mode hierarchy.", "url": "https://arxiv.org/abs/2604.11690", "type": "理论+数值", "summary": "1. 本研究构建了一个内含双层磁性薄膜的平面微波腔系统，提出并发展了相应的腔散射理论。\n2. 其核心在于阐明了双层膜相对腔内驻波场的位置分布可调控集体亮通道耦合强度，而弱对称破缺能激活原本暗态的有限腔权重。\n3. 该结果为通过几何、对称性和交换作用模式层级来调控集体磁子-极化激元结构提供了一个最小而普适的平台。", "summary_source": "deepseek", "authors": [{"name": "S. Solihin"}, {"name": "Ahmad R. T. Nugraha"}, {"name": "Muhammad Aziz Majidi"}], "featured_authors": [{"name": "S. Solihin"}, {"name": "Ahmad R. T. Nugraha"}, {"name": "Muhammad Aziz Majidi"}], "author_count": 3}, {"id": "2604.11706", "category": "cond-mat", "title": "Effect of Pre-Shear and Dispersity on Crystallization of a Model Polymer with Soft Pair Interactions using Molecular Dynamics Simulations", "abstract": "Polymer crystallization is a process of great interest in both fundamental theory and industrial settings, particularly in polymer processing and applications involving semi-crystalline materials. The effect of processing on the initial stages of crystallization is not fully understood. Our study investigates the influence of pre-shear on monodisperse melts and bidisperse blends of a generic, segmentally coarse-grained polymer model. Through molecular dynamics simulations, we explore how polydispersity affects crystallization, where we found that the addition of short chains to a melt of longer chains increased the final crystallinity by about 10%, and increased the initial growth rate by roughly a factor of two. In contrast, however, pre-shearing the hot melt before quenching only showed a minor increase in both growth rates and final crystallinty, except in monodisperse melts of short chains. Crystal grain shapes were most influenced by pre-shearing monodisperse melts, where both asphericity and prolateness decreased. Additionally, we determined topological connectivity of crystal grains through tie- and loop-chain analysis. Again, only monodisperse melts showed a significant increase of tie chain fractions with pre-shear, while all other systems showed only modest increases. Our findings provide insight into the changes of crystallinity and cluster morphologies that emerge when pre-sheared, offering a deeper understanding of the initial crystallization processes in polymer melts when subjected to pre-shear.", "url": "https://arxiv.org/abs/2604.11706", "type": "理论+数值", "summary": "1. 该研究采用分子动力学模拟，系统探究了预剪切与链长分散性对软相互作用粗粒化聚合物模型结晶过程的影响。\n2. 核心发现表明，在长链熔体中添加短链可显著提升最终结晶度与初始生长速率，而预剪切仅对短链单分散体系有显著影响，并改变其晶粒形状与连接拓扑。\n3. 这一结果为深入理解加工历史与链长分布如何协同调控聚合物结晶的初期动力学与微观结构提供了定量依据。", "summary_source": "deepseek", "authors": [{"name": "Tzortzis Koulaxizis"}, {"name": "Antonia Statt"}], "featured_authors": [{"name": "Tzortzis Koulaxizis"}, {"name": "Antonia Statt"}], "author_count": 2}, {"id": "2604.11713", "category": "cond-mat", "title": "Thermodynamic fluctuations in freely jointed chains under force", "abstract": "It is common to study polymer physics through the use of idealized single-chain models, and the most popular of these is the freely jointed chain model. In certain thermodynamic ensembles, statistical mechanical treatment of this model is analytically tractable or sometimes exactly solvable. This enables useful relations to be ascertained, like the expected chain end-to-end length as a function of an applied force. However, most of these relations return ensemble averages, which are values with inherent uncertainty, as opposed to deterministic values with no variance. This is an important distinction to understand and quantify, because the majority of studies to date involving single-chain models effectively treat these values as deterministic rather than fluctuating. To address this issue, thermodynamic fluctuations are examined in the freely jointed chain model. Specifically, the probability densities and standard deviations of the longitudinal, lateral, transverse, and radial portions of the chain extension, as well as the extension and link angles, are examined for different numbers of links and applied forces. Fluctuations in these quantities are shown to be considerable until the applied force becomes large. Increasing the number of links in the chain gradually reduces fluctuations in all quantities except for the link angles, since they are independent for freely jointed chains in the isotensional ensemble. Quantities are obtained analytically whenever possible and numerically otherwise. Overall, these results provide intuitive admonitions to consider when modeling the stretching of single polymer chains or the deformation of entire polymer networks.", "url": "https://arxiv.org/abs/2604.11713", "type": "理论+数值", "summary": "1. 该研究系统分析了自由连接链模型在等张力系综中受力拉伸时的热力学涨落，解析与数值结合地给出了链伸长各分量及链节角度的概率分布与标准差。\n2. 其价值在于定量揭示了涨落幅度与链节数、外力的依赖关系，并明确指出除链节角外，所有几何量的涨落均随链长增加而减小。\n3. 这提醒在单链拉伸或聚合物网络形变建模中，需谨慎区分确定性平均值与统计涨落，从而更准确地描述微观力响应。", "summary_source": "deepseek", "authors": [{"name": "Michael R. Buche"}, {"name": "Alvin Chen"}], "featured_authors": [{"name": "Michael R. Buche"}, {"name": "Alvin Chen"}], "author_count": 2}, {"id": "2604.11738", "category": "cond-mat", "title": "Reduced pair breaking from extended disorder in unconventional superconductors: implications to 4Hb-TaS$_2$", "abstract": "Unconventional superconductivity is generally expected to be strongly suppressed by nonmagnetic disorder, as captured by Abrikosov--Gor'kov (AG) theory. However, several materials, including transition metal dichalcogenides, exhibit signatures of unconventional pairing despite relatively high resistivities, suggesting a breakdown of the conventional relation between momentum relaxation and pair breaking. Here, we study this problem in H-phase transition metal dichalcogenides by computing the disorder-dressed pairing susceptibility. We employ a multiband model with spin-orbit coupling and include an impurity potential that mimics a common lattice defect, namely a chalcogen vacancy or site ad-atom. This yields to an extended impurity potential, which we compare with the commonly considered on-site (point defect) potential. We evaluate the momentum-relaxation rate and the pair-breaking rate on equal footing. We find that extended impurity potentials lead to a parametrically reduced pair-breaking rate compared to the transport scattering rate, with $\\Gamma \\tau_D \\sim 1/3$ over a wide parameter range. This reduction originates from the momentum structure of the disorder potential, which partially matches the internal structure of the superconducting gap and suppresses pair-breaking processes. As a result, unconventional pairing states are significantly more robust than predicted by standard AG theory. Our results provide a natural explanation for the persistence of unconventional superconductivity in systems with strong disorder and substantially alleviate the apparent conflict between high resistivity and unconventional pairing in materials such as 4Hb-TaS$_2$.", "url": "https://arxiv.org/abs/2604.11738", "type": "理论+数值", "summary": "1. 该工作通过构建包含自旋轨道耦合的多带模型，引入模拟硫空位或位点吸附原子的扩展杂质势，计算了H相过渡金属二硫化物中非常规超导体的杂质修饰配对磁化率，系统研究了扩展无序对配对破坏过程的抑制效应。\n2. 其核心物理卖点在于揭示扩展杂质势的动量结构与超导能隙内部结构部分匹配，能显著抑制配对破坏过程，导致在广泛参数范围内配对破坏率相对于动量弛豫率参数性减小至$\\Gamma \\tau_D \\sim 1/3$，从而显著提升非常规超导态的鲁棒性。\n3. 这一发现为诸如4Hb-TaS$_2$等高电阻率材料中非常规超导性的实验观测提供了自然解释，缓解了标准AG理论与实验间的矛盾，并为探索强无序超导体中的配对机制和材料设计指明了新方向。", "summary_source": "deepseek", "authors": [{"name": "Yuval Tsur"}, {"name": "Mark H. Fischer"}, {"name": "Jonathan Ruhman"}], "featured_authors": [{"name": "Yuval Tsur"}, {"name": "Mark H. Fischer"}, {"name": "Jonathan Ruhman"}], "author_count": 3}, {"id": "2604.11780", "category": "cond-mat", "title": "Multiple spiking functionalities in annealing-optimized Ag/Hf$_{0.5}$Zr$_{0.5}$O$_2$-based memristive neurons", "abstract": "Rapid progress of artificial neural network applications in recent years has led to the issue of an unprecedented energy consumption. It can be solved by the implementation of energy efficient hardware based on non-von-Neumann architectures, which requires the development of electronic components emulating the behavior of synapses and neurons. While research of synaptic elements is vast, the technology for fabrication of scalable and highly reproducible neuronal elements is far less developed. In this paper, we demonstrate an artificial neuron with multiple functionalities based on filamentary switching Ag/Hf$_{0.5}$Zr$_{0.5}$O$_2$ (HZO) memristors. To improve the parameters of memristors, we propose a two-step annealing method, which allows for better control of the crystallization of the functional dielectric layer (HZO) as well as of the diffusion of active electrode (Ag) atoms. Furthermore, we demonstrate the leaky integrate-and-fire (LIF) neuronal behavior in multiple spiking modes: time-to-first-spike (TTFS), number of spikes and firing rate coding. Moreover, the neuron operation does not require the additional electronic overhead and is supported solely by a Ag/HZO memristor with a current limiting resistor connected in series. The presented results pave the way for the creation of next generation energy efficient neuromorphic hardware operating on the principles of spiking neural networks.", "url": "https://arxiv.org/abs/2604.11780", "type": "数值", "summary": "1. 该工作基于两步退火优化的Ag/Hf$_{0.5}$Zr$_{0.5}$O$_2$忆阻器，成功制备了具备多重尖峰编码功能的人工神经元。\n2. 其核心在于通过退火工艺精确调控介电层结晶与活性电极原子扩散，从而实现了无需外围电路的泄漏积分发放神经元多种脉冲编码模式。\n3. 这一结果为构建基于尖峰神经网络原理、能效更高的下一代神经形态硬件提供了关键器件基础。", "summary_source": "deepseek", "authors": [{"name": "Nikita Zhidkov"}, {"name": "Andrei Zenkevich"}, {"name": "Anton Khanas"}], "featured_authors": [{"name": "Nikita Zhidkov"}, {"name": "Andrei Zenkevich"}, {"name": "Anton Khanas"}], "author_count": 3}, {"id": "2604.11800", "category": "cond-mat", "title": "Diffusing diffusivity model with dichotomous noise", "abstract": "We study Langevin dynamics with stochastic diffusivity arising from fluctuations of the surrounding medium. The diffusivity is modeled as Ornstein-Uhlenbeck process driven by symmetric dichotomous noise, which confines it to a finite interval. We derive analytical expressions for the short-time probability density function (PDF) of the particle displacement and analyse its asymptotic behaviour. While the PDF retains the characteristic logarithmic divergence at the origin, its tails differ from the Gaussian white-noise case: exponential tails are replaced by Gaussian ones modulated by a power-law with a switching-rate-dependent exponent. At long times, the dynamics converges to ordinary Gaussian diffusion. We determine the variance and covariance of the time-averaged stochastic diffusivity and show that it is self-averaging. The model provides a minimal analytically tractable framework for stochastic transport in environments with bounded or switching fluctuations.", "url": "https://arxiv.org/abs/2604.11800", "type": "理论", "summary": "1. 该工作研究了由环境涨落引起随机扩散系数的朗之万动力学，其中扩散系数被建模为对称双态噪声驱动的奥恩斯坦-乌伦贝克过程。\n2. 其核心发现在于位移概率密度函数尾部呈现高斯分布与幂律调制的复合结构，且指数依赖于切换速率，显著区别于高斯白噪声情形。\n3. 这为研究具有有界或切换型涨落环境中的随机输运过程提供了一个可解析处理的最小化理论框架。", "summary_source": "deepseek", "authors": [{"name": "Dongho Lee"}, {"name": "Jae-Hyung Jeon"}, {"name": "Pascal Viot"}, {"name": "Gleb Oshanin"}], "featured_authors": [{"name": "Dongho Lee"}, {"name": "Jae-Hyung Jeon"}, {"name": "Pascal Viot"}, {"name": "Gleb Oshanin"}], "author_count": 4}, {"id": "2604.09655", "category": "hep-th", "title": "Note About Relational Mechanics of General Forms of Particle Actions", "abstract": "In this short note we show that any action for $N$ interacting particles can be made invariant under gauged Galilean transformations. While resulting Lagrangian is generally very complicated its Hamiltonian has simple form with first class constraints which are generators of corresponding gauge transformations included.", "url": "https://arxiv.org/abs/2604.09655", "type": "理论", "summary": "1. 该工作证明了对任意N粒子相互作用的作用量，均可通过引入规范变换使其在伽利略规范变换下保持不变。\n2. 其核心在于，尽管由此得到的拉格朗日量形式复杂，但对应的哈密顿量具有简洁形式，并包含作为规范变换生成元的一类约束。\n3. 这为研究具有规范对称性的约束系统及其在相对性力学中的应用提供了一个普遍的理论框架。", "summary_source": "deepseek", "authors": [{"name": "J. Kluson"}], "featured_authors": [{"name": "J. Kluson"}], "author_count": 1}, {"id": "2604.09765", "category": "hep-th", "title": "Multi-soft theorems for cosmological correlators: Background wave method for scalars & gravitons", "abstract": "Cosmological soft theorems (or consistency relations) provide a powerful probe for the physics of inflation. These relations rely on minimal assumptions and hold very generally. Consequently, any violation of these relations would rule out a large class of inflationary models. For instance, a violation of the scalar soft theorem (or consistency relation) would rule out all attractor single-field inflation models and instead point toward either multi-field dynamics or a non-attractor phase. In this paper, we derive tree-level multi-soft theorems, at leading order in the soft expansion, for both scalar and tensor correlation functions. Our analysis employs the background-wave method, in which the effect of long-wavelength modes is captured by an appropriate spatial coordinate rescaling. In addition, we systematically incorporate soft-exchange contributions, including tensor exchanges in scalar correlators and scalar exchanges in tensor correlators.", "url": "https://arxiv.org/abs/2604.09765", "type": "理论", "summary": "1. 该工作推导了树阶水平上标量与引力子关联函数的领头阶多软定理。\n2. 其技术核心是背景波方法结合了对软模式交换贡献的系统性处理。\n3. 这为利用高精度观测检验单场吸引子等暴胀模型类别提供了更完备的理论工具。", "summary_source": "deepseek", "authors": [{"name": "Farman Ullah"}], "featured_authors": [{"name": "Farman Ullah"}], "author_count": 1}, {"id": "2604.09771", "category": "hep-th", "title": "Towards a Carrollian Description of Yang-Mills", "abstract": "We provide a theory defined purely on null infinity that describes Yang-Mills in the Minkowski space bulk. The dynamical field of our model is the characteristic data of the bulk gauge field, and the action combines an electric branch Carrollian kinetic term with non-local interactions of MHV type that link different points on the celestial sphere. We explicitly show how this theory recovers all MHV and NMHV tree amplitudes in Yang-Mills, and outline how arbitrary tree amplitudes may be obtained from its Feynman diagram expansion. The detailed expression we find for the NMHV amplitude appears to be new.", "url": "https://arxiv.org/abs/2604.09771", "type": "理论", "summary": "1. 本文在时空的类光无穷远上构建了一个纯粹的理论，用以描述闵可夫斯基空间体中的杨-米尔斯理论。\n2. 理论的核心是将体规范场的特征数据作为动力学场，其作用量结合了电支 Carroll 动能项与连接天球不同点的非局域 MHV 型相互作用。\n3. 这为从类光无穷远出发系统推导任意树图振幅，以及探索更一般的全息对偶框架提供了清晰的途径。", "summary_source": "deepseek", "authors": [{"name": "Jeffrey Opreij"}, {"name": "David Skinner"}, {"name": "Hangzhi Wang"}], "featured_authors": [{"name": "Jeffrey Opreij"}, {"name": "David Skinner"}, {"name": "Hangzhi Wang"}], "author_count": 3}, {"id": "2604.09925", "category": "hep-th", "title": "How to deal with conformal and pure scale-invariant theories of gravity in d dimensions?", "abstract": "Conformally-invariant and pure, scale-invariant theories of gravity are particularly interesting in four or higher dimensions. Yet, in contrast to their four-dimensional counterparts, theories in higher dimensions are significantly more difficult to study. In these proceedings, following our recent work, we will formulate such theories in d dimensions, present an elegant way to handle them, and show that imposing invariance under scale or conformal transformations gives rise to entirely different properties when compared to their four-dimensional analogues.", "url": "https://arxiv.org/abs/2604.09925", "type": "理论", "summary": "1. 本文系统构建了d维共形与纯标度不变引力理论，并提出了一种优雅的处理方法。\n2. 核心发现是：与四维情况不同，高维中标度与共形不变性将导致截然不同的理论性质。\n3. 这为在任意维度中区分并研究标度与共形对称性的物理后果提供了明确理论框架。", "summary_source": "deepseek", "authors": [{"name": "Anamaria Hell"}, {"name": "Dieter Lust"}], "featured_authors": [{"name": "Anamaria Hell"}, {"name": "Dieter Lust"}], "author_count": 2}, {"id": "2604.09928", "category": "hep-th", "title": "Charges of supergravity", "abstract": "We study conserved charges of $\\mathcal{N}=1$ supergravity formulated as a constrained BF theory based on the $\\OSp(1|4)$ superalgebra. Using the covariant phase space formalism, we derive bulk and boundary contributions to the symplectic structure and construct charges associated with Lorentz transformations, supersymmetry, translations, and diffeomorphisms. We show that the algebra of boundary charges reproduces the expected superalgebra, while translational charges vanish on-shell due to the super-torsion constraint, leaving Lorentz and supersymmetry as the non-trivial generators.", "url": "https://arxiv.org/abs/2604.09928", "type": "理论", "summary": "1. 该工作研究了基于 $\\OSp(1|4)$ 超代数的约束BF理论所表述的 $\\mathcal{N}=1$ 超引力的守恒荷。\n2. 通过协变相空间形式体系，推导了辛结构的体与边界贡献，并证明边界荷代数重现了预期的超代数，而平移荷因超挠率约束在壳上消失。\n3. 这为在超引力背景下系统分析渐近对称性及表面荷提供了清晰的框架基础。", "summary_source": "deepseek", "authors": [{"name": "Remigiusz Durka"}, {"name": "Jerzy Kowalski-Glikman"}, {"name": "Rene Payne"}], "featured_authors": [{"name": "Remigiusz Durka"}, {"name": "Jerzy Kowalski-Glikman"}, {"name": "Rene Payne"}], "author_count": 3}, {"id": "2604.09973", "category": "hep-th", "title": "Quantum Energy Teleportation Across Lattice and Continuum", "abstract": "Quantum energy teleportation (QET) has been studied in continuum field theory and in lattice many-body systems, but the relation between the two within a single interacting model is still not well understood. To address this question, we consider the massive Thirring model, equivalently the sine--Gordon theory. In the continuum, the trigonometric measurement is a weak binary Positive Operator-Valued Measure (POVM), and its leading signal is set by a conserved-current correlator in the bosonized theory, with both gapless behavior and gapped large-distance asymptotics. On the lattice, the conventional protocol does not access this neutral current sector. For Alice's local measurement, a lattice $U(1)$ selection rule removes the neutral current contribution from Bob's subsystem, and the separated signal lies in charged sectors. On the same lattice Hamiltonian we construct a neutral current protocol whose weak signal is exactly a coarse-grained current correlator and whose extracted energy scales quadratically with the measurement strength. This identifies the neutral sector shared by the lattice and continuum descriptions, while separating it from the charged sector that governs the conventional qubit protocol.", "url": "https://arxiv.org/abs/2604.09973", "type": "理论", "summary": "1. 本文在相互作用的massive Thirring（等价于sine-Gordon）模型中，系统研究了格点和连续场论描述下量子能量隐形传态（QET）的对应关系。\n2. 通过构建一种新的中性流格点协议，该工作将QET弱信号明确关联于玻色化理论中的守恒流关联子，从而在格点上分离出与连续描述共享的中性流 sector。\n3. 这一结果为在不同物理平台（如超导量子电路或冷原子系统）上设计和比较QET协议提供了清晰的理论框架与关键鉴别依据。", "summary_source": "deepseek", "authors": [{"name": "Kazuki Ikeda"}], "featured_authors": [{"name": "Kazuki Ikeda"}], "author_count": 1}, {"id": "2604.10090", "category": "hep-th", "title": "Quantum simulation of traversable-wormhole-inspired quantum teleportation in a chaotic binary sparse SYK model", "abstract": "We report the experimental observation of holographically motivated quantum teleportation on a quantum processor, driven by the highly entangled, chaotic dynamics of a many-body system. Specifically, we implement the traversable-wormhole (TW) protocol utilizing a \\textit{chaotic} binary sparse $N = 8$ Sachdev--Ye--Kitaev (SYK) model. This optimized approach dramatically reduces circuit depth for noisy intermediate-scale quantum (NISQ) hardware while rigorously preserving the spectral chaos required for gravitational duality. Diagnosing the teleportation signal via mutual information, we find that while inherent noise in NISQ hardware precludes perfect quantitative agreement with exact numerical simulations, our experimental results clearly demonstrate the essential qualitative signature: a sign-dependent asymmetry. This work establishes a practical, scalable framework for holographic quantum simulations, offering a novel empirical testbed for exploring holographic quantum gravity.", "url": "https://arxiv.org/abs/2604.10090", "type": "理论", "summary": "1. 该研究在量子处理器上实验观测了基于全息原理的量子隐形传态，通过实现混沌二元稀疏SYK模型中的可穿越虫洞协议。\n2. 其核心优势在于优化的电路设计显著降低了NISQ硬件所需的电路深度，同时严格保持了引力对偶性所需的光谱混沌特性。\n3. 这为全息量子模拟建立了可扩展的实用框架，为探索全息量子引力提供了新型实验检验平台。", "summary_source": "deepseek", "authors": [{"name": "Moongul Byun"}, {"name": "Keun-Young Kim"}, {"name": "Hyeonsoo Lee"}], "featured_authors": [{"name": "Moongul Byun"}, {"name": "Keun-Young Kim"}, {"name": "Hyeonsoo Lee"}], "author_count": 3}, {"id": "2604.10163", "category": "hep-th", "title": "Hall transports from Taub-NUT AdS black holes", "abstract": "We compute Hall transport coefficients associated with Taub-NUT AdS black holes in four space-time dimensions using the probe D-brane approach. In particular, we examine the effects due to the NUT parameter ($n$), or equivalently, the novel frame-dragging on the holographic charge transport properties. In our analysis, we treat the external electric field as a constant background, while varying the magnetic field ($B$) from small to finite. Within this framework, we analyze conductivities in both low and high temperature regions, focusing on locations that are both near and far from the Misner string. Our calculations show that frame-dragging effects are significant primarily at lower temperatures and near the Misner string, while a small magnetic field is maintained. However, these effects become negligibly small at a ``finite\" magnetic field and even at lower temperatures. Our analysis reveals the existence of finite Hall transport, that has its origin in the novel frame-dragging.", "url": "https://arxiv.org/abs/2604.10163", "type": "理论", "summary": "1. 该工作利用全息对偶中的探针D膜方法，在四维Taub-NUT AdS黑洞背景下计算了霍尔输运系数，以探究NUT参数（即新型框架拖曳）对全息电荷输运性质的影响。\n2. 通过将外电场设为常数背景并系统变化磁场（从微小到有限），研究分析了低温和高温区域中近Misner弦与远处电导率的行为，揭示了框架拖曳效应仅在低温和近弦处对小磁场下的霍尔输运有显著作用，而在有限磁场下可忽略。\n3. 这一发现明确了框架拖曳诱导有限霍尔输运的物理机制，为全息引力模型中几何结构依赖的量子输运理论及相关弯曲时空现象的研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Mohd Aariyan Khan"}, {"name": "Hemant Rathi"}, {"name": "Dibakar Roychowdhury"}], "featured_authors": [{"name": "Mohd Aariyan Khan"}, {"name": "Hemant Rathi"}, {"name": "Dibakar Roychowdhury"}], "author_count": 3}, {"id": "2604.10267", "category": "hep-th", "title": "The yes boundaries wavefunctions of the universe", "abstract": "A generic spacetime topology contains timelike boundaries. Making use of two such boundaries, we formulate a microscopic holographic dual that captures cosmological spacetime beyond the cosmic horizon patch, including the future wedge. We build this starting from two copies of the dressed Hamiltonian quantum theories which formulate the cosmic horizon and pole patches of de Sitter. At the top level of the spectrum we obtain the extended spacetime from a nearly maximally entangled (micro-)canonical thermofield double state. This requires addressing the maximality of the unrenormalized gravitational path integral saddle in the calculation of the entanglement entropy upon tracing out one sector. We resolve this in both ensembles via explicit computations in the constrained path integral for three bulk dimensions, incorporating UV-sensitive quantum beyond-GR effects when they contribute strongly. Lower energy levels in the spectrum generate tall extended spacetimes where the boundaries' causal wedges overlap. These arise in our theory via constraints on the doubled Hilbert space, which encode the operator redundancies arising from the reconstruction of bulk operators from either boundary within the region where their causal wedges overlap. With positive cosmological constant, the tallness implies that causal wedge reconstruction is more powerful than in the AdS/CFT setting. In contrast to the special case of a closed universe, generically quantum gravity with positive cosmological constant -- including the future wedge -- is manifestly consistent with the existence of multiple states.", "url": "https://arxiv.org/abs/2604.10267", "type": "理论", "summary": "1. 该工作利用时空拓扑中普遍存在的两个类时边界，构建了能捕获宇宙视界之外（包括未来楔形区）的微观全息对偶。\n2. 其核心突破在于通过两套修饰哈密顿量理论的拷贝，在谱的顶层由近最大纠缠热场双态导出扩展时空，并解决了未重整化引力路径积分鞍点在纠缠熵计算中的极大化问题。\n3. 这一框架表明，在正宇宙常数下，因果楔重建比AdS/CFT情形更有效，且量子引力可与多态存在性自洽，为研究未来楔形区等非渐近区域提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Batoul Banihashemi"}, {"name": "Gauri Batra"}, {"name": "Albert Y.T. Law"}, {"name": "Eva Silverstein"}, {"name": "Gonzalo Torroba"}], "featured_authors": [{"name": "Batoul Banihashemi"}, {"name": "Gauri Batra"}, {"name": "Albert Y.T. Law"}, {"name": "Eva Silverstein"}, {"name": "Gonzalo Torroba"}], "author_count": 5}, {"id": "2604.10284", "category": "hep-th", "title": "Some progress on the use of the variational method in quantum field theory", "abstract": "Strongly coupled quantum field theories in $(1+1)$ dimensions are notoriously hard to solve non-perturbatively. Variational methods, despite their success for quantum many-body physics on the lattice, have long lacked a natural ansatz adapted to the relativistic setting. This monograph explains the intuition behind relativistic continuous matrix product states (RCMPS), a variational ansatz tailored to $(1+1)$-dimensional QFT, and reports on several years of progress in developing and applying this approach. Using Riemannian optimization on the manifold of RCMPS, we obtain competitive non-perturbative approximations to ground state energies and local observables in the $\\phi^4$, Sine-Gordon, and Sinh-Gordon models, including in strongly coupled regimes where perturbation theory fails. We then describe extensions to models with several interacting fields. Beyond energy density and local observables, we show how the framework can be used to evaluate non-local observables (defects) and, through an original linear programming approach, to extract spectral data such as particle masses. We close by discussing the current limitations of the method and the most promising directions for future work.", "url": "https://arxiv.org/abs/2604.10284", "type": "理论", "summary": "1. 该工作系统阐述了为(1+1)维量子场论设计的变分ansatz——相对论连续矩阵乘积态（RCMPS）的直觉基础，并报告了在其开发与应用中的多年进展，包括对φ⁴、Sine-Gordon和Sinh-Gordon等模型的研究。\n2. 其卖点在于采用RCMPS流形上的黎曼优化技术，在扰动理论失效的强耦合区域中，实现了对地态能量和局域观测量的竞争性非微扰近似，并扩展至多场模型、非局域缺陷观测及通过线性规划方法提取粒子质量等谱数据。\n3. 这为未来改进RCMPS方法的计算效率与理论局限、探索其在更高维或复杂场论中的适用性，以及为非微扰量子场论研究开发新数值工具提供了明确启示和方向。", "summary_source": "deepseek", "authors": [{"name": "Antoine Tilloy"}], "featured_authors": [{"name": "Antoine Tilloy"}], "author_count": 1}, {"id": "2604.10434", "category": "hep-th", "title": "Connecting Supersymmetry to Non-Supersymmetric theories: the Gross-Neveu-Yukawa example", "abstract": "We construct a generalized Lagrangian that unifies the Gross-Neveu-Yukawa, Nambu-Jona-Lasinio-Yukawa, and Wess-Zumino models, allowing for arbitrary scalar and fermion flavors in $D$-dimensional regularization. This framework clarifies how emergent supersymmetry arises at critical points and reveals structural connections between these theories. The unified formulation provides additional supersymmetry Ward identities that simplify loop calculations, even for non-supersymmetric models. As an application, we show how this technique can reduce the computational cost of determining anomalous dimensions of twist-two operators.", "url": "https://arxiv.org/abs/2604.10434", "type": "理论", "summary": "1. 该工作在D维正则化下构建了一个统一Gross-Neveu-Yukawa、Nambu-Jona-Lasinio-Yukawa和Wess-Zumino模型的广义拉格朗日量，并允许任意标量与费米子味道。\n2. 其物理核心在于揭示了这些理论在临界点的结构联系与超对称涌现机制，并通过统一框架提供的额外Ward恒等式简化了非超对称模型的微扰计算。\n3. 该方法能有效降低扭二算符反常维度等复杂量的计算成本，为高阶圈图计算和理论交叉研究提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Mrigankamauli Chakraborty"}, {"name": "Sven-Olaf Moch"}], "featured_authors": [{"name": "Mrigankamauli Chakraborty"}, {"name": "Sven-Olaf Moch"}], "author_count": 2}, {"id": "2604.10583", "category": "hep-th", "title": "The Junction Law for Multipartite Entanglement in Confining Holographic Backgrounds", "abstract": "We investigate how the junction law for multipartite entanglement is realized in confining holographic backgrounds, using genuine multi-entropy (GM) as our main diagnostic. We first study an AdS$_3$ hard-wall toy model as an analytic benchmark, where multi-way cuts and junction geometries can be analyzed explicitly. In this setup, we classify the relevant saddles, determine the dominant phases, and show that the genuinely multipartite contribution diagnosed by GM is localized near the junction. We also examine how this structure depends on subsystem sizes, asymmetry, and the confinement scale, including phase transitions between competing saddles. We then move beyond the hard-wall benchmark to smooth confining geometries, focusing on the D4-soliton and D3-soliton backgrounds and formulating the corresponding framework also for the Klebanov--Strassler background. In the smooth-cap examples, we find that the junction picture persists, while the detailed phase structure differs from the hard-wall case: in particular, the hard-wall plateau does not survive, and GM instead decreases monotonically and vanishes at a finite critical scale. We also find that the short-distance behavior is background-dependent, with $\\mathrm{GM}^{(3)}\\sim L^{-4}$ in the D4-soliton background, $\\mathrm{GM}^{(3)}\\sim L^{-2}$ in the D3-soliton background, and $\\mathrm{GM}^{(3)}\\sim L^{-2}\\cdot (\\log L)^{2}$ in the Klebanov--Strassler background. These results clarify which features of the junction-law picture are robust in confining holography and which features of the phase structure and short-distance scaling are background-dependent.", "url": "https://arxiv.org/abs/2604.10583", "type": "理论", "summary": "1. 本文研究了禁闭全息背景下多体纠缠的连接律，以真实多熵为主要诊断工具，先后分析了硬墙玩具模型与光滑禁闭几何。\n2. 研究揭示了真实多体纠缠贡献定域于连接点附近，且在光滑几何中多熵呈单调递减至临界尺度消失，其短距离标度行为依赖于具体背景。\n3. 这些结果明确了连接律图像中哪些特征在全息禁闭中是普适的，哪些相结构细节与标度行为依赖于背景，为后续研究全息禁闭中的纠缠结构提供了清晰框架。", "summary_source": "deepseek", "authors": [{"name": "Norihiro Iizuka"}, {"name": "Akihiro Miyata"}], "featured_authors": [{"name": "Norihiro Iizuka"}, {"name": "Akihiro Miyata"}], "author_count": 2}, {"id": "2604.10803", "category": "hep-th", "title": "Exact holographic thermal spectral functions: OPE, non-perturbative corrections, and black hole singularity", "abstract": "We study analytic properties of thermal spectral functions of holographic CFTs, examining both their (a) exact properties at finite momentum and (b) asymptotics at large momentum. For even-dimensional holographic CFTs on Minkowski spacetime and for scalar primaries with integer dimensions, we demonstrate that the exact spectral function at finite momentum factorizes into a perturbative/OPE piece and a non-perturbative piece. The former is controlled by stress tensor exchange and fixed by a near-boundary analysis. The latter encodes information about the bulk interior, including the black hole horizon and singularity. Utilizing the exact factorization, we obtain the full transseries expansion of the non-perturbative piece at large timelike momentum. This is achieved by employing exact WKB techniques to compute the monodromy of the bulk wave equation. Finally, we use these results to work out the singular loci of a spatially averaged thermofield double correlator in the complex time plane. These singular loci have been argued to provide imprints of the black hole curvature singularity in the dual CFT observables. Our result, which includes the case of non-vanishing momentum, gives a clear link between the non-perturbative spectral function and the black hole singularity.", "url": "https://arxiv.org/abs/2604.10803", "type": "理论", "summary": "1. 该工作研究了全息共形场论热谱函数的解析性质，包括有限动量的精确分解和大动量的渐近展开。\n2. 其核心在于将精确谱函数因式化为微扰/算子积展开部分与非微扰部分，并利用精确WKB技术建立后者与黑洞奇点的联系。\n3. 这为通过非微扰谱函数在共形场论可观测量中探测黑洞奇点提供了明确的理论依据。", "summary_source": "deepseek", "authors": [{"name": "Hewei Frederic Jia"}, {"name": "Mukund Rangamani"}], "featured_authors": [{"name": "Hewei Frederic Jia"}, {"name": "Mukund Rangamani"}], "author_count": 2}, {"id": "2604.10919", "category": "hep-th", "title": "Dynamical Generation of the VY Superpotential in $N=1$ SYM: A Higher-Form Perspective", "abstract": "We present a semiclassical account of the Veneziano-Yankielowicz (VY) superpotential in four-dimensional $N=1$ super Yang-Mills theory. Motivated by two-dimensional gauged linear sigma models, where superpotentials arise from vortex dynamics, we reinterpret domain walls as fundamental objects associated with higher-form gauge fields. In this formulation, the vacuum structure is encoded in a compact three-form gauge field, whose four-form flux labels topological sectors. In the presence of charged matter with total charge $N$, these sectors exhibit a natural $\\mathbb{Z}_N$ structure, leading to a decomposition into $N$ semiclassical contributions. These contributions arise from Euclidean point-like configurations in the higher-form sector, analogous to fractional instantons. We show that these configurations provide the relevant non-perturbative contributions to the effective superpotential. Integrating out the associated degrees of freedom reproduces the VY superpotential in the infrared. This gives a semiclassical origin of the VY superpotential in terms of higher-form gauge dynamics.", "url": "https://arxiv.org/abs/2604.10919", "type": "理论", "summary": "1. 该工作从高阶形式规范场的角度，为四维N=1超对称杨-米尔斯理论中的Veneziano-Yankielowicz超势提供了一个半经典解释。\n2. 其核心在于将畴壁重新诠释为与高阶形式规范场相关的基本客体，并将真空结构编码在一个紧致的三形式规范场中，从而自然地导出了具有Z_N结构的拓扑扇区分解。\n3. 这一框架明确了高阶形式规范动力学如何产生非微扰贡献并生成有效超势，为理解其他规范理论中的非微扰现象提供了新的半经典视角。", "summary_source": "deepseek", "authors": [{"name": "Wei Gu"}], "featured_authors": [{"name": "Wei Gu"}], "author_count": 1}, {"id": "2604.11051", "category": "hep-th", "title": "Uni-vector deformations, D0-bound states and DLCQ", "abstract": "We investigate uni-vector deformation in the Type IIA setup and show that the D0-brane background is mapped into itself (sedimentation), and other extremal backgrounds get bound with a dissolved D0-brane charge. Explicitly we generate F1-D0 and D2-D0 bound states background from uni-vector deformations. For the former we show that deformation of the non-extremal string gives the correct thermal F1-D0 bound state. We discuss relations between critical uni-vector deformations and DLCQ of M-theory.", "url": "https://arxiv.org/abs/
