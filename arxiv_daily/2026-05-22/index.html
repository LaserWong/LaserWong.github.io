<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-05-22 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

      <h1>Daily ArXiv Selection</h1>

        数据来自 arXiv 当天的 <code>cond-mat</code>、<code>hep-th</code>、<code>math-ph</code>、<code>quant-ph</code> 四个分类页，口径限定为 <code>New submissions</code>。
        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。

  <script>
    const papers = [{"id": "2605.21585", "category": "cond-mat", "title": "Robust fluctuating intertwined charge stripes in the Emery model", "abstract": "The single-band Hubbard model is one of the most extensively studied models in condensed matter physics, giving rise to intertwined spin and charge stripes that coexist with, or lie in the vicinity of, superconductivity in the phase diagram. However, whether the low energy physics of the single-band Hubbard model is fully equivalent to the multi-band (multi-orbital) Emery model remains an unsettled question. While the intertwined stripes and nematicity have been studied in the single-band Hubbard model, a comprehensive picture in the Emery model is lacking. In this paper, we focus on the less investigated intertwined charge stripes using complementary density matrix renormalization group (DMRG) and determinant quantum Monte Carlo (DQMC) techniques. Our ground state DMRG confirms the presence of the oxygen-centered charge stripes at a reduced amplitude in the Emery model parameter regime widely used in the study of intertwined stripes. Close analysis of the oxygen orbital structure of the static charge correlation function from DQMC reveals the charge stripe pattern in real-space, showcasing stronger charge density modulation on $p$-orbitals pointing along ``the rivers of charge'', consistent with DMRG. For the parameter set with the largest fermion signs, we managed to reach a temperature where the system first demonstrated tendencies to form purely unidirectional spin and charge stripes, and the $B_{1g}$ component becomes dominant in the bond-charge nematic susceptibility. This observation correlates with the doping dependence of the kinetic energy anisotropy, suggesting a close relation between the nematicity and charge stripes in the Emery model.", "url": "https://arxiv.org/abs/2605.21585", "type": "理论+数值", "summary": "1. 该工作利用密度矩阵重正化群和行列式量子蒙特卡洛方法，系统研究了Emery模型中交织电荷条纹的存在性与实空间结构。\n2. 核心发现是氧中心电荷条纹振幅减小且p轨道沿“电荷河流”方向调制更强，同时向列性B1g分量在低温下主导键电荷磁化率，与动能各向异性的掺杂依赖相关联。\n3. 这揭示了Emery模型中向列性与电荷条纹的密切关系，为理解铜氧化物超导中多轨道效应与电荷有序的相互作用提供了关键线索。", "summary_source": "deepseek", "authors": [{"name": "Rong Zhang"}, {"name": "Sijia Zhao"}, {"name": "Hong-Chen Jiang"}, {"name": "Brian Moritz"}, {"name": "Edwin W. Huang"}, {"name": "Thomas P. Devereaux"}], "featured_authors": [{"name": "Rong Zhang"}, {"name": "Sijia Zhao"}, {"name": "Hong-Chen Jiang"}, {"name": "Brian Moritz"}, {"name": "Edwin W. Huang"}, {"name": "Thomas P. Devereaux"}], "author_count": 6}, {"id": "2605.21616", "category": "cond-mat", "title": "Observation of Altermagnetic Order Switching in Bulk MnTe by Polarized Neutron Diffraction", "abstract": "Altermagnetic order, characterized by the Néel vector, breaks time-reversal symmetry (TRS) even in the nonrelativistic limit. Although spin-polarized and anomalous transport phenomena emerge with this order, they are mutually compensated by TRS-connected antiphase domains with opposite Néel vectors. Here we employ polarized neutron diffraction to directly probe the altermagnetic order in MnTe. Pronounced nuclear-magnetic interference terms were observed, providing direct evidence of a net Néel vector in the bulk crystal. Moreover, a weak ferromagnetic moment (WFM), originating from relativistic spin-orbit coupling, was found to be coupled with the altermagnetic order. Both the altermagnetic order and the WFM can be switched by milli-Tesla-scale magnetic field cooling.", "url": "https://arxiv.org/abs/2605.21616", "type": "理论", "summary": "1. 本工作利用极化中子衍射直接观测到块体MnTe中的交错磁序，通过核-磁干涉项证实净奈尔矢量的存在。\n2. 其关键发现是弱铁磁矩源自相对论自旋-轨道耦合且与交错磁序强耦合，两者均可通过毫特斯拉量级磁场冷却实现翻转。\n3. 这为利用弱场操控交错磁序及相关自旋输运现象提供了直接实验基础，并启发了非相对论性时间反演对称破缺序的研究方向。", "summary_source": "deepseek", "authors": [{"name": "Zheyuan Liu"}, {"name": "Shinichiro Asai"}, {"name": "Shingo Takahashi"}, {"name": "Hiraku Saito"}, {"name": "Taro Nakajima"}, {"name": "Takatsugu Masuda"}], "featured_authors": [{"name": "Zheyuan Liu"}, {"name": "Shinichiro Asai"}, {"name": "Shingo Takahashi"}, {"name": "Hiraku Saito"}, {"name": "Taro Nakajima"}, {"name": "Takatsugu Masuda"}], "author_count": 6}, {"id": "2605.21632", "category": "cond-mat", "title": "Diagrammatic Monte Carlo for Fermionic Rényi Entanglement Entropy", "abstract": "We develop a direct diagrammatic Monte Carlo framework for the Renyi entanglement entropy of interacting lattice fermions. The method starts from the fermionic graded-swap representation of Z_n[A]=Tr_A\\rho_A^n, which converts the entropy problem into a replicated path integral with mixed temporal boundary conditions on the entangling region. In this representation the replica momenta are half-shifted, q_m=(2m+1)\\pi/n, and the interaction expansion has a determinant form suitable for connected-determinant summation. We combine this expansion with a many-configuration Markov-chain Monte Carlo sampler to obtain order-by-order corrections for very large systems to very high orders. As a benchmark, we compare the order-by-order coefficients of a 3*3 Hubbard cluster with exact diagonalization. We then report a production calculation for a large periodic lattice with a square subregions. The dominant system-size limitation is therefore memory rather than a conventional auxiliary-field sign problem. The results provide a step toward diagrammatic calculations of fermionic entanglement observables in regimes where direct quantum Monte Carlo sampling is costly or sign-problem limited.", "url": "https://arxiv.org/abs/2605.21632", "type": "理论+数值", "summary": "1. 该工作发展了直接图解蒙特卡洛框架，用于计算相互作用晶格费米子体系的Rényi纠缠熵。\n2. 其技术核心在于将纠缠熵转化为具有混合时间边界条件的复制路径积分，并利用费米子分级交换表示和半移位复制动量实现连接行列式求和与高阶微扰采样。\n3. 这为在传统量子蒙特卡洛面临符号问题或计算成本高昂的区域，开展费米子纠缠可观测量的大规模图解计算提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Boyuan Shi"}], "featured_authors": [{"name": "Boyuan Shi"}], "author_count": 1}, {"id": "2605.21722", "category": "cond-mat", "title": "MetaDNS: Enhancing Exploration in Discrete Neural Samplers via Well-Tempered Metadynamics", "abstract": "Sampling from discrete distributions with multiple modes and energy barriers is fundamental to machine learning and computational physics. Recent discrete neural samplers like MDNS suffer from mode collapse and fail to sample high-energy barrier regions between modes, which is critical for free energy estimation and understanding phase transitions. We propose Metadynamics Discrete Neural Sampler (MetaDNS), a general framework integrating well-tempered metadynamics into discrete diffusion or autoregressive samplers. By maintaining an adaptive, history-dependent bias potential along selected low-dimensional coordinates, MetaDNS forces exploration of previously inaccessible regions, enabling free energy reconstruction infeasible with standard neural samplers due to a lack of high-energy samples. On challenging low-temperature benchmarks including Ising, Potts, and the copper-gold binary alloy, MetaDNS reproduces the thermodynamic distribution. Compared to MCMC-based metadynamics, MetaDNS also achieves comparable exploration requiring fewer bias deposition steps.", "url": "https://arxiv.org/abs/2605.21722", "type": "理论+数值", "summary": "1. 该工作提出MetaDNS框架，将温控元动力学习入离散扩散或自回归采样器，解决多峰离散分布采样中的模式坍塌问题。\n2. 其核心在于沿低维坐标维护自适应历史依赖偏置势，迫使探索高能垒区域，实现标准神经采样器因缺乏高能样本而不可行的自由能重构。\n3. 这为伊辛、波特斯及铜金二元合金等低温基准系统的热力学分布复现提供了高效手段，并有望推广至复杂离散概率模型的自由能计算与相变研究。", "summary_source": "deepseek", "authors": [{"name": "Xiaochen Du"}, {"name": "Juno Nam"}, {"name": "Jaemoo Choi"}, {"name": "Wei Guo"}, {"name": "Sathya Edamadaka"}, {"name": "Junyi Sha"}, {"name": "Elton Pan"}, {"name": "Yongxin Chen"}, {"name": "Molei Tao"}, {"name": "Rafael Gómez-Bombarelli"}], "featured_authors": [{"name": "Xiaochen Du"}, {"name": "Juno Nam"}, {"name": "Jaemoo Choi"}, {"name": "Yongxin Chen"}, {"name": "Molei Tao"}, {"name": "Rafael Gómez-Bombarelli"}], "author_count": 10}, {"id": "2605.21741", "category": "cond-mat", "title": "Rheology and Programmable Gelation of DNA Origami Polymer Tadpoles", "abstract": "DNA origami is a powerful method to achieve nanoscale folded structures. Despite rapid improvements in folding and purification methods, DNA origami objects are still often produced in small quantities and studied at single molecule scale. Here, we design simple DNA origami-inspired polymers with complex topologies, and study their rheology and viscoelastic properties in dense conditions. First, we designed and purified topologically distinct DNA nanostructures, linear, circular, and \"tadpole\" polymers, to evaluate how polymer architecture influences entanglement and rheology. Despite their distinct topologies, we observe that all constructs obeyed universal rheological scalings, likely due to their short length. However, upon thermal annealing in the bulk, the DNA origami-like polymers displayed significantly different behaviours. Our results suggest that DNA origami-like polymers could be used to engineer thermoresponsive behaviours in complex fluids by introducing reversible and topology-dependent crosslinking.", "url": "https://arxiv.org/abs/2605.21741", "type": "理论+数值", "summary": "1. 本文设计并纯化了线性、环形与“蝌蚪”形拓扑DNA折纸聚合物，研究其在稠密条件下的流变与粘弹性行为。\n2. 尽管短链导致所有拓扑结构在稀溶液下遵循通用流变标度，但体相热退火后出现显著的拓扑依赖性交联行为。\n3. 该工作表明DNA折纸聚合物可通过可逆拓扑交联实现复杂流体的热响应性可编程凝胶化。", "summary_source": "deepseek", "authors": [{"name": "Jennifer Harnett"}, {"name": "Saminathan Ramakrishnan"}, {"name": "Alice L. B. Pyne"}, {"name": "Elizabeth P. Holmes"}, {"name": "Davide Michieletto"}], "featured_authors": [{"name": "Jennifer Harnett"}, {"name": "Saminathan Ramakrishnan"}, {"name": "Alice L. B. Pyne"}, {"name": "Elizabeth P. Holmes"}, {"name": "Davide Michieletto"}], "author_count": 5}, {"id": "2605.21767", "category": "cond-mat", "title": "Uncovering Antipolar Ordering and Pressure-Tunable Phases in Hexagonal LaN", "abstract": "We predict an antipolar instability in hexagonal LaN using first-principles density functional theory. Starting from a nonpolar hexagonal phase, we identify competing polar and antipolar zone-center phonon instabilities. Condensation of the polar and antipolar modes stabilizes, respectively, dynamically stable wurtzite (WZ) phase and an hexagonal antipolar (AP) phase which is characterized by alternating local polarization and zero net macroscopic polarization within the unit cell. At ambient conditions, the AP phase is metastable with respect to the WZ phase, and a finite energy barrier exists between these phases, suggesting a possible polarization-switching pathway via the AP intermediate state. The energy barrier between the WZ and AP phases decreases with increasing pressure, indicating enhanced tunability between polar and antipolar states. The sublattice polarization increases with pressure in the AP phase, while it decreases in the WZ phase. We further find that, with increasing pressure, the rock-salt and tetragonal phases of LaN become more stable than the hexagonal phases (AP and WZ). Consequently, the realization of the AP phase is more favorable in the low-pressure regime, where hexagonal phases remain energetically competitive. These results demonstrate pressure-driven competition between polar and antipolar phases in LaN and point toward antiferroelectric-like behavior in this binary nitride system.", "url": "https://arxiv.org/abs/2605.21767", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算预测六方LaN中存在反极性晶格不稳定性，并鉴定出极性（纤锌矿）与反极性（零净极化）两种竞争相。\n2. 其核心在于揭示反极性相由交替局域极化构成且与极性相间存在有限能量势垒，压力可调控该势垒及亚晶格极化强度。\n3. 这为在二元氮化物体系中实现类似反铁电行为的压力可调极性-反极性相变提供了明确微观路径与启发。", "summary_source": "deepseek", "authors": [{"name": "Atanu Paul"}, {"name": "Laurent Bellaiche"}, {"name": "Charles Paillard"}], "featured_authors": [{"name": "Atanu Paul"}, {"name": "Laurent Bellaiche"}, {"name": "Charles Paillard"}], "author_count": 3}, {"id": "2605.21774", "category": "cond-mat", "title": "Conductivity of a Non-Galilean--Invariant Fermi Liquid: Exact Solution of the Kinetic Equation", "abstract": "We obtain an exact expression for the conductivity of a disordered, non-Galilean-invariant Fermi liquid by solving the kinetic equation with both screened Coulomb and $z=3$ Pomeranchuk critical interactions. While consistent with previous asymptotic results, our solution shows that electron-electron interactions enter the conductivity solely via the quasiparticle scattering time, $\\tau_\\mathrm{ee}$. Accordingly, the crossovers between the collisionless and hydrodynamic regimes occur when $1/\\tau_\\mathrm{ee}$ becomes comparable to the larger of the impurity scattering rate and the probe frequency, $\\Omega$. In addition, the exact solution yields the optical response in the hydrodynamic regime, $\\Omega\\ll 1/\\tau_\\mathrm{ee}$, which is inaccessible within perturbation theory. Near a $z=3$ Pomeranchuk quantum critical point, consistency between the kinetic-equation and Kubo approaches requires proper inclusion of mass renormalization within the Eliashberg approximation, which also ensures that the crossover between the collisionless and hydrodynamic regimes in the optical conductivity occurs at the Planckian scale $\\Omega\\sim T$.", "url": "https://arxiv.org/abs/2605.21774", "type": "理论", "summary": "1. 该工作精确求解了无序非伽利略不变费米液体的动力学方程，获得了电导率的闭合形式表达式。\n2. 其关键物理在于电子-电子相互作用仅通过准粒子散射时间进入电导率，且精确解揭示了微扰论无法触及的流体动力学区光学响应，并指出临界点处质量重整化对一致性不可或缺。\n3. 这为解析理解非伽利略不变费米液体中从无碰撞到流体动力学区的普朗克尺度交叉提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Tatia Kiliptari"}, {"name": "Vladimir I. Yudson"}, {"name": "Dmitrii L. Maslov"}], "featured_authors": [{"name": "Tatia Kiliptari"}, {"name": "Vladimir I. Yudson"}, {"name": "Dmitrii L. Maslov"}], "author_count": 3}, {"id": "2605.21826", "category": "cond-mat", "title": "A diffuse-interface theory of active nematic interfaces: transport mechanisms and modal structure", "abstract": "We develop a long-wavelength theory for the linear stability of a flat interface between an active nematic and an isotropic fluid. Starting from a diffuse-interface Cahn--Hilliard--Landau--de Gennes description coupled to Brinkman-screened Stokes hydrodynamics, we project the linearized dynamics onto a small set of interfacial degrees of freedom: the conserved translation, or height, mode; a scalar profile distortion or amplitude mode; and a transverse orientational mode associated with director rotations. Eliminating the gapped scalar profile mode gives a reduced interfacial operator coupling the conserved height mode to the transverse orientational mode. The main result is that activity generates, in the screened diffuse-interface regime, a direct local contribution proportional to $q^2$ in the height sector. This term competes with the passive local diffusive capillary relaxation, which enters at order $q^4$, and defines a local active interfacial channel controlled by the internal structure of the diffuse interface. This mechanism is distinct from the non-analytic $|q|$ and $|q|q^2$ terms characteristic of weakly screened Hele--Shaw/Saffman--Taylor-type transport, which are controlled by long-ranged momentum transport in the surrounding fluid. This framework identifies a diffuse-interface route to active interfacial instability that can operate while the homogeneous active nematic remains linearly stable because of hydrodynamic screening. It also provides a basis for distinguishing local diffuse-interface instabilities, bulk-flow-driven hydrodynamic instabilities, and mixed regimes in active nematic--isotropic interfaces.", "url": "https://arxiv.org/abs/2605.21826", "type": "理论", "summary": "1. 该工作建立了一个耦合Cahn-Hilliard-Landau-de Gennes相场与Brinkman屏蔽Stokes流体力学的长波理论，用以分析活性向列相与各向同性流体平界面的线性稳定性。\n2. 其核心在于将线性化动力学投影至保守高度模、有能隙标量轮廓模和横向取向模，并消除标量模后得到活性对高度模的局域q²贡献，该机制与被动毛细松弛的q⁴项竞争，区别于长程流体输运控制的非解析项。\n3. 这为区分局域相场界面不稳定性、体流驱动水动力不稳定性及混合机制提供了框架，并揭示了在体相活性向列相因屏蔽效应保持线性稳定时界面失稳的可能性。", "summary_source": "deepseek", "authors": [{"name": "Rodrigo C. V. Coelho"}, {"name": "Mykola Tasinkevych"}, {"name": "Margarida M. Telo da Gama"}], "featured_authors": [{"name": "Rodrigo C. V. Coelho"}, {"name": "Mykola Tasinkevych"}, {"name": "Margarida M. Telo da Gama"}], "author_count": 3}, {"id": "2605.21855", "category": "cond-mat", "title": "Defect Kinematics in 2D Nematics: Contributions from Surface Topology, Intrinsic and Extrinsic Geometry, Solitons, Defect Orientations, and Elastic Anisotropy", "abstract": "We characterise the particlelike kinematics of charge-carrying topological defects in nematic media via a geometric field theory. This differs from the theory of electromagnetism, with which it is often compared, due to the absence of gauge-invariance. In both approaches, basic defect interactions are governed by a propagator, which depends upon the global topology and/or intrinsic geometry of the surface. For nematic materials, however, the minimisation of the free energy is sensitive to constraints that a gauge invariant theory would otherwise be indifferent to. Hodge theory is used to capture these as `harmonic' excitations, unifying two factors known to additionally affect the kinematics of defects in nematics: relative defect orientations and topological solitons. Perturbations to the form of the energy are also permitted in nematic materials due to gauge \\emph{non}invariance. Those that introduce non-linearities in the corresponding Euler--Lagrange equations are shown to result in defect interactions that go beyond pairwise despite the otherwise abelian nature of the underlying U(1) symmetry. We show how this type of induced many-body effect manifests in the cases of non-zero extrinsic curvature and/or elastic anisotropy.", "url": "https://arxiv.org/abs/2605.21855", "type": "理论", "summary": "1. 该工作利用几何场论表征了二维向列相中携带拓扑电荷的缺陷的类粒子运动学。\n2. 其核心在于基于规范非不变性，通过Hodge理论将缺陷相对取向与拓扑孤子统一为调和激发，并揭示能量非线性扰动产生超出两体相互作用的缺陷多体效应。\n3. 这为理解非零外曲率和弹性各向异性下向列相缺陷的复杂运动提供了统一理论框架，可推广至其他非规范不变连续介质。", "summary_source": "deepseek", "authors": [{"name": "Joseph Pollard"}, {"name": "Richard G. Morris"}], "featured_authors": [{"name": "Joseph Pollard"}, {"name": "Richard G. Morris"}], "author_count": 2}, {"id": "2605.21900", "category": "cond-mat", "title": "Dissipation-Selected Resonant Fronts in a Driven-Dissipative Bose-Hubbard Lattice", "abstract": "Spatially structured dissipation organizes driven quantum matter beyond Hamiltonian control. We show that a dissipation gradient combined with a Stark-induced detuning ramp selects a nonlinear resonance slice in a two-dimensional driven-dissipative Bose-Hubbard lattice, producing a pinned density front in generalized Gross-Pitaevskii simulations. The underlying resonance condition fixes the front position, while its Airy-like profile obeys a width scaling set by tunneling stiffness and the effective detuning slope. Treating the front as an emergent interface explains how tuning the selected resonance toward the minimum-loss side yields Peierls-Nabarro depinning steps, discrete transverse pattern locking, spatiotemporal chaos, and minimum-loss localization. Center-of-mass and generalized-imbalance diagnostics map these outcomes into a dynamical phase diagram as detuning-ramp slope and dissipation-gradient strength vary. The results suggest structured dissipation as a mechanism for reconfigurable transport barriers and nonequilibrium interfaces in programmable bosonic lattices.", "url": "https://arxiv.org/abs/2605.21900", "type": "理论+数值", "summary": "1. 该工作利用耗散梯度与斯塔克失谐斜坡在二维驱动-耗散玻色-哈伯德晶格中选取非线性共振切片，从而产生钉扎密度前沿。\n2. 其核心在于揭示前沿位置由共振条件固定，其艾里型轮廓宽度由隧穿刚度和有效失谐斜率标度，且作为涌现界面解释了Peierls-Nabarro脱钉、模式锁定及时空混沌等行为。\n3. 这为在可编程玻色晶格中利用结构耗散实现可重构输运壁垒与非平衡界面提供了明确的物理机制与相图指引。", "summary_source": "deepseek", "authors": [{"name": "Wei-Guo Ma"}, {"name": "Heng Fan"}], "featured_authors": [{"name": "Wei-Guo Ma"}, {"name": "Heng Fan"}], "author_count": 2}, {"id": "2605.21918", "category": "cond-mat", "title": "First-Principles Study of Fe Adsorption and Its Effects on the Mechanical and Electrical Properties of Monolayer and Bilayer Biphenylene Networks", "abstract": "Biphenylene network (BPN) is a 2D carbon allotrope that exhibits promising potential for applications. In this work, we systematically investigated the adsorption characteristics of Fe atoms on monolayer and bilayer BPN. Structural optimization and adsorption energy analysis reveal that, for monolayer BPN, the average adsorption gradually enhances with increasing Fe coverage, indicating a strengthening of Fe-substrate interactions. The most stable configuration is identified at an Fe/C ratio of 50 %. For bilayer BPN, the energetically preferred adsorption site for Fe atom is located at the center of the interlayer four-membered ring, with an average adsorption energy of -4.3 eV. Mechanical properties are further evaluated for pristine and Fe-decorated BPN. The results demonstrate that monolayer and bilayer BPN possess relatively high in-plane Young's and shear moduli, indicative of excellent in-plane mechanical stability. Fe adsorption is found to have only a minor effect on the in-plane mechanical properties of both monolayer and bilayer BPN, suggesting that the in-plane stiffness is predominantly governed by the intrinsic carbon framework. In contrast, the out-of-plane mechanical response of bilayer BPN is significantly affected by Fe incorporation. The effective out-of-plane elastic constant C33 of pristine bilayer BPN is calculated to be 24.59 GPa, indicating relatively weak interlayer interactions and facile deformation along the out-of-plane direction. Notably, this property can be substantially enhanced by interlayer Fe adsorption, with C33 increasing dramatically to 515.63 GPa upon an Fe/C ratio of 25 %. The calculations on pristine and Fe-decorated BPN reveal pronounced anisotropy in the conductivity, with the value along one direction being significantly higher than that along the other. At 300 K, the overall conductivity is on the order of 10^5 S/m.", "url": "https://arxiv.org/abs/2605.21918", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算，系统研究了Fe原子在单层与双层双苯撑网络上的吸附行为及其对力学和电学性能的影响。\n2. 核心发现是：Fe吸附使双层体系的层间弹性常数C33从24.59 GPa跃升至515.63 GPa，而平面内力学性能几乎不变；体系呈显著导电各向异性，室温电导率约10^5 S/m。\n3. 这揭示了通过过渡金属插层可大幅增强二维碳同素异形体的层间结合，为设计兼顾平面刚度与可调层间性质的导电材料提供明确方向。", "summary_source": "deepseek", "authors": [{"name": "Xiao-Ke Zhang"}, {"name": "Zheng-Zhe Lin"}], "featured_authors": [{"name": "Xiao-Ke Zhang"}, {"name": "Zheng-Zhe Lin"}], "author_count": 2}, {"id": "2605.21933", "category": "cond-mat", "title": "Thermodynamic Irreversibility of Training Algorithms", "abstract": "The training algorithms for AI systems all introduce far-from-equilibrium dynamical processes, and understanding the irreversibility of these algorithms is a fundamental step towards understanding the learning dynamics of modern AI systems. In this work, we establish a general framework for defining and analyzing the irreversibility of training algorithms. We show that four different ways to characterize the irreversibility of dynamical processes are equivalent to leading order in the step size $\\eta$: numerical backward error $\\phi_{\\rm DE}$, time-renormalized correction $\\phi_{\\rm TR}$, microscopic time reversal asymmetry $\\phi_{\\rm TA}$, and the (regularized) stochastic-thermodynamic entropy production $\\phi_{\\rm ST}$. The irreversibility gives rise to a time-reversal-symmetry-breaking emergent force that generically breaks non-isometric continuous reparametrization symmetries, preserves orthogonal symmetries, and leads to a universal preference for those learning trajectories that minimize the entropy production rate.", "url": "https://arxiv.org/abs/2605.21933", "type": "理论+数值", "summary": "1. 该工作针对现代人工智能训练算法中普遍的远离平衡动力学，建立了统一热力学不可逆性分析框架，并证明在步长一阶下数值后向误差、时间重正化修正、微观时间反演不对称性与随机熵产生严格等价。\n2. 其核心机制在于不可逆性诱发的对称破缺力自动保护正交变换对称性，同时破坏非等距连续重参数化对称性，从而引导学习轨迹优先沿着熵产生率最小的路径演化。\n3. 该框架将随机热力学与机器学习深度耦合，为定量研究神经网络等复杂系统的非平衡学习动力学、预测训练偏好及设计优化策略提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Liu Ziyin"}, {"name": "Yuanjie Ren"}, {"name": "Adam Levine"}, {"name": "Isaac Chuang"}], "featured_authors": [{"name": "Liu Ziyin"}, {"name": "Yuanjie Ren"}, {"name": "Adam Levine"}, {"name": "Isaac Chuang"}], "author_count": 4}, {"id": "2605.22103", "category": "cond-mat", "title": "Berezinskii-Kosterlitz-Thouless-type Transition in Site Percolation on the Diamond Hierarchical Lattice", "abstract": "We study site percolation on the diamond hierarchical lattice, a finite-dimensional fractal network, using an exact generating-function analysis. In contrast to bond percolation, site percolation on this lattice does not undergo a transition from a nonpercolating phase to a percolating phase. Instead, the system exhibits a nonpercolating phase for $p<p_{\\rm c}$ and a critical phase for $p>p_{\\rm c}$. In the critical phase, the size of the largest cluster remains subextensive, scaling as $N^{\\psi(p)}$, where the fractal exponent $\\psi(p)$ varies continuously with $p$. By analyzing the renormalization-group recursion relation in the vicinity of $p_{\\rm c}$, we show that the correlation length exhibits a Berezinskii-Kosterlitz-Thouless-type essential singularity, $\\xi(p)\\sim \\exp \\left({\\rm const}/\\sqrt{p_{\\rm c}-p}\\right)$ for $p \\to p_{\\rm c}^-$, which is further confirmed by finite-size scaling analyses showing excellent data collapse. These results demonstrate that critical phases in percolation can emerge even on finite-dimensional networks and that exponential volume growth is not necessary for such phases to appear. We argue that the critical phase on the diamond hierarchical lattice stems from site dilution remaining relevant under renormalization.", "url": "https://arxiv.org/abs/2605.22103", "type": "理论+数值", "summary": "1. 该工作通过精确生成函数分析，研究了金刚石层级晶格上的位点逾渗，发现其不存在传统逾渗转变，而是出现非逾渗相与临界相。\n2. 其核心发现在于临界相中最大团簇呈亚扩展标度行为，分形指数连续变化，且关联长度呈现BKT型本质奇点，并被有限尺寸标度分析证实。\n3. 这一结果表明，有限维网络亦可支持临界相，位点稀释在重整化下保持相关是关键机制，无需指数体积增长。", "summary_source": "deepseek", "authors": [{"name": "Takehisa Hasegawa"}, {"name": "Kazuki Wataya"}, {"name": "Tomoaki Nogawa"}], "featured_authors": [{"name": "Takehisa Hasegawa"}, {"name": "Kazuki Wataya"}, {"name": "Tomoaki Nogawa"}], "author_count": 3}, {"id": "2605.22125", "category": "cond-mat", "title": "CNN-Based Classifier for Automated Identification of Magnetic States in Spin Dynamics Simulations", "abstract": "The identification and classification of different magnetic states are essential for understanding the complex behavior of magnetic systems. Traditional approaches that rely on handcrafted features or manual inspection often fall short, particularly when dealing with subtle or topologically complex spin textures. In this study, we present an automated deep learning model that employs an EfficientNetV1B0 Convolutional Neural Network to classify nine distinct magnetic states, including both ferromagnetic (FM) and antiferromagnetic (AFM) spin textures such as AFM skyrmions and AFM stripe domains. The spin configurations are generated through atomistic spin dynamics simulations using the Spirit code, then visualized with VFRendering to produce RGB images, which serve as inputs to the classification model.", "url": "https://arxiv.org/abs/2605.22125", "type": "理论+数值", "summary": "1. 该工作采用EfficientNetV1B0卷积神经网络，自动分类自旋动力学模拟生成的九种磁态，包括铁磁与反铁磁拓扑自旋织构。\n2. 其核心优势在于以RGB图像作为输入，无需人工特征提取，实现对复杂拓扑自旋态（如反铁磁斯格明子、条状畴）的端到端高精度识别。\n3. 这为磁态自动识别提供了深度学习范式，有望加速自旋动力学中复杂磁织构的快速普查与系统研究。", "summary_source": "deepseek", "authors": [{"name": "Amal Aldarawsheh"}, {"name": "Ahmed Alia"}, {"name": "Stefan Blügel"}], "featured_authors": [{"name": "Amal Aldarawsheh"}, {"name": "Ahmed Alia"}, {"name": "Stefan Blügel"}], "author_count": 3}, {"id": "2605.22128", "category": "cond-mat", "title": "Superconductivity in doped spin multimer systems", "abstract": "Binding energy, which quantifies pair formation, is a key factor in the emergence of superconductivity. Here, we show that even when multiple spins are complexly coupled, hole-doped systems, which can be mapped onto the universal hardcore boson model in the strong-binding-energy limit, exhibit promising signatures of superconductivity. We analytically and numerically demonstrate this concept in the double Kondo lattice model. Using the density-matrix renormalization group method, we show that a pairing state is maintained via a crossover even for parameters away from the strong-coupling regime. Additionally, we find that once binding energies are sufficiently generated, pair correlations develop similarly regardless of the details of local spin correlations. Our findings suggest useful guidelines for research on superconductivity.", "url": "https://arxiv.org/abs/2605.22128", "type": "理论+数值", "summary": "1. 该工作研究了掺杂自旋多聚体系统中的超导性，通过分析结合能在空穴掺杂体系中的关键作用，并在双Kondo晶格模型中利用密度矩阵重整化群方法进行解析与数值验证。\n2. 其核心在于揭示在强结合能极限下体系可映射为通用硬核玻色子模型，且超导配对态在耦合参数偏离强耦合区域时仍可通过交叉维持，对局域自旋关联细节不敏感。\n3. 这为探索复杂自旋耦合系统中超导机制提供了明确指导，启发后续实验与理论研究聚焦结合能的充分生成以诱发类似配对行为。", "summary_source": "deepseek", "authors": [{"name": "Ritsuki Hirabayashi"}, {"name": "Masataka Kakoi"}, {"name": "Ryota Ueda"}, {"name": "Kazuhiko Kuroki"}, {"name": "Tatsuya Kaneko"}], "featured_authors": [{"name": "Ritsuki Hirabayashi"}, {"name": "Masataka Kakoi"}, {"name": "Ryota Ueda"}, {"name": "Kazuhiko Kuroki"}, {"name": "Tatsuya Kaneko"}], "author_count": 5}, {"id": "2605.22135", "category": "cond-mat", "title": "Gyromagnetic Quantum Friction in Rayleigh Vorticity Baths", "abstract": "We identify an intrinsic zero-temperature relaxation channel for near-surface spins gyromagnetically coupled to Rayleigh-wave vorticity. This surface-mode contribution requires no thermal phonons, unlike Raman relaxation, and is fixed by Rayleigh vorticity rather than material-specific $g$-factor modulation. The Rayleigh-vorticity bath is super-Ohmic and evanescent with depth, producing field and depth scalings of spin relaxation. These scalings establish shallow spin sensors and hybrid surface-acoustic-wave spin interfaces as detectors of Rayleigh-wave acoustic quantum friction in solids.", "url": "https://arxiv.org/abs/2605.22135", "type": "理论", "summary": "1. 该工作识别了近表面自旋与瑞利波涡度发生回磁耦合所导致的固有零温弛豫通道。\n2. 其核心在于该通道由瑞利涡度浴决定，呈超欧姆特性且随深度衰减，无需热声子或材料特定g因子调制，产生场强与深度的定标关系。\n3. 此发现为浅层自旋传感器与混合表面声波自旋界面提供探测固体中瑞利波声学量子摩擦的理论依据。", "summary_source": "deepseek", "authors": [{"name": "Mamoru Matsuo"}, {"name": "Ryotaro Sano"}, {"name": "Ai Yamakage"}, {"name": "Hiroshi Funaki"}, {"name": "Tatsuhiko N. Ikeda"}], "featured_authors": [{"name": "Mamoru Matsuo"}, {"name": "Ryotaro Sano"}, {"name": "Ai Yamakage"}, {"name": "Hiroshi Funaki"}, {"name": "Tatsuhiko N. Ikeda"}], "author_count": 5}, {"id": "2605.22234", "category": "cond-mat", "title": "Virp: neural network-accelerated prediction of physical properties in site-disordered materials", "abstract": "Among metallic alloys, ceramics, and even common compounds such as water ice, it is usual to find materials in which crystalline order is expressed as a probability. In such cases, one or more sites within a crystal can be occupied by multiple elements or vacancies, according to a set of probabilities. These crystal structures remain inaccessible to common first-principles materials simulation methodologies, which assumes perfect crystal order. Workaround strategies to this limitation include quasirandom structures and cluster expansion. These methods are system-specific and computationally expensive as they rely on large scale Monte Carlo simulations of enlarged unit cells. To address these limitations, we propose a pipeline combining a permutation-based virtual cell generation algorithm, sampling regime, and thermodynamic post-processing which greatly improves the feasibility of computation analyses for site-disordered materials. We demonstrate that the massive configurational space can be adequately sampled with 400 virtual cells, as long as the supercell definition is sufficiently large.", "url": "https://arxiv.org/abs/2605.22234", "type": "数值", "summary": "1. 该工作提出了一个结合置换虚拟晶胞生成、采样与热力学后处理的神经网络加速管线，用于预测位点无序材料的物理性质。\n2. 其核心在于仅需约400个足够大超胞的虚拟晶胞即可充分采样巨大的构型空间，摒弃了系统特异的团簇展开与大尺度蒙特卡洛模拟。\n3. 这为位点无序合金、陶瓷乃至冰等材料的可及第一性原理计算与高通量筛选提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Andy Paul Chen"}, {"name": "Martin Hoffmann Petersen"}, {"name": "Kedar Hippalgaonkar"}], "featured_authors": [{"name": "Andy Paul Chen"}, {"name": "Martin Hoffmann Petersen"}, {"name": "Kedar Hippalgaonkar"}], "author_count": 3}, {"id": "2605.22254", "category": "cond-mat", "title": "DMFT analysis of Hopfield network with plasticity", "abstract": "We study a fully connected Hopfield-type associative memory network with online activity-dependent synaptic plasticity, where neural states and synaptic couplings coevolve during retrieval. Using the generating-functional formalism, we derive a dynamical mean-field theory (DMFT) in the large-system limit with extensively many stored random patterns, and show that the many-body dynamics reduces to an effective single-site stochastic process with colored Gaussian crosstalk noise and delayed feedback terms. Numerical solutions of the DMFT equations agree well with direct simulations. We find that moderate plasticity enlarges the basin of attraction and increases the maximum retrievable memory load by generating a positive delayed feedback that stabilizes retrieval against crosstalk noise. However, excessively strong plasticity causes the network to imprint the imperfect initial cue itself, leading to spurious attractors and degraded retrieval performance. Consequently, an optimal plasticity strength emerges from the trade-off between memory stabilization and premature cue imprinting. These results extend the DMFT description of associative memory to networks with coevolving neural and synaptic dynamics.", "url": "https://arxiv.org/abs/2605.22254", "type": "理论+数值", "summary": "1. 该工作利用生成泛函方法，推导了具有活动依赖突触可塑性的全连接Hopfield网络在大系统极限下的动态平均场理论。\n2. 其核心在于将多体动力学约化为有效单点随机过程，揭示可塑性通过延迟正反馈稳定检索与过早印记初始线索之间的权衡，从而产生最优可塑性强度。\n3. 这为研究神经和突触协同演化的关联记忆网络提供了理论框架，并可拓展至其他可塑性规则或网络结构。", "summary_source": "deepseek", "authors": [{"name": "Yoshinori Hara"}, {"name": "Yoshiyuki Kabashima"}], "featured_authors": [{"name": "Yoshinori Hara"}, {"name": "Yoshiyuki Kabashima"}], "author_count": 2}, {"id": "2605.22369", "category": "cond-mat", "title": "Improvement of piezocatalytic performance of Na0.5Bi0.5TiO3 perovskite using K doping for efficient Rhodamine B degradation", "abstract": "Piezocatalysis, based on the piezoelectric properties of catalysts, breaks down the barrier between mechanical energy and chemical energy. It describes the use of charges induced by piezoelectricity to assist typical chemical processes while harvesting various forms of mechanical green energy. The performance of piezocatalysis is predominantly governed by the piezoelectric properties of materials. The main aim of this work is to evaluate and analyze the potential of potassium doped sodium bismuth titanate Na0.5-xKxBi0.5TiO3 abbreviated as NKxBT (0, 0.15, 0.20, and 0.25), as a piezocatalyst in the degradation of the organic dye Rhodamine B RhB under ultrasonic vibration. The synthesis of NKxBT nanopowders was conducted using the sol-gel autocombustion method. Coupled structural analysis reveals the presence of an intermediate Morphotropic Phase Boundary (MPB, where two phases coexist) in the optimal NK15BT composition. The piezocatalytic degradation results showed a total piezo-degradation in only 90 min and a rate constant 8 times higher than the undoped NK0BT. The enhanced piezocatalytic activity results from a synergistic effect of MPB presence, reduced particle size, optimal bandgap and high lattice strain. The NK15BT sample also demonstrated good reusability and good mineralization.", "url": "https://arxiv.org/abs/2605.22369", "type": "理论+数值", "summary": "1. 该工作采用溶胶凝胶自燃烧法合成不同钾掺杂量的Na0.5-xKxBi0.5TiO3（x=0,0.15,0.20,0.25）纳米粉末，并系统评估其压电催化降解罗丹明B的活性与稳定性。\n2. 核心卖点是最优组分NK15BT（x=0.15）位于准同型相界附近，结合颗粒尺寸减小、带隙优化及晶格应变增大，使压电降解速率常数较未掺杂样品提高8倍，90分钟内完全降解，且经多次循环后仍保持高活性与良好矿化能力。\n3. 这凸显了准同型相界与多参数协同优化在提升钙钛矿压电催化性能中的关键作用，为通过机械能收集实现高效环境修复的催化剂设计提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Salma Ayadh"}, {"name": "Salma Touili"}, {"name": "Mbarek Amjoud"}, {"name": "Daoud Mezzane"}, {"name": "Mohamed Goune"}, {"name": "Jaafar Ghanbaja"}, {"name": "Manal Benyoussef"}, {"name": "Hana Ursic"}, {"name": "Nejc Suban"}, {"name": "Mustapha Raihane"}, {"name": "Zdravko Kutnjak"}, {"name": "Mimoun El Marssi"}], "featured_authors": [{"name": "Salma Ayadh"}, {"name": "Salma Touili"}, {"name": "Mbarek Amjoud"}, {"name": "Mustapha Raihane"}, {"name": "Zdravko Kutnjak"}, {"name": "Mimoun El Marssi"}], "author_count": 12}, {"id": "2605.22375", "category": "cond-mat", "title": "Multipolar exchange in a many-body homonuclear mixture of atoms in different internal states", "abstract": "We develop a general method for constructing the many-body Hamiltonian of pairwise interactions describing homonuclear mixtures of atoms occupying states with different total angular momenta or other quantum numbers. The advantage of the irreducible spherical tensor operator formalism is demonstrated: these operators give the Hamiltonian an explicit physical structure, account for all scattering channels, and include multipolar exchange interactions. The latter correspond to the exchange of both angular-momentum projections and the total angular momentum. Particular realizations of the general Hamiltonian, widely used in the physics of ultracold gases, are also analyzed. The resulting Hamiltonian provides a universal framework for investigating a broad range of quantum many-body phenomena in bosonic and fermionic atomic gases.", "url": "https://arxiv.org/abs/2605.22375", "type": "理论", "summary": "1. 该工作构建了描述不同内态同核原子混合物中多极交换相互作用的通用多体哈密顿量。\n2. 利用不可约球张量算符形式系统纳入所有散射通道并显式处理总角动量及其投影的交换。\n3. 这为玻色和费米超冷气体中多种量子多体现象提供了统一的理论框架。", "summary_source": "deepseek", "authors": [{"name": "M. Bulakhov"}, {"name": "A.S. Peletminskii"}, {"name": "Yu.V. Slyusarenko"}], "featured_authors": [{"name": "M. Bulakhov"}, {"name": "A.S. Peletminskii"}, {"name": "Yu.V. Slyusarenko"}], "author_count": 3}, {"id": "2605.22383", "category": "cond-mat", "title": "Aggregation-Fragmentation Processes with Broken Detailed Balance", "abstract": "We study aggregation-fragmentation processes in which pairs of clusters can aggregate, and each cluster can break into two fragments. If the rates of aggregation and fragmentation do not depend on the masses, detailed balance does not hold, but nonequilibrium steady states can still be deduced from an exact solution for the Laplace transform. For models in which aggregation rates remain constant but fragmentation rates scale as $(\\text{mass})^\\beta$, detailed balance holds only when $\\beta=1$. Away from this solvable case, we employ asymptotic techniques and show that when $\\beta\\geq 0$, the steady states share similarities with those from the mass-independent ($\\beta=0$) model. An instantaneous shattering transition with continuous mass loss occurs when $\\beta<0$.", "url": "https://arxiv.org/abs/2605.22383", "type": "理论", "summary": "1. 该工作通过拉普拉斯变换精确求解了质量无关聚集-碎片化过程的非平衡稳态，并对碎片化速率正比于质量β次方的模型进行了渐近分析。\n2. 其核心发现是详细平衡仅在β=1时成立，β≥0时稳态类同于质量无关情形，而β<0时出现伴随连续质量损失的瞬时破碎相变。\n3. 这为无详细平衡的聚集-碎片化动力学提供了统一理论框架，并启示了非平衡相变中幂律标度与破碎奇异性之间的普适联系。", "summary_source": "deepseek", "authors": [{"name": "P. L. Krapivsky"}], "featured_authors": [{"name": "P. L. Krapivsky"}], "author_count": 1}, {"id": "2605.22517", "category": "cond-mat", "title": "Revisiting the high-field phase diagram of the topological cubic helimagnet SrFeO$_{3}$", "abstract": "The cubic perovskite SrFeO$_{3}$ is a prototypical centrosymmetric itinerant magnet that hosts a quadruple-${\\mathbf Q}$ hedgehog-antihedgehog lattice and exhibits a complex magnetic-field-temperature phase diagram. Yet, the microscopic mechanism underlying the emergence of its versatile multiple-${\\mathbf Q}$ phases remains unresolved. Here, we elucidate the field-orientation dependence of the magnetic phase diagram and establish an effective spin Hamiltonian for SrFeO$_{3}$ that incorporates a cubic single-ion anisotropy together with bilinear and biquadratic interactions in momentum space. In addition, we observe magnetoelastic signatures of a first-order valence transition upon entering the forced FM phase at 40 T, which would be attributed to the suppression of negative charge transfer. These findings emphasize the pivotal importance of electronic itinerancy arising from the formation of a ligand-hole band in stabilizing multiple-${\\mathbf Q}$ phases.", "url": "https://arxiv.org/abs/2605.22517", "type": "理论+数值", "summary": "1. 该工作重新审视了拓扑立方螺旋磁体SrFeO3的高磁场相图，建立了包含立方单离子各向异性及动量空间双线性与双二次相互作用的有效自旋哈密顿量。\n2. 其核心在于揭示了场取向依赖的多Q相形成机制，并在40 T进入受迫铁磁相时观测到一级价态转变的磁弹性信号，归因于负电荷转移的抑制。\n3. 这些结果强调配体空穴带导致的电子巡游性是稳定多Q相的关键，为理解巡游磁性体系中的拓扑自旋构型提供了微观基础。", "summary_source": "deepseek", "authors": [{"name": "Masaki Gen"}, {"name": "Shun Okumura"}, {"name": "Shusaku Imajo"}, {"name": "Taro Nakajima"}, {"name": "Karel Prokes"}, {"name": "Shunsuke Kitou"}, {"name": "Yusuke Tokunaga"}, {"name": "Yoichi Nii"}, {"name": "Koichi Kindo"}, {"name": "Yoshimitsu Kohama"}, {"name": "Shintaro Ishiwata"}, {"name": "Taka-hisa Arima"}], "featured_authors": [{"name": "Masaki Gen"}, {"name": "Shun Okumura"}, {"name": "Shusaku Imajo"}, {"name": "Yoshimitsu Kohama"}, {"name": "Shintaro Ishiwata"}, {"name": "Taka-hisa Arima"}], "author_count": 12}, {"id": "2605.22518", "category": "cond-mat", "title": "Observation of magnetically switchable quantum geometric photocurrents", "abstract": "In non-centrosymmetric materials, light can be rectified into two types of DC photocurrents, known as injection and shift currents, through the bulk photovoltaic effect. Recent theory has uncovered their deep relation with the two-state quantum geometry of resonant transitions: In non-magnetic crystals, where these currents have been routinely observed, the injection current responds to circular light and probes the Berry curvature, while the shift current responds to linear light and probes the geometric connection. Magnetic crystals have been predicted to show a new set of hitherto unobserved magnetically switchable photocurrents, with the roles of linear and circular light interchanged: A linear injection current, which probes the quantum metric, and a circular shift current, which probes the geometric torsion. In this work, we demonstrate the existence of such currents for the first time, demonstrating the switching of the current by flipping the Néel vector in a van der Waals antiferromagnet. Furthermore, their specific frequency and temperature dependence confirm the assignment of circular shift and linear injection currents. Our work demonstrates a new way to control photocurrents in magnets that are directly tied to geometry and have promising applications in antiferromagnetic spintronics and light harvesting.", "url": "https://arxiv.org/abs/2605.22518", "type": "理论", "summary": "1. 该工作首次在范德华反铁磁体中实验观测到磁可切换的量子几何光电流，包括圆偏移位电流和线偏注入电流。\n2. 其核心在于通过翻转奈尔矢量实现电流开关，并确认了线偏注入电流与量子度规、圆偏移位电流与几何挠率的对应关系。\n3. 这为利用量子几何效应调控磁性材料中的光电流提供了新机制，有望推动反铁磁自旋电子学和高效光收集器件的发展。", "summary_source": "deepseek", "authors": [{"name": "Qi Tian"}, {"name": "Zhuoliang Ni"}, {"name": "Matthew Cothrine"}, {"name": "David G. Mandrus"}, {"name": "Eugene J. Mele"}, {"name": "Andrew M. Rappe"}, {"name": "Charles L. Kane"}, {"name": "Fernando de Juan"}, {"name": "Liang Wu"}], "featured_authors": [{"name": "Qi Tian"}, {"name": "Zhuoliang Ni"}, {"name": "Matthew Cothrine"}, {"name": "Charles L. Kane"}, {"name": "Fernando de Juan"}, {"name": "Liang Wu"}], "author_count": 9}, {"id": "2605.22520", "category": "cond-mat", "title": "The cell fluid model with Curie-Weiss interactions: special cases and analytical results", "abstract": "Inspired by previous extensive numerical studies of a cell fluid model with Curie-Weiss interactions, we concentrate on some analytically tractable special cases in its description. The key ingredient of the model is a competition between global attraction and local repulsion interactions between particles with coupling constants $J_1$ and $J_2$, respectively. We provide analytical results in several limiting cases, including the ideal-gas limit $J_1=J_2=0$ and the strong-repulsion limit $J_2\\gg J_1$. For $J_2\\gg J_1$, a detailed analytical study is presented. We derive explicit expressions for the critical point parameters, the equation of state, and the binodal and spinodal curves in closed form. The equation of state is found to be in full agreement with that of the van der Waals lattice gas, and the order parameter satisfies the standard Curie-Weiss equation. In a neighborhood of the critical point, a Landau expansion is shown to have the same form and symmetry as that of the classical lattice gas within the mean-field approximation. Moreover, based on the explicit knowledge of a few leading terms in the asymptotic expansion of the deformed exponential function governing the physics of the cell model, we extend its validity range to include the marginal case of thermodynamic stability, $J_1=J_2$. In particular, this extension makes a consideration of the ideal-gas limit $J_1=J_2=0$ formally legitimate. For the generic marginal case $J_1=J_2\\ne0$ systematically avoided in previous works, we present numerical data and phase diagrams that augment their findings for $J_2>J_1$.", "url": "https://arxiv.org/abs/2605.22520", "type": "理论+数值", "summary": "1. 该工作聚焦于带有Curie-Weiss相互作用的细胞流体模型中可解析处理的特殊情形，给出了理想气体与强排斥极限下的严格解析结果。\n2. 其核心卖点是强排斥极限下获得了临界点参数、状态方程及binodal与spinodal曲线的闭合显式解，状态方程与平均场范德华晶格气体一致，序参量满足Curie-Weiss方程。\n3. 借助变形指数函数渐近展开的分析，将模型有效性延拓至热力学稳定性边缘情形J1=J2，为这一先前回避的参数区间提供了数值相图并补充了前人结果。", "summary_source": "deepseek", "authors": [{"name": "O. A. Dobush"}, {"name": "M. P. Kozlovskii"}, {"name": "I. V. Pylyuk"}, {"name": "R. V. Romanik"}, {"name": "M. A. Shpot"}], "featured_authors": [{"name": "O. A. Dobush"}, {"name": "M. P. Kozlovskii"}, {"name": "I. V. Pylyuk"}, {"name": "R. V. Romanik"}, {"name": "M. A. Shpot"}], "author_count": 5}, {"id": "2605.22582", "category": "cond-mat", "title": "Quantum Batteries in two-dimensional material-based Josephson Junctions", "abstract": "We investigate the solid-state implementation of a Dicke-like quantum battery consisting of a two-dimensional material-based Josephson junction inductively coupled to a resonator, using graphene as a representative example. In this configuration, Andreev bound states naturally act as non-interacting, energetically non-degenerate two-level systems, and the setup allows for both single-photon and two-photon resonant processes. The coupling between the LC-circuit flux and the supercurrent through the junction gives rise to peculiar longitudinal interaction terms that have no counterpart in the conventional Dicke model. These additional couplings can enhance energy storage for a proper range of parameters. The proposed architecture also enables an alternative, but equivalent, charging protocol that relies on tuning the superconducting phase difference across the junction.", "url": "https://arxiv.org/abs/2605.22582", "type": "理论", "summary": "1. 该工作提出在基于二维材料（以石墨烯为例）的约瑟夫森结中实现Dicke型量子电池的固态方案，安德烈夫束缚态作为非简并二能级系统。\n2. 其技术核心在于LC电路磁通与结超电流耦合产生的纵向相互作用项，该机制在常规Dicke模型中不存在，并可增强特定参数范围下的储能。\n3. 该架构还提供了通过调节结超导相位差进行等效充电的替代协议，为固态量子电池的实现开辟了新的路径。", "summary_source": "deepseek", "authors": [{"name": "V. Varrica"}, {"name": "G. Gemme"}, {"name": "F.M.D. Pellegrino"}, {"name": "E. Paladino"}, {"name": "M. Sassetti"}, {"name": "D. Ferraro"}], "featured_authors": [{"name": "V. Varrica"}, {"name": "G. Gemme"}, {"name": "F.M.D. Pellegrino"}, {"name": "E. Paladino"}, {"name": "M. Sassetti"}, {"name": "D. Ferraro"}], "author_count": 6}, {"id": "2605.22601", "category": "cond-mat", "title": "Upscaling DFT-trained machine-learning interatomic potential toward Quantum Monte Carlo accuracy: Sulfur-vacancy migration in monolayer MoS$_2$ as a testbed", "abstract": "We designed a procedure to train a machine learning interatomic potential (MLIP) at benchmark-quality quantum Monte Carlo (QMC) accuracy. To avoid the complexities of high-quality atomic force determination with the stochastic QMC methods, we use a multi-fidelity approach wherein high-level QMC energies are used alongside suitably processed low-level DFT atomic forces to train a QMC fine-tuned MLIP which significantly improves both the energetics and atomic forces over the baseline DFT-based MLIP. Fine-tuning is only applied to the readout layers of an equivariant message-passing MACE MLIP. We used sulfur mono- and multiple vacancies in monolayer MoS$_2$ as a testbed and demonstrate a near QMC accuracy of the model in a number of in- and out-of-domain tests. We show that a fairly limited dataset of QMC energies suffice to significantly improve the baseline DFT MLIP. The accuracy of our approach is demonstrated on energy and free energy migration barriers of mono- and multiple S-vacancy defects. The results open the window to large-scale near QMC quality simulations with large numbers of atoms and/or molecular dynamics configurations which would not be possible by a direct brute-force application of QMC methods.", "url": "https://arxiv.org/abs/2605.22601", "type": "理论+数值", "summary": "1. 本文提出多保真训练策略，以少量量子蒙特卡洛能量数据微调等变消息传递MACE神经网络读出层，使机器学习原子间势达到近量子蒙特卡洛精度。\n2. 该方案规避随机量子蒙特卡洛求原子力困难，利用低阶密度泛函理论力辅以高质量能量，在单层二硫化钼硫空位迁移中实现能量与势垒的显著精度提升。\n3. 此方法为大规模原子体系与分子动力学模拟开启接近量子蒙特卡洛精度窗口，尤其适用于直接强力量子蒙特卡洛不可行的缺陷迁移等长时演化问题。", "summary_source": "deepseek", "authors": [{"name": "Adam Hložný"}, {"name": "Ján Brndiar"}, {"name": "Ye Luo"}, {"name": "Ivan Štich"}], "featured_authors": [{"name": "Adam Hložný"}, {"name": "Ján Brndiar"}, {"name": "Ye Luo"}, {"name": "Ivan Štich"}], "author_count": 4}, {"id": "2605.22646", "category": "cond-mat", "title": "Directed extended-range percolation", "abstract": "While for standard percolation directionality is known to increase the combinatorial complexity of percolation, here we show that when connectivity is ensured by paths of length $R\\geq 2$, network directionality, impeding backtracking, can significantly reduce the complexity of percolation. To illustrate this finding, we introduce Directed Extended-Range Percolation (DERP), defined directed networks with non-reciprocal edges, motivated by applications in quantum communication. In this framework, message transmission is enabled between trusted nodes separated by a directed path of length at most $R$. Using a message-passing approach, we show that directionality enables an exact determination of the percolation threshold and the anomalous critical indices on locally tree-like structures. On random directed networks we find that the critical behavior of DERP depends sensitively on degree correlations. These analytical predictions are corroborated by extensive Monte Carlo simulations, highlighting the profound impact of directionality and correlations on long-range connectivity in complex networks.", "url": "https://arxiv.org/abs/2605.22646", "type": "理论+数值", "summary": "1. 该工作提出了有向扩展范围渗流模型，通过有向非互易边和长度不超过R的路径定义连接，研究了方向性对长程渗流复杂性的影响。\n2. 其核心在于利用消息传递方法在局部树状结构上精确求解渗流阈值和异常临界指数，并揭示了临界行为对度相关性的敏感依赖。\n3. 这为理解量子通信等实际有向网络中的长程连接提供了精确的理论框架，并启发了对方向性与相关性联合效应的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Wenbo Liu"}, {"name": "Yiwen Zeng"}, {"name": "Xueming Liu"}, {"name": "Ginestra Bianconi"}], "featured_authors": [{"name": "Wenbo Liu"}, {"name": "Yiwen Zeng"}, {"name": "Xueming Liu"}, {"name": "Ginestra Bianconi"}], "author_count": 4}, {"id": "2605.22761", "category": "cond-mat", "title": "Topological cell-openness index for porous materials", "abstract": "We propose a method of estimating the proportion of open and closed cells in a porous material based on measuring Betti numbers on the structures. Based on this method, we define a cell-openness index {\\tau} which can be used instead of or complementary to the proportion of open-celled volume reported by gas pycnometry, which is the current gold standard for pore type characterization. We discuss in what types of structures mismatches between the two measures can occur and how such mismatches convey additional information about the structure. We also demonstrate initial examples of significant correlations between {\\tau} and measurable physical quantities in numerically generated structures. We also discuss how Betti curves can be used to estimate characteristic feature sizes in porous structures.", "url": "https://arxiv.org/abs/2605.22761", "type": "理论+数值", "summary": "1. 该工作提出基于贝蒂数测量估算多孔材料中开孔与闭孔比例的方法，并定义细胞开放指数τ。\n2. 其核心卖点在于τ可替代或补充气体比重瓶法，通过两种测量不匹配揭示额外结构信息，并与可测物理量显著相关。\n3. 这为多孔材料表征提供了拓扑描述符，可结合贝蒂曲线估计特征尺寸，启发后续结构与性能关联研究。", "summary_source": "deepseek", "authors": [{"name": "Michał Bogdan"}, {"name": "Paweł Dłotko"}], "featured_authors": [{"name": "Michał Bogdan"}, {"name": "Paweł Dłotko"}], "author_count": 2}, {"id": "2605.22764", "category": "cond-mat", "title": "Spin Glass Mapping of the Parallel Minority Game", "abstract": "The parallel minority game (PMG) extends the classical minority game to many choices, with each agent restricted to two predetermined alternatives. In this condition, minimizing the population variance across all choices is a complex combinatorial optimization problem. We show that this minimization is exactly equivalent to finding the ground state of an Ising spin glass in the mean-field limit, i.e., the Sherrington-Kirkpatrick model. By encoding the agent choices as spin variables, the variance becomes a quadratic Hamiltonian with quenched random couplings $J_{ij}$ and random fields $h_i$. This mapping reveals inherent frustration and connects the PMG to the well developed theory of spin glasses, providing a new perspective on the frozen, sub-optimal configurations observed in stochastic strategies.", "url": "https://arxiv.org/abs/2605.22764", "type": "理论+数值", "summary": "1. 该工作将并行少数者博弈的群体方差最小化问题精确映射到平均场极限下的Sherrington-Kirkpatrick自旋玻璃基态搜索。\n2. 其核心在于将代理选择编码为Ising自旋变量，使方差转化为含淬火随机耦合与随机场的二次哈密顿量，从而揭示系统固有的阻挫特性。\n3. 这一映射为解释随机策略中出现的冻结次优构型提供了自旋玻璃理论视角，并启发了博弈与统计物理之间的深度关联。", "summary_source": "deepseek", "authors": [{"name": "Aryan Tyagi"}, {"name": "Soumyaditya Das"}, {"name": "Soumyajyoti Biswas"}, {"name": "Anirban Chakraborti"}], "featured_authors": [{"name": "Aryan Tyagi"}, {"name": "Soumyaditya Das"}, {"name": "Soumyajyoti Biswas"}, {"name": "Anirban Chakraborti"}], "author_count": 4}, {"id": "2605.22810", "category": "cond-mat", "title": "Signatures of the Quantum Geometric Dipole of Interlayer Excitons in Counterflow Conductivity", "abstract": "Collective excitations of many-body electron systems can carry internal structure, supporting novel quantum geometric and topological properties. Among these are a quantum geometric dipole (QGD), which for excitons have direct significance as an internal polarization. For interlayer excitons of a bilayer system, this represents an in-plane dipole moment, which can be used to drive them with in-plane electric fields. In this work, we consider counterflow electric currents associated with driven excitons in such a bilayer system as a probe of their QGD structure. As a simple but non-trivial example, we analyze a structure with a one-dimensional periodic potential in a strong perpendicular magnetic field. The resulting magnetoexciton bands host QGD structure that distinguishes it from the exciton QGD of a uniform system. To model exciton transport we adopt a Boltzmann approach that includes inter-band tunneling, allowing us to consider non-equilibrium momentum distributions that result from strong layer-antisymmetric driving fields. We show how linear response to a layer-symmetric component of the driving fields provide information about the QGD, and that the broad QGD structure of the exciton bands can be probed by the varying the layer-antisymmetric field. Our results demonstrate that counterflow conductivity serves as a tunable probe of the internal quantum geometric structure carried by the interlayer excitons, connecting transport to the quantum geometry of many-body excitations.", "url": "https://arxiv.org/abs/2605.22810", "type": "理论", "summary": "1. 本工作通过逆流电导率探索双层系统中层间激子的量子几何偶极子（QGD）结构。\n2. 结合含带间隧穿的玻尔兹曼输运模型，利用强垂直磁场下的一维周期势中磁激子能带的QGD特征，并通过层反对称驱动场调谐线性响应对层对称分量的敏感度。\n3. 结果表明逆流电导可作为可调探针，揭示多体激子内部量子几何结构，将输运性质与激子带的量子几何直接关联。", "summary_source": "deepseek", "authors": [{"name": "Fanuel I. Mendez"}, {"name": "Luis Brey"}, {"name": "H.A. Fertig"}], "featured_authors": [{"name": "Fanuel I. Mendez"}, {"name": "Luis Brey"}, {"name": "H.A. Fertig"}], "author_count": 3}, {"id": "2605.21577", "category": "hep-th", "title": "Chiral Electromagnetic Surface Waves on Chern-Simons Interfaces", "abstract": "We show that Maxwell theory with a codimension-$1$ Chern-Simons interface supports chiral electromagnetic surface waves on the interface, even when the bulk theory on both sides is conventional vacuum electrodynamics in infinite space. Solving the exact boundary value problem we find that the Chern-Simons interaction acts with opposite sign on the two helicities oriented along the interface, giving rise to one normalizable mode localized on the interface. This mode is a gapless chiral surface photon with linear dispersion and a frequency-independent index of refraction set by the Chern-Simons coefficient. This mode exists despite the absence of ambient material response or geometric confinement.", "url": "https://arxiv.org/abs/2605.21577", "type": "理论", "summary": "1. 本文证明在无限真空麦克斯韦理论中嵌入余维一Chern-Simons界面可支持手性电磁表面波。\n2. 其关键在于Chern-Simons作用对界面两侧两种手性分量符号相反，从而产生无隙线性色散表面光子，折射率仅由Chern-Simons系数决定，无需介质或几何约束。\n3. 这为在纯拓扑界面上实现无需材料响应的手性表面模式提供了新路径，可启发相关光与物质相互作用及拓扑光子系统研究。", "summary_source": "deepseek", "authors": [{"name": "Nemanja Kaloper"}], "featured_authors": [{"name": "Nemanja Kaloper"}], "author_count": 1}, {"id": "2605.21581", "category": "hep-th", "title": "Cosmological Collider in the Grassmannian", "abstract": "We revisit the computation of four-point wavefunction coefficients for external conformally coupled scalars exchanging a particle of general mass and spin. Much of the phenomenology of cosmological collider physics in the near-de Sitter limit follows from this function. Computing it in detail is a central challenge in the cosmological bootstrap. Using the cosmological Grassmannian, we write this correlator in closed form using hypergeometric functions and Legendre polynomials. We achieve this by writing the standard bootstrap differential equation using the Plücker coordinates of the Grassmannian, and using the basis of Mandelstam invariants. The correlator in the s-channel can be written in terms of a hypergeometric function of the S Mandelstam, while the spin information appears as an overall Legendre polynomial factor that also depends on the other Mandelstams. We fix the boundary conditions by first demanding the absence of unphysical singularities, and by further matching to kinematic limits of the momentum-space wavefunction. Our formulae in Grassmannian space are much simpler than their counterparts in momentum space, demonstrating another useful application of the Grassmannian as a kinematic space for cosmology.", "url": "https://arxiv.org/abs/2605.21581", "type": "理论", "summary": "1. 该工作利用宇宙学Grassmannian，以超几何函数和勒让德多项式闭式重建了交换任意质量自旋粒子的四点波函数系数。\n2. 其关键在于通过Plücker坐标重写bootstrap微分方程，并用Mandelstam不变量基底将自旋信息因子化为整体勒让德多项式，大幅简化了表达式。\n3. 这为近de Sitter极限中宇宙学对撞机物理的解析计算提供了更简洁的运动学框架，有望推广至更高点关联函数。", "summary_source": "deepseek", "authors": [{"name": "Mattia Arundine"}, {"name": "Guilherme L. Pimentel"}], "featured_authors": [{"name": "Mattia Arundine"}, {"name": "Guilherme L. Pimentel"}], "author_count": 2}, {"id": "2605.21582", "category": "hep-th", "title": "Multipositivity Constrains the Chiral Lagrangian", "abstract": "The chiral Lagrangian is a cornerstone of modern particle physics, offering a systematic and quantitative description of low-energy pions. Using tools from the modern scattering amplitudes program, we show that consistent multiparticle dynamics impose novel constraints on the coupling constants of this theory. In the planar limit, these constraints imply that certain Wilson coefficients of the chiral Lagrangian are bounded from below by the chiral anomaly. Our results reveal a subtle connection between the anomalous and nonanomalous sectors of the underlying strong interactions, while introducing a novel formulation of multipositivity bounds that holds for any planar tree-level theory.", "url": "https://arxiv.org/abs/2605.21582", "type": "理论", "summary": "1. 该工作利用现代散射振幅工具，证明多粒子动力学对手征拉格朗日量耦合常数施加了新的约束。\n2. 其技术要点在于平面极限下约束导致Wilson系数受手征反常下界限制，揭示反常与非反常扇区的微妙联系。\n3. 这为任意平面树图理论的多正性约束提供了新表述，并启发对低能强相互作用更深层次的理解。", "summary_source": "deepseek", "authors": [{"name": "Clifford Cheung"}, {"name": "Jaehoon Jeong"}, {"name": "Pyungwon Ko"}, {"name": "Alex Pomarol"}, {"name": "Grant N. Remmen"}, {"name": "Francesco Sciotti"}], "featured_authors": [{"name": "Clifford Cheung"}, {"name": "Jaehoon Jeong"}, {"name": "Pyungwon Ko"}, {"name": "Alex Pomarol"}, {"name": "Grant N. Remmen"}, {"name": "Francesco Sciotti"}], "author_count": 6}, {"id": "2605.21591", "category": "hep-th", "title": "Algebraic locality and non-invertible Gauss laws", "abstract": "We study algebraic locality principles on a 2+1D closed lattice in the presence of a Gauss law for a non-invertible symmetry. Prior work in arXiv:2509.03589 showed that when enforcing the Gauss law of an invertible symmetry, the principle of \"Haag duality\" is preserved exactly, and \"disjoint additivity\" is preserved after appropriate treatment of discreteness artifacts. Here we show that for a large class of non-invertible on-site symmetries, Haag duality is preserved exactly only for sufficiently nice, \"cuspless\" regions. For cusped regions, we instead have a weak form of Haag duality that requires adding a collar. Our results apply to double models with a purely magnetic constraint, and to the more general framework of constraints induced by the on-site action of a Hopf algebra. In particular, we treat a class of extended string-net models explicitly. We also demonstrate disjoint additivity for double models based on a group, and a weakened form of disjoint additivity in the setting of a general Hopf algebra.", "url": "https://arxiv.org/abs/2605.21591", "type": "理论", "summary": "1. 该工作系统研究了2+1维闭格点晶格上非可逆on-site对称性对应的Gauss定律对代数局域性原理的影响，重点分析了Haag对偶性与可分离可加性在非可逆约束下的成立条件。\n2. 其主要发现在于：对于非可逆对称性，Haag对偶性仅在无尖角的光滑区域严格成立，尖角区域仅保留需添加邻域的弱形式；同时，基于群的对偶模型保留可分离可加性，而一般Hopf代数约束下该性质也出现弱化。\n3. 这为理解非可逆对称性在拓扑序与量子纠错中的局域性约束提供了严格框架，并启发将代数量子场论方法推广至更广泛的非可逆对称系统。", "summary_source": "deepseek", "authors": [{"name": "Nicholas Holfester"}, {"name": "Jonathan Sorce"}], "featured_authors": [{"name": "Nicholas Holfester"}, {"name": "Jonathan Sorce"}], "author_count": 2}, {"id": "2605.21689", "category": "hep-th", "title": "Dissipative stabilization of Ostrogradsky modes in non-equilibrium field theory", "abstract": "In this work, we investigate higher-derivative quantum field theories and the problem of Ostrogradsky instability within an open-system Keldysh-Lindblad framework. Coupling the ghost sector to dissipative baths generates non-perturbative effective masses and dissipative widths through self-consistent gap equations. Above a critical coupling, the nonequilibrium dynamics develops bifurcated dissipative branches, signaling the emergence of a dissipative phase transition and a nontrivial critical structure in parameter space. We find that the resulting dissipative dynamics can suppress ghost excitations through two distinct mechanisms: in one branch, a large dynamically generated effective mass preserves a quasiparticle-like excitation, while in the second branch, strong dissipative broadening destroys the quasiparticle character through overdamped dynamics. Our results suggest that dissipative effects may provide a nonequilibrium mechanism for the spectral suppression of Ostrogradsky ghosts. The comparison with the healthy sector indicates that the stabilization mechanism is intrinsically tied to the ghost-like spectral structure.", "url": "https://arxiv.org/abs/2605.21689", "type": "理论", "summary": "1. 该工作基于开系统Keldysh-Lindblad框架，研究了耗散效应对高阶导数量子场论中Ostrogradsky不稳定性的抑制。\n2. 其核心在于自洽隙方程产生非微扰有效质量与耗散宽度，超过临界耦合时出现分叉耗散支，形成两种鬼激发抑制机制：准粒子保持或过阻尼消失。\n3. 这揭示了耗散可提供谱抑制Ostrogradsky鬼的非平衡途径，且稳定机制本质依赖于鬼谱结构与正常扇区的对比。", "summary_source": "deepseek", "authors": [{"name": "Y.M.P.Gomes"}], "featured_authors": [{"name": "Y.M.P.Gomes"}], "author_count": 1}, {"id": "2605.21755", "category": "hep-th", "title": "Universalities of Defects in Quantum Field Theories", "abstract": "Defects are both physically rich objects and powerful tools in modern quantum field theory. They are extended operators, such as boundaries, impurities, and probe particles, embedded in many-body systems. In this dissertation, we study the universal aspects of defect dynamics from the perspective of symmetry principles. We bring together several themes, including defect renormalization group flows, effective string theory, and impurities in atomic quantum gases.", "url": "https://arxiv.org/abs/2605.21755", "type": "理论", "summary": "1. 该工作从对称性原理出发，系统研究了量子场论中缺陷动力学的普适性，统一探讨了缺陷重整化群流、有效弦理论及原子量子气体杂质等主题。\n2. 其核心卖点在于揭示了缺陷作为扩展算符在多种物理场景下遵循统一的对称性约束，从而导出其普适动力学行为。\n3. 这为深入理解缺陷的普适分类与物理性质提供了理论框架，并对相关实验系统（如冷原子）中的缺陷研究具有明确指导意义。", "summary_source": "deepseek", "authors": [{"name": "Siwei Zhong"}], "featured_authors": [{"name": "Siwei Zhong"}], "author_count": 1}, {"id": "2605.21809", "category": "hep-th", "title": "Generalised Cartan Geometry", "abstract": "This talk introduces a Cartan-geometric framework for generalised geometries governed by a differential graded Lie algebra. In contrast to ordinary Cartan geometry, the tangent bundle is extended and qu both a global duality group and a local gauge group. This framework provides a systematic construction of generalised connections and their torsion and curvature tensors for generic generalised geometries. We also review the realisation of these algebraic structures on the phase space of branes in M-theory.", "url": "https://arxiv.org/abs/2605.21809", "type": "理论", "summary": "1. 该工作基于微分分次李代数，引入了适用于广义几何的Cartan几何框架。\n2. 其关键在于切丛扩展并同时具备全局对偶群与局部规范群，从而系统构造了广义联络、挠率及曲率张量。\n3. 这为M理论中膜相空间上代数结构的实现提供了统一几何描述，有望启发高维统一理论的研究。", "summary_source": "deepseek", "authors": [{"name": "David Osten"}], "featured_authors": [{"name": "David Osten"}], "author_count": 1}, {"id": "2605.21838", "category": "hep-th", "title": "New mechanism for fermion localization in $f(T,T_G)$-brane", "abstract": "We investigate the localization of fermionic fields in a five-dimensional braneworld scenario within the framework of modified teleparallel gravity described by a general $f(T,T_G)$ function. Considering a non-minimal coupling between a Dirac spinor and the torsional invariants, we derive the effective Schrödinger-like equations governing the Kaluza-Klein modes. We showed that the contribution of the teleparallel Gauss-Bonnet term significantly modifies the effective potentials and, consequently, the localization properties. The zero-mode analysis reveals that only one chiral component can be localized on the brane, with the degree of confinement depending on the chosen model. In the massive sector, the spectrum is continuous, but resonant states arise due to the internal structure of the potentials. Additionally, we employ information-theoretic measures, such as Shannon entropy and relative probability, to quantify the localization mechanism. Our results show that the torsional modifications induce a nontrivial redistribution of information, exhibiting stronger localization. These findings highlight the role of higher-order torsional terms in shaping fermionic localization and resonance structures in braneworld scenarios.", "url": "https://arxiv.org/abs/2605.21838", "type": "理论", "summary": "1. 该工作基于修正teleparallel引力理论的f(T,T_G)函数，在五维膜世界中研究了费米子场的局域化机制。\n2. 其技术核心在于引入Dirac旋子与挠率不变量的非最小耦合，通过teleparallel Gauss-Bonnet项修正有效势，实现了零模单手性分量局域化并产生连续谱中的共振态。\n3. 这揭示了高阶挠率项在膜世界费米子局域化与信息分布中的关键作用，为高维引力理论与粒子物理模型的构建提供了新工具。", "summary_source": "deepseek", "authors": [{"name": "Allan R. P. Moreira"}, {"name": "Fernando M. Belchior"}, {"name": "Guo-Hua Sun"}, {"name": "Shi-Hai Dong"}], "featured_authors": [{"name": "Allan R. P. Moreira"}, {"name": "Fernando M. Belchior"}, {"name": "Guo-Hua Sun"}, {"name": "Shi-Hai Dong"}], "author_count": 4}, {"id": "2605.21929", "category": "hep-th", "title": "Stochastic inflation as an open quantum system II: open effective field theory and stochastic matching", "abstract": "We further develop the proposal in Phys.\\ Rev.\\ Lett.\\ \\textbf{136} 071501 that interprets stochastic inflation as an open quantum system, by constructing the open effective field theory for the reduced density matrix of long wavelength modes. We clarify that this open effective field theory enjoys two renormalization group flows: the conventional Wilsonian channel, and a stochastic channel arising from the openness that has no counterpart in ordinary Wilsonian effective field theory. Focusing on the stochastic channel in the hard cutoff scheme, we identify both Gaussian and non-Gaussian diffusion as effective operators in the influence functional, and show that they are required by matching onto correlators and form factors of the perturbative full theory through a method-of-region in time. Beyond Gaussian order, the matching data are no longer local Wilson coefficients but nonlocal and non-Markovian Wilson kernels. We then obtain the bare Hamiltonian density of this open effective field theory and derive its nonlocal functional master equations, including the Fokker-Planck equation for the diagonal density matrix and the Klein-Kramers equation for the Wigner functional, with their zero-modess simplifications discussed. Finally, we take a first step toward a continuum version of this open effective field theory, replacing the hard cutoff by an analytic regulator in the stochastic channel, and demonstrate stochastic renormalization using a massive scalar as an example.", "url": "https://arxiv.org/abs/2605.21929", "type": "理论", "summary": "1. 该工作将随机暴胀作为开放量子系统处理，构建了长波长模式约化密度矩阵的开放有效场论，阐明了其同时具备传统威尔逊重整化群流与源于开放性的随机通道流。\n2. 技术上，在硬截断方案中识别了高斯与非高斯扩散作为影响泛函的有效算符，通过时间区域方法匹配微扰全理论，揭示了高斯阶以上匹配数据须为非局域非马尔可夫威尔逊核，并导出了零模式简化的Fokker-Planck与Klein-Kramers泛函主方程。\n3. 通过以解析正则子替代硬截断向连续极限推广，并以有质量标量场示范随机重整化，该工作为宇宙学退相干与随机动力学建立了非马尔可夫有效场论框架，启发了后续的随机重整化群研究。", "summary_source": "deepseek", "authors": [{"name": "Yue-Zhou Li"}], "featured_authors": [{"name": "Yue-Zhou Li"}], "author_count": 1}, {"id": "2605.22285", "category": "hep-th", "title": "Krakow Lectures on Scalar Quantum Solitons", "abstract": "We give a pedagogical introduction to Linearized Soliton Perturbation Theory (LSPT), a new and efficient tool for calculations involving quantum solitons. It is a Hamiltonian approach with a focus on explicitly constructing the soliton states. These states are squeezed, coherent states plus perturbative corrections. We will describe multi-loop corrections to states and their masses. An inner product suitable for non-normalizable momentum eigenstates will be introduced and applied to kink-meson scattering. We will also discuss domain wall solitons.", "url": "https://arxiv.org/abs/2605.22285", "type": "理论", "summary": "1. 该讲座系统介绍了线性化孤子微扰理论（LSPT），一种用于标量量子孤子计算的新哈密顿方法。\n2. 核心在于显式构造孤子态为压缩相干态加微扰修正，并引入适用于非归一化动量本征态的内积处理kink-介子散射。\n3. 这为精确计算量子孤子的多圈修正及畴壁孤子等动力学问题提供了高效框架，可启发后续量子场论中的非微扰研究。", "summary_source": "deepseek", "authors": [{"name": "Jarah Evslin"}], "featured_authors": [{"name": "Jarah Evslin"}], "author_count": 1}, {"id": "2605.22409", "category": "hep-th", "title": "Entanglement viscosity to entropy density ratio for spin-3/2 theory", "abstract": "It is known that the Minkowski vacuum appears as a thermal medium to an accelerated observer due to the renowned Unruh effect. More recently, it has been shown that at least for lower-spin fields this medium also exhibits a non-zero \"entanglement\" shear viscosity, which saturates the fundamental Kovtun-Son-Starinets (KSS) bound. We test the universality of this result for higher spins by computing the entanglement viscosity for spin-3/2 fields within the Rari
