ta-Schwinger-Adler (RSA) theory. Strikingly, we obtain a negative viscosity. However, computing the entropy density using the modular Hamiltonian expansion method, we find it is also negative, and the viscosity to entropy ratio saturates the KSS bound. To clarify the origin of the negativity, we use another approach of Zubarev density operator, which gives positive entropy. We also show that RSA theory has many features of a conformal field theory.", "url": "https://arxiv.org/abs/2605.22409", "type": "理论", "summary": "1. 该工作计算了Rarita-Schwinger-Adler理论中自旋3/2场的纠缠粘度和熵密度，并检验了KSS界对高自旋场的普适性。\n2. 其技术要点在于发现纠缠粘度和模哈密顿量展开熵密度均为负值，但二者比值仍饱和KSS界，而Zubarev密度算符则给出正熵。\n3. 这揭示了高自旋场中可能存在的负熵与纠缠粘度的关联，为KSS界在共形场论中的更广泛成立提供了新的检验案例。", "summary_source": "deepseek", "authors": [{"name": "R. V. Khakimov"}, {"name": "G. Yu. Prokhorov"}, {"name": "O. V. Teryaev"}], "featured_authors": [{"name": "R. V. Khakimov"}, {"name": "G. Yu. Prokhorov"}, {"name": "O. V. Teryaev"}], "author_count": 3}, {"id": "2605.22560", "category": "hep-th", "title": "Shading A-polynomials via huge representations of $U_q(\\mathfrak{su}_N)$", "abstract": "Classical A-polynomials $A(\\ell,m)$ define constraints on coordinates $\\ell$ and $m$ in $SL(2,\\mathbb{C})$ (a complexification of $SU(2)$) character varieties associated to knot complements $S^3\\setminus K$. Quantum A-polynomials $\\hat A(\\hat \\ell,\\hat m)$ are difference operators annihilating Jones polynomials believed to represent wave functions of 3d Chern-Simons theory with gauge group $SU(2)$ on a toroidal pipe surrounding the knot $K$ strand -- a boundary of the knot complements $S^3\\setminus K$. We suggest a construction of classical shaded A-polynomials $A_a(\\ell_b,m_c)$ associated to Lie groups $SU(N)$. We exploit a formalism of Clebsh-Gordan (CG) chords, where indices $a$, $b$, $c$ run over $1,\\ldots,N-1$. CG chords have a natural interpretation in terms of 2d CFTs of WZW type, or, alternatively, in terms of quantum group $U_q(\\mathfrak{su}_N)$. In the case of $\\mathfrak{su}_2$ CG chords could be associated to Reeb chords in a knot contact homology (KCH) framework. KCH suggests its own analogue of A-polynomials known as augmentation polynomials allowed to have extra spurious roots in principle. Yet the CG chord formalism could be easily extended to arbitrary $\\mathfrak{su}_N$ allowing us to generalize the construction of A(ugmentation)-polynomials to arbitrary $\\mathfrak{su}_N$ and arbitrary representation as well. Primarily we aim at classical A-polynomials by considering a double scaling limit when $q=e^{\\hbar}$, $\\hbar\\to 0$ and the representations are huge, in particular, highest weight vector components $w_i\\to \\infty$ so that $\\hbar w_i\\sim m_i$ remain finite. Still we expect the presented techniques would be helpful in deriving quantum A-polynomials for arbitrary Lie (super)algebras $\\mathfrak{g}$. Also we discuss explicit examples of A-polynomials for knots $3_1$, $4_1$ and $5_1$ for $\\mathfrak{g}=\\mathfrak{su}_3$.", "url": "https://arxiv.org/abs/2605.22560", "type": "理论", "summary": "1. 该工作利用$U_q(\\mathfrak{su}_N)$极大表示的双重缩放极限，通过Clebsh-Gordan弦形式主义将经典阴影A-多项式推广至$SU(N)$情形。\n2. 其核心在于将$\\hbar\\to0$且表示维数发散时$\\hbar w_i\\sim m_i$保持有限的缩放方案，结合CG弦与WZW CFT的关联，实现了对SU(3)结$3_1$、$4_1$、$5_1$的显式构造。\n3. 这为任意李(超)代数$\\mathfrak{g}$推广经典A(ugmentation)-多项式及进而导出其量子版本提供了系统化途径。", "summary_source": "deepseek", "authors": [{"name": "Dmitry Galakhov"}, {"name": "Alexei Morozov"}], "featured_authors": [{"name": "Dmitry Galakhov"}, {"name": "Alexei Morozov"}], "author_count": 2}, {"id": "2605.22628", "category": "hep-th", "title": "Ising surface defects can get dirty", "abstract": "Real critical systems, such as uniaxial ferromagnets in the 3d Ising universality class, are constrained by boundaries and subject to random couplings. We consider the Wilson-Fisher fixed point in $4-\\epsilon$ dimensions subject to a random magnetic field localized on a two-dimensional surface, which becomes co-dimension 1 in the physical $\\epsilon\\to1$ limit. Using the replica method for the disordered field, we find that the ordinary boundary condition is stable under disorder but also discover a non-trivial ``dirty\" boundary condition which can be reached by tuning the disorder strength or the local temperature. We also investigate the logarithmic structure of the defect spectrum and how it emerges via the replica formalism.", "url": "https://arxiv.org/abs/2605.22628", "type": "理论", "summary": "1. 该工作利用复制方法研究了$4-\\epsilon$维Wilson-Fisher固定点上局域于二维表面的随机磁场缺陷，分析了其对临界行为的影响。\n2. 其核心发现在于普通边界条件在无序下保持稳定，但通过调节无序强度或局域温度可达到非平凡的“脏”边界条件，并揭示了缺陷谱的对数结构及其复制形式机制。\n3. 这为理解真实三维Ising类临界系统中无序对表面缺陷的调控提供了明确理论框架，并可能启发实验上对随机场诱导边界相变的探索。", "summary_source": "deepseek", "authors": [{"name": "António Antunes"}, {"name": "Apratim Kaviraj"}, {"name": "Baishali Roy"}], "featured_authors": [{"name": "António Antunes"}, {"name": "Apratim Kaviraj"}, {"name": "Baishali Roy"}], "author_count": 3}, {"id": "2605.22822", "category": "hep-th", "title": "Bottom-up open EFT for non-Abelian gauge theory with dynamical color environment", "abstract": "We develop a bottom-up open effective field theory (EFT) for non-Abelian gauge theories within the Schwinger--Keldysh formalism. Instead of integrating out the environment completely and starting from a nonlocal influence functional, we retain the slow environmental response variables explicitly and construct a local system-environment EFT. The environmental sector is described by a dynamical color-frame variable, Stückelberg-like field, and an associated color-current sector, which gives the nontrivial interactions and dissipation between the system and the environment. The resulting construction provides a gauge-covariant Markov embedding of nonlocal and non-Markovian color response. After integrating out the retained environmental variables with retarded boundary conditions, the reduced system theory acquires nonlocal dissipative kernels and stochastic sources. We show that the hard thermal loop response arises naturally as a particular realization of the retained environmental response. Our framework provides a local open-EFT description of color transport, memory effects, and fluctuation-dissipation structure in non-Abelian plasmas, and offers a systematic starting point for dissipative Yang--Mills EFTs with dynamical environments.", "url": "https://arxiv.org/abs/2605.22822", "type": "理论", "summary": "1. 该工作基于Schwinger-Keldysh形式，为非阿贝尔规范理论构建自下而上的开放有效场论，其中环境由动力学色框架与Stückelberg场描述。\n2. 其技术核心是保留慢变环境响应变量并构建局域系统-环境EFT，实现规范协变的马尔可夫嵌入，且自然重生硬热环路响应。\n3. 该框架为描述非阿贝尔等离子体中的色输运、记忆效应与涨落-耗散结构提供了局域开放EFT起点，可用于发展含动态环境的耗散杨-米尔斯理论。", "summary_source": "deepseek", "authors": [{"name": "Yoshihiko Abe"}, {"name": "Kanji Nishii"}], "featured_authors": [{"name": "Yoshihiko Abe"}, {"name": "Kanji Nishii"}], "author_count": 2}, {"id": "2605.21508", "category": "math-ph", "title": "A Metric-Deformed $q$-Gauge Dirac Equation", "abstract": "We construct a family of metric-deformed gauge theories based on a recently introduced $q$-Dirac operator $D_q = \\gamma^\\mu \\sqrt{|g^{\\mu\\mu}|}\\partial_\\mu$, which arises from a deformed D'Alembertian $\\Box_q = |g^{00}|\\partial_t^2 - \\sum_i |g^{ii}|\\partial_i^2$. The deformation parameter $q$ is related to the metric components via $q_\\mu = \\sqrt{|g^{\\mu\\mu}|}$. By promoting $g^{\\mu\\mu}(x)$ to spacetime-dependent background fields, we define a deformed covariant derivative $D_\\mu^{(q)} = \\partial_\\mu + ieA_\\mu(x)/\\sqrt{|g^{\\mu\\mu}(x)|}$ (no sum over $\\mu$). The corresponding field strength $F_{\\mu\\nu}^{(q)} = [D_\\mu^{(q)}, D_\\nu^{(q)}]$ acquires new terms proportional to $\\partial_\\mu(1/\\sqrt{|g^{\\nu\\nu}|})$, which vanish for constant metrics. We write down gauge-invariant actions for deformed Yang-Mills theory and for fermions minimally coupled to $D_\\mu^{(q)}$. This work provides a mathematical foundation for $q$-deformed gauge theories from a metric perspective.", "url": "https://arxiv.org/abs/2605.21508", "type": "理论", "summary": "1. 该工作基于q-Dirac算符和度规形变张量，构建了包含形变协变导数和场强的一族规范理论，并给出了最小耦合费米子的作用量。\n2. 其核心物理创新在于场强中出现由度规空间依赖导数产生的新项，该效应在常度规背景下自然消失，揭示了形变与时空度规的耦合机制。\n3. 这为q-形变规范理论提供了严谨的度规数学基础，可启发对各向异性时空或非对易几何中规范动力学的进一步理论探索。", "summary_source": "deepseek", "authors": [{"name": "Julio César Jaramillo Quiceno"}], "featured_authors": [{"name": "Julio César Jaramillo Quiceno"}], "author_count": 1}, {"id": "2605.21749", "category": "math-ph", "title": "Landau-Ginzburg models of generalised Dubrovin-Zhang form and pole collision: Dynkin-type A", "abstract": "In arXiv:1711.05958 , arXiv:2103.12673 , the authors derive one-dimensional Landau-Ginzburg mirrors of Dubrovin-Zhang Frobenius manifolds constructed on regular orbit spaces of an extension of affine Weyl groups. We generalise the method employed, and classify the resulting Frobenius manifold structures in Dynkin type A. We interpret our results in terms of a stratification on the Hurwitz space boundary, and develop a pole-collision framework to compare the Frobenius structures within different strata. With this, we can prove a structural result at the level of the prepotential, for arbitrary rank and dimension, as a suitable renormalised limit of the formulae in arXiv:2412.05165 . As a corollary, a conjecture of Ma and Zuo regarding the form of prepotentials related to doubly-extended affine Weyl groups is proven.", "url": "https://arxiv.org/abs/2605.21749", "type": "理论", "summary": "1. 该工作将构造广义Dubrovin-Zhang形式的一维Landau-Ginzburg模型方法推广至Dynkin型A，系统分类了其Frobenius流形结构。\n2. 通过极点碰撞框架建立Hurwitz空间边界分层，证明了任意秩和维度下预势作为重整极限的结构性结果。\n3. 这直接验证了Ma和Zuo关于双扩展仿射Weyl群预势形式的猜想，并为理解Frobenius流形与可积系统间的分层边界提供了统一框架。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Proserpio"}, {"name": "Karoline van Gemst"}], "featured_authors": [{"name": "Alessandro Proserpio"}, {"name": "Karoline van Gemst"}], "author_count": 2}, {"id": "2605.21890", "category": "math-ph", "title": "Lie symmetries of a generalized Fisher equation in cylindrical coordinates", "abstract": "In this work we studied a generalized Fisher equation in cylindrical coordinate using Lie symmetry method. We have determined for what type of source function the generalized Fisher equation has Lie Symmetries other than time translation symmetry when the diffusion function is given by an exponential function. Also the reduced ordinary differential equations are obtained corresponding to Lie symmetries of the generalized Fisher equation.", "url": "https://arxiv.org/abs/2605.21890", "type": "理论", "summary": "1. 该工作采用Lie对称性方法系统分析了柱坐标系下广义Fisher方程，确定了扩散函数为指数形式时源函数需满足何种条件使得方程拥有时间平移以外的额外对称性。\n2. 其核心在于准确刻画出指数型扩散函数下，这些额外Lie对称性对应的源函数约束条件，并进一步推导出相应的约化常微分方程。\n3. 这为柱形几何中非线性扩散-反应方程的对称约化与解析求解提供了清晰的路径，拓展了Fisher型方程的群分析应用范围。", "summary_source": "deepseek", "authors": [{"name": "Bayarjargal Batsukh"}, {"name": "Uuganbayar Zunderiya"}], "featured_authors": [{"name": "Bayarjargal Batsukh"}, {"name": "Uuganbayar Zunderiya"}], "author_count": 2}, {"id": "2605.22023", "category": "math-ph", "title": "Asymptotics of the IDS for Schrödinger operators with singular potentials and Gibbs point processes", "abstract": "The asymptotic behavior of the integrated density of states (IDS), \\(N(E)\\), is investigated for random Schrödinger operators with a single-site potential \\(V\\) satisfying \\(\\mathrm{essinf}\\, V = -\\infty\\). Under the assumption that the underlying point process is a Gibbs point process with repulsive pairwise interactions, the leading term of \\(\\log N(E)\\) as \\(E \\to -\\infty\\) is determined using a periodic approximation method. It is shown that repulsive pairwise interactions lead to a significantly faster decay of \\(N(E)\\) compared to the Poisson case. Furthermore, configurations with multiple clusters can provide the dominant contribution to the IDS in the Gibbs setting, contrasting with the single-cluster dominance typically observed in Poisson models. Finally, refined estimates of the leading constants are provided for specific classes of potentials, including those with multiple singularities.", "url": "https://arxiv.org/abs/2605.22023", "type": "理论", "summary": "1. 该工作研究具有奇异势（单格点势本质下确界为负无穷）的随机薛定谔算子的态密度积分（IDS）在能量趋于负无穷时的渐近行为，假设底层点过程为具有排斥相互作用的Gibbs点过程。\n2. 技术核心是利用周期近似方法确定log N(E)的主项，揭示排斥相互作用导致N(E)比Poisson情形更快衰减，且Gibbs设置中多团簇构型可提供主导贡献，区别于单团簇主导的Poisson模型。\n3. 这为理解强排斥相互作用下随机系统低能谱的渐近行为提供了新途径，并为包含多奇点势类的主常数精细估计铺平了道路。", "summary_source": "deepseek", "authors": [{"name": "Yuta Nakagawa"}], "featured_authors": [{"name": "Yuta Nakagawa"}], "author_count": 1}, {"id": "2605.22212", "category": "math-ph", "title": "Global exponential stability for the three-dimensional Navier-Stokes equations on hyperbolic space", "abstract": "We prove that the three-dimensional incompressible Navier-Stokes equations with the deformation Laplacian on hyperbolic 3-space $\\HH^3$ admit a unique global mild solution for sufficiently small initial data in $L^3(\\HH^3)$, and that this solution decays exponentially to zero. The exponential decay rate is $\\mu\\lambda_\\Def^{(3)}$, where $\\mu$ is the dynamic viscosity and $\\lambda_\\Def^{(3)} = 26/9$ is the effective spectral gap of the deformation Laplacian in $L^3$. On flat $\\R^3$, the corresponding Kato-type result gives only algebraic decay. The exponential stability is a macroscopic consequence of the spectral gap provided by negative curvature. We also show that the $L^2$ norm is supercritical on $\\HH^3$ (as on $\\R^3$), with the obstruction arising from the local ultraviolet scaling of the heat kernel, which is insensitive to global geometry. The boundary between what curvature can and cannot improve is located exactly: the Fujita-Kato integral has a scaling exponent $1/2 - 3/(2p)$ that depends only on the integrability of the initial data, not on the geometry of the manifold. For $p \\geq 3$ (the Kato critical space), the integral is bounded and the spectral gap contributes exponential time decay. For $p < 3$, the integral diverges at $t = 0$ (and strictly diverges for all $t>0$ when $p \\le 2$) regardless of the curvature.", "url": "https://arxiv.org/abs/2605.22212", "type": "理论", "summary": "1. 该工作证明了三维双曲空间H^3上Navier-Stokes方程在变形拉普拉斯作用下小初始数据的全局温和解指数衰减，衰减率μλ_Def^{(3)} (λ_Def^{(3)}=26/9)由负曲率谱间隙决定。\n2. 核心卖点在于负曲率将平坦空间代数衰减改进为指数衰减，并精确划定曲率作用的边界：仅当初始数据处于Kato临界空间(p≥3)时谱间隙有效，p<3时短时发散对曲率不敏感。\n3. 这为曲率调控流体长时间稳定性提供了严格数学框架，且超临界L^2范数与热核紫外标度不变性表明局部湍流行为不受全局几何影响，启发弯曲流形上耗散系统的普适性研究。", "summary_source": "deepseek", "authors": [{"name": "Zhi-Wei Wang"}, {"name": "Samuel L. Braunstein"}], "featured_authors": [{"name": "Zhi-Wei Wang"}, {"name": "Samuel L. Braunstein"}], "author_count": 2}, {"id": "2605.22436", "category": "math-ph", "title": "A perturbative approach to the Wetterich equation for Bosonic and Fermionic interacting fields", "abstract": "We study the Lorentzian Wetterich Renormalization Group (RG) flow equation for interacting quantum fields on curved backgrounds within the framework of perturbative Algebraic Quantum Field Theory (pAQFT). Specifically, we consider two classes of models: two mutually interacting scalar fields on globally hyperbolic spacetimes without boundary and, under the further assumption that the underlying background is spin, self-interacting Dirac fields. In both cases, we derive the corresponding RG flow equations within a Local Potential Approximation and compute the beta functions for the relevant couplings. For the scalar model, we also discuss an asymmetric interaction potential which is formally reminiscent of the Martin-Siggia-Rose description of a stochastic dynamics, thereby indicating a possible connection between Lorentzian algebraic RG methods [DDP+24] and stochastic field-theoretic models, [Duc25]. In addition, we address the local well-posedness of the resulting flow equations. Adapting the strategy detailed in [DP23] and based on the the Nash-Moser theorem, we prove local existence and uniqueness of solutions for both the scalar and the Dirac models.", "url": "https://arxiv.org/abs/2605.22436", "type": "理论", "summary": "1. 该工作利用微扰代数量子场论框架，在弯曲时空背景下导出了相互作用的玻色子与费米子场的Wetterich重整化群流方程。\n2. 在局域势近似下，解析计算了标量场与狄拉克场模型的beta函数，并基于Nash-Moser定理证明了流方程的局部适定性与解的唯一性。\n3. 标量模型中的非对称相互作用势与Martin-Siggia-Rose随机动力学表述的相似性，暗示了Lorentzian代数RG方法与随机场论之间的可能联系。", "summary_source": "deepseek", "authors": [{"name": "Beatrice Costeri"}], "featured_authors": [{"name": "Beatrice Costeri"}], "author_count": 1}, {"id": "2605.21562", "category": "quant-ph", "title": "Optimal Quantum Feshbach Engines", "abstract": "We develop an optimization framework for high-efficiency quantum cycles implemented with a trapped Bose-Einstein condensate, whose control parameters are the trap stiffness and the interaction strength tuned via a Feshbach resonance. Optimal driving protocols for each stroke of the cycle are obtained from a variational description of the condensate dynamics combined with Nelson's stochastic quantization, which maps the quantum evolution onto an effective Ornstein-Uhlenbeck process. The optimal protocol is obtained by minimizing a user-defined cost functional that selects the best trade-off between protocol duration and arbitrary physical constraints (such as the expended work or the proximity to an adiabatic evolution), and exhibits remarkable stability over repeated cycles. The method also provides a systematic route to optimal control for generic nonlinear Schrödinger equations, paving the way to optimal control strategies in fields as diverse as nonlinear optics, quantum fluids, and quantum plasmas.", "url": "https://arxiv.org/abs/2605.21562", "type": "理论+数值", "summary": "1. 该工作发展了针对囚禁玻色-爱因斯坦凝聚体中量子热机循环的最优控制框架，控制参数为阱刚度与Feshbach共振调制的相互作用强度。\n2. 其技术核心在于将凝聚体动力学变分描述与Nelson随机量子化结合，将量子演化映射为有效Ornstein-Uhlenbeck过程，并通过用户定义成本函数最小化实现协议时长与物理约束的最佳折衷。\n3. 该方法可推广至一般非线性薛定谔方程的最优控制问题，为非线性光学、量子流体及量子等离子体等领域提供系统性调控策略。", "summary_source": "deepseek", "authors": [{"name": "Aaron Wandhammer"}, {"name": "Vincent Hardel"}, {"name": "Paul-Antoine Hervieux"}, {"name": "Giovanni Manfredi"}], "featured_authors": [{"name": "Aaron Wandhammer"}, {"name": "Vincent Hardel"}, {"name": "Paul-Antoine Hervieux"}, {"name": "Giovanni Manfredi"}], "author_count": 4}, {"id": "2605.21570", "category": "quant-ph", "title": "Quantum Purity Amplification for Arbitrary Eigenstates and Multiple Outputs", "abstract": "Quantum purity amplification (QPA) is the task of coherently transforming $n$ copies of a mixed state into high-fidelity copies of a chosen eigenstate. We solve QPA in the general setting of $n$ input copies, $m$ output copies, arbitrary target eigenstates, arbitrary local dimension $d$, and generic input spectra. We characterize the optimal channel and derive its all-site and one-site performance laws across output regimes. For the asymptotic analysis, we use a path-graph parametrization to show that, when the target eigenvalue has a constant spectral gap $D_{k,\\mathrm{min}}$, achieving all-site error $\\varepsilon$ requires a number of input copies independent of $d$ and scaling as $O(m/(\\varepsilon D_{k,\\mathrm{min}}^2))$. When $m/n$ approaches a constant, the performance exhibits phase-like regimes, which we characterize explicitly. For the nonasymptotic analysis, we develop a theory of generalized Young diagrams that yields tight sample complexity bounds and provides the first dimension-uniform guarantee for optimal QPA. We also provide asymptotically efficient implementations of the optimal protocol. Together, these results establish QPA as a rigorous example of coherent quantum information processing with dimension-uniform sample complexity, supplying the technical foundation for the coherent-incoherent separation developed in the companion work.", "url": "https://arxiv.org/abs/2605.21570", "type": "理论", "summary": "1. 该工作从理论上完整求解了一般量子纯度放大问题，处理任意本征态、任意输出副本数及局域维度，刻画了最优信道及其全域与单点性能律。\n2. 主要技术突破在于利用路径图参数化导出渐近分析中与维度无关的样本复杂度，并发展广义杨图理论给出非渐近紧致界，首次实现维数均匀的优化保证。\n3. 这项工作将量子纯度放大确立为具有维数均匀样本复杂度的相干量子信息处理严格范例，为在普适输入下区分相干与非相干协议奠定了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Zhaoyi Li"}, {"name": "Elias Theil"}, {"name": "Aram W. Harrow"}, {"name": "Isaac Chuang"}], "featured_authors": [{"name": "Zhaoyi Li"}, {"name": "Elias Theil"}, {"name": "Aram W. Harrow"}, {"name": "Isaac Chuang"}], "author_count": 4}, {"id": "2605.21597", "category": "quant-ph", "title": "Matrix Product Operator Encodings of the Magnus Expansion and Dyson Series", "abstract": "We introduce a matrix product operator (MPO) encoding of the Magnus expansion and the Dyson series for one-dimensional quantum lattice models with time-dependent Hamiltonians. The MPO construction can be made accurate up to arbitrary order in the time step, it can be applied to both finite and infinite systems, and it can handle long-range interactions. The resulting MPO can be combined with state-of-the-art time evolution algorithms based on matrix product states, allowing for drastic improvements in simulating evolution under time-dependent Hamiltonians. Our MPO construction can also be used for the optimization of quantum circuits in the context of quantum simulation of time-dependent Hamiltonians.", "url": "https://arxiv.org/abs/2605.21597", "type": "理论+数值", "summary": "1. 本文提出对含时哈密顿量一维量子晶格模型的Magnus展开和Dyson级数进行矩阵乘积算子编码。\n2. 该编码可精确到时间步长的任意阶，适用于有限与无限系统，能处理长程相互作用，并与基于矩阵乘积态的时间演化算法结合。\n3. 该构造可用于含时哈密顿量量子模拟中量子电路的优化，为提升模拟效率提供可行途径。", "summary_source": "deepseek", "authors": [{"name": "Victor Vanthilt"}, {"name": "Maarten Van Damme"}, {"name": "Jutho Haegeman"}, {"name": "Ian P. McCulloch"}, {"name": "Laurens Vanderstraeten"}], "featured_authors": [{"name": "Victor Vanthilt"}, {"name": "Maarten Van Damme"}, {"name": "Jutho Haegeman"}, {"name": "Ian P. McCulloch"}, {"name": "Laurens Vanderstraeten"}], "author_count": 5}, {"id": "2605.21643", "category": "quant-ph", "title": "Balancing Quasi-Bragg Regime and Velocity Selectivity in Quantum-Enhanced Atom Interferometry", "abstract": "Spin squeezing in atomic ensembles enables atom interferometry with sensitivities below the shot-noise limit, but the associated entanglement is highly susceptible to loss, making imperfections in atom optics a central limitation. Bragg diffraction is an established technique for driving transitions between atomic momentum states and enables large-momentum transfer through higher-order diffraction while preserving the internal state. However, it is intrinsically limited by two competing mechanisms: short light pulses induce parasitic diffraction into off-resonant orders beyond an effective two-level description, while long pulses face velocity selectivity. We derive analytical expressions in a second-quantized framework for the atom optics and phase uncertainty of a Mach-Zehnder interferometer including these effects. We demonstrate that sub-shot-noise scaling is achieved only in a regime of intermediate pulse duration. Furthermore, we show that deleterious effects of higher-order diffraction are partially mitigated by optimizing the input quantum state.", "url": "https://arxiv.org/abs/2605.21643", "type": "理论+数值", "summary": "1. 该工作在二次量子化框架下推导了包含准布拉格衍射与速度选择性竞争机制的原子光学及相位不确定度解析表达式。\n2. 其核心在于揭示了仅当脉冲持续时间为中间值时才可突破散粒噪声极限，并证明了优化输入量子态能部分抑制高阶寄生衍射。\n3. 这为设计兼具大动量转移与强抗损失能力的量子增强原子干涉仪提供了明确的参数调控与态制备指导。", "summary_source": "deepseek", "authors": [{"name": "Christian Miguel Karres"}, {"name": "Daniel Derr"}, {"name": "Enno Giese"}], "featured_authors": [{"name": "Christian Miguel Karres"}, {"name": "Daniel Derr"}, {"name": "Enno Giese"}], "author_count": 3}, {"id": "2605.21662", "category": "quant-ph", "title": "Fidelity-Aware Frequency Allocation and Transpilation Co-Design for Tunable Coupler Quantum Systems", "abstract": "Frequency crowding is a fundamental limitation in superconducting quantum architectures, particularly in tunable-coupler systems. We present a framework that explicitly models both coherent spectator-induced errors and incoherent lifetime effects through an error budgeting approach. Using this model, we analyze how frequency crowding impacts gate fidelity as module size and connectivity scale, and formulate a constrained optimization problem to assign qubit and coupler frequencies under realistic separation and hardware constraints. We demonstrate scalable frequency allocation strategies that minimize spectator-induced errors. We further show that increasing qubit count and coupling density within a module leads to a fidelity-connectivity tradeoff. To explore the benefits at the system scale, we have developed a noise-aware transpilation approach called FINESSE, which minimizes error by selecting high-fidelity paths that satisfy connectivity via SWAP insertion while jointly optimizing downstream gate execution. We demonstrate this physics-informed architecture-transpilation co-design approach for a SNAIL-based third-order coupler that natively realizes the $\\sqrt{iSWAP}$ basis with frequency aware gate fidelities. On SNAIL architectures, FINESSE achieves an average 8.9% reduction in log-infidelity cost and 6.8% reduction in circuit depth vs. SABRE. We also compare results on IBM Brisbane's architecture.", "url": "https://arxiv.org/abs/2605.21662", "type": "理论+数值", "summary": "1. 该工作针对可调耦合器超导量子系统，提出了一个协同设计框架，同时优化频率分配与噪声感知的转译过程，以缓解频率拥挤导致的保真度下降。\n2. 其核心在于通过误差预算显式建模相干旁观者诱导误差与退相干寿命效应，并制定约束优化分配频率，进而开发FINESSE转译算法以选择高保真路径并联合优化门执行。\n3. 这为可扩展超导量子模块中频率-连接性权衡的定量管理，以及架构与编译的协同优化提供了明确指导，有助于提升大规模系统保真度。", "summary_source": "deepseek", "authors": [{"name": "Dylan VanAllen"}, {"name": "Evan McKinney"}, {"name": "Israa G. Yusuf"}, {"name": "Girgis Falstin"}, {"name": "Gaurav Agarwal"}, {"name": "Jason Pollack"}, {"name": "Michael Hatridge"}, {"name": "Alex K. Jones"}], "featured_authors": [{"name": "Dylan VanAllen"}, {"name": "Evan McKinney"}, {"name": "Israa G. Yusuf"}, {"name": "Jason Pollack"}, {"name": "Michael Hatridge"}, {"name": "Alex K. Jones"}], "author_count": 8}, {"id": "2605.21664", "category": "quant-ph", "title": "A journey through Flatland: What does the antiflatness of a spectrum teach us?", "abstract": "We explore the concept of antiflatness to characterize the structural fluctuations within the entanglement spectrum of a quantum state (i.e., the spectrum of its reduced density operator). As a measure of the interplay between entanglement and magic, two fundamental quantum resources, antiflatness provides second-order information about quantum correlations that standard average measures fail to capture. Recognizing that standard majorization theory fundamentally orders states by purity and is structurally blind to spectral fluctuations, we introduce a novel partial ordering known as antiflat majorization, based on the Rényi entropy spread. We define Flatness-Preserving Operations (FPOs), establishing new necessary conditions for state convertibility. Furthermore, we unify different measures of antiflatness-such as Capacity of Entanglement, Linear Rényi spread, and Logarithmic antiflatness-using the frameworks of escort distributions and Bregman divergences. We prove that the Capacity of Entanglement can be expressed as a second derivative of the Kullback-Leibler divergence along the escort trajectory, connecting it with the Quantum Fisher Information. Finally, we demonstrate that absolute maximal antiflatness is not achieved by a single universal state, but rather by a continuous Pareto frontier of extremal states with jump spectra, and we analyze the typicality of these spectral fluctuations using Haar, Bures-Hall and t-doped Clifford random state ensembles.", "url": "https://arxiv.org/abs/2605.21664", "type": "理论", "summary": "1. 该工作提出反平坦度概念，用以刻画量子态纠缠谱的结构涨落，并引入基于Rényi熵展宽的反平坦序关系与保平坦操作。\n2. 其技术核心在于将纠缠容量表示为Kullback-Leibler散度沿伴生轨迹的二阶导数，从而连接量子Fisher信息，并证明绝对最大反平坦度由连续Pareto前沿上的跳跃谱态实现。\n3. 这为超越标准平均度量的纠缠与魔法资源互作用提供了二阶关联信息，同时建立了态可转换性的新必要条件，启发对谱涨落典型性的随机系综分析。", "summary_source": "deepseek", "authors": [{"name": "Barbara Jasser"}, {"name": "Daniele Iannotti"}, {"name": "Alioscia Hamma"}], "featured_authors": [{"name": "Barbara Jasser"}, {"name": "Daniele Iannotti"}, {"name": "Alioscia Hamma"}], "author_count": 3}, {"id": "2605.21756", "category": "quant-ph", "title": "Towards a quantum decision tree in a laser pumped four-level system", "abstract": "In this study, we examine an innovative framework towards implementing quantum decision trees utilizing a laser-driven four-level system. We discuss a diamond-shaped atomic configuration, in which we apply Lie-algebraic formalisms to analyze the dynamics of the system. The system is perturbed by a Stokes pulse, represented as $\\beta_j(t)$ (for $j=1,2$), which interacts with the atomic states $|0\\rangle, |3\\rangle$ and $|1\\rangle, |2\\rangle$. In addition, a pump laser, denoted as $\\alpha_j(t)$, couples the states $|0\\rangle, |1\\rangle$ and $|2\\rangle, |3\\rangle$. By employing pulse profiles that possess identical temporal behavior but differ in amplitude, one can effectively redistribute the population from the initial ground state to the other energy levels. This technique facilitates the mimicry of a quantum decision tree. We highlight that the proposed methodology is scalable to N-level systems, enhancing its adaptability and potential utility in quantum computing and various decision-making applications. We introduce a novel framework for implementing quantum decision trees using a four-level laser-driven atomic system. Employing a diamond-shaped energy configuration, we analyze system dynamics through Lie-algebraic methods. Using pulse profiles with identical temporal structures but varying amplitudes, we achieve controlled population redistribution among energy levels, effectively simulating a quantum decision tree. This methodology is scalable to systems of \\(N\\) levels, offering potential applications in quantum computing and decision-making processes.", "url": "https://arxiv.org/abs/2605.21756", "type": "理论", "summary": "1. 该工作利用激光驱动的四能级系统构建了一个实现量子决策树的创新框架。\n2. 其技术核心在于采用钻石型能级配置，借助李代数方法分析动力学，并通过时间结构相同但振幅不同的脉冲序列实现受控布居数再分布。\n3. 该方案可扩展至N能级系统，为量子计算与决策过程中的可扩展量子算法设计提供了新路径。", "summary_source": "deepseek", "authors": [{"name": "Dawit Hailuf Hailu"}], "featured_authors": [{"name": "Dawit Hailuf Hailu"}], "author_count": 1}, {"id": "2605.21791", "category": "quant-ph", "title": "Completeness of the Klein-Gordon oscillator eigenfunctions via Hermite and Laguerre polynomials", "abstract": "Completeness of the Klein--Gordon oscillator eigenfunctions is proved in one and three spatial dimensions. The proofs establish the closure relations satisfied by the eigenfunctions and are based on standard properties of the Hermite and the generalized Laguerre polynomials, supplemented in three dimensions by the completeness of the spherical harmonics. The scalar nature of the Klein--Gordon field renders the argument strictly simpler than the analogous proof for the Dirac oscillator: no off-diagonal cancellation is required.", "url": "https://arxiv.org/abs/2605.21791", "type": "理论", "summary": "1. 该工作证明了克莱因-戈登振荡器在一维与三维空间中本征函数系的完备性。\n2. 其技术要点在于仅依赖厄米特多项式与广义拉盖尔多项式的标准闭合关系，并借助球谐函数完备性，因标量场性质而无需如狄拉克振荡器那样进行非对角项对消。\n3. 这一简洁论证为相对论性量子力学中振荡器模型的完备性证明提供了可推广的框架，对类似标量场问题的数学处理具有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Kevin Hernández"}], "featured_authors": [{"name": "Kevin Hernández"}], "author_count": 1}, {"id": "2605.21867", "category": "quant-ph", "title": "Zero-level $CCZ$ Distillation", "abstract": "Magic state distillation is a key component of fault-tolerant quantum computation, as it enables the implementation of non-Clifford gates such as the $T$ gate and the $CCZ$ gate via gate teleportation. However, conventional distillation protocols require a large number of logical qubits and introduce substantial spatial and temporal overhead, posing a significant bottleneck for scalable fault-tolerant quantum computation. In this work, we propose a zero-level distillation protocol that efficiently generates a high-fidelity logical $CCZ$ magic state using only physical qubits on a two-dimensional square lattice with nearest-neighbor interactions. Our method leverages the transversal $T/T^\\dagger$ operation of the $[[ 8,3,2 ]]$ code to fault-tolerantly encode the state $\\overline{CCZ}|+++\\rangle$, which is subsequently teleported to three surface-code logical qubits via lattice surgery. To enable teleportation between codes with different distances, we introduce adaptively initialized teleportation (AIT), a tailored initialization procedure for the surface code. Numerical simulations demonstrate that the logical error rate scales as $p_L \\simeq 300 \\times p^2$ with respect to the physical error rate $p$. For example, the proposed method improves the logical error rate by approximately one and two orders of magnitude at $p = 10^{-3}$ and $p = 10^{-4}$, respectively, compared to conventional seven-$T$-gate approaches. The distillation circuit requires only 22 physical qubits, 3 logical qubits, and a circuit depth of 24, reducing the space-time overhead by a factor of approximately 5-10 compared to previous methods. This result highlights the practicality of $CCZ$-state distillation in early fault-tolerant quantum computation and offers a new direction toward resource-efficient physical-level magic state distillation beyond conventional $T$-state generation.", "url": "https://arxiv.org/abs/2605.21867", "type": "理论+数值", "summary": "1. 该工作提出一种零级CCZ幻态蒸馏协议，仅用物理量子比特在二维正方晶格上通过最近邻相互作用高效生成高保真逻辑CCZ态。\n2. 其核心技术是利用[[8,3,2]]码的横向T/T†操作容错地编码态，并引入自适应初始化隐形传态（AIT）实现不同距离码间的表面码逻辑量子比特传输，使逻辑错误率按~300×p²随物理错误率p缩放。\n3. 本方法仅需22个物理量子比特、3个逻辑量子比特和24层电路深度，时空开销较传统方案降低约5–10倍，为早期容错量子计算中资源高效的物理级幻态蒸馏开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Tomohiro Itogawa"}, {"name": "Yutaka Hirano"}, {"name": "Yutaro Akahoshi"}, {"name": "Keisuke Fujii"}], "featured_authors": [{"name": "Tomohiro Itogawa"}, {"name": "Yutaka Hirano"}, {"name": "Yutaro Akahoshi"}, {"name": "Keisuke Fujii"}], "author_count": 4}, {"id": "2605.21960", "category": "quant-ph", "title": "dSABRE: A SABRE-Style Router for Multi-Core Distributed Quantum Computers", "abstract": "Minimising EPR consumption is the dominant objective when routing a quantum circuit on a distributed quantum computer (DQC). We present dSABRE, a SABRE-style router for multi-core processors that, on each iteration of a lookahead-driven loop, first resolves any intra-core front-layer gates by SWAP scoring and only falls back to scoring inter-core teleportation candidates when the intra-core front is empty. Three mechanisms drive the improvement over the state of the art: a five-term gate-centric teleportation score that generalises the local SWAP heuristic to the inter-core setting, whose explicit capacity-penalty term keeps the scorer from teleporting into saturated cores; a proactive congestion-relief pass that redistributes idle qubits out of high-demand cores before deadlock; and a BFS-layer construction of the inter-core extended set that respects DAG dependencies layer by layer rather than mixing wires in topological order. Across 18 MQT-Bench circuits at 25, 36, and 64 logical qubits, dSABRE reduces geometric-mean EPR consumption by 41-44% over TeleSABRE and by 16-68% over the gate-teleportation-based pytket-dqc, using standard Qiskit SabreLayout for the initial layout. A large-circuit QFT sweep at 100-360 qubits confirms scalability. Code and online appendices are available at this https URL .", "url": "https://arxiv.org/abs/2605.21960", "type": "理论", "summary": "1. 该工作提出面向多核分布式量子计算机的SABRE风格布线器dSABRE，采用前瞻驱动循环优先解析核内前端层门再处理核间隐形传态。\n2. 其技术卖点包括三项机制：五项门中心隐形传态评分引入容量惩罚项避免过饱和、主动拥塞缓解重分布空闲量子比特、BFS层构建核间扩展集尊重DAG依赖。\n3. 这为大规模分布式量子电路布线提供了显著降低EPR消耗（在18个基准电路上几何平均降低41–68%）且可扩展的实用方案。", "summary_source": "deepseek", "authors": [{"name": "Sanjiang Li"}], "featured_authors": [{"name": "Sanjiang Li"}], "author_count": 1}, {"id": "2605.22150", "category": "quant-ph", "title": "Unified entropy entanglement", "abstract": "The unified entropy as a promotion of the von Neumann entropy exhibits distinct diversity which contains the Tsallis entropy, the Rényi entropy, the von Neumann entropy as special cases. The unified-($r,t$) entropy entanglement with $0<r<1$ and $0< t\\leq 1$ was shown to be an entanglement monotone in literature. In this paper, we explore unified-($q,s$) entropy entanglement with $q>1$ and $qs\\geq1$ and show that it is also an entanglement monotone and that both of them are monogamous. Going further, we present two kinds of global multipartite entanglement measures (GlMEMs) based on the unified entropy and each kind has two subclasses which are classified by the parameters $(q,s)$ and $(r,t)$. Consequently, from the view of the complete multipartite entanglement measure theory, we show that one of them is a complete multipartite entanglement monotone and is not only completely monogamous but also tightly completely monogamous, but the other three are even not complete. We also explore the genuine entanglement measures induced by the unified entropy and the relations with the bipartite entanglement and the global entanglement are discussed, respectively.", "url": "https://arxiv.org/abs/2605.22150", "type": "理论", "summary": "1. 该文研究统一(q,s)熵纠缠在q>1且qs≥1参数区域内的单调性与单配性，并基于统一熵提出两类全局多体纠缠度量。\n2. 技术核心在于证明该区域纠缠也是纠缠单调且单配的，并指出其中一类全局度量是完整多体纠缠单调且紧密完全单配，而另三类则不完整。\n3. 这为完善多体纠缠度量理论提供了参数化的分类框架，并明确了不同纠缠度量在完整性和紧单配性上的差异。", "summary_source": "deepseek", "authors": [{"name": "Wenxue Ren"}, {"name": "Binghao Li"}, {"name": "Ruiqun Niu"}, {"name": "Yu Guo"}, {"name": "Shuanping Du"}], "featured_authors": [{"name": "Wenxue Ren"}, {"name": "Binghao Li"}, {"name": "Ruiqun Niu"}, {"name": "Yu Guo"}, {"name": "Shuanping Du"}], "author_count": 5}, {"id": "2605.22218", "category": "quant-ph", "title": "Three sins against physics by an exaggerated quantum information perspective", "abstract": "I point out three ways in which the perspective of quantum information may lead to distorted claims about physics: forgetting that light does not need to be quantised to show coherence; ignoring the generators of unitary evolutions; and approaching the discovery of nature as a fight against an adversary.", "url": "https://arxiv.org/abs/2605.22218", "type": "理论", "summary": "1. 该论文指出了量子信息视角在物理学中可能引发的三种认知偏差：混淆相干性与光量子化、忽视幺正演化生成元、以及将探索自然视为对抗对手。\n2. 其核心是针对量子信息语言过度诠释物理的批判，强调经典相干性、演化动力学机制及科学态度的重要性。\n3. 这为量子信息与基础物理的交叉研究提供了方法论警示，有助于避免非物理的误导性主张。", "summary_source": "deepseek", "authors": [{"name": "Valerio Scarani"}], "featured_authors": [{"name": "Valerio Scarani"}], "author_count": 1}, {"id": "2605.22226", "category": "quant-ph", "title": "Geometric Construction of Optimal Teleportation Witnesses", "abstract": "Not all entangled states are useful for quantum teleportation. We present a geometric method to construct optimal teleportation witnesses, which provide operational necessary and sufficient criteria for identifying the teleportation usefulness of arbitrary two-qudit entangled states. Specifically, by developing a two-layer iterative cutting-plane algorithm to solve the shortest distance problem from the target state $\\rho$ to the convex set $S$ of useless states, we obtain the projection point $\\sigma^* \\in S$ and then construct the optimal teleportation witness from the projection geometry. Moreover, the shortest distance $D(\\rho)$ obtained during this construction also serves as a necessary and sufficient criterion for usefulness. We apply our method to identify the teleportation usefulness of three classes of entangled states.", "url": "https://arxiv.org/abs/2605.22226", "type": "理论+数值", "summary": "1. 该工作提出了一种几何方法构建最优隐形传态见证者，以充要条件判定任意两量子位纠缠态是否具有隐形传态实用性。\n2. 其核心是通过两层迭代切割平面算法求解目标态至无用态凸集的最短距离，基于投影几何构造见证者，且该距离本身即为充要判据。\n3. 这为纠缠态实用性判定提供了可操作的几何框架，并可望推广至其他量子信息任务的态分类与资源理论问题。", "summary_source": "deepseek", "authors": [{"name": "Yanning Jia"}, {"name": "Fenzhuo Guo"}, {"name": "Mengxuan Bai"}, {"name": "Mengyan Li"}, {"name": "Haifeng Dong"}, {"name": "Fei Gao"}], "featured_authors": [{"name": "Yanning Jia"}, {"name": "Fenzhuo Guo"}, {"name": "Mengxuan Bai"}, {"name": "Mengyan Li"}, {"name": "Haifeng Dong"}, {"name": "Fei Gao"}], "author_count": 6}, {"id": "2605.22267", "category": "quant-ph", "title": "Emulation of Optically Interconnected Quantum Data Centers Topologies for Cost-Fidelity Benchmarking", "abstract": "We emulate optically interconnected quantum processors in ring, star, and line topologies using a quantum computer. GHZ benchmarks show that the star provides the best trade-off between cost and fidelity under transduction and fiber noise.", "url": "https://arxiv.org/abs/2605.22267", "type": "理论", "summary": "1. 该工作利用量子计算机模拟了环形、星形和线形三种光互连量子数据中心拓扑结构。\n2. 其核心在于通过GHZ态基准测试，发现星形拓扑在量子转换与光纤噪声下实现了成本与保真度的最优权衡。\n3. 这为可扩展量子网络架构的拓扑选择与资源分配提供了明确的实验基准与设计指导。", "summary_source": "deepseek", "authors": [{"name": "Seyed Navid Elyasi"}, {"name": "Seyed Morteza Ahmadian"}, {"name": "Rui Lin"}, {"name": "Paolo Monti"}], "featured_authors": [{"name": "Seyed Navid Elyasi"}, {"name": "Seyed Morteza Ahmadian"}, {"name": "Rui Lin"}, {"name": "Paolo Monti"}], "author_count": 4}, {"id": "2605.22276", "category": "quant-ph", "title": "Asymmetric quantum Rabi model, trap-dipole resonance, and quantum gates with optically trapped ultracold polar molecules", "abstract": "Optically trapped ultracold polar molecules can have multiple long-lived states for coding quantum information, and can exhibit electric dipole-dipole interactions~(DDI) which enables entanglement generation. The general understanding on the quantized motion~(QM) of molecules in the traps is that it causes fluctuation of DDI. Here, we find that the molecular QM can realize an asymmetric quantum Rabi model, which is of specific importance in the study of fundamental physics. The molecular QM can also lead to an exotic trap-dipole resonance, resulting in excess population loss to uncoupled motional states, and, hence, should be avoided in a general quantum control over polar molecules. To examine the impact of QM on quantum computing based on polar molecules, we introduce two gate protocols, a fast iSWAP gate which can be realized by a global microwave pulse of pulse area smaller than $2\\pi$, and a controlled-phase gate with an arbitrary controlled phase, and find that both gates can attain a high fidelity.", "url": "https://arxiv.org/abs/2605.22276", "type": "理论", "summary": "1. 该工作研究光阱超冷极性分子量化运动对量子门的影响，发现其可实现非对称量子Rabi模型并导致阱-偶极共振。\n2. 核心发现是分子量化运动既能因共振引起非耦合态粒子损失而需避免，又能支撑高保真度iSWAP门与任意可控相位门。\n3. 这为理解量化运动在极性分子量子信息中的双重角色提供了关键机制，并明确了实际量子控制需规避的损耗通道。", "summary_source": "deepseek", "authors": [{"name": "Yan Lu"}, {"name": "Xiao-Feng Shi"}], "featured_authors": [{"name": "Yan Lu"}, {"name": "Xiao-Feng Shi"}], "author_count": 2}, {"id": "2605.22424", "category": "quant-ph", "title": "Long-range nonstabilizerness of topologically encoded states from mutual information", "abstract": "We study long-range nonstabilizerness (LRN), namely the obstruction to remove nonstabilizerness with shallow-depth local quantum circuits. In one-dimensional settings, the mutual information between disconnected spatial regions has proven to be a powerful tool to diagnose LRN. In this work, we focus on encoded states of two-dimensional topologically-ordered systems, and explore the ability of the mutual information to serve as a diagnostic of LRN. Focusing on the concrete setting of lattice models defined on a torus, we show that information about LRN can be gained from the analysis of the mutual information between non-overlapping regions containing non-contractible loops, and of the change of such mutual information under modular real-space transformations. We exemplify this idea in the toric code and the non-abelian string-net model with doubled Fibonacci topological order. In the former case, we show that the mutual information provides a full classification, certifying LRN for all encoded non-stabilizer states. In the latter case, instead, our approach does not lead to a full classification, as it detects LRN for all states except from a finite subset with special transformation properties under the modular group. Finally, we discuss how our results on LRN constrain the logical gates that can be implemented fault-tolerantly on the torus.", "url": "https://arxiv.org/abs/2605.22424", "type": "理论", "summary": "1. 该工作利用互信息诊断二维拓扑序编码态的长程非稳定化（LRN），并针对环面晶格模型展开分析。\n2. 其卖点在于通过非平凡环路区域的互信息及其模变换行为，在toric code中实现LRN完全分类，在非阿贝尔模型中检测除有限子集外的所有态。\n3. 这为拓扑编码中容错逻辑门的实现提供了约束，并启发基于互信息的LRN诊断方法向更广拓扑序推广。", "summary_source": "deepseek", "authors": [{"name": "David Aram Korbany"}, {"name": "Tyler D. Ellison"}, {"name": "David T. Stephen"}, {"name": "Lorenzo Piroli"}], "featured_authors": [{"name": "David Aram Korbany"}, {"name": "Tyler D. Ellison"}, {"name": "David T. Stephen"}, {"name": "Lorenzo Piroli"}], "author_count": 4}, {"id": "2605.22439", "category": "quant-ph", "title": "Minimal Permutation-Invariant Qudit Codes from Edge-Colorings of Complete Graphs", "abstract": "We study permutation-invariant quantum codes in the symmetric subspace $\\mathrm{Sym}^n(\\mathbb{C}^q) $ of $n$ qudits of local dimension $q$. For every integer $q\\geq 2$, we construct a permutation-invariant code with parameters $((4,q,2))_q$. Thus four physical qudits suffice to encode one logical qudit with distance two in the symmetric sector for every local dimension. We also show, using linear-programming constraints for permutation-invariant quantum codes, that no permutation-invariant code of dimension $q$ and distance at least $2$ exists in $\\mathrm{Sym}^n(\\mathbb{C}^q)$ for $n\\leq 3$. Hence four qudits are necessary and sufficient. The construction has a simple representation-theoretic and combinatorial description. In the irreducible $\\mathrm{SU}(q)$-module $\\mathrm{Sym}^4(\\mathbb{C}^q)$, the distance-two Knill-Laflamme conditions split into root and Cartan parts. By restricting supports to the even-entry occupation layer, all root-error conditions vanish automatically. The remaining Cartan conditions reduce to linear balancing constraints on packets of occupation vectors. These packets admit a natural graph-theoretic interpretation in terms of the vertices and edges of the complete graph $K_q$: for odd $q$, they are organized by the midpoint rule, while for even $q$, they are organized by a decomposition of $K_q$ into perfect matchings. In this way, the existence of minimal $((4,q,2))_q$ permutation-invariant codes is reduced to a parity-dependent edge-coloring problem on $K_q$.", "url": "https://arxiv.org/abs/2605.22439", "type": "理论", "summary": "1. 该工作构造了局部维度为 \\(q\\) 的 \\(((4,q,2))_q\\) 置换不变量子码，并证明四物理量子位是最小充分必要条件。\n2. 其技术核心在于将Knill-Laflamme条件转化为完全图 \\(K_q\\) 上依赖于奇偶性的边染色约束，通过奇偶性分解为完美匹配来消除根误差。\n3. 这一图论编码方法为对称子空间量子纠错码的设计提供了组合学新途径，可望推广至其他距离或对称结构。", "summary_source": "deepseek", "authors": [{"name": "Eric Kubischta"}, {"name": "Ian Teixeira"}], "featured_authors": [{"name": "Eric Kubischta"}, {"name": "Ian Teixeira"}], "author_count": 2}, {"id": "2605.22459", "category": "quant-ph", "title": "Reduced Dynamical Maps in Finite Temperature Vibronic Coupling Models via Choi Matrices: Numerical Methods and Applications", "abstract": "We present a streamlined implementation of a computational framework for constructing and analyzing reduced dynamical maps for complex system--bath models at finite temperature. The methodology is based on three established ingredients of quantum dynamics: the Choi--Jamiołkowski isomorphism for the representation of quantum channels, thermofield (TFD) purification of thermal environments, and tensor-train (TT) propagation of the resulting enlarged pure state. The reduced map is obtained from a single unitary propagation in a thermofield-doubled Hilbert space and represented in matrix form through the Choi--Jamiołkowski isomorphism. The TFD evolution is implemented in the TT representation, enabling efficient propagation of high-dimensional purified thermal states. We illustrate the methodology for exciton transfer in the Fenna--Matthews--Olson complex with site-dependent structured spectral densities represented by discretized bosonic environments. The resulting maps are used to analyze decoherence, relaxation, and finite-memory effects, and to assess the crossover to an effectively time-local description. The proposed approach provides a route to compute reduced propagators and to post-process them into memory kernels, transfer tensors, and effective kinetic rate descriptions for complex molecular systems.", "url": "https://arxiv.org/abs/2605.22459", "type": "理论+数值", "summary": "1. 该工作基于Choi-Jamiołkowski同构、热场纯化与张量列传播，构建了有限温度振动耦合模型约化动力学映射的数值框架。\n2. 其技术核心在于通过单次热场加倍空间幺正演化直接获取约化映射矩阵，并利用张量列表示高效处理高维纯化热态。\n3. 这为从约化传播子提取记忆核、转移张量并分析退相干与弛豫交叉行为提供了定量路径。", "summary_source": "deepseek", "authors": [{"name": "Raffaele Borrelli"}, {"name": "Hideaki Takahashi"}], "featured_authors": [{"name": "Raffaele Borrelli"}, {"name": "Hideaki Takahashi"}], "author_count": 2}, {"id": "2605.22463", "category": "quant-ph", "title": "Reinforcement learning for ion shuttling on trapped-ion quantum computers", "abstract": "Scalable trapped-ion quantum computing is commonly realized with modular chips that feature distinct zones with specific functionalities, such as storage, state preparation, and gate execution. To execute a quantum circuit, the ions must be transported between these zones. This process is called ion shuttling. To achieve reliable computation results, the shuttling process must be optimized. However, as the number of ions increases, this becomes a high-dimensional optimization problem where optimal solutions cannot be computed efficiently. We demonstrate, to the best of our knowledge, the first use of reinforcement learning (RL) for the optimization of ion shuttling. RL is well-suited for such scenarios, as it enables learning a strategy through direct interaction with the problem. We show that our RL approach outperforms current state-of-the-art heuristic techniques, yielding a reduction in shuttling operations of up to 36.3 %. Furthermore, we show that our method is easily applicable to various chip architectures. Our approach offers a versatile method to study shuttling efficiency during chip design and, therefore, a highly relevant tool for future, more complex architectures.", "url": "https://arxiv.org/abs/2605.22463", "type": "数值", "summary": "1. 该工作首次将强化学习应用于离子阱量子计算中的离子穿梭优化问题。\n2. 其卖点在于相对现有启发式方法可减少多达36.3%的穿梭操作，并易于适配不同芯片架构。\n3. 这为未来更复杂芯片设计中的穿梭效率研究提供了通用优化工具与设计启示。", "summary_source": "deepseek", "authors": [{"name": "Maximilian Schier"}, {"name": "Lea Richtmann"}, {"name": "Christian Staufenbiel"}, {"name": "Tobias Schmale"}, {"name": "Daniel Borcherding"}, {"name": "Michèle Heurs"}, {"name": "Bodo Rosenhahn"}], "featured_authors": [{"name": "Maximilian Schier"}, {"name": "Lea Richtmann"}, {"name": "Christian Staufenbiel"}, {"name": "Daniel Borcherding"}, {"name": "Michèle Heurs"}, {"name": "Bodo Rosenhahn"}], "author_count": 7}, {"id": "2605.22580", "category": "quant-ph", "title": "Practical Countermeasure Against Attacks Exploiting Detection Efficiency Mismatch in Quantum Key Distribution", "abstract": "We demonstrate a practical countermeasure against a well-known class of attacks on quantum key distribution (QKD) systems that exploit detection efficiency mismatch, where the receiver's detectors do not exhibit identical responses to incoming photons across all degrees of freedom. This class of quantum hacking strategies is broad and significantly includes the time-shift attack, which targets an arrival-time-dependent side channel at the receiver. The four-state countermeasure, previously only proven to be secure in theory, is implemented here on a GHz-clocked prototype QKD system and evaluated for its security and performance. We show that its presence enables almost complete recovery of the system's ideal secret key rate. Our results provide strong justification for adopting this countermeasure as a standard component in future scalable and practical QKD systems.", "url": "https://arxiv.org/abs/2605.22580", "type": "理论+数值", "summary": "1. 该工作在GHz时钟QKD原型系统上实现了针对探测效率失配攻击的四态实用对策，并评估了其安全性与性能。\n2. 其核心在于通过调制接收端探测器响应，有效消除时间偏移等侧信道攻击导致的效率偏差，几乎完全恢复系统理想密钥速率。\n3. 这为将该对策作为标准化组件集成于未来可扩展、实用化QKD系统提供了坚实支撑。", "summary_source": "deepseek", "authors": [{"name": "Ben J. Taylor"}, {"name": "Peter R. Smith"}, {"name": "James F. Dynes"}, {"name": "Robert I. Woodward"}, {"name": "Marco Lucamarini"}, {"name": "R. Mark Stevenson"}, {"name": "Andrew J. Shields"}], "featured_authors": [{"name": "Ben J. Taylor"}, {"name": "Peter R. Smith"}, {"name": "James F. Dynes"}, {"name": "Marco Lucamarini"}, {"name": "R. Mark Stevenson"}, {"name": "Andrew J. Shields"}], "author_count": 7}, {"id": "2605.22603", "category": "quant-ph", "title": "Sudden death of entanglement, rebirth of magic", "abstract": "Local Markovian noise cannot bring entanglement back, but it can bring magic back. Unlike separability, stabilizer membership is not preserved by local channels, allowing dissipation to push states out of the stabilizer polytope as well as in. Under local amplitude damping, the $n$-qubit GHZ family $\\alpha|0^n\\rangle+\\beta|1^n\\rangle$ ($0<\\alpha<\\beta$) loses its magic at a lower damping strength $\\gamma_-$ and regains it at a higher one $\\gamma_+$, while entanglement is irreversibly lost at $\\gamma_e$. This magic-entanglement complementarity, $\\gamma_e+\\gamma_+=1$ for every $n$, reflects a system-environment duality of amplitude damping and persists for a broader class of dissipative channels. For small $\\alpha$, the reborn magic resides in a fully separable state with all proper marginals stabilizer, yet parity-syndrome extraction concentrates it onto a single qubit for magic-state distillation. Local dissipation further divides pure stabilizer states into magic-generators and magic-insulators: at two qubits, the Bell state $|\\Phi^+\\rangle$ generates magic immediately, while its Bell-state partner $|\\Psi^+\\rangle$ remains stabilizer. Together, magic and entanglement reveal a symmetry invisible to either alone.", "url": "https://arxiv.org/abs/2605.22603", "type": "理论", "summary": "1. 该工作研究了局部振幅阻尼噪声下多体GHZ态纠缠不可逆消亡而魔法先失后得的非单调行为。\n2. 卖点在于揭示了魔法与纠缠的互补关系γ_e+γ_+=1，该关系源于振幅阻尼的系统-环境对偶且推广至更广耗散通道。\n3. 这为耗散驱动下量子资源转换与基于稳定子奇偶性提取的魔法蒸馏提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Chenfeng Cao"}], "featured_authors": [{"name": "Chenfeng Cao"}], "author_count": 1}, {"id": "2605.22758", "category": "quant-ph", "title": "A sharp interaction-degree threshold for simulating QAOA", "abstract": "We identify a sharp interaction-degree threshold for the classical simulation of QAOA with $2$-local cost functions. At degree $3$, classical sampling from depth-$1$ QAOA with small multiplicative error would collapse the polynomial hierarchy to its third level. At degree $2$, exact classical sampling from depth-$p$ QAOA on $n$ qubits runs in time $n^{O(1)}$ whenever $p = O(\\log n)$. The hard degree-$3$ instances have trivially optimizable cost functions, so sampling hardness does not by itself imply a quantum optimization advantage.", "url": "https://arxiv.org/abs/2605.22758", "type": "数值", "summary": "1. 该工作针对2-局域成本函数的量子近似优化算法(QAOA)，通过计算复杂性理论确定了其经典模拟的一个尖锐相互作用度阈值：当相互作用度为3时，即使深度1的经典采样若允许小乘法误差也将导致多项式层次坍缩至第三级；当度为2时，深度p=O(log n)的QAOA可在n^{O(1)}时间内实现精确经典采样。\n2. 其主要技术贡献在于揭示了度3的困难实例虽具有采样意义上的硬度，但其成本函数却是经典算法可以轻易优化的，从而表明采样硬度本身并不等价于量子优化硬度的直接证据。\n3. 这一结论对量子计算在组合优化中的潜在优势提出了更为审慎的评估标准，即需要区分经典模拟的复杂性与问题实例的经典寻优能力，为未来量子优势的实验验证提供了理论指导。", "summary_source": "deepseek", "authors": [{"name": "Ralfs Āboliņš"}, {"name": "Andris Ambainis"}], "featured_authors": [{"name": "Ralfs Āboliņš"}, {"name": "Andris Ambainis"}], "author_count": 2}, {"id": "2605.22770", "category": "quant-ph", "title": "Adiabatic Quantum Phase Estimation", "abstract": "Quantum phase estimation (QPE) is a central algorithmic primitive that estimates eigenvalues of a Hamiltonian up to precision $\\epsilon$ in Heisenberg-limited time $T=\\Theta(1/\\epsilon)$. Standard gate-based implementations of QPE require deep controlled time-evolution circuits and are not native to analog hardware. Here, we present a simple adiabatic protocol for QPE that achieves (up to logarithmic factors) the optimal Heisenberg-limited scaling $T = O\\left( \\frac{1}{\\epsilon} \\log\\left(\\delta^{-1}\\right)\\right)$ in both the precision $\\epsilon$ and failure probability $\\delta$. By encoding eigenvalues in populations of computational basis states rather than complex phases, our approach is naturally robust against certain dephasing errors. The adiabatic protocol only requires the ability to couple a single ancilla qubit to the system Hamiltonian as well as pairwise couplings within the ancilla register.", "url": "https://arxiv.org/abs/2605.22770", "type": "理论+数值", "summary": "1. 该工作提出一种绝热量子相位估计协议，在精度ε和失败概率δ下达到海森堡极限缩放T=O((1/ε)log(1/δ))。\n2. 其核心创新在于将本征值编码为计算基态布居数而非复相位，从而天然抵抗退相位噪声，且仅需单辅助比特与系统哈密顿量的耦合及辅助比特内成对耦合。\n3. 这为模拟量子硬件实现最优量子相位估计提供了简洁方案，并启发对绝热算法鲁棒性与资源效率的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Alexander Schmidhuber"}, {"name": "Seth Lloyd"}], "featured_authors": [{"name": "Alexander Schmidhuber"}, {"name": "Seth Lloyd"}], "author_count": 2}, {"id": "2605.22796", "category": "quant-ph", "title": "Geometric Origin of the Non-Adiabaticity Parameter and Self-Limiting Instability in Driven Nonlinear Systems", "abstract": "We establish that the non-adiabaticity parameter has a direct geometric interpretation as the instantaneous evolution speed of a driven quantum state in projective Hilbert space under the Fubini Study metric. In contrast to conventional asymptotic approaches, the proposed framework provides a strictly local geometric criterion that allows non-adiabatic instability and its nonlinear suppression to be evaluated continuously at each stage of the driven evolution. We further show that an occupation-dependent nonlinear regulator Usuppresses the effective geometric evolution speed, leading to bounded low-occupancy dynamics. The resulting crossover parameter provides a compact criterion for self-limited non-adiabatic instability in driven nonlinear bosonic systems.", "url": "https://arxiv.org/abs/2605.22796", "type": "理论+数值", "summary": "1. 该工作建立了驱动非线性系统中非绝热参数的几何起源，并提出了自限不稳定性的局部几何判据。\n2. 其核心卖点是将非绝热性归结为量子态在投影希尔伯特空间Fubini-Study度规下的瞬时演化速度，并通过占据数相关的非线性调节因子实现了对有效几何速度的抑制。\n3. 这为驱动非线性玻色系统中非绝热不稳定性的实时诊断与调控提供了紧凑的交叉参数判据，可推广至其他受驱量子多体系统。", "summary_source": "deepseek", "authors": [{"name": "A. M. Tishin"}], "featured_authors": [{"name": "A. M. Tishin"}], "author_count": 1}, {"id": "2605.22797", "category": "quant-ph", "title": "One-photon communication in atomic media", "abstract": "We consider the problem of single-photon transmission through an atomic medium, using quantum channel fidelity to describe the resulting information loss. We find that the normalized fidelity decreases monotonically with coupling strength, establishing a performance bound for quantum communication through such media. Our results hold for several channel types and for deterministic and random media.", "url": "https://arxiv.org/abs/2605.22797", "type": "理论", "summary": "1. 该工作考虑单光子通过原子介质传输的量子信道保真度，刻画了信息损失过程。\n2. 其关键在于证明归一化保真度随耦合强度单调递减，从而确立了此类介质中量子通信的性能上界。\n3. 这一普适性边界适用于多种信道类型及确定性与随机介质，为原子平台量子通信的极限分析提供了理论约束。", "summary_source": "deepseek", "authors": [{"name": "Zixiang Hong"}, {"name": "John C. Schotland"}], "featured_authors": [{"name": "Zixiang Hong"}, {"name": "John C. Schotland"}], "author_count": 2}, {"id": "2605.22807", "category": "quant-ph", "title": "How many systems can be dephased before the quantum switch becomes causally definite?", "abstract": "Quantum processes with indefinite causal order -- so-called causally nonseparable processes -- can exhibit various advantages over quantum circuits with a fixed or a well-defined causal structure. A natural question is how much nonclassicality is required for a process to display causal nonseparability. Here we address this by investigating how many systems can be dephased (or decohered) before this property vanishes. First, for bipartite processes with open past and future we show that if all systems are dephased, or if only the future system is kept undephased, then the process becomes causally separable. However, if any single system other than the future system remains undephased, then there exist processes that retain causal nonseparability. Next, we demonstrate a similar behaviour in the multipartite case, when restricted to the physically motivated class of quantum circuits with quantum control (QC-QCs). Namely, dephasing all systems or keeping only the future system undephased renders any QC-QC causally separable; while causal nonseparability can persist if any non-future system is left undephased.", "url": "https://arxiv.org/abs/2605.22807", "type": "理论", "summary": "1. 该研究定量刻画了量子开关中因果不定序性在退相干作用下的消失条件，以及因果确定性的涌现阈值。\n2. 关键发现是：在双部及多部情形下，仅当所有系统或仅保留未来系统不退相干时，过程才必然因果可分；否则因果不可分性仍可存续。\n3. 这为理解因果不定序过程的退相干鲁棒性提供了精确边界，并启发量子信息处理中因果结构的可控调控。", "summary_source": "deepseek", "authors": [{"name": "Yassine Benhaj"}, {"name": "Kuntal Sengupta"}, {"name": "Cyril Branciard"}], "featured_authors": [{"name": "Yassine Benhaj"}, {"name": "Kuntal Sengupta"}, {"name": "Cyril Branciard"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
