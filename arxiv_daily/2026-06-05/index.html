 total distance of 303 km. The two sub-links use commercial QKD systems whose receivers are interfaced with external superconducting nanowire single-photon detectors, enabling operation at losses beyond those supported by standard internal gated-mode detectors. We operate the link while actively switching the QKD channel between two MCF cores, with co-propagating Ethernet traffic and injected broadband optical noise in the other cores. The results demonstrate the integration of commercial QKD into demanding, dynamically reconfigurable fiber infrastructure relevant to future hybrid quantum-classical networks. Finally, using the generated secret keys, we illustrate how limited and time-varying QKD throughput affects one-time-pad-protected image transmission: image fidelity depends strongly on the available QKD-generated key budget and the choice of compression algorithm, highlighting application-level challenges for QKD-based encryption in realistic scenarios.", "url": "https://arxiv.org/abs/2606.06107", "type": "数值", "summary": "1. 该工作在总长303公里的部署光纤上（含33公里多芯光纤接入段）演示了可信节点量子密钥分发，采用商用QKD系统结合超导纳米线单光子探测器以支持高损耗链路。\n2. 技术关键在于多芯光纤中QKD通道的动态切换，与共传以太网业务及注入宽带噪声的其它纤芯共存，且总链路损耗超过标准门控模式探测器的能力。\n3. 该成果为商用QKD集成于动态可重构光纤基础设施奠定了基础，同时揭示了有限且时变的密钥生成率对一次性密码本加密图像传输的应用层约束。", "summary_source": "deepseek", "authors": [{"name": "Martin Clason"}, {"name": "Joakim Argillander"}, {"name": "Didrik Bergström"}, {"name": "Daniel Spegel-Lexne"}, {"name": "Giulio Foletto"}, {"name": "Ashraf El Hassan"}, {"name": "Mohamed Bourennane"}, {"name": "Onur Günlü"}, {"name": "Katia Gallo"}, {"name": "Rui Lin"}, {"name": "Guilherme B. Xavier"}], "featured_authors": [{"name": "Martin Clason"}, {"name": "Joakim Argillander"}, {"name": "Didrik Bergström"}, {"name": "Katia Gallo"}, {"name": "Rui Lin"}, {"name": "Guilherme B. Xavier"}], "author_count": 11}, {"id": "2606.06246", "category": "quant-ph", "title": "Multiple Quantum Hypothesis Testing: One-Shot Pairwise Bounds and Sharp Asymptotics", "abstract": "We consider Bayesian discrimination among multiple quantum states and establish a dimension-free one-shot upper bound on the minimum probability of error in terms of the sum of pairwise errors. This resolves a conjecture of Audenaert and Mosonyi [J. Math. Phys. 55 (2014)] and improves the multiple quantum Chernoff bound of Li [Ann. Statist. 44 (2016)] by removing its dimension-dependent prefactor. In the asymptotic many-copy regime, our bound proves the achievability of the multiple quantum Chernoff distance for arbitrary separable Hilbert spaces, thereby settling the previously open infinite-dimensional case, and further yields constant-factor sharp asymptotics for the optimal error probability. In binary quantum hypothesis testing, we prove that the minimum error probability is characterized, up to universal constants, by a trace harmonic-mean quantity. Consequently, the optimal binary quantum error probability is within a factor of two of the optimal classical error probability for the associated Nussbaum-Szkoła distributions, complementing the lower bound of Nussbaum and Szkoła [Ann. Statist. 37 (2009)].", "url": "https://arxiv.org/abs/2606.06246", "type": "理论", "summary": "1. 该工作针对多量子态贝叶斯鉴别，建立了最小错误概率的无维数一步上界，其形式为所有成对最小错误概率之和，并在渐近多副本情形下证明该界可实现多量子Chernoff距离，从而解决了任意可分希尔伯特空间（包括无穷维）的达界性与常数因子锐渐近问题。\n2. 核心卖点在于从理论上移除了此前多量子Chernoff界中的维数依赖前因子，使界变得与维度无关，并进一步获得最优错误概率指数衰减率下的常数因子精确描述，验证了Audenaert-Mosonyi关于一步界的猜想且推广至无穷维空间。\n3. 二元情形下，最小错误概率由迹调和平均量以普适常数（精确到因子2）界定，且与经典Nussbaum-Szkoła分布的最优错误概率相差不超过两倍，该结果不仅补充了已知的下界，更将量子与经典假设检验能力的差别限定在常数因子内，为量子信息理论中鉴别问题的分析提供了有力工具。", "summary_source": "deepseek", "authors": [{"name": "Hao-Chung Cheng"}, {"name": "Po-Chieh Liu"}], "featured_authors": [{"name": "Hao-Chung Cheng"}, {"name": "Po-Chieh Liu"}], "author_count": 2}, {"id": "2606.06287", "category": "quant-ph", "title": "Quantum Algorithms for Triangle Cut Sparsification", "abstract": "Triangles capture higher-order structures in graphs and are fundamental to applications such as clustering and network analysis. To enable efficient use of such structures at scale, we study the problem of \\emph{triangle cut sparsification}, which aims to reduce the graph size while approximately preserving triangle counts across every cut. We investigate \\emph{quantum algorithms} for this problem, using triangle listing as our main technical ingredient. In particular, we present a quantum algorithm for triangle listing that, for a graph with $n$ vertices, $m$ edges, and $t$ triangles, runs in time $T_{\\mathrm{q\\text{-}list}} =$ $\\widetilde{O}\\bigl(\\min(n^{5/4}t^{7/12} + n^{7/6}t^{7/9}, m + m^{3/4}t^{1/2},$ $n^{3/2}t^{1/2})\\bigr)$, improving upon the best known classical bounds over a broad range of parameters. Our algorithm is based on a heavy-light vertex partition and an extension of triangle detection via quantum walks and Grover search. Leveraging this result, we design a quantum algorithm for constructing $\\varepsilon$-triangle cut sparsifiers of size $\\widetilde{O}(n/\\varepsilon^2)$ in time $\\widetilde{O}(T_{\\mathrm{q\\text{-}list}} + \\sqrt{mn}/\\varepsilon)$. Finally, we demonstrate applications to clustering algorithms based on triangle-related measures and prove a lower bound of $\\Omega(n/\\varepsilon^2)$ on the size of any $\\varepsilon$-triangle cut sparsifiers.", "url": "https://arxiv.org/abs/2606.06287", "type": "理论+数值", "summary": "1. 该工作提出了三角形切割稀疏化问题的量子算法，旨在通过近似保留每一切割上的三角形计数来缩减图规模。\n2. 其核心卖点是基于重轻顶点划分与量子行走及Grover搜索的三角形列出算法，在广泛参数范围内优于最优经典界，运行时间为\\(\\widetilde{O}(\\min(n^{5/4}t^{7/12}+n^{7/6}t^{7/9}, m+m^{3/4}t^{1/2}, n^{3/2}t^{1/2}))\\)。\n3. 这为基于三角形相关度量的聚类算法提供了高效量子加速，并证明了\\(\\Omega(n/\\varepsilon^2)\\)的稀疏化器大小下界，启发后续图结构量子稀疏化研究。", "summary_source": "deepseek", "authors": [{"name": "Shan Jiang"}, {"name": "Pan Peng"}], "featured_authors": [{"name": "Shan Jiang"}, {"name": "Pan Peng"}], "author_count": 2}, {"id": "2606.06316", "category": "quant-ph", "title": "Quantum enhanced rare event discovery and sampling", "abstract": "Financial crashes, cascading failures in infrastructure, and critical errors in AI systems are frequently triggered by events that occur with extremely small probability. Efficiently discovering and sampling events with probability below a threshold is therefore of critical interest. Yet this task is highly non-trivial using existing classical or quantum methods. Being rare, such events require an immense sampling overhead to collect sufficient data samples. Moreover, because the rare events are not known in advance, they cannot be flagged for amplification using standard techniques. Here, we introduce a quantum algorithm for rare-event discovery and sampling without first learning which events are rare. The algorithm achieves the optimal quantum scaling with the rarity threshold. We further demonstrate that this can achieve a quadratic speedup for heavy-tailed systems whose tail has nonvanishing total mass, and translates into a robust polynomial speedup for stationary stochastic processes, with the exponent determined by its entropy-rate structure.", "url": "https://arxiv.org/abs/2606.06316", "type": "理论+数值", "summary": "1. 该工作提出了一种无需预先学习哪些事件为稀有的量子算法，用于发现和采样概率低于给定阈值的罕见事件。\n2. 其卖点在于实现了对稀有阈值的最优量子标度，并在重尾系统和平稳随机过程中分别获得二次加速和由熵率结构决定的鲁棒多项式加速。\n3. 这为金融崩盘、级联失效和AI关键错误等极低概率事件的量子高效采样提供了明确的启发。", "summary_source": "deepseek", "authors": [{"name": "Naixu Guo"}, {"name": "Po-Wei Huang"}, {"name": "Qisheng Wang"}, {"name": "Jayne Thompson"}, {"name": "Patrick Rebentrost"}, {"name": "Mile Gu"}, {"name": "Chengran Yang"}], "featured_authors": [{"name": "Naixu Guo"}, {"name": "Po-Wei Huang"}, {"name": "Qisheng Wang"}, {"name": "Patrick Rebentrost"}, {"name": "Mile Gu"}, {"name": "Chengran Yang"}], "author_count": 7}, {"id": "2606.06318", "category": "quant-ph", "title": "Reliability of asymptotic work extraction", "abstract": "Extracting work from quantum states is a fundamental task in quantum thermodynamics. Previous studies have primarily focused on determining the best achievable rate of work extraction, and remarkably, this characterization appeared to remain unchanged regardless of the choice of allowed processes: whether one considers the operationally motivated class of energy-conserving thermal operations, or the axiomatic class of Gibbs-preserving operations, the optimal extractable work is given by the Helmholtz free energy. Here, we challenge this perspective, showing that a more refined analysis of the asymptotic performance of work extraction reveals significant differences in the performance for the two different classes of free operations. Precisely, we focus on the trade-off between the extraction rate and its reliability, characterized by the optimal asymptotic speed at which the extraction error can be suppressed. We establish that the reliability of Gibbs-preserving operations and of thermal operations are respectively characterized by the Petz and the sandwiched Rényi relative entropies, demonstrating that the former in general strictly outperforms the latter, and providing new interpretations of several information-theoretic divergences. Our analysis reveals that operational constraints such as energy conservation impose stronger limitations on the achievable precision of quantum tasks than can be inferred from their asymptotic rates, thereby questioning the use of Gibbs-preserving operations as a mathematically convenient substitute for the physically realizable thermal processes.", "url": "https://arxiv.org/abs/2606.06318", "type": "理论", "summary": "1. 该工作研究了从量子态中提取功时，热操作与吉布斯保持操作在渐近提取率与可靠性权衡中的差异。\n2. 关键发现是两类操作的可靠性分别由Petz和夹层Rényi相对熵刻画，且前者在误差抑制速度上严格优于后者。\n3. 这质疑了以吉布斯保持操作替代热操作的做法，揭示了能量守恒等操作约束对量子任务精度的更强限制。", "summary_source": "deepseek", "authors": [{"name": "Kaito Watanabe"}, {"name": "Bartosz Regula"}, {"name": "Marco Tomamichel"}, {"name": "Ryuji Takagi"}], "featured_authors": [{"name": "Kaito Watanabe"}, {"name": "Bartosz Regula"}, {"name": "Marco Tomamichel"}, {"name": "Ryuji Takagi"}], "author_count": 4}, {"id": "2606.06341", "category": "quant-ph", "title": "Benchmarking Floquet Master Equations for Periodically Driven Open Quantum Systems", "abstract": "The dynamics of open quantum systems is commonly described by quantum master equations derived under the assumption of weak system-bath coupling and a separation of timescales between system and bath. When the system is additionally subjected to a periodic driving, the validity of the resulting Floquet master equations is further restricted to regimes of weak or high-frequency driving. Here, we benchmark a set of commonly used Floquet master equations for a model of two locally driven spins coupled to a shared Ohmic reservoir at finite temperature. We systematically probe the accuracy of the equations as a function of the driving parameters, thus identifying limits of their applicability. Dynamical maps predicted by each master equation are compared against numerically exact non-Markovian simulations, tracking the full relaxation dynamics. We find that the accuracy of each master equation closely reflects the assumptions underlying its derivation. For the Floquet-Lindblad equation, errors can be strongly amplified near resonances where the secular approximation breaks down, while approaches that avoid the secular approximation perform better and exhibit a more systematic dependence of the error on driving frequency and amplitude.", "url": "https://arxiv.org/abs/2606.06341", "type": "理论+数值", "summary": "1. 该工作基于两个局域驱动自旋耦合到共公开欧姆热库的模型，系统性地基准测试了多种常用Floquet主方程的准确性。\n2. 通过与精确非马尔可夫数值模拟对比，发现各主方程的误差紧密反映其推导假设，其中Floquet-Lindblad方程在共振附近因世俗近似失效而误差显著放大，而避免世俗近似的方法表现更优。\n3. 这为周期驱动开放量子系统中主方程的适用性选择提供了定量判据，并启示在强驱动或共振区需谨慎使用基于世俗近似的简化模型。", "summary_source": "deepseek", "authors": [{"name": "Konrad Mickiewicz"}, {"name": "Valentin Link"}, {"name": "Walter T. Strunz"}], "featured_authors": [{"name": "Konrad Mickiewicz"}, {"name": "Valentin Link"}, {"name": "Walter T. Strunz"}], "author_count": 3}, {"id": "2606.06392", "category": "quant-ph", "title": "Robustness of Entanglement Manipulation for almost i.i.d. sources", "abstract": "We study the robustness of asymptotic entanglement manipulation beyond the exact i.i.d. regime, focusing on Mazzola--Sutter--Renner (MSR) almost i.i.d. sources, which allow a sublinear number of deviations from a tensor-power structure. For pure MSR sources along a bipartite reference state $|{\\phi}\\rangle_{AB}$, we prove that the entanglement concentration rate is robust: every rate below the entropy of entanglement $S(\\phi_A)$ remains achievable. Moreover, this can be done by a single Schur--Weyl concentration protocol that is universal within the MSR class, depending only on the reference state and not on the particular source sequence. For mixed MSR sources along a reference state $\\rho_{AB}$, we prove a source-dependent entanglement-distillation achievability result: every rate below the coherent information $I(A\\rangle B)_\\rho$ of the reference state is achievable, although the entanglement distillation protocol may depend on the particular MSR source sequence. For the reverse task of entanglement dilution, we prove a rate-robustness theorem: the asymptotic entanglement cost of any MSR target sequence along $\\rho_{AB}$ is at most $E_F^\\infty(\\rho_{AB})$, the regularized entanglement of formation of the reference state. To establish these results, we prove structural and entropic properties of MSR almost i.i.d. sequences which may be useful in other information-theoretic settings. Thus, for the achievability statements considered here, MSR almost i.i.d. perturbations exhibit the same asymptotic behaviour as their i.i.d. reference states, despite allowing sublinear deviations from a tensor-power structure.", "url": "https://arxiv.org/abs/2606.06392", "type": "理论", "summary": "1. 该工作研究了几乎i.i.d.源（MSR类）在渐近纠缠操纵中的鲁棒性，证明纯态纠缠浓缩速率可达参考态纠缠熵，混合态纠缠蒸馏可达相干信息，且纠缠稀释成本不超过规则化纠缠形成。\n2. 技术核心在于利用Schur-Weyl协议实现纯态MSR源上通用纠缠浓缩，并建立MSR序列的结构与熵特性以支持混合态与稀释结果。\n3. 这表明MSR几乎i.i.d.扰动在纠缠操纵中保留了参考态的渐近行为，为超越精确i.i.d.假设的信息论问题提供了新分析工具。", "summary_source": "deepseek", "authors": [{"name": "Nilanjana Datta"}], "featured_authors": [{"name": "Nilanjana Datta"}], "author_count": 1}, {"id": "2606.06442", "category": "quant-ph", "title": "Nanostructure modelling with early fault tolerant quantum computers", "abstract": "Semiconductor nanostructures are central to many developing technologies. Notably, double quantum dots are especially important for semiconductor spin-qubit architectures, quantum sensing applications, and quantum-dot solar cells. Accurate modelling is highly desirable but conventional methods can struggle when dynamics involve more than two interacting electrons. In this work, we present a quantum simulation framework capable of addressing multi-electron double quantum dots. We adopt an efficiently scaling 1$^\\text{st}$ quantised representation of the system and develop algorithms based on both Trotterisation and qubitisation. Incorporating insights from classical simulations enables us to produce resource estimates that are more realistic than those obtained from theoretical error bounds. Using a standard surface code model with physical noise at $10^{-3}$, our results indicate that the ground-state energy of four electrons in a double quantum dot can be estimated in approximately 24 hours using 226k physical qubits, or an eight-electron system in 3.4 days with 314k qubits (with runtimes falling dramatically when more qubits are available). We anticipate that incorporating very recent advances including dense surface code architectures (Low et al. arXiv:2605.30455 ) may reduce these costs significantly further. We conclude that early fault tolerant computers may prove to be valuable tools for designing mature-era quantum technologies.", "url": "https://arxiv.org/abs/2606.06442", "type": "理论+数值", "summary": "1. 该工作提出了一个面向多电子双量子点纳米结构建模的早期容错量子计算模拟框架。\n2. 其核心在于采用第一量子化表示与Trotterization及qubitisation算法，并结合经典模拟获得比理论误差界更贴近实际的资源估计。\n3. 这预示着早期容错量子计算机有望成为设计下一代量子技术器件的实用工具，且结合新型密集表面码架构可进一步大幅降低资源需求。", "summary_source": "deepseek", "authors": [{"name": "Zhu Sun"}, {"name": "Christian Binder"}, {"name": "Balint Koczor"}, {"name": "Simon Benjamin"}], "featured_authors": [{"name": "Zhu Sun"}, {"name": "Christian Binder"}, {"name": "Balint Koczor"}, {"name": "Simon Benjamin"}], "author_count": 4}, {"id": "2606.06452", "category": "quant-ph", "title": "Energy-Modulated Time-Asymmetric Spontaneous Collapse: Forward-Backward Dynamics from Stochastic Ito Reversal and Bright Solitons", "abstract": "We present a rigorous theoretical framework for symmetry breaking and quantum irreversibility arising from stochastic Ito field reversal within a cubic-quintic nonlinear Schrodinger equation (CQ-NLSE) formalism. Starting from three physically motivated considerations, forward and backward nonlinear stochastic differential equations are derived via the Ito calculus. Kinematic time-reversal is shown to be fundamentally incompatible with the Ito stochastic structure, yielding the universal asymmetry-coupling parameter of 2/3. An energy-driven collapse operator proportional to the product of noise strength, local probability density, and excitation energy squared is introduced, amplifying the collapse in high-density, high-excitation regions. Exactly bright soliton solutions are obtained for a quasi-one-dimensional BEC of attractive Li-7 atoms, with forward and backward amplitude ratio of 1.870. Heat map analysis of the parameter planes reveals that the forward collapse operator grows monotonically in time while the backward counterpart decays, achieving a ratio approximately 1030, sharply distinguishing this framework from conventional symmetric collapse models.", "url": "https://arxiv.org/abs/2606.06452", "type": "理论", "summary": "1. 该工作基于伊藤随机场反转，在三次-五次非线性薛定谔方程框架内建立了正向与反向非对称自发塌缩的严格理论。\n2. 其核心在于证明伊藤随机结构根植于运动学时间反演的不兼容性，导出普适不对称耦合参数2/3及能量驱动塌缩算符（正比于噪声强度、局域概率密度与激发能平方之积）。\n3. 这为量子时间不可逆性提供了明确的理论基准，尤其可精确描述准一维吸引性锂-7玻色-爱因斯坦凝聚中亮孤子的非对称动力学。", "summary_source": "deepseek", "authors": [{"name": "Ikechukwu C. Okoro"}, {"name": "Mike O. Osiele"}, {"name": "Godfrey E. Akpojotor"}], "featured_authors": [{"name": "Ikechukwu C. Okoro"}, {"name": "Mike O. Osiele"}, {"name": "Godfrey E. Akpojotor"}], "author_count": 3}, {"id": "2606.06456", "category": "quant-ph", "title": "Quantum element-wise transforms", "abstract": "Quantum algorithms for basic numerical linear algebraic tasks have proven essential for translating diverse problems to a unified quantum computational context. Many of these tasks -- e.g., applying a polynomial function to the spectrum of a matrix embedded in a unitary process (a so-called block encoding), or taking linear combinations of block encodings -- are well-addressed by techniques like quantum singular value transformation (QSVT) or linear combination of unitaries (LCU). However, there exist useful matrix transforms whose realization by existing quantum algorithms is unclear or inefficient. In this work we construct improved quantum algorithms for some of these transforms, the simplest of which is a polynomial function applied element-wise. We show the space required to compute quantum element-wise transforms can be reduced exponentially in the degree of the applied function compared to prior work, and raise and rectify errors in previous constructions. We present our algorithms alongside applications to machine learning, simulation, and signal processing.", "url": "https://arxiv.org/abs/2606.06456", "type": "数值", "summary": "1. 该工作构造了改进的量子算法，用于实现逐元素矩阵变换，包括多项式函数的逐元素应用。\n2. 其技术关键在于将所需辅助量子比特数从关于多项式度数的指数依赖降低为多项式依赖，并纠正了先前构造中的错误。\n3. 这为量子机器学习、量子模拟和量子信号处理中的相关线性代数子程序提供了更高效的实现路径。", "summary_source": "deepseek", "authors": [{"name": "Zane M. Rossi"}, {"name": "Rahul Sarkar"}], "featured_authors": [{"name": "Zane M. Rossi"}, {"name": "Rahul Sarkar"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
