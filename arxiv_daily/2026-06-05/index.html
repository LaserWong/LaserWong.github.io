cusing on quenches induced by Carroll breaking perturbations, through the probe of Krylov (spread) Complexity. We specialise to Fermionic ladder Hamiltonians with all bands flat (ABF) scenario, augmented by a supertranslation preserving interaction, and discuss Krylov state complexity for quenches across critical lines. We further discuss how the growth of Krylov complexity sharply resolves the phase-dependent resilience of Carrollian sectors against delocalising perturbations. This is augmented by a complementary mechanism for Krylov growth in a continuum Carroll scalar field theory with a gradient deformation, which exhibits strong ultraviolet sensitivity (UV/IR mixing).", "url": "https://arxiv.org/abs/2606.05303", "type": "理论", "summary": "1. 该工作利用Krylov展开复杂度探针，研究了具有全平带结构的费米子梯子哈密顿量在超平移保持相互作用及Carroll破缺淬火下的态动力学。\n2. 其核心卖点在于揭示Krylov增长如何尖锐分辨Carroll扇区对退定域扰动的相位依赖抗性，并辅以连续Carroll标量场梯度形变中的UV/IR混合互补机制。\n3. 这为利用信息论探针刻画平带系统中对称性破缺驱动的量子混沌动力学，以及Carroll对称性在凝聚态与场论交叉中的角色提供了明确指引。", "summary_source": "deepseek", "authors": [{"name": "Aritra Banerjee"}, {"name": "Arpan Bhattacharyya"}, {"name": "Rudranil Basu"}, {"name": "Sayan Das"}], "featured_authors": [{"name": "Aritra Banerjee"}, {"name": "Arpan Bhattacharyya"}, {"name": "Rudranil Basu"}, {"name": "Sayan Das"}], "author_count": 4}, {"id": "2606.05314", "category": "hep-th", "title": "Mass-Flow Invariance of $Q$-Cohomology in BMN Matrix Quantum Mechanics", "abstract": "We study the dependence of the dynamical supercharges of BMN matrix quantum mechanics on the mass parameter $\\mu$. Taking the $\\mu$-derivative at fixed canonical matrix variables, we show that the sixteen-component supercharge evolves by the adjoint action of a Hermitian quadratic bosonic operator $\\mathcal{K}$, together with the spinor-space factor $i\\gamma^{123}$. After projection to a $\\gamma^{123}$-eigenspace, this flow integrates to a finite similarity transformation. For the nilpotent component $Q(\\mu)=\\mathcal Q^4_-(\\mu)$, one obtains $Q(\\mu)=M(\\mu,\\mu_0)Q(\\mu_0)M(\\mu,\\mu_0)^{-1}$, giving an algebraic mass-flow non-renormalization statement for the $Q$-cohomology. The corresponding Hilbert-space statement has an analytic qualification, parallel to Witten's argument for supersymmetric quantum mechanics: $M$ is non-unitary and unbounded, so its action on the normalizable domain must be controlled. We formulate a small-step criterion by comparing the quadratic growth of $M$ with the Gaussian falloff of BMN oscillator wavefunctions within each component $\\mu>0$ or $\\mu<0$. As a concrete check, we evaluate this condition in the $N=2$ theory, whose two vacuum sectors are built on the trivial vacuum and the irreducible fuzzy-sphere vacuum. We also compute the induced $Q_{\\rm BPS}$-action on the corresponding BPS letters: in the trivial sector it agrees with the standard BMN-sector BPS-letter differential of $\\mathcal{N}=4$ SYM, while in the irreducible sector it vanishes.", "url": "https://arxiv.org/abs/2606.05314", "type": "理论", "summary": "1. 该工作研究了BMN矩阵量子力学中超荷对质量参数μ的依赖，证明了十六分量超荷通过一个厄米二次玻色算子的伴演随变换演化。\n2. 主要卖点是给出了幂零分量Q(μ)的相似变换关系，从而导出Q-上同调的质量流代数非重正化，并基于高斯波函数的衰减性建立了控制该相似变换的小步判据。\n3. 这一结果为理解超对称矩阵模型的真空结构提供了代数与解析工具，其在N=2理论中与N=4 SYM的BPS字母微分一致，在不可约扇区则给出平凡作用。", "summary_source": "deepseek", "authors": [{"name": "Chi-Ming Chang"}, {"name": "Zhengyuan Du"}, {"name": "Sarthak Duary"}, {"name": "Kangning Liu"}, {"name": "Yi-Xiao Tao"}], "featured_authors": [{"name": "Chi-Ming Chang"}, {"name": "Zhengyuan Du"}, {"name": "Sarthak Duary"}, {"name": "Kangning Liu"}, {"name": "Yi-Xiao Tao"}], "author_count": 5}, {"id": "2606.05319", "category": "hep-th", "title": "Non-linear evolution of five-dimensional black strings in effective field theory", "abstract": "We use numerical relativity to study the non-linear instability of five-dimensional black strings in Einstein-Gauss-Bonnet gravity. Black strings evolve into a series of black holes joined by thinner string-like segments, but key features of the dynamics depend on the sign of the Gauss-Bonnet coupling. For positive coupling, favored by UV considerations, the growth of curvature invariants is limited within the validity of effective field theory (EFT), suggesting a mechanism for restoring weak cosmic censorship. For negative coupling this cap is absent and curvatures may grow until the EFT breaks down.", "url": "https://arxiv.org/abs/2606.05319", "type": "理论", "summary": "1. 该工作利用数值相对论研究了爱因斯坦-高斯-邦尼引力中五维黑弦的非线性演化不稳定性。\n2. 其关键发现在于高斯-邦尼耦合符号决定曲率不变量的增长是否受有效场论效价限制，正耦合可保护弱宇宙监督。\n3. 这为有效场论框架下高维引力系统的动力学行为及宇宙监督假设的验证提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Pau Figueras"}, {"name": "Áron D. Kovács"}, {"name": "Shunhui Yao"}], "featured_authors": [{"name": "Pau Figueras"}, {"name": "Áron D. Kovács"}, {"name": "Shunhui Yao"}], "author_count": 3}, {"id": "2606.05370", "category": "hep-th", "title": "Novel $\\mathcal{N}=2$ higher-spin supercurrents", "abstract": "We study cubic interactions of $\\mathcal N=2$ massless integer-spin gauge supermultiplets in harmonic superspace. We construct the complete class of abelian $(\\mathbf{s},\\mathbf{s_1},\\mathbf{s_2})$ cubic vertices with the minimal number of space-time derivatives. Such vertices exist only for $\\mathbf{s}\\geq \\mathbf{s_1}+\\mathbf{s_2}$ and universally take the form of the gauge prepotential coupled to the conserved higher-spin supercurrent. For~$\\mathbf{s_1}\\neq\\mathbf{s_2}$, we find the novel complex principal supercurrent, whose real and imaginary parts generate the parity-invariant and the parity-breaking interactions, respectively. The supercurrents are constructed from gauge-invariant $\\mathcal N=2$ higher-spin Weyl supertensors associated with the spin-$\\mathbf{s_1}$ and spin-$\\mathbf{s_2}$ gauge multiplets. These supertensors are defined in terms of unconstrained higher-spin analytic prepotentials. We also derive the complete set of conserved component higher-spin currents associated with the $(s,s_1,s_2)$ vertices, including both traceless currents and currents with the non-vanishing trace.", "url": "https://arxiv.org/abs/2606.05370", "type": "理论", "summary": "1. 该工作在调和超空间中构造了N=2无质量整数自旋规范超多重态的完全类阿贝尔立方顶点，并发现了一类新型复数主超流。\n2. 其技术核心在于顶点仅当主自旋s≥s1+s2时存在，且由规范预势与守恒高阶自旋超流耦合，超流实、虚部分别生成宇称不变与宇称破缺相互作用。\n3. 这为构建超空间中共形超流理论及更高自旋超引力相互作用提供了明确框架，并揭示了宇称破缺顶点的新型结构来源。", "summary_source": "deepseek", "authors": [{"name": "Nikita Zaigraev"}], "featured_authors": [{"name": "Nikita Zaigraev"}], "author_count": 1}, {"id": "2606.05388", "category": "hep-th", "title": "BPS Non-Renormalization in the BMN Matrix Model", "abstract": "We show in the $(0+1)$-dimensional Berenstein-Maldacena-Nastase matrix model, dual to M-theory on a pp-wave background, that the coupling can be changed between any two finite, non-zero values using a special class of deformations, known as conjugation deformations. Importantly, we prove that they preserve normalizability of the states. This implies that BPS states in the model cannot lift as the couplings are varied, and hence their (unsigned) number cannot change, except at the free point and Banks-Fischler-Shenker-Susskind point.", "url": "https://arxiv.org/abs/2606.05388", "type": "理论", "summary": "1. 该工作在BMN矩阵模型中证明，通过共轭形变可在任意有限非零耦合值之间连续调节耦合常数，且保持态的正则化性质。\n2. 其核心论据是此类形变不破坏BPS态的正则性，从而严格排除BPS态在耦合变化中的提升，确保其（无符号）数目不变。\n3. 这为M理论在pp波背景下的BPS非重整化定理提供了直接证明，并暗示自由点与BFSS点之间BPS谱的拓扑稳定性。", "summary_source": "deepseek", "authors": [{"name": "Sean Colin-Ellerin"}, {"name": "Kyriakos Papadodimas"}], "featured_authors": [{"name": "Sean Colin-Ellerin"}, {"name": "Kyriakos Papadodimas"}], "author_count": 2}, {"id": "2606.05401", "category": "hep-th", "title": "Carrollian holography with agentic AI: Real mass is imaginary", "abstract": "We introduce LACIA, a verification-driven agentic AI workflow for theoretical physics, and apply it with independent human checks to construct Carrollian conformal bases. We develop the Poincare-Carrollian intertwiner as the central method. It reproduces the celestial and Carrollian conformal bases for massless particles and constructs the missing Carrollian bases for massive and tachyonic particles. The massive basis requires a complex momentum shift in scattering amplitudes.", "url": "https://arxiv.org/abs/2606.05401", "type": "理论", "summary": "1. 该工作引入验证驱动的智能AI工作流LACIA，并结合人工校验，系统构建了Carrollian共形基。\n2. 其核心技术Poincare-Carrollian intertwiner通过复数动量平移，统一获得无质量、有质量及快子粒子的Carrollian基。\n3. 这为天球全息中实质量与虚动量的纠缠提供新视角，并展示了AI辅助理论构造的可行范式。", "summary_source": "deepseek", "authors": [{"name": "Reiko Liu"}, {"name": "Wen-Jie Ma"}, {"name": "Hu Zheng"}, {"name": "Yu-fan Zheng"}], "featured_authors": [{"name": "Reiko Liu"}, {"name": "Wen-Jie Ma"}, {"name": "Hu Zheng"}, {"name": "Yu-fan Zheng"}], "author_count": 4}, {"id": "2606.05431", "category": "hep-th", "title": "Optical properties of gravitating strings", "abstract": "We study the optical properties of gravitating Abelian-Higgs cosmic strings and compare them with those of the idealized infinitely thin string. We analyze the structure of the corresponding vortex solutions, characterizing their width, curvature profile, and approach to the ideal string limit. By investigating photon propagation in the string spacetime, we show that the finite core of the vortex gives rise to distinctive observational signatures absent in the ideal string approximation, including a characteristic triple-imaging configuration, strong demagnification of the central image, and a nontrivial Shapiro time delay between external and internal images. We determine how these effects depend on the parameters of the Abelian-Higgs model and show that the sign of the time delay is controlled by the ratio of the gauge boson mass to the Higgs boson mass, causing the string core to behave as either a temporal shortcut or a temporal barrier. Our results demonstrate that lensing effects can reveal information about the vortex formation and internal structure.", "url": "https://arxiv.org/abs/2606.05431", "type": "理论", "summary": "1. 该工作研究了引力阿贝尔-希格斯宇宙弦的光学性质，并与理想无限细弦模型进行对比。\n2. 其核心发现是涡旋有限核导致三重成像、中央像强消减以及由规范与希格斯玻色子质量比决定符号的夏皮罗时延。\n3. 这为通过引力透镜效应探测宇宙弦的涡旋形成机制与内部结构提供了可观测的判据。", "summary_source": "deepseek", "authors": [{"name": "Marcos Silva"}, {"name": "Azadeh Mohammadi"}], "featured_authors": [{"name": "Marcos Silva"}, {"name": "Azadeh Mohammadi"}], "author_count": 2}, {"id": "2606.05500", "category": "hep-th", "title": "The spectrum of the bosonic ambitwistor string revisited", "abstract": "We revisit the calculation of the spectrum of the bosonic ambitwistor string, understood as the BRST cohomology or, equivalently, as the semi-infinite cohomology of the $\\mathrm{BMS}_3$ Lie algebra relative to the centre with values in a particular module. We work in momentum space, which allows us to work algebraically and interpret the BRST cohomology as inducing representations of the Poincaré group. In agreement with the existing literature, we find that all the cohomology resides in the massless sector, but a careful representation-theoretic analysis of the spectrum reveals, in addition to the usual massless sector of the closed bosonic string (dilaton, metric and Kalb--Ramond field), also a massless vector. We devote a large part of the paper to describing the cohomology at a massless momentum $p$ as a module over the stabiliser $H$ of $p$ in the Lorentz group, a task which is made difficult due to $H$ not acting reducibly when $p\\neq 0$. This allows us to conclude that the spectrum is not unitary, forbidding the interpretation of the extra massless vector as a Maxwell field.", "url": "https://arxiv.org/abs/2606.05500", "type": "理论", "summary": "1. 该工作重新计算了玻色子ambitwistor弦的谱，将其理解为BRST上同调或BMS₃李代数相对中心在半无限上同调中的结果。\n2. 技术关键在于动量空间中代数操作，将BRST上同调诠释为庞加莱群的诱导表示，并发现除标准闭弦无质量扇区外还存在额外无质量矢量。\n3. 该额外矢量对应的谱非幺正，禁止其作为Maxwell场的物理解释，表明弦谱存在内在的非幺正性限制。", "summary_source": "deepseek", "authors": [{"name": "José M. Figueroa-O'Farrill"}, {"name": "Girish S. Vishwa"}], "featured_authors": [{"name": "José M. Figueroa-O'Farrill"}, {"name": "Girish S. Vishwa"}], "author_count": 2}, {"id": "2606.05505", "category": "hep-th", "title": "Dirichlet walls and the end of time", "abstract": "We study evolution in Einstein-Hilbert gravity with Dirichlet boundary conditions imposed on a finite surface. We argue that there are open sets of initial data where such evolutions terminate at finite times due to singularities that reach the boundary. In any dimension, the simplest such examples occur in cosmologies. However, in 2+1 dimensions we also show that Dirichlet walls initially outside a BTZ black hole can fall through the horizon, and that this also leads to generic singularities. A similar construction in higher dimensions leads to trapped surfaces that reach the wall, though the end result of such evolutions is more difficult to study.", "url": "https://arxiv.org/abs/2606.05505", "type": "理论", "summary": "1. 该工作研究了爱因斯坦-希尔伯特引力中有限曲面上的狄利克雷边界条件，发现初始数据开集会导致演化因边界奇点而在有限时间终止。\n2. 其核心在于揭示宇宙学及黑洞视界附近狄利克雷壁落入行为均产生时空奇点，并以2+1维BTZ黑洞为例展示物理机制。\n3. 这为引力边界条件与时空奇点关联建立了新视角，启发后续探索高维情形中捕获面演化及奇点形成的完整图像。", "summary_source": "deepseek", "authors": [{"name": "Hanako Helton"}, {"name": "Gary T. Horowitz"}, {"name": "Donald Marolf"}], "featured_authors": [{"name": "Hanako Helton"}, {"name": "Gary T. Horowitz"}, {"name": "Donald Marolf"}], "author_count": 3}, {"id": "2606.05530", "category": "hep-th", "title": "Hodge theory and $G_4$ fluxes in weighted projective spaces: Galois action", "abstract": "We extend the explicit study of $G_4$-fluxes and general Hodge cycles from the ordinary Fermat sextic fourfold to tame Fermat-type hypersurfaces in weighted projective space. The main new feature in the weighted setting is that the Galois action on the cyclotomic period data need not preserve the $(2,2)$-subspace. As a consequence, the rational reconstruction of an integral self-dual class can involve additional middle-cohomology components, increasing the norm of the corresponding flux. We work at maximally symmetric Fermat points, where the period matrices and symmetry-invariant Hodge loci can be computed explicitly. Using Movasati's description of periods, cyclotomic period matrices, and Hermite/Smith normal form reductions, we construct the relevant integral lattices of symmetric self-dual classes in middle cohomology. This gives a controlled test of whether symmetric general Hodge cycles can satisfy the M2-brane tadpole bound. Our main conclusion is empirical. In the degree 12 example in $\\mathbb{P}_{1,1,1,1,4,4}$, and in the degree 8 weighted example used as a comparison, the shortest computed symmetric general Hodge cycles overshoot the tadpole bound. In the degree 36 example in $\\mathbb{P}_{1,1,1,9,12,12}$, which has $h^{1,1}=11$, the most general example we have, the tadpole conjecture is indeed verified at the maximally symmetric locus, although the computations get difficult and computationally expensive. These computations suggest that, in weighted Fermat examples, the relevant notion of a ``symmetric flux'' must take into account not only automorphisms of the variety but also the Galois action on the period field. Non-uniform Galois orbits provide a natural arithmetic mechanism by which symmetric Hodge classes can acquire large tadpole charge.", "url": "https://arxiv.org/abs/2606.05530", "type": "理论", "summary": "1. 该工作将G₄通量与一般Hodge圈的研究从普通Fermat六次四重推广至加权射影空间中的驯服Fermat型超曲面。\n2. 关键发现在于加权情形下伽罗瓦作用不保持(2,2)子空间，使自偶类重构需引入额外中上同调分量并增大通量范数，借助Movasati周期理论构建了对称自偶类的积分格点。\n3. 这为M2膜tadpole界限提供了受控检验，启示加权Fermat对称通量须同时考虑自同构与周期域上的伽罗瓦作用，且非均匀伽罗瓦轨道是Hodge类获取大tadpole荷的自然算术机制。", "summary_source": "deepseek", "authors": [{"name": "Hugo Fortin"}, {"name": "Daniel López Garcia"}], "featured_authors": [{"name": "Hugo Fortin"}, {"name": "Daniel López Garcia"}], "author_count": 2}, {"id": "2606.05543", "category": "hep-th", "title": "Notes on (-2)-form symmetries", "abstract": "We study $(-2)$-form symmetries of a $d$-dimensional quantum field theory, via a $(-1)$-form symmetry of its $(d+1)$-dimensional Symmetry Topological Field Theory (SymTFT), realized by a non-genuine codimension-one defect in the SymTFT bulk attached to a spacetime-filling topological operator. Unlike a $(-1)$-form symmetry of a $d$-dimensional theory, which merely shifts a parameter of the absolute theory, a $(-2)$-form symmetry modifies the SymTFT action, and thereby relates theories whose ordinary global symmetries differ by anomaly data or by the associator data of a non-invertible symmetry. We illustrate the construction in two-dimensional toy models, three-dimensional ABJM-type theories, four-dimensional generalized Yang--Mills theory, and in a fusion-categorical example relating the non-invertible symmetries $\\operatorname{Rep}(D_4)$ and $\\operatorname{Rep}(Q_8)$. We then develop a club-sandwich realization, in which a quarter-gauging operation interfaces between IR phases of distinct RG flows of a common UV theory, and an alternative realization via nested discrete gauging. Finally, we present a holographic, top-down realization in which the type IIA Romans mass plays the role of a $(-2)$-form background for a three-dimensional Chern--Simons-matter theory, with shifts of the Romans mass realizing shifts of the boundary anomaly coefficients. We also discuss related constructions for coupled bulk--boundary systems.", "url": "https://arxiv.org/abs/2606.05543", "type": "理论", "summary": "1. 该工作通过(d+1)维对称拓扑场论(SymTFT)中非本真余维一缺陷研究了d维量子场论的(-2)-形式对称性。\n2. 其核心在于(-2)-形式对称性通过修改SymTFT作用量，将具有不同反常数据或非可逆对称结合子信息的普通全局对称性理论联系起来。\n3. 这为对称性层级结构、RG流间的四分之一规范界面以及全息实现（如IIA Romans质量作为(-2)-形式背景）提供了统一框架与明确启发。", "summary_source": "deepseek", "authors": [{"name": "Pinak Banerjee"}, {"name": "Alonso Perez-Lona"}, {"name": "Daniel Robbins"}, {"name": "Subham Roy"}, {"name": "Eric Sharpe"}, {"name": "Xingyang Yu"}], "featured_authors": [{"name": "Pinak Banerjee"}, {"name": "Alonso Perez-Lona"}, {"name": "Daniel Robbins"}, {"name": "Subham Roy"}, {"name": "Eric Sharpe"}, {"name": "Xingyang Yu"}], "author_count": 6}, {"id": "2606.05562", "category": "hep-th", "title": "Charting the different phases of Yang-Mills-Chern-Simons-Higgs theories", "abstract": "We explore Yang-Mills-Chern-Simons theories coupled to a Higgs-like field in the fundamental representation of $SU(2)$ quantized in linear covariant gauges in three Euclidean dimensions. We analyze the modifications in the analytic structure of the gluon propagator due to the elimination of infinitesimal Gribov copies. The interplay between the Higgs, the Chern-Simons and Gribov mass parameters is investigated. Two different phases are identified: a confining one, where all poles are complex, and a deconfined one, where would-be physical gluon excitation can appear. Unlike previous works, the Gribov parameter is consistently fixed by its gap equation as a function of the other mass parameters and the gauge coupling. This imposes a constraint in the parameter space and makes transparent how the competition of the mass parameters affects the relevance of the Gribov parameter for the characterization of the spectrum of the theory.", "url": "https://arxiv.org/abs/2606.05562", "type": "理论", "summary": "1. 该工作研究三维欧几里得SU(2)杨-米尔斯-陈-西蒙斯-希格斯理论，通过消除无穷小Gribov副本识别出禁闭相与退禁闭相两相。\n2. 其主要卖点在于自洽求解Gribov参数间隙方程，将Gribov质量明确表达为其他质量参数与规范耦合的函数，从而透明刻画质量竞争对谱结构的影响。\n3. 这为系统探索拓扑质量项与希格斯机制共同作用下规范理论的相结构提供了约束性参数空间框架。", "summary_source": "deepseek", "authors": [{"name": "Daniel O. R. Azevedo"}, {"name": "Gustavo P. de Brito"}, {"name": "Philipe De Fabritiis"}, {"name": "Antonio D. Pereira"}], "featured_authors": [{"name": "Daniel O. R. Azevedo"}, {"name": "Gustavo P. de Brito"}, {"name": "Philipe De Fabritiis"}, {"name": "Antonio D. Pereira"}], "author_count": 4}, {"id": "2606.05656", "category": "hep-th", "title": "On Quantum Aspects of 1-Form Symmetries I: BV-BRST Cohomology and Anomaly Polynomials", "abstract": "We investigate the quantum aspects of gauging continuous 1-form global symmetries. In this paper, we study the BV-BRST quantization of a $U(1)$ 2-form gauge field, described geometrically by a $U(1)$ gerbe. Starting from the local Čech data of the gerbe, we construct the corresponding infinitesimal symmetry structure in terms of a Lie 2-algebroid, and show that, together with the associated exact Courant algebroid, it provides a natural geometric framework for the BV-BRST complex of this higher-form gauge theory. In this formulation, the field-ghost tower is encoded directly in the local gerbe data, and the higher Russian formula arises naturally from the relations among the connective structure, the curving, and the 3-form curvature. We further show that the resulting Čech-de Rham bicomplex provides a natural setting for anomaly descent for $U(1)$ 1-form symmetries, and illustrate the construction with explicit examples in Maxwell theory.", "url": "https://arxiv.org/abs/2606.05656", "type": "理论", "summary": "1. 该工作利用U(1) gerbe的局部Čech数据，构建了规范连续U(1)1-形式全局对称性的BV-BRST量子化框架。\n2. 其卖点在于以Lie 2-代数与Courant代数描述BV-BRST复形的几何结构，使场-鬼塔直接编码于gerbe数据并自然导出高次Russian公式。\n3. 这为在Čech-de Rham双复形中系统分析1-形式对称性的反常下降提供了理论基础，并在麦克斯韦理论中给出了具体例证。", "summary_source": "deepseek", "authors": [{"name": "Weizhen Jia"}, {"name": "Yi-Nan Wang"}, {"name": "Yi Zhang"}], "featured_authors": [{"name": "Weizhen Jia"}, {"name": "Yi-Nan Wang"}, {"name": "Yi Zhang"}], "author_count": 3}, {"id": "2606.05757", "category": "hep-th", "title": "Detecting Topological Transitions and Anisotropy through Multipartite Entanglement in Holographic Weyl Semimetals", "abstract": "We study multipartite entanglement structures in the zero-temperature holographic Weyl semimetal, focusing on tripartite and four-partite structures. For strip regions, we compute the conditional mutual information, the entanglement wedge cross section, tripartite measures $\\kappa$ and the Markov gap, multi-EWCS, and two multi-EWCS based four-partite signals $\\Delta$ and $g$. These quantities are studied as functions of the strip width $l$ and the tuning parameter across the topological transition. At large $l$, their $l$ dependence takes a power-law form governed by the IR scaling of the system. At fixed large $l$, all these entanglement quantities develop clear features near the critical point, showing that tripartite and four-partite entanglement structures can diagnose the topological quantum phase transition. We further study strips pointing in different directions to probe the anisotropy of the system. The anisotropic large l behavior distinguishes the nontrivial phase from the trivial phase. These results establish multipartite holographic entanglement as a sensitive, nonlocal probe of topological phase transitions and anisotropic IR physics.", "url": "https://arxiv.org/abs/2606.05757", "type": "理论", "summary": "1. 该工作通过计算全息外尔半金属中条带区域的条件互信息、纠缠楔截面、Markov间隙及多体纠缠信号，系统研究了零温下的三方与四方纠缠结构。\n2. 其技术核心在于发现这些纠缠量在大条带宽度下呈现由红外标度决定的幂律行为，且在固定大宽度时于拓扑临界点附近出现清晰特征，从而实现对拓扑相变的诊断。\n3. 该工作建立多体全息纠缠作为灵敏非局域探针，不仅可区分拓扑与平庸相，还能通过各向异性大宽度行为揭示系统的红外各向异性物理。", "summary_source": "deepseek", "authors": [{"name": "Xiantong Chen"}, {"name": "Xuanting Ji"}, {"name": "Wen-Peng Li"}, {"name": "Ya-Wen Sun"}], "featured_authors": [{"name": "Xiantong Chen"}, {"name": "Xuanting Ji"}, {"name": "Wen-Peng Li"}, {"name": "Ya-Wen Sun"}], "author_count": 4}, {"id": "2606.05978", "category": "hep-th", "title": "Lecture notes: Introduction to the Off-shell Double Copy Program", "abstract": "The present notes are based on a series of lectures prepared for an introductory eight-class course on the modern framework of the off-shell double copy. The course was held from April 16 to May 4, 2026, at Universidad de Buenos Aires (UBA). These lectures, aimed at PhD and master's students, are self-contained and require only a basic knowledge of classical field theory. The main goal is to review the fundamental concepts of gauge and gravitational theories in order to explore the off-shell frameworks of the single and double copy. In the final part of the course, we explore modern approaches to reinterpreting the single and double copy within T-duality-invariant frameworks.", "url": "https://arxiv.org/abs/2606.05978", "type": "理论", "summary": "1. 本文以讲义形式系统介绍了离壳双重拷贝程序的基本框架，涵盖规范理论与引力理论的基础概念。\n2. 其核心卖点在于从经典场论出发，自包含地阐释离壳单重与双重拷贝，并拓展至T-对偶不变框架下的现代诠释。\n3. 这为研究生及相关研究者提供了理解离壳双重拷贝的标准化入门路径，并可能启发后续理论构造与形式体系推广。", "summary_source": "deepseek", "authors": [{"name": "Eric Lescano"}], "featured_authors": [{"name": "Eric Lescano"}], "author_count": 1}, {"id": "2606.06221", "category": "hep-th", "title": "Chiral symmetry breaking in models with unconventional supersymmetry", "abstract": "We investigate dynamical mass generation in a geometrically constructed gauge theory based on the super Lie algebra $su(2,2|3)$, in which gravity, Yang-Mills fields, and fermions are unified as components of a single gauge connection. The model contains no elementary scalar fields and no ad hoc four-fermion interactions. Instead, fermionic self-interactions arise unavoidably from the geometric structure of the theory, through nonminimal couplings and torsion associated with the unified connection. Upon reduction to an effective low-energy description, these interactions generate a Nambu-Jona-Lasinio--type potential that triggers chiral symmetry breaking and the formation of a fermion mass gap. In this framework, mass generation emerges as a direct consequence of the underlying gauge-geometric and algebraic structure, rather than as an independent dynamical assumption.", "url": "https://arxiv.org/abs/2606.06221", "type": "理论", "summary": "1. 该工作基于超李代数su(2,2|3)的几何规范理论，研究了无基本标量场情形下由几何结构自然导致的手征对称性破缺与动力学质量生成。\n2. 技术核心在于费米子自相互作用通过非最小耦合和与统一规范连接相关的挠率不可避免产生，并在低能有效描述中形成Nambu–Jona-Lasinio型势。\n3. 这意味着质量生成完全源于底层规范-几何与代数结构，为无需人为假设的费米子质量起源研究提供了内在自洽的框架。", "summary_source": "deepseek", "authors": [{"name": "Pedro D. Alvarez"}, {"name": "Cristian Villavicencio"}, {"name": "Jorge Zanelli"}], "featured_authors": [{"name": "Pedro D. Alvarez"}, {"name": "Cristian Villavicencio"}, {"name": "Jorge Zanelli"}], "author_count": 3}, {"id": "2606.06277", "category": "hep-th", "title": "A note on the 2D NLSM free energy", "abstract": "This note contains the perturbative computation of the 2D non-linear sigma model (NLSM) energy-density in a chemical potential $h$, at the fourth order in the coupling constant expansion. The result is in fully agreement with the $h\\rightarrow \\infty$ asymptotics extracted from the thermodynamical Bethe ansatz (TBA).", "url": "https://arxiv.org/abs/2606.06277", "type": "理论", "summary": "1. 该工作对二维非线性sigma模型在化学势中的能量密度进行了耦合常数四阶微扰计算。\n2. 其核心在于微扰结果与热力学Bethe ansatz推导的强化学势渐近行为完全一致。\n3. 这为可积场论中微扰与非微扰方法的对应提供了明确验证，并暗示了更宽泛的适用性。", "summary_source": "deepseek", "authors": [{"name": "Yizhuang Liu"}], "featured_authors": [{"name": "Yizhuang Liu"}], "author_count": 1}, {"id": "2606.06326", "category": "hep-th", "title": "Spinning bulk-to-boundary correlators in the massless theories with Poincaré symmetry", "abstract": "We classify the bulk-to-boundary correlators for general integer-spin $s$ operators in a Poincaré-invariant theory by imposing suitable fall-off conditions near future/past null infinity. Any bulk-to-boundary correlator is a linear superposition of a set of basic tensor structures fixed by the little group \\text{ISO}(2) of massless particles. We map the independent tensor structures to all possible non-crossing double-line diagrams. A further mapping of the double-line diagrams to circular diagrams shows that all independent tensor structures are tensor products of loop diagrams. By extrapolating the bulk-to-boundary correlators to boundary-to-boundary correlators, we find a rich structure for general spin-$s$ operators. Furthermore, we show that the extrapolated operator lies in a type Ib spin-$s$ multiplet representation of Carrollian conformal field theory (CCFT). This is a net representation that generated by the Wigner translation generators.", "url": "https://arxiv.org/abs/2606.06326", "type": "理论", "summary": "1. 该工作对庞加莱不变无质量理论中整数自旋s算符的体-边界关联子进行分类，通过未来/过去类光无穷远衰减条件将其映射为小群ISO(2)固定的基本张量结构的线性叠加。\n2. 核心技术是将独立张量结构对应至所有非交叉双线图与圆形图，揭示其均为圈图张量积，从而将关联子结构简化为组合图论问题。\n3. 外推至边界-边界关联子显示外推算符属于Carrollian共形场论中由Wigner平移生成元生成的Ib型自旋s多重态净表示，为无质量散射与CCFT的对应提供明确代数基础。", "summary_source": "deepseek", "authors": [{"name": "Jiang Long"}, {"name": "Yu-Xuan Wei"}, {"name": "Xin-Hao Zhou"}], "featured_authors": [{"name": "Jiang Long"}, {"name": "Yu-Xuan Wei"}, {"name": "Xin-Hao Zhou"}], "author_count": 3}, {"id": "2606.06372", "category": "hep-th", "title": "Quantum Geometry from Area Fluctuations", "abstract": "We construct a quantum-statistical analogue of Einstein's fluctuation argument for black-body radiation in the context of causal-diamond geometry. Starting from the phase space of a stretched horizon inside a Minkowski causal diamond, we quantize the Poisson algebra generated by the fields averaged over stretched-horizon time. We then compute the fluctuations of the averaged area density of the transverse two-spheres in a thermal state constructed in analogue with the black-body thermal state. In the null limit, where the stretched horizon approaches the causal-diamond boundary, this yields a thermal fluctuation formula of the boundary area operator that contains two terms, in direct analogue with the black-body radiation. The term quadratic in the expectation value is the ``classical'' contribution, while the linear term has the Verlinde--Zurek scaling characteristic of independent microscopic constituents. In direct analogue with Einstein's interpretation of black-body energy fluctuations as evidence for light quanta, we interpret the linear area-fluctuation term as a statistical signature of discrete quanta of geometry. This provides bottom-up evidence for quantum area degrees of freedom and supports the embadon picture of null quantum geometry.", "url": "https://arxiv.org/abs/2606.06372", "type": "理论", "summary": "1. 该工作基于闵可夫斯基因果钻石内的拉伸视界，量子化其时间平均场生成的泊松代数，并计算热态中横二维球平均面积密度涨落，构建了黑体辐射涨落论证在因果钻石几何中的量子统计类比。\n2. 技术要点在于，当拉伸视界趋近零面极限时，边界面积算符的热涨落公式分解为二次经典项和线性涨落项，后者展示Verlinde-Zurek标度，指示独立微观几何量子组元。\n3. 从统计涨落角度，线性项被解释为几何量子化的自下而上证据，支持零量子几何的embadon描述，并为通过面积涨落实验检验时空量子结构提供启发。", "summary_source": "deepseek", "authors": [{"name": "Jerzy Kowalski-Glikman"}, {"name": "Ludovic Varrin"}], "featured_authors": [{"name": "Jerzy Kowalski-Glikman"}, {"name": "Ludovic Varrin"}], "author_count": 2}, {"id": "2606.06404", "category": "hep-th", "title": "Smooth horizons from topology change in canonical quantum gravity", "abstract": "We propose a resolution of the firewall paradox in JT gravity by incorporating topology change into canonical quantization under relational time evolution. The gravitational Hamiltonian acts on the black hole interior through a pair of pants interaction, mapping between a single interior sector and a connected two interior sector. To describe dynamics in the interior while keeping track of the exterior, we pass to an extended phase space description obtained by splitting the bulk Hilbert space across the event horizon. The split introduces boost edge modes at the horizon, which the Hawking modes become gravitationally dressed to. Covariance of the resulting crossed product algebra provides a precise gravitational realization of the firewall: a one sided boost of the interior edge mode relative to the exterior holding the matter fixed, or equivalently, a relative phase between the interior and exterior Hawking partners holding the edge modes fixed. Although each topology changing transition is exponentially suppressed, evolution over a Page time causes the connected two interior branch to dominate. One of these is the naive semiclassical interior, which we show carries a nontrivial one sided boost upon gluing the interior back to the exterior, and hence a firewall. The other interior is shown to be a zero mode of the one sided boost generator. Gluing the interior back to the exterior quotients by the gravitational constraints, which annihilates the firewall branch. On the surviving branch, we show the horizon vacuum measurement and the early radiation purity measurement become the same Dirac observable. Equivalently, we show that Page time dynamics induces a large diffeomorphism on the connected branch under which the operator algebra of the interior Hawking partner and that of the decoded early radiation are identified.", "url": "https://arxiv.org/abs/2606.06404", "type": "理论", "summary": "1. 该工作通过引入拓扑变化（裤子相互作用）进入正则量子引力，提出在JT引力中解决防火墙悖论的动力学方案。\n2. 其卖点在于利用交叉乘积代数在视界处分裂希尔伯特空间，识别出一侧提升边缘模对应防火墙，并证明Page时间后引力约束湮灭该分支，使视界真空与早期辐射纯度可观测量等价。\n3. 这为黑洞信息悖论提供了新视角，揭示拓扑跃迁与大微分同胚在恢复光滑视界中的关键作用，启发后续对量子引力可观测量的研究。", "summary_source": "deepseek", "authors": [{"name": "Venkatesa Chandrasekaran"}], "featured_authors": [{"name": "Venkatesa Chandrasekaran"}], "author_count": 1}, {"id": "2606.05204", "category": "math-ph", "title": "xCPS: an xAct package for covariant phase space, Noether charges, and entropy", "abstract": "xCPS is an xAct tensor algebra package for symbolic computations within the covariant phase space formalism of field theories. From a generic Lagrangian, xCPS automates the derivation of equations of motion and symplectic currents. It systematically determines whether an infinitesimal transformation in the space of fields is a Noether symmetry and computes the associated Noether charge. Additionally, xCPS can in many cases determine whether a tensorial expression is a divergence and, if so, find its divergence potential. By implementing vertical exterior calculus through a graded, supercommutative wedge product and vertical operators, the package enables efficient computations in gauge theories and higher-derivative models of gravity, including the derivation of thermodynamic quantities like Wald's entropy. xCPS is open-source under the GPL license and available at this https URL .", "url": "https://arxiv.org/abs/2606.05204", "type": "理论", "summary": "1. 该工作发布了基于xAct的张量代数软件包xCPS，用于场论中协变相空间形式的符号计算。\n2. 其核心是通过实现垂直外微分与分次超交换楔积，从任意拉格朗日量自动推导运动方程、辛流、Noether荷并求解散度势，支持规范理论及含高阶导数的引力模型中的热力学量计算。\n3. 这为协变相空间框架下对称性分析与Wald熵等物理量推导提供了高效、开源的自动化工具。", "summary_source": "deepseek", "authors": [{"name": "Juan Margalef-Bentabol"}], "featured_authors": [{"name": "Juan Margalef-Bentabol"}], "author_count": 1}, {"id": "2606.05217", "category": "math-ph", "title": "The Score Hamiltonian: Mapping Diffusion Models to Adiabatic Transport", "abstract": "We exhibit an exact correspondence between sampling with score-based diffusion models and adiabatic transport of ground states for a family of Schrödinger operators we call Score Hamiltonians, built from the learned score's quantum potential. We obtain novel density reconstruction bounds and principled annealing schedules via adiabatic theorems for Fokker-Planck equations with time-varying potentials. We find the fundamental limit of sampling is set by the ratio of squared score-matching error to Score Hamiltonian spectral gap - the inverse Poincaré constant of the data density.", "url": "https://arxiv.org/abs/2606.05217", "type": "理论", "summary": "1. 该工作通过构造称为“得分哈密顿量”的薛定谔算子族，建立了得分扩散模型采样与基态绝热输运之间的精确对应关系。\n2. 其卖点在于利用含时势Fokker-Planck方程的绝热定理导出新型密度重构界限与原理性退火调度，并揭示采样基本极限由得分匹配误差平方与数据密度逆庞加莱常数（即得分哈密顿量谱隙）之比决定。\n3. 这一映射为从量子绝热视角理解扩散模型的收敛速度与算法加速提供了严格框架，并启发利用谱隙分析评估和优化生成模型性能。", "summary_source": "deepseek", "authors": [{"name": "Peter Halmos"}, {"name": "Boris Hanin"}], "featured_authors": [{"name": "Peter Halmos"}, {"name": "Boris Hanin"}], "author_count": 2}, {"id": "2606.05416", "category": "math-ph", "title": "Universal deformations and universal residual stresses in incompressible isotropic Cauchy elasticity", "abstract": "We study universal deformations in incompressible isotropic Cauchy elastic solids with residual stress, without assuming any specific origin for the residual stress. Starting from the constitutive representation of the Cauchy stress as an isotropic tensor-valued function of strain and residual stress, we derive the universality constraints for residually-stressed incompressible isotropic Cauchy elastic solids. We show that for the six known families of universal deformations the set of universal deformations is identical to that of incompressible isotropic elasticity in the absence of residual stress. We also show that residual stress does not enlarge the space of universal deformations. We then determine the universal residual stress fields corresponding to the six known families of universal deformations. Assuming that the residual stress field has the same symmetry as the corresponding universal deformation, the universality constraints reduce to systems of ordinary differential equations that can be solved explicitly. The resulting universal residual stress fields are characterized and discussed for each family.", "url": "https://arxiv.org/abs/2606.05416", "type": "理论", "summary": "1. 该工作研究了不可压缩各向同性柯西弹性固体中普适变形与残余应力的一般关系，未假设残余应力的具体起源。\n2. 卖点在于通过应力-应变-残余应力的张量函数表示，推导出普适性约束，证明残余应力不改变已知六族普适变形，并在对称性假设下显式求解了普适残余应力场。\n3. 这为理解残余应力对弹性体可控变形的影响提供了理论框架，启发后续对含残余应力材料的精确变形分析与实验设计。", "summary_source": "deepseek", "authors": [{"name": "Arash Yavari"}], "featured_authors": [{"name": "Arash Yavari"}], "author_count": 1}, {"id": "2606.05542", "category": "math-ph", "title": "Thermalization with Gaussian Quantum Cellular Automata", "abstract": "We study the long-time dynamics of many-body bosonic lattice systems under translation-invariant Gaussian quantum cellular automata. We formulate two sets of conditions on GQCAs which separately guarantee thermalization of any state on the local Weyl algebra to the infinite temperature state, whenever the state is locally normal and has uniformly bounded particle density. Our main intermediate result is a quantum many-body generalization of the classic Riemann-Lebesgue lemma which is a bound on expectation values of local Weyl operators involving their support and the state's particle density.", "url": "https://arxiv.org/abs/2606.05542", "type": "理论", "summary": "1. 该工作系统研究了平移不变高斯量子元胞自动机下多体玻色子晶格系统的长时间动力学与热化行为。\n2. 其关键贡献在于提出了两组保证任意局部正规且粒子密度均匀有界态热化到无穷温度态的充分条件，并导出了局部Weyl算符期望值的量子多体推广的Riemann-Lebesgue引理。\n3. 这为严格分析非平衡量子多体系统在局域动力学下的热化机制提供了可操作的解析框架。", "summary_source": "deepseek", "authors": [{"name": "Roman Geiko"}, {"name": "Jake Gerenraich"}], "featured_authors": [{"name": "Roman Geiko"}, {"name": "Jake Gerenraich"}], "author_count": 2}, {"id": "2606.05590", "category": "math-ph", "title": "A stochastic model for fog forecasting", "abstract": "Despite significant advancements in parameterizations of boundary layer processes, forecasting, and nowcasting low-level clouds using numerical models remain challenging. The purpose of this study is to test a prototype of a high-resolution stochastic-deterministic model designed to simulate the life cycle of fog cover based on the Ising model from statistical mechanics. The case of advection fog around St. John's Airport in Newfoundland (Canada) has been considered. The model demonstrates promising capabilities in forecasting mean fog cover and replicating the horizontal structure observed in satellite imagery, including bands, rolls, and closed or open cells. We evaluate the model's predictive skill by analyzing its effectiveness in reproducing the evolution of fog cover across three representative cases. A contingency table and associated performance metrics are used to assess its accuracy.", "url": "https://arxiv.org/abs/2606.05590", "type": "理论", "summary": "1. 该工作基于统计力学伊辛模型构建了一种高分辨率随机-确定性原型，用于模拟雾覆盖的生命周期。\n2. 其技术核心在于将随机过程与确定性动力框架相结合，不仅能预报平均雾覆盖率，还成功复制了卫星观测中带状、卷状及胞状等水平结构。\n3. 该随机方法为低云与雾的数值预报提供了新的统计物理建模思路，有望拓展至其他边界层过程的高分辨率模拟。", "summary_source": "deepseek", "authors": [{"name": "Elsa Cardoso-Bihlo"}, {"name": "Boualem Khouider"}], "featured_authors": [{"name": "Elsa Cardoso-Bihlo"}, {"name": "Boualem Khouider"}], "author_count": 2}, {"id": "2606.05973", "category": "math-ph", "title": "Liouville-Preserving Hamiltonian Scattering on Finite Metric Graphs", "abstract": "A metric graph with a mechanical Hamiltonian on each edge does not, by itself, define a deterministic classical motion through a branching vertex: conservation of energy fixes only the outgoing speed, not the outgoing edge-end. We study the deterministic problem obtained after this missing vertex datum is supplied. On each edge $e$, with coordinate $q\\in[0,\\ell_e]$, the Hamiltonian is $H_e(q,p)=p^2/2+V_e(q)$, where $V$is continuous on the graph and $C^2$ on every edge. At each vertex we prescribe an energy-preserving Borel isomorphism from incoming to outgoing nonzero boundary covectors. The resulting phase space is the measurable quotient that identifies each incoming boundary covector with its prescribed outgoing one. After excluding the finitely many energy levels $V(v)$, the edgewise Hamilton equations and the vertex laws concatenate to a global one-parameter group of bimeasurable transformations. The group preserves energy and the quotient measure induced by the edgewise Liouville measures $dq\\,dp$. The proof uses no smooth symplectic structure on the quotient; the invariance follows from ordinary edgewise Liouville invariance, a uniform no-Zeno estimate on compact regular energy windows, and preservation of the transverse Liouville flux $r\\,dr$ by the speedwise vertex permutations. If the vertex laws are compatible with momentum reversal, then the quotient dynamics is reversible. On regular energy surfaces satisfying the usual regular-value condition, the induced time-parametrization measure is invariant as well.", "url": "https://arxiv.org/abs/2606.05973", "type": "理论", "summary": "1. 该工作针对有限度量图上每边具有连续势能的机械哈密顿系统，通过在每个顶点指定能量守恒的Borel同构连接入射与出射边界协向量，定义了确定性全局散射动力学。\n2. 其核心证明无需商空间光滑辛结构，仅依赖边刘维尔测度不变性、正则能窗上的均匀无Zeno估计以及横向刘维尔流r dr在顶点置换下的守恒，从而得到保持能量和诱导商测度的全局双可测变换群。\n3. 该框架为图上的经典哈密顿散射提供了严格的测度论构造，统一了不同顶点散射规律，并自然导出动量反转下的可逆性及正则能量曲面上时间参数化测度的不变性，对量子图半经典极限和遍历性研究具有启示。", "summary_source": "deepseek", "authors": [{"name": "Philip Hierhager"}], "featured_authors": [{"name": "Philip Hierhager"}], "author_count": 1}, {"id": "2606.05197", "category": "quant-ph", "title": "Reply to \"Interpreting Bohm quantum potentials in `Computing quantum waves exactly from classical action'\"", "abstract": "The recent arXiv posting arXiv:2605.20443 by Lohmiller and Slotine attempts to address the omission of the Bohm quantum potential in their proposed exact equivalence between classical action and the Schrödinger equation. They introduce a position-dependent time transformation to argue that the spatial derivatives of the probability density amplitude vanish for the Feynman kernel. A rigorous mathematical examination of this transformation reveals a violation of the multivariable chain rule. The spatial derivatives do not vanish in the physical reference frame. The mathematical framework presented by the authors remains identical to the well-established semiclassical Van Vleck propagator, which is exact exclusively for quadratic potentials.", "url": "https://arxiv.org/abs/2606.05197", "type": "理论", "summary": "1. 本文反驳了Lohmiller与Slotine关于经典作用与薛定谔方程精确等价的论点，指出其引入的位置依赖时间变换违反了多变量链式法则。\n2. 核心论据在于，在物理参考系中概率密度振幅的空间导数并不为零，因此Bohm量子势的省略并不成立。\n3. 该辩护揭示其数学框架实质等同于半经典的Van Vleck传播子，仅对二次势精确，提示了量子经典对应理论的适用边界。", "summary_source": "deepseek", "authors": [{"name": "Gabor Vattay"}], "featured_authors": [{"name": "Gabor Vattay"}], "author_count": 1}, {"id": "2606.05278", "category": "quant-ph", "title": "Frustrated superradiant phases in one- and two-dimensional lattices", "abstract": "Understanding how frustration and symmetry breaking shape collective behavior is a central problem in quantum many-body systems. In this work, we investigate this problem in large one- and two-dimensional arrays of coupled Dicke models on a periodic lattice, where strong light-matter coupling gives rise to a superradiant phase and competition between neighboring order parameters induces spontaneous translational symmetry breaking. Such Dicke lattice models constitute a fundamentally new class of quantum many-body systems, as they simultaneously realize the thermodynamic limit associated with the lattice size and an intrinsic thermodynamic limit arising from collective on-site interactions with quantum emitters. We show that frustration drives photonic density-wave ordering, and that the resulting broken periodicity can be predicted from the excitation spectrum of the symmetric phase, without requiring computationally prohibitive thermodynamic energy minimization. Furthermore, we demonstrate that an emergent Nambu-Goldstone mode arises near the critical point in a one-dimensional chain despite the presence of only discrete symmetry, and uncover the mechanism that enables this otherwise forbidden gapless excitation. We also find quasi-periodic ordering in the superradiant phase, reminiscent of quasicrystals, and demonstrate that synthetic magnetic flux provides a powerful knob to control the nature of translational symmetry breaking. Our results establish a new direction in quantum many-body physics where the coexistence of local and global thermodynamic limits gives rise to unconventional symmetry breaking and emergent collective behavior.", "url": "https://arxiv.org/abs/2606.05278", "type": "理论", "summary": "1. 该工作研究了一维和二维周期晶格上耦合Dicke模型阵列中的阻挫超辐射相及自发平移对称性破缺。\n2. 其核心在于发现阻挫驱动光子密度波有序，且对称相激发谱即可预测破缺周期，无需热力学能量最小化。\n3. 这为在兼具局域与全局热力学极限的量子多体系统中探索非常规对称性破缺及准周期有序提供了新方向。", "summary_source": "deepseek", "authors": [{"name": "Jongjun M. Lee"}, {"name": "Myung-Joong Hwang"}], "featured_authors": [{"name": "Jongjun M. Lee"}, {"name": "Myung-Joong Hwang"}], "author_count": 2}, {"id": "2606.05288", "category": "quant-ph", "title": "Emergent Self-Similar Quantum Revivals in Spiral Drives", "abstract": "We uncover a distinct form of nonequilibrium temporal order: self-similar quantum revivals in a many-body system driven by quasiperiodic spiral kicks, where the system recurrently returns close to its initial state at a hierarchically nested sequence of times. We demonstrate that both the fidelity and entanglement entropy exhibit this self-similar temporal structure. It originates from an emergent dynamical attractor, which we identify, such that all momentum modes eventually fall into the same closed orbits at self-similar times. We analytically justify this behavior and show that, for special momentum modes, this attractor arises as a consequence of a generalized spin echo process, and more generally we prove its existence using quasiperiodic SU(2) cocycles. Interestingly, the dynamics between consecutive revivals supports either volume- or area-law entanglement scaling, tunable via the driving parameters. In the presence of integrability-breaking perturbations, the system eventually heats up, but a long-lived prethermal regime with algebraically tunable lifetime occurs before heating sets in. Our results establish self-similar quantum revivals as a new paradigm for nonequilibrium quantum matter and provide a realistic route for its observation in current quantum simulators.", "url": "https://arxiv.org/abs/2606.05288", "type": "理论", "summary": "1. 该工作揭示了准周期螺旋驱动多体系统中涌现的自相似量子回生现象，系统在层级嵌套时间序列上反复回到初态。\n2. 其核心发现是动力学吸引子使所有动量模在自相似时刻落入闭合轨道，行为源于准周期SU(2)余循环并支持纠缠标度的可调切换。\n3. 这为在量子模拟器中观测具有代数可调预热寿命的新型非平衡量子序提供了直接可行的实验路径。", "summary_source": "deepseek", "authors": [{"name": "Xin-Chi Zhou"}, {"name": "Liang-Hong Mo"}, {"name": "Hongzheng Zhao"}, {"name": "Bastien Lapierre"}], "featured_authors": [{"name": "Xin-Chi Zhou"}, {"name": "Liang-Hong Mo"}, {"name": "Hongzheng Zhao"}, {"name": "Bastien Lapierre"}], "author_count": 4}, {"id": "2606.05294", "category": "quant-ph", "title": "Isospectrality and Operator Complexity", "abstract": "We study a pair of exactly solvable, isospectral fermion chains, one strongly interacting and one quadratic, that nevertheless display remarkably different phase structures and operator dynamics. A nonlocal nonlinear unitary transformation maps one onto the other while preserving the entire many-body spectrum and converting local fermion operators into extended many-body strings. Thus, operators that evolve within a closed linear subspace in the quadratic model become interacting operators that generate increasingly higher-body terms and exhibit asymptotic Lanczos growth $b_n\\propto\\sqrt n$. Despite their identical spectra, the two models realize distinct phases and sharply different notions of operator complexity. Our results demonstrate that free many-body spectra and interacting operator dynamics are fundamentally compatible.", "url": "https://arxiv.org/abs/2606.05294", "type": "理论", "summary": "1. 该工作研究了一对严格可解的等谱费米子链，两者分别具有强相互作用和二次型形式，却展现出截然不同的相结构与算子动力学。\n2. 其卖点在于一个非局域非线性幺正变换在保持全多体谱不变的同时，将局域费米子算符映射为延伸多体弦，使二次型模型中的线性子空间闭合演化转变为产生高阶项的相互作用算子，并呈现渐近Lanczos增长b_n∝√n。\n3. 这揭示了自由多体谱与相互作用算子动力学的根本兼容性，为算子复杂度在不同系统间的本质差异提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Pradip Kattel"}, {"name": "Yicheng Tang"}, {"name": "Natan Andrei"}], "featured_authors": [{"name": "Pradip Kattel"}, {"name": "Yicheng Tang"}, {"name": "Natan Andrei"}], "author_count": 3}, {"id": "2606.05297", "category": "quant-ph", "title": "Continuous-variable ADAPT-VQE for bosonic lattice models", "abstract": "We present a continuous-variable adaptive variational quantum eigensolver (CV-ADAPT-VQE). As concrete examples, we consider the ground-state preparation for (i) the Bose-Hubbard model and (ii) the bosonic Kitaev chain, including its extension with an on-site Kerr interaction. The former conserves the total boson number, while the latter conserves global parity. We construct symmetry-preserving operator pools tailored to each case and show, using GPU-based classical simulations, that CV-ADAPT-VQE results in significantly shallower circuits compared to Hamiltonian-based VQE approaches. Our results point toward direct applications in quantum simulations of condensed-matter systems, quantum chemistry, and high-energy physics.", "url": "https://arxiv.org/abs/2606.05297", "type": "理论+数值", "summary": "1. 该工作提出连续变量自适应变分量子本征求解器（CV-ADAPT-VQE），用以制备Bose-Hubbard模型与玻色子Kitaev链的基态。\n2. 其技术卖点在于构造对称性保持的算子池（如粒子数守恒或宇称守恒），相比基于哈密顿量的VQE，量子电路深度显著降低。\n3. 这为在凝聚态物理、量子化学与高能物理中直接开展玻色子系统的近量子模拟提供了可扩展框架。", "summary_source": "deepseek", "authors": [{"name": "Dimitrios Athanasakos"}, {"name": "Gloria Tejedor-García"}, {"name": "Jack Y. Araz"}, {"name": "Mafalda Ramôa"}, {"name": "Bharath Sambasivam"}, {"name": "Sophia E. Economou"}, {"name": "Felix Ringer"}], "featured_authors": [{"name": "Dimitrios Athanasakos"}, {"name": "Gloria Tejedor-García"}, {"name": "Jack Y. Araz"}, {"name": "Bharath Sambasivam"}, {"name": "Sophia E. Economou"}, {"name": "Felix Ringer"}], "author_count": 7}, {"id": "2606.05311", "category": "quant-ph", "title": "Setting angles in quantum approximate optimization at utility-scale", "abstract": "The quantum approximate optimization algorithm (QAOA) is a powerful heuristic that seeks to solve combinatorial optimization problems using quantum hardware and classical optimization in tandem. Various methods exist to train the parameterized quantum circuits that serve as an ansatz in QAOA. However, which method works best to identify optimal angles for a given problem instance remains poorly understood, especially at utility-scale, i.e., $100$ qubits or more. In this work, we address this challenge through utility-scale benchmarks from which we distill operational guidance for QAOA practitioners. First, we investigate approximation techniques, such as matrix product states and Pauli propagation, to find optimal angles. Second, we train QAOA on small-scale representative problems and transfer the angles to larger ones. We then validate the results on quantum hardware for utility-scale problem instances that can be meaningfully executed. In this way, we identify insights for QAOA angle setting strategies that work best for problems at the utility scale, including as a function of resource cost for the search. Crucially, the operational implications we draw from our benchmarks will help quantum optimization practitioners execute QAOA end-to-end pipelines efficiently on current and future hardware.", "url": "https://arxiv.org/abs/2606.05311", "type": "数值", "summary": "1. 该工作针对实用规模（百量子比特以上）的量子近似优化算法，通过系统基准测试研究了最优角度设置策略。\n2. 主要技术卖点在于比较了矩阵乘积态与Pauli传播等近似方法，以及从小规模向大规模转移角度的有效性，并在量子硬件上验证。\n3. 这为当前及未来量子硬件上QAOA端到端管线的资源高效执行提供了可操作的操作性指南与启发。", "summary_source": "deepseek", "authors": [{"name": "Maosheng Guo"}, {"name": "Joel Jurado Diaz"}, {"name": "Anurag Ramesh"}, {"name": "Conrad J. Haupt"}, {"name": "Alberto Baiardi"}, {"name": "Dimitrios Athanasakos"}, {"name": "M. Emre Sahin"}, {"name": "Oscar Wallis"}, {"name": "George Pennington"}, {"name": "Christian Arenz"}, {"name": "Sebastian Brandhofer"}, {"name": "Georgios Korpas"}, {"name": "Ieva Čepaitė"}, {"name": "J. A. Montañez-Barrera"}, {"name": "Jakub Marecek"}, {"name": "Davide Venturelli"}, {"name": "Stephan Eidenbenz"}, {"name": "David E. Bernal Neira"}, {"name": "Daniel J. Egger"}], "featured_authors": [{"name": "Maosheng Guo"}, {"name": "Joel Jurado Diaz"}, {"name": "Anurag Ramesh"}, {"name": "Stephan Eidenbenz"}, {"name": "David E. Bernal Neira"}, {"name": "Daniel J. Egger"}], "author_count": 19}, {"id": "2606.05397", "category": "quant-ph", "title": "Multi-Qubit Dyadic Phase Fixing for Fault-Tolerant Quantum Compilation", "abstract": "Fault-tolerant quantum computing requires translating application-level quantum circuits into the Clifford+$T$ gate set, where the $T$ gate is the dominant resource cost. Phase kickback is an ancilla-based technique that can dramatically reduce $T$-count for rotations with dyadic angles, but has previously been limited to highly structured circuit families. We present Dyadic Phase Fixing (DPF), a general multi-qubit synthesis tool that extends phase kickback to general quantum circuits. DPF uses numerical unitary synthesis to greedily extract dyadic angle rotations from any input circuit. Combined with a decision matrix to automatically size the final phase gradient register, our end-to-end workflow achieves up to 70% reduction in $T$-count compared to \\texttt{gridsynth} and up to 60% compared to Repeat-Until-Success synthesis on a diverse set of benchmarks. We map these compiled circuits to a surface-code architecture to evaluate space-time volume, demonstrating up to a 60\\% reduction in this metric as well. However, for some circuits and mapping strategies the two metrics diverge significantly, demonstrating that $T$-count alone is a useful but incomplete proxy for fault-tolerant program costs.", "url": "https://arxiv.org/abs/2606.05397", "type": "数值", "summary": "1. 该工作提出Dyadic Phase Fixing方法，将相位反冲技术从结构化电路推广至通用量子电路，实现面向容错编译的Clifford+T门集转换。\n2. 其核心在于利用数值酉合成贪婪提取二进角旋转，并结合决策矩阵自动优化相位梯度寄存器规模，在多样基准上实现T计数最高降低70%、时空体积最高降低60%。\n3. 结果揭示T计数作为容错开销代理的不完备性，表明度量间显著偏离时应综合评估时空体积等实际代价，启发更精细的编译优化策略。", "summary_source": "deepseek", "authors": [{"name": "Justin Kalloor"}, {"name": "Mathias Weiden"}, {"name": "Ed Younis"}, {"name": "John Kubiatowicz"}, {"name": "Costin Iancu"}], "featured_authors": [{"name": "Justin Kalloor"}, {"name": "Mathias Weiden"}, {"name": "Ed Younis"}, {"name": "John Kubiatowicz"}, {"name": "Costin Iancu"}], "author_count": 5}, {"id": "2606.05579", "category": "quant-ph", "title": "A Class of Multipartite Entangled States Based on State Transitions", "abstract": "We introduce Transition states (T states), denoted by $\\ket{T_k^n}$, as a class of multipartite entangled states characterized by a fixed number of state transitions between adjacent qubits. These states form equal-amplitude superpositions over all states with a specified transition count. Unlike Bell states based on two-qubit correlations, GHZ states characterized by global correlations among all qubits, and W and Dicke states based on fixed numbers of qubit excitations, T states are defined by transition counts along an ordered sequence of qubits. We prove that T states are unitarily equivalent to Dicke states through a chain of CX (controlled-X) operations, thereby establishing a direct correspondence between transition-based and excitation-based representations of multipartite entanglement.", "url": "https://arxiv.org/abs/2606.05579", "type": "理论", "summary": "1. 该工作引入并研究了一类由相邻量子比特间状态跃迁次数定义的多体纠缠态——跃迁态（T态），记为|T_k^n>。\n2. 其核心在于证明T态可通过一系列CX操作与Dicke态酉等价，从而在基于跃迁与基于激发的多体纠缠表示间建立直接对应。\n3. 这为多体纠缠态的分类、制备及基于跃迁计数的量子信息协议提供了新视角与实用途径。", "summary_source": "deepseek", "authors": [{"name": "Jehn-Ruey Jiang"}], "featured_authors": [{"name": "Jehn-Ruey Jiang"}], "author_count": 1}, {"id": "2606.05603", "category": "quant-ph", "title": "Quantum Radar Cross Section with two-photon entangled states", "abstract": "We study two-photon entangled states for quantum radar cross section (QRCS), which is an extension of a single-photon QRCS formula. Since signal-idler entanglement does not provide any enhancement of the QRCS [Brandsema's PhD Thesis (2017)], we focus on signal-signal entanglement and derive the corresponding biphoton QRCS. We show that it can provide an enhancement over the single-photon QRCS and two-photon separable QRCS, where the performance is evaluated for various two-dimensional target geometries in monostatic/bistatic configurations. Furthermore, using the double-Gaussian approximation, we derive QRCS formula for biphoton states with arbitrary degree of entanglement and compute the resulting scattering patterns.", "url": "https://arxiv.org/abs/2606.05603", "type": "理论+数值", "summary": "1. 该工作推导了基于信号-信号纠缠的双光子量子雷达截面公式，并分析了单站与双站配置下的二维目标散射特性。\n2. 其核心在于证明信号-信号纠缠可提供超越单光子和可分离双光子QRCS的增强，并借助双高斯近似给出任意纠缠度下的解析表达式。\n3. 这为纠缠态在雷达探测中的性能优势提供了定量理论依据，并启发后续实验验证及纠缠资源在量子雷达中的优化应用。", "summary_source": "deepseek", "authors": [{"name": "Sunghwa Kang"}, {"name": "Jihwan Kim"}, {"name": "Zaeill Kim"}, {"name": "Duk Y. Kim"}, {"name": "Yong Sup Ihn"}, {"name": "Su-Yong Lee"}, {"name": "Sean Crowe"}, {"name": "Stefan Evans"}, {"name": "Marcio de Andrade"}, {"name": "Joanna Ptasinski"}], "featured_authors": [{"name": "Sunghwa Kang"}, {"name": "Jihwan Kim"}, {"name": "Zaeill Kim"}, {"name": "Stefan Evans"}, {"name": "Marcio de Andrade"}, {"name": "Joanna Ptasinski"}], "author_count": 10}, {"id": "2606.05604", "category": "quant-ph", "title": "Decoder-Consistent Hamiltonians for POVM-Based Quantum Relaxations", "abstract": "In compression-based quantum relaxations like QRAO, classical variables are encoded into qubits and decoded after optimization. We formalize that the choice of the quantum Hamiltonian is fundamentally determined by this decoder. By representing the decoder as a POVM, we define a unique decoder-consistent Hamiltonian via the pullback of the post-decoding expected objective value. Using this framework, we reveal that standard QRAO Hamiltonians are inconsistent for certain mixed-degree quadratic functions, and we provide new approximation guarantees for the MaxCut problem based directly on POVM decoder design.", "url": "https://arxiv.org/abs/2606.05604", "type": "理论+数值", "summary": "1. 该工作形式化量子松弛中哈密顿量由解码器决定，通过POVM表示解码器并定义唯一的一致哈密顿量。\n2. 其核心在于揭示标准QRAO哈密顿量对混合度二次函数的不一致性，并基于POVM解码器设计给出MaxCut问题的新近似保证。\n3. 这为量子松弛算法的哈密顿量构建提供了严谨框架，并启发面向具体问题的POVM解码器优化方向。", "summary_source": "deepseek", "authors": [{"name": "Takayuki Suzuki"}], "featured_authors": [{"name": "Takayuki Suzuki"}], "author_count": 1}, {"id": "2606.05690", "category": "quant-ph", "title": "Learning Hamiltonians at Long Times", "abstract": "We study the problem of learning an unknown $n$-qubit Hamiltonian $H$ from $U = e^{-iHt}$ for a single time $t$, where $t$ may be arbitrarily large. For broad families of local Hamiltonians, we prove that, with high probability over $H$ and $t$, any sum of local observables $A$ that is normalized and orthogonal to $H$ satisfies $\\tfrac{1}{2^n}\\|[U(t),A]\\|_F^2 \\geq 1/\\text{poly}(n)$. The Hamiltonian is therefore the unique approximately conserved local observable, and we can efficiently recover $H$, up to scale, as the approximate null vector of a data matrix built from random product-state inputs and classical shadows. As a corollary, we obtain a weak equilibration statement: the infinite-temperature autocorrelation of every sum of local observables orthogonal to $H$ decays by at least an inverse-polynomial amount.", "url": "https://arxiv.org/abs/2606.05690", "type": "理论", "summary": "1. 该工作研究了从长时单次演化U=e^{-iHt}恢复未知n量子比特局域哈密顿量H的问题，证明H是唯一近似守恒的局域观测量。\n2. 其卖点在于证明了任意正交于H的归一化局域观测量和与U(t)的对易子Frobenius范数平方存在1/poly(n)下界，从而可通过随机乘积态输入和经典阴影数据矩阵的近似零向量高效恢复H。\n3. 这为从长时间动力学数据学习哈密顿量提供了严格保证，并直接导出弱平衡化：所有正交于H的局域观测量和的无穷温自关联至少衰减一个逆多项式量。", "summary_source": "deepseek", "authors": [{"name": "Constantin Cedillo Vayson de Pradenne"}, {"name": "Jordan Cotler"}, {"name": "Hsin-Yuan Huang"}], "featured_authors": [{"name": "Constantin Cedillo Vayson de Pradenne"}, {"name": "Jordan Cotler"}, {"name": "Hsin-Yuan Huang"}], "author_count": 3}, {"id": "2606.05777", "category": "quant-ph", "title": "Periodic Symmetry-Adapted Encoding: Qubit Reduction in Crystalline Electronic Structure", "abstract": "We extend the symmetry-adapted encoding (SAE) framework to periodic electronic structure, enabling qubit-efficient quantum simulation of crystalline materials. By constructing a $\\Gamma$-point supercell Hamiltonian from a folded $k$-point calculation and systematically identifying all applicable space-group symmetry generators -- including spin-parity, point-group, and crystal translation symmetries -- we obtain qubit Hamiltonians with fewer qubits than the Jordan--Wigner starting point. We benchmark diamond, silicon, 3C-SiC, MgO, NaCl, CsCl, h-BN, wurtzite AlN, $\\alpha$-quartz SiO$_2$, and MgF$_2$ using active spaces chosen to preserve complete near-degenerate frontier manifolds across cubic, hexagonal, trigonal, and tetragonal space groups. Across the suite the periodic SAE removes 4--8 qubits. The B2 CsCl benchmark realises eight independent Boolean generators, i.e. a symmetry group isomorphic to $\\mathbb{Z}_2^8$, reducing CAS(6,7) from 14 to 6 qubits. This exceeds the $\\mathbb{Z}_2^5$ maximum of molecular SAE, where only two spin parities and at most three independent Boolean point-group generators are available, because the folded crystal supplies three additional half-translation symmetries. Noiseless UCCSD-VQE benchmarks against exact diagonalisation in the active-space sector show that the reduced encodings preserve the target energies to well below chemical accuracy while reducing variational parameter counts by $3$--$8\\times$ and CNOT counts by up to $309\\times$. The largest circuit savings occur when translation and point-group generators act independently in the active space, demonstrating that periodic symmetry can be converted directly into both qubit and ansatz compression. The method is implemented in the open-source QuantumSymmetry package and requires no manual specification of symmetry generators.", "url": "https://arxiv.org/abs/2606.05777", "type": "理论+数值", "summary": "1. 该工作将对称性适应编码推广至周期性电子结构，利用折叠k点计算构造Gamma点超胞哈密顿量并系统识别全部空间群对称生成元，实现晶体量子模拟的量子比特高效压缩。\n2. 其核心卖点在于，通过自旋宇称、点群与晶体平移对称性，在CsCl等体系中获得多达8个独立布尔生成元（同构于Z₂⁸），使CAS(6,7)从14量子比特降至6，超出分子SAE（Z₂⁵）能力，归因于折叠晶体提供额外半平移对称性。\n3. 无噪声UCCSD-VQE基准表明，该编码在保持化学精度内能量的同时减少变分参数3–8倍、CNOT门最高309倍，揭示周期性对称性可直接转化为量子比特与拟设压缩，为近期量子设备上精确模拟晶体材料提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Dario Picozzi"}], "featured_authors": [{"name": "Dario Picozzi"}], "author_count": 1}, {"id": "2606.05815", "category": "quant-ph", "title": "Engineered dissipation for faster adiabatic state preparation", "abstract": "Adiabatic state preparation is often slowed by nonadiabatic leakage near small spectral gaps. We propose an engineered dissipative protocol that uses a filtered reservoir to induce predominantly downward transitions in the instantaneous energy eigenbasis while leaving the instantaneous ground state dark. The leaked population generated by nonadiabatic driving is therefore continuously relaxed back toward the low-energy sector. An effective avoided-crossing analysis shows that in the regime where the engineered relaxation strength is much larger than the minimum gap, the runtime scaling can improve from the closed-system behavior $\\mathcal{O}(\\Delta^{-2})$ to $\\mathcal{O}(\\Delta^{-1})$ Finite-temperature upward transitions introduce a thermal error floor, but the enhancement survives when this heating rate remains below the target error tolerance. Numerical results show improved ground-state preparation over closed-system annealing. We also discuss a possible superconducting-circuit implementation using structured bosonic reservoirs.", "url": "https://arxiv.org/abs/2606.05815", "type": "数值", "summary": "1. 该工作提出一种工程耗散协议，通过滤波库诱导能量本征基中的向下跃迁并保持瞬时基态不受影响，以加速绝热态制备。\n2. 其技术优势在于当工程耗散强度远大于最小能隙时，运行时间标度从闭系统的 \\(\\mathcal{O}(\\Delta^{-2})\\) 改善至 \\(\\mathcal{O}(\\Delta^{-1})\\)，并可通过超导电路中的结构化玻色子库实现。\n3. 该方案为克服非绝热泄漏提供了通用路径，但有限温度向上跃迁引入的误差限制需在目标容错下加以控制，为增强型量子模拟与计算奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Yuanyang Zhou"}, {"name": "Biao Wu"}], "featured_authors": [{"name": "Yuanyang Zhou"}, {"name": "Biao Wu"}], "author_count": 2}, {"id": "2606.05865", "category": "quant-ph", "title": "Symmetry-adapted qubit encoding with complete active space and Bravyi--Kitaev mapping for quantum chemistry on a quantum computer", "abstract": "We present a symmetry-adapted qubit encoding with complete active space (SAE-CAS) for quantum chemistry on fault-tolerant and near-term quantum processors. Building on exact-symmetry encodings, we extend symmetry-adapted mappings to approximate $Z$-symmetries corresponding to frozen-core and virtual orbitals, thereby reducing qubit requirements without significant loss of accuracy. We derive the mapping from the second-quantised Hamiltonian to active-space qubit Hamiltonians, prove its equivalence to the canonical CAS Hamiltonian with frozen-core and virtual-orbital projection, and integrate it with point-group and spin-parity symmetry encodings via affine Clifford transformations to maximise qubit reduction while preserving the target symmetry sector. The same framework also accommodates the Bravyi--Kitaev mapping, yielding an SAE-CAS-BK variant that is unitarily equivalent to SAE-CAS. Numerical benchmarking on nine small molecules using UCCSD and a hardware-efficient shifted-circular-alternating (HE-SCA) ansatz shows that SAE-CAS reduces qubit counts and Pauli-operator weight, yields shallower circuits with fewer parameters, and often accelerates VQE convergence; with HE-SCA it consistently reaches CAS reference energies in cases where JW-CAS does not converge within the tested budgets. We provide an open-source implementation in the Python package QuantumSymmetry. SAE-CAS offers a route to resource-efficient molecular simulations on fault-tolerant and near-term quantum processors.", "url": "https://arxiv.org/abs/2606.05865", "type": "理论+数值", "summary": "1. 该工作提出了一种对称性适应的量子比特编码方法，结合完整活性空间（SAE-CAS）和Bravyi–Kitaev映射，用于容错及近期量子处理器上的量子化学计算。\n2. 其技术核心在于将精确对称性编码扩展至近似Z对称性（冻结芯和虚轨道），并通过仿射Clifford变换集成点群与自旋宇称对称性，在保持目标对称性扇区的同时最大化量子比特缩减，且SAE-CAS-BK变体与之幺正等价。\n3. 数值基准测试表明，SAE-CAS在小分子上降低了量子比特数和泡利算符权重，生成更浅电路和更少参数，并加速VQE收敛，为资源高效的分子模拟提供了可扩展的编码框架。", "summary_source": "deepseek", "authors": [{"name": "Dario Picozzi"}, {"name": "Jonathan Tennyson"}], "featured_authors": [{"name": "Dario Picozzi"}, {"name": "Jonathan Tennyson"}], "author_count": 2}, {"id": "2606.05904", "category": "quant-ph", "title": "Non-equilibrium quantum thermodynamics of a memory-bearing open-system process", "abstract": "We show the emergence of memory effects in the dynamics of a driven two-level system interacting with a composite environment, and analyze their influence on work, heat and entropy production. We further investigate how the interplay between driving, dissipation and memory effects, stemming from the finiteness of the environment, shapes the thermodynamic response of the system, thus providing insight into quantum thermodynamics beyond the Markovian approximation.", "url": "https://arxiv.org/abs/2606.05904", "type": "理论", "summary": "1. 该工作研究了具有记忆效应的非平衡开放系统量子热力学过程，分析了驱动二能级系统与复合环境相互作用中功、热及熵产生的演化。\n2. 其卖点在于揭示了由环境有限性导致的记忆效应如何与驱动和耗散共同塑造系统的热力学响应，从而超越马尔可夫近似。\n3. 这为理解非马尔可夫开放系统中的量子热力学提供了基础，并对量子热机及量子信息处理中的记忆效应研究具有明确启发意义。", "summary_source": "deepseek", "authors": [{"name": "Biagio G. Banigi"}, {"name": "Eric Lutz"}, {"name": "Mauro Paternostro"}], "featured_authors": [{"name": "Biagio G. Banigi"}, {"name": "Eric Lutz"}, {"name": "Mauro Paternostro"}], "author_count": 3}, {"id": "2606.05928", "category": "quant-ph", "title": "Broadband AC Magnetic Field Sensing via Continuous wave optically detected magnetic resonance with NV Centers in diamond", "abstract": "The nitrogen-vacancy (NV) center in diamond has attracted considerable attention as a highly sensitive quantum sensor that can operate at room temperature. In particular, continuous-wave optically detected magnetic resonance (CW-ODMR) is promising for a wide range of applications because of its simplicity. However, conventional AC magnetic-field sensing schemes based on CW-ODMR suffer from a limited detection bandwidth: the detectable frequency is either fixed by intrinsic physical parameters of the NV center or, even when tunable, restricted to a narrow range of only a few MHz. Here, we propose a broadband AC magnetometry scheme based on CW-ODMR with NV centers using microwave-driven dressed this http URL theoretical analysis and numerical simulations, we show that the proposed scheme enables the detection of AC magnetic fields with frequencies up to the order of 100 MHz, which has been difficult to achieve using conventional CW-ODMR-based methods.", "url": "https://arxiv.org/abs/2606.05928", "type": "数值", "summary": "1. 该工作提出了一种基于金刚石NV色心连续波光探测磁共振的宽带交流磁传感方案。\n2. 其核心卖点在于利用微波驱动修饰态，突破了传统方法检测带宽仅数MHz的限制，实现了高达100 MHz的交流磁场频率检测。\n3. 这为基于NV色心的宽频磁传感应用提供了可行的技术途径，并可能拓展至其他固态量子传感器。", "summary_source": "deepseek", "authors": [{"name": "Ryohei Dokai"}, {"name": "Ryusei Okaniwa"}, {"name": "Miku Ishizaki"}, {"name": "Junko Ishi-Hayase"}, {"name": "Yuichiro Matsuzaki"}], "featured_authors": [{"name": "Ryohei Dokai"}, {"name": "Ryusei Okaniwa"}, {"name": "Miku Ishizaki"}, {"name": "Junko Ishi-Hayase"}, {"name": "Yuichiro Matsuzaki"}], "author_count": 5}, {"id": "2606.05947", "category": "quant-ph", "title": "Double-bracket quantum algorithms for thermal state preparation", "abstract": "We propose quantum algorithms for preparing thermal states via the simulation of the thermofield double states. The key idea is to leverage double-bracket quantum algorithms to implement imaginary-time evolution on thermofield double states, whose reduced state realizes the Gibbs state. Our method, termed double-bracket thermofield double (DB-TFD), introduces two variants. The first, the vanilla DB-TFD algorithm, directly implements imaginary-time evolution using double-bracket quantum imaginary-time evolution. The second, poly DB-TFD, employs double-bracket quantum signal processing to approximate the imaginary-time evolution operator via a polynomial transformation. We demonstrate that the complexity of the poly DB-TFD algorithm scales exponentially with the inverse temperature in a broad practical regime. This scaling is consistent with existing methods, and numerical simulations support the corresponding theoretical bound. We further demonstrate the utility of DB-TFD in quantum Boltzmann machines for generative modeling, achieving improved performance compared with variational imaginary-time evolution approaches. These results establish DB-TFD as a promising route for thermal state preparation in the near-term and early-fault-tolerant regimes.", "url": "https://arxiv.org/abs/2606.05947", "type": "理论+数值", "summary": "1. 该工作提出基于热场双态模拟的双括号量子算法，通过虚时演化实现吉布斯态制备。\n2. 其核心在于引入双括号量子虚时演化和双括号量子信号处理两种变体，后者以多项式变换逼近虚时演化算子且复杂度随逆温指数增长。\n3. 这为近中期及早期容错量子设备上的热态制备及量子玻尔兹曼机优化提供了可行性方案。", "summary_source": "deepseek", "authors": [{"name": "Andrew Wright"}, {"name": "Reyhaneh Aghaei Saem"}, {"name": "Supanut Thanasilp"}, {"name": "Yudai Suzuki"}, {"name": "Zoë Holmes"}], "featured_authors": [{"name": "Andrew Wright"}, {"name": "Reyhaneh Aghaei Saem"}, {"name": "Supanut Thanasilp"}, {"name": "Yudai Suzuki"}, {"name": "Zoë Holmes"}], "author_count": 5}, {"id": "2606.05955", "category": "quant-ph", "title": "Magnetic flux as a quantized Lorentz pseudoscalar and its relation to electric charge quantization", "abstract": "In this paper, we re-examine the well-known question of why electric charges exist only in quantized portions. In this context, we revisit the motion of a charged particle in a field-free region around a current-carrying solenoid. Solving the corresponding Schrödinger equation leads to a simultaneous quantization condition for the magnetic flux and the electric charge. We also demonstrate the Lorentz invariance of this condition by showing that the magnetic flux behaves like a pseudoscalar under Lorentz transformations.", "url": "https://arxiv.org/abs/2606.05955", "type": "理论", "summary": "1. 该工作重新审视电荷量子化问题，通过求解螺线管外无场区带电粒子的薛定谔方程，导出磁通量与电荷的同时量子化条件。\n2. 其核心在于证明磁通量在洛伦兹变换下表现为赝标量，从而揭示量子化条件的洛伦兹不变性。\n3. 这为理解电荷量子化的几何与对称性起源提供了新视角，并可能启发对磁通与电荷关联普适性的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Cyril Belardinelli"}], "featured_authors": [{"name": "Cyril Belardinelli"}], "author_count": 1}, {"id": "2606.05968", "category": "quant-ph", "title": "Shattering the Symmetry Trap in Fixed-Ansatz VQE: An Accelerated ADAPT-VQE Study of Three Pillar Molecules under Bravyi-Kitaev Mapping", "abstract": "Fixed-ansatz Variational Quantum Eigensolvers (VQE), such as the Unitary Coupled Cluster with Singles and Doubles (UCCSD) framework, frequently suffer from severe initialization paralyzation and zero-gradient traps when evaluated using the non-local Bravyi-Kitaev (BK) fermion-to-qubit mapping. In this work, we systematically demonstrate how the Adaptive Derivative-Assembled Pseudo-Trotter (ADAPT-VQE) framework shatters these structural limitations across three distinct electronic and geometric molecular pillars: Lithium Hydride ($\\text{LiH}$), Hydrogen Fluoride ($\\text{HF}$), and Water ($\\text{H}_2\\text{O}$), under heavily stretched or asymmetric multi-reference configurations. While conventional UCCSD-VQE flatlines completely at a zero energy shift ($0.000000$~Ha) due to global phase cancellations inherent to the BK tree structures, our dynamic ADAPT-VQE loop successfully isolates the dominant symmetry-breaking operators using analytical commutator gradients. To bypass the severe $\\mathcal{O}(N^3)$ computational bottlenecks of dense matrix exponentiation and Singular Value Decomposition on larger registers, we implement a highly optimized, vector-based Taylor series expansion state-evolution engine. Our numerical results show that the accelerated ADAPT-VQE framework achieves instant, exact Full Configuration Interaction (FCI) convergence within the very first macro-cycle across all three molecular systems, maintaining absolute numerical stability up to a 12-qubit register space. This study establishes a robust, hardware-efficient path for simulating strongly correlated, highly polarized triatomic chemical environments on near-term local architectures.", "url": "https://arxiv.org/abs/2606.05968", "type": "理论+数值", "summary": "1. 该工作利用加速ADAPT-VQE框架，在Bravyi-Kitaev非局域映射下系统模拟LiH、HF与H₂O三种分子在拉伸及不对称多参考构型中的电子结构，证明其能打破固定拟设UCCSD-VQE因全局相位取消导致的对称性陷阱与零梯度瘫痪。\n2. 核心卖点在于通过解析对易子梯度动态提取主导对称性破缺算子，并以矢量化泰勒级数展开状态演化引擎替代稠密矩阵指数与奇异值分解，绕过O(N³)计算瓶颈，使系统在12量子比特范围内于首个宏周期内精确收敛至全组态相互作用能量。\n3. 这为在近端局域量子硬件上高效模拟强关联、强极化多原子分子建立了鲁棒且硬件高效的路径，并启发将动态拟设方法推广至更大化学体系与凝聚态模型的研究。", "summary_source": "deepseek", "authors": [{"name": "Hermawan Kresno Dipojono"}], "featured_authors": [{"name": "Hermawan Kresno Dipojono"}], "author_count": 1}, {"id": "2606.06019", "category": "quant-ph", "title": "Polymer quantum mechanics on compact configuration spaces", "abstract": "\"Polymer quantum mechanics\" is the name given to a quantization scheme inspired by loop quantum gravity in which the configuration space of the theory is chosen to have a discrete topology. Polymer quantization yields a representation of the canonical commutation relations that is genuinely distinct from the conventional \"Schrödinger\" representation. In this paper, we summarize the main features of polymer quantum mechanics and investigate in detail the polymer quantization of systems with configuration spaces that are classically compact. We show explicitly how using the standard construction of polymer states leads to a Hilbert space of states defined on a finite graph of points. By way of example, we find the exact energy eigenvalues and eigenfunctions for a particle on a ring and a particle in a box defined on such lattices, and discuss similarities and differences from standard Schrödinger quantum mechanics. We also explore the continuum limit of states in these systems, and demonstrate in detail how the exact eigenfunctions in the position representation approach their continuum counterparts.", "url": "https://arxiv.org/abs/2606.06019", "type": "理论", "summary": "1. 该工作系统总结了聚合物量子力学方案，并具体研究了位形空间为紧致情形下的量子化，展示标准构造导致希尔伯特空间定义于有限图点上。\n2. 其核心在于揭示紧致位形空间中聚合物量子化的精确能谱与波函数，并与标准薛定谔量子力学在离散格点上进行显式对比。\n3. 这为理解圈量子引力启发下的离散拓扑理论向连续极限的过渡提供了可解析处理的范例。", "summary_source": "deepseek", "authors": [{"name": "Maxwell R. Siebersma"}, {"name": "Basie Seibert"}, {"name": "Samuel Shuman"}, {"name": "David A. Craig"}], "featured_authors": [{"name": "Maxwell R. Siebersma"}, {"name": "Basie Seibert"}, {"name": "Samuel Shuman"}, {"name": "David A. Craig"}], "author_count": 4}, {"id": "2606.06070", "category": "quant-ph", "title": "Efficient Quantum Circuit Construction of Controlled Time-Evolution for Arbitrary Pauli-Sum Hamiltonians", "abstract": "Controlled time-evolution circuits select forward or backward Hamiltonian time evolution according to the state of an ancilla qubit. They are fundamental building blocks in quantum eigenvalue transformation of unitaries, Hamiltonian filtering, and related quantum algorithms. A direct realization adds ancilla control to the elementary gates of the time-evolution circuit and therefore increases the two-qubit gate count, compiled T depth and CX depth. We develop an efficient recursive algorithm that, for an arbitrary Pauli-sum Hamiltonian, partitions the input Pauli terms into groups and assigns to each group a sign-flip Pauli string that anti-commutes with the in-group terms, thereby removing ancilla control from the grouped time-evolution blocks. Numerical benchmarks on random Hamiltonians and structured spin Hamiltonians show reductions in compiled T depth and compiled CX depth. For a Kagome Hamiltonian with 24 spins under full connectivity, the proposed construction reduces the compiled T depth by 85.2% and the compiled CX depth by 68.9%, compared with a conventional implementation that decomposes the Hamiltonian into individual Pauli terms and implements the controlled time evolution of each term by directly adding the ancilla qubit to the corresponding Pauli-rotation circuit.", "url": "https://arxiv.org/abs/2606.06070", "type": "理论+数值", "summary": "1. 该工作提出一种递归算法，将任意泡利和哈密顿量的受控时间演化线路按泡利项分组，并为每组分配反对易符号翻转泡利字符串。\n2. 其卖点在于去除分组时间演化块中辅助量子比特的控制，从而避免两量子比特门数及编译T深度与CX深度上升。\n3. 这为量子特征值变换、哈密顿量滤波等算法的低开销量子实现提供了可扩展的构造方案。", "summary_source": "deepseek", "authors": [{"name": "Shintaro Fujiwara"}, {"name": "Naoki Yamamoto"}, {"name": "Naoki Ishikawa"}], "featured_authors": [{"name": "Shintaro Fujiwara"}, {"name": "Naoki Yamamoto"}, {"name": "Naoki Ishikawa"}], "author_count": 3}, {"id": "2606.06107", "category": "quant-ph", "title": "Deployed trusted-node quantum key distribution over 300 km with a multi-core fiber access link", "abstract": "Quantum key distribution (QKD) is increasingly considered for deployment in realistic communication networks, where long distances, heterogeneous fiber infrastructure, and coexistence with classical traffic present substantial challenges. Here, we demonstrate trusted-node QKD between Linköping University and the Stockholm hub of the Swedish national quantum communication infrastructure over 270 km of deployed single-mode fiber, extended by a 33 km multi-core fiber (MCF) segment emulating a metropolitan access link, for a
