  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);

      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2606.05210", "category": "cond-mat", "title": "Superconducting Triple Point in UTe$_2$: Thermodynamics and Symmetry", "abstract": "Three lines of second-order phase transitions between the normal phase and two distinct superconducting phases meet at a single point on the phase diagram of UTe$_2$. Contrary to common belief, there are no thermodynamic constraints for such triple points. The phase diagram is interpreted within Landau theory in terms of two superconducting order parameters with different gauge symmetries. Such an interpretation is unique under the assumption of spatial uniformity.", "url": "https://arxiv.org/abs/2606.05210", "type": "理论+数值", "summary": "1. 本工作通过热力学测量和对称性分析，证实UTe2相图中正常相与两个不同超导相之间的三条二级相变线交汇于一点，构成超导三相点。\n2. 其核心在于发现该三相点虽违反常见认知但不存在热力学约束，并基于空间均匀假设，利用Landau理论将其唯一地归因于两个具有不同规范对称性的超导序参量。\n3. 这一发现为理解UTe2的多组分超导配对机制以及探索其他非常规超导体中类似拓扑相图提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "L.A.Melnikovsky"}], "featured_authors": [{"name": "L.A.Melnikovsky"}], "author_count": 1}, {"id": "2606.05231", "category": "cond-mat", "title": "Nambu Nonequilibrium Thermodynamics and the Lyapunov Structure of Open Systems", "abstract": "In open nonequilibrium systems, the thermodynamic entropy of a subsystem is not generally a Lyapunov function. Even during relaxation toward equilibrium, it may decrease temporarily because of exchanges with external reservoirs. This raises a basic question: what thermodynamic quantity, if any, organizes irreversible relaxation in an open system? We address this question using an explicit open-piston model coupled to both a pressure reservoir and a heat bath. The reversible sector is formulated as a Nambu rotational flow generated by the extended energy and the subsystem entropy, while the irreversible sector is written as a gradient flow generated by a dissipation potential $S_{NB}$. In the adiabatic reversible limit, the Nambu bracket produces the oscillatory piston motion on the intersection of conserved level surfaces. After coupling to a heat bath and adding friction, the subsystem entropy $S$ can exhibit nonmonotonic oscillations, whereas $S_{NB}=S-H_{1}/T_{b}$ increases monotonically under the proposed positive-semidefinite dissipative structure. We show that this monotonicity is not a consequence of identifying $S_{NB}$ with thermodynamic entropy. Rather, it follows from two geometric conditions: the reversible Nambu flow preserves $S_{NB}$, and the irreversible dynamics can be written as a positive-semidefinite gradient flow generated by $S_{NB}$. The open-piston model therefore provides a minimal macroscopic realization in which thermodynamic entropy, dissipation potential, reversible temporal order, and irreversible relaxation can be separated explicitly.", "url": "https://arxiv.org/abs/2606.05231", "type": "理论", "summary": "1. 该工作通过一个开活塞模型，明确了开放非平衡系统中耗散势 \\(S_{NB}\\) 在特定几何结构下可作为支配不可逆弛豫的Lyapunov函数。\n2. 其核心卖点在于将可逆流表述为Nambu旋转流、不可逆流表述为 \\(S_{NB}\\) 生成的正半定梯度流，并证明 \\(S_{NB}\\) 单调递增源于可逆流保持 \\(S_{NB}\\) 与梯度流形式这两个几何条件，而非其等同于热力学熵。\n3. 该模型为在宏观层面分离可逆时间序与不可逆弛豫提供了最小实现，并为非平衡系统Lyapunov结构的几何构造和广义热力学理论提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "So Katagiri"}], "featured_authors": [{"name": "So Katagiri"}], "author_count": 1}, {"id": "2606.05293", "category": "cond-mat", "title": "Breakdown of Thermalization from Real-Time Dynamics in the Two-Dimensional Hubbard Model", "abstract": "Thermalization in strongly correlated fermionic systems remains a central open problem in quantum many-body physics. In this work, we investigate the real-time dynamics and the approach to thermalization in the two-dimensional Hubbard model, a paradigmatic framework for correlated electrons, relevant to high-temperature superconductivity and ultracold quantum simulation. Focusing on the half-filled square lattice, we monitor the time evolution of the double occupancy following a quench in the on-site interaction $U$, and assess whether its long-time value is captured by a canonical thermal ensemble. We employ time-dependent variational Monte Carlo methods combined with transformer-based Neural-Network Quantum States to accurately describe the nonequilibrium dynamics of fermions, especially for the behavior at long times, thereby accessing regimes that were previously inaccessible to numerical simulations. Our results reveal two distinct dynamical behaviors: for weak to intermediate interactions, the long-time double occupancy agrees with the thermal prediction, consistent with ergodic relaxation; beyond a critical interaction $U_{C}$, the dynamics deviate markedly from the thermal expectation, revealing clear signatures of thermalization breaking. These results establish numerical simulation as a powerful tool to probe nonequilibrium quantum phenomena in correlated fermionic matter.", "url": "https://arxiv.org/abs/2606.05293", "type": "理论+数值", "summary": "1. 该工作利用时间相关变分蒙特卡洛与transformer神经量子态，实时模拟半满二维哈伯德模型在相互作用淬火后双占据数的长时间演化。\n2. 其技术卖点在于以神经网络量子态精确描述费米子非平衡动力学，进而发现弱至中等相互作用时热化成立，而超过临界U_C则出现明显热化破坏。\n3. 这为数值研究强关联费米子非平衡现象提供了可靠方法，并对超冷量子模拟与高温超导机制探索具有重要启发。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Sinibaldi"}, {"name": "Luciano Loris Viteritti"}, {"name": "Riccardo Rende"}, {"name": "Fakher F. Assaad"}, {"name": "Giuseppe Carleo"}], "featured_authors": [{"name": "Alessandro Sinibaldi"}, {"name": "Luciano Loris Viteritti"}, {"name": "Riccardo Rende"}, {"name": "Fakher F. Assaad"}, {"name": "Giuseppe Carleo"}], "author_count": 5}, {"id": "2606.05302", "category": "cond-mat", "title": "Magnetochiral anisotropy in strained superconducting transition metal dichalcogenides", "abstract": "We present a theoretical study of nonreciprocal charge transport in two-dimensional noncentrosymmetric superconductors, focusing on transition-metal dichalcogenide MoS$_2$ as a representative example. In the normal state, the electrical response of a material to the relative orientation of the current and magnetic field is suppressed to leading order in the symmetry-breaking perturbations. In the vicinity of the superconducting transition, magnetochiral anisotropy is strongly enhanced. We consider contributions to the nonreciprocal current originating from order-parameter fluctuations and quantum-interference processes. These terms are linked to higher-order Lifshitz invariants generically allowed in the Ginzburg-Landau free energy of superconductors with broken inversion and time-reversal symmetries. We further show that strain enables additional vector components in the nonlinear current response.", "url": "https://arxiv.org/abs/2606.05302", "type": "理论", "summary": "1. 该工作以MoS₂为代表，理论研究了应变二维非中心对称超导体中的非互易电荷输运。\n2. 其核心在于揭示超导转变附近磁手征各向异性源于序参量涨落与量子干涉过程，与Ginzburg-Landau自由能中高阶Lifshitz不变量相关联，且应变引入非线性响应的额外矢量分量。\n3. 这为理解二维超导体中对称性破缺驱动的非互易输运机制提供了理论框架，并启发通过应变工程调控该类各向异性。", "summary_source": "deepseek", "authors": [{"name": "Joaquim Telles de Miranda"}, {"name": "Maxim Khodas"}, {"name": "Alex Levchenko"}], "featured_authors": [{"name": "Joaquim Telles de Miranda"}, {"name": "Maxim Khodas"}, {"name": "Alex Levchenko"}], "author_count": 3}, {"id": "2606.05325", "category": "cond-mat", "title": "Hydrogen-induced lattice cohesion weakening favors atomic displacement", "abstract": "Atomic displacement -- the fundamental process underlying diverse deformation and damage phenomena in metals, from irradiation defect production to stress-driven dislocation motion -- is governed by interatomic cohesion strength. Here, lattice-dissolved hydrogen (LDH) occurring in metals under direct hydrogen exposure is identified to effectively weaken lattice cohesion, and thereby facilitating atomic displacement and dislocation movement upon plastic deformation in sub-threshold stress regime. This atomic-scale insight provides a physically transparent mechanism for hydrogen-enhanced localized plasticity implicated in hydrogen embrittlement. We quantitatively verify the hydrogen-induced lattice cohesion weakening effect on metal surfaces exposed to low-energy hydrogen plasma, where massive defects are generated despite the absence of sufficient ion momentum for direct displacement damage. By unprecedentedly quantifying the cohesion-weakening effect of LDH independently from defect-trapped H, we establish a new paradigm to understand hydrogen embrittlement.", "url": "https://arxiv.org/abs/2606.05325", "type": "数值", "summary": "1. 该工作揭示晶格溶解氢通过弱化金属内聚力，在亚阈值应力下促进原子位移与位错运动，为氢致局部塑性增强提供物理机制。\n2. 其关键技术在于区分晶格溶解氢与缺陷捕获氢的贡献，并利用低能氢等离子体暴露实验定量验证内聚弱化效应。\n3. 这为理解氢脆建立新范式，并启发金属材料在氢环境下的形变与损伤行为的精确建模与抑制策略。", "summary_source": "deepseek", "authors": [{"name": "Liang Gao"}, {"name": "Yiran Mao"}, {"name": "Markus Wilde"}, {"name": "Xiaoou Yi"}, {"name": "Cong Li"}, {"name": "Shiwei Wang"}, {"name": "Thomas Schwarz-Selinger"}, {"name": "Jan Coenen"}, {"name": "Richard Kembleton"}, {"name": "Sebastijan Brezinsek"}, {"name": "Christian Linsmeier"}, {"name": "Guanghong Lu"}], "featured_authors": [{"name": "Liang Gao"}, {"name": "Yiran Mao"}, {"name": "Markus Wilde"}, {"name": "Sebastijan Brezinsek"}, {"name": "Christian Linsmeier"}, {"name": "Guanghong Lu"}], "author_count": 12}, {"id": "2606.05349", "category": "cond-mat", "title": "Opinion dynamics on social proximity disordered networks", "abstract": "Understanding how local social pressure shapes collective opinion formation is essential in modern society, with implications in sociology, politics, finance, and technology. Complex networks are a powerful framework for investigating these processes and for representing social interactions in emergent phenomena, and canonical models such as random, scale-free, and small-world networks remain most relevant when Euclidean geometric proximity and contiguous interactions are not the dominant organizing factors. Our investigation explores the effects of Gabriel graphs, a spatially embedded network that utilizes proximity-based interactions, on social opinion dynamics. Using a geometric disorder parameter that randomly displaces agent coordinates, we transition from square lattices of social interactions to spatial random networks that preserve local constraints while introducing strong topological heterogeneity. Opinion dynamics operate through social pressure, with a level of nonconformity that affects dissent among opinions. We analyze magnetization, susceptibility, and Binder's fourth-order cumulant to characterize the emergence and breakdown of global social consensus. The model exhibits second-order phase transitions whose behavior depends on both geometric disorder and nonconformity levels. We use volumetric scaling and provide a reference frame appropriate for characterizing criticality in regular and heterogeneous interaction topologies. We find that the standard critical exponents remain compatible with the two-dimensional Ising universality class. Furthermore, the results suggest that spatially constrained, planar, and globally connected interaction topologies preserve the dimensionality of space in critical dynamics analysis.", "url": "https://arxiv.org/abs/2606.05349", "type": "理论", "summary": "1. 该工作构建基于Gabriel图的空间邻近网络，引入几何无序参数实现从规则格子到异质随机拓扑的连续过渡，研究社会压力与非一致性参数对集体意见形成中二级相变的调控作用。\n2. 其核心在于采用体积缩放结合磁化率、Binder累积量等统计工具进行临界分析，发现临界指数与二维Ising普适类一致，证明空间约束的平面全局连接拓扑在动力学中保留了有效维度。\n3. 这为社会压力驱动下共识涌现与崩溃提供了普适类标度框架，并为复杂网络上意见动力学从规则到异质网络临界现象的统一定量描述奠定了参考。", "summary_source": "deepseek", "authors": [{"name": "Fellipe Aranha"}, {"name": "Giuliano G. Porciúncula"}, {"name": "Adauto J. F. de Souza"}, {"name": "Paulo R. A. Campos"}, {"name": "André L. M. Vilela"}], "featured_authors": [{"name": "Fellipe Aranha"}, {"name": "Giuliano G. Porciúncula"}, {"name": "Adauto J. F. de Souza"}, {"name": "Paulo R. A. Campos"}, {"name": "André L. M. Vilela"}], "author_count": 5}, {"id": "2606.05502", "category": "cond-mat", "title": "Complexity of the Laughlin wave function from the Dyson-orbital perspective", "abstract": "The Fermi sea is a simple and common concept in physics. However, a related and equally simple concept -- the Dyson orbital -- is far less discussed in physics, especially in textbooks. Yet, Dyson orbitals offer a valuable tool for characterizing the complexity of a fermionic wave functions, particularly in distinguishing between Fermi-sea-like and non-Fermi-sea-like states. As a preliminary application, we examine the Laughlin wave function and find the fortunate fact that the Dyson orbitals can be determined analytically. Further numerical data provides \\emph{quantitative} evidence that the Laughlin wave function describes a strongly correlated, non-Fermi liquid state.", "url": "https://arxiv.org/abs/2606.05502", "type": "数值", "summary": "1. 该工作从Dyson轨道视角解析了Laughlin波函数的复杂度，并展示了其与费米海型波函数的本质区别。\n2. 其核心在于通过解析求得Laughlin态的Dyson轨道，并辅以数值证据定量证明了该波函数描述的是强关联非费米液体态。\n3. 这一Dyson轨道框架为区分费米海型与非费米海型波函数提供了新工具，可推广至其他强关联费米子体系的分析。", "summary_source": "deepseek", "authors": [{"name": "J. M. Zhang"}, {"name": "Y. Liu"}], "featured_authors": [{"name": "J. M. Zhang"}, {"name": "Y. Liu"}], "author_count": 2}, {"id": "2606.05746", "category": "cond-mat", "title": "Majorana-like fermion physics: Emergence of topologically protected vortical states in graphene interacting with an electromagnetic field", "abstract": "Within the framework of a quasi-relativistic model of graphene that admits topologically nontrivial Majorana-like quasiparticle excitations, appearance of such vortex states in the frequency dependencies of the complex dielectric permittivity of the system subjected to an external electromagnetic field has been examined. The vortex graphene states possess topological charges (flavours ) being nonzero Zak phases. Interaction effects of Majorana-like modes have been qualitatively related to the formation of Fano resonances in the optical response. The constructed topological model of graphene may be considered as a toy model of three-flavour mass-neutrino oscillations.", "url": "https://arxiv.org/abs/2606.05746", "type": "理论", "summary": "1. 在允许拓扑非平凡类Majorana准粒子激发的准相对论石墨烯模型中，研究外加电磁场下系统复介电常数的频率响应中出现的涡旋态。\n2. 这些涡旋态携带非零Zak相位作为拓扑荷（味），且类Majorana模式的相互作用通过光学响应中的Fano共振定性体现。\n3. 该拓扑模型可作为三味质量中微子振荡的玩具模型，为凝聚态与高能物理中拓扑量子模拟提供跨学科启发。", "summary_source": "deepseek", "authors": [{"name": "H. V. Grushevskaya"}, {"name": "George Krylov"}], "featured_authors": [{"name": "H. V. Grushevskaya"}, {"name": "George Krylov"}], "author_count": 2}, {"id": "2606.05803", "category": "cond-mat", "title": "Strong Optical-Optical Avoided Crossings Suppress Thermal Conductivity in Ga-Substituted TlInTe$_2$", "abstract": "In crystalline solids, avoided crossing between acoustic and optical phonons is widely recognized as an effective mechanism for suppressing lattice thermal conductivity ($\\kappa_l$). However, the role of avoided crossings among optical phonons remains largely unexplored due to their weak contribution to heat transport. Here, using first-principles calculations combined with the linearized Wigner transport equation (LWTE), we demonstrate that optical-optical avoided crossings can effectively reduce ($\\kappa_l$) in TlIn$_{0.5}$Ga$_{0.5}$Te$_2$. Pristine TlInTe$_2$ exhibits strong optical phonon-dominated heat transport, where optical phonons contribute nearly 63% of $\\kappa_l$. The phonon dispersion of TlInTe$_2$ shows several crossing points in the optical region, which evolve into avoided crossings after 50% Ga substitution. Irreducible representation analysis reveals that the crossing phonon branches in TlInTe$_2$ belong to different symmetry representations, whereas the corresponding branches in TlIn$_{0.5}$Ga$_{0.5}$Te$_2$ possess the same symmetry representation, which enables phonon modes to couple and results in gap opening at the crossing points. These avoided crossings significantly suppress the optical phonon group velocity, thereby reducing the optical phonon contribution from 63% to 44% and lowering $\\kappa_l$ from 0.568 to 0.482 Wm$^{-1}$K$^{-1}$ at 300 K. Mode-averaged transport analysis further confirms that the suppression of $\\kappa_l$ is primarily governed by reduced phonon group velocity ($v_g$), while enhanced anharmonic scattering provides an additional secondary contribution. Our results establish symmetry-modified optical-optical avoided crossing as an effective route to suppress optical phonon transport and reduce $\\kappa_l$ in systems where optical phonons significantly contribute to heat transport.", "url": "https://arxiv.org/abs/2606.05803", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算结合线性化Wigner输运方程，研究了Ga替代TlInTe₂中光学-光学避让交叉对晶格热导率的抑制作用。\n2. 其核心在于对称性分析揭示替代后光学声子支对称性一致导致能隙打开，显著降低光学声子群速度，使热导率从0.568降至0.482 Wm⁻¹K⁻¹。\n3. 这为以光学声子主导热输运的体系中通过对称性调控声子耦合以设计低热导率材料提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Sayan Paul"}, {"name": "Swapan K Pati"}], "featured_authors": [{"name": "Sayan Paul"}, {"name": "Swapan K Pati"}], "author_count": 2}, {"id": "2606.05822", "category": "cond-mat", "title": "Study on the validity of IPT+parquet method as an impurity solver in DMFT focusing on orbital fluctuations", "abstract": "A breakdown of calculations with exact impurity solvers in the dynamical mean field theory in multiband systems easily occurs due to the expensive numerical cost. To overcome this practical difficulty, three of the present authors developed an inexpensive and reliable impurity solver by combining the iterative perturbation theory (IPT) and parquet equation, and named it IPT+parquet [R. Mizuno, et al., Phys. Rev. B 104, 035160 (2021).]. In this study, we validate IPT+parquet focusing on the orbital fluctuation by comparing the numerically exact impurity solvers. We confirm that IPT+parquet can capture competition between orbital fluctuation channels, which the conventional IPT cannot capture.", "url": "https://arxiv.org/abs/2606.05822", "type": "理论+数值", "summary": "1. 该工作通过对比数值精确杂质求解器，验证了IPT+parquet方法在DMFT中处理轨道涨落的有效性。\n2. 其关键技术优势在于能够捕捉轨道涨落通道间的竞争行为，克服了传统IPT方法在此方面的局限。\n3. 这为多带体系中廉价可靠的DMFT计算提供了可行方案，有望推动复杂关联材料的理论研究。", "summary_source": "deepseek", "authors": [{"name": "Aira Yamada"}, {"name": "Ryota Mizuno"}, {"name": "Masayuki Ochi"}, {"name": "Kazuhiko Kuroki"}, {"name": "Takuma Ohashi"}], "featured_authors": [{"name": "Aira Yamada"}, {"name": "Ryota Mizuno"}, {"name": "Masayuki Ochi"}, {"name": "Kazuhiko Kuroki"}, {"name": "Takuma Ohashi"}], "author_count": 5}, {"id": "2606.05837", "category": "cond-mat", "title": "Odd-parity magnons in the Haldane-Hubbard model from topological exciton condensation", "abstract": "Odd-wave magnets are the counterparts to even-wave altermagnets realizing odd-parity spin splitting. Normally discussed for noncollinear systems, they have recently been shown to appear in collinear magnetic states in the presence of loop currents. Here we study collective excitations of the paramagnetic and magnetic phase of the seminal Haldane-Hubbard model. We identify the existence topological excitons in the paramagnetic phase, and their condensation as the driving mechanism into the collinear Néel state. The latter realizes an odd-wave magnet with odd-parity magnons displaying a characteristic $f$-wave splitting. We further uncover that an electron bandgap closing ensures magnon bandgap closing causing a change in odd-parity magnon topology, as well as a drastically enlarged spin splitting. Our results establish the presence of topological excitons and odd-parity magnons in the Haldane-Hubbard, with potential realizations in Floquet-driven materials and cold atomic gases.", "url": "https://arxiv.org/abs/2606.05837", "type": "理论", "summary": "1. 该工作以Haldane-Hubbard模型为平台，系统研究了顺磁相中拓扑激子的集体激发及其凝聚驱动共线Néel序的机制，并发现奇宇称磁振子具有f-波对称性劈裂。\n2. 其核心物理在于电子带隙闭合与磁振子带隙闭合的严格对应，导致奇宇称磁振子发生拓扑相变并伴随着自旋劈裂幅度的大幅增强，揭示了电子拓扑与磁振子拓扑的耦合。\n3. 该结果为在Floquet驱动体系和冷原子气体中实现拓扑激子凝聚以及调控奇宇称磁振子的拓扑性质提供了明确的理论基础和实验方向。", "summary_source": "deepseek", "authors": [{"name": "Rintaro Eto"}, {"name": "Johannes Knolle"}], "featured_authors": [{"name": "Rintaro Eto"}, {"name": "Johannes Knolle"}], "author_count": 2}, {"id": "2606.05845", "category": "cond-mat", "title": "Breakdown of Fluctuational Electrodynamics in the Extreme Near Field", "abstract": "Fluctuational electrodynamics relies on the assumption that thermal fluctuations in distinct bodies are statistically independent. We show that this approximation breaks down in the extreme near-field regime, where overlapping evanescent surface fields hybridize optical phonons across nanometric vacuum gaps and generate fluctuating-current cross correlations between opposite interfaces. Using a microscopic coupled-oscillator model combined with a Green-tensor formulation of the Poynting vector, we derive the resulting correlation-induced correction to the radiative heat flux. For polar materials supporting surface phonon-polaritons, these correlations become significant when the hybridization energy is comparable to the intrinsic damping rate and can substantially modify conventional fluctuational-electrodynamics predictions at subnanometric separations. Our results establish a microscopic framework for correlated thermal fluctuations in the extreme near-field regime and quantify their impact on radiative heat transfer.", "url": "https://arxiv.org/abs/2606.05845", "type": "理论", "summary": "1. 本工作证明极端近场区域中重叠倏逝场杂交纳米真空间隙光学声子并生成界面间涨落电流交叉关联，导致涨落电动力学统计独立假设失效。\n2. 其技术要点在于结合微观耦合振子模型与格林张量公式，推导出杂交能与固有阻尼率可比时辐射热流的关联修正。\n3. 这为精确预测亚纳米间距热传输及超越常规涨落电动力学的关联热涨落效应提供了微观理论框架。", "summary_source": "deepseek", "authors": [{"name": "Philippe Ben-Abdallah"}], "featured_authors": [{"name": "Philippe Ben-Abdallah"}], "author_count": 1}, {"id": "2606.05856", "category": "cond-mat", "title": "Understanding deconfined quantum critical points from crystalline categorical Landau paradigm", "abstract": "Deconfined quantum critical points (DQCPs) involving lattice symmetries evade the conventional Landau paradigm because the competing orders break incompatible internal and crystalline symmetries. We show that a class of DQCPs can nevertheless be understood as Landau-type transitions after gauging anomalous onsite symmetries. For spin chains with Lieb-Schultz-Mattis (LSM) anomalies, gauging produces a noninvertible lattice translation whose fusion closes only up to ordinary translations, giving rise to a crystalline categorical symmetry. In the gauged description, the original DQCP becomes a transition between different symmetry breaking patterns of this categorical symmetry. We demonstrate this mechanism in microscopic lattice models; the magnetic-valence-bond-solid (VBS) DQCP realizes a Rep($D_8$)-type crystalline categorical Landau transition, whereas a y-antiferromagnetic-VBS DQCP realizes a Rep($H_8$)-type one. Although Rep($D_8$) and Rep($H_8$) share the same fusion rules, they have inequivalent $F$-symbols and therefore define distinct categorical descriptions. Our results show that the universal categorical structure underlying these DQCPs is encoded in the full fusion category, rather than in the fusion ring alone.", "url": "https://arxiv.org/abs/2606.05856", "type": "理论", "summary": "1. 本文证明，通过规范具有内部反常的对称性，一类涉及晶格对称性的退禁闭量子临界点可被理解为晶体范畴对称性破缺的朗道型相变。\n2. 其核心在于，对具有Lieb-Schultz-Mattis反常的自旋链进行规范产生了非可逆晶格平移，从而引入Rep(D₈)或Rep(H₈)型范畴结构，且二者虽融合规则相同但F符号不等价。\n3. 该工作揭示了退禁闭量子临界点的普适范畴结构由完整融合范畴而非融合环编码，为设计具有不同拓扑序的量子临界模型提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Hiromi Ebisu"}, {"name": "Bo Han"}, {"name": "Weiguang Cao"}], "featured_authors": [{"name": "Hiromi Ebisu"}, {"name": "Bo Han"}, {"name": "Weiguang Cao"}], "author_count": 3}, {"id": "2606.05862", "category": "cond-mat", "title": "Aqueous-alcohol mixtures in dimension two: miscibility and micro-segregation", "abstract": "Two dimensional site interaction models of water and alcohols are mixed in various proportions and studied by Monte Carlo simulations, with the purpose to clarify problems related to simulation of real micro-heterogeneous systems. Three alcohols are considered, methanol, pentanol and octanol. The main finding is that, while real alcohols demix with water from butanol onward, their 2D analogs are always fully miscible, while developing increasingly pronounced micro-segregation as the alcohol tail length increases. This is not a consequence of the intrinsically higher fluctuations in 2D, but rather a reorganization of these fluctuations under the charge ordering mechanism. The second finding is that water drives the micro-segregation through strong self-aggregation, but this is not enough to achieve full phase separation because of the water-alcohol contact at the outer rim of the water domains. In this work we examine how this local heterogeneity develops with increasing alcohol alkyl tails, monitored with the study of pair correlation functions, structure factors and Kirkwood-Buff integrals. The absence of clear local self-averaging of the latter provides an illustration of the tension between energy driven maintaining of local structures and entropy driven global homogeneity. In that, the 2D modelisation of real hydrogen bonding mixtures allows to better capture and reveal the physics behind the chemistry of these liquids.", "url": "https://arxiv.org/abs/2606.05862", "type": "理论+数值", "summary": "1. 该工作通过蒙特卡洛模拟二维位点水-醇（甲醇、戊醇、辛醇）混合模型，研究了其在任意配比下的混溶性与微分离现象。\n2. 核心发现是二维醇始终完全混溶但随烷基链增长微分离加剧，该行为并非二维涨落所致，而由电荷排序机制驱动水分子强自聚集并限制于域界。\n3. 这揭示了能量驱动局域结构与熵驱动全局均匀性的张力，为利用二维模型捕捉真实氢键混合液体中化学背后的物理机制提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Camille de la Vaissiere"}, {"name": "Ayse Butuner"}, {"name": "Aurélien Perera"}], "featured_authors": [{"name": "Camille de la Vaissiere"}, {"name": "Ayse Butuner"}, {"name": "Aurélien Perera"}], "author_count": 3}, {"id": "2606.05866", "category": "cond-mat", "title": "Symmetry-Selective Stabilization of Charge-Density Wave in ScV$_6$Sn$_6$", "abstract": "Charge-density-wave (CDW) order in kagome metals is highly sensitive to external tuning parameters such as chemical substitution and hydrostatic pressure, which generally suppress long-range order. Here, using high-resolution X-ray diffraction under controlled uniaxial strain, we show that anisotropic lattice deformation instead stabilizes and enhances the CDW state in ScV$_6$Sn$_6$. Compression along the [H00] and [HH0] directions lowers the crystal symmetry from hexagonal to orthorhombic, lifts the degeneracy between symmetry-equivalent in-plane CDW domains, and promotes long-range order while preserving the underlying trimer instability. Phonon calculations indicate only a moderate stabilization of the imaginary flat phonon mode, demonstrating that the increase in T$_\\mathrm{CDW}$ is primarily driven by the in-plane ordering of the Sn$^\\mathrm{T}$--Sc--Sn$^\\mathrm{T}$ \\textit{rattling} chains within the frustrated kagome lattice. A phenomenological model incorporating strain-dependent Ising couplings within a three-state Potts framework successfully reproduces the evolution of T$_\\mathrm{CDW}$ under compression and captures the continuous nature of the transition. Our results establish uniaxial strain as a powerful symmetry-selective tuning parameter for order-disorder transformations in frustrated lattices.", "url": "https://arxiv.org/abs/2606.05866", "type": "理论+数值", "summary": "1. 该工作利用可控单轴应变下的高分辨X射线衍射，研究了ScV₆Sn₆中电荷密度波（CDW）的对称选择性稳定化。\n2. 其物理卖点在于揭示各向异性压缩通过降低六方至正交对称性、解除面内CDW域简并，并主导驱动Snᵀ–Sc–Snᵀ振动链的有序化来增强CDW长程序，而虚频声子模稳定化贡献仅次之。\n3. 这建立了单轴应变作为受挫kagome晶格中序-无序转变的对称选择性调谐参数，为探索其他竞争序的调控提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "A. Korshunov"}, {"name": "C.-Y. Lim"}, {"name": "J. Corral-Sertal"}, {"name": "G. Garbarino"}, {"name": "D. Chernyshov"}, {"name": "A. Rajapitamahuni"}, {"name": "C. Yi"}, {"name": "S. Roychowdhury"}, {"name": "C. Shekhar"}, {"name": "C. Felser"}, {"name": "V. Pardo"}, {"name": "Ella M. Schmidt"}, {"name": "S. Blanco-Canosa"}], "featured_authors": [{"name": "A. Korshunov"}, {"name": "C.-Y. Lim"}, {"name": "J. Corral-Sertal"}, {"name": "V. Pardo"}, {"name": "Ella M. Schmidt"}, {"name": "S. Blanco-Canosa"}], "author_count": 13}, {"id": "2606.05886", "category": "cond-mat", "title": "Polylogarithmic Structure of Bragg Diffraction in Finite-Coherence Lattices", "abstract": "We develop a polylogarithmic structure for Bragg diffraction based on a weighted multi-plane interference model. Within this kind of construction, the scattering amplitude is expressed as a polylogarithmic generating function. By introducing extra contributions with power-law and the usual exponential decay, it takes the form $F(\\theta) = \\mathrm{Li}_m\\left(e^{i\\theta_{\\mathrm{eff}} - \\epsilon}\\right)$, where $\\epsilon$ is a finite coherence length. In the limit where $\\epsilon \\rightarrow 0$, the argument of the polylogarithm approaches the unit circle and the classical Bragg condition corresponds to the approach of the polylogarithm argument toward its branch point $z=1$. This formulation provides a compact analytical framework for describing diffraction line shapes within a generalized correlation model in which peak positions, widths, and line shapes arise from a single analytic structure. Although we are able to recover the standard Bragg law for ideal crystals, the polylogarithm model captures deviations due to finite correlation length, disorder and non-uniform lattice coherence. We show that if Bragg peaks correspond to boundary singularities of the polylogarithm, a connection between diffraction theory and complex analysis arise. The proposed theoretical model may be particularly relevant for disordered or partially coherent materials, where conventional diffraction models often require additional phenomenological broadening assumptions.", "url": "https://arxiv.org/abs/2606.05886", "type": "理论", "summary": "1. 该工作基于加权多平面干涉模型，建立了有限相干晶格中布拉格衍射的多对数解析结构，将散射振幅表达为多对数生成函数。\n2. 其技术核心在于通过多对数参数趋近分支点z=1恢复经典布拉格条件，并统一描述峰位、宽度与线型，无需引入额外唯象展宽假设。\n3. 这揭示了布拉格峰作为多对数边界奇点的本质，将衍射理论与复分析联系起来，为无序或部分相干材料的衍射分析提供了紧凑解析框架。", "summary_source": "deepseek", "authors": [{"name": "Evangelos G. Filothodoros"}], "featured_authors": [{"name": "Evangelos G. Filothodoros"}], "author_count": 1}, {"id": "2606.05974", "category": "cond-mat", "title": "The KNN rollercoaster: from bulk ceramics to phase engineered wafer-scale thin films", "abstract": "Since the initial disclosure of the extraordinary piezoelectric coefficients of Potassium sodium niobate (KNN) in near-equimolar bulk ceramics, its development trajectory has resembled a rollercoaster, with its integration into microelectronics severely lagging due to thermodynamic stability issues and poor planar process compatibility. In this work, we revisit the bulk-derived phase diagram for the specific case of thin films integrated on silicon. By systematically investigating Mn-doped K1-xNaxNbO3 films grown on 8-inch wafers, we demonstrate that the optimal stoichiometry for thin films fundamentally diverges from the bulk equimolar standard. A Na-rich composition (> 70 at.%) is required to overcome substrate-induced constraints, effectively suppressing pyrochlore formation and chemical phase segregation while promoting dense columnar growth with a complete (001) out-of-plane polar orientation. Consequently, Na-rich films deliver outstanding functional properties, reaching remanent polarizations up to 14 uC cm-2, with piezoelectric coefficients of d33f= 79 pm/V and e31f = 10 C/m2. Supported by Density Functional Theory simulations, we correlate this enhancement with improved stability and a strain-driven structural reorientation toward a lower-symmetry monoclinic phase with tilted polarization. By redefining the phase engineering rules for wafer-scale thin films, our results establish a clear route toward KNN integration in microsystems.", "url": "https://arxiv.org/abs/2606.05974", "type": "理论+数值", "summary": "1. 该工作重新审视了铌酸钾钠（KNN）薄膜在硅基底上的相图，发现其最佳组分与块体等摩尔标准根本不同。\n2. 技术核心在于富钠组分（>70 at.%）可抑制焦绿石相和化学分凝，促进(001)取向柱状生长，实现高剩余极化（14 uC/cm²）及压电系数（d33f=79 pm/V）。\n3. 该结果通过密度泛函理论计算归因于应变驱动的单斜相取向重构，重新定义了晶圆级薄膜的相工程规则，为KNN在微系统中的集成提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Giulia Pavese"}, {"name": "Federico Orlando"}, {"name": "Fabio Melzi"}, {"name": "Walter Piazzi"}, {"name": "Andrea Pescarolo"}, {"name": "Federico Maspero"}, {"name": "Marco Asa"}, {"name": "Riccardo Gianola"}, {"name": "Andrea Picco"}, {"name": "Andrea Serafini"}, {"name": "Kui Yao"}, {"name": "Silvia Picozzi"}, {"name": "Laura Castoldi"}, {"name": "Miguel-Ángel Badillo-Ávila"}, {"name": "Riccardo Bertacco"}], "featured_authors": [{"name": "Giulia Pavese"}, {"name": "Federico Orlando"}, {"name": "Fabio Melzi"}, {"name": "Laura Castoldi"}, {"name": "Miguel-Ángel Badillo-Ávila"}, {"name": "Riccardo Bertacco"}], "author_count": 15}, {"id": "2606.06001", "category": "cond-mat", "title": "Resolving room temperature microscale fracture and plasticity of iron oxides along the cascade of iron ore reduction via nanoindentation and microcantilever bending", "abstract": "Understanding the fundamental mechanical behaviour of iron oxide phases is essential for controlling attrition and fracture during iron ore reduction process, particularly in hydrogen-based direct reduction systems. This study investigates the room temperature plasticity and fracture behaviour of single-crystal hematite, magnetite, and Wustite using nanoindentation and micro-cantilever fracture testing. Hematite exhibited the highest hardness, H and elastic modulus, E (H=18.5 GPa, E=281 GPa), followed by magnetite (H=8.7 GPa, E=165 GPa) and Wustite (H=7.5 GPa, E=145 GPa), reflecting differences in slip activity along the iron oxide reduction sequence. Furthermore, fracture toughness was measured using notched microcantilevers for all three iron oxide phases, aligned along low index and high index crystallographic planes, respectively. For the low index-oriented case hematite showed increased fracture toughness owing to crack deviation and faceting while magnetite and Wustite exhibited single plane cleavage fracture. Distinct changes in the deformation behavior in terms of plasticity and cracking of the three iron oxides were evident from both methods. Further investigation of a magnetite-gangue interface, particularly relevant to low-concentration ores, revealed significantly reduced fracture toughness compared to the magnetite phase. Overall, these results provide a comprehensive set of mechanical properties of iron oxides with potential application in material models for predicting fracture and attrition during hydrogen-based direct reduction.", "url": "https://arxiv.org/abs/2606.06001", "type": "理论", "summary": "1. 该工作通过纳米压痕与微悬臂梁弯曲实验，系统表征了赤铁矿、磁铁矿及方铁矿单晶在室温下的硬度、弹性模量与断裂韧性。\n2. 其技术特色在于沿铁氧化物还原级联比较了低指数与高指数晶面的断裂行为，揭示了赤铁矿因裂纹偏转与刻面化而具有更高韧性，而磁铁矿与方铁矿呈现单一解理断裂。\n3. 这一完整的力学性能数据集可直接用于构建氢基直接还原过程中颗粒磨损与断裂的预测模型，尤其对低品位矿石中磁铁矿-脉石界面弱化效应的量化具有关键价值。", "summary_source": "deepseek", "authors": [{"name": "Shreehard Sahu"}, {"name": "James P. Best"}, {"name": "Gerhard Dehm"}, {"name": "Anwesha Kanjilal"}], "featured_authors": [{"name": "Shreehard Sahu"}, {"name": "James P. Best"}, {"name": "Gerhard Dehm"}, {"name": "Anwesha Kanjilal"}], "author_count": 4}, {"id": "2606.06017", "category": "cond-mat", "title": "Superconductivity beyond band geometry: emergence of pair quantum geometry", "abstract": "Quantum geometry shapes the effective mass of Bloch particles through the geometric properties of single-particle states. Here we show that this principle extends to paired states. Starting from a generic multiband Hubbard model, we derive an exact effective-mass theorem for two-body bound states and its many-body counterpart for Cooper pairs near the critical temperature within Gaussian fluctuation theory. In both cases, the inverse effective mass separates into a ``conventional'' band-structure contribution and a new geometric contribution, pair quantum geometry, governed by quantum metrics on the pairing manifold, which becomes nontrivial when pairing is non-uniform across sublattices. In the many-body setting, analytic continuation renders the fluctuation kernel non-Hermitian, producing a biorthogonal pair geometry and a generally complex Cooper-pair effective mass whose imaginary part reflects Landau damping. Exact calculations on one-, two-, and three-dimensional lattice models show that pair quantum geometry can make quantitatively significant contributions to the effective mass. These results establish pair quantum geometry as a fundamental ingredient of superconductivity beyond conventional band geometry.", "url": "https://arxiv.org/abs/2606.06017", "type": "理论+数值", "summary": "1. 该工作从通用多能带Hubbard模型出发，推导出二体束缚态及超导临界温度附近Cooper对的有效质量定理，并阐明配对量子几何作为新几何贡献的显式形式。\n2. 核心在于逆有效质量分解为常规能带部分与由配对流形上量子度量决定的对量子几何项，解析延拓使单体涨落核非厄米，产生双正交对几何及反映朗道阻尼的复数有效质量。\n3. 这确立了超越传统能带几何的对量子几何作为超导基本要素，为在多轨道或非均匀配对体系中研究配对动力学及其可观测效应提供了理论基石。", "summary_source": "deepseek", "authors": [{"name": "Mehmet Akif Keskiner"}, {"name": "Menderes Işkın"}], "featured_authors": [{"name": "Mehmet Akif Keskiner"}, {"name": "Menderes Işkın"}], "author_count": 2}, {"id": "2606.06111", "category": "cond-mat", "title": "A microscopic design rule for spin supersolids in triangular-lattice magnets", "abstract": "Spin supersolids emerge as a central topic in frustrated magnetism, motivating the search for realization in quantum materials. To this end, we study the origin of exchange anisotropy, $\\Delta$, in triangular-lattice cobaltate families $X_2$$Y$Co(PO$_4$)$_2$ and $X_2$Co(SeO$_3$)$_2$ ($X$ = Na, K, Rb, Cs; $Y$ = Mg, Ca, Sr, Ba) by tailoring realistic spin models. We show that $\\Delta$ is determined by the ratio of trigonal crystal field to spin-orbit coupling strength. This framework explains contrasting anisotropies in these families, predicts systematic trends in $\\Delta$ across $X/Y$-substitutions, and identifies candidate materials for spin supersolids. Our results establish trigonal field engineering as a microscopic route toward the design of spin supersolids.", "url": "https://arxiv.org/abs/2606.06111", "type": "理论", "summary": "1. 该工作针对三角晶格钴酸盐家族X₂YCo(PO₄)₂与X₂Co(SeO₃)₂，通过拟合微观自旋模型，系统研究了交换各向异性Δ的起源，并提出了自旋超固体的微观设计规则。\n2. 其核心物理发现是Δ由三角晶场分裂与自旋轨道耦合强度之比决定，从而解释了这两类材料中截然不同的各向异性行为，并预测了元素替代的系统性趋势。\n3. 这确立了三角晶场工程作为设计自旋超固体的微观途径，并识别出若干候选材料，为在三角晶格磁体中实验实现自旋超固体提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Ryota Ono"}, {"name": "Jun'ichi Ieda"}, {"name": "Michiyasu Mori"}, {"name": "Sadamichi Maekawa"}], "featured_authors": [{"name": "Ryota Ono"}, {"name": "Jun'ichi Ieda"}, {"name": "Michiyasu Mori"}, {"name": "Sadamichi Maekawa"}], "author_count": 4}, {"id": "2606.06128", "category": "cond-mat", "title": "Ferroelectric brightening of spin forbidden dark excitons in a WSe2/hybrid perovskite heterostructure", "abstract": "Long-lived dark excitons in monolayer WSe2 present promising candidates for carrying spin and valley information, but their optical access and spin manipulation have conventionally required the use of strong external magnetic fields. Here, using a ferroelectric hybrid perovskite heterostructure, we leverage the ferroelectric proximity effect to break the WSe2's in-plane rotational symmetry and brighten the spin-forbidden dark excitons under zero magnetic field conditions. Furthermore, we show that the twist angle between the WSe2 and perovskite crystals controls the ferroelectric coupling strength and valley-contrasting polarization. Our proposed mechanism, supported by a four-band tight-binding model, suggests that the ferroelectric proximity effect induces an asymmetric intersublattice interaction, generating an effective in-plane spin-orbit coupling (SOC) field that rotates spin/valley polarization and brightens dark excitons. Our work establishes ferroelectric proximity coupling as an electrically reconfigurable, magnetic-field-free strategy for spin exciton control in two-dimensional semiconductors.", "url": "https://arxiv.org/abs/2606.06128", "type": "理论", "summary": "1. 该工作构建WSe2/杂化钙钛矿铁电异质结构，在零磁场下实现了自旋禁戒暗激子的光学增亮。\n2. 其核心在于铁电邻近效应打破面内旋转对称性，借助四带紧束缚模型揭示不对称子晶格间相互作用诱生有效面内自旋轨道耦合场，且扭转角可调谷对比偏振。\n3. 这为二维半导体中激子自旋的电可重构、无磁场控制建立了普适策略，拓展了铁电邻近耦合在自旋谷电子学中的应用。", "summary_source": "deepseek", "authors": [{"name": "Xinyun Wang"}, {"name": "Magdalena Grzeszczyk"}, {"name": "Maxim Trushin"}, {"name": "Ivan Verzhbitskiy"}, {"name": "Dmitrii Litvinov"}, {"name": "Yi Wei Ho"}, {"name": "Yuan Chen"}, {"name": "Zhenyue Wu"}, {"name": "Mykola Telychko"}, {"name": "Chuanqi Zhang"}, {"name": "Andres Granados del Aguila"}, {"name": "Kuan Eng Johnson Goh"}, {"name": "Xinwei Li"}, {"name": "Goki Eda"}, {"name": "Shaffique Adam"}, {"name": "Maciej Koperski"}, {"name": "Kian Ping Loh"}], "featured_authors": [{"name": "Xinyun Wang"}, {"name": "Magdalena Grzeszczyk"}, {"name": "Maxim Trushin"}, {"name": "Shaffique Adam"}, {"name": "Maciej Koperski"}, {"name": "Kian Ping Loh"}], "author_count": 17}, {"id": "2606.06169", "category": "cond-mat", "title": "Endowing variational phase-field fracture models with custom strength criteria", "abstract": "By now, several approaches have been proposed to endow phase-field fracture models with the ability to describe crack nucleation under multiaxial stress states. These include techniques for splitting the free energy, direct modifications of the phase-field driving or resisting forces that sacrifice the variational structure of the problem, and the introduction of additional internal variables, such as plastic strains or other nonlinear strains. In this paper, we propose a fundamentally different strategy for incorporating arbitrary elastic domains into phase-field fracture models, formulated within the variational framework of generalized standard materials. The proposed approach relies on letting the dissipation potential depend on the current state of the material. In this way, the variational structure of the problem is preserved, while elastic degradation and the strength criterion remain two distinct and independently controllable aspects of the material response. Simple yet representative models are presented and thoroughly discussed to demonstrate the effectiveness of the proposed methodology. The resulting evolution of the elastic domain is investigated in both strain and stress spaces. Moreover, numerical simulations demonstrate a range of crack nucleation processes under multiaxial loading conditions for various analytical strength surfaces. This work paves the way for future developments and applications in several directions.", "url": "https://arxiv.org/abs/2606.06169", "type": "理论+数值", "summary": "1. 该工作提出在广义标准材料变分框架内，通过令耗散势依赖于材料当前状态，将任意弹性域融入相场断裂模型。\n2. 其核心卖点是在保持问题变分结构的同时，使弹性退化与强度准则成为两个独立可控的材料响应方面。\n3. 这为多轴应力状态下裂纹成核的模拟以及相关理论扩展与工程应用开辟了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Roberto Alessi"}, {"name": "Matteo Brunetti"}, {"name": "Roshan Udaram Patil"}, {"name": "Jacinto Ulloa"}], "featured_authors": [{"name": "Roberto Alessi"}, {"name": "Matteo Brunetti"}, {"name": "Roshan Udaram Patil"}, {"name": "Jacinto Ulloa"}], "author_count": 4}, {"id": "2606.06184", "category": "cond-mat", "title": "The mesoscopic foundations of non equilibrium thermodynamics and the arrow of time in the Dual Model of Liquids", "abstract": "This manuscripts has two goals. The first goal is to show that the interaction in the Dual Model of Liquids between the solidlike molecule aggregates and the lattice excitations is appropriate to represent the link between the behaviour at macroscopic scale of normal liquids and the physical processes characterizing those systems at mesoscopic scale. The second goal is to show that the duality allows identifying a time arrow on the mesoscopic scale in liquids. The interaction of quanta of elastic energy with the molecular clusters introduces a privileged direction, which is relevant in time dependent and dissipative macroscopic processes, although the interaction remains temporally reversible", "url": "https://arxiv.org/abs/2606.06184", "type": "理论", "summary": "1. 该工作基于液体双模型，建立了介观尺度类固体分子聚集体与晶格激发之间的相互作用与非平衡热力学宏观行为之间的联系。\n2. 其核心卖点在于通过对偶性揭示弹性能量量子与分子团簇的可逆相互作用在介观尺度上自然引入一个优先时间方向。\n3. 这为理解液体耗散过程中时间箭头的介观起源以及联结微观可逆性与宏观不可逆性提供了明确的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Fabio Peluso"}], "featured_authors": [{"name": "Fabio Peluso"}], "author_count": 1}, {"id": "2606.06185", "category": "cond-mat", "title": "Non-adiabatic Ehrenfest dynamics with norm-conserving and ultra-soft pseudo-potentials with nuclear velocity corrections on the atomic orbitals within the Projector Augmented Wave Method framework", "abstract": "We derive the first-principles Ehrenfest molecular dynamics describing non-adiabatic processes with the inclusion of the nuclear-velocity-dependent phases (also known as electron-translation factors) on the atomic-orbital basis. These phases, appearing when nuclei are treated dynamically, affect effective Hamiltonians constructed from localised orbitals. In this work, we focus on the effects in the first-principles pseudo-potential Hamiltonian, both for the norm-conserving and ultra-soft cases, derived within the Projector-Augmented-Wave (PAW) method framework. Peierls-like phases depending on the nuclear velocities appear in the non-local part of the potential, while additional nuclear velocity and acceleration-dependent corrections appear in the ultra-soft pseudo-potential case. The use of velocity-including atomic orbital basis enables a Galilean-invariant description of the non-adiabatic Ehrenfest molecular dynamics, removing spurious non-adiabatic couplings that arise from neglecting the nuclear velocity phases in the atomic orbitals.", "url": "https://arxiv.org/abs/2606.06185", "type": "理论+数值", "summary": "1. 该工作推导了PAW框架下含核速度修正的非绝热Ehrenfest动力学公式，覆盖规范守恒与超软赝势情形。\n2. 关键技术在于引入核速度依赖的Peierls型相位及超软情形下的加速度修正项，使原子轨道基集满足伽利略不变性，消除虚假非绝热耦合。\n3. 这为精确模拟涉及快速核运动的非绝热过程（如光化学反应或高能碰撞）提供了可靠的第一性原理方法。", "summary_source": "deepseek", "authors": [{"name": "Paolo Fachin"}, {"name": "Francesco Macheda"}, {"name": "Paolo Barone"}, {"name": "Francesco Mauri"}], "featured_authors": [{"name": "Paolo Fachin"}, {"name": "Francesco Macheda"}, {"name": "Paolo Barone"}, {"name": "Francesco Mauri"}], "author_count": 4}, {"id": "2606.06257", "category": "cond-mat", "title": "Investigating frictional instability due to pressurization in granular media: insights from coupled computational fluid dynamics discrete element method", "abstract": "Fluid pressurization can reactivate subcritically stressed granular layers in faults, slopes, and injection-perturbed reservoirs, but grain-scale feedbacks among pressure diffusion, drainage, and contact-network degradation remain unresolved. Here, 3D coupled CFD-DEM simulations investigate pore-pressure-induced reactivation of confined, fluid-saturated granular shear layers under imposed shear stress. Strain-controlled tests define the Mohr-Coulomb strength envelope; stress-controlled simulations then impose subcritical shear stresses while basal pore pressure increases under drained and undrained conditions. Instability is governed not by pore pressure alone, but by its coupled evolution with effective stress, drainage, dilation or compaction, hydraulic connectivity, and granular fabric. Undrained boundaries retain excess pore pressure, whereas drained boundaries maintain vertical gradients and suppress excess pressure. Internal fields reveal alternating dilation and compaction bands and reorganization of a porosity-derived permeability proxy, showing that hydraulic pathways evolve during deformation. Micromechanical diagnostics identify localized particle rotation, force-chain reorganization, porosity redistribution, and coordination-number variations controlled mainly by imposed shear-stress level rather than drainage. Second-order fabric metrics show that post-failure weakening coincides with loss of directional force-chain organization, especially at lower shear. Friction-velocity and friction-porosity trajectories indicate a transition from dilatancy-dominated strengthening to pore-pressure-driven weakening. Viscous-number scaling partially organizes the low-Iv creeping response, 10^-8 <= Iv <= 10^-5, but not onto a unique local rheology. These results clarify how drainage-controlled hydromechanical feedbacks and fabric degradation convert pore-pressure forcing into instability.", "url": "https://arxiv.org/abs/2606.06257", "type": "理论+数值", "summary": "1. 该工作通过三维CFD-DEM耦合模拟，研究了流体饱和颗粒剪切层在孔隙压力升高下的摩擦失稳过程。\n2. 其核心发现是失稳由排水条件控制的孔压、有效应力、剪胀、水力连通性及颗粒组构的耦合演化主导，而非单纯孔压阈值。\n3. 这为理解断层再活化、斜坡失稳等流体触发力学问题提供了微观物理机制与定量诊断框架。", "summary_source": "deepseek", "authors": [{"name": "Bimal Chhushyabaga"}, {"name": "Behrooz Ferdowsi"}], "featured_authors": [{"name": "Bimal Chhushyabaga"}, {"name": "Behrooz Ferdowsi"}], "author_count": 2}, {"id": "2606.06304", "category": "cond-mat", "title": "Eigenmodes of synthetic antiferromagnetic skyrmions", "abstract": "We investigate the excitation modes of confined synthetic-antiferromagnetic (SAF) skyrmions using micromagnetic eigenvalue and ringdown simulations. Starting from a single skyrmion in a ferromagnetic layer, where the lowest-frequency modes are a gyrotropic and a breathing mode, we study how antiferromagnetic interlayer coupling modifies the dynamics in SAF bilayers. We consider several geometries: single SAF skyrmions in square and rectangular confinement, unequal layer thicknesses, and strips containing multiple skyrmions. The antiferromagnetic coupling strongly modifies the low-frequency dynamics. The square geometry exhibits two nearly degenerate gyrotropic modes, where in each both layers have the same rotation sense. In rectangular geometries, we instead find nearly linear SAF skyrmion translation emerging from opposite gyration sense in the two layers. These translational modes become the characteristic low-frequency excitations of SAF skyrmion chains. For skyrmion chains, we identify collective translational and breathing modes with standing-wave-like spatial profiles. Beyond ferromagnetic-like breathing modes, the SAF geometry supports breathing oscillations in which the two layers oscillate out of phase. We further demonstrate signal propagation along extended SAF skyrmion chains with propagation velocities comparable to ferromagnetic skyrmion chains. These results provide a systematic description of the collective dynamics of SAF skyrmions arising from the interplay of geometric confinement, intralayer, and interlayer coupling.", "url": "https://arxiv.org/abs/2606.06304", "type": "理论+数值", "summary": "1. 通过微磁学特征值与ringdown模拟，研究了受限合成反铁磁双层中斯格明子的本征激发模式。\n2. 反铁磁层间耦合使低频动力学显著变化，矩形约束下出现双层反向回旋导致的准线性平移模，成为链中特征低频激发。\n3. 该工作系统描述了几何约束、层内与层间耦合共同决定的集体动力学，为合成反铁磁斯格明子链中的信号传播提供了参考。", "summary_source": "deepseek", "authors": [{"name": "Kauser Zulfiqar"}, {"name": "Martin Lang"}, {"name": "Samuel J. R. Holt"}, {"name": "Swapneel Amit Pathak"}, {"name": "Florian Bruckner"}, {"name": "Hans Fangohr"}], "featured_authors": [{"name": "Kauser Zulfiqar"}, {"name": "Martin Lang"}, {"name": "Samuel J. R. Holt"}, {"name": "Swapneel Amit Pathak"}, {"name": "Florian Bruckner"}, {"name": "Hans Fangohr"}], "author_count": 6}, {"id": "2606.06343", "category": "cond-mat", "title": "$E_\\infty^{1,2}$-type Lieb-Schultz-Mattis anomalies, deconfined quantum critical points, and non-invertible symmetry breaking", "abstract": "We study deconfined quantum critical points (DQCP) associated with Lieb-Schultz-Mattis (LSM) anomalies in one-dimensional spin chains. Our starting point is a structural characterization of the LSM anomaly in the Lyndon-Hochschild-Serre spectral sequence: $\\omega_{\\mathrm{LSM}}\\in E_\\infty^{1,2}= H^1(\\mathbb Z_{\\mathrm{trans}},H^2(G_{\\mathrm{int}},\\mathrm{U}(1)))\\subseteq H^3(G_{\\mathrm{int}}\\rtimes_{\\rho}\\mathbb Z_{\\mathrm{trans}},\\mathrm{U}(1))$. Physically, this class decorates a translation defect with a projective representation of the internal symmetry $G_\\mathrm{int}$. We show that gauging the internal symmetry in the presence of an $E_\\infty^{1,2}$-type anomaly necessarily produces a non-invertible dual symmetry. This gives a general mechanism for type-II DQCP: in contrast to type-I examples with $E_\\infty^{2,1}$-type anomalies which are dual to ordinary group-like symmetry breaking, type-II transitions are dual to spontaneous breaking of a non-invertible symmetry. We illustrate the mechanism using a spin-$1/2$ chain with an anomalous $D_8$ LSM symmetry. We construct a dimer-to-ferromagnet DQCP candidate, provide numerical evidence for a critical theory with central charge $c\\approx 1$, and show, using both category theory and explicit lattice constructions, that gauging the internal symmetry yields the non-invertible $\\mathrm{Rep}(H_8)$ dual symmetry.", "url": "https://arxiv.org/abs/2606.06343", "type": "理论+数值", "summary": "1. 该工作通过Lyndon-Hochschild-Serre谱序列刻画了一维自旋链中Lieb-Schultz-Mattis异常的结构，并建立了与去禁闭量子临界点的联系。\n2. 其核心发现是识别出$E_\\infty^{1,2}$型异常在规范内部对称性后必然产生非可逆对偶对称性，从而为II型去禁闭临界点提供了普适机制，与I型的群对称性破缺形成对照。\n3. 这为通过非可逆对称性自发破缺理解新型量子相变提供了清晰框架，并暗示可能推广至更高维系统。", "summary_source": "deepseek", "authors": [{"name": "Hao-Ran Zhang"}, {"name": "Hanlin Lin"}, {"name": "Shuo Yang"}, {"name": "Qing-Rui Wang"}], "featured_authors": [{"name": "Hao-Ran Zhang"}, {"name": "Hanlin Lin"}, {"name": "Shuo Yang"}, {"name": "Qing-Rui Wang"}], "author_count": 4}, {"id": "2606.06362", "category": "cond-mat", "title": "A closed system setting for quantum thermalisation in free fermions", "abstract": "We study thermalisation and the possible occurrence of the Mpemba effect in a closed quantum setting that mimics the interaction of a system with thermal reservoirs coupled only at its boundaries. Specifically, we consider a tripartite geometry in which a finite chain, initially prepared at a finite temperature, is suddenly connected on both sides to two semi-infinite chains of the same nature held at a different temperature. These outer chains act as thermal baths, while the full system evolves unitarily under a homogeneous Hamiltonian. This setup provides a simple quantum realisation of a temperature quench and closely resembles the original scenario in which the classical Mpemba effect was first observed. We focus on two paradigmatic free-fermion models, the XX chain and the transverse-field Ising chain, which respectively preserve and break the global $U(1)$ particle-number symmetry. As a probe of relaxation, we consider the Frobenius distance between the time-evolved reduced density matrix of the central subsystem and its stationary state, which is the thermal state at the bath temperature. Exploiting the free-fermionic structure of both models, the dynamics remains Gaussian and the Frobenius distance can be expressed exactly in terms of two-point correlation functions. Combining this representation with generalised hydrodynamics, we derive analytical predictions for the Frobenius distance in the hydrodynamic limit, providing a complete characterisation of the thermalisation process. Using these results, we investigate the possible occurrence of the Mpemba effect. We find that, despite the genuine non-equilibrium dynamics displayed by the system, no Mpemba effect arises in this setting. Our analysis identifies a broad class of boundary-driven thermalisation protocols in which relaxation is fully characterised analytically and exhibits no anomalous acceleration of equilibration.", "url": "https://arxiv.org/abs/2606.06362", "type": "理论", "summary": "1. 该工作构建了一个闭量子系统设置，通过边界耦合半无限链作为热浴，研究自由费米子模型中的温度淬火热化过程。\n2. 其技术关键在于利用自由费米子结构将Frobenius距离精确表达为两点关联函数，结合广义流体动力学获得热化过程的完整解析刻画。\n3. 这些结果揭示，尽管系统呈现非平衡动力学，但边界驱动热化协议中并未出现Mpemba效应，为理解弛豫行为提供了明确约束。", "summary_source": "deepseek", "authors": [{"name": "Purvaash Panduranghan-Udhayashankar"}, {"name": "Filiberto Ares"}, {"name": "Pasquale Calabrese"}], "featured_authors": [{"name": "Purvaash Panduranghan-Udhayashankar"}, {"name": "Filiberto Ares"}, {"name": "Pasquale Calabrese"}], "author_count": 3}, {"id": "2606.06412", "category": "cond-mat", "title": "Nonreversible Gauge Fields in Fokker--Planck Dynamics: Supersymmetric Hamiltonians and Learned Finite Forces", "abstract": "We formulate stationary-density-preserving nonreversible perturbations of Fokker--Planck dynamics as gauge fields that deform relaxation spectra while leaving the invariant state fixed. When detailed balance holds, a similarity transformation maps the reversible Fokker--Planck operator to a Witten-Laplacian-type supersymmetric Hamiltonian; nonreversible gauges then appear as non-Hermitian perturbations that preserve the zero mode but modify the excited spectrum. This operator viewpoint gives a common language for relaxation gaps, circulating probability currents, hypocoercive acceleration, and finite control costs. We represent admissible gauge currents by antisymmetric tensor fields and identify the detailed-balance-violating Ohzeki--Ichiki force as a constant symplectic example whose infinite-strength limit is Hamiltonian dynamics. The continuous-time spectral gap alone does not select a finite gauge strength, so we introduce a finite-time regularized objective and an actor--critic procedure for learning the gauge. An exactly solvable anisotropic Gaussian Ornstein--Uhlenbeck benchmark separates the spectral transition from the finite-time optimum and shows that the learned gauge recovers the Lyapunov-equation optimum. A double-well benchmark then illustrates the same constrained selection in a nonconvex metastable landscape. Stochastic gradient methods enter this framework as physically relevant Fokker--Planck systems: mini-batch noise acts as an effective diffusion tensor, and adaptive methods such as Adam correspond to metric choices with possible nonequilibrium currents.", "url": "https://arxiv.org/abs/2606.06412", "type": "理论", "summary": "1. 该工作将Fokker-Planck动力学中保持平稳密度不变的非可逆扰动形式化为反对称张量规范场，并引入有限时间正则化目标与演员-评论家算法以从连续谱中学习最优有限规范强度，解决了谱间隙不唯一选择有限规范的问题。\n2. 核心卖点在于可逆极限下通过超对称哈密顿量框架将非可逆规范场解释为非厄米扰动，统一描述弛豫谱变形、概率环流、超加速及有限控制代价，且各向异性高斯Ornstein-Uhlenbeck基准中学习规范精确恢复Lyapunov方程最优，双阱非凸景观验证了相同选择机制。\n3. 该框架将随机梯度方法中的小批量噪声对应为有效扩散张量、自适应优化器如Adam对应为携带非平衡流的度量选择，为非平衡统计动力学中超加速与最优控制策略的设计提供了可解基准与严格算符视角。", "summary_source": "deepseek", "authors": [{"name": "Masayuki Ohzeki"}], "featured_authors": [{"name": "Masayuki Ohzeki"}], "author_count": 1}, {"id": "2606.06465", "category": "cond-mat", "title": "Superconducting triode effect in a quantum-dot Josephson junction with a biased top gate", "abstract": "Non-reciprocal supercurrents enable non-dissipative rectification, holding great promise for superconducting electronics. Conventionally, this non-reciprocity, termed the superconducting diode effect, requires the simultaneous breaking of time-reversal and parity symmetries. Here, we propose a superconducting triode effect in an asymmetric quantum-dot Josephson junction coupled to an additional metallic top gate, which breaks the parity symmetry while explicitly preserving time-reversal symmetry. We demonstrate that the supercurrent across this junction exhibits a strong non-reciprocal effect that can be continuously manipulated via the top gate to achieve an ideal unidirectional supercurrent, thus manifesting a superconducting triode effect. Furthermore, under radio-frequency radiation, this junction exhibits highly asymmetric Shapiro steps, realizing fully quantized supercurrent rectification. Our work not only provides an alternative physical mechanism for the superconducting diode effect observed in Josephson junctions with explicit time-reversal symmetry, but also introduces a new tuning knob to manipulate supercurrent non-reciprocity.", "url": "https://arxiv.org/abs/2606.06465", "type": "理论", "summary": "1. 该工作提出在非对称量子点约瑟夫森结中耦合偏置金属顶栅，实现超导三极管效应。\n2. 其物理核心在于顶栅在保持时间反演对称下打破宇称对称，连续调控超流非互易性，并获得理想单向超流及全量子化超流整流。\n3. 这为时间反演对称约瑟夫森结中的超导二极管效应提供了替代机制，并为超流非互易操控引入新的调控自由度。", "summary_source": "deepseek", "authors": [{"name": "Yu-Hang Li"}, {"name": "Xiaan Du"}, {"name": "Hua Jiang"}, {"name": "X. C. Xie"}], "featured_authors": [{"name": "Yu-Hang Li"}, {"name": "Xiaan Du"}, {"name": "Hua Jiang"}, {"name": "X. C. Xie"}], "author_count": 4}, {"id": "2606.06466", "category": "cond-mat", "title": "Enhancement of charge correlations and real-space topological marker on an interacting non-Hermitian Su-Schrieffer-Heeger model", "abstract": "We investigate the interacting non-Hermitian Su-Schrieffer-Heeger (SSH) model, focusing on the interplay between topology and charge ordering. Using a real-space topological marker, charge correlations, and the complex many-body spectrum, we map out the phase diagram under periodic and open boundary conditions. We show that the topological marker remains a robust diagnostic of non-Hermitian topological phases in the presence of interactions and consistently signals their breakdown at the onset of a charge density wave (CDW). We further demonstrate that non-Hermiticity enhances interaction effects: While moderate changes occur under periodic boundary conditions, open boundary conditions lead to a pronounced amplification of staggered charge correlations near exceptional points. This enhancement arises from the accumulation of low-energy states near exceptional points, which promotes electronic instabilities and strengthens CDW tendencies.", "url": "https://arxiv.org/abs/2606.06466", "type": "理论+数值", "summary": "1. 该工作通过实空间拓扑标记与电荷关联函数，系统映射了相互作用非厄米SSH模型在周期与开边界条件下的相图。\n2. 主要发现是拓扑标记在相互作用下仍可稳健诊断非厄米拓扑相，且非厄米性通过例外点附近低能态积累显著放大开边界下的交错电荷关联。\n3. 这揭示了非厄米性与相互作用协同增强电荷密度波趋势的机制，为设计关联拓扑非厄米系统提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Sebastião dos A. Sousa-Júnior"}, {"name": "Pedro B. Melo"}, {"name": "Rubem Mondaini"}, {"name": "Arnob Kumar Ghosh"}, {"name": "Rodrigo Arouca"}], "featured_authors": [{"name": "Sebastião dos A. Sousa-Júnior"}, {"name": "Pedro B. Melo"}, {"name": "Rubem Mondaini"}, {"name": "Arnob Kumar Ghosh"}, {"name": "Rodrigo Arouca"}], "author_count": 5}, {"id": "2606.05279", "category": "hep-th", "title": "Hypergroup Symmetry in Relative Quantum Field Theories and Chiral Algebras", "abstract": "A QFT is said to be relative if it lives at the boundary of a topological QFT in one higher dimension. We develop a general framework for working with noninvertible symmetries of relative theories in two spacetime dimensions, extending several well-known results for absolute QFTs. We emphasize various new features which arise in the relative setting, including the role of topological surfaces of the bulk, and the appearance of hypergroups and certain generalizations of tube algebras known as dome algebras. Our formalism is particularly well-suited for studying rational chiral algebras, where it predicts that finite symmetries are in explicit one-to-one correspondence with conformal embeddings of finite index. We describe several implications of our framework for absolute theories. First, we explain how to \"glue\" together symmetries of the left- and right-moving chiral algebras of a 2D CFT to produce topological line defects of the full theory. Second, we derive a precise correspondence between boundary conditions of a 2D CFT and symmetries of its chiral algebra. This correspondence has several structural corollaries: in diagonal rational CFTs, we demonstrate that the topological line defects of the theory act transitively on its boundary conditions, and further that the identity Cardy state has the smallest $g$-function amongst all boundary conditions, including those which only preserve Virasoro symmetry. We conclude by illustrating our results in a variety of examples. For instance, we show that, if there exists a rational chiral algebra with central charge $c=8$ whose modular tensor category is the Drinfeld center of the Haagerup fusion category, then it must arise as the fixed points of a rank-2 hypergroup acting on the $SU(3)_1\\otimes (E_{6})_1$ chiral algebra.", "url": "https://arxiv.org/abs/2606.05279", "type": "理论", "summary": "1. 该工作为二维相对量子场论中非可逆对称性建立了系统框架，特别聚焦于超群与球管代数这类新型代数结构的涌现及其与有理手征代数的联系。\n2. 核心亮点在于揭示了相对设置下拓扑体面在对称性构造中的关键作用，并证明有限对称性与手征代数有限指数共形嵌入之间存在精确对应。\n3. 这项工作为有理共形场论中拓扑线缺陷的粘合机制与边界条件分类提供了统一代数描述，并具体预测了Haagerup融合范畴在特定手征代数上的实现。", "summary_source": "deepseek", "authors": [{"name": "Terry Gannon"}, {"name": "Brandon C. Rayhaun"}], "featured_authors": [{"name": "Terry Gannon"}, {"name": "Brandon C. Rayhaun"}], "author_count": 2}, {"id": "2606.05280", "category": "hep-th", "title": "Kaleidoscopes, Waves and the Prepotential", "abstract": "Isomorphic flops are topology-changing transitions connecting two diffeomorphic families of Calabi-Yau threefolds. They correspond to the generators of certain Coxeter groups acting on the moduli space. As a consequence of these symmetries, the prepotential of 4D $\\mathcal{N} = 2$ Type IIA compactifications on such varieties must assemble into Coxeter-invariant functions. We construct a database of all Coxeter symmetries from isomorphic flops in Kähler-favorable CICYs. The action of the Coxeter group on the Kähler moduli space leaves a symmetric bilinear form invariant, which we interpret as a metric and construct its associated Laplace-Beltrami operator. We argue that the Coxeter-invariant functions featured in the prepotential solve the Helmholtz equation with this Laplacian, and that the prepotential can then be resummed into a decomposition in terms of eigenfunctions of the Laplace-Beltrami operator. The convergence rate of the raw orbit sums of worldsheet instanton contributions and the resummed expressions are complementary, with the latter sharply localizing around the first few terms in the interior of the moduli space.", "url": "https://arxiv.org/abs/2606.05280", "type": "理论", "summary": "1. 该工作构建了来自Kähler有利CICY同构flop的所有Coxeter对称性数据库，并证明四维N=2 Type IIA紧化的prepotential需组装成Coxeter不变函数。\n2. 其核心在于将Coxeter群在Kähler模空间上不变的双线性形式解释为度量，构造拉普拉斯-贝尔特拉米算子，并论证prepotential中的不变函数满足亥姆霍兹方程，可分解为该算子的本征函数。\n3. 这一重求和方式与世界sheet瞬子贡献的原始轨道和呈互补收敛性，后者在模空间内部迅速局域化于首几项，为精确计算prepotential提供了实用路径。", "summary_source": "deepseek", "authors": [{"name": "Rafael Álvarez-García"}, {"name": "Fabian Ruehle"}], "featured_authors": [{"name": "Rafael Álvarez-García"}, {"name": "Fabian Ruehle"}], "author_count": 2}, {"id": "2606.05282", "category": "hep-th", "title": "The Double Well Done Doubly-Well", "abstract": "The symmetric double-well potential is one of the simplest quantum-mechanical systems in which perturbative and non-perturbative physics are deeply entangled. Its energy levels have non-analytic expansions in inverse powers of the inter-well separation, with factorially growing coefficients, while the parity splitting is exponentially small and invisible to perturbation theory. Resurgence ties the two features together, organizing the exact spectrum into a single tightly-constrained trans-series. This paper gives a self-contained account of this trans-series from two complementary approaches: exact WKB and the Euclidean path integral, developed in a common notation with explicit calculations through the four-instanton level and three-loop order. In exact WKB, Stokes phenomena encoded in the Delabaere--Dillinger--Pham relations control the analytic continuation of the wavefunction past turning points. The quantization condition expressed in terms of Voros symbols then determines the full trans-series. The DDP relations are local and do not require knowing the global topology of the energy surface, but that surface is an elliptic curve. In the path integral, elliptic curves enter differently: the classical saddle points are doubly-periodic elliptic functions of Euclidean time, and Stokes phenomena play out within the finite-dimensional manifold of quasi-zero modes rather than through analytic continuation of the wavefunction. A Lefschetz thimble decomposition determines which saddles contribute, and the resulting partition function trans-series is much simpler than the energy trans-series: at each instanton order the $T$-dependence is a polynomial fixed by the quasi-zero-mode thimble integrals. Together, the two approaches deploy a shared mathematical infrastructure in complementary ways, showing that the double well is an ideal setting to explore resurgence.", "url": "https://arxiv.org/abs/2606.05282", "type": "理论", "summary": "1. 本文以精确WKB和欧几里得路径积分两种互补方法，自洽地构建了对称双阱势能级谱的完整跨级数，计算至四瞬子阶和三圈阶。\n2. 技术核心在于：精确WKB中通过Delabaere-Dillinger-Pham关系局域处理Stokes现象，而路径积分中瞬子鞍点为双周期椭圆函数，其Lefschetz thimble分解确定准零模流形上的贡献，使配分函数跨级数形式较能级跨级数简洁。\n3. 该工作揭示双阱是非微扰与微扰物理深度纠缠的典范系统，对理解一般量子力学及场论中的振荡现象具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Aurélien Dersy"}, {"name": "Matthew D. Schwartz"}], "featured_authors": [{"name": "Aurélien Dersy"}, {"name": "Matthew D. Schwartz"}], "author_count": 2}, {"id": "2606.05287", "category": "hep-th", "title": "String dualities and wedge singularities", "abstract": "We study strings propagating in backgrounds with a wedge singularity, namely whose internal sector describes a wedge sum of closed manifolds. We focus on the wedge sum of two circles, which was recently argued to provide a quantum geometry for an M-theoretic description of type 0 strings, along with a much wider non-supersymmetric duality web stemming from quotients thereof. In the context of this proposal, we investigate whether the worldsheet features of type IIA strings, together with strong-coupling ingredients, can consistently reproduce the expectation of a weakly coupled type 0A frame. To this end, we combine worldsheet effects due to the wedge singularity with the emergence proposal applied to D0-branes probing it. We find that the resulting potential reproduces the correct tree-level mass of the tachyon in a specific scaling limit. We also discuss the possibility of kinematic obstructions to our worldsheet approach using the framework of topological modular forms, and comment on some puzzles and open questions.", "url": "https://arxiv.org/abs/2606.05287", "type": "理论", "summary": "1. 该工作研究了在楔形奇异性背景中传播的弦，特别关注两个圆的楔形和及其与type 0弦的M理论描述和非超对称对偶网络的关系。\n2. 其卖点在于结合世界面效应与D0-brane的涌现提议，在特定标度极限下再现了tachyon的树级质量，验证了弱耦合type 0A框架的自洽性。\n3. 这为基于拓扑模形式讨论世界面方法的运动学障碍提供了线索，并对非超对称弦对偶的量子几何诠释提出了若干待解问题。", "summary_source": "deepseek", "authors": [{"name": "Ivano Basile"}, {"name": "Dieter Lust"}], "featured_authors": [{"name": "Ivano Basile"}, {"name": "Dieter Lust"}], "author_count": 2}, {"id": "2606.05289", "category": "hep-th", "title": "Unitarity, Recursion and Soft Limits in (EA)dS through Dressing", "abstract": "Using the recently developed framework in which cosmological correlators in (E)AdS are represented as flat-space amplitudes dressed by auxiliary propagators, we show that several structural properties of the cosmological observables have a direct flat-space origin. We derive cosmological cutting rules for spinning correlators from the flat-space optical theorem, obtain the cosmological tree theorem from the Feynman tree theorem, and uplift BCFW recursion relations to (E)AdS via dressing. We also show that flat-space soft theorems reproduce the soft limits of (E)AdS correlators, and find indications of an emergent universal structure in subleading soft limits. These results provide evidence that key features of cosmological correlators can be systematically understood as dressed manifestations of flat-space physics.", "url": "https://arxiv.org/abs/2606.05289", "type": "理论", "summary": "1. 本工作利用辅助传播子 dressing 方法，将(E)AdS 宇宙学关联函数映射为平空间振幅，进而推导了自旋关联子的切割规则、树图定理及 BCFW 递推关系的 (E)AdS 对应物。\n2. 核心卖点在于揭示了宇宙学关联函数的幺正性、递归结构与软极限行为均可直接追溯至平空间物理，并通过 dressing 机制系统提升至弯曲时空。\n3. 这为建立宇宙学关联函数与平空间散射振幅之间的统一对应关系提供了坚实框架，并暗示次领头软极限中存在普适性结构，可指导后续理论构造与计算。", "summary_source": "deepseek", "authors": [{"name": "Arhum Ansari"}, {"name": "Deep Mazumdar"}, {"name": "Brijesh Thakkar"}], "featured_authors": [{"name": "Arhum Ansari"}, {"name": "Deep Mazumdar"}, {"name": "Brijesh Thakkar"}], "author_count": 3}, {"id": "2606.05303", "category": "hep-th", "title": "Krylov Complexity: Flat bands and Carroll breaking deformations", "abstract": "Systems with flat band structures, when written in the language of Compact Localised States (CLS), have been shown to be explicitly invariant under supertranslation symmetries, making Carrollian symmetries inherently important for such systems. In this work, we explore the state dynamics of these systems, fo
