gauge theories, and that it significantly extends the range of applicable examples. To ensure consistency with gauge invariance, we also identify a unimodularity condition that is weaker than the one that is normally employed in the literature, so that we can apply twists that would otherwise be left out. Finally, we also prove a planar equivalence theorem stating that the Feynman diagrams of the deformed theories retain an undeformed internal structure, with the twist acting only on their external legs. All these results are important to identify and work with deformations of $\\mathcal N=4$ super Yang-Mills that are proposed to be dual to homogeneous Yang-Baxter deformations of the $AdS_5\\times S^5$ superstring, but the applicability of our construction and results goes beyond that.", "url": "https://arxiv.org/abs/2608.04097", "type": "理论", "summary": "1. 该工作通过Drinfel'd扭结实现星积，给出场论与规范理论非对易形变的系统构造，所覆盖的扭结族包括由共形对称与超对称等主动对称变换生成的类型。\n2. 其核心卖点在于提出弱于文献常用条件的幺模性条件以保证规范不变性，并证明平面等价定理，即形变理论的费曼图保留未形变的内部结构，扭结只作用于外腿。\n3. 该构造可直接用于识别与AdS5×S5超弦齐次Yang-Baxter形变对偶的N=4超杨-米尔斯形变，也为相关规范与场论形变提供可推广的研究途径。", "summary_source": "deepseek", "authors": [{"name": "Riccardo Borsato"}, {"name": "Tim Meier"}], "featured_authors": [{"name": "Riccardo Borsato"}, {"name": "Tim Meier"}], "author_count": 2}, {"id": "2608.04107", "category": "hep-th", "title": "Exact Modular Completion of the ABJM Effective Twisted Superpotential", "abstract": "The effective twisted superpotential governs the supersymmetric partition functions of three-dimensional $\\mathcal{N}=2$ theories in the Cardy limit and, at large $N$, the gravitational blocks that are glued into the entropy function of supersymmetric $\\mathrm{AdS}_4$ black holes. We determine its on-shell structure for $\\mathrm{U}(N)_k\\times\\mathrm{U}(N)_{-k}$ ABJM theory at the universal twist, using a machine-learning discovery pipeline---physics-informed symbolic regression with integer-relation detection---applied to Bethe-vacuum data of up to $800$ digits. Its perturbative part terminates after two terms, a shifted-rank $3/2$-power and an $N$-independent constant map, which we obtain in closed form for every integer level. Its type-IIA genus expansion admits a closed coefficient formula at arbitrary genus, involving binomial and Bernoulli-number terms, and is asymptotic. For $k=1,2,4$ the entire finite-$N$ remainder is a single absolutely convergent divisor-sum $q$-series, obtained by applying a first-order differential operator to the Eichler integral of a weight-four Eisenstein series on $\\Gamma_0(2)$ or $\\Gamma_0(4)$. This closed form reproduces the data to $\\sim\\!10^{-797}$.", "url": "https://arxiv.org/abs/2608.04107", "type": "理论", "summary": "1. 该工作利用物理信息符号回归与整数关系检测分析最高800位Bethe真空数据，精确确定了普遍扭曲下U(N)_k×U(N)_-k ABJM理论有效扭曲超势的在壳结构。\n2. 其技术核心是：微扰部分在两项后终止并给出任意整数k的闭式，IIA型超弦亏格展开具备含二项式系数和Bernoulli数的任意亏格闭式；而k=1,2,4的有限N余项可写成由权4 Eisenstein级数的Eichler积分经一阶微分算子得到的绝对收敛除数求和q级数，数值精度高达约10^-797。\n3. 这一模完备构造为AdS4超对称黑洞熵函数中引力块的模性质、渐近级数的可和性以及有限N量子修正间的严格联系提供了新的出发点与可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Seyed Morteza Hosseini"}], "featured_authors": [{"name": "Seyed Morteza Hosseini"}], "author_count": 1}, {"id": "2608.04204", "category": "hep-th", "title": "Constants in Sequences of M2-brane Partition Functions", "abstract": "We determine in closed form the $N$-independent constant terms in the all-order $1/N$ expansions of the topologically twisted index and of the associated Bethe potential for the ABJM theory, as well as the Bethe potential constant of the ADHM theory. We reconstruct these constants analytically from high-precision Bethe-Ansatz numerics, verify them down to the level of non-perturbative corrections, and find them to be closely related to the constant map function $A$ governing the round three-sphere partition function. The resulting expressions for the ADHM and ABJM constants pass the non-trivial test dictated by 3d mirror symmetry. Via recently established factorization relations, they also determine in closed form the $N$-independent constant contribution to the squashed three-sphere partition function, through the first two leading orders in its large-squashing expansion. These constants supply precisely the piece left undetermined in the recent exact results for 3d supersymmetric partition functions to all orders in the $1/N$ expansion, and thereby mark an important step toward completing them, both in field theory and in the dual quantum gravity description.", "url": "https://arxiv.org/abs/2608.04204", "type": "理论", "summary": "1. 该工作以闭式给出ABJM理论拓扑扭缠指标与Bethe势以及ADHM理论Bethe势在全阶1/N展开中与N无关的常数项。\n2. 其技术卖点在于从高精度Bethe-Ansatz数值解析重构这些常数，经非微扰修正验证，并发现其与圆三球面配分函数的常数映射函数A密切关联。\n3. 这些常数通过3d镜像对称及因子化关系补全了三维超对称配分函数在1/N展开中此前的未定部分，对场论和双重量子引力描述具有明确推进意义。", "summary_source": "deepseek", "authors": [{"name": "Junho Hong"}], "featured_authors": [{"name": "Junho Hong"}], "author_count": 1}, {"id": "2608.04229", "category": "hep-th", "title": "Boundary Conditions and Entanglement in Anti-de Sitter Space", "abstract": "We study the entanglement entropy of a conformally coupled scalar field at its ground state in $(3+1)$-dimensional AdS space in global coordinates. We consider spherical entangling surfaces centered at the origin of AdS and allow for general boundary conditions at the conformal boundary. Through numerical and analytical means, we show that the UV-divergent part of the entropy has a universal form, while the UV-finite part is sensitive to the boundary conditions. We determine the dependence of the latter part on mixed boundary conditions that interpolate between Dirichlet and Neumann.", "url": "https://arxiv.org/abs/2608.04229", "type": "理论", "summary": "1. 该工作在(3+1)维反德西特时空全局坐标下，研究了共形耦合标量场基态对球状纠缠面的纠缠熵，并允许共形边界上的一般边界条件。\n2. 其核心结果是紫外交散部分具有普适形式，而紫外有限部分依赖边界条件，并定量确定了介于狄利克雷与诺伊曼之间的混合边界条件的依赖关系。\n3. 这为理解全息对应中边界条件对量子纠缠结构的影响提供了具体参照，也对截断或量子引力学修正研究有所启发。", "summary_source": "deepseek", "authors": [{"name": "Konstantinos Boutivas"}, {"name": "Dimitrios Katsinis"}, {"name": "Georgios Pastras"}, {"name": "Nathan Smeyers"}, {"name": "Nikolaos Tetradis"}], "featured_authors": [{"name": "Konstantinos Boutivas"}, {"name": "Dimitrios Katsinis"}, {"name": "Georgios Pastras"}, {"name": "Nathan Smeyers"}, {"name": "Nikolaos Tetradis"}], "author_count": 5}, {"id": "2608.04248", "category": "hep-th", "title": "Tilts from 2-Groups", "abstract": "2-group global symmetries intertwine 0-form and 1-form symmetries in an interesting way. We analyze universal constraints on lines which are charged under the 1-form subgroup of a 2-group, and show that they generically break the 0-form symmetry explicitly. This gives rise to a family of line defects parameterized by the broken symmetry generators, whose existence is invariant under the renormalization group flow of the bulk-defect system. The symmetry breaking is enforced by a `family anomaly,' which is a topological obstruction to a symmetric defect. Our main tools are the Wess-Zumino consistency condition and a generalized anomaly inflow formalism for defects and boundaries. For nonabelian continuous 2-groups the family anomaly stems from a higher Berry connection on the moduli space of defects, and constrains response functions that probe the local action of the broken symmetry. In the continuous abelian case we apply differential cohomology to the 2-group background fields to uncover a subtle generalization of the Wess-Zumino condition, while in the discrete case we recast it in terms of the associativity of symmetry defects. We give numerous illustrative examples, computing when possible explicit forms of the tilt operator (which probes the linear response of the defect to the broken symmetry) and its higher analogs, which are crucial for matching the family anomaly. We also discuss universal features such as how symmetry violation by charged line defects is related to symmetry breaking hierarchies in the bulk, and highlight a number of subtle points including the distinction between simple and non-simple lines, and Postnikov class resolution.", "url": "https://arxiv.org/abs/2608.04248", "type": "理论", "summary": "1. 该工作研究二维群整体对称性中带1-形式荷的线缺陷，证明其一般会显式破缺0-形式对称性。\n2. 其卖点在于用Wess-Zumino条件和广义异常流入构造“族异常”，并在连续非阿贝尔、连续阿贝尔及离散情形分别用高Berry联络、微分上同调和缺陷结合性刻画倾斜算符。\n3. 这为体-缺陷系统的对称性破缺层级与重整化流不变量提供了普适约束，并澄清了简单与非简单线以及Postnikov类等微妙概念。", "summary_source": "deepseek", "authors": [{"name": "Sven Harder"}, {"name": "Theodore Jacobson"}, {"name": "Zhengdi Sun"}], "featured_authors": [{"name": "Sven Harder"}, {"name": "Theodore Jacobson"}, {"name": "Zhengdi Sun"}], "author_count": 3}, {"id": "2608.04356", "category": "hep-th", "title": "Wilson surface correlator in AdS/CFT", "abstract": "We use the AdS/CFT correspondence to show that for two spherical Wilson surfaces, both in the fundamental representation of $SU(N)$ gauge group, in the six-dimensional $(2,0)$ theory, in the large $N$ limit there is a first order Gross-Ooguri phase transition at a certain critical separation distance that we obtain numerically.", "url": "https://arxiv.org/abs/2608.04356", "type": "理论", "summary": "1. 该工作利用AdS/CFT对偶，计算了六维(2,0)理论中两个基本表示球面Wilson面关联子在大N极限下的行为。\n2. 其技术卖点在于数值确定临界分离距离，并证明关联子在该处发生Gross-Ooguri型一级相变。\n3. 这为研究高维非局域算符的相结构与全息几何转变提供了可推广的范例。", "summary_source": "deepseek", "authors": [{"name": "Andreas Gustavsson"}], "featured_authors": [{"name": "Andreas Gustavsson"}], "author_count": 1}, {"id": "2608.04387", "category": "hep-th", "title": "Tensor Network Formulation of $\\mathcal{PT}$-Symmetric Quantum Field Theory", "abstract": "We develop a non-perturbative analytic tensor network formulation of $\\mathcal{PT}$-symmetric scalar field theories defined on complex integration contours. Applying this formulation to the two-dimensional $\\mathcal{PT}$-symmetric $\\phi^4$ theory at negative quartic coupling, we derive an explicit analytic expression for the initial tensor and show that its components separate into even and odd sectors according to the parity of the sum of the tensor indices. We further formulate the theory on an alternative complex contour and analytically establish, in arbitrary dimensions, an exact finite-volume relation between the lattice partition function defined on this contour and the real part of the analytic continuation of the Hermitian lattice $\\phi^4$ partition function to negative quartic coupling.", "url": "https://arxiv.org/abs/2608.04387", "type": "理论", "summary": "1. 该工作为定义在复积分轮廓上的PT对称标量场论建立了非微扰解析张量网络表述。\n2. 其对二维负四次耦合phi^4给出初始张量的显式表达式，证明其分量按指标和为奇偶分为两类，并在任意维严格建立了另一复轮廓下配分函数与厄米phi^4解析延拓实部的有限体积关系。\n3. 这为借助张量网络研究PT对称场论的非微扰物理、奇异性结构及其与厄米理论的关系提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Yasuyuki Hatsuda"}, {"name": "Kengo Kikuchi"}], "featured_authors": [{"name": "Yasuyuki Hatsuda"}, {"name": "Kengo Kikuchi"}], "author_count": 2}, {"id": "2608.04522", "category": "hep-th", "title": "Critical and multicritical Kasner scaling in holographic phase transitions", "abstract": "We study how holographic phase transitions imprint their scaling laws on the local Kasner geometry inside Einstein-scalar black holes. At fixed double-trace coupling, we derive the near-critical scaling of the deviation of the first-epoch Kasner exponent from the Schwarzschild value: $p_t^{(1)}+\\frac{1}{3} \\propto O^2 \\propto (T_c-T)^{1/r}$, where $O$ denotes the boundary condensate and $r$ labels ordinary criticality ($r=1$), tricriticality ($r=2$), and higher multicriticality ($r\\geq3$). A super-exponential scalar potential generates a sequence of Kasner epochs separated by scalar-field bounces. We further find that any later epoch that can be tracked continuously across the transition inherits the same temperature exponent, while its coefficient depends on the epoch. Numerical solutions confirm these predictions for the ordinary and tricritical cases. Finally, we show analytically that the leading irrelevant exponent of the infrared fixed point governs the low-temperature Kasner scaling, and verify the resulting scaling numerically for the first Kasner exponent.", "url": "https://arxiv.org/abs/2608.04522", "type": "理论", "summary": "1. 该工作研究全息相变如何将其临界标度律印刻在爱因斯坦-标量黑洞内部的局部 Kasner 几何上。\n2. 其核心在于推导出第一纪元 Kasner 指数偏离 Schwarzschild 值满足 \\(p_t^{(1)}+1/3\\propto O^2\\propto (T_c-T)^{1/r}\\)，并揭示超指数势可产生由标量场反弹分隔的多个 Kasner 纪元，且后续纪元继承同一温度指数。\n3. 文中证明红外不动点领头无关算符的指数控制低温 Kasner 标度，这为从黑洞内部几何探测全息临界性与多重临界性提供了途径。", "summary_source": "deepseek", "authors": [{"name": "Ling-Long Gao"}, {"name": "Yan Liu"}, {"name": "Hong-Da Lyu"}], "featured_authors": [{"name": "Ling-Long Gao"}, {"name": "Yan Liu"}, {"name": "Hong-Da Lyu"}], "author_count": 3}, {"id": "2608.04595", "category": "hep-th", "title": "On the Fermion Level Crossing in the Electroweak Instanton Background", "abstract": "We investigate fermion level crossing in the electroweak instanton background, taking into account the Euclidean-time dependence of the fermion energy throughout our analysis, from the field equations to the spectral flow of fermion energy levels. Modifying the standard fermion ansatzes, we show that, irrespective of the model parameters, the duration over which the fermion energy spectrum flows from one continuum to another corresponds to exactly one unit change in the Chern--Simons number of the instanton. We further demonstrate that incorporating this time dependence is essential for establishing a one-to-one correspondence between the number of fermion zero modes and the instanton winding number, providing a numerical confirmation of the index theorem in the context of instanton backgrounds.", "url": "https://arxiv.org/abs/2608.04595", "type": "理论", "summary": "1. 该工作研究电弱瞬子背景中费米子能级穿越，并在从场方程到谱流的分析中计入费米子能量的欧几里得时间依赖。\n2. 通过修改标准费米子ansatz，证明能谱流经连续态的持续时间恰好对应瞬子Chern–Simons数改变一个单位，且该时间依赖是实现零模数与绕数一一对应的关键。\n3. 这以数值方式确认了瞬子背景中的指标定理，为理解电弱非微扰过程中的费米子数改变提供了明确基础。", "summary_source": "deepseek", "authors": [{"name": "P. E. Mogaddam"}, {"name": "S. S. Gousheh"}], "featured_authors": [{"name": "P. E. Mogaddam"}, {"name": "S. S. Gousheh"}], "author_count": 2}, {"id": "2608.04599", "category": "hep-th", "title": "Probe Dependence of the Imaginary Part of HTEE", "abstract": "We investigate the holographic timelike entanglement entropy (HTEE) in a five-dimensional anisotropic background, dual to a strongly coupled anisotropic plasma. Using the complex extremal surface method, we compute the HTEE analytically in the high-temperature, small-anisotropy limit $aT \\ll 1$. We consider two different orientations of the boundary timelike interval: one perpendicular to the anisotropy direction and one parallel to it. We find that the imaginary part of the HTEE is not a universal property of the geometry but depends sensitively on the orientation of the extremal surface relative to the anisotropy. This demonstrates that the imaginary part arising from the UV logarithmic divergence is a probe-dependent quantity. Our results suggest that the imaginary part of HTEE can serve as a diagnostic of the coupling between the extremal surface and the anisotropic degrees of freedom of the dual field theory.", "url": "https://arxiv.org/abs/2608.04599", "type": "理论", "summary": "1. 该文在五维各向异性背景下，用复极值面方法解析计算高温小各向异性极限下全息类时纠缠熵(HTEE)的虚部，并比较边界类时间隔垂直和平行于各向异性方向的两种取向。\n2. 其技术要点是发现HTEE虚部并非几何普适量，而是依赖极值面相对于各向异性的取向，源于紫外对数发散的虚部具有探针依赖性。\n3. 这提示HTEE虚部可作为诊断极值面与对偶场论各向异性自由度耦合强度的工具，为全息纠缠诊断各向异性等离子体提供新探针。", "summary_source": "deepseek", "authors": [{"name": "Mohammad Ali-Akbari"}], "featured_authors": [{"name": "Mohammad Ali-Akbari"}], "author_count": 1}, {"id": "2608.04665", "category": "hep-th", "title": "Wavefunctions of AdS$_3$ Universes and $T\\bar{T}$-deformed Torus Partition Functions", "abstract": "We study wavefunctions of quantum gravity in asymptotically AdS$_3$ spacetimes and their relation to $T\\bar T$-deformed torus partition functions. We show that the deformed partition function is given by an invertible integral transform of bulk wavefunctions, with a kernel encoding the relation between the $T\\bar T$ coupling and the radial or temporal coordinate in the bulk. The invertibility of the transform allows the bulk wavefunction to be reconstructed from the family of $T\\bar T$-deformed partition functions. In the CFT limit, the kernel effectively localizes at the asymptotic boundary, recovering the standard holographic relation in which the partition function on the torus is determined by the boundary value of the bulk wavefunction. For finite deformation, the kernel shifts the effective holographic screen away from the asymptotic boundary and broadens it into a finite bulk region. A $T\\bar{T}$-deformed partition function at fixed coupling corresponds to a finite-width bulk wavepacket centered around a radial or temporal location set by the deformation scale. In Euclidean signature, the construction arises naturally from wavefunctions of Rindler AdS$_3$, while after a double Wick rotation it admits a Lorentzian interpretation in terms of closed AdS$_3$ torus universes without asymptotic boundaries. Finally, we discuss the extension of the present construction to de Sitter torus universes and its implications for de Sitter holography, and comment on possible generalizations to more general spatial topologies and higher-dimensional spacetimes.", "url": "https://arxiv.org/abs/2608.04665", "type": "理论", "summary": "1. 该工作研究渐近AdS₃时空中量子引力波函数与T\\bar{T}形变环面配分函数之间的关系，建立了二者间的积分变换表示。\n2. 核心在于变换核可逆且由形变参数与径向或时间坐标的关系决定，有限形变将全息屏从边界内移并展宽为有限体区域中的波包。\n3. 这为从形变配分函数族反演重建体波函数提供了明确途径，并可能推广至de Sitter环面宇宙及高维时空全息研究。", "summary_source": "deepseek", "authors": [{"name": "Shinji Hirano"}], "featured_authors": [{"name": "Shinji Hirano"}], "author_count": 1}, {"id": "2608.04705", "category": "hep-th", "title": "Corrections to the Unruh Effect from Robin Boundary Conditions in Punctured Minkowski Spacetime", "abstract": "We consider a real massless scalar field in punctured Minkowski spacetime, endowed at the removed origin with the stable one-parameter family of Robin boundary conditions $G(0)-\\beta G'(0)=0$, $\\beta\\geq0$. We obtain the boundary-induced part of the static ground-state Wightman function in closed form and study the response of a uniformly accelerated Unruh-DeWitt detector. The puncture breaks the boost symmetry underlying the stationary Unruh response, so the boundary-induced pullback is nonstationary in proper time. The corresponding subtracted detector contribution can either enhance or suppress the ordinary Minkowski response and depends on the Robin parameter, the detector gap, and the portion of the trajectory sampled. For the unshifted, radially aligned trajectory studied in detail, we prove that the boundary-induced pullback is absolutely integrable in the two proper-time variables. Consequently, as the smooth interaction is extended over the full detector history, this contribution approaches a finite limit and remains $O(1)$, producing no additional term linear in the interaction duration. The formal Neumann limit is singular: the boundary-induced two-point function grows logarithmically because of an infrared singularity in the $s$-wave sector, and the numerical response exhibits growth consistent with this asymptotic behavior.", "url": "https://arxiv.org/abs/2608.04705", "type": "理论", "summary": "1. 该工作研究去原点闵可夫斯基时空中满足Robin边界条件的无质量标量场，并给出均匀加速Unruh-DeWitt探测器的边界诱导响应修正。\n2. 其要点在于闭合形式的Wightman函数显示固有时拉回为非平稳，修正可增强或抑制常态响应；径向轨迹下该贡献被证明绝对可积，全程作用后保持有限且无线性增项，而Neumann极限因s波红外奇异呈对数增长。\n3. 这为时空穿孔与边界条件如何破坏boost对称并产生有限但参数依赖的Unruh修正，以及奇异极限中红外行为的物理后果提供了明确的理论参照。", "summary_source": "deepseek", "authors": [{"name": "Nickolas P. Botta"}, {"name": "João Paulo M. Pitelli"}, {"name": "Ricardo A. Mosna"}], "featured_authors": [{"name": "Nickolas P. Botta"}, {"name": "João Paulo M. Pitelli"}, {"name": "Ricardo A. Mosna"}], "author_count": 3}, {"id": "2608.04717", "category": "hep-th", "title": "Quantization of Algebraic Varieties Defined by Casimir Polynomials via Matrix Regularization: Fuzzy $S^7$ and Beyond", "abstract": "We study the quantization of algebraic varieties defined by equations involving Casimir polynomials of compact semisimple Lie algebras. The Casimir polynomials belong to the Poisson center of the corresponding Lie-Poisson algebra. For this purpose, we employ a recently developed matrix regularization of Lie-Poisson algebras. In particular, using its formulation based on reducible representations, we construct quantizations of these algebraic varieties through their decomposition into coadjoint orbits, including singular orbits. As a concrete example, we present the construction of fuzzy $S^7$ in detail.", "url": "https://arxiv.org/abs/2608.04717", "type": "理论", "summary": "1. 该工作利用可约表示下的矩阵正则化方法，研究了由紧致半单李代数Casimir多项式定义的代数簇的量子化构造。\n2. 其技术要点在于借助Casimir多项式属于Lie-Poisson代数Poisson中心这一性质，将代数簇分解为包括奇异轨道在内的协伴随轨道，从而系统构造出模糊S^7等模糊流形。\n3. 这为高维模糊空间及含奇异轨道的代数几何量子化提供了通用框架，或可启发非交换几何与量子引力中的离散时空模型研究。", "summary_source": "deepseek", "authors": [{"name": "Akifumi Sako"}], "featured_authors": [{"name": "Akifumi Sako"}], "author_count": 1}, {"id": "2608.04745", "category": "hep-th", "title": "Quantum gravity around ultracold black holes from DSSYK", "abstract": "We propose a quantum description of the ultracold Reissner-Nordström de Sitter black hole via a specific flat space limit of the double-scaled SYK model. Fluctuations in this regime reduce to flat JT gravity, which is ill-behaved as a quantum system. We show that including the first subleading correction to the dilaton potential breaks the leading order Hagedorn degeneracy but does not resolve the structural problem. Finally, we leverage the gauged description of the sine dilaton gravity model to propose a novel quantization of the near-horizon dynamics of ultracold black holes. This leads to a new proposal for the partition function where states in the asymptotics of the spectrum are suppressed dynamically, and features of a discretized spacetime arise. We obtain a non-perturbative low temperature behavior of the partition function, which is quite different than the cold and Nariai physics. Our result can be interpreted as a dynamical way to enforce cosmic censorship on the quantum system.", "url": "https://arxiv.org/abs/2608.04745", "type": "理论", "summary": "1. 该工作借助双标度SYK模型的平直空间极限，提出了超冷Reissner-Nordström de Sitter黑洞的量子描述方案。\n2. 其技术关键在于对正弦胀子引力模型的规范描述进行量子化，从而在配分函数中动态抑制高能态并呈现离散时空特征，得到区别于冷黑洞与Nariai极限的非微扰低温行为。\n3. 这一结果可视为在量子系统中动态实现宇宙监督假设的一种途径，为研究超冷黑洞近视界量子动力学提供了新框架。", "summary_source": "deepseek", "authors": [{"name": "Francesca Mariani"}, {"name": "Thomas G. Mertens"}, {"name": "Jacopo Papalini"}, {"name": "Thomas Tappeiner"}], "featured_authors": [{"name": "Francesca Mariani"}, {"name": "Thomas G. Mertens"}, {"name": "Jacopo Papalini"}, {"name": "Thomas Tappeiner"}], "author_count": 4}, {"id": "2608.05071", "category": "hep-th", "title": "Generalized comodule tube algebras for boundary and domain wall defects of (2+1)D topological order", "abstract": "The tube algebra, which carries the structure of a $C^*$ weak Hopf algebra, is a fundamental tool for characterizing topological excitations in topological phases. In this work, we generalize the tube algebra framework to codimension-2 defects in $(2+1)$D gapped phases described by Turaev--Viro--Barrett--Westbury TQFTs, with particular emphasis on Levin--Wen string-net models. We show that such codimension-2 defects are described by a \\emph{defect tube algebra}, which naturally carries the structure of a comodule algebra over the weak Hopf tube algebra associated with the topological excitations. Boundary and domain wall defects are then characterized by the representations of the corresponding boundary and domain wall defect tube algebras. In particular, a domain wall defect tube algebra can be regarded as a generalized Drinfeld double of the tube algebras associated with the two adjacent boundary defects. More generally, for a domain wall joining $N$ bulk phases, the associated domain wall defect tube algebra can be viewed as an $N$-tuple algebra. This perspective extends naturally to general $k$-defects, namely codimension-2 defects joining $k$ codimension-1 defects, for which the resulting generalized tube algebra carries the structure of a multicomodule algebra.", "url": "https://arxiv.org/abs/2608.05071", "type": "理论", "summary": "1. 该工作将管代数推广到(2+1)维TVBW拓扑场论的余维二缺陷，给出了Levin-Wen弦网模型中边界与畴壁的缺陷管代数描述。\n2. 其要点是证明缺陷管代数具有关于激发弱Hopf管代数的余模代数结构，并把畴壁代数实现为相邻边界管代数的广义Drinfeld double，进而推广到N元及多余模代数。\n3. 这为拓扑相中边界、畴壁及一般k缺陷的表示论分类提供了统一代数框架，可直接用于弦网模型的缺陷研究。", "summary_source": "deepseek", "authors": [{"name": "Zhian Jia"}, {"name": "Sheng Tan"}], "featured_authors": [{"name": "Zhian Jia"}, {"name": "Sheng Tan"}], "author_count": 2}, {"id": "2608.05146", "category": "hep-th", "title": "Machine-Learning Search for Lax Connections", "abstract": "We apply a machine learning framework to search for Lax connections in two-dimensional non-linear sigma models using local current data. For the $SU(2)$ principal chiral model and the symmetric coset $S^2 = SU(2)/U(1)$, the method successfully recovers the full spectral-parameter families without using the known spectral curves as training targets. For the non-symmetric coset $T^{1,1}$, the optimization converges to reproducible low-loss maps that distill into a compact block-diagonal ansatz. However, analytic verification shows that this candidate is a ``fake Lax'' connection which satisfies on-shell flatness but fails to encode the two-dimensional equations of motion, whereas its point-particle reduction yields a genuine mechanical Lax pair. These results demonstrate that machine learning can effectively propose candidate ansätze and identify spectral structures, but low flatness loss alone does not certify genuine integrability, underscoring the necessity of analytic validation.", "url": "https://arxiv.org/abs/2608.05146", "type": "理论", "summary": "1. 该工作利用机器学习框架，以局域流数据搜索二维非线性sigma模型中的Lax联络。\n2. 它成功恢复SU(2)主手征模型与对称陪集S^2的完整谱参数族，但对非对称陪集T^{1,1}所得低损失块对角拟设经解析验证为伪Lax联络：仅在壳平直，不能编码二维运动方程，其点粒子约化才给出真正力学Lax对。\n3. 这表明低平直度损失不足以判定真实可积性，机器学习能有效提出拟设和识别谱结构，但必须依赖解析验证确保物理可靠性。", "summary_source": "deepseek", "authors": [{"name": "Osamu Fukushima"}, {"name": "Tomohiro Shigemura"}, {"name": "Ryosuke Suda"}, {"name": "Norihiro Tanahashi"}, {"name": "Kentaroh Yoshida"}], "featured_authors": [{"name": "Osamu Fukushima"}, {"name": "Tomohiro Shigemura"}, {"name": "Ryosuke Suda"}, {"name": "Norihiro Tanahashi"}, {"name": "Kentaroh Yoshida"}], "author_count": 5}, {"id": "2608.04503", "category": "math-ph", "title": "Hidden Supersymmetry in Wigner-Yang Quantum Mechanics", "abstract": "We consider a quantum system on the real line obeying a deformed Heisenberg algebra originally proposed by Wigner in 1950. Its explicit coordinate representation was provided by Yang in 1951 and in essence is identical in form with Dunkl's difference-differential operator introduced in 1989 in connection with roots systems of refection groups. Under certain conditions such quantum systems exhibit a supersymmetric (SUSY) structure where the reflection operator acts as the grading operator. We present a generalisation of Yang's representation by first considering only of one the two equations of motion in phase space. The corresponding non-interacting system is found to represent Witten's model of SUSY quantum mechanics. Imposing also the second equation of motion the original result of Wigner and Yang is reconsidered by extending their discussion to general symmetric potentials on the real line. As explicit example we discuss the harmonic oscillator and an attractive Coulomb-like potential $V(x)=-\\gamma/|x|$. We also establish a Hooke-Newton duality between this Coulomb-like system and the original Wigner-Yang harmonic oscillator system.", "url": "https://arxiv.org/abs/2608.04503", "type": "理论", "summary": "1. 该工作研究了由Wigner提出、Yang给出坐标表示的一维变形海森堡代数量子系统，并将其推广到一般对称势情形。\n2. 其要点在于证明反射算符可充当分级算符并揭示隐超对称，且仅满足一个运动方程时系统等价于Witten超对称量子力学模型。\n3. 这为反射与Dunkl算符相关的可解模型融入超对称框架提供了新视角，并建立了Coulomb型势与Wigner-Yang谐振子间的Hooke-Newton对偶。", "summary_source": "deepseek", "authors": [{"name": "Georg Junker"}], "featured_authors": [{"name": "Georg Junker"}], "author_count": 1}, {"id": "2608.04829", "category": "math-ph", "title": "Multi-frequency far-field data enrichment for electromagnetic source reconstruction", "abstract": "Reconstructing unknown electromagnetic sources from far-field radiation patterns is a fundamental inverse problem with broad applications in biomedical imaging, non-destructive testing, and telecommunications. In practical settings, however, collecting dense multi-frequency far-field measurements at the Nyquist sampling rate is often infeasible. Under-sampled or sparse data introduce non-radiating source components that sever the uniqueness of the solution, creating severe artifacts when standard inversion techniques are applied. To overcome this limitation, we present a two-stage reconstruction strategy exploiting the physical property that compactly supported, geometrically sparse sources exhibit a finite rate of innovations (FRI). In the first stage, we construct an associated wrap-around structured Hankel matrix. By leveraging the low-rank property of the matrix due to FRI of the unknown sources, we enrich the sub-sampled data. To that end, we convert missing multi-frequency far-field data recovery into a constrained matrix completion task solved via Annihilating Filter-based Low-rank Hankel Matrix Completion Approach (ALOHA). In the second stage, a Fourier inversion scheme reconstructs the current source density from the enriched dataset. Extensive numerical evaluations on electromagnetic source models show that our enrichment framework effectively eliminates under-sampling artifacts and resolves non-uniqueness challenges. The method delivers accurate and stable reconstructions under high sub-sampling rates (e.g., with $30$\\% to $50$\\% available samples) and strong noise conditions ($10$ dB SNR), outperforming standard $\\ell_1$-compressed sensing baselines.", "url": "https://arxiv.org/abs/2608.04829", "type": "理论", "summary": "1. 该工作针对从欠采样多频远场辐射模式重建电磁源的反问题，提出一种两阶段数据增广方法，以克服非辐射分量导致的伪影与解非唯一性。\n2. 其核心是利用紧支撑几何稀疏源的有限新息率构造环绕结构Hankel矩阵，通过低秩矩阵补全技术(ALOHA)恢复缺失频率数据，再以傅里叶反演重建源电流密度。\n3. 在仅30%至50%样本和10 dB噪声条件下仍能消除伪影并稳定重建，优于标准l1压缩感知基线，为电磁逆源及一般稀疏反问题提供了可推广的求解范式。", "summary_source": "deepseek", "authors": [{"name": "Atyab Khalifa Al-Shaqsi"}, {"name": "Heba Mohammed Al-Subhi"}, {"name": "Xianchao Wang"}, {"name": "Shujaat Khan"}, {"name": "Abdul Wahab"}], "featured_authors": [{"name": "Atyab Khalifa Al-Shaqsi"}, {"name": "Heba Mohammed Al-Subhi"}, {"name": "Xianchao Wang"}, {"name": "Shujaat Khan"}, {"name": "Abdul Wahab"}], "author_count": 5}, {"id": "2608.04972", "category": "math-ph", "title": "Phase transitions in generalized XY models", "abstract": "We associate height function models to a range of generalized two-dimensional XY models and prove that delocalisation of the height function model rules out exponential decay of the nematic order parameter in the primal spin model. The argument is based on a generalized loop representation which relates the variance of a height difference between two faces to the nematic order parameter. This generalizes the results by van Engelenburg and Lis (2023). The range of models also includes the much-studied generalized XY model as proposed by Korshunov and independently by Lee and Grinstein, where neighbouring spins interact ferromagnetically favouring parallel alignment and nematically favouring parallel or antiparallel alignment. Moreover, we recover the existence of a nematic region by a classical comparison argument of Pfister (1982).", "url": "https://arxiv.org/abs/2608.04972", "type": "理论", "summary": "1. 该工作将高度函数模型与一类广义二维XY模型相联系，并证明高度函数模型的去局域化排除了原自旋模型中向列序参量的指数衰减。\n2. 其核心论证基于广义圈表示，将两个面之间高度差的方差直接关联到向列序参量，从而推广了van Engelenburg与Lis的结果，覆盖Korshunov及Lee-Grinstein广义XY模型。\n3. 借助Pfister经典比较论证还恢复了向列相区域的存在，为二维广义XY模型相变研究提供了统一且可移植的技术路径。", "summary_source": "deepseek", "authors": [{"name": "Fabio Plaga"}], "featured_authors": [{"name": "Fabio Plaga"}], "author_count": 1}, {"id": "2608.04082", "category": "quant-ph", "title": "Quantum Many-Body Metrology of Rotation Sensing with Strong Interactions", "abstract": "We study the ultimate quantum limit of rotation sensing with a few strongly interacting bosons confined in a quasi-one-dimensional ring trap with two weak links. It is demonstrated that a self-consistent many-body solution of the problem is required to correctly predict the ultimate sensitivity of this strongly correlated many-body gyroscope to rotation. For both small rotation velocities and small particle numbers, the many-body quantum Fisher information becomes maximal for large interaction couplings, showing the potential of strongly interacting miniaturized many-body sensors to precisely estimate slow rotations with high spatial resolution.", "url": "https://arxiv.org/abs/2608.04082", "type": "理论", "summary": "1. 该工作针对囚禁于带两个弱连接的准一维环阱中的少体强相互作用玻色子，研究旋转传感的量子极限，并指出需自洽的多体解才能正确预言这种强关联陀螺仪的极限灵敏度。\n2. 其核心在于发现小粒子数与慢速旋转条件下，多体量子费希尔信息随相互作用耦合增大而达到最大，表明强关联效应本身可提升旋转测量的最优精度。\n3. 这为利用微型化强相互作用多体传感器实现高空间分辨率的慢旋转精密估计提供了明确思路，并为少体量子计量学实验提供了可检验的预言。", "summary_source": "deepseek", "authors": [{"name": "Yong-Jun Baak"}, {"name": "Uwe R. Fischer"}], "featured_authors": [{"name": "Yong-Jun Baak"}, {"name": "Uwe R. Fischer"}], "author_count": 2}, {"id": "2608.04134", "category": "quant-ph", "title": "Photon localization: a comparative study", "abstract": "We compare different measures for photon localization in terms of two-dimensional Gaussian wave packets. We find that all measures start to coalesce if the wave packet has evolved for times which are larger than a few times the inverse momentum-space width of the package. However, the Landau-Peierls wave function yields the largest positive offset <r>-ct>0 while the scalar Fourier transform of the wave packet yields the smallest offset and converges towards <r>-ct=0 fastest. We also discuss local detection of photons through a model detector consisting of ions in ion traps. The position-dependent detection probabilities are inferred from the scattering matrix. We find that the local detection probability for photons can be expressed in terms of three of the proposed localization measures, viz. the Landau-Peierls wave function, the energy wave function, and the Hawton density. Those three porposals also remain close throughout the time evolution of the single-photon wave packet.", "url": "https://arxiv.org/abs/2608.04134", "type": "理论", "summary": "1. 该工作通过二维高斯波包比较了多种光子局域化度量，并利用离子阱模型探测器研究光子的局域探测。\n2. 主要结果是各度量在演化时间超过动量空间宽度倒数后趋于一致，但Landau-Peierls波函数给出最大正偏移<r>-ct，而标量傅里叶变换的偏移最小且最快趋于零。\n3. 局域探测概率可由Landau-Peierls波函数、能量波函数和Hawton密度三种度量表达，且三者随时间演化保持接近，为光子位置算符和探测方案提供判据。", "summary_source": "deepseek", "authors": [{"name": "Laura M. Ferguson"}, {"name": "Ricardo Rojas Castellano"}, {"name": "Kayla Oltman"}, {"name": "Joshua G. Fenwick"}, {"name": "Rainer Dick"}], "featured_authors": [{"name": "Laura M. Ferguson"}, {"name": "Ricardo Rojas Castellano"}, {"name": "Kayla Oltman"}, {"name": "Joshua G. Fenwick"}, {"name": "Rainer Dick"}], "author_count": 5}, {"id": "2608.04252", "category": "quant-ph", "title": "Dynamical Lie Algebras Cannot Describe Shallow QAOA: Cragged Terrains, Barren Plateaus, and Empirical Hardness Models", "abstract": "The dynamical Lie algebraic (DLA) theory of variational quantum algorithms (VQAs) predicts commonplace exponentially vanishing loss and gradient variances for sufficiently deep parametrized circuits. In this work, we show that these predictions fail dramatically in the shallow-circuit (and particularly constant-depth) regime for the Quantum Approximate Optimization Algorithm (QAOA) applied to the maximum independent set (MIS) problem. In a large-scale numerical study across $\\sim$23,000 problem instances, we find that barren plateaus are rare, while landscapes whose variances polynomially increase with system size---which we term \"cragged terrains\"---are common across graph families. This aggregate polynomial growth persists both for generic, low-symmetry random graphs and for highly symmetric vertex-transitive graphs, indicating that DLA-based variance predictions do not describe landscape scaling in this regime. As a stopgap alternative to the theory, we train empirical hardness models to predict instance-wise hardness metrics for QAOA-MIS. While these models generalize poorly, they nonetheless recover the correct landscape scaling class (barren plateau vs. cragged terrain) with high fidelity. Taken together, our results identify shallow QAOA for MIS as a prototypical setting in which asymptotic, unitary-design-centric predictions may be fundamentally insufficient to describe shallow variational quantum algorithms more broadly, emphasizing the need for more empirically-informed models of VQA loss landscapes.", "url": "https://arxiv.org/abs/2608.04252", "type": "理论+数值", "summary": "1. 该工作通过约两万三千个图实例的大规模数值研究，表明动力学李代数(DLA)对浅层量子近似优化算法(QAOA)求解最大独立集问题的势垒平原预测失效。\n2. 核心发现是势垒平原罕见，而方差随体系尺寸多项式增长的“崎岖地形”普遍存在，即便高对称图也如此，说明DLA无法描述该浅层区域的景观标度。\n3. 这凸显了渐近与幺正设计中心预测对浅层变分算法可能根本不足，为构建更多基于经验的损失景观模型提供了明确动机。", "summary_source": "deepseek", "authors": [{"name": "Harrison Copp"}, {"name": "Charlton Li"}, {"name": "Anžej Margeta-Cacace"}, {"name": "Amy Qiao"}], "featured_authors": [{"name": "Harrison Copp"}, {"name": "Charlton Li"}, {"name": "Anžej Margeta-Cacace"}, {"name": "Amy Qiao"}], "author_count": 4}, {"id": "2608.04263", "category": "quant-ph", "title": "Poisson-Compiled Quantum Singular Value Transformation for Power-Exponential Dissipation", "abstract": "We study quantum implementations of the contraction $\\exp(-T H^\\alpha)$ for $H=H^\\dagger\\succeq0$ and $\\alpha>0$. Poisson summation provides an exact target--alias--tail decomposition whose Fourier samples are compiled classically into a single Chebyshev polynomial, so the quantum circuit uses polynomial eigenvalue transformation rather than a frequency linear combination of unitaries. We compare block encodings of $H/\\norm{H}$ and of the shifted signal $2H/\\norm{H}-I$. Under ordinary single-sequence QSVT, parity forces the former to use an even extension, which is entire only for even positive integers. An exact quadratic lift for the shifted signal makes every positive integer entire and improves the fixed-scale approximation error for noninteger powers from $\\Theta(d^{-\\alpha})$ to $\\Theta(d^{-2\\alpha})$ within the stated access and parity classes. We derive matching degree bounds in the large-scale fixed-error and fixed-scale high-precision limits, including the output-normalization overhead $u_r$. Nearest-neighbor Laplacians give a unit-normalized shifted signal. We further establish a noncommutative Weyl--Poisson identity compatible with LCHS quadrature, and use the same polynomial construction to implement controlled dissipative families in amplitude--phase separation.", "url": "https://arxiv.org/abs/2608.04263", "type": "理论", "summary": "1. 该工作提出一种基于泊松编译的量子奇异值变换方案，用于高效实现幂指数耗散收缩 exp(−T H^α)。\n2. 其核心是将泊松求和导出的傅里叶样本编译为单一切比雪夫多项式，并利用移位信号的精确二次提升，使非整数幂的固定尺度误差由 Θ(d^{−α}) 改进至 Θ(d^{−2α})。\n3. 该方案给出匹配的度下界与输出归一化开销，且与非对易Weyl–Poisson恒等式及LCHS求积兼容，可用于受控耗散族的幅相分离模拟。", "summary_source": "deepseek", "authors": [{"name": "Chao Wang"}, {"name": "Xi-Ning Zhuang"}, {"name": "Menghan Dou"}, {"name": "Zhao-Yun Chen"}, {"name": "Guo-Ping Guo"}], "featured_authors": [{"name": "Chao Wang"}, {"name": "Xi-Ning Zhuang"}, {"name": "Menghan Dou"}, {"name": "Zhao-Yun Chen"}, {"name": "Guo-Ping Guo"}], "author_count": 5}, {"id": "2608.04354", "category": "quant-ph", "title": "The Born Representation Theorem and the Unistochastic Theorem", "abstract": "This paper presents self-contained, constructive proofs of two new theorems about stochastic matrices, with direct relevance to quantum theory. The first theorem, herein called the Born Representation Theorem, shows that each entry of any stochastic matrix can be expressed as the trace of a pairwise product of matrices, where the first factor in the pairwise product belongs to a positive-operator-valued measure (POVM) and the second factor belongs to a projection-valued measure (PVM). As its name suggests, this theorem entails that the entries of any stochastic matrix can be expressed in terms of a generalized version of the quantum-theoretic Born rule. It follows as a corollary that if the POVM in this first theorem is a PVM, then the stochastic matrix is unistochastic, meaning that its entries are each the modulus square of the corresponding entry of a unitary matrix of the same size. The second theorem proved in this paper, called the Unistochastic Theorem, then shows that by dilating the underlying vector space by a bounded number of additional dimensions if necessary, each entry of any stochastic matrix can be expressed in terms of the trace of a pairwise product for which both factors belong to PVMs, and can thus be derived via marginalization from a larger unistochastic matrix. This second theorem therefore establishes a kind of primacy of unistochastic matrices over stochastic matrices, and hints at a close connection with unitary time evolution in quantum theory. The paper concludes with a brief discussion of potential applications to discrete-time deterministic processes and Markov chains.", "url": "https://arxiv.org/abs/2608.04354", "type": "理论", "summary": "1. 该工作以构造性方式证明了关于随机矩阵的两个新定理，即Born表示定理与幺正随机定理。\n2. 其核心是将任意随机矩阵元写成POVM与PVM的配对乘积之迹，并在扩张维数后实现双PVM表示，从而把随机矩阵边缘化为更大幺正随机矩阵。\n3. 这提示随机过程可由幺正时间演化经粗粒化导出，对离散确定性过程与马尔可夫链的量子化建模具有潜在启发。", "summary_source": "deepseek", "authors": [{"name": "Jacob A. Barandes"}], "featured_authors": [{"name": "Jacob A. Barandes"}], "author_count": 1}, {"id": "2608.04369", "category": "quant-ph", "title": "Equilibrium Thermodynamics of Non-Hermitian Dirac Fermions: Caloric and Magnetic Responses", "abstract": "We establish scaling relations governing the equilibrium thermodynamics of real-spectrum non-Hermitian Dirac fermions in a magnetic field. Assuming thermalization with respect to the quasi-Hermitian Hamiltonian, a similarity transformation maps the system at the same applied field onto a Hermitian Dirac model with reduced velocity, while the Landau-level spectrum also admits a representation in terms of a reduced effective magnetic field. This structure yields scaling relations for the chemical potential, entropy, heat capacities, and orbital magnetic response in different thermodynamic ensembles. At fixed projected filling factor (PFF), the self-consistent chemical potential follows the compressed ladder of Landau levels, and the canonical thermodynamic functions are rescaled Hermitian responses. At fixed chemical potential, Landau-level crossings generate oscillatory caloric and magnetic responses governed by the same spectral compression. Quasistatic non-Hermitian deformation at fixed PFF further yields adiabatic temperature scaling. More broadly, these results establish a thermodynamic framework for real-spectrum non-Hermitian quantum matter and provide a starting point for incorporating the effects of interactions and disorder within the same formalism.", "url": "https://arxiv.org/abs/2608.04369", "type": "理论", "summary": "1. 该工作推导了实谱非厄米狄拉克费米子在磁场中平衡热力学满足的标度关系，给出了量热及磁响应的系统描述。\n2. 其核心是通过相似变换将体系映射为约化速度或约化有效磁场下的厄米狄拉克模型；在固定投影填充因子时热力学函数被重新标度，而在固定化学势时朗道能级交叉产生振荡型量热与磁响应。\n3. 这为实谱非厄米量子物质建立了普适热力学框架，并为在相同形式下纳入相互作用和无序效应提供了明确起点。", "summary_source": "deepseek", "authors": [{"name": "Francisco J. Peña"}, {"name": "Bastian Castorene"}, {"name": "Juan Pablo Esparza"}, {"name": "Vladimir Juričić"}, {"name": "Patricio Vargas"}], "featured_authors": [{"name": "Francisco J. Peña"}, {"name": "Bastian Castorene"}, {"name": "Juan Pablo Esparza"}, {"name": "Vladimir Juričić"}, {"name": "Patricio Vargas"}], "author_count": 5}, {"id": "2608.04403", "category": "quant-ph", "title": "Information locality of a quantum locally recoverable code", "abstract": "A classical linear code $C$ of length $n$ is said to have symbol locality $(r, \\delta)$ if for any index $j$ there exists a repair group $J_j \\subseteq \\{1, \\ldots, n\\}$ with $j\\in J_j$ and $|J_j| \\leq r+\\delta-1$ such that any $\\delta-1$ or fewer erasures in $J_j$ can be corrected by using codeword symbols only in $J_j$. Later it turned out that this way of defining $r$ overestimates the number of necessary codeword symbols for multiple-erasure correction, and information locality was proposed to define $r$ as the dimension of the punctured code of $C$ onto $J_j$. Recently locality $(r,\\delta)$ was proposed for quantum error-correcting codes by following the original definition of symbol locality $(r, \\delta)$. We propose a quantum counterpart of the information locality for quantum stabilizer codes constructed by Hermitian orthogonality, and a linear algebraic procedure computing a smaller repair group predicted by the proposed information locality and simultaneously reducing the number of measured observables in decoding to its minimum possible value. Then we demonstrate that the previously proposed definition of quantum locality $(r,\\delta)$ has the same drawback of overestimating the number of necessary codeword symbols for erasure correction by providing an explicit example of a quantum stabilizer code. Finally, we will give another example of a quantum stabilizer code constructed by Euclidean orthogonality and two different linear codes, with which a natural translation of the classical information locality into the quantum setting underestimates the number of necessary codeword symbols for erasure correction.", "url": "https://arxiv.org/abs/2608.04403", "type": "理论", "summary": "1. 该工作为基于 Hermitian 正交构造的量子稳定子码提出量子信息局部性定义，并给出线性代数算法以计算更小的修复组并最小化解码中测量的可观测量数目。\n2. 其要点在于通过显式码例表明既有量子局部性会高估纠擦除所需码字符号数，同时说明将经典信息局部性直接平移至 Euclid 正交构造可能低估所需符号数。\n3. 这为量子局部可恢复码的局部性刻画与高效解码提供了更精确的代数量化准则，并提示码构造方式影响信息局部性的自然推广。", "summary_source": "deepseek", "authors": [{"name": "Ryutaroh Matsumoto"}], "featured_authors": [{"name": "Ryutaroh Matsumoto"}], "author_count": 1}, {"id": "2608.04481", "category": "quant-ph", "title": "Impact of molecular orbital localization on quantum computational resources for Hamiltonian simulation: A benchmark study of hydrogen chain systems", "abstract": "We investigate how molecular orbitals used as the basis of wave function expansion and how operator coefficient-based and locality-based Hamiltonian truncation affects the computational cost of Trotter decomposition-based Hamiltonian simulation in one-dimensional hydrogen chain systems. The analysis is performed using both Hartree--Fock canonical molecular orbitals (CMOs) and Pipek--Mezey-based localized molecular orbitals (LMOs). For short hydrogen chains, we evaluate the ground-state energy and fidelity and find that, in the CMO-based wave function expansion, introducing a threshold on Hamiltonian coefficients is effective in reducing the gate cost while maintaining computational accuracy. In contrast, in the LMO-based wave function expansion, operator locality-based Hamiltonian truncation is found to be more effective. By fitting the relationship between the truncation threshold and the ground-state energies and fidelities with empirical formulas, we estimate the threshold values required to achieve high fidelity ($F \\ge 0.99$) in the ground-state wave function. Using the estimated thresholds, we then perform quantum gate resource estimation for longer hydrogen chains up to H$_{100}$. The results suggest an exponential advantage of the LMO-based wave function expansion with Hamiltonian truncation: the number of quantum gates required for Hamiltonian simulation grows polynomially when the CMO-based wave function expansion with operator coefficient-based Hamiltonian truncation is adopted, whereas it grows polylogarithmically when the LMO-based wave function expansion is combined with operator locality-based Hamiltonian truncation. These results provide useful guidelines for choosing orbital representations and Hamiltonian truncation strategies in large-scale quantum chemical simulations.", "url": "https://arxiv.org/abs/2608.04481", "type": "理论+数值", "summary": "1. 该工作以氢链体系为基准，系统研究了分子轨道定域化与哈密顿量截断策略对Trotter化量子模拟门资源的影响。\n2. 其核心发现是，正则分子轨道宜采用系数截断，而定域分子轨道宜采用局域性截断，且后者可使所需量子门数目随体系尺寸呈多对数增长。\n3. 这为大规模量子化学模拟中轨道基选择与哈密顿量近似策略提供了明确指导，并预示了定域轨道结合局域截断的扩展优势。", "summary_source": "deepseek", "authors": [{"name": "Kenji Sugisaki"}, {"name": "Yuhei Tachi"}, {"name": "Masayoshi Terabe"}, {"name": "Hiroyuki Tezuka"}], "featured_authors": [{"name": "Kenji Sugisaki"}, {"name": "Yuhei Tachi"}, {"name": "Masayoshi Terabe"}, {"name": "Hiroyuki Tezuka"}], "author_count": 4}, {"id": "2608.04489", "category": "quant-ph", "title": "Engineering Nanodiamonds for Quantum Sensing: Material Constraints at the Nanoscale", "abstract": "Optically addressable solid-state spin defects have emerged as powerful multimodal quantum sensors, with nitrogen-vacancy (NV) centers in bulk diamond providing benchmark quantum control and sensitivity under ambient conditions. Embedding such defects in nanodiamonds (NDs) extends these capabilities to mobile probes capable of accessing complex biological and nanoscale environments. Reduced dimensions, however, introduce constraints beyond volumetric spin impurities, notably enhanced lattice strain and surface-induced noise sources, which shorten NV spin relaxation times (T1 and T2) and destabilize the NV charge state, as well as resulting in pronounced particle-to-particle variability in NDs typically produced by top-down approaches. These effects complicate both sensing performance and the quantitative interpretation of multimodal signals in realistic environments. This article provides a structured perspective on the physical mechanisms by which material properties constrain NV behavior in NDs, together with mitigation strategies that shape the robust use of these mobile quantum sensors for biosensing and nanoscale science.", "url": "https://arxiv.org/abs/2608.04489", "type": "理论", "summary": "1. 本文系统梳理了纳米金刚石中材料约束限制氮-空位中心量子传感性能的物理机制，并讨论了应对策略。\n2. 其要点在于将有限尺寸引入的晶格应变、表面噪声和电荷态不稳定与自旋弛豫时间缩短及颗粒间差异性建立联系。\n3. 这为面向生物与纳米环境应用的移动量子传感器在材料工程和多模态信号定量解读方面提供了优化方向。", "summary_source": "deepseek", "authors": [{"name": "Ashutosh Rathi"}, {"name": "Keisuke Oshimi"}, {"name": "Kento Sasaki"}, {"name": "Kensuke Kobayashi"}, {"name": "Yutaka Shikano"}, {"name": "Oliver Benson"}, {"name": "Tim Schröder"}, {"name": "Shery L. Y. Chang"}, {"name": "Masazumi Fujiwara"}], "featured_authors": [{"name": "Ashutosh Rathi"}, {"name": "Keisuke Oshimi"}, {"name": "Kento Sasaki"}, {"name": "Tim Schröder"}, {"name": "Shery L. Y. Chang"}, {"name": "Masazumi Fujiwara"}], "author_count": 9}, {"id": "2608.04539", "category": "quant-ph", "title": "Coupling Does Not Reduce the Auxiliary-Mode Count for $1/|ω|$ Spectra in Passive Lindblad Networks", "abstract": "Representing continuous environments by finitely many Markovian auxiliary modes is fundamental in non-Markovian open quantum systems, yet a critical question remains: at a fixed mode budget, can coherent intermode coupling reduce the spectral approximation error? We prove that intermode coupling offers no advantage when passive, number-conserving Gaussian Lindblad auxiliary networks approximate a $1/|\\omega|$ spectrum over a finite two-sided frequency band. For any mode budget $N$, the general coupled class and its uncoupled diagonal subclass share the same optimal error, which is exactly the degree-$2N$ Zolotarev error for sign approximation. This optimum is attainable by $N$ independent damped auxiliary modes at zero detuning. The result holds when the auxiliary network is in a stationary vacuum state, the system couples to it via a single Hermitian bath operator, and no white-noise feedthrough term is present. Consequently, although a general coupled network has $O(N^{2})$ real parameters, coherent intermode coupling, collective dissipation, and nonnormal structure cannot reduce the number of auxiliary modes required to reach a prescribed tolerance. This exact relation yields both the minimum mode count for a prescribed positive-frequency dynamic range and tolerance, and the maximum dynamic range attainable for a prescribed mode budget and tolerance.", "url": "https://arxiv.org/abs/2608.04539", "type": "理论", "summary": "1. 该工作证明，在真空稳态、经由单个厄米浴算符耦合且无白噪声前馈的被动、粒子数守恒高斯 Lindblad 辅助网络中，相干耦合无法降低对有限频带 1/|ω| 谱的有限模式近似误差。\n2. 其核心是证明一般耦合网络与无耦合对角子类共享同一最优误差，即符号近似的 2N 次 Zolotarev 误差，且该最优可由 N 个零失谐独立阻尼模式实现。\n3. 该精确关系给出指定正频动态范围与容差所需的最小模式数及给定模式预算下的最大动态范围，为非马尔可夫环境模拟的辅助模式截断提供严格基准。", "summary_source": "deepseek", "authors": [{"name": "Qing-Ao Xiang"}, {"name": "Yan Liu"}, {"name": "Xin-Yuan Yang"}, {"name": "Ya-Ju Song"}], "featured_authors": [{"name": "Qing-Ao Xiang"}, {"name": "Yan Liu"}, {"name": "Xin-Yuan Yang"}, {"name": "Ya-Ju Song"}], "author_count": 4}, {"id": "2608.04564", "category": "quant-ph", "title": "Quantum annealers as programmable thermal machines", "abstract": "Programmable quantum annealers are used for optimization, probabilistic sampling, and simulation, but their performance is commonly reported without the energy exchanged during computation. Here we characterize the D-Wave quantum annealer as a closed thermodynamic cycle. From initial and final Ising energies and an effective temperature fitted to the output distribution, we obtain lower bounds on entropy production, environment energy exchange, work, and power. By varying the prepared distribution and the reverse annealing turning point, we map heater-, accelerator-, refrigerator-, and engine-compatible regimes in one dimensional chains and higher connectivity instances, and apply the same analysis to Advantage and Advantage2 hardware. For an encoded optimization problem, the measured processor energy change states whether final candidates improve or worsen the programmed objective on average. For sampling, the fitted temperature provides an operational measure of how strongly probability is concentrated among low energy configurations. The thermodynamic mode therefore adds information absent from solution quality or runtime alone: it distinguishes driven refinement, net heating, and heat pumping while quantifying their energetic consequences. This framework connects quantum optimization, probabilistic computing, statistical physics simulation, hardware diagnostics, and energy-aware assessment without assuming that a thermodynamic label alone determines computational performance.", "url": "https://arxiv.org/abs/2608.04564", "type": "理论+数值", "summary": "1. 该工作将可编程量子退火机刻画为闭合热力学循环，从初末Ising能量与拟合有效温度导出熵产生、环境能量交换、功和功率的下界。\n2. 其技术卖点是通过改变制备分布与反向退火转折点，在一维链和高连通实例中映射加热器、加速器、制冷机与发动机等热力学模式，并扩展至两代硬件。\n3. 这为量子优化与概率计算提供能量感知评估框架，以区分驱动细化、净加热和热泵效应，补充仅凭解质量或运行时间无法获得的信息。", "summary_source": "deepseek", "authors": [{"name": "Jakub Pawłowski"}, {"name": "Tomasz Śmierzchalski"}, {"name": "Fengping Jin"}, {"name": "Bartłomiej Gardas"}, {"name": "Sebastian Deffner"}, {"name": "Zakaria Mzaouali"}], "featured_authors": [{"name": "Jakub Pawłowski"}, {"name": "Tomasz Śmierzchalski"}, {"name": "Fengping Jin"}, {"name": "Bartłomiej Gardas"}, {"name": "Sebastian Deffner"}, {"name": "Zakaria Mzaouali"}], "author_count": 6}, {"id": "2608.04573", "category": "quant-ph", "title": "Resource Estimation for Fault-Tolerant Quantum Programs", "abstract": "Fault-tolerant quantum computation enables the deployment of practical quantum algorithms but incurs substantial overhead from error correction, making resource estimation a central concern. Beyond case-by-case analyses, existing quantum programming languages either require programmers to manipulate low-level hardware details, rendering fault-tolerant implementations cumbersome, or abstract away the underlying error-correction schemes, reducing the effectiveness of resource utilization and estimation. To address these limitations while preserving programmability, we present a quantum programming language that enables efficient resource utilization, together with a resource-estimation framework for comprehensive resource analysis. Our framework features programmer-visible abstractions of error-correction schemes and cross-layer program-hardware analysis, allowing systematic exploration of resource trade-offs. We evaluate our approach on detailed fault-tolerant implementations of practical large-scale quantum algorithms, including components typically treated as black boxes in existing frameworks. The results demonstrate that our framework enables substantial resource savings while delivering detailed, fine-grained, and accurate resource estimates for fault-tolerant quantum programs.", "url": "https://arxiv.org/abs/2608.04573", "type": "数值", "summary": "1. 该工作提出了一种面向容错量子程序的量子编程语言及其配套资源估算框架，用于对真实纠错实现进行系统级资源分析。\n2. 其主要技术特色是将纠错方案作为程序员可见抽象，并实现跨层程序—硬件联合分析，以精细评估并优化不同容错实现间的资源权衡。\n3. 这为大型量子算法中常被黑箱处理的组件的资源建模提供了可行路径，并为后续自动化的容错资源探索与编译优化奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Bonan Su"}, {"name": "Yuan Feng"}, {"name": "Li Zhou"}, {"name": "Mingsheng Ying"}], "featured_authors": [{"name": "Bonan Su"}, {"name": "Yuan Feng"}, {"name": "Li Zhou"}, {"name": "Mingsheng Ying"}], "author_count": 4}, {"id": "2608.04601", "category": "quant-ph", "title": "Solving Differential Equations Using Continuous-Variable Quantum Annealing", "abstract": "Most existing quantum annealing approaches are formulated for qubit-based architectures. Consequently, applying them to continuous-variable optimization problems requires discretizing the variables, which can incur substantial qubit overhead. Continuous-variable quantum annealing based on bosonic systems has recently been proposed as an alternative framework, in which each optimization variable is directly encoded in a bosonic mode, such as a cavity mode. In this work, we develop a continuous-variable quantum annealing formulation for solving linear differential equations. By recasting the determination of the solution as a continuous-variable optimization problem, the differential equation can be mapped onto an objective function compatible with bosonic quantum annealing. Numerical simulations of second-order linear differential equations demonstrate that, under the conditions considered, the proposed formulation reproduces the corresponding analytical solutions. These results establish a potential route toward solving differential equations without the discretization overhead inherent in qubit-based implementations.", "url": "https://arxiv.org/abs/2608.04601", "type": "理论+数值", "summary": "1. 该工作提出一种基于连续变量量子退火的线性微分方程求解方案，将待求函数直接编码于玻色模而非量子比特。\n2. 其核心是构造与微分方程相容的连续变量优化目标，从而绕开比特化离散带来的量子资源开销。\n3. 数值模拟显示该方案能复现二阶线性方程解析解，为无离散开销的微分方程量子求解提供了可行路线。", "summary_source": "deepseek", "authors": [{"name": "Kazuki Miyanishi"}, {"name": "Soshun Naito"}, {"name": "Asuka Koura"}, {"name": "Kazue Kudo"}, {"name": "Toshiki Yamaji"}, {"name": "Yuichiro Matsuzaki"}], "featured_authors": [{"name": "Kazuki Miyanishi"}, {"name": "Soshun Naito"}, {"name": "Asuka Koura"}, {"name": "Kazue Kudo"}, {"name": "Toshiki Yamaji"}, {"name": "Yuichiro Matsuzaki"}], "author_count": 6}, {"id": "2608.04627", "category": "quant-ph", "title": "Efficient Depth--Ancilla Tradeoffs for Hamming Weight Computation and Symmetric Boolean Functions", "abstract": "Hamming weight computation maps an $n$-bit input to the number of ones it contains. It is a basic subroutine in quantum computing, and the core building block for symmetric Boolean functions, whose value depends only on the Hamming weight of the input. Moreover, symmetric Boolean functions are among the most common primitives in quantum computing. Efficient circuits for both problems are therefore important for the efficiency of many quantum algorithms. We study the depth-ancilla tradeoffs of Hamming weight computation under two qubit connectivity models, all-to-all and two-dimensional nearest-neighbor square grid (2D), in both the standard and dynamic circuit models. In the standard all-to-all model, we obtain depth $O(\\log n)$ with a sublinear number of ancillas. In the standard 2D model, we give a circuit of depth $O(\\sqrt n)$ with $O(\\log^2 n)$ ancillas, and a matching lower bound showing that $\\Theta(\\sqrt n)$ is optimal. In both dynamic models, we obtain constant-depth circuits with $O(n^{1+\\varepsilon}\\operatorname{polylog}\\,n)$ ancillary qubits for every fixed $\\varepsilon>0$. All constructions give a smooth depth-ancilla tradeoff, and they also extend to arbitrary symmetric Boolean functions.", "url": "https://arxiv.org/abs/2608.04627", "type": "理论+数值", "summary": "1. 该工作系统研究了汉明重量计算与对称布尔函数在标准及动态量子线路模型下的深度-辅助比特权衡，涉及全连接和二维最近邻两种连接构型。\n2. 技术上，它在全连接标准模型中实现 O(log n) 深度且亚线性辅助比特，在二维标准模型给出 O(sqrt n) 深度 O(log² n) 辅助比特并证明匹配下界，动态模型中则用 O(n^{1+ε} polylog n) 辅助比特实现常数深度。\n3. 这些平滑权衡与最优下界为量子线路优化及受限于几何连接的近期量子硬件提供了实用设计依据和复杂度标尺。", "summary_source": "deepseek", "authors": [{"name": "Wei Zi"}, {"name": "Pei Yuan"}, {"name": "Junhong Nie"}, {"name": "Shengyu Zhang"}], "featured_authors": [{"name": "Wei Zi"}, {"name": "Pei Yuan"}, {"name": "Junhong Nie"}, {"name": "Shengyu Zhang"}], "author_count": 4}, {"id": "2608.04672", "category": "quant-ph", "title": "Effect of Cross-Spectral Correlations on Qubit Dynamics: Coherence Revival and Relaxation Modulation", "abstract": "We investigate the reduced dynamics of a qubit subject to correlated longitudinal and transverse noise arising from its coupling to a shared bosonic bath. The environmental fluctuations are characterized by a positive-semidefinite matrix-valued spectral density, whose complex off-diagonal elements encode correlations between dephasing and relaxation channels in the frequency domain. Within the second-order time-convolutionless framework, we derive closed time-local equations for the Bloch-vector components of the reduced density matrix. The numerical implementation is validated against the exact pure-dephasing solution and the established behavior of the transverse-coupling spin-boson model. When both noise channels are present, the cross-spectral terms couple the otherwise distinct dephasing and relaxation sectors, producing dynamics that cannot be reproduced by adding independent noise contributions. In particular, the correlations generate non-monotonic population relaxation and a transient revival of coherence following its initial decay. The strength, bandwidth, delay, and phase of the cross spectrum provide control parameters for the magnitude and temporal structure of these effects. Our results demonstrate that correlated multi-axis noise can redistribute coherence loss and energy relaxation in time, thereby providing finite temporal windows of enhanced coherence or suppressed relaxation within the weak-coupling regime.", "url": "https://arxiv.org/abs/2608.04672", "type": "理论+数值", "summary": "1. 该工作研究量子比特耦合至共享玻色子库时，纵、横向噪声因交叉谱关联而产生的约化动力学，并推导了二阶含时卷积的布洛赫矢量闭合方程。\n2. 其技术卖点在于用半正定矩阵谱密度的复非对角元刻画频域关联，使原本分离的退相位与弛豫扇区相互耦合，从而产生非单调布居弛豫和随后的相干性复兴。\n3. 这为利用交叉谱的强度、带宽、延迟与相位在弱耦合区调控相干保留或抑制弛豫的时间窗口提供了明确参数途径，可启发多维噪声表征与量子控制方案。", "summary_source": "deepseek", "authors": [{"name": "Siddhartha Dutta"}, {"name": "Sujay Mondal"}, {"name": "Abhijit Bandyopadhyay"}], "featured_authors": [{"name": "Siddhartha Dutta"}, {"name": "Sujay Mondal"}, {"name": "Abhijit Bandyopadhyay"}], "author_count": 3}, {"id": "2608.04685", "category": "quant-ph", "title": "Quantum SWITCH-induced non-Markovianity is not entirely quantum", "abstract": "Indefinite causal order extends quantum information processing beyond fixed causal structures, with the quantum SWITCH serving as its canonical realization. By coherently superposing different orders of quantum channels, the quantum SWITCH has been shown to provide operational advantages in communication, computation, metrology, and related tasks. Despite these advances, the physical resources responsible for these advantages remains unclear. Recent studies have further revealed that the quantum SWITCH can generate memory effects, manifested as non-Markovian information backflow. In this work, we examine the origin of such memory and determine whether they reflect genuine (quantum) non-Markovianity or instead arises from classical origin. To this end, we analyze two representative scenarios: one based on discrete-time evolution and another formulated through dynamical maps in open quantum systems. We show that the memory effects generated by the quantum SWITCH are not genuinely quantum non-Markovian, thereby prompting a re-examination of the source of quantum advantage in indefinite causal order frameworks.", "url": "https://arxiv.org/abs/2608.04685", "type": "理论", "summary": "1. 该工作考察量子开关在离散时间演化与开放系统动力学映射两类代表性场景中所诱发记忆效应的物理来源。\n2. 其核心结论是这些记忆效应不构成真正的量子非马尔可夫性，而可由经典来源解释，因而质疑不定因果序优势的量子本质。\n3. 这为重新审视量子开关的量子资源归属、推动区分经典与量子记忆效应的判据研究提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Rajeev Gangwar"}, {"name": "Ananda G. Maity"}], "featured_authors": [{"name": "Rajeev Gangwar"}, {"name": "Ananda G. Maity"}], "author_count": 2}, {"id": "2608.04775", "category": "quant-ph", "title": "From normal Lindbladians to non-normal quantum trajectories", "abstract": "Efficient simulation of Markovian open quantum systems remains a central challenge because the density-matrix description grows exponentially with system size. Quantum trajectory methods provide an alternative by replacing mixed-state evolution with stochastic pure-state realizations. Here we investigate this framework for normal Lindblad generators, whose orthogonal eigenoperator decomposition precludes transient amplification. By decomposing the Lindbladian into deterministic smooth and stochastic jump contributions, we derive an exact steady-state balance relation that identifies the interplay between these processes as the mechanism underlying Liouvillian normality. We further show that normal Lindbladians exclude exceptional points and that, although individual quantum trajectories generally exhibit stochastic coupling between Liouvillian eigenmodes, these couplings cancel upon ensemble averaging, recovering independent orthogonal relaxation modes. These results provide a trajectory-level interpretation of Liouvillian normality and clarify how a global property of the Lindblad generator is realized through stochastic quantum dynamics.", "url": "https://arxiv.org/abs/2608.04775", "type": "理论+数值", "summary": "1. 该工作从量子轨迹视角研究正规 Lindblad 生成元，推导了稳态平衡关系并阐明其与 Lindblad 正规性之间的机制联系。\n2. 主要技术发现是正规 Lindblad 算符排除例外点，且单条轨迹中李雅普诺夫本征模的随机耦合在系综平均后抵消，恢复正交独立弛豫模式。\n3. 这为理解开放量子系统中生成元的全局性质如何由随机量子动力学实现，提供了轨迹层面的物理图像和理论工具。", "summary_source": "deepseek", "authors": [{"name": "Shakib Daryanoosh"}], "featured_authors": [{"name": "Shakib Daryanoosh"}], "author_count": 1}, {"id": "2608.04822", "category": "quant-ph", "title": "Quantum States Protection under Environmental Noise", "abstract": "All realistic quantum systems are inevitably in contact with the environment. Suppressing theimpact of environmental noise is a critical challenge in cutting-edge quantum technologies. In thiswork, we introduce and systematically analyze a scheme for the protection of quantum states againstamplitude-damping (AD) noise based on the circuit structure called the quantum filter. Filtrationcircuits employing single- and multi-control qubits are examined, and their capability to enhance stateprotection fidelity while preserving a high success probability is discussed. Moreover, for many-bodyqubit states, those with a fixed quantum Hamming weight can be perfectly protected against ADnoise, whereas states with the largest Hamming weight difference set a lower bound on the achievableprotection fidelity. Our work provides a resource-efficient route for quantum state protection withoutrequiring full quantum error correction.", "url": "https://arxiv.org/abs/2608.04822", "type": "理论", "summary": "1. 该工作提出并系统分析了一种基于量子过滤器电路抑制振幅阻尼噪声的量子态保护方案，考察了单控制与多控制量子比特滤波结构在保真度与成功概率间的权衡。\n2. 其技术卖点在于借助单重或多重控制量子比特的过滤电路，在提高态保护保真度的同时维持较高成功概率，并揭示固定量子汉明权重的多体态可被完美保护，而最大汉明权重差给出可达保真度的下界。\n3. 这为无需完整量子纠错、资源高效的量子态保护提供了可行路线，同时为抗噪量子信息处理与多体态操控提供了明确启发与理论依据。", "summary_source": "deepseek", "authors": [{"name": "Kai Wang"}, {"name": "Zhen-Yang Peng"}], "featured_authors": [{"name": "Kai Wang"}, {"name": "Zhen-Yang Peng"}], "author_count": 2}, {"id": "2608.04844", "category": "quant-ph", "title": "Quantum walker trapped by self-similarity of the Sierpiński carpet", "abstract": "We study the dynamics of a single quantum particle on a finite-size square lattice with a fractal structure resembling the Sierpiński carpet, and compare it to the dynamics on a uniform lattice of the same size. For a particle initially localized at a corner of the lattice, we monitor the probability of finding it near the initial and opposite corners using zone-integrated probabilities, allowing a consistent comparison across fractal orders. While on the uniform lattice the particle reaches the opposite corner ballistically, in a time proportional to the lattice size, on the Sierpiński lattice it becomes increasingly confined to the vicinity of its initial position. We show that this trapping builds up self-similarly across the whole hierarchy of corner zones of the lattice.", "url": "https://arxiv.org/abs/2608.04844", "type": "理论", "summary": "1. 该工作数值研究单量子粒子在有限尺寸谢尔宾斯基地毯分形晶格上的动力学，并与同尺寸均匀晶格对比。\n2. 其卖点在于用分区积分概率刻画角落间转移，揭示分形结构使粒子自相似地囚禁于初始位置附近，而非弹道抵达对角。\n3. 这为分形几何中的量子输运、局域化及量子搜索等问题提供了清晰的理论模板与数值基准。", "summary_source": "deepseek", "authors": [{"name": "Tomasz Sowiński"}], "featured_authors": [{"name": "Tomasz Sowiński"}], "author_count": 1}, {"id": "2608.04850", "category": "quant-ph", "title": "Two-dimensional Toda--Arnoldi correspondence: Holomorphic Krylov geometry and counterdiabatic transport", "abstract": "Although Arnoldi reduction of a generally non-Hermitian Hamiltonian yields an upper Hessenberg matrix rather than the tridiagonal form of Hermitian Lanczos theory, we show that a closed Toda sector survives in its diagonal and subdiagonal coefficients. For a fixed finite-dimensional Hamiltonian and a cyclic state vector deformed holomorphically, the Krylov Gram determinants are $\\tau$ functions of the finite two-dimensional Toda lattice, whose Flaschka variables coincide exactly with these Arnoldi coefficients. The Toda dynamics therefore closes on this sector without determining the remaining upper Hessenberg entries. The subdiagonal part of the same sector also has a direct geometric meaning: the squared subdiagonal coefficients determine both the Fubini--Study metric and the Berry curvature of holomorphic Krylov subspaces, whereas the geometric quantities associated with subspaces lost at Arnoldi breakdown cease to be defined. Along a smooth real path in the cyclic region, the Arnoldi-frame connection further provides a Hermitian tridiagonal generator of exact isospectral transport. When added to the Arnoldi matrix, this generator cancels transitions between instantaneous eigenspaces and realizes counterdiabatic driving whenever the matrix is diagonalizable with a nondegenerate spectrum.", "url": "https://arxiv.org/abs/2608.04850", "type": "理论", "summary": "1. 该工作揭示了非厄米哈密顿量Arnoldi约化中闭合的二维Toda格点扇区，并证明Krylov Gram行列式正是有限二维Toda格点的tau函数。\n2. 其卖点是次对角Arnoldi系数的平方同时决定Krylov子空间的Fubini–Study度规与Berry曲率，且Arnoldi标架联络给出精确等谱输运的厄米三对角生成元。\n3. 这为可对角化非简并体系的反绝热驱动提供了基于Krylov几何的显式构造，并为非厄米量子度规和几何输运研究开辟了方向。", "summary_source": "deepseek", "authors": [{"name": "Urei Miura"}], "featured_authors": [{"name": "Urei Miura"}], "author_count": 1}, {"id": "2608.04936", "category": "quant-ph", "title": "From Promise to Practice: Closing the Application Gap in Quantum Computing", "abstract": "Quantum computing is a deep technology whose progress cannot be driven effectively from one direction alone. While the field has developed a growing catalogue of mathematically grounded algorithmic speedups, industrial impact will depend just as much on starting from real industrial decision contexts and working downward to what must be computed, validated and integrated. In this Perspective, I argue that sustained progress requires treating these two directions: bottom-up development from physics, hardware and algorithms, and top-down development from industrial needs and constraints. Equally primary and continuously coupled. This dual-viewpoint is not a matter of balance for its own sake. Quantum computers cannot solve arbitrary problems, so engagement with industry must remain anchored in algorithmic tractability. Yet tractable computations are rarely valuable unless they connect to decision points in established workflows such as candidate selection in drug discovery or the design of a new aircraft shape with improved aerodynamics. I analyse how historical narratives and structural separations of expertise slowed the formation of this coupling and outline what it takes to build it: explicit interfaces between technical teams and domain context and intermediate layers that translate quantum outputs into decision-relevant observables without suffocating foundational innovation. Framed this way, quantum computing's opportunity is clearest where deep physical modelling meets high-value decisions. Provided the field co-designs both sides from the outset.", "url": "https://arxiv.org/abs/2608.04936", "type": "理论+数值", "summary": "1. 该观点文章主张量子计算的发展必须将自物理、硬件与算法向上的推进和自工业需求与约束向下的牵引持续且对等地耦合。\n2. 其核心论点是量子计算不能求解任意问题，因而工业参与须锚定于算法可解性，并通过显式接口与中间层将量子输出转化为决策相关的可观测量。\n3. 这启示该领域最明确的机遇位于深层物理建模与高价值决策的交汇处，前提是从一开始就协同设计技术方案与应用场景。", "summary_source": "deepseek", "authors": [{"name": "Nicole Holzmann"}], "featured_authors": [{"name": "Nicole Holzmann"}], "author_count": 1}, {"id": "2608.04947", "category": "quant-ph", "title": "Sharp Continuity of Petz and Sandwiched Rényi Conditional Entropies", "abstract": "We determine the sharp modulus of continuity, in trace distance, of the optimized Petz and sandwiched Rényi conditional entropies for every order $\\alpha\\in[\\frac12,1)$. If two bipartite states are within trace distance $\\delta$, then both conditional entropies differ by at most $\\frac{1}{1-\\alpha} \\log[(1-\\varepsilon)^{\\alpha} +(D-1)^{1-\\alpha}\\varepsilon^{\\alpha}]$, where $\\varepsilon := \\min\\{\\delta,1-1/D\\}$ and $D$ is the effective dimension, given by the dimension of the first subsystem times the largest possible Schmidt rank. For every distance constraint $\\delta\\in[0,1]$, the bound is attained by an isotropic pair with a maximally entangled anchor. Taking $\\alpha\\uparrow1$ recovers the recent sharp continuity bound of quantum conditional entropy by Berta et al. [ arXiv:2607.24687 ]. The proof linearizes the relevant concave Rényi functional at a comparison point dictated by the isotropic equality family. Schmidt-rank domination extends the equality geometry to an arbitrary anchor state, after which trace-distance duality and a noncommutative calibration estimate control the perturbation and anchor term without weakening the sharp constant. The latter estimate requires matrix analysis and is assisted by ChatGPT 5.6 Sol.", "url": "https://arxiv.org/abs/2608.04947", "type": "理论+数值", "summary": "1. 该工作对每个阶数α∈[1/2,1)，在迹距离下确定了优化Petz与夹心Rényi条件熵的最紧连续模，上界由有效维数D与距离δ的显式对数函数给出。\n2. 其卖点是证明该上界被具有最大纠缠锚的各向同性态对饱和，证明通过在最优点线性化凹Rényi泛函，并借助Schmidt秩支配、迹距离对偶与非对易校准估计避免常数弱化。\n3. 取α→1可重现Berta等人关于量子条件熵的锐界，为量子信息论中熵连续性和纠缠度量的定量研究提供了精确基准。", "summary_source": "deepseek", "authors": [{"name": "Hao-Chung Cheng"}, {"name": "Po-Chieh Liu"}], "featured_authors": [{"name": "Hao-Chung Cheng"}, {"name": "Po-Chieh Liu"}], "author_count": 2}, {"id": "2608.04953", "category": "quant-ph", "title": "Diffusive Speed Limits for U(1)-Covariant Quantum Error Correction", "abstract": "Fast preparation of quantum error-correcting codes is essential for scalable quantum memories, but geometric locality and $U(1)$ charge conservation impose an unavoidable transport constraint. We combine exact complementary-channel geometry, charge-sector Haar analysis, and a gate-resolved connected-moment expansion to study one-dimensional covariant encoders under flagged erasure. Charge-Haar codes attain the universal adjacent-charge lower bound up to exponentially small corrections, yielding an exact $n^{-1/2}$ extensive-erasure law and a sharp half-erasure transition. For local number-conserving brickwork circuits, diffusion of the logical charge enforces an $\\Omega(n^2)$ encoding-time lower bound; we also prove an $O(n^3)$ mixing bound for the classical component and reduce the remaining full-channel upper bound to a source-restricted low-support operator-spreading problem. These results identify diffusion as an operational limit on symmetry-constrained quantum coding and establish a route to its exact formation time.", "url": "https://arxiv.org/abs/2608.04953", "type": "理论+数值", "summary": "1. 本文研究一维U(1)协变量子纠错编码在标记擦除下的输运约束，结合互补信道几何、电荷扇区Haar分析与门分辨连通矩展开。\n2. 其核心结果是电荷-Haar码以指数小修正达到相邻电荷下界，给出精确n^{-1/2}擦除律与半擦除相变，并证明局域数守恒砖墙电路中逻辑电荷扩散导致Ω(n^2)编码时间下界及经典分量的O(n^3)混合界。\n3. 这些结果将扩散确立为对称约束量子编码的运算极限，并为精确形成时间与源限制低支撑算子传播问题提供明确研究路径。", "summary_source": "deepseek", "authors": [{"name": "Jianqi Sheng"}], "featured_authors": [{"name": "Jianqi Sheng"}], "author_count": 1}, {"id": "2608.04973", "category": "quant-ph", "title": "Quantum Bayes Correlated Equilibrium and the Comparison of Quantum Information Structures in Games", "abstract": "Bergemann and Morris (2016) show that one information structure is more informative than another exactly when it induces a smaller set of Bayes correlated equilibrium outcomes in every game. We build the quantum analogue. An information structure becomes a family of density operators indexed by the payoff state, which the mediator observes. We show that obedience is equivalent to a Loewner domination between operators on one player's subsystem. The equilibrium set is then a nonempty compact spectrahedron computable by semidefinite programming, classical structures embed exactly, and under quantum individual sufficiency more information shrinks the equilibrium set in every game.", "url": "https://arxiv.org/abs/2608.04973", "type": "理论", "summary": "1. Bergemann 和 Morris (2016) 表明，当一种信息结构在每个博弈中产生一组较小的贝叶斯相关均衡结果时，它比另一种信息结构提供的信息更多。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Furkan Sezer"}], "featured_authors": [{"name": "Furkan Sezer"}], "author_count": 1}, {"id": "2608.05038", "category": "quant-ph", "title": "Symbol-Oriented Quantum Communication via Temporal-Mode Multiplexing", "abstract": "We introduce and analyze a quantum-assisted classical communication protocol that encodes symbols from a finite alphabet onto temporal modes using the LM05 operation as a building block. The protocol applies a bit-flip gate independently to temporal slots corresponding to message symbols, yielding a tensor product of LM05 operations on parallel channels. This tensor product structure enables collective attacks not covered by standard LM05 security proofs. We derive a theoretical upper bound on the success probability for complete recovery under random guessing, accounting for the receiver's 50\\% guessing ability on lost photons, and emphasize that this bound assumes perfect loss identification. We characterize the intended transmission, derive an asymptotic collective-attack bound for the symbol-set mode, and identify open challenges for composable security. The protocol is not a standalone Quantum Secure Direct Communication scheme, as the classical ordering information requires encryption. For a 53-symbol alphabet, the optimistic 1\\% success bound occurs at about 0.8 kilometers under zero QBER and reduces to about 0.6 kilometers for QBER equals 0.01; practical constraints severely limit performance.", "url": "https://arxiv.org/abs/2608.05038", "type": "理论", "summary": "1. 该工作提出并分析了一种面向符号的量子辅助经典通信协议，利用LM05操作将有限字母表编码到时间模式上。\n2. 其卖点在于消息槽上的比特翻转门形成并行LM05通道的张量积结构，从而可分析标准证明未覆盖的集体攻击，并推导考虑丢失光子50%猜测能力的完全恢复成功概率上界。\n3. 该协议并非独立量子安全直接通信方案，需加密排序信息，且实际损耗使53符号在零QBER下1%成功界仅约0.8公里，为可组合安全性与符号级编码提出开放挑战。", "summary_source": "deepseek", "authors": [{"name": "Ali Vahedi"}, {"name": "Parsa Mahdavifar"}], "featured_authors": [{"name": "Ali Vahedi"}, {"name": "Parsa Mahdavifar"}], "author_count": 2}, {"id": "2608.05046", "categ
