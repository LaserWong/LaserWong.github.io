  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2608.04083", "category": "cond-mat", "title": "Breakdown of Monotonic Impurity Entropy Flow in $\\mathscr{PT}$-Symmetric Multichannel Kondo Systems", "abstract": "We study a $\\mathscr{PT}$-symmetric non-Hermitian multichannel Kondo model consisting of a pair of spin-$\\frac12$ impurities coupled to $n$ conduction-electron channels through complex-conjugate Kondo couplings. The impurity renormalization-group (RG) flow is characterized by the Kondo scale $T_K$ and a dimensionless non-Hermiticity parameter $\\alpha$. As $\\alpha$ increases, the exact Bethe Ansatz solution exhibits four impurity phases: overscreened Kondo, zero mode, Yu--Shiba--Rusinov (YSR), and local moment. The Kondo, zero-mode, and local-moment phases are $\\mathscr{PT}$-unbroken, whereas the YSR phase spontaneously breaks $\\mathscr{PT}$ symmetry. Using a generalized thermodynamic Bethe Ansatz, we determine the impurity free energy and Affleck--Ludwig $g$-function throughout the $\\mathscr{PT}$-unbroken phases. In the Kondo phase, the defect RG flow connects the ultraviolet and infrared conformal fixed points, with the impurity entropy flowing from $2\\ln2$ to $2\\ln\\left[2\\cos\\left(\\frac{\\pi}{n+2}\\right)\\right]$, in agreement with defect conformal field theory. In the zero-mode phase, zero-energy impurity strings reorganize the spectrum into multiple excitation towers, while in the local-moment phase, the RG flow becomes cyclic, returning to the unscreened local-moment fixed point. We conjecture that RG irreversibility, and hence a generalized Affleck--Ludwig $g$-theorem, survives throughout the Kondo phase. Our exact solution nevertheless shows that a real spectrum and defect entropies consistent with defect CFT do not guarantee RG irreversibility: the impurity entropy is non-monotonic in both the zero-mode and local-moment phases.", "url": "https://arxiv.org/abs/2608.04083", "type": "理论", "summary": "1. 该工作用精确 Bethe Ansatz 研究一对自旋-1/2 杂质经复共轭耦合到 n 个通道的 PT 对称非厄米多通道近藤模型，刻画了过屏蔽近藤、零模、YSR 和局域磁矩四种杂质相。\n2. 其技术核心是推广热力学 Bethe Ansatz 计算杂质自由能与 Affleck-Ludwig g 函数，并证明在零模和局域磁矩相中杂质熵随 RG 流非单调，即使谱为实且符合缺陷共形场论。\n3. 这提示在非厄米系统中杂质熵流并非普适的 RG 单调量，支持广义 g 定理仅在近藤相成立，为缺陷 CFT 与开放量子多体系统的不可逆性研究提供约束。", "summary_source": "deepseek", "authors": [{"name": "Pradip Kattel"}, {"name": "Abay Zhakenov"}, {"name": "Natan Andrei"}], "featured_authors": [{"name": "Pradip Kattel"}, {"name": "Abay Zhakenov"}, {"name": "Natan Andrei"}], "author_count": 3}, {"id": "2608.04096", "category": "cond-mat", "title": "Magnetic-Field-Driven Dimensional Reduction in a Quantum Antiferromagnet", "abstract": "Low dimensionality enhances quantum fluctuations, triggering novel states of quantum matter to emerge. In real materials, low dimensionality usually arises from spatially strongly anisotropic couplings. Here, we demonstrate a different mechanism: in two-dimensional systems with coupled alternating ferromagnetic (FM) and antiferromagnetic (AFM) spin-$1/2$ chains, an applied magnetic field may drive a dimensional reduction. Under magnetic field, the FM chains polarize and stiffen, suppressing the propagation of transverse AFM fluctuations from one chain to another, and effectively induce one-dimensional behavior at low energies. For a model describing botallackite, Cu$_2$(OH)$_3$Br, quantum Monte Carlo dynamics show that beyond a critical magnetic field, the low-energy spectrum reduces to that of a one-dimensional AFM Heisenberg spin-$1/2$ chain with field-dependent incommensurate two-spinon fluctuations, providing clear signatures for inelastic neutron scattering.", "url": "https://arxiv.org/abs/2608.04096", "type": "理论+数值", "summary": "1. 该工作通过量子蒙特卡洛模拟研究由交替铁磁与反铁磁自旋1/2链耦合构成的二维量子反铁磁体，证明外加磁场可驱动体系发生维度降低。\n2. 其核心机制是磁场使铁磁链极化并刚化，从而抑制横向反铁磁涨落向邻近链传播，使超过临界磁场的低能谱退化为具有非公度双自旋子激发的一维海森堡反铁磁链。\n3. 该机制为铜羟基卤化物等真实材料中磁场调控低维量子磁性提供了具体物理图像，并在非弹性中子散射谱中给出可检验的维度降低特征。", "summary_source": "deepseek", "authors": [{"name": "Subhankar Khatua"}, {"name": "Marcin Raczkowski"}, {"name": "Jeroen van den Brink"}, {"name": "Fakher F. Assaad"}], "featured_authors": [{"name": "Subhankar Khatua"}, {"name": "Marcin Raczkowski"}, {"name": "Jeroen van den Brink"}, {"name": "Fakher F. Assaad"}], "author_count": 4}, {"id": "2608.04098", "category": "cond-mat", "title": "Entanglement entropy of fermions in a strange metal", "abstract": "The subsystem-size dependence of ground-state entanglement entropy and its crossover to thermal entropy as a function of temperature are well understood for one-dimensional (1D) gapless systems described by conformal field theory (CFT), and for free fermions with a Fermi surface in any dimension. However, little is known about the entanglement entropy for gapless fermionic systems without quasi-particles, such as a strange metal. Here we study the entanglement entropy of fermions in a solvable large-$N$ 1D lattice model akin to the Yukawa-Sachdev-Ye-Kitaev (Yukawa SYK) model. In this model, two Fermi points are coupled to scalar bosons via spatially random Yukawa interactions, providing a solvable model of a strange metal when the bosons become critical at a quantum critical point. We exactly compute the second Rényi entropy of fermions in a spatial subregion in this model. Our results unravel crucial role of intra-subregion entanglement between fermionic and bosonic degrees of freedom along with the inter-subregion entanglement in understanding the ground states of such strongly coupled fermion-boson systems. We show that the crossover from thermal entropy to entanglement entropy, is captured by a single scaling ansatz, that collapses the second Rényi entropy of fermions for different subregion sizes and temperatures into a single universal curve. We further show that the universal scaling curve for the critical strange metal is well described by the standard CFT formula, albeit with an effective central charge substantially larger than the non-interacting value.", "url": "https://arxiv.org/abs/2608.04098", "type": "理论", "summary": "1. 该工作在可解的大N一维Yukawa-SYK型格点模型中精确计算费米子的第二Rényi熵，刻画奇异金属基态纠缠熵的行为。\n2. 其关键发现是子区域内部的费米-玻色纠缠与子区域间纠缠共同决定熵，且热熵到纠缠熵的交叉可由单一标度律塌缩为普适曲线，该曲线符合CFT公式但有效中心荷明显大于无相互作用值。\n3. 这为无准粒子奇异金属中纠缠熵的普适标度提供了严格范例，并对推广到高维或强耦合量子临界系统具有启示。", "summary_source": "deepseek", "authors": [{"name": "Santanu Singh"}, {"name": "Surajit Bera"}, {"name": "Chenyuan Li"}, {"name": "Subir Sachdev"}, {"name": "Sumilan Banerjee"}], "featured_authors": [{"name": "Santanu Singh"}, {"name": "Surajit Bera"}, {"name": "Chenyuan Li"}, {"name": "Subir Sachdev"}, {"name": "Sumilan Banerjee"}], "author_count": 5}, {"id": "2608.04168", "category": "cond-mat", "title": "Role of Particle Shape in Strain-Controlled Resuspension of Dense Suspensions", "abstract": "> Dense non-Brownian suspensions exhibit complex resuspension dynamics governed by hydrodynamic interactions, particle microstructure, and gravity. While viscous resuspension in spherical suspensions is known to be strain-controlled, its applicability to anisotropic particles remains unclear. Here, we investigate dense suspensions of spherical and rod-shaped particles under steady and oscillatory shear. The results reveal two strain-controlled transitions: particle detachment from the sediment bed and the transition to a fully suspended state. Both particle shapes exhibit the same critical strain for detachment, approximately 6, indicating that resuspension onset is largely independent of particle morphology. In contrast, complete resuspension requires a critical strain of approximately 120 for spheres and 180 for rods, demonstrating a strong effect of particle anisotropy. A fluid-strain scaling collapses the onset of resuspension across particle concentrations and shapes while highlighting the distinct influence of particle shape on complete suspension. These findings establish a unified strain-based framework for viscous resuspension and clarify the role of particle anisotropy in dense suspension dynamics.", "url": "https://arxiv.org/abs/2608.04168", "type": "理论", "summary": "1. 该工作实验研究球状与杆状颗粒浓悬浮液在稳态和振荡剪切下的黏性再悬浮，识别出颗粒脱离沉积床和完全悬浮两个应变控制的转变。\n2. 关键发现在于脱离临界应变约为6且与颗粒形状无关，而完全悬浮临界应变对球体约120、对杆体约180，并利用流体应变标度统一描述了不同浓度与形状下的再悬浮起始。\n3. 这为黏性再悬浮建立了基于应变统一框架，明确了颗粒各向异性对浓悬浮动力学的影响，并为后续理论模型与复杂颗粒体系研究提供参照。", "summary_source": "deepseek", "authors": [{"name": "Mohammadreza Mahmoudian"}, {"name": "Mahdi Vaezi"}, {"name": "Parisa Mirbod"}], "featured_authors": [{"name": "Mohammadreza Mahmoudian"}, {"name": "Mahdi Vaezi"}, {"name": "Parisa Mirbod"}], "author_count": 3}, {"id": "2608.04184", "category": "cond-mat", "title": "Pressure-Tunable Electronic and Magnonic Transport in Altermagnet La$_2$O$_3$Mn$_2$Se$_2$", "abstract": "Hydrostatic pressure provides a symmetry-preserving route to engineer electronic and magnonic transport in the correlated insulating altermagnet La$_2$O$_3$Mn$_2$Se$_2$. Using first-principles calculations combined with spin-Hamiltonian modeling, we show that compression from 0 to 40 GPa markedly enhances the inequivalence between the competing second-neighbor exchange interactions, increasing $|J_{2a}-J_{2b}|$ from 1.97 to 9.38 meV while preserving the compensated antiferromagnetic ground state. The resulting exchange anisotropy amplifies the momentum-dependent splitting between the two chiral magnon branches, yielding a nearly fourfold enhancement of the longitudinal magnon-driven spin Seebeck response at 100 K, from $3.68\\times10^{-1}$ to $1.36$ meV/K. In contrast, hydrostatic pressure preserves the magnetic-symmetry selection rules governing the anomalous Hall effect while redistributing the electronic Berry curvature, producing pronounced energy-dependent sign reversals in the anomalous Hall conductivity. These results identify exchange anisotropy as the microscopic mechanism underlying the pressure-enhanced magnon response and establish hydrostatic pressure as an effective means of simultaneously controlling electronic and magnonic transport in insulating altermagnets.", "url": "https://arxiv.org/abs/2608.04184", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算与自旋哈密顿量建模，研究了静水压对交错磁体La2O3Mn2Se2中电子与磁子输运的调控。\n2. 其核心发现是压力将次近邻交换作用的不等价性从1.97增强到9.38 meV，在保持补偿反铁磁基态的同时使手性磁子劈裂和100 K下纵向自旋塞贝克响应增大近四倍。\n3. 这确立了交换各向异性为压力增强磁子响应的微观机制，并表明静水压可在保持对称性选择规则的同时经贝里曲率重分配诱导反常霍尔电导符号反转，为调控绝缘交错磁体输运提供普适途径。", "summary_source": "deepseek", "authors": [{"name": "Nafise Rezaei"}, {"name": "Alireza Qaiumzadeh"}, {"name": "Artem R. Oganov"}, {"name": "Mojtaba Alaei"}], "featured_authors": [{"name": "Nafise Rezaei"}, {"name": "Alireza Qaiumzadeh"}, {"name": "Artem R. Oganov"}, {"name": "Mojtaba Alaei"}], "author_count": 4}, {"id": "2608.04209", "category": "cond-mat", "title": "Green's function theory of magnetism in Bi$_2$CuO$_4$: anisotropic Heisenberg XYZ model", "abstract": "The Green's function theory of Lymar' and Rudoi [Theor. Math. Phys. vol. 21, 990 (1974)] is generalized to the case of multiple intra- and inter-sublattice magnetic interactions in a collinear spin-half antiferromagnet and applied to magnetic excitations in Bi$_2$CuO$_4$. The spin Hamiltonian includes both the out-of-plane and in-plane symmetric anisotropy terms and the Zeeman term, which describes the interaction with an external magnetic field $B$ applied along the Néel vector. Within the spin-wave approximation we calculate spin excitation dispersion, antiferromagnetic resonance frequencies and the critical field $B_c$ of the spin-flop metamagnetic transition. A weak in-plane anisotropy is shown to result in a gap in the acoustic-like branch of the excitations. The gap nonlinearly depends on the external field and closes at $B=B_c$. An expression for the Neel temperature in the Tyablikov random phase approximation at zero field is derived. For the parameters derived from the recent inelastic neutron scattering study by Yuan et al. [Phys. Rev. B vol. 103, 134436 (2021)] it gives $T_{\\rm N}\\approx 52$~K.", "url": "https://arxiv.org/abs/2608.04209", "type": "理论", "summary": "1. 该工作将Lymar'和Rudoi的格林函数理论推广至含多个子格内与子格间相互作用的共线自旋1/2反铁磁体，并用于研究Bi2CuO4的磁激发。\n2. 其核心在于计入面外与面内对称各向异性及Zeeman项，在自旋波近似下给出自旋激发谱、反铁磁共振频率和自旋翻转临界场，并揭示弱面内各向异性使声学支出现随场非线性变化、在Bc处闭合的能隙。\n3. 该理论及零场Néel温度表达式为精确解释中子散射谱和自旋翻转跃迁提供了定量框架，也可推广至其他弱各向异性共线反铁磁体。", "summary_source": "deepseek", "authors": [{"name": "R.O. Kuzian"}, {"name": "E.E. Krasovskii"}], "featured_authors": [{"name": "R.O. Kuzian"}, {"name": "E.E. Krasovskii"}], "author_count": 2}, {"id": "2608.04219", "category": "cond-mat", "title": "First-principles predictions of carrier mobility with record accuracy using GW perturbation theory", "abstract": "Accurate prediction of carrier mobility is critical for the discovery and design of next-generation electronic materials. Despite sustained progress, state-of-the-art ab initio methods remain limited by the approximate treatment of electron-phonon interactions at the density functional theory level. Here, we demonstrate that incorporating many-body GW corrections to both the electronic band structure and electron--phonon couplings when solving the ab initio Boltzmann transport equation yields a mean absolute relative error of just 11% for electron mobilities across benchmark semiconductors, including Si, GaAs, GaP, diamond, and SiC. The common practice of neglecting GW corrections to the electron--phonon interaction can lead to mobility errors exceeding 50%. The present findings highlight the importance of many-body GW self-energy effects in carrier transport simulations, and provides fundamental insights into how many-body electron--phonon interactions govern charge transport in crystalline solids.", "url": "https://arxiv.org/abs/2608.04219", "type": "理论+数值", "summary": "1. 该工作将GW多体修正同时引入电子能带与电子-声子耦合，用于从头算玻尔兹曼输运方程，实现载流子迁移率的高精度预测。\n2. 其核心在于对硅、砷化镓、磷化镓、金刚石及碳化硅等基准半导体的电子迁移率，平均绝对相对误差仅11%，而忽略电子-声子相互作用的GW修正可使误差超过50%。\n3. 这凸显了多体GW自能效应在载流子输运模拟中的关键作用，并为理解晶体中多体电子-声子相互作用对电荷输运的支配机制提供了新基础。", "summary_source": "deepseek", "authors": [{"name": "Nick Pant"}, {"name": "Sabyasachi Tiwari"}, {"name": "Steven G. Louie"}, {"name": "Zhenglu Li"}, {"name": "Feliciano Giustino"}], "featured_authors": [{"name": "Nick Pant"}, {"name": "Sabyasachi Tiwari"}, {"name": "Steven G. Louie"}, {"name": "Zhenglu Li"}, {"name": "Feliciano Giustino"}], "author_count": 5}, {"id": "2608.04269", "category": "cond-mat", "title": "Magnetic Field Reorganization of Electronic States in Moiré Bilayer Graphene", "abstract": "Magnetic fields are widely used to diagnose quantum phases in two-dimensional systems through quantum oscillations or by tuning spin and valley polarizations, but magnetic fields can also reshape the underlying electronic structure. Here, using a bilayer graphene/hBN moiré system, we reveal a rich magnetic field induced evolution of the semiclassical orbit network, encompassing Lifshitz transitions, magnetic breakdown, and scattering between coexisting electron and hole pockets. At magnetic fields of 1 T to 2 T, quantum oscillation frequencies and the Hall density change markedly over a broad carrier density range, signaling magnetic breakdown and magnetic Lifshitz transitions. This evolution is valley contrasting: Berry curvature hot spots near the breakdown junctions enhance magnetic breakdown in the K valley while suppressing it in the K$^\\prime$ valley, whereas valley-antisymmetric orbital magnetic moments split the corresponding Lifshitz transitions. The resulting valley-selective trajectories manifest at higher fields as valley-symmetry-breaking Hofstadter gaps. At elevated temperatures and low magnetic fields, scattering between coexisting electron and hole pockets produces nearly density-independent resistance oscillations whose frequency tracks the sum of their Fermi surface areas, persisting after conventional Onsager oscillations are thermally washed out. Our results provide a unified picture of how modest magnetic fields reorganize moiré electronic states as the system evolves from semiclassical transport toward the Hofstadter regime.", "url": "https://arxiv.org/abs/2608.04269", "type": "理论", "summary": "1. 该工作利用双层石墨烯/hBN莫尔体系，实验揭示了磁场从半经典输运向Hofstadter区域演化过程中莫尔电子态的重组。\n2. 核心在于观测到磁击穿与磁Lifshitz转变，并通过能谷对比的Berry曲率热点和轨道磁矩解释谷选择轨道及对称性破缺的Hofstadter能隙。\n3. 这为中等磁场下莫尔电子结构的统一图像提供了新视角，提示谷自由度可作为调控磁响应与量子振荡的敏感探针。", "summary_source": "deepseek", "authors": [{"name": "Milan Sharma Mandigo-Stoba"}, {"name": "William Wang"}, {"name": "Jackson Kuklin"}, {"name": "Jack Lichterman"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Qianhui Shi"}], "featured_authors": [{"name": "Milan Sharma Mandigo-Stoba"}, {"name": "William Wang"}, {"name": "Jackson Kuklin"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Qianhui Shi"}], "author_count": 7}, {"id": "2608.04291", "category": "cond-mat", "title": "Electron correlation in semiconductors and insulators via symbolic regression", "abstract": "Predicting quasiparticle energies in materials requires expensive numerical evaluations of the electron self-energy. This limits calculations to ordered systems with small unit cells. Here, using symbolic regression, we show that the GW self-energy can be accurately approximated with compact analytical functions of physically motivated Kohn-Sham descriptors. These expressions can be learned from a single GW calculation in the ordered phase and remain accurate under symmetry breaking induced by quantum and thermal fluctuations, elastic deformations, and amorphous disorder. This development enables routine GW calculations of complex materials with thousands of atoms at a computational cost comparable to semi-local density functional theory. We demonstrate the accuracy of this approach for covalent semiconductors, ionic insulators, and two-dimensional materials. These results establish symbolic regression as a viable route to predictive, interpretable, and transferable many-body electronic structure models.", "url": "https://arxiv.org/abs/2608.04291", "type": "理论+数值", "summary": "1. 作者用符号回归从有序相的单个GW计算学习解析表达式，以近似半导体和绝缘体中的GW自能。\n2. 该表达式以物理启发的Kohn-Sham描述符为变量，在对称破缺、弹性形变和无序下依然准确，使数千原子体系的GW计算成本降至半局域泛函水平。\n3. 这展示了符号回归可构建可预测、可解释且可迁移的多体电子结构模型，为复杂材料准粒子计算开辟实用途径。", "summary_source": "deepseek", "authors": [{"name": "Nick Pant"}, {"name": "Viet-Anh Ha"}, {"name": "Donghwan Kim"}, {"name": "Feliciano Giustino"}], "featured_authors": [{"name": "Nick Pant"}, {"name": "Viet-Anh Ha"}, {"name": "Donghwan Kim"}, {"name": "Feliciano Giustino"}], "author_count": 4}, {"id": "2608.04350", "category": "cond-mat", "title": "Quantized topological invariant of symmetry-projected Gibbs states", "abstract": "We study Gibbs states projected onto the symmetric sector of contractible one-form symmetries. In a three-dimensional cluster-model interpolation, this projection stabilizes symmetry-protected topological and projected-paramagnetic phases, both sharply distinct from thermal disorder. A flux-twisted membrane invariant distinguishes these three phases by the values $-1,+1,0$, respectively. These values are exact on the endpoint, self-dual, zero-temperature, and infinite-temperature lines; elsewhere their quantization requires positive spatial-sheet, winding-line, and interface tensions. Quantum Monte Carlo supports the quantization through tension diagnostics and direct finite-size estimates.", "url": "https://arxiv.org/abs/2608.04350", "type": "理论+数值", "summary": "1. 该工作研究三维团簇模型插值中将吉布斯态投影到一形式对称性对称扇区后形成的态，并刻画其相图。\n2. 磁通扭绞膜不变量以 -1、+1、0 区分对称保护拓扑相、投影顺磁相与热无序相；其精确性在若干参数线上成立，其它情形由正张力条件保证，并得到量子蒙特卡罗支持。\n3. 这表明一形式对称性投影可作为有限温度下稳定非热量子相的普适机制，也为定义可量化拓扑不变量提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Weiguang Cao"}, {"name": "Haruki Watanabe"}], "featured_authors": [{"name": "Weiguang Cao"}, {"name": "Haruki Watanabe"}], "author_count": 2}, {"id": "2608.04359", "category": "cond-mat", "title": "Unveiling the Role of Friction in Coarse-Grained Clay: A Hybrid Framework Integrating Long-Range Interactions and Granular Contact Mechanics", "abstract": "Given the predominant role of inter-particle physicochemical forces in governing clay behavior, researchers have increasingly utilized coarse-grained molecular dynamics (CGMD) simulations. However, inter-particle friction has been historically overlooked due to methodological limitations, and the extent to which this omission influences simulation accuracy remains an unresolved question. This study proposes a novel hybrid CGMD framework explicitly coupling long-range Buckingham potential with Hertzian granular contact mechanics. A baseline model was validated via isotropic compression, where the resulting compressibility and derived compression index (Cc) aligned with macroscopic geotechnical observations. Parametric analyses revealed that viscoelastic damping of particle contacts governs structural evolution. Elevated damping suppresses densification, trapping platelets in disorganized, high-void-ratio configurations. Furthermore, evaluating the interplay with thermal fluctuations underscores the necessity of precise temperature control to prevent such unphysical kinetic trapping. Finally, uniaxial compression tests demonstrate the critical importance of inter-particle friction. Explicit friction locks sliding interfaces and sustains significantly higher loads compared to frictionless models; the latter rely solely on geometric interlocking and ultimately exhibit unphysical fluid-like yielding. By bridging atomistic potentials with contact mechanics, this framework highlights the fundamental role of the inter-particle friction and offers essential guidelines for future multi-scale simulations of clay assemblies.", "url": "https://arxiv.org/abs/2608.04359", "type": "理论+数值", "summary": "1. 该工作提出一种混合粗粒化分子动力学框架，将长程Buckingham势与Hertz颗粒接触力学显式耦合，用于模拟黏土并探究粒间摩擦的作用。\n2. 技术关键在于通过各向同性压缩标定压缩指数Cc，并揭示黏弹性阻尼与热涨落可导致非物理动力学俘获，而显式摩擦能锁定滑移界面、避免无摩擦模型出现的类流体屈服。\n3. 这一桥接原子势与接触力学的方案为黏土多尺度模拟提供指导，强调精确温度控制与摩擦参数标定的必要性。", "summary_source": "deepseek", "authors": [{"name": "Wang-Qi Xu"}, {"name": "Yijie Wang"}, {"name": "Zhen-Yu Yin"}], "featured_authors": [{"name": "Wang-Qi Xu"}, {"name": "Yijie Wang"}, {"name": "Zhen-Yu Yin"}], "author_count": 3}, {"id": "2608.04395", "category": "cond-mat", "title": "Zero-Clustering Geometry in Realistic Fractional Quantum Hall Wave Functions", "abstract": "The clustering pattern of zeros in the ground state of a fractional quantum Hall system is a defining feature of its topological properties. We analyze the geometrical fluctuations of the zeros around individual electrons and propose to use the displacement ratio of the zeros to visualize and measure the distance of a realistic state to a model wave function. The distribution of the zero displacement ratio behaves like an order parameter in the transition from a Laughlin phase to a topologically trivial one. The statistical comparison between quantum Hall states belonging to different Jain sequences leads to a composite fermion fluid description of the $\\nu = 1/5$ ground state with long-range Coulomb interaction that agrees almost perfectly for as few as $3$-$5$ electrons, overcoming the long-standing difficulties of accommodating the competing liquid and crystal orders at short distances.", "url": "https://arxiv.org/abs/2608.04395", "type": "理论", "summary": "1. 该工作分析实际分数量子霍尔基态中零点相对单个电子的几何涨落，提出用零点位移比来可视化并度量真实态与模型波函数的距离。\n2. 零点位移比的分布在Laughlin相到拓扑平庸相的转变中类似序参量；对不同Jain序列态的统计比较给出库仑相互作用下ν=1/5基态的复合费米子流体描述，仅3至5个电子即几乎完美一致。\n3. 这为零点几何作为刻画拓扑相变及短程液—晶竞争的新诊断参量提供了可行思路。", "summary_source": "deepseek", "authors": [{"name": "Xin Wan"}, {"name": "Ziang Wang"}, {"name": "Zi-Xiang Hu"}, {"name": "Zhao Liu"}], "featured_authors": [{"name": "Xin Wan"}, {"name": "Ziang Wang"}, {"name": "Zi-Xiang Hu"}, {"name": "Zhao Liu"}], "author_count": 4}, {"id": "2608.04508", "category": "cond-mat", "title": "Microscopic theory of the field-induced instability of the vortex-free state in superconducting thin-film strips", "abstract": "In the Pearl--London theory, the edge-barrier-disappearance field of a superconducting thin-film strip depends on an arbitrary short-distance core cutoff because the vortex is treated as a point object. The theory does not determine the cutoff or how it depends on temperature $T$, and therefore cannot determine the $T$ dependence of the instability field. Here we formulate the microscopic stability problem directly for the vortex-free superconducting state. This removes the core-cutoff ambiguity and determines the instability field $B_s$ over the full temperature range and across all width regimes considered here. For a homogeneous dirty strip with negligible self-field, three width regimes occur. For $W<W_1(T)$, superconductivity disappears continuously into the normal state through a one-dimensional (1D) instability. For $W_1(T)<W<W_2(T)$, an edge-selective two-dimensional (2D) long-wavelength mode becomes unstable. For $W>W_2(T)$, the critical wave number is finite and the unstable mode is localized near an edge. In the wide-strip limit, $B_s\\propto1/W$, recovering the Pearl--London scaling. In sufficiently narrow strips, however, the Pearl--London edge-barrier picture fails qualitatively.", "url": "https://arxiv.org/abs/2608.04508", "type": "理论", "summary": "1. 该工作直接对无涡旋超导薄膜条带建立微观稳定性理论，消除芯截断任意性，并给出全温度与宽度范围的失稳场。\n2. 其要点是识别出三个宽度区：一维连续失稳、边缘选择性二维长波失稳，以及有限波矢的局域边缘失稳模式。\n3. 这一理论确定了失稳场的温度依赖；宽条带恢复1/W标度，而窄条带边缘势垒图像定性失效，为相关实验提供判据。", "summary_source": "deepseek", "authors": [{"name": "Takayuki Kubo"}], "featured_authors": [{"name": "Takayuki Kubo"}], "author_count": 1}, {"id": "2608.04534", "category": "cond-mat", "title": "Wavepacket Approach for Spin Transport in Zigzag Spin Chain", "abstract": "We study the spin transport property of a spin nematic liquid in a frustrated zigzag spin chain in a magnetic field from the perspective of the time evolution of wavepackets by a time-dependent density-matrix renormalization group method. We use the periodic boundary condition to avoid an edge-induced magnetization structure in the open boundary condition. We find that at the saturation, a magnon-pair wavepacket of momentum k=pi stays localized, since the gapless dispersion due to the antiferro-quadrupole quasi-long-range order has a rather flat structure, indicating zero propagation velocity.", "url": "https://arxiv.org/abs/2608.04534", "type": "理论+数值", "summary": "1. 该工作采用含时密度矩阵重整化群方法模拟波包的时间演化，研究磁场下受抑锯齿自旋链中自旋向列液体的自旋输运，并采用周期边界条件以避免开边界引起的边缘磁化结构。\n2. 其核心发现在于，饱和场下动量为k=π的双磁振子波包因反铁四极准长程序对应的无隙色散平台而具有零群速度，从而呈现局域化而非传播。\n3. 该波包视角为理解自旋向列相中束缚态的自旋输运提供了一条动力学路径，也有望推广至其他低维阻挫量子磁体的冷原子或固体材料模拟。", "summary_source": "deepseek", "authors": [{"name": "Hiroaki Onishi"}], "featured_authors": [{"name": "Hiroaki Onishi"}], "author_count": 1}, {"id": "2608.04558", "category": "cond-mat", "title": "Analytical Floquet Quantum Statistics from Nonequilibrium Green's Functions", "abstract": "We derive an analytical expression for the steady-state quantum statistics of periodically driven quantum systems coupled to a bath using the nonequilibrium Green's function (NEGF) formalism. By embedding Floquet theory into NEGF, we obtain closed expressions for the retarded, advanced, and lesser Green's functions in the Floquet representation, yielding the Floquet Fermi distribution in which the steady-state occupation is expressed as a weighted sum of Fermi functions shifted by integer multiples of the driving frequency. The weights are determined solely by the Fourier components of the micromotion operator, providing a transparent interpretation of Floquet sideband occupations. Our analysis extends beyond the diagonal commuting Hamiltonians treated in earlier work, and further shows that the robust Floquet distribution remains valid for a broad class of weakly coupled bath spectral functions beyond the ideal featureless-bath approximation. Finally, we establish a Floquet version of the Landauer formula for the DC part of the current, in which the equilibrium Fermi functions are replaced by their Floquet-modified counterparts. Together, these results provide a coherent description of Floquet quantum statistics and transport in periodically driven open quantum systems.", "url": "https://arxiv.org/abs/2608.04558", "type": "理论", "summary": "1. 该工作利用非平衡格林函数形式，解析推导了周期驱动量子系统在耦合热库下的稳态量子统计性质。\n2. 其技术卖点是将Floquet理论嵌入非平衡格林函数，得到Floquet表象中推迟、超前和小于格林函数的闭式表达式，并把稳态占据写成以驱动频率整数倍平移的费米函数加权和，权重仅由微运动算符的傅里叶分量决定，同时证明该分布对更广泛的弱耦合谱函数依然成立。\n3. 文中并给出Floquet形式的Landauer公式，将平衡费米函数替换为Floquet修正分布，为周期驱动开放系统的量子统计与直流输运提供了统一描述。", "summary_source": "deepseek", "authors": [{"name": "Yuhua Ren"}, {"name": "Gaomin Tang"}, {"name": "Hui Pan"}, {"name": "Jian-Sheng Wang"}], "featured_authors": [{"name": "Yuhua Ren"}, {"name": "Gaomin Tang"}, {"name": "Hui Pan"}, {"name": "Jian-Sheng Wang"}], "author_count": 4}, {"id": "2608.04637", "category": "cond-mat", "title": "Structural and dynamical behavior of methane-water systems under nanoconfinement", "abstract": "We investigate the structural and dynamical behavior of methane water systems under nanoconfinement using molecular dynamics simulations across pore widths from 1 to 5 nm. Structural analysis reveals a strong and nonmonotonic dependence on confinement: while tetrahedral ordering partially recovers as confinement is reduced, cubic like order associated with clathrate precursors is maximized at intermediate pore sizes. Radial distribution functions show that three dimensional correlations are suppressed under strong confinement, whereas lateral ordering persists, indicating a reduction in the effective dimensionality of structural organization. Transport properties reflect the same structural competition. Parallel diffusion is nonmonotonic with pore size, while perpendicular motion is subdiffusive due to confinement induced trapping and heterogeneity. Methane exhibits stronger subdiffusion and remains dynamically coupled to the water matrix. A characteristic confinement length scale emerges at which structural ordering, dynamical heterogeneity, and solvent solute decoupling are simultaneously maximized. At strong confinement, three dimensional correlations are suppressed, leading to dimensional reduction, frustrated ordering, and inhibited nucleation.", "url": "https://arxiv.org/abs/2608.04637", "type": "数值", "summary": "1. 该工作利用分子动力学模拟研究了1–5纳米孔隙中甲烷-水体系的结构与动力学行为。\n2. 其核心发现是限域尺度对四面体序及笼合物前驱体立方序产生非单调调控，并存在一个特征长度使结构有序、动力学异质性与溶剂-溶质去耦合同时最大化。\n3. 这为理解强限域下维度降低、有序受挫及水合物成核受阻的微观机制提供了重要启示。", "summary_source": "deepseek", "authors": [{"name": "José Torres-Arenas"}, {"name": "Ángel M. Fernández-Fernández"}, {"name": "Martín Pérez-Rodríguez"}, {"name": "Manuel M. Piñeiro"}], "featured_authors": [{"name": "José Torres-Arenas"}, {"name": "Ángel M. Fernández-Fernández"}, {"name": "Martín Pérez-Rodríguez"}, {"name": "Manuel M. Piñeiro"}], "author_count": 4}, {"id": "2608.04649", "category": "cond-mat", "title": "Nanosecond timescale plasticity in shock-compressed polycrystalline MgO: evidence for transition in mechanism above 100 GPa", "abstract": "The mechanical properties of ceramics under extreme conditions directly impact applications ranging from shielding spacecrafts, designing plasma facing materials in nuclear fusion to understanding the rheology of deep planetary interiors. Here, we use polycrystalline MgO as a model ceramic to understand the high-pressure-temperature mechanical behaviour of such materials under extreme strain rates. We use laser-driven shock compression up to 175(15) GPa on the principal Hugoniot along with ultrafast diagnostics at the European X-ray Free Electron Laser to probe the dominant deformation mechanisms with changing P -T conditions. These near-instantaneous time-resolved snapshots, coupled with elasto-viscoplastic self-consistent (EVPSC) simulations, strongly suggest that MgO attains plastic regime in the nanoseconds scale accompanied by a pressure-mediated change in dominant slip system between 95 and 175 GPa. This work provides a new direct window into the deformation dynamics of polycrystalline ceramics under high-velocity impacts.", "url": "https://arxiv.org/abs/2608.04649", "type": "理论+数值", "summary": "1. 该工作利用欧洲XFEL的超快诊断与激光驱动冲击压缩，研究了多晶MgO在高达175 GPa冲击下的纳秒尺度塑性变形行为。\n2. 结合弹-粘塑性自洽模拟，实验证据表明MgO在纳秒内进入塑性区，并在95至175 GPa之间发生主导滑移系的压力调控转变。\n3. 这为高速冲击下多晶陶瓷的变形动力学提供了直接观测窗口，对行星内部流变学及抗冲击材料设计具有参考意义。", "summary_source": "deepseek", "authors": [{"name": "A. Chakraborti"}, {"name": "H. Ginestet"}, {"name": "F. Bertrand"}, {"name": "J. Chantel"}, {"name": "S. Merkel"}, {"name": "M. Harmand"}, {"name": "S. Pandolfi"}, {"name": "A. Amouretti"}, {"name": "M. Andrzejewski"}, {"name": "K. Appel"}, {"name": "E. Barraud"}, {"name": "A.B. Belonoshko"}, {"name": "E. Brambrink"}, {"name": "K. Buakor"}, {"name": "C. Camarda"}, {"name": "O. Castelnau"}, {"name": "D.M. Cheshire"}, {"name": "G. Collins"}, {"name": "T.E. Cowan"}, {"name": "C. Crépisson"}, {"name": "J. Deng"}, {"name": "X. Fang"}, {"name": "M. Fitzgerald"}, {"name": "A. Gleason"}, {"name": "F. Hanby"}, {"name": "N.J. Hartley"}, {"name": "P.G. Heighway"}, {"name": "H. Höppner"}, {"name": "N. Jaisle"}, {"name": "J. Kim"}, {"name": "Z. Konopkova"}, {"name": "D. Kraus"}, {"name": "A. Krygier"}, {"name": "L. Libon"}, {"name": "C.M. Lonsdale"}, {"name": "S-N. Luo"}, {"name": "W. Lynn"}, {"name": "M. Masruri"}, {"name": "E.E. McBride"}, {"name": "D. McGonegle"}, {"name": "J.D. McHardy"}, {"name": "M.I. McMahon"}, {"name": "R.S. McWilliams"}, {"name": "T. Michelat"}, {"name": "B. Nagler"}, {"name": "M. Nakatsutsumi"}, {"name": "A-M. Norton"}, {"name": "I. Ocampo"}, {"name": "I.I. Oleynik"}, {"name": "C. Otzen"}, {"name": "S.E. Parsons"}, {"name": "D.J. Peake"}, {"name": "A. Pelka"}, {"name": "A. Phelipeau"}, {"name": "C. Prescher"}, {"name": "T.R. Preston"}, {"name": "N. Pulver"}, {"name": "L. Rogal"}, {"name": "J-P. Schwinkendorf"}, {"name": "G. Shoulga"}, {"name": "R.F. Smith"}, {"name": "S. Singh"}, {"name": "C.N. Somarathna"}, {"name": "T. Stevens"}, {"name": "C.V. Storm"}, {"name": "C. Strohm"}, {"name": "T-A. Suer"}, {"name": "M. Tang"}, {"name": "A. Tipeev"}, {"name": "M. Toncian"}, {"name": "T. Toncian"}, {"name": "U. Trdan"}, {"name": "T. Tschentscher"}, {"name": "J.D. Umpleby-Thorp"}, {"name": "L. Wang"}, {"name": "J.S. Wark"}, {"name": "A. Descamps"}, {"name": "A. Higginbotham"}, {"name": "T.M. Hutchinson"}, {"name": "C. McGuire"}, {"name": "A. Sollier"}, {"name": "G. Morard"}, {"name": "J.H. Eggert"}], "featured_authors": [{"name": "A. Chakraborti"}, {"name": "H. Ginestet"}, {"name": "F. Bertrand"}, {"name": "A. Sollier"}, {"name": "G. Morard"}, {"name": "J.H. Eggert"}], "author_count": 83}, {"id": "2608.04731", "category": "cond-mat", "title": "An improved car-oriented mean-field theory for stochastic traffic flow models", "abstract": "We propose an improved mean-field analysis of cellular automata models of single-lane vehicular traffic. By combining aspects of the Car-Oriented-Mean-Field (COMF) theory and the 2-site cluster method, which have been previously successfully applied to similar models, we aim to capture both short- and long-range correlations more accurately. In contrast to classical mean-field theories, the improved method is well suited for models with inhomogeneous stationary states and able to capture the essential properties of phase separation, e.g. in models with slow-to-start rules. The improved accuracy and new physical insights are illustrated through an application to the VDR model with $v_{\\text{max}}=1$.", "url": "https://arxiv.org/abs/2608.04731", "type": "理论", "summary": "1. 该工作针对单车道随机交通流元胞自动机模型，提出一种改进的面向车辆的动力学平均场理论。\n2. 其技术卖点在于将COMF理论与双格点集团方法结合，从而能同时捕捉短程与长程关联，并处理非齐次稳态及慢启动规则引起的相分离。\n3. 这为解析研究更复杂交通流相变及其他短程与长程关联竞争的非平衡系统提供了可推广的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Yasar Efe Dai"}, {"name": "Andreas Schadschneider"}, {"name": "Michael Schreckenberg"}], "featured_authors": [{"name": "Yasar Efe Dai"}, {"name": "Andreas Schadschneider"}, {"name": "Michael Schreckenberg"}], "author_count": 3}, {"id": "2608.04748", "category": "cond-mat", "title": "Residual Saturation under Pressure-Controlled Drainage", "abstract": "Here, pressure-controlled drainage is formulated as bond percolation with trapping on the pore-network graph, establishing a direct connection between percolation theory and pressure--saturation relations. In two dimensions, the deviation of the residual saturation from its non-vanishing thermodynamic limit obeys a finite-size scaling law with exponent $\\delta \\approx 0.25$, independent of microscopic details of the lattice. In three dimensions, finite-size corrections decay more rapidly ($\\delta \\approx 0.75$), while the asymptotic residual saturation remains finite and depends on coordination number. This extends the standard invasion-percolation picture beyond the breakthrough state, where the invading cluster is fractal and the invaded-phase saturation vanishes in the infinite-size limit.", "url": "https://arxiv.org/abs/2608.04748", "type": "理论+数值", "summary": "1. 该工作将压力控制排水过程建模为孔隙网络图上的带俘获的键逾渗，直接建立了逾渗理论与压力-饱和度关系的联系。\n2. 核心结果是，二维残余饱和度偏离非零热力学极限的有限尺寸修正指数约0.25且不依赖晶格细节；三维修正衰减更快（约0.75），渐近残余饱和度有限并依赖配位数。\n3. 这扩展了标准侵入逾渗图像至突破后阶段，为多孔介质不可混相驱替的残余捕集有限尺寸行为提供了可检验的理论预言。", "summary_source": "deepseek", "authors": [{"name": "Fernando Alonso-Marroquin"}, {"name": "Hans J. Herrmann"}], "featured_authors": [{"name": "Fernando Alonso-Marroquin"}, {"name": "Hans J. Herrmann"}], "author_count": 2}, {"id": "2608.04754", "category": "cond-mat", "title": "Unifying microscopic theories for the phono-magnetic effect", "abstract": "Phonon angular momentum induces an effective magnetic field, a phenomenon called phono-magnetic effect, which has been measured to vary significantly in size. Here, we compare three approaches for deriving the effective magnetic field of a phonon, using electron-phonon coupling and orbital magnetism. The adiabatic approach assumes a slow ionic motion, keeping electrons in the ground state. The perturbative approach treats the electron-phonon interaction as a perturbation to the electronic ground state, and the Floquet approach is based on the time-periodicity of the circular ionic motion. We show that all three approaches lead to the same effective Hamiltonian in the low-frequency limit, which moves us closer towards a unified theory of the phono-magnetic effect. Furthermore, we identify two phononic contributions to the sample magnetization, spontaneous and induced. Thus, we clarify the role of the effective magnetic field in the phonon-induced magnetization. We conclude by providing a numerical estimate for the effective magnetic field in SrTiO$_3$.", "url": "https://arxiv.org/abs/2608.04754", "type": "理论+数值", "summary": "1. 该工作比较了绝热、微扰与Floquet三种推导声子有效磁场的方法，证明其在低频极限下等价。\n2. 其卖点在于统一三种微观理论，并区分自发与感生两类声子磁化贡献，厘清了有效磁场的作用。\n3. 这为声子磁效应的统一理论建立及SrTiO3中有效磁场的定量预言提供了明确基础。", "summary_source": "deepseek", "authors": [{"name": "Natalia Shabala"}, {"name": "Finja Tietjen"}, {"name": "Ylva Liljegren"}, {"name": "R. Matthias Geilhufe"}], "featured_authors": [{"name": "Natalia Shabala"}, {"name": "Finja Tietjen"}, {"name": "Ylva Liljegren"}, {"name": "R. Matthias Geilhufe"}], "author_count": 4}, {"id": "2608.04762", "category": "cond-mat", "title": "Emergent Replica Clock Unifies Many-Body Localization and Thermalization", "abstract": "Many-body localization (MBL) and eigenstate thermalization (ETH) are traditionally distinguished by a collection of separate diagnostics, not by a single order parameter. We show that replication and folding of isolated unitary dynamics generate a complex statistical mechanics of forward--backward history pairings and, in a closed cyclic infrared sector, an emergent clock $r_x\\in\\mathbb Z_t$. Its correlator has three distinct asymptotics: exponential decay in MBL, scale-free decay at criticality, and long-range locking in the thermal phase. A controlled $l$-bit reduction makes the clock action quasi-local, while its inverse correlation length obeys $\\xi_{\\rm pair}^{-1}=\\kappa_{\\rm el}=\\ln|\\rho_0/\\rho_q|$, unifying history coherence, the defect line tension, and the transfer spectrum. Replica order supplies a second, discrete coordinate---the first order at which a hidden dynamical invariant becomes visible---and can distinguish localized dynamics that share the same spatial correlation length.", "url": "https://arxiv.org/abs/2608.04762", "type": "理论", "summary": "1. 该工作通过复制与折叠幺正动力学，提出用涌现副本时钟作为统一刻画多体局域化与热化的序参量。\n2. 其核心是时钟关联函数在局域化相、临界点与热化相分别呈指数衰减、无标度衰减和长程锁定，且经 l-bit 约化后逆关联长度等于转移谱间隙的对数，统一了历史相干性与缺陷线张力。\n3. 该副本序还提供离散坐标，可揭示隐藏动力学不变量的出现阶次，用以区分具有相同空间关联长度的局域化动力学，为量子非平衡相变提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Tong Liu"}], "featured_authors": [{"name": "Tong Liu"}], "author_count": 1}, {"id": "2608.04781", "category": "cond-mat", "title": "A phase field model of coupled crack and dislocations: emission, blunting, and the necessity of dissipative toughening", "abstract": "We propose a phase field model of a macrocracked single crystal in which the crack and the geometrically necessary dislocations descend from a single energy functional. Energy minimization alone then decides dislocation nucleation, through an integral criterion evaluated in closed form along slip chords. The criterion yields a size effect inaccessible to point-wise strength conditions: a grain-size-dependent yield stress. With slip suppressed the model reproduces Griffith fracture; with fracture suppressed, the nucleation load measured by the full non-smooth solver agrees with the closed-form nucleation criterion to four percent. The coupled computations produce a two-stage response: at loads an order of magnitude below cleavage, dislocation bands emitted from the notch tip blunt and shield it, raising the initiation load; once the crack grows, the bands heal; a compact cluster of like-signed dislocations travels with the tip, its canceling partner walls pinned at the grain boundary, and the dissipated fracture resistance equals the elastic one. In the purely energetic, dissipationless limit, emission shields the crack but does not toughen it; toughening requires dissipation, incorporated in the sequel through the threshold resistance to dislocation motion.", "url": "https://arxiv.org/abs/2608.04781", "type": "理论+数值", "summary": "1. 该工作提出源自单一能量泛函的宏观裂纹与几何必需位错相场模型，位错成核由沿滑移弦闭合积分判据解析决定，且与全非光滑求解器的成核载荷在4%以内一致。\n2. 该判据自然导出点态强度条件无法容纳的晶粒尺寸相关屈服应力；耦合计算再现两阶段响应：裂尖位错带发射使裂纹钝化并屏蔽，裂纹扩展后位错带愈合，同号位错簇随裂尖移动而其抵消配对位错墙钉扎于晶界。\n3. 在纯能量无耗散极限中发射仅屏蔽而不增韧，表明增韧必须依赖位错运动阈值阻力所引入的耗散，为后续耗散增韧与晶界钉扎效应研究提供明确启示。", "summary_source": "deepseek", "authors": [{"name": "Khanh Chau Le"}, {"name": "Thi My Kieu Tran"}], "featured_authors": [{"name": "Khanh Chau Le"}, {"name": "Thi My Kieu Tran"}], "author_count": 2}, {"id": "2608.04816", "category": "cond-mat", "title": "Ghost-RISB for Correlated Electron-Phonon Systems: Application to the Hubbard-Holstein Model", "abstract": "We develop a generalization of the ghost-rotationally-invariant slave-boson (ghost-RISB) method that incorporates local phonon modes coupled to arbitrary on-site electronic degrees of freedom, enabling a nonperturbative treatment of electron-electron and electron-phonon interactions within an efficient variational framework. The method extends the ghost-orbital construction to capture dynamical self-energy effects and phonon-induced renormalizations beyond static slave-boson approaches. Benchmarking against dynamical mean-field theory (DMFT) results for the Hubbard-Holstein model, we find excellent quantitative agreement for electron quasiparticle weights and phonon properties across a wide range of coupling strengths, and it captures accurately the competition between electron-electron and electron-phonon interactions. We show that the inclusion of the ghost orbitals is crucial to accurately describe the regime of low-frequency, strongly dynamical, phonons. The extended ghost-RISB achieves this accuracy at a fraction of the computational cost of DMFT, due to its self-consistency rooted in static observables instead of dynamical ones, enabling rapid exploration of correlated electron-phonon phase diagrams. We exploit this advantage to characterize the most demanding regime of strong coupling and adiabatic phonons. Our analysis shows a suppression of the superconducting order parameter, which is interpreted as a Franck-Condon-like reduction of the overlap between the phonon wavefunctions associated with empty and doubly-occupied sites in the bipolaronic regime.", "url": "https://arxiv.org/abs/2608.04816", "type": "理论+数值", "summary": "1. 该工作将ghost-RISB方法推广到包含局域声子模的关联电子-声子系统，并应用于Hubbard-Holstein模型。\n2. 其技术卖点是利用ghost轨道构建有效杂质模型，以静态观测量而非动态观测量作自洽条件，从而在远低于DMFT的计算成本下定量重现电子准粒子权重与声子性质。\n3. 该方法适用于强耦合与绝热声子等苛刻区间，能揭示双极化子区中Franck-Condon效应对超导序参量的抑制，为高效探索关联电子-声子相图开辟了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Samuele Giuli"}, {"name": "Ricardo J. Campos-Lopes"}, {"name": "Emin Moghadas"}, {"name": "Massimo Capone"}], "featured_authors": [{"name": "Samuele Giuli"}, {"name": "Ricardo J. Campos-Lopes"}, {"name": "Emin Moghadas"}, {"name": "Massimo Capone"}], "author_count": 4}, {"id": "2608.04841", "category": "cond-mat", "title": "Structural Chirality from Short-Range Order in Heteroanionic Materials", "abstract": "Established routes to structural chirality in inorganic crystals depend on symmetry-lowering atomic displacements of an achiral parent structure. We show that chirality can instead be forced by the ordering of two anion species over the sites of an achiral parent, independent of atomic displacements. ReO$_3$-type oxyfluorides with a 2:1 anion stoichiometry, such as NbO$_2$F, exhibit two ordering patterns: cis octahedral coordination and period-three anion-chain ordering, both rooted in the off-centring of $d^0$ cations. By direct enumeration, we prove that every configuration combining both orderings on the smallest commensurate cell is chiral, belonging to a Sohncke space group. For the specific case of NbO$_2$F, density-functional theory calculations predict that the ground state is the maximally symmetric chiral configuration. Wang-Landau Monte Carlo simulations of a DFT-trained cluster-expansion model predict an equilibrium chiral phase up to a first-order transition at 494 K. These results establish configurational ordering as a chemically realisable route to structural chirality, and mark heteroanionic materials with analogous ordering chemistry as candidates for a new class of chiral functional materials.", "url": "https://arxiv.org/abs/2608.04841", "type": "理论+数值", "summary": "1. 该工作证明在保持非手性母体不发生原子位移的情况下，仅靠两种阴离子在格点上的有序排列即可迫使无机晶体产生结构手性。\n2. 其核心在于对ReO₃型2:1氧氟化物进行直接枚举，指出顺式八面体配位与周期三阴离子链序的组合必然给出Sohncke空间群手性构型，并以NbO₂F为例用DFT和团簇展开蒙特卡洛确认其手性基态与494 K一级相变。\n3. 这为利用阴离子有序化学设计手性功能材料提供了新路径，并预示同类异阴离子体系可作为候选平台。", "summary_source": "deepseek", "authors": [{"name": "Benjamin J. Morgan"}], "featured_authors": [{"name": "Benjamin J. Morgan"}], "author_count": 1}, {"id": "2608.04875", "category": "cond-mat", "title": "Large nonlinear Hall effect in strained moiré structures hosting high-pseudospin fermions", "abstract": "We investigate the linear and nonlinear Hall response of a moiré \\emph{watermill lattice}, in which stacking and twisting generate a four-band manifold near the Fermi level with suppressed group velocities at discrete magic angles. Including an inversion symmetry breaking onsite mass breaks the interlayer symmetry, opening a gap in this manifold and driving the system into a non-trivial bulk topological phase. We map the resulting phase diagram as a function of the strength of the mass and twist angle $\\theta$, revealing several sectors with high Chern numbers. We then introduce strain to break the residual $C_3$ symmetry of the lattice which activates a finite Berry curvature dipole and correspondingly, a nonlinear Hall response. The dipole reverses sign sharply across topological phase boundaries, producing butterfly like features when plotted against the relevant system parameters. Its magnitude substantially exceeds that reported for symmetry-broken transition metal dichalcogenides, consistent with the elevated Wilson-loop winding and enhanced quantum geometry associated with the lattice's pseudospin-$3/2$ character. We conclude by incorporating thermal effects on the Berry curvature dipole, asserting that it is an important tool for discerning topology at low temperatures.", "url": "https://arxiv.org/abs/2608.04875", "type": "理论+数值", "summary": "1. 作者研究含应变水车晶格莫尔结构中的线性和非线性霍尔效应，通过层间不对称质量项打开能隙并绘制质量与扭角相图，发现多个高陈数拓扑区域。\n2. 其核心卖点在于应变打破残余C3对称性从而激活有限贝里曲率偶极子；该偶极子随拓扑相界急剧变号形成蝴蝶状结构，且因赝自旋-3/2费米子的高Wilson圈缠绕与增强量子几何，其幅值远超对称破缺TMD体系。\n3. 该工作还考虑温度对贝里曲率偶极子的影响，表明非线性霍尔效应可作为低温下区分拓扑相与探测量子几何的灵敏探针。", "summary_source": "deepseek", "authors": [{"name": "Srijata Lahiri"}, {"name": "Gourab Paul"}, {"name": "Bilal Tanatar"}, {"name": "Saurabh Basu"}], "featured_authors": [{"name": "Srijata Lahiri"}, {"name": "Gourab Paul"}, {"name": "Bilal Tanatar"}, {"name": "Saurabh Basu"}], "author_count": 4}, {"id": "2608.04888", "category": "cond-mat", "title": "Effects of Interfacial States and Strain on Tunnel Magnetoresistance in van der Waals Magnetic Tunnel Junctions", "abstract": "All-two-dimensional magnetic tunnel junctions promise atomically sharp interfaces, yet the role of interface-induced states in their spin transport is not fully understood. Here, we theoretically investigate spin-dependent transport in van der Waals magnetic tunnel junctions of the structure Cr$_2$C/$MY_2$/Cr$_2$C ($M$ = Mo, W; $Y$ = S, Se) with barrier thicknesses of 3, 5, 7, and 9 layers. The broad features of the $\\mathbf{k}_{\\parallel}$-resolved conductances, namely suppression near the $\\Gamma$ point and enhancement at six off-$\\Gamma$ hot spots, are consistent with the decay of evanescent states in the barrier. However, trilayer WS$_2$, MoSe$_2$, and WSe$_2$ barriers exhibit conductances of the order of $e^2/h$ at $\\mathbf{k}_{\\parallel}$ points within the hot spots. We attribute these near-unity transmission channels to resonant coupling between the interfacial states at the two electrode--barrier interfaces, as evidenced by their weak but finite residual weight at the barrier center. For thicker barriers, this coupling weakens, which suppresses the residual weight, thereby reducing the tunnel magnetoresistance (TMR) ratio of the MoS$_2$ junction while enhancing those of the other junctions. To exploit the interfacial states for spin-selective tunneling, we further examine biaxial tensile strain applied to the trilayer junctions. At 4\\% strain, the TMR ratio increases from 176\\% to 540\\% for MoS$_2$ and from 98\\% to 496\\% for WS$_2$, whereas MoSe$_2$ and WSe$_2$ exhibit comparatively weaker enhancement. Our results establish interfacial-state engineering via strain and barrier thickness as effective routes for enhancing the TMR effect in all-two-dimensional magnetic tunnel junctions.", "url": "https://arxiv.org/abs/2608.04888", "type": "理论+数值", "summary": "1. 该工作理论研究了 Cr₂C/MY₂/Cr₂C（M=Mo、W；Y=S、Se）全二维磁隧道结中随势垒层数变化的自旋输运，并考察界面态与双轴应变对隧穿磁电阻的调控。\n2. 其卖点在于发现三层势垒中两界面态的共振耦合可在离Γ热点产生近 e²/h 的透射通道，且 4% 张应变能使 MoS₂ 与 WS₂ 结的 TMR 分别提升至 540% 与 496%。\n3. 这为借助应变和势垒厚度调控界面态以增强全二维磁隧道结的 TMR 效应提供了有效途径，并启发对其他范德华自旋电子器件的界面工程研究。", "summary_source": "deepseek", "authors": [{"name": "Sakshi Goel"}, {"name": "Arti Kashyap"}, {"name": "Keisuke Masuda"}, {"name": "Terumasa Tadano"}], "featured_authors": [{"name": "Sakshi Goel"}, {"name": "Arti Kashyap"}, {"name": "Keisuke Masuda"}, {"name": "Terumasa Tadano"}], "author_count": 4}, {"id": "2608.04911", "category": "cond-mat", "title": "Predicting Plasticity in Two-Dimensional Foam Channel Flow Around an Obstacle", "abstract": "We study the prediction of plastic activity in the confined channel flow of two-dimensional amor- phous soft particles around a circular obstacle. Using datasets generated with a particle-based bubble model, we formulate the prediction problem within two supervised-learning frameworks: re- gression of the non-affine displacement and binary classification of neighbor change events. A key technical challenge is that the obstacle and the confining walls explicitly break translational and rotational symmetries. We address this issue by introducing additional structural descriptors that encode the positions of particles relative to these boundaries. Starting from simple linear models, we systematically increase the complexity of the learning framework by considering a logarithmic transformation of the target variable, the incorporation of particle-size information, the addition of symmetry-breaking obstacle and wall descriptors, the coarse-graining of local structural descrip- tors, and nonlinear neural-network models. We find that the obstacle and wall descriptors provide the largest improvement in predictive performance. Nevertheless, the models considered here cap- ture mainly the overall localization of plastic activity near the obstacle and do not fully reproduce its detailed heterogeneous pattern in individual configurations. A perturbation analysis indicates that this heterogeneity is robustly encoded in the initial structure, suggesting that further progress requires more expressive structural representations and machine-learning architectures.", "url": "https://arxiv.org/abs/2608.04911", "type": "理论+数值", "summary": "1. 该工作利用粒子气泡模型生成的数据集，在二维非晶软颗粒绕障碍物的受限通道流中，用监督学习预测塑性活动，包括非仿射位移回归与邻居交换事件二分类。\n2. 技术核心是针对障碍物与壁面破缺平移和旋转对称性，引入相对边界的结构描述符；结果显示这些描述符带来最大预测提升，但模型仅能捕捉塑性活动在障碍物附近的整体局域化。\n3. 微扰分析表明单构型中的非均匀塑性模式已稳健编码于初始结构，因此需更富表达力的结构表征与机器学习架构才能进一步刻画其细节。", "summary_source": "deepseek", "authors": [{"name": "Alexandre Stepanetz"}, {"name": "Bahaa Mazloum"}, {"name": "Benjamin Dollet"}, {"name": "Misaki Ozawa"}], "featured_authors": [{"name": "Alexandre Stepanetz"}, {"name": "Bahaa Mazloum"}, {"name": "Benjamin Dollet"}, {"name": "Misaki Ozawa"}], "author_count": 4}, {"id": "2608.04920", "category": "cond-mat", "title": "Resolving coupled transport in space and time from molecular fluctuations in confined fluids", "abstract": "Transport in fluids is generally reduced to continuum laws parametrized by bulk coefficients and effective interfacial parameters, such as viscosities, diffusivities, slip lengths, and interfacial resistances. This description becomes incomplete at the nanoscale, where spatial heterogeneity, molecular structure, and finite relaxation times are inseparable from the transport process. Here we formulate coupled transport in nanoconfined fluids as a space--time-resolved Onsager response matrix and extract it from equilibrium molecular dynamics simulations. Applied to a confined charged fluid, the framework resolves the nonlocal and transient pathways coupling particle, solute, heat, and charge transport. Momentum transport appears as a long-lived, nonlocal hydrodynamic mode, whereas charge transport relaxes rapidly through localized ionic friction. Off-diagonal responses reveal distinct projected dynamics, providing a microscopic basis for nonlocal, history-dependent transport laws.", "url": "https://arxiv.org/abs/2608.04920", "type": "数值", "summary": "1. 该工作将纳米受限流体中的耦合输运表示为时空分辨的Onsager响应矩阵，并从平衡分子动力学模拟中直接提取该矩阵。\n2. 其技术卖点在于能够分辨粒子、溶质、热和电荷输运之间的非局域与瞬态耦合通道；动量输运表现为长寿命的非局域流体动力学模式，而电荷输运经局域离子摩擦快速弛豫。\n3. 这一框架为建立非局域、历史依赖的输运定律提供了微观基础，也为修正纳米尺度连续介质输运模型提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Thê Hoang Ngoc Minh"}, {"name": "Ian C. Bourg"}], "featured_authors": [{"name": "Thê Hoang Ngoc Minh"}, {"name": "Ian C. Bourg"}], "author_count": 2}, {"id": "2608.04979", "category": "cond-mat", "title": "Delocalized Coupled-Cluster Theory for Polaron Structure and Dynamics", "abstract": "Polaron ground states and finite-temperature dynamics remain challenging to simulate because existing methods struggle to combine nonperturbative accuracy, systematic improvability, and scalability from models to materials-specific Hamiltonians. We introduce a translationally invariant variational coupled-cluster (CC) theory for polarons, termed delocalized CC (dCC), with closed-form energies at cost as low as $\\mathcal{O}(N^3)$ and no phonon-number cutoff. dCC accurately describes the ground states of the one- and two-dimensional Holstein and Su--Schrieffer--Heeger (optical and bond) models and the Fr{ö}hlich model, in close agreement with density matrix renormalization group (DMRG) and diagrammatic Monte Carlo benchmarks. A projected tangent-space response formalism built on the same ansatz yields electron-addition spectral functions and optical conductivities at zero and finite temperature. The resulting spectra agree well with DMRG, Lanczos, and neural-network quantum-state benchmarks while retaining a physically interpretable excitation hierarchy, and extend to two-dimensional lattices at finite temperature beyond the practical reach of these methods. The same framework applies directly to \\textit{ab initio} electron--phonon matrix elements, yielding LiF electron- and hole-polaron binding energies that match state-of-the-art many-body calculations. These results establish dCC as a unified variational framework for polaron ground states and dynamics, from model systems to real materials.", "url": "https://arxiv.org/abs/2608.04979", "type": "理论+数值", "summary": "1. 该工作提出平移不变的离域耦合簇(dCC)理论，统一描述极化子基态和有限温度电子添加谱与光导率。\n2. 其核心在于无需声子截断的闭式能量及切空间响应，以O(N^3)成本在Holstein、SSH与Fröhlich模型中复现DMRG/Diagrammatic Monte Carlo基准，并支持二维有限温度。\n3. 该框架可直接接入第一性原理电子-声子矩阵元，给出LiF极化子束缚能，为从模型到真实材料的极化子模拟提供可扩展统一途径。", "summary_source": "deepseek", "authors": [{"name": "Hamlin Wu"}, {"name": "Moritz K.A. Baumgarten"}, {"name": "Tong Jiang"}, {"name": "Joonho Lee"}], "featured_authors": [{"name": "Hamlin Wu"}, {"name": "Moritz K.A. Baumgarten"}, {"name": "Tong Jiang"}, {"name": "Joonho Lee"}], "author_count": 4}, {"id": "2608.04986", "category": "cond-mat", "title": "Magnetic catalysis and Hall conductivity of excitonic insulators in a planar four-Fermi model", "abstract": "We study the effects of a perpendicular magnetic field on the excitonic insulator (EI) phase in the semiconductor regime using an extended planar four-Fermi model. Within the large-$N$ approximation, we determine the coupled scalar and excitonic condensates at finite temperature, chemical potential, and magnetic field. The field enhances the EI condensate and raises its critical temperature, providing an excitonic realization of magnetic catalysis, while the scalar condensate remains constant throughout the EI phase. By contrast, the critical chemical potential depends nonmonotonically on the field because of the successive occupation of Landau levels. The magnetic field also shifts the mean-field tricritical point and enlarges the first-order region of the temperature--chemical-potential phase diagram. We further analyze the Hall conductivity and find that increasing the field reduces the number of plateaus and modifies the threshold for a finite Hall response. For the parameters considered, the emergence of the EI condensate is accompanied by a characteristic change in the Hall conductivity, including a field-dependent change of slope near a continuous transition. These results show that the combined phase structure and Hall response can provide complementary signatures of excitonic ordering in planar fermionic systems.", "url": "https://arxiv.org/abs/2608.04986", "type": "理论+数值", "summary": "1. 该工作在大N近似下研究垂直磁场对扩展平面四费米模型中激子绝缘体相的影响，考察有限温度、化学势和磁场的耦合凝聚。\n2. 其核心发现是磁场增强激子凝聚并提高临界温度，实现激子型磁催化，同时标量凝聚保持恒定；而临界化学势随朗道能级占据呈非单调变化，并改变三临界点与霍尔电导平台。\n3. 这显示联合相结构与霍尔响应可为平面费米系统中的激子有序提供互补的实验探测判据，值得在相关凝聚态平台进一步验证。", "summary_source": "deepseek", "authors": [{"name": "William R. Tavares"}, {"name": "Rudnei O. Ramos"}, {"name": "Nei Lopes"}], "featured_authors": [{"name": "William R. Tavares"}, {"name": "Rudnei O. Ramos"}, {"name": "Nei Lopes"}], "author_count": 3}, {"id": "2608.05027", "category": "cond-mat", "title": "Scaling behavior in non-reciprocal and odd conserved dynamics near criticality", "abstract": "In recent years, non-reciprocity has been explored as a ubiquitous manifestation of non-equilibrium activity at the microscopic scales for various active matter systems, from mixtures of chemically active enzymes, colloids, and droplets, to engineered light-controlled active colloids and robotic meta-materials. A commonly used minimal model to describe the dynamics of a binary mixture of conserved species with non-reciprocal interactions is the non-reciprocal Cahn-Hilliard (NRCH) model. The model is characterized by a temperature-like tuning parameter, which can trigger phase separation, and a non-reciprocal coupling, which can lead to the formation of spatio-temporal patterns, as it represents an intrinsic source of non-equilibrium activity and breaks parity and time-reversal symmetries. Here, we study the scaling behavior of the NRCH model near the critical point using perturbative dynamical renormalization group techniques. We find that structural and dynamical correlations are controlled by different correlation lengths, both of which diverge at the critical point, but governed by different scaling laws. In particular, while the structural correlations are always controlled by temperature and the classical Wilson-Fisher critical exponent, the dynamical correlation length exhibits multiple scaling regimes in which either temperature or non-reciprocal coupling can dominate as the key tuning parameter, with a new critical exponent characterizing the divergence. The critical point corresponds to a conserved equilibrium-like dynamics with odd mobility, which we denote as the odd Cahn-Hilliard (OCH) model. Our findings may have important implications on how living systems can control phase separation and spatio-temporal pattern formation using the rates of catalytic reactions, and in general metabolism, as control parameters.", "url": "https://arxiv.org/abs/2608.05027", "type": "理论", "summary": "1. 该工作采用扰动动力学重整化群方法，系统研究了非互易Cahn-Hilliard模型在临界点附近的标度行为。\n2. 其关键发现是结构与动力学关联各自发散但由不同关联长度支配：结构关联始终由温度及Wilson-Fisher临界指数控制，而动力学关联呈现温度或非互易耦合分别主导的多重标度区，并伴随新的临界指数，临界点对应具有奇迁移率的守恒动力学，即奇Cahn-Hilliard模型。\n3. 这暗示活性体系可通过调节催化反应速率或新陈代谢作为控制参数，从而调控相分离与时空斑图形成。", "summary_source": "deepseek", "authors": [{"name": "Martin Kjøllesdal Johnsrud"}, {"name": "Giulia Pisegna"}, {"name": "Ramin Golestanian"}], "featured_authors": [{"name": "Martin Kjøllesdal Johnsrud"}, {"name": "Giulia Pisegna"}, {"name": "Ramin Golestanian"}], "author_count": 3}, {"id": "2608.05068", "category": "cond-mat", "title": "Effective single particle picture for anharmonic lattice dynamics: a Rosetta stone for electronic and ionic response", "abstract": "We establish a theoretical framework for the dynamics of a lattice of ions in a mean-field approach, where anharmonicity is included via self-consistency. In this picture, the many-body dynamics of a system of $N$ atoms in three dimensions is mapped onto two kinds of $6N$-dimensional vectors: the phonon condensate, describing the evolution of the average atomic positions, and the phonon spinors, describing the evolution of the atomic elastic constants. The phonon spinors are classified by a quantum number that behaves as a spin: the phonon pseudospin. The many-body Liouville equation is replaced by two wave equations equivalent to the time-dependent Schrödinger equation for the electronic wave function in density functional theory. Exploiting this parallelism, we formulate the response of the anharmonic lattice in one-to-one correspondence with time-dependent density functional theory for electrons. In complete analogy with the electronic case, we express the ionic response in terms of matrix elements of operators representing external fields and forces. We show how anharmonicity screens external perturbations through a phonon analogue of the Hartree-exchange-correlation kernel. We provide expressions for the lattice optical and thermal conductivity, showing how thermal conductivity depends on the phonon pseudospin. By approximating the density matrix as a Gaussian, we recover the equations of the time-dependent self-consistent harmonic approximation. In this case, the linear-response equations are formulated in terms of an anharmonic kernel including three- and four-phonon scattering. By translating anharmonic lattice dynamics into the language of density functional theory, this work shows how theoretical and computational advances in modeling the dynamical response of interacting electrons can be directly applied to interacting ions.", "url": "https://arxiv.org/abs/2608.05068", "type": "理论+数值", "summary": "1. 该工作建立了一个含自洽非简谐效应的离子格点平均场理论，将多体晶格动力学映射为声子凝聚体与声子旋量两类6N维矢量的有效单粒子图像。\n2. 其核心卖点是把格点动力学写成与电子含时密度泛函理论一一对应的类薛定谔方程，并用声子赝自旋与哈特里-交换关联核的声子类比来统一描述非谐屏蔽及光学/热输运响应。\n3. 这一映射为直接将电子动力学响应的理论及计算方法移植到强非谐离子体系提供了清晰路径，并自然归约为含时自洽谐波近似。", "summary_source": "deepseek", "authors": [{"name": "Giovanni Caldarelli"}, {"name": "Francesco Mauri"}], "featured_authors": [{"name": "Giovanni Caldarelli"}, {"name": "Francesco Mauri"}], "author_count": 2}, {"id": "2608.05083", "category": "cond-mat", "title": "It Takes Two to Tribo: Stochastic Charge Evolution in Repeated Binary Collisions of Acoustically Levitated Particles", "abstract": "The mechanisms governing triboelectric charging between insulating particles of the same material remain an open question in nonequilibrium physics, with several competing models proposed to explain observed charging behaviour. Here, we investigate charge evolution in a minimal system consisting of two acoustically levitated particles undergoing repeated binary collisions. To quantify particle charge transfer, purpose-built Faraday cage picoammeters were developed and calibrated. The MultiLev acoustic levitation system was used alongside Ultraino simulations to generate transducer control signals, enabling controlled collision and separation of polystyrene (PS) particles. Although individual collision events exhibit stochastic charge transfer, described by skew-normal distributions, we demonstrate for the first time that the cumulative charge evolution of an individual acoustically levitated particle pair follows the saturation behaviour predicted by the condenser model of triboelectric charging, with fits achieving $R^2 > 0.99$. Under identical conditions, conductive graphite-coated PS particles also undergo charge transfer, but accumulate substantially less charge, consistent with the distinct charging behaviour expected for conductive materials.", "url": "https://arxiv.org/abs/2608.05083", "type": "理论+数值", "summary": "1. 该工作通过声悬浮与法拉第笼皮安计，对两个聚苯乙烯颗粒进行重复二元碰撞，实验研究了同种绝缘材料间的摩擦起电电荷演化。\n2. 其要点在于：单次碰撞电荷转移可用偏正态分布刻画，但首次揭示单对颗粒的累积电荷演化精确遵循电容器模型饱和行为，拟合优度R²>0.99，且导电石墨涂层颗粒电荷积累显著更少。\n3. 这为在受控最小体系中检验摩擦起电竞争模型提供了定量基准，并表明导电性可成为调控颗粒电荷积累的有效途径。", "summary_source": "deepseek", "authors": [{"name": "Tom F. O'Hara"}, {"name": "Adrian C. Barnes"}, {"name": "Nathan Croll Dawes"}, {"name": "Karen L. Aplin"}], "featured_authors": [{"name": "Tom F. O'Hara"}, {"name": "Adrian C. Barnes"}, {"name": "Nathan Croll Dawes"}, {"name": "Karen L. Aplin"}], "author_count": 4}, {"id": "2608.05130", "category": "cond-mat", "title": "Tetrahedral linkage as an intrinsic measure of glycan antifreeze behavior", "abstract": "Antifreeze materials prevent ice-formation by disrupting the ice-formation by binding to certain ice-planes. Cellulose, the most abundant biopolymer, has shown the ability to bind to ice-planes but the exact mechanism of this binding is far from being understood. Molecular dynamics simulations are used to investigate the hydration water of chains of cellulose-type glycans and its significance in the expression of the antifreeze behavior of sugar-derivatives found in some antifreeze materials. We find that glycans are able to prevent water from freezing near its surface by preventing their rearrangement to achieve a highly tetrahedral structure at temperatures well-below the freezing point of water. This validates our hypothesis on the role of tetrahedral coordination based on previous $\\textit{ab initio}$ calculations that demonstrated cellulose prefers to bind to ice basal and prismatic planes using a tetrahedral geometry. Our findings suggest that the tetrahedral ordering of water around glycans is the key to understanding and designing cellulose-based antifreeze materials.", "url": "https://arxiv.org/abs/2608.05130", "type": "理论+数值", "summary": "1. 该工作利用分子动力学模拟研究纤维素型聚糖链周围的水合水，考察其在远低于冰点温度下抑制结冰的机制。\n2. 其核心发现是聚糖通过阻止近表面水重排为高度四面体结构来维持液态，从而将四面体有序度确立为衡量聚糖抗冻行为的本征指标，并验证了先前从头算的预测。\n3. 这为基于纤维素设计抗冻材料提供了以局部水四面体排序为判据的分子设计思路，也可推广至其他糖类防冻剂的理性筛选。", "summary_source": "deepseek", "authors": [{"name": "Aakash Kumar"}, {"name": "Shoumik Saha"}, {"name": "Dilip Gersappe"}], "featured_authors": [{"name": "Aakash Kumar"}, {"name": "Shoumik Saha"}, {"name": "Dilip Gersappe"}], "author_count": 3}, {"id": "2608.04067", "category": "hep-th", "title": "Comment on \"Multi-black holes in Bertotti-Robinson spacetime\"", "abstract": "We point out that the asymptotically Bertotti-Robinson multi-black hole solutions of Einstein-Maxwell theory can be constructed using only three-dimensional sigma-model techniques, without resorting to the monodromy-matrix approach.", "url": "https://arxiv.org/abs/2608.04067", "type": "理论", "summary": "1. 该评论针对“Bertotti-Robinson时空中的多黑洞”一文，指出爱因斯坦-麦克斯韦理论的渐近多黑洞解可由三维sigma模型直接构造。\n2. 其技术要点在于无需采用monodromy-matrix方法，仅利用sigma模型对称性即可推导出完整解族，从而简化了构造流程。\n3. 这为类似渐近对称性解族提供了一个更简洁的推导框架，并可能推广至其他含电磁场的广义相对论模型。", "summary_source": "deepseek", "authors": [{"name": "Gérard Clément"}], "featured_authors": [{"name": "Gérard Clément"}], "author_count": 1}, {"id": "2608.04080", "category": "hep-th", "title": "Supersymmetry, Supergravity and the Consistency of On-Shell Massive Superamplitudes", "abstract": "I study constraints from consistent complex factorisation of $2\\rightarrow 2$ scattering amplitudes in $4d$ and their relationship with supersymmetry. I complete the argument demonstrating that a massless helicity-$3/2$ particle must be a gravitino in a theory of supergravity and derive the structure and couplings of massive supermultiplets from first principles. For massive BPS particles in theories with extended supersymmetry, further constraints on the couplings are derived from consistent factorisation of massive superamplitudes. Among these is the requirement that BPS vector bosons must have couplings conforming to Lie algebra structure constants or generalised Chern-Simons terms. The gravitational coupling is shown to participate and draws the graviphotons into the Lie algebra. All $2\\rightarrow 2$ tree-level amplitudes of massive particles with spin $s\\leq 1$ are calculated in (super)gravity using on-shell methods and the double copy. These are assembled and decomposed into (super)amplitudes with varying amounts of supersymmetry. Finally, I study scattering of BPS gravitinos with unbroken $\\mathcal{N}\\geq 4$ supergravity and show that consistent factorisation leads to the full reconstruction of the super-Higgs mechanism. This argument completely determines the perturbative structure of all $\\mathcal{N}=4$ Minkowski vacua of gauged maximal supergravity. Gravitinos in theories not admitting a super-Higgs mechanism are ruled-out.", "url": "https://arxiv.org/abs/2608.04080", "type": "理论", "summary": "1. 该工作从2→2振幅的复因子化一致性出发，证明无质量螺旋度3/2粒子必为超引力中的引力微子，并系统推导了有质量超多重态的结构与耦合。\n2. 其技术核心在于用壳上方法和双拷贝构造自旋s≤1的有质量粒子树级振幅，并揭示BPS矢量玻色子的耦合须服从李代数结构常数或广义Chern-Simons项，且引力光子被拉入该李代数。\n3. 对N≥4超引力的BPS引力微子散射，一致因子化重构出超-Higgs机制，从而完全确定规范最大超引力所有N=4 Minkowski真空的微扰结构，并排除无超-Higgs机制的引力微子理论。", "summary_source": "deepseek", "authors": [{"name": "Timothy Trott"}], "featured_authors": [{"name": "Timothy Trott"}], "author_count": 1}, {"id": "2608.04097", "category": "hep-th", "title": "A new perspective on non-commutative deformations of field and gauge theories", "abstract": "We construct non-commutative deformations of field and gauge theories based on star-products implemented by Drinfel'd twists. We are able to encompass a large family of twists, including those built out of conformal symmetries and supersymmetries. The main idea behind our construction is to work with twists constructed from symmetries of the undeformed theory, that are realised as active symmetry transformations. We argue that our construction amounts to a reformulation of known deformations of
