  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2606.19418", "category": "cond-mat", "title": "Sequential replica exchange with solute tempering for atomistic modeling of supramolecular polymer structures", "abstract": "Predicting detailed atomistic structures of self-assembling systems remains a challenge for all-atom molecular dynamics simulations. Replica exchange with solute tempering (REST) has been used to study those systems by accelerating all monomers in a global and uniform manner. While such a global approach can in principle predict any morphology of the system, it has computational drawbacks such as inefficient replica traversal due to order-disorder transitions and the growing number of replicas with system size. To address these issues, here we propose an alternative, stepwise construction approach to modeling supramolecular polymers under the assumption of one-dimensional polymerization. Specifically, we generate polymer structures by adding new monomers one by one to the system and applying REST to the new monomers to find their optimal binding positions based on an energy-based scoring function. The monomer addition and enhanced sampling are repeated sequentially until a polymer of desired length is obtained. We test the above procedure using a model supramolecular polymer in explicit solvent, and show that it can generate a polymer structure with characteristic H-bonding patterns at reduced computational costs, while also improving the efficiency of replica traversal significantly. We thus expect that the sequential REST will be useful for modeling supramolecular polymers, particularly for cases where global REST simulations are too demanding computationally.", "url": "https://arxiv.org/abs/2606.19418", "type": "理论+数值", "summary": "1. 该工作提出顺序性溶质升温副本交换方法，通过逐个添加单体并应用增强采样，逐步构建超分子聚合物的原子结构。\n2. 其卖点是利用局部增强采样和能量评分函数，在显著降低计算成本的同时改善副本遍历效率。\n3. 这为全局副本交换模拟计算量过大的超分子聚合物体系提供了实用的建模策略。", "summary_source": "deepseek", "authors": [{"name": "Hadi H. Arefi"}, {"name": "Takeshi Yamamoto"}], "featured_authors": [{"name": "Hadi H. Arefi"}, {"name": "Takeshi Yamamoto"}], "author_count": 2}, {"id": "2606.19421", "category": "cond-mat", "title": "Electrical magnetochiral anisotropy in Rashba superconductors", "abstract": "We theoretically investigate the role of higher-order Lifshitz invariants in nonreciprocal charge transport in two-dimensional noncentrosymmetric superconductors with Rashba spin-orbit coupling. In the superconducting state, these symmetry-allowed terms give rise to critical-current nonreciprocity, while in the normal state near the superconducting transition they generate a pronounced magnetochiral anisotropy. Using symmetry-constrained group-theoretical methods, we systematically construct the allowed Lifshitz invariants and derive the corresponding vector structure of the nonreciprocal current. To describe nonlinear transport in the fluctuation regime, we apply a generalized time-dependent Ginzburg-Landau theory that incorporates both the Aslamazov-Larkin contribution from fluctuation-induced Cooper pairs and the Maki-Thompson contribution associated with quantum interference in the Cooper channel. We further analyze the effects of disorder scattering and dephasing on the resulting nonreciprocal response.", "url": "https://arxiv.org/abs/2606.19421", "type": "理论+数值", "summary": "1. 该工作在理论上研究了Rashba超导体中高阶Lifshitz不变量驱动的电学磁手征各向异性，涵盖超导态临界电流非互易性与正常态涨落区的磁手征效应。\n2. 核心技术在于利用群论限制构造允许的Lifshitz不变量，并结合推广的含时Ginzburg-Landau理论，同时计入Aslamazov-Larkin与Maki-Thompson贡献，系统分析无序散射的影响。\n3. 这为非中心对称超导体中非互易电荷输运的机制、无序与退相干效应的定量理解提供了理论框架，有望指导相关实验设计与材料优化。", "summary_source": "deepseek", "authors": [{"name": "Joaquim Telles de Miranda"}, {"name": "Maxim Khodas"}, {"name": "Alex Levchenko"}], "featured_authors": [{"name": "Joaquim Telles de Miranda"}, {"name": "Maxim Khodas"}, {"name": "Alex Levchenko"}], "author_count": 3}, {"id": "2606.19426", "category": "cond-mat", "title": "Three-dimensional Foliated Fractional Quantum Hall Phases", "abstract": "Foliated topological orders in three dimensions are layered systems in which anyons are free to move within a layer but cannot hop between them. A simple model with such a phase is a stack of decoupled two-dimensional electron gases in a strong magnetic field, each in the same fractional quantum Hall state. By focusing on the case of filling $\\nu=1/3$ of the lowest Landau level in each layer, we show that (i) the limit of decoupled Laughlin states is stable upon introducing interlayer interactions and (ii) the system can enter a spontaneously layer-trimerized foliated non-Abelian Fibonacci phase. We support our claims by numerical exact diagonalization of up to 10 layers as well as perturbative analytical calculations. Specifically, we show that the foliated Fibonacci phase exists in the 9-layer system with pseudopotential interactions within and between neighboring layers. We identify the phase via quasihole counting and by calculating the overlap with a model wave function which we derive from the associated conformal field theory. Our numerical results suggest the possibility of realizing these phases in layered van der Waals crystals in strong magnetic fields, as well as in multilayer heterostructures.", "url": "https://arxiv.org/abs/2606.19426", "type": "理论+数值", "summary": "1. 该工作通过多层分数量子霍尔系统的数值精确对角化与微扰分析，证明了退耦合Laughlin态的稳定性并发现了自发层三聚化的叶状非阿贝尔Fibonacci相。\n2. 其核心在于揭示层间赝势相互作用驱动系统进入叶状拓扑序，并通过准空穴计数与共形场论模型波函数重叠实现相的严格识别。\n3. 这为在多层范德华晶体与异质结中实现三维叶状分数量子霍尔相提供了明确的理论候选体系与可验证的数值证据。", "summary_source": "deepseek", "authors": [{"name": "Sahana Das"}, {"name": "Navketan Batra"}, {"name": "Andrea Kouta Dagnino"}, {"name": "Dan Mao"}, {"name": "Nicolas Regnault"}, {"name": "Glenn Wagner"}, {"name": "Titus Neupert"}], "featured_authors": [{"name": "Sahana Das"}, {"name": "Navketan Batra"}, {"name": "Andrea Kouta Dagnino"}, {"name": "Nicolas Regnault"}, {"name": "Glenn Wagner"}, {"name": "Titus Neupert"}], "author_count": 7}, {"id": "2606.19431", "category": "cond-mat", "title": "Odd fluids from chiral cellular automata", "abstract": "Cellular automata are discrete dynamical systems defined on a lattice, in which each site carries a finite set of states that evolve in time according to local deterministic rules. An important application of cellular automata is in lattice gas models of fluids, where the cellular automaton framework provides a particle-based microscopic description of hydrodynamic behavior. The macroscopic fluid equations emerge after coarse-graining over many lattice sites and time steps, offering a bottom-up route to hydrodynamics. A celebrated example is the Frisch-Hasslacher-Pomeau (FHP) model, an automaton defined on a two-dimensional triangular lattice that yields the two-dimensional Navier-Stokes equations upon coarse-graining. In this work, we construct a parity-breaking generalization of the FHP model through two modifications: introducing chiral two-body collision rules and systematically rotating particle velocities to mimic the effect of a background magnetic field. We show that this automaton yields a hydrodynamic model with odd viscosity, a transverse transport coefficient that is a hallmark of odd fluids. We verify the analytical transport coefficients using Poiseuille-flow simulations of the chiral FHP automaton. Our results demonstrate that the chiral automaton introduced here provides a bridge between microscopic parity-breaking scattering processes and macroscopic odd-fluid hydrodynamics.", "url": "https://arxiv.org/abs/2606.19431", "type": "理论+数值", "summary": "1. 该工作通过引入手性二体碰撞规则与系统旋转粒子速度，构造了FHP模型的宇称破缺推广，实现从手性细胞自动机到奇流体的宏观流体动力学。\n2. 其核心在于从微观手性散射规则出发，经粗粒化推导出奇粘滞系数，并用泊肃叶流模拟验证了该横向输运系数。\n3. 这为通过离散晶格自动机桥接微观宇称破缺过程与宏观奇流体行为提供了明确的构造性范例。", "summary_source": "deepseek", "authors": [{"name": "Andrew A. Allocca"}, {"name": "Shiva Heidari"}, {"name": "Thomas Iadecola"}, {"name": "Armin Rahmani"}, {"name": "Pouyan Ghaemi"}, {"name": "Sriram Ganeshan"}], "featured_authors": [{"name": "Andrew A. Allocca"}, {"name": "Shiva Heidari"}, {"name": "Thomas Iadecola"}, {"name": "Armin Rahmani"}, {"name": "Pouyan Ghaemi"}, {"name": "Sriram Ganeshan"}], "author_count": 6}, {"id": "2606.19437", "category": "cond-mat", "title": "Many-Body Protection of Topological Edge Memory in Strong Interacting Quenches", "abstract": "Quantum quenches drive edge states far from equilibrium, yet whether the memory of a topological initial state survives in a non-integrable, interacting system has remained largely unexplored. We study this question in the bond-alternating XXZ chain -- an interacting Su--Schrieffer--Heeger model hosting symmetry-protected topological edge modes with markedly enhanced boundary magnetization -- and analyze quenches across all combinations of single-particle and many-body initial and final Hamiltonians. The results organize by a single distinction as we rigorously establish in this work: whether the post-quench Hamiltonian is free or genuinely interacting. For a free post-quench Hamiltonian, the dynamics is solved exactly by a correlation-matrix approach; the boundary-mode return amplitude decays as $t^{-3/2}$, and initial interactions enter only through a dressed one-body density matrix. For a genuinely interacting post-quench Hamiltonian, finite-time stability bounds prove that away from local resonances the first-dimer magnetization remains stable on time windows growing as arbitrarily large powers of the inverse inter-dimer coupling. Matrix product state simulations across all four protocols show that interactions in the final Hamiltonian markedly extend finite-time boundary memory -- with local suppression near the isotropic $SU(2)$ point -- revealing a many-body protection mechanism in a non-integrable system where scrambling would otherwise wash out initial-state memory fast.", "url": "https://arxiv.org/abs/2606.19437", "type": "理论+数值", "summary": "1. 论文通过键交替XXZ链（相互作用SSH模型）的量子淬火动力学，严格分析拓扑边缘记忆在强相互作用非可积系统中的存活问题，涵盖单粒子与多体初末哈密顿量的四种组合。\n2. 关键区分在于淬火后哈密顿量是否真正相互作用：自由情形下边界模返回振幅精确衰减为t^{-3/2}且初始相互作用仅修饰单体密度矩阵；相互作用情形下有限时间稳定性界保证远离局部共振时第一二聚体磁化稳定时间可随反二聚体耦合逆幂任意高次幂增长，MPS模拟确认此多体保护且在SU(2)点附近局部抑制。\n3. 该工作揭示非可积系统中拓扑记忆的相互作用增强保护通道，为在强关联拓扑量子平台实现长时间边界信息保持提供了理论基础与数值依据。", "summary_source": "deepseek", "authors": [{"name": "Yuxiao Hang"}, {"name": "Stephan Haas"}, {"name": "Rishabh Jha"}], "featured_authors": [{"name": "Yuxiao Hang"}, {"name": "Stephan Haas"}, {"name": "Rishabh Jha"}], "author_count": 3}, {"id": "2606.19465", "category": "cond-mat", "title": "Exact operator dynamics in Lindbladian Wess-Zumino-Witten conformal field theories", "abstract": "Understanding the time evolution of physical observables in open quantum many-body systems coupled to external environments is a natural and difficult problem, and exact results are still rare. In this work, we study this problem for Wess-Zumino-Witten (WZW) conformal field theories with Lindblad jump operators linear in Kac-Moody current modes. We investigate the exact operator dynamics generated by these Lindbladians, identifying classes of current operators whose Heisenberg equations close and can therefore be solved analytically using the underlying current algebra. In Abelian $U(1)_k$ WZW theories, this closure of operator dynamics holds for arbitrary settings of jump rates and includes exactly tractable cooling dynamics. In contrast, for non-Abelian WZW theories, exact closure occurs only for symmetric current-mode dissipation, where upward and downward current-mode transitions occur with equal rates, and even then it leads to a simple closed evolution only for a single current operator. Generic imbalances, including those needed for cooling, produce additional non-Abelian terms and prevent closure of the opeartor dynamics. Consequently, the current algebra gives rise to a broad family of exactly solvable dissipative dynamics in the Abelian setting, whereas in the non-Abelian case it singles out only a special exactly solvable dynamics corresponding to an infinite-temperature bath.", "url": "https://arxiv.org/abs/2606.19465", "type": "理论+数值", "summary": "1. 该工作研究了Lindbladian Wess-Zumino-Witten共形场论中算符的精确时间演化，通过分析Kac-Moody流模线性跳变算符生成的海森堡方程封闭性，识别可解析求解的流算符类别。\n2. 其核心卖点在于揭示阿贝尔U(1)_k理论中算符动力学对任意跳变率均封闭，允许精确处理冷却过程，而非阿贝尔理论仅在对称流模耗散下对单个流算符封闭，失衡时因非阿贝尔项导致封闭性破坏。\n3. 这为开放量子多体系统提供了阿贝尔情形下一族可精确求解的耗散动力学，与非阿贝尔情形中唯一可解的无温度浴动力学形成对比，启发了对对称性约束下可积开系统的理解。", "summary_source": "deepseek", "authors": [{"name": "Qicheng Tang"}, {"name": "Ruhanshi Barad"}, {"name": "Xueda Wen"}], "featured_authors": [{"name": "Qicheng Tang"}, {"name": "Ruhanshi Barad"}, {"name": "Xueda Wen"}], "author_count": 3}, {"id": "2606.19571", "category": "cond-mat", "title": "Optical spin injection in graphane and fluorographene", "abstract": "We theoretically investigate the optical spin-injection response in different stoichiometric configurations of graphane and fluorographene using density functional theory. Our goal is to determine which configuration yields the strongest degree of spin polarization. The results show that the fluorographene zigzag configuration yields the best degree of spin polarization response (${\\cal DSP}^{\\mathrm{z}}$), with 98\\% spin polarized electrons at the band edge and over a wide range of excitation photon energies. In contrast, other graphane and fluorographene configurations achieve a ${\\cal DSP}^{\\mathrm{z}}$ of roughly 83--100\\%, but only within a limited photon-excitation energy range. In structures with low spin-orbit coupling, the degree of spin polarization is close to 100\\% over a wide range of photon energies. For higher spin-orbit coupling, this strong response appears, but only in a narrow photon energy region. Additionally, under the band-resolved decomposition scheme, the contributions of different band-to-band transitions to the ${\\cal DSP}^{\\mathrm{z}}$ spectrum are identified by summing only the selected valence and conduction bands. Our findings show that almost the entire ${\\cal DSP}^{\\mathrm{z}}$ spectrum of the fluorographene zigzag configuration comes from transitions that involve only the top valence band, which is a mixture of C--p and F--p states.", "url": "https://arxiv.org/abs/2606.19571", "type": "理论+数值", "summary": "1. 该工作利用密度泛函理论计算了不同化学计量构型的石墨烷与氟化石墨烯中的光致自旋注入响应。\n2. 其核心发现是氟化石墨烯锯齿构型在宽光子能量范围内实现98%的自旋极化，且该响应主要源自价带顶C-p与F-p杂化态的带间跃迁。\n3. 这为在弱自旋轨道耦合体系中实现宽能域近100%自旋极化提供了设计思路，有望推动二维材料自旋光电子学发展。", "summary_source": "deepseek", "authors": [{"name": "Angélica Marina López-Martínez"}, {"name": "César Castillo-Quevedo"}, {"name": "Cesar Camas-Flores"}, {"name": "Analila Luna-Valenzuela"}, {"name": "Jose Luis Cabellos"}], "featured_authors": [{"name": "Angélica Marina López-Martínez"}, {"name": "César Castillo-Quevedo"}, {"name": "Cesar Camas-Flores"}, {"name": "Analila Luna-Valenzuela"}, {"name": "Jose Luis Cabellos"}], "author_count": 5}, {"id": "2606.19582", "category": "cond-mat", "title": "Deposition and Growth of the AlCoCuFeNi High-Entropy Alloy Thin Film: Molecular Dynamics Simulation", "abstract": "The growth of a thin film of a high-entropy AlCoCuFeNi alloy on a silicon (100) substrate was studied using molecular dynamics modeling. The simulation was carried out using the embedded atom model to describe the interactions among Al, Co, Cu, Ni, and Fe atoms. The interaction between Al, Co, Cu, Fe, Ni atoms and the Si substrate was modeled using the Lennard-Jones potential, while the interaction between silicon atoms was described using the Stillinger-Weber potential. The total simulation time was 50 ns. It was found that small clusters were formed at the first stage of deposition and that crystallization started after approximately 5 ns of simulation, when the characteristic cluster size was about 2 nm. At the end of the simulation, after 50 ns of modeling, the simulated film contained face-centered cubic, body-centered cubic, hexagonal close-packed, and amorphous phases. Analysis of the radial distribution function made it possible to determine nearest-neighbor distances and estimate the lattice parameters of these phases.", "url": "https://arxiv.org/abs/2606.19582", "type": "理论+数值", "summary": "1. 该工作利用分子动力学模拟研究了AlCoCuFeNi高熵合金薄膜在硅(100)衬底上的沉积与生长过程。\n2. 其技术要点在于采用嵌入原子模型描述合金原子间相互作用，并结合Lennard-Jones与Stillinger-Weber势处理薄膜-衬底及衬底内部作用，成功再现了初始成核、约5 ns时晶化及最终多相共存微结构。\n3. 这为理解高熵合金薄膜的早期生长动力学及相形成机制提供了原子尺度的直观信息，并对后续多主元合金薄膜的实验调控具有参考价值。", "summary_source": "deepseek", "authors": [{"name": "Oleksandr I. Kushnerov"}, {"name": "Valerij F. Bashev"}, {"name": "Sergey I. Ryabtsev"}], "featured_authors": [{"name": "Oleksandr I. Kushnerov"}, {"name": "Valerij F. Bashev"}, {"name": "Sergey I. Ryabtsev"}], "author_count": 3}, {"id": "2606.19740", "category": "cond-mat", "title": "Enhanced electronic correlations and altermagnetic ground state of two-dimensional CsCr3Sb5 monolayers", "abstract": "Recently, layered corrected kagome metal CsCr3Sb5 have garnered significant attention attributed to its flat bands near the Fermi level (EF) and altermagnetic ground state [ Yi Liu et al., Nature 632, 1032 (2024)]. However, the van Hove singularities (vHSs) in bulk CsCr3Sb5 are far away from the EF, while an effective modulation of VHS toward the EF is essential for exploring intriguing electron transport properties. In this work, using first-principles calculations, we investigate electronic structures of two-dimensional (2D) Cr3Sb5 and CsCr3Sb5 monolayers which may be mechanically exfoliated from bulk materials. Notably, it is revealed that both flat bands and vHSs simultaneously reside in close proximity to the EF in Cr3Sb5 monolayer, signifying enhanced electronic correlations. Importantly, a tensile strain further shifts the incipient flat bands and vHSs of two monolayers simultaneously to the vicinity of the EF, suggesting strain tunable electronic correlations and concomitant quantum effects. Furthermore, altermagnetic ground state is also revealed due to retained mirror symmetry between two sublattices in these two monolayers. Thus, this work advances understanding and modulations of electronic properties of 2D CsCr3Sb5 monolayers, strengthening their great potential for exploring unconventional quantum phenomena and altermagnetism.", "url": "https://arxiv.org/abs/2606.19740", "type": "理论+数值", "summary": "1. 通过第一性原理计算，研究了可从块体剥离的二维Cr₃Sb₅和CsCr₃Sb₅单层的电子结构与交替磁基态。\n2. 关键发现是平带与van Hove奇点同时紧邻费米能级，且拉伸应变可同步调控二者位置，从而增强电子关联。\n3. 这为利用二维交替磁单层探索非常规量子现象及应变可调谐磁电效应提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Z. H. Guan"}, {"name": "Z. L. Peng"}, {"name": "W. Z. Zhuo"}, {"name": "G. Tian"}, {"name": "Z. P. Hou"}, {"name": "D. Y. Chen"}, {"name": "Z. Fan"}, {"name": "X. B. Lu"}, {"name": "X. S. Gao"}, {"name": "M. H. Qin"}, {"name": "J. M. Liu"}], "featured_authors": [{"name": "Z. H. Guan"}, {"name": "Z. L. Peng"}, {"name": "W. Z. Zhuo"}, {"name": "X. S. Gao"}, {"name": "M. H. Qin"}, {"name": "J. M. Liu"}], "author_count": 11}, {"id": "2606.19780", "category": "cond-mat", "title": "Thickness-Dependent Interlayer Coupling and Semiconductor-to-Semimetal Crossover in Arsenene Multilayers", "abstract": "Interlayer interactions in layered materials are often assumed to transfer from the bilayer to the bulk, but this assumption can fail when chemically active out-of-plane orbitals participate in bonding. We combine diffusion quantum Monte Carlo (DMC) and density functional theory (DFT) to determine how interlayer coupling evolves in arsenene multilayers. DMC shows that bulk gray arsenic is compact, whereas the corresponding few-layer structures remain at substantially larger interlayer separations despite sharing the same nominal A$_{1}$B$_{-1}$ adjacent-layer registry. Registry alone therefore does not determine the bonding regime; thickness and coordination reshape the interlayer interaction. Among the tested functionals, SCAN+rVV10 most closely reproduces DMC equilibrium separations and stacking energetics. Using the DMC-benchmarked SCAN+rVV10 calculations, we predict a thickness-driven stacking sequence from A$_{1}$A$_{1}$ to A$_{1}$B$_{1}$ and finally bulk-like A$_{1}$B$_{-1}$. The structural crossover coincides with a stacking-dependent DFT band-gap collapse driven by enhanced interlayer As p$_{z}$ hybridization.", "url": "https://arxiv.org/abs/2606.19780", "type": "理论+数值", "summary": "1. 该工作结合扩散量子蒙特卡洛与密度泛函理论，定量刻画了砷烯多层膜中厚度诱导的层间耦合演化与半导体–半金属交叉微观过程。\n2. 其核心在于发现层间注册无法单独决定键合状态，厚度与配位通过增强As p_z杂化驱动堆叠序列从A_1A_1经A_1B_1向体相A_1B_{-1}演变并导致带隙坍塌，且SCAN+rVV10泛函最优复现DMC平衡结构与能量。\n3. 这否定了少层与体相间简单外推的常规假设，为面外轨道参与成键的低维体系提供了厚度调控电子相变的定量基准与可扩展物理框架。", "summary_source": "deepseek", "authors": [{"name": "Jeonghwan Ahn"}, {"name": "Seoung-Hun Kang"}, {"name": "Jaron T. Krogel"}], "featured_authors": [{"name": "Jeonghwan Ahn"}, {"name": "Seoung-Hun Kang"}, {"name": "Jaron T. Krogel"}], "author_count": 3}, {"id": "2606.19977", "category": "cond-mat", "title": "Interplay of Altermagnetism and Coupled Quasi-Altermagnetic states in Sliding Two-dimensional Square Lattice", "abstract": "The emergence of non-relativistic spin splitting (NRSS) in altermagnetic systems has introduced a new paradigm in antiferromagnets with vanishing net magnetization. Although sliding-induced valley-polarized phases have recently been demonstrated in two-dimensional altermagnets, the observed valley-polarized state represents only a partial manifestation of altermagnetism, and a comprehensive classification based on spinsplitting characteristics remains lacking. Here, using first-principles calculations, general stacking theory, and spin-Laue symmetry analysis, we propose a coupled quasialtermagnetic state representing a distinct subclass of altermagnetism, in which reversible type-IV NRSS is controlled through interlayer sliding. Accordingly, the sliding-induced phases are classified into two categories: altermagnetic and quasi-altermagnetic states. We establish a direct correspondence between reciprocal-space spin splitting and real-space switching between the two quasi-altermagnetic states. Importantly, the spin-polarized bands in these states remain spin split at {\\Gamma} point even in the absence of spin-orbit coupling (SOC), distinguishing them within the proposed classification framework. To demonstrate the interplay between altermagnetic and quasi-altermagnetic states, we investigate the two-dimensional Lieb-lattice material Mn2WS4 and its Janus derivative Mn2WS2Se2, analysing how changes in the local environment influence the different magnetic phases. Importantly, the underlying mechanism is broadly applicable to a wide class of twodimensional square-lattice systems. We further investigate the effects of SOC, focusing on spin texture and transport signatures in coupled quasi-altermagnetic states.", "url": "https://arxiv.org/abs/2606.19977", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算与对称性分析，在滑动二维方格体系中提出了耦合准交变磁性态，并将滑动诱导相分为交变磁性与准交变磁性两类。\n2. 其核心在于发现层间滑动可逆控制IV型非相对论自旋分裂，且在无自旋轨道耦合时Γ点仍保持自旋极化能带分裂，区别于传统分类。\n3. 这为理解二维方格磁体中滑动调控的交变磁性行为提供了通用框架，并启发基于磁性相的磁电耦合与自旋输运研究。", "summary_source": "deepseek", "authors": [{"name": "Bhautik R Dhori"}, {"name": "Deepak Upadhyay"}, {"name": "Prafulla K Jha"}], "featured_authors": [{"name": "Bhautik R Dhori"}, {"name": "Deepak Upadhyay"}, {"name": "Prafulla K Jha"}], "author_count": 3}, {"id": "2606.20020", "category": "cond-mat", "title": "Effects of interaction range on the mean-field dynamics of Bose polarons", "abstract": "We consider the three-dimensional Bose polaron problem in the regime of finite range interactions and competing length scales. Working in the reference frame of the impurity, we study both static and out of equilibrium properties of the system, in particular the transfer of momentum between the impurity and the host gas. We find that relaxation dynamics can occur via damped oscillations of the impurity velocity with simple dependence on the interaction strength. Furthermore, the equilibration process is sensitive to the type of the impurity-bath interaction. Specifically, interatomic forces describing ion-atom systems lead to much longer timescales and more pronounced oscillations in the strong coupling regime with respect to local interaction potentials. We also find that the effective masses can differ by a large amount between the two scenarios, even if the number of atoms in the polaron cloud remains similar for both cases.", "url": "https://arxiv.org/abs/2606.20020", "type": "理论", "summary": "1. 该工作研究了有限程相互作用和竞争长度尺度下三维玻色极化子的平均场动力学，包括静态与弛豫过程。\n2. 其卖点在于揭示了杂质动量弛豫通过阻尼振荡实现，且离子-原子型相互作用在强耦合区导致更长弛豫时间和更显著振荡，与局域势情形形成对比。\n3. 这为理解相互作用类型对极化子非平衡弛豫及有效质量差异的影响提供了明确物理启发。", "summary_source": "deepseek", "authors": [{"name": "Piotr Wysocki"}, {"name": "Ubaldo Cavazos Olivas"}, {"name": "Marek Tylutki"}, {"name": "Krzysztof Jachymski"}], "featured_authors": [{"name": "Piotr Wysocki"}, {"name": "Ubaldo Cavazos Olivas"}, {"name": "Marek Tylutki"}, {"name": "Krzysztof Jachymski"}], "author_count": 4}, {"id": "2606.20040", "category": "cond-mat", "title": "Electrostatic effects in nano-reactor-confined charge regulated macroions", "abstract": "We formulate a thermodynamic model of a nano-reactor containing charge-regulated macroions within an electrolyte-permeable enclosure. The model is then formalized within the Poisson-Boltzmann electrostatics augmented by the consistent inclusion of the charge dissociation of molecular groups residing on the surface of the entrapped macroions via charge regulation formalism. By solving the basic equilibrium equations in the linearized Debye-Hückel type approximation, we analyze the salient features of the inhomogeneous electrolyte distribution and macroion charge. We found that the surface charge asymmetry/symmetry of the macroions strongly affects the spatial profile of electrostatic potential. The effective screening length shows the non-monotonic behavior, arising from the complex interplay between the bathing external solution and macroion effective charges, which govern charge regulation equilibria. The total pressure at the nano-reactor enclosure boundary decreases monotonically as the enclosure radius and the ionic bulk salt concentration increase. Also, the resulting pressure is strongly influenced by the surface charge densities of the nano-reactor and the number of confined macroions.", "url": "https://arxiv.org/abs/2606.20040", "type": "理论", "summary": "1. 该工作构建了一个热力学模型，描述电解质可渗透外壳的纳米反应器内电荷调控大离子的平衡行为，并基于Poisson-Boltzmann电静力学和电荷调节形式进行形式化。\n2. 通过线性化Debye-Hückel近似求解，揭示了大离子表面电荷对称性显著影响静电势空间分布，且有效屏蔽长度因外部溶液与大离子有效电荷的复杂耦合呈非单调行为。\n3. 发现总压力随外壳半径及体相盐浓度单调递减，并受反应器表面电荷密度和受限大离子数量强烈调控，为设计可控纳米反应器提供了理论基石。", "summary_source": "deepseek", "authors": [{"name": "Manit Klawtanong"}, {"name": "Petch Khunpetch"}, {"name": "Huaqiong Li"}, {"name": "Shigeyuki Komura"}], "featured_authors": [{"name": "Manit Klawtanong"}, {"name": "Petch Khunpetch"}, {"name": "Huaqiong Li"}, {"name": "Shigeyuki Komura"}], "author_count": 4}, {"id": "2606.20049", "category": "cond-mat", "title": "Constraint-Limited Tube Orientation of Entangled Polymers in Oscillatory Shear Deformation", "abstract": "We develop a molecularly motivated description of the nonlinear index (NLI) in oscillatory shear deformation of entangled polymers. The central assumption is that the shear component of the tube-orientation tensor cannot grow without bound. Convective constraint release (CCR), chain stretch, and tube dilation progressively reduce the number and lifetime of orientational constraints, but the maximum shear alignment of a tube segment is geometrically limited by $S_{xy}\\leq 1/2$. This motivates a constraint-limited orientation closure in which the NLI first grows approximately with strain amplitude and then approaches the limiting value $\\mathrm{NLI}_{\\max}=3$ asymptotically rather than through an artificial cutoff. The same framework yields a molecular expression for the characteristic half-saturation strain $\\gamma_s$, defined by $\\mathrm{NLI}(\\gamma_s)=3/2$, in terms of the entanglement number, oscillation frequency, and a critical number of remaining orientational constraints. We further derive architecture-dependent expressions for the nonlinear onset strain $\\gamma_c$ for linear, sparsely long-chain-branched, and more regularly branched polymers. The resulting framework provides a compact bridge between Fourier harmonic analysis, CCR-based tube dynamics, and the progressive loss of orientational memory in highly deformed entangled polymer liquids.", "url": "https://arxiv.org/abs/2606.20049", "type": "理论", "summary": "1. 该工作建立了缠结高分子在振荡剪切下非线性指数（NLI）的分子理论，基于管取向张量剪切分量的几何上限。\n2. 核心卖点是提出约束限制取向闭合，使NLI渐近逼近最大值3而非依赖人工截断，并导出半饱和应变与分子参数的解析关系。\n3. 这为连接傅里叶谐波分析与基于CCR的管动力学提供了紧凑理论桥梁，启发对缠结液体取向记忆损失的定量描述。", "summary_source": "deepseek", "authors": [{"name": "Dario Nichetti"}, {"name": "Alessio Zaccone"}], "featured_authors": [{"name": "Dario Nichetti"}, {"name": "Alessio Zaccone"}], "author_count": 2}, {"id": "2606.20070", "category": "cond-mat", "title": "\\textit{E.\\ coli} bacterium near corrugated surfaces: near-suface swimming, escape, and hydrodynamic trapping}", "abstract": "Bacteria often swim in complex environments where surfaces are ubiquitous and rarely flat. Surface topography and curvature can strongly affect bacterial motility, with important consequences for surface exploration, adhesion, and biofilm formation. Here, we investigate the swimming of a non-tumbling \\textit{Escherichia coli} bacterium near an undulating no-slip surface using hydrodynamic simulations of a detailed model bacterium. The latter is described by a rigid spherocylindrical cell body and flexible flagella modeled with the Kirchhoff rod theory, while the surrounding fluid is simulated using the method of multi-particle collision dynamics. At low curvatures of the sinusoidal surface modulations, the bacterium exhibits persistent near-surface swimming and clockwise trajectories, consistent with the known behavior near flat no-slip walls. As the curvature increases, bacteria swimming toward a ridge can escape from the surface, which we use to estimate a critical curvature where surface detachment is more likely. At larger curvatures, we find that the surface geometry promotes oscillatory swimming along the groove direction, which reduces escape opportunities and, therefore, enhances bacterial trapping. Indeed, the confinement around the groove reverses the swimming of the bacterium from clockwise to counter-clockwise, as we demonstrate by two minimal models. Thus our work highlights the importance of the three-dimensional surface topography in bacterial surface exploration.", "url": "https://arxiv.org/abs/2606.20070", "type": "理论+数值", "summary": "1. 该工作通过多粒子碰撞动力学模拟，研究了非翻滚大肠杆菌在正弦波纹无滑移表面附近的游动、逃逸与流体动力捕获行为。\n2. 其核心发现是表面曲率调控游动模式：低曲率时保持近壁顺时针轨迹，高曲率时沿沟槽振荡游动并逆时针反转，从而增强捕获。\n3. 这揭示了三维表面形貌对细菌表面探索的关键影响，为理解生物膜形成与微纳机器人导航提供了物理机制启发。", "summary_source": "deepseek", "authors": [{"name": "Pierre Martin"}, {"name": "Gonçalo C. Antunes"}, {"name": "Holger Stark"}], "featured_authors": [{"name": "Pierre Martin"}, {"name": "Gonçalo C. Antunes"}, {"name": "Holger Stark"}], "author_count": 3}, {"id": "2606.20168", "category": "cond-mat", "title": "Norms, overlaps and Yangian descendants for the Haldane--Shastry spin chain", "abstract": "The Haldane-Shastry spin chain is a prototypical integrable model with long-range interactions, notable for hosting quasiparticles with fractional statistics and serving as a discrete analogue of a conformal field theory. Its remarkable simplicity is closely tied to a full Yangian spin symmetry. While the highest-weight states for this symmetry are known explicitly, a systematic treatment of the descendant states, needed for the computation of various physical quantities, has remained incomplete. In this work, we provide a detailed construction of these descendants in terms of the algebraic Bethe ansatz following recent work of Ferrando et al. In the limit of extreme twist, it includes the Gelfand-Tsetlin basis. As an application, we derive product and determinant formulae for norms and overlaps of these states.", "url": "https://arxiv.org/abs/2606.20168", "type": "理论", "summary": "1. 该工作对Haldane-Shastry自旋链的Yangian对称性后代态进行了系统构造，并导出了其范数与重叠的乘积和行列式公式。\n2. 主要技术在于利用代数Bethe ansatz完整描述后代态，并在极端扭曲极限下将其简化为Gelfand-Tsetlin基。\n3. 所得解析公式为研究该模型中分数统计及共形场论类比的可积性提供了可直接应用的计算工具。", "summary_source": "deepseek", "authors": [{"name": "Yunfeng Jiang"}, {"name": "Jules Lamers"}, {"name": "Yuan Miao"}], "featured_authors": [{"name": "Yunfeng Jiang"}, {"name": "Jules Lamers"}, {"name": "Yuan Miao"}], "author_count": 3}, {"id": "2606.20182", "category": "cond-mat", "title": "Anomalous Transverse Response in Nodal line Semimetal Mn$_{3}$SnC", "abstract": "The interplay of topological surface states and magnetism gives rise to unconventional transport behaviors such as the anomalous Hall effect (AHE) and anomalous Nernst effect (ANE). Antiperovskites such as Mn$3$SnC, which are nodal-line semimetals and exhibit concurrent antiferromagnetic (AFM) and ferromagnetic (FM) ordering, provide a fertile ground for anomalous transport phenomena. Here, we report that the anomalous transport (AHE and ANE) in this compound is predominantly governed by the intrinsic Berry-curvature effect. We establish a unified relationship between the AHE and ANE using Mott's relation. Electron scattering by both AFM and FM magnons is manifested in the anomalous Nernst signal. The ratio of the anomalous Nernst conductivity to the anomalous Hall conductivity, $|\\alpha^A{xy}|/\\sigma^A_{xy}$, constitutes a sizable fraction of $k_B/e$, indicating a strong Berry-curvature contribution to the ANE.", "url": "https://arxiv.org/abs/2606.20182", "type": "理论", "summary": "1. 本文报道了反钙钛矿节线半金属Mn₃SnC中反常霍尔效应与反常能斯特效应主要由本征贝里曲率主导。\n2. 通过Mott关系建立了两种反常输运的统一关联，并在反常能斯特信号中观测到反铁磁与铁磁磁子散射的贡献。\n3. 反常能斯特电导与反常霍尔电导之比可达k_B/e量级，表明贝里曲率对反常能斯特效应具有显著贡献。", "summary_source": "deepseek", "authors": [{"name": "Sunil Gangwar"}, {"name": "C. S. Yadav"}], "featured_authors": [{"name": "Sunil Gangwar"}, {"name": "C. S. Yadav"}], "author_count": 2}, {"id": "2606.20190", "category": "cond-mat", "title": "Independent Control of Transport and Order in a Ratcheted Colloidal Suspension", "abstract": "We study directed transport in a two-dimensional suspension of repulsively interacting colloids driven by a stochastic asymmetric piecewise-linear flashing ratchet using large-scale molecular dynamics simulations. The driving frequency and the ratchet asymmetry offer two independent ways of controlling the particle current, but they affect the suspension differently. At fixed asymmetry, the current shows a resonance with ratcheting frequency that is set by the collective relaxation dynamics of the interacting particles. The resulting increase in transport is accompanied by defect-mediated structural changes, showing density-dependent hexatic and solid-like states, with larger currents generally associated with weaker ordering. By contrast, at fixed frequency, changing the ratchet asymmetry mainly alters the strength of the directed bias and can significantly enhance the current while leaving the hexatic order largely unchanged. Near the equilibrium hexatic-melting regime, this makes it possible to generate substantial directed currents without strongly disrupting sixfold orientational order. These results show that frequency tuning couples transport to structural reorganization, whereas asymmetry tuning primarily controls transport leaving the structure largely unaltered, providing distinct and complementary routes for manipulating transport and order in driven colloidal suspensions.", "url": "https://arxiv.org/abs/2606.20190", "type": "理论+数值", "summary": "1. 该工作通过大规模分子动力学模拟，研究了由随机分段线性闪速棘轮驱动的排斥相互作用胶体悬浮液中的定向输运。\n2. 其技术核心在于揭示了棘轮频率与不对称性可分别独立调控粒子流：频率通过集体弛豫耦合结构重排，而不对称性则主要调节定向偏置强度，几乎不改变六角有序性。\n3. 这为在近平衡六角熔化区实现强定向流而不显著破坏取向有序提供了明确途径，并为驱动胶体体系中输运与有序性的正交操控建立了新范式。", "summary_source": "deepseek", "authors": [{"name": "Sudipta Mandal"}, {"name": "Dipanjan Chakraborty"}, {"name": "Debasish Chaudhuri"}], "featured_authors": [{"name": "Sudipta Mandal"}, {"name": "Dipanjan Chakraborty"}, {"name": "Debasish Chaudhuri"}], "author_count": 3}, {"id": "2606.20253", "category": "cond-mat", "title": "On representation of macroscopic crack in periodic fine-scale discrete mechanical models", "abstract": "In multiscale modeling of heterogeneous softening materials, boundary conditions (BC) in the fine-scale model strongly influence the strain localization pattern and the macroscopic response. For rectilinear models (e.g., squares or cubes), standard Periodic BCs produce artificially ductile behavior with excessive energy dissipation when the localization band inclination does not match the periodicity directions. Recently proposed Tessellation and Percolation-path-aligned BCs promise to address this by adapting the periodicity frame to align with the evolving localization bands. Alternatively, spherical/circular models provide an orientation independent response by design. Unfortunately, the standard Periodic BCs do not allow development of proper localization band crossing spherical model's boundaries. A recently proposed modification addresses this by adding a displacement jump to the spherical periodic BCs. This study evaluates the applicability of these novel BCs to a mesoscale discrete particle model of concrete. Two-dimensional square and circular models under uniaxial tension with different loading directions are analyzed, with the selected approaches extended to three-dimensional cube models. Results show that Percolation-path-aligned BCs exhibit major shortcomings: they can lead to multiple localization bands due to uneven straining of the two boundary sections and their weakly constrained section can be prone to spurious strain localization. In contrast, Tessellation BCs consistently yield a well-defined localization band, whose length is determined solely by the model geometry, making it straightforward to account for in post-processing. Periodic boundary conditions augmented with a displacement jump applied to a circular model sometimes incorrect produce crack patterns similar to those under the standard Periodic BCs.", "url": "https://arxiv.org/abs/2606.20253", "type": "理论+数值", "summary": "1. 该工作系统评估了多种新型周期边界条件在细观离散颗粒模型中的适用性，针对二维方形/圆形与三维立方体模型进行单轴拉伸模拟。\n2. 关键发现是Tessellation边界条件能稳定产生由模型几何唯一决定长度的局部化带，而Percolation-path对齐条件则因边界段应变不均易导致多条虚假局部化带。\n3. 这为多尺度软化材料建模中边界条件的合理选择提供了明确准则，并启示需警惕位移跳变增强边界可能重现标准周期条件的伪韧性缺陷。", "summary_source": "deepseek", "authors": [{"name": "Jan Raisinger"}, {"name": "Jan Eliáš"}], "featured_authors": [{"name": "Jan Raisinger"}, {"name": "Jan Eliáš"}], "author_count": 2}, {"id": "2606.20260", "category": "cond-mat", "title": "Effects of nonlocal interactions on s- and d-wave superconducting correlations in the extended Hubbard model", "abstract": "We investigate the influence of nonlocal interactions on superconducting correlations within the extended Hubbard model. In addition to the on-site Coulomb interaction and nearest-neighbor hopping, we include next-nearest-neighbor hopping together with several physically relevant nonlocal terms, namely nearest-neighbor Coulomb interaction, correlated hopping, exchange interaction, and pair hopping. Using Lanczos exact diagonalization on a $4\\times4$ cluster, supported by projector quantum Monte Carlo simulations for selected parameter regimes, we analyze pairing correlations in both the s- and d-wave channels. We demonstrate that nonlocal interactions exert a highly nontrivial and symmetry-dependent influence on superconducting correlations. While the on-site repulsion in cooperation with next-nearest-neighbor hopping enhances d-wave pairing tendencies, correlated hopping and nearest-neighbor Coulomb interaction strongly promote s-wave correlations, whereas exchange and pair-hopping interactions can efficiently suppress superconductivity beyond relatively small critical strengths. When all nonlocal interactions are considered simultaneously, the resulting phase diagrams reveal a complex interplay and competition between different pairing symmetries. Our results highlight the crucial role of extended interactions in shaping the pairing landscape of strongly correlated systems and demonstrate that a comprehensive treatment beyond the minimal Hubbard model is essential for a realistic description of unconventional superconductivity.", "url": "https://arxiv.org/abs/2606.20260", "type": "理论+数值", "summary": "1. 本文采用Lanczos精确对角化与投影量子蒙特卡洛方法，系统研究了扩展Hubbard模型中非局域相互作用对s波和d波超导配对关联的影响。\n2. 其核心发现在于关联跳跃与近邻库仑相互作用显著增强s波配对，而交换与配对跳跃则在超过临界强度后有效抑制超导，且各非局域项对配对对称性的调控呈现出高度非平凡且对称性依赖的特征。\n3. 该工作揭示了扩展相互作用在塑造强关联系统配对图景中的关键角色，表明超越最小Hubbard模型的完整处理是理解非常规超导物理的必要条件。", "summary_source": "deepseek", "authors": [{"name": "Pavol Farkasovsky"}], "featured_authors": [{"name": "Pavol Farkasovsky"}], "author_count": 1}, {"id": "2606.20261", "category": "cond-mat", "title": "Activity driven buckling and pattern formation in shells of oriented solids", "abstract": "We investigate shells of active oriented solid, materials in which orientationally ordered active particles are embedded in a deformable elastic surface. Focusing on cylindrical geometries, we show that active stresses drive a new class of buckling instabilities and nonlinear patterns absent in passive shells. Linear stability analysis reveals that the unstable buckling mode is selected by the nematic orientation and activity sign, leading to axial, circumferential, and helical deformations. Remarkably, circumferential modes become unstable at arbitrarily small activity due to the absence of stretching costs. The results of the linear stability analysis are corroborated by full nonlinear simulations, which further uncover steady diamond shaped patterns and persistent dynamical states including oscillations, traveling domain walls, and propagating waves. Our results establish fundamental buckling modes and emergent patterns in shells of active oriented solid materials, with potential relevance to active biological tissues and engineered responsive materials.", "url": "https://arxiv.org/abs/2606.20261", "type": "数值", "summary": "1. 该工作理论分析了嵌入可变形弹性表面的活性定向固体圆柱壳层，揭示活性应力驱动的新屈曲不稳定性与非线性图案。\n2. 线性稳定性分析表明向列取向与活性符号选择屈曲模式，且因无拉伸成本，周向模式在任意小活性下失稳。\n3. 非线性模拟进一步揭示菱形图案及振荡、行波畴壁等持续动态，为活性生物组织与工程响应材料提供基本物理图景。", "summary_source": "deepseek", "authors": [{"name": "Niels de Graaf Sousa"}, {"name": "Varun Venkatesh"}, {"name": "Amin Doostmohammadi"}], "featured_authors": [{"name": "Niels de Graaf Sousa"}, {"name": "Varun Venkatesh"}, {"name": "Amin Doostmohammadi"}], "author_count": 3}, {"id": "2606.20339", "category": "cond-mat", "title": "Diagnosing the origin of quantum oscillation beating in graphene", "abstract": "Magnetic quantum oscillations are usually periodic in inverse magnetic field, and their amplitude can show beating when two nearby frequencies interfere. In graphene-based hexagonal systems, such beating can arise from strain-induced pseudomagnetic fields, unequal valley populations, valley-dependent energy shifts, spin-orbit coupling-induced band splitting, or Kekulé distortions. Here, we show that the carrier density and magnetic field dependence of the beating nodes can distinguish these mechanisms. Starting from Onsager's quantization relation, we derive scaling relations for the critical carrier density $N_c$ for the beating nodes as a function of critical magnetic field $B_c$. A pseudomagnetic field gives $N_c\\propto B_c^2$, whereas a density-independent valley imbalance gives $N_c\\propto B_c$. A constant Dirac-band energy splitting by Zeeman-like spin-orbit coupling also gives quadratic field scaling, but with a different node sequence: $N_{c,j}\\propto(2j+1)B_{c,j}^2$ for a pseudomagnetic field and $N_{c,j}\\propto(2j+1)^2B_{c,j}^2$ for energy splitting, where $j$ labels the beating node indices. These results provide quantitative constraints on different microscopic origins of valley- and spin-dependent band splittings in graphene-based systems.", "url": "https://arxiv.org/abs/2606.20339", "type": "理论", "summary": "1. 该工作通过分析量子振荡拍频节点的载流子密度与磁场标度关系，区分了石墨烯中拍频的多种微观起源。\n2. 核心卖点在于建立了临界载流子密度与磁场的幂律标度律及节点指数序列，为区分赝磁场、谷极化与自旋轨道耦合提供定量判据。\n3. 此方法为识别石墨烯及相关六角晶系体系中隐藏的谷与自旋能隙提供了普适的振荡谱学诊断工具。", "summary_source": "deepseek", "authors": [{"name": "Akash Adhikary"}, {"name": "Sunit Das"}, {"name": "Divya Sahani"}, {"name": "Aveek Bid"}, {"name": "Amit Agarwal"}], "featured_authors": [{"name": "Akash Adhikary"}, {"name": "Sunit Das"}, {"name": "Divya Sahani"}, {"name": "Aveek Bid"}, {"name": "Amit Agarwal"}], "author_count": 5}, {"id": "2606.20377", "category": "cond-mat", "title": "Charge imprinting biases topology of correlated insulator in hBN-aligned rhombohedral multilayer graphene", "abstract": "Rhombohedral multilayer graphene aligned with hexagonal boron nitride (RMG-hBN) hosts correlated Chern phases, but the microscopic role of hBN stacking remains unclear, especially when the active carriers are displaced away from the moiré interface. Using Hartree-Fock calculations over layer numbers, twist angles, displacement fields, fillings, and hBN alignments, we show that correlated insulators are most robust at small twist angles and intermediate layer number ($N\\simeq 6$), where bandwidth suppression is balanced by layer delocalization of the wavefunctions of the active carriers. Under moiré-distant conditions at filling $\\nu=1$, the topology of the insulating state is strongly biased by charge imprinting: the hBN alignment shapes the occupied valence-band charge texture near the interface via moiré potential, which acts through long-range Coulomb interactions as a remote electrostatic template for doped conduction electrons. Depending on the alignment, this template favors either triangular charge localization associated with trivial insulators or honeycomb-like charge networks compatible with Chern insulators. Our results identify valence-band charge textures as a microscopic route by which a remote moiré interface controls correlated topology in multilayer graphene.", "url": "https://arxiv.org/abs/2606.20377", "type": "数值", "summary": "1. 该工作通过Hartree-Fock计算系统研究了hBN对齐菱方多层石墨烯中相关绝缘态拓扑性质随层数、转角、位移场和填充因子的变化。\n2. 关键物理是发现电荷印记机制：hBN对齐通过莫尔势调制价带电荷纹理，并经由长程库仑作用作为远程静电模板，决定导带电子局域为三角或蜂窝状，分别对应平庸或陈绝缘体。\n3. 这揭示了远程莫尔界面通过价带电荷纹理控制多层石墨烯相关拓扑的微观路径，为设计可调拓扑关联量子相提供了新方向。", "summary_source": "deepseek", "authors": [{"name": "Lei Qiao"}, {"name": "Xin Lu"}, {"name": "Fu-Chun Zhang"}, {"name": "Jianpeng Liu"}], "featured_authors": [{"name": "Lei Qiao"}, {"name": "Xin Lu"}, {"name": "Fu-Chun Zhang"}, {"name": "Jianpeng Liu"}], "author_count": 4}, {"id": "2606.20445", "category": "cond-mat", "title": "Space-time duality approach to (inhomogeneous) integrable quenches", "abstract": "Characterising the universal aspects of non-equilibrium quantum many-body dynamics is one of the key goals of this century's physics research. Progress, however, is hindered by the lack of general theoretical frameworks for studying interacting quantum matter far from equilibrium. A recent breakthrough has been the realization that several key non-equilibrium quantities, such as the rate of growth of entanglement or the fluctuations of conserved charges within finite subsystems, can be related to equilibrium properties through a space-time duality that effectively exchanges the roles of space and time. This observation effectively enables the study of non-equilibrium phenomena using tools and concepts borrowed from equilibrium statistical mechanics and thermodynamics. A first proof of principle of this framework, dubbed space-time duality approach (SDA), was provided by interacting integrable systems, where thermodynamic properties can often be characterized exactly, while dynamical quantities typically remain beyond analytical reach. Subsequent developments, however, revealed that the SDA suffered from an intrinsic ambiguity, restricting its applicability to homogeneous quenches and to charge fluctuations arising from symmetric initial states. Here we resolve this ambiguity from first principles and derive closed-form predictions for entanglement growth and charge fluctuations after general quantum quenches. We benchmark our results against the exact analytical solution of the Rule 54 quantum cellular automaton and extensive TEBD simulations of the XXZ chain. Moreover we show that, when specialised to the entanglement entropy, our framework naturally reproduces the predictions of the quasiparticle picture.", "url": "https://arxiv.org/abs/2606.20445", "type": "理论+数值", "summary": "1. 该工作从第一性原理解决了时空对偶方法在可积淬火中的内在歧义，将其推广至非均匀淬火与对称初态之外的电荷涨落。\n2. 核心卖点在于推导出纠缠增长与电荷涨落的闭式预测，并在Rule 54量子元胞自动机与XXZ链的TEBD模拟中获得精确验证。\n3. 该框架自然复现准粒子图像的纠缠熵预测，为借助平衡热力学工具研究普适非平衡动力学开辟了路径。", "summary_source": "deepseek", "authors": [{"name": "Riccardo Travaglino"}, {"name": "Pasquale Calabrese"}, {"name": "Katja Klobas"}, {"name": "Bruno Bertini"}], "featured_authors": [{"name": "Riccardo Travaglino"}, {"name": "Pasquale Calabrese"}, {"name": "Katja Klobas"}, {"name": "Bruno Bertini"}], "author_count": 4}, {"id": "2606.20460", "category": "cond-mat", "title": "Scaling, fractal dynamics, and critical exponents in the equilibrium phase transition", "abstract": "Statistical methods are essential for understanding thermodynamic systems with many degrees of freedom. For systems in equilibrium, a very useful method is that of correlation functions, which establish a correlation between a field phi(x), which depends on the spatial position x, and the same field evaluated at another position, phi(x0). Fisher [Journal of Mathematical Physics 5, 944322 (1964)] introduced the autocorrelation function for fluctuations of the order parameter, which has been an important mathematical tool for understanding second-order phase transitions in equilibrium. However, his analysis is restricted to a Euclidean space of dimension d, and an exponent eta is introduced to correct the spatial behavior of the correlation function at T = Tc. In a recent work, Lima et al. [Phys. Rev. E 110, L062107 (2024)] demonstrated that a modern fractional differential analysis is necessary for a complete description of the correlation function at Tc. In this study, we highlight the deep connection among scaling behavior, critical exponents, and fractal geometry. Our results provide a unified geometric interpretation of critical exponents and fractal dimensions, broadly applicable to thermodynamic phase transitions. However, the approach does not apply to topological phase transitions, which lack local order parameters and the associated scale-invariant fractal geometry. We verify its predictions for several cornerstone thermodynamic models: the Ising, Potts, XY, and Heisenberg systems.", "url": "https://arxiv.org/abs/2606.20460", "type": "理论+数值", "summary": "1. 该工作利用分数阶微分分析，重新阐释了Fisher关联函数在临界点的行为，建立了平衡相变中标度行为、临界指数与分形几何之间的统一描述。\n2. 其关键卖点在于证明临界点涨落关联函数遵循分形动力学，并导出临界指数与分形维数之间的精确标度关系，在Ising、Potts、XY、Heisenberg等经典热力学模型中均得到验证。\n3. 该几何框架为理解平衡相变的普适类提供了新的几何分类依据，但明确不适用于拓扑相变，为将分形动力学拓展至非平衡或量子相变提供了重要启发和理论基础。", "summary_source": "deepseek", "authors": [{"name": "Adauto F. Souza"}, {"name": "Henrique A Lima"}, {"name": "Anderson L. R. Barbosa"}, {"name": "Fernando A. Oliveira"}], "featured_authors": [{"name": "Adauto F. Souza"}, {"name": "Henrique A Lima"}, {"name": "Anderson L. R. Barbosa"}, {"name": "Fernando A. Oliveira"}], "author_count": 4}, {"id": "2606.20462", "category": "cond-mat", "title": "Polymer-polymer interdiffusion: effects of entanglements and a polymeric source", "abstract": "Many industrial applications and biological scenarios involve the interdiffusion of two polymeric species. Motivated by biological subcellular source-driven processes, we study polymer-polymer interdiffusion problems in the absence or the presence of a polymeric source, for both unentangled and entangled scenarios. Utilizing a two-fluid formalism, we arrive at scaling relations, self-similar reductions, and analytical solutions, which are confirmed with one- and two-dimensional numerical simulations. The introduction of a source term breaks the self-similar structure, modifying the boundary conditions and the domain of integration. Nevertheless, we show that the front characteristics of the diffusing droplet exhibit similar spatial structures as in the absence of a source. Our results allow deeper understanding of polymer-polymer interdiffusion and nonlinear transport, especially in the presence of a source.", "url": "https://arxiv.org/abs/2606.20462", "type": "理论+数值", "summary": "1. 该工作利用双流体理论，研究了缠结与聚合物源对高分子相互扩散动力学的影响，获得了标度律、自相似解及解析结果。\n2. 主要技术亮点在于揭示源项虽破坏自相似结构并改变边界条件与积分域，但扩散前沿的空间特征与无源情形保持相似。\n3. 这为理解亚细胞源驱动过程及相关非线性输运问题提供了定量框架，并启发后续理论与实验探索。", "summary_source": "deepseek", "authors": [{"name": "Avraham Moriel"}, {"name": "Howard A. Stone"}], "featured_authors": [{"name": "Avraham Moriel"}, {"name": "Howard A. Stone"}], "author_count": 2}, {"id": "2606.20466", "category": "cond-mat", "title": "Correlated Mott semi-metal in the topological heavy fermion model", "abstract": "The topological heavy-fermion model provides a minimal framework for describing the coexistence of localized moments and itinerant Dirac electrons in magic-angle twisted bilayer graphene (MATBG). Several analytical and numerical methods have been applied to this model; however, whether they provide a realistic description of MATBG remains incompletely understood. In this work, we develop an Hubbard operator approach that incorporates non-local correlations beyond the single-site limit. We benchmark the approximate calculations against numerically exact determinant quantum Monte Carlo simulations of a lattice-regularized model. We show that commonly used local approximations, such as Hubbard-I, fail to capture the coupling between localized and itinerant degrees of freedom, leading to incorrect spectral properties in the local-moment regime. In contrast, the Hubbard operator method provides a controlled description of both correlation functions and spectral features over a regime of parameters, in good agreement with exact numerical methods.", "url": "https://arxiv.org/abs/2606.20466", "type": "理论+数值", "summary": "1. 该工作发展了一种包含非局域关联的Hubbard算符方法，用于研究拓扑重费米子模型中的关联Mott半金属相。\n2. 其技术核心在于超越单点局域近似（如Hubbard-I），通过耦合局域矩与巡游狄拉克电子，精确重现行列式量子蒙特卡洛模拟的谱与关联函数。\n3. 这为魔角扭曲双层石墨烯中局域-巡游杂化机制提供了可控的理论描述，并启发在关联拓扑材料中发展非局域多体方法。", "summary_source": "deepseek", "authors": [{"name": "Emile Pangburn"}, {"name": "Igor de Melo Froldi"}, {"name": "Anurag Banerjee"}], "featured_authors": [{"name": "Emile Pangburn"}, {"name": "Igor de Melo Froldi"}, {"name": "Anurag Banerjee"}], "author_count": 3}, {"id": "2606.20522", "category": "cond-mat", "title": "Transfer-matrix functions for algebraically decaying interactions in variational infinite matrix product states", "abstract": "Variational infinite matrix product state (iMPS) calculations usually make Hamiltonians with algebraically decaying interactions compatible with standard MPO algorithms by first replacing the target Hamiltonian with a finite-pole sum-of-exponentials surrogate, thereby introducing a Hamiltonian-representation residual. We formulate the fixed-$D$ variational energy without introducing such a surrogate. For a fixed finite-$D$ MPS, the algebraic tail can be summed directly through the connected transfer matrix: the tail $e^{\\mathrm{i} Qr}/r^\\alpha$ is represented by the matrix function $F_{\\alpha,Q}(\\widetilde{T}_A)$, with $F_{\\alpha,Q}(z)=\\operatorname{Li}_\\alpha(e^{\\mathrm{i} Q}\\,z)/z$. We evaluate the resulting matrix-function action using a Krylov method and obtain stable gradients by combining a Fréchet adjoint with implicit fixed-point differentiation. Benchmarks on long-range free fermions and the inverse-square Heisenberg family, including the Haldane--Shastry point, validate the transfer-matrix-function formulation. A long-range Ising-chain calculation illustrates a practical consequence of avoiding a finite-pole Hamiltonian representation. At a fixed, independently known critical field, finite-pole surrogate Hamiltonians can bias a critical diagnostic away from criticality, whereas the matrix-function calculation retains the expected critical signatures of the target algebraic Hamiltonian.", "url": "https://arxiv.org/abs/2606.20522", "type": "理论+数值", "summary": "1. 该工作提出变分无限矩阵乘积态中直接处理代数衰减相互作用的转移矩阵函数方法。\n2. 其卖点在于通过连接转移矩阵函数求代数尾巴，结合Krylov与Fréchet伴随实现稳定梯度。\n3. 避免有限极点替身哈密顿量，保留目标代数哈密顿的临界特征，对长程体系精确模拟有启发。", "summary_source": "deepseek", "authors": [{"name": "Qi Yang"}], "featured_authors": [{"name": "Qi Yang"}], "author_count": 1}, {"id": "2606.20552", "category": "cond-mat", "title": "On the Renormalization Group Flow of Active Flocks", "abstract": "In this paper, we study the statistical field-theoretic renormalization of active flocks via the MSRDJ action formulation for stochastic systems, focusing on the Toner-Tu theory of `Malthusian flocks', or polar-ordered, momentum non-conserving active fluids where relaxation times for density fluctuations are so short that they can be eliminated as a hydrodynamic variable. Working in the limit of isotropic diffusion in two spatial dimensions, we compute the renormalization of the couplings and their anomalous dimensions to all orders, facilitated by a non-linear realization of a generalized \\textit{Galileon} symmetry and its associated Ward identities. We find a range of behavior depending on the parameters of the theory. If $\\kappa$ is the diffusion coefficient and $\\Delta$ is the variance of the noise, we find a line of fixed points and a marginal vertex instability at $\\Delta/\\kappa = 2\\pi$. This instability separates Gaussian, and strongly interacting, symmetry-protected gapless phases, realizing non-equilibrium critical behavior beyond conventional Wilson--Fisher criticality. The existence of gapless excitations in both phases can be traced to the soft (Adler zero) theorems associated with the generalized Galileon symmetry, and implies the persistence of long range order when $\\Delta/\\kappa$ is below the critical value. We revisit and contextualize various claims and counter-claims in the literature in light of our findings, and discuss extensions of our analysis to anisotropic diffusion, and towards flocks where density fluctuations are reintroduced.", "url": "https://arxiv.org/abs/2606.20552", "type": "理论", "summary": "1. 该工作通过MSRDJ作用量形式化方法，对二维Malthusian活性群落的Toner-Tu理论进行了全阶统计场论重整化群分析。\n2. 其技术核心在于利用广义Galileon对称性的非线性实现及其Ward恒等式，发现扩散系数与噪声方差之比Δ/κ=2π处的边缘顶点不稳定性，分离了高斯相与对称保护无隙强相互作用相。\n3. 该非平衡临界行为超越传统Wilson-Fisher临界性，并由广义Galileon软定理保障两种相中均存在长程有序，为拓展至各向异性扩散及含密度涨落的活性体系提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Kevin T. Grosvenor"}, {"name": "Subodh P. Patil"}], "featured_authors": [{"name": "Kevin T. Grosvenor"}, {"name": "Subodh P. Patil"}], "author_count": 2}, {"id": "2606.19420", "category": "hep-th", "title": "Bootstrapping Pion Form Factors at Large $N$", "abstract": "We initiate a bootstrap study of pion form factors in large $N$ QCD. We consider the mixed system of the vector-current two-point function, the pion vector form factor, and the pion scattering amplitude in the chiral limit. At large $N$ these observables are meromorphic, with spectral data constrained by unitarity, crossing symmetry, and Regge boundedness. We obtain bounds of two kinds. The first are rigorous and universal: from analyticity, unitarity and the asymptotic Brodsky-Farrar scaling, we constrain low-energy form-factor coefficients. The second are more phenomenological, of the Shifman-Vainshtein-Zakharov type: feeding in the perturbative ultraviolet behavior at a finite scale lets us bound the pion decay constant, convert a large $N$ lattice measurement into a lower bound on the scale at which asymptotic freedom sets in, and constrain the pion charge radius. Combining these inputs, the space of allowed chiral Lagrangians shrinks toward the region where large $N$ QCD is expected to sit. Our results illustrate how local gauge-invariant probes provide a canonical bridge between the hadronic bootstrap and the microscopic QCD Lagrangian.", "url": "https://arxiv.org/abs/2606.19420", "type": "理论", "summary": "1. 该工作在大N QCD手征极限下对矢量流两点函数、π介子形状因子及散射振幅启动了bootstrap研究。\n2. 其核心卖点在于结合解析性、幺正性与Brodsky-Farrar标度律导出严格低能界限，并融入微扰UV行为实现半唯象约束。\n3. 这展示了局部规范不变探针可为强子bootstrap与微观QCD拉格朗日量提供规范桥梁。", "summary_source": "deepseek", "authors": [{"name": "Jan Albert"}, {"name": "Dilara Kosva"}, {"name": "Leonardo Rastelli"}], "featured_authors": [{"name": "Jan Albert"}, {"name": "Dilara Kosva"}, {"name": "Leonardo Rastelli"}], "author_count": 3}, {"id": "2606.19423", "category": "hep-th", "title": "Calabi-Yau Orientifold Hypersurfaces and their F-theory Uplifts", "abstract": "We present an algorithm that constructs Calabi-Yau threefold orientifolds and their $F$-theory uplifts to elliptically-fibered Calabi-Yau fourfolds, embedded in toric varieties at codimension one and two respectively. The resulting Calabi-Yau fourfolds arise from triangulations of $6d$ reflexive polytopes -- which our method constructs from orientifold data -- and are smooth away from isolated terminal singularities. For many of our fourfolds, the construction of the mirror manifold is immediate, enabling the computation of fourfold periods, and thus the seven-brane superpotential. We present multiple examples that demonstrate these capabilities. Our algorithms work with $\\mathtt{CYTools}$ and are available through a GitHub repository.", "url": "https://arxiv.org/abs/2606.19423", "type": "理论", "summary": "1. 该工作提出了一个算法，用于构造嵌入于环面簇中的Calabi-Yau三维流形定向折叠及其F-理论uplift到椭圆纤维化四维流形。\n2. 其技术卖点在于从定向折叠数据构造6维自反多胞体的三角剖分，所得四维流形除孤立终端奇点外光滑，且镜像流形构造直接，可计算四维周期与七膜超势。\n3. 这为F-理论紧化中超势的解析计算提供了系统化工具，并促进了定向折叠与椭圆纤维化Calabi-Yau流形之间对应关系的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Bjoern Hassfeld"}, {"name": "Jakob Moritz"}], "featured_authors": [{"name": "Bjoern Hassfeld"}, {"name": "Jakob Moritz"}], "author_count": 2}, {"id": "2606.19440", "category": "hep-th", "title": "Moduli Stabilisation for ADD and the Dark Dimension Scenario", "abstract": "We provide a moduli stabilisation mechanism for realising anisotropic string compactifications with one or two large extra dimensions, corresponding to the ADD and Dark Dimension scenarios. This is achieved within the type IIB Large Volume Scenario, where an exponentially large Calabi-Yau volume in string units can naturally generate a parametrically low Kaluza-Klein scale. Anisotropy is realised by considering a Calabi-Yau threefold which is a K3 fibration over a $\\mathbb{P}^1$ base. The volume of the 4D K3 fibre is stabilised at relatively small values by perturbative corrections to the effective action, in particular string loops and higher-derivative effects, leaving an exponentially large volume of the 2D $\\mathbb{P}^1$ base. We argue that complex structure moduli stabilisation can dynamically deform the $\\mathbb{P}^1$ base, corresponding to a Tyurin degeneration limit where the internal geometry effectively develops a single large 1D cycle. Within a unified description, the ADD case is instead recovered as a symmetric alternative limit. The potential can feature either a dS vacuum or a quintessence runaway, although in both cases some degree of tuning is required to match the observed cosmological constant scale. We also present an explicit Calabi-Yau orientifold example with consistent brane setup, tadpole cancellation and moduli stabilisation. We analyse the resulting moduli spectrum and associated phenomenological constraints, including supersymmetry breaking, cosmological moduli overproduction and fifth force bounds.", "url": "https://arxiv.org/abs/2606.19440", "type": "理论", "summary": "1. 该工作提出了在IIB型大体积弦紧致化框架下实现ADD与暗维度各向异性场景的模稳定机制。\n2. 其核心在于利用K3纤维化于P^1基的Calabi-Yau三折叠，通过弦圈与高阶导数微扰修正稳定小体积K3纤维，同时保持P^1基指数大体积，并借助Tyurin退化极限动态产生单个大额外维度。\n3. 这为在弦论中实现具有一个或两个大额外维度的唯象学模型提供了具体构造，并揭示了dS真空或精质跑动势与观测宇宙学常数匹配所需的精细调节程度。", "summary_source": "deepseek", "authors": [{"name": "Andreas P. Braun"}, {"name": "Michele Cicoli"}, {"name": "Riccardo Milioli"}, {"name": "Roberto Valandro"}], "featured_authors": [{"name": "Andreas P. Braun"}, {"name": "Michele Cicoli"}, {"name": "Riccardo Milioli"}, {"name": "Roberto Valandro"}], "author_count": 4}, {"id": "2606.19467", "category": "hep-th", "title": "Membrane instantons and non-perturbative effects in $\\mathrm{AdS}_{4}/\\mathrm{CFT}_{3}$", "abstract": "We study Euclidean M2-brane instantons in Freund-Rubin backgrounds $\\mathrm{AdS}_{4}\\times \\mathrm{Y}_7$. For a seven-dimensional weak $G_{2}$ manifold $\\mathrm{Y}_7$, we show that the BPS condition for an M2-brane wrapping a three-cycle $\\Sigma\\subset \\mathrm{Y}_7$ is equivalent to the associativity condition with respect to the nearly parallel $G_{2}$-structure. When $\\mathrm{Y}_7$ is Sasaki-Einstein, we identify a special class of BPS M2-branes that preserve both real internal Killing spinors and correspond to invariant three-dimensional submanifolds inheriting a Sasakian structure. We analyse the quadratic fluctuations around BPS M2-brane instantons in these backgrounds. For the special class of M2-branes in Sasaki-Einstein manifolds, the fluctuation problem reduces to transversely elliptic complexes, and the one-loop partition function can be expressed in terms of the corresponding equivariant indices. We then apply the index formula for the one-loop partition function to invariant M2-branes in $S^{7}/\\mathbb{Z}_{k}$, recovering the known result for the $S^3/\\mathbb{Z}_k$ instantons and discussing more general invariant BPS cycles. As a further application, we consider M2-brane instantons with $S^3$-quotient worldvolumes in the $(p,q)$-model geometry.", "url": "https://arxiv.org/abs/2606.19467", "type": "理论", "summary": "1. 该工作系统研究了AdS₄×Y₇中包裹弱G₂或Sasaki-Einstein流形三维子流形的欧几里得M2膜瞬子及其非微扰贡献。\n2. 其技术核心是证明BPS条件与弱G₂结合性条件等价，并在Sasaki-Einstein流形上将涨落约化为横向椭园复数，通过等变指标公式计算了S⁷/ℤₖ及(p,q)模型实例的单圈配分函数。\n3. 这为AdS₄/CFT₃对偶中精确计算膜瞬子非微扰效应提供了几何框架，并可推广至其他Freund-Rubin背景及更一般的超引力构型。", "summary_source": "deepseek", "authors": [{"name": "Stefan A. Kurlyand"}], "featured_authors": [{"name": "Stefan A. Kurlyand"}], "author_count": 1}, {"id": "2606.19479", "category": "hep-th", "title": "Generating Function of single-centered Black Hole Index in CHL Models", "abstract": "We present the construction of the generating function of single-centered black hole index in general $\\mathbb{Z}_N$ CHL models. This is done by subtracting from the index of quarter BPS dyons, described by a meromorphic Siegel modular form, the generating function for the index of two-centered black holes. We use black hole bound state metamorphosis in CHL models for the construction of the generating function of two-centered black hole index. We prove the convergence of the generating function for the cases $N=2,3$.", "url": "https://arxiv.org/abs/2606.19479", "type": "理论", "summary": "1. 该工作构造了$\\mathbb{Z}_N$ CHL模型中单中心黑洞指数生成函数。\n2. 技术关键在于从亚纯Siegel模形式描述的准BPS双子指数中扣除双中心黑洞贡献，并利用黑洞束缚态变形构建后者生成函数。\n3. 证明了$N=2,3$情形下生成函数的收敛性，为超引力中黑洞熵微观计数与模形式方法提供了可推广框架。", "summary_source": "deepseek", "authors": [{"name": "Ranveer Kumar Singh"}], "featured_authors": [{"name": "Ranveer Kumar Singh"}], "author_count": 1}, {"id": "2606.19678", "category": "hep-th", "title": "Operational Tube-Sector Theory of Quantum State Distinguishability Under Generalized Symmetries", "abstract": "A variational principle for quantum-state distinguishability is established in many-body systems with generalized symmetries, including noninvertible cases described by fusion categories. Standard fidelity and symmetry-resolved diagnostics emerge as coarse-grained limits of a more refined operational structure. When symmetry actions terminate at entanglement cuts, distinguishability is governed by boundary tube algebras within a symmetry-constrained measurement resource theory. The physically admissible instruments are characterized by complete positivity, entanglement-cut locality, boundary-module covariance, and sequential stability. The resulting optimal measurement structure is uniquely fixed by the center of the boundary tube algebra, $\\mathcal{A}_{\\mathrm{phys}} = Z\\!\\left(\\mathrm{Tube}_{\\mathcal{C}}(\\mathcal{M}_A)\\right)$, whose primitive idempotents define tube-sector probabilities that refine fidelity-based and symmetry-resolved descriptions. The associated tube positive-operator-valued measures (POVM) are extremal and yield optimal one-shot hypothesis-testing distinguishability under symmetry constraints. The construction is universal across fusion categories and independent of microscopic realization.", "url": "https://arxiv.org/abs/2606.19678", "type": "理论", "summary": "1. 该工作建立了具有广义对称性（包括不可逆情况）的多体系统中量子态可区分性的变分原理。\n2. 其卖点在于通过边界管代数与对称约束测量资源理论，揭示了决定最优区分的物理结构，并由中心代数确定管概率。\n3. 所构造的管POVM是极值且最优的，为融合范畴下普适的单次假设检验可区分性提供了精细描述。", "summary_source": "deepseek", "authors": [{"name": "Song He"}], "featured_authors": [{"name": "Song He"}], "author_count": 1}, {"id": "2606.19732", "category": "hep-th", "title": "Quantum models with the Yang-Lee phase transition", "abstract": "In this article, we present four different $1+1$D quantum models that realize the Yang-Lee (YL) phase transition under a deformation that preserves $PT$ symmetry. These are the antiferromagnetic Ising spin chain in transverse and longitudinal magnetic fields, the massive Schwinger model, the Blume-Capel model, and the three-state quantum clock model. Using the state-operator correspondence, we identify the YL critical point, compute the scaling dimensions of the lowest operators in each model, and find perfect agreement with the exact results for the YL criticality in two dimensions. Using bosonization for the Schwinger model and the Polyakov-Hubbard transformation for the other models, we show that in all of these quantum models the YL critical point is described, as expected, by a massless bosonic field with an $i \\phi^3$ interaction. In the quantum clock model, this critical field interacts with a massive bosonic field, and we identify the massless and massive states in the Hamiltonian spectrum. In addition, we numerically compute the two-point function of $\\phi$ at the Yang-Lee critical point and show that it grows with distance, in agreement with theoretical expectations.", "url": "https://arxiv.org/abs/2606.19732", "type": "理论", "summary": "1. 本工作构造了四个一维量子模型（反铁磁Ising链、大规模Schwinger模型、Blume-Capel模型与三态量子时钟模型），在PT对称变形下实现杨-李相变，并通过态-算符对应精确计算最低算符标度维数，与二维杨-李临界性精确结果一致。\n2. 技术核心在于利用玻色化及Polyakov-Hubbard变换揭示所有模型中杨-李临界点均等效于一个带有iφ³相互作用的质量less玻色场；在量子时钟模型中该临界场进一步与质量full玻色场耦合，且数值证实临界点φ的两点函数随距离增长。\n3. 这些具体模型为在格点量子系统中有目的地实现并检验杨-李临界现象提供了明确路径，并为研究PT对称非厄米变形下的普适类与临界动力学奠定了微观基础。", "summary_source": "deepseek", "authors": [{"name": "Erick Arguello Cruz"}, {"name": "Grigory Tarnopolsky"}], "featured_authors": [{"name": "Erick Arguello Cruz"}, {"name": "Grigory Tarnopolsky"}], "author_count": 2}, {"id": "2606.19877", "category": "hep-th", "title": "Factorized Quantum Curves and Voronoi Polytopes in 3D Duality Cascades with FI Parameters", "abstract": "In the study of duality cascades in three-dimensional gauge theories without FI parameters, an important role is played by a fundamental domain whose vertices correspond to brane configurations with vanishing relative ranks. Through the Fermi gas formalism, such brane configurations are known to be represented by factorized quantum curves. In this paper, we show that this factorized description extends naturally to quantum curves associated with del Pezzo geometries possessing exceptional Weyl-group symmetries in the presence of FI parameters. We find that the vertices of the corresponding fundamental domains, identified with Voronoi polytopes of exceptional root lattices, are realized as factorized quantum curves built from canonical operators interpreted as 5-branes dressed with FI parameters. This provides a physical realization of the vertices of the Voronoi polytopes as ``extremal'' brane configurations.", "url": "https://arxiv.org/abs/2606.19877", "type": "理论", "summary": "1. 该工作将因子化量子曲线描述从无FI参数的三维对偶级联推广至含FI参数的del Pezzo几何，并关联例外Weyl群对称性。\n2. 其核心在于证明例外根格Voronoi多胞体顶点由5-膜规范算符搭配FI参数构建的因子化量子曲线实现。\n3. 这为Voronoi多胞体顶点提供“极值”膜构型的物理解释，启发高维对偶级联中几何与规范理论对应关系的探索。", "
