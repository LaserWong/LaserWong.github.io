summary_source": "deepseek", "authors": [{"name": "Sanefumi Moriyama"}], "featured_authors": [{"name": "Sanefumi Moriyama"}], "author_count": 1}, {"id": "2606.19917", "category": "hep-th", "title": "Metastable and critical-bubble branches of Coleman--Weinberg monopoles", "abstract": "We revisit the Coleman--Weinberg monopole problem introduced by Kiselev, where radiative symmetry breaking makes the broken vacuum metastable. We construct the associated static monopole--critical-bubble configuration in the full coupled radial Higgs--gauge system and show that it is a saddle of the static energy functional. The metastable monopole and monopole--critical-bubble branches are characterized by their profiles, energies, and radial Hessian spectra. The monopole--bubble solution carries a negative radial mode, while the metastable monopole remains locally stable until its lowest radial Hessian eigenvalue approaches zero. The resulting branch structure gives a direct static picture of how Coleman--Weinberg monopoles lose metastability, with critical rescaled scalar mass parameter \\(\\mu_c=0.064352(1)\\).", "url": "https://arxiv.org/abs/2606.19917", "type": "理论", "summary": "1. 该工作重新审视Coleman-Weinberg单极子问题，在全耦合径向Higgs-规范系统中构造静态单极子-临界泡组态并证实其为能量泛函的鞍点。\n2. 其核心在于通过径向Hessian谱表征亚稳态与临界泡分支，揭示临界泡携带负径向模式，亚稳态单极子在最低特征值趋零前稳定，临界参数μ_c=0.064352(1)。\n3. 这为辐射对称性破缺导致的亚稳态丧失提供了清晰静态图像，并为其他场论缺陷的稳定性分析及其临界行为研究提供了可借鉴的框架。", "summary_source": "deepseek", "authors": [{"name": "Sumit Shaw"}], "featured_authors": [{"name": "Sumit Shaw"}], "author_count": 1}, {"id": "2606.20018", "category": "hep-th", "title": "Leading UV Formula for Finite-Volume Vertex Operator Expectation Values in the Sine-Gordon Model from Kink NLIE", "abstract": "We study the ultraviolet (UV) limit of finite-volume expectation values of vertex operators in the sine-Gordon model using the kink nonlinear integral equation (NLIE) description of the conformal limit. By analysing the integrable formulation of vacuum expectation values in the small-volume regime, we conjecture an explicit analytic expression for the leading asymptotic term in the small-volume expansion, formulated in terms of kink functions. This establishes a direct connection between the integrable finite-volume description and the expected conformal asymptotics determined by the 3-point functions of the underlying conformal field theory (CFT). The proposed formula is tested against the analytic expression known from complex Liouville conformal field theory using high-precision numerics, showing agreement to at least 19 significant digits.", "url": "https://arxiv.org/abs/2606.20018", "type": "理论", "summary": "1. 该工作利用kink非线性积分方程推导出sine-Gordon模型中顶点算符有限体积期望值在小体积展开下的紫外渐近显式公式。\n2. 其核心在于通过可积描述直接关联共形场论三点函数，并给出与Liouville共形场论精确数值对比（相符至19位有效数字）。\n3. 这为建立可积量子场有限体积期望值与共形场论渐近行为之间的系统联系提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Arpad Hegedus"}, {"name": "Apor Roth"}], "featured_authors": [{"name": "Arpad Hegedus"}, {"name": "Apor Roth"}], "author_count": 2}, {"id": "2606.20066", "category": "hep-th", "title": "Quantization of Brane-Skyrmions via Physics-Informed Neural Networks", "abstract": "In this work, we investigate the canonical quantization of topological solitons appearing in braneworld scenarios. In particular, we focus on Brane-Skyrmions, topological field configurations analogous to standard Skyrmions, which emerge as solutions of the Dirac-Nambu-Goto action supplemented by an induced curvature term. By quantizing the (iso)spin collective coordinates of the Brane-Skyrmion, we obtain a Hamiltonian that we solve perturbatively via an expansion in powers of $J^2$, in contrast to the standard Skyrme model. Furthermore, we implement a Physics-Informed Neural Network (PINN) to determine the soliton profile that minimizes the energy, consistently incorporating the backreaction from the quantized spin degrees of freedom. We conclude with a discussion of the potential applications of this framework to the description of hadronic spectra. Our results highlight both the theoretical potential of brane-defect models and the growing role of neural network methods in theoretical physics.", "url": "https://arxiv.org/abs/2606.20066", "type": "理论", "summary": "1. 该工作对膜世界场景中出现的Brane-Skyrmions拓扑孤子进行了正则量子化。\n2. 其技术特色在于采用物理信息神经网络确定自旋集体坐标回馈下的孤子能量极小剖面，并基于J^2幂次展开微扰求解量子化哈密顿量。\n3. 这为将膜缺陷模型应用于强子谱描述提供了可行框架，并凸显了神经网络方法在孤立子量子理论中的拓展价值。", "summary_source": "deepseek", "authors": [{"name": "Jose A. R. Cembranos"}, {"name": "Alberto García Martín-Caro"}, {"name": "Sergio S. Rentero"}], "featured_authors": [{"name": "Jose A. R. Cembranos"}, {"name": "Alberto García Martín-Caro"}, {"name": "Sergio S. Rentero"}], "author_count": 3}, {"id": "2606.20220", "category": "hep-th", "title": "Higher-loop wormhole length in sine-dilaton gravity from DSSYK Krylov complexity", "abstract": "The quantum wormhole length in sine-dilaton gravity has been shown to equal the Krylov spread complexity in the double-scaled SYK model. In the infinite temperature limit, we compute the five-loop semiclassical expansion of DSSYK complexity by singular perturbation of the operator Liouville-type equations of motion, extending the existing one-loop results. The same method is applied to evaluate the Krylov variance and third-order cumulant, related to the connected two- and three-point functions of the length operator at coincident points. The small- and large-time behaviour of these observables is also studied. In particular, for the large-time slope of the wormhole linear growth, we provide a conjecture for the resummation of the perturbative series, and discuss non-perturbative corrections revealed by numerical data.", "url": "https://arxiv.org/abs/2606.20220", "type": "理论", "summary": "1. 本文通过奇异摄动求解算子刘维尔型运动方程，在无限温极限下计算了sine-dilaton引力中虫洞长度的五圈半经典展开，并关联DSSYK模型的Krylov扩散复杂度。\n2. 技术关键在于将五圈计算推广至Krylov方差和三阶累积量，这些量对应长度算符的连通两点、三点关联函数，且同时分析了小时间与大时间行为。\n3. 对虫洞线性增长斜率的微扰级数提出重求和猜想，并借助数值数据讨论了非微扰修正，为理解量子引力中的复杂度与虫洞长度关系提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Eleonora Alfinito"}, {"name": "Matteo Beccaria"}], "featured_authors": [{"name": "Eleonora Alfinito"}, {"name": "Matteo Beccaria"}], "author_count": 2}, {"id": "2606.20314", "category": "hep-th", "title": "Macroscopic Black-Hole Remnants in a Nonlocal Field Theory: Towards Hawking Radiation in SFT", "abstract": "We demonstrate that, for a large black hole of radius $a$, Hawking radiation terminates around the scrambling time $u_{\\text{scr}} \\equiv 2a \\log(a/\\ell)$ due to the nonlocal, exponential suppression of trans-Planckian interactions inherent in string field theory (SFT). Modifying a massless scalar field's interaction with a dynamical black hole background via the smearing operator $e^{\\ell^2\\Box}$ (where $\\ell$ denotes the string length scale), we calculate the time-dependent number expectation value $\\langle \\hat{N}(u) \\rangle$ of outgoing Hawking particles at retarded time $u$. While the standard Planck spectrum at the Hawking temperature is reproduced at early times ($u \\ll u_{\\text{scr}}$), the particle number approaches zero shortly after the scrambling time. This early shutoff reflects the property that the collapsing shell becomes effectively invisible to trans-Planckian modes, offering an alternative resolution to the black hole information paradox via a macroscopic remnant.", "url": "https://arxiv.org/abs/2606.20314", "type": "理论", "summary": "1. 该工作展示在大黑洞背景下，弦场论非局部修正导致霍金辐射在混杂时间后终止，计算了出射粒子的时间依赖数期望值。\n2. 其主要卖点是通过smearing算子e^{ℓ²□}实现跨普朗克模式的指数压制，从而早期恢复标准霍金谱而后期粒子数归零。\n3. 这为通过宏观残留物解决黑洞信息悖论提供了替代方案，启发非局部场论在量子引力中的进一步应用。", "summary_source": "deepseek", "authors": [{"name": "Feng-Yin Cheng"}, {"name": "Pei-Ming Ho"}, {"name": "Wei-Hsiang Shao"}], "featured_authors": [{"name": "Feng-Yin Cheng"}, {"name": "Pei-Ming Ho"}, {"name": "Wei-Hsiang Shao"}], "author_count": 3}, {"id": "2606.20334", "category": "hep-th", "title": "The magic of the gravitational vacuum", "abstract": "The black hole information paradox challenges us to do something that is seemingly impossible: find a violation of the semiclassical approximation in a region where all curvatures are low. The vecro hypothesis proposes a structure of the gravitational vacuum that can accomplish this task. In this article we explain the hypothesis, and give a lattice model to describe the essence of its idea. The Hamiltonian of the model is completely local, but the vacuum exhibits correlations among planck scale fluctuations which fall off relatively slowly with distance. These extended-scale correlations are able to `feel around' the region where a closed trapped surface is about to form, and to react by nucleating fuzzball structure that destroys semiclassical spacetime.", "url": "https://arxiv.org/abs/2606.20334", "type": "理论", "summary": "1. 该工作提出vecro假说及其晶格模型，以描述引力真空结构并尝试在低曲率区域破坏半经典近似。\n2. 模型哈密顿量完全局域，但真空态中普朗克尺度涨落呈现缓慢衰减的长程关联。\n3. 这种延展关联能够感知闭合陷获面即将形成的区域，并通过成核毛球结构摧毁半经典时空。", "summary_source": "deepseek", "authors": [{"name": "Samir D. Mathur"}], "featured_authors": [{"name": "Samir D. Mathur"}], "author_count": 1}, {"id": "2606.20353", "category": "hep-th", "title": "Fortuity beyond counting: an explicit construction", "abstract": "We reconsider the \"fortuity'' mechanism in the D1D5 CFT focusing on the K3 symmetric orbifold. Going beyond the counting of BPS states, we investigate perturbatively how the explicit form of the BPS cohomologies is modified by the twist-two deformations. We calculate the action of the supercharges in the sector $(h,j)=(1,0)$ for different values of the central charge and derive explicit expressions for the primary states. Equipped with this information, we compare some protected three-point couplings in the free and the gravity regime. We show that agreement between the two descriptions imposes non-trivial constraints on the identification of monotone and fortuitous states. In particular, we argue that the map relating theories with different values of the central charge must and can be defined so as to commute with the supercharges that define the cochain complex. We then study the three-point correlators between the fortuitous and monotone states identified in our analysis to assess whether the two sectors are dynamically decoupled. We find an explicit example of a non-vanishing coupling between two monotone and a fortuitous state, providing evidence that the two sectors are dynamically connected.", "url": "https://arxiv.org/abs/2606.20353", "type": "理论", "summary": "1. 该工作重新审视D1D5 CFT中K3对称orbifold的“偶然性”机制，超越BPS态计数，显式构造了twist-two形变下BPS上同调形式的修正。\n2. 其技术核心在于计算不同中心荷下超荷在(h,j)=(1,0)扇区的精确作用，推导初态表达式，并发现自由与重力区域受保护三点耦合的一致性对偶然态与单调态识别施加了非平凡约束。\n3. 研究明确证实了一个单调态与偶然态之间的非零耦合实例，证明两扇区动力学相连，为全息对偶中态耦合动力学分离问题提供了关键启发。", "summary_source": "deepseek", "authors": [{"name": "Stefano Giusto"}, {"name": "James Inglis"}, {"name": "Rodolfo Russo"}], "featured_authors": [{"name": "Stefano Giusto"}, {"name": "James Inglis"}, {"name": "Rodolfo Russo"}], "author_count": 3}, {"id": "2606.20433", "category": "hep-th", "title": "Shadow Completion in Celestial OPEs", "abstract": "We argue that celestial OPEs must be supplemented by shadow-basis operators. Although the shadow transform does not introduce new bulk degrees of freedom, it provides a distinct primary state in the boundary celestial theory. From OPE consistency, we show that the ordinary celestial OPE does not close on Mellin-basis exchanges alone. Rather, the same exchanged bulk particle must also appear through its shadow-basis representative. This leads to a shadow-completed OPE, with the shadow OPE coefficient fixed by the ordinary collinear coefficient through the universal shadow factor. We discuss the corresponding boundary Hilbert-space interpretation, extend this argument to gluons and gravitons, and verify the shadow exchange directly in tree-level regular celestial amplitudes, including a scalar $2\\rightarrow n$ analysis and an explicit five-point example.", "url": "https://arxiv.org/abs/2606.20433", "type": "理论", "summary": "1. 该文证明天球OPE必须引入影子基算符以实现闭合，并推导出其系数由普遍影子因子固定。\n2. 其核心在于影子变换不引入新体自由度，却提供边界理论中不同的初级态，从而保持OPE一致性。\n3. 这为边界共形场论的希尔伯特空间解释及树级散射振幅中影子交换的直接验证提供了统一框架。", "summary_source": "deepseek", "authors": [{"name": "Reiko Liu"}, {"name": "Zijian Liu"}, {"name": "Wen-Jie Ma"}], "featured_authors": [{"name": "Reiko Liu"}, {"name": "Zijian Liu"}, {"name": "Wen-Jie Ma"}], "author_count": 3}, {"id": "2606.20486", "category": "hep-th", "title": "Cosmological history after higher dimensional inflation", "abstract": "It was proposed that extra dimensions can acquire large size by higher dimensional inflation connecting two large hierarchies in particle physics and cosmology, namely the weakness of the actual gravitational force to the largeness of the observable universe, in terms of one fundamental scale. This proposal is consistent with the observed approximate scale invariant power spectrum of primordial density perturbations only for one or two extra dimensions of around the micron size. Assuming a stabilisation mechanism of the extra dimensions at the end of inflation, here we propose a cosmological history that describes the Universe evolution after the end of inflation up to the reheating temperature, that guarantees the absence of bulk gravitons at earlier times, avoiding their overproduction in the early universe. The proposed cosmological history connects the period of higher dimensional inflation to the beginning of the standard cosmology.", "url": "https://arxiv.org/abs/2606.20486", "type": "理论", "summary": "1. 该工作提出了高维暴胀结束后至再加热时期的宇宙学演化历史，将高维暴胀与标准宇宙学相连接。\n2. 其核心在于通过暴胀结束时额外维的稳定机制，抑制早期体引力子产生从而避免其过度生成。\n3. 这为数微米尺度的一或两个额外维暴胀模型提供了自洽的后期演化，并符合原初扰动谱的观测约束。", "summary_source": "deepseek", "authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Ignatios Antoniadis"}, {"name": "Jules Cunat"}], "featured_authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Ignatios Antoniadis"}, {"name": "Jules Cunat"}], "author_count": 3}, {"id": "2606.19845", "category": "math-ph", "title": "Universal Properties of Nonlinearly Perturbed Maxwell Theory", "abstract": "We show that a general nonlinearly perturbed Maxwell theory of electromagnetism possesses three universal fundamental properties: (i) A finite-energy electric point charge. (ii) Exclusion of finite-energy magnetic monopoles and dually charged dyons. (iii) Arbitrary smallness of the effective radius of a point electric charge and the associated local undetectedness of the electric charge and energy. In particular, this last property offers a classical explanation for the invisibility of the electron, as a point electric charge, in accordance with the smallness of its effective radius. This nonlinear theory of electromagnetism has the feature that it minimally perturbs the Maxwell theory with a nonlinearity profile that is as general as possible such that the three universal properties stated above are all maintained.", "url": "https://arxiv.org/abs/2606.19845", "type": "理论", "summary": "1. 该工作揭示了一般非线性扰动麦克斯韦理论所共有的三个普遍性质：有限能量的点电荷、排除有限能量磁单极子与双荷子、以及点电荷有效半径的任意可小性及其局域不可探测性。\n2. 其核心在于以最小偏离麦克斯韦理论的方式引入尽可能一般的非线性轮廓，从而在保持上述普遍性质的同时，为电子作为点电荷的不可见性提供经典解释。\n3. 这为经典电动力学中点电荷与磁单极子相互排斥的机制提供了明确物理解释，并启发对更广泛非线性场论中基本粒子局域化与不可探测性的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Tengyang Liu"}, {"name": "Yisong Yang"}], "featured_authors": [{"name": "Tengyang Liu"}, {"name": "Yisong Yang"}], "author_count": 2}, {"id": "2606.20012", "category": "math-ph", "title": "Dirac structures on tangent bundles: a geometric framework for variational principles, constrained dynamics, and symmetry reduction", "abstract": "We introduce a Dirac structure on the tangent bundle of a configuration manifold, called a \\textit{Lagrange--Dirac structure}, which is naturally induced by the Lagrangian two-form associated with a (possibly degenerate) Lagrangian and a constraint distribution. This structure provides a unified geometric framework for Lagrange--Dirac dynamical systems, encompassing nonholonomic, degenerate Lagrangian, and symmetric systems. In the hyperregular case, the system recovers a first-order formulation of the Lagrange--d'Alembert equations. Although nonholonomic dynamics does not preserve the Lagrangian two-form, we show that the underlying Lagrange--Dirac structure is preserved up to gauge transformations, yielding a natural gauge covariance property. We also formulate an intrinsic variational principle directly on the tangent bundle, referred to as the \\textit{Lagrange--d'Alembert--Dirac principle}, which recovers Hamilton's principle in the unconstrained case and the Lagrange--d'Alembert principle in the hyperregular constrained case. Furthermore, we develop a reduction theory for systems with Lie group symmetry, deriving a reduced Lagrange--Dirac structure over the Lie algebra that yields the Euler--Poincaré--Dirac equations and a corresponding reduced variational principle. Finally, we illustrate the theory through examples including charged particles, electric circuits, and systems with Lagrangians linear in velocity, and present an infinite-dimensional extension to ideal fluids that naturally incorporates the incompressibility constraint and recovers the Euler equations.", "url": "https://arxiv.org/abs/2606.20012", "type": "理论", "summary": "1. 该工作通过引入由拉格朗日二形式和约束分布诱导的位形空间切丛上的Lagrange–Dirac结构，为非完整约束、退化拉格朗日及对称动力学系统建立了统一的几何变分框架。\n2. 其核心在于论证非完整动力学虽不保持拉格朗日二形式，但该结构在规范变换下保持协变，并据此提出切丛上的Lagrange–d’Alembert–Dirac变分原理，超正则情形下还原为哈密顿原理或拉格朗日–达朗贝尔原理。\n3. 该框架进一步借助李群对称约化导出Euler–Poincaré–Dirac方程及约化变分原理，并成功应用于带电粒子、电路、速度线性拉格朗日系统及理想流体，为约束力学系统的几何分析与数值模拟提供了统一的理论工具。", "summary_source": "deepseek", "authors": [{"name": "Hiroaki Yoshimura"}], "featured_authors": [{"name": "Hiroaki Yoshimura"}], "author_count": 1}, {"id": "2606.20505", "category": "math-ph", "title": "On the Emergence of Discrete Spectrum for Weakly Disordered Schrödinger Operators", "abstract": "We investigate the spectral properties of the Anderson operator perturbed by a localized negative potential, \\(-V\\). Specifically, we analyze the random Schrödinger operator defined by \\(H = -\\Delta +\\ve \\sum_{n} \\omega_n \\chi_n - V\\), where the unperturbed operator exhibits a disordered energy landscape. Our primary focus is to establish precise estimates on the number of negative eigenvalues (bound states) induced by the attractive perturbation. By analyzing the competition between Anderson localization and the binding capacity of the potential, we provide quantitative bounds on the discrete spectrum. These results offer new insights into how randomness enhances the eigenvalue bounds.", "url": "https://arxiv.org/abs/2606.20505", "type": "理论", "summary": "1. 该工作针对弱无序Anderson型随机Schrödinger算子H=-Δ+ε∑ω_nχ_n-V，其中短程随机势对应无序环境而-V为局部吸引势，系统研究了由-V诱导的离散谱（束缚态）出现条件，并给出了负本征值数目依赖于随机强度ε与势形状的精确上界。\n2. 其核心进展在于通过详细分析Anderson局域化导致的波函数指数衰减与吸引势束缚能力之间的竞争机制，成功在弱无序情形下建立了离散谱的定量界限，并明确指出随机性可显著提升束缚态能级下界这一非平凡特征。\n3. 这些结果不仅将经典束缚态理论从无扰情形推广至弱无序环境，也为实验上利用无序调控量子体系（如超冷原子或半导体量子点）中束缚态能谱提供了理论指导与数值基准。", "summary_source": "deepseek", "authors": [{"name": "Stanislav Molchanov"}, {"name": "Oleg Safronov"}], "featured_authors": [{"name": "Stanislav Molchanov"}, {"name": "Oleg Safronov"}], "author_count": 2}, {"id": "2606.19457", "category": "quant-ph", "title": "Efficient classical representation and quantum state preparation of complete active space wavefunctions", "abstract": "Quantum computers promise to solve the electronic structure problem for a large class of molecules. However, the performance of relevant quantum algorithms hinges on preparing initial states with substantial overlap with the target eigenvector. For classically challenging molecules with strong electron correlation, starting from multi-reference states, such as complete active space (CAS) wavefunctions is necessary. Unfortunately, the most advanced state preparation protocols applied to such states result in a gate complexity that scales exponentially with the active space size $d$. In fact, even encoding a CAS state classically is traditionally believed to be intractable for chemically relevant systems. Here, we draw insights from the recently introduced Quantum Paldus Transform (QPT) to show that there exists an efficient classical representation of CAS states and to design a new state preparation routine outperforming previous ones. The QPT represents a transformation from the Fock basis to a friendlier symmetry-adapted basis. Our main contribution consists in showing that CAS states expanded in this basis can efficiently be represented as a matrix product state (MPS) with a bond dimension scaling as $O(d^2)$. One can then efficiently load the MPS on a quantum computer and use the inverse QPT to transform the state to the Fock basis. Moreover, our method can easily be extended to the efficient preparation of CAS states in first quantisation with similar complexity. Crucially, we demonstrate that the complexity of both state preparation protocols only grows polynomially as $O(d^3)$ , which constitutes to the best of our knowledge an exponential improvement over the state of the art.", "url": "https://arxiv.org/abs/2606.19457", "type": "理论+数值", "summary": "1. 该工作利用量子Paldus变换，提出了一种可有效经典表示完全活性空间波函数并高效制备其量子态的方法。\n2. 其核心在于将活性空间波函数在对称适应基下表示为矩阵乘积态，键维数仅标度为O(d²)，态制备复杂性多项式标度为O(d³)，相较现有指数增长实现指数级改进。\n3. 这为在量子计算机上处理强关联分子电子结构问题提供了高效初始态制备途径，并可推广至第一量子化框架。", "summary_source": "deepseek", "authors": [{"name": "Hamza Jnane"}], "featured_authors": [{"name": "Hamza Jnane"}], "author_count": 1}, {"id": "2606.19502", "category": "quant-ph", "title": "Entanglement Scaling and Problem Structure in Quantum Approximate and Adiabatic Optimization Algorithms", "abstract": "Entanglement is widely regarded as a key resource underlying the power of quantum algorithms and their potential to achieve quantum advantage. With the emergence of variational quantum algorithms, however, questions have arisen regarding how entanglement relates to problem structure and algorithmic performance in near-term quantum applications. Here, we examine this relationship through the Quantum Approximate Optimization Algorithm (QAOA), a specific class of variational algorithms, applied to the MaxCut problem. We show that suboptimal variational parameter training can significantly modify the observed entanglement profile, obscuring its scaling behavior. By employing a high-performance optimizer, we find empirical evidence that QAOA exhibits entanglement scaling consistent with that of fermionic Gaussian states (up to a scaling factor) across a broad range of MaxCut instances. We further compare these results with adiabatic quantum computation, observing annealing-schedule-dependent entanglement profiles whose scaling behavior differs markedly from that of QAOA. Together, these findings provide new insight into how entanglement manifests in and distinguishes these two algorithmic paradigms, highlighting its connection to both computational performance and application structure.", "url": "https://arxiv.org/abs/2606.19502", "type": "理论+数值", "summary": "1. 本工作通过量子近似优化算法与绝热量子计算，系统研究了MaxCut问题中纠缠标度与问题结构及算法性能的关联。\n2. 其技术核心在于使用高性能优化器发现QAOA纠缠标度与费米子高斯态一致，而绝热算法的纠缠剖面对退火时间表依赖且标度行为显著不同。\n3. 这为理解纠缠如何区分两类优化算法范式提供了关键实验证据，并凸显了参数训练对揭示纠缠与计算性能内在联系的重要性。", "summary_source": "deepseek", "authors": [{"name": "Georgios Arapantonis"}, {"name": "Paraj Titum"}, {"name": "Gregory Quiroz"}], "featured_authors": [{"name": "Georgios Arapantonis"}, {"name": "Paraj Titum"}, {"name": "Gregory Quiroz"}], "author_count": 3}, {"id": "2606.19510", "category": "quant-ph", "title": "Exact Markovian Dissipation Requires Singular Energy Resources", "abstract": "The Gorini--Kossakowski--Lindblad--Sudarshan (GKLS) equation describes irreversible quantum dynamical semigroups. We show that this description cannot be exact under physically regular energy conditions. We prove that the open-system survival probability under physically regular energy conditions has sublinear decay, whereas any dissipative GKLS semigroup has a linear short-time decay. Hence exact Markovian dissipation requires singular energy resources: an unbounded-below total Hamiltonian or infinite initial energy, and a divergent interaction-energy moment. Therefore, a dissipative time-independent GKLS equation should be regarded as an effective description rather than the exact reduced dynamics of a Hamiltonian dilation satisfying physically regular energy conditions.", "url": "https://arxiv.org/abs/2606.19510", "type": "理论", "summary": "1. 该工作证明了精确马尔可夫耗散要求哈密顿量无下界或初始能量无穷等奇异能量资源。\n2. 其技术核心在于揭示物理正则能量条件下开放系统生存概率呈次线性衰减，而GKLS半群必然呈线性短时衰减。\n3. 这意味耗散GKLS方程应被理解为有效描述而非精确约化动力学，为量子耗散建模提供了能量条件的根本约束。", "summary_source": "deepseek", "authors": [{"name": "Hiroki Nakabayashi"}], "featured_authors": [{"name": "Hiroki Nakabayashi"}], "author_count": 1}, {"id": "2606.19545", "category": "quant-ph", "title": "Complexity of detecting large coefficients in the Pauli basis", "abstract": "We study the problem of deciding, given a mechanism to prepare a quantum state $\\rho$ and a value $\\varepsilon > 0$, whether there is some non-identity Pauli matrix $P$ such that $|Tr(P \\rho)| \\geq \\varepsilon$. We consider that the state $\\rho$ is described as the result of tracing out some of the qubits of a pure state prepared by a circuit $C$, and we assume the promise that either there is a Pauli matrix satisfying the stated condition or, instead, that for all non-identity Pauli matrices $P$ it is the case that $|Tr(P\\rho)|\\leq \\varepsilon/2$. The problem is in $QCMA$, and we prove that if it belongs to $BQP$ then $NP \\subseteq BQP$. The result is obtained through a reduction from the minimum-weight code problem, and it holds even when $\\rho$ is assumed to be a pure state (i.e. when no qubits are discarded) and $\\varepsilon$ is constant. This resolves an open question regarding the existence of efficient tomographic procedures to find the largest coefficients of a quantum state in the Pauli basis: namely, they do not exist under the standard hypothesis $NP \\nsubseteq BQP$.", "url": "https://arxiv.org/abs/2606.19545", "type": "理论", "summary": "1. 该工作研究了判断量子态在Pauli基下是否存在非恒等算符且迹模超过阈值的计算复杂性。\n2. 其技术卖点在于通过从最小权码问题的约化，证明该问题隶属BQP将推出NP⊆BQP，从而在标准复杂性假设下排除高效断层扫描算法的存在。\n3. 这为量子态层析中寻找大幅值Pauli系数的算法可能性给出了严格的下界，启发对近似断层问题复杂性类的进一步刻画。", "summary_source": "deepseek", "authors": [{"name": "Santiago Cifuentes"}], "featured_authors": [{"name": "Santiago Cifuentes"}], "author_count": 1}, {"id": "2606.19585", "category": "quant-ph", "title": "Electrical Noise Produced by Micron-Sized Particles above a Surface Paul Trap", "abstract": "Electric field noise produced by the surface of ion trap electrodes reduces the fidelity of quantum computing operations. Despite decades of investigation its microscopic origins remain unclear. Here, we measure electric field noise at trapping locations along the symmetry axis of a linear surface Paul trap. We find that noise levels vary by three orders-of-magnitude in one 600$\\,\\mu$m section of the trap. Optical and scanning electron microscope images show micron-sized particles close to the trapping locations with the highest noise levels. We find that modeling the particles as a lossy dielectric with a effective loss tangent $\\tan\\theta=0.33(0.06)$ describes the magnitude of the noise, as well as its spatial and frequency dependence. Our observations may explain the large variation of reported noise levels in literature.", "url": "https://arxiv.org/abs/2606.19585", "type": "理论", "summary": "1. 本工作通过实验测量线性表面Paul阱中电场噪声的空间分布，并借助光学与扫描电镜成像，发现微米级介电颗粒是导致噪声水平出现三个数量级变化的主要根源。\n2. 其核心在于将颗粒建模为有损耗电介质，提取出有效损耗角正切tanθ=0.33(0.06)，成功定量描述了噪声的幅度、空间及频率依赖特性。\n3. 该发现为离子阱电场噪声的普遍性机制提供了直接证据，可解释文献中噪声水平的巨大差异，并为通过表面清洁或筛选来提升量子计算保真度指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Ben Saarel"}, {"name": "Ozgur Sahin"}, {"name": "Hartmut Häffner"}, {"name": "Alpha T. N'Diaye"}], "featured_authors": [{"name": "Ben Saarel"}, {"name": "Ozgur Sahin"}, {"name": "Hartmut Häffner"}, {"name": "Alpha T. N'Diaye"}], "author_count": 4}, {"id": "2606.19593", "category": "quant-ph", "title": "Stalls and Spequlation: Pipelined Execution for Fault Tolerant Quantum Computation", "abstract": "Fault-tolerant quantum computation requires the coordinated action of three distinct systems: classical control logic, quantum hardware, and classical error decoders. Current scheduling models treat logical operations as atomic, hiding the fact that these subsystems operate sequentially and spend significant time idle. We present a pipelined execution framework that decomposes each logical operation into its component stages i.e. Control, Execute, and Decode. Building on this, we discuss some speculation strategies that allow successor operations to begin processing before their predecessors have completed decoding. We evaluate our framework on several common benchmarks and show that pipelining with speculation reduces total pipeline steps by 20-40% compared to a no-speculation baseline. The most aggressive strategy consistently outperforms conservative alternatives, even though partial rollback is needed at times, because the per-rollback penalty is small relative to the parallelism gained. We further show that speculation facilitates load balancing by distributing work more evenly across the heterogeneous subsystems of a fault-tolerant quantum computer, converting idle time into useful computation while also saving on execution time.", "url": "https://arxiv.org/abs/2606.19593", "type": "理论+数值", "summary": "1. 该工作提出一种流水线执行框架，将容错量子计算的逻辑操作分解为控制、执行和解码阶段，以暴露各子系统间的空闲时间。\n2. 核心卖点是引入推测执行策略，允许后继操作在解码完成前开始，结合部分回滚的低代价机制，将总流水线步骤减少20-40%。\n3. 该框架通过推测实现异构子系统的负载均衡，将空闲时间转化为并行计算，为容错量子计算机的协同调度提供了优化方向。", "summary_source": "deepseek", "authors": [{"name": "Aditi Awasthi"}, {"name": "Gokul Subramanian Ravi"}, {"name": "Jonathan Mark Baker"}], "featured_authors": [{"name": "Aditi Awasthi"}, {"name": "Gokul Subramanian Ravi"}, {"name": "Jonathan Mark Baker"}], "author_count": 3}, {"id": "2606.19628", "category": "quant-ph", "title": "Subsystem Quantum Error Correction for Noisy Quantum Metrology", "abstract": "Quantum error correction has been successfully applied to enhance the precision of parameter estimation in the presence of noise. Nonetheless, existing methods require a number of noiseless, controllable ancillae and lack efficient encoding and decoding procedures. In this Letter, we demonstrate that subsystem error correction provides a new direction that can substantially simplify the metrological protocol. We derive general conditions under which subsystem stabilizer codes achieve the Heisenberg limit and show that, for broad classes of noise, this can be realized by syndrome-free protocols using at most a single ancilla qubit. Furthermore, we extend this framework to dynamical error correction and show that Floquet codes can protect time-dependent metrological signals in reaching the Heisenberg limit.", "url": "https://arxiv.org/abs/2606.19628", "type": "数值", "summary": "1. 该工作将子系统量子纠错应用于有噪量子计量，推导了子系统稳定子码达到海森堡极限的一般条件。\n2. 其卖点在于实现了无综合征协议，仅需至多一个辅助量子比特即可对广泛噪声类达到海森堡极限。\n3. 这为在动态纠错中利用Floquet码保护含时计量信号、简化实验实现提供了清晰路径。", "summary_source": "deepseek", "authors": [{"name": "Qiushi Liu"}, {"name": "Sisi Zhou"}], "featured_authors": [{"name": "Qiushi Liu"}, {"name": "Sisi Zhou"}], "author_count": 2}, {"id": "2606.19765", "category": "quant-ph", "title": "Sparse positive maps on qutrits with exact nondecomposability thresholds and PPT-entanglement transitions", "abstract": "We study a family of sparse positive maps on qutrits for which positivity, decomposability, and PPT entanglement can all be analysed explicitly. The block structure of the associated Choi matrices reduces positivity to a Hermitian biquadratic form and leads to exact positivity boundaries for three representative parametric families. For the same families we determine the exact transition between decomposable and non-decomposable maps and construct associated PPT states of two classes. The first consists of witness-adapted deformations naturally tied to the non-decomposability analysis. The second consists of analytically tractable families whose full PPT-entangled branch is detected by fixed positive maps, yielding exact thresholds between separability and bound entanglement. For the trace-preserving subclass, we further compare positivity with a recent eigenvalue bound for 2-positive maps, thereby making the gap between positivity and higher-order positivity fully explicit within this family.", "url": "https://arxiv.org/abs/2606.19765", "type": "理论", "summary": "1. 该工作解析了三能级系统上稀疏正映射族的正性、可分解性及PPT纠缠阈值。\n2. 利用Choi矩阵块结构将正性化为Hermitian双二次型，精确确定了三个参数族的正性边界与可分解-不可分解转变，并构造了两类PPT纠缠态：一类是适应不可分解性分析的纠缠见证变形，另一类是解析可处理族，其完整PPT纠缠分支由固定正映射检测，给出可分离性与束缚纠缠的精确阈值。\n3. 在迹保持子类中，进一步将正性与2-正映射的本征值界比较，显式展示了正性与高阶正性间的间隙，为相关纠缠理论提供了精确基准。", "summary_source": "deepseek", "authors": [{"name": "Davide Poderini"}, {"name": "Angela Rosy Morgillo"}, {"name": "Fabio Benatti"}, {"name": "Fabio Anselmi"}, {"name": "Chiara Macchiavello"}, {"name": "Massimiliano F. Sacchi"}], "featured_authors": [{"name": "Davide Poderini"}, {"name": "Angela Rosy Morgillo"}, {"name": "Fabio Benatti"}, {"name": "Fabio Anselmi"}, {"name": "Chiara Macchiavello"}, {"name": "Massimiliano F. Sacchi"}], "author_count": 6}, {"id": "2606.19873", "category": "quant-ph", "title": "Random Local Stabilizer Codes in Three Dimensions without String or Self-Similar Fractal Logical Operators", "abstract": "Quantum error-correcting codes (QECs) are essential components quantum computation and have deep connections to quantum phases of matter. A key obstruction to passive self-correcting QECs is the presence of string logical operators, which can generate logical errors through constant-energy-barrier processes. Haah's Codes (fracton codes) showed that three-dimensional stabilizer codes can forbid such string logical operators, but their translation-invariant structure supports self-similar fractal logical operators with a logarithmic energy barrier. We introduce the qutrit random cubic codes, a family of local qutrit Calderbank-Shor-Steane stabilizer Hamiltonians with similar cube-check structure as Haah's Code 1 but built from spatially varying stabilizers. We prove that these models retain the no-string property and numerically observe that they have properties distinct from translation-invariant fracton codes: the smallest ground-state degeneracy exponent is $k=2$ for odd $L$ and $k=4$ for even $L$; noncontractible plane-logical operators span the entire logical space; and charge-push diagnostics show that the self-similar fractal operators are absent. These results demonstrate that constrained randomness can fundamentally change the nature of stabilizer codes and improve their self-correction properties. They further point to broader families of quantum error-correcting codes and quantum phases beyond canonical topological and fracton orders.", "url": "https://arxiv.org/abs/2606.19873", "type": "理论+数值", "summary": "1. 该工作构造了基于qutrit的随机立方码族，一种三维局域稳定子哈密顿量，并证明其无弦逻辑算子，且自相似分形逻辑算子被抑制。\n2. 其技术核心在于打破平移不变性，通过空间变化的稳定子结构，使最小基态简并度指数降低，非可缩环面逻辑算子占据整个逻辑空间。\n3. 这表明受约束随机性可根本改变稳定子码的自修正性质，为超越传统拓扑序和分形序的新型量子纠错码与量子相提供了清晰路径。", "summary_source": "deepseek", "authors": [{"name": "Han Yan"}], "featured_authors": [{"name": "Han Yan"}], "author_count": 1}, {"id": "2606.20009", "category": "quant-ph", "title": "The use of Peres lattices in periodically driven systems", "abstract": "We demonstrate the strength of the method of Peres lattices in periodically driven quantum systems. The method, which has previously been used mostly in stationary systems, enables us to efficiently detect resonances in the driven system, to monitor the onset of chaos, and to recognize critical properties of the Floquet modes. It also allows quick comparisons of the spectra of Floquet modes for various driving Hamiltonians and transparent tests of the iterative approximation techniques based on effective stationary Hamiltonians.", "url": "https://arxiv.org/abs/2606.20009", "type": "理论", "summary": "1. 该工作展示了Peres晶格方法在周期驱动量子系统中的有效应用。\n2. 其技术优势在于能够高效检测共振、监测混沌 onset 并识别Floquet模的临界性质，同时快速比较不同驱动哈密顿量的谱。\n3. 这为分析驱动量子系统的动力学行为及验证基于定态哈密顿量的迭代近似方法提供了透明且实用的工具。", "summary_source": "deepseek", "authors": [{"name": "Lukáš Honsa"}, {"name": "Jan Střeleček"}, {"name": "Jakub Novotný"}, {"name": "Pavel Cejnar"}], "featured_authors": [{"name": "Lukáš Honsa"}, {"name": "Jan Střeleček"}, {"name": "Jakub Novotný"}, {"name": "Pavel Cejnar"}], "author_count": 4}, {"id": "2606.20024", "category": "quant-ph", "title": "Simulation of Non-Markovian Quantum Accelerated Dynamics via Time-Fractional Schrödinger Equation", "abstract": "The Time-Fractional Schrödinger Equation (TFSE) is an effective tool for simulating the dynamics of non-Markovian quantum systems. The Quantum Speed Limit (QSL) time characterizes the minimum time required for the evolution of a non-Markovian quantum system. In this paper, Wei's TFSE is employed to simulate the non-Markovian quantum accelerated evolution process in the Resonant Dissipative Jaynes-Cummings (RDJC) model. By solving the QSL time of a time-fractional single-qubit open system, the enhancement mechanism of the system evolution speed induced by the non-Markovian memory effects of the environment is revealed. Further studies show that the optimized acceleration of the system evolution can be achieved by jointly regulating the fractional order, coupling strength, and photon number. Comparative analyses indicate that Wei's TFSE can accurately capture the non-Markovian accelerated dynamical features of the system over the entire fractional order range, whereas Naber's TFSE is applicable only within a limited fractional order interval. In addition, the comparisons of the average simulation time for calculating the dynamical trajectory of the excited-state probability demonstrate that Wei's TFSE has a significant simulation advantage in computational efficiency. Therefore, Wei's TFSE is more accurate and efficient for simulating the accelerated dynamics of non-Markovian quantum systems.", "url": "https://arxiv.org/abs/2606.20024", "type": "理论+数值", "summary": "1. 利用Wei时间分数阶薛定谔方程模拟了共振耗散Jaynes-Cummings模型中的非马尔可夫量子加速动力学过程。\n2. 通过求解量子速度极限时间，揭示了分数阶、耦合强度与光子数联合调控系统演化加速的机制，且Wei方程在全分数阶范围内准确捕获加速特征。\n3. 该工作为精确高效模拟非马尔可夫量子系统加速动力学提供可靠工具，对量子控制与信息处理中的加速演化研究具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Dongmei Wei"}, {"name": "Junxiang Wang"}, {"name": "Hanxiu Xu"}, {"name": "Cancan Chen"}, {"name": "Jiaying Wu"}], "featured_authors": [{"name": "Dongmei Wei"}, {"name": "Junxiang Wang"}, {"name": "Hanxiu Xu"}, {"name": "Cancan Chen"}, {"name": "Jiaying Wu"}], "author_count": 5}, {"id": "2606.20123", "category": "quant-ph", "title": "QPU-scale randomized benchmarking via Bell-pair injection", "abstract": "Mirror randomized benchmarking (MRB) is an established technique that provides a global error metric at the scale of a whole QPU. To expand upon this we introduce Mirror Quantum Awesomeness (MQA), a hybrid protocol that adds a structured entangling layer to MRB circuits. This enables per-edge correlation dynamics to be tracked via mutual information while preserving the MRB infidelity estimate. The resulting analysis of the injected entangled pairs locates a critical circuit depth, beyond which rudimentary error mitigation techniques can be expected to fail. A topological variant, Topological MQA, supplies a second critical depth via a decoder based on the surface-code decoding problem. Both are validated in simulation and demonstrated on the 156-qubit \\texttt{ibm\\_fez} and \\texttt{ibm\\_kingston} processors, where MQA closely agrees with MRB on the entanglement infidelity and the critical depth for \\texttt{ibm\\_fez} is found to be $\\sim 50$.", "url": "https://arxiv.org/abs/2606.20123", "type": "理论+数值", "summary": "1. 本工作引入混合基准测试协议MQA，通过在镜像随机基准测试电路中添加结构化纠缠层，实现整体QPU规模的误差表征。\n2. 该协议利用互信息追踪每边缘关联动力学，同时保持纠缠保真度估计，并定位了基本错误缓解技术失效的临界电路深度。\n3. 拓扑变体通过表面码解码问题提供第二临界深度，为大规模量子处理器上的错误缓解界限与拓扑阈值评估提供了实验依据。", "summary_source": "deepseek", "authors": [{"name": "Haripriya Pettugani"}, {"name": "María Aguado-Yáñez"}, {"name": "Astryd Park"}, {"name": "Daniel Bultrini"}, {"name": "James R. Wootton"}], "featured_authors": [{"name": "Haripriya Pettugani"}, {"name": "María Aguado-Yáñez"}, {"name": "Astryd Park"}, {"name": "Daniel Bultrini"}, {"name": "James R. Wootton"}], "author_count": 5}, {"id": "2606.20153", "category": "quant-ph", "title": "Optimizing resource allocation for accuracy in noisy variational quantum algorithms", "abstract": "For quantum algorithms to achieve their full potential, we need methodologies to optimize them, such as reaching a given output accuracy with minimal resource costs. Here, we develop such a methodology for a class of Noisy Intermediate-Scale Quantum (NISQ) algorithms. We leverage simulations of a Variational Quantum Eigensolver (VQE) to propose a phenomenological model of such algorithms that captures the complex relationship between algorithmic accuracy, algorithmic resource costs, and the noise that exists in realistic quantum hardware. For this, we take the algorithmic resource cost to be the total number of quantum gate-operations in the algorithm; minimizing this cost typically makes the algorithm faster and more energy-efficient. We consider the subtle trade-off between quantum circuit size (small circuits are too imprecise, but large ones are too noisy), and the number of iterations of that quantum circuit for the full algorithm to sufficiently converge. Using a noise-metric-resource methodology, we identify the sweet spot (of circuit size versus iterations) that minimizes the algorithmic resource costs for a desired algorithm accuracy. It also gives the circuit size that maximizes algorithm accuracy for a fixed resource cost. Our methodology provides a practical guideline for near-term deployment of variational algorithms on realistic noisy hardware, including hardware that uses error mitigation.", "url": "https://arxiv.org/abs/2606.20153", "type": "理论+数值", "summary": "1. 该工作针对含噪变分量子算法，开发了一种优化资源分配的方法，以最小化达到给定输出精度所需的总量子门操作数。\n2. 其核心在于通过变分量子本征求解器模拟建立现象学模型，揭示了电路大小与迭代次数间的微妙权衡，并定位了最小化资源成本的甜蜜点。\n3. 这为近期在含噪量子硬件上高效部署变分算法（包括采用错误缓解的方案）提供了实用指导原则。", "summary_source": "deepseek", "authors": [{"name": "Harshit Verma"}, {"name": "Thomas Ayral"}, {"name": "Alexia Auffèves"}, {"name": "Robert Whitney"}], "featured_authors": [{"name": "Harshit Verma"}, {"name": "Thomas Ayral"}, {"name": "Alexia Auffèves"}, {"name": "Robert Whitney"}], "author_count": 4}, {"id": "2606.20166", "category": "quant-ph", "title": "Applications of quantum annealing to magnetic dipole hyperfine structure constants: First results beyond energies for atoms", "abstract": "We report the first results of the magnetic dipole hyperfine structure (HFS) constants of neutral $\\mathrm{Li}$, Li-like $\\mathrm{Be}$, neutral $\\mathrm{Na}$, and Na-like $\\mathrm{Mg}$ using a modified version of the Quantum Annealer Eigensolver (QAE) algorithm on D-Wave's quantum hardware. The results are benchmarked against relativistic configuration interaction with multiconfiguration Dirac Hartree-Fock (MCDHF) calculations using the General-purpose Relativistic Atomic Structure Package (GRASP), and simulated annealing. In our modified QAE, a zooming-and-sigma-annealing approach with a floating-point encoding scheme is adopted to estimate the ground-state eigenvalue and eigenvector of the relativistic Dirac-Coulomb Hamiltonian matrices ($H_{\\mathrm{DC}}$) constructed from 11 or fewer configuration state functions (CSFs). For calculations with extended correlation orbital sets, we applied a CSF truncation scheme, retaining only CSFs (up to 12) that make significant contributions to the ground-state wavefunction. Our modified QAE precision is kept limited to three decimal places (up to 10 qubits). Hardware demonstrations on the D-Wave quantum processing unit (QPU) yielded results that were completely consistent with GRASP (at the chosen precision) in determining the magnetic dipole HFS constants, with accuracy varying across systems and $H_{\\mathrm{DC}}$ matrix dimensions.", "url": "https://arxiv.org/abs/2606.20166", "type": "理论+数值", "summary": "1. 该工作报告了利用改进型量子退火算法在D-Wave硬件上首次计算Li、类Li Be、Na及类Na Mg中性原子磁偶极超精细结构常数的结果。\n2. 通过缩放与西格玛退火策略结合浮点编码方案估计Dirac-Coulomb哈密顿矩阵基态，并对扩展关联轨道集采用CSF截断（最多12个CSF），在10量子比特内达到三位小数精度。\n3. 这首次证明量子退火可超越能量计算，高保真度获取超精细常数等可观测量，为在更大CSF空间和高精度下拓展量子化学计算提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Boni Paul"}, {"name": "Subimal Deb"}, {"name": "Per Jönsson"}, {"name": "Jörgen Ekman"}, {"name": "Bhanu Pratap Das"}], "featured_authors": [{"name": "Boni Paul"}, {"name": "Subimal Deb"}, {"name": "Per Jönsson"}, {"name": "Jörgen Ekman"}, {"name": "Bhanu Pratap Das"}], "author_count": 5}, {"id": "2606.20176", "category": "quant-ph", "title": "Quantum-Accelerated Self-Consistent Field: A Hybrid Algorithm", "abstract": "We present the Grover adaptive search self-consistent field (GAS-SCF) algorithm. GAS-SCF leverages quantum arithmetic to construct an efficient oracle that marks target states (Fock states) which improve upon some initial classical energy estimate. Amplitude amplification then increases the probability of measuring these states. This approach offers a theoretical quadratic speed-up for the optimization problem encountered in SCF quantum chemistry and establishes a baseline against which structured optimization algorithms, such as QAOA and DQI may be compared. In this work, we classically simulate three examples as proofs of concept of the algorithm, the largest consisting of 26 qubits. We then extend our analysis to two larger systems, with O3 representing the largest case at 330 qubits. These examples are chosen to probe classically challenging SCF regimes. Achieving chemically relevant applications of GAS-SCF will require large-scale, fault-tolerant quantum hardware.", "url": "https://arxiv.org/abs/2606.20176", "type": "理论+数值", "summary": "1. 该工作提出了Grover自适应搜索自洽场（GAS-SCF）混合算法，利用量子算术构造标记改善初始经典能量估计的Fock态Oracle，并通过幅度放大实现加速。\n2. 其核心卖点在于对自洽场化学优化问题提供理论上二次加速，并为与QAOA、DQI等结构化优化算法比较建立了基准。\n3. 该算法需在大规模容错量子硬件上运行方能实现化学相关应用，经典模拟已验证其可行性，为后期实验提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Alexis Ralli"}, {"name": "Tim Weaving"}, {"name": "Thomas M. Bickley"}, {"name": "Peter V. Coveney"}, {"name": "Peter J. Love"}], "featured_authors": [{"name": "Alexis Ralli"}, {"name": "Tim Weaving"}, {"name": "Thomas M. Bickley"}, {"name": "Peter V. Coveney"}, {"name": "Peter J. Love"}], "author_count": 5}, {"id": "2606.20184", "category": "quant-ph", "title": "Operator Learning for efficient Quantum Computation", "abstract": "An efficient implementation of quantum algorithms is often hindered by the lack of efficient primitives for operators and state preparation. This limits both the ability of near-term quantum hardware to simulate complex problems and the potential of fault-tolerant algorithms to achieve practical quantum advantage. To address this, we propose a full-stack variational framework that transforms arbitrary operators to compact quantum circuits. The resulting variational circuits can be tailored to the connectivity and long-range interaction of the target hardware. The learning process employs backpropagation together with a cost function that efficiently optimizes unitary operators and non-unitary -- dense or sparse -- operators using only a single ancilla qubit for block encoding. Additionally, we introduce a regularization term that reduces the approximation error. The approach is validated for both quantum mechanical and engineering applications. In the former case, we learn propagators that arise in native quantum problems -- such as quantum simulation and quantum chemistry -- and achieve improved resource scaling in comparison to standard Suzuki-Trotter expansions. In the latter case, we demonstrate the approach's ability to implement the second-order central finite difference approximation of the Laplace operator -- relevant for solving partial differential equations -- while improving upon current error metrics. The final example deals with learning a dense, non-unitary operator that arises in the analysis of inviscid potential flow around an airfoil. This universality of the framework opens the door for solving general problems beyond prototypical engineering and quantum applications.", "url": "https://arxiv.org/abs/2606.20184", "type": "理论+数值", "summary": "1. 该工作提出一个全栈变分框架，将任意算符转换为适配目标硬件连通性与长程相互作用的紧凑量子电路。\n2. 其核心是通过反向传播与仅需单辅助比特块编码的代价函数高效优化幺正及非幺正算符，并引入正则化项降低逼近误差。\n3. 该方法在量子模拟与工程问题中均实现优于标准Suzuki-Trotter展开的资源缩放，为求解超越典型领域的通用问题开辟路径。", "summary_source": "deepseek", "authors": [{"name": "Paul Over"}, {"name": "Sergio Bengoechea"}, {"name": "Leonardo Borello Busilacchi"}, {"name": "Martin Kiffner"}, {"name": "Thomas Rung"}, {"name": "Alexios A. Michailidis"}], "featured_authors": [{"name": "Paul Over"}, {"name": "Sergio Bengoechea"}, {"name": "Leonardo Borello Busilacchi"}, {"name": "Martin Kiffner"}, {"name": "Thomas Rung"}, {"name": "Alexios A. Michailidis"}], "author_count": 6}, {"id": "2606.20271", "category": "quant-ph", "title": "Extracting the physical content of Liouvillian eigenmodes: Semiclassical quantization", "abstract": "Unlike in closed quantum systems where individual energy eigenstates are understood as physical excitations, open quantum systems have distinct right and left eigenstates of the Liouvillian that decay with time and are difficult to interpret. Here we introduce a physically motivated quasiprobability measure combining the two types of eigenstates that interprets a Liouville eigenmode as a set of coherences. This coherence measure is intimately connected to the return probability and allows one to visualize the modes as quasiprobability distributions in a \"doubled\" phase space. Using this measure we show that, remarkably, an oscillator retains its quantized \"orbits\" in phase space for a large class of linear and nonlinear damping, thus providing a formulation of semiclassical quantization for open systems. The orbits have measurable dynamical signatures and are broadened in the presence of a thermal bath, similar to energy levels. For quadratic systems, our results yield an extension of the concept of invariant tori, which play a central role in Hamiltonian systems.", "url": "https://arxiv.org/abs/2606.20271", "type": "理论", "summary": "1. 该工作引入了一种基于准概率的相干测度，用于提取Liouvillian本征模的物理内容，从而将开放系统本征态解释为相空间中的相干集合。\n2. 其核心在于证明振子在线性和非线性阻尼下仍保留量子化轨道，提供了开放系统的半经典量子化表述，并与返回概率直接关联。\n3. 这扩展了二次系统中不变环面的概念，预言轨道在热浴下展宽且具有可测动力学特征，为耗散系统中的量子化研究开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Ashlin V Thomas"}, {"name": "Felix Fritzsch"}, {"name": "Masudul Haque"}, {"name": "Shovan Dutta"}], "featured_authors": [{"name": "Ashlin V Thomas"}, {"name": "Felix Fritzsch"}, {"name": "Masudul Haque"}, {"name": "Shovan Dutta"}], "author_count": 4}, {"id": "2606.20278", "category": "quant-ph", "title": "Proposal of quantum arrival-time measurement with a Bose-Einstein condensate", "abstract": "This work shows how a Bose-Einstein condensate of ultracold atoms could be used to address a long-standing question in quantum theory: how much time does it take for a particle to reach a detector? To this end, we propose a realistic experimental setup, whose key idea is not to measure arrival times directly, but the arrival flux on the detector as a function of its position. This novel approach not only solves practical issues with having a detector close to the system, but also results in signals that allow to unambiguously distinguish different theoretical predictions. This proposal raises prospects for resolving the decades-old debate on this fundamental issue.", "url": "https://arxiv.org/abs/2606.20278", "type": "实验", "summary": "1. 该工作提出利用玻色-爱因斯坦凝聚体测量量子到达时间的实验方案。\n2. 其卖点在于通过测量探测器位置依赖的到达通量，区分不同的量子到达时间理论。\n3. 这为实验解决量子到达时间这一长期争议提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Pascal Naidon"}, {"name": "Lucas Happ"}, {"name": "Denis Boiron"}], "featured_authors": [{"name": "Pascal Naidon"}, {"name": "Lucas Happ"}, {"name": "Denis Boiron"}], "author_count": 3}, {"id": "2606.20306", "category": "quant-ph", "title": "Quantum Batteries as Work Sources for Phase-Locked Parametric Amplification", "abstract": "Quantum batteries have been proposed as locally precharged work sources for superconducting quantum technologies, suggesting a route to reduce continuously supplied microwave drives. Here we ask whether the pump tone of a quantum-limited parametric amplifier can be replaced, or strongly duty-cycled, by a finite bosonic quantum battery. Quantizing the pump of a nondegenerate parametric amplifier exposes a resource distinction hidden in the classical description: stored pump energy can generate signal-idler photons, but pump phase coherence is required to generate a phase-locked amplifier field. In a closed trilinear model, coherent and phase-randomized coherent pumps with the same photon-number distribution produce comparable pair numbers, yet only the coherent pump produces anomalous two-mode coherence and an EPR-squeezed interference dip. Including leakage, we collect the emitted fields into cascaded temporal modes. At matched collector bandwidth, the coherent pump gives \\(I_{\\min}^{(f)}=0.553\\), whereas the phase-randomized pump gives \\(I_{\\min}^{(f)}=1.94\\) at nearly identical collected energy. Weak amplitude squeezing slightly improves the dip by reducing finite-pump number fluctuations while preserving the coherent displacement. Thus battery-powered parametric amplification requires phase-coherent stored energy, possibly assisted by number-noise reduction, rather than stored energy alone.", "url": "https://arxiv.org/abs/2606.20306", "type": "理论", "summary": "1. 该工作研究了用有限玻色量子电池替代非简并参量放大器泵浦的可能性，并量化了其中相位相干性的关键作用。\n2. 其核心发现是：在封闭三线性模型中，尽管相干与相位随机化泵浦产生相近的光子对数，但仅前者能产生异常双模相干性与EPR压缩干涉凹陷，表明锁相放大要求相位相干存储能量。\n3. 这为基于量子电池的超导量子技术指明了方向：电池作为工作源需同时提供能量与相位相干性，且弱振幅压缩可进一步降低泵浦数噪声以改善性能。", "summary_source": "deepseek", "authors": [{"name": "Borhan Ahmadi"}], "featured_authors": [{"name": "Borhan Ahmadi"}], "author_count": 1}, {"id": "2606.20313", "category": "quant-ph", "title": "Entanglement structure of the dynamical phases in the sub-Ohmic spin-boson model", "abstract": "The sub-Ohmic spin-boson model exhibits three distinct dynamical regimes in its spin population dynamics, classified as coherent, incoherent, and pseudo-coherent. Whether these regimes correspond to distinct spin-bath entanglement structures remains an open question. Here we address this using tree tensor network states with projector-splitting time evolution (TTN-TDVP-PS), scanning a broad grid in the sub-Ohmic $(s, \\alpha)$ plane. We find that the spin entanglement entropy $S_\\mathrm{spin}(t)$ reaches a stationary plateau on a timescale shorter than the polarization relaxation, enabling construction of a stationary entropy landscape from the stationary value $S_\\mathrm{stable}$. Within this scalar entropy landscape, the entropy ridge broadly follows the population-based phase boundary at small $s$, but does not reproduce the two-branch structure at large $s$. The ridge remains single-valued within the incoherent region rather than separately tracking both population-based transitions. The Bloch-sphere representation provides a geometric interpretation of this behavior. The entropy plateau corresponds to trajectories settling onto constant-radius shells, with the ridge marking the parameters of smallest stationary Bloch radius. Mode-resolved bath entanglement shows that low-frequency modes dominate the environmental entropy scale and that coherent dynamics enhance bath-mode correlations beyond direct spin--mode correlations. These results establish the stationary spin entanglement entropy as a physically informative observable that complements population-based classifications of dissipative quantum dynamics.", "url": "https://arxiv.org/abs/2606.20313", "type": "理论+数值", "summary": "1. 该工作运用树张量网络态与投影分裂时间演化方法，系统扫描了亚欧姆自旋玻色子模型在(s,α)平面上的相干、非相干与伪相干三种动力学相，刻画了其自旋-浴纠缠结构。\n2. 其关键发现是自旋纠缠熵在远短于极化弛豫的时间尺度上达到稳定平台，由此构建的标量熵景观中熵脊仅在弱耗散区与人口动力学相边界一致，在强耗散区保持单值而不呈现双分支结构，且Bloch球几何与模式分辨分析揭示了低频环境模式对熵尺度的主导作用以及相干动力学对浴关联的增强。\n3. 该结果确立了稳定自旋纠缠熵作为补充人口动力学分类的物理可观测量，为探索开放量子多体系统中纠缠与耗散的竞争机制提供了有效基准与理论工具。", "summary_source": "deepseek", "authors": [{"name": "Cunxi Gong"}, {"name": "Zirui Sheng"}, {"name": "Weitang Li"}], "featured_authors": [{"name": "Cunxi Gong"}, {"name": "Zirui Sheng"}, {"name": "Weitang Li"}], "author_count": 3}, {"id": "2606.20316", "category": "quant-ph", "title": "Exploiting More Than Symmetry in Variational Quantum Machine Learning", "abstract": "The success of variational quantum learning models crucially depends on choosing parametrizations that reflect the structure of the problem at hand. Symmetries provide one of the clearest such structures: whenever transformations of the input leave the desired outcome unchanged, this invariance should be built into the model rather than discovered during training. However, imposing a symmetry does not by itself determine a useful ansatz. Even within the symmetry-preserving space, one must decide where the trainable degrees of freedom should be placed. In this work, we study this remaining design freedom in equivariant variational quantum circuits. Building on symmetry-based parameter sharing, we disentangle two architectural choices: how much symmetry should be enforced, and which symmetry-respecting interactions should be trainable. Using Tic-Tac-Toe as a fully enumerable and structurally transparent test case, we find that suitable subgroups preserve most of the generalization benefit. By contrast, the dominant gains arise from gates acting directly on decisive task motifs. Thus, symmetry defines the admissible design space, while effective ansatze require an additional task-informed choice of trainable interactions.", "url": "https://arxiv.org/abs/2606.20316", "type": "理论+数值", "summary": "1. 该工作系统研究了对称性约束与可训练自由度选择在等变变分量子电路设计中的解耦效应。\n2. 其核心发现在于：对称性保留大部分泛化优势，而关键性能增益源于直接作用于任务决定模式的量子门。\n3. 这为变分量子模型的架构设计提供了明确指导：需在对称性定义的设计空间内，进一步根据任务结构精确定位可训练交互。", "summary_source": "deepseek", "authors": [{"name": "Markus Baumann"}, {"name": "Claudia Linnhoff-Popien"}], "featured_authors": [{"name": "Markus Baumann"}, {"name": "Claudia Linnhoff-Popien"}], "author_count": 2}, {"id": "2606.20380", "category": "quant-ph", "title": "Discrimination of genuinely nonlocal sets without entanglement in multipartite systems", "abstract": "Genuine nonlocality arises when a set of multipartite orthogonal states is locally indistinguishable under any bipartition of the subsystems. The entanglement-assisted discrimination of such genuinely nonlocal orthogonal product sets has attracted significant attention in quantum information. Based on the criterion of local irreducibility, genuine nonlocality is classified into Type I (reducible) and Type II (irreducible). We present entanglement-assisted discrimination schemes for both types of genuinely nonlocal sets that use minimal resources. For low-dimensional cases, Type I sets require only a single EPR pair, whereas Type II sets necessitate only one GHZ state. We extend these protocols to higher-dimensional systems: the discrimination of Type I sets requires only one maximally entangled state in a two-qutrit system, while that of Type II sets similarly demands a single maximally entangled state in a three-qutrit system. For $n$-partite ($n > 3$) systems, Type I sets continue to require only one maximally entangled state, whereas Type II sets necessitate just one additional EPR pair compared to their Type I counterparts. These results provide a robust framework for the efficient discrimination of genuinely nonlocal sets using minimal quantum resources.", "url": "https://arxiv.org/abs/2606.20380", "type": "理论", "summary": "1. 该工作针对多体系统中无纠缠的真正非局域正交乘积集合，提出了基于局部不可约性分类的纠缠辅助区分方案，并精确给出了I型和II型集合所需的最小资源。\n2. 其核心在于揭示了在低维系统中I型集合仅需单EPR对而II型集合仅需单GHZ态，并在高维多体系统中以极少量最大纠缠态实现高效区分的资源边界。\n3. 这为量子信息处理中利用最少纠缠资源区分真正非局域集合提供了可拓展的框架，并可能激发对非局域性资源分类的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Ziying Hou"}, {"name": "Huaqi Zhou"}, {"name": "Limin Gao"}], "featured_authors": [{"name": "Ziying Hou"}, {"name": "Huaqi Zhou"}, {"name": "Limin Gao"}], "author_count": 3}, {"id": "2606.20385", "category": "quant-ph", "title": "Sparse Configuration Interaction for the Electronic Schrödinger Equation Revisited: Complete Basis Set Limit Complexity and Quantum-Encoding Impact", "abstract": "In this article we revisit regularity results for eigenfunctions in the discrete spectrum of the electronic Schrödinger equation and study their consequences for approximation complexity. In particular, for the convergence to the complete basis set limit, it can be shown that the curse of dimensionality in the leading algebraic exponent can be mitigated. That is, for general sparse grid constructions, the main term of the convergence rate with respect to the number of degrees of freedom is independent of the number of electrons. These insights indicate potential benefits for classical numerical solvers of the electronic Schrödinger equation and also for quantum-computing approaches through new qubit-efficient wavefunction encodings.", "url": "https://arxiv.org/abs/2606.20385", "type": "理论+数值", "summary": "1. 本文重新审视电子薛定谔方程稀疏组态相互作用方法，研究离散谱本征函数正则性对完备基组极限近似复杂度的影响。\n2. 主要揭示利用本征函数正则性可缓解维度灾难，使稀疏网格构造的收敛速率主项独立于电子数。\n3. 该发现为经典数值求解器及量子计算中高效量子比特波函数编码提供了理论依据与潜在优化方向。", "summary_source": "deepseek", "authors": [{"name": "Michael Griebel"}, {"name": "Jan Hamaekers"}], "featured_authors": [{"name": "Michael Griebel"}, {"name": "Jan Hamaekers"}], "author_count": 2}, {"id": "2606.20513", "category": "quant-ph", "title": "Approximating optimal decoding of quantum LDPC codes with narrow frontiers", "abstract": "We introduce the Frontier decoder, a pruned dynamic-programming decoder for sparse quantum decoding problems. Frontier processes error variables in a chosen order, merges prefixes with the same residual syndrome and logical label, and approximates logical-coset posterior masses by retaining only a narrow scored frontier. Without pruning, the recursion is exact ordered inference with exponential complexity. In the code-capacity setting, the decoder reaches thresholds close to optimal for the surface code and the color code. In the circuit-level noise model, it achieves state-of-the-art performance with a very small average retained list size: less than 100 for the gross code $[[144,12,12]]$ at a physical error rate of $0.001$. When the list size is constant, the decoder has linear complexity, suggesting the possibility of low-latency implementations.", "url": "https://arxiv.org/abs/2606.20513", "type": "理论", "summary": "1. 该工作提出了Frontier解码器，一种通过剪枝动态规划近似最优解码量子LDPC码的算法。\n2. 其卖点在于仅保留窄前沿来近似逻辑陪集后验质量，在码容量设置中达到接近最优阈值，并在电路级噪声下以小于100的平均列表大小实现最先进性能。\n3. 当列表大小恒定时解码器具有线性复杂度，这为低延迟量子纠错实现提供了可行前景。", "summary_source": "deepseek", "authors": [{"name": "Anthony Leverrier"}, {"name": "Rüdiger Urbanke"}], "featured_authors": [{"name": "Anthony Leverrier"}, {"name": "Rüdiger Urbanke"}], "author_count": 2}, {"id": "2606.20519", "category": "quant-ph", "title": "GPU-accelerated semidefinite programming for causal games", "abstract": "The process matrix formalism describes quantum correlations in scenarios without a fixed causal order between local laboratories. Operational signatures of such correlations can be investigated through causal games. A paradigmatic example is the Guess-Your-Neighbour's-Input game, in which two parties attempt to guess each other's inputs. Correlations compatible with any definite, or probabilistically mixed, causal order cannot achieve a winning probability exceeding $1/2$. The best process-matrix strategy currently known attains a value of approximately $0.6218$ using local dimension $d=5$, while the strongest known dimension-independent upper bound is $0.7592$. In this work, we investigate whether increasing the local dimension beyond $d = 5$ can narrow this gap. To this end, we employ a see-saw optimization scheme in which each step is formulated as a semidefinite program. For scalability, we develop a custom implementation of the SCS solver in which the dominant computational cost, the projection onto the positive-semidefinite cone, is offloaded to a GPU, yielding a six-fold speedup. Using this implementation, we explore local dimensions up to $d = 8$, and we do not find significant improvements over the value at $d=5$. Our results suggest that either qualitatively different strategies are required to approach the known upper bound, or that the bound itself is not tight.", "url": "https://arxiv.org/abs/2606.20519", "type": "理论+数值", "summary": "1. 该工作通过GPU加速的半定规划求解器，研究了Guess-Your-Neighbour's-Input因果游戏中局部维度从5增至8时对最大获胜概率的影响。\n2. 其技术核心是将半定规划见招拆招优化中的正半定锥投影计算卸载至GPU，实现六倍加速，从而得以探索更高维量子策略。\n3. 结果未发现显著优于d=5的获胜概率，暗示要么需要性质不同的策略才能靠近已知上界，要么该上界本身非紧。", "summary_source": "deepseek", "authors": [{"name": "Emanuel-Cristian Boghiu"}, {"name": "Kyrylo Simonov"}], "featured_authors": [{"name": "Emanuel-Cristian Boghiu"}, {"name": "Kyrylo Simonov"}], "author_count": 2}, {"id": "2606.20551", "category": "quant-ph", "title": "Benchmark of quantum algorithms for ground state preparation in the presence of noise", "abstract": "We compare the performance of representative cooling, adiabatic, and optimization algorithms for ground-state preparation in the presence of noise. Using an exactly solvable family of quadratic fermionic Hamiltonians subject to depolarizing noise, we derive the scaling of the achievable relative energy as a function of the noise rate and support these results with numerical simulations. The Hamiltonian exhibits two phases, separated by a quantum phase transition. As expected, the performance of the different algorithms depends on the phase: adiabatic evolution is favorable in the trivial phase, while a multi-frequency cooling algorithm, as proposed in [1], becomes competitive or superior in the topological phase, where gap-closing limits adiabatic protocols. We further present numerical results for the quantum approximate optimization algorithm [2], showing that it performs competitively with cooling in the trivial phase but is typically outperformed in the topological regime. Finally, we show that for this model the cooling protocol exhibits enhanced robustness to parameter imperfections, highlighting its potential advantage for realistic implementations of noisy quantum state preparation. The analytical approach developed here, in conjunction with numerical validation, establishes an extendable approach to benchmarking ground-state preparation algorithms.", "url": "https://arxiv.org/abs/2606.20551", "type": "理论+数值", "summary": "1. 该工作通过可解的二次费米子哈密顿量模型，比较了冷却、绝热与优化算法在去极化噪声下制备基态的相对能量标度。\n2. 其物理卖点在于揭示量子相变决定算法优劣：平凡相中绝热演化有利，而拓扑相中多频冷却因能带闭合限制而表现更优且对参数缺陷更具鲁棒性。\n3. 这为在噪声量子平台上选择基态制备策略提供了可扩展的基准方法，并启发针对不同相区设计混合算法。", "summary_source": "deepseek", "authors": [{"name": "Daniel Molpeceres"}, {"name": "Sirui Lu"}, {"name": "J. Ignacio Cirac"}, {"name": "Barbara Kraus"}], "featured_authors": [{"name": "Daniel Molpeceres"}, {"name": "Sirui Lu"}, {"name": "J. Ignacio Cirac"}, {"name": "Barbara Kraus"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
