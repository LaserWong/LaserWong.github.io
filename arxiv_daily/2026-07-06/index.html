  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2607.01284", "category": "cond-mat", "title": "On the limits of the energetic coupling between field dislocation mechanics and phase field crystal", "abstract": "This paper investigates the energetic coupling between Field Dislocation Mechanics (FDM) and the Phase Field Crystal (PFC) model proposed in Phys. Rev. B 102, 064109, 2020. While FDM correctly solves the initial boundary value problem of a continuum body with dislocation fields, PFC captures the underlying crystallographic structure. The coupling, which penalizes the $L^2$ distance between elastic distortion from FDM and configurational distortion from PFC in the $L^2$ sense, had been proposed to reconcile dislocation mechanics with crystallography in a single continuum framework. Variational analysis reveals that the coupling term acts as a divergence-driven forcing in the phase-field evolution that matches only the compatible (curl-free) parts of the distortion fields. Consequently, its contributions are insensitive to the incompatible (divergence-free) elastic distortion carrying all the information on dislocation topology. Furthermore, the nature of the configurational distortion causes mechanical boundary conditions to be transmitted diffusively from FDM to PFC rather than elastically. Numerical simulations demonstrate that this coupling cannot prevent the unnatural core spreading in FDM. Finally, it is shown that even in the most general case, an energetic coupling suffers from the same drawbacks, which limits its ability to integrate dislocation mechanics with crystallography.", "url": "https://arxiv.org/abs/2607.01284", "type": "理论+数值", "summary": "1. 该工作分析了场位错力学与相场晶体模型中能量耦合的理论局限，指出其无法有效整合位错力学与晶体学。\n2. 变分分析揭示该耦合仅匹配相容畸变部分，而对携带位错拓扑信息的不相容弹性畸变不敏感，且导致边界条件扩散传递。\n3. 这一结果表明，即使最一般形式的能量耦合也无法克服位错核心非物理扩散，为发展替代的积分性框架提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Aymane Graini"}, {"name": "Jorge Viñals"}, {"name": "Manas V. Upadhyay"}], "featured_authors": [{"name": "Aymane Graini"}, {"name": "Jorge Viñals"}, {"name": "Manas V. Upadhyay"}], "author_count": 3}, {"id": "2607.01405", "category": "cond-mat", "title": "First passage time distribution in underdamped harmonic oscillators", "abstract": "We derive the distribution of the first passage time $t_{fp}$ for the position $x$ of an underdamped harmonic oscillator to overcome a threshold $x_B$. As the $t_{fp}$ distribution depends on the oscillator quality factor $Q$ different approaches are used. At very large quality factor ($Q\\gg 100$) and intermediate and long $t_{fp}$ the proof is based on an energy diffusion model, whereas at medium quality factor ($Q\\sim 10$) the proof is based on the study of the eigenvalues of the Kramers linear differential operator with absorbing boundary conditions. For all $Q$ and short $t_{fp}$ we use a Hamiltonian approximation. The theoretical predictions are in excellent agreement with direct numerical simulations of underdamped oscillator dynamics. Finally we show that the mean of the trajectories ending at $t_{fp}$ presents a particular shape driven by a specific noise pattern.", "url": "https://arxiv.org/abs/2607.01405", "type": "理论+数值", "summary": "1. 该工作推导了欠阻尼谐振子位置越过阈值时的首次通过时间分布。\n2. 其技术关键在于针对极高（Q≫100）、中等（Q∼10）及短时间情形，分别基于能量扩散模型、Kramers算符特征值及哈密顿近似给出严格证明。\n3. 这揭示出首次通过时刻平均轨迹由特定噪声模式驱动的普适形状，为随机共振及激活速率理论提供精确基准。", "summary_source": "deepseek", "authors": [{"name": "Aubin Archambault"}, {"name": "Caroline Crauste-Thibierge"}, {"name": "Alberto Imparato"}, {"name": "Sergio Ciliberto"}, {"name": "Ludovic Bellon"}], "featured_authors": [{"name": "Aubin Archambault"}, {"name": "Caroline Crauste-Thibierge"}, {"name": "Alberto Imparato"}, {"name": "Sergio Ciliberto"}, {"name": "Ludovic Bellon"}], "author_count": 5}, {"id": "2607.01407", "category": "cond-mat", "title": "Vitriflow: calibrated amorphous structure ensembles from melt-quench simulation", "abstract": "Melt--quench molecular dynamics is widely used to construct amorphous materials models, but the resulting ensemble is defined by choices that are often made implicitly: numerical settings, melt temperature, liquid-hold time, quench rate, system size, and post-generation screening. We introduce vitriflow, a computational materials methodology that turns these choices into an explicit decision chain. The framework couples numerical stability, descriptor-based protocol calibration, user-defined artefact screening, and statistical convergence of the generated analysis ensemble in a material-specific descriptor space. We demonstrate the approach for a-SiO$_2$, a-Si$_3$N$_4$, and a-Sm$_2$O$_3$, which respectively test tetrahedral network fidelity, MG2 $\\rightarrow$ PBE $\\rightarrow$ HSE06 DFT refinement of a heteropolar nitride, and amorphous/crystal discrimination in a mixed-coordination rare-earth oxide. vitriflow separates defect-free from oxygen-bridge-defective silica, quantifies DFT-refinement response in a common a-Si$_3$N$_4$ structural population, and removes recrystallised Sm$_2$O$_3$ structures without imposing fixed coordination. The result is a reproducible route for generating amorphous ensembles whose numerical settings, thermal protocol, screening actions, and statistical precision are selected from the materials question rather than assumed a priori.", "url": "https://arxiv.org/abs/2607.01407", "type": "理论+数值", "summary": "1. 该工作提出Vitriflow计算材料学方法，将熔融淬火分子动力学中数值设置、热力学协议等隐式选择转化为显式决策链。\n2. 其技术卖点在于耦合数值稳定性、描述符基协议校准、伪影筛选及统计收敛，在材料特定描述符空间中生成校准非晶结构系综。\n3. 这为从材料问题而非默认假设出发，可重复生成非晶结构系综提供了明确路线，尤其适用于四面体网络、异极氮化物及混合配位稀土氧化物。", "summary_source": "deepseek", "authors": [{"name": "Jonathon Cottom"}, {"name": "Robin Delhomme"}, {"name": "Emilia Olsson"}], "featured_authors": [{"name": "Jonathon Cottom"}, {"name": "Robin Delhomme"}, {"name": "Emilia Olsson"}], "author_count": 3}, {"id": "2607.01434", "category": "cond-mat", "title": "Generalized quantum geometry formulated through interacting vertex correlations", "abstract": "Quantum geometry characterizes the variation of electron wavefunctions in solids along a parameter space. Conventionally, crystal momentum is chosen as the parameter, since it couples to electromagnetic fields, offering an interpretation of quantum geometry in terms of dipole matrix elements, polarization fluctuations, and optical responses. However, Bloch momentum is not the only possible parameter space in which a wavefunction can evolve. In this work, we show that quantum geometry can be extended beyond the bare Bloch-band geometry to manifolds whose adiabatic parameters represent deformations of the ground state, including collective bosonic fluctuations, external fields, or structural distortions. We show that the generalized quantum geometric tensor is encoded by correlations of interacting vertices, conjugate to the deformation parameters. By way of illustration, we briefly discuss the application of these extended geometric concepts to manifolds generated by Hubbard-Stratonovich bosonic fields, or Jahn-Teller configurational spaces. The formulation presented here is framed by general manifolds, which extend quantum geometry to generic structural, collective, and interactive many-body systems.", "url": "https://arxiv.org/abs/2607.01434", "type": "理论", "summary": "1. 该工作将量子几何从布洛赫能带推广至基态形变参数流形，通过相互作用顶点关联定义广义量子几何张量，涵盖集体玻色子涨落、外场及结构畸变等情形。\n2. 其核心在于揭示形变参数共轭的相互作用顶点关联函数直接编码几何张量，并以Hubbard-Stratonovich场和Jahn-Teller位形空间为例说明。\n3. 该普适框架将量子几何拓展至多体系统，为理解强关联体系中的几何效应及结构相变中的几何响应提供了统一理论工具。", "summary_source": "deepseek", "authors": [{"name": "Alejandro S. Miñarro"}, {"name": "Gervasi Herranz"}], "featured_authors": [{"name": "Alejandro S. Miñarro"}, {"name": "Gervasi Herranz"}], "author_count": 2}, {"id": "2607.01512", "category": "cond-mat", "title": "Elasto-Hydrodynamic Propulsion of a Magnetically Actuated Filament", "abstract": "We investigate the low-Reynolds-number propulsion of a slender elastic filament with a dipolar magnetic head actuated by an oscillating field in a viscous fluid by studying its strokes and net forward motion. To capture these dynamics, we employ an elasto-hydrodynamic (EH) framework that couples Euler-Bernoulli beam mechanics with resistive force theory. Unlike prescribed-kinematics models, filament shapes here emerge self-consistently from the actuation and the force and torque boundary conditions (BCs). We demonstrate that viscous boundary contributions are crucial for quantitative agreement and show that the swimming dynamics are governed by the EH length and a magneto-viscous-elastic stroke amplitude introduced here. The swimming speed is non-monotonic with increasing ratio of the swimmer length to the EH length, and is shown to reach a maximum when the swimmer length is on the order of the EH length. We further discuss the analytical limit in which the tail BCs can be described as free, and the limitations that arise when viscous contributions to the BCs are ignored.", "url": "https://arxiv.org/abs/2607.01512", "type": "理论", "summary": "1. 该工作采用弹流动力学框架，数值研究磁驱动弹性细丝在低雷诺数粘性流体中的自洽推进运动。\n2. 主要卖点在于揭示了粘性边界贡献对定量精度不可或缺，并引入磁-粘-弹性冲程幅度与EH长度等特征量以刻画游泳的非单调速度响应。\n3. 这为弹性丝状游泳体在微流控等环境下的优化设计提供了明确的物理尺度与边界条件处理指导。", "summary_source": "deepseek", "authors": [{"name": "Sohum Kapadia"}, {"name": "Julien Chopin"}, {"name": "Arshad Kudrolli"}], "featured_authors": [{"name": "Sohum Kapadia"}, {"name": "Julien Chopin"}, {"name": "Arshad Kudrolli"}], "author_count": 3}, {"id": "2607.01547", "category": "cond-mat", "title": "Mixing induced by microswimmers as probed by mutual information", "abstract": "We investigate fluid mixing induced by microswimmers using mutual information as a global, information-theoretic measure of mixing efficiency. For a two-dimensional squirmer model in a confined domain, we compute numerically the swimmer-generated flows and solve the advection-diffusion equation for the transport of tracer particles in the fluid. We show that the spatial distribution of swimmers strongly affects mixing, which is suppressed by swimmer aggregation and enhanced by positional and orientational disorder. At fixed energy dissipation, mixing efficiency depends non-monotonically on the squirmer parameter, with an optimal finite value arising from the balance between swimmer translation and dipolar flow generation. When hydrodynamic interactions are included, pushers outperform pullers. The mutual information as a function of time decays in three stages: an initial diffusion-dominated stage, an intermediate advection enhanced regime, and a final relaxation stage controlled by system size. Our results demonstrate that mutual information, previously validated as a measure of mixing efficiency only in simplified model systems, can equally be used in complex flows. Its application reveals that mixing by microswimmers is subject to a trade-off between the generation of strong shear flows and achieving optimal dispersion across the fluid domain.", "url": "https://arxiv.org/abs/2607.01547", "type": "理论+数值", "summary": "1. 该工作以互信息为全局混合效率测度，数值求解二维受限squirmer模型中游泳者流场与示踪物对流扩散方程，系统考察了游泳者分布、取向无序及squirmer参数对混合的影响。\n2. 核心发现在于固定能耗下混合效率随squirmer参数非单调变化，最优值源于游泳者平动与偶极流生成的竞争，且游泳者聚集抑制混合、无序增强混合，而流体相互作用下pusher优于puller，互信息衰减呈现三阶段动力学。\n3. 该工作验证了互信息在复杂流动中的适用性，揭示了微游泳者混合中强剪切生成与最优分散之间的根本权衡，为设计高效生物混合系统及理解微观对流扩散提供了定量框架与优化准则。", "summary_source": "deepseek", "authors": [{"name": "Yihong Shi"}, {"name": "Yuto Hosaka"}, {"name": "Andrej Vilfan"}, {"name": "Ramin Golestanian"}], "featured_authors": [{"name": "Yihong Shi"}, {"name": "Yuto Hosaka"}, {"name": "Andrej Vilfan"}, {"name": "Ramin Golestanian"}], "author_count": 4}, {"id": "2607.01603", "category": "cond-mat", "title": "Tuning nonlinear waves in nonreciprocal active filaments", "abstract": "The instabilities of slender structures power biological locomotion across scales, and offer a compelling method to actuate soft robots. Nonreciprocal elastic solids have been found to amplify flexural waves in one direction only, but design principles to tune and stabilize these waves are missing. Here we develop a geometrically exact theory of nonreciprocal filaments and provide simulations that capture their post-instability nonlinear dynamics. We find that nonreciprocity, when coupled to inertia or pre-stress, amplifies and advects curvature variations. The resulting one-way patterns of shape morphing can then be selected via dissipative interactions with the environment. Our work offers a continuum-based strategy for how internal stresses can drive active unidirectional waves without need for additional degrees of freedom.", "url": "https://arxiv.org/abs/2607.01603", "type": "理论+数值", "summary": "1. 该工作建立了几何精确的非互易细丝理论，并模拟了其后失稳非线性动力学。\n2. 其核心卖点在于揭示非互易性与惯性或预应力耦合可放大并平流曲率变化，从而选择单向形状变模。\n3. 这为基于内应力驱动无需额外自由度的软体机器人主动单向波动提供了连续介质设计策略。", "summary_source": "deepseek", "authors": [{"name": "Sami C. Al-Izzi"}, {"name": "Jack Binysh"}, {"name": "Yao Du"}, {"name": "Corentin Coulais"}, {"name": "Andreas Carlson"}], "featured_authors": [{"name": "Sami C. Al-Izzi"}, {"name": "Jack Binysh"}, {"name": "Yao Du"}, {"name": "Corentin Coulais"}, {"name": "Andreas Carlson"}], "author_count": 5}, {"id": "2607.01682", "category": "cond-mat", "title": "Many-body benchmarking of DFT local-registry energetics in bilayer InSe", "abstract": "Density functional theory (DFT) is widely used to model twisted bilayers, but the accuracy of the local stacking energetics underlying such models remains uncertain. Here, we benchmark the local-registry landscape of bilayer InSe using diffusion quantum Monte Carlo (DMC). DFT predicts that AB, AAr, and ABr stackings, which share the same interfacial Se registry, are nearly degenerate within 1.5 meV/f.u. and exhibit nearly indistinguishable DFT charge-density responses. DMC instead separates these stackings by 8(5) and 41(4) meV/f.u., while the energy difference between the most stable and least stable registries reaches 60(7) meV/f.u.. These large energy separations show that the stacking energetics are not determined by the interfacial atomic motif alone but depend on the full registry and its associated many-body electronic response. More broadly, these results show that DFT-based moiré models can substantially underestimate local stacking-energy corrugation, with direct consequences for predicted structural relaxation, domain formation, and electronic reconstruction in twisted layered materials.", "url": "https://arxiv.org/abs/2607.01682", "type": "理论+数值", "summary": "1. 该工作采用扩散量子蒙特卡洛方法，对双层InSe中不同局部堆叠构型的能量进行了高精度基准测试。\n2. 其核心发现是，DFT将界面硒配位相同的堆叠预测为近简并，而DMC揭示其能量差达数十meV/f.u.，表明堆叠能量由完整配位与多体电子响应共同决定。\n3. 这提示基于DFT的莫尔模型可能严重低估局部堆叠能量起伏，进而影响对扭曲层状材料中结构弛豫、畴形成与电子重构的定量预测。", "summary_source": "deepseek", "authors": [{"name": "Jeonghwan Ahn"}, {"name": "Abdulgani Annaberdiyev"}, {"name": "Jovan Nelson"}, {"name": "Nathaniel P. Stern"}, {"name": "Hyeondeok Shin"}], "featured_authors": [{"name": "Jeonghwan Ahn"}, {"name": "Abdulgani Annaberdiyev"}, {"name": "Jovan Nelson"}, {"name": "Nathaniel P. Stern"}, {"name": "Hyeondeok Shin"}], "author_count": 5}, {"id": "2607.01815", "category": "cond-mat", "title": "Evidence for Deconfined Magnetic Order in the Kitaev-$J_3$ Model", "abstract": "We investigate the Kitaev-$J_3$ honeycomb model using variational Monte Carlo calculations combined with a vison-quasiparticle analysis of the parent Kitaev spin liquid (KSL). We provide evidence for deconfined magnetic phases in which zigzag or antiferromagnetic order coexists with remnant $\\mathbb{Z}_2$ topological structure inherited from the KSL. The optimized variational wave functions retain multiple linearly independent topological sectors on a torus, whereas those of conventional ordered phases collapse to a single sector. The vison-quasiparticle analysis shows that magnetic order naturally arises from vison-pair condensation while single visons remain gapped, yielding a microscopic mechanism for magnetic ordering without immediate confinement. The resulting phases further host gapless spinons with multiple Majorana cones, offering a possible microscopic scenario for the anomalous low-temperature longitudinal thermal transport reported in magnetically ordered Kitaev materials such as Na$_2$Co$_2$TeO$_6$. Our results reveal a microscopic route to fractionalized magnetism beyond the conventional dichotomy between magnetic order and spin-liquid behavior.", "url": "https://arxiv.org/abs/2607.01815", "type": "理论+数值", "summary": "1. 该工作通过变分蒙特卡洛计算与vison准粒子分析，在Kitaev-J3蜂窝模型中证实了退禁闭磁有序相，其中之字形或反铁磁序与来自基态Kitaev自旋液体的剩余Z2拓扑结构共存。\n2. 其核心卖点在于揭示磁有序源于vison对凝聚而单个vison保持有隙，且优化波函数在环面上保留多个拓扑扇区，与常规有序相的单扇区行为形成鲜明对比。\n3. 这一结果为磁有序Kitaev材料中反常低温纵向热输运提供了基于无能隙Majorana锥自旋子的微观场景，并推动了对超越传统磁序-自旋液体二分法的分数化磁性机制的研究。", "summary_source": "deepseek", "authors": [{"name": "Jiucai Wang"}, {"name": "Chuan Chen"}], "featured_authors": [{"name": "Jiucai Wang"}, {"name": "Chuan Chen"}], "author_count": 2}, {"id": "2607.01888", "category": "cond-mat", "title": "Interaction-rotation driven localization-delocalization of eigenstate in Fock space: An exact diagonalization study on trapped Bose gas", "abstract": "We investigate the localization-delocalization transition and entanglement structure in a finite system of interacting bosons in non-rotating and rotating cases. The many-body eigenspectrum is obtained via exact diagonalization within subspaces of fixed total angular momentum, and the structure of the ground state is analyzed using the inverse participation ratio (IPR), the Shannon entropy (information entropy) and the von Neumann entanglement entropy. In the non-rotating case, a transition from localized to delocalized behavior is observed with increasing interaction strength. The transition is characterized by a decrease in IPR and a corresponding increase in entropy measures, indicating spread of eigenstate weight over all the basis states in the Hilbert space. The effect becomes more pronounced with increasing number of bosons due to the increase of the Hilbert space dimension. In the presence of rotation, the system is driven further toward delocalization. For moderate angular momentum, the eigenstates exhibit partial spreading, while at higher angular momenta a saturation behavior emerges, where further increase in rotation has a limited effect on the localization properties. However, the saturation weakens with increasing system size, indicating a nontrivial interplay between rotation and number of bosons. The consistent behavior of IPR, information entropy and von Neumann entanglement entropy demonstrates that these measures provide a unified characterization of the localization-delocalization transition. The results highlight the combined role of interaction strength, rotation and number of bosons in driving the system towards delocalized state. We observe a connection between localization-delocalization and entanglement, with localized states exhibiting weaker entanglement and delocalized states showing stronger entanglement.", "url": "https://arxiv.org/abs/2607.01888", "type": "理论+数值", "summary": "1. 该工作通过精确对角化研究了囚禁玻色子系统中相互作用和旋转共同驱动的Fock空间本征态局域-退局域转变。\n2. 其卖点在于揭示了逆参与率、香农熵与冯诺依曼纠缠熵一致刻画该转变，并发现旋转在高角动量时引发饱和行为但随系统尺寸增大而减弱。\n3. 这突显了局域化与纠缠间的直接关联，为有限系统中多体量子相变与纠缠结构的统一表征提供了数值依据和物理启示。", "summary_source": "deepseek", "authors": [{"name": "Mohd Talib"}, {"name": "M. A. H. Ahsan"}], "featured_authors": [{"name": "Mohd Talib"}, {"name": "M. A. H. Ahsan"}], "author_count": 2}, {"id": "2607.01997", "category": "cond-mat", "title": "HVAF Spraying of NiTi Coatings: Microstructure, Phase Transformation and Shape Memory Behavior", "abstract": "Depositing various coatings on surface of engineering components with the aim to improve their performance concerning wear, corrosion, friction and thermal protection is already a standard practice. Depositing metallic NiTi shape memory alloy coatings may be a viable alternative for hard ceramic coatings. NiTi coatings offer additional benefits originating from unique functional thermomechanical properties. However, fabrication of thick NiTi coatings turned out to be difficult. Standard electroplating and laser cladding methods are not suitable for NiTi the most widely used plasma spray methods tend to produce chemically inhomogeneous coatings that do not transform martensitically, cold sprayed NiTi coatings suffer from poor adhesion to the substrates. In this work we report on first ever successful fabrication of thick NiTi coatings (100-300 um) that display functional thermomechanical properties and simultaneously show very good adherence to the substrate. We used high velocity air fuel thermal spray method to fabricate NiTi coatings deposited on mild steel using four different sets of processing parameters. Chemical composition, porosity, microstructure, phase transformation and functional thermomechanical properties of the NiTi coatings were evaluated. Although the coatings contain inhomogeneous microstructure, voids, oxide particles, high density of dislocation defects and internal stress, they undergo martensitic transformation upon cooling and or mechanical loading. As sprayed NiTi coatings need to be annealed to display functional thermomechanical properties. Despite their limited tensile strength, the coatings displayed thermal actuation in 3 point bending tests and shape memory effects in nanoindentation and scratch tests.", "url": "https://arxiv.org/abs/2607.01997", "type": "数值", "summary": "1. 该工作首次采用高速空气燃料热喷涂（HVAF）方法，成功制备出厚度100–300微米、兼具良好基体附着力的NiTi形状记忆合金涂层。\n2. 技术关键在于，尽管涂层含有非均匀微结构、孔隙、氧化物、高密度位错和内应力，仍能发生马氏体相变，且退火后展现热致动与形状记忆效应。\n3. 这为克服传统工艺难以制备厚NiTi功能涂层的瓶颈提供了可行途径，并启发其在耐磨、防护等工程表面处理中的应用探索。", "summary_source": "deepseek", "authors": [{"name": "Sneha Samal"}, {"name": "Shrikant Joshi"}, {"name": "Stefan Björklund"}, {"name": "Mohit Chandra"}, {"name": "Akhil Bhardwaj"}, {"name": "Jaromír Kopeček"}, {"name": "Stanislav Habr"}, {"name": "Lukáš Václavek Jan Tomáštík"}, {"name": "Ondřej Tyc"}, {"name": "Petr Šittner"}], "featured_authors": [{"name": "Sneha Samal"}, {"name": "Shrikant Joshi"}, {"name": "Stefan Björklund"}, {"name": "Lukáš Václavek Jan Tomáštík"}, {"name": "Ondřej Tyc"}, {"name": "Petr Šittner"}], "author_count": 10}, {"id": "2607.02023", "category": "cond-mat", "title": "Sandpile Models on complex networks", "abstract": "We investigate the sandpile model on complex networks by developing a branching-process framework that explicitly incorporates dissipation during avalanche propagation. Unlike classical branching descriptions, which assume conservative transport and locally tree-like independence, the present approach introduces grain-loss effects directly into the offspring distribution, yielding generalized generating functions for dissipative avalanche dynamics. In the dissipative regime, avalanche-size distributions acquire exponential cutoffs while preserving topology-dependent scaling behavior. Numerical simulations confirm the theoretical predictions on sparse random networks and reveal systematic deviations in highly structured topologies. In particular, by using Holme-Kim clustered scale-free networks, we show that increasing clustering continuously lowers the avalanche exponent and enhances the probability of large cascades, demonstrating that short cycles generate strong correlations that invalidate the classical independent-branch approx imation. Surprisingly, trees also exhibit substantial deviations from power-law because low edge density and the abundance of leaves constrain avalanche propagation. These results show that dissipation, clustering, and sparse connectivity fundamentally reshape avalanche size distribution of the sandpile model on networks and establish quantitative limits for branching-process descriptions of avalanche dynamics.", "url": "https://arxiv.org/abs/2607.02023", "type": "理论+数值", "summary": "1. 该工作发展了一个显式包含耗散效应的分支过程框架，用于解析复杂网络上沙堆模型的雪崩动力学。\n2. 其核心在于将晶粒损失直接纳入子代分布并构造广义生成函数，揭示了耗散、聚类及稀疏连接如何共同调控雪崩尺寸分布的指数截断与标度行为。\n3. 这为网络雪崩过程的非保守分支近似建立了定量适用边界，并为理解短程关联在级联传播中的关键角色提供了理论启发。", "summary_source": "deepseek", "authors": [{"name": "Komlan Fiagbe"}, {"name": "Jean-François de Kemmeter"}, {"name": "Timoteo Carletti"}], "featured_authors": [{"name": "Komlan Fiagbe"}, {"name": "Jean-François de Kemmeter"}, {"name": "Timoteo Carletti"}], "author_count": 3}, {"id": "2607.02100", "category": "cond-mat", "title": "Quantum-geometric shift of quasiequilibrium: Origin of nonreciprocal current driven by quantum-metric dipole", "abstract": "We study nonlinear DC electric transport of quantum-metric origin by combining adiabatic perturbation theory with the nonequilibrium Green function approach. The adiabatic ansatz provides a basis for directly treating a DC electric field in the velocity gauge, rather than introducing it as the zero-frequency limit of an AC field. The resulting adiabatic-basis Hamiltonian takes the same form as in the length gauge, enabling a systematic comparison across different formulations. Applying this fully quantum formulation, we find a longitudinal nonreciprocal current governed by the quantum-metric dipole. The essential ingredient is a quantum correction to the distribution function that is absent in semiclassical treatments. We trace this correction to the finite spread of an electron wave packet during relaxation under a bias field, thereby identifying shifted quasiequilibrium as the physical origin of quantum-metric nonreciprocal transport.", "url": "https://arxiv.org/abs/2607.02100", "type": "理论", "summary": "1. 该工作结合绝热微扰论与非平衡格林函数方法，系统研究了量子度量起源的非线性直流电输运。\n2. 其核心发现是纵向非互易电流由量子度量偶极主导，并通过波包扩展的量子修正识别出准平衡移动作为物理机制。\n3. 这为理解非互易输运的量子几何本质提供了明确框架，有望指导相关材料中量子度量响应的实验探索。", "summary_source": "deepseek", "authors": [{"name": "Sota Kitamura"}, {"name": "Takahiro Anan"}, {"name": "Takahiro Morimoto"}], "featured_authors": [{"name": "Sota Kitamura"}, {"name": "Takahiro Anan"}, {"name": "Takahiro Morimoto"}], "author_count": 3}, {"id": "2607.02112", "category": "cond-mat", "title": "A 2048-spin bulk acoustic wave Ising machine for number partitioning and Sudoku", "abstract": "Optical coherent Ising machines based on time-multiplexing have demonstrated significant progress in terms of connectivity and spin scalability. However, they are constrained by large physical footprints, high power consumption, poor thermal stability, and high cost. Here, we present a time-multiplexed Ising machine leveraging propagating wave packets in solid-state delay lines at microwave frequencies, enabling thermally stable, robust, low-power, tabletop, and affordable design. We use two serially connected 20.5 MHz, 707 {\\mu}s bulk acoustic wave delay lines supporting 2,048 spins. Our design provides all-to-all connectivity with 15-bit coupling resolution and finds approximate MAX-CUT solutions in 341 ms, potentially scalable to sub-ms by using higher frequency delay lines. Additionally, we demonstrate solutions to number partitioning and Sudoku problems. Compared with state-of-the-art Coherent Ising machines, our machine exhibits four orders of magnitude higher thermal stability. Against the simulated bifurcation algorithm, our design achieves comparable results on the MAX-CUT problem, while outperforming it on the more complex number-partitioning and Sudoku problems.", "url": "https://arxiv.org/abs/2607.02112", "type": "数值", "summary": "1. 该工作利用两个串联的20.5 MHz体声波延迟线构建了支持2048自旋的时域复用Ising机，在341 ms内求解MAX-CUT问题并演示了数划分和数独问题。\n2. 其核心卖点在于全连接耦合（15位分辨率）与固态微波架构带来的高稳定性，热稳定性相比现有相干Ising机提升四个数量级，且功耗低、体积小。\n3. 通过采用更高频延迟线可将求解时间缩短至亚毫秒级，该方案在数划分和数独等复杂问题上表现优于模拟分岔算法，为廉价、稳定的组合优化硬件提供了新路径。", "summary_source": "deepseek", "authors": [{"name": "Venkatesh Vadde"}, {"name": "Roman Ovcharov"}, {"name": "Victor H. González"}, {"name": "Roman Khymyn"}, {"name": "Artem Litvinenko"}, {"name": "Johan Åkerman"}], "featured_authors": [{"name": "Venkatesh Vadde"}, {"name": "Roman Ovcharov"}, {"name": "Victor H. González"}, {"name": "Roman Khymyn"}, {"name": "Artem Litvinenko"}, {"name": "Johan Åkerman"}], "author_count": 6}, {"id": "2607.02136", "category": "cond-mat", "title": "Phonon spectral function of Holstein polaron: Investigation of many-body effects with self-energy and vertex correction", "abstract": "We study the impact of the many-body effects on the phonon spectral function of Holstein polaron in one-dimension in the antiadiabatic regime by incorporating the contributions from the electron self-energy and vertex corrections within a weak-coupling approach that respects the charge-conserving Ward identity. We find that while the polaronic spectral weight is suppressed due to contribution from the electron self-energy, on the other hand, the same is enhanced due to contribution from the vertex corrections. While strength of both the contributions increases with increasing the wave vector ($\\q$) of phonons, they nearly cancel each other for the small-$\\q$ modes so that the polaronic spectral weight is weakly affected due to the many-body effects. For the large-$\\q$ modes near the zone boundary, the net many-body correction is dominated by the contribution of the electron self-energy which increases faster in comparison to that of the vertex corrections with increasing the wave vector thereby resulting in a significant suppression of the polaronic spectral weight. We find that while the weak-coupling perturbative approach provides a reliable estimation of the impact of the many-body effects deep inside the antiadibatic regime, the renormalization of quasiparticle spectrum must be taken into account for an accurate estimation when the phonon energy approaches the electronic bandwidth.", "url": "https://arxiv.org/abs/2607.02136", "type": "理论", "summary": "1. 本文通过满足Ward恒等式的弱耦合方法，计算电子自能与顶角修正，研究一维反绝热区Holstein极化子的声子谱函数。\n2. 发现电子自能抑制极化子谱权重而顶角修正增强之，两者在小波矢下近抵消，大波矢下自能贡献更快增长导致谱权重显著抑制。\n3. 该工作界定了弱耦合微扰在深反绝热区的可靠性，并指出声子能量接近电子带宽时须计入准粒子谱重整化才能准确描述多体效应。", "summary_source": "deepseek", "authors": [{"name": "Lawrence Rai"}, {"name": "Sudhakar Pandey"}], "featured_authors": [{"name": "Lawrence Rai"}, {"name": "Sudhakar Pandey"}], "author_count": 2}, {"id": "2607.02154", "category": "cond-mat", "title": "Path-Measure Dynamics of Attention-Driven World Models: A Nonlocal Onsager--Machlup Approach", "abstract": "Attention enables a world model to condition on its entire history, providing long-term memory that facilitates long-range predictions. While the local Onsager--Machlup theory in our companion paper assumes a temporally local predictive action, we investigate the conditions under which this locality holds. We derive the predictive path measure for latent dynamics that become non-Markovian due to attention-induced memory, demonstrating that this measure is the projection of a hidden linear Markov augmentation. Eliminating the auxiliary field results in a nonlocal Onsager--Machlup action, where memory manifests as a nonlocal quadratic form rather than a force. These kernels are completely monotone and exactly match a hidden Markov embedding with a finite relaxation spectrum; otherwise, the dynamics remain fundamentally nonlocal. By expanding the action in terms of the scale-separation parameter $\\epsilon=\\tau_{\\text{mem}}/\\tau_{\\text{dyn}}$, we show that the leading order recovers the local action of the companion paper, establishing locality as the short-memory limit of a nonlocal theory. We verify the reversible sector of this expansion term by term against an exactly solvable vector linear model.", "url": "https://arxiv.org/abs/2607.02154", "type": "理论", "summary": "1. 该工作为注意力驱动世界模型中的非马尔可夫潜动力学推导了路径测度，并基于非局部Onsager-Machlup作用量刻画了记忆效应。\n2. 其核心在于揭示注意力记忆表现为非局部二次型而非力，并通过隐藏线性马尔可夫增广与尺度分离参数展开，严格建立了非局部理论到局部短记忆极限的联系。\n3. 这为理解注意力机制中记忆的物理本质提供了路径积分框架，并启发了非平衡统计力学在序列预测模型中的深入应用。", "summary_source": "deepseek", "authors": [{"name": "Gunn Kim"}], "featured_authors": [{"name": "Gunn Kim"}], "author_count": 1}, {"id": "2607.02171", "category": "cond-mat", "title": "Theory of collective learning in populations of adaptive agents", "abstract": "We investigate homogeneous populations of smart active agents that exchange information with their neighbors to perform a decentralized learning process aimed at achieving a prescribed macroscopic state. Such agents may, for example, represent simple microrobots. The exchanged information comprises tunable parameters governing the agent dynamics, referred to as the individual policy, together with an internal memory encoding previously visited states. This memory is used to evaluate a reward that quantifies the success of a policy to achieve the prescribed state. We extend the kinetic-theory description of collective learning in spatially homogeneous systems [Phys. Rev. Lett. 134, 248302 (2025)] and derive formal evolution equations for the distribution of policies across the population. A central outcome of our theory is the emergence of an effective reward function that fully determines the evolution of the policy distribution and encapsulates the microscopic details of the agents physical and memory dynamics. We obtain closed equations for the policy mean and variance which admit explicit time-dependent solutions under the assumption of Gaussian-distributed memories and polices. To illustrate the framework, we present a series of minimal microscopic models, considering both perfect and partial separation of physical, memory and policy exchange time scales, as well as models with one- and two-dimensional policies. The obtained theoretical results compare well with agent-based numerical simulations. The theory captures key aspects of collective learning, including the influence of population diversity and reward fluctuations on learning performance. Finally, we discuss potential applications to swarm robotics and machine learning, and highlight connections with classical models of biological evolution, including the Replicator equation and the Moran model.", "url": "https://arxiv.org/abs/2607.02171", "type": "理论+数值", "summary": "1. 该工作构建了同质自适应智能体群体通过局域信息交换实现预定宏观状态集体学习的动理学理论。\n2. 理论核心在于从智能体物理、记忆与策略交换的微观动力学出发，推导出完全决定策略分布演化的有效奖励函数。\n3. 这为解析群体多样性及奖励涨落对学习性能的影响，并衔接群体机器人、机器学习与复制者方程等生物进化模型提供了统一框架。", "summary_source": "deepseek", "authors": [{"name": "Gerhard Jung"}, {"name": "Johann Asnacios"}, {"name": "Misaki Ozawa"}, {"name": "Olivier Dauchot"}, {"name": "Eric Bertin"}], "featured_authors": [{"name": "Gerhard Jung"}, {"name": "Johann Asnacios"}, {"name": "Misaki Ozawa"}, {"name": "Olivier Dauchot"}, {"name": "Eric Bertin"}], "author_count": 5}, {"id": "2607.02183", "category": "cond-mat", "title": "A density matrix renormalization group approach to quantum point contacts", "abstract": "Using the density matrix renormalization group (DMRG) combined with the correction-vector method, we investigate the competition between an harmonic potential and repulsive interactions in a one-dimensional fermionic system. The parabolic confinement induces spatial inhomogeneity, and by tuning its curvature one can continuously interpolate between a potential well--relevant for cold-atom setups--and a quantum barrier, as realized in mesoscopic systems such as quantum point contacts. We analyze how the ground-state particle distribution evolves with the strength and sign of the confining potential and how the confinement reshapes the spectral weight of the local density of states (LDOS) at the center of the chain. In the barrier regime, a localized peak emerges in the electron part of the spectrum ($\\omega >0$) as a direct consequence of the potential. In contrast, in the well configuration and for weak interactions, a localized feature persists but shifts to the hole sector ($\\omega <0$). However, for stronger interactions, the LDOS no longer displays clear signatures of the external potential, indicating that correlations dominate over single-particle confinement.", "url": "https://arxiv.org/abs/2607.02183", "type": "理论", "summary": "1. 该工作采用密度矩阵重整化群结合校正矢量方法，研究一维费米子系统中谐振势阱/势垒与排斥相互作用的竞争。\n2. 其核心在于通过局域态密度谱权重的演变，揭示从势阱到势垒转变中单粒子束缚态与多体关联的竞争机制，以及强相互作用下关联对势垒特征的抹除。\n3. 这为研究一维非均匀费米子系统的量子输运和关联主导行为提供了可扩展的理论框架，对冷原子与介观物理具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Nair Aucar Boidi"}, {"name": "Mikhail Kiselev"}], "featured_authors": [{"name": "Nair Aucar Boidi"}, {"name": "Mikhail Kiselev"}], "author_count": 2}, {"id": "2607.02216", "category": "cond-mat", "title": "Exact amplitude relations for diffusion-limited aggregation", "abstract": "It has been known for several decades that the third moment of the multifractal spectrum of the harmonic measure for diffusion-limited aggregates is linked to the underlying fractal dimension of the cluster. We demonstrate, using an argument based on the Hastings-Levitov formulation of diffusion-limited aggregation (DLA) in two dimensions, an even stronger link, connecting the universal amplitude of the third moment to the cluster fractal dimension. This argument can be used for both the standard circular DLA as well as DLA in a cylinder (i.e., with periodic boundary conditions).", "url": "https://arxiv.org/abs/2607.02216", "type": "理论", "summary": "1. 该工作基于Hastings-Levitov形式，建立了二维扩散限制聚集(DLA)中调和测度第三矩的普适振幅与团簇分形维数之间的精确关系。\n2. 其核心是通过解析论证揭示第三矩振幅并非独立参数，而是由分形维数唯一决定，且结论适用于圆形与圆柱形(周期性边界)两种几何构型。\n3. 这为理解DLA标度普适性提供了严格的解析约束，并为推导其他多分形矩的精确关系指明了新路径。", "summary_source": "deepseek", "authors": [{"name": "Thomas C Halsey"}], "featured_authors": [{"name": "Thomas C Halsey"}], "author_count": 1}, {"id": "2607.02219", "category": "cond-mat", "title": "Differentiable inverse design of short-range order in high-entropy alloys: from target sro to target property", "abstract": "Short-range order (SRO) governs the mechanical response of multi-principal-element alloys, but designing an alloy for a target property usually means solving two disconnected problems: building a structure matching a desired SRO pattern, then separately checking its property, with no shared optimization. This work replaces the standard random-swap search (reverse Monte Carlo) with a gradient-based approach: atom occupancy is treated as continuous rather than fixed, so the whole process can be tuned using gradient descent, the same method used to train neural networks. This builder matches random-swap accuracy on small systems, but is six times faster and eight times more accurate on large 4000-atom systems, and scales smoothly to alloys with many elements without extra bookkeeping. A physics-based correction term, adapted from prior two-element work and extended here to many elements, keeps designed structures thermodynamically realistic rather than just numerically matching the target SRO pattern. A small neural network then predicts mechanical properties directly from composition and SRO statistics, closing the loop from target property back to structure. Tested on nine face-centered-cubic and body-centered-cubic alloys, the pipeline captured SRO-driven stiffness changes from -20% to +57%, and cell-size checks showed at least 864 atoms are needed to get the direction and size of these changes right, since the commonly used 108-atom cells can mislead. Against real simulations for a cobalt-chromium-nickel alloy, the method matched three of four target stiffness values within 6%. The method is released as an open-source Python package, anisro, offering a practical route to gradient-based, property-driven alloy design.", "url": "https://arxiv.org/abs/2607.02219", "type": "数值", "summary": "1. 该工作提出基于梯度下降的可微分逆设计方法，将高熵合金短程有序的构建与目标力学性能优化整合为单一连续框架，替代了传统随机交换搜索。\n2. 技术核心在于将原子占据连续化并引入适用于多元素的热力学修正项以保持结构现实性，使4000原子体系设计速度快六倍、准八倍，成功捕捉九种FCC/BCC合金中-20%至+57%的短程有序驱动刚度变化，且对CoCrNi合金匹配三个目标刚度值误差在6%以内。\n3. 该方法以开源包anisro形式发布，结合神经网络从成分和SRO统计直接预测性能，实现了从目标性质到结构的闭环设计，并指明了可靠模拟需至少864原子以避免有限尺寸误导。", "summary_source": "deepseek", "authors": [{"name": "Tiancheng Ding"}, {"name": "Conrard Giresse Tetsassi Feugmo"}], "featured_authors": [{"name": "Tiancheng Ding"}, {"name": "Conrard Giresse Tetsassi Feugmo"}], "author_count": 2}, {"id": "2607.02221", "category": "cond-mat", "title": "Alternative routes to universal diversity scaling in component systems: from proteomes to large language models", "abstract": "Remarkably common statistical laws characterize the diversity scaling and its fluctuations across a wide range of complex \"component systems\". These regularities are often interpreted as signatures of an underlying innovation mechanism driving the growth of component diversity, but the basic ingredients necessary for their emergence remain poorly understood. In particular, from language and technological artifacts to genomes and gene expression patterns, the number of distinct components grows sublinearly with system size, while its variance scales approximately as the square of its mean. This behavior is consistent across diverse systems, raising the question of whether general constraints or emergent principles underlying diversity and innovation define the architectures of realizations with different numbers of components. To address this question, we derive analytical conditions for the joint emergence of these two diversity laws within a broad class of growth models, showing that they require a specific asymptotic dependence of the innovation probability on diversity and system size. We then demonstrate that the same macroscopic laws arise in a different class of models with latent heterogeneity, where quadratic fluctuation scaling always emerges asymptotically as a consequence of general statistical principles, essentially the law of total variance, without explicitly assuming an innovation mechanism or any specific rule for system assembly. We compare these predictions with empirical data from language, genomes, LEGO constructions, and texts generated by large language models. Our results show that empirical diversity scaling laws strongly constrain generative models but do not uniquely identify the mechanisms generating diversity, revealing a close correspondence between innovation-driven growth models and latent-variable descriptions.", "url": "https://arxiv.org/abs/2607.02221", "type": "理论", "summary": "1. 该工作通过解析推导与模型对比，揭示了从蛋白质组到大语言模型等组件系统中多样性标度律的不同涌现路径。\n2. 其核心在于证明平方涨落标度可由隐变量模型中的全方差律自然导出，无需预设创新机制，从而统一两类生成框架。\n3. 这强烈约束了生成模型但无法唯一确定底层机制，启发后续需结合额外统计特征区分多样性产生过程。", "summary_source": "deepseek", "authors": [{"name": "Andrea Mazzolini"}, {"name": "Leonardo Agasso"}, {"name": "Filippo Valle"}, {"name": "Michele Caselle"}, {"name": "Marco Cosentino Lagomarsino"}, {"name": "Matteo Osella"}], "featured_authors": [{"name": "Andrea Mazzolini"}, {"name": "Leonardo Agasso"}, {"name": "Filippo Valle"}, {"name": "Michele Caselle"}, {"name": "Marco Cosentino Lagomarsino"}, {"name": "Matteo Osella"}], "author_count": 6}, {"id": "2607.02236", "category": "cond-mat", "title": "Efficient Large-Scale STEM-EELS Simulations With Torched-TACAW", "abstract": "The time auto-correlation of auxiliary wave functions (TACAW) method enables efficient simulations of ultra-low-loss electron energy loss spectra (EELS) arising from vibrational and magnon excitations. In practical applications to realistic materials systems, however, TACAW calculations become challenging due to the large system sizes required for models containing defects, interfaces, impurities, or grain boundaries, as well as the substantial computational cost and data throughput associated with molecular dynamics and multislice calculations. Here we discuss a practical methodology for large-scale TACAW simulations and present torched-TACAW, a freely available implementation of the TACAW part of the described workflow for efficient STEM-EELS simulations. The overall approach combines molecular dynamics based on foundational machine-learned interatomic potentials, partitioning of elongated supercells, and on-the-fly processing of multislice outputs in order to enable near ab initio quality simulations with tractable memory use and data flow. Using rutile TiO2 as a model system, we analyze important numerical aspects of the method, including windowing and supercell partitioning, and demonstrate atomic-resolution STEM-EELS simulations for thick samples.", "url": "https://arxiv.org/abs/2607.02236", "type": "理论+数值", "summary": "1. 该工作提出了一种结合机器学习力场分子动力学、超胞分割与实时多片层处理的大规模STEM-EELS模拟方法，并实现了自由软件torched-TACAW。\n2. 其技术要点在于通过分割细长超胞和即时处理多片层输出，在可控内存与数据流下达到近从头算质量，并分析了加窗与超胞分割等数值因素。\n3. 这为含有缺陷、界面与杂质的实际材料体系中振动与磁振子能谱的高效原子分辨模拟提供了可行方案与计算启发。", "summary_source": "deepseek", "authors": [{"name": "Martin Osmera"}, {"name": "João Vaz"}, {"name": "Paul M. Zeiger"}, {"name": "Ján Rusz"}], "featured_authors": [{"name": "Martin Osmera"}, {"name": "João Vaz"}, {"name": "Paul M. Zeiger"}, {"name": "Ján Rusz"}], "author_count": 4}, {"id": "2607.02238", "category": "cond-mat", "title": "Interfacial Strain and Structural Defects Govern the Performance of Tantalum Superconducting Waveguide Resonators", "abstract": "Tantalum (Ta) is a promising material for reaching long coherence times in superconducting qubits. A detailed understanding of the underlying structure-property relationship remains elusive though. In the present study, we sputter-deposited 200 nm thick Ta films on high-resistivity silicon (100) substrates at temperatures ranging from T = 20°C to 600°C, as well as on different seed layers (Nb, TiN and TaN). Alpha-Ta thin films were readily obtained at temperatures above 500°C and on all seed layers. The films were characterized in terms of surface morphology, residual-resistance ratio, crystal phase composition and superconducting transition temperature, as well as RF-performance using coplanar waveguide resonators. Internal quality factors of up to 1.5 million were measured at 100 mK in the single-photon regime. Despite similar bulk material properties, alpha-Ta films on different seed layers exhibit markedly different RF-performance, which we attribute to dissimilar strain and structural defects at the substrate-metal interfaces. Williamson-Hall analysis of XRD data reveals a clear correlation between decreasing microstrain and increasing quality factor. Cross-sectional HR-TEM further supports this interpretation by directly resolving interfacial disorder. Our results highlight the critical role of interface engineering in optimizing superconducting thin films for low-loss quantum computing circuitry.", "url": "https://arxiv.org/abs/2607.02238", "type": "理论+数值", "summary": "1. 该工作通过在不同温度和种子层上溅射沉积钽薄膜，系统研究了界面应变与结构缺陷对超导波导谐振器性能的影响。\n2. 其卖点在于结合Williamson-Hall XRD分析与截面高分辨透射电镜，直接建立了微应变与品质因子之间的定量关联并验证了界面无序的微观机制。\n3. 这为通过界面工程优化超导薄膜以降低量子计算线路损耗提供了明确的材料与工艺指导。", "summary_source": "deepseek", "authors": [{"name": "Moritz Singer"}, {"name": "Harsh Gupta"}, {"name": "Benedikt Schoof"}, {"name": "Elena Willinger"}, {"name": "Anton Orekhov"}, {"name": "Marc Tornow"}], "featured_authors": [{"name": "Moritz Singer"}, {"name": "Harsh Gupta"}, {"name": "Benedikt Schoof"}, {"name": "Elena Willinger"}, {"name": "Anton Orekhov"}, {"name": "Marc Tornow"}], "author_count": 6}, {"id": "2607.02265", "category": "cond-mat", "title": "Josephson and Spin Currents in Coupled Polariton Condensates", "abstract": "We analyze particle and spin currents in networks of coupled spinor exciton-polariton condensates arranged as plaquettes and regular polygonal rings. In closed geometries, spin-conserving and TE-TM-induced spin-flip tunnelling combine to generate circulating particle currents, hidden spin counterflows, and bond-dependent spin-current patterns. For the minimal geometries - an equilateral triangle, and a square plaquette - we derive analytical expressions for edge-resolved currents from stationary configurations obtained by energy minimization. We then show how particle, in-plane spin, and out-of-plane spin currents partition the parameter plane and provide direct signatures of the equilibrium phases. Finally, we apply the same current-resolved diagnostics to larger rings, where winding numbers and a branch-invariant common-phase coherence metric organize the resulting phase structure.", "url": "https://arxiv.org/abs/2607.02265", "type": "理论+数值", "summary": "1. 该工作分析了由自旋激子极化激元凝聚体组成的闭合网络（三角形与正方形plaquette及多边环）中的粒子流与自旋流。\n2. 主要物理在于自旋守恒隧穿与TE-TM自旋翻转隧穿的耦合，产生了隐藏的自旋逆流、键依赖自旋流模式，并通过能量极小化导出了边分辨流的解析表达式。\n3. 这为利用电流诊断方法直接识别平衡相提供了手段，并可通过绕数和分支不变相干度将更大环结构的相位有序化。", "summary_source": "deepseek", "authors": [{"name": "A. Kudlis"}, {"name": "I. Yu. Chestnov"}, {"name": "A. N. Osipov"}, {"name": "A. V. Yulin"}, {"name": "I. A. Shelykh"}], "featured_authors": [{"name": "A. Kudlis"}, {"name": "I. Yu. Chestnov"}, {"name": "A. N. Osipov"}, {"name": "A. V. Yulin"}, {"name": "I. A. Shelykh"}], "author_count": 5}, {"id": "2607.02267", "category": "cond-mat", "title": "Disorder-induced superconductivity in graphene", "abstract": "Correlated phases of matter are typically investigated in crystalline systems, where disorder is considered to be detrimental. However, intriguing exceptions exist, such as superconductivity being enhanced in amorphous realizations of Al and Bi. Here, we demonstrate that superconductivity can even emerge entirely from disorder, using monolayer graphene as an example. In the clean limit, the semi-metallic nature of graphene requires prohibitively strong electronic interactions to achieve superconductivity. Despite the inherently random nature of disorder, we show that introducing low concentrations of vacancies or hydrogenation in graphene provides a large density of low-energy states that easily induce superconductivity. For conventional $s$-wave pairing, disorder induces a finite superconducting order parameter for arbitrarily weak attractive interactions. Rather than forming isolated superconducting puddles, global phase coherence is established through a finite superfluid weight of purely geometrical origin. Away from the chiral limit of vacancies, hydrogenation similarly yields a finite transition temperature and nonzero superfluid weight for weak interactions. For unconventional nearest-neighbor pairing, typically more disrupted by disorder, superconductivity exhibits quantum-critical-like behavior, yet phase coherence persists at low interaction strengths, with mixed $d$-wave symmetries. Our work demonstrates the robust emergence of macroscopic superconducting phase coherence engineered entirely from microscopic disorder.", "url": "https://arxiv.org/abs/2607.02267", "type": "理论", "summary": "1. 本文以单层石墨烯为例，展示了无序可独立诱导超导相，在清洁极限下半金属态需极强相互作用才可实现超导。\n2. 其核心在于低浓度空位或氢化产生大量低能态，对任意弱s波吸引相互作用即可产生有限超导序参量，并通过纯几何起源的超流权重实现全局相位相干。\n3. 该工作揭示了无序工程可稳健实现宏观超导相干性，为在原本不利体系中利用无序设计超导态提供了物理机制与可行路径。", "summary_source": "deepseek", "authors": [{"name": "Jannes van Poppelen"}, {"name": "Tomas Löthman"}, {"name": "Annica M. Black-Schaffer"}], "featured_authors": [{"name": "Jannes van Poppelen"}, {"name": "Tomas Löthman"}, {"name": "Annica M. Black-Schaffer"}], "author_count": 3}, {"id": "2607.02268", "category": "cond-mat", "title": "How wrong is too wrong: A numerical study on the relevance of positional memory in the generalized Langevin equation", "abstract": "If a generalized Langevin equation contains a potential of mean force, it cannot at the same time contain a linear memory kernel and a fluctuating force that obeys a second fluctuation dissipation theorem in the sense of Kubo, and be exact. As modelers often prefer to use generalized Langevin equations that have the first three properties, one needs to ask how close the model dynamics is to the dynamics of the underlying microscopic system. To test this, we analyze a simple model system in which the potential of mean force can be well approximated by a polynomial of low order. The exact generalized Langevin equation of this model contains memory terms in addition to the linear one. We show that these additional terms, at least for the model system regarded in this article, are important for the dynamics and cannot be neglected if one intends to model core aspects of the underlying system correctly.", "url": "https://arxiv.org/abs/2607.02268", "type": "理论+数值", "summary": "1. 该工作通过数值模拟检验了广义朗之万方程中仅保留线性记忆核而忽略高阶记忆项的近似的有效性。\n2. 其核心发现是，即便平均力势可被低阶多项式近似，额外的高阶记忆项对系统动力学仍至关重要，不可忽略。\n3. 这提醒建模者在使用含线性记忆核与涨落-耗散定理的广义朗之万方程时需谨慎，其适用性可能严重偏离底层微观系统。", "summary_source": "deepseek", "authors": [{"name": "Abhir Mehrotra"}, {"name": "Fabian Koch"}, {"name": "Tanja Schilling"}], "featured_authors": [{"name": "Abhir Mehrotra"}, {"name": "Fabian Koch"}, {"name": "Tanja Schilling"}], "author_count": 3}, {"id": "2607.02282", "category": "cond-mat", "title": "Velocity and force autocorrelations in Brownian dynamics with a Lorentz force", "abstract": "We derive a general relation between the velocity and force autocorrelation tensors (VACT and FACT) for a Brownian particle subject to an external magnetic field. Using time-symmetry arguments, we show that, for the full Langevin dynamics, the VACT depends only on the FACT, independently of the details of the interaction potential. Under the hypothesis of timescale separation between thermalization and interaction-driven motion, this relation simplifies considerably in the overdamped (Brownian) limit. A central feature of the overdamped result is that, unlike in the field-free case, the part of the VACT that controls the self-diffusion of the particle couples to the antisymmetric part of the FACT, with a coupling strength set by the ratio of the cyclotron frequency to the thermalization rate. We validate and illustrate the formalism on an exactly solvable model: a dimer of charged particles bound by a harmonic potential. Depending on the relative sign of the particle charges, the magnetic field is found to produce either a transient suppression of mobility and diffusion that is fully recovered at long times, or a persistent oscillatory force autocorrelation, regions of negative mobility, and a long-time suppression of self-diffusion.", "url": "https://arxiv.org/abs/2607.02282", "type": "理论", "summary": "1. 该工作推导了受磁场布朗粒子速度与力自相关张量间的一般关系，并利用时间对称性证明其不依赖于相互作用势细节。\n2. 核心卖点在于揭示过阻尼极限下，控制自扩散的速度自相关张量与力自相关张量反对称部分耦合，耦合强度由回旋频率与热化速率之比决定。\n3. 这一理论为理解磁场诱导的瞬态或持久迁移率抑制、负迁移率及扩散反常提供了精确可解模型框架，启发非平衡统计物理与磁致输运研究。", "summary_source": "deepseek", "authors": [{"name": "Filippo Faedi"}, {"name": "Abhinav Sharma"}], "featured_authors": [{"name": "Filippo Faedi"}, {"name": "Abhinav Sharma"}], "author_count": 2}, {"id": "2607.02326", "category": "cond-mat", "title": "Fundamental limitations of single-particle Green's-function zeroes as probes of many-body topology", "abstract": "We show that topological invariants constructed from single-particle Green's functions (GFs) cannot reliably diagnose the topology of interacting many-body states. Using coupled interacting SSH chains as a minimal example, we demonstrate that a spin-spin interaction can trivialize the many-body ground state without affecting the GF topological invariant. This breakdown originates from the GF's inability to probe electronic excitations in the Fock sectors responsible for the topological degeneracy. Consequently, GF zeroes are not associated with physical topological quasiparticles and cannot generally characterize interacting topological phases.", "url": "https://arxiv.org/abs/2607.02326", "type": "理论", "summary": "1. 该工作证明了由单粒子格林函数构造的拓扑不变量无法可靠诊断相互作用多体态的拓扑性质。\n2. 其技术核心在于，通过耦合相互作用SSH链实例揭示自旋相互作用可平庸化多体基态而不改变格林函数拓扑不变量，根源是格林函数无法探测负责拓扑简并的Fock扇区中的电子激发。\n3. 这明确了格林函数零点一般不能表征相互作用拓扑相，且与物理拓扑准粒子无直接关联，为相关理论研究提供了实质性约束。", "summary_source": "deepseek", "authors": [{"name": "Emile Pangburn"}, {"name": "Olivier Gingras"}], "featured_authors": [{"name": "Emile Pangburn"}, {"name": "Olivier Gingras"}], "author_count": 2}, {"id": "2607.02358", "category": "cond-mat", "title": "Contrarian Majority Dynamics: Violation of Detailed Balance and Nonequilibrium Steady States", "abstract": "I revisit the Galam Majority Model (GMM) with contrarian agents from a statistical-mechanics perspective, revealing three fundamental features. First, in addition to the GMM simultaneous-update of small discussion groups, I construct a related single-agent stochastic dynamics, providing a Markovian microscopic representation, which is found to yield the same evolution equation. Second, I show that, contrary to what is often stated in the literature, the GMM closed evolution equation for the opinion density is not the result of a mean-field approximation. Indeed, I derive the conventional mean-field dynamics associated with majority-rule interactions and show that it yields a distinct, probabilistic evolution equation contrary the deterministic GMM equation. I therefore identify the GMM as an iterated mean-field dynamics. Third, I investigate the thermodynamic nature of the dynamics obtained from both single-agent and simultaneous updates. Both are shown to violate detailed balance. However, while Kolmogorov's cycle condition is satisfied for single-agent updates, it is violated for simultaneous updates, making the departure from equilibrium stronger in the latter case. I then compute the probability flux in the stationary state and show that it is non-vanishing, confirming the absence of an effective Hamiltonian and establishing that the stationary state is a genuine nonequilibrium steady this http URL results clarify the statistical-mechanical foundations of the GMM and establish contrarian majority dynamics as an intrinsically non-equilibrium process with distinct regimes of irreversibility. Contrarians are not thermal noise.", "url": "https://arxiv.org/abs/2607.02358", "type": "理论", "summary": "1. 该工作从统计力学视角重新审视了含反对者的Galam多数模型(GMM)，揭示了其微观马氏链表示、演化方程非平均场起源以及细致平衡破坏等三个基本特征。\n2. 其核心在于指明GMM的确定性密度演化方程实为迭代平均场动力学，而非通常所声称的均场近似结果；同时证明了单粒子与同步更新两种动力学均违背细致平衡，且后者通过Kolmogorov循环条件亦不满足，展现出更强的不可逆性。\n3. 这为理解社会多数投票过程中内禀的非平衡稳态提供了严格的统计力学基础，并明确指出反对者行为并非等效于热噪声，从而启发对集体决策中不可逆动力学机制的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Serge Galam"}], "featured_authors": [{"name": "Serge Galam"}], "author_count": 1}, {"id": "2607.02359", "category": "cond-mat", "title": "Correlation and entanglement dynamics of free fermions in disguise", "abstract": "We study the nonequilibrium dynamics following a quantum quench in spin chains that can be solved via a mapping to free fermions in disguise. These models feature an exponential degeneracy of all energy eigenvalues, raising the question of the validity of the established framework describing the properties of integrable systems out of equilibrium. We present two main results. First, we develop an analytic method to compute the quasi-momentum distribution function characterizing the generalized Gibbs ensemble, and derive an analytic formula to compute the corresponding expectation values for special observables. Second, we conjecture a modification of the standard formula for the entanglement growth based on the quasi-particle picture, taking into account that each fermion in disguise carries an additional amount of entropy due to the exponential degeneracy of the energy eigenvalues. We test our theoretical predictions against numerical tensor-network computations for different initial states and Hamiltonian parameters. For the local observables, we find excellent agreement. For the entanglement dynamics, we find small deviations suggesting that our conjecture is only approximately correct. Our results represent a first step towards the extension of the established framework of integrable systems out of equilibrium to models hosting free fermions in disguise.", "url": "https://arxiv.org/abs/2607.02359", "type": "理论+数值", "summary": "1. 该工作通过映射到伪装自由费米子，解析研究了可解自旋链在量子淬火后的非平衡动力学，并推导了广义Gibbs系综的准动量分布及特殊观测量期望值。\n2. 其卖点在于针对模型能级指数简并修正了准粒子纠缠增长公式，认为每个伪装费米子因简并携带额外熵，并通过张量网络计算验证了局域观测量而发现纠缠动力学的小偏差。\n3. 这为将可积系统非平衡框架推广至含指数简并能级的新型模型提供了第一步，并启发后续对纠缠动力学的精确解析理论探索。", "summary_source": "deepseek", "authors": [{"name": "Dávid Szász-Schagrin"}, {"name": "Pablo Bayona-Pena"}, {"name": "Lorenzo Piroli"}, {"name": "Eric Vernier"}], "featured_authors": [{"name": "Dávid Szász-Schagrin"}, {"name": "Pablo Bayona-Pena"}, {"name": "Lorenzo Piroli"}, {"name": "Eric Vernier"}], "author_count": 4}, {"id": "2607.02415", "category": "cond-mat", "title": "Bottlenecks in Hamiltonian-Adaptive Resolution Simulation Method for Modeling Interfaces", "abstract": "The Hamiltonian-Adaptive Resolution Simulation (H-AdResS) method allows to combine atomistic and particle-based coarse-grained models in a single simulation box, which makes it very attractive to model systems containing interfaces or reactive regions surrounded by an interacting environment. In our previous work [ arXiv:2604.21867 ], we implemented H-AdResS in LAMMPS 2023 and extended its use to interfaces, focusing on MOF/CO$_2$ interfaces as an example. We found that, despite its advantages, using this method properly for this kind of systems is not trivial. In this work, an in-depth analysis of the impact of the choice of thermostatting schemes and long-range electrostatics models is presented. Even though its Hamiltonian formulation enables performing H-AdResS simulations within constant temperatures ensembles, not every thermostat is appropriate. We demonstrate that Langevin thermostat is a reliable choice for this method, while Nosé-Hoover results in artifacts. In addition, we show that using short-range models such as the Damped Shifted Force method for electrostatics, a popular choice for H-AdResS simulations, can lead to non-physical results when modeling interfaces. The need of capping strategies to deal with discontinuities in forces and energies arising from abrupt changes in resolution is also discussed. Finally, the impossibility of changing the definition of the H-AdResS Hamiltonian to include a gradual interpolation of the bonded degrees of freedom is discussed. We hope that this contribution helps the reader to appropriately set up H-AdResS simulations and to assess if this method can be used to accurately model their system of interest.", "url": "https://arxiv.org/abs/2607.02415", "type": "理论+数值", "summary": "1. 本文深入分析了哈密顿自适应分辨率模拟方法在界面体系应用中的瓶颈，重点考察了恒温方案与长程静电模型的选择。\n2. 核心发现表明，Langevin恒温器可靠而Nosé-Hoover引入伪影，且短程Damped Shifted Force静电模型在界面模拟中导致非物理结果，加之必须采用力与能量间断的截断策略。\n3. 该工作为正确配置H-AdResS模拟及判断其能否精确建模特定界面系统提供了关键指导，尤其对含反应区或界面体系的多尺度模拟具有借鉴意义。", "summary_source": "deepseek", "authors": [{"name": "Hari Haran Sudhakar"}, {"name": "Alessandra Serva"}, {"name": "Rocio Semino"}], "featured_authors": [{"name": "Hari Haran Sudhakar"}, {"name": "Alessandra Serva"}, {"name": "Rocio Semino"}], "author_count": 3}, {"id": "2607.02418", "category": "cond-mat", "title": "Intrinsic orbital Hall effect in a nonuniform electric field", "abstract": "Geometric analysis of electronic Bloch states offers a universal framework for understanding electronic properties, yet its role in the transport of orbital angular momentum remains unexplored. In this work, we establish an analytic connection between orbital angular momentum transport and the geometric properties of Bloch wave functions in electronic systems. Focusing on the intrinsic orbital Hall effect in the dc limit under a spatially nonuniform electric field, we show that its conductivity can be expressed in terms of universal geometric quantities, such as the orbital Berry curvature and quantum metric. This formulation provides a term-by-term correspondence with the geometric description of intrinsic charge Hall transport established in previous studies. Using a tight-binding model, we further illustrate that the higher-order orbital Hall response can exhibit enhanced sensitivity to the orientation of an anisotropic sample. Our work deepens the understanding of diverse intrinsic transverse transport phenomena and the role of quantum geometry in electronic systems.", "url": "https://arxiv.org/abs/2607.02418", "type": "理论", "summary": "1. 该工作建立了非均匀电场下轨道角动量输运与布洛赫波函数几何性质的分析联系，聚焦直流极限的本征轨道霍尔效应。\n2. 其核心在于将轨道霍尔电导率用轨道贝里曲率和量子度量等普遍几何量完整表达，并与电荷霍尔输运的几何描述形成逐项对应。\n3. 这为统一理解本征横向输运现象中量子几何的作用提供了理论框架，并预示各向异性样品中可观测的高阶轨道霍尔响应对取向的增强敏感性。", "summary_source": "deepseek", "authors": [{"name": "Min Ju Park"}, {"name": "Jongjun M. Lee"}, {"name": "Hyun-Woo Lee"}], "featured_authors": [{"name": "Min Ju Park"}, {"name": "Jongjun M. Lee"}, {"name": "Hyun-Woo Lee"}], "author_count": 3}, {"id": "2607.02422", "category": "cond-mat", "title": "Complex dynamics in the Sherrington-Kirkpatrick game", "abstract": "We study the outcome of adaptive learning of a large number of players engaging in sets of two-strategy two-player games. We are interested in typical games, and generate the payoff matrices at random at the beginning. The payoff matrices then remain fixed during the learning process. This provides a game theoretic foundation for the Sherrington-Kirkpatrick (SK) game, recently introduced by Garnier-Brun, Benzaquen and Bouchaud. The original model by these authors is a special case, with no bias towards any strategy. We here determine stability of learning for SK games with general random bias, and find that the nature of the stable state is affected by random fields. We also introduce a grand-canonical version of the SK game, in which players can choose to abstain. We determine the stability of learning for this game. Our analysis confirms that complex situations involving many players are frequently unlearnable, even if each player only chooses between two different actions. The rate with which players lose memory of past payoffs and the competitiveness of the game emerge as key parameters determining whether learning converges to a unique fixed point, whether there are many fixed points, or if the dynamics remains persistently volatile.", "url": "https://arxiv.org/abs/2607.02422", "type": "理论", "summary": "1. 该工作研究了大量玩家在随机双策略二人博弈中的自适应学习动力学，为Sherrington-Kirkpatrick游戏提供了博弈论基础并推广至含随机偏置与可选弃权的情形。\n2. 其技术卖点在于系统确定了学习稳定性的关键参数——记忆衰减率与竞争度——揭示了从唯一固定点到多稳态或持续波动的分岔行为。\n3. 这为理解复杂多智能体系统中“不可学习性”的涌现条件以及统计物理与博弈论的交叉提供了明确的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Desmond Chan"}, {"name": "Tobias Galla"}], "featured_authors": [{"name": "Desmond Chan"}, {"name": "Tobias Galla"}], "author_count": 2}, {"id": "2607.02445", "category": "cond-mat", "title": "Curvature-induced host-mediated polarization of active particles", "abstract": "Polar collective motion commonly arises from alignment interactions, particle anisotropy, or an imposed directional bias. Here we identify a distinct route to polar order that does not rely on alignment interactions between the active particles. We show that non-aligning active Brownian particles embedded in a dense passive medium can develop polar coherence when confined to a compact curved surface. Persistent active motion redistributes stress through the host and creates passive-depleted regions. When the stress-spreading length becomes comparable to the sphere radius, these regions merge into elongated scars that channel active motion and, through feedback with the active flux, promote a common direction of motion. Removing the passive host suppresses polar coherence even though the active particles continue to cluster on the same sphere. Our results establish an environment-mediated route to collective polarity in which symmetry breaking emerges from the coupling between active motion, passive stress redistribution, and compact geometry.", "url": "https://arxiv.org/abs/2607.02445", "type": "理论", "summary": "1. 该工作通过数值模拟揭示嵌入致密被动介质的活性布朗粒子在球面等紧凑曲面上，无需粒子间对齐相互作用即可自发形成极性集体运动。\n2. 其核心机制在于活性运动驱动被动介质应力再分布，当应力传播长度与曲率半径相当时，被动耗尽区合并为拉长疤痕，疤痕约束活性流并通过反馈循环促进单向运动，移除介质则极性消失。\n3. 这建立了曲率与弹性介质耦合诱导活性极性的新范式，为设计无直接相互作用的极性活性材料以及理解生物系统中环境介导的集体行为提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Giulia Janzen"}, {"name": "D. A. Matoz-Fernandez"}], "featured_authors": [{"name": "Giulia Janzen"}, {"name": "D. A. Matoz-Fernandez"}], "author_count": 2}, {"id": "2607.02506", "category": "cond-mat", "title": "On the emergence of quantum many-body chaos for tunably-broken integrability", "abstract": "We develop a quantitative theory for the emergence of quantum many-body chaos as integrability is broken via a tunable parameter. In a circuit model of free fermions, 'doped' with a tunable density of integrability-breaking gates, we uncover the microscopic mechanisms underpinning the crossover from early-time integrable behaviour to late-time chaos through the lens of the out-of-time-ordered correlators (OTOCs). The integrability-breaking gates act as local, in spacetime, hotspots which locally amplify the OTOCs such that an accumulation of them eventually leads to fully-developed chaos. We identify the explicit characteristic time and length scales governing this crossover, as well as the dependence of the chaotic OTOC characteristics -- such as the butterfly velocity and front broadening -- on the integrability-breaking parameter.", "url": "https://arxiv.org/abs/2607.02506", "type": "理论", "summary": "1. 该工作发展了可调破坏可积性下量子多体混沌涌现的定量理论，基于掺杂破坏可积门电路的OTOC分析。\n2. 其核心在于揭示破坏可积门作为时空局域热点，通过局部放大OTOC积累驱动早期可积到完全混沌的交叉。\n3. 这为确定混沌特征量（如蝴蝶速度与前沿展宽）对破缺参数的依赖及交叉标度行为提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Sounak Biswas"}, {"name": "Sthitadhi Roy"}, {"name": "Roderich Moessner"}], "featured_authors": [{"name": "Sounak Biswas"}, {"name": "Sthitadhi Roy"}, {"name": "Roderich Moessner"}], "author_count": 3}, {"id": "2607.01301", "category": "hep-th", "title": "Dirac oscillator in a helically twisted spacetime with axial torsion", "abstract": "We investigate the Dirac oscillator in a helically twisted spacetime endowed with a uniform axial torsion. Starting from an orthonormal coframe, we compute the Levi--Civita spin connection explicitly and separate the geometric contribution from the axial contortion. Retaining the matrix $\\beta$ in the radial Moshinsky coupling, we show that the second-order problem is the ordered product $\\hat\\Pi_+\\hat\\Pi_-$ rather than the square of a single operator. The resulting radial dynamics is a coupled, self-adjoint two-component system in which the spin connection supplies the correct cylindrical radial operator, while the off-diagonal metric generates the helical combination $m/r-\\omega k$ and a Coulomb-like geometric term. A finite-element solution reproduces the planar Dirac-oscillator spectrum in the flat limit and reveals asymmetric dependence on the longitudinal momentum, avoided level crossings, and a supersymmetric zero mode at $E=Mc^2$. The axial torsion and longitudinal momentum preserve this zero mode, whereas the helical twist lifts it quadratically. Sector-resolved thermodynamic functions are obtained from the relativistic bound-state spectrum. The explicit spinors further determine longitudinal vector and axial currents, and a Witten-index analysis identifies the helical twist as the deformation that removes the protected zero mode.", "url": "https://arxiv.org/abs/2607.01301", "type": "理论", "summary": "1. 该工作从正交余标架出发显式计算了螺旋扭曲时空中狄拉克振子的Levi-Civita自旋连接与轴向扭曲，精确求解了耦合径向系统的完整束缚态谱与显式旋量。\n2. 其物理核心在于径向动力学由有序乘积主导，自旋连接贡献正确圆柱径向算子，而非对角度规引入螺旋耦合项m/r-ωk与类库仑几何势，有限元解在平坦极限复现标准谱并揭示对纵向动量的不对称依赖、避免交叉及超对称零模。\n3. 轴向挠率与纵向动量保持零模而螺旋扭曲二次提升之，扇区分辨热力学函数与纵向矢量/轴流为探测几何诱导量子效应提供可观测量，Witten指数分析明确螺旋形变是解除零模保护的关键几何调制。", "summary_source": "deepseek", "authors": [{"name": "Matheus D. Moro"}, {"name": "Fabiano M. Andrade"}, {"name": "Faizuddin Ahmed"}, {"name": "Edilberto O. Silva"}], "featured_authors": [{"name": "Matheus D. Moro"}, {"name": "Fabiano M. Andrade"}, {"name": "Faizuddin Ahmed"}, {"name": "Edilberto O. Silva"}], "author_count": 4}, {"id": "2607.01319", "category": "hep-th", "title": "What's the Matter with 3D Gravity?", "abstract": "We revisit the problem of minimally coupling matter to Einstein gravity in three dimensions with negative cosmological constant. By working in the worldline formalism, we construct a classical phase space on an initial time surface $\\Sigma$, which we quantize using geometric quantization. States in the Hilbert space correspond to Virasoro conformal blocks with operators of conformal weight $h<c/24$. As an application of our formalism, we compute the partition function on thermal $\\text{AdS}_3$ through equivariant localization. Our answer reproduces the AdS$_3$ Wilson spool and agrees with the known one-loop result. It further serves as a conjecture for the value of the path integral of gravity minimally coupled to a massive scalar field in thermal $\\text{AdS}_3$ to all orders in $G_N$.", "url": "ht
