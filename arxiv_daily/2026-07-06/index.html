tps://arxiv.org/abs/2607.01319", "type": "理论", "summary": "1. 该工作重新审视三维负宇宙常数爱因斯坦引力中的最小耦合物质问题，基于世界线形式构建初始时间曲面上经典相空间并执行几何量子化。\n2. 其技术核心在于将希尔伯特空间态映射为共形权重满足h<c/24的Virasoro共形块，并通过等变局域化计算热AdS₃上的配分函数。\n3. 所得配分函数不仅复现AdS₃ Wilson spool及已知单圈结果，还作为引力最小耦合标量场的路径积分至所有G_N阶的猜想。", "summary_source": "deepseek", "authors": [{"name": "Robert Bourne"}, {"name": "Jackson R. Fliss"}, {"name": "Bob Knighton"}], "featured_authors": [{"name": "Robert Bourne"}, {"name": "Jackson R. Fliss"}, {"name": "Bob Knighton"}], "author_count": 3}, {"id": "2607.01321", "category": "hep-th", "title": "The Art of Networking: Networks of Trivalent 10d Heterotic Junctions", "abstract": "We initiate the study of networks of 10d string theories connected by junctions implied by the cobordism conjecture. Focusing on the recently constructed junction of the three 10d non-tachyonic heterotic theories, we generalize its $(0, 1)$ heterotic worldsheet description to construct arbitrary networks. For one-dimensional networks, we formulate their topology in terms of graph theory and provide a simple worldsheet realization for general graphs. We then extend our analysis to higher-dimensional networks, describing e.g. nucleation in a theory of bubbles of pairs of other theories. We also discuss compact configurations, which define a novel class of compactifications in which different sectors propagate on different compact spaces, in a way reminiscent of compactifications on quantum geometries like $S^1 \\vee S^1$.", "url": "https://arxiv.org/abs/2607.01321", "type": "理论", "summary": "1. 该文启动了由协边猜想所暗示的10维弦理论网络研究，重点构造了三价非快子异质结的网络。\n2. 技术核心在于推广(0,1)异质世界片描述以构建任意图结构的网络，并利用图论分析一维拓扑，进而拓展到高维气泡成核与紧致构型。\n3. 这些网络定义了一类新型紧致化，其中不同理论扇区传播于不同紧致空间，类似于量子几何S^1 ∨ S^1上的紧致化。", "summary_source": "deepseek", "authors": [{"name": "Chiara Altavista"}, {"name": "Edoardo Anastasi"}, {"name": "Roberta Angius"}, {"name": "Angel M. Uranga"}, {"name": "Chuying Wang"}], "featured_authors": [{"name": "Chiara Altavista"}, {"name": "Edoardo Anastasi"}, {"name": "Roberta Angius"}, {"name": "Angel M. Uranga"}, {"name": "Chuying Wang"}], "author_count": 5}, {"id": "2607.01322", "category": "hep-th", "title": "Wormholes as red herrings: reflection positivity and the reconstruction of unitary quantum field theories", "abstract": "As Coleman famously argued, the apparent breakdown of partition-function factorization in quantum gravity associated with Euclidean wormholes is a red herring, arising from a hidden average over an ensemble of theories. We present a direct analog of Coleman's argument for the apparent breakdown of Hilbert-space factorization associated with spatial wormholes, i.e., Einstein--Rosen bridges. Our main result is the following reconstruction theorem for quantum field theories: unitary QFTs are determined, up to unitary isomorphism, by their closed-manifold partition functions; every reflection-positive partition function arises from a unitary quantum field theory; and the states prepared by manifolds span the space of invariant states under the reconstructed theory's symmetry group. Interpreting the result gravitationally, we conclude that any apparent breakdown of Hilbert-space factorization is a red herring, arising from restricting to an incomplete spectrum of charged states.", "url": "https://arxiv.org/abs/2607.01322", "type": "理论", "summary": "1. 该工作将Coleman关于欧几里得虫洞导致配分函数因子化破缺的论证推广至空间虫洞（爱因斯坦-罗森桥），并建立了幺正量子场论的重构定理。\n2. 其卖点在于利用反射正定性证明：闭流形配分函数（至多幺正同构）唯一决定幺正QFT，且每个反射正定配分函数对应一个幺正QFT，流形制备态张成对称群不变子空间。\n3. 这为引力解释提供洞见：希尔伯特空间因子化破缺仅是红鲱鱼，来源于荷谱不完整，凸显荷完备性在恢复因子化中的关键作用。", "summary_source": "deepseek", "authors": [{"name": "Jacob McNamara"}, {"name": "Zhencheng Wang"}], "featured_authors": [{"name": "Jacob McNamara"}, {"name": "Zhencheng Wang"}], "author_count": 2}, {"id": "2607.01327", "category": "hep-th", "title": "Algorithmic Dualization of Unitary Circular Quivers", "abstract": "We introduce a field-theoretic algorithm to find the $SL(2,\\mathbb{Z})$ duality web of 3d $\\mathcal{N}=4$ circular quiver theories with unitary gauge groups, extending the algorithm for linear quivers. Although circular and linear quivers share the same local structure, the circular topology requires additional ingredients, which we formulate in terms of topological and baryonic QFT blocks, together with new $SL(2,\\mathbb{Z})$ duality moves acting on them. For good circular quivers, this provides a field-theoretic derivation of mirror symmetry and extends it to the full $SL(2,\\mathbb{Z})$ duality web. We then study bad circular quivers, distinguishing between local badness, associated with under-balanced gauge nodes, and global badness, arising from the circular topology itself. In particular, we analyze the magnetic and electric dual frames of globally bad circular quivers and provide additional evidence for the proposed duality by matching the Higgs branch index with the dual Coulomb branch index. The latter exhibits a structure reminiscent of permutation-group gauging and reveals a refined relation to the ADHM quiver, flowing to the $\\mathcal{N}=8$ infrared fixed point.", "url": "https://arxiv.org/abs/2607.01327", "type": "理论", "summary": "1. 该工作提出了一个场论算法，用于系统构建三维N=4幺正圆形箭图理论的SL(2,Z)对偶网。\n2. 其技术核心在于引入拓扑与重子QFT块及作用于其上的新对偶操作，从而将局部坏（欠平衡节点）与全局坏（拓扑起源）的箭图对偶性统一处理。\n3. 这为解释全局坏箭图的对偶框架提供了场论依据，并通过对Higgs与Coulomb分支指数的匹配揭示了其与ADHM箭图及N=8红外不动点的内在关联。", "summary_source": "deepseek", "authors": [{"name": "Riccardo Comi"}, {"name": "Chiung Hwang"}, {"name": "Fabio Marino"}], "featured_authors": [{"name": "Riccardo Comi"}, {"name": "Chiung Hwang"}, {"name": "Fabio Marino"}], "author_count": 3}, {"id": "2607.01328", "category": "hep-th", "title": "Quark Anti-Quark Fusion and Walking RG Flows", "abstract": "We study the fusion of two conjugate conformal line defects on the sphere. At small separation, their spectrum is governed by a universal Fusion Master Equation. Below a critical coupling, the fused defect has two conformal fixed points; at criticality, they collide and move into the complex plane, producing walking RG behaviour. Although individual energy levels then drift with the UV scale and are scheme dependent, the $SL(2,\\mathbb{R})$ Casimir continues to commute with the Hamiltonian below that scale. This organises the spectrum into conformal families and fixes a universal, scheme-independent density of states. We derive this structure in the planar ladder model and obtain an exact finite-coupling description of conjugate $1/2$-BPS Wilson-line fusion in planar ${\\cal N}=4$ SYM using the Quantum Spectral Curve. We test our results against perturbation theory and semiclassical string theory.", "url": "https://arxiv.org/abs/2607.01328", "type": "理论", "summary": "1. 该工作研究球面上两个共形线缺陷的融合，从小分离极限下的普适融合主方程出发。\n2. 低于临界耦合时融合缺陷有两个共形固定点，临界处出现行走重整化群，而SL(2,R) Casimir算符在低于该标度时仍与哈密顿对易，从而将能谱组织为共形族并给出普适、方案无关的态密度。\n3. 这为平面梯形模型和平面N=4 SYM中1/2-BPS威尔逊线融合提供了精确有限耦合描述，并对相关场论的可解结构具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Filipp Chernikov"}, {"name": "Nikolay Gromov"}, {"name": "Amit Sever"}], "featured_authors": [{"name": "Filipp Chernikov"}, {"name": "Nikolay Gromov"}, {"name": "Amit Sever"}], "author_count": 3}, {"id": "2607.01351", "category": "hep-th", "title": "Wigner negativity in Krylov space and emergent semiclassicality", "abstract": "We propose that the Krylov basis gives a semiclassical representation of dynamics in general large-$N$, complex, many-body systems. As a probe of this semiclassicality, we study the growth of Wigner negativity -- a measure of the complexity of classical simulation -- under time evolution in Krylov space in several solvable models. We begin with 2d CFTs, initially in either the vacuum or the thermofield double state on a line excited by a primary operator. In both cases, Wigner negativity remains an $O(1)$ constant and does not grow at late times, indicating approximately classical dynamics in the Krylov basis. We then study random matrix theory with the maximally entangled state between two copies as the initial state. For general one-cut matrix models, we argue that Wigner negativity in the Krylov basis grows as $t^{1/2}$ at large $O(1)$ times but does not scale with the Hilbert space dimension, thus indicating semiclassical dynamics in Krylov space. Finally, in the double-scaled SYK model, we find an approximately classical phase (constant negativity) at early times and a semiclassical phase ($t^{1/2}$ growth) at late times. In all these examples, Wigner negativity either remains constant or grows slowly, demonstrating emergent semiclassicality of dynamics in Krylov space.", "url": "https://arxiv.org/abs/2607.01351", "type": "理论", "summary": "1. 该工作提出Krylov基为大N复杂多体系统提供半经典表示，并通过Wigner负性在时间演化下的增长探测其涌现半经典性。\n2. 在2d CFT、随机矩阵理论和双标度SYK模型中，Wigner负性保持常数或仅以t^{1/2}缓慢增长，不随希尔伯特空间维数发散，揭示Krylov空间中经典化动力学。\n3. 这一发现启发了从量子复杂度视角理解大N系统的经典极限，并为利用Krylov空间降低经典模拟难度提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Vijay Balasubramanian"}, {"name": "Pawel Caputa"}, {"name": "Onkar Parrikar"}, {"name": "Vivek Singh"}], "featured_authors": [{"name": "Vijay Balasubramanian"}, {"name": "Pawel Caputa"}, {"name": "Onkar Parrikar"}, {"name": "Vivek Singh"}], "author_count": 4}, {"id": "2607.01385", "category": "hep-th", "title": "Quantum JT Gravity in a box as a Pöschl-Teller Scattering Problem", "abstract": "We present a canonical quantization of Jackiw-Teitelboim gravity with finite Dirichlet boundary conditions, using the geodesic length between the two boundaries and its conjugate momentum as reduced phase space variables. The dynamics is recast as the scattering problem of a nonrelativistic particle in a repulsive Pöschl-Teller potential, naturally embedded within a hyperbolic reduction of the $\\mathfrak{sl}(2,\\mathbb{R})$ Casimir. We obtain exact wavefunctions of the universe and the disk partition function, interpreted as a transition matrix element between states of vanishing bare length. In the asymptotic limit, the theory reduces to Liouville quantum mechanics and reproduces the standard Schwarzian spectral density. At finite cutoff, however, the spectral measure exhibits genuinely nonperturbative corrections, absent in existing $T\\bar T$ treatments. We also obtain closed form expressions for thermal two-point functions in terms of Wilson functions and propose diagrammatic rules for time- and out-of-time-ordered four-point functions. We further address the issue of the branch cut singularity of the quasi-local energy and propose a UV completion of the model in which the Brown-York charge is analytically continued beyond the black hole horizon. This continuation naturally extends the scattering problem to configurations that foliate the black hole interior.", "url": "https://arxiv.org/abs/2607.01385", "type": "理论", "summary": "1. 该工作对有限Dirichlet边界条件的Jackiw-Teitelboim引力进行正则量子化，并将其动力学重新表述为排斥性Pöschl-Teller势中的散射问题。\n2. 通过精确求解宇宙波函数和圆盘配分函数，揭示了有限截断下谱测度的非微扰修正，并给出了热两点函数及四点函数的图解规则。\n3. 这为边界截断JT引力的非微扰完备化提供了明确框架，并通过解析延拓准局部能量自然将散射问题推广到黑洞内部。", "summary_source": "deepseek", "authors": [{"name": "Luca Griguolo"}, {"name": "Jacopo Papalini"}, {"name": "Lorenzo Russo"}, {"name": "Domenico Seminara"}, {"name": "Alex Tarana"}], "featured_authors": [{"name": "Luca Griguolo"}, {"name": "Jacopo Papalini"}, {"name": "Lorenzo Russo"}, {"name": "Domenico Seminara"}, {"name": "Alex Tarana"}], "author_count": 5}, {"id": "2607.01653", "category": "hep-th", "title": "Preparing a Thermofield Double State with Feedback Quantum Algorithms", "abstract": "The efficient preparation of correlated thermal states, such as the Thermofield Double (TFD) state, is a fundamental prerequisite for simulating quantum gravity models and many-body thermodynamics on quantum processors. In this work, we investigate the ground state preparation of the Two Coupled Sachdev-Ye-Kitaev model, known as the Maldacena-Qi model, which is dual to a traversable wormhole in $AdS_2$, utilizing feedback-based quantum algorithms. We demonstrate that the standard feedback-based quantum algorithm (FALQON) and its time-rescaled variant (TR-FALQON) face severe kinetic limitations in this system, failing to converge to the highly entangled ground state when initialized in trivial product states. To overcome these barriers, we propose the hybrid ITE-TR-FALQON protocol, which integrates the imaginary-time evolution present in imaginary-time-enhanced FALQON (ITE-FALQON) with the time-rescaling mechanism. Our numerical results indicate that the introduction of non-unitary dynamics is strictly necessary to break symmetry traps and filter out excited states, while time-rescaling drastically accelerates algorithm convergence. The proposed method achieves fidelities close to unity and reproduces the von Neumann and Rényi entropy spectra of the exact TFD state with high precision.", "url": "https://arxiv.org/abs/2607.01653", "type": "理论", "summary": "1. 该工作研究利用反馈量子算法制备热场双态，具体针对Maldacena-Qi模型的基态。\n2. 其核心技术在于提出混合ITE-TR-FALQON协议，集成虚时演化的非幺正动力学以打破对称陷阱，并引入时间重标机制加速收敛。\n3. 这为在量子处理器上高效制备高度纠缠热态提供了可行路径，对量子引力模拟与多体热力学计算具有明确指导意义。", "summary_source": "deepseek", "authors": [{"name": "Guilherme E. L. Pexe"}, {"name": "Lucas A. M. Rattighieri"}, {"name": "Felipe F. Fanchini"}, {"name": "Dario Rosa"}, {"name": "Amilson R. Fritsch"}], "featured_authors": [{"name": "Guilherme E. L. Pexe"}, {"name": "Lucas A. M. Rattighieri"}, {"name": "Felipe F. Fanchini"}, {"name": "Dario Rosa"}, {"name": "Amilson R. Fritsch"}], "author_count": 5}, {"id": "2607.01778", "category": "hep-th", "title": "Morse Bridge between Planar Kepler and Hyperbolic Landau Dynamics", "abstract": "We show that two paradigmatic systems, the planar Kepler--Coulomb problem and the Landau problem on the hyperbolic plane $H^2$, are connected by a common one-dimensional mediator: the Morse Hamiltonian. On the Kepler side, a Liouville transformation and coupling-constant metamorphosis turn the radial dynamics into the Morse problem, with the Kepler polar angle becoming the Morse evolution parameter. On the Landau side, horocyclic reduction of the hyperbolic magnetic dynamics gives the same Morse Hamiltonian, with a quantum half-density correction. Consequently, the radial Kepler problem and the fixed-horocyclic-momentum sectors of the hyperbolic Landau problem are mapped to one Morse spectral problem, relating their bound spectra, continuum thresholds, resonances and scattering data. We further show that the Landau time evolution has a Kepler-conic form and reduces to the bound, threshold and scattering trajectories of the Morse system. The resulting dictionary connects Kepler conics with magnetic circles, horocycles and hypercycles, and turns the magnetic $SL(2,\\mathbb R)$ symmetry of the Landau problem into the spectrum-generating algebraic structure of the Morse system.", "url": "https://arxiv.org/abs/2607.01778", "type": "理论", "summary": "1. 该工作证明平面Kepler-Coulomb问题与双曲平面Landau问题通过一维Morse哈密顿量相连。\n2. 其技术核心在于利用Liouville变换、耦合常数蜕变及horocyclic约化，将两者径向动力学映射到同一Morse谱问题。\n3. 所建词典连接Kepler圆锥曲线与磁圆、horocycles等几何对象，并将Landau磁对称性转化为Morse系统的谱生成代数。", "summary_source": "deepseek", "authors": [{"name": "Mikhail S. Plyushchay"}], "featured_authors": [{"name": "Mikhail S. Plyushchay"}], "author_count": 1}, {"id": "2607.01790", "category": "hep-th", "title": "Uniqueness and Analytic Structures of Bosonic String Effective Amplitudes", "abstract": "We revisit the zero-transcendentality sector of bosonic string effective amplitudes with spin-1 external states, conjectured to correspond to a mass-deformed $(DF)^2$ theory, known as the $(DF)^2{+}\\text{YM}$ theory. Imposing gauge invariance, locality, and cyclicity under minimal assumptions uniquely fixes a set of dimension-raising operators and leads to a recursive construction of amplitudes from Yang-Mills amplitudes in the $\\alpha'{\\to}0$ limit. At finite $\\alpha'$, certain derivative operators dressed with gauge invariant and $\\alpha'$-dependent factors, what we call $\\textit{inverse operators}$, reconstruct the full bosonic string effective amplitudes, yielding compact expressions that universally factorize into tachyon-pole coefficients times Yang-Mills-Scalar amplitudes. This structure holds at arbitrary multiplicity and also extends to the amplitudes of the pure $(DF)^2$, $(DF)^2{+}\\phi^{3}$ and $(DF)^2{+}\\text{YM}{+}\\phi^{3}$ theories.", "url": "https://arxiv.org/abs/2607.01790", "type": "理论", "summary": "1. 该工作重新审视了玻色弦有效振幅的零超越性扇区，通过规范不变性、局域性和循环性唯一确定了维数提升算符集，并实现了振幅的递归构建。\n2. 其核心在于引入“逆算符”，以规范不变且依赖α'的因子修饰导数算符，从而将弦有效振幅重构为速子极系数与杨-米尔斯-标量振幅之积的紧凑因式分解形式。\n3. 该结构对任意多点振幅成立，并可扩展至纯(DF)^2、(DF)^2+φ³等理论，为揭示弦论有效场论中振幅的解析结构与动力学起源提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Qu Cao"}, {"name": "Fan Zhu"}], "featured_authors": [{"name": "Qu Cao"}, {"name": "Fan Zhu"}], "author_count": 2}, {"id": "2607.01873", "category": "hep-th", "title": "Lubkin-Page typicality bounds for Type~II von~Neumann factors", "abstract": "Typicality arguments for emergent spacetime rely on the Lubkin-Page bounds, which show that generic quantum states have vanishing correlations between subsystems. These bounds assume a tensor-product Hilbert space (a Type~I von~Neumann algebra), but the observable algebras in quantum field theory and quantum gravity are generically Type~II or Type~III, raising the question of whether the bounds survive. We prove that they do for all Type~II von~Neumann factors. For the hyperfinite Type~II$_1$ factor with a tripartite decomposition $R \\cong A \\otimes B \\otimes E$, the mutual information between subsystems $A$ and $B$ vanishes as $O((d_A d_B / d_E)^2)$ in finite-dimensional approximations, provided $d_A d_B \\leq d_E$ (Theorem~1). For Type~II$_\\infty$ factors, including the gravitational algebras constructed via the crossed-product method by Witten and by Chandrasekaran, Longo, Penington, and Witten, the bound acquires an additional exponential suppression controlled by the Bekenstein-Hawking entropy (Theorem~2). We identify the obstructions to extending the result to Type~III factors and discuss the open question of whether the commutant of the observable algebra can serve as a natural thermal bath that tightens the bound further.", "url": "https://arxiv.org/abs/2607.01873", "type": "理论", "summary": "1. 该工作证明了Lubkin-Page子系统间关联消失的典型性界限对Type II von Neumann因子仍然成立。\n2. 对于Type II_∞因子（包括通过交叉乘积构造的引力代数），界限获得由Bekenstein-Hawking熵控制的额外指数压制。\n3. 这指出了向Type III因子推广的障碍，并提出了观测代数交换子是否可作为自然热浴以进一步收紧界限的开放问题。", "summary_source": "deepseek", "authors": [{"name": "Zhi-Wei Wang"}, {"name": "Samuel L. Braunstein"}], "featured_authors": [{"name": "Zhi-Wei Wang"}, {"name": "Samuel L. Braunstein"}], "author_count": 2}, {"id": "2607.01930", "category": "hep-th", "title": "Tuning quantum magic of pure quantum chaotic states with a gravity dual", "abstract": "Quantum magic is a fundamental resource that quantifies to what extent quantum states can be efficiently simulated on a classical computer. We study it for states constructed from the Sachdev-Ye-Kitaev (SYK) Hamiltonian with $N$ Majoranas by the fermionic anti-flatness (FAF). We show analytically that, in the large $N$ limit, the quantum magic of pure Kourkoulou-Maldacena (KM) states, dual to a quantum black hole with an end-of-world particle behind the horizon, is linear in $N$ with a slope, depending on the black hole temperature, that can be tuned between zero and $1/2$. By contrast, the FAF of Gaussian states evolved in real time with the SYK Hamitonian approaches $\\approx N/2$ exponentially at a rate given by a multiple of the leading Ruelle-Pollicot resonance. Subleading corrections in $N$ for SYK energy eigenstates, computed numerically for $N \\leq 54$ by combining Krylov subspace with GPU acceleration techniques, decay exponentially with $N$, but power-law if the SYK couplings are sparsified, and are order of magnitude larger for states close to the ground state, a region with an established gravity analogue. Our results offer new insights about the relation between quantum information, quantum chaos and low-dimension quantum gravity.", "url": "https://arxiv.org/abs/2607.01930", "type": "理论", "summary": "1. 该工作通过SYK哈密顿量构建的纯量子混沌态（KM态），解析计算了大N极限下量子奇迹（fermionic anti-flatness）随黑洞温度可调的行为。\n2. 其核心发现是KM态量子奇迹线性于N且斜率在0至1/2间可调，而高斯态实时演化下的FAF则以Ruelle-Pollicott共振倍数速率指数趋近N/2。\n3. 这为理解量子信息、量子混沌与低维量子重力间的关联提供了可解析验证的定量纽带，并揭示了本征态中接近基态区域的重力对应增强。", "summary_source": "deepseek", "authors": [{"name": "Antonio M. García-García"}, {"name": "Xianlong Liu"}, {"name": "Jie-ping Zheng"}], "featured_authors": [{"name": "Antonio M. García-García"}, {"name": "Xianlong Liu"}, {"name": "Jie-ping Zheng"}], "author_count": 3}, {"id": "2607.01999", "category": "hep-th", "title": "Local symmetry and the dependence on extended spacetime", "abstract": "We show that linearised E theory possesses a local symmetry at low levels provided the parameters of the local symmetry obey differential conditions that restrict their dependence on the extended spacetime. In the decomposition of E theory that leads to Siegel theory, also known as Double Field theory, we also find the analogous restrictions on the parameters. They are different to the section conditions which are universally used in this context. We also show that the dilaton equation of Siegel theory is invariant under the local symmetry if the parameters satisfy an analogous non-linear constraint on the parameters. We argue that there is no need to impose conditions on the fields of E theory or Siegel theory.", "url": "https://arxiv.org/abs/2607.01999", "type": "理论", "summary": "1. 该工作揭示了线性化E理论在低能级具有局域对称性，且对称参数需满足微分条件以限制其在扩展时空中的依赖性。\n2. 主要卖点在于发现这些参数约束不同于双场理论中通用的截面条件，并证明Siegel理论中膨胀子方程在非线性约束下保持局域对称不变。\n3. 这暗示无需对理论中的场施加额外条件，为理解扩展时空对称性与双场理论的深层结构提供了新启发。", "summary_source": "deepseek", "authors": [{"name": "Keith Glennon"}, {"name": "Peter West"}], "featured_authors": [{"name": "Keith Glennon"}, {"name": "Peter West"}], "author_count": 2}, {"id": "2607.02068", "category": "hep-th", "title": "Towards graviton lasing from squeezed ultra-cold systems", "abstract": "In our recent work, arXiv:2604.11474 [hep-th], we have shown that effective detection of gravitons is possible using an array of charged harmonic oscillators in a dynamical electromagnetic field. Using the interaction Hamiltonian of the identical model, we find out that a systematic way of population inversion of the gravitons is possible in ultra-cold atomic systems. We find out that the exponential growth depends strictly on the number of bosons in the system as well as their inherent squeezing of the matter wave packets. A coherent source of gravitons may lead directly to an unavoidable evidence on the existence of gravitons and based on this analysis we propose an experimental proposal for generating true graviton laser.", "url": "https://arxiv.org/abs/2607.02068", "type": "理论", "summary": "1. 该工作从带电谐振子阵列在动态电磁场中有效探测引力子的相同模型出发，利用相互作用哈密顿量，系统性地提出了在压缩超冷原子系统中通过调节玻色子总数与物质波包压缩实现引力子粒子数反转并产生受激辐射的理论方案。\n2. 其核心物理卖点是严格揭示了引力子模式指数增长必须同时依赖于玻色子数目与波包压缩度的乘积，从而为通过原子压缩态精确控制引力子增益、实现类似激光的相干放大提供了可调机制。\n3. 该分析直接给出一个实验提议：利用现有超冷原子平台构造高玻色子数与强压缩的相干引力子源，这为首次直接验证引力子存在以及发展引力子激光器提供了明确且可操作的路线。", "summary_source": "deepseek", "authors": [{"name": "Soham Sen"}, {"name": "Vlatko Vedral"}], "featured_authors": [{"name": "Soham Sen"}, {"name": "Vlatko Vedral"}], "author_count": 2}, {"id": "2607.02145", "category": "hep-th", "title": "Supersymmetric twists in twistor space and holography", "abstract": "We compute some supersymmetric twists of field theories in twistor space, including the minimal supersymmetric and the chiral algebra twists of supersymmetric self-dual Yang-Mills, and the minimal twist of $\\mathcal{N}=1$ self-dual supergravity. In the case of $\\mathcal{N}=4$ we also find their holographic duals in the framework of chiral holography. We find that the minimal twist of gauge theories in twistor space localizes them to spacetime, making the choice of complex structure manifest, and reproducing the minimal twist on spacetime. For superconformal theories we apply a further twist which localizes the theory to a plane contained on spacetime, reproducing the chiral algebra twist of $\\mathcal{N}=4$ sYM. We show that the bulk duals of these twists also localize reproducing the results from twisted holography.", "url": "https://arxiv.org/abs/2607.02145", "type": "理论", "summary": "1. 该工作计算了twistor空间中超对称自对偶Yang-Mills的最小扭变与手征代数扭变，以及𝒩=1自对偶超引力的最小扭变，并确定了𝒩=4情形下的全息对偶。\n2. 其核心在于揭示这些扭变将规范场论局域化至时空或其特定子流形，复现了时空上的相应扭变结构，并证实体对偶也呈现局域化行为。\n3. 这为利用twistor空间与扭变全息框架统一研究超对称场论的局域化机制及体边对应关系提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Matheus Balisa"}, {"name": "Eduardo Casali"}], "featured_authors": [{"name": "Matheus Balisa"}, {"name": "Eduardo Casali"}], "author_count": 2}, {"id": "2607.02233", "category": "hep-th", "title": "Black Holes and Random Variables", "abstract": "We formulate an avatar of the Fyodorov-Hiary-Keating conjecture for black hole microstate counts in quantum gravity. By holography, this implies sharp bounds on interval counts of high-dimension primary operators in conformal field theory. The extremal fluctuations of these counts are characterized by a random variable, with a prescribed tail distribution. At large $N$, these order-one erratic fluctuations set a quantitative limit on the resolution of the semiclassical AdS gravitational path integral. Gaussian random models for state counts arise naturally in this context; we express the phenomenon of erratic $N$-dependence in AdS/CFT as a decorrelation property of these models. Our broader point is to suggest that AdS black hole microstate spectra and their field theory duals should exhibit the extreme value statistics of random matrices, lying in the universality class of Gaussian log-correlated fields.", "url": "https://arxiv.org/abs/2607.02233", "type": "理论", "summary": "1. 该工作基于Fyodorov-Hiary-Keating猜想，为量子引力中黑洞微观态计数构建了具体表述。\n2. 通过全息对偶，导出共形场论高维主算子区间计数的严格边界，其极端涨落由尾分布明确的随机变量刻画。\n3. 这暗示黑洞微观态谱及其场论对偶应属于高斯对数相关场普适类，服从随机矩阵极值统计。", "summary_source": "deepseek", "authors": [{"name": "Eric Perlmutter"}], "featured_authors": [{"name": "Eric Perlmutter"}], "author_count": 1}, {"id": "2607.02454", "category": "hep-th", "title": "Boundary observables in string field theory", "abstract": "Starting from the gauge invariant action for free string field theory with boundary recently constructed in 2506.05969 , we define new gauge invariant observables which are analogous to the Brown-York charges of General Relativity. Just like the Brown-York charges, our observables originate from a boundary tadpole, and are associated to isometries of the SFT gauge group around a given background. The consistency of the construction requires the equation of motion of the background to be satisfied only at the boundary and therefore these observables can also be defined for backgrounds generated by sources in the bulk. As examples of our construction in open string field theory, we compute the flux through the boundary of constant electromagnetic field-strength solutions and the charge associated to the Coulomb solution. As a further example in closed string field theory, we characterize the infinite conserved charges associated to stringy-haired black-hole solutions in two-dimensional string theory. We also construct a generalization of these boundary observables to the full interacting string field theory.", "url": "https://arxiv.org/abs/2607.02454", "type": "理论", "summary": "1. 该工作从自由弦场论的规范不变作用出发，定义了类比Brown-York荷的新边界可观测量。\n2. 其技术核心在于这些可观测量源于边界tadpole，与弦场论规范群的背景等距对称性相关，且背景运动方程仅在边界成立。\n3. 这为带体源的背景（如常电磁场和二维弦毛黑洞）提供了守恒荷的明确构造，并可推广至相互作用弦场论。", "summary_source": "deepseek", "authors": [{"name": "Klaus Kaja"}, {"name": "Carlo Maccaferri"}, {"name": "Ulisses Portugal"}, {"name": "Jakub Vošmera"}], "featured_authors": [{"name": "Klaus Kaja"}, {"name": "Carlo Maccaferri"}, {"name": "Ulisses Portugal"}, {"name": "Jakub Vošmera"}], "author_count": 4}, {"id": "2607.02495", "category": "hep-th", "title": "BRST-BV approach to fields in Poincare patch of AdS", "abstract": "We use the Poincare parametrization of AdS space to develop a general BRST-BV approach for free fields. A general expression for the BRST-BV Lagrangian of fields with arbitrary masses and symmetry types is obtained. We apply this general framework to study totally symmetric massless, massive, and partially-massless fields with arbitrary integer spin and a continuous-spin field. For these fields, both the constrained and unconstrained BRST-BV formulations are developed. In addition, we demonstrate the matching between the obtained BRST-BV Lagrangian and the metric-like Lagrangian formulated in terms of the modified de Donder divergence. Finally, a realization of AdS space symmetries is obtained within the space of fields and antifields entering the BRST-BV formulation.", "url": "https://arxiv.org/abs/2607.02495", "type": "理论", "summary": "1. 该工作基于AdS空间庞加莱坐标，建立了任意质量与对称型自由场所遵循的一般BRST-BV拉格朗日量框架。\n2. 其技术要点在于统一处理全对称无质量、有质量、部分无质量及连续自旋场，并证明了与修正de Donder散度度规拉格朗日量的等价性。\n3. 这为AdS中高阶自旋场的规范对称性实现与约束/非约束形式整合提供了系统方案，可拓展至相互作用情形。", "summary_source": "deepseek", "authors": [{"name": "R.R. Metsaev"}], "featured_authors": [{"name": "R.R. Metsaev"}], "author_count": 1}, {"id": "2607.01446", "category": "math-ph", "title": "Parent Hamiltonians of Ergodic Matrix Product States", "abstract": "Matrix product states (MPS) are quintessential examples of frustration-free gapped ground states of local interactions called parent Hamiltonians. In this work, we investigate parent Hamiltonians for a class of ergodic matrix product states (EMPS), which are MPS defined by site-dependent random tensors $\\{X_j^{[k]}\\}_{j=1}^D$ which are homogeneously distributed at every site $k$ in the spin chain. Here, the EMPS are not translation-invariant but rather statistically translation-invariant. Under a mild injectivity assumption, we show the thermodynamic limit of an EMPS is the unique frustration-free ground state of a parent Hamiltonian on the whole spin chain, which, depending on the statistical properties of the EMPS, may or may not be finite-range. In contrast to the translation-invariant regime, these Hamiltonians need not be gapped. Nevertheless, applying the martingale method while keeping track of local statistics gives conditions for a gap, in addition to pointing towards why there need not be a gap in general. We include examples of EMPS both with and without spectral gaps to illustrate our results.", "url": "https://arxiv.org/abs/2607.01446", "type": "理论", "summary": "1. 该工作研究了由站点依赖随机张量定义的遍历矩阵乘积态的母哈密顿量，证明其在热力学极限下为全链唯一无阻挫基态。\n2. 主要技术卖点在于利用鞅方法结合局域统计给出能隙存在的条件，并揭示母哈密顿量可非有限程且无需有能隙。\n3. 这为理解统计平移不变系统中基态与能隙的关系提供了新视角，并拓展了非平移不变母哈密顿量的构造途径。", "summary_source": "deepseek", "authors": [{"name": "Owen Ekblad"}, {"name": "Eloy Moreno-Nadales"}, {"name": "Eric B. Roon"}, {"name": "Jeffrey H. Schenker"}], "featured_authors": [{"name": "Owen Ekblad"}, {"name": "Eloy Moreno-Nadales"}, {"name": "Eric B. Roon"}, {"name": "Jeffrey H. Schenker"}], "author_count": 4}, {"id": "2607.01447", "category": "math-ph", "title": "Small Denominators and Subresonant Accumulation in Weakly Nonlinear Dispersive Dynamics", "abstract": "We study a small-denominator mechanism in weakly nonlinear dispersive dynamics. After Fourier decomposition, a nonlinear dispersive equation becomes an infinite system of weakly coupled oscillators. Higher-order correction terms may then contain infinite families of nonresonant Fourier interactions whose detunings tend to zero. Such families do not produce exact secular terms, but their accumulated contribution may grow as a power of time. We call this effect subresonant accumulation. The rigorous part of the paper is the analysis of a model forced oscillator and of an abstract subresonant Duhamel sum. If the detuning and coefficients have the form $\\Delta_n\\sim c n^{-p}$ and $B_n\\sim b n^{-\\kappa}$, then the accumulated contribution grows as $t^{1-\\alpha}$, where $\\alpha=(\\kappa-1)/p$. We then show how this mechanism appears in a quartic Fourier family for the Klein--Gordon dispersion law. For the full nonlinear partial differential equation we formulate a conditional approximation result: provided that all remaining resonant and almost resonant interactions are controlled, the subresonant term gives the leading long-time correction.", "url": "https://arxiv.org/abs/2607.01447", "type": "理论", "summary": "1. 该工作研究了弱非线性色散动力学中的小分母机制，揭示了非共振傅里叶相互作用族累积贡献的时间幂次增长效应，即次共振积累。\n2. 主要技术卖点在于建立了失谐与系数呈幂律形式时累积增长指数α=(κ-1)/p的解析关系，并证明该机制在Klein-Gordon色散系统的四次傅里叶族中出现。\n3. 这为弱非线性色散方程中长时间修正的主导来源提供了条件近似框架，启发后续需系统控制共振与近共振相互作用以验证次共振项的主导性。", "summary_source": "deepseek", "authors": [{"name": "P.Yu. Astafieva"}, {"name": "O.M. Kiselev"}], "featured_authors": [{"name": "P.Yu. Astafieva"}, {"name": "O.M. Kiselev"}], "author_count": 2}, {"id": "2607.01805", "category": "math-ph", "title": "$r$-deformed $α$-$z$-Rényi relative entropy", "abstract": "In this article, we consider the $r$-logarithm for defining three-parameter family of Rényi relative entropies that are generalization of the $\\alpha$-$z$-Rényi relative entropies. All the members of $r$-deformed $\\alpha$-$z$-Rényi relative entropies satisfy the necessary axioms to be a divergence. We expose the range of parameters $\\alpha$, $z$ and $r$ for which the data processing inequality holds. We also establish that $r$-deformed $\\alpha$-$z$-Rényi relative entropy is an upper bound of the Tsallis relative entropy. Now, we have two upper bounds of the Tsallis relative entropy, which are $r$-deformed $\\alpha$-$z$-Rényi relative entropy and the other one, which is discussed in literature. We investigate the order relationship between these two upper bounds of the Tsallis relative entropy. We observe that our new upper bound is more tighter when applicable to the density operators.", "url": "https://arxiv.org/abs/2607.01805", "type": "理论", "summary": "1. 该工作引入r-对数构造了三参数r-变形α-z-Rényi相对熵族，并证明了其满足散度公理及数据处理不等式的参数范围。\n2. 核心卖点是该熵是Tsallis相对熵的一个更紧的上界，通过与文献中已有上界的序关系分析，确立了新上界在密度算子应用中的优势。\n3. 这为量子信息理论中相对熵的泛化与优化界提供了新工具，尤其可用于约束量子态区分度与信息处理极限。", "summary_source": "deepseek", "authors": [{"name": "Srikrishna Maity"}, {"name": "Shigeru Furuichi"}, {"name": "Supriyo Dutta"}], "featured_authors": [{"name": "Srikrishna Maity"}, {"name": "Shigeru Furuichi"}, {"name": "Supriyo Dutta"}], "author_count": 3}, {"id": "2607.02093", "category": "math-ph", "title": "Open-boundary integrable quantum circuits with different geometries", "abstract": "We present a complete classification of integrable Yang-Baxter quantum circuits with open boundary conditions and arbitrary circuit geometries. Starting from the standard transfer-matrix construction with two types of staggered inhomogeneities, we derive a general mapping that determines the arrangement of circuit gates in terms of the inhomogeneities and the system size. We conjecture that time-periodic quantum circuits are integrable whenever the local bulk and boundary gates satisfy the Yang-Baxter equation and the same bulk gate is applied exactly once per period to every nearest-neighbor pair of spins. Our construction also provides an algorithm to detect Yang-Baxter integrability for circuits with arbitrary geometries. Furthermore, we introduce a third type of inhomogeneity, denoted by $\\rho$, and demonstrate that the minimum possible circuit depth is four. We show that when these $\\rho$-inhomogeneities are placed at the endpoints and in their immediate neighborhood, the resulting boundary gates can be interpreted as single gates acting on multiple sites. Our construction is fully general and applies to regular $R$-matrices, both of difference and non-difference type, together with their associated boundary matrices. As an application, we consider two-qubit gates corresponding to 6- and 8-vertex $R$-matrices of non-difference form satisfying the Yang-Baxter equation, and we construct the associated reflection matrices that generate integrable quantum circuits.", "url": "https://arxiv.org/abs/2607.02093", "type": "理论", "summary": "1. 该工作对开边界条件下任意几何结构的Yang-Baxter可积量子电路进行了完整分类，基于转移矩阵构造和两种交错非均匀性推导出门排列的通用映射。\n2. 核心在于引入第三种非均匀性参量ρ并证明最小电路深度为四，同时给出检测任意几何电路Yang-Baxter可积性的算法。\n3. 这为在可积电路中系统构造和识别边界门提供了统一框架，并可直接推广至非差形式R矩阵及其关联反射矩阵的电路实现。", "summary_source": "deepseek", "authors": [{"name": "Miguel García Fernández"}, {"name": "Chiara Paletta"}, {"name": "Ana L. Retore"}], "featured_authors": [{"name": "Miguel García Fernández"}, {"name": "Chiara Paletta"}, {"name": "Ana L. Retore"}], "author_count": 3}, {"id": "2607.02264", "category": "math-ph", "title": "Mean-Field Bose--Einstein Condensation and Condensate Ideals in the Resolvent Algebra", "abstract": "This paper studies the imperfect Bose gas after the Kac density law and the mean-field Euler equations have selected a condensed density with positive zero-mode excess. In this BEC regime the selected chemical potential cancels the mean-field shift, so the selected one-particle Hamiltonian is exactly the free one. The resulting zero-mode covariance defines a mean-field BEC ideal in the resolvent algebra, while the nonregular quotient and the direct-integral center record distinct representation-theoretic data. Occupation-number and Brownian-loop formulations recover the same density selection, excess density, ODLRO data, local tests, and the separation between finite-density BEC and Buchholz's stricter infinite-occupation proper-condensate criterion.", "url": "https://arxiv.org/abs/2607.02264", "type": "理论", "summary": "1. 该工作基于Kac密度律与平均场Euler方程选出的正零模过剩凝聚密度，在分辨率代数中构建了平均场Bose-Einstein凝聚的严格数学框架。\n2. 其核心在于零模协方差定义的分辨率代数理想，揭示化学势抵消平均场偏移导致单粒子哈密顿量退化为自由形式，并通过非正则商与直积分中心区分表示论数据。\n3. 这为有限密度BEC与Buchholz无限占据真凝聚的判据分离提供了代数与表示论基础，启发对局域检验与Brownian环版本中ODLRO行为的统一理解。", "summary_source": "deepseek", "authors": [{"name": "Yoshitsugu Sekine"}], "featured_authors": [{"name": "Yoshitsugu Sekine"}], "author_count": 1}, {"id": "2607.02356", "category": "math-ph", "title": "Mesoscopic Linear Statistics for Two Ensembles of Quantum Graphs", "abstract": "We study mesoscopic linear spectral statistics for two ensembles of random quantum graphs. These are defined by a discrete graph $G$ and a unitary-matrix-valued function $U(k)$ indexed by directed edges of $G$. The matrix function $U(k)$ is constructed from unitary matrices $U^{(v)}$ indexed by the neighbours of each vertex $v$. The first ensemble is obtained by sampling the underlying discrete graph uniformly from the set of $d$-regular graphs. The second ensemble is obtained by sampling $U^{(v)}$ uniformly from the Haar measure, independently for each vertex. We prove that the variance of a linear spectral statistic in the large graph limit on polynomial mesoscopic scales coincides with that of the Gaussian Orthogonal/Unitary Ensemble.", "url": "https://arxiv.org/abs/2607.02356", "type": "理论", "summary": "1. 该工作研究了两种随机量子图系综的介观线性谱统计，涉及离散正则图抽样与顶点独立Haar随机酉矩阵构造。\n2. 核心发现在于，大图极限下多项式介观尺度上线性统计量的方差均与高斯正交系综或酉系综一致，显示出普适性。\n3. 这为揭示不同随机图模型在介观尺度上谱统计的普适类归属提供了关键证据，并启发后续量子混沌与图论交叉研究。", "summary_source": "deepseek", "authors": [{"name": "Anna Maltsev"}, {"name": "Mohammed Osman"}], "featured_authors": [{"name": "Anna Maltsev"}, {"name": "Mohammed Osman"}], "author_count": 2}, {"id": "2607.02446", "category": "math-ph", "title": "On a Rosenzweig-Porter-type model", "abstract": "We consider a very general Rosenzweig-Porter-type model, $H=H_0+\\lambda W$, where $H_0$ is an arbitrary Hermitian matrix and $W$ is a standard Wigner matrix. We precisely trace the localization properties of the eigenvectors and the eigenstate thermalisation hypothesis (ETH) as the coupling constant $\\lambda$ interpolates between the trivial $\\lambda=0$ case and the fully mean field regime of large $\\lambda$. Our results hold uniformly in $H_0$ and $\\lambda$, substantially generalising all previous local laws on deformed Wigner matrices even in the mean field regime. Our proof precisely captures the deterministic approximation to the resolvent which exhibits a strongly inhomogeneous structure. As a byproduct, we conclude the emergence of a mobility edge and study the phenomenon of re-entrant localization.", "url": "https://arxiv.org/abs/2607.02446", "type": "理论", "summary": "1. 该工作考虑了一类高度通用的Rosenzweig-Porter型模型，以任意厄米矩阵为未扰分量，精确追踪了特征向量局域化性质及本征态热化假设随耦合常数从零到平均场极限的演化。\n2. 其核心技术卖点在于结果对任意基矩阵和耦合强度一致成立，通过捕获分辨率具有强非均匀结构的确定性近似，大幅推广了变形维格纳矩阵的局部律至平均场区域之外。\n3. 这为理解非均质无序系统中的迁移率边出现及重入局域化现象提供了严格解析框架，并对随机矩阵理论、量子热化及更广泛多体问题的后续研究具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Giorgio Cipolloni"}, {"name": "László Erdős"}, {"name": "Joscha Henheik"}], "featured_authors": [{"name": "Giorgio Cipolloni"}, {"name": "László Erdős"}, {"name": "Joscha Henheik"}], "author_count": 3}, {"id": "2607.01296", "category": "quant-ph", "title": "Exact quantum time compatible with positive energy", "abstract": "What would it be like to be in a superposition of yesterday, today, and tomorrow? This question may seem at best entertaining, but it is necessary, and exploring it allows us to understand how exact irreversible clocks and change are possible, despite the Unruh-Wald and Hegerfeldt-Ruijsenaars no-go theorems forbidding them. Unruh and Wald (1989) proved that if energy is bounded from below, no observable can increase monotonically with the Schrödinger time parameter t. Perfectly monotonic clocks and irreversible observable changes (Hegerfeldt-Ruijsenaars, 1980) seem impossible. From the perspective of the Schrödinger time, the world appears in a superposition of different intrinsic clock states indicating different times and opposite time directions. This seems to directly contradict our daily experiences of time and change. I show that there is no contradiction: from an intrinsic perspective of the world, sharp irreversible changes do happen, because the macroscopic pointer states resolve the superposition of different times. Large-scale time-reversing or discontinuous transitions are not internally observable in the records. From the intrinsic perspective, an unbounded intrinsic-time translation generator plays the role of the Hamiltonian, generating only forward time evolution with respect to the intrinsic time, but not to the Schrödinger parameter t, which is thus not justified to play the role of time. This allows sharp time observables even if the external Hamiltonian is bounded from below. In addition, this leads to a stationary wavefunction of the universe satisfying a Wheeler-DeWitt-type equation, without assuming gravity.", "url": "https://arxiv.org/abs/2607.01296", "type": "理论", "summary": "1. 该工作提出了一个与正能量兼容的精确量子时间框架，通过内在时间视角解释了不可逆时钟与时间叠加态并存的机制。\n2. 其核心卖点在于将无界的内在时间平移生成元作为哈密顿量，在内在时间中仅产生前向演化，同时保持外部哈密顿量有下界，从而规避了Unruh-Wald与Hegerfeldt-Ruijsenaars禁止定理。\n3. 这为理解时间箭头和量子宇宙的定态波函数提供了新理论路径，并暗示宏观指针态对时间叠加的退相干效应。", "summary_source": "deepseek", "authors": [{"name": "Ovidiu Cristinel Stoica"}], "featured_authors": [{"name": "Ovidiu Cristinel Stoica"}], "author_count": 1}, {"id": "2607.01320", "category": "quant-ph", "title": "Logarithmic negativity typically equals exact entanglement cost", "abstract": "Quantum entanglement plays a leading role in modern understanding of physical systems, from quantum phases of matter to quantum gravity. In quantum information theory, one seeks operationally meaningful quantifiers of entanglement, which for large quantum systems are notoriously difficult to evaluate due to the lack of computationally efficient algorithms. In this Letter, we show that for large random induced mixed states the logarithmic negativity, an efficiently computable entanglement measure, generically coincides with the exact entanglement cost under positive-partial-transpose-preserving operations, thereby acquiring a precise operational interpretation. Our results establish logarithmic negativity as an exact characterization of entanglement in generic many-body states and provide a tractable route for quantifying entanglement in complex quantum systems.", "url": "https://arxiv.org/abs/2607.01320", "type": "理论+数值", "summary": "1. 该工作证明，对于大随机诱导混合态，对数负性这一可高效计算的纠缠度量，几乎必然等于正偏转置保持操作下的精确纠缠代价，从而赋予其严格的操作解释。\n2. 实际卖点在于利用随机矩阵理论揭示，对数负性的典型值直接对应纠缠制备成本，克服了操作意义纠缠度量缺乏有效算法的长期瓶颈。\n3. 这将对数负性确立为通用多体量子态纠缠的精确量化工具，为量子多体系统、量子引力和量子信息中的纠缠分析提供了可靠且可计算的方法。", "summary_source": "deepseek", "authors": [{"name": "Bowen Ouyang"}, {"name": "Jonah Kudler-Flam"}], "featured_authors": [{"name": "Bowen Ouyang"}, {"name": "Jonah Kudler-Flam"}], "author_count": 2}, {"id": "2607.01323", "category": "quant-ph", "title": "Noisy quantum circuit simulation with the tensor jump method", "abstract": "Classical simulation of noisy quantum circuits is essential for validating algorithms, benchmarking hardware, and assessing error-mitigation strategies, but remains limited by the exponential cost of density-matrix methods and the high variance of standard trajectory sampling. We introduce a variance-aware tensor network framework that combines the tensor jump method with local TDVP gate evolution on matrix product states and sparse Pauli-Lindblad hardware noise models. Gates are applied as short variational evolutions on the MPS manifold, while noise is sampled per circuit window from Pauli-Lindblad jump sets with state-independent hazards and dissipative contractions that reduce to irrelevant global factors after renormalization. The method supports correlated multi-qubit Lindblad noise consistent with hardware connectivity, including long-range operators on non-adjacent qubits, enabling direct simulation of crosstalk and other connectivity-induced errors beyond local noise models. We develop two unbiased variance-aware unravelings. An analog unitary-mixture unraveling matches the Lindblad generator exactly under symmetric Gaussian or two-point angle laws, while a projector-jump unraveling yields state-independent hazards and closed-form variance laws. Both retain the standard 1/sqrt(N) Monte Carlo convergence but with reduced prefactors. Empirically, projector sampling strongly reduces trajectory variance and bond-dimension growth across many circuit architectures, whereas analog sampling is most effective at weak noise. We demonstrate accurate, scalable noisy-circuit simulation on a 25-qubit noisy XY quench and IBM's 127-qubit kicked-Ising benchmark with long-range depolarizing noise, achieving reduced Monte Carlo variance and favorable MPS bond-dimension growth compared with standard Kraus-insertion baselines.", "url": "https://arxiv.org/abs/2607.01323", "type": "理论+数值", "summary": "1. 该工作提出基于张量跳跃法的含噪量子电路经典模拟框架，结合局部TDVP门演化和稀疏Pauli-Lindblad噪声模型，降低密度矩阵方法的指数成本与标准轨迹采样的高方差。\n2. 核心卖点在于两种无偏方差感知解开方案：类比幺正混合解开精确匹配Lindblad生成器，投影子跳跃解开实现态无关风险与闭合方差律，二者均降低1/√N收敛预因子并抑制键维增长。\n3. 这为硬件连通性相关的远程噪声（如串扰）提供直接模拟能力，在25量子比特XY淬火和127量子比特横场伊辛基准中验证了可扩展性与低方差优势。", "summary_source": "deepseek", "authors": [{"name": "Maximilian Fröhlich"}, {"name": "Aaron Sander"}, {"name": "Martin Eigel"}, {"name": "Robert Wille"}, {"name": "Michael Hintermüller"}], "featured_authors": [{"name": "Maximilian Fröhlich"}, {"name": "Aaron Sander"}, {"name": "Martin Eigel"}, {"name": "Robert Wille"}, {"name": "Michael Hintermüller"}], "author_count": 5}, {"id": "2607.01326", "category": "quant-ph", "title": "One-Body Purity, Non-Gaussianity, and Entanglement in Interacting Integrable Models", "abstract": "When describing entanglement in typical midspectrum eigenstates of many-body lattice Hamiltonians, two paradigms have emerged that capture the behavior observed in integrable and nonintegrable systems, Haar-random fermionic Gaussian states and Haar-random pure states, respectively. Remarkably, the former capture the behavior of interacting integrable systems, whose eigenstates are non-Gaussian. We argue that the paradigm that captures both the entanglement properties and the lack of Gaussianity in integrable systems is that of random superpositions of polynomially many Gaussian states. In contrast, eigenstates of nonintegrable systems are consistent with being described by random superpositions of exponentially many Gaussian states. We gain this understanding by comparing analytical and numerical results for the one-body purity, the non-Gaussianity, and the entanglement entropy of the random superpositions and the Hamiltonian eigenstates.", "url": "https://arxiv.org/abs/2607.01326", "type": "理论+数值", "summary": "1. 该工作针对多体晶格哈密顿量典型中谱本征态，提出以多项式数量费米子高斯态随机叠加作为可积相互作用系统纠缠与非高斯性的统一描述范式。\n2. 通过严格比较单体纯度、非高斯性度量与纠缠熵的分析及数值结果，确立了可积与不可积系统本征态分别对应多项式与指数数量高斯态随机叠加。\n3. 这统一解释了可积系统本征态非高斯性与其纠缠谱类高斯性的共存机制，并为多体量子态高斯性与纠缠起源的区分提供了理论基准。", "summary_source": "deepseek", "authors": [{"name": "Rafał Świętek"}, {"name": "Maksymilian Kliczkowski"}, {"name": "Lev Vidmar"}, {"name": "Marcos Rigol"}], "featured_authors": [{"name": "Rafał Świętek"}, {"name": "Maksymilian Kliczkowski"}, {"name": "Lev Vidmar"}, {"name": "Marcos Rigol"}], "author_count": 4}, {"id": "2607.01329", "category": "quant-ph", "title": "Ravines in quantum cost landscapes: opportunities for improved VQA predictions", "abstract": "The geometric and topological structure of quantum cost landscapes (QCLs) governs the optimization and thus the predictive power of variational quantum algorithms (VQAs). We systematically analyze ravines - low-cost paths connecting local minima - using an adapted version of the nudged elastic band (NEB) algorithm, a method originating from theoretical chemistry. By training quantum neural networks (QNNs) to classify the concentratable entanglement of quantum states, we apply the NEB algorithm and numerically identify ravine structures in QCLs of hardware-efficient ansatzes. Beyond visualizing these ravines, we construct an ensemble prediction framework by averaging predictions from QNNs parameterized along the low-cost NEB path. We introduce a resource-light pre-training metric which quantifies local-prediction variability and serves as a strong performance indicator for VQAs, even beyond the scope of this study. When base classifiers are drawn from circuit and weight initializations exhibiting high local-prediction variability, the quantum-based NEB ensembles outperform both classical and naive quantum alternatives. Moreover, a complexity analysis shows that leveraging the ravine-like structure of QCLs with the QNN NEB approach substantially reduces computational costs compared to naive QNN ensembling. A depth and qubit scaling analysis indicates that ravines persist across both scalings, and that, despite the expected growth in resource requirements with the qubit scaling, the NEB approach also accelerates convergence over the naive alternative.", "url": "https://arxiv.org/abs/2607.01329", "type": "理论+数值", "summary": "1. 该工作系统分析了量子代价景观中连接局部极小值的低代价路径（沟谷），并采用源自理论化学的弹性带算法对其进行数值识别与可视化。\n2. 卖点在于构建沿NEB路径的量子神经网络集成预测框架，引入基于局部预测变异性的轻量预训练指标，该指标可作为VQA性能的强预测因子。\n3. 复杂度分析表明该NEB集成方法显著降低计算成本，且沟谷结构在深度与量子比特尺度下持续存在，为高效变分量子算法预测提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Felix J. Beckmann"}, {"name": "João F. Bravo"}], "featured_authors": [{"name": "Felix J. Beckmann"}, {"name": "João F. Bravo"}], "author_count": 2}, {"id": "2607.01334", "category": "quant-ph", "title": "Decoupling band topology from criticality in bosonic systems", "abstract": "A new understanding of criticality in systems described by quadratic bosonic Hamiltonians (QBHs) ties the emergence of long-range correlations to boundaries of dynamical, not thermodynamical, stability in the parameter space. This separation occurs because the solution of the Heisenberg equations of motion is determined by an auxiliary pseudo- Hermitian dynamical system. The boundary points of a region of dynamical stability can be either exceptional points, generically associated with long-range correlations, or Krein collisions, where correlations can be either long- or short-range. We investigate the interplay of this landscape of possibilities with band topology and boundary physics, by relying on both specific examples and general arguments. The examples stem from a two-parameter, thermodynamically unstable family of QBHs obtained from the bosonic Su-Schrieffer-Heeger model by breaking particle conservation while preserving a chiral pseudo-symmetry. The dynamically stable regime breaks up into different regions labeled by an integer-valued symplectic analogue of the Berry phase. The topological phase transition is a line of Krein collisions, which coincides with the closing of a band gap at zero and causes the localization length of the topologically mandated boundary zero modes to diverge before disappearing. In the unstable regime, we show that the chiral pseudo-symmetry of our model induces, despite the broken particle-number symmetry, enough structure on its associated dynamical matrices to support a topological classification and a bulk-boundary correspondence, independently of dynamical stability. This strongly suggests that bosonic topological physics extracted from basic index theory is insensitive to dynamical stability and, a posteriori, to non-interacting criticality.", "url": "https://arxiv.org/abs/2607.01334", "type": "理论", "summary": "1. 该工作重新理解了二次玻色哈密顿系统中的临界性，将其与参数空间中的动力学稳定边界而非热力学稳定边界关联起来。\n2. 主要卖点在于通过辅助伪厄米动力学系统分离拓扑与临界性，并证明拓扑相变由Krein碰撞线驱动，且在动力学不稳定区间仍存在拓扑分类与体边对应。\n3. 这揭示了玻色拓扑物理本质上对动力学稳定性不敏感，且可独立于无相互作用临界性存在，为拓扑相与临界性解耦的研究提供了新框架。", "summary_source": "deepseek", "authors": [{"name": "Mariam Ughrelidze"}, {"name": "Lorenza Viola"}, {"name": "Emilio Cobanera"}], "featured_authors": [{"name": "Mariam Ughrelidze"}, {"name": "Lorenza Viola"}, {"name": "Emilio Cobanera"}], "author_count": 3}, {"id": "2607.01336", "category": "quant-ph", "title": "Mechanistic Interpretability and Causal Feature Steering of Neural Quantum States via Sparse Autoencoders", "abstract": "Neural Quantum States (NQS) are a remarkably expressive class of variational ansätze for quantum many-body wavefunctions, yet little is understood about their internal mechanisms: trained on variational objectives alone, how do NQS accurately capture physical observables that they have never been explicitly optimized for? In this work, we present a systematic approach to analyze the internal activations of NQS using sparse autoencoders. We extract features from the residual stream and demonstrate that these features strongly correlate with physical observables such as order parameters, staggered magnetization, and half-chain correlators, across both ground state representation and real-time dynamics. Remarkably, the discovery of these features is entirely unsupervised, with no physical labels provided. We further establish that such features causally affect the corresponding observables predicted by NQS, by showing that targeted, post-training intervention on a \\textit{single} feature smoothly and monotonically steers the corresponding observable, while leaving the variational energy nearly unchanged. These results demonstrate that NQS are not merely functional approximators, but encode rich, interpretable internal representations of physical information. Our approach provides both a diagnostic and an intervention tool for NQS, and serves as a foundation for using mechanistic interpretability towards more reliable, transparent NQS.", "url": "https://arxiv.org/abs/2607.01336", "type": "理论+数值", "summary": "1. 本工作利用稀疏自编码器分析神经量子态内部激活，无监督提取与序参量、交错磁化等可观测量高度相关的特征。\n2. 技术核心在于对单一特征进行后训练干预，可实现可观测量平滑单调的因果引导，且几乎不改变变分能量。\n3. 这揭示了神经量子态具备可解释的物理内部表征，为构建更可靠透明的变分波函数方法提供了诊断与操控工具。", "summary_source": "deepseek", "authors": [{"name": "Zihao Qi"}, {"name": "Christopher Earls"}], "featured_authors": [{"name": "Zihao Qi"}, {"name": "Christopher Earls"}], "author_count": 2}, {"id": "2607.01342", "category": "quant-ph", "title": "Design rules for fault-tolerant multi-gate teleportation", "abstract": "Multi-gate teleportation (MGT) packages $n$ remote gates into a single ebit via a 1-ebit fan-out quantum circuit, saving $n{-}1$ entangled pairs relative to sequential gate teleportation. The cost is a correlated failure mode: a single network fault propagates through the fan-out tree, injecting a weight-$n$ Pauli error. We derive a design rule for fault-tolerant packet sizes, $\\nmax^{\\text{corr}}(d) = \\lceil d/2 \\rceil$ for rotated surface codes of distance~$d$ with a correlation-aware decoder ($\\nmax^{\\text{naive}} = \\lfloor d/2 \\rfloor$ without), bounding how many gates can be packaged whilst preserving fault tolerance. Simulation with PyMatching shows that the standard MWPM decoder built from the packet circuit's noise model naturally corrects the correlated error: at network-to-local noise ratios $\\gamma = \\pnet/\\pgate$ up to $100$, the packet matches or surpasses the per-link sequential LER at moderate-to-high $\\gamma$, with the advantage growing with both $\\gamma$ and $d$, whilst reducing the entanglement cost from $n$ ebits to~$1$. Packetisation wins when the network is the bottleneck ($\\gamma \\gg 1$); at $\\gamma \\approx 1$ the $n{-}1$ extra local fan-out gates offset the network savings. No custom decoder is required: the circuit-level noise model already encodes the correlation. These results enable noise-aware distributed circuit compilers to favour fan-out packetisation without sacrificing fault tolerance.", "url": "https://arxiv.org/abs/2607.01342", "type": "理论+数值", "summary": "1. 该工作推导了多门隐形传态中容错包大小的设计规则，给出了旋转表面码距离d下的上界为⌈d/2⌉（关联感知解码器）或⌊d/2⌋（无感知）。\n2. 其技术关键在于揭示单个网络故障通过扇出树传播产生的权重-d保罗错误可由标准MWPM解码器自然纠正，无需定制解码器，且纠缠成本从n ebits降至1 ebit。\n3. 这使噪声感知分布式编译器倾向于在γ>>1时优先采用扇出封装，在不牺牲容错的前提下显著节省纠缠资源，为大规模量子计算网络提供优化路径。", "summary_source": "deepseek", "authors": [{"name": "Mathys Rennela"}], "featured_authors": [{"name": "Mathys Rennela"}], "author_count": 1}, {"id": "2607.01364", "category": "quant-ph", "title": "Decohered toric code under quantum damping noise and its mapping to a classical spin model", "abstract": "We investigate properties of toric codes under realistic damping error channels, which include squeezing, thermal and non-Markovian effects. First, we map the decohered toric code under the generalized amplitude-damping (GAD) and the squeezed generalized amplitude-damping (SGAD) channels to the statistical-mechanical models using the double Hilbert-space formalism. Second, we map the action of the GAD and SGAD channels on the toric code to stochastic Pauli-type errors via Pauli twirling, yielding asymmetric depolarizing channels, and obtain the logical failure probabilities as a function of temperature and squeezing. In both cases, we relate the channel parameters of the GAD and SGAD channels to the spin-coupling constants of the statistical-mechanical model.", "url": "https://arxiv.org/abs/2607.01364", "type": "理论", "summary": "1. 该工作将广义振幅阻尼与压缩广义振幅阻尼噪声下退相干的toric code映射至统计力学模型。\n2. 其核心在于利用双希尔伯特空间形式和Pauli twirling将量子噪声转化为有效经典自旋模型，并建立通道参数与自旋耦合常量的对应关系。\n3. 这为分析实际量子阻尼噪声下拓扑量子纠错性能提供了精确统计力学框架，并可扩展至更一般的退相干通道。", "summary_source": "deepseek", "authors": [{"name": "Nihar Ranjan Dash"}, {"name": "Sanjoy Dutta"}, {"name": "R. Srikanth"}, {"name": "Subhashish Banerjee"}], "featured_authors": [{"name": "Nihar Ranjan Dash"}, {"name": "Sanjoy Dutta"}, {"name": "R. Srikanth"}, {"name": "Subhashish Banerjee"}], "author_count": 4}, {"id": "2607.01393", "category": "quant-ph", "title": "Coherent states in minimal-length Quantum Mechanics: inequivalent characterizations and emergent squeezing", "abstract": "Several approaches to quantum gravity suggest the emergence of a fundamental minimal length at the Planck scale. In quantum mechanics, this feature is naturally encoded through deformations of the Heisenberg algebra, leading to the Generalized Uncertainty Principle (GUP). While the phenomenological implications of GUP have been extensively explored, a consistent characterization of coherent states in minimal-length quantum mechanics remains elusive. In this work, we present a systematic analysis of coherent states for the one-dimensional harmonic oscillator. We show that the canonical equivalence among their standard characterizations - as eigenstates of the annihilation operator, displaced vacuum states and minimum-uncertainty wave packets - is generically lost in the presence of a minimal length. We then investigate the dynamical and semiclassical consequences of this inequivalence by comparing the evolution of generalized coherent states with that of states saturating the GUP. In particular, we demonstrate that minimal-length effects induce nontrivial deformations of phase-space trajectories and give rise to an intrinsic squeezing mechanism with no counterpart in ordinary quantum mechanics. These results establish a unified framework for coherence in GUP-based quantum theories and identify distinctive semiclassical signatures of minimal-length physics, opening a new avenue for probing quantum-gravitational effects.", "url": "https://arxiv.org/abs/2607.01393", "type": "理论", "summary": "1. 该工作系统分析了最小长度量子力学中一维谐振子的相干态，揭示了其标准表征——湮灭算符本征态、位移真空态与最小不确定波包——在广义不确定原理下不再等价。\n2. 其关键发现是GUP饱和态在演化中产生内禀压缩机制，导致相空间轨迹出现非平庸形变，且该效应在普通量子力学中无对应。\n3. 这为基于GUP的量子理论建立了相干态统一框架，并提供了可区分最小长度物理的半经典特征信号，为探测量子引力效应开辟新途径。", "summary_source": "deepseek", "authors": [{"name": "Giuseppe Gaetano Luciano"}, {"name": "Pasquale Bosso"}, {"name": "Daniel Chemisana"}], "featured_authors": [{"name": "Giuseppe Gaetano Luciano"}, {"name": "Pasquale Bosso"}, {"name": "Daniel Chemisana"}], "author_count": 3}, {"id": "2607.01495", "category": "quant-ph", "title": "Lamb Shift of a Static Atom Facing a Rotating Surface", "abstract": "We study how the Lamb shift of a static atom is modified when a nearby planar body rotates rigidly about its normal while the atom is held at a fixed distance $a$. We derive a general formula for the shift in terms of the angularly Doppler-shifted reflection coefficients of the surface, valid for any axially symmetric planar material. Expanding the result to second order in the angular velocity $\\Omega$, we identify two independent contributions associated with the orbital and spin components of the electromagnetic angular momentum. The orbital contribution, proportional to $(\\Omega\\rho)^2$, reproduces locally the Lamb shift induced by a surface translating at the tangential velocity $\\Omega\\rho$, whereas the spin contribution, proportional to $(a\\Omega)^2$, originates from the rotational Doppler shift of the photon helicity and survives even on the rotation axis. We first illustrate the formalism using a graphene sheet and then apply it to finite-thickness Drude and plasma conductors and to doped semiconductors. Rotation enhances the Casimir-Polder interaction for graphene and metallic surfaces, whereas it weakens it for doped semiconductors, depending on whether the carrier plasma frequency reaches the near-field scale $1/a$. Above a threshold angular velocity, the atomic level also acquires a finite linewidth, providing a spectroscopic signature of quantum friction.", "url": "https://arxiv.org/abs/2607.01495", "type": "理论", "summary": "1. 该工作推导了静态原子在刚性旋转平面附近时Lamb位移的普适公式，明确给出其对角速度的二阶展开形式。\n2. 物理创新在于将位移分解为轨道与自旋角动量贡献：前者等效于平动表面效应，后者源自光子螺旋性的旋转Doppler频移，且在转动轴上非零。\n3. 结果揭示旋转可增强或削弱材料表面的Casimir-Polder相互作用，并为光谱探测量子摩擦提供了临界角速度阈值。", "summary_source": "deepseek", "authors": [{"name": "César D. Fosco"}, {"name": "Fernando C. Lombardo"}, {"name": "Francisco D. Mazzitelli"}], "featured_authors": [{"name": "César D. Fosco"}, {"name": "Fernando C. Lombardo"}, {"name": "Francisco D. Mazzitelli"}], "author_count": 3}, {"id": "2607.01635", "category": "quant-ph", "title": "Chiral interaction enhanced magnon bundle emission", "abstract": "In this paper, we suggest a chiral interaction scheme to enhance magnon bundle emission by placing a qubit and a magnon into a cascaded-cavity setup, respectively. It is found that the unidirectional interaction prolongs the lifetime of the target excited state, thereby suppressing the magnon re-excitation and promoting both the average purity and number of two-magnon bundles. Consequently, the chiral interaction not only offers directional control but also improves the quality of the multi-magnon source, which may find potential applications in quantum information processing.", "url": "https://arxiv.org/abs/2607.01635", "type": "理论", "summary": "1. 该工作提出在级联腔中分别耦合量子比特与磁子，利用手性相互作用增强磁子束发射。\n2. 其核心在于单向耦合约化目标激发态退激发并抑制磁子再激发，从而同时提升双磁子束的平均纯度与数目。\n3. 这为高品质多磁子源的定向控制与量子信息处理提供了可行方案与重要启发。", "summary_source": "deepseek", "authors": [{"name": "Zhicai Chen"}, {"name": "Deyi Kong"}, {"name": "Chengdeng Gou"}, {"name": "Xiangming Hu"}, {"name": "Fei Wang"}], "featured_authors": [{"name": "Zhicai Chen"}, {"name": "Deyi Kong"}, {"name": "Chengdeng Gou"}, {"name": "Xiangming Hu"}, {"name": "Fei Wang"}], "author_count": 5}, {"id": "2607.01786", "category": "quant-ph", "title": "Performance of a two-mode coherent superposed channel in continuous-variable quantum teleportation", "abstract": "Glauber's coherent state is denoted by $\\ket{\\alpha}$ and its two-mode extension is represented by $\\ket{\\alpha,\\beta}$. In this work, we introduce a two-mode superposition operator $A=tab+ra^\\dagger b^\\dagger$, whose action on the two-mode coherent state produces the two-mode coherent superposed quantum state $\\ket{\\psi}=(tab+ra^\\dagger b^\\dagger)\\ket{\\alpha,\\beta}$. We investigate the nonclassicality and quantum non-Gaussianity of this state by means of the Wigner distribution and Wigner logarithmic negativity. Once its intrinsic nonclassical and non-Gaussian structure is established, the state is employed as the entangled resource in the Braunstein-Kimble continuous-variable (CV) teleportation protocol. We compute the ideal teleportation fidelity for coherent and squeezed inputs and analyze how the strengths of nonclassicality and non-Gaussianity influence the teleportation efficiency. Our results identify specific parameter regimes where enhanced non-Gaussian features or increased nonclassicality enable fidelities beyond the classical threshold, thereby revealing the operational significance of engineered two-mode quantum states in CV quantum information processing.", "url": "https://arxiv.org/abs/2607.01786", "type": "理论", "summary": "1. 该工作构造了由算子tab+ra†b†作用于两模相干态产生的两模相干叠加态，并系统研究了其非经典性与量子非高斯性对Braunstein-Kimble连续变量量子隐形传态保真度的影响。\n2. 其技术卖点在于利用Wigner分布和对数负性表征态的非经典与非高斯结构，发现调节参数可在特定区域内使相干态和压缩态输入的传态保真度超越经典阈值。\n3. 这一结果揭示了工程化两模非经典非高斯纠缠态在连续变量量子信息处理中的操作意义，为设计基于纠缠的高保真度量子通信方案提供了参数调控途径。", "summary_source": "deepseek", "authors": [{"name": "Deepak"}, {"name": "Arpita Chatterjee"}], "featured_authors": [{"name": "Deepak"}, {"name": "Arpita Chatterjee"}], "author_count": 2}, {"id": "2607.01811", "category": "quant-ph", "title": "Extracting Work from Discrete Quantum Polytropic Processes", "abstract": "We establish an upper bound on extractable work for time-dependent, non-Markovian quantum heat engines operating with finite baths. This bound analytically isolates the distinct thermodynamic penalties arising from system-bath correlations, bath non-equilibrium, and residual interaction energy. Evaluating this framework operationally via a quantum polytropic cavity-optomechanical cycle, we demonstrate that maximal efficiency requires quasi-static operation to successfully harvest coherent, non-Markovian system-bath resonances. Conversely, optimising for maximum power enforces a strict finite-time regime. Under realistic hardware constraints, this acceleration necessitates larger discrete operational steps, where we expect Trotterisation errors to manifest as physical noise. Such noise would irreversibly suppress delicate quantum memory effects, forcing a collapse to the memoryless Markovian Otto limit. Coupled with the permanent energetic tax of switching finite-bath interactions, our results indicate that the exploitation of quantum memory resources and finite-power operation belong to different operational regimes.", "url": "https://arxiv.org/abs/2607.01811", "type": "理论+数值", "summary": "1. 该工作建立了时变非马尔可夫量子热机在有限浴中可提取功的上界，并解析隔离了系统-浴关联、浴非平衡及残余相互作用能的独立热力学惩罚。\n2. 通过量子多方腔光力学循环的操作评估，揭示了准静态操作实现最大效率需利用相干非马尔可夫共振，而功率优化则强制进入有限时域，此处Trotter化误差表现为物理噪声。\n3. 结果表明，利用量子记忆资源与实现有限功率操作归属不同运行区间，有限浴相互作用的永久能量税和记忆效应抑制共同决定了这一分区。", "summary_source": "deepseek", "authors": [{"name": "Vishal Anand"}, {"name": "Swarup Kumar Giri"}, {"name": "Avijit Misra"}, {"name": "Subhadip Mitra"}, {"name": "Samyadeb Bhattacharya"}], "featured_authors": [{"name": "Vishal Anand"}, {"name": "Swarup Kumar Giri"}, {"name": "Avijit Misra"}, {"name": "Subhadip Mitra"}, {"name": "Samyadeb Bhattacharya"}], "author_count": 5}, {"id": "2607.01843", "category": "quant-ph", "title": "Low-ancilla block encodings via Hamiltonian simulation", "abstract": "Block encodings are a central primitive in quantum algorithms, but standard constructions typically require logarithmic ancilla overhead and complicated controlled operations. Recent lower bounds further show that such ancilla overhead is unavoidable for exact constructions in broad circuit models. We show that this barrier can be bypassed in the approximate setting. Specifically, we present a simple single-ancilla construction that converts Hamiltonian evolution into a block encoding of the underlying Hamiltonian, via generalized quantum signal processing. For operators given by Hermitian decompositions $A=\\sum_{j=1}^L \\alpha_j H_j$, we instantiate this block-encoding construction in two ways, which differ in how the required Hamiltonian evolution is implemented. Using higher-order Trotterization, we obtain an $\\varepsilon$-approximate block encoding of $A$ with only one ancilla qubit and circuit depth $\\widetilde O\\big(L(\\alpha/\\varepsilon)^{o(1)}\\big),$ where $\\alpha=\\sum_j \\alpha_j$. Using multiproduct formulas, we obtain circuit depth $\\widetilde O(L)$, at the cost of $O(\\log\\log(1/\\varepsilon))$ ancilla qubits. Our constructions provide alternatives to the standard LCU framework, with a focus on reducing the number of ancilla qubits while maintaining (near-)optimal circuit depth.", "url": "https://arxiv.org/abs/2607.01843", "type": "理论+数值", "summary": "1. 该工作提出仅用单辅助比特实现哈密顿量块编码的通用构造，通过广义量子信号处理将哈密顿时间演化算子转化为其块编码表示。\n2. 针对厄米分解A=∑α_j H_j，利用高阶Trotter化可将电路深度压缩至~O(L(α/ε)^(o(1)))，而采用多乘积公式则可在O(log log(1/ε))个辅助比特下实现~O(L)深度，在近似框架下突破了精确构造对对数级辅助比特的限制。\n3. 该构造为量子算法中块编码的资源高效实现提供了替代LCU的全新路径，尤其有利于在近期间模设备上完成辅助比特敏感的量子模拟与线性代数子程序。", "summary_source": "deepseek", "authors": [{"name": "Yuxin Zhang"}, {"name": "Changpeng Shao"}], "featured_authors": [{"name": "Yuxin Zhang"}, {"name": "Changpeng Shao"}], "author_count": 2}, {"id": "2607.02001", "category": "quant-ph", "title": "Compressive Spectrum Sensing via Spectral Multiplexing in Rydberg Atomic Receiver", "abstract": "Rydberg-atomic receivers exhibit exceptional sensitivity yet are fundamentally constrained by the narrow instantaneous bandwidth, limiting their practical deployment in broadband scenarios. Prior approaches typically expand the bandwidth by physically broadening the atomic response, which usually requires auxiliary electromagnetic fields or stringent parameter tuning, thereby increasing overall system complexity. Here, we propose a compressive spectral multiplexing framework implemented in a waveguide-coupled Rydberg atomic receiver using a frequency-modulated local oscillator (FMLO). The FMLO creates multiple parallel sensing channels that collectively constitute a physical compressive sensing matrix, generating multiple narrowband intermediate-frequency replicas of the input signal. Thus, a broadband microwave spectrum is projected onto a set of narrowband atomic responses. It is demonstrated that spectral information spanning a bandwidth of over 640 MHz can be effectively compressed into the intrinsic atomic bandwidth of 126 kHz, achieving a spectrum compression ratio exceeding 1000. Furthermore, these output replicas offer intrinsic measurement redundancy and facilitate signal-to-noise ratio enhancement. An approximate 10 dB gain is achieved in the required bit-energy-to-noise-power-density ratio for multi-channel communication via maximal-ratio combining. This approach requires no auxiliary fields or broadband electronics, providing a simple and scalable pathway for chip-scale quantum receivers, latency-critical sensing, and next-generation wireless communications.", "url": "https://arxiv.org/abs/2607.02001", "type": "实验", "summary": "1. 该工作提出一种基于调频本地振荡器的压缩频谱复用框架，在波导耦合里德堡原子接收器中实现宽带微波谱感知。\n2. 其技术核心在于通过调频本振建立多个平行传感通道构成物理压缩感知矩阵，将超640 MHz带宽压缩至126 kHz原子带宽，压缩比超1000。\n3. 该方法无需辅助场或宽带电子器件，为芯片级量子接收器、低延迟感知与下一代无线通信提供可扩展实现路径。", "summary_source": "deepseek", "authors": [{"name": "Jun-Rong Chen"}, {"name": "Yi-Ming Yin"}, {"name": "Le-Bin Chen"}, {"name": "Kai Wang"}, {"name": "Bang Liu"}, {"name": "Li-Hua Zhang"}, {"name": "Hao Tian"}, {"name": "Ming-Min Zhao"}, {"name": "Bin-Bin Wei"}, {"name": "Dong-Sheng Ding"}], "featured_authors": [{"name": "Jun-Rong Chen"}, {"name": "Yi-Ming Yin"}, {"name": "Le-Bin Chen"}, {"name": "Ming-Min Zhao"}, {"name": "Bin-Bin Wei"}, {"name": "Dong-Sheng Ding"}], "author_count": 10}, {"id": "2607.02004", "category": "quant-ph", "title": "Quantum sensing of aging transitions", "abstract": "The aging transition is a critical phenomenon in which collective dynamics deteriorate as the fraction of inactive quantum nodes exceeds a threshold, referred to as the aging transition point. Such transitions are relevant to a broad range of biological and physiological systems, and may play an important role in quantum information processing, particularly in the stability assessment and robustness control of quantum networks. Detecting the aging transition point is therefore crucial for predicting network breakdown, since it marks the critical threshold at which a quantum network abruptly loses its stable active state and enters a degraded inactive phase. Here we propose a quantum sensing strategy to locate this transition point using a single qubit probe coherently coupled to a small subset of oscillator nodes. As the inactive fraction p approaches the aging transition point, the excited-state population of the probe becomes highly sensitive to variations in p, leading to a pronounced enhancement of the Fisher information. This critical enhancement enables high-precision estimation of the transition point. Remarkably, this enhancement survives even in the classical regime for the oscillators, where the Fisher information increases dramatically as p approaches the transition region. Our results establish a feasible route to sensing aging transitions in oscillator networks and provide a metrological perspective on critical phenomena in quantum many-body systems.", "url": "https://arxiv.org/abs/2607.02004", "type": "理论", "summary": "1. 该工作提出利用单个量子比特探针相干耦合至少量振子节点，以定位量子网络中老化相变临界点。\n2. 其卖点在于探针激发态布居对非活性节点占比的变化，在临界点附近产生Fisher信息显著增强，从而实现高精度估计。\n3. 这为振子网络中老化相变的灵敏探测提供可行途径，并将临界现象研究引入量子计量学视角。", "summary_source": "deepseek", "authors": [{"name": "Huining Zhang"}, {"name": "Yunbo Zhang"}, {"name": "Xiaoguang Wang"}, {"name": "X. X. Yi"}], "featured_authors": [{"name": "Huining Zhang"}, {"name": "Yunbo Zhang"}, {"name": "Xiaoguang Wang"}, {"name": "X. X. Yi"}], "author_count": 4}, {"id": "2607.02006", "category": "quant-ph", "title": "Local distinguishability of six bipartite orthogonal product states", "abstract": "It is necessary to investigate the local distinguishability of orthogonal quantum state sets, as their adoption in protocol design helps diminish quantum state transmission and cut operational costs. In this paper, we explore the local distinguishability of six orthogonal product states (OPSs) on any bipartite quantum system. We classify different sets of six bipartite OPSs into eight categories by using the vectors of the numbers of pairwise orthogonality relations, where any two states are orthogonal on only one subsystem within each set. We find that these eight categories contain a total of 78 distinct cases, all but five of which are perfectly distinguishable via local operations and classical communication (LOCC). Furthermore, we discuss the local distinguishability of those five distinct cases in detail. Our work explicitly characterizes the local distinguishability of six bipartite OPSs.", "url": "https://arxiv.org/abs/2607.02006", "type": "理论", "summary": "1. 该工作系统研究了任意二分量子系统中六种正交乘积态集合的局域可区分性，并进行了完整分类。\n2. 通过引入两两正交关系数的向量，将六态集合分为八类共78种情形，发现其中73种可由局域操作与经典通信完美区分。\n3. 对剩余五种不可完美区分的情形进行了详细讨论，为优化基于局域分辨的量子信息协议提供了完备的态集分类依据。", "summary_source": "deepseek", "authors": [{"name": "Guang-Bao Xu"}, {"name": "Hua-Kun Wang"}, {"name": "Yu-Guang Yang"}, {"name": "Dong-Huan Jiang"}], "featured_authors": [{"name": "Guang-Bao Xu"}, {"name": "Hua-Kun Wang"}, {"name": "Yu-Guang Yang"}, {"name": "Dong-Huan Jiang"}], "author_count": 4}, {"id": "2607.02054", "category": "quant-ph", "title": "Undamped Modes in an N-Qubit Heisenberg Chain with Collective Dissipation", "abstract": "We investigate the undamped behaviors in a spin-1/2 Heisenberg chain coupled with an environment via collective spin jump operators. Using the Bethe ansatz basis, we show that undamped modes exist for any chain length N >= 3. These modes remain robust against variations in the system parameters, including the specific form of the collective dissipation, and the external field. Exploiting the Bethe ansatz solution, we further characterize the number of undamped modes and their oscillation frequencies, uncovering long-lived coherent dynamics in open integrable quantum systems.", "url": "https://arxiv.org/abs/2607.02054", "type": "理论", "summary": "1. 该工作利用Bethe ansatz基解析研究了集体耗散自旋-1/2海森堡链中的无阻尼模。\n2. 其核心在于证明对任意链长N≥3均存在无阻尼模，且这些模对集体耗散形式和外场等参数变化具有鲁棒性。\n3. 这为开放可积量子系统中长寿命相干动力学的存在性与特征提供了确切框架与定量刻画。", "summary_source": "deepseek", "authors": [{"name": "Chun Hei Leung"}], "featured_authors": [{"name": "Chun Hei Leung"}], "author_count": 1}, {"id": "2607.02135", "category": "quant-ph", "title": "Quantum Convolutional Autoencoders for Reconstruction-Based Anomaly Detection", "abstract": "Quantum convolutional neural networks (QCNNs) have become increasingly popular in quantum machine learning (QML) due to their efficient parameterization and hierarchical representation of quantum information. Anomaly detection is an important machine learning task with applications across a wide range of domains, including scientific data analysis. In this work, we adapt a QCNN architecture into a quantum autoencoder (QAE) framework for reconstruction-based anomaly detection. The models are trained in a semi-supervised manner on normal samples to reconstruct feature-extracted and dimensionally reduced time-series data, with reconstruction error used as an anomaly score. We investigate two quantum convolutional autoencoder architectures that differ in their treatment of latent information: a hierarchical architecture in which information remains distributed across the circuit and a bottleneck-based architecture in which information is explicitly compressed and reconstructed using additional decoder qubits. The size of the quantum latent space is varied to study its influence on reconstruction accuracy and anomaly detection performance. The approaches are benchmarked against both a variational quantum circuit and a comparable classical baseline using a real-world exoplanet anomaly-detection dataset. Results indicate a trade-off between latent-space size and model capacity, while also suggesting that explicit latent-space compression through a quantum bottleneck can improve anomaly detection performance relative to architectures that retain information throughout the circuit.", "url": "https://arxiv.org/abs/2607.02135", "type": "理论+数值", "summary": "1. 该工作将量子卷积神经网络改编为量子自编码器，用于基于重建的异常检测。\n2. 其核心在于对比了分层与瓶颈两种潜在信息处理架构，并系统研究了量子潜在空间大小对重建精度与检测性能的影响。\n3. 这揭示了显式压缩潜在空间可提升异常检测性能，为量子机器学习在科学数据分析中的应用提供了明确设计准则。", "summary_source": "deepseek", "authors": [{"name": "Donovan Slabbert"}, {"name": "Francesco Petruccione"}], "featured_authors": [{"name": "Donovan Slabbert"}, {"name": "Francesco Petruccione"}], "author_count": 2}, {"id": "2607.02164", "category": "quant-ph", "title": "A Structure Theorem for Phase-Space Representations of Continuous-Variable Quantum Error-Correcting Codes", "abstract": "In this paper we connect the structure theorem for quasiprobability representation of generalised probabilistic theories to bosonic quantum error correction codes, giving b
