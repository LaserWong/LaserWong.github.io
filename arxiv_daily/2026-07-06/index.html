oth a general phase-space representation for continuous-variable error-correcting codes, and showing as specific examples the phase-space representations obtained through this method for Gottesman-Knill-Preskill codes, cat codes, and binomial codes. This representation allows us to define both generally and for each of these codes the mathematical structure in phase space that errors can take, which we show both abstractly and for the specific example of single photon loss errors.", "url": "https://arxiv.org/abs/2607.02164", "type": "理论", "summary": "1. 该工作建立了广义概率论中拟概率表示结构定理与玻色子连续变量量子纠错码之间的联系，并给出了一般性相空间表示方法。\n2. 其卖点在于通过Gottesman-Knill-Preskill码、猫码和二项式码的具体实例，揭示了错误在相空间中的数学结构，特别是单光子损失错误的抽象与具体刻画。\n3. 这为理解连续变量纠错码中噪声过程的相空间几何提供了统一框架，并可能引导更优错误缓解策略的设计。", "summary_source": "deepseek", "authors": [{"name": "Enrico Bozzetto"}, {"name": "Jonte R. Hance"}], "featured_authors": [{"name": "Enrico Bozzetto"}, {"name": "Jonte R. Hance"}], "author_count": 2}, {"id": "2607.02242", "category": "quant-ph", "title": "Computable measures of fermionic non-Gaussianity from the covariance matrix", "abstract": "Fermionic non-Gaussianity, or fermionic magic, is a key resource underlying the computational complexity of fermionic quantum systems, yet tractable and operationally meaningful ways to quantify it remain limited. We address this challenge by developing a convex resource theory of fermionic non-Gaussianity and introducing two families of computable measures for pure fermionic states, both derived from the Williamson normal form of the covariance matrix. The first family, occupation number entropies, is defined as the Tsallis-$\\alpha$ entropy of the occupation numbers. We prove that one member of this family is monotonic under Gaussian protocols, establishing it as a computable convex resource monotone. It consequently lower bounds the number of non-Gaussian gates needed for state preparation. The second family, natural-orbital participation entropies, is given by the Rényi-$\\alpha$ entropy of the squared amplitudes of the state in the natural-orbital basis, defined by the eigenvectors of the covariance matrix. These measures quantify state compressibility in this basis and thus upper bound the classical simulation cost in an orthonormal Gaussian basis. We analyze both families for stabilizer and translation-invariant states, where they simplify and reveal additional structure. We further study representative examples, including random SWAP-doped matchgate circuits and the bond-modulated XXZ model, highlighting the role of non-Gaussianity in many-body phenomena. Our work establishes a resource-theoretic framework for computable fermionic non-Gaussianity that unifies notions arising across quantum information, condensed-matter physics, and quantum chemistry, opening new directions for studying the complexity of quantum many-body systems and providing practical tools to assess the classical simulability of fermionic states relevant for quantum advantage.", "url": "https://arxiv.org/abs/2607.02242", "type": "理论+数值", "summary": "1. 该工作基于协方差矩阵的Williamson标准型，引入了占据数熵与自然轨道参与熵两类可计算度量，用于量化纯费米子态的非高斯性。\n2. 技术核心在于证明占据数熵是高斯操作下的凸资源单调量，从而下界态制备所需非高斯门数；自然轨道参与熵则上界正交高斯基下的经典模拟成本。\n3. 这为统一理解量子信息、凝聚态与量子化学中的非高斯性提供了资源理论框架，并为评估费米子量子优势相关态的经典可模拟性给出实用判据。", "summary_source": "deepseek", "authors": [{"name": "Poetri Sonya Tarabunga"}, {"name": "Bernhard Jobst"}, {"name": "Raúl Morral-Yepes"}, {"name": "Marc Langer"}, {"name": "Barbara Kraus"}, {"name": "Frank Pollmann"}, {"name": "Sheng-Hsuan Lin"}], "featured_authors": [{"name": "Poetri Sonya Tarabunga"}, {"name": "Bernhard Jobst"}, {"name": "Raúl Morral-Yepes"}, {"name": "Barbara Kraus"}, {"name": "Frank Pollmann"}, {"name": "Sheng-Hsuan Lin"}], "author_count": 7}, {"id": "2607.02280", "category": "quant-ph", "title": "Bockstein braiding statistics", "abstract": "Braiding statistics, from the Aharonov-Bohm phase to anyons in fractional quantum Hall systems, play a central role in quantum physics. For $p$- and $q$-dimensional excitations in $d$ spatial dimensions, ordinary braiding requires $p+q=d-2$. In a field-theoretic description of $\\mathbb Z_N$ excitations, ordinary braiding is described by the linking response $(2\\pi i/N)\\int A_{d-p}\\cup B_{d-q}$, where $A_{d-p}$ and $B_{d-q}$ are background fields coupled to the two excitation types. In this work, we identify new mutual statistics in the adjacent case $p+q=d-1$. For two invertible excitations obeying $\\mathbb Z_N$ fusion, one can choose local creation operators $X$ and $Y$ whose supports have a staggered one-dimensional overlap. The closed unitary process $W_N(X,Y)=(Y^{-1}X^{-1})^N(YX)^N$ measures the resulting mutual statistic. Its field-theory description is $(2\\pi i/N)\\int A_{d-p}\\cup\\beta_N B_{d-q}$, where $\\beta_N$ is the Bockstein operation; we therefore call the invariant Bockstein braiding statistics. The construction yields particle-particle statistics in one dimension, particle-loop statistics in two dimensions, and loop-loop or particle-membrane statistics in three dimensions. Nontrivial Bockstein braiding statistics obstructs simultaneous condensation of the two $\\mathbb Z_N$ excitations. It also rules out a fully symmetric gapped phase for systems with the corresponding mixed anomaly and implies symmetry fractionalization when one of the $\\mathbb Z_N$ symmetries is broken.", "url": "https://arxiv.org/abs/2607.02280", "type": "理论", "summary": "1. 该工作识别了空间d维中满足p+q=d-1的p维与q维Z_N激发之间由Bockstein运算刻画的新型互易编织统计，拓展了传统编织统计的维度条件。\n2. 其核心在于通过局部创建算符的闭合幺正过程W_N=(Y^{-1}X^{-1})^N(YX)^N测量统计相位，场论对应响应(2πi/N)∫A_{d-p}∪β_N B_{d-q}，其中β_N为Bockstein上同调运算。\n3. 非平凡Bockstein编织统计阻碍两Z_N激发同时凝聚，排除相应混合反常系统的全对称有隙相，并暗示对称性破缺后的分数量化，为高维编织统计与拓扑序提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Po-Shen Hsin"}, {"name": "Yu-An Chen"}], "featured_authors": [{"name": "Po-Shen Hsin"}, {"name": "Yu-An Chen"}], "author_count": 2}, {"id": "2607.02341", "category": "quant-ph", "title": "Kardar-Parisi-Zhang dynamics in an open integrable system: beyond the spontaneous-symmetry-breaking ansatz", "abstract": "The universality of dynamical scaling laws constitutes a cornerstone in the theoretical understanding of quantum many-body systems, particularly in non-equilibrium settings. Recent advancements have proposed a phenomenological ansatz based on spontaneous symmetry breaking (SSB) to unify the description of charge transport in open quantum systems. However, it remains unclear under which conditions it fails to capture the emergent hydrodynamics and if it does break down, whether nontrivial dynamics emerge. In this work we show that Kardar-Parisi-Zhang (KPZ) dynamics in an open integrable model (the B3 model), rather than diffusion from SSB, emerges. We find that the B3 model is equivalent to two interacting asymmetric XXZ spin chains and the ansatz can only capture the influence of the inter-chain interactions. When the initial state is appropriate, the asymmetric XXZ structure dominates the dynamics, which gives KPZ scaling behavior even when the hopping rate becomes negative. Our work motivates theory of charge transport in open systems beyond the ansatz based on SSB.", "url": "https://arxiv.org/abs/2607.02341", "type": "理论", "summary": "1. 该工作研究开放可积B3模型中的Kardar-Parisi-Zhang动力学，表明自发对称性破缺假设无法描述其涌现流体力学。\n2. 其卖点在于揭示B3模型等价于两个相互作用非对称XXZ自旋链，当初始态合适时非对称结构主导动力学，即便跳变率为负仍给出KPZ标度。\n3. 这为构建超越自发对称性破缺假设的开放系统电荷输运理论提供了明确动机与方向。", "summary_source": "deepseek", "authors": [{"name": "Guo-Qiang Wang"}, {"name": "Chang-Ling Zou"}, {"name": "Guang-Can Guo"}, {"name": "and Xu-Bo Zou"}], "featured_authors": [{"name": "Guo-Qiang Wang"}, {"name": "Chang-Ling Zou"}, {"name": "Guang-Can Guo"}, {"name": "and Xu-Bo Zou"}], "author_count": 4}, {"id": "2607.02408", "category": "quant-ph", "title": "Copying Quantum States", "abstract": "The no-broadcasting theorem in quantum information says that a set of states on a quantum system admits a common broadcasting (copying) operation if and only if their density matrices belong to a commuting family. We discuss and prove this theorem, as well as the closely related no-cloning theorem in the context of quantum probability theory, i.e. in the category of (finite dimensional) C-star-algebras with unital completely positive maps.", "url": "https://arxiv.org/abs/2607.02408", "type": "理论", "summary": "1. 该工作从量子概率论视角，在有限维C*-代数与单位完全正映射范畴内，重述并统一证明了量子态的不可广播定理与不可克隆定理。\n2. 其核心在于揭示了广播操作可行的充要条件是态集密度矩阵可交换，从而将量子信息定理纳入算子代数框架。\n3. 这为量子信息学中基本限制的代数结构理解提供了新视角，可推广至更一般的非交换概率空间。", "summary_source": "deepseek", "authors": [{"name": "Hans Maassen"}, {"name": "Burkhard Kümmerer"}], "featured_authors": [{"name": "Hans Maassen"}, {"name": "Burkhard Kümmerer"}], "author_count": 2}, {"id": "2607.02456", "category": "quant-ph", "title": "A Quantum-Walk Representation of Color-Ordered MHV Scattering Amplitudes", "abstract": "We introduce a graph-theoretic framework for representing color-ordered maximally helicity violating (MHV) scattering amplitudes in quantum chromodynamics using coined quantum walks on permutation trees. Each root-to-terminal path corresponds to a distinct color ordering of the external gluons, while local transition amplitudes are assigned according to the spinor-product structure of the Parke--Taylor amplitudes. The walk evolves in coherent superpositions over permutation sectors, giving a dynamical picture of the underlying combinatorics. A quantum-channel formulation based on Kraus operators is also introduced to describe sector-resolved contributions, while a weighted collection operator coherently combines the terminal sectors at a common reference node. A quantum Fourier transform on the coin space is then employed to combine the encoded contributions into the corresponding color-decomposed amplitude. Together, these constructions establish a unified graph-based framework connecting permutation trees, quantum walks, and open quantum systems providing a framework for quantum algorithms to simulate scattering processes in quantum field theory. As an example, numerical results for low-point gluon amplitudes demonstrate that the proposed representation faithfully captures the characteristic Parke--Taylor structure and is consistent with analytical results.", "url": "https://arxiv.org/abs/2607.02456", "type": "理论+数值", "summary": "1. 该工作提出了一个基于带硬币量子游走的图论框架，用于表示量子色动力学中颜色排序的最大螺旋度违反散射振幅。\n2. 其技术核心在于将置换树路径与Parke-Taylor振幅的旋量积结构对应，并利用量子信道和硬币空间傅里叶变换实现扇区相干组合。\n3. 这为量子算法模拟量子场论散射过程建立了统一的图论与开放量子系统框架，并已通过低点胶子振幅数值验证。", "summary_source": "deepseek", "authors": [{"name": "Anirudh Verma"}, {"name": "C. M. Chandrashekar"}], "featured_authors": [{"name": "Anirudh Verma"}, {"name": "C. M. Chandrashekar"}], "author_count": 2}, {"id": "2607.02462", "category": "quant-ph", "title": "Quantum mutual information as a robust probe of integrability in open quantum systems", "abstract": "The dynamics of a quantum system encode signatures of whether the underlying Hamiltonian is integrable or chaotic, giving rise to the concept of quantum information scrambling through the properties of the resulting dynamical states or operators. We introduce an information-theoretic framework based on the Haar-averaged sum of total correlations (aSTC), together with average genuine multipartite entanglement generated dynamically from initially fully separable states, as robust probes of quantum information scrambling. Using the long-range quantum XYZ spin model in transverse and longitudinal magnetic fields, whose integrable limit is the nearest-neighbor transverse XY model, we demonstrate that the long-time average and, more importantly, the temporal fluctuations of the aSTC provide a faithful and system-size-independent signature of integrable and chaotic dynamics, similar to the conventional measure of scrambling, out-of-time-ordered correlator (OTOC). When the system is in contact with the thermal reservoir and system-bath coupling follows Markovianity, we find that the fluctuations of the aSTC and OTOC continue to distinguish integrable and chaotic dynamics only at intermediate times. However, we observe that in the non-Markovian domain, information backflow restores the scrambling dynamics, enabling the aSTC to retain its distinguishing power even at long times. Interestingly, we exhibit that, under Markovian amplitude damping and non-Markovian dephasing noise, the temporal fluctuations of the aSTC can discriminate between integrability and non-integrability in the weak Markovian regime, even when OTOC fails to do so.", "url": "https://arxiv.org/abs/2607.02462", "type": "理论", "summary": "1. 该工作提出基于Haar平均总关联和与真多体纠缠的信息论框架，用于探测开放量子系统中可积与混沌动力学的标定。\n2. 通过长程XYZ模型和近邻XY模型对比，揭示总关联和的时间涨落在长时间平均下给出系统尺寸无关的可积性特征，且在非马尔可夫环境中及弱马尔可夫区仍保留区分能力，超越离时关联函数。\n3. 这为利用量子互信息研究开放体系量子信息乱序行为及可积破坏提供了鲁棒的动力学探针，尤其适用于非马尔可夫噪声环境下的理论分析。", "summary_source": "deepseek", "authors": [{"name": "Nirupam Sen"}, {"name": "Keshav Das Agarwal"}, {"name": "Aditi Sen De"}], "featured_authors": [{"name": "Nirupam Sen"}, {"name": "Keshav Das Agarwal"}, {"name": "Aditi Sen De"}], "author_count": 3}, {"id": "2607.02463", "category": "quant-ph", "title": "Topological Control of Quantum Chaos Diagnostics: OTOCs, Spectral Statistics, and Information Scrambling in Ising Model", "abstract": "We investigate the integrability-to-chaos transition and information scrambling in Ising spin networks via a graph-theoretic formulation. Modeling spins as vertices and interactions via adjacency matrices across path, Erdős--Rényi, and Watts--Strogatz topologies, we demonstrate that long-range couplings and heterogeneous degree distributions drastically accelerate quantum information propagation. The Hamiltonian comprises local and normalized non-local interactions; tuning the non-local coupling and field heterogeneity drives integrability breaking. To quantify scrambling, we employ bipartite mutual and tripartite information. Increasing non-local interactions drives tripartite information to large negative values, signaling deep information scrambling. Out-of-time-order correlators (OTOCs) exhibit exponential early-time growth, yielding quantum Lyapunov exponents that scale systematically with parameters governing the chaotic regime. Complementing this, Krylov complexity reveals rapid operator growth in the chaotic phase, synchronizing with OTOC and mutual information dynamics. Spectrally, the transition manifests as a shift from Poissonian to Wigner--Dyson level spacing statistics. The spectral form factor (SFF) exhibits the characteristic slope-dip-ramp-plateau structure, enabling the extraction of Thouless and Heisenberg times. Crucially, a reduced Thouless time strongly correlates with accelerated informational and operator scrambling. Ultimately, this work establishes a unified framework bridging network topology with information-theoretic, operator, and spectral diagnostics, offering profound insights into thermalization and non-equilibrium dynamics in quantum many-body systems.", "url": "https://arxiv.org/abs/2607.02463", "type": "理论", "summary": "1. 该工作通过图论框架研究伊辛自旋网络的可积-混沌转变与信息置乱，考察路径图、Erdős–Rényi和Watts–Strogatz三种拓扑结构。\n2. 其核心在于揭示长程耦合与异质度分布通过非局域相互作用加速信息传播，并系统关联OTOC指数增长、Krylov复杂度、谱统计及Thouless时间缩短等诊断量。\n3. 这为基于网络拓扑统一描述量子多体系统中的热化与非平衡动力学提供了明确理论框架与实验可测判据。", "summary_source": "deepseek", "authors": [{"name": "Reza Pirmoradian"}, {"name": "Soheir Rouhani"}, {"name": "M. Reza Tanhayi"}], "featured_authors": [{"name": "Reza Pirmoradian"}, {"name": "Soheir Rouhani"}, {"name": "M. Reza Tanhayi"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
