ut-dependent angular geometry whose diagonal remains non-self-averaging even when the underlying unitary approaches Haar randomness. We also prove a sparse-data guarantee for the full nonlinear gradient flow without freezing or ensemble-averaging the kernel: the realized dynamics converges to an integrable scalar flow with a time-dependent kernel closure and explicit convergence times. A finite-depth speed limit holds for every data set and trajectory. At higher data density, numerical results show coupled evolution beyond both the scalar and frozen-kernel descriptions. These results give a controlled theory of learned quantum data geometry with provable training dynamics beyond the frozen limit.", "url": "https://arxiv.org/abs/2608.28828", "type": "理论+数值", "summary": "1. 该工作将量子信号处理确立为表征学习机制的可解量子模型，并在任意深度下精确计算其量子神经正切核的均值与方差。\n2. 其要点在于揭示输入依赖角度几何的对角元非自平均，即使底层酉接近Haar随机；并证明稀疏数据下非线性梯度流收敛到含时核闭合的可积标量流，且存在有限深度速度极限。\n3. 这为学习型量子数据几何提供受控理论，并启发超越冻结核近似的可证明训练动力学在量子机器学习泛化研究中的应用。", "summary_source": "deepseek", "authors": [{"name": "Junqi Wang"}, {"name": "Junyu Liu"}], "featured_authors": [{"name": "Junqi Wang"}, {"name": "Junyu Liu"}], "author_count": 2}, {"id": "2608.28897", "category": "quant-ph", "title": "Rényi Entanglement of Purification Is Non-additive", "abstract": "Entanglement of purification is a fundamental measure of total correlations whose additivity remains unresolved. We study its additivity for classical states on two qubits at different Rényi orders. For every $\\alpha\\in[0,1)$, we prove nonadditivity within this family, witnessed by two copies of a single state. We first solve the one-copy optimization exactly for the entire family at every Rényi order. We then restrict the two-copy optimization to a natural finite set of purifications and exhibit one whose entropy is strictly below the product value. In contrast, for $\\alpha\\in[2,\\infty]$ we prove additivity under tensor products within this family. The interval $\\alpha\\in[1,2)$, including the von Neumann case $\\alpha=1$, remains open, and we conjecture additivity there throughout the same family.", "url": "https://arxiv.org/abs/2608.28897", "type": "理论+数值", "summary": "1. 该工作研究两量子比特经典态在Rényi阶数下的纠缠纯化熵可加性，证明α∈[0,1)时存在不可加性，并由单态双副本实例佐证。\n2. 其技术要点在于精确求解该态族的单副本优化，并将双副本优化限制到自然有限纯化集，展示出低于乘积值的显式熵值。\n3. 这为α∈[1,2)含冯诺依曼情形的开放区间及其中可加性猜想提供了明确研究框架与后续验证方向。", "summary_source": "deepseek", "authors": [{"name": "Amir-Reza Negari"}, {"name": "Zahra Baghali Khanian"}], "featured_authors": [{"name": "Amir-Reza Negari"}, {"name": "Zahra Baghali Khanian"}], "author_count": 2}, {"id": "2608.28914", "category": "quant-ph", "title": "Exact Haar Statistics of Planar $k$-Purity in Multipartite Quantum Systems", "abstract": "Planar $k$-uniform states have maximally mixed reductions on every $k$-site interval of a ring. We introduce planar $k$-purity---the mean purity of those intervals---as a faithful cost function for this simultaneous constraint. For a Haar-random pure state of $n$ parties with local dimension $p$, the joint purity of two intervals depends only on their overlap. An exhaustive four-replica calculation therefore yields the complete cyclic covariance kernel and a closed variance for every $1\\le k\\le\\lfloor n/2\\rfloor$. In the balanced qubit case, $k=\\lfloor n/2\\rfloor$ and $N=2^n$, the variance is asymptotic to $20/(3nN^2)$ for even $n$ and $6/(nN^2)$ for odd $n$. A site-factorized permutation representation gives all raw moments and permits exact finite-sum evaluation of the skewness. Fixed-seed simulations validate nonbalanced qubit and qutrit cases, while balanced-qubit simulations through $n=10$ validate the parity formulas and finite-size skewness. Balanced planar and absolute balanced purity have the same Haar mean but different fluctuations; the planar variance is approximately $2.83$ times larger at $n=10$. Thus subsystem incidence, although invisible to every one-cut marginal distribution, controls the collective fluctuations of geometrically related cuts. Together with universal attainability and a linear number of interval constraints at balance, this provides a geometry-aware benchmark for multipartite entanglement beyond AME existence regimes.", "url": "https://arxiv.org/abs/2608.28914", "type": "理论+数值", "summary": "1. 该工作针对环上任意k比特区间约化态同时近似最大混合的约束，引入平面k纯度作为代价函数，并系统计算Haar随机纯态的联合纯度统计与涨落。\n2. 其技术核心是通过四副本计算得出任意两个区间纯度的协方差核及闭式方差，在平衡量子比特下给出奇偶依赖的渐近标度，并由位点因子化置换表示得到全部原始矩与偏度。\n3. 平面纯度与绝对平衡纯度具有相同的Haar均值但涨落明显不同，表明子系统几何关联虽不改变单截面边缘分布，却控制多截面集体涨落，为多体纠缠提供几何感知基准。", "summary_source": "deepseek", "authors": [{"name": "Kourosh Mirsohi"}], "featured_authors": [{"name": "Kourosh Mirsohi"}], "author_count": 1}, {"id": "2608.28946", "category": "quant-ph", "title": "On the entropy of a pseudo-density matrix", "abstract": "The pseudo-density matrix (PDM) formalism naturally extends the notion of density operator to the spatiotemporal domain. While PDMs are Hermitian and of unit trace, they admit negative eigenvalues when encoding temporal correlations unattainable for spacelike separated systems. Consequently, there have been various approaches to extending the von~Neumann entropy---which is only defined for positive operators---to PDMs. Here, we prove that there exists a unique extension of the von~Neumann entropy functional to Hermitian matrices of unit trace satisfying two simple assumptions: unitary invariance and strong additivity with respect to affine combinations within the interval $[-1,1]$, which we prove contains the eigenvalues of a PDM. We also prove that this unique extension of von~Neumann entropy to PDMs is subadditive for single qubit dynamics, and we analyze its behavior in a number of examples.", "url": "https://arxiv.org/abs/2608.28946", "type": "理论", "summary": "1. 该工作针对赝密度矩阵（PDM）将密度算符推广到时空域的框架，研究冯·诺伊曼熵向含负本征值单位迹厄米矩阵的延拓，证明了唯一延拓的存在性。\n2. 其核心卖点是证明在酉不变性与区间[-1,1]上仿射组合强可加性假设下熵延拓唯一，且该唯一熵对单比特PDM动力学具有次可加性，并给出多个例子分析。\n3. 这为时空量子关联的熵度量提供公理化基础，有助于刻画时间方向关联、负本征值对应的非经典性及退相干行为。", "summary_source": "deepseek", "authors": [{"name": "James Fullwood"}, {"name": "Boyu Yang"}], "featured_authors": [{"name": "James Fullwood"}, {"name": "Boyu Yang"}], "author_count": 2}, {"id": "2608.28962", "category": "quant-ph", "title": "Universal recovery in approximate quantum error correction", "abstract": "Universal recovery -- the existence of a single recovery map that corrects an entire family of error channels -- is a central feature of quantum error correction (QEC). In exact QEC, linearity guarantees that a code correcting a given error set also corrects every channel whose Kraus operators lie in its linear span, and that a single recovery map suffices for all such channels. Approximate quantum error correction (AQEC), which relaxes perfect recovery to recovery with controlled error, has traditionally lacked this structure. In a recent paper ( arXiv:2607.22995 ), we developed a theory of approximate quantum error correction showing that a restricted form of linearity persists in the approximate setting, yielding uniform AQEC guarantees for the family of channels controlled by a given error set. In this work, we complete the picture by establishing the second half of universal recovery in the approximate setting: a single recovery map can simultaneously correct every channel controlled by a given error set. The error-set theory we proposed quantifies approximate correctability through two parameters: the environment-leakage distance, governing worst-case performance, and the Knill--Laflamme Hellinger distance, governing average-case performance. We show here that both quantities also control universal decoding. We further study the Petz map naturally associated with an error set as an explicit universal recovery, and obtain uniform average- and worst-case guarantees across the entire family of channels.", "url": "https://arxiv.org/abs/2608.28962", "type": "理论", "summary": "1. 该工作为近似量子纠错确立了普适恢复的第二半结论，证明存在单一恢复映射可同时纠正由给定错误集控制的所有信道族。\n2. 其技术卖点在于证明环境泄漏距离与Knill-Laflamme Hellinger距离分别控制最坏与平均情形的普适解码，并利用与错误集自然关联的Petz映射构造显式普适恢复，给出全信道族的均匀保证。\n3. 这补全了近似量子纠错中线性性与普适恢复的类比，为近似码的统一性能保证及后续量子纠错理论提供了更严格的框架。", "summary_source": "deepseek", "authors": [{"name": "Dor Elimelech"}, {"name": "Victor V. Albert"}, {"name": "Alexander Barg"}], "featured_authors": [{"name": "Dor Elimelech"}, {"name": "Victor V. Albert"}, {"name": "Alexander Barg"}], "author_count": 3}, {"id": "2608.28985", "category": "quant-ph", "title": "Measure of set imaginarity", "abstract": "Recent studies have shown that Bargmann invariants provide effective detectors of set imaginarity. In this paper, we investigate set imaginarity as a quantum resource in qubit systems. By exploiting the structure of Bargmann invariants, we show that the free operations for qubit set imaginarity consist precisely of common unital operations and common planarized operations. Based on this characterization, we introduce an axiomatic framework for set-imaginarity measures (SIMs). In particular, we propose two refined notions, namely unified SIMs and complete SIMs, which allow a more fine-grained quantification of set imaginarity. To make these notions concrete, we construct two qubit SIMs from the Bargmann invariants of three-state subsets. We prove that one of them is a unified SIM, while the other satisfies the stronger requirements of a complete SIM. Furthermore, we revisit the robustness of set imaginarity previously introduced in the literature. We show that, although this robustness is a valid SIM for qubit systems, it is neither a unified SIM nor a complete SIM. To overcome this limitation, we propose an improved robustness-type measure and rigorously prove that it defines a complete qubit SIM.", "url": "https://arxiv.org/abs/2608.28985", "type": "理论", "summary": "1. 该文研究量子比特系统中集合虚部性的资源理论，借助Bargmann不变量刻画自由操作，并提出集合虚部性度量(SIM)的公理化框架。\n2. 其核心是证明自由操作恰为公共单位保持与公共平面化操作，进而给出统一SIM与完备SIM的定义，并由三态子集的Bargmann不变量构造两个显式度量。\n3. 文中还指出既有鲁棒性度量虽为有效SIM但不满足统一或完备性，因而提出改进的鲁棒型度量并证明其构成完备量子比特SIM，为精细资源量化提供了更严格工具。", "summary_source": "deepseek", "authors": [{"name": "Yu Guo"}, {"name": "Jiabo Pan"}, {"name": "Yuqin Wang"}, {"name": "Shuanping Du"}], "featured_authors": [{"name": "Yu Guo"}, {"name": "Jiabo Pan"}, {"name": "Yuqin Wang"}, {"name": "Shuanping Du"}], "author_count": 4}, {"id": "2608.29049", "category": "quant-ph", "title": "Eigenvalues of multipartite entanglement witnesses", "abstract": "We investigate various properties of multipartite block-positive operators, decomposable EWs (DEWs), and non-decomposable EWs. We provide a necessary and sufficient condition to construct a special DEW using the multipartite GHZ state. For multipartite DEW, we explicitly characterize the supremum and infimum of maximum and minimum eigenvalues, as well as the trace of its square. We also derive other results concerning NDEW, eigenvalues of $2 \\times n$ EWs and the corresponding physical implications. Furthermore, we investigate the tightness of inequalities of these eigenvalues with examples.", "url": "https://arxiv.org/abs/2608.29049", "type": "理论", "summary": "1. 该工作系统研究了多体块正算子、可分解纠缠见证与不可分解纠缠见证的本征值性质，并给出利用多体GHZ态构造一类特殊可分解纠缠见证的充分必要条件。\n2. 其核心在于刻画多体可分解见证最大与最小本征值的上确界和下确界及其平方的迹，并推导不可分解见证与2×n纠缠见证的本征值约束，结合例子检查这些不等式的紧致性与物理含义。\n3. 这些本征值界限为多体纠缠的检测和量化提供了可用判据，对见证的优化构造及多体量子态的实验表征具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Nalan Wang"}, {"name": "Lin Chen"}], "featured_authors": [{"name": "Nalan Wang"}, {"name": "Lin Chen"}], "author_count": 2}, {"id": "2608.29079", "category": "quant-ph", "title": "Quantum discord of Gaussian states in non-inertial frames", "abstract": "We investigate the redistribution of continuous-variable Gaussian quantum discord under the Unruh effect for both one and two uniformly accelerated observers. The discord shared between the inertial mode and the accessible accelerated mode, as well as that between the two accessible accelerated modes, decays monotonically with acceleration and vanishes in the limit $a\\to\\infty$, while the Unruh effect generates discord in all causally disconnected Rindler mode pairs. The initial quantum correlation is therefore redistributed across Rindler partitions rather than destroyed. We further characterize how the squeezing parameter $s$ and field frequency $\\omega$ control the discord in different mode-pair classes. For causally connected pairs, $s$ and $\\omega$ exert comparable, interchangeable effects; for cross-region pairs, the squeezing parameter dominates; and for intra-observer cross-region pairs, the field frequency is more influential. In the two-observer case, the $A_{II}$-$B_{II}$ pair exhibits non-monotonic behavior with a peak whose position shifts to larger $a$ as $\\omega$ increases, and both parameters contribute only weakly except near an optimal $\\frac{\\omega}{s}$ ratio.", "url": "https://arxiv.org/abs/2608.29079", "type": "理论", "summary": "1. 该文研究非惯性系中高斯态量子失协在Unruh效应下于单、双加速观测者情形中的重新分布。\n2. 其要点是失协并非消亡而是分散至因果断开模对，且挤压参数与频率对不同模对类别起不同主导作用。\n3. 这为弯曲时空量子信息处理及Unruh噪声下连续变量关联的度量与操控提供了理论参考。", "summary_source": "deepseek", "authors": [{"name": "Siwei Li"}, {"name": "Xiaofen Huang"}], "featured_authors": [{"name": "Siwei Li"}, {"name": "Xiaofen Huang"}], "author_count": 2}, {"id": "2608.29333", "category": "quant-ph", "title": "Zero-Energy Problems for Supersymmetric Hamiltonians on a Chain Are $\\mathrm{QMA}_1$-Complete", "abstract": "We study exact zero modes of supersymmetric quantum systems whose interactions are arranged on a one-dimensional chain. For Hermitian supercharges, deciding whether a zero mode exists is $\\mathrm{QMA}_1$-complete, and the hard instances are geometrically local on a chain. We also classify an explicitly encoded nilpotent $\\mathcal{N}=2$ formulation: its exact-zero problem is $\\mathrm{QMA}_1$-complete, including the restriction in which the associated Hamiltonian is local on a chain. Both classifications use a verification theorem for simultaneous sparse linear constraints and the same one-dimensional frustration-free Hamiltonian construction. The construction gives an explicit inverse-polynomial lower bound on the ground energy of every reduced NO instance, separating it from zero.", "url": "https://arxiv.org/abs/2608.29333", "type": "理论", "summary": "1. 该工作证明，一维链上具有厄米超荷的超对称系统是否存在精确零模是 QMA₁-完全的，且困难实例可几何局域于一维链。\n2. 其技术核心是利用同时稀疏线性约束的验证定理与同一套一维无阻挫哈密顿量构造，统一处理厄米与显式幂零 N=2 表述，包括哈密顿量局域于一维链的情形，并给出约化 NO 实例基态能量的逆多项式下界。\n3. 该结果将 QMA₁-完全性推广到一维局域超对称系统，表明即使在一维几何条件下判定零模仍有固有计算难度，为量子复杂度与超对称谱理论建立了新联系。", "summary_source": "deepseek", "authors": [{"name": "Yibin Wang"}], "featured_authors": [{"name": "Yibin Wang"}], "author_count": 1}, {"id": "2608.29350", "category": "quant-ph", "title": "Quantum Natural Gradient on Quotient Spaces", "abstract": "Parametrized quantum circuits often contain state-preserving redundancies that make the quantum Fisher information matrix (QFIM) singular even when the physical state manifold is regular. We formulate quantum natural gradient (QNG) on the resulting parameter quotient and prove that, when the prescribed redundancy exhausts the Fisher kernel, the Moore--Penrose update is the minimum-norm horizontal lift of the quotient Riemannian gradient. A circuit-to-orbit transfer principle separates intrinsic state distinguishability from circuit-coordinate distortion and gives the exact condition under which a circuit realizes an intrinsic orbit-QNG direction. Representation theory then yields root-resolved Fisher scales on highest-weight flag orbits and isotropic intrinsic metrics for Slater and fermionic-Gaussian manifolds. On cominuscule embeddings, intrinsic fidelity QNG conserves principal-defect ratios and reduces to one scalar equation; Lie-retracted steps are locally cubic at $\\eta=2$, with stability boundary $\\eta=4$. For finite-shot implementations, we separate exact gauge removal from regularization of physical soft modes, obtain zero cumulative gauge drift under structural projection, and derive confidence-controlled soft-mode rules. Under depolarization, inverse-Fisher scaling restores deterministic scale only by amplifying fluctuations and therefore cannot recover a lost update signal-to-noise ratio. A redundant Slater/Givens circuit verifies the transfer law and the predicted finite-shot tradeoffs.", "url": "https://arxiv.org/abs/2608.29350", "type": "理论+数值", "summary": "1. 论文在参数化量子电路的态保持冗余导致量子Fisher信息矩阵奇异时，建立了商空间上的量子自然梯度形式。\n2. 其核心是证明Moore–Penrose更新为商黎曼梯度的最小范数水平提升，并借转移原理与表示论得到根分辨Fisher度量及有限次测量规则。\n3. 这为含冗余变分线路的几何优化提供严格框架，并警示退极化下逆Fisher放大无法恢复更新信噪比。", "summary_source": "deepseek", "authors": [{"name": "Zeyu Chen"}], "featured_authors": [{"name": "Zeyu Chen"}], "author_count": 1}, {"id": "2608.29353", "category": "quant-ph", "title": "Spinor Structure from Relativistic Mass-Shell Factorisation in Phase Space", "abstract": "Spin is usually regarded as one of the most intrinsically quantum phenomena, while its lack of a natural analogue in classical physics presents an obstacle to phase-space deformation-quantisation accounts of its origin. We show that this difficulty may arise from imposing an overly restrictive scalar Hamiltonian structure on relativistic phase space. Requiring the complete massive mass-shell constraint to be represented by a single finite-dimensional expression that is linear in all four components of momentum forces its coefficient matrices to satisfy a Clifford algebra. The minimal complex representation of this algebra is four-dimensional. Requiring statistical completeness within the rank-two subspace selected by the mass-shell factor then leads to a four-by-four matrix-valued ensemble distribution. At each on-shell momentum, the linear mass-shell operator selects a two-dimensional subspace, so a general classical ensemble is described by a $2 \\times 2$ matrix before quantisation. Projecting the Weyl-ordered Liouville equation into this subspace gives relativistic transport while preserving arbitrary populations and coherences and the remaining projector components determine the first deformation correction. Expansion of the matrix Moyal star commutator yields the symmetrised classical matrix Liouvillian at leading order. If the stronger two-sided star constraints are imposed, they reproduce the left and right Dirac-Wigner equations and introduce $\\hbar$ as the scale converting the dimensionless internal algebra into physical angular momentum. These results suggest a non-quantum origin for spinor structure and a route to reconciling relativistic covariance, classical phase-space transport, and quantum spin.", "url": "https://arxiv.org/abs/2608.29353", "type": "理论", "summary": "1. 该工作提出在相对论相空间中，从完整质量壳约束的单一有限维线性分解导出旋量结构的新方案。\n2. 其核心是证明该分解迫使系数矩阵满足Clifford代数，并将Weyl-ordered Liouville方程投影到质量壳秩二子空间，从而在保留布居与相干下得到相对论输运及首阶形变修正。\n3. 这为旋量结构的非量子起源提供证据，也为统一相对论协变性、经典相空间输运与量子自旋开辟了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Mark Everitt"}], "featured_authors": [{"name": "Mark Everitt"}], "author_count": 1}, {"id": "2608.29373", "category": "quant-ph", "title": "Convex conservation of von Neumann entropy implies unitarity or antiunitarity", "abstract": "On the space of density matrices $D(H)$, Kadison's theorem establishes that all invertible convex transformations $K:D(H)\\to D(H)$ are unitarity or antiunitary. For a finite Hilbert space, we propose a similar theorem which replaces the invertibility requirement with that of entropy conservation. Thus, we argue, the supposition of reversibility in quantum mechanics may be replaced with a principle of entropy conservation.", "url": "https://arxiv.org/abs/2608.29373", "type": "理论", "summary": "1. 该论文在有限维希尔伯特空间上证明了一个与 Kadison 定理类似的结论：保持 von Neumann 熵的凸变换必为酉或反酉变换。\n2. 核心卖点是用熵守恒替代可逆性条件，从而将量子力学中关于可逆性的假设转化为物理上更基本的熵原理。\n3. 这为从熵守恒出发重建量子力学的公理化基础提供了可能，并对开放系统或不可逆动力学中的对称性分类有启发性。", "summary_source": "deepseek", "authors": [{"name": "Nicolas G. Underwood"}, {"name": "Jonte R. Hance"}], "featured_authors": [{"name": "Nicolas G. Underwood"}, {"name": "Jonte R. Hance"}], "author_count": 2}, {"id": "2608.29422", "category": "quant-ph", "title": "The ZZ feature map induces a signless Laplacian metric: a closed-form classical surrogate for quantum kernel regression", "abstract": "Quantum kernel methods lose their advantage over classical kernels once the encoding bandwidth is tuned, and bandwidth-tuned quantum kernels have been shown to resemble radial basis function kernels closely. The analytical support for that observation rests on separable encoding circuits and captures entangling circuits only qualitatively. We close this gap for the ZZ feature map. We prove that in the small-bandwidth regime the induced kernel is, to leading order, an anisotropic Gaussian kernel with metric M = I + pi^2 Q, where Q is the signless Laplacian of the entanglement graph, and that the quadratic structure persists at every circuit depth as a pullback of the Fubini-Study metric. The anisotropy depends entirely on a phase convention: under the unshifted convention the metric is the identity irrespective of entanglement, which explains the isotropic resemblance previously reported. The derivation is verified against direct simulation for path, cycle and complete entanglement graphs, with relative error below 10^-3. The corresponding classical kernel requires no fitted parameters and no quantum simulation. Compared with the quantum kernel across two near-infrared spectroscopic benchmarks, four targets, five preprocessing pipelines and 100 resampled splits per cell, the paired 95% bootstrap interval contains zero in 18 of 20 cells, the typical relative difference in test error is 2.7%, and the two families select the same preprocessing pipeline in 96% of splits. The regime in which the reduction fails begins at the same bandwidth on both datasets and adds no robust predictive value: restricting the grid to the classical regime improves mean test error by 3.8%, a gain that an equally large random restriction does not reproduce. The quantum circuit can thus be removed without detectable predictive loss, and we can state precisely which classical kernel it was computing.", "url": "https://arxiv.org/abs/2608.29422", "type": "理论+数值", "summary": "1. 该工作针对ZZ特征映射证明，其小带宽量子核可化为闭式经典核，等价于度量 M=I+pi^2 Q 的各向异性高斯核，其中Q为纠缠图的无符号拉普拉斯矩阵。\n2. 核心卖点在于该度量结构源自Fubini-Study度量的拉回，且各向异性完全由相位约定决定；对应的经典核无需拟合参数和量子模拟，数值验证相对误差低于10^-3。\n3. 在近红外光谱基准上，经典与量子核的测试误差典型差异仅2.7%，移除量子线路不带来可检测的预测损失，为识别量子核方法可被经典替代的边界提供了精确判据。", "summary_source": "deepseek", "authors": [{"name": "Erkut Tekeli"}], "featured_authors": [{"name": "Erkut Tekeli"}], "author_count": 1}, {"id": "2608.29493", "category": "quant-ph", "title": "Quantum Pessiland", "abstract": "Pessiland is a world where NP is hard on average but one-way functions (OWFs) do not exist [Impagliazzo 1995]. Because almost all classical cryptographic primitives imply OWFs [Impagliazzo and Luby 1989], there is almost no classical cryptography in Pessiland. On the other hand, quantum cryptography can exist even when OWFs do not [Kretschmer 2021; Morimae and Yamakawa 2022; Ananth, Qian and Yuen 2022]. Is there a quantum analogue of Pessiland where NP is hard on average but even quantum cryptography does not exist? In this paper, we show that such a miserable world, Quantum Pessiland, exists: there is a quantum oracle relative to which $UP\\cap coUP$ is hard on average against quantum polynomial-time algorithms with quantum advice, yet auxiliary-input EFI pairs do not exist. We also show that there is a classical oracle relative to which $UP\\cap coUP$ is hard on average against quantum polynomial-time algorithms with quantum advice, yet classically-secure auxiliary-input one-way puzzles (OWPuzzs) do not exist. Almost all quantum cryptographic primitives imply EFI pairs or OWPuzzs, and therefore these results mean that there is almost no quantum cryptography relative to these oracles. We further show that relative to the classical oracle, SampBQP = SampBPP, and therefore there is no sampling-based quantum advantage in Quantum Pessiland. Finally, because our average-case hardness of $UP\\cap coUP$ implies $P^{\\#P}\\not\\subseteq this http URL , our result also implies that a non-relativizing proof technique is necessary to construct OWPuzzs solely from $P^{\\#P}\\not\\subseteq this http URL , which gives a partial negative answer to the open problem of [Khurana and Tomer 2025].", "url": "https://arxiv.org/abs/2608.29493", "type": "理论+数值", "summary": "1. 该工作构造量子谕示，证明“量子Pessiland”存在：UP∩coUP对带量子建议的量子多项式时间算法平均困难，同时辅助输入EFI对不存在。\n2. 其核心还在于给出经典谕示，其中类安全辅助输入单向谜题不存在且SampBQP=SampBPP，从而使几乎所有量子密码原语失效。\n3. 由于该平均情形硬度蕴含P^#P不包含于BQP，此结果暗示仅凭此分离无法构造单向谜题，须借助非相对化证明技巧。", "summary_source": "deepseek", "authors": [{"name": "Boyang Chen"}, {"name": "Tomoyuki Morimae"}, {"name": "Takashi Yamakawa"}], "featured_authors": [{"name": "Boyang Chen"}, {"name": "Tomoyuki Morimae"}, {"name": "Takashi Yamakawa"}], "author_count": 3}, {"id": "2608.29602", "category": "quant-ph", "title": "Evolution Generators for Complex Parameters", "abstract": "Theoretical studies on how quantum systems are affected by external factors are often formulated through parameter changes in the system's Hamiltonian. Beyond Berry connections and phases, which focus on specific Hamiltonian eigenstates, recent studies inspired by non-Hermitian quantum formalisms provide a framework for obtaining general state evolution generators for real-valued parameters. This study extends the applicability of the evolution generator formalism to complex-valued parameters via Wirtinger derivatives. By treating a complex parameter and its conjugate as independent variables, the evolution equations are derived for both quantum states and the metric of the Hilbert space bundle. The analysis demonstrates that while state evolution with respect to a complex parameter is naturally governed by its corresponding evolution generator, metric evolution requires a coupled contribution from both the generator and its conjugate counterpart to preserve state normalization. Explicit examples are worked out to illustrate the implementation and physical consistency of the formalism.", "url": "https://arxiv.org/abs/2608.29602", "type": "理论", "summary": "1. 该工作将演化生成元形式推广到复值参数，利用Wirtinger导数把复参数及其共轭视为独立变量，推导量子态与希尔伯特空间度规的演化方程。\n2. 核心发现是态演化由相应生成元自然支配，而度规演化须同时包含生成元及其共轭的耦合贡献，以保证态归一化在复参数变化下成立。\n3. 显式算例展示了该形式的物理自洽性，为研究含复参数量子系统与非厄米类几何效应提供了可推广的理论工具。", "summary_source": "deepseek", "authors": [{"name": "Jen-Yin Yeh"}, {"name": "Chia-Yi Ju"}], "featured_authors": [{"name": "Jen-Yin Yeh"}, {"name": "Chia-Yi Ju"}], "author_count": 2}, {"id": "2608.29672", "category": "quant-ph", "title": "Asymptotic Entanglement across Dynamical Regimes of a Dissipative Bosonic Dimer", "abstract": "Dynamical instability in parametrically driven bosonic systems is generally associated with diverging occupations and the absence of a stationary state, but its implications for long-time entanglement remain unclear. We investigate this question in a dissipative bosonic dimer with beam-splitter and two-mode-squeezing interactions, local loss, and a tunable common bath. The non-Hermitian dynamical spectrum governing the Gaussian moments partitions the parameter space into distinct regimes and provides a unified description of population and entanglement dynamics across both stable and unstable regions. We find that dynamical instability does not imply unbounded entanglement growth: although the bosonic population diverges, the logarithmic negativity remains bounded and approaches a finite asymptotic value. We further characterize the finite asymptotic entanglement and show that asymmetric local dissipation shifts both the stability boundary and the threshold for nonzero asymptotic entanglement. For identical local dissipation, the presence of a common bath leaves the dynamical-region boundaries unchanged while qualitatively reshaping the long-time entanglement landscape, producing broad enhancement regions within the stable regimes and a narrow enhancement region within the unstable regime. In the common-bath-only limit, this enhancement is attributed to an exact dark-mode (bound-state-in-the-continuum, BIC) protection mechanism, which reduces to a quasi-BIC remnant under independent dissipation. Our results establish the non-Hermitian dynamical spectrum as a framework for connecting stability, nonequilibrium dynamics, and asymptotic entanglement in open quadratic bosonic systems.", "url": "https://arxiv.org/abs/2608.29672", "type": "理论", "summary": "1. 该工作研究耗散玻色子二聚体中参数驱动不稳定性对渐近纠缠的影响，发现粒子数发散时对数负性仍有界并趋于有限值。\n2. 其核心在于用非厄米动力学谱统一刻画稳定与失稳区的布居和纠缠，并揭示公共浴经暗态/BIC保护机制在稳定区及失稳区产生不同宽度的纠缠增强。\n3. 这为开放二次玻色系统中稳定性、非平衡动力学与渐近纠缠的关联提供了通用框架，并为相关耗散量子平台研究指明方向。", "summary_source": "deepseek", "authors": [{"name": "Chenghe Yu"}, {"name": "Mingsheng Tian"}, {"name": "Feng-Xiao Sun"}, {"name": "Qiongyi He"}], "featured_authors": [{"name": "Chenghe Yu"}, {"name": "Mingsheng Tian"}, {"name": "Feng-Xiao Sun"}, {"name": "Qiongyi He"}], "author_count": 4}, {"id": "2608.29684", "category": "quant-ph", "title": "Analytical diagonalization of the open-boundary bosonic Kitaev chain: An asymmetric plane-wave ansatz approach", "abstract": "The bosonic Kitaev chain under open boundary conditions has attracted recent attention due to its realization in driven-dissipative systems and its intriguing non-Hermitian boundary physics. The model is known to be solvable via local squeezing transformations in the position-momentum representation. In this paper, we present an alternative, purely algebraic solution that relies entirely on the standard bosonic Bogoliubov transformation. For an $N$-site chain, we propose an asymmetric plane-wave ansatz with unequal left- and right-moving momenta to analytically solve the associated $2N\\times 2N$ non-Hermitian ``associated matrix\". The left eigenvalue problem yields $N$ distinct eigenvalues, each of which is twofold degenerate. By carefully resolving these degeneracies using the bosonic commutation relations, we construct the $N$ physical Bogoliubov quasiparticle operators. The construction reveals non-uniquenesses that in special cases exactly mirror the freedom in the local squeezing transformations of the original approach. The diagonal form of the Hamiltonian is obtained explicitly and is shown to be equivalent to the original Hamiltonian. The proposed asymmetric plane-wave ansatz and degeneracy-resolution technique are not limited to the present model and can be generalized to other bosonic pairing systems, including those with inhomogeneous pairing or hopping terms.", "url": "https://arxiv.org/abs/2608.29684", "type": "理论", "summary": "1. 该文利用标准玻色子Bogoliubov变换，为开边界玻色子Kitaev链提出一种纯代数的解析对角化方案。\n2. 其技术要点是采用左右动量不等的非对称平面波拟设求解2N×2N非厄米伴随矩阵，借助玻色子对易关系消除本征值的二重简并，构造N个物理Bogoliubov准粒子并显式给出与原始哈密顿量等价的对角形式。\n3. 该非对称拟设与简并分辨技巧可推广至含非均匀配对或跳跃项的玻色子配对系统，为非厄米边界物理及相关驱动耗散平台提供一般化处理途径。", "summary_source": "deepseek", "authors": [{"name": "Ning Wu"}, {"name": "Wen-Long You"}], "featured_authors": [{"name": "Ning Wu"}, {"name": "Wen-Long You"}], "author_count": 2}, {"id": "2608.29707", "category": "quant-ph", "title": "Tight Global Bound on Pairwise Entanglement of Formation in Three-Qubit Systems", "abstract": "We derive a global bound on the sum of pairwise squared entanglement of formation in three-qubit systems. The bound is tight and can be saturated by states containing a maximally entangled bipartite pair with an uncorrelated third qubit. Moreover, using this relation, we can map the three bipartite entanglements to three coordinates, such that any three-qubit state corresponds to a point in three-dimensional space, thereby endowing this global inequality with a very natural geometric picture. Accordingly, the dynamical evolution can be interpreted as trajectories in this geometric space; we select representative initial states and investigate the dynamical behavior of the three pairwise entanglements under various Markovian noise models.", "url": "https://arxiv.org/abs/2608.29707", "type": "理论", "summary": "1. 该工作推导了三量子比特体系中任意两体间纠缠形成度平方之和所满足的全局紧致上界。\n2. 其核心在于把三个两体纠缠量映射为三维坐标，使每个三量子比特态对应于三维空间中的一点，且该上界可由“最大纠缠对+无关第三比特”态饱和，从而赋予约束以自然几何图像。\n3. 据此将开放系统动力学视为该几何空间中的轨迹，并在多种马尔可夫噪声模型下考察代表性初态的成对纠缠演化，为多体纠缠结构与噪声动力学研究提供了几何化途径。", "summary_source": "deepseek", "authors": [{"name": "Wei Song"}, {"name": "Xiao-Lan Zong"}, {"name": "Ming Yang"}], "featured_authors": [{"name": "Wei Song"}, {"name": "Xiao-Lan Zong"}, {"name": "Ming Yang"}], "author_count": 3}, {"id": "2608.29734", "category": "quant-ph", "title": "The quantum supremum of the $I_{3322}$ Bell inequality is not attained in finite dimension", "abstract": "In 2010, Pál and Vértesi found a family of finite-dimensional strategies for the $I_{3322}$ Bell inequality whose optimized values appeared to converge as the local Hilbert-space dimension grew. They conjectured that this limit is the supremum over all finite-dimensional quantum strategies, but that no finite-dimensional strategy attains it. We prove both claims. The proof uses the symmetry of the Bell functional to associate every strategy with a finite matrix of probabilities, one for each pair of spectral subspaces of Alice and Bob. This matrix gives an upper bound on the Bell value, and finite-dimensional strategies built from the repeating structure found by Pál and Vértesi approach it as the dimension grows. If the bound were attained exactly in finite dimension, the optimality conditions would then require a state that cannot be normalized. Consequently, the set of finite-dimensional quantum correlations is not closed in the $(3,3,2,2)$ scenario, the smallest Bell scenario where this can happen. Moreover, approaching the supremum requires unbounded local dimension. The core of the proof was formalized in Lean~4.", "url": "https://arxiv.org/abs/2608.29734", "type": "理论+数值", "summary": "1. 该工作证明了\\(I_{3322}\\)贝尔不等式在有限维量子策略下的上确界无法被任何有限维策略达到，证实了Pál-Vértesi猜想。\n2. 其技术核心是利用贝尔泛函对称性将每个策略映射为概率矩阵，借此给出贝尔值上界，并表明若在有限维精确达到上界，则最优态无法归一化，且证明核心已在Lean 4中形式化。\n3. 该结果表明有限维量子关联集合在\\((3,3,2,2)\\)场景中不封闭，且逼近上确界必须使用无界局域维度，为量子关联的拓扑与几何性质提供了新约束。", "summary_source": "deepseek", "authors": [{"name": "Jef Pauwels"}], "featured_authors": [{"name": "Jef Pauwels"}], "author_count": 1}, {"id": "2608.29756", "category": "quant-ph", "title": "Pathwise Random Hamiltonian Simulation", "abstract": "Randomized product formulas such as qDrift offer a resource-efficient alternative to deterministic Trotter--Suzuki decompositions for Hamiltonian simulation, removing their polynomial dependence on the number of Hamiltonian terms. qDrift, however, is intrinsically limited to first order in the evolution time, so its query complexity remains linear in the inverse of the target accuracy, $1/\\epsilon$. We introduce Pathwise Random Hamiltonian Simulation (PRHS), which extends qDrift to arbitrary order by subdividing each time step into $M$ correlated slices, each evolving under a term sampled from a quasi-probability distribution that we construct in closed form and prove unique, with a bias decaying factorially in $M$. Optimizing jointly over the number of slices $M$ and the number of independent blocks $N$ interpolates between the standard qDrift protocol at long times and a high-precision regime where the query cost grows slower than any power of $1/\\epsilon$, without requiring ancillary qubits. Numerical simulations of five molecular Hamiltonians confirm this advantage, with PRHS achieving accuracies two to four orders of magnitude beyond qDrift at equal query cost.", "url": "https://arxiv.org/abs/2608.29756", "type": "理论+数值", "summary": "1. 该工作提出路径式随机哈密顿模拟方法，将 qDrift 随机乘积公式推广至任意阶以模拟哈密顿演化。\n2. 其核心是把每个时间步细分为 M 个关联切片，按闭式且唯一拟概率分布采样，使偏差随 M 阶乘衰减，并联合优化 M 与独立块数，使查询代价在无辅助比特下按 1/ε 的任意次幂更慢增长。\n3. 对五个分子哈密顿量的数值模拟显示，同等查询代价下精度比 qDrift 高两到四个数量级，为随机哈密顿模拟的高精度与可扩展应用提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Davide Cugini"}], "featured_authors": [{"name": "Davide Cugini"}], "author_count": 1}, {"id": "2608.29811", "category": "quant-ph", "title": "Dark state as a measurable state by a dispersive readout without a Purcell limit", "abstract": "It is believed that the enhancement in qubit-resonator coupling allows a better dispersive readout but introduces greater Purcell loss. In this work, we propose that a dark mode in a coupled quantum system may violate this rule by introducing the ZZ interaction between the dark and a bright mode. The dark mode may exhibit an effective zero coupling strength, and zero Purcell loss with the resonator photons. Nevertheless, the dispersive shift is almost the same as the bright state, due to the higher order perturbation introduced by the higher excited states. Such a state demonstrates the measurability without a Purcell limit in circuit quantum electrodynamics.", "url": "https://arxiv.org/abs/2608.29811", "type": "理论", "summary": "1. 该工作提出在电路量子电动力学中，暗模可通过与亮模的ZZ耦合获得可测性，即使其与谐振子光子的有效耦合强度为零，Purcell损耗也为零。\n2. 其物理卖点在于更高激发态贡献的高阶微扰使暗态色散频移几乎等同亮态，因而即使零耦合也不失去可读性。\n3. 这一机制揭示了色散读取与Purcell保护并非必须由强耦合同时实现，为超导量子比特的无损探测以及可扩展量子信息处理设计提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Wei-Chen Chien"}, {"name": "Jyh-Yang Wang"}, {"name": "Yen-Yu Chiang"}, {"name": "Cheng-Chengh Huang"}, {"name": "Lih-Chieh Hsaio"}, {"name": "Yen-Chun Chen"}, {"name": "Cen-Shawn Wu"}, {"name": "Chiidong Chen"}, {"name": "Watson Kuo"}], "featured_authors": [{"name": "Wei-Chen Chien"}, {"name": "Jyh-Yang Wang"}, {"name": "Yen-Yu Chiang"}, {"name": "Cen-Shawn Wu"}, {"name": "Chiidong Chen"}, {"name": "Watson Kuo"}], "author_count": 9}, {"id": "2608.29839", "category": "quant-ph", "title": "Ancilla-mediated fixed-point quantum search using Grover iterations", "abstract": "Grover's quantum search algorithm provides a fundamental quadratic speedup for unstructured datasets, reducing query complexity from $\\mathcal{O}(N)$ to $\\mathcal{O}(\\sqrt{N})$. However, the algorithm's reliance on precise iteration counts leads to the ``soufflé problem,'' where over-rotation results in a sharp decline in success probability. This limitation is particularly restrictive when the number of solution states, $M$, is unknown. In this work, we present an ancilla-mediated fixed-point quantum search algorithm that achieves robust convergence by mapping the solution amplitude to a dedicated ancilla qubit. Unlike existing phase-matching fixed-point methods, our approach utilizes Grover's real-plane reflections, thereby maintaining the intuitive geometric architecture of the original algorithm. We demonstrate that this method achieves a success probability of at least $92.6\\%$ with a query complexity of approximately $\\mathcal{O}(\\sqrt{N/M})$, effectively bridging the gap between standard amplitude amplification and robust fixed-point convergence.", "url": "https://arxiv.org/abs/2608.29839", "type": "理论+数值", "summary": "1. 该工作提出一种辅助比特介导的固定点量子搜索算法，通过Grover迭代将解振幅映射至专用辅助比特，实现无需精确迭代计数的稳健收敛。\n2. 不同于现有相位匹配固定点方案，本方法保留Grover实平面反射的几何结构，在未知解数量M时仍取得不低于92.6%的成功概率，查询复杂度约O(√(N/M))。\n3. 该成果填补了标准振幅放大与固定点搜索之间的效率-鲁棒性空白，为量子搜索及更广的量子算法设计提供了直观而可扩展的实现途径。", "summary_source": "deepseek", "authors": [{"name": "Yash Prabhat"}, {"name": "Snigdha Thakur"}, {"name": "Ankur Raina"}], "featured_authors": [{"name": "Yash Prabhat"}, {"name": "Snigdha Thakur"}, {"name": "Ankur Raina"}], "author_count": 3}, {"id": "2608.29926", "category": "quant-ph", "title": "Emergence of Strategic Equilibria from Transverse Field Ising Hamiltonian Dynamics", "abstract": "Game theory studies strategic decision-making among rational agents, and many classical games can be mapped onto interaction models such as the Ising model. Quantum game theory extends this framework by allowing players to exploit quantum superposition and entanglement. In this work, we study quantum games using an operator-based formulation derived from the transverse-field quantum Ising model. We show that the Hamiltonian-driven dynamics naturally generate entangling operator which resolve the dilemma in the game settings. This leads to a clear quantum advantage over classical outcomes. Unlike standard quantization schemes based on fixed entangling gates, the present approach enables tunable entanglement, controlled directly by physical Hamiltonian parameters, providing a hardware-relevant perspective on quantum game design.", "url": "https://arxiv.org/abs/2608.29926", "type": "理论", "summary": "1. 该工作基于横场量子伊辛模型的哈密顿动力学，建立了量子博弈的算符化表述框架，使经典博弈论模型嵌入统一的量子演化之中。\n2. 不同于依赖固定纠缠门的标准量子化方案，该体系中的哈密顿驱动自然产生可调纠缠算符以化解博弈困境，且纠缠强度由物理哈密顿参数直接调控，从而显现清晰的量子优势。\n3. 这一结果从硬件相关视角将博弈策略设计转化为哈密顿参数调节，为在近邻相互作用量子模拟器上实现可编程量子博弈提供了可行路径与理论支撑。", "summary_source": "deepseek", "authors": [{"name": "Teena Thomas"}, {"name": "S. Balakrishnan"}], "featured_authors": [{"name": "Teena Thomas"}, {"name": "S. Balakrishnan"}], "author_count": 2}, {"id": "2608.29969", "category": "quant-ph", "title": "The MS Unidirectional Current as a Generalization of the ABC Absorption Current", "abstract": "For a free scalar particle in one spatial dimension, in a single-pass half-line geometry, we compare the absorbing Robin boundary condition with the generalized Marchewka--Schuss (MS) unidirectional-current family. Robin absorption is characterized by a single parameter $\\kappa>0$: once $\\kappa$ is specified, its momentum-dependent absorption profile is fixed. In the generalized MS construction, by contrast, the detector response is described by a spectral function $\\lambda(k)$, subject to the positivity and subnormalization conditions of the detection law. We show that every Robin choice of $\\kappa$ corresponds to the particular MS calibration $\\lambda_\\kappa(k)=\\pi\\kappa/(k+\\kappa)^2$, which reproduces the complete Robin absorption current for every admissible one-sided spectral amplitude and at every time. Thus the entire one-parameter Robin absorption family is contained within the generalized MS family. The MS construction is more general: the choice $\\lambda_{\\rm full}(k)=\\pi/(4k)$ gives unit absorption efficiency for every wave number, which cannot be achieved by any fixed Robin parameter. In this precise sense, the generalized MS detector process extends the Robin absorbing-boundary family. We also compare their asymptotic behavior in the ballistic fixed-ray regime and in the fixed-distance late-time limit.", "url": "https://arxiv.org/abs/2608.29969", "type": "理论", "summary": "1. 该工作在一维半直线上对自由标量粒子比较了Robin吸收边界与广义Marchewka-Schuss单向流探测族，并建立了二者在吸收动力学上的对应关系。\n2. 其核心结果表明每个Robin参数κ等价于MS谱函数λ_κ(k)=πκ/(k+κ)^2，且MS选择λ_full(k)=π/(4k)可实现任意波数的单位吸收效率，这是任一固定Robin参数无法达到的。\n3. 该结果说明广义MS探测过程严格推广了Robin吸收边界族，并为含时探测与渐近极限下的量子吸收问题提供了更一般的理论视角。", "summary_source": "deepseek", "authors": [{"name": "Avi Marchewka"}], "featured_authors": [{"name": "Avi Marchewka"}], "author_count": 1}, {"id": "2608.30272", "category": "quant-ph", "title": "Modular-Annihilator Parent Hamiltonians for Purified Gibbs States: Spectral Design and Controlled Approximation", "abstract": "Purified Gibbs states provide a bridge between finite-temperature physics, dissipative dynamics, and ground-state methods. In this work, we study the exact finite sum-of-squares (SoS) construction of their parent Hamiltonians and the associated Lindbladian based on modular annihilators. Given a finite set of Hermitian generators, the corresponding modular annihilators yield a frustration-free SoS representation without continuous time integrals or an explicit decomposition into Bohr-frequency sectors. The purified Gibbs state remains a common zero mode while the freedom to choose and combine the generators can be used to optimize the spectral properties of the parent Hamiltonian. For free-fermion Hamiltonians, modular transformations act linearly on Majorana operators, leading to an analytically solvable family of parent Hamiltonians parameterized by a real symmetric coefficient matrix \\(S\\). For the scalar-functional subclass $S=f(h)$, we show that, at fixed operator norm, the choice $S_{\\mathrm{opt}}\\propto 1/\\sqrt{\\cosh(2\\beta h)}$ has mixing time upper bound $2\\log(2N/\\epsilon)$ for any $\\beta$, which exhibits rapid mixing and is irrelevant to the inverse temperature $\\beta$. For interacting systems, where the modularly dressed generators are not available in closed form, we introduce a Krylov--Lanczos approximation scheme and bound the resulting ground-state error in terms of the modular-approximation error and the parent-Hamiltonian gap. Numerical results illustrate the free-fermion spectral advantage and show how the accuracy of the interacting construction depends on temperature, interaction strength, and Krylov dimension.", "url": "https://arxiv.org/abs/2608.30272", "type": "理论+数值", "summary": "1. 该工作基于模零化子为纯化吉布斯态构造了母哈密顿量及其林德布拉德算子的精确有限平方和表示。\n2. 该构造无需连续时间积分或玻尔频率扇区；在自由费米体系中，模变换对马约拉纳算符线性作用，可解析优化谱性质并实现与逆温度无关的快速混合，相互作用体系则采用Krylov-Lanczos逼近并给出基态误差上界。\n3. 这为有限温度物理与基态方法之间的联系提供了谱设计与受控近似框架，为后续将快速混合方案与误差界分析推广至强关联模型奠定了基础。", "summary_source": "deepseek", "authors": [{"name": "Changhao Yi"}, {"name": "Jun Takahashi"}, {"name": "Cunlu Zhou"}], "featured_authors": [{"name": "Changhao Yi"}, {"name": "Jun Takahashi"}, {"name": "Cunlu Zhou"}], "author_count": 3}, {"id": "2608.30282", "category": "quant-ph", "title": "Best Annealing Path of Quantum Annealing via Efficient Adiabatic Phase Transition", "abstract": "Quantum Annealing (QA) has already put into practical use and considered useful for solving many social issues, such as reduction of traffic congestion and delivery optimization. But in QA, when the energy difference between the ground state and the first excited state is small, the transition probability between them increases. Therefore, in order to decrease the transition, QA has to be performed at extremely low temperatures. To simulate the situation, it has the problem in that it takes much time. Many studies are underway to accelerate QA theoretically, one of which is to incorporate non-stoquastic Hamiltonian. On the other hand, I proposed Nested Simulated Annealing (NSA) inspired by Quantum Monte Carlo (QMC). I showed the computational speedup could be achieved dramatically, by considering the idea that the effect of flipping a spin preferentially influenced the spins directly interacting with it. Although NSA was based on such classical concept of causality, the hybrid computation both quantum and classical approach worked well. In this paper, in order to discuss the relationship between NSA and non-stoquastic Hamiltonian like XX-interaction, the spins are treated as continuous variables. I derive the formula to calculate the total energy in both with a problem Hamiltonian and the perturbation Hamiltonian induced by a transverse electromagnetic field. And I will show a clear relationship between local-maxima and the convergence speed when calculating it with the binary spin. More precisely, the annealing path with the smallest local-maxima converges fast, even though it consumes fewer computational resources. Therefore, it is possible to induce an optimal adiabatic phase transition by selecting NSA parameters appropriately. This paper shows an effective method to choose the parameters when simulating QMC on a classical computer.", "url": "https://arxiv.org/abs/2608.30282", "type": "理论+数值", "summary": "1. 该工作针对量子退火中的能隙与跃迁问题，将自旋作为连续变量处理，推导出包含问题哈密顿量和横向电磁场微扰的总能量公式，并据此探讨了嵌套模拟退火(NSA)与非随机哈密顿量如XX相互作用的联系。\n2. 其核心卖点在于证明在二元自旋计算中，局部极大值越小的退火路径收敛越快且消耗更少计算资源，因而通过适当选取NSA参数能够诱导最优绝热相变。\n3. 这为在经典计算机上模拟量子蒙特卡洛过程时如何选择参数提供了有效方法，并为设计加速量子退火的混合量子—经典算法给出了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Kiyotaka Murashima"}], "featured_authors": [{"name": "Kiyotaka Murashima"}], "author_count": 1}, {"id": "2608.30308", "category": "quant-ph", "title": "Indirect stabilization of N -level quantum systems", "abstract": "We study the stabilizability of a N -level quantum systems using an indirect control ar- chitecture mediated by a noisy ancilla. After outlining the general theoretical framework for arbitrary N , we focus on the two-level case (N = 2), for which we derive a complete set of necessary and sufficient conditions for asymptotic stability. Finally, we illustrate the analyti- cal results with a simple numerical example on a two-spin system, showing convergence to a Bell state for a set of random initial conditions.", "url": "https://arxiv.org/abs/2608.30308", "type": "数值", "summary": "1. 该工作研究由含噪辅助比特作为中间媒介实现间接控制的N能级量子系统的可稳定化问题，先为任意N建立了统一理论框架，并在此基础上聚焦两能级情形。\n2. 其核心卖点在于针对N=2导出了渐近稳定性的完整必要且充分条件，并通过两自旋体系数值例子表明随机初态可稳定收敛至贝尔态。\n3. 该判据为噪声辅助间接控制下的靶态制备提供了理论依据，对开放量子系统的状态调控与相关实验设计具有直接启发作用。", "summary_source": "deepseek", "authors": [{"name": "Francesca Carlotta Chittaro"}], "featured_authors": [{"name": "Francesca Carlotta Chittaro"}], "author_count": 1}, {"id": "2608.30340", "category": "quant-ph", "title": "Exact quantum splitting and the structure of finite algebras", "abstract": "Berlekamp's algorithm factors a squarefree polynomial $f\\in\\mathbb{F}_q[x]$ by deterministic linear algebra, reducing the problem to splitting an explicit commutative algebra $B\\cong\\mathbb{F}_q^r$ into its $r$ simple factors. For large odd $q$, the standard efficient splitting step is randomized, while known derandomizations are conditional on the Extended Riemann Hypothesis. We give an unconditional exact quantum implementation in a circuit model permitting single-qubit rotations through efficiently computable angles. The construction uses an unconditional counting argument. For a block containing $s\\ge2$ irreducible factors, a quadratic-character test in odd characteristic and an absolute-trace test in characteristic $2$ yield a nonconstant test element with probability $p_{q,s}\\ge\\tfrac12$, known exactly in advance and depending only on $q$ and $s$, not on the unknown factorization. Exact amplitude amplification therefore converts each randomized test into a procedure succeeding with certainty after one amplification iteration. The resulting algorithm uses exactly $r-1$ quantum splitting rounds and $O(n^3\\log q)$ quantum $\\mathbb{F}_q$-operations and $O(n^3)$ classical operations, requiring no primitive root, quadratic non-residue, or distinct-degree preprocessing. The method also splits arbitrary finite-dimensional separable commutative $\\\\mathbb{F}_q$-algebras given by structure constants. Combined with R'onyai's classical structure theory, which computes the radical deterministically and reduces the remaining tasks deterministically to polynomial factorization, it yields the radical and the Wedderburn decomposition of $A/\\mathrm{Rad}(A)$ into minimal two-sided ideals, with certainty, for any $n$-dimensional associative $\\mathbb{F}_q$-algebra given by structure constants, using $O(n^4\\log q)$ quantum $\\mathbb{F}_q$-operations.", "url": "https://arxiv.org/abs/2608.30340", "type": "理论+数值", "summary": "1. 该工作给出有限域上多项式因式分解与任意可分有限交换代数分裂的无条件精确量子算法。\n2. 其核心是用二次特征与绝对迹测试构造非零测试元，经精确振幅放大实现单轮确定成功，无需随机化预处理。\n3. 与经典结构理论结合后，该方案还确定性计算结合代数的根与Wedderburn分解，为量子代数算法开辟了路径。", "summary_source": "deepseek", "authors": [{"name": "Muhammad Imran"}], "featured_authors": [{"name": "Muhammad Imran"}], "author_count": 1}, {"id": "2608.30370", "category": "quant-ph", "title": "Marginal spectral distributions on regular bipartite unitary orbits", "abstract": "Fix the spectrum of a bipartite density matrix and randomize its eigenbasis according to Haar measure. We study the probability distributions induced on the spectra of the two marginal states. For arbitrary subsystem dimensions $m$ and $n$, the joint characteristic function of the reduced density matrices is expressed as a Harish-Chandra-Itzykson-Zuber integral whose external eigenvalues are the pairwise sums $x_i + y_j$. Repeated external eigenvalues are handled by confluent determinant limits. In the two-qubit case, we derive an explicit alternating-spline formula for the joint density of the two marginal Bloch radii. Its support is the Bravyi-Klyachko compatibility region. We also obtain a compact truncated-power formula for the Bloch-radius density of either individual qubit marginal. In the qubit-qutrit case, we derive a truncated-power formula for the qubit Bloch-radius density and a bivariate spline formula for the joint density of the largest and smallest eigenvalues of the qutrit marginal. The latter two variables determine the full qutrit spectrum because the trace is fixed. The derivations combine confluent HCIZ integrals, distributional Fourier inversion, orbital measures, and the SU(2) and SU(3) derivative principles. The resulting densities are piece-wise polynomial on chambers determined by subset sums of the fixed global eigenvalues, in agreement with the Duistermaat-Heckman description of projected coadjoint-orbit measures.", "url": "https://arxiv.org/abs/2608.30370", "type": "理论", "summary": "1. 该工作对固定整体谱的二分量子密度矩阵按Haar随机幺正基转动，推导了两个约化态谱分布的精确解析公式。\n2. 其技术核心是将联合特征函数化为外本征值为x_i+y_j的合流HCIZ积分，并通过合流行列式极限与分布Fourier反演，得到两比特和比特-丘比特情形的样条与截断幂公式。\n3. 所得密度在由整体本征值子集和决定的室上分段多项式，印证了投影余伴随轨道测度的Duistermaat-Heckman描述，为量子相容性与关联研究提供工具。", "summary_source": "deepseek", "authors": [{"name": "Lin Zhang"}], "featured_authors": [{"name": "Lin Zhang"}], "author_count": 1}, {"id": "2608.30629", "category": "quant-ph", "title": "Gate-Efficient Implementation of the Query-Optimal Time-Dependent Hamiltonian Simulation", "abstract": "The query-optimal algorithm of [CGWZ26] for general time-dependent Hamiltonian simulation uses $$ q = O\\left( \\alpha T + \\frac{\\log(1/\\varepsilon)}{\\log\\left(e + \\log(1/\\varepsilon)/(\\alpha T) \\right)} \\right) $$ queries to $\\mathrm{HAM\\mbox{-}T}$ within $\\varepsilon$ error for a Lipschitz-continuous time-dependent Hamiltonian $H(t)$ on $[0,T]$ satisfying $\\left\\lVert H(t)\\right\\rVert\\leq\\alpha$. However, its direct circuit implementation incurs a substantially larger gate overhead. In this note, we give an implementation of the same algorithm that retains its optimal query complexity and uses $$ O\\left[ q \\left( a + \\log\\left(1 + \\frac{T(\\alpha + \\beta T)}{\\varepsilon} \\right) \\right) \\right] $$ one- and two-qubit gates, where $a$ is the number of block-encoding ancilla qubits and $\\beta$ is the Lipschitz constant of $H$. The main ingredient is an exact dyadic factorization of the ordered update product in the underlying one-query transducer.", "url": "https://arxiv.org/abs/2608.30629", "type": "理论+数值", "summary": "1. 该笔记给出查询最优的含时哈密顿量模拟算法的一种高效电路实现，在维持最优查询复杂度的同时显著降低门开销。\n2. 其关键技术是对底层单查询换能器中的有序更新积进行精确二进因子分解，使一、二比特门数达到 O[q(a+log(1+T(α+βT)/ε))]。\n3. 这为查询最优算法在容错量子计算中的实际部署提供了可行途径，尤其适用于长时演化与高精度模拟场景。", "summary_source": "deepseek", "authors": [{"name": "Boyang Chen"}, {"name": "Minbo Gao"}, {"name": "Zhengfeng Ji"}, {"name": "Tongyang Li"}, {"name": "Xinzhao Wang"}, {"name": "Shuo Zhou"}], "featured_authors": [{"name": "Boyang Chen"}, {"name": "Minbo Gao"}, {"name": "Zhengfeng Ji"}, {"name": "Tongyang Li"}, {"name": "Xinzhao Wang"}, {"name": "Shuo Zhou"}], "author_count": 6}, {"id": "2608.30660", "category": "quant-ph", "title": "Trade-off between Cooling-Step Count and Geometric Implementation Cost in Non-Markovian Algorithmic Cooling", "abstract": "Quantum cooling is important for reliable quantum computation but involves a trade-off between cooling performance and implementation resources. Although reservoir memory can improve particular aspects of cooling performance, the associated resource cost, particularly for circuit implementation, remains insufficiently understood. Here, we investigate how reservoir memory affects the trade-off between cooling performance quantified by the cooling-step count and geometric implementation cost in single-qubit heat-bath algorithmic cooling. Using a pseudomode mapping, we represent the non-Markovian damped Jaynes--Cummings dynamics by a repeated collision circuit and evaluate its geometric implementation cost. Using matrix-based simulations and an implementation on the ibm_kawasaki Heron r2 processor, we identify a trade-off: suppressing reservoir memory reduces the cooling-step count but generally increases the geometric protocol cost. Our work provides a resource-based perspective on reservoir engineering for algorithmic cooling.", "url": "https://arxiv.org/abs/2608.30660", "type": "理论+数值", "summary": "1. 该工作研究了单比特热浴算法冷却中，储层记忆对冷却步数与几何实现成本之间权衡的影响。\n2. 通过赝模映射将非马尔可夫阻尼Jaynes–Cummings动力学表示为重复碰撞电路，并结合矩阵模拟与超导量子处理器实验，发现抑制储层记忆虽减少冷却步数，却普遍抬高几何协议成本。\n3. 这为算法冷却的储层工程提供了资源成本视角，有助于设计兼顾冷却性能与电路可实现性的量子冷却方案。", "summary_source": "deepseek", "authors": [{"name": "Yohei Azumai"}, {"name": "Yoshihiko Hasegawa"}], "featured_authors": [{"name": "Yohei Azumai"}, {"name": "Yoshihiko Hasegawa"}], "author_count": 2}, {"id": "2608.30681", "category": "quant-ph", "title": "Entanglement-enabled Criticality in One-dimensional Quantum Contact Process", "abstract": "The contact process is a paradigmatic example of nonequilibrium dynamics, with broad applications ranging from chemistry to sociology. Its quantum counterpart, the quantum contact process (QCP), extends the classical model to include coherent processes. Despite sustained interest, the nature of the transition in the one-dimensional (1D) QCP remains debatable. Here, combining Liouvillian spectral analysis, the tensor jump method, exact quantum jump Monte Carlo, and truncated Wigner simulations, we show that 1D QCP undergoes a continuous absorbing-state phase transition, with critical exponents distinct from the classical case. We further find Liouvillian gap closes well below the critical point, highlighting that spectral gap analysis alone cannot distinguish a phase transition from metastability in the QCP. Crucially, the 1D QCP is weakly entangled, yet even this weak entanglement is indispensable for capturing the correct critical behavior, whereas semiclassical methods artificially stabilize the active state and predict a spurious first-order transition. Our work establishes the quantum origin of the phase transition in the 1D QCP and underscores the essential role of entanglement in dissipative quantum many-body systems.", "url": "https://arxiv.org/abs/2608.30681", "type": "理论+数值", "summary": "1. 该工作结合刘维尔谱分析、张量跳变、精确量子跳变蒙特卡洛与截断维格纳模拟，证明一维量子接触过程发生连续吸收态相变且临界指数不同于经典情形。\n2. 其核心发现是体系虽弱纠缠，但该纠缠对正确临界行为不可或缺，且刘维尔能隙在临界点以下即闭合，表明谱隙分析无法区分相变与亚稳定性。\n3. 这确立了一维量子接触过程相变的量子起源，并凸显纠缠在耗散量子多体系统中的关键作用，为相关开放系统研究提供启示。", "summary_source": "deepseek", "authors": [{"name": "Ya-Xin Xiang"}, {"name": "Tianyi Yan"}, {"name": "Weibin Li"}, {"name": "Yu-Qiang Ma"}], "featured_authors": [{"name": "Ya-Xin Xiang"}, {"name": "Tianyi Yan"}, {"name": "Weibin Li"}, {"name": "Yu-Qiang Ma"}], "author_count": 4}, {"id": "2608.30697", "category": "quant-ph", "title": "Flatness-Preserving Operations", "abstract": "A quantum state is called flat if it is proportional to a projector. There has been recent interest in studying antiflatness, the property of diverging from flat states, and establishing a resource theory for it. Identifying the free operations (the Flatness-Preserving Operations (FPOs)) remained an open problem. For this purpose, we first discuss Orthogonality-Preserving Operations (OPOs), of which trivial examples are unitary operations in an isolated system. More generally, we give a simple proof that all OPOs are isometric embeddings consisting of combinations of unitaries/isometries and appending a fixed state. We then show that all FPOs are either constant maps to some fixed flat state or a special case of an OPO, where the appended fixed state must be a flat state. We also show that the only possible flat convex combinations of flat states are those of orthogonal flat states with weights given by their purities.", "url": "https://arxiv.org/abs/2608.30697", "type": "理论", "summary": "1. 该工作刻画了量子态平坦性保持操作（FPOs），解决了反平坦资源理论中自由操作的开放表征问题。\n2. 作者先证明所有保正交操作必为酉/等距嵌入并附加固定态的复合，再由此证明FPOs要么是到某个固定平坦态的常值映射，要么是该复合且附加态必须平坦。\n3. 此外，平坦态的平坦凸组合仅能由权重为其纯度的正交平坦态构成，为资源理论中的态制备与量化提供了严格约束和后续研究方向。", "summary_source": "deepseek", "authors": [{"name": "Otto Veltheim"}, {"name": "Esko Keski-Vakkuri"}], "featured_authors": [{"name": "Otto Veltheim"}, {"name": "Esko Keski-Vakkuri"}], "author_count": 2}, {"id": "2608.30771", "category": "quant-ph", "title": "PauLie: Fast Classification of Pauli Dynamical Lie Algebras", "abstract": "The dynamical Lie algebra (DLA) governs the controllability, expressibility, and simulation complexity of a quantum system. Explicitly computing it has been a major computational bottleneck: brute-force Lie closure scales exponentially in the number of qubits $n$. Many applications, however, consult only the isomorphism type of the DLA. We introduce PauLie, an open-source framework that decides this isomorphism type for DLAs generated by arbitrary Pauli strings, building on the anticommutation-graph reduction of Aguilar et al. PauLie runs in $O(n|\\mathcal{G}|\\max(n,|\\mathcal{G}|))$ time, where $|\\mathcal{G}|$ is the number of generators, turning DLA classification into a routine preprocessing step. We demonstrate its use as a structural oracle for routing Lie-algebraic simulation and Cartan decomposition, diagnosing barren plateaus in variational quantum algorithms, and engineering universal Pauli string generator sets with optimal generation rate.", "url": "https://arxiv.org/abs/2608.30771", "type": "理论+数值", "summary": "1. 该工作针对量子系统动力学李代数(DLA)的同构类型分类问题，引入开源框架PauLie，适用于任意Pauli字符串生成元。\n2. 其核心卖点在于采用反交换图归约，将传统暴力李闭包的指数级复杂度降至O(n|G|max(n,|G|))，使分类成为常规预处理步骤。\n3. 该框架可充当结构预言机，用于加速李代数模拟与Cartan分解、诊断变分量子算法中的贫瘠高原，并设计最优生成速率的通用Pauli生成集。", "summary_source": "deepseek", "authors": [{"name": "Oxana Shaya"}, {"name": "Konstantin Golovkin"}, {"name": "Mainak Roy"}, {"name": "Vincent Russo"}], "featured_authors": [{"name": "Oxana Shaya"}, {"name": "Konstantin Golovkin"}, {"name": "Mainak Roy"}, {"name": "Vincent Russo"}], "author_count": 4}, {"id": "2608.30775", "category": "quant-ph", "title": "Quantum Block Turbo Codes", "abstract": "In the early nineties, the introduction of turbo codes revolutionized classical error correction. The idea was mainly applied on two types of codes: convolutional turbo codes and turbo product codes. The first type of codes was adapted to quantum error correction which initiated the theory of quantum serial turbo codes. In this paper, we present a theory for quantum block turbo codes, the quantum analog of the second type of turbo codes. We describe their iterative decoding algorithm and simulate their performances on a depolarizing channel for different constituent codes.", "url": "https://arxiv.org/abs/2608.30775", "type": "理论+数值", "summary": "1. 该工作建立了量子分组涡轮码的完整理论，这是经典涡轮乘积码在量子纠错领域的类比，涵盖编码构造并给出了对应的迭代译码算法。\n2. 主要技术贡献在于针对多种不同分量码，在去极化信道模型下模拟了所提码字的译码性能，展示其相对于量子串行涡轮码的互补优势与收敛特性。\n3. 该理论填补了量子涡轮码家族中分组类型这一缺失环节，为未来利用结构化乘积码实现低开销、高效量子纠错提供了理论参照与数值基准。", "summary_source": "deepseek", "authors": [{"name": "Khaled Jebari"}, {"name": "Luiz Anet Neto"}, {"name": "Ramesh Pyndiah"}, {"name": "Jean-Louis de Bougrenet de la Tocnaye"}], "featured_authors": [{"name": "Khaled Jebari"}, {"name": "Luiz Anet Neto"}, {"name": "Ramesh Pyndiah"}, {"name": "Jean-Louis de Bougrenet de la Tocnaye"}], "author_count": 4}, {"id": "2608.30860", "category": "quant-ph", "title": "Well-conditioned iterative methods for large open quantum systems", "abstract": "Markovian open quantum systems are well modeled by the Lindblad Master Equation (ME) $\\frac{\\mathrm{d}}{\\mathrm{d} t} \\rho_t = \\mathcal{L} \\rho_t$, where $\\mathcal{L}$ is a linear (super-)operator and $\\rho_t$ is the system state, a positive matrix. When designing or characterizing a quantum system, one is usually interested in the steady state $\\rho_\\infty$ (such that $\\mathcal{L} \\rho_\\infty = 0$), the first few excited states, and trajectories $t\\mapsto \\rho_t$. In finite dimension, $\\rho_t$ is an $n\\times n$ matrix, $\\mathcal{L}$ thus typically costs $n^4$ to store explicitly as a dense matrix, and $O(n^6)$ to diagonalize or invert exactly, making standard linear algebraic techniques expensive for large systems. However, $\\mathcal{L}$ usually costs only $O(n^3)$ to apply. This makes iterative methods appealing, but they do not work without a good preconditioner. In this article, our main observation is that a part of the Lindblad equation, corresponding to the so-called no-jump evolution $\\mathcal{S}$, can be inverted efficiently. Using this inverse map, we introduce an auxiliary completely positive trace-preserving (CPTP) map $\\Phi$ whose fixed point is directly related to $\\rho_\\infty$, all the other eigenvalues having smaller magnitude. The map $\\Phi$ is thus well suited to iterative methods, and $\\rho_\\infty$ can be found in a few Arnoldi iterations. Using the same inverse map $\\mathcal{S}^{-1}$ as preconditioner, we compute the low-lying spectrum efficiently via shift-invert Arnoldi, and, as a proof of concept, build an implicit time integrator that is competitive on stiff systems in the low-precision regime. For the steady-state and low excited states problems, our methods scale like $O(n^3)$ per iteration and offer state-of-the-art performance on CPU and GPU.", "url": "https://arxiv.org/abs/2608.30860", "type": "理论+数值", "summary": "1. 该工作针对大规模马尔可夫开放量子系统提出良态迭代方法，用于高效求解林德布拉德主方程的稳态、低激发谱与时间演化轨迹。\n2. 其核心卖点是将无跳跃演化项精确求逆，构造辅助完全正保迹映射与预条件子，使Arnoldi迭代快速收敛，单步计算量仅O(n^3)。\n3. 该方法在CPU与GPU上均具先进性能，为可扩展的量子耗散模拟和刚性系统低精度积分器提供了实用路径与清晰启发。", "summary_source": "deepseek", "authors": [{"name": "Gaspard Beugnot"}, {"name": "Paul Gregory"}, {"name": "Rémi Robin"}, {"name": "Antoine Tilloy"}], "featured_authors": [{"name": "Gaspard Beugnot"}, {"name": "Paul Gregory"}, {"name": "Rémi Robin"}, {"name": "Antoine Tilloy"}], "author_count": 4}, {"id": "2608.30937", "category": "quant-ph", "title": "Constrained minimax approximation for quantum signal processing", "abstract": "Quantum signal processing (QSP) provides a simple and efficient framework for implementing polynomial transformations using quantum circuits. Its classical design stage leads to a constrained minimax approximation problem: find a polynomial of prescribed parity that approximates a target function uniformly on a fitting set while remaining bounded in magnitude by one on the domain $[0,1]$, which can be viewed as a semi-infinite constraint. Discretization converts the problem into a linear program, but feasibility at a set of finitely many sampled points does not ensure feasibility on the whole domain, especially when an optimal approximant reaches the boundary of the feasible set. We investigate two approaches to address this difficulty. A Remez exchange method combined with active-set constraint enforcement is efficient on many tested instances, but its stability depends on the target and problem geometry. We then introduce nonlinear Fourier retraction, which uses QSP completion and phase synthesis to turn a nearly feasible polynomial into phase factors for a feasible QSP polynomial without increasing the degree. Across representative problems, retraction largely preserves approximation accuracy and remains effective on instances where the Remez heuristic is unstable. The resulting workflow connects classical minimax approximation and semi-infinite optimization with nonlinear Fourier analysis, and is implemented in the qsppack software package.", "url": "https://arxiv.org/abs/2608.30937", "type": "理论+数值", "summary": "1. 该工作针对量子信号处理中的约束极小极大逼近问题，提出了结合Remez交换与非线性Fourier回撤的求解流程。\n2. 其核心卖点在于用QSP补全与相位合成将仅近似可行的多项式转化为同阶可行多项式，从而避免离散化线性规划在整段约束上的不可行风险。\n3. 这为经典极小极大逼近与半无限优化及非线性Fourier分析的交叉应用提供了可扩展的数值工具和理论启发。", "summary_source": "deepseek", "authors": [{"name": "Yulong Dong"}, {"name": "James B. Larsen"}, {"name": "Lin Lin"}, {"name": "Rahul Sarkar"}], "featured_authors": [{"name": "Yulong Dong"}, {"name": "James B. Larsen"}, {"name": "Lin Lin"}, {"name": "Rahul Sarkar"}], "author_count": 4}, {"id": "2608.31011", "category": "quant-ph", "title": "Protected Logical Qudits in Kitaev Quantum Double Models via Stable Representations", "abstract": "Fault-tolerant quantum computation requires robust protection of encoded quantum information. In this work, we develop a representation-theoretic framework for constructing protected logical qudits in finite-group Kitaev quantum double models. By introducing $\\varepsilon$-stable irreducible representations, we establish a necessary and sufficient existence criterion and derive ribbon--projector commutation relations that yield a $d$-dimensional protected logical subspace. We apply this construction to symmetric and alternating groups, obtaining logical qubits for $S_n$ ($n\\ge 3$) and a logical qutrit for $A_4$. Moreover, the family $(\\mathbb Z_2)^d\\rtimes\\mathbb Z_d$ realizes protected logical qudits of arbitrary dimension $d\\ge 2$. Finally, for $D(A_4)$, we describe a scheme for universal logical qutrit computation using ribbon-based logical operations.", "url": "https://arxiv.org/abs/2608.31011", "type": "理论", "summary": "1. 该工作为有限群Kitaev量子双模型建立表示论框架，用以构造受拓扑保护的逻辑量子d进制。\n2. 核心在于引入ε-稳定不可约表示并导出ribbon-投影子对易关系，给出d维逻辑子空间存在的充要判据。\n3. 该构造在S_n与A_4中实现逻辑量子比特/三比特，且特定群族可实现任意维逻辑d进制，利于通用ribbon逻辑门计算。", "summary_source": "deepseek", "authors": [{"name": "Naihong Hu"}, {"name": "Futao Wang"}], "featured_authors": [{"name": "Naihong Hu"}, {"name": "Futao Wang"}], "author_count": 2}, {"id": "2608.31081", "category": "quant-ph", "title": "Deterministic Minimum-Output-Entropy Nonadditivity via Haagerup's Inequality and Near-Free Permutation Representations", "abstract": "We give a deterministic realization of the finite-dimensional quadratic certificate underlying Collins's mixed-unitary proof of minimum-output-entropy nonadditivity. For every fixed integer $K\\ge 2$ and rational $\\eta>0$ satisfying $\\log K>2(3+\\eta)^2$, a deterministic polynomial-time algorithm, for every sufficiently large target size $N$, outputs $K$ permutations on $N'=N+o_{K,\\eta}(N)$ points. Restricting their permutation matrices to the nontrivial standard representation yields real orthogonal Stinespring blocks and a channel $\\Phi_{N'}:M_{N'-1}(\\mathbb{C})\\to M_K(\\mathbb{C})$ such that \\[ 2H_{\\min}(\\Phi_{N'}) -H_{\\min}(\\Phi_{N'}^{\\otimes 2}) \\ge \\frac{\\log K}{K} -2\\log\\left(1+\\frac{(3+\\eta)^2}{K}\\right) >0. \\] The construction combines Haagerup's length-two inequality with the simultaneous deterministic spectral approximation of O'Donnell and Wu. We further show that the constant $3$ is asymptotically sharp on the relevant Hermitian zero-diagonal coefficient class and that the finite spectral transfer is nearly saturated, thereby isolating the finer geometry of the full output body as the natural next level of refinement beyond the scalar-radius method. Finally, a standard covariant extension converts the same deterministic entropy gap exactly into self-tensor superadditivity of the one-shot Holevo quantity.", "url": "https://arxiv.org/abs/2608.31081", "type": "理论+数值", "summary": "1. 该工作给出了最小输出熵不可加性的确定性实现，基于Haagerup不等式与近自由置换表示构造了一族显式量子信道。\n2. 其技术核心是将Haagerup长度二不等式与O'Donnell-Wu确定性谱近似结合，对满足log K>2(3+η)^2的任意K，多项式时间算法输出置换并产生严格正的熵缺口，且常数3在该系数类上渐近最优。\n3. 通过标准协变扩展，该确定性缺口精确转化为单次Holevo量的自张量超可加性，并将输出体细几何而非标量半径视为下一步自然改进方向。", "summary_source": "deepseek", "authors": [{"name": "Guocheng Zhen"}, {"name": "Chengkai Zhu"}, {"name": "Ranyiliu Chen"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "Guocheng Zhen"}, {"name": "Chengkai Zhu"}, {"name": "Ranyiliu Chen"}, {"name": "Xin Wang"}], "author_count": 4}, {"id": "2608.31112", "category": "quant-ph", "title": "Unconditional Certified Randomness without Structure", "abstract": "We obtain a certified randomness protocol in the quantum random oracle model. The protocol is non-interactive and publicly verifiable with a classical verifier, and is based on Yamakawa and Zhandry's proof of quantumness [JACM'24]. We prove unconditional security of this protocol against adversaries making subexponentially-many adaptive quantum queries to the random oracle. Prior work on certified randomness relative to a random oracle additionally assumed the Aaronson--Ambainis conjecture or proved security only against low query-depth adversaries.", "url": "https://arxiv.org/abs/2608.31112", "type": "理论", "summary": "1. 该工作提出了随机预言机模型下一种非交互、可公开验证且由经典验证者执行的认证随机性协议。\n2. 其技术核心在于基于 Yamakawa-Zhandry 量子性证明构造协议，并证明对最多亚指数次自适应量子查询的攻击者具有无条件安全性，无需 Aaronson–Ambainis 猜想或低查询深度假设。\n3. 这为无需额外结构假设的量子随机性提取建立了更稳健的理论基准，并可能启发更简化的可验证量子优势协议设计。", "summary_source": "deepseek", "authors": [{"name": "Andrea Coladangelo"}, {"name": "Dakshita Khurana"}, {"name": "Saachi Mutreja"}, {"name": "Bhaskar Roberts"}, {"name": "Joseph Slote"}, {"name": "Avishay Tal"}], "featured_authors": [{"name": "Andrea Coladangelo"}, {"name": "Dakshita Khurana"}, {"name": "Saachi Mutreja"}, {"name": "Bhaskar Roberts"}, {"name": "Joseph Slote"}, {"name": "Avishay Tal"}], "author_count": 6}, {"id": "2608.31156", "category": "quant-ph", "title": "Bosonic codes from compact phase spaces", "abstract": "We present the algebraic structure of bosonic quantum error-correcting codes on genus-two Riemann surfaces. We explicitly construct the code words as automorphic forms and analytically generate the full tower of code spaces at all weights. We prove a fundamental no-go theorem: for any genus greater than one, the stabilizer group is non-amenable, forcing a strictly positive spectral gap in the stabilizer Hamiltonian. Consequently, no normalizable quantum state can satisfy all stabilizer conditions. This sharply contrasts with standard Gottesman-Kitaev-Preskill (GKP) codes, where the amenability of the stabilizer group $\\mathbb{Z}^2$ permits approximate code words with arbitrary precision.", "url": "https://arxiv.org/abs/2608.31156", "type": "理论", "summary": "1. 作者在亏格二紧黎曼曲面上构建玻色子量子纠错码的自守形式代数结构，并解析生成所有权重的码空间塔。\n2. 其核心证明是一个no-go定理：任意亏格大于一的稳定子群均非可均，导致稳定子哈密顿量具有正谱隙，因此不存在满足全部稳定子条件的可归一化量子态。\n3. 该结果与GKP码的可均稳定子群形成鲜明对照，表明高亏格紧致相空间无法承载精确码态，为理解稳定子可均性与近似码字的联系提供了严格约束。", "summary_source": "deepseek", "authors": [{"name": "David Roberts"}, {"name": "Aaron Slipper"}, {"name": "Alireza Parhizkar"}, {"name": "Victor V. Albert"}, {"name": "Mohammad Hafezi"}], "featured_authors": [{"name": "David Roberts"}, {"name": "Aaron Slipper"}, {"name": "Alireza Parhizkar"}, {"name": "Victor V. Albert"}, {"name": "Mohammad Hafezi"}], "author_count": 5}, {"id": "2608.31165", "category": "quant-ph", "title": "Efficient search for excitable zero-modes in constrained systems", "abstract": "Kinetically constrained systems, such as those representing Rydberg atom arrays in the blockade regime, have gathered considerable attention due to the presence of atypical eigenstates in their spectrum. The latter manifests itself through the presence of quantum many-body scars as well as unusually large zero-mode (ZM) subspaces which contain analytically tractable eigenstates with various entanglement scalings. In particular, some of the latter are excitable zero-modes (EZMs), meaning that they can be promoted to a non-zero energy for open boundary conditions. In this work, I present an efficient protocol for finding analytical expressions for translation-invariant EZMs in constrained systems, based on the eigendecomposition of the local unconstrained Hamiltonian. I demonstrate the power of this method on a decorated Rydberg chain. In that model, my protocol directly produces a continuous matrix-product-state manifold located entirely in the zero-energy eigenspace for periodic boundary conditions. The span of that manifold grows exponentially with the system, and for odd system sizes it covers the entire zero-momentum eigenspace with zero energy. I then show how the physical structure of the manifold, which is tied to the local eigenbasis, also allows one to derive analytical expressions for ZMs at non-zero momentum and for a polynomial number of exact scars at $E=\\pm\\sqrt{3}$.", "url": "https://arxiv.org/abs/2608.31165", "type": "理论", "summary": "1. 该工作提出了一种在动力学约束系统中高效搜索可激发零模的分析协议，并应用于装饰性里德堡链。\n2. 其核心技术是基于局域无约束哈密顿量的本征分解，直接构建出周期边界下零能连续矩阵乘积态流形，并证明其张成空间随系统尺寸指数增长且可覆盖全部零动量零能本征空间。\n3. 该构造还衍生出非零动量零模及能量为±√3的多项式个精确量子疤痕，为约束系统的非热态分类和可解本征态设计提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Jean-Yves Desaules"}], "featured_authors": [{"name": "Jean-Yves Desaules"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
