  <title>arXiv 2026-09-01 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2608.28719", "category": "cond-mat", "title": "Emergent hydrodynamic response and dynamical backreaction: Magnon bound-state propagation in a Bose-Hubbard fluid", "abstract": "We study the nonequilibrium response of a one-dimensional Bose-Hubbard medium to a two-magnon bound state propagating along an attractive XXZ chain. A Holstein-type displacement coupling makes the magnon density act both as a local chemical-potential perturbation and as a source of bosons. We derive a long-wavelength hydrodynamic description of the density and phase fluctuations and test it against matrix-product-state simulations of the full coupled dynamics. The theory predicts a comoving near-field deformation together with retarded density waves confined to a sound cone. In the Mott regime, the deformation remains localized around the moving pair. In the compressible regime, two counterpropagating fronts detach and approach the semiclassical sound velocity, recovered from the equilibrium density with no fitted parameters. The coupling also induces a dynamical backreaction that slows the bound state and broadens its magnon-density profile. The comparison delimits where hydrodynamics stays quantitative once the probe reacts back on the medium.", "url": "https://arxiv.org/abs/2608.28719", "type": "理论+数值", "summary": "1. 该工作研究一维Bose-Hubbard介质对沿吸引性XXZ链传播的双磁子束缚态的非平衡响应。\n2. 通过Holstein型位移耦合建立密度与相位的长波流体力学描述，并用矩阵乘积态模拟验证，预言声锥内滞后密度波与随动近场形变，可压缩区声速无参数地由平衡密度恢复。\n3. 耦合导致的动力学反作用使束缚态减速并展宽其磁子密度轮廓，为探针反作用于介质时流体力学定量有效的边界提供了明确判据。", "summary_source": "deepseek", "authors": [{"name": "Andrés N. Cáliz"}, {"name": "Arnau Riera"}, {"name": "Enrique Rico"}, {"name": "João Barata"}, {"name": "Marcin Płodzień"}], "featured_authors": [{"name": "Andrés N. Cáliz"}, {"name": "Arnau Riera"}, {"name": "Enrique Rico"}, {"name": "João Barata"}, {"name": "Marcin Płodzień"}], "author_count": 5}, {"id": "2608.28731", "category": "cond-mat", "title": "Statistical Properties of a Fluctuation-Driven Nanomechanical Duffing Resonator", "abstract": "We investigate the fluctuating nonlinear dynamics of multiple modes of a nanomechanical doubly clamped beam resonator. Each mode is driven by Gaussian force noise centered around the resonance; the mode response is monitored while the force magnitude is increased, inducing a transition from harmonic to the nonlinear Duffing regime. To characterize the dynamics, we introduce an effective temperature based on the mode fluctuation amplitude. As the nonlinearity becomes prominent at large amplitudes, we observe a reduction in the effective thermal energy and a crossover in response statistics from Gaussian to platykurtic, consistent with the dynamics expected in a Duffing potential.", "url": "https://arxiv.org/abs/2608.28731", "type": "理论", "summary": "1. 该工作研究了高斯随机力噪声驱动下纳米机械双端固支梁谐振器多模从简谐响应到Duffing非线性响应的涨落动力学转变。\n2. 其核心在于用模涨落幅度定义有效温度，并揭示非线性增强时有效热能降低以及响应统计由高斯向低峰态(platykurtic)交叉的特征。\n3. 这为噪声驱动非线性纳米机械系统的统计热力学理解及基于非线性涨落特征的纳米机械探测提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Monan Ma"}, {"name": "Nathan Welles"}, {"name": "Johnathon Barbish"}, {"name": "Ismet I. Kaya"}, {"name": "M. Selim Hanay"}, {"name": "Oleksiy Svitelskiy"}, {"name": "Mark R. Paul"}, {"name": "Kamil L. Ekinci"}], "featured_authors": [{"name": "Monan Ma"}, {"name": "Nathan Welles"}, {"name": "Johnathon Barbish"}, {"name": "Oleksiy Svitelskiy"}, {"name": "Mark R. Paul"}, {"name": "Kamil L. Ekinci"}], "author_count": 8}, {"id": "2608.28739", "category": "cond-mat", "title": "Fractal Confinement and Magnetic Self-sabotage of Current Flow: Electrons Near the Metal-insulator Crossover in a 2D $δ$-layer", "abstract": "We study low-$T$ transport and itinerant magnetism in 2D $\\delta$-doped semiconductors. Large-scale Hartree-Fock calculations with random hoppings and repulsion $U_0$ reveal two transport regimes near a critical density. The conductivity $\\sigma(T)$ initially increases as $T$ drops below $U_0 / 10$. However, at $T \\sim U_0/100$, a tiny density of magnetic moments forms, driving an insulating downturn. Fractal wavefunctions locally amplify magnetic interactions, initially concentrating currents into branched filaments, but ultimately choking them off via dynamic SU(2) symmetry breaking.", "url": "https://arxiv.org/abs/2608.28739", "type": "理论+数值", "summary": "1. 该工作利用大尺度Hartree-Fock计算研究二维δ掺杂半导体在临界密度附近的低温输运与巡游磁性，识别出两个输运区间。\n2. 其核心在于揭示分形波函数局域放大磁性相互作用：降温至U0/10以下电导先升，而在U0/100附近少量磁矩通过动态SU(2)对称破缺扼断支化电流丝，造成绝缘性回摆。\n3. 这一磁性自挫机制为理解金属-绝缘体交叉附近分形电子态与电流输运的耦合提供了新图像，并对无序电子系统中磁涨落调控电导的研究具有启发。", "summary_source": "deepseek", "authors": [{"name": "Xinghai Zhang"}, {"name": "Matthew S. Foster"}, {"name": "Markus Mueller"}], "featured_authors": [{"name": "Xinghai Zhang"}, {"name": "Matthew S. Foster"}, {"name": "Markus Mueller"}], "author_count": 3}, {"id": "2608.28742", "category": "cond-mat", "title": "Determinant Quantum-Quantum Monte Carlo: Coherent Auxiliary-Field Sampling", "abstract": "We introduce determinant quantum-quantum Monte Carlo (DQ$^2$MC), a quantum algorithm that lifts the auxiliary-field sampling and averaging at the operational core of determinant quantum Monte Carlo onto a quantum computer. A determinant oracle synthesizes the DQMC amplitudes directly from a block encoding of the single-particle action matrix via quantum singular value transformations, so that the exponentially many Hubbard-Stratonovich weights are never enumerated, precomputed, or stored. Since the fermions are free for fixed auxiliary fields, the construction operates entirely at the single-particle level, requiring $O(\\log N_{\\mathrm{st}})$ system qubits and no Jordan-Wigner or Bravyi-Kitaev encoding, where $N_{\\mathrm{st}}$ is the space-time volume. A full-quantum protocol makes observables interference amplitudes, eliminating the Markov chain and its autocorrelation time altogether; a hybrid quantum-classical protocol retains a constant-size active block of qubits and replaces the Metropolis-Hastings acceptance step with an exact heat-bath draw, so that cluster updates of any size are rejection-free, and passes only classical information between updates, admitting parallel tempering and distributed execution across quantum processors. The circuit-depth scales more favorably with spatial volume than classical DQMC, at the price of a post-selection overhead determined exactly by the largest target probability --- polynomial for smooth distributions, exponential for sharply peaked ones. Finally, the reweighting estimator underlying the fermion sign problem maps exactly onto a quantum weak value, placing the exponential cost of sign-problematic DQMC in precise correspondence with the post-selection overhead of weak-value extraction.", "url": "https://arxiv.org/abs/2608.28742", "type": "理论+数值", "summary": "1. 该工作提出行列式量子-量子蒙特卡洛（DQ^2MC），将行列式量子蒙特卡洛的辅助场采样与平均整体移植到量子计算机上执行。\n2. 其卖点在于用量子奇异值变换从单粒子作用矩阵的块编码合成行列式预言机，系统量子比特仅随时空体积对数增长且无需费米子编码；观测值以干涉振幅读出从而消除马尔可夫链，混合协议以常数规模活跃比特实现无拒绝热浴更新。\n3. 该工作将费米符号问题的重加权估计器精确映射为量子弱值，使符号问题的指数代价与弱值提取的后选择开销严格对应，为理解与规避符号问题提供新的量子信息论视角。", "summary_source": "deepseek", "authors": [{"name": "Xuepeng Wang"}, {"name": "Sagnik Banerjee"}, {"name": "Debanjan Chowdhury"}], "featured_authors": [{"name": "Xuepeng Wang"}, {"name": "Sagnik Banerjee"}, {"name": "Debanjan Chowdhury"}], "author_count": 3}, {"id": "2608.28750", "category": "cond-mat", "title": "Floquet engineering of competing antiferromagnetism and $d$-wave superconductivity on the square lattice", "abstract": "We propose a driven Lieb--Hubbard quantum simulator whose prethermal dynamics realize a square-lattice spin-1/2 fermion model with independently tunable repulsive on-site and attractive bond interactions. Periodically modulating the charge-transfer offset between the site ($d$) and bond ($p$) orbitals of the Lieb lattice brings a $p$-orbital doublon energetically close to a pair in the $d$ manifold while keeping all $p$-orbital singlons off resonance, thereby creating a synthetic ``negative-$U$'' center on a Lieb-lattice bond site. Two controlled eliminations then generate a compact bond attraction in the reduced $d$-only model on the square lattice, despite the microscopic repulsion in the $p$ orbital. The resulting interaction $J$ is tunable independently of the Hubbard repulsion $U_d$ on the $d$ orbitals, while interference between photon-assisted paths provides access to an intermediate-coupling regime in which $J$ and $U_d$ are both comparable to the effective hopping. At half filling, a mean-field calculation in this regime finds adjacent antiferromagnetic and $d$-wave superconducting phases, as well as narrow coexistence regions, suggesting close competition between these orders. We discuss the branch-preparation, prethermal, and higher-band conditions required to translate the formal construction into an optical-lattice protocol. More broadly, our work identifies a structural similarity between Floquet systems and electron-phonon problems that may guide the design of novel quantum-simulation protocols.", "url": "https://arxiv.org/abs/2608.28750", "type": "理论+数值", "summary": "1. 该工作提出利用周期性驱动的Lieb-Hubbard模型，在预热动力学中实现方格子上自旋1/2费米子模型，兼具可独立调控的d轨道排斥与键间吸引相互作用。\n2. 其核心机制是通过调制d-p电荷转移失谐使p轨道双占据与d轨道配对近共振，经两次消去得到有效键吸引，且光子辅助路径干涉可使耦合J与Hubbard排斥U_d同量级可调。\n3. 半填充平均场计算预言反铁磁与d波超导相邻相及窄共存区，并揭示Floquet系统与电声子问题的结构相似性，为光晶格量子模拟设计提供新思路。", "summary_source": "deepseek", "authors": [{"name": "Zhaoyu Han"}, {"name": "Subir Sachdev"}], "featured_authors": [{"name": "Zhaoyu Han"}, {"name": "Subir Sachdev"}], "author_count": 2}, {"id": "2608.28831", "category": "cond-mat", "title": "Domain walls with alternating magnetic order in a model with dipolar coupling", "abstract": "A model for a one-dimensional chain of elongated nano-scale magnetic islands with dipole interactions is analyzed here for the properties of its static domain walls with site-by-site alternating order. The anisotropic magnetic islands on a nonmagnetic substrate have their longer axes oriented transverse ($y$-direction) to the chain direction ($x$-direction), in a transverse applied magnetic field. The islands' magnetic dipoles $\\vec{\\mu}_n$ are represented as macrospins of fixed length $\\mu$. The nearest-neighbor (NN) dipole interactions drive transverse alternating order, allowing for doubly-degenerate, uniform, static, $y$-alternating states, where the dipoles alternately point transverse to the chain direction, as in $\\vec{\\mu}_n = \\pm(-1)^n \\mu \\hat{y}$. Assuming only NN interactions, the domain walls connecting these two alternating states are found with numerical relaxation simulations and analyzed in a two-sublattice continuum theory. As the uniaxial anisotropy constant $K_1$ descends from larger values until it closely approaches the NN dipolar coupling constant $D$, the domain wall width grows indefinitely, and the large-$x$ continuum solutions closely approach the lattice numerical solutions. The applied field produces a very slight canting of the dipoles towards the field, maximum in the center of the domain wall. The dipoles on the two sublattices are found to rotate in {\\em opposite senses} as one scans along the lattice, resulting in a large longitudinal magnetic moment of the domain wall. A much smaller transverse magnetic moment has a topological contribution that depends on whether the chain length is odd or even.", "url": "https://arxiv.org/abs/2608.28831", "type": "理论+数值", "summary": "1. 该工作通过数值弛豫和双子格连续统理论，研究了一维纳米磁岛链中连接两种简并逐位交替磁有序的静态畴壁性质。\n2. 核心结果在于当单轴各向异性常数K1趋近最近邻偶极耦合常数D时畴壁宽度发散，且连续统解逼近格点数值解；畴壁内两子格磁矩反向旋转产生大纵向磁矩，较小的横向磁矩则具有依赖链长奇偶性的拓扑贡献。\n3. 该研究为人工自旋体系中畴壁宽度发散与磁矩来源提供了清晰物理图像，对调控畴壁诱导磁响应及探索一维拓扑磁性结构具有直接启发。", "summary_source": "deepseek", "authors": [{"name": "G. M. Wysin"}], "featured_authors": [{"name": "G. M. Wysin"}], "author_count": 1}, {"id": "2608.28861", "category": "cond-mat", "title": "Engineering Excitons through Polymorphism and Dimensional Confinement in Low-Dimensional Tellurium", "abstract": "The interplay between dimensionality, band-edge electronic structure, and electron-hole interactions governs the optical response of low-dimensional tellurium, yet the microscopic origin of its excitonic behavior remains largely unexplored. Here, we investigate the quasiparticle, excitonic, and optical properties of two-dimensional tellurium polymorphs and one-dimensional helical nanowires using many-body GW and the Bethe--Salpeter equation. Our results reveal a strong dependence of the excitonic response on band-edge dispersion, crystal symmetry, and dimensional confinement. $\\alpha$-tellurene exhibits comparatively weak and spatially extended electron-hole correlations, whereas the SOC-induced quasi-flat band-edge states of $\\beta$-tellurene give rise to a strongly bound and anisotropic near-infrared exciton. Momentum-resolved BSE eigenvectors and real-space exciton wave functions directly reveal the contrasting localization and anisotropy of these excitonic states. Remarkably, hydrogen-passivated hexagonal tellurene, previously identified as a quantum spin Hall phase with $Z_2=1$, supports an even larger direct exciton binding energy of 0.51 eV together with a compact and nearly isotropic in-plane excitonic distribution. This demonstrates that strong electron-hole correlations are fully compatible with nontrivial band topology, while the binding strength and spatial character of the exciton remain strongly dependent on the underlying band-edge electronic structure and crystal symmetry. The one-dimensional helical nanowire represents the strong-confinement limit, exhibiting a direct high exciton binding energy and a pronounced shift of the optical response toward the ultraviolet.", "url": "https://arxiv.org/abs/2608.28861", "type": "理论+数值", "summary": "1. 该工作利用GW与BSE方法系统研究了二维碲同素异形体与一维螺旋纳米线的准粒子、激子及光学性质。\n2. 其核心发现是激子行为强烈依赖于带边色散、晶体对称性与维度约束，其中β-tellurene的SOC近平带导致强束缚近红外激子，而拓扑六方碲烯仍具有0.51 eV的直接激子结合能。\n3. 这表明强电子-空穴关联可与非平凡能带拓扑共存，为一维强限域体系及拓扑材料中的激子工程与光电器件设计提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Gabriel Elyas Gama Araujo"}, {"name": "Alexandre Cavalheiro Dias"}, {"name": "Andreia Luisa da Rosa"}], "featured_authors": [{"name": "Gabriel Elyas Gama Araujo"}, {"name": "Alexandre Cavalheiro Dias"}, {"name": "Andreia Luisa da Rosa"}], "author_count": 3}, {"id": "2608.28898", "category": "cond-mat", "title": "Phase stability, charge ordering, and charge-liquid formation in the Falicov-Kimball model on triangular and kagome lattices", "abstract": "We present a systematic investigation of the stability of the phase diagram of the spinless Falicov-Kimball model on two-dimensional non-bipartite lattices, the triangular and kagome lattices, using Markov-chain Monte Carlo simulations. Three filling or chemical potential conditions are examined: fixed chemical potentials ($\\mu_f = \\mu_c = U/2$), \"generalized\" half-filling ($\\bar{n}_f = 1/3$, $\\bar{n}_c = 2/3$), and conventional half-filling ($\\bar{n}_f = \\bar{n}_c = 1/2$). For each condition, the effects of a perturbatively small next-nearest-neighbor hopping are studied. On the triangular lattice, Anderson insulator, Mott insulator, and charge-density wave (CDW) phases are found in all cases, with the CDW driven by Coulomb-interaction-mediated nesting. Evidence for a charge-liquid regime is found in the region between the weakly correlated regime and the CDW, characterized by competing charge-ordering wavevectors and the absence of universal scaling behavior, whose extent shrinks progressively from the grand-canonical to the conventional half-filling condition. On the kagome lattice, the CDW phase is completely absent; instead, an insulating ground state, plausibly of the Mott type, is found, with signatures of a possible quantum phase transition at zero temperature. Our results establish the crucial role of lattice geometry and particle-hole symmetry breaking in shaping the phase diagram of correlated electron systems.", "url": "https://arxiv.org/abs/2608.28898", "type": "理论+数值", "summary": "1. 该工作用马尔可夫链蒙特卡洛系统研究了三角与kagome晶格上无自旋Falicov-Kimball模型的相图稳定性，涵盖多种填充条件及微扰次近邻跳跃。\n2. 其核心发现在于三角晶格上存在由库仑相互作用介导的嵌套驱动的电荷密度波，以及弱关联区与电荷密度波之间的电荷液态区域，该区域以竞争性电荷序波矢和缺乏普适标度行为为特征且随填充条件收缩；kagome晶格则无电荷密度波，呈现可能的莫特绝缘基态及零温量子相变迹象。\n3. 这凸显了晶格几何与粒子-空穴对称性破缺对关联电子系统相图的决定性作用，为电荷液态等奇异量子相的研究提供了模型与数值基础。", "summary_source": "deepseek", "authors": [{"name": "Ammar Nejati"}, {"name": "Marvin Lenk"}], "featured_authors": [{"name": "Ammar Nejati"}, {"name": "Marvin Lenk"}], "author_count": 2}, {"id": "2608.28903", "category": "cond-mat", "title": "Revealing low-energy surfaces of multinary compounds by controlling surface coordination environments", "abstract": "When modeling surfaces of multinary compounds, conventional cleavage planes often cut through strongly bonded polyhedra, resulting in unphysical surface energies. Here, we introduce SALAMI (Symmetric Atomic Layers for Arbitrary Multinary Interfaces), a Python package that generates symmetric, charge-neutral, dipole-free, and low-energy slab models for multinary compounds. SALAMI performs combinatorial searches to selectively remove surface atoms and generate corrugated terminations that preserve optimal coordination environments. We applied this workflow to all symmetrically inequivalent crystallographic orientations with Miller indices up to 2 for two prototypical structures: the solid-state electrolyte Li3PS4 and the transparent conducting oxide ZnSb2O6. Density functional theory calculations reveal that Li3PS4 must preserve all PS4 units to achieve the minimum surface energy. For ZnSb2O6, low-energy surfaces are achieved by partial undercoordination of surface Sb atoms to SbO5 or SbO4 from the bulk SbO6, depending on the surface orientations. Compared to surface models generated with unconstrained coordination, applying constraints to achieve optimal local coordination environments significantly lowers surface energies, shrinking the volume of the predicted Wulff shape by approximately 20%. Our results demonstrate that meticulous control of local coordination environments is necessary for accurately predicting the surface energetics of multinary compounds.", "url": "https://arxiv.org/abs/2608.28903", "type": "理论+数值", "summary": "1. 该工作推出SALAMI程序包，用于为多元化合物构建对称、电荷中性、无偶极且低能的表面平板模型。\n2. 其卖点在于通过组合搜索选择性移除表面原子并生成保留最优配位环境的波纹终止；对Li3PS4与ZnSb2O6的DFT计算表明，保存PS4单元或允许Sb部分欠配位可显著降低表面能，使预测Wulff体积缩小约20%。\n3. 这确立了精确控制局域配位环境以可靠预测多元化合物表面热力学与平衡形貌的必要准则。", "summary_source": "deepseek", "authors": [{"name": "Weihang Xie"}, {"name": "Harshan Reddy Gopidi"}, {"name": "Zhengyu Liu"}, {"name": "Romain Claes"}, {"name": "Alexander G. Squires"}, {"name": "Keith T. Butler"}, {"name": "David O. Scanlon"}, {"name": "Pieremanuele Canepa"}], "featured_authors": [{"name": "Weihang Xie"}, {"name": "Harshan Reddy Gopidi"}, {"name": "Zhengyu Liu"}, {"name": "Keith T. Butler"}, {"name": "David O. Scanlon"}, {"name": "Pieremanuele Canepa"}], "author_count": 8}, {"id": "2608.28915", "category": "cond-mat", "title": "Energy landscape and dissipation of sliding magnetic rotor arrays", "abstract": "Magnetically coupled damped rotational degrees of freedom can give rise to tribological loss when excited by a relative sliding motion, linking friction to the dynamics of magnetic moments. We analytically investigate such magnetic friction by studying a recently introduced simplified model for a rigid magnetic rotor array sliding over a commensurate magnetic substrate. Here, the array rotors can rotate about an axis perpendicular to the sliding direction and are damped by microscopic shaft friction, while the substrate magnets have a fixed in-plane orientation. The simplified model reduces the collective rotor dynamics of this setup to a set of coupled nonlinear differential equations, which can be studied by the corresponding energy landscape in the quasi-static regime. We find that the parameter plane spanned by layer separation and time can be divided into distinct chambers, in which the structure of the energy landscape remains invariant. Using these chambers, we identify the layer separation intervals corresponding to different dynamical states and recover the emergence of a regime where the moment alignment alternates globally while exhibiting peak dissipation. Additionally, we derive the leading nontrivial orders of the collective magnetic friction in the regimes of small and large gaps between the array and the substrate. For the alternating regime, we find that friction can be computed by tracking energy jumps from unstable to stable critical points at the chamber boundaries. These results provide an analytical foundation for the observed dynamics and dissipation in sliding rotor arrays. Because the simplified model is scale-free, our conclusions transfer across a broad range of microscopic and macroscopic length scales.", "url": "https://arxiv.org/abs/2608.28915", "type": "理论+数值", "summary": "1. 该工作针对刚性磁转子阵列在共格磁性基底上滑动引起的磁摩擦问题，给出集体转子动力学的解析描述，并将其化约为非线性方程组与准静态能量景观。\n2. 其核心进展是把由层间距与时间张成的参数平面划分为能量景观结构不变的多个腔室，据此确定不同动力学态，并证明全局磁矩交替取向且耗散峰值态的摩擦可由腔室边界处不稳定到稳定临界点的能量跳跃求得。\n3. 由于模型尺度不变，这些解析结果适用于微观至宏观的各类磁机械系统，为理解滑动磁转子阵列的摩擦机理与相关耗散控制提供了统一基础。", "summary_source": "deepseek", "authors": [{"name": "Johannes Krotz"}, {"name": "Anton Lüders"}], "featured_authors": [{"name": "Johannes Krotz"}, {"name": "Anton Lüders"}], "author_count": 2}, {"id": "2608.28928", "category": "cond-mat", "title": "Chiral Tubular Magnonic Crystals with Periodic Dzyaloshinskii--Moriya Interaction", "abstract": "We introduce a chiral tubular magnonic crystal formed by a ferromagnetic nanotube with a periodically modulated interfacial Dzyaloshinskii--Moriya interaction (DMI). Using a plane-wave formalism adapted to the cylindrical geometry, we calculate the spin-wave band structure including exchange, nonlocal dipolar coupling, and interfacial DMI. We show that the tubular geometry qualitatively modifies the role of periodic DMI compared with planar chiral magnonic crystals. Besides producing the usual nonreciprocal frequency shift, curvature converts part of the interfacial DMI into an effective anisotropy-like internal field. This creates a sign-dependent frequency landscape along the tube, so that DMI-covered regions can act either as potential wells or barriers for the lowest-frequency modes. As a result, flat and weakly dispersive bands appear in both Damon--Eshbach-like and backward-volume-like configurations, with the latter having no direct counterpart in planar systems. Our results identify periodically engineered DMI in nanotubes as a route for controlling nonreciprocal spin waves, localized modes, and flat magnonic bands in curved architectures.", "url": "https://arxiv.org/abs/2608.28928", "type": "理论", "summary": "1. 该工作提出由铁磁纳米管与周期性界面Dzyaloshinskii–Moriya相互作用构成的手性管状磁子晶体，并用适配柱状几何的平面波方法计算其自旋波能带。\n2. 其核心发现在于曲率将部分界面DMI转化为类各向异性内场，形成依赖DMI符号的频率势景观，使覆盖区成为低频模的势阱或势垒，并产生平面体系无直接对应的平坦弱色散带。\n3. 这为在弯曲架构中调控非互易自旋波、局域模与平坦磁子带提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "P. Contreras-Gallardo"}, {"name": "J. Flores-Farias"}, {"name": "B. Mimica-Figari"}, {"name": "V. Puliafito"}, {"name": "P. Landeros"}, {"name": "R. A. Gallardo"}], "featured_authors": [{"name": "P. Contreras-Gallardo"}, {"name": "J. Flores-Farias"}, {"name": "B. Mimica-Figari"}, {"name": "V. Puliafito"}, {"name": "P. Landeros"}, {"name": "R. A. Gallardo"}], "author_count": 6}, {"id": "2608.28953", "category": "cond-mat", "title": "Giant staggered Dzyaloshinskii-Moriya vectors emerged in synthetic antiferromagnets with spatially alternating stress", "abstract": "Dzyaloshinskii-Moriya (DM) interaction is a source of chiral magnetic physics, and it manifests microstructural symmetry which could link to exotic magnetic and electronic properties such as altermagnetism. For a new paradigm in magnetism and spintronics, it is crucial to have control on the DM interaction as well as ordering of the DM vectors which characterize the DM interaction. Here, we report on a strong interlayer DM interaction emerged in Co/Ru magnetic superlattices whose structural symmetry is unambiguously broken by alternating mechanical strains developed using the peculiar technique of our stress mechanism. Moreover, theoretical analyses reveal that our magnetic superlattices host a staggered order of the DM vectors. Our results indicate that the spatially varying strains with our breakthrough technique are quite effective in breaking the symmetry of the system and prove that it can control the DM interaction strength as well as the DM vector order.", "url": "https://arxiv.org/abs/2608.28953", "type": "理论", "summary": "1. 该工作实验制备Co/Ru合成反铁磁超晶格，通过专用应力机制施加空间交替机械应变，诱导出强层间Dzyaloshinskii-Moriya相互作用，并解析出其DM矢量呈交错序。\n2. 核心价值在于以空间变化应变明确打破晶体对称性，实现对DM相互作用强度及其矢量有序性的同时调控，并得到理论分析支持。\n3. 这一结果说明应变工程可设计交错DM序及关联手性磁物性，为磁性与自旋电子学交叉研究提供了新的控制维度。", "summary_source": "deepseek", "authors": [{"name": "Yuuga Iwata"}, {"name": "Kensuke Hayashi"}, {"name": "Reiju Furumaki"}, {"name": "Satoshi Iihama"}, {"name": "Masahiro Sato"}, {"name": "Takahiro Moriyama"}], "featured_authors": [{"name": "Yuuga Iwata"}, {"name": "Kensuke Hayashi"}, {"name": "Reiju Furumaki"}, {"name": "Satoshi Iihama"}, {"name": "Masahiro Sato"}, {"name": "Takahiro Moriyama"}], "author_count": 6}, {"id": "2608.28996", "category": "cond-mat", "title": "Orbital occupation selects structural dimensionality in binary transition-metal oxides", "abstract": "Orbital-lattice coupling in transition-metal oxides is usually discussed within a given bonding framework, where orbital occupation is intertwined with local coordination, strain, or symmetry breaking. Here, we show that orbital occupation can also select the bonding framework itself, thereby determining structural dimensionality. Using first-principles calculations, we identify CrO as a prototype in which the single active $3d\\,e_g$ electron of high-spin Cr$^{2+}$ gives rise to two competing orbital-structure states. The $d_{x^2-y^2}$ occupation favors a three-dimensionally connected covalent phase, whereas the $d_{z^2}$ occupation stabilizes a weakly coupled layered phase. Constrained-occupation calculations show that increasing the $d_{z^2}$ filling continuously contracts the in-plane lattice while expanding the structure along the layer normal. The two phases exhibit distinct magnetic ground states and ferroelastic responses. Moreover, the layered phase is robust against exchange-correlation functional and on-site ($U$) variations, remains dynamically stable down to the monolayer limit, and has a low exfoliation energy of 46 meV/Angstrom^2. Extending the analysis across related $3d$ binary oxides reveals a filling-dependence relation between accessible orbital filling and the preference for 2D or 3D connected bonding motifs, providing a microscopic basis for exploring low-dimensional oxide materials.", "url": "https://arxiv.org/abs/2608.28996", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算表明，过渡金属氧化物中轨道占据可主动选择成键框架，从而决定结构维度，并以CrO为原型识别出两个竞争的轨道-结构态。\n2. 其技术要点在于约束占据计算揭示，$d_{z^2}$填充增加会使面内晶格连续收缩并沿层法向膨胀，所得层状相在交换关联泛函与U值变化下稳健，可稳定至单层极限且剥离能仅46 meV/Å²。\n3. 该结果在多种3d二元氧化物中归纳出轨道填充与二维或三维连接成键偏好间的依赖关系，为低维氧化物材料探索提供了微观基础。", "summary_source": "deepseek", "authors": [{"name": "Deping Guo"}, {"name": "Renhong Wang"}, {"name": "Cong Wang"}, {"name": "Meng Gao"}, {"name": "Wu Zhou"}, {"name": "Yanning Zhang"}, {"name": "Fei Pang"}, {"name": "Zhihai Cheng"}, {"name": "Wei Ji"}], "featured_authors": [{"name": "Deping Guo"}, {"name": "Renhong Wang"}, {"name": "Cong Wang"}, {"name": "Fei Pang"}, {"name": "Zhihai Cheng"}, {"name": "Wei Ji"}], "author_count": 9}, {"id": "2608.29007", "category": "cond-mat", "title": "Fractional Impurity Entropy from Potential Scattering in a Free Electron Gas", "abstract": "Fractional changes in entropy are often associated with strong electron correlations or non-Abelian anyons in topological systems. We show that neither condition is necessary -- a system of free electrons on a ring scattering off a repulsive point-like impurity undergoes a $k_B\\ln\\sqrt 2$ entropy change as the impurity strength is increased. This effect arises from a shift of allowed single-particle momenta from integer quantization to half-integer quantization, induced by the impurity. We show that this fractional entropy change is universal across a broad class of single-particle dispersions, demonstrating that such signatures can arise without strong correlations or topological order.", "url": "https://arxiv.org/abs/2608.29007", "type": "理论", "summary": "1. 该工作理论上证明，环上自由电子气受单个排斥点状杂质散射时，随杂质强度增大可出现分数熵变，大小为玻尔兹曼常数乘ln√2，既不依赖强关联也不依赖非阿贝尔任意子。\n2. 其核心机制是杂质把单粒子允许动量从整数量子化改写为半整数量子化，从而改变态密度与热力学熵；该分数熵变对一大类单粒子色散关系具有普适性。\n3. 这提醒人们，分数熵信号并非拓扑序或强关联系统的独有判据，在解释相关杂质或介观环实验时，必须将此类单粒子势散射贡献列为必要对照。", "summary_source": "deepseek", "authors": [{"name": "Syeda Neha Zaidi"}, {"name": "Jukka I. Väyrynen"}], "featured_authors": [{"name": "Syeda Neha Zaidi"}, {"name": "Jukka I. Väyrynen"}], "author_count": 2}, {"id": "2608.29062", "category": "cond-mat", "title": "Enhanced Diffusion from Twist-Angle Disorder", "abstract": "We consider the effect of twist-angle disorder on the single-particle properties of twisted bilayer systems. These materials are a natural playground for studying how tiny, uncontrolled spatial variations may become unusually consequential; a local change in the twist geometry can give rise to spatially-correlated alterations of the parent Hamiltonian, which in turn affect the coarse-grained properties of the substrate such as transport and ordering tendencies. In analogy to electrodynamics, where the magnetic field is given by the curl of the vector potential, we model the twist angle as the curl of the relative displacement between the two bilayers. We find that geometric scattering constraints imposed here by the twist structure substantially suppress momentum relaxation relative to mean-rate-matched white noise. We quantify these effects and show that the problem can be mapped onto a non-linear sigma model (NLSM).", "url": "https://arxiv.org/abs/2608.29062", "type": "理论", "summary": "1. 该工作研究扭曲双层体系中扭角无序对单粒子性质的影响，借助与电动力学的类比，将扭角视为两层相对位移的旋度，从而刻画无序引起的空间关联哈密顿量扰动。\n2. 核心发现是扭转结构带来的几何散射约束显著抑制动量弛豫，使扩散增强远强于平均速率匹配的白噪声无序，且该问题可严格映射为非线性σ模型。\n3. 该映射为理解扭转材料中输运、局域化与有序化竞争提供了可粗粒化的场论框架，并启示无序几何自由度可作为调控扩散的有效手段。", "summary_source": "deepseek", "authors": [{"name": "Nicole S Ticea"}, {"name": "Yi-Ming Wu"}], "featured_authors": [{"name": "Nicole S Ticea"}, {"name": "Yi-Ming Wu"}], "author_count": 2}, {"id": "2608.29064", "category": "cond-mat", "title": "Duality Between Twist-Angle Disorder and Non-Hermitian Disorder", "abstract": "We propose and study a model of moire heterobilayer systems where the twist angle remains uniform and well defined only within a finite range, but deforms randomly at larger distances. The local twist angle is then subject to a certain probability distribution that penalizes large fluctuations around its mean value. Within the framework of the replica trick, we show that disorder averaging produces a nontrivial correlation with alternating sign between replicas, maximized only close the boundary of each local domain and along certain directions. We show that for the low-energy moire bands, exactly the same correlation can be generated in a dual model where fermions are coupled to non-Hermitian disorder, which can evade Anderson localization dynamically. This duality provides a new perspective to investigate twist-angle disorder in moire systems, and unveils some of the essential differences between twist-angle disorder and conventional disorder.", "url": "https://arxiv.org/abs/2608.29064", "type": "理论", "summary": "1. 该工作提出了一个莫尔异质双层模型，其中扭转角仅在有限空间范围内保持均匀，而在更大距离上随机畸变，且其概率分布抑制偏离均值的较大涨落。\n2. 利用复制技巧，作者证明无序平均会在复制品之间产生交替符号的非平凡关联，并仅局域增强于各局域畴边界附近及特定方向；对低能莫尔带，相同关联可由费米子耦合非厄米无序的对偶模型生成，从而动态规避安德森局域化。\n3. 该对偶为研究莫尔体系中的扭转角无序提供了新视角，并阐明其与传统无序的关键差异，可能启发非厄米物理与莫尔系统交叉的后续探索。", "summary_source": "deepseek", "authors": [{"name": "Yi-Ming Wu"}, {"name": "Nicole S. Ticea"}], "featured_authors": [{"name": "Yi-Ming Wu"}, {"name": "Nicole S. Ticea"}], "author_count": 2}, {"id": "2608.29089", "category": "cond-mat", "title": "Real-space manifestation of ferroic multipoles in altermagnetic MnF$_2$", "abstract": "Altermagnets are unconventional spin split magnets arising from the zero spin-orbit coupled limit. They host a magnetic multipolar order parameter yet direct real-space observation of these multipoles has remained elusive. Here we use polarized-neutron diffraction to reconstruct the three-dimensional magnetization density of the prototypical altermagnet MnF$_2$. By exploiting symmetry-selective magnetic reflections, we separate the dominant spherical Mn$^{2+}$ contribution from the much weaker anisotropic Mn magnetization and the covalent spin polarization of the fluorine ligands. The reconstructed spin density reveals a finite fluorine ion moment together with an anisotropic Mn magnetization consistent with the symmetry-allowed altermagnetic rank-5 magnetic multipole $O_{52}$(magnetic triacontadipole). These results provide direct real-space evidence of ferroic multipolar order in an altermagnet and establish polarized-neutron diffraction as a powerful probe of hidden magnetic multipoles in quantum materials.", "url": "https://arxiv.org/abs/2608.29089", "type": "理论", "summary": "1. 该工作利用极化中子衍射重构典型交错磁体MnF2的三维磁化密度，首次实现了铁性磁多极序的实空间直接观测。\n2. 其技术核心在于利用对称选择性磁反射，将占优的球形Mn2+贡献与弱得多的各向异性Mn磁化及氟配体共价自旋极化分离，并揭示出与对称性允许的秩5磁多极O52（磁三十二极矩）一致的各向异性Mn磁化及氟离子上有限磁矩。\n3. 该结果确立了极化中子衍射探测隐藏磁多极的普适能力，为在其他交错磁体或量子材料中寻找类似铁性多极序提供了明确实验路径。", "summary_source": "deepseek", "authors": [{"name": "Iurii Kibalin"}, {"name": "Dalila Bounoua"}, {"name": "José A. Rodriguez Velamazán"}, {"name": "Oscar Fabelo"}, {"name": "Navid Qureshi"}, {"name": "Quentin Faure"}, {"name": "Philippe Bourges"}, {"name": "Victor Balédent"}, {"name": "Jian-Rui Soh"}, {"name": "Jeffrey Rau"}, {"name": "Paul McClarty"}, {"name": "Arsen Gukasov"}], "featured_authors": [{"name": "Iurii Kibalin"}, {"name": "Dalila Bounoua"}, {"name": "José A. Rodriguez Velamazán"}, {"name": "Jeffrey Rau"}, {"name": "Paul McClarty"}, {"name": "Arsen Gukasov"}], "author_count": 12}, {"id": "2608.29091", "category": "cond-mat", "title": "Doping-driven evolution of pairing symmetry in pressurized La$_3$Ni$_2$O$_7$", "abstract": "We investigate the superconducting pairing symmetry and its doping evolution in pressurized La$_3$Ni$_2$O$_7$. For the undoped compound, the most favorable pairing state is found to be $s_{\\pm}$-wave, characterized by sign reversal of the gap functions between the Fermi pockets. A detailed analysis of the pairing interactions reveals that this unconventional state originates from repulsive interactions mediated by the magnetic odd modes of the bilayer nickelate. Upon hole doping, the $\\gamma$ Fermi pocket expands, which amplifies the intrapocket repulsions on this pocket. These repulsions, driven by the magnetic even modes, gradually dominates the pairing interactions and ultimately drive a transition in pairing symmetry from $s_{\\pm}$-wave to $d_{xy}$-wave in the heavily hole-doped regime. In stark contrast, the $s_{\\pm}$-wave pairing persists under electron doping, even deep into the heavily electron-doped regime where a Lifshitz transition occurs. This finding suggests that the $\\gamma$ Fermi pocket is not essential for the emergence of superconductivity in bilayer nickelates. In fact, the $s_{\\pm}$-wave pairing becomes more robust in the absence of the $\\gamma$ pocket, as spin fluctuations are strongly enhanced by the favorable nesting between the $\\alpha$ and $\\beta$ pockets --- a condition guaranteed by Luttinger's theorem and the Fermi surface topology. We believe that exploring the doping evolution of superconducting pairing will open a new realm for testing the pairing mechanism in pressurized La$_3$Ni$_2$O$_7$.", "url": "https://arxiv.org/abs/2608.29091", "type": "理论", "summary": "1. 该工作通过微观配对相互作用分析，系统研究了加压La3Ni2O7中超导配对对称性随空穴与电子掺杂的演化。\n2. 其核心在于指出未掺杂时磁性奇模介导的排斥作用导致s±波；空穴掺杂扩大γ口袋并增强偶模驱动的口袋内排斥，最终引发s±到dxy波的转变，而电子掺杂即使经历Lifshitz转变仍保持s±。\n3. 该结果预言γ口袋并非超导所必需，去除后α-β口袋的嵌套增强自旋涨落并使s±更稳健，为双层镍酸盐配对机制提供了可检验的掺杂相图。", "summary_source": "deepseek", "authors": [{"name": "Hai-Yang Zhang"}, {"name": "Yu-Jie Bai"}, {"name": "Fan-Jie Kong"}], "featured_authors": [{"name": "Hai-Yang Zhang"}, {"name": "Yu-Jie Bai"}, {"name": "Fan-Jie Kong"}], "author_count": 3}, {"id": "2608.29122", "category": "cond-mat", "title": "Light-induced nonconservative static forces in many-body systems", "abstract": "In a quantum many-body system, a periodic drive can often generate effective static forces on the slow collective degrees of freedom. We study the static forces generated by light on electronic order parameters in solid-state systems. We show that the forces can have nonconservative components that originate from dissipation, i.e., optical absorption. This effect is demonstrated in two nontrivial examples. In excitonic insulators, via interband excitations, the light field generates a nonconservative force on the phase of the excitonic order parameter. This force leads to an acceleration of the phase, which manifests as a shift of the photon emission peak from an exciton condensate. In materials with an incommensurate charge density wave, a propagating light field generates a nonconservative force on the phase of its order parameter. It drives the charge density wave into sliding motion, leading to a DC electric current via topological Thouless pumping.", "url": "https://arxiv.org/abs/2608.29122", "type": "理论", "summary": "1. 该工作研究周期光场对固态量子多体系统中电子有序参量产生的静态力，并指出这些力可因光吸收对应的耗散而出现非保守分量。\n2. 在激子绝缘体中，光场通过带间激发对激子有序参量相位施加非保守力并使其加速，导致激子凝聚光子发射峰发生位移；在不相称电荷密度波材料中，传播光场驱动相滑移，经拓扑索利斯泵浦产生直流电流。\n3. 该发现揭示了光致非保守静态力作为一种普适耗散机制的物理后果，为光控有序相动力学和拓扑电荷输运提供了新的研究思路。", "summary_source": "deepseek", "authors": [{"name": "Jinze Li"}, {"name": "Xuemei Yang"}, {"name": "Zhiyuan Sun"}], "featured_authors": [{"name": "Jinze Li"}, {"name": "Xuemei Yang"}, {"name": "Zhiyuan Sun"}], "author_count": 3}, {"id": "2608.29141", "category": "cond-mat", "title": "Directional commensurability stabilizes structural superlubricity in patterned mesoscale interfaces", "abstract": "Structural superlubricity, arising from lattice incommensurability, offers a promising route to eliminate friction and associated energy losses in mechanical systems. In real-world systems, roughness and wear currently pose severe limitations on its robustness and especially the contact size. Here, we consider patterned surfaces as a possible route to overcome some of these limitations. We show that the simplest choice of patterning, contacts made up of two incommensurate triangular-triangular patterns, fails at elevated loads because of the small number of load-bearing contacts, causing the maximum local contact pressure to exceed the strength of the superlubric coating. We introduce a square-triangular patterned interface that increases the number of load-bearing contacts and organizes them into continuous contact lines. When sliding along specific directions relative to these lines, superlubricity is maintained at significantly higher loads by reducing pressure-induced coating failure while also remaining somewhat tolerant to surface imperfections. These findings establish a mechanism for stabilizing structural superlubricity against coating failure and a design principle for engineering low-friction interfaces with enhanced load-bearing capacity and defect tolerance.", "url": "https://arxiv.org/abs/2608.29141", "type": "理论", "summary": "1. 该工作通过图案化介观接触界面的模型，考察结构超润滑在高载荷下的失效与稳定机制。\n2. 其核心发现是三角形-三角形图案因承载接触点少而失效，而方形-三角形图案能形成连续接触线，并在特定滑动方向上借助方向性公度性抑制涂层压强破坏且容忍表面缺陷。\n3. 这为设计兼具高承载能力与缺陷容忍度的低摩擦界面提供了明确的机制依据和工程原则。", "summary_source": "deepseek", "authors": [{"name": "Viet Hung Ho"}, {"name": "Ge Li"}, {"name": "Melisa M. Gianetti"}, {"name": "Bjørn Haugen"}, {"name": "Graham L. W. Cross"}, {"name": "Astrid S. de Wijn"}], "featured_authors": [{"name": "Viet Hung Ho"}, {"name": "Ge Li"}, {"name": "Melisa M. Gianetti"}, {"name": "Bjørn Haugen"}, {"name": "Graham L. W. Cross"}, {"name": "Astrid S. de Wijn"}], "author_count": 6}, {"id": "2608.29226", "category": "cond-mat", "title": "Ornstein-Uhlenbeck Process Driven by Multiple Dichotomous Noises", "abstract": "We study a generalized Ornstein-Uhlenbeck process driven by a superposition of $K$ independent dichotomous noises with arbitrary fixed amplitudes and switching rates. Unlike the classical Ornstein-Uhlenbeck process driven by equilibrium Gaussian white noise, the present system is governed by bounded nonequilibrium fluctuations with finite correlation times. We obtain exact expressions for the stationary position distribution and all cumulants, and show that the stationary state possesses an unexpectedly rich structure, including compact support, algebraic branch-point singularities, edge divergences, and multiple extrema. We establish a mapping onto a heterogeneous random-flight process with bounded jumps, yielding a transparent probabilistic interpretation of the stationary measure. We further analyze several limiting regimes, including the crossover to Gaussian statistics for large numbers of noise sources. For ensembles with exponentially-distributed quenched amplitudes, we derive exact disorder-averaged stationary distributions and show that disorder fundamentally alters the stationary state, producing exponential tails decorated by algebraic prefactors with non-trivial exponents.", "url": "https://arxiv.org/abs/2608.29226", "type": "理论", "summary": "1. 该工作研究了由K个具有任意固定振幅和切换率的独立二值噪声共同驱动的广义Ornstein-Uhlenbeck过程，并导出了稳态位置分布与所有累积量的精确表达式。\n2. 其物理卖点在于揭示非平衡有界涨落驱动下稳态具有紧支撑、代数支点奇点、边界发散及多极值等丰富结构，并建立了与有界跳粒子的异质随机飞行过程的严格映射。\n3. 这为有限关联时间有色非平衡噪声系统的稳态普适分类及无序平均下指数尾与代数前因子行为提供了可检验的理论基准。", "summary_source": "deepseek", "authors": [{"name": "Silvio Kalaj"}, {"name": "Dongho Lee"}, {"name": "Enzo Marinari"}, {"name": "Jae-Hyung Jeon"}, {"name": "Pascal Viot"}, {"name": "Gleb Oshanin"}], "featured_authors": [{"name": "Silvio Kalaj"}, {"name": "Dongho Lee"}, {"name": "Enzo Marinari"}, {"name": "Jae-Hyung Jeon"}, {"name": "Pascal Viot"}, {"name": "Gleb Oshanin"}], "author_count": 6}, {"id": "2608.29325", "category": "cond-mat", "title": "Heavy-Hole--Light-Hole Mixing and Spin--Photon Coupling in Germanium Flopping-Mode Qubits", "abstract": "Intrinsic spin--orbit interaction in germanium provides electrically active flopping-mode qubits without requiring magnetic-field gradients to generate spin--charge hybridization. We study double quantum dots (DQDs) with a multiband Luttinger--Kohn framework that retains heavy-hole (HH) and light-hole (LH) states on equal footing. Modeling vertical confinement with a finite confinement potential along the growth direction brings selected subbands into a regime of appreciable HH--LH mixing. This admixture activates electric-dipole spin-coupling through LH--LH and LH--HH transitions, complementing the conventional HH--HH pseudospin-flip resonance. For the parameter sets considered, these additional channels can produce larger spin--photon figures of merit than the HH--HH transition. HH--LH mixing thus supplies a tunable ingredient for qubit--cavity coupling in germanium hole-spin qubits and extends the operating regimes available to circuit-QED architectures.", "url": "https://arxiv.org/abs/2608.29325", "type": "理论", "summary": "1. 该工作采用多带Luttinger-Kohn框架，对有限垂直限制势下锗双量子点中的重空穴与轻空穴态作同等处理，研究无需磁场梯度的flopping-mode自旋量子比特。\n2. 其核心发现是子带进入显著HH-LH混合区，并通过LH-LH与LH-HH跃迁激活电偶极自旋-光子耦合；在所选参数下，这些新通道可比传统HH-HH跃迁给出更大的耦合品质因子。\n3. 这一机制为锗空穴自旋量子比特提供了可调的自旋-光子耦合途径，扩展了电路QED架构的运行区间，也为无梯度场条件下的腔耦合优化实验提供了方向。", "summary_source": "deepseek", "authors": [{"name": "Jose Reina-Gálvez"}, {"name": "Guido Burkard"}], "featured_authors": [{"name": "Jose Reina-Gálvez"}, {"name": "Guido Burkard"}], "author_count": 2}, {"id": "2608.29340", "category": "cond-mat", "title": "Strain-Driven Electronic and Catalytic Modulation of g-C3N4/GeS van der Waals heterostructure for Photocatalytic Water Splitting", "abstract": "Photocatalytic water splitting offers a viable pathway for sustainable hydrogen production. In this study, first-principles density functional theory calculations were performed to explore the strain-dependent photocatalytic behaviour of a two-dimensional g-C3N4/GeS heterostructure. The heterostructure shows type-II band alignment with an indirect band gap of 2.17 eV, smaller than those of the individual g-C3N4 (2.81 eV) and GeS (3.31 eV) monolayers. Biaxial tensile strain up to 3% effectively modulates the band gap and band edge positions, allowing suitable alignment with water redox potentials. The calculated Gibbs free energy for the hydrogen evolution reaction ({\\Delta}GHER) is 0.2 eV for the pristine heterostructure and approaches near-thermoneutral values (-/+ 0.1 eV) under +1% and +2% strain. Meanwhile, the OER overpotential decreases from 2.17 V to 0.97 V with increasing strain. AIMD simulations and optical absorption in the visible region confirm the thermodynamic stability and promising photocatalytic potential of the heterostructure for hydrogen generation.", "url": "https://arxiv.org/abs/2608.29340", "type": "理论+数值", "summary": "1. 该工作通过第一性原理密度泛函计算系统研究了二维g-C3N4/GeS范德华异质结在双轴拉伸应变下的电子结构、光吸收与光催化水分解行为。\n2. 其核心在于体系呈II型能带排列，应变可精细调控带隙和带边位置以匹配水氧化还原势，使HER自由能接近热中性（±0.1 eV），并将OER过电位由2.17 V降至0.97 V。\n3. 这为利用应变工程优化低维异质结光催化剂、实现可见光驱动制氢提供了明确的理论依据与材料设计思路。", "summary_source": "deepseek", "authors": [{"name": "Soumendra Kumar Das"}, {"name": "Smruti Ranjan Parida"}, {"name": "Tapas Kumbhakar"}, {"name": "Prasanjit Samal"}, {"name": "Sridhar Sahu"}], "featured_authors": [{"name": "Soumendra Kumar Das"}, {"name": "Smruti Ranjan Parida"}, {"name": "Tapas Kumbhakar"}, {"name": "Prasanjit Samal"}, {"name": "Sridhar Sahu"}], "author_count": 5}, {"id": "2608.29343", "category": "cond-mat", "title": "\"Ultra-weak\" First-Order Phase Transition in Biaxial Liquid Crystals", "abstract": "We report high-resolution Monte Carlo evidence characterizing the hierarchy of transition strengths in biaxial nematogens. By employing multiple histogram reweighting on large lattices, we demonstrate that while the isotropic-to-uniaxial ($I \\to N_U$) transition is symmetry-enforced first-order, the uniaxial-to-biaxial ($N_U \\to N_B$) transition in the region between the tricritical point and the triple point ($\\lambda = 0.26$) is proximity-driven and more than an order of magnitude smaller for large system sizes. Such a class of ultra-weak first-order transitions could be a new pathway for future investigations.", "url": "https://arxiv.org/abs/2608.29343", "type": "理论+数值", "summary": "1. 该工作利用高分辨率蒙特卡罗模拟，在双轴液晶中系统区分了各向同性-单轴（I→N_U）与单轴-双轴（N_U→N_B）两类一级相变，并刻画了其强度的层级关系。\n2. 通过多直方图重加权和大尺寸格点计算，证明在tricritical点与triple点之间（λ=0.26）的N_U→N_B转变为邻近效应驱动的超弱一级相变，其强度比对称性强制的I→N_U转变小一个数量级以上。\n3. 该工作提出的超弱一级相变类别为统计物理中弱一级相变与临界现象交汇区域的后续研究提供了新的数值路径与明确启示。", "summary_source": "deepseek", "authors": [{"name": "Soumyajit Pramanick"}, {"name": "Mrinal Kanti Debnath"}, {"name": "Nababrata Ghoshal"}, {"name": "Soumen Kumar Roy"}, {"name": "Sudeshna Dasgupta"}], "featured_authors": [{"name": "Soumyajit Pramanick"}, {"name": "Mrinal Kanti Debnath"}, {"name": "Nababrata Ghoshal"}, {"name": "Soumen Kumar Roy"}, {"name": "Sudeshna Dasgupta"}], "author_count": 5}, {"id": "2608.29405", "category": "cond-mat", "title": "Dynamical backaction in nanoscale superfluid electromechanics", "abstract": "Nanofluidic acoustic resonators employing superfluid $^4$He can be used to study quantized vortices from collective behavior in two-dimensional superfluid turbulence down to few individual vortices created by rotation. In order to improve sensitivity to the level needed for probing individual quantized vortices, readout mechanisms employing optomechanical or optomechanics-inspired approaches seem to be promising in this regard. In this work, we develop an electromechanical system, which couples a 4$^\\mathrm{th}$ sound acoustic resonance to a superconducting LC tank circuit in a sideband-resolved regime. Using this system, we demonstrate electromechanically induced transparency (EMIT), optical spring effect and optomechanical sideband damping and amplification. Furthermore, by rotating the cryostat, we demonstrate sensitivity to quantized vortices, which can become trapped and released in avalanche-like process inside the nanofluidic volume.", "url": "https://arxiv.org/abs/2608.29405", "type": "理论+数值", "summary": "1. 该工作构建了一个将超流氦-4中的第四声声学谐振模式与超导LC谐振回路耦合的纳米流控机电系统，并在边带可分辨区域实现了电动力学反作用。\n2. 其核心进展在于演示了电磁诱导透明、光学弹簧效应及边带阻尼和放大，同时通过旋转低温恒温器观察到量子化涡旋在纳米流道中的雪崩式俘获与释放。\n3. 这为利用动力学反作用增强纳米尺度超流力学探针的灵敏度，进而研究二维超流湍流直至单个量子化涡旋的动力学提供了可行路线。", "summary_source": "deepseek", "authors": [{"name": "Marek Talíř"}, {"name": "Filip Novotný"}, {"name": "Balázs Szalai"}, {"name": "Nasiruddin Mondal"}, {"name": "Emil Varga"}], "featured_authors": [{"name": "Marek Talíř"}, {"name": "Filip Novotný"}, {"name": "Balázs Szalai"}, {"name": "Nasiruddin Mondal"}, {"name": "Emil Varga"}], "author_count": 5}, {"id": "2608.29413", "category": "cond-mat", "title": "PINN-Phase: A physics-informed neural network for curvature-driven multiphase-field evolution", "abstract": "Phase-field simulation of polycrystalline microstructures becomes costly when many related cases must be evolved over long times. We introduce PINN-Phase, a physics-informed neural time integrator that advances the full multiphase field from its initial condition and enforces phase bounds and unit sum at every step; on the reported explicit multiphase-field benchmarks, post-initial-condition reference states serve only for evaluation. Without case-specific tuning, a single trained 25-grain model meets all predefined criteria in seven of eight unseen microstructures fixed before evaluation and in both stress cases, with 0.94-3.71% terminal grain-label disagreement across the ten cases. Each 12,000-step rollout takes about 5.2 min on a single GPU and reaches nearly three times the temporal horizon represented during training. A pre-registered 64-grain model reaches 6.09% disagreement, retaining all 21 reference survivors plus one additional grain; a post-evaluation continuation with a doubled training horizon and 25 additional epochs reaches 3.97% and the exact survivor set. In three dimensions, one trained 16-grain 96^3 model recovers the exact terminal active set and all three extinction identities in six of six unseen microstructures, five of which meet the complete predefined qualification. These results demonstrate structurally admissible long-horizon prediction and prospective initial-condition transfer within fixed benchmark families.", "url": "https://arxiv.org/abs/2608.29413", "type": "理论+数值", "summary": "1. 该工作提出PINN-Phase，一种物理信息神经时间积分器，用于曲率驱动的多相场晶粒微观结构长期演化推进。\n2. 其卖点是每个时间步强制相位有界且和为一，并将初始条件之后的参考态仅用于评估；未调参的25晶粒模型在十个预设定用例中终端晶粒标签分歧为0.94–3.71%，单GPU上12000步滚动约5.2分钟，外推至近三倍训练时间范围。\n3. 预注册64晶粒与三维16晶粒模型能保留参考存续者并复现灭绝身份，显示固定基准族内初始条件迁移与结构可容许长时程预测的可靠性，为多相场代理建模提供可验证范式。", "summary_source": "deepseek", "authors": [{"name": "Seifallah Elfetni"}, {"name": "Peter H. Seeberger"}, {"name": "Theodore Tyrikos-Ergas"}], "featured_authors": [{"name": "Seifallah Elfetni"}, {"name": "Peter H. Seeberger"}, {"name": "Theodore Tyrikos-Ergas"}], "author_count": 3}, {"id": "2608.29586", "category": "cond-mat", "title": "Solid and Quasi-Solid Electrolytes for Zinc Batteries: Balancing Water Activity, Ion Transport, and Interfaces", "abstract": "Zinc batteries offer a compelling route to safe and low-cost energy storage, yet their reliance on aqueous electrolytes promotes hydrogen evolution, corrosion, cathode dissolution, and non-uniform zinc deposition. Replacing the liquid with a solid or quasi-solid electrolyte can suppress these processes, but it also removes the medium that enables rapid Zn2+ transport and conformal electrode contact. This tension, the price of removing water, has been obscured by inconsistent use of the term solid state and by comparisons based largely on bulk ionic conductivity. Here we critically examine zinc electrolytes across a continuum from water-rich hydrogels to dry polymers, solvated crystals, and inorganic conductors. We distinguish water content from thermodynamic water activity and classify these materials according to phase state, mobile-solvent fraction, and dominant transport mechanism. We show that neither high conductivity nor nominally water-free composition reliably predicts cell performance: electrolyte thickness, Zn2+ transference, interfacial resistance, and evolving contact often determine the practical outcome. Controlled-solvation and hybrid electrolytes therefore provide the most credible near-term path, whereas genuinely solvent-free Zn2+ conductors remain a longer-term scientific target. Progress will require transparent reporting of solvent state and validation using thin electrolytes, realistic electrode loadings, limited zinc excess, and calendar-life testing.", "url": "https://arxiv.org/abs/2608.29586", "type": "理论", "summary": "1. 该工作系统评述了从水凝胶到干聚合物、溶剂化晶体及无机导体等锌电池固态/准固态电解质，并依据相态、可动溶剂分数与输运机理重新分类。\n2. 其核心见解是区分水含量与热力学水活度，指出体相离子电导率或名义无水组成不能可靠预测电池性能，电解质厚度、Zn2+迁移数、界面电阻与接触演化才是关键。\n3. 这为近中期发展受控溶剂化与杂化电解质，以及远期实现无溶剂Zn2+导体提供了明确方向，并强调需以薄电解质、实际负载与有限锌过量进行透明报告和日历寿命验证。", "summary_source": "deepseek", "authors": [{"name": "Souvik Naskar"}, {"name": "Jiaqian Qin"}, {"name": "Eric Jianfeng Cheng"}], "featured_authors": [{"name": "Souvik Naskar"}, {"name": "Jiaqian Qin"}, {"name": "Eric Jianfeng Cheng"}], "author_count": 3}, {"id": "2608.29676", "category": "cond-mat", "title": "From Freezing to Terminal Packing: A Puzzle and a Paradox", "abstract": "A density-functional theory developed for equilibrium freezing also produces a high-density endpoint close to terminal packing. We revisit the nonlinear Ramakrishnan--Yussouff bifurcation framework and distinguish the first crystalline fold, thermodynamic coexistence, and terminal marginality. At the terminal point, the grand-potential curvature vanishes along the principal finite-wavevector density mode, exactly when the nonlinear self-consistency equation loses stiffness. The construction gives exact close packing for one-dimensional hard rods, a terminal hard-disk packing fraction near 0.8407, and a hard-sphere value near 0.629, close to random close packing. These results identify a finite-wavevector thermodynamic marginality of a metastable liquid continuation, rather than equilibrium freezing or mechanical jamming, and expose a persistent puzzle: why should liquid-state correlations encode the approach to terminal disordered packing across different physical dimensions and systems?", "url": "https://arxiv.org/abs/2608.29676", "type": "理论", "summary": "1. 该工作重新审视平衡冻结的Ramakrishnan-Yussouff密度泛函框架，发现其解族在高密度端存在终止堆积点，并给出硬杆精确密堆积、硬盘约0.8407与硬球约0.629的终止分数。\n2. 其核心卖点是把终止点辨识为有限波矢主密度模上的巨势曲率消失与非线性自洽方程失稳，即亚稳液体连续支的有限波矢热力学边缘性，而非平衡冻结或力学堵塞。\n3. 这使液体态关联为何能在不同维度和体系中编码趋向无规堆积成为新的普适谜题，为理解亚稳液体终点的统计起源提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Biman Bagchi"}], "featured_authors": [{"name": "Biman Bagchi"}], "author_count": 1}, {"id": "2608.29691", "category": "cond-mat", "title": "Competition between on-site and off-site pairing phases and surface spectra in superconducting wallpaper fermion systems", "abstract": "We theoretically investigate the competition between on-site and off-site pairings in superconducting topological crystalline insulators hosting wallpaper fermions, a class of surface states protected by nonsymmorphic symmetries. In-plane nearest-neighbor pair hopping stabilizes the $\\mathrm{A_{1u}}$ phase, while off-site pairing channels yield additional dominant phases with $\\mathrm{B_{2u}}$ and $\\mathrm{E_u}$ representations. We further show that the $\\mathrm{B_{2u}}$ pairing state supports the hybridization between wallpaper-fermion spectra themselves, whereas a representative time-reversal-invariant nematic $\\mathrm{E_u}$ state exhibits spectral hybridization between wallpaper fermion and double Majorana Kramers pairs, yielding twisted surface energy spectra. These results demonstrate that the twisted dispersions arising from hybridization phenomena persist in the presence of off-site pairing interactions.", "url": "https://arxiv.org/abs/2608.29691", "type": "理论", "summary": "1. 该工作理论研究了具有壁纸费米子的拓扑晶体绝缘体中在位与离位配对相互竞争的超导相，并识别出由不同不可约表示刻画的优势配对态。\n2. 技术要点在于揭示面内近邻配对稳定A1u相，而离位配对通道可产生B2u与Eu态，其中B2u导致壁纸费米子谱间的杂化，Eu向列态则使壁纸费米子与双马约拉纳Kramers对发生谱杂化并形成扭曲表面能谱。\n3. 这为在存在非局域配对相互作用的表面超导体系中识别杂化诱导的扭曲色散提供了明确理论依据，有助于后续表面谱学实验验证。", "summary_source": "deepseek", "authors": [{"name": "Kaito Yoda"}, {"name": "Ai Yamakage"}], "featured_authors": [{"name": "Kaito Yoda"}, {"name": "Ai Yamakage"}], "author_count": 2}, {"id": "2608.29710", "category": "cond-mat", "title": "Phase Diagram and Critical Behaviour of the Two-Dimensional Potts Model with Long-Range Quenched Disorder", "abstract": "We study the phase diagram and critical properties of the $q = 3$ and $q = 8$ Potts models with spatially correlated disorder governed by a power-law decay with exponent $a$. Building on the phase diagram proposed by Chippari et al. [3], where a transition from finite-disorder to infinite-disorder fixed points was identified as a function of a, we refine this picture by using wrapping probabilities of Fortuin-Kasteleyn clusters. Furthermore, using magnetic observables, we clarify the physical origin of the double-peak structure in the magnetic susceptibility and establish the validity of the hyper-scaling relation across all investigated regimes.", "url": "https://arxiv.org/abs/2608.29710", "type": "理论+数值", "summary": "1. 该工作研究二维Potts模型在幂律关联长程淬火无序下的相图与临界行为，覆盖q=3与q=8。\n2. 其要点是用Fortuin-Kasteleyn簇缠绕概率判定有限无序至无限无序不动点转变，并阐明磁化率双峰结构的物理来源。\n3. 该结果为无序体系中超标度关系的普适成立提供数值证据，并对后续统计场论分析具有直接参考价值。", "summary_source": "deepseek", "authors": [{"name": "Rodolfo Rocha"}, {"name": "Leticia F. Cugliandolo"}, {"name": "Marco Picco"}], "featured_authors": [{"name": "Rodolfo Rocha"}, {"name": "Leticia F. Cugliandolo"}, {"name": "Marco Picco"}], "author_count": 3}, {"id": "2608.29724", "category": "cond-mat", "title": "Harnessing the skyrmion Hall effect for low-power skyrmion transport in a tubular synthetic antiferromagnet", "abstract": "We show that optimal control can turn the skyrmion Hall effect from a source of typically unwanted transverse motion into a mechanism for reducing Ohmic losses in skyrmion transport. We consider a pair of antiferromagnetically coupled skyrmions confined to a tubular geometry, where their relative transverse displacement becomes a periodic internal coordinate. The skyrmion Hall effect drives this coordinate, while finite interlayer coupling makes the resulting relation between applied current and longitudinal velocity nonlinear, allowing different current protocols to produce the same prescribed average velocity. We determine which of these protocols minimizes Joule heating. Depending on the interlayer coupling and spin-transfer-torque parameters, the optimal current is either constant, with the skyrmion pair maintaining a fixed relative position, or time dependent, with the pair undergoing periodic relative motion around the tube. In either case, the additional internal degree of freedom created by the skyrmion Hall effect and interlayer coupling enables skyrmion transport at a lower power than in the uncoupled limit.", "url": "https://arxiv.org/abs/2608.29724", "type": "理论", "summary": "1. 该工作研究管状人造反铁磁中一对反铁磁耦合斯格明子，借助最优电流协议将斯格明子霍尔效应由不利横向运动转为低功耗输运机制。\n2. 其核心在于相对横向位移构成周期内禀坐标，层间耦合使电流与纵向速度呈非线性关系，从而可针对给定平均速度优化恒定或时变电流以最小化焦耳热。\n3. 这一机制表明斯格明子霍尔效应与层间耦合引入的内禀自由度可突破非耦合极限，为实现低功耗斯格明子输运器件提供可行思路。", "summary_source": "deepseek", "authors": [{"name": "Ivan P. Miranda"}, {"name": "Grzegorz J. Kwiatkowski"}, {"name": "Jacob J. Mankenberg"}, {"name": "Cecilia M. Holmqvist"}, {"name": "Igor S. Lobanov"}, {"name": "Valery M. Uzdin"}, {"name": "Pavel F. Bessarab"}], "featured_authors": [{"name": "Ivan P. Miranda"}, {"name": "Grzegorz J. Kwiatkowski"}, {"name": "Jacob J. Mankenberg"}, {"name": "Igor S. Lobanov"}, {"name": "Valery M. Uzdin"}, {"name": "Pavel F. Bessarab"}], "author_count": 7}, {"id": "2608.29742", "category": "cond-mat", "title": "Emergent Pair Density Wave and Incoherent Metallic State in a Strongly Correlated Doped System", "abstract": "We investigate the dynamical emergence of a state driven by the interplay between antiferromagnetism (AFM) and singlet $d$-wave superconductivity (SC) within a slave-rotor mean-field framework. By decomposing the electron into charge and spin degrees of freedom, the formalism captures strong-correlation effects beyond conventional mean-field approaches. A PDW order is found to emerge dynamically in the coexistence region of AFM and SC. The AFM-SC coexistence region is significantly modified with correlation, leading to a systematic shift of the tetra-critical point. The doping and temperature evolution of the AFM, SC, and PDW order parameters, together with the rotor condensate amplitude $\\phi$, which characterizes charge coherence, shows a crossover from a coherent to an incoherent metal with the suppression of coherent quasi-particle spectral weight. Moreover, in the AFM + $(\\phi \\neq 0)$ region, coherent quasi-particle bands coexist with incoherent Hubbard-like excitations, whereas only incoherent spectral features survive in the AFM + $(\\phi = 0)$ regime. The SC phase exhibits nodal quasi-particles consistent with $d$-wave pairing.", "url": "https://arxiv.org/abs/2608.29742", "type": "理论", "summary": "1. 该工作利用slave-rotor平均场理论，研究了强关联掺杂体系中反铁磁与d波超导共存区内动态涌现的配对密度波序和金属态。\n2. 技术要点在于将电子分解为电荷与自旋自由度，超越常规平均场捕捉强关联效应，发现PDW在共存区自发出现、四临界点随关联移动，并基于转子凝聚振幅φ刻画从相干到不相干金属的交叉。\n3. 这为在铜氧化物等强关联掺杂体系中探测PDW现象，并区分相干准粒子与不相干谱权重提供了明确的理论依据和实验启示。", "summary_source": "deepseek", "authors": [{"name": "Soham Maiti"}, {"name": "Nandan Pakhira"}, {"name": "A. Taraphder"}], "featured_authors": [{"name": "Soham Maiti"}, {"name": "Nandan Pakhira"}, {"name": "A. Taraphder"}], "author_count": 3}, {"id": "2608.29778", "category": "cond-mat", "title": "Phonon-Localization-Driven Decoupling of Dual-Channel Transport for Record-Low Intrinsic Lattice Thermal Conductivity", "abstract": "A fundamental bottleneck in pushing the intrinsic lattice thermal conductivity of inorganic crystalline solids to its lowest limit arises from the inherent competition between the particle-like propagation (\\(\\kappa_{\\mathrm{L}}^{\\mathrm{P}}\\)) and wave-like tunneling (\\(\\kappa_{\\mathrm{L}}^{\\mathrm{C}}\\)) channels. Herein, we demonstrate that phonon localization provides a robust pathway to decouple the dual-channel transport, achieving record-low \\(\\kappa_{\\mathrm{L}}\\) in quasi-1D ternary helical crystals. Despite the structural complexity leading to densely populated phonon branches and thus inducing abundant coherent phonons, the weak interchain interactions and heavy elements compress numerous branches into highly localized, nearly dispersionless flat bands. Such strong localization simultaneously suppresses both the diagonal and off-diagonal components of the group velocity, thereby synergistically suppressing \\(\\kappa_{\\mathrm{L}}^{\\mathrm{P}}\\) and \\(\\kappa_{\\mathrm{L}}^{\\mathrm{C}}\\). Taking InSeI as an example, the interchain room-temperature \\(\\kappa_{\\mathrm{L}}^{\\mathrm{P}}\\) and \\(\\kappa_{\\mathrm{L}}^{\\mathrm{C}}\\) are 0.145 and 0.053 W/mK, respectively, yielding an ultralow total \\(\\kappa_{\\mathrm{L}}\\) of 0.198 W/mK. Weaker interchain interactions further drive the room-temperature \\(\\kappa_{\\mathrm{L}}\\) of GaSeI and AlSeI to record lows of 0.086 and 0.089 W/mK, respectively; these values even drop to 0.058 and 0.059 W/mK at 900 K. These findings provide useful insights into exploring the thermal conductivity limit in crystals.", "url": "https://arxiv.org/abs/2608.29778", "type": "理论", "summary": "1. 该工作展示声子局域化可在准一维三元螺旋晶体中解耦粒子传播与波隧穿双通道热输运，从而获得极低本征晶格热导率。\n2. 其核心机制在于弱链间相互作用和重元素将密集声子支压成近无色散的局域平带，同时抑制群速度对角与非对角分量，协同削弱 \\(\\kappa_{\\mathrm{L}}^{\\mathrm{P}}\\) 与 \\(\\kappa_{\\mathrm{L}}^{\\mathrm{C}}\\)。\n3. 以InSeI为例室温总热导率低至0.198 W/mK，GaSeI和AlSeI更创纪录地达0.086和0.089 W/mK，为探索晶体热导率下限提供了清晰方向。", "summary_source": "deepseek", "authors": [{"name": "Zhunyun Tang"}, {"name": "Xiaoxia Wang"}, {"name": "Jin Li"}, {"name": "Chaoyu He"}, {"name": "Chao Tang"}, {"name": "Mingxing Chen"}, {"name": "Tao Ouyang"}], "featured_authors": [{"name": "Zhunyun Tang"}, {"name": "Xiaoxia Wang"}, {"name": "Jin Li"}, {"name": "Chao Tang"}, {"name": "Mingxing Chen"}, {"name": "Tao Ouyang"}], "author_count": 7}, {"id": "2608.29792", "category": "cond-mat", "title": "Thermal Hall Signatures of Distinct Schwinger-Boson Flux Sectors on the Honeycomb Lattice", "abstract": "Thermal transport offers a bulk probe of charge-neutral excitations in frustrated magnets. It remains challenging, however, to determine whether such transport can distinguish different parton mean-field structures of the same spin system. This question is particularly relevant on the honeycomb lattice, where distinct $0$-flux, $\\pi$-flux, and chiral $\\pi/2$-flux sectors have been proposed. In this paper, we compare self-consistent saddle-point solutions in these three sectors for a frustrated $J_1-J_2$ Heisenberg model with a next-nearest-neighbor Dzyaloshinskii-Moriya interaction and a perpendicular magnetic field. Using finite-temperature Schwinger-boson mean-field theory and the Kubo formula for bosonic Bogoliubov-de Gennes systems, we evaluate the intrinsic spinon thermal Hall conductivity. At a common parameter point where all three branches remain gapped, the $0$-flux response is positive and the $\\pi$-flux response is negative for $D>0$ and $h>0$ under the sign conventions used in this paper, whereas the $\\pi/2$-flux response changes sign with increasing temperature. We further show that a projective symmetry combining a sixfold rotation with time reversal forces the zero-field response of a fixed chiral $\\pi/2$-flux domain to vanish. Within the mean-field regime examined in this paper, the sign and temperature dependence of $\\kappa_{xy}/T$ therefore provide a flux-sensitive transport signature.", "url": "https://arxiv.org/abs/2608.29792", "type": "理论+数值", "summary": "1. 该工作利用有限温度Schwinger玻色子平均场与Kubo公式，计算蜂窝晶格阻挫J1-J2海森堡模型在三种通量扇区中的自旋子热霍尔电导。\n2. 卖点在于同一参数点下κxy/T的符号与温变行为区分明显：0通量为正、π通量为负，π/2通量随温度变号；六重旋转与时间反演复合的投影对称性使零场固定手性畴响应为零。\n3. 这为以热输运符号和温度依赖作为区分不同parton平均场结构的体探针提供了理论依据，并对阻挫磁体实验给出可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Daiki Sasamoto"}], "featured_authors": [{"name": "Daiki Sasamoto"}], "author_count": 1}, {"id": "2608.29807", "category": "cond-mat", "title": "Branching stochastic mechanics. I. Clustering and connected correlations within a branching-process representation of the Schrödinger equation", "abstract": "Can finite-range correlations hide in the statistics of an extended quantum state? The Schrödinger-Nagasawa transform represents the wave function by positive forward and backward diffusion fields whose product is the Born density. We promote them to branching superprocesses, \\(\\Phi_F\\) and \\(\\Phi_B\\): diffusion samples stochastic paths, whereas Bohm/Fisher-controlled branching generates genealogies of alternative continuations. With rates evaluated on the prescribed Born density, their means reproduce Schrödinger dynamics exactly. The connected sector exhibits supercritical, critical, and subcritical clustering in confinement and has critical dimension \\(d_c=2\\) in free space. Stationary eigenmodes remain extended; subcritical clusters acquire the reduced de~Broglie scale. We then let the branching rate respond to the fluctuating product \\(\\Phi_F\\Phi_B\\). In the reciprocal basis, the fields equal a smooth reference \\(R\\) plus centered fluctuations \\(\\psi_F,\\psi_B\\), defining the signed kernel \\(C_{\\rm FB}(x,y)=\\mathbb E_\\omega[\\psi_F(x)\\psi_B(y)]\\). On the anticorrelated branch, \\(\\rho_{\\rm BSM}(x)=-C_{\\rm FB}(x,x)\\) is the positive paired density. Stationary recovery requires its diagonal to match the Born profile, while off-diagonal decay defines the correlation range. The pair equation splits into collective and relative sectors: spectral cancellation selects the Born collective mode, while suppression of the leading density fluctuation selects the anticorrelated source channel. With relative diffusivity \\(D_{\\rm eff}\\) and positive relaxation rate \\(\\mu_{\\rm FB}\\), correlations have screening length \\(\\xi_{\\rm FB}=\\sqrt{D_{\\rm eff}/\\mu_{\\rm FB}}\\). Thus an extended Born density and a finite correlation range can coexist in one stochastic kernel, suggesting particle-like organization.", "url": "https://arxiv.org/abs/2608.29807", "type": "理论+数值", "summary": "1. 该工作提出将薛定谔-长谷川变换中的正反扩散场提升为分支超过程，使分支速率由玻恩密度决定并精确重现薛定谔动力学，进而分析连接扇区的簇聚与关联统计。\n2. 核心卖点在于连接扇区在约束下出现超临界/临界/次临界簇聚，自由空间临界维数为d_c=2；反关联分支的配对核C_FB给出正定配对密度ρ_BSM(x)=-C_FB(x,x)，其关联长度ξ_FB=sqrt(D_eff/μ_FB)由有效相对扩散与弛豫率决定。\n3. 这意味着扩展的玻恩密度可与有限程关联共存于同一随机核中，为量子态类粒子组织的涌现提供了可检验的随机解释。", "summary_source": "deepseek", "authors": [{"name": "Eric Dumonteil"}, {"name": "Benoît Bischoff"}, {"name": "Alain Letourneau"}, {"name": "Loïc Thulliez"}, {"name": "Corentin Doutre"}], "featured_authors": [{"name": "Eric Dumonteil"}, {"name": "Benoît Bischoff"}, {"name": "Alain Letourneau"}, {"name": "Loïc Thulliez"}, {"name": "Corentin Doutre"}], "author_count": 5}, {"id": "2608.29810", "category": "cond-mat", "title": "Pseudo Entropy in Quantum Spin Chains: from Integrability to Chaos", "abstract": "In this work, we study pseudo entropy and spectral dynamics in quantum spin chains (Heisenberg XXZ model and the mixed-field Ising model) to investigate whether they can serve as diagnostics of quantum chaos. First, we derive an exact relation between the real part of the thermal pseudo entropy and the spectral form factor. This provided evidence that pseudo entropy could exhibit the characteristic dip, logarithmic ramp, and plateau, implying the precise manner in which pseudo entropy probes chaos. We found that the imaginary part, while it does not diagnose chaos, can still provide crucial information about Fisher zeros that is not available in the real counterpart. For spatial pseudo entropy in the XXZ chain, we find that the logarithmic critical scaling persists in both integrable and chaotic regimes, and that the non-positivity conjecture holds. Finally, we derive an exact connection between pseudo entropy, relative pseudo entropy, and spectral complexity with a potential connection to holography.", "url": "https://arxiv.org/abs/2608.29810", "type": "理论", "summary": "1. 该工作研究量子自旋链（Heisenberg XXZ模型与混合场Ising模型）中的赝熵与谱动力学，检验其作为量子混沌诊断工具的可行性。\n2. 其核心在于推导了热赝熵实部与谱形因子间的精确关系，再现混沌特征的下探、对数斜坡与平台，并发现虚部能提供实部所无的Fisher零点信息；空间赝熵在可积与混沌区均保持对数临界标度且满足非正性猜想。\n3. 赝熵、相对赝熵与谱复杂度之间的精确联系为全息对应及混沌诊断的后续研究提供了明确切入点。", "summary_source": "deepseek", "authors": [{"name": "Tara Bahadur Rana"}, {"name": "Yadav Raj Dahal"}, {"name": "Kiran Adhikari"}], "featured_authors": [{"name": "Tara Bahadur Rana"}, {"name": "Yadav Raj Dahal"}, {"name": "Kiran Adhikari"}], "author_count": 3}, {"id": "2608.29830", "category": "cond-mat", "title": "Ballistic-to-Localized Dynamics as Signature of Quantum Phase Transition in Josephson Junction", "abstract": "Using state-of-the-art numerical techniques, we investigate how quantum phase fluctuations and quasiparticle tunneling shape the behavior of a small-capacitance Josephson junction across Ohmic, sub-Ohmic, and super-Ohmic dissipation regimes. We show that increasing the Ohmic dissipation strength drives a Berezinskii-Kosterlitz-Thouless quantum phase transition at thermodynamic equilibrium. Deviations from Ohmic behavior profoundly alter this scenario: the super-Ohmic regime exhibits no phase transition, whereas the sub-Ohmic regime displays a continuous second-order transition, consistent with the universality classes of the spin-boson model. Within the Ohmic regime, real-frequency linear-response calculations reveal that the phase particle does not undergo the commonly assumed diffusive-to-localized crossover. Instead, finite resistance progressively suppresses the singular zero-frequency response, producing a ballistic-to-localized change in the
