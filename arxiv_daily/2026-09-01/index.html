 dynamics. At finite frequencies, coupling to the environment generates a long-lived excitation in the charge response, which evolves into a resonance as the subgap and shunt resistances are reduced.", "url": "https://arxiv.org/abs/2608.29830", "type": "理论+数值", "summary": "1. 该工作利用先进数值技术研究小电容约瑟夫森结在欧姆、次欧姆与超欧姆耗散下的量子相变与动力学。\n2. 其要点在于揭示欧姆耗散驱动BKT量子相变，超欧姆无相变而次欧姆为二级连续相变，并且欧姆区相位粒子呈现弹道到局域化的动力学转变而非常见扩散-局域化交叉。\n3. 这为耗散环境诱导的电荷响应长寿命激发及共振提供可检验预言，并支持与自旋玻色子模型普适类的一致性。", "summary_source": "deepseek", "authors": [{"name": "F. G. Capone"}, {"name": "A. de Candia"}, {"name": "G. Di Bello"}, {"name": "V. Cataudella"}, {"name": "R. Fazio"}, {"name": "N. Nagaosa"}, {"name": "C. A. Perroni"}, {"name": "G. De Filippis"}], "featured_authors": [{"name": "F. G. Capone"}, {"name": "A. de Candia"}, {"name": "G. Di Bello"}, {"name": "N. Nagaosa"}, {"name": "C. A. Perroni"}, {"name": "G. De Filippis"}], "author_count": 8}, {"id": "2608.29915", "category": "cond-mat", "title": "Symmetry-Enforced Topological Structures in Quantum Phase Diagrams", "abstract": "We study the topological structure of the quantum phase diagram of gapped systems by identifying the noncontractibility of loops, so-called $S^1$-families, within the gapped phase diagram in which many-body Hamiltonians can have nontrivial ground-state degeneracy. We manifest the role of symmetries in such $S^1$-family classifications by the exotic symmetry interplay: (i) nontrivial mixed anomalies, (ii) semi-direct product relation between the spontaneously broken and the unbroken symmetries, and (iii) symmetry with noninvertible operators. We find that such structures lead to the novel $S^1$-family classifications inaccessible by earlier classifications based on ``independent'' symmetries. Furthermore, we construct lattice realizations of these $S^1$-families and explicitly demonstrate their novel algebraic structures.", "url": "https://arxiv.org/abs/2608.29915", "type": "理论+数值", "summary": "1. 该工作通过识别有能隙量子相图中不可收缩的S^1族回路，研究了多体哈密顿量具有非平凡基态简并时量子相图的整体拓扑结构。\n2. 其主要技术贡献在于揭示混合反常、自发破缺与未破缺对称性之间的半直积关系以及非可逆对称算子如何产生此前基于独立对称性分类无法触及的新S^1族分类，并给出显式晶格实现以展示其新颖代数结构。\n3. 这为对称性约束下量子相图的拓扑分类提供了更完整的数学框架，并为在晶格模型中探索非可逆对称性与反常物理提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Linhao Li"}, {"name": "Yuan Yao"}], "featured_authors": [{"name": "Linhao Li"}, {"name": "Yuan Yao"}], "author_count": 2}, {"id": "2608.29991", "category": "cond-mat", "title": "Asymmetry-controlled resonant transport in a Brownian flashing ratchet", "abstract": "We investigate directed transport in a one-dimensional Brownian flashing ratchet with a piecewise-linear asymmetric periodic potential. Numerical solutions of the Fokker--Planck equation and Brownian dynamics simulations reveal a nonmonotonic dependence of the stationary current on the switching frequency, with a resonant maximum whose position depends on the potential asymmetry $\\delta$ and barrier height $\\Delta$. For moderate asymmetry, $|\\delta|<0.5$, the current obeys a scaling form that separates the dependence on the potential parameters from a common frequency dependence, resulting in a data collapse upon appropriate scaling of the current and frequency. The current amplitude varies linearly with $\\delta$, while the resonance frequency follows $\\nu(\\delta,\\Delta)=\\nu_0(\\Delta)/ [1-b_0\\, \\delta^2]$. We interpret the resulting $(1-\\delta^2)^{-1}$ scaling in terms of coupled relaxation along the two branches of the asymmetric potential, which provides a physical basis for the observed dependence of the resonant frequency on the potential asymmetry.", "url": "https://arxiv.org/abs/2608.29991", "type": "理论+数值", "summary": "1. 该工作通过数值求解福克-普朗克方程和布朗动力学模拟，研究一维分段线性非对称闪烁棘轮中的共振定向输运，考察电流对开关频率的依赖。\n2. 其技术卖点在于揭示电流随开关频率非单调变化并在共振峰处达到最大，且共振频率按 ν(δ,Δ)=ν0(Δ)/(1-b0 δ^2) 标度，电流幅度随不对称度线性变化，适当缩放后可实现数据塌缩。\n3. 这一由势能两支耦合弛豫解释的 (1-δ^2)^{-1} 标度，为微纳棘轮输运调控及非对称势驱动的分子马达设计提供了可检验的理论依据。", "summary_source": "deepseek", "authors": [{"name": "Sudipta Mandal"}, {"name": "Dipanjan Chakraborty"}, {"name": "Debasish Chaudhuri"}], "featured_authors": [{"name": "Sudipta Mandal"}, {"name": "Dipanjan Chakraborty"}, {"name": "Debasish Chaudhuri"}], "author_count": 3}, {"id": "2608.29994", "category": "cond-mat", "title": "Van Hove singularities at the $L$-face of the lutetium nitride phonon dispersion", "abstract": "We report the structural and vibrational properties of the prototypical 4$f$-filled nonmagnetic member LuN of the lanthanide nitrides, \\textit{Ln}N, with elastic and inelastic neutron scattering data at $4$~K. We find a peak in the generalized density of states which, through input from a DFT+$U$ computation, we ascribe to a van Hove singularity on the fourfold-degenerate $L$-face of the Brillouin zone. This work advances the understanding of phonon dynamics in \\textit{Ln}N beyond the $\\Gamma$-point.", "url": "https://arxiv.org/abs/2608.29994", "type": "数值", "summary": "1. 该工作利用4 K下的弹性与非弹性中子散射测量，解析了填充4f壳层的非磁性镧系氮化物LuN的晶体结构与声子振动行为。\n2. 其技术要点在于将广义声子态密度中的峰值指认为布里渊区四重简并L面上的van Hove奇点，并通过DFT+U计算予以验证，从而把对LnN声子动力学的理解从Γ点拓展至整个L面。\n3. 这一结果确立了LuN作为非Γ点声子奇异性范例的地位，为后续在镧系氮化物中探索平带声子、热输运及电子-声子耦合提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "M. Markwitz"}, {"name": "K. Kneisel"}, {"name": "R. G. Buckley"}, {"name": "K. C. Rule"}, {"name": "M. Chegeni"}, {"name": "H. J. Trodahl"}, {"name": "W. F. Holmes-Hewett"}, {"name": "J. D. Miller"}, {"name": "F. Natali"}, {"name": "M. Maddah"}, {"name": "B. J. Ruck"}, {"name": "S. Granville"}], "featured_authors": [{"name": "M. Markwitz"}, {"name": "K. Kneisel"}, {"name": "R. G. Buckley"}, {"name": "M. Maddah"}, {"name": "B. J. Ruck"}, {"name": "S. Granville"}], "author_count": 12}, {"id": "2608.30001", "category": "cond-mat", "title": "Chemical Perspectives on Cuprate Superconductivity: Hole-Protected Spin Dimers as d Wave Cooper Pairs", "abstract": "The observation that the coherence lengths in cuprate superconductors are extremely small motivated us to search for its real-space structure by examining the consequence of hole-doping in CuO4 units in cuprates. We analyzed aggregates of hole-doped CuO4 units that phase-separate from hole-doped CuO2 layers in terms of their segregation-pressure indices defined in this work. Our search suggests that each d-wave Cooper pair is an antiferromagnetically coupled spin dimer protected in an antiferromagnetic hole dimer (AHD), and that the antiferromagnetic chains of AHDs provide channels through which such spin dimers can move collectively without perturbation. Based on these suggestions and their implications, we examined the causes for several seemingly puzzling observations on cuprate superconductors to find that they are naturally explained by the suggestions.", "url": "https://arxiv.org/abs/2608.30001", "type": "理论", "summary": "1. 该工作提出以化学视角研究铜氧化物超导电性，通过引入偏析压指数分析空穴掺杂CuO4单元的相分离聚集，指出每个d波库珀对是受反铁磁空穴二聚体保护的自旋二聚体。\n2. 其核心在于将极短相干长度与实空间配对结构相联系，并阐明反铁磁空穴二聚体链可作为自旋二聚体集体迁移而不受扰动的通道。\n3. 该图像能为铜氧化物中若干令人困惑的实验现象提供自然解释，并启发从局域化学环境出发构建非常规超导配对理论。", "summary_source": "deepseek", "authors": [{"name": "Myung-Hwan Whangbo"}, {"name": "Reinhard K. Kremer"}], "featured_authors": [{"name": "Myung-Hwan Whangbo"}, {"name": "Reinhard K. Kremer"}], "author_count": 2}, {"id": "2608.30060", "category": "cond-mat", "title": "Chemical potentials from structure factors: II. Charged multi-component mixtures", "abstract": "The chemical potentials of charged multi-component mixtures are central to electrolyte thermo- dynamics, but remain difficult to compute from atomistic simulations. The S0 method enables computing chemical potentials of mixtures from equilibrium molecular dynamics simulations. Here we extend the S0 method to charged mixtures by combining the composition-space framework developed in Part I: Neutral Multi-component Mixtures with a Coulombic treatment of the small- wavenumber limits of static structure factors. This approach separates thermodynamically relevant neutral composition fluctuations from forbidden macroscopic charge fluctuations, and further ac- counts for charge-neutrality constraints. We use the method to compute the chemical potentials of multiple-halide aqueous salt solutions, elucidating the ion-specific thermodynamic effects. We also calculate the mixing free energies of molten salt mixtures, demonstrating the importance of correctly describing long-wavelength electrostatic correlations.", "url": "https://arxiv.org/abs/2608.30060", "type": "数值", "summary": "1. 该工作将S0方法推广至带电多组分混合物，利用静态结构因子的小波数极限并结合组分空间框架，从平衡分子动力学计算化学势。\n2. 其技术关键是分离热力学相关的中性浓度涨落与禁止的宏观电荷涨落，并显式处理电中性约束，从而正确描述长波静电关联。\n3. 该方法可用于多种卤化物盐水溶液和熔盐混合物的离子特异性热力学与混合自由能研究，为电解液模拟提供可靠途径。", "summary_source": "deepseek", "authors": [{"name": "Xiaoyu Wang"}, {"name": "Roya Savoj"}, {"name": "Musahid Ahmed"}, {"name": "Bingqing Cheng"}], "featured_authors": [{"name": "Xiaoyu Wang"}, {"name": "Roya Savoj"}, {"name": "Musahid Ahmed"}, {"name": "Bingqing Cheng"}], "author_count": 4}, {"id": "2608.30095", "category": "cond-mat", "title": "Tunable Pathway Selection in Coupled Multistable Snap-Through Systems", "abstract": "Multistable mechanical systems can store and release elastic energy through snap-through instabilities, but controlling transition pathways between stable states remains challenging when multiple routes are accessible. Here, we introduce a two-mass von Mises truss as a general model for studying pathway selection governed by coupled saddle-node bifurcations. The system consists of two coupled snap-through units with geometric imperfections, giving rise to four stable configurations: a fully inverted state, a fully natural state, and two intermediate mixed states. We show that the coupling stiffness reorganizes the quasi-static bifurcation structure and selects among three transition pathways under release: sequential snapping through one mixed state, direct cooperative snapping, or sequential snapping through the other mixed state. Using pseudo-arclength continuation, we track the relevant saddle-node bifurcations and identify the parameter regimes associated with each quasi-static pathway. We then demonstrate that dynamic bifurcation delay provides an additional rate-dependent mechanism for pathway selection. Even when the quasi-static bifurcation structure favours a unique sequential pathway, finite-rate loading delays snap-through beyond the corresponding static saddle-node points and can reorder the snapping sequence of the two units. A local reduction of the coupled dynamics near each saddle-node yields normal forms with coupling-dependent critical points and coefficients. The resulting theory identifies distinct rate-dependent delay laws in the inertia-dominated and overdamped regimes and predicts the critical rate at which the snapping order reverses. These results establish a general mechanics framework for tuning transition pathways in multistable systems through elastic coupling and loading-rate control.", "url": "https://arxiv.org/abs/2608.30095", "type": "理论", "summary": "1. 该工作采用带几何缺陷的双质量冯·米塞斯桁架作为一般模型，系统研究耦合多稳态系统在鞍结分岔调控下于四种稳定构型之间选择跃迁路径的问题。\n2. 其技术要点在于用伪弧长延拓追踪耦合鞍结分岔以区分三条准静态路径，并基于动态分岔延迟的局域正规形推导惯性与过阻尼区的延迟律，预测加载速率导致跳跃序列反转的临界条件。\n3. 该研究建立了一个通过弹性耦合刚度与加载速率协同调控能量释放次序的力学框架，为可编程多稳态器件与超材料设计提供了理论指导。", "summary_source": "deepseek", "authors": [{"name": "Weicheng Huang"}, {"name": "Ke Huang"}, {"name": "Jiaying Zhang"}, {"name": "Mingchao Liu"}], "featured_authors": [{"name": "Weicheng Huang"}, {"name": "Ke Huang"}, {"name": "Jiaying Zhang"}, {"name": "Mingchao Liu"}], "author_count": 4}, {"id": "2608.30117", "category": "cond-mat", "title": "Two-step transient liquid phase bonding of NiTi to Ti-6Al-4V through a NbZrW barrier", "abstract": "Dissimilar joining of NiTi to Ti-6Al-4V (Ti-64) is limited by brittle Ti2Ni formation and degradation of NiTi functionality. A two-step transient liquid phase (TLP) route was developed in which a refractory NbZrW diffusion barrier converts the incompatible couple into two independently bondable interfaces. The barrier plays a different role for each alloy: a reactive substrate for NiTi, dissolving to form a Ti-rich Ni-Ti-Nb liquid that infiltrates its own grain boundaries and is terminated by selective Ti absorption into the barrier; and an inert substrate for Ti-64, joined through contact melting of a sacrificial Cu foil. Both interfaces are fully dense and free of continuous intermetallic layers. In tension, joints spanning both interfaces began transforming at 350 MPa, exhibited a stress plateau to 2.5 global strain (consistent with stress-induced transformation of the NiTi half of the gauge) and failed beyond the plateau at 380-410 MPa. Five load-unload cycles to 460 MPa showed stable superelastic loops with minor ratcheting. These results demonstrate that a diffusion barrier enables dissimilar TLP joining of otherwise incompatible alloys.", "url": "https://arxiv.org/abs/2608.30117", "type": "理论", "summary": "1. 该工作提出两步瞬态液相连接路线，利用NbZrW扩散阻挡层实现NiTi与Ti-6Al-4V的异种连接，抑制脆性Ti2Ni生成并保护NiTi超弹性。\n2. 其技术卖点在于阻挡层对两侧合金角色相反：对NiTi作为反应性基底，溶解形成富钛Ni-Ti-Nb液相并渗入晶界，同时选择性吸收钛终止反应；对Ti-64则为惰性基底，通过Cu箔接触熔化实现连接，界面致密且无连续金属间化合物。\n3. 拉伸时接头自350 MPa开始发生应力诱发马氏体相变，出现至2.5%应变的平台并以380–410 MPa失效，反复加载至460 MPa仍保持稳定超弹性；这证明扩散阻挡层能将原本不相容的合金体系拓展为可用的功能性异种连接方案。", "summary_source": "deepseek", "authors": [{"name": "Zhaoxi Cao"}, {"name": "Samuel Price"}, {"name": "John P. Reidy"}, {"name": "Ian McCue"}], "featured_authors": [{"name": "Zhaoxi Cao"}, {"name": "Samuel Price"}, {"name": "John P. Reidy"}, {"name": "Ian McCue"}], "author_count": 4}, {"id": "2608.30151", "category": "cond-mat", "title": "Linear stability and viscoelastic response in weakly jammed frictional granular systems", "abstract": "Granular particles typically feature contact friction, which gives rise to various nontrivial properties of granular materials. In this work, we investigate the linear stability of static packings composed of frictional spheres, whose interactions are modeled using the discrete element method. We discuss a key difficulty in properly modeling static friction and address the problem of identifying rattlers. We also explore the spectrum of the energy matrix, which governs the linear viscoelastic response of the system. The intermediate- and high-frequency regimes of the spectrum remain qualitatively independent of both the friction coefficient and the packing fraction.", "url": "https://arxiv.org/abs/2608.30151", "type": "理论", "summary": "1. 该工作利用离散元方法研究了摩擦球体静态堆积的线性稳定性与黏弹性响应谱。\n2. 其要点在于妥善处理静态摩擦建模与rattler识别，并给出能量矩阵频谱的普适特征。\n3. 中高频谱对摩擦系数和堆积分数不敏感，或为颗粒材料响应理论提供简化描述。", "summary_source": "deepseek", "authors": [{"name": "Masanari Shimada"}, {"name": "Yusuke Hara"}, {"name": "Shihori Koyama"}, {"name": "Ryohei Seto"}, {"name": "Maria Yokota"}], "featured_authors": [{"name": "Masanari Shimada"}, {"name": "Yusuke Hara"}, {"name": "Shihori Koyama"}, {"name": "Ryohei Seto"}, {"name": "Maria Yokota"}], "author_count": 5}, {"id": "2608.30296", "category": "cond-mat", "title": "Covariant formula for the driving force for interface migration", "abstract": "Interfaces of crystalline materials are strongly affected by the anisotropy of interface energy. A key quantity in this context is the interface stiffness tensor, which characterizes the response of the interface energy to changes in interface orientation and plays a role in determining the driving force for interface migration. The latter is expressible via contraction of the stiffness tensor and interface curvature tensor. Practical computations involving tensors necessarily rely on their individual components. In this work, an explicit component-wise expression is derived for the contraction of the stiffness and curvature tensors, valid in arbitrary coordinate systems. Within this formulation, to get the driving force, the curvature tensor is contracted with the pullback of a stiffness-related tensor - originally defined in three-dimensional Euclidean space - onto the interface manifold. This covariant treatment establishes a physically consistent foundation for three-dimensional computational models involving interface stiffness.", "url": "https://arxiv.org/abs/2608.30296", "type": "理论", "summary": "1. 该工作针对晶体界面迁移驱动力，推导了界面刚度张量与曲率张量缩并在任意坐标系下的显式分量表达式。\n2. 其核心在于将三维欧氏空间中的刚度相关张量拉回到界面流形上再与曲率张量缩并，从而获得协变且坐标无关的驱动力表述。\n3. 这一协变框架为涉及界面刚度的三维计算模型提供了自洽的几何基础，有助于各向异性界面演化的数值模拟与理论分析。", "summary_source": "deepseek", "authors": [{"name": "Adam Morawiec"}], "featured_authors": [{"name": "Adam Morawiec"}], "author_count": 1}, {"id": "2608.30306", "category": "cond-mat", "title": "Singlet-doublet transitions and Josephson currents in a superconducting ring with a quantum dot", "abstract": "We investigate the ground state properties of a superconducting ring embedded with a quantum dot (QD) by using a variational wave-function approach. A theoretical formulation for the treatment of the finite-U Anderson impurity coupled with a superconducting ring are presented. We demonstrate singlet-doublet transitions of the ground state for this system with the QD in the mixed valence regime. It is shown that the supercurrent in the superconductor ring shows oscillations with the external enclosed magnetic flux and exhibits abrupt jumps at the singlet-doublet phase transition points.", "url": "https://arxiv.org/abs/2608.30306", "type": "理论+数值", "summary": "1. 该工作采用变分波函数方法研究了内嵌量子点的超导环的基态性质，并提出了有限U安德森杂质与超导环耦合的理论处理方案。\n2. 其核心在于揭示混合价区间的单重态-双重态转变，并证明超电流随外磁通振荡且在相变点处出现突然跳跃。\n3. 这为理解近藤关联与约瑟夫森电流在超导环-量子点体系中的相互作用，以及利用量子相变调控超流输运提供了理论启示。", "summary_source": "deepseek", "authors": [{"name": "Guo-Hui Ding"}, {"name": "Fei Ye"}, {"name": "Bing Dong"}], "featured_authors": [{"name": "Guo-Hui Ding"}, {"name": "Fei Ye"}, {"name": "Bing Dong"}], "author_count": 3}, {"id": "2608.30324", "category": "cond-mat", "title": "Scalar Spin Chirality from Dissipative Pumping and Lamb Shift Precession", "abstract": "Circulating currents in triangular triple quantum dots reverse repeatedly with bias even at zero magnetic flux and for a real Hamiltonian, a phenomenon whose origin has remained unclear. We show that dissipative tunneling prepares an orbital pseudospin, while virtual charge fluctuations generate a noncollinear Lamb field that rotates it toward the chiral direction. Bias changes their relative orientation and thereby reverses the current. This reservoir-induced orbital Hanle effect converts a nonchiral orbital polarization into scalar spin chirality, which an exact ground-multiplet identity links to the circulating current. Hierarchical-equations-of-motion calculations show that the low-bias reversal survives beyond the second-order weak-coupling description, while the quadratic growth of chirality after a sudden voltage switch identifies precession. More broadly, time-reversal-odd responses can emerge in open quantum systems from the interplay between dissipative state preparation and coherent precession.", "url": "https://arxiv.org/abs/2608.30324", "type": "理论+数值", "summary": "1. 该工作解析了三角三量子点中零磁通、实哈密顿量下环流随偏压反复反转的微观起源，指出耗散隧穿与Lamb位移进动共同决定环流方向。\n2. 其核心是储库诱导的轨道Hanle效应：耗散泵浦制备非手性轨道赝自旋，虚荷涨落产生非共线Lamb场使其旋转为标量自旋手性，并由精确基多重态恒等式与环流定量关联。\n3. 层次运动方程表明低偏压反转在弱耦合二级近似之外仍成立，且电压突跳后手性的二次增长证实进动，启示开放系统中时间反演奇响应可由耗散制备与相干进动竞争产生。", "summary_source": "deepseek", "authors": [{"name": "YuanDong Wang"}, {"name": "JianHua Wei"}], "featured_authors": [{"name": "YuanDong Wang"}, {"name": "JianHua Wei"}], "author_count": 2}, {"id": "2608.30335", "category": "cond-mat", "title": "Holographic Representations of Topological Quantum Criticality: Emergent Symmetry Approach around the Bott Clock", "abstract": "In this article, we apply the idea of emergent symmetries to construct holographic representations of a broad class of topological quantum critical points (tQCPs) that appear in fermionic classes in the Bott clock. We show explicitly that around the Bott clock, an emergent symmetry $U_{EM}$ exists at a tQCP between different symmetry protected gapped phases with protecting symmetry $G_p$ in $d$ spatial dimensions. This emergent symmetry can be used to construct a $(d+1)$ spatial dimensional lattice model with a properly upgraded symmetry such as $U_{EM}\\times G_p$ or $U_{EM} \\rtimes G_p$, etc. By doubling the degrees of freedom of the adjacent topological class in $d$-dimensions, we successfully show that the $(d+1)$-dimensional lattice models constructed in this way have the desired enlarged symmetry groups that precisely belong to the adjacent topological classes, counterclockwise around the Bott clock. Furthermore, $d$-dimensional boundaries of these $(d+1)$ dimensional lattice models of gapped topological classes are shown to exhibit identical infrared dynamics as the corresponding tQCPs in the $d$-dimensional adjacent topological phases in the Bott clock, with lower symmetries.", "url": "https://arxiv.org/abs/2608.30335", "type": "理论", "summary": "1. 该工作借助涌现对称性为 Bott 时钟上费米子拓扑量子临界点构造全息表示。\n2. 技术要点是利用临界点的涌现对称 U_EM，构建具有 U_EM×G_p 或半直积对称性的 (d+1) 维晶格模型。\n3. 这些体模型 d 维边界的红外动力学与对应拓扑量子临界点一致，为全息体边对应提供新思路。", "summary_source": "deepseek", "authors": [{"name": "Fan Yang"}, {"name": "Fei Zhou"}], "featured_authors": [{"name": "Fan Yang"}, {"name": "Fei Zhou"}], "author_count": 2}, {"id": "2608.30377", "category": "cond-mat", "title": "Optimal Transport of an Anisotropic Tracer in Dense Active Suspensions", "abstract": "The transport of anisotropic tracers in active fluids exhibits rich dynamical behavior arising from the interplay between particle shape, activity, and steric interactions. We employ Brownian dynamics simulations to investigate the motion of an elliptical tracer immersed in a suspension of active dumbbells. We find that both translational and rotational transport, characterized by the mean-square speed and diffusivity, are enhanced by more than an order of magnitude with increasing area fraction, $\\phi$, of active dumbbells. Notably, tracer motion is enhanced along the major axis relative to the minor axis, with $\\mathrm{v}_{\\parallel}>\\mathrm{v}_{\\perp}$ and $D_{\\parallel}>D_{\\perp}$. Remarkably, both translational and rotational transport exhibit an optimum at an intermediate packing fraction of active dumbbells, with the corresponding transport coefficients decreasing at higher densities. We show that this non-monotonic transport arises from the anisotropic accumulation and aggregation of active dumbbells around the tracer, which control the non-equilibrium force and torque fluctuations. Thus, establish a direct connection between the collective organization of active dumbbells at the tracer surface and its emergent translational and rotational transport.", "url": "https://arxiv.org/abs/2608.30377", "type": "数值", "summary": "1. 该工作利用布朗动力学模拟考察了致密活性哑铃悬浮液中椭圆示踪物的平动和转动输运。\n2. 其要点在于发现输运随活性粒子面积分数增强逾一个量级，并在中间堆积分数出现最优，且沿长轴方向快于短轴方向，机制为活性哑铃在示踪物表面的各向异性聚集主导非平衡力与力矩涨落。\n3. 这为理解活性介质中非球形示踪物的最优输运条件提供了微观图像，并对设计定向输运或分选活性环境具有启发。", "summary_source": "deepseek", "authors": [{"name": "Chandranshu Tiwari"}, {"name": "Sunil P. Singh"}], "featured_authors": [{"name": "Chandranshu Tiwari"}, {"name": "Sunil P. Singh"}], "author_count": 2}, {"id": "2608.30402", "category": "cond-mat", "title": "Extending the Pnictide Chemical Space for Photovoltaics", "abstract": "Developing novel and efficient materials that are beyond silicon for photovoltaic (PV) applications is required to meet the upcoming energy needs of our societies. To identify novel candidate materials that can act as PVs, we use first principles calculations to perform a systematic screening of the pnictide chemical space (i.e., nitrides and phosphides). Specifically, we explore three different ternary and quaternary pnictide classes, namely, ABCX$_2$, BB'B\"X$_2$, and A$_4$BX$_2$ (A = Li, Na, or K; B, B', B\" = Ca, Sr, Mg, or Zn; C = Al, Ga, or In; X = N or P), leading to a set of 104 possible pnictide compositions. Based on our evaluations of ground state structures, 0 K thermodynamic stabilities, electronic structures, carrier effective masses, dynamic stabilities, and intrinsic point defect formation energies, we arrive at three promising candidates, namely, NaCaInN$_2$, NaSrInN$_2$, and K$_4$ZnP$_2$. Notably, all the identified candidates are thermodynamically (meta)stable, exhibit direct (or nearest direct) band gaps that are optimal for PV applications, and are resistant to forming several types of point defects. We hope that our first principles driven workflow and the identified candidates will advance the development of novel PV materials and reinvigorate interest in the exploration of pnictides.", "url": "https://arxiv.org/abs/2608.30402", "type": "数值", "summary": "1. 该工作采用第一性原理计算，系统筛选氮化物与磷化物构成的三类三元及四元氮族化合物家族，共104种候选组成。\n2. 基于基态结构、零温热力学稳定性、电子结构、载流子有效质量、动力学稳定性及本征点缺陷形成能的综合评估，最终鉴定出NaCaInN2、NaSrInN2与K4ZnP2三种材料。\n3. 这些候选物均具有热力学亚稳、直接或近直接且适合光伏的带隙，并抵抗多种点缺陷，为超越硅的光伏器件及更广氮族材料探索提供了明确起点。", "summary_source": "deepseek", "authors": [{"name": "Avaneesh Balasubramanian"}, {"name": "Gopalakrishnan Sai Gautam"}], "featured_authors": [{"name": "Avaneesh Balasubramanian"}, {"name": "Gopalakrishnan Sai Gautam"}], "author_count": 2}, {"id": "2608.30421", "category": "cond-mat", "title": "d'Q = TdS for Infinitesimal Irreversible Processes: On the Differential Form of the Clausius Inequality", "abstract": "Conventionally, the differential form of the Clausius inequality is adopted for infinitesimal irreversible processes. We show that the correct first-order form for infinitesimal quasi-static irreversible processes is the equality d'Q=TdS rather than d'Q < TdS. This provides a purely thermodynamic proof that internal entropy production is second-order or higher and confirms that entropy remains a well-defined state quantity even when quasi-static irreversible processes are included, without resorting to the Boltzmann relation.", "url": "https://arxiv.org/abs/2608.30421", "type": "理论", "summary": "1. 该工作重新审视无穷小不可逆过程的克劳修斯不等式微分形式，指出对无穷小准静态不可逆过程，正确的首阶表述应为 d'Q=TdS 而非 d'Q<TdS。\n2. 其核心论证在于纯粹热力学地证明内熵产生至少为二阶小量，从而无需借助玻尔兹曼关系即可维持熵作为状态函数的定义一致性。\n3. 这为拟静态不可逆极限下热力学微分形式的严谨表述提供了基础，并对不可逆过程热力学的教材处理与后续理论推广具有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Hiroshi Shimahara"}], "featured_authors": [{"name": "Hiroshi Shimahara"}], "author_count": 1}, {"id": "2608.30438", "category": "cond-mat", "title": "Evanescent-mode Casimir-Josephson force and gate-controlled resonances in ballistic graphene Josephson junctions", "abstract": "We develop a microscopic scattering theory of the phase-dependent equilibrium mechanical response of a ballistic superconductor-graphene-superconductor Josephson junction. The calculation is based on an energy-dependent Dirac scattering matrix embedded in a normalized Matsubara determinant, so the reported force correction contains the complete Bogoliubov-de Gennes spectrum of the stated ideal model. At charge neutrality the full determinant approaches a closed-form evanescent-mode result proportional to $\\Delta W/L^2$, reaching $2\\ln 2\\,\\Delta W/(\\pi L^2)$ at phase difference $\\pi$ in the zero-temperature short-junction limit. Gate doping produces propagating channels and Fabry-Pérot structure, causing large oscillations and sign reversals of the phase-dependent force correction $\\delta F=F(\\phi)-F(0)$. We distinguish the interband-to-intraband Andreev crossover, controlled by $|\\mu|/\\Delta$, from the evanescent-to-propagating crossover, controlled by $|\\mu|L/(\\hbar v_F)$. Exact real-energy subgap poles obtained from the same energy-dependent scattering matrix are used to diagnose specular/interband and retro/intraband character; these labels are not treated as separately measurable thermodynamic forces in the mixed regime. We also quantify the difference between the complete determinant result and the frozen-scattering short-junction approximation without identifying that difference with a pure continuum force. The resulting gate- and phase-dependent mechanical signal provides a Dirac-material extension of earlier superconductivity-induced mechanical-force proposals.", "url": "https://arxiv.org/abs/2608.30438", "type": "理论+数值", "summary": "1. 该工作发展弹道超导体-石墨烯-超导体约瑟夫森结的微观散射理论，计算了相位依赖的平衡机械力即隐失模Casimir-Josephson力，并纳入完整Bogoliubov-de Gennes谱。\n2. 其要点是把能量依赖Dirac散射矩阵嵌入归一化Matsubara行列式；电荷中性短结极限给出2ln2 ΔW/(πL^2)的闭式，栅压掺杂经Fabry-Pérot共振使δF大幅振荡与反号，并区分两类Andreev交叉。\n3. 该结果将超导诱导力学力拓展至狄拉克材料，为栅压与相位可调的约瑟夫森结机械响应提供了定量框架与可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Shahrukh Salim"}], "featured_authors": [{"name": "Shahrukh Salim"}], "author_count": 1}, {"id": "2608.30501", "category": "cond-mat", "title": "Polymer Membrane Tensegrity: Inverse Design of Polymer Films Morphing into Freeform 3D Surfaces with Digital Photopatterning Technique", "abstract": "In Metamorphosis of Plants (1790), Goethe traced diverse plant organs to transformations of a common leaf-like structure -- a principle modern mechanics attributes to two material ingredients: non-uniform in-plane strain from differential growth or shrinkage, and spatially patterned stiffness. Here we translate this principle into a synthetic fabrication framework called Polymer Membrane Tensegrity (PMT). A flat elastomeric film swollen with a second monomer is selectively UV-cured through a liquid-crystal display (LCD) photomask in a single-side digital photopatterning step, producing rigid rods embedded in a soft, shrinkable membrane. After the unreacted monomer is extracted with a solvent and the film is dried, the membrane shrinks far more than the rods, generating a ~50% in-plane strain differential and a ~2,000-fold modulus contrast -- conditions under which the contracting membrane is held in tension by mutually unconnected rods, a tensegrity-inspired arrangement within a single film. An origami-based inverse design algorithm computes the rod layout that morphs the film into a prescribed 3D surface. We demonstrate PMT on a dome, a hyperbolic surface, and a gyroid unit cell -- positively and negatively curved targets -- reproducing all three with mean deviations of 1.0-2.1% of the target size; perimeter curve optimization halves the mean deviation of the gyroid. Because patterning occurs on one side only, PMT eliminates the front-to-back alignment demanded by bilayer methods, offering a scalable route from flat polymer films to freeform 3D surfaces.", "url": "https://arxiv.org/abs/2608.30501", "type": "数值", "summary": "1. 该工作提出聚合物膜张拉整体（PMT）制造框架，通过单侧数字光图案化将平面弹性膜变形为指定三维曲面。\n2. 其核心在于紫外光固化形成嵌入可收缩膜中的刚性杆，产生约50%面内应变差与约2000倍模量对比，并结合折纸逆向设计算法计算杆布局。\n3. 该方法仅需单侧图案化而无需双层对准，为从平面聚合物膜到自由形态三维曲面的可扩展制备提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Shuto Ito"}, {"name": "Yuta Shimoda"}, {"name": "Haruka Fukunishi"}, {"name": "Mikihiro Hayashi"}], "featured_authors": [{"name": "Shuto Ito"}, {"name": "Yuta Shimoda"}, {"name": "Haruka Fukunishi"}, {"name": "Mikihiro Hayashi"}], "author_count": 4}, {"id": "2608.30511", "category": "cond-mat", "title": "Dynamics of a nanoscale ferromagnetic vortex", "abstract": "We propose a ferromagnetic vortex stabilized by the interfacial Dzyaloshinskii--Moriya interaction (iDMI) and investigate its properties through theoretical analysis and micromagnetic simulations. Our results demonstrate that this vortex can remain stable even in nanoscale ferromagnetic disks with radii below $5\\,\\text{nm}$---far smaller than those of conventional nanodot vortices having about $1\\,\\mu\\text{m}$ radius. We analytically solve the nonlinear equation of motion describing the anharmonic vortex oscillation, and identify the critical frequency that determines the stability of the driven oscillation of the vortex. This nanoscale vortex exhibits conventional properties of microscale vortices, including gyrotropic oscillation and resonance frequency shift under an out-of-plane magnetic field. It also exhibits unconventional behaviors, such as a strongly anharmonic potential, nonlinear oscillations, and a Duffing-oscillator-like response under the external AC bias.", "url": "https://arxiv.org/abs/2608.30511", "type": "理论+数值", "summary": "1. 该工作提出由界面Dzyaloshinskii–Moriya相互作用稳定的纳米铁磁涡旋，并做了理论分析与微磁模拟。\n2. 其核心在于半径可小至5纳米以下，解析求解其非线性非谐振荡并给出驱动稳定性的临界频率。\n3. 这为超小尺寸磁涡旋器件及Duffing类非线性动力学研究提供了新平台与设计思路。", "summary_source": "deepseek", "authors": [{"name": "Jun Seok Seo"}, {"name": "Se Kwon Kim"}], "featured_authors": [{"name": "Jun Seok Seo"}, {"name": "Se Kwon Kim"}], "author_count": 2}, {"id": "2608.30523", "category": "cond-mat", "title": "Chemically Resolved Topological Coordinates Link Structural Dynamics and Configurational Thermodynamics", "abstract": "Atomic coordinates specify a structure, but they do not reveal how chemical connectivity across several length scales relates to atomic motion and configurational energy ordering. We formulate chemically directed persistent homology at four resolutions---complete networks, individual sites, spatial fields, and substitutional arrangements---while retaining the chemical identity and length scale of each connectivity feature. In \\textit{ab initio} molecular dynamics (AIMD) trajectories of $\\delta$- and $\\gamma$-CsPbI$_3$ at five temperatures spanning 500--700 K, the corner-sharing $\\gamma$ network has a lower Pb--I restoring stiffness and permits larger iodide excursions, yet iodide positional correlations decay 2.27 times more slowly and Pb-network topology retains memory 1.63 times longer than in the edge-sharing $\\delta$ phase. Local softness and loss of network memory are therefore distinct. At individual sites, rare $\\gamma$-phase Pb environments with a $\\delta$-like Cs-cage connectivity precede 0.17 $\\mathring{\\mathrm{A}}$ greater Pb displacement over the subsequent 0.5 ps. The same Pb-network coordinate resolves disruption of corner-sharing connectivity across a 2560-atom $\\delta|\\gamma$ boundary. In substituted CsPbI$_3$, compact dopant arrangements undergo greater cooperative host relaxation and lie lower in density-functional-theory (DFT) energy than dispersed arrangements of the same composition. SchNet and Allegro model families with comparable energy errors encode opposite ordering along this coordinate, and 61 of 247 supplied models with errors below 1 meV atom$^{-1}$ on separate test structures reverse the DFT relation. Because relative configurational energies set Boltzmann populations, chemical network topology links structure to physical response and tests whether learned energy models preserve DFT configurational ordering even when their average errors are small.", "url": "https://arxiv.org/abs/2608.30523", "type": "理论+数值", "summary": "1. 该工作发展了化学导向持续同调坐标，在完整网络、单点、空间场与替位排布四个分辨率上同时保留化学身份与尺度，并应用于δ和γ-CsPbI₃的从头算分子动力学轨迹。\n2. 其核心卖点是揭示γ相Pb–I恢复刚度较低、碘位移更大，但位置关联衰减慢2.27倍且Pb网络记忆长1.63倍，使局部软度与网络记忆丧失解耦；类δ铯笼的罕见γ态还预示后续0.5 ps内约0.17 Å的铅位移。\n3. 同一坐标还可分辨δ|γ界面连接破坏与掺杂排布的能量排序，并发现大量低平均误差机器学习势反转DFT构型能量序，因此为检验学习势及联结结构动力学与构型热力学提供基准。", "summary_source": "deepseek", "authors": [{"name": "Ayush Kumar Pandey"}, {"name": "Abhishek Tewari"}], "featured_authors": [{"name": "Ayush Kumar Pandey"}, {"name": "Abhishek Tewari"}], "author_count": 2}, {"id": "2608.30531", "category": "cond-mat", "title": "Moiré-induced lattice reconstruction at buried atomic interfaces", "abstract": "Atomic reconstruction at twisted two-dimensional interfaces governs many of their emergent optical, electronic, and mechanical properties, including sliding ferroelectricity. Despite recent progress in understanding lattice reconstruction in suspended twisted bilayers, structural changes at van der Waals heterointerfaces between multilayer crystals remain largely unexplored. Here we use multi-slice electron ptychography to non-invasively recover the three-dimensional atomic structure at marginally twisted rhombohedral interfaces between thick transition-metal dichalcogenide crystals. With a position precision of ~3 pm and a depth resolution ~1 nm, we resolve the twist-induced lattice reconstruction field per layer, and the resulting dislocation network at the buried interface. Despite the bulk nature, we observe markedly strong in-plane interfacial reconstruction due to suppression of the out-of-plane bending by outer layers, exceeding predictions from our three-dimensional modelling. Furthermore, we extract the strain tensor evolution during the decay of the reconstruction into the bulk, providing a structural foundation for understanding multi-layer moiré systems.", "url": "https://arxiv.org/abs/2608.30531", "type": "理论", "summary": "1. 该工作利用多层电子叠层衍射成像恢复了厚过渡金属硫族化物转角界面处的三维原子结构。\n2. 卖点在于以约3 pm定位精度与约1 nm深度分辨率逐层解析重构场及位错网络。\n3. 该结果为理解多层莫尔体系中应变向体相衰减及外层抑制弯曲的机制提供了结构基础。", "summary_source": "deepseek", "authors": [{"name": "Nicholas Clark"}, {"name": "Frederick Allars"}, {"name": "Isaac Soltero"}, {"name": "Wendong Wang"}, {"name": "David Hopkinson"}, {"name": "Hugo de Latour"}, {"name": "James G. McHugh"}, {"name": "William Talbott"}, {"name": "Sam Sullivan-Allsop"}, {"name": "Rongsheng Cai"}, {"name": "Astrid Weston"}, {"name": "Xiao Li"}, {"name": "Gareth Tainton"}, {"name": "Casey K. Cheung"}, {"name": "Francisco Selles"}, {"name": "Alex Summerfield"}, {"name": "Andrey Kretinin"}, {"name": "Christopher S. Allen"}, {"name": "Vladimir Falko"}, {"name": "Sarah J. Haigh"}, {"name": "Roman Gorbachev"}], "featured_authors": [{"name": "Nicholas Clark"}, {"name": "Frederick Allars"}, {"name": "Isaac Soltero"}, {"name": "Vladimir Falko"}, {"name": "Sarah J. Haigh"}, {"name": "Roman Gorbachev"}], "author_count": 21}, {"id": "2608.30539", "category": "cond-mat", "title": "Mass-gap functional determinant approach for mobile Fermi polarons", "abstract": "We extend the functional determinant approach (FDA), previously restricted to static impurities, to the case of finite-mass impurities by using the mass-gap description of Fermi polarons [Phys. Rev. Lett. 135, 193401 (2025)]. The quadratic structure of the mass-gap model enables the exact evaluation of many-body spectra and Ramsey dynamics for mobile impurities. We show that this mass-gap FDA smoothly interpolates between the Fermi-edge singularity for infinitely heavy impurities and the emergence of quasiparticle weight for finite impurity mass. Our results demonstrate that the mass-gap FDA provides a transparent and computationally efficient framework to describe the quantum dynamics of mobile impurities.", "url": "https://arxiv.org/abs/2608.30539", "type": "理论", "summary": "1. 该工作将此前限于静态杂质的泛函行列方法推广至有限质量的移动费米极化子，并通过质量间隙模型精确得到多体能谱与拉姆齐动力学演化。\n2. 该方法利用质量间隙模型的二次结构，揭示了随杂质质量变化从无穷重极限的费米边奇异到有限质量准粒子权重的连续过渡。\n3. 该框架兼具透明性与计算效率，为研究移动杂质系统的量子动力学以及未来在超冷原子气体或凝聚态器件中的实验探测提供了清晰直接可用的理论途径。", "summary_source": "deepseek", "authors": [{"name": "Emilio Ramos Rodríguez"}, {"name": "Eugen Dizer"}, {"name": "Xin Chen"}, {"name": "Richard Schmidt"}], "featured_authors": [{"name": "Emilio Ramos Rodríguez"}, {"name": "Eugen Dizer"}, {"name": "Xin Chen"}, {"name": "Richard Schmidt"}], "author_count": 4}, {"id": "2608.30566", "category": "cond-mat", "title": "A closed-form theory of charge-regulated electrostatic interactions between anisotropically charged spheres", "abstract": "Proteins and many other colloids carry ionizable surface groups that are both spatially inhomogeneous (patchy) and pH-responsive (charge-regulating). In the description of the electrostatic interactions between such particles, these two aspects are often treated separately, especially from a theoretical perspective. We present a unified, closed-form theory that unites charge regulation and patchiness within the linearized Poisson--Boltzmann approximation. For spherical particles with anisotropic distributions of titratable sites, we derive both the leading-order mean-field interaction energy as well as the Kirkwood--Shumaker fluctuation interaction. The theory exposes a qualitatively new effect between two electroneutral anisotropic particles: proximity-induced charge regulation generates a net monopole, and splits orientational branches that are degenerate in any linear fixed-charge model. The accompanying correction to the interaction energy has no fixed sign---it softens like-charge repulsion but can deepen or create attraction away from the isoelectric point. We benchmark three ingredients of the theory against published results; no existing simulation probes their combination, which would capture the central prediction of the theory. Lastly, we apply the theory to two proteins---lysozyme and $\\alpha$-chymotrypsinogen A---and show that it not only reproduces the measured second virial coefficients reasonably well but also predicts how charge regulation expands the range of pH and screening strength where the protein--protein interaction is attractive.", "url": "https://arxiv.org/abs/2608.30566", "type": "理论+数值", "summary": "1. 该工作在线性化泊松-玻尔兹曼近似下，提出了统一描述各向异性带电球体电荷调控与表面斑块性的闭式理论，并导出平均场相互作用能与Kirkwood-Shumaker涨落相互作用能。\n2. 其核心发现是：两个电中性各向异性颗粒靠近时，电荷调控诱发净单极子，并使线性固定电荷模型中简并的取向分支劈裂，且能量修正符号不定，可软化同号排斥或加深、产生吸引。\n3. 该理论应用于溶菌酶和α-胰凝乳蛋白酶原A，可复现实验第二维里系数，并预测电荷调控扩大蛋白-蛋白吸引的pH与屏蔽强度范围，为后续模拟和实验提供可检验靶点。", "summary_source": "deepseek", "authors": [{"name": "Anže Božič"}], "featured_authors": [{"name": "Anže Božič"}], "author_count": 1}, {"id": "2608.30630", "category": "cond-mat", "title": "Effective Hardcore Exclusion Without Exclusion: Two-Species Pair Annihilation Revisited", "abstract": "Reaction-diffusion systems with two species that mutually annihilate through $A+B\\to\\emptyset$ reactions display a slow decay of the total density $\\rho$ which follows an anomalous power law in low dimensions. For hardcore particles in one dimension, this decay follows $\\rho \\sim t^{-1/4}$ under symmetric diffusion and $\\rho \\sim t^{-1/3}$ under asymmetric diffusion without relative bias between the two species. The $t^{-1/3}$ behavior, in particular, has so far been observed exclusively in systems with hardcore exclusion. Here we construct a model of particles without hardcore exclusion that reproduces this same $t^{-1/3}$ scaling. In our model, both species undergo asymmetric diffusion with a rate that depends nonlinearly on the local density, a form of transport that, in the absence of the other species, is superdiffusive and falls into the Kardar-Parisi-Zhang universality class. The scaling behavior of $t^{-1/3}$ occurs when at least one of the two species undergoes asymmetric diffusion induced by microscopic processes involving pairs of particles, while asymmetric processes involving groups of three particles lead to $t^{-1/4}$ scaling associated with symmetric diffusion. This demonstrates that the pair annihilation density decay exponent is not determined exclusively by the transport properties of the isolated particle species.", "url": "https://arxiv.org/abs/2608.30630", "type": "理论", "summary": "1. 该工作重新审视双物种A+B→∅反应扩散系统，在无硬核排斥条件下构造粒子模型，成功复现了低维密度ρ~t^{-1/3}的异常幂律衰减。\n2. 其核心在于使物种扩散速率非线性依赖局域密度，引发单物种输运进入KPZ超扩散类；至少一种物种由粒子对微观过程驱动非对称扩散时得t^{-1/3}，而三粒子非对称过程对应t^{-1/4}。\n3. 这证明密度衰减指数不能仅由孤立物种的输运类别判定，未来标定反应-扩散普适类需纳入微观多体过程的阶次与对称性。", "summary_source": "deepseek", "authors": [{"name": "Su-Chan Park"}, {"name": "Foster Thompson"}], "featured_authors": [{"name": "Su-Chan Park"}, {"name": "Foster Thompson"}], "author_count": 2}, {"id": "2608.30645", "category": "cond-mat", "title": "Emergence and suppression of phonon vortices in two-dimensional crystals: Interplay of lattice symmetry, heavy impurities, and shear", "abstract": "Phonon vortices are vortex-like displacement fields that appear in the vibrational modes of two- dimensional materials. Here, we demonstrate that these vortices arise as symmetry-adapted linear combinations of degenerate planar phonon modes, with the superposition coefficients uniquely de- termined by the lattice point group. This symmetry principle establishes that vortices are intrinsic standing-wave solutions in perfect crystals, requiring neither impurities nor disorder. A heavy mass impurity favors vortex modes over planar modes through stronger resonance-induced frequency soft- ening, whereas shear deformation suppresses vortex modes by breaking rotational symmetry. The competition between these two effects gives rise to a precisely predictable strain threshold. The proposed framework, grounded in symmetry and energy-minimization, provides a useful basis for understanding vibrational topological defects induced by other types of impurities or defects. This study further suggests that defect and shear engineering constitutes an effective tuning strategy for controlling vibrational modes and the associated thermal and mechanical properties of crystals.", "url": "https://arxiv.org/abs/2608.30645", "type": "理论", "summary": "1. 该工作提出对称性原理，证明二维晶体中的声子涡旋是简并面内声子模式的对称适应线性组合，属于完美晶体的本征驻波解。\n2. 其核心在于揭示重杂质与剪切应变的竞争：前者经共振频率软化增强涡旋模式，后者破缺转动对称性抑制涡旋，从而产生精确可预测的应变阈值。\n3. 该基于对称性与能量最小化的框架可推广至其他杂质或缺陷诱发的振动拓扑缺陷，并为缺陷与剪切工程调控晶格热学及力学性质提供思路。", "summary_source": "deepseek", "authors": [{"name": "Yu-Tian Zhang"}, {"name": "Deng Pan"}, {"name": "Yuliang Jin"}], "featured_authors": [{"name": "Yu-Tian Zhang"}, {"name": "Deng Pan"}, {"name": "Yuliang Jin"}], "author_count": 3}, {"id": "2608.30665", "category": "cond-mat", "title": "Terahertz Control of Optical Second-Harmonic Generation in Displacive Ferroelectrics: Electronic Bloch-State Reconstruction", "abstract": "Optical second-harmonic generation (SHG) is a powerful probe of ferroelectric order, yet its microscopic origin and dynamical control are often understood primarily from symmetry considerations rather than from the underlying electronic processes. Here, we develop a microscopic theory of terahertz-controlled optical SHG in displacive ferroelectrics, establishing a direct connection between THz-driven polar lattice distortions and the resulting electronic nonlinear optical response. Starting from a complete Bloch-band representation, we show that an inversion-breaking lattice distortion reconstructs electronic Bloch wave functions, modifies optical dipole matrix elements, and activates nonlinear optical pathways that are forbidden in the centrosymmetric structure. We derive the second-order susceptibility in terms of the distortion-induced reconstruction of electronic states and optical transition matrix elements, and demonstrate that the electronic SHG susceptibility is linear in the polar distortion, $\\chi^{(2)}({\\bf Q})\\propto{\\bf Q}$, leading to an SHG intensity quadratic in the inversion-breaking order parameter. When the polar mode is coherently driven by a terahertz electric field, the resulting time-dependent lattice distortion dynamically reconstructs the electronic states and thereby modulates the optical SHG response, with $I_{2\\omega}(t)\\propto|{\\bf Q}(t)|^2$ to leading order. This framework distinguishes the THz-driven lattice dynamics from the electronic interband processes responsible for optical SHG, which is particularly important in insulating ferroelectrics where low-energy carrier dynamics are absent. Our theory thus provides a microscopic bridge between nonequilibrium polar lattice dynamics and ultrafast electronic nonlinear optics.", "url": "https://arxiv.org/abs/2608.30665", "type": "理论+数值", "summary": "1. 该工作为位移型铁电体建立了描述太赫兹场调控光学二次谐波的微观理论，将太赫兹驱动的极性晶格畸变与电子非线性光学响应直接联系起来。\n2. 其核心在于基于完整布洛赫带表示，证明反演对称破缺畸变重构电子布洛赫态与光跃迁矩阵元，激活中心对称结构中禁戒的非线性光通道，并导出二阶极化率正比于极性畸变、二次谐波强度与其平方成正比的解析结论。\n3. 该框架区分了太赫兹驱动晶格动力学与产生二次谐波的电子带间过程，为绝缘铁电体中超快极化有序参数的非线性光学探测提供了微观桥梁。", "summary_source": "deepseek", "authors": [{"name": "Hong-Kui Liu"}, {"name": "Zi-Chen Qin"}, {"name": "Jun-Song Wu"}, {"name": "Yue Yuan"}], "featured_authors": [{"name": "Hong-Kui Liu"}, {"name": "Zi-Chen Qin"}, {"name": "Jun-Song Wu"}, {"name": "Yue Yuan"}], "author_count": 4}, {"id": "2608.30670", "category": "cond-mat", "title": "Active Brownian Dynamics from a Hamiltonian Model: Transitioning from Equilibrium to Activity", "abstract": "We introduce a Hamiltonian Active Brownian Particle (HABP) model that connects equilibrium dynamics with the non-equilibrium, two-dimensional overdamped behavior of standard Active Brownian Particles (ABPs). In equilibrium, the system follows overdamped Langevin equations that strictly satisfy the fluctuation-dissipation theorem. Coupling translational and rotational degrees of freedom to separate heat baths ($T_{\\theta} > T_{\\textrm{tr}}$), drives the system out of equilibrium. In free space, matching the diffusion coefficients yields quantitative agreement with the ABP model in the limit $T_\\theta/T_{\\textrm{tr}}\\to \\infty$, whereas in a harmonic potential, this matching is recovered even at finite temperature ratios. Entropy production analysis demonstrates that in the ABP limit, all energy injected by the swim force dissipates into the translational bath, leaving the rotational bath as a zero-cost entropy source. These insights provide the first steps toward equilibrium-inspired descriptions of active matter, facilitating the development of new theoretical frameworks to study activity-induced fluctuations, transport, and phase behavior in living and non-living soft matter systems far from equilibrium.", "url": "https://arxiv.org/abs/2608.30670", "type": "理论", "summary": "1. 该工作提出了哈密顿活性布朗粒子（HABP）模型，将平衡态动力学与标准活性布朗粒子（ABP）的二维过阻尼非平衡行为统一起来。\n2. 其核心在于将平动与转动自由度耦合至不同热浴（Tθ>Ttr）；在自由空间中匹配扩散系数可在Tθ/Ttr→∞极限定量复现ABP，而谐波势下有限温度比即可恢复，熵产生分析表明泳力注入能量全部耗散至平动浴。\n3. 这为从平衡态视角构建活性物质理论提供了起点，有助于发展描述活性诱导涨落、输运及软物质相行为的全新框架。", "summary_source": "deepseek", "authors": [{"name": "Antik Bhattacharya"}, {"name": "Smarajit Karmakar"}, {"name": "Jürgen Horbach"}], "featured_authors": [{"name": "Antik Bhattacharya"}, {"name": "Smarajit Karmakar"}, {"name": "Jürgen Horbach"}], "author_count": 3}, {"id": "2608.30746", "category": "cond-mat", "title": "Hartree Fragmentation and Long-Range Pair Networks in Aperiodic Chains", "abstract": "For fermions in a slowly varying aperiodic potential with random interactions $V_{ij}/|i-j|^{\\alpha}$, the potential fixes the resonance supply $N_0 \\propto L^{2-n}/h$. On crossing ${\\alpha}-2n$, wherever Hartree fragmentation is operative, the resonant-object ensemble reconstructs: turning-point runs fragment into clusters whose intrinsic matching law resolves no logarithmic singularity, while isolated wing bonds survive at finite density and restore a reduced logarithm. The scaling $x^{4-2n-{\\alpha}}_{pair} ln{x_{pair}} \\propto h^2/(V t0)$ is unchanged. Random coefficient fluctuations sustain the $R^{-{\\alpha}}$ coupling; uniform ones cancel to $R^{-{\\alpha}-2}$.", "url": "https://arxiv.org/abs/2608.30746", "type": "理论", "summary": "1. 该工作解析研究了慢变非周期势中带无规长程相互作用费米子的Hartree碎片化与长程配对网络结构。\n2. 其卖点在于揭示横越α−2n时共振客体系综重构：转向点径迹碎裂成团簇，本征匹配律消除对数奇点，而孤立翼键以有限密度恢复约化对数；随机与均匀系数涨落分别维持R^{−α}或抵消为R^{−α−2}耦合。\n3. 配对标度x_{pair}^{4−2n−α}ln x_{pair}∝h²/(V t0)保持不变，为非周期链中长程相互作用下的量子临界与局域化研究提供了可检验基准。", "summary_source": "deepseek", "authors": [{"name": "Yogeshwar Prasad"}], "featured_authors": [{"name": "Yogeshwar Prasad"}], "author_count": 1}, {"id": "2608.30761", "category": "cond-mat", "title": "Resonance statistics, Fock-space branching, and long-range pair networks in slowly varying interacting chains", "abstract": "In a slowly varying aperiodic potential $h_i=h\\cos(2\\pi\\beta i^n+\\phi)$ with random power-law density interactions $V_{ij}/|i-j|^\\alpha$, the resonant-object ensemble changes across $\\alpha=2n$, wherever Hartree fragmentation is operative, from isolated two-level bonds to a mixture of fragmented multi-site clusters and isolated wing bonds that survive at finite density, while the pair-resonance scaling $x_{\\rm pair}^{4-2n-\\alpha}\\ln x_{\\rm pair}\\propto h^2/(Vt_0)$ is unchanged~\\cite{letter}. Here we develop the microscopic resonance theory underlying these results, together with its domain of validity. We derive the exact phase-averaged resonance statistics --- the supply $N_0\\propto L^{2-n}/h$, the correlated common-phase comb, and the closed-form Hartree variance --- proving that the interaction leaves the leading supply law unchanged. Exact construction of the resonant Fock-space graph at $L\\le18$ shows that the order-one forward-branching scale $h_{\\rm FB}\\propto L^{2-n}$ carries no giant component: one-step branching and connectivity are inequivalent. We separate the fixed-pair matching law from the shell-averaged $q\\ln(1/q)$ law of the bond ensemble and develop the comb into a mesoscopic shell theory; we map the fragmentation domain, with its support threshold $V_*(\\alpha)$ and the boundary-healing recursion; and we treat the marginal case $\\alpha=2$, where shell and matching marginalities compound into a double logarithm. Three long-range thresholds emerge with distinct meanings --- $\\alpha=1/2$ (the exact variance threshold of the random Fock-space energy and the square-summability boundary of the leading LIOM-dressing estimate), $\\alpha=2n$ (change of the local resonant objects), and $\\alpha=2$ (marginality of the long-range shell sum) --- none of which is, by itself, a localization transition.", "url": "https://arxiv.org/abs/2608.30761", "type": "理论", "summary": "1. 该工作针对缓变非周期势与随机幂律密度相互作用的格点链，建立了微观共振理论，并推导出精确的相位平均共振统计与Fock空间共振图。\n2. 核心在于证明相互作用不改变主导共振供给律，揭示基态前向分枝尺度不伴随巨连通分量，从而区分一步分枝与网络连通性，并标明α=1/2、2n与2三类长程阈值的独立含义。\n3. 这为澄清共振结构变化与局域化转变的关系提供了严格工具，也对长程相互作用下多体局域化及LIOM微扰方案的适用边界具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Yogeshwar Prasad"}], "featured_authors": [{"name": "Yogeshwar Prasad"}], "author_count": 1}, {"id": "2608.30802", "category": "cond-mat", "title": "Chiral Color Ice: Exact Local Handedness Constraints and Möbius Zero Modes in Frustrated Magnets", "abstract": "Local constraints govern the low-energy physics of frustrated matter, but familiar ice-type rules constrain flux-like quantities and are insensitive to handedness. Here we show that handedness itself can be imposed as an exact local quantum constraint without selecting an axis in spin space. We construct positive-semidefinite, SU(2)-invariant parent Hamiltonians whose complete zero-energy space on a tetrahedron has a prescribed chirality sign, rather than selecting a particular chiral wave function. For spin-1/2 the local term is a rank-one projector onto a chiral tetrahedral singlet, while for arbitrary spin it factorizes as $B^\\dagger B$ through a singlet-annihilation operator, with a completely characterized kernel given by the span of the globally rotated chiral color-ice states. For coherent states, the same zero-energy condition becomes an $S$-independent nonlinear constraint in which three spin directions determine the fourth through a Möbius transformation; compositions of these maps define constraint holonomies on extended lattices. Connecting the same local constraint in different ways produces qualitatively different collective regimes: corner-sharing lattices retain exponentially large quantum ground-state kernels, with rigorous lower bounds exceeding conventional ice benchmarks; edge-sharing lattices support subdimensional plane or line zero modes; while triangular constructions suppress nonuniform coherent deformations and contain the complete Anderson tower of tetrahedral magnetic order at exactly zero energy. Two inequivalent triangular coverings further show that harmonic zero-mode counting does not determine the size of the quantum kernel. These results establish a tractable setting in which local handedness, nonlinear constraint geometry, and quantum degeneracy can be disentangled and related directly to the connectivity of the constraint network.", "url": "https://arxiv.org/abs/2608.30802", "type": "理论", "summary": "1. 该工作针对受挫磁体构造了SU(2)不变的“手性色冰”母哈密顿量，将手性符号设为四面体上的精确局域量子约束。\n2. 其卖点在于相干态下零能条件化为Möbius变换决定的非线性约束，且不同晶格连接分别产生指数简并、次维零模或完整Anderson塔。\n3. 这为在可解模型中区分局域手性、非线性约束几何与量子简并，并直接联系约束网络连通性提供了清晰框架。", "summary_source": "deepseek", "authors": [{"name": "Péter Kránitz"}, {"name": "Yasir Iqbal"}, {"name": "Karlo Penc"}], "featured_authors": [{"name": "Péter Kránitz"}, {"name": "Yasir Iqbal"}, {"name": "Karlo Penc"}], "author_count": 3}, {"id": "2608.30809", "category": "cond-mat", "title": "Kinetic temperatures and inertial effects in a nonequilibrium bead-spring model", "abstract": "We investigate a nonequilibrium steady-state model consisting of two coupled beads with arbitrary masses in contact with two thermal baths at different temperatures. Using a covariance-matrix approach together with numerical simulations of the underdamped Langevin dynamics, we characterize steady-state probability distributions, heat transport, and entropy production. We show that irreversibility measures such as entropy production and heat current are invariant under an exchange of the bead masses, whereas energy-storage observables depend explicitly on the mass arrangement in a symmetrical set up. This reveals a fundamental distinction: energy observables exhibit path dependence in singular mass limits, while transport and irreversibility remain well defined. We show that kinetic temperatures provide the natural variables governing the thermodynamics of the system: their difference controls transport and entropy production, while their sum determines the mean energy via a model specific generalized equipartition relation. In the infinite-mass limit, only constitutive relations expressed in terms of kinetic temperatures remain meaningful. Thus, energy, transport, and irreversibility are unified through kinetic temperatures as the organizing variables. We also derive an effective temperature that defines an equilibrium-like canonical distribution. Finally, we analyze the notion of ergodicity and show that the time-averaged observables converge significantly faster than the ensemble averages.", "url": "https://arxiv.org/abs/2608.30809", "type": "理论+数值", "summary": "1. 该工作通过协方差矩阵与欠阻尼朗之万数值模拟，研究了任意质量两耦合珠子分别接触两个不同温度热浴的非平衡稳态，刻画了概率分布、热输运与熵产生。\n2. 其核心发现在于质量交换下不可逆性度量不变而能量观测量依赖于质量排布，并论证动力学温度差控制输运与熵产生、其和通过广义均分决定平均能量，无穷质量极限下仅动力学温度表达式仍有意义。\n3. 这以动力学温度为组织变量统一能量、输运与不可逆性，并给出定义平衡类正则分布的有效温度，对非平衡小系统热力学与遍历性研究具有直接启示。", "summary_source": "deepseek", "authors": [{"name": "Jetin E Thomas"}, {"name": "Ramandeep S. Johal"}], "featured_authors": [{"name": "Jetin E Thomas"}, {"name": "Ramandeep S. Johal"}], "author_count": 2}, {"id": "2608.30849", "category": "cond-mat", "title": "Inertia-Driven Information Flow and Symmetry Breaking in a Nonequilibrium Two-Bead System", "abstract": "We investigate information-flow generation in a nonequilibrium two-bead system coupled to two heat baths. We show that the system acts as an information-flow generator in both overdamped and underdamped regimes, with the underdamped dynamics revealing a divergence of the scaled information flow along specific paths in the thermal asymmetry--inertia parameter space that is hidden in the overdamped limit. This information generation suggests a possible route toward information engines and demon-like mechanisms in nanomachines. A symmetry-perturbation analysis of the response landscape of information flow reveals a geometric structure reminiscent of a Ginzburg--Landau framework: the symmetric reference state can correspond to a minimum or maximum depending on the perturbation direction, while the flat overdamped landscape develops a finite curvature under inertia. Mass asymmetry shifts the resulting maxima, and Hessian eigenvalue and eigenvector analysis reveals level touching of principal modes and bimodality along a constant-diffusion path. These results establish a minimal framework for understanding how inertia and microscopic heterogeneity shape information landscapes in nonequilibrium systems, with potential extensions to more complex heterogeneous networks.", "url": "https://arxiv.org/abs/2608.30849", "type": "理论", "summary": "1. 该工作研究耦合双热浴的双珠非平衡系统中信息流生成，涵盖过阻尼与欠阻尼区间。\n2. 其核心发现在于欠阻尼下特定热不对称-惯性参数路径上标度信息流发散，并借助对称性微扰揭示出类似金兹堡-朗道的响应地貌；质量不对称移动极大值，Hessian 特征值分析显示主模能级接触与双峰性。\n3. 这为惯性效应与微观不均匀性塑造非平衡信息景观提供最小框架，并可推广至复杂异构网络的研究。", "summary_source": "deepseek", "authors": [{"name": "Jetin E. Thomas"}, {"name": "Ramandeep S. Johal"}], "featured_authors": [{"name": "Jetin E. Thomas"}, {"name": "Ramandeep S. Johal"}], "author_count": 2}, {"id": "2608.30863", "category": "cond-mat", "title": "Self-Diffusion of Water through Thermally Activated Membranes", "abstract": "Diffusion processes involving membranes are of fundamental importance in both science and technology, since membranes serve as selective interfaces that regulate the transport of mass, charge, and information across multiple length and time scales. In this study, we employ molecular dynamics (MD) simulations to calculate the self-diffusion coefficient, tetrahedral order parameter and hydrogen-bond (HB) lifetime of SPC/E water over a wide high-temperature range in the presence of thermally activated membranes (TAMs). These membranes exhibit thermally controlled stochastic behavior that locally influences particle dynamics by probabilistically inducing elastic scattering events as particles traverse the membrane. The stochastic behavior of the membranes is governed by a sigmoidal profile, which depend on the reduced temperature of the system. The effective activation energy for diffusion is estimated for several membrane configurations. It is found that the diffusion coefficients generally decrease with an increase in the number of membranes and are in reasonable agreement with the Arrhenius approximation at high temperatures. Additionally, both the tetrahedral order parameter and the HB lifetime are only locally sensitive to the action of the membranes.", "url": "https://arxiv.org/abs/2608.30863", "type": "数值", "summary": "1. 该工作利用分子动力学模拟，系统计算了高温宽温域内SPC/E水在热激活膜影响下的自扩散系数、四面体序参数和氢键寿命。\n2. 其技术卖点在于膜采用依赖约化温度的S形随机激活曲线，以概率性弹性散射局部改变水分子运动，并定量给出了多种膜构型下的有效扩散激活能。\n3. 结果表明自扩散随膜数增加而下降、高温段符合Arrhenius规律，且水结构参数只对膜产生局域响应，这为热响应渗透膜及受限水输运的后续研究提供了微观参照。", "summary_source": "deepseek", "authors": [{"name": "Carlos Handrey A. Ferraz"}], "featured_authors": [{"name": "Carlos Handrey A. Ferraz"}], "author_count": 1}, {"id": "2608.30886", "category": "cond-mat", "title": "Signatures of inter-sideband coherence in the resonance fluorescence spectrum of an acoustically-modulated quantum dot", "abstract": "We theoretically investigate the inter-sideband phase coherence within the resonance fluorescence spectrum of an acoustically modulated quantum dot using a filtered-field formalism for a Mach-Zehnder configuration. We demonstrate that geometric slant of the interferograms provides an indicator of phase coherence that is resilient to environmental white noise. Specifically, noise-induced spectral diffusion reduces the global fringe intensity, while leaving the characteristic inclination strictly invariant. Our findings establish a framework for verifying single-photon coherence between spectral sidebands, essential for frequency-bin encoding and scalable quantum networking in realistic, noisy solid-state architectures.", "url": "https://arxiv.org/abs/2608.30886", "type": "理论", "summary": "1. 该工作采用滤波场形式，在理论上研究了声学调制量子点共振荧光谱中边带间的相位相干性，并针对马赫-曾德尔干涉构型给出分析。\n2. 其核心卖点是，干涉图的几何倾斜可作为抗环境白噪声的相干性指标；噪声引起的谱扩散仅降低整体条纹强度，而该特征倾斜保持严格不变。\n3. 这一结果为在噪声固态架构中验证光谱边带间的单光子相干性、实现频率箱编码及可扩展量子网络提供了清晰的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Rafał A. Bogaczewicz"}, {"name": "Hubert J. Krenner"}, {"name": "Paweł Machnikowski"}], "featured_authors": [{"name": "Rafał A. Bogaczewicz"}, {"name": "Hubert J. Krenner"}, {"name": "Paweł Machnikowski"}], "author_count": 3}, {"id": "2608.30918", "category": "cond-mat", "title": "Anomalous temperature dependence in phase transitions via ballistic coalescence", "abstract": "We study kinetics of phase transitions within a single component Lennard-Jones model. For low enough particle densities disconnected clusters form that can move ballistically in an inviscid vapor background. The clusters undergo sticky collisions, thereby forming larger aggregates, which can be of fractal nature at ultra cold temperatures. As the temperature is varied, the exponent of the algebraic growth of average cluster mass changes, exhibiting pronounced nonmonotonic character. We capture this anomalous behavior, in two and three space dimensions, within a ballistic aggregation theory. We show that the scope of the theory is much broader than the typically considered case where cluster motions are uncorrelated. An analysis of the theory shows that ballistic aggregation can even occur exponentially fast. This is in sharp contrast with the conventional algebraic picture, regarding passive matter phase transitions. We discuss scenario where such explosive growth can be realized. In addition, our results are widely relevant in understanding structure and growth in aerosols, cosmic dust and other aggregation processes.", "url": "https://arxiv.org/abs/2608.30918", "type": "理论", "summary": "1. 该工作利用单组分Lennard-Jones模型研究低密度下弹道合并驱动的相变动力学，发现平均团簇质量的代数增长指数随温度呈显著非单调变化。\n2. 其核心在于将弹道聚集理论推广到速度关联的团簇运动，在二维和三维重现该异常温度依赖，并预言弹道聚集可指数级加速进行。\n3. 这为理解气溶胶、宇宙尘埃等无黏性背景中的聚集结构，以及超出被动物质传统代数图像的快速相变场景提供了理论启发。", "summary_source": "deepseek", "authors": [{"name": "Nalina Vadakkayil"}, {"name": "Sutapa Roy"}, {"name": "Jiarul Midya"}, {"name": "Subir K. Das"}], "featured_authors": [{"name": "Nalina Vadakkayil"}, {"name": "Sutapa Roy"}, {"name": "Jiarul Midya"}, {"name": "Subir K. Das"}], "author_count": 4}, {"id": "2608.30921", "category": "cond-mat", "title": "Breakdown of Charge-Conjugation Symmetry of Disclinations in 2D Crystals", "abstract": "Disclinations are elementary topological defects in two-dimensional (2D) crystalline membranes, yet their elastic properties remain largely unexplored. Using atomistic simulations, we address the energetics, morphology, and interactions of disclinations in free-standing graphene, a prototypical 2D crystal. We find that while disclinations with positive topological charges follow an expected behavior, negative disclinations exhibit sublinear energy scaling with charge as well as equilibrium shape that deviates sharply from the conventional saddle ansatz. This breakdown of charge-conjugation symmetry leads to qualitatively distinct interactions: positive disclinations repel, whereas negative disclinations display a robust long-range attraction. These trends are shown to be further amplified by self-adhesion in folded membranes. Our results uncover a fundamentally different energetic landscape for negative curvature defects and provide a basis for understanding the stability, self-folding behavior, and defect-driven morphology of graphene and other 2D membranes.", "url": "https://arxiv.org/abs/2608.30921", "type": "理论+数值", "summary": "1. 该工作利用原子模拟系统研究了自由悬浮二维晶体石墨烯中向错缺陷的能量、形貌与相互作用规律。\n2. 其核心物理发现是电荷共轭对称性破缺：负向错的能量随拓扑电荷呈亚线性增长，平衡形态显著偏离传统鞍面近似，且与正向错的相互排斥不同，表现为稳健的长程吸引，并受到自粘附的进一步增强。\n3. 这一发现为理解石墨烯等二维膜中负曲率缺陷所主导的稳定性、自折叠行为及缺陷驱动形貌提供了物理基础，并对缺陷工程与后续研究具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Ruslan Yamaletdinov"}, {"name": "Mikhail I. Katsnelson"}, {"name": "Oleg V. Yazyev"}], "featured_authors": [{"name": "Ruslan Yamaletdinov"}, {"name": "Mikhail I. Katsnelson"}, {"name": "Oleg V. Yazyev"}], "author_count": 3}, {"id": "2608.30931", "category": "cond-mat", "title": "Stoner contributions to the magnon equation of motion", "abstract": "From linear response theory, we derive the equation of motion for Landau-damped magnon quasi-particles in absence of spin-orbit coupling. The derivation is based on a minimal set of assumptions, namely that the transverse magnetic susceptibility is diagonalized by one collective eigenmode per magnetic atom in the unit cell, and that the spectrum of each collective eigenmode is dominated by a single magnon resonance. The resulting equation of motion leads to a natural definition of the exchange interaction as the restoring force acting on the collective mode magnetization near equilibrium. In addition to magnetic exchange, the magnon equation of motion also contains a damping term and a dispersive quasi-particle mass, both originating from the electron-magnon coupling. The effect of these terms is illustrated for a prototypical itinerant ferromagnet, where they redshift the magnon dispersion and reduce the magnon lifetime as the magnon enters the Stoner continuum. By further assuming wave vector independence of the collective magnon subspace, the magnon equation of motion becomes atomistic with well defined magnetic sites. For real materials, one can approximate the magnon coupling constants using an arbitrary level of band theory for the dynamic transverse magnetic susceptibility.", "url": "https://arxiv.org/abs/2608.30931", "type": "理论", "summary": "1. 该工作基于横向磁化率在每个磁性原子处由一个集体本征模对角化且谱以单一磁振子共振为主的最小假设，由线性响应理论推导了无自旋轨道耦合下朗道阻尼磁振子准粒子的运动方程。\n2. 其技术卖点在于将交换相互作用自然定义为集体模磁化偏离平衡时的恢复力，并指出运动方程中除交换外还包含源自电子-磁振子耦合的阻尼项与色散质量项，二者在巡游铁磁体中使色散红移并降低寿命。\n3. 在波矢无关近似下该运动方程退化为具有明确磁位点的原子论形式；对于真实材料，可利用任意精度的能带理论计算动态横向磁化率来近似磁振子耦合常数，为衔接第一性原理与磁振子动力学提供了可操作的框架。", "summary_source": "deepseek", "authors": [{"name": "Thorbjørn Skovhus"}, {"name": "Patrik Thunström"}], "featured_authors": [{"name": "Thorbjørn Skovhus"}, {"name": "Patrik Thunström"}], "author_count": 2}, {"id": "2608.30941", "category": "cond-mat", "title": "Compensation in continuous symmetric trilayered planar ferrimagnet", "abstract": "The trilayered (A-B-A type) anisotropic (single site) XY magnetic model is considered with the intra-plane ferromagnetic and the inter-plane antiferromagnetic interactions. The equilibrium properties of such trilayered anisotropic XY system has been studied by Monte Carlo simulation with Metropolis single spin (randomly chosen) update algorithm. In a given range of interaction parameters, the system has been found to exhibit the high temperature {\\it critical} (vanishing sublattice magnetisations and total magnetisation) and low temperature {\\it compensation} (vanishing total magnetisation even for non-vanishing sublattice magnetisations) behaviours. The compensation temperature and the critical temperature both are found to increase with the increase of single site anisotropy. The comprehensive phase diagram is drawn. The finite size study reveals the growth of correlations near the critical temperature.", "url": "https://arxiv.org/abs/2608.30941", "type": "理论+数值", "summary": "1. 该工作采用Metropolis单自旋随机更新算法，对具有面内铁磁和层间反铁磁耦合的三层A-B-A型各向异性XY自旋模型进行蒙特卡洛模拟，研究其平衡态性质。\n2. 技术要点在于证实系统在特定参数区间同时呈现高温临界（所有磁化消失）与低温补偿（总磁化为零而子晶格磁化非零）行为，且补偿温度与临界温度均随单离子各向异性增强而升高。\n3. 有限尺寸分析揭示临界温度附近关联增长并给出完整相图，为多层亚铁磁结构中的磁补偿调控与临界现象研究提供了可参考的数值模拟框架。", "summary_source": "deepseek", "authors": [{"name": "Olivia Mallick"}, {"name": "Muktish Acharyya"}], "featured_authors": [{"name": "Olivia Mallick"}, {"name": "Muktish Acharyya"}], "author_count": 2}, {"id": "2608.30981", "category": "cond-mat", "title": "Particle-Mediated Tuning of Defect Stability in Lamellar Block Copolymer Systems", "abstract": "We study how colloidal inclusions modify the formation energy of dislocation pairs in lamellar block copolymer systems. Using a hybrid particle/Ginzburg--Landau model, we calculate defect formation energies by comparing defect-free and defect-containing states with and without embedded colloids. Finite-size scaling is used to obtain formation energies in the thermodynamic limit. The effect of colloid insertion depends strongly on particle sizes and surface patterning. Homogeneous particles increasingly stabilize dislocation pairs with increasing particle sizes. Particles larger than one lamellar domain preferentially occupy the dislocation cores, where they replace strained polymer rather than deforming defect-free lamellae. The magnitude of this stabilization depends on surface affinity. Balanced Janus particles instead increase the formation energy, because their competing surface preferences cannot be satisfied simultaneously near the curved core. Varying the patch ratio interpolates between these limits. Surface patterning has little effect for particles smaller than one lamellar domain but changes the formation energy by several tens of $k_BT$ for larger particles. These results provide quantitative guidelines for controlling topological defect stability in lamellar block copolymer systems.", "url": "https://arxiv.org/abs/2608.30981", "type": "理论+数值", "summary": "1. 该工作通过混合粒子/金兹堡-朗道模型和有限尺寸标度，计算了层状嵌段共聚物中位错对在有/无胶体颗粒时的形成能。\n2. 均质颗粒随尺寸增大逐渐稳定位错对，大颗粒优先占据位错核心而非畸变层状结构，而平衡Janus颗粒因表面亲和竞争提高形成能，补丁比例可连续调节二者极限。\n3. 结果为通过颗粒尺寸与表面图案定量调控层状嵌段共聚物拓扑缺陷稳定性提供了明确的设计准则。", "summary_source": "deepseek", "authors": [{"name": "Le Qiao"}, {"name": "Daniel A. Vega"}, {"name": "Friederike Schmid"}], "featured_authors": [{"name": "Le Qiao"}, {"name": "Daniel A. Vega"}, {"name": "Friederike Schmid"}], "author_count": 3}, {"id": "2608.30994", "category": "cond-mat", "title": "Intercoupling of Segregation and Rheology in Spatially Developing Granular Chute Flows", "abstract": "We investigate the flow and segregation of binary granular mixtures with density differences down a long chute using a continuum framework that couples a particle-force-based segregation model with an inertial-number-based local rheology. The steady-state momentum and convection-diffusion-segregation equations are solved simultaneously, explicitly accounting for the two-way coupling between segregation and flow. Predicted concentration and velocity fields at different streamwise locations are validated against representative DEM simulations. The validated model is then used to examine the influence of density ratio, mixture composition, and chute inclination on segregation over a wide range of conditions. The chute length required to achieve fully developed segregation is quantified and compared with the development length for monodisperse granular flow. At low density ratios and/or low inclinations, segregation develops over much longer distances than the velocity field. In contrast, at higher inclinations and larger density contrasts, the two length scales become comparable, demonstrating that neglecting flow development can significantly underestimate segregation evolution.", "url": "https://arxiv.org/abs/2608.30994", "type": "理论+数值", "summary": "1. 该工作构建耦合颗粒力分离模型与惯性数流变的连续框架，求解稳态动量与对流-扩散-分离方程，重现二元密度差溜槽颗粒流。\n2. 其卖点在于显式处理分离与流动的双向耦合，量化分离发展长度，并指出低密度比或低倾角下分离远慢于流场发展。\n3. 这警示忽略流动发展会显著低估分离演化，为溜槽颗粒流中分离与流变耦合的空间演化预测提供明确启发。", "summary_source": "deepseek", "authors": [{"name": "Soniya Kumawat"}, {"name": "Sayeedul Islam Sheikh"}, {"name": "Satyabrata Patro"}, {"name": "Vishal Singh"}, {"name": "Anurag Tripathi"}], "featured_authors": [{"name": "Soniya Kumawat"}, {"name": "Sayeedul Islam Sheikh"}, {"name": "Satyabrata Patro"}, {"name": "Vishal Singh"}, {"name": "Anurag Tripathi"}], "author_count": 5}, {"id": "2608.31019", "category": "cond-mat", "title": "A MOF-reinforced self-foaming sponge for mechanically robust triboelectric membranes with improved resistance to humidity", "abstract": "Porous triboelectric materials offer significant potential for enhancing the performance of triboelectric nanogenerators, yet their practical application is limited by structural instability and humidity-induced performance degradation. In this work, a bio-derived, sustainable polyamide containing disulfide linkages was developed to enable spontaneous formation of a porous dielectric without external templating. Hydrophilic MOF fillers comprising HKUST-1 crystals are incorporated within the porous matrix to reinforce the membrane structure and regulate moisture effects. Mechanical characterization demonstrates that HKUST-1 suppresses pore collapse and improves structural robustness under repeated deformation, while analysis of stress-strain behaviour reveals the critical role of pore stability in achieving stable triboelectric output. In addition, HKUST-1 mitigates humidity-induced charge dissipation by confining water molecules within its framework, giving enhanced triboelectric output stability and reduced performance degradation under increasing relative humidity compared to the neat porous system. This work demonstrates a strategy that integrates self-foamed porous structures, sustainable polymer design, and functional filler reinforcement to engineer mechanically robust and environmentally stable triboelectric systems.", "url": "https://arxiv.org/abs/2608.31019", "type": "理论", "summary": "1. 作者利用含二硫键的生物基聚酰胺自发发泡形成无模板多孔介电膜，并嵌入亲水性HKUST-1填料，用于摩擦纳米发电机的摩擦电膜。\n2. 技术关键在于HKUST-1既抑制反复形变下的孔塌陷以维持结构鲁棒性，又在水分子进入其骨架时限制电荷耗散，从而缓解湿度引起的输出衰减。\n3. 该工作将自发泡多孔结构、可持续聚合物与功能填料增强相结合，为研制力学稳固且耐湿的摩擦电材料提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Tianhuai Xu"}, {"name": "Pavel Kulyabin"}, {"name": "Fatih Uzun"}, {"name": "Alejandra Sophia Lozano-Pérez"}, {"name": "Ketan Pancholi"}, {"name": "Amit Kumar"}, {"name": "Jin-Chong Tan"}], "featured_authors": [{"name": "Tianhuai Xu"}, {"name": "Pavel Kulyabin"}, {"name": "Fatih Uzun"}, {"name": "Ketan Pancholi"}, {"name": "Amit Kumar"}, {"name": "Jin-Chong Tan"}], "author_count": 7}, {"id": "2608.31114", "category": "cond-mat", "title": "Overcoming critical slowing down in frustrated spin systems by learned multiscale sampling", "abstract": "Cluster algorithms, such as the Swendsen--Wang and Wolff methods, are among the most successful MCMC methods for mitigating critical slowing down in statistical systems. These constructive cluster algorithms, however, fail in the presence of even extremely weak frustration. Here, we sidestep this fundamental limitation by learning rather than constructing the relevant clusters. Specifically, we use the wavelet conditional renormalization group (WCRG) sampling method to learn the probability distribution of collective fluctuations of a frustrated two-dimensional soft-spin model. Configurations are then generated recursively from coarse to fine scales by sampling conditional wavelet distributions. The WCRG method reproduces the main statistical properties of the system across different phases, including the local-field distribution and the structure factor. At an Ising-like critical point, the conditional dynamics remains decorrelated within $\\mathcal{O}(1)$ sweeps at each scale, yielding an overall sampling complexity of $\\mathcal{O}(\\log_2 L)$, thus making WCRG much more efficient than standard local MCMC methods. These results show that learned multiscale sampling can overcome critical slowing down in frustrated systems for which conventional cluster algorithms fail. By assessing the sampling accuracy of different observables, we also clarify the main tradeoff of the WCRG method: the accuracy of the fast sampling scheme depends on the expressiveness of the energy-based model used to estimate the wavelet conditional distributions.", "url": "https://arxiv.org/abs/2608.31114", "type": "理论+数值", "summary": "1. 该工作采用小波条件重整化群（WCRG）方法学习二维阻挫软自旋模型中集体涨落的概率分布，并从粗到细递归生成构型。\n2. 其核心卖点在无需构造簇即可规避阻挫对Swendsen-Wang等聚类算法的根本限制，在Ising类临界点各尺度条件动力学仅需O(1)次扫描去相关，总复杂度降至O(log_2 L)。\n3. 该结果展示学习式多尺度采样能攻克常规聚类算法失效的阻挫体系临界减速，同时指明其精度取决于能量基模型估计小波条件分布的表达能力。", "summary_source": "deepseek", "authors": [{"name": "Gabriele Bandini"}, {"name": "Giulio Biroli"}, {"name": "Patrick Charbonneau"}, {"name": "Andrea Gambassi"}], "featured_authors": [{"name": "Gabriele Bandini"}, {"name": "Giulio Biroli"}, {"name": "Patrick Charbonneau"}, {"name": "Andrea Gambassi"}], "author_count": 4}, {"id": "2608.28736", "category": "hep-th", "title": "Reimagining Gravity: Generalized Symmetries, Double Copy, and Spinning Black Holes", "abstract": "General relativity is a century-old subject. Yet modern explorations through generalized symmetries, scattering amplitudes, and effective field theory have raised open problems, motivating a reassessment of conventional views on gravitation, spacetime, and spin. First, do generalized symmetries exist in dynamical gravity as a low-energy EFT? Second, is there a field-theoretic explanation for the tree-level double copy relationship between general relativity and Yang-Mills theory? Third, what are the exact equations of motion or Lagrangians of four-dimensional spinning black holes in external fields, in point-particle effective theory? In this dissertation, three different perspectives on gravity are developed to shed light on each of these puzzles. In Part I, we view gravity as a gauge theory of Lorentz group to establish a one-form symmetry of dynamical gravity. In Part II, we investigate how far gravity can be viewed as a gauge theory of diffeomorphisms, in connection with color-kinematics duality and double copy. In Part III, we view four-dimensional gravity as a
