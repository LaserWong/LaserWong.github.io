nonlinear interaction between self-dual and anti-self-dual parts. We apply this view to the derivation of four-dimensional spinning black hole solutions as well as their dynamics in point-particle effective theory. First, we derive a new self-dual black hole metric from classical double copy and show that the Kerr metric represents a pair of self-dual and anti-self-dual Taub-NUT solutions, elevating the Newman-Janis algorithm to a rigorous derivation. Second, we propose a dynamical probe counterpart of Newman-Janis algorithm. We give a Lagrangian derivation of spinning black hole Compton amplitudes that exhibit correct factorizations and are free of spurious poles for all helicity configurations while developing a chiral formalism that manifests and maximally utilizes the simplicity of the self-dual sector.", "url": "https://arxiv.org/abs/2608.28736", "type": "理论", "summary": "1. 该论文从广义对称性、双拷贝与自旋黑洞三种视角重新审视动力学引力。\n2. 其技术核心是以手征自对偶形式导出无伪极点旋量黑洞Compton振幅并严格化Newman-Janis算法。\n3. 这为引力EFT中自对偶扇区、色-运动学对偶及黑洞动力学提供了统合框架与后续研究方向。", "summary_source": "deepseek", "authors": [{"name": "Joon-Hwi Kim"}], "featured_authors": [{"name": "Joon-Hwi Kim"}], "author_count": 1}, {"id": "2608.28741", "category": "hep-th", "title": "Carroll-Cotton Tensors and Gravitational Radiation at Null Infinity", "abstract": "We provide a first-principles definition of Cotton tensors on conformal Carroll geometries by gauging the conformal Carroll algebra. On the mathematical side, this analysis yields a conformally covariant object designed to quantify deviations from conformal flatness in Carrollian geometries. On the physical side, it offers a powerful geometric tool to describe gravitational radiative degrees of freedom at the conformal boundary of four-dimensional asymptotically flat spacetimes. Unlike the Bondi news, whose fully-covariant definition requires amendment by supplementary data that we identify with the Geroch tensor, the Carroll-Cotton tensors offer the natural geometric objects to quantify deviations from stationarity due to the emission of gravitational waves.", "url": "https://arxiv.org/abs/2608.28741", "type": "理论", "summary": "1. 该工作通过规范共形Carroll代数，在共形Carroll几何上给出了Carroll-Cotton张量的第一性原理定义。\n2. 其要旨在于该张量作为共形协变量，既可直接度量Carroll几何偏离共形平坦的程度，又能在四维渐近平直时空的零无穷远边界上自然刻画引力辐射自由度，从而避免了Bondi news需以Geroch张量作为补充数据才能实现协变定义的困难。\n3. 这为引力波辐射与非平稳性的协变几何描述提供了更自然的框架，并可能启发含宇宙学常数或更低维时空情形的进一步推广。", "summary_source": "deepseek", "authors": [{"name": "Adrien Fiorucci"}, {"name": "Simon Pekar"}, {"name": "P. Marios Petropoulos"}, {"name": "Matthieu Vilatte"}], "featured_authors": [{"name": "Adrien Fiorucci"}, {"name": "Simon Pekar"}, {"name": "P. Marios Petropoulos"}, {"name": "Matthieu Vilatte"}], "author_count": 4}, {"id": "2608.28743", "category": "hep-th", "title": "OPE and correlation functions in a generally covariant form", "abstract": "In this paper we consider some general aspects of Euclidean conformal field theories on curved spaces of dimension $D\\ge 3$. We first look at the OPE of scalar primary fields on conformally flat spaces. Extending the results of \\cite{Konechny:2026bqg}, we give a general construction of the descendants' contributions to the OPE in the scalar channel. We then discuss CFTs on non-conformally flat spaces in the ambient space formalism. We investigate the short-distance behaviour of three-point functions on such spaces using the general ansatz proposed by Parisini, Skenderis, and Withers \\cite{Parisini:2022wkb, Parisini:2023nbd}. We find that some additional corrections need to be added to the ansatz to ensure the existence of a local covariant OPE.", "url": "https://arxiv.org/abs/2608.28743", "type": "理论", "summary": "1. 该工作研究欧几里得共形场论在维度D≥3的弯曲空间上的OPE与关联函数，涵盖共形平坦与非共形平坦两类背景。\n2. 技术要点是对共形平坦空间构造标量原初场OPE中后裔贡献的一般形式，并利用环境空间形式研究非共形平坦空间，发现Parisini-Skenderis-Withers三点函数短距离拟设需加入额外修正项以保证局域协变OPE存在。\n3. 这为在一般弯曲背景上建立局域协变的共形场论OPE与关联函数提供了必要约束与修正方案，并指引了后续在该形式下的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Arpit Das"}, {"name": "Anatoly Konechny"}, {"name": "Naveen Balaji Umasankar"}], "featured_authors": [{"name": "Arpit Das"}, {"name": "Anatoly Konechny"}, {"name": "Naveen Balaji Umasankar"}], "author_count": 3}, {"id": "2608.28751", "category": "hep-th", "title": "Holographic warped CFTs from General Relativity on AdS$_3$", "abstract": "We introduce a new set of boundary conditions for three-dimensional Einstein gravity with negative cosmological constant. The canonical generators plainly realize the semidirect sum of Virasoro and $u(1)$ Kac-Moody algebras in its standard form, without the need of additional redefinitions of the global charges. We show that requiring Euclidean BTZ and thermal AdS$_3$ to be diffeomorphic precisely induces the warped modular $S$-transformation of the chemical potentials. The corresponding warped Cardy formula then exactly reproduces the Bekenstein-Hawking entropy, where the ground state is identified as Euclidean AdS$_3$. An explicit comparison with the boundary conditions of Brown-Henneaux and Compere-Song-Strominger is also addressed.", "url": "https://arxiv.org/abs/2608.28751", "type": "理论", "summary": "1. 该工作为三维负宇宙学常数爱因斯坦引力引入了一组新边界条件，使规范生成元直接实现Virasoro与u(1) Kac-Moody代数的半直和，无需重定义整体荷。\n2. 其核心在于要求欧几里得BTZ与热AdS_3互为微分同胚，由此精确导出化学势的warped模S变换，且warped Cardy公式严格再现Bekenstein-Hawking熵并以欧几里得AdS_3为基态。\n3. 该结果建立了体引力与warped共形场论的全息对应，并为与Brown-Henneaux及Compere-Song-Strominger边界条件比较提供明确框架，对后续全息熵计算或变形CFT研究具有启发。", "summary_source": "deepseek", "authors": [{"name": "Kristiansen Lara"}, {"name": "Ricardo Troncoso"}], "featured_authors": [{"name": "Kristiansen Lara"}, {"name": "Ricardo Troncoso"}], "author_count": 2}, {"id": "2608.28942", "category": "hep-th", "title": "Action-angle variables and phase space formulation of Hermitian matrix models", "abstract": "We develop a phase space description of large $N$ Hermitian one matrix models directly from the recursions satisfied by the orthogonal polynomials. In the one-cut phase, the recursion lattice naturally gives rise to a semiclassical action-angle pair, which can be mapped canonically to eigenvalue and momentum variables. We show that the resulting momentum profile is determined by the density of zeros of the orthogonal polynomials, and that the same phase space structure is reproduced from the Wigner transform of the Christoffel-Darboux projector and from the planar spectral curve. The Gaussian model provides a simple consistency check of the proposal. We then extend the construction to the symmetric quartic two-cut phase, where a period-two Jacobi recursion produces two Bloch bands and two disconnected phase space components with actions given by the partial 't Hooft couplings. Finally, we outline the finite-gap generalization appropriate to multicut phases.", "url": "https://arxiv.org/abs/2608.28942", "type": "理论", "summary": "1. 该文发展了大N Hermite单矩阵模型的相空间表述，直接由正交多项式递归构造作用-角变量，并将框架推广到双cut与多cut相位。\n2. 其技术核心在于单cut相位中递归格点给出半经典作用-角对，动量分布由正交多项式零点密度决定，且该相空间结构同时源于Christoffel-Darboux投影子的Wigner变换与平面谱曲线；双cut情形则产生两个Bloch带和不连通相空间分量，作用由部分't Hooft耦合给出。\n3. 这为谱曲线、正交多项式零点与相空间几何之间建立了明确联系，对多cut有限能隙矩阵模型的半经典研究具有直接启发意义。", "summary_source": "deepseek", "authors": [{"name": "Arghya Chattopadhyay"}], "featured_authors": [{"name": "Arghya Chattopadhyay"}], "author_count": 1}, {"id": "2608.29169", "category": "hep-th", "title": "Flat connections on moduli spaces I: Local (1,0)-extension of the DHS connection", "abstract": "The flat DHS connection $\\mathcal J_{\\mathrm{DHS}}$ constructed in arXiv:2602.01461 is smooth on the configuration space of $n$ points on a fixed compact Riemann surface $\\Sigma$ of arbitrary genus $h$, takes values in an infinite-dimensional Lie algebra $\\hat{\\mathfrak t}_{h,n}$ and is invariant under the modular group $\\mathrm{Sp}(2h,\\mathbb Z)$. This paper is the first in a series for a program whose goal is to extend the connection $\\mathcal J_{\\mathrm{DHS}}$ to a global flat connection on the Teichmüller space $\\mathcal T_{h,n}$ valued in the Lie algebra of derivations of $\\hat{\\mathfrak t}_{h,n}$. Upon the choice of local coordinates adapted to the map $\\mathcal T_{h,n}\\to \\mathcal T_h$, such a connection splits into three pieces: $\\mathcal J_{\\mathrm{DHS}}$, a piece $\\mathcal L$ corresponding to holomorphic directions of $\\mathcal T_h$ and a third piece corresponding to anti-holomorphic directions in $\\mathcal T_h$. In this paper, we isolate the system of equations satisfied by $\\mathcal L$ and obtain its solution locally and explicitly. The construction of a global extension of $\\mathcal J_{\\mathrm{DHS}}$ to $\\mathcal T_{h,n}$ and the extension of the meromorphic connection of arXiv:1112.0864 to $\\mathcal T_{h,n}$, are relegated to future publications in this series.", "url": "https://arxiv.org/abs/2608.29169", "type": "理论", "summary": "1. 该论文针对任意亏格紧黎曼曲面上n点构型空间上的DHS平联络，在选取适应Teichmüller空间的局部坐标后，研究其到Teichmüller空间的局部(1,0)-延拓。\n2. 主要技术贡献是将该延拓联络分解为DHS联络、对应Teichmüller空间全纯方向的L部分及反全纯方向三部分，并分离出L满足的方程组，给出其局部显式解。\n3. 这一局部延拓为后续将DHS联络整体延拓至Teichmüller空间、并进一步延拓arXiv:1112.0864中的亚纯联络的整体构造奠定了基础。", "summary_source": "deepseek", "authors": [{"name": "Eric D'Hoker"}, {"name": "Benjamin Enriquez"}, {"name": "Oliver Schlotterer"}, {"name": "Federico Zerbini"}], "featured_authors": [{"name": "Eric D'Hoker"}, {"name": "Benjamin Enriquez"}, {"name": "Oliver Schlotterer"}, {"name": "Federico Zerbini"}], "author_count": 4}, {"id": "2608.29213", "category": "hep-th", "title": "One-loop renormalization group flow of the translation-invariant noncommutative Yukawa theory", "abstract": "We study the one-loop renormalization group flow of the translation-invariant noncommutative pseudoscalar Yukawa theory on four-dimensional Euclidean Moyal space. The two inequivalent orderings of the Moyal-star Yukawa vertex give rise to two independent couplings $g_{1}$ and $g_{2}$, whose beta functions form a coupled nonlinear system; every one-loop divergence is absorbed by a counterterm already present in the action, establishing one-loop renormalizability of the theory. We solve the one-loop system analytically: it decouples in the variables $u=g_{1}^{2}+g_{2}^{2}$ and $v=g_{1}^{2}-g_{2}^{2}$, the quartic coupling is obtained by a Riccati reduction on the symmetric surface $g_{1}=g_{2}$, and the generic asymmetric flow is reduced to a single quadrature by the exact invariant $\\mathcal{I}=(g_{1}g_{2})^{3}/(g_{1}^{2}-g_{2}^{2})^{4}$. Two dynamical consequences follow. The ratio $r=v/u$ has a UV-attractive symmetric surface $r=0$ and IR-attractive asymmetric directions $r=\\pm1$, so that the flow restores the symmetry between the two Moyal orderings towards the ultraviolet and amplifies any initial ordering asymmetry towards the infrared, as a fractional power of the logarithm. In consequence the Yukawa-induced coefficient of the non-planar $1/(\\theta^{2}p^{2})$ structure is dynamically suppressed towards $p\\rightarrow 0$; the singularity itself is not removed, and remains the task of the IR-improving term. We also solve the dimensionful sector ($M^{2}$, $m$, $a^{2}$) in closed form on the symmetric critical trajectory, and compare throughout with the commutative theory.", "url": "https://arxiv.org/abs/2608.29213", "type": "理论", "summary": "1. 该工作计算了四维Moyal空间中平移不变非交换赝标量Yukawa理论的单圈重整化群流。\n2. 其要点是两种Moyal星顶点排序对应独立耦合，其beta函数构成可解析求解的非线性系统，并揭示紫外恢复排序对称、红外放大排序不对称的流向。\n3. 这为非平面奇点的动力学抑制提供了具体机制，但奇点本身仍需红外改善项处理。", "summary_source": "deepseek", "authors": [{"name": "Karim Bouchachia"}, {"name": "Smain Kouadik"}], "featured_authors": [{"name": "Karim Bouchachia"}, {"name": "Smain Kouadik"}], "author_count": 2}, {"id": "2608.29329", "category": "hep-th", "title": "Inequalities and Positivity in Modular Flowed Entanglement Entropy", "abstract": "The modular Hamiltonian plays an important role in quantum information theory, quantum field theory, and the AdS/CFT correspondence. In this paper, we study a specific dynamical setup: starting from the tensor product of the reduced density matrices of a reference state, we evolve this product state under the modular flow generated by the reference state itself. We then investigate the resulting change in the entanglement entropy of a given region, which we call the modular entanglement shift (MES). Unlike evolution under a fixed quantum channel, this modular evolution obeys no general principle requiring the MES to have a definite sign. For a bipartition into subsystems A and B, we establish an exact entropy balance: the sum of the MESs for A and B equals the mutual information generated along the orbit. Consequently, their sum is nonnegative, even though either individual shift may be negative. For two disjoint intervals in the vacuum of a two-dimensional conformal field theory, however, we prove that a global conformal involution exchanging the intervals forces the two MESs to be equal. It follows that each MES is nonnegative along the modular flow. We establish this result both using a conformally transported regulator and intrinsically in terms of Araki relative entropy. Finally, we identify the modular-flow orbit with a Connes cocycle orbit and discuss possible applications to the AdS/CFT correspondence.", "url": "https://arxiv.org/abs/2608.29329", "type": "理论", "summary": "1. 该工作针对固定子系统的约化密度矩阵张积初态，研究其在本征模流演化下给定区域纠缠熵的变化（模纠缠移位），并给出其满足的不等式与正性结论。\n2. 主要技术结果是证明A、B两部分模纠缠移位之和恰等于模流轨道上生成的互信息，由此二者总和非负；在二维CFT真空两不相交区间情形，利用交换两区间的全局共形对合证明两移位相等且各自非负。\n3. 该结果将模流轨道与Connes余循环轨道相联系，为AdS/CFT中利用模哈密顿量动力学约束纠缠熵和量子信息量提供了可推广的理论工具。", "summary_source": "deepseek", "authors": [{"name": "Liangyu Chen"}], "featured_authors": [{"name": "Liangyu Chen"}], "author_count": 1}, {"id": "2608.29402", "category": "hep-th", "title": "Bound States in Perturbative Quantum Gravity with Hydrogen-like Degeneracy", "abstract": "Recent results in the study of gravitational scattering amplitudes indicate that some highly-symmetric relativistic systems may exactly conserve a version of the Laplace-Runge-Lenz (LRL) vector in two-body bound states. We make a systematic study, in the context of a generic EFT of long-range interactions due to the exchange of massless mediator particles of spins 0, $\\frac{1}{2}$, 1, $\\frac{3}{2}$, 2, of the conditions for the conservation of a hidden LRL vector; both classically (no orbital precession) and quantum mechanically (hydrogen-like degeneracy of bound states). The calculations require several new technical developments including the extension of relativistic post-Minkowskian potential matching to quantum corrections and the incorporation of long-range forces due to the exchange of pairs of massless fermions. We find that while classically the absence of precession is a generic property of a large class of models, including Kaluza-Klein theories, with vector and scalar exchanges, maintaining the degeneracy quantum mechanically requires a surprising cancellation between gravitons and 6 Majorana gravitinos, hinting at a special role for $\\mathcal{N}=6$ supergravity.", "url": "https://arxiv.org/abs/2608.29402", "type": "理论", "summary": "1. 该工作在一类由自旋0、1/2、1、3/2、2无质量粒子交换主导长程相互作用的一般有效场论中，系统考察两体束缚态保留隐藏Laplace-Runge-Lenz矢量的条件。\n2. 技术卖点是将后闵可夫斯基层次上的势匹配推广至量子修正，并纳入无质量费米子对交换的贡献，从而严格区分经典轨道无进动与量子氢类似简并。\n3. 结果发现经典无进动在含标量和矢量交换的卡鲁扎-克莱因模型中广泛存在，但量子简并需引力子与6个Majorana引力微子的精确抵消，指向N=6超引力的特殊角色。", "summary_source": "deepseek", "authors": [{"name": "Callum R. T. Jones"}, {"name": "Shruti Paranjape"}, {"name": "Marcos Skowronek"}], "featured_authors": [{"name": "Callum R. T. Jones"}, {"name": "Shruti Paranjape"}, {"name": "Marcos Skowronek"}], "author_count": 3}, {"id": "2608.29541", "category": "hep-th", "title": "Teleparallel formulation of $E_{8(8)}$ Exceptional Field Theory", "abstract": "The potential of $E_{8(8)} \\times \\mathbb{R}^+$ exceptional field theory, suited for studying three-dimensional maximally supersymmetric compactifications of higher-dimensional supergravities, is derived in teleparallel formulation. This means that, starting from an ansatz of the most general combination of the quadratic scalar contractions of the intrinsic torsion, which is manifestly invariant under generalised diffeomorphisms, one selects the potential by imposing the invariance under infinitesimal rotation of the maximal compact subgroup of the duality group. The teleparallel formulation makes manifest at geometric level the preeminent role of the intrinsic torsion in studying compactifications of higher-dimensional supergravities, where the intrinsic torsion is identified with the embedding tensor of the resulting gauged supergravity.", "url": "https://arxiv.org/abs/2608.29541", "type": "理论", "summary": "1. 该工作推导了 E_{8(8)}×R^+ 例外场论在 teleparallel 表述中的势能表达式，该理论专门用于研究高维超引力的三维最大超对称紧化。\n2. 其核心卖点在于从内禀挠率二次标量收缩的最一般广义微分同胚不变组合出发，再通过要求势能在对偶群最大紧子群的无穷小转动下不变来唯一选取，并将内禀挠率与所得规范超引力的嵌入张量直接对应。\n3. 这从几何层面明确了内禀挠率在紧化中的主导作用，为系统研究高维超引力紧化与规范超引力的对应关系提供了可推广至 E_{d(d)} 系列的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Davide Rovere"}], "featured_authors": [{"name": "Davide Rovere"}], "author_count": 1}, {"id": "2608.29594", "category": "hep-th", "title": "Higher-Spin dS/CFT beyond minimal type-A, and the doubled nature of de Sitter space", "abstract": "We study the holographic duality between free vector models and Higher-Spin Gravity in 4-dimensional de Sitter space. On both the bulk and boundary sides, we introduce new reality conditions, which allow us to include odd spins in the bulk, and to extend the duality from type-A to type-B (i.e. from boundary scalars to spinors). The new reality conditions are closely related to a higher-spin-symmetric Hilbert-space norm for the single-particle (super)multiplet in de Sitter space. We construct two alternative viewpoints on the type-A and type-B theories. In one view, the two co-exist in \"parallel universes\", specifically in even vs. odd antipodal identifications of de Sitter space. In the other view, type-A and type-B are Legendre-transformed descriptions of the same twistor-space theory in Euclidean AdS (this involves the observation that the higher-spin partition function is Legendre-dual to itself). In this way, higher-spin holography reconciles the two-boundary nature of de Sitter space with the one-boundary nature of Euclidean AdS. The supersymmetric theory that unifies type-A and type-B with bulk fermions fails to be consistent under the appropriate reality conditions.", "url": "https://arxiv.org/abs/2608.29594", "type": "理论", "summary": "1. 作者研究了四维德西特空间中自由矢量模型与高自旋引力的全息对偶，引入新的实条件以涵盖奇自旋并将对偶从A类推广到B类旋量边界理论。\n2. 其核心在于这些实条件与德西特单粒子多重态的高自旋对称希尔伯特空间范数相关，并提供两种等价视角：A/B类对应偶/奇对跖认同的平行宇宙，或作为同一欧氏AdS扭空间理论的勒让德自对偶描述。\n3. 该结果消解了德西特双边界与欧氏AdS单边界的表面矛盾，并表明统一A/B类与体费米子的超对称理论在实条件下不自洽，为后续量子宇宙学全息模型设定了约束。", "summary_source": "deepseek", "authors": [{"name": "Julian Lang"}, {"name": "Yasha Neiman"}], "featured_authors": [{"name": "Julian Lang"}, {"name": "Yasha Neiman"}], "author_count": 2}, {"id": "2608.29627", "category": "hep-th", "title": "Genuine Multi-Entropy in Abelian Chern--Simons Theory: Exact Key-Ring Collapse and Its Breakdown for Generic Link States", "abstract": "We study genuine multi-entropy in Abelian $U(1)_k$ Chern-Simons theory. For key-ring link states, where only the linking numbers between one distinguished component $K$ and the remaining $\\mathtt{q}-1$ components are nonzero, we derive an exact closed-form expression for the $\\mathtt{q}$-partite Rényi multi-entropy for general $\\mathtt{q}$, level $k$, and Rényi index $n$. For $\\mathtt{q}=4$, this shows that the genuine multi-entropy $\\mathrm{GM}^{(4)}_n$ collapses exactly onto the tripartite information $I_{3,n}$ for all $n$, while for $\\mathtt{q}=5$ it is likewise completely determined, for all $n$, by a linear combination of tripartite and bipartite Rényi multi-entropies. We then go beyond the key-ring class and study general four-component link states with arbitrary pairwise linking numbers. A numerical scan over Chern--Simons levels $2\\leq k\\leq24$ shows that the all-$n$ collapse found analytically for key-ring states does not survive for generic link states. Remarkably, the collapse remains exact at $n=2$ for every level examined. At $n=3$, violations occur, within the scanned range, only when $3\\mid k$, with a further dependence on the $3$-adic valuation of $k$. At $n=4$ and $n=5$, violations occur for every level examined, with rates that vary strongly with $k$. These results show that the breakdown is not controlled simply by the zero-divisor structure of composite $\\mathbb Z_k$, but instead exhibits a nontrivial joint dependence on the Rényi index and the arithmetic structure of the Chern--Simons level.", "url": "https://arxiv.org/abs/2608.29627", "type": "理论", "summary": "1. 该工作研究了阿贝尔 U(1)_k Chern-Simons 理论中的真实多熵：对 key-ring 链环态导出任意 q、k 与 Rényi 指数 n 的精确闭式，并对一般四分量链环态做数值扫描。\n2. 关键在于 key-ring 态的四部多熵对所有 n 精确塌缩到三体信息，五部则由三体与二体信息线性决定；一般链环态的塌缩仅在 n=2 保持，n≥3 的破坏随 k 的整除与 p 进估值呈现复杂算术依赖。\n3. 这表明真实多熵能敏感探测 Chern-Simons 能级的算术结构，为多体拓扑纠缠的精细分类提供新探针，并激励对一般链环态多熵的解析刻画。", "summary_source": "deepseek", "authors": [{"name": "Yen-Cheng Chang"}, {"name": "Kaberi Goswami"}, {"name": "Norihiro Iizuka"}, {"name": "Akihiro Miyata"}], "featured_authors": [{"name": "Yen-Cheng Chang"}, {"name": "Kaberi Goswami"}, {"name": "Norihiro Iizuka"}, {"name": "Akihiro Miyata"}], "author_count": 4}, {"id": "2608.29686", "category": "hep-th", "title": "Latent Geometry and the Emergence of Lorentzian Time in Matrix Quantum Mechanics", "abstract": "We introduce \\emph{latent geometry} in BFSS/BMN models. Before an emergent geometry evaporates at the geometric transition, large-$d$ Gaussianization encodes its information in the exceptional $N=2$ sector selected by the baby fuzzy sphere, a single active spin-$1/2$ Pauli block. Dimensional reduction, finite-$N$ Gaussianization and exact Molien--Weyl projection transport this encoding to mass-deformed BFSS$_2$. At $N=2$, the same stable BFSS$_2$ oscillator admits inequivalent unitary $\\mathbf{H}^2_\\theta=\\mathbf{EAdS}^2_\\theta$ and $\\mathbf{dS}^2_\\theta$ decodings, realizing spacetime transmutation and the emergence of Lorentzian time.", "url": "https://arxiv.org/abs/2608.29686", "type": "理论", "summary": "1. 该工作通过大d高斯化与有限N Molien-Weyl投影，在BFSS/BMN矩阵量子力学中引入潜几何，并将其编码降至质量变形BFSS_2的N=2泡利块。\n2. 核心在于N=2稳定振子可给出酉不等价的EAdS^2_theta与dS^2_theta两种解码，从而实现时空嬗变并涌现洛伦兹时间。\n3. 这为从矩阵模型重建几何与时间，以及探究几何相变附近信息保持提供了具体机制与可扩展框架。", "summary_source": "deepseek", "authors": [{"name": "Badis Ydri"}], "featured_authors": [{"name": "Badis Ydri"}], "author_count": 1}, {"id": "2608.29688", "category": "hep-th", "title": "One-Loop Fluctuation Response Along a Constrained Noncommutative Modulus in the Lorentzian IIB Matrix Model", "abstract": "We study a local constrained problem at matrix size $N=5$ in the Lorentzian IIB (IKKT) matrix model and numerically continue a one-dimensional physical modulus. For an exact fixed-$Q_\\rho$ constrained solution family, the stationary identity implies constant classical action; the 23 accepted backgrounds realize this relation to the quoted precision. Across the sampled branch, the spectrum of the Lorentzian extent operator remains common to numerical precision while microscopic noncommutative invariants vary. We evaluate finite-dimensional one-loop fluctuations along this branch. At fixed bosonic background, the fermionic Grassmann integral is exact and gives $\\operatorname{Pf}\\mathcal M_F$; its magnitude is invariant under color-gauge and connected proper-Lorentz transformations and varies along the modulus. The complete boson--ghost--fermion quotient measure defines a Lorentz-representative-independent density one-form rather than a scalar potential. Thus quantum fluctuation data distinguish backgrounds unresolved by the coarse quadratic spectrum. We also apply a framed higher-$L$ SO(5) structural probe. At the reference background, the ordered $3+6$ spectral separation is larger at $L=2,3$ than at $L=1$, and larger still in the canonical large-$L$ limit. This is a frame-defined diagnostic, not an intrinsic observable or a higher-$N$ solution. The Pfaffian and higher-$L$ responses are closely correlated along the sampled branch, which we treat only as descriptive. These results suggest that microscopic noncommutative structure and quantum fluctuations may contain information relevant to dimensional dynamics, without establishing dimensional selection.", "url": "https://arxiv.org/abs/2608.29688", "type": "理论", "summary": "1. 该工作研究洛伦兹型IIB矩阵模型中N=5的受约束非对易模，沿一维物理模延拓一族固定Q_rho背景并计算其单圈涨落响应。\n2. 其卖点在于费米格拉斯曼积分精确给出Pf M_F，且完整玻色-鬼-费米商测度表现为洛伦兹代表无关的密度一形式，从而以量子涨落分辨粗粒二次谱无法区分的背景。\n3. 这提示微观非对易结构与量子涨落可能携带维度动力学信息，但尚不足以确立维度选择，更高L SO(5)探针仅可作为描述性诊断。", "summary_source": "deepseek", "authors": [{"name": "Tetsuyuki Muramatsu"}], "featured_authors": [{"name": "Tetsuyuki Muramatsu"}], "author_count": 1}, {"id": "2608.29816", "category": "hep-th", "title": "BMN Spread Complexity Across Phase Transitions", "abstract": "We investigate the dynamical behavior and spread complexity of quantum states within the mass-deformed BMN matrix model equipped with an emergent $U(1)$ global charge at finite temperature $\\beta^{-1}$ and chemical potential $\\nu$. Focusing on the strong-coupling regime ($\\mu \\gg 1$), we model the dynamics via a charged Thermofield Double (cTFD) state and trace the evolution of spread complexity across three distinct thermodynamic regimes. In the low-temperature gapped phase ($\\beta \\mu \\gg 1$), discrete mass-gap bound states dominate, trapping wavepacket dispersion and producing non-chaotic, oscillatory early-time growth. Conversely, in the high-temperature continuum phase ($\\beta \\mu \\ll 1$), thermal excitations overwhelm the mass gap, driving a transition to a continuous advection field that exhibits maximal chaotic scrambling with a Krylov Lyapunov exponent $\\lambda_K = \\pi / \\beta$ that saturates the universal bound. In the intermediate temperature regime ($\\beta \\mu \\sim 1, \\beta \\nu \\sim 1$), the interplay between mass-gap bound states and the continuous thermal background induces a sub-leading correction to the Lanczos coefficients $b_n \\sim \\frac{\\pi}{\\beta} n + \\gamma \\sqrt{n}$, governing a continuous sub-exponential crossover before full chaotic thermalization. Technical derivations regarding KMS boundary conditions, grand canonical spectral moments, residue analysis, and time-reversal symmetry breaking in Krylov space are detailed in four dedicated appendices.", "url": "https://arxiv.org/abs/2608.29816", "type": "理论", "summary": "1. 该工作以带有涌现U(1)整体荷的质量形变BMN矩阵模型为对象，研究有限温度β^{-1}与化学势ν下强耦合量子态的扩散复杂度，并系统覆盖低温能隙、中间交叉和高温连续三个热力学相。\n2. 其技术卖点在于借助带电热场双重态在Krylov空间中的展开，揭示复杂度从低温束缚态主导的非混沌周期振荡，经中间区对应朗斯余弦系数b_n~(π/β)n+γ√n的亚指数交叉，到高温连续区达到饱和Krylov Lyapunov指数λ_K=π/β的最大混沌扰乱的普适转变。\n3. 这为以扩散复杂度作为量子混沌探测器并研究矩阵模型相结构提供了新工具，且对全息对偶中复杂度与热化、混沌之间的联系具有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Dibakar Roychowdhury"}], "featured_authors": [{"name": "Dibakar Roychowdhury"}], "author_count": 1}, {"id": "2608.29879", "category": "hep-th", "title": "The warp factor of supersymmetric $D=11$ near-horizon geometries: single-point rigidity, the $Spin(7)$ perfect square, and global constraints", "abstract": "On a compact connected section ${\\cal S}$ of a supersymmetric $M$-horizon the Killing-spinor bilinears give a pointwise identity relating the warp factor $\\Delta$, the rotation one-form $h$ and the two spinor norms, with nothing assumed about the norm of the Killing spinor. We derive three consequences of that unreduced identity. First, a single-point rigidity theorem: if $\\Delta$ and $h$ vanish at one point of the section, then the flux vanishes identically, ${\\cal S}$ is Ricci-flat and the horizon is $\\mathbb{R}^{1,1}\\times{\\cal S}$. A single point replaces the usual global spinorial hypothesis. Second, the ${\\rm Spin}(7)$ decomposition of the flux fixes $h$ algebraically and exhibits the invariant flux content of the scalar square $\\Delta=4\\Phi^2$ known in an adapted gauge, $\\Delta=\\frac{1}{108}\\|w_{\\bf 7}\\pm\\sigma({\\cal Y}_{\\bf 7})\\|^2$. Only the two ${\\bf 7}$-summands $w_{\\bf 7}$, ${\\cal Y}_{\\bf 7}$ reach the warp factor, and the square is degenerate rather than definite: it vanishes on the linear subspace $w_{\\bf 7}=\\mp\\sigma({\\cal Y}_{\\bf 7})$ rather than at the origin, so positivity of $\\Delta$ yields no case list. Third, the two combine into a pointwise budget: the single constant of supersymmetry is shared between the deviation from staticity and the ${\\rm Spin}(7)$ mismatch of the flux, each bounded by that constant. The same identities characterise the constancy hypothesis, equivalent to $V=-fh$ for the bilinear one-form $V$, which fails on the static branch of known warped $AdS_2$ solutions; they fix a weighted integral of the warp factor; and they reduce the Komar angular momentum of the horizon to a positive bilinear integral. Two no-go statements, for hidden symmetries built from the Killing spinor and for a second isometry from its bilinears, are stated with their hypotheses.", "url": "https://arxiv.org/abs/2608.29879", "type": "理论", "summary": "1. 该文在D=11超对称近地平线几何的紧致截面上，利用不假设Killing旋量模长的双线性恒等式，导出三点刚性、Spin(7)分解与逐点预算三方面结论。\n2. 核心卖点是单点刚性定理：只要某点处warp因子与旋转一形式消失，通量便恒为零、截面为Ricci平坦且时空化为R^{1,1}×S；Spin(7)分解还代数固定旋转一形式，并给出warp因子平方的简并表达式。\n3. 这建立了超对称常数与偏离静态性及Spin(7)通量失配之间的逐点预算，可用于约束扭曲AdS_2解的静态分支，并为排除由Killing旋量构造的隐藏对称性和第二等距提供依据。", "summary_source": "deepseek", "authors": [{"name": "Usman Kayani"}], "featured_authors": [{"name": "Usman Kayani"}], "author_count": 1}, {"id": "2608.29931", "category": "hep-th", "title": "Carrollian Wave Equations for Arbitrary Spin: Anyons and the Exotic Particle on the Noncommutative Plane", "abstract": "We construct the Carrollian limit of the Cortés--Plyushchay wave equations for planar anyons, grading the spin-tower components by powers of $c$ and taking the limit at fixed rest energy. The result is a linear system describing Carrollian particles of any real spin --- \\emph{Carrollian anyons} --- and, at (half-)integer spin, Carrollian bosons, fermions and higher-spin fields. The system is a first-order square root of the standard Carroll wave equation $(\\partial_t^2+E^2)\\Phi=0$, whose spectrum consists of two flat branches at plus and minus the rest energy. Scaling the spin along with $c$, in the Carrollian analogue of the Jackiw--Nair limit, yields instead the exotic Carroll algebra, with a second central charge, non-commuting boosts, and observable coordinates spanning a noncommutative plane. We show how the Galilean and Carrollian theories branch from one common similarity transformation: the Galilean limit expels the negative-energy modes, whereas the Carroll limit retains both relativistic branches.", "url": "https://arxiv.org/abs/2608.29931", "type": "理论", "summary": "1. 该工作构造了平面任意子Cortés–Plyushchay波动方程的Carroll极限，按c的幂次对自旋塔分量分级，并在固定静止能量下取极限，得到描述任意实自旋Carroll任意子的线性方程组。\n2. 其技术核心是该方程组构成标准Carroll波动方程(∂_t^2+E^2)Φ=0的一阶平方根，谱为±静止能量的两支平坦色散；若自旋随c同步标度，则导出具有第二中心荷、非对易boost及非对易平面的奇异Carroll代数。\n3. 该工作进一步表明Galilean与Carroll理论同源于一个相似变换：Galilean极限剔除负能模式，而Carroll极限保留两支相对论分支，为任意子、高自旋场与非对易空间提供了统一描述框架。", "summary_source": "deepseek", "authors": [{"name": "Mauricio Valenzuela"}], "featured_authors": [{"name": "Mauricio Valenzuela"}], "author_count": 1}, {"id": "2608.30039", "category": "hep-th", "title": "Admissible higher-spin algebras in flat space", "abstract": "We study admissible higher-spin algebras in four-dimensional Minkowski space, namely algebras that admit the tower of massless higher-spin fields as a representation. Under several simplifying assumptions, we show that these can be of two types, which we refer to as collinear and half-collinear. The chiral higher-spin algebra provides an example of the latter. For the collinear ansatz considered here, direct solution of the Jacobi identity yields two families of Lie algebras. We also find an associative collinear algebra, which is commutative unless internal degrees of freedom are added.", "url": "https://arxiv.org/abs/2608.30039", "type": "理论", "summary": "1. 该工作研究了四维闵氏时空中允许无质量高阶自旋场塔表示的容许高阶自旋代数。\n2. 其要点是在共线假设下直接求解雅可比恒等式，得出两族李代数及一个交换结合代数，并将手征代数归入半共线型。\n3. 这为平坦空间高阶自旋理论的代数分类及引入内部自由度时的非交换推广提供了明确约束与构造方向。", "summary_source": "deepseek", "authors": [{"name": "Dmitry Ponomarev"}], "featured_authors": [{"name": "Dmitry Ponomarev"}], "author_count": 1}, {"id": "2608.30160", "category": "hep-th", "title": "From Self-Dual to Physical $\\mathbb{C}P^{N-1}$: Anomalies, Boundary Stokes Phenomenon, and Global Structure of $θ$-vacua", "abstract": "We introduce a two-coupling generalization of $\\mathbb{C}P^{N-1}$ model that continuously interpolates between the self-dual ($\\epsilon=0$) and the physical ($\\epsilon=g$) theories as a useful nonperturbative tool. At $\\epsilon \\neq g$, this model possesses a chiral imbalance, which may be viewed as a real topological deformation (imaginary-$\\theta$). We demonstrate that exact quantum equivalence between first- and second-order formulations strictly requires a topological counterterm sourced by a bosonic chiral anomaly. Solving this deformed theory at large $N$ yields two primary results. First, we analytically determine the nonperturbative vacuum structure of the self-dual theory, a self-dual vacuum with a dynamically generated field-strength condensate. Second, we resolve a fundamental paradox where saddles with $(\\theta + 2\\pi n) \\sim O(N)$ ($n$ is branch number) spuriously yield lower energy densities than the physical ground state. Because the effective action possesses an essential singularity at $F=0$, we show that the Lefschetz thimble analysis must be generalized to include boundary thimbles. A boundary Stokes phenomenon renders the problematic saddles topologically inactive, fully restoring the validity of the large-$N$ expansion for strongly coupled theories.", "url": "https://arxiv.org/abs/2608.30160", "type": "理论", "summary": "1. 该工作提出双耦合推广的CP^{N-1}模型，在自对偶(ε=0)与物理(ε=g)理论间连续插值，并在大N下解析求解其非微扰真空。\n2. 其技术核心是引入手征反常所要求的拓扑抵消项，并将Lefschetz细薄分析推广至边界细薄，证明边界Stokes现象使(θ+2πn)~O(N)的伪鞍点拓扑失活，同时揭示自对偶真空中存在动态场强凝聚。\n3. 这为强耦合大N展开的合法性与θ真空的全局结构提供了非微扰依据，其边界细薄机制有望推广至其他含虚θ形变或有效作用量具本质奇点的理论。", "summary_source": "deepseek", "authors": [{"name": "Yui Hayashi"}, {"name": "Mithat Ünsal"}], "featured_authors": [{"name": "Yui Hayashi"}, {"name": "Mithat Ünsal"}], "author_count": 2}, {"id": "2608.30349", "category": "hep-th", "title": "Generalised Symmetries, Anomalies, and Maximal Branches of 3d Chern-Simons Matter Theories", "abstract": "The generalised symmetries, 't Hooft anomalies, and their interplay with maximal branches are analysed for linear unitary three-dimensional $\\mathcal{N}\\geq 3$ Chern-Simons Matter quiver theories realised in Type IIB brane configurations. The 1-form symmetry, its self-anomaly and its maximal anomaly-free subgroup are determined independently from Wilson-line screening and from the string lattice. Fractional monopole endpoints of the generating Gukov-Witten defect are used to extract the anomaly data, while centre charges of integer monopoles determine the faithful 0-form symmetry group, its connected cover and possible 2-group structures. Mixed anomalies with non-abelian 0-form factors are found to cancel in the linear unitary theories considered. The effect of 1-form gauging on maximal branches is related to frozen D3-brane sectors, which flow to Chern-Simons TQFTs whose anyonic lines obstruct the required defect endpoint. This yields a criterion for affected branches and implies that at most two can be affected simultaneously. In such a case, a magnetic-quiver extension by non-simply laced edges is proposed, wherein the 1-form symmetry and its mixed anomaly with the branch isometry are reproduced.", "url": "https://arxiv.org/abs/2608.30349", "type": "理论", "summary": "1. 该文针对IIB型弦实现的三维N≥3线性幺正Chern-Simons物质quiver理论，系统分析了广义对称性、't Hooft反常及其与极大分支的关联。\n2. 其技术要点是同时利用Wilson线筛选与弦格确定1-form对称性及最大无反常子群，并从分数磁单极端点和整数磁单极中心荷提取反常、0-form对称与2-群结构数据。\n3. 该框架将1-form规范化效应与冻结D3膜扇区及其任意子线阻塞缺陷端点相联系，给出受影响分支至多两个的判据，并启发用非单李型磁quiver扩展复现相应反常。", "summary_source": "deepseek", "authors": [{"name": "Fabio Marino"}, {"name": "Francesca Pretto"}, {"name": "Marcus Sperling"}], "featured_authors": [{"name": "Fabio Marino"}, {"name": "Francesca Pretto"}, {"name": "Marcus Sperling"}], "author_count": 3}, {"id": "2608.30447", "category": "hep-th", "title": "Examples of Gribov copies in the presence of planar boundaries, and an emergent boundary gauge invariance in Yang-Mills theory", "abstract": "First, we explicitly construct zero-modes of the Yang-Mills Faddeev-Popov operator in the presence of two parallel plates, with either perfect electric (PEC) or perfect magnetic (PMC) boundary conditions imposed. This establishes the existence of Gribov copies with finite action, and even finite L_2-norm, in Yang-Mills theory with non-trivial interfaces. We adapt Henyey's construction, although the boundary configuration imposes extra restrictions on the ansatz for the gauge field. Second, we discuss the phenomenon of an emergent boundary gauge invariance for PEC and PMC plates in Yang-Mills theory. This shall be important when applying the Gribov-Zwanziger procedure to parallel plate setups, of relevance for non-perturbatively studying the non-Abelian Casimir effect in the future.", "url": "https://arxiv.org/abs/2608.30447", "type": "理论", "summary": "1. 该工作构造了平行板边界条件下杨-米尔斯Faddeev-Popov算子的零模，证明存在有限作用量乃至有限L2范数的Gribov副本。\n2. 其技术要点是将Henyey构造推广到带PEC或PMC边界的规范场，并揭示边界条件诱导出新的边界定域规范不变性。\n3. 这一边界规范不变性为在平行板体系中应用Gribov-Zwanziger方案、进而非微扰研究非阿贝尔Casimir效应提供了基础。", "summary_source": "deepseek", "authors": [{"name": "David Dudal"}, {"name": "Luigi Rosa"}, {"name": "Sebbe Stouten"}], "featured_authors": [{"name": "David Dudal"}, {"name": "Luigi Rosa"}, {"name": "Sebbe Stouten"}], "author_count": 3}, {"id": "2608.30533", "category": "hep-th", "title": "Brane effective actions and their island rule from $T\\overline T$ flows", "abstract": "We derive a $2d$ effective action for semi-classical AdS$_3$ gravity with an EOW brane of arbitrary tension by solving the radial Hamiltonian flow in a derivative expansion. Interpreting the radial flow as an RG flow, the effective theory is identified with a $T\\bar T$-like deformed CFT. This leads us to propose that the holographic dual for semi-classical AdS$_3$ gravity with Neumann or conformal boundary conditions is obtained by setting the $T\\bar T$-like deformed CFT free. We verify our proposal explicitly for saddles corresponding to $(A)dS_2$ branes in empty AdS$_3$. We discuss three useful ways to decompose the effective brane theory into a matter sector ($T\\bar T$-deformed, $T\\bar T$-like deformed, and undeformed CFT, respectively) and a corresponding braneworld gravity sector. In particular, the split into $T\\bar T$-deformed CFT coupled to $T\\bar T$-like deformed Liouville gravity directly extends the Liouville description of the integrated Weyl anomaly into the bulk. The effective action is then used to perform an island-rule calculation for a non-asymptotic brane in an AdS/bCFT set-up, finding exact agreement with the Ryu-Takayanagi result. This extends previous holographic checks on the island rule to non-asymptotic regimes of application, as well as provides a Wald entropy interpretation for $T\\bar T$ entanglement. Finally, we relate our effective theory and its higher derivative corrections to AdS$_3$ gravity with a fluctuating radial cutoff by explicit calculation of the on-shell action.", "url": "https://arxiv.org/abs/2608.30533", "type": "理论", "summary": "1. 该工作从径向哈密顿流的导数展开出发，推导了含任意张力EOW膜的半经典AdS₃引力的二维有效作用量。\n2. 其要点是将径向流解释为RG流，把有效理论识别为T\\bar T类变形CFT，并指出Neumann或共形边界条件下的全息对偶由该变形CFT实现。\n3. 这为island规则向非渐近区域推广、以及用变径向截断的AdS₃引力理解高阶导数修正提供了可行框架。", "summary_source": "deepseek", "authors": [{"name": "Nele Callebaut"}, {"name": "Matteo Selle"}], "featured_authors": [{"name": "Nele Callebaut"}, {"name": "Matteo Selle"}], "author_count": 2}, {"id": "2608.30723", "category": "hep-th", "title": "A Truncated Majorana", "abstract": "We investigate the quantum field dynamics of truncating a Majorana wave packet via a time-dependent channel shutter. Modeling truncation as a controlled modification of chiral propagation rather than a literal spatial cut, we analyze a $1+1$D massless Majorana field subjected to a time-dependent rotation between its chiral components. We demonstrate that this protocol manifests two complementary physical limits. Globally, a mismatch between early- and late-time channel identifications induces a fermionic Bogoliubov transformation. We prove this asymptotic change universally generates an infrared soft-mode memory, $\\beta(\\omega, \\nu) \\propto (\\omega+\\nu)^{-1}$, leading to a logarithmic divergence in the Hilbert--Schmidt norm. This orthogonality-catastrophe-like obstruction persists even under infinitely smooth switching in the massless limit. Conversely, in the number-conserving regime where pair production vanishes, the shutter acts as a purely causal filter. We establish exact local field identities showing that, restricted to the even local observable algebra, the retained sector is exactly equivalent to a single-particle state while the discarded sector reduces to the vacuum. Ultimately, we show that global infrared memory and local causal truncation are complementary diagnostics of the same dynamical operation. These results provide a rigorous field-theoretic foundation for time-dependent control in topological platforms, cleanly separating effective operational benchmarks from microscopic boundary dynamics.", "url": "https://arxiv.org/abs/2608.30723", "type": "理论", "summary": "1. 该工作通过含时通道快门对1+1维无质量Majorana场的手征分量施加受控旋转，研究了截断Majorana波包的量子场动力学。\n2. 其核心在于证明全局通道失配必然诱导费米型Bogoliubov变换，并产生具有对数发散的Hilbert–Schmidt模的软模式记忆；而在数守恒区，截断退化为纯因果过滤，保留与丢弃扇区分别等价于单粒子态和真空。\n3. 这为拓扑平台中含时控制的场论描述提供了严格基础，并将全局红外记忆与局域因果截断确立为同一动力学操作的互补诊断。", "summary_source": "deepseek", "authors": [{"name": "Ali Vahedi"}], "featured_authors": [{"name": "Ali Vahedi"}], "author_count": 1}, {"id": "2608.30774", "category": "hep-th", "title": "Anomalies and discrete torsion in Type II and Type I worldsheet theories", "abstract": "We provide a comprehensive study of anomalies and discrete torsion in the worldsheet theories of Type II and Type I string theories on a general ten-dimensional target space. In the modern understanding, the anomaly of a worldsheet theory is characterized by an invertible field theory in three dimensions, and invertible field theories are classified by the Anderson dual of a suitable bordism theory. To study the anomaly cancellation condition, we employ the explicit model of the Anderson dual constructed by Yamashita and Yonekura. We find that, for both Type II and Type I string theories, the anomaly of the worldsheet theory is cancelled if and only if the target space is orientable and admits a spin structure. We also determine the discrete torsion and clarify its physical meaning. It includes the distinctions between Type IIA and Type IIB string theories and between ordinary Type I and Sugimoto string theories.", "url": "https://arxiv.org/abs/2608.30774", "type": "理论", "summary": "1. 该工作系统研究了十维一般靶空间上II型与I型弦世界面理论中的反常与离散挠率。\n2. 其核心在于将反常刻画为三维可逆场论，并利用Yamashita-Yonekura构造的Anderson对偶模型证明：反常消解当且仅当靶空间可定向且具有自旋结构。\n3. 所得离散挠率进一步区分了IIA/IIB及普通I型与Sugimoto弦理论，为弦论中反常约束与挠率选择提供了明确的拓扑判据。", "summary_source": "deepseek", "authors": [{"name": "Masashi Kawahira"}, {"name": "Shotaro Kawanago"}, {"name": "Shota Saito"}, {"name": "Hiroki Wada"}], "featured_authors": [{"name": "Masashi Kawahira"}, {"name": "Shotaro Kawanago"}, {"name": "Shota Saito"}, {"name": "Hiroki Wada"}], "author_count": 4}, {"id": "2608.30852", "category": "hep-th", "title": "Holographic subregion complexity in insulator/superconductor transition", "abstract": "We study holographic subregion complexity (HSC) across a fully backreacted insulator/superconductor transition in an AdS-soliton background and compare it with holographic entanglement entropy (HEE) and holographic complexity based on the complexity=volume (CV) proposal. Both HSC and HEE signal the second-order transition. For a strip subsystem, competing connected and disconnected Ryu-Takayanagi surfaces give rise to a confinement/deconfinement transition. At fixed chemical potential in the superconducting phase, HSC exhibits a finite jump at the critical width, whereas HEE remains continuous. Beyond this width, HSC grows linearly with the strip width, while HEE is constant. At fixed strip width, HSC first decreases and then increases with chemical potential for $\\ell<\\ell_c$, opposite to HEE, but increases monotonically for $\\ell>\\ell_c$. After consistent normalization and subtraction of the respective insulating references, the half-space HSC and CV complexity densities are analytically identical. These results show that HSC can diagnose the insulator/superconductor transition, but its qualitative response remains sensitive to the subsystem scale and entanglement-wedge topology.", "url": "https://arxiv.org/abs/2608.30852", "type": "理论", "summary": "1. 该工作在完全反作用的AdS孤子背景下研究绝缘体/超导体相变中的全息子区域复杂度，并与全息纠缠熵和CV复杂度进行系统比较。\n2. 其关键发现是条带子系统复杂度在临界宽度处出现有限跳变而纠缠熵保持连续，大于临界宽度后复杂度线性增长而熵为常数；半空间复杂度密度经归一化并与绝缘体参考相减后与CV复杂度密度解析相同。\n3. 这表明子区域复杂度能诊断该二级相变，但其定性行为受子系统尺度以及纠缠楔拓扑影响，为未来在更高维或非均匀全息模型中检验复杂度预言提供了思路。", "summary_source": "deepseek", "authors": [{"name": "Yu Shi"}, {"name": "Chikun Ding"}, {"name": "Yuebing Zhou"}, {"name": "Weike Deng"}, {"name": "Sheng Long"}], "featured_authors": [{"name": "Yu Shi"}, {"name": "Chikun Ding"}, {"name": "Yuebing Zhou"}, {"name": "Weike Deng"}, {"name": "Sheng Long"}], "author_count": 5}, {"id": "2608.31151", "category": "hep-th", "title": "The large $N$ vector model with angular velocity", "abstract": "We study the free energy of the critical $O(N)$ vector model at large $N$ on $S^{1}\\times S^{2}$ with an angular velocity $\\hat\\mu$ without the singlet constraint. The leading high-temperature behaviour is determined analytically both as an expansion about $\\hat\\mu r=0$ and $\\hat\\mu^{2}r^{2}=1$ where $r$ is the radius of the sphere. We supplement the analytic results with a numerical analysis that agrees with both the analytical expansions in their respective regimes and smoothly interpolates between them. The leading high-temperature contribution to the free energy develops a pole at $\\hat\\mu^{2}r^{2}=1$, in agreement with expectations from the thermal effective field theory. Its residue coincides with that of the massless free theory. Sub-leading terms, however, exhibit non-analytic dependence on the angular velocity and distinguish the critical fixed-point result from the free theory answer. The residue at the pole can also be obtained by placing the $O(N)$ model on the pp-wave geometry. We show that the residue agrees with that obtained from the direct computation.", "url": "https://arxiv.org/abs/2608.31151", "type": "理论", "summary": "1. 该文在无单态约束下研究了带角速度的大 N 临界 O(N) 矢量模型在 S^1×S^2 上的自由能，解析给出高温主项在 μr→0 与 μ²r²→1 两极限的展开，并用数值光滑连接。\n2. 其核心结果是在 μ²r²=1 处高温自由能出现极点，留数与无质量自由理论一致，而次领头项的非解析角速度依赖区分了临界不动点与自由场结果。\n3. 该极点留数也能由 pp 波几何得出，为转动系统中临界涨落与热有效场论的匹配提供了可检验的理论途径。", "summary_source": "deepseek", "authors": [{"name": "Justin R. David"}, {"name": "Srijan Kumar"}], "featured_authors": [{"name": "Justin R. David"}, {"name": "Srijan Kumar"}], "author_count": 2}, {"id": "2608.31152", "category": "hep-th", "title": "Coarse-grained models for loop quantum gravity and their renormalization", "abstract": "We introduce a family of effective theories and use them to define a specific type of coarse-grained models for canonical loop quantum gravity. Each effective theory is characterized by two parameters and it consists mainly of a Hilbert space of coarse states and an effective Hamiltonian operator. The construction of the coarse Hilbert spaces relies on a systematic coarse-graining procedure for spin network states. The effective Hamiltonians are then obtained from an analysis of the interplay between this coarse-graining procedure and the action of various Hamiltonian operators defined in loop quantum gravity. Finally, we provide a prescription for implementing the Hamiltonian non-perturbative renormalization framework for the coarse-grained models, and we explicitly write down the renormalization flow equations. The aim of this work is to build an arena for studying the emergence of the continuum limit and the derivation of phenomenological models in the context of canonical loop quantum gravity.", "url": "https://arxiv.org/abs/2608.31152", "type": "理论", "summary": "1. 该工作针对正则圈量子引力提出一族由两个参数刻画的低能有效理论，并据此构造一类粗粒化模型，其状态空间和动力学分别由粗态希尔伯特空间与有效哈密顿量算符描述。\n2. 方法上的要点是给出自旋网络态的系统性粗粒化程序，并分析其与不同圈量子引力哈密顿量作用之间的相互影响，进而为非微扰哈密顿量重整化框架给出具体实施方案，同时显式导出重整化流方程。\n3. 该工作为在圈量子引力中研究连续极限的涌现、以及从量子几何推导唯象模型，提供了一个可实际操作和进一步发展的理论舞台。", "summary_source": "deepseek", "authors": [{"name": "Mehdi Assanioussi"}, {"name": "Martin Zeiß"}], "featured_authors": [{"name": "Mehdi Assanioussi"}, {"name": "Martin Zeiß"}], "author_count": 2}, {"id": "2608.31172", "category": "hep-th", "title": "Superfluid memory effect", "abstract": "We identify a memory effect produced by phonon scattering in a superfluid: a localized scattering event generates a far-field pressure pulse with vanishing time integral but a nonzero first temporal moment, corresponding to a permanent shift in a prepotential for the far-field velocity. The effect is controlled by the soft factor for phonon emission, including corrections from nonlinear dispersion. In superfluid $^4$He, scattering macroscopic phonon wave packets produces a signal whose estimated magnitude may lie within experimental reach, thereby providing a laboratory analogue of electromagnetic and gravitational memory.", "url": "https://arxiv.org/abs/2608.31172", "type": "理论", "summary": "1. 该工作识别出超流体中局域声子散射事件产生的一种远场记忆效应。\n2. 其核心在于散射产生的远场压力脉冲时间积分为零而一阶时间矩非零，对应远场速度预势的永久移位，且该效应受含非线性色散修正的声子发射软因子控制。\n3. 在超流氦-4中散射宏观声子波包可产生现有实验手段有望探测的信号，为电磁与引力记忆效应提供了可实现的实验室类比。", "summary_source": "deepseek", "authors": [{"name": "Kristan Jensen"}, {"name": "Alfredo Pérez"}, {"name": "Stefan Prohazka"}], "featured_authors": [{"name": "Kristan Jensen"}, {"name": "Alfredo Pérez"}, {"name": "Stefan Prohazka"}], "author_count": 3}, {"id": "2608.28796", "category": "math-ph", "title": "The $\\mathbb{Z}_2$-Index of a Pair of Pure States and the Topology of Interacting 1D Superconductors", "abstract": "We define a relative $\\mathbb{Z}_2$-index $\\mathcal{N}(\\omega_1,\\omega_2)$ for locally-comparable, parity-invariant pure states on a unital $C^*$-algebra. We prove that the index is well-defined, multiplicative, invariant under parity-preserving automorphisms, and locally constant in the norm topology. For the one-dimensional self-dual CAR algebra, we apply this construction to the half-chain automorphism $\\sigma$ and define the many-body Majorana number $\\mathcal{N}\\sigma(\\omega):=\\mathcal{N}(\\omega,\\omega\\circ\\sigma)$ for parity-invariant $\\sigma$-local pure states. In the quasi-free Hilbert--Schmidt regime, this index agrees with the usual single-body Majorana number. We then introduce symmetric local automorphism paths and prove that $\\mathcal{N}_\\sigma$ completely classifies the resulting automorphic-path-components. This automorphic-path equivalence retains the bulk Majorana number but may forget a relative zero-dimensional parity obstruction.", "url": "https://arxiv.org/abs/2608.28796", "type": "理论", "summary": "1. 该工作为局域可比较且宇称不变的纯态对定义了相对Z₂指标，并证明其良定性、乘性及拓扑稳定性。\n2. 将其应用于一维自对偶CAR代数的半链自同构，构造多体马约拉纳数，并在拟自由Hilbert–Schmidt极限下与单粒子马约拉纳数一致。\n3. 该指标完全分类对称局域自同构路径连通分量，为此类等价保留体马约拉纳数但可能忽略零维宇称障碍提供了严格框架。", "summary_source": "deepseek", "authors": [{"name": "Anna Mazhar"}, {"name": "Jacob Shapiro"}], "featured_authors": [{"name": "Anna Mazhar"}, {"name": "Jacob Shapiro"}], "author_count": 2}, {"id": "2608.28917", "category": "math-ph", "title": "Pseudorandomness and Diffraction", "abstract": "Pseudorandom structures are structures that behave like random ones, without necessarily being random themselves. It is a prominent, and evidently very difficult, conjecture that $$ V(n) = \\lambda \\cos \\Big( 2 \\pi \\Big( x_1 + n x_2 + \\frac{n(n-1)}{2} \\alpha \\Big) \\Big) $$ is pseudorandom from a Schrödinger operator perspective in that the Schrödinger operator in $\\ell^2(\\mathbb{Z})$ with potential $V$ displays Anderson localization, that is, pure point spectrum with exponentially decaying eigenfunctions for almost all parameter values --- the same spectral features as those produced by random potentials. We show that $V$ is pseudorandom in terms of its diffraction properties, that is, the associated diffraction measure is purely absolutely continuous for all $\\lambda \\not= 0$, all irrational $\\alpha$, and all $x_1,x_2$ --- which is the case as well for the random case. Our result gives further evidence for the conjecture in the Schrödinger case and it elucidates the apparent dual behavior of Schrödinger spectral measures and diffraction measures.", "url": "https://arxiv.org/abs/2608.28917", "type": "理论", "summary": "1. 该工作研究一类形如 λ cos(2π(x1+n x2+n(n−1)α/2)) 的拟周期势，证明其对任意非零耦合、无理α及任意相位，衍射测度均为纯绝对连续，即具有与随机势相同的衍射伪随机性。\n2. 核心在于不借助随机抽样，而由势的显式二次相位结构直接计算并控制衍射测度，从而严格排除任何原子或奇异连续成分。\n3. 这为同一势在Schrödinger算子中呈现Anderson局域化的公开猜想提供了新证据，并阐明谱测度与衍射测度之间看似相反却互补的对偶行为。", "summary_source": "deepseek", "authors": [{"name": "David Damanik"}, {"name": "Nicolae Strungaru"}], "featured_authors": [{"name": "David Damanik"}, {"name": "Nicolae Strungaru"}], "author_count": 2}, {"id": "2608.29321", "category": "math-ph", "title": "Simulating passive scalar advection in rough Kraichnan flows", "abstract": "We present a systematic Eulerian study of passive scalar advection in rough two-dimensional Kraichnan flows, covering the full range of velocity roughness exponent $h\\in(0,1)$. The advection--diffusion equation is integrated directly using a pseudo-spectral method at resolutions up to $2048^2$ grid points, with a frozen-noise Runge--Kutta scheme consistent with the white-in-time construction of the carrier flow. The simulations recover the duality between advected scalar and advecting flow---the smoother the carrier, the rougher the scalar---together with the predicted scaling laws for the second-order statistics. Once the scaling range is properly identified, the fourth-order flatness anomaly is measured across the whole range of $h$, in agreement with the Lagrangian estimates of Frisch \\textit{et al.} (1999) and with the perturbative predictions of Bernard \\textit{et al.} (1998) and Pumir \\textit{et al.} (1997). Benefiting from the fact that our Eulerian simulations give direct access to the full scalar field, we also examine the probability density functions of scalar increments and the corresponding higher-order statistics, which show systematic departures from Gaussianity and from log-normality, with the strongest deviations manifesting for intermediate values of $h$. A central outcome of this work is a systematic account of how the simulation parameters, in particular the molecular diffusivity, must be adjusted with $h$, providing practical guidelines for reliable simulations; we further show that the residual deviations from the theoretical scaling laws are quantitatively accounted for by the finite spectral representation of the carrier flow. Our analysis also serve as a numerical baseline for simulating more realistic extensions of the Kraichnan model, where the carrier flow is coupled with a Gaussian multiplicative chaos and theoretical developments are limited.", "url": "https://arxiv.org/abs/2608.29321", "type": "理论", "summary": "1. 该工作采用欧拉伪谱方法系统模拟粗糙二维Kraichnan流中的被动标量输运，覆盖完整粗糙度指数h∈(0,1)，分辨率最高达2048²网格，并用冻结噪声Runge-Kutta格式保持白噪声时间结构。\n2. 其核心卖点在于精确恢复标量与载流的平滑–粗糙对偶及二阶标度律，并在全h范围验证四阶平坦度异常与拉格朗日及微扰理论一致，同时展示增量概率密度偏离高斯和对数正态，且中间h偏离最强。\n3. 该结果还定量说明有限谱表示造成的残余偏差，并为耦合高斯乘性混沌等更现实扩展模型提供了可靠的数值模拟基准确立了依据。", "summary_source": "deepseek", "authors": [{"name": "Long Li"}, {"name": "André L.P. Considera"}, {"name": "Simon Thalabard"}], "featured_authors": [{"name": "Long Li"}, {"name": "André L.P. Considera"}, {"name": "Simon Thalabard"}], "author_count": 3}, {"id": "2608.29339", "category": "math-ph", "title": "Sharp Logarithmic Quantum Dynamics for Quasiperiodic Schrödinger Operators", "abstract": "Dynamical localization requires all position moments of a quantum wavepacket to remain bounded in time, but for quasiperiodic Schrödinger operators such bounds are generally not uniform in phase. In the positive Lyapunov exponent regime, the best known phase-uniform estimates instead grow on a logarithmic scale. We prove that both the logarithmic scale and the dependence on the moment order are sharp for a class of one-frequency quasiperiodic Schrödinger operators with even potentials. Our main ingredient is a reflective version of semi-uniformly localized eigenfunctions, adapted to the two localization centers forced by a completely resonant phase, from which we obtain matching logarithmic lower bounds along sequences of times.", "url": "https://arxiv.org/abs/2608.29339", "type": "理论", "summary": "1. 该工作证明一类具偶势的单频准周期薛定谔算子，在正李雅普诺夫指数区中相位一致位置矩的对数增长标度及其矩阶依赖均为最优。\n2. 其核心是引入反射型半均匀局域本征函数，适配完全共振相位所强制的双局域中心，并沿时间序列构造出匹配的对数下界。\n3. 这一结果为相位一致意义下的动力学局域化强度提供了精确基准，并启示共振相位与偶势对称性对量子输运的深层制约。", "summary_source": "deepseek", "authors": [{"name": "Wencai Liu"}, {"name": "Xueyin Wang"}], "featured_authors": [{"name": "Wencai Liu"}, {"name": "Xueyin Wang"}], "author_count": 2}, {"id": "2608.29377", "category": "math-ph", "title": "Simultaneous Reconstructions of (x,t) -Dependent Coefficients and Initial Conditions of Parabolic Equations", "abstract": "This is the first publication, in which an inverse problem of the simultaneous reconstruction of an unknown (x,t) - dependent coefficient and an unknown initial condition in a general linear parabolic equation of the second order is considered. The input data depend on (n+1) variables and are, therefore, formally determined ones. Stability estimates and uniqueness theorem are obtained for this inverse problem. As a by-product, logarithmic stability estimates for initial conditions of parabolic equations and inequalities with time reversed data are obtained for the first time. All known publications about inverse problems for parabolic equations with formally determined input data and unknown coefficients assume that those coefficients depend either only on x or only on t. In addition, the initial condition is assumed to be known, except of two publications cited in the text. The inverse problem of this paper has two potential applications. The first one is in forecasting of public opinions in the framework of the Mean Field Games theory. The second one is in tracking spatiotemporal outbreaks of epidemics.", "url": "https://arxiv.org/abs/2608.29377", "type": "理论", "summary": "1. 该工作研究了二阶线性抛物型方程中同时重构依赖(x,t)的未知系数与未知初始条件的反问题，输入数据为形式确定数据。\n2. 其技术要点在于首次对形式确定数据情形获得唯一性与稳定性估计，并导出含时间反向数据的初始条件对数型稳定性估计。\n3. 该结果可用于平均场博弈框架下的舆情预测及传染病时空暴发追踪，也为相关反问题研究提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Michael V. Klibanov"}], "featured_authors": [{"name": "Michael V. Klibanov"}], "author_count": 1}, {"id": "2608.29524", "category": "math-ph", "title": "Kubo Formulas and Bulk-Edge Correspondence for Curved Boundaries", "abstract": "Strong topological insulators are classified by integer invariants which admit different real-space expressions. Inspired by recent work studying these invariants for spaces with curved boundaries, we revisit the problem of equivalence of the various expressions, including Fredholm index pairings and Kubo formulas involving half-space projections. Using Roe algebras and a variant of KK-theory suitable for non-separable $C^*$-algebras, we prove a general form of bulk-edge correspondence for the index pairing with a general position-space Dirac operator in the presence of arbitrary boundaries. For spaces coarsely equivalent to $\\mathbb{R}^d$, we show that up to multiplicity, these pairings are equal to those obtained with the standard dual Dirac operator, with the multiplicity explicitly given as the topological degree of the symbol function. In addition, we prove a generalized Kubo formula which computes the general index pairing by a real-space formula.", "url": "https://arxiv.org/abs/2608.29524", "type": "理论", "summary": "1. 作者用Roe代数及不可分C*-代数的KK理论变体，证明了任意边界下位置空间Dirac算子指标配对与体边对应的统一形式。\n2. 核心在于对粗等价于R^d的空间，一般指标配对与标准对偶Dirac算子配对至多差一个由符号函数拓扑度给出的重数，并将该配对写成实空间广义Kubo公式。\n3. 这为弯曲边界乃至更一般粗几何空间中的强拓扑不变量提供了严格统一的算子代数途径，或可推广至非欧边界与相互作用体系。", "summary_source": "deepseek", "authors": [{"name": "Aren Martinian"}, {"name": "Tom Stoiber"}], "featured_authors": [{"name": "Aren Martinian"}, {"name": "Tom Stoiber"}], "author_count": 2}, {"id": "2608.29645", "category": "math-ph", "title": "A Morse-Family Integrator for Hamilton--Jacobi Dynamics Across Caustics", "abstract": "We develop a geometric framework for implicit discrete Hamiltonian systems based on discrete Morse families, Lagrangian relations, and discrete analogues of Tulczyjew's triple. The main idea is to regard the Lagrangian submanifold defining the discrete dynamics, rather than an explicit symplectic evolution map, as the fundamental geometric object. This viewpoint naturally accommodates implicit, constrained, and degenerate discrete systems. Within this framework, we formulate a Type--II discrete Hamilton--Jacobi theory in terms of the propagation of Lagrangian submanifolds between consecutive discrete steps. When these submanifolds are locally represented by exact one-forms $dW_k$ and $dW_{k+1}$, the resulting equations provide a discrete Hamilton--Jacobi relation between consecutive generating functions. More generally, when the projection onto configuration space becomes singular and a single-valued generating function ceases to exist, we show that the evolution can be described by the composition of Type--II discrete dynamics with Morse families. This yields a generating family for the propagated Lagrangian submanifold without requiring the dynamics to be represented as a graph. As an application, we consider the propagation of optical wavefronts through fold caustics. A Type--II discrete Hamiltonian yields a symplectic ray integrator, while a Morse family represents the multivalued wavefront near the caustic. Their composition provides a discrete propagation rule for the complete Lagrangian manifold across the singularity. In this way, the same geometric construction simultaneously provides a discrete Hamiltonian integrator and a regular representation of multivalued Hamilton--Jacobi solutions.", "url": "https://arxiv.org/abs/2608.29645", "type": "理论", "summary": "1. 该工作基于离散Morse族、Lagrangian关系与离散Tulczyjew三重结构，提出隐式离散Hamilton系统的几何框架，并用Lagrangian子流形的传播表述Type-II离散Hamilton-Jacobi理论。\n2. 其关键卖点在于不依赖显式辛映射，而在构型空间投影奇异、单值生成函数失效时，以Morse族表示多值波前并与Type-II离散动力学复合，从而跨焦散传播完整的Lagrangian流形。\n3. 该构造同时给出离散辛射线积分器与多值Hamilton-Jacobi解的正则表示，为光学波前穿过折叠焦散以及约束或退化离散系统提供统一的几何数值框架。", "summary_source": "deepseek", "authors": [{"name": "F. Jiménez Alburquerque"}, {"name": "M. Leok"}, {"name": "C. Sardón"}, {"name": "X. Zhao"}], "featured_authors": [{"name": "F. Jiménez Alburquerque"}, {"name": "M. Leok"}, {"name": "C. Sardón"}, {"name": "X. Zhao"}], "author_count": 4}, {"id": "2608.29874", "category": "math-ph", "title": "Homogeneous attractive Bose-Einstein condensates with repulsive three-body interactions: the one-dimensional case", "abstract": "We investigate the behavior of a homogeneous one-dimensional Bose gas composed of $N$ identical bosons experiencing attractive two-body and repulsive three-body interactions. Utilizing intermediate Hartree theory, we rigorously derive the homogeneous cubic-quintic nonlinear Schrödinger functional as the mean-field limit of the many-body Hamiltonian. Particular attention is given to the impact of the repulsive three-body term on ground state energy estimates and mass concentration properties", "url": "https://arxiv.org/abs/2608.29874", "type": "理论", "summary": "1. 该工作严格推导了一维均匀玻色气体在双体吸引与三体排斥作用下的平均场极限。\n2. 其核心在于通过中间Hartree理论得到三次-五次非线性薛定谔泛函，并分析三体项对基态能量与质量集中的影响。\n3. 这为理解排斥三体作用如何稳定一维吸引玻色凝聚体及后续严格多体研究提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Dinh-Thi Nguyen"}], "featured_authors": [{"name": "Dinh-Thi Nguyen"}], "author_count": 1}, {"id": "2608.29875", "category": "math-ph", "title": "Homogeneous attractive Bose-Einstein condensates with repulsive three-body interactions: the two-dimensional case", "abstract": "We consider a homogeneous Bose gas composed of $N$ identical bosons occupying an infinite two-dimensional space. This gas exhibits both an attractive two-body interaction and a repulsive three-body interaction. Via the intermediate Hartree theory, we rigorously derive the homogeneous cubic-quintic nonlinear Schroedinger functional as the mean-field limit of the model. Our investigation focuses on the system's behavior in relation to the two-body interaction.", "url": "https://arxiv.org/abs/2608.29875", "type": "理论", "summary": "1. 该工作针对占据二维无限空间、具有吸引二体相互作用与排斥三体相互作用的均匀玻色气体，在中间Hartree理论框架下严格推导了平均场极限的立方-五次非线性薛定谔泛函。\n2. 其核心卖点在于从微观N体模型出发建立到有效泛函的严格平均场极限，并系统研究体系性质随二体相互作用强度的变化。\n3. 该结果为一个严格可分析的平台，可促进对二维凝聚体中二体吸引与三体排斥竞争、稳定机制及相关现象的后续理论和数值研究。", "summary_source": "deepseek", "authors": [{"name": "Dinh-Thi Nguyen"}], "featured_authors": [{"name": "Dinh-Thi Nguyen"}], "author_count": 1}, {"id": "2608.29876", "category": "math-ph", "title": "Local Density Approximation and Other Limit Regimes for a Homogeneous Bose Gas with Repulsive Three-Body Interactions in Low-Dimensional Space", "abstract": "In the whole space of low spatial dimensions, namely $d \\leq 2$, we study the minimizers of an energy functional with an attractive cubic nonlinearity and a repulsive quintic nonlinearity, which describes a quantum Bose gas with a two-body attraction and a three-body repulsion. We prove the existence of minimizers at fixed effective statistics parameter. In the limit of a large effective statistics parameter of the mass-critical nonlinearity (with respect to the kinetic energy), we derive an effective Thomas-Fermi-like model for the homogeneous Bose gas. We also consider other limit regimes depending on the mass-critical nonlinearity.", "url": "https://arxiv.org/abs/2608.29876", "type": "理论", "summary": "1. 该工作在d≤2低维全空间中研究具吸引三次与排斥五次非线性能量泛函的极小元，刻画具有两体吸引与三体排斥的均匀玻色气体，并在固定有效统计参数下证明极小元存在。\n2. 主要技术贡献是在质量临界非线性相对动能的大有效统计参数极限下导出均匀气体的类Thomas-Fermi局域密度模型，并系统分析其他质量临界极限区域。\n3. 这些结果建立了低维三体排斥主导下量子气体泛函的极限描述，为局域密度近似的严格化及相关极限模型提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Thi Anh Thu Doan"}, {"name": "Dinh-Thi Nguyen"}], "featured_authors": [{"name": "Thi Anh Thu Doan"}, {"name": "Dinh-Thi Nguyen"}], "author_count": 2}, {"id": "2608.29894", "category": "math-ph", "title": "Multiple Nonlinear Waves by (Quantum) Neural Networks: Checking the AI supremacy", "abstract": "To test the potential of so-called quantum physics-informed neural network (QPINN) technology for solving evolutionary partial differential equations, we consider the problem of multiple wave propagation in a weakly nonlinear medium described by the Korteweg-de Vries equation with periodic boundary conditions. Although this problem is solvable analytically, high-genus solutions could represent a rather challenging testbed for numerical methods. Therefore, our idea is to test whether a QPINN is sufficiently mature for application in this context by providing a set of indicators of merit and performing several numerical experiments.", "url": "https://arxiv.org/abs/2608.29894", "type": "理论", "summary": "1. 该工作针对周期边界条件下弱非线性KdV方程的多波传播问题，设计并实施了一套数值实验，以系统检验量子物理信息神经网络(QPINN)作为求解演化偏微分方程工具的实际成熟度。\n2. 其技术卖点在于选取可解析求解的高亏格多波解作为严苛基准，并建立一组量化指标，从精度、收敛性与资源效率等方面比较量子神经网络与传统数值方法的优劣。\n3. 这为评估量子机器学习在非线性演化方程数值求解中的适用边界提供了可靠依据，也启示后续研究应更专注于量子优势可被明确验证的具体问题，而非泛化的“AI优越性”宣称。", "summary_source": "deepseek", "authors": [{"name": "Luigi Martina"}, {"name": "Riccardo Caricato"}, {"name": "Riccardo Della Torre"}], "featured_authors": [{"name": "Luigi Martina"}, {"name": "Riccardo Caricato"}, {"name": "Riccardo Della Torre"}], "author_count": 3}, {"id": "2608.30012", "category": "math-ph", "title": "Uniqueness of universal quantum dimensions", "abstract": "We prove, under some assumptions, the uniqueness of universal quantum dimension formulae. We first show that the quantum dimensions of classical algebras have a specific form that can be represented universally, in Vogel's sense, as the product/ratio of q-dimension factors with arguments $a\\alpha+b\\beta+c\\gamma$ where $c=0, 1, 2$ and $a, b$ are integers. On this basis, we derive simple uniqueness criteria, according to which all known universal quantum dimensions are unique.", "url": "https://arxiv.org/abs/2608.30012", "type": "理论", "summary": "1. 该工作证明了在若干假设下统一量子维度公式的唯一性，并给出经典代数量子维度的普适表示形式。\n2. 其技术关键在于将量子维度写成 Vogel 参数线性组合的 q-维因子乘积与比值，其中常数项取 0、1、2，从而导出简洁的唯一性判据。\n3. 这一结果排除了未知替代公式的存在空间，为量子群不变量与 Vogel 普适性分类提供了更坚实的理论支撑。", "summary_source": "deepseek", "authors": [{"name": "M. Y. Avetisyan"}, {"name": "R. L. Mkrtchyan"}], "featured_authors": [{"name": "M. Y. Avetisyan"}, {"name": "R. L. Mkrtchyan"}], "author_count": 2}, {"id": "2608.31049", "category": "math-ph", "title": "On the equivalence between the Polchinski flow and the Connes-Kreimer approaches to perturbative renormalisation", "abstract": "We prove a correspondence between the Polchinski flow and the Connes-Kreimer approaches to perturbative renormalisation, in the sense that the first yields the same renormalisation as the latter. More precisely, we show that an ansatz based on decorated graphs (Feynman diagrams),with a combinatorial renormalisation procedure solves the Polchinski equation. This result holds for very general Euclidean quantum field theories. We are able to derive from this the form of the renormalised potential which is, to the best of our knowledge, the most general one in the literature. The main ingredients of the proof are multiple morphism properties with respect to the renormalisation, as well as a novel duality formula for forests of decorated graphs.", "url": "https://arxiv.org/abs/2608.31049", "type": "理论", "summary": "1. 该工作证明在微扰重整化中Polchinski流与Connes-Kreimer方案等价，即前者给出的重整化结果与后者一致。\n2. 其核心是构造基于装饰图（费曼图）及组合重整化的ansatz求解Polchinski方程，并利用关于重整化的多重态射性质与森林对偶公式，导出目前文献中最一般的重整化势形式。\n3. 这为一般欧氏量子场论的重整化结构提供了统一代数视角，或可为非微扰及代数量子场论方法的发展提供借鉴。", "summary_source": "deepseek", "authors": [{"name": "Yvain Bruned"}, {"name": "Paul Laubie"}, {"name": "Aurélien Minguella"}], "featured_authors": [{"name": "Yvain Bruned"}, {"name": "Paul Laubie"}, {"name": "Aurélien Minguella"}], "author_count": 3}, {"id": "2608.31080", "category": "math-ph", "title": "Boundary Quantum Knizhnik-Zamolodchikov Equations and Integrability of Quantum Field Theories with Time-Dependent Bulk and Boundary Coupling Strengths", "abstract": "The generalized Bethe ansatz framework formulated in [P. R. Pasnoori, Phys. Rev. B 112, L060409 (2025)] provides a unified framework to find exact solutions to quantum many-body systems with time-dependent coupling strengths with periodic boundary conditions. In this work we extend this framework to the case of open boundary conditions where in addition to the time-dependent interactions in the bulk, the boundary conditions are explicitly time-dependent. We show that for integrable time-dependent bulk coupling strengths, the generalized Bethe ansatz framework provides the time-dependent boundary conditions compatible with integrability and reduces the time-dependent Schrodinger equation to a set of matrix difference equations called the boundary quantum Knizhnik-Zamolodchikov (BqKZ) equations. The solution to the BqKZ equations provides the explicit form of the exact wavefunction. We further show that the RG invariants of the corresponding static model identify with the dynamical invariants in the time-dependent model.", "url": "https://arxiv.org/abs/2608.31080", "type": "理论", "summary": "1. 该工作将广义Bethe ansatz精确求解框架从周期边界推广至开放边界，处理体耦合与边界条件均显式含时的可积量子场论模型。\n2. 其技术卖点在于由体可积性反推含时边界条件，将含时薛定谔方程化为边界量子Knizhnik-Zamolodchikov（BqKZ）矩阵差分方程，并显式构造出精确波函数。\n3. 更有启发性的结果是静态模型的RG不变量与含时模型的动力学不变量一一对应，为研究含时可积系统的量子淬火与边界临界行为提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Parameshwar R. Pasnoori"}], "featured_authors": [{"name": "Parameshwar R. Pasnoori"}], "author_count": 1}, {"id": "2608.31090", "category": "math-ph", "title": "Rotating-wave approximation for spin-boson models with structured fields", "abstract": "We derive state-dependent bounds on the difference between two quantum evolutions generated by unbounded Hamiltonians sharing a common form domain. The main technical tool is a second integration by parts, performed at the level of sesquilinear forms rather than at the operator level, which removes the need for a common invariant operator domain. The resulting estimate involves the norm of the time-integrated difference of the two generators, rather than the integral of its norm, and is therefore sensitive to the averaging effects produced by fast-oscillating terms. As an application we prove a quantitative bound on the rotating-wave approximation for spin-boson models with a structured boson field, described by an arbitrary massive dispersion relation on a general measure space and by a suitable class of form factors. The proof involves a careful analysis of the high-frequency scaling. The bound holds on a dense subspace of states, is fully explicit, and all the constants entering it depend only on the parameters of the model and not on the frequency scale, so that the approximation becomes exact in the limit of large frequency.", "url": "https://arxiv.org/abs/2608.31090", "type": "理论", "summary": "1. 该工作为具有一般质量色散和形状因子的结构场自旋-玻色子模型推导了旋转波近似的定量误差界。\n2. 技术核心是在半双线性型层面实施二次分部积分，避免共同不变算子域，给出对时间积分生成元差而非其范数积分的估计，从而捕捉快速振荡的平均效应。\n3. 所得显式界在稠密子空间上成立且常数不依赖频率标度，并在大频率极限下趋于精确，为旋转波近似的严格有效性提供了统一框架。", "summary_source": "deepseek", "authors": [{"name": "Aitor Balmaseda"}, {"name": "Davide Lonigro"}, {"name": "Juan Manuel Pérez-Pardo"}], "featured_authors": [{"name": "Aitor Balmaseda"}, {"name": "Davide Lonigro"}, {"name": "Juan Manuel Pérez-Pardo"}], "author_count": 3}, {"id": "2608.31104", "category": "math-ph", "title": "The Dunkl two-photon/Schrödinger algebras and their applications", "abstract": "The work introduces the novel Dunkl two-photon and Dunkl-Schrödinger algebras as reflection-extended counterparts of the standard six-dimensional two-photon and Schrödinger algebras. These extensions are realized through the presence of an involutive generator representing a reflection, and they reduce to the undeformed two-photon and Schrödinger algebras in the absence of this additional generator in an appropriate limit. For both algebraic structures, which are shown to be isomorphic, we derive the associated cubic polynomial Casimir invariant. Furthermore, we identify several structurally significant subalgebras and compute their corresponding quadratic Casimir invariants. Representations of the Dunkl two-photon algebra are constructed on the Fock space of the one-dimensional Dunkl harmonic oscillator and subsequently translated into holomorphic realizations within the associated Dunkl-Fock-Bargmann representation. Finally, for the Dunkl-Schrödinger algebra, we present an explicit vector field realization in terms of the Dunkl spatial derivative, while keeping time continuous. When applied to the Casimir invariants of the aforementioned subalgebras, this realization yields a family of six nontrivial Dunkl differential-difference equations in $1+1$ dimensions, including, in particular, a Dunkl version of the well-known heat-Schrödinger equation.", "url": "https://arxiv.org/abs/2608.31104", "type": "理论", "summary": "1. 该工作提出Dunkl双光子代数与Dunkl-Schrödinger代数，作为六维双光子和Schrödinger代数的反射扩展，并在无反射生成元极限下还原为未变形代数。\n2. 其核心在于证明两代数同构，构造三次Casimir不变量及多个结构子代数的二次Casimir不变量，并在Dunkl谐振子Fock空间上给出表示及Dunkl-Fock-Bargmann全纯实现。\n3. 借助保时间连续的Dunkl空间导数矢量场实现，将其作用于子代数Casimir不变量，得到一族六个非平凡Dunkl微分差分方程，其中含Dunkl热-薛定谔方程，为相关可积模型与量子光学推广提供切入点。", "summary_source": "deepseek", "authors": [{"name": "Francisco J. Herranz"}, {"name": "Danilo Latini"}], "featured_authors": [{"name": "Francisco J. Herranz"}, {"name": "Danilo Latini"}], "author_count": 2}, {"id": "2608.31147", "category": "math-ph", "title": "Exactly flat bands beyond the chiral limit in Bistritzer--MacDonald Hamiltonians", "abstract": "The chiral limit of the Bistritzer--MacDonald model for twisted bilayer graphene has exactly flat bands at magic angles. We show that exact flatness can persist beyond the chiral limit with nonchiral tunnelling potentials in the usual symmetry class. We construct a family of nonchiral tunnelling potentials for which the Hamiltonian has at least two zero-energy states at every Bloch momentum and for every real value of the nonchiral coupling. This gives a family of counterexamples to Open Problem~3 of Zworski's survey \\cite{ZworskiSurvey}. Conversely, we prove that every admissible potential with this property belongs to this family, thereby obtaining a complete characterization. By contrast, we show that the standard BM model, namely, BM Hamiltonians with first harmonic tunnelling potentials, does not admit exactly flat bands at the magic angle except possibly at a discrete set of nonchiral coupling strengths, with no finite accumulation point. To prove this, we introduce an explicit invertibility criterion. The criterion requires the projected perturbation to have a nonzero scalar coefficient at some Bloch momentum, obstructing exact flatness for general nonchiral tunnelling. A local Taylor expansion argument verifies the criterion for the standard BM potentials. For the family constructed above, however, the projected perturbation vanishes at every Bloch momentum, so the invertibility criterion fails.", "url": "https://arxiv.org/abs/2608.31147", "type": "理论", "summary": "1. 该工作研究Bistritzer-MacDonald哈密顿量在非手性隧穿势下精确平带的存在性，构造一族非手性隧穿势，使系统对任意实数非手性耦合在每个Bloch动量均拥有至少两个零能态。\n2. 其核心是给出完全分类：满足该性质的可容许势均属此族，并提出显式可逆性判据，证明标准BM模型仅在无有限聚点的离散非手性耦合处可能保持精确平带。\n3. 这为Zworski开放问题提供了反例族，并为非手性隧穿机制下平带物理及关联效应的稳定性研究确立了明确边界。", "summary_source": "deepseek", "authors": [{"name": "Zhen Huang"}, {"name": "Kevin D. Stubbs"}], "featured_authors": [{"name": "Zhen Huang"}, {"name": "Kevin D. Stubbs"}], "author_count": 2}, {"id": "2608.28650", "category": "quant-ph", "title": "Alphabet-Dependent Bounds for Pure Quantum $(r,ρ)$-Locally Recoverable Codes", "abstract": "A quantum $(r,\\rho)$-locally recoverable code ($(r,\\rho)$-qLRC) is a quantum code in which every qudit can be recovered from at most $r+\\rho-1$ other qudits, even after $\\rho-1$ additional erasures inside the recovery set. The bounds currently known for this class, namely the Singleton-like and the GG Singleton-like bounds, are alphabet independent and are therefore loose for small-to-moderate qudit dimensions. In this letter, we derive three alphabet-dependent upper bounds for pure $(r,\\rho)$-qLRCs obtained through the Hermitian CSS construction: a Griesmer-like, a Plotkin-like, and a sphere-packing-like bound. We further establish the asymptotic hierarchy among these bounds and identify the relative-distance regions in which each of them yields the tightest rate constraint.", "url": "https://arxiv.org/abs/2608.28650", "type": "理论", "summary": "1. 该工作针对由Hermitian CSS构造得到的纯量子(r,ρ)-局部可恢复码，推导了三个依赖字母表大小的上界。\n2. 这三个上界分别推广了Griesmer、Plotkin与球填充界，并通过渐近层次比较，标定了各界在相对距离空间中给出最紧码率约束的区域。\n3. 既有Singleton型与GG Singleton型界因与字母表无关而在中小维数下偏松，该结果据此提供更精细的有限维码率上限，并为最优量子局部恢复码的参数设计提供参考。", "summary_source": "deepseek", "authors": [{"name": "Vijay Kumar"}, {"name": "Ramakrishna Bandi"}], "featured_authors": [{"name": "Vijay Kumar"}, {"name": "Ramakrishna Bandi"}], "author_count": 2}, {"id": "2608.28828", "category": "quant-ph", "title": "Representation Learning with Quantum Signal Processing", "abstract": "Representation learning begins when training changes the features that define similarity between data. A frozen-kernel model only reweights a fixed geometry. We establish quantum signal processing (QSP) as a solvable quantum model of the representation-learning regime. At arbitrary depth, we compute the exact mean and variance of its quantum neural tangent kernel, revealing an inp
