aidari"}], "featured_authors": [{"name": "A. D. Alhaidari"}], "author_count": 1}, {"id": "2605.10048", "category": "math-ph", "title": "Generalized i-boson model and boxed BUC plane partitions", "abstract": "This paper is devoted to investigating the relation between the generalized i-boson model and boxed BUC plane partitions. The representation of the generalized i-boson algebra and the actions of the monodromy matrix operators on basis vectors have been studied. We also consider the actions of neutral fermion vertex operators on state vectors in terms of the neutral fermionic Fock space. With the help of the scalar product of the generalized i-boson model, the generating function for boxed BUC plane partitions is derived which can be represented as the products of Schur Q-functions. Moreover, the generating function for BUC plane partitions with the double scaling limit is presented.", "url": "https://arxiv.org/abs/2605.10048", "type": "理论", "summary": "1. 本文建立了广义i-boson模型与带框BUC平面分拆之间的严格对应，导出了其生成函数的显式表达式。\n2. 技术关键在于利用广义i-boson代数的表示和单值矩阵算子的基矢作用，结合中性费米子顶点算子在费米型Fock空间中的实现，将生成函数转化为Schur Q-函数的乘积形式。\n3. 该对应关系为通过可积系统方法研究平面分拆的组合恒等式及双标度极限下的临界行为提供了新途径，暗示了与共形场论的可能联系。", "summary_source": "deepseek", "authors": [{"name": "Shengyu Zhang"}, {"name": "Denghui Li"}, {"name": "Zhaowen Yan"}], "featured_authors": [{"name": "Shengyu Zhang"}, {"name": "Denghui Li"}, {"name": "Zhaowen Yan"}], "author_count": 3}, {"id": "2605.10250", "category": "math-ph", "title": "From Noncommutative Kinematics to \\(U(1)_{\\star}\\) Gauge Theory: A Family of Spectral Triples with Localized Gauge-induced Perturbations", "abstract": "We construct a spectral-triple framework for a noncommutative planar system associated with a fixed nondegenerate irreducible unitary sector of the kinematical symmetry group $G_{\\mathrm{NC}}$, labelled by central parameters $(\\hbar_0,\\vartheta_0, B_0)$ with $\\hbar_0,\\vartheta_0, B_0\\neq 0$ and $\\hbar_0 - \\vartheta_0 B_0\\neq 0$. For the corresponding two-parameter family $(r,s)$ of unitarily equivalent concrete realizations, we construct even spectral triples whose Dirac operators are isospectral and have compact resolvent despite the non-unital and noncompact setting. Passing to the Moyal-side description, a linear Darboux normalization and the Stone-von Neumann theorem identify the represented smooth operator algebra with the effective Moyal-side Frechet *-algebra at $\\vartheta_{\\mathrm{eff}} =\\vartheta_0/(1 -\\vartheta_0 B_0/\\hbar_0)$. For each $\\varrho$, this yields locally compact non-unital base spectral triples over the involutive Moyal algebra $\\mathcal{A}_{\\vartheta_{\\mathrm{eff}},\\varrho}$, with $(r,s)$ as kinematical presentation parameters and $\\varrho$ as an independent star-gauge parameter. To incorporate an external $U(1)_\\star$ gauge field, we replace the linear gauge potentials by smooth cutoff localizations; the resulting bounded self-adjoint perturbations define, for every $R > 0$, locally compact non-unital spectral triples. Finally, as $R\\rightarrow\\infty$, we prove strong resolvent convergence to a self-adjoint limiting operator, the closure of the formal minimally coupled operator. Thus the finite-cutoff spectral triples approximate, at the level of spectral triples, the limiting minimally coupled Dirac operator over a fixed nondegenerate $G_{\\mathrm{NC}}$-background.", "url": "https://arxiv.org/abs/2605.10250", "type": "理论", "summary": "1. 本文从非交换运动学对称群 G_NC 的不可约幺正表示出发，构造了标以中心参数 (ℏ₀,θ₀,B₀) 的平面系统偶谱三元组族，并通过光滑截止规范势实现 U(1)★ 规范场的局域化扰动。\n2. 技术核心在于：等谱 Dirac 算子在非单点非紧致代数上仍具紧预解性；利用线性 Darboux 归一化和 Stone–von Neumann 定理将算子代数等价于有效 Moyal 侧 Fréchet *-代数，并证明有限截止谱三元组在 R→∞时强收敛到形式最小耦合 Dirac 算子的闭包。\n3. 这为非交换几何框架下严格处理规范场耦合问题提供了可构造的谱三元组逼近方案，有望推广至更一般的非交换背景并服务于量子场论或拓扑相研究。", "summary_source": "deepseek", "authors": [{"name": "Md. Rafsanjany Jim"}, {"name": "Tanmoy Kumar Sarkar"}, {"name": "S. Hasibul Hassan Chowdhury"}], "featured_authors": [{"name": "Md. Rafsanjany Jim"}, {"name": "Tanmoy Kumar Sarkar"}, {"name": "S. Hasibul Hassan Chowdhury"}], "author_count": 3}, {"id": "2605.10693", "category": "math-ph", "title": "Local topological order, Haag duality, and reflection positivity", "abstract": "In our previous article [ arXiv:2307.12552 ], we introduced local topological order (LTO) axioms for abstract quantum spin systems which allow one to access topological order via a boundary algebra construction. Using the LTO axioms, we produced a canonical pure state on the quasi-local algebra, which gives a net of von Neumann algebras associated to a poset of cones in $\\mathbb{R}^n$. In this article, motivated by [ arXiv:2509.23734 ], we introduce an axiom for LTOs which ensures Haag duality for cone-like regions using Tomita-Takesaki theory. We prove this axiom is satisfied for all known topologically ordered commuting projector models. We thus get an independent proof of Haag duality for the Levin-Wen string net models originally proved in [ arXiv:2509.23734 ]. We also give a reflection positivity axiom for LTOs, connecting to the recent article [ arXiv:2510.20662 ]. We again prove this axiom is satisfied for all known topologically ordered commuting projector models about some $\\mathbb{Z}/2$-reflection symmetry.", "url": "https://arxiv.org/abs/2605.10693", "type": "理论", "summary": "1. 该工作为抽象量子自旋系统的局域拓扑序引入Haag对偶性公理，并建立反射正性公理。\n2. 关键点在于利用Tomita-Takesaki理论证明所有已知拓扑序交换投影模型满足这些公理，独立验证了Levin-Wen绳网模型的Haag对偶性。\n3. 这为拓扑序的边界代数构造与反射对称性研究提供了公理化框架，并启发后续基于量子信息与算子代数的严格分析。", "summary_source": "deepseek", "authors": [{"name": "Pieter Naaijkens"}, {"name": "David Penneys"}, {"name": "Daniel Wallick"}], "featured_authors": [{"name": "Pieter Naaijkens"}, {"name": "David Penneys"}, {"name": "Daniel Wallick"}], "author_count": 3}, {"id": "2605.10695", "category": "math-ph", "title": "A Simplicial Approach to Higher Geometric Quantization", "abstract": "This paper develops a unified framework for observables in n-plectic geometry, extending the L_infty-algebra of Hamiltonian (n-1)-forms to Hamiltonian forms of all degrees via a degree-shifting Grassmann variable u that encodes submanifold codimension. Interpreting k-form observables as k-dimensional topological defects yields a recursive gluing construction that assembles into a semi-simplicial set sOb_bullet(M), which we prove satisfies the Kan filling property, thereby providing an n-groupoid model for observables. From this semi-simplicial perspective we extract cohomological invariants and construct a recursive inner product leading to a categorified pre-n-Hilbert space. The hierarchical structure of polarizations yields a natural quantization scheme matching the 1-polarization classification of multisymplectic geometry. The resulting framework bridges higher algebraic structures with higher categorical geometry and establishes a systematic foundation for the geometric quantization of extended objects.", "url": "https://arxiv.org/abs/2605.10695", "type": "理论", "summary": "1. 该工作通过引入度移格拉斯曼变量编码子流形余维，将n-辛几何中任意阶哈密顿形式统一为可观测量并解释为拓扑缺陷。\n2. 其核心技术在于递归粘合构造出满足Kan填充性质的半单纯集，由此得到n-群胚模型并提取上同调不变量与递归内积。\n3. 这为扩展物体的几何量子化建立了系统框架，并桥接了高阶代数结构与高阶范畴几何。", "summary_source": "deepseek", "authors": [{"name": "Qian Zhang"}], "featured_authors": [{"name": "Qian Zhang"}], "author_count": 1}, {"id": "2605.10725", "category": "math-ph", "title": "Vacuum and thermal fluctuations of a scalar field with point interactions", "abstract": "We investigate the vacuum and thermal fluctuations of a neutral massless scalar field living in Minkowski spacetime and interacting with a finite number of point-like obstacles, modelled by zero-range potentials. The system is described rigorously in terms of self-adjoint realizations of the Laplacian, under assumptions ensuring the absence of instabilities. Using the relative zeta-function technique, we determine the renormalized connected partition function and derive explicit expressions for the thermodynamic observables, characterizing both their low- and high-temperature behaviours. Furthermore, we derive of a convergent Born series expansion for the Casimir energy, which identifies multiple-scattering processes as the mechanism underlying vacuum forces. The latter decompose into pairwise contributions directed along the lines joining the obstacles, with intensities depending non-locally on the full configuration. We also present some numerical results for identical obstacles, indicating that the Casimir forces are always attractive in this context.", "url": "https://arxiv.org/abs/2605.10725", "type": "理论", "summary": "1. 该工作严格研究了闵可夫斯基时空中与点状障碍物相互作用的无质量标量场的真空与热涨落，采用零程势经自伴拉普拉斯实现无失稳描述。\n2. 利用相对zeta函数技术得到重整化配分函数及可观测量低高温行为，并导出Casimir能量的收敛Born级数展开，揭示多重散射过程为真空力机制。\n3. 该框架为点状缺陷系统中量子涨落诱导力的严格分析提供方法，并启发对非局域构型依赖的成对Casimir力及其热效应的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Davide Fermi"}, {"name": "Marco Gurgoglione"}], "featured_authors": [{"name": "Davide Fermi"}, {"name": "Marco Gurgoglione"}], "author_count": 2}, {"id": "2605.08259", "category": "quant-ph", "title": "Multiplayer parallel repetition without dependency-breaking and anchoring variables: monotonic, concave amplification", "abstract": "We obtain quantitative estimates on the decay of the multiplayer optimal value under parallel repetition. In comparison to a previous work of the author in 2025 (arXiv: 2508.09380 ) which sought to generalize dependency-breaking and anchoring variables from two-player Quantum games, being able to establish quantitative estimates on the decay of the optimal value of a multiplayer game under parallel repetition is of interest to establish under different assumptions. Specifically, independently of the dependency-breaking and anchoring variables that have previously been employed to remove correlations from entangled information shared between Alice and Bob (hence removing dependencies), monotonic concave functions can be used in place of such variables to obtain rates of decay on the optimal value. The game-theoretic setting with two players was first analyzed with monotonic concave functions by Lanzenberger and Maurer. For $q_i , x_i > 0$ $\\forall 1 \\leq i \\leq N$ where $N > 0 $ is the total number of players we adddress an open question raised in their work regarding potential generalizations of two-player monotonic concave functions, through amplification functions of the form $\\Psi_{\\textit{Mult}} \\equiv \\Psi = N - \\underset{1 \\leq i \\leq N}{\\prod} \\mathrm{exp} \\big[ - q_i x_i \\big]$, which in the multiplayer game-theoretic setting have more intricate combinatorial structures.", "url": "https://arxiv.org/abs/2605.08259", "type": "理论", "summary": "1. 该工作建立了多人博弈在并行重复下最优值衰减的定量估计。\n2. 其核心在于避免使用依赖打破与锚定变量，转而采用形如Ψ=N-∏exp[-q_i x_i]的单调凹放大函数，处理多人情形中更复杂的组合结构。\n3. 这为多人量子博弈的并行重复理论提供了新的分析途径，并回应了双人单调凹函数至多人推广的开放问题。", "summary_source": "deepseek", "authors": [{"name": "Pete Rigas"}], "featured_authors": [{"name": "Pete Rigas"}], "author_count": 1}, {"id": "2605.08523", "category": "quant-ph", "title": "Machine-learned, finite temperature Fermi-operator expansions suitable for GPUs and AI-hardware", "abstract": "We present several finite-temperature recursive Fermi-operator expansion schemes based on the second-order spectral projection (SP2) method. Our approach builds on a previous observation that the electronic structure problem, as formulated through a recursive SP2 expansion, can be mapped onto the architecture of a deep neural network. Using this perspective, we generalize SP2 to finite electronic temperatures and construct machine learning models to determine optimized expansion coefficients. These coefficients are trained for a specified chemical potential and electronic temperature and are not available in closed analytical form. However, by employing an appropriate affine rescaling strategy to the Hamiltonian matrix, we eliminate the need to retrain the model during a simulation if the temperature and chemical potential change. Our approach avoids explicit diagonalization and relies solely on highly optimized matrix-matrix multiplication kernels. Compared to state-of-the-art diagonalization, we achieve an order-of-magnitude speedup in the single-particle finite-temperature density matrix calculation for small and moderately sized matrices on modern GPUs and dense matrix multiply units.", "url": "https://arxiv.org/abs/2605.08523", "type": "理论+数值", "summary": "1. 本文基于二阶谱投影方法提出一类有限温度费米子算符递归展开方案，将电子结构问题映射为深度神经网络架构。\n2. 其技术核心在于通过仿射重新缩放策略消除化学势与温度变化时的模型重训练需求，并仅依赖高度优化的矩阵乘法核实现在GPU上相较对角化方法一个数量级的加速。\n3. 该工作为利用专用AI硬件高效处理有限温度量子力学计算开辟了新路径，并启发将递归展开与机器学习深度整合。", "summary_source": "deepseek", "authors": [{"name": "Stanislaw Kowalski"}, {"name": "Christian F. A. Negre"}, {"name": "Anders M. N. Niklasson"}, {"name": "Kipton Barros"}, {"name": "Joshua Finkelstein"}], "featured_authors": [{"name": "Stanislaw Kowalski"}, {"name": "Christian F. A. Negre"}, {"name": "Anders M. N. Niklasson"}, {"name": "Kipton Barros"}, {"name": "Joshua Finkelstein"}], "author_count": 5}, {"id": "2605.08535", "category": "quant-ph", "title": "Microwave Power-to-Frequency Transduction via Injection Pulling of a Self-Sustained Oscillator for Rydberg Superheterodyne Sensing", "abstract": "A Rydberg superheterodyne sensing architecture is demonstrated in which a self-sustained oscillator (SSO) serves as a dynamically perturbed local oscillator (LO) for microwave detection. The SSO is realized by a phase-controlled radio-frequency (RF) feedback loop coupled to a transverse electromagnetic (TEM) cavity containing a Rydberg vapor cell. The system operates near 5.49 GHz using a cesium ladder scheme with an 852 nm probe and 510 nm coupling laser addressing the 6S to 6P to 49D transition, with microwave coupling to the 50P state. Injection of a microwave signal pulls the SSO frequency via nonlinear dynamics, converting input power into a measurable frequency shift read out optically as a Rydberg probe intermediate-frequency (IF) signal. The response follows Adler-type injection-pulling behavior, with continuous IF tuning with input power. A peak responsivity of 35 kHz/dB is observed, with enhanced sensitivity near synchronization. These results demonstrate power-to-frequency transduction using a dynamically perturbed LO combined with Rydberg atomic readout.", "url": "https://arxiv.org/abs/2605.08535", "type": "理论", "summary": "1. 该工作实验演示了一种基于自持振荡器注入牵引的里德伯超外差传感架构，通过动态扰动的本地振荡器实现微波功率到频率的线性转换。\n2. 其核心卖点在于利用Adler型注入牵引动力学，将输入功率连续调谐为光学可读的中频频移，获得35 kHz/dB的峰值响应度和同步附近增强的灵敏度。\n3. 这为发展结合里德伯原子读出与非线性振荡器动力学的无源高灵敏微波功率频率转换技术提供了新方案。", "summary_source": "deepseek", "authors": [{"name": "Darmindra Arumugam"}], "featured_authors": [{"name": "Darmindra Arumugam"}], "author_count": 1}, {"id": "2605.08675", "category": "quant-ph", "title": "Quantum resource reduction for quantum-centric supercomputing via correlated mean-field downfolding framework", "abstract": "We present OBDF-SQD, a hybrid quantum-classical method that combines one-body downfolding~(OBDF) based on one-body Møller--Plesset second-order perturbation theory (OBMP2) with sample-based quantum diagonalization~(SQD) for use in quantum-centric supercomputing~(QCS). In this approach, OBMP2 is executed classically to fold dynamical correlation from external orbitals into a renormalized one-body operator, yielding an effective active-space Hamiltonian that retains the same operator structure as the bare Hamiltonian and therefore requires no additional quantum circuit resources. SQD is then applied to this effective Hamiltonian, where, in this work, the quantum sampling is performed via the Qiskit Aer simulator rather than actual quantum hardware. We benchmark OBDF-SQD on dissociation curves of \\ce{H6} chain, ring, and lattice systems and the \\ce{N2} molecule in the cc-pVDZ basis, comparing against standard methods and active-space SQD (CAS-SQD). We observed that OBDF-SQD consistently improves upon CAS-SQD with the same active space. The simplicity of the one-body downfolding correction also makes the approach straightforwardly extensible to periodic solids within existing quantum embedding frameworks", "url": "https://arxiv.org/abs/2605.08675", "type": "理论+数值", "summary": "1. 该工作提出一种混合量子-经典方法OBDF-SQD，通过经典的一体下折叠将动态关联重正化到有效哈密顿量，从而减少量子资源需求。\n2. 其技术核心在于结合基于一体Møller–Plesset二阶微扰论的OBMP2与样本量子对角化，使有效哈密顿量保持裸哈密顿量算符结构，无需额外量子电路。\n3. 这为将量子嵌入框架扩展到周期固体提供了简洁途径，有望推动量子中心超级计算在强关联体系中的实用化。", "summary_source": "deepseek", "authors": [{"name": "Thien Ngoc Tran"}, {"name": "Lan Nguyen Tran"}], "featured_authors": [{"name": "Thien Ngoc Tran"}, {"name": "Lan Nguyen Tran"}], "author_count": 2}, {"id": "2605.08771", "category": "quant-ph", "title": "To Purify or Not to Purify: Entanglement Purification under Input Fidelity Asymmetry in Quantum Networks", "abstract": "Entanglement purification with two entangled resource pairs is widely employed in the literature on quantum repeater networks to counteract fidelity degradation introduced by noisy quantum memories and entanglement swapping across multiple hops. Standard purification protocols assume both resource pairs carry identical fidelity. In practice, entanglement generation is stochastic, the two resource pairs are heralded at different times, and so the first pair decoheres in memory while the second is being generated. Thus a fidelity asymmetry is a structural feature of any network operating under realistic memory conditions, leading to the question: when is it beneficial to perform purification? We derive a closed-form fidelity asymmetry tolerance delta(F) that governs whether a purification attempt is beneficial. We determine a universal upper bound delta_max of approximately 0.076 beyond which purification is always counterproductive. Our simulations show that with exponential memory decoherence, purification yields benefits in only approximately 14% of purification attempts on two resource pairs in a two-hop repeater chain. We define three network objectives: fidelity only, time only, and a combination of time and fidelity, to deliver end-to-end entanglement. We show that when the application fidelity requirement is achievable through swapping alone, no-purification is the superior policy, with its advantage increasing with the number of hops. When the fidelity requirement cannot be met with swapping alone and purification is necessary, to be effective, it must be conditioned on delta(F) between resource pairs. We introduce DeltaPurify, a policy that conditions purification decisions on local fidelity information, and show it reduces time-to-serve relative to both naive purification and no-purification across several fidelity thresholds and hops of a repeater chain.", "url": "https://arxiv.org/abs/2605.08771", "type": "理论+数值", "summary": "1. 本文分析了量子网络中两对纠缠资源在输入保真度不对称条件下是否应当执行纠缠纯化的问题。\n2. 通过推导保真度不对称容忍度的闭合表达式，发现纯化仅在不对称度小于约0.076时有益，且在双跳中继链中仅约14%的尝试有效。\n3. 提出的DeltaPurify策略依据本地保真度信息条件式决策纯化，相较朴素纯化与不纯化均能降低端到端纠缠分发时间。", "summary_source": "deepseek", "authors": [{"name": "Anoosha Fayyaz"}, {"name": "Prashant Krishnamurthy"}, {"name": "Kaushik Seshadreesan"}, {"name": "Amy Babay"}, {"name": "David Tipper"}], "featured_authors": [{"name": "Anoosha Fayyaz"}, {"name": "Prashant Krishnamurthy"}, {"name": "Kaushik Seshadreesan"}, {"name": "Amy Babay"}, {"name": "David Tipper"}], "author_count": 5}, {"id": "2605.08829", "category": "quant-ph", "title": "Recoverable states on von-Neumann algebras", "abstract": "Let $(\\mathcal{M},\\tau)$ and $(\\mathcal{N},\\tau^{\\prime})$ be tracial von-Neumann algebras and let $\\phi:\\mathcal{M}\\to\\mathcal{N}$ be a strictly completely positive, trace preserving map. Given a positive, invertible $B\\in\\mathcal{M}$ with $\\tau(B)=1$, a state on $\\mathcal{M}$ given by a positive $A\\in L^1(\\mathcal{M}, \\tau)$ is said to be recoverable if $\\mathcal{R}(\\phi(A))=A$ where $\\mathcal{R}$ is the Petz recovery map corresponding to $B$ and $\\phi$. In this paper, we study recoverable states and show how an arbitrary state can be made close to a recoverable state via iterates of $\\mathcal{R}\\circ\\phi$. We show that there exists a completely positive, trace preserving map $\\psi:\\mathcal{M}\\to\\mathcal{M}$ such that $\\psi(A)$ is recoverable for all $A$ and $(\\mathcal{R}\\circ\\phi)^n\\to\\psi$ in norm as operators on $L^p(\\mathcal{M},\\tau)$ for all $1\\,\\textless p\\,\\textless\\infty$, and discuss potential applications to quantum information theory. We also show that this convergence holds strongly in $L^1$. Finally, we prove an interesting decomposition theorem for normal states on $\\mathcal{M}$.", "url": "https://arxiv.org/abs/2605.08829", "type": "理论", "summary": "1. 该工作研究了迹冯诺依曼代数上在Petz恢复映射下可恢复状态的结构，并证明通过迭代复合映射可使任意状态逼近可恢复态。\n2. 关键结果包括：存在完全正迹保持映射ψ使得所有态在ψ下可恢复，且(ℛ∘ϕ)^n在L^p范数下收敛到ψ（1<p<∞），以及正常态的一个分解定理。\n3. 这为量子信息理论中状态恢复过程与熵的动力学提供了数学基础，并启发进一步研究非交换L^p空间上的收敛行为。", "summary_source": "deepseek", "authors": [{"name": "Saptak Bhattacharya"}], "featured_authors": [{"name": "Saptak Bhattacharya"}], "author_count": 1}, {"id": "2605.08923", "category": "quant-ph", "title": "Entanglement increase from local interactions which lead to non-positive local reduced dynamics", "abstract": "Consider a bipartite quantum system S=AB such that each part interacts only with its local environment. Under such circumstances, one expects that the entanglement between parts A and B does not exceed its initial value during the time evolution. In fact, this is the case if the reduced dynamics of the system is given by $\\mathcal{E}_{A}\\otimes \\mathcal{E}_{B}$, where $\\mathcal{E}_{A}$ and $\\mathcal{E}_{B}$ are quantum channels, i.e., completely positive trace-preserving maps. But, the reduced dynamics of the system may be given by a map as $\\Psi_{A}\\otimes \\Psi_{B}$, where $\\Psi_{A}$ and $\\Psi_{B}$ are local non-positive maps. Then, the entanglement between A and B can exceed its initial value, as was shown in the case studied by Jordan et al. [Phys. Rev. A 76, 022102 (2007)]. In this paper, we first explore the general circumstances under which one can find such cases as they found. Next, we introduce another general procedure which leads to local non-positive maps that cause entanglement exceeding.", "url": "https://arxiv.org/abs/2605.08923", "type": "理论", "summary": "1. 该工作系统探讨了二分量子系统仅与各自局部环境相互作用时，其约化动力学由非正局部映射导致纠缠超过初值的一般条件。\n2. 技术关键为给出了两类非完全正局部映射的构造方案，并证明其能引发纠缠增长，突破了完全正映射下的纠缠不增约束。\n3. 此发现揭示了局域非马尔可夫性或非完全正性在开放系统纠缠动力学中的核心作用，为量子信息处理中可控纠缠增强提供了新路径。", "summary_source": "deepseek", "authors": [{"name": "Iman Sargolzahi"}], "featured_authors": [{"name": "Iman Sargolzahi"}], "author_count": 1}, {"id": "2605.08986", "category": "quant-ph", "title": "Impact of the non-canonical approach to the exact solution of the ideal one-dimensional electron gas confined with an anisotropic quantum wire of oscillator-shaped profile", "abstract": "We study an exactly solvable model that can be interpreted as an ideal one-dimensional electron gas confined with an anisotropic quantum wire potential of oscillator-shaped profile. The homogeneous nature of the quantum wire is broken by the introduction of the effective electron mass, which changes with radial distance. We solve the problem described both within the canonical and the non-canonical approach. Analytical expressions of the wavefunctions of the stationary states for both cases in terms of the Laguerre polynomials are obtained, as well as the discrete energy spectrum related to these wavefunctions. Additionally, an exact solution to the angular position part of the position-dependent mass Schrödinger equation within the non-canonical approach leads to the angular-part wavefunctions of the even and odd states expressed through the Gegenbauer polynomials. Possible limit relations and special cases are studied too.", "url": "https://arxiv.org/abs/2605.08986", "type": "理论", "summary": "1. 该工作求解了一个理想一维电子气在各向异性振子形量子线势阱中的精确可解模型，分别采用正则与非正则方法给出了定态波函数（拉盖尔多项式）及离散能谱的解析表达式。\n2. 核心卖点在于引入随径向距离变化的有效电子质量以破坏量子线均匀性，并在非正则途径下将角向部分波函数解析表达为盖根堡多项式，揭示了偶宇称与奇宇称态的完整结构。\n3. 这为处理位置依赖有效质量的低维电子系统提供了精确求解范本，并启发将非正则方法推广至其他形状受限的量子线或类似各向异性约束体系。", "summary_source": "deepseek", "authors": [{"name": "E.I. Jafarov"}, {"name": "S.M. Nagiyev"}, {"name": "J. Van der Jeugt"}], "featured_authors": [{"name": "E.I. Jafarov"}, {"name": "S.M. Nagiyev"}, {"name": "J. Van der Jeugt"}], "author_count": 3}, {"id": "2605.09017", "category": "quant-ph", "title": "Quantum algorithms for path and cycle containment problems", "abstract": "The quantum query complexity of subgraph-containment problems, which ask whether a given subgraph $H$ is present in an input graph $G$, has been the subject of considerable study. However, even for relatively simple subgraphs, such as paths and cycles, a complete understanding of their query complexities remains elusive. In this work, we consider several variants of path- and cycle-containment problems in the adjacency matrix model, where we search for paths or cycles of constant length $k$. We compare the settings where the graphs are directed or undirected, where the goal is to detect or find the existence of a path/cycle, and where the path/cycle we are looking for has length exactly $k$, or at most $k$. We also consider several promise versions of these problems, where we suppose that the input graph has a certain structure. We characterize the relative difficulty of these variants of the path/cycle-containment problems, by relating them to one another using randomized reductions, and grouping them into equivalence classes. When we restrict our attention to path-containment problems, we get a dichotomy result. Some of the path-containment problems can be solved using a linear number of queries, and all the others are equivalent to one another (and additionally to several cycle-containment problems) under randomized reductions, up to constant overhead. For the latter equivalence class, we prove a novel quantum-walk-based algorithm that achieves query complexity $\\widetilde{O}(n^{3/2-\\alpha_k})$, where $\\alpha_k \\in \\Theta(c^{-k})$ and $c = \\sqrt{3+\\sqrt{17}}/2 \\approx 1.33$, beating the previous best upper bound $O(n^{3/2})$ on its query complexity. We also provide a conditional lower bound based on the graph-collision problem, which implies that this equivalence class does not admit linear-query quantum algorithms unless graph collision admits an $O(\\sqrt{n})$ query algorithm.", "url": "https://arxiv.org/abs/2605.09017", "type": "理论+数值", "summary": "1. 该工作系统研究了常数长度路径与环在邻接矩阵模型中的多种变体下的量子查询复杂度，通过随机归约建立了等价类划分并得到二分性结果。\n2. 其核心贡献在于对等价类提出了基于量子行走的新算法，将查询复杂度上界从O(n^{3/2})改进至Õ(n^{3/2−α_k})，其中α_k随k指数衰减且c≈1.33。\n3. 该结果结合图碰撞问题的条件下界表明，该类问题无法实现线性查询复杂度，除非图碰撞获得更优量子算法，为子图包含问题的量子查询本质提供了新约束。", "summary_source": "deepseek", "authors": [{"name": "Arjan Cornelissen"}, {"name": "Amin Shiraz Gilani"}, {"name": "Subhasree Patro"}], "featured_authors": [{"name": "Arjan Cornelissen"}, {"name": "Amin Shiraz Gilani"}, {"name": "Subhasree Patro"}], "author_count": 3}, {"id": "2605.09056", "category": "quant-ph", "title": "Selective Remote Dissipation of an Off-resonant State via Indirect Driving", "abstract": "We show how local periodic driving can be used to control dissipation in a structured environment in a highly selective manner. As a minimal setting, we consider two discrete levels coupled to a one-dimensional tight-binding continuum with a finite bandwidth, where only one level is driven while the other remains undriven. Without driving, both bare energies are placed outside the static continuum band so that neither level decays. We demonstrate that the drive can nevertheless activate a selective remote dissipation channel: the undriven level acquires a finite decay rate, whereas the driven level can remain long-lived. The mechanism is clarified within Floquet theory. Periodic driving generates photon-assisted channels shifted by integer multiples of the drive frequency, effectively creating a ladder of drive-shifted continuum sidebands (Floquet channels). A decay channel for the undriven level opens once its bare energy overlaps an open sideband accessed via drive-enabled pathways; in the tight-binding example, the decay is strongly enhanced near the sideband edge due to the increased density of states. The dominant remote pathway is controlled by Bessel-weighted couplings and can be switched and strongly suppressed by tuning the drive amplitude. We verify these predictions by direct numerical integration of the time-dependent Schrödinger equation. We also formulate a complex-eigenvalue problem for the Floquet Hamiltonian by eliminating the continuum via a Brillouin--Wigner--Feshbach projection, and show that the pole-implied decay rate quantitatively reproduces the time-domain decay envelope.", "url": "https://arxiv.org/abs/2605.09056", "type": "理论+数值", "summary": "1. 本文在紧束缚连续谱模型中展示，仅对其中一个离散能级施加局域周期驱动，即可使未驱动能级获得有限衰减率，而驱动能级保持长寿命。\n2. 其核心机制通过Floquet理论阐明，驱动产生光子辅助边带通道，未驱动能级与边带边缘重叠时激活选择性耗散，且该通道可由Bessel权重耦合的驱动振幅开关控制。\n3. 该工作为利用局域周期驱动精确调控开放量子系统中的远程耗散通道提供了理论框架，并可推广至更复杂结构环境下的耗散工程。", "summary_source": "deepseek", "authors": [{"name": "Hidemasa Yamane"}], "featured_authors": [{"name": "Hidemasa Yamane"}], "author_count": 1}, {"id": "2605.09118", "category": "quant-ph", "title": "Quantum Transfer Learning Shows Improved Robustness in Low-Data Regimes", "abstract": "Transfer learning under limited data is a challenging setting, where models must adapt to new tasks with minimal supervision. Prior work has primarily focused on improving absolute accuracy in transfer learning. However, empirical evidence comparing quantum and classical models in realistic transfer learning settings remains limited, especially in low-data regimes. In this work, we systematically study the robustness of quantum models under reduced training data. We evaluate multiple quantum and classical architectures across diverse transfer tasks and retraining configurations, and quantify robustness using accuracy degradation and relative performance retention (RPR). Our results show that, although classical models often achieve higher peak performance, they exhibit significantly larger degradation when training data is limited. In contrast, quantum models maintain more stable performance across data regimes, indicating improved robustness and data efficiency. These findings provide empirical evidence that quantum models can offer improved robustness in low-resource transfer learning scenarios.", "url": "https://arxiv.org/abs/2605.09118", "type": "理论+数值", "summary": "1. 该工作系统对比了量子与经典模型在低数据迁移学习任务中的性能，并引入准确率退化和相对性能保持率作为鲁棒性量化指标。\n2. 其核心发现是：尽管经典模型峰值准确率更高，但量子模型在不同数据规模下性能保持更稳定，表现出更强的鲁棒性和数据效率。\n3. 这为低资源场景下量子迁移学习的实际部署提供了实证支持，并启发后续研究进一步探索量子模型的泛化优势机理。", "summary_source": "deepseek", "authors": [{"name": "Li-An Lo"}, {"name": "Li-Yi Hsu"}, {"name": "Hsien-Yi Hsieh"}], "featured_authors": [{"name": "Li-An Lo"}, {"name": "Li-Yi Hsu"}, {"name": "Hsien-Yi Hsieh"}], "author_count": 3}, {"id": "2605.09138", "category": "quant-ph", "title": "Enhanced quantum capacity thresholds from symmetry", "abstract": "The quantum capacity captures the value of a quantum channel for transmitting quantum information, establishing the fundamental limits on quantum communication. In spite of its central role in quantum information theory, the quantum capacity of most channels is unknown, with wide gaps between the best upper and lower bounds. Even deciding whether a channel has nonzero capacity -- finding its capacity threshold -- is difficult. In this paper we report significant increases in the capacity thresholds of two prototypical noise models: the depolarizing channel and Pauli channels. In the case of the depolarizing channel, this is the first improvement in 18 years, giving a bigger increase beyond the hashing bound than all previous improvements combined. Our starting point is the representation theoretic framework recently proposed by Bhalerao and Leditzky (2025) to compute coherent information for special permutation invariant states. We generalize their framework to the full symmetric subspace, which allow us to optimize coherent information over rank two states in that space. A representation theoretic calculation shows that exponentially many Kraus operators of the channel annihilate the symmetric space, corresponding to a massive decrease in environment entropy for states on the symmetric space compared to the maximally mixed state. This explains the enhanced coherent information as a manifestation of degeneracy for the resulting codes.", "url": "https://arxiv.org/abs/2605.09138", "type": "理论+数值", "summary": "1. 该工作通过对称性方法，将退极化信道和Pauli信道的量子容量阈值大幅提高，其中退极化信道阈值18年来首次超越哈希界且增幅超过此前所有改进之和。\n2. 技术核心是将表示论框架推广至全对称子空间，优化该子空间内秩二态的相干信息，利用对称子空间上Kraus算符指数级湮灭所导致的环境熵剧降来解释增强机制。\n3. 这揭示了对称性引起的码简并性可有效提升量子容量，为其他噪声模型容量阈值的界定及量子通信极限的探索提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Avantika Agarwal"}, {"name": "Amolak Ratan Kalra"}, {"name": "Sungjai Lee"}, {"name": "Debbie Leung"}, {"name": "Luke Schaeffer"}, {"name": "Pulkit Sinha"}, {"name": "Graeme Smith"}], "featured_authors": [{"name": "Avantika Agarwal"}, {"name": "Amolak Ratan Kalra"}, {"name": "Sungjai Lee"}, {"name": "Luke Schaeffer"}, {"name": "Pulkit Sinha"}, {"name": "Graeme Smith"}], "author_count": 7}, {"id": "2605.09142", "category": "quant-ph", "title": "DART-Q : A Deadline-Driven Framework for Real-Time QLDPC Decoding", "abstract": "Real-time quantum error correction places the classical decoder inside the fault-tolerant control loop under strict timing and memory constraints. For quantum low-density parity-check (QLDPC) codes, practical deployment therefore depends not only on correction performance, but also on timely decoding under deadlines, finite on-chip memory, and time-varying load. However, existing decoder studies primarily emphasize correction performance without exposing operational viability under these constraints. We present DART-Q, a real-time QLDPC decoding framework that treats windowed workloads as discrete arrival, queueing, service, and completion events. DART-Q models each decode request as a deadline-driven online service job with queueing and non-preemptive Earliest Deadline First scheduling. It supports configurable admission control, service times, and bounded rescue policies. Through controlled studies of the SRAM-fit transition, tail latency, overload, and a capacity-scaling extension, DART-Q isolates the effects of memory pressure, rescue selectivity, admission control, and pooled service capacity on timely decoding. Our results show that real-time decoder viability is governed by state organization, overload policy, and service capacity. A cached-summary state organization lowers the SRAM-fit boundary by 4x relative to an edge-centric baseline. Under overload, relaxing the backlog cap increases queued work by approximately 20.1x and worsens p99 latency by approximately 17.6x, with little gain in useful throughput. In contrast, doubling decoder capacity reduces the MissRate from 97.64% to 0.98% and improves p99 latency from 3.861ms to 10$\\mu$s. These results position DART-Q as a framework for exposing the regime changes that determine real-time QLDPC decoder viability under deadlines, finite memory, and time-varying load.", "url": "https://arxiv.org/abs/2605.09142", "type": "理论", "summary": "1. 该工作提出DART-Q框架，将实时QLDPC解码中的窗口化负载建模为截止时间驱动的排队与服务事件，用于评估时序、存储与负载变化下的解码可行性。\n2. 其核心卖点在于通过可控实验隔离了状态组织、过载策略与服务容量对实时解码的影响，发现缓存摘要状态组织可将SRAM适配边界降低4倍，而加倍解码器容量使MissRate从97.64%降至0.98%。\n3. 这为在有限内存与时变负载条件下设计符合实时约束的量子纠错解码器提供了量化分析与制度切换的洞察框架。", "summary_source": "deepseek", "authors": [{"name": "Ameya S. Bhave"}, {"name": "Navnil Choudhury"}, {"name": "Kanad Basu"}], "featured_authors": [{"name": "Ameya S. Bhave"}, {"name": "Navnil Choudhury"}, {"name": "Kanad Basu"}], "author_count": 3}, {"id": "2605.09226", "category": "quant-ph", "title": "Quantum Injection Pathways for Implicit Graph Neural Networks", "abstract": "Deep Equilibrium Models (DEQs) replace a stack of explicit layers with a single operator whose fixed point defines the output, giving the expressive power of an arbitrarily deep network at the memory cost of a single layer. Quantum Deep Equilibrium Models (QDEQs) bring this idea to quantum machine learning, offering an alternative to Parameterized Quantum Circuits (PQCs), whose depth is limited by hardware coherence and trainability. Here, we introduce, formulate, and compare three ways of coupling a quantum signal to graph DEQs, differing in where the signal enters the fixed-point operator. \\textit{Independent} injection computes the quantum signal once per graph and forward fixed-point solve, and holds it fixed throughout the solve. \\textit{State-dependent} injection instead recomputes the signal at every solver step and applies it to the current iterate. \\textit{Backbone-dependent} injection likewise recomputes at every iteration but applies the signal to the classical backbone's output evaluated at the current iterate. We establish contraction guarantees for each variant under explicit assumptions on the Lipschitz constants of the classical backbone and the quantum signal. On the TU Dortmund graph-classification benchmarks NCI1, PROTEINS, and MUTAG, independent injection achieves the best test accuracy while using fewer forward-solver iterations than both the classical equilibrium baseline and the two dependent variants.", "url": "https://arxiv.org/abs/2605.09226", "type": "理论+数值", "summary": "1. 该工作引入了三种量子信号注入图深度平衡模型的耦合方式，并分析其固定点收缩性与收敛性。\n2. 核心在于独立注入通过单次量子信号预计算与固定，在经典骨干与量子信号Lipschitz假设下确保收敛，并在图分类基准上优于依赖型注入。\n3. 这为隐性量子模型中信号的轻量化耦合提供了可行路径，启发结合经典与量子资源的可伸缩图学习方案。", "summary_source": "deepseek", "authors": [{"name": "Pengyuan Xu"}, {"name": "Tristan Zaborniak"}, {"name": "Luis F. Rivera"}, {"name": "Hausi A. Müller"}], "featured_authors": [{"name": "Pengyuan Xu"}, {"name": "Tristan Zaborniak"}, {"name": "Luis F. Rivera"}, {"name": "Hausi A. Müller"}], "author_count": 4}, {"id": "2605.09385", "category": "quant-ph", "title": "Truncating loopy tensor networks by zero-mode gauge fixing: the $Z_2$ lattice gauge theory at finite temperature", "abstract": "Loopy tensor networks exhibit internal correlations that often render their compression inefficient. We show that even local bond optimization can more effectively exploit locally available information about relevant loop correlations. By cutting a bond, we define a set of states whose linear dependence can be identified through a zero mode of the states' metric tensor and used to truncate the bond dimension. In the absence of an exact zero mode, a linear combination of a small number of the lowest modes can instead be optimized to provide the optimal approximation to a zero mode. The truncation does not require prior gauge fixing. The method is applied to the two-dimensional finite-temperature $Z_2$ lattice gauge theory, whose thermal-state purification is represented by an infinite projected entangled-pair state (iPEPS).", "url": "https://arxiv.org/abs/2605.09385", "type": "理论+数值", "summary": "1. 该工作提出通过零模式规范固定截断环状张量网络键维数的方法，并用于二维有限温度Z₂格点规范理论的iPEPS热态纯化。\n2. 技术要点在于利用切断键后态度量张量的零模式识别线性相关态以降低键维数，无需预先规范固定，无精确零模式时通过优化少量最低模式近似。\n3. 这为处理环状张量网络中关联导致的压缩低效问题提供了新途径，可推广至其他含环状结构的张量网络模拟。", "summary_source": "deepseek", "authors": [{"name": "Jacek Dziarmaga"}], "featured_authors": [{"name": "Jacek Dziarmaga"}], "author_count": 1}, {"id": "2605.09558", "category": "quant-ph", "title": "Classical Limit: Dissipation of Spekkens' Generalised Contextuality under Decoherence", "abstract": "Contextuality is considered as one of the most distinctive features of nonclassical systems. Here we show that a Spekkens contextual system (nonclassical) under decoherence becomes noncontextual (classical) after a certain threshold. We show also that some quasiprobability representations are more effective than others in showing nonclassical features. This will help us understand the relationship between decoherence, Spekkens' generalised contextuality, and quantum advantage from universality for quantum computation.", "url": "https://arxiv.org/abs/2605.09558", "type": "理论", "summary": "1. 该工作研究退相干下Spekkens广义语境性从非经典到经典的耗散过程，并比较不同准概率表示探测非经典特征的有效性。\n2. 其卖点在于揭示退相干强度存在阈值使系统从语境性过渡到非语境性，且某些准概率表示能更高效保留非经典特征。\n3. 这为理解退相干、广义语境性与量子计算通用性导致的量子优势之间的内在关联提供了定量框架。", "summary_source": "deepseek", "authors": [{"name": "Enrico Bozzetto"}, {"name": "Jonte R. Hance"}], "featured_authors": [{"name": "Enrico Bozzetto"}, {"name": "Jonte R. Hance"}], "author_count": 2}, {"id": "2605.09580", "category": "quant-ph", "title": "Estimating The Energy Consumption of Quantum Computing from A Full System Aspect", "abstract": "Quantum computing promises disruptive capabilities, yet its energy footprint has received far less attention than its asymptotic speedups. We present a first-order, full-system energy model for quantum computing in an high performance computing (HPC) context. The model separates costs common to NISQ and FTQC, such as system maintenance and classical processing, from regime-specific ones such as error mitigation for NISQ and error correction for FTQC. We instantiate the model on 96- and 100-qubit Heisenberg time-evolution simulations on IBM Eagle r3 and a representative VQE workload, and sketch the FTQC energy pipeline. We find that NISQ energy is dominated by the QEM sampling multiplier, while FTQC cost shifts to physical-qubit overhead set by the code distance and magic states. Our model provides actionable insights into the energy consumption of both NISQ and FTQC workloads, and paves the way toward energy-efficient quantum advantage.", "url": "https://arxiv.org/abs/2605.09580", "type": "理论+数值", "summary": "1. 该工作从全系统角度构建了量子计算能耗的一阶解析模型，区分NISQ与FTQC体制下的共性及特定耗能环节。\n2. 模型揭示NISQ能耗由量子误差缓解的采样倍增因子主导，而FTQC能耗则转向由码距与魔态决定的物理量子比特开销主导。\n3. 这为量化评估NISQ与FTQC工作负载的能耗提供了可操作框架，并指引了实现能效量子优势的优化方向。", "summary_source": "deepseek", "authors": [{"name": "Siyuan Niu"}, {"name": "Di Wu"}, {"name": "Ozgur Ozan Kilic"}, {"name": "Kwanming Yu"}], "featured_authors": [{"name": "Siyuan Niu"}, {"name": "Di Wu"}, {"name": "Ozgur Ozan Kilic"}, {"name": "Kwanming Yu"}], "author_count": 4}, {"id": "2605.09671", "category": "quant-ph", "title": "Optimal Approximation of Single Qubit Rotations within a Quantum Circuit", "abstract": "Fault-tolerant quantum computing typically requires the transpilation of arbitrary quantum circuits into a finite, universal gate set, such as Clifford+T. As a baseline, Diagonal approximation can be used for synthesizing single-qubit Pauli rotations, yielding an approximating sequence with $T$-count that equals $3 \\log_2(1/\\epsilon)$ for a target precision $\\epsilon$. Magnitude Approximation can reduce the $T$-count to only $1 \\log_2(1/\\epsilon)$ by allowing large residual errors, which are rotations about orthogonal axes. Within a complete quantum circuit, these residual errors can then be absorbed into neighboring gates before they are approximated themselves. Determining the optimal allocation of approximation strategies within a large, multi-qubit circuit presents a significant combinatorial challenge. In this work, we present a linear-time algorithm that guarantees an optimal solution to this problem. We demonstrate that the issue of delegating Magnitude versus Diagonal approximation across a circuit maps formally to a classical 1D Ising model with a spatially varying field. By minimizing the energy of this Hamiltonian, we identify the optimal approximation configuration for each rotation without exponential overhead. Benchmarking our method against standard diagonal approximation on random quantum circuits, we observe an average reduction of 26\\% in the total approximating circuit gate count, offering a significant efficiency gain for the implementation of quantum algorithms on near-term and fault-tolerant architectures.", "url": "https://arxiv.org/abs/2605.09671", "type": "理论+数值", "summary": "1. 该工作提出一种线性时间算法，用于在量子电路中为单比特旋转门在幅度近似与对角线近似之间做出最优分配。\n2. 其技术核心是将该分配问题形式映射为一维伊辛模型，通过最小化含空间变化场的哈密顿量能量，无需指数开销即确定最优近似策略。\n3. 这为容错量子计算中的电路编译提供了门数平均降低26%的显著效率提升，有望直接优化近中期量子算法的实现代价。", "summary_source": "deepseek", "authors": [{"name": "Gilad Kishony"}, {"name": "Avi Elazari"}, {"name": "Ron Cohen"}, {"name": "Lior Gazit"}], "featured_authors": [{"name": "Gilad Kishony"}, {"name": "Avi Elazari"}, {"name": "Ron Cohen"}, {"name": "Lior Gazit"}], "author_count": 4}, {"id": "2605.09710", "category": "quant-ph", "title": "Local state antimarking : Nonlocality without entanglement", "abstract": "A set of quantum states is said to be antidistinguishable if, upon being given a randomly chosen state, it is possible to identify a state that the system was definitively not prepared in. In this work, we begin with a study of quantum nonlocality within the framework of local state antidistinguishability (LSAD), and find that any ensemble of mutually orthogonal multipartite pure states is locally antidistinguishable. We then extend this paradigm by introducing the task of local state antimarking (LSAM), where a non-repetitive sequence from a known set of multipartite states is randomly selected and distributed to spatially separated parties who must identify at least one sequence that was not supplied using LOCC only. We present an ensemble of product states that is not globally antidistinguishable, but choosing states from it, without replacement, produces such sequences of states which are globally antidistinguishable but not locally-revealing a form of nonlocality without entanglement. Finally, we compare LSAD and LSAM with conclusive local state discrimination and conclusive local state marking. We demonstrate that no strict hierarchy exists between these paradigms: there exist product-state ensembles that permit one task while strictly forbidding the other, and vice versa.", "url": "https://arxiv.org/abs/2605.09710", "type": "理论", "summary": "1. 该工作引入局部状态反标记（LSAM）任务，发现无放回采样的乘积态序列具有全局反区分性但局部不可实现，从而揭示一类无纠缠的非局域性。\n2. 其卖点在于构造了全局可反区分而局部不能反标记的乘积态系综，证明非局域性可以不依赖于纠缠而源于序列统计特性。\n3. 这为量子非局域性分类提供了新范式，并表明LSAM与局域区分、标记任务间不存在严格层次关系，启发后续实验检验与资源理论构建。", "summary_source": "deepseek", "authors": [{"name": "Biswadeep Chatterjee"}, {"name": "Tathagata Gupta"}, {"name": "Pratik Ghosal"}, {"name": "Samrat Sen"}], "featured_authors": [{"name": "Biswadeep Chatterjee"}, {"name": "Tathagata Gupta"}, {"name": "Pratik Ghosal"}, {"name": "Samrat Sen"}], "author_count": 4}, {"id": "2605.09819", "category": "quant-ph", "title": "Perfect state transfer in quantum photonic networks based on Fourier modes", "abstract": "We propose a quantum network consisting of optical waveguides in the linear regime for quantum state transfer. The circular topology of our network introduces novel functionalities that enable us to analytically identify the conditions under which perfect state transfer (PST) is achievable. We utilize the properties of the Fourier modes, in particular the zero Fourier modes, which provide a protected subspace for the efficient propagation of quantum states, resulting in PST to the diametrically opposite site in a network with any number of sites $N = 4n$. The coupling profiles in the photonic network modulate the number of zero-energy eigenmodes, with uniform couplings yielding more than evanescent ones, confirming that the expedition of observed PST originates from the collapse of the eigenvalue spectrum into three distinct eigenvalue blocks, including $N/2$ manifolds of zero Fourier modes. We investigate PST in both discrete- and continuous-variable input regimes, using single photon state, Schrödinger cat states, and two-mode squeezed vacuum state. Our findings apply to the engineering of quantum networks and photonic lattices, paving the way for applications in controlled routing in integrated quantum circuits.", "url": "https://arxiv.org/abs/2605.09819", "type": "理论", "summary": "1. 该工作提出基于线性光波导与圆形拓扑的量子网络，利用傅里叶模特性解析实现完美态传输。\n2. 其核心在于零傅里叶模提供的保护子空间令本征谱塌缩为三个块（含N/2个零模），均匀耦合下实现任意4n节点网络至对径点的完美传输。\n3. 该方案适用于离散与连续变量输入，为集成量子电路中可控光子路由与量子网络工程提供了明确设计路径。", "summary_source": "deepseek", "authors": [{"name": "Sunita Meena"}, {"name": "Sugar Singh Meena"}, {"name": "Paulo A Brandão"}, {"name": "Amit Rai"}], "featured_authors": [{"name": "Sunita Meena"}, {"name": "Sugar Singh Meena"}, {"name": "Paulo A Brandão"}, {"name": "Amit Rai"}], "author_count": 4}, {"id": "2605.09872", "category": "quant-ph", "title": "Multi-Prover Interactive Proof Systems with Leakage", "abstract": "It is known that there exist multi-prover interactive protocols ($\\mathsf{MIP}$ protocols) for the complexity class $\\mathsf{NEXP}$, succinct $\\mathsf{MIP}$ protocols for $\\mathsf{NP}$ and multi-prover interactive protocols with shared entanglement ($\\mathsf{MIP}^\\ast$ protocols) for $\\mathsf{RE}$. This extraordinary power of multi-prover interactive proof systems comes from the assumption that provers do not communicate with each other during the protocols. If they are allowed to communicate freely, the setting is the same as in the single-prover case, and the computational power of the system becomes significantly weaker. In this paper, we investigate for the first time the setting where communication (i.e., leakage of information) between provers is allowed but bounded. We introduce two techniques to approach this question and show that multi-prover interactive proof systems are robust against some amount of leakage. Our first technique is based on parallel repetition theorems. We apply it to show that for any polynomial $p$, we can construct two-prover one-round $\\mathsf{MIP}$ and $\\mathsf{MIP}^\\ast$ protocols for $\\mathsf{NEXP}$ and $\\mathsf{RE}$, respectively, that are robust against $p(n)$ bits of leakage. We further derive our second technique to convert any low-soundness PCP construction to a two-prover one-round $\\mathsf{MIP}$ protocol for $\\mathsf{NP}$ robust against leakage. We also discuss the relation between robustness against leakage in multi-prover interactive proof systems and the Sliding Scale Conjecture in the PCP literature.", "url": "https://arxiv.org/abs/2605.09872", "type": "理论", "summary": "1. 该工作首次研究了证明者之间存在有限通信（信息泄露）条件下的多证明者交互证明系统。\n2. 其技术核心是利用平行重复定理与低噪音PCP转换方法，分别构建了抗多项式比特泄露的两证明者一轮MIP与MIP*协议。\n3. 这揭示了抗泄露鲁棒性与PCP滑尺猜想之间的深刻联系，为理解交互证明系统的安全边界提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Vahid R. Asadi"}, {"name": "Atsuya Hasegawa"}, {"name": "François Le Gall"}], "featured_authors": [{"name": "Vahid R. Asadi"}, {"name": "Atsuya Hasegawa"}, {"name": "François Le Gall"}], "author_count": 3}, {"id": "2605.09878", "category": "quant-ph", "title": "Clifford Ergotropy", "abstract": "We discuss the interplay between thermodynamics and magic resources in closed quantum dynamics by introducing Clifford ergotropy, the amount of extractable energy under the restriction to Clifford operations. We provide universal upper bounds on Clifford ergotropy, which decrease with increasing magic as quantified by the infinite-order filtered stabilizer Rényi entropy. We demonstrate the utility of this bound for one- and two-qubit systems, with the latter exhibiting a notable transition in the control landscape of Clifford ergotropy. Finally, we show that our analysis has nontrivial consequences even for many-body systems, including a form of the second law of thermodynamics under Clifford operations for typical quantum states.", "url": "https://arxiv.org/abs/2605.09878", "type": "理论", "summary": "1. 该工作引入Clifford ergotropy概念，刻画封闭量子系统中在Clifford操作限制下的可提取能量，并揭示其与量子魔法资源的定量关联。\n2. 主要技术贡献是给出Clifford ergotropy的普适上界，该上界随无限阶滤波稳定子Rényi熵单调递减，并在两量子比特系统中展示了控制景观的显著转变。\n3. 该分析对多体系统具有非平凡含义，导出了典型量子态在Clifford操作下热力学第二定律的一种新形式，为量子热力学和量子信息交叉领域提供了资源论启示。", "summary_source": "deepseek", "authors": [{"name": "Somnath Maity"}, {"name": "Ryusuke Hamazaki"}], "featured_authors": [{"name": "Somnath Maity"}, {"name": "Ryusuke Hamazaki"}], "author_count": 2}, {"id": "2605.09909", "category": "quant-ph", "title": "Symmetry-Protected Basin Localization in Variational Quantum Eigensolvers", "abstract": "Variational quantum eigensolvers fail before optimization begins when strong correlation splits the molecular energy landscape into competing basins and the initial state selects a non-ground-state basin. We introduce a geometry-conditioned preconditioner $\\mathcal{P}_{\\mathrm{eq}}:\\mathbf{R}\\mapsto\\boldsymbol{\\theta}_0$ constrained by the $SE(3)$ covariance of the molecular Hamiltonian, so that nuclear geometry is mapped directly into circuit parameters in the correlated ground-state basin. This basin localization changes the relevant gradient statistics from concentration controlled to curvature controlled. In statevector benchmarks on six stretched molecules, $\\mathcal{P}_{\\mathrm{eq}}$ reduces Hartree--Fock initialization errors by factors of $38\\times$--$6250\\times$, reaches sub-mHa initialization in CO, LiH, and H$_8$, and places N$_2$, H$_2$O, and BeH$_2$ in the mHa-scale correlated basin. In disordered H$_{10}$ chains, equivariant basin targeting and stochastic escape reach unit success probability at fixed optimization budget. The procedure performs basin selection before the shot-limited quantum loop; the quantum circuit then refines correlation inside the selected basin.", "url": "https://arxiv.org/abs/2605.09909", "type": "理论+数值", "summary": "1. 该工作针对变分量子本征求解器在强相关分子中因能量景观分裂为竞争盆地而导致的初始化失败，引入一个受分子哈密顿量SE(3)协变性约束的几何条件预处理器，将核几何直接映射到相关基态盆地参数。\n2. 该预处理实现盆地局域化，使梯度统计从浓度控制转变为曲率控制，在六个拉伸分子态矢量基准中降低Hartree-Fock初始化误差38至6250倍，在CO、LiH、H₈中达亚mHa，在无序H₁₀链中结合随机逃逸达单位成功概率。\n3. 该工作展示了量子优化前利用对称性约束进行可靠盆地选择的策略，为变分量子算法在强关联体系中的实用化提供了关键启发，有望降低量子资源开销。", "summary_source": "deepseek", "authors": [{"name": "Yangshuai Wang"}], "featured_authors": [{"name": "Yangshuai Wang"}], "author_count": 1}, {"id": "2605.09957", "category": "quant-ph", "title": "On Scalable Pseudorandom Unitaries and the Unitary Synthesis Problem", "abstract": "We consider the task of constructing pseudorandom unitaries (PRUs) with scalable security, i.e. families in which the security parameter may vary independently of the dimension (or input bit-length). It is not known whether scalable PRUs can be constructed. In this work we show that if scalable PRUs can be constructed via the prevailing paradigm for analyzing PRUs, then there would be a positive solution to the Aaronson-Kuperberg unitary synthesis problem, a longstanding question in quantum complexity theory about whether implementing arbitrary unitaries can be efficiently reduced to computing a Boolean function. Specifically, we formalize the notion of ROM-PRUs, which are statistically secure PRUs in the random oracle model (ROM). All prior known constructions of cryptographically secure PRUs are based on a ROM-PRU construction. We prove novel connections between ROM-PRUs, approximate unitary designs, epsilon-nets over the unitary group, and the unitary synthesis problem. In particular, we prove that any unitary synthesis algorithm (and thus any ROM-PRU) must use a classical oracle with input length (2 - o(1)) log d bits, where d is the dimension of the unitary to be implemented. This bound rules out all existing candidates for scalable PRUs in the literature. Together, these connections indicate that ROM-PRUs provide a fruitful idealized model for studying pseudorandom unitaries.", "url": "https://arxiv.org/abs/2605.09957", "type": "理论+数值", "summary": "1. 该工作研究可扩展伪随机幺正的构造，揭示其与Aaronson-Kuperberg幺正合成问题的等价性。\n2. 关键卖点是形式化随机预言机模型下的伪随机幺正，并证明任何幺正合成算法需经典预言机输入长度(2-o(1))log d比特，排除了现有候选。\n3. 这为伪随机幺正与幺正合成问题的深层关联提供了理想化模型，启发了量子密码与复杂度理论的交叉研究。", "summary_source": "deepseek", "authors": [{"name": "Zvika Brakerski"}, {"name": "Henry Yuen"}], "featured_authors": [{"name": "Zvika Brakerski"}, {"name": "Henry Yuen"}], "author_count": 2}, {"id": "2605.10003", "category": "quant-ph", "title": "A low order Bargmann invariant hierarchy for set coherence", "abstract": "Set coherence is a basis-independent relational form of quantum coherence: a finite family of quantum states is set incoherent exactly when all its members are diagonal in one common basis. We determine how much low-order Bargmann data are needed to decide this property. For two states, second-order data are complete for qubits but fail for qutrits, while complete third-order data are sufficient for qutrits but fail already in dimension four. We then show that fourth-order, ordering-sensitive Bargmann invariants give the first universal pairwise criterion for set coherence. Applied to all unordered pairs, this criterion yields a complete test for arbitrary finite families. The result provides a low-order hierarchy connecting cyclic trace invariants with the noncommutativity that prevents a common incoherent basis.", "url": "https://arxiv.org/abs/2605.10003", "type": "理论", "summary": "1. 该工作建立了低阶Bargmann不变量层次结构，用于判定有限量子态族是否存在共同的不相干基。\n2. 其核心在于发现四阶、对序敏感的Bargmann不变量给出首个普适的配对判据，并由此构造任意族的完整测试。\n3. 这为通过循环迹不变量层次刻画非对易性导致的集合相干性提供了可操作的定量检验方法。", "summary_source": "deepseek", "authors": [{"name": "Yan-Ling Wang"}], "featured_authors": [{"name": "Yan-Ling Wang"}], "author_count": 1}, {"id": "2605.10255", "category": "quant-ph", "title": "Comparing Qubit and Qudit Encodings for EV Charging and Trip Assignment Problems", "abstract": "Variational quantum algorithms have attracted attention for their potential to solve combinatorial optimization problems. We study how the choice of encoding affects the resource requirements and optimization behavior of a variational quantum optimization algorithm. In order to quantify these effects, realistically inspired constrained electric vehicle (EV) fleet management problems were considered. These problems couple determining the optimal EV battery charging schedule with assigning EVs to trips requested by customers. We compare a conventional binary (qubit) trip encoding with an integer (qudit) encoding that represents assignments more directly. Both encodings guarantee the same feasible solution set, while the qudit encoding exponentially reduces the required Hilbert-space dimension. We solve many random instances of highly constrained uni- and bi-directional charging problems using qudit-based quantum approximate optimization algorithm (QAOA) and thoroughly evaluate the performance results. We find that the qudit encoding of customer trips achieves similar or better optimization performance at much reduced resource requirements and shorter simulation runtime. These results highlight qudit-native encodings as a practical route for integer and multi-valued scheduling problems in variational quantum optimization.", "url": "https://arxiv.org/abs/2605.10255", "type": "数值", "summary": "1. 该工作针对电动汽车充电与行程分配组合优化问题，对比了二元量子比特（qubit）编码与整数量子比特（qudit）编码对变分量子优化算法资源与性能的影响。\n2. 核心在于qudit编码直接表示整数赋值，指数级降低所需希尔伯特空间维度，在高度约束的单双向充电问题中，基于qudit的QAOA以更低资源消耗实现与qubit相当或更优的优化性能并显著缩短运行时间。\n3. 这凸显了qudit原生编码作为处理整数及多值调度问题的实用路径，为变分量子优化在现实组合优化中实现量子优势提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Linus Ekstrøm"}, {"name": "Hao Wang"}, {"name": "Sebastian Schmitt"}], "featured_authors": [{"name": "Linus Ekstrøm"}, {"name": "Hao Wang"}, {"name": "Sebastian Schmitt"}], "author_count": 3}, {"id": "2605.10258", "category": "quant-ph", "title": "Parity Supervision as a Driver of Generalization in Quantum Generative Modeling", "abstract": "Generalizing from finite samples to unseen valid states is central to discrete generative modeling. In a controlled, exactly enumerable setting, we test whether parity losses, commonly used for tractable Instantaneous Quantum Polynomial-time (IQP) training, also provide an inductive bias for generalization. We compare an IQP circuit Born machine trained by parity supervision with the same circuit trained by coordinate-wise mean-squared-error (MSE), and with a classical maximum-entropy control given the same parity moments. Parity supervision improves exact forward Kullback-Leibler (KL) fit and unseen high-value-state recovery over IQP-MSE, while the maximum-entropy control does not reproduce the full effect. A parameter-free spectral reconstruction shows that parity moments already transfer evidence from observed samples to structurally compatible unseen states, which the IQP circuit further refines. This identifies parity supervision not only as a tractable training signal, but also as a generalization mechanism for IQP Born machines when the distribution to be learned, the parity objective, and the circuit architecture are structurally aligned.", "url": "https://arxiv.org/abs/2605.10258", "type": "理论", "summary": "1. 该工作在可控离散生成模型中检验了奇偶监督作为IQP电路玻恩机器归纳偏置对泛化性能的影响。\n2. 卖点在于奇偶监督相比MSE训练，通过无参数谱重构将奇偶矩证据从观测样本传递至结构兼容的未见态，显著改善精确KL散度与高价值态恢复。\n3. 这揭示了当待学习分布、奇偶目标与电路架构结构对齐时，奇偶监督不仅是可训练信号，更是IQP玻恩机器实现泛化的内在机制。", "summary_source": "deepseek", "authors": [{"name": "Markus Baumann"}, {"name": "Daniel Hein"}, {"name": "Steffen Udluft"}, {"name": "Tobias Rohe"}, {"name": "Claudia Linnhoff-Popien"}, {"name": "Jonas Stein"}], "featured_authors": [{"name": "Markus Baumann"}, {"name": "Daniel Hein"}, {"name": "Steffen Udluft"}, {"name": "Tobias Rohe"}, {"name": "Claudia Linnhoff-Popien"}, {"name": "Jonas Stein"}], "author_count": 6}, {"id": "2605.10265", "category": "quant-ph", "title": "Expander attention as exchange-correlation", "abstract": "Kohn-Sham density functional theory (DFT) is the workhorse of quantum chemistry, offering an attractive balance between accuracy and computational cost. Although exact in principle, DFT in practice relies on an approximation to the unknown exchange-correlation (XC) functional, which encodes the many-body quantum effects beyond the mean-field treatment. Many such approximations exist, and machine-learned XC functionals have proliferated in recent years. A persistent challenge in this area is the trade-off between accuracy and computational cost: while high-accuracy ML functionals have shown success on strongly correlated systems that are notoriously difficult for conventional approximations, their unfavorable scaling has limited broader adoption. Here, we propose a linearly scaling non-local XC approximation based on an expander graph transformer ansatz, improving the scaling of $O(N^2)$ or worse for previous ML functionals capable of reliably capturing strongly correlated systems. We show that it recovers the correct $\\mathrm{H_2}$ dissociation curve in the strongly correlated regime, with promising results on planar $\\mathrm{H_4}$, a system where even high-level coupled cluster methods break down. Our approach thus charts a path toward ML functionals that are both accurate on strongly correlated systems and cheap enough to deploy at scale.", "url": "https://arxiv.org/abs/2605.10265", "type": "理论+数值", "summary": "1. 该工作提出一种基于扩展图变换器架构的线性标度非局域交换关联近似，用于密度泛函理论。\n2. 其核心优势在于将先前对强关联体系有效的机器学习泛函的标度从O(N²)降至线性，并正确恢复H₂解离曲线及处理耦合簇方法失效的平面H₄体系。\n3. 这为实现兼具强关联精度与大规模可部署性的机器学习交换关联泛函指明了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Karim K. Alaa El-Din"}, {"name": "Antonius v. Strachwitz"}, {"name": "Sam M. Vinko"}], "featured_authors": [{"name": "Karim K. Alaa El-Din"}, {"name": "Antonius v. Strachwitz"}, {"name": "Sam M. Vinko"}], "author_count": 3}, {"id": "2605.10314", "category": "quant-ph", "title": "Multipartite entanglement of random states of qubits", "abstract": "We investigate multipartite entanglement via the statistical properties of pure quantum states of n-qubits. By analyzing the distribution of purity among balanced bipartitions, we compare Haar-typical states, uniformly distributed on the unit sphere of states, with Hadamard states, being characterized by equal weights in the computational basis. We analyze different ensembles of Hadamard states characterized by their phase distributions. Through analytical and numerical calculations, we show that Hadamard states exhibit, on average, a higher degree of entanglement than Haar-typical states. In addition, we show that a particular class of Hadamard states, characterized by real coefficients with alternating signs, known as hypergraph states, appears especially relevant in the search for maximally multipartite entangled states, both for their structural simplicity and the increased likelihood of sampling highly entangled states. These results identify Hadamard states as a tractable yet promising class for exploring multipartite entanglement structures and advancing the characterization of maximally multipartite entangled quantum states.", "url": "https://arxiv.org/abs/2605.10314", "type": "理论+数值", "summary": "1. 该工作通过分析平衡二分纯度分布，比较了Haar典型态与Hadamard态在多体纠缠上的统计性质。\n2. 其卖点在于发现Hadamard态平均纠缠度高于Haar典型态，且实系数交替符号的超图态结构简单且更易产生最大纠缠态。\n3. 这为探索多体纠缠结构及刻画最大纠缠量子态提供了可解析处理的Hadamard态系综和高效采样策略。", "summary_source": "deepseek", "authors": [{"name": "Giorgia Trotta"}, {"name": "Paolo Scarafile"}, {"name": "Paolo Facchi"}, {"name": "Giuseppe Magnifico"}, {"name": "Angelo Mariano"}, {"name": "Giorgio Parisi"}, {"name": "Saverio Pascazio"}, {"name": "Karol Życzkowski"}], "featured_authors": [{"name": "Giorgia Trotta"}, {"name": "Paolo Scarafile"}, {"name": "Paolo Facchi"}, {"name": "Giorgio Parisi"}, {"name": "Saverio Pascazio"}, {"name": "Karol Życzkowski"}], "author_count": 8}, {"id": "2605.10492", "category": "quant-ph", "title": "Perspective on tailoring quantum coherence with electron beams", "abstract": "Examining and controlling the interaction between semiconductor quantum qubits and their environment can boost semiconductor quantum technologies, which have many applications in table-top quantum computing hardware. Electron beams in electron microscopes have opened up a new avenue for the quantum-coherent probing of semiconductor excitations and strong-coupling effects. Here, I provide a brief overview of recent advancements in electron-beam probes for investigating quantum coherence in semiconductors and two-dimensional materials, complemented by my perspective on using electron beams to manipulate the entanglement and correlations between quantum systems.", "url": "https://arxiv.org/abs/2605.10492", "type": "理论", "summary": "1. 本文以观点文章形式综述了电子束探针在半导体与二维材料量子相干性研究中的最新进展。\n2. 其核心卖点在于提出利用电子束量子相干性对半导体激子及强耦合效应进行探测，并进一步操纵量子系统间的纠缠与关联。\n3. 这为台式量子计算硬件中量子比特与环境相互作用的精准调控提供了全新思路与实验途径。", "summary_source": "deepseek", "authors": [{"name": "Nahid Talebi"}], "featured_authors": [{"name": "Nahid Talebi"}], "author_count": 1}, {"id": "2605.10497", "category": "quant-ph", "title": "Study of the Superradiance Phenomenon in the $α$--attractor Potential using the Log Derivative Method", "abstract": "In this article, we solved the time--independent one--dimensional Klein--Gordon equation in the presence of $\\alpha$--attractor potential using the Log derivative method. We calculated the reflection coefficient $\\mathcal{R}$ and the transmission coefficient $\\mathcal{T}$, showing that the superradiance phenomenon is present. In order to demonstrate the accuracy of our method, we performed a comparison with the analytical solution for the hyperbolic tangent potential.", "url": "https://arxiv.org/abs/2605.10497", "type": "理论+数值", "summary": "1. 该工作采用对数导数方法求解含α吸引子势的定态一维Klein-Gordon方程，计算了反射和透射系数，证实了超辐射现象的存在。\n2. 技术亮点在于通过与双曲正切势解析解的精确比对，验证了对数导数方法在复杂势中超辐射计算中的高准确性与可靠性。\n3. 这一方法为推广至其他势形式下的超辐射研究提供了数值验证框架，有助于深入理解弯曲时空或有效势中的量子场效应。", "summary_source": "deepseek", "authors": [{"name": "Ángel Salazar"}, {"name": "Quray Potosí"}, {"name": "David Laroze"}, {"name": "Laura M. Pérez"}, {"name": "Benjamín de Zayas"}, {"name": "Clara Rojas"}], "featured_authors": [{"name": "Ángel Salazar"}, {"name": "Quray Potosí"}, {"name": "David Laroze"}, {"name": "Laura M. Pérez"}, {"name": "Benjamín de Zayas"}, {"name": "Clara Rojas"}], "author_count": 6}, {"id": "2605.10637", "category": "quant-ph", "title": "Dynamical Criticality Behind Energy-Storage Singularities in Quantum Batteries", "abstract": "Energy-storage singularities in quantum batteries are often associated with equilibrium quantum criticality. Here we show that, in quench-driven many-body batteries, such singularities can originate from dynamical criticality in momentum space. Using the transverse-field Ising chain as a representative free-fermion quantum battery, we develop a momentum-resolved description of the charging process. The long-time stored energy forms a dephasing plateau whose dependence on the quench strength becomes nonanalytic when a real dynamical critical momentum emerges. More generally, for free-fermion two-band quantum batteries, each momentum sector acts as an independent coherent charging channel, and the condition for a dynamical quantum phase transition (DQPT) is equivalent to perfect normalized charging of the critical mode. At the critical times, this mode has a vanishing Loschmidt amplitude, maximal normalized stored energy, and zero instantaneous power at the turning point between energy absorption and backflow. We further show that the single-mode charging signal-to-noise ratio (SNR) develops sharp signatures at the same critical times, providing a direct charging-based probe of DQPT. Thus, nonequilibrium criticality does not simply enhance the total stored energy or power, which remain shaped by noncritical modes, but reorganizes energy storage by selecting optimal microscopic charging channels. Our results establish a mode-resolved connection between DQPT and quantum-battery charging, suggesting a route toward controlling many-body energy storage through dynamical criticality.", "url": "https://arxiv.org/abs/2605.10637", "type": "理论+数值", "summary": "1. 该工作表明在淬火驱动的多体量子电池中，能量存储奇异性可源于动量空间中的动力学临界性。\n2. 通过横向场伊辛链等自由费米子双带模型，展示了每个动量模作为独立相干充电通道，动力学量子相变条件等价于临界模的完美归一化充电。\n3. 这为利用动力学临界性控制多体能量存储提供了模式分辨的充电探测途径，并在临界时刻出现信噪比尖锐特征。", "summary_source": "deepseek", "authors": [{"name": "Zheng Liu"}, {"name": "Wen-Hui Nie"}, {"name": "Yi-jia Yang"}, {"name": "Lin-Cheng Wang"}, {"name": "Chang-shui Yu"}], "featured_authors": [{"name": "Zheng Liu"}, {"name": "Wen-Hui Nie"}, {"name": "Yi-jia Yang"}, {"name": "Lin-Cheng Wang"}, {"name": "Chang-shui Yu"}], "author_count": 5}, {"id": "2605.10657", "category": "quant-ph", "title": "Physical relevance of time-independent scattering predictions in periodic $\\mathcal{PT}$-symmetric chains", "abstract": "Time-independent scattering methods are widely used to analyze transport in periodic $\\mathcal{PT}$-symmetric systems. However, their predictions become unphysical when the system supports time-growing bound states (TGBSs), which manifest as $S$-matrix poles in the first quadrant of the complex wave-number plane. Here, we analytically delineate the region of physical relevance for a $\\mathcal{PT}$-symmetric chain of $N$ unit cells with gain/loss strength $\\gamma$. We derive the TGBS onset threshold $\\gamma_c = 2\\sin[\\pi/(4N)]$, which scales as $\\pi/(2N)$ for large $N$ and vanishes in the thermodynamic limit. Enlarging the structure thus enriches stationary scattering phenomenology but inevitably triggers TGBSs at weaker gain/loss. Time-dependent wave-packet simulations confirm this analytical boundary quantitatively. Applying this criterion, we show that many previously reported predictions of gain-loss-induced localization, reflectionless transport, and coherent perfect absorbers and lasers in large periodic structures fall outside the physically relevant regime. $S$-matrix pole analysis is therefore an indispensable prerequisite for interpreting time-independent scattering predictions in periodic non-Hermitian systems.", "url": "https://arxiv.org/abs/2605.10657", "type": "理论+数值", "summary": "1. 该工作通过解析推导确定了周期性PT对称链中时间无关散射预测的物理有效区域，并给出了时间增长束缚态（TGBS）的起始阈值。\n2. 其主要物理卖点在于揭示了TGBS阈值与链长N的定量关系，并证明许多先前报道的效应在热力学极限下位于非物理区域。\n3. 这强调了对非厄米周期系统进行S矩阵极点分析是解释时间无关散射预测的必要前提，为后续实验与理论研究提供了定量验证准则。", "summary_source": "deepseek", "authors": [{"name": "Chao Zheng"}], "featured_authors": [{"name": "Chao Zheng"}], "author_count": 1}, {"id": "2605.10666", "category": "quant-ph", "title": "Decoded Quantum Interferometry for Weighted Optimization Problems", "abstract": "Decoded Quantum Interferometry (DQI) is a recently introduced quantum algorithm that reduces discrete optimization to decoding with potential advantages over the best known polynomial-time classical algorithms for certain Max-LINSAT problems. In its original formulation, however, DQI treats all constraints uniformly and cannot exploit the weight structure present in most optimization problems of interest. In this work, we develop a theory of DQI for weighted optimization problems, focusing on the weighted Max-LINSAT problem over a prime field. Grouping constraints into $N$ blocks by distinct weights, we introduce \\emph{multivariate DQI states} built from $N$-variable polynomials of bounded total degree, and derive a closed-form asymptotic expression for both their optimal expectation value and their concentration behavior. We give an explicit preparation circuit using a single decoder call, and extend the analysis to imperfect decoding. We also show that, for certain weighted OPI problems, multivariate DQI outperforms a natural weighted analogue of Prange's algorithm, which serves as the weighted counterpart of the classical benchmark used in the unweighted setting. Finally, we extend the ideas to Hamiltonian DQI, obtaining approximate Gibbs states for commuting Pauli Hamiltonians with block structure.", "url": "https://arxiv.org/abs/2605.10666", "type": "理论+数值", "summary": "1. 该工作将解码量子干涉测量法（DQI）推广至加权最大线性满足问题，提出基于不同权重分块的多变量DQI态与封闭渐近解析表达式。\n2. 其核心在通过单次解码调用实现多变量多项式态的显式制备，并证明对加权问题其性能超越自然加权的Prange算法。\n3. 这为量子算法进一步处理加权组合优化及含块结构交换泡利哈密顿量的Gibbs态制备提供了理论框架与技术途径。", "summary_source": "deepseek", "authors": [{"name": "Kaifeng Bu"}, {"name": "Weichen Gu"}, {"name": "Xiang Li"}], "featured_authors": [{"name": "Kaifeng Bu"}, {"name": "Weichen Gu"}, {"name": "Xiang Li"}], "author_count": 3}, {"id": "2605.10682", "category": "quant-ph", "title": "On the Simulation Cost of Quantum Finite Automata", "abstract": "This paper identifies exact probabilistic simulation cost as the natural quantitative measure of quantum advantage for finite automata under strict cutpoints. It gives sharp simulation laws for two representative models. A one-way finite automaton with $c$ classical states and a $q$-dimensional quantum register has exact probabilistic simulation cost $\\Theta(cq^2)$, while an $n$-dimensional measure-once one-way quantum finite automaton has worst-case cost $\\Theta(n^2)$. The proofs develop a prepare--test framework, in which prefixes generate the relevant real operator degrees of freedom and suffixes convert them into strict-cutpoint tests. The same obstruction is recast through finite sign-rank matrices, clarifying the role of Forster's spectral method. Placed beside the surrounding two-way separations, these results give a clean hierarchy of finite-automata quantum advantage.", "url": "https://arxiv.org/abs/2605.10682", "type": "理论+数值", "summary": "1. 该工作以严格截断点下的精确概率模拟代价作为有限自动机量子优势的定量度量，给出了两种代表性模型的精确模拟定律。\n2. 其核心在于建立制备-测试框架，通过前缀生成实算符自由度、后缀转化为严格截断点测试，并关联有限符号秩矩阵的谱方法。\n3. 这结合双向分离结果，为有限自动机量子优势提供了清晰层级，揭示了模拟代价与量子寄存器维度的二次缩放关系。", "summary_source": "deepseek", "authors": [{"name": "Zeyu Chen"}, {"name": "Junde Wu"}], "featured_authors": [{"name": "Zeyu Chen"}, {"name": "Junde Wu"}], "author_count": 2}, {"id": "2605.10710", "category": "quant-ph", "title": "Communication-Efficient Distributed Inverse Quantum Fourier Transform", "abstract": "The scalability of quantum computing is currently limited by physical, technological, and architectural constraints that hinder the integration of a large number of qubits within a single quantum processor. Distributed quantum computing (DQC) has therefore emerged as a viable alternative, aiming to interconnect multiple smaller quantum processing units (QPUs) to jointly operate on a global quantum state. While this paradigm enables scalable architectures, it introduces significant communication overhead due to the cost of non-local quantum operations across distant nodes. In this work we propose a distributed formulation of the iQFT over a quantum network composed of $P$ nodes, each hosting $Q$ qubits, enabling the execution on a logical register of size $n = P \\cdot Q$. Furthermore, we introduce a communication-efficient variant based on a threshold-driven pruning strategy, referred to as a \\emph{communication horizon}, which exploits the exponentially decreasing significance of controlled-phase rotations to safely omit remote gates with negligible impact. By reducing the number of inter-node quantum interactions, the proposed approach significantly lowers the quantum communication requirements of the distributed iQFT while preserving its functional correctness. Crucially, we show that this approach fundamentally alters the scaling of the algorithm: the entanglement resource consumption per node saturates to a constant value, reducing the global communication complexity from quadratic $\\mathcal{O}(P^2)$ to linear $\\mathcal{O}(P)$. As the iQFT constitutes a critical building block in many quantum algorithms, the techniques presented in this paper directly contribute to improving the practicality and scalability of distributed quantum computation.", "url": "https://arxiv.org/abs/2605.10710", "type": "理论+数值", "summary": "1. 本文提出了分布式逆量子傅里叶变换的节点间公式化实现，并基于阈值剪枝策略引入通信高效变体，以安全省略远距离受控相位旋转门。\n2. 其核心优势在于利用相位旋转振幅的指数衰减特性，将每节点纠缠资源消耗收敛至常数，使全局通信复杂度从二次降至线性。\n3. 该工作为分布式量子计算的可扩展性提供了直接路径，尤其适用于依赖傅里叶变换的量子算法在量子网络中的实用化部署。", "summary_source": "deepseek", "authors": [{"name": "F. Javier Cardama"}, {"name": "Jorge Vázquez-Pérez"}, {"name": "Tomás F. Pena"}, {"name": "Andrés Gómez"}], "featured_authors": [{"name": "F. Javier Cardama"}, {"name": "Jorge Vázquez-Pérez"}, {"name": "Tomás F. Pena"}, {"name": "Andrés Gómez"}], "author_count": 4}, {"id": "2605.10724", "category": "quant-ph", "title": "Selective Placement of Hollow-Core Fibers for QKD and Classical Communication Coexistence", "abstract": "We investigate the benefits of partially upgrading optical networks with hollow-core fibers for QKD-classical communication coexistence. Results show that upgrading 40% of links in a metro topology can reduce the number of quantum modules by up to 49%.", "url": "https://arxiv.org/abs/2605.10724", "type": "理论", "summary": "1. 该工作研究了在光网络中部分部署空心光纤以提升量子密钥分发与经典通信共存性能的可行性。\n2. 其卖点在于发现仅升级城域拓扑中40%的链路即可减少多达49%的量子模块需求，显著降低部署成本。\n3. 这为未来混合量子-经典光网络的渐进式升级策略提供了定量指导，并凸显了空心光纤在降低系统复杂度方面的潜力。", "summary_source": "deepseek", "authors": [{"name": "Giovanni Simone Sticca"}, {"name": "Alessandro Gagliano"}, {"name": "Memedhe Ibrahimi"}, {"name": "Alberto Gatto"}, {"name": "Francesco Musumeci"}, {"name": "Massimo Tornatore"}], "featured_authors": [{"name": "Giovanni Simone Sticca"}, {"name": "Alessandro Gagliano"}, {"name": "Memedhe Ibrahimi"}, {"name": "Alberto Gatto"}, {"name": "Francesco Musumeci"}, {"name": "Massimo Tornatore"}], "author_count": 6}, {"id": "2605.10731", "category": "quant-ph", "title": "Squeezing Enhancement Through Resonant Interference in Multi-ring Resonators", "abstract": "We develop a non-perturbative description of squeezed light generation in an arbitrary lossy structure consisting of multiple coupled microring resonators. This is applied to two ring photonic molecules where the interference of the fields in the coupled rings leads to a modification in the resonance spectrum near a shared resonance. Considering a dual-pump degenerate squeezing scheme under a five resonance approximation, we investigate two methods to suppress parasitic four-wave mixing contributions and compensate for group velocity dispersion within a primary resonator through hybridization effects with a second auxiliary resonator. In the former case, this comes from an effective splitting of the unwanted resonances supporting parasitic four-wave mixing interactions that add thermal noise to the desired degenerate squeezed state. For sufficiently strong coupling between the resonators, we demonstrate near complete suppression of such parasitic processes, resulting in near unit fidelities with the corresponding output state that would arise were the parasitic interactions neglected. In the latter case, the hybridization effectively shifts a pump resonance, realigning the desired dual-pump four-wave mixing process and leading to a significant enhancement of the signal generation and output squeezing.", "url": "https://arxiv.org/abs/2605.
