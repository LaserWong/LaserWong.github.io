eading-order high-frequency Floquet effective description. In this limit, the system does not reduce to decoupled chains, due to the long-range in-plane dipolar interaction remains isotropic and couples different chains. Focusing on dipoles polarized perpendicular to the plane, for which the interaction is purely repulsive and isotropic, we use sign-problem-free worm-algorithm quantum Monte Carlo simulations to map the half-filling phase diagram versus kinetic anisotropy and dipolar coupling. We find that increasing kinetic anisotropy systematically lowers the interaction strength required to stabilize checkerboard order, demonstrating that Floquet-induced suppression of transverse motion enhances density ordering. Near the superfluid--checkerboard boundary, finite-size results reveal a narrow transition region where the stiffness drops rapidly while checkerboard correlations rise sharply; Its pronounced sharpening with system size is consistent with a weakly first-order transition rounded by finite-size effects. Away from half filling, on the doped sides of the checkerboard plateau, we identify a narrow checkerboard-supersolid regime with simultaneously finite checkerboard correlations and superfluid stiffness, where the superfluid stiffness is anisotropic but the density pattern is isotropic.", "url": "https://arxiv.org/abs/2605.10254", "type": "理论+数值", "summary": "1. 该工作通过单向Floquet驱动在正方晶格硬核偶极玻色子中实现各向异性跳跃，并利用量子蒙特卡洛模拟绘制了半填充相图。\n2. 其核心发现在于Floquet抑制横向隧穿系统性地降低稳定棋盘序所需相互作用强度，并在超流-棋盘边界附近观察到快速刚度下降与序参量锐升，暗示弱一级相变行为。\n3. 这为利用周期驱动调控强关联多体系统的竞争序提供了可精确控制的路线，尤其适用于探索各向异性超流与棋盘超固体等奇特相。", "summary_source": "deepseek", "authors": [{"name": "Jin Yang"}, {"name": "Yaghmorassene Hebib"}, {"name": "Chao Zhang"}], "featured_authors": [{"name": "Jin Yang"}, {"name": "Yaghmorassene Hebib"}, {"name": "Chao Zhang"}], "author_count": 3}, {"id": "2605.10304", "category": "cond-mat", "title": "Partial annealing and pattern decorrelation in associative neural networks", "abstract": "Using the Hopfield model as a benchmark case, the present work focuses on the investigation of partially annealed associative neural networks, wherein neural dynamics is coupled to slowly evolving patterns within the two-temperature-two-timescale framework. This setting inherently introduces a real parameter n, reminiscent of the number of replicas in the celebrated replica trick, that tunes the separation of timescales and the effective interaction between fast (i.e. the neurons) and slow (i.e. the synapses) degrees of freedom. By adapting Guerra's interpolation to the case, we derive the free energy without relying on analytical continuation. The obtained results demonstrate that negative values of n induce a progressive decorrelation of the stored patterns, thereby effectively reducing interference, promoting orthogonal configurations and ultimately conferring to the network the maximal storage alphac=1. Numerical simulations based on a mean field Monte Carlo dynamics have been employed to confirm this scenario and prove that partial annealing restores retrieval in challenging regimes, such as in the presence of biased patterns, outperforming standard decorrelation methods. These findings underscore the notion of partial annealing as an adaptive mechanism for enhancing memory organisation and retrieval in complex systems.", "url": "https://arxiv.org/abs/2605.10304", "type": "理论+数值", "summary": "1. 该工作以Hopfield模型为基准，研究了两温度两时间尺度框架下快（神经元）慢（突触）自由度耦合的部分退火联想神经网络。\n2. 主要技术卖点是借用副本技巧中的参数n调控时间尺度分离，通过Guerra插值导出自由能，证明n为负值时诱导存储模式渐进去相关并降低干扰，从而将最大存储容量提升至αc=1。\n3. 数值模拟证实部分退火在偏置模式等困难条件下优于标准去相关方法，为理解复杂系统中记忆组织与检索的自适应机制提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Linda Albanese"}, {"name": "Andrea Alessandrelli"}, {"name": "Adriano Barra"}, {"name": "Silvio Franz"}, {"name": "Federico Ricci-Tersenghi"}], "featured_authors": [{"name": "Linda Albanese"}, {"name": "Andrea Alessandrelli"}, {"name": "Adriano Barra"}, {"name": "Silvio Franz"}, {"name": "Federico Ricci-Tersenghi"}], "author_count": 5}, {"id": "2605.10320", "category": "cond-mat", "title": "Beyond Topological Invariants: Order Parameters from Dominant Fock-state Patterns", "abstract": "We introduce a general scheme for constructing order parameters (OPs) by extracting generic patterns from the dominant Fock states of many-body ground states. While topological phases are traditionally characterized by non-local invariants, we demonstrate that our real-space OPs provide a more refined classification. In the extended Su-Schrieffer-Heeger model, we show that the standard winding number is insufficient to fully distinguish all phases; our OPs reveal a hidden sub-structure where each topological sector splits into two distinct phases. Beyond identifying the phase boundaries, these OPs quantify the depth of a phase, and remain robust in characterizing transitions in disordered systems. Furthermore, our approach provides a practical finite-size diagnostic for the Berezinskii-Kosterlitz-Thouless transition in the interacting spin-1/2 XXZ model. The presented framework offers a broadly applicable tool for uncovering the phase diagrams of diverse interacting and non-interacting quantum many-body systems.", "url": "https://arxiv.org/abs/2605.10320", "type": "理论+数值", "summary": "1. 该工作提出从多体基态主导Fock态模式中构建实空间序参量的通用方案。\n2. 其核心在于揭示拓扑相中拓扑指标无法区分的隐藏子结构，并定量刻画相深度，且对无序系统及BKT相变提供有限尺寸诊断。\n3. 这为广泛量子多体系统的相图精细分类与相变识别提供了超越拓扑不变量的新范式。", "summary_source": "deepseek", "authors": [{"name": "Tsz Hin Hui"}, {"name": "Xiaodan Xia"}, {"name": "Pedro D. Sacramento"}, {"name": "Wing Chi Yu"}], "featured_authors": [{"name": "Tsz Hin Hui"}, {"name": "Xiaodan Xia"}, {"name": "Pedro D. Sacramento"}, {"name": "Wing Chi Yu"}], "author_count": 4}, {"id": "2605.10326", "category": "cond-mat", "title": "Statistical mechanics of the $N$-queens problem", "abstract": "We investigate the $N$-queens problem as a lattice gas -- a model in which $N$ queens are placed on an $N \\times N$ chessboard with pairwise repulsive interactions along shared rows, columns, and diagonals -- from the perspective of statistical mechanics. The ground states are exactly the $Q(N)$ solutions of the classical $N$-queens problem, with entropy per queen $s_0 \\approx \\ln N - \\gamma$ ($\\gamma \\approx 1.944$). This entropy reflects a characteristic constraint hierarchy: each successive geometric constraint -- columns, then diagonals -- reduces the entropy from the free-placement value $\\ln N$ by a definite constant. We derive the exact high-temperature energy $E/N \\to 5/3$ as $N \\to \\infty$. Extensive Monte Carlo simulations with $10^8$ sweeps per temperature point for $N = 8$--$1024$ reveal that the specific heat per queen $C_v/N$ converges to a universal function of $T$ as $N \\to \\infty$. The converged curve features a non-divergent peak $C_v^{\\max}/N \\approx 1.63$ at $T^* \\approx 0.235\\,J$, establishing the absence of a thermodynamic phase transition. Combined with the trivially exact high-temperature entropy $S(\\infty)/N = (1/N) \\ln \\binom{N^2}{N}$, the convergence of $C_v/N$ enables a thermodynamic integration of $C_v/T$ from $T = \\infty$ to $T = 0$ that recovers the ground-state entropy -- and hence the Simkin constant $\\gamma$ -- purely from Monte Carlo data. This provides an independent thermodynamic route to a fundamental combinatorial constant. Thermodynamic integration yields $\\gamma_{\\rm MC} = 1.946 \\pm 0.003$ at $N = 1024$, within $0.1\\%$ of the precise combinatorial value $\\gamma = 1.94400(1)$. We further present a transfer-matrix-based tensor network formulation that encodes the non-attacking constraints into a rank-9 site tensor with 17 nonzero elements, providing a complementary exact-enumeration route.", "url": "https://arxiv.org/abs/2605.10326", "type": "理论+数值", "summary": "1. 该工作将N皇后问题视为具有行列对角线排斥作用的格子气模型，系统研究了其基态熵、高温极限能量及有限温标度行为。\n2. 其核心在于发现比热在热力学极限下收敛至普适无峰函数（峰值C_v^max/N≈1.63，T*≈0.235J），排除相变；并通过热力学积分仅由蒙特卡洛数据恢复基态熵，以0.1%精度导出Simkin常数γ_MC=1.946±0.003。\n3. 这为受约束组合优化问题提供了从热力学数据提取精确组合常数的统计力学范式，所发展的张量网络表述也为精确计数与进一步拓展提供了工具。", "summary_source": "deepseek", "authors": [{"name": "Zong-Yue Liu"}, {"name": "Hai-Jun Liao"}, {"name": "Lei Wang"}], "featured_authors": [{"name": "Zong-Yue Liu"}, {"name": "Hai-Jun Liao"}, {"name": "Lei Wang"}], "author_count": 3}, {"id": "2605.10387", "category": "cond-mat", "title": "Layer-antisymmetric pair-phase resonance at the bonding-antibonding splitting in the AA-stacked bilayer attractive Hubbard model", "abstract": "The relative phase between the two pair condensates of a bilayer s-wave superconductor is a collective degree of freedom distinct from the usual in-phase Anderson-Bogoliubov mode. Working at the Gaussian fluctuation level for the AA-stacked attractive-Hubbard honeycomb bilayer, we show analytically that the layer-antisymmetric pair-phase channel hosts an in-gap collective pole at twice the single-particle interlayer hopping, $2t_h$, precisely the bonding-antibonding band splitting. The mechanism is algebraic: at this frequency, the antisymmetric phase bubble reduces pointwise in momentum space to the static symmetric phase bubble that enforces the in-phase Goldstone pole. The resulting resonance scale is therefore fixed by the single-particle hybridization, rather than by the interaction-driven Josephson coupling that controls the canonical Leggett mode. The identity is verified numerically by direct Bogoliubov-de Gennes calculations. The diagonal antisymmetric phase-channel kernel zero is exact within Gaussian theory at any chemical potential; the full coupled amplitude-phase pole coincides with it at half filling and tracks it closely away from half filling. The excitation is Raman-forbidden by inversion, which motivates layer-odd probes. We find that a layer-imbalance drive has finite Gaussian-level overlap with the pair-phase sector, suggesting a possible cold-atom layer-bias response feature near the sub-kilohertz scale for typical optical-lattice parameters.", "url": "https://arxiv.org/abs/2605.10387", "type": "理论+数值", "summary": "1. 该工作从高斯涨落层次解析证明了AA堆叠双层吸引Hubbard模型中，层反对称对相位通道存在频率为单粒子层间跃迁两倍的间隙内集体极点。\n2. 其核心机制是代数性的：在该频率下反对称相位泡逐点约化为施加同相Goldstone极点的静态对称相位泡，共振尺度由单粒子杂化而非约瑟夫森耦合决定。\n3. 该激发受反演对称性禁止而拉曼不可见，但层不平衡驱动与对相位扇区有高斯级重叠，为冷原子光晶格中亚千赫兹层偏置响应特征探测提供了方向。", "summary_source": "deepseek", "authors": [{"name": "Yogeshwar Prasad"}], "featured_authors": [{"name": "Yogeshwar Prasad"}], "author_count": 1}, {"id": "2605.10418", "category": "cond-mat", "title": "Bose-Fermi Mapping in Hubbard Models at Imaginary Chemical Potential and Phase-Induced Fermionization", "abstract": "We find a mapping between the attractive Fermi-Hubbard model and the repulsive Bose-Hubbard model at finite temperature and at imaginary chemical potential $\\mu =i\\theta$. We show, by using a large $N$-expansion, that the partition functions of the two models are related by a simple shift $\\theta \\to \\theta + \\pi$. This condition maps the BCS--BEC crossover of attractive fermions to a Bose--Fermi crossover (fermion-like occupation) of repulsive bosons. Central feature of this correspondence plays the thermal kernel $g(\\beta E,\\phi),$ whose analytic continuation $g_B(\\beta E,\\phi) = g_F(\\beta E,\\phi+\\pi)$ governs the bosonic and fermionic sectors. Interestingly, we are able to find that the special angles $\\phi = 2\\pi/3,4\\pi/3$ for fermions correspond to $\\phi = \\pi/3,5\\pi/3$ for bosons, marking the boundaries of a universal thermal window. We further argue that the present mechanism shows that fermionization can occur at finite interaction strength through a thermodynamic effect induced by the imaginary chemical potential. This suggests that it is a new way of fermionization (not a change in statistics but a fermion-like behaviour) unlike the Tonks--Girardeau limit, where fermionization arises from an infinite repulsive interaction and anyonic or Floquet-engineered systems where transmutation emerges from modified statistics or dynamics. Essentially, the phase $\\phi$ is a statistical parameter; by twisting the thermal phase, it generates fermion-like behaviour without hard-core constraints or infinite repulsion but only by using thermodynamics. We derive the gap equation and number equation for the bosonic model, highlighting the role of the imaginary chemical potential as a statistical regulator. Our results provide a unified framework for understanding crossovers in interacting lattice systems.", "url": "https://arxiv.org/abs/2605.10418", "type": "理论", "summary": "1. 该工作建立了虚化学势下吸引费米-哈伯德模型与排斥玻色-哈伯德模型间的精确映射，通过大N展开揭示了配分函数的θ→θ+π移位关系。\n2. 其核心在于热核的解析延拓g_B(βE,φ)=g_F(βE,φ+π)以及虚化学势作为统计调节器，使有限相互作用下经热力学相位扭转即可实现费米子化行为，无需无限排斥势或统计修饰。\n3. 这为理解相互作用晶格系统中的交叉现象提供了统一热力学框架，并启发基于虚化学势调控实现费米子化的新型量子模拟方案。", "summary_source": "deepseek", "authors": [{"name": "Evangelos G. Filothodoros"}], "featured_authors": [{"name": "Evangelos G. Filothodoros"}], "author_count": 1}, {"id": "2605.10472", "category": "cond-mat", "title": "Influence of pump size on pattern formation in exciton-polaritonic Bose-Einstein condensates in the non-Markovian regime", "abstract": "Dynamics of exciton-polaritonic condensate under incoherent pumping is studied using the non-Markovian stochastic Gross-Pitaevskii equation with the pseudo-differential dispersion term. This term corresponds to the lower energy branch of polaritons. It is shown that an increasing of the pumping spot area leads to the appearance of various spatial structures whose properties depend on the duration of the dynamical memory. In the regime of short memory time, condensate can form an extended state that spans outside the pumping area. We conclude that onset of such extended states is related to the specific form of the dispersion term causing the ``traffic jam'' effect. The case of long memory time corresponds to enhanced condensate formation, when increasing of the pumping area leads to appearance of angular condensate structures which partially suppress emission of matter waves from the pumping area.", "url": "https://arxiv.org/abs/2605.10472", "type": "理论", "summary": "1. 该工作采用含伪微分色散项的非马尔可夫随机Gross-Pitaevskii方程，研究了非相干泵浦光斑尺寸对激子极化激元凝聚体图案形成的影响。\n2. 其核心发现在于，短动力学记忆下色散项导致的“交通堵塞”效应可使凝聚体形成超出泵浦区域的扩展态，而长记忆下泵浦面积增大会引发部分抑制物质波发射的角向凝聚体结构。\n3. 这为通过泵浦尺寸和系统非马尔可夫性调控极化激元凝聚体的空间图案与物质波辐射提供了明确机理，并启示了相关非平衡凝聚体动力学的研究方向。", "summary_source": "deepseek", "authors": [{"name": "N. V. Kuznetsova"}, {"name": "A. D. Alliluev"}, {"name": "D. V. Makarov"}, {"name": "A. A. Anisich"}], "featured_authors": [{"name": "N. V. Kuznetsova"}, {"name": "A. D. Alliluev"}, {"name": "D. V. Makarov"}, {"name": "A. A. Anisich"}], "author_count": 4}, {"id": "2605.10528", "category": "cond-mat", "title": "Collective Alignment in LLM Multi-Agent Systems: Disentangling Bias from Cooperation via Statistical Physics", "abstract": "We investigate the emergent collective dynamics of LLM-based multi-agent systems on a 2D square lattice and present a model-agnostic statistical-physics method to disentangle social conformity from intrinsic bias, compute critical exponents, and probe the collective behavior and possible phase transitions of multi-agent systems. In our framework, each node of an $L\\!\\times\\!L$ lattice hosts an identical LLM agent holding a binary state ($+1$/$-1$, mapped to yes/no) and updating it by querying the model conditioned on the four nearest-neighbor states. The sampler temperature $T$ serves as the sole control parameter. Across three open-weight models (llama3.1:8b, phi4-mini:3.8b, mistral:7b), we measure magnetization and susceptibility under a global-flip protocol designed to probe $\\mathbb{Z}_2$ symmetry. All models display temperature-driven order-disorder crossovers and susceptibility peaks; finite-size scaling on even-$L$ lattices yields effective exponents $\\gamma/\\nu$ whose values are model-dependent, close to but incompatible with the 2D Ising universality class ($\\gamma/\\nu=7/4$). Our method enables the extraction of effective $\\beta$-weighted couplings $\\tilde{J}(T)$ and fields $\\tilde{h}(T)$, which serve as a measure of social conformity and intrinsic bias. In the models we analyzed, we found that collective alignment is dominated by an intrinsic bias ($\\tilde{h}\\gg\\tilde{J}$) rather than by cooperative neighbor coupling, producing field-driven crossovers instead of genuine phase transitions. These effective parameters vary qualitatively across models, providing compact collective-behavior fingerprints for LLM agents and a quantitative diagnostic for the reliability of multi-agent consensus and collective alignment.", "url": "https://arxiv.org/abs/2605.10528", "type": "理论+数值", "summary": "1. 该工作以采样温度为唯一控制参数，在二维正方格点上利用统计物理方法研究大语言模型多智能体系统的集体对齐，并分离社会从众性与内禀偏差。\n2. 通过全局自旋翻转协议测量磁化率与磁化强度并进行有限尺寸标度，提取有效耦合和有效场，发现三个开源模型均呈现由内禀偏差主导的场驱动交叉而非真正相变，其临界指数偏离伊辛普适类。\n3. 这为多智能体集体行为提供了模型依赖的紧凑指纹，并为评估基于大语言模型共识的可靠性给出了定量诊断工具。", "summary_source": "deepseek", "authors": [{"name": "Cristiano De Nobili"}], "featured_authors": [{"name": "Cristiano De Nobili"}], "author_count": 1}, {"id": "2605.10561", "category": "cond-mat", "title": "The diffusion equation for non-Markovian Gaussian stochastic processes", "abstract": "We derive the exact evolution equation for the probability density function of particle displacements generated by arbitrary Gaussian velocity processes, when neither Markovianity and nor stationarity are assumed. Starting from the characteristic function of the density of the position, we construct a systematic hierarchy of equations based on Wick's theorem, in which the dynamics is governed by sums of geometrically connected Wick contractions. This approach yields a closed non-Markovian diffusion equation that generalizes the Fokker-Planck description and preserves Gaussianity only in the infinite-order limit.", "url": "https://arxiv.org/abs/2605.10561", "type": "理论", "summary": "1. 该工作推导了非马尔可夫、非平稳高斯速度过程中粒子位移概率密度函数的精确演化方程。\n2. 其卖点在于基于Wick定理构建几何连接收缩的方程层级，得到封闭的广义非马尔可夫扩散方程，仅在无限阶极限恢复高斯性。\n3. 这为描述非马尔可夫随机动力学提供了可解析处理的框架，并启发将其推广至非高斯涨落系统。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Taloni"}, {"name": "Gianni Pagnini"}, {"name": "Aleksei Chechkin"}], "featured_authors": [{"name": "Alessandro Taloni"}, {"name": "Gianni Pagnini"}, {"name": "Aleksei Chechkin"}], "author_count": 3}, {"id": "2605.10602", "category": "cond-mat", "title": "Inherent Altermagnetism on regular hyperbolic lattices", "abstract": "Altermagnets are a novel class of magnetic systems characterized by their momentum-dependent spin splitting without net magnetization. In this work, we extend established Euclidean tight-binding models of altermagnets to regular hyperbolic lattices in two spatial dimensions defined on a discretized Poincaré disk. Using hyperbolic crystallography and hyperbolic band theory, we show that the inclusion of next-nearest neighbor hopping is sufficient to induce spin splitting in bipartite hyperbolic lattices. While certain families and special cases of hyperbolic lattices remain antiferromagnetic, we identify an entire family and a special case that show spin splitting in this framework. Hence, altermagnetism is inherent to certain hyperbolic lattices. Since hyperbolic band theory yields a momentum space that is at least four-dimensional, we classify the leading spin-splitting harmonics using four-dimensional atomic orbitals.", "url": "https://arxiv.org/abs/2605.10602", "type": "理论", "summary": "1. 该工作将交变磁体的紧束缚模型推广至二维庞加莱盘离散化正则双曲晶格，利用双曲晶体学与双曲能带理论证明次近邻跳跃足以在二分双曲晶格中诱导动量依赖自旋劈裂。\n2. 其技术核心在于基于四维动量空间的双曲能带理论，使用四维原子轨道对主导自旋劈裂谐波进行分类，并识别出特定双曲晶格家族中固有的交变磁性。\n3. 这为在非欧几何平台上研究自旋劈裂现象提供了理论框架，并可启发基于双曲晶格的新型自旋电子学器件设计。", "summary_source": "deepseek", "authors": [{"name": "Eric Petermann"}, {"name": "Kristian Mæland"}, {"name": "Haye Hinrichsen"}, {"name": "Björn Trauzettel"}], "featured_authors": [{"name": "Eric Petermann"}, {"name": "Kristian Mæland"}, {"name": "Haye Hinrichsen"}, {"name": "Björn Trauzettel"}], "author_count": 4}, {"id": "2605.10613", "category": "cond-mat", "title": "Exact Fixed-Point Constraints in Neural-ODEs with Provable Universality", "abstract": "We introduce a technique that enables Neural-ODEs to approximate arbitrary velocity fields with a priori planted fixed-points. Specifically, a recipe is given to explicitly accommodate for a finite collection of points in the reference multi-dimensional space of the Neural-ODE where the velocity field is exactly equal to zero. In this way, the gradient-based training is rigorously constrained inside the prescribed hypothesis class while leaving the expressive power of the Neural-ODE unaltered. We rigorously prove the universality of the Neural-ODE under any local constraints in the velocity field and give a computationally convenient way of imposing the fixed points. Our method is then tested on two paradigmatic physical models.", "url": "https://arxiv.org/abs/2605.10613", "type": "理论", "summary": "1. 该工作提出一种在神经ODE中精确植入有限个不动点约束的技术，通过在参考多维空间中显式构造速度场严格为零的点集，使梯度训练受限且不改变通用逼近性质。\n2. 其核心卖点在于严格证明了任意局部约束下神经ODE的普遍性，并给出计算便捷的显式方案，使先验动力学约束得以零代价嵌入。\n3. 这为物理建模中嵌入平衡态等先验知识提供了理论严谨的实用工具，两个典型物理模型测试验证了其在可解释性与外推能力上的提升潜力。", "summary_source": "deepseek", "authors": [{"name": "Feliciano Giuseppe Pacifico"}, {"name": "Duccio Fanelli"}, {"name": "Lorenzo Buffoni"}, {"name": "Lorenzo Chicchi"}, {"name": "Diego Febbe"}, {"name": "Raffaele Marino"}], "featured_authors": [{"name": "Feliciano Giuseppe Pacifico"}, {"name": "Duccio Fanelli"}, {"name": "Lorenzo Buffoni"}, {"name": "Lorenzo Chicchi"}, {"name": "Diego Febbe"}, {"name": "Raffaele Marino"}], "author_count": 6}, {"id": "2605.10630", "category": "cond-mat", "title": "Thermodynamics and dynamics of non-compact prismatic dislocation loops simulated using a machine-learning model", "abstract": "We explore how the thermodynamic properties and dynamics of a self-interstitial prismatic dislocation loop are affected by microscopic-scale variations in its geometric configuration, an aspect that rarely received attention in literature. First, we develop a machine-learning (ML) model to predict the formation energy of an arbitrary geometrically complex configuration of a self-interstitial atom dislocation loop. Trained on atomistic simulation data, the ML model achieves high predictive accuracy across a broad range of configurations, with a typical error in the 1% range. Second, from the ML model, we evaluate the density of configurational microstates as a function of loop's formation energy and derive analytical expressions valid in tractable limiting cases. Using statistical mechanics, we derive the configurational free energy, the average energy, and the thermodynamic entropy of a dislocation loop as a function of temperature. Third, we simulate the dynamics of self-climb of dislocation loops with various geometries and evaluate their diffusion coefficients and effective activation energies. Our analysis shows that there is a single universal parameter describing the morphological irregularity of loop configurations in its ground state. This parameter determines the thermodynamic properties of a loop as well as its dynamics, and simulations illustrate how the properties and mobility of a configurationally complex loop vary as functions of the irregularity parameter.", "url": "https://arxiv.org/abs/2605.10630", "type": "理论+数值", "summary": "1. 该工作基于机器学习模型系统研究了非紧致自间隙棱柱位错环的构型热力学与自攀爬动力学。\n2. 技术关键在机器学习高精度预测复杂构型形成能，并揭示描述基态形态不规则性的单一普适参数同时决定热力学与动力学行为。\n3. 这为位错环构型熵效应及其扩散迁移的统计力学描述奠定基础，启发辐照损伤材料中位错环演化的理论预测。", "summary_source": "deepseek", "authors": [{"name": "Sho Hayakawa"}, {"name": "Sergei L. Dudarev"}, {"name": "Max Boleininger"}], "featured_authors": [{"name": "Sho Hayakawa"}, {"name": "Sergei L. Dudarev"}, {"name": "Max Boleininger"}], "author_count": 3}, {"id": "2605.10644", "category": "cond-mat", "title": "Susceptible-Infected-Susceptible Model with Mitigation on Scale-Free Networks", "abstract": "We investigate infectious disease spreading on scale-free networks using a heterogeneous mean-field approach applied to the susceptible-infected-susceptible model, incorporating a mitigation factor. Individual heterogeneity is incorporated through a power-law distribution, while a mitigation factor accounts for behavioral responses and external effects that effectively reduce transmission from infected individuals. This mechanism, inspired by Malthus-Verhulst-type constraints, introduces a nonlinear saturation effect that encodes self-limiting dynamics in a tractable way. Analytical results are supported by stochastic simulations. We find that the mitigation factor induces a nontrivial behavior in the probability that a link points to an infected node, which develops a maximum at finite infection rates. In contrast, the overall prevalence remains a monotonically increasing function of the transmission rate. Additionally, the mitigation mechanism leads to an inversion in the dependence of epidemic observables on the degree exponent at sufficiently high transmission rates. While in the standard model smaller exponents yield higher endemic prevalence, in the modified model this trend reverses, with larger exponents producing higher prevalence and increased infection probability along network links.", "url": "https://arxiv.org/abs/2605.10644", "type": "理论+数值", "summary": "1. 该工作采用异质平均场方法，在无标度网络上引入减缓因子研究SIS模型，并得到随机模拟验证。\n2. 卖点在于通过类Malthus-Verhulst约束的非线性饱和效应，揭示减缓因子使感染节点连接概率出现非单调极大值，且在高传播率下引发患病率对度指数依赖的反转。\n3. 这一非线性饱和机制为理解行为响应与网络结构耦合下的流行病动力学提供了可解析处理的框架，并启发相关自限制系统的研究。", "summary_source": "deepseek", "authors": [{"name": "João Gabriel Simões Delboni"}, {"name": "M. O. Hase"}], "featured_authors": [{"name": "João Gabriel Simões Delboni"}, {"name": "M. O. Hase"}], "author_count": 2}, {"id": "2605.10703", "category": "cond-mat", "title": "Freestanding GdBa2Cu3O7 Thin Films via Optimized Buffer Layer Design: Preserving Superconducting Properties", "abstract": "Freestanding GdBa2Cu3O7 (GdBCO) superconducting thin films were fabricated using a water-soluble Sr3Al2O6 (SAO) sacrificial layer in combination with thermal release tape. An amorphous Al2O3 capping layer was introduced to suppress crack formation during the lift-off process. The influence of buffer-layer design inserted between the GdBCO and SAO layers was systematically investigated with respect to structural integrity and superconducting properties after lift-off. A LaAlO3/SrTiO3 bilayer buffer was found to be essential for maintaining epitaxial growth and a superconducting transition temperature (Tc) of approximately 92 K after lift-off, comparable to that of the as-grown films. In contrast, a reversed SrTiO3/LaAlO3 bilayer and single-layer buffer structures led to a suppression of Tc, highlighting the critical role of stacking sequence. These results demonstrate that optimization of the buffer-layer design is a key factor for realizing high-quality freestanding GdBCO films while maintaining their superconducting characteristics.", "url": "https://arxiv.org/abs/2605.10703", "type": "理论+数值", "summary": "1. 该工作通过优化缓冲层设计，利用水溶性Sr3Al2O6牺牲层与热释放胶带成功制备了自支撑GdBCO超导薄膜，并发现LaAlO3/SrTiO3双层缓冲层可有效保持其超导转变温度约92K。\n2. 技术关键是系统对比不同缓冲层堆叠顺序，证明单层或反向SrTiO3/LaAlO3结构会抑制Tc，而正序双层缓冲层对维持外延生长完整性不可或缺。\n3. 该缓冲层优化策略为制备高质量自支撑高温超导薄膜提供了明确指导，有望推动其在柔性电子和异质集成中的实际应用。", "summary_source": "deepseek", "authors": [{"name": "Kazumasa Iida"}, {"name": "Kai Walter"}, {"name": "Takafumi Hatano"}, {"name": "Kose Morinaga"}, {"name": "Manuela Erbe"}, {"name": "Hongye Gao"}, {"name": "Satoshi Hata"}, {"name": "Jens Hänisch"}], "featured_authors": [{"name": "Kazumasa Iida"}, {"name": "Kai Walter"}, {"name": "Takafumi Hatano"}, {"name": "Hongye Gao"}, {"name": "Satoshi Hata"}, {"name": "Jens Hänisch"}], "author_count": 8}, {"id": "2605.10709", "category": "cond-mat", "title": "Optical selection rules in hexagonal Ge polytypes and their lifting by symmetry perturbation", "abstract": "Hexagonal germanium polytypes have emerged as promising direct-gap semiconductors for silicon-integrated optoelectronics, yet their optical properties remain largely unexplored beyond the well-studied 2H phase. We present a comprehensive theoretical study of optical properties of hexagonal 2H-, 4H-, and 6H-Ge polytypes through ab initio calculations of quasiparticle band structures, dipole transition matrix elements, and solution of the Bethe-Salpeter equation. While all three polytypes exhibit direct band gaps of increasing size from 2H to 6H, we reveal that the fundamental optical transition in 4H-Ge is parity-forbidden due to matching band parities at the valence and conduction band edges. This selection rule results in a radiative lifetime seven orders of magnitude longer than in 2H- and 6H-Ge, severely limiting light emission capabilities. To demonstrate that the selection rule can be lifted, we introduce controlled symmetry perturbations by substituting single Ge atoms with Si in each unit cell, breaking the crystal symmetry. This perturbation increases the optical matrix elements by up to two orders of magnitude and reduces radiative lifetimes for all perturbed polytypes. We also compute absorption coefficients and frequency-dependent dielectric tensors for both light polarizations, including excitonic effects up to 5 eV, providing complete optical characterization of ideal and symmetry-perturbed hexagonal Ge systems relevant for optoelectronic applications.", "url": "https://arxiv.org/abs/2605.10709", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算系统研究了六方锗多型体（2H、4H、6H）的光学性质，揭示了宇称选择定则对发光能力的决定性影响。\n2. 其核心发现是4H-Ge中带边宇称匹配导致基本光学跃迁禁戒，使辐射寿命较其他相延长七量级，而Si替代引入的对称性破缺可将光学矩阵元提升两个量级。\n3. 这为通过对称性工程调控锗基直接带隙半导体发光效率提供了明确指导，对硅集成光电子器件设计具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Martin Keller"}, {"name": "Haichen Wang"}, {"name": "Friedhelm Bechstedt"}, {"name": "Jürgen Furthmüller"}, {"name": "Silvana Botti"}], "featured_authors": [{"name": "Martin Keller"}, {"name": "Haichen Wang"}, {"name": "Friedhelm Bechstedt"}, {"name": "Jürgen Furthmüller"}, {"name": "Silvana Botti"}], "author_count": 5}, {"id": "2605.10740", "category": "cond-mat", "title": "Anomalous and diode Josephson effect in junctions with inhomogeneous ferromagnetic barrier and interfacial Rashba spin-orbit coupling", "abstract": "We theoretically investigate the anomalous and diode Josephson effects in planar two-dimensional Josephson junctions with arbitrarily oriented exchange fields in two ferromagnets within the barrier, and spin-orbit coupling at the superconductor/ferromagnet interfaces, where the superconducting electrodes can have $s$-wave or arbitrarily oriented $d$-wave order parameter lobes. We perform a systematic symmetry analysis of the junction Hamiltonian and identify the minimal conditions for breaking time-reversal and space-inversion symmetries, which are required for the emergence of anomalous and diode Josephson effects. We classify the junctions into three classes, with particular attention to those between $d_{x^2-y^2}$ and $d_{xy}$ oriented superconductors. Our symmetry analysis is supported by numerical calculations of the current-phase relation (CPR) obtained using a generalized Furusaki-Tsukada (F-T) approach. By tuning the directions of exchange fields in the ferromagnets, Rashba SOC at the interfaces and superconducting order parameter orientations, nonreciprocity can be enhanced by more than 40\\%. We further analyze the phase-dependent Andreev bound states (ABS) spectrum and their contribution to charge transport, as well as their signatures in the nonreciprocal transport characteristics. By comparing the current carried by ABS with that obtained using the F-T technique, we find that the contribution from continuum states above the gap becomes pronounced in presence of zero energy crossings in the ABS spectrum, and in junctions with $d$-wave superconducting electrodes due to the narrower superconducting gap, which may become closed. In the nonreciprocal regime, the ABS spectra show an asymmetric profile with respect to phase inversion, indicating the presence of a finite current at zero phase difference and unequal critical currents in opposite directions.", "url": "https://arxiv.org/abs/2605.10740", "type": "理论+数值", "summary": "1. 该工作理论研究了具有非均匀铁磁势垒和界面Rashba自旋轨道耦合的二维约瑟夫森结中，由任意取向交换场及s波或d波序参量驱动的反常与二极管约瑟夫森效应。\n2. 通过对称性分析识别最小破缺时间反演和空间反演对称条件，结合广义Furusaki-Tsukada方法计算电流-相位关系，发现调节交换场方向、Rashba SOC和序参量取向可增强非互易性逾40%。\n3. 相位依赖Andreev束缚态谱分析表明，在零能穿越及d波超导窄能隙下连续态贡献显著，非互易区束缚态谱相对相位反转不对称，为设计非互易超导结提供了机制。", "summary_source": "deepseek", "authors": [{"name": "Stevan Djurdjević"}, {"name": "Zorica Popović"}], "featured_authors": [{"name": "Stevan Djurdjević"}, {"name": "Zorica Popović"}], "author_count": 2}, {"id": "2605.10746", "category": "cond-mat", "title": "Lyapunov Exponents as Duality-Invariant Signatures of Critical States", "abstract": "Critical eigenstates are usually identified through wave-function geometry in a chosen basis, such as participation ratios, multifractal spectra, or finite-size scaling. Here we formulate criticality instead as a dual-space Lyapunov property. We prove a Fourier exclusion principle: exponential localization in one representation is incompatible with exponential localization in its Fourier-dual representation. This turns the Liu--Xia condition, \\(\\gamma_x(E)=\\gamma_m(E)=0\\), from a phenomenological criterion into a rigorous length-scale statement: a critical state is characterized by the simultaneous absence of exponential confinement in real and momentum space. The criterion is invariant under bounded local gauge transformations of the transfer matrix and remains compatible with conventional single-space multifractal diagnostics. More importantly, it is exactly predictive. In analytically tractable quasiperiodic models, the same condition yields closed-form critical lines, an exact finite critical region with an additional critical branch, and a complex critical surface in a non-Hermitian non-self-dual spectrum. Thus the Liu--Xia condition provides not only a diagnostic of critical states, but an exact solvability principle for locating critical sets across distinct microscopic structures.", "url": "https://arxiv.org/abs/2605.10746", "type": "理论+数值", "summary": "1. 该工作提出以李雅普诺夫指数作为对偶不变标识别临界态，取代传统波函数几何诊断。\n2. 其核心是证明傅里叶排除原理，将Liu-Xia条件从唯象判据转化为实空间与动量空间同时无指数束缚的严格长度尺度陈述。\n3. 该条件在可解准周期模型中精确预言闭合临界线及非厄米复杂临界面，为定位不同微观结构的临界集提供了可解性原理。", "summary_source": "deepseek", "authors": [{"name": "Tong Liu"}, {"name": "Gao Xianlong"}], "featured_authors": [{"name": "Tong Liu"}, {"name": "Gao Xianlong"}], "author_count": 2}, {"id": "2605.10747", "category": "cond-mat", "title": "Theory of Spin-splitter Magnetoresistance in Altermagnets", "abstract": "We develop a theory of angle-dependent magnetoresistance (ADMR) in metallic altermagnets coupled to ferromagnetic insulators and establish criteria that distinguish them from conventional compensated magnets with spin-orbit coupling. We show that the spin-splitter magnetoresistance (SSMR) reported by H. Chen et al. [Adv. Mater. 37, 2507764 (2025)] constitutes a smoking-gun signature of collinear altermagnetism in metallic systems. In contrast to spin-Hall magnetoresistance (SMR), SSMR exhibits three key distinctions: it depends solely on the relative orientation between the ferromagnetic magnetization and the altermagnetic Néel vector, yields a longitudinal ADMR response of opposite sign, and features a direct proportionality between longitudinal and transverse ADMR signals, absent in SMR. These results provide a clear route to unambiguously identify altermagnets in transport.", "url": "https://arxiv.org/abs/2605.10747", "type": "理论", "summary": "1. 该工作发展了金属交变磁体中自旋分裂磁电阻（SSMR）的理论，并建立了其与自旋霍尔磁电阻相区分的明确判别标准。\n2. 核心卖点在于SSMR仅依赖于铁磁磁化与交变磁奈尔矢量的相对取向，且呈现符号相反的纵向磁电阻及纵横向信号间的正比关系。\n3. 这为在输运实验中无歧义识别共线交变磁体提供了直接可验证的判据与清晰路径。", "summary_source": "deepseek", "authors": [{"name": "Tim Kokkeler"}, {"name": "Vitaly N. Golovach"}, {"name": "F. Sebastian Bergeret"}], "featured_authors": [{"name": "Tim Kokkeler"}, {"name": "Vitaly N. Golovach"}, {"name": "F. Sebastian Bergeret"}], "author_count": 3}, {"id": "2605.08294", "category": "hep-th", "title": "Completely asymptotically free chiral theories with scalars", "abstract": "We provide the conditions for complete asymptotic freedom for chiral gauge theories including scalars, as motivated by grand unified models. These are generalised Georgi-Glashow and Bars-Yankielowicz theories that feature a scalar field transforming either in the fundamental or in the adjoint of the gauge group. In both scenarios, we consider the addition of multiple chiral fermion families. We systematically analyse the interplay between gauge, Yukawa, and quartic couplings required for all interactions to remain asymptotically free at short distances. We find that for both scalar representations, complete asymptotic free models can be obtained for a specific number of colours and multiplicity of vector-like and chiral families.", "url": "https://arxiv.org/abs/2605.08294", "type": "理论", "summary": "1. 该工作推导了含标量的手征规范理论实现完全渐近自由的条件，受大统一模型启发，涉及标量变换为基本或伴随表示并引入多重手征费米子族。\n2. 其卖点在于系统分析规范、Yukawa和四次耦合的相互作用，发现两种标量表示下需特定颜色数和矢量族与手征族的多重性方可所有耦合短距离渐近自由。\n3. 这为构建紫外有限的大统一理论提供了约束框架，并指导在渐近自由前提下选择标量表示与费米子谱结构。", "summary_source": "deepseek", "authors": [{"name": "Giacomo Cacciapaglia"}, {"name": "Francesco Sannino"}, {"name": "Sophie Wagner"}], "featured_authors": [{"name": "Giacomo Cacciapaglia"}, {"name": "Francesco Sannino"}, {"name": "Sophie Wagner"}], "author_count": 3}, {"id": "2605.08335", "category": "hep-th", "title": "Inner Horizon Saddles and a Spectral KSW Criterion", "abstract": "The Bekenstein-Hawking entropy formula $\\rho = e^{A/4G}$ receives significant corrections for charged black holes near extremality. Using standard results in JT gravity, the correction term can semiclassically be expressed as minus the exponential of the inner horizon area, $e^{A_{\\text{inner}}/4G}$, and the cancellation between these two exponentials enforces a vanishing density of states towards extremality, when the two horizons collide. Building on arXiv:2402.10162 , we argue that the correction term corresponds to a complex saddle geometry of the bulk gravitational path integral. The proposed geometry has a negative boundary length and caps off at the inner horizon; we refer to it as the inner horizon saddle. We discuss how the saddle, and its accompanying minus sign, contribute to the density of states through a Picard-Lefschetz analysis of the inverse Laplace contour, together with a stability analysis of the saddle. We also address the inner horizon saddle's violation of the Kontsevich-Segal-Witten (KSW) allowability criterion for the inclusion of complex metrics. Despite this violation, which is believed to cause unphysical divergences in path integral computations, one can describe one-loop effects on the inner horizon saddle by carefully treating wrong-sign modes. Motivated by this observation, we propose a weaker version of the KSW criterion, which we call the spectral KSW criterion. Its purpose is to characterize when one-loop corrections around complex gravitational saddles are well defined.", "url": "https://arxiv.org/abs/2605.08335", "type": "理论", "summary": "1. 本文基于JT引力标准结果，指出近极端带电黑洞的贝肯斯坦-霍金熵修正项源自内视界面积指数负值，该修正通过复鞍点几何实现。\n2. 核心技术卖点是提出内视界鞍点：具有负边界长度并在内视界处截断的复几何，通过Picard-Lefschetz分析和逆拉普拉斯轮廓分析其态密度贡献与稳定性。\n3. 该工作揭示了内视界鞍点违反原KSW可允许性判据但单圈效应仍可定义，进而提出谱KSW判据，用于表征复引力鞍点单圈修正的良定性。", "summary_source": "deepseek", "authors": [{"name": "Jacqueline Caminiti"}, {"name": "Aidan Herderschee"}], "featured_authors": [{"name": "Jacqueline Caminiti"}, {"name": "Aidan Herderschee"}], "author_count": 2}, {"id": "2605.08339", "category": "hep-th", "title": "Charge Transport in Magnetized Holographic $\\mathcal{M}$-QGP", "abstract": "We investigate DC transport in a top-down construction of thermal QGP-like theories using a holographic M-theoretic background, incorporating quartic curvature corrections. The DC and Hall conductivities are computed from the Dirac-Born-Infeld (DBI) action of the corresponding type-IIA probe D6 flavor branes via the reality condition method proposed in arXiv:0708.1994 and arXiv:0705.3870 . We further analyze pair-production contributions in the presence and absence of an external magnetic field and work out regimes where pair production dominates over charge carrier transport. These findings extend earlier AdS/CFT results to non-conformal, higher-derivative settings relevant to thermal QGP-like theories.", "url": "https://arxiv.org/abs/2605.08339", "type": "理论", "summary": "1. 该工作在全息M理论背景下，利用四次曲率修正的顶-下构造研究了磁化热QGP类理论中的直流输运性质。\n2. 其核心在于通过D6味膜DBI作用量结合实性条件方法计算DC和霍尔电导率，并解析了外磁场下对产生与载流子输运的竞争机制。\n3. 这为将AdS/CFT对应推广至非共形、含高阶导数修正的热QGP类体系提供了新的理论基准。", "summary_source": "deepseek", "authors": [{"name": "Shivam Singh Kushwah"}], "featured_authors": [{"name": "Shivam Singh Kushwah"}], "author_count": 1}, {"id": "2605.08347", "category": "hep-th", "title": "Entanglement islands, fuzzballs and stretched horizons", "abstract": "We study the implementation of the island prescription in fuzzball-inspired models of black holes. As a simplified setup, we model a fuzzball by replacing the event horizon with a reflecting boundary (stretched horizon). In the framework of two-dimensional model with such boundary, we analyze the dynamics of entanglement entropy. We find that the presence of the boundary modifies the behavior of the island saddle, and for a range of parameter values we observe the effect of blinking island found in arXiv:2311.16244 which inevitably leads to the analogue of information paradox. We then extend the analysis to higher dimensions, incorporating both bulk and boundary contributions to the generalized entropy. The existence of island solutions is found to depend sensitively on the boundary conditions and the position of the stretched horizon, naturally leading to the absence of entanglement islands for a wide range of parameters. Finally, we consider more \"realistic\" stringy fuzzball geometries, including superstrata and bubbling solutions, and estimate whether island solutions can arise in these backgrounds. The results indicate that the existence of islands depends on the behavior of the geometric area near the cap, and is not guaranteed in general.", "url": "https://arxiv.org/abs/2605.08347", "type": "理论", "summary": "1. 该工作以反射边界模拟拉伸视界建立fuzzball简化模型，在二维及高维框架下分析岛屿方案下的纠缠熵动力学，并推广至超链状与气泡型弦论几何。\n2. 其核心发现是边界条件改变岛屿鞍点行为并诱发闪烁岛屿效应，导致信息悖论类似物重现，且岛屿存在性敏感依赖于拉伸视界位置与几何帽区面积。\n3. 这为岛屿方案在现实fuzzball背景中的适用性设定了约束，并启示岛屿与fuzzball机制在信息悖论中的互补关系需依赖具体参数区。", "summary_source": "deepseek", "authors": [{"name": "Dmitry S. Ageev"}, {"name": "Anastasia N. Zueva"}], "featured_authors": [{"name": "Dmitry S. Ageev"}, {"name": "Anastasia N. Zueva"}], "author_count": 2}, {"id": "2605.08822", "category": "hep-th", "title": "Bogomol'nyi Equations in Mixed Product Chern-Simons Theories Governing Charged Vortices and Antivortices", "abstract": "We extend product Chern-Simons theory to develop several mixed $U(1)\\times U(1)$ models where one gauge field is governed by a Chern-Simons term and the other by a Maxwell or Born-Infeld term. We show that, by choosing suitable potentials, the energy functional admits a topological lower bound saturated by first-order self-dual equations. The resulting dyonic systems can be divided into vortex-vortex and vortex-antivortex configurations, and the coexistence of vortices and antivortices in the latter extends the vortex-only result known in product Chern-Simons model. On a doubly periodic domain, we establish Bradlow-type bounds with distinct physical implications: for vortex-only systems, the vortex numbers stay below this bound and cannot be arbitrarily large; for vortex-antivortex systems, the bound is imposed on the difference between the vortex and antivortex numbers, while the individual numbers are arbitrary. This distinction results in a bounded energy spectrum for the former and an unbounded energy spectrum for the latter.", "url": "https://arxiv.org/abs/2605.08822", "type": "理论", "summary": "1. 本文将乘积Chern-Simons理论扩展至混合U(1)×U(1)模型，其中一规范场由Chern-Simons项主导，另一由Maxwell或Born-Infeld项主导，并导出了自对偶方程。\n2. 通过选择合适势能，系统能量泛函满足拓扑下界，得到涡旋-涡旋与涡旋-反涡旋两类构型；双周期域上前者涡旋数受Bradlow上限约束，后者仅对涡旋与反涡旋数之差施加上界，导致能量谱有界与无界的根本区别。\n3. 该工作为研究混合规范场动力学中涡旋-反涡旋共存系统的拓扑性质提供了理论框架，并可能激发相关缺陷系统在凝聚态与高能物理中的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Aonan Xu"}], "featured_authors": [{"name": "Aonan Xu"}], "author_count": 1}, {"id": "2605.09612", "category": "hep-th", "title": "Non-Abelian monopoles in modified gravity", "abstract": "Within modified gravity, we study static spherically and axially symmetric self-gravitating non-Abelian monopoles in $SU(2)$ Yang-Mills-Higgs theory. By comparing these monopoles with those obtained in Einstein-Yang-Mills-Higgs theory, we identify the differences introduced by the modification of gravity and show that they can be quite significant for systems with strong Higgs self-coupling.", "url": "https://arxiv.org/abs/2605.09612", "type": "理论", "summary": "1. 该工作在修正引力框架下，研究了SU(2)杨-米尔斯-希格斯理论中静态球对称与轴对称自引力非阿贝尔单极子。\n2. 通过对比爱因斯坦-杨-米尔斯-希格斯理论中的对应解，揭示了强希格斯自耦合情形下引力修正对单极子结构产生的显著影响。\n3. 这为探索引力修正对拓扑孤子性质的影响提供了明确途径，并可能关联到超出广义相对论的宇宙学与粒子物理现象。", "summary_source": "deepseek", "authors": [{"name": "Vladimir Dzhunushaliev"}, {"name": "Vladimir Folomeev"}], "featured_authors": [{"name": "Vladimir Dzhunushaliev"}, {"name": "Vladimir Folomeev"}], "author_count": 2}, {"id": "2605.09736", "category": "hep-th", "title": "Taming the infrared in de Sitter space: autonomous equations, stochastic approach, and Borel resummation", "abstract": "We investigate the divergent perturbative series of correlation functions for a massless, self-interacting scalar field in de Sitter space. First, we use our previously proposed method of autonomous equations to obtain finite time-dependent functions, and show that these functions approximate the time evolution of the correlation functions of the stochastic theory reasonably well. Second, we apply the technique of autonomous equations to the Borel-Le Roy transforms of correlation functions, and use solutions of these equations to perform Borel resummation. The results match the time evolution obtained in the stochastic picture substantially better. In addition, we propose an alternative method for extracting perturbative coefficients and provide a new derivation of our autonomous equation by truncating a system of Schwinger-Dyson-type differential equations.", "url": "https://arxiv.org/abs/2605.09736", "type": "理论", "summary": "1. 该工作针对de Sitter时空中无质量自相互作用标量场相关函数的红外发散微扰级数，利用自治方程获得有限时间依赖函数，并验证其与随机理论时间演化的近似一致性。\n2. 核心突破在于将自治方程应用于Borel-Le Roy变换，通过求解变换后方程进行Borel重求和，所得演化与随机图像匹配显著提升，并提出了微扰系数提取及自治方程的新推导。\n3. 此方案为弯曲时空量子场论中红外发散的系统非微扰处理提供了可靠框架，可推广至其他强耦合或动力学问题。", "summary_source": "deepseek", "authors": [{"name": "Alexander Kamenshchik"}, {"name": "Polina Petriakova"}, {"name": "Tereza Vardanyan"}], "featured_authors": [{"name": "Alexander Kamenshchik"}, {"name": "Polina Petriakova"}, {"name": "Tereza Vardanyan"}], "author_count": 3}, {"id": "2605.09804", "category": "hep-th", "title": "Joint distributions of eigenvectors of symmetric random tensors", "abstract": "We compute the joint distributions of arbitrary numbers of eigenvectors of real and complex symmetric random tensors by the quantum field theoretical methods which were previously used to compute the mean distributions. We obtain the random matrix representations and the large-dimension asymptotics of the joint distributions. The latter can be expressed by a common function of tensor geometries, extending the universality found for the mean distributions to the joint distributions. Several crosschecks of our results are carried out by Monte Carlo computations.", "url": "https://arxiv.org/abs/2605.09804", "type": "理论", "summary": "1. 该工作利用量子场论方法计算了实与复对称随机张量任意数量特征向量的联合分布。\n2. 其技术核心在于获得了联合分布的随机矩阵表示与大维度渐近形式，并由张量几何公共函数统一表达，将均值分布普适性推广至联合分布。\n3. 这为理解随机张量特征向量统计关联提供了理论框架，或可启发高维数据统计与量子混沌中的随机矩阵普适性研究。", "summary_source": "deepseek", "authors": [{"name": "Naoki Sasakura"}], "featured_authors": [{"name": "Naoki Sasakura"}], "author_count": 1}, {"id": "2605.09868", "category": "hep-th", "title": "Double fibration in G-theory and the cobordism conjecture", "abstract": "We investigate Type IIB compactifications with spatially varying fluxes and dilaton profiles in the setting of dynamical cobordism. In particular, we analyze a G-theory motivated compactification in which the fluxes and the dilaton depend on coordinates of a complex two-dimensional plane. From the equations of motion, we deduce the existence of End of the World branes. In a cohomological interpretation, these branes appear precisely in order to trivialize the relevant cohomology class. Furthermore, we compute the associated bordism group and show that additional non-perturbative objects are needed to cancel the class, while retaining the cohomological contribution as a subgroup. This suggests a mathematical structure that connects energy scales with the emergence of perturbative and non-perturbative physics.", "url": "https://arxiv.org/abs/2605.09868", "type": "理论", "summary": "1. 该工作以动态cobordism为框架，研究G-理论启发的IIB型紧致化，其中通量和膨胀子依赖于二维复坐标，并从运动方程推导出世界末日膜的存在。\n2. 其核心在于上同调诠释表明这些膜平凡化相关上同调类，且bordism群计算揭示额外非微扰对象的必要性，同时子群保留上同调贡献。\n3. 这揭示了连接能量尺度与微扰/非微扰物理涌现的数学结构，为动态cobordism与弦论紧致化的统一提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Cesar Damian"}, {"name": "Oscar Loaiza-Brito"}, {"name": "Víctor M. López-Ramos"}], "featured_authors": [{"name": "Cesar Damian"}, {"name": "Oscar Loaiza-Brito"}, {"name": "Víctor M. López-Ramos"}], "author_count": 3}, {"id": "2605.09947", "category": "hep-th", "title": "The Free Particle--Oscillator--Inverted Oscillator Triangle: Conformal Bridges, Metaplectic Rotations and $\\mathfrak{osp}(1|2)$ Structure", "abstract": "We study the free particle (FP), the harmonic oscillator (HO) and the inverted harmonic oscillator (IHO) as parabolic, elliptic and hyperbolic realizations of one conformal/metaplectic structure, naturally extended to the superconformal algebra $\\mathfrak{osp}(1|2)$. Since the corresponding self-adjoint Hamiltonians have different spectra, the relations between them are not ordinary unitary equivalences. They are instead bridge transformations between different realizations of the same conformal module. We show that the zero-energy Jordan states of the FP are mapped to HO bound states and to the two IHO Gamow families, while FP plane waves are mapped to HO coherent states and, after light-cone Mellin decomposition, to the IHO scattering data. The direct FP--IHO bridge is a real metaplectic quarter-rotation, in contrast with the stationary FP--HO conformal bridge, which is nonunitary in the Schrödinger representation but becomes unitary as a change of polarization to the Fock--Bargmann representation. The IHO transmission and reflection amplitudes are obtained as Fourier--Mellin connection coefficients, equivalently as Weber/Stokes connection data. We also describe the hyperbolic Cayley--Niederer map for the time-dependent Schrödinger equation, the Wigner/separatrix picture, and the coherent-state and Bogoliubov-transformation aspects of the construction. Some physical applications of the hyperbolic sector are briefly discussed, including quantum Hall saddle scattering, Schwinger-type production, Rindler/Unruh and near-horizon Hawking settings, and Berry--Keating/inverse-square structures.", "url": "https://arxiv.org/abs/2605.09947", "type": "理论", "summary": "1. 该工作将自由粒子、谐振子和反谐振子统一为同一共形/元相结构的抛物线、椭圆与双曲实现，并建立它们之间的桥变换关系。\n2. 核心在于发现自由粒子的零能约旦态映射为谐振子束缚态与反谐振子Gamow衰变态，平面波映射为相干态及经光锥Mellin分解后的散射数据，且直接桥变换对应实元相四分之一旋转。\n3. 这为量子霍尔鞍点散射、Schwinger粒子产生、Rindler/Unruh效应及近视界Hawking辐射等双曲物理场景提供了统一的代数框架与变换机制。", "summary_source": "deepseek", "authors": [{"name": "Andrey Alcala"}, {"name": "Mikhail S. Plyushchay"}], "featured_authors": [{"name": "Andrey Alcala"}, {"name": "Mikhail S. Plyushchay"}], "author_count": 2}, {"id": "2605.10232", "category": "hep-th", "title": "Bulk-Edge Correspondence via Higher Gauge Theory", "abstract": "More profound than bulk topological order of quantum materials is only its unwinding via gapless excitations along boundaries of the sample. We recast this bulk-edge correspondence -- for the experimentally relevant case of fractional quantum Hall (FQH) systems -- in terms of effective relative higher gauge theory, controlled by choices of classifying fibrations. For FQH systems, we identify the complex Hopf fibration as classifying the bulk/boundary topological effects, and find that it yields a non-Lagrangian reconstruction of Floreanini-Jackiw/Wess-Zumino-Witten chiral edge currents. Remarkably, the resulting effective FQH higher gauge theory turns out to be \"geometrically engineered\" on M2/M5-branes probing A-type orbi-singularities in 11D supergravity, globally completed by flux-quantization in twisted equivariant differential (TED) Cohomotopy: Here the M-string ends of M2-branes on M5-branes engineer the FQH liquid's boundary. This geometric engineering on M-branes might naturally elucidate the curious combination of $W_\\infty$-symmetry and of super-symmetry that is known to govern the collective excitations of FQH liquids at long wavelengths.", "url": "https://arxiv.org/abs/2605.10232", "type": "理论", "summary": "1. 该工作将分数量子霍尔体系的体边对应重述为受分类纤维化（复Hopf纤维化）控制的有效相对高级规范理论。\n2. 其核心卖点是利用M2/M5膜探测A型奇点的几何工程，在扭等变微分上同伦通量量子化下导出非拉格朗日手性边界流。\n3. 这为从M理论弦论视角自然阐明FQH液体长波集体激发中W∞对称性与超对称性的纠缠提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Hisham Sati"}, {"name": "Urs Schreiber"}], "featured_authors": [{"name": "Hisham Sati"}, {"name": "Urs Schreiber"}], "author_count": 2}, {"id": "2605.10416", "category": "hep-th", "title": "Infrared spectra of some strongly--coupled chiral gauge theories", "abstract": "Several simple asymptotically-free chiral gauge theories are studied. The only ``free parameters'' of our models are the choice of the gauge group and the matter Weyl fermion representations, and the relative magnitudes of the renormalization-group-invariant scales $\\Lambda_i$ associated with each gauge group. None of our models has nontrivial nonabelian global symmetries (``family''--like fermion representations). We rely on some recent theoretical developments on the dynamics of strongly--coupled chiral gauge theories, based on the generalized symmetries and associated new types of anomaly-matching consideration, but also on the solid knowledge on vectorlike gauge theories such as QCD and supersymmetric Yang-Mills theories. The structures of the infrared effective theories, the RG flows, and the light spectra found in these models are surprisingly rich and intriguing.", "url": "https://arxiv.org/abs/2605.10416", "type": "理论", "summary": "1. 该工作研究了几类渐近自由手征规范理论的红外有效理论、重整化群流及轻粒子谱。\n2. 其核心在于运用广义对称性与新型异常匹配条件，并借鉴矢量规范理论的可靠知识，揭示无族对称性手征模型的丰富动力学结构。\n3. 这为理解强耦合手征规范理论的红外行为及探索其可能的质量生成机制提供了系统框架与明确启发。", "summary_source": "deepseek", "authors": [{"name": "Stefano Bolognesi"}, {"name": "Kenichi Konishi"}, {"name": "Matteo Orso"}], "featured_authors": [{"name": "Stefano Bolognesi"}, {"name": "Kenichi Konishi"}, {"name": "Matteo Orso"}], "author_count": 3}, {"id": "2605.10548", "category": "hep-th", "title": "Birth of Inflationary Universes via Wineglass Wormholes and their No-Boundary Relatives", "abstract": "We study Euclidean wineglass wormholes, which mediate the nucleation of inflationary spacetimes from an existing spacetime with asymptotically flat or Anti-de Sitter regions. These wormholes are distinguished by the presence of a local maximum of the scale factor, which allows the analytically continued Lorentzian spacetime to expand after materialization. We present explicit numerical wormhole solutions supported either by an axionic field or a magnetic gauge field, in both cases in conjunction with a self-interacting scalar field. More exotic solutions, with multiple extrema of the scale factor, are also described. As we discovered recently, in the limit of small axionic or magnetic charge, wineglass wormhole solutions split into two separate geometries, one being the background spacetime and the other a disconnected no-boundary instanton. We study the associated topology changing transition in detail and provide an extensive discussion of both the properties and puzzles exhibited by this common family of wineglass/no-boundary instantons.", "url": "https://arxiv.org/abs/2605.10548", "type": "理论", "summary": "1. 该工作研究了欧几里得酒杯虫洞及其与无边瞬子的关系，这些虫洞介导暴胀时空从渐近平坦或反德西特背景中的成核过程。\n2. 卖点在于虫洞具有尺度因子局部极大值，允许洛伦兹延拓后膨胀，且在小轴子或磁荷极限下虫洞解分裂为背景时空与断开的无边瞬子。\n3. 这为暴胀宇宙起源的拓扑变化机制提供了明确求解路径，并揭示了家族瞬子共同性质与未解谜题。", "summary_source": "deepseek", "authors": [{"name": "George Lavrelashvili"}, {"name": "Jean-Luc Lehners"}], "featured_authors": [{"name": "George Lavrelashvili"}, {"name": "Jean-Luc Lehners"}], "author_count": 2}, {"id": "2605.10662", "category": "hep-th", "title": "On the Casimir effect with mixed dynamical edge mode and perfect electromagnetic conducting boundary conditions", "abstract": "We study the Casimir effect for a parallel plate setup with one plate with dynamical edge mode (DEM) boundary conditions, and one plate with perfect electromagnetic conductor (PEMC) boundary conditions. In order to restore BRST invariance, new edge fields are introduced on the DEM plate. We then lift the boundary conditions into the action using Lagrange multiplier fields, and integrate out the bulk fields to obtain a non-local effective boundary theory from which we compute the Casimir energy. The resulting Casimir force is identical to a PMC-PEMC setup, implying that, from the point of view of the Casimir effect, a DEM plate is equivalent to a PMC plate. We also include a detailed derivation of the general functional method used to compute the Casimir energy from the partition function.", "url": "https://arxiv.org/abs/2605.10662", "type": "理论", "summary": "1. 该工作计算了平行板结构中一面为动态边缘模式(DEM)边界条件、另一面为完美电磁导体(PEMC)边界条件的卡西米尔效应。\n2. 其技术关键在于引入边缘场恢复BRST不变性，并用拉格朗日乘子将边界条件提升到作用量中，通过积分掉体场得到非局域有效边界理论，揭示了DEM板与PMC板在卡西米尔效应中的等价性。\n3. 这一结果为利用功能积分方法统一处理各类复杂边界条件下的卡西米尔问题提供了框架，并可推广至其他量子涨落现象。", "summary_source": "deepseek", "authors": [{"name": "Jarne Devroe"}, {"name": "David Dudal"}, {"name": "Sebbe Stouten"}], "featured_authors": [{"name": "Jarne Devroe"}, {"name": "David Dudal"}, {"name": "Sebbe Stouten"}], "author_count": 3}, {"id": "2605.10720", "category": "hep-th", "title": "Regularized Master-Field Approximation for Large-$N$ Reduced Matrix Models", "abstract": "We propose a numerical method based on the master field for large-$N$ reduced matrix models. While the master field is originally an infinite-dimensional matrix, in this method it is regularized to a finite dimension, with the requirement that it satisfies the loop equations as much as possible. This formulation can be directly implemented for numerical computation, and since there is no sign problem at the fundamental level, the method can be applied regardless of whether the model is of Euclidean or Minkowski type. In numerical calculations for one- and two-matrix models, the exact solution is well reproduced in the Euclidean case, while perturbative results are well reproduced in the Minkowski case. This demonstrates the effectiveness of the method and supports the idea that the matrix models studied in this paper admit a regularized master-field description.", "url": "https://arxiv.org/abs/2605.10720", "type": "理论", "summary": "1. 该工作提出了针对大N约化矩阵模型的正则化主场数值近似方法，将无限维主场截断为有限维矩阵。\n2. 其技术卖点在于通过强制满足圈方程实现无符号问题的数值计算，且同时适用于欧氏与闵氏时空的矩阵模型。\n3. 这为矩阵模型存在正则化主场描述提供了数值证据，并启发该方法向其他强耦合系统的推广。", "summary_source": "deepseek", "authors": [{"name": "Reishi Maeta"}], "featured_authors": [{"name": "Reishi Maeta"}], "author_count": 1}, {"id": "2605.10735", "category": "hep-th", "title": "Axion-Scalar Dynamics: from the Distance Conjecture to Cosmic Acceleration", "abstract": "We discuss the cosmology of axion-scalar systems in asymptotic limits of type IIB/F-theory flux compactifications. These results allow us to test a putative extension of the Distance Conjecture in a dynamical setting, which posits that towers of states should become exponentially light in the distance measured along the trajectory (as well as in the geodesic one). In the case of infinite distance limits, we review a known classification of late-time asymptotic solutions, which always verify the extension of the conjecture whenever all relevant effects are taken into account. We also extend the analysis to the case of finite distance limits, where the analogous statement would require trajectories approaching the singularity to have a finite length. Surprisingly, we find this is not the case for the class of models under consideration. Moreover, the new solutions we find exhibit asymptotic accelerated expansion when approaching the boundary of moduli space.", "url": "https://arxiv.org/abs/2605.10735", "type": "理论", "summary": "1. 该工作系统研究了IIB/F理论通量紧致化中轴子-标量系统在模空间渐近极限下的宇宙学，并检验了距离猜想的动力学延拓版本。\n2. 其核心发现在于有限距离极限下，距离猜想的轨迹有限长度要求并不成立，同时新解在接近模空间边界时展现出渐近加速膨胀行为。\n3. 这为距离猜想的动力学适用性提供了约束，并为弦论框架下实现宇宙加速膨胀开辟了新的可能途径。", "summary_source": "deepseek", "authors": [{"name": "Filippo Revello"}], "featured_authors": [{"name": "Filippo Revello"}], "author_count": 1}, {"id": "2605.10786", "category": "hep-th", "title": "Krylov state complexity for BMN matrix model", "abstract": "We explore Krylov complexity in the BMN matrix model following a systematic reduction of it, known as the pulsating fuzzy sphere model. We present an analytical setup that allows us to calculate Lanczos coefficients in both large and small deformation limits of the matrix model.", "url": "https://arxiv.org/abs/2605.10786", "type": "理论", "summary": "1. 该工作通过约化脉动模糊球模型，在BMN矩阵模型中解析研究了Krylov状态复杂度。\n2. 其核心卖点在于建立了可同时计算大形变与小形变极限下Lanczos系数的解析框架。\n3. 这为精确理解矩阵模型中量子混沌的尺度行为及全息对偶提供了系统性的理论工具。", "summary_source": "deepseek", "authors": [{"name": "Dibakar Roychowdhury"}], "featured_authors": [{"name": "Dibakar Roychowdhury"}], "author_count": 1}, {"id": "2605.10902", "category": "hep-th", "title": "Parafermionizing the Monster", "abstract": "We study the parafermionization of the Monster CFT with respect to its $\\mathbb{Z}_{pA}$ subgroups, with $p$ an odd prime. Under certain assumptions, we show that the parafermionization is equal to a non-invertible gauging of $\\mathcal{P}(p) \\times \\mathcal{P}(p)^\\vee$, where $\\mathcal{P}(p)$ is the theory of $\\mathbb{Z}_p$-parafermions and $\\mathcal{P}(p)^\\vee$ is an appropriate dual theory, with global symmetry characterized by the centralizer of $\\mathbb{Z}_{pA}$. By tracking the symmetries of $\\mathcal{P}(p) \\times \\mathcal{P}(p)^\\vee$ through the non-invertible gauging, we argue that the diagonal Monster CFT has $\\mathrm{Rep}(\\mathfrak{so}(3)_p) \\boxtimes \\mathrm{Rep}(\\mathfrak{so}(3)_p)^\\mathrm{op}$ symmetry, and hence that the holomorphic Monster theory has symmetry $\\mathrm{Rep}(\\mathfrak{so}(3)_p)$. We then compute the defect McKay-Thompson series associated to these symmetries, and prove that their invariance subgroups are $\\Gamma_1(p+2)$.", "url": "https://arxiv.org/abs/2605.10902", "type": "理论", "summary": "1. 该工作对Monster共形场论关于其奇素数p阶循环子群的准费米子化进行了系统研究。\n2. 其核心在于证明该过程等价于对P(p)×P(p)^∨的非可逆规范操作，并从对称性跟踪中导出Monster CFT具有Rep(so(3)_p)⊗Rep(so(3)_p)^op对称性。\n3. 所得缺陷McKay-Thompson级数的不变子群Γ_1(p+2)为深入理解Monster理论的模属性与对称性结构提供了关键约束。", "summary_source": "deepseek", "authors": [{"name": "Yamato Honda"}, {"name": "Justin Kaidi"}, {"name": "Ippo Orii"}], "featured_authors": [{"name": "Yamato Honda"}, {"name": "Justin Kaidi"}, {"name": "Ippo Orii"}], "author_count": 3}, {"id": "2605.08372", "category": "math-ph", "title": "Dispersive decay bounds for the SSH model on the half-line", "abstract": "We study the Schrödinger flow for the SSH model, a class of self-adjoint discrete dimer lattice Hamiltonians on the half-line. Using oscillatory integral techniques, we prove dispersive time-decay estimates, which quantify the spreading of energy throughout the lattice for a localized initial condition. Furthermore, we determine precise dependence of the constants in the decay rates on the parameters of the Hamiltonian. The analysis is complicated by the fact that as a consequence of the boundary condition, the expression for the propagator contains oscillatory integrals with nonintegrable singularities.", "url": "https://arxiv.org/abs/2605.08372", "type": "理论", "summary": "1. 该工作证明了半直线上SSH模型自伴离散二聚体晶格哈密顿量的薛定谔流色散时间衰减估计，量化了局域初始条件下能量在晶格中的扩散行为。\n2. 核心卖点在于利用振荡积分技术处理边界条件导致传播子表达式中出现的非可积奇点，并精确确定衰减率常数对哈密顿量参数的依赖关系。\n3. 这一结果为理解边界效应对一维拓扑晶格中波包演化的影响提供了定量框架，可启发后续关于边界态动力学与色散特性的研究。", "summary_source": "deepseek", "authors": [{"name": "Remy Kassem"}, {"name": "Amir Sagiv"}, {"name": "Michael I. Weinstein"}], "featured_authors": [{"name": "Remy Kassem"}, {"name": "Amir Sagiv"}, {"name": "Michael I. Weinstein"}], "author_count": 3}, {"id": "2605.08481", "category": "math-ph", "title": "A mathematical study of periodic band inversion", "abstract": "We give a mathematical analysis of the periodic band inversion phenomenon observed by Tan--Devakul for an electron in a two-dimensional periodic potential coupled to a circularly polarized photon cavity mode. In the strong-coupling limit, we derive an effective Bloch Hamiltonian and prove convergence of the low-lying bands. For a cosine potential, we explain the periodic closing and reopening of the first spectral gap, prove the existence and generic persistence of Dirac cones at the gap-closing points, and compute the Chern numbers associated to isolated band clusters. We also show that higher isolated band clusters cannot persist in the small-coupling regime. Finally, we resolve an apparent sign discrepancy between Berry curvature computations and Chern numbers by tracking the descent from the covering space to the Brillouin torus.", "url": "https://arxiv.org/abs/2605.08481", "type": "理论", "summary": "1. 该文对二维周期势中电子与圆极化光子腔模耦合导致的周期带反转现象进行了严格数学分析。\n2. 在强耦合极限下导出有效Bloch哈密顿量并证明低能带收敛，解释了余弦势下第一谱隙周期性闭合与重开，证明了狄拉克锥的存且及孤立带簇的陈数计算。\n3. 这为理解光-物质相互作用中拓扑相变的数学结构提供了严格框架，并解决了贝里曲率计算与陈数间的符号歧义。", "summary_source": "deepseek", "authors": [{"name": "Tyler Guo"}, {"name": "Maciej Zworski"}], "featured_authors": [{"name": "Tyler Guo"}, {"name": "Maciej Zworski"}], "author_count": 2}, {"id": "2605.08652", "category": "math-ph", "title": "Quantum Relative Entropy and the Mean-Field Limit", "abstract": "We develop a quantum relative entropy method for the mean-field limit of quantum many-body systems. For closed systems governed by the von Neumann equation, we prove a quantitative stability estimate between the $N$-body density matrix and the tensorized solution of the Hartree equation. The argument is based on an entropy production identity, a cancellation mechanism for the centered two-body fluctuation, and a combinatorial estimate controlling the remaining mixed moments. As a consequence, we obtain propagation of chaos in trace norm for fixed marginals. We further combine the entropy estimate with known semiclassical Wasserstein bounds to derive a convergence estimate that is uniform in the Planck constant in an appropriate joint mean-field and semiclassical regime. Finally, we extend the method to finite-dimensional open quantum systems governed by Lindblad dynamics. In this setting, we establish an analogous relative entropy estimate for general bounded two-body interactions, where the mean-field potential is defined through partial trace. This shows that the entropy method does not rely on any special tensor-product decomposition of the interaction.", "url": "https://arxiv.org/abs/2605.08652", "type": "理论", "summary": "1. 该工作提出基于量子相对熵的方法，研究封闭与开放量子多体系统的平均场极限，针对von Neumann方程证明N体密度矩阵与Hartree张量化解在迹范数下的定量稳定性，并导出固定边缘的混沌传播。\n2. 技术核心包括熵产生恒等式、中心化两体涨落的抵消机制、控制高阶混合矩的组合估计，并结合半经典Wasserstein界获取关于普朗克常数一致的收敛估计，且方法推广至Lindblad开放系统。\n3. 该熵方法适用于一般有界两体相互作用，不依赖相互作用的张量积分解，为平均场极限的严格定量分析及其与半经典极限的统一处理提供了普适框架。", "summary_source": "deepseek", "authors": [{"name": "Gaoyue Guo"}, {"name": "Hao Liang"}, {"name": "Zhenfu Wang"}], "featured_authors": [{"name": "Gaoyue Guo"}, {"name": "Hao Liang"}, {"name": "Zhenfu Wang"}], "author_count": 3}, {"id": "2605.08867", "category": "math-ph", "title": "Picard-Lefschetz theory and alien calculus: a case study", "abstract": "We compare Picard--Lefschetz theory and resurgence in three basic one-dimensional exponential integrals: the Airy model, the Bessel model, and the Gamma model. On the Picard--Lefschetz side, we describe the Lefschetz thimbles and compute the connecting trajectories between critical points appearing at Stokes phases. On the resurgent side, we analyze the Borel singularities of the saddle expansions and use alien operators to recover the same Stokes coefficients. These examples serve as explicit finite-dimensional test cases for the dictionary between thimble wall-crossing and alien calculus.", "url": "https://arxiv.org/abs/2605.08867", "type": "理论", "summary": "1. 该工作通过Airy、Bessel和Gamma三种指数积分模型，系统比较了Picard-Lefschetz理论与重生理论中的Stokes现象。\n2. 其核心在于精确匹配Lefschetz thimbles的壁穿越与alien算子计算得到的Stokes系数，建立了两种形式主义的显式字典。\n3. 这一有限维严格对应关系为量子场论和弦论中更高维鞍点展开的Stokes相变分析提供了可验证的数学框架。", "summary_source": "deepseek", "authors": [{"name": "Si Li"}, {"name": "Yong Li"}, {"name": "Xinxing Tang"}], "featured_authors": [{"name": "Si Li"}, {"name": "Yong Li"}, {"name": "Xinxing Tang"}], "author_count": 3}, {"id": "2605.09062", "category": "math-ph", "title": "Scaling Symmetries and Conformal Relative Equilibria on Poisson Manifolds, with Applications to Lie--Poisson Systems", "abstract": "We investigate conformal relative equilibria for Hamiltonian systems on exact Poisson manifolds equipped with scaling symmetries. By introducing conformally Poisson actions and conformal momentum maps, we characterize these equilibria through an augmented Hamiltonian formulation; in the nondegenerate case, this recovers the conditions recently developed for the exact symplectic case. Specializing to Lie--Poisson manifolds, where the natural scaling action canonically provides an exact Poisson structure on the dual of any finite-dimensional Lie algebra, we establish a purely algebraic criterion: a homogeneous Hamiltonian system admits a nontrivial conformal relative equilibrium if and only if the underlying Lie algebra contains a hyperbolic element. This yields a complete classification in dimension three via the Bianchi classification. As a prominent application, we show that nontrivial conformal relative equilibria emerge in the dynamics on $\\mathfrak{so}(2,1)^*$, but are strictly obstructed for the classical free rigid body on $\\mathfrak{so}(3)^*$.", "url": "https://arxiv.org/abs/2605.09062", "type": "理论", "summary": "1. 该工作通过引入共形泊松作用与共形动量映射，将精确泊松流形上具有尺度对称性的哈密顿系统的共形相对平衡表征为增广哈密顿形式，并在非退化情形下恢复精确辛结论。\n2. 其核心卖点是建立了纯代数判据：齐次哈密顿系统存在非平凡共形相对平衡当且仅当底层李代数含双曲元素，并借助Bianchi分类完成三维情形的完整分类。\n3. 该判据揭示了so(2,1)*与so(3)*上经典自由刚体动力学中此类平衡存在性的本质差异，为尺度对称系统中的平衡结构研究提供了可推广的代数检验框架。", "summary_source": "deepseek", "authors": [{"name": "Manuele Santoprete"}], "featured_authors": [{"name": "Manuele Santoprete"}], "author_count": 1}, {"id": "2605.09122", "category": "math-ph", "title": "An exact spacetime polymer gas for finite-temperature $\\mathbb Z_N$ homological quantum code", "abstract": "We study finite-temperature $P$-form $\\mathbb Z_N$ homological codes via an exact finite-Trotter quantum-to-classical map to a $(d+1)$-dimensional spacetime model with electric and magnetic topological background charges. The resulting background-resolved partition functions admit an exact reformulation in terms of closed magnetic and electric defect polymers, with opposite-species interactions governed by linking phases. By bounding this complex polymer gas by positive same-species hard-core majorant gases, we obtain an explicit low-activity criterion under which all background-dependent partition functions are uniformly controlled and homologically nontrivial polymers are exponentially suppressed on the scale of the spacetime systole. We also derive an exact higher-form Kramers-Wannier duality exchanging electric and magnetic backgrounds, Wilson and 't Hooft operators, and $P$-form and $(d-P)$-form theories. Finally, for prime $N$, we identify an exact source-free gauge-theory specialization coupled to the plaquette random-cluster model, which imports sharp phase-transition results on special geometries into the spacetime framework.", "url": "https://arxiv.org/abs/2605.09122", "type": "理论", "summary": "1. 该工作通过精确有限Trotter量子到经典映射，将有限温度P-form Z_N同调码转化为含电、磁拓扑背景荷的(d+1)维时空聚合物气体模型。\n2. 技术核心是利用正同类硬核主导气体约束背景依赖的磁、电缺陷聚合物系统，导出低活性准则指数抑制同调非平凡缺陷，并推导交换电、磁背景及算符的高阶Kramers-Wannier对偶。\n3. 对于素数N，模型精确约化为耦合至plaquette随机集团模型的无源规范理论，从而将特殊几何上的尖锐相变结果引入时空框架。", "summary_source": "deepseek", "authors": [{"name": "Nafiz Ishtiaque"}, {"name": "Shanto Chakroborty"}], "featured_authors": [{"name": "Nafiz Ishtiaque"}, {"name": "Shanto Chakroborty"}], "author_count": 2}, {"id": "2605.09133", "category": "math-ph", "title": "On Conservative Statistical Riemann Surfaces", "abstract": "We establish a correspondence between information geometry and gauge theory. First, we define an important class of statistical manifolds, that is normalized and satisfies a conservation field equation. Second, we prove that for a conservative statistical structure on an orientable surface, the Chebyshev 1-form is constrained to be harmonic, and the traceless part of the Amari--Chentsov tensor descends to a holomorphic cubic differential. Then, we demonstrate that normalized conservative statistical structures are geometrically generated by solutions to the scalar Tzitzéica equation on Higgs bundles with general linear holonomy, generalizing the Labourie-Loftin correspondence. Finally, we prove that the moduli space of normalized conservative statistical structures on a closed orientable surface of genus at least 2 is completely parameterized by a holomorphic vector bundle over the Teichmüller space, consisting of Abelian differentials and cubic differentials.", "url": "https://arxiv.org/abs/2605.09133", "type": "理论", "summary": "1. 该工作建立了信息几何与规范理论的对应，定义了满足守恒场方程的归一化统计流形，并证明了保守统计结构的关键几何性质。\n2. 其核心在于揭示保守统计流形上Chebyshev 1-形式的调和性及无迹Amari-Chentsov张量退化为全纯三次微分，并通过Tzitzéica方程与一般线性和乐Higgs丛生成此类结构。\n3. 这为闭环可定向曲面上保守统计结构的模空间提供了全纯向量丛参数化，为信息几何与可积系统及量子场论的交叉开辟新途径。", "summary_source": "deepseek", "authors": [{"name": "Hanwen Liu"}], "featured_authors": [{"name": "Hanwen Liu"}], "author_count": 1}, {"id": "2605.09323", "category": "math-ph", "title": "A Bundle-Theoretic Formulation of Phonons in Crystalline Phases", "abstract": "Phonons are usually introduced by choosing a local displacement field. This paper keeps that local description, but identifies the global geometric object represented by it. The aim is not to change the local acoustic equations, but to describe the global configuration space of the translational order parameter on a fixed crystallographic background and to give a globally defined replacement for the displacement gradient. After the orientational part of the crystalline order has been fixed by a reduction of the orthonormal frame bundle to a discrete point group, the translational order parameter is described as a section of an associated torus bundle. In a symmorphic crystal the point group acts on the translation torus linearly, whereas in a nonsymmorphic crystal the action is affine and records the extension class of the crystallographic group. Relative to the fixed point-group bundle, the discreteness of the structure group gives a canonical flat Ehresmann connection on the associated torus bundle. The corresponding covariant differential of the translational field is a globally defined object which locally coincides with the ordinary displacement gradient. This covariant differential is then used to formulate the phonon sector as a first-order Lagrangian field theory. When the flat torus holonomy fixes an equilibrium point, linearization about the corresponding covariantly constant section gives the usual local displacement field. For derivative-only quadratic elastic Lagrangians satisfying the standard objectivity condition, the theory reduces locally to linear elasticity and to the standard acoustic phonon spectrum. If such a global equilibrium section does not exist, the same linear theory is understood locally on defect-free simply connected patches.", "url": "https://arxiv.org/abs/2605.09323", "type": "理论", "summary": "1. 该工作提出了一个基于丛论的声子全局几何描述，将晶体中的平移序参数视为环面丛截面。\n2. 其主要卖点在于利用平坦Ehresmann联络构造位移梯度的全局协变导数，统一处理对称性与非对称性晶体中的点群作用。\n3. 这为在非平凡拓扑晶体或无全局平衡截面体系中理解声子场论提供了基础，并可推广至缺陷附近的线性弹性描述。", "summary_source": "deepseek", "authors": [{"name": "Aleksey Prots"}], "featured_authors": [{"name": "Aleksey Prots"}], "author_count": 1}, {"id": "2605.09605", "category": "math-ph", "title": "Cocycle Actions on Hidden Quantum Markov Models: Symmetry Protection and Topological Order", "abstract": "We develop a symmetry action framework for hidden quantum Markov models (HQMMs) tailored to one-dimensional quantum spin systems and symmetry-protected topological (SPT) phases. In our setting, a symmetry group $G$ acts projectively on the hidden (virtual) degrees of freedom and linearly on the physical observation space, yielding a global HQMM state that is invariant under the combined action of $G$ for both conventional and causal (input--output) structures. We show that such symmetry actions are naturally classified by a group-cohomology $2$-cocycle $[\\omega] \\in H^{2}(G,\\mathrm{U}(1))$, in direct analogy with the standard cohomological classification of one-dimensional bosonic SPT phases via projective edge representations. As an explicit example, we apply this construction to the Affleck--Kennedy--Lieb--Tasaki (AKLT) chain, where the hidden layer carries a nontrivial class $[\\omega] \\in H^{2}(\\mathrm{SO}(3),\\mathrm{U}(1))$ encoding its SPT order. In this case the HQMM formalism reproduces the known SPT properties of the AKLT state while providing a stochastic, Markovian description of the underlying virtual dynamics. Our results establish HQMMs as a natural bridge between quantum stochastic processes, tensor-network descriptions of many-body systems, and symmetry-protected topological order.", "url": "https://arxiv.org/abs/2605.09605", "type": "理论", "summary": "1. 该工作为隐藏量子马尔可夫模型建立了对称性作用框架，专门针对一维量子自旋系统与对称性保护拓扑相。\n2. 其核心在于对称群在虚拟自由度上的投影作用由群上同调2-上闭链分类，直接类比于标准一维SPT相的边缘表示分类，并通过AKLT链实例验证。\n3. 这为量子随机过程、张量网络多体描述与拓扑序三者之间提供了形式化桥梁，启发后续的随机性与拓扑结构交叉研究。", "summary_source": "deepseek", "authors": [{"name": "Abdessatar Souissi"}, {"name": "Abdessatar Barhoumi"}], "featured_authors": [{"name": "Abdessatar Souissi"}, {"name": "Abdessatar Barhoumi"}], "author_count": 2}, {"id": "2605.09812", "category": "math-ph", "title": "Two-parameter classes of exactly solvable quantum systems", "abstract": "We introduce two-parameter classes of exactly-solvable novel systems whose Hamiltonian operators could be represented by tridiagonal symmetric matrices in some orthonormal basis set. The associated wavefunction is written as point-wise convergent series in the basis elements. The expansion coefficients of the series are orthogonal polynomials in the energy that satisfy the resulting three-term recursion relation starting with two-parameter initial values. These polynomials contain all physical information about the system and they depend on the values of the two parameters. However, we could not write down the associated two-parameter potential function analytically but could realize them numerically for a given set of physical parameters. We give several illustrative examples of these systems with continuous and/or discrete energy spectra. Moreover, a curious phenomenon is observed where bound states and/or resonances are induced in a system with pure continuous spectrum (e.g., a free particle) if the two parameters in the initial values exceed certain critical limits.", "url": "https://arxiv.org/abs/2605.09812", "type": "理论", "summary": "1. 该工作构建了两参数族精确可解量子系统，其哈密顿算符在正交基上表示为三对角对称矩阵，波函数为基元中的逐点收敛级数。\n2. 系统全部物理信息由满足两参数初值三项递推关系的正交多项式展开系数决定，虽势函数无解析形式但可数值实现，并给出连续与离散能谱示例。\n3. 发现当两参数初值超过临界值时，可在纯连续谱系统（如自由粒子）中诱导出束缚态或共振，为可调谐量子态操控与精确可解模型拓展提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "A. D. Alh
