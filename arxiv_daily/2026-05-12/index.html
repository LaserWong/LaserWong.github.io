<head>

  <title>arXiv 2026-05-12 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

      <h1>Daily ArXiv Selection</h1>

        数据来自 arXiv 当天的 <code>cond-mat</code>、<code>hep-th</code>、<code>math-ph</code>、<code>quant-ph</code> 四个分类页，口径限定为 <code>New submissions</code>。
        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。
      </p>

  <script>
    const papers = [{"id": "2605.08107", "category": "cond-mat", "title": "Criticality in optical properties of the Drude and Drude-Sommerfeld metals around the plasma frequencies for high carrier concentrations", "abstract": "We have analytically determined the attenuation constant of the Drude metal for the entire range of frequency ($0<\\omega<\\infty$) of an electromagnetic (plane) wave incident on it within a single framework of classical electrodynamics. Here, by the Drude metal, we mean an electrical conductor that obeys the Drude model for the conduction electrons. We further consider the conductor to have linear dielectric and magnetic properties (i.e. permittivity $\\epsilon>\\epsilon_0$ and permeability $\\mu>\\mu_0$) due to the bound charges and bound currents in the background. Interestingly, for such a conductor with a high carrier concentration ($\\omega_p\\tau\\gg1$), we have obtained a simple form of the attenuation constant $k_-\\simeq+\\sqrt{\\frac{\\mu\\epsilon}{2}}\\sqrt{\\omega_p^2-\\omega^2+|\\omega_p^2-\\omega^2|}$ for a wide range of high frequencies below and above plasma frequency $\\omega_p$. Such a result gives rise to criticality in the conductor's optical properties, such as -- the attenuation constant, group velocity, and complex dielectric constant near around $\\omega=\\omega_p$. We have obtained the critical exponents for these quantities. We also have obtained a quantum correction to the optical properties within the Drude-Sommerfeld model with the Thomas-Fermi screening.", "url": "https://arxiv.org/abs/2605.08107", "type": "理论", "summary": "1. 该工作在经典电动力学框架内解析求解了Drude金属在全频段的衰减常数，并揭示了高载流子浓度下等离子频率附近光学性质的临界行为。\n2. 其核心发现是获得了衰减常数在等离子频率上下统一的简洁形式，并提取了相关的临界指数；此外，还通过Thomas-Fermi屏蔽给出了Drude-Sommerfeld模型的量子修正。\n3. 这为理解高载流子浓度导体在等离子频率附近的异常光学响应提供了定量理论基础，并对相关等离激元及超材料研究具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Bikram Keshari Behera"}, {"name": "Rhitabrata Bhattacharyya"}, {"name": "Shyamal Biswas"}], "featured_authors": [{"name": "Bikram Keshari Behera"}, {"name": "Rhitabrata Bhattacharyya"}, {"name": "Shyamal Biswas"}], "author_count": 3}, {"id": "2605.08120", "category": "cond-mat", "title": "Heat Transfer in Phase Change Materials with Multiple Fin Insertion", "abstract": "We leverage 3D numerical simulations to study phase change materials (PCMs) cells under the effect of buoyancy forces. The solid PCM is heated from a source boundary, triggering melting. The source features multiple solid fins that protrude into the PCM cell; the impact of the fins and their number is investigated by designing and testing equivalent (in terms of heating power) finless and single fin simulations. For each configuration, the performance is quantified via the total molten substance in time. The designs were also tested for different values of the non-dimensional numbers encoding relevant properties. We confirm that fins increase the melting performance and find that single fin configurations are sub-optimal since a layout with multiple fins takes advantage of interstitial spaces, melting the substance more efficiently. The results also indicate that fins should be properly spaced, as closeness can result in overlapping, thus interfering, molten areas.", "url": "https://arxiv.org/abs/2605.08120", "type": "理论+数值", "summary": "1. 本工作通过三维数值模拟，研究了浮力作用下含多个翅片的相变材料单元在热源边界加热下的熔化过程。\n2. 其技术要点在于揭示多翅片布局能利用间隙空间实现更高效熔化，而单翅片次优；但翅片过密会导致熔化区域重叠干扰。\n3. 这为优化相变储热系统中翅片几何间距与数量以提升传热性能提供了定量依据。", "summary_source": "deepseek", "authors": [{"name": "Paolo Proia"}, {"name": "Mauro Sbragaglia"}, {"name": "Giacomo Falcucci"}], "featured_authors": [{"name": "Paolo Proia"}, {"name": "Mauro Sbragaglia"}, {"name": "Giacomo Falcucci"}], "author_count": 3}, {"id": "2605.08262", "category": "cond-mat", "title": "SLayerGen: a Crystal Generative Model for all Space and Layer Groups", "abstract": "Crystal generative models have shown rapid progress for accelerating the discovery of bulk, periodic materials. However, many material systems such as 2D superconductors, thin film semiconductors, and catalytic surfaces are diperiodic, i.e., aperiodic along one of the lattice directions. These systems are invariant under the layer groups, which are known to influence materials properties yet not considered by existing models. In this paper, we propose SLayerGen, a generative model that produces crystals constrained to be invariant to any space or layer group. SLayerGen consists of coarse-to-fine discrete autoregressive lattice generation; transformer-based autoregressive sampling of Wyckoff positions, elements, and numbers of symmetrically unique atoms; and space or layer group equivariant diffusion of atomic coordinates. For the diffusion component, we corrected an inconsistency in the loss from prior work arising from hexagonal groups being non-orthogonal in fractional coordinates. To facilitate progress in generative modeling of diperiodic materials, we assembled and filtered datasets of monolayers and bilayers, propose relevant evaluation metrics, and developed novel representations for layer group symmetries. For de novo generation of diperiodic materials, SLayerGen achieves consistent performance gains over bulk crystal generative models and is competitive when training jointly on bulk and diperiodic materials.", "url": "https://arxiv.org/abs/2605.08262", "type": "理论", "summary": "1. 该工作提出SLayerGen模型，可生成受任意空间群或层群约束的晶体，涵盖体相与二维周期性材料。\n2. 其卖点在于结合粗到细自回归晶格生成、Wyckoff位置采样与层群等变扩散，并修正六方群非正交坐标下的扩散损失。\n3. 这为二维材料如超导薄膜与催化表面的生成建模提供了对称性感知框架，推动层群体系材料计算发现。", "summary_source": "deepseek", "authors": [{"name": "Rees Chang"}, {"name": "Andrew Novick"}, {"name": "Ryan P Adams"}, {"name": "Elif Ertekin"}], "featured_authors": [{"name": "Rees Chang"}, {"name": "Andrew Novick"}, {"name": "Ryan P Adams"}, {"name": "Elif Ertekin"}], "author_count": 4}, {"id": "2605.08414", "category": "cond-mat", "title": "Mirror transitions in diffusion with stochastic resetting confined on a ring", "abstract": "Diffusion with an incorporated resetting mechanism provides a reference framework for modeling a wide range of natural phenomena. Within this framework, the optimal resetting rate is a key quantity that arises from the optimization of the mean first-passage time. While substantial work has focused on the study of the optimal resetting rate in unbounded one dimensional domains, little is still known about the optimization of the mean first-passage time in bounded systems, in particular when multiple resetting sites are available. In this work, we consider a particle diffusing along a circular circumference and under resetting, with an absorbing target site at a fixed location. Using the appropriate free propagator for this system, we compute the Laplace transform of the survival probability when resetting occurs to multiple sites drawn from an arbitrary probability density function. We also calculate the mean first-passage time at the target site, and study the dependence of the optimal resetting rate in terms of the relevant parameters of the system in a two-resetting site configuration. Depending on the arc length between one of the resetting sites and the absorbing target site, and the weight of the remaining resetting site, the optimal resetting rate can exhibit abrupt (\"first order'') and continuous (\"second order'') transitions. Moreover, the behavior of the mean first-passage time is rich enough to allow both critical and tri-critical points to exist in the parameter space. All the transitions have \"mirror symmetry'' around the selected target site and its corresponding diametrically opposite site.", "url": "https://arxiv.org/abs/2605.08414", "type": "理论+数值", "summary": "1. 该工作解析计算了环形上含重置扩散的存活概率拉普拉斯变换与平均首达时间，聚焦双重置点构型下的最优重置率行为。\n2. 其核心发现是最优重置率可随弧长及权重参数呈现一级与二级“镜像”相变，并在参数空间中出现临界与三临界点。\n3. 这为有界域中多重置点优化问题提供了精确解析范例，并可启发对生物搜索、化学反应等系统中非平衡定态跃迁的理解。", "summary_source": "deepseek", "authors": [{"name": "Pedro Julián-Salgado"}, {"name": "Pavel Castro-Villarreal"}, {"name": "Leonardo Dagdug"}, {"name": "Denis Boyer"}], "featured_authors": [{"name": "Pedro Julián-Salgado"}, {"name": "Pavel Castro-Villarreal"}, {"name": "Leonardo Dagdug"}, {"name": "Denis Boyer"}], "author_count": 4}, {"id": "2605.08466", "category": "cond-mat", "title": "Multiscale modeling of materials and neural operators", "abstract": "Multiscale modeling is essential for understanding the complex behavior of materials. However, accurately transferring all relevant information from one scale to another has remained an outstanding challenge. Neural operators, discretization-independent generalizations of neural networks, is proving to be a powerful tool in addressing this challenge. This article provides an introduction to neural operators, and illustrates their use in multiscale modeling of materials through three selected examples.", "url": "https://arxiv.org/abs/2605.08466", "type": "理论", "summary": "1. 该综述介绍了神经算子这一离散化无关的神经网络泛化方法，并以其在材料多尺度建模中的三个实例展示应用。\n2. 核心卖点在于神经算子能够跨越尺度边界高效传递完整信息，解决了长期存在的多尺度信息精确迁移难题。\n3. 这为将数据驱动算符融入第一性原理与连续介质耦合框架开辟了路径，有望加速复杂材料行为的预测与设计。", "summary_source": "deepseek", "authors": [{"name": "Kaushik Bhattacharya"}], "featured_authors": [{"name": "Kaushik Bhattacharya"}], "author_count": 1}, {"id": "2605.08490", "category": "cond-mat", "title": "Antiferro-Chiral Phonons in $\\mathcal{P}\\mathcal{T}$-Symmetric Antiferromagnets", "abstract": "Chiral phonons provide a route to couple lattice motion to magnetic order, but conventional chiral phonons carry a net angular momentum and thus couple naturally to net magnetization rather than to compensated Néel order. Here we show that $\\mathcal{P}\\mathcal{T}$-symmetric antiferromagnets can host \\emph{antiferro-chiral phonons} (AFCPs): phonon modes with vanishing total angular momentum but finite sublattice-staggered angular momentum. Symmetry enforces this distinction because $\\mathcal{P}\\mathcal{T}$ forbids a net phonon angular momentum while allowing counter-rotating local motion on inversion-related sublattices. AFCPs arise from a Néel-vector-locked coupling between Raman and infrared-active phonons. The coupling is odd under both $\\mathcal{P}$ and $\\mathcal{T}$ while preserving their product. Through this hybridization, the normal modes acquire both Raman and infrared character and carry a sublattice-staggered phonon angular momentum that acts as a conjugate field to the Néel vector. This coupling is microscopically generated by the molecular Berry curvature, which is demonstrated in a prototype lattice model. Reversing the Néel vector reverses the staggered phonon chirality. These results indicate AFCPs as probes of antiferromagnetic order and suggest coherent phonon excitation as a route to its dynamical control.", "url": "https://arxiv.org/abs/2605.08490", "type": "理论", "summary": "1. 该工作指出$\\mathcal{P}\\mathcal{T}$对称反铁磁体可支持反铁手性声子，其总角动量为零但子晶格交错角动量非零。\n2. 核心在于Néel矢量锁定下的拉曼与红外声子杂化产生交错角动量，该机制由分子贝里曲率微观驱动，且Néel反转导致手性反转。\n3. 这为利用反铁手性声子探测反铁磁序以及通过相干声子激发实现Néel矢量超快调控提供了明确物理途径。", "summary_source": "deepseek", "authors": [{"name": "Sanjib Kumar Das"}, {"name": "Randy Yeh"}, {"name": "Yafei Ren"}], "featured_authors": [{"name": "Sanjib Kumar Das"}, {"name": "Randy Yeh"}, {"name": "Yafei Ren"}], "author_count": 3}, {"id": "2605.08531", "category": "cond-mat", "title": "Fokker--Planck framework for stochastic octupole moment dynamics in chiral antiferromagnet Mn3Sn", "abstract": "We develop a reduced stochastic framework for thermally assisted octupole moment dynamics in Mn3Sn by combining the reduced Landau--Lifshitz--Gilbert (LLG) equation with the Fokker--Planck formalism. The reduced model is benchmarked against the complete three-sublattice octupole dynamics and is shown to capture the essential switching behavior with good accuracy. We then derive the corresponding Fokker--Planck equation, which is implemented and solved via a CUDA-accelerated solver. The analysis shows that the octupole dynamics are highly sensitive to the out-of-plane grid resolution because ultrafast rotation of the octupole is controlled by its very small deviations from the basal plane. The solver is validated against Monte Carlo simulations through equilibrium distributions, relaxation trajectories, and switching times. Finally, we apply the method to thermally assisted field-driven switching and demonstrate efficient access to ultra-low error probabilities beyond the practical reach of direct Monte Carlo simulations.", "url": "https://arxiv.org/abs/2605.08531", "type": "理论+数值", "summary": "1. 该工作发展了结合约化Landau–Lifshitz–Gilbert方程与Fokker–Planck形式的随机框架，用于描述手性反铁磁Mn3Sn中热辅助八极矩动力学。\n2. 技术核心在于揭示八极矩超快旋转受基面外极小偏差控制，从而对网格分辨率高度敏感，并通过CUDA加速求解器实现高效模拟。\n3. 该框架可高效获取直接蒙特卡洛模拟难以企及的超低开关错误概率，为反铁磁自旋电子学中八极矩可靠性设计提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Siyuan Qian"}, {"name": "Shaloo Rakheja"}], "featured_authors": [{"name": "Siyuan Qian"}, {"name": "Shaloo Rakheja"}], "author_count": 2}, {"id": "2605.08620", "category": "cond-mat", "title": "The superite phase and phase transition inducing multiscale solidification microstructures and segregations in steels", "abstract": "Based on classical concept, solidification of alloys is a direct transition from liquid phase to solid phase, by which dendrites and dendritic segregation are produced. Through in-situ and real time morphology observation and XRD test during solidification of three steels, a new superite phase featured as statistically oriented tiny structures was identified, and a general liquid-superite-solid phase transformation process is revealed. In the early solidification stage, the liquid alloys transit to dendrites composed of superite phase. Initiated from the boundaries of dendritic arms or dendrite grains, the superite phase transits to austenite grains within an initial dendritic arm, and expels solute elements to the residual superite phase. Mixed multi-phase microstructures are subsequently produced from the residual enriched superite phase. Here, although three steels exhibit different phase proportion and phase constitution in the superite-solid transition, they all follow above general transition mode. Multiscale microstructures and segregations are produced in the transition from superite to solid. These new findings change the basic understanding about the solidification of alloys, rediscover the formation mechanism on segregations and multiscale solidification microstructures, including dendrite pattern, solid dendritic arm, dendritic segregation, the mixed multi-phase microstructures, eutectic, inclusions and precipitate. These new findings are also crucial to the control of solidification microstructures and segregation in metals.", "url": "https://arxiv.org/abs/2605.08620", "type": "理论", "summary": "1. 该工作通过原位实时形貌观察与XRD实验，在三种钢凝固过程中发现一种名为超晶相的新相，并揭示了液-超晶-固相变过程。\n2. 其核心发现是凝固初期液相先转变为由超晶相构成的枝晶，随后从枝晶臂边界开始超晶相转变为奥氏体并排出溶质，最终产生多尺度凝固显微组织与偏析。\n3. 这改变了合金凝固的传统认知，为理解枝晶形貌、枝晶偏析及多相混合组织等形成机制提供了新基础，并对金属凝固组织与偏析控制具有关键启示。", "summary_source": "deepseek", "authors": [{"name": "Xiaoping Ma"}, {"name": "Dianzhong Li"}, {"name": "Zhuo Zhao"}, {"name": "Saichao Cao"}, {"name": "Donghao Pei"}, {"name": "Pei Wang"}, {"name": "Yuxi Tao"}, {"name": "Paixian Fu"}, {"name": "Hongwei Liu"}, {"name": "Xiuhong Kang"}], "featured_authors": [{"name": "Xiaoping Ma"}, {"name": "Dianzhong Li"}, {"name": "Zhuo Zhao"}, {"name": "Paixian Fu"}, {"name": "Hongwei Liu"}, {"name": "Xiuhong Kang"}], "author_count": 10}, {"id": "2605.08780", "category": "cond-mat", "title": "Concentration-Dependent Membrane Destabilization in DPPC Bilayers: Distinct Insertion Mechanisms and Stress Redistribution by Chloroform and Alkanols", "abstract": "How do solute concentration and molecular chemistry govern the transition from membrane saturation to destabilization? We address this using microsecond-scale molecular dynamics simulations of dipalmitoylphosphatidylcholine (DPPC) bilayers with chloroform (CHCl$_3$) and a homologous series of alkanols (methanol, ethanol, octanol) over $0-50\\%$ concentrations. Although complete membrane melting is not observed within $1000\\, ns$, all systems exhibit clear precursors of destabilization, including enhanced thickness fluctuations, reduced lipid order, and mechanical softening. Chloroform induces pronounced thinning and large fluctuations, consistent with deep, transient insertion. Methanol perturbs primarily the headgroup region, while ethanol shows intermediate behavior with partial insertion. Octanol preserves bilayer thickness at high concentrations due to lipid-like insertion but significantly increases fluctuations and interdigitation. Across all systems, increasing concentration decreases the area compressibility modulus and deuterium order parameter, accompanied by smoothing of lateral pressure profiles, indicating stress redistribution. Free energy analysis reveals increased membrane partitioning and reduced translocation barriers with concentration, strongest for octanol and weakest for methanol. These results demonstrate that membrane destabilization is governed by the interplay of insertion depth, interfacial crowding, and lipid packing disruption.", "url": "https://arxiv.org/abs/2605.08780", "type": "数值", "summary": "1. 该工作通过微秒级分子动力学模拟，系统研究了氯仿及甲醇、乙醇、辛醇在0–50%浓度下对DPPC双分子层的膜失稳前驱体行为，包括厚度涨落、脂质有序度和力学软化。\n2. 其技术卖点在于揭示了不同溶质因插入深度差异（氯仿深插入、甲醇头部插入、乙醇部分插入、辛醇类脂质插入）所导致的独特膜应力再分布机制，并定量关联了面积压缩模量和横向压力分布的变化。\n3. 这为理解浓度依赖的膜饱和—失稳转变提供了基于插入深度、界面拥挤和脂质堆积破坏的物理图像，并启发对麻醉剂等膜活性分子的分子设计参考。", "summary_source": "deepseek", "authors": [{"name": "Anirban Polley"}], "featured_authors": [{"name": "Anirban Polley"}], "author_count": 1}, {"id": "2605.08860", "category": "cond-mat", "title": "A Closer Look on the Influence of Constraints Upon the Optimization of the Nonadditive Entropic Functional $S_{q}$", "abstract": "The thermal-equilibrium canonical distribution is currently obtained by maximizing the Boltzmann-Gibbs-von Neumann-Shannon entropy $S_{BG}(p)=k\\sum^{W}_{i=1}p_{i}\\ln 1/p_{i}$ constrained to $\\sum^{W}_{i=1}p_{i}=1$ and $\\sum^{W}_{i=1}p_{i}\\,e_{i}=U$, $e_{1}\\leq\\ldots\\leq e_{W}$ being the energies of the $W$ possible states and $U\\in[e_{1},e_{W}]$ their mean value. We revisit a generalized version of this optimization problem grounded in the nonadditive entropy $S_{q}(p)=k\\,(\\sum^{W}_{i=1}p_{i}^{q}-1)/(1-q)$ (frequently, though not necessarily, $q\\in(0,1)$; $S_1=S_{BG}$), and the constraint $\\sum^{W}_{i=1} p_{i}^{q^{\\prime}}e_{i} / \\sum^{W}_{i=1}p_{i}^{q^{\\prime}}=U$, $q^{\\prime}>0$. Sufficient conditions for existence, strict positivity, and uniqueness of solutions are derived, along with a theorem that enables their closed-form calculation. We apply these results to deepen the understanding of the two standard cases in the literature ($q^{\\prime}=1$ and $q^{\\prime}=q$), as well as of a new one ($q^{\\prime}=2-q$). We prove that these standard cases are the only ones yielding optimizing probability distributions of $q$-exponential form. Furthermore, we define an effective temperature $T_{q,q^{\\prime}}$ through a Clausius-like relation $1/T_{q,q^{\\prime}}=\\partial S_{q} / \\partial U$ and derive a Helmholtz-like energy $F_{q,q^{\\prime}}=U-T_{q,q^{\\prime}}S_{q}$, with the former grounding the validity of the $0^{th}$ Principle of Thermodynamics within this generalized statistical mechanics. Finally, we show that the case with a linear constraint (i.e., $q^{\\prime}=1$) with $q\\in(0,1)$ (i) preserves the Third Law of Thermodynamics; (ii) can be used to model classical many-body Hamiltonian systems with arbitrarily-ranged interactions; and (iii) resembles features of low-dimensional nonlinear dynamical systems at the edge of chaos.", "url": "https://arxiv.org/abs/2605.08860", "type": "理论+数值", "summary": "1. 该工作重新审视了非广延熵S_q在广义约束下的变分优化问题，推导了解之存在、严格正定与唯一的充分条件，并给出闭式解的定理。\n2. 其核心卖点在于证明仅当约束指标q'为1或q时优化分布为q-指数形式，并基于Clausius关系定义有效温度T_{q,q'}及亥姆霍兹类自由能F_{q,q'}，从而确立了零热力学原理的成立。\n3. 该分析显示q'=1且0<q<1的情况保持第三定律，能建模任意作用程经典多体系统，并可类比混沌边缘的低维非线性动力学特征，拓展了非广延统计力学的适用边界。", "summary_source": "deepseek", "authors": [{"name": "Leandro Lyra Braga Dognini"}, {"name": "Constantino Tsallis"}], "featured_authors": [{"name": "Leandro Lyra Braga Dognini"}, {"name": "Constantino Tsallis"}], "author_count": 2}, {"id": "2605.08948", "category": "cond-mat", "title": "Bond strengths in solids computed from a Wannier-type construction of local vibrational modes", "abstract": "We introduce a Wannier-type formulation of periodic local vibrational mode theory that yields real-space-localized vibrational modes associated with individual internal coordinates in crystalline solids. These modes are constructed as locally coherent superpositions of wavevector-resolved local modes, yielding a smooth and gauge-consistent real-space representation without the need for additional phase-fixing procedures. The resulting Wannier-type local modes provide well-defined force constants and frequencies that enable robust, chemically interpretable measures of bond and interaction strengths in periodic systems. Moreover, our framework demonstrates that phonon dispersion behavior makes important contributions to the bond and interaction strengths calculated via local vibrational mode theory. We demonstrate the method for representative ionic and covalent systems, including MgO, tetrahedrally-coordinated C, Si, SiC, and two polymorphs of CaCO3. Our framework establishes a direct analog of molecular local modes for fully periodic systems and opens new avenues for quantitative bonding analysis in crystalline materials.", "url": "https://arxiv.org/abs/2605.08948", "type": "理论+数值", "summary": "1. 该工作提出基于Wannier型构造的周期局域振动模式理论，从波矢分辨局域模式构建实空间定域振动模式。\n2. 其技术核心在于无需额外相位固定即可获得平滑规范的实空间表示，从而给出明确定义的力常数与频率，实现键强与相互作用的化学可解释度量。\n3. 该框架建立了周期体系与分子局域模式的直接类比，为晶体材料中定量键合分析开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Mateusz Mojsak"}, {"name": "Elfi Kraka"}, {"name": "Adam A. L. Michalchuk"}], "featured_authors": [{"name": "Mateusz Mojsak"}, {"name": "Elfi Kraka"}, {"name": "Adam A. L. Michalchuk"}], "author_count": 3}, {"id": "2605.08960", "category": "cond-mat", "title": "CrystalREPA: Transferring Physical Priors from Universal MLIPs to Crystal Generative Models", "abstract": "Crystal generative models mainly learn what stable crystals look like, with little explicit supervision for what makes them stable. We reveal a substantial representation gap between state-of-the-art crystal generative models and pretrained universal machine learning interatomic potentials (MLIPs) via energy probing, and show this gap can be closed by a simple training-time alignment. We propose Crystal REPresentation Alignment (CrystalREPA), a plug-and-play framework that aligns the atom-wise hidden states of generative encoders with frozen MLIP representations through an element-aware contrastive objective, transferring stability-aware atomistic priors with marginal training overhead and no additional inference cost. Across three generative frameworks, ten MLIP teachers, and two benchmark datasets, CrystalREPA consistently improves the thermodynamic stability, structural validity, and structural fidelity of generated crystals. Equally important, we find that an MLIP's transfer effectiveness is poorly predicted by its accuracy on standard leaderboards (e.g., Matbench Discovery) but strongly predicted by the distinguishability of its atom-wise representation space, yielding a practical, accuracy-independent criterion for selecting MLIP teachers for generative transfer.", "url": "https://arxiv.org/abs/2605.08960", "type": "理论+数值", "summary": "1. 该工作提出CrystalREPA框架，通过训练时将晶体生成模型编码器的原子隐藏状态与通用机器学习原子间势的冻结表示进行元素感知对比对齐，以传递稳定性物理先验。\n2. 其技术卖点在于以极低训练开销和无额外推理成本弥合表示差距，在三种生成框架、十种教师势和两个基准上一致提升生成晶体的热力学稳定性、结构有效性和结构保真度。\n3. 该工作还发现，教师势的迁移效果与其标准排行榜准确性弱相关，而与其原子表示空间的可区分性强相关，为选择迁移模型提供了独立于准确性的实用准则。", "summary_source": "deepseek", "authors": [{"name": "Chengqian Zhang"}, {"name": "Yucheng Jin"}, {"name": "Duo Zhang"}, {"name": "Tiejun Li"}, {"name": "Han Wang"}], "featured_authors": [{"name": "Chengqian Zhang"}, {"name": "Yucheng Jin"}, {"name": "Duo Zhang"}, {"name": "Tiejun Li"}, {"name": "Han Wang"}], "author_count": 5}, {"id": "2605.08967", "category": "cond-mat", "title": "Condensation Transition in Entropy-Constrained Probability Spaces", "abstract": "The organization of high-dimensional probability spaces is a fundamental problem at the intersection of statistical physics and information theory. Here, we analyze the distributions populating level surfaces of the probability simplex $\\Delta_{K-1}$ defined by a fixed Shannon entropy. We introduce a discretization strategy that assigns equal statistical weight to distinct microstate distributions and enables a combinatorial analysis of the simplex. A condensation phase transition is shown to take place below a critical entropy that scales as $H_c \\simeq \\log K - 1 + \\gamma$ in the thermodynamic limit. For entropy values $H_0 < H_c$, the overwhelming majority of distributions are found in a condensed state, in which a single component captures a macroscopic fraction of the total probability mass while the remaining components form a homogeneous fluid background. These results provide a framework for understanding phenomena such as overconfident predictions in machine learning and the emergence of dominant species in ecology, and suggest that sparsity can arise naturally from entropic constraints in high-dimensional manifolds.", "url": "https://arxiv.org/abs/2605.08967", "type": "理论+数值", "summary": "1. 该工作引入等权重离散化策略分析固定香农熵下的概率单纯形，通过组合方法证明在热力学极限下熵低于临界值H_c≈logK-1+γ时发生凝聚相变。\n2. 其核心发现是凝聚态中单一分量占据宏观概率质量，其余分量形成均匀流体背景，且该相变完全由熵约束而非显式稀疏性约束驱动。\n3. 这一统计物理框架为理解机器学习中的过度自信预测和生态学中优势物种涌现等现象提供了统一机制，表明高维流形中稀疏性可自然源于熵约束。", "summary_source": "deepseek", "authors": [{"name": "Bautista Arenaza"}, {"name": "Sebastián Risau-Gusman"}, {"name": "Inés Samengo"}, {"name": "Damián G. Hernández"}], "featured_authors": [{"name": "Bautista Arenaza"}, {"name": "Sebastián Risau-Gusman"}, {"name": "Inés Samengo"}, {"name": "Damián G. Hernández"}], "author_count": 4}, {"id": "2605.09088", "category": "cond-mat", "title": "Effect of spin-dependent tunneling and intervalley scattering in magnetic-semiconductor van der Waals heterostructures on exciton and trion polarization", "abstract": "We present a theoretical analysis of valley pseudospin control in the transition metal dichalcogenide (TMD) monolayer by utilizing the magnetic proximity effect of 2D magnetic layer and, propose self-consistent analysis of photoluminescence (PL) polarization peculiarities in TMD/magnetic material van der Waals heterostructures. We attribute observed peculiarities to the interplay between spin-dependent interlayer charge transfer and intervalley scattering of excitons and trions. The ratio between the electron tunneling timescale and the exciton and trion intervalley scattering lifetimes and radiative lifetimes determine the PL dynamics. A possibility to switch PL polarization sign due to the quasi-particles dynamics under circularly polarized laser excitations is revealed. We also discuss generalization of the proposed model due to the careful analysis of both intervalley and intravalley scattering processes between bright and dark excitons. Obtained results allow a long-distance manipulation of exciton and trion behaviors and open the possibilities for the effective control under spin and valley pseudospin in multilayer magnetic-semiconductor van der Waals heterostructures.", "url": "https://arxiv.org/abs/2605.09088", "type": "理论", "summary": "1. 该工作从理论上分析了基于磁邻近效应的过渡金属硫族化物单层谷赝自旋操控，并建立了磁半导体范德华异质结中光致发光极化的自洽模型。\n2. 核心卖点在于揭示自旋依赖的层间电荷转移与激子、三子谷间散射的竞争，其中电子隧穿时间尺度与散射及辐射寿命之比主导极化动力学。\n3. 这为通过圆偏振激光实现极化符号翻转以及长距离操控激子与三子行为提供了可能，有助于多层体系中自旋与谷赝自旋的有效调控。", "summary_source": "deepseek", "authors": [{"name": "V.N. Mantsevich"}], "featured_authors": [{"name": "V.N. Mantsevich"}], "author_count": 1}, {"id": "2605.09105", "category": "cond-mat", "title": "Nonequilibrium Theory for Molecular Machine Design", "abstract": "Modeling the dynamical flows on networks of biomolecular machines often entails computing node populations and edge fluxes with Master Equations and correlating machine performance with entropy production. But this alone is not sufficient for design, optimization and evolution because it doesn't treat cost-benefit tradeoffs, or small-system misflows (backsteps, futile cycles, ineffective actions), or differential properties for flow design. Here we develop CFT Design, based on the recently developed Caliber Force Theory (CFT). We apply it to: designing faster molecular motors through ``traffic control''; optimizing speed, energy, and accuracy in kinetic proofreaders; and designing better enzyme inhibitors. CFT Design provides a general framework for optimizing nonequilibrium flow networks.", "url": "https://arxiv.org/abs/2605.09105", "type": "理论+数值", "summary": "1. 该工作基于Caliber力理论发展出CFT Design框架，用于分子机器非平衡流网络的设计与优化。\n2. 其核心在于引入成本-收益权衡及小系统误流（如回步、无效循环）的显式处理，实现流设计微分性质的定量调控。\n3. 这为分子马达加速、动力学校对优化及酶抑制剂设计提供了统一的非平衡设计理论，并可能推广至更广泛的生物纳米机器系统。", "summary_source": "deepseek", "authors": [{"name": "Ying-Jen Yang"}, {"name": "Ken A. Dill"}], "featured_authors": [{"name": "Ying-Jen Yang"}, {"name": "Ken A. Dill"}], "author_count": 2}, {"id": "2605.09148", "category": "cond-mat", "title": "Sensitivity Analysis in the Face of Rare Events", "abstract": "Molecular motors and other complex nonequilibrium systems are controlled by large sets of design parameters, and optimizing those parameters requires computing sensitivities -- derivatives of dynamical observables with respect to the parameters. When the system's dynamics involves rare events, both the observable and its sensitivity are difficult to estimate from direct simulation. We present a practical computational pipeline that addresses both challenges by combining importance sampling with a Markov state model (MSM). The MSM separately captures the slow, rare-event dynamics and the fast, local dynamics, and the chain rule connects those two pieces to yield an efficient sensitivity estimator. An iterative reweighting procedure based on the RiteWeight algorithm substantially reduces approximation errors from the MSM coarse-graining. We validate the approach on diffusion in the Müller-Brown potential, where the sensitivity of a transition rate to landscape parameters can be computed exactly. We then use sensitivies to optimize the directional bias of a particle-based model of a catalysis-driven molecular motor.", "url": "https://arxiv.org/abs/2605.09148", "type": "理论+数值", "summary": "1. 该工作提出结合重要性采样与马尔可夫状态模型的计算框架，用于含稀有事件的非平衡系统的动力学灵敏度分析。\n2. 其卖点在于马尔可夫状态模型分别描述慢速稀有事件与快速局域动力学，经链式法则得到灵敏度估计，并利用基于RiteWeight的迭代重加权流程降低粗粒化误差。\n3. 这为催化驱动分子马达等方向偏置参数优化提供了可验证的实用途径，并启示稀有事件系统中灵敏度计算的通用策略。", "summary_source": "deepseek", "authors": [{"name": "John Strahan"}, {"name": "Todd R. Gingrich"}], "featured_authors": [{"name": "John Strahan"}, {"name": "Todd R. Gingrich"}], "author_count": 2}, {"id": "2605.09172", "category": "cond-mat", "title": "Lubrication-Induced Newtonianization Enables Passive Transport of Non-Newtonian materials", "abstract": "Non Newtonian flows are typically governed by intrinsic bulk rheology, which imposes strong constraints on transport through confined geometries. Here, we show that stable boundary lubrication can fundamentally alter this behavior by localizing shear within a thin, low-viscosity interfacial layer. As a result, the nonlinear rheological response of a broad class of complex materials, including yield-stress, shear-dependent, and thixotropic materials, is strongly suppressed during flow. Using analytical solutions of Stokes flow and numerical simulations, we demonstrate that lubrication-induced shear localization leads to an apparent Newtonianization of transport, in which the macroscopic flow response becomes primarily controlled by the lubricating layer and geometric confinement rather than the intrinsic material properties. In this regime, materials that would otherwise require large pressure gradients can be transported at substantially lower driving forces. Notably, this boundary-dominated transport enables gravity-driven passive flow with orders-of-magnitude enhancement in throughput compared to rigid-wall conduits. These results establish lubrication as a powerful mechanism for tuning and simplifying complex fluid transport, with implications for biological systems, soft and jammed materials, and energy-efficient fluids.", "url": "https://arxiv.org/abs/2605.09172", "type": "理论+数值", "summary": "1. 本文证明，通过稳定边界润滑在管道壁面形成低粘度剪切局部化薄层，可有效抑制非牛顿流体（如屈服应力、剪切变稀和触变性材料）的体相非线性流变响应。\n2. 核心发现是润滑诱导的剪切局域化实现“表观牛顿化”，使宏观输运主要由润滑层特性和几何约束主导，而非本征材料性质，从而大幅降低驱动压力。\n3. 该机制使得屈服应力等复杂材料在重力驱动下可实现被动输运，吞吐量较刚性壁管道提升数个量级，为生物体系、软物质及高效能流体系统提供调控新途径。", "summary_source": "deepseek", "authors": [{"name": "Arvind Arun Dev"}, {"name": "Paszkal Papp"}, {"name": "Thomas M. Hermans"}, {"name": "Bernard Doudin"}], "featured_authors": [{"name": "Arvind Arun Dev"}, {"name": "Paszkal Papp"}, {"name": "Thomas M. Hermans"}, {"name": "Bernard Doudin"}], "author_count": 4}, {"id": "2605.09194", "category": "cond-mat", "title": "Embedded Direct Ink Writing of Thermoset and Elastomeric Polymers via Frontal Polymerization", "abstract": "Direct ink writing (DIW) using frontal ring-opening metathesis polymerization (FROMP) offers a compelling route to the rapid and energy-efficient fabrication of thermoset and elastomeric polymer architectures, leveraging a self-propagating exothermic curing reaction. While FP-DIW excels at freestanding path printing due to the rapid solidification, it is constrained by stringent rheological requirements, a lower bound on achievable feature size due to quenching, and the need for the reaction front to closely follow the nozzle during printing. Here, we overcome these constraints by leveraging embedded 3D printing to implement FP-DIW with delayed solidification, thereby decoupling shape retention and solidification from ink chemistry and rheology. The use of a yield-stress support medium enables extrusion of low-viscosity inks by suppressing gravitational and capillary instabilities, mitigating front quenching at small diameters, and allowing time-delayed solidification to fuse complex, overlapping, and mechanically interlinked features after deposition. Two complementary thermal initiation strategies are introduced:\\ volumetric dielectric heating via microwaves and surface heating at the boundary of the support bath. Formulations based on dicyclopentadiene (DCPD), cyclooctadiene (COD), and mixtures thereof, result in tunable final mechanical properties with glass transition temperatures spanning $-50$ to $160 $$^\\text{o}$C. The versatility of this approach is demonstrated through the fabrication of lattices, springs, mechanically interlocked, and multimaterial architectures. Compared to printing in air, this embedded approach introduces a substantially broader range of possible formulations, material properties, feature sizes, and architectures.", "url": "https://arxiv.org/abs/2605.09194", "type": "理论", "summary": "1. 该工作将嵌入式三维打印与前沿开环易位聚合结合，实现了热固性和弹性聚合物结构的快速低能耗制造。\n2. 其卖点在于利用屈服应力支撑介质容纳低粘度墨水以抑制失稳，并通过延迟固化实现复杂互锁结构的熔合。\n3. 这显著拓宽了可用的配方、力学性能、特征尺寸与结构复杂性，为增材制造提供了可扩展的通用路线。", "summary_source": "deepseek", "authors": [{"name": "Mohammad Tanver Hossain"}, {"name": "Yun Seong Kim"}, {"name": "Pallab Layek"}, {"name": "Pranav Krishnan"}, {"name": "Youngbum Lee"}, {"name": "Minjiang Zhu"}, {"name": "Shubh Singh"}, {"name": "Philippe H. Geubelle"}, {"name": "Paul V. Braun"}, {"name": "Jeffery W. Baur"}, {"name": "Nancy R. Sottos"}, {"name": "Sameh H. Tawfick"}, {"name": "Randy H. Ewoldt"}], "featured_authors": [{"name": "Mohammad Tanver Hossain"}, {"name": "Yun Seong Kim"}, {"name": "Pallab Layek"}, {"name": "Nancy R. Sottos"}, {"name": "Sameh H. Tawfick"}, {"name": "Randy H. Ewoldt"}], "author_count": 13}, {"id": "2605.09240", "category": "cond-mat", "title": "Spin Elasticity:A New Paradigm for Spintronics", "abstract": "Elasticity shapes our world. For centuries, it has been regarded as a property exclusive to ordinary matter. Here we uncover its hidden existence in the spin degree of freedom. We introduce spin elasticity-a framework linking spin torque to spin morpgology. This reveals a topological Hooke's law, uncovers spontaneous oscillations and resonance, and predicts a new class of collective excitations:spin stress waves. By establishing a unfied tau-D theory bridging classical elasticity and topological spin physics, this work completes the elastic picture and opens a new frontier for spintronics-spinelastronics.", "url": "https://arxiv.org/abs/2605.09240", "type": "理论", "summary": "1. 该工作提出自旋弹性概念，将经典弹性理论拓展至自旋自由度，构建了自旋扭矩与自旋形态间的统一框架。\n2. 核心在于揭示拓扑胡克定律、自发振荡与共振，并预言一类新型集体激发——自旋应力波。\n3. 这完成了弹性物理在自旋体系中的完整图景，为自旋电子学开辟了自旋弹性学这一新前沿。", "summary_source": "deepseek", "authors": [{"name": "Zhong-Chen Gao"}, {"name": "Tianyi Zhang"}, {"name": "Feifei Wang"}, {"name": "Jingguo Hu"}, {"name": "Peng Yand"}, {"name": "Xiufeng Han"}], "featured_authors": [{"name": "Zhong-Chen Gao"}, {"name": "Tianyi Zhang"}, {"name": "Feifei Wang"}, {"name": "Jingguo Hu"}, {"name": "Peng Yand"}, {"name": "Xiufeng Han"}], "author_count": 6}, {"id": "2605.09247", "category": "cond-mat", "title": "Benchmarking a restricted Boltzmann machine on the $\\mathbb{Z}_2$ Bose-Hubbard chain in the adiabatic hard-core regime", "abstract": "We study the ground state of the $\\mathbb{Z}_2$ Bose-Hubbard chain in the adiabatic hard-core limit at half filling using variational Monte Carlo with a shallow restricted Boltzmann machine as the variational ansatz. In this context, the neural quantum state is compared with the established adiabatic description of the model. The variational results reproduce the overall structure of the phase diagram obtained from magnetization observables, distinguish the polarized and Néel-ordered regions, and capture representative spin patterns and site occupations for the staggered insulating configurations selected by a weak symmetry-breaking field. Taken together, these results show that a shallow restricted Boltzmann machine reproduces the main adiabatic phase structure of the one-dimensional $\\mathbb{Z}_2$ Bose-Hubbard chain and captures the selected symmetry-broken insulating configurations at half filling.", "url": "https://arxiv.org/abs/2605.09247", "type": "理论+数值", "summary": "1. 该工作利用浅层受限玻尔兹曼机作为变分波函数，通过变分蒙特卡洛方法研究了Z₂ Bose-Hubbard链在绝热硬核极限下半满填充下的基态性质。\n2. 其技术优势在于神经网络态准确再现了磁化可观测量给出的相图总体结构，区分了极化区和Néel有序区，并捕捉了弱对称性破缺场选择的交错绝缘构型。\n3. 这为神经网络量子态在具备自发对称性破缺的一维强关联系统中的有效性提供了基准，并启示其可推广至更复杂绝缘相的描述。", "summary_source": "deepseek", "authors": [{"name": "Gustavo Alejandro Avalos Valentín"}, {"name": "Roman Josué Armenta Rico"}, {"name": "Isaac Pérez Castillo"}], "featured_authors": [{"name": "Gustavo Alejandro Avalos Valentín"}, {"name": "Roman Josué Armenta Rico"}, {"name": "Isaac Pérez Castillo"}], "author_count": 3}, {"id": "2605.09249", "category": "cond-mat", "title": "Bound-State Spectra of a Lifshitz-Type Dirac Equation in (2+1) Dimensions", "abstract": "We investigate a Dirac-type equation in (2+1) dimensions modified by Lifshitz spatial derivatives with dynamical exponent $z=2$, focusing on the spectral properties of bound states under radial confinement. Analytical solutions are obtained for constant backgrounds, hard-wall confinement, and harmonic potentials, while logarithmic confinement is treated numerically via the Numerov method and complemented by a semiclassical WKB analysis. The resulting spectra exhibit characteristic scaling laws governed by the Lifshitz parameter $b$, including $E - M \\propto b/R_0^2$ for hard-wall confinement, $E - M \\propto \\sqrt{2b}\\,\\omega$ for harmonic trapping, and $E - M \\sim \\alpha \\ln\\sqrt{b}$ in the semiclassical regime of logarithmic confinement. These results provide a consistent characterization of how higher-order spatial derivatives modify bound-state spectra in two-dimensional Dirac systems and may be relevant for effective descriptions of materials with quadratic low-energy dispersion, such as bilayer graphene and related anisotropic 2D systems.", "url": "https://arxiv.org/abs/2605.09249", "type": "理论+数值", "summary": "1. 该工作解析并数值求解了(2+1)维动力学指数z=2的Lifshitz型Dirac方程，获得了径向约束（硬壁、谐振子、对数势）下的束缚态谱。\n2. 其核心在于给出由Lifshitz参数b统一支配的标度律：硬壁约束下E-M ∝ b/R₀²，谐振子约束下E-M ∝ √(2b)ω，对数约束下E-M ∝ α ln√b。\n3. 这为描述具有二次低能色散的二维系统（如双层石墨烯）中高阶空间导数对束缚态的影响提供了明确的定量基准和有效理论框架。", "summary_source": "deepseek", "authors": [{"name": "Lucas K. R. Queiroz"}, {"name": "Van Sérgio Alves"}, {"name": "Nilberto Bezerra"}, {"name": "Luis Fernández"}, {"name": "Francisco Peña"}], "featured_authors": [{"name": "Lucas K. R. Queiroz"}, {"name": "Van Sérgio Alves"}, {"name": "Nilberto Bezerra"}, {"name": "Luis Fernández"}, {"name": "Francisco Peña"}], "author_count": 5}, {"id": "2605.09274", "category": "cond-mat", "title": "Microscopic resonant-shell mechanism for slow Liouvillian sectors in an open correlated lattice", "abstract": "We develop a microscopic theory for how slow Liouvillian sectors are selected in an open correlated lattice. The starting point is not a postulated non-Hermitian band, but a local interacting resonance between an on-site doublon and a branch-resolved nearest-neighbor bond. This resonance defines a composite shell orbital whose doublon weight controls reservoir visibility and whose mixed doublon-bond character controls shell mobility. Projecting the microscopic hopping onto the selected shell yields a branch-selective dimerized channel. In the dilute regime, a boundary doublon-loss channel yields an exponentially slow edge-memory pole through a Zeno-type return. At the shell-critical point, the edge pole is replaced by a near-zero standing-wave doublet with an algebraic coherent spacing. At finite shell filling, the same local shell becomes density dressed. A number-conserving phase-locking jump removes a bright mismatch sector, leaving defects as the asymptotic slow variables and producing a diffusive finite-size gap. We derive the local shell, the projected branch topology, the edge-memory law, the shell-critical doublet, the density-dressed shell Hamiltonian, and the defect generator within one Schur-projection framework. The resulting mechanism identifies the reservoir-engineered fast block as the selector of the observable slow sector, while the microscopic parent shell remains fixed.", "url": "https://arxiv.org/abs/2605.09274", "type": "理论+数值", "summary": "1. 该工作通过Schur投影发展了开放关联晶格的微观共振壳理论，系统阐释了慢Liouvillian扇区如何由局域双占据与分支分辨最近邻键共振所选择，并导出了壳投影哈密顿量、边缘记忆指数律和壳临界近零双态。\n2. 其物理卖点在于复合壳轨道的双占据权重控制储层可视性、混合特征决定迁移率，从而通过投影产生分支选择性二聚化通道，进而以数守恒锁相跳变将亮失配扇区消除，使缺陷成为渐进慢变量并诱导扩散有限尺寸能隙。\n3. 这一理论框架为通过储层工程调控开放量子多体系统中的慢动力学与边缘记忆、以及实现量子记忆或缺陷工程提供了微观可控的统一基础。", "summary_source": "deepseek", "authors": [{"name": "X. Z. Zhang"}], "featured_authors": [{"name": "X. Z. Zhang"}], "author_count": 1}, {"id": "2605.09436", "category": "cond-mat", "title": "Microscopic origin of Boson peak in amorphous solids", "abstract": "We proposed a non-analytic model to explain the microscopic origin of the anomalous vibrational density of states (DOS), the Boson peak (BP), in amorphous solids based on the scalar dynamical matrix of a network with springs and nodes. We argue that disorder can be classified into two factors: fluctuation of spring strength and fluctuation of coordination numbers (the number of springs connected to a node). The results suggest that BP originates solely from fluctuation of coordination numbers, while the fluctuation of spring strength only contributes to the effect of damping and has very limited effect on low frequency DOS. This work converts complexity into simplicity and provides a direct answer to the puzzle of the microscopic origin of BP in amorphous solids.", "url": "https://arxiv.org/abs/2605.09436", "type": "理论", "summary": "1. 该工作基于弹簧-节点网络的标量动力学矩阵构建非解析模型，直接阐明了非晶固体中玻色峰的微观起源。\n2. 其核心在于将无序严格解耦为弹簧强度涨落与配位数涨落，并证明玻色峰仅源于配位数涨落，强度涨落仅贡献阻尼而对低频态密度几乎无影响。\n3. 这为理解非晶固体低频振动异常提供了简洁直接的物理图像，并启发对其他无序系统复杂行为进行类似分解研究。", "summary_source": "deepseek", "authors": [{"name": "Cunyuan Jiang"}], "featured_authors": [{"name": "Cunyuan Jiang"}], "author_count": 1}, {"id": "2605.09453", "category": "cond-mat", "title": "Emergent critical phases of the Ashkin-Teller model on the Union-Jack Lattice", "abstract": "The Ashkin-Teller (AT) model is a classic spin model in statistical mechanics. For traditional homogeneous lattices like triangular and kagome lattices, even when frustration exists, the model only has one ferromagnetic-paramagnetic critical line in the $J>0$ and $K<0$ region. However, in this paper, for the Union Jack lattice, where the lattice coordination numbers are 4, 8, and 8 and which also contains a large number of small triangular units, using Metropolis Monte Carlo method, we find that, the critical line of the AT model splits into two Berezinskii-Kosterlitz-Thouless(BKT) boundaries, and a critical phase emerges in the intermediate region. This phenomenon is the combined result of frustration, lattice inhomogeneity and the two coupled spin degrees of freedom inherent to the AT model. In detail, the novel critical phase characterized by a power-law decay of magnetization with system size, where the correlation length ratio $\\xi/L$ remains finite even in the thermodynamic limit. We also introduce the susceptibility $\\widetilde{\\chi} = \\text{d}\\langle m \\rangle /\\text{d}J$ as a key probe, and through this probe, pseudo-critical points $J_c(L)$ are observed to scale proportionally to $(\\ln L)^{-2}$, a behavior consistent with BKT criticality. Since superfluids, superconductors, and supersolids all possess quasi-long-range order and fall into the category of critical phases, our results could also inspire the exploration of such quantum phases.", "url": "https://arxiv.org/abs/2605.09453", "type": "理论+数值", "summary": "1. 本文通过Metropolis蒙特卡洛方法研究Union-Jack格点上的Ashkin-Teller模型，发现原先单一的临界线分裂为两条BKT边界，并在其间涌现出一类新的临界相。\n2. 该临界相的磁化随系统大小呈幂律衰减，关联长度比ξ/L在热力学极限下保持有限，且伪临界点J_c(L)的标度行为服从(ln L)^{-2}，体现了阻挫、晶格非均匀性与耦合自旋自由度的协同作用。\n3. 由于该临界相具有准长程有序特征，其发现可启发对超流、超导及超固体等量子相中类似临界行为的进一步实验与理论研究。", "summary_source": "deepseek", "authors": [{"name": "Changzhi Zhao"}, {"name": "Wanzhou Zhang"}, {"name": "Yuan Huang"}, {"name": "Chengxiang Ding"}, {"name": "Youjin Deng"}], "featured_authors": [{"name": "Changzhi Zhao"}, {"name": "Wanzhou Zhang"}, {"name": "Yuan Huang"}, {"name": "Chengxiang Ding"}, {"name": "Youjin Deng"}], "author_count": 5}, {"id": "2605.09499", "category": "cond-mat", "title": "Spin Quadrupolar orders in $d$-wave Unconventional Magnetism", "abstract": "Unconventional magnetism represents a class of metallic states whose Fermi surfaces exhibit spin-dependent splittings under the non-trivial representations of the rotation group. The $d$-wave $\\alpha$-phase unconventional magnetic state, commonly known as altermagnet, recently, has attracted significant attention. While these systems exhibit distinct anisotropic $d$-wave characteristics in momentum space, how this microscopic topology translates into the spin distributions in real space remains a question. In this work, we bridge the intrinsic spin quadrupolar ordering in momentum space to the real-space staggered magnetic distribution. By introducing a weak, non-magnetic periodic crystal potential into a $d$-wave unconventional magnetic state, the spin-charge cross susceptibility is calculated by using the linear response theory. We reveal that the interplay between the crystal potential and the intrinsic $d$-wave spin-splitting naturally induces a spatial spin quadrupole distribution without enlarging the unit cell. Our study thus provides a physical connection between momentum-space multipoles in the even partial wave channel and real-space spin multipole orders.", "url": "https://arxiv.org/abs/2605.09499", "type": "理论", "summary": "1. 该工作以d波非常规磁态（交变磁体）为对象，通过线性响应理论分析弱非磁周期势下的自旋-电荷交叉磁化率，建立了动量空间自旋四极矩与实空间交错磁分布之间的定量联系。\n2. 其核心卖点在于揭示晶格势与内禀d波自旋分裂的耦合可自然诱导出实空间自旋四极分布，且不扩大原胞，为动量空间偶宇称多极矩向实空间自旋序的映射提供了直接物理机制。\n3. 该发现不仅为理解交变磁体中实空间自旋多极矩的起源提供了理论框架，还可能启发在人工周期势调控下探索更高阶自旋多极序及相关的输运与磁光响应。", "summary_source": "deepseek", "authors": [{"name": "Jian-Keng Yuan"}, {"name": "Zhiming Pan"}, {"name": "Congjun Wu"}], "featured_authors": [{"name": "Jian-Keng Yuan"}, {"name": "Zhiming Pan"}, {"name": "Congjun Wu"}], "author_count": 3}, {"id": "2605.09501", "category": "cond-mat", "title": "Orienting-Field Effects on Instability and Mode Selection in Active Nematics", "abstract": "We examine the instabilities of a confined active nematic subjected to an orienting field using a low Reynolds number Ericksen-Leslie framework with active stresses and field-induced torques. Linear analysis reveals two distinct modes, with odd and even director symmetry, the instabilities of which depend on the interplay between activity and field strength. We derive exact and approximate analytic forms of the stability boundaries and show that an orienting field that aligns the director perpendicular to the substrate anchoring direction cooperatively lowers activity thresholds and enables a field-driven even symmetry mode instability, while an orienting field that aligns the director parallel to the substrate anchoring tends to stabilise the system. Numerical solutions of the full nonlinear equations show that the linear stability analysis correctly identifies the symmetries of long-time states. These results demonstrate how orienting fields can promote an instability below the classical critical activity and can be used to both tune the instability onset and control the mode selection in confined active nematics.", "url": "https://arxiv.org/abs/2605.09501", "type": "理论+数值", "summary": "1. 该工作利用低雷诺数Ericksen-Leslie理论框架，系统分析了取向场对受限活性向列相失稳与模式选择的影响。\n2. 核心发现是垂直于基底锚定方向的取向场可协同降低活性阈值，驱动具有偶对称性的新模式失稳，而平行取向场则起稳定作用。\n3. 这为通过外场调控活性向列相失稳起始与模式选择提供了明确途径，并拓展了超越经典临界活性的失稳机制。", "summary_source": "deepseek", "authors": [{"name": "I.K. Joseph"}, {"name": "A.J.H. Houston"}, {"name": "K.N. Kowal"}, {"name": "N.J. Mottram"}], "featured_authors": [{"name": "I.K. Joseph"}, {"name": "A.J.H. Houston"}, {"name": "K.N. Kowal"}, {"name": "N.J. Mottram"}], "author_count": 4}, {"id": "2605.09510", "category": "cond-mat", "title": "Boundary-dependent topological degeneracy in an Ising chain", "abstract": "The topological degeneracy is a characteristic of quantum phase diagram in an Ising chain with transverse field. We revisit the phase diagram at nonzero temperature of an Ising chain with two types of open boundary conditions. In this work, we focus on an alternative boundary condition that not only removes the coupling between the two end sites but also eliminates the transverse field on them. We show that such a system can be exactly mapped onto two independent Kitaev chains, where spinless fermions correspond to domain-wall excitations. This results in a switch in the existence of the topological Kramers-like degeneracy in the phase diagram. The underlying mechanism is analyzed within the Majorana representation, which indicates that such a switch arises from the gauge dependence of the winding number in an SSH chain. The manifestation of bulk-boundary correspondence at nonzero temperature is demonstrated by numerical simulations on finite-size systems. This finding provides insight into the quantum spin chain.", "url": "https://arxiv.org/abs/2605.09510", "type": "理论+数值", "summary": "1. 该工作研究了横场伊辛链中一种特殊开放边界条件导致的拓扑简并性切换。\n2. 其核心在于通过精确映射到两个独立Kitaev链，揭示出Majorana表象下卷绕数的规范依赖性决定了拓扑Kramers简并是否出现。\n3. 这为非零温度下体边对应的实现提供了数值验证，并为量子自旋链边界效应设计拓扑态指明了方向。", "summary_source": "deepseek", "authors": [{"name": "E. S. Ma"}, {"name": "Z. Song"}], "featured_authors": [{"name": "E. S. Ma"}, {"name": "Z. Song"}], "author_count": 2}, {"id": "2605.09555", "category": "cond-mat", "title": "On the thermal properties of knotted block copolymer rings", "abstract": "We investigate the thermal and structural properties of knotted diblock copolymer rings using a coarse-grained lattice model in an implicit solvent. The system is studied by means of the Wang--Landau Monte Carlo algorithm, allowing us to analyze thermodynamic and conformational responses over a wide temperature range. Different knot topologies, including the unknot, trefoil, figure-eight, and pentafoil knots, are considered for both symmetric and asymmetric monomer compositions. In the AB model employed here, A-type monomers are self-repulsive, B-type monomers are self-attractive, and A-B interactions are neutral, such that the solvent is effectively good for A-type monomers and poor for B-type monomers at low temperatures. We analyze several key observables, including the heat capacity, the radius of gyration, and its temperature derivative for both the entire copolymer ring and the individual blocks, and the probability that a monomer belongs to the knotted region. Our results show that the interplay between knot topology, monomer composition, and temperature strongly influences polymer conformations. Small variations in the B-block length induce nonmonotonic, reentrant-like conformational behavior as a function of temperature, including transitions between knot localization and delocalization at low temperatures. These effects arise from the competition between energetic and entropic contributions imposed by topological constraints.", "url": "https://arxiv.org/abs/2605.09555", "type": "理论+数值", "summary": "1. 本文采用粗粒化格子模型与Wang-Landau蒙特卡洛算法，系统研究了不同拓扑结（unknot、三叶结、八字结、五叶结）和单体组成对双嵌段共聚物环热力学及构象性质的影响。\n2. 其物理核心在于揭示结拓扑、B嵌段长度与温度三者间的竞争导致非单调、回滞式构象行为，以及低温下结的局域化-退局域化转变。\n3. 这一发现阐明了拓扑约束下熵-焓竞争对环状高分子构象的调控机制，为设计温敏性拓扑高分子材料提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Neda Abbasi Taklimi"}, {"name": "Franco Ferrari"}, {"name": "Marcin R. Piątek"}, {"name": "Luca Tubiana"}], "featured_authors": [{"name": "Neda Abbasi Taklimi"}, {"name": "Franco Ferrari"}, {"name": "Marcin R. Piątek"}, {"name": "Luca Tubiana"}], "author_count": 4}, {"id": "2605.09631", "category": "cond-mat", "title": "Effective sextic field theory for tricritical-critical crossover", "abstract": "Effective field theories provide a suitable framework for both particle physics and statistical physics. We delve deeper into the study of the effective three-dimensional scalar field theory for its application to statistical physics, especially considering the role of the sextic coupling in the tricritical-to-critical crossover. The three-loop renormalization of the mass and the two coupling constants that we perform allows us to obtain, for the first time, the complete renormalization group flow of the couplings in that order. We analyze what universality means in this problem and how we can recover non-universal terms from the renormalization group beta functions. The crossover is realized by the convergence of the renormalization group flow towards the line connecting the tricritical and critical fixed points.", "url": "https://arxiv.org/abs/2605.09631", "type": "理论", "summary": "1. 该工作对三维有效标量场论进行了三圈重整化，首次完整求解了质量与两个耦合常数的重整化群流，分析了三临界-临界交叉行为。\n2. 其卖点在于通过六次耦合的重整化群流收敛于连接三临界与临界不动点的线，并展示了从beta函数恢复非普适项的机制。\n3. 这为统计物理中场论中普适性与非普适性的统一描述提供了定量框架，并对关联临界现象的有效场论应用具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Jose Gaite"}], "featured_authors": [{"name": "Jose Gaite"}], "author_count": 1}, {"id": "2605.09690", "category": "cond-mat", "title": "Hole-Doping Suppresses Competing Magnetism in High-DOS C136 Carbon Schwarzite: A Computational Route Toward Superconductivity in Negative-Curvature Carbon Networks", "abstract": "Carbon schwarzites are negative-curvature carbon networks with electronic structures distinct from graphene, fullerenes, and conventional carbon allotropes. Here we report a spin-polarized first-principles screening study of D-type C136 carbon schwarzite focused on the competition between magnetism, doping, and high-DOS metallic behavior. Neutral C136 has a robust competing magnetic branch, with total magnetization of about 11.01-11.03 Bohr magnetons per 136-atom cell. Charged-cell calculations reveal a clear electron-hole asymmetry: adding two electrons per cell increases the total magnetization to 12.11 Bohr magnetons per cell, while removing two electrons reduces it to 9.61. Further hole doping suppresses the magnetic branch monotonically, giving 8.02, 6.34, and 4.76 Bohr magnetons per cell for removal of 4, 6, and 8 electrons, respectively. The most strongly hole-doped point, h8, was examined with spin-polarized NSCF and density-of-states calculations on a 4x4x4 k-point mesh. The NSCF Fermi energy, -0.7414 eV, agrees with the SCF value, -0.7413 eV. The DOS remains high near the Fermi level: at E = -0.740 eV, the total DOS is about 44.69 states/eV/cell, with DOS_up = 33.11 and DOS_down = 11.58 states/eV/cell. Thus h8 combines substantial suppression of the competing magnetic branch with preservation of a high-DOS metallic state. We do not claim superconductivity in C136. Instead, these calculations identify hole doping as a route for suppressing a competing magnetic instability while preserving electronic conditions relevant for further superconductivity screening. Lattice stability, electron-phonon coupling, and transition-temperature estimates remain open problems.", "url": "https://arxiv.org/abs/2605.09690", "type": "理论+数值", "summary": "1. 该工作利用自旋极化第一性原理计算，系统研究了D型C136碳schwarzite中磁性、掺杂与高态密度金属行为的竞争。\n2. 其技术卖点在于揭示空穴掺杂可单调抑制竞争性磁分支（从11.03降至4.76μB/136原子），同时维持费米能级附近高态密度（约44.69态/eV/晶胞）金属态。\n3. 这为通过空穴掺杂消除负曲率碳网络中的磁性不稳定性、进而筛选可能的超导电性提供了计算路线，但晶格稳定性与电声耦合仍需后续研究。", "summary_source": "deepseek", "authors": [{"name": "Eugene Yashin"}], "featured_authors": [{"name": "Eugene Yashin"}], "author_count": 1}, {"id": "2605.09705", "category": "cond-mat", "title": "Spin-charge separation in two-leg t-J ladders", "abstract": "Spin-charge separation is a hallmark of one-dimensional fermionic systems, yet its realization in higher dimensions remains an open question. To address this issue, we investigate a two-leg t-J ladder using the density matrix renormalization group (DMRG) method and its time-dependent extension. By analyzing ground-state correlations and single-particle removal spectra, we systematically examine the effects of plaquette diagonal hopping, spin exchange, and hole doping. Within appropriate parameter regimes, these factors drive the system from the well-known Luther Emery phase, with gapped spin and gapless charge modes, into a Luttinger liquid phase characterized by gapless spin and charge excitations, where signatures of spin-charge separation emerge. In combination with previous studies using exact diagonalization, our results provide evidence that spin-charge separation may persist in wider ladder systems.", "url": "https://arxiv.org/abs/2605.09705", "type": "理论+数值", "summary": "1. 该工作利用密度矩阵重正化群及其含时扩展，系统研究了双腿t-J梯子模型中的自旋电荷分离现象。\n2. 通过分析基态关联函数和单粒子移除谱，揭示了在适当参数下系统从自旋有能隙的Luther-Emery相转变为自旋电荷均无能隙的Luttinger液相，并呈现自旋电荷分离特征。\n3. 研究结果表明，这种一维标志性行为可能存在于更宽的梯子系统，为在准一维体系中实现自旋电荷分离提供了数值证据。", "summary_source": "deepseek", "authors": [{"name": "Luhang Yang"}, {"name": "Elbio Dagotto"}], "featured_authors": [{"name": "Luhang Yang"}, {"name": "Elbio Dagotto"}], "author_count": 2}, {"id": "2605.09743", "category": "cond-mat", "title": "Equilibrium and non-equilibrium properties of active matter systems", "abstract": "Active matter systems encompass both natural and artificially created systems consisting of numerous active particles. These particles actively consume energy to propel themselves or exert mechanical forces, leading to intricate behaviors and a diverse range of collective motions from flocking transition to motility-induced phase separation. The flocking transition refers to the spontaneous alignment and coordination of individuals in a group, resembling the cohesive motion observed in flocks of birds or schools of fish. On the other hand, motility-induced phase separation refers to the segregation of active particles into distinct regions based on their differing motility levels. In this presentation, I will talk about active matter systems, specifically focusing on the collective behavior and dynamics, including the influence of volume exclusion features, the impact of disorder in the media, and the behavior of self-propelled particles in off-lattice domains by introducing spin anisotropy. The objective is to understand how the collective behavior of self-propelled particles is affected by various system parameters, including thermal noise, self-propulsion velocity, external field strength, etc. I will furthermore show the phenomena such as jamming, kinetic arrest, motility-induced phase separation, coexisting phases, microphase separation, and phase transitions within the context of active matter models.", "url": "https://arxiv.org/abs/2605.09743", "type": "理论", "summary": "1. 该工作综述了主动物质系统的平衡与非平衡性质，聚焦自驱动粒子的集体动力学行为，包括成簇转变及运动性诱导相分离等。\n2. 其核心在于系统分析了体积排斥、无序介质及自旋各向异性等因素对粒子自推进速度、热噪声和外场等参数响应的调控机制。\n3. 这为理解主动物质中阻塞、动力学凝固及多相共存等复杂相变行为提供了统一的物理图像与建模启示。", "summary_source": "deepseek", "authors": [{"name": "Mintu Karmakar"}], "featured_authors": [{"name": "Mintu Karmakar"}], "author_count": 1}, {"id": "2605.09962", "category": "cond-mat", "title": "Attenuation of long-wavelength sound in quenched disordered media", "abstract": "We derive analytically, and validate numerically, the dispersion renormalization and attenuation of acoustic waves propagating through quenched disordered media in the long-wavelength limit. We consider weak spatial fluctuations in elastic moduli and/or mass density and compute the disorder-induced self-energies within the leading (Born) approximation. For sufficiently weak disorder, the results depend only on the variances of the fluctuations and are therefore insensitive to the detailed form of the underlying random distribution. For spatially uncorrelated elasticity disorder we obtain Rayleigh-type attenuation, $\\Gamma(q)\\propto q^{d+1}$ , together with a reduction of the sound speed. In contrast, density disorder produces Rayleigh-type attenuation but does not renormalize the acoustic dispersion to leading order. Molecular dynamics simulations and normal-mode analyses of disordered one- and two-dimensional lattices quantitatively confirm the theoretical predictions.", "url": "https://arxiv.org/abs/2605.09962", "type": "理论+数值", "summary": "1. 该工作基于Born近似解析推导并数值验证了淬火无序介质中长波长声波的色散重整化与瑞利型衰减标度律。\n2. 其核心物理发现是弹性模量涨落同时导致声速减小与衰减指数Γ∝q^{d+1}，而质量密度涨落仅产生衰减而不改变色散关系至领头阶。\n3. 该解析结果对无序分布细节不敏感，为理解无序介质中声波传播的普适行为提供了定量基准，并可直接推广至关联无序与有限频率情形。", "summary_source": "deepseek", "authors": [{"name": "Bingyu Cui"}, {"name": "Yuqi Wang"}], "featured_authors": [{"name": "Bingyu Cui"}, {"name": "Yuqi Wang"}], "author_count": 2}, {"id": "2605.09974", "category": "cond-mat", "title": "Localization phase diagram of the Hexagonal Lattice with irrational magnetic flux", "abstract": "We study the Hofstadter model on a hexagonal lattice with irrational magnetic flux in this work. The Hofstadter model of the square lattice with irrational flux has been solved mathematically by Avila in his Fields medal work. However, this theory is usually not applicable to lattices with internal degrees of freedom, such as spin or sub-lattices. In this work, we show that for the hexagonal lattice with only nearest neighbor hopping, the system can still be characterized by a 2*2 transfer matrix and solved exactly by Avila$'$s global theory of Avila although this lattice has two sub-lattices. We obtained the exact localization phase diagram of the hexagonal lattice with irrational flux by this theory, which reveals three pure phases, that is, the extended, localized and critical states but no mobility edge due to the chiral symmetry. We used the renormalization group (RG) theory to verify these results, which can determine part of the phase diagram. We then computed the fractal dimension of the remaining part numerically. The results from both the RG theory and numerical analysis confirmed the phase diagram we get from Avila$'$s global theory.", "url": "https://arxiv.org/abs/2605.09974", "type": "理论+数值", "summary": "1. 该工作利用Avila全局理论精确求解了具有无理磁通六角晶格的Hofstadter模型，获得了完整的局域化相图。\n2. 其核心在于证明尽管六角晶格存在子格自由度，近邻跳跃体系仍可由2×2转移矩阵描述，并由此解析得到扩展态、局域态与临界态三种纯相，手征对称性禁止了迁移率边。\n3. 这为具有内部自由度的晶格系统中无理通量局域化相变提供了严格解析框架，并为重整化群与数值计算验证所支持。", "summary_source": "deepseek", "authors": [{"name": "Qi Gao"}, {"name": "Shuo Zhang"}, {"name": "Wei Chen"}], "featured_authors": [{"name": "Qi Gao"}, {"name": "Shuo Zhang"}, {"name": "Wei Chen"}], "author_count": 3}, {"id": "2605.10089", "category": "cond-mat", "title": "A molecular perspective on coordination, screening, and emergent length scales in lithium electrolytes", "abstract": "Lithium electrolytes are commonly described using separate conceptual frameworks for local coordination chemistry, electrostatic screening, and ionic transport. This separation is effective in dilute conditions but breaks down at higher concentration, where coordination, ion pairing, clustering, and collective dynamics become intrinsically coupled. In this Perspective, we develop a unified multiscale framework that links local coordination motifs, mesoscopic ionic organization, and macroscopic transport within a single physical picture. Through representative examples spanning carbonate liquids, polymer electrolytes, concentrated systems, and confinement, we show that increasing concentration drives a systematic evolution from solvent-dominated Li$^+$ coordination to ion pairing, clustering, and correlated domains. In this regime, screening and transport are not independent phenomena but arise from the same underlying correlated structures. This perspective implies that rational electrolyte design must simultaneously control short-range coordination, mesoscale organization, and collective electrostatic response.", "url": "https://arxiv.org/abs/2605.10089", "type": "理论", "summary": "1. 该工作建立了从局部配位化学、介观离子组织到宏观输运的统一多尺度框架，以理解锂电池电解液在高浓度下的耦合行为。\n2. 其核心卖点在于揭示浓度升高时配位、离子配对与团簇演化主导屏蔽和输运，后者源自相同关联结构而非独立现象。\n3. 这为电解液理性设计提供了同时调控短程配位、介观有序和集体静电响应的明确启发，并适用于相关理论模型与实验体系。", "summary_source": "deepseek", "authors": [{"name": "A. Coste"}, {"name": "E. Zunzunegui-Bru"}, {"name": "A. van Roekeghem"}, {"name": "I. Skarmoutsos"}, {"name": "S. Mossa"}], "featured_authors": [{"name": "A. Coste"}, {"name": "E. Zunzunegui-Bru"}, {"name": "A. van Roekeghem"}, {"name": "I. Skarmoutsos"}, {"name": "S. Mossa"}], "author_count": 5}, {"id": "2605.10104", "category": "cond-mat", "title": "B-H hysteresis in itinerant Feromagnetism from Chern-Simons Gauge theory", "abstract": "The log H term is derived in the free energy of many-electron system from Chern-Simons gauge theory. Owing to the singularity at $H=0$, this leads the first order transition and B-H hysteresis to many-electron systems of symmetric and single domain. This has the origin in quantum mechanics and is irrelevant to non-invertible motions of domains. This transition appears in single and symmetric domain.", "url": "https://arxiv.org/abs/2605.10104", "type": "理论", "summary": "1. 该工作从Chern-Simons规范理论导出多电子体系自由能中的log H项，据此阐明巡游铁磁对称单畴中的一阶相变与B-H磁滞。\n2. 其核心物理在于H=0处奇异性驱动的一阶相变及磁滞源自纯粹量子力学机制，与畴壁非可逆运动完全无关。\n3. 这揭示了巡游铁磁体系中磁滞的电子起源，为理解单畴磁滞回线的微观机制提供了新方向。", "summary_source": "deepseek", "authors": [{"name": "Kenzo Ishikawa"}], "featured_authors": [{"name": "Kenzo Ishikawa"}], "author_count": 1}, {"id": "2605.10191", "category": "cond-mat", "title": "Computing eigenpairs of quantum many-body systems with Polfed.jl", "abstract": "We present this http URL , an open-source Julia package implementing the Polynomially Filtered Exact Diagonalization (POLFED) algorithm for computing mid-spectrum eigenvalues and eigenvectors (shortly, eigenpairs) of quantum many-body Hamiltonians. Access to such eigenpairs is essential for studying non-equilibrium many-body physics, but is hindered by the exponential growth of Hilbert-space dimension. POLFED addresses this challenge through a polynomial spectral transformation evaluated on the fly within a Lanczos iteration, preserving Hamiltonian sparsity and substantially reducing memory costs compared to other diagonalization methods. The package supports flexible energy targeting, automatic optimization of the spectral mapping for structured Hamiltonians, and GPU acceleration, which is particularly effective since the dominant computational cost reduces to repeated sparse matrix-vector multiplications. Benchmarks on disordered spin-chain and fermionic models demonstrate access to larger system sizes than alternative approaches, and CPU--GPU comparisons confirm significant speedups. In particular, we also provide code for constructing the quantum sun model Hamiltonian, a toy model of a many-body ergodicity-breaking transition. While our focus is on many-body Hamiltonians, this http URL may be applied to any large sparse matrix.", "url": "https://arxiv.org/abs/2605.10191", "type": "理论+数值", "summary": "1. 该工作介绍了开源Julia软件包Polfed.jl，实现了多项式滤波精确对角化算法，用于计算量子多体哈密顿量中间谱本征值和本征向量。\n2. 其技术核心是通过Lanczos迭代中在线评估多项式谱变换来保持哈密顿量稀疏性，大幅降低内存开销，并支持GPU加速以优化稀疏矩阵向量乘法。\n3. 这为研究非平衡多体物理提供了访问更大系统尺寸的有效工具，且该算法可推广至任意大型稀疏矩阵的特征对求解。", "summary_source": "deepseek", "authors": [{"name": "Rok Pintar"}, {"name": "Konrad Pawlik"}, {"name": "Rafał Świętek"}, {"name": "Miroslav Hopjan"}, {"name": "Jan Šuntajs"}, {"name": "Jakub Zakrzewski"}, {"name": "Piotr Sierant"}, {"name": "Lev Vidmar"}], "featured_authors": [{"name": "Rok Pintar"}, {"name": "Konrad Pawlik"}, {"name": "Rafał Świętek"}, {"name": "Jakub Zakrzewski"}, {"name": "Piotr Sierant"}, {"name": "Lev Vidmar"}], "author_count": 8}, {"id": "2605.10252", "category": "cond-mat", "title": "Saddle-node bifurcation in interfacial morphology selects battery degradation phase", "abstract": "We propose a minimal nonlinear closure ODE for the dynamic active-area factor of a battery interface and show that it exhibits a saddle-node bifurcation when the smoothing rate saturates with surface roughness. The closure is the simplest physically motivated extension of a recently introduced single-fixed-point closure [C. Bae, in preparation (2026)]: u = K - u/(1 + alphau^2), where u = xi - 1 is the dimensionless excess active area, K the dimensionless drive, and alpha a single saturation parameter. The bifurcation occurs at K_c = 1/(2sqrt(alpha)), separating a smooth passivating phase from a morphologically unstable phase. Mapping four canonical anode configurations -- graphite, silicon composite, lithium metal, and anode-free Li/Cu -- onto the closure via end-of-cycling steady-state xi extracted from publicly available long-cycle data populates the stable branch with monotonically increasing K/K_c ratios: graphite (~0.01), silicon composite (~0.24), lithium metal (~0.73), and anode-free (~0.95). The anode-free configuration sits within 5% of the saddle-node threshold, predicting a vanishingly small operational stability window in current density, temperature, and electrolyte composition. We test three falsifiable predictions of the framework -- a critical current density, a critical temperature shift, and a mean-field critical-slowing-down exponent -- and find them broadly consistent with publicly available data. We argue that this near-critical position is universal to nucleation-controlled deposition on non-passivating substrates.", "url": "https://arxiv.org/abs/2605.10252", "type": "理论", "summary": "1. 该工作提出一个描述电池界面形态演化的最小非线性闭包常微分方程，并揭示其鞍结分岔决定退化相变。\n2. 其核心卖点在于将石墨、硅复合、锂金属和无阳极四种阳极构型映射至同一闭包，发现无阳极构型的操作稳定性窗口已逼近分岔阈值（K/K_c≈0.95）。\n3. 该研究断言，这一近临界位置是成核控制沉积在非钝化基底上的普遍特征，为预测电池失效边界与设计稳定界面提供了可检验的物理框架。", "summary_source": "deepseek", "authors": [{"name": "Changdeuck Bae"}], "featured_authors": [{"name": "Changdeuck Bae"}], "author_count": 1}, {"id": "2605.10254", "category": "cond-mat", "title": "Floquet-tuned superfluid-checkerboard competition in dipolar bosons", "abstract": "We study hard-core dipolar bosons on a square lattice subject to a unidirectional periodic drive that Floquet-engineers anisotropic hopping. Driving along one lattice direction provides a controlled way to suppress transverse tunneling, yielding a kinetically quasi-one-dimensional regime with strongly anisotropic transport within the l
