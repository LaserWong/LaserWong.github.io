10731", "type": "理论", "summary": "1. 该工作发展了一种适用于任意有损多微环耦合结构的非微扰理论，解析了双环光子分子中通过共振干涉增强压缩光产生的机制。\n2. 其核心卖点在于利用环间杂化效应，通过分裂寄生共振抑制四波混频热噪声，或移动泵浦共振补偿群速度色散，实现近单位保真度及显著压缩增强。\n3. 这为片上量子光源中寄生过程的主动抑制与色散工程提供了明确路径，可推广至更复杂谐振器网络的量子噪声调控。", "summary_source": "deepseek", "authors": [{"name": "M. Sloan"}, {"name": "J. E. Sipe"}], "featured_authors": [{"name": "M. Sloan"}, {"name": "J. E. Sipe"}], "author_count": 2}, {"id": "2605.10768", "category": "quant-ph", "title": "Unitaria: Quantum Linear Algebra via Block Encodings", "abstract": "We introduce Unitaria, a Python library that brings the simplicity of classical linear algebra toolkits such as NumPy and SciPy to the implementation of quantum algorithms based on block encodings, a general-purpose abstraction in which a matrix is embedded as a sub-block of a larger unitary operator. Their implementation has so far required deep knowledge of low-level circuit construction, which Unitaria aims to eliminate. The library provides a composable, array-like interface through which users can define block encodings of matrices and vectors, combine them through standard operations such as addition, multiplication, tensor products, and the Quantum Singular Value Transformation, and extract the resulting quantum circuits automatically. A key feature is a matrix-arithmetic evaluation path in which every operation can be computed directly on encoded vectors and matrices without dependence on ancilla qubits or circuit simulation. This enables correctness verification and classical simulation that scale well beyond what state vector simulation permits and also allows resource estimation, including gate counts, qubit counts, and normalization constants, without executing any circuit. Together, these capabilities allow researchers to develop, verify, and analyze quantum linear algebra algorithms today, ahead of the availability of error-corrected hardware. Unitaria is open source and available at this https URL .", "url": "https://arxiv.org/abs/2605.10768", "type": "数值", "summary": "1. 本文发布了Unitaria库，为基于块编码的量子线性代数算法提供类似NumPy的简洁可组合接口，并自动生成对应量子电路。\n2. 其核心卖点在于引入无需辅助量子比特或电路模拟的矩阵算法评估路径，可直接计算编码矩阵和向量的操作，并实现超越态矢量模拟的经典验证与资源估算。\n3. 这使研究者能在纠错量子硬件成熟前，高效开发、验证和分析量子线性代数算法，并为后续量子数值计算实践提供了即用工具。", "summary_source": "deepseek", "authors": [{"name": "Matthias Deiml"}, {"name": "Oliver Hüttenhofer"}, {"name": "Ram Mosco"}, {"name": "Jakob S. Kottmann"}, {"name": "Daniel Peterseim"}], "featured_authors": [{"name": "Matthias Deiml"}, {"name": "Oliver Hüttenhofer"}, {"name": "Ram Mosco"}, {"name": "Jakob S. Kottmann"}, {"name": "Daniel Peterseim"}], "author_count": 5}, {"id": "2605.10783", "category": "quant-ph", "title": "On the KAK Decomposition and Equivalence Classes", "abstract": "The KAK decomposition is a fundamental tool in Lie theory and quantum computing. Despite its widespread use, the mathematical foundations remain incomplete, particularly regarding the precise conditions for the decomposition and the characterization of equivalence classes under multiplication by elements of $K$. Here, we present a mathematical theory of the KAK decomposition for connected compact semisimple Lie groups and derive the decomposition for $\\mathrm{SU}(4)$. In particular, we clarify the relationship between various definitions of a Cartan decomposition in the literature and give a complete proof of a general KAK decomposition theorem. We then distinguish two distinct notions of KAK equivalence classes, double coset equivalence and projective equivalence, thereby addressing mathematical inconsistencies regarding KAK classification in the literature. Specifically, for $\\mathrm{SU}(4)$, we show that local equivalence classes under multiplication by $\\mathrm{SU}(2)\\otimes \\mathrm{SU}(2)$ are geometrically represented not by the usual \"Weyl chamber\" as claimed in the existing literature. Instead, the \"Weyl chamber\" is only recovered by the projective-local equivalence which disregards global phases. We develop a systematic theory for determining equivalence and uniqueness for both notions of equivalence. Our work establishes a rigorous Lie-theoretic foundation for the theory of quantum gates and circuits.", "url": "https://arxiv.org/abs/2605.10783", "type": "理论", "summary": "1. 该工作为紧连通半单李群建立了KAK分解的严格数学理论，并完整导出了SU(4)群的分解及其两种等价类。\n2. 核心在于厘清了双陪集等价与投影等价的本质差异，揭示了现有文献将局部等价类误用为Weyl chamber的数学不自治性。\n3. 这为量子门与量子电路的李理论奠基提供了严谨框架，并启发后续研究在门分类与优化中更精确地处理局域相位。", "summary_source": "deepseek", "authors": [{"name": "Dawei Ding"}, {"name": "Yu Liu"}, {"name": "Zi-Wen Liu"}], "featured_authors": [{"name": "Dawei Ding"}, {"name": "Yu Liu"}, {"name": "Zi-Wen Liu"}], "author_count": 3}, {"id": "2605.10800", "category": "quant-ph", "title": "Holonomy and Complementarity in Open Quantum Systems", "abstract": "Complementarity relations constrain the distribution of coherence, predictability, and openness in quantum systems. Here we show that, in open quantum systems, these local constraints acquire a geometric interpretation through quasistatic transport. For a driven dissipative qubit, the complementarity variables define cylindrical coordinates on the Bloch sphere, while openness appears geometrically as a radial deficit associated with reduction from a larger Hilbert space. Quasistatic driving induces a work connection on the resulting steady-state manifold whose curvature determines the cyclic response. Hamiltonian-aligned dissipation produces an exact work connection and vanishing cyclic work, whereas fixed pointer-basis dissipation generates non-integrable transport, finite curvature, and holonomic response. The resulting curvature admits a phase-resolved representation on the triality manifold and develops perturbatively with pointer--Hamiltonian mismatch. In the weak-mismatch limit, the curvature is governed by a competition between coherence-preserving and pure-dephasing channels, producing symmetry-related positive- and negative-curvature sectors. These results establish a direct connection between complementarity, dissipation, and geometric thermodynamic response, and show that cyclic quasistatic work provides an operational probe of nonequilibrium quantum geometry.", "url": "https://arxiv.org/abs/2605.10800", "type": "理论+数值", "summary": "1. 该工作证明开放量子系统中的互补性约束可通过准静态输运获得几何解释，驱动耗散量子比特的互补变量定义布洛赫球柱坐标。\n2. 其核心在于揭示哈密顿量对齐耗散产生精确功联络与零循环功，而固定指针基耗散导致不可积输运与有限曲率完整响应，曲率由相干保持与纯退相通道竞争决定。\n3. 这为建立互补性、耗散与几何热力学响应的直接联系提供了框架，并使循环准静态功成为非平衡量子几何的操作性探针。", "summary_source": "deepseek", "authors": [{"name": "Eric R Bittner"}], "featured_authors": [{"name": "Eric R Bittner"}], "author_count": 1}, {"id": "2605.10846", "category": "quant-ph", "title": "Exact steady states of interacting driven dissipative fermionic systems with hidden time-reversal symmetry", "abstract": "We present exact solutions for the non-equilibrium steady states of a class of dissipative spinless fermionic systems with arbitrary Hamiltonian pairing terms, global charging energy interactions, and uniform single particle loss on every site. Our exact solution is found by generalizing the coherent quantum absorber technique to fermionic systems, and our result establishes the existence of hidden time-reversal symmetry in driven-dissipative fermionic models. The steady state exhibits a first order phase transition in the particle density, with the resulting jump discontinuity in density persisting even for finite dissipation rates. A mean-field description of the model exhibits a bistable regime that encompasses the first-order transition line yet which fails to accurately predict its precise location via a Maxwell construction. We also show that the model's hidden time-reversal symmetry results in an Onsager symmetry of certain two-time correlation functions.", "url": "https://arxiv.org/abs/2605.10846", "type": "理论", "summary": "1. 该工作通过将相干量子吸收体技术推广至费米子系统，精确求解了一类含配对项、全局充电能及均匀单粒子损耗的耗散无自旋费米子模型的非平衡稳态。\n2. 其核心在于发现隐藏时间反演对称性，导致稳态粒子密度出现有限耗散下持续存在的一阶相变，且平均场双稳区无法通过麦克斯韦构造准确定位相变线。\n3. 这揭示隐藏对称性诱导的昂萨格关系，为精确求解驱动-耗散费米多体系统提供范例，并对有限耗散下非平衡相变行为研究具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Andrew Lingenfelter"}, {"name": "Aashish A. Clerk"}], "featured_authors": [{"name": "Andrew Lingenfelter"}, {"name": "Aashish A. Clerk"}], "author_count": 2}, {"id": "2605.10932", "category": "quant-ph", "title": "Crystallographic Symmetry Generates Phononic Holonomic Gates with Biased-Erasure Channels", "abstract": "Solid-state processors require control layers whose errors are legible to quantum-error-correction decoders. We show that crystallographic symmetry can provide such a layer in strain-active Lambda manifolds. When the projected strain tensor and Lambda-transition operators share a multiplicity-one two-dimensional irreducible representation, symmetry fixes the linear strain interaction to a scalar dot product. Two phase-locked mechanical modes synthesize a circular strain field, enabling complex phononic Lambda-leg control without local microwave near fields. On this manifold we construct a superadiabatic echo-lune holonomic gate using Lambda-leg control and a resonant double-quantum counterdiabatic tone. Rotating-frame simulations of a nitrogen-vacancy center give 99.88% conditional average fidelity in 1.833 microseconds, or 99.40% when leakage is counted as error. A resonant gigahertz high-overtone bulk acoustic resonator analysis translates the Hamiltonian into Rabi-rate, linewidth, and envelope-tracking requirements. The bright-state structure organizes noise: A2-sector perturbations are parity-filtered into an optically distinguishable auxiliary state, whereas transverse E-sector faults are echo suppressed and retained as a decoder stress axis. The extracted channel has 0.47% erasure probability and 0.168% residual Z error. In XZZX code-capacity simulations, this biased-erasure model yields a nominal 64% fit-extrapolated data-qubit reduction relative to an unstructured Rabi baseline. Repeated-round detector-model diagnostics preserve the nominal distance-9 proxy and identify missed erasures, transverse floors, leakage/flag timing, and strong crosstalk as validation limits. Extensions to orbital Lambda systems and bright-projector phonon-bus diagnostics identify crystallographic symmetry as a principle for co-designing phononic actuation, leakage, noise bias, and quantum decoding.", "url": "https://arxiv.org/abs/2605.10932", "type": "理论+数值", "summary": "1. 本工作通过晶体对称性在应变活性Lambda流形中实现了声子全息门，并构建了具备偏置擦除特性的量子控制层。\n2. 其技术卖点在于对称性将线性应变相互作用固定为标量点积，由双相位锁定机械模式合成圆形应变场，利用超绝热回波-lune全息门在氮空位中心旋转框架模拟中取得99.88%条件保真度，并将噪声组织为0.47%擦除概率与0.168%残留Z误差的偏置擦除信道。\n3. 该偏置擦除模型在XZZX码容量模拟中通过拟合外推实现名义64%数据量子比特的缩减，且扩展至轨道Lambda系统与亮投影声子总线诊断表明晶体对称性可作为协同设计声子驱动、泄漏、噪声偏置与量子解码的通用原理。", "summary_source": "deepseek", "authors": [{"name": "El Mustapha Mansouri"}, {"name": "Keigo Arai"}], "featured_authors": [{"name": "El Mustapha Mansouri"}, {"name": "Keigo Arai"}], "author_count": 2}, {"id": "2605.10943", "category": "quant-ph", "title": "A passive self-correcting quantum memory in three dimensions", "abstract": "We construct a 3D Pauli stabilizer Hamiltonian whose ground state space can encode a qubit for exponential time when coupled to a bath at non-zero temperature. Our construction recursively applies a sequence of transformations to a seed Hamiltonian that increases the memory lifetime of the encoded qubit while maintaining geometric locality in $\\mathbb{R}^3$.", "url": "https://arxiv.org/abs/2605.10943", "type": "理论", "summary": "1. 本文构建了一种三维泡利稳定子哈密顿量，其基态空间在非零温度下与热库耦合时能够指数长时间地编码一个量子比特。\n2. 核心卖点在于通过递归施加变换序列，在保持几何局域性的前提下系统提升编码存储寿命，实现被动自纠正量子存储器。\n3. 该构造为在有限温度下实现可扩展的量子纠错存储器提供了明确的理论框架，并启发对更高维自纠正模型的探索。", "summary_source": "deepseek", "authors": [{"name": "Shankar Balasubramanian"}, {"name": "Margarita Davydova"}, {"name": "Ting-Chun Lin"}], "featured_authors": [{"name": "Shankar Balasubramanian"}, {"name": "Margarita Davydova"}, {"name": "Ting-Chun Lin"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
