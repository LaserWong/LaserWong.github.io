释提供线索。", "summary_source": "deepseek", "authors": [{"name": "Adwait Gaikwad"}, {"name": "Gautam Mandal"}, {"name": "Ajay Mohan"}], "featured_authors": [{"name": "Adwait Gaikwad"}, {"name": "Gautam Mandal"}, {"name": "Ajay Mohan"}], "author_count": 3}, {"id": "2610.34380", "category": "hep-th", "title": "Spiralling into Dark Energy: Axio-Dilaton Attractors in Light of Current Data", "abstract": "In string compactifications, dilaton-like moduli always come paired with axions, and the two fields interact through a curved field-space metric. We study the cosmology of such an axio-dilaton system, in which the dilaton rolls down an exponential potential corrected by a polynomial prefactor and couples to a massless axion through the kinetic function $W=e^{-\\xi\\phi_1/M_p}$. A dynamical systems analysis shows that the late-time attractor follows a non-geodesic trajectory in field space with equation of state $\\omega_\\phi=(\\lambda-2\\xi)/(\\lambda+2\\xi)$, so accelerated expansion is possible for steep potentials provided $\\xi\\gg\\lambda$. No physical fixed point is phantom. A Bayesian analysis with DESI DR2 BAO, binned Pantheon supernovae and Planck 2018 distance priors gives $\\lambda\\gtrsim7$--$9$ and $\\log_{10}\\xi\\gtrsim2.5$ at 95% confidence, together with a degeneracy between the two parameters. The model is slightly favoured over $\\Lambda$CDM by current data, while the different polynomial corrections cannot yet be distinguished. This contribution is based on arXiv:2609.22539 .", "url": "https://arxiv.org/abs/2610.34380", "type": "理论", "summary": "1. 该工作分析了弦紧致化中经弯曲场空间度量耦合的axio-dilaton系统，在指数势加多项式前因子与动能函数W=e^{-ξφ1/Mp}下开展宇宙学与贝叶斯约束。\n2. 其卖点是动力学分析给出场空间非测地晚期吸引子，状态方程w_φ=(λ-2ξ)/(λ+2ξ)，ξ≫λ时陡势亦可加速膨胀且无物理phantom不动点。\n3. 结合DESI DR2 BAO、分bin Pantheon超新星与Planck距离先验得到λ≳7–9、log10ξ≳2.5（95%），模型略优于ΛCDM但多项式修正尚不可分辨，需更高精度数据检验。", "summary_source": "deepseek", "authors": [{"name": "Mario Ramos-Hamud"}], "featured_authors": [{"name": "Mario Ramos-Hamud"}], "author_count": 1}, {"id": "2610.34475", "category": "hep-th", "title": "Nonlinear Higher-Spin Theory in $O(4,1)$ de Sitter Space", "abstract": "Four versions of the higher-spin gauge theory compatible with $O(4,1)$ de Sitter geometry in presence of fermions are proposed. Two of them exhibit the structure of $\\mathbb{Z}_2\\times \\mathbb{Z}_2$ Lie superalgebra proposed originally by one of the authors for the description of de Sitter supergravity \\cite{Vasiliev:1985vtv}. Two of the proposed models are unitary in the bosonic sectors in analogy with the recent proposal by Lang and Neiman \\cite{Lang:2026inn} and admit a pseudo involution in presence of fermions suggesting possible (anti)unitarity associated either with the time reversal in $dS_4$ or with the space-time doubling.", "url": "https://arxiv.org/abs/2610.34475", "type": "理论", "summary": "1. 该文针对O(4,1) de Sitter几何与费米子共存的情形，提出了四种高自旋规范理论版本，并刻画其超代数及幺正性特征。\n2. 其核心卖点在于：其中两种模型具有最初为de Sitter超引力提出的Z2×Z2李超代数，且有两种在玻色扇区幺正、含费米子时存在伪对合。\n3. 该伪对合提示可能存在与dS4时间反演或时空加倍相联系的（反）幺正性，为检验de Sitter高自旋理论及超引力扩展的自洽性提供了明确切入点。", "summary_source": "deepseek", "authors": [{"name": "O.A. Gelfond"}, {"name": "M.A. Vasiliev"}], "featured_authors": [{"name": "O.A. Gelfond"}, {"name": "M.A. Vasiliev"}], "author_count": 2}, {"id": "2610.34752", "category": "hep-th", "title": "Two-node Dualities from Elementary Dualities in 3d and 4d", "abstract": "A new 3d $\\mathcal{N}=2$ two-node Seiberg-like duality, analogous to the 4d $\\mathcal{N}=1$ Intriligator--Leigh--Strassler~(ILS) duality, is proposed. As strong evidence, we check the agreement between the 3d $\\mathcal{N}=2$ ellipsoid partition functions for numerous cases using s-confinement method. Surprisingly, our derivation assumes only two elementary 3d $\\mathcal{N}=2$ dualities: Aharony and Benini--Benvenuti--Pasquetti, which reinforces the idea dualities from dualities. We also revisit the original ILS duality and provide a derivation based on nodewise dualities. In particular, we apply a sequence of Seiberg and Kutasov--Schwimmer dualities to individual gauge nodes, with Higgsing at an intermediate step, and subsequently integrate out the massive fields.", "url": "https://arxiv.org/abs/2610.34752", "type": "理论", "summary": "1. 该文提出一个3d \\(\\mathcal{N}=2\\)双节点Seiberg-like对偶，并重新审视4d \\(\\mathcal{N}=1\\) ILS对偶，给出基于逐节点对偶的推导。\n2. 其核心是仅依赖Aharony与Benini–Benvenuti–Pasquetti两个基本3d对偶，按节点施加Seiberg/Kutasov–Schwimmer对偶、中间Higgsing并积掉重场，同时以椭球配分函数和s-confinement在多例中检验。\n3. 这强化了“对偶来自对偶”的构造思想，为系统生成多节点3d/4d对偶及用配分函数验证提供了可推广框架。", "summary_source": "deepseek", "authors": [{"name": "Yuanyuan Fang"}, {"name": "Sungjoon Kim"}], "featured_authors": [{"name": "Yuanyuan Fang"}, {"name": "Sungjoon Kim"}], "author_count": 2}, {"id": "2610.34858", "category": "hep-th", "title": "Reparametrisation invariance, anomalies and pseudoscalar states in massless quantum electrodynamics", "abstract": "In electrodynamics, and more generally in gauge theories, quantisation introduces an ambiguity whereby the vector current, the axial current, or both may acquire an anomalous divergence. These anomalies can be classified as relevant, conventionally associated with the infrared properties of the theory, and irrelevant, arising from the freedom in the choice of renormalisation scheme. We show that, under a axial reparametrisation of the fermion fields, the global axial symmetry can be promoted to a gauge redundancy. Requiring this gauge symmetry to be preserved at the quantum level eliminates the irrelevant anomalies, leaving a non-propagating pseudoscalar field that acts as a Lagrange multiplier enforcing the familiar axial anomaly. We further argue that, on topologically non-trivial spacetimes, in particular those with non-trivial second cohomology, this axial gauge symmetry can undergo a Higgs mechanism, rendering the pseudoscalar field an emergent propagating degree of freedom. Finally, we briefly point out an analogous emergent state associated with the conformal anomaly.", "url": "https://arxiv.org/abs/2610.34858", "type": "理论", "summary": "1. 该工作研究无质量量子电动力学中轴重参数化下的异常与赝标量态，表明将费米子场的整体轴对称性提升为量子层面保持的规范冗余可消除无关异常，并留下作为拉格朗日乘子的非传播赝标量场以实施轴异常。\n2. 其核心卖点是在具有非平凡第二上同调的拓扑非平凡时空上，该轴规范对称性可经希格斯机制使赝标量场获得涌现传播自由度，同时以重参数化不变性清晰区分相关与无关异常。\n3. 这为理解异常、规范冗余与拓扑时空上的对称性破缺提供了统一视角，并暗示共形异常也可能对应类似的涌现传播态，值得后续在弯曲时空与规范理论中检验。", "summary_source": "deepseek", "authors": [{"name": "Joshua Cesca"}, {"name": "Archil Kobakhidze"}, {"name": "Elden Loomes"}], "featured_authors": [{"name": "Joshua Cesca"}, {"name": "Archil Kobakhidze"}, {"name": "Elden Loomes"}], "author_count": 3}, {"id": "2610.35007", "category": "hep-th", "title": "Graph-Based Algorithms for Worldline EFT Integrands", "abstract": "We present novel graph-centered algorithms for the construction and representation of worldline effective field theory (WEFT) integrands that separate the topological and algebraic structure of loop integrands into independent graph-numerator pairs. In this representation, the graph encodes all propagators, worldline source and sink vertices, momentum routing, i0 prescriptions, and proper-time dependence, while the numerator carries only the minimal algebraic, tensorial content. To construct integrands at fixed post-Minkowskian order we propose a generalized Berends-Giele construction that minimizes the number of expensive tensor contraction operations. We also discuss simplification and canonicalization strategies through \"serialization\" of worldline propagators and the application of \"selfie\"-subdiagram partial-fraction identities, yielding a minimal canonical topology basis. We further show that the graph-numerator representation naturally generalizes the notion of an integral family and its sectors, relevant for integration-by-parts (IBP) reduction: propagators are not constrained to a single master labeling, and each sector carries its own minimal set of independent scalar products, completing into an overcomplete global family. This setup minimizes the total number of required integral sectors through an optimal use of sector symmetries and enables independent optimization of propagator labeling for IBP reductions. The algorithms are implemented in the Rust crate FeynRIR, which is currently able to efficiently compute integrands for the variation of the effective WEFT action, the equations of motion for the worldlines and the (radiation-reacted) impulse.", "url": "https://arxiv.org/abs/2610.35007", "type": "理论", "summary": "1. 该工作提出以图为核心的算法，将世界线有效场论圈积分被积函数分解为图与分子两部分，并在 Rust 工具 FeynRIR 中实现，可计算作用量变分、世界线运动方程及辐射反作用冲量。\n2. 其核心在于图编码传播子、源/汇顶点、动量路由、i0 与固有时依赖，分子仅保留最小张量代数内容，并借助广义 Berends-Giele、传播子序列化与 selfie 子图部分分式恒等式得到最小规范拓扑基。\n3. 该图-分子表示自然推广积分族与扇区，使传播子标签可按对称性独立优化并减少 IBP 约化所需扇区，为后闵可夫斯基阶 WEFT 计算提供可扩展框架。", "summary_source": "deepseek", "authors": [{"name": "Gregor Kälin"}, {"name": "Jungwon Lim"}], "featured_authors": [{"name": "Gregor Kälin"}, {"name": "Jungwon Lim"}], "author_count": 2}, {"id": "2610.35124", "category": "hep-th", "title": "Relating Dark Dimension Size with Dark Energy via 5D Quintessence Potential and Casimir Energy", "abstract": "We explore effective field theory (EFT) realizations of the dark dimension (DD) scenario in which the size of the DD is determined by the competition between a 5D quintessence potential and the Casimir energy. When only contributions from massless fields are considered, the Casimir energy does not have a typical energy scale, and the 4D dark energy (DE) scale is set by the height of the 5D quintessence potential. The simple 5D model we first study has an attractive feature that the size of the DD is related to the 4D vacuum energy (VE), as outlined above. However, it turns out that the 4D VE thus obtained cannot work as the 4D DE in the standard cosmological setting. One of the discrepancies between the VE and the DE manifests in the radion dependence of the effective 4D Newton's gravitational constant. This leads us to explore a 5D model in which the 4D Einstein-Hilbert (EH) action is dominantly induced by quantum effects, leaving the radion dependence of the 4D Newton's constant subdominant. This model leads to an attractive cosmological model, realizing the mechanism explained in the beginning. We also explore a 6D model with the total internal volume fixed, to make the 4D Newton's constant independent of the radion. We first study a scenario in which the sizes of the 5th and the 6th dimensions are of the same order. In this scenario, the physical origin of the size of the DD is left to its UV completion. Next, we turn to a scenario in which there is a large hierarchy between the sizes of the 5th and the 6th dimensions. In this scenario, the energy scale of the 5D quintessence potential turns out to be much higher than the energy scale of the 4D DE as inferred from the cosmological observations, so we need to subtract a constant term in 4D to tune the 4D DE. This prevents us from obtaining the scaling relation for the DE expected in the dSDC.", "url": "https://arxiv.org/abs/2610.35124", "type": "理论", "summary": "1. 该文在有效场论框架下研究暗维度尺寸由5D quintessence势与Casimir能竞争决定，并构造5D与6D模型以协调4D真空能、牛顿常数和暗能量。\n2. 其关键改进是让4D爱因斯坦-希尔伯特作用主要由量子效应诱导，压低有效牛顿常数对radion的依赖，使DD尺寸与4D真空能的关系可兼容标准宇宙学；固定6D内部总体积则进一步消除该依赖。\n3. 结果显示，第五、第六维同量级时DD尺寸起源仍待UV完成，而大层级情形需额外4D常数调节且难以恢复dSDC预期的暗能量标度关系，这为DD场景的紫外约束提供了判据。", "summary_source": "deepseek", "authors": [{"name": "Rashmikanta Mantry"}, {"name": "Kazuyuki Furuuchi"}], "featured_authors": [{"name": "Rashmikanta Mantry"}, {"name": "Kazuyuki Furuuchi"}], "author_count": 2}, {"id": "2610.35135", "category": "hep-th", "title": "Exact Stress Tensor Flows in Causal Electrodynamics: Auxiliary Field Formalism", "abstract": "Causal self-dual nonlinear electrodynamics admits a simple auxiliary-field description: the Lagrangian is linear in the two Lorentz invariants of the field strength, and the dynamics is encoded in a potential $W(\\varphi)$ of a single auxiliary variable. We study non-perturbative $T\\bar T$-like flows of these theories in this formalism. The irrelevant (stress-tensor) deformation acts on the potential by a rescaling, while the marginal ModMax-type deformation translates its vacuum. We derive the resulting flow equations exactly, show that the irrelevant exact $T\\bar T$-like flow takes the autonomous form $\\partial_\\lambda\\mathcal L=X\\,F(r)$, where the closed form kernel $F$ depends only on the ratio $r=-T^\\mu{}_\\mu/\\sqrt{4X-Y}$ of stress-tensor invariants. We also give an explicit reconstruction of the auxiliary potential from a given kernel. Causality imposes the differential inequality $D(r)>1/(1-r)$, while a globally single-valued kernel requires the ratio $r$ to be monotonic along the auxiliary branch. We examine the relation between the evenness of the exact $T\\bar T$-like flow , the $\\varphi$-parity of the potential, and the analyticity of the Lagrangian in the electromagnetic invariants, including the effect of a marginal ModMax parameter. We construct the linear auxiliary and Hamiltonian formulations and show that the Hamiltonian flow is governed by the same exact $T\\bar T$-like flow with the opposite sign. We also express Born's Legendre self-duality, the two characteristic cones, and the energy conditions in terms of the kernel. In particular, $r=(\\varepsilon-p_\\perp)/(\\varepsilon+p_\\perp)$ has a direct physical interpretation. Exact $T\\bar T$-like flow s are obtained for generalized Born-Infeld, logarithmic, q-deformed, and no-$\\tau$-maximum electrodynamics.", "url": "https://arxiv.org/abs/2610.35135", "type": "理论", "summary": "1. 该文在因果自对偶非线性电动力学的辅助场表述中，将拉氏量写为两个洛伦兹不变量的线性函数并把动力学编码于单辅助变量势，系统研究非微扰的类T\\bar T应力张量流。\n2. 其核心贡献在于证明无关形变化为势的重新标度、边缘ModMax型形变化为真空平移，得到精确自主流 ∂λL=X F(r)，核F仅依赖 r=-T^μ_μ/√(4X-Y)，并受因果性不等式 D(r)>1/(1-r) 与辅助分支上r单调性的单值性约束。\n3. 该框架把Born自对偶、特征锥和能量条件统一到核函数语言，显式构造广义Born-Infeld、对数、q形变及无τ最大理论的精确流，为研究因果非线性电磁的应力张量形变提供可计算起点。", "summary_source": "deepseek", "authors": [{"name": "Zahra Pezhman"}, {"name": "H. Babaei-Aghbolagh"}, {"name": "Komeil Babaei Velni"}], "featured_authors": [{"name": "Zahra Pezhman"}, {"name": "H. Babaei-Aghbolagh"}, {"name": "Komeil Babaei Velni"}], "author_count": 3}, {"id": "2610.35166", "category": "hep-th", "title": "The one-loop QCD scale anomaly on ADE orbifolds as an index", "abstract": "We derive the one-loop scale anomaly of $\\SU(N)$ Yang--Mills on the orbifold $\\R^4/\\Gamma$, with $\\Gamma\\subset \\SU(2)$ a finite subgroup, from an equivariant index theorem on twistor space. The anomaly separates into the QCD $\\beta$-function and a contribution localized at the orbifold fixed point. This localized term inherits the gravitational Weyl anomaly of the smooth ALE resolution, which concentrates under the singular degeneration, along with an additional unprotected heat-kernel coefficient.", "url": "https://arxiv.org/abs/2610.35166", "type": "理论", "summary": "1. 该文利用扭量空间上的等变指标定理，推导了有限子群Γ⊂SU(2)对应的R^4/Γ轨形上SU(N)杨–米尔斯理论的一圈标度反常。\n2. 其核心在于反常可分解为量子色动力学β函数贡献与局域于轨形不动点的项，后者继承光滑ALE分辨的引力Weyl反常并在奇异退化下集中，同时含一个额外的未受保护热核系数。\n3. 这为轨形奇点处反常局域化及引力—规范混合效应提供了指标定理刻画，并提示相关紧致化与全息模型需计入该未受保护系数。", "summary_source": "deepseek", "authors": [{"name": "Herbie Warner"}], "featured_authors": [{"name": "Herbie Warner"}], "author_count": 1}, {"id": "2610.35283", "category": "hep-th", "title": "On memory effects in odd spacetime dimensions", "abstract": "We establish the existence of a new electromagnetic memory effect in all odd spacetime dimensions. This effect is a universal property of electromagnetic fields sourced by charged particles of constant momenta, appears at the Coulombic order and is directly related to the Weinberg soft theorem. We provide a unified derivation of this effect in all higher dimensions by evaluating the Maxwell constraint on a null plane at large, finite distance. We observe that in odd spacetime dimensions, the lightray integral computing the memory effect does not commute with the large-$r$ expansion. Our results necessarily assume that the lightray integral is taken prior to the $r \\rightarrow \\infty$ limit. The effect vanishes in the opposite order of limits, in agreement with previous results. We compute the Coulombic order electromagnetic memory effect for both massless and massive sources in all higher dimensions, explain its relation to the Fourier transform of the leading soft photon theorem and present a protocol for its measurement in a finite time parametrically larger than the distance of a detector from the sources. We conclude with comments on the generalization to gravity.", "url": "https://arxiv.org/abs/2610.35283", "type": "理论", "summary": "1. 该工作在任意奇数时空维度中确立了一种新的电磁记忆效应，并在大而有限距离的零平面上通过Maxwell约束给出统一推导。\n2. 其核心在于揭示奇数维中光线上积分与大$r$展开不可交换：须先作光线上积分再取$r\\to\\infty$，反向取极限则效应消失；该效应处于Coulombic阶并关联Weinberg软光子定理。\n3. 作者据此计算了任意高维无质量与有质量源的Coulombic阶记忆效应，阐明其与领头软光子定理Fourier变换的关系，并给出有限时间测量方案，为引力推广与实验检验提供启发。", "summary_source": "deepseek", "authors": [{"name": "Ana-Maria Raclariu"}, {"name": "Binsong Xiong"}], "featured_authors": [{"name": "Ana-Maria Raclariu"}, {"name": "Binsong Xiong"}], "author_count": 2}, {"id": "2610.35384", "category": "hep-th", "title": "Theory and Cosmology of Biverse Volume-Normalized Gravity", "abstract": "This dissertation expounds the biverse volume-normalized gravity, a novel theoretical framework of classical and quantum gravity that provides an unusual solution to the cosmological constant problem, the 60-degree-of-magnitude discrepancy between the value of the vacuum energy density in our universe predicted by particle physics and that implied by cosmological data. In the literature, there exist two interesting ideas: 1) to use the \"volume-normalized\" action functional, the usual action of the particle Standard Model and general relativity but divided by the spacetime volume, first proposed by Tseytlin; 2) to generate the vacuum energy density dynamically by assigning a ghost-free massive potential to the graviton. However, each has a problem: Tseytlin's attempt suffers from diverging quantum loops and the massive gravity theory has a second metric tensor with questionable origin and the quantum strong coupling problem. Inspired by these two ideas, as well as the AdS/CFT correspondence in string theory, the biverse volume-normalized gravity extends Tseytlin's idea by placing our (3+1)-dimensional universe on the boundary of a (4+1)-dimensional bulk space. This new adaptation controls the large quantum gravity loops in the limit of vanishing ratio of the spacetime volume of our universe to that of the other universe. The ghost-free massive gravity can then be seamlessly incorporated, not only that its otherwise nebulous second metric tensor appears naturally as the pullback of the bulk metric on the boundary, but its strong coupling problem also solved. The biverse volume-normalized gravity is also consistent with all tested models of particle cosmology and the evolution of the universe, and nontrivially predicts that the tensor-to-scalar ratio of our universe is exactly zero.", "url": "https://arxiv.org/abs/2610.35384", "type": "理论", "summary": "1. 该论文构建“双宇宙体积归一化引力”框架，将体积归一化作用量推广到把(3+1)维宇宙置于(4+1)维体时空边界，以应对宇宙学常数问题。\n2. 其核心机制在于借助两宇宙时空体积比趋于零的极限抑制大量子引力圈，并让无鬼有质量引力的第二度规自然表现为体度规的拉回，从而缓解强耦合困难。\n3. 该框架与现有粒子宇宙学和宇宙演化检验一致，还预言张量标量比恰为零，为连接体积归一化、膜世界与宇宙学常数问题提供了可检验启示。", "summary_source": "deepseek", "authors": [{"name": "Siqing Yu"}], "featured_authors": [{"name": "Siqing Yu"}], "author_count": 1}, {"id": "2610.35719", "category": "hep-th", "title": "The topological vertex is finitely generated", "abstract": "The topological vertex computes all genus amplitudes for the open topological A-model in $\\mathbb{C}^3$ with branes on three toric Lagrangians and, via gluing, both open and closed string amplitudes on any toric Calabi-Yau threefold. In this note we show that the topological vertex is generated by boundary interactions of three disks and three annuli. A generalization of this result is shown to hold for the refined topological vertex.", "url": "https://arxiv.org/abs/2610.35719", "type": "理论", "summary": "1. 该文证明，用于计算复三维空间中三个环面拉格朗日膜上开拓扑A模型全亏格振幅、并经粘合给出任意环面卡拉比-丘三维流形开闭弦振幅的拓扑顶点，可由三个圆盘与三个环面的边界相互作用生成，并推广至精炼情形。\n2. 其核心卖点是把这一可粘合出任意环面卡拉比-丘三维流形开闭弦振幅的顶点，约化为有限个基本边界构件，从而确立有限生成结构。\n3. 这为用有限边界数据系统组织拓扑弦振幅与精炼顶点计算提供了明确框架，并可能启发更一般的生成元及粘合结构研究。", "summary_source": "deepseek", "authors": [{"name": "Kunal Gupta"}, {"name": "Pietro Longhi"}], "featured_authors": [{"name": "Kunal Gupta"}, {"name": "Pietro Longhi"}], "author_count": 2}, {"id": "2610.35764", "category": "hep-th", "title": "Compositional Operational Rank, Smooth Realizability, and Dimensional Reduction", "abstract": "Higher-dimensional theories distinguish the dimensionality of a microscopic description from the number of directions accessible to a physical observer. Relating these notions requires not only dimensional reduction, but also a consistent preservation of operational independence across different levels of description. We establish sufficient conditions under which a compositional operational rank is preserved first as the dimension of a smooth integral leaf and then as an observable Fisher-information rank. The key requirement is closure-faithfulness: the smooth realization must preserve the dependency relations of the operational closure, rather than merely its total rank. Together with real representability, constant rank, involutivity, and observer/scale compatibility, this yields a local integral leaf whose dimension equals the operational rank. A further primary-identification condition is required at the measurement level. If an independently specified observer image coincides locally with the primary integral distribution and the admissible protocols provide local resolution, finite labeled-mixture closure, and locally constant outcome support, then the same rank can be realized by a finite composite Fisher-information protocol. The construction holds for arbitrary finite rank. At r = 4 it provides a conditional operational criterion for dimensional reduction in higher-dimensional theories: a viable reduction must preserve the relevant operational dependency structure, not merely produce four effective coordinates. Quantum-hardware negative controls further show that the same restricted Fisher rank can conceal different larger ranks under a broader pre-specified measurement protocol. The framework therefore constrains the operational outcome of dimensional reduction without imposing a universal four-dimensional bound on microscopic state spaces.", "url": "https://arxiv.org/abs/2610.35764", "type": "理论", "summary": "1. 该工作建立充分条件，使组合操作秩先作为光滑积分叶维数、再作为可观测 Fisher 信息秩被保持，并给出测量层实现判据。\n2. 核心卖点是闭包忠实性：光滑实现须保持操作闭包的依赖关系而非仅总秩；配合实表示、常秩、对合与观察者/尺度相容性得到局部积分叶，测量层另需主识别与有限复合 Fisher 协议条件。\n3. 在 r=4 时这给出高维理论维度约化的条件性操作判据：可行约化须保持操作依赖结构而非仅产生四个有效坐标；量子硬件负对照表明受限 Fisher 秩可掩盖更大秩，故约束约化结果但不强加微观态空间的普适四维上限。", "summary_source": "deepseek", "authors": [{"name": "Nikolay D. Tulupov"}, {"name": "Alexander M. Tishin"}], "featured_authors": [{"name": "Nikolay D. Tulupov"}, {"name": "Alexander M. Tishin"}], "author_count": 2}, {"id": "2610.35778", "category": "hep-th", "title": "Quantum Field Theory on the Tangent Bundle", "abstract": "We develop a quantum-field-theoretical framework on the tangent bundle in which gravitational and internal gauge structures are associated with different sectors of an affine tangent-fiber geometry. The translational sector supplies the coframe and its relation to teleparallel gravity. A reduced vertical spectral problem is based on the centrally extended Euclidean group \\(E^{c}(2)\\), motivated by projective representations of the stabilizer of a nonzero null vector. Twofold multiplicities of equivalent vertical representations in selected left-chiral sectors admit weak \\(SU(2)\\) actions, while an assumed threefold quark multiplicity admits a locally gauged color \\(SU(3)_c\\) symmetry. A proposed global quotient correlates the color center with vertical rotations on a threefold rotation cover. Together with the selected chiral spectrum and anomaly conditions, this construction reproduces the observed fractional quark charge assignments. We formulate matter and gauge-field quantization, BRST symmetry, and anomaly constraints. Under the stated projection assumptions, the color sector has the standard local QCD structure, including its one-loop beta function and asymptotic freedom. Additional gauge bosons and dark-matter states are proposed as hypothetical sectors. We also formulate a structural action for possible couplings between teleparallel torsion and additional Lorentz-sector potentials. The framework relates selected structures of particle physics and gravity within a common geometric setting; their further dynamical and phenomenological development remains open.", "url": "https://arxiv.org/abs/2610.35778", "type": "理论", "summary": "1. 该工作构建了切丛上的量子场论框架，用仿射切纤维几何的不同扇区分别承载引力与内部规范结构，并给出物质与规范场量子化、BRST对称性和反常约束。\n2. 其卖点是从中心扩展欧几里得群E^c(2)的垂直谱与全局商出发，将弱SU(2)、定域色SU(3)及分数夸克电荷同切纤维几何关联，并在投影假设下恢复标准量子色动力学的单圈渐近自由。\n3. 该框架把粒子物理与引力的部分结构置于统一几何中，并为伸缩挠率耦合、额外规范玻色子和暗物质等假设扇区提供可拓展的构造性起点。", "summary_source": "deepseek", "authors": [{"name": "Joachim Herrmann"}], "featured_authors": [{"name": "Joachim Herrmann"}], "author_count": 1}, {"id": "2610.35798", "category": "hep-th", "title": "How to get an attractive model", "abstract": "We give a fourth-order Calabi-Yau differential operator, which seems to have been missed by earlier tabulations. We draw attention to this operator because of its clear geometric interpretation and evidence that it possesses a rank-two attractor, conjecturally giving a new example of a Calabi-Yau threefold with modularity properties analogous to those of an elliptic curve over $\\mathbb{Q}$.", "url": "https://arxiv.org/abs/2610.35798", "type": "理论", "summary": "1. 该文给出了一个此前表册中遗漏的四阶Calabi-Yau微分算子，并将其作为新的候选几何对象加以考察。\n2. 其卖点在于该算子具有清晰的几何解释，且有证据表明它带有秩二吸引子，从而猜想性地给出一个具有类似有理数域上椭圆曲线模性性质的Calabi-Yau三维流形新例。\n3. 这为Calabi-Yau模性、吸引子结构与微分算子分类之间的联系提供了可检验线索，并提示可据此系统寻找新的模性三维流形。", "summary_source": "deepseek", "authors": [{"name": "Joseph McGovern"}], "featured_authors": [{"name": "Joseph McGovern"}], "author_count": 1}, {"id": "2610.33040", "category": "math-ph", "title": "On the Energy Minimizing Problem in Plasma Dynamics", "abstract": "A fundamental question in plasma physics and its applications to fusion theory is to find minimum energy stares of plasma.. Hong Qin has suggested the use of what he calls \"Gromov ground states\" which take into account the phenomenon of symplectic rigidity, as opposed to Gardner's classical approach which only use volume-preserving diffeomorphisms. Howev4er Qin's approach leads to topological difficulties because his constructions remain in the classical (Hamiltonian) domain. We circumvent these difficulties by introducing a quantum-mechanical formulation of the problem, based on the Wigner transform and the symplectic geometry of Gaussian state", "url": "https://arxiv.org/abs/2610.33040", "type": "理论", "summary": "1. 该工作针对等离子体动力学中的能量极小化问题，提出量子力学表述以绕开经典哈密顿框架下格罗莫夫基态构造的拓扑困难。\n2. 其核心卖点在于借助维格纳变换与高斯态的辛几何，将计入辛刚性的极小化问题转化为可处理的量子形式，在保留超越保体积微分同胚约束的同时规避拓扑障碍。\n3. 这一表述为求取等离子体最低能量态及融合理论中的平衡态提供了新路径，并提示辛几何约束可能在能量极小化与稳定性分析中发挥实质作用。", "summary_source": "deepseek", "authors": [{"name": "Maurice de Gosson"}], "featured_authors": [{"name": "Maurice de Gosson"}], "author_count": 1}, {"id": "2610.33212", "category": "math-ph", "title": "Dynamics of two-dimensional Bose gases in the focusing case", "abstract": "We prove the propagation of Bose--Einstein condensation and a norm approximation for the dynamics of a Bose gas with localized initial data in two dimensions with singular interactions that may have a small attractive part. We allow the scaling of the interaction to be any polynomial scaling $N^\\beta$ for $0<\\beta<\\infty$ and even exponential scaling $e^{N^\\kappa}$ for $0<\\kappa<1/4$. Our approach covers external potentials that are time-dependent, at most quadratic, and bounded below, including the situation without an external potential.", "url": "https://arxiv.org/abs/2610.33212", "type": "理论", "summary": "1. 该文在二维聚焦情形下研究具局域初值与可能含弱吸引部分的奇异相互作用玻色气体，证明玻色-爱因斯坦凝聚在动力学中传播并给出范数逼近。\n2. 其技术卖点在于将相互作用强度标度扩展至任意多项式 \\(N^\\beta\\)（\\(0<\\beta<\\infty\\)）以及指数 \\(e^{N^\\kappa}\\)（\\(0<\\kappa<1/4\\)），并允许时间依赖、至多二次且有下界的外势。\n3. 该结果把二维聚焦玻色气体的动力学描述推广到更广的标度与外势范围，为弱吸引相互作用下凝聚传播的严格分析提供了可延展的框架。", "summary_source": "deepseek", "authors": [{"name": "Lukas Reichmann"}], "featured_authors": [{"name": "Lukas Reichmann"}], "author_count": 1}, {"id": "2610.33221", "category": "math-ph", "title": "Ground-state spaces of generalized stabilizer codes", "abstract": "In this paper, we determine the complete ground-state spaces for a broad class of generalized stabilizer quantum models defined over CW-decompositions of non-compact manifolds of arbitrary dimensions and topological type. We introduce a $C^*$-algebraic framework in which the quantum spin algebra $\\A$ is realized as the twisted group $C^*$-algebra of an infinite discrete Pauli module $P$ endowed with a symplectic structure. We establish a correspondence between stabilizer models and isotropic subgroups of $P$: Every Lagrangian extension of such a subgroup determines a $C^*$-diagonal of $\\A$, whose Weyl groupoid encodes the dynamics through a continuous 1-cocycle. This realization yields an explicit family of extremal ground-states for every admissible Lagrangian model, together with their decomposition into sectors. When the sector space is $T_0$, this gives a complete characterization of the ground-state spaces. We also prove that every Lagrangian stabilizer model admits a unique frustration-free ground state with a spectral gap. Our framework applies in arbitrary dimension, including higher abelian quantum doubles, homological codes, and a broad class of stabilizer models.", "url": "https://arxiv.org/abs/2610.33221", "type": "理论", "summary": "1. 该文在任意维非紧流形的CW分解上，系统确定了广义稳定子量子模型的完整基态空间，覆盖高维阿贝尔量子双、同调码等模型。\n2. 其核心是把自旋代数实现为无穷离散Pauli模的扭群C*-代数，建立稳定子模型与迷向子群的对应，并用拉格朗日子群扩张给出的C*-对角线和Weyl群胚的连续1-余循环编码动力学。\n3. 该框架将基态空间分类化为代数与拓扑数据，给出可容许拉格朗日模型的显式极值基态及扇区分解，并证明每个拉格朗日稳定子模型都有唯一无阻挫、带谱隙的基态。", "summary_source": "deepseek", "authors": [{"name": "Cathy Cheng"}, {"name": "Nigel Higson"}, {"name": "Danilo Polo Ojito"}, {"name": "Emil Prodan"}], "featured_authors": [{"name": "Cathy Cheng"}, {"name": "Nigel Higson"}, {"name": "Danilo Polo Ojito"}, {"name": "Emil Prodan"}], "author_count": 4}, {"id": "2610.33232", "category": "math-ph", "title": "Partial Airy ideals and coloured blobbed topological recursion", "abstract": "We define and study the notion of partial Airy ideals, which are certain linear systems of PDEs that may contain less equations than variables. We show that they admit a unique solution of exponential type (the partition function) modulo a choice of initial condition. We construct a large class of examples of partial Airy ideals attached to spectral curves using twisted free-field representations of $\\mathcal{W}(\\mathfrak{gl}_r)$-algebras at self-dual level. This generalizes the results of Bouchard- Borot-Chidambaram-Creutzig-Noshchenko by significantly enlarging the set of admissible spectral curves, provided they come with additional data that we call colour. We show that the differential constraints on the partition function are equivalent to a set of equations on the associated correlators, which we call coloured loop equations. We find a recursive residue formulation for the solutions of those equations, the coloured blobbed topological recursion}, which is a generalization of the currently known forms of topological recursion. It includes the blobbed topological recursion of Borot-Shadrin as a special case, giving it a natural interpretation within the formalism of partial Airy ideals.", "url": "https://arxiv.org/abs/2610.33232", "type": "理论", "summary": "1. 该工作定义并研究了“部分Airy理想”这类方程数可少于变量数的线性偏微分系统，并证明其指数型解（配分函数）在给定初始条件后唯一存在。\n2. 其技术核心是利用自对偶能级下W(gl_r)代数的扭曲自由场表示构造附于谱曲线的大类实例，以额外“颜色”数据显著扩大可容许谱曲线范围，并将微分约束化为有色圈方程及残数递推的有色blobbed拓扑递归。\n3. 这一表述把Borot-Shadrin的blobbed拓扑递归纳入部分Airy理想框架作为特例，为推广拓扑递归及关联函数计算提供了统一而可操作的结构。", "summary_source": "deepseek", "authors": [{"name": "Gaëtan Borot"}, {"name": "Vincent Bouchard"}, {"name": "Swagata S. Datta"}], "featured_authors": [{"name": "Gaëtan Borot"}, {"name": "Vincent Bouchard"}, {"name": "Swagata S. Datta"}], "author_count": 3}, {"id": "2610.33250", "category": "math-ph", "title": "A non-equilibrium thermodynamics formulation of shear set-points in adaptively remodeling vascular networks", "abstract": "Blood vessels remodel in response to wall shear stress while the network operates under a metabolic maintenance budget. For a power-law maintenance cost, minimizing dissipation at fixed budget yields a local shear set-point, and a purely local adaptation rule drives the network towards this optimum. Here we give this result a non-equilibrium thermodynamic formulation. Blood flow is an exactly linear Onsager system, and the slow remodeling of vessel radii is a gradient flow generated by a Rayleigh dissipation functional. This identifies the structural mobility, which scales inversely with the maintenance cost of each vessel and can be measured from radius fluctuations. Enforcing the budget exactly requires a time-dependent metabolic multiplier, which we obtain in closed form; with a fixed multiplier the budget is violated by up to one third during transients. The fluid displaced by remodeling vessels couples flow and structure through a symmetric, non-diagonal mobility, so that Onsager reciprocity becomes a testable statement: neighbouring vessels should show anticorrelated radius fluctuations. With noise, the structural sector obeys a second law and an integral fluctuation theorem. Non-reciprocal signaling between vessels, such as upstream conducted responses, then breaks the time-reversal symmetry of radius fluctuations and produces housekeeping entropy, detectable from time series of realistic length. Finally, we construct a partition function over network topologies with the number of loops as order parameter. Numerical tests show that loop counts do not collapse onto a single curve against an effective temperature, and that they depend strongly on the detection threshold.", "url": "https://arxiv.org/abs/2610.33250", "type": "理论", "summary": "1. 该文将适应性血管网络中的剪切设定点与局部重塑规则重新表述为非平衡热力学框架，把血流写成线性Onsager系统、把管径慢重塑写成由Rayleigh耗散泛函生成的梯度流。\n2. 其关键卖点是识别出与维持成本成反比的结构迁移率、给出严格满足代谢预算的闭式时变乘子，并将Onsager互易性转化为邻血管管径涨落反相关的可检验预言及涨落定理。\n3. 该框架进一步表明非互易信号会破坏管径涨落的时间反演对称性并产生可由现实长度时间序列检测的维持熵，同时为以环路数为序参量的网络拓扑配分函数及检测阈值依赖性提供约束。", "summary_source": "deepseek", "authors": [{"name": "Enrique Hernández-Lemus"}, {"name": "Daniel Pérez-Calixto"}], "featured_authors": [{"name": "Enrique Hernández-Lemus"}, {"name": "Daniel Pérez-Calixto"}], "author_count": 2}, {"id": "2610.33485", "category": "math-ph", "title": "A Twisted Affine Interpolation of the $\\mathbb{Z}_2^2$-graded Integrable Super-Liouville and super-Sinh-Gordon Equations", "abstract": "This paper is a third one in a series devoted to the construction of $2D$, $\\mathbb{Z}_2^2$-graded, integrable Toda field theories. The first paper introduced parabosonic models obtained from Rittenberg-Wyler color Lie algebras; the second paper explained how to deal with parafermions (the $\\mathbb{Z}_2^2$-graded super-Liouville theory) from finite Rittenberg-Wyler color Lie superalgebras. This new paper extends the construction to the infinite case of (twisted) affine color Lie superalgebras. A $\\mathbb{Z}_2^2$-graded extension of ${\\widehat{\\mathfrak{osp}(2|2)^{(2)}}}$ allows to interpolate the super-Liouville and the super-Sinh-Gordon models, recovered as special limits. The $\\mathbb{Z}_2^2$-graded extensions of three frameworks are here discussed: the Polyakov's soldering, the Leznov-Savel'ev Lax pair (zero-curvature) formulation and the Bäcklund transformations. As a byproduct of the construction, the Hamiltonian reduction from the $\\mathbb{Z}_2^2$-graded ${\\widehat{\\mathfrak{osp(2|2)}^{(2)}}}$ WZNW models induces a $\\mathbb{Z}_2^2$-graded color Lie superalgebra which admits three inequivalent superVirasoro subalgebras; they are the ${\\cal N}=2$ superVirasoro, the $(1,\\frac{3}{2},\\frac{3}{2},2)$ $\\mathbb{Z}_2^2$-graded superVirasoro and the $(\\frac{3}{2},\\frac{3}{2},2,2)$ $\\mathbb{Z}_2^2$-graded superVirasoro.", "url": "https://arxiv.org/abs/2610.33485", "type": "理论", "summary": "1. 该文将基于有限Rittenberg–Wyler色李超代数的二维Z2^2分级可积Toda场论推广到（扭曲）仿射情形，并用osp(2|2)^{(2)}的分级扩展插值super-Liouville与super-Sinh-Gordon。\n2. 其技术核心是在Polyakov soldering、Leznov–Savel’ev Lax对零曲率表述和Bäcklund变换中一致构造该扩展，使两模型作为特殊极限恢复。\n3. Hamiltonian约化进一步得到含N=2、(1,3/2,3/2,2)与(3/2,3/2,2,2)三种不等价superVirasoro子代数的色李超代数，为分级共形与可积结构研究提供线索。", "summary_source": "deepseek", "authors": [{"name": "Naruhiko Aizawa"}, {"name": "Ren Ito"}, {"name": "Luiza Miranda"}, {"name": "Francesco Toppan"}], "featured_authors": [{"name": "Naruhiko Aizawa"}, {"name": "Ren Ito"}, {"name": "Luiza Miranda"}, {"name": "Francesco Toppan"}], "author_count": 4}, {"id": "2610.33553", "category": "math-ph", "title": "Admissible Subspaces for the Collective Haar Twirl: Schur-Weyl Classification and Heredity under Tensor-Factor Reduction", "abstract": "Quantum private broadcasting (\\textsf{QPB}) asks whether a quantum message can be encrypted once, broadcast to several recipients, and decrypted locally while the joint ciphertext reveals no plaintext information. Broadbent, González-Guillén, and Schuknecht showed that the full tensor-power space \\(\\mathcal H_d^{\\otimes t}\\) is generally unsuitable for \\textsf{QPB}, identified \\(\\mathrm{Sym}^t(\\mathcal H_d)\\) as a natural plaintext space, introduced symmetric unitary \\(t\\)-designs, and asked which other subspaces support private broadcast. Using Schur-Weyl duality, we classify all subspaces \\(\\mathcal S\\subseteq\\mathcal H_d^{\\otimes t}\\) on which the collective Haar twirl \\(\\mathcal T^{(t)}\\) is a replacement channel. Precisely, every Schur-Weyl block weight must be independent of the encoded state, and in each active block \\(V_\\lambda\\otimes W_\\lambda\\), the reduced state on the multiplicity space \\(W_\\lambda\\) must be fixed. This yields explicit two-block and general multiblock constructions and realizes the classification as the Schur-Weyl form of the Knill-Laflamme conditions for a complementary channel of \\(\\mathcal T^{(t)}\\). We also introduce a canonical reduction under deletion of a recipient and characterize privacy heredity, design heredity, and \\textsf{QPB}-heredity for exact restricted designs. The symmetric tower is fully \\textsf{QPB}-hereditary, whereas the antisymmetric tower is fully privacy-hereditary and is design-hereditary from level \\(s\\) to \\(s-1\\) exactly when \\(s\\leq(d+1)/2\\). For canonical carriers in arbitrary Schur-Weyl blocks, hereditary reduction is governed by multiplicity-free branching along the Young graph and inclusion of the associated Peter-Weyl coefficient spaces.", "url": "https://arxiv.org/abs/2610.33553", "type": "理论", "summary": "1. 该工作利用Schur-Weyl对偶分类了张量幂空间中使集体Haar twirl成为替换信道的容许子空间，并给出两分块与多分块构造。\n2. 其核心判据要求各Schur-Weyl块权重与编码态无关，且每个活跃块V_λ⊗W_λ中多重度空间W_λ上的约化态固定，并将该分类表述为互补信道的Knill-Laflamme条件。\n3. 删除接收者下的规范约化进一步刻画隐私遗传、设计遗传与QPB遗传：对称塔完全QPB遗传，反对称塔完全隐私遗传且仅在s≤(d+1)/2时从s到s-1设计遗传，一般块由Young图无重分支与Peter-Weyl系数空间包含决定。", "summary_source": "deepseek", "authors": [{"name": "Sayantan Ganguly"}], "featured_authors": [{"name": "Sayantan Ganguly"}], "author_count": 1}, {"id": "2610.33652", "category": "math-ph", "title": "Fractional reversible chemical kinetics: Time-Driven Monte Carlo method and application to enzyme conformational dynamics", "abstract": "In this work, we present a fractional framework for reversible two-state chemical kinetics derived from the Continuous-Time Random Walk (CTRW) formalism with Mittag-Leffler waiting-time distributions. This derivation provides a microscopic basis for the fractional kinetic equations governed by the Caputo derivative. An exact analytical solution is obtained, yielding closed-form expressions for the time evolution of the state populations. To the best of our knowledge, a time-driven Monte Carlo algorithm is developed for the first time to simulate the irreversible underlying non-Markovian stochastic dynamics governed by a system of Caputo fractional differential equations. The proposed framework is applied to the conformational dynamics of the TbQSOX enzyme, whose relaxation exhibits power-law behavior. The fractional model accurately reproduces the experimental kinetics, providing an estimate of the fractional order $\\alpha = 0.22$, which is consistent with the observed anomalous dynamics.", "url": "https://arxiv.org/abs/2610.33652", "type": "理论", "summary": "1. 该工作基于具有Mittag-Leffler等待时间分布的连续时间随机行走框架，建立了可逆双态化学动力学的分数阶描述，并给出状态布居时间演化的闭式解。\n2. 其核心在于由CTRW导出Caputo分数阶动力学方程的微观基础，并首次构建时间驱动Monte Carlo算法以模拟由Caputo分数阶微分方程组支配的底层不可逆非马尔可夫随机过程。\n3. 将该框架应用于TbQSOX酶构象动力学可准确重现幂律弛豫实验，估计分数阶α=0.22，表明其为异常动力学并提供可检验的定量刻画。", "summary_source": "deepseek", "authors": [{"name": "Nelson H. T. Lemes"}, {"name": "Higor V. M. Ferreira"}], "featured_authors": [{"name": "Nelson H. T. Lemes"}, {"name": "Higor V. M. Ferreira"}], "author_count": 2}, {"id": "2610.33659", "category": "math-ph", "title": "Linear statistics in the Coulomb gas: cumulants beyond rotational invariance", "abstract": "We consider a classical Coulomb gas of $N$ particles in dimension $d\\geq2$, confined by a general external potential $U$ in the large-$N$ limit. In that limit the density of particles has a compact support called the droplet. We study smooth linear statistics ${\\mathcal L}_N=\\sum_{i=1}^N f({\\bf x}_i)$ at large $N$. While the leading variance of ${\\mathcal L}_N$ is by now well understood in many settings, much less is known about higher cumulants. When $f({\\bf x})=f(|{\\bf x}|)$ and the potential is rotationally invariant, these cumulants were computed recently at leading order. We derive explicit formulas for the leading third and fourth cumulants for general smooth droplets, without assuming that either the potential or the test function is radial. The answers are expressed as intrinsic boundary integrals over the equilibrium droplet. The third cumulant depends on the cube of the jump of the normal derivative of the harmonic extension of $f$, while the fourth cumulant also involves the exterior Dirichlet-to-Neumann operator, the mean curvature of the boundary, and normal derivatives of the background density. Our derivation uses the tilted potential $U_s=U+s f/\\beta$, the associated deformation of the droplet, and shape derivatives of the Dirichlet energy. This deformation has a natural interpretation as the infinitesimal motion of the free boundary in the obstacle-problem formulation of the equilibrium measure. Our formulas extend previous studies by Wiegmann and Zabrodin in two dimensions for $\\beta=2$. In their setting, we provide a rigorous proof of the limiting third and fourth cumulants, supporting the proposed formulas for general Coulomb gases. We specialize the general formulas to the disk, the half-plane and the sphere, and check them against exactly solvable non-radial deformations, including translated elliptic droplets in $d=2$ and spheroidal deformations in $d=3$.", "url": "https://arxiv.org/abs/2610.33659", "type": "理论", "summary": "1. 该工作在 d≥2 的经典 Coulomb 气体大 N 极限下，对任意外势约束下的一般紧支撑液滴，推导了光滑线性统计量的领头三阶与四阶累积量。\n2. 其关键是在不假定势或检验函数径向对称时，用倾斜势 U_s=U+s f/β 的液滴形变与 Dirichlet 能量形状导数，将累积量化为边界内禀积分：三阶由调和延拓法向导数跃变的立方控制，四阶还含外 Dirichlet-to-Neumann 算子、平均曲率与背景密度法向导数。\n3. 该结果推广并严格化了二维 β=2 的 Wiegmann-Zabrodin 公式，为一般 Coulomb 气体高阶涨落提供边界几何框架，并在圆盘、半平面、球面及非径向可解形变中检验。", "summary_source": "deepseek", "authors": [{"name": "Paul Bourgade"}, {"name": "Pierre Le Doussal"}, {"name": "Gregory Schehr"}], "featured_authors": [{"name": "Paul Bourgade"}, {"name": "Pierre Le Doussal"}, {"name": "Gregory Schehr"}], "author_count": 3}, {"id": "2610.33837", "category": "math-ph", "title": "V-Representability Beyond Singular Times in Time-Dependent Density Functional Theory: The Hubbard Dimer Case", "abstract": "We study the global $V$-representability problem in time-dependent density functional theory (TDDFT) for the two-particle Hubbard dimer model in the spin-singlet sector. In particular, we investigate whether the time-dependent density of the interacting system obtained for a given one-body external potential $u$ (the tunable control variable) can be reproduced by a non-interacting Kohn--Sham system beyond the singular times at which the usual inversion formulas break down. We deal with both the conventional formulation of TDDFT based on some time-dependent variational principle and the recently introduced geometric formulation of TDDFT (Phys. Rev. Lett. 136 (2026) 256401, Phys. Rev. A 113 (2026) 062222). For both principles, we prove global-in-time $V$-representability, show that singular times induce non-uniqueness of the time-dependent effective potential, and classify the set of solutions.", "url": "https://arxiv.org/abs/2610.33837", "type": "理论", "summary": "1. 该文针对自旋单重态两粒子Hubbard二聚体，在含时密度泛函理论中考察相互作用体系密度能否在奇异时刻之后由无相互作用Kohn–Sham体系全局复现。\n2. 其核心在于同时处理传统含时变分原理与近期几何表述，证明全局时间V-可表示性，并揭示奇异时刻导致含时有效势不唯一且对解集作出分类。\n3. 这为TDDFT中奇异性、非唯一性与Kohn–Sham构造的适用范围提供了可严格检验的模型判据，并启发对更一般体系全局可表示性的分析。", "summary_source": "deepseek", "authors": [{"name": "Éric Cancès"}, {"name": "Théo Duez"}], "featured_authors": [{"name": "Éric Cancès"}, {"name": "Théo Duez"}], "author_count": 2}, {"id": "2610.33913", "category": "math-ph", "title": "Matrix representations of ${\\rm BC}_n$ associative Yang--Baxter equations and related long-range spin chains", "abstract": "We construct a matrix representation of the algebra defined by the associative Yang--Baxter equations of ${\\rm BC}_n$ type. In the elliptic case, two sets of generators are represented in terms of the Baxter--Belavin quantum $R$-matrix in the fundamental representation of ${\\rm GL}_N$, while the remaining generators are represented by the elliptic $K$-matrix found by Komori and Hikami. We revisit its derivation using the Felder--Pasquier procedure and correct the unitarity relation for odd $N$. We then use these matrix representations to construct examples of long-range quantum spin chains from $R$-matrix-valued Lax pairs for the classical Calogero--Inozemtsev system associated with the ${\\rm BC}_n$ root system. We also construct $R$-matrix-valued Lax pairs for Calogero--Moser models in an external field, leading to Haldane--Shastry and Polychronakos--Frahm chains with modified spin positions.", "url": "https://arxiv.org/abs/2610.33913", "type": "理论", "summary": "1. 该工作构造了 BC_n 型结合 Yang--Baxter 方程所定义代数的矩阵表示，并借助 R-矩阵值 Lax 对给出与 BC_n 根系及外场 Calogero--Moser 模型相关的长程量子自旋链实例。\n2. 其关键技术是在椭圆情形用 GL_N 基本表示中的 Baxter--Belavin 量子 R-矩阵与 Komori--Hikami 椭圆 K-矩阵表示生成元，并经 Felder--Pasquier 程序重新推导、修正奇数 N 的幺正关系。\n3. 这为 BC_n 根系统下长程可积自旋链的矩阵化构造以及外场中 Haldane--Shastry、Polychronakos--Frahm 链的修正自旋位置提供了可推广的代数框架。", "summary_source": "deepseek", "authors": [{"name": "M. Matushko"}, {"name": "A. Mostovskii"}, {"name": "A. Zotov"}], "featured_authors": [{"name": "M. Matushko"}, {"name": "A. Mostovskii"}, {"name": "A. Zotov"}], "author_count": 3}, {"id": "2610.33984", "category": "math-ph", "title": "The Genus-One B-Model Calabi-Yau/Landau-Ginzburg Correspondence", "abstract": "Let $f:\\mathbb C^n\\to\\mathbb C$ be a homogeneous polynomial of degree $n$ with an isolated critical point at the origin. The Calabi--Yau/Landau--Ginzburg correspondence predicts a close relation between invariants of the Landau--Ginzburg orbifold $(\\mathbb C^n/\\mathbb Z_n,f)$ and those of the associated Calabi--Yau hypersurface $ X_f=\\{[z_1:\\cdots:z_n]\\in\\mathbb P^{n-1}:f(z_1,\\ldots,z_n)=0\\}. $ In this paper, we establish this correspondence for the genus-one B-model by constructing the Landau--Ginzburg genus-one B-model invariant intrinsically from the $f$-twisted Laplacian on $\\mathbb{C}^n/\\mathbb{Z}_n$ and proving that it agrees with the corresponding BCOV invariant of $X_f$ up to an additive constant depending only on the dimension.", "url": "https://arxiv.org/abs/2610.33984", "type": "理论", "summary": "1. 该文在n次齐次多项式具有孤立临界点的情形下，建立亏格一B模型的卡拉比–丘与朗道–金兹堡对应。\n2. 其技术要点是从复n维空间对Z_n取商所得轨形上由多项式扭曲的拉普拉斯算子内蕴构造亏格一B模型不变量，并证明它与X_f的BCOV不变量仅相差一个只依赖维数的加性常数。\n3. 这一内蕴构造为向更高亏格推广提供了可操作范式，并提示轨形侧的扭曲拉普拉斯谱数据可编码卡拉比–丘超曲面的B模型不变量。", "summary_source": "deepseek", "authors": [{"name": "Xinxing Tang"}, {"name": "Junrong Yan"}], "featured_authors": [{"name": "Xinxing Tang"}, {"name": "Junrong Yan"}], "author_count": 2}, {"id": "2610.34063", "category": "math-ph", "title": "Stochastic quantization and Osterwalder-Schrader axioms for quantum field theory models", "abstract": "This PhD thesis constructs the $P(\\Phi)_2$ Euclidean quantum field theory on $\\mathscr{S}'(\\mathbb{R}^2)$. We first construct the finite-volume measure of the $P(\\Phi)_2$ model on $\\mathscr{D}'(\\mathbb{S}_R)$, where $\\mathbb{S}_R$ is a two-dimensional sphere of radius $R\\in\\mathbb{N}_+$. To this end, we rely on Nelson's hypercontractivity estimate. We then use parabolic stochastic quantization and the energy method to construct the infinite-volume measure on $\\mathscr{S}'(\\mathbb{R}^2)$. This requires establishing the global-in-time existence of solutions to the corresponding stochastic partial differential equations with fixed cutoffs. The remainder of the thesis is devoted to verifying the Osterwalder-Schrader axioms: regularity, reflection positivity, and invariance under translations, rotations, and reflections. This combination of axioms, which is crucial for obtaining a non-trivial local relativistic quantum field theory on Minkowski spacetime, had not been established in earlier constructions based on stochastic quantization.", "url": "https://arxiv.org/abs/2610.34063", "type": "理论", "summary": "1. 该博士论文在 S′(R²) 上构造了 P(Φ)_2 欧氏量子场论，并系统验证其 Osterwalder–Schrader 公理。\n2. 其技术核心是先借 Nelson 超压缩性估计得到有限体积测度，再用抛物随机量子化与能量方法、在固定截断下证明相应随机偏微分方程的整体时间解存在，从而构造无穷体积测度并验证正则性、反射正性及平移、旋转、反射不变性。\n3. 这一完整公理验证弥补了以往随机量子化构造的不足，为获得非平凡定域相对论量子场论奠定欧氏基础，并启发将该路线推广到其他模型。", "summary_source": "deepseek", "authors": [{"name": "Azam Jahandideh"}], "featured_authors": [{"name": "Azam Jahandideh"}], "author_count": 1}, {"id": "2610.34122", "category": "math-ph", "title": "The sharp leading asymptotics of the self-energy of the spinless Pauli-Fierz model", "abstract": "We consider the ground state energy E_0(alpha, Lambda) of a single spinless non-relativistic electron coupled to the quantized radiation field with a sharp ultraviolet cutoff Lambda (the Pauli-Fierz model), with fine structure constant alpha = e^2/(4 pi). Lieb and Loss proved that C_1 alpha^(1/2) Lambda^(3/2) <= E_0 <= C_2 alpha^(2/7) Lambda^(12/7) for large Lambda and suggested that the upper bound, which comes from product states, gives the correct order. We prove that, for every fixed alpha > 0, E_0(alpha, Lambda) = (1+o(1)) c_alpha alpha^(2/7) Lambda^(12/7) as Lambda -> infinity, with an explicit constant c_alpha = 0.99338...; more generally, this holds uniformly in the joint limit Lambda/alpha -> infinity, alpha^(5/2) Lambda -> infinity, provided log(2+alpha) = o((Lambda/alpha)^(1/21)). Since our upper bound holds already for the infimum over product states, it follows that the ratio of E_0 to this infimum tends to one: electron-field correlations do not contribute to the leading term. The condition alpha^(5/2) Lambda -> infinity cannot be dropped, since for alpha^(5/2) Lambda -> 0 the vacuum trial state gives a smaller energy. The upper bound follows from a coherent state bound for the field energy in a fixed electron density. The lower bound combines a periodization of the field, a Born-Oppenheimer bound in which phase multiplication and a Hardy inequality in field space are applied block by block, and a lower bound on the magnetic Neumann Laplacian on a cube for band-limited fields; the key point of the last is that a band-limited field obeying a weighted gradient condition cannot concentrate its vorticity.", "url": "https://arxiv.org/abs/2610.34122", "type": "理论", "summary": "1. 该工作严格确定了无自旋Pauli-Fierz模型在尖锐紫外截断Λ下的基态能量领头渐近：固定α时E0∼cα α^{2/7}Λ^{12/7}（cα=0.99338…），并推广至所述联合极限。\n2. 其卖点是证明乘积态上界已给出正确领头阶，电子—场关联无领头贡献；下界综合场周期化、逐块Born-Oppenheimer界、场空间Hardy不等式及带限场磁Neumann Laplacian的涡度不能集中。\n3. 最可辩护的启示是α^{5/2}Λ→∞不可去除，否则真空试探态更优；这明确了乘积态/真空态与关联效应的渐近分界，并提供可迁移的块状下界技术。", "summary_source": "deepseek", "authors": [{"name": "Shinichiro Futakuchi"}], "featured_authors": [{"name": "Shinichiro Futakuchi"}], "author_count": 1}, {"id": "2610.34125", "category": "math-ph", "title": "The effective mass of the Pauli-Fierz electron: a cutoff-independent lower bound and the breakdown of mass renormalization", "abstract": "We consider the Pauli-Fierz model of one spinless non-relativistic electron coupled to the quantized transverse electromagnetic field, without external potential, with a sharp ultraviolet cutoff Lambda and bare mass m. Let h = m_eff/m be the ratio of the effective mass, defined by the curvature of the fiber ground state energy at total momentum zero, to the bare mass; by scaling, h depends only on the fine structure constant alpha = e^2/(4 pi) and on lambda = Lambda/m. We prove two lower bounds. First, h >= 1 + 0.3441 alpha/(1 + 0.2985 sqrt(alpha) + 0.1252 alpha) for all alpha > 0 and all lambda >= 1; the bound does not depend on the cutoff, and with the band extended to the cutoff its first order coefficient in alpha is the perturbative one of Hiroshima and Spohn. The proof uses a coherent translation of the field applied to the ground state as a trial state; the term linear in the translation vanishes by minimality of the ground state. Second, for every fixed alpha, h grows faster than linearly: for every epsilon > 0, h >= lambda^(8/7 - epsilon) for all large lambda (8/7 is the limit of the method). Consequently iota_PF(alpha) := inf_{lambda > 0} h/lambda > 0, and for a fixed physical mass m_phys a bare mass reproducing it exists only if Lambda <= m_phys/iota_PF(alpha). This was expected, but not proved, by Lieb and Loss (2002). The proof of the second bound starts from the sharp self-energy asymptotics of a companion paper and uses a trial state obtained from the ground state by a phase depending on the field configuration. The new ingredients are an estimator for the position of the electron given by the local centre of a shallow level set of the photon cloud, the decoupling of a localized part of the field from the electron through a divergence-free external subspace, and a proof that shallow depressions near the edge of the localization window are rare.", "url": "https://arxiv.org/abs/2610.34125", "type": "理论", "summary": "1. 该工作在无外势、带锐紫外截断的泡利-菲耶兹模型中研究单电子有效质量与裸质量之比，证明了对任意耦合与截断不小于质量并与截断无关的显式下界，以及固定耦合下该比值随截断超线性增长。\n2. 技术卖点是用场的相干平移构造试探态并借基态极小性消去线性项，以及用依赖场位形的相位试探态、光子云浅层集局部中心估计、无散外子空间解耦和浅凹陷稀有性证明第二个界。\n3. 由此得ι_PF(α)>0，并推出固定物理质量对应的裸质量仅当截断不超过物理质量除以ι_PF(α)时存在，从而严格证实利布与洛斯的预期并揭示质量重正化的失效。", "summary_source": "deepseek", "authors": [{"name": "Shinichiro Futakuchi"}], "featured_authors": [{"name": "Shinichiro Futakuchi"}], "author_count": 1}, {"id": "2610.34138", "category": "math-ph", "title": "Spectral localizer for unbounded topological Hamiltonians", "abstract": "In a series of joint papers with Loring, it was shown how index parings of $K$-theory classes with Fredholm modules can be computed as the half-signature of a suitably constructed finite-dimensional matrix, called the spectral localizer. After offering a novel perspective on earlier results, it is shown how the framework can be extended to unbounded gapped Hamiltonians given as second-order linear differential operators (in particular, matrix-valued Schrödinger and regularized Dirac operators). Important insights are the coercive phase space localization and discretizations by means of wavelets.", "url": "https://arxiv.org/abs/2610.34138", "type": "理论", "summary": "1. 该工作重新诠释谱局域子以有限维矩阵半符号计算K理论类与Fredholm模指标配对的构造，并把框架推广到无界有隙二阶线性微分算子，包括矩阵值Schrödinger和正则化Dirac算子。\n2. 其技术卖点是把强制性相空间局域化与小波离散化结合，使无界哈密顿量的拓扑指标可在有限维矩阵中稳健表示，而无需有界化或紧化假设。\n3. 这为连续微分算子拓扑不变量的直接数值评估提供了可操作路径，并启发将谱局域子推广到其他二阶算子及多尺度离散方案。", "summary_source": "deepseek", "authors": [{"name": "Hermann Schulz-Baldes"}], "featured_authors": [{"name": "Hermann Schulz-Baldes"}], "author_count": 1}, {"id": "2610.34179", "category": "math-ph", "title": "Random-walk scaling without Bernoulli statistics: transport, persistence and resonances in the triangle map", "abstract": "The triangle map is an area-preserving, piecewise-parabolic map of the torus with vanishing Lyapunov exponent. We study the symbolic process $X_n=\\pm1$ given by the two halves of the torus, whose partial sums $S_n$ are the transport of the lifted momentum, with an integrator free of accumulated rounding errors and exact computations on polygonal cylinder sets. We prove that the Koopman operator has no non-constant $H^1$ eigenfunctions, that the symbol is not an $H^1$ coboundary, and that runs of equal symbols are uniformly bounded. For generic parameters the walk is normally diffusive and Gaussian, but its diffusion coefficient is not that of a coin: away from the edges of the parameter square it varies between $0.2$ and $14$ times the Bernoulli value, and for a benchmark pair, with $D=3.09\\pm0.01$, the excess is produced by the order of the bounded inter-event intervals, not by their distribution. The first-passage exponent is $1/2$ with a non-Bernoulli amplitude, and worst-case Birkhoff averages decay as for a uniquely ergodic system. For $\\beta=0$ the Green-Kubo sum cancels, $D=0$, yet $\\mathrm{Var}(S_n)$ keeps growing slowly, sign changes are rare and the correlations of Fourier modes decay as $n^{-0.2}$. We identify the zero-sum words, which become pure twists at $\\beta=0$, as resonances that trap orbits with a computable $1/\\ell$ law, set the crossover time $\\beta^{-1/2}$ at small $\\beta$, and, in an asymmetric deformation of the symbol, produce a logarithmic term in the variance whose coefficient we compute exactly. We formulate conjectures on unique ergodicity, mixing, the central limit theorem and the cohomology of the symbol.", "url": "https://arxiv.org/abs/2610.34179", "type": "理论", "summary": "1. 该工作对无正Lyapunov指数的三角形映射，用无累积舍入误差的精确多面柱集计算，研究环面两半定义的±1符号过程与升移动量输运。\n2. 其卖点是证明Koopman算子无非平凡H^1特征函数、符号非H^1余边界且同号串有界，并揭示高斯扩散的系数可偏离Bernoulli值0.2–14倍；基准D=3.09±0.01的超出源于有界事件间隔次序而非分布。\n3. 该框架将零和词视为β=0的纯扭转共振，给出1/ℓ俘获律、β^{-1/2}交叉时间及非对称变形下对数方差系数的精确结果，并为唯一遍历性、混合、中心极限定理与符号上同调猜想提供启示。", "summary_source": "deepseek", "authors": [{"name": "Mirko Degli Esposti"}], "featured_authors": [{"name": "Mirko Degli Esposti"}], "author_count": 1}, {"id": "2610.34188", "category": "math-ph", "title": "Semantic burstiness across principal directions of textual variation", "abstract": "Long-range correlations in written texts extend over scales far beyond local syntax, but their relation to semantic organisation remains incompletely understood. Previous work has linked these correlations to the bursty recurrence of topically relevant words. Here we generalise that construction from individual lexical items to distributed semantic observables. We map a text token by token onto a trajectory of pre-trained word embeddings, use principal component analysis (PCA) to identify text-specific directions of semantic variation, and threshold the projected series to define inter-event times; their coefficients of variation form a component-resolved burstiness spectrum $\\{B_k\\}$. Across 28 literary and scientific texts and the first 20 components, the originals remain systematically above the geometric inter-event-time baseline and above two complementary controls: a word-shuffled null, which preserves the embedding covariance, the PCA eigensystem and the marginal projected distributions while destroying temporal order, and a fractional-Gaussian-noise surrogate, which preserves the Zipfian frequency structure and matches the detrended fluctuation analysis (DFA) exponent of the original rank sequence. With events defined by the upper 5% tail of each projection, the original exceeds both controls in every text-component pair, while the two controls are statistically indistinguishable from each other. Autocorrelation and detrended fluctuation analysis of the semantic projections separate the originals from both controls in the same way. Global rank-level long-range correlations are therefore insufficient to generate the bursty recurrence observed along semantic directions. The results instead support an interpretation in terms of the ordered recurrence of semantically related material.", "url": "https://arxiv.org/abs/2610.34188", "type": "理论", "summary": "1. 该工作将词汇爆发性度量从单词推广到分布式语义量：把文本逐词映射为预训练词嵌入轨迹，用PCA提取文本特异的语义变化方向，对投影序列阈值化定义事件间隔，得到分量分辨的爆发度谱。\n2. 在28篇文学与科学文本的前20个主成分上，原始序列的爆发度在每个文本-分量对中均超过几何基线与两个对照——保留嵌入协方差、PCA本征系统与投影边缘分布却破坏时序的词重排零模型，与保留Zipf频率结构、匹配DFA指数的分数高斯噪声代理——而两对照彼此无统计差异。\n3. 这说明全局秩级长程相关不足以产生沿语义方向的有序复发，爆发性实际源于语义相关材料的次序性重现。", "summary_source": "deepseek", "authors": [{"name": "Mirko Degli Esposti"}, {"name": "Marcelo A. Montemurro"}], "featured_authors": [{"name": "Mirko Degli Esposti"}, {"name": "Marcelo A. Montemurro"}], "author_count": 2}, {"id": "2610.34330", "category": "math-ph", "title": "Boundary-condition independence of infinite-chain ground states in the $S=1$ $J$-$D$ antiferromagnetic chain", "abstract": "Extending the analytic machinery and using the numerical inputs from OpenAI's proofs of the Haldane gap, we study infinite-chain ground states of the $S=1$ $J$-$D$ antiferromagnetic model $H=\\sum_j\\{\\boldsymbol S_j\\cdot\\boldsymbol S_{j+1}+D(S_j^{\\mathrm z})^2\\}$ for sufficiently small $|D|$. We consider two finite-volume settings: periodic chains with an even number of sites, and open chains with an odd number of sites and the same positive magnetic field in the $\\mathrm z$ direction at both endpoints. We prove that the ground states in each setting have an infinite-chain limit along the full sequence, without passing to a subsequence, and that the two limiting states coincide. Convergence is uniform in $D$ on a fixed neighborhood of zero. The common limit is a symmetric locally-unique gapped ground state, and its local expectation values depend continuously on $D$. These conclusions concern the two specified constructions, not uniqueness among all infinite-chain ground states. They provide the input for the study of a topological phase transition in a forthcoming revision of our companion paper. The author formulated the problem and proposed the basic strategy. ChatGPT Astra made substantial contributions to the inductive estimates and to completing the proof.", "url": "https://arxiv.org/abs/2610.34330", "type": "理论", "summary": "1. 该工作针对小|D|的S=1 J-D反铁磁链，在周期偶数链与两端加同向正磁场开放奇数链两种有限体积设定下，证明各自基态沿完整序列存在无限链极限且两极限态相同。\n2. 其主要技术卖点是极限无需取子列、对零点邻域内的D一致收敛，并给出公共极限为对称、局域唯一的有能隙基态且局域期望值随D连续变化。\n3. 这为伴随工作中拓扑相变研究提供输入，但结论仅限这两种构造，并不主张所有无限链基态的唯一性。", "summary_source": "deepseek", "authors": [{"name": "Hal Tasaki"}], "featured_authors": [{"name": "Hal Tasaki"}], "author_count": 1}, {"id": "2610.34480", "category": "math-ph", "title": "Rigorous Lower Bounds for Atomic and Ionic Ground-State Energies", "abstract": "We establish a new iterative method for computing rigorous lower bounds for the ground-state energies of all atoms and ions. The accuracy of the resulting bounds depends on two ingredients: the quality of the initial energy estimate and the quality of the used upper bound for the maximum number of bound electrons, $N_c(Z)$, as a function of the nuclear charge $Z>0$. In particular, this new method allows us to establish the explicit lower bound $E(N,Z) \\geq -0.8710\\,N^{1/3}Z^2$ for the ground-state energy $E(N,Z)$ of the atom/ion with $N \\in \\mathbb{N}$ electrons and nuclear charge $Z \\in (0,N]$, thereby considerably improving the best known constant $A=(3/2)^{1/3} \\approx 1.1447$ in the estimate $E(N,Z) \\geq -A\\,N^{1/3}Z^2$ for $0 < Z \\leq N$ and coming much closer to the best possible constant given by the Thomas-Fermi asymptotics $\\lim_{N \\to \\infty} |E(N,N)|N^{-7/3}= -E_{\\text{TF}}(1)\\approx 0.7687$ derived in Adv. Math., 23(1) by Lieb and Simon. To demonstrate the potential and the limits of our method, we also compute explicit lower bounds for the ground-state energies $E(N,N)$ of all atoms with $2 \\leq N \\leq 86$ and we compare them with the bounds obtained in J. Chem. Phys., 62(8) by Hertel, Lieb, Thirring and the bounds obtained by Seco in his dissertation. Finally, we also provide a uniqueness result for the expectation values of the kinetic, potential and interaction energies on the ground-state space.", "url": "https://arxiv.org/abs/2610.34480", "type": "理论", "summary": "1. 该工作建立一种迭代方法，为所有原子与离子计算严格基态能量下界，并导出显式下界 E(N,Z)≥−0.8710 N^{1/3}Z^2（N 个电子、核电荷 Z∈(0,N]），同时对 2≤N≤86 的原子给出 E(N,N) 的下界。\n2. 其技术卖点在于下界精度由初始能量估计与最大束缚电子数上界 N_c(Z) 的质量共同控制，从而把常数从 (3/2)^{1/3}≈1.1447 改进至 0.8710，并逼近托马斯-费米渐近常数 E_TF(1)≈0.7687。\n3. 这为原子与离子基态能量提供了可比较的严格基准，并给出基态空间上动能、势能与相互作用能期望值的唯一性结果，可约束后续理论与数值研究。", "summary_source": "deepseek", "authors": [{"name": "Michael Hofacker"}], "featured_authors": [{"name": "Michael Hofacker"}], "author_count": 1}, {"id": "2610.34783", "category": "math-ph", "title": "Gaussian $β$-Markov Path Spaces without a Spectral Gap and the Araki--Woods Representations", "abstract": "Dereziński and Gérard constructed the Gaussian $\\beta$-Markov path space of a free Bose field in a form equivalent to the Araki--Woods representation, which suits nonequilibrium statistical mechanics with a quantum-field environment, but only for one-particle Hamiltonians with a spectral gap. We extend this construction, together with the equivalence to the Araki--Woods representation, to one-particle Hamiltonians without a spectral gap. The extension is intended for constructive quantum field theory at positive temperature and equilibrium statistical mechanics, for instance in the problem of the absence of Bose--Einstein condensation of quasiparticles whose number is not conserved.", "url": "https://arxiv.org/abs/2610.34783", "type": "理论", "summary": "1. 该工作将自由玻色场的高斯β-Markov路径空间构造及其与Araki–Woods表示的等价性，从具有谱隙的单粒子哈密顿量推广到无谱隙情形。\n2. 其技术卖点是在去除谱隙假设后仍保持路径空间与Araki–Woods表示之间的等价构造，从而适用于正温度构造量子场论与平衡统计力学。\n3. 这一推广为处理粒子数不守恒准粒子的玻色-爱因斯坦凝聚缺失等正温度平衡统计问题提供了可用的表示框架。", "summary_source": "deepseek", "authors": [{"name": "Yoshitsugu Sekine"}], "featured_authors": [{"name": "Yoshitsugu Sekine"}], "author_count": 1}, {"id": "2610.34989", "category": "math-ph", "title": "On the types of quasiperiodic potentials and level surfaces of quasiperiodic functions", "abstract": "We examine the similarities and differences between two types of quasiperiodic functions: those obtained by restricting smooth periodic functions in $\\mathbb{R}^N$ to lower-dimensional subspaces $\\mathbb{R}^n \\subset \\mathbb{R}^N$, and those that arise as physical fields or potentials in quasicrystalline structures. Our analysis reveals that functions in these two classes share a number of common features while also exhibiting significant differences. As a key tool for investigating both classes of functions, we employ the Novikov problem - specifically, the problem of describing the global geometry of the level sets of quasiperiodic functions.", "url": "https://arxiv.org/abs/2610.34989", "type": "理论", "summary": "1. 该文系统比较了两类准周期函数：光滑周期函数在低维子空间上的限制，以及准晶结构中出现的物理场或势函数，并分析其共性与差异。\n2. 其技术核心是借助Novikov问题描述准周期函数水平集的全局几何，从而在同一框架下辨识两类函数在几何与拓扑特征上的联系和区别。\n3. 这一比较为区分不同准周期势、刻画水平集的全局几何结构以及理解准晶物理场提供了可推广的分析视角。", "summary_source": "deepseek", "authors": [{"name": "A.Ya. Maltsev"}], "featured_authors": [{"name": "A.Ya. Maltsev"}], "author_count": 1}, {"id": "2610.35194", "category": "math-ph", "title": "General Relativity for Mathematicians - Part I", "abstract": "These notes cover the first part of a course of the same title taught by Filippo Fila-Robattino and Manuel Tecchiolli at the University of Zurich in the Winter Semester of 2025. Topics include variational principles in classical mechanics, special relativity, smooth manifolds and tensor calculus, connections and curvature, geodesic motion, and the derivation of Einstein's equations from the Einstein-Hilbert action. The treatment is aimed at a mathematical audience, combining physical motivation with precise definitions, detailed proofs, and explicit calculations.", "url": "https://arxiv.org/abs/2610.35194", "type": "理论", "summary": "1. 该工作整理了苏黎世大学2025年冬季学期同名课程第一部分的教学笔记，系统覆盖经典力学变分原理、狭义相对论、光滑流形与张量运算、联络与曲率、测地运动以及由爱因斯坦-希尔伯特作用量导出爱因斯坦方程。\n2. 其主要卖点是以数学读者为对象，在保持物理动机的同时给出精确定义、详尽证明和显式计算，兼顾概念来源与数学严格性。\n3. 这为数学背景的研究者与学生提供了进入广义相对论的严谨路径，并可作为连接微分几何与引力物理的教学或自学基础。", "summary_source": "deepseek", "authors": [{"name": "Filippo Fila-Robattino"}, {"name": "Manuel Tecchiolli"}], "featured_authors": [{"name": "Filippo Fila-Robattino"}, {"name": "Manuel Tecchiolli"}], "author_count": 2}, {"id": "2610.35332", "category": "math-ph", "title": "Measurement-dependent reduction of open dynamics in the quantum phase estimation algorithm: the visible subspace and the damped Fejér kernel", "abstract": "For the quantum phase estimation (QPE) algorithm we study the minimal space of observables that is sufficient to predict the entire output distribution under open dynamics of the counting register. Building on the general Krylov theory of reduction, we compute the structure of this space explicitly for the full Fourier measurement. The outcome probabilities are determined by cyclic sums of the state matrix. If the adjoint generator is diagonal on the matrix units, the spectral classes inside the residue classes of the index difference modulo the register dimension $M$ give a constructive basis, an exact dimension formula, and attainable bounds: the dimension of the visible space lies between $M$ and $M^2-M+1$. The class includes independent qubit dephasing, and an analytically solvable reference model of Gorini--Kossakowski--Lindblad--Sudarshan (GKLS) type yields a damped Fejér kernel; two random-unitary channels with the same Ramsey contrast show that higher harmonics are distinguishable in the QPE distribution. For approximate reduction we use a finite-time Gramian and an a posteriori residual estimate, with a quadratic error order for a reducing unperturbed subspace and a compatible initial state. Numerical calculations check the consistency of the representations and the behaviour of the error under non-Toeplitz perturbations.", "url": "https://arxiv.org/abs/2610.35332", "type": "理论", "summary": "1. 该工作针对量子相位估计算法，在计数寄存器开放动力学下研究足以预测全部输出分布的最小可观测子空间，并对全傅里叶测量显式给出其结构。\n2. 其核心在于用Krylov约化得到可见子空间的构造基与精确维数公式，维度介于M与M²-M+1之间，并通过可解GKLS模型导出阻尼Fejér核、说明相同Ramsey对比度下高阶谐波仍可区分。\n3. 有限时间Gramian与后验残差给出近似约化误差估计，为开放QPE的模型降维、实验诊断及非Toeplitz扰动分析提供可检验的定量框架。", "summary_source": "deepseek", "authors": [{"name": "Marina O. Gordeichuk"}, {"name": "Oleg M. Kiselev"}], "featured_authors": [{"name": "Marina O. Gordeichuk"}, {"name": "Oleg M. Kiselev"}], "author_count": 2}, {"id": "2610.35517", "category": "math-ph", "title": "Existence of a weak solution to the Navier-Stokes equations enjoying the energy equality", "abstract": "To date, a Leray's weak solution to the Navier-Stokes equations enjoys an energy inequality. We prove the existence of a weak solution that enjoys the energy equality. The existence of the weak solution is achieved as limit of solutions to the mollified Navier-Stokes system (Leray's approach). Since no uniqueness result is known for weak solutions we are not able to claim that any weak solution in the sense of Leray-Hopf enjoys the energy equality.", "url": "https://arxiv.org/abs/2610.35517", "type": "理论", "summary": "1. 该论文证明纳维-斯托克斯方程存在满足能量等式的弱解，从而在Leray弱解通常仅有能量不等式的图景下补上了等式情形。\n2. 其技术卖点在于沿Leray构造路径，对磨光纳维-斯托克斯系统的解取极限，并证明所得极限弱解满足能量等式，而非依赖弱解唯一性或额外正则性假设。\n3. 由于弱解唯一性仍未知，该结果不能断言所有Leray-Hopf弱解均满足能量等式，其意义在于明确存在性与普遍性之间的界限，并启发对弱解选取和能量耗散机制的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Paolo Maremonti"}, {"name": "Alfonsina Tartaglione"}], "featured_authors": [{"name": "Paolo Maremonti"}, {"name": "Alfonsina Tartaglione"}], "author_count": 2}, {"id": "2610.35583", "category": "math-ph", "title": "Finite-step projective dynamics of Schrödinger cocycles: non-degeneracy, regularity, and rigidity", "abstract": "We study the no deterministic images condition (NDI) for Schrödinger cocycles, which excludes a common image of a fixed probability measure under almost all projective transfer transformations. We prove two-step NDI at every energy for nonconstant measurable potentials over mixing systems and ergodic potentials with infinite essential range, and classify persistence for finite-state locally constant potentials. For bounded Markov and hidden Markov potentials on general state spaces under a one-step $L^2$ norm gap condition on the Markov operator, we prove Hölder bounds for solution-direction distributions above an exponential cutoff and Hölder conditional stationary measures. Counterexamples show the essential sharpness of both assumptions. For nonconstant real trigonometric potentials, including the almost Mathieu operator, we prove NDI and Hölder bounds for distributions of solution directions at all steps $k\\ge2$ and all frequencies (rational or irrational). The exponent depends on the step, while the constant is uniform in steps, frequency and energy on compact intervals. For every irrational frequency and every energy with positive Lyapunov exponent, we prove non-atomicity of both Oseledets direction distributions and convergence to the unstable distribution from every phase-independent initial probability. This gives a new criterion for a zero Lyapunov exponent: a subsequential limit with an atom for one fixed initial direction suffices. All these results extend to an analytic class, with step-dependent regularity bounds.", "url": "https://arxiv.org/abs/2610.35583", "type": "理论", "summary": "1. 该文研究 Schrödinger 余循环的有限步投影动力学，系统证明无确定性像（NDI）条件，覆盖混合系统、无穷本质值域遍历势及有限态局部常势的二步 NDI 与持续性分类。\n2. 其技术核心是在 Markov/隐 Markov 势的一步 L2 范数间隙下建立解方向分布与条件平稳测度的 Hölder 估计，用反例说明假设尖锐，并对含 almost Mathieu 的非平凡实三角势给出所有 k≥2、所有频率的 NDI 与步一致 Hölder 界。\n3. 由此对无理频率且 Lyapunov 指数为正的能量证明 Oseledets 方向分布非原子、从任意相位无关初值收敛到不稳定分布，并给出零 Lyapunov 指数的新判据：某固定初始方向的子列极限含原子即可；解析类亦获步依赖正则界。", "summary_source": "deepseek", "authors": [{"name": "Mira Shamis"}], "featured_authors": [{"name": "Mira Shamis"}], "author_count": 1}, {"id": "2610.35597", "category": "math-ph", "title": "Curvature-induced fracture mode coupling in doubly curved shells", "abstract": "Classical shell fracture theories predominantly consider cracks aligned with principal curvature directions in cylindrical and spherical shells under tensile mode or pressure loading, leaving the fracture behavior of arbitrarily oriented cracks in doubly curved shells under general loading poorly understood. Here, we introduce a semi-analytical framework based on Reissner shallow-shell theory to investigate isotropic shells with positive, zero, and negative Gaussian curvature. The formulation computes stress intensity factors, energy release rates, and crack-lip displacements for arbitrarily inclined through-thickness cracks in spheres, ellipsoids, cylinders, hyperboloids, and minimal surfaces under general mechanical loading. We show that shell curvature couples opening, sliding, and tearing, allowing a single loading component to activate multiple fracture modes, unlike in flat plates. This coupling depends strongly on crack orientation and the normal, parallel, and torsional components of the shell curvature. Ellipsoids exhibit weak coupling, hyperboloids generally exhibit the strongest coupling, and cylinders display the most complex orientation-dependent responses. Moreover, in-plane shear can induce crack closure in hyperboloidal shells, suggesting a potential geometric mechanism for enhanced damage resistance. These findings elucidate the role of local curvature in fracture-mode coupling and provide a mechanistic foundation for the analysis of shellular (meta-)structures with engineered curvature distributions.", "url": "https://arxiv.org/abs/2610.35597", "type": "理论", "summary": "1. 该工作基于Reissner浅壳理论建立半解析框架，计算正、零、负高斯曲率各向同性壳中任意取向穿透裂纹的应力强度因子、能量释放率与裂唇位移，覆盖球、椭球、柱、双曲面及极小曲面在一般载荷下的断裂响应。\n2. 其核心卖点是揭示曲率会耦合张开、滑移与撕裂模式，使单一载荷分量激活多个断裂模式，且耦合强度强烈依赖裂纹取向与曲率的法向、平行及扭转分量，其中椭球耦合较弱、双曲面通常最强、圆柱呈现最复杂的取向依赖响应。\n3. 该结果将局部曲率确立为断裂模式耦合的几何控制因素，并为具有工程设计曲率分布的壳胞（超）结构提供断裂分析机理基础，同时提示面内剪切诱发双曲壳裂纹闭合可能构成增强损伤阻抗的几何机制。", "summary_source": "deepseek", "authors": [{"name": "Riccardo Brambilla"}, {"name": "Siddhant Kumar"}, {"name": "Bianca Giovanardi"}], "featured_authors": [{"name": "Riccardo Brambilla"}, {"name": "Siddhant Kumar"}, {"name": "Bianca Giovanardi"}], "author_count": 3}, {"id": "2610.35669", "category": "math-ph", "title": "Simplifying 2-Bundle Descriptions of Invariants and Local Dynamics", "abstract": "A string couples to a two-form gauge potential whose local descriptions need not fit together as a single global form. Principal 2-bundles provide a geometric description of this gluing. However, we recover surface amplitudes and quantum partition functions, as well as local classical field dynamics, without the 2-bundle formalism. For global phases, topological and index invariants, and twisted-sheaf moduli, established equivalences give alternative descriptions through cocycles, bundles, operators, or modules, with the required global compatibility data. For three-dimensional finite gauge theories with cohomological actions, Fourier transformation expresses the partition function as a sum of partition functions of ordinary finite-group gauge theories. An invertible local substitution reduces invariant classical actions for a class of 2-bundle connections represented by finite-dimensional crossed modules to ordinary gauge and tensor dynamics. These finite and local reductions explicitly eliminate field variables. A four-dimensional quadratic example instead admits a direct cochain evaluation even when an ordinary gauge-theory reduction fails. These results therefore do not require the additional 2-bundle presentation.", "url": "https://arxiv.org/abs/2610.35669", "type": "理论", "summary": "1. 该工作给出了一套不依赖主2-丛形式的简化描述，用于恢复表面振幅、量子配分函数以及局域经典场动力学。\n2. 其关键是：对三维有限规范理论用傅里叶变换把上同调作用的配分函数写成普通有限群规范理论配分函数之和，并用可逆局域替换将有限维交叉模表示的2-丛联络作用约化为普通规范与张量动力学。\n3. 四维二次例子在普通规范约化失效时仍可直接做上链求值，表明所研究的不变量与局域动力学并不需要额外的2-丛表述，并为高阶规范理论提供替代计算路径。", "summary_source": "deepseek", "authors": [{"name": "Ferreira Bastien"}], "featured_authors": [{"name": "Ferreira Bastien"}], "author_count": 1}, {"id": "2610.35759", "category": "math-ph", "title": "Entropic hypocoercivity via the Polchinski flow: an application to the lattice sine-Gordon model", "abstract": "We develop a multiscale criterion for exponential decay of relative entropy in the canonical stochastic quantization of lattice field theories, the underdamped Langevin dynamics of the field and its momentum. For smooth bounded perturbations of Gaussian fields, the criterion requires the uniform operator-norm bound on the smoothed interaction Hessian along the Polchinski flow of Bauerschmidt and Bodineau to have a small $L^2$ norm in the scale variable. The decay constants depend only on this $L^2$ norm and the friction. The proof measures the transfer of momentum dissipation to position on the same scales that decompose entropy. A phase-space extension of the Polchinski flow gives Gaussian coarse-graining that commutes with free kinetic evolution. Integrating position--momentum cross terms over these scales yields a corrector bounded by entropy. A force defect accounts for changes in the averaged interaction force away from equilibrium; its evolution in scale controls the errors in the kinetic estimate. For the massive two-dimensional lattice sine--Gordon model with $0<\\beta<4\\pi$ and small dimensionless local coupling, the criterion gives entropy decay for all finite-entropy initial laws, uniformly in the lattice spacing and the volume. For friction proportional to the mass $m$, the rate has optimal order $m$.", "url": "https://arxiv.org/abs/2610.35759", "type": "理论", "summary": "1. 该工作提出了基于Polchinski流的多尺度判据，用于分析格点场论正则随机量子化中场与动量欠阻尼Langevin动力学的相对熵指数衰减。\n2. 其核心是仅要求平滑相互作用Hessian沿Polchinski流的算符范数在尺度变量上具有小的L2范数
