<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-10-27 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。

  <script>
    const papers = [{"id": "2610.33101", "category": "cond-mat", "title": "Chemistry-resolved disagreement between Materials Project-compatible PBE(+U) and r2SCAN stability verdicts in the GNoME materials database", "abstract": "GNoME's stability labels rest on a Materials Project-compatible GGA/GGA+U workflow. Its authors report that 84% of discovered binaries and ternaries retain a negative decomposition energy under r2SCAN and 86.8% of tested quaternaries remain stable on the r2SCAN hull. We resolve that aggregate by chemistry over the 139,541 GNoME materials released with r2SCAN recomputations, a subset the dataset authors selected rather than sampled, using cluster bootstrap intervals over 8,429 structural-prototype proxy clusters. The aggregate conceals a 26.7-point spread at fixed element count, from 4.0% [3.3, 4.7] for plain quaternary intermetallics (no lanthanide, no 3d metal) to 30.7% [27.7, 33.8] for lanthanide-free 3d-containing quaternary oxides, a pair identified post hoc against a prospectively fixed threshold. Under our reading of the release's \"All\" reference set the two cells sit at 14.5% and 37.4%, preserving a 22.9-point spread. Presence of a Materials Project Hubbard-U-list element is strongly associated with disagreement, conditional on the other covariates, in a model over all 139,541 materials (cluster-robust odds ratio 3.45 [3.13, 3.80]). Neither selective U application nor hull proximity explains the association away: disagreement stays elevated outside the U-treated regime, and a natural cubic spline in the continuous PBE decomposition energy moves the odds ratio in the 117,018-material model only from 3.53 to 3.43 [3.07, 3.83]. For allocating a verification budget, composition supplements hull proximity rather than replacing it: over held-out cluster splits at a 20% budget, the two together surface 45.8% of disagreements against 40.4% for hull distance alone. An exploratory comparison against previously catalogued materials changes direction between populations. We measure disagreement between two workflows, not accuracy.", "url": "https://arxiv.org/abs/2610.33101", "type": "理论+数值", "summary": "1. 该工作按化学组成拆解 GNoME 中 139,541 个材料的 PBE(+U) 与 r2SCAN 稳定性判定分歧，并用 8,429 个结构原型代理簇的聚类自助区间量化其异质性。\n2. 核心结果是固定元素数时分歧比例跨度达26.7个百分点（无镧系无3d四元金属间化合物4.0%对无镧系含3d四元氧化物30.7%），且含Hubbard-U清单元素与分歧强相关（聚类稳健优势比3.45）。\n3. 对验证预算分配而言，组成信息应补充而非替代凸包距离（20%预算下二者联合覆盖45.8%分歧，凸包距离单独40.4%），但该文测的是工作流分歧而非准确率。", "summary_source": "deepseek", "authors": [{"name": "Karthikeya Aduru"}], "featured_authors": [{"name": "Karthikeya Aduru"}], "author_count": 1}, {"id": "2610.33147", "category": "cond-mat", "title": "The Ising lattice gas and the surface diffusion of CO on Cu(001) at finite coverage", "abstract": "The memory equation of the coherent intermediate scattering function (ISF), derived previously for lattice gases, is applied to the Ising lattice gas under Kawasaki dynamics. The ISF follows the decay of a density wave of adparticles, a superposition of exponential relaxation modes: the decay starts at a rate fixed by a sum rule and is then slowed by a memory. The static structure factor and the effective hop rate are obtained in closed form, exactly along a one-dimensional channel; with the sum rule they give a single exponential, a lower bound on the ISF. Exact relaxation spectra show that this single exponential, built from equilibrium quantities alone, reproduces the correlation time only at weak coupling; only there can a measured dephasing rate be read through the statics. For strong attraction the slow dissolution of clusters lengthens the correlation time up to ninefold, whereas a repulsive layer relaxes nearly as a single mode at its structure peak. The dephasing rate, fitted over a time window where it is nearly constant, approaches the slowest relaxation rate, not the initial one; the sum rule reaches the data only through the area beneath the normalized decay, which defines the correlation time. For CO/Cu(001), the lattice gas reproduces the dephasing rates measured along two crystal directions and requires a nearest-neighbour repulsion of at least $35$--$50$~meV, whatever the jump rates; the measured rate is then close to the inverse correlation time, and the memory is predicted to grow with coverage.", "url": "https://arxiv.org/abs/2610.33147", "type": "理论", "summary": "1. 该文将相干中间散射函数的记忆方程用于川崎动力学下的伊辛格子气，并分析有限覆盖度时一氧化碳在铜(001)表面的扩散退相位。\n2. 其技术要点是沿一维通道精确给出静态结构因子与有效跳跃率的闭式表达，并揭示由平衡量构造的单指数仅在弱耦合时重现相关时间；强吸引下团簇缓慢溶解可使相关时间延长至九倍，而排斥层在结构峰附近近似单模弛豫。\n3. 对一氧化碳/铜(001)，该格子气模型能复现沿两个晶向测得的退相位率，且无论跳跃率如何都要求最近邻排斥至少为三十五至五十毫电子伏；这提示退相位率接近相关时间倒数，记忆效应随覆盖度增强。", "summary_source": "deepseek", "authors": [{"name": "S. Miret-Artés"}], "featured_authors": [{"name": "S. Miret-Artés"}], "author_count": 1}, {"id": "2610.33252", "category": "cond-mat", "title": "Winding-Controlled Topological Descendants of Antialtermagnets", "abstract": "Odd-parity spin splitting constrains magnetic band crossings but does not determine their topological descendants. We show that the Chern contribution of an isolated inverted sector is controlled by the phase winding of its transverse mass pair: when the masses and tangential velocities reverse together, contributions from successive Dirac points add rather than cancel. This distinguishes topological winding from the polynomial degree labeling the magnetic parent. For specified complementary masses, periodic tetragonal $h$- and hexagonal $j$-wave models host eight and twelve same-chirality Weyl points on a momentum plane, with gapped-slice Chern numbers $|C|=4$ and $6$, respectively. A microscopic four-band $p$-wave model identifies an antiunitary obstruction to first-order transverse masses and demonstrates a symmetry-broken $C=1$ phase at quarter filling. First-principles calculations for the proposed coplanar spin-vortex texture of LaMnAu$_5$ reveal the $h$-wave nodal pattern, its anisotropic spin--orbit reconstruction, and a mirror-channel spectral response that reverses under opposite spin rotations. Together, these results distinguish the symmetry of an odd-parity magnetic parent from the mass structure controlling the topology of its descendants.", "url": "https://arxiv.org/abs/2610.33252", "type": "理论+数值", "summary": "1. 该工作提出以横向质量对的相位绕数刻画奇宇称反交替磁体拓扑后代的框架，并用四方h波、六角j波、p波四带模型及LaMnAu5第一性原理计算加以验证。\n2. 其卖点是孤立反转扇区的陈数贡献由该绕数控制：质量与切向速度同时反号时连续狄拉克点贡献相加而非抵消，由此区别于母体磁性的多项式次数，并在h波与j波模型中得到八个和十二个同手性外尔点及能隙切片陈数绝对值4和6；p波模型还揭示一阶横向质量的反幺正阻碍与四分之一填充的陈数1对称破缺相。\n3. 这将奇宇称磁母体的对称性与决定拓扑后代的质量结构区分开，为按绕数设计反交替磁体中的高陈数拓扑相及用镜像通道谱响应探测自旋旋转提供明确启示。", "summary_source": "deepseek", "authors": [{"name": "Sahar Izadi Vishkayi"}, {"name": "Carmine Autieri"}, {"name": "Meysam Bagheri Tagani"}], "featured_authors": [{"name": "Sahar Izadi Vishkayi"}, {"name": "Carmine Autieri"}, {"name": "Meysam Bagheri Tagani"}], "author_count": 3}, {"id": "2610.33264", "category": "cond-mat", "title": "Unified First-Principles Theory of Finite-Wave-Vector Photocurrents in Crystals", "abstract": "Spatially structured light carries independent phase and envelope variations in addition to its polarization and frequency. We develop a first-principles theory of second-order dc photocurrents (especially shift and injection) that resolves how these optical degrees of freedom drive distinct dc responses in crystals. The second-order dc response couples two optical field components at the same frequency but with generally different wave vectors. Expanding the response to first order in these wave vectors identifies two rank-four material tensors: $\\xi$, which couples to the optical phase gradient and contains the plane-wave photon-drag limit, and $\\zeta$, which couples to the intensity gradient and describes a spatially varying dc current. Wannier-interpolated calculations for monolayer GeS show symmetry-allowed finite-wave-vector responses that survive at a centrosymmetric structure where conventional bulk photovoltaic effect vanishes. For a Gaussian beam with a uniform phase gradient, the phase-gradient contribution drives current in the same direction on both sides of the beam center, whereas the intensity-gradient contribution drives currents in opposite directions, showing that distinct photocurrent patterns can be selected through the wavefront and envelope of light. A multipolar analysis further resolves the optical corrections into electric-quadrupole, orbital magnetic-dipole, and band-dispersion contributions. Together, these results show how the spatial structure of light can serve as an independent control variable for nonlinear photocurrent generation and provide a first-principles route to predict this response in real materials.", "url": "https://arxiv.org/abs/2610.33264", "type": "理论+数值", "summary": "1. 该工作建立了晶体中有限波矢二阶直流光电流的第一性原理理论，统一处理空间结构光场的相位与强度梯度对位移和注入电流的贡献。\n2. 其卖点在于将响应按波矢一阶展开，识别出耦合相位梯度的ξ张量与耦合强度梯度的ζ张量，从而分离光子曳引与空间变化直流电流，并在单层GeS中给出中心对称结构下仍存活、可由光波前与包络选择的电流图样。\n3. 这启示光场空间结构可作为非线性光电流的独立调控量，并为真实材料中有限波矢响应的第一性原理预测提供了路径。", "summary_source": "deepseek", "authors": [{"name": "Bumseop Kim"}, {"name": "Sayed Ali Akbar Ghorashi"}, {"name": "Yicong Chen"}, {"name": "Ritesh Agarwal"}, {"name": "Andrew M. Rappe"}], "featured_authors": [{"name": "Bumseop Kim"}, {"name": "Sayed Ali Akbar Ghorashi"}, {"name": "Yicong Chen"}, {"name": "Ritesh Agarwal"}, {"name": "Andrew M. Rappe"}], "author_count": 5}, {"id": "2610.33303", "category": "cond-mat", "title": "Chern non-trivial two-dimensional square-net nodal line semimetal", "abstract": "We investigate a two-dimensional $p_xp_y$ square-net tight-binding model with two sublattices and introduce a symmetry-informed, momentum-dependent spin-orbit coupling (SOC) with a finite-range real-space hopping representation. Its two components jointly gap the nodal line, while one breaks time-reversal symmetry, producing a Chern-insulating phase with an occupied band Chern number $C=2$. Nanoribbon calculations reveal edge-localized states traversing this gap, with two net chiral modes per edge. We further show that the conserved spin sectors are unitarily equivalent and therefore have equal Chern numbers, ruling out a nontrivial time-reversal-protected $\\mathbb{Z}_2$ phase within this ansatz. Our results establish a phenomenological route to Chern topology in square-net two-dimensional systems and clarify the symmetry constraints governing the accessible insulating phases.", "url": "https://arxiv.org/abs/2610.33303", "type": "理论+数值", "summary": "1. 该工作基于双亚晶格二维pxpy方网紧束缚模型，引入具有有限程实空间跃迁表示的、依赖动量的对称性约束自旋轨道耦合，系统考察其可实现的绝缘相。\n2. 其关键在于两个自旋轨道耦合分量共同打开节线能隙，且其中一分量破坏时间反演对称性，从而得到占据带陈数为C=2的陈绝缘体，并在纳米带中给出每条边缘两条净手征模式；同时证明守恒自旋扇区幺正等价、陈数相同，排除该拟设下的非平凡Z2相。\n3. 这确立了方网二维体系中通向陈拓扑的唯象路径，并澄清了决定可及绝缘相的对称性约束，为后续模型设计与平台实现提供明确启发。", "summary_source": "deepseek", "authors": [{"name": "Kendall Ramos"}, {"name": "Salvador Barraza-Lopez"}, {"name": "Elias Andrade"}], "featured_authors": [{"name": "Kendall Ramos"}, {"name": "Salvador Barraza-Lopez"}, {"name": "Elias Andrade"}], "author_count": 3}, {"id": "2610.33310", "category": "cond-mat", "title": "Exploring Joint-Embedding Predictive Architectures for Self-Supervised Representation Learning of Powder X-ray Diffraction Patterns", "abstract": "Powder X-ray diffraction (XRD) is the primary high-throughput method for resolving crystal structures, a cornerstone of materials science. As high-throughput synthesis and self-driving laboratories advance, automated XRD pattern analysis has become vital for accelerating materials discovery. However, traditional matrix factorization methods fail when lattice variations cause non-linear peak shifts. At the same time, supervised learning approaches face a combinatorial explosion when handling multi-phase mixtures. To overcome these challenges, we adopt a self-supervised Joint Embedding Predictive Architecture (JEPA) to learn representation embeddings from 1D diffraction patterns. By optimizing a masked self-prediction loss directly within the latent space, the framework captures high-level crystallographic semantics. Downstream evaluations show that lightweight attentive probes trained on frozen JEPA representations achieve space group classification and lattice parameter estimation accuracy close to much larger supervised vision transformers. Furthermore, latent probing reveals that the learned representation space naturally organizes physical transformations, isolating smooth trajectories for peak broadening. Interestingly, decoding along latent paths between single-phase crystal representations yields realistic multi-phase mixture patterns, demonstrating an emergent continuous structure learned without explicit multi-phase supervision.", "url": "https://arxiv.org/abs/2610.33310", "type": "理论+数值", "summary": "1. 该工作采用自监督联合嵌入预测架构（JEPA），从一维粉末X射线衍射图谱学习潜表征，并以潜空间掩码自预测损失规避非线性峰移和多相组合爆炸。\n2. 其卖点是冻结表征上的轻量注意力探针即达接近大型监督视觉Transformer的空间群分类与晶格参数估计，且潜空间将峰宽化组织为平滑轨迹，并能沿单相间潜路径解码出真实多相图谱，无需多相监督。\n3. 这为高通量与自驱动实验室的自动化XRD分析提供了可扩展的自监督途径，并提示潜空间几何可连续编码晶体学变换与混合结构。", "summary_source": "deepseek", "authors": [{"name": "Ming-Chiang Chang"}, {"name": "Brian DeCost"}], "featured_authors": [{"name": "Ming-Chiang Chang"}, {"name": "Brian DeCost"}], "author_count": 2}, {"id": "2610.33316", "category": "cond-mat", "title": "Optimal Search Strategies under Finite Resource Constraints", "abstract": "Improving target search is a challenge faced by many natural and artificial agents, often requiring the use of energetic or material resources. These inputs may be supplied by an external controller or generated by the searcher itself, for example, through the deposition of cues along its trajectory. Although such resources are commonly modeled as costly but available without an explicit limit, in practice, they can often only be produced in finite amounts. Here, we go beyond the assumption of an unlimited supply of resources by investigating searches in which a finite resource budget must be allocated throughout the search process. To investigate this problem, we equip a one-dimensional diffusive searcher with three types of resources: an external force, a supply of partially reflecting flags, and auto-chemotactic cues. We derive exact optimal resource-allocation protocols for informed search processes in which the agent has continuous access to its past and current positions, which we find to always require resource allocation to be spatially concentrated. We then determine the corresponding protocols for blind searchers and show that resource usage must be more evenly distributed. Non-Markovian cues that generate environmental memory are found to substantially improve search performance when the agent has access to positional information, even under finite-resource constraints. In contrast, their benefits are considerably more limited for blind search, particularly when the cues provide no directional information.", "url": "https://arxiv.org/abs/2610.33316", "type": "理论", "summary": "1. 该工作在一维扩散搜索模型中引入有限资源预算，并针对外部力、部分反射标记与自趋化线索三类资源，分别在连续获取历史与当前位置的知情搜索及盲搜索下推导精确最优分配协议。\n2. 其关键卖点在于给出精确最优协议并揭示：位置信息使资源应空间集中，盲搜索则趋于均匀，非马尔可夫环境记忆仅在知情条件下带来显著增益。\n3. 这为有限资源约束下的搜索策略设计提供了可检验的分配原则，并提示环境记忆的优势依赖于搜索者能否获取方向或位置信息。", "summary_source": "deepseek", "authors": [{"name": "Hugues Meyer"}], "featured_authors": [{"name": "Hugues Meyer"}], "author_count": 1}, {"id": "2610.33335", "category": "cond-mat", "title": "OpenFerro: a unified framework for mesoscale ferroic dynamics and enhanced sampling", "abstract": "Modeling ferroic materials requires connecting microscopic fluctuations to collective dynamics over mesoscales. We introduce OpenFerro, a unified lattice-field dynamics framework that combines flexible Hamiltonians, automatic differentiation, parallel execution, and enhanced sampling. The same framework can simulate ferroelectric domain motion, magnetic disordering, and coupled spin-lattice thermodynamics. On four graphics processors, a bulk BaTiO$_3$ benchmark with long-range dipolar interaction reaches $840^3$ unit cells, representing 3 billion atoms through the retained lattice variables. We simulate polarization textures in a PbTiO$_3$/SrTiO$_3$ superlattice spanning $0.8~\\mu\\mathrm{m}$ laterally and a BaTiO$_3$ nanoparticle 200~nm in diameter, retaining unit-cell resolution. We also demonstrate enhanced-sampling simulations that reconstruct the polarization free-energy surface of bulk BaTiO$_3$ without a prescribed polynomial form. With moderate computational resources, OpenFerro achieves atomistic-resolution simulations at mesoscopic scales traditionally studied with continuum models.", "url": "https://arxiv.org/abs/2610.33335", "type": "理论+数值", "summary": "1. 作者提出统一的晶格-场动力学框架 OpenFerro，整合灵活哈密顿量、自动微分、并行计算与增强采样，用于介观铁性动力学的原子级分辨率模拟。\n2. 同一框架可处理铁电畴运动、磁无序化与自旋-晶格耦合热力学，在四块 GPU 上对含长程偶极作用的 BaTiO₃ 达到 840³ 单胞（约 30 亿原子），并在 PbTiO₃/SrTiO₃ 超晶格与 200 nm 颗粒中保持单胞分辨率，且无需预设多项式形式即可重构极化自由能面。\n3. 该工作表明中等计算资源下即可在传统由连续介质模型主导的介观尺度上获得原子级分辨率结果，为跨体系铁性材料的多尺度模拟提供了统一且可扩展的路径。", "summary_source": "deepseek", "authors": [{"name": "Pinchen Xie"}], "featured_authors": [{"name": "Pinchen Xie"}], "author_count": 1}, {"id": "2610.33383", "category": "cond-mat", "title": "Distributional statistics of nonequilibrium", "abstract": "We establish a reference modeling framework for random probability distributions subject to constraints. Generalizing the hyperensemble approach of Crooks, we formulate Jaynesian priors of maximal uncertainty over the unit simplex of categorical distributions. This framework is entirely general, but we primarily investigate models with constraints on physically relevant quantities, namely, average energy and Shannon entropy. A constraint on the exact value of average energy uniquely determines a Boltzmann-Gibbs equilibrium, but also defines a hyperplanar subset of the probability simplex consisting of all distributions with that value of average energy. The associated hyperensemble has a uniform probability density across all such distributions, regardless of distance to equilibrium. Such reference models make predictions of generic nonequilibrium properties such as the mean and modal microstate distributions and the expected free energy of a random distribution, which we examine analytically and via exact sampling algorithms. Moreover, introducing constraints on Shannon entropy permits parametric access to tunably nonequilibrium regimes. The approach follows conventional Jaynesian modeling logic and is compatible with standard Bayesian inference, and reduces to Boltzmann-Gibbs statistics when Shannon entropy is maximized. We examine the physical predictions of this scheme, and demonstrate its wide compatibility with other approaches to nonequilibrium modeling. We illustrate the framework in three scenarios: (i) comparison to superstatistics quasi-equilibrium modeling, (ii) generation of random nonequilibrium steady states, and (iii) Bayesian inference under a prior hyperensemble. We highlight numerous prospects for theoretical extensions and empirical application.", "url": "https://arxiv.org/abs/2610.33383", "type": "理论+数值", "summary": "1. 该工作建立了受约束随机概率分布的参考建模框架，将Crooks超系综推广为单纯形上的Jaynes最大不确定性先验，并重点研究平均能量和Shannon熵约束。\n2. 其关键优势在于固定平均能量所定义的概率单纯形超平面上的均匀超系综与到平衡态的距离无关，可解析并精确采样平均与众数微态分布及期望自由能，并通过熵约束连续调节非平衡程度。\n3. 该框架兼容贝叶斯推断并在Shannon熵最大化时退化为Boltzmann-Gibbs统计，为超统计比较、随机非平衡稳态生成及超系综先验下的贝叶斯推断提供了可扩展参考。", "summary_source": "deepseek", "authors": [{"name": "Harrison Hartle"}, {"name": "Aanjaneya Kumar"}, {"name": "David H. Wolpert"}], "featured_authors": [{"name": "Harrison Hartle"}, {"name": "Aanjaneya Kumar"}, {"name": "David H. Wolpert"}], "author_count": 3}, {"id": "2610.33393", "category": "cond-mat", "title": "Controlling transport with structured long-range hopping", "abstract": "The combined effects of disorder and long-range hopping play an important role in determining localization and transport in low-dimensional quantum systems. We study transport in a one-dimensional disordered chain with nearest-neighbor hopping supplemented by a long-range hopping term. The long-range coupling is characterized by site-dependent amplitudes that may be either uniform or random. We investigate the interplay between diagonal disorder and long-range hopping, characterizing the resulting transport efficiency. We find that nearest-neighbor hopping in the presence of uniform long-range hopping amplitudes strongly suppresses delocalization over a range of weak disorder. The disorder-enhanced transport regime, established in previous studies, can be understood here as the recovery of delocalization from this strongly suppressed regime. An analytical solution in the Anderson eigenstate basis reveals the microscopic origin of this behavior. In particular, we show that the low-disorder regime of strongly suppressed delocalization can be eliminated by introducing randomness into the long-range hopping amplitudes, providing an additional mechanism for enhancing transport and qualitatively changing the response of the system to disorder.", "url": "https://arxiv.org/abs/2610.33393", "type": "理论", "summary": "1. 该工作在含对角无序的一维链中引入格点依赖的长程跃迁，系统研究了均匀与随机长程幅度下最近邻跃迁与无序竞争对输运效率的影响。\n2. 其核心在于用安德森本征态基下的解析解揭示：均匀长程跃迁会在弱无序区强烈抑制离域化，而此前报道的无序增强输运可视为由此抑制态恢复的离域化。\n3. 更重要的是，将随机性引入长程跃迁幅度可消除该强抑制区，从而提供额外输运增强机制并定性改变体系对无序的响应，这为低维量子输运调控提供了可检验思路。", "summary_source": "deepseek", "authors": [{"name": "Boris Gurevich"}, {"name": "Michael H. Kolodrubetz"}], "featured_authors": [{"name": "Boris Gurevich"}, {"name": "Michael H. Kolodrubetz"}], "author_count": 2}, {"id": "2610.33394", "category": "cond-mat", "title": "Mapping bimodal colloidal depletion systems onto the monodisperse gelation phase diagram", "abstract": "Many industries rely on models of colloidal gelation and phase behavior to predict how processing equipment will handle new product formulations. In colloidal systems with nearly uniform particle size it is possible to predict the formation of a gel from only three state variables; however, the extension of this model to bimodal and multimodal systems is not well described. Here we present a systematic simulation study of the attractive bimodal depletion gel phase diagram. For these systems, we find that gelation is highly dependent on total volume fraction, attraction conditions, and bimodal composition. Attraction and composition can be effectively collapsed into a single parameter using the contact-weighted second virial coefficient. This successfully projects the bimodal phase diagram onto the established monodisperse phase diagram, including accurately describing most bulk assembly properties; however, the underlying network structure of these gels remains highly dependent on the details of bimodal composition and attraction.", "url": "https://arxiv.org/abs/2610.33394", "type": "理论+数值", "summary": "1. 该工作通过系统模拟研究了吸引型双峰耗尽胶体的凝胶相图，考察总体积分数、吸引条件与双峰组成对凝胶化的影响。\n2. 其核心是将吸引与组成通过接触加权第二维里系数折叠为单一参数，从而把双峰相图投影到已有的单分散凝胶相图，并较好描述多数体相组装性质。\n3. 该映射表明双峰体系的宏观凝胶行为可由等效单分散框架把握，但网络结构仍保留组成与吸引细节，为后续多分散胶体相图预测与结构调控提供边界清晰的启示。", "summary_source": "deepseek", "authors": [{"name": "Robert A. Campbell"}, {"name": "Ziye Zhuang"}, {"name": "Ali Mohraz"}, {"name": "Safa Jamali"}], "featured_authors": [{"name": "Robert A. Campbell"}, {"name": "Ziye Zhuang"}, {"name": "Ali Mohraz"}, {"name": "Safa Jamali"}], "author_count": 4}, {"id": "2610.33436", "category": "cond-mat", "title": "Dynamic Pseudogap Model: Analytic Results vs Monte Carlo Numerics", "abstract": "Recently proposed dynamic pseudogap model analytical results for spectral density of an electron scattered by random time-dependent Gaussian field representing fluctuations with finite nesting vector ${\\bf Q}$, characteristic oscillation frequency $\\omega_0$ and damping $\\gamma$, leading to pseudogap formation, are compared with exact numerical solution by Monte Carlo (MC) approach. We consider both commensurate (real) and incommensurate (complex) fluctuations, for a wide range of parameters of the model. Electron Green's function is approximated either by a double Poisson series with history-dependent Bogoliubov gaps or by exact static continued fraction solution. In the coherent regime double-series representation provides description of dynamic sideband formation in the spectral density. As coherence is progressively lost, the theory crosses over to the quasistatic fluctuating-gap regime described by the exact continued-fraction solution. The exact MC solution overcomes the limitations of analytic approach, such as neglect of Magnus-type corrections in commuting approximation, and establish the limits of analytic approach, as well as confirming the exactness of continued fraction solution in static limit. In general, analytic expressions demonstrate rather satisfactory agreement with exact MC numerics within their limits, confirming the overall qualitative physical picture of dynamic pseudogap formation.", "url": "https://arxiv.org/abs/2610.33436", "type": "理论+数值", "summary": "1. 该工作将动态赝能隙模型的解析谱密度与蒙特卡罗精确解系统比较，模型由有限嵌套矢量、特征频率和阻尼的高斯随机时变场描述，覆盖公度与非公度涨落及宽参数范围。\n2. 其技术卖点是用含历史依赖博戈留博夫能隙的双泊松级数或精确静态连分式近似电子格林函数，并由蒙特卡罗揭示相干区动态边带、退相干后向准静态涨落能隙的渡越及解析方法（含对易近似忽略马格努斯修正）的适用边界。\n3. 在适用范围内解析结果与蒙特卡罗总体满意吻合，确认动态赝能隙形成的定性图像，并表明连分式解在静态极限严格成立，为超越对易近似的后续理论提供基准。", "summary_source": "deepseek", "authors": [{"name": "Michael V. Sadovskii"}], "featured_authors": [{"name": "Michael V. Sadovskii"}], "author_count": 1}, {"id": "2610.33457", "category": "cond-mat", "title": "First-Principles Investigation of the Structural, Electronic, Optical, Elastic, and Thermoelectric Properties of X2MoSeO6 (X = K, Rb, Cs)", "abstract": "Understanding how alkali-metal substitution influences the coupled physical properties of molybdenum selenite oxides is essential for establishing their composition-structure-property relationships. Although the lighter members of the X2MoSeO6 family have been investigated, the heavier alkali-metal compounds remain comparatively unexplored, particularly regarding their integrated electronic, mechanical, optical, and thermoelectric responses. Here, a comprehensive first-principles investigation of X2MoSeO6 (X = K, Rb, and Cs) is presented using density functional theory and semi-classical Boltzmann transport calculations. The optimized structures exhibit progressive unit-cell expansion with increasing alkali-metal ionic size, while their indirect electronic bandgaps vary non-monotonically, reaching 2.646, 2.216, and 2.427 eV for K2MoSeO6, Rb2MoSeO6, and Cs2MoSeO6, respectively. All three structures satisfy the elastic stability criteria, with Hill-averaged bulk moduli increasing from 16.332 to 20.975 GPa across the series. K2MoSeO6 exhibits the strongest elastic anisotropy, whereas Rb2MoSeO6 possesses the highest static electronic dielectric constant (4.614) and maximum absorption coefficient (2.291*106 cm-1). Thermoelectric calculations reveal pronounced carrier-polarity-dependent behavior, with Rb2MoSeO6 attaining a positive Seebeck coefficient of 390.55e-6 V/K at 100 K and an electronic-only figure of merit (ZTe) of 7.286 at 300 K under the selected positive-Seebeck condition. By extending the investigation to the K-Rb-Cs series, this work establishes a comparative foundation for understanding and further exploring the functional characteristics of molybdenum selenite oxides.", "url": "https://arxiv.org/abs/2610.33457", "type": "理论+数值", "summary": "1. 该工作基于密度泛函理论与半经典Boltzmann输运计算，系统比较了X2MoSeO6（X=K、Rb、Cs）的结构、电子、光学、弹性与热电性质。\n2. 其关键结果在于随碱金属离子增大晶胞单调膨胀，而间接带隙呈非单调变化（2.646、2.216、2.427 eV），且Rb2MoSeO6具有最高静态介电常数、最大吸收系数及300 K下ZTe=7.286的电子热电优值。\n3. 该比较框架为理解碱金属取代调控钼硒酸盐氧化物的成分—结构—性质关系及后续功能筛选提供了可检验的第一性原理基准。", "summary_source": "deepseek", "authors": [{"name": "Sha Ajharul Islam Forhat"}, {"name": "Md. Rakibul Hasan Rakib"}, {"name": "Md. Al Noman Ruhin"}, {"name": "Md Tashfiq Bin Kashem"}], "featured_authors": [{"name": "Sha Ajharul Islam Forhat"}, {"name": "Md. Rakibul Hasan Rakib"}, {"name": "Md. Al Noman Ruhin"}, {"name": "Md Tashfiq Bin Kashem"}], "author_count": 4}, {"id": "2610.33466", "category": "cond-mat", "title": "Diffusion of chiral active Brownian particles in oscillatory Poiseuille flow", "abstract": "Micro- and nanoswimmers diffusing in a fluid flow confined to microchannels are often described by overdamped active Brownian particle dynamics, in which viscous effects dominate and inertia is negligible. Here, we investigate the diffusive behavior of chiral self-propelled particles in a two-dimensional microchannel with oscillatory Poiseuille flow. Using numerical simulations, we show that the effective diffusion coefficient strongly depends on the oscillation frequency, flow strength, intrinsic angular velocity, and rotational diffusion rate. Interestingly, the effective diffusion coefficient can oscillate with oscillation frequency and flow strength, exhibiting distinct maxima and minima. The enhanced diffusion peaks arise from resonant diffusion associated with the matching between the flow oscillation time scale and the intrinsic characteristic diffusion time scale. Moreover, we identify an additional vorticity matching mechanism, leading to alternating channel wall accumulation of particles during successive flow half-cycles. Additionally, chiral particles strongly amplify the resonant diffusion, producing diffusion enhancements of several orders of magnitude compared to nonchiral particles. The results of this study could have implications for controlling the diffusion of self-propelled particles in microfluidic channels using time-dependent flow.", "url": "https://arxiv.org/abs/2610.33466", "type": "数值", "summary": "1. 该文用数值模拟研究二维微通道内手性活性布朗粒子在振荡泊肃叶流中的扩散，系统考察有效扩散系数对振荡频率、流强、内禀角速度与转动扩散率的依赖。\n2. 其卖点是揭示有效扩散系数随频率和流强非单调振荡，并在流动振荡时间尺度与内禀特征扩散时间匹配时出现共振扩散，还提出连续半周期内粒子交替向通道壁积累的涡度匹配机制，且手性可使共振增强达数个量级。\n3. 这为利用时变流动调控微流控通道中自驱动粒子的扩散与输运提供了明确物理图像和潜在设计思路。", "summary_source": "deepseek", "authors": [{"name": "Anshika Sharma"}, {"name": "Vikas Sharma"}, {"name": "Narender Khatri"}, {"name": "Suneet Kumar Awasthi"}], "featured_authors": [{"name": "Anshika Sharma"}, {"name": "Vikas Sharma"}, {"name": "Narender Khatri"}, {"name": "Suneet Kumar Awasthi"}], "author_count": 4}, {"id": "2610.33469", "category": "cond-mat", "title": "Charge state and hydration of vacancies in silicon and silicon carbide in contact with water: A grand-canonical first-principles stability map", "abstract": "The state of a vacancy in a semiconductor is normally described by the Fermi level alone. In wet-etched, electrochemically processed, or humid silicon and silicon carbide, a vacancy also takes up hydrogen and oxygen from water, in amounts set by pH and electrode potential. We treat both effects together by minimizing the grand potential of a vacancy complex over its charge state and hydrogen/oxygen content. The result is a stability map in Fermi level and hydrogen chemical potential, which the computational hydrogen electrode relates to pH and potential. We parameterize it with spin-polarized density functional theory in 64-atom cells, including the vibrational free energy of bound H and O, for the silicon vacancy, its H, O, and OH complexes, and both vacancies of 3C-SiC. Hydrogen binds cooperatively to the silicon vacancy, which goes directly from bare to fully passivated $V$H$_4$. In contact with water the bare vacancy is never the lowest-energy state. Near neutral pH it binds oxygen from water as the A center, the paramagnetic hydroxyl complex forms below about pH 5 at zero bias, and full passivation to $V$H$_4$ requires cathodic bias. In PBE the Fermi level barely moves these boundaries, because the acceptor levels lie at or above the conduction-band edge. In SiC the first hydrogen binds to the silicon vacancy by 1.97 eV but is unbound at the carbon vacancy (the $Z_{1/2}$ center), so hydrogen from water alone should not passivate it except under cathodic bias.", "url": "https://arxiv.org/abs/2610.33469", "type": "理论+数值", "summary": "1. 该工作以巨正则第一性原理构建了硅与3C-SiC空位在水接触下的稳定性图，联合优化空位复合体的电荷态及氢氧含量。\n2. 其技术卖点是在64原子超胞的自旋极化密度泛函计算中纳入束缚H/O的振动自由能，并借计算氢电极把费米能级与氢化学势稳定区映射为pH和电极电位。\n3. 结果表明水环境中裸空位并非最低能态，中性pH下以A中心氧钝化为主、零偏压约pH 5以下形成顺磁羟基复合体，完全氢钝化需阴极偏压；SiC中氢虽易结合硅空位却在碳空位Z1/2上不束缚，故仅靠水中的氢难以钝化，这为湿法与电化学缺陷控制提供了判据。", "summary_source": "deepseek", "authors": [{"name": "Abhirup Patra"}], "featured_authors": [{"name": "Abhirup Patra"}], "author_count": 1}, {"id": "2610.33523", "category": "cond-mat", "title": "Large spin large deviations for interacting particle systems", "abstract": "We propose a novel framework for analyzing the sample-path large deviations of interacting particle systems directly on a lattice by considering a large-spin limit ($s \\to \\infty$). Through an appropriate scaling of variables, the process concentrates around its deterministic trajectory, governed by the lattice diffusion equation. We quantify the exponential cost of observing atypical trajectories by explicitly computing the path-space large deviation rate function from the scaled microscopic generator, based on a theory due to Feng and Kurtz. The rate function is described in terms of a Hamiltonian on a lattice in terms of classical spin variables. Notably, for our main model, the symmetric harmonic process, the corresponding Hamiltonian is identified with the classical integrable non-compact Ishimori spin chain. Furthermore, we show that our large spin large deviation theory is fully consistent with traditional Macroscopic Fluctuation Theory (MFT), smoothly recovering the standard MFT Hamiltonian in the spatial continuous limit. We also perform a Poisson-noise Martin--Siggia--Rose (MSR) computation to derive the non-linear lattice Hamiltonian directly from microscopic dynamics, use a relative entropy argument to obtain the density-current action, and establish the lattice fluctuation theorem alongside its symmetry origin. Overall, our framework provides a naturally regularized, lattice analogue of MFT that circumvents spatial ultraviolet singularities and possible continuous density blow-ups. We also apply our new scheme to partial symmetric exclusion process, symmetric inclusion processes, Brownian energy process and integrable heat conduction model, showing how their large-deviation Hamiltonians relate to classical compact and non-compact spin chains.", "url": "https://arxiv.org/abs/2610.33523", "type": "理论", "summary": "1. 该文提出在格点上直接分析相互作用粒子系统样本路径大偏差的框架，利用大自旋极限与变量标度使过程集中于格点扩散方程轨迹，并由标度化微观生成元显式计算速率函数。\n2. 其卖点是将速率函数表述为经典自旋变量的格点哈密顿量，在对称谐波过程中对应可积非紧 Ishimori 自旋链，并在连续极限下恢复标准 MFT 哈密顿量，同时用 MSR 与相对熵论证建立格点涨落定理。\n3. 该格点化 MFT 可规避空间紫外奇异性与密度爆裂，并应用于部分对称排除、对称包含、Brownian 能量及可积热传导模型，建立其与经典紧/非紧自旋链的联系。", "summary_source": "deepseek", "authors": [{"name": "Cristian Giardinà"}, {"name": "Tomohiro Sasamoto"}], "featured_authors": [{"name": "Cristian Giardinà"}, {"name": "Tomohiro Sasamoto"}], "author_count": 2}, {"id": "2610.33541", "category": "cond-mat", "title": "Effect of Size Asymmetry and Zwitterionic Character of Solvent Ions on Impedance Spectra of Ultradilute Colloidal Suspensions", "abstract": "Buffer chemistry modulates colloidal impedance critically for label-free biosensing and electrokinetic diagnostics, yet classical models neglect buffer-specific interactions. We studied carboxylated polystyrene (PS) microspheres in conductivity-matched zwitterionic 4-(2-hydroxyethyl)-1-piperazineethanesulfonic acid (HEPES) and phosphate-buffered saline (PBS). Two concentration-dependent regimes emerged: oscillatory at ultradilute concentrations (<0.02 w/v%; Region 1) and monotonic at higher concentrations (Region 2). In Region 1, HEPES at pH 6.9 (approximately 80% zwitterionic) produced the largest deviation of delta Z from the O'Brien prediction. The conductivity increment was opposite in sign to classical expectation. We attribute this to zwitterion-driven interfacial ordering that enhances local conductivity and promotes self-limiting particle clustering. Dynamic light scattering detected cluster formation at 0.008 w/v%, well below aggregation thresholds. Changing pH from 6.9 to 8.1 strongly altered impedance amplitude; DLS profiles remained invariant. This indicates zwitterions modulate electrochemical polarization, not physical assembly. Molecular dynamics simulations showed pH-dependent HEPES organization at the PS surface. At pH 6.9, interfacial charge- and number-density profiles showed comparable oscillatory periodicity. At pH 8.1, anionic HEPES produced a more diffuse profile with increased Na+ compensation. These results support interfacial ordering as a contributor to enhanced conductivity but do not establish discrete layers or registry. Zeta potentials distinguished stable HEPES interfaces from PBS, where magnitude increased with ionic strength, contrary to classical screening theory. These nonlinear signatures and mesoscale organization underscore the role of buffer selection in high-sensitivity impedance biosensing.", "url": "https://arxiv.org/abs/2610.33541", "type": "理论+数值", "summary": "1. 该工作结合阻抗谱、动态光散射、Zeta电位和分子动力学，研究了电导匹配的HEPES与PBS中羧基化聚苯乙烯微球的超稀悬浮液阻抗行为，并区分出超稀振荡区与较高浓度单调区。\n2. 其核心卖点是发现约80%两性离子化的HEPES在pH 6.9时导致最大O’Brien预测偏差和反常电导增量，归因于界面有序化增强局域电导并促进自限性团簇，而pH改变仅调幅阻抗、不改变DLS分布，表明调控的是电化学极化而非物理组装。\n3. 这提示缓冲液选择与两性离子界面组织是超稀胶体阻抗传感的关键变量，但结果尚不能确立离散界面层或严格配准，需后续实验与理论验证。", "summary_source": "deepseek", "authors": [{"name": "Meenakshi"}, {"name": "Shalini Gupta"}, {"name": "Gaurav Goel"}], "featured_authors": [{"name": "Meenakshi"}, {"name": "Shalini Gupta"}, {"name": "Gaurav Goel"}], "author_count": 3}, {"id": "2610.33585", "category": "cond-mat", "title": "Exact Magnetic Confinement of a Doped Hole by Kinetic Frustration", "abstract": "We establish an exact mechanism of magnetic confinement driven purely by kinetic frustration. In a finite open sawtooth $U=\\infty$ Hubbard chain of $L$ unit cells doped with one hole, the ground state at magnetization $M$ contains $M$ polarized triplet dimers surrounding a connected singlet region of length $\\ell_{\\rm s}=L-M$. A magnetic field selects $M$ and hence the confinement length. The hole forms a standing wave in the singlet region with exponential tails in the triplet background. Confinement requires neither disorder nor an exchange-generated string tension: destructive interference between direct and apex-mediated hopping makes the triplet bonds reflecting. At $t_2/t_1=[2+4\\cos(\\pi/(\\ell_{\\rm s}+2))]^{-1/2}$, they become perfectly reflecting, producing a position-degenerate compact localized state. At every fixed field $0<h<h_{\\rm sat}$, the singlet region remains finite as $L\\to\\infty$ and shrinks stepwise with increasing field, whereas at $h=0$ it spans the system.", "url": "https://arxiv.org/abs/2610.33585", "type": "理论", "summary": "1. 该工作在有限开放锯齿形U=∞ Hubbard链中掺入单空穴，严格证明纯由动能阻挫驱动的磁约束：磁场选定磁化M时，基态由M个极化三重态二聚体包围长度ℓ_s=L−M的单重态区。\n2. 其卖点是无序与交换弦张力均不必要，直接与顶点介导跃迁的相消干涉使三重态键成为反射壁，空穴在单重态区形成指数尾驻波，并在特定t2/t1下给出完全反射的位置简并紧凑局域态。\n3. 固定0<h<h_sat时单重态区在L→∞下仍有限并随场阶梯收缩，这为以动能阻挫实现可调磁约束和局域态提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Nikolai Peshcherenko"}, {"name": "Yixin Zhang"}, {"name": "Cristian D. Batista"}, {"name": "Yang Zhang"}], "featured_authors": [{"name": "Nikolai Peshcherenko"}, {"name": "Yixin Zhang"}, {"name": "Cristian D. Batista"}, {"name": "Yang Zhang"}], "author_count": 4}, {"id": "2610.33606", "category": "cond-mat", "title": "Second-Harmonic Bulk Response of Fractional Quantum Hall Fluids", "abstract": "We develop a bulk description for the second-harmonic Hall response of fractional quantum Hall fluids with broken inversion and rotational symmetries, distinct from edge theories based on nonlinear edge-mode dispersion. By projecting a tilted massive Dirac model onto a single low-energy band, we construct a composite-boson Chern--Simons theory for the lowest Landau level that retains projection-induced nonlinear electromagnetic couplings. The nonlinear Hall resistivity vanishes in the dc limit, while its finite-frequency response retains the characteristic filling-factor dependence $\\rho^{(2)}_{TLL}\\propto\\nu^{-2}$, where $\\nu$ is the Landau-level filling factor. At low frequency, its real and imaginary parts scale as $(\\omega/\\omega_c)^2$ and $\\omega/\\omega_c$, respectively, where $\\omega_c$ is the cyclotron frequency, and the response is strongly anisotropic with respect to the crystalline tilt axis. Notably, the Kohn-mode resonances present in the second-order conductivity cancel in the nonlinear Hall resistivity. These results establish finite-frequency nonlinear transport as a bulk probe of fractional quantum Hall fluids without requiring nonlinear edge-mode dispersion.", "url": "https://arxiv.org/abs/2610.33606", "type": "理论", "summary": "1. 该工作构建了破坏反演与旋转对称性的分数量子霍尔流体二次谐波霍尔响应的体态描述，区别于依赖非线性边缘模色散的边缘理论。\n2. 其关键在于将倾斜大质量狄拉克模型投影至最低朗道能级，构造保留非线性电磁耦合的复合玻色子陈-西蒙斯理论；非线性霍尔电阻率在直流极限消失，有限频保持ρ^(2)∝ν^{-2}依赖，低频实/虚部按(ω/ω_c)^2与ω/ω_c标度，并沿晶格倾斜轴强各向异性，二阶电导中的Kohn模共振在电阻率中相消。\n3. 这使有限频非线性输运成为无需非线性边缘模色散的分数量子霍尔体态探针，并启发对对称性破缺下体-边关系的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "J. Luke Pimlott"}, {"name": "Pablo Reiser"}, {"name": "T. Hans Hansson"}, {"name": "Habib Rostami"}], "featured_authors": [{"name": "J. Luke Pimlott"}, {"name": "Pablo Reiser"}, {"name": "T. Hans Hansson"}, {"name": "Habib Rostami"}], "author_count": 4}, {"id": "2610.33808", "category": "cond-mat", "title": "Chiral Superconductivity Adjacent to a Wigner Crystal in Rhombohedral Graphene", "abstract": "Can the correlations favoring electron crystallization also generate superconductivity in the neighboring metal? We investigate this possibility in rhombohedral tetralayer graphene with repulsive Coulomb interactions. Self-consistent Hartree--Fock calculations identify a commensurate triangular Wigner-crystal state. To investigate pairing on the metallic side, we construct a crossing-symmetric particle--hole vertex using coupled parquet and Bethe--Salpeter equations, incorporating exchange vertex corrections beyond polarization-bubble screening. Near crystallization, the enhanced electronic correlations generate an effective attraction favoring chiral $f$-wave pairing. Superconductivity is confined to a narrow metallic region adjacent to the crystal, qualitatively consistent with the superconducting sleeve observed near an insulating regime in rhombohedral graphene. These results connect the emergence of chiral pairing and its location in the phase diagram to the electronic correlations favoring crystallization.", "url": "https://arxiv.org/abs/2610.33808", "type": "理论+数值", "summary": "1. 该工作在斥力库仑相互作用的菱面体四层石墨烯中，考察利于电子晶化的关联能否在邻近金属区催生超导，并用自洽哈特里-福克计算识别出公度三角维格纳晶体态。\n2. 其关键卖点是采用耦合拼图方程与贝特-萨尔皮特方程构造满足交叉对称的粒子-空穴顶点，并在极化气泡屏蔽之外纳入交换顶点修正，揭示近晶化区增强关联产生有效吸引并偏向手性f波配对。\n3. 该结果将手性配对的出现及其相图位置同利于晶化的电子关联联系起来，并表明超导仅局限于维格纳晶体旁狭窄金属区，从而为解释菱面体石墨烯绝缘区附近超导套筒的成因与位置提供机制线索。", "summary_source": "deepseek", "authors": [{"name": "Ke Wang"}], "featured_authors": [{"name": "Ke Wang"}], "author_count": 1}, {"id": "2610.33838", "category": "cond-mat", "title": "First-Principles-Informed Modeling of Thermal Transport and Laser-Induced Heating in Ultrahigh-Temperature Carbides", "abstract": "Using first-principles density functional theory and Boltzmann transport calculations, we systematically investigate the electronic structure, lattice and electronic thermal transport, optical response, and laser-induced heating of ultrahigh-temperature carbides (UHTCs), including Group IV (TiC, ZrC, and HfC) and Group V carbides (VC, NbC, and TaC), and SiC. The transition-metal carbides (TMCs) exhibit metallic electronic structures, whereas SiC exhibits semiconducting character. The calculated thermal transport properties reveal distinct contributions from phonons and electrons, with electronic heat transport becoming increasingly important at elevated temperatures in TMCs. The Group V carbides exhibit substantially lower lattice thermal conductivity than their Group IV counterparts, accompanied by pronounced Kohn anomalies and modified phonon dispersions associated with their distinct electronic structures, suggesting a possible connection between Fermi-surface topology, phonon dynamics, and lattice thermal transport. In contrast, SiC exhibits comparatively high lattice thermal conductivity, consistent with its long-lived acoustic phonons, but no electronic contribution due to its semiconducting nature. Optical calculations reveal relatively high reflectivity in the visible and infrared spectral ranges for the metallic carbides, whereas SiC exhibits lower reflectivity in the infrared region. Finally, one-dimensional and three-dimensional continuum heat-conduction models are employed to compare the thermal responses of these materials under specified laser irradiation conditions. The predicted temperature distributions depend on the thermal and optical properties of the materials as well as the specimen geometry.", "url": "https://arxiv.org/abs/2610.33838", "type": "理论+数值", "summary": "1. 该工作结合第一性原理DFT与玻尔兹曼输运，系统模拟IV、V族过渡金属碳化物及SiC的电子结构、晶格/电子热输运、光学响应与激光致热。\n2. 其卖点在于区分声子与电子热导，指出V族碳化物低声子热导伴随Kohn反常，并用一维/三维连续热传导模型比较激光致热。\n3. 这为UHTC热管理、激光加工及费米面—声子—热输运关联的后续研究提供可检验启示。", "summary_source": "deepseek", "authors": [{"name": "Shivanand Yadav"}, {"name": "Shailendra Kumar Verma"}, {"name": "Vardhman Dwivedi"}, {"name": "Raihan Ahammed"}, {"name": "Rohitash Kumar"}, {"name": "Manvendra Sharma"}, {"name": "Pritam Chakraborty"}, {"name": "Somnath Bhowmick"}], "featured_authors": [{"name": "Shivanand Yadav"}, {"name": "Shailendra Kumar Verma"}, {"name": "Vardhman Dwivedi"}, {"name": "Manvendra Sharma"}, {"name": "Pritam Chakraborty"}, {"name": "Somnath Bhowmick"}], "author_count": 8}, {"id": "2610.34021", "category": "cond-mat", "title": "Deep Scientific Reasoning under Physical Constraints: Structure-Aware Spectrum Prediction", "abstract": "Structured scientific spectra encode rich physical information while obeying hard constraints, such as conservation laws and characteristic spectral geometry. Accurate prediction of these spectra is central to materials discovery, yet existing methods often treat them as unconstrained sequences and therefore fail to enforce the underlying physical structure. Taking electronic density of states (eDOS) as the prototypical example, we introduce DeepSciReasoner, a general paradigm for predicting scientific spectra under physical constraints. The framework combines structure-aware spectrum decoding with constraint-preserving physical reasoning, allowing predictions to capture rich spectral structure while respecting the underlying physics. We evaluate DeepSciReasoner on eDOS, phonon density of states (phDOS), X-ray absorption near-edge structure (XANES), and Raman spectra, where it substantially improves prediction accuracy while maintaining physical consistency. These results establish DeepSciReasoner as a reusable blueprint for structured scientific spectrum prediction under hard physical constraints.", "url": "https://arxiv.org/abs/2610.34021", "type": "理论+数值", "summary": "1. 该工作提出 DeepSciReasoner，一种在守恒律与特征谱几何等硬物理约束下进行结构化科学谱预测的通用范式，并以电子态密度为典型示例。\n2. 其核心卖点是将结构感知的谱解码与保持约束的物理推理相结合，使预测既能刻画丰富谱结构又满足底层物理一致性，并在 eDOS、声子态密度、XANES 和拉曼谱上同时提升精度与一致性。\n3. 这为受硬约束的结构化谱预测提供了可复用蓝图，并可启发材料发现中融合物理先验的模型设计与跨谱类推广。", "summary_source": "deepseek", "authors": [{"name": "Yingheng Wang"}, {"name": "Tao Yu"}, {"name": "Shufeng Kong"}, {"name": "Francesco Ricci"}, {"name": "John M. Gregoire"}, {"name": "Carla P. Gomes"}], "featured_authors": [{"name": "Yingheng Wang"}, {"name": "Tao Yu"}, {"name": "Shufeng Kong"}, {"name": "Francesco Ricci"}, {"name": "John M. Gregoire"}, {"name": "Carla P. Gomes"}], "author_count": 6}, {"id": "2610.34029", "category": "cond-mat", "title": "TCSP3.0: Template-Based Crystal Structure Prediction with Coefficient-Preserving Element Substitution and Structural Diversity", "abstract": "Template-based crystal structure prediction (CSP) transfers a known crystal structure to a new composition by element substitution, so its accuracy depends on retrieving suitable templates, mapping elements and ranking the resulting candidates correctly. Auditing the original TCSP2.0 implementation on the T180 benchmark, we found that 469 of its 2,347 selected structures (20%) have the wrong composition, caused by element mappings that ignore stoichiometric coefficients and by sequential text substitution that cascades or corrupts element symbols. We propose TCSP3.0, which enforces coefficient-preserving mappings, substitutes species simultaneously on parsed structures and validates every candidate's composition and cell. It further adds periodic-number retrieval, soft oxidation-state evidence, radius-compatibility scoring, structural deduplication, and ORB-v3 machine-learning-potential relaxation and energy ranking of its candidates, as used by deep generative CSP baselines. TCSP3.0 achieves Top-1 and Top-20 match rates of 72.2% and 90.6% on T180, compared with 28.3% and 45.6% for TCSP2.0, and a Top-20 match rate of 74.0% on a new 800-target benchmark (T800). On T180 it also outperforms PNcsp+ and deep generative models CrystalFlow and MaskGXT (Top-1 72.2% versus at most 63.9%). Even without relaxation, TCSP3.0 reaches 67.8% at Top-1 and 90.6% at Top-20 in a median of 28 s per target on two CPU cores, about ten times faster than CrystalFlow. Paired ten-arm ablations on T180 and T800 show that most of the improvement comes from the correctness fixes; structural deduplication significantly improves the Top-5 match rate, embedding-based retrieval is required for coverage, and the remaining scoring features have small or null effects.", "url": "https://arxiv.org/abs/2610.34029", "type": "理论+数值", "summary": "1. 该工作审计TCSP2.0的元素替换错误并提出TCSP3.0，采用保系数映射、解析结构上的同步替换、组成与晶胞校验，并加入检索、评分、去重和ORB-v3势弛豫排序。\n2. 其卖点是修正忽略化学计量系数和文本串行替换导致的错误组成（T180上20%结构错配），使Top-1/Top-20匹配率达72.2%/90.6%，优于TCSP2.0及CrystalFlow、MaskGXT等基线。\n3. 消融显示提升主要来自正确性修复，去重改善Top-5，嵌入检索保障覆盖，其余评分特征影响小，提示模板CSP应优先保证映射与组成校验可靠。", "summary_source": "deepseek", "authors": [{"name": "Ying Feng"}, {"name": "Jeffrey Hu"}, {"name": "Lai Wei"}, {"name": "Liang Tao"}, {"name": "Madeline Miklos"}, {"name": "Dipannoy Das Gupta"}, {"name": "Hossein Erfanshekooh"}, {"name": "Jianjun Hu"}], "featured_authors": [{"name": "Ying Feng"}, {"name": "Jeffrey Hu"}, {"name": "Lai Wei"}, {"name": "Dipannoy Das Gupta"}, {"name": "Hossein Erfanshekooh"}, {"name": "Jianjun Hu"}], "author_count": 8}, {"id": "2610.34067", "category": "cond-mat", "title": "Electrically Reversible Layer-Tensor Responses in Bilayers", "abstract": "The layer Hall effect provides a prototypical example of a hidden layer response in van der Waals bilayers: opposite layers carry compensating Hall currents at zero out-of-plane electric field, while an applied out-of-plane electric field $E_z$ selects one layer over the other and switches the net Hall response. Here we show that this field-switching mechanism is not restricted to Hall transport, but follows from a general symmetry principle for response tensors. We formulate a selection rule for the layer tensor effect (LTE) using Jahn symbols. For a tensor with Jahn symbol $J$ and rank $r$, the stacking operation that exchanges the two layers acts as a coset representative relating the $+E_z$ and $-E_z$ states. Tensor components that are odd under this operation are forced to cancel between layers at $E_z=0$, and acquire a macroscopic response satisfying $T_\\alpha(+E_z)=-T_\\alpha(-E_z)$. This criterion allows us to enumerate the symmetry-allowed electrically reversible tensor components associated with different Jahn symbols and to identify their physical realizations in common response tensors. We apply the theory to representative anomalous Hall, shift-current, nonlinear Drude, piezoelectric, spin Hall, and spin-photocurrent channels. Model calculations and first-principles simulations further confirm the predicted field-odd responses. Our results establish an electrically switchable LTE framework, providing a unified route to multifunctional layertronic responses in bilayer materials.", "url": "https://arxiv.org/abs/2610.34067", "type": "理论+数值", "summary": "1. 该工作将双层中的层霍尔效应推广为一般的层张量效应，基于Jahn符号建立响应张量的选择规则，并系统枚举电可逆张量分量。\n2. 其核心是层交换操作作为陪集代表：零垂直电场时奇分量层间抵消，有限场下宏观响应满足正反电场反对称，从而统一描述异常霍尔、位移电流、非线性Drude、压电、自旋霍尔与自旋光电流等通道，并获模型与第一性原理验证。\n3. 这为范德华双层中电可切换的多功能层电子学响应提供统一对称性框架，并可用于筛选和设计可逆层响应材料。", "summary_source": "deepseek", "authors": [{"name": "Zehou Li"}, {"name": "Shenda He"}, {"name": "Pan Zhou"}, {"name": "Baoru Pan"}, {"name": "Rui Tan"}, {"name": "Lizhong Sun"}], "featured_authors": [{"name": "Zehou Li"}, {"name": "Shenda He"}, {"name": "Pan Zhou"}, {"name": "Baoru Pan"}, {"name": "Rui Tan"}, {"name": "Lizhong Sun"}], "author_count": 6}, {"id": "2610.34112", "category": "cond-mat", "title": "Jensen-Mercer two-sided bounds for entropy production rate", "abstract": "Bounds on entropy production convert limited observations into constraints on hidden dissipation. The Jensen bound expresses a lower bound on the total and subsystem entropy production rates of continuous stochastic systems in terms of mean coordinate rates alone. We show that the same convexity structure yields a complementary upper bound, inspired by Mercer's reflection inequality. For the quadratic entropy-production functional of overdamped Langevin dynamics, Mercer's reflection inequality is identical to the sharp Bhatia-Davis variance bound and coincides with the convex dual of the smallest affine majorant of the functional over the range of the local current. The two bounds yield a two-sided sandwich controlled solely by the mean drift and the extrema of the current, organized into a hierarchy of optimal bounds in which each further observation tightens the ceiling. The thermodynamic uncertainty relation supplies an independent fluctuation floor. We also treat position-dependent diffusion, underdamped dynamics and the tilted periodic potential, for which the weak-barrier series is obtained in closed form and the strong-barrier regime is solved asymptotically. We check the bounds numerically on the Brownian motor.", "url": "https://arxiv.org/abs/2610.34112", "type": "理论+数值", "summary": "1. 该工作把Jensen熵产生率下界与受Mercer反射不等式启发的互补上界结合，为连续随机系统构造仅由平均坐标速率、平均漂移及局域流极值控制的双边夹逼。\n2. 关键是在过阻尼Langevin动力学的二次熵产生泛函中，证明Mercer反射不等式等价于尖锐Bhatia-Davis方差界并对应最小仿射优函数的凸对偶，由此得到随观测增加而收紧的最优界层级，同时热力学不确定关系给出独立涨落下限。\n3. 该框架进一步覆盖位置依赖扩散、欠阻尼动力学和倾斜周期势，给出弱势垒级数闭式与强势垒渐近解，并在布朗马达上数值验证，为从有限观测约束隐藏耗散提供可操作路径。", "summary_source": "deepseek", "authors": [{"name": "Xiao-Kan Guo"}, {"name": "Zhiqiang Huang"}], "featured_authors": [{"name": "Xiao-Kan Guo"}, {"name": "Zhiqiang Huang"}], "author_count": 2}, {"id": "2610.34270", "category": "cond-mat", "title": "Andreev Reflection at a Graphene Normal-Superconductor Interface: A Lattice-Continuum Comparison", "abstract": "We compare quadratic continuum and nearest-neighbour tight-binding models of Andreev reflection at a clean graphene normal-superconductor interface. For abrupt changes in chemical potential and pairing potential, with unchanged hopping, the lattice model yields four independent boundary conditions. Its reflection probabilities agree with independent Kwant calculations to numerical precision for the channels examined. We investigate trigonal warping and its effect on the relation between momentum and group velocity. For $(\\mu_N,\\mu_S,\\Delta_0,E)/t_0=(0.5,1,0.1,0.05)$, the Andreev-reflection probability for the $\\xi=+1$ valley peaks at $19.9^\\circ$ in the lattice model, versus $3.4^\\circ$ in the quadratic continuum model. These parameters lie outside the expected validity regime of the low-energy approximation. As all energy scales are reduced at fixed ratios, the central angular response and conductance become more consistent with lattice results. The quadratic continuum boundary problem also requires short-wavelength auxiliary modes outside the validity range of the valley expansion. Thus, differences cannot be attributed to bulk dispersion alone. A small excitation energy relative to chemical potential does not ensure continuum validity; relevant energy scales, modes in both regions, and interface matching assumptions must also be considered.", "url": "https://arxiv.org/abs/2610.34270", "type": "理论+数值", "summary": "1. 该工作系统比较了干净石墨烯正常态-超导态界面安德烈夫反射的二次连续模型与最近邻紧束缚晶格模型，并在突变化学势与配对势且跃迁不变时给出晶格的四个独立边界条件。\n2. 其技术要点在于晶格反射概率与独立Kwant计算达到数值精度一致，并考察三角翘曲对动量-群速度关系的影响；在给定参数下晶格模型ξ=+1谷的安德烈夫反射概率峰值为19.9°，连续模型仅为3.4°。\n3. 该结果提示仅以激发能远小于化学势判断连续模型有效性并不可靠，还需考察相关能标、两区域模式、短波辅助模式及界面匹配假设，并可通过保持比例整体降低能标来检验与晶格结果的一致性。", "summary_source": "deepseek", "authors": [{"name": "Dar Faheem Ul Haq"}, {"name": "S. S. Z. Ashraf"}], "featured_authors": [{"name": "Dar Faheem Ul Haq"}, {"name": "S. S. Z. Ashraf"}], "author_count": 2}, {"id": "2610.34296", "category": "cond-mat", "title": "Edelstein Effect in Ferromagnetic Monolayers Fe3GaTe2 and Fe3GeTe2", "abstract": "The Edelstein effect enables intrinsic current-induced spin polarization in noncentrosymmetric van der Waals magnets. Here, we compare the Edelstein responses of monolayer \\ce{Fe3GaTe2} and \\ce{Fe3GeTe2} using first-principles Wannier-based linear-response calculations. Despite sharing the same noncentrosymmetric $D_{3h}$ symmetry and selection rules, the two materials show markedly different time-reversal-even and -odd spin accumulations in magnitude, sign, and energy dependence. Strong responses occur mainly near $-0.4$~eV in \\ce{Fe3GaTe2} and $+0.4$~eV in \\ce{Fe3GeTe2}. At the intrinsic Fermi level, atom-resolved analysis shows that Ga-to-Ge substitution reverses the even contribution of the inequivalent Fe3 site for both in-plane magnetization directions and enhances its negative odd contribution, reorganizing the cancellation among atomic sites. Momentum-resolved calculations link the hole-side response of \\ce{Fe3GaTe2} to a few large $\\Gamma$-centered Fermi contours, whereas the electron-side response of \\ce{Fe3GeTe2} involves dense Fe-$3d$ bands with strong interband contributions. The even response arises from incomplete cancellation of opposite-sign intraband Fermi-surface contributions, while the odd response originates from interband coherence between closely spaced states. Magnetization rotation reveals symmetry-constrained angular dependences with higher-order harmonics, especially in the $xz$ plane, while biaxial strain causes substantial amplitude changes and sign reversals. These results show how crystal symmetry, electronic structure, magnetization orientation, and lattice deformation govern the intrinsic Edelstein effect in \\ce{Fe3$X$Te2} ($X=\\mathrm{Ga},\\mathrm{Ge}$).", "url": "https://arxiv.org/abs/2610.34296", "type": "理论+数值", "summary": "1. 该文用第一性原理Wannier线性响应方法，比较单层Fe3GaTe2与Fe3GeTe2的电流诱导Edelstein自旋极化。\n2. 其核心发现是：相同D3h对称性与选择定则下，Ga→Ge替换重排不等价Fe3位点的偶/奇贡献及位点间抵消，使时间反演偶、奇自旋累积在符号、幅度和能量依赖上显著分化；偶响应源于带内费米面贡献不完全抵消，奇响应源于近邻态间带间相干。\n3. 该工作表明晶体对称性、电子结构、磁化取向和双轴应变共同决定本征Edelstein响应，为Fe3XTe2基自旋电子学中的应变与磁化调控提供依据。", "summary_source": "deepseek", "authors": [{"name": "Tongrui Li"}, {"name": "Lidong Zhang"}, {"name": "Weiyi Pan"}], "featured_authors": [{"name": "Tongrui Li"}, {"name": "Lidong Zhang"}, {"name": "Weiyi Pan"}], "author_count": 3}, {"id": "2610.34299", "category": "cond-mat", "title": "Virtual defect mediated quantum melting in supersolids", "abstract": "The current understanding of supersolid melting is largely based on mean-field theories predicting that such transitions arise from a structural energy minimization mechanism. Here, we show that soft-core quasi-one-dimensional supersolids stabilized by a shallow external lattice can instead melt at zero temperature into a superfluid phase with quasi-long-range positional order through the proliferation of virtual soliton--antisoliton pairs, leading to a Kosterlitz--Thouless transition. We derive the corresponding Renormalization Group equations from first principles and use them to determine the critical properties of the system. Remarkably, the proliferation of topological defects near criticality strongly renormalizes both the density modulation and the superfluidity behavior. The transition described is intrinsically a beyond mean-field effect, since the external lattice produces only a smooth crossover between weakly and strongly modulated states at the mean-field level.", "url": "https://arxiv.org/abs/2610.34299", "type": "理论", "summary": "1. 该工作研究浅外势晶格稳定的软核准一维超固体在零温下的量子熔化，指出其可通过虚孤子—反孤子对增殖转变为具有准长程位置序的超流相。\n2. 其核心在于从第一性原理推导对应重整化群方程并确定临界性质，揭示近临界拓扑缺陷增殖对密度调制与超流行为的强重整化。\n3. 这表明该熔化是超越平均场的科斯特利茨—索利斯转变，因为外晶格在平均场层面仅产生弱调制与强调制间的平滑过渡，为超固体熔化提供了拓扑缺陷机制视角。", "summary_source": "deepseek", "authors": [{"name": "Lazaros Tsaloukidis"}, {"name": "Matheus Grossklags"}, {"name": "Luca Salasnich"}, {"name": "Alejandro Mendoza-Coto"}], "featured_authors": [{"name": "Lazaros Tsaloukidis"}, {"name": "Matheus Grossklags"}, {"name": "Luca Salasnich"}, {"name": "Alejandro Mendoza-Coto"}], "author_count": 4}, {"id": "2610.34315", "category": "cond-mat", "title": "Tilt-Controlled Multi-Gap Superconductivity in Type-II Weyl Semimetals", "abstract": "In type-II Weyl semimetals, strongly tilted Weyl cones produce coexisting electron and hole pockets, a natural multi-band setting for superconductivity, yet how the tilt controls the number and relative size of the superconducting gaps remains unclear. Here we classify the symmetry-allowed on-site pairing channels of a simple time-reversal symmetric tilted Weyl-semimetal model with $D_4$ symmetry and identify the fully symmetric $A_1$ channel as the leading instability for attractive on-site interactions, supporting a fully gapped two-gap state. The tilt acts as a microscopic control parameter, redistributing the band-resolved pairing susceptibility between the two Fermi-surface sectors rather than simply rescaling the total density of states. Once the tilt sufficiently enhances the secondary channel, a robust secondary gap develops and can exceed the primary gap even at weaker effective coupling, while inter-gap coupling locks both gaps to a common critical superconducting temperature. The Weyl cone tilt thus controls the emergence and hierarchy of multi-gap superconductivity.", "url": "https://arxiv.org/abs/2610.34315", "type": "理论+数值", "summary": "1. 该工作在D4对称、时间反演不变的倾斜Weyl半金属模型中分类对称性允许的局域配对通道，并确定吸引型局域相互作用下全对称A1通道为主导不稳定性，支持全带隙双能隙态。\n2. 其卖点是倾斜作为微观参量，在两个费米面扇区之间重新分配分带配对磁化率而非仅重标度总态密度；次级通道被足够增强时可产生稳健次级能隙，甚至在较弱耦合下超过主能隙，而能隙间耦合使两能隙共享同一临界温度。\n3. 这确立Weyl锥倾斜为调控多能隙超导出现与能隙层级的内禀参量，为在第二类Weyl半金属中识别倾斜驱动的多带超导提供可检验思路。", "summary_source": "deepseek", "authors": [{"name": "Mingyu Lee"}, {"name": "Myungjun Kang"}, {"name": "Sangmo Cheon"}], "featured_authors": [{"name": "Mingyu Lee"}, {"name": "Myungjun Kang"}, {"name": "Sangmo Cheon"}], "author_count": 3}, {"id": "2610.34382", "category": "cond-mat", "title": "Nodeless d-wave pairing in monolayer FeSe revealed by intra-unit-cell Josephson interferometry", "abstract": "The Josephson effect provides a direct phase-sensitive probe of superconducting order and has played a central role in identifying unconventional pairing symmetries1-6. Conventional Josephson interferometry, however, extracts phase information through engineered junction geometries and crystallographic orientations, rather than by resolving the internal phase structure of the pair state within a single unit cell. Here, we use a superconducting Nb tip to realize atomic-scale Josephson interferometry in monolayer FeSe/SrTiO3. Despite a fully gapped quasiparticle spectrum, the local Josephson response exhibits a striking intra-unit-cell pattern, with maxima centred on Fe-Fe bonds and robust nodal lines along the Fe-Se directions. We show that these nodal lines arise from destructive interference between Josephson tunnelling amplitudes associated with opposite-sign pairing components. Microscopic calculations reproduce the observed spatial pattern and identify it as a fingerprint of nodeless d-wave pairing. Our results establish intra-unit-cell Josephson interferometry as a local phase-sensitive probe of pairing symmetry in unconventional superconductors.", "url": "https://arxiv.org/abs/2610.34382", "type": "理论+数值", "summary": "1. 该工作用超导Nb针尖在单层FeSe/SrTiO3上实现原子尺度的单元胞内约瑟夫森干涉测量，并在全间隙准粒子谱下观测到显著的局域约瑟夫森响应图案。\n2. 其关键卖点是把Fe-Fe键中心的极大值与沿Fe-Se方向的稳健节点线归因于相反符号配对分量所致约瑟夫森隧穿振幅的相消干涉，并由微观计算识别为无节点d波配对的指纹。\n3. 这确立了单元胞内约瑟夫森干涉作为非常规超导体配对对称性的局域相位敏感探针，并为后续在其它界面或低维超导体系中检验相位结构提供启发。", "summary_source": "deepseek", "authors": [{"name": "Runxin Li"}, {"name": "Yuchen Huo"}, {"name": "Jiong Mei"}, {"name": "Ming-Qiang Ren"}, {"name": "Miaomiao Wang"}, {"name": "Quanxing Wei"}, {"name": "Fengyu Yao"}, {"name": "Maowen Zheng"}, {"name": "Qing Qu"}, {"name": "Cui Ding"}, {"name": "Hongtao Yuan"}, {"name": "Zhuoyu Chen"}, {"name": "Wei-Qiang Chen"}, {"name": "Kun Jiang"}, {"name": "Qi-Kun Xue"}, {"name": "Yu-Jie Sun"}], "featured_authors": [{"name": "Runxin Li"}, {"name": "Yuchen Huo"}, {"name": "Jiong Mei"}, {"name": "Kun Jiang"}, {"name": "Qi-Kun Xue"}, {"name": "Yu-Jie Sun"}], "author_count": 16}, {"id": "2610.34428", "category": "cond-mat", "title": "Matter that learns what matters", "abstract": "Can a material learn what deserves its attention? We show that it can in a model optical network, in which action outcomes train a persistent record in each link. The record biases whether a source is consulted and sets how strongly it changes a stored answer, so useful sources gain attention and influence without being identified in advance. The network's experience thus shapes the information available for its future learning. Resonant readouts make this learning fragile: reinforcement can carry a record past resonance, where it persists but its influence weakens. We derive bounds within which relevant signals guide the answer, irrelevant signals are rejected and stored answers remain open to revision. These bounds guide a learning rule that limits reinforcement as records form; in simulations, it acquires useful records and keeps them functional. When relevance changes, an obsolete record can block its own replacement. A local state that strengthens negative writing after unsuccessful actions releases obsolete records and completes the learning sequence more often. How a memory is read should decide how it is written.", "url": "https://arxiv.org/abs/2610.34428", "type": "理论+数值", "summary": "1. 该工作在一个模型光学网络中让各链路以动作结果训练持久记录，从而学习应关注哪些信息源，并结合共振读出分析其学习边界与更新规则。\n2. 其核心在于记录同时偏置“是否查询某源”和“该源对存储答案的修改强度”，并揭示共振读出下强化可能越过共振而削弱影响，进而用限制强化及负向写入释放过期记录。\n3. 这启示物理学习系统应让记忆的读取方式决定写入方式，为可重构光学网络中的自适应注意、信息筛选与持续修正提供机制性方向。", "summary_source": "deepseek", "authors": [{"name": "Natalia G. Berloff"}], "featured_authors": [{"name": "Natalia G. Berloff"}], "author_count": 1}, {"id": "2610.34439", "category": "cond-mat", "title": "Theory of the $1/9$ Magnetization Plateau of the Spin-$1/2$ Kagome Heisenberg Antiferromagnet", "abstract": "We investigate the $1/9$ magnetization plateau of the spin-$1/2$ kagome Heisenberg antiferromagnet using infinite projected entangled-pair states and identify a spin-density-wave state with a $27$-site unit cell and a lower variational energy than previous approaches. In contrast to higher-magnetization plateaus, which are well described by localized magnons on nonoverlapping hexagons and preserve a sixfold rotational symmetry, the $1/9$ plateau only keeps a threefold rotational symmmetry and consists of a tiling by three types of $9$-site clusters related by $\\pm2\\pi/3$ rotations. These conclusions are supported by a complementary cluster mean-field theory which correctly preserves the symmetry of the higher plateaus but leads to the same spontaneous symmetry breaking for the $1/9$ plateau with a qualitatively similar pattern of nine different local magnetizations.", "url": "https://arxiv.org/abs/2610.34439", "type": "理论+数值", "summary": "1. 该文用无限投影纠缠对态研究了自旋1/2笼目海森堡反铁磁体的1/9磁化平台，并找到具有27格点单胞的自旋密度波态，其变分能低于此前方案。\n2. 其核心卖点是：与由非重叠六边形局域磁振子描述、保持六重旋转对称的高磁化平台不同，1/9平台仅保留三重对称，并由三类通过±2π/3旋转联系的9格点团簇铺砌而成。\n3. 补充的团簇平均场在保持高平台对称性的同时，对1/9平台给出同样的自发对称破缺及性质相似的九种局域磁化图案，为识别该低磁化相和检验对称性破缺机制提供了可检验依据。", "summary_source": "deepseek", "authors": [{"name": "Pratyay Ghosh"}, {"name": "Frédéric Mila"}], "featured_authors": [{"name": "Pratyay Ghosh"}, {"name": "Frédéric Mila"}], "author_count": 2}, {"id": "2610.34470", "category": "cond-mat", "title": "Symmetry-resolved quasilocal entanglement as a key to Mott and pseudogap physics in plaquette CDMFT", "abstract": "In order to identify intrinsic quantum resources in strongly interacting fermionic systems, we introduce a symmetry resolution of the parity-superselected two-site entanglement, as measured by both the fermionic negativity and the relative entropy of entanglement. We discuss how the symmetry resolution can be extended also to the full entanglement in pure and mixed two-site states. We apply our recipe to the Hubbard model, first for a dimer, and then for a plaquette cluster dynamical mean-field theory, an established method tailored to accurately capture short-range correlations. Following the evolution of the model through the interaction- and density-driven Mott transitions at zero temperature, we highlight how the three symmetry-resolved components of the two-site entanglement probe different key aspects of Mott and pseudogap physics.", "url": "https://arxiv.org/abs/2610.34470", "type": "理论+数值", "summary": "1. 该工作引入宇称超选择下两格点纠缠的对称性分解，以费米负性和纠缠相对熵为度量，并把该分解推广到纯态与混合态的两格点全纠缠，随后在Hubbard二聚体和斑块团簇动力学平均场（CDMFT）中追踪零温下相互作用驱动与密度驱动的Mott转变。\n2. 其卖点在于三个对称分辨纠缠分量分别灵敏刻画Mott物理与赝能隙物理的不同关键侧面，并在CDMFT所擅长的短程关联描述内实现准局域量子资源诊断。\n3. 这为在强关联费米体系中用可分辨纠缠资源识别Mott与赝能隙机制提供了可推广框架，并启发后续将其用于更一般格点模型、混合态及有限温关联研究。", "summary_source": "deepseek", "authors": [{"name": "Gabriele Bellomia"}, {"name": "Carlos Mejuto-Zaera"}, {"name": "Massimo Capone"}, {"name": "Adriano Amaricci"}], "featured_authors": [{"name": "Gabriele Bellomia"}, {"name": "Carlos Mejuto-Zaera"}, {"name": "Massimo Capone"}, {"name": "Adriano Amaricci"}], "author_count": 4}, {"id": "2610.34526", "category": "cond-mat", "title": "Geometric tailoring of domain wall traps and diodes in ferromagnetic nanostripes", "abstract": "Geometric tailoring of magnetic responses is a central theme in modern magnetism. By employing cross-sectional geometric modulation, we investigate how geometric variations influence the dynamics of field-driven domain walls. This approach enables the realization of a domain-wall trap, achieved through a nanostripe constriction, and a domain-wall diode, realized via a wedge-shaped expansion. We demonstrate that domain walls can be efficiently pinned by cross-sectional modulation, with the depinning field exhibiting strong dependence on the cross-sectional gradient. Under weak applied fields, the domain wall undergoes localized oscillations near the pinning site; under strong fields, this pinning breaks down, reproducing the typical diode characteristics. Theoretical calculations based on a biaxial ferromagnet model and a collective-variable approach are in excellent agreement with micromagnetic simulations. Finally, we delineate the parameter regime for realistic samples in which these predicted effects are most pronounced.", "url": "https://arxiv.org/abs/2610.34526", "type": "理论+数值", "summary": "1. 该工作通过横截面几何调制研究场驱动铁磁纳米带中的畴壁动力学，并利用收缩结构实现畴壁陷阱、利用楔形扩张实现畴壁二极管。\n2. 其核心在于去钉扎场强烈依赖横截面梯度：弱场下畴壁在钉扎点附近局域振荡，强场下钉扎失效并呈现典型二极管特性，双轴铁磁模型与集体变量理论同微磁模拟定量吻合。\n3. 作者进一步界定了真实样品中效应最显著的参数区间，为以几何裁剪磁性响应和设计可集成畴壁器件提供了可检验依据。", "summary_source": "deepseek", "authors": [{"name": "Dmytro Karakuts"}, {"name": "Kostiantyn V. Yershov"}, {"name": "Denis D. Sheka"}], "featured_authors": [{"name": "Dmytro Karakuts"}, {"name": "Kostiantyn V. Yershov"}, {"name": "Denis D. Sheka"}], "author_count": 3}, {"id": "2610.34551", "category": "cond-mat", "title": "A thermodynamic correction layer for machine learning interatomic potentials", "abstract": "Machine learning interatomic potentials enable atomistic simulations with near \\textit{ab initio} accuracy over large length and time scales. Foundation models extend this capability across the periodic table but inherit the thermodynamic description of the electronic structure methods used to generate their training data. Small errors in relative phase stability can therefore produce large errors in transformation temperatures. We introduce an additive thermodynamic correction layer that shifts phase free energies towards an assessed reference without retraining or
