realize perfect revivals and time quasicrystals (TQCs) in a Fibonacci-driven central-spin model with Ising interactions between the central and satellite spins in the absence of disorder. We analytically demonstrate that when the interaction strength, $\\lambda$ is tuned to $2 m \\pi$, no entanglement is generated between the central and satellite spins at stroboscopic times, independent of the strength of the transverse driving field and the drive sequence. This leads to indefinitely long-lived quasiperiodic oscillations in satellite spin magnetization. Furthermore, for initial states with a definite bath magnetization, no entanglement is generated when the transverse driving field, $\\theta$ is tuned to $\\pi$ for any value of $ \\lambda$, and the satellite spin magnetization oscillations exhibit period-3 revivals at Fibonacci times. Examining the robustness of these oscillations away from this fine-tuned limit, we identify a parameter regime where the quasiperiodic response does not decay over the timescales probed, giving rise to a long-lived $\\pi$-pulse-proximate TQC regime. We further show that at special Clifford points, the system exhibits perfect quasiperiodic oscillations of the satellite spin magnetization, with a parity-dependent Fourier response. This response persists over the timescales probed, even away from the Clifford points for an even number of satellite spins, leading to the formation of a Clifford-proximate TQC. Finally, we demonstrate that at this Clifford points, the system is steered along an entangled trajectory, leading to the dynamical generation of Bell-cat and spin-cat states. These states exhibit magnetization of collective spin fluctuates quadratically with the number of satellite spins, thereby enabling Heisenberg-limited metrology.", "url": "https://arxiv.org/abs/2610.35555", "type": "理论", "summary": "1. 该工作在不引入无序的斐波那契驱动中心-卫星自旋模型中，以中心-卫星自旋间伊辛相互作用为平台，解析给出实现完美复现与时间准晶的路径。\n2. 其卖点在于解析证明λ=2mπ时频闪时刻无中心-卫星纠缠、卫星磁化呈无限长寿命准周期振荡，θ=π时对确定磁化初态出现斐波那契时刻周期3复现，并在偏离微调后识别π脉冲近似与克利福德近似时间准晶区。\n3. 在克利福德点沿纠缠轨迹操控可动态生成贝尔猫态与自旋猫态，其集体自旋磁化涨落随卫星数二次增长而指向海森堡极限计量，并为无无序准周期驱动多体相与纠缠调控提供启发。", "summary_source": "deepseek", "authors": [{"name": "Anushka Agrawal"}, {"name": "Adithya A. Vasista"}, {"name": "Tanay Nag"}, {"name": "Sayan Choudhury"}], "featured_authors": [{"name": "Anushka Agrawal"}, {"name": "Adithya A. Vasista"}, {"name": "Tanay Nag"}, {"name": "Sayan Choudhury"}], "author_count": 4}, {"id": "2610.35657", "category": "quant-ph", "title": "Quantum-Inspired and Optimization-Based CT Reconstruction Through Spin-Error", "abstract": "Quantum-optimization-based computed tomography (CT) reconstruction has demonstrated quantum supremacy in reconstruction accuracy over conventional classical methods under sparse-view and corrupted-sinogram conditions. However, scaling this approach remains challenging because larger images require increasingly many binary variables and interactions in the underlying quadratic unconstrained binary optimization (QUBO) model. Even with iterative region-of-interest (ROI) refinement, a 60 by 60 ROI with three X-ray mass attenuation coefficients requires 10,800 binary variables under our encoding. As an initial step toward larger quantum CT images, we investigate simulated annealing (SA) followed by spin-error mitigation for optimisation (SEMO), without altering the CT-QUBO objective. We evaluate three 54-view ROI reconstruction instances and nine-view reconstruction with detector-row corruption, comparing SA and SEMO with selected hybrid quantum-classical solver results. For the ROI cases, SEMO reduced the numbers of incorrectly reconstructed pixels in low-budget SA outputs from 13 to 1, 38 to 0, and 54 to 15. With 20 percent detector-row corruption, three of four selected SA and SEMO pairs achieved exact reconstruction. Applying SEMO to one hybrid-solver output reduced its ROI error from 78 to 1 pixel. Improvements were instance-dependent: in one corrupted-sinogram case, QUBO energy decreased while image-domain error increased slightly; in one ROI case, the refined image retained 15 incorrect pixels despite having lower QUBO energy than ground truth. At the evaluated problem sizes, SA and SEMO attained reconstruction accuracy comparable to or better than selected unmitigated hybrid-solver results, providing an initial solution-quality benchmark for future larger-scale, parallelized quantum CT image reconstruction.", "url": "https://arxiv.org/abs/2610.35657", "type": "理论+数值", "summary": "1. 该工作在不改变CT-QUBO目标的前提下，研究模拟退火后接用于优化的自旋误差缓解（SEMO）的量子启发CT重建，并在稀疏视角与探测器行损坏条件下与部分混合量子-经典求解器对比。\n2. 其主要技术卖点是SEMO可将低预算退火输出的错误像素数由13降至1、38降至0、54降至15，并在20%探测器行损坏时使四组中的三组精确重建，还把一组混合求解器输出的ROI误差从78降至1像素。\n3. 该结果为当前规模下SA/SEMO与所选未缓解混合求解器精度相当或更优提供了证据，并作为未来更大规模、并行化量子CT重建的初步解质量基准；但改进具实例依赖性。", "summary_source": "deepseek", "authors": [{"name": "Hyunju Lee"}, {"name": "Jeonghwa Lee"}, {"name": "Yushuang Sam Yang"}, {"name": "Clement Chu"}, {"name": "Anthony B. Murphy"}, {"name": "Kyungtaek Jun"}], "featured_authors": [{"name": "Hyunju Lee"}, {"name": "Jeonghwa Lee"}, {"name": "Yushuang Sam Yang"}, {"name": "Clement Chu"}, {"name": "Anthony B. Murphy"}, {"name": "Kyungtaek Jun"}], "author_count": 6}, {"id": "2610.35660", "category": "quant-ph", "title": "Quantum computation of energy level degeneracy and thermodynamical properties of spin systems", "abstract": "We propose a hybrid quantum-classical method for reconstructing energy-level degeneracies and thermodynamic properties of spin systems. A single ancilla qubit is used to measure the partition function at imaginary inverse temperatures. For spectra lying on a known equally spaced energy grid, the inverse discrete Fourier transform allows exact reconstruction of degeneracies in the absence of noise, without spectral leakage. The quantum circuits are optimized using commuting interactions and Eulerian ordering. We demonstrate the method for frustrated Ising antiferromagnets on periodic Kagome graphs with up to 36 spins, using the ibm_kingston quantum processor. Despite substantial circuit depth and hardware noise, the reconstructed spectra retain their dominant features, and the calculated heat capacities reproduce the main temperature dependence of the exact results. Keywords: partition function, imaginary temperature, Ising model, heat capacity, ancilla qubit, quantum computing.", "url": "https://arxiv.org/abs/2610.35660", "type": "理论+数值", "summary": "1. 该工作提出一种量子-经典混合方法，用单个辅助量子比特在虚逆温度下测量自旋体系配分函数，并据此重构能级简并与热力学性质。\n2. 其技术卖点在于：当能谱位于已知等间距网格上时，逆离散傅里叶变换可在无噪声条件下无谱泄漏地精确重构简并度，且电路通过对易相互作用与欧拉排序优化。\n3. 作者在IBM Kingston处理器上对周期Kagome图上至多36个自旋的受挫Ising反铁磁体进行了演示，尽管电路深且噪声显著，重构谱仍保留主导特征、热容复现主要温度依赖，表明该框架可用于含噪中等规模量子平台上的谱与热力学信息提取。", "summary_source": "deepseek", "authors": [{"name": "V. M. Tkachuk"}, {"name": "M. I. Samar"}], "featured_authors": [{"name": "V. M. Tkachuk"}, {"name": "M. I. Samar"}], "author_count": 2}, {"id": "2610.35665", "category": "quant-ph", "title": "$κ$-Parametrized Boltzmann Distribution Sampling on Quantum Approximate Optimization Algorithm", "abstract": "Generative models use training data to produce new samples that resemble the original, with applications in classification and recommendation systems. Restricted Boltzmann Machines (RBMs) are at the core of generative models but suffer from the computational intractability of training, which relies on sampling an unknown Boltzmann Distribution (BD). The Quantum Approximate Optimization Algorithm (QAOA) can assist RBM training, potentially providing benefits over strictly classical strategies. One particular problem is determining the quantum circuit depth for an arbitrary problem size that yields the expected sampling results. In this study, we evaluate QAOA-assisted sampling of BDs using Qiskit's Aer Simulator by analysing the inverse effective temperature of the distribution, $\\kappa$, for tractable problem sizes. The results provide numerical evidence, based on Qiskit Aer simulations, that parameterized annealing-scheduled QAOA (PAQ-QAOA) can approximate RBM Boltzmann sampling for the tractable instances considered, while hardware performance and scaling remain open questions.", "url": "https://arxiv.org/abs/2610.35665", "type": "理论+数值", "summary": "1. 该工作基于Qiskit Aer模拟器评估参数化退火调度QAOA对受限玻尔兹曼机玻尔兹曼分布采样的近似能力，并在可处理规模下分析逆有效温度κ。\n2. 其卖点在于以κ参数化刻画采样分布，并通过数值实验表明PAQ-QAOA在所考察的可处理实例中可近似RBM的玻尔兹曼采样。\n3. 该结果为QAOA辅助RBM训练提供了模拟层面的可行性证据，但真实硬件性能与问题规模扩展仍是待验证的开放问题。", "summary_source": "deepseek", "authors": [{"name": "João Marcos Cavalcanti de Albuquerque Neto"}, {"name": "Gustavo Castro do Amaral"}, {"name": "Guilherme Penello Temporão"}], "featured_authors": [{"name": "João Marcos Cavalcanti de Albuquerque Neto"}, {"name": "Gustavo Castro do Amaral"}, {"name": "Guilherme Penello Temporão"}], "author_count": 3}, {"id": "2610.35722", "category": "quant-ph", "title": "Distillable entanglement is continuous", "abstract": "We prove continuity of distillable entanglement, the optimal asymptotic rate at which copies of a bipartite state can be converted into maximally entangled pairs by local operations and classical communication (LOCC) with vanishing error. We establish an explicit asymptotic continuity bound that holds for arbitrary bipartite states and depends logarithmically on the system dimension. This bound has the same structure as known continuity bounds for conditional entropy, entanglement cost, and relative entropy of entanglement. Our proof constructs an explicit LOCC protocol that converts either of two arbitrary bipartite states into the other at an ebit cost that vanishes as their trace distance tends to zero.", "url": "https://arxiv.org/abs/2610.35722", "type": "理论", "summary": "1. 该工作证明了两体态在LOCC下可蒸馏纠缠的连续性，即最大纠缠对的最优渐近转化率在误差消失时随态连续变化。\n2. 其核心卖点是给出适用于任意两体态、仅随系统维度对数增长的显式渐近连续性界，且与条件熵、纠缠成本及相对熵纠缠的已知界结构一致。\n3. 证明构造显式LOCC协议，使任一两体态相互转化的ebit成本随迹距离趋于零而消失，从而把连续性界与可操作转化过程直接联系起来。", "summary_source": "deepseek", "authors": [{"name": "Lukas Schmitt"}, {"name": "David Sutter"}], "featured_authors": [{"name": "Lukas Schmitt"}, {"name": "David Sutter"}], "author_count": 2}, {"id": "2610.35735", "category": "quant-ph", "title": "Decoding with alternating weighted graph sparsification for quantum low-density parity-check codes", "abstract": "Real-time decoding is a fundamental necessity for building fault-tolerant quantum computers. In this work, we introduce decoding with alternating weighted graph sparsification (DAWG), an ensemble based approach that combines Tanner graph sparsification with ensembling belief-propagation (BP) decoders. The DAWG decoder runs BP decoders over the full detector error model Tanner graph for certain iterations to then transfer the posteriors to a sparsified graph in which additional rounds of BP are run. Each of the decoders in the ensemble uses a different transfer matrix to map the posterior information to the sparsified graph. We use the serial schedule for the minimum-sum BP decoders and, thus, employ Vibe decoding ideas by randomizing the schedules of each of them. The performance of the DAWG decoder is then numerically studied for bivariate bicycle codes and superdense color code circuits to be compared with other state-of-the-art decoding approaches. Importantly, the DAWG decoder shows a similar performance to Relay belief-propagation and Vibe decoding when combined with an order-$0$ Localized Statistics Decoding (LSD-$0$) post-processor. Crucially, the post-processor is called an order of magnitude less times than for Vibe with the same ensemble size, indicating that the introduced latency tail will be minimal. Furthermore, LSD-$0$ operates on a sparsified decoding graph of a fraction of the size of the full detector error model, which simplifies the resources required by specialized hardware to support it. Overall, the DAWG+LSD-$0$ decoder represents a viable low-cost BP-based decoding algorithm for quantum error correction codes.", "url": "https://arxiv.org/abs/2610.35735", "type": "理论+数值", "summary": "1. 该工作提出DAWG解码框架，将Tanner图稀疏化与集成BP解码器结合，并在双变量自行车码和超密色码电路上数值评估其量子LDPC解码性能。\n2. 其技术要点是先在全探测器误差模型图上运行若干轮最小和BP，再用不同转移矩阵将后验信息映射到稀疏图继续BP，并随机化串行调度以兼取Vibe思想。\n3. 与LSD-0后处理结合时性能接近Relay BP和Vibe，且后处理调用次数低一个量级、稀疏图更小，有望降低实时解码延迟尾部与专用硬件资源需求。", "summary_source": "deepseek", "authors": [{"name": "Josu Etxezarreta Martinez"}, {"name": "Francisco Garcia-Herrero"}, {"name": "Ruben M. Otxoa"}, {"name": "Reza Dastbasteh"}], "featured_authors": [{"name": "Josu Etxezarreta Martinez"}, {"name": "Francisco Garcia-Herrero"}, {"name": "Ruben M. Otxoa"}, {"name": "Reza Dastbasteh"}], "author_count": 4}, {"id": "2610.35758", "category": "quant-ph", "title": "Competing coherence geometries in positive maps: positivity hierarchies, atomicity, and optimal entanglement witnesses", "abstract": "We introduce a family of positive maps on qudits whose Choi operators combine two competing coherence patterns: independent exchange couplings and a collective set of diagonal couplings. For every mixed member of the family, we derive exact conditions for positivity, complete positivity, and all intermediate levels of k-positivity, and we determine the complete phase structure of decomposability and atomicity. The higher-positivity thresholds depend on the channel multiplicities, whereas the exact decomposability boundary is universal in scale-free coordinates. Its proof combines an explicit positive-plus-copositive decomposition with a matching family of positive-partial-transpose (PPT) states. The latter form PPT edge states whose detection region is an ellipse, or a disk after collective rescaling. An embedded-qutrit certificate shows that indecomposability and atomicity coincide throughout the mixed family. In contrast, the purely collective endpoint is decomposable over its entire positive interval. Finally, at maximal coherence, an explicit positive subtraction produces an atomic optimal entanglement witness with the spanning property and a strictly larger PPT- detection set. The study thus provides an exactly solvable setting in which k-positivity, decomposability, atomicity, PPT-edge-state geometry, and witness optimality can be compared in arbitrary local dimension.", "url": "https://arxiv.org/abs/2610.35758", "type": "理论", "summary": "1. 该文在量子d态系统上构造一族正映射，其乔伊算符叠加独立交换耦合与集体对角耦合，并精确给出正性、完全正性及各级k-正性的条件以及可分解性与原子性的完整相图。\n2. 技术卖点是高正性阈值由信道多重度决定，而可分解边界在无标度坐标下普适；证明结合显式正加余正分解与匹配的正部分转置边态，其探测域为椭圆或经集体重标度后为圆盘。\n3. 嵌入三能级判据显示混合族中不可分解性与原子性重合，而纯集体端点在整个正区间可分解；最大相干处的显式正减除还构造出具张成性质且正部分转置探测集更大的原子最优纠缠见证者。", "summary_source": "deepseek", "authors": [{"name": "Massimiliano F. Sacchi"}], "featured_authors": [{"name": "Massimiliano F. Sacchi"}], "author_count": 1}, {"id": "2610.35784", "category": "quant-ph", "title": "Twist-controlled imaginary-time Mpemba effect in quantum spin systems", "abstract": "We construct a controllable imaginary-time Mpemba effect in quantum spin systems using spatially modulated local rotations without changing initial bipartite entanglement spectra and correlation magnitudes. This feature unambiguously isolates the redistribution of spectral weights as the sole driver of the anomalous relaxation. Using the compact-boson description, we reveal that these twists act as precise mode selectors: higher-harmonic twists exclusively populate high-energy standing waves, structurally bypassing slow-decaying infrared modes to accelerate convergence. We derive exact analytical crossing times for these reversals and demonstrate that intentionally reintroducing the slow-mode population systematically delays the ITME. This exact mechanism is validated beyond the fixed-point theory via calculations on interacting XXZ chains and ladders. Furthermore, a twelve-qubit simulation of variational quantum imaginary-time evolution reproduces the reversals and their controlled delay, providing a concrete route to realize this protocol in realistic quantum circuits. Ultimately, these results provide a strictly controllable and exact starting point for realizing and investigating the imaginary-time Mpemba effect, establishing a foundational paradigm to harness anomalous non-equilibrium relaxation in quantum ground-state preparations.", "url": "https://arxiv.org/abs/2610.35784", "type": "理论+数值", "summary": "1. 该工作通过空间调制的局域旋转在量子自旋系统中构造了可控的虚时间姆潘巴效应，并在保持初始二分纠缠谱与关联幅度不变的条件下隔离出谱权重重分布这一唯一驱动因素。\n2. 其核心卖点是以紧致玻色子图像将扭转视为模式选择器：高次谐波只填充高能驻波、结构性绕过慢衰减红外模以加速收敛，并给出反转交叉时间的解析式；重新注入慢模占据可系统延迟该效应，且在相互作用XXZ链与梯子及十二比特变分量子虚时间演化模拟中得到验证。\n3. 这为在真实量子线路中实现和检验虚时间姆潘巴效应提供了严格可控的精确起点，并启发利用反常非平衡弛豫优化量子基态制备。", "summary_source": "deepseek", "authors": [{"name": "Zhi-Yao Ning"}, {"name": "Zi-Xiang Li"}, {"name": "Naoki Kawashima"}], "featured_authors": [{"name": "Zhi-Yao Ning"}, {"name": "Zi-Xiang Li"}, {"name": "Naoki Kawashima"}], "author_count": 3}, {"id": "2610.35797", "category": "quant-ph", "title": "The $\\varepsilon$-smoothed Entanglement of Formation and its relation to the Moreau-Yosida approximation", "abstract": "We describe a family of convex continuous functions $E_{F,\\varepsilon}$, $\\varepsilon\\in(0,1]$, on the set of states of a bipartite quantum system (consisting of finite-dimensional or infinite-dimensional subsystems) obtained by applying the Mora-Piani-Briegel construction of $\\varepsilon$-measure (proposed in [Phys. Rev. A 109, 052413]) to the Entanglement of Formation (EoF) with the use of the trace norm distance in the role of basic metric. These functions are non-increasing in $\\varepsilon$ and converge pointwise to the EoF as $\\varepsilon\\to0^+$. We conducted a detailed analysis of properties of the functions $E_{F,\\varepsilon}$, using (among others) the relationship between the family $\\{E_{F,\\varepsilon}\\}_{\\varepsilon\\in[0,1]}$ and the family $\\{E^\\lambda_F(\\rho)\\}_{\\lambda>0}$ of Moreau-Yosida approximations of the EoF explored in [ arXiv:2609.30246 ]. We obtain a variational expression for the functions $E_{F,\\varepsilon}$ (which for $\\varepsilon=0$ turns into the standard variational expression for the EoF). We also describe the weak subadditivity property of the functions $E_{F,\\varepsilon}$ and analyse their continuity properties. The semicontinuity bounds for the EoF (presented in [ this http URL ., 46, 2632-2658],[ arXiv:2404.07978 ]) allow us to obtain easily computable upper bounds on the rate of uniform convergence of the function $E_{F,\\varepsilon}$ to the EoF as $\\varepsilon\\to0^+$ on the sets of states with bounded rank/energy of one of the marginal states. Applicability of the obtained results to other entanglement measures, in particular, to the relative entropy of entanglement, is discussed. As an auxiliary result, it is shown that for any state of an infinite-dimensional bipartite quantum system, there exists a nearest separable state w.r.t. the trace norm distance. The non-uniqueness of such a state is also shown.", "url": "https://arxiv.org/abs/2610.35797", "type": "理论+数值", "summary": "1. 该工作以迹范数距离为基础，用 Mora-Piani-Briegel ε-测度构造对有限或无限维二分量子系统的纠缠形成（EoF）作 ε-平滑，定义凸连续族 E(F,ε)，并给出其随 ε 非增、点态收敛到 EoF 及弱次可加性与连续性。\n2. 其技术卖点是通过与 EoF 的 Moreau-Yosida 逼近建立联系，给出 ε=0 时退化为标准式的变分表达，并借助半连续性界得到在一侧边缘态秩或能量受限集合上可计算的均匀收敛速率上界。\n3. 这为 EoF 提供了可正则化且可估计的近似框架，可推广至相对熵纠缠等度量，并揭示无限维二分态在迹范数下最近可分态的存在性与非唯一性。", "summary_source": "deepseek", "authors": [{"name": "M.E.Shirokov"}], "featured_authors": [{"name": "M.E.Shirokov"}], "author_count": 1}, {"id": "2610.35828", "category": "quant-ph", "title": "Interference-induced dynamical crossovers in quantum walks on disordered square lattices", "abstract": "We study discrete-time quantum walks with Fourier, Grover, and Hadamard coin operators on disordered square lattices, alongside classical random walks. Edges in the lattice are absent with a probability, $p$. In this case, both classical and quantum walks exhibit an essentially identical degradation of transport. We then study a general version of this model, in which the existing edges are retained. However, the absent edges are no longer absent, but now become partially transmitting, with a transmission coefficient $f$. We find that the response is now quite sensitive to the walk protocol and coin symmetry. The classical walk exhibits asymptotic stability of the anomalous diffusion exponent, $\\beta(t)$. In comparison, quantum walks exhibit a monotonically decaying $\\beta(t)$ beyond the initial transient regime, leading to the absence of quantum diffusion in two dimensions. We map the transport regimes in the $(f,p)$ plane and identify the contour for $\\beta=1$, which separates the subdiffusive and superdiffusive regimes. We also examine the effective diffusion coefficient, the inverse participation ratio, and the first two moments of edge transmission. We restrict ourselves to analyzing bulk propagation prior to finite-size boundary reflections. The results indicate that quantum transport depends significantly on coin-specific interference and cannot be fully described by transmission statistics alone.", "url": "https://arxiv.org/abs/2610.35828", "type": "理论", "summary": "1. 该工作在无序方格上比较Fourier、Grover与Hadamard硬币的离散时间量子行走和经典随机行走，并引入以概率p缺失、以透射系数f部分透射的边，系统映射(f,p)平面的输运相图。\n2. 其核心在于揭示经典行走的反常扩散指数β(t)渐近稳定，而量子行走在瞬态后β(t)单调衰减并在二维导致量子扩散消失，且该行为强烈依赖硬币对称性与干涉而非仅由边透射统计决定。\n3. 这为无序晶格上量子行走输运的分类、有限尺寸前体态分析以及基于硬币与干涉调控的量子模拟提供了可检验框架。", "summary_source": "deepseek", "authors": [{"name": "Ramnarayan Bera"}, {"name": "Arijit Roy"}, {"name": "Soumyadip Ghosh"}, {"name": "Soumen Roy"}], "featured_authors": [{"name": "Ramnarayan Bera"}, {"name": "Arijit Roy"}, {"name": "Soumyadip Ghosh"}, {"name": "Soumen Roy"}], "author_count": 4}, {"id": "2610.35863", "category": "quant-ph", "title": "Complete entropy contraction from conditional hyperboundedness", "abstract": "For finite-dimensional quantum channels compatible with a faithful conditional expectation, we show that conditional hyperboundedness and strict GNS contraction together yield a relative entropy contraction. For KMS-symmetric quantum Markov semigroups, a conditional $2\\to q$ hyperboundedness at time $t_0>0$ combined with a GNS gap $\\lambda>0$ implies a modified logarithmic Sobolev constant \\[ \\alpha=\\frac{\\lambda(1-2/q)} {12(\\lambda t_0+\\log M+1-2/q)},\\] where $M$ is the hyperboundedness constant. As a consequence, completely bounded hyperboundedness over auxiliary systems gives complete versions of entropy contraction with the same rates.", "url": "https://arxiv.org/abs/2610.35863", "type": "理论", "summary": "1. 该工作在有限维、与忠实条件期望相容的量子信道框架下，证明条件超有界性与严格GNS收缩共同推出相对熵收缩。\n2. 对KMS对称量子Markov半群，作者由t0时刻的条件2→q超有界性与GNS间隙λ>0给出修正对数Sobolev常数α=λ(1−2/q)/[12(λt0+logM+1−2/q)]，其中M为超有界常数，这是核心定量卖点。\n3. 借助辅助系统上的完全有界超有界性，该结果自然导出相同速率的完全熵收缩，为量子信道与半群的稳定熵耗散分析提供可复用判据。", "summary_source": "deepseek", "authors": [{"name": "Li Gao"}, {"name": "Lijun Wang"}], "featured_authors": [{"name": "Li Gao"}, {"name": "Lijun Wang"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
