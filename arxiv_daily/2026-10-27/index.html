 modifying the base potential. A first order thermodynamic construction converts the required phase free energy shifts directly into configuration energy targets, which are fitted using a linear atomic cluster expansion and refined iteratively from measured free energies. We apply the method to melting and solid to solid transformations across elements with different crystal structures using a foundation GRACE model. After the correction, all transformation temperatures lie within the prescribed tolerance of the assessed values, including Ca, Ti, and Zr, where a solid to solid transition and melting are corrected together. Static energy curves, bulk moduli, and liquid structure remain close to those of the base model. Vacancy formation energies, thermal expansion, and liquid density depend on the corrected phase balance and change where the correction is large. The method requires neither retraining, differentiable dynamics, nor access to the parameters of the base potential. It provides a modular route for combining transferable atomistic models with assessed phase thermodynamics.", "url": "https://arxiv.org/abs/2610.34551", "type": "理论+数值", "summary": "1. 该工作提出一种加性热力学修正层，在不重训练或修改基础机器学习原子间势的前提下，将相自由能向评估参考值偏移。\n2. 其技术卖点是通过一阶热力学构造把所需相自由能移动直接转化为构型能目标，以线性原子簇展开拟合并根据测得的自由能迭代精修，且无需可微动力学或基础势参数。\n3. 在GRACE基础模型上对多种元素的熔化与固固转变修正后，转变温度均落入预设容差，这为将可迁移原子模型与评估相热力学模块化结合提供了可行路线，同时提示修正较大处会改变空位形成能、热膨胀和液态密度等相平衡敏感性质。", "summary_source": "deepseek", "authors": [{"name": "Sarath Menon"}, {"name": "Braulio Sanchez Ortega"}, {"name": "Ralf Drautz"}], "featured_authors": [{"name": "Sarath Menon"}, {"name": "Braulio Sanchez Ortega"}, {"name": "Ralf Drautz"}], "author_count": 3}, {"id": "2610.34568", "category": "cond-mat", "title": "Extremal and global-time statistics of sluggish random walks with stochastic resetting", "abstract": "We study the extremal and global-time statistics of a one-dimensional sluggish random walk, whose diffusivity decays as a power law of the distance from the origin, under Poissonian resetting to the origin. A change of variable maps the process onto a signed Bessel process, so that renewal theory applies. We obtain the exact Laplace transform of the distribution of the maximum over a finite window. At long times the centered maximum of the transformed process follows the Gumbel law, and in physical space the typical maximum grows as a power of the logarithm of the window length. The far-tail rate function does not depend on $\\alpha$ in the Bessel variable, so the second-order dynamical transition known for Brownian resetting, between maxima produced by a single anomalously long inter-reset interval and maxima produced by an interval occupying essentially the whole window, holds for every $\\alpha$. The time of the maximum is uniformly distributed in the bulk of the window, with boundary layers that shift its mean above the midpoint logarithmically in the window length. The last-passage time through the origin has an exact density, and the time elapsed since it converges to a Gamma law. Reflection symmetry makes the occupation time of the positive half-line and the last-passage time uncorrelated. The results reduce to the Brownian case and agree with simulations.", "url": "https://arxiv.org/abs/2610.34568", "type": "理论+数值", "summary": "1. 该文研究一维缓行随机游走在泊松重置到原点下的极值与全局时间统计，并通过变量变换将其映射为带符号贝塞尔过程以适用更新理论。\n2. 核心卖点是给出有限窗口最大值的精确拉普拉斯变换，证明长时中心化最大值服从耿贝尔律、典型最大值随窗口长度对数幂增长，且远尾速率函数与贝塞尔变量中的指数α无关，从而使布朗重置的二阶动力学转变对所有α成立。\n3. 该文还给出最大时刻在窗口内部的均匀分布及对数边界层、末次通过原点的精确密度与自其以来经过时间的伽马极限，并利用反射对称指出正半轴占据时间与该末次通过时间不相关，为重置扩散的极值统计提供可检验基准。", "summary_source": "deepseek", "authors": [{"name": "Theophilus Dwamena Frimpong"}], "featured_authors": [{"name": "Theophilus Dwamena Frimpong"}], "author_count": 1}, {"id": "2610.34586", "category": "cond-mat", "title": "Spontaneous magnetic diode effect in Co$_{1/3}$TaS$_2$", "abstract": "When electrons move through non-trivial spin textures in magnetic metals, conduction electrons couple to magnetic order through both their charge and their spin, acquiring non-trivial equations of motion and a dynamic spin polarization providing the foundation of spintronics. These mechanisms are, however, almost invariably reciprocal and the resistance a current encounters does not depend on its flow direction. Here we show that a chiral crystal lattice and an independently reversible chiral magnetic order together produce a diode whose forward direction is set by the magnetism rather than by the structure. In the triangular-lattice antiferromagnet Co$_{1/3}$TaS$_2$, whose chiral lattice hosts a chiral magnetic order of its own, independent handedness, we observe a pronounced nonreciprocal resistance. Unlike conventional electrical magnetochiral anisotropy, which is driven by an external magnetic field, our spontaneous magnetic diode effect arises from an internal noncoplanar spin texture with vanishing net magnetization. Symmetry analysis and model calculations show that the effect originates from the interplay of noncoplanar spin order and spin-orbit coupling, which generates a chiral, time-reversal-symmetry-breaking electronic response. Crucially, reversing the magnetic handedness reverses the sign of the nonreciprocal resistance, demonstrating magnetic control of the diode polarity.", "url": "https://arxiv.org/abs/2610.34586", "type": "理论+数值", "summary": "1. 该工作在三角晶格反铁磁体 Co1/3TaS2 中观测到由手性磁序自身产生的自发磁二极管效应，而非依赖外磁场。\n2. 其卖点在于对称性分析与模型表明，无净磁化的非共面自旋织构与自旋轨道耦合产生手性、破坏时间反演对称的电子响应，使非互易电阻的方向由磁手性而非晶格结构设定，翻转磁手性即反转二极管极性。\n3. 这一结果把电学非互易性与可独立翻转的磁手性联系起来，为无需外场的磁控自旋电子学器件和手性磁序探测提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Yining Hu"}, {"name": "Taikang Chen"}, {"name": "Jan Priessnitz"}, {"name": "Zili Feng"}, {"name": "Takashi Kurumaji"}, {"name": "Linda Ye"}, {"name": "Libor Šmejkal"}, {"name": "Chunyu Mark Guo"}, {"name": "Philip J. W. Moll"}], "featured_authors": [{"name": "Yining Hu"}, {"name": "Taikang Chen"}, {"name": "Jan Priessnitz"}, {"name": "Libor Šmejkal"}, {"name": "Chunyu Mark Guo"}, {"name": "Philip J. W. Moll"}], "author_count": 9}, {"id": "2610.34596", "category": "cond-mat", "title": "Non-magnetic impurities as a quantum microscope of finite size effects in spin chains", "abstract": "Finite-size effects are ubiquitous in quantum matter, yet typically invisible in the thermodynamic limit; when system size is restricted, boundaries and confinement reveal modified spectra, correlations, and emergent phenomena. With growing access to well-controlled few-spin systems, these effects are now directly observable and offer a route to probing universal physics and enabling quantum information applications. Here, we study finite-size physics in the quasi-one-dimensional Ising-like quantum antiferromagnet Ba(Co$_{1-x}$Mg$_x$)$_2$V$_2$O$_8$ with $x = 2\\%$ and $x = 5\\%$, where non-magnetic Mg$^{2+}$ ions fragment the Co$^{2+}$ spin chains into finite segments. Combining inelastic neutron scattering and numerical calculations, we identify distinct regimes with fundamentally different low-energy quantum excitations: spinons confined to chain boundaries, and a cluster mode in shorter chains corresponding to a collective reversal of the Néel-ordered segment without classical analogue. Our results demonstrate how chemical substitution acts as a quantum microscope providing direct access to boundary-shaped excitations in strongly correlated spin systems.", "url": "https://arxiv.org/abs/2610.34596", "type": "理论+数值", "summary": "1. 该工作在非磁性Mg²⁺掺杂的准一维Ising型量子反铁磁体Ba(Co₁₋ₓMgₓ)₂V₂O₈（x=2%、5%）中，结合非弹性中子散射与数值计算研究链段化诱导的有限尺寸物理。\n2. 其卖点是区分出边界限域的自旋子与短链中无经典对应的Néel链段集体反转团簇模，并将化学替代作为直接探测边界塑造激发的“量子显微镜”。\n3. 这为在强关联自旋体系中利用可控少自旋平台研究有限尺寸谱与边界激发提供了明确路径，并对量子信息应用具有启发。", "summary_source": "deepseek", "authors": [{"name": "Quentin Faure"}, {"name": "Shintaro Takayoshi"}, {"name": "Virginie Simonet"}, {"name": "Béatrice Grenier"}, {"name": "Stéphane Raymond"}, {"name": "Eric Ressouche"}, {"name": "Xavier Fabrèges"}, {"name": "Pascal Lejay"}, {"name": "Thierry Giamarchi"}, {"name": "Sylvain Petit"}], "featured_authors": [{"name": "Quentin Faure"}, {"name": "Shintaro Takayoshi"}, {"name": "Virginie Simonet"}, {"name": "Pascal Lejay"}, {"name": "Thierry Giamarchi"}, {"name": "Sylvain Petit"}], "author_count": 10}, {"id": "2610.34664", "category": "cond-mat", "title": "Reference-state dependence and interface scaling of superfluid response in a two-dimensional crystal", "abstract": "Grain boundaries modify both transport paths and the surrounding crystal, making their contribution to superfluid stiffness difficult to isolate. We quantify these contributions in stationary two-dimensional soft-core Gross--Pitaevskii (GP) crystals using tensor response, independently prepared bicrystals, and measured interface lengths. A one-percent change of lattice spacing alters the bulk stiffness by approximately 5--9\\%, comparable to the boundary contribution. For the same defective state, two bulk references give relative excesses of 0.027\\% and 4.15\\%. Matching the comparator to grain strain and chemical potential yields positive diagonal excesses in paired preparations at three interaction strengths. Within a twelve-state family with comparable grain interiors, the excess is robust to 288 bulk substitutions and follows an approximate length-per-area relation. Independent fixed-area pairs yield a line-response coefficient 3.1\\% higher than the three-size estimate. Size and directional dependence restrict this relation to the specified crystal conditions. Reduced link networks relate the directional response to the organization of boundary connections but do not accurately resolve every small bulk-subtracted excess. The results distinguish boundary enhancement from changes in the surrounding crystal and establish a quantitative comparison protocol for superfluid transport in defective crystals.", "url": "https://arxiv.org/abs/2610.34664", "type": "理论", "summary": "1. 该工作结合张量响应、独立制备双晶和实测界面长度，在二维软核GP晶体中分离并量化晶界对超流刚度的贡献。\n2. 核心在于表明参考态可使同一缺陷态的边界相对超额在0.027%与4.15%之间变化，而1%晶格间距变化即可使体刚度改变约5–9%、与边界贡献相当；将比较基准匹配到晶粒应变和化学势后，三种相互作用强度下的配对样品均给出正的对角超额。\n3. 在晶粒内部可比的12态族中，超额对288次体替换稳健并近似服从长度-面积关系，固定面积配对给出的线响应系数比三尺寸估计高3.1%；该协议区分边界增强与周围晶体变化，但尺寸与方向依赖及约化连接网络的有限精度界定了其适用条件。", "summary_source": "deepseek", "authors": [{"name": "Néstor Sepúlveda"}], "featured_authors": [{"name": "Néstor Sepúlveda"}], "author_count": 1}, {"id": "2610.34710", "category": "cond-mat", "title": "Simplified Parisi Ansatz III: Constructive Cavity Method and Ultrametricity", "abstract": "We present a physical explaination of the Constructive Cavity Method (CCM) for the Sherrington--Kirkpatrick model, which identifies the decomposition of the cavity variables into layers with the random overlap structure of Aizenman--Sims--Starr. We describe the low-temperature excitations through a dilute gas of defects relative to the ground state. The sharing of these defects among the descendants and the renewal of the fluctuations along new branches produce the GREM structure and the ultrametricity of the overlaps. This mechanism is developed first with a finite number of defects and then extended to exponential populations of states. At fixed kernel, the Gaussian covariances of the fresh fields connect the complete cavity variables, including their common components, to the same hierarchy that determines the Gibbs masses. We also correct some ambiguities of earlier formulations.", "url": "https://arxiv.org/abs/2610.34710", "type": "理论", "summary": "1. 该工作作为简化Parisi拟设系列的一部分，为SK模型中的构造性空腔法给出物理解释，将空腔变量分层与ASS随机重叠结构对应，并澄清既有表述的歧义。\n2. 其核心是用基态附近稀疏缺陷气体描述低温激发：缺陷在后代间共享、涨落沿新分支更新，从而生成GREM结构与重叠的超度量性，并由有限缺陷推广到指数多态。\n3. 在固定核下，完整空腔变量（含共同分量）的高斯协方差与决定Gibbs质量的同一层级结构相连，为无序系统超度量组织的构造性理解提供启发。", "summary_source": "deepseek", "authors": [{"name": "Simone Franchini"}], "featured_authors": [{"name": "Simone Franchini"}], "author_count": 1}, {"id": "2610.34736", "category": "cond-mat", "title": "Optimised growth of epitaxial D019 Mn3Ge(0001) thin films via single target sputtering", "abstract": "Materials with chemical identity Mn3X, where X is Sn, Ga, or Ge, are Heusler alloys with intriguing properties that are fundamentally and technologically interesting. They have topological properties with a non-trivial band structure that identify them as Weyl semimetals in the bulk. Their magnetic properties, which give rise to the topological band structure through spin-orbit coupling, are determined by their Kagome lattice structure, making them chiral non-collinear antiferromagnets. Among these materials, Mn3Ge is particularly interesting because it has a larger Berry curvature, leading to a large anomalous Hall conductivity and motivating potential spintronic applications. The desirable properties are only obtained when Mn3Ge has the D019 crystal structure, so producing an easily reproducible growth recipe is the main objective of this paper. Here we show that ultra-high-quality thin films of Mn3Ge with D019 symmetry can be grown from a Mn5Ge target on an Al2O3(0001) substrate with a Ru(0001) seed layer. The expected non-collinear antiferromagnetic order was confirmed by the finding of weak zero-field magnetisation (0.0086 +/- 0.0002) mu_B/Mn that does not saturate at high magnetic fields and has a Neel temperature of (291 +/- 2) K.", "url": "https://arxiv.org/abs/2610.34736", "type": "理论", "summary": "1. 该工作报道了以Mn5Ge单靶溅射在Ru(0001)籽晶层/Al2O3(0001)衬底上外延生长高质量D019 Mn3Ge(0001)薄膜的可重复工艺。\n2. 其关键卖点是通过单靶溅射获得D019对称性外延薄膜，并以约0.0086 μB/Mn的弱零场磁化、高场不饱和行为及(291±2) K的奈尔温度证实非共线反铁磁序。\n3. 该可复现生长方案为Mn3Ge中大贝里曲率与反常霍尔效应相关的自旋电子学应用及后续拓扑输运研究提供了材料基础。", "summary_source": "deepseek", "authors": [{"name": "Servet Ozdemir"}, {"name": "Ping-Luen Ho"}, {"name": "Callum Brennan-Rich"}, {"name": "Matthew Rogers"}, {"name": "Philippa Shepley"}, {"name": "Ahmet Yagmur"}, {"name": "Ismet Gelen"}, {"name": "Sehwan Song"}, {"name": "Zabeada Aslam"}, {"name": "Mannan Ali"}, {"name": "Shelly Conroy"}, {"name": "Sandrine Heutz"}, {"name": "Gavin Burnell"}, {"name": "B J Hickey"}], "featured_authors": [{"name": "Servet Ozdemir"}, {"name": "Ping-Luen Ho"}, {"name": "Callum Brennan-Rich"}, {"name": "Sandrine Heutz"}, {"name": "Gavin Burnell"}, {"name": "B J Hickey"}], "author_count": 14}, {"id": "2610.34769", "category": "cond-mat", "title": "Learning by Confusion Locates a Parametrization-Dependent Fisher Information Maximum", "abstract": "Learning by confusion (LBC) is a machine-learning method for locating phase transitions without assuming a known order parameter. Its characteristic accuracy curve contains a central maximum that is interpreted as the transition point, but what determines the location and finite-size scaling of this maximum has remained unclear. We derive an exact balance condition for the Bayes-optimal confusion peak and show that, for equilibrium systems with a single swept parameter, the peak closely follows the maximum of the corresponding Fisher information. This immediately gives its finite-size scaling and reveals an unexpected dependence on how the data are sampled: the same configurations arranged on grids uniform in $T$, $\\ln T$, or $\\beta=1/T$ can yield different finite-size pseudocritical trajectories. Tests on the Ising, Blume-Capel, Potts, and Baxter-Wu models confirm the prediction across continuous, tricritical, and first-order transitions. Our results identify the statistical quantity measured by LBC and show that finite-size machine-learning estimates can depend on the parametrization of the training data as well as on the underlying physics.", "url": "https://arxiv.org/abs/2610.34769", "type": "理论+数值", "summary": "1. 该工作针对无已知序参量的“困惑学习”相变定位方法，推导了贝叶斯最优困惑峰的精确平衡条件，并厘清其峰值位置与有限尺寸标度的决定因素。\n2. 对单一扫描参数下的平衡系统，该峰紧密跟随相应Fisher信息极大值，从而给出有限尺寸标度，并揭示同一构型按T、lnT或β均匀采样会产生不同的有限尺寸赝临界轨迹。\n3. 在Ising、Blume-Capel、Potts与Baxter-Wu模型上跨连续、三临界和一阶相变的验证确认了预测，表明LBC测量的是特定统计量，且有限尺寸机器学习估计可同时依赖训练数据参数化与底层物理。", "summary_source": "deepseek", "authors": [{"name": "George Issa"}, {"name": "Richard Scalettar"}], "featured_authors": [{"name": "George Issa"}, {"name": "Richard Scalettar"}], "author_count": 2}, {"id": "2610.34830", "category": "cond-mat", "title": "Helicity-Selective Electron-Phonon Coupling Between $PT$-Partner States in $2H$-bilayer MoS$_2$", "abstract": "Rotational symmetry ($C_n$) constrains chiral phonons, but how other symmetries affect their interactions remains largely unexplored. We perform a theoretical and computational study of chiral phonon coupling to parity-time ($PT$)-degenerate electron doublets in $2H$-bilayer MoS$_2$. Although $PT$ suppresses phonon singlet chirality, chiral phonon doublets can helically interact with $PT$-partner electronic states via a mechanism similar to pseudospin. Selection rules are then analyzed with the interplay of $PT$ and $C_3$. Our computational results of $2H$-bilayer MoS$_2$ suggest chiral phonons may be used to resolve intravalley electronic states in $PT$ systems.", "url": "https://arxiv.org/abs/2610.34830", "type": "理论", "summary": "1. 该工作通过理论与数值计算研究了2H双层MoS2中手性声子与PT简并电子双重态之间的耦合及选择定则。\n2. 其核心在于指出PT虽抑制声子单态的手性，但手性声子双重态可借类赝自旋机制与PT配对电子态发生螺旋选择性相互作用，并在PT与C3共同约束下给出选择定则。\n3. 基于2H双层MoS2的计算表明，手性声子有望用于分辨PT体系中的谷内电子态，并为利用非旋转对称性调控手性声子-电子耦合提供思路。", "summary_source": "deepseek", "authors": [{"name": "Fred Sun"}, {"name": "Jia-An Yan"}], "featured_authors": [{"name": "Fred Sun"}, {"name": "Jia-An Yan"}], "author_count": 2}, {"id": "2610.34857", "category": "cond-mat", "title": "Equivalent Pseudo-angular Momentum Governs Selective Magnon-Phonon Hybridization", "abstract": "Magnon-phonon hybridization provides a powerful route to couple spin and lattice excitations, yet the symmetry principle governing mode selectivity remains unclear. Here, we show that crystalline pseudoangular momentum provides a general criterion for selective magnon-phonon hybridization in noncollinear multisublattice magnetic systems. The rotation eigenvalue associated with pseudoangular momentum encodes polarization transformations, sublattice permutations, and Bloch phases, requiring magnetoelastic coupling between modes belonging to the same rotation sector. We illustrate this principle in a stacked kagome model with noncollinear spin order. An out-of-plane magnetic field tunes one magnon sector into resonance with a degenerate phonon doublet, yet only the pseudoangular-momentum-matched phonon develops a pronounced avoided crossing while the other remains nearly unmixed. Field reversal switches the selected rotation sector and reverses the rotational polarization of the hybridized phonon component without changing the hybrid-mode energies. Our results reveal pseudoangular-momentum matching as a general framework for understanding and controlling mode-selective spin-lattice hybridization.", "url": "https://arxiv.org/abs/2610.34857", "type": "理论", "summary": "1. 该文提出以晶体赝角动量作为非共线多子格磁体系中磁振子—声子选择性杂化的判据，并在堆叠笼目模型中加以验证。\n2. 其关键在于赝角动量对应的旋转本征值同时编码极化变换、子格置换与布洛赫相位，使磁弹耦合仅发生在相同旋转扇区内；外场将一个磁振子扇区调至与简并声子双峰共振时，只有角动量匹配的声子出现显著避免交叉，反向磁场则切换选定扇区并反转杂化声子的旋转极化而不改变杂化模式能量。\n3. 这为理解并主动控制模式选择性自旋—晶格杂化提供了通用对称性框架，并可启发非共线磁体中基于赝角动量的耦合调控。", "summary_source": "deepseek", "authors": [{"name": "Hong Sun"}, {"name": "Hao Chen"}, {"name": "Lifa Zhang"}], "featured_authors": [{"name": "Hong Sun"}, {"name": "Hao Chen"}, {"name": "Lifa Zhang"}], "author_count": 3}, {"id": "2610.34903", "category": "cond-mat", "title": "Inverse origami inspired by insect morphogenesis: geometric design of wrinkle structures for curved surface formation", "abstract": "Insect exoskeletons abruptly acquire complex three-dimensional forms during metamorphosis from larva to pupa. This transformation occurs through the unfolding of preformed wrinkle structures inside the larval body under internal pressure. Inspired by this process, we investigate an inverse-origami strategy for fabricating curved surfaces. Whereas conventional origami produces three-dimensional objects by folding a flat sheet, this strategy produces curved surfaces by unfolding preformed wrinkle structures. The central design problem is to derive a wrinkle structure from a prescribed target surface. Our key idea is to regard a wrinkle structure as a unidirectional stretching field, which specifies at each point the stretch produced when the structure unfolds. We first derive such a field from the target surface geometry and then translate it into spatially varying wrinkle directions and spacing, so that the wrinkle structure unfolds into the target. The resulting numerical designs approximate the intrinsic metric of the target surface. We demonstrate the method on multiple target surfaces through numerical construction, mechanical unfolding simulations, and 3D-printed prototypes. This work provides a biologically inspired geometric design principle for encoding prescribed surface shapes in wrinkle structures, as well as a framework for designing and fabricating deployable curved surfaces.", "url": "https://arxiv.org/abs/2610.34903", "type": "理论+数值", "summary": "1. 该工作受昆虫变态过程中预成型褶皱在内压下发开并形成复杂三维外骨骼的启发，提出一种逆向折纸策略，从给定目标曲面反推可展开的褶皱结构以制备曲面。\n2. 其核心是将褶皱结构视为单向拉伸场，由目标曲面几何导出该场并转化为空间变化的褶皱方向与间距，使数值设计逼近目标曲面的内蕴度量，并通过力学展开模拟与3D打印原型验证。\n3. 这提供了一种将预设曲面形状编码进褶皱结构的仿生几何设计原理，并为可展开曲面的设计与制造建立了通用框架。", "summary_source": "deepseek", "authors": [{"name": "Kentaro Morikawa"}, {"name": "Yuuki Shimizu"}, {"name": "Nen Saito"}, {"name": "Yasuhiro Inoue"}], "featured_authors": [{"name": "Kentaro Morikawa"}, {"name": "Yuuki Shimizu"}, {"name": "Nen Saito"}, {"name": "Yasuhiro Inoue"}], "author_count": 4}, {"id": "2610.34927", "category": "cond-mat", "title": "Dynamic helimagnetism via charged spin current", "abstract": "We present a theoretical and numerical study of classical, localized spins coupled to conduction electrons that carry both charge and spin currents, deriving the effective equations of motion from the s-d exchange Hamiltonian. Applied to a periodically arranged one-dimensional spin chain, these equations yield two current-driven helical phases: a static helix stabilized by a pure spin current alone, and a coherently precessing helix that appears once a small charge-current component is added. For a given helical wavenumber, the precession angular frequency $\\omega$ and the canting ratio $\\Delta$ toward the hard axis follow analytically from the equations of motion, while the wavenumber $q_{\\rm helix}$ of the precessing helix is selected by a heuristically constructed effective Lagrangian. Direct numerical integration of the same equations of motion reproduces all three observables wherever it yields a coherent helix. The helix chirality is set by a long-range, current-generated Dzyaloshinskii-Moriya (DM)-type coupling rather than an intrinsic DM interaction, so materials without bulk or interfacial DM interactions could also host current-controlled helical order. Because the helical pitch, precession frequency, and canting ratio are all continuously tunable by the current amplitudes, these helices could serve as probes of spin currents.", "url": "https://arxiv.org/abs/2610.34927", "type": "理论+数值", "summary": "1. 该工作由s-d交换哈密顿量导出传导电子与局域经典自旋耦合的有效运动方程，并在一维周期链上数值求解，得到纯自旋流稳定的静态螺旋和加入少量电荷流后出现的相干进动螺旋两种电流驱动螺旋相。\n2. 其卖点在于进动角频率ω与朝向易轴的倾角比Δ可由运动方程解析给出，进动螺旋波矢由构造的有效拉格朗日量选择，且手性来自电流产生的长程DM型耦合而非内禀DM相互作用。\n3. 由于螺距、进动频率与倾角比可随电流幅度连续调控，此类螺旋有望作为自旋流探针，并提示无体或界面DM相互作用的材料亦可承载电流控制的螺旋序。", "summary_source": "deepseek", "authors": [{"name": "Masaru Onoda"}], "featured_authors": [{"name": "Masaru Onoda"}], "author_count": 1}, {"id": "2610.34983", "category": "cond-mat", "title": "Trajectory Functionals in the Thermodynamics of Radiation-Induced Damage in Structural Materials", "abstract": "This paper delivers a novel self-consistent non-local kinetic framework based on dose-dependent semi-Markov renewal transport and the generalized Doob's h-transform to evaluate the structural degradation of WWER-1000/1200 fuel claddings. By leveraging the Feynman-Kac formalism, we map the continuous microscopic defect path trajectories generated by the Liouville operator directly onto the evolution of the macroscopically integrated damage potential. The framework accounts for long-range memory effects in the degradation kinetics via a non-vanishing structural commutator of the path Liouville operator and Zwanzig-Mori projection operators, which mathematically links the spatial restrictions of microscopic sinks to energetic path penalties. Spatial profiling of the cladding's mean lifetime, demonstrates a distinct sigmoidal, S-shaped degradation trajectory encompassing distinct incubation, linear growth, and avalanche breakdown stages. The numerical results reveal an abrupt, localized reduction in the operational lifespan near the cladding boundaries. This marginal vulnerability is shown to be a direct physical consequence of boundary stress field singularities at the fuel cladding interface and localized embrittlement. The developed path integral architecture provides a strict thermodynamic link between non-equilibrium fluctuations and the global Griffiths macro-barrier, offering a robust predictive tool for high-burnup nuclear fuel safety assessments.", "url": "https://arxiv.org/abs/2610.34983", "type": "理论+数值", "summary": "1. 该工作构建基于剂量依赖半马尔可夫更新输运与广义Doob h变换的自洽非局域动理学框架，评估WWER-1000/1200燃料包壳的辐射诱导结构退化。\n2. 其卖点是以Feynman-Kac形式将Liouville算符生成的微观缺陷路径映射为宏观损伤势演化，并用路径Liouville算符与Zwanzig-Mori投影算符的非零结构对易子刻画长程记忆，把微观汇空间限制转为能量路径惩罚。\n3. 该框架揭示S形退化轨迹及边界应力奇异性导致的寿命骤降，并在非平衡涨落与全局Griffiths宏观势垒间建立热力学联系，为高燃耗核燃料安全评估提供预测工具。", "summary_source": "deepseek", "authors": [{"name": "V. V. Ryazanov"}], "featured_authors": [{"name": "V. V. Ryazanov"}], "author_count": 1}, {"id": "2610.35081", "category": "cond-mat", "title": "Interaction dependence of the critical correlation length amplitude ratio in anisotropic scalar lattice $ϕ^4$ theory", "abstract": "We investigate critical correlations in the weakly anisotropic two-dimensional scalar lattice $\\phi^4$ theory and demonstrate that a previously reported independence of the correlation length amplitude ratio from the local interaction strength does not hold. Monte Carlo simulations instead reveal a pronounced dependence of this ratio on the interaction strength. As the coupling is increased, the amplitude ratio interpolates between the continuum and Ising limits, highlighting a nontrivial interplay between lattice effects and local interactions. These findings call for a revised theoretical description of anisotropy effects at finite coupling in this prototypical lattice field theory.", "url": "https://arxiv.org/abs/2610.35081", "type": "理论+数值", "summary": "1. 该工作采用蒙特卡罗模拟研究弱各向异性二维标量格点φ^4理论的临界关联，检验并否定了关联长度振幅比与局域相互作用强度无关的既有结论。\n2. 其核心结果是该振幅比随耦合显著变化，并在耦合增大时从连续极限向Ising极限插值，揭示格点效应与局域相互作用之间的非平凡耦合。\n3. 这要求重新建立有限耦合下各向异性效应的理论描述，并提示在原型格点场论中不能将临界振幅比视为与相互作用无关的普适常数。", "summary_source": "deepseek", "authors": [{"name": "Leonie Müller"}, {"name": "Stefan Wessel"}], "featured_authors": [{"name": "Leonie Müller"}, {"name": "Stefan Wessel"}], "author_count": 2}, {"id": "2610.35109", "category": "cond-mat", "title": "Nonlocal Einstein Relation in Confined Phonon Hydrodynamics", "abstract": "Einstein relations connect carrier mobility to macroscopic transport coefficients and constitute a fundamental link between microscopic dynamics and transport. In phonon hydrodynamics, this connection is conventionally local: the drift-induced thermal conductivity is proportional to the local drift mobility. Here we show that this relation becomes intrinsically nonlocal under spatial confinement. We derive a nonlocal Einstein relation, $\\kappa_H(y) = \\int P(y-y')\\mu(y'),dy'$, in which hydrodynamic thermal conductivity $\\kappa_H(y)$ at one position depends on collective drift mobility $\\mu(y')$ across the entire cross-section of the channel. In the small-Knudsen-number limit, our nonlocal theory recovers the viscous heat equation and the local Einstein relation. At finite Knudsen number, nonlocality produces intrinsic boundary slip and distinct size-scaling behavior of the drift mobility $\\mu$ and hydrodynamic thermal conductivity $\\kappa_H(y)$. First-principles calculations for graphite show that nonlocality broadens the channel-size window over which thermal conductivity exhibits superlinear size dependence. Temperature-dependent simulations further show that the nonlocal theory captures the emergence of a hydrodynamic peak in thermal conductivity normalized by ballistic conductance, whereas the local theory fails to accurately predict its magnitude. Our results establish a microscopic connection between collective phonon mobility and heat conduction beyond local hydrodynamics.", "url": "https://arxiv.org/abs/2610.35109", "type": "理论+数值", "summary": "1. 该工作在受限声子流体动力学中推导了非局域爱因斯坦关系，把通道内任一点的热导率表示为集体漂移迁移率沿整个截面的积分。\n2. 其关键在于有限克努森数下非局域性产生本征边界滑移，并使漂移迁移率与流体热导率呈现不同尺寸标度；石墨第一性原理计算显示该理论拓宽超线性尺寸依赖窗口，并比局域理论更准确捕捉归一化热导率的流体动力学峰。\n3. 这为超越局域流体动力学的集体声子迁移率与热传导建立了微观联系，并提示受限声子输运分析需纳入非局域核和边界滑移。", "summary_source": "deepseek", "authors": [{"name": "Guanda Quan"}, {"name": "Ronggui Yang"}, {"name": "Xin Qian"}], "featured_authors": [{"name": "Guanda Quan"}, {"name": "Ronggui Yang"}, {"name": "Xin Qian"}], "author_count": 3}, {"id": "2610.35238", "category": "cond-mat", "title": "Flexural Altermagnetism", "abstract": "We establish flexural deformation as a versatile route for engineering altermagnetism in two-dimensional collinear antiferromagnets. By tailoring the flexure, we selectively break different symmetries to realize altermagnetic states with distinct wave symmetries and reverse their spin splitting. A tight-binding model and first-principles calculations for monolayer MnPS3 demonstrate d- and i-wave states and a switchable transverse spin current in the d-wave state.", "url": "https://arxiv.org/abs/2610.35238", "type": "理论+数值", "summary": "1. 该工作提出以弯曲形变作为在二维共线反铁磁体中工程化交错磁性的通用途径，并通过裁剪弯曲选择性地破缺不同对称性。\n2. 其核心卖点在于结合紧束缚模型与单层MnPS3第一性原理计算，实现具有不同波对称性的d波和i波交错磁态，并可反转自旋劈裂。\n3. 该机制为利用弯曲应变对称性选择性地调控交错磁序与横向自旋流提供了可切换的设计思路，并启发后续应变工程研究。", "summary_source": "deepseek", "authors": [{"name": "Songbo Li"}, {"name": "Jinxiong Jia"}, {"name": "Zeyu Li"}, {"name": "Xudong Zhu"}, {"name": "Jiaqi An"}, {"name": "Feitong Chu"}, {"name": "Songbo Zhang"}, {"name": "Wenguang Zhu"}, {"name": "Hualing Zeng"}, {"name": "Zhenhua Qiao"}], "featured_authors": [{"name": "Songbo Li"}, {"name": "Jinxiong Jia"}, {"name": "Zeyu Li"}, {"name": "Wenguang Zhu"}, {"name": "Hualing Zeng"}, {"name": "Zhenhua Qiao"}], "author_count": 10}, {"id": "2610.35270", "category": "cond-mat", "title": "Synchronization-controlled transport near an absorbing transition: Effective Enskog kinetic theory of a driven granular monolayer", "abstract": "Synchronization with vibrating boundaries can qualitatively alter the dynamics of confined granular fluids and control the collision-induced transfer of energy to horizontal motion. We develop an Enskog kinetic theory for the active phase of a driven granular monolayer within the framework of the $\\Delta$-model, which accounts for the transfer of energy from the vertical to the horizontal degrees of freedom of grains. Synchronization effects are incorporated through a state-dependent effective collision rule governed by the interplay between the local collision frequency and a characteristic synchronization time. A viscous drag force is also included to account for energy dissipation arising from interactions with the confining plates. Within this framework, we characterize the homogeneous active state and use it as the reference state for a Chapman--Enskog expansion. The solution of the Enskog equation to Navier--Stokes order then yields explicit expressions for the shear and bulk viscosities, the thermal conductivity, the diffusive heat coefficient, and the first-order contribution to the cooling rate, consistently accounting for inelasticity, damping, finite-density effects, and synchronization. Event-driven molecular-dynamics simulations show that the theory accurately describes the steady temperature and shear and bulk viscosities over a broad region of the active phase. Close to the discontinuous synchronization-controlled absorbing transition, deviations are mainly attributed to the mean-field coarse-graining of the microscopic synchronization dynamics: fluctuations of the collision-dependent injection amplitude and correlations between synchronization and pre-collisional velocities become increasingly important. These results provide a kinetic description of synchronization-controlled transport and delineate its range of validity near the absorbing transition.", "url": "https://arxiv.org/abs/2610.35270", "type": "理论+数值", "summary": "1. 该工作在Δ模型框架下建立包含同步效应的Enskog动理学理论，描述受振动边界驱动的颗粒单层活性相及其输运。\n2. 其要点是把同步编码为依赖状态的等效碰撞规则，由局部碰撞频率与特征同步时间竞争决定，并计入黏性阻力，经Chapman–Enskog展开至Navier–Stokes阶得到剪切与体积黏度、热导率、扩散热系数及一阶冷却率的显式表达式，同时涵盖非弹性、阻尼、有限密度与同步。\n3. 事件驱动模拟在较宽活性相区验证稳态温度与黏度，而靠近不连续同步控制吸收转变的偏差主要归因于平均场粗粒化，提示注入幅度涨落及同步与碰撞前速度关联在该区域变得重要。", "summary_source": "deepseek", "authors": [{"name": "David González Méndez"}, {"name": "Rubén Gómez González"}, {"name": "Raphaël Maire"}, {"name": "Vicente Garzó"}, {"name": "Ignacio Pagonabarraga"}], "featured_authors": [{"name": "David González Méndez"}, {"name": "Rubén Gómez González"}, {"name": "Raphaël Maire"}, {"name": "Vicente Garzó"}, {"name": "Ignacio Pagonabarraga"}], "author_count": 5}, {"id": "2610.35324", "category": "cond-mat", "title": "Anomalous Mobility Enhancement in Restricted Geometries", "abstract": "We investigate the effect of geometrical confinement on driven transport in anomalous media within the framework of the quenched trap model. The particle performs a biased random walk on a lattice, where quenched disorder introduces power-law distributed trapping times. We consider channels that are infinite along one direction and have a finite cross-section in the remaining $d-1$ directions. In the glassy regime, where $\\alpha=T/T_g<1$, we derive an analytical expression for the mean longitudinal displacement in the long-time and weak-force limits. We find the scaling $\\langle x_\\parallel(t)\\rangle \\propto F_\\parallel^\\alpha t^\\alpha \\Omega^{-(1-\\alpha)}$, where $F_\\parallel>0$ is the effective longitudinal force and $\\Omega$ is the number of sites in a transverse cross-section. Thus, the anomalous mobility is enhanced for narrower channels. Our analytical result applies to general Bravais lattices in $d$ dimensions with periodic transverse boundary conditions. Numerical simulations confirm the analytical predictions for different lattice geometries and show quantitative agreement even for channels with reflecting boundary conditions.", "url": "https://arxiv.org/abs/2610.35324", "type": "理论+数值", "summary": "1. 该文在淬火陷阱模型框架下研究受限几何中的驱动输运，推导玻璃态α<1时有限截面通道内平均纵向位移的解析表达式。\n2. 核心结果为⟨x∥(t)⟩∝F∥^α t^α Ω^{-(1−α)}，表明横向截面位点数Ω越小、通道越窄，反常迁移率增强越显著，且适用于具周期横向边界的一般Bravais晶格。\n3. 数值模拟在不同晶格几何乃至反射边界下与解析预测定量吻合，为受限无序介质中输运的几何调控提供了可检验依据。", "summary_source": "deepseek", "authors": [{"name": "Yuval Zippin"}, {"name": "Stanislav Burov"}], "featured_authors": [{"name": "Yuval Zippin"}, {"name": "Stanislav Burov"}], "author_count": 2}, {"id": "2610.35360", "category": "cond-mat", "title": "Simultaneous suppression and temperature-driven crossover of particle-like and wave-like thermal transport in trigonal CsAg$_3$S$_2$", "abstract": "The simultaneous suppression of particle-like ($\\kappa_p$ ) and wave-like ($\\kappa_c$) thermal transport channels in crystalline materials remains a challenging problem, as reducing one channel can enhance the other. Here, we investigate the thermal transport in trigonal $P\\Bar{3}m1$ CsAg$_3$S$_2$ using self-consistent phonon theory with cubic and quartic anharmonicity and the unified theory of thermal transport. Our calculations predict an ultralow lattice thermal conductivity of 0.222 W m$^{-1}$ K$^{-1}$ at 300 K, featuring simultaneously low $\\kappa_p$ and $\\kappa_c$ with a weak temperature dependence of $\\sim$T$^{-0.42}$, which deviates significantly from the conventional $\\sim$T$^{-1}$ behavior. This simultaneous suppression arises from localized Cs modes, which enhance anharmonic scattering, and the softer Ag-S framework, which reduces phonon group velocities, together suppressing $\\kappa_p$, in conjunction with sparse, well-separated high-frequency S-derived optical modes that suppress $\\kappa_c$ by limiting the coherent coupling between the phonon modes. Furthermore, the dominant transport channel exhibits a temperature-dependent crossover, with $\\kappa_p$ contributing $\\sim$74 \\% of total lattice thermal conductivity at 300~K and $\\kappa_c$ contributing $\\sim$63 \\% at 700~K. Combining the ultralow thermal conductivity with electrical transport calculated within the momentum relaxation time approximation (MRTA), we obtain a $ZT$ of 1.28 for $n$-type doping at 700 K. The present work not only clarifies the microscopic mechanism of ultralow thermal conductivity in trigonal CsAg$_3$S$_2$ but also identifies the covalent M-Ch framework modification within the AM$_3$Ch$_2$ family of ternary chalcogenides as an additional tuning parameter for further reducing $\\kappa_p$ within the bonding-hierarchy design principle.", "url": "https://arxiv.org/abs/2610.35360", "type": "理论+数值", "summary": "1. 该工作用含三、四阶非谐性的自洽声子理论与统一热输运理论，计算三方CsAg3S2的晶格热导率，预测300 K下0.222 W m−1 K−1的超低值及粒子型与波型通道同时受抑。\n2. 卖点是局域Cs模增强非谐散射、软Ag-S骨架降低群速度以压低κp，稀疏分离的高频S衍生光学模限制相干耦合以压低κc，使总热导率呈约T−0.42弱依赖并在300–700 K出现κp至κc主导的交叉。\n3. 这阐明了超低热导率的微观机制，并指出AM3Ch2族中M-Ch共价骨架修饰可作为键合层级设计下进一步降低κp的调控参量，且n型700 K下ZT可达1.28。", "summary_source": "deepseek", "authors": [{"name": "Vivek Gusain"}, {"name": "B K Mani"}], "featured_authors": [{"name": "Vivek Gusain"}, {"name": "B K Mani"}], "author_count": 2}, {"id": "2610.35380", "category": "cond-mat", "title": "Rigid Particle-Induced Anomalous Softening in Elastomer Composites", "abstract": "Particle-filled soft composites generally stiffen as particle loading increases, imposing a trade-off between functionality and compliance. Here, we show that this trade-off can be overcome by designing particles to actively direct gelation rather than act as passive fillers. In a sol-rich elastomer matrix, sol-phase kinetics redirect network formation towards particle-mediated assembly, yielding anomalous softening despite increasing particle content. This response is governed by topological reconfiguration of the load-bearing network during gelation rather than by filler loading alone. A structure-based model captures the composition-dependent onset of this behaviour, and the same response is reproduced across distinct particle systems. The resulting materials combine functionality with softness, energy dissipation, and recoverability under large deformation. These findings establish topology-guided gelation as a general strategy for engineering compliant functional composites for soft robotic actuation, conformal interfaces, and other systems that require both deformability and embedded material functionality.", "url": "https://arxiv.org/abs/2610.35380", "type": "理论", "summary": "1. 该工作通过在富溶胶弹性体基体中设计颗粒主动引导凝胶化而非作为被动填料，在颗粒含量增加时实现异常软化并打破刚度—功能权衡。\n2. 其核心在于溶胶相动力学将网络形成重定向至颗粒介导组装，软化由凝胶化过程中承载网络的拓扑重构而非填料含量主导，结构模型可描述组成依赖的起始行为并在不同颗粒体系中复现。\n3. 该结果将拓扑引导凝胶化确立为兼顾可变形性、功能性与大变形下耗能可恢复性的通用设计策略，并启发软体驱动与共形界面等应用。", "summary_source": "deepseek", "authors": [{"name": "Yonghyun Cho"}, {"name": "Hyeongho Min"}, {"name": "Hongdeok Kim"}, {"name": "Dongeun Lee"}, {"name": "Minjune Kim"}, {"name": "Siyeon Jang"}, {"name": "Ali Amini"}, {"name": "Zitang Wei"}, {"name": "Hosub Lim"}, {"name": "Hwan-ho Cho"}, {"name": "Bo-yong Park"}, {"name": "Sang Won Lee"}, {"name": "Joonmyung Choi"}, {"name": "Metin Sitti"}, {"name": "Sangyul Baik"}], "featured_authors": [{"name": "Yonghyun Cho"}, {"name": "Hyeongho Min"}, {"name": "Hongdeok Kim"}, {"name": "Joonmyung Choi"}, {"name": "Metin Sitti"}, {"name": "Sangyul Baik"}], "author_count": 15}, {"id": "2610.35381", "category": "cond-mat", "title": "Momentum-resolved thermodynamics and barrier-free order-parameter collapse in spin-orbit-coupled superconductors under a Zeeman field", "abstract": "Spin-orbit coupling (SOC) can enhance the critical Zeeman field of clean superconductors beyond the Pauli limit. We develop a momentum decomposition of the zero-temperature free energy to investigate spin-singlet $s$-wave superconductors with general time-reversal-symmetric SOC. The SOC component perpendicular to the Zeeman field enhances the critical field and suppresses first-order features, whereas the parallel component favors Pauli-limited thermodynamic behavior. Applying this framework to Rashba superconductors and Ising superconductors with weak Rashba SOC, we identify the origin of the abrupt collapse of the superconducting order parameter at the critical field. Competing angular contributions produce a nearly flat free-energy landscape, allowing a barrier-free order-parameter collapse distinct from the conventional Pauli-limited first-order transition.", "url": "https://arxiv.org/abs/2610.35381", "type": "理论+数值", "summary": "1. 该工作通过将零温自由能按动量分解，研究具有一般时间反演对称自旋轨道耦合的自旋单态各向同性超导体在塞曼场下的临界行为与序参量演化。\n2. 其物理核心是区分自旋轨道耦合垂直于和平行于塞曼场的分量：前者提高临界场并抑制一阶特征，后者倾向泡利极限行为，并据此在拉什巴型及弱拉什巴耦合伊辛超导体中揭示角向贡献竞争造成近平坦自由能景观和无势垒序参量塌缩。\n3. 这为理解自旋轨道耦合超导体超越泡利极限的临界场增强以及区别于常规一阶相变的序参量塌缩提供了动量分辨的热力学图像，并可启发相关材料筛选与实验判别。", "summary_source": "deepseek", "authors": [{"name": "Xusheng Wang"}, {"name": "Gaomin Tang"}, {"name": "Lianyi He"}, {"name": "Shuai-Hua Ji"}], "featured_authors": [{"name": "Xusheng Wang"}, {"name": "Gaomin Tang"}, {"name": "Lianyi He"}, {"name": "Shuai-Hua Ji"}], "author_count": 4}, {"id": "2610.35401", "category": "cond-mat", "title": "Zeeman-field-induced three-spin interactions and relativistic coupling to the scalar spin chirality", "abstract": "Magnetic fields are commonly incorporated in atomistic spin models through the Zeeman energy of individual magnetic moments. Starting from a microscopic electronic Hamiltonian, we show that the Zeeman coupling of conduction electrons also generates field-linear three-spin interactions, the lowest-order corrections allowed by time-reversal symmetry. Using a Green-function expansion of the grand potential, we identify two classes of interactions. Isotropic terms of the form $(\\mathbf S_i\\cdot\\mathbf S_j)(\\mathbf S_k\\cdot\\mathbf B)$ exist without spin-orbit coupling, and their total strength obeys a sum rule involving the three-site electronic loop at the Fermi energy. Relativistic terms require spin-orbit coupling and include $\\mathbf K_{ijk}\\cdot\\mathbf B,\\chi_{ijk}$, where $\\chi_{ijk}=\\mathbf S_i\\cdot(\\mathbf S_j\\times\\mathbf S_k)$ is the scalar spin chirality. We show that this coupling is forbidden in the spin channel without spin-orbit coupling, whereas the orbital channel recovers the orbital-flux mechanism of Mott insulators. Exact diagonalization of the Hubbard trimer confirms the independence and additivity of both channels. For magnetic trimers in Rashba electron gases, we derive analytical expressions showing that $\\mathbf K_{ijk}$ lies in-plane at first order in spin-orbit coupling but vanishes for $C_{3v}$-symmetric trimers, where an out-of-plane component emerges at second order. These interactions can shift magnetization-step fields and modify field-induced noncoplanarity. In the continuum limit, the chirality coupling splits skyrmions from antiskyrmions, while the relativistic terms generate a field-dependent Dzyaloshinskii-Moriya interaction.", "url": "https://arxiv.org/abs/2610.35401", "type": "理论+数值", "summary": "1. 该文从微观电子哈密顿量出发，以巨势的格林函数展开表明传导电子的塞曼耦合会产生场线性三自旋相互作用，并区分各向同性与相对论两类项。\n2. 其核心是：无自旋轨道耦合时各向同性项满足与费米能三格点电子环路相关的求和规则；相对论项依赖自旋轨道耦合，包含 K_{ijk}·B 与标量自旋手性 χ_{ijk} 的耦合，且自旋通道在无自旋轨道耦合时被禁戒、轨道通道恢复轨道通量机制，Hubbard三聚体精确对角化验证了两通道独立可加。\n3. 该机制可移动磁化步跃场并改变场致非共面性，在连续极限下分裂斯格明子与反斯格明子并生成场依赖的Dzyaloshinskii-Moriya相互作用，为Rashba电子气中的磁性三聚体提供可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Samir Lounis"}], "featured_authors": [{"name": "Samir Lounis"}], "author_count": 1}, {"id": "2610.35422", "category": "cond-mat", "title": "Microscopic Derivation of Stochastic Thin-Film Equation and Extensions to Two-Layer and Evaporating Films", "abstract": "While classical thin-film hydrodynamics models widely govern macroscopic fluid layers, they fail to capture the molecular-level thermal fluctuations that dictate nanoscale interfacial dynamics. Standard stochastic extensions rely on the long-wave approximation of the continuum fluctuating Navier-Stokes equations; however, this top-down paradigm lacks a formal connection to microscopic particle trajectories and cannot readily accommodate complex, non-equilibrium boundary mechanisms. We resolve this limitation by deriving the stochastic thin-film equation directly from the exact underlying N-particle Hamiltonian dynamics. This is achieved via a systematic, bottom-up coarse-graining framework based on a generalized fluctuating dynamic density-functional theory. Crucially, this first principles formulation offers unparalleled flexibility, enabling the seamless integration of multi-layered interfaces and non-conserved dynamics such as evaporation. For these complex configurations, our framework rigorously yields entirely novel stochastic thin-film equations featuring emergent noise terms that encapsulate microscopic fluctuations missing from classical top-down models.", "url": "https://arxiv.org/abs/2610.35422", "type": "理论", "summary": "1. 该工作从精确的N粒子哈密顿动力学出发，借助基于广义涨落动态密度泛函理论的自下而上粗粒化框架，直接推导出随机薄膜方程。\n2. 其核心卖点在于避开对连续涨落Navier-Stokes方程作长波近似的自上而下路径，从第一性原理出发，将多层界面与非守恒的蒸发动力学无缝纳入，并导出包含微观涨落的新颖涌现噪声项。\n3. 这为纳米尺度界面动力学的涨落建模奠定了微观基础，并启示后续可将该框架推广至其他非平衡边界机制，以及与多层薄膜实验开展定量比较。", "summary_source": "deepseek", "authors": [{"name": "Toby Kay"}, {"name": "Serafim Kalliadasis"}], "featured_authors": [{"name": "Toby Kay"}, {"name": "Serafim Kalliadasis"}], "author_count": 2}, {"id": "2610.35535", "category": "cond-mat", "title": "Multi-objective Bayesian optimization reveals HiPIMS deposition rates exceeding direct current sputtering", "abstract": "Pulsed sputter processes are essential for a wide range of applications from hard coatings to microelectronics. High power impulse magnetron sputtering (HiPIMS) offers unique possibilities for process design due to its high ionized flux fraction. Because of the high peak-current densities involved, correspondingly high plasma densities generate many ions. This enables tuning of kinetic energies by applying accelerating bias potentials. However, some HiPIMS processes have low deposition rates due to the back-attraction these ions experience with the negatively charged sputter target. Recent work in HiPIMS has targeted this problem, exploring complex pulsing schemes such as bipolar, multi-pulse, or chopped HiPIMS. These pulsing schemes introduce another problem: process complexity. As such, the process space, even with coarse intervals quickly blows up to 1E5-1E20 possible process combinations. This calls for efficient and intelligent sampling, which can be enabled by machine-learning algorithms such as Bayesian optimization. In this work we use multi-objective Bayesian optimization (MOBO) to efficiently sample the process space of pulse-packets, targeting high ionization flux fractions and deposition rates. Over 2,000 distinct processes were sampled during this exploration. Surprisingly, we found that many HiPIMS processes, including single pulse, can achieve deposition rates higher than DC references. In fact, at a working pressure of 1.0 Pa and moderate ionization rates of 5-20% we found that ms-scale pulses were ideal. We hypothesize these processes maximize gas rarefaction, creating a low-collision channel between the target and the substrate. These results showcase previously unreported behavior of pulsed sputter processes and challenge a long-held trade-off between film quality and speed in thin-film manufacturing.", "url": "https://arxiv.org/abs/2610.35535", "type": "数值", "summary": "1. 该工作将多目标贝叶斯优化用于脉冲包络HiPIMS工艺空间采样，以电离通量分数和沉积速率为目标，探索了逾2000种不同工艺。\n2. 其核心结果是发现包括单脉冲在内的多种HiPIMS工艺在1.0 Pa、5–20%电离率下可获得高于直流参考的沉积速率，并推测毫秒级脉冲通过最大化气体稀薄化形成靶—衬底低碰撞通道。\n3. 这一发现挑战了薄膜制造中质量与速度的长期权衡，为高沉积速率HiPIMS的脉冲设计提供了可验证的优化思路。", "summary_source": "deepseek", "authors": [{"name": "Nathan Rodkey"}, {"name": "Felix Thelen"}, {"name": "Alfred Ludwig"}, {"name": "Sebastian Siol"}], "featured_authors": [{"name": "Nathan Rodkey"}, {"name": "Felix Thelen"}, {"name": "Alfred Ludwig"}, {"name": "Sebastian Siol"}], "author_count": 4}, {"id": "2610.35653", "category": "cond-mat", "title": "Retention-constrained fine-tuning of a pre-trained aluminium MACE potential for non-equilibrium defect dynamics and plasticity", "abstract": "Adapting a pre-trained machine-learning interatomic potential for non-equilibrium defect dynamics and plasticity requires improving defect accuracy without degrading the near-equilibrium elastic and vibrational response. Here we achieve this balance for the aluminium MACE potential QP17 by integrating conditional readout uncertainty, iterative full-parameter updates and protocol-compatible relative-energy anchoring. Sensitivities over 144 linear readout weights guide acquisition, with within-batch covariance updates and evolving neural representations. After four active-learning rounds (32 acquired configurations and 400 gradient updates), force-uncertainty acquisition reduces mean development force error from 22.43 to 21.52 meV/Angstrom, outperforming random sampling (22.70), geometry-diversity selection (22.46) and uniform training across all 104 candidate labels (22.71) under the same update budget. All three force-uncertainty runs satisfy bulk-mechanical retention criteria: historical relative-energy error decreases from 0.375 to 0.207 meV/atom, while harmonic phonon root-mean-square drift remains below 0.05 THz. Matched objective ablations reveal that relative-energy anchoring suppresses harmonic drift. Out-of-sample evaluations across planar faults, twin boundaries and grain boundaries demonstrate transferable gains in defect energies and deviatoric stresses, even though virial stresses are never fitted. A closed-loop molecular dynamics and density functional theory (MD-DFT) pilot confirms that automated acceptance gating intercepts updates that violate historical elastic-group energy or vibrational tolerances. Together, these components establish a retention-constrained fine-tuning protocol for improving plastic-deformation observables while preserving the tested bulk mechanical response.", "url": "https://arxiv.org/abs/2610.35653", "type": "理论+数值", "summary": "1. 该工作提出并验证了铝MACE势QP17的保留约束微调协议，通过条件读出不确定度、全参数迭代更新和相对能锚定，提升非平衡缺陷动力学与塑性描述而不牺牲近平衡弹性与振动响应。\n2. 其卖点是四轮主动学习仅用32个构型和400次更新，以力不确定度采集将开发集力误差从22.43降至21.52 meV/Å，并借相对能锚定把历史相对能误差从0.375降至0.207 meV/atom、声子均方根漂移压在0.05 THz以下。\n3. 层错、孪晶界和晶界离样本评估及MD-DFT闭环门控显示，该协议可在未拟合维里应力时迁移改善缺陷能与偏应力，并为塑性可观测量的保留约束微调提供可检验路径。", "summary_source": "deepseek", "authors": [{"name": "Yue Wu"}, {"name": "Yuan Tian"}, {"name": "Deng Pan"}, {"name": "Mingwei Chen"}], "featured_authors": [{"name": "Yue Wu"}, {"name": "Yuan Tian"}, {"name": "Deng Pan"}, {"name": "Mingwei Chen"}], "author_count": 4}, {"id": "2610.35667", "category": "cond-mat", "title": "Information-thermodynamic principles unveil the response of complex networks to perturbations", "abstract": "Understanding how complex networks respond to perturbations is key to uncovering their functional organization. We show that, for a maximum-entropy perturbation prior, standard diffusion cannot increase response entropy, a measure of the diversity of the system's response. To overcome this limitation, we develop a density-matrix-based information thermodynamics of perturbation responses along arbitrary dynamical trajectories. We show that this framework is grounded in an information-theoretic principle of least dissipation and introduces a generalized free energy that quantifies deviations from an instantaneous diffusive reference. We then illustrate the formalism using nonlinear complex networks, revealing regimes of enhanced response diversity that cannot be captured by standard diffusive descriptions.", "url": "https://arxiv.org/abs/2610.35667", "type": "理论", "summary": "1. 该工作针对复杂网络对扰动的响应，在最大熵扰动先验下指出标准扩散不能提高响应熵，并建立沿任意动力学轨迹的密度矩阵信息热力学框架。\n2. 其核心在于以最小耗散的信息论原理为基石，引入可量化相对瞬时扩散参考偏离的广义自由能，从而刻画非线性网络中标准扩散描述遗漏的响应多样性增强区制。\n3. 这一框架将扰动响应多样性纳入可计算的信息热力学量，为复杂网络功能组织及非线性动力学响应的后续理论与实验研究提供可检验的分析路径。", "summary_source": "deepseek", "authors": [{"name": "Andrea Filippo Beretta"}, {"name": "Manlio De Domenico"}], "featured_authors": [{"name": "Andrea Filippo Beretta"}, {"name": "Manlio De Domenico"}], "author_count": 2}, {"id": "2610.35786", "category": "cond-mat", "title": "Wrinkling dynamics of thin crystalline sheets and its dependency on topological defects", "abstract": "We investigate the wrinkling dynamics of thin crystalline sheets under uniaxial compression using a Surface Phase-Field-Crystal-Helfrich (SPFCH) model, which captures the coupling between crystalline order, out-of-plane deformations, and topological defects. In particular, the model allows us to track and characterize two distinct classes of defects, namely those forming in the underlying hexagonal crystal lattice, such as dislocations and grain boundaries, and defects in the wrinkling patterns, known as wrinklons. By resolving the evolution and interactions of these defects, we investigate how the interplay between in-plane and out-of-plane relaxation mechanisms influences wrinkling onset and the coarsening regime. Our results indicate that crystalline defects do not affect coarsening scaling, but they quantitatively affect the onset of wrinkling and the emerging wrinkling wavelength, promote more irregular wrinkle patterns with a higher density of wrinklons, and modify long-timescale morphological evolution.", "url": "https://arxiv.org/abs/2610.35786", "type": "理论", "summary": "1. 该工作采用表面相场晶体-Helfrich模型研究薄晶体片在单轴压缩下的起皱动力学，并追踪晶格位错/晶界与起皱缺陷（wrinklons）的演化及相互作用。\n2. 其技术核心是在同一框架中耦合面内晶体序、面外形变与拓扑缺陷，从而区分面内与面外弛豫机制对起皱起始及粗化阶段的竞争影响。\n3. 结果表明晶体缺陷不改变粗化标度，却定量影响起皱阈值与波长、提高wrinklon密度并加剧图案不规则性，且改变长时间形貌演化；这提示缺陷工程可调控薄片起皱路径。", "summary_source": "deepseek", "authors": [{"name": "Emma Radice"}, {"name": "Ingo Nitschke"}, {"name": "Marco Salvalaglio"}, {"name": "Axel Voigt"}], "featured_authors": [{"name": "Emma Radice"}, {"name": "Ingo Nitschke"}, {"name": "Marco Salvalaglio"}, {"name": "Axel Voigt"}], "author_count": 4}, {"id": "2610.35855", "category": "cond-mat", "title": "Collinear and Coplanar Altermagnetism in a Penrose Quasicrystal", "abstract": "We generalize the previous group-theory based classification of collinear magnetism in the quasicrystal (QC) to general magnetic states. Taking the Penrose lattice as an example, we find that all magnetic states belonging to 2D irreducible representations (IRRPs) of the $D_5$ point group, including collinear states and coplanar ones, correspond to altermagnetism (AM). Unlike conventional collinear AM wherein zero magnetism is protected by, e.g. rotation or mirror reflection, which globally flip the spin in the magnetic pattern, the zero magnetism in these 2D-IRRP states is instead protected by a special group-theory-orthogonality theorem that basis functions belonging to different IRRPs are always mutually orthogonal. Taking the single-orbital Penrose-Hubbard as an example, our linear-response theory based calculations show that the largest portion of the parameter space is occupied by these 2D-IRRP states, and our further Ginzburg-Landau theory based analysis reveals that the polarization directions of the two basis magnetic states in the 2D IRRPs can be either parallel or perpendicular, leading to collinear or coplanar magnetic states. The special group-theory-orthogonality compensation mechanism and the absence of the PT symmetry finally leads to AM states, which are to be verified by the spin split in the spin-dependent angle-resolved-photoemission-spectrum and the spin conductance. These intriguing collinear and coplanar AM can also emerge in other QCs.", "url": "https://arxiv.org/abs/2610.35855", "type": "理论+数值", "summary": "1. 该工作将此前基于群论的准晶共线磁序分类推广到一般磁态，并以Penrose晶格为例指出属于D5点群二维不可约表示的所有磁态（含共线与共面态）均对应交错磁。\n2. 其核心卖点是这些二维不可约表示态的无净磁矩不再由整体自旋翻转的旋转或镜面保护，而由不同不可约表示基函数相互正交的群论正交定理保护；结合Ginzburg-Landau分析，两个基态极化方向可平行或垂直，从而给出共线或共面交错磁，Penrose-Hubbard线性响应计算还表明这类态占据最大参数空间。\n3. 这一机制及PT对称性缺失所导致的交错磁可由自旋分辨角分辨光电子能谱的自旋劈裂和自旋电导检验，并提示类似共线与共面交错磁可在其他准晶中涌现。", "summary_source": "deepseek", "authors": [{"name": "Bai-He Yao"}, {"name": "Zhi-Yan Shao"}, {"name": "Ye Cao"}, {"name": "Fan Yang"}], "featured_authors": [{"name": "Bai-He Yao"}, {"name": "Zhi-Yan Shao"}, {"name": "Ye Cao"}, {"name": "Fan Yang"}], "author_count": 4}, {"id": "2610.33151", "category": "hep-th", "title": "One ring to rule them all: syzygy maximization for Argyres-Douglas", "abstract": "We propose a uniform construction of affine schemes encoding the Higgs branches and Macdonald indices of the Argyres--Douglas theories $\\mathcal{D}_p(ADE)$, with $\\gcd(p,h^\\vee)=1$. The construction captures conjectural OPE decoupling relations via the Jacobian ring of a single invariant polynomial potential, obtained from a polynomial twisted period of the corresponding Coxeter orbit space. We show that these potentials are ``syzygy-maximizing'' in the first jet schemes and recover the Higgs branches as their reduced critical loci. We obtain closed determinant expressions for the classical types and explicit potentials for $E_6$, $E_7$, and $E_8$. Powers of the nilradical define an intrinsic filtration on the resulting Jacobian rings, from which we compute candidate Macdonald indices with the correct Schur and Hall--Littlewood limits, in the examples studied. Restricting the potentials to Slodowy slices extends the prescription to nilpotently Higgsed theories. We further conjecture that these Jacobian rings are isomorphic to Zhu's $C_2$-algebras of simple affine VOAs at boundary admissible levels and their quantum Drinfeld--Sokolov reductions.", "url": "https://arxiv.org/abs/2610.33151", "type": "理论", "summary": "1. 该文对 gcd(p,h∨)=1 的 D_p(ADE) Argyres–Douglas 理论，提出用单一不变多项式势的 Jacobian 环统一构造编码 Higgs 分支与 Macdonald 指标的仿射概形。\n2. 卖点是“syzygy 最大化”势：其约化临界簇还原 Higgs 分支，幂零根幂次给出 Jacobian 环内禀滤过以计算候选 Macdonald 指标。\n3. 该构造可限制到 Slodowy 切片以覆盖幂零 Higgsing，并猜测 Jacobian 环同构于边界可容许能级简单仿射 VOA 的 Zhu C2 代数及其量子 Drinfeld–Sokolov 约化。", "summary_source": "deepseek", "authors": [{"name": "Monica Jinwoo Kang"}, {"name": "Craig Lawrie"}, {"name": "Jaewon Song"}], "featured_authors": [{"name": "Monica Jinwoo Kang"}, {"name": "Craig Lawrie"}, {"name": "Jaewon Song"}], "author_count": 3}, {"id": "2610.33165", "category": "hep-th", "title": "Construction of holomorphic SCFTs with minimal index", "abstract": "It has been an open question whether there exist holomorphic VOAs with N=1 supersymmetry and Witten index 1 for any positive central charge c. The existence of such a theory with c=288 is closely related to the 576-periodicity of the TMF spectrum via the Segal-Stolz-Teichner conjecture. Here we report the construction of thousands of such theories by extending the approach initiated by Gaiotto and Johnson-Freyd via ternary codes. In addition, for every positive integer k, we also construct holomorphic N=1 VOAs of central charge c=12k with index 24/gcd(24,k) -- conjectured to be the minimum -- in a computer-aided search carried out by AI coding agents. We overcome the exponential-time barrier by using chains of smaller cells to build ternary codes, whose indices can then be evaluated via a transfer-matrix technique, and we use a symmetric orbifold construction to reduce the problem of k=12 and 24 to that of k=6. Along the way, we also establish several results on ternary codes and their indices. Using an observation relating codes and Landau-Ginzburg orbifold models, we argue that the non-chiral doubles of the ternary code VOAs can always be gapped supersymmetrically.", "url": "https://arxiv.org/abs/2610.33165", "type": "理论", "summary": "1. 该工作通过扩展Gaiotto–Johnson-Freyd的三元码方法，构造了成千上万个Witten指数为1的全纯N=1超共形场论/VOA，并对每个正整数k给出中心荷c=12k、指数为猜想的极小值24/gcd(24,k)的全纯N=1 VOA。\n2. 其技术卖点是用小胞腔链构建三元码并以转移矩阵技术计算指数，从而突破指数时间壁垒，还用对称orbifold构造把k=12和24约化到k=6，并由AI编码代理辅助搜索。\n3. 结合三元码与Landau–Ginzburg轨道模型的对应，作者论证这些VOA的非手征双重理论总可保持超对称地打开能隙，为最小指数猜想及TMF周期性相关问题提供构造性线索。", "summary_source": "deepseek", "authors": [{"name": "Du Pei"}], "featured_authors": [{"name": "Du Pei"}], "author_count": 1}, {"id": "2610.33179", "category": "hep-th", "title": "The Free Scalar as a Thermal Envelope for Three-Dimensional CFTs", "abstract": "We conjecture that every unitary three-dimensional conformal field theory obeys $c_S/C_T\\leq16\\pi\\zeta(3)$, where $s=c_ST^2$ is the thermal entropy density and $C_T$ the stress-tensor two-point coefficient, with equality for free scalars. We embed this in a stronger conjecture: on $S^1\\times H^2$, the $C_T$-normalized hyperbolic heat capacity is bounded above by that of the free scalar for all $T\\geq(2\\pi R)^{-1}$. Near the conformal temperature, for theories smooth from the high-temperature side and without boundary terms in the modular Hamiltonian, the heat-capacity bound follows from conformal-collider positivity. We test the conjectures in free, interacting large-$N$, and holographic theories. Monte Carlo data for the three-dimensional Ising and $O(N)$ models also obey the flat-space bound.", "url": "https://arxiv.org/abs/2610.33179", "type": "理论", "summary": "1. 该文提出并检验一个猜想：所有幺正三维共形场论满足 c_S/C_T≤16πζ(3)，自由标量取等号，并推广为 S^1×H^2 上按 C_T 归一化的双曲热容在 T≥(2πR)^{-1} 时以自由标量为上界。\n2. 其核心卖点是把近共形温度的热容上界与共形碰撞子正定性相连，在高温侧光滑且模哈密顿量无边界项时给出推导，并用自由场、大 N、全息及三维 Ising/O(N) 蒙特卡罗数据检验。\n3. 这为三维共形场论热力学提供普适的自由标量基准，并启示从模哈密顿量与共形碰撞子正定性证明或推广该热包络。", "summary_source": "deepseek", "authors": [{"name": "Christopher P. Herzog"}, {"name": "Andreas Stergiou"}], "featured_authors": [{"name": "Christopher P. Herzog"}, {"name": "Andreas Stergiou"}], "author_count": 2}, {"id": "2610.33236", "category": "hep-th", "title": "Spin-Induced Coordinate Noncommutativity of the Covariant Centroid", "abstract": "The Tulczyjew-Dixon centroid of a massive spinning particle, built as a composite of canonical Poincaré variables, carries the exact coordinate algebra $\\{X^\\mu,X^\\nu\\}=-S^{\\mu\\nu}/p^2$, whose noncommutativity bivector is the transverse spin tensor of the particle itself rather than an external background. That bracket and its Compton-scale magnitude are already known, and we recover them here as the starting point of the analysis, not as a result. What the composite realization settles is the domain on which the algebra may be used. Closure of the Jacobi identity requires $p^{-2}$ to remain operator valued, and the exactness domain is the convex timelike interior $\\Omega_\\mu$, on which states supported on a single mass shell are distributional. We show that freezing $p^2$ to its shell value inside the centroid leaves every two-operator commutator unchanged on shell, so that the projected position dictionary, the Berry cancellation and the endpoint transversality identity are untouched, while the same substitution fails from three insertions onward, with residue the truncated Jacobiator $2\\epsilon^{\\mu\\nu\\rho\\sigma}W_\\sigma/(p^2)^2$. This two-versus-three criterion replaces the qualitative restriction to shell-preserving matrix elements and states which constructions built on a fixed-shell bivector $\\Theta_m$ remain valid. We then follow the algebra through positive-energy projection, packet-conditioned Moyal fibers, Compton routing holonomy and projected nonassociative products, recording for each layer whether it falls on the safe side of the criterion. No prediction beyond QED follows. In the geometric branch the physical amplitude reduces to the QED amplitude, and the transverse matching coefficients remain uncomputed.", "url": "https://arxiv.org/abs/2610.33236", "type": "理论", "summary": "1. 该文以正则Poincaré变量复合实现Tulczyjew-Dixon质心，系统界定自旋诱导坐标非对易代数的可用域，并检验固定壳层双矢量的相关构造。\n2. 核心卖点是证明Jacobi闭包要求p^{-2}保持算符值、精确域为凸类时内部，且冻结p^2于壳层仅保持双算符对易子不变，三插入起失效并留下截断Jaco余项，由此给出二对三判据。\n3. 该判据可用于判定正能投影、Moyal纤维、Compton路由和投影非结合积等层面的构造安全性，但不产生超出QED的预言，几何分支振幅仍归于QED且横向匹配系数未计算。", "summary_source": "deepseek", "authors": [{"name": "Daniel Guimaraes Tedesco"}, {"name": "Luiz Paulo Colatto"}], "featured_authors": [{"name": "Daniel Guimaraes Tedesco"}, {"name": "Luiz Paulo Colatto"}], "author_count": 2}, {"id": "2610.33693", "category": "hep-th", "title": "Berends-Giele currents for higher derivative gauge theories", "abstract": "We derive Berends-Giele (BG) currents for higher derivative scalar QED (HDQED) and Yang-Mills (HDYM). In HDQED, we first compute the propagators and the vertices from the higher derivative Lagrangian and discuss the pole structures of the photon and the scalar. We then compute the BG currents using the Feynman diagram setup and prove the Ward identities for these currents at two and three points. Next, we used the perturbiner formalism to re-compute these currents and show that they are consistent with the Feynman diagram approach. In a similar fashion, we derive the BG currents in higher derivative Yang-Mills and find that remarkably, these currents are equal to pure Yang-Mills currents when all external on-shell legs are massless gluons. We prove this in all generality using the BG recursion and explicitly show this at lower points. However, the genuine higher derivative structure enters when one or many on-shell states are the so called massive Merlin modes. Using the multi-particle currents, we reproduce the result that all tree level amplitudes with one Merlin particle vanishes and the three and four Merlin amplitudes match the previously computed result. The future prospects of BG recursion for higher derivative gravity and off-shell colour- kinematics duality is also discussed.", "url": "https://arxiv.org/abs/2610.33693", "type": "理论", "summary": "1. 该文推导了高阶导数标量QED与Yang-Mills理论中的Berends-Giele流，并用费曼图与perturbiner形式在低点多边形上验证其一致性。\n2. 其关键结果是证明两点与三点流的Ward恒等式，且当外腿均为无质量胶子时高阶导数Yang-Mills流与纯Yang-Mills流完全相等，而Merlin有质量模才体现真正高阶导数结构。\n3. 多粒子流复现单Merlin树幅为零及三、四Merlin幅的已知结果，并指向高阶导数引力与离壳颜色-运动学对偶的BG递推应用。", "summary_source": "deepseek", "authors": [{"name": "Pratik Chattopadhyay"}], "featured_authors": [{"name": "Pratik Chattopadhyay"}], "author_count": 1}, {"id": "2610.33874", "category": "hep-th", "title": "Fixed Points of the Yang-Mills Gradient Flow in the Vortex Sector", "abstract": "We study the Yang-Mills gradient flow of center vortices in SU(2) gauge theory. For axially symmetric vortices the flow reduces exactly to a linear diffusion equation for the radial profile: a Gaussian core keeps its shape while its width grows as $\\sqrt{R^2+4t}$, the flux is exactly conserved, and the thin vortex is the unique bounded fixed point, though not an attractor. Off-diagonal perturbations are governed by a pair of radial Schrödinger operators, and a variational computation shows that, frozen at any instant, the Abelian core has a tachyonic mode for every winding $n\\geq 1$. Since the core spreads while the mode grows, we pass to self-similar variables, where the unstable modes are known in closed form, with growth exponents $\\mu_{n,m}=n-1+m$. Multiply wound vortices are therefore unstable, while the fundamental vortex is exactly marginal and stays Abelian. A scaling argument rules out any static vortex in the transverse plane, and the instability acquires a simple geometric meaning that shortens the path traced in SU(2) by the holonomy of a growing loop, lowering the winding by two. The flow thus drives every vortex toward the Abelian core of winding $n \\bmod 2$, with non-Abelian structure appearing only as the transient through which multiply wound cores unwind.", "url": "https://arxiv.org/abs/2610.33874", "type": "理论", "summary": "1. 该工作把SU(2)规范理论中中心涡旋的Yang-Mills梯度流在轴对称情形下精确化为径向轮廓的线性扩散方程，并系统分析其固定点与稳定性。\n2. 其核心卖点是由径向薛定谔算符与自相似变量给出闭式不稳定模指数μ_{n,m}=n-1+m，证明多重缠绕涡旋不稳定、基涡旋恰好临界且保持阿贝尔核，并揭示不稳定性使缠绕数降低二。\n3. 这为涡旋流的终点给出几何化图像：流向缠绕数n mod 2的阿贝尔核，非阿贝尔结构仅作为多重缠绕核解绕的瞬态，并对横向平面中静态涡旋的存在性给出限制。", "summary_source": "deepseek", "authors": [{"name": "A. M. Silva"}], "featured_authors": [{"name": "A. M. Silva"}], "author_count": 1}, {"id": "2610.33887", "category": "hep-th", "title": "Exact Stress Tensor Flows in Causal Electrodynamics: Courant-Hilbert Approach", "abstract": "It has been shown that for theories whose Courant-Hilbert function depends on a single dimensionful coupling, the energy-momentum tensor is controlled by the two combinations $\\tau\\dot{\\ell}$ and $\\ell-\\tau\\dot{\\ell}$, so that the quadratic invariants $X=T_{\\mu\\nu}T^{\\mu\\nu}$ and $Y=(T^\\mu{}_\\mu)^2$ depend on a single auxiliary variable. Eliminating this variable in favour of $Y/X$ yields the exact autonomous flow $\\partial_\\lambda\\mathcal L=X\\,\\mathcal F(Y/X)$, with no explicit dependence on the coupling, the electromagnetic invariants or the CH parameter, on every branch where the map is invertible. The expansion of $\\mathcal F$ in powers of $\\sqrt{Y/X}$ shows which flows are built from integer powers of $X$ and $Y$ and which require half-integer powers. In this paper, we work out four examples in closed form, each with its analytic structure and physical interpretation: the generalized Born-Infeld theory, whose flow is quadratic in the stress tensor; the $q$-deformed family, in which the odd coefficients of the expansion vanish at $q=1/2$ and are nonzero otherwise; the no-$\\tau$-maximum theory; and the causal Russo-Townsend logarithmic theory, whose flow involves the lower real branch of the Lambert $W$ function and reproduces the known perturbative result. The singular points of $\\mathcal{F}$ are related to the critical fields, energy conditions, and strong-field behavior of each theory.", "url": "https://arxiv.org/abs/2610.33887", "type": "理论", "summary": "1. 该文在库朗-希尔伯特框架下推导因果电动力学的精确应力张量流，消去单一辅助变量后得到不显含耦合、电磁不变量和CH参数的自治方程∂λL=X F(Y/X)。\n2. 其卖点是在映射可逆分支上以X=TμνTμν与Y=(T^μ_μ)^2的比值统一描述流，并用√(Y/X)展开判别整数/半整数幂结构，闭式求解广义Born-Infeld、q形变、无τ极大和Russo-Townsend对数四例。\n3. F的奇点与临界场、能量条件及强场行为的对应，为非线性因果电动力学的应力张量演化提供了结构性判据。", "summary_source": "deepseek", "authors": [{"name": "Zahra Pezhman"}, {"name": "Komeil Babaei Velni"}, {"name": "H. Babaei-Aghbolagh"}], "featured_authors": [{"name": "Zahra Pezhman"}, {"name": "Komeil Babaei Velni"}, {"name": "H. Babaei-Aghbolagh"}], "author_count": 3}, {"id": "2610.33905", "category": "hep-th", "title": "Holographic entropy inequalities & typical states", "abstract": "As a consequence of the Ryu-Takayanagi formula, static semiclassical states in AdS quantum gravity share a set of special properties expressible as linear inequalities on their entanglement entropies. How general are these properties? Do they still hold when we move away from the regime of validity of RT, i.e. static states in classical Einstein gravity? Do they perhaps hold even for some class of non-holographic states? We will motivate these questions and review what's known about the answers.", "url": "https://arxiv.org/abs/2610.33905", "type": "理论", "summary": "1. 该文围绕Ryu-Takayanagi公式所隐含的一类纠缠熵线性不等式，梳理其普适性问题：这些性质是否仅局限于静态半经典爱因斯坦引力的RT适用区间，能否推广到更一般的量子引力态，乃至某些非全息态。\n2. 其切入点是典型态（随机态）的纠缠熵结构，用以检验这些不等式在RT近似失效区域是否仍成立，从而厘清哪些性质真正源于全息性、哪些只是经典几何的产物。\n3. 这为以量子信息判据区分全息与非全息态、并理解量子引力修正下纠缠的组织方式提供了明确的研究线索。", "summary_source": "deepseek", "authors": [{"name": "Guglielmo Grimaldi"}, {"name": "Matthew Headrick"}], "featured_authors": [{"name": "Guglielmo Grimaldi"}, {"name": "Matthew Headrick"}], "author_count": 2}, {"id": "2610.33972", "category": "hep-th", "title": "Revisiting monodromy defects in $\\text{O}(N)$ conformal field theories", "abstract": "Monodromy defects are fundamental objects in extended quantum systems with global symmetries. We study such defects in $\\text{O}(N)$ conformal field theories (CFT), which describe the universality class of $\\text{O}(N)$ spontaneous symmetry breaking transitions. In particular, we consider partial-monodromy defects, whose corresponding symmetry transformations only act on a subset of the fundamental $\\text{O}(N)$ vector field. We develop an analytical theory of the defect phases, using both renormalization group and large $N$ expansion. In general (spacetime) dimensions $3\\leq d<4$, multiple defect CFTs are identified, which are described by appropriate boundary conditions for the vector field near the defect. Near $d=3$, we show that in the large $N$ limit, a stable defect CFT always exists, characterized by the so-called (\"standard\") \"alternate\" boundary conditions for the (twisted) untwisted fields, whose defect correlations are (suppressed) enhanced. We then perform large-scale classical Monte Carlo simulations of monodromy defects in the O(3) CFT in an improved lattice model and numerically extract the defect scaling dimensions. The numerical results are in qualitative agreement with the stable defect CFT identified in the field theory.", "url": "https://arxiv.org/abs/2610.33972", "type": "理论", "summary": "1. 该工作结合重整化群、大N展开与大规模经典蒙特卡洛，重新研究了O(N)共形场论中部分单值性缺陷的缺陷相及其缺陷CFT。\n2. 其核心卖点是在3≤d<4识别出多个由矢量场在缺陷附近边界条件刻画的缺陷CFT，并在d≈3的大N极限证明稳定缺陷CFT总存在，由扭曲场采用标准、未扭曲场采用交替边界条件描述，相应缺陷关联分别被抑制与增强。\n3. 对O(3)改进格点模型的大规模模拟所提取的缺陷标度维与场论稳定缺陷CFT定性一致，为后续数值与实验检验提供了可操作基准。", "summary_source": "deepseek", "authors": [{"name": "Jiechao Feng"}, {"name": "Nayan Myerson-Jain"}, {"name": "G. Shankar"}, {"name": "Taige Wang"}, {"name": "Meng Cheng"}], "featured_authors": [{"name": "Jiechao Feng"}, {"name": "Nayan Myerson-Jain"}, {"name": "G. Shankar"}, {"name": "Taige Wang"}, {"name": "Meng Cheng"}], "author_count": 5}, {"id": "2610.34024", "category": "hep-th", "title": "Lifshitz Phase of Quantum Gravity: The Infrared Fixed Point of the (2+1)D Unimodular Hořava-Chern-Simons Model", "abstract": "We consider a nonrelativistic gravity theory in (2+1) dimensions with $w_\\infty$ gauge symmetry that we call unimodular Hořava-Chern-Simons gravity. The theory has three dimensionless couplings, one of which is the Chern-Simons level $\\kappa$. At large $|\\kappa|$, the theory flows from an asymptotically free UV fixed point to an IR fixed point with anisotropic scale invariance characterized by a dynamical critical exponent $z=2-\\tfrac32|\\kappa|^{-1}$. We speculate that unimodular Hořava-Chern-Simons gravity undergoes a phase transition from this scale-invariant phase to a confining phase when $\\kappa$ drops below a critical value.", "url": "https://arxiv.org/abs/2610.34024", "type": "理论", "summary": "1. 该工作构建并研究了(2+1)维具有 \\(w_\\infty\\) 规范对称性的幺模Hořava-Chern-Simons引力，并分析其重整化群流。\n2. 其核心结果是：在大Chern-Simons能级 \\(|\\kappa|\\) 下，理论从渐近自由UV固定点流向各向异性标度不变的IR固定点，且动力学临界指数为 \\(z=2-\\tfrac32|\\kappa|^{-1}\\)。\n3. 作者进而推测当 \\(\\kappa\\) 低于临界值时会发生向禁闭相的相变，这为低维量子引力的相图与标度行为提供了明确研究方向。", "summary_source": "deepseek", "authors": [{"name": "Maxim Zelenko"}, {"name": "Dam Thanh Son"}], "featured_authors": [{"name": "Maxim Zelenko"}, {"name": "Dam Thanh Son"}], "author_count": 2}, {"id": "2610.34240", "category": "hep-th", "title": "Perturbative Holonomy Potentials and Vacua in Chiral Supersymmetric Gauge Theories", "abstract": "We establish global control of perturbative D-term data governing semiclassical vacuum sectors in chiral supersymmetric gauge theories on $\\mathbb{R}^3\\times S^1$. A closed-form, one-loop-exact D-term coefficient, including 4d Fayet--Iliopoulos (FI) parameters, gives a uniformly controlled leading potential away from massless thresholds and fixes local FI and Chern--Simons couplings near them. This allows lifting the 3d Intriligator--Seiberg classification of semiclassical vacua to $\\mathbb{R}^3\\times S^1$ across the compact holonomy space. The framework is showcased by finding a remarkably rich set of vacuum sectors in a simple abelian model and reproducing on flat space the R-twisted reduction of an $\\mathrm{SU}(2)$ Maruyoshi--Song theory to the Gang--Yamazaki theory, first found on $S^3\\times S^1$. The examples demonstrate the stakes of global matching: true vacua may lie at nontrivial holonomy even with nonzero threshold values of the Coulomb-slice D-coefficient, and despite vanishing D-coefficient at trivial holonomy.", "url": "https://arxiv.org/abs/2610.34240", "type": "理论", "summary": "1. 该工作在 \\(\\mathbb{R}^3\\times S^1\\) 上建立手征超对称规范理论微扰 D 项数据的整体控制，并给出包含四维 FI 参数的一圈精确闭式系数。\n2. 其核心在于用统一受控的领头势将三维 Intriligator–Seiberg 半经典真空分类推广到紧致 holonomy 空间，并修正质量阈值附近的局域 FI 与 Chern–Simons 耦合。\n3. 这提示真空匹配必须考虑非平凡 holonomy：即使阈值处 Coulomb-slice D 系数非零，或在平凡 holonomy 处 D 系数为零，真实真空仍可能位于非平凡 holonomy。", "summary_source": "deepseek", "authors": [{"name": "Arash Arabi Ardehali"}], "featured_authors": [{"name": "Arash Arabi Ardehali"}], "author_count": 1}, {"id": "2610.34261", "category": "hep-th", "title": "All-plus Yang--Mills and gravity wavefunctions in de Sitter space", "abstract": "We present sewing representations for tree-level all-plus wavefunctions in four-dimensional de Sitter space. For Yang--Mills theory, the arbitrary-multiplicity formula is a sum over noncrossing polygon dissections, with each cell carrying energy differences of a full lower-point wavefunction. The absence of a generic total-energy pole is manifest, while partial-energy residues are determined by the lower-point factors. We derive this representation from self-dual Yang--Mills solutions. For Einstein gravity, we propose an arbitrary-multiplicity formula consisting of an alternating sum over labelled sewing trees plus a local gravitational Chern--Simons term. This local term arises from the self-dual Einstein action and supplies boundary data not fixed by internal-energy cuts. We derive a generating formula for it from the boundary connection and give explicit expressions through seven points.", "url": "https://arxiv.org/abs/2610.34261", "type": "理论", "summary": "1. 该工作在四维de Sitter空间中提出了树级全加号Yang-Mills与Einstein引力波函数的缝合表示。\n2. 对Yang-Mills，任意多点公式是非交叉多边形剖分之和，每个单元携带低点波函数的能量差，从而显式消除总能量极点并让分能量留数由低点因子决定；对引力，则用标记缝合树的交替和加局部引力Chern-Simons项补足内部能量切割无法固定的边界数据。\n3. 这一由自对偶解导出的递归与边界分解为dS全加号波函数的高点多点计算提供了可操作框架，并给出至七点的显式引力结果作为可检验起点。", "summary_source": "deepseek", "authors": [{"name": "Song He"}, {"name": "Jiajie Mei"}, {"name": "Yuyu Mo"}], "featured_authors": [{"name": "Song He"}, {"name": "Jiajie Mei"}, {"name": "Yuyu Mo"}], "author_count": 3}, {"id": "2610.34376", "category": "hep-th", "title": "Exact lattice bosonization of the double-scaled $c=1$ matrix model", "abstract": "In a recent paper by two of us, it has been shown that entanglement entropy (EE) of matrix quantum mechanics (or, equivalently, of a non-relativistic fermion model) has a natural interpretation in terms of an exact bosonization of the fermion theory in terms of a lattice boson with lattice spacing $\\sim 1/N$ (where $N$ is the rank of the matrix, equal to the number of fermions). The theory of this lattice boson is distinct from a latticized version of the \"collective variable'' theory which is formulated in terms of the fermion density $\\rho(\\lambda)$ (\"collective variable''); it is, in fact, more closely related to the Wigner distribution of the fermions. In this paper, we develop this connection further for the $c=1$ double scaled matrix model. Even though $N$ becomes infinite, the double scaled theory is described by a boson on a finite and non-uniform lattice spacing, of order $\\sim g_s(x) l_s$ (where $g_s(x) \\equiv g_s {\\rm cosech}^2(x/l_s)$ is a position dependent string coupling). We explicitly derive the $c=1$ EE, as well as the one and two-point functions of fermion density from the lattice boson. The results are explicitly finite, unlike the collective variable theory which is shown to yield divergent answers. Our results suggest that while local observables such as the EE and $\\langle \\rho(\\lambda) \\rangle$, are characterized by a unique short distance scale $g_s(x) l_s$, the asymptotic observables such as the S-matrix at every genus are characterized by a short distance scale $l_s$. We show how this arises and discuss a possible interpretation in terms of D0 brane physics.", "url": "https://arxiv.org/abs/2610.34376", "type": "理论", "summary": "1. 该工作进一步发展了双标度 c=1 矩阵模型中费米子与格点玻色子的精确玻色化联系，并在 N 趋于无穷时用有限非均匀格点间距的玻色子描述该理论。\n2. 其核心卖点是由该格点玻色子显式导出 c=1 纠缠熵及费米子密度的一、二点函数，结果有限，而集体变量理论给出发散。\n3. 这表明纠缠熵与密度期望值等局域量由单一短距离标度 g_s(x)l_s 刻画，而各亏格 S 矩阵等渐近量由 l_s 刻画，并为 D0 膜物理解
