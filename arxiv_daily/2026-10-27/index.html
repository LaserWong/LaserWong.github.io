，并由该范数与摩擦决定衰减常数；证明借助相空间Polchinski流将动量耗散与位置熵分解对齐，并用力缺陷控制动力学估计误差。\n3. 对二维有质量格点sine-Gordon模型在0<β<4π和小无量纲局域耦合下，该判据给出对所有有限熵初态、关于格距与体积一致的熵衰减，且当摩擦正比于质量时速率达到最优阶m。", "summary_source": "deepseek", "authors": [{"name": "Bowen Li"}, {"name": "Jianfeng Lu"}], "featured_authors": [{"name": "Bowen Li"}, {"name": "Jianfeng Lu"}], "author_count": 2}, {"id": "2610.35822", "category": "math-ph", "title": "Hidden Singularity and Fractal Dimensions for Extended Harper Operators", "abstract": "We prove that, for every irrational frequency, the spectra of the extended Harper family throughout the zero-measure regime have finite $1/2$-dimensional Hausdorff measure and lower box dimension at most $1/2$. Both numbers improve to $1/3$ on the isotropic critical boundary. The proof is based on a family of unitary transformations, that specializes to the chiral transform of [BJK] for the case of the critical almost Mathieu. This family allows to make every operator in this regime spectrally equivalent to a singular Jacobi operator. Using these singular representatives, we apply the method of [BJK] to construct covers by $O(q_n)$ intervals of total length $O(q_n^{-1})$, improving to $O(q_n^{-2})$ on the isotropic boundary, where $q_n$ is the denominator of a canonical approximant to $\\alpha$. The covers give upper box bounds and, with packing estimates, examples where the box-counting dimension fails to exist.", "url": "https://arxiv.org/abs/2610.35822", "type": "理论", "summary": "1. 该工作对任意无理频率证明扩展Harper族在零测度区间的谱具有有限的1/2维Hausdorff测度，且下盒维数不超过1/2，并在各向同性临界边界改进为1/3。\n2. 其核心技巧是引入一族酉变换，将临界几乎Mathieu情形的手征变换推广，使该区间内每个算子谱等价于奇异Jacobi算子，并用O(q_n)个区间、总长O(q_n^{-1})的覆盖给出盒维上界，在边界上总长收紧至O(q_n^{-2})。\n3. 这一谱等价与覆盖构造为准周期算子谱的细分数维研究提供了可迁移框架，并借助填充估计给出盒计数维数不存在的例子，提示后续工作需区分不同维数定义并关注奇异代表算子的适用范围。", "summary_source": "deepseek", "authors": [{"name": "Simon Becker"}, {"name": "Svetlana Jitomirskaya"}, {"name": "Igor Krasovsky"}], "featured_authors": [{"name": "Simon Becker"}, {"name": "Svetlana Jitomirskaya"}, {"name": "Igor Krasovsky"}], "author_count": 3}, {"id": "2610.35867", "category": "math-ph", "title": "Quantum dynamics on the sparse Erdős-Rényi graph", "abstract": "We analyse the large-time asymptotics of the Schrödinger time evolution of a free quantum particle on the Erdős-Rényi graph $\\mathbb{G}(N,d/N)$, where the quantum Hamiltonian is given by the adjacency matrix of $\\mathbb{G}$. Starting from a state localized at a vertex, the wave function is approximately radial, and we characterize precisely its asymptotic form. Our results in particular cover vertices whose degree is close to $2d$, hence probing the emergence of bound states from a dynamical perspective. This provides a dynamical counterpart of the coexistence of localized and delocalized states established in [ arXiv:1905.03243 , arXiv:2005.14180 , arXiv:2106.12519 , arXiv:2109.03227 , arXiv:2305.16294 ], with the former giving rise to a localized mode and the latter to a dispersive wave. Our results hold in the regime $\\sqrt{\\log N} \\ll d \\ll N^{o(1)}$, which is the full region in which such dynamical phenomena may exist, and for times $1 \\ll t \\ll T_N$ for some explicit $T_N \\gg 1$.", "url": "https://arxiv.org/abs/2610.35867", "type": "理论", "summary": "1. 该工作分析了稀疏随机图 G(N,d/N) 上以邻接矩阵为哈密顿量的自由粒子从单顶点局域初态出发的大时间薛定谔演化，并精确刻画近似径向波函数的渐近形式。\n2. 其核心在于覆盖度接近 2d 的顶点，在 √log N ≪ d ≪ N^{o(1)} 的完整参数区和 1 ≪ t ≪ T_N 的长时间窗口内，给出局域束缚模与色散波共存的动力学对应。\n3. 这为稀疏随机图上局域态与离域态共存提供了动力学判据，并启发在相关随机图平台检验长时间波包传播及束缚态形成。", "summary_source": "deepseek", "authors": [{"name": "Johannes Alt"}, {"name": "Raphael Ducatez"}, {"name": "Antti Knowles"}], "featured_authors": [{"name": "Johannes Alt"}, {"name": "Raphael Ducatez"}, {"name": "Antti Knowles"}], "author_count": 3}, {"id": "2610.33144", "category": "quant-ph", "title": "Fully quantum training of parametric circuits with Quantum Hamiltonian Descent", "abstract": "Parametric quantum circuits are usually trained by classical, local optimizers, which use the quantum computer only to evaluate the cost function, or its gradient, one point at a time. Quantum Hamiltonian Descent (QHD) takes a different route: in this quantum algorithm for continuous optimization, the parameters become the position of a quantum particle, with the cost function as its potential, and two time schedules control kinetic and potential energy so that the wavefunction explores the whole landscape and tunnels towards the global minimum. QHD, however, assumes a classically computable cost function, and its digital implementation is poorly understood: standard error bounds grow exponentially with the number of qubits per parameter, and the schedules are borrowed from classical optimization. Here we propose to train parametric circuits with QHD entirely on the quantum computer, through an online step in which the qubits encoding the parameters coherently control the circuit on a second register. We prove that, for cost functions with a smooth periodic extension, including those of parametric circuits, the simulation error admits a bound independent of the grid resolution, and that for circuits the bound grows at most linearly with the number of parameters. We also show that the ideal dynamics depends on the two schedules only through a single curve, which controls the adiabaticity of the search, and that the remaining freedom can be used to minimize the gate count. Simulations on benchmark functions and parametric circuits show that, at equal cost, schedules designed in this way markedly increase the probability of finding the global minimum.", "url": "https://arxiv.org/abs/2610.33144", "type": "理论+数值", "summary": "1. 该工作提出将参数化线路的训练完全放到量子计算机上，以量子哈密顿下降实现参数寄存器的相干演化，并通过在线步骤让参数量子比特相干控制第二寄存器的线路。\n2. 其核心在于证明对具光滑周期延拓的代价函数（含参数化线路）仿真误差界与网格分辨率无关、对线路参数数至多线性增长，且理想动力学仅由控制绝热性的单一曲线决定，余下自由度可用于压低门数。\n3. 等价开销下据此设计的调度显著提高全局最优命中率，为全量子变分训练的可扩展、误差可控实现及调度与门数协同优化提供了可验证路径。", "summary_source": "deepseek", "authors": [{"name": "Marco Burato"}, {"name": "Leonardo Banchi"}], "featured_authors": [{"name": "Marco Burato"}, {"name": "Leonardo Banchi"}], "author_count": 2}, {"id": "2610.33160", "category": "quant-ph", "title": "Genuinely multipartite entangled qudits: one rule to link them all", "abstract": "Links of rings offer an intuitive picture of multipartite entanglement. Cutting one ring can free some of the others, just as losing a particle, i.e. tracing it out, can disentangle some of the remaining ones. This analogy classifies multipartite entanglement according to which groups of particles stay entangled when others are lost, a question at the heart of robust quantum networks. However, pure states realizing a given link class were known only in special cases. Here, we close this gap. Recasting link polynomials as hypergraphs, we give an explicit formula for pure qudit states and prove that, for every link class, their entanglement under any pattern of particle loss matches the link exactly. The same construction also controls genuine multipartite entanglement, determining exactly which of the groups that stay entangled are genuinely multipartite entangled, and all of them can be made so. As a consequence, we prove the conjecture that $m$-resistant pure qudit states, which stay entangled after the loss of any $m$ particles but become fully separable after the loss of $m+1$, exist for any number of particles and any $m$.", "url": "https://arxiv.org/abs/2610.33160", "type": "理论", "summary": "1. 该工作将链环多项式重铸为超图，给出显式构造纯qudit态的方法，从而补齐任意链环类此前仅在特殊情形可实现的空缺。\n2. 其核心卖点是对任意粒子丢失模式严格证明剩余态的纠缠结构与目标链环完全一致，并能精确判定及调控其中哪些保持纠缠的粒子组具有真正多体纠缠。\n3. 由此证明：对任意粒子数与任意m，均存在丢失任意m个粒子仍纠缠、丢失m+1个即完全可分的m-抗性纯qudit态，为鲁棒量子网络提供了可构造的资源图景。", "summary_source": "deepseek", "authors": [{"name": "Gonçalo M. Quinta"}, {"name": "Rui André"}], "featured_authors": [{"name": "Gonçalo M. Quinta"}, {"name": "Rui André"}], "author_count": 2}, {"id": "2610.33185", "category": "quant-ph", "title": "Post-Quantum Perfect Zero-Knowledge Arguments for NP From Any One-Way Permutation", "abstract": "In this paper, we show for the first time that post-quantum one-way permutations are sufficient for perfect zero-knowledge classical arguments for all of NP with security guaranteed against quantum adversaries. We first establish that Naor, Ostrovsky,Venkatesen, and Yung's bit commitment scheme built from any permutation using interactive hashing, called the NOVY scheme, is sum-binding and collapse-binding against quantum polynomial-time committers provided the permutation is post-quantum one-way. We then show that the collapse-binding property of the NOVY scheme allows for Blum's perfect zero-knowledge argument for HAMCYCLE to remain so exactly as it stands against quantum adversaries.", "url": "https://arxiv.org/abs/2610.33185", "type": "理论", "summary": "1. 该工作首次证明，后量子单向置换足以构造面向NP的完美零知识经典论证，并保证对量子敌手安全。\n2. 其技术核心是证明基于任意置换与交互哈希的NOVY比特承诺在后量子单向置换下对量子多项式时间承诺者具有求和绑定与坍缩绑定，从而使Blum的HAMCYCLE完美零知识论证在量子敌手下原样成立。\n3. 这建立了后量子单向置换与NP的完美零知识论证之间的直接联系，为经典协议的后量子安全归约及坍缩绑定性质的应用提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Frédéric Dupuis"}, {"name": "Rémi Ligez"}, {"name": "Khaireddine Medhioub"}, {"name": "Louis Salvail"}, {"name": "Louis-Charles Thibodeau"}], "featured_authors": [{"name": "Frédéric Dupuis"}, {"name": "Rémi Ligez"}, {"name": "Khaireddine Medhioub"}, {"name": "Louis Salvail"}, {"name": "Louis-Charles Thibodeau"}], "author_count": 5}, {"id": "2610.33188", "category": "quant-ph", "title": "Quantum Heuristic Separation of Comb Inequalities for the Travelling Salesman Problem", "abstract": "Comb inequalities are essential cutting planes for the travelling salesman problem, yet their separation remains computationally challenging. We propose a quantum heuristic separation algorithm for this family of inequalities. The algorithm uses a procedure that prepares a uniform superposition of all combs with a fixed number of teeth using polynomially many gates and qubits. As part of this procedure, we present a circuit that coherently encodes the Hamming weight of a data register in one-hot form in an auxiliary register. The separation algorithm then searches for violated inequalities using the Grover-Mixer Quantum Alternating Operator Ansatz. Its running time is polynomial under prescribed polynomial budgets for the number of QAOA rounds, parameter optimization steps and samples gathered, although we provide no evidence that such budgets suffice to find a violated comb with constant probability when one exists. We provide an explicit circuit construction for the mixer unitary, the full problem Hamiltonian and a resource analysis.", "url": "https://arxiv.org/abs/2610.33188", "type": "理论+数值", "summary": "1. 该工作针对旅行商问题中梳不等式分离的计算困难，提出一种量子启发式分离算法，先制备固定齿数梳子的均匀叠加，再用 Grover-Mixer 量子交替算子拟设搜索被违反的不等式。\n2. 其卖点在于用多项式规模门与量子比特实现梳子叠加，并给出将数据寄存器汉明重量相干编码为 one-hot 辅助寄存器的电路，以及显式 mixer 酉算子、问题哈密顿量和资源分析。\n3. 在预设多项式 QAOA 轮数、优化步数和采样预算下算法运行时间为多项式，但作者未证明该预算能以常数概率找到存在的被违反梳子；这为梳不等式量子分离的电路化与资源评估提供了可检验起点。", "summary_source": "deepseek", "authors": [{"name": "Yohan Finet"}, {"name": "Victor Drouin-Touchette"}], "featured_authors": [{"name": "Yohan Finet"}, {"name": "Victor Drouin-Touchette"}], "author_count": 2}, {"id": "2610.33189", "category": "quant-ph", "title": "Study of localization properties under subsystem periodic driving", "abstract": "Periodic driving provides a powerful route for controlling localization and engineering effective Hamiltonians in quantum systems. A localized one-dimensional Aubry-André chain can be driven into a fully delocalized phase when the entire system is driven below a critical frequency. Here, we ask whether such delocalization can be achieved by driving only a part of the system. We address this question using a two-leg ladder comprising an Aubry-André chain coupled to a periodically driven clean tight-binding chain. Exact numerical calculations show that, starting from a localized static ladder, subsystem driving below a critical frequency cannot achieve complete delocalization. Instead, a mixed phase emerges, with localized and delocalized states coexisting and the fraction of delocalized states varying nonmonotonically with the driving frequency. This behavior can be understood using local effective Hamiltonians. Although these effective Hamiltonians are derived analytically in the high-frequency regime, they can nevertheless predict the localization transition occurring in the moderate-frequency regime. In fact, by quantifying the emergent nonlocality of the Floquet Hamiltonian, we show that these effective Hamiltonians provide a valid description up to a crossover frequency that is lower than the critical frequency associated with the localization transition. Our results demonstrate an alternative route to Floquet engineering, in which the transport properties of a quantum lattice system can be modified by driving only a subsystem.", "url": "https://arxiv.org/abs/2610.33189", "type": "理论+数值", "summary": "1. 该工作以两腿梯子模型研究仅对子系统施加周期驱动时一维Aubry-André链的局域化性质，并用精确数值计算考察驱动频率对局域—离域转变的影响。\n2. 其核心卖点是发现子系统驱动低于临界频率不能实现完全退局域化，而形成局域态与离域态共存且离域比例随频率非单调变化的混合相，并可由局域有效哈密顿量解释。\n3. 通过量化Floquet哈密顿量的非局域性，作者表明高频解析有效模型可外推至低于局域转变临界频率的交叉频率，这为仅驱动子系统调控量子晶格输运的Floquet工程提供了替代路径。", "summary_source": "deepseek", "authors": [{"name": "Arpita Goswami"}, {"name": "Ranjan Modak"}, {"name": "Shaon Sahoo"}], "featured_authors": [{"name": "Arpita Goswami"}, {"name": "Ranjan Modak"}, {"name": "Shaon Sahoo"}], "author_count": 3}, {"id": "2610.33207", "category": "quant-ph", "title": "A New Non-Affine Family in the Karlsson-Szollosi Intersection", "abstract": "We show that $K_6^{(2)} \\cap X_6^{(2)} = D_6^{(1)} \\cup C_6^{(1)}$ up to standard Hadamard equivalence, where $C_6^{(1)}$ is a new non-affine one-parameter family of complex Hadamard matrices. This demonstrates that the intersection of the two-parameter Hadamard families of Karlsson and Szöllősi is strictly larger than the known affine Diţă curve $D_6^{(1)}$. Our new parametrisation of the Szöllősi family $X_6^{(2)}$ in Karlsson coordinates and our constructive classification of the Karlsson-Szöllősi intersection shed light on the intersection of block-reducible forms and hypocycloid constraints. This may support the search for mutually unbiased bases in six dimensions.", "url": "https://arxiv.org/abs/2610.33207", "type": "理论", "summary": "1. 该工作证明了在标准Hadamard等价意义下，Karlsson与Szöllősi两个二参数复Hadamard族在六维的交集为D_6^(1)∪C_6^(1)，其中C_6^(1)是新的非仿射单参数复Hadamard矩阵族。\n2. 其核心卖点是通过在Karlsson坐标中重新参数化Szöllősi族X_6^(2)并构造性分类该交集，表明交集严格大于已知仿射Diţă曲线D_6^(1)，并揭示块可约形式与内摆线约束的相互作用。\n3. 这一结果为六维互无偏基的搜索提供了新的复Hadamard结构入口，并可能启发对块可约形式与内摆线约束交集的后续研究。", "summary_source": "deepseek", "authors": [{"name": "André Ranchin"}], "featured_authors": [{"name": "André Ranchin"}], "author_count": 1}, {"id": "2610.33294", "category": "quant-ph", "title": "Twirled and swirled worlds: a compositional approach", "abstract": "Twirled and swirled worlds describe generalised probabilistic theories (GPTs) restricted by symmetry-imposed superselection rules. We extend these constructions to a fully compositional setting for finite-dimensional GPTs and compact groups, treating states, effects, and multipartite transformations uniformly as processes. We distinguish system actions from process-space actions. We define actions on a theory as a whole by requiring the corresponding process-space actions to respect sequential and parallel composition. Averaging physical theory actions defines twirling, while averaging nonphysical theory actions defines swirling. We show that invariant subtheories might not satisfy process tomography, and establish conditions under which they do, involving invariant dynamically faithful states or internal classical reference frames. For locally tomographic parent theories, we prove that every theory symmetry admits a representation by linear system actions and that the invariant subtheory satisfies process tomography. An invariant multipartite process space fails local tomography if and only if some bipartition has sides sharing a non-trivial irreducible representation. We characterise when ancillary systems are necessary, which representations they must carry, and when entanglement is required for ancilla-free process tomography. We develop a framework for unifying twirled subtheories and extend incoherent simulations to compact groups. Finally, we recover bilocal classical theory as a twirled subtheory of classical theory and real quantum theory as a swirled subtheory of complex quantum theory, deriving their tomographic properties from their representation structure.", "url": "https://arxiv.org/abs/2610.33294", "type": "理论+数值", "summary": "1. 该工作提出组合式框架，将受紧群对称超选择限制的有限维广义概率理论中的旋转化与涡旋化子理论统一为过程语言，并同等处理态、效应和多体变换。\n2. 其要点是区分系统作用与过程空间作用并要求理论作用兼容顺序与平行组合，给出不变子理论满足过程层析的条件，证明局部层析母理论的对称可线性表示、多体局部层析失效当且仅当某二分两侧共享非平凡不可约表示。\n3. 该框架将旋转化子理论与非相干模拟推广至紧群，并把双局域经典理论和实量子理论分别恢复为经典与复量子理论的旋转化/涡旋化子理论，从表示结构导出层析性质。", "summary_source": "deepseek", "authors": [{"name": "Sina Soltani"}, {"name": "Thomas D. Galley"}, {"name": "Marco Erba"}, {"name": "John H. Selby"}], "featured_authors": [{"name": "Sina Soltani"}, {"name": "Thomas D. Galley"}, {"name": "Marco Erba"}, {"name": "John H. Selby"}], "author_count": 4}, {"id": "2610.33326", "category": "quant-ph", "title": "A new analytical finding for the Born-Infeld integral potential", "abstract": "A new finding regarding the Born-Infeld potential for short range distances from the charge revealed that its integral form can be almost exact written as the difference between a Coulomb-type potential and a Yukawa-type potential. This allowed for an immediate physical interpretation in terms of classical vacuum polarization and an effective mass. Subsequently, a new U(r) is proposed to cover the entire space. This formulation is then applied to calculate, in a closed manner, the first-order energy shifts in hydrogen-like atoms; a comparison of these shifts with high-precision spectroscopic data provides a model-dependent lower bound for the maximum field intensity parameter b.", "url": "https://arxiv.org/abs/2610.33326", "type": "理论", "summary": "1. 该工作发现短距下Born-Infeld势的积分形式可近似精确写成库仑型与汤川型势之差，并提出覆盖全空间的U(r)，据此闭式计算类氢原子的一阶能移。\n2. 其卖点在于该分解直接给出经典真空极化与有效质量的物理诠释，并使能移无需数值积分即可与高精度光谱比较。\n3. 由此得到模型依赖的最大场强参数b下界，为用光谱约束Born-Infeld非线性电动力学提供可检验途径，但其模型依赖性仍需独立检验。", "summary_source": "deepseek", "authors": [{"name": "Leonardo Paulo Guimarães De Assis"}, {"name": "Priscila Valdênia dos Santos"}, {"name": "Sergio de Oliveira Vellozo"}, {"name": "José Abdala Helayël Neto"}], "featured_authors": [{"name": "Leonardo Paulo Guimarães De Assis"}, {"name": "Priscila Valdênia dos Santos"}, {"name": "Sergio de Oliveira Vellozo"}, {"name": "José Abdala Helayël Neto"}], "author_count": 4}, {"id": "2610.33347", "category": "quant-ph", "title": "Junction Hook Errors in the Color Code", "abstract": "Color-dependent syndrome extraction schedules have been proposed to mitigate hook errors in the triangular color code. Recent work by Kishony and Fowler ( arXiv:2603.28852 ) identifies distance-reducing hook errors by the type of anyon for which they provide a shortcut and chooses the CNOT ordering for stabilizers of each color to avoid these errors. We identify an additional class of distance-reducing hooks, which we call junction hook errors, that is not captured by this classification. The two data qubits of a junction hook error terminate anyon strings of two different colors at the point where the three colored strings of a logical operator meet, which we call the junction. As such, the hook error does not correspond to a single type of anyon, yet it still reduces the distance. For distances $d=7,9,11$, we verify that every non-corner plaquette admits a scheduled hook error that, together with $d-2$ single data qubit faults, produces an undetectable logical error using $d-1$ faults. Each of these is a junction hook error. Because of this, every stabilizer, including those in the bulk, still requires additional protection from hook errors (such as flag qubits) to restore the full circuit-level distance with this schedule. A minimum weight logical operator has at most one junction, however, so junction hook errors cannot accumulate on one minimum weight logical operator in the way that single-color malign hook errors can. This helps explain why the schedule still improves the circuit-level distance to $d-\\lfloor (d+3)/6\\rfloor$, rather than the $d/2$ distance associated with spatially uniform color code scheduling.", "url": "https://arxiv.org/abs/2610.33347", "type": "理论", "summary": "1. 该工作指出三角色码中色依赖综合征提取调度遗漏了一类“结钩错误”，并分析其对逻辑距离的影响。\n2. 结钩错误的两数据比特在三色逻辑算符串交汇的结处终止两种不同颜色任意子串，不对应单一任意子类型却仍降距；对d=7,9,11验证每个非角plaquette均可由调度钩错误加d−2个单比特故障构成d−1故障的不可探测逻辑错误。\n3. 因最小权重逻辑算符至多含一个结，结钩错误不能像单色恶性钩错误那样累积，这解释了调度将电路级距离提升至d−⌊(d+3)/6⌋而非d/2，也意味着所有稳定子仍需flag等额外保护以恢复完整距离。", "summary_source": "deepseek", "authors": [{"name": "Salahedeen Issa"}, {"name": "Margaret Martonosi"}], "featured_authors": [{"name": "Salahedeen Issa"}, {"name": "Margaret Martonosi"}], "author_count": 2}, {"id": "2610.33378", "category": "quant-ph", "title": "Semiclassical dynamics of higher-order squeezing: self-adjoint extensions and coherent returns", "abstract": "Higher-order squeezing Hamiltonians have several self-adjoint realizations, while their classical trajectories reach infinity in finite time. We relate these extension problems through boundary amplitudes and the semiclassical propagation of coherent states. A discrete Fourier transformation gives the sink-to-source ray matrix of each quantum realization. After the first passage through infinity, the full Husimi probability measure converges to point masses on outgoing classical branches, with weights equal to the squared moduli of the matrix entries. The proof combines finite-order approximate tail solutions satisfying the exact extension boundary condition with full-norm Gaussian matching and a square-summable residual estimate. For positive energy, we determine the limit after any fixed number of passages: amplitudes evolve by powers of the unitary ray matrix, not by iterations of its squared-modulus matrix. We also realize these limits by concentrated complex amplitudes for an energy-preserving Liouville extension, distinguishing deterministic classical gluings from coherent boundary mixing.", "url": "https://arxiv.org/abs/2610.33378", "type": "理论", "summary": "1. 该工作研究了高阶压缩哈密顿量不同自伴扩张的半经典动力学，将经典轨迹有限时间逃逸至无穷与量子边界幅值及相干态传播联系起来。\n2. 其卖点是用离散傅里叶变换导出各量子实现的汇到源射线矩阵，并证明首次穿越无穷后胡西米概率测度收敛为出射经典分支上的点质量，权重等于矩阵元模平方；正能下任意固定穿越次数的幅值按酉射线矩阵的幂演化，而非其模平方矩阵迭代。\n3. 这以边界幅值和平方可和残差估计严格区分确定性经典粘合与相干边界混合，为自伴扩张选取及高阶压缩半经典极限提供可检验判据。", "summary_source": "deepseek", "authors": [{"name": "A. E. Teretenkov"}], "featured_authors": [{"name": "A. E. Teretenkov"}], "author_count": 1}, {"id": "2610.33386", "category": "quant-ph", "title": "Decision-aware validation of zero-noise extrapolation in QAOA optimization landscapes", "abstract": "Zero-noise extrapolation (ZNE) is usually validated by the accuracy of mitigated observables, yet variational quantum optimization uses those observables to select parameters. We ask whether, and by how much, an accuracy gain from ZNE coincides with a worse decision. In depth-one simulations of the quantum approximate optimization algorithm (QAOA) for MaxCut on four to six qubits, each sampled $120\\times120$ landscape yields both its mean-squared error (MSE) and the ideal regret of its selected grid minimum, comparing Richardson orders one to three with unmitigated estimation at the same total shot budget per grid point. In an exploratory screen of 675 conditions, whose per-point random seeds collide, a familywise (Holm) analysis retains only four of 540 replication conditions as showing both directional MSE improvement and regret increase. A frozen confirmation with 100 fresh paired repetitions per condition reproduces all four: median MSE improvements of 7.65-73.09% accompany median normalized regret increases of only 0.0031-0.0073. We distinguish a bias route, in which residual bias reorders the mean landscape, from a variance route, in which Richardson weights amplify finite-shot noise. Exact first and second moments on a bounded control grid find no bias-route reversal: mitigated mean landscapes preserve the ideal minima, and ZNE can more than halve expected MSE, yet finite-shot selections incur higher mean regret. Decision losses that survive strict testing are few and small in this benchmark, but reproducible and not revealed by aggregate MSE. We present a paired benchmark and recommend reporting decision regret alongside estimation error when mitigation is assessed for optimization. Results concern simulated exhaustive grids, not hardware or optimizer loops.", "url": "https://arxiv.org/abs/2610.33386", "type": "理论+数值", "summary": "1. 该工作在4—6量子比特MaxCut的深度一QAOA模拟中，成对比较一至三阶Richardson零噪声外推与同等采样预算的未缓解估计对参数选择的影响。\n2. 技术要点是同时考察MSE与选中格点的理想遗憾：675个探索条件经Holm校正仅4个呈MSE改善而遗憾升高，100次新鲜配对重复全部复现，中位MSE改善7.65%—73.09%仅伴归一化遗憾增0.0031—0.0073，并区分偏差重排与方差放大两路径。\n3. 精确矩分析表明ZNE可保持平均景观极小值并大幅降低MSE，却使有限采样选择的平均遗憾更高；因此评估缓解用于优化时应并列报告决策遗憾，结论仅限模拟穷举网格。", "summary_source": "deepseek", "authors": [{"name": "Vicenzo Scavino Alfaro"}], "featured_authors": [{"name": "Vicenzo Scavino Alfaro"}], "author_count": 1}, {"id": "2610.33545", "category": "quant-ph", "title": "When is a bosonic operator a Hamiltonian?", "abstract": "Hermitian polynomials in the quadrature operators $x$ and $p$ are the basic ingredients of continuous-variable quantum information, and increasingly exotic ones are now routinely engineered in superconducting circuits and trapped ions. However, such a polynomial need not define unique quantum dynamics: it may define exactly one, none, or an infinite family of physically distinct ones. Such obstructions are invisible to algebraic arguments and can compromise finite-dimensional truncations, which may fail to converge or silently converge to the wrong dynamics. We develop a method, implemented as an algorithm, which decides which case occurs, and how large the family is, from the coefficients alone, with no functional-analytic input from the user. For Gaussian operators the answer is always one; for non-Gaussian ones, a regime continuous-variable quantum computing cannot do without, the other outcomes occur already for simple and physically natural Hamiltonians. We apply the algorithm to operators drawn from the recent literature.", "url": "https://arxiv.org/abs/2610.33545", "type": "理论+数值", "summary": "1. 该工作提出并实现一种算法，仅根据 \\(x\\) 与 \\(p\\) 正交分量多项式的系数，判定相应厄米玻色算符定义唯一、无还是无限族物理上不同的哈密顿量及族规模。\n2. 其关键在于无需用户提供泛函分析输入，并揭示高斯算符总为唯一而简单非高斯算符已可出现非唯一或无解，从而使有限维截断可能不收敛或悄然收敛到错误动力学。\n3. 这为连续变量量子信息中工程化非高斯哈密顿量的可定义性判定和截断可靠性提供了可操作工具，并已用于筛查近期文献中的算符实例。", "summary_source": "deepseek", "authors": [{"name": "Felix Fischer"}, {"name": "Hermann Schulz-Baldes"}, {"name": "Daniel Burgarth"}, {"name": "Davide Lonigro"}], "featured_authors": [{"name": "Felix Fischer"}, {"name": "Hermann Schulz-Baldes"}, {"name": "Daniel Burgarth"}, {"name": "Davide Lonigro"}], "author_count": 4}, {"id": "2610.33613", "category": "quant-ph", "title": "The Coherent State Projection Eigenvalue Theorem", "abstract": "Recent papers have developed a cyclic symmetry projected extension for coherent state representations of bosonic Hilbert space. This extension can greatly reduce sampling errors in phase-space simulations of bosonic quantum systems that have symmetries. Here we prove an eigenvalue theorem for the continuum limit of the projected coherent states. Our intuitively appealing result is that in the continuum limit the projected coherent states are eigenstates of the symmetry generating operator. This result gives a differential identity in phase-space that includes the conserved eigenvalues. Detailed applications of these differential identities to obtaining improved Fokker-Planck and stochastic equations in many-body physics will be given elsewhere.", "url": "https://arxiv.org/abs/2610.33613", "type": "理论+数值", "summary": "1. 该工作证明了循环对称投影相干态在连续极限下的本征值定理，并导出包含守恒本征值的相空间微分恒等式。\n2. 其关键结论是连续极限中投影相干态成为对称生成算符的本征态，从而将投影扩展与守恒量及相空间微分结构直接联系，为降低具对称性玻色系统模拟的采样误差提供理论基础。\n3. 这一结果可为多体物理中改进Fokker-Planck与随机方程提供出发点和微分恒等式工具，具体应用有待后续工作展开。", "summary_source": "deepseek", "authors": [{"name": "Peter D. Drummond"}, {"name": "Margaret D. Reid"}], "featured_authors": [{"name": "Peter D. Drummond"}, {"name": "Margaret D. Reid"}], "author_count": 2}, {"id": "2610.33632", "category": "quant-ph", "title": "Path-Distinguishability Gaps at Fixed Visibility in Noisy Qubit Interferometers", "abstract": "The wave--particle duality relation bounds visibility and path distinguishability but does not determine their attainable values in a fixed noisy interferometer. We characterize the complete attainable region for a two-path interferometer with a qubit marker, varying the marker input while fixing the source, preparation channel, path-dependent interaction, and subsequent marker channel. At each feasible fringe visibility, the Helstrom-optimal distinguishabilities form at most two closed intervals, which can be separated by a gap. The intervals arise from opposite axial marker polarizations with the same fringe-amplitude modulus. Fixing the complex fringe amplitude instead gives a connected interval; for balanced original-path discrimination, a gap requires nonunital marker preparation. For a balanced pure source, relative $\\pi$ rotations, and no subsequent marker noise, we obtain a necessary and sufficient geometric criterion for a gap under some rotation axis perpendicular to the preparation displacement. Explicit channels and a time-independent Lindblad realization show how the gap depends on preparation geometry and evolution, with exact onset and optimization formulas at fixed fractional visibility. We also give sufficient bounds for excluding distinguishability intervals under calibrated finite-resolution errors.", "url": "https://arxiv.org/abs/2610.33632", "type": "理论+数值", "summary": "1. 该工作刻画了固定噪声双路径量子比特标记干涉仪中，在源、制备通道、路径相互作用及后续标记通道固定而仅改变标记输入时，条纹可见度与赫尔斯特罗姆最优路径可区分度的完整可达区域。\n2. 核心结论是每个可行可见度下最优可区分度至多形成两个闭合区间并可由间隙分隔，间隙源于相同条纹振幅模值下的相反轴向标记极化；固定复条纹振幅则区间连通，平衡路径判别下间隙需非幺正标记制备。\n3. 作者给出平衡纯源、相对π旋转且无后续标记噪声时的几何充要判据、固定分数可见度下的精确起始与优化公式，以及有限分辨率误差下排除区间的充分界，为实验标定非幺正性与噪声提供依据。", "summary_source": "deepseek", "authors": [{"name": "Mohd Asad Siddiqui"}], "featured_authors": [{"name": "Mohd Asad Siddiqui"}], "author_count": 1}, {"id": "2610.33800", "category": "quant-ph", "title": "Efficient Block Encodings of Vibrational Hamiltonians", "abstract": "Simulation of molecular vibrations is emerging as a promising application of quantum computing in quantum chemistry. In this work, we develop new strategies for block-encoding the second-quantized $n$-mode representation of the vibrational Hamiltonian, whose algebraic structure closely parallels that of the second-quantized electronic Hamiltonian. We derive linear-combination-of-unitaries (LCU) representations of this Hamiltonian based on Pauli decomposition and tensor hypercontraction (THC) and construct efficient circuits for the corresponding block encodings. We also extend the Block-Invariant Symmetry Shift (BLISS) technique to vibrational Hamiltonians, yielding a lower LCU 1-norm and, consequently, a lower overall circuit cost. For the molecules considered here, BLISS-THC reduces the Toffoli cost of quantum phase estimation by more than two orders of magnitude relative to existing block-encoding approaches. In comparison with recent Trotter-based methods, it shows up to a ninefold reduction in the T-gate count, with the relative savings tending to increase with system size. Asymptotically, and up to polylogarithmic factors, both the Pauli and THC LCUs trade additional ancillas for a quadratic improvement in scaling with the number of modes, while THC provides an additional quadratic improvement in scaling with the number of modals. These results highlight the importance of Hamiltonian factorizations and Toffoli-qubit tradeoffs for reducing the computational cost of quantum simulations of molecular vibrations.", "url": "https://arxiv.org/abs/2610.33800", "type": "理论+数值", "summary": "1. 该工作为振动哈密顿量的二次量子化 n 模表示发展了基于 Pauli 分解与张量超收缩（THC）的 LCU 表示及高效 block-encoding 电路，并将 BLISS 推广到振动体系。\n2. 其卖点是 BLISS-THC 降低 LCU 1-范数与线路成本：所考察分子中量子相位估计的 Toffoli 成本较现有 block-encoding 降逾两个数量级，较近期 Trotter 方法 T 门数最多降九倍且随体系增大更省；渐近上 Pauli/THC LCU 以额外 ancilla 换取模数标度二次改进，THC 另对 modal 数二次改进。\n3. 这凸显哈密顿量分解与 Toffoli-量子比特权衡对降低分子振动量子模拟成本的重要性，并为后续高效量子化学模拟设计提供启发。", "summary_source": "deepseek", "authors": [{"name": "Shashank G. Mehendale"}, {"name": "Ignacio Loaiza"}, {"name": "Shreyas Malpathak"}, {"name": "Stepan Fomichev"}, {"name": "Danial Motlagh"}, {"name": "Artur F. Izmaylov"}], "featured_authors": [{"name": "Shashank G. Mehendale"}, {"name": "Ignacio Loaiza"}, {"name": "Shreyas Malpathak"}, {"name": "Stepan Fomichev"}, {"name": "Danial Motlagh"}, {"name": "Artur F. Izmaylov"}], "author_count": 6}, {"id": "2610.33834", "category": "quant-ph", "title": "Initial-State Preparation for Strongly Correlated Molecules from Matrix Product States: Benchmarking and Environment-Aware Divide-and-Conquer Compilation", "abstract": "Compiling classically optimized matrix product states (MPSs) into quantum circuits is a promising route to initial-state preparation for strongly correlated molecules, but the accuracy, gate cost, and classical scalability of existing MPS compilation methods have not been systematically assessed. Here, we benchmark representative analytical, variational, and hybrid MPS compilation methods for strongly correlated systems including hydrogen chains and iron-sulfur clusters. We compare state infidelity, CNOT gate count, classical runtime, and parallel scalability across different system sizes and bond dimensions. We also introduce a divide-and-conquer environment-aware compilation algorithm (DCE), which optimizes each local isometry approximation according to its contribution to the prepared-state fidelity. The results reveal complementary operating regimes: direct variational compilation methods are gate-efficient for some smaller molecular systems with $O(10)$ qubits and $O(10)$ bond dimensions or moderate accuracy targets with infidelity of order $10^{-1}$, whereas divide-and-conquer methods scale more favorably for larger systems and relatively higher bond dimensions of $O(10\\text{-}10^2)$, particularly when target infidelities below $10^{-1}$ are required. Within the latter family, environment-aware optimization improves accuracy over unitary-distance-based compilation while retaining task-level parallelism. For the FeMo-cofactor (FeMoco), we find the DCE algorithm together with the MPS obtained in the entanglement-minimized orbitals (EMOs) provides a resource-efficient route to initial-state preparation. Our results provide practical guidance for selecting and developing MPS compilation methods for strongly correlated molecular simulations.", "url": "https://arxiv.org/abs/2610.33834", "type": "理论+数值", "summary": "1. 该工作系统基准测试了将经典优化矩阵乘积态编译为量子线路的解析、变分与混合方法，覆盖氢链和铁硫簇等强关联体系，并比较态失真度、CNOT门数、经典运行时间及并行可扩展性。\n2. 其技术卖点在于提出环境感知分治编译（DCE），依据局域等距近似对制备态保真度的贡献进行优化，并揭示直接变分编译在小体系、低键维或中等精度目标下门数高效，而DCE在较大体系、O(10–10²)键维及失真度低于10⁻¹时扩展更优。\n3. 对FeMoco，DCE结合纠缠最小化轨道所得MPS可实现资源高效的初态制备，并为强关联分子量子模拟中编译方法的选择与开发提供实践指导。", "summary_source": "deepseek", "authors": [{"name": "Haiqi Liu"}, {"name": "Longfei Chang"}, {"name": "Zhendong Li"}, {"name": "Wei-Hai Fang"}], "featured_authors": [{"name": "Haiqi Liu"}, {"name": "Longfei Chang"}, {"name": "Zhendong Li"}, {"name": "Wei-Hai Fang"}], "author_count": 4}, {"id": "2610.33848", "category": "quant-ph", "title": "Helstrom geometry with time-dependent spectral calibration", "abstract": "In a recent work we introduced a finite scalar-qubit-scalar spectral triple whose Connes distance reproduces the Bloch-ball trace metric up to a factor $2/\\Lambda$, where $\\Lambda^2=\\mu_L^2+\\mu_R^2$ for isotropic link strengths $\\mu_L,\\mu_R$ appearing in the proposed Dirac operator. Here we analyse time-dependent variation of these links, independent of the qubit dynamics. In doing so, we separate the distinguishability and calibration contributions to the spectral rate. A depolarizing example demonstrates spectral growth despite a monotonic contraction of the trace-distance. More generally, we characterize the admissible trace-distance histories compatible with a given positive spectral record and exhibit contracting and reviving realizations. At fixed $\\Lambda$, we also study a sinusoidal link imbalance that preserves the Dirac spectrum and qubit metric, while the scalar-scalar distance oscillates with half the period of the imbalance.", "url": "https://arxiv.org/abs/2610.33848", "type": "理论+数值", "summary": "1. 该文在有限标量-量子比特-标量谱三元组中引入连接强度的独立时变谱校准，分析Helstrom型距离与谱速率的时间依赖关系。\n2. 其核心是将谱速率分解为可区分性与校准贡献，并用去极化模型展示迹距离单调收缩时谱仍可增长，同时刻画兼容正谱记录的收缩/复活型迹距离历史及保持Dirac谱与量子比特度量的正弦连接失衡。\n3. 这为区分谱几何校准效应与量子动力学效应提供了明确框架，并提示后续应联合检验正谱记录与可容许迹距离历史。", "summary_source": "deepseek", "authors": [{"name": "Kaushlendra Kumar"}], "featured_authors": [{"name": "Kaushlendra Kumar"}], "author_count": 1}, {"id": "2610.34055", "category": "quant-ph", "title": "Quantum neuroplastic learning for time-series processing", "abstract": "Quantum machine learning uses quantum states and dynamics to represent and process data. In quantum reservoir computing, the physical system is typically fixed and a classical readout is trained. Inspired by the formation, strengthening and pruning of synapses during biological learning, we propose quantum neuroplastic learning (QNL), which reorganizes the couplings among the qubits of a quantum reservoir, much as experience rewires connections among neurons. Eligibility traces guide local edits to couplings, fields, gate angles and evolution time, and an edit is retained when a statistical bound on its improvement exceeds a complexity cost. We evaluate QNL under restarting and online monitored protocols on short- and long-term memory, nonlinear autoregressive processing and forecasting, and channel equalization tasks. In simulation, QNL enhances memory capacity, develops long-term recall and sustains adaptation across multiple tasks, with the largest benefit for tasks that require extended memory. On the IBM superconducting processor \\texttt{ibm\\_fez}, with six seven-qubit reservoirs running in parallel on 42 qubits (1.28 million shots in total), configurations learned in simulation and frozen before execution reduced the channel-equalization symbol error rate from 9.7\\% to 2.2\\% and achieved a lower error rate than a matched-budget tuned baseline.", "url": "https://arxiv.org/abs/2610.34055", "type": "理论+数值", "summary": "1. 该工作提出量子神经可塑学习（QNL），受突触形成、增强与修剪启发，用资格迹局部编辑量子储层比特间耦合、场、门角度与演化时间，仅在统计改进超过复杂度代价时保留编辑。\n2. 在短/长期记忆、非线性自回归与预测及信道均衡任务中，重启和在线监测协议显示其提升记忆容量、形成长期回忆并持续适应，长记忆任务收益最大；IBM超导处理器ibm_fez上42比特并行六个七比特储层、128万次采样，冻结的模拟学习配置将均衡误符号率由9.7%降至2.2%，并优于匹配预算基线。\n3. 这显示受复杂度约束的局部可塑性编辑适合近中期量子硬件，并为时间序列处理提供可部署、可基准检验的储层学习路线。", "summary_source": "deepseek", "authors": [{"name": "Mostafizur Rahaman Laskar"}], "featured_authors": [{"name": "Mostafizur Rahaman Laskar"}], "author_count": 1}, {"id": "2610.34079", "category": "quant-ph", "title": "Two exact quantum queries use at most six variables", "abstract": "We give a direct analytic proof that every total Boolean function computable exactly with at most two quantum queries depends on at most six input variables. This bound is sharp. A previous derivation relied on a numerical classification of Boolean functions on at most four variables; to the best of our knowledge, ours is the first unconditional proof. The main difficulty beyond the one-query case is that query-path vectors need not be mutually orthogonal, so interference prevents the scalar weight-counting argument from applying. We overcome this difficulty by establishing a rigid support-and-branch decomposition: after the coordinates in the first-query support are fixed, the second query induces a family of exact one-query branches. This structural description may be of independent interest.", "url": "https://arxiv.org/abs/2610.34079", "type": "理论+数值", "summary": "1. 该文对至多两次量子查询即可精确计算的全布尔函数给出直接解析证明，证明其至多依赖六个输入变量，并说明该界是紧的。\n2. 其核心卖点在于摆脱此前依赖至多四变量布尔函数数值分类的推导，给出据作者所知的首个无条件证明，并用刚性支撑—分支分解处理查询路径向量非正交导致的干涉障碍。\n3. 这一分解将第二查询在固定首查询支撑后化为若干精确单查询分支，可能为精确量子查询复杂度的结构分类与下界证明提供独立可用的工具。", "summary_source": "deepseek", "authors": [{"name": "Yaqiao Li"}], "featured_authors": [{"name": "Yaqiao Li"}], "author_count": 1}, {"id": "2610.34338", "category": "quant-ph", "title": "A Reduction Bound for Entanglement Detection by Positive Free Maps", "abstract": "Collins, Hayden, and Nechita used free probability to construct families of $k$-positive but not $(k+1)$-positive maps and applied them to entanglement detection. We prove that positive free maps associated with compactly supported freely infinitely divisible distributions are no stronger than the reduction criterion in every ancillary dimension. In particular, these maps cannot detect positive partial transpose entanglement. The proof combines a joint Fock realization with an operator positivity certificate derived from free Lévy data.", "url": "https://arxiv.org/abs/2610.34338", "type": "理论", "summary": "1. 该文证明，对任意辅助维度，与紧支撑自由无穷可分分布相联系的每个正自由映射均不强于约化判据，从而为这类自由映射给出统一的约化界。\n2. 证明的关键在于把联合福克实现与由自由莱维数据导出的算子正性证书结合，将映射正性约束转化为可操作的约化型比较。\n3. 直接推论是这些映射在任意辅助维度下都无法探测正部分转置纠缠，表明自由概率构造的纠缠检测判据在此设定下存在明确的能力上限。", "summary_source": "deepseek", "authors": [{"name": "Chin-Yen Lee"}], "featured_authors": [{"name": "Chin-Yen Lee"}], "author_count": 1}, {"id": "2610.34399", "category": "quant-ph", "title": "Pauli-ball discrepancy and stability of quantum codes", "abstract": "The Pauli-ball discrepancy, a quadratic discrepancy summed over all error radii, measures how uniformly the Pauli error images of a $K$-dimensional quantum code cover the $d$-dimensional Hilbert space. At parameters attaining equality in the quantum Singleton bound with minimum code distance $\\geq3$, or in the one-error Hamming bound with prime-power local dimension, the discrepancy of every projector of the prescribed rank equals an explicit benchmark plus an exact nonnegative remainder, which vanishes precisely for pure quantum maximum-distance-separable codes and nondegenerate perfect codes, respectively. For a Pauli ball of radius $e$ below half the target distance and size $V_e$, this remainder linearly bounds the squared Hilbert--Schmidt distance of the error-image Gram matrix from the identity. When $KV_e\\leq d$, it linearly bounds the diamond error and entanglement infidelity of a noise-independent polar recovery under any noise in that ball's span. For five qubits, we obtain the sharp rank-two Gram constant and exact logical channels of rotated codes attaining this linear order in diamond error. For pure states, the discrepancy equals a pure-state benchmark plus a positive weighted sum of marginal-purity defects, so absolutely maximally entangled states, when they exist, are exactly the minimizers.", "url": "https://arxiv.org/abs/2610.34399", "type": "理论", "summary": "1. 该论文引入泡利球差异度，对所有误差半径的二次差异求和，衡量K维量子码误差像在d维希尔伯特空间中的均匀覆盖。\n2. 其核心是证明在量子Singleton界取等且距离≥3，或素数幂局部维数下一错汉明界取等时，每个指定秩投影子的差异度等于显式基准加精确非负余项，余项仅在纯量子最大距离可分码或非退化完美码时消失。\n3. 该余项线性约束误差像格拉姆矩阵与恒等的希尔伯特-施密特距离，并在KV_e≤d时约束噪声无关极化恢复的钻石误差与纠缠保真度，为量子码稳定性及绝对最大纠缠态最优性提供统一判据。", "summary_source": "deepseek", "authors": [{"name": "Aryeh Lev Zabokritskiy \"Yohananov\""}], "featured_authors": [{"name": "Aryeh Lev Zabokritskiy \"Yohananov\""}], "author_count": 1}, {"id": "2610.34411", "category": "quant-ph", "title": "Bosonic Loss Codes with Bounded Occupation", "abstract": "We study Fock-state codes on $q$ bosonic modes, with total excitation $N$ and at most $B$ excitations per mode, that exactly correct every pattern of at most $\\delta N$ photon losses, for $q$ proportional to $N$. For every fixed cap $B$ and every ratio $q/N>1/B$, we prove explicit achievable rates, positive for all sufficiently small $\\delta>0$, in logical qubits per excitation. At $B=2$ and $q=N$, the rate is positive for every $\\delta<0.1355$ and is about $0.281$ at $\\delta=0.1$, compared with the previously established exact-code qutrit rate of about $0.275$. We also give an explicit upper bound on the dimension of every such exact code, including degenerate codes. For the pure-loss channel truncated to at most $\\delta N$ losses and renormalized, we obtain approximate codes with exponentially small worst-case error. When the loss probability is positive and at most $1/(B+1)$, they improve our positive exact-code rate bounds; at $B=2$, $q=N$, and loss probability $0.1$, they remain positive up to $\\delta\\approx0.158$.", "url": "https://arxiv.org/abs/2610.34411", "type": "理论", "summary": "1. 该工作研究了q个玻色模上的福克态编码：总激发数为N、每模至多B个激发，并能精确纠正最多δN个光子丢失，且q与N成正比。\n2. 其核心在于对任意固定B和q/N>1/B给出显式可达码率，证明δ足够小时码率为正；B=2、q=N时δ<0.1355为正，δ=0.1时约0.281，并给出含简并码的维数上界。\n3. 对截断并重整化的纯损耗信道，他们还构造了最坏情形误差指数小的近似码，在损耗概率不超过1/(B+1)时改进精确码率界，显示有界占据编码在玻色损耗纠错中的定量潜力。", "summary_source": "deepseek", "authors": [{"name": "Avraham Kreindel"}, {"name": "Aryeh Lev Zabokritskiy"}], "featured_authors": [{"name": "Avraham Kreindel"}, {"name": "Aryeh Lev Zabokritskiy"}], "author_count": 2}, {"id": "2610.34430", "category": "quant-ph", "title": "Emergent Recursive Kernels in Quantum Reservoir Computing", "abstract": "Learning with a quantum reservoir can be far simpler than simulating its dynamics. We show that a quantum reservoir governed by a fixed evolution, consisting of an input coupling followed by an independently sampled Haar unitary, admits an exact recursive kernel in the large-dimension limit at fixed history length. Memory orthogonality and factorization of propagated overlaps reduce each kernel evaluation to a scalar recurrence, linear in history length and independent of reservoir size. We establish self-averaging around this limit and connect the kernel coefficients to out-of-time-ordered correlators. Our analysis of finite-dimensional effects shows that the computational simplicity of the Haar kernel does not come at the expense of expressive power. Moreover, we demonstrate how the kernel can be tuned for different learning tasks by adjusting properties such as memory retention and temporal interaction order. On the NARMA10 benchmark, the tuned kernel achieves lower prediction error than the tested Ising and Sachdev--Ye--Kitaev reservoirs.", "url": "https://arxiv.org/abs/2610.34430", "type": "理论", "summary": "1. 该工作针对由输入耦合后接独立采样Haar酉演化构成的固定量子储层，在大维度、固定历史长度极限下推导出精确的递归核并约化为标量递推。\n2. 其核心在于利用记忆正交性与传播重叠因子化，使核评估仅随历史长度线性增长且与储层规模无关，并建立自平均性及核系数与乱序关联函数的联系。\n3. 有限维分析表明该Haar核不牺牲表达能力，且可通过调节记忆保持与时间交互阶数适配任务，在NARMA10上取得低于所测Ising与SYK储层的预测误差。", "summary_source": "deepseek", "authors": [{"name": "Ce Wang"}], "featured_authors": [{"name": "Ce Wang"}], "author_count": 1}, {"id": "2610.34446", "category": "quant-ph", "title": "Ancilla-free optimal quantum adder", "abstract": "We construct an exact $n$-bit quantum adder with $O(n)$ gates and $O(\\log n)$ depth that requires no ancillary qubits. The circuit uses only $X$, CNOT, and Toffoli gates under all-to-all connectivity and is classically reversible. Our construction accelerates the controlled ladder underlying addition. Grouping the data into blocks and use existing control qubits as conditional workspace gives a recursive construction with $O(n\\log\\log n)$ gates and $O(\\log n)$ depth. We then coordinate inter-block propagation via two short-path forest operations to cut the per-block workspace requirement, yielding a nonrecursive implementation with $O(n)$ gates. Both the gate count and circuit depth are asymptotically optimal.", "url": "https://arxiv.org/abs/2610.34446", "type": "理论", "summary": "1. 该工作构造了一个无需辅助比特的精确 n 位量子加法器，在全连通条件下仅用 X、CNOT 与 Toffoli 门实现 O(n) 门数和 O(log n) 深度。\n2. 其核心卖点是通过分块递归、复用控制比特作条件工作区，并用两次短路径森林操作协调块间传播，消除每块额外工作区并得到非递归 O(n) 门实现。\n3. 由于门数与深度均渐近最优，该构造为无辅助量子算术电路设定了明确基准，并可启发受限连通性与容错编译下的加法器优化。", "summary_source": "deepseek", "authors": [{"name": "Junhong Nie"}, {"name": "Jialiang Tang"}, {"name": "Xiaoming Sun"}, {"name": "Wei Zi"}], "featured_authors": [{"name": "Junhong Nie"}, {"name": "Jialiang Tang"}, {"name": "Xiaoming Sun"}, {"name": "Wei Zi"}], "author_count": 4}, {"id": "2610.34483", "category": "quant-ph", "title": "Path integral control in the complex plane", "abstract": "Path integral control is a stochastic optimal control framework that computes optimal policies as weighted averages over state trajectories. It was recently shown that, combined with stochastic quantum trajectories, the path integral control approach constitutes a promising alternative for quantum optimal control. In this work, we propose an extension of path integral control to the complex plane using circular complex Wiener processes. The change of measure is defined on the driving noise space under an exact control-noise matching condition, which also accommodates rank-deficient state diffusions. Applied to stochastic Schrödinger equations, the resulting formalism gives a compact treatment of paired non-Hermitian jump channels with unequal positive dissipation rates and yields cross-entropy-optimal feedback and open-loop control formulas.", "url": "https://arxiv.org/abs/2610.34483", "type": "理论", "summary": "1. 该工作将路径积分控制推广到复平面，引入圆复维纳过程，并在驱动噪声空间上构造测度变换以求解随机最优控制。\n2. 其关键是在精确的控制—噪声匹配条件下定义测度变换，使方法可兼容秩亏状态扩散，并应用于随机薛定谔方程，紧凑处理具有不等正耗散率的成对非厄米跳跃通道，给出交叉熵最优的反馈与开环控制公式。\n3. 这为耗散型量子系统与非厄米通道的最优控制提供了可扩展的理论框架，并提示在秩亏扩散情形下检验反馈策略的实验与数值研究方向。", "summary_source": "deepseek", "authors": [{"name": "Aarón Villanueva"}], "featured_authors": [{"name": "Aarón Villanueva"}], "author_count": 1}, {"id": "2610.34506", "category": "quant-ph", "title": "Model-Uncertainty-Aware Digital Twins for Non-Markovian Quantum Repeater Memories", "abstract": "Quantum-repeater controllers need reliable estimates of stored entanglement as adjacent links are generated. Fixed exponential lifetimes miss non-Markovian revivals, while complex surrogates are unnecessary when the microscopic family is known. We present QMemTwin, a physics-constrained digital twin that accounts for model uncertainty. It calibrates a bank of contractive passive state-space models, combines their amplitudes with finite-sample-corrected Akaike weights, and abstains when temporal-holdout data indicate unsupported dynamics. Passivity guarantees a completely positive, trace-preserving amplitude-damping channel for each candidate and their convex amplitude average. We evaluate [N cases] synthetic memories: [N supported] supported passive time-invariant cases and [N structural] nonstationary structural-shift cases. In the matched one-pseudomode regime, the correctly specified one-pseudomode fit performs best. Across [N unknown] supported cases with uncertain families, QMemTwin reduces population RMSE by [population reduction]% and Bell-fidelity RMSE by [Bell reduction]% relative to the two-pseudomode model; both paired effects remain significant after Holm correction. The flexible passive model has a slightly lower mean error for unknown families but is statistically indistinguishable from QMemTwin and loses accuracy in the matched regime. The temporal-holdout gate detects [detection]% of structural shifts, with [false alarm]% false alarms on supported families and AUROC [AUC]. In 2-, 4-, and 8-link repeater chains, the mixed cohort shows no significant 8-link goodput gain. A predeclared high-backflow stress cohort yields an 8-link goodput gain of [goodput gain]% over the two-pseudomode model, with paired p = [p value]. These results favor using a known family when available, accounting for model uncertainty otherwise and abstaining on unsupported dynamics.", "url": "https://arxiv.org/abs/2610.34506", "type": "理论+数值", "summary": "1. 该工作提出QMemTwin，一种面向非马尔可夫量子中继器存储器的物理约束数字孪生框架，通过校准收缩被动状态空间模型并按时序留出数据弃权来估计存储纠缠。\n2. 其卖点是用有限样本校正的赤池权重融合候选模型幅度，并借被动性保证各候选及其凸幅度平均为完全正、保迹的振幅阻尼信道，从而在已知模型族匹配时采用正确指定模型、在模型族不确定时降低总体与贝尔保真度均方根误差。\n3. 结果支持有已知模型族则用之、否则计入模型不确定性、对不支持动力学弃权的策略，并在高回流压力中继链上显示多链路有效吞吐增益，为量子中继控制器设计提供可检验启发。", "summary_source": "deepseek", "authors": [{"name": "Muhammad Waqas Haseeb"}], "featured_authors": [{"name": "Muhammad Waqas Haseeb"}], "author_count": 1}, {"id": "2610.34762", "category": "quant-ph", "title": "Quantum ordinal selection with two comparisons", "abstract": "We study the optimal probability of selecting an object within a prescribed rank threshold using at most two noiseless coherent pairwise comparisons of an unknown strict order. Polynomial degree bounds alone can overestimate the success attainable with two comparisons. We develop a comparison-specific semidefinite model that completely characterizes attainable success. Computer-assisted proofs establish the exact optimum for every rank threshold at seven objects and for minimum selection at eight. For minimum selection, we construct an explicit algorithm family and determine its exact optimum. Bounds for all admissible two-comparison algorithms show that the family's asymptotic success is within 0.016% of the unrestricted optimum. We also prove that this relative gap has a strictly positive limit. The optimal quantum-to-classical success ratio for minimum selection converges to approximately 2.48 under the same two-comparison budget.", "url": "https://arxiv.org/abs/2610.34762", "type": "理论+数值", "summary": "1. 该工作研究在未知严格序下仅用至多两次无噪声相干成对比较，于给定秩阈值内选中目标的最大成功概率，并建立比较特定的半定规划模型来精确刻画可达成功率。\n2. 其技术卖点在于用计算机辅助证明给出七对象各秩阈值及八对象最小选择的精确最优值，并构造显式算法族，证明其渐近成功率距无限制最优仅约0.016%，且该相对差距具有严格正极限。\n3. 对最小选择，两次比较预算下量子与经典最优成功率之比收敛至约2.48，这为少次数相干查询的序选择极限及后续算法设计提供了定量基准。", "summary_source": "deepseek", "authors": [{"name": "Hongyu Wu"}], "featured_authors": [{"name": "Hongyu Wu"}], "author_count": 1}, {"id": "2610.34899", "category": "quant-ph", "title": "Modulation and protection of entanglement in a two-qubit system via two interacting oscillator control", "abstract": "We investigate the control and protection of two-qubit entanglement through engineered interactions between two auxiliary harmonic oscillators. Each qubit is coupled to a local oscillator via a dephasing interaction, while the oscillators interact through independently tunable position-position and momentum-momentum couplings. Employing the characteristic-function representation, we obtain analytical solutions for the composite-system dynamics and examine how the stability properties of the coupled oscillators determine the evolution of two-qubit concurrence. Our analysis reveals distinct dynamical regimes exhibiting entanglement revivals, suppression, or decay, and identifies configurations in which oscillator interactions effectively reduce entanglement degradation. We further investigate the influence of thermal dissipation using local and global master-equation descriptions, demonstrating that suitable oscillator couplings can preserve substantial two-qubit entanglement under the dissipative conditions considered. These results establish a connection between the dynamical stability of auxiliary bosonic modes and the controllability of entanglement in discrete-variable quantum systems, providing a potential strategy for entanglement protection through engineered oscillator interactions.", "url": "https://arxiv.org/abs/2610.34899", "type": "理论", "summary": "1. 该工作研究两个量子比特分别经退相位相互作用耦合到本地谐振子、且两谐振子具有可调位置-位置与动量-动量耦合时，如何调控并保护两比特纠缠，并用特征函数表示给出复合系统动力学的解析解。\n2. 其核心卖点在于将耦合谐振子的稳定性与两比特纠缠度的复苏、抑制或衰减等动力学区间对应起来，并证明在局部与全局主方程描述的热耗散下适宜振子耦合仍能保留可观的纠缠。\n3. 这将辅助玻色模式的动力学稳定性与离散变量量子系统的纠缠可控性联系起来，为通过工程化振子相互作用保护纠缠提供了潜在策略。", "summary_source": "deepseek", "authors": [{"name": "Pablo Carlos López Vázquez"}, {"name": "Andrés García"}, {"name": "Josué Romero"}], "featured_authors": [{"name": "Pablo Carlos López Vázquez"}, {"name": "Andrés García"}, {"name": "Josué Romero"}], "author_count": 3}, {"id": "2610.34972", "category": "quant-ph", "title": "Membership in the cone of quantum states over time is NP-hard", "abstract": "A state over time (stote) pairs a state $\\rho$ with a channel $\\mathcal{E}$ as the Hermitian, generally non-positive operator $(\\rho\\otimes\\mathbf{1})\\star J_\\mathcal{E}$. Characterizing the convex cone $\\widehat{\\mathcal{Q}}$ these operators generate was posed as an open problem in~\\cite{HoogstederCalsamigliaWinter2025}. We exhibit a linear copy of the bipartite separable cone as an exposed face of $\\widehat{\\mathcal{Q}}$: for output systems of the form $B = A'R$ with $A'$ a copy of the input, there is an explicit witness $W_0\\in\\widehat{\\mathcal{Q}}^*$ and an explicit injective linear map $L$ with $\\sigma\\in \\mathrm{SEP}_{+}(A{:}R)\\iff L(\\sigma)\\in\\widehat{\\mathcal{Q}}(A{:}A'R)$. Composing with the NP-hardness of separability shows that exact membership, weak membership, and weak optimization are NP-hard for $\\widehat{\\mathcal{Q}}$ and its dual. A quantitative stability bound makes the weak-membership reduction valid at inverse-polynomial accuracy. Thus polynomial-time membership tests do not exist unless $\\mathrm{P}=\\mathrm{NP}$. Independently of this complexity assumption, Fawzi's theorem implies that $\\widehat{\\mathcal{Q}}(A{:}A'R)$ admits no finite semidefinite representation when $d=\\dim A\\ge2$, $r=\\dim R\\ge2$, and $d+r>5$.", "url": "https://arxiv.org/abs/2610.34972", "type": "理论+数值", "summary": "1. 该工作将双分可分离态锥显式线性嵌入为“时间量子态”凸锥的暴露面，并据此证明其精确成员判定、弱成员判定与弱优化均为NP难。\n2. 其关键在于给出显式对偶见证和单射线性映射，并用定量稳定性界使弱成员归约在逆多项式精度下成立；独立地由Fawzi定理推出在维度d≥2、r≥2且d+r>5时该锥无有限半定表示。\n3. 这表明除非P=NP，不存在多项式时间成员测试，提示依赖半定规划的经典刻画与优化需附加结构或近似假设。", "summary_source": "deepseek", "authors": [{"name": "Matt Hoogsteder-Riera"}], "featured_authors": [{"name": "Matt Hoogsteder-Riera"}], "author_count": 1}, {"id": "2610.35183", "category": "quant-ph", "title": "Complete characterization of internal-external entanglement trade-offs in two-mode Gaussian states", "abstract": "We characterize the exact trade-off between internal and external entanglement in asymmetric two-mode Gaussian states at fixed local symplectic eigenvalues. Internal entanglement is quantified by the negativity $\\mathcal{N}_{A:B}$ between the two modes, while external entanglement is quantified by the negativity $\\mathcal{N}_{AB:CD}$ across a Gaussian purification. Numerical sampling suggests the boundary structure of the attainable region in the $(\\mathcal{N}_{AB:CD},\\mathcal{N}_{A:B})$ plane, which we then determine analytically. Parametrizing the global symplectic spectrum yields a closed admissible interval for the remaining spectral parameter at fixed $\\mathcal{N}_{AB:CD}$. We prove constructively that every point in this interval corresponds to a physical covariance matrix, implying that all intermediate values of $\\mathcal{N}_{A:B}$ between the resulting sharp bounds are achievable. The upper bound is attained for opposite-sign correlations of equal magnitude, while the positive branch of the lower bound occurs when one global symplectic eigenvalue equals unity. We also identify two external-entanglement thresholds, derive a saturated monogamy-type inequality, and recover the symmetric-state limit.", "url": "https://arxiv.org/abs/2610.35183", "type": "理论+数值", "summary": "1. 该工作针对固定局域辛本征值的非对称双模高斯态，精确刻画了以模间负度N_{A:B}度量的内部纠缠与以高斯纯化跨划分负度N_{AB:CD}度量的外部纠缠之间的权衡关系，并解析确定了二者可达区域的边界。\n2. 其关键在于用全局辛谱参数化，在固定N_{AB:CD}时给出剩余谱参数的闭可行区间，并构造性证明区间内每一点均对应物理协方差矩阵，从而所有中间N_{A:B}值均可实现；同时给出锐利上下界、两种外部纠缠阈值及饱和的单配型不等式。\n3. 这为高斯量子信息中纯化诱导的纠缠约束提供了完整可行域刻画，并可启发后续对多模纠缠单配性、对称态极限及相关实验判据的研究。", "summary_source": "deepseek", "authors": [{"name": "Yasusada Nambu"}], "featured_authors": [{"name": "Yasusada Nambu"}], "author_count": 1}, {"id": "2610.35205", "category": "quant-ph", "title": "Basis-set error bounds for first-quantised quantum simulation of chemistry", "abstract": "In quantum simulation of electronic structure it is often expected that the estimate of the ground energy converges to the continuum basis limit at a rate of $\\mathcal O(N^{-1})$ for a basis of size $N$. This has been found in analytical and numerical studies, but without a rigorous treatment of the error in the quantities considered in quantum algorithms. Here we show the $\\mathcal O(N^{-1})$ scaling of the error for a wide range of cases needed for quantum simulation of chemistry. We show the error in the ground energy scales as $\\mathcal O(N^{-1})$ for plane-wave as well as spatial grid bases. For the spatial grid we consider both a periodic system and a non-periodic system with open boundaries. For time evolution, our bound on the error in the state itself is weaker than $\\mathcal O(N^{-1})$, but we show that the error in observables scales as $\\widetilde{\\mathcal O}(N^{-1})$ in important cases. In particular, we may consider a smoothed observable that describes the position of particles. We show that this error scales as $\\mathcal O(N^{-5/3}+tN^{-1})$ for time $t$, again both for plane-wave and spatial grid bases. For the non-periodic grid case we use a condition that the true evolution would not result in significant leakage past the boundaries, which introduces basis error unrelated to the resolution of the discretisation. We also show the error in the kinetic energy of a particle scales as $\\mathcal O((t+\\log N)/N)$ for the plane-wave and grid bases. Together, these results show that $\\mathcal O(N^{-1})$ scaling of the error holds for many of the relevant cases for quantum algorithms (with a trivial log factor for kinetic energy).", "url": "https://arxiv.org/abs/2610.35205", "type": "理论+数值", "summary": "1. 该工作给出了第一量子化电子结构量子模拟中基组离散化误差的严格界，证明平面波与空间网格（含周期与开放边界）下基态能量误差均按 O(N^{-1}) 收敛。\n2. 其要点是把分析从基态能量推广到时间演化：态本身误差界弱于 O(N^{-1})，但平滑位置类可观测量的误差为 O(N^{-5/3}+tN^{-1})、动能为 O((t+log N)/N)，开放边界情形则依赖真实演化无显著边界泄漏的假定。\n3. 这为量子算法中常用的 O(N^{-1}) 收敛预期及基组规模与资源估算提供了严格依据，并提示演化类算法的精度分析须区分态误差与可观测误差。", "summary_source": "deepseek", "authors": [{"name": "Dominic W. Berry"}, {"name": "Arkin Tikku"}, {"name": "Sophia Simon"}, {"name": "Ryan Babbush"}], "featured_authors": [{"name": "Dominic W. Berry"}, {"name": "Arkin Tikku"}, {"name": "Sophia Simon"}, {"name": "Ryan Babbush"}], "author_count": 4}, {"id": "2610.35300", "category": "quant-ph", "title": "Quantum-Classical Framework for the Joint Optimization of Bidirectional EV Charging and Trip Assignment", "abstract": "The integration of bidirectional (V2G) charging allows electric vehicle (EV) fleets to operate as distributed energy assets. However, the joint optimization of charging schedules and trip assignments is NP-hard. Moreover, bidirectional power flows create non-monotonic state-of-charge (SoC) dynamics that weaken standard dual-based Benders cuts. We propose a hybrid quantum-classical Benders decomposition framework. To overcome the qubit overhead associated with encoding feasibility cuts, we introduce logic-based conflict cuts, which require near-zero auxiliary qubits. Furthermore, we develop a sparse recursive SoC formulation that reduces the constraint-matrix density by a factor of T/3 in the horizon length T. We demonstrate that our framework recovers MILP-optimal solutions on benchmark instances with a low auxiliary-qubit budget, and, as a minimal proof of concept, we execute a small instance end-to-end on IBM quantum hardware.", "url": "https://arxiv.org/abs/2610.35300", "type": "理论+数值", "summary": "1. 该工作针对双向V2G充电与行程分配联合优化的NP难问题，并考虑非单调SoC动态削弱标准对偶Benders割的困难，提出混合量子-经典Benders分解框架。\n2. 其卖点在于用近零辅助量子比特的逻辑冲突割处理可行性割的量子比特开销，并以稀疏递归SoC表述将约束矩阵密度按T/3因子降低。\n3. 在基准算例上以较低辅助量子比特预算恢复MILP最优解，并在IBM量子硬件上端到端执行小规模实例，表明该分解路线可作为近期量子辅助EV调度的可验证起点。", "summary_source": "deepseek", "authors": [{"name": "Mustafa Musab"}, {"name": "Sebastian Schmitt"}, {"name": "Markus Wappler"}, {"name": "Jörg Lässig"}, {"name": "Daniel Müssig"}], "featured_authors": [{"name": "Mustafa Musab"}, {"name": "Sebastian Schmitt"}, {"name": "Markus Wappler"}, {"name": "Jörg Lässig"}, {"name": "Daniel Müssig"}], "author_count": 5}, {"id": "2610.35370", "category": "quant-ph", "title": "Sublinear thermal state and ground state preparation for free fermions via system-bath interaction", "abstract": "Dissipative algorithms for preparing thermal and ground states typically require a total Hamiltonian simulation time that grows at least linearly with system size $N$, even when their mixing time grows only polylogarithmically. We achieve sublinear simulation time for free fermions by engineering local interactions with a bath whose size grows in proportion to the system size. Starting from arbitrary initial states, our thermal state preparation algorithm achieves trace-norm error $\\epsilon$ in total simulation time $\\widetilde{O}(\\sqrt{N}/\\epsilon)$ at fixed inverse temperature and bounded single-particle bandwidth, while ground state preparation of gapped systems requires only $\\mathrm{polylog}(N/\\epsilon)$ time. We further establish lower bounds for thermal state preparation within the bath protocols considered, identifying two obstacles to faster preparation, namely fourth-order deviations from the target thermal state and fluctuations induced by a random frequency shared by all bath qubits. Our results demonstrate that the linear simulation time barrier in dissipative state preparation can be overcome and clarify the bath and filter-design constraints that govern further complexity improvements.", "url": "https://arxiv.org/abs/2610.35370", "type": "理论+数值", "summary": "1. 该工作为自由费米子设计局域系统—浴耦合，浴尺寸随系统规模线性增长，从任意初态耗散制备热态与基态。\n2. 其卖点是热态达到迹范数误差ε的总模拟时间为Õ(√N/ε)，有能隙基态仅需polylog(N/ε)，并给出该浴协议下的下界，指出四阶偏差与全浴共享随机频率涨落两类限制。\n3. 这说明耗散态制备的线性模拟时间壁垒可被突破，并为通过浴与滤波设计进一步降低复杂度提供明确约束与启发。", "summary_source": "deepseek", "authors": [{"name": "Zhiyan Ding"}, {"name": "Lin Lin"}, {"name": "Ke Wang"}], "featured_authors": [{"name": "Zhiyan Ding"}, {"name": "Lin Lin"}, {"name": "Ke Wang"}], "author_count": 3}, {"id": "2610.35377", "category": "quant-ph", "title": "Multipartite dynamics beyond bipartite entanglement equilibration", "abstract": "Entanglement equilibration need not mark the end of quantum-information dynamics in quantum thermalization. We show that the complete Schmidt spectra of a fixed tripartition can become stationary while its multipartite correlation structure, distinguished by local-unitary invariants, continues to evolve. This separation occurs exactly within a finite window in self-dual kicked-Ising dynamics and asymptotically in Haar-random circuits. We further demonstrate an independently tunable timescale for multipartite dynamics using quantum-error-correcting codes. When coupled to a locally scrambling bath, ordinary entanglement approaches equilibrium through rapid local scrambling, while weak logical--bath coupling drives a slower reorganization of multipartite correlations. These results reveal a deeper distinction than the ordering of equilibration times: bipartite entanglement and multipartite correlation structure can probe distinct physical channels of quantum-information dynamics, rather than merely different stages of the same relaxation process.", "url": "https://arxiv.org/abs/2610.35377", "type": "理论", "summary": "1. 该工作以固定三分区的完整Schmidt谱和局域酉不变量为判据，考察自对偶踢动Ising动力学、Haar随机线路及量子纠错码中的纠缠平衡与多体关联演化。\n2. 核心卖点是发现Schmidt谱可已平稳而多体关联结构继续演化，这一分离在踢动Ising的有限时间窗精确出现、在Haar线路渐近出现，并可借量子纠错码及弱逻辑-浴耦合独立调节时间尺度。\n3. 这说明二分纠缠与多体关联结构探测的是量子信息动力学的不同物理通道，而非同一弛豫过程的不同阶段，为区分和独立控制热化中的多体动力学提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Yan Liu"}, {"name": "Ya-Wen Sun"}, {"name": "Ren-Jie Ying"}, {"name": "Jun-Yuan Zeng"}], "featured_authors": [{"name": "Yan Liu"}, {"name": "Ya-Wen Sun"}, {"name": "Ren-Jie Ying"}, {"name": "Jun-Yuan Zeng"}], "author_count": 4}, {"id": "2610.35410", "category": "quant-ph", "title": "Multimode continuous-variable quantum key distribution with CMOS-compatible photonic-electronic integration", "abstract": "Multiplexing and photonic-electronic integration offer a route to scalable and high-throughput quantum key distribution (QKD) networks through parallel transmission and compact hardware suited to volume manufacturing. Realizing this route requires multichannel transmitters and receivers, and a security analysis accounting for mode coupling. Here we present a CMOS-compatible photonic-electronic multimode continuous-variable QKD architecture, using polarization multiplexing as a two-mode example. Silicon-photonic transmitter and receiver chips prepare and detect two polarization modes in parallel. The receiver is co-integrated with a dual-channel 28-nm CMOS transimpedance amplifier, providing shot-noise clearances exceeding 20 dB in both channels. Pilot-assisted unitary digital recovery removes the need for active optical polarization control, while a multimode security analysis accounts for the mode crosstalk. At 2 percent residual crosstalk, the multimode analysis extends the simulated secure distance from 39 to 84 km, near the crosstalk-free limit of 89 km. Over 10 km of deployed fibre, the mean total finite-size secret-key rate estimate is 6.69 Mbit/s, 12 percent above the single-mode analysis from the same digitally recovered data. These results establish a route to scalable multimode quantum-secured networks built on technology suited to mass production.", "url": "https://arxiv.org/abs/2610.35410", "type": "理论", "summary": "1. 该工作提出并演示了CMOS兼容的硅光电子集成多模连续变量量子密钥分发架构，以偏振复用为双模实例，由硅光收发芯片并行制备与探测两个偏振模，并联合双通道28 nm CMOS跨阻放大器。\n2. 其卖点是两通道散粒噪声裕度均超20 dB、导频辅助酉变换数字恢复免去主动偏振控制，以及计入模式串扰的多模安全分析：2%残余串扰下模拟安全距离由39 km升至84 km，逼近89 km无串扰极限。\n3. 10 km现网光纤上有限码长总密钥率均值估计达6.69 Mbit/s，较同一恢复数据的单模分析高12%，为基于量产技术构建可扩展多模量子保密网络提供了路径。", "summary_source": "deepseek", "authors": [{"name": "Yiming Bian"}, {"name": "Sarah Bastiaens"}, {"name": "Saeed Hakimi"}, {"name": "Huy Quang Nguyen"}, {"name": "Aboobackkar Sidhique"}, {"name": "Cédric Bruynsteen"}, {"name": "Govind J. Wanjalkar"}, {"name": "Ali Al Hadi Amhaz"}, {"name": "Jasper Jans"}, {"name": "Axl Bomhals"}, {"name": "Ulrik L. Andersen"}, {"name": "Tobias Gehring"}, {"name": "Xin Yin"}, {"name": "Adnan A.E. Hajomer"}], "featured_authors": [{"name": "Yiming Bian"}, {"name": "Sarah Bastiaens"}, {"name": "Saeed Hakimi"}, {"name": "Tobias Gehring"}, {"name": "Xin Yin"}, {"name": "Adnan A.E. Hajomer"}], "author_count": 14}, {"id": "2610.35445", "category": "quant-ph", "title": "Multistability and Critical Frustrated Superradiance in Open Anisotropic Quantum Rabi Trimer", "abstract": "We study the nonequilibrium steady states of an open anisotropic quantum Rabi trimer. Combining semiclassical and quantum mechanical treatments, we map out the system's phase diagram and elucidate the critical phenomena induced by anisotropic light-matter coupling, cavity dissipation, and complex photon hopping, which give rise to abundant multistable phases. Counterintuitively, the frustrated superradiant phase (FSP) can be stabilized by both positive and negative photon hopping, a feature absent in closed Rabi and Dicke trimers. We further uncover two independent dissipation thresholds for the normal superradiant phase and the FSP. Unlike isotropic open quantum Rabi trimers, both phases are suppressed once the dissipation exceeds their respective critical values. The rotating and counter-rotating interaction terms exhibit mutually reciprocal effects on the quantum phase transitions. By analyzing universal scaling behaviors with quantum fluctuations incorporated, we reveal an unprecedented finite-fluctuation critical exponent for the FSP. Moreover, the critical exponents of individual phases are coupling-strength dependent. The multistability and FSP can be tuned by anisotropy and dissipation. Our results broaden the scope of nonequilibrium quantum phase physics in few-body systems and hold promising applications for quantum state engineering and cavity/circuit quantum electrodynamics.", "url": "https://arxiv.org/abs/2610.35445", "type": "理论+数值", "summary": "1. 该工作结合半经典与量子方法，研究了开放各向异性量子Rabi三聚体的非平衡稳态与相图，并刻画各向异性光-物质耦合、腔耗散和复光子跃迁诱导的临界现象。\n2. 其核心在于揭示正、负光子跃迁均可稳定阻挫超辐射相，并发现该相与正常超辐射相具有独立耗散阈值，同时给出包含量子涨落、依赖耦合强度的临界指数及旋转/反旋转项的互易效应。\n3. 这些结果将非平衡量子相物理拓展至少体开放系统，并为量子态调控及腔/电路量子电动力学提供可调的多稳态与临界性启示。", "summary_source": "deepseek", "authors": [{"name": "Ya-Ping Ni"}, {"name": "Yi-Ge Wu"}, {"name": "Jie-Qiao Liao"}, {"name": "Jin-Feng Huang"}], "featured_authors": [{"name": "Ya-Ping Ni"}, {"name": "Yi-Ge Wu"}, {"name": "Jie-Qiao Liao"}, {"name": "Jin-Feng Huang"}], "author_count": 4}, {"id": "2610.35467", "category": "quant-ph", "title": "Electron-photon entanglement in real space from quantum electrodynamics", "abstract": "We study the entanglement between an electron and the photon it scatters, resolved in real space and time. Starting from nonrelativistic QED in Fermi's oscillator representation, we write Fock's coupled equations for components with fixed photon number in the photon configuration space, in the length gauge, where the photon is created around the atom through a nonlocal kernel. Truncated at one photon, the equations are solved numerically without the rotating-wave approximation for a one-dimensional model atom in a waveguide with a single transverse mode and enhanced coupling. The atom is driven by a short, off-resonant laser pulse, with the electron and photon represented on real-space grids. The global electron-photon entanglement is largely transient. It peaks during the pulse and decreases as the polarized electron cloud returns to the core, leaving a state close to a product of the electron state and a superposition of the field vacuum with a single scattered photon. Local entanglement, obtained from walkers sampled across both photon-number components, exhibits opposite spatial patterns for the two particles. The electron entropy is smallest at the nucleus and maps the local strength of the dipole coupling, whereas the photon entropy is largest near the atom, where photons are created and absorbed, and smaller in the outgoing wave packets.", "url": "https://arxiv.org/abs/2610.35467", "type": "理论+数值", "summary": "1. 该工作基于非相对论QED的Fock耦合方程，在单光子截断、长度规范和无旋转波近似下，用实空间网格数值求解一维波导模型中短失谐脉冲驱动下电子与其散射光子的时空分辨纠缠。\n2. 其核心发现是全局纠缠基本为瞬态，于脉冲期间达峰并随极化电子云回核衰减，末态近似为电子态与真空加单散射光子叠加的乘积；局域熵呈相反空间分布，电子熵在核处最小并映射偶极耦合强度，光子熵在原子附近最大、在外行波包中较小。\n3. 这为在波导QED平台上以空间分辨方式检验单光子散射诱导的电子-光子纠缠、区分全局瞬态与局域熵分布提供理论基准。", "summary_source": "deepseek", "authors": [{"name": "Ivan P. Christov"}], "featured_authors": [{"name": "Ivan P. Christov"}], "author_count": 1}, {"id": "2610.35478", "category": "quant-ph", "title": "Benchmarking quantum-annealing-based approaches for factory layout planning", "abstract": "The earlystage of factory layout planning has a direct effect on the operating costs, efficiency, and productivity of manufacturing systems. Conventional automated planning approaches often face a trade-off between solution quality and computational effort. Recent studies have investigated the potential of quantum annealing (QA) for solving factory layout planning problems. However, existing studies have mainly focused on individual QA-based formulations, whereas current hybrid QA solvers support multiple model types that combine QA and classical methods. To explore the potential of QA for factory layout planning, this paper benchmarks four QA based approaches implemented with the corresponding solvers, including an iterative binary quadratic model (IBQM), a hybrid discrete quadratic model (HDQM), a hybrid constrained quadratic model (HCQM), and a hybrid nonlinear model (HNLM). To improve scalability, an iterative decomposition strategy is developed for IBQM, while a candidate selection procedure is introduced for HDQM. The approaches are benchmarked against genetic algorithm, particle swarm optimization, and a hybrid tabu search and simulated annealing approach on 14 layout instances with different layout sizes, geometric complexity, spatial restrictions, and transport route configurations. The comparative analysis considers solution quality, computation time, and scalability. The results show that QA-based approaches achieve competitive solution quality and substantial computational advantages, reducing computation time by up to 94.51% relative to the classical reference methods. Among them, IBQM obtains the best solution quality in 78.6% of the instances, with a maximum improvement of 17.41% associated with an 81.34% reduction in computation time. These findings provide a basis for their further application in industrial layout planning.", "url": "https://arxiv.org/abs/2610.35478", "type": "理论+数值", "summary": "1. 该工作针对工厂布局规划，系统基准测试了基于量子退火的四种求解方案：迭代二值二次模型、混合离散二次模型、混合约束二次模型和混合非线性模型。\n2. 其卖点在于以迭代分解和候选筛选提升可扩展性，并在14个布局实例上从解质量、计算时间与扩展性同遗传算法、粒子群和混合禁忌退火对比，最高降低94.51%计算时间。\n3. 量子退火方案总体保持竞争性解质量并具显著计算优势，迭代二值二次模型在78.6%实例中质量最佳、最大提升17.41%且时间降低81.34%，为工业布局规划提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Xiangqian Wu"}, {"name": "Philipp Schworm"}, {"name": "Marcel Wagner"}, {"name": "Jan C. Aurich"}], "featured_authors": [{"name": "Xiangqian Wu"}, {"name": "Philipp Schworm"}, {"name": "Marcel Wagner"}, {"name": "Jan C. Aurich"}], "author_count": 4}, {"id": "2610.35498", "category": "quant-ph", "title": "Fast and accurate rare-event simulation by Markov chain Monte Carlo for general quantum codes", "abstract": "The splitting method estimates logical error rates of quantum error-correcting codes deep in the rare-event regime, where direct Monte Carlo sampling is prohibitively expensive. It relies on a Markov chain Monte Carlo (MCMC) sampler of faulty configurations, usually driven by one-bit-flip proposals. However, one-bit flips have been reported to be trapped on some codes, which biases the estimate. To address this issue, we propose a new kernel that combines locally balanced one-bit-flip proposals with a cluster-exchange move. We benchmark both kernels and direct Monte Carlo on twelve codes under code-capacity bit-flip noise in two ways, by comparing the mean fault weight with an MCMC-independent reference and by measuring the computation time to reach a fixed accuracy. In the first, our kernel agrees with the reference on every code, including those where one-bit flips are trapped. In the second, it is faster than one-bit flips wherever they are trapped, by orders of magnitude on some codes. Furthermore, at the lowest error rate, it is faster than direct Monte Carlo on every code, by more than four orders of magnitude on some.", "url": "https://arxiv.org/abs/2610.35498", "type": "理论+数值", "summary": "1. 该工作针对分裂法估计量子纠错码稀有事件逻辑错误率时单比特翻转MCMC易被俘获的问题，提出一种结合局部平衡翻转提议与簇交换移动的新采样核。\n2. 其技术卖点是用簇交换移动补足单比特翻转在特定码上的遍历性缺陷，在十二个码的码容量比特翻转噪声基准中与独立参考一致，并在受困情形下实现数量级加速。\n3. 在最低错误率下，该核较直接蒙特卡罗在所有测试码上更快、部分码超过四个数量级，为深层稀有事件区的码性能评估提供了可扩展路径。", "summary_source": "deepseek", "authors": [{"name": "Junichi Haruna"}, {"name": "Kotaro Murakami"}], "featured_authors": [{"name": "Junichi Haruna"}, {"name": "Kotaro Murakami"}], "author_count": 2}, {"id": "2610.35513", "category": "quant-ph", "title": "Geometric aspects of fault tolerance", "abstract": "We highlight three geometric aspects of fault tolerance. First, we construct an operator-algebraic formulation of the fiber bundle framework for fault tolerance, and show that a generalization of the Knill-Laflamme conditions implies a flat connection for this framework. Next, we develop this framework for Gottesman-Kitaev-Preskill (GKP) codes. We show that, for each polarization type, their moduli space embeds smoothly into a Grassmannian of finite-dimensional subspaces of a regularized distribution space. Finally, we explain how GKP codes associated with Jacobians give rise to magic states that can be obtained by code space projections of Gaussian states and identify a $\\rm CCZ$-type magic state arising this way.", "url": "https://arxiv.org/abs/2610.35513", "type": "理论", "summary": "1. 该工作从几何角度系统阐述容错，建立容错纤维丛框架的算子代数表述，并将其推广到GKP码。\n2. 其核心在于证明广义Knill-Laflamme条件蕴含平坦联络，且按极化类型GKP码的模空间可光滑嵌入正则化分布空间的有限维Grassmann流形。\n3. 与Jacobian相关的GKP码可通过高斯态的码空间投影产生magic态，并识别出CCZ型magic态，为几何编码与魔术态构造提供启发。", "summary_source": "deepseek", "authors": [{"name": "Jonathan Conrad"}], "featured_authors": [{"name": "Jonathan Conrad"}], "author_count": 1}, {"id": "2610.35555", "category": "quant-ph", "title": "Quantum state revivals, time quasicrystals, and entanglement steering in a Fibonacci-driven central-spin model", "abstract": "Motivated by the search for non-equilibrium phases of matter beyond the Floquet paradigm, we propose a route to
