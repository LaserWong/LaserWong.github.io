  <style>
    :root {

    }

      padding: 30px;
      border: 1px solid var(--line);

      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));

      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;

    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }

    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

    .author-item { display: grid; gap: 4px; }

    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }

    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }

    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2609.04291", "category": "cond-mat", "title": "Reproducible capillary fluctuation analysis of solid-liquid interfaces for stiffness and anisotropy calculations", "abstract": "The capillary fluctuation method (CFM) is widely used to compute solid--liquid interfacial properties from atomistic simulations, but its accuracy depends on choices in interface construction, wave-vector selection, sampling, and simulation geometry. Here, we develop a diagnostics-driven workflow for reproducible CFM calculations using pure Al as a representative system. Employing both ribbon models and thick two-dimensional references, we show that apparent linearity of the fluctuation spectrum alone does not ensure reliable stiffness or anisotropy estimates. Instead, a reliable CFM analysis requires a fitting window consistent with both temporal sampling and continuum capillary-wave assumptions, systematic sensitivity tests of the interface identification procedure, explicit propagation of replica variability, and independent verification of model-thickness convergence. We further propose a practical thickness-selection rule based on coexistence-temperature consistency, which enables finite-size effects to be controlled while retaining the substantial computational efficiency of ribbon geometries. By making the main sources of uncertainty explicit and diagnosable, the proposed workflow improves the reliability of the CFM as a quantitative tool and provides a foundation for its broader application to complex solid--liquid interfaces.", "url": "https://arxiv.org/abs/2609.04291", "type": "理论+数值", "summary": "1. 该工作以纯铝为模型体系，发展了一套基于诊断驱动的毛细涨落法工作流，用于可重复地计算固液界面刚度与各向异性。\n2. 主要技术观点是仅凭谱表观线性不足以保证结果可靠，分析须同时匹配时间采样与连续毛细波假设，并开展界面识别敏感性、副本涨落传播和厚度收敛检验；还提出基于共存温度一致性的厚度选取规则以控制有限尺寸效应。\n3. 该工作将不确定来源显式化且可诊断，提升了毛细涨落法作为定量工具的可靠性，并为推广至复杂固液界面提供了坚实基础。", "summary_source": "deepseek", "authors": [{"name": "Kai Liu"}, {"name": "Douglas E. Spearot"}, {"name": "Damien Tourret"}], "featured_authors": [{"name": "Kai Liu"}, {"name": "Douglas E. Spearot"}, {"name": "Damien Tourret"}], "author_count": 3}, {"id": "2609.04319", "category": "cond-mat", "title": "Exact quantum spin liquids with topological order on maple-leaf and trellis lattices", "abstract": "We construct spin models with bond-dependent anisotropic interactions on the penta-coordinated maple-leaf and trellis lattices, which yield exact $\\mathbb{Z}_2$ quantum spin liquids akin to the Kitaev honeycomb model. We characterize the resulting ground states by their flux sectors, Chern numbers, and topological excitations. Using replica exchange quantum Monte Carlo simulations, we find that the gauge fluxes are ordered at sufficiently low temperatures such that every unit triangle has $\\pm \\pi/2$-flux, where the sign is uniform across the system, and every unit hexagon (square) has $0$-flux ($\\pi$-flux) within the parameter space of interest. We map out the topological phase diagram for each model, which reveals parameter regimes hosting $\\mathbb{Z}_2$ and Ising topological orders, and we derive an analytical expression for the mass term of the Majorana fermions, the vanishing of which indicates a transition between these phases. We further establish the correspondence between individual vortices (i.e., flux excitations) and two species of anyons in the dimer limit, overcoming the obstacle faced by degenerate perturbation theory in treating odd-length elementary plaquettes. Interestingly, we find that two dimer limits of the maple-leaf model with distinct assignments of anyon species can be smoothly connected to each other in the vortex-free sector, but they are separated by fermion-gap-closing transitions in certain two-vortex sectors.", "url": "https://arxiv.org/abs/2609.04319", "type": "理论+数值", "summary": "1. 作者在具有五配位环境的枫叶与栅格晶格上构造含键依赖各向异性相互作用的自旋模型，获得与Kitaev蜂窝模型类似的精确Z2量子自旋液体。\n2. 结合副本交换量子蒙特卡洛与解析推导，他们刻画低温下规范通量序、陈数与拓扑激发，并导出马约拉纳费米子质量项以判定拓扑相变。\n3. 该工作建立的二聚化极限涡旋-任意子对应绕开了奇元环微扰困难，揭示不同任意子配分可平滑连接或经能隙闭合分离，为复杂格点拓扑序研究提供了范例。", "summary_source": "deepseek", "authors": [{"name": "Li Ern Chern"}, {"name": "Roderich Moessner"}, {"name": "Claudio Castelnovo"}], "featured_authors": [{"name": "Li Ern Chern"}, {"name": "Roderich Moessner"}, {"name": "Claudio Castelnovo"}], "author_count": 3}, {"id": "2609.04359", "category": "cond-mat", "title": "Quantum oscillations of helical edge states of periodically deformed 2D topological insulator in magnetic field", "abstract": "We study edge-state transport in a two-dimensional topological insulator with a periodically deformed edge subjected to a uniform magnetic field. Zeeman coupling breaks time-reversal symmetry and enables elastic backscattering, producing oscillations of the forbidden-band widths. In the strong-field regime, the gaps can close completely at discrete field values. In the weak-field regime, we identify an important class of periodic deformations for which the dominant semiclassical scattering is controlled by complex infinity rather than by the nearest turning points. We develop a semiclassical treatment of this process and establish its agreement with perturbation theory and direct numerical calculations. The gap modulation should produce observable oscillations of the edge conductance. Unlike conventional magnetic quantum oscillations, which are periodic in inverse field, the predicted oscillations are periodic in the magnetic field itself, with a period determined by the Fermi velocity and effective g-factor", "url": "https://arxiv.org/abs/2609.04359", "type": "理论+数值", "summary": "1. 该工作在均匀磁场中研究了周期变形二维拓扑绝缘体边缘态的输运，发现塞曼耦合破坏时间反演对称并引起弹性背散射，使禁带宽度随磁场振荡。\n2. 技术要点是弱场区间识别出一类周期变形，其主导半经典散射由复无穷远而非最近转向点决定，所建立的半经典方法与此前微扰理论与数值计算一致。\n3. 由于禁带调制可使边缘电导产生振荡，且振荡周期正比于磁场本身而非其倒数，周期由费米速度与有效g因子决定，可作为异于传统磁量子振荡的可观测特征。", "summary_source": "deepseek", "authors": [{"name": "A. V. Tsvetkova"}, {"name": "P. D. Grigoriev"}, {"name": "Ya. I. Rodionov"}], "featured_authors": [{"name": "A. V. Tsvetkova"}, {"name": "P. D. Grigoriev"}, {"name": "Ya. I. Rodionov"}], "author_count": 3}, {"id": "2609.04378", "category": "cond-mat", "title": "Fukui-Kawakami chains: spectrum and hidden $\\mathfrak{gl}(1|1)$-symmetry", "abstract": "Fukui and Kawakami showed that the trigonometric Haldane--Shastry (HS) spin chain can be deformed by introducing twisted boundary conditions. In this work we revisit the resulting twisted HS chains, which we call Fukui--Kawakami (FK) chains. We analyse their spectra in dependence of the twist parameter, utilising a direct connection with the (untwisted) HS chain. This allows us to explain why part of the spectrum can be described by Fukui and Kawakami's twisted Bethe equations, and can be constructed from Yangian highest weight states. These states can be labelled by combinatorial data called `motifs', as in the HS chain, which cover some of the (deformed) descendants. We furthermore show that there are other descendants which do not follow from these Bethe equations, but whose energy can be described as a sum of two single-particle energies, suggesting additional hidden symmetries. We then focus on the special case of antiperiodic boundary conditions, and show that this chain coincides with the `minimally polarised' long-range model recently introduced by Basu-Mallick, Finkel, and González-López. Remarkably, this connection implies that the antiperiodic chain has a hidden $\\mathfrak{gl}(1|1)$-symmetry, which we use to relate the HS motifs to their `supersymmetric' $\\mathfrak{gl}(1|1)$ counterparts.", "url": "https://arxiv.org/abs/2609.04378", "type": "理论", "summary": "1. 该工作重新审视Fukui-Kawakami扭曲Haldane-Shastry自旋链，借助与未扭曲HS链的直接联系，系统刻画了其能谱对扭曲参数的依赖。\n2. 主要发现是反周期边界条件下该链等价于最小极化长程模型，由此揭示其隐藏的\\(\\mathfrak{gl}(1|1)\\)超对称，并利用该对称性将HS motifs映射为超对称对应物，同时解释了扭曲Bethe方程适用态与特殊后代态的谱结构。\n3. 这为长程可积自旋链隐藏超对称的普适性提供了新证据，也为研究更一般边界条件或多组分推广模型中motifs的分类与动力学提供了可行方向。", "summary_source": "deepseek", "authors": [{"name": "Rob Klabbers"}, {"name": "Antoine Lefebvre"}], "featured_authors": [{"name": "Rob Klabbers"}, {"name": "Antoine Lefebvre"}], "author_count": 2}, {"id": "2609.04380", "category": "cond-mat", "title": "Speed-quality tradeoff in a physical model of molecular sorting", "abstract": "Eukaryotic cells rely on membrane-mediated processes to compartmentalize biomolecules, counteracting diffusion-driven homogenization. These processes involve the selective sorting and packing of molecules into lipid vesicles, which are then dispatched to appropriate intracellular destinations. Previous works introduced an abstract statistical physics framework for studying this molecular distillation process, where the membrane was treated as static and the focus was on molecular aggregation and extraction. Here, we extend this framework to explicitly incorporate dynamic membrane behavior, including bending, curvature generation, and changes in membrane size due to vesicle fusion and fission events. Sorting domains drive membrane curvature, leading to vesicle formation, detachment, and a molecular distillation process that alters membrane size. Using mesoscopic modeling and numerical tools, we investigate the resulting interplay between membrane mechanics and molecular sorting. We determine a well-defined parameter region where vesicle fission and efficient molecular sorting occur, controlled by membrane rigidity, spontaneous curvature, and pressure difference across the membrane. We further identify a trade-off between speed and quality of molecular distillation: parameters that accelerate vesicle formation tend to reduce the quality of distillation, and vice versa. We propose maximization of the rate of negative entropy production as a natural criterion to optimally balance these competing effects. In this context, optimal parameters emerge naturally from the coupled dynamics of molecular aggregation and membrane mechanics, suggesting a possible strategy for cellular sorting systems to strike an efficient balance between rapid vesicle formation and high sorting quality.", "url": "https://arxiv.org/abs/2609.04380", "type": "理论+数值", "summary": "1. 该工作将分子分选的统计物理框架推广至动态膜系统，显式计入弯曲、曲率生成及囊泡融合与分裂引起的膜尺寸变化。\n2. 其核心发现在于膜刚度、自发曲率和跨膜压差控制分裂与分选效率，并揭示囊泡形成速度与分选质量之间存在固有的权衡。\n3. 作者提出以负熵产生率最大化作为优化判据，为细胞分选系统平衡快速形成与高保真分选提供了自洽的方案与启示。", "summary_source": "deepseek", "authors": [{"name": "Elisa Floris"}, {"name": "Damiano Andreghetti"}, {"name": "Thibaut Caplet"}, {"name": "Luca Dall'Asta"}, {"name": "Andrea Gamba"}], "featured_authors": [{"name": "Elisa Floris"}, {"name": "Damiano Andreghetti"}, {"name": "Thibaut Caplet"}, {"name": "Luca Dall'Asta"}, {"name": "Andrea Gamba"}], "author_count": 5}, {"id": "2609.04397", "category": "cond-mat", "title": "Accelerating Atom Simulations with Variable-Block Sparse Matrix Library", "abstract": "Modern atomistic simulations increasingly employ localized orbitals to represent quantum operators, yielding sparse block matrices whose block shapes vary with chemical species and basis choice. Conventional scalar sparse formats store the entries of each block individually, obscuring this local structure and limiting the use of efficient block algorithms. We present VBCSR, a distributed sparse matrix library that preserves variable-size atomic blocks and accelerates the core linear algebra of large-scale atomistic simulations. A unified interface automatically maps scalar, uniform-basis, and multispecies operators to compressed sparse row (CSR), block sparse row (BSR), or variable-block compressed sparse row (VBCSR). Our advanced acceleration method groups blocks of equal shape and dispatches them to optimized dense kernels. In the reported benchmarks, VBCSR outperforms the tested Python-accessible reference implementations for several block-sparse benchmarks. We further demonstrate VBCSR in an InP nanoparticle application containing more than \\(10^6\\) atoms.", "url": "https://arxiv.org/abs/2609.04397", "type": "理论+数值", "summary": "1. 该工作提出了分布式稀疏矩阵库VBCSR，通过保留随化学物种和基组变化的原子分块，加速局域轨道原子模拟的核心线性代数。\n2. 其技术卖点是将形状相同的块分组并派发至优化的稠密内核，同时用统一接口自动映射CSR、BSR与VBCSR格式，并在稀疏基准上超越所测试的Python参考实现。\n3. 在超过10^6个原子的InP纳米粒子算例中验证了扩展性，为大尺度多物种局域基组电子结构及材料模拟提供了高性能基础工具与明确启发。", "summary_source": "deepseek", "authors": [{"name": "Zhanghao Zhouyin"}, {"name": "Hong Guo"}], "featured_authors": [{"name": "Zhanghao Zhouyin"}, {"name": "Hong Guo"}], "author_count": 2}, {"id": "2609.04399", "category": "cond-mat", "title": "Composition-dependent nonlinear viscoelastic-viscoplastic behavior and constitutive framework for digitally mixed polymers spanning the glass transition", "abstract": "Multi-material PolyJet printing produces voxel-scale digital mixtures of an elastomeric photopolymer (Agilus) and a glassy photopolymer (Vero), giving a material family whose room-temperature response ranges from elastomeric to glassy; a unified description spanning the family has remained challenging. Large-deformation uniaxial compression over nearly three orders of magnitude in strain rate reveals a nonlinear, rate-dependent load-unload response that evolves continuously with composition, from recoverable elastomeric hysteresis to glassy yield with post-yield softening, hardening, and substantial residual strain. Dynamic mechanical analysis (DMA) shows that each mixture has a single glass transition temperature ($T_g$) that shifts to higher temperature with both Vero fraction and frequency, so composition acts much as temperature or loading rate does. This time-composition equivalence motivates one constitutive structure for the whole family rather than a separate property set per mixture: an equilibrium hyperelastic network with three non-equilibrium, rate-dependent branches carrying reptational, intermolecular, and glassy resistance. Its properties are anchored at the two endpoints and interpolated by smooth composition scaling laws. The model captures the compression response of all seven calibrated compositions and predicts a withheld mixture from the scaling laws alone. Resolving the predicted stress into its branches shows the load passing from the elastomeric to the glassy mechanism, and the work from elastic storage to dissipation, as Vero content and rate rise. The glass transition that DMA maps at small strain therefore governs the large-strain deformation mechanisms. The framework gives a compact, physically based description of digitally mixed polymers and a predictive basis for designing functionally graded, architected multi-material structures.", "url": "https://arxiv.org/abs/2609.04399", "type": "理论", "summary": "1. 该工作研究了跨越玻璃化转变的数字混合聚合物体系，建立了组分依赖的非线性黏弹-黏塑性本构框架，并基于宽应变率压缩与动态力学分析表征了七种配方的力学响应。\n2. 其核心卖点是揭示时间-组分等效性，即以平衡超弹性网络叠加三条率相关非平衡分支的统一模型，由端点性质经组分标度律插值，无需逐组分独立拟合。\n3. 这为功能梯度与拓扑优化多材料结构的力学设计提供了可预测的物理基础，并暗示小应变玻璃转变可支配大应变变形机制。", "summary_source": "deepseek", "authors": [{"name": "Beijun Shen"}, {"name": "Mary C. Boyce"}], "featured_authors": [{"name": "Beijun Shen"}, {"name": "Mary C. Boyce"}], "author_count": 2}, {"id": "2609.04517", "category": "cond-mat", "title": "Calculation of DFT Spin-Orbit Spillage with Quantum ESPRESSO", "abstract": "This work describes the calculation of spin-orbit spillage from a crystal structure. Spin-orbit spillage provides a measure of the likelihood that a material has topological character. The spillage also provides the reference quantity for the machine-learning classifier of Choudhary et al., which predicts whether the spillage exceeds a specified threshold rather than the calculation of its numerical value directly. The complete computation workflow was applied to the insulating compound BaMg2Bi2, yielding a spillage of 2.094 compared with the published VASP spillage of 2.075, corresponding to a difference of 0.9%. The calculation is described in terms of two Quantum ESPRESSO (QE) calculations of spillage performed with and without spin-orbit coupling, the role of relativistic pseudopotentials, and the subsequent wavefunction-overlap analysis. The limitations of the same calculation procedure for semimetals are also examined.", "url": "https://arxiv.org/abs/2609.04517", "type": "理论+数值", "summary": "1. 本文报道了用Quantum ESPRESSO从晶体结构实现自旋轨道spillage计算的DFT流程，并在绝缘体BaMg2Bi2上算出2.094，较VASP报道值2.075相差0.9%。\n2. 其要点是通过含与不含自旋轨道耦合的两次QE计算，结合相对论赝势与波函数交叠分析，为拓扑性判定以及Choudhary等人基于spillage阈值的机器学习分类提供可复现的输入参考。\n3. 半金属体系中该流程存在局限，提示后续需针对近简并能带与波函数交叠处理做改进；对绝缘体类拓扑候选材料的高通量筛选具有直接借鉴意义。", "summary_source": "deepseek", "authors": [{"name": "Duy Quan Nguyen"}, {"name": "Paul C. H. Li"}], "featured_authors": [{"name": "Duy Quan Nguyen"}, {"name": "Paul C. H. Li"}], "author_count": 2}, {"id": "2609.04548", "category": "cond-mat", "title": "From Single-Chain Dynamics to Structure Formation: Dynamic Self-Consistent Field Theory and Molecular Dynamics of (Co)polymer Melts across Entanglement Regimes", "abstract": "Dynamic self-consistent field theory (DSCFT) provides an efficient continuum framework for studying structure formation in inhomogeneous polymer systems, but its predictive accuracy depends on the choice of the nonlocal mobilities. Here, we construct mobility functions for moderately and strongly entangled homopolymer and diblock copolymer systems from the relaxation dynamics of single-chain structure factors, based on molecular dynamics (MD) simulations of the Kremer-Grest model and analytical reptation theory. Single- chain mobilities are combined such that the resulting DSCFT accounts for the dependence of fluxes on local chain densities. The theory is then applied to the spinodal decomposition of symmetric homopolymer blends and diblock copolymer melts following a quench into the (micro)phase-separation regime. Predictions of DSCFT are systematically compared with MD simulations. Mobility functions derived from single-chain dynamics are found to reproduce the kinetics of structure formation more accurately than conventional Debye-type mobilities. We additionally investigate the influence of adding stochastic currents (noise) that are correlated according to the fluctuation-dissipation relation. At low noise levels, they enable the generation of equilibrium initial states and facilitate defect annealing. At high noise levels, however, nonolinear effects lead to discrepancies between DSCFT and MD simulations.", "url": "https://arxiv.org/abs/2609.04548", "type": "理论+数值", "summary": "1. 该工作从单链结构因子弛豫动力学出发，为纠缠均聚物与双嵌段共聚物熔体构建动态自洽场理论中的迁移率函数，并系统对比分子动力学模拟。\n2. 其技术卖点在于结合蛇行理论与非局域迁移率构造，使通量依赖局域链密度，较传统Debye型迁移率更准确描述淬火后的旋节分解与微相分离动力学。\n3. 研究发现低强度涨落噪声有助于生成平衡初态并退火缺陷，而高强度噪声引发非线性偏差，这为发展含涨落的动态自洽场方法提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Alireza F. Behbahany"}, {"name": "Jafar Charghalizadeh"}, {"name": "Friederike Schmid"}], "featured_authors": [{"name": "Alireza F. Behbahany"}, {"name": "Jafar Charghalizadeh"}, {"name": "Friederike Schmid"}], "author_count": 3}, {"id": "2609.04558", "category": "cond-mat", "title": "Structural tuning of reduced exciton mass in layered HOIP compounds: Causation vs. correlation", "abstract": "Reduced exciton mass ($\\mu$) was recently reported to correlate strongly with a framework distortion in a series of nine single-layer (2D) metal-halide perovskite (HOIP) compounds. Specifically, $\\mu$ was observed to increase in tandem with an alternating PbI4 octahedral tilt about an in-plane axis. In this work, we use group representation theory to decompose the observed framework distortions into displacive symmetry modes of a common high-symmetry parent framework. We find that all nine distorted frameworks involve linear combinations of the same six symmetry modes, which have been reported to contribute to the framework distortions of a wide range of HOIP compounds. We show that these modes have highly correlated impacts on the band structure. To differentiate causation from correlation, we vary the amplitude of each mode independently and use density-functional theory to determine the resulting electronic band structures, from which $\\mu$ is extracted. We find that bond-transverse displacements of the equatorial halide atoms increase $\\mu$, while bond-transverse displacements of the apical halide atoms decrease it. Bond-axis displacements appear to have little or no effect on $\\mu$. Our results demonstrate three new structure-property relationships, revealing a promising new avenue for exciton engineering in layered perovskite materials.", "url": "https://arxiv.org/abs/2609.04558", "type": "理论", "summary": "1. 该工作通过群表示理论将九种单层杂化金属卤化物钙钛矿的框架畸变分解为对称位移模式，并借助密度泛函理论独立调节各模式振幅，以区分激子约化质量变化中的因果与相关。\n2. 其技术要点在于揭示所有畸变均由同一组六种对称模式组合而成，且模式间对带结构的影响高度关联；赤道面卤素键横位移增大μ，顶端卤素键横位移减小μ，键向位移几乎无影响。\n3. 这为利用特定卤素位移模式调控层状钙钛矿激子输运与束缚性质的新型激子工程提供了明确的结构-性质关系与研究方向。", "summary_source": "deepseek", "authors": [{"name": "Isaac R. Burkholder"}, {"name": "Cindy Y. Wong"}, {"name": "André Schleife"}, {"name": "Kameron R. Hansen"}, {"name": "John S. Colton"}, {"name": "Branton J. Campbell"}], "featured_authors": [{"name": "Isaac R. Burkholder"}, {"name": "Cindy Y. Wong"}, {"name": "André Schleife"}, {"name": "Kameron R. Hansen"}, {"name": "John S. Colton"}, {"name": "Branton J. Campbell"}], "author_count": 6}, {"id": "2609.04605", "category": "cond-mat", "title": "Light alkali metal functionalized two-dimensional C5N monolayers for enhanced hydrogen storage", "abstract": "This work presents a density functional theory (DFT) investigation of a two-dimensional (2D) C5N monolayer functionalized with Li, Na, and K for hydrogen storage. Pristine C5N exhibits weak H2 adsorption, while alkali-metal functionalization significantly enhances its storage capability. The C5N monolayer can stably accommodate up to six metal dopants, with binding energies stronger than the corresponding cohesive energies, indicating resistance to metal aggregation. Ab initio molecular dynamics simulations further confirm the thermal stability of the functionalized systems at 300 K. Charge transfer from the metal dopants to C5N enhances polarization and strengthens H2 adsorption. Each dopant can adsorb up to eight H2 molecules, yielding a maximum of 48 H2 molecules per unit cell and gravimetric storage capacities of 9.42, 8.61, and 7.93 wt% for Li-, Na-, and K-functionalized C5N, respectively. The average H2 adsorption energies of -0.16 to -0.17 eV/H2 indicate moderate interactions suitable for reversible storage. Thermodynamic analysis further demonstrates favourable H2 adsorption/desorption under practical operating conditions, while desorption-temperature, recovery-time, and volumetric analyses support the potential reversibility and storage performance of these systems. Overall, alkali-metal-functionalized C5N emerges as a promising 2D material for efficient and reversible H2 storage.", "url": "https://arxiv.org/abs/2609.04605", "type": "理论+数值", "summary": "1. 该工作用密度泛函理论系统研究了Li、Na、K功能化二维C5N单层的储氢性能与稳定性。\n2. 金属向C5N的电荷转移增强极化，使每个掺杂原子可吸附多达八个H2，最高储氢容量约9.4 wt%，平均吸附能约-0.16 eV/H2。\n3. 这为设计可逆、高效储氢的二维材料提供了明确方向，并提示可进一步探索其他碱金属或掺杂物。", "summary_source": "deepseek", "authors": [{"name": "Gom Dorji"}, {"name": "Sonam Peden"}, {"name": "Syed Faraz Hasan"}, {"name": "Kondo-Francois Aguey-Zinsou"}, {"name": "Tanveer Hussain"}], "featured_authors": [{"name": "Gom Dorji"}, {"name": "Sonam Peden"}, {"name": "Syed Faraz Hasan"}, {"name": "Kondo-Francois Aguey-Zinsou"}, {"name": "Tanveer Hussain"}], "author_count": 5}, {"id": "2609.04623", "category": "cond-mat", "title": "Hydrogen Storage on Transition-Metal-Decorated Nitrogen-Modified Carbon Nanoribbons", "abstract": "Recently synthesized carbon nanoribbons (CNRs) were investigated for hydrogen (H2) storage using first-principles density functional theory calculations. Pristine CNRs exhibited weak H2 adsorption; therefore, the host structure was modified by substituting carbon atoms at the C-H edges with 12 nitrogen atoms, followed by Mn and Y doping to enhance H2 binding. A maximum of five metal atoms could be accommodated on the 12N-CNRs. Electronic structure analysis revealed strong orbital hybridization between the metal atoms and the CNRs, while binding energy calculations confirmed the structural stability of the doped systems. Bader charge analysis further quantified the charge transfer between the metal atoms and the host structure. The average H2 adsorption energies were calculated to be -0.40 eV/H2 for the Mn-doped system and -0.25 eV/H2 for the Y-doped system, which are within the desirable range for reversible hydrogen storage. The maximum theoretical gravimetric storage capacities at 0 K reached 7.48 wt% for the Mn-doped system and 6.55 wt% for the Y-doped system. Under practical conditions of 30 atm and 298.15 K, the storage capacity of the Y-doped system decreased to 6.04 wt%, whereas the Mn-doped system maintained its full capacity of 7.48 wt%. Thermodynamic analysis indicated that H2 adsorption is favored at low temperatures and high pressures, while desorption becomes feasible at elevated temperatures and lower pressures. These results demonstrate that Mn- and Y-doped CNRs satisfy key U.S. Department of Energy requirements for reversible H2 storage and show promise as potential hydrogen storage materials under near-ambient conditions.", "url": "https://arxiv.org/abs/2609.04623", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算，研究Mn或Y修饰的氮取代碳纳米带作为可逆储氢材料的性能。\n2. 关键在于氢平均吸附能为-0.40至-0.25 eV/H2，处于可逆储氢理想区间，Mn体系在近环境条件下仍保有7.48 wt%容量。\n3. 这为设计满足美国能源部储氢指标并在温和条件下工作的轻质碳基储氢材料提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Gom Dorji"}, {"name": "Amrutha M"}, {"name": "Brahmananda Chakraborty"}, {"name": "Sonam Peden"}, {"name": "Syed Faraz Hasan"}, {"name": "Shabbir Ahmad Tanveer Hussain"}], "featured_authors": [{"name": "Gom Dorji"}, {"name": "Amrutha M"}, {"name": "Brahmananda Chakraborty"}, {"name": "Sonam Peden"}, {"name": "Syed Faraz Hasan"}, {"name": "Shabbir Ahmad Tanveer Hussain"}], "author_count": 6}, {"id": "2609.04625", "category": "cond-mat", "title": "Enhanced Multifractality Induced by Non-Hermitian Disorder in Quantum Percolation", "abstract": "We investigate the interplay between geometric dilution and non-Hermitian disorder in the two-dimensional quantum site-percolation model. Non-Hermiticity is introduced through random imaginary on-site potentials, representing spatially uncorrelated gain and loss, while the hopping amplitudes remain reciprocal. By combining complex level-spacing statistics, participation entropy, and multifractal analysis, we characterize the localization properties of the eigenstates as functions of the disorder and the non-Hermiticity strength. Our finite-size scaling results show that non-Hermitian disorder shifts the quantum percolation threshold ($p_q$) toward larger occupation probabilities. Consequently, the fully delocalized phase is progressively suppressed and disappears at sufficiently strong disorder. This suppression is not a simple consequence of adding on-site disorder of a given strength, but is specifically enhanced by its imaginary character, as an equally strong real (Hermitian) on-site potential produces a weaker shift of $p_q$. Nevertheless, the intermediate region between the classical ($p_c$) and quantum percolation thresholds presents a genuine multifractal critical phase, while the localization-length exponent $\\nu$ remains the same, relative to its Hermitian value. Altogether, our results demonstrate that random gain and loss enhance the multifractal regime while preserving the universality class of the quantum percolation transition.", "url": "https://arxiv.org/abs/2609.04625", "type": "理论+数值", "summary": "1. 该工作采用复能级间距统计、参与熵与多分形分析，研究了二维量子位点逾渗模型中由随机虚数在位势引入的非厄米无序与几何稀释的相互作用。\n2. 主要物理亮点在于，非厄米无序比等强实（厄米）无序更显著地推向量子逾渗阈值 p_q，抑制完全退局域相，并在经典阈值 p_c 与 p_q 之间引发真正的多分形临界相，同时局域化长度指数 ν 保持厄米值不变。\n3. 这为通过随机增益与损耗调控分形临界态、而不改变量子逾渗跃迁普适类的实验与理论探索提供了清晰方向和可检验预言。", "summary_source": "deepseek", "authors": [{"name": "W. S. Oliveira"}, {"name": "Julian Faundez"}, {"name": "Rodrigo Arouca"}, {"name": "Welles Morgado"}], "featured_authors": [{"name": "W. S. Oliveira"}, {"name": "Julian Faundez"}, {"name": "Rodrigo Arouca"}, {"name": "Welles Morgado"}], "author_count": 4}, {"id": "2609.04668", "category": "cond-mat", "title": "Breakdown of the Overdamped Approximation in Fluctuating Environments", "abstract": "The overdamped approximation is widely used to describe Brownian motion in complex environments, but its validity becomes nontrivial when the friction coefficient itself fluctuates in time. We investigate this problem by comparing underdamped and overdamped Langevin dynamics subject to the same fluctuating friction and satisfying the fluctuation--dissipation relation at a common temperature. We show that environmental averaging and inertial elimination generally lead to different long-time transport when environmental fluctuations are fast compared with velocity relaxation. For rapidly fluctuating friction, the underdamped dynamics is governed by the arithmetic mean friction and yields $D_{\\rm eff}^{\\rm under}=k_{\\rm B}T/\\langle\\gamma\\rangle$, whereas the overdamped dynamics gives $D_{\\rm eff}^{\\rm over}=k_{\\rm B}T\\langle\\gamma^{-1}\\rangle$. For a two-state Markov friction, we derive the finite-time effective diffusion coefficient exactly and identify the full crossover between these two regimes, controlled by the competition between velocity relaxation and environmental switching. We further establish the fast-fluctuation result for general stationary friction processes and verify it for a continuous log-Ornstein--Uhlenbeck environment, for which the characteristic crossover time can also be determined independently. Our results reveal a noncommutativity between environmental averaging and inertial elimination, establish a timescale-dependent criterion for the validity of overdamped dynamics in temporally heterogeneous environments, and show that rapid environmental fluctuations can enhance, rather than suppress, the consequences of inertia.", "url": "https://arxiv.org/abs/2609.04668", "type": "理论", "summary": "1. 该工作考察摩擦系数自身随时间涨落的朗之万动力学，严格比较同一温度下欠阻尼与过阻尼描述在长时间输运行为上的异同。\n2. 核心结果是环境涨落快于速度弛豫时，惯性平均给出D=kBT/〈γ〉，而过阻尼近似给出D=kBT〈γ−1〉，两者之差由环境切换与速度弛豫的竞争控制，并用双态马尔可夫摩擦精确得到有限时间扩散系数及完整渡越。\n3. 该工作揭示了环境平均与惯性消除不可对易，建立过阻尼近似有效性的时间尺度判据，并表明快速环境涨落会增强而非抑制惯性影响。", "summary_source": "deepseek", "authors": [{"name": "Kazuki Fukutani"}, {"name": "Takuma Akimoto"}], "featured_authors": [{"name": "Kazuki Fukutani"}, {"name": "Takuma Akimoto"}], "author_count": 2}, {"id": "2609.04717", "category": "cond-mat", "title": "Mean-field theory for quantum spin chains", "abstract": "Mean-field theory is a widely used approximation for describing phase transitions, particularly effective above the upper critical dimension. Its origins can be traced back to the van der Waals theory of the liquid-gas transition and Weiss's molecular field theory of the paramagnetic-ferromagnetic transition. However, it was Lev D. Landau who provided a unifying and general framework applicable to a broad class of physical systems. The mean-field approach typically involves neglecting thermal fluctuations, which is a reasonable assumption in many classical contexts. However, its application to quantum phase transitions at zero temperature is less common. The aim of this short pedagogical paper is to explore and clarify the use of the mean-field approach in the less familiar domain of quantum phase transitions. We specifically consider the Ising model and the Blume-Capel model.", "url": "https://arxiv.org/abs/2609.04717", "type": "理论", "summary": "1. 该文以伊辛模型和Blume-Capel模型为例，阐明平均场理论在零温量子相变中的处理方式与适用条件。\n2. 其技术要点在于系统考察量子自旋链中忽略量子涨落后的平均场自洽方案及其在低维体系下的失效边界。\n3. 这为量子相变教学中连接经典统计物理与量子多体近似提供了清晰范例，也对更精细涨落理论的改进具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Mylène Martirosyan"}, {"name": "Astrid Monin-Baroille"}, {"name": "Leïla Moueddene"}, {"name": "Mohammed M. Shabat"}, {"name": "Bertrand Berche"}], "featured_authors": [{"name": "Mylène Martirosyan"}, {"name": "Astrid Monin-Baroille"}, {"name": "Leïla Moueddene"}, {"name": "Mohammed M. Shabat"}, {"name": "Bertrand Berche"}], "author_count": 5}, {"id": "2609.04719", "category": "cond-mat", "title": "Scaling laws and energy dissipation in the dynamics of SLE curve as a 1D turbulence model", "abstract": "In this study, we demonstrate the characteristics of the stochastic Loewner evolution (SLE) as a one-dimensional (1D) turbulence model. First, we show that the diffusion process $x(t)$ obtained by the time coordinate change in the SLE becomes the time dependent diffusion process that satisfies Richardson's law of this http URL , we derive the condition on the diffusivity parameter $\\kappa$ such that the diffusion process $x(t)$ satisfies Kolmogorov's 4/5th law, which determines the relation between the mean energy dissipation and velocity in the particles of turbulence. Further mathematical analysis showed that this condition is seen as the condition on Loewner entropy $S_{\\mathrm{Loew}}$, which includes the white Gaussian noise term $W_{s}$ in the Loewner driving function of the present model. In addition, the numerical simulations were performed to verify the scaling relations of this 1D turbulence model. These results suggest that the standard SLE becomes a beneficial model of 1D turbulence by introducing an appropriate time coordinate change and imposing the conditions on $\\kappa$ and $S_{\\mathrm{Loew}}$.", "url": "https://arxiv.org/abs/2609.04719", "type": "理论+数值", "summary": "1. 该工作论证了随机Loewner演化(SLE)可作为一维湍流模型，证明由时间坐标变换得到的扩散过程x(t)满足Richardson律。\n2. 其核心是给出扩散参数κ使x(t)满足Kolmogorov 4/5律的条件，建立平均能量耗散与湍流粒子速度的关系，并将该条件归结为含高斯白噪声项的Loewner熵约束。\n3. 数值模拟验证了相关标度律，表明标准SLE在适当时间变换并对κ与Loewner熵施加条件后能成为一维湍流模型，为随机几何与湍流的交叉研究提供新启发。", "summary_source": "deepseek", "authors": [{"name": "Yusuke K. Shibasaki"}], "featured_authors": [{"name": "Yusuke K. Shibasaki"}], "author_count": 1}, {"id": "2609.04729", "category": "cond-mat", "title": "Interlayer Exciton Condensate Stiffness Is Non-Monotonic in Quantum Metric", "abstract": "Identifying the origin of the superfluid stiffness of electron-electron and electron-hole pair condensates is an important issue in flat-band physics. Here, we study the stiffness of bilayer exciton condensates using exact diagonalization and realistic Coulomb interactions across a wide variety of flat Chern band systems, including Landau levels, mixed Landau levels, and moiré bands. We find that stiffness is non-monotonic in the trace of the quantum metric and that it develops peaks when the band wavefunctions are engineered to be similar to those of Landau levels. The stiffness predicted by mean-field theory agrees quantitatively with exact diagonalization in these optimal cases, but systematically overestimates it otherwise. Flat bands with identical quantum geometry tensors can exhibit substantial differences in stiffness. The stiffness of condensates formed between moiré flat bands, which typically have strong variations in Berry curvature and quantum metric across their Brillouin zones, tends to be larger when the bands have non-zero Chern numbers and can be larger than that of Landau levels. Our results reveal a behavior that is richer than that suggested by simple geometric bounds and provide new guiding principles for the design of robust flat-band condensates with large superfluid stiffness.", "url": "https://arxiv.org/abs/2609.04729", "type": "理论+数值", "summary": "1. 该工作通过精确对角化结合现实库仑相互作用，系统计算了多种平带陈带体系中层间激子凝聚的超流刚度。\n2. 主要发现是刚度随量子度量迹非单调变化，并在波函数接近朗道能级时出现峰值；平均场理论仅在最优情形定量准确，否则系统性高估刚度。\n3. 这表明量子几何张量相同或陈数不同的平带可拥有显著不同的凝聚刚度，为设计高刚度平带凝聚体提供了超越简单几何界的指导原则。", "summary_source": "deepseek", "authors": [{"name": "Bo Zou"}, {"name": "Yitong Zhang"}, {"name": "Siddhartha Sarkar"}, {"name": "Shi-Zeng Lin"}, {"name": "Allan H. MacDonald"}, {"name": "Kai Sun"}], "featured_authors": [{"name": "Bo Zou"}, {"name": "Yitong Zhang"}, {"name": "Siddhartha Sarkar"}, {"name": "Shi-Zeng Lin"}, {"name": "Allan H. MacDonald"}, {"name": "Kai Sun"}], "author_count": 6}, {"id": "2609.04732", "category": "cond-mat", "title": "Thermodynamic learning", "abstract": "We discuss the possibility to train a thermodynamic system, whose micro-variables are fully determined through the Hamiltonian by the usual statistical mechanical rules, to perform tasks such as memorization and generalization. Training is achieved by the application of suitable external fields, playing the role of {\\it data}. At variance with conventional machine learning, no other logical or algorithmic rules are introduced. The system is amenable, in principle, to exact analytical calculations. We specialize this general approach to a prototypical Ising system with annealed dichotomous couplings and study its learning ability. Results indicate excellent memorization and good generalization capacity already for small systems, and a tendency to improve with system size.", "url": "https://arxiv.org/abs/2609.04732", "type": "理论+数值", "summary": "1. 该工作提出一种热力学学习方案，将训练数据编码为外加场，使热力学系统仅依哈密顿量与统计力学规则更新微观状态，从而完成记忆与泛化任务。\n2. 其核心卖点是微观变量完全由哈密顿量按统计力学确定，无附加算法规则，且系统原则上可精确解析；针对退火二值耦合伊辛模型的分析显示，即使小系统也能实现良好记忆与泛化，并随尺寸增强。\n3. 该方案表明平衡态系统的统计力学更新即可作为学习机制，为设计可解析的物理学习器件以及理解记忆涌现的物理基础提供了启发。", "summary_source": "deepseek", "authors": [{"name": "F. Corberi"}, {"name": "S. dello Russo"}, {"name": "G. Messuti"}, {"name": "S. Scarpetta"}, {"name": "L. Smaldone"}], "featured_authors": [{"name": "F. Corberi"}, {"name": "S. dello Russo"}, {"name": "G. Messuti"}, {"name": "S. Scarpetta"}, {"name": "L. Smaldone"}], "author_count": 5}, {"id": "2609.04798", "category": "cond-mat", "title": "Field-Driven Coupled Magnon--Phonon--Electron Relaxation in Magnetite Using Steepest-Entropy-Ascent Quantum Thermodynamic Formalism", "abstract": "A field-driven steepest-entropy-ascent quantum thermodynamic (SEAQT) formulation is developed for longitudinal nonequilibrium relaxation in magnetite (Fe$_3$O$_4$) with coupled electron, phonon, and magnon populations. Material-specific excitation spectra define the thermodynamic state space, while one relaxation parameter for each population sets its kinetic scale. A longitudinal magnetic field shifts the dressed magnon eigenenergies while the occupation basis remains fixed; irreversible redistribution conserves instantaneous energy and electron number while allowing the magnon population to vary. The formulation yields nonequilibrium subsystem temperatures, entropy production, magnetic-work identities, and a coupled small-signal susceptibility incorporating energy-conservation feedback among all three populations; the one-pole Debye response appears only as a limiting case. Numerical results under sinusoidal driving show a transition from nearly quasistatic behavior to frequency-dependent lag, finite-amplitude departure from the linear-response ellipse, and increasing higher-harmonic content. Relaxational work per cycle increases strongly with field amplitude and frequency, while the complex susceptibility is broader and shifted relative to a Debye reference. Entropy production remains positive, and the electron, phonon, and magnon temperatures show distinct excursions followed by secular heating when positive magnetic work is retained without heat rejection. The calculated work represents longitudinal magnon quasiparticle relaxation in a homogeneous single-domain model, not the total core loss of a finite ferrite specimen.", "url": "https://arxiv.org/abs/2609.04798", "type": "理论+数值", "summary": "1. 该工作提出磁铁矿中电子-声子-磁子耦合纵向弛豫的场驱动陡熵上升量子热力学(SEAQT)模型。\n2. 各子系仅用一个弛豫参量刻画动力学，磁场改变缀饰磁子能级并满足瞬时能量守恒，推导的小信号磁化率含跨子系能量反馈。\n3. 该热力学一致的单畴框架可为铁氧体纵向磁子弛豫、非线性滞后及场频相关损耗的进一步研究提供基础。", "summary_source": "deepseek", "authors": [{"name": "Deepak Dhariwal"}, {"name": "William T. Reynolds Jr."}, {"name": "Michael R. von Spakovsky"}], "featured_authors": [{"name": "Deepak Dhariwal"}, {"name": "William T. Reynolds Jr."}, {"name": "Michael R. von Spakovsky"}], "author_count": 3}, {"id": "2609.04814", "category": "cond-mat", "title": "Spin-Charge Subordination in the Infinite-$U$ $SU(N)$ Hubbard Chain", "abstract": "We obtain the exact full counting statistics of charge and flavor transport in the one-dimensional infinite-$U$ $SU(N)$ Hubbard model. The no-passing constraint freezes the ordered flavor sequence while the particle coordinates evolve as free spinless fermions. Consequently, charge transfer is governed by a free-fermion determinant, whereas flavor transfer is exactly subordinated to the number of particles crossing the observation cut. For an arbitrary traceless Cartan generator this yields an exact relation between the charge and flavor cumulants. The complete asymptotic flavor distribution is a universal non-Gaussian M-Wright law. Together, these results establish spin--charge subordination as a kinematic mechanism for anomalously slow internal-state transport in one-dimensional impenetrable quantum gases.", "url": "https://arxiv.org/abs/2609.04814", "type": "理论", "summary": "1. 该工作求解了一维无穷U SU(N)Hubbard链中电荷与味输运的精确全计数统计。\n2. 关键机制是：无超越约束使味序冻结而粒子坐标按自由无自旋费米子演化，电荷转移由自由费米子行列式控制，味转移精确从属于穿越观测面的粒子数，并据此对任意无迹Cartan生成元给出电荷与味累积量间的严格关系。\n3. 渐近味分布呈普适非高斯M-Wright形式，说明自旋-电荷从属是强关联一维不可穿透气体内部态输运异常缓慢的运动学原因。", "summary_source": "deepseek", "authors": [{"name": "Cătălin Paşcu Moca"}, {"name": "Ovidiu I. Pâţu"}, {"name": "Gergely Zaránd"}, {"name": "Balázs Dóra"}], "featured_authors": [{"name": "Cătălin Paşcu Moca"}, {"name": "Ovidiu I. Pâţu"}, {"name": "Gergely Zaránd"}, {"name": "Balázs Dóra"}], "author_count": 4}, {"id": "2609.04856", "category": "cond-mat", "title": "The elasticity of semiflexible polymers with reversible spontaneous curvature in two dimensions", "abstract": "Many semiflexible filaments exhibit structural asymmetries that lead to a curved ground state (curvature in the absence of thermal fluctuations, external forces, or torques). This property is known as spontaneous curvature. Many semiflexible polymers can reversibly develop spontaneous curvature through internal conformational transitions or through transient interactions with their molecular environment. In this article, we show that such reversible spontaneous curvature, even in the absence of transitions in the value of the bending stiffness, provides a minimal mechanism for ensemble-dependent elasticity. We formulate an analytically tractable two-state modified wormlike-chain model in two dimensions, in which an uncurved state (without spontaneous curvature) competes with a curved state (possessing spontaneous curvature). The transition is controlled by an activation energy. Within the weak-bending approximation, we obtain the Gibbs and Helmholtz partition functions for a stretched filament with reversible constant (uniform along the backbone) or sinusoidal spontaneous curvature and for a grafted bistable filament driven either by an end torque or a bending force. Stretching or bending induces a crossover from spontaneous-curvature-dominated to entropic elasticity. We show how the elastic response differs in the two ensembles (Gibbs vs Helmholtz). In addition, we consider the case where the curved state is also characterized by a higher value of the bending stiffness. In that case, a reentrant transition is possible as we stretch the bistable filament.", "url": "https://arxiv.org/abs/2609.04856", "type": "理论", "summary": "1. 该工作提出二维半柔性聚合物可逆自发曲率的最小弹性机制，以两态蠕虫链模型刻画无曲率态与有自发曲率态之间的激活能控制转变。\n2. 在弱弯曲近似下解析求出恒常或正弦自发曲率以及接枝双稳细丝在拉伸、端扭矩或弯曲力下的Gibbs与Helmholtz配分函数，揭示自发曲率主导弹性到熵弹性交叉及系综依赖。\n3. 研究表明弯曲刚度随曲率态升高时拉伸可导致重入转变，为可调分子构象转换系统的弹性响应与统计力学系综效应提供可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Donghyeon Kim"}, {"name": "Panayotis Benetatos"}], "featured_authors": [{"name": "Donghyeon Kim"}, {"name": "Panayotis Benetatos"}], "author_count": 2}, {"id": "2609.04883", "category": "cond-mat", "title": "Spin-Point-Group Classification of Multipoles for Nonrelativistic Collinear Magnets", "abstract": "Multipole moments provide a unified symmetry language for describing electronic degrees of freedom and their associated physical responses. Although active multipoles have been systematically classified for crystallographic and magnetic point groups, their classification in spin point groups, which naturally describe magnetic systems in the absence of spin-orbit coupling, has remained unexplored. In this work, we present a complete classification of active orbital and spin multipoles for all 32 nonmagnetic and 122 collinear spin point groups. Treating orbital and spin degrees of freedom independently, we identify the symmetry-allowed multipoles associated with nonmagnetic and collinear magnetic orderings and clarify their hierarchy through comparisons among the corresponding spin point groups. The resulting classification provides a symmetry-based database that distinguishes structural and magnetic contributions to active multipoles and directly identifies microscopic order parameters, including those responsible for $d$-, $g$-, and $i$-wave altermagnetism. Furthermore, by classifying response tensors within the same framework, we establish a correspondence between active multipoles and symmetry-allowed physical responses. This correspondence systematically distinguishes nonrelativistic responses that survive without spin-orbit coupling from those requiring relativistic effects, providing a unified framework for understanding and predicting spin-dependent electromagnetic and transport phenomena in magnetic materials.", "url": "https://arxiv.org/abs/2609.04883", "type": "理论", "summary": "1. 该工作对32个非磁与122个共线自旋点群完成了有源轨道与自旋多极子的完整分类。\n2. 其核心在于独立处理轨道与自旋自由度，区分结构与磁性对多极子的贡献，并直接识别包括d、g、i波交变磁在内的微观序参量。\n3. 通过在同一框架中分类响应张量，该结果建立了有源多极子与允许物理响应的对应，可系统甄别非相对论与需自旋轨道耦合效应的输运或电磁现象。", "summary_source": "deepseek", "authors": [{"name": "Yuuki Ogawa"}, {"name": "Satoru Hayami"}], "featured_authors": [{"name": "Yuuki Ogawa"}, {"name": "Satoru Hayami"}], "author_count": 2}, {"id": "2609.04972", "category": "cond-mat", "title": "Bias-field control of the Neel skyrmion nonlinearity in a confined nanostructure", "abstract": "We study the nonlinear dynamics of a cylindrical skyrmion-based oscillator within the framework of a generalized Thiele model. We demonstrate the influence of an bias magnetic field applied perpendicular to the plane of the nanocylinder on the oscillation frequency and on the nonlinearity coefficient. It is shown that the field tunes the response frequency, while also producing a substantial change in the nonlinear frequency shift. We find that the nonlinearity coefficient reverses its sign as the field crosses a certain critical value. The variation of the nonlinearity coefficient with the field is clearly illustrated by the observed qualitative changes in nonlinear amplitude-frequency responses. Controlling the nonlinear properties of a skyrmion oscillator by changing the bias magnetic field opens up prospects for creating tunable computational elements for neuromorphic applications.", "url": "https://arxiv.org/abs/2609.04972", "type": "理论", "summary": "1. 该工作基于广义Thiele模型，系统研究了受限纳米柱中奈尔skyrmion振荡器的非线性动力学，重点关注垂直偏置磁场对振荡频率与非线性系数的调控。\n2. 其核心卖点是垂直场在调谐频率的同时，可在越过临界值时令非线性系数符号反转，并引发非线性幅频响应出现定性改变，从而实现磁偏置对非线性特性的有效控制。\n3. 这种场控非线性系数的机制为构建可调谐skyrmion振荡器件奠定基础，也为面向神经形态计算的可重构计算元件设计提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "A.V. Valkov"}, {"name": "A.A. Matveev"}, {"name": "O.Yu. Arkhipova"}, {"name": "R.V. Shcherbakov"}, {"name": "A.R. Safin"}, {"name": "S.A. Nikitov"}], "featured_authors": [{"name": "A.V. Valkov"}, {"name": "A.A. Matveev"}, {"name": "O.Yu. Arkhipova"}, {"name": "R.V. Shcherbakov"}, {"name": "A.R. Safin"}, {"name": "S.A. Nikitov"}], "author_count": 6}, {"id": "2609.04992", "category": "cond-mat", "title": "Anomalous diffusion in porous fractal media", "abstract": "We suggest a model of a diffusive process inside a fractal sponge structure, which is a generalization of the diffusion processes on a comb and fractal mesh structure. The sponge model is considered as the direct product of Cantor sets. It is shown that the corresponding one-dimensional diffusion process is governed by a generalized Fokker-Planck equation with a power-law memory kernel and a position-dependent diffusion coefficient. That is, the fractal structure of the medium induces memory effects and heterogeneity in the transport system. The considered model may be of interest to describe anomalous heat transport in porous fractal media.", "url": "https://arxiv.org/abs/2609.04992", "type": "理论", "summary": "1. 该工作提出一种分形海绵结构中的扩散模型，将梳状与分形网格扩散推广为康托集的直积结构。\n2. 其核心在于导出含幂律记忆核与位置相关扩散系数的广义福克-普朗克方程，揭示介质分形性同时诱发时间非局域记忆与空间非均匀输运。\n3. 该模型为多孔分形介质中反常热输运的理论描述与实验验证提供了具启发性的建模框架与扩展方向。", "summary_source": "deepseek", "authors": [{"name": "Alexander Iomin"}, {"name": "Trifce Sandev"}], "featured_authors": [{"name": "Alexander Iomin"}, {"name": "Trifce Sandev"}], "author_count": 2}, {"id": "2609.05000", "category": "cond-mat", "title": "Local coordination, structural softening, and polarization-switching energetics in Sc-alloyed GaN", "abstract": "Sc-alloyed wurtzite nitrides exhibit strongly tunable electromechanical and ferroelectric properties, yet the relationship between their lattice evolution and local bonding environment remains insufficiently established, particularly in Sc$_x$Ga$_{1-x}$N. Here, we investigate the structural and local bonding evolution of Sc$_x$Ga$_{1-x}$N across the dilute-to-intermediate composition range by combining X-ray diffraction, Sc K-edge X-ray absorption near edge structure (XANES), extended X-ray absorption fine structure (EXAFS) and first-principles calculations. Sc incorporation produces an anisotropic lattice expansion and a progressive reduction in the c/a ratio. XANES and EXAFS reveal a concurrent modification of the local environment around Sc, with the effective Sc-N coordination number increasing from 4.1(4) to 4.5(2) and the average Sc-N bond length increasing from 2.045(7) to 2.081(8)Å over x=0.06-0.26. The local response is accompanied by a reduction in the Sc K-edge pre-edge intensity, consistent with a gradual reduction of the local tetrahedral asymmetry. First-principles calculations show that these structural changes are associated with site-selective distortions around Sc and progressive flattening of the structural energy landscape. The calculated intrinsic polarization-switching barrier decreases from 24.2 to 19.0 meV/Å$^3$ with increasing Sc content, while the calculated piezoelectric stress coefficient (e$_{33}$) increases from 0.82 to 1.66~C/m$^2$ and elastic constant (C$_{33}$) decreases from 380 to 227~GPa, resulting in an increase of piezoelectric strain coefficient (d$_{33}$) from 2.99 to 12.46~pC/N. These results show that Sc incorporation progressively modifies the local coordination environment and structural energetics of ScGaN while the long-range wurtzite structure remains preserved over the investigated composition range.", "url": "https://arxiv.org/abs/2609.05000", "type": "理论+数值", "summary": "1. 该工作结合X射线衍射、XANES/EXAFS与第一性原理计算，系统表征了Sc_xGa_1-xN在稀释至中间组分范围内局部配位与整体结构演化的关联。\n2. 其核心发现在于Sc掺入使Sc-N有效配位数由4.1增至4.5、键长伸长且四面体不对称性减弱，同时软化结构势能面，使极化翻转势垒降至19.0 meV/Å³并将d₃₃提升至12.46 pC/N，而长程纤锌矿骨架得以保持。\n3. 这为在保留母体晶格框架的前提下，通过局部配位环境工程调控铁电极化翻转与压电响应提供了明确的设计思路。", "summary_source": "deepseek", "authors": [{"name": "Shailesh Kalal"}, {"name": "Gueorgui Kostov Gueorguiev"}, {"name": "Martin Magnuson"}, {"name": "Edward Ferraz de Almeida Junior"}, {"name": "Rohini Sanikop"}, {"name": "Sagar Jathar"}, {"name": "Per Sandström"}, {"name": "Ray-Hua Horng"}, {"name": "Jens Birch"}, {"name": "Per Eklund"}, {"name": "Ching-Lien Hsiao"}], "featured_authors": [{"name": "Shailesh Kalal"}, {"name": "Gueorgui Kostov Gueorguiev"}, {"name": "Martin Magnuson"}, {"name": "Jens Birch"}, {"name": "Per Eklund"}, {"name": "Ching-Lien Hsiao"}], "author_count": 11}, {"id": "2609.05030", "category": "cond-mat", "title": "ANT:UI: An interactive 3D tool for preparing ANT.Gaussian molecular junction geometries", "abstract": "this http URL is a Python graphical interface that automates the construction of molecular-junction geometries for NEGF-DFT quantum transport calculations. Through a real-time 3D viewer, users interactively position electrodes and molecules and generate complete, ready-to-run input files for Gaussian and this http URL without manual scripting. Dedicated Pull, Grid, and Rotation assistants further automate electrode-pulling sequences, surface scans, and step-wise rotation studies, with optional geometry-optimisation chaining across each sequence. By replacing a process that previously demanded days of custom scripting with a point-and-click workflow, this http URL accelerates research in theoretical molecular electronics and lowers the barrier to entry for new users. The software also exports all constructed geometries in standard XYZ format, allowing direct reuse in molecular dynamics codes or third-party visualization tools without manual reformatting.", "url": "https://arxiv.org/abs/2609.05030", "type": "理论+数值", "summary": "1. 该工作提出了ANT:UI，一个基于Python的交互式三维图形工具，用于自动化构建面向NEGF-DFT量子输运计算的分子结几何并生成输入文件。\n2. 其核心卖点在于借助实时三维编辑以及Pull、Grid和Rotation助手替代繁琐的手工脚本流程，并可选链式执行几何优化，为Gaussian及ANT.Gaussian生成可直接运行的完整序列。\n3. 该工具显著缩短了电极-分子构型制备的周期，降低理论分子电子学的准入门槛；通用XYZ导出格式也便于后续接入分子动力学模拟或第三方可视化工具。", "summary_source": "deepseek", "authors": [{"name": "A. Martinez-Garcia"}, {"name": "J. J. Palacios"}, {"name": "C. Sabater"}], "featured_authors": [{"name": "A. Martinez-Garcia"}, {"name": "J. J. Palacios"}, {"name": "C. Sabater"}], "author_count": 3}, {"id": "2609.05045", "category": "cond-mat", "title": "Tensor-Network Inference in a Field-Coupled XY Model for Portfolio Allocation", "abstract": "We apply tensor-network methods to a field-coupled XY model for long-only portfolio construction. Daily return statistics set asset-specific fields and correlation couplings. Correlation distance, four-point Gromov hyperbolicity, and Ward clustering are used to construct a sparse interaction path. A Fourier-Bessel expansion maps the continuous angular partition function to a finite-current tensor network; bottom-up and top-down contractions then give the one-site marginals and equilibrium cosine scores. A softmax map converts these scores into positive, fully invested portfolio weights. We study five equity markets over continuous ranges of inverse temperature beta and concentration gamma, and compare selected parameter pairs with long-only Markowitz frontiers and standard benchmarks. The same-sample comparisons demonstrate a tractable route from financial time series to network-adjusted allocations; predictive trading performance is outside their scope.", "url": "https://arxiv.org/abs/2609.05045", "type": "理论+数值", "summary": "1. 该工作将张量网络方法应用于场耦合XY模型，实现仅做多的投资组合权重分配。\n2. 其技术核心是利用相关距离、Gromov双曲性和Ward聚类构造稀疏相互作用路径，并通过Fourier-Bessel展开将连续角向配分函数映射为有限流张量网络，从而高效计算单点边际与均衡余弦得分。\n3. 这为从金融时间序列到网络修正配置提供了一条可处理且原则上可扩展的途径，但预测性交易表现不在其讨论范围之内。", "summary_source": "deepseek", "authors": [{"name": "Kartikeya Chowdhry"}, {"name": "G Subrahmanya V.R.K. Rao"}], "featured_authors": [{"name": "Kartikeya Chowdhry"}, {"name": "G Subrahmanya V.R.K. Rao"}], "author_count": 2}, {"id": "2609.05056", "category": "cond-mat", "title": "Influence of dislocation density on the tribological response in oxides: case study on SrTiO3", "abstract": "Most ceramics suffer from brittle surface damage and cracking when small particles slide across the surface under low load. Microscratching tests are a useful technique to mimic this loading scenario while retaining the material's deformation history; however, the impact of pre-seeded dislocations, which can significantly facilitate plastic deformation, has not been explored in ceramics. Here, the influence of mechanically seeded dislocations on the microscratching response of oxides is investigated using a model perovskite, SrTiO3. First, various dislocation densities over four orders of magnitude are introduced via room-temperature cyclic Brinell indenter scratching. Subsequently, load-ramped microscratching tests are performed within the pristine and dislocation-seeded regions using a nominally 30 {\\mu}m spherical diamond tip. On the reference pristine surface, we observe a clear transition from elastic to elasto-plastic deformation, followed by median/radial cracking at higher loads. In contrast, pre-seeded dislocations, accompanied by residual compressive stresses, suppress elastic deformation and lead to median/radial crack shortening and subsequent transition to a partial cone crack. The subsurface cracks are characterized by 3D Nano-CT. The changes in crack geometry, with and without dislocations, were described using the Lawn-Evans-Marshall and Lawn-Wiederhorn-Roberts models. These findings provide direct evidence of dislocation-regulated near-surface damage tolerance, with general applicability to other plastically deformable oxides.", "url": "https://arxiv.org/abs/2609.05056", "type": "理论", "summary": "1. 该工作以SrTiO3为模型氧化物，系统考察机械预置位错密度对微划痕变形与开裂行为的影响。\n2. 其核心在于利用室温循环布氏划痕引入横跨四个量级的位错密度，结合载荷斜坡微划痕与三维纳米CT，揭示预置位错及残余压应力抑制弹性变形、缩短中位/径向裂纹并诱发部分锥形裂纹的机制。\n3. 这为位错工程调控脆性氧化物近表面损伤容限提供了直接实验证据，并对其他可塑性变形氧化物具有普适启发意义。", "summary_source": "deepseek", "authors": [{"name": "Chukwudalu Okafor"}, {"name": "Oliver Preuß"}, {"name": "Thomas Chudoba"}, {"name": "Ujjval Bansal"}, {"name": "Daniela Exner"}, {"name": "Konrad Priszokovich"}, {"name": "Yanfei Gao"}, {"name": "Christoph Kirchlechner"}, {"name": "Xufei Fang"}], "featured_authors": [{"name": "Chukwudalu Okafor"}, {"name": "Oliver Preuß"}, {"name": "Thomas Chudoba"}, {"name": "Yanfei Gao"}, {"name": "Christoph Kirchlechner"}, {"name": "Xufei Fang"}], "author_count": 9}, {"id": "2609.05064", "category": "cond-mat", "title": "Generalized Helicity-Dependent Magnetization Switching via Substrate Phonons", "abstract": "Coherent excitation of circularly-polarized substrate phonons can drive deterministic reversal of magnetization in an adjacent magnetic layer. However, the extent to which this substrate-mediated mechanism can be generalized across different materials remains unresolved. Here, we measure and compare the spectral dependence of helicity-dependent magnetization reversal in magnetic GdFeCo layers grown on a diverse set of diamagnetic substrates. Switching is observed for all investigated substrates, spanning six point groups and several infrared-active transverse-optical phonon symmetries. While the switching spectra broadly overlap with the Reststrahlen bands, their maxima are systematically shifted to wavelengths shorter than the corresponding transverse-optical phonon resonances. This spectral mismatch shows that substrate absorption alone does not determine the switching efficiency. Transfer-matrix calculations show that strong absorption concentrates energy deposition near the substrate interface, providing a possible source of local heating that could suppress magnetization reversal. Our results reveal the broad applicability of substrate-mediated phononic switching while showing that its efficiency is governed by the full optical response of the heterostructure rather than substrate absorption alone.", "url": "https://arxiv.org/abs/2609.05064", "type": "数值", "summary": "1. 该工作系统测量了生长于多种抗磁基底上的GdFeCo薄膜中螺旋度依赖磁化反转的光谱响应，验证了基底声子介导切换的普适性。\n2. 主要发现是反转谱虽与Reststrahlen带重叠，但其峰值系统性偏离横光学声子共振，且转移矩阵计算表明强吸收将能量沉积于界面附近，说明效率由异质结构整体光学响应而非基底吸收单独决定。\n3. 这一结果将相干圆偏振声子驱动磁化反转推广至六种点群及多类红外活性TO声子基底，为声子介导光控磁化反转的材料选择与异质结设计提供了明确约束与方向。", "summary_source": "deepseek", "authors": [{"name": "F.G.N. Fennema"}, {"name": "H. Damas"}, {"name": "H. Yoshikawa"}, {"name": "A. Tsukamoto"}, {"name": "C.S. Davies"}, {"name": "A. Kirilyuk"}], "featured_authors": [{"name": "F.G.N. Fennema"}, {"name": "H. Damas"}, {"name": "H. Yoshikawa"}, {"name": "A. Tsukamoto"}, {"name": "C.S. Davies"}, {"name": "A. Kirilyuk"}], "author_count": 6}, {"id": "2609.05085", "category": "cond-mat", "title": "Cross-Layer Anomalous Hall Transport driven by Néel-Vector rotating in the Altermagnet candidate V2Te2O", "abstract": "In van der Waals (vdW) materials, weak interlayer coupling generally suppresses vertical dispersion, reinforcing the conventional paradigm that in-plane transport dominates over cross-layer channels. Here, using first-principles calculations and magnetic symmetry analyses, we uncover a giant, symmetry-unlocked cross-layer anomalous Hall conductivity (AHC) in the vdW altermagnet V2Te2O. In the magnetic ground state with Neel vector N//z, horizontal mirror symmetry protects a spin-polarized nodal chain near the Fermi level and strictly enforces zero anomalous Hall response. Tilting the Neel vector explicitly breaks this mirror protection, allowing spin-orbit coupling to gap the nodal chain and activate a sharp cross-layer Hall response. When the Neel vector is rotated into the in-plane configuration (N//x), cross-layer orbital hybridization generates intensive Berry curvature hotspots, boosting the cross-layer component of AHC {\\sigma}_{yz} to approximately 255 S/cm, which exceeds in-plane component {\\sigma}_{xy} by nearly two orders of magnitude. Furthermore, varying the azimuthal angle systematically redistributes the anomalous Hall response, enabling full directional control of transverse transport. Our findings demonstrate a highly sensitive cross-layer anomalous Hall switch activated by low-barrier spin canting, offering promising avenues for directional tensor selection and low-power multi-axial vdW spintronics.", "url": "https://arxiv.org/abs/2609.05085", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算与磁对称性分析，在范德华交错磁体V2Te2O中发现由奈尔矢量转动驱动的巨大跨层反常霍尔电导。\n2. 其核心物理在于N//z时镜面保护节点链并强制零霍尔响应，奈尔矢量倾斜破坏该保护并打开能隙，N//x时强贝利曲率热点使σ_yz达约255 S/cm，超出面内σ_xy近两个量级。\n3. 这为低势垒自旋倾斜触发的跨层反常霍尔开关与方向性张量选择提供了可行途径，有利于低功耗多轴范德华自旋电子学器件设计。", "summary_source": "deepseek", "authors": [{"name": "Yanan Pan"}, {"name": "W. Z. Zhuo"}, {"name": "Pan Gao"}, {"name": "Ziyu Zhou"}, {"name": "Junqing Xu"}, {"name": "Lijie Shao"}, {"name": "Damin Meng"}, {"name": "Weiwei Chen"}, {"name": "Zhongjun Li"}, {"name": "Ye Yang"}], "featured_authors": [{"name": "Yanan Pan"}, {"name": "W. Z. Zhuo"}, {"name": "Pan Gao"}, {"name": "Weiwei Chen"}, {"name": "Zhongjun Li"}, {"name": "Ye Yang"}], "author_count": 10}, {"id": "2609.05120", "category": "cond-mat", "title": "Symmetry-protected triplet Weyl complexes", "abstract": "The Nielsen-Ninomiya theorem dictates that Weyl nodes must appear in pairs of opposite chirality to preserve global charge neutrality. However, in crystals, specific crystalline symmetries can stabilize multi-Weyl nodes, circumventing this pairwise constraint and enabling compensated Weyl complexes with mixed chiral charges. The minimal configuration of this type is a triplet Weyl complex (TWC), comprising exactly three Weyl nodes. Here, we systematically investigate the symmetry conditions required to realize TWCs. By screening all 1651 magnetic space groups (MSGs) in both spinless and spinful systems, we establish that: (i) Only TWCs with charge magnitudes of $\\{1,1,2\\}$ and $\\{1,2,3\\}$ are permitted; (ii) the $\\{1,1,2\\}$ configuration can be realized in 166 spinless MSGs and 70 spinful MSGs; and (iii) the $\\{1,2,3\\}$-TWCs, which has not been reported before, can occur in 10 MSGs for both spinless and spinful cases. We explicitly demonstrate the existence of $\\{1,2,3\\}$-TWC in a tight-binding model. Furthermore, we present the first electronic realization of $\\{1,1,2\\}$-TWC topological semimetal state in the chiral carbon allotrope DZQH-C$_{36}$, in which the three Weyl nodes form a collinear configuration, leading to a characteristic ``S''-shaped surface Fermi arc pattern. Our findings uncover novel topological states featuring mixed chiral charges and provide guidance for exploring their physics in concrete material systems.", "url": "https://arxiv.org/abs/2609.05120", "type": "理论", "summary": "1. 该工作系统研究了晶体中由三个手性电荷混合的Weyl节点构成的三重Weyl复合体(TWC)，并全面筛查1651个磁空间群以确定其对称实现条件。\n2. 其核心卖点是证明TWC仅允许{1,1,2}与{1,2,3}两种电荷组态，其中后者为首次预言，且首次在碳同素异形体DZQH-C36中实现具有S形表面费米弧的{1,1,2}-TWC拓扑半金属态。\n3. 该结果为混合手性电荷Weyl态建立了空间群判据，为在真实材料中探索奇数Weyl节点及无配对输运行为提供了直接理论指导。", "summary_source": "deepseek", "authors": [{"name": "Yun-Yun Bai"}, {"name": "Ke-Xin Pang"}, {"name": "Yan Gao"}, {"name": "Weikang Wu"}, {"name": "Shengyuan A. Yang"}], "featured_authors": [{"name": "Yun-Yun Bai"}, {"name": "Ke-Xin Pang"}, {"name": "Yan Gao"}, {"name": "Weikang Wu"}, {"name": "Shengyuan A. Yang"}], "author_count": 5}, {"id": "2609.05121", "category": "cond-mat", "title": "On the growth of operator entanglement in brickwork circuits with Yang--Baxter gates", "abstract": "We study the operator entanglement of local operators in one-dimensional brickwork circuits whose two-site gate satisfies the braid relation; throughout this work, we call such a gate a Yang--Baxter gate. We establish upper bounds for several structured, overlapping classes of Yang--Baxter gates. We show that the operator Schmidt rank remains uniformly bounded in time for all qubit Yang--Baxter gates and, in arbitrary local dimension, for permutation gates obtained from non-degenerate Yang--Baxter maps. We also show that it grows at most polynomially for involutive dual-unitary Yang--Baxter gates and for arbitrary phase dressings of permutation gates obtained from non-degenerate Yang--Baxter maps. These results imply, respectively, constant and logarithmic upper bounds on the operator entanglement. Conversely, we construct a seven-state involutive Yang--Baxter gate without dual unitarity and a one-site operator whose exact operator Schmidt rank grows exponentially, although the corresponding operator entropies remain undetermined. Entanglement growth in the general Yang--Baxter case remains open. All proofs and selected examples were constructed by ChatGPT 5.6 Sol.", "url": "https://arxiv.org/abs/2609.05121", "type": "理论", "summary": "1. 该工作研究一维砖墙线路中以满足辫子关系的杨-巴克斯特门为两体门的局域算符纠缠，并建立了多类结构化杨-巴克斯特门的算符Schmidt秩上界。\n2. 其核心结果是证明所有量子比特杨-巴克斯特门以及由非简并杨-巴克斯特映射所得置换门的Schmidt秩一致有界，对合对偶酉门及置换门相因子修饰至多多项式增长，从而分别给出算符纠缠的常数或对数上界。\n3. 该工作还构造了无对偶酉性的七态杨-巴克斯特门使特定单点算符的Schmidt秩指数增长，为一般杨-巴克斯特门纠缠行为的开放问题提供了重要边界与反例启发。", "summary_source": "deepseek", "authors": [{"name": "Balázs Pozsgay"}], "featured_authors": [{"name": "Balázs Pozsgay"}], "author_count": 1}, {"id": "2609.05137", "category": "cond-mat", "title": "Environment-assisted transport in a strongly correlated boundary-driven Fermi-Hubbard chain", "abstract": "We study steady-state transport in a one-dimensional Fermi-Hubbard chain coupled to particle reservoirs at the boundaries and to local dephasing baths at each site, using the time-evolving block decimation (TEBD) method to solve the Lindblad master equation. In the absence of dephasing, the current exhibits two well-separated maxima as a function of the boundary driving rate, reflecting the distinct charge and spin energy scales of the strongly correlated regime. Upon introducing dephasing, we find two distinct dephasing-induced transport-enhancement regimes, in contrast to the single enhancement previously reported for spinless fermions. Analysis of the non-equilibrium steady state in the Hamiltonian eigenbasis reveals that the two regimes originate from distinct dephasing-induced redistribution processes: the first involves redistribution within the uppermost Hubbard band, while the second involves transitions between Hubbard bands. Our results demonstrate how many-body correlations shape the interplay between coherent driving, dephasing, and quantum Zeno physics in strongly correlated open systems.", "url": "https://arxiv.org/abs/2609.05137", "type": "理论", "summary": "1. 该工作利用TEBD求解林德布拉德主方程，研究了边界驱动的强关联费米-哈伯德链在局域退相干下的稳态输运。\n2. 其核心发现在于退相干可诱导两个截然不同的输运增强区间，分别源于最上哈伯德带内部及带间的非平衡重分布，区别于无自旋费米子的单一增强。\n3. 这揭示了多体关联如何调制相干驱动、退相干与量子芝诺效应的竞争，为强关联开放系统的输运调控提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Hakan Yeler"}, {"name": "Özgür Çakır"}], "featured_authors": [{"name": "Hakan Yeler"}, {"name": "Özgür Çakır"}], "author_count": 2}, {"id": "2609.05159", "category": "cond-mat", "title": "Glassy dynamics, crossover temperature and density scaling in fragile glass-formers", "abstract": "We investigate the slowing down of dynamics in a glass-forming mixture interacting via an inverse-power-law (IPL) potential using a combination of theory and large-scale molecular dynamics simulations. We measure the static pair-correlation function, configurational entropy, inherent-structure energy, and structural relaxation time. We employ a theoretical framework to calculate the structural relaxation time $\\tau_{\\alpha}$, which is found to be in very good agreement with the simulation results. The theory identifies a local structural order which defines the cooperativity of the relaxation and brings forth a fluctuation induced parameter $\\psi ( T )$ and a crossover temperature $T_a$ that characterize the density and temperature dependence of the glassy dynamics. Furthermore, we determine a crossover temperature using independent dynamical and thermodynamic criteria and compare with the theoretically predicted crossover temperature $T_a$. Relaxation dynamics is shown to obey density-temperature scaling, similar to thermodynamic properties, in terms of a variable $\\Gamma$ formed by an appropriate combination of density and temperature, characteristic of IPL interactions. Finally, we show that, when the excess thermodynamic and dynamic quantities obtained at different densities are plotted as functions of the reduced temperature $T/T_a$ (or $T_a/T$), the data collapse onto master curves with excellent agreement between theory and simulation. These scaling relations provide a unified description of the thermodynamics and dynamics in IPL systems, enabling the prediction of relaxation behavior over a wide range of densities from data at a single state point.", "url": "https://arxiv.org/abs/2609.05159", "type": "理论+数值", "summary": "1. 该工作结合理论框架与大规模分子动力学模拟，对逆幂律势脆性玻璃形成混合物中的动力学减速进行了系统研究，并测量了静态关联、构型熵和固有结构能。\n2. 其核心是借助局部结构有序刻画协同弛豫，引入涨落诱导参数ψ(T)和交叉温度T_a，并用独立动力学与热力学判据加以验证；动力学遵循由密度与温度特定组合成的变量Γ所主导的标度行为。\n3. 将不同密度下的过量热力学与动力学量按T/T_a约化后均落在同一主曲线上，从而建立热力学与动力学的统一描述，并可由单一状态点数据预测宽密度范围的弛豫行为。", "summary_source": "deepseek", "authors": [{"name": "Ankit Singh"}, {"name": "Vinay Vaibhav"}, {"name": "Swarn Lata Singh"}, {"name": "Yashwant Singh"}], "featured_authors": [{"name": "Ankit Singh"}, {"name": "Vinay Vaibhav"}, {"name": "Swarn Lata Singh"}, {"name": "Yashwant Singh"}], "author_count": 4}, {"id": "2609.05163", "category": "cond-mat", "title": "Neural-field design of broadband Rayleigh-wave carpet cloaks under microstructure realisability constraints", "abstract": "Transformation elasticity provides appropriate material distributions for elastodynamic cloaks but the required stiffness tensors generally violate the minor symmetries of Cauchy elasticity and are difficult to realise using conventional materials. Existing approaches restore these symmetries by modifying the transformed tensor, producing only an approximate cloak. In this work rather than modifying the transformed tensor we seek the best performing cloak within the class of Cauchy materials. We formulate 2D Rayleigh wave carpet cloak design as an optimisation problem governed by partial differential equations. Using a coordinate based neural-field and a differentiable finite element model solver we optimise symmetric stiffness and density fields by minimising wave field distortion. Both single frequency and broadband optimisation are considered, with the broadband model trained over multiple frequencies. Physical realisability is addressed using a database of homogenised microstructures through conditional diffusion, neural-field inverse design, and nearest-neighbour selection. FEM simulations show that the optimised Cauchy design approaches the ideal transformation-based cloak. After projection onto explicit microstructures, the homogenised representation recovers approximately 97% of the defect free reference surface-displacement magnitude, while direct FEM simulation of the fully resolved microstructured geometry recovers approximately 76%", "url": "https://arxiv.org/abs/2609.05163", "type": "理论+数值", "summary": "1. 该工作将二维Rayleigh波地毯隐身衣设计表述为受偏微分方程约束的优化问题，以处理变换弹性学中刚度张量不满足Cauchy材料对称性而难以物理实现的问题。\n2. 它不是修改变换后的张量，而是利用坐标神经场与可微有限元在Cauchy材料类内直接优化对称刚度与密度场，并通过均质化微结构数据库、条件扩散和最近邻投影纳入可制造约束，涵盖单频与多频宽带优化。\n3. 数值模拟表明如此得到的Cauchy隐身衣可逼近理想变换结果，投影到显式微结构后均质化模型与全分辨率直接模拟分别恢复约97%与76%的无缺陷参考表面位移幅度，为弹性动力学隐身衣的实际实现提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "David Aznaurov"}, {"name": "Davit Piliposyan"}, {"name": "Danila Rukhovich"}, {"name": "Sebastien Guenneau"}], "featured_authors": [{"name": "David Aznaurov"}, {"name": "Davit Piliposyan"}, {"name": "Danila Rukhovich"}, {"name": "Sebastien Guenneau"}], "author_count": 4}, {"id": "2609.05177", "category": "cond-mat", "title": "Transparency-engineered SQUID cells for Kerr-free three-wave-mixing Josephson metamaterials", "abstract": "We introduce a transparency-engineered rf-SQUID cell for Kerr-free three-wave-mixing Josephson metamaterials. This design replaces the conventional tunnel-junction element with an effective Josephson element formed by two junctions in series, yielding a non-sinusoidal energy-phase relation that can be used as a tunable nonlinear design resource. We show that the asymmetry between the two series junctions and the applied flux bias provide independent control over the local expansion of the rf-SQUID potential, enabling operating points where the leading quartic Kerr term is suppressed while the cubic nonlinearity remains finite. We derive the corresponding Kerr-free condition, identify the resulting operating ridge in parameter space, and analyze the local stability and passive-matching constraints that bound its physically accessible portion. Our results provide a compact unit-cell design principle for three-wave-mixing Josephson metamaterials and suggest a route toward Kerr-suppressed Josephson traveling-wave parametric amplifiers.", "url": "https://arxiv.org/abs/2609.05177", "type": "理论", "summary": "1. 我们引入了一种用于无克尔三波混合约瑟夫森超材料的透明设计的 rf-SQUID 单元。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Claudio Guarcello"}, {"name": "A. Mert Bozkurt"}, {"name": "Carlo Barone"}, {"name": "Giovanni Filatrella"}, {"name": "Alessandro Bruno"}, {"name": "Sergio Pagano"}], "featured_authors": [{"name": "Claudio Guarcello"}, {"name": "A. Mert Bozkurt"}, {"name": "Carlo Barone"}, {"name": "Giovanni Filatrella"}, {"name": "Alessandro Bruno"}, {"name": "Sergio Pagano"}], "author_count": 6}, {"id": "2609.05183", "category": "cond-mat", "title": "Markov chains at the onset of non-reversibility", "abstract": "For a one-dimensional path graph and a lifted path graph constructed from a duplication of each of its sites, we study how a reversible Markov chain can be perturbed and gradually driven into non-reversibility. The reversible Markov chain has a transition matrix that is diagonalizable and features real-valued eigenvalues and eigenvectors. The left and right eigenvectors form a biorthogonal system. We discuss in concrete examples how the transition matrix of a non-reversible Markov chain may be diagonalizable or non-diagonalizable, and it may have real eigenvalues and complex-conjugate pairs. For a number of steady states (flat, square-wave, wedge, V-shape), we compute eigenvalue spectra on both graphs and discuss the speedup that can be achieved through lifting. We develop a Green's matrix formalism, which we use to compute Kemeny times and mean first-passage times, and which provides valuable information and allows us to interpret the results for the characteristic times.", "url": "https://arxiv.org/abs/2609.05183", "type": "理论", "summary": "1. 该文在一维路径图及其逐点复制构成的双层提升图上，系统研究了可逆马尔可夫链受扰动后逐步过渡到不可逆区的转变行为。\n2. 其核心技术贡献是利用左右本征向量的双正交性与格林矩阵公式，求解平缓、方波、楔形和V形等稳态下的本征谱，区分转移矩阵可对角化与不可对角化情形，并据此计算Kemeny时间与平均首达时间。\n3. 这为理解提升所致非可逆马尔可夫链中谱结构变化、特征时间响应及加速机制之间的联系提供了清晰理论参考。", "summary_source": "deepseek", "authors": [{"name": "Gustave Robichon"}, {"name": "Cecile Monthus"}, {"name": "Werner Krauth"}], "featured_authors": [{"name": "Gustave Robichon"}, {"name": "Cecile Monthus"}, {"name": "Werner Krauth"}], "author_count": 3}, {"id": "2609.05185", "category": "cond-mat", "title": "Ni-O hybridization as a stabilizer for $s^{\\pm}$ superconductivity in La$_3$Ni$_2$O$_7$: a DFT+RPA study", "abstract": "The superconducting gap symmetry of high-pressure bilayer nickelates remains under debate, with weak- and strong-coupling approaches yielding different pairing tendencies. In this work, we investigate how the weak-coupling treatment of electronic states away from the Fermi level influences magnetic fluctuations and superconductivity in La$_3$Ni$_2$O$_7$. We employ a full-spectrum model based on orthonormalized projections of Kohn-Sham states onto local Ni-$e_g$ orbitals, which preserves the density-functional band structure while redistributing spectral weight over a wide energy range. Compared to a low-energy description, this approach yields enhanced interlayer spin fluctuations and a commensurate magnetic instability. Within a spin-fluctuation framework, these features favor a sign-changing $s^\\pm$ superconducting state, whereas low-energy models tend to stabilize $d$-wave pairing. Our results suggest that interlayer coupling in full-energy models may play an important role in shaping the predicted pairing symmetry of bilayer nickelates.", "url": "https://arxiv.org/abs/2609.05185", "type": "理论+数值", "summary": "1. 利用DFT+RPA计算，该工作以正交化Ni-eg投影构造全谱模型，考察远离费米能级电子态对La₃Ni₂O₇磁涨落和超导配对的影响。\n2. 相比低能模型，全谱模型保持DFT能带并重分配谱权重，令层间自旋涨落增强并诱发共度磁不稳定性，最终有利于s±超导而不是d波配对。\n3. 这提示Ni-O杂化所体现的全能量尺度层间耦合可能是决定双层镍酸盐配对对称性的重要因素，为弱耦合图像下的争议提供了新约束。", "summary_source": "deepseek", "authors": [{"name": "Lauro B. Braz"}, {"name": "Daniel D. Rivera"}, {"name": "Emmanuel V. C. Lopes"}, {"name": "George B. Martins"}, {"name": "Gustavo M. Dalpian"}, {"name": "Luis G. G. V. Dias da Silva"}], "featured_authors": [{"name": "Lauro B. Braz"}, {"name": "Daniel D. Rivera"}, {"name": "Emmanuel V. C. Lopes"}, {"name": "George B. Martins"}, {"name": "Gustavo M. Dalpian"}, {"name": "Luis G. G. V. Dias da Silva"}], "author_count": 6}, {"id": "2609.05192", "category": "cond-mat", "title": "Dynamical Reduction of Two Seri
