 "理论+数值", "summary": "1. 该论文研究单发信息论中需对量子态优化的度量，证明在许多情形下可直接采用边际态代替最优态。\n2. 主要结果是对于阶数 α∈[1/2,1) 的 Petz-Rényi 散度，这一替代仅带来至多 1/α 的乘法误差，并推广到保真度及纯态或量子-经典态的夹心 Rényi 散度。\n3. 这为简化单发量子信息量的计算与估计提供了理论保证，也可为更易处理的散度上界和量子资源分析提供启发。", "summary_source": "deepseek", "authors": [{"name": "Lukas Schmitt"}, {"name": "Joseph M. Renes"}], "featured_authors": [{"name": "Lukas Schmitt"}, {"name": "Joseph M. Renes"}], "author_count": 2}, {"id": "2609.05238", "category": "quant-ph", "title": "Quantum Optimisation for Protein-Protein Interaction Network Alignment", "abstract": "Protein-protein interaction (PPI) network alignment combines topological and sequence information to identify conserved modules across species, but global alignment remains challenging: heuristics sacrifice optimality, while exact methods lack scalability. We model the alignment as a weighted maximum common induced subgraph problem and reformulate it through the modular product graph to a minimum-weight vertex cover on the complement, with node weights carrying sequence similarity. To solve this problem, we develop a hybrid framework combining kernelisation, branch-and-bound, and seven Quantum Approximate Optimisation Algorithm (QAOA) formulations. These formulations differ in how the cover constraints are enforced, from penalty terms in the cost Hamiltonian to mixers confined to the feasible subspace. For single round QAOA, we derive closed-form expressions for the expected cost of four circulant mixer variants, enabling performance characterisation without circuit simulation. Applied to synthetic and real-world networks reduced to KEGG pathways, the QAOA formulations achieve high topological conservation on the aligned core while at least maintaining biological conservation comparable to leading classical aligners, at the cost of reduced node coverage. Across selected KEGG pathways, the aligned subnetworks retain disease-associated proteins, preserving biologically relevant information. Cheaper formulations leave more edges uncovered, while enforcing feasibility in the mixer raises circuit depth by one to two orders of magnitude. Together, these results highlight the potential of quantum optimisation for PPI network alignment and the resource trade-offs that will shape its scalability as quantum hardware matures.", "url": "https://arxiv.org/abs/2609.05238", "type": "理论+数值", "summary": "1. 该工作将蛋白质相互作用网络全局比对建模为加权最大公共导出子图问题，并设计混合量子经典求解框架。\n2. 技术上推导了四种循环混合器的单轮QAOA期望成本闭式表达式，并分析约束处理与电路深度、覆盖率的权衡。\n3. 这为量子优化在生物网络比对中的应用提供了基准，并揭示可行性约束带来的深度开销对未来扩展的影响。", "summary_source": "deepseek", "authors": [{"name": "Merle Stahl"}, {"name": "Robert J. Banks"}, {"name": "Matthias Traube"}, {"name": "Josua Unger"}, {"name": "Wolfgang Lechner"}, {"name": "Jan Baumbach"}, {"name": "Mhaned Oubounyt"}], "featured_authors": [{"name": "Merle Stahl"}, {"name": "Robert J. Banks"}, {"name": "Matthias Traube"}, {"name": "Wolfgang Lechner"}, {"name": "Jan Baumbach"}, {"name": "Mhaned Oubounyt"}], "author_count": 7}, {"id": "2609.05250", "category": "quant-ph", "title": "Memory-Optimal Sequential Synthesis of Multimode Gaussian Transformations", "abstract": "In modular quantum computing architectures, communication between hardware modules is mediated by traveling qumodes sent through transmission lines. Each output qumode interacts with the emitting module only once through a beam-splitter-type interaction and becomes inaccessible to that module after emission. Information required for subsequent outputs must therefore remain in long-lived memory qumodes. For a prescribed multimode Gaussian transformation on $N$ qumodes, this work determines the minimum memory cost for any given emission order, constructs an explicit sequential protocol attaining this minimum, and develops a greedy method for identifying memory-efficient emission orders. The transformation is represented by a symplectic matrix $S$, specified either directly or through a Gaussian gate sequence. The exact minimum memory cost is obtained from the ranks of submatrices of $S$ and further reduces to a support-based counting rule whose computational cost is linear in the size of the support data. When $S$ is specified directly, a matrix-based protocol attains the minimum memory cost. If instead $S$ is specified through a gate sequence, the original gates can be reused without additional synthesis, although the resulting memory usage need not be minimal. Gaussian transformations with local support on a $D$-dimensional cubic lattice can be realized sequentially with $O(N^{(D-1)/D})$ memory qumodes. The protocols also apply to non-Gaussian inputs, including GKP and cat states, and thereby provide an explicit, resource-efficient scheme for intermodule communication in modular architectures for universal continuous-variable quantum computation.", "url": "https://arxiv.org/abs/2609.05250", "type": "理论", "summary": "1. 该工作针对逐次发射飞行qumode的模块化连续变量架构，求解指定发射顺序下实现任意N模高斯变换所需的最小记忆qumode数并构造最优协议。\n2. 核心结果将最小记忆量化为辛矩阵子矩阵的秩，并简化为线性计算代价的支撑计数规则，且直接给出S时可达到该下限、由门序列给定时可复用原门。\n3. 对D维立方晶格上的局域高斯变换仅需O(N^{(D-1)/D})个记忆模，亦适用于GKP与猫态输入，为通用连续变量量子计算的模块间通信提供了显式资源高效方案。", "summary_source": "deepseek", "authors": [{"name": "Fucheng Guo"}, {"name": "Frank Mueller"}, {"name": "Yuan Liu"}], "featured_authors": [{"name": "Fucheng Guo"}, {"name": "Frank Mueller"}, {"name": "Yuan Liu"}], "author_count": 3}, {"id": "2609.05316", "category": "quant-ph", "title": "Compiling the 2D Fermi-Hubbard ground-state energy estimation algorithm for active volume quantum architectures", "abstract": "As quantum computing enters the early fault-tolerant era, circuit compilation choices will increasingly depend on details of the underlying architecture rather than solely optimizing for generic proxies such as non-Clifford count. We present an active-volume-aware compilation of the ground-state energy estimation algorithm for the two-dimensional Fermi-Hubbard model using quantum phase estimation and Trotterized time evolution. The proposed compilation reduces the active volume across $L\\times L$ square lattices with $L=4$ to $20$, achieving up to a $3.9\\times$ reduction over prior work optimized for non-Clifford cost. As a by-product of these compilation improvements, the resulting circuits also achieve state-of-the-art Toffoli counts, with a ~$2\\times$ reduction for the $L=20$ case. Lastly, the active volume architecture and recent execution scheduling advances provide a means of translating these reduction trends into runtime. This demonstrates the increasing importance of architecture-aware compilation for practical early fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2609.05316", "type": "理论+数值", "summary": "1. 该工作针对二维费米-哈伯德模型基态能量估计算法进行编译，该算法由量子相位估计与Trotter化时间演化构成，并面向活跃体积量子架构定制优化。\n2. 其技术要点是以活跃体积替代非克利福德门数作为主要编译目标，使L=4至20方格的活跃体积较以往工作最高缩减3.9倍，且L=20时Toffoli计数约降2倍并达到前沿水平。\n3. 这表明将架构感知编译与执行调度相结合，能把电路压缩趋势转化为实际运行时间收益，为早期容错量子计算的硬件适配与算法实用化提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Harriet Apel"}, {"name": "Athena Caesura"}, {"name": "Carys Harvey"}, {"name": "Sam Heavey"}, {"name": "Angus Kan"}, {"name": "Jessica Lemieux"}, {"name": "Ryan Levy"}, {"name": "Sam Pallister"}, {"name": "Joseph Peetz"}, {"name": "William Pol"}, {"name": "Sukin Sim"}, {"name": "William A. Simon"}, {"name": "Mark Steudtner"}, {"name": "Gideon Uchehara"}], "featured_authors": [{"name": "Harriet Apel"}, {"name": "Athena Caesura"}, {"name": "Carys Harvey"}, {"name": "William A. Simon"}, {"name": "Mark Steudtner"}, {"name": "Gideon Uchehara"}], "author_count": 14}, {"id": "2609.05387", "category": "quant-ph", "title": "A photonic source with half-a-GHz single-photon flux", "abstract": "Advanced optical quantum technologies demands high quality quantum light generation at very high rates. Here, we report on a deterministic single-photon source that simultaneously combines high excitation rates with high system efficiency to reach over 500 MHz of in-fibre single-photon flux. The source delivers optical power of over 100 pW, as is measured with an off-the-shelf powermeter, enabling a simple and direct way of determining the single-photon source fiber efficiency.", "url": "https://arxiv.org/abs/2609.05387", "type": "理论", "summary": "1. 该工作报道了一种确定性单光子源，在保持高激发速率与高系统效率的同时，实现光纤内超过500 MHz的单光子通量。\n2. 其核心卖点在于输出光功率超过100 pW，可用商用功率计直接测量，从而简化并直接标定单光子源的光纤效率。\n3. 这一结果将单光子通量提升至半吉赫兹水平，为高速光量子信息处理与可扩展量子光学实验提供了实用光源基础。", "summary_source": "deepseek", "authors": [{"name": "P. Zahalka"}, {"name": "S. Huijser"}, {"name": "A. Pancaldi"}, {"name": "S. Kruger"}, {"name": "X. Zhao"}, {"name": "Z. Liu"}, {"name": "I. Suleiman"}, {"name": "R. Jensen"}, {"name": "L. Stefan"}, {"name": "A. Ludwig"}, {"name": "V. Remesh"}, {"name": "J. C. Loredo"}, {"name": "P. Lodahl"}], "featured_authors": [{"name": "P. Zahalka"}, {"name": "S. Huijser"}, {"name": "A. Pancaldi"}, {"name": "V. Remesh"}, {"name": "J. C. Loredo"}, {"name": "P. Lodahl"}], "author_count": 13}, {"id": "2609.05408", "category": "quant-ph", "title": "Towards Scaling Quantum Fine-Tuning of Foundational Time Series Models for Classification", "abstract": "Time-series foundation models produce rich embeddings, but whether quantum models can exploit them, and how far hybrid classical-quantum architectures scale, remains unclear. We address this by fine-tuning Chronos for power-grid event classification (PSML-5) with a quantum head on the model's embeddings. Grouping embeddings by physical sensor type before summarization already surpasses the best published baseline built for this benchmark, and with finer-grained features the quantum head outperforms a larger classical multilayer perceptron on identical inputs by 1.7-2.0 percentage points of balanced accuracy. Yet the gains saturate: past a point, feeding more information to the same fixed-width register yields no improvement. We show the bottleneck is neither the supply of information nor circuit expressiveness, but the bandwidth of the data intake. To overcome this limitation, we introduce the wing module, a self-contained few-qubit circuit that feeds additional information into the core circuit through a sparse, one-way coupling. Under a preregistered four-seed protocol, we attach wings to a fixed 12-qubit core with fixed features. Balanced accuracy increases with each added wing, from 83.6% with no wings (13 qubits, including a post-selection qubit) to 85.2% with two (19 qubits). Ablations establish that a circuit enlarged without new information gains nothing, while a wing fed information from the wrong sample harms accuracy. These results reframe scaling for quantum fine-tuning: added qubits help when they carry added inputs, not merely more parameters. Wings offer a modular and stable route to widening that bandwidth.", "url": "https://arxiv.org/abs/2609.05408", "type": "理论", "summary": "1. 该工作以Chronos时序基础模型嵌入为输入，通过量子分类头对PSML-5电网事件数据集进行微调，考察混合量子经典架构在分类任务中的扩展行为。\n2. 其核心发现是性能瓶颈不在信息供给或电路表达能力，而在于数据摄入带宽，据此提出翼模块，以稀疏单向耦合向固定12比特核心电路注入额外特征，使平衡准确率由83.6%升至85.2%。\n3. 这为量子微调中的扩展机制提供了新视角，表明新增量子比特需携带新增输入才有收益，并为模块化拓宽数据摄入带宽提供了稳健路径。", "summary_source": "deepseek", "authors": [{"name": "Sang Hyub Kim"}, {"name": "Julien Baglio"}, {"name": "Rajiv Krishnakumar"}, {"name": "Chi Chen"}, {"name": "Oliver Knitter"}, {"name": "Jonathan Mei"}, {"name": "Claudio Girotto"}, {"name": "Masako Yamada"}, {"name": "Frederik F. Flöther"}, {"name": "Martin Roetteler"}], "featured_authors": [{"name": "Sang Hyub Kim"}, {"name": "Julien Baglio"}, {"name": "Rajiv Krishnakumar"}, {"name": "Masako Yamada"}, {"name": "Frederik F. Flöther"}, {"name": "Martin Roetteler"}], "author_count": 10}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
