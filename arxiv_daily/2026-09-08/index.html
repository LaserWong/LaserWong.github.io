es Josephson Junctions to a Synthetic High-Transparency Josephson Element", "abstract": "Two conventional Josephson junctions connected in series can reproduce, in the static limit in which the currents through the capacitive and resistive channels are negligible, the current-phase relation of a single effective weak link with tunable transparency. Therefore, the two-junction series can be treated as a single synthetic high-transparency element. Here, we investigate to what extent this mapping remains valid under finite-frequency drive and retaining the junctions' resistive and capacitive terms. The full resistively and capacitively shunted junction equations are compared with an effective synthetic element with tunable transparency that retains the synthetic tunable-transparency current-phase relation together with effective capacitive and dissipative terms, thus reducing the two second order degree of freedom system to a single second order degree of freedom. The resulting single-element dynamics is compared with the complete two-junction system under ac excitation. The agreement is quantified through a normalized root-mean-square error between the full and effective voltage waveforms. A broad low-error region is found at low drive frequency, while pronounced deviations emerge as the drive frequency approaches the relevant plasma-frequency scale and at larger drive amplitudes. The results provide a quantitative dynamical criterion for using the reduced single-element description of a synthetic high-transparency Josephson element in superconducting circuits.", "url": "https://arxiv.org/abs/2609.05192", "type": "理论", "summary": "1. 该工作考察了两个串联常规约瑟夫森结在有限频率交流驱动下映射为单个可调高透明约瑟夫森合成元件的有效程度，并保留了结的电阻与电容项。\n2. 其技术核心是将完整双结RCSJ方程组约化为含等效电容、耗散项及可调透明电流相位关系的单二阶自由度系统，并以电压波形归一化均方根误差量化其与完整系统的偏差，发现低频下存在大范围低误差区，而频率接近等离子体频率或驱动幅值增大时偏差显著。\n3. 这一结果提供了在超导电路中使用合成高透明约瑟夫森元件单元件约化描述的定量动力学判据。", "summary_source": "deepseek", "authors": [{"name": "Claudio Guarcello"}, {"name": "Sergio Pagano"}, {"name": "Carlo Barone"}, {"name": "Alessandro Bruno"}, {"name": "A. Mert Bozkurt"}, {"name": "Giovanni Filatrella"}], "featured_authors": [{"name": "Claudio Guarcello"}, {"name": "Sergio Pagano"}, {"name": "Carlo Barone"}, {"name": "Alessandro Bruno"}, {"name": "A. Mert Bozkurt"}, {"name": "Giovanni Filatrella"}], "author_count": 6}, {"id": "2609.05217", "category": "cond-mat", "title": "Coarse-graining far-from-equilibrium dynamics using oblique projectors", "abstract": "We generalize the Mori-Zwanzig projection operator formalism by introducing an oblique projector using biorthogonal variables to coarse-grain the dynamics of systems far from equilibrium, such as active or living matter. Improving on previously used orthogonal projectors, the oblique projector correctly decomposes the emergent interactions of the coarse-grained particles into systematic and stochastic contributions. We show that the formalism directly connects to established results in non-equilibrium linear response theory and adiabatic perturbation theory. Based on this formalism, we develop a coarse-graining algorithm which we apply to extract the emergent non-equilibrium chiral dynamics of a passive tracer in a chiral active bath. Our theory correctly predicts the odd transport properties and a confinement-induced shift of the chiral frequency of the tracer.", "url": "https://arxiv.org/abs/2609.05217", "type": "理论+数值", "summary": "1. 该文将 Mori-Zwanzig 投影算子形式推广至远离平衡系统，用双正交变量引入斜投影子以实现活性物质等非平衡态的粗粒化。\n2. 技术关键在于斜投影子能正确把粗粒化粒子间的涌现作用分解为系统性与随机部分，并与非线性响应及绝热微扰理论相联系。\n3. 该算法提取手性活性浴中被动示踪粒子的非平衡手性动力学，正确预言奇数输运与约束导致的手性频移，为活性物质粗粒化建模提供依据。", "summary_source": "deepseek", "authors": [{"name": "Gerhard Jung"}], "featured_authors": [{"name": "Gerhard Jung"}], "author_count": 1}, {"id": "2609.05219", "category": "cond-mat", "title": "Robustness of RKKY interactions across a Weyl node-annihilation transition", "abstract": "Weyl semimetals (WSMs), with their unique topological properties and distinct electronic structure, exhibit intriguing properties when either time-reversal or inversion symmetries are broken. In this work, we consider the Ruderman-Kittel-Kasuya-Yosida (RKKY) interaction between magnetic impurities in time-reversal symmetry-breaking WSMs. We derive analytical expressions for the full RKKY exchange tensor in arbitrary two-band spinful lattice systems. Our approach reveals both Heisenberg, anisotropic Ising and Dzyaloshinsky-Moriya terms, which can be calculated by energy-integrating real-space Green's functions across the entire Brillouin zone, with the band edge acting as a natural energy cutoff. We apply this framework to study a two-band tight-binding model for a time-reversal symmetry-breaking WSM that interpolates between a Weyl phase with well-separated chiral nodes and a quadratic band-touching semimetal phase. Remarkably, the spatial profile, magnitude, and anisotropic tensor structure of the exchange couplings remain persistent across the node-annihilation transition. This topological robustness reveals that short- and intermediate-range RKKY interactions are mediated by the global, Brillouin-zone-integrated quantum metric of the full valence band rather than being strictly dictated by local low-energy Berry curvature monopoles. These findings demonstrate the necessity of full-band tight-binding formulations when predicting real-space magnetic interactions, providing key insights for electric-field tuning of magnetic anisotropy and constructing realistic models of heavy-fermion and Weyl-Kondo semimetals.", "url": "https://arxiv.org/abs/2609.05219", "type": "理论", "summary": "1. 该工作针对任意两带自旋晶格系统导出了完整RKKY交换张量的解析表达式，并应用于外尔节点湮灭相变分析。\n2. 核心结果：交换耦合的空间轮廓、幅值与张量结构在节点湮灭相变中保持鲁棒，其来源为全布里渊区积分的量子度规而非局域贝里曲率磁单极。\n3. 这凸显全带紧束缚模型对真实磁相互作用计算之必需，为电场调控磁各向异性以及重费米子/外尔-近藤系统的建模提供指导。", "summary_source": "deepseek", "authors": [{"name": "João V. F. Alves"}, {"name": "Joelson F. Silva"}, {"name": "Luis G. G. V. Dias da Silva"}], "featured_authors": [{"name": "João V. F. Alves"}, {"name": "Joelson F. Silva"}, {"name": "Luis G. G. V. Dias da Silva"}], "author_count": 3}, {"id": "2609.05247", "category": "cond-mat", "title": "Diffusion under competing bulk and surface stopping mechanisms", "abstract": "We investigate reflected diffusion in a bounded domain subject to two independent, competing stopping mechanisms: an exponentially distributed bulk lifetime of rate $p$ and a surface reaction triggered when the boundary local time exceeds an independent exponential threshold of rate $q$. Denoting by $T$ the stopping time and by $L$ the acquired boundary local time at stopping, we derive their marginal distributions, joint Laplace transform, and complete hierarchy of mixed moments. These statistics are determined by the splitting probability $\\phi$ that surface reaction occurs before bulk decay. In particular, we establish the identity $p\\expect{T}+q\\expect{L}=1$ and show that the cumulative risk $pT+qL$ is exponentially distributed with unit rate. We further obtain equivalent representations of $\\phi$ in terms of the Robin-Laplacian and the generalized Steklov spectra. Explicit results for a three-dimensional ball reveal how competing rates $p,q$ control $\\phi$ and the $(T,L)$ statistics. Monte Carlo simulations test the universal cumulative-risk law.", "url": "https://arxiv.org/abs/2609.05247", "type": "理论+数值", "summary": "1. 本文研究有界区域中受指数体寿命与边界局域时触发反应竞争的反射扩散，推得停止时刻T与局域时L的联合拉普拉斯变换、边际分布及混合矩。\n2. 核心结果是通用恒等式pE[T]+qE[L]=1，且累积风险pT+qL服从单位速率指数分布，并把表面反应发生概率与Robin-Laplacian及广义Steklov谱相联系。\n3. 三维球的显式解显示p、q对分裂概率及(T,L)统计的控制规律，为多通道表面/体相竞争输运中的首次通过问题提供了可检验的通用刻画。", "summary_source": "deepseek", "authors": [{"name": "Yilin Ye"}], "featured_authors": [{"name": "Yilin Ye"}], "author_count": 1}, {"id": "2609.05276", "category": "cond-mat", "title": "Connecting heterogeneous dynamics with local entropy", "abstract": "Establishing a robust and physically interpretable link between static structure and heterogeneous relaxation dynamics remains a fundamental challenge in glass physics. Here, we introduce a weighted pair-entropy descriptor based on the conventional two-body excess entropy. For this, we multiply the integrand used to calculate the excess entropy by a weight function that is directly related to the length scale of the pair correlation function. This multiplication does not affect the contribution of the short range order to the local excess entropy, but allows to take into account the structure present on intermediate distances, i.e., the medium-range order. For a canonical two-dimensional Lennard-Jones glass former, the resulting descriptor exhibits a strong correlation with particle-level dynamical propensity at long times (multiples of the alpha-relaxation time), with a maximum structure--dynamics correlation reaching about 0.9, substantially outperforming the predictive power of the conventional local pair excess entropy. These results demonstrate that incorporating a physically motivated structural length scale into entropy-based descriptors markedly enhances their predictive power while preserving physical interpretability. Our findings provide a simple and general framework for investigating structure--dynamics correlations in glass-forming systems.", "url": "https://arxiv.org/abs/2609.05276", "type": "理论", "summary": "1. 该工作提出一种加权对熵描述符，即在常规两体超额熵的被积函数上乘以与对关联长度尺度直接相关的权重函数，以构建玻璃静态结构与非均匀弛豫动力学之间的关联。\n2. 其技术要点在于不改变短程有序贡献而定量纳入中程有序结构，在二维Lennard-Jones玻璃中该描述符与长时间动力学倾向性相关性峰值约0.9，优于传统局部两体超额熵。\n3. 这表明引入物理动机明确的结构长度尺度能大幅提升熵基描述符的预测能力，为玻璃体系结构与动力学关联研究提供了简单普适且可解释的框架。", "summary_source": "deepseek", "authors": [{"name": "Jun Wu"}, {"name": "Walter Kob"}, {"name": "Yujie Wang"}, {"name": "Zhen Zhang"}], "featured_authors": [{"name": "Jun Wu"}, {"name": "Walter Kob"}, {"name": "Yujie Wang"}, {"name": "Zhen Zhang"}], "author_count": 4}, {"id": "2609.05287", "category": "cond-mat", "title": "Fluctuations of a Photon Bose-Einstein Condensate Coupled to a Reservoir: Describing Coherence Properties in a Free-Energy Model", "abstract": "Photons are mutually nearly noninteracting particles, so thermalized photon ensembles are commonly obtained not from direct particle-particle-interactions but rather from contact with matter, which can constitute a reservoir for the photon gas. We develop a theory model for photons in a material-filled (e.g. liquid dye) optical microcavity, with the aim to study the fluctuation properties using a free-energy description for noninteracting photons coupled to a reservoir of material electronic excitations. To begin with, we use a single mode description for the condensate. For a small relative size of the material reservoir, corresponding to the canonical regime, condensate number fluctuations are small, and the derived free energy landscape takes the usual Mexican-hat shaped form such that spontaneous symmetry breaking occurs. In contrast, for a large relative size of the reservoir, corresponding to the grand canonical regime, fluctuations become as large as the average particle number. We show that the resulting free energy landscape acquires a bowl-shaped form, with a single minimum at the origin. Thus, a macroscopic occupation of the ground state (i.e., Bose-Einstein condensation) in the absence of spontaneous symmetry breaking is expected. We also provide a model for the treatment of a photon gas trapped in a box-shaped potential with spatially distributed coupling to a reservoir. The model predicts, for example, a statistically fluctuating pattern of islands with long-range coherence, resembling transient microcondensates.", "url": "https://arxiv.org/abs/2609.05287", "type": "理论", "summary": "1. 该工作针对染料填充微腔中与物质电子激发库耦合的光子玻色-爱因斯坦凝聚，建立了基于自由能的涨落理论模型。\n2. 其核心在于揭示小库对应正则系综时自由能呈墨西哥帽形并发生自发对称破缺，而大库对应巨正则系综时自由能变为碗形，粒子数涨落可媲美平均数且凝聚无需对称破缺。\n3. 这为理解受库调节的相干性与时空涨落提供了一般框架，并可推广至盒势中分布式耦合所预言的长程相干瞬时微凝聚岛。", "summary_source": "deepseek", "authors": [{"name": "Martin Weitz"}, {"name": "Andreas Redmann"}, {"name": "Riccardo Panico"}, {"name": "Leon Kleeblank"}, {"name": "Kevin J.H. Peters"}, {"name": "Frank Vewinger"}, {"name": "Julian Schmitt"}], "featured_authors": [{"name": "Martin Weitz"}, {"name": "Andreas Redmann"}, {"name": "Riccardo Panico"}, {"name": "Kevin J.H. Peters"}, {"name": "Frank Vewinger"}, {"name": "Julian Schmitt"}], "author_count": 7}, {"id": "2609.05319", "category": "cond-mat", "title": "Breakdown of Anomalous Hall Scaling in Dilute Kondo System", "abstract": "The confluence of strong electronic correlations and Berry curvature-driven transport constitutes a largely underexplored frontier in quantum materials research, particularly in systems where electronic correlations arise from flat-band physics rather than conventional $f$-electron states. Here, we report an intrinsic Berry curvature driven anomalous Hall transport in the dilute Kondo system Ru$_2$Mn$_{0.5}$Ti$_{0.5}$Ge, a non-$f$-electron Heusler alloy hosting flat bands with van Hove singularity proximate to the Fermi level. The anomalous Hall response is strikingly non-monotonic, violating the Fermi-liquid scaling relation near the magnetic transition and is restored only at low temperature, coincident with the onset of Kondo coherence. \\textit{Ab initio} calculations strongly establish that the Berry curvature originates from the Kondo hybridization induced interplay of flat bands and spin-orbit coupling mediated anticrossings at the Fermi level. Our findings demonstrate that Kondo coherence of flat bands bears a profound impact on Berry curvature associated ferroic responses, mandating a rigorous theoretical understanding of anomalous transport in the regime where reciprocal space topology and strong correlations are intrinsically intertwined.", "url": "https://arxiv.org/abs/2609.05319", "type": "理论+数值", "summary": "1. 该工作结合输运测量与第一性原理计算，研究了非 f 电子郝斯勒合金 Ru2Mn0.5Ti0.5Ge 这一稀释近藤体系中由内禀贝里曲率驱动的异常霍尔效应。\n2. 其核心发现是霍尔响应在磁转变附近呈非单调变化并违背费米液体标度关系，仅在低温近藤相干建立后恢复；贝里曲率源于近藤杂化诱导平带与自旋轨道耦合反交叉的相互作用。\n3. 这说明近藤相干显著影响平带体系贝里曲率关联的类铁性响应，为强关联与拓扑能带交织区的异常输运理论提出了必要约束。", "summary_source": "deepseek", "authors": [{"name": "Arnab Bhattacharya"}, {"name": "Prashant Singh"}, {"name": "Ajay Kumar"}, {"name": "Afsar Ahmed"}, {"name": "Yaroslav Mudryk"}, {"name": "I. Das"}, {"name": "Anis Biswas"}], "featured_authors": [{"name": "Arnab Bhattacharya"}, {"name": "Prashant Singh"}, {"name": "Ajay Kumar"}, {"name": "Yaroslav Mudryk"}, {"name": "I. Das"}, {"name": "Anis Biswas"}], "author_count": 7}, {"id": "2609.05344", "category": "cond-mat", "title": "How dipolar interactions structure molecular droplets", "abstract": "We investigate how dipolar interactions between microwave-shielded polar molecules structure the self-bound droplets formed under variation of the interaction strength. We identify the transition from droplets to crystals as a finite-size first order transition. With droplet-ring states and transitional supersolid states we predict additional structure in the crystal and droplet phases, respectively. To describe this strongly correlated regime, and in particular the reconfiguration of quantum ground states, we design a variational Monte Carlo framework based on neural quantum states. It is especially suitable to describe ground states and almost degenerate states with very different configurations. Moreover, one can easily determine the superfluid fraction. Our results reveal the sequence of finite-size structures through which dipolar interactions reorganize molecular droplets into crystals.", "url": "https://arxiv.org/abs/2609.05344", "type": "理论+数值", "summary": "1. 该工作利用基于神经量子态的变分蒙特卡洛方法，研究微波屏蔽极性分子中偶极相互作用如何随强度变化将自束缚液滴重组为分子晶体。\n2. 其核心在于能同时处理强关联基态与近乎简并且构型迥异的多体态，并可直接给出超流分数，从而揭示液滴—晶体转变的有限尺寸一级相变本质，以及液滴环态和过渡超固态等结构。\n3. 这为在超冷极性分子平台中探测有限尺寸量子有序结构，并用神经网络方法研究强关联偶极物质提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Wiiliam Freitas"}, {"name": "Panagiotis Giannakeas"}, {"name": "Jan M. Rost"}], "featured_authors": [{"name": "Wiiliam Freitas"}, {"name": "Panagiotis Giannakeas"}, {"name": "Jan M. Rost"}], "author_count": 3}, {"id": "2609.05373", "category": "cond-mat", "title": "Molecular interfacial rheology: Lipid membrane shear viscosity", "abstract": "We develop a method to extract the shear viscosity of a lipid membrane from equilibrium molecular dynamics simulations. The method characterizes the rheology of general interfacial systems embedded in three-dimensional media; we term it molecular interfacial rheology. In our simulations the planar bilayer and surrounding water are confined between solid, parallel walls. Following Onsager's regression hypothesis, membrane and water fluctuations are assumed to relax according to the coupled continuum-mechanical equations governing the confined system---which predict that the membrane transverse velocity autocorrelation function (TVACF) decays exponentially, at a rate set by the membrane and water viscosities. The measured TVACF, however, exhibits damped oscillations followed by a slowly decaying tail. We reconcile these behaviors using the Mori--Zwanzig formalism, and extract the wavevector-dependent membrane viscosity from the time-integral of the TVACF. Results from theory and simulations agree over a decade of wavevectors, and extrapolating to long wavelengths yields shear viscosities ranging from 0.064 to 0.18 pN*us/nm across two representative single-component, fluid-phase bilayers. Our results are corroborated by nonequilibrium simulations where a spatially varying in-plane body force is applied to lipid molecules, thus validating the framework of molecular interfacial rheology.", "url": "https://arxiv.org/abs/2609.05373", "type": "理论+数值", "summary": "1. 该工作提出了“分子界面流变学”方法，从平衡分子动力学模拟中提取受限固体壁间平面双层脂质膜及其周围水的剪切黏度。\n2. 通过结合Onsager回归假设与Mori–Zwanzig形式，解析横向速度自相关函数中的阻尼振荡与缓慢衰减尾部，由时间积分获得波矢依赖的膜剪切黏度。\n3. 理论与模拟在近一个量级波矢范围内吻合，长波外推给出0.064至0.18 pN·μs/nm的黏度，并经非平衡调制力模拟验证，可推广至三维介质中的一般界面体系。", "summary_source": "deepseek", "authors": [{"name": "Zhi-Xun Xu"}, {"name": "Amaresh Sahu"}], "featured_authors": [{"name": "Zhi-Xun Xu"}, {"name": "Amaresh Sahu"}], "author_count": 2}, {"id": "2609.05391", "category": "cond-mat", "title": "Non-reciprocally interacting Ornstein-Uhlenbeck processes: Exceptional points, Anomalous relaxation, Pseudo-equilibrium and Boundary refrigeration", "abstract": "Non-reciprocal interactions are ubiquitous in active, biological, and disordered systems, generically driving them out of equilibrium. Here, we introduce a hierarchy of non-reciprocally interacting Ornstein-Uhlenbeck (NROU) models governed by a tunable non-reciprocity parameter $g$. At a special point $g=g^*$, the drift matrix becomes non-diagonalizable, realizing exceptional points (EP's) of different orders, where eigenvalues and eigenvectors simultaneously coalesce. The hierarchy encompasses non-reciprocally coupled dimers, their disordered counterparts, and a many-body chain exactly mapping onto the paradigmatic Hatano-Nelson model in the arena of non-Hermitian quantum systems. For the disordered model, we show that the distribution of the EP location $g^*$ across disorder realizations develops a universal edge singularity precisely at the clean-system EP, and is manifestly non-self-averaging. Across all models, we find that at the EP, the usual exponential relaxation of the autocorrelation and covariance functions is dressed by a polynomial-in-time prefactor whose degree is set by the order of the EP and whose detailed structure encodes the spatial architecture of the chain. At complete asymmetry, the many-body chain exhibits ``pseudo-equilibrium'': its steady-state distribution factorizes into equilibrium-like single-particle measures despite a nonzero steady-state current. Moreover, the $N$-particle interacting system decomposes into $N/2$ independent complex OU processes. Finally, using the Harada-Sasa relation, we obtain a closed-form expression for the total steady-state heat dissipation and uncover a boundary refrigeration effect, in which the boundary particles switch from acting as a hot to a cold reservoir as the non-reciprocity is tuned.", "url": "https://arxiv.org/abs/2609.05391", "type": "理论", "summary": "1. 本文提出一类由非互易参数g调控的层级化Ornstein-Uhlenbeck模型，涵盖非互易二聚体、无序对应物及可精确映射到Hatano-Nelson模型的多体链。\n2. 其核心在于揭示漂移矩阵不可对角化时例外点处的普适行为，包括无序系统例外点分布的非自平均边界奇异性、由例外点阶数决定的代数弛豫前因子，以及完全不对称时稳态分布赝平衡并分解为独立复OU过程。\n3. 借助Harada-Sasa关系得到的闭式热耗散表达式预言边界粒子随g调谐由热库转为冷库的边界制冷效应，为活性物质与非厄米多体系统的非平衡统计研究提供了可检验方向。", "summary_source": "deepseek", "authors": [{"name": "Soumya Kanti Pal"}, {"name": "Shamik Gupta"}], "featured_authors": [{"name": "Soumya Kanti Pal"}, {"name": "Shamik Gupta"}], "author_count": 2}, {"id": "2609.04302", "category": "hep-th", "title": "Eye-opening bounds on cusps", "abstract": "We derive new nonperturbative inequalities on the cusp anomalous dimensions of conformal line defects. We impose reflection positivity, locality, and conformal invariance on a pair of cusps forming an ``eye'' geometry, deriving a novel condition on the cusp anomalous dimension which we refer to as conformal concavity. The resulting constraint is much stronger than the known angular concavity, and our derivation applies also to cusps involving distinct line defects. Remarkably, it directly links the smooth and fusion limits, yielding bounds on defect-changing operator dimensions, Casimir energies, and subleading fusion data. We thus uncover a new quantitative bridge between aspects of the local operator data and the fusion rules of line operators in conformal field theories.", "url": "https://arxiv.org/abs/2609.04302", "type": "理论", "summary": "1. 该工作针对共形线缺陷的尖角反常维度，导出了新的非微扰不等式。\n2. 其核心在于利用一对尖角构成的“眼睛”几何上的反射正定性与共形不变性，提出远强于角向凹性的共形凹性约束，并推广至不同线缺陷。\n3. 该约束在光滑与融合极限间建立定量桥梁，可约束缺陷改变算符维度、Casimir能量及次领头融合数据。", "summary_source": "deepseek", "authors": [{"name": "Ryan A. Lanzetta"}, {"name": "Ian Moult"}, {"name": "Yifan Wang"}], "featured_authors": [{"name": "Ryan A. Lanzetta"}, {"name": "Ian Moult"}, {"name": "Yifan Wang"}], "author_count": 3}, {"id": "2609.04331", "category": "hep-th", "title": "Boundary-Boundary Duality on Regular Black Holes, Supersymmetric Solitons and Holographic Spinning Plasma Disks", "abstract": "We construct a new family of exact rotating solutions of four-dimensional Einstein--Maxwell theory with negative cosmological constant describing regular spinning AdS black holes and smooth solitons. The geometries are free of curvature singularities and admit open regions of parameter space without closed timelike curves, while supersymmetric limits correspond to causally regular horizonless configurations. A remarkable feature of these solutions is the existence of at least two codimension-one conformal boundaries. The first is Minkowski spacetime, where the expectation value of the energy--momentum tensor describes a finite spinning disk of strongly coupled conformal plasma whose edge rotates at the speed of light. The second boundary is a rotating black-hole geometry with vanishing energy--momentum tensor but non-vanishing Cotton tensor, defining a holographic theory in which the dual graviton is fixed at the boundary. We show that the energy density associated with the dual graviton exactly reproduces that of the plasma after a suitable analytic continuation and the identification of the holographic energy scale with the Lorentz factor of the rotating fluid, providing evidence for a boundary-boundary duality. Indeed, electromagnetic duality exchanges the electric and magnetic currents between the boundary supporting the graviton and that supporting the dual graviton thus providing a generalized mirror symmetry between these boundary theories. Hence, the Lorentz factor is identified with the electromagnetic dual of the renormalization scale. In an appropriate limit, the solutions reduce to the planar Reissner--Nordström--AdS black hole, whereas the supersymmetric solitons have no regular static limit.", "url": "https://arxiv.org/abs/2609.04331", "type": "理论", "summary": "1. 该工作在四维负宇宙学常数的爱因斯坦-麦克斯韦理论中构造一族新的精确旋转解，描述正则自转AdS黑洞和光滑孤立子，无曲率奇点且超对称极限为因果正则组态。\n2. 这些解至少有两个余维一共形边界：闵氏边界上的能动张量对应边缘以光速旋转的强耦合等离子体盘；另一旋转黑洞边界上能动张量消失而Cotton张量非零，其固定边界对偶引力子，能密度经解析延拓和全息能标-洛伦兹因子等同后精确复现等离子体。\n3. 电磁对偶交换两边界电流并将洛伦兹因子视为重整化标度的电磁对偶，给出边界-边界对偶的广义镜像对称证据，亦为相关全息流体与引力对偶提供新约束。", "summary_source": "deepseek", "authors": [{"name": "Andres Anabalon"}, {"name": "Horatiu Nastase"}], "featured_authors": [{"name": "Andres Anabalon"}, {"name": "Horatiu Nastase"}], "author_count": 2}, {"id": "2609.04342", "category": "hep-th", "title": "Superselected ghost theory: entangled pairs", "abstract": "The superselection-rule approach to ghost theories is extended to theories with a nonreal spectrum containing a complex-conjugate pair of poles on the physical sheet. The two excitations are labeled by their respective complex masses, $M$ and $M^*$, and the superselection sectors are labeled by $n$, the difference between the numbers of $M$ and $M^*$ excitations. The corresponding generalized ghost parity $Q$ assigns a phase $e^{in\\alpha}$ to each sector. Under $Q$ superselection, nonvanishing norms occur only in the $n=0$ sector, and the physical state condition $Q^{2}|s\\rangle=|s\\rangle$ projects onto this sector. For a $MM^*$ pair carrying real total energy and momentum, we define a swap operation $R$. The $R$-eigenstates are entangled pairs, and an $R$ superselection rule ensures positive probabilities. We discuss how the optical theorem describes physical cuts through these entangled pairs.", "url": "https://arxiv.org/abs/2609.04342", "type": "理论", "summary": "1. 该工作将超选择定则方案推广至非实数谱含一对共轭复极点 M 与 M* 的幽灵理论，以两类激发数之差 n 标记超选择扇区并引入广义幽灵宇称 Q。\n2. 其核心在于 Q 超选择下仅 n=0 扇区保留非零模方，物理态条件 Q^2|s⟩=|s⟩ 投影至该扇区；对具有实总能量动量的 MM* 对定义交换算符 R，其本征态为纠缠对，R 超选择保证概率为正。\n3. 该结果借助光学定理描述穿过这些纠缠对的物理割线，为复质量幽灵理论的幺正与概率解释提供了自洽途径。", "summary_source": "deepseek", "authors": [{"name": "Bob Holdom"}], "featured_authors": [{"name": "Bob Holdom"}], "author_count": 1}, {"id": "2609.04347", "category": "hep-th", "title": "UV/IR scale dependence in a four-derivative scalar field theory", "abstract": "An analog of the standard renormalization procedure may be useful for four-derivative theories, and we illustrate it with the four-derivative scalar field theory in the $m\\to0$ limit. The renormalization scale $\\mu$ appears in momentum-dependent logarithms associated with both UV and IR divergences. At one loop, the on-shell scattering amplitude satisfies an analog Callan--Symanzik equation involving the analog beta functions. These functions are determined from the combined UV and IR pole parts of the 1PI functions.", "url": "https://arxiv.org/abs/2609.04347", "type": "理论", "summary": "1. 该工作在m→0极限下的四导数标量场论中建立了类标准重整化的单圈框架，研究重整化尺度μ如何通过动量依赖对数同时控制壳上散射振幅中的紫外和红外标度行为。\n2. 其核心在于将紫外与红外极点的贡献联合用于1PI函数的极点消去，从而确定类比β函数，并证明单圈壳上散射振幅满足相应类比Callan–Symanzik方程。\n3. 该类比框架揭示了四导数理论中UV/IR标度依赖的内在一体性，为高阶导数量子场论及可能含四导数相互作用的规范或引力模型提供了可推广的单圈重整化路径。", "summary_source": "deepseek", "authors": [{"name": "Bob Holdom"}], "featured_authors": [{"name": "Bob Holdom"}], "author_count": 1}, {"id": "2609.04374", "category": "hep-th", "title": "Higher-Dimensional Integrable Scattering", "abstract": "This paper describes classical soliton scattering in the 2+1d integrable chiral model, related to the Bogomolny monopole equation and self-dual Yang-Mills, as a case study for higher-dimensional integrable scattering. Extended line solitons exhibit nontrivial scattering with lump solitons and with other line solitons, and $N \\to N$ interactions can be factorised into a series of $2 \\to 2$ interactions. Scattering between parallel line solitons in 3d is related to lump soliton scattering in 2d, allowing for direct comparison with results in 1+1d integrable field theories.", "url": "https://arxiv.org/abs/2609.04374", "type": "理论", "summary": "1. 该工作以2+1维可积手征模型中经典孤子散射为例，研究其与Bogomolny磁单极方程和自对偶Yang-Mills场论相关的高维可积散射行为。\n2. 其核心在于证明延长线孤子与lump孤子及线孤子之间的非线性散射可因子化为若干2→2过程，并将3维平行线孤子散射对应到2维lump散射，以便与1+1维可积场论直接比较。\n3. 这一框架有助于把低维可积系统中因子化散射与矩阵分解的图景推广到高维，也为可积结构在高维时空中的检验与分类给出参照。", "summary_source": "deepseek", "authors": [{"name": "Lewis T. Cole"}], "featured_authors": [{"name": "Lewis T. Cole"}], "author_count": 1}, {"id": "2609.04423", "category": "hep-th", "title": "On Quasiparticles within the Refined Gribov-Zwanziger Model", "abstract": "The problem of the effective excitations of a gauge theory in the nonperturbative regime remains not completely understood. Using the Refined Gribov-Zwanziger (RGZ) theory as effective model for pure gauge Yang-Mills theories, we revisit the quasiparticle (quadratic) excitations of the theory. A novel interpretation of such quasiparticles is proposed, in the case of real mass poles, taking into account the manifest ${\\cal PT}-$symmetry of the RGZ Lagrangian.", "url": "https://arxiv.org/abs/2609.04423", "type": "理论", "summary": "1. 该文以精化Gribov-Zwanziger模型描述非微扰纯Yang-Mills理论，重新考察其二次激发即准粒子极点。\n2. 核心在于对实质量极点提出新的准粒子诠释，利用RGZ拉氏量的显式PT对称性将禁闭谱中的激发重新组织为具有明确定义的物理态。\n3. 这为从有效场论角度理解非微扰胶子谱与禁闭动力学提供了可检验图像，并可望推广至含物质场或更高自旋的规范理论。", "summary_source": "deepseek", "authors": [{"name": "Felipe F. Garcia"}, {"name": "Marcio A. L. Capri"}, {"name": "Bruno W. Mintz"}], "featured_authors": [{"name": "Felipe F. Garcia"}, {"name": "Marcio A. L. Capri"}, {"name": "Bruno W. Mintz"}], "author_count": 3}, {"id": "2609.04621", "category": "hep-th", "title": "Open-Closed-Open Triality for 1/2 BPS Three-Point Functions", "abstract": "Open-closed-open triality relates two distinct open string descriptions through a common closed string theory. In this paper, we develop an open-closed-open triality for protected half-BPS three-point functions in four-dimensional $\\mathcal{N}=4$ super Yang-Mills theory. Starting from determinant insertions representing giant gravitons, we formulate a V-type open-string Gaussian three-matrix model and, through a color-flavor transformation, derive an F-type open-string model of three bifundamental matrices forming a triangular quiver. Its closed quiver walks include oriented cubic cycles, a feature absent from the bipartite two-point case. We test the correspondence by deriving exact finite-$N$ single-giant polynomials, recovering the known F-type large-$N$ saddles, and proving the equivalence of the V- and F-type character expansions via an explicit bijection of their combinatorial data. At the closed string corner, connected three-matrix contractions determine three-colored integer Strebel surfaces. We argue that the corresponding target-space construction is naturally described by a barycentrically subdivided Belyi map or a colored Hurwitz constellation.", "url": "https://arxiv.org/abs/2609.04621", "type": "理论", "summary": "1. 该工作为四维N=4超对称杨-米尔斯理论中受保护的1/2 BPS三点函数建立了开-闭-开三元性，将巨引力子行列式插入映射为V型与F型高斯矩阵模型。\n2. 其核心在于通过色-味变换化为三角箭图的三双基础矩阵F模型，用连通收缩构造三色整数Strebel曲面，并以有限N单巨引力子多项式及两种特征展开间的组合双射严格验证该对应关系。\n3. 这为超对称关联函数嵌入细分Belyi映射或色Hurwitz星座提供了具体靶空间图像，也为更高阶或非平面关联函数的类开闭开构造给出可推广思路。", "summary_source": "deepseek", "authors": [{"name": "Keisuke Konosu"}, {"name": "Kenta Suzuki"}], "featured_authors": [{"name": "Keisuke Konosu"}, {"name": "Kenta Suzuki"}], "author_count": 2}, {"id": "2609.04664", "category": "hep-th", "title": "Hironaka Geometry and Resurgence in Finite-$N$ Matrix Models", "abstract": "We study how finite-$N$ invariant theory organizes the non-perturbative structure of matrix models. For a model of four traceless Hermitian $2\\times 2$ matrices, the Hironaka decomposition realizes the gauge-invariant configuration space as an eight-sheeted branched cover of the space of primary invariants. We show that ramification points of this cover naturally generate additional saddle points when the action depends only on the primaries. For an explicit rank-two saddle, we compute its action, one-loop normalization and Picard--Lefschetz connection to the perturbative vacuum. The same saddle controls the leading Borel singularity and large-order growth of perturbation theory, while its first fluctuation correction reproduces the first subleading large-order correction with no fitted parameters. Our results provide a concrete link between finite-$N$ invariant geometry and resurgence in matrix models.", "url": "https://arxiv.org/abs/2609.04664", "type": "理论", "summary": "1. 该工作针对四个无迹厄米2×2矩阵模型，用有限N不变量理论刻画其非微扰结构。\n2. 通过Hironaka分解，规范不变构型空间成为主不变量空间上的八叶分支覆盖，其支点诱导出额外鞍点；该鞍点的作用量与Picard–Lefschetz联络显示其控制领头Borel奇性和大阶增长，且单圈涨落无参数给出了次领头修正。\n3. 这一结果在有限N矩阵模型中建立了不变量几何与resurgence分析之间的具体对应，为向更大N和一般超势推广提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Robert de Mello Koch"}, {"name": "Vinayak Raj"}, {"name": "Anik Rudra"}], "featured_authors": [{"name": "Robert de Mello Koch"}, {"name": "Vinayak Raj"}, {"name": "Anik Rudra"}], "author_count": 3}, {"id": "2609.04839", "category": "hep-th", "title": "Form Factor Alphabets and Antipodal Duality from Cluster Algebras", "abstract": "We develop a cluster-algebraic description of symbol alphabets for chiral stress-tensor form factors in planar $\\mathcal N=4$ super-Yang--Mills theory. Motivated by unfolding the three-point $C_2$ quiver, we propose a periodic framework for $n$-point form-factor alphabets based on folding a $\\mathrm{Gr}(4,2n)$ quiver with two periods of frozen nodes. At four points, the folding leads to the $\\widetilde{\\mathrm{VI}}$ cluster algebra, which has infinitely many cluster variables. Tropical truncation selects a finite set of rational coordinates and four physical limit rays. The $A_1^{(1)}$ mutation sequences approaching these rays generate the four square roots and the corresponding algebraic-letter spaces. Within the resulting finite set of rational candidates, antipodal closure excludes precisely eight additional letters. On the parity-preserving surface, the antipodal map is realized, after a further folding, by two commuting mutations followed by a relabelling. Furthermore, we find an alternative quiver within the same mutation class that becomes self-antipodal after parity folding, mirroring the antipodal self-duality of the four-point MHV form factor. Its double- and triple-collinear boundaries reproduce, respectively, the $C_2$ algebra of the three-point form factor and the $A_3$ algebra of the six-point amplitude; after folding the latter to $C_2$, the antipodal map exchanges the two $C_2$ boundaries.", "url": "https://arxiv.org/abs/2609.04839", "type": "理论", "summary": "1. 该文通过折叠具有两周期冻结点的 Gr(4,2n) 箭图，建立了平面 N=4 超杨-米尔斯理论中手征应力张量形状因子符号字母表的簇代数周期框架。\n2. 其核心在于对四点无穷簇代数作热带截断：极限射线附近的 A1^(1) 突变序列给出平方根与有限有理字母，反极闭包恰好排除八个候选字母，并揭示反极映射可化为两次对易突变加重新标记。\n3. 这一结构将形状因子的反极自对偶与 C2、A3 边界代数联系到统一的簇代数语言中，为形状因子和振幅的 bootstrap 研究提供了可推广的代数约束。", "summary_source": "deepseek", "authors": [{"name": "Song He"}, {"name": "Jiahao Liu"}], "featured_authors": [{"name": "Song He"}, {"name": "Jiahao Liu"}], "author_count": 2}, {"id": "2609.04844", "category": "hep-th", "title": "What is Classical Null String Theory?", "abstract": "We revisit the classical definition of a null string in a D-dimensional Minkowski target space and distinguish a consistent partially-gauged Carrollian sigma-model from the null string theory. The Isberg-Lindström-Sundborg-Theodoridis (ILST) action gauges worldsheet diffeomorphisms and the common Weyl rescaling, but not the independent relative rescaling of the temporal and spatial representatives of the intrinsic Carrollian structure, Carroll-Weyl scaling. A physical string theory requires every local change of worldsheet representative to be gauged, therefore, the Carroll-Weyl symmetry should be gauged in a null string theory. In the minimal realization, the corresponding gauging is obstructed at finite tension, whereas at zero tension it yields an additional first-class constraint and the associated identification of physical configurations along its gauge orbits. The description of the null worldsheet as a congruence of null geodesics provides a complementary target-space interpretation of gauging of the Carroll-Weyl scaling. Our analysis thus provides the supplementary requirements that turns the ILST theory into the null string theory.", "url": "https://arxiv.org/abs/2609.04844", "type": "理论", "summary": "1. 该工作重新研究了D维闵氏时空中经典零弦的定义，辨明部分规范化的Carroll西格玛模型与ILST作用量并未构成真正的零弦理论。\n2. 核心判据在于物理弦论须规范Carroll-Weyl标度；最小实现中零张力给出新增第一类约束并沿规范轨道识别构型，有限张力则存在阻碍，而零测地线汇提供靶空间诠释。\n3. 这为ILST理论补充了成为零弦理论的必要条件，也为Carroll对称性规范化的弦论及后续零弦量子化提供了清晰基准。", "summary_source": "deepseek", "authors": [{"name": "M.M. Sheikh-Jabbari"}, {"name": "H. Yavartanoo"}], "featured_authors": [{"name": "M.M. Sheikh-Jabbari"}, {"name": "H. Yavartanoo"}], "author_count": 2}, {"id": "2609.05004", "category": "hep-th", "title": "de Sitter and S-folds in type IIB from $\\mathcal{N} = 4$ $D = 4$ gauged supergravity", "abstract": "In this paper, we classify the type IIB uplifts of the $\\mathcal{N}=4$ $D=4$ pure $\\text{SO}(4)$-gauged supergravity admitting a dS$_4$ solution. As for their AdS cousins, the internal geometries of these uplifts consist of two $S^2$ fibred over a Riemann surface $\\Sigma$, and are classified by pairs of harmonic functions $h_{1,\\,2}$ on $\\Sigma$, providing a new family of de Sitter solutions in type IIB. Choosing specific functions $h_{1,\\,2}$ on $\\Sigma = \\mathbb{R} \\times I$, we perform an S-fold quotient of the internal space along its non-compact direction. This S-folding allows us to evade the assumptions of the Maldacena-Nunez no-go theorem and provides a classical de Sitter solution of type IIB supergravity with finite and non-vanishing four-dimensional effective Newton constant.", "url": "https://arxiv.org/abs/2609.05004", "type": "理论", "summary": "1. 该工作系统分类了四维N=4纯SO(4)规范超引力中允许dS4解的类型IIB超引力提升。\n2. 其技术要点是将内部几何写成黎曼面Σ上两个S^2的纤维化并用调和函数对表征，再对Σ=R×I沿非紧方向实施S-fold商，从而规避Maldacena-Nunez禁戒并获得经典de Sitter解。\n3. 该构造表明弦论中可实现四维有效牛顿常数有限且非零的经典dS真空，为de Sitter弦真空分类与no-go定理边界研究提供了新基准。", "summary_source": "deepseek", "authors": [{"name": "Colin Sterckx"}], "featured_authors": [{"name": "Colin Sterckx"}], "author_count": 1}, {"id": "2609.05164", "category": "hep-th", "title": "The endless journey towards the horizon of a quantum black hole", "abstract": "It is a problem of great importance in quantum gravity whether quantum effects lead to nontrivial structure near black hole horizons, and if their interiors are emergent features of a large $N$ limit. We show that the strongly chaotic nature of black holes, captured by random matrix statistics of their spectrum, makes it so that a suitably gravitationally dressed infalling observer takes an infinite amount of proper time to reach the horizon. This makes the black hole interior operationally inaccessible to any outside observer, marking a sharp breakdown of the large $N$ causal structure of black holes in quantum gravity. To model the experience of an infalling observer, we study the response of an infalling particle detector coupled to a matter field in a 2d quantum black hole background, finding a peak in the detector's excitation probability as it enters an infinitely long non-perturbative journey close to the black hole horizon.", "url": "https://arxiv.org/abs/2609.05164", "type": "理论", "summary": "1. 该工作通过谱的随机矩阵统计刻画黑洞的强混沌性，研究了量子效应在视界附近造成的结构及其对入落观测者的影响。\n2. 其核心发现是引力修饰的入落观测者需无穷固有时才能抵达视界，使黑洞内部对外界观测者操作上不可及，明确打破了大N极限下的因果结构。\n3. 这为黑洞内部作为大N涌现结构的图景提出实质性限制，并提示强量子混沌可根本性改变视界附近的时空因果性与探测器响应。", "summary_source": "deepseek", "authors": [{"name": "Victor Franken"}, {"name": "Thomas G. Mertens"}, {"name": "Bruno de S. L. Torres"}], "featured_authors": [{"name": "Victor Franken"}, {"name": "Thomas G. Mertens"}, {"name": "Bruno de S. L. Torres"}], "author_count": 3}, {"id": "2609.05211", "category": "hep-th", "title": "CFT characters from localization", "abstract": "We explain a general procedure to compute characters of chiral algebras of 2d (S)CFTs geometrically from their coadjoint orbits, in analogy with the coadjoint orbit method for finite-dimensional Lie groups. We demonstrate that this method can be used to give concise rederivations of the characters of the Virasoro algebra, Kac-Moody algebras, as well as supersymmetric generalizations.", "url": "https://arxiv.org/abs/2609.05211", "type": "理论", "summary": "1. 该工作提出一种从二维（超）共形场论手征代数的余伴随轨道出发，通过几何局部化计算其特征标的普适程序。\n2. 其技术卖点在于将有限维李群的余伴随轨道方法推广至无限维手征代数，并以统一方式简洁重现 Virasoro、Kac-Moody 及其超对称推广的特征标。\n3. 这为手征代数表示论与几何量子化建立了更直接的联系，并为借助轨道几何研究更一般（超）共形场论提供了清晰启示。", "summary_source": "deepseek", "authors": [{"name": "Lorenz Eberhardt"}, {"name": "Duarte Fragoso"}, {"name": "Hessel Posthuma"}], "featured_authors": [{"name": "Lorenz Eberhardt"}, {"name": "Duarte Fragoso"}, {"name": "Hessel Posthuma"}], "author_count": 3}, {"id": "2609.05336", "category": "hep-th", "title": "Infrared Memory and Scrambling in a Dynamically Opened Coupled-SYK Majorana Junction", "abstract": "We study a dynamically opened Majorana junction formed by two coupled Sachdev--Ye--Kitaev (SYK) systems. A time-dependent bilinear coupling drives the system from a nearly decoupled to a strongly hybridized regime, providing an interacting realization of a Majorana shutter. Using a low-frequency analysis of the large-$N$ Keldysh theory around the conformal $q=4$ SYK saddle, we find that the opening retains a strong infrared memory, with the associated anomalous response becoming increasingly sensitive to the infrared cutoff. Exact finite-dimensional simulations of two $N=8$ SYK clusters show enhanced inter-sector entanglement, parity transfer, and cross-sector operator scrambling after the opening. These results connect the infrared structure of conformal SYK dynamics with finite-size many-body scrambling and show how a dynamically opened interacting Majorana system can retain long-wavelength memory beyond the quadratic limit.", "url": "https://arxiv.org/abs/2609.05336", "type": "理论", "summary": "1. 本文研究由两个耦合SYK系统组成的动态打开马约拉纳结，用随时间变化的双线性耦合把体系从近退耦区驱动到强杂化区，实现相互作用的马约拉纳快门。\n2. 通过绕q=4共形SYK鞍点的大N Keldysh低频分析，发现打开过程具有强红外记忆，反常响应随红外截断而愈发敏感；N=8精确模拟还显示扇间纠缠、宇称转移和交叉扇区置乱增强。\n3. 该工作将共形SYK动力学的红外结构与有限尺寸多体置乱联系起来，并为相互作用马约拉纳系统在二次极限外保持长波记忆提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Ali Vahedi"}], "featured_authors": [{"name": "Ali Vahedi"}], "author_count": 1}, {"id": "2609.05409", "category": "hep-th", "title": "Decompactification and the Flat-Space Limit of AdS$_5\\times$ S$^5$ Master Correlators", "abstract": "We study the flat-space limit of AdS$_5$/CFT$_4$ holographic correlators while accounting for the simultaneous decompactification of the internal S$^5$. We show that this limit is naturally formulated in terms of master propagators and correlators, which resum the infinite tower of Kaluza--Klein modes. For boundary correlators, the resulting expressions can be interpreted in terms of amplitudes with kinematics restricted to 5d. We then consider master correlators whose external insertions are kept in the AdS$_5\\times$S$^5$ bulk before taking the limit, and argue that they recover flat-space amplitudes with unrestricted kinematics in 10d Minkowski space. Finally, we show that the flat-space limit commutes with the boundary limit if we analytically continue the sphere so that the bulk geometry becomes AdS$_5 \\times$dS$_5$, and the resulting formulae suggest an interpretation in terms of amplitudes in flat space with two time directions and with 10d kinematics satisfying two simultaneous null constraints. We discuss the implications of these constructions for flat-space holography and its relation to the Carrollian limit of the dual CFT.", "url": "https://arxiv.org/abs/2609.05409", "type": "理论", "summary": "1. 该工作研究了在同时解除内部S^5紧致化的平直时空极限下，AdS_5×S^5全息关联函数的主传播子与主关联函数表述。\n2. 其关键卖点是证明边界极限与平直极限仅在将球面解析延拓为dS_5时对易，从而以含两个类时方向的10维运动学恢复无限制平直空间振幅。\n3. 这为平直空间全息性提供了具体途径，并与对偶CFT的Carroll极限建立联系，可作为提取平直空间S矩阵的主关联函数框架。", "summary_source": "deepseek", "authors": [{"name": "Burkhard Eden"}, {"name": "Paul Heslop"}, {"name": "Harshal Kulkarni"}, {"name": "Arthur Lipstein"}, {"name": "Romain Ruzziconi"}, {"name": "Akshay Yelleshpur Srikant"}], "featured_authors": [{"name": "Burkhard Eden"}, {"name": "Paul Heslop"}, {"name": "Harshal Kulkarni"}, {"name": "Arthur Lipstein"}, {"name": "Romain Ruzziconi"}, {"name": "Akshay Yelleshpur Srikant"}], "author_count": 6}, {"id": "2609.04805", "category": "math-ph", "title": "Derived Associative Algebras and Cyclic Cohomology of Q-manifolds", "abstract": "Loday's derived product is revisited in the setting of Q-manifolds, i.e., supermanifolds equipped with an odd vector field that `squares to zero'. We interpret the Grassmann odd product as a standard product upon shifting the grading, which implies the existence of a derived (noncommutative) associative $\\mathbb{Z}_2$-graded algebra associated with any Q-manifold. We apply Connes' cyclic cohomology to the derived associative algebra, giving a new cohomology on Q-manifolds distinct from the standard cohomology: we refer to this as the derived cyclic cohomology of a Q-manifold. The derived cyclic cocycles are interpreted as classically BRST-invariant functionals within the BV--BFV--BRST formalism or generalised Ruelle--Sullivan currents when applied to regular foliations via their foliation Lie algebroids.", "url": "https://arxiv.org/abs/2609.04805", "type": "理论", "summary": "1. 本文在Q-流形（奇向量场平方为零的超流形）上重新审视Loday导出积，并通过平移阶化将其化为标准乘积，为每个Q-流形构造了一个导出非交换结合的Z_2-分次代数。\n2. 将该代数代入Connes循环上同调，定义了区别于普通上同调的Q-流形导出循环上同调；其循环余循环在BV-BFV-BRST框架下表现为经典BRST不变泛函，在正则叶状结构下表现为广义Ruelle-Sullivan流。\n3. 这为Q-流形与叶状李代数胚提供了新的不变性与不变量来源，亦为量子场论中的BRST结构及几何中的循环类给出统一代数处理。", "summary_source": "deepseek", "authors": [{"name": "Andrew James Bruce"}], "featured_authors": [{"name": "Andrew James Bruce"}], "author_count": 1}, {"id": "2609.04889", "category": "math-ph", "title": "Finite-Corner Reconstruction and Separation for Cones of Normal Maps", "abstract": "We develop a finite-corner framework for convex cones of normal maps between \\(\\mathcal B(\\mathcal H)\\) and \\(\\mathcal B(\\mathcal K)\\). The basic structural assumption is stability under finite cut--pad operations. We prove that every point-ultraweakly closed cut--pad stable cone is completely determined by its finite-dimensional corner cones, and conversely that every coherent family of closed finite-dimensional corner cones admits a unique global realization of this type. For a cut--pad stable cone that is not necessarily point-ultraweakly closed, reconstruction from the norm closures of its corner cones yields exactly its point-ultraweak closure. Combining this reconstruction principle with finite-dimensional separation and the Choi representation, we show that non-membership in a global cone is always detected on a single finite-dimensional corner by a finite-dimensional witness. We illustrate the framework for completely positive and decomposable maps; in the decomposable case, the Hermitian parts of the finite-corner witnesses are PPT.", "url": "https://arxiv.org/abs/2609.04889", "type": "理论", "summary": "1. 该文为希尔伯特空间之间正规映射的凸锥建立有限角框架，证明截断-填充稳定锥由其有限维角锥完全决定。\n2. 技术要点在于：点超弱闭锥可由有限维角锥族唯一重构，一般锥按角锥范数闭包重构恰得其点超弱闭包，且非隶属可由单一有限维见证者检测。\n3. 这为完全正与可分解映射提供了有限维分离判据，在可分解情形有限角见证者的厄米部分具有PPT性质，或为量子信息中的锥判定开辟实用途径。", "summary_source": "deepseek", "authors": [{"name": "Mohsen Kian"}, {"name": "Fuad Kittaneh"}], "featured_authors": [{"name": "Mohsen Kian"}, {"name": "Fuad Kittaneh"}], "author_count": 2}, {"id": "2609.05237", "category": "math-ph", "title": "Representation Theory of Canonical Commutation Relations Arising from the Quantization of the Klein-Gordon Equation with an External Potential", "abstract": "We investigate the Weyl representation of the canonical commutation relations for a model describing a quantized massive scalar field under the influence of an external potential. The main problem is to determine whether the Weyl representation remains equivalent to or becomes inequivalent to the original one when the mass and/or potential are changed. This problem is reduced to the study of Schrödinger operators. It turns out that the Weyl representations are inequivalent when the masses differ. Moreover, when the masses are the same, the transition between equivalence and inequivalence occurs at the decay rate $-3/2$ of the difference between the potentials. This contrasts with the decay rate $-1$ that defines the short-range condition in scattering theory.", "url": "https://arxiv.org/abs/2609.05237", "type": "理论", "summary": "1. 该工作分析带外势的克莱因-戈登方程量子化所得正则对易关系的Weyl表示，并判定质量和外势改变时表示是否与原表示等价。\n2. 其核心是将问题化归为薛定谔算子研究，证明质量不同必导致不等价，且质量相同时等价性转变发生于势差衰减指数-3/2，明显区别于散射理论短程条件的-1。\n3. 这为外势背景下标量场量子化表示的分类提供了质量参数的刚性判据，也为研究强外势或临界衰减情形的代数量子场论结构给出启发。", "summary_source": "deepseek", "authors": [{"name": "Yasumichi Matsuzawa"}, {"name": "Itaru Sasaki"}, {"name": "Akito Suzuki"}], "featured_authors": [{"name": "Yasumichi Matsuzawa"}, {"name": "Itaru Sasaki"}, {"name": "Akito Suzuki"}], "author_count": 3}, {"id": "2609.04321", "category": "quant-ph", "title": "Reply to the Comment on \"The Axiom of Choice and the No-Signalling Principle\"", "abstract": "We clarify the meaning of a probabilistic no-signalling strategy in Ref [Proc. R. Soc. A 481, 20240601]. For every fixed input, the deterministic strategy constructed using the Axiom of Choice can indeed be represented by a Dirac probability distribution over the outputs. The relevant distinction arises when one considers the complete process from input to output, with the input itself sampled according to a probability distribution. In this case, the input and output spaces must be measurable and the dependence of the conditional output distribution on the input must also be measurable. Equivalently, the conditional distributions must form a Markov kernel. The Axiom-of-Choice strategy fails precisely this measurability requirement.", "url": "https://arxiv.org/abs/2609.04321", "type": "理论", "summary": "1. 该回复澄清了对“无信号原理与选择公理”讨论中概率性无信号策略的含义，区分固定输入情形与输入本身按概率分布的完整过程。\n2. 其核心判据是：选择公理构造的确定性策略对每个固定输入可表示为输出的Dirac分布，但作为从输入到输出的条件分布族不满足可测性要求，因而不构成马尔可夫核。\n3. 这说明在无信号框架中加入可测性及马尔可夫核条件能排除选择公理导致的病态策略，为概率论基础与量子非局域性研究提供更严格的数学约束。", "summary_source": "deepseek", "authors": [{"name": "Ämin Baumeler"}, {"name": "Borivoje Dakić"}, {"name": "Flavio Del Santo"}, {"name": "Miloš Milovanović"}], "featured_authors": [{"name": "Ämin Baumeler"}, {"name": "Borivoje Dakić"}, {"name": "Flavio Del Santo"}, {"name": "Miloš Milovanović"}], "author_count": 4}, {"id": "2609.04358", "category": "quant-ph", "title": "p-Adic Dirac Equations, Continuous-Time Quantum Walks, and Quantum Networks", "abstract": "We introduce a new class of p-adic Dirac equations, formulated in the standard axiomatic framework of quantum mechanics, in which the ordinary spatial derivatives are replaced by non-local operators built from arbitrary integrable kernels. We diagonalize the resulting free Dirac Hamiltonian in momentum space, construct its plane-wave solutions, determine its spectrum, and establish a p-adic charge-conjugation symmetry relating particle and antiparticle sectors. We then discretize the free equation in two ways, both giving genuine continuous-time quantum walks rather than the discrete-time, coined walks that dominate the existing literature: a first construction on a countable covering of the underlying p-adic space, and a second, more explicit construction on a finite, tree-structured graph, for which we prove that the transition probabilities, once the internal (particle/antiparticle) components of the wavefunction are combined, form a genuine, properly normalized set of transition probabilities at every instant of time; in other words, ignoring the internal structure of the walk, it behaves exactly like an ordinary random walk on that graph. Building on this stochastic-matrix property, we discuss how the resulting construction can serve as the foundation of a quantum network with genuinely relativistic-type internal degrees of freedom, complementing earlier, non-relativistic p-adic quantum neural networks. To the best of our knowledge, this is the first continuous-time quantum walk whose free dynamics coincides exactly with a Dirac equation on a hierarchical graph. We close with a discussion of the open mathematical and computational problems raised by this construction.", "url": "https://arxiv.org/abs/2609.04358", "type": "理论", "summary": "1. 该工作构造了一类p进Dirac方程，将空间导数替换为任意可积核定义的非局域算子，并在标准量子力学框架下对角化自由哈密顿量，给出平面波解与电荷共轭对称性。\n2. 核心卖点是对该自由方程进行两种离散化，均得到连续时间量子行走；其中基于有限树状图的构建在合并粒子和反粒子分量后转移概率严格归一化，是层级图上首个与Dirac方程自由动力学精确对应的连续时间行走。\n3. 这一随机矩阵性质为构造携带相对论型内部自由度的量子网络奠定了基础，并提出了若干值得进一步研究的数学与计算问题。", "summary_source": "deepseek", "authors": [{"name": "W. A. Zúñiga-Galindo"}], "featured_authors": [{"name": "W. A. Zúñiga-Galindo"}], "author_count": 1}, {"id": "2609.04387", "category": "quant-ph", "title": "Toward Resilient Many-Body Formulations under Incomplete Correlation Models: A Dual-Space Variational Formulation", "abstract": "Quantum simulations of correlated many-body systems will inevitably operate with imperfect information: the prepared states may arise from incomplete or approximate ansatze, while their measured Hamiltonian and overlap matrix elements are additionally affected by hardware and statistical noise. Robust quantum algorithms will be those that can improve upon reliable lower-level descriptions in spite of these imperfections. We introduce a dual-space nonorthogonal configuration-interaction (DS-NOCI) framework built around this principle. Rather than replacing a classically accessible NOCI reference manifold with correlated quantum states, DS-NOCI retains both spaces and couples them variationally. The reference sector provides a stable many-body backbone, while the quantum states contribute whatever additional correlation directions they contain. With exact matrix elements, the enlarged dual space gives a ground-state energy no higher than either the reference-only NOCI or correlated-only quantum-NOCI spaces, ensuring that an incomplete correlation model cannot degrade the underlying variational description. The additional reference--correlated matrix elements require only one correlated state preparation and are therefore less demanding than the correlated--correlated block already required by quantum variant of NOCI. Molecular benchmarks further show enhanced resilience to imperfect amplitudes and noisy matrix elements. DS-NOCI thus provides a general strategy for building quantum many-body formulations that remain useful when both correlation models and quantum computations are necessarily incomplete and noisy.", "url": "https://arxiv.org/abs/2609.04387", "type": "理论+数值", "summary": "1. 该工作提出一种双空间非正交组态相互作用（DS-NOCI）变分框架，用量子相关态补充经典可解的NOCI参考流形，以构建更抗噪的多体量子模拟方案。\n2. 其核心在于变分耦合参考空间与量子关联空间，保证在精确矩阵元下基态能量不高于任一单独空间结果，且交叉矩阵元只需一次关联态制备，开销低于量子NOCI的关联-关联块。\n3. 这为在相关模型不完整或量子测量含噪条件下设计仍能改善底层变分描述的通用多体量子算法提供了可行策略。", "summary_source": "deepseek", "authors": [{"name": "Vibin Abraham"}, {"name": "Bhumika Jayee"}, {"name": "Bo Peng"}, {"name": "Nicholas P. Bauman"}, {"name": "Karol Kowalski"}], "featured_authors": [{"name": "Vibin Abraham"}, {"name": "Bhumika Jayee"}, {"name": "Bo Peng"}, {"name": "Nicholas P. Bauman"}, {"name": "Karol Kowalski"}], "author_count": 5}, {"id": "2609.04408", "category": "quant-ph", "title": "Thermal lifetime of the centralized repetition code: From quantum annealing to social dynamics", "abstract": "There is an extensive body of research probing the potential of adiabatic quantum computation and quantum annealing to solve hard computational problems. This research endeavor is complicated by noise afflicting hardware during the computational process. An error-correcting approach called quantum annealing correction (QAC) was suggested to mitigate this noise. The QAC approach employs a centralized version of the repetition code in which the qubits are configured in a star-graph pattern with one special qubit playing the role of the hub. In this paper, we explore the thermal physics of the centralized repetition code, using a Lindblad equation framework to analyze its lifetime when coupled to a thermal bath. We show that its centralized configuration leads to thermal stability, enabling the robust storage of a logical bit of information, despite the fact that there is only 1 ferromagnetic Ising interaction per qubit like a 1-dimensional Ising chain.", "url": "https://arxiv.org/abs/2609.04408", "type": "理论", "summary": "1. 该文在Lindblad主方程框架下研究中心化重复码（星形图上以特殊比特为枢纽）与热库耦合时的热寿命，并关联量子退火修正与社会动力学。\n2. 其核心发现在于该中心化构型带来热稳定性，使单个逻辑比特可鲁棒存储，尽管每个比特仅具有一个铁磁伊辛相互作用，类似于一维伊辛链。\n3. 这为评估量子退火纠错方案在实际噪声环境中的表现提供了依据，也启发了对鲁棒信息存储与社会动力学中共识维持机制的理解。", "summary_source": "deepseek", "authors": [{"name": "Ari Mizel"}, {"name": "Van Molino"}], "featured_authors": [{"name": "Ari Mizel"}, {"name": "Van Molino"}], "author_count": 2}, {"id": "2609.04457", "category": "quant-ph", "title": "Towards minimal conditions for ergotropy injection in open quantum systems", "abstract": "Interactions between a quantum system and its environment can inject ergotropy into the system, raising the question of the minimal dimensionality and physical resources required for such injection. We first show that ergotropy injection is impossible under thermal operations when both the system and environment are qubits, whereas it becomes possible when the environment is enlarged to a qutrit. We further show that already in the qubit-qubit setting, relaxing environmental thermality and allowing interactions between system and environment allows ergotropy increment under energy-conserving unitaries. To elucidate the role of interactions, we consider a two-qubit isotropic XY interaction Hamiltonian and identify its distinct degeneracy regimes. We show that, in the central-block regime, when both the initial system and environmental states are incoherent, no ergotropic gain is possible when the environment is initially thermal, irrespective of the interaction strength. In contrast, environmental athermality in the form of population inversion, while retaining incoherence, enables ergotropic injection. We derive the optimal ergotropic gain and show that environmental coherence can enhance it, while system coherence alone need not be beneficial and can even reduce the gain. We further consider the double-degenerate regime, characterized by a finite interaction strength, and demonstrate positive ergotropic gain even for a thermal environment.", "url": "https://arxiv.org/abs/2609.04457", "type": "理论", "summary": "1. 该工作系统研究了开放量子系统中ergotropy注入所需的最小系统-环境维度与物理资源条件。\n2. 作者以两比特各向同性XY模型划分中心块与双重简并能级区，证明qubit-qubit热操作无法注入而qutrit环境可注入；中心块区热环境无增益，非相干环境中的粒子数反转产生最优增益且环境相干性可增强，双重简并区在有限耦合下热环境亦可有正增益。\n3. 因此环境非热性与简并结构是关键资源，而系统相干性不必有益甚至可降低增益，为量子电池充电及开放系统能量提取提供了可检验的边界。", "summary_source": "deepseek", "authors": [{"name": "Deependra Singh"}, {"name": "Debarupa Saha"}, {"name": "Ujjwal Sen"}], "featured_authors": [{"name": "Deependra Singh"}, {"name": "Debarupa Saha"}, {"name": "Ujjwal Sen"}], "author_count": 3}, {"id": "2609.04459", "category": "quant-ph", "title": "Efficient Quantum Error Correction from Three Dimensional Qubit Control", "abstract": "High-rate quantum low-density parity-check (qLDPC) codes can substantially reduce qubit overhead relative to surface codes, but their advantage depends on efficiently realizing nonlocal syndrome extraction. We study the \\([[144,12,12]]\\) bivariate bicycle code on a neutral-atom architecture with native three-dimensional (3D) geometry, comparing planar and 3D embeddings while holding the code fixed. We characterize spatial efficiency using the logical-qubit density, defined as the number of encoded logical qubits per unit spatial footprint. Because the optical controller's field of view limits the transverse extent of an array, this metric estimates the number of logical qubits that can be accommodated within a fixed optical field of view. The 3D embedding achieves approximately \\(4\\times\\) greater areal logical-qubit density than the planar layout and \\(42\\times\\) greater than a surface-code baseline. It also reduces the bivariate bicycle syndrome-extraction time by roughly \\(2\\times\\) compared to a planar baseline, with fewer movement operations and substantially shorter atom-transport distance. Native 3D geometry can improve both the packing density and executable realization of nonlocal qLDPC codes, making practical performance depend jointly on code structure, optical geometry, transport scheduling, and hardware-level noise. This motivates further development of control techniques in 3D.", "url": "https://arxiv.org/abs/2609.04459", "type": "理论", "summary": "1. 该工作以[[144,12,12]]双变量自行车码为例，在中性原子平台比较平面与原生三维光控布局下的非局域综合征提取性能。\n2. 其技术卖点在于三维嵌入将光学视场内逻辑量子比特面密度提升至平面布局的约4倍、表面码基线的42倍，并将综合征提取时间缩短约2倍。\n3. 这表明高码率qLDPC码的实际表现由码结构、光学几何、输运调度与噪声共同决定，为发展三维控制技术提供了方向。", "summary_source": "deepseek", "authors": [{"name": "Kevin Yipu Wu"}, {"name": "Ohik Kwon"}, {"name": "Maxwell F. Parsons"}], "featured_authors": [{"name": "Kevin Yipu Wu"}, {"name": "Ohik Kwon"}, {"name": "Maxwell F. Parsons"}], "author_count": 3}, {"id": "2609.04492", "category": "quant-ph", "title": "Gradient-based optimal control of the non-Hermitian skin effect in optomechanical arrays", "abstract": "In single-port non-Hermitian sensors the Petermann factor offsets susceptibility gains, imposing a strict resource bound on metrological precision. We test whether a multi-port geometry can evade this bound: a double-chain optomechanical ladder with opposing non-reciprocal hoppings spatially separates signal amplification from quantum-noise drainage, and gradient-based differentiable optimal control (DOC) maximizes the resource-normalized Fisher information $\\Fnorm$ subject to a Hurwitz-stability constraint. Across system sizes $N\\in\\{\\num{6},\\dots,\\num{16}\\}$ the optimizer returns $\\Fnorm>0$ in every case, with two coexisting solution classes whose selection is initialization-dependent: deep-stability configurations achieve $\\Fnorm\\in\\numrange{0.937}{0.987}$ with attenuated transmission, while marginal-stability configurations deliver directional gain $\\Gfwd\\in\\qtyrange{13.5}{15.5}{\\dB}$ with isolation $\\Iso\\in\\qtyrange{40}{64}{\\dB}$. A multi-restart ensemble reveals these classes are the endpoints of a precision--gain frontier. All solutions remain Hurwitz-stable under \\qty{5}{\\percent} disorder (\\qty{87.5}{\\percent} recovery), and the deep-stability advantage survives realistic preamplifier noise at $\\Fnormeff\\approx\\num{0.3}$--$\\num{0.5}$. Mapped onto circuit-QED parameters, the architecture enables sub-attonewton force sensing and broadband axion searches across the \\qtyrange{1}{10}{\\giga\\hertz} band.", "url": "https://arxiv.org/abs/2609.04492", "type": "理论+数值", "summary": "1. 该工作将梯度可微最优控制应用于双链光机阵列，通过设计反向非互易跃迁调控非厄米趋肤效应，检验多端口结构能否突破单端口非厄米传感的Petermann精度限制。\n2. 其核心是在Hurwitz稳定性约束下最大化资源归一化Fisher信息，数值显示N=6至16时优化全部有效，并涌现深稳与边缘稳两类解，分别实现近单位精度或约13.5–15.5 dB定向增益与40–64 dB隔离，形成精度—增益前缘。\n3. 该方案对5%无序保持稳定且可承受前置放大器噪声，映射至电路QED参数后，有望用于亚阿牛力感测及1–10 GHz宽带轴子搜寻。", "summary_source": "deepseek", "authors": [{"name": "Juste Deuyekbe"}, {"name": "Philippe Djorwé"}, {"name": "A.-H. Abdel-Aty"}, {"name": "A. Elrashidi"}, {"name": "Nsangou Mama"}, {"name": "Serge Guy Nana Engo"}], "featured_authors": [{"name": "Juste Deuyekbe"}, {"name": "Philippe Djorwé"}, {"name": "A.-H. Abdel-Aty"}, {"name": "A. Elrashidi"}, {"name": "Nsangou Mama"}, {"name": "Serge Guy Nana Engo"}], "author_count": 6}, {"id": "2609.04503", "category": "quant-ph", "title": "One-Shot and Concurrent Hitting Times for Grover-Coined Quantum Walks on Cubelike Graphs", "abstract": "We study the one-shot and concurrent hitting for the discrete-time Grover-coined quantum walk on cubelike graphs $G=\\text{Cay}(\\mathbb Z_2^d,\\Omega)$ of degree $\\Delta=|\\Omega|$. Starting from the vertex labeled $0$, we identify $\\sigma=\\bigoplus_{\\omega\\in\\Omega}\\omega$ as a natural target vertex; for the hypercube, $\\sigma$ is precisely the antipodal vertex. For families with $\\Delta\\to\\infty$, let $T$ be an integer having the same parity as $\\Delta$ and satisfying $ \\left|T-\\frac{\\pi\\Delta}{2}\\right|\\leq 1. $ We show that the probability $p_T(\\sigma)$ of finding the walker at $\\sigma$ when it is measured at time $T$ satisfies $$ p_T(\\sigma)=1-O(\\Delta^{-1/5}). $$ Thus the target is found with probability tending to one after $\\Theta(\\Delta)$ steps. For the concurrently measured walk, let $H_T^{\\mathrm{Conc}}(\\sigma)$ denote the probability that the target is detected at or before time $T$ when it is tested after every step. We prove $$ p_T(\\sigma)\\leq T H_T^{\\mathrm{Conc}}(\\sigma), $$ which implies $H_T^{\\mathrm{Conc}}(\\sigma)=\\Omega(\\Delta^{-1})$ over the same time scale. The proof uses the Walsh-Fourier decomposition, an exact two-dimensional reduction of each Fourier mode, and a universal second-moment identity for the associated character sums. Our results extend Kempe's hypercube hitting phenomenon (J. Kempe, Probab. Theory Relat. Fields 133, 215-235, 2005) to arbitrary cubelike generating sets and establish the conjectured asymptotic hitting behavior for cublelike and augmented cubes in Mulherkar, Rajdeepak and Sunitha (Int. J. Quantum Inf. 20,2250020, 2022)", "url": "https://arxiv.org/abs/2609.04503", "type": "理论", "summary": "1. 该工作研究Grover硬币离散时间量子行走在立方型图Cay(Z_2^d,Ω)上的单次与并发命中时间。\n2. 核心卖点是以Walsh-Fourier分解与二维约化证明单次命中概率为1-O(Δ^{-1/5})，并导出并发命中Ω(Δ^{-1})下界。\n3. 该结果将Kempe超立方体命中现象推广到任意生成集，为高维Cayley图量子命中标度提供坚实范例。", "summary_source": "deepseek", "authors": [{"name": "Jaideep Mulherkar"}], "featured_authors": [{"name": "Jaideep Mulherkar"}], "author_count": 1}, {"id": "2609.04506", "category": "quant-ph", "title": "State-Based Quantum Operations: Chameleon Gates", "abstract": "We introduce chameleon gates as a natural generalization of conventional quantum controlled-gates. Chameleon gates are state-based quantum controlled-operations that retain standard elements such as control and target systems, while introducing a new feature: the quantum knob. This knob is a quantum signal (state) that determines the operation performed by the gate. Consequently, the action and form of a chameleon gate depend dynamically on the quantum knob, allowing the gate to adapt its operation and implement transformations that are not necessarily unitary. This shapeshifting property is in stark contrast to conventional quantum controlled-gates, whose actions are fixed and cannot be modified. We also propose how chameleon gates can be realized using conventional quantum gates available in current quantum technologies. We then employ chameleon gates as a useful building block within the recently proposed state-based quantum computation (SBQC) framework. Using this approach, we demonstrate the simulation of state-dependent (nonlinear) quantum evolutions.", "url": "https://arxiv.org/abs/2609.04506", "type": "数值", "summary": "1. 该工作提出变色龙门作为量子受控门的状态依赖推广，引入名为量子旋钮的量子信号以动态决定门所执行的操作。\n2. 其核心特征在于门的形式与作用随量子旋钮的状态变化而适应，可实现非幺正变换，并可由现有量子技术中的常规量子门构建。\n3. 这为基于状态的量子计算框架提供了模块化构件，可用于模拟状态依赖的非线性量子演化并启发相关实验实现。", "summary_source": "deepseek", "authors": [{"name": "S. Alipour"}, {"name": "A. T. Rezakhani"}], "featured_authors": [{"name": "S. Alipour"}, {"name": "A. T. Rezakhani"}], "author_count": 2}, {"id": "2609.04524", "category": "quant-ph", "title": "DPRQ: A Dynamic Programming-based Qubit Routing Algorithm for Collective Communication in Distributed Quantum Computing", "abstract": "Distributed quantum computing (DQC) offers a promising approach to scale quantum computing by overcoming the resource limitations of a single quantum processor. However, inter-node communication remains a major bottleneck of DQC due to inefficient and error-prone entanglement distribution. Optimizing inter-node communication can not only reduce the amount of entanglement resource needed to execute a quantum circuit but also improve execution speed and accuracy of the results. This paper proposes DPRQ, a qubit routing algorithm for minimizing inter-node communication in distributed quantum circuits divided into collective communication blocks. Unlike current approaches that utilize greedy block-level qubit routing strategies, DPRQ employs a dynamic programming-based technique focused on global circuit-level optimization, while capturing inter-block dependencies. We evaluated DPRQ on four sets of quantum circuits and a variety of DQC configurations. The results demonstrate that DPRQ's innovative routing strategy achieves an average of 24.40% reduction with a maximum of 85.06% reduction in inter-node communication, when compared to the state-of-the-art collective communication-based DQC compiler QuComm.", "url": "https://arxiv.org/abs/2609.04524", "type": "理论+数值", "summary": "1. 该工作提出DPRQ算法，面向分布式量子计算中按集体通信块划分的电路，以动态规划优化跨节点的纠缠通信开销。\n2. 其技术卖点在于从全局电路层级捕捉块间依赖并完成最优布线，取代现有贪心式逐块路由，从而减少纠缠资源需求并提升执行速度与结果精度。\n3. 这一思路将分布式量子编译从局部启发式转向全局最优规划，可为可扩展多节点量子计算系统的高效互联提供通用设计基础。", "summary_source": "deepseek", "authors": [{"name": "Dhaval Vaidya"}, {"name": "Ruozhou Yu"}], "featured_authors": [{"name": "Dhaval Vaidya"}, {"name": "Ruozhou Yu"}], "author_count": 2}, {"id": "2609.04652", "category": "quant-ph", "title": "Qmes: Quantum Meta-Learning for Encoding Selection in Quantum Kernel Methods", "abstract": "Selecting an effective encoding quantum circuit is a key challenge in quantum kernel methods because different feature maps can lead to different performance. Conventional methods require constructing and evaluating every circuit for each new dataset, making it computationally expensive. We present Qmes, an open-source Python package that automatically recommends circuits through meta-learning. Qmes characterizes a dataset using classical complexity measures and queries a pre-trained model to recommend circuits without quantum evaluation at inference time. The package provides modular components for meta-feature extraction, quantum-kernel evaluation, recommender training, model selection, and user-defined circuit extension. We validate Qmes on 105 classification and 86 regression benchmark datasets. Qmes reduces the mean recommendation regret by 2.2x and 4.2x for classification and regression, respectively, compared to a non-adaptive baseline, with statistical significance confirmed via a paired Wilcoxon signed-rank test ($p < 10^{-4}$). Qmes thus enables efficient and practical encoding-circuit selection for quantum kernel methods.", "url": "https://arxiv.org/abs/2609.04652", "type": "理论", "summary": "1. 该工作构建开源软件包Qmes，面向量子核方法中的编码电路选择，通过元学习在推理阶段直接推荐特征映射电路，避免逐一构造并量子评估候选电路。\n2. 其卖点是利用经典复杂度刻画数据集并预训练推荐模型：在105个分类与86个回归基准上，将平均推荐遗憾降至非自适应基线的约1/2.2与1/4.2，且配对Wilcoxon符号秩检验确认统计显著。\n3. 该成果给出了低成本、跨数据集的编码选择路径，推动量子核方法实际应用，也为其他量子算法模块的元学习自动化提供了示范。", "summary_source": "deepseek", "authors": [{"name": "Dao Duy Tung"}, {"name": "Quoc Chuong Nguyen"}, {"name": "Vu Tuan Hai"}, {"name": "Le Bin Ho"}, {"name": "Lan Nguyen Tran"}], "featured_authors": [{"name": "Dao Duy Tung"}, {"name": "Quoc Chuong Nguyen"}, {"name": "Vu Tuan Hai"}, {"name": "Le Bin Ho"}, {"name": "Lan Nguyen Tran"}], "author_count": 5}, {"id": "2609.05024", "category": "quant-ph", "title": "Lindblad Multiproduct Formulas", "abstract": "We introduce Lindblad Multiproduct Formulas: a quantum error mitigation technique that uses two-dimensional tensor networks contracted with loop-corrected belief propagation. The quantities required to implement the error mitigation scheme that are evaluated with tensor networks can be less computationally expensive to calculate than the expectation values themselves, thus allowing for the possibility of applying our method to certain systems for which tensor network methods may struggle to calculate the observable quantities of interest. The workflow incorporates Clifford rescaling techniques and outputs an estimated error bar. We apply our method to a model of two-dimensional discrete time crystals studied previously and implement it on $65$ qubits arranged in a $3\\!\\times\\!3$ heavy-hexagonal topology on the quantum computer ibm_basquecountry. We show that a GPU implementation of the classical part of our workflow achieves a speedup of up to $5.6\\times$.", "url": "https://arxiv.org/abs/2609.05024", "type": "理论+数值", "summary": "1. 该工作提出林德布拉德乘积分式，一种结合二维张量网络与环路修正置信传播的量子误缓解技术。\n2. 其卖点在于张量网络计算缓解所需量比直接算期望值更省，并引入克利福德重标定以输出误差棒。\n3. 这为在高维或张量网络难直接处理的系统中扩展量子误缓解及经典加速提供了可行方向。", "summary_source": "deepseek", "authors": [{"name": "Niall F. Robertson"}, {"name": "Andrea D'Urbano"}, {"name": "Anton Dekusar"}, {"name": "Max Rossmannek"}, {"name": "Eric D. Switzer"}, {"name": "James R. Garrison"}, {"name": "Nicolas Lorente"}, {"name": "Igor Pasichnyk"}, {"name": "Paolo D'Alberto"}, {"name": "Muhammad Osama"}, {"name": "Zachary Streeter"}, {"name": "Yasuko Eckert"}, {"name": "Constantinos Evangelinos"}, {"name": "Sergiy Zhuk"}], "featured_authors": [{"name": "Niall F. Robertson"}, {"name": "Andrea D'Urbano"}, {"name": "Anton Dekusar"}, {"name": "Yasuko Eckert"}, {"name": "Constantinos Evangelinos"}, {"name": "Sergiy Zhuk"}], "author_count": 14}, {"id": "2609.05033", "category": "quant-ph", "title": "Hadamard Rigidity of Positive Sojourn Time Distributions for Rotation Coins", "abstract": "We study the distribution of the positive sojourn time for a one-dimensional two state quantum walk, conditioned on return to the origin. Konno showed that, for the Hadamard walk, this conditional distribution is exactly uniform at times divisible by $4$. In this paper, we investigate whether this finite time exact uniformity characterizes the Hadamard coin within the family of rotation coins. For a fixed initial state, we prove that the following three conditions are equivalent for rotation coins: the conditional distribution is exactly uniform at time $8$; the conditional distribution is exactly uniform at every time $4m$ with $m\\ge2$; and the coin is the Hadamard coin. Thus, the uniformity phenomenon found by Konno is characterized as a rigidity phenomenon of the Hadamard coin within the rotation coin family. The proof uses a matrix-valued generating function for paths returning to the origin. We analyze the algebraic structure arising from an absorbing process on the half line. Finally, by comparing low degree coefficients at time $8$, we show that exact uniformity forces the rotation coin to be the Hadamard coin.", "url": "https://arxiv.org/abs/2609.05033", "type": "理论", "summary": "1. 本文证明，对一维二态量子游走中固定初态、以返回原点为条件的正逗留时间分布，旋转硬币在时间8精确均匀、在所有4m时间精确均匀与硬币为Hadamard三者等价。\n2. 方法上，作者利用返回原点的路径矩阵值生成函数及半直线上吸收过程的代数结构，通过比较时间8处的低阶系数强制旋转硬币退化为Hadamard硬币。\n3. 这一结果表明Konno均匀现象实为Hadamard硬币在旋转硬币族中的刚性特征，为量子游走中有限时间分布唯一性与硬币类型判定提供了可迁移的代数途径。", "summary_source": "deepseek", "authors": [{"name": "Shunya Tamura"}, {"name": "Tomoki Yamagami"}], "featured_authors": [{"name": "Shunya Tamura"}, {"name": "Tomoki Yamagami"}], "author_count": 2}, {"id": "2609.05201", "category": "quant-ph", "title": "Optimal inequalities for completely bounded polynomials and the limitations of quantum query algorithms", "abstract": "We consider the problem of establishing limitations on the power of quantum query algorithms via the completely bounded polynomial method. In particular, we prove several optimal functional inequalities involving different notions of completely bounded polynomials. These inequalities lead to limiting theorems for the power of quantum query algorithms that improve on prior works. 1. An optimal root-influence bound for block-multilinear polynomials. Prior work showed that block-multilinear polynomials $p$ of degree $t$ satisfy a root-influence bound, $\\|p\\|_{\\text{cb}}\\geq \\sum_i \\sqrt{\\mathrm{Inf}_i[p]}/t^2$, which is stronger than the bound appearing in the Aaronson-Ambainis conjecture. We find the optimal constant in that inequality: $\\|p\\|_{\\text{cb}}\\geq \\sum_i \\sqrt{\\mathrm{Inf}_i[p]}/t$. Since the amplitudes of quantum algorithms that query disjoint blocks of inputs-such as $t$-fold forrelation- are block-multilinear polynomials with $\\|p\\|_{\\text{cb}}\\leq 1,$ our inequality shows that they satisfy $t\\geq \\sum_i\\sqrt{\\mathrm{Inf}_i[p]}$. We prove that this inequality yields both a more efficient classical simulation than prior results based on the Aaronson-Ambainis argument, and a qualitative improvement: all classical queries are nonadaptive. 2. Optimal Fourier growth of the highest level of quantum query algorithms. We show that for every polynomial $p$ defined on $\\{-1,1\\}^n$ of degree $2t$, the Fourier Growth at the level $2t,$ namely $\\|\\widehat p_{2t}\\|_{\\ell_1}$, satisfies $\\|\\widehat p_{2t}\\|_{\\ell_1}\\leq (en/(2t-1))^{\\frac{2t-1}{2}}\\|p\\|_{\\text{cb}}$. This is optimal up to the factor $e$, as witnessed by $2t$-fold forrelation. As quantum query algorithms that make $t$ queries (to the whole input) satisfy $\\|p\\|_{\\text{cb}}\\leq 1$, this yields a Fourier growth bound for these algorithms, partially resolving a question by Girish (STOC, 2026).", "url": "https://arxiv.org/abs/2609.05201", "type": "理论+数值", "summary": "1. 该工作利用完全有界多项式方法证明若干最优函数不等式，以刻画量子查询算法的能力极限。\n2. 技术要点在于将块多重线性多项式的根影响界常数由t^{-2}改进为最优的t^{-1}，并证明次数2t多项式最高层傅里叶ℓ1范数最优上界为(e n/(2t-1))^{(2t-1)/2}。\n3. 由此得到比基于Aaronson-Ambainis论证更高效的经典模拟且查询可完全非自适应，并部分解决了Girish提出的公开问题。", "summary_source": "deepseek", "authors": [{"name": "Francisco Escudero Gutiérrez"}, {"name": "Miquel Saucedo"}, {"name": "Carlos Palazuelos"}], "featured_authors": [{"name": "Francisco Escudero Gutiérrez"}, {"name": "Miquel Saucedo"}, {"name": "Carlos Palazuelos"}], "author_count": 3}, {"id": "2609.05222", "category": "quant-ph", "title": "A double-resonator coupler for high-fidelity two-qubit gates between superconducting qubits", "abstract": "Tunable couplers have enabled two-qubit gate fidelities in superconducting quantum processors to approach $99.9\\%$, yet simultaneously suppressing residual interactions and maintaining flexible qubit-frequency allocation remain central challenges for scaling. Here, we propose a double-resonator coupler (DRC) consisting of two resonators interconnected by a single Josephson junction and a capacitor. The hybridized resonator modes provide two mediated exchange paths whose interference controls the qubit-qubit interaction. The DRC enables complete cancellation of residual $ZZ$ interaction for qubit-qubit detunings well outside the straddling regime, even in the absence of direct qubit-qubit coupling, thereby relaxing constraints on frequency allocation and qubit placement. Away from the idle point, the same circuit provides a strong $ZZ$ interaction of approximately $70\\,\\mathrm{MHz}$, enabling a $20\\,\\mathrm{ns}$ controlled-Z gate with simulated coherent infidelity below $10^{-5}$. These results establish the DRC as a flexible single-junction coupler architecture for high-fidelity superconducting quantum processors.", "url": "https://arxiv.org/abs/2609.05222", "type": "理论", "summary": "1. 该工作提出一种双谐振器耦合器，由两个谐振器经单个约瑟夫森结与电容互联，用于超导量子比特间的高保真两比特门。\n2. 其技术要点在于利用混合谐振模式形成两条交换路径的干涉来控制比特耦合，可在无直接比特耦合且失谐远离交错区间时完全抵消残余ZZ相互作用，从而放宽频率配置约束。\n3. 在空闲点外该电路可提供约70 MHz的强ZZ耦合，实现20 ns控制-Z门且模拟相干错误率低于10^-5，为可扩展高保真超导处理器确立灵活的单结耦合架构。", "summary_source": "deepseek", "authors": [{"name": "Seunghyeon Jin"}, {"name": "Seungha Woo"}, {"name": "Shinyoung Hwang"}, {"name": "June-Young M. Lee"}, {"name": "Jeongmin Shim"}, {"name": "Sunje Kim"}, {"name": "Dae Seok Han"}, {"name": "Jaeho Shin"}, {"name": "Eunjong Kim"}], "featured_authors": [{"name": "Seunghyeon Jin"}, {"name": "Seungha Woo"}, {"name": "Shinyoung Hwang"}, {"name": "Dae Seok Han"}, {"name": "Jaeho Shin"}, {"name": "Eunjong Kim"}], "author_count": 9}, {"id": "2609.05225", "category": "quant-ph", "title": "The marginal is pretty good", "abstract": "One-shot information theory measures often require an optimization over states, but the form of these optimizers can be complicated or depend on the initial problem in nonlinear ways. In this note, we show that in many instances using the marginal instead of the optimal state is sufficiently good and only changes the result by a small factor. We prove that for the Petz-Rényi divergence of order $\\alpha\\in[1/2,1)$, replacing the optimizing state on $B$ by the marginal $\\rho_B$ results in a multiplicative overhead of at most $1/\\alpha$. We also show a similar relation for the fidelity, and in the case of pure or quantum-classical states for the sandwiched Rényi divergence.", "url": "https://arxiv.org/abs/2609.05225", "type":
