ummary_source": "deepseek", "authors": [{"name": "Sanefumi Moriyama"}], "featured_authors": [{"name": "Sanefumi Moriyama"}], "author_count": 1}, {"id": "2606.19917", "category": "hep-th", "title": "Metastable and critical-bubble branches of Coleman--Weinberg monopoles", "abstract": "We revisit the Coleman--Weinberg monopole problem introduced by Kiselev, where radiative symmetry breaking makes the broken vacuum metastable. We construct the associated static monopole--critical-bubble configuration in the full coupled radial Higgs--gauge system and show that it is a saddle of the static energy functional. The metastable monopole and monopole--critical-bubble branches are characterized by their profiles, energies, and radial Hessian spectra. The monopole--bubble solution carries a negative radial mode, while the metastable monopole remains locally stable until its lowest radial Hessian eigenvalue approaches zero. The resulting branch structure gives a direct static picture of how Coleman--Weinberg monopoles lose metastability, with critical rescaled scalar mass parameter \\(\\mu_c=0.064352(1)\\).", "url": "https://arxiv.org/abs/2606.19917", "type": "理论", "summary": "1. 该工作重新审视Coleman-Weinberg单极子问题，在完整耦合径向Higgs-规范系统中构造了静态单极子-临界气泡组态。\n2. 通过分析能量泛函鞍点及径向Hessian谱，揭示了亚稳态单极子失稳的临界标量质量参数μ_c=0.064352(1)及其分支结构。\n3. 这为研究辐射对称破缺下拓扑缺陷的亚稳态衰变提供了直接的静态图像和精确数值基准。", "summary_source": "deepseek", "authors": [{"name": "Sumit Shaw"}], "featured_authors": [{"name": "Sumit Shaw"}], "author_count": 1}, {"id": "2606.20018", "category": "hep-th", "title": "Leading UV Formula for Finite-Volume Vertex Operator Expectation Values in the Sine-Gordon Model from Kink NLIE", "abstract": "We study the ultraviolet (UV) limit of finite-volume expectation values of vertex operators in the sine-Gordon model using the kink nonlinear integral equation (NLIE) description of the conformal limit. By analysing the integrable formulation of vacuum expectation values in the small-volume regime, we conjecture an explicit analytic expression for the leading asymptotic term in the small-volume expansion, formulated in terms of kink functions. This establishes a direct connection between the integrable finite-volume description and the expected conformal asymptotics determined by the 3-point functions of the underlying conformal field theory (CFT). The proposed formula is tested against the analytic expression known from complex Liouville conformal field theory using high-precision numerics, showing agreement to at least 19 significant digits.", "url": "https://arxiv.org/abs/2606.20018", "type": "理论", "summary": "1. 该工作借助kink非线性积分方程（NLIE）推导出正弦-戈登模型有限体积顶点算子期待值的紫外前导解析公式，其表达式由kink函数显式构造。\n2. 核心在于将可积有限体积描述直接映射为复刘维尔共形场论三点函数所决定的紫外渐近行为，并经高精度数值验证，与已知解析结果在19位有效数字内完全一致。\n3. 这为可积场论中有限体积效应与共形极限间的精确对应提供了严格基准，并有望推广至其他具有类似边界条件的可积量子场模型。", "summary_source": "deepseek", "authors": [{"name": "Arpad Hegedus"}, {"name": "Apor Roth"}], "featured_authors": [{"name": "Arpad Hegedus"}, {"name": "Apor Roth"}], "author_count": 2}, {"id": "2606.20066", "category": "hep-th", "title": "Quantization of Brane-Skyrmions via Physics-Informed Neural Networks", "abstract": "In this work, we investigate the canonical quantization of topological solitons appearing in braneworld scenarios. In particular, we focus on Brane-Skyrmions, topological field configurations analogous to standard Skyrmions, which emerge as solutions of the Dirac-Nambu-Goto action supplemented by an induced curvature term. By quantizing the (iso)spin collective coordinates of the Brane-Skyrmion, we obtain a Hamiltonian that we solve perturbatively via an expansion in powers of $J^2$, in contrast to the standard Skyrme model. Furthermore, we implement a Physics-Informed Neural Network (PINN) to determine the soliton profile that minimizes the energy, consistently incorporating the backreaction from the quantized spin degrees of freedom. We conclude with a discussion of the potential applications of this framework to the description of hadronic spectra. Our results highlight both the theoretical potential of brane-defect models and the growing role of neural network methods in theoretical physics.", "url": "https://arxiv.org/abs/2606.20066", "type": "理论", "summary": "1. 该工作利用物理信息神经网络实现了膜世界拓扑孤子（Brane-Skyrmions）的规范量子化。\n2. 其核心在于通过J²幂次展开微扰求解量子化哈密顿量，并自洽纳入自旋集体坐标的反作用修正。\n3. 这为膜缺陷模型描述强子谱以及神经网络方法在孤子量子化中的推广提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Jose A. R. Cembranos"}, {"name": "Alberto García Martín-Caro"}, {"name": "Sergio S. Rentero"}], "featured_authors": [{"name": "Jose A. R. Cembranos"}, {"name": "Alberto García Martín-Caro"}, {"name": "Sergio S. Rentero"}], "author_count": 3}, {"id": "2606.20220", "category": "hep-th", "title": "Higher-loop wormhole length in sine-dilaton gravity from DSSYK Krylov complexity", "abstract": "The quantum wormhole length in sine-dilaton gravity has been shown to equal the Krylov spread complexity in the double-scaled SYK model. In the infinite temperature limit, we compute the five-loop semiclassical expansion of DSSYK complexity by singular perturbation of the operator Liouville-type equations of motion, extending the existing one-loop results. The same method is applied to evaluate the Krylov variance and third-order cumulant, related to the connected two- and three-point functions of the length operator at coincident points. The small- and large-time behaviour of these observables is also studied. In particular, for the large-time slope of the wormhole linear growth, we provide a conjecture for the resummation of the perturbative series, and discuss non-perturbative corrections revealed by numerical data.", "url": "https://arxiv.org/abs/2606.20220", "type": "理论", "summary": "1. 该工作通过正弦-膨胀引力中虫洞长度与DSSYK Krylov复杂度的等价性，将虫洞长度计算推广至五环半经典阶。\n2. 技术核心在于利用算子Liouville型运动方程的奇异微扰方法实现五环展开，并计算Krylov方差和三阶累积量，获取了长度算子的联结点两点和三点关联函数。\n3. 这为理解虫洞线性增长斜率的大时间行为提供了微扰级数重求和猜想及非微扰修正的数值证据，对非微扰量子引力研究具有启发。", "summary_source": "deepseek", "authors": [{"name": "Eleonora Alfinito"}, {"name": "Matteo Beccaria"}], "featured_authors": [{"name": "Eleonora Alfinito"}, {"name": "Matteo Beccaria"}], "author_count": 2}, {"id": "2606.20314", "category": "hep-th", "title": "Macroscopic Black-Hole Remnants in a Nonlocal Field Theory: Towards Hawking Radiation in SFT", "abstract": "We demonstrate that, for a large black hole of radius $a$, Hawking radiation terminates around the scrambling time $u_{\\text{scr}} \\equiv 2a \\log(a/\\ell)$ due to the nonlocal, exponential suppression of trans-Planckian interactions inherent in string field theory (SFT). Modifying a massless scalar field's interaction with a dynamical black hole background via the smearing operator $e^{\\ell^2\\Box}$ (where $\\ell$ denotes the string length scale), we calculate the time-dependent number expectation value $\\langle \\hat{N}(u) \\rangle$ of outgoing Hawking particles at retarded time $u$. While the standard Planck spectrum at the Hawking temperature is reproduced at early times ($u \\ll u_{\\text{scr}}$), the particle number approaches zero shortly after the scrambling time. This early shutoff reflects the property that the collapsing shell becomes effectively invisible to trans-Planckian modes, offering an alternative resolution to the black hole information paradox via a macroscopic remnant.", "url": "https://arxiv.org/abs/2606.20314", "type": "理论", "summary": "1. 该工作利用弦场论中的smearing算符e^{ℓ²□修改标量场与动态黑洞背景的相互作用，计算了出射霍金粒子数随延迟时间的演化。\n2. 其关键在于揭示霍金辐射在scrambling时间u_scr附近因非局域性对超普朗克模式的指数抑制而终止，导致宏观黑洞残留。\n3. 这为通过非局域场论中的残留机制解决黑洞信息悖论提供了理论依据，并启发对早期辐射关闭与残留稳定性的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Feng-Yin Cheng"}, {"name": "Pei-Ming Ho"}, {"name": "Wei-Hsiang Shao"}], "featured_authors": [{"name": "Feng-Yin Cheng"}, {"name": "Pei-Ming Ho"}, {"name": "Wei-Hsiang Shao"}], "author_count": 3}, {"id": "2606.20334", "category": "hep-th", "title": "The magic of the gravitational vacuum", "abstract": "The black hole information paradox challenges us to do something that is seemingly impossible: find a violation of the semiclassical approximation in a region where all curvatures are low. The vecro hypothesis proposes a structure of the gravitational vacuum that can accomplish this task. In this article we explain the hypothesis, and give a lattice model to describe the essence of its idea. The Hamiltonian of the model is completely local, but the vacuum exhibits correlations among planck scale fluctuations which fall off relatively slowly with distance. These extended-scale correlations are able to `feel around' the region where a closed trapped surface is about to form, and to react by nucleating fuzzball structure that destroys semiclassical spacetime.", "url": "https://arxiv.org/abs/2606.20334", "type": "理论", "summary": "1. 该工作提出引力真空的vecro假说，并构建了局域哈密顿量的晶格模型来刻画其核心物理思想。\n2. 卖点在于模型真空具有普朗克尺度涨落随距离缓慢衰减的长程关联，能探测闭陷俘面形成并触发破坏半经典时空的毛球结构。\n3. 这为在低曲率区域实现半经典近似违反提供了具体机制，启发了黑洞信息悖论的新求解路径。", "summary_source": "deepseek", "authors": [{"name": "Samir D. Mathur"}], "featured_authors": [{"name": "Samir D. Mathur"}], "author_count": 1}, {"id": "2606.20353", "category": "hep-th", "title": "Fortuity beyond counting: an explicit construction", "abstract": "We reconsider the \"fortuity'' mechanism in the D1D5 CFT focusing on the K3 symmetric orbifold. Going beyond the counting of BPS states, we investigate perturbatively how the explicit form of the BPS cohomologies is modified by the twist-two deformations. We calculate the action of the supercharges in the sector $(h,j)=(1,0)$ for different values of the central charge and derive explicit expressions for the primary states. Equipped with this information, we compare some protected three-point couplings in the free and the gravity regime. We show that agreement between the two descriptions imposes non-trivial constraints on the identification of monotone and fortuitous states. In particular, we argue that the map relating theories with different values of the central charge must and can be defined so as to commute with the supercharges that define the cochain complex. We then study the three-point correlators between the fortuitous and monotone states identified in our analysis to assess whether the two sectors are dynamically decoupled. We find an explicit example of a non-vanishing coupling between two monotone and a fortuitous state, providing evidence that the two sectors are dynamically connected.", "url": "https://arxiv.org/abs/2606.20353", "type": "理论", "summary": "1. 该工作在D1D5 CFT的K3对称orbifold中，显式构造了twist-two形变下BPS上同调的修正形式，并给出不同中心荷时(h,j)=(1,0)扇区的本初态。\n2. 其卖点在于通过比较自由与重力区域的三点耦合，证明fortuitous态与monotone态之间存在非零动力学耦合，且要求不同中心荷理论的映射与超荷对易。\n3. 这为理解fortuity机制中动力学扇区耦合提供了直接证据，并对AdS/CFT对应中保护性结构的约束条件给出了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Stefano Giusto"}, {"name": "James Inglis"}, {"name": "Rodolfo Russo"}], "featured_authors": [{"name": "Stefano Giusto"}, {"name": "James Inglis"}, {"name": "Rodolfo Russo"}], "author_count": 3}, {"id": "2606.20433", "category": "hep-th", "title": "Shadow Completion in Celestial OPEs", "abstract": "We argue that celestial OPEs must be supplemented by shadow-basis operators. Although the shadow transform does not introduce new bulk degrees of freedom, it provides a distinct primary state in the boundary celestial theory. From OPE consistency, we show that the ordinary celestial OPE does not close on Mellin-basis exchanges alone. Rather, the same exchanged bulk particle must also appear through its shadow-basis representative. This leads to a shadow-completed OPE, with the shadow OPE coefficient fixed by the ordinary collinear coefficient through the universal shadow factor. We discuss the corresponding boundary Hilbert-space interpretation, extend this argument to gluons and gravitons, and verify the shadow exchange directly in tree-level regular celestial amplitudes, including a scalar $2\\rightarrow n$ analysis and an explicit five-point example.", "url": "https://arxiv.org/abs/2606.20433", "type": "理论", "summary": "1. 该工作论证celestial OPE必须补充shadow-basis算子，从而提出shadow-completed OPE的概念。\n2. 其核心在于发现shadow OPE系数由普通共线系数通过普适shadow因子确定，并在树图振幅中验证了shadow交换。\n3. 这为celestial全息对偶中边界希尔伯特空间解释及胶子、引力子的扩展提供了明确基础。", "summary_source": "deepseek", "authors": [{"name": "Reiko Liu"}, {"name": "Zijian Liu"}, {"name": "Wen-Jie Ma"}], "featured_authors": [{"name": "Reiko Liu"}, {"name": "Zijian Liu"}, {"name": "Wen-Jie Ma"}], "author_count": 3}, {"id": "2606.20486", "category": "hep-th", "title": "Cosmological history after higher dimensional inflation", "abstract": "It was proposed that extra dimensions can acquire large size by higher dimensional inflation connecting two large hierarchies in particle physics and cosmology, namely the weakness of the actual gravitational force to the largeness of the observable universe, in terms of one fundamental scale. This proposal is consistent with the observed approximate scale invariant power spectrum of primordial density perturbations only for one or two extra dimensions of around the micron size. Assuming a stabilisation mechanism of the extra dimensions at the end of inflation, here we propose a cosmological history that describes the Universe evolution after the end of inflation up to the reheating temperature, that guarantees the absence of bulk gravitons at earlier times, avoiding their overproduction in the early universe. The proposed cosmological history connects the period of higher dimensional inflation to the beginning of the standard cosmology.", "url": "https://arxiv.org/abs/2606.20486", "type": "理论", "summary": "1. 该工作提出了高维膨胀结束后直至再加热温度的宇宙演化历史，解决了额外维稳定后的宇宙学衔接问题。\n2. 其卖点在于通过特定的宇宙热历史排除了早期体引力子的过度产生，保证了原初扰动谱与微米级额外维观测自洽。\n3. 这为连接高维膨胀与标准宇宙学开端提供了可行的演化方案，并约束了额外维稳定机制的时间尺度。", "summary_source": "deepseek", "authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Ignatios Antoniadis"}, {"name": "Jules Cunat"}], "featured_authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Ignatios Antoniadis"}, {"name": "Jules Cunat"}], "author_count": 3}, {"id": "2606.19845", "category": "math-ph", "title": "Universal Properties of Nonlinearly Perturbed Maxwell Theory", "abstract": "We show that a general nonlinearly perturbed Maxwell theory of electromagnetism possesses three universal fundamental properties: (i) A finite-energy electric point charge. (ii) Exclusion of finite-energy magnetic monopoles and dually charged dyons. (iii) Arbitrary smallness of the effective radius of a point electric charge and the associated local undetectedness of the electric charge and energy. In particular, this last property offers a classical explanation for the invisibility of the electron, as a point electric charge, in accordance with the smallness of its effective radius. This nonlinear theory of electromagnetism has the feature that it minimally perturbs the Maxwell theory with a nonlinearity profile that is as general as possible such that the three universal properties stated above are all maintained.", "url": "https://arxiv.org/abs/2606.19845", "type": "理论", "summary": "1. 该工作证明了一般非线性扰动麦克斯韦电磁理论普遍具备有限能量的电点电荷、排除有限能量磁单极子及对偶荷子、点电荷有效半径可任意小且局域不可测三个基本性质。\n2. 核心物理卖点在于以最普遍的扰动形式最小偏离麦克斯韦理论，并由此经典地解释了电子作为点电荷因有效半径极小而不可见的特性。\n3. 这为非微扰电磁理论的点电荷模型及经典极限下的粒子不可观测性提供了可推广的理论框架与深层启发。", "summary_source": "deepseek", "authors": [{"name": "Tengyang Liu"}, {"name": "Yisong Yang"}], "featured_authors": [{"name": "Tengyang Liu"}, {"name": "Yisong Yang"}], "author_count": 2}, {"id": "2606.20012", "category": "math-ph", "title": "Dirac structures on tangent bundles: a geometric framework for variational principles, constrained dynamics, and symmetry reduction", "abstract": "We introduce a Dirac structure on the tangent bundle of a configuration manifold, called a \\textit{Lagrange--Dirac structure}, which is naturally induced by the Lagrangian two-form associated with a (possibly degenerate) Lagrangian and a constraint distribution. This structure provides a unified geometric framework for Lagrange--Dirac dynamical systems, encompassing nonholonomic, degenerate Lagrangian, and symmetric systems. In the hyperregular case, the system recovers a first-order formulation of the Lagrange--d'Alembert equations. Although nonholonomic dynamics does not preserve the Lagrangian two-form, we show that the underlying Lagrange--Dirac structure is preserved up to gauge transformations, yielding a natural gauge covariance property. We also formulate an intrinsic variational principle directly on the tangent bundle, referred to as the \\textit{Lagrange--d'Alembert--Dirac principle}, which recovers Hamilton's principle in the unconstrained case and the Lagrange--d'Alembert principle in the hyperregular constrained case. Furthermore, we develop a reduction theory for systems with Lie group symmetry, deriving a reduced Lagrange--Dirac structure over the Lie algebra that yields the Euler--Poincaré--Dirac equations and a corresponding reduced variational principle. Finally, we illustrate the theory through examples including charged particles, electric circuits, and systems with Lagrangians linear in velocity, and present an infinite-dimensional extension to ideal fluids that naturally incorporates the incompressibility constraint and recovers the Euler equations.", "url": "https://arxiv.org/abs/2606.20012", "type": "理论", "summary": "1. 该工作引入切丛上的拉格朗日–狄拉克结构，为含非完整、退化拉格朗日及对称性系统提供统一几何框架。\n2. 其核心在于揭示非完整动力学中狄拉克结构具有规范协变性，并导出本征的拉格朗日–达朗贝尔–狄拉克变分原理。\n3. 这为带电粒子、电路及理想不可压流体等系统的约化建模与受约束变分描述提供了理论工具。", "summary_source": "deepseek", "authors": [{"name": "Hiroaki Yoshimura"}], "featured_authors": [{"name": "Hiroaki Yoshimura"}], "author_count": 1}, {"id": "2606.20505", "category": "math-ph", "title": "On the Emergence of Discrete Spectrum for Weakly Disordered Schrödinger Operators", "abstract": "We investigate the spectral properties of the Anderson operator perturbed by a localized negative potential, \\(-V\\). Specifically, we analyze the random Schrödinger operator defined by \\(H = -\\Delta +\\ve \\sum_{n} \\omega_n \\chi_n - V\\), where the unperturbed operator exhibits a disordered energy landscape. Our primary focus is to establish precise estimates on the number of negative eigenvalues (bound states) induced by the attractive perturbation. By analyzing the competition between Anderson localization and the binding capacity of the potential, we provide quantitative bounds on the discrete spectrum. These results offer new insights into how randomness enhances the eigenvalue bounds.", "url": "https://arxiv.org/abs/2606.20505", "type": "理论", "summary": "1. 该工作研究了弱无序薛定谔算子在局部负势扰动下离散谱的涌现，给出了负特征值数量的定量界。\n2. 其卖点在于揭示了安德森局域化与束缚势竞争如何增强离散谱界限的精确机制。\n3. 这为随机系统中束缚态形成及其对谱性质的调控提供了明确的理论启示。", "summary_source": "deepseek", "authors": [{"name": "Stanislav Molchanov"}, {"name": "Oleg Safronov"}], "featured_authors": [{"name": "Stanislav Molchanov"}, {"name": "Oleg Safronov"}], "author_count": 2}, {"id": "2606.19457", "category": "quant-ph", "title": "Efficient classical representation and quantum state preparation of complete active space wavefunctions", "abstract": "Quantum computers promise to solve the electronic structure problem for a large class of molecules. However, the performance of relevant quantum algorithms hinges on preparing initial states with substantial overlap with the target eigenvector. For classically challenging molecules with strong electron correlation, starting from multi-reference states, such as complete active space (CAS) wavefunctions is necessary. Unfortunately, the most advanced state preparation protocols applied to such states result in a gate complexity that scales exponentially with the active space size $d$. In fact, even encoding a CAS state classically is traditionally believed to be intractable for chemically relevant systems. Here, we draw insights from the recently introduced Quantum Paldus Transform (QPT) to show that there exists an efficient classical representation of CAS states and to design a new state preparation routine outperforming previous ones. The QPT represents a transformation from the Fock basis to a friendlier symmetry-adapted basis. Our main contribution consists in showing that CAS states expanded in this basis can efficiently be represented as a matrix product state (MPS) with a bond dimension scaling as $O(d^2)$. One can then efficiently load the MPS on a quantum computer and use the inverse QPT to transform the state to the Fock basis. Moreover, our method can easily be extended to the efficient preparation of CAS states in first quantisation with similar complexity. Crucially, we demonstrate that the complexity of both state preparation protocols only grows polynomially as $O(d^3)$ , which constitutes to the best of our knowledge an exponential improvement over the state of the art.", "url": "https://arxiv.org/abs/2606.19457", "type": "理论+数值", "summary": "1. 本文基于量子帕尔杜斯变换，提出了完全活性空间波函数的高效经典表示与量子态制备协议。\n2. 其技术核心在于将CAS态在变换基下表示为键维标度O(d²)的矩阵乘积态，并利用逆变换将其加载至量子计算机，使制备复杂度降至O(d³)，实现指数级改进。\n3. 这为强关联分子电子结构问题的量子模拟提供了首种多项式资源开销的多参考态制备方案。", "summary_source": "deepseek", "authors": [{"name": "Hamza Jnane"}], "featured_authors": [{"name": "Hamza Jnane"}], "author_count": 1}, {"id": "2606.19502", "category": "quant-ph", "title": "Entanglement Scaling and Problem Structure in Quantum Approximate and Adiabatic Optimization Algorithms", "abstract": "Entanglement is widely regarded as a key resource underlying the power of quantum algorithms and their potential to achieve quantum advantage. With the emergence of variational quantum algorithms, however, questions have arisen regarding how entanglement relates to problem structure and algorithmic performance in near-term quantum applications. Here, we examine this relationship through the Quantum Approximate Optimization Algorithm (QAOA), a specific class of variational algorithms, applied to the MaxCut problem. We show that suboptimal variational parameter training can significantly modify the observed entanglement profile, obscuring its scaling behavior. By employing a high-performance optimizer, we find empirical evidence that QAOA exhibits entanglement scaling consistent with that of fermionic Gaussian states (up to a scaling factor) across a broad range of MaxCut instances. We further compare these results with adiabatic quantum computation, observing annealing-schedule-dependent entanglement profiles whose scaling behavior differs markedly from that of QAOA. Together, these findings provide new insight into how entanglement manifests in and distinguishes these two algorithmic paradigms, highlighting its connection to both computational performance and application structure.", "url": "https://arxiv.org/abs/2606.19502", "type": "理论+数值", "summary": "1. 该工作通过量子近似优化算法（QAOA）研究MaxCut问题，系统分析了纠缠标度与问题结构的关系。\n2. 其核心发现是QAOA的纠缠标度与费米子高斯态一致（仅差比例因子），且亚优参数训练会显著改变纠缠轮廓，而绝热算法的纠缠标度则截然不同。\n3. 这揭示了纠缠在区分两种算法范式中的关键作用，为理解变分量子计算中纠缠与性能的关联提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Georgios Arapantonis"}, {"name": "Paraj Titum"}, {"name": "Gregory Quiroz"}], "featured_authors": [{"name": "Georgios Arapantonis"}, {"name": "Paraj Titum"}, {"name": "Gregory Quiroz"}], "author_count": 3}, {"id": "2606.19510", "category": "quant-ph", "title": "Exact Markovian Dissipation Requires Singular Energy Resources", "abstract": "The Gorini--Kossakowski--Lindblad--Sudarshan (GKLS) equation describes irreversible quantum dynamical semigroups. We show that this description cannot be exact under physically regular energy conditions. We prove that the open-system survival probability under physically regular energy conditions has sublinear decay, whereas any dissipative GKLS semigroup has a linear short-time decay. Hence exact Markovian dissipation requires singular energy resources: an unbounded-below total Hamiltonian or infinite initial energy, and a divergent interaction-energy moment. Therefore, a dissipative time-independent GKLS equation should be regarded as an effective description rather than the exact reduced dynamics of a Hamiltonian dilation satisfying physically regular energy conditions.", "url": "https://arxiv.org/abs/2606.19510", "type": "理论", "summary": "1. 该工作证明，在物理正则能量条件下（总哈密顿量有下界且初始能量有限），精确马尔可夫耗散不可能实现。\n2. 其核心论据在于：任何耗散GKLS半群具有线性短时衰减，而物理正则能量条件下的开放系统存活概率只能呈现亚线性衰减，两者矛盾。\n3. 因此，时间无关GKLS方程应视为有效描述而非精确约化动力学，其有效性依赖奇异能量资源（无下界哈密顿量或发散相互作用能矩）。", "summary_source": "deepseek", "authors": [{"name": "Hiroki Nakabayashi"}], "featured_authors": [{"name": "Hiroki Nakabayashi"}], "author_count": 1}, {"id": "2606.19545", "category": "quant-ph", "title": "Complexity of detecting large coefficients in the Pauli basis", "abstract": "We study the problem of deciding, given a mechanism to prepare a quantum state $\\rho$ and a value $\\varepsilon > 0$, whether there is some non-identity Pauli matrix $P$ such that $|Tr(P \\rho)| \\geq \\varepsilon$. We consider that the state $\\rho$ is described as the result of tracing out some of the qubits of a pure state prepared by a circuit $C$, and we assume the promise that either there is a Pauli matrix satisfying the stated condition or, instead, that for all non-identity Pauli matrices $P$ it is the case that $|Tr(P\\rho)|\\leq \\varepsilon/2$. The problem is in $QCMA$, and we prove that if it belongs to $BQP$ then $NP \\subseteq BQP$. The result is obtained through a reduction from the minimum-weight code problem, and it holds even when $\\rho$ is assumed to be a pure state (i.e. when no qubits are discarded) and $\\varepsilon$ is constant. This resolves an open question regarding the existence of efficient tomographic procedures to find the largest coefficients of a quantum state in the Pauli basis: namely, they do not exist under the standard hypothesis $NP \\nsubseteq BQP$.", "url": "https://arxiv.org/abs/2606.19545", "type": "理论", "summary": "1. 该工作研究了判定量子态ρ在泡利基下是否存在非恒等泡利算符P使得|Tr(Pρ)|≥ε这一问题的计算复杂性，其中ρ由电路C制备的纯态取部分迹得到。\n2. 通过从最小权重码问题归约，证明该问题属于QCMA，且若属于BQP则NP⊆BQP，表明即使对于纯态和固定ε，高效断层扫描程序也不存在（假设NP⊈BQP）。\n3. 这一结果为量子态断层扫描的固有计算难度提供了复杂性理论的下界，暗示经典模拟或验证量子态的大系数结构难以在多项式时间内完成。", "summary_source": "deepseek", "authors": [{"name": "Santiago Cifuentes"}], "featured_authors": [{"name": "Santiago Cifuentes"}], "author_count": 1}, {"id": "2606.19585", "category": "quant-ph", "title": "Electrical Noise Produced by Micron-Sized Particles above a Surface Paul Trap", "abstract": "Electric field noise produced by the surface of ion trap electrodes reduces the fidelity of quantum computing operations. Despite decades of investigation its microscopic origins remain unclear. Here, we measure electric field noise at trapping locations along the symmetry axis of a linear surface Paul trap. We find that noise levels vary by three orders-of-magnitude in one 600$\\,\\mu$m section of the trap. Optical and scanning electron microscope images show micron-sized particles close to the trapping locations with the highest noise levels. We find that modeling the particles as a lossy dielectric with a effective loss tangent $\\tan\\theta=0.33(0.06)$ describes the magnitude of the noise, as well as its spatial and frequency dependence. Our observations may explain the large variation of reported noise levels in literature.", "url": "https://arxiv.org/abs/2606.19585", "type": "理论", "summary": "1. 该工作在线性表面Paul阱中测量了沿对称轴不同位置的电场噪声，发现噪声水平在600微米区间内变化达三个数量级。\n2. 光学和扫描电镜图像显示高噪声位置附近存在微米级颗粒，将颗粒视为损耗介电体（有效损耗角正切0.33）可精确描述噪声幅值、空间及频率依赖性。\n3. 这一发现为长期以来离子阱量子计算中表面噪声的微观起源争议提供了直接物理解释，有望统一文献中报道的噪声水平巨大差异。", "summary_source": "deepseek", "authors": [{"name": "Ben Saarel"}, {"name": "Ozgur Sahin"}, {"name": "Hartmut Häffner"}, {"name": "Alpha T. N'Diaye"}], "featured_authors": [{"name": "Ben Saarel"}, {"name": "Ozgur Sahin"}, {"name": "Hartmut Häffner"}, {"name": "Alpha T. N'Diaye"}], "author_count": 4}, {"id": "2606.19593", "category": "quant-ph", "title": "Stalls and Spequlation: Pipelined Execution for Fault Tolerant Quantum Computation", "abstract": "Fault-tolerant quantum computation requires the coordinated action of three distinct systems: classical control logic, quantum hardware, and classical error decoders. Current scheduling models treat logical operations as atomic, hiding the fact that these subsystems operate sequentially and spend significant time idle. We present a pipelined execution framework that decomposes each logical operation into its component stages i.e. Control, Execute, and Decode. Building on this, we discuss some speculation strategies that allow successor operations to begin processing before their predecessors have completed decoding. We evaluate our framework on several common benchmarks and show that pipelining with speculation reduces total pipeline steps by 20-40% compared to a no-speculation baseline. The most aggressive strategy consistently outperforms conservative alternatives, even though partial rollback is needed at times, because the per-rollback penalty is small relative to the parallelism gained. We further show that speculation facilitates load balancing by distributing work more evenly across the heterogeneous subsystems of a fault-tolerant quantum computer, converting idle time into useful computation while also saving on execution time.", "url": "https://arxiv.org/abs/2606.19593", "type": "理论+数值", "summary": "1. 该工作针对容错量子计算中经典控制、量子硬件与纠错解码器顺序执行导致的空闲问题，提出了将逻辑操作分解为控制、执行、解码三阶段的流水线执行框架。\n2. 其核心卖点在于引入推测执行策略，允许后继操作在前驱解码完成前先行处理，实验表明该方案相比无推测基线减少20–40%流水线步骤，最激进策略尽管需部分回滚但回滚代价小，且能有效均衡异质子系统的负载。\n3. 这为容错量子计算中的经典-量子协同调度提供了定量优化方案，表明利用推测并行化可将空闲时间转化为有效计算，对降低解码延迟瓶颈、提升整体执行效率具有直接启发意义。", "summary_source": "deepseek", "authors": [{"name": "Aditi Awasthi"}, {"name": "Gokul Subramanian Ravi"}, {"name": "Jonathan Mark Baker"}], "featured_authors": [{"name": "Aditi Awasthi"}, {"name": "Gokul Subramanian Ravi"}, {"name": "Jonathan Mark Baker"}], "author_count": 3}, {"id": "2606.19628", "category": "quant-ph", "title": "Subsystem Quantum Error Correction for Noisy Quantum Metrology", "abstract": "Quantum error correction has been successfully applied to enhance the precision of parameter estimation in the presence of noise. Nonetheless, existing methods require a number of noiseless, controllable ancillae and lack efficient encoding and decoding procedures. In this Letter, we demonstrate that subsystem error correction provides a new direction that can substantially simplify the metrological protocol. We derive general conditions under which subsystem stabilizer codes achieve the Heisenberg limit and show that, for broad classes of noise, this can be realized by syndrome-free protocols using at most a single ancilla qubit. Furthermore, we extend this framework to dynamical error correction and show that Floquet codes can protect time-dependent metrological signals in reaching the Heisenberg limit.", "url": "https://arxiv.org/abs/2606.19628", "type": "数值", "summary": "1. 该工作提出利用子系统量子纠错方案，在噪声下提升参数估计精度并简化计量协议。\n2. 关键在于子系统稳定子码可借助至多一个辅助比特实现无综合征协议，达到海森堡极限。\n3. 这为动态纠错及时间相关计量信号保护指明新路径，有望推广至Floquet码等结构。", "summary_source": "deepseek", "authors": [{"name": "Qiushi Liu"}, {"name": "Sisi Zhou"}], "featured_authors": [{"name": "Qiushi Liu"}, {"name": "Sisi Zhou"}], "author_count": 2}, {"id": "2606.19765", "category": "quant-ph", "title": "Sparse positive maps on qutrits with exact nondecomposability thresholds and PPT-entanglement transitions", "abstract": "We study a family of sparse positive maps on qutrits for which positivity, decomposability, and PPT entanglement can all be analysed explicitly. The block structure of the associated Choi matrices reduces positivity to a Hermitian biquadratic form and leads to exact positivity boundaries for three representative parametric families. For the same families we determine the exact transition between decomposable and non-decomposable maps and construct associated PPT states of two classes. The first consists of witness-adapted deformations naturally tied to the non-decomposability analysis. The second consists of analytically tractable families whose full PPT-entangled branch is detected by fixed positive maps, yielding exact thresholds between separability and bound entanglement. For the trace-preserving subclass, we further compare positivity with a recent eigenvalue bound for 2-positive maps, thereby making the gap between positivity and higher-order positivity fully explicit within this family.", "url": "https://arxiv.org/abs/2606.19765", "type": "理论", "summary": "1. 该工作解析地研究了三比特上的一类稀疏正映射，获得了正性、可分解性与PPT纠缠的精确阈值。\n2. 通过Choi矩阵的块结构将正性条件化为Hermitian双二次型，精确确定了三个参数族的非可分解转变边界及两类PPT态的可分离-束缚纠缠过渡。\n3. 这一族映射使正性与高阶正性之间的差距完全显式，为多体量子纠缠判定与正映射理论提供了可严格求解的基准模型。", "summary_source": "deepseek", "authors": [{"name": "Davide Poderini"}, {"name": "Angela Rosy Morgillo"}, {"name": "Fabio Benatti"}, {"name": "Fabio Anselmi"}, {"name": "Chiara Macchiavello"}, {"name": "Massimiliano F. Sacchi"}], "featured_authors": [{"name": "Davide Poderini"}, {"name": "Angela Rosy Morgillo"}, {"name": "Fabio Benatti"}, {"name": "Fabio Anselmi"}, {"name": "Chiara Macchiavello"}, {"name": "Massimiliano F. Sacchi"}], "author_count": 6}, {"id": "2606.19873", "category": "quant-ph", "title": "Random Local Stabilizer Codes in Three Dimensions without String or Self-Similar Fractal Logical Operators", "abstract": "Quantum error-correcting codes (QECs) are essential components quantum computation and have deep connections to quantum phases of matter. A key obstruction to passive self-correcting QECs is the presence of string logical operators, which can generate logical errors through constant-energy-barrier processes. Haah's Codes (fracton codes) showed that three-dimensional stabilizer codes can forbid such string logical operators, but their translation-invariant structure supports self-similar fractal logical operators with a logarithmic energy barrier. We introduce the qutrit random cubic codes, a family of local qutrit Calderbank-Shor-Steane stabilizer Hamiltonians with similar cube-check structure as Haah's Code 1 but built from spatially varying stabilizers. We prove that these models retain the no-string property and numerically observe that they have properties distinct from translation-invariant fracton codes: the smallest ground-state degeneracy exponent is $k=2$ for odd $L$ and $k=4$ for even $L$; noncontractible plane-logical operators span the entire logical space; and charge-push diagnostics show that the self-similar fractal operators are absent. These results demonstrate that constrained randomness can fundamentally change the nature of stabilizer codes and improve their self-correction properties. They further point to broader families of quantum error-correcting codes and quantum phases beyond canonical topological and fracton orders.", "url": "https://arxiv.org/abs/2606.19873", "type": "理论+数值", "summary": "1. 该工作引入一类三维局域qutrit CSS稳定子哈密顿量——随机立方码，并证明其无弦逻辑算子且具备不同于平移不变分形码的新奇性质。\n2. 核心在于空间变化的稳定子结构有效抑制了自相似分形逻辑算子，数值显示基态简并度指数k=2或4、平面逻辑算子张满全空间，且电荷推动诊断证实分形算子消失。\n3. 这揭示了约束随机性可根本改变稳定子码的自纠正特性，为超越传统拓扑与分形序的量子纠错码及量子相提供了新的构造方向。", "summary_source": "deepseek", "authors": [{"name": "Han Yan"}], "featured_authors": [{"name": "Han Yan"}], "author_count": 1}, {"id": "2606.20009", "category": "quant-ph", "title": "The use of Peres lattices in periodically driven systems", "abstract": "We demonstrate the strength of the method of Peres lattices in periodically driven quantum systems. The method, which has previously been used mostly in stationary systems, enables us to efficiently detect resonances in the driven system, to monitor the onset of chaos, and to recognize critical properties of the Floquet modes. It also allows quick comparisons of the spectra of Floquet modes for various driving Hamiltonians and transparent tests of the iterative approximation techniques based on effective stationary Hamiltonians.", "url": "https://arxiv.org/abs/2606.20009", "type": "理论", "summary": "1. 该工作将Peres晶格方法从静态系统推广至周期驱动量子系统，用于高效检测共振、监控混沌 onset 及识别Floquet模的临界性质。\n2. 其技术优势在于可快速比较不同驱动哈密顿量的Floquet谱，并透明检验基于有效静态哈密顿量的迭代近似技术的准确性。\n3. 这为周期驱动量子系统中非平衡物理的谱分析及近似方法的可靠性评估提供了有力工具。", "summary_source": "deepseek", "authors": [{"name": "Lukáš Honsa"}, {"name": "Jan Střeleček"}, {"name": "Jakub Novotný"}, {"name": "Pavel Cejnar"}], "featured_authors": [{"name": "Lukáš Honsa"}, {"name": "Jan Střeleček"}, {"name": "Jakub Novotný"}, {"name": "Pavel Cejnar"}], "author_count": 4}, {"id": "2606.20024", "category": "quant-ph", "title": "Simulation of Non-Markovian Quantum Accelerated Dynamics via Time-Fractional Schrödinger Equation", "abstract": "The Time-Fractional Schrödinger Equation (TFSE) is an effective tool for simulating the dynamics of non-Markovian quantum systems. The Quantum Speed Limit (QSL) time characterizes the minimum time required for the evolution of a non-Markovian quantum system. In this paper, Wei's TFSE is employed to simulate the non-Markovian quantum accelerated evolution process in the Resonant Dissipative Jaynes-Cummings (RDJC) model. By solving the QSL time of a time-fractional single-qubit open system, the enhancement mechanism of the system evolution speed induced by the non-Markovian memory effects of the environment is revealed. Further studies show that the optimized acceleration of the system evolution can be achieved by jointly regulating the fractional order, coupling strength, and photon number. Comparative analyses indicate that Wei's TFSE can accurately capture the non-Markovian accelerated dynamical features of the system over the entire fractional order range, whereas Naber's TFSE is applicable only within a limited fractional order interval. In addition, the comparisons of the average simulation time for calculating the dynamical trajectory of the excited-state probability demonstrate that Wei's TFSE has a significant simulation advantage in computational efficiency. Therefore, Wei's TFSE is more accurate and efficient for simulating the accelerated dynamics of non-Markovian quantum systems.", "url": "https://arxiv.org/abs/2606.20024", "type": "理论+数值", "summary": "1. 该工作采用Wei的时间分数阶薛定谔方程模拟谐振耗散Jaynes-Cummings模型中的非马尔可夫量子加速动力学。\n2. 通过求解单量子比特开放系统的量子速度极限时间，揭示了非马尔可夫记忆效应对演化加速的增强机制，并证明Wei方程在全部分数阶范围内精度优于Naber方程且计算效率更高。\n3. 这为利用分数阶方法精确模拟并优化非马尔可夫量子系统的加速演化提供了理论与数值框架，可推广至更复杂的开放量子动力学问题。", "summary_source": "deepseek", "authors": [{"name": "Dongmei Wei"}, {"name": "Junxiang Wang"}, {"name": "Hanxiu Xu"}, {"name": "Cancan Chen"}, {"name": "Jiaying Wu"}], "featured_authors": [{"name": "Dongmei Wei"}, {"name": "Junxiang Wang"}, {"name": "Hanxiu Xu"}, {"name": "Cancan Chen"}, {"name": "Jiaying Wu"}], "author_count": 5}, {"id": "2606.20123", "category": "quant-ph", "title": "QPU-scale randomized benchmarking via Bell-pair injection", "abstract": "Mirror randomized benchmarking (MRB) is an established technique that provides a global error metric at the scale of a whole QPU. To expand upon this we introduce Mirror Quantum Awesomeness (MQA), a hybrid protocol that adds a structured entangling layer to MRB circuits. This enables per-edge correlation dynamics to be tracked via mutual information while preserving the MRB infidelity estimate. The resulting analysis of the injected entangled pairs locates a critical circuit depth, beyond which rudimentary error mitigation techniques can be expected to fail. A topological variant, Topological MQA, supplies a second critical depth via a decoder based on the surface-code decoding problem. Both are validated in simulation and demonstrated on the 156-qubit \\texttt{ibm\\_fez} and \\texttt{ibm\\_kingston} processors, where MQA closely agrees with MRB on the entanglement infidelity and the critical depth for \\texttt{ibm\\_fez} is found to be $\\sim 50$.", "url": "https://arxiv.org/abs/2606.20123", "type": "理论+数值", "summary": "1. 该工作提出名为Mirror Quantum Awesomeness (MQA)的混合协议，通过在镜像随机基准测试电路中注入贝尔对，实现QPU尺度的全局错误度量与每边关联动力学的同时表征。\n2. 其核心卖点在于利用互信息演化定位临界电路深度，超过该深度基本误差缓解技术预期失效；其拓扑变体进一步通过表面码解码问题提取第二个临界深度，形成双重视角的误差结构分析。\n3. 这为大规模量子处理器上误差缓解策略的适用边界提供了实验可验证的定量判据，156量子比特实验测得临界深度约50，对容错量子计算架构设计具有直接启示。", "summary_source": "deepseek", "authors": [{"name": "Haripriya Pettugani"}, {"name": "María Aguado-Yáñez"}, {"name": "Astryd Park"}, {"name": "Daniel Bultrini"}, {"name": "James R. Wootton"}], "featured_authors": [{"name": "Haripriya Pettugani"}, {"name": "María Aguado-Yáñez"}, {"name": "Astryd Park"}, {"name": "Daniel Bultrini"}, {"name": "James R. Wootton"}], "author_count": 5}, {"id": "2606.20153", "category": "quant-ph", "title": "Optimizing resource allocation for accuracy in noisy variational quantum algorithms", "abstract": "For quantum algorithms to achieve their full potential, we need methodologies to optimize them, such as reaching a given output accuracy with minimal resource costs. Here, we develop such a methodology for a class of Noisy Intermediate-Scale Quantum (NISQ) algorithms. We leverage simulations of a Variational Quantum Eigensolver (VQE) to propose a phenomenological model of such algorithms that captures the complex relationship between algorithmic accuracy, algorithmic resource costs, and the noise that exists in realistic quantum hardware. For this, we take the algorithmic resource cost to be the total number of quantum gate-operations in the algorithm; minimizing this cost typically makes the algorithm faster and more energy-efficient. We consider the subtle trade-off between quantum circuit size (small circuits are too imprecise, but large ones are too noisy), and the number of iterations of that quantum circuit for the full algorithm to sufficiently converge. Using a noise-metric-resource methodology, we identify the sweet spot (of circuit size versus iterations) that minimizes the algorithmic resource costs for a desired algorithm accuracy. It also gives the circuit size that maximizes algorithm accuracy for a fixed resource cost. Our methodology provides a practical guideline for near-term deployment of variational algorithms on realistic noisy hardware, including hardware that uses error mitigation.", "url": "https://arxiv.org/abs/2606.20153", "type": "理论+数值", "summary": "1. 该工作发展了一种针对含噪变分量子算法的资源分配优化方法，以最小化量子门操作总数实现给定输出精度。\n2. 其技术核心在于建立现象学模型，定量刻画算法精度与电路大小、迭代次数间的权衡，并确定资源成本最小化的甜点参数。\n3. 这为近中期含噪量子硬件上变分算法的部署及误差缓解策略提供了实用基准与定量指导。", "summary_source": "deepseek", "authors": [{"name": "Harshit Verma"}, {"name": "Thomas Ayral"}, {"name": "Alexia Auffèves"}, {"name": "Robert Whitney"}], "featured_authors": [{"name": "Harshit Verma"}, {"name": "Thomas Ayral"}, {"name": "Alexia Auffèves"}, {"name": "Robert Whitney"}], "author_count": 4}, {"id": "2606.20166", "category": "quant-ph", "title": "Applications of quantum annealing to magnetic dipole hyperfine structure constants: First results beyond energies for atoms", "abstract": "We report the first results of the magnetic dipole hyperfine structure (HFS) constants of neutral $\\mathrm{Li}$, Li-like $\\mathrm{Be}$, neutral $\\mathrm{Na}$, and Na-like $\\mathrm{Mg}$ using a modified version of the Quantum Annealer Eigensolver (QAE) algorithm on D-Wave's quantum hardware. The results are benchmarked against relativistic configuration interaction with multiconfiguration Dirac Hartree-Fock (MCDHF) calculations using the General-purpose Relativistic Atomic Structure Package (GRASP), and simulated annealing. In our modified QAE, a zooming-and-sigma-annealing approach with a floating-point encoding scheme is adopted to estimate the ground-state eigenvalue and eigenvector of the relativistic Dirac-Coulomb Hamiltonian matrices ($H_{\\mathrm{DC}}$) constructed from 11 or fewer configuration state functions (CSFs). For calculations with extended correlation orbital sets, we applied a CSF truncation scheme, retaining only CSFs (up to 12) that make significant contributions to the ground-state wavefunction. Our modified QAE precision is kept limited to three decimal places (up to 10 qubits). Hardware demonstrations on the D-Wave quantum processing unit (QPU) yielded results that were completely consistent with GRASP (at the chosen precision) in determining the magnetic dipole HFS constants, with accuracy varying across systems and $H_{\\mathrm{DC}}$ matrix dimensions.", "url": "https://arxiv.org/abs/2606.20166", "type": "理论+数值", "summary": "1. 该工作利用改进的量子退火算法在D-Wave量子处理器上首次计算了中性Li、Be、Na及类Li Be、类Na Mg的磁偶极超精细结构常数，并与模拟退火及相对论多组态Dirac-Hartree-Fock结果进行基准对比。\n2. 其技术核心是采用缩放-σ退火与浮点编码方案求解最多含11个组态函数的Dirac-Coulomb哈密顿矩阵的本征问题，并通过截断保留最多12个主要贡献组态以扩展相关轨道集。\n3. 硬件演示在选定精度（三位小数、最多10比特）下与GRASP计算结果完全一致，表明量子退火可有效计算原子超精细结构，为量子硬件在更复杂原子性质计算中的应用提供可行路径。", "summary_source": "deepseek", "authors": [{"name": "Boni Paul"}, {"name": "Subimal Deb"}, {"name": "Per Jönsson"}, {"name": "Jörgen Ekman"}, {"name": "Bhanu Pratap Das"}], "featured_authors": [{"name": "Boni Paul"}, {"name": "Subimal Deb"}, {"name": "Per Jönsson"}, {"name": "Jörgen Ekman"}, {"name": "Bhanu Pratap Das"}], "author_count": 5}, {"id": "2606.20176", "category": "quant-ph", "title": "Quantum-Accelerated Self-Consistent Field: A Hybrid Algorithm", "abstract": "We present the Grover adaptive search self-consistent field (GAS-SCF) algorithm. GAS-SCF leverages quantum arithmetic to construct an efficient oracle that marks target states (Fock states) which improve upon some initial classical energy estimate. Amplitude amplification then increases the probability of measuring these states. This approach offers a theoretical quadratic speed-up for the optimization problem encountered in SCF quantum chemistry and establishes a baseline against which structured optimization algorithms, such as QAOA and DQI may be compared. In this work, we classically simulate three examples as proofs of concept of the algorithm, the largest consisting of 26 qubits. We then extend our analysis to two larger systems, with O3 representing the largest case at 330 qubits. These examples are chosen to probe classically challenging SCF regimes. Achieving chemically relevant applications of GAS-SCF will require large-scale, fault-tolerant quantum hardware.", "url": "https://arxiv.org/abs/2606.20176", "type": "理论+数值", "summary": "1. 该工作提出量子加速自洽场混合算法GAS-SCF，利用量子算术构建标记目标福克态的oracle，并通过振幅放大实现优化问题的二次加速。\n2. 其技术卖点在于将幅度放大与自洽场能量优化结合，在26至330量子比特系统上经典模拟验证了概念，并为QAOA等结构化优化算法提供比较基准。\n3. 这为量子化学中自洽场优化问题的量子加速提供了明确路径，但需大规模容错量子硬件才能达到化学相关的实际应用。", "summary_source": "deepseek", "authors": [{"name": "Alexis Ralli"}, {"name": "Tim Weaving"}, {"name": "Thomas M. Bickley"}, {"name": "Peter V. Coveney"}, {"name": "Peter J. Love"}], "featured_authors": [{"name": "Alexis Ralli"}, {"name": "Tim Weaving"}, {"name": "Thomas M. Bickley"}, {"name": "Peter V. Coveney"}, {"name": "Peter J. Love"}], "author_count": 5}, {"id": "2606.20184", "category": "quant-ph", "title": "Operator Learning for efficient Quantum Computation", "abstract": "An efficient implementation of quantum algorithms is often hindered by the lack of efficient primitives for operators and state preparation. This limits both the ability of near-term quantum hardware to simulate complex problems and the potential of fault-tolerant algorithms to achieve practical quantum advantage. To address this, we propose a full-stack variational framework that transforms arbitrary operators to compact quantum circuits. The resulting variational circuits can be tailored to the connectivity and long-range interaction of the target hardware. The learning process employs backpropagation together with a cost function that efficiently optimizes unitary operators and non-unitary -- dense or sparse -- operators using only a single ancilla qubit for block encoding. Additionally, we introduce a regularization term that reduces the approximation error. The approach is validated for both quantum mechanical and engineering applications. In the former case, we learn propagators that arise in native quantum problems -- such as quantum simulation and quantum chemistry -- and achieve improved resource scaling in comparison to standard Suzuki-Trotter expansions. In the latter case, we demonstrate the approach's ability to implement the second-order central finite difference approximation of the Laplace operator -- relevant for solving partial differential equations -- while improving upon current error metrics. The final example deals with learning a dense, non-unitary operator that arises in the analysis of inviscid potential flow around an airfoil. This universality of the framework opens the door for solving general problems beyond prototypical engineering and quantum applications.", "url": "https://arxiv.org/abs/2606.20184", "type": "理论+数值", "summary": "1. 该工作提出一种全栈变分框架，将任意算符（包括非酉与稠密算符）转化为可适配目标硬件连接与长程相互作用的紧凑量子电路。\n2. 其核心在于利用反向传播结合仅需单个辅助量子比特的块编码代价函数，并引入正则化项降低近似误差，高效学习算符的量子电路表示。\n3. 此方法在量子模拟与化学中实现优于Suzuki-Trotter展开的资源缩放，并拓展至工程领域（如拉普拉斯算符、无粘势流），为通用量子算法的高效实现开辟新路径。", "summary_source": "deepseek", "authors": [{"name": "Paul Over"}, {"name": "Sergio Bengoechea"}, {"name": "Leonardo Borello Busilacchi"}, {"name": "Martin Kiffner"}, {"name": "Thomas Rung"}, {"name": "Alexios A. Michailidis"}], "featured_authors": [{"name": "Paul Over"}, {"name": "Sergio Bengoechea"}, {"name": "Leonardo Borello Busilacchi"}, {"name": "Martin Kiffner"}, {"name": "Thomas Rung"}, {"name": "Alexios A. Michailidis"}], "author_count": 6}, {"id": "2606.20271", "category": "quant-ph", "title": "Extracting the physical content of Liouvillian eigenmodes: Semiclassical quantization", "abstract": "Unlike in closed quantum systems where individual energy eigenstates are understood as physical excitations, open quantum systems have distinct right and left eigenstates of the Liouvillian that decay with time and are difficult to interpret. Here we introduce a physically motivated quasiprobability measure combining the two types of eigenstates that interprets a Liouville eigenmode as a set of coherences. This coherence measure is intimately connected to the return probability and allows one to visualize the modes as quasiprobability distributions in a \"doubled\" phase space. Using this measure we show that, remarkably, an oscillator retains its quantized \"orbits\" in phase space for a large class of linear and nonlinear damping, thus providing a formulation of semiclassical quantization for open systems. The orbits have measurable dynamical signatures and are broadened in the presence of a thermal bath, similar to energy levels. For quadratic systems, our results yield an extension of the concept of invariant tori, which play a central role in Hamiltonian systems.", "url": "https://arxiv.org/abs/2606.20271", "type": "理论", "summary": "1. 该工作引入一种拟概率测度，将Liouvillian本征模解释为相干性集合，从而提取其物理内容。\n2. 核心在于揭示振子在各类线性与非线性阻尼下仍保留量子化相空间轨道，实现开放系统的半经典量子化。\n3. 这为开放系统的半经典图像及二次系统中不变环面概念的推广提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Ashlin V Thomas"}, {"name": "Felix Fritzsch"}, {"name": "Masudul Haque"}, {"name": "Shovan Dutta"}], "featured_authors": [{"name": "Ashlin V Thomas"}, {"name": "Felix Fritzsch"}, {"name": "Masudul Haque"}, {"name": "Shovan Dutta"}], "author_count": 4}, {"id": "2606.20278", "category": "quant-ph", "title": "Proposal of quantum arrival-time measurement with a Bose-Einstein condensate", "abstract": "This work shows how a Bose-Einstein condensate of ultracold atoms could be used to address a long-standing question in quantum theory: how much time does it take for a particle to reach a detector? To this end, we propose a realistic experimental setup, whose key idea is not to measure arrival times directly, but the arrival flux on the detector as a function of its position. This novel approach not only solves practical issues with having a detector close to the system, but also results in signals that allow to unambiguously distinguish different theoretical predictions. This proposal raises prospects for resolving the decades-old debate on this fundamental issue.", "url": "https://arxiv.org/abs/2606.20278", "type": "实验", "summary": "1. 该工作提出利用超冷原子玻色-爱因斯坦凝聚体实现量子到达时间测量的实验方案。\n2. 其核心创新在于通过测量探测器位置依赖的到达通量而非直接时间，有效规避探测器靠近系统的实际困难，并能明确区分不同理论预言。\n3. 这一方案为最终解决量子力学中粒子到达时间这一长期基础性争议提供了可行的实验检验途径。", "summary_source": "deepseek", "authors": [{"name": "Pascal Naidon"}, {"name": "Lucas Happ"}, {"name": "Denis Boiron"}], "featured_authors": [{"name": "Pascal Naidon"}, {"name": "Lucas Happ"}, {"name": "Denis Boiron"}], "author_count": 3}, {"id": "2606.20306", "category": "quant-ph", "title": "Quantum Batteries as Work Sources for Phase-Locked Parametric Amplification", "abstract": "Quantum batteries have been proposed as locally precharged work sources for superconducting quantum technologies, suggesting a route to reduce continuously supplied microwave drives. Here we ask whether the pump tone of a quantum-limited parametric amplifier can be replaced, or strongly duty-cycled, by a finite bosonic quantum battery. Quantizing the pump of a nondegenerate parametric amplifier exposes a resource distinction hidden in the classical description: stored pump energy can generate signal-idler photons, but pump phase coherence is required to generate a phase-locked amplifier field. In a closed trilinear model, coherent and phase-randomized coherent pumps with the same photon-number distribution produce comparable pair numbers, yet only the coherent pump produces anomalous two-mode coherence and an EPR-squeezed interference dip. Including leakage, we collect the emitted fields into cascaded temporal modes. At matched collector bandwidth, the coherent pump gives \\(I_{\\min}^{(f)}=0.553\\), whereas the phase-randomized pump gives \\(I_{\\min}^{(f)}=1.94\\) at nearly identical collected energy. Weak amplitude squeezing slightly improves the dip by reducing finite-pump number fluctuations while preserving the coherent displacement. Thus battery-powered parametric amplification requires phase-coherent stored energy, possibly assisted by number-noise reduction, rather than stored energy alone.", "url": "https://arxiv.org/abs/2606.20306", "type": "理论", "summary": "1. 该工作通过量化非简并参量放大器泵浦场，在封闭三线性模型下检验有限玻色子量子电池替代连续泵浦音作为锁相放大工作源的可行性。\n2. 核心物理发现：相干泵浦与光子数分布相同的相位随机化泵浦产生可比的光子对数目，但仅相干泵浦通过相位锁定实现反常双模相干性与EPR型压缩谷，在匹配收集带宽下最小强度噪声达0.553，远低于后者的1.94。\n3. 这明确电池驱动参量放大需同时依赖存储能量的相位相干性与数噪声抑制，为超导量子技术中无需连续微波驱动的信号放大方案提供设计准则。", "summary_source": "deepseek", "authors": [{"name": "Borhan Ahmadi"}], "featured_authors": [{"name": "Borhan Ahmadi"}], "author_count": 1}, {"id": "2606.20313", "category": "quant-ph", "title": "Entanglement structure of the dynamical phases in the sub-Ohmic spin-boson model", "abstract": "The sub-Ohmic spin-boson model exhibits three distinct dynamical regimes in its spin population dynamics, classified as coherent, incoherent, and pseudo-coherent. Whether these regimes correspond to distinct spin-bath entanglement structures remains an open question. Here we address this using tree tensor network states with projector-splitting time evolution (TTN-TDVP-PS), scanning a broad grid in the sub-Ohmic $(s, \\alpha)$ plane. We find that the spin entanglement entropy $S_\\mathrm{spin}(t)$ reaches a stationary plateau on a timescale shorter than the polarization relaxation, enabling construction of a stationary entropy landscape from the stationary value $S_\\mathrm{stable}$. Within this scalar entropy landscape, the entropy ridge broadly follows the population-based phase boundary at small $s$, but does not reproduce the two-branch structure at large $s$. The ridge remains single-valued within the incoherent region rather than separately tracking both population-based transitions. The Bloch-sphere representation provides a geometric interpretation of this behavior. The entropy plateau corresponds to trajectories settling onto constant-radius shells, with the ridge marking the parameters of smallest stationary Bloch radius. Mode-resolved bath entanglement shows that low-frequency modes dominate the environmental entropy scale and that coherent dynamics enhance bath-mode correlations beyond direct spin--mode correlations. These results establish the stationary spin entanglement entropy as a physically informative observable that complements population-based classifications of dissipative quantum dynamics.", "url": "https://arxiv.org/abs/2606.20313", "type": "理论+数值", "summary": "1. 该工作利用树张量网络态结合投影分裂时间演化方法，在亚欧姆自旋-玻色模型的(s, α)参数平面上高分辨率扫描，系统刻画了相干、非相干与赝相干动力学相的自旋-环境纠缠结构。\n2. 其核心发现在于自旋纠缠熵S_spin(t)在极化弛豫前达到平稳平台，由平稳值构建的熵脊在小s时与布居相边界大体吻合，大s时不呈现双支结构，且低频率模主导环境熵尺度，平稳布洛赫半径最小处定位熵脊。\n3. 这证明了平稳自旋纠缠熵可作为补充传统布居分类的物理可观测量，为揭示耗散量子动力学中的纠缠相变及环境谱响应提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Cunxi Gong"}, {"name": "Zirui Sheng"}, {"name": "Weitang Li"}], "featured_authors": [{"name": "Cunxi Gong"}, {"name": "Zirui Sheng"}, {"name": "Weitang Li"}], "author_count": 3}, {"id": "2606.20316", "category": "quant-ph", "title": "Exploiting More Than Symmetry in Variational Quantum Machine Learning", "abstract": "The success of variational quantum learning models crucially depends on choosing parametrizations that reflect the structure of the problem at hand. Symmetries provide one of the clearest such structures: whenever transformations of the input leave the desired outcome unchanged, this invariance should be built into the model rather than discovered during training. However, imposing a symmetry does not by itself determine a useful ansatz. Even within the symmetry-preserving space, one must decide where the trainable degrees of freedom should be placed. In this work, we study this remaining design freedom in equivariant variational quantum circuits. Building on symmetry-based parameter sharing, we disentangle two architectural choices: how much symmetry should be enforced, and which symmetry-respecting interactions should be trainable. Using Tic-Tac-Toe as a fully enumerable and structurally transparent test case, we find that suitable subgroups preserve most of the generalization benefit. By contrast, the dominant gains arise from gates acting directly on decisive task motifs. Thus, symmetry defines the admissible design space, while effective ansatze require an additional task-informed choice of trainable interactions.", "url": "https://arxiv.org/abs/2606.20316", "type": "理论+数值", "summary": "1. 该工作系统研究了等变变分量子电路中超出对称性约束的设计自由度，明确区分了对称性强弱与可训练相互作用的选择。\n2. 核心发现是：对称性仅定义允许的设计空间，而泛化性能的主要提升源于直接作用于任务关键决策模式的可训练门，而非对称性本身。\n3. 这启示在设计高效量子机器学习模型时，需在对称性约束基础上进一步依据任务结构有针对性地配置可训练自由度。", "summary_source": "deepseek", "authors": [{"name": "Markus Baumann"}, {"name": "Claudia Linnhoff-Popien"}], "featured_authors": [{"name": "Markus Baumann"}, {"name": "Claudia Linnhoff-Popien"}], "author_count": 2}, {"id": "2606.20380", "category": "quant-ph", "title": "Discrimination of genuinely nonlocal sets without entanglement in multipartite systems", "abstract": "Genuine nonlocality arises when a set of multipartite orthogonal states is locally indistinguishable under any bipartition of the subsystems. The entanglement-assisted discrimination of such genuinely nonlocal orthogonal product sets has attracted significant attention in quantum information. Based on the criterion of local irreducibility, genuine nonlocality is classified into Type I (reducible) and Type II (irreducible). We present entanglement-assisted discrimination schemes for both types of genuinely nonlocal sets that use minimal resources. For low-dimensional cases, Type I sets require only a single EPR pair, whereas Type II sets necessitate only one GHZ state. We extend these protocols to higher-dimensional systems: the discrimination of Type I sets requires only one maximally entangled state in a two-qutrit system, while that of Type II sets similarly demands a single maximally entangled state in a three-qutrit system. For $n$-partite ($n > 3$) systems, Type I sets continue to require only one maximally entangled state, whereas Type II sets necessitate just one additional EPR pair compared to their Type I counterparts. These results provide a robust framework for the efficient discrimination of genuinely nonlocal sets using minimal quantum resources.", "url": "https://arxiv.org/abs/2606.20380", "type": "理论", "summary": "1. 该工作针对多体系统中Type-I与Type-II两类真正非局域正交乘积集合，提出了使用最少纠缠资源的辅助区分方案。\n2. 其核心在于证明低维情况下Type-I集仅需一个EPR对、Type-II集仅需一个GHZ态即可区分，且该资源最小性在任意维度和粒子数下保持。\n3. 这为量子信息中非局域性资源的分类与高效利用提供了可扩展的理论框架，并启发对更复杂非局域集合的资源优化研究。", "summary_source": "deepseek", "authors": [{"name": "Ziying Hou"}, {"name": "Huaqi Zhou"}, {"name": "Limin Gao"}], "featured_authors": [{"name": "Ziying Hou"}, {"name": "Huaqi Zhou"}, {"name": "Limin Gao"}], "author_count": 3}, {"id": "2606.20385", "category": "quant-ph", "title": "Sparse Configuration Interaction for the Electronic Schrödinger Equation Revisited: Complete Basis Set Limit Complexity and Quantum-Encoding Impact", "abstract": "In this article we revisit regularity results for eigenfunctions in the discrete spectrum of the electronic Schrödinger equation and study their consequences for approximation complexity. In particular, for the convergence to the complete basis set limit, it can be shown that the curse of dimensionality in the leading algebraic exponent can be mitigated. That is, for general sparse grid constructions, the main term of the convergence rate with respect to the number of degrees of freedom is independent of the number of electrons. These insights indicate potential benefits for classical numerical solvers of the electronic Schrödinger equation and also for quantum-computing approaches through new qubit-efficient wavefunction encodings.", "url": "https://arxiv.org/abs/2606.20385", "type": "理论+数值", "summary": "1. 该工作重新考察了电子薛定谔方程离散谱本征函数的正则性，并分析了其对完全基组极限下逼近复杂度的影响。\n2. 其核心技术贡献在于证明稀疏网格构造的收敛速率主项与电子数无关，从而缓解了维数灾难的代数指数。\n3. 这为经典数值求解器以及基于量子比特高效波函数编码的量子计算方法提供了新的复杂度缓解途径。", "summary_source": "deepseek", "authors": [{"name": "Michael Griebel"}, {"name": "Jan Hamaekers"}], "featured_authors": [{"name": "Michael Griebel"}, {"name": "Jan Hamaekers"}], "author_count": 2}, {"id": "2606.20513", "category": "quant-ph", "title": "Approximating optimal decoding of quantum LDPC codes with narrow frontiers", "abstract": "We introduce the Frontier decoder, a pruned dynamic-programming decoder for sparse quantum decoding problems. Frontier processes error variables in a chosen order, merges prefixes with the same residual syndrome and logical label, and approximates logical-coset posterior masses by retaining only a narrow scored frontier. Without pruning, the recursion is exact ordered inference with exponential complexity. In the code-capacity setting, the decoder reaches thresholds close to optimal for the surface code and the color code. In the circuit-level noise model, it achieves state-of-the-art performance with a very small average retained list size: less than 100 for the gross code $[[144,12,12]]$ at a physical error rate of $0.001$. When the list size is constant, the decoder has linear complexity, suggesting the possibility of low-latency implementations.", "url": "https://arxiv.org/abs/2606.20513", "type": "理论", "summary": "1. 该工作引入Frontier解码器，一种基于剪枝动态规划的近似方法，用于稀疏量子LDPC码的最优解码问题。\n2. 其技术卖点是通过按序处理错误变量、合并相同残差综合征与逻辑标签的前缀，并保留窄前沿来近似逻辑陪集后验质量，在码容量下表面码与颜色码阈值接近最优，电路级噪声下对[[144,12,12]]码平均列表小于100且具有线性复杂度。\n3. 这一线性复杂度近似策略为低延迟量子纠错解码提供了可行途径，并启发将此类高效有序推理推广至更广泛的量子LDPC码与噪声场景。", "summary_source": "deepseek", "authors": [{"name": "Anthony Leverrier"}, {"name": "Rüdiger Urbanke"}], "featured_authors": [{"name": "Anthony Leverrier"}, {"name": "Rüdiger Urbanke"}], "author_count": 2}, {"id": "2606.20519", "category": "quant-ph", "title": "GPU-accelerated semidefinite programming for causal games", "abstract": "The process matrix formalism describes quantum correlations in scenarios without a fixed causal order between local laboratories. Operational signatures of such correlations can be investigated through causal games. A paradigmatic example is the Guess-Your-Neighbour's-Input game, in which two parties attempt to guess each other's inputs. Correlations compatible with any definite, or probabilistically mixed, causal order cannot achieve a winning probability exceeding $1/2$. The best process-matrix strategy currently known attains a value of approximately $0.6218$ using local dimension $d=5$, while the strongest known dimension-independent upper bound is $0.7592$. In this work, we investigate whether increasing the local dimension beyond $d = 5$ can narrow this gap. To this end, we employ a see-saw optimization scheme in which each step is formulated as a semidefinite program. For scalability, we develop a custom implementation of the SCS solver in which the dominant computational cost, the projection onto the positive-semidefinite cone, is offloaded to a GPU, yielding a six-fold speedup. Using this implementation, we explore local dimensions up to $d = 8$, and we do not find significant improvements over the value at $d=5$. Our results suggest that either qualitatively different strategies are required to approach the known upper bound, or that the bound itself is not tight.", "url": "https://arxiv.org/abs/2606.20519", "type": "理论+数值", "summary": "1. 该工作采用GPU加速半定规划执行see-saw优化，探究Guess-Your-Neighbour's-Input因果游戏在局部维度d=5至8时的可达成获胜概率。\n2. 技术亮点是将SCS求解器中计算密集的正半定锥投影操作并行化到GPU，获得约六倍加速，从而使得对d=8等更高维半定规划的高效求解成为可能。\n3. 结果表明d>5时获胜概率未明显提升，暗示当前基于过程矩阵的策略已达瓶颈，接近0.7592上界可能需要根本不同的策略构造，或者该上界不紧。", "summary_source": "deepseek", "authors": [{"name": "Emanuel-Cristian Boghiu"}, {"name": "Kyrylo Simonov"}], "featured_authors": [{"name": "Emanuel-Cristian Boghiu"}, {"name": "Kyrylo Simonov"}], "author_count": 2}, {"id": "2606.20551", "category": "quant-ph", "title": "Benchmark of quantum algorithms for ground state preparation in the presence of noise", "abstract": "We compare the performance of representative cooling, adiabatic, and optimization algorithms for ground-state preparation in the presence of noise. Using an exactly solvable family of quadratic fermionic Hamiltonians subject to depolarizing noise, we derive the scaling of the achievable relative energy as a function of the noise rate and support these results with numerical simulations. The Hamiltonian exhibits two phases, separated by a quantum phase transition. As expected, the performance of the different algorithms depends on the phase: adiabatic evolution is favorable in the trivial phase, while a multi-frequency cooling algorithm, as proposed in [1], becomes competitive or superior in the topological phase, where gap-closing limits adiabatic protocols. We further present numerical results for the quantum approximate optimization algorithm [2], showing that it performs competitively with cooling in the trivial phase but is typically outperformed in the topological regime. Finally, we show that for this model the cooling protocol exhibits enhanced robustness to parameter imperfections, highlighting its potential advantage for realistic implementations of noisy quantum state preparation. The analytical approach developed here, in conjunction with numerical validation, establishes an extendable approach to benchmarking ground-state preparation algorithms.", "url": "https://arxiv.org/abs/2606.20551", "type": "理论+数值", "summary": "1. 该工作系统比较了冷却、绝热与优化算法在退极化噪声下制备基态的性能。\n2. 利用可解二次费米子模型，揭示了拓扑相中多频冷却算法因规避能隙闭合而超越绝热方案的优势。\n3. 所得解析框架与数值验证为噪声环境中量子基态制备算法的可扩展基准测试提供了方法。", "summary_source": "deepseek", "authors": [{"name": "Daniel Molpeceres"}, {"name": "Sirui Lu"}, {"name": "J. Ignacio Cirac"}, {"name": "Barbara Kraus"}], "featured_authors": [{"name": "Daniel Molpeceres"}, {"name": "Sirui Lu"}, {"name": "J. Ignacio Cirac"}, {"name": "Barbara Kraus"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
