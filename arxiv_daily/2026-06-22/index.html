<head>

  <title>arXiv 2026-06-22 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2606.19418", "category": "cond-mat", "title": "Sequential replica exchange with solute tempering for atomistic modeling of supramolecular polymer structures", "abstract": "Predicting detailed atomistic structures of self-assembling systems remains a challenge for all-atom molecular dynamics simulations. Replica exchange with solute tempering (REST) has been used to study those systems by accelerating all monomers in a global and uniform manner. While such a global approach can in principle predict any morphology of the system, it has computational drawbacks such as inefficient replica traversal due to order-disorder transitions and the growing number of replicas with system size. To address these issues, here we propose an alternative, stepwise construction approach to modeling supramolecular polymers under the assumption of one-dimensional polymerization. Specifically, we generate polymer structures by adding new monomers one by one to the system and applying REST to the new monomers to find their optimal binding positions based on an energy-based scoring function. The monomer addition and enhanced sampling are repeated sequentially until a polymer of desired length is obtained. We test the above procedure using a model supramolecular polymer in explicit solvent, and show that it can generate a polymer structure with characteristic H-bonding patterns at reduced computational costs, while also improving the efficiency of replica traversal significantly. We thus expect that the sequential REST will be useful for modeling supramolecular polymers, particularly for cases where global REST simulations are too demanding computationally.", "url": "https://arxiv.org/abs/2606.19418", "type": "理论+数值", "summary": "1. 该工作提出了一种顺序溶质交换副本（sequential REST）方法，用于超分子聚合物的逐歩原子建模。\n2. 其核心在于将单聚合物通过逐一添加单体并对其执行REST增强采样，避免了全局无序-有序转变导致的副本遍历低效与计算成本膨胀。\n3. 此策略为计算昂贵的全局REST模拟提供了可行替代，尤其适用于一维聚合体系的结构预测与氢键模式识别。", "summary_source": "deepseek", "authors": [{"name": "Hadi H. Arefi"}, {"name": "Takeshi Yamamoto"}], "featured_authors": [{"name": "Hadi H. Arefi"}, {"name": "Takeshi Yamamoto"}], "author_count": 2}, {"id": "2606.19421", "category": "cond-mat", "title": "Electrical magnetochiral anisotropy in Rashba superconductors", "abstract": "We theoretically investigate the role of higher-order Lifshitz invariants in nonreciprocal charge transport in two-dimensional noncentrosymmetric superconductors with Rashba spin-orbit coupling. In the superconducting state, these symmetry-allowed terms give rise to critical-current nonreciprocity, while in the normal state near the superconducting transition they generate a pronounced magnetochiral anisotropy. Using symmetry-constrained group-theoretical methods, we systematically construct the allowed Lifshitz invariants and derive the corresponding vector structure of the nonreciprocal current. To describe nonlinear transport in the fluctuation regime, we apply a generalized time-dependent Ginzburg-Landau theory that incorporates both the Aslamazov-Larkin contribution from fluctuation-induced Cooper pairs and the Maki-Thompson contribution associated with quantum interference in the Cooper channel. We further analyze the effects of disorder scattering and dephasing on the resulting nonreciprocal response.", "url": "https://arxiv.org/abs/2606.19421", "type": "理论+数值", "summary": "1. 该工作利用对称性约束的群论方法系统构造了Rashba超导体中允许的高阶Lifshitz不变量，并推导了非互易电流的矢量结构。\n2. 其核心在于揭示高阶Lifshitz不变量在超导态产生临界电流非互易性，而在正常态涨落区则驱动显著的磁手征各向异性。\n3. 这为理解二维非中心对称超导体中无序散射和退相干对非互易输运的影响提供了理论框架，并启发相关材料体系的实验研究。", "summary_source": "deepseek", "authors": [{"name": "Joaquim Telles de Miranda"}, {"name": "Maxim Khodas"}, {"name": "Alex Levchenko"}], "featured_authors": [{"name": "Joaquim Telles de Miranda"}, {"name": "Maxim Khodas"}, {"name": "Alex Levchenko"}], "author_count": 3}, {"id": "2606.19426", "category": "cond-mat", "title": "Three-dimensional Foliated Fractional Quantum Hall Phases", "abstract": "Foliated topological orders in three dimensions are layered systems in which anyons are free to move within a layer but cannot hop between them. A simple model with such a phase is a stack of decoupled two-dimensional electron gases in a strong magnetic field, each in the same fractional quantum Hall state. By focusing on the case of filling $\\nu=1/3$ of the lowest Landau level in each layer, we show that (i) the limit of decoupled Laughlin states is stable upon introducing interlayer interactions and (ii) the system can enter a spontaneously layer-trimerized foliated non-Abelian Fibonacci phase. We support our claims by numerical exact diagonalization of up to 10 layers as well as perturbative analytical calculations. Specifically, we show that the foliated Fibonacci phase exists in the 9-layer system with pseudopotential interactions within and between neighboring layers. We identify the phase via quasihole counting and by calculating the overlap with a model wave function which we derive from the associated conformal field theory. Our numerical results suggest the possibility of realizing these phases in layered van der Waals crystals in strong magnetic fields, as well as in multilayer heterostructures.", "url": "https://arxiv.org/abs/2606.19426", "type": "理论+数值", "summary": "1. 该工作通过精确对角化和微扰计算，研究了多层ν=1/3分数量子霍尔系统的三维叶状拓扑序，证明解耦Laughlin态的稳定性并发现自发层三聚化的非阿贝尔Fibonacci相。\n2. 其技术核心在于利用准空穴计数及共形场论模型波函数重叠识别相变，揭示了层间相互作用从阿贝尔态到非阿贝尔叶状相的转变机制。\n3. 这为在层状范德华晶体或多层异质结中实现三维叶状拓扑序提供了理论可行性，并可能推动非阿贝尔任意子的分层量子计算应用。", "summary_source": "deepseek", "authors": [{"name": "Sahana Das"}, {"name": "Navketan Batra"}, {"name": "Andrea Kouta Dagnino"}, {"name": "Dan Mao"}, {"name": "Nicolas Regnault"}, {"name": "Glenn Wagner"}, {"name": "Titus Neupert"}], "featured_authors": [{"name": "Sahana Das"}, {"name": "Navketan Batra"}, {"name": "Andrea Kouta Dagnino"}, {"name": "Nicolas Regnault"}, {"name": "Glenn Wagner"}, {"name": "Titus Neupert"}], "author_count": 7}, {"id": "2606.19431", "category": "cond-mat", "title": "Odd fluids from chiral cellular automata", "abstract": "Cellular automata are discrete dynamical systems defined on a lattice, in which each site carries a finite set of states that evolve in time according to local deterministic rules. An important application of cellular automata is in lattice gas models of fluids, where the cellular automaton framework provides a particle-based microscopic description of hydrodynamic behavior. The macroscopic fluid equations emerge after coarse-graining over many lattice sites and time steps, offering a bottom-up route to hydrodynamics. A celebrated example is the Frisch-Hasslacher-Pomeau (FHP) model, an automaton defined on a two-dimensional triangular lattice that yields the two-dimensional Navier-Stokes equations upon coarse-graining. In this work, we construct a parity-breaking generalization of the FHP model through two modifications: introducing chiral two-body collision rules and systematically rotating particle velocities to mimic the effect of a background magnetic field. We show that this automaton yields a hydrodynamic model with odd viscosity, a transverse transport coefficient that is a hallmark of odd fluids. We verify the analytical transport coefficients using Poiseuille-flow simulations of the chiral FHP automaton. Our results demonstrate that the chiral automaton introduced here provides a bridge between microscopic parity-breaking scattering processes and macroscopic odd-fluid hydrodynamics.", "url": "https://arxiv.org/abs/2606.19431", "type": "理论+数值", "summary": "1. 该工作通过引入手性二体碰撞规则和系统旋转粒子速度，构建了FHP格子气自动机的奇偶性破缺推广模型。\n2. 其核心在于微观手性散射过程经粗粒化后自然导出宏观奇数粘度，并利用泊肃叶流动模拟验证了输运系数。\n3. 这建立了从微观手性相互作用到宏观奇数流体行为的直接桥梁，为设计非互易流体系统提供了全新的离散动力学范式。", "summary_source": "deepseek", "authors": [{"name": "Andrew A. Allocca"}, {"name": "Shiva Heidari"}, {"name": "Thomas Iadecola"}, {"name": "Armin Rahmani"}, {"name": "Pouyan Ghaemi"}, {"name": "Sriram Ganeshan"}], "featured_authors": [{"name": "Andrew A. Allocca"}, {"name": "Shiva Heidari"}, {"name": "Thomas Iadecola"}, {"name": "Armin Rahmani"}, {"name": "Pouyan Ghaemi"}, {"name": "Sriram Ganeshan"}], "author_count": 6}, {"id": "2606.19437", "category": "cond-mat", "title": "Many-Body Protection of Topological Edge Memory in Strong Interacting Quenches", "abstract": "Quantum quenches drive edge states far from equilibrium, yet whether the memory of a topological initial state survives in a non-integrable, interacting system has remained largely unexplored. We study this question in the bond-alternating XXZ chain -- an interacting Su--Schrieffer--Heeger model hosting symmetry-protected topological edge modes with markedly enhanced boundary magnetization -- and analyze quenches across all combinations of single-particle and many-body initial and final Hamiltonians. The results organize by a single distinction as we rigorously establish in this work: whether the post-quench Hamiltonian is free or genuinely interacting. For a free post-quench Hamiltonian, the dynamics is solved exactly by a correlation-matrix approach; the boundary-mode return amplitude decays as $t^{-3/2}$, and initial interactions enter only through a dressed one-body density matrix. For a genuinely interacting post-quench Hamiltonian, finite-time stability bounds prove that away from local resonances the first-dimer magnetization remains stable on time windows growing as arbitrarily large powers of the inverse inter-dimer coupling. Matrix product state simulations across all four protocols show that interactions in the final Hamiltonian markedly extend finite-time boundary memory -- with local suppression near the isotropic $SU(2)$ point -- revealing a many-body protection mechanism in a non-integrable system where scrambling would otherwise wash out initial-state memory fast.", "url": "https://arxiv.org/abs/2606.19437", "type": "理论+数值", "summary": "1. 通过分析交变XXZ链中不同淬火协议下的边界磁化动力学，该工作严格区分了淬火后哈密顿量为自由或相互作用情形对拓扑边缘记忆的影响。\n2. 对于自由后淬火哈密顿量，边界模返回幅度精确衰减为t^{-3/2}；而对于真正相互作用情形，远离局域共振时第一二聚体磁化在任意大功率逆耦合时间窗口内保持稳定。\n3. 这一非可积系统中的多体保护机制表明，强相互作用可显著延长非平衡拓扑边界记忆，为拓扑量子存储的相干保持提供了新的物理途径。", "summary_source": "deepseek", "authors": [{"name": "Yuxiao Hang"}, {"name": "Stephan Haas"}, {"name": "Rishabh Jha"}], "featured_authors": [{"name": "Yuxiao Hang"}, {"name": "Stephan Haas"}, {"name": "Rishabh Jha"}], "author_count": 3}, {"id": "2606.19465", "category": "cond-mat", "title": "Exact operator dynamics in Lindbladian Wess-Zumino-Witten conformal field theories", "abstract": "Understanding the time evolution of physical observables in open quantum many-body systems coupled to external environments is a natural and difficult problem, and exact results are still rare. In this work, we study this problem for Wess-Zumino-Witten (WZW) conformal field theories with Lindblad jump operators linear in Kac-Moody current modes. We investigate the exact operator dynamics generated by these Lindbladians, identifying classes of current operators whose Heisenberg equations close and can therefore be solved analytically using the underlying current algebra. In Abelian $U(1)_k$ WZW theories, this closure of operator dynamics holds for arbitrary settings of jump rates and includes exactly tractable cooling dynamics. In contrast, for non-Abelian WZW theories, exact closure occurs only for symmetric current-mode dissipation, where upward and downward current-mode transitions occur with equal rates, and even then it leads to a simple closed evolution only for a single current operator. Generic imbalances, including those needed for cooling, produce additional non-Abelian terms and prevent closure of the opeartor dynamics. Consequently, the current algebra gives rise to a broad family of exactly solvable dissipative dynamics in the Abelian setting, whereas in the non-Abelian case it singles out only a special exactly solvable dynamics corresponding to an infinite-temperature bath.", "url": "https://arxiv.org/abs/2606.19465", "type": "理论+数值", "summary": "1. 该工作系统研究了带线性于Kac-Moody电流模的Lindblad跳变算符的Wess-Zumino-Witten共形场论中的精确算符动力学。\n2. 核心卖点在于利用电流代数使海森堡方程闭合，从而解析求解Abelian U(1)_k理论中任意跳变率的冷却动力学，并严格指出非Abelian情况仅在对称电流模耗散下对单个电流算符闭合，否则非Abelian项阻止闭合。\n3. 这为开放共形场论提供了一族精确可解耗散动力学，并揭示了非Abelian电流代数从根本上限制了可解性，仅对应无穷温浴的特例。", "summary_source": "deepseek", "authors": [{"name": "Qicheng Tang"}, {"name": "Ruhanshi Barad"}, {"name": "Xueda Wen"}], "featured_authors": [{"name": "Qicheng Tang"}, {"name": "Ruhanshi Barad"}, {"name": "Xueda Wen"}], "author_count": 3}, {"id": "2606.19571", "category": "cond-mat", "title": "Optical spin injection in graphane and fluorographene", "abstract": "We theoretically investigate the optical spin-injection response in different stoichiometric configurations of graphane and fluorographene using density functional theory. Our goal is to determine which configuration yields the strongest degree of spin polarization. The results show that the fluorographene zigzag configuration yields the best degree of spin polarization response (${\\cal DSP}^{\\mathrm{z}}$), with 98\\% spin polarized electrons at the band edge and over a wide range of excitation photon energies. In contrast, other graphane and fluorographene configurations achieve a ${\\cal DSP}^{\\mathrm{z}}$ of roughly 83--100\\%, but only within a limited photon-excitation energy range. In structures with low spin-orbit coupling, the degree of spin polarization is close to 100\\% over a wide range of photon energies. For higher spin-orbit coupling, this strong response appears, but only in a narrow photon energy region. Additionally, under the band-resolved decomposition scheme, the contributions of different band-to-band transitions to the ${\\cal DSP}^{\\mathrm{z}}$ spectrum are identified by summing only the selected valence and conduction bands. Our findings show that almost the entire ${\\cal DSP}^{\\mathrm{z}}$ spectrum of the fluorographene zigzag configuration comes from transitions that involve only the top valence band, which is a mixture of C--p and F--p states.", "url": "https://arxiv.org/abs/2606.19571", "type": "理论+数值", "summary": "1. 该工作利用密度泛函理论系统计算了不同化学计量构型石墨烯与氟化石墨烯的光学自旋注入响应。\n2. 其核心发现是氟化石墨烯锯齿构型在宽光子能量范围内实现98%带边自旋极化，且该极化几乎完全源自顶部C-p与F-p杂化价带至导带的跃迁。\n3. 这为在低自旋轨道耦合体系中实现宽谱高效全光学自旋注入提供了明确材料设计思路。", "summary_source": "deepseek", "authors": [{"name": "Angélica Marina López-Martínez"}, {"name": "César Castillo-Quevedo"}, {"name": "Cesar Camas-Flores"}, {"name": "Analila Luna-Valenzuela"}, {"name": "Jose Luis Cabellos"}], "featured_authors": [{"name": "Angélica Marina López-Martínez"}, {"name": "César Castillo-Quevedo"}, {"name": "Cesar Camas-Flores"}, {"name": "Analila Luna-Valenzuela"}, {"name": "Jose Luis Cabellos"}], "author_count": 5}, {"id": "2606.19582", "category": "cond-mat", "title": "Deposition and Growth of the AlCoCuFeNi High-Entropy Alloy Thin Film: Molecular Dynamics Simulation", "abstract": "The growth of a thin film of a high-entropy AlCoCuFeNi alloy on a silicon (100) substrate was studied using molecular dynamics modeling. The simulation was carried out using the embedded atom model to describe the interactions among Al, Co, Cu, Ni, and Fe atoms. The interaction between Al, Co, Cu, Fe, Ni atoms and the Si substrate was modeled using the Lennard-Jones potential, while the interaction between silicon atoms was described using the Stillinger-Weber potential. The total simulation time was 50 ns. It was found that small clusters were formed at the first stage of deposition and that crystallization started after approximately 5 ns of simulation, when the characteristic cluster size was about 2 nm. At the end of the simulation, after 50 ns of modeling, the simulated film contained face-centered cubic, body-centered cubic, hexagonal close-packed, and amorphous phases. Analysis of the radial distribution function made it possible to determine nearest-neighbor distances and estimate the lattice parameters of these phases.", "url": "https://arxiv.org/abs/2606.19582", "type": "理论+数值", "summary": "1. 该工作通过分子动力学模拟研究了AlCoCuFeNi高熵合金薄膜在硅(100)衬底上的沉积与生长过程。\n2. 其技术核心在于采用嵌入原子势描述合金原子间相互作用，并联合Lennard-Jones势与Stillinger-Weber势处理衬底界面，揭示了薄膜从成核、结晶至多相共存（FCC、BCC、HCP及非晶相）的演化路径。\n3. 这一模拟框架为理解高熵合金薄膜微结构形成机制提供了原子级视角，对实验调控薄膜相组成与晶格参数具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Oleksandr I. Kushnerov"}, {"name": "Valerij F. Bashev"}, {"name": "Sergey I. Ryabtsev"}], "featured_authors": [{"name": "Oleksandr I. Kushnerov"}, {"name": "Valerij F. Bashev"}, {"name": "Sergey I. Ryabtsev"}], "author_count": 3}, {"id": "2606.19740", "category": "cond-mat", "title": "Enhanced electronic correlations and altermagnetic ground state of two-dimensional CsCr3Sb5 monolayers", "abstract": "Recently, layered corrected kagome metal CsCr3Sb5 have garnered significant attention attributed to its flat bands near the Fermi level (EF) and altermagnetic ground state [ Yi Liu et al., Nature 632, 1032 (2024)]. However, the van Hove singularities (vHSs) in bulk CsCr3Sb5 are far away from the EF, while an effective modulation of VHS toward the EF is essential for exploring intriguing electron transport properties. In this work, using first-principles calculations, we investigate electronic structures of two-dimensional (2D) Cr3Sb5 and CsCr3Sb5 monolayers which may be mechanically exfoliated from bulk materials. Notably, it is revealed that both flat bands and vHSs simultaneously reside in close proximity to the EF in Cr3Sb5 monolayer, signifying enhanced electronic correlations. Importantly, a tensile strain further shifts the incipient flat bands and vHSs of two monolayers simultaneously to the vicinity of the EF, suggesting strain tunable electronic correlations and concomitant quantum effects. Furthermore, altermagnetic ground state is also revealed due to retained mirror symmetry between two sublattices in these two monolayers. Thus, this work advances understanding and modulations of electronic properties of 2D CsCr3Sb5 monolayers, strengthening their great potential for exploring unconventional quantum phenomena and altermagnetism.", "url": "https://arxiv.org/abs/2606.19740", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算，系统研究了从层状笼目金属CsCr3Sb5机械剥离获得的二维Cr3Sb5与CsCr3Sb5单层的电子结构。\n2. 其核心卖点是二维单层中平带与van Hove奇异点同时紧邻费米能级，显著增强电子关联，且拉伸应变可协同调谐二者至费米能级附近，同时子晶格间镜面对称性保留导致交错磁基态。\n3. 这为在二维笼目体系中通过应变工程调控电子关联、实现交错磁体并探索相关非常规量子现象提供了理论指导和材料平台。", "summary_source": "deepseek", "authors": [{"name": "Z. H. Guan"}, {"name": "Z. L. Peng"}, {"name": "W. Z. Zhuo"}, {"name": "G. Tian"}, {"name": "Z. P. Hou"}, {"name": "D. Y. Chen"}, {"name": "Z. Fan"}, {"name": "X. B. Lu"}, {"name": "X. S. Gao"}, {"name": "M. H. Qin"}, {"name": "J. M. Liu"}], "featured_authors": [{"name": "Z. H. Guan"}, {"name": "Z. L. Peng"}, {"name": "W. Z. Zhuo"}, {"name": "X. S. Gao"}, {"name": "M. H. Qin"}, {"name": "J. M. Liu"}], "author_count": 11}, {"id": "2606.19780", "category": "cond-mat", "title": "Thickness-Dependent Interlayer Coupling and Semiconductor-to-Semimetal Crossover in Arsenene Multilayers", "abstract": "Interlayer interactions in layered materials are often assumed to transfer from the bilayer to the bulk, but this assumption can fail when chemically active out-of-plane orbitals participate in bonding. We combine diffusion quantum Monte Carlo (DMC) and density functional theory (DFT) to determine how interlayer coupling evolves in arsenene multilayers. DMC shows that bulk gray arsenic is compact, whereas the corresponding few-layer structures remain at substantially larger interlayer separations despite sharing the same nominal A$_{1}$B$_{-1}$ adjacent-layer registry. Registry alone therefore does not determine the bonding regime; thickness and coordination reshape the interlayer interaction. Among the tested functionals, SCAN+rVV10 most closely reproduces DMC equilibrium separations and stacking energetics. Using the DMC-benchmarked SCAN+rVV10 calculations, we predict a thickness-driven stacking sequence from A$_{1}$A$_{1}$ to A$_{1}$B$_{1}$ and finally bulk-like A$_{1}$B$_{-1}$. The structural crossover coincides with a stacking-dependent DFT band-gap collapse driven by enhanced interlayer As p$_{z}$ hybridization.", "url": "https://arxiv.org/abs/2606.19780", "type": "理论+数值", "summary": "1. 该工作采用扩散量子蒙特卡洛与密度泛函理论，系统研究了砷烯多层膜中随厚度演化的层间耦合行为及半导体-半金属转变。\n2. 其核心发现是，层间键合并非仅由相邻层堆垛方式决定，厚度和配位数重构了相互作用，且SCAN+rVV10泛函最精确复现DMC平衡层间距与堆垛能量。\n3. 这为理解维度驱动的电子结构相变及层状材料中非简谐层间耦合的基准化提供了关键定量基础。", "summary_source": "deepseek", "authors": [{"name": "Jeonghwan Ahn"}, {"name": "Seoung-Hun Kang"}, {"name": "Jaron T. Krogel"}], "featured_authors": [{"name": "Jeonghwan Ahn"}, {"name": "Seoung-Hun Kang"}, {"name": "Jaron T. Krogel"}], "author_count": 3}, {"id": "2606.19977", "category": "cond-mat", "title": "Interplay of Altermagnetism and Coupled Quasi-Altermagnetic states in Sliding Two-dimensional Square Lattice", "abstract": "The emergence of non-relativistic spin splitting (NRSS) in altermagnetic systems has introduced a new paradigm in antiferromagnets with vanishing net magnetization. Although sliding-induced valley-polarized phases have recently been demonstrated in two-dimensional altermagnets, the observed valley-polarized state represents only a partial manifestation of altermagnetism, and a comprehensive classification based on spinsplitting characteristics remains lacking. Here, using first-principles calculations, general stacking theory, and spin-Laue symmetry analysis, we propose a coupled quasialtermagnetic state representing a distinct subclass of altermagnetism, in which reversible type-IV NRSS is controlled through interlayer sliding. Accordingly, the sliding-induced phases are classified into two categories: altermagnetic and quasi-altermagnetic states. We establish a direct correspondence between reciprocal-space spin splitting and real-space switching between the two quasi-altermagnetic states. Importantly, the spin-polarized bands in these states remain spin split at {\\Gamma} point even in the absence of spin-orbit coupling (SOC), distinguishing them within the proposed classification framework. To demonstrate the interplay between altermagnetic and quasi-altermagnetic states, we investigate the two-dimensional Lieb-lattice material Mn2WS4 and its Janus derivative Mn2WS2Se2, analysing how changes in the local environment influence the different magnetic phases. Importantly, the underlying mechanism is broadly applicable to a wide class of twodimensional square-lattice systems. We further investigate the effects of SOC, focusing on spin texture and transport signatures in coupled quasi-altermagnetic states.", "url": "https://arxiv.org/abs/2606.19977", "type": "理论+数值", "summary": "1. 该工作结合第一性原理计算、通用堆叠理论及自旋-Laue对称性分析，在滑动二维正方晶格中将诱导相分为交变磁态与耦合准交变磁态，并提出了后者的严格定义。\n2. 其核心技术在于揭示了可逆的IV型非相对论性自旋分裂可通过层间滑动调控，且在Γ点无自旋轨道耦合下仍保持自旋极化，建立了倒空间分裂与实空间两种准交变磁态切换的直接对应。\n3. 该机制广泛适用于二维正方晶格体系，通过对Mn2WS4及其Janus衍生物Mn2WS2Se2的验证，展示了局域环境对磁相的影响，并为自旋轨道耦合作用下的自旋纹理与输运研究提供了明确依据。", "summary_source": "deepseek", "authors": [{"name": "Bhautik R Dhori"}, {"name": "Deepak Upadhyay"}, {"name": "Prafulla K Jha"}], "featured_authors": [{"name": "Bhautik R Dhori"}, {"name": "Deepak Upadhyay"}, {"name": "Prafulla K Jha"}], "author_count": 3}, {"id": "2606.20020", "category": "cond-mat", "title": "Effects of interaction range on the mean-field dynamics of Bose polarons", "abstract": "We consider the three-dimensional Bose polaron problem in the regime of finite range interactions and competing length scales. Working in the reference frame of the impurity, we study both static and out of equilibrium properties of the system, in particular the transfer of momentum between the impurity and the host gas. We find that relaxation dynamics can occur via damped oscillations of the impurity velocity with simple dependence on the interaction strength. Furthermore, the equilibration process is sensitive to the type of the impurity-bath interaction. Specifically, interatomic forces describing ion-atom systems lead to much longer timescales and more pronounced oscillations in the strong coupling regime with respect to local interaction potentials. We also find that the effective masses can differ by a large amount between the two scenarios, even if the number of atoms in the polaron cloud remains similar for both cases.", "url": "https://arxiv.org/abs/2606.20020", "type": "理论", "summary": "1. 本文在有限相互作用范围与竞争长度尺度下，从杂质参考系研究三维Bose极化子的平均场动力学，聚焦杂质与宿主气体间的动量传递及阻尼振荡弛豫行为。\n2. 核心发现在于离子-原子型长程相互作用相比局域势会导致显著更长的弛豫时间、更强烈的振荡，且两者有效质量差异巨大，即使极化子云原子数相近。\n3. 这揭示了相互作用作用范围对极化子非平衡弛豫与有效质量的关键影响，为冷原子-离子混合体系中极化子动力学的实验设计与理论建模提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Piotr Wysocki"}, {"name": "Ubaldo Cavazos Olivas"}, {"name": "Marek Tylutki"}, {"name": "Krzysztof Jachymski"}], "featured_authors": [{"name": "Piotr Wysocki"}, {"name": "Ubaldo Cavazos Olivas"}, {"name": "Marek Tylutki"}, {"name": "Krzysztof Jachymski"}], "author_count": 4}, {"id": "2606.20040", "category": "cond-mat", "title": "Electrostatic effects in nano-reactor-confined charge regulated macroions", "abstract": "We formulate a thermodynamic model of a nano-reactor containing charge-regulated macroions within an electrolyte-permeable enclosure. The model is then formalized within the Poisson-Boltzmann electrostatics augmented by the consistent inclusion of the charge dissociation of molecular groups residing on the surface of the entrapped macroions via charge regulation formalism. By solving the basic equilibrium equations in the linearized Debye-Hückel type approximation, we analyze the salient features of the inhomogeneous electrolyte distribution and macroion charge. We found that the surface charge asymmetry/symmetry of the macroions strongly affects the spatial profile of electrostatic potential. The effective screening length shows the non-monotonic behavior, arising from the complex interplay between the bathing external solution and macroion effective charges, which govern charge regulation equilibria. The total pressure at the nano-reactor enclosure boundary decreases monotonically as the enclosure radius and the ionic bulk salt concentration increase. Also, the resulting pressure is strongly influenced by the surface charge densities of the nano-reactor and the number of confined macroions.", "url": "https://arxiv.org/abs/2606.20040", "type": "理论", "summary": "1. 该工作建立了纳米反应器内电荷调控大分子的热力学模型，结合Poisson-Boltzmann静电学与电荷调节形式，在Debye-Hückel线性化近似下分析了电解质分布与大分子电荷特性。\n2. 主要卖点在于揭示了大分子表面电荷不对称性强烈影响静电势空间分布，且有效屏蔽长度呈现非单调行为，其根源在于外部溶液与大分子有效电荷间的复杂耦合调控电荷平衡。\n3. 这为理解纳米反应器边界总压力随半径和盐浓度的单调递减行为提供了定量解析，并对优化胶体封装系统及控制界面静电压力具有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Manit Klawtanong"}, {"name": "Petch Khunpetch"}, {"name": "Huaqiong Li"}, {"name": "Shigeyuki Komura"}], "featured_authors": [{"name": "Manit Klawtanong"}, {"name": "Petch Khunpetch"}, {"name": "Huaqiong Li"}, {"name": "Shigeyuki Komura"}], "author_count": 4}, {"id": "2606.20049", "category": "cond-mat", "title": "Constraint-Limited Tube Orientation of Entangled Polymers in Oscillatory Shear Deformation", "abstract": "We develop a molecularly motivated description of the nonlinear index (NLI) in oscillatory shear deformation of entangled polymers. The central assumption is that the shear component of the tube-orientation tensor cannot grow without bound. Convective constraint release (CCR), chain stretch, and tube dilation progressively reduce the number and lifetime of orientational constraints, but the maximum shear alignment of a tube segment is geometrically limited by $S_{xy}\\leq 1/2$. This motivates a constraint-limited orientation closure in which the NLI first grows approximately with strain amplitude and then approaches the limiting value $\\mathrm{NLI}_{\\max}=3$ asymptotically rather than through an artificial cutoff. The same framework yields a molecular expression for the characteristic half-saturation strain $\\gamma_s$, defined by $\\mathrm{NLI}(\\gamma_s)=3/2$, in terms of the entanglement number, oscillation frequency, and a critical number of remaining orientational constraints. We further derive architecture-dependent expressions for the nonlinear onset strain $\\gamma_c$ for linear, sparsely long-chain-branched, and more regularly branched polymers. The resulting framework provides a compact bridge between Fourier harmonic analysis, CCR-based tube dynamics, and the progressive loss of orientational memory in highly deformed entangled polymer liquids.", "url": "https://arxiv.org/abs/2606.20049", "type": "理论", "summary": "1. 该工作建立了缠结聚合物在振荡剪切形变中非线性指数(NLI)的分子理论框架。\n2. 其特色在于基于管取向剪切分量Sxy≤1/2的几何约束，提出约束限制取向闭合模型，使NLI随应变幅增长并渐近趋于最大值3，无需引入人为截断。\n3. 该框架通过半饱和应变与临界应变的解析表达式，将谐波分析、CCR管动力学及取向记忆损失联系统一，可推广至不同支化结构。", "summary_source": "deepseek", "authors": [{"name": "Dario Nichetti"}, {"name": "Alessio Zaccone"}], "featured_authors": [{"name": "Dario Nichetti"}, {"name": "Alessio Zaccone"}], "author_count": 2}, {"id": "2606.20070", "category": "cond-mat", "title": "\\textit{E.\\ coli} bacterium near corrugated surfaces: near-suface swimming, escape, and hydrodynamic trapping}", "abstract": "Bacteria often swim in complex environments where surfaces are ubiquitous and rarely flat. Surface topography and curvature can strongly affect bacterial motility, with important consequences for surface exploration, adhesion, and biofilm formation. Here, we investigate the swimming of a non-tumbling \\textit{Escherichia coli} bacterium near an undulating no-slip surface using hydrodynamic simulations of a detailed model bacterium. The latter is described by a rigid spherocylindrical cell body and flexible flagella modeled with the Kirchhoff rod theory, while the surrounding fluid is simulated using the method of multi-particle collision dynamics. At low curvatures of the sinusoidal surface modulations, the bacterium exhibits persistent near-surface swimming and clockwise trajectories, consistent with the known behavior near flat no-slip walls. As the curvature increases, bacteria swimming toward a ridge can escape from the surface, which we use to estimate a critical curvature where surface detachment is more likely. At larger curvatures, we find that the surface geometry promotes oscillatory swimming along the groove direction, which reduces escape opportunities and, therefore, enhances bacterial trapping. Indeed, the confinement around the groove reverses the swimming of the bacterium from clockwise to counter-clockwise, as we demonstrate by two minimal models. Thus our work highlights the importance of the three-dimensional surface topography in bacterial surface exploration.", "url": "https://arxiv.org/abs/2606.20070", "type": "理论+数值", "summary": "1. 该工作通过多粒子碰撞动力学耦合基尔霍夫杆模型，模拟了非翻滚大肠杆菌在正弦起伏无滑移表面附近的游泳动力学。\n2. 其核心物理发现是：随表面曲率增大，细菌从沿脊逃逸转变为沿沟槽振荡游动，轨迹顺时针-逆时针反转，并显著增强了水动力捕获。\n3. 这为理解三维表面形貌调控细菌界面探索、黏附及生物膜形成的力学机制提供了定量理论预测。", "summary_source": "deepseek", "authors": [{"name": "Pierre Martin"}, {"name": "Gonçalo C. Antunes"}, {"name": "Holger Stark"}], "featured_authors": [{"name": "Pierre Martin"}, {"name": "Gonçalo C. Antunes"}, {"name": "Holger Stark"}], "author_count": 3}, {"id": "2606.20168", "category": "cond-mat", "title": "Norms, overlaps and Yangian descendants for the Haldane--Shastry spin chain", "abstract": "The Haldane-Shastry spin chain is a prototypical integrable model with long-range interactions, notable for hosting quasiparticles with fractional statistics and serving as a discrete analogue of a conformal field theory. Its remarkable simplicity is closely tied to a full Yangian spin symmetry. While the highest-weight states for this symmetry are known explicitly, a systematic treatment of the descendant states, needed for the computation of various physical quantities, has remained incomplete. In this work, we provide a detailed construction of these descendants in terms of the algebraic Bethe ansatz following recent work of Ferrando et al. In the limit of extreme twist, it includes the Gelfand-Tsetlin basis. As an application, we derive product and determinant formulae for norms and overlaps of these states.", "url": "https://arxiv.org/abs/2606.20168", "type": "理论", "summary": "1. 该工作利用代数Bethe ansatz系统构建了Haldane–Shastry自旋链的Yangian后代态，并导出了这些态的范数与重叠的行列式和乘积公式。\n2. 其技术核心在于通过极端扭曲极限将后代态构造约化为Gelfand–Tsetlin基，从而统一处理具有长程相互作用和分数统计的可积模型。\n3. 这为精确计算该链的物理量（如关联函数和纠缠熵）提供了代数框架，并为其他Yangian对称可积系统的后代态研究开辟了路径。", "summary_source": "deepseek", "authors": [{"name": "Yunfeng Jiang"}, {"name": "Jules Lamers"}, {"name": "Yuan Miao"}], "featured_authors": [{"name": "Yunfeng Jiang"}, {"name": "Jules Lamers"}, {"name": "Yuan Miao"}], "author_count": 3}, {"id": "2606.20182", "category": "cond-mat", "title": "Anomalous Transverse Response in Nodal line Semimetal Mn$_{3}$SnC", "abstract": "The interplay of topological surface states and magnetism gives rise to unconventional transport behaviors such as the anomalous Hall effect (AHE) and anomalous Nernst effect (ANE). Antiperovskites such as Mn$3$SnC, which are nodal-line semimetals and exhibit concurrent antiferromagnetic (AFM) and ferromagnetic (FM) ordering, provide a fertile ground for anomalous transport phenomena. Here, we report that the anomalous transport (AHE and ANE) in this compound is predominantly governed by the intrinsic Berry-curvature effect. We establish a unified relationship between the AHE and ANE using Mott's relation. Electron scattering by both AFM and FM magnons is manifested in the anomalous Nernst signal. The ratio of the anomalous Nernst conductivity to the anomalous Hall conductivity, $|\\alpha^A{xy}|/\\sigma^A_{xy}$, constitutes a sizable fraction of $k_B/e$, indicating a strong Berry-curvature contribution to the ANE.", "url": "https://arxiv.org/abs/2606.20182", "type": "理论", "summary": "1. 该工作报道了反钙钛矿节点线半金属Mn₃SnC中反常霍尔与反常能斯特效应的实验观测，并揭示其由内禀贝里曲率效应主导。\n2. 其关键在于利用Mott关系统一描述反常霍尔与反常能斯特电导，并发现两者比值达k_B/e量级，且磁子散射贡献显著。\n3. 这为建立贝里曲率驱动的反常热-电输运统一框架提供了实验基础，并启发在多重磁序拓扑材料中探索类似效应。", "summary_source": "deepseek", "authors": [{"name": "Sunil Gangwar"}, {"name": "C. S. Yadav"}], "featured_authors": [{"name": "Sunil Gangwar"}, {"name": "C. S. Yadav"}], "author_count": 2}, {"id": "2606.20190", "category": "cond-mat", "title": "Independent Control of Transport and Order in a Ratcheted Colloidal Suspension", "abstract": "We study directed transport in a two-dimensional suspension of repulsively interacting colloids driven by a stochastic asymmetric piecewise-linear flashing ratchet using large-scale molecular dynamics simulations. The driving frequency and the ratchet asymmetry offer two independent ways of controlling the particle current, but they affect the suspension differently. At fixed asymmetry, the current shows a resonance with ratcheting frequency that is set by the collective relaxation dynamics of the interacting particles. The resulting increase in transport is accompanied by defect-mediated structural changes, showing density-dependent hexatic and solid-like states, with larger currents generally associated with weaker ordering. By contrast, at fixed frequency, changing the ratchet asymmetry mainly alters the strength of the directed bias and can significantly enhance the current while leaving the hexatic order largely unchanged. Near the equilibrium hexatic-melting regime, this makes it possible to generate substantial directed currents without strongly disrupting sixfold orientational order. These results show that frequency tuning couples transport to structural reorganization, whereas asymmetry tuning primarily controls transport leaving the structure largely unaltered, providing distinct and complementary routes for manipulating transport and order in driven colloidal suspensions.", "url": "https://arxiv.org/abs/2606.20190", "type": "理论+数值", "summary": "1. 该工作通过大规模分子动力学模拟，研究了二维排斥性胶体悬浮液在随机非对称闪烁棘轮驱动下的定向输运行为。\n2. 其卖点在于揭示了驱动频率和棘轮不对称性两种独立控制粒子流的机制：前者通过集体弛豫共振耦合结构重组，后者主要调控偏置强度而基本保持六方取向序。\n3. 这为在驱动胶体系统中实现输运与结构有序的独立操控提供了互补途径，尤其在不破坏六方序条件下产生显著定向电流的设计思路。", "summary_source": "deepseek", "authors": [{"name": "Sudipta Mandal"}, {"name": "Dipanjan Chakraborty"}, {"name": "Debasish Chaudhuri"}], "featured_authors": [{"name": "Sudipta Mandal"}, {"name": "Dipanjan Chakraborty"}, {"name": "Debasish Chaudhuri"}], "author_count": 3}, {"id": "2606.20253", "category": "cond-mat", "title": "On representation of macroscopic crack in periodic fine-scale discrete mechanical models", "abstract": "In multiscale modeling of heterogeneous softening materials, boundary conditions (BC) in the fine-scale model strongly influence the strain localization pattern and the macroscopic response. For rectilinear models (e.g., squares or cubes), standard Periodic BCs produce artificially ductile behavior with excessive energy dissipation when the localization band inclination does not match the periodicity directions. Recently proposed Tessellation and Percolation-path-aligned BCs promise to address this by adapting the periodicity frame to align with the evolving localization bands. Alternatively, spherical/circular models provide an orientation independent response by design. Unfortunately, the standard Periodic BCs do not allow development of proper localization band crossing spherical model's boundaries. A recently proposed modification addresses this by adding a displacement jump to the spherical periodic BCs. This study evaluates the applicability of these novel BCs to a mesoscale discrete particle model of concrete. Two-dimensional square and circular models under uniaxial tension with different loading directions are analyzed, with the selected approaches extended to three-dimensional cube models. Results show that Percolation-path-aligned BCs exhibit major shortcomings: they can lead to multiple localization bands due to uneven straining of the two boundary sections and their weakly constrained section can be prone to spurious strain localization. In contrast, Tessellation BCs consistently yield a well-defined localization band, whose length is determined solely by the model geometry, making it straightforward to account for in post-processing. Periodic boundary conditions augmented with a displacement jump applied to a circular model sometimes incorrect produce crack patterns similar to those under the standard Periodic BCs.", "url": "https://arxiv.org/abs/2606.20253", "type": "理论+数值", "summary": "1. 该工作评估了多种边界条件在周期性细观离散力学模型中对宏观裂纹表征的适用性，聚焦混凝土拉伸破坏模拟。\n2. 其核心卖点在于揭示标准周期边界因裂纹倾角不匹配导致假韧性行为，而镶嵌边界可产生由模型几何唯一确定的定位带，便于后处理修正。\n3. 这为多尺度软化材料模拟中边界条件的选择提供了明确指导，指明渗流路径对齐边界和带跳变周期边界在裂纹形态控制上的潜在缺陷。", "summary_source": "deepseek", "authors": [{"name": "Jan Raisinger"}, {"name": "Jan Eliáš"}], "featured_authors": [{"name": "Jan Raisinger"}, {"name": "Jan Eliáš"}], "author_count": 2}, {"id": "2606.20260", "category": "cond-mat", "title": "Effects of nonlocal interactions on s- and d-wave superconducting correlations in the extended Hubbard model", "abstract": "We investigate the influence of nonlocal interactions on superconducting correlations within the extended Hubbard model. In addition to the on-site Coulomb interaction and nearest-neighbor hopping, we include next-nearest-neighbor hopping together with several physically relevant nonlocal terms, namely nearest-neighbor Coulomb interaction, correlated hopping, exchange interaction, and pair hopping. Using Lanczos exact diagonalization on a $4\\times4$ cluster, supported by projector quantum Monte Carlo simulations for selected parameter regimes, we analyze pairing correlations in both the s- and d-wave channels. We demonstrate that nonlocal interactions exert a highly nontrivial and symmetry-dependent influence on superconducting correlations. While the on-site repulsion in cooperation with next-nearest-neighbor hopping enhances d-wave pairing tendencies, correlated hopping and nearest-neighbor Coulomb interaction strongly promote s-wave correlations, whereas exchange and pair-hopping interactions can efficiently suppress superconductivity beyond relatively small critical strengths. When all nonlocal interactions are considered simultaneously, the resulting phase diagrams reveal a complex interplay and competition between different pairing symmetries. Our results highlight the crucial role of extended interactions in shaping the pairing landscape of strongly correlated systems and demonstrate that a comprehensive treatment beyond the minimal Hubbard model is essential for a realistic description of unconventional superconductivity.", "url": "https://arxiv.org/abs/2606.20260", "type": "理论+数值", "summary": "1. 该工作利用Lanczos精确对角化与投影量子蒙特卡洛模拟，系统研究了扩展Hubbard模型中多种非局域相互作用对s波和d波超导配对关联的影响。\n2. 其核心发现是关联跳变与最近邻库仑排斥分别强烈促进s波配对，而交换与对跳相互作用在超过临界强度后高效压制超导，揭示出非局域项对配对对称性的选择性调控。\n3. 这表明完整计入非局域相互作用对于理解强关联体系中非常规超导的配对机制至关重要，为超越最小Hubbard模型的唯象描述提供了关键参考。", "summary_source": "deepseek", "authors": [{"name": "Pavol Farkasovsky"}], "featured_authors": [{"name": "Pavol Farkasovsky"}], "author_count": 1}, {"id": "2606.20261", "category": "cond-mat", "title": "Activity driven buckling and pattern formation in shells of oriented solids", "abstract": "We investigate shells of active oriented solid, materials in which orientationally ordered active particles are embedded in a deformable elastic surface. Focusing on cylindrical geometries, we show that active stresses drive a new class of buckling instabilities and nonlinear patterns absent in passive shells. Linear stability analysis reveals that the unstable buckling mode is selected by the nematic orientation and activity sign, leading to axial, circumferential, and helical deformations. Remarkably, circumferential modes become unstable at arbitrarily small activity due to the absence of stretching costs. The results of the linear stability analysis are corroborated by full nonlinear simulations, which further uncover steady diamond shaped patterns and persistent dynamical states including oscillations, traveling domain walls, and propagating waves. Our results establish fundamental buckling modes and emergent patterns in shells of active oriented solid materials, with potential relevance to active biological tissues and engineered responsive materials.", "url": "https://arxiv.org/abs/2606.20261", "type": "数值", "summary": "1. 本文研究活性取向固体壳层中由活性应力驱动的屈曲失稳与图案形成机制，聚焦圆柱几何体系。\n2. 线性稳定性分析揭示屈曲模式由向列取向与活性符号协同选择，且周向模在任意弱活性下即失稳，非线性模拟进一步发现稳态菱形图案及振荡行波等动态态。\n3. 该工作为理解活性生物组织与设计可响应工程材料中的弹性失稳及自组织图案提供了基本范式。", "summary_source": "deepseek", "authors": [{"name": "Niels de Graaf Sousa"}, {"name": "Varun Venkatesh"}, {"name": "Amin Doostmohammadi"}], "featured_authors": [{"name": "Niels de Graaf Sousa"}, {"name": "Varun Venkatesh"}, {"name": "Amin Doostmohammadi"}], "author_count": 3}, {"id": "2606.20339", "category": "cond-mat", "title": "Diagnosing the origin of quantum oscillation beating in graphene", "abstract": "Magnetic quantum oscillations are usually periodic in inverse magnetic field, and their amplitude can show beating when two nearby frequencies interfere. In graphene-based hexagonal systems, such beating can arise from strain-induced pseudomagnetic fields, unequal valley populations, valley-dependent energy shifts, spin-orbit coupling-induced band splitting, or Kekulé distortions. Here, we show that the carrier density and magnetic field dependence of the beating nodes can distinguish these mechanisms. Starting from Onsager's quantization relation, we derive scaling relations for the critical carrier density $N_c$ for the beating nodes as a function of critical magnetic field $B_c$. A pseudomagnetic field gives $N_c\\propto B_c^2$, whereas a density-independent valley imbalance gives $N_c\\propto B_c$. A constant Dirac-band energy splitting by Zeeman-like spin-orbit coupling also gives quadratic field scaling, but with a different node sequence: $N_{c,j}\\propto(2j+1)B_{c,j}^2$ for a pseudomagnetic field and $N_{c,j}\\propto(2j+1)^2B_{c,j}^2$ for energy splitting, where $j$ labels the beating node indices. These results provide quantitative constraints on different microscopic origins of valley- and spin-dependent band splittings in graphene-based systems.", "url": "https://arxiv.org/abs/2606.20339", "type": "理论", "summary": "1. 该工作基于Onsager量子化关系，推导了石墨烯量子振荡拍频节点的临界载流子密度N_c与临界磁场B_c的标度关系，从而区分应变赝磁场、谷不平衡与自旋轨道耦合等拍频起源。\n2. 其核心卖点在于揭示不同机制特有的标度幂律及节点序列：赝磁场给出N_c∝B_c^2且N_{c,j}∝(2j+1)B_{c,j}^2，Zeeman型自旋轨道耦合产生N_{c,j}∝(2j+1)^2B_{c,j}^2，谷不平衡则表现为N_c∝B_c。\n3. 这为实验定量鉴别石墨烯基系统中谷极化、应变与自旋轨道耦合等谷-自旋依赖能带分裂的微观来源提供了直接可检验的判据。", "summary_source": "deepseek", "authors": [{"name": "Akash Adhikary"}, {"name": "Sunit Das"}, {"name": "Divya Sahani"}, {"name": "Aveek Bid"}, {"name": "Amit Agarwal"}], "featured_authors": [{"name": "Akash Adhikary"}, {"name": "Sunit Das"}, {"name": "Divya Sahani"}, {"name": "Aveek Bid"}, {"name": "Amit Agarwal"}], "author_count": 5}, {"id": "2606.20377", "category": "cond-mat", "title": "Charge imprinting biases topology of correlated insulator in hBN-aligned rhombohedral multilayer graphene", "abstract": "Rhombohedral multilayer graphene aligned with hexagonal boron nitride (RMG-hBN) hosts correlated Chern phases, but the microscopic role of hBN stacking remains unclear, especially when the active carriers are displaced away from the moiré interface. Using Hartree-Fock calculations over layer numbers, twist angles, displacement fields, fillings, and hBN alignments, we show that correlated insulators are most robust at small twist angles and intermediate layer number ($N\\simeq 6$), where bandwidth suppression is balanced by layer delocalization of the wavefunctions of the active carriers. Under moiré-distant conditions at filling $\\nu=1$, the topology of the insulating state is strongly biased by charge imprinting: the hBN alignment shapes the occupied valence-band charge texture near the interface via moiré potential, which acts through long-range Coulomb interactions as a remote electrostatic template for doped conduction electrons. Depending on the alignment, this template favors either triangular charge localization associated with trivial insulators or honeycomb-like charge networks compatible with Chern insulators. Our results identify valence-band charge textures as a microscopic route by which a remote moiré interface controls correlated topology in multilayer graphene.", "url": "https://arxiv.org/abs/2606.20377", "type": "数值", "summary": "1. 该工作通过Hartree-Fock计算系统研究了hBN对齐菱方多层石墨烯中相关绝缘态的拓扑性质受层数、转角、位移场及hBN堆叠的影响。\n2. 其核心卖点在于揭示了电荷印模机制：远距离moiré界面通过价带电荷纹理作为静电模板，偏置导带载流子形成三角或蜂窝状局域化，从而决定绝缘态拓扑平庸或Chern相。\n3. 这为理解多层石墨烯中远程moiré势调控相关拓扑相提供了微观图像，并启示了通过设计电荷纹理实现拓扑量子态的新途径。", "summary_source": "deepseek", "authors": [{"name": "Lei Qiao"}, {"name": "Xin Lu"}, {"name": "Fu-Chun Zhang"}, {"name": "Jianpeng Liu"}], "featured_authors": [{"name": "Lei Qiao"}, {"name": "Xin Lu"}, {"name": "Fu-Chun Zhang"}, {"name": "Jianpeng Liu"}], "author_count": 4}, {"id": "2606.20445", "category": "cond-mat", "title": "Space-time duality approach to (inhomogeneous) integrable quenches", "abstract": "Characterising the universal aspects of non-equilibrium quantum many-body dynamics is one of the key goals of this century's physics research. Progress, however, is hindered by the lack of general theoretical frameworks for studying interacting quantum matter far from equilibrium. A recent breakthrough has been the realization that several key non-equilibrium quantities, such as the rate of growth of entanglement or the fluctuations of conserved charges within finite subsystems, can be related to equilibrium properties through a space-time duality that effectively exchanges the roles of space and time. This observation effectively enables the study of non-equilibrium phenomena using tools and concepts borrowed from equilibrium statistical mechanics and thermodynamics. A first proof of principle of this framework, dubbed space-time duality approach (SDA), was provided by interacting integrable systems, where thermodynamic properties can often be characterized exactly, while dynamical quantities typically remain beyond analytical reach. Subsequent developments, however, revealed that the SDA suffered from an intrinsic ambiguity, restricting its applicability to homogeneous quenches and to charge fluctuations arising from symmetric initial states. Here we resolve this ambiguity from first principles and derive closed-form predictions for entanglement growth and charge fluctuations after general quantum quenches. We benchmark our results against the exact analytical solution of the Rule 54 quantum cellular automaton and extensive TEBD simulations of the XXZ chain. Moreover we show that, when specialised to the entanglement entropy, our framework naturally reproduces the predictions of the quasiparticle picture.", "url": "https://arxiv.org/abs/2606.20445", "type": "理论+数值", "summary": "1. 该工作从第一原理解决了时空对偶方法在非均匀可积淬火中的固有歧义，将其推广至一般量子淬火。\n2. 其关键贡献在于推导出纠缠增长与电荷涨落的闭合形式解析解，并通过Rule 54量子元胞自动机精确解和XXZ链TEBD模拟验证。\n3. 这为研究非平衡量子多体动力学提供了统一框架，并自然重现准粒子图像的预言。", "summary_source": "deepseek", "authors": [{"name": "Riccardo Travaglino"}, {"name": "Pasquale Calabrese"}, {"name": "Katja Klobas"}, {"name": "Bruno Bertini"}], "featured_authors": [{"name": "Riccardo Travaglino"}, {"name": "Pasquale Calabrese"}, {"name": "Katja Klobas"}, {"name": "Bruno Bertini"}], "author_count": 4}, {"id": "2606.20460", "category": "cond-mat", "title": "Scaling, fractal dynamics, and critical exponents in the equilibrium phase transition", "abstract": "Statistical methods are essential for understanding thermodynamic systems with many degrees of freedom. For systems in equilibrium, a very useful method is that of correlation functions, which establish a correlation between a field phi(x), which depends on the spatial position x, and the same field evaluated at another position, phi(x0). Fisher [Journal of Mathematical Physics 5, 944322 (1964)] introduced the autocorrelation function for fluctuations of the order parameter, which has been an important mathematical tool for understanding second-order phase transitions in equilibrium. However, his analysis is restricted to a Euclidean space of dimension d, and an exponent eta is introduced to correct the spatial behavior of the correlation function at T = Tc. In a recent work, Lima et al. [Phys. Rev. E 110, L062107 (2024)] demonstrated that a modern fractional differential analysis is necessary for a complete description of the correlation function at Tc. In this study, we highlight the deep connection among scaling behavior, critical exponents, and fractal geometry. Our results provide a unified geometric interpretation of critical exponents and fractal dimensions, broadly applicable to thermodynamic phase transitions. However, the approach does not apply to topological phase transitions, which lack local order parameters and the associated scale-invariant fractal geometry. We verify its predictions for several cornerstone thermodynamic models: the Ising, Potts, XY, and Heisenberg systems.", "url": "https://arxiv.org/abs/2606.20460", "type": "理论+数值", "summary": "1. 该工作建立了平衡相变中标度行为、临界指数与分形几何之间的深层联系，并基于分数阶微分分析给出了临界指数与分形维数的统一几何解释。\n2. 其核心卖点在于揭示临界点关联函数的分形动力学特征，通过Ising、Potts、XY和Heisenberg等角点热力学模型验证了该几何框架的普适性。\n3. 这为理解平衡热力学相变中标度现象提供了新的几何视角，但明确指出该方法不适用于缺乏局域序参量和标度不变分形结构的拓扑相变。", "summary_source": "deepseek", "authors": [{"name": "Adauto F. Souza"}, {"name": "Henrique A Lima"}, {"name": "Anderson L. R. Barbosa"}, {"name": "Fernando A. Oliveira"}], "featured_authors": [{"name": "Adauto F. Souza"}, {"name": "Henrique A Lima"}, {"name": "Anderson L. R. Barbosa"}, {"name": "Fernando A. Oliveira"}], "author_count": 4}, {"id": "2606.20462", "category": "cond-mat", "title": "Polymer-polymer interdiffusion: effects of entanglements and a polymeric source", "abstract": "Many industrial applications and biological scenarios involve the interdiffusion of two polymeric species. Motivated by biological subcellular source-driven processes, we study polymer-polymer interdiffusion problems in the absence or the presence of a polymeric source, for both unentangled and entangled scenarios. Utilizing a two-fluid formalism, we arrive at scaling relations, self-similar reductions, and analytical solutions, which are confirmed with one- and two-dimensional numerical simulations. The introduction of a source term breaks the self-similar structure, modifying the boundary conditions and the domain of integration. Nevertheless, we show that the front characteristics of the diffusing droplet exhibit similar spatial structures as in the absence of a source. Our results allow deeper understanding of polymer-polymer interdiffusion and nonlinear transport, especially in the presence of a source.", "url": "https://arxiv.org/abs/2606.20462", "type": "理论+数值", "summary": "1. 该工作采用双流体形式研究了缠结与非缠结聚合物互扩散行为，并引入了聚合物源项以模拟亚细胞源驱动过程。\n2. 其核心在于通过标度关系和自相似约化揭示了源项虽破坏自相似性，但扩散前沿空间结构保持不变的物理机制。\n3. 这为生物源驱动过程及非线性输运中的聚合物互扩散提供了可解析描述的理论框架与实验启示。", "summary_source": "deepseek", "authors": [{"name": "Avraham Moriel"}, {"name": "Howard A. Stone"}], "featured_authors": [{"name": "Avraham Moriel"}, {"name": "Howard A. Stone"}], "author_count": 2}, {"id": "2606.20466", "category": "cond-mat", "title": "Correlated Mott semi-metal in the topological heavy fermion model", "abstract": "The topological heavy-fermion model provides a minimal framework for describing the coexistence of localized moments and itinerant Dirac electrons in magic-angle twisted bilayer graphene (MATBG). Several analytical and numerical methods have been applied to this model; however, whether they provide a realistic description of MATBG remains incompletely understood. In this work, we develop an Hubbard operator approach that incorporates non-local correlations beyond the single-site limit. We benchmark the approximate calculations against numerically exact determinant quantum Monte Carlo simulations of a lattice-regularized model. We show that commonly used local approximations, such as Hubbard-I, fail to capture the coupling between localized and itinerant degrees of freedom, leading to incorrect spectral properties in the local-moment regime. In contrast, the Hubbard operator method provides a controlled description of both correlation functions and spectral features over a regime of parameters, in good agreement with exact numerical methods.", "url": "https://arxiv.org/abs/2606.20466", "type": "理论+数值", "summary": "1. 该工作发展了一种 Hubbard 算子方法，在拓扑重费米子模型中研究关联 Mott 半金属相，并通过量子蒙特卡洛模拟验证其精确性。\n2. 该方法超越单站点近似，引入非局域关联，正确捕获局域与巡游自由度耦合，修正了 Hubbard-I 近似在谱性质上的错误。\n3. 这为魔角扭曲双层石墨烯中强关联电子态的可控描述提供了理论框架，并启发其他关联拓扑模型需超越局域近似。", "summary_source": "deepseek", "authors": [{"name": "Emile Pangburn"}, {"name": "Igor de Melo Froldi"}, {"name": "Anurag Banerjee"}], "featured_authors": [{"name": "Emile Pangburn"}, {"name": "Igor de Melo Froldi"}, {"name": "Anurag Banerjee"}], "author_count": 3}, {"id": "2606.20522", "category": "cond-mat", "title": "Transfer-matrix functions for algebraically decaying interactions in variational infinite matrix product states", "abstract": "Variational infinite matrix product state (iMPS) calculations usually make Hamiltonians with algebraically decaying interactions compatible with standard MPO algorithms by first replacing the target Hamiltonian with a finite-pole sum-of-exponentials surrogate, thereby introducing a Hamiltonian-representation residual. We formulate the fixed-$D$ variational energy without introducing such a surrogate. For a fixed finite-$D$ MPS, the algebraic tail can be summed directly through the connected transfer matrix: the tail $e^{\\mathrm{i} Qr}/r^\\alpha$ is represented by the matrix function $F_{\\alpha,Q}(\\widetilde{T}_A)$, with $F_{\\alpha,Q}(z)=\\operatorname{Li}_\\alpha(e^{\\mathrm{i} Q}\\,z)/z$. We evaluate the resulting matrix-function action using a Krylov method and obtain stable gradients by combining a Fréchet adjoint with implicit fixed-point differentiation. Benchmarks on long-range free fermions and the inverse-square Heisenberg family, including the Haldane--Shastry point, validate the transfer-matrix-function formulation. A long-range Ising-chain calculation illustrates a practical consequence of avoiding a finite-pole Hamiltonian representation. At a fixed, independently known critical field, finite-pole surrogate Hamiltonians can bias a critical diagnostic away from criticality, whereas the matrix-function calculation retains the expected critical signatures of the target algebraic Hamiltonian.", "url": "https://arxiv.org/abs/2606.20522", "type": "理论+数值", "summary": "1. 该工作提出在不引入有限极点和指数和替代表达式的前提下，直接通过连通转移矩阵函数处理变分无限矩阵乘积态中代数衰减相互作用的哈密顿量。\n2. 其技术核心在于将长程尾贡献表示为矩阵函数F_{α,Q}(T̃_A)作用，并利用Krylov方法结合Fréchet伴随与隐式不动点微分，实现稳定梯度计算。\n3. 这避免了替代表达式对临界诊断的偏移，使长程伊森链在已知临界场处保留目标代数哈密顿量的关键临界特征，启示了精确处理长程相互作用的iMPS方案。", "summary_source": "deepseek", "authors": [{"name": "Qi Yang"}], "featured_authors": [{"name": "Qi Yang"}], "author_count": 1}, {"id": "2606.20552", "category": "cond-mat", "title": "On the Renormalization Group Flow of Active Flocks", "abstract": "In this paper, we study the statistical field-theoretic renormalization of active flocks via the MSRDJ action formulation for stochastic systems, focusing on the Toner-Tu theory of `Malthusian flocks', or polar-ordered, momentum non-conserving active fluids where relaxation times for density fluctuations are so short that they can be eliminated as a hydrodynamic variable. Working in the limit of isotropic diffusion in two spatial dimensions, we compute the renormalization of the couplings and their anomalous dimensions to all orders, facilitated by a non-linear realization of a generalized \\textit{Galileon} symmetry and its associated Ward identities. We find a range of behavior depending on the parameters of the theory. If $\\kappa$ is the diffusion coefficient and $\\Delta$ is the variance of the noise, we find a line of fixed points and a marginal vertex instability at $\\Delta/\\kappa = 2\\pi$. This instability separates Gaussian, and strongly interacting, symmetry-protected gapless phases, realizing non-equilibrium critical behavior beyond conventional Wilson--Fisher criticality. The existence of gapless excitations in both phases can be traced to the soft (Adler zero) theorems associated with the generalized Galileon symmetry, and implies the persistence of long range order when $\\Delta/\\kappa$ is below the critical value. We revisit and contextualize various claims and counter-claims in the literature in light of our findings, and discuss extensions of our analysis to anisotropic diffusion, and towards flocks where density fluctuations are reintroduced.", "url": "https://arxiv.org/abs/2606.20552", "type": "理论", "summary": "1. 该工作通过MSRDJ作用量形式研究了Malthusian flocks的重整化群流，聚焦于二维各向同性扩散极限下的Toner-Tu理论。\n2. 其技术核心在于利用广义Galileon对称性的非线性实现及其Ward恒等式，对所有阶计算了耦合重整化和反常维度。\n3. 发现了以Δ/κ=2π为界的固定点线和边缘顶点不稳定性，分离了高斯相和强相互作用相，揭示了超越Wilson-Fisher临界性的非平衡临界行为及长程序的持续性。", "summary_source": "deepseek", "authors": [{"name": "Kevin T. Grosvenor"}, {"name": "Subodh P. Patil"}], "featured_authors": [{"name": "Kevin T. Grosvenor"}, {"name": "Subodh P. Patil"}], "author_count": 2}, {"id": "2606.19420", "category": "hep-th", "title": "Bootstrapping Pion Form Factors at Large $N$", "abstract": "We initiate a bootstrap study of pion form factors in large $N$ QCD. We consider the mixed system of the vector-current two-point function, the pion vector form factor, and the pion scattering amplitude in the chiral limit. At large $N$ these observables are meromorphic, with spectral data constrained by unitarity, crossing symmetry, and Regge boundedness. We obtain bounds of two kinds. The first are rigorous and universal: from analyticity, unitarity and the asymptotic Brodsky-Farrar scaling, we constrain low-energy form-factor coefficients. The second are more phenomenological, of the Shifman-Vainshtein-Zakharov type: feeding in the perturbative ultraviolet behavior at a finite scale lets us bound the pion decay constant, convert a large $N$ lattice measurement into a lower bound on the scale at which asymptotic freedom sets in, and constrain the pion charge radius. Combining these inputs, the space of allowed chiral Lagrangians shrinks toward the region where large $N$ QCD is expected to sit. Our results illustrate how local gauge-invariant probes provide a canonical bridge between the hadronic bootstrap and the microscopic QCD Lagrangian.", "url": "https://arxiv.org/abs/2606.19420", "type": "理论", "summary": "1. 该工作启动了大N QCD中介子形状因子的自举研究，分析矢量流两点函数、介子矢量形状因子和散射振幅的混合系统。\n2. 其技术核心是利用解析性、幺正性和Regge有界性，获得低能系数与唯象参数（如衰变常数、电荷半径）的严格及唯象两类约束。\n3. 此法展示了定域规范不变探针如何桥接强子自举与微观QCD拉格朗日量，并为手征拉格朗日量空间限缩提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Jan Albert"}, {"name": "Dilara Kosva"}, {"name": "Leonardo Rastelli"}], "featured_authors": [{"name": "Jan Albert"}, {"name": "Dilara Kosva"}, {"name": "Leonardo Rastelli"}], "author_count": 3}, {"id": "2606.19423", "category": "hep-th", "title": "Calabi-Yau Orientifold Hypersurfaces and their F-theory Uplifts", "abstract": "We present an algorithm that constructs Calabi-Yau threefold orientifolds and their $F$-theory uplifts to elliptically-fibered Calabi-Yau fourfolds, embedded in toric varieties at codimension one and two respectively. The resulting Calabi-Yau fourfolds arise from triangulations of $6d$ reflexive polytopes -- which our method constructs from orientifold data -- and are smooth away from isolated terminal singularities. For many of our fourfolds, the construction of the mirror manifold is immediate, enabling the computation of fourfold periods, and thus the seven-brane superpotential. We present multiple examples that demonstrate these capabilities. Our algorithms work with $\\mathtt{CYTools}$ and are available through a GitHub repository.", "url": "https://arxiv.org/abs/2606.19423", "type": "理论", "summary": "1. 该工作提出了构建嵌入环面簇的Calabi-Yau三折叠定向空间及其F理论提升至椭圆纤维化四折叠的算法。\n2. 其卖点在于从定向空间数据构造六维自反多面体三角剖分，所得四折叠除孤立终端奇点外光滑，且镜流形可立即构造以计算周期与七膜超势。\n3. 这为通过显式代数几何计算F理论超势及探索紧致化唯象学提供了系统化工具与开源实现。", "summary_source": "deepseek", "authors": [{"name": "Bjoern Hassfeld"}, {"name": "Jakob Moritz"}], "featured_authors": [{"name": "Bjoern Hassfeld"}, {"name": "Jakob Moritz"}], "author_count": 2}, {"id": "2606.19440", "category": "hep-th", "title": "Moduli Stabilisation for ADD and the Dark Dimension Scenario", "abstract": "We provide a moduli stabilisation mechanism for realising anisotropic string compactifications with one or two large extra dimensions, corresponding to the ADD and Dark Dimension scenarios. This is achieved within the type IIB Large Volume Scenario, where an exponentially large Calabi-Yau volume in string units can naturally generate a parametrically low Kaluza-Klein scale. Anisotropy is realised by considering a Calabi-Yau threefold which is a K3 fibration over a $\\mathbb{P}^1$ base. The volume of the 4D K3 fibre is stabilised at relatively small values by perturbative corrections to the effective action, in particular string loops and higher-derivative effects, leaving an exponentially large volume of the 2D $\\mathbb{P}^1$ base. We argue that complex structure moduli stabilisation can dynamically deform the $\\mathbb{P}^1$ base, corresponding to a Tyurin degeneration limit where the internal geometry effectively develops a single large 1D cycle. Within a unified description, the ADD case is instead recovered as a symmetric alternative limit. The potential can feature either a dS vacuum or a quintessence runaway, although in both cases some degree of tuning is required to match the observed cosmological constant scale. We also present an explicit Calabi-Yau orientifold example with consistent brane setup, tadpole cancellation and moduli stabilisation. We analyse the resulting moduli spectrum and associated phenomenological constraints, including supersymmetry breaking, cosmological moduli overproduction and fifth force bounds.", "url": "https://arxiv.org/abs/2606.19440", "type": "理论", "summary": "1. 该工作提出了一个模稳定化机制，在IIB大型体积情景中通过指数大Calabi-Yau体积自然产生参量低KK标度，实现具有一个或两个大额外维度的各向异性弦紧化，对应ADD与暗维度情景。\n2. 主要卖点在于利用K3纤维化结构，通过弦圈和高阶导数等微扰修正将4D K3纤维体积稳定在较小值，同时使2D P^1基体积指数级大，并借助复杂结构模稳定化动态变形基空间，在Tyurin退化极限下获得单一大循环。\n3. 这为统一描述ADD和暗维度情景提供了具体弦论实现，并给出了显式Calabi-Yau定向折叠例子及brane设置，为后续研究模谱、超对称破缺、宇宙学模场产生和第五力约束提供了系统框架。", "summary_source": "deepseek", "authors": [{"name": "Andreas P. Braun"}, {"name": "Michele Cicoli"}, {"name": "Riccardo Milioli"}, {"name": "Roberto Valandro"}], "featured_authors": [{"name": "Andreas P. Braun"}, {"name": "Michele Cicoli"}, {"name": "Riccardo Milioli"}, {"name": "Roberto Valandro"}], "author_count": 4}, {"id": "2606.19467", "category": "hep-th", "title": "Membrane instantons and non-perturbative effects in $\\mathrm{AdS}_{4}/\\mathrm{CFT}_{3}$", "abstract": "We study Euclidean M2-brane instantons in Freund-Rubin backgrounds $\\mathrm{AdS}_{4}\\times \\mathrm{Y}_7$. For a seven-dimensional weak $G_{2}$ manifold $\\mathrm{Y}_7$, we show that the BPS condition for an M2-brane wrapping a three-cycle $\\Sigma\\subset \\mathrm{Y}_7$ is equivalent to the associativity condition with respect to the nearly parallel $G_{2}$-structure. When $\\mathrm{Y}_7$ is Sasaki-Einstein, we identify a special class of BPS M2-branes that preserve both real internal Killing spinors and correspond to invariant three-dimensional submanifolds inheriting a Sasakian structure. We analyse the quadratic fluctuations around BPS M2-brane instantons in these backgrounds. For the special class of M2-branes in Sasaki-Einstein manifolds, the fluctuation problem reduces to transversely elliptic complexes, and the one-loop partition function can be expressed in terms of the corresponding equivariant indices. We then apply the index formula for the one-loop partition function to invariant M2-branes in $S^{7}/\\mathbb{Z}_{k}$, recovering the known result for the $S^3/\\mathbb{Z}_k$ instantons and discussing more general invariant BPS cycles. As a further application, we consider M2-brane instantons with $S^3$-quotient worldvolumes in the $(p,q)$-model geometry.", "url": "https://arxiv.org/abs/2606.19467", "type": "理论", "summary": "1. 本文系统研究了AdS4×Y7背景中欧几里得M2-膜瞬子的BPS条件、二次涨落及单圈配分函数。\n2. 技术关键在于将弱G2流形上的BPS条件等价于结合性条件，并在Sasaki–Einstein情形将涨落简化为横椭圆复形，通过等变指数计算配分函数。\n3. 所得指数公式统一解释了S7/Zk上S3/Zk瞬子的非微扰效应，并为推广至(p,q)模型等更一般几何提供了框架。", "summary_source": "deepseek", "authors": [{"name": "Stefan A. Kurlyand"}], "featured_authors": [{"name": "Stefan A. Kurlyand"}], "author_count": 1}, {"id": "2606.19479", "category": "hep-th", "title": "Generating Function of single-centered Black Hole Index in CHL Models", "abstract": "We present the construction of the generating function of single-centered black hole index in general $\\mathbb{Z}_N$ CHL models. This is done by subtracting from the index of quarter BPS dyons, described by a meromorphic Siegel modular form, the generating function for the index of two-centered black holes. We use black hole bound state metamorphosis in CHL models for the construction of the generating function of two-centered black hole index. We prove the convergence of the generating function for the cases $N=2,3$.", "url": "https://arxiv.org/abs/2606.19479", "type": "理论", "summary": "1. 该工作构造了 \\(\\mathbb{Z}_N\\) CHL 模型中单中心黑洞指数的生成函数，用以刻画其微观态计数。\n2. 其技术核心在于从亚纯 Siegel 模形式描述的 dyons 指数中减去两中心黑洞指数生成函数，并利用黑洞束缚态蜕变实现构造。\n3. 这为后续研究 CHL 模型中 BPS 态与黑孔熵的精确对应提供了生成函数框架，且已证明 \\(N=2,3\\) 情形下的收敛性。", "summary_source": "deepseek", "authors": [{"name": "Ranveer Kumar Singh"}], "featured_authors": [{"name": "Ranveer Kumar Singh"}], "author_count": 1}, {"id": "2606.19678", "category": "hep-th", "title": "Operational Tube-Sector Theory of Quantum State Distinguishability Under Generalized Symmetries", "abstract": "A variational principle for quantum-state distinguishability is established in many-body systems with generalized symmetries, including noninvertible cases described by fusion categories. Standard fidelity and symmetry-resolved diagnostics emerge as coarse-grained limits of a more refined operational structure. When symmetry actions terminate at entanglement cuts, distinguishability is governed by boundary tube algebras within a symmetry-constrained measurement resource theory. The physically admissible instruments are characterized by complete positivity, entanglement-cut locality, boundary-module covariance, and sequential stability. The resulting optimal measurement structure is uniquely fixed by the center of the boundary tube algebra, $\\mathcal{A}_{\\mathrm{phys}} = Z\\!\\left(\\mathrm{Tube}_{\\mathcal{C}}(\\mathcal{M}_A)\\right)$, whose primitive idempotents define tube-sector probabilities that refine fidelity-based and symmetry-resolved descriptions. The associated tube positive-operator-valued measures (POVM) are extremal and yield optimal one-shot hypothesis-testing distinguishability under symmetry constraints. The construction is universal across fusion categories and independent of microscopic realization.", "url": "https://arxiv.org/abs/2606.19678", "type": "理论", "summary": "1. 该工作针对具有广义对称性（包括融合范畴描述的非可逆情形）的多体量子系统，建立了量子态可区分性的变分原理。\n2. 其核心在于揭示对称操作终止于纠缠切割时，可区分性由边界管代数主导，最优测量结构由该代数的中心唯一确定。\n3. 这为超越传统保真度和对称分辨方案的量子态区分提供了普适的资源理论框架，且适用于任意融合范畴与微观实现。", "summary_source": "deepseek", "authors": [{"name": "Song He"}], "featured_authors": [{"name": "Song He"}], "author_count": 1}, {"id": "2606.19732", "category": "hep-th", "title": "Quantum models with the Yang-Lee phase transition", "abstract": "In this article, we present four different $1+1$D quantum models that realize the Yang-Lee (YL) phase transition under a deformation that preserves $PT$ symmetry. These are the antiferromagnetic Ising spin chain in transverse and longitudinal magnetic fields, the massive Schwinger model, the Blume-Capel model, and the three-state quantum clock model. Using the state-operator correspondence, we identify the YL critical point, compute the scaling dimensions of the lowest operators in each model, and find perfect agreement with the exact results for the YL criticality in two dimensions. Using bosonization for the Schwinger model and the Polyakov-Hubbard transformation for the other models, we show that in all of these quantum models the YL critical point is described, as expected, by a massless bosonic field with an $i \\phi^3$ interaction. In the quantum clock model, this critical field interacts with a massive bosonic field, and we identify the massless and massive states in the Hamiltonian spectrum. In addition, we numerically compute the two-point function of $\\phi$ at the Yang-Lee critical point and show that it grows with distance, in agreement with theoretical expectations.", "url": "https://arxiv.org/abs/2606.19732", "type": "理论", "summary": "1. 该工作提出了四种一维量子模型，均能在PT对称形变下实现杨-李相变。\n2. 通过态-算符对应与玻色化分析，确证临界点由带iφ^3相互作用项的无质量玻色场精确描述。\n3. 这为从统一场论视角理解非厄米临界现象及PT对称动力学提供了具体范例。", "summary_source": "deepseek", "authors": [{"name": "Erick Arguello Cruz"}, {"name": "Grigory Tarnopolsky"}], "featured_authors": [{"name": "Erick Arguello Cruz"}, {"name": "Grigory Tarnopolsky"}], "author_count": 2}, {"id": "2606.19877", "category": "hep-th", "title": "Factorized Quantum Curves and Voronoi Polytopes in 3D Duality Cascades with FI Parameters", "abstract": "In the study of duality cascades in three-dimensional gauge theories without FI parameters, an important role is played by a fundamental domain whose vertices correspond to brane configurations with vanishing relative ranks. Through the Fermi gas formalism, such brane configurations are known to be represented by factorized quantum curves. In this paper, we show that this factorized description extends naturally to quantum curves associated with del Pezzo geometries possessing exceptional Weyl-group symmetries in the presence of FI parameters. We find that the vertices of the corresponding fundamental domains, identified with Voronoi polytopes of exceptional root lattices, are realized as factorized quantum curves built from canonical operators interpreted as 5-branes dressed with FI parameters. This provides a physical realization of the vertices of the Voronoi polytopes as ``extremal'' brane configurations.", "url": "https://arxiv.org/abs/2606.19877", "type": "理论", "summary": "1. 该工作将三维对偶级联中因子化量子曲线的描述推广至包含FI参数的del Pezzo几何，并保留了例外Weyl群对称性。\n2. 其核心在于识别出例外根格的Voronoi多胞体顶点可由带有FI参数的5-膜对应的规范算子构建，从而物理实现为极值膜构型。\n3. 这为理解带FI参数的对偶级联中基本域结构与膜配置的几何对应提供了新视角，并可能推广至其他根格与量子曲线系统。", "s
