超对称性和超对称指标热力学势所要求的，为指标与引力路径积分精确对应提供了基础。", "summary_source": "deepseek", "authors": [{"name": "Finn Larsen"}, {"name": "Kartik Sharma"}], "featured_authors": [{"name": "Finn Larsen"}, {"name": "Kartik Sharma"}], "author_count": 2}, {"id": "2605.28748", "category": "hep-th", "title": "Filtering out Erratic Observables: Wormholes from Gauging Nonlocal Symmetries", "abstract": "The wormhole contribution to the gravitational path integral may be interpreted as smooth remnant of correlations among the erratic large-$N$ behaviors of dual CFTs. In this work, we investigate this idea in (2+1)-dimensional gravity. We show that one-sided boundary gravitons are intrinsically incomplete in the sense that the associated observable algebra has a nontrivial center regardless of choices of boundary conditions. Based on asymptotic symmetries, we bootstrap a general Poisson bracket to construct completions of the boundary gravitons. In the simplest completion, the commutant of the boundary graviton observable algebra is given by an observable algebra of monodromy data which we interpret as an effective description of one-sided black holes. We show that, to describe Lorentzian multi-boundary wormholes, only the monodromy data with a positivity restriction is needed. The positivity restriction results in emergent erratic large-$N$ behaviors for some observables. We filter out the erratic observables by restricting to a subspace on which they act trivially. The monodromy observables generate nonlocal symmetries lack of corresponding local currents. We show that gauging the nonlocal symmetries is equivalent to filtering out the erratic observables. For one CFT, gauging the nonlocal symmetries at the quantum level removes all black hole states. Filtering the partition function of CFTs leads to an apparent ensemble averaging. For two CFTs, a Hilbert subspace describing wormholes survives after gauging global part of the nonlocal symmetries. The filtered partition function of the two CFTs is an ensemble average over quantum gates entangling the monodromy degrees of freedom the two CFTs. The correlation between the erratic observables of the two CFTs is preserved, which contributes to the filtered partition function as a wormhole term.", "url": "https://arxiv.org/abs/2605.28748", "type": "理论", "summary": "1. 该工作通过规范非局域对称性过滤不可控可观测量，在(2+1)维引力中从双CFT的过滤配分函数重建多边界洛伦兹虫洞。\n2. 其核心在于基于渐近对称性自举泊松括号完成边界引力子，发现单边黑洞由monodromy可观测量代数描述，且规范非局域对称性等价于消除不可控可观测量。\n3. 这揭示虫洞项源于过滤后两CFT间不可控可观测量的关联，为全息对偶中系综平均与虫洞贡献的起源提供明确机制。", "summary_source": "deepseek", "authors": [{"name": "Qi-Feng Wu"}], "featured_authors": [{"name": "Qi-Feng Wu"}], "author_count": 1}, {"id": "2605.28752", "category": "hep-th", "title": "Inflation with vector fields revisited: non-Gaussianities", "abstract": "We revisit the resulting bispectrum of inflation with kinetic-coupled vector fields by organizing the dynamics in terms of $h$, which measures the vector kinetic contribution relative to that of the scalar field. We evaluate the bispectrum in the strong-vector regime and derive a low-energy effective field theory (EFT) for the large-$h$ regime. For $h\\gg1$, the entropic perturbation becomes heavy and can be integrated out; the remaining curvature mode has an imaginary sound speed and undergoes transient growth before horizon crossing. In contrast to $h\\ll1$ regime, where transfer from the vector sector persists outside the horizon and produces a local-type contribution enhanced as $h^2N_K^3$, we find that in addition to the known flattened-enhanced signals scaling as $h^3$, a flattened-enhanced signal scaling as $h^2$ and a pronounced local projection scaling as $h$. Their competition yields a local-dominated signal for intermediate $h$ and a flattened-dominated signal at larger $h$. The bispectrum therefore distinguishes vector-supported inflationary dynamics even for an exactly isotropic background.", "url": "https://arxiv.org/abs/2605.28752", "type": "理论", "summary": "1. 该工作通过引入参数h（矢量与标量动能比）重新分析了运动耦合矢量场暴胀中三点相关函数的结构。\n2. 其核心卖点是在h≫1区域推导出低能有效场理论，发现曲率模具有虚声速且经历视界穿越前瞬态增长，并揭示了h²与h³标度下的扁平增强信号及h标度的局域投影间的竞争。\n3. 这为即使在完全各向同性背景中，通过双谱特征区分矢量支持的暴胀动力学提供了可检验的观测判据。", "summary_source": "deepseek", "authors": [{"name": "Chong-Bin Chen"}], "featured_authors": [{"name": "Chong-Bin Chen"}], "author_count": 1}, {"id": "2605.28753", "category": "hep-th", "title": "GR from RG, $2d$ Example: JT-Gravity Induced from Renormalization Group Flow", "abstract": "We demonstrate how the two-dimensional gravity emerges within ``GR from RG'' program initiated in \\cite{Adami:2025pqr, Sheikh-Jabbari:2026uol}. To achieve this, we consider a generic 2d CFT with a 3d holographic description, which we assume to be well-described by pure Einstein-AdS$_3$ gravity in the bulk. We study the holographic RG flow for the 2d CFT action and show that the renormalization group (RG) corrected action at an arbitrary energy scale contains a 2d scalar-tensor gravity theory. In the simplest case, the flow induces Jackiw-Teitelboim (JT) gravity, where the bulk radial lapse function seeds the dynamical dilaton field of the JT gravity. We show that the standard T$\\bar{\\text{T}}$ deformation of the 2d CFT is recovered as a special case in the Fefferman-Graham limit where the lapse is fixed. We further establish the robustness of the RG induced gravity picture by verifying its consistency under holographic renormalization and by generalizing the result to a one-parameter family of boundary conditions. Our results provide a first-principles derivation of the JT gravity at a finite cutoff as an intrinsic manifestation of the holographic RG flow in a non-Fefferman-Graham gauge", "url": "https://arxiv.org/abs/2605.28753", "type": "理论", "summary": "1. 该工作展示了二维Jackiw-Teitelboim引力如何从全息重整化群流中自然诱导产生。\n2. 其核心在于通过非Fefferman-Graham规范下的径向lapse函数充当动力学膨胀子，并验证了诱导图像在全息重整化下的一致性且可推广到单参数边界条件族。\n3. 这为有限截断处JT引力的第一性原理推导提供了清晰范例，并揭示了T\\bar{T}形变作为RG流在特定规范下的特例。", "summary_source": "deepseek", "authors": [{"name": "M.M. Sheikh-Jabbari"}, {"name": "V. Taghiloo"}], "featured_authors": [{"name": "M.M. Sheikh-Jabbari"}, {"name": "V. Taghiloo"}], "author_count": 2}, {"id": "2605.27529", "category": "math-ph", "title": "Existence of nonrelativistic $\\ell$- and multi-$\\ell$-boson stars and their radial stability", "abstract": "Using direct methods of the calculus of variations we establish the existence of an infinite class of spherically-symmetric solutions to the multi-field Schrödinger-Poisson system. This is achieved by proving that the energy functional admits a global minimum when restricted to the set of vector-valued wave functions in the Sobolev space $H^1$ which are invariant with respect to a suitable representation of the rotation group and whose components have fixed $L^2$-norms. Additionally, we show that these minima correspond to solutions which are orbital stable with respect to perturbations of the wave function within this set. The generalization to include an external potential and some important properties of the minima are also discussed.", "url": "https://arxiv.org/abs/2605.27529", "type": "理论", "summary": "1. 该工作通过变分直接法严格证明了多场薛定谔-泊松系统中无穷多类球对称解的存在性，对应于非相对论性ℓ-与多ℓ-玻色星。\n2. 其技术核心在于将能量泛函限制在旋转群特定表示下具有固定L²范数的H¹向量值波函数集上，证明了全局极小值的存在及轨道稳定性。\n3. 这为玻色-爱因斯坦凝聚体中的多组分星体结构提供了严格数学框架，并指明了外部势推广及极小值关键性质的进一步研究方向。", "summary_source": "deepseek", "authors": [{"name": "Emmanuel Chávez Nambo"}, {"name": "Olivier Sarbach"}], "featured_authors": [{"name": "Emmanuel Chávez Nambo"}, {"name": "Olivier Sarbach"}], "author_count": 2}, {"id": "2605.27592", "category": "math-ph", "title": "WKB Spectral Asymptotics for a One-Dimensional Dirac Operator with a Slowly Varying Mass Profile", "abstract": "We study the semiclassical spectral theory of a one-dimensional Dirac operator describing waves at the interface between topologically distinct media. We derive a modified Bohr-Sommerfeld quantization condition for the squared operator via a systematic formal WKB construction producing approximate eigenpairs. Our result differs from the standard result by the half-integer shift depending on the pseudo-spin index which allows for recovering the topologically protected zero mode. We verify our result for the solvable Pöschl--Teller potential and provide numerical computations confirming the convergence of eigenvalues and eigenfunctions to their WKB approximations.", "url": "https://arxiv.org/abs/2605.27592", "type": "理论", "summary": "1. 该工作通过系统的WKB构造，为一维缓变质量Dirac算子推导了平方算子的修正Bohr–Sommerfeld量子化条件。\n2. 其核心卖点在于量子化条件中的半整数移位依赖于赝自旋指标，从而精确恢复拓扑保护零模，这与标准结果根本不同。\n3. 这为拓扑界面波系统的半经典谱分析提供了验证严格的渐近框架，并可推广至其他缓变势与高维情形。", "summary_source": "deepseek", "authors": [{"name": "Owen Sutton"}, {"name": "Alexander B. Watson"}], "featured_authors": [{"name": "Owen Sutton"}, {"name": "Alexander B. Watson"}], "author_count": 2}, {"id": "2605.27638", "category": "math-ph", "title": "Exact solution for a periodically driven magnetic multilayer system", "abstract": "Periodic driving serves as an effective method for controlling the properties of physical systems. Called \"Floquet engineering,\" it is a broad field of theoretical and experimental activity. Whereas original Floquet theory was proposed to a system of ordinary differential equations, the quantum systems with time-dependent potential require using partial differential equations. Among different methods of analysis of such systems, time series is a most common one. Though general scheme was developed in a number of works, its application to specific problems often faces significant difficulties. In particular, the class of the problems describing magnetic multilayers with time-dependent potential (e.g., rotating magnetization of some of the layers) leads to significant complication of the problem due to two-component wave function and matching conditions at the interfaces. Taking as an example a two-layer system containing magnetic layer with rotating magnetization, we construct a class of solution containing arbitrary but finite number of the terms. The structure of the solution is analyzed. In particular, we show that boundary conditions, which seem a natural generalization of that for a stationary problem, cannot be imposed in the case of rotating magnetizations.", "url": "https://arxiv.org/abs/2605.27638", "type": "理论", "summary": "1. 该工作以旋转磁化双层系统为例，构造了周期性驱动磁多层结构中含任意有限项的精确解。\n2. 其核心在于揭示旋转磁化下匹配边界条件无法直接推广自静态问题，并解析了解的结构特性与约束。\n3. 这为Floquet工程在磁性多层系统中的严格处理及边界条件设计提供了理论基础与新的判据。", "summary_source": "deepseek", "authors": [{"name": "P. I. Naumkin"}, {"name": "A.V. Nikolaev"}, {"name": "L.L. Tao"}, {"name": "M. Ye. Zhuravlev"}], "featured_authors": [{"name": "P. I. Naumkin"}, {"name": "A.V. Nikolaev"}, {"name": "L.L. Tao"}, {"name": "M. Ye. Zhuravlev"}], "author_count": 4}, {"id": "2605.28002", "category": "math-ph", "title": "Existence and Uniqueness of Irregular Vectors of Integer and Half-Integer Ranks for the Virasoro Algebra", "abstract": "Although irregular vectors for the Virasoro algebra are widely used in modern mathematical physics, a rigorous existence and uniqueness theorem in arbitrary rank has not been available in the literature. In this paper, we develop an algebraic framework, based on Virasoro differential operators on the parameter space, which gives such a theorem for arbitrary integer and half-integer ranks. A key ingredient is the construction of a canonical operator \\(L_*\\) from the coefficient matrix of the vector-field part of a truncated Virasoro realization. This operator closes the recursive system by isolating the derivative with respect to the highest irregular parameter. Using this mechanism, we prove the existence and uniqueness of formal irregular vectors of arbitrary integer rank. We then construct the truncated Virasoro vector fields required in the half-integer rank setting and prove the existence and uniqueness of the corresponding half-integer rank formal irregular vectors. These results provide an algebraic foundation for the rigorous construction of irregular conformal blocks built from higher-rank irregular vectors.", "url": "https://arxiv.org/abs/2605.28002", "type": "理论", "summary": "1. 该工作发展了一套基于Virasoro参数空间微分算子的代数框架，严格证明了任意整数与半整数秩不规则向量的存在唯一性。\n2. 其核心在于通过截断Virasoro实现的向量场部分系数矩阵构造正则算子L_*，该算子隔离最高不规则参数的导数，从而封闭递归系统；并将此方法推广至半整数秩情形。\n3. 这为基于高阶不规则向量构建不规则共形块提供了严格的代数基础。", "summary_source": "deepseek", "authors": [{"name": "Hajime Nagoya"}], "featured_authors": [{"name": "Hajime Nagoya"}], "author_count": 1}, {"id": "2605.28052", "category": "math-ph", "title": "Stationary Measures and Mean Flux Depending on Multiple Conserved Quantities in a Stochastic Cellular Automaton", "abstract": "We analyze a stochastic 5-neighbor cellular automaton with several conserved quantities, including the particle density. By examining the eigenvalue problem of the associated transition matrix, we derive an explicit formula for the stationary distribution on each irreducible component, in which the weight of each configuration is expressed in terms of the numbers of occurrences of two specific local patterns. This analysis further allows us to theoretically derive the dependence of the mean flux on the conserved quantities. In particular, we recover the mean flux formula in the deterministic case by taking the zero-noise limit of the system.", "url": "https://arxiv.org/abs/2605.28052", "type": "理论", "summary": "1. 该工作分析了一个具有多个守恒量（包括粒子密度）的随机5邻居元胞自动机，通过转移矩阵特征值问题导出每个不可约分量上平稳分布的显式公式。\n2. 其卖点在于每个构型权重仅由两种特定局部模式的出现次数表达，从而解析得出平均流量对守恒量的依赖关系，并在零噪声极限下恢复确定性公式。\n3. 这为随机系统中多个守恒量与宏观流量的定量关联提供了精确解析框架，可推广至其他守恒型元胞自动机或相关非平衡统计模型。", "summary_source": "deepseek", "authors": [{"name": "Kazushige Endo"}, {"name": "Shinsuke Iwao"}, {"name": "Hidetomo Nagai"}, {"name": "Yushi Nakano"}], "featured_authors": [{"name": "Kazushige Endo"}, {"name": "Shinsuke Iwao"}, {"name": "Hidetomo Nagai"}, {"name": "Yushi Nakano"}], "author_count": 4}, {"id": "2605.28319", "category": "math-ph", "title": "Dissipative Spectral Form Factor of the Complex Elliptic Ginibre Ensemble across Various Non-Hermiticity Regimes", "abstract": "We study the dissipative spectral form factor (DSFF) at complex time $T e^{i\\theta}$ for the complex elliptic Ginibre ensemble with non-Hermiticity parameter $\\tau \\in [0,1)$. As the matrix dimension $N \\to \\infty$, we consider the natural scalings in both the time variable and the non-Hermiticity parameter, namely $T = O(N^\\gamma)$ and $1 - \\tau = O(N^{-\\alpha})$. For all regimes $\\gamma \\ge 0$ and $\\alpha \\ge 0$, we derive the precise asymptotic behaviour of both the disconnected and connected components of the DSFF. In particular, we explicitly characterise the dip--ramp--plateau structure, including the dip time and the Heisenberg time. In addition, we identify the mesoscopic regime $\\alpha \\in (0,1)$, which interpolates between the behaviour of the DSFF of non-Hermitian random matrices and the spectral form factor (SFF) of Hermitian ensembles. We further provide an explicit description of the phase diagram, in which the ramp exhibits quadratic, linear, or intermediate behaviour depending on the scaling parameters.", "url": "https://arxiv.org/abs/2605.28319", "type": "理论", "summary": "1. 本文针对复杂椭圆Ginibre系综，在非厄米参数1-τ=O(N^{-α})与时间T=O(N^{γ})的联合标度下，精确推导了耗散谱形状因子（DSFF）断开与连接部分的渐近行为，覆盖所有α≥0、γ≥0区域。\n2. 其核心在于显式刻画了dip-ramp-plateau结构，包括dip时间与Heisenberg时间，并识别出α∈(0,1)的介观标度，该标度平滑插值了非厄米系综DSFF与厄米系综谱形状因子（SFF）的迥异行为。\n3. 所获相图表明，随α与γ变化，斜坡（ramp）呈现二次、线性或中间幂律依赖，这为开放量子系统混沌与退相干动力学的随机矩阵理论普适性分类提供了统一框架与可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Gernot Akemann"}, {"name": "Sung-Soo Byun"}, {"name": "Seungjoon Oh"}], "featured_authors": [{"name": "Gernot Akemann"}, {"name": "Sung-Soo Byun"}, {"name": "Seungjoon Oh"}], "author_count": 3}, {"id": "2605.28528", "category": "math-ph", "title": "Electron-photon interaction: Feynman diagrams and contact points", "abstract": "In this note, we formulate the notions of the direct and inverse problems and contact points for the Feynman diagrams. For the electron-photon interaction case, the solutions of these direct and inverse problems are presented. The interrelations between Feynman diagrams and the classical colored graphs are discussed.", "url": "https://arxiv.org/abs/2605.28528", "type": "理论", "summary": "1. 该工作针对电子-光子相互作用，系统构建了费曼图中直接问题、逆问题及接触点的概念框架。\n2. 其核心在于给出了这些问题的解析解，并揭示了费曼图与经典着色图之间的内在对应关系。\n3. 这为量子电动力学中的图论方法及费曼图拓扑结构的代数化分析提供了新的理论视角。", "summary_source": "deepseek", "authors": [{"name": "Lev Sakhnovich"}], "featured_authors": [{"name": "Lev Sakhnovich"}], "author_count": 1}, {"id": "2605.28685", "category": "math-ph", "title": "Purified Projection Method and Uhlmann Fidelity for Mixed Hartree Dynamics", "abstract": "We give a purification and fidelity formulation of the projection method for mixed Hartree data. For the mean-field evolution of $N$-particle density matrices, we prove quantitative propagation of chaos for all fixed marginals, first in squared Uhlmann fidelity and then in trace norm via the Fuchs--van de Graaf inequality. The argument applies a rank-one Pickl-type counting estimate in a purified one-particle space and uses monotonicity of fidelity under partial trace to return to the physical variables. The result allows singular interactions satisfying a projected-square bound, including $L^{2r}$ interactions and the Coulomb potential.", "url": "https://arxiv.org/abs/2605.28685", "type": "理论", "summary": "1. 该工作为混合Hartree数据的投影方法建立了纯化与保真度表述，证明了N粒子密度矩阵平均场演化的定量传播混沌。\n2. 其技术核心在于纯化单粒子空间中的秩一Pickl型计数估计，并利用Uhlmann保真度在部分迹下的单调性将平方保真度结果转化为迹范数界。\n3. 这为包含L^{2r}相互作用和Coulomb势等奇异相互作用的多体量子系统提供了严格的平均场极限分析方法。", "summary_source": "deepseek", "authors": [{"name": "Hao Liang"}, {"name": "Zhenfu Wang"}], "featured_authors": [{"name": "Hao Liang"}, {"name": "Zhenfu Wang"}], "author_count": 2}, {"id": "2605.27408", "category": "quant-ph", "title": "Neural Quantum Spectral Operator Learning for Solving Partial Differential Equations", "abstract": "Partial differential equations (PDEs) are central to modeling physical and engineering systems, but repeatedly solving parametric PDEs remains computationally expensive. Operator learning enables fast surrogate inference, yet typically requires large input-output paired datasets generated by costly high-fidelity PDE solvers. Unsupervised operator learning frameworks alleviate data dependency but remain hindered by computational bottlenecks. To address this, we propose Neural Variational Quantum Linear Solver (NVQLS), the first hybrid quantum-classical operator learning framework leveraging the Legendre--Galerkin weak formulation. We critically resolve the sign ambiguity in VQLS energy minimization, preventing erroneous solution representations. Additionally, we introduce a neural embedding, a novel encoding scheme to map varying forcings and PDE coefficients into parameterized quantum circuit representations. These structural innovations provide theoretical computational complexity advantages under efficient state preparation schemes, while achieving superior accuracy compared to a representative classical baseline. Validations on 1D and 2D parametric PDEs under diverse boundary conditions demonstrate NVQLS's capability to simultaneously process varying inputs, offering a scalable unsupervised approach to quantum-enhanced operator learning.", "url": "https://arxiv.org/abs/2605.27408", "type": "理论+数值", "summary": "1. 该工作提出神经量子谱算子学习框架NVQLS，用于无监督求解参数化偏微分方程，避免了传统算子学习对高保真数据集的依赖。\n2. 核心创新在于结合Legendre–Galerkin弱形式解决了VQLS能量极小化中的符号歧义，并引入神经嵌入将变化的外场和系数编码为参数化量子电路表示。\n3. 这为量子优越性在无监督算子学习中的实现提供了可扩展路径，有望在复杂物理系统的参数化建模中降低经典计算开销。", "summary_source": "deepseek", "authors": [{"name": "Chanyoung Kim"}, {"name": "Myeonghwan Seong"}, {"name": "Yujin Kim"}, {"name": "Daniel K. Park"}, {"name": "Youngjoon Hong"}], "featured_authors": [{"name": "Chanyoung Kim"}, {"name": "Myeonghwan Seong"}, {"name": "Yujin Kim"}, {"name": "Daniel K. Park"}, {"name": "Youngjoon Hong"}], "author_count": 5}, {"id": "2605.27417", "category": "quant-ph", "title": "Quantum Machine Learning-based 6G edge Network: Enabling Adaptive Communication and Model Aggregation", "abstract": "With the advent of sixth-generation (6G) mobile communication technology, vehicle-to-everything (V2X) communication faces unprecedented challenges in communication efficiency, system generalization capabilities, and model collaboration. Conventional machine learning struggles with high-dimensional state spaces, slow convergence, and poor generalization under heterogeneous V2X nodes, rapidly varying channels, and multimodal sensing data in V2X systems. To address these issues, we propose a quantum-enhanced framework for V2X communication and model aggregation that targets efficient, robust, and intelligent transportation in 6G, which includes four modules: the channel-adaptive semantic communication module, the multimodal fusion module, the model transfer module, and the federated aggregation module. Specifically, the channel-adaptive semantic communication module leverages quantum convolutional neural networks (CNN) and quantum distortion metrics to enable efficient transmission and strong generalization across diverse conditions. The multimodal fusion module exploits quantum attention and entanglement to compress features and associate semantics across heterogeneous data. The model transfer module employs quantum reinforcement learning to model decision-making and improve adaptability in dynamic environments. The federated aggregation module integrates quantum tensor decomposition with backpropagation-based corrections to provide privacy preservation with low overhead and to strengthen global model robustness. This work outlines a new paradigm for communication and model collaboration in future 6G intelligent transportation.", "url": "https://arxiv.org/abs/2605.27417", "type": "理论+数值", "summary": "1. 该工作针对6G车联网通信中高维状态空间与异构节点泛化难题，提出量子增强框架，集成信道自适应语义通信、多模态融合、模型迁移与联邦聚合四大模块。\n2. 其技术核心在于利用量子卷积神经网络与失真度量实现跨条件高效传输，通过量子注意力与纠缠压缩异构数据特征，并结合量子强化学习与张量分解提升动态适应性与隐私保护。\n3. 这为6G智能交通中低开销、强鲁棒的通信与模型协同指明了依托量子优势的可行范式。", "summary_source": "deepseek", "authors": [{"name": "Wenjing Xiao"}, {"name": "Jiatai Yan"}, {"name": "Chenglong Shi"}, {"name": "Shixin Chen"}, {"name": "Miaojiang Chen"}, {"name": "Min Chen"}, {"name": "Saif Al-Kuwari"}, {"name": "Ahmed Farouk"}], "featured_authors": [{"name": "Wenjing Xiao"}, {"name": "Jiatai Yan"}, {"name": "Chenglong Shi"}, {"name": "Min Chen"}, {"name": "Saif Al-Kuwari"}, {"name": "Ahmed Farouk"}], "author_count": 8}, {"id": "2605.27421", "category": "quant-ph", "title": "Full characterization of informative subsets in Quantum Encrypted Cloning", "abstract": "Quantum encrypted cloning, introduced by Yamaguchi and Kempf, is a Pauli-based protocol that distributes an unknown input qubit into multiple encrypted signal-noise pairs in such a way that redundancy is created without violating the no-cloning theorem, since at most one clone can later be perfectly recovered through an appropriate decoding procedure. In previous work we showed that unauthorized subsets of the storage register are not, in general, completely uninformative, and we identified a parity-dependent leakage pattern. In the present work we extend the analysis to subsets that also include the transformed source qubit A. Exploiting the purity of the global encoded state and the complementarity between storage-only subsets and subsets containing A, we derive a full classification of the informativeness of all sets of the form $H=\\{A\\}\\cup C$. We show that these subsets are fully informative in the generic case. Two exceptions arise. First, if all pairs are incomplete and |C|<n, then the reduced state is completely uninformative. Second, if |C|=n, n is odd, and the number q of signal qubits in C is even, then the reduced state is partially informative. In this latter case, the residual dependence on the input state is confined to the y-component of the Bloch vector. These results provide a complete parity-based characterization of leakage for subsets containing the transformed input qubit.", "url": "https://arxiv.org/abs/2605.27421", "type": "理论", "summary": "1. 该工作对量子加密克隆协议中包含变换后源量子比特A的子集进行了完整的信息性分类。\n2. 利用全局编码态的纯度及存储子集与含A子集间的互补性，推导了所有形如H={A}∪C子集在一般情形下全信息、两种例外中完全无信息或部分信息的奇偶依赖机制。\n3. 这些结果为量子加密克隆中信息泄露提供了基于奇偶性的完整刻画，对理解量子信息冗余与安全性的本质有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Gabriele Gianini"}, {"name": "Stelvio Cimato"}, {"name": "Jianyi Lin"}, {"name": "Omar Hasan"}, {"name": "Ernesto Damiani"}], "featured_authors": [{"name": "Gabriele Gianini"}, {"name": "Stelvio Cimato"}, {"name": "Jianyi Lin"}, {"name": "Omar Hasan"}, {"name": "Ernesto Damiani"}], "author_count": 5}, {"id": "2605.27423", "category": "quant-ph", "title": "Quantum Speed Limit under Calibration Uncertainty", "abstract": "Standard quantum speed limits presuppose exactly known parameters, overestimating operational speed under calibration uncertainty. We introduce a projected speed limit based on the quantum Fisher information that profiles out these nuisance parameters on a quotient manifold. We derive constructive bounds for general Markovian evolution using sensitivity equations. Applying this to Jaynes--Cummings sensors, we obtain explicit detuning tolerances and quantify speed limits arising from field-dependent Purcell loss. This framework turns geometric bounds into concrete design rules for calibration and interrogation time.", "url": "https://arxiv.org/abs/2605.27423", "type": "理论", "summary": "1. 该工作提出考虑标定不确定性的量子速度极限，通过投影量子Fisher信息在商流形上剔除冗余参数，修正了标准极限对操作速度的高估。\n2. 其技术核心在于利用敏感方程导出一般马尔可夫演化的构造性界限，并应用于Jaynes-Cummings传感器，揭示失谐容限与场依赖Purcell损失引起的速度限制。\n3. 该框架将几何速度界限转化为标定误差与探测时间的具体设计规则，为含不确定参数的量子计量提供了可操作的性能边界。", "summary_source": "deepseek", "authors": [{"name": "Salman Sajad Wani"}, {"name": "Saif Al-Kuwari"}], "featured_authors": [{"name": "Salman Sajad Wani"}, {"name": "Saif Al-Kuwari"}], "author_count": 2}, {"id": "2605.27425", "category": "quant-ph", "title": "Quantum-Inspired Hamiltonian Optimization, Stochastic Tensor Networks and Adaptive Congestion Routing for Large-Scale QKD Networks", "abstract": "Quantum Key Distribution (QKD) networks require routing methodologies capable of jointly optimizing latency, secret key generation rate, congestion, finite capacity and operational security constraints under dynamically evolving traffic conditions. In this work we introduce a quantum-inspired optimization framework for adaptive multi-demand routing in QKD communication networks based on effective Hamiltonian modelling, Quantum Monte Carlo inspired annealing and stochastic Tensor-Network State (TNS) compression. The communication network is represented as a stochastic interacting graph whose routing configurations evolve under an effective Hamiltonian containing latency, keyrate, congestion, risk and capacity terms. The resulting optimization landscape is explored through two complementary approaches: a stochastic Metropolis annealer based on incremental local Hamiltonian updates, and a stochastic boundary-MPS tensor-network approximation that compresses the low-energy routing sector through thermal branch selection. The resulting framework establishes a scalable bridge between QKD network orchestration, statistical-physics-inspired optimization, tensor-network compression and future quantum-native routing systems.", "url": "https://arxiv.org/abs/2605.27425", "type": "理论+数值", "summary": "1. 该工作提出了一个量子启发的哈密顿优化框架，用于大规模QKD网络中联合优化时延、密钥生成率、拥塞与安全约束的自适应多需求路由。\n2. 其技术核心在于将量子蒙特卡洛退火与随机边界矩阵乘积态张量网络压缩相结合，通过热分支选择有效压缩低能路由构型空间。\n3. 这为QKD网络编排与统计物理优化、张量网络压缩及未来量子原生路由系统之间建立了可扩展的桥梁。", "summary_source": "deepseek", "authors": [{"name": "Jose Luis Rosales"}], "featured_authors": [{"name": "Jose Luis Rosales"}], "author_count": 1}, {"id": "2605.27426", "category": "quant-ph", "title": "Expanding quantum magnetic field", "abstract": "We develop the quantum theory of the causal formation of a long-range magnetic field generated by an external current that is instantaneously switched on and subsequently kept constant in time. The resulting non-equilibrium quantum state, describing the expanding magnetic field, is obtained exactly and compared with the corresponding quantum magnetostatic state. In contrast to the magnetostatic case, the expanding solution exhibits a propagating shockwave-like front separating regions where the magnetic field has already been formed from those that remain causally disconnected from the source. We show that although the expanding field locally approaches the magnetostatic field behind the shockwave-like front, the associated quantum systems remain distinct at all times. In particular, we obtain manifestly different results for the energy, photon number, and their fluctuations in expanding and magnetostatic field configurations. Our results are first derived for a general external current and then illustrated with a specific example.", "url": "https://arxiv.org/abs/2605.27426", "type": "理论", "summary": "1. 该工作建立了瞬时开启并维持恒定的外部电流所产生长程磁场的因果形成量子理论，并精确求解了其非平衡量子态。\n2. 核心卖点在于揭示扩展磁场存在传播的激波状前沿，虽在局域上趋近磁静态场，但二者在能量、光子数及涨落等量子观测量上始终存在本质差异。\n3. 该工作为非平衡量子场论中因果结构对量子态形成的影响提供了精确可解的范例，启发了对相关瞬态量子相干与退相干过程的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Bogdan Damski"}], "featured_authors": [{"name": "Bogdan Damski"}], "author_count": 1}, {"id": "2605.27427", "category": "quant-ph", "title": "Quantum reservoir networks based on decoherence-free subspaces", "abstract": "We present numerical simulation of a six-qubit quantum reservoir network with an output implemented on a 5-dimensional decoherence-free subspace (DFS), working as a classifier between entangled and product states of the input quantum system, fed to the reservoir during a finite learning time. Since the dynamics of DFS is not affected by external fluctuations, no cooling is required, and the proposed model seems a promising candidate for future quantum artificial intelligence systems working at room temperatures and free of huge energy consumption.", "url": "https://arxiv.org/abs/2605.27427", "type": "理论+数值", "summary": "1. 该工作数值模拟了一个六量子比特量子储层网络，其输出基于五维无退相干子空间，用于对输入量子系统的纠缠态与直积态进行分类。\n2. 技术核心在于利用无退相干子空间免受外部涨落影响的动力学特性，从而无需冷却即可在室温下运行，避免了巨大能耗。\n3. 这一方案为构建室温运行的量子人工智能系统提供了有前景的候选架构，并启发在无退相干保护下发展高效量子信息处理。", "summary_source": "deepseek", "authors": [{"name": "V.V. Akshay"}, {"name": "M.V. Altaisky"}, {"name": "N.E. Kaputkina"}], "featured_authors": [{"name": "V.V. Akshay"}, {"name": "M.V. Altaisky"}, {"name": "N.E. Kaputkina"}], "author_count": 3}, {"id": "2605.27430", "category": "quant-ph", "title": "Lowering LCU Circuit Width through Maximum-Weight Birkhoff-von Neumann Decomposition", "abstract": "Any square matrix can be transformed into a doubly stochastic matrix via Sinkhorn scaling with diagonal matrices or completing to a larger dimensional matrix. Standard Birkhoff-von Neumann and Pauli decompositions represent such matrices as linear combinations of $O(N^2)$ permutation or Pauli terms, leading to a large ancilla overhead in a quantum Linear Combination of Unitaries (LCU) implementation. We prove that a bottleneck variant of Birkhoff's algorithm reduces the number of permutations to $O(N\\log(1/\\varepsilon))$, where $\\varepsilon$ is the $\\ell_1$-norm approximation error of the reconstructed matrix, and demonstrate empirically that a largest-weight greedy variant requires only $\\approx 2N$ terms for dense matrices (the exact average observed is $\\approx 2.4N$). The quadratic reduction in term count directly shrinks the ancilla register from $2\\log_2 N$ to $\\log_2 N$ qubits, shortens the SELECT circuit, and is especially valuable in fixed-Hadamard LCU architectures whose success probability scales with $1/K$. The approach enables compact quantum implementations of dense operators appearing in optimal transport, non-Hermitian simulation, and other settings amenable to Sinkhorn preconditioning. Furthermore, because the decomposition is a convex combination, the LCU normalization constant is exactly $\\alpha = 1$, and the uniform superposition is an eigenvector of the target matrix with eigenvalue~1. This structure can be exploited to achieve high success probability without amplitude amplification in many practical scenarios, including quantum walks and Markov chain simulations.", "url": "https://arxiv.org/abs/2605.27430", "type": "理论+数值", "summary": "1. 该工作提出通过最大权重Birkhoff‑von Neumann分解将任意矩阵表示为少量置换项的凸组合，从而降低量子线性组合算符（LCU）线路宽度。\n2. 其核心卖点在于将项数从标准分解的O(N²)压缩至约2N（实验平均约2.4N），使辅助寄存器从2log₂N减至log₂N比特，并保持归一化常数α=1。\n3. 这为稠密算子的紧凑量子实现提供了路径，可应用于Sinkhorn预处理后的最优输运与非厄米模拟，且利用均匀叠加态为目标矩阵本征值1的本征态，可在无需幅度放大时实现高成功概率。", "summary_source": "deepseek", "authors": [{"name": "Ammar Daskin"}], "featured_authors": [{"name": "Ammar Daskin"}], "author_count": 1}, {"id": "2605.27434", "category": "quant-ph", "title": "Emergent Operational Entanglement Graphs and Sub-Quadratic Authentication Scaling in Realistic E91 Quantum Networks", "abstract": "Large-scale entanglement-based quantum key distribution (QKD) networks are commonly assumed to require authentication resources scaling quadratically with the number of users. We show that realistic quantum communication networks operating under loss, decoherence, and LOCC constraints exhibit fundamentally different scaling laws. Using Pauli transfer matrix (PTM) transport, we demonstrate that Bell correlations decay exponentially along entanglement-swapping paths, generating finite operational correlation lengths and sparse operational entanglement graphs. In sparse metropolitan quantum networks, the number of CHSH-usable Bell pairs consequently scales linearly with network size, while authentication complexity scales as \\[ \\Theta(N\\log N), \\] under sparse-mixing assumptions. We further present an ancilla-assisted distributed Bell-state verification framework for realistic E91 quantum metropolitan infrastructures. Our results suggest that scalable authentication in quantum communication networks emerges directly from the physics of entanglement transport.", "url": "https://arxiv.org/abs/2605.27434", "type": "理论", "summary": "1. 该工作利用Pauli转移矩阵输运分析，揭示了真实损耗与退相干条件下E91量子网络中操作纠缠图的涌现机制。\n2. 其核心发现在于贝尔关联沿纠缠交换路径指数衰减产生有限相关长度，使稀疏城域网络认证复杂度降至Θ(N log N)。\n3. 这为从纠缠输运物理出发设计可扩展量子网络认证协议提供了基础，并推动了实际城域QKD基础设施的资源优化。", "summary_source": "deepseek", "authors": [{"name": "José Luis Rosales"}], "featured_authors": [{"name": "José Luis Rosales"}], "author_count": 1}, {"id": "2605.27442", "category": "quant-ph", "title": "Coherent catalyst induced stabilization of ergotropy in open quantum batteries", "abstract": "Environmental dissipation and thermal fluctuations fundamentally constrain the extractable work and long-time stability of open quantum batteries. To mitigate dissipation-induced energy degradation without external driving protocols, we propose a cavity-mediated hybrid quantum battery coupled to an auxiliary coherent qubit. Using the Lindblad master equation and ergotropy analysis, we show that coherent interference between different interaction channels generates a decoherence-free-like invariant subspace that suppresses relaxation-induced energy leakage and stabilizes the steady-state ergotropy. The resulting protection mechanism remains effective under strong dissipation and finite-temperature conditions, indicating that interference-assisted coherent control may provide a feasible strategy for robust quantum energy storage in nonequilibrium open systems.", "url": "https://arxiv.org/abs/2605.27442", "type": "理论", "summary": "1. 本研究提出腔介导混合量子电池耦合辅助相干量子比特方案，基于Lindblad主方程和ergotropy分析展示相干干涉抑制弛豫能量泄漏。\n2. 其核心卖点是不同相互作用通道的相干干扰产生无退相干不变子空间，无需外部驱动即可稳定稳态ergotropy。\n3. 该机制在强耗散与有限温度下依然有效，为开放非平衡系统中鲁棒量子能量存储提供干涉辅助相干控制策略。", "summary_source": "deepseek", "authors": [{"name": "Ni-Ya Zhuang"}, {"name": "Shun-Cai Zhao"}], "featured_authors": [{"name": "Ni-Ya Zhuang"}, {"name": "Shun-Cai Zhao"}], "author_count": 2}, {"id": "2605.27443", "category": "quant-ph", "title": "Quantum Circuit Realization and Grover Cryptanalysis of the Hybrid ARX-SPN Cipher GFSPX", "abstract": "The security of classical symmetric-key primitives is fundamentally challenged by the emergence of quantum computing, necessitating a rigorous evaluation of their post-quantum resilience. This paper presents a comprehensive quantum circuit realization and Grover cryptanalysis of GFSPX, a lightweight block cipher featuring a 64-bit data block and a 128-bit secret key. GFSPX utilizes a unique hybrid architecture that integrates a 4-branch generalized Feistel structure with both Addition-Rotation-XOR (ARX) and Substitution-Permutation Network (SPN) components. Our quantum implementation optimizes resource distribution by exploiting the inherent reversibility of the Feistel network and employing a compact ripple-carry adder for the ARX layers. The proposed architecture achieves a qubit-optimized footprint of 209 qubits with a baseline quantum cost of 32,498 and a circuit depth of 7,617. To evaluate the cipher's resistance against quantum adversaries, we construct a parallelized Grover oracle using three plaintext-ciphertext pairs to eliminate spurious matches. Our analysis reveals that the total quantum cost of a key-recovery attack on GFSPX is $1.12 \\times 2^{159}$ quantum gates. Although this cost falls below the NIST Level 1 security threshold of $2^{170}$, the hybrid ARX-SPN design demonstrates a higher quantum attack resistance among other lightweight designs. These findings provide critical insights into the balance between classical efficiency and quantum resilience in next-generation cryptographic designs for resource-constrained environments.", "url": "https://arxiv.org/abs/2605.27443", "type": "理论+数值", "summary": "1. 该工作实现了混合ARX-SPN轻量级密码GFSPX（64位数据块、128位密钥）的量子电路构建与Grover密钥恢复攻击。\n2. 其技术核心在于借助Feistel网络的可逆性及紧凑纹波进位加法器将量子比特占用优化至209，并利用三组明文-密文对搭建并行化Grover Oracle以消除假匹配。\n3. 尽管总量子门成本1.12×2^159低于NIST一级安全阈值，但该混合架构在轻量级设计群中展现出更强的量子攻击抵抗性，为资源受限场景下兼顾经典效率与后量子安全性提供了设计启示。", "summary_source": "deepseek", "authors": [{"name": "Ibrahim Ulgen"}, {"name": "Hasan Ozgur Cildiroglu"}, {"name": "Oğuz Yayla"}], "featured_authors": [{"name": "Ibrahim Ulgen"}, {"name": "Hasan Ozgur Cildiroglu"}, {"name": "Oğuz Yayla"}], "author_count": 3}, {"id": "2605.27448", "category": "quant-ph", "title": "Efficient ensemble randomization by tuning chaos in a nonlinear spin-1 system", "abstract": "We present an efficient scheme to randomize a spin-state ensemble in a nonlinear spin-1 system by tuning chaos with an external periodic drive. Without modulation, the system exhibits a mixed phase space featuring regular islands embedded in a chaotic sea, where global mixing is inhibited by energy conservation. Using numerical simulations, we demonstrate that weak modulation of a linear Zeeman field not only facilitates transport between different energy shells but also drives ensembles toward a Haar-random distribution over spin states. Under optimized conditions, complete randomization is achieved on a timescale set by the inverse nonlinear interaction energy. In the overdriven regime, randomization is unexpectedly suppressed at specific modulation amplitudes, accompanied by the formation of sticky regions in phase space. We attribute this behavior to the dynamical cancellation of the leading low-order harmonic component of the periodic drive. These results illustrate how time-periodic driving can be used to engineer chaotic systems and achieve controllable randomization in nonlinear spin systems.", "url": "https://arxiv.org/abs/2605.27448", "type": "数值", "summary": "1. 该工作提出在非线性自旋-1系统中利用周期驱动调节混沌以实现自旋态系综的高效随机化。\n2. 其关键是通过弱调制线性塞曼场打破能量守恒限制，使系综在逆非线性相互作用时间尺度上接近Haar随机分布，并在过驱动区观察到随机化被特定调制幅度抑制，归因于驱动低阶谐波分量的动力学抵消。\n3. 这展示了时变周期驱动工程混沌系统以控制随机化的能力，为量子信息与多体物理中的可控系综制备提供新思路。", "summary_source": "deepseek", "authors": [{"name": "Jongmin Kim"}, {"name": "Minsung Jeong"}, {"name": "Jongyoon Han"}, {"name": "Y. Shin"}], "featured_authors": [{"name": "Jongmin Kim"}, {"name": "Minsung Jeong"}, {"name": "Jongyoon Han"}, {"name": "Y. Shin"}], "author_count": 4}, {"id": "2605.27515", "category": "quant-ph", "title": "A multilevel tensor network compression technique for simulating Lindblad dynamics in superconducting circuits", "abstract": "Designing superconducting quantum hardware requires simulation tools that can account for various deviations from ideal scenarios. This, in turn, requires approaches that automatically detect certain structures and leverage them to make the computation affordable. Here, we develop a tensor network based technique to simulate the Lindblad dynamics of a few interacting bosonic modes with a focus on superconducting quantum circuits. The technique detects and takes advantage of two very common situations: (i) the density matrix being pure or not far from pure and (ii) the entanglement between different modes being moderate (typically qubit-like). However, (iii) the occupation of the modes can be arbitrarily high (making naïve truncations inefficient). To leverage these features, we use three different nested levels of tensor network compression: (i) we work with a global purification of the density matrix, (ii) we compress the connection between different modes to account for the moderate entanglement and (iii) we use a quantics representation of the Fock occupation number. We showcase the technique for the simulation of large cat qubits as well as for the ionization of transmon qubits, demonstrating orders-of-magnitude speed-up with respect to brute force approaches. In the latter example, it brings the simulation, previously reported on a large supercomputing infrastructure, to laptop level. The favorable scaling with system size should bring genuine computer assisted design of these systems within scope.", "url": "https://arxiv.org/abs/2605.27515", "type": "理论+数值", "summary": "1. 该工作提出一种多级张量网络压缩技术，用于模拟超导电路中少数相互作用玻色子模式的林德布拉德动力学。\n2. 其核心卖点在于通过全局纯化、模式间中等纠缠压缩及福克占据数的量子表示三个嵌套级别，同时应对密度矩阵准纯、纠缠类量子比特与占据数任意高三种常见情况。\n3. 这使原先依赖大型超算的模拟可在笔记本级别实现数量级加速，为超导量子电路的真实计算机辅助设计开辟道路。", "summary_source": "deepseek", "authors": [{"name": "Adrien Moulinas"}, {"name": "Xavier Waintal"}], "featured_authors": [{"name": "Adrien Moulinas"}, {"name": "Xavier Waintal"}], "author_count": 2}, {"id": "2605.27540", "category": "quant-ph", "title": "EFaaS: A Quantum-Classical Serverless Entangled Scheduler for Hybrid Variational Algorithms", "abstract": "As quantum computing enters the Utility Era, realizing near-term advantage relies heavily on Hybrid Variational Quantum Algorithms (VQAs). These algorithms require a tightly coupled, iterative loop between a classical CPU optimizer and a Quantum Processing Unit (QPU). However, current quantum cloud access models are bottlenecked by decoupled batch-queues that sever this loop, introducing massive Time-to-Next-Shot (TTNS) latency. This delay inflates convergence time from minutes to hours and exposes the computation to quantum hardware drift, degrading algorithmic fidelity. Unlike prior works that rely on resource-wasting static hardware reservations or state-oblivious stateless functions, we propose EFaaS, a novel serverless middleware designed specifically for hybrid quantum workflows. EFaaS fundamentally departs from existing architectures by treating classical parameter optimization and quantum circuit execution as entangled, session-aware events. Our main technical innovations are threefold: (1) a Calibration-Aware placement strategy that dynamically routes circuits to QPUs with warm calibration caches, circumventing cold-start penalties, (2) a Dual-Resource Fair Queuing scheduler that maximizes quantum utilization by strictly prioritizing active iterative loops, and (3) the \"EF-QuantumFuture\" programming abstraction, a novel primitive enabling classical speculative execution to mask compute latency. Across the evaluated baselines, EFaaS achieves TTNS reductions of 11.4%-94.3%, QDC gains of 2.02%-15.78% points, and convergence speedups of 83.2%-98.3%, while eliminating drift penalties.", "url": "https://arxiv.org/abs/2605.27540", "type": "理论+数值", "summary": "1. 该工作提出EFaaS，一种面向混合变分量子算法的量子-经典无服务器纠缠调度中间件。\n2. 其核心在于将经典优化与量子电路执行视为会话感知的纠缠事件，通过校准感知放置、双资源公平排队及经典推测执行消除批队列瓶颈。\n3. 这为实用化量子计算中混合算法的高保真、低延迟执行提供了可扩展的无服务器架构路径。", "summary_source": "deepseek", "authors": [{"name": "Abolfazl Younesi"}, {"name": "Nouhaila Innan"}, {"name": "Alberto Marchisio"}, {"name": "Muhammad Shafique"}], "featured_authors": [{"name": "Abolfazl Younesi"}, {"name": "Nouhaila Innan"}, {"name": "Alberto Marchisio"}, {"name": "Muhammad Shafique"}], "author_count": 4}, {"id": "2605.27598", "category": "quant-ph", "title": "Leveraging Correlated Decoding for Bias-Tailored Compass Codes", "abstract": "Quantum error correction (QEC) is often implemented on hardware that experiences biased noise, where dephasing errors occur more frequently than other errors. This has motivated many recent efforts to develop bias-tailored QEC codes, such as the Clifford-deformed compass codes: a family of codes that achieve high thresholds under biased dephasing noise. We perform circuit-level simulations of the Clifford-deformed elongated compass codes under a biased noise model and evaluate code thresholds using standard minimum weight perfect matching (MWPM) and correlated MWPM. We find that correlated decoding enhances thresholds for all noise biases relative to standard MWPM under circuit-level noise. Our results demonstrate that correlated decoding leads to a higher relative gain in thresholds compared to standard MWPM when applied to codes with asymmetric stabilizers under biased noise.", "url": "https://arxiv.org/abs/2605.27598", "type": "理论+数值", "summary": "1. 该工作对Clifford变形长罗盘码在偏置噪声模型下进行电路级模拟，采用标准最小权重完美匹配和相关解码评估码阈值。\n2. 其核心卖点是相关解码在所有偏置下均提升阈值，且对非对称稳定子码的相对增益高于标准最小权重完美匹配。\n3. 这为针对偏置噪声设计的量子纠错码在电路级解码策略优化上提供了明确性能优势与实现思路。", "summary_source": "deepseek", "authors": [{"name": "Arianna Meinking"}, {"name": "Julie Campos"}, {"name": "Kenneth R. Brown"}], "featured_authors": [{"name": "Arianna Meinking"}, {"name": "Julie Campos"}, {"name": "Kenneth R. Brown"}], "author_count": 3}, {"id": "2605.27660", "category": "quant-ph", "title": "Photon-Conditioned Squeezed States for Directional Displacement Response in Continuous-Variable Photonics", "abstract": "Squeezed Fock states, photon-subtracted squeezed states, and optical cat states are established non-Gaussian resources in continuous-variable quantum optics. Here we compare these known state families from a task-oriented perspective: matched mean photon number, scalar Wigner negativity, and directional displacement-fidelity response. Starting from squeezed vacuum, single-photon subtraction prepares a state proportional to \\(S(r,\\theta)\\ket{1}\\), while two-photon subtraction prepares an even-parity squeezed Fock superposition rather than a pure \\(S(r,\\theta)\\ket{2}\\). We benchmark photon-conditioned squeezed states against Fock and coherent-cat references using the integrated Wigner negativity \\(\\delta\\), the energy-normalized metric \\(\\delta/\\langle n\\rangle\\), and fidelity-threshold displacement radii \\(R_F(\\phi)\\). Cat benchmarks remain strong scalar Wigner-negativity resources, whereas photon-conditioned squeezed states provide an origin-centered alternative with tunable anisotropic displacement response. In particular, the two-photon-subtracted squeezed state shows favorable displacement-fidelity radii over selected quadrature directions at matched \\(\\langle n\\rangle\\). These results identify a regime relevant to homodyne-aligned continuous-variable control and anisotropic displacement-noise mitigation, with directional sensing as a natural dual application.", "url": "https://arxiv.org/abs/2605.27660", "type": "理论", "summary": "1. 该工作从任务导向视角，以匹配平均光子数、标量Wigner负性及定向保真度位移半径为度量，系统比较了光子条件压缩态与压缩Fock态及光猫态在连续变量非高斯资源中的性能。\n2. 其核心发现是双光子减压缩态虽标量Wigner负性逊于光猫态，但在匹配平均光子数下于特定正交方向提供更优位移保真度半径，且具备可调各向异性响应。\n3. 这些结果识别出与零差对齐连续变量控制及各向异性位移噪声抑制相关的态家族，并为定向传感等双重应用提供了明确的资源选择依据。", "summary_source": "deepseek", "authors": [{"name": "Boris Kiefer"}, {"name": "Olivier Pfister"}], "featured_authors": [{"name": "Boris Kiefer"}, {"name": "Olivier Pfister"}], "author_count": 2}, {"id": "2605.27670", "category": "quant-ph", "title": "Benchmarking Quantum Annealing for a Greenhouse-Inspired Control QUBO", "abstract": "We benchmark current annealing-based optimization workflows on a greenhouse-inspired quadratic unconstrained binary optimization problem for binary heater scheduling, where the horizon H denotes the number of hourly control decisions. For the main one-day instance (H=24), all solver outputs are decoded back into heater schedules and evaluated in the original greenhouse simulator using the same physical objective and feasibility criterion. Classical simulated annealing and path-integral simulated quantum annealing produce feasible near-optimal solutions in all repetitions, with best objectives close to the exact optimum. In contrast, the tested D-Wave Leap Hybrid BQM workflow is less reliable and does not outperform the classical baselines under 15--60~s requested time limits. Direct D-Wave QPU execution on reduced instances remains feasible in all runs and recovers the exact optimum for H=10 and H=12, but the exact-hit rate drops from 5/10 to 2/10 and then to 0/10 at H=14, with substantially higher variance than the classical baselines. The results do not indicate quantum advantage, but provide a reproducible, physically decoded benchmark that exposes the current strengths and limitations of classical, hybrid, and direct quantum annealing workflows on structured control QUBOs.", "url": "https://arxiv.org/abs/2605.27670", "type": "理论+数值", "summary": "1. 该工作对退火优化流程在温室启发二次无约束二元优化控制问题（加热器调度，视界H=24）上进行了基准测试，所有输出经物理解码后在原始模拟器中评估。\n2. 其核心在于通过解码与物理目标及可行性标准对比，发现经典模拟退火和路径积分模拟量子退火在全体重复中稳定产生近优解，而D-Wave Leap混合工作流及直接QPU在15–60秒时限内未超越经典基线，且精确命中率在H=14时降至零。\n3. 这一可重复的物理解码基准未表明量子优势，但揭示了当前量子退火工作流在结构化控制QUBO上的可靠性与方差短板，为未来公平比较和算法改进提供了明确参照。", "summary_source": "deepseek", "authors": [{"name": "Hamzeh Alavirad"}, {"name": "Maryam Bahrami Zanjani"}], "featured_authors": [{"name": "Hamzeh Alavirad"}, {"name": "Maryam Bahrami Zanjani"}], "author_count": 2}, {"id": "2605.27723", "category": "quant-ph", "title": "Memory-assisted squeezed light velocimetry under realistic loss and incoherent noise", "abstract": "We propose a velocity sensor based on a two-memory Mach--Zehnder interferometer fed by a coherent probe and squeezed vacuum, read out by balanced homodyne detection. One memory is taken as a stationary reference, while the second memory moves during storage, so that its velocity is mapped onto a differential interferometric phase at readout. The two memories are otherwise assumed identical and are described by a Gaussian write--store--read lifetime together with the associated unconditional noise floor. Using the classical Fisher information, we derive the velocity sensitivity, the transmission threshold required for a target quantum gain, and the optimum storage time. The squeezed scheme improves on equal-resource coherent homodyne within an operating window set mainly by total transmission and phase stability. For representative near-term parameters, unconditional memory noise floors up to about $10^{-1}$ photons per trial do not by themselves remove the advantage; after optimization the improvement remains at the few-percent level and is limited chiefly by loss.", "url": "https://arxiv.org/abs/2605.27723", "type": "数值", "summary": "1. 该工作提出基于两个相同高斯存储器的马赫-曾德尔干涉仪速度传感器，采用相干探针与压缩真空输入及平衡零拍探测，将运动存储器的速度编码为差分相位。\n2. 核心卖点是用经典Fisher信息解析推导了在有限存储寿命与无条件噪声底下的速度灵敏度、传输阈值及最优存储时间，明确了量子增益的工作窗口由总传输和相位稳定性决定。\n3. 此分析指出在近实验参数下即使无条件噪声高达0.1光子/试，优化后压缩方案仍可提供约百分之几的精度提升，且该优势主要受限于系统总损耗，为实验优化指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Mustafa Gündoğan"}, {"name": "Arash Ahmadi"}, {"name": "Markus Krutzik"}], "featured_authors": [{"name": "Mustafa Gündoğan"}, {"name": "Arash Ahmadi"}, {"name": "Markus Krutzik"}], "author_count": 3}, {"id": "2605.27841", "category": "quant-ph", "title": "Coherent Dark State Formation of a Lead-Vacancy Spin Qubit in Diamond", "abstract": "A lead-vacancy (PbV) center in diamond exhibits coherent emission above the liquid helium temperature, making it highly attractive for quantum network applications. Here, we report the magneto-optical and spin properties of PbV centers in diamond. We record a spin lifetime of 12 ms at 7.5 K under large off-axis magnetic field. Furthermore, we observe formation of the coherent dark state by coherent population trapping and estimate a spin dephasing time of 354 ns at 6.5 K. This work demonstrates the outstanding thermal robustness of the PbV spin compared to other group-IV centers above 4 K.", "url": "https://arxiv.org/abs/2605.27841", "type": "理论", "summary": "1. 该工作报道了金刚石中铅空位色心在7.5 K下12 ms的自旋寿命，并通过相干布居捕获观测到354 ns的自旋退相时间。\n2. 其核心在于揭示了铅空位色心在液氦温度以上仍保持优异自旋相干性与形成相干暗态的能力，优于其他IV族色心。\n3. 这为基于金刚石色心的高温量子网络节点（如量子中继器或存储器）提供了鲁棒且可扩展的实现途径。", "summary_source": "deepseek", "authors": [{"name": "Yiyang Chen"}, {"name": "Koyo Hirai"}, {"name": "Tzyy Zheng Neo"}, {"name": "Eiki Ota"}, {"name": "Takashi Taniguchi"}, {"name": "Masashi Miyakawa"}, {"name": "Shinobu Onoda"}, {"name": "Toshiharu Makino"}, {"name": "Mutsuko Hatano"}, {"name": "Takayuki Iwasaki"}], "featured_authors": [{"name": "Yiyang Chen"}, {"name": "Koyo Hirai"}, {"name": "Tzyy Zheng Neo"}, {"name": "Toshiharu Makino"}, {"name": "Mutsuko Hatano"}, {"name": "Takayuki Iwasaki"}], "author_count": 10}, {"id": "2605.28049", "category": "quant-ph", "title": "Automated Unitary Coupled Cluster Circuit Design via Differentiable Quantum Architecture Search", "abstract": "Designing compact and accurate circuits for the variational quantum eigensolver (VQE) is a central challenge in near-term quantum chemistry. Existing adaptive methods such as ADAPT-VQE design circuits by iteratively selecting operators from a predefined pool guided by gradient information and greedy heuristics. In this work, we adopt differentiable quantum architecture search (DQAS) as a circuit design framework based on the UCCSD operator pool, and introduce two complementary strategies: a global mode that simultaneously optimizes all operator selections, and a layerwise mode that constructs circuits incrementally while preserving previously learned structure. By relaxing discrete operator selection into a continuous differentiable optimization, DQAS enables gradient-based exploration over the combinatorial space of UCC circuit architectures. Benchmarks on BeH2, H4, LiH, H6, and H2O (8-14 qubits) show that both strategies achieve higher accuracy and fewer CNOT gates than ADAPT-VQE in the compact circuit regime, with up to 2.7-fold accuracy improvement for H2O and CNOT reductions of 13-17% at equivalent circuit depths. Benchmarks on the qubit-excitation-based (QEB) operator pool confirm that both advantages generalize beyond UCCSD. These results demonstrate that differentiable architecture search provides an effective and generalizable framework for designing accurate and compact VQE circuits in near-term quantum chemistry.", "url": "https://arxiv.org/abs/2605.28049", "type": "数值", "summary": "1. 该工作采用可微量子架构搜索（DQAS）对酉耦合簇算子池进行连续松弛优化，为变分量子本征求解器设计紧凑电路。\n2. 其技术核心在于通过全局与逐层两种模式将离散算子选择转化为可微优化，在8–14量子比特分子基准上实现相比ADAPT-VQE最高2.7倍精度提升及13–17%的CNOT门数缩减。\n3. 这为近量子化学中高效且可泛化的电路结构自动设计提供了梯度驱动框架的明确启发。", "summary_source": "deepseek", "authors": [{"name": "Jianpeng Chen"}, {"name": "Zirui Sheng"}, {"name": "Cunxi Gong"}, {"name": "Weitang Li"}], "featured_authors": [{"name": "Jianpeng Chen"}, {"name": "Zirui Sheng"}, {"name": "Cunxi Gong"}, {"name": "Weitang Li"}], "author_count": 4}, {"id": "2605.28055", "category": "quant-ph", "title": "Cavity-Induced Suppression of Entanglement and Enhancement of Quantum Discord", "abstract": "We study correlations between two Unruh-DeWitt detectors coupled to a scalar field in a cylindrical cavity. Boundary conditions strongly modify the detector-correlation dynamics relative to free space. The entanglement negativity is suppressed in the cavity and vanishes for smaller separation as compared to the free space. Increasing the cavity radius does not recover the free-space behavior of the negativity. In contrast, mutual information and quantum discord remain nonzero over much larger separations. While the mutual information decays monotonically with separation, the quantum discord is enhanced near the cavity boundary. Our results demonstrate that geometric confinement can selectively suppress distillable entanglement while preserving and even enhancing more general non-classical correlations, providing a controlled setting to probe the hierarchy of correlations in quantum field theory.", "url": "https://arxiv.org/abs/2605.28055", "type": "理论", "summary": "1. 该工作研究了圆柱形腔中两个Unruh-DeWitt探测器与标量场耦合时的关联动力学，重点分析了纠缠负性和量子失谐随探测器间距的变化。\n2. 核心发现是腔边界条件相对于自由空间显著抑制了可蒸馏纠缠，却使量子失谐在边界附近增强，且增大腔径无法恢复自由空间的纠缠行为。\n3. 这揭示了几何约束能选择性地压制纠缠而保留乃至强化更广义的非经典关联，为在量子场论中受控探测关联层次提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Shagun Kaushal"}, {"name": "Harkirat Singh Sahota"}], "featured_authors": [{"name": "Shagun Kaushal"}, {"name": "Harkirat Singh Sahota"}], "author_count": 2}, {"id": "2605.28085", "category": "quant-ph", "title": "Environment-Enhanced Single-Photon Absorption in a Nano-Ring of Dipole-Coupled Quantum Emitters", "abstract": "Decoherence is mostly detrimental in quantum information and quantum optics applications. However, the interplay between environment-induced incoherent dynamics and unitary evolution can give rise to novel quantum many-body phenomena that can be harnessed as a useful resource. As is well known, in dense subwavelength atomic arrays only a single collective eigenmode in the single-excitation manifold couples strongly to free-space radiation, exhibiting superradiant spontaneous emission. Most of the remaining eigenstates form a manifold of weakly radiative modes, giving rise to long-lived subradiant excitations. Here we demonstrate that populating these subradiant modes via additional decoherence mechanisms, such as dephasing or coupling to phonons, can significantly enhance single-photon absorption in a nanoring of quantum emitters. Such nanoring geometry is particularly appealing due to its unique optical properties and its resemblance to natural light-harvesting complexes, which serve as efficient antennas in photosynthesis. Our findings may shed light on fundamental aspects of energy absorption in nature; despite the much greater complexity of biological systems, they may nonetheless operate according to similar underlying optical principles.", "url": "https://arxiv.org/abs/2605.28085", "type": "理论", "summary": "1. 本文展示了在偶极耦合量子发射体纳米环中，通过退相干机制（退相位或声子耦合）填充亚辐射模式，可显著增强单光子吸收。\n2. 其核心物理在于利用纳米环几何中退相干与亚辐射本征模式的耦合，将环境诱导的非相干动力学转化为吸收率的提升资源。\n3. 该发现揭示了自然界光合作用光捕获复合物中能量吸收可能遵循的类似光学原理，为理解生物系统能量输运提供了基础启发。", "summary_source": "deepseek", "authors": [{"name": "Eric Sánchez-Llorente"}, {"name": "Helmut Ritsch"}, {"name": "Maria Moreno-Cardoner"}], "featured_authors": [{"name": "Eric Sánchez-Llorente"}, {"name": "Helmut Ritsch"}, {"name": "Maria Moreno-Cardoner"}], "author_count": 3}, {"id": "2605.28135", "category": "quant-ph", "title": "A Demonstration of Quantum Circuit Implementation for Obstacle Flow Using Carleman-Linearized Lattice Boltzmann Method", "abstract": "Fluid simulations, especially at high Reynolds numbers, are computationally expensive on classical computers, making them promising application targets for quantum computing. Recent studies have combined the lattice Boltzmann method (LBM) with Carleman linearization to design quantum algorithms for computational fluid dynamics (CFD). However, practical quantum-circuit implementations of these algorithms that incorporate non-periodic boundary conditions have not been fully explored. In this work, we implement a quantum algorithm for two-dimensional linearized fluid flow around an obstacle, using block-encoding of the linear-system matrix and quantum singular value transformation (QSVT) to solve it. Inflow, outflow, and no-slip boundary conditions are formulated as sparse matrix operations and efficiently embedded into quantum circuits using index-value encoding. We demonstrate logarithmic scaling of the required numbers of qubits and gates with respect to the number of lattice points, suggesting the potential feasibility of quantum-computational fluid dynamics simulations.", "url": "https://arxiv.org/abs/2605.28135", "type": "理论+数值", "summary": "1. 该工作实现了基于Carleman线性化格子玻尔兹曼法的障碍物绕流量子电路，涵盖入流、出流及无滑移边界条件。\n2. 技术亮点在于采用块编码和量子奇异值变换求解线性系统矩阵，并通过索引值编码将非周期性边界条件高效嵌入量子线路。\n3. 所需量子比特和逻辑门数目随格点数对数标度，为高雷诺数流体动力学问题的量子模拟提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Kazumasa Ueno"}, {"name": "Keita Kanno"}, {"name": "Yasunori Lee"}], "featured_authors": [{"name": "Kazumasa Ueno"}, {"name": "Keita Kanno"}, {"name": "Yasunori Lee"}], "author_count": 3}, {"id": "2605.28152", "category": "quant-ph", "title": "Non-Hermitian Computers Need No Complex Numbers", "abstract": "In traditional quantum computing, it has been established that real quantum computation augmented with non-Clifford gates is as powerful as universal quantum computation. Here we investigate this phenomenon in the non-Hermitian setting. We show that a non-Hermitian quantum computer equipped with the real gate set ${H, \\text{CCNOT}, G}$, where $G = \\operatorname{diag}(g^{-1}, g)$ with $g > 0$ and $g \\neq 1$, can solve problems in $\\text{P}^{\\sharp\\text{P}}$ in polynomial time, matching the capability of its universal non-Hermitian counterpart ${H, T, \\text{CNOT}, G}$. This demonstrates that non-unitarity, rather than universality, is the essential resource, and that complex numbers are unnecessary.", "url": "https://arxiv.org/abs/2605.28152", "type": "理论", "summary": "1. 该工作证明了实门集{H, CCNOT, G}的非厄米量子计算机可在多项式时间内解决#P完全问题，能力与通用非厄米量子计算机等价。\n2. 其核心揭示非幺正性而非普适性才是量子计算优势的本质资源，且复数量子比特并非必需。\n3. 这为基于真实物理系统中非厄米性实现量子优势提供了理论依据，并引导重新审视量子计算资源的基本构成。", "summary_source": "deepseek", "authors": [{"name": "Qi Zhang"}], "featured_authors": [{"name": "Qi Zhang"}], "author_count": 1}, {"id": "2605.28162", "category": "quant-ph", "title": "Learning Logical Operations for Arbitrary Quantum Error Correction Codes", "abstract": "Logical operations are essential for quantum computation within quantum error-correcting codes. However, discovering their physical realizations is challenging, especially for non-additive codes that lack a stabilizer description. We present a general learning-based framework that, given only an encoding circuit, constructs physical implementations of logical operations while enforcing structural properties such as transversality or shallow depth. Our approach is validated by rediscovering known logical operations of standard stabilizer codes. We then extend it to a co-design procedure, dubbed variational early fault-tolerant quantum computing (VarEFTQC), which tailors non-additive encodings to a given noise model and enforces desired logical gate sets, such as transversal IQP-type families or low-depth universal sets. A software library implements the complete learning pipeline, including loss-function variants, ansatz families, and optimization routines. Together, these results position VarEFTQC as a practical tool for discovering hardware-adapted logical gadgets for early fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2605.28162", "type": "理论+数值", "summary": "1. 该工作提出一个基于学习的通用框架，仅凭编码电路即可构造任意量子纠错码的逻辑运算物理实现。\n2. 其技术卖点在于能强制横向性或浅层深度等结构性质，并扩展为协同设计过程VarEFTQC，针对噪声模型定制非可加编码及所需逻辑门集。\n3. 这为发现硬件适配的逻辑器件提供了实用工具，适用于早期容错量子计算。", "summary_source": "deepseek", "authors": [{"name": "Nico Meyer"}, {"name": "Christopher Mutschler"}, {"name": "Dominik Seuß"}, {"name": "Andreas Maier"}, {"name": "Daniel D. Scherer"}], "featured_authors": [{"name": "Nico Meyer"}, {"name": "Christopher Mutschler"}, {"name": "Dominik Seuß"}, {"name": "Andreas Maier"}, {"name": "Daniel D. Scherer"}], "author_count": 5}, {"id": "2605.28351", "category": "quant-ph", "title": "Quantum geometry of connected state manifolds: When diabolic points act as bridges between eigenstate manifolds", "abstract": "Parametric Hamiltonians often exhibit point-like spectral degeneracies (diabolic points, or conical intersections), which can lead to singularities in the Provost-Vallee metric of eigenstate manifolds. We regularise the metric by a coordinate transformation and develop a formalism in which diabolic points act as bridges between adjacent eigenstate manifolds, glueing them into a single connected state manifold. We characterise the topology of this structure and refine the rules for nodal lines governing the Berry phase. The connected state manifold restores the numerical stability near diabolic points, enlarges the class of geodesics allowing for new geodesic shortcuts, and provides a new mechanism for Berry phase computation, even along paths traversing diabolic points.", "url": "https://arxiv.org/abs/2605.28351", "type": "理论+数值", "summary": "1. 该工作通过坐标变换正则化本征态流形的Provost-Vallee度量，将diabolic点视为相邻流形间的桥梁，并粘合为单一连通流形。\n2. 其技术卖点在于揭示diabolic点的拓扑连接器角色，恢复数值稳定性、允许测地线捷径并支持跨奇点路径的Berry相位计算。\n3. 这为参数演化中的几何效应与拓扑量子计算中的绝热过程提供了统一的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Jan Střeleček"}, {"name": "Jakub Novotný"}, {"name": "Pavel Cejnar"}], "featured_authors": [{"name": "Jan Střeleček"}, {"name": "Jakub Novotný"}, {"name": "Pavel Cejnar"}], "author_count": 3}, {"id": "2605.28404", "category": "quant-ph", "title": "On the existence of fully inseparable biseparable Gaussian states", "abstract": "Genuine multipartite entanglement and full inseparability are two inequivalent quantum resources. Even though all genuinely multipartite entangled states are also fully inseparable, not all fully inseparable states are genuinely multipartite entangled. There exist fully inseparable states that can be prepared as convex mixtures of states separable with respect to different bipartite splits. Here, we are interested in examples of Gaussian states that possess this type of entanglement, so-called fully inseparable biseparable states. We show for several archetypical families of multimode Gaussian states that fully inseparable biseparable candidate states are actually genuinely multipartite entangled. Using projections to finite-dimensional subspaces and fully decomposable witnesses, we observe a shrinking of the regions of potentially fully inseparable biseparable Gaussian states with growing dimension of the projection subspaces. We therefore conjecture that all fully inseparable Gaussian states are genuinely multipartite entangled.", "url": "https://arxiv.org/abs/2605.28404", "type": "理论", "summary": "1. 本工作深入探讨了多模高斯态中全不可分双可分态的存在性，针对若干典型族（包括对称与团簇构型）逐一检验，发现所有候选态实则满足真正多体纠缠。\n2. 其技术亮点在于利用有限维子空间投影与全可分解纠缠见证的组合策略，系统展示了候选参数区域随投影维度升高而逐步收缩并消失的定量趋势。\n3. 由此提出的所有全不可分高斯态均为真正多体纠缠态的强猜想，为连续变量纠缠分类与资源理论提供了更严谨的结构约束，有望推动实验探测与理论建模。", "summary_source": "deepseek", "authors": [{"name": "Olga Leskovjanová"}, {"name": "Klára Baksová"}, {"name": "Jan Provazník"}, {"name": "Ladislav Mišta Jr."}, {"name": "Nicolai Friis"}], "featured_authors": [{"name": "Olga Leskovjanová"}, {"name": "Klára Baksová"}, {"name": "Jan Provazník"}, {"name": "Ladislav Mišta Jr."}, {"name": "Nicolai Friis"}], "author_count": 5}, {"id": "2605.28489", "category": "quant-ph", "title": "Faster matrix product state preparation by exploiting symmetry-induced block-sparsity", "abstract": "Matrix product states (MPS) serve as a key tool for studying quantum systems from chemistry and condensed-matter physics, making their preparation on quantum computers an important task in interfacing classical and quantum simulation. Many systems of interest have $U(1)$-symmetries induced by particle number and spin projection conservation, allowing to restrict the MPS tensors to be of block-sparse form, a property widely used in the implementation of classical algorithms such as the density matrix renormalization group. We reduce the cost of fault-tolerantly preparing block-sparse MPS within the standard ancilla-assisted linear-depth approach by implementing row and column permutations that transform the block-sparse matrices into block-diagonal form. These block-diagonal unitaries are then implemented via unitary synthesis, with the cost being determined by the size of the largest block. In this context, we modify the unitary synthesis approach of Berry et al. in order to reduce the Toffoli cost for real-valued unitaries by a factor of $\\sqrt{2}$. In numerical benchmarks, we achieve Toffoli cost improvement factors of $10 - 30$ compared to the state-of-the-art for MPS of various molecular systems.", "url": "https://arxiv.org/abs/2605.28489", "type": "理论+数值", "summary": "1. 该工作利用U(1)对称性诱导的块稀疏性，通过行和列置换将块稀疏矩阵转为块对角形式，加速容错量子计算机上矩阵乘积态的制备。\n2. 其技术卖点在于修改Berry等人的酉合成方法，使实值酉算符的Toffoli成本降低√2倍，且总成本由最大块大小决定。\n3. 数值基准测试表明，对于多种分子系统的矩阵乘积态，该方法实现Toffoli成本改进因子达10-30，为大规模量子化学模拟提供了明确的资源优化路径。", "summary_source": "deepseek", "authors": [{"name": "Felix Rupprecht"}, {"name": "Sabine Wölk"}], "featured_authors": [{"name": "Felix Rupprecht"}, {"name": "Sabine Wölk"}], "author_count": 2}, {"id": "2605.28586", "category": "quant-ph", "title": "Stabilizer rank bounds for magic-state orbits", "abstract": "Distinct Clifford orbits of magic states can exhibit different stabilizer ranks at small tensor powers. We establish this for qutrits, where the single-qutrit Clifford group has four inequivalent orbits of magic states: Strange, Norrell, Hadamard-eigenstate, and the qutrit T-state, but a nontrivial upper bound on the asymptotic exponent had been pinned down for only the qutrit T-state. For the other three orbits we give explicit stabilizer decompositions, yielding upper bounds on the per-copy asymptotic stabilizer-rank exponent: $\\gamma_S \\le \\log_3(2)/2 \\approx 0.316$ for the Strange state, and $\\gamma_{H_3}, \\gamma_N \\le \\log_3(4)/3 \\approx 0.421$ for the Hadamard-eigenstate and Norrell orbits, all strictly below the prior $\\gamma_{T_3} \\le 1/2$ baseline. We also prove the first nontrivial $\\Omega(m / \\log m)$ asymptotic lower bounds for the Hadamard-eigenstate and Norrell orbits, and exhibit two-qutrit Clifford circuits that convert two copies of these states into an injectable phase state with constant success probability, enabling constant-overhead injection of one non-Clifford diagonal gate per orbit. In the case of qubits, we give a closed-form decomposition of the qubit T-type orbit at four copies matching the existing $\\gamma_T \\le \\log_2(3)/4 \\approx 0.396$ exponent via a direct algebraic identity rather than an entangled cat-state construction. An open-source library stabrank accompanies the paper, with Lean 4 proof formalizations of all the decompositions.", "url": "https://arxiv.org/abs/2605.28586", "type": "理论", "summary": "1. 该工作为qutrit四个Clifford轨道建立了稳定子秩的上下界，给出Strange、Norrell和Hadamard-本征态轨道渐近指数上界分别低至0.316和0.421。\n2. 技术核心是构造显式稳定子分解与两qutrit Clifford电路，以常概率将两副本转化为可注入相位态，实现常开销注入非Clifford对角门。\n3. 这细化了magic态蒸馏的资源边界，为qubit系统通过代数恒等式优化稳定子秩提供范例，且开源库与Lean形式化证明保证分解严谨性。", "summary_source": "deepseek", "authors": [{"name": "Farrokh Labib"}, {"name": "Vincent Russo"}], "featured_authors": [{"name": "Farrokh Labib"}, {"name": "Vincent Russo"}], "author_count": 2}, {"id": "2605.28754", "category": "quant-ph", "title": "Quantum Geometric Limits for Non-Abelian Holonomies", "abstract": "Stokes' theorem turns Abelian Berry phases into curvature fluxes, whereas path ordering precludes such a simple formula for non-Abelian holonomies. We show that a quantitative form of this intuition survives: arbitrary Wilczek--Zee holonomies obey a universal quantum geometric limit~(QGL), in which the holonomy magnitude is bounded by a surface integral of the non-Abelian curvature norm. Recasting holonomic evolution as an effective Stokes--Schrödinger dynamics driven by transported curvature, we identify the QGL as the geometric counterpart of conventional quantum speed limits, with a time-integrated generator norm replaced by a surface-integrated curvature cost. The induced contour--surface variational problem is governed by a non-Abelian Lorentz force, which we address with a brachistochrone ansatz of curvature-weighted geodesics. Applied to an SU(2) tripod dark subspace, near-optimal protocols spontaneously align the transported curvature along a single Lie-algebra direction, effectively taming non-Abelianity.", "url": "https://arxiv.org/abs/2605.28754", "type": "理论+数值", "summary": "1. 该工作证明了任意非阿贝尔和乐服从一个普适量子几何极限，其幅值被曲率范数的面积分所界。\n2. 核心在于将和乐演化映射为有效Stokes-Schrödinger动力学，以面积分曲率代价替代时间积分生成子范数，识别出该极限为几何版本量子速度极限，并用曲率加权测地线速降线本征非阿贝尔洛伦兹力。\n3. 这为利用局域曲率约束设计近优非阿贝尔几何门提供了定量框架，特别是在SU(2)三脚架暗空间中得到自发曲率对齐的验证。", "summary_source": "deepseek", "authors": [{"name": "François Impens"}, {"name": "David Guéry-Odelin"}], "featured_authors": [{"name": "François Impens"}, {"name": "David Guéry-Odelin"}], "author_count": 2}, {"id": "2605.28795", "category": "quant-ph", "title": "Dynamic Entanglement Packet Scheduling for Quantum Networks", "abstract": "Sharing entanglement among multiple users remains a central challenge for scalable quantum networks. Recent work proposed an on-demand entanglement packet architecture in which a controller uses a Time Division Multiple Access (TDMA) approach to allocate network resources. Quantum nodes are assigned a periodic schedule that probabilistically fulfills application requests for end-to-end entanglements. The schedule is recomputed periodically using well-known algorithms, such as Earliest Deadline First (EDF). However, a static schedule offers limited flexibility when outcomes are stochastic and arrivals are asynchronous. To overcome this limitation, we propose an online scheduler that dynamically schedules, defers, retries, or drops entanglement distribution reservations. In our simulations, the dynamic scheduler achieves lower completion time, higher completion ratio, and higher throughput than the static baseline. Furthermore, when the network is overloaded, the dynamic scheduler continues to construct deadline-feasible schedules and degrades gracefully.", "url": "https://arxiv.org/abs/2605.28795", "type": "理论+数值", "summary": "1. 该工作为量子网络提出一种动态纠缠包调度框架，控制器在线调度、延迟、重试或丢弃端到端纠缠分布请求以适配随机结果与异步到达。\n2. 其核心在于以在线决策替代静态时分多址（TDMA）调度，仿真表明动态调度在完成时间、完成率和吞吐量上均优于静态基线，并在过载时仍能构建截止时间可行的调度且性能平滑降级。\n3. 这为多用户量子网络的资源分配提供了实用策略，并启发将在线调度方法推广至更大规模网络及异质量子节点的协同场景。", "summary_source": "deepseek", "authors": [{"name": "Quang-Phong Tran"}, {"name": "Claudio Cicconetti"}, {"name": "Marco Conti"}, {"name": "Andrea Passarella"}], "featured_authors": [{"name": "Quang-Phong Tran"}, {"name": "Claudio Cicconetti"}, {"name": "Marco Conti"}, {"name": "Andrea Passarella"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
