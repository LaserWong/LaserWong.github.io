  <title>arXiv 2026-05-28 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2605.27453", "category": "cond-mat", "title": "Dirac-Line Criticality and Emergent Horizons in Weyl Lifshitz Transitions", "abstract": "Type-II Weyl fermions may emerge behind the event horizon of black holes. We employ the Painlevé-Gullstrand metric to study the surface of the Lifshitz transition at the horizon, equivalent to the interface separating the type-I and type-II Weyl states. We find several analogies between the black hole horizon and the transformation of type-I to type-II Weyl fermions through the Dirac line. We analyze the symmetry-protected topological order at the Lifshitz transition originating in semimetals. The emergence of Hawking radiation in Weyl semimetals is discussed. We show that the transition state from type-I to type-II Dirac fermions can be viewed as a black-hole horizon, which exhibits unique characteristics, including a Dirac-line Fermi surface with a nontrivial topological invariant and a critical chiral anomaly effect.", "url": "https://arxiv.org/abs/2605.27453", "type": "理论", "summary": "1. 该工作通过Painlevé-Gullstrand度量研究Weyl半金属中Lifshitz转变界面，建立了类型I到类型II Weyl费米子转变与黑洞视界的类比。\n2. 其卖点在于揭示转变临界态呈现狄拉克线费米面、非平庸拓扑不变量及关键手征反常效应，且该临界态等效于黑洞视界。\n3. 这为在凝聚态系统中实现类黑洞霍金辐射的模拟提供了明确路径，并启发了对拓扑相变中涌现奇异点的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Iftekher S. Chowdhury"}, {"name": "Hom Nath Dhungana"}, {"name": "Shah Haque"}, {"name": "Hind Adawi"}, {"name": "Eric Howard"}], "featured_authors": [{"name": "Iftekher S. Chowdhury"}, {"name": "Hom Nath Dhungana"}, {"name": "Shah Haque"}, {"name": "Hind Adawi"}, {"name": "Eric Howard"}], "author_count": 5}, {"id": "2605.27524", "category": "cond-mat", "title": "Emergence of an antiferromagnetic topological Anderson insulator in the interacting Haldane model", "abstract": "We examine the emergence of topological Anderson insulating phases in the spinful Haldane model with Hubbard and next-neighbor density-density interactions, subject to Anderson disorder. Using finite-size exact diagonalization, we characterize the phases that arise from the interplay between topology, interactions, and disorder. In addition to standard $C=2$ topological Anderson phases, we observe an antiferromagnetic $C=1$ topological Anderson phase, consistent with the antiferromagnetic quantum anomalous Hall insulator previously identified in the clean model at finite staggered mass. We further analyze these phases using a neural network trained on the exact diagonalization data. Our results support the hypothesis that an explicit charge imbalance is required to induce the $C=1$ phase, generated by Anderson disorder rather than by a staggered mass.", "url": "https://arxiv.org/abs/2605.27524", "type": "理论+数值", "summary": "1. 该工作利用有限尺寸精确对角化，研究了含Hubbard及次近邻相互作用的自旋Haldane模型中拓扑、关联与Anderson无序的耦合，揭示了反铁磁拓扑Anderson绝缘体的涌现。\n2. 其核心发现是除常规C=2拓扑Anderson相外，出现与清洁系统中反铁磁量子反常霍尔绝缘体对应的C=1相，该相由Anderson无序诱导的显式电荷不平衡驱动，而非交错质量。\n3. 这为无序诱导自旋对称性破缺与拓扑相变关联提供了具体机制，启发在关联无序系统中探索类似拓扑相的实验实现。", "summary_source": "deepseek", "authors": [{"name": "Alejandro J. Uría-Álvarez"}, {"name": "Roser Valentí"}], "featured_authors": [{"name": "Alejandro J. Uría-Álvarez"}, {"name": "Roser Valentí"}], "author_count": 2}, {"id": "2605.27608", "category": "cond-mat", "title": "Zero modes of non-abelian Dirac operator in topologically non-trivial band insulator", "abstract": "We show that the local gauge-invariance of the quantum geometric tensor (QGT) defined in the Block-momentum space of a generic $N$-level (sublattice degrees of freedom) band insulator implies the existence of zero modes of non-abelian Dirac operator in such momentum space. Solutions of these zero modes equations in the two-dimensional Brillouin zone torus, in terms of Jacobi Theta function determine the probability amplitudes associated with the $N$-component ground state wave-function under adiabatic approximation in this Hilbert space. These solutions subjected to normalization, defines a complex projective ($CP$) space of $N-1$ dimension ($CP^{N-1}$ space) when one or more degeneracy points exist in the dispersion spectrum of such band-isulator. We show how the non-abelian generalization of the vortexability criterion of Chern bands automatically follows from these zero-mode equations, and also demonstrate their connection with momentum space-version of Lowest landau level algebra. Subsequently we write an Euclidean action from which these zero mode equations follow. We point out that the non-interacting part of different paradigms used to understand fractional Chern insulator(FCI) like phases in a host of two-dimensional material can be understood within this approach. We analyse two effective hamiltonian : lattice Dirac (QZW) model and two-band model for rhombohedral $N$-layer graphene in our propsoed framework and obtain important conclusions.", "url": "https://arxiv.org/abs/2605.27608", "type": "理论", "summary": "1. 该工作证明，N子带绝缘体布洛赫动量空间中量子几何张量的局域规范不变性蕴含非阿贝尔Dirac算子的零模存在性。\n2. 零模解由二维布里渊区环面上的Jacobi Theta函数给出，定义出CP^{N-1}空间，并自然导出Chern带非阿贝尔涡旋判据及动量空间最低朗道能级代数。\n3. 所建立的欧几里得作用量框架可统一理解分数量子Chern绝缘体相的非相互作用部分，并为菱方N层石墨烯等模型的分析提供明确路径。", "summary_source": "deepseek", "authors": [{"name": "Neha Kumari"}, {"name": "Sankalpa Ghosh"}], "featured_authors": [{"name": "Neha Kumari"}, {"name": "Sankalpa Ghosh"}], "author_count": 2}, {"id": "2605.27635", "category": "cond-mat", "title": "A method for calculating entropy production without knowing transition rates or dwell times", "abstract": "The entropy production rate is central to the study of non-equilibrium systems. This parameter is closely connected to violation of time-reversal symmetry, energy consumption, efficiency, and other properties of interest; in short, it quantifies how far a system is from thermodynamic equilibrium. Standard formulas for the entropy production require knowledge of the system's underlying dynamics, but this knowledge may be hard to acquire in practice. Here, I present a method for inferring the entropy production rate of a Markovian system from the sequence of states that the system occupies on a single long trajectory or many shorter trajectories, and the total time of the trajectory or trajectories. The method does not require knowledge of the dwell times in the various states, the times at which transitions occur, or of the transition rates characterizing the Markov process.", "url": "https://arxiv.org/abs/2605.27635", "type": "理论", "summary": "1. 该工作提出一种从马尔可夫系统单条或若干条状态序列推断熵产生率的方法，无需依赖转移速率或停留时间信息。\n2. 其核心创新在于仅利用态序列与总时长即可量化时间反演对称性破缺程度，规避了对底层动力学的直接测量需求。\n3. 这为实验上难以获得微观转移率的非平衡系统（如生物过程或介观器件）提供了可行的熵产生率度量方案。", "summary_source": "deepseek", "authors": [{"name": "John W. Biddle"}], "featured_authors": [{"name": "John W. Biddle"}], "author_count": 1}, {"id": "2605.27657", "category": "cond-mat", "title": "A supersymmetric study of charge and spin transport in Weyl semimetals under axionic electrodynamic response", "abstract": "We investigate the charge and spin transport properties of a Weyl semimetal under an external magnetic field using a low-energy effective theory. By performing a chiral transformation, we remove the axial term from the fermionic Lagrangian, while its physical effects are retained through the system's electromagnetic response. This response, derived from integrating out the fermionic degrees of freedom, takes the form of axionic electrodynamics and enters the Dirac equation via minimal coupling. The resulting dynamics separate naturally into magnetic and electric components: the magnetic sector admits a supersymmetric factorization, while the electric part exhibits a PT-supersymmetric structure. Robin boundary conditions are applied to the spinor, setting the energy spectrum and defining exact spinor solutions. We obtain the chiral projections of probability and current densities, exhibiting a chiral imbalance in the material. We show that in the x-direction, only one chirality contributes to the chiral current ($j^x_l = 0$). Spin density and currents where also computed. Our results demonstrate how the interplay between axionic response and supersymmetry governs transport phenomena in our specific setup, offering novel insights into the effective field theory description of Weyl semimetals.", "url": "https://arxiv.org/abs/2605.27657", "type": "理论+数值", "summary": "1. 该工作基于低能有效理论，通过手征变换将Weyl半金属中轴子项转化为电磁响应，研究了外磁场下电荷与自旋的输运性质并得到手征概率密度、电流密度及自旋密度分布。\n2. 其技术核心在于揭示磁场部分具有超对称可分解结构、电场部分呈现PT-超对称性，并应用Robin边界条件获得精确旋量本征解和能量谱，发现x方向手征电流仅由单一手征贡献且体系呈现手征不平衡。\n3. 这展示了轴子电动力学与超对称性协同调控输运的机制，为理解Weyl半金属中有效场论与手征异常现象提供了新的理论视角与可检验预言。", "summary_source": "deepseek", "authors": [{"name": "J. C. Pérez-Pedraza"}, {"name": "A. Martín-Ruiz"}, {"name": "L. F. Urrutia"}], "featured_authors": [{"name": "J. C. Pérez-Pedraza"}, {"name": "A. Martín-Ruiz"}, {"name": "L. F. Urrutia"}], "author_count": 3}, {"id": "2605.27672", "category": "cond-mat", "title": "Spontaneous breaking of non-invertible symmetries and duality to beyond-Landau transitions", "abstract": "Spontaneous symmetry breaking is a well-understood mechanism for generating distinct phases of matter. Recently, the notion of symmetry has been broadened to include operations without inverses, leading to the concept of non-invertible symmetries. How do symmetry-breaking phases associated with non-invertible symmetries differ from those arising from conventional invertible symmetries? We address this question using concrete lattice models of the gapped phases with non-invertible Rep($H_8$) symmetry as an example. We find that, despite the symmetry being non-invertible, the symmetry-breaking phases can still be characterized by the long-range correlation of local order parameters, which obey a more general algebraic structure than in the invertible setting. Furthermore, via generalized gauging, certain non-invertible symmetry-breaking transitions can be mapped to deconfined quantum critical points of invertible symmetries, and vice versa. We establish precise conditions under which this duality holds and illustrate them with several families of examples, providing a systematic route to studying beyond-Landau phase transitions.", "url": "https://arxiv.org/abs/2605.27672", "type": "理论", "summary": "1. 该工作以具非可逆Rep(H₈)对称性的能隙晶格模型为例，研究了非可逆对称性自发破缺相及其与常规可逆对称性破缺的本质差异。\n2. 其核心发现是破缺相仍可由局域序参量的长程关联刻画，但代数结构更普适，且通过广义规范变换可将特定非可逆对称性破缺转变精确对偶为可逆对称性的去禁闭量子临界点。\n3. 这为系统构建超越朗道范式的相变分类、并借助可逆对称性临界点研究非可逆对称性破缺相变提供了可操作的路径与条件。", "summary_source": "deepseek", "authors": [{"name": "Xie Chen"}, {"name": "Shang Liu"}, {"name": "Da-chuan Lu"}, {"name": "Nathanan Tantivasadakarn"}], "featured_authors": [{"name": "Xie Chen"}, {"name": "Shang Liu"}, {"name": "Da-chuan Lu"}, {"name": "Nathanan Tantivasadakarn"}], "author_count": 4}, {"id": "2605.27679", "category": "cond-mat", "title": "On the Equivariant Learning of the $Q$-tensor Order Parameter", "abstract": "We construct and evaluate group-equivariant neural networks for the prediction of the two-dimensional $Q$-tensor order parameter of nematic liquid crystals from synthetically generated microscopic textures. Seven architectures, equivariant to cyclic groups $C_k$ of order $k$ for $k=4,\\,8,\\,16,\\,32,\\,64,\\,128,\\, 256$, are built using a combination of weight-sharing constraints, equivariant activations and regularization techniques. To do this, we construct rotation-like permutation matrix groups with elements $\\varrho_{C_k}(g)$ that act on row-wise vectorized images, thereby approximating a $\\frac{2\\pi}{k}$ rotation of the circular subdomain on square images. We show that all seven equivariant models satisfy the $Q$-tensor equivariance constraint to within single-precision floating point accuracy. Comparing against approximate parameter-matched non-equivariant benchmarks, with and without data augmentation, we find that the equivariant models consistently achieve lower errors and generalize more robustly to unseen defect configurations. Performance increases with group order, suggesting that the incorporation of finer rotational symmetry leads to lower errors.", "url": "https://arxiv.org/abs/2605.27679", "type": "理论+数值", "summary": "1. 该工作构建并评估了针对循环群C_k（k=4至256）等变的神经网络，用于从合成微观纹理预测二维向列液晶的Q张量序参数。\n2. 其技术核心在于构造旋转类置换矩阵群作用于行向量化图像以近似连续旋转对称性，所有模型均满足Q张量等变性至单精度浮点精度，且性能随群阶提高而提升。\n3. 这为借助离散等变网络学习具有连续对称性的物理序参量提供了可推广框架，尤其适用于缺陷构型等复杂场景的泛化预测。", "summary_source": "deepseek", "authors": [{"name": "Julia Navarro"}, {"name": "Mark Wilkinson"}], "featured_authors": [{"name": "Julia Navarro"}, {"name": "Mark Wilkinson"}], "author_count": 2}, {"id": "2605.27812", "category": "cond-mat", "title": "Chirality in Structural Phase Transitions", "abstract": "Chirality, defined by the absence of mirror and inversion symmetries, has attracted considerable attention owing to its unique physical phenomena, including cross-correlated responses such as current-induced magnetization (CIM) and chiral phonons. Recently, it has been established that chirality is characterized by electric toroidal (ET) multipoles: the ET monopole $G_0$ in cubic systems and the ET quadrupole $G_u$ in noncubic systems. In this paper, we investigate achiral-to-chiral (AtC) structural phase transitions driven by atomic displacements and construct $G_{0,u}$ as explicit functions of the displacement order parameter $\\eta$ based on a group-theoretical approach. We show that the leading-order dependence of $G_{0,u}(\\eta)$ is determined by the symmetry of the parent structure and the character of the displacive mode, providing a symmetry-based classification of AtC transitions beyond a binary distinction between achiral and chiral phases. We also demonstrate that $G_{0,u}(\\eta)$ is directly reflected in observable quantities such as CIM and CPS, both of which scale consistently with $G_{0,u}(\\eta)$. We further clarify the microscopic mechanism by which AtC transitions give rise to chiral phonons and chiral phonon splitting (CPS) through the coupling between $G_{0,u}(\\eta)$ and phonon degrees of freedom.", "url": "https://arxiv.org/abs/2605.27812", "type": "理论", "summary": "1. 本文基于群论方法，将电环形多极子显式构建为原子位移序参量的函数，系统研究了非手性到手性结构相变的对称性分类。\n2. 其核心在于揭示了电环形多极子对序参量的主导依赖关系由母体对称性和位移模性质决定，从而提供了超越二元区分的相变分类方案。\n3. 该工作明确了电环形多极子与手性声子产生及劈裂的微观耦合机制，并指出电流诱导磁化与手性声子劈裂等响应量均与此多极子标度一致，为实验观测提供了直接依据。", "summary_source": "deepseek", "authors": [{"name": "Keita Matsubara"}, {"name": "Kazumasa Hattori"}], "featured_authors": [{"name": "Keita Matsubara"}, {"name": "Kazumasa Hattori"}], "author_count": 2}, {"id": "2605.27826", "category": "cond-mat", "title": "Quantum anomalous Hall effect in chiral semimetals", "abstract": "The quantum anomalous Hall (QAH) effect is conventionally understood to exist only in Chern insulators, while a recent study has shown that ferromagnetic metals can also host the QAH effect. Between insulators and metals, we demonstrate that QAH can persist even in a chiral semimetal, where conduction and valence bands touch at zero energy. Transport calculations demonstrate that the Hall conductivity of such a system can be quantized in the presence of dephasing. Interestingly, its longitudinal conductivity remains finite and exhibits semimetallic behavior, in contrast to Chern insulators. This unusual transport behavior originates from the quantization of the Berry curvature integral over occupied states and the semimetallic band structure. This chiral semimetal can transition into a Chern insulator, accompanied by the vanishing of longitudinal conductivity and a reduction of the intrinsic length scale of the Hall response. Our results extend the concept of QAH and uncover the semimetallic QAH transport signatures.", "url": "https://arxiv.org/abs/2605.27826", "type": "数值", "summary": "1. 该工作证明了手性半金属中可存在量子反常霍尔效应，其导带与价带在零能处接触，体系介于绝缘体与金属之间。\n2. 物理卖点在于退相干下霍尔电导呈量子化，而纵向电导保持有限并呈半金属行为，源于贝里曲率积分量子化与半金属能带的共存。\n3. 这一发现扩展了量子反常霍尔效应的范畴，为在拓扑半金属中探索量子化输运及相变提供了新方向。", "summary_source": "deepseek", "authors": [{"name": "Peng-Yi Liu"}, {"name": "Yu-Hao Wan"}, {"name": "Qing-Feng Sun"}], "featured_authors": [{"name": "Peng-Yi Liu"}, {"name": "Yu-Hao Wan"}, {"name": "Qing-Feng Sun"}], "author_count": 3}, {"id": "2605.27863", "category": "cond-mat", "title": "Dark-Soliton Branch Blocking in Transonic Bose--Einstein Condensate Flows", "abstract": "Acoustic horizons in Bose--Einstein condensates are usually characterized through long-wavelength Bogoliubov phonons. We study a nonlinear counterpart: whether a one-dimensional dark-soliton branch can sustain upstream laboratory motion in a stationary transonic flow. The mechanism is local at leading order. A regular dark soliton has a bounded fluid-frame velocity, limited by the local sound speed; therefore, in the supersonic region, the background flow exceeds the largest upstream velocity available to the soliton branch. The sonic point is thus the upstream edge of the local dark-soliton branch, rather than a hard wall or a soliton geodesic surface. We construct stationary transonic Gross--Pitaevskii backgrounds and evolve the full order parameter in an open, nonperiodic domain. The simulations show upstream propagation on the subsonic side, finite-depth stalling on the subsonic side, and downstream advection for defects initialized in the supersonic region with upstream velocity relative to the fluid. Convergence, branch-consistency, local-density, phase-jump, and a dense scan of dimensionless upstream attempts support the soliton-like interpretation. The result is a branch-existence constraint, not a rigorous lower bound on arbitrary density minima of the Gross--Pitaevskii field.", "url": "https://arxiv.org/abs/2605.27863", "type": "理论+数值", "summary": "1. 该工作研究跨声速玻色-爱因斯坦凝聚流中暗孤子分支的上游运动机制，通过数值模拟与解析分析揭示其物理行为。\n2. 主要卖点在于发现暗孤子有界流体帧速度受局部声速限制，导致超声区背景流超过孤子分支最大上游速度，从而产生分支阻塞效应。\n3. 这为跨声速非线性激发提供了分支存在约束而非刚性边界的新视角，启发探索其他色散流体中的类似动力学限制。", "summary_source": "deepseek", "authors": [{"name": "Edilberto O. Silva"}], "featured_authors": [{"name": "Edilberto O. Silva"}], "author_count": 1}, {"id": "2605.27925", "category": "cond-mat", "title": "Finite-size occupancy scaling of apparent fractal dimensions in stochastic trajectories", "abstract": "Estimating a fractal dimension from a finite stochastic trajectory is a finite-size scaling problem: the apparent box-counting exponent is shaped by an occupancy crossover between the resolved range of scales and the finite number of sampled points, and need not equal the dimension of the limiting process. We model this crossover with a balls-in-boxes occupancy law, which predicts the box-count curve, the finite-size saturation scale, and a scaling function for the normalized local slope. Across random-walk traces, fractional Brownian graphs, and Levy flights, the normalized local slope collapses onto a single crossover curve, while the windowed box-counting bias collapses when the regression window is positioned relative to the saturation scale. Inverting the occupancy model gives a finite-size bias correction that reduces error on controlled stochastic trajectories and transfers across held-out model classes. Comparisons with correlation dimension, detrended fluctuation analysis, the variogram, and Higuchi's method show that the dominant bias is specific to point-sampled box-counting over finite scale windows, and that local-slope stability alone is not a reliable diagnostic. A DNA-walk example illustrates the workflow on measured data, and all figures, tables, and in-text numbers are regenerated from released single-seed code.", "url": "https://arxiv.org/abs/2605.27925", "type": "理论+数值", "summary": "1. 该工作研究了有限随机轨迹中表观分形维数的有限尺寸标度问题，通过球入盒占据律解释盒计数曲线与归一化局部斜率的交叉行为。\n2. 其技术卖点在于将占据模型反演得到有限尺寸偏差校正，使得随机游走、分数布朗运动和列维飞行的归一化局部斜率塌缩为单一交叉曲线。\n3. 这为从实测DNA步等有限采样轨迹中可靠估计分形维数提供了跨模型可迁移的偏差校正方法，并指出局部斜率稳定性并非可靠诊断。", "summary_source": "deepseek", "authors": [{"name": "Bon A. Koo"}, {"name": "Edward Ju"}], "featured_authors": [{"name": "Bon A. Koo"}, {"name": "Edward Ju"}], "author_count": 2}, {"id": "2605.27979", "category": "cond-mat", "title": "Direction-selective intertwined charge, orbital, and lattice orders under uniaxial strain in hole-doped manganite: La0.75Ca0.25MnO3", "abstract": "The complex interplay of charge, spin, orbital, and lattice degrees of freedom governs emergent phases in quantum materials, making strain a powerful control parameter. Recent advances in free-standing layer techniques have enabled extreme strains of nearly 8%, opening access to novel and often unexpected electronic and magnetic phases. Here, using a density functional theory approach, we investigate the effect of direction-selective uniaxial strain on the prototypical Jahn-Teller system La1-xCaxMnO3 (x = 0.25). We find that different strain directions stabilize qualitatively distinct structural, charge, and orbital responses, rather than merely different strengths of the same phase. In particular, extreme uniaxial strain selectively induces cooperative Jahn-Teller, breathing-like, and site-selective modulations, thereby enabling previously inaccessible intertwined orders in manganites. These results establish direction-selective uniaxial strain as a powerful and selective route for engineering emergent phases in quantum materials.", "url": "https://arxiv.org/abs/2605.27979", "type": "理论+数值", "summary": "1. 该工作利用密度泛函理论研究了方向选择性单轴应变对空穴掺杂锰氧化物La0.75Ca0.25MnO3中电荷、轨道与晶格交织序的影响。\n2. 其核心发现是极端单轴应变可定向诱导合作Jahn-Teller、呼吸型和位点选择性调制，而非仅改变同一相的强度，从而稳定性质截然不同的交织序。\n3. 这为通过方向选择性单轴应变作为工程量子材料中涌现相的有力调控手段提供了理论基础与明确路径。", "summary_source": "deepseek", "authors": [{"name": "Ju Hyeon Lee"}, {"name": "Beom Hyun Kim"}, {"name": "Bongjae Kim"}], "featured_authors": [{"name": "Ju Hyeon Lee"}, {"name": "Beom Hyun Kim"}, {"name": "Bongjae Kim"}], "author_count": 3}, {"id": "2605.27983", "category": "cond-mat", "title": "Effect of Vacancies on Hydrogen Mobility and Trapping in Elemental Fe and Cr: A DFT and kMC Study", "abstract": "Hydrogen-vacancy interactions play an important role in governing hydrogen transport and embrittlement in body-centered cubic (BCC) metals. In this study, a multiscale approach combining density functional theory (DFT) and kinetic Monte Carlo (kMC) simulations is employed to investigate hydrogen behavior in BCC Fe and Cr. The DFT-calculated binding energies and Bader charge analysis indicate stronger hydrogen trapping in Cr than in Fe. Migration and detrapping energy barriers are determined using the climbing-image nudged elastic band method, showing that the detrapping energy generally decreases with increasing hydrogen occupancy. However, the sixth hydrogen atom in Fe exhibits a finite barrier, contrary to some previous reports. kMC simulations are then used to evaluate hydrogen diffusion over extended time and length scales. The results demonstrate that vacancy defects significantly reduce hydrogen mobility and increase the effective activation energy, with a more pronounced effect observed in Cr due to stronger trapping. The combined DFT-kMC framework provides detailed insight into the mechanisms of hydrogen trapping, detrapping, and diffusion in BCC metals, offering important implications for understanding hydrogen embrittlement in structural materials.", "url": "https://arxiv.org/abs/2605.27983", "type": "理论+数值", "summary": "1. 该工作采用DFT与kMC多尺度方法，系统研究了体心立方Fe和Cr中空位对氢原子迁移、捕获与脱陷行为的影响。\n2. 其技术亮点在于结合Bader电荷分析和爬坡弹性带方法，揭示了Cr中更强的氢捕获能，并发现脱陷势垒随氢占据数增加而降低，但Fe中第六个氢原子仍存在有限势垒，进而通过kMC模拟量化了空位导致的扩散系数降低和有效活化能升高。\n3. 该综合框架为从原子尺度理解结构材料中氢致脆化机制提供了关键迁移参数和动力学信息，对耐氢脆合金设计具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Vallinathan K"}, {"name": "Gurpreet Kaur"}, {"name": "Sharat Chandra"}], "featured_authors": [{"name": "Vallinathan K"}, {"name": "Gurpreet Kaur"}, {"name": "Sharat Chandra"}], "author_count": 3}, {"id": "2605.28090", "category": "cond-mat", "title": "Hall effect in multi-leg bosonic ladders", "abstract": "We use bosonization to analyze the ground state Hall response of interacting bosonic N-leg ladders threaded by a flux. We derive an explicit expression of the Hall imbalance in a perturbative expansion in the band curvature, retaining fully the interactions. For small magnetic field the Hall resistance is proportional to the derivative of the logarithm of the charge stiffness with respect to density, generalizing the result obtained in the two leg case. We also consider the effect of temperature, and establish that at low temperature, corrections to the Hall resistance are exponentially small in the Meissner phase.", "url": "https://arxiv.org/abs/2605.28090", "type": "理论", "summary": "1. 该工作利用玻色化方法分析了通量作用下相互作用玻色N腿梯子的基态霍尔响应。\n2. 在能带曲率微扰展开中导出了霍尔不平衡的显式表达式，完全保留了相互作用效应，并推广了双腿情况的结果。\n3. 小磁场下霍尔电阻正比于电荷刚性对密度的对数导数，且迈斯纳相中低温修正呈指数小，为多腿玻色梯子霍尔效应提供了精确解析框架。", "summary_source": "deepseek", "authors": [{"name": "Edmond Orignac"}, {"name": "Roberta Citro"}, {"name": "Thierry Giamarchi"}], "featured_authors": [{"name": "Edmond Orignac"}, {"name": "Roberta Citro"}, {"name": "Thierry Giamarchi"}], "author_count": 3}, {"id": "2605.28196", "category": "cond-mat", "title": "Barrier crossing in a two-state system: Effect of bias and stochastic fields", "abstract": "We study barrier crossing in a two-state system, namely the kinetic Ising model, in the presence of a weak bias field and spatially homogeneous, but time-dependent, Gaussian random fields. We find that the bias field determines the location of the dominant maxima of the probability distribution function of the magnetization, whereas the noise intensity controls their sharpness and stability of the distribution. A moderate stochastic field lowers the effective energy barrier and facilitates transitions between ordered states, while strong noise induces broad distributions and significant backflow, which reduces directional selectivity. Our results suggest that efficient barrier crossing requires a balanced combination of moderate stochastic driving and controlled bias.", "url": "https://arxiv.org/abs/2605.28196", "type": "理论+数值", "summary": "1. 本工作以动力学Ising模型为研究对象，系统考察了弱偏置场与均匀时变高斯随机场对两态系统势垒穿越的影响。\n2. 主要技术亮点在于揭示了偏置场确定磁化概率分布主峰位置，噪声强度调控分布尖锐度与稳定性；适中的随机场可降低有效势垒并促进有序态间跃迁，而强噪声则导致分布展宽和显著回流，从而降低方向选择性。\n3. 这一发现表明，高效势垒穿越需要在随机驱动强度与偏置控制之间找到平衡，为理解噪声辅助跃迁机制及优化两态系统定向转换提供了重要启发。", "summary_source": "deepseek", "authors": [{"name": "Sara Oliver-Bonafoux"}, {"name": "Raúl Toral"}, {"name": "Amitabha Chakrabarti"}], "featured_authors": [{"name": "Sara Oliver-Bonafoux"}, {"name": "Raúl Toral"}, {"name": "Amitabha Chakrabarti"}], "author_count": 3}, {"id": "2605.28221", "category": "cond-mat", "title": "Three-component superconductivity: the effect of second-order Josephson couplings", "abstract": "Recently, a three-component Ginzburg-Landau (GL) model compatible with the 3Q pair-density-wave state has been proposed to explain the fractional quantum magnetic resistance oscillations of period $\\phi_0/3 = hc/6e$ observed in vanadium-based kagome superconductors. The physics of this model is governed by second-order Josephson-type couplings, which break both time-reversal symmetry and discrete $\\pi$-phase flip symmetry. In this work, we theoretically derive the complete set of ground-state solutions and construct a comprehensive phase diagram in the GL parameter space, characterized by analytically determined phase boundaries. We identify five distinct ground states: an 8-fold degenerate frustrated state and four 4-fold degenerate non-frustrated phase-locked states. Four of these states spontaneously break time-reversal symmetry. Numerical analysis of the collective modes reveals the emergence of a Higgs-Leggett mode unique to the frustrated region, accompanied by mode softening near the phase boundaries. Our findings provide a comprehensive theoretical framework for understanding the multifaceted physics of multicomponent superconductivity.", "url": "https://arxiv.org/abs/2605.28221", "type": "理论+数值", "summary": "1. 该工作理论推导了三组分Ginzburg-Landau模型中二阶Josephson耦合的完整基态解集，并构建了由解析相边界刻画的全面相图。\n2. 其物理卖点在于发现了一个8重简并受阻态与四个4重简并非受阻锁相态，其中四种态自发破缺时间反演对称，且受阻区域出现独特的Higgs-Leggett集体模式。\n3. 这为解析kagome超导体中分数磁通量子振荡等多组分超导现象提供了综合理论框架，并启发后续集体模软化和对称性破缺的实验探测。", "summary_source": "deepseek", "authors": [{"name": "Shen-Yi Peng"}, {"name": "Ling-Feng Zhang"}, {"name": "Xiao Hu"}], "featured_authors": [{"name": "Shen-Yi Peng"}, {"name": "Ling-Feng Zhang"}, {"name": "Xiao Hu"}], "author_count": 3}, {"id": "2605.28249", "category": "cond-mat", "title": "Zero-Field Thermal Hall Effect in Insulator", "abstract": "Fourier's law dictates that heat flow is usually parallel to the applied temperature gradient. However, under a high magnetic field, heat flow carried by both electrons in conductors and phonons in insulators can be deflected, a phenomenon known as thermal Hall effect. Intriguingly, we observe at zero field a spontaneous thermal Hall effect in an antiferromagnetic insulator. Despite a vanishingly small uncompensated magnetization, the magnitude of this effect is surprisingly large, comparable to typical responses induced by several teslas of external field. This zero-field behavior indicates that charge-neutral heat carriers can be governed by an intrinsic effective field arising from the unique spin arrangement. Our discovery challenges the centuries-old preconception of heat conduction and open up new avenues for exploring non-trivial topological responses in quantum materials.", "url": "https://arxiv.org/abs/2605.28249", "type": "理论", "summary": "1. 本工作在反铁磁绝缘体中观测到零磁场下的自发热霍尔效应。\n2. 尽管净磁化强度可忽略，该效应幅值却与数特斯拉外场下的典型响应相当，表明电荷中性热载流子受自旋构型产生的内禀有效场支配。\n3. 该发现挑战了关于热传导的传统认知，为探索量子材料中的非平庸拓扑响应开启了新方向。", "summary_source": "deepseek", "authors": [{"name": "Zhe Cui"}, {"name": "Haoran Fan"}, {"name": "Wenjiang Zhou"}, {"name": "Xianghong Jin"}, {"name": "Yuchen Gu"}, {"name": "Da Ma"}, {"name": "Cong Xiao"}, {"name": "Hua Jiang"}, {"name": "Xincheng Xie"}, {"name": "Bai Song"}, {"name": "Yuan Li"}, {"name": "Xi Lin"}], "featured_authors": [{"name": "Zhe Cui"}, {"name": "Haoran Fan"}, {"name": "Wenjiang Zhou"}, {"name": "Bai Song"}, {"name": "Yuan Li"}, {"name": "Xi Lin"}], "author_count": 12}, {"id": "2605.28391", "category": "cond-mat", "title": "Global magnetic phase diagram and multiple unconventional magnets in NiAs-type compounds", "abstract": "NiAs-type compounds such as CrSb and MnTe host $g$-wave altermagnet (AM) state. In order to search other possible unconventional magnets in this system, we present a global magnetic phase diagram based on a classical $J_1$-$J_2$-$J_3$ Heisenberg model and density functional theory (DFT) calculations. We find another $g$-wave AM state and two $f$-wave OPMs in the phase diagram. Intriguingly, we show that a mixed-parity of the $f$-wave OPM and $g$-wave AM state can naturally emerge in an umbrella-like noncollinear magnetic structure. Our DFT calculations show that CrSe and CrTe$_{1-x}$Se$_x$ are generally in such mixing state with dominated $f$-wave component. The interlayer next-nearest-neighbor coupling $J_3$ is shown to be crucial in determining the phase diagram and in inducing strong competition between conventional and unconventional magnets. Inspired by this, we demonstrate that AM or OPM could be realized by applying chemical doping or strain to conventional magnets. Our results provide a guidance for design of both even- and odd-parity as well as mixed-parity unconventional magnets in NiAs-type compounds.", "url": "https://arxiv.org/abs/2605.28391", "type": "理论+数值", "summary": "1. 该工作基于经典J1-J2-J3海森伯模型与密度泛函理论计算，给出了NiAs型化合物的全局磁相图，识别出多种非常规磁体。\n2. 其核心在于揭示了层间次近邻耦合J3对相图的关键作用，并发现伞状非共线磁结构中自然涌现的f波奇宇称磁体与g波交变磁体混合宇称态。\n3. 这为通过化学掺杂或应变调控常规磁体来实现交变磁体或奇宇称磁体，进而设计混合宇称非常规磁体提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Shibo Shen"}, {"name": "Yilin Wang"}], "featured_authors": [{"name": "Shibo Shen"}, {"name": "Yilin Wang"}], "author_count": 2}, {"id": "2605.28445", "category": "cond-mat", "title": "The Resetting Heat Engine: A Thermodynamic Cycle of Thermal Expansion and Compression", "abstract": "We consider a Brownian particle confined by an external potential and subject to stochastic resetting to the origin. Motivated by the repetitive nature of the dynamics, we describe the process as a thermodynamic cycle of thermal expansion and collapse, analyzed via a framework based on the Kullback-Leibler (KL) divergence between forward and reversed trajectory ensembles. While the entropy production generally depends on the full trajectory ensemble and cannot be reduced to thermodynamic state variables alone, we show that the harmonic potential constitute a special case, where the entropy production reduces exactly to a state-function-like expression determined solely by the distributions before and after resetting. Explicit analytical results are derived for periodic and Poissonian resetting. At low resetting rates $r$, the entropy production rate grows linearly with $r$ and is proportional to the symmetric KL divergence between the reset and equilibrium distributions. At very high rates, the resetting process becomes effectively perpetual and the entropy production vanishes. Langevin simulations for an anharmonic quartic potential display the same generic behavior, indicating that these features are not restricted to harmonic confinement. Our results establish a direct connection between stochastic resetting, thermodynamic cycles, and information-theoretic measures of irreversibility.", "url": "https://arxiv.org/abs/2605.28445", "type": "理论+数值", "summary": "1. 该工作将受限于外势并随机重置至原点的布朗粒子动力学表述为热膨胀与压缩的热力学循环，并基于前反向轨迹系综间的KL散度框架加以分析。\n2. 其物理卖点在于揭示简谐势下熵产生可精确约化为仅由重置前后分布决定的状态函数型表达式，且低重置率下熵产生率正比于重置与平衡分布间的对称KL散度。\n3. 这一结果建立了随机重置、热力学循环与不可逆性信息论度量之间的直接关联，并表明相关特征可推广至非简谐势，为理解重复性非平衡过程提供统一视角。", "summary_source": "deepseek", "authors": [{"name": "Oded Farago"}], "featured_authors": [{"name": "Oded Farago"}], "author_count": 1}, {"id": "2605.28463", "category": "cond-mat", "title": "Substrate-driven topological engineering in plasmonic Su-Schrieffer-Heeger chains", "abstract": "We demonstrate the possibility of engineering the topological band structure of a plasmonic Su-Schrieffer-Heeger (SSH) chain through the interaction with its electromagnetic environment. We find that the long-range interaction of the in-plane modes of the SSH chain with the surface plasmon polaritons of a planar substrate introduces a band hybridization connected to a change of the Zak phase. On the other hand, the short-range interaction with the substrate introduces a band touching, again with a change in the Zak phase. Surprisingly, this second mechanism enables the emergence of topologically protected edge modes for parameters which correspond to the topologically trivial phase for an isolated plasmonic SSH chain. We study these mechanisms by changing the chain-substrate distance and the dimerization parameter. Finally, we discuss the robustness against disorder and, as one example, the impact of the observed effects on the near-field radiative heat transfer along the chain. Our findings pave the way to the engineering of edge modes in plasmonic topological configurations via the coupling to a plasmonic environment.", "url": "https://arxiv.org/abs/2605.28463", "type": "理论", "summary": "1. 该工作展示了通过电磁环境（基底）调控等离激元Su-Schrieffer-Heeger链拓扑能带结构的可能性。\n2. 其核心在于发现链与基底表面等离激元的长程相互作用引发能带杂化并改变Zak相位，而短程相互作用则导致能带接触并再次改变Zak相位，从而在孤立链的拓扑平庸参数区诱导出拓扑保护边缘模。\n3. 这为通过等离激元环境耦合实现拓扑边缘模的工程化提供了新途径，并对近场辐射热传递等应用具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Florian Herz"}, {"name": "Alireza Naeimi"}, {"name": "Svend-Age Biehs"}], "featured_authors": [{"name": "Florian Herz"}, {"name": "Alireza Naeimi"}, {"name": "Svend-Age Biehs"}], "author_count": 3}, {"id": "2605.28469", "category": "cond-mat", "title": "Wetting of quantum fluids: a route to free-standing shell-shaped quantum droplets", "abstract": "We investigate wetting phenomena between self-bound quantum fluids in a three-component Bose mixture of $^{23}$Na, $^{39}$K, and $^{41}$K atoms. Within a density-functional approach including mean-field interactions and Lee-Huang-Yang quantum-fluctuation corrections, we consider two binary quantum liquids, formed by components $(1,2)$ and $(2,3)$, and study the adsorption of the softer $(1,2)$ liquid on a stiffer $(2,3)$ substrate. By tuning the interspecies scattering length $a_{12}$, we show that the surface tension of the $(1,2)$ liquid can be strongly varied, driving a transition from partial wetting to complete wetting of the $(2,3)$ phase. The contact angle extracted from cylindrical-cap geometries decreases continuously with increasing $a_{12}$ and vanishes near a critical value $a_{12}^{c}= -42\\,a_0$. In the complete-wetting regime, a finite amount of $(1,2)$ liquid wraps around a spherical $(2,3)$ droplet, producing a self-bound core-shell droplet without external confinement, whose component-1 density has a shell-like, hollow projection. We further show that such shell-shaped quantum droplets can sustain quantized vortical excitations. These results identify wetting as a route to engineering free-standing shell-shaped quantum liquids and suggest new possibilities for studying capillarity, topology, and superfluidity in multicomponent quantum droplets.", "url": "https://arxiv.org/abs/2605.28469", "type": "理论", "summary": "1. 本文采用包含量子涨落修正的密度泛函方法，理论研究了钠钾三组分玻色混合体系中两种二元量子液体间的浸润行为。\n2. 通过连续调节软液体种间散射长度，表面张力变化驱动接触角在临界值处降至零，实现从部分浸润到完全浸润的转变，形成自束缚核壳液滴，壳层呈空心密度投影且可承载量子化涡旋。\n3. 该结果将浸润机制确立为构造自由站立壳形量子液滴的新途径，为在多组分量子滴中探索毛细效应、拓扑激发及超流性提供了平台。", "summary_source": "deepseek", "authors": [{"name": "Francesco Ancilotto"}], "featured_authors": [{"name": "Francesco Ancilotto"}], "author_count": 1}, {"id": "2605.28499", "category": "cond-mat", "title": "Electrically driven Rabi dynamics of magnetic-field-induced corner states in a two-dimensional topological insulator", "abstract": "We study coherent electric manipulation of magnetic-field-induced localized states at a double kink of a helical edge in a HgTe/CdHgTe quantum well. An in-plane magnetic field opens a gap in the one-dimensional edge spectrum, while changes in the edge orientation generate localized in-gap states at the kinks. We show that, for suitable geometry and magnetic-field direction, two such states form an effective lithographically defined two-level subsystem. Using an edge-state model that includes both the localized levels and the continuum states outside the magnetic-field-induced gap, we calculate the electric-dipole matrix elements and solve the time-dependent problem under resonant driving. The resulting dynamics exhibits Rabi oscillations with linear frequencies of $20$--$40$~GHz for realistic parameters. We find that the continuum states provide a leakage channel whose strength is strongly controlled by the driving amplitude: reducing the electric field suppresses leakage below the percent level while preserving GHz-scale coherent oscillations. These results establish a route from magnetic-field-induced corner-state physics to electrically driven two-level dynamics in a realistic two-dimensional topological-insulator edge geometry.", "url": "https://arxiv.org/abs/2605.28499", "type": "理论+数值", "summary": "1. 该工作从理论上研究了二维拓扑绝缘体HgTe/CdHgTe量子阱中，面内磁场在螺旋边缘双扭结处诱导的局域态，并实现了电共振驱动的相干拉比动力学。\n2. 技术核心在于通过边缘态模型揭示，连续态泄漏通道的强度可由驱动振幅有效抑制，从而在低泄漏（低于1%）条件下保持20–40 GHz的相干振荡。\n3. 这为利用磁场诱导角态在真实拓扑绝缘体边缘中构建电控二能级量子系统提供了明确方案，并启发了对边缘局域态相干操控的进一步实验探索。", "summary_source": "deepseek", "authors": [{"name": "D. V. Khomitsky"}, {"name": "E. A. Lavrukhina"}, {"name": "D. P. Krasavin"}, {"name": "S. S. Krishtopenko"}, {"name": "F. Teppe"}], "featured_authors": [{"name": "D. V. Khomitsky"}, {"name": "E. A. Lavrukhina"}, {"name": "D. P. Krasavin"}, {"name": "S. S. Krishtopenko"}, {"name": "F. Teppe"}], "author_count": 5}, {"id": "2605.28594", "category": "cond-mat", "title": "Thermodynamic properties of chemically disordered compounds via AI-driven estimation of partition function with the PULSE method", "abstract": "In this article, we present an improved version of the PULSE method (Partition function Unsupervised Learning Sampling and Evaluation) for estimating the thermodynamic properties of chemically disordered compounds. The aim is to reduce the computational cost of Monte Carlo approaches for this type of material and to demonstrate that this generative tool can estimate thermodynamic properties by sampling and estimating the partition function of the system. To validate this innovative approach, we use the 2D Ising model as a benchmark. We demonstrate that our method accurately reproduces average properties with high precision and efficiency compared to traditional Monte Carlo sampling methods. Our results highlight the efficiency and adaptability of the PULSE method, making it a valuable tool for studying materials for which conventional methods are too inefficient to compute properties affected by chemical disorder at low cost.", "url": "https://arxiv.org/abs/2605.28594", "type": "理论+数值", "summary": "1. 该工作提出了PULSE方法的改进版，通过AI驱动采样和配分函数估计，高效计算化学无序化合物的热力学性质。\n2. 其核心卖点在于利用生成式无监督学习替代传统蒙特卡洛采样，以极低计算成本精确重现平均性质。\n3. 这为化学无序材料的热力学研究提供高效工具，尤其适用于传统方法难以处理的高成本计算场景。", "summary_source": "deepseek", "authors": [{"name": "Baptiste Bernard"}, {"name": "Luca Messina"}, {"name": "Eiji Kawasaki"}, {"name": "Emeric Bourasseau"}], "featured_authors": [{"name": "Baptiste Bernard"}, {"name": "Luca Messina"}, {"name": "Eiji Kawasaki"}, {"name": "Emeric Bourasseau"}], "author_count": 4}, {"id": "2605.28688", "category": "cond-mat", "title": "Topological lattice gauge theory enriched by non-invertible symmetry", "abstract": "We use finite group topological lattice gauge theory, also known as the quantum double model, as a lens to explore a notion of topological order enriched by a non-invertible symmetry. For invertible symmetry enriched topological order, there is an established axiomatisation in terms of a G-crossed braided fusion category. We lay the foundations for a generalisation of this notion. By condensing an arbitrary algebra of charges in a quantum double model, we demonstrate that the category of localised excitations in the resulting theory forms a hypergroup-graded extension of the category of deconfined excitations. For every element in the hypergroup, the associated domain wall acts in a typically non-invertible way on these localised excitations. Both this action and the monoidal structure are compatible with the hypergroup grading. The actual categorical action is encoded in a Hopf monad on the category of localised excitations, and gauging the non-invertible symmetry amounts to computing the category of modules over this Hopf monad. Finally, we outline how this framework naturally extends to theories obtained by condensing algebras in a generic string-net model.", "url": "https://arxiv.org/abs/2605.28688", "type": "理论", "summary": "1. 该工作以有限群拓扑格点规范理论（量子双模型）为工具，探索由非可逆对称性丰富的拓扑序。\n2. 通过凝聚任意电荷代数，他们证明局域激发范畴形成超群分次扩展，且畴壁对激发作用通常非可逆，该作用由Hopf monad编码。\n3. 这为将对称性丰富拓扑序与非可逆对称性规范理论推广至一般弦网模型奠定了数学框架。", "summary_source": "deepseek", "authors": [{"name": "Lea E. Bottini"}, {"name": "Clement Delcamp"}, {"name": "Edmund Heng"}, {"name": "Campbell K. McLauchlan"}, {"name": "Dominic J. Williamson"}], "featured_authors": [{"name": "Lea E. Bottini"}, {"name": "Clement Delcamp"}, {"name": "Edmund Heng"}, {"name": "Campbell K. McLauchlan"}, {"name": "Dominic J. Williamson"}], "author_count": 5}, {"id": "2605.28794", "category": "cond-mat", "title": "Non-invertible symmetry enriched string net topological orders", "abstract": "We propose a definition of a non-invertible symmetry enriched topological order (NI-SETO), and we implement our definition for string net models. We do so in two ways, using full inclusions of unitary fusion categories (UFCs), as well as anyon condensation. In both cases, the NI-SETO is a relative center of UFCs. All NI-SETOs can be realized in either model, where we can use enriched UFCs to get chiral examples on the boundary of a 3D Walker-Wang model representing the anomaly. We describe several examples of NI-SETOs and compute the qualitative symmetry action on anyons and symmetry defects using tube algebra techniques.", "url": "https://arxiv.org/abs/2605.28794", "type": "理论", "summary": "1. 该工作定义了非可逆对称性富集拓扑序，并在弦网模型中通过融合范畴的完全包含与任意子凝聚两种方式实现。\n2. 核心在于揭示非可逆对称性富集拓扑序是融合范畴的相对中心，并利用富集范畴构造出对应三维Walker-Wang模型边界反常的手征示例。\n3. 这为非可逆对称性下拓扑序的分类、任意子及对称缺陷上对称性作用的刻画提供了明确的理论框架与计算工具。", "summary_source": "deepseek", "authors": [{"name": "Luisa Eck"}, {"name": "Peter Huston"}, {"name": "Kyle Kawagoe"}, {"name": "David Penneys"}], "featured_authors": [{"name": "Luisa Eck"}, {"name": "Peter Huston"}, {"name": "Kyle Kawagoe"}, {"name": "David Penneys"}], "author_count": 4}, {"id": "2605.27505", "category": "hep-th", "title": "On the Validity of the Effective Theory of (Multi-)Field Inflation", "abstract": "Motivated by trans-Planckian issues in inflation, we determine the Hilbert space and amplitudes of quantum perturbations in the general low-energy effective theory of (multi-)field inflation without relying on the sub-horizon limit. The scalar sector is the most intricate, featuring field mixings and second-class constraints, which we handle using Dirac brackets. These results enable us to estimate the magnitude of higher-derivative corrections. In the specific case of slow-roll inflation, such estimate can be expressed in terms of the first slow-roll parameter $\\epsilon$ for a given cutoff $\\Lambda$. We apply our results to several inflationary models with finite $\\Lambda$: Higgs inflation, the Starobinsky model, natural inflation and hilltop inflation.", "url": "https://arxiv.org/abs/2605.27505", "type": "理论", "summary": "1. 该工作建立了不依赖亚视界极限的（多场）暴涨有效理论中量子微扰的希尔伯特空间与振幅。\n2. 其技术核心在于用Dirac括号处理标量扇区的场混合与二级约束，从而基于慢滚参数ε和截止Λ估计高阶导数修正的大小。\n3. 这为在跨普朗克问题下定量评估暴涨模型的有效性提供了判据，并已应用于希格斯暴涨、Starobinsky模型等实例。", "summary_source": "deepseek", "authors": [{"name": "Andrea Ambrosi de Magistris"}, {"name": "Alberto Salvio"}], "featured_authors": [{"name": "Andrea Ambrosi de Magistris"}, {"name": "Alberto Salvio"}], "author_count": 2}, {"id": "2605.27512", "category": "hep-th", "title": "Many-Body Quantum Chaos At All Time Scales", "abstract": "We describe the dynamics of many-body quantum chaotic systems at all time scales by studying the Green's and out-of-time order correlation (OTOC) functions of the four-body, $N$-Majorana Sachdev-Ye-Kitaev model. By combining the scramblon formalism and random-matrix-theory techniques, we obtain analytical expressions for these functions at all times. The early exponential growth of the OTOC is followed by an exponential decay at a rate governed by that of the Green's function (the real part of the leading complex Ruelle-Pollicott resonances). For late times that scale exponentially with $N$, both functions have a dip-ramp-plateau pattern for $N \\mathrm{mod}8 = 2, 6$ that deviates substantially from the ergodic prediction due to local-in-energy correlations of matrix elements and eigenvalues, even after the Heisenberg time.", "url": "https://arxiv.org/abs/2605.27512", "type": "理论", "summary": "1. 该工作通过研究四体N-Majorana Sachdev-Ye-Kitaev模型的Green函数与out-of-time order相关函数，解析描述了所有时间尺度下的多体量子混沌动力学。\n2. 结合scramblon形式与随机矩阵理论，获得了OTOC早期指数增长后以Green函数衰变率（主导复杂Ruelle-Pollicott共振实部）指数衰减的完整解析表达式，并在N mod 8 = 2,6时观测到Heisenberg时间后仍偏离遍历预测的dip-ramp-plateau结构。\n3. 这为解析刻画多体量子混沌的完整时间演化、以及理解能级与矩阵元局域关联导致的对遍历性偏离提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Antonio M. García-García"}, {"name": "Lucas Sá"}, {"name": "Jacobus J. M. Verbaarschot"}, {"name": "Jie-Ping Zheng"}], "featured_authors": [{"name": "Antonio M. García-García"}, {"name": "Lucas Sá"}, {"name": "Jacobus J. M. Verbaarschot"}, {"name": "Jie-Ping Zheng"}], "author_count": 4}, {"id": "2605.27568", "category": "hep-th", "title": "Solitonic Construction of Artificial Neural Networks from Nonlinear Field Theory", "abstract": "We present a field-theoretic construction of a class of artificial neural networks from solitonic degrees of freedom in nonlinear scalar field theory. The purpose is not to rename a standard neural layer in the language of solitons, but to start from a continuum action, restrict the theory to a nonperturbative sector containing localized stable solutions, perform a collective-coordinate reduction, and derive the neural layer as the finite-dimensional input-output map of the reduced solitonic dynamics. In this construction, the computational unit is a projected collective coordinate of a localized field configuration rather than an elementary point variable; the activation function is the solitonic response profile or scattering map; the weight matrix is the Hessian or overlap matrix of an effective interaction energy among solitons; the bias is induced by external sources, vacuum asymmetry, or boundary forcing; and depth is a discrete evolution parameter on the solitonic moduli space. We develop the construction explicitly for the \\(\\phi^4\\) kink, where the \\(\\tanh\\) activation and the logistic sigmoid arise from the kink profile, and then derive the multilayer feedforward form from an operator-splitting approximation to collective-coordinate gradient flow. We emphasize the novelty criterion: the neural architecture is obtained only after specifying the field action, the solitonic ansatz, the moduli-space metric, the interaction functional, and the projection map. The result is a controlled route from nonlinear field theory to neural-network structure, with robustness tied to the energetic and topological stability of the solitonic sector.", "url": "https://arxiv.org/abs/2605.27568", "type": "理论", "summary": "1. 该工作从非线性标量场论的孤子自由度出发，通过集体坐标约化将局域稳定解的动力学映射为人工神经网络层的输入-输出映射。\n2. 其核心在于展示激活函数源于孤子响应轮廓或散射映射，权重矩阵为孤子间有效相互作用的Hessian矩阵，网络深度为模空间上的离散演化参数。\n3. 这一构造为理解神经网络架构与拓扑稳定场论结构之间的内在联系提供了受控路径，暗示鲁棒性源于孤子扇区的拓扑稳定性。", "summary_source": "deepseek", "authors": [{"name": "R. A. C. Correa"}], "featured_authors": [{"name": "R. A. C. Correa"}], "author_count": 1}, {"id": "2605.27641", "category": "hep-th", "title": "Robin holography in AdS and BTZ: double-trace RG flow and exceptional points", "abstract": "We construct the exact Robin bulk-to-boundary propagator for a Breitenlöhner--Freedman scalar on AdS$_{d+1}$ and the BTZ black hole, realizing the double-trace RG flow between standard and alternate quantization geometrically as a one-parameter family of bulk boundary conditions. We derive the UV and IR chain expansions of the kernel intrinsically from the boundary-value problem, without an auxiliary-field decoupling, and identify a branch split at each order that separates the local data the boundary CFT observes from finite-bulk-depth structure visible only to bulk probes -- the part of $K_f$ that distinguishes holographic reconstruction from boundary calculation. On BTZ we obtain the closed-form Robin kernel and the corresponding family of quasinormal-mode trajectories, each connecting an alternate-quantization pole at $g=0$ to a standard one at $g\\to\\infty$. We locate an exceptional-point locus along this family at which two trajectories coalesce into a Jordan block, and show it acts as a non-Hermitian phase boundary for the double-trace flow itself: crossing it reorganizes the global pole-pairing topology of the spectrum. Unlike holographic EPs reached by analytic continuation in momentum or frequency, this transition lives on the interpolation between quantizations and is reachable at finite real momentum and temperature by tuning the physical Robin coupling.", "url": "https://arxiv.org/abs/2605.27641", "type": "理论", "summary": "1. 该工作构造了AdS_{d+1}与BTZ黑洞上Breitenlöhner–Freeman标量场的精确Robin bulk-to-boundary传播子，以单参数族边界条件几何实现了标准与交替量子化之间的双迹RG流。\n2. 卖点在于从边值问题中推导出紫外与红外级数展开，发现局域CFT数据与有限bulk深度结构在各阶的分支分裂，并在BTZ上得到闭合Robin核及准正规模轨迹族，定位了轨迹合并为Jordan块的例外点。\n3. 该例外点构成双迹流本身的非厄米相边界，有别于动量或频率解析延拓所得全息EP，可在有限实动量与温度下通过调谐物理Robin耦合达到，为全息重构与边界计算差异及量子化间拓扑相变提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Yiru Wang"}, {"name": "Juanyi Yang"}], "featured_authors": [{"name": "Yiru Wang"}, {"name": "Juanyi Yang"}], "author_count": 2}, {"id": "2605.27754", "category": "hep-th", "title": "Twistor approach to classical and quantum D0-brane", "abstract": "We develop the (super)twistor approach to D$0$-brane, which is the massive type IIA superparticle in ten dimensional spacetime. The basic variables are haxadecuplet of constrained $OSp(32|1)$ supertwistors similar but not identical to the ones which have been used for the description of 11D massless superparticle, also known as M$0$-brane. We show how the constrained supertwistor formulation is related to the spinor moving frame approach to D$0$-brane. We perform the quantization of the model by two different methods and discuss the relation of the results with the quantization of the spinor moving frame formulation of D$0$-brane. The quantum state spectrum describes the massive counterpart of the linearized type IIA supergravity.", "url": "https://arxiv.org/abs/2605.27754", "type": "理论", "summary": "1. 该工作发展了十维有质量IIA型超粒子（D0-膜）的约束OSp(32|1)超扭量十六重态表述。\n2. 其要点在于建立了约束超扭量与自旋移动框架的对应，并通过两种量子化方法获得了线性化IIA超引力的有质量谱。\n3. 这为统一处理D0-膜及其他超粒子的经典与量子理论提供了扭量框架，可望推广至更高维超引力与弦论模型。", "summary_source": "deepseek", "authors": [{"name": "Igor Bandos"}, {"name": "Mirian Tsulaia"}], "featured_authors": [{"name": "Igor Bandos"}, {"name": "Mirian Tsulaia"}], "author_count": 2}, {"id": "2605.27770", "category": "hep-th", "title": "Sampling Triangulations and Calabi-Yau Threefolds with Autoregressive GNNs", "abstract": "We introduce `dualGNN', an autoregressive message-passing GNN for sampling fine, regular triangulations (FRTs) of convex polytopes. dualGNN operates on a generalization of the dual graph of a triangulation, with edges labeled by `signed circuits' -- combinatorial invariants from oriented matroid theory which we show are both necessary and sufficient for exposing regularity. The model is independent of the number of points in the polytope and invariant under the polytope's orientation-preserving symmetries ($\\mathrm{SL}(d,\\mathbb{Z}) \\ltimes \\mathbb{Z}^d$). When implemented with a certain masking procedure, one can also guarantee that every rollout produces a fine triangulation (in $2$D). On unseen polygons with $N_\\mathrm{pts} \\leq 40$, dualGNN is the most uniform FRT sampler we tested, and even a model trained on a single polygon generalizes well to other polygons. The model is small ($\\sim92$k parameters), trains in $\\sim7.5$ hours on a single consumer GPU, and runs without modification on an M1 MacBook Pro. We apply dualGNN to string theory, uniformly sampling Calabi-Yau threefolds at $h^{1,1}=86$ and consistent with uniformity at $h^{1,1}=128$. This is an order of magnitude beyond previous learned methods with a model $\\sim1000\\times$ smaller. Code, training scripts, and pretrained models are available at this https URL .", "url": "https://arxiv.org/abs/2605.27770", "type": "理论", "summary": "1. 该工作提出dualGNN，一种自回归消息传递图神经网络，用于采样凸多面体的细正则三角剖分，并应用于弦论中Calabi-Yau三维流形的均匀采样。\n2. 其核心是利用定向拟阵中的有向环标记对偶图边以刻画正则性，模型与点数无关且保持对称性，极小参数量（92k）即可在含多边形的未见数据集上实现最均匀采样并泛化。\n3. 该方法将可学习的Calabi-Yau三角剖分采样扩展到h^1,1=128，较此前方法提升一个量级而模型小三个量级，为高维组合几何与弦论数据生成提供高效方案。", "summary_source": "deepseek", "authors": [{"name": "Nate MacFadden"}], "featured_authors": [{"name": "Nate MacFadden"}], "author_count": 1}, {"id": "2605.27870", "category": "hep-th", "title": "Revisiting boundary electromagnetic duality and edge modes", "abstract": "We revisit electric and magnetic surface charges and edge modes in four-dimensional Maxwell theory and QED on a spacetime with a finite spatial boundary. Using the S-wall, which implements electromagnetic duality, we clarify the dual structure of surface charges. We show that, for the standard Neumann and Dirichlet boundary conditions, large gauge transformations and the corresponding shifts of edge modes are gauge redundancies rather than physical boundary symmetries. We also consider singular large gauge transformations and interpret them as insertions of Wilson or 't Hooft loops on the boundary. For modified boundary conditions, we show that large gauge transformations can become genuine physical boundary symmetries generated by topological surface operators, and that the corresponding edge modes can become physical. We further construct new boundary conditions that are electromagnetic duals of the modified boundary conditions.", "url": "https://arxiv.org/abs/2605.27870", "type": "理论", "summary": "1. 该工作重新审视了四维麦克斯韦理论与QED在有限空间边界上的电磁对偶性及边缘模问题。\n2. 卖点在于借助S-wall实现电磁对偶，揭示标准边界条件下大规范变换和边缘模位移实为规范冗余，而修正边界条件可被拓扑表面算符生成物理对称性。\n3. 这为构造电磁对偶的新边界条件提供了直接框架，并深化了对边界对称性与拓扑算符在量子场论中角色的理解。", "summary_source": "deepseek", "authors": [{"name": "Keito Shimizu"}, {"name": "Sotaro Sugishita"}], "featured_authors": [{"name": "Keito Shimizu"}, {"name": "Sotaro Sugishita"}], "author_count": 2}, {"id": "2605.27956", "category": "hep-th", "title": "Worldline Higher Spin Gravity", "abstract": "We propose a worldline formulation of higher-spin gravity (HSG) in $\\mathrm{AdS}_4$, based on a simple twistor action. Taken at face value, the model describes only the free propagation of massless higher-spin fields. The central observation of this work is that the model admits a natural double-line interpretation, which supplies a geometric prescription for gluing worldlines at interaction vertices, in close parallel with the joining of strings in string theory. Building on this picture, we construct $\\mathrm{AdS}$-covariant vertex operators for all massless higher-spin fields, show that they satisfy the Bargmann-Wigner equations, and use them to compute the n-point correlation functions of type-A and type-B HSG as worldline path integrals of these vertex operators. In the boundary limit these correlators reproduce the higher-spin current correlators of free boson and free fermion vector models. We further discuss the embedding of the worldline theory into Poisson sigma model, where the doubled-line structure acquires a geometric origin as the two edges of an open string worldsheet, together with several consequences of this enlarged framework -- fractional branes, loop expansion, unoriented projection, and the prospect of a worldsheet formulation of HSG.", "url": "https://arxiv.org/abs/2605.27956", "type": "理论", "summary": "1. 该工作基于twistor作用提出了AdS₄中高阶自旋引力的世界线表述，仅描述自由传播但通过双线结构引入相互作用。\n2. 其核心在于双线解释提供了类似弦论中弦连接的几何顶点规则，并构造了满足Bargmann-Wigner方程的AdS协变顶点算符，通过路径积分计算n点关联函数。\n3. 该框架在边界极限下重现自由玻色子和费米子矢量模型的高阶自旋流关联函数，并为嵌入Poisson sigma模型、发展世界面表述及处理分数膜与圈展开提供了方向。", "summary_source": "deepseek", "authors": [{"name": "Minkyeu Cho"}, {"name": "Euihun Joung"}, {"name": "Taehwan Oh"}, {"name": "Tung Tran"}], "featured_authors": [{"name": "Minkyeu Cho"}, {"name": "Euihun Joung"}, {"name": "Taehwan Oh"}, {"name": "Tung Tran"}], "author_count": 4}, {"id": "2605.28029", "category": "hep-th", "title": "Embedding formalism for anti-de Sitter superspaces", "abstract": "In this thesis we study embedding formalisms for $\\mathcal{N}$-extended anti-de Sitter (AdS) superspaces in four and five dimensions. Specifically, building on earlier work in the four-dimensional case, we develop bi-supertwistor realisations for these AdS superspaces as well as their harmonic and projective extensions. We also describe the precise correspondence between such global approaches to AdS superspaces and their realisations within the supergravity setting. Finally, we present applications of our formalism, including new models for superparticles propagating in AdS superspaces in diverse dimensions.", "url": "https://arxiv.org/abs/2605.28029", "type": "理论", "summary": "1. 该工作系统发展四维和五维 N 扩展反德西特超空间的嵌入形式，基于双超扭量实现构建超空间及其调和与射影扩展。\n2. 其技术核心在于建立全局超空间描述与超引力实现间的精确对应，并统一处理不同维度及扩展的超空间几何。\n3. 这为研究反德西特超空间中超粒子动力学提供统一框架，并为超引力与超弦理论中的对应问题开辟新途径。", "summary_source": "deepseek", "authors": [{"name": "Nowar E. Koning"}], "featured_authors": [{"name": "Nowar E. Koning"}], "author_count": 1}, {"id": "2605.28045", "category": "hep-th", "title": "The effective gravitational action of a massless chiral fermion and the absence of parity-odd contributions", "abstract": "We consider the field theory of a quantum massless left handed fermion coupled to a background graviton field, $h_{\\mu\\nu}$, on four-dimensional Minkowski spacetime. By using the BPHZL renormalization scheme, we prove that, up to order four in the number of graviton fields, there are no parity-odd contributions to the renormalized gravitational effective action. As a side result, we show that, modulo arbitrary UV finite diffeomorphism invariant parity-even counterterms, the gravitational effective action in question is equal, up to order four in the number of graviton fields, to half the corresponding gravitational action for a Dirac fermion non-chirally coupled to gravity. Also as a side result, we conclude the the Weyl anomaly is purely parity-even and that its value is half the value of the Weyl anomaly for a Dirac fermion non-chirally coupled to gravity.", "url": "https://arxiv.org/abs/2605.28045", "type": "理论", "summary": "1. 该工作对四维闵氏时空上无质量左手费米子与背景引力场的耦合系统，利用BPHZL重整化方案证明，在引力场数四阶内重整化有效作用中不存在奇宇称贡献。\n2. 其要点是证明该有效作用（模掉宇称偶的发散不变抵消项）精确等于狄拉克费米子非手性引力耦合作用的一半，并推论外尔反常纯偶且取值恰好为后者一半。\n3. 这为手征费米子在量子引力中的宇称破坏分析及反常抵消机制提供明确约束，亦可作为相关微扰计算的重整化方案基准。", "summary_source": "deepseek", "authors": [{"name": "J. Anero"}, {"name": "Carmelo P. Martin"}], "featured_authors": [{"name": "J. Anero"}, {"name": "Carmelo P. Martin"}], "author_count": 2}, {"id": "2605.28054", "category": "hep-th", "title": "Fermionic Bubble Loop in Cosmological Collider Revisited: Exact signals from spectral and Mellin-Barnes methods", "abstract": "Fermionic degrees of freedom are essential ingredients in cosmological collider physics and are well motivated by many phenomenological models beyond the Standard Model, but their signals remain largely unexplored due to the difficulty of computing loop diagrams. In this work, we ask how fermionic bubble loops contribute to cosmological collider signals and provide an exact answer for arbitrary couplings. We develop two parallel analytical methods whose agreement provides a non-trivial check of the result. The first method is similar in spirit to spectral decomposition and is built directly from an identity for the product of propagators, which turns the bubble signal into an infinite sum of tree-level exchange signals. The second method is based on the Mellin-Barnes representation, where the result is reconstructed from the residues of distinct families of poles. We also show that the fermionic bubble can be generated from the scalar bubble by the action of appropriate differential operators. As a phenomenologically important application, we consider Yukawa interactions between fermions and the inflaton, finding that the resulting bispectrum signal vanishes identically. Through the spectral decomposition, this vanishing can be traced to a field redefinition of the associated tree-level counterparts.", "url": "https://arxiv.org/abs/2605.28054", "type": "理论", "summary": "1. 该工作利用谱分解与Mellin-Barnes方法，精确计算了宇宙学对撞机中费米子气泡圈对信号在任意耦合下的贡献。\n2. 其卖点在于两种解析方法相互验证，并揭示费米子气泡可通过微分算子由标量气泡生成，且在Yukawa相互作用中双谱信号恒为零。\n3. 这为解析处理宇宙学对撞机中费米子圈图信号提供了严格框架，并启发对信号消失机制与场重定义联系的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Shuntaro Aoki"}, {"name": "Zhehan Qin"}, {"name": "Masahide Yamaguchi"}, {"name": "Yuhang Zhu"}], "featured_authors": [{"name": "Shuntaro Aoki"}, {"name": "Zhehan Qin"}, {"name": "Masahide Yamaguchi"}, {"name": "Yuhang Zhu"}], "author_count": 4}, {"id": "2605.28141", "category": "hep-th", "title": "More about modular symmetries and non-invertible properties in magnetized compactifications", "abstract": "We study the modular symmetry in magnetized compactifications. The zero-modes with different Scherk-Schwarz phases transform each other. A generic model does not include modes with all the Scherk-Schwarz phases. Incomplete multiplet representations appear. Thus, the modular symmetry is violated as group-like symmetry. However, the modular symmetry still controls coupling terms in those models. Modular forms of the full symmetry appear as coupling constants.", "url": "https://arxiv.org/abs/2605.28141", "type": "理论", "summary": "1. 该工作研究磁化紧致化中的模对称性，指出零模因Scherk-Schwarz相位缺失导致多重态不完整，使完整模对称性破缺为群状对称性。\n2. 其卖点在于尽管对称性降级，全对称性的模形式仍作为耦合常数出现，揭示破缺后耦合受约束的非可逆性质。\n3. 这为理解模对称性在紧致化模型中的部分保持及其对低能有效理论耦合的调控提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Tatsuo Kobayashi"}, {"name": "Shuhei Miyamoto"}, {"name": "Riku Nakano"}, {"name": "Ryusei Nishida"}, {"name": "Haruki Uchida"}], "featured_authors": [{"name": "Tatsuo Kobayashi"}, {"name": "Shuhei Miyamoto"}, {"name": "Riku Nakano"}, {"name": "Ryusei Nishida"}, {"name": "Haruki Uchida"}], "author_count": 5}, {"id": "2605.28485", "category": "hep-th", "title": "Hilbert Space and Defect Hilbert Spaces Associated with Categorical Symmetries", "abstract": "We present a quantum mechanical approach to understanding the Hilbert space and the defect Hilbert spaces associated with line operators of BF theory combined with level-$k$ Chern-Simons theory. The defect Hilbert spaces are closely related to the category of $*$-representations of the $C^*$-algebra of the compactly supported sections of the Fell line bundle over the conjugation action groupoid $G//_{\\mathrm Ad} G$, and the structure of this category and the groupoid action on the objects of this category is interpreted quantum mechanically. We show that the action of the line operators on the Hilbert space of the $BF+kCS$ TQFT is given concretely by a convolution between the kernels that represent the line operators, and that the codimension-$2$ twist and the codimension-$1$ prequantum line bundle arise as two transgressions of the same universal level $k\\in H^4(BG,\\mathbb{Z})$. For finite gauge group, the resulting convolution-eigenvalue formula is identified with the Verlinde formula for the (twisted) Drinfeld double $D^\\omega(G)$ via an explicit phase-by-phase match with the known finite modular data. For compact Lie group, the convolution-kernel eigenvalues coincide in the regular sector with the semiclassical Hopf-link $S$-kernel, identifying two complementary derivations of the same modular data.", "url": "https://arxiv.org/abs/2605.28485", "type": "理论", "summary": "1. 该工作提出量子力学方法，解析了结合BF理论与level-k Chern-Simons理论中与线算子关联的希尔伯特空间和缺陷希尔伯特空间的结构。\n2. 其核心在于利用Fell线丛C*-代数表示论和卷积核作用给出线算子对希尔伯特空间的具体实现，并将余维2扭曲与余维1预量子线丛阐释为同一普适level的两次超渡。\n3. 这为有限规范群下卷积本征值与Drinfeld双Verlinde公式的相位匹配，以及紧李群下正则扇区与半经典Hopf-link S核的同一性提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Qiang Jia"}, {"name": "Jiahua Tian"}], "featured_authors": [{"name": "Qiang Jia"}, {"name": "Jiahua Tian"}], "author_count": 2}, {"id": "2605.28519", "category": "hep-th", "title": "Radiative Correction to the Casimir Energy for Massive Scalar Field in The Network", "abstract": "In this paper, we compute the leading-order and first-order radiative corrections to the Casimir energy of a massive Lorentz-violating scalar field governed by a $\\phi^4$ interaction on a network. For simplicity, the network is chosen to consist of three edges connected at a single central junction, with the scalar field defined in 1+1 dimensions on each edge. Dirichlet boundary conditions are imposed at the outer ends of the edges, thereby confining the field on the network. Beyond addressing the massive case of a Lorentz-violating scalar field, a key novelty of this work lies in the calculation of the radiative corrections to the Casimir energy using position-dependent counterterms. These counterterms emerge from a systematic renormalization program that consistently incorporates the effects of boundary conditions into the renormalization procedure. To eliminate divergences arising from vacuum energy contributions, we employ the box subtraction scheme in conjunction with cutoff regularization. Our results show that both the leading-order and first-order Casimir energies are negative, regardless of the presence or absence of Lorentz-violating effects, and are in agreement with general physical expectations.", "url": "https://arxiv.org/abs/2605.28519", "type": "理论", "summary": "1. 该工作计算了由三条边组成的网络上大质量洛伦兹破缺标量场φ^4相互作用下卡西米尔能量的领头阶和一阶辐射修正。\n2. 其技术核心在于通过位置依赖的反项系统实施重整化，将狄利克雷边界条件纳入重整化程序，并联合盒子减除与截断正则化消除真空发散。\n3. 所得领头阶与一阶卡西米尔能量均为负，与物理预期一致，为网络上含边界效应的辐射修正计算提供了可推广的重整化方案。", "summary_source": "deepseek", "authors": [{"name": "M. A. Valuyan"}], "featured_authors": [{"name": "M. A. Valuyan"}], "author_count": 1}, {"id": "2605.28670", "category": "hep-th", "title": "Non-integral geometry: additional term $f_A$ as a regularizing term", "abstract": "In the present paper, we first describe the principal basis of non-integral geometry. Non-integral geometry is a new field of generalized function (distribution) theory where the effects breaking the symmetry of integration measure have been investigated. In turn, the non-symmetric integration measure (the non-invariant measure) leads to the complex form of the universal, dimension-independent inverse operator with the additional contributions compared to the methods of integral geometry. The additional term with the complex integration measure serves to the extension that improves the image reconstruction procedure. Then, we proof that this additional term $f_A$ in the universal inverse Radon transforms plays a role of the regularizing contribution. In particular, we show that owing to the presence of $f_A$ the corresponding complex singularities can be eliminated in the image reconstruction process.", "url": "https://arxiv.org/abs/2605.28670", "type": "理论", "summary": "1. 该工作建立了非积分几何的基本框架，并证明逆Radon变换中由非对称积分测度引入的附加项$f_A$具有正则化作用。\n2. 其核心在于利用非对称积分测度产生的与维度无关的复数贡献，通过$f_A$项有效消除图像重建过程中的复数奇点。\n3. 这一发现为广义函数理论中非对称测度效应提供了新视角，并有望改进基于Radon变换的图像重建数值稳定性。", "summary_source": "deepseek", "authors": [{"name": "I.V. Anikin"}], "featured_authors": [{"name": "I.V. Anikin"}], "author_count": 1}, {"id": "2605.28681", "category": "hep-th", "title": "Krylov complexity has it all", "abstract": "This paper establishes that Krylov complexity contains the entire information about the dynamics of a quantum operator, extending the list of equivalent quantities that can serve this purpose, such as the Lanczos coefficients, the return amplitude, and the spectral density. To demonstrate this equivalence, an explicit recursive algorithm is constructed to calculate Lanczos coefficients from the Taylor expansion of the Krylov complexity around $t=0$. Furthermore, the paper discusses the distinction between Krylov and spread complexity, clarifying why a similar recursive algorithm cannot exist for the latter without additional dynamical input. These results provide a ``proof of principle'' for using Krylov complexity as a complete characterization of operator evolution in quantum systems.", "url": "https://arxiv.org/abs/2605.28681", "type": "理论", "summary": "1. 该工作严格证明了Krylov复杂度完全包含量子算符动力学的全部信息，并与Lanczos系数、回波振幅及谱密度等量等价。\n2. 其关键贡献在于构建了从Krylov复杂度在t=0附近泰勒展开递归计算Lanczos系数的显式算法，并澄清了Krylov复杂度与spread复杂度的本质区别。\n3. 这为将Krylov复杂度作为算符演化的完整表征提供了原理性基础，并启发在更广泛的量子系统中实现类似的等效性证明。", "summary_source": "deepseek", "authors": [{"name": "Wolfgang Mück"}], "featured_authors": [{"name": "Wolfgang Mück"}], "author_count": 1}, {"id": "2605.28737", "category": "hep-th", "title": "Complex BPS Black Holes in AdS$_3\\times S^3$", "abstract": "The correct gravitational representation of the supersymmetric index is a smooth complex solution, rather than the na\\\"ıve Euclidean continuation of the Lorentizan BPS black hole. We construct such saddles for black holes with \\(\\mathrm{AdS}_3\\times S^3\\) boundary conditions in the STU model. We arrive at the same finite-temperature BTZ \\(\\times S^3\\) geometries in two independent ways: from two-center four-dimensional BPS solutions with complex dipole charges, and from six-dimensional black strings after imposing the BPS relation among conserved charges. We analyze the resulting smoothness and periodicity conditions and show that they are precisely those required for globally well-defined supersymmetry and for the thermodynamic potentials of the supersymmetric index.", "url": "https://arxiv.org/abs/2605.28737", "type": "理论", "summary": "1. 本文在STU模型中构造了具有AdS₃×S³边界条件的复BPS黑洞的光滑鞍点解。\n2. 核心在于通过四维二中心BPS解中的复偶极荷与六维黑弦施加BPS关系两种独立途径，得到同一有限温度BTZ×S³几何。\n3. 该解满足的光滑性与周期性条件正是全局
