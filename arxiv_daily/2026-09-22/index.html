symmetric six-state model. Numerical simulations reveal a pronounced oscillatory dependence of the population transfer to the doubly excited Rydberg state on the peak Rabi frequency, indicating dynamics beyond the conventional single-dark-state description of STIRAP. To identify the underlying mechanism, we develop a dressed-manifold description based on gauge-invariant projections onto nearly degenerate instantaneous dressed manifolds. The analysis demonstrates that the wavefunction remains predominantly confined to a two-dimensional dark manifold while becoming transiently coupled to a neighboring bright manifold during the pulse-overlap interval. We further show that in the dressed-manifold representation, the Rydberg-Rydberg interaction modifies the collective resonance structure while preserving the dark-bright manifold dynamics responsible for the oscillatory transfer; an appropriately chosen frequency chirp compensates the interaction-induced detuning and restores efficient population transfer. This dressed-manifold picture provides a consistent interpretation of oscillatory collective transfer and establishes a framework for controlling adiabatic dynamics in interacting multilevel systems by linearly chirped STIRAP, opening a route toward manifold-based control of Rydberg-mediated quantum gates, correlated-state preparation, and other coherent operations in interacting atomic systems.", "url": "https://arxiv.org/abs/2609.22673", "type": "理论+数值", "summary": "1. 该工作用对称六态模型研究双同构三能级原子中的集体啁啾STIRAP，并数值发现到双激发里德伯态的转移随峰值拉比频率呈振荡依赖。\n2. 其核心是引入基于规范不变投影的近简并瞬时缀饰流形描述，揭示波函数主要限于二维暗流形、仅在脉冲交叠期瞬态耦合至明亮流形。\n3. 该图像表明里德伯相互作用改变集体共振结构但保留暗-亮流形动力学，合适啁啾可补偿失谐并恢复高效转移，为里德伯量子门等相干操控提供流形调控思路。", "summary_source": "deepseek", "authors": [{"name": "Vladimir V. Malinovsky"}, {"name": "Svetlana A. Malinovskaya"}], "featured_authors": [{"name": "Vladimir V. Malinovsky"}, {"name": "Svetlana A. Malinovskaya"}], "author_count": 2}, {"id": "2609.22728", "category": "quant-ph", "title": "Concatenated Composite Pulses Beyond Local Residual-Error Preservation", "abstract": "Residual-error preservation (REP) provides a sufficient rule for constructing concatenated composite pulses that compensate multiple systematic errors. We show that local REP is not necessary: deviations from REP can cancel across the full sequence. Using first-order error generators, we derive a necessary and sufficient condition for concatenation to retain the robustness of an outer sequence. A simple sufficient condition is that all inner pulses rescale the corresponding elementary error generators by a common real factor, not necessarily unity. We illustrate this principle using pulse-length and off-resonance errors, two systematic error models commonly considered in magnetic resonance. Short CORPSE and SCROFULOUS each compensate one error without preserving the other locally. Combining these inner pulses with suitable equal-rotation-angle outer sequences yields simultaneous first-order compensation of both errors, extending concatenated composite-pulse design beyond local REP.", "url": "https://arxiv.org/abs/2609.22728", "type": "理论", "summary": "1. 该工作研究级联复合脉冲的多系统误差补偿，指出局部残差误差保持（REP）并非必要条件，并利用一阶误差生成元给出级联后保持外层序列鲁棒性的充要条件。\n2. 其关键机制在于：偏离局部REP的贡献可在全序列中相消，内层脉冲只需将对应基本误差生成元按同一实因子缩放（不要求为1）；以磁共振中脉冲长度与失谐误差为例，短CORPSE与SCROFULOUS各自补偿一个误差而不局部保持另一个，与等旋转角外层序列组合后可同时实现二者的一阶补偿。\n3. 这为超越局部REP的级联复合脉冲设计提供更一般准则，并可启发磁共振等平台中多误差鲁棒控制脉冲的构造。", "summary_source": "deepseek", "authors": [{"name": "Masamitsu Bando"}], "featured_authors": [{"name": "Masamitsu Bando"}], "author_count": 1}, {"id": "2609.22748", "category": "quant-ph", "title": "Feasibility and optimum recovery in warm-start quantum optimization for a drug-response model on a trapped-ion processor", "abstract": "On a seven-compound drug-response model, warm-start quantum approximate optimization (QAOA) on IonQ Forte-1 returned valid assignments more often than random bitstrings, but this alone did not show effective optimization. Ideal QAOA raised optimum probability above uniform feasible sampling in only four of twelve reference circuits. Hardware often fell below its own noiseless circuits, while greedy search solved all hardware models within 200 objective evaluations. Expanded simulations showed a gain over feasible sampling in 28 of 35 CAMA-1 panels and none of four 647-V panels. Annealing solved all these panels in every seed. A Grover mixer preserved feasibility and improved optimum probability over feasible sampling in all ten tested models. We analyzed 25 completed tasks containing 5,300 shots from 18 circuits and 14 instances. The encodings use 6-35 qubits and at most 4,900 feasible assignments, which we enumerated to establish exact optima. Noiseless references now cover both the original six circuits and six wider circuits. At 35 qubits, with 4,900 feasible assignments, ideal feasibility was 35.85%, compared with 7 of 200 valid hardware outputs. Its ideal optimum probability was below both sampling controls. The circuits sample assignments in a model built from measured single-agent and pairwise responses.", "url": "https://arxiv.org/abs/2609.22748", "type": "理论+数值", "summary": "1. 该工作在IonQ Forte-1上针对七化合物药物响应模型，基准测试warm-start QAOA的可行解采样与最优解恢复，并枚举最多4900个可行赋值以确定精确最优。\n2. 核心发现是可行性不等于有效优化：理想QAOA仅在12个参考电路中4个把最优概率提升到均匀可行采样之上，35量子比特、4900可行赋值时理想可行性为35.85%而硬件仅7/200有效输出，且常低于自身无噪声电路。\n3. 扩展模拟中Grover mixer在全部10个模型保持可行性并提升最优概率，退火在所有面板每个种子成功，贪心200次评估即解出全部硬件模型；这表明warm-start量子优化需与经典基线及噪声条件严格对照。", "summary_source": "deepseek", "authors": [{"name": "Tanzir Hossain"}, {"name": "Rajib Rana"}, {"name": "Prabal Datta Barua"}, {"name": "Abu Ali Ibn Sina"}, {"name": "Niall Higgins"}, {"name": "Pascal Elahi"}, {"name": "Robert Sang"}, {"name": "Bjorn W. Schuller"}], "featured_authors": [{"name": "Tanzir Hossain"}, {"name": "Rajib Rana"}, {"name": "Prabal Datta Barua"}, {"name": "Pascal Elahi"}, {"name": "Robert Sang"}, {"name": "Bjorn W. Schuller"}], "author_count": 8}, {"id": "2609.22822", "category": "quant-ph", "title": "From IceCube to IT-Sphere: A Hybrid Quantum-Classical GNN for Banking IT Root Cause Analysis", "abstract": "We present Hybrid Quantum Root Cause Analysis (HQ-RCA), an industrially grounded workflow for root cause analysis in banking IT operations, built on a hybrid Quantum Graph Neural Network (QGNN): the classical backbone of DynEdge (the IceCube neutrino-reconstruction GNN, which we call standalone DynEdge), with its classification head replaced by a Variational Quantum Circuit (VQC). On 13 months of anonymised IT data (13k alarm clusters) from a major European bank, the hybrid QGNN matches standalone DynEdge -- the strongest classical baseline -- on $F_1$, while standalone DynEdge leads the ranking metrics. A readout-sensitivity and layout-robustness study, analysed via Dimensional Expressivity Analysis (DEA), shows that the effective parameter dimensionality (rank) of the quantum observable has no measurable correlation with $F_1$; we therefore keep the simplest readout $\\langle Z_0\\rangle$ (the Pauli-$Z$ expectation on the first qubit), which in the deployed layout is rank-1, collapsing optimisation to a 1-D problem solvable by a gradient-free grid scan. Execution on IBM Heron r2 (no error mitigation) shows this gradient-free readout is executable on NISQ hardware after threshold recalibration.", "url": "https://arxiv.org/abs/2609.22822", "type": "理论+数值", "summary": "1. 我们提出混合量子根本原因分析 (HQ-RCA)，这是一种基于工业基础的工作流程，用于银行 IT 运营中的根本原因分析，构建在混合量子图神经网络 (QGNN) 之上：DynEdge（IceCube 中微子重建 GNN，我们称为独立 DynEdge）的经典主干，其分类头被变分量子电路 (VQC) 取代。\n2. 在 IBM Heron r2 上执行（无错误缓解）表明，在阈值重新校准后，这种无梯度读数可以在 NISQ 硬件上执行。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Antonio Greco"}, {"name": "Riccardo Paoletti"}, {"name": "Roberto Cappuccio"}, {"name": "Mario Onorato"}], "featured_authors": [{"name": "Antonio Greco"}, {"name": "Riccardo Paoletti"}, {"name": "Roberto Cappuccio"}, {"name": "Mario Onorato"}], "author_count": 4}, {"id": "2609.22902", "category": "quant-ph", "title": "Characterizing local unitary equivalence of multipartite states by local unitary Bargmann invariants", "abstract": "Local unitary (LU) equivalent states are crucial for understanding the structure of quantum entanglement. We investigate the LU equivalence based on the LU Bargmann invariants (LUBIs). We consider for which states the LUBIs are sufficient to ensure the LU equivalence. We focus on a class of multipartite states with complete local commutativity, called CLC states. We first show that for multipartite CLC states, all the LUBIs are sufficient to ensure the local permutation equivalence, if their single-party marginals are diagonal and non-degenerate. By virtue of the fact that the CLC property remains unchanged under local operations, we verify that the LUBIs are also sufficient to ensure the LU equivalence of multipartite CLC states whose single-party marginals are non-degenerate. Furthermore, when the single-party marginals are degenerate, we propose concrete examples of two-qudit and three-qubit systems, showing that there are states which share all the LUBIs but are not LU equivalent.", "url": "https://arxiv.org/abs/2609.22902", "type": "理论", "summary": "1. 该工作用局域幺正Bargmann不变量(LUBI)研究多体态局域幺正(LU)等价性，并聚焦完全局域对易(CLC)态。\n2. 核心是：单侧约化对角非简并时全部LUBI足以判定CLC态的局域置换等价，再借CLC在局域操作下不变，推广到非简并单侧边缘的LU等价。\n3. 当单侧边缘简并时，二qudit与三qubit反例显示共享全部LUBI的态仍可非LU等价，表明该判据不普遍充分，需增设不变量或条件。", "summary_source": "deepseek", "authors": [{"name": "Yi Shen"}, {"name": "Lin Chen"}, {"name": "Shao-Ming Fei"}], "featured_authors": [{"name": "Yi Shen"}, {"name": "Lin Chen"}, {"name": "Shao-Ming Fei"}], "author_count": 3}, {"id": "2609.22937", "category": "quant-ph", "title": "Efficient creation of shallow NV$^-$ ensembles by high-angle ion implantation", "abstract": "Negatively charged nitrogen-vacancy (NV$^-$) centers located a few nanometers below the diamond surface are key quantum defects for nanoscale sensing of external spins. However, the creation of shallow NV$^-$ centers with high yield remains a materials challenge. Here, we demonstrate that high-angle ion implantation enhances the creation efficiency of shallow NV$^-$ centers. By implanting $^{15}$N ions at angles exceeding 60$^\\circ$, we achieve high NV$^-$ yields approaching 10% with effective NV$^-$ depths below 10 nm. These yields are significantly higher than those typically reported for shallow NV$^-$ creation. The enhanced NV$^-$ yield is consistent with an increased vacancy-to-nitrogen ratio in the near-surface region, which is expected to promote NV formation during annealing. The created NV$^-$ ensembles show coherence properties comparable to those of single shallow NV$^-$ centers at similar depths, and allow detection of nuclear spins in van der Waals materials attached to the diamond surface. Our results establish geometric control of ion implantation as a simple and broadly applicable approach to engineer shallow vacancy-related quantum defects.", "url": "https://arxiv.org/abs/2609.22937", "type": "理论", "summary": "1. 该工作利用高角度离子注入制备浅层NV⁻系综，以超过60°的角度注入15N离子，在有效深度低于10 nm处获得接近10%的NV⁻产率。\n2. 其核心机制是高角度注入提高近表面区域的空位与氮比例，从而在退火中促进NV形成；所得系综的相干性可与同深度单个浅NV⁻中心相比，并能探测贴附于金刚石表面的范德华材料中的核自旋。\n3. 这表明离子注入的几何控制是一种简单且普适的方法，可用于工程化浅层空位相关量子缺陷，并为表面纳米尺度量子传感提供可行路径。", "summary_source": "deepseek", "authors": [{"name": "Kento Sasaki"}, {"name": "Hideyuki Watanabe"}, {"name": "Tokuyuki Teraji"}, {"name": "Takashi Taniguchi"}, {"name": "Kenji Watanabe"}, {"name": "Kensuke Kobayashi"}], "featured_authors": [{"name": "Kento Sasaki"}, {"name": "Hideyuki Watanabe"}, {"name": "Tokuyuki Teraji"}, {"name": "Takashi Taniguchi"}, {"name": "Kenji Watanabe"}, {"name": "Kensuke Kobayashi"}], "author_count": 6}, {"id": "2609.22965", "category": "quant-ph", "title": "Exact Realization of Deep ReLU Computation in a Microscopic Statistical-Mechanical System", "abstract": "Understanding the physical origin of the piecewise-linear computation in deep rectified linear unit (ReLU) networks remains a fundamental challenge. Here we establish an exact statistical-mechanical realization of arbitrary ReLU networks. Starting from a microscopic configuration space and its state multiplicities, we construct a partition function without prescribing a neural-network activation function. The resulting system admits equivalent descriptions in terms of cascaded quantum operations with post selection, or fermionic transport model. We rigorously prove that in $\\beta\\to+\\infty$ limit, the thermodynamic observables of this system exactly reproduce the hidden states, outputs, and loss function of an arbitrary deep ReLU network. Crucially, we demonstrate that the piecewise-linear behavior of the ReLU network emerges from a first-order phase transition in the microscopic system, where the discontinuities precisely coincide with the boundaries of linear regions of ReLU network. This work establishes an exact physical foundation for deep neural computation and provides a novel statistical-mechanical perspective on neural architecture design.", "url": "https://arxiv.org/abs/2609.22965", "type": "理论", "summary": "1. 该工作从微观构型空间及其态重数出发，在不预设激活函数的情况下构造配分函数，从而精确实现任意深度ReLU网络。\n2. 其核心在于严格证明β→+∞时热力学观测量精确复现网络隐状态、输出与损失函数，并给出级联量子操作加后选择或费米子输运的等价描述；ReLU分段线性行为源自微观系统的一阶相变，其不连续点恰对应线性区域边界。\n3. 该结果为深度神经计算奠定精确物理基础，并启示从统计力学与相变角度理解及设计神经网络架构。", "summary_source": "deepseek", "authors": [{"name": "Junxu Li"}], "featured_authors": [{"name": "Junxu Li"}], "author_count": 1}, {"id": "2609.23016", "category": "quant-ph", "title": "Watching Quantum Models Think: Hilbert-Space Interpretability in Quantum Transformer Blocks", "abstract": "Deep learning models are powerful but opaque. As quantum machine learning matures, the field faces a defining choice: build quantum models that are equally opaque, or exploit the mathematical structure of quantum mechanics to make them inherently interpretable. We show that the latter is possible. By tracking quantum mutual information~(MI), entanglement entropy, and state fidelity through the layers of a Quantum Transformer Block (\\qtb{}), a fully-coherent variational circuit with quantum analogues of both attention and feedforward, we gain direct insight into how the model processes information: which tokens it attends to, when correlations form, and why predictions fail. On four tasks with known dependency structure we show that (i)~learned MI matrices align with ground-truth task structure (AUC$\\,{=}\\,0.69$ on lookup), (ii)~disabling entangling gates collapses accuracy from 100\\% to 15\\% while MI$\\to 0$, proving entanglement is the mechanism, (iii)~accuracy and MI co-evolve during training ($\\rho\\,{=}\\,0.92$ on lookup), and (iv)~per-sample MI predicts prediction correctness on the conditional task with ROC AUC$\\,{=}\\,0.84$. All results are validated on IBM Quantum hardware (ibm\\_kingston, Heron~r2): the circuit's reasoning process, from product state through structured entanglement, is directly observable on a superconducting processor. These proof-of-concept results, obtained on small synthetic tasks, suggest that the physics of quantum computation can provide intrinsic interpretability signals with no direct classical counterpart, motivating study of whether this advantage persists at scale.", "url": "https://arxiv.org/abs/2609.23016", "type": "理论+数值", "summary": "1. 该工作将量子Transformer块（QTB）作为兼具量子注意力与量子前馈的全相干变分电路，逐层追踪量子互信息、纠缠熵与态保真度，在四个已知依赖结构的任务上解析其信息处理过程。\n2. 其核心卖点在于：学习到的互信息矩阵与真实任务结构对齐（lookup AUC=0.69），关闭纠缠门使准确率由100%降至15%且互信息趋零，准确率与互信息共同演化（ρ=0.92），样本级互信息还能预测条件任务的正确性（ROC AUC=0.84），并在IBM Heron r2超导处理器上直接观测从乘积态到结构化纠缠的推理过程。\n3. 这暗示量子计算物理可提供无直接经典对应的内禀可解释信号，但现有证据限于小规模合成任务，尚需验证该优势能否随规模保持。", "summary_source": "deepseek", "authors": [{"name": "Diego Iacopetta"}, {"name": "Andrea Gasparini"}], "featured_authors": [{"name": "Diego Iacopetta"}, {"name": "Andrea Gasparini"}], "author_count": 2}, {"id": "2609.23041", "category": "quant-ph", "title": "The Requirement of (at least) Complex Structure for Quantum Mechanics", "abstract": "It is argued that many real-valued constructions of quantum mechanics are only \\emph{nominally} real in that the operators and states are restricted to impose a \\emph{complex structure} on the Hilbert space. That is, complex algebra between pairs of elements representing complex numbers is preserved in these formulations. It is therefore mistaken to think of these constructions as being `real' as they are actually a representation of complex linear algebra. It is then shown that under the assumptions of state normalisation and strict energy conservation, this complex structure (at the very least) is required to allow for time evolution in quantum mechanics. This is only a \\emph{minimum} requirement, as our arguments do not preclude the formulation of quantum mechanics in terms of hyper-complex entities, such as quaternions.", "url": "https://arxiv.org/abs/2609.23041", "type": "理论", "summary": "1. 该工作重新审视量子力学的实数表述，指出这类构造通常只是名义上实值，因为算符与态被限制为在希尔伯特空间上施加复结构，并保持复数的代数关系。\n2. 其核心论证是：在态归一化和严格能量守恒前提下，时间演化至少要求这种复结构，故所谓实值形式实质上是复线性代数的表示，而非真正的实量子力学。\n3. 这为量子力学基础中复结构乃至四元数等超复实体的作用划定了最低边界，同时不排除更丰富的超复表述，并提示后续研究需辨明代数结构在动力学中的角色。", "summary_source": "deepseek", "authors": [{"name": "M.P. Vaughan"}], "featured_authors": [{"name": "M.P. Vaughan"}], "author_count": 1}, {"id": "2609.23046", "category": "quant-ph", "title": "Universality in Terms of The BECs Bloch-Sphere Manipulations", "abstract": "Quantum computing promises to outperform classical computing for certain computational tasks. One of the key concepts underlying this potential is universality. Universality has been extensively studied not only for qubits but also for higher-dimensional quantum systems, such as qutrits and qudits, which span Hilbert spaces of dimension greater than two. However, the concept of universality in Bose-Einstein condensates (BECs) qubit systems, which have been proposed relatively recently, remains insufficiently understood. In this work, we analyzed universality in BECs qubit systems. Our results clarify the theoretical aspects of universality in quantum computation within the class of ((N+1))-dimensional representations of SU(2), taking into account two distinct representations of the quantum states.", "url": "https://arxiv.org/abs/2609.23046", "type": "理论", "summary": "1. 该工作分析了玻色-爱因斯坦凝聚（BEC）量子比特系统中的普适性，并在SU(2)的(N+1)维表示框架下考察了布洛赫球操控与两种量子态表示。\n2. 其核心卖点是从理论上澄清BEC量子比特实现量子计算普适性的条件，揭示高维SU(2)表示以及量子态双重表示对普适性判定的影响。\n3. 这为理解BEC平台与高维量子系统普适性的联系提供了理论启发，并有助于评估其在量子计算及qudit操控中的潜力。", "summary_source": "deepseek", "authors": [{"name": "Genji Fujii"}], "featured_authors": [{"name": "Genji Fujii"}], "author_count": 1}, {"id": "2609.23047", "category": "quant-ph", "title": "Where to Decide: Control-Plane Geometry in Coherence-Limited Quantum Networks", "abstract": "Quantum networks are usually framed by two hardware limits: how fast entanglement can be heralded, and how long a memory can hold it. We establish a third, geometric limit: entanglement decoheres while control information travels, so the distance to whoever allocates resources enters the fidelity budget directly. We develop a functional-graph abstraction weighting each link by its predicted multiplicative contribution to end-to-end fidelity, separating global but delayed state from local and immediate state, and compare centralized against local allocation in a replicated discrete-event model. Centralized delivery latency grows with network diameter while local latency is nearly scale invariant, differing up to twenty-fold for short-range traffic; the coherence threshold at which a global view outweighs a fresh one does not shift across the tested sizes; and as heralding accelerates, the dominant cost moves into the control plane. Slot synchronization instead obeys the product of slot rate and one-way link delay, so it is bounded by repeater spacing rather than diameter. Controller placement, decision locality, repeater spacing and slot rate are physical design parameters, not implementation details.", "url": "https://arxiv.org/abs/2609.23047", "type": "理论", "summary": "1. 量子网络通常受到两个硬件限制：纠缠的预示速度有多快，以及存储器可以保存纠缠多长时间。\n2. 控制器放置、决策位置、中继器间距和时隙速率是物理设计参数，而不是实现细节。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "I. Dey"}, {"name": "N. Marchetti"}], "featured_authors": [{"name": "I. Dey"}, {"name": "N. Marchetti"}], "author_count": 2}, {"id": "2609.23057", "category": "quant-ph", "title": "A Quantum-Inspired Two-Dimensional Lattice Polarized Radiative Transfer Simulator", "abstract": "A quantum inspired framework was developed for polarized radiative transfer in the atmosphere to jointly model multiple scattering, absorption, and emission processes. The radiative field is represented by the Stokes vector and discretized using an n-directional two-dimensional spatial lattice on 3-dimensional uniformly distributed zenith and azimuth angular vectors. The formulation of this quantum computation system is based on the Lattice Boltzmann Method, which incorporates a physics-based polarized phase matrix. A classical lattice solver employing identical spatial and angular discretization and physical modeling as in quantum algorithm is implemented. The corresponding quantum algorithm is evaluated using the IBM Qiskit quantum simulator, enabling direct comparison of numerical accuracy to a classical simulation reference. The results demonstrate that fully physics-based polarized radiative transfer can be embedded within a quantum lattice framework, which provides an initial benchmark toward scalable quantum atmospheric radiative transfer and future quantum climate modeling", "url": "https://arxiv.org/abs/2609.23057", "type": "理论+数值", "summary": "1. 开发了一种量子启发框架，用于大气中的偏振辐射传输，以联合模拟多重散射、吸收和发射过程。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Shan Zeng"}, {"name": "Bing Lin"}, {"name": "Ali Omar"}], "featured_authors": [{"name": "Shan Zeng"}, {"name": "Bing Lin"}, {"name": "Ali Omar"}], "author_count": 3}, {"id": "2609.23190", "category": "quant-ph", "title": "QCMI-Based Quantum Markov Blanket Discovery for Semantic Quantum Networks", "abstract": "Quantum-enabled semantic communication networks (QESCs) leverage quantum technologies to transmit data meaning efficiently, yet face challenges from costly resources and noise. This letter introduces Quantum Markov Blankets (QMBs) to QESCs, a novel framework to isolate essential quantum information for semantic transmission. We prove QMBs' validity using quantum conditional mutual information, showing that they shield semantic content from irrelevant subsystems. An implementation strategy optimises QMB detection, reducing resource use. Simulations suggest that QMB-based QESCs cut qubit consumption by 50\\%-75\\% while enhancing fidelity compared with non-optimised quantum semantic schemes. Unlike classical approaches, QMBs offer inherent security by limiting an eavesdropper's access to classical data outside the blanket. We outline future directions, including real-time QMB adaptation. This work bridges quantum information theory and semantic communication, advancing resource-efficient and secure quantum networks.", "url": "https://arxiv.org/abs/2609.23190", "type": "理论+数值", "summary": "1. 该文将量子马尔可夫毯引入量子使能语义通信网络，提出基于量子条件互信息的QMB发现框架。\n2. 其核心卖点是用量子条件互信息证明QMB可隔绝无关子系统对语义内容的干扰，并以优化检测降低50%-75%量子比特消耗且提升保真度。\n3. 通过限制窃听者获取毯外经典数据，QMB提供内生安全，并为实时自适应及量子信息论与语义通信融合提供启发。", "summary_source": "deepseek", "authors": [{"name": "Evangelos K. Markakis"}, {"name": "Ilias Politis"}], "featured_authors": [{"name": "Evangelos K. Markakis"}, {"name": "Ilias Politis"}], "author_count": 2}, {"id": "2609.23243", "category": "quant-ph", "title": "Resource and entanglement study of a hybrid qudit-qubit quantum algorithm for solving the integer programming problem", "abstract": "Recently, a hybrid qudit-qubit algorithm [1] was presented for solving the integer programming problem with a polynomial quantum advantage. In this work, we investigate the algorithm [1] to understand the role of qudits ($d$-dimensional quantum system) by conducting a comparative resource analysis with its qubit-only implementation and the classical simulability of the algorithm by exploring the entanglement structure. The resource analysis part is performed in terms of logical gate counts, and fault-tolerant physical resources, including non-Clifford gates. The hybrid qudit-qubit implementation has a more compact structure of the unitary operators as opposed to its qubit-only simulation which reduces the logical and fault-tolerant resource requirements. Two example problems, one with qutrits ($d=3$) and the other with ququint ($d=5$), when contrasted with their qubit-only implementation, within a simplified fault-tolerant resource model, showed $\\sim 180 \\times $ and $\\sim 2220\\times$ fewer total resource count, respectively. For the entanglement study, volume-law-like entropy growth and signatures of multi-partite entanglement is observed leading to increasing difficulty in the classical simulation of the algorithm. The algorithm generates synergistic tri-partite entanglement even for a quadratic problem, revealing that the algorithmic structure itself can generate higher-order entanglement in the system independent of the problem.", "url": "https://arxiv.org/abs/2609.23243", "type": "理论+数值", "summary": "1. 该工作研究了求解整数规划的高维量子系统-量子比特混合量子算法，通过逻辑门与容错物理资源计数比较其纯量子比特实现，并基于纠缠结构探讨经典可模拟性。\n2. 其核心卖点是混合实现以更紧凑的幺正操作降低逻辑与容错资源，三能级与五能级量子系统示例相较纯量子比特实现总资源计数分别减少约180倍和2220倍，且纠缠熵呈体积律式增长并出现多体纠缠特征。\n3. 这表明高维自由度为降低混合量子算法资源提供了可量化优势，同时算法结构本身可在二次问题中产生协同三体纠缠，提示其经典模拟难度与问题无关地增强。", "summary_source": "deepseek", "authors": [{"name": "Kapil Goswami"}, {"name": "Rick Mukherjee"}, {"name": "Peter Schmelcher"}], "featured_authors": [{"name": "Kapil Goswami"}, {"name": "Rick Mukherjee"}, {"name": "Peter Schmelcher"}], "author_count": 3}, {"id": "2609.23277", "category": "quant-ph", "title": "Radial Coarse Graining Restores Vacuum Majorization in Wigner Phase Space", "abstract": "Quantum uncertainty limits how strongly Wigner functions can concentrate in phase space. It is commonly conjectured that the vacuum Wigner function continuously majorizes that of any Wigner-positive state. However, by constructing Wigner-positive states whose localized quantum coherence lowers their Wigner entropy below the vacuum value, we show that this conjecture is incorrect. We restore vacuum majorization at finite resolution by integrating single-mode Wigner functions over concentric radial energy shells, obtaining probability vectors majorized by that of the vacuum for all Wigner-positive states and for Wigner-negative states with non-negative shell weights. Anchoring these shells to a fixed oscillator frame breaks affine symplectic invariance, rendering this relation strict for every non-vacuum Gaussian pure state. For Wigner-negative states, the persistence of negative shell weights defines a radial negativity scale with Airy-edge semiclassical asymptotics for highly excited Fock states. Operationally, we combine the majorization relation with partial transposition to obtain a two-mode entanglement criterion directly evaluable from radially binned joint homodyne outcomes without state reconstruction.", "url": "https://arxiv.org/abs/2609.23277", "type": "理论", "summary": "1. 量子不确定性限制了维格纳函数在相空间中的集中程度。\n2. 在操作上，我们将主化关系与部分转置相结合，以获得可直接从径向分箱的联合零差结果评估的二模纠缠标准，而无需状态重建。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Ao-Xiang Liu"}, {"name": "Cong-Feng Qiao"}], "featured_authors": [{"name": "Ao-Xiang Liu"}, {"name": "Cong-Feng Qiao"}], "author_count": 2}, {"id": "2609.23316", "category": "quant-ph", "title": "Simultaneous Reduction of Observables and Measured Qudits in Entanglement-Assisted Quantum Local Recovery", "abstract": "For a general entanglement-assisted or unassisted quantum error-correcting code, a set of erasures, and an associated repair group, we propose a linear algebraic procedure to compute a reduced set of observables and a reduced repair group of codeword qudits for correcting the given erasures. The procedure has cubic complexity in the repair group size and the computed set of observables has the smallest possible size for correcting the given erasures. We specialize the general procedure to quantum codes constructed from Euclidean and Hermitian orthogonality, and provide closed-form upper bounds on the size of reduced repair groups for those special cases. Based on these closed-form bounds, we propose quantum counterparts of the information locality of classical local recovery.", "url": "https://arxiv.org/abs/2609.23316", "type": "理论+数值", "summary": "1. 该工作针对一般纠缠辅助或无辅助量子纠错码，在给定擦除与修复群下提出线性代数流程，同时约化可观测量和所需测量的码字单元。\n2. 卖点在于所得可观测量集在纠错意义下尺寸最小，算法相对修复群大小仅为三次复杂度，且对欧氏与厄米正交构造给出修复群的闭式上界。\n3. 由此提出经典局域恢复中信息局域性的量子对应，为纠缠辅助量子局部恢复的可观测量与测量开销权衡提供启示。", "summary_source": "deepseek", "authors": [{"name": "Ryutaroh Matsumoto"}], "featured_authors": [{"name": "Ryutaroh Matsumoto"}], "author_count": 1}, {"id": "2609.23348", "category": "quant-ph", "title": "Field-Modified Quantum Potentials from Tridiagonal Representations: Analytical Spectra and Galerkin Simulations", "abstract": "We develop an effective radial framework for analyzing new field-modified potential function of a charged spinless particle in collinear electric and magnetic fields. Using the weak- magnetic field approximation, we neglect the diamagnetic term and other angular projections under an explicit smallness condition $\\ll \\Delta E$, where $E$ is the electric field, and the replacement of the angular factor by $C=\\cos\\theta$ in the spherical coordinates. The resulting equation is therefore a field-aligned radial model whose validity is limited to angularly localized states. Within this setting, we apply the indirect mode (or search mode) of Tridiagonal representation approach in the Laguerre and Jacobi bases. In the Laguerre basis, the tridiagonal constraint generates linear-plus-inverse and linear-plus-quadratic radial potentials, and the coefficient recurrences are connected with Meixner--Pollaczek and Meixner polynomial type structures, therefore yielding the analytic spectra and expansion wavefunctions. In the Jacobi basis, the mapping of the radial half-line to a finite interval produces a singular confining effective potential and a three-term recurrence that is treated through a truncated generalized eigenvalue problem. The formulation provides analytically and numerically tractable benchmark models for field-modified potential functions, while keeping the assumptions, parameter restrictions, endpoint behavior, and convergence tests explicit. All energy spectra formulae obtained under the present models are new and are coupled with magnetic fields analytically and numerically when using the Laguerre bases and the Jacobi bases respectively.", "url": "https://arxiv.org/abs/2609.23348", "type": "理论+数值", "summary": "1. 我们开发了一种有效的径向框架，用于分析共线电场和磁场中带电无自旋粒子的新场修改势函数。\n2. 在雅可比基中，将径向半线映射到有限区间会产生奇异的限制有效势和通过截断广义特征值问题处理的三项递推。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Tunde Joseph Osunmusanmi"}, {"name": "Berihu Teklu"}], "featured_authors": [{"name": "Tunde Joseph Osunmusanmi"}, {"name": "Berihu Teklu"}], "author_count": 2}, {"id": "2609.23353", "category": "quant-ph", "title": "Eigenvalue-by-Eigenvalue Comparison of a Sierra--Rodríguez-Laguna-Type Spectrum with the Riemann Zeros", "abstract": "We study the self-adjoint extension of the Sierra--Rodríguez-Laguna (SR) $H=xp$-type Hamiltonian $\\widehat H_{SR}$. Its discrete spectrum is fixed by the equation $\\mathrm{Re}\\!\\left[e^{-i\\theta/2}K_{1/2+iE/2}(2\\pi)\\right]=0$. We solve this equation numerically for $\\theta=1.417\\pi$ and obtain the first 606 eigenvalues $E_n$. We compare them, one by one, with the ordinates $\\gamma_n$ of the first 606 nontrivial zeros of the Riemann zeta function. Using the steepest-descent (saddle-point) method for the modified Bessel function, together with the Riemann--von Mangoldt formula, we derive a closed-form prediction for $E_n-\\gamma_n$ in terms of the Lambert-$W$ function. We show that our leading-order phase for $K_{1/2+iE/2}(2\\pi)$ matches exactly a known, rigorous asymptotic formula for modified Bessel functions of large imaginary order. This rules out the Bessel function as the source of a numerical mismatch we found earlier. We then trace that mismatch to how the counting function $N(T)$ must be treated exactly at $T=\\gamma_n$: the usual midpoint convention for the fluctuating term $S(T)$ shifts the effective quantum number by $1/2$. With this fix, $\\gamma_n\\sim g(n-11/8)$ instead of $g(n-7/8)$, and the new prediction for $E_n-\\gamma_n$ matches, to within $0.03\\%$, the value we measure directly from the first $10^5$ tabulated zeta zeros (A.~Odlyzko).", "url": "https://arxiv.org/abs/2609.23353", "type": "理论+数值", "summary": "1. 作者数值求解了SR型H=xp哈密顿量自伴扩张在θ=1.417π时的离散谱，取前606个本征值与前606个Riemann zeta非平凡零点逐一比较。\n2. 其技术核心是用鞍点法与Riemann–von Mangoldt公式导出E_n−γ_n的Lambert-W闭式，并把旧偏差归因于S(T)在T=γ_n处的中点约定使有效量子数偏移1/2。\n3. 修正后γ_n∼g(n−11/8)，新预测与Odlyzko前10^5个零点直接测量值相差小于0.03%，表明计数函数在T=γ_n处的精确处理对谱-零点比较至关重要。", "summary_source": "deepseek", "authors": [{"name": "Mi-Ra Hwang"}, {"name": "Eylee Jung"}, {"name": "MuSeong Kim"}, {"name": "DaeKil Park"}], "featured_authors": [{"name": "Mi-Ra Hwang"}, {"name": "Eylee Jung"}, {"name": "MuSeong Kim"}, {"name": "DaeKil Park"}], "author_count": 4}, {"id": "2609.23406", "category": "quant-ph", "title": "Quantum scattering by intersecting δ-potential barriers: from Gaudin's kaleidoscope to quantum Galperin billiards", "abstract": "We develop a general framework for the scattering of a plane wave by a class of Gaudin kaleidoscope models: straight $\\delta$-potential barriers intersecting at a common point. The projected Lippmann-Schwinger equations split into a singular part, a finite pole closure generated by a geometric moving rule, and a regular remainder, the outgoing state being an atomic measure on the circle. At the special angles $\\pi/N$, where the intersecting barriers generate the dihedral group $D_N$, the number of channels stays fixed, whereas at generic angles channels are created and destroyed, opening smoothly from zero weight as a critical direction is crossed. This leaves no singular trace in the probabilities, being carried instead by the phase shifts, a quantum-classical correspondence beyond the reach of the coordinate Bethe ansatz. The same equations solve the quantum Galperin billiards exactly, the method of images reducing them to a single linear system whose phase shifts follow in closed form.", "url": "https://arxiv.org/abs/2609.23406", "type": "理论", "summary": "1. 该工作建立了平面波在共点相交δ势垒（Gaudin万花筒模型）上散射的通用框架，并以同一方程精确求解量子Galperin台球。\n2. 其核心是将投影Lippmann-Schwinger方程拆为奇异项、由几何移动规则生成的有限极点闭包与正则余项，使出射态为圆上原子测度；在π/N角对应二面体群D_N时通道数固定，一般角下通道从零权重平滑产生或湮灭，奇异性不显于概率而由相移承载，镜像法进一步把台球问题化为单一线性系统并给出闭式相移。\n3. 这揭示了超出坐标Bethe拟设的量子-经典对应，并为以相移刻画通道演化的相交势垒散射和可积台球模型提供了可推广的精确求解思路。", "summary_source": "deepseek", "authors": [{"name": "Yi-Cong Yu"}, {"name": "Wen-Jie Qiu"}, {"name": "Xiaoming Cai"}], "featured_authors": [{"name": "Yi-Cong Yu"}, {"name": "Wen-Jie Qiu"}, {"name": "Xiaoming Cai"}], "author_count": 3}, {"id": "2609.23420", "category": "quant-ph", "title": "Feedback-Induced Dynamical Phases in a Self-Adaptive Quantum Kicked Rotor", "abstract": "We introduce a self-adaptive Floquet system based on a quantum kicked rotor, in which the kicking strength itself becomes a dynamical variable generated self-consistently through cavity-mediated feedback. A superradiant transition gives rise to cavity-mediated kicking and two competing instability channels, symmetric and antisymmetric, which provide a unified organizing principle for the nonequilibrium Floquet phases. For resonant kicking, their competition produces double-kick dynamics that support resonant ballistic transport and an emergent antiresonance with period-quadrupled rotor evolution, arising from a balance between the two instability channels. Remarkably, for incommensurate kicking, the antisymmetric instability stabilizes a robust period-doubled localized phase with persistent subharmonic dynamics despite the underlying incommensurate driving, revealing localized temporal order absent in conventional kicked rotors. As the feedback strength increases, correlated temporal fluctuations progressively suppress quantum interference, driving crossovers from period-doubled localization to irregular localization and eventually to subdiffusive transport. Our results establish a general framework for self-adaptive quantum-chaotic dynamics and demonstrate how dynamical feedback can fundamentally reshape transport, localization, and temporal order in driven quantum systems.", "url": "https://arxiv.org/abs/2609.23420", "type": "理论", "summary": "1. 该工作提出一个基于量子受踢转子的自适应弗洛凯系统，其中踢击强度由腔介导反馈自洽地成为动力学变量。\n2. 关键卖点是超辐射转变同时产生腔介导踢击与对称、反对称两条竞争不稳定性通道，统一解释共振踢击的双踢弹道输运、周期四倍反共振，以及非公度踢击下反对称通道稳定的周期倍增局域相。\n3. 反馈增强时关联时间涨落逐渐抑制量子干涉，驱动体系由周期倍增局域经不规则局域走向亚扩散输运，表明动力学反馈可重塑驱动量子系统的输运、局域和局域时序，并建立自适应量子混沌动力学的通用框架。", "summary_source": "deepseek", "authors": [{"name": "Pan Gao"}, {"name": "Zheng-Wei Zhou"}, {"name": "Guang-Can Guo"}, {"name": "Xi-Wang Luo"}], "featured_authors": [{"name": "Pan Gao"}, {"name": "Zheng-Wei Zhou"}, {"name": "Guang-Can Guo"}, {"name": "Xi-Wang Luo"}], "author_count": 4}, {"id": "2609.23441", "category": "quant-ph", "title": "Entanglement Cost of Optimal Distributed Quantum State Purification", "abstract": "We determine the preshared entanglement required for spatially separated parties, restricted to local operations and classical communication, to attain globally optimal probabilistic two-copy purification of arbitrary bipartite pure states under depolarizing noise. In every local dimension $d\\ge 2$, one shared maximally entangled qubit pair suffices: local controlled-SWAP operations exactly reproduce the globally optimal successful transformation. Conversely, any finite-dimensional preshared resource state that attains the same benchmark, even under a positive-partial-transpose relaxation, must have entanglement of formation at least one ebit. For pure resources with one ebit, or for two-qubit resources including mixed states, attaining the benchmark is possible only for states with exactly two nonzero Schmidt weights, both equal to $1/2$, namely those locally unitarily equivalent to a maximally entangled qubit pair. These findings provide a benchmark for evaluating the entanglement demands of noise management in quantum networks and modular quantum computers.", "url": "https://arxiv.org/abs/2609.23441", "type": "理论", "summary": "1. 我们确定了空间分离各方所需的预共享纠缠，仅限于本地操作和经典通信，以在去极化噪声下实现任意二分纯态的全局最优概率双拷贝纯化。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Jiayi Zhao"}, {"name": "Chengkai Zhu"}, {"name": "Xin Wang"}, {"name": "Ge Bai"}], "featured_authors": [{"name": "Jiayi Zhao"}, {"name": "Chengkai Zhu"}, {"name": "Xin Wang"}, {"name": "Ge Bai"}], "author_count": 4}, {"id": "2609.23455", "category": "quant-ph", "title": "Zero-Knowledge Proofs of Quantumness", "abstract": "With the rapid development of quantum computers, proofs of quantumness have recently become an interesting research direction. However, in current schemes for proofs of quantumness, quantum provers face the risk of being maliciously exploited by classical verifiers. Through malicious strategies in interaction with quantum provers, classical verifiers could solve some instances of hard problems that arise from the specific scheme in use. This is due to the lack of formalization that prevents malicious verifiers from extracting useful information in proofs of quantumness. To address this issue, we formalize zero-knowledge proofs of quantumness. Intuitively, the zero-knowledge property necessitates that the information gained by the classical verifier from interactions with the quantum prover should not surpass what can be simulated using a simulated classical prover interacting with the same verifier. As a result, the new zero-knowledge notion can prevent a malicious verifier from exploiting quantum advantage. We find that the classical zero-knowledge proof is sufficient to compile some existing proofs of quantumness schemes into zero-knowledge proofs of quantumness schemes. It appears to be more general to require zero-knowledge proof on the verifier side instead of the prover side. This helps to regulate the verifier's behavior from malicious to be honest-but-curious. As a result, both parties will play not only one role in the proofs of quantumness but also the dual role in the classical zero-knowledge proof. Specifically, Shor's factoring-based scheme and the learning with errors-based scheme in [Brakerski et al., FOCS, 2018] can be transformed into zero-knowledge proofs of quantumness by requiring an extractable non-interactive zero-knowledge argument on the verifier side. Zero-knowledge proofs of quantumness can thus be viewed as an enhanced security notion for proofs of quantumness.", "url": "https://arxiv.org/abs/2609.23455", "type": "理论", "summary": "1. 该工作形式化了量子性证明的零知识性质，以阻止经典验证者借恶意交互从量子证明者处提取有用信息。\n2. 其要点是只需在验证者侧要求可提取的非交互零知识论证，即可将Shor分解与LWE等既有量子性证明方案编译为零知识版本。\n3. 这为量子性证明给出更强安全概念，把验证者由恶意规约为半诚实，并使双方在协议中承担对偶角色。", "summary_source": "deepseek", "authors": [{"name": "Duong Hieu Phan"}, {"name": "Weiqiang Wen"}, {"name": "Xingyu Yan"}, {"name": "Jinwei Zheng"}], "featured_authors": [{"name": "Duong Hieu Phan"}, {"name": "Weiqiang Wen"}, {"name": "Xingyu Yan"}, {"name": "Jinwei Zheng"}], "author_count": 4}, {"id": "2609.23476", "category": "quant-ph", "title": "Comparative Study of Quantum and Classical Machine Learning Models in Binary Classification", "abstract": "A potential path forward is Quantum Machine Learning (QML), which aims to leverage quantum computing in conjunction with classical machine learning to enhance computing efficiency and the expressiveness of models. In this paper, two different quantum classifiers - Variational Quantum Classifier (VQC) and Quantum Kernel Support Vector Machine (QSVM) - are compared with three classical classifiers as baseline classifiers - Logistic Regression, Support Vector Machine (SVM), and a Multi-Layer Perceptron (MLP) - on the Breast Cancer Wisconsin dataset. The quantum circuits were created in the PennyLane framework and simulated on a classical backend. However, in terms of accuracy, classical Logistic Regression performed better with an accuracy of 97.8%, classical SVM and QSVM with an accuracy of 95.6% each, although the Quantum VQC achieved a lower accuracy of 88.9% and had a recall of 100% for the benign class, though it correctly identified only 12 of the 17 malignant cases (a malignant-class recall of approximately 70.6%). The drawback of quantum models is the higher training time; however, since the quantum circuit needs to be classically simulated, the quantum SVM took 23.29 seconds compared to less than 0.01 seconds for the classical linear models. These results indicate that for small structured datasets, classifiers based on quantum computing have not yet surpassed well-tuned classical counterparts. In some respects (e.g., benign-class recall), they perform competitively, though not on malignant-class recall, where the VQC in particular performed worse than the classical baselines, which is worth further investigation on real quantum computers.", "url": "https://arxiv.org/abs/2609.23476", "type": "理论+数值", "summary": "1. 该工作在威斯康星乳腺癌二分类数据集上，将变分量子分类器（VQC）与量子核支持向量机（QSVM）同逻辑回归、经典SVM及多层感知机进行对比。\n2. 量子线路在PennyLane中构建并经典模拟；逻辑回归准确率最高97.8%，经典SVM与QSVM均为95.6%，VQC为88.9%，其对良性类召回率100%、恶性类仅70.6%；量子模型训练耗时更长，QSVM需23.29秒，经典线性模型不足0.01秒。\n3. 这表明在小规模结构化数据上，量子分类器尚未超越调优良好的经典模型；良性类召回等指标具竞争力，但恶性类召回不足，需在真实量子硬件上进一步检验。", "summary_source": "deepseek", "authors": [{"name": "Anand Kumar Mishra"}, {"name": "Ramanuj Awasthi"}], "featured_authors": [{"name": "Anand Kumar Mishra"}, {"name": "Ramanuj Awasthi"}], "author_count": 2}, {"id": "2609.23609", "category": "quant-ph", "title": "Casimir force in a water nanolayer confined by graphene sheets", "abstract": "Casimir forces, arising from quantum and thermal fluctuations, depend strongly on the electromagnetic susceptibilities of the interacting materials. Here, we theoretically investigate the Casimir force between two graphene sheets separated by a nanometer-thin layer of liquid water. We find that, at thicknesses up to 3.4 nm, the confinement reduces the Casimir force by up to 26 % compared to the bulk case. At larger thicknesses, the bulk model underestimates the Casimir force by up to 42 % due to the interface effect. This effect does not decrease monotonically as a function of the layer thickness: it increases up to a maximum at 70 nm and it slowly declines to the bulk limit only at 2 microns. We separately assess the effect of nanoscale confinement on the electronic response of graphene, which has no effect on the Casimir force.", "url": "https://arxiv.org/abs/2609.23609", "type": "理论", "summary": "1. 该工作理论计算了两层石墨烯间纳米厚液态水层中的卡西米尔力，并与体相水情形对比。\n2. 其卖点在于揭示限域至3.4 nm使力较体相降低达26%，更厚时体相模型因界面效应低估达42%，且该效应在70 nm达峰、约2 μm才消失。\n3. 该工作还表明石墨烯电子响应的纳米限域变化对卡西米尔力无影响，提示水层界面效应在石墨烯纳米器件中需纳入考量。", "summary_source": "deepseek", "authors": [{"name": "Wijnand Broer"}, {"name": "Jure Dobnikar"}], "featured_authors": [{"name": "Wijnand Broer"}, {"name": "Jure Dobnikar"}], "author_count": 2}, {"id": "2609.23633", "category": "quant-ph", "title": "Spectral width and polynomial degree in perfect state transfer", "abstract": "We study the minimum time for perfect state transfer under polynomial Hamiltonians with bounded degree and spectral width. For a strongly cospectral pair and width bound $W$, the optimum, when finite, is an integer multiple of $\\pi/W$, determined by integer interpolation with prescribed parities. For equally spaced supported eigenvalues with alternating signs, we give degree bounds under which every minimizer is affine, and sharp asymptotics for each fixed exact degree. Near-minimizing phase polynomials satisfy a quantitative Chebyshev stability estimate. We determine the optimal transfer time for every degree bound on hypercubes of odd prime dimension. For complementary vertices of $J(2m,m)$, the optimal time at fixed spectral width grows exponentially in $m$ throughout an interval of feasible degrees. We also construct polynomial Hamiltonians showing that every feasible degree $m-t$ with $t=o(m)$ admits subexponential transfer time.", "url": "https://arxiv.org/abs/2609.23633", "type": "理论", "summary": "1. 该文研究多项式哈密顿量在次数与谱宽受限下实现完美态传输的最短时间，刻画最优时间与整数插值及奇偶约束的关系。\n2. 核心结论是有限最优时间必为 π/W 的整数倍，并给出等距交替谱、超立方体及 J(2m,m) 的次数界、渐近与切比雪夫稳定性估计。\n3. 该工作揭示谱宽、次数与传输时间间的定量权衡，为设计亚指数传输及识别指数慢化机制提供启发。", "summary_source": "deepseek", "authors": [{"name": "Xingkun Song"}], "featured_authors": [{"name": "Xingkun Song"}], "author_count": 1}, {"id": "2609.23648", "category": "quant-ph", "title": "Dynamics of nonclassicality in a generalized Tavis Cummings model with XY spin $(1/2,1)$ atomic interactions", "abstract": "We investigate the dynamics of nonclassicality, quantified by the Wigner Yanase skew information, in generalized Jaynes Cummings (JC) and Tavis Cummings (TC) models describing light matter interactions in cavity quantum electrodynamics. We first analyze a generalized JC model consisting of a single bosonic cavity mode coupled to a spin 1 atom, focusing on the temporal evolution of nonclassicality in both the cavity field and the atomic subsystem. We then extend this framework to a generalized TC model by introducing an additional spin $1/2$ atom, enabling us to examine the influence of collective atomic degrees of freedom. The global dynamics are investigated both with and without an $XY$ spin interaction. Our results show that, under resonance conditions, the system exhibits efficient excitation exchange between the cavity field and the atomic subsystem, resulting in regular, coherent nonclassicality dynamics and enhanced field nonclassicality generation. Conversely, an increasing longitudinal magnetic field acts primarily as an effective detuning parameter rather than a direct exchange interaction. In this off resonant regime, the atom field coupling is substantially weakened, localizing excitations within the atomic subsystem. This localization suppresses coherent energy transfer to the cavity field, leading to a pronounced reduction in field nonclassicality, while the atomic subsystem retains the majority of the quantum correlations. Notably, atomic superposition states exhibit highly irregular spin dynamics, reflecting a detuning-induced redistribution of quantum correlations. These findings demonstrate that the dynamics of spin and field nonclassicality are governed primarily by interaction mediated excitation flow and resonance conditions rather than the initial energy distribution alone, ..", "url": "https://arxiv.org/abs/2609.23648", "type": "理论", "summary": "1. 该工作用Wigner-Yanase偏斜信息研究广义JC/TC模型中的非经典性动力学，并计入XY自旋相互作用。\n2. 其卖点在于揭示共振时腔场与原子高效交换激发并增强场非经典性，而纵向磁场主要充当有效失谐，使激发局域于原子并抑制场非经典性。\n3. 这表明自旋与场的非经典性主要由相互作用介导的激发流动和共振条件决定，而非仅由初始能量分布决定。", "summary_source": "deepseek", "authors": [{"name": "Bouchra El Alaoui"}, {"name": "Abdallah Slaoui"}, {"name": "Rachid Ahl Laamara"}], "featured_authors": [{"name": "Bouchra El Alaoui"}, {"name": "Abdallah Slaoui"}, {"name": "Rachid Ahl Laamara"}], "author_count": 3}, {"id": "2609.23651", "category": "quant-ph", "title": "Nonequilibrium energy transport and fluctuations in two-photon-driven nonlinear quantum optical systems", "abstract": "Understanding nonequilibrium transport and fluctuations driven by nonclassical light in nonlinear quantum optical systems is challenging. Here, we formulate a driven quantum master equation in the rotating frame combined with full counting statistics, retaining the drive-induced frequency shifts in the system-reservoir interactions and providing a unified description of drive-assisted incoherent transitions based on the rotated system dressed-basis. Applied to a Kerr resonator and a nonlinear Jaynes-Cummings model, the approach reveals pronounced multiphoton-resonant enhancement of the drive input energy current, with significant high peaks under two-photon driving compared to the single-photon case. The two-photon resonance relations are analytically obtained. Resonance structure in the nonlinear Jaynes-Cummings model nonlinearly relies on qubit-photon couplings, with additional dressed-state branches. A low-energy-state approximation attributes the resonant current enhancement to dressed-state hybridization and efficient activation of incoherent energy exchange processes. Beyond the average current, two-photon-driving induced energy exchange picture near resonance also substantially modifies the second-order current fluctuation and higher-order current cumulant, while increasing the time-normalized signal-to-noise ratio. Adding two-photon loss introduces extra incoherent photon-pair exchange pathways and further reshapes the current and its fluctuations. We hope these results may deepen interpretation of photon driving and quantum dissipation cooperatively governing nonequilibrium energy transport and fluctuations.", "url": "https://arxiv.org/abs/2609.23651", "type": "理论", "summary": "1. 理解非线性量子光学系统中非经典光驱动的非平衡输运和涨落具有挑战性。\n2. 除了平均电流之外，谐振附近的双光子驱动感应能量交换图也显着改变了二阶电流波动和高阶电流累积量，同时提高了时间归一化信噪比。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Y. T. Chen"}, {"name": "Y. W. Lu"}, {"name": "J. C. Lu"}, {"name": "C. Wang"}], "featured_authors": [{"name": "Y. T. Chen"}, {"name": "Y. W. Lu"}, {"name": "J. C. Lu"}, {"name": "C. Wang"}], "author_count": 4}, {"id": "2609.23657", "category": "quant-ph", "title": "QAOA-Based Pilot Assignment for Cell-Free Massive MIMO Systems", "abstract": "Pilot contamination is a major challenge in cell-free massive multiple-input multiple-output (MIMO) systems, where the limited number of orthogonal pilots makes pilot reuse unavoidable. Since the pilot assignment solution space grows exponentially with the number of users, finding the global optimum becomes computationally challenging on classical computers. Recent advances in quantum computing provide a promising approach for solving such large-scale combinatorial optimization problems. In this paper, we reformulate the assignment problem as a quantum-compatible optimization problem, enabling it to be directly solved by the Quantum Approximate Optimization Algorithm (QAOA). Specifically, the pilot contamination objective and assignment constraints are incorporated into the QAOA formulation. This allows the quantum search to focus on valid pilot assignments with low contamination cost. Simulation results show that the proposed method achieves performance close to exhaustive search, demonstrating the potential of quantum-assisted optimization for pilot assignment in future wireless systems.", "url": "https://arxiv.org/abs/2609.23657", "type": "数值", "summary": "1. 该工作面向无蜂窝大规模MIMO系统中的导频污染难题，将有限正交导频下的导频分配重构为可直接由量子近似优化算法（QAOA）求解的组合优化问题。\n2. 关键创新是将导频污染代价与合法分配约束一并编码进QAOA目标函数，让量子搜索集中于低污染且可行的解，从而在仿真中取得接近穷举搜索的性能。\n3. 这表明量子辅助优化有望用于未来无线网络中的大规模导频分配，但其实际优势仍取决于量子硬件规模、噪声水平与经典算法的竞争关系。", "summary_source": "deepseek", "authors": [{"name": "Xiaoyu Ma"}, {"name": "Fang Fang"}, {"name": "Xianbin Wang"}], "featured_authors": [{"name": "Xiaoyu Ma"}, {"name": "Fang Fang"}, {"name": "Xianbin Wang"}], "author_count": 3}, {"id": "2609.23664", "category": "quant-ph", "title": "QuWARP: A Workload-Aware Reuse Planner for simulating Quantum Circuits", "abstract": "Quantum circuit simulation often appears as repeated-run workloads rather than isolated circuits: variational quantum eigensolver (VQE) sweeps, noisy multishot studies, and quantum error correction (QEC) cycles revisit closely related structure across many runs. Existing simulators optimise individual executions well, but they largely ignore cross-task shared state and therefore repeat work that could be reused safely. We propose QuWARP, a planner-based workload optimiser for a bounded state of the art simulator execution surface: it performs workload-level planning over related tasks, identifies shared prefixes, and chooses when to materialize exact typed boundary artifacts for later reuse across the evaluated statevector mode, and stabilizer-hybrid mode. Its planner treats continuation legality as a narrow correctness guardrail, abstains when reuse is unprofitable, and keeps each reuse, abstention, or refusal decision auditable through EXPLAIN-style traces, meaning inspectable planner reports with provenance and realized-cost summaries. Across real world quantum application workloads QuWARP delivers 2.95x-32.84x speedups over this work's main direct per-task Qrack denominator on reuse-positive workloads. These results show workload-level reuse planning improves repeated-run simulation while keeping unsupported handoffs auditable and out of the execution path.", "url": "https://arxiv.org/abs/2609.23664", "type": "理论+数值", "summary": "1. 该工作提出 QuWARP，一种面向量子线路仿真的工作负载级复用规划器，针对 VQE 扫描、噪声多次采样与 QEC 周期等重复运行任务，在既有态矢量与稳定子混合执行面上进行跨任务规划并识别共享前缀。\n2. 其核心是仅将延续合法性作为狭窄正确性护栏，在复用无利可图时主动弃用，并以 EXPLAIN 式可审计轨迹记录复用、弃用或拒绝决策，从而安全物化精确类型化边界工件供后续复用。\n3. 在真实量子应用负载上，该规划对复用正收益任务较逐任务 Qrack 基线取得 2.95 倍至 32.84 倍加速，表明工作负载级复用规划能提升重复运行仿真，并使不支持的交接保持可审计且不进入执行路径。", "summary_source": "deepseek", "authors": [{"name": "Tim Littau"}, {"name": "Rihan Hai"}], "featured_authors": [{"name": "Tim Littau"}, {"name": "Rihan Hai"}], "author_count": 2}, {"id": "2609.23721", "category": "quant-ph", "title": "Non-Hermitian quantum phase transitions in the XY model induced by staggered imaginary Dzyaloshinskii--Moriya interaction", "abstract": "We investigate non-Hermitian quantum phase transitions driven by staggered imaginary Dzyaloshinskii--Moriya (DM) interactions in a transverse-field $XY$ chain. By virtue of a staggered nonunitary transformation, we exactly diagonalize the Hamiltonian. For $D<1$, this procedure maps the non-Hermitian model onto a standard Hermitian $XY$ chain, allowing analytical derivation of the full phase boundaries. The parameter line $D=1$ forms an exceptional boundary with coalesced quasiparticle eigenvalues and eigenvectors, while the entire $D>1$ regime falls into the $\\mathcal{RT}$-symmetry-broken phase containing two distinct $z$-ferromagnetic phases. We examine common quantum-information probes and show that conventional measures, such as entanglement entropy, quantum discord, and quantum coherence, fail to capture the $\\mathcal{RT}$ symmetry-breaking transition. To address this deficiency, we propose a novel coherence measure $\\widetilde{\\mathrm{QC}}_{\\max}^{\\rm LR}$ based on $\\mathcal{RT}$ symmetry and complex-conjugate eigenpair correlations. Embedding intrinsic non-Hermitian information of left and right eigenstates, $\\widetilde{\\mathrm{QC}}_{\\max}^{\\rm LR}$ reliably identifies the $\\mathcal{RT}$ symmetry-breaking transition and accurately resolves all magnetic phase boundaries.", "url": "https://arxiv.org/abs/2609.23721", "type": "理论", "summary": "1. 该工作研究了横向场 XY 链中由交错虚 DM 相互作用驱动的非厄米量子相变，并通过交错非幺正变换实现严格对角化。\n2. 关键在于 D<1 时映射为厄米 XY 链并解析给出相界，D=1 是本征值与本征矢合并的例外边界，D>1 则为含两个 z 铁磁相的 RT 对称破缺区。\n3. 该工作表明纠缠熵等常规度量无法刻画 RT 对称破缺，而基于左右本征态共轭配对的相干度量可分辨全部磁相边界，为非厄米相变探测提供新思路。", "summary_source": "deepseek", "authors": [{"name": "Hong Jiang"}, {"name": "Xiang-Ping Jiang"}, {"name": "Yan-Chao Li"}], "featured_authors": [{"name": "Hong Jiang"}, {"name": "Xiang-Ping Jiang"}, {"name": "Yan-Chao Li"}], "author_count": 3}, {"id": "2609.23756", "category": "quant-ph", "title": "Flow-Based Lattice Surgery Optimization with Runtime T Gate Scheduling", "abstract": "Lattice surgery on the surface code is a leading route to fault-tolerant quantum computation. Compiling logical circuits into lattice surgery operations is a pivotal step that determines the resource cost of a computation. Prior compilers build on idealized assumptions, and one that works in practical settings remains to be developed. Existing works are either unscalable or route one gate at a time within a layer, so the embedding depends on the order of gates and opportunities to route many gates at once are lost. In addition, they assume magic states are always available and cost-free, even though preparing one costs more than a Clifford operation. We present FlowRouter, the first topological lattice surgery compiler that places Clifford routing and stochastic magic state cultivation inside a single 3D embedding. At compile time, FlowRouter formulates the routing of an entire circuit layer as a maximum-flow problem, embedding many gates simultaneously. At runtime, it allows magic states to be cultivated at every idling patch, works with the realistic cultivation process with multiplexing and multi-stage post-selections, and absorbs the stochasticity by introducing delay mechanisms that add as little spacetime volume as possible. With magic states assumed free, FlowRouter reduces spacetime volume by 2.3x and compiles 10.8x faster than the state-of-the-art static topological lattice surgery compiler. With the cultivation-aware setting that includes both Clifford and magic state cost, FlowRouter reduces spacetime volume by 2.3x on a distance-13 surface code when compared with the state-of-the-art runtime compiler.", "url": "https://arxiv.org/abs/2609.23756", "type": "理论+数值", "summary": "1. 该工作提出 FlowRouter，首个将 Clifford 路由与随机魔法态培养纳入同一三维嵌入的拓扑表面码格点手术编译器，并在编译期把整层门的布线建模为最大流问题以同时嵌入多门。\n2. 其卖点在于运行时在每个空闲补丁上培养魔法态、支持复用与多级后选择，并用延迟机制以尽量小的时空体积吸收随机性，同时计入 Clifford 与魔法态代价。\n3. 在距离 13 的表面码上，该培养感知方案相比最优运行时编译器仍将时空体积降低 2.3 倍，提示统一建模路由与魔法态成本是实用容错量子编译的关键方向。", "summary_source": "deepseek", "authors": [{"name": "Raymond Iacobacci"}, {"name": "Tianyi Hao"}, {"name": "Neer Patel"}, {"name": "Siyuan Niu"}], "featured_authors": [{"name": "Raymond Iacobacci"}, {"name": "Tianyi Hao"}, {"name": "Neer Patel"}, {"name": "Siyuan Niu"}], "author_count": 4}, {"id": "2609.23942", "category": "quant-ph", "title": "Lee-Yang theorem for fermions", "abstract": "Lee-Yang theorems are a powerful tool for studying many-body systems, with applications ranging from analyzing phase transitions to proving the efficiency of certain classical and quantum algorithms. In this work, we prove a Lee-Yang zero-freeness theorem for the partition function of a broad class of interacting fermion models, implying the existence of a provably efficient quantum algorithm for estimating their ground-state energies. This class includes several well-known models such as the attractive Hubbard model, repulsive Hubbard model on bipartite graphs, and the interacting Hofstadter model. Our results also rigorously establish the nonexistence of phase transitions in these models in the presence of a nonzero local external field.", "url": "https://arxiv.org/abs/2609.23942", "type": "理论+数值", "summary": "1. 该工作证明了一类相互作用费米子模型配分函数的Lee-Yang无零点定理。\n2. 其技术卖点是该无零点性蕴含可证明高效估计基态能量的量子算法，且适用于吸引与二分图排斥Hubbard及相互作用Hofstadter模型。\n3. 这也严格表明，在非零局域外场下相关模型不存在相变，并凸显Lee-Yang判据对量子算法效率的启发。", "summary_source": "deepseek", "authors": [{"name": "Chaithanya Rayudu"}, {"name": "Takahiro Misawa"}, {"name": "Andrew Zhao"}, {"name": "Jun Takahashi"}], "featured_authors": [{"name": "Chaithanya Rayudu"}, {"name": "Takahiro Misawa"}, {"name": "Andrew Zhao"}, {"name": "Jun Takahashi"}], "author_count": 4}, {"id": "2609.23946", "category": "quant-ph", "title": "A constructive violation of additivity of minimum output von Neumann entropy", "abstract": "We give an explicit non-random example of nonadditivity of minimum output von Neumann entropy. The proof uses a finite-dimensional construction which imitates free Haar unitary behavior. The same channel also gives a violation of additivity for the minimum output Rényi-$p$ entropy for any $1\\le p\\le\\infty$.", "url": "https://arxiv.org/abs/2609.23946", "type": "理论", "summary": "1. 该工作构造了一个显式非随机反例，证明最小输出冯诺依曼熵的可加性不成立。\n2. 其证明借助有限维构造模仿哈尔酉行为，且同一信道对任意 1≤p≤∞ 的最小输出雷尼-p熵也破坏可加性。\n3. 这表明最小输出熵可加性并非普遍成立，为量子信道容量及相关熵不等式的边界提供了明确约束。", "summary_source": "deepseek", "authors": [{"name": "Laura Shou"}, {"name": "Alexey V. Gorshkov"}], "featured_authors": [{"name": "Laura Shou"}, {"name": "Alexey V. Gorshkov"}], "author_count": 2}, {"id": "2609.23960", "category": "quant-ph", "title": "Global zero-excitation state preparation through subsystem cooling", "abstract": "Preparing interacting quantum systems in low-energy or ground states is a fundamental task in quantum simulation and quantum information processing. In realistic settings, dissipation and active cooling can typically be engineered only on a limited subset of the system. We study the dissipative dynamics of excitation-number conserving quantum systems governed by a GKLS master equation with local jump operators acting on a subset of qubits. We establish sufficient conditions under which such localized dissipation drives the full system to a unique globally attractive zero-excitation state. In particular, we prove that if the Hamiltonian generates excitation transfer described by a graph for which the dissipative subsystem forms a zero forcing set, then the zero-excitation state is the unique globally attractive stationary state. When this state coincides with a ground state of the Hamiltonian, the same mechanism realizes ground-state cooling. Our results provide a graph-theoretic criterion for global state preparation from localized dissipation, which we illustrate using a nearest-neighbor Heisenberg spin chain. For this model, a reduction to the single-excitation sector further yields a scaling estimate with the length of the chain which indicates efficient cooling.", "url": "https://arxiv.org/abs/2609.23960", "type": "理论+数值", "summary": "1. 该工作研究激发数守恒量子系统在GKLS主方程下、仅由部分量子比特上的局域跃迁算符驱动时的耗散动力学，给出局域耗散将整个系统驱动至唯一全局吸引零激发态的充分条件。\n2. 其核心判据是：若哈密顿量所对应的激发输运图使耗散子系统构成零强迫集，则零激发态为唯一全局吸引稳态；当该态恰为基态时，同一机制即实现基态冷却，从而将全局态制备归结为图论条件。\n3. 作者以最近邻Heisenberg自旋链为例，借助单激发子空间约化给出随链长变化的标度估计，表明该判据可指导局域冷却方案的有效性评估与后续实验设计。", "summary_source": "deepseek", "authors": [{"name": "Kerstin Beer"}, {"name": "Daniel Burgarth"}], "featured_authors": [{"name": "Kerstin Beer"}, {"name": "Daniel Burgarth"}], "author_count": 2}, {"id": "2609.24074", "category": "quant-ph", "title": "Trace-distance-based complementarity relations in a multipath interferometer", "abstract": "The complementarity relations in an interferometer reflect an important phenomenon in quantum mechanics: wave-particle duality. Here, we develop a method to quantify both wave and particle behaviors in a multi-path interferometer. In particular, we find that the trace distance is a good candidate for wave and particle measures. As a result, some duality relations and triality ralations are established respectively. This work not only extends the application of the trace distance to the interferometer, but also opens up new perspectives on the quantification of waveness and particleness.", "url": "https://arxiv.org/abs/2609.24074", "type": "理论", "summary": "1. 该工作在多路径干涉仪中发展了一套基于迹距离的波粒二象性互补关系量化方法。\n2. 其核心在于将迹距离用作波动与粒子行为的度量，并分别导出若干对偶与三象关系。\n3. 这不仅把迹距离的应用拓展到干涉仪，也为波动性与粒子性的量化提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Yue Sun"}, {"name": "Jingyan Liu"}, {"name": "Peng-Tong Li"}, {"name": "Chenxu Li"}, {"name": "Ming-Jing Zhao"}], "featured_authors": [{"name": "Yue Sun"}, {"name": "Jingyan Liu"}, {"name": "Peng-Tong Li"}, {"name": "Chenxu Li"}, {"name": "Ming-Jing Zhao"}], "author_count": 5}, {"id": "2609.24147", "category": "quant-ph", "title": "Reconstructing the phonon distribution of trapped ions out of the Lamb-Dicke regime", "abstract": "Characterizing the phonon distribution of trapped-ion motional states is essential for many applications in quantum information processing, but existing methods become ill-conditioned beyond the Lamb-Dicke regime. We overcome this limitation by recasting phonon-state reconstruction as a filter-function inversion problem. Using composite pulses on the carrier and multiple sidebands, we engineer well-conditioned filters in phonon space to characterize pure and mixed states, study heating dynamics, and reconstruct Fock states up to $n=250$.", "url": "https://arxiv.org/abs/2609.24147", "type": "理论", "summary": "1. 该工作将囚禁离子声子分布重构重述为滤波器函数反演问题，用载波与多边带复合脉冲在声子空间设计良态滤波器，从而在兰姆-迪克区外表征纯态与混态、研究加热动力学，并重构至含250个声子的福克态。\n2. 其核心卖点在于突破兰姆-迪克区外重构病态的限制：复合脉冲能在载波与多个边带上工程化滤波器响应，使反演在宽声子占据数范围内保持良条件。\n3. 这为超出兰姆-迪克区的囚禁离子量子信息处理提供了稳定的声子态诊断，并可启发利用复合脉冲滤波器反演研究大福克态、加热与退相干等动力学。", "summary_source": "deepseek", "authors": [{"name": "Christophe H. Valahu"}, {"name": "Prachi Nagpal"}, {"name": "Teerawat Chalermpusitarak"}, {"name": "Maverick J. Millican"}, {"name": "Cameron McGarry"}, {"name": "Frank Scuccimarra"}, {"name": "Vassili G. Matsos"}, {"name": "Hon-Kwan Chan"}, {"name": "Ting Rei Tan"}], "featured_authors": [{"name": "Christophe H. Valahu"}, {"name": "Prachi Nagpal"}, {"name": "Teerawat Chalermpusitarak"}, {"name": "Vassili G. Matsos"}, {"name": "Hon-Kwan Chan"}, {"name": "Ting Rei Tan"}], "author_count": 9}, {"id": "2609.24266", "category": "quant-ph", "title": "A QSVT-Based Quantum Jacobi Algorithm for Linear Systems with Application to the Poisson Equation", "abstract": "Many computational fluid dynamics (CFD) algorithms solve partial differential equations by discretization, resulting in large and sparse systems of linear equations. While iterative methods are widely used to solve these systems classically, most existing quantum linear system solvers target the solution through matrix inversion rather than approximating it using an iterative procedure. In this work, we develop a quantum implementation of the Jacobi method based on quantum singular value transformation (QSVT). By reformulating the Jacobi iteration as a polynomial transformation of a block-encoded operator, the algorithm requires only a constant ancilla overhead with respect to the number of iterations while maintaining a circuit depth that scales linearly with the iteration number. We demonstrate the algorithm for one- and two-dimensional Poisson problems, including the pressure Poisson equation arising in Chorin's projection method for the lid-driven cavity flow. The proposed algorithm provides a promising building block for future quantum implementations of multigrid methods and preconditioning techniques, bringing quantum algorithms closer to established CFD solution strategies.", "url": "https://arxiv.org/abs/2609.24266", "type": "理论+数值", "summary": "1. 该工作提出基于量子奇异值变换的量子雅可比迭代算法，求解离散线性系统并演示一维与二维泊松问题。\n2. 其技术卖点是将雅可比迭代重写为块编码算子的多项式变换，辅助比特数恒定，线路深度随迭代次数线性增长。\n3. 这为未来量子多网格和预处理技术提供构建模块，使量子算法更接近成熟的计算流体力学求解策略。", "summary_source": "deepseek", "authors": [{"name": "Louisa M. Piskol"}, {"name": "Thorsten Grahs"}, {"name": "Stefan Langer"}, {"name": "Oleksandr Kyriienko"}], "featured_authors": [{"name": "Louisa M. Piskol"}, {"name": "Thorsten Grahs"}, {"name": "Stefan Langer"}, {"name": "Oleksandr Kyriienko"}], "author_count": 4}, {"id": "2609.24269", "category": "quant-ph", "title": "On the Born rule in a new quantum approach", "abstract": "In the context of a new approach towards quantum foundation, the Born rule is proved under a weak condition through several steps. The sole weak condition behind the Born rule is called the transition probability principle, which is closely related to the likelihood principle of statistics. This condition is discussed from several points of view. The whole approach leads to a simpler state concept than the traditional one in finite-dimensional quantum mechanics.", "url": "https://arxiv.org/abs/2609.24269", "type": "理论", "summary": "1. 该文在新的量子基础进路中，通过若干推导步骤，仅在单个弱条件成立时证明了玻恩规则。\n2. 其核心卖点在于将这一弱条件归结为“跃迁概率原理”，并指出它与统计学中的似然原理密切相关，继而从多个视角讨论该条件，使整个进路导向比传统有限维量子力学更简单的态概念。\n3. 这为澄清量子概率的起源及其与统计推断的联系提供了自洽思路，并可能启发后续研究以更简态描述重建有限维量子力学基础，或深化对量子公理体系的理解。", "summary_source": "deepseek", "authors": [{"name": "Inge S. Helland"}], "featured_authors": [{"name": "Inge S. Helland"}], "author_count": 1}, {"id": "2609.24282", "category": "quant-ph", "title": "Quantum Computing Solution of the Bethe-Salpeter Equation for Relativistic Scalar Bound States via Tensor-Network VQE", "abstract": "We present a gate-based quantum computing solution of the homogeneous Bethe-Salpeter equation (hBSE) for the bound state of two massive relativistic scalar particles interacting via ladder-approximation scalar exchange. After Wick rotation to Euclidean space and O(4) S-wave partial-wave projection, the hBSE is reduced to a symmetric matrix eigenvalue problem of dimension N = 2^n. We decompose the resulting Hamiltonian into a sum of n-qubit Pauli operators and solve it with the Variational Quantum Eigensolver (VQE) using a Matrix Product State (MPS) tensor-network ansatz. For N=16 (n=4 qubits), the VQE recovers the maximum eigenvalue - which encodes the minimum coupling constant for binding - to better than 1 % mean relative error compared to classical diagonalization. Entanglement analysis of the BSE amplitude shows low, area-law-like entanglement over the tested sizes, which motivates the MPS ansatz. A critical analysis of three independent barriers - exponential Pauli overhead, approximately size-independent low entanglement, and decreasing VQE gradient scales for the tested ansatz, consistent with generic barren-plateau concerns at larger n - reveals that the specific problem studied here lies in a classically tractable regime: over the tested range it is well described by low-bond-dimension tensor networks and efficiently handled by MPS/Lanczos methods. This negative result provides, to our knowledge, the first entanglement quantification of the BSE amplitude in qubit encoding, establishes the Pauli Hamiltonian framework for future BSE variants, and identifies 2D Minkowski-space BSE, N-body bound states, and non-ladder kernels as physically motivated extensions where genuine quantum advantage may become plausible.", "url": "https://arxiv.org/abs/2609.24282", "type": "理论+数值", "summary": "1. 该工作将 ladder 近似下相对论标量双粒子束缚态的齐次 Bethe-Salpeter 方程化为 Pauli 哈密顿量本征问题，并用 MPS-VQE 求解。\n2. 其技术卖点是在 N=16 时 VQE 以优于 1% 平均相对误差复原编码最小耦合的最大本征值，并首次量化 BSE 振幅的面积律低纠缠。\n3. 但 Pauli 项指数开销、低纠缠近尺寸无关及梯度随 n 下降表明该问题仍属经典可解区，量子优势或需 2D Minkowski、N 体或非 ladder 核。", "summary_source": "deepseek", "authors": [{"name": "Gerhard Hellstern"}], "featured_authors": [{"name": "Gerhard Hellstern"}], "author_count": 1}, {"id": "2609.24291", "category": "quant-ph", "title": "New lower bounds for CDS and $f$-routing", "abstract": "Understanding the entanglement cost of non-local quantum computation (NLQC) is relevant to complexity theory, cryptography, quantum gravity, and related areas. A central special case is $f$-routing, motivated in part by quantum position verification. Proving lower bounds on its entanglement cost in the fully robust setting has been a major open problem in NLQC. Motivated by this problem, we establish two related lower bounds. First, we study the shared-randomness cost of robust conditional disclosure of secrets (CDS). The connection between CDS and $f$-routing established by Allerstorfer et al. (Quantum 2024) makes understanding the randomness complexity of robust CDS a natural step toward lower bounds for the fully robust routing problem. We show that the shared-randomness cost of robust CDS is lower bounded by the logarithm of deterministic SMP communication complexity, even when communication and private randomness are unrestricted. Our lower bound is tight for the equality function. Second, we consider one-sided-perfect $f$-routing, in which the protocol is exact on one input class and has constant error on the other. By exploiting the positivity of the low-rank matrix arising in the method of Asadi, Culf, and May (ITCS 2025), we derive a general lower bound on the entanglement cost in terms of sign rank. In particular, this yields a linear lower bound on the entanglement cost of routing for the inner-product function in both one-sided-perfect settings, matching the known upper bound.", "url": "https://arxiv.org/abs/2609.24291", "type": "理论", "summary": "1. 该工作针对非局域量子计算中完全鲁棒 f-routing 的纠缠成本难题，建立了鲁棒条件秘密披露（CDS）与单侧完美 f-routing 两类新下界。\n2. 其关键结果有二：鲁棒 CDS 的共享随机性成本至少为确定性 SMP 通信复杂度的对数（即使通信与私有随机性不受限），且对相等函数紧；并利用 Asadi 等（ITCS 2025）方法中低秩矩阵的正性，以符号秩导出单侧完美路由的纠缠下界，得到内积函数的线性下界并匹配已知上界。\n3. 这揭示了 CDS 随机性、路由纠缠成本与通信复杂度及符号秩之间的定量联系，为推进完全鲁棒 f-routing 下界和量子位置验证等方向提供了明确的技术路径。", "summary_source": "deepseek", "authors": [{"name": "Atsuya Hasegawa"}, {"name": "Ranitha Mataraarachchi"}], "featured_authors": [{"name": "Atsuya Hasegawa"}, {"name": "Ranitha Mataraarachchi"}], "author_count": 2}, {"id": "2609.24316", "category": "quant-ph", "title": "A Sharp Noise Threshold for Shor's Quantum Factoring and Discrete Log Algorithms", "abstract": "We study the asymptotic behavior of Shor's quantum factoring and discrete log algorithms when noise affects the precise controlled rotation gates in their quantum Fourier transforms. Improving the results of Cai (2024) and Cai and Young (2025), we identify a sharp and vanishingly small noise threshold. If the noise level lies below this threshold, then the two algorithms succeed in expected polynomial time. If the noise level exceeds this threshold, then the algorithms provably fail to solve their respective problems in expected polynomial time when the underlying primes belong to a set of positive density.", "url": "https://arxiv.org/abs/2609.24316", "type": "数值", "summary": "1. 该工作研究了Shor因数分解与离散对数算法在量子傅里叶变换中精确受控旋转门受噪声影响时的渐近行为，并确定了一个尖锐的噪声阈值。\n2. 其技术卖点在于将此前Cai (2024)和Cai-Young (2025)的结果推进为一个尖锐且极小的阈值：低于阈值时两算法均在期望多项式时间内成功，高于阈值时对正密度素数集合可证无法在期望多项式时间内求解。\n3. 该结果揭示了精确受控旋转噪声对Shor类算法复杂度具有临界阈值作用，为容错量子计算中的噪声与纠错资源评估及相关下界分析提供了明确基准。", "summary_source": "deepseek", "authors": [{"name": "Jin-Yi Cai"}, {"name": "Ben Young"}], "featured_authors": [{"name": "Jin-Yi Cai"}, {"name": "Ben Young"}], "author_count": 2}, {"id": "2609.24475", "category": "quant-ph", "title": "Subspace Controllability in Variational Quantum Circuits: Maximising Expressivity and Increasing Search Efficiency with Dynamical Lie Algebras", "abstract": "Variational hybrid quantum models are a common paradigm for realising machine learning on quantum hardware. Nonetheless, they are challenging to train due to several problems intrinsic to the loss landscapes formed by variational quantum circuits. To mitigate these issues, researchers have extended the idea of subspace controllability leading to an increase in the success rate of variational models in finding the global minimum for quantum-based tasks. However, it remains unknown whether these results extend to classical-based tasks, and if any advantages are realised over a hyperparameter search. We begin to address this question by employing controllable circuits in a multi- classification task using MNIST-1D. Our results show that over a hyperparameter search, the majority of quantum models that achieve the lowest training and validation losses are subspace controllable. These results indicate that the hyperparameter search can be restricted to such models, in turn reducing computational cost and time.", "url": "https://arxiv.org/abs/2609.24475", "type": "理论+数值", "summary": "1. 该工作将动力学李代数框架下的子空间可控性引入变分量子线路，并在MNIST-1D多分类这一经典数据任务上检验可控线路能否优于超参数搜索。\n2. 其核心发现是，在超参数搜索所得模型中，训练和验证损失最低的多数量子模型均为子空间可控，表明可控性可提高表达力并增强对全局最优的搜索效率。\n3. 这提示可将超参数搜索限制在子空间可控模型内，以降低计算成本和时间，并为经典数据上的变分量子模型训练提供可操作的筛选准则。", "summary_source": "deepseek", "authors": [{"name": "Andrew Rowan Barlow"}, {"name": "Hans-Martin Rieser"}, {"name": "Markus Lange"}], "featured_authors": [{"name": "Andrew Rowan Barlow"}, {"name": "Hans-Martin Rieser"}, {"name": "Markus Lange"}], "author_count": 3}, {"id": "2609.24603", "category": "quant-ph", "title": "An Exact Operator Formulation of Statistical Quasiparticle Theory for Nonlinear System-Bath Coupling", "abstract": "We develop an operator formulation of statistical quasiparticle theory for open quantum systems with nonlinear system-bath coupling, extending beyond the linear coupling setting of the standard Gaussian influence functional formulation. For Gaussian baths, the statistical quasiparticles, termed dissipatons, are explicitly constructed as collective operators in the thermofield bath space. Our construction provides a microscopic operator basis for the dissipaton algebra and generates hierarchical equations of motion directly from the Liouville equation. Nonlinear interactions are incorporated through a recursive generalized Wick's theorem, enabling automatic generation of hierarchical equations for polynomial couplings. The resulting framework connects explicit bath operator representations to nonperturbative, non-Markovian dynamics and unifies the treatment of linear and nonlinear system-bath interactions.", "url": "https://arxiv.org/abs/2609.24603", "type": "理论", "summary": "1. 该工作发展了非线性系统-环境耦合开放量子系统的统计准粒子算符表述，拓展了标准高斯影响泛函的线性耦合框架。\n2. 其卖点是将高斯浴耗散子显式构造为热场空间集体算符，为耗散子代数提供微观基，并由刘维尔方程直接生成层级方程；非线性耦合用递归广义Wick定理自动处理。\n3. 其意义在于建立显式浴算符表示与非微扰、非马尔可夫动力学的联系，并统一线性与非线性系统-环境相互作用，为复杂开放系统计算提供新途径。", "summary_source": "deepseek", "authors": [{"name": "Yu Su"}, {"name": "Yao Wang"}], "featured_authors": [{"name": "Yu Su"}, {"name": "Yao Wang"}], "author_count": 2}, {"id": "2609.24617", "category": "quant-ph", "title": "Explicit closed-form propagators for time-dependent gain-loss master equations", "abstract": "Time ordering is a central obstacle in driven open-system dynamics governed by master equations with time-dependent rates. We derive explicit closed-form factorizations of the chronological and antichronological propagators for a time-dependent generator of the form $\\mathcal{L}(t)=\\alpha(t)A+\\beta(t)B$, when the commutator $[A,B]$ is a simultaneous eigenoperator of the adjoint actions of $A$ and $B$, namely $[A,[A,B]]=\\lambda_{A}[A,B]$ and $[B,[A,B]]=\\lambda_{B}[A,B]$. In contrast to the disentangling procedure known as the Wei-Norman decomposition, our construction determines the factorization coefficients dir
