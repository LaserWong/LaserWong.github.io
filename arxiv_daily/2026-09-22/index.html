shuba"}], "featured_authors": [{"name": "I. V. Semkiv"}, {"name": "N. T. Pokladok"}, {"name": "F. O. Ivashchyshyn"}, {"name": "A. I. Kashuba"}], "author_count": 4}, {"id": "2609.23647", "category": "cond-mat", "title": "Competition between uniform ferromagnetism and finite-wave-vector instabilities in square-lattice skyrmion crystals", "abstract": "We investigate square-lattice skyrmion crystal states in a centrosymmetric spin model with momentum-dependent magnetic interactions, including a uniform ferromagnetic interaction, easy-axis anisotropic interactions at two orthogonal finite wave vectors, higher-harmonic wave-vector interactions, and an external magnetic field. Using simulated annealing calculations, we determine the low-temperature magnetic phase diagram as functions of magnetic field and uniform ferromagnetic interaction strength. We find that the skyrmion crystal phase is stabilized at intermediate fields when the uniform ferromagnetic interaction is weak, exhibiting a noncoplanar double-$Q$ spin texture, finite scalar spin chirality, and higher-harmonic components. Increasing the uniform ferromagnetic interaction suppresses and eventually eliminates the skyrmion crystal phase through direct first-order transitions to the fully polarized state, whereas its weakening expands the skyrmion stability region and stabilizes a single-$Q$ conical spiral phase at high fields. These results clarify the mechanisms governing the square-lattice skyrmion formation in centrosymmetric magnets.", "url": "https://arxiv.org/abs/2609.23647", "type": "理论+数值", "summary": "1. 该工作用模拟退火研究了含动量依赖相互作用的中心对称方格子自旋模型，在均匀铁磁、两个正交有限波矢易轴各向异性、高阶谐波相互作用和外磁场下，计算低温磁相图随磁场与均匀铁磁强度的变化。\n2. 该工作发现均匀铁磁较弱时斯格明子晶体在中间磁场稳定，呈非共面双Q自旋织构、有限标量自旋手性和高阶谐波分量；增强均匀铁磁会经直接一级相变至完全极化态而抑制并最终消除该相，减弱则扩大其稳定区并在高场稳定单Q锥形螺旋。\n3. 这些结果厘清了中心对称磁体中方格子斯格明子形成的机制，表明均匀铁磁与有限波矢失稳之间的竞争可作为调控拓扑自旋织构的关键参量。", "summary_source": "deepseek", "authors": [{"name": "S. Hayami"}], "featured_authors": [{"name": "S. Hayami"}], "author_count": 1}, {"id": "2609.23649", "category": "cond-mat", "title": "Light absorption and scattering of an assembly of spheroidal metal nanoparticles", "abstract": "The paper studies the optical properties of assemblies of metallic prolate and oblate nanospheroids. The frequency dependences of averaged absorption and scattering cross-sections, absorption, scattering and reflection coefficients are obtained. The calculations were performed for assemblies of spheroidal particles of various metals. The difference in the results of calculating the frequency characteristics of the absorption and scattering cross-sections for assemblies of prolate and oblate spheroids manifested itself in different location and value of the maxima. A qualitative similarity of the frequency dependences of the absorption and scattering coefficients was established. It is shown that the frequency curves of assemblies of spheroids of different metals differ significantly in the location of the extrema within the range from the visible to the ultraviolet region of the spectrum", "url": "https://arxiv.org/abs/2609.23649", "type": "数值", "summary": "1. 该工作计算了由长椭球与扁椭球金属纳米颗粒组成的组装体在可见至紫外波段的平均吸收、散射截面以及吸收、散射和反射系数的频率依赖关系，并比较了不同金属颗粒组装体。\n2. 其核心在于揭示颗粒形状各向异性使长、扁椭球组装体的吸收与散射峰值位置和幅值显著不同，同时吸收与散射系数的频率曲线保持定性相似，而金属种类则强烈调控可见至紫外区极值位置。\n3. 这为通过选择金属与长扁椭球几何参数来剪裁等离激元组装体的吸收、散射和反射光谱提供了依据，并对相应光学器件与超材料设计具有启示。", "summary_source": "deepseek", "authors": [{"name": "N. I. Pavlyshche"}, {"name": "A. V. Korotun"}, {"name": "V. P. Kurbatsky"}], "featured_authors": [{"name": "N. I. Pavlyshche"}, {"name": "A. V. Korotun"}, {"name": "V. P. Kurbatsky"}], "author_count": 3}, {"id": "2609.23728", "category": "cond-mat", "title": "A small-distortion geometric model for elasto-plasticity in single crystals driven by the motion of dislocations", "abstract": "A central problem in nonlinear elasto-plasticity theory is to formulate a geometrically nonlinear, large-strain model of elasto-plasticity in single crystals in which plastic flow is driven directly by the motion of dislocations and which allows for a homogenization procedure from discrete dislocation lines to dislocation densities. In this work, such a model is introduced based on two hypotheses: (1) The Small-Distortion Hypothesis posits that the total plastic distortion may be arbitrarily large but its dominant part admits a representation as a gradient, meaning that the distorting effect of dislocations is small relative to the specimen size. Concretely, this hypothesis is realized here through a \"multiplicative Helmholtz-type decomposition\", which splits an arbitrary matrix field into the product of a gradient and a matrix field with controlled curl. (2) The Line-Tension Approximation treats all dislocations as infinitesimally thin lines whose local stress fields are individually negligible compared to specimen-scale stresses and only matter in the aggregate. The resulting model, termed the Small-Distortion Geometric Model, furthermore employs the so-called Space-Time Framework, which furnishes a geometric language to precisely describe the advection of dislocation lines. As such, it provides a physically grounded account of crystal plasticity in an idealized mesoscopic setting that bridges dislocation mechanics and continuum elasto-plasticity.", "url": "https://arxiv.org/abs/2609.23728", "type": "理论", "summary": "1. 该工作构建了一个单晶弹塑性小畸变几何模型，以位错运动直接驱动塑性流动，并支持从离散位错线到位错密度的均匀化。\n2. 其核心在于两条假设：小畸变假设借助乘法亥姆霍兹型分解把任意矩阵场拆为梯度与受控旋度矩阵场之积，线张力近似则将位错视为局部应力可忽略、仅在集体层面起作用的细线。\n3. 结合时空框架描述位错线平流，该模型为连接位错力学与连续介质弹塑性提供了一个介观尺度、物理自洽的描述，并有望用于大应变晶体塑性的均匀化与几何分析。", "summary_source": "deepseek", "authors": [{"name": "Filip Rindler"}], "featured_authors": [{"name": "Filip Rindler"}], "author_count": 1}, {"id": "2609.23783", "category": "cond-mat", "title": "Matching Rules for a Three-Dimensional Strongly Aperiodic Monotile", "abstract": "A recent pre-print [ arXiv:2609.19214 ] proposed a three-dimensional (3D) strongly aperiodic monotile: a shape that tiles Euclidean space only aperiodically and which admits no symmetry of infinite order. The proof takes the 3D Chair tile identified previously by Lee and Moody, and adds geometric decorations to the faces so as to force aperiodicity (without these decorations The Chair also admits periodic tilings). Here we establish general requirements on face decorations to achieve the same end, in order to facilitate the search for physical realisations. We find that the requirements are minimal. We provide matching rules using three colours of arrow. They are not equivalent to the original rules, but force the same tiling by forcing Chairs to compose into `Superchairs' with doubled linear dimensions. In this process the matching rules themselves compose uniquely, which is the core of the earlier proof. Relaxing this constraint further we find that the same structure can be forced using only a matching rule based on the colours of squares, regardless of orientation. Any physical system encoding these rules (geometrically or otherwise) will force the strongly aperiodic monotiling. We provide simple examples.", "url": "https://arxiv.org/abs/2609.23783", "type": "理论", "summary": "1. 该工作基于Lee与Moody的三维Chair瓷砖，建立面装饰的一般要求并发现其可极小化，以迫使三维强非周期单瓷砖铺砌并便于寻找物理实现。\n2. 其核心是给出三色箭头匹配规则，虽不等价于原规则，却通过强制Chair拼合成线性尺寸加倍的Superchair来产生同一非周期铺砌，且匹配规则自身唯一复合；进一步放松后仅凭正方形颜色、与取向无关的规则即可强制该结构。\n3. 这表明任何以几何或其他方式编码这些规则的物理系统都会迫使强非周期单瓷砖铺砌，为在材料、超材料或其他平台中实现该类三维非周期有序结构提供了最小设计条件与简单示例。", "summary_source": "deepseek", "authors": [{"name": "Felix Flicker"}], "featured_authors": [{"name": "Felix Flicker"}], "author_count": 1}, {"id": "2609.23811", "category": "cond-mat", "title": "Robust Spin Universality Across a Ballistic-to-Diffusive Transport Crossover", "abstract": "Whether a full counting statistical distribution preserves its universality class across a coherent-to-incoherent crossover is a fundamental question in open quantum systems. We resolve this for the infinite-$U$ Hubbard chain, showing that local density dephasing changes transport exponents without destroying the underlying non-Gaussian M-Wright spin fluctuations. Utilizing the exact spin-charge composition law inherent to impenetrable dynamics, we track the charge sector from ballistic flow to diffusive hydrodynamics. This dissipative crossover shifts the characteristic spin-transfer width from $t^{1/4}$ to $t^{1/8}$. Despite this altered scaling time, the central spin characteristic functions uniformly collapse onto a singular M-Wright scaling function, what we confirm using analytics as well as numerics.", "url": "https://arxiv.org/abs/2609.23811", "type": "理论", "summary": "1. 该工作研究无限U哈伯德链中局域密度退相干如何影响自旋输运统计，追踪电荷从弹道流到扩散流体力学的交叉。\n2. 其核心在于利用不可穿透动力学固有的自旋-电荷合成律，证明耗散交叉虽将自旋转移宽度标度由t^{1/4}变为t^{1/8}，中心自旋特征函数仍坍缩到单一M-Wright标度函数。\n3. 这表明全计数统计的普适类可在相干-非相干交叉中稳健保持，为开放量子系统中非高斯涨落普适性提供判据与启示。", "summary_source": "deepseek", "authors": [{"name": "Cătălin Paşcu Moca"}, {"name": "Ovidiu I. Pâţu"}, {"name": "Balázs Dóra"}], "featured_authors": [{"name": "Cătălin Paşcu Moca"}, {"name": "Ovidiu I. Pâţu"}, {"name": "Balázs Dóra"}], "author_count": 3}, {"id": "2609.23905", "category": "cond-mat", "title": "A Spatio-Temporal Generalisation of Green Kubo", "abstract": "The Green-Kubo (GK) method which is used to obtain the shear viscosity of a model liquid in equilibrium molecular dynamics (MD) often requires long simulation times to obtain acceptable statistics. This work extends the GK approach to include spatial correlations. The total shear stress in the GK expression is split into a grid of its components in contiguous volumes. In doing this, the autocorrelation of the total system stress can be rewritten as the cross-correlation of the subvolume stresses. This provides a novel real-space insight into the liquid structure, something previously only treated in Fourier space by liquid-state theory. A novel travelling wave like structure is exposed that is shown to be well fitted by a leading Gaussian pulse added to a second negative Gaussian for the bounce back. The fitting parameters include the wave position, magnitude and width which show deep insights into the liquid property. The wave moves at the speed of sound over short times before decreasing in speed with the square root of time, while the wave packet spreads out also as the square root of time. The magnitude is decreasing with form $t^{-3/2}$, a result with strong significance in the history of MD simulation. These fitted forms mean the entire spatial temporal response of the liquid can be modelled in closed form by fitting to data, with short term requiring MD and the long time and distances approximated by the Gaussian form. By limiting the correlation to localized interactions the longer range contribution, which essentially only contribute to the noise, can be eliminated. This looks like a promising approach to model viscosity by taking short MD runs and fitting the long time behaviour.", "url": "https://arxiv.org/abs/2609.23905", "type": "理论+数值", "summary": "1. 该工作将平衡分子动力学中的Green-Kubo剪切黏度方法推广到空间关联，把总剪切应力分解到连续子体积网格，并将总应力的自关联改写为子体积应力的互关联。\n2. 其核心卖点是在实空间而非傅里叶空间揭示液体中的类行波结构：短时以声速传播，随后速度按时间的平方根衰减、波包按时间的平方根展宽、幅度按t^{-3/2}下降，并可用主高斯脉冲加反弹负高斯拟合。\n3. 该框架可通过局域截断仅贡献噪声的长程关联，并仅用短MD轨迹拟合长时闭式行为，为以短模拟高效预测黏度提供了有前景的路径。", "summary_source": "deepseek", "authors": [{"name": "E. R. Smith"}, {"name": "D. Dini"}, {"name": "D.M. Heyes"}], "featured_authors": [{"name": "E. R. Smith"}, {"name": "D. Dini"}, {"name": "D.M. Heyes"}], "author_count": 3}, {"id": "2609.23963", "category": "cond-mat", "title": "Transitions between bulk and interfacial fracture in diamond/$c$BN heterostructures", "abstract": "Whether an initially crack-free heterostructure fails at its interface or within an adjoining phase is controlled by the relative cohesion of competing atomic planes, but how interfacial chemistry, crystallographic orientation, and intermixing reshape this competition remains unclear. Here, we combine density functional theory (DFT) with a fine-tuned atomistic foundation model to resolve tensile fracture in coherent diamond/cubic boron nitride (cBN) heterostructures. The resulting potential reproduces independent DFT tensile responses, including an unseen (001) interface orientation. Interfacial termination, orientation, and diffusion-induced intermixing jointly determine fracture resistance and fracture-plane selection. C-N-bonded (111) and C-B-bonded (001) remain interface-controlled throughout the investigated intermixing range, whereas pristine C-B-bonded (111) fractures at a neighboring B-N plane inside cBN because the interface is more strongly bound. Increasing the diffusion fraction from 0 to 50.0% causes a nonlinear decrease in fracture strength from 50.3 to 15.8 GPa and drives a bulk-to-interface transition through three regimes: cBN fracture up to 4.86%, configuration-dependent competition between 7.6 and 10.1%, and interfacial fracture at 12.5% and above. Atom-resolved stress fields and DFT separation energetics show that this transition is associated with stress relocation and a reversal in the relative cohesion of competing planes, while electron localization analysis connects the cohesion hierarchy to termination- and orientation-dependent bonding. These results establish an atomistic framework for controlling fracture resistance and fracture pathways in strongly bonded heterostructures.", "url": "https://arxiv.org/abs/2609.23963", "type": "理论+数值", "summary": "1. 结合DFT与精细调校的原子基座模型，研究了共格金刚石/cBN异质结的拉伸断裂路径选择与界面化学、取向及互扩散的影响。\n2. 其势函数可复现独立DFT拉伸响应，并揭示互扩散0→50%使断裂强度非线性从50.3降至15.8 GPa，经三区间由体相转为界面断裂。\n3. 该工作建立了调控强键合异质结断裂强度与路径的原子尺度框架，表明应力重分布与竞争面内聚次序反转是路径选择的关键。", "summary_source": "deepseek", "authors": [{"name": "Wei Qiu"}, {"name": "Feiyu Zhou"}, {"name": "Xiaonan Wang"}, {"name": "Feng Xie"}, {"name": "Yan Chen"}, {"name": "Shengying Yue"}, {"name": "Yilun Liu"}, {"name": "Penghua Ying"}], "featured_authors": [{"name": "Wei Qiu"}, {"name": "Feiyu Zhou"}, {"name": "Xiaonan Wang"}, {"name": "Shengying Yue"}, {"name": "Yilun Liu"}, {"name": "Penghua Ying"}], "author_count": 8}, {"id": "2609.23993", "category": "cond-mat", "title": "A Majorana Formulation of Time-Dependent Two-Particle Reduced-Density-Matrix Dynamics", "abstract": "We introduce a time-dependent two-particle (TP) reduced-density-matrix algorithm for systems of interacting Majorana fermions. We close the BBGKY hierarchy at the two-particle level by reconstructing the three-particle reduced density matrix from lower-order correlations. To stabilize the evolution, we impose a positivity projection on the two-particle density matrix while preserving chosen conserved quantities such as the energy. We benchmark the approach on quenches in the one-dimensional Hubbard model and on flux dynamics in the Kitaev honeycomb model. For the Hubbard quench, TP captures strong-coupling dynamics missed by Hartree--Fock (HF). For the Kitaev quenches, TP accurately reproduces the early-time flux dynamics in several regimes and provides a substantial improvement over HF when two-particle correlations are important. We further show that gauge coherence is essential for flux dynamics. The projection procedure however introduces an effective irreversibility, which affects the long-time dynamics.", "url": "https://arxiv.org/abs/2609.23993", "type": "理论+数值", "summary": "1. 该工作提出相互作用Majorana费米子的含时两粒子约化密度矩阵算法，并在Hubbard与Kitaev模型上检验。\n2. 其技术核心是在两粒子层次闭合BBGKY层级并施加保持守恒量的正性投影，且表明规范相干性对Kitaev通量动力学至关重要。\n3. 该框架为强关联量子动力学提供优于Hartree-Fock的改进，但投影引入的有效不可逆性会影响长时动力学。", "summary_source": "deepseek", "authors": [{"name": "Haoran Wang"}, {"name": "Alessandro Principi"}], "featured_authors": [{"name": "Haoran Wang"}, {"name": "Alessandro Principi"}], "author_count": 2}, {"id": "2609.24063", "category": "cond-mat", "title": "Exact Nonperturbative Equilibrium Mode Statistics in Nonlinear Wave and Lattice Systems", "abstract": "We derive exact finite-size nonperturbative representations of equilibrium modal occupations and related statistics for three representative nonlinear systems: the Majda-McLaughlin-Tabak dispersive-wave model, the Fermi-Pasta-Ulam-Tsingou beta anharmonic chain, and the discrete nonlinear Schrodinger lattice field. Independent simulations confirm the predictions from weak to strong nonlinearity. For DNLS, the theory remains accurate across the weak-coupling quasicondensation crossover, where large low-mode occupations and long-range coherence amplify interaction effects even when the bare nonlinear coefficient is small. The finite-ring DNLS occupations are further resolved into a positive sum of Rayleigh-Jeans channels with distinct correlation lengths, explaining when a single Rayleigh-Jeans law applies and why it fails near quasicondensation. In MMT and DNLS, the exact occupations also determine the mean modal frequencies even when the dynamical spectra broaden or split. The nonperturbative results allow a direct assessment of two representative perturbative approaches. Treating the mean interaction appropriately yields accurate low-order approximations, including at strong nonlinearity. At higher orders, however, the corrections cease to decrease and successive approximations oscillate with increasing amplitude; both finite-order approaches also fail near weak-coupling quasicondensation. Thus neither low-order agreement nor a small bare coupling guarantees a reliable perturbative description. The results establish nonperturbative equilibrium theory for widely used nonlinear wave and lattice models and provide a quantitative basis for modal distributions of energy, particles, and optical power in nonlinear optics, dispersive waves, anharmonic lattices, and cold-atom systems.", "url": "https://arxiv.org/abs/2609.24063", "type": "理论+数值", "summary": "1. 我们推导了三个代表性非线性系统的平衡模态占用的精确有限尺寸非微扰表示和相关统计：Majda-McLaughlin-Tabak 色散波模型、Fermi-Pasta-Ulam-Tsingou beta 非谐链和离散非线性薛定谔晶格场。\n2. 适当处理平均交互作用可以产生准确的低阶近似值，包括在强非线性情况下。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Jialin Zhang"}, {"name": "Yong Zhang"}, {"name": "Hong Zhao"}], "featured_authors": [{"name": "Jialin Zhang"}, {"name": "Yong Zhang"}, {"name": "Hong Zhao"}], "author_count": 3}, {"id": "2609.24160", "category": "cond-mat", "title": "Derivation of the Thiele equation for magnetic skyrmions using the Mori-Zwanzig formalism", "abstract": "We use the Mori-Zwanzig formalism to derive an exact generalized Langevin equation governing the dynamics of magnetic skyrmions. Using standard approximations, this generalized Langevin equation is found to reduce to the usual Thiele equation. Our approach provides a general route for obtaining extensions of the Thiele equation applicable to magnetic textures and degrees of freedom not covered by the standard derivation route. It also provides some insights into the microscopic justification of the standard Thiele equation, specifically concerning contributions of fast modes to the form of the drift and diffusion terms in the Fokker-Planck equation for skyrmions.", "url": "https://arxiv.org/abs/2609.24160", "type": "理论", "summary": "1. 该工作利用Mori-Zwanzig形式推导了磁斯格明子动力学的精确广义朗之万方程，并在标准近似下约化为Thiele方程。\n2. 其技术要点在于提供获得标准推导未覆盖的Thiele方程扩展的通用路线，可处理更一般的磁结构和自由度。\n3. 这也从微观层面为Thiele方程提供依据，尤其揭示快模对斯格明子Fokker-Planck方程漂移与扩散项的贡献。", "summary_source": "deepseek", "authors": [{"name": "Michael te Vrugt"}, {"name": "Mathias Kläui"}], "featured_authors": [{"name": "Michael te Vrugt"}, {"name": "Mathias Kläui"}], "author_count": 2}, {"id": "2609.24211", "category": "cond-mat", "title": "Universal Dynamics of a Spin-$3/2$ Fermi Gas in Traps with Distinct Spectra", "abstract": "Universal power-law decay of spin-mixing oscillations has been observed in a harmonically trapped spin-$3/2$ Fermi gas, whose exactly equally spaced spectrum represents a highly special case. To gain insight into the origin of this behavior, we investigate the dynamics in traps with increasing and decreasing level spacings, represented by the infinite square well and the Pöschl--Teller potential, respectively. Despite pronounced differences in their single-particle spectra, all systems exhibit power-law decay of coherent oscillations, described by $A(t) = A_{0} - \\gamma t^{\\alpha}$. The exponent $\\alpha$ remains insensitive to particle number, interaction strength, and the overall energy scale, but exhibits systematic differences among traps with distinct spectral structures. In contrast, the decay parameter $\\gamma$ is strongly influenced by both the spectral structure and the overall energy scale. These findings demonstrate that power-law decay is not restricted to the harmonic trap but persists across qualitatively distinct spectral structures. The observed variation of $\\alpha$ among different traps further suggests that the underlying single-particle spectrum plays an important role in shaping the decay dynamics.", "url": "https://arxiv.org/abs/2609.24211", "type": "理论", "summary": "1. 该工作研究了自旋-3/2费米气体在简谐阱、无限深方势阱与Pöschl-Teller势等不同单粒子谱中的动力学，以探究自旋混合振荡幂律衰减的起源。\n2. 其核心发现是幂律衰减 A(t)=A0-γt^α 不仅限于简谐阱，指数 α 对粒子数、相互作用强度和能量尺度不敏感，但在不同谱结构间存在系统性差异，而衰减参数 γ 则强烈依赖谱结构与能量尺度。\n3. 这揭示单粒子谱在塑造衰减动力学中的关键作用，为在更广泛谱结构下检验普适动力学以及通过谱工程调控相干振荡提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Shuyi Li"}, {"name": "Qiang Gu"}], "featured_authors": [{"name": "Shuyi Li"}, {"name": "Qiang Gu"}], "author_count": 2}, {"id": "2609.24247", "category": "cond-mat", "title": "Thermal Evolution and Disorder Dependence of the Bose-glass: Spatial, Spectral, and Localization Signatures", "abstract": "In this work, we characterize the glassy character of the Bose-glass phase in a disordered Bose-Hubbard model using three complementary diagnostics: the finite-temperature spectral function, spatial inhomogeneity, and the inverse participation ratio. Spectral analysis, obtained from finite-temperature Green's function and random phase approximation, shows that disorder introduces localized low-energy states within the Mott gap, eventually closing the gap at sufficiently strong disorder. Spatial inhomogeneity, calculated using the Gutzwiller ansatz, increases sharply with disorder and then saturates at moderate disorder strengths. The inverse participation ratio has been calculated from the exact diagonalization of a small system, and it reveals enhanced localization with stronger disorder. Increasing temperature suppresses these disorder-induced features: the low-energy spectral weight diminishes, the spatial inhomogeneity varies more smoothly, and the IPR decreases. Taken together, these diagnostics show that disorder drives the development of glassy character, while thermal fluctuations gradually wash out its signatures. The early saturation of spatial inhomogeneity compared with the continued evolution of low-energy excitations and the inverse participation ratio demonstrates that no single diagnostic fully captures the evolution of the Bose-glass state, highlighting the need for a combined characterization.", "url": "https://arxiv.org/abs/2609.24247", "type": "理论+数值", "summary": "1. 该工作结合有限温度格林函数与随机相近似、格点平均场变分和精确对角化，用谱函数、空间不均匀性与逆参与率三种诊断，刻画无序玻色-哈伯德模型中的玻色玻璃相。\n2. 其主要物理结论是无序在莫特能隙内引入低能局域态并最终使能隙闭合，空间不均匀性随无序先急增后饱和，逆参与率显示局域化增强，而升温会削弱这些特征。\n3. 空间不均匀性较早饱和而低能激发与逆参与率仍持续演化，表明单一诊断无法完整表征玻色玻璃态，提示后续需联合多探针并区分无序效应与热涨落。", "summary_source": "deepseek", "authors": [{"name": "Madhumita Kabiraj"}, {"name": "Raka Dasgupta"}], "featured_authors": [{"name": "Madhumita Kabiraj"}, {"name": "Raka Dasgupta"}], "author_count": 2}, {"id": "2609.24293", "category": "cond-mat", "title": "Small-supercell and Small-dataset Training Strategy of Machine Learning Interatomic Potentials for Point Defects", "abstract": "Machine learning interatomic potentials (MLIPs) can treat large-scale material systems with near first-principles accuracy and have been widely used to accelerate point-defect simulations. However, the training of MLIPs usually relies on large amounts of DFT data. This issue is particularly pronounced for charged defects, for which DFT calculations of large supercells are required to avoid long-range Coulomb interactions and finite-size effects, making the construction of datasets computationally expensive. In this work, we propose an efficient MLIP training scheme for neutral and lowly charged point defects based on small supercells (less than 100 atoms) and limited number of DFT calculations. The scheme requires only four DFT structural relaxations to construct the training dataset and the trained MLIPs dedicated for the defect can predict the defect formation energies in larger supercells (over 200 atoms) with small errors (mostly smaller than 0.3 eV). Using defects in GaN, SiO$_2$, and $\\mathrm{Cu}_2\\mathrm{ZnSnS}_4$ as representative examples, we evaluate the extrapolation capability of this scheme for predicting defect total energies and structural relaxations across different supercell sizes. The results show that an MLIP trained only on single small defect supercell produces severe errors when treating large supercells. Incorporating defect data from multiple supercell sizes improves the predictive performance of the MLIP, while adding pristine defect-free bulk supercells further enhances the accuracy. These results provide practical guidance for training MLIP models of defect systems with low computational costs.", "url": "https://arxiv.org/abs/2609.24293", "type": "理论+数值", "summary": "1. 该工作提出一种面向中性及低电荷点缺陷的小超胞与小数据集机器学习原子间势训练方案，仅用四次DFT结构弛豫构建训练集，并在GaN、SiO₂和Cu₂ZnSnS₄中评估其跨超胞尺寸外推能力。\n2. 其核心在于证明专用MLIP可由小于100原子超胞训练后，以多数小于0.3 eV误差预测超过200原子超胞的缺陷形成能，且融合多尺寸缺陷数据并加入无缺陷体相超胞可显著提升大超胞精度，而仅用单个小超胞会严重失效。\n3. 该结果为低计算成本构建点缺陷MLIP数据集提供了可操作准则，并提示通过尺寸与体相数据组合改善外推，对加速中性及低电荷缺陷的第一性原理模拟具有直接参考价值。", "summary_source": "deepseek", "authors": [{"name": "Zhenxing Dai"}, {"name": "Mingjue Ni"}, {"name": "Xinpeng Li"}, {"name": "Menglin Huang"}, {"name": "Anderson Janotti"}, {"name": "Shiyou Chen"}], "featured_authors": [{"name": "Zhenxing Dai"}, {"name": "Mingjue Ni"}, {"name": "Xinpeng Li"}, {"name": "Menglin Huang"}, {"name": "Anderson Janotti"}, {"name": "Shiyou Chen"}], "author_count": 6}, {"id": "2609.24315", "category": "cond-mat", "title": "Slave-Rotor and Auxiliary Chain Analysis of the Mott Transition in a Modified Periodic Anderson Model", "abstract": "The Mott-Hubbard transition is a paradigmatic phenomenon driven by strong electronic correlations. We investigate this transition in a three-orbital modified periodic Anderson model using slave-rotor mean-field theory. A minimal two-site cluster extension is introduced to understand the minimal effects of short-range spatial correlations. In comparison to the single-site solution, short-range spatial correlations reveal a shift of the transition point. Going beyond the slave-rotor analysis, we also evaluate the dynamical self-energy and map it onto the boundary Green's function of a non-interacting semi-infinite auxiliary chain. For the metallic phase, the resulting hopping pattern corresponds to a topologically trivial generalized Su--Schrieffer--Heeger chain. This construction provides a framework for exploring the possible topological character of the Mott transition in this model.", "url": "https://arxiv.org/abs/2609.24315", "type": "理论+数值", "summary": "1. 该工作用slave-rotor平均场与辅助链方法研究三轨道修正周期Anderson模型中的Mott-Hubbard转变。\n2. 引入最小两格点团簇扩展表明短程空间关联使转变点移动，并将动力学自能映射为非互作用半无限辅助链的边界格林函数。\n3. 金属相的跃迁模式对应拓扑平庸的广义Su-Schrieffer-Heeger链，为探究该模型中Mott转变的拓扑性质提供框架。", "summary_source": "deepseek", "authors": [{"name": "Ankur Majumder"}, {"name": "Sudeshna Sen"}], "featured_authors": [{"name": "Ankur Majumder"}, {"name": "Sudeshna Sen"}], "author_count": 2}, {"id": "2609.24336", "category": "cond-mat", "title": "Axial thermal expansion from free-energy minimization with temperature-dependent force constants in phonopy: a technical report, with $α$- and $ω$-Ti as the worked example", "abstract": "In a hexagonal crystal the $a$ and $c$ axes change their lengths at different rates with increasing temperature, and the thermal expansion is described by two coefficients, one for each axis. The equilibrium lattice parameters at each temperature are found by minimizing the Helmholtz free energy over the lattice parameters, and the coefficients are their logarithmic derivatives with respect to temperature. This report describes a procedure for this minimization as implemented in phonopy. The free energy is computed with harmonic force constants at a finite set of values of $a$ and $c$, and a free-energy surface over $a$ and $c$ is fitted to these values. In a variant, the harmonic force constants are replaced by temperature-dependent force constants from a self-consistent harmonic approximation, with the forces computed by a machine-learning potential fitted at each of these values. The $\\alpha$ and $\\omega$ phases of titanium are the worked example. Both calculations give negative thermal expansion of the $c$ axis of $\\alpha$-Ti at low temperature and none in $\\omega$-Ti, and they differ most for the $c$ axis of $\\alpha$-Ti. The axial coefficients are harder to compute than the volumetric one, because the two axes are coupled in the free energy. In both phases of titanium the thermal effect that lengthens $a$ also shortens $c$. The coefficient of the $c$ axis is then the sum of two terms of opposite sign that partly cancel, and a small error in either term gives a large relative error in the coefficient. The report measures how much each setting of the procedure changes the thermal expansion coefficients, with the $c$ axis of $\\alpha$-Ti as the most sensitive case.", "url": "https://arxiv.org/abs/2609.24336", "type": "数值", "summary": "1. 该技术报告在 phonopy 中通过最小化 Helmholtz 自由能并拟合 a-c 自由能面，计算六角晶体的轴向热膨胀系数，并以 α-Ti 和 ω-Ti 为示例。\n2. 其技术要点是用有限 (a,c) 点上的谐振力常数或经自洽谐近似与机器学习势得到的温度依赖力常数构造自由能面，再在轴耦合下求对数导数。\n3. 两种计算均给出 α-Ti 低温 c 轴负热膨胀而 ω-Ti 无，且 c 轴系数因两项反号部分抵消对设置最敏感，表明轴向热膨胀比体积热膨胀更依赖耦合与力常数精度。", "summary_source": "deepseek", "authors": [{"name": "Atsushi Togo"}], "featured_authors": [{"name": "Atsushi Togo"}], "author_count": 1}, {"id": "2609.24383", "category": "cond-mat", "title": "Revealing tilt-driven structural heterogeneity in hybrid improper ferroelectrics by spatially-resolved crystallography", "abstract": "Domain walls in ferroic oxides can host emergent functionalities that differ fundamentally from those of the surrounding bulk, making their microscopic structure central to understanding and controlling macroscopic behaviour. We use scanning three-dimensional X-ray diffraction to map the spatial evolution of coupled octahedral distortion modes across ferroelastic domain walls in the hybrid improper ferroelectric Ca$_{2.15}$Sr$_{0.85}$Ti$_{2}$O$_{7}$. By combining tomographic reconstruction with symmetry-adapted analysis of the octahedral rotation and tilt and associated strain modes, we map their spatial evolution across individual walls in the bulk crystal. We find that the walls are intrinsically extended, with widths far exceeding those expected for conventional Ising-like ferroic interfaces. The wall structure is characterised by a continuous rotation of the tilt order parameter through a tetragonal intermediate. These results provide new microscopic insight into the structural mechanisms governing ferroelastic wall formation, ferroelectric switching, and emergent functionality at domain walls.", "url": "https://arxiv.org/abs/2609.24383", "type": "理论+数值", "summary": "1. 该工作利用扫描三维X射线衍射，结合断层重建与对称适配分析，在杂化非本征铁电体Ca2.15Sr0.85Ti2O7中空间分辨地追踪了跨铁弹畴壁耦合的八面体旋转、倾斜及应变畸变模式。\n2. 其核心卖点在于发现畴壁本征展宽远超传统伊辛型铁性界面，且壁内倾斜序参量经四方中间态连续旋转，从而揭示倾斜驱动的结构非均匀性。\n3. 这为铁弹畴壁形成、铁电翻转及畴壁涌现功能性的微观结构机制提供了直接空间证据，并启发通过局域对称性工程调控杂化非本征铁电体的畴壁功能。", "summary_source": "deepseek", "authors": [{"name": "Evie Ladbrook"}, {"name": "Jon P. Wright"}, {"name": "Mark S. Senn"}], "featured_authors": [{"name": "Evie Ladbrook"}, {"name": "Jon P. Wright"}, {"name": "Mark S. Senn"}], "author_count": 3}, {"id": "2609.24402", "category": "cond-mat", "title": "The disordered logistic map", "abstract": "The logistic map is a quintessential model in the study of low-dimensional chaos. High-dimensional chaos, on the other hand, presents itself in disordered systems with many interacting and heterogeneously coupled components. Here, we formulate a system of many logistic maps, interacting through disordered couplings. Using a combination of dynamic mean-field theory, random matrix theory and numerical simulations, we show that even the smallest amount of disorder can remove the period-doubling cascade in the conventional logistic map. Instead we find a transition to high-dimensional chaos, marked by an oscillatory instability not previously reported for disordered systems. We also show that with sufficiently strong homogeneous coupling between the maps one recovers elements of the conventional period-doubling cascade. Our findings indicate that well-known phenomena in dynamical systems can be fragile in the face of disorder. At the same time, new phenomena emerge that are neither found in simple low-dimensional dynamics nor in high-dimensional disordered systems.", "url": "https://arxiv.org/abs/2609.24402", "type": "理论+数值", "summary": "1. 该工作构建了由大量逻辑斯蒂映射经无序耦合相互作用的多体系统，并综合动态平均场理论、随机矩阵理论和数值模拟研究其动力学。\n2. 其核心发现是即便极小无序也会抹除常规逻辑斯蒂映射的倍周期分岔级联，转而出现以振荡不稳定性为标志的高维混沌，而足够强的均匀耦合又能恢复部分倍周期级联。\n3. 这表明低维动力系统中的著名现象对无序可能很脆弱，同时可催生既非简单低维也非传统高维无序系统所具备的新现象。", "summary_source": "deepseek", "authors": [{"name": "Joseph W. Baron"}, {"name": "Tobias Galla"}], "featured_authors": [{"name": "Joseph W. Baron"}, {"name": "Tobias Galla"}], "author_count": 2}, {"id": "2609.24408", "category": "cond-mat", "title": "Ageing in the exact correlations of the voter model on a fractal", "abstract": "The exact behaviour of the enveloppes of the single-time and two-time correlators is found for the voter model on a fractal substrate, with nearest-neighbour interactions. Herein the geometry of the fractal substrate is described by its non-integer geometric fractal dimension $d_f$, and its topology and diffusive transport by the distinct spectral dimension $d_s$. On the level of the equations of motion of the correlators this can be modelled by considering a space-dependent diffusion constant ${\\cal D}(r)\\sim r^{-\\theta}$ which implies the spectral index $\\theta$, itself a function of $d_f$ and $d_s$. With a scaling ansatz, the generic phenomenology of ageing is confirmed and the dynamic exponent ${z}=2+\\theta$ and the autocorrelation exponent $\\lambda=d_f$ are derived. The explicitly found dynamic scaling functions are shown to depend only on the spectral dimension $d_s$. The decay of the enveloppe of the density of active interfaces with time is described by the exponent $\\alpha=1-d_s/2$ for $d_s<2$, confirming the results of preexisting numerical simulations.", "url": "https://arxiv.org/abs/2609.24408", "type": "理论+数值", "summary": "1. 该工作精确给出分形基底上最近邻选民模型的单时与双时关联函数包络，基底由分形维数 d_f 与谱维数 d_s 刻画，并用空间依赖扩散常数 D(r)~r^{−θ} 将拓扑与输运信息纳入关联函数运动方程。\n2. 卖点在于以标度假设确认老化现象学，导出动力学指数 z=2+θ、自关联指数 λ=d_f，且显式动力学标度函数只依赖谱维数 d_s。\n3. 活跃界面密度包络衰减指数 α=1−d_s/2（d_s<2）与既有数值模拟吻合，说明分形上的老化由谱维数主导，并为后续理论与模拟提供可检验判据。", "summary_source": "deepseek", "authors": [{"name": "Malte Henkel"}], "featured_authors": [{"name": "Malte Henkel"}], "author_count": 1}, {"id": "2609.24427", "category": "cond-mat", "title": "Heterogeneous planar diffusion with axisymmetric power-law decaying diffusion coefficient under stochastic resetting", "abstract": "We analyse two-dimensional isotropic heterogeneous diffusion with a radially decaying diffusion coefficient $D(\\rho)=D_0/\\rho^2$, subject to Poissonian stochastic resetting to the origin. Since multiplicative noise makes the process interpretation-dependent, we treat the Itô, Stratonovich, and Hänggi--Klimontovich prescriptions within a single approach. For each, we obtain the exact probability density function, the non-equilibrium stationary state induced by resetting, the mean squared displacement, and the first-passage properties. The non-equilibrium stationary state is governed by modified Bessel functions and departs from the Laplace form found for homogeneous diffusion under resetting, while the mean squared displacement saturates at long times as $\\langle\\rho^2\\rangle\\sim\\bar{r}^{-1/2}$, $\\bar{r}$ being the resetting rate. The mean first-passage time to an absorbing boundary exhibits an optimal resetting rate at which it is minimised. In addition, we incorporate memory effects through a subordination (continuous-time random walk) approach with a power-law kernel, deriving the fractional Fokker--Planck equation together with the non-equilibrium stationary state, the mean squared displacement expressed via the three-parameter Mittag-Leffler function, and the first-passage statistics; the optimal resetting rate increases as the memory exponent decreases.", "url": "https://arxiv.org/abs/2609.24427", "type": "理论", "summary": "1. 该工作解析了二维径向异质扩散 D(ρ)=D0/ρ² 在泊松随机重置到原点下的行为，并统一处理 Itô、Stratonovich 与 Hänggi-Klimontovich 三种乘性噪声约定。\n2. 其卖点是给出各约定下精确概率密度、非平衡定态、均方位移与首达性质；定态由修正贝塞尔函数支配并偏离均匀情形的拉普拉斯形式，长时 ⟨ρ²⟩∼r̄^{-1/2}，首达时间在最优重置率处最小。\n3. 进一步用幂律核从属连续时间随机游走纳入记忆效应，得到分数阶 Fokker-Planck 方程、三参数 Mittag-Leffler 型均方位移和首达统计，且记忆指数越小最优重置率越高，为异质扩散中的重置优化提供基准。", "summary_source": "deepseek", "authors": [{"name": "Trifce Sandev"}, {"name": "Sebastien Fumeron"}, {"name": "Malte Henkel"}, {"name": "Ervin K. Lenzif"}], "featured_authors": [{"name": "Trifce Sandev"}, {"name": "Sebastien Fumeron"}, {"name": "Malte Henkel"}, {"name": "Ervin K. Lenzif"}], "author_count": 4}, {"id": "2609.24438", "category": "cond-mat", "title": "Non-equilibrium dynamics of drift-diffusion process under threshold resetting", "abstract": "We study the emergence of non-equilibrium steady states (NESS) in stochastic processes under threshold resetting, an event-driven protocol in which the system resets to its initial configuration upon crossing a prescribed spatial boundary (threshold). In contrast to externally driven resetting, whose steady-state properties are well understood, the behavior under threshold resetting remains largely unexplored. We derive general conditions for the existence of a NESS and show that, whenever it exists, the steady state at a given position $x$ can be expressed as the ratio of two fundamental quantities: the mean local time (MLT) at $x$ and the mean first-passage time (MFPT) to hit the threshold. In particular, for noisy systems, a finite MFPT guarantees the existence of a NESS. As an illustrative example, we analyze a drift-diffusion process in one dimension and uncover rich intermediate-time dynamics, including anomalous relaxation in the spatial distribution, damped oscillations in the moments and in the mean-squared displacement (MSD), governed by system parameters. Our findings provide a general understanding of the emergence of non-equilibrium steady states and relaxation dynamics under threshold resetting, revealing how induced events shape the spatial and temporal properties of a broad class of stochastic processes.", "url": "https://arxiv.org/abs/2609.24438", "type": "理论", "summary": "1. 该工作研究了空间阈值触发重置（越过边界即回到初态）下随机过程的非平衡稳态与弛豫动力学，推导出非平衡稳态存在的一般条件，并以一维漂移扩散过程为例展开分析。\n2. 核心结果为：稳态分布可写成位置 x 处的平均局部时间与到达阈值的平均首次通过时间之比，且对含噪系统而言有限的平均首次通过时间即保证非平衡稳态存在。\n3. 在一维漂移扩散中，该机制导致由系统参数控制的中间时间反常弛豫、矩与均方位移的阻尼振荡，为理解事件驱动重置如何塑造广泛随机过程的时空特性提供了普适框架。", "summary_source": "deepseek", "authors": [{"name": "Rahul Das"}, {"name": "Satya N Majumdar"}, {"name": "Arnab Pal"}], "featured_authors": [{"name": "Rahul Das"}, {"name": "Satya N Majumdar"}, {"name": "Arnab Pal"}], "author_count": 3}, {"id": "2609.24445", "category": "cond-mat", "title": "Charge-4e Superconducting Ground State without Pair Condensation: Exact Quartet Dynamics, Rigorous Order, and a Microscopic Route", "abstract": "A direct charge-\\(4e\\) superconductor exhibits coherent four-electron order while every charge-\\(2e\\) pairing channel remains uncondensed. We establish three complementary results. First, building on the \\(\\eta\\)-clustering states and bipartite parent of Yoshida and Katsura, we formulate and exactly solve a minimal two-term parent on any connected graph. Its fixed-number ground states have quartet off-diagonal long-range order (ODLRO) without charge-\\(2e\\) ODLRO, while an exact mapping to classical hard-core exclusion dynamics yields the full fixed-sector gap and a branch of quartet-density modes. Nonzero quartet stiffness and vanishing inverse quartet compressibility identify this \\(z=2\\) parent as a phase-separation boundary. Second, for a finite-range fermionic family with explicit quartet transfer and sufficiently large onsite penalty, we rigorously prove quartet ODLRO without charge-\\(2e\\) ODLRO at half quartet filling, both at the hypercubic XY point for \\(d\\geq2\\) and throughout a finite XXZ interval on the square lattice. Third, we derive a strong-coupling realization using only electron hopping and two-body interactions. With local gap \\(U_0\\), pair hopping \\(K\\) generates quartet motion at order \\(K^2/U_0\\), whereas electron hopping \\(t\\) first contributes at order \\(t^4/U_0^3\\); charge-\\(2e\\) excitations remain gapped at \\(O(U_0)\\). On bipartite lattices, positive inverse quartet compressibility opens an asymptotically controlled homogeneous \\(z=1\\) regime with short-ranged pair correlations, while negative curvature drives phase separation.", "url": "https://arxiv.org/abs/2609.24445", "type": "理论", "summary": "1. 直接电荷-\\(4e\\)超导体表现出相干的四电子序，而每个电荷-\\(2e\\)配对通道保持未凝聚。\n2. 对于局部间隙 \\(U_0\\)，对跳跃 \\(K\\) 以 \\(K^2/U_0\\) 阶产生四重运动，而电子跳跃 \\(t\\) 首先以 \\(t^4/U_0^3\\) 阶贡献；电荷-\\(2e\\) 激发仍保持在 \\(O(U_0)\\) 处。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Jin-Tao Jin"}, {"name": "Pengfei Li"}, {"name": "Yi Zhou"}], "featured_authors": [{"name": "Jin-Tao Jin"}, {"name": "Pengfei Li"}, {"name": "Yi Zhou"}], "author_count": 3}, {"id": "2609.24450", "category": "cond-mat", "title": "Effective Mass Approach to Dynamics of Non-Markovian Systems with Short Memory", "abstract": "Memory is an inherent feature of the dynamics of physical systems. It typically emerges when the complex structure of the system is simplified during the modeling process, obscuring a part of its underlying behavior. Consequently, the correct description of such a physical model requires knowledge of not only its present, but also its past states, leading to non-Markovian dynamics. The resulting interactions depending on the system history, however, introduce a significant layer of mathematical complexity. For this reason, when the memory time is significantly shorter than the time scales characterizing the dynamics, it is typically neglected at the cost of losing information regarding its role in the system behavior. In this dissertation, I introduce a novel methodology, namely the effective mass approach, which bridges the Markovian and non-Markovian regimes and provides an accessible framework for analyzing systems with short memory. In this method, the non-Markovian system is approximated with its Markovian counterpart, in which the short-memory effects are encapsulated within an effective mass. I then utilize this approach to demonstrate that the impact of short memory on physical dynamics can be remarkably pronounced. In particular, I show that the directed transport of a Brownian particle in an environment exhibiting temporal correlations can be reversed relative to its behavior in a memoryless medium. Moreover, I propose a setup wherein memory serves as a~control parameter for the generation of random information bits. Collectively, the results of this dissertation underscore the critical importance of short-time correlations in microscopic systems.", "url": "https://arxiv.org/abs/2609.24450", "type": "理论", "summary": "1. 该工作提出有效质量方法，将短记忆非马尔可夫系统近似为马尔可夫系统，并把记忆效应封装进有效质量，从而连接马尔可夫与非马尔可夫区域。\n2. 其卖点在于揭示短记忆对物理动力学的显著影响：在含时相关环境中布朗粒子的定向输运可相对于无记忆介质发生反转，且记忆可作为随机信息比特生成的控制参数。\n3. 这强调了微观系统中短时关联的关键作用，为在保持数学可处理性的同时纳入短记忆效应、并调控输运与信息生成过程提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Mateusz Wiśniewski"}], "featured_authors": [{"name": "Mateusz Wiśniewski"}], "author_count": 1}, {"id": "2609.24461", "category": "cond-mat", "title": "Parallel Simulation of Josephson Junctions With Multiplicative Noise", "abstract": "Parallel graphic processing units have been employed for fast simulations of the switching dynam- ics of Josephson junctions subject to critical current fluctuations. Such a system is modeled by a nonequilibrium washboard model with multiplicative noise, for which analytical results are lacking. The proposed approach allows us to execute extensive numerical simulation in short time and with relatively inexpensive resources. This allows us to fully characterize the effect of the noise on the junction switching current distributions at realistic bias current sweeprates.", "url": "https://arxiv.org/abs/2609.24461", "type": "理论+数值", "summary": "1. 该工作采用图形处理器并行计算，对受临界电流涨落影响的约瑟夫森结开关动力学进行大规模数值模拟，并将其建模为含乘性噪声的非平衡洗衣板模型。\n2. 其技术优势在于通过图形处理器并行化，在短时间和较低计算资源下完成大规模模拟，并可在实际偏置电流扫描速率下完整表征乘性噪声对结开关电流分布的影响。\n3. 这为缺乏解析结果的乘性噪声非平衡系统提供了可扩展的数值研究途径，并有助于评估临界电流涨落对约瑟夫森结开关统计及器件可靠性的影响。", "summary_source": "deepseek", "authors": [{"name": "Vincenzo Pierro"}, {"name": "Luigi Troiano"}, {"name": "Elena Mejuto Villa"}, {"name": "Sergio Pagano"}, {"name": "Giovanni Filatrella"}], "featured_authors": [{"name": "Vincenzo Pierro"}, {"name": "Luigi Troiano"}, {"name": "Elena Mejuto Villa"}, {"name": "Sergio Pagano"}, {"name": "Giovanni Filatrella"}], "author_count": 5}, {"id": "2609.24462", "category": "cond-mat", "title": "Avalanche Size and Interevent Time Statistics in Amorphous System", "abstract": "The intermittent, stick-slip flow of amorphous systems is characterized by avalanches whose statistical properties display robust power-laws. In this paper, we study avalanche statistics in a field theoretical model of a soft-glassy system under shear. The order parameter in our model is the fluidity, which is related to the local rate of plastic events in a soft-glass. While avalanche sizes $S$ have been extensively characterized, the statistics of interevent times $t_i$ have remained largely unexplored. Here, we find that both $S$ and $t_i$ are power-law distributed and that their scaling exponents satisfy a precise relation. The model enables the analytical derivation of the scaling exponents and the reproduction of the behavior observed across a wide class of amorphous systems.", "url": "https://arxiv.org/abs/2609.24462", "type": "理论", "summary": "1. 该工作在场论模型中研究剪切作用下软玻璃态非晶体系的雪崩统计，以与局域塑性事件率相关的流体度作为序参量，并重点比较雪崩尺寸S与事件间时间t_i的分布规律。\n2. 主要卖点是发现S与t_i皆为幂律分布，且二者的标度指数满足精确关系；该模型能解析推导这些指数，并再现广泛非晶体系中观测到的统计行为。\n3. 这表明事件间时间统计与雪崩尺寸同等关键，为统一描述间歇性黏滑流动及检验软玻璃塑性理论提供了可解析的标度框架和明确约束。", "summary_source": "deepseek", "authors": [{"name": "Thomas Muhren"}, {"name": "Roberto Benzi"}, {"name": "Mauro Sbragaglia"}, {"name": "Jeannot Trampert"}, {"name": "Federico Toschi"}], "featured_authors": [{"name": "Thomas Muhren"}, {"name": "Roberto Benzi"}, {"name": "Mauro Sbragaglia"}, {"name": "Jeannot Trampert"}, {"name": "Federico Toschi"}], "author_count": 5}, {"id": "2609.24473", "category": "cond-mat", "title": "Stochastic optimisation method for estimating large deviations", "abstract": "A stochastic optimisation method was recently proposed to efficiently compute large deviation functions, used in statistical physics to characterise the fluctuations of nonequilibrium systems, modelled as Markov processes. The method, called LDSTOP, combines numerical techniques from control theory and machine learning to iteratively construct the \"driven process\", a controlled version of the Markov process used as a model of nonequilibrium system that realises a given fluctuation or large deviation of that system in an optimal way. Compared to other methods based on spectral approximations, importance sampling, cloning or splitting, LDSTOP is simple, flexible, and scalable, as it works by simulating single trajectories that are gradually guided towards the driven process. Here, we illustrate these advantages by applying the method on the full range of Markov processes considered in applications, namely, discrete-time Markov chains, continuous-time jump processes, and diffusion processes. For each type, we define the objective function to be optimised, explain different options available for representing the driven process (using, e.g., neural networks), and provide implementation details through simple applications. With these contributions, we aim to showcase the method's efficiency, as well as its ease of use when combined with available machine learning packages, such as PyTorch, TensorFlow and JAX, for simulating stochastic processes and solving high-dimensional optimisation problems.", "url": "https://arxiv.org/abs/2609.24473", "type": "理论+数值", "summary": "1. 该工作系统阐述了LDSTOP随机优化方法，用于高效估计以马尔可夫过程建模的非平衡系统的大偏差函数，并覆盖离散时间马尔可夫链、连续时间跳跃过程和扩散过程三类模型。\n2. 其核心卖点是通过控制理论与机器学习迭代构造驱动过程，以单条轨迹的渐进引导替代谱近似、重要性采样、克隆或分裂等方案，兼具简单、灵活和可扩展性。\n3. 该框架为借助PyTorch、TensorFlow或JAX等机器学习工具求解高维随机过程优化提供了可操作路径，并有望推动非平衡涨落与稀有事件模拟在更广泛马尔可夫模型中的应用。", "summary_source": "deepseek", "authors": [{"name": "Daniël W. H. Cloete"}, {"name": "Hugo Touchette"}], "featured_authors": [{"name": "Daniël W. H. Cloete"}, {"name": "Hugo Touchette"}], "author_count": 2}, {"id": "2609.24490", "category": "cond-mat", "title": "Onset of a Fold Cascade in a Hopf Texture Driven by a Navier--Stokes Blow-Up Analog", "abstract": "A two-component Bose--Einstein condensate can host a pseudospin Hopf texture while its thermal cloud obeys viscous Navier--Stokes dynamics. Motivated by OpenAI's reported finite-time singular solution, we drive such a texture with a surrogate of the collapsing core, using an effective Madelung--Schrödinger theory with a Faxén-like advective correction. The texture undergoes fold-mediated creation and annihilation of preimage pairs at conserved Hopf charge with the first one-to-three transition confirmed to obey the square-root opening of a Thom $A_2$", "url": "https://arxiv.org/abs/2609.24490", "type": "理论", "summary": "1. 二元玻色-爱因斯坦凝聚态可以具有赝自旋霍普夫结构，而其热云服从粘性纳维-斯托克斯动力学。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Antti J. Niemi"}], "featured_authors": [{"name": "Antti J. Niemi"}], "author_count": 1}, {"id": "2609.24502", "category": "cond-mat", "title": "Carrier-mediated spin helices in low-dimensional systems: Josephson-interference features and correlation renormalization", "abstract": "Carrier-induced helical magnetism can arise in interacting one-dimensional systems coupled to localized moments. Here, we investigate the coupled-wire sliding-Luttinger-liquid counterparts with and without valley degrees of freedom, using isolated Tomonaga-Luttinger liquids as reference limits. The carrier spin susceptibility mediates a Ruderman-Kittel-Kasuya-Yosida interaction that selects the helical ordering wave vector, while interchannel correlations lock the relative helix phases and stabilize a collective quasi-two-dimensional texture. Using a variational treatment, we estimate the helix-induced partial gap and analyze the reconstruction of the remaining gapless carrier modes. To probe the spatial texture through transport, we incorporate the helix into an anisotropic superconductor-normal-metal-superconductor Josephson junction motivated by the coupled-channel structure of twisted bilayer WTe$_2$. We exploit flux focusing near the junction interfaces to make an applied in-plane field a controlled probe of the spin helix. Relative to junctions without the helix, the helical exchange field modifies the central-lobe width and relative lobe weights. In the transverse-channel geometry, it also produces field-dependent side-lobe asymmetry and central-peak displacement, which remain negligible in the matched references for the parameters considered. The reconstructed carrier sector also exhibits modified local-density-of-states exponents, spin-relaxation behavior, and competing correlations, with distinct signatures in isolated and coupled-wire systems. Our results connect collective helical order in coupled-wire systems to carrier-sector reconstruction and identify field-tunable Josephson interferometry as a complementary transport probe of the spatial spin texture.", "url": "https://arxiv.org/abs/2609.24502", "type": "理论+数值", "summary": "1. 该工作研究耦合线滑动Luttinger液体中载流子介导的自旋螺旋，并对比有无谷自由度及孤立TLL参考极限。\n2. 关键在于载流子自旋磁化率诱导RKKY作用选择螺旋波矢，通道间关联锁定相位并稳定准二维织构，变分估算部分能隙与载体模式重构。\n3. 该方案将螺旋嵌入各向异性超导-正常金属-超导结，利用界面通量聚焦使面内场调控中心瓣与旁瓣，表明场可调约瑟夫森干涉可作自旋织构的互补输运探针。", "summary_source": "deepseek", "authors": [{"name": "Yung-Yeh Chang"}, {"name": "Chen-Hsuan Hsu"}], "featured_authors": [{"name": "Yung-Yeh Chang"}, {"name": "Chen-Hsuan Hsu"}], "author_count": 2}, {"id": "2609.24529", "category": "cond-mat", "title": "Phase diagram morphology shapes droplet propulsion in chemical gradients", "abstract": "Droplets in complex environments often encounter compositional gradients that drive their propulsion. For example, surfactant gradients induce surface-tension-driven propulsion via the Marangoni effect. Here, we show that such propulsion emerges generically, even in the absence of surfactants. Employing a thin-interface approximation, we derive a compact expression for the droplet velocity in terms of droplet size, viscosity, the sensitivity of surface tension to a regulating component, and the chemical potential gradient of that component. Our theory reveals that droplets move toward regions of lower stability, as encoded in the morphology of the phase diagram, particularly near critical points. Numerical simulations confirm these results, which establish a general route to predicting and designing droplet motility from the phase behavior of complex fluids.", "url": "https://arxiv.org/abs/2609.24529", "type": "理论+数值", "summary": "1. 该工作采用薄界面近似，推导出液滴在化学梯度中速度的紧凑表达式，并表明无需表面活性剂即可由相图形貌驱动液滴推进。\n2. 其核心卖点在于将液滴速度与尺寸、黏度、表面张力对调控组分的敏感度及该组分化学势梯度定量关联，揭示液滴趋向稳定性较低区域，尤其靠近临界点。\n3. 数值模拟证实上述结果，为从复杂流体的相行为出发预测和设计液滴运动性建立了通用框架，并暗示相图形貌可作为调控其普适推进的判据。", "summary_source": "deepseek", "authors": [{"name": "Stefan Köstler"}, {"name": "Malcolm Steen"}, {"name": "David Zwicker"}], "featured_authors": [{"name": "Stefan Köstler"}, {"name": "Malcolm Steen"}, {"name": "David Zwicker"}], "author_count": 3}, {"id": "2609.24602", "category": "cond-mat", "title": "Random-matrix and transport frequencies in eigenstate spectral functions", "abstract": "The fact that generic isolated many-body quantum systems thermalize is understood using the eigenstate thermalization hypothesis (ETH). In recent years, there has been much interest in the behavior of the ETH spectral functions, which characterize the smooth dependence of the variance of the off-diagonal matrix elements of observables on the associated energy and frequency, and whose low-frequency part contains information about the long-time dynamics. In finite systems described by the ETH, the spectral functions are expected to exhibit plateaus below a characteristic frequency $\\omega^{}_{\\mathrm{ETH}}$. In this regime, the statistics of the matrix elements of observables are expected to be described by random matrix theory. Related frequencies that have been studied in the literature are $\\omega^{}_{\\mathrm{SFF}}$, which controls the onset of random-matrix behavior in the spectral form factor, and the transport frequencies $\\omega^{}_{\\mathrm{tr}}$, which are derived from transport coefficients. However, a direct quantitative comparison of these frequencies is lacking. Using exact diagonalization, we conduct such a comparison for the spectral functions of current operators in clean and disordered quantum spin ladders with diffusive energy and spin transport. We find clear evidence for the expected low-frequency plateaus in the ETH spectral functions. For the accessible system sizes, $\\omega^{}_{\\mathrm{SFF}}$ is consistent with the extent of the plateaus, while the transport frequencies are systematically larger and lie in the nonuniversal regime of the spectral functions. Our findings highlight the need to better understand the origin of these quantitative differences.", "url": "https://arxiv.org/abs/2609.24602", "type": "理论+数值", "summary": "1. 该工作通过精确对角化，在能量和自旋输运均为扩散的干净与无序量子自旋梯子中，对电流算符的ETH谱函数所含随机矩阵频率与输运频率进行了直接定量比较。\n2. 其核心结果是观察到ETH谱函数低频平台，并发现可及尺寸下谱形因子起始频率ω_SFF与平台范围一致，而输运频率ω_tr系统性偏大并处于谱函数的非普适区。\n3. 这提示需厘清ω_ETH、ω_SFF与ω_tr等尺度差异的物理起源，并检验随机矩阵统计、长时输运与ETH图像在有限系统中的衔接。", "summary_source": "deepseek", "authors": [{"name": "Kadir Çeven"}, {"name": "Rohit Patil"}, {"name": "Marcos Rigol"}, {"name": "Fabian Heidrich-Meisner"}], "featured_authors": [{"name": "Kadir Çeven"}, {"name": "Rohit Patil"}, {"name": "Marcos Rigol"}, {"name": "Fabian Heidrich-Meisner"}], "author_count": 4}, {"id": "2609.24722", "category": "cond-mat", "title": "Lowest-known Energy Configuration of $N=100\\,000$ Coulomb Charges in a Disk: Breaking the $10^{5}$ Barrier", "abstract": "We report the first calculation of the lowest-known energy configuration for $N=100\\,000$ classical point charges confined to a disk and interacting via the $1/r$ Coulomb potential - a system size never before achieved for the Thomson problem in a disk, more than doubling the previous record of $N=40\\,886$ reported by Amore and Zarate. An adaptive defect-targeting subdomain optimization strategy yields an approximately linear growth of the wall-clock time per cycle with $N$; for $N=100\\,000$ a single $24$-core CPU workstation without GPU acceleration required $\\approx31$ hours. The energy $E_{\\min}=7.80466624157\\times10^{9}$ deviates from the asymptotic expansion fitted to $100\\le N\\le5000$ data by only $2.525\\times10^{-7}$, providing a stringent test of its extrapolation to unprecedented scales. Bond-orientational order analysis reveals a polycrystalline bulk threaded by radial grain boundaries, establishing a new benchmark for two-dimensional Coulomb systems.", "url": "https://arxiv.org/abs/2609.24722", "type": "理论+数值", "summary": "1. 首次给出圆盘内N=100000个1/r库仑点电荷的最低已知能量构型，规模较此前N=40886记录翻倍以上。\n2. 其卖点是自适应缺陷定位子域优化使单周期耗时随N近线性增长，且能量与渐近展开仅偏差2.5×10^-7。\n3. 键取向序分析揭示多晶体内核被径向晶界贯穿，为二维库仑体系及渐近外推提供了严格基准。", "summary_source": "deepseek", "authors": [{"name": "Georgiy K. Lavrov"}, {"name": "Eduard G. Nikonov"}], "featured_authors": [{"name": "Georgiy K. Lavrov"}, {"name": "Eduard G. Nikonov"}], "author_count": 2}, {"id": "2609.24738", "category": "cond-mat", "title": "From harmonic to sound-like oscillations in a quantum gas confined in a gravity compensated shell trap", "abstract": "We study the center of mass oscillations of a quantum gas in a shell shaped trap in the presence of a vertical force opposed to gravity. The measured harmonic frequency at the bottom of the shell is compared with an analytical formula for the trap potential including corrections beyond the rotating wave approximation. When gravity is partially compensated, a quartic correction to the harmonic motion has to be included due to the shell curvature. As gravity is nearly canceled, the quantum gas occupies a large fraction of the lower hemisphere. Driving the center of mass induces internal excitations in the quantum gas, whose time evolution is governed by the presence of sound waves. Relaxation processes induce a strong damping of the center of mass oscillation in this limit.", "url": "https://arxiv.org/abs/2609.24738", "type": "理论", "summary": "1. 该工作研究了重力补偿壳形势阱中量子气体的质心振荡，测量底部谐波频率，并与包含超越旋转波近似修正的解析势公式比较。\n2. 其关键物理在于揭示随重力补偿程度变化，壳曲率导致四次修正，而重力近乎抵消时气体占据下半球大部分区域，质心驱动激发内部声波主导的演化并造成强阻尼，呈现从谐波到声波式振荡的转变。\n3. 这为曲面量子气体中质心模式与内部声学模式的耦合、超越旋转波近似修正及弛豫阻尼研究提供了明确平台与启发。", "summary_source": "deepseek", "authors": [{"name": "Matthieu Cassus"}, {"name": "Rishabh Sharma"}, {"name": "Maxime Pesche"}, {"name": "Laurent Longchambon"}, {"name": "Thomas Badr"}, {"name": "Romain Dubessy"}, {"name": "Hélène Perrin"}], "featured_authors": [{"name": "Matthieu Cassus"}, {"name": "Rishabh Sharma"}, {"name": "Maxime Pesche"}, {"name": "Thomas Badr"}, {"name": "Romain Dubessy"}, {"name": "Hélène Perrin"}], "author_count": 7}, {"id": "2609.24748", "category": "cond-mat", "title": "Optimal probing scale for current fluctuations in a Brownian gyrator", "abstract": "A driven colloidal rotor sustains a circulating current whose fluctuations one would like to bound. Any such bound rests on how strongly the current responds to a perturbation and on how much extra dissipation that perturbation costs, so there is a well-posed question of where to push: the response per unit Onsager-Machlup cost depends on the radius at which the probe acts, and is maximised at a definite one. We answer this for the Brownian gyrator and a quadrupolar shear under a Gaussian envelope, a probe chosen so that linear response is exactly blind to it at every observation window, so that the entire signal is second order. The problem separates: the cost is radial and does not see the circulation, while the response lives in the $m=3$ angular sector, where the resolvent reduces to Kummer's equation with $b=4$ and the susceptibility is a hypergeometric function of the envelope width. Maximising the ratio gives the optimal probing radius in closed form. It is set by whichever of the system's two clocks is faster: for weak driving $r^*=1.1264\\sqrt{D/\\gamma}$, the thermal radius of the trap, and for strong driving $r^*=1.5563\\sqrt{D/\\Omega}$, the distance diffused in one radian of rotation, with the trap stiffness dropping out entirely. The crossover is at $\\Omega=\\gamma$. Both limits, and the prefactors, are confirmed against direct simulation.", "url": "https://arxiv.org/abs/2609.24748", "type": "理论+数值", "summary": "1. 受驱动的胶体转子维持着循环电流，人们希望限制其波动。\n2. 它由系统的两个时钟中较快的一个来设置：对于弱驱动 $r^*=1.1264\\sqrt{D/\\gamma}$，陷阱的热半径；对于强驱动 $r^*=1.5563\\sqrt{D/\\Omega}$，在一个旋转弧度内扩散的距离，陷阱刚度完全下降。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Badr Farih"}], "featured_authors": [{"name": "Badr Farih"}], "author_count": 1}, {"id": "2609.24844", "category": "cond-mat", "title": "Navier-Stokes hydrodynamics near the critical point with out-of-equilibrium modes", "abstract": "We investigate how slow out-of-equilibrium modes (OEM), introduced to extend the regime of validity of hydrodynamics near the critical point, fundamentally reshape the power spectrum of dynamical density fluctuations. We have used the equation of motion of slow modes for the situation when the extensive nature of thermodynamics is not altered due to the introduction of OEM. We find that the extensivity condition puts an extra constraint on the coupling of OEM with the four divergence of velocity. In the absence of OEM, the dynamic structure factor exhibits three Lorentzian peaks, one at zero frequency ($\\omega$), called Rayleigh peak and the other two called Brillouin peaks located symmetrically about $\\omega=0$. When the system is away from the critical point the inclusion of the OEM preserves the symmetry of the distributions but all the peaks acquire reduced widths and the Brillouin peaks adopt unequal heights. Irrespective of the value of OEM (zero or nonzero) the Brillouin peaks vanish near the critical point. The width of the Rayleigh peak substantially reduced in presence of OEM. Such reductions of the widths in presence of the OEM indicates the reduction in the decay rate of the fluctuation which leads to slowing down of decay of the fluctuations, a distinctive feature of the critical point.", "url": "https://arxiv.org/abs/2609.24844", "type": "理论", "summary": "1. 该工作将慢非平衡模式引入临界点附近的纳维-斯托克斯流体力学，研究其对动态密度涨落功率谱的重塑。\n2. 由慢模运动方程并保持热力学广延性，导出其与速度四散度耦合的额外约束，并给出峰宽减小、布里渊峰不等高及近临界消失的谱特征。\n3. 峰宽减小表明涨落衰减率降低并体现临界慢化，为扩展临界点附近流体力学及动态结构因子提供受广延性约束的判据。", "summary_source": "deepseek", "authors": [{"name": "Md Hasanujjaman"}, {"name": "Golam Sarwar"}, {"name": "Mahfuzur Rahaman"}, {"name": "Abhijit Bhattacharyya"}, {"name": "Jane Alam"}], "featured_authors": [{"name": "Md Hasanujjaman"}, {"name": "Golam Sarwar"}, {"name": "Mahfuzur Rahaman"}, {"name": "Abhijit Bhattacharyya"}, {"name": "Jane Alam"}], "author_count": 5}, {"id": "2609.24905", "category": "cond-mat", "title": "Channel concentration of critical quantum geometry", "abstract": "The quantum metric quantifies the total ground-state response along a parameter direction, but does not resolve how excitations share that response. We define channel concentration (CC) as the sum of squared normalized response weights over specified excitation channels, such as momentum blocks. An exact finite-size theorem yields thermodynamic CCs of 2/3 for the field response of the critical transverse-field Ising model and 1/3 for the half-filled XX pairing response, despite the same leading metric scaling. In finite-size approaches to the XY Lifshitz point, field and anisotropy perturbations yield different concentrations despite a common limiting Hamiltonian with quadratic dispersion. In a unitary 1+1-dimensional conformal field theory (CFT) on a circle, we consider a nondegenerate vacuum in a fixed sector perturbed by one spatially integrated scalar primary. We derive complete zero-momentum energy-level response weights, including descendants. For scaling dimension $0<\\Delta<3/2$, these weights determine the normalized response distribution and an exact universal concentration function. The expression reproduces the exact Ising lattice limit 2/3 and gives approximately 0.8515 for the three-state Potts thermal field, compared with approximately 0.800 from an exponent-only approximation. Finite-size interacting calculations compare concentrations and ranked response weights over many-body energy levels. These exact benchmarks show which response distinctions total metric scaling misses and guide comparisons with finite-size interacting spectra.", "url": "https://arxiv.org/abs/2609.24905", "type": "理论+数值", "summary": "1. 量子度量量化了沿参数方向的总基态响应，但没有解决激发如何共享该响应的问题。\n2. 该表达式再现了精确的伊辛晶格极限 2/3，并给出了三​​态 Potts 热场的大约 0.8515，而仅指数近似的结果约为 0.800。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Qian-Rui Lee"}, {"name": "Daw-Wei Wang"}], "featured_authors": [{"name": "Qian-Rui Lee"}, {"name": "Daw-Wei Wang"}], "author_count": 2}, {"id": "2609.24907", "category": "cond-mat", "title": "Nucleosome simulations suggest mechanisms of electrostatically-driven mesoscale chromatin evolution", "abstract": "Nucleosomes are structures made up of proteins called histones that bind and compact DNA, driving the mesoscale organization of the chromatin polymer. Although histone proteins have diversified over evolutionary time, their contributions to the corresponding diversification of chromatin structure are poorly understood. Here, we mine protein databases for histones and create \\emph{in silico} nucleosomes for 3241 organisms spanning $>$1.5B years of evolution. Using a combination of electrostatic calculations and coarse-grained molecular dynamics simulations, we reveal extensive biophysical diversification of the nucleosome unit. Finally, we perform coarse-grained oligonucleosomal simulations on a subset of evolutionarily and biophysically divergent nucleosomes, demonstrating dramatic differences in bulk phase behavior of chromatin. Taken together, our results suggest a paradigm in which histones may have evolved to facilitate particular types of mesoscale chromatin behavior.", "url": "https://arxiv.org/abs/2609.24907", "type": "数值", "summary": "1. 该工作挖掘组蛋白数据库，为跨越超过15亿年进化的3241个物种构建计算核小体，并联合静电计算与粗粒化分子动力学模拟，表征核小体单元的多样化及其对染色质介观组织的影响。\n2. 其核心卖点在于揭示核小体单元存在广泛的生物物理分化，且对进化与生物物理差异显著的核小体进行寡聚核小体粗粒化模拟时，染色质体相行为差异巨大，表明静电相互作用驱动的机制可塑造介观染色质演化。\n3. 该结果支持一种范式：组蛋白可能进化以促进特定类型的介观染色质行为，为连接组蛋白序列演化、静电作用与染色质高阶组织及相关实验和理论提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Siddhartha G. Jena"}], "featured_authors": [{"name": "Siddhartha G. Jena"}], "author_count": 1}, {"id": "2609.22422", "category": "hep-th", "title": "Microcanonical Operator Spectrum, BPS Chaos and Free Probability Theory", "abstract": "Matrix elements of simple operators are central to thermalization in chaotic quantum many-body systems. Their moments are often described statistically through the Eigenstate Thermalization Hypothesis. In this paper, we study a more refined characterization of these matrix elements: the eigenspectrum of simple operators once projected to microcanonical energy windows. The spectrum encodes all moments of the matrix elements at once, and is particularly relevant when the spectrum of the Hamiltonian is degenerate. Assuming that the eigenbasis of the simple operator is Haar-randomly oriented with respect to that of the Hamiltonian, we prove that the spectrum of an operator projected to a small microcanonical window obeys Gaussian random matrix statistics. We do this directly by studying the probability distribution inherited from the random orientation, as well as using tools from Free Probability Theory. We discuss the implications for BPS chaos and more generally for eigenstate thermalization.", "url": "https://arxiv.org/abs/2609.22422", "type": "理论", "summary": "1. 该文将简单算符矩阵元的热化问题细化为微正则能量窗内投影算符的本征谱，并在简单算符本征基相对哈密顿量本征基为哈尔随机取向的假设下，证明该谱服从高斯随机矩阵统计。\n2. 其技术卖点在于直接分析随机取向诱导的概率分布，并借助自由概率论工具，将全部矩阵元矩一次性编码进微正则谱，且适用于哈密顿量谱简并的情形。\n3. 这一结果为BPS混沌及更一般的本征态热化提供了谱统计层面的判据，并提示自由概率论可推广用于简并或受对称性约束的量子多体热化研究。", "summary_source": "deepseek", "authors": [{"name": "Alexandre Belin"}, {"name": "Yichao Fu"}, {"name": "Federico La Rocca"}], "featured_authors": [{"name": "Alexandre Belin"}, {"name": "Yichao Fu"}, {"name": "Federico La Rocca"}], "author_count": 3}, {"id": "2609.22504", "category": "hep-th", "title": "Tripartite Form Universality in Holographic Entropy Inequalities", "abstract": "To elucidate the meaning of holographic entropy inequalities (beyond subadditivity) which characterize the entanglement structure of geometric states in holography, arXiv:2309.06296 proposed the \"tripartite form\" for these inequalities, consisting of tripartite information and conditional tripartite information terms with unit coefficients. While this provides a compact and useful packaging of the inequalities, it is not a priori guaranteed that all inequalities can be recast in this form. Here we conjecture that they can, and present substantial evidence, by proving that the two known infinite families of holographic entropy inequalities found in arXiv:2309.15145 can indeed be written in the tripartite form. This is significant because such recasting is particularly nontrivial for these families. Apart from providing the explicit tripartite form expressions for every member of these two infinite families, we detail how we arrived at them, in the process deriving several useful identities which may serve as stepping stones to formulate further repackaging of the corresponding information quantities. We also illustrate the power of the tripartite form by proving a number of structural properties satisfied by any holographic entropy inequality.", "url": "https://arxiv.org/abs/2609.22504", "type": "理论", "summary": "1. 该工作猜想全息熵不等式均可重写为三分形式，并证明两个已知无穷族不等式确实能写成由三分信息与条件三分信息项、系数取单位值构成的紧凑表达式。\n2. 其技术卖点是为这两族每个成员给出显式三分形式，并详述推导、导出若干便于进一步重写信息量的恒等式，同时利用该形式证明任意全息熵不等式均满足的结构性质。\n3. 这为三分形式的普适性提供了实质证据，表明它可统一理解几何态纠缠结构、简化全息熵不等式，并启发后续对更广泛信息量的重打包。", "summary_source": "deepseek", "authors": [{"name": "Veronika E. Hubeny"}, {"name": "Yu Liu"}], "featured_authors": [{"name": "Veronika E. Hubeny"}, {"name": "Yu Liu"}], "author_count": 2}, {"id": "2609.22526", "category": "hep-th", "title": "External Sources in Pseudo-Quantum Electrodynamics", "abstract": "In this letter, we investigate the interaction between stationary point-like external sources within the framework of Pseudo-Quantum Electrodynamics (PQED). Besides ordinary electric charges, we consider configurations involving Dirac points and generalized topological sources. For the configurations analyzed, we compute the corresponding interaction energies, forces, torques, and electromagnetic field configurations. Furthermore, we compare the results obtained in PQED with those arising in ordinary planar Maxwell electrodynamics, showing that the nonlocal character of PQED gives rise to physical effects with no counterpart in the conventional local planar theory. In particular, our results show that topological sources induce intrinsically anisotropic and non-central interactions, leading to the emergence of nontrivial torques between the interacting objects. The directional character of these interactions suggests possible applications in the effective description of topological defects and anisotropic phenomena in planar condensed matter systems.", "url": "https://arxiv.org/abs/2609.22526", "type": "理论", "summary": "1. 该工作研究了赝量子电动力学框架中静止点状外源之间的相互作用，涵盖普通电荷、狄拉克点及广义拓扑源等构型，并计算了相应的相互作用能、力、力矩和电磁场位形。\n2. 其核心卖点在于，赝量子电动力学的非局域性使其结果不同于常规平面麦克斯韦电动力学，尤其是拓扑源诱导内禀各向异性、非中心相互作用和非平凡力矩。\n3. 这些具有方向性的相互作用为平面凝聚态体系中拓扑缺陷及各向异性现象的有效描述提供了潜在启示。", "summary_source": "deepseek", "authors": [{"name": "L.H.C. Borges"}, {"name": "A.A. Nogueira"}, {"name": "F.A. Barone"}], "featured_authors": [{"name": "L.H.C. Borges"}, {"name": "A.A. Nogueira"}, {"name": "F.A. Barone"}], "author_count": 3}, {"id": "2609.22613", "category": "hep-th", "title": "Phase Transitions at More Unusual Values of Theta", "abstract": "We calculate the $\\theta$ dependence of the vacuum energy in an infinite family of cousins of QCD, where the vacuum structure can be analyzed exactly. These theories are $\\mathcal{N}=1$ EFTs that descend from $\\mathcal{N}=2$ $SU(N_c)$ gauge theory with $N_f$ flavors of fundamental hypermultiplets, that are then deformed by anomaly mediated supersymmetry breaking (AMSB). We reproduce results found in previous work that used the full $\\mathcal{N}=2$ machinery but via a much simpler $\\mathcal{N}=1$ method. Our method easily extends to infinitely many more theories for which the full $\\mathcal{N}=2$ approach becomes intractable. We identify values of $\\theta$ for which the theory undergoes a phase transition, and find that they can occur at both fractional and irrational values of $\\theta/\\pi$.", "url": "https://arxiv.org/abs/2609.22613", "type": "理论", "summary": "1. 该工作在一无限族真空结构可精确分析的QCD类似理论中计算了真空能量的θ依赖，这些理论是N=2 SU(Nc)规范理论加Nf个基本超多重态经AMSB形变得到的N=1有效场论。\n2. 其技术卖点是用更简单的N=1方法重现了此前依赖完整N=2机制的结果，并可推广至后者难以处理的无限多理论，从而定位θ/π为分数和无理数时的相变。\n3. 这表明θ依赖的真空能相变可出现在非传统θ值上，为QCD类似理论及超对称破缺下的真空结构研究提供了更可扩展的有效场论途径。", "summary_source": "deepseek", "authors": [{"name": "Dhruv Aldas"}, {"name": "Hitoshi Murayama"}, {"name": "Bea Noether"}, {"name": "Digvijay Roy Varier"}], "featured_authors": [{"name": "Dhruv Aldas"}, {"name": "Hitoshi Murayama"}, {"name": "Bea Noether"}, {"name": "Digvijay Roy Varier"}], "author_count": 4}, {"id": "2609.22717", "category": "hep-th", "title": "Semiclassical reconstruction of the Toda pole lattice via analytic continuation of the Probabilistic Approach", "abstract": "We develop a probabilistic construction of Toda field theory correlators from the Coulomb gas representation. Reinterpreting $n$-point functions of primaries as $w$-moments of random variables with respect to a Gaussian measure, we derive constraints on the Toda momenta and coupling constant. $L^2$ and $L^p$ convergence conditions for the associated random variables, triviality constraints on the correlators, and local integrability conditions for the cross-moments are derived. These constraints define an extended region of convergence for the Toda correlators and provide a systematic, probabilistic interpretation of the Seiberg bounds. We proceed to analytically continue the moment indices by employing a Mellin-Barnes representation of the random variables. The local convergence boundaries become meromorphic local integrability divisors, and, in the semiclassical $b\\to0$ limit, these divisors reconstruct the Liouville charge pole lattice. For $A_n$ Toda theory, we show that natural $W_n$-closure conditions in this semiclassical limit select rank-one, Virasoro-like submodules inside the full Toda theory. On these slices, the scalar integrability conditions reduce to Liouville-like divisors and recover the corresponding Toda charge pole lattices.", "url": "https://arxiv.org/abs/2609.22717", "type": "理论", "summary": "1. 该工作从库仑气体表示出发，用高斯测度下随机变量的w矩重构Toda场论关联函数，并借助Mellin-Barnes表示对矩指数做解析延拓。\n2. 其核心在于局部收敛边界在延拓后成为亚纯局部可积除子，并在半经典b→0极限下重建Liouville电荷极点格，同时W_n闭合条件选出秩一Virasoro型子模。\n3. 这为Seiberg界提供了系统的概率解释，并提示可把完整Toda理论约化到Liouville型切片以恢复相应电荷极点格。", "summary_source": "deepseek", "authors": [{"name": "Jacques Distler"}, {"name": "Bahaa Elshimy"}], "featured_authors": [{"name": "Jacques Distler"}, {"name": "Bahaa Elshimy"}], "author_count": 2}, {"id": "2609.23079", "category": "hep-th", "title": "Toroidal Charged AdS Branes and Deformed Toda Equations", "abstract": "We show that the equations of motion for magnetically charged $p$-branes in $(n+p+2)$-dimensional AdS reduce to coupled one-dimensional Toda-type equations, and use this structure to construct static toroidal black branes with $T^n$ symmetry and $p$ translation-invariant directions. In the pure-Maxwell case we obtain an exact $\\sinh$ solution--a $(p+2)$-dimensional black brane times an $n$-torus, asymptotically $\\mathrm{AdS}_{p+2}\\times T^n$--whose dilatonic analogue, with a scalar coupled through $e^{a\\phi}$, has a running torus modulus and a non-trivial dilaton. A perturbative expansion reduces the linearized system to a pair of Pöschl-Teller equations, one elementary and one solved by associated Legendre functions of non-integer degree, so that the general solution is non-elementary; at weak coupling $\\epsilon=a^2$ we construct the $O(a^2)$ backreaction explicitly. From the surface gravity, horizon area, and holographic renormalization we obtain the Hawking temperature, entropy density, and mass density, verifying the first law $d\\mathcal{M}=T_H\\,ds$ and the traceless conformal stress tensor of the dual $(p+1)$-dimensional theory. At $O(a^2)$ the first law persists, but the dilaton source shifts the Stefan-Boltzmann exponent to $p_{\\rm eff}=p+a^2/2$, breaking the clean power law $s\\propto T_H^p$ while the normalizable dilaton hair decouples from the entropy.", "url": "https://arxiv.org/abs/2609.23079", "type": "理论", "summary": "1. 该工作将AdS中磁荷p-膜的运动方程约化为耦合一维Toda型方程，并构造T^n对称的静态环面黑膜。\n2. 其技术卖点是精确sinh解、跑动环面模与Pöschl-Teller线性化，并在O(a^2)反作用中验证第一定律及对偶无迹共形应力张量。\n3. O(a^2)下第一定律仍成立，但伸缩子源使Stefan-Boltzmann指数变为p_eff=p+a^2/2，破坏s∝T_H^p幂律，且可归一化伸缩子毛发与熵解耦。", "summary_source": "deepseek", "authors": [{"name": "Sangheon Yun"}], "featured_authors": [{"name": "Sangheon Yun"}], "author_count": 1}, {"id": "2609.23395", "category": "hep-th", "title": "Homogeneous Non Symmetric Special Kähler Geometries as Broken Isometry Metrics on Symmetric CV {K}ähler Manifolds:a new tool for $r=2$ CaNNs", "abstract": "In this paper we prove in full detail the isomorphism between the solvable group $\\mathcal{S}_{2,2+p}$, metric equivalent to the Calabi Vesentini symmetric space $\\mathrm{SO(2,2+p)/SO(2)\\times SO(2+p)}$, and the solvable group $\\mathcal{S}_{\\mathrm{L}(-1,p)}$ supporting the Kähler metric of the homogeneous non symmetric special manifold L$(-1,p)$. From an Alekseevskyan point of view the two spaces simply correspond to two different quadratic forms on the same solvable Lie algebra that we present and compare in detail. Furthermore considering the full group of isometries $\\mathrm{Iso}_{\\mathrm{L}(-1,p)}$ of L$(-1,p)$ we show that $\\mathrm{Iso_{L(-1,p)}}\\subset \\mathrm{SO}(2,2+p)$ is a non-semisimple subgroup of the simple isometry group of Calabi-Vesentini manifolds. Altogether the Special Kähler manifold L$(-1,p)$ can be seen as a coset manifold $\\mathrm{Iso_{L(-1,p)}}/\\mathrm{H}$ where $\\mathrm{H}=\\mathrm{U(1)}_L\\times \\mathrm{SO(p)}$, the generator of $\\mathrm{U(1)}_L$ being in $\\so(2,2+p)$, yet not in the canonical $\\so(2)\\oplus\\so(2+p)$ subalgebra. The action of $\\mathrm{Iso}_{\\mathrm{L}(-1,p)}$ on the solvable coordinates of the CV manifold can be constructed directly. This identification provides a valuable tool for Cartan Neural Networks, introducing additional non linear transformations in eve
