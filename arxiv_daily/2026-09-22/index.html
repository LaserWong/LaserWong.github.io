<head>

  <title>arXiv 2026-09-22 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

pe": "理论+数值", "summary": "1. 准确地模拟异质温度场的时间演化需要解决热方程中由温度相关的热物理特性、转变潜热和任何局部热源/热汇引起的强非线性。\n2. SG 方法消除了 FE 方法所需的全局求解，并且其对结构化网格的使用允许高效的 GPU 并行化。\n3. SG 求解器应用于快速激光-金属相互作用，可重现高保真 FE 温度场，相对误差小于 1%，同时 GPU 运行时间加快 227 倍。", "summary_source": "local-fallback", "authors": [{"name": "Théo Andrieux"}, {"name": "Andreas Ntinos"}, {"name": "Manas V. Upadhyay"}], "featured_authors": [{"name": "Théo Andrieux"}, {"name": "Andreas Ntinos"}, {"name": "Manas V. Upadhyay"}], "author_count": 3}, {"id": "2609.22300", "category": "cond-mat", "title": "Testing Two-State Access in Brain and Language Model: Human EEG Reproduction, Simulation Audit, and a Proposed Model Assay", "abstract": "Brains and the hardware of artificial neural networks are both organized ordinary matter, and whether an artificial system's organization can support consciousness remains open. This paper examines one proposed mechanism, access to a capacity-limited global workspace, through one prediction of the global neuronal workspace theory: near threshold, the single-trial response distribution is a mixture of two states rather than a continuum. Two completed analyses are reported. First, the published competing-model test of that prediction is reproduced from the authors' code on the open EEG data of twenty participants. In the active session the two-state model's protected exceedance probability first exceeds 0.95 at the same 315 ms window, with a modest predictive advantage of about 0.003 nat per trial and optimizer-sensitive interval edges; in the passive session, an additional analysis, a graded comparator ranks highest without an across-window decision. Second, a held-out family comparison proposed for transferring the test to language-model representations is calibrated in simulation at one layer: it made no false two-state call in 12,000 datasets under twelve graded nulls, but its concept-cluster interval under-covered in six settings, down to 0.22, so a replacement interval must be validated before any confirmatory use. The proposed model study, with a natural-text evidence dose, a target bridge and a state-conditional causal test, is specified but not run. No claim about experience is made.", "url": "https://arxiv.org/abs/2609.22300", "type": "理论+数值", "summary": "1. 大脑和人工神经网络的硬件都是有组织的普通物质，人工系统的组织是否能够支持意识仍然是一个悬而未决的问题。\n2. 其次，为将测试转移到语言模型表示而提出的保留族比较在一层模拟中进行了校准：它在 12 个分级空值下的 12,000 个数据集中没有进行错误的两种状态调用，但其概念簇间隔在 6 个设置中覆盖不足，低至 0.22，因此在任何确认性使用之前必须验证替换间隔。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Pieter van Rooyen"}], "featured_authors": [{"name": "Pieter van Rooyen"}], "author_count": 1}, {"id": "2609.22328", "category": "cond-mat", "title": "Universal Response Functions in Driven Dissipative Tunneling Dynamics", "abstract": "Universality in nonlinear nonequilibrium systems is typically expressed through scaling laws that render macroscopic behavior insensitive to microscopic details. Whether this universality survives when periodic forcing and nonlocal dissipative memory act simultaneously remains an open question in driven open dynamics. Here, we demonstrate that barrier-crossing processes in periodically driven dissipative systems are governed not merely by modified exponential scaling, but by an explicit two-parameter universal response function. Within a semiclassical instanton framework incorporating Floquet modulation and Ohmic environmental coupling, the tunneling exponent factorizes into a system-dependent static contribution and a universal function of two dimensionless control parameters: normalized driving frequency and dissipation strength. This factorization arises from the combined modification of a single saddle-point trajectory and introduces no additional independent scaling variables. Weak-to-moderate dissipation acts as a smooth dynamical renormalization of the effective action, preserving the saddle-point structure and enabling controlled analytical expansion. In the high-frequency regime, the response exhibits universal dynamical averaging, while an explicit integral representation establishes a continuous adiabatic to Floquet crossover. Direct numerical evaluation of the nonlocal instanton action confirms that the normalized tunneling exponent exhibits a universal dependence on the driving parameters across different model systems. These results identify driven dissipative barrier crossing as a distinct two-parameter universality class within nonlinear nonequilibrium dynamics and provide a predictive functional framework for response phenomena in driven systems with memory.", "url": "https://arxiv.org/abs/2609.22328", "type": "理论+数值", "summary": "1. 非线性非平衡系统的普遍性通常通过标度定律来表达，这些标度定律使得宏观行为对微观细节不敏感。\n2. 在高频状态下，响应表现出通用动态平均，而显式积分表示建立了连续绝热到 Floquet 交叉。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Krishna Kingkar Pathak"}], "featured_authors": [{"name": "Krishna Kingkar Pathak"}], "author_count": 1}, {"id": "2609.22334", "category": "cond-mat", "title": "A rank-two spherical transform for eigenvector and singular-vector overlaps", "abstract": "We define a rank-two extension $\\mathcal{H}^{(2)}$ of the spherical $\\mathcal{H}$-transform, together with its associated transform $\\mathcal{R}^{(2)}$. For sums, both transforms are additive. The transform $\\mathcal{R}^{(2)}$ yields a $4\\times4$ formula for the average product of two hermitized resolvents, and hence for off-diagonal eigenvector overlaps, recovering the Ginibre, elliptic, and bi-invariant formulas. We also treat correlated pairs of matrices, and obtain overlaps between their eigenvectors or singular vectors.", "url": "https://arxiv.org/abs/2609.22334", "type": "理论", "summary": "1. 该工作将球面 H-变换推广为秩二扩展 H^(2)，并引入相应的 R^(2) 变换，用以研究特征向量与奇异向量的重叠。\n2. 其核心卖点在于两个变换对矩阵和保持加性，且 R^(2) 给出两个 Hermite 化预解式平均乘积的 4×4 闭式表达，从而得到非对角特征向量重叠并统一恢复 Ginibre、椭圆与双不变结果。\n3. 该框架还可处理相关矩阵对，给出其特征向量或奇异向量之间的重叠，为随机矩阵谱统计与相关系综的解析研究提供了可扩展工具。", "summary_source": "deepseek", "authors": [{"name": "Pierre Bousseyroux"}], "featured_authors": [{"name": "Pierre Bousseyroux"}], "author_count": 1}, {"id": "2609.22341", "category": "cond-mat", "title": "NTBuilder: Commensurate Construction of Nanotubes from Arbitrary Two-Dimensional Crystals and a Catalog of 20 Million Structures", "abstract": "Although tens of thousands of two-dimensional (2D) crystals are now known, the nanotubes they can form are usually constructed for individual materials, using procedures derived for graphene. Here, we develop a general theory of the rolling construction for arbitrary 2D crystals and implement it in \\ntbuilder{} (NanoTube Builder), an open-source library with desktop and web interfaces. We express the size of the exact unit cell of a tube through the reduced form of a single rational number built from the lattice metric, which explains why triangular and square lattices always close with small cells, whereas rectangular, centered rectangular, and oblique lattices can require cells larger by many orders of magnitude. The optimal approximate cells are the best rational approximations of a second number, so that a cell small enough for first-principles calculations can be chosen with a controlled departure from periodicity, as in the biphenylene network, where such a cell is eight orders of magnitude smaller than the exact one. The 17 plane groups reduce to seven distinct chirality maps once rolling is taken into account, the rolling sense of layers without a horizontal mirror defines distinct tubes, and bonds formed or broken by curvature are detected pair by pair against the flat layer. The same framework assembles multiwalled tubes whose walls share one axial period, periodic bundles, and strained or twisted structures that remain periodic. Applied to 46,403 distinct 2D systems, it produced a public catalog of 20,334,372 nanotubes, of which 57.1\\% show no bond change upon rolling. All structures can be exported directly as input for first-principles and molecular dynamics codes.", "url": "https://arxiv.org/abs/2609.22341", "type": "理论+数值", "summary": "1. 该工作提出任意二维晶体卷曲成纳米管的普适理论，并实现开源工具NTBuilder，生成含约2033万条纳米管的公开目录。\n2. 其卖点是用晶格度规构造的有理数约化形式精确给出原胞尺寸，并以第二数的最近有理逼近选取近似原胞，解释三角/方格点阵易闭合而矩形、心矩形与斜点阵原胞可大许多量级，还将17个平面群归纳为7类手性映射并逐键检测曲率成键/断键。\n3. 该框架可组装共享轴向周期的多壁管、周期性束及仍保持周期性的应变/扭转结构；对46403种二维体系所得目录中57.1%无键变，为跨材料纳米管的高通量第一性原理与分子动力学研究提供通用路径。", "summary_source": "deepseek", "authors": [{"name": "Marcelo Lopes Pereira Junior"}], "featured_authors": [{"name": "Marcelo Lopes Pereira Junior"}], "author_count": 1}, {"id": "2609.22342", "category": "cond-mat", "title": "Gradient-estimator design overcomes trainability barriers in neural-network-based variational optimization", "abstract": "Neural networks provide expressive representations for scientific computing. However, even sufficiently expressive networks can suffer training failure in weak-gradient regimes, limiting their practical use in quantum many-body physics and ab initio quantum chemistry. Here we derive an unbiased direct gradient estimator and introduce the adaptive minimum-variance phase (AMVP) estimator for neural-network variational optimization. By improving the signal-to-noise ratio of weak gradients, these methods enable reliable scientific calculations where training previously failed, while substantially reducing computational cost. The framework enables compact networks to outperform larger and fine-tuned default standard-estimator models with over an order of magnitude less GPU time on correlated flux models, and ultimately exceed the density matrix renormalization group (DMRG) accuracy. It further achieves chemical accuracy in N$_2$ bond breaking and, for the first time, in heavy-element I$_2$ with explicit spin-orbit coupling. These results demonstrate that gradient-estimator design expands the capabilities of neural-network variational methods for accurate scientific computing.", "url": "https://arxiv.org/abs/2609.22342", "type": "理论+数值", "summary": "1. 该工作针对神经网络变分优化中的弱梯度训练失败问题，推导了无偏直接梯度估计器并提出自适应最小方差相位(AMVP)估计器。\n2. 其核心在于通过提升弱梯度信噪比，使紧凑网络以低一个量级以上的GPU时间超越更大且微调的标准估计器模型及DMRG精度。\n3. 这表明该框架可扩展神经网络变分方法，并在N2键断裂及含自旋轨道耦合的重元素I2中首次实现化学精度。", "summary_source": "deepseek", "authors": [{"name": "Yi-Ran Xue"}, {"name": "Rui Wang"}, {"name": "Baigeng Wang"}, {"name": "Chenan Wei"}], "featured_authors": [{"name": "Yi-Ran Xue"}, {"name": "Rui Wang"}, {"name": "Baigeng Wang"}, {"name": "Chenan Wei"}], "author_count": 4}, {"id": "2609.22365", "category": "cond-mat", "title": "Existence and Uniqueness of Nearest Stealthy Hyperuniform Configurations from Random Initial Conditions", "abstract": "We prove that, for almost every uniformly random configuration of $N$ particles in a two-dimensional periodic square domain, there exists a unique nearest stealthy hyperuniform configuration, up to floppy-mode displacements, when a finite set of $m$ low-$k$ Fourier modes is constrained to vanish exactly. Under an explicit full-rank Jacobian assumption, the displacement component orthogonal to the tangent space of the finite-mode hyperuniform manifold is uniquely determined, while residual tangent-space degrees of freedom correspond to first-order floppy modes that preserve the constrained low-$k$ density fluctuations. We restrict attention to the regime of constrained-mode fraction $\\chi=m/(dN)$ in which such configurations are known to remain disordered rather than crystallize. To corroborate this framework, we implement a gradient-based generator network that iteratively displaces particles to minimize a combined loss functional of hyperuniformity, short-range repulsion, and smoothness, and whose dynamics is expected to approximate the theory's minimal orthogonal projection onto the hyperuniform manifold. The network drives generic random configurations toward disordered hyperuniform representatives, progressively suppressing long-wavelength density fluctuations as measured by the structure factor and number-variance exponent\\textcolor{black}{, over a reciprocal-space window that extends well beyond the explicitly constrained modes and is bounded, as we show, by the structure-factor sum rule. Local bond-orientational analysis and the absence of Bragg peaks confirm that the resulting states remain disordered}. This integrated analytical and computational approach provides a rigorous geometric foundation for understanding stealthy hyperuniformity and for generating its disordered representatives from generic random configurations.", "url": "https://arxiv.org/abs/2609.22365", "type": "理论", "summary": "1. 该工作证明：二维周期方域中几乎每个均匀随机N粒子构型，在有限个低k模被严格约束为零时，存在唯一最近隐超均匀构型（模除软模位移）。\n2. 其卖点是在满秩雅可比假设下唯一确定正交于超均匀流形的位移分量，残余软模保持低k涨落，并以梯度生成网络数值佐证。\n3. 该解析与计算框架为隐超均匀性提供严格几何基础，并可从一般随机构型生成无序代表态，其长波涨落抑制受结构因子求和规则界定。", "summary_source": "deepseek", "authors": [{"name": "Fausto Martelli"}], "featured_authors": [{"name": "Fausto Martelli"}], "author_count": 1}, {"id": "2609.22366", "category": "cond-mat", "title": "From Ferroionic Instability to Domain Patterns at an Exposed Surfaces of Multiaxial Ferroelectrics", "abstract": "We analyze the formation of domain structures in multiaxial ferroelectrics with an open, electrochemically compensated surface. The model combines vector polarization, surface electrochemistry, electrostatics, compatible strain, and competitive adsorption on common sites. We construct homogeneous phase maps and analyze polarization instabilities, first assuming perturbations that are uniform through the film thickness and then allowing depth-dependent polarization profiles. Nonlinear continuation follows the growth of these modulations into developed domains. Optimization of their period and tests of their stability establish how the initial instability wavelength relates to the preferred spacing of an established domain structure. We also consider surface ordering above a stable, weakly anisotropic bulk as a constitutive limit relevant to ferroelectric relaxors, providing insight into possible origins of their periodic surface modulations. Surface energies with the same quadratic terms can produce the same initial instability but favor different developed states, including periodic domains and uniform in-plane polarization. This analysis provides a procedure for connecting the initial development of ferroelectric modulations to amplitude selection, wavelength adjustment, and the subsequent evolution of the resulting domain structures.", "url": "https://arxiv.org/abs/2609.22366", "type": "理论+数值", "summary": "1. 该工作构建了耦合矢量极化、表面电化学、静电、相容应变和竞争吸附的理论模型，用以解析开放且电化学补偿的多轴铁电表面由铁电离子不稳定性到畴图案的形成。\n2. 其核心在于先分析厚度均匀扰动下的极化不稳定性和相图，再引入深度依赖极化剖面并用非线性延拓描述调制增长，从而把初始不稳定波长与成熟畴周期及稳定性联系起来。\n3. 该框架揭示了相同二次表面能可导致相同初始不稳定但不同终态，并为弛豫铁电体表面周期调制及振幅选择、波长调整和后续演化提供可操作路径。", "summary_source": "deepseek", "authors": [{"name": "Sergei V.Kalinin"}], "featured_authors": [{"name": "Sergei V.Kalinin"}], "author_count": 1}, {"id": "2609.22386", "category": "cond-mat", "title": "On the ratio between longitudinal and transverse Ioffe-Regel frequencies in glasses", "abstract": "The temperature dependence of thermal conductivity in glasses differs characteristically from that in crystals, and is largely controlled by how sound waves are damped. The Ioffe-Regel (IR) frequency sets the high-frequency limit of well-defined sound waves. Although the transverse IR frequency has been established to coincide with the boson peak frequency and reported to be far below the longitudinal IR frequency, the quantitative relation between longitudinal and transverse IR frequencies has remained unknown. Here we examine this relation in two- (2D) and three-dimensional (3D) model glasses with vastly different stability. We observe that, in 3D glasses, the longitudinal-to-transverse IR frequency ratio is approximately equal to the ratio of the low-frequency transverse to longitudinal sound attenuation coefficient, whereas this correspondence is not observed in 2D glasses. Moreover, we find that the glass stability strongly controls the longitudinal-to-transverse IR frequency ratio in both 2D and 3D glasses: the ratio decreases significantly with increasing glass stability and approaches unity for the most stable glasses under study. Accordingly, in sufficiently stable glasses, the longitudinal sound attenuation should be comparable to the transverse attenuation, and therefore cannot be treated as negligible, challenging common assumptions adopted especially in theoretical studies. Our work is another demonstration of the glass stability as a key parameter for investigating glass properties, and cautions against simply extrapolating observations from poorly annealed glasses to stable glasses.", "url": "https://arxiv.org/abs/2609.22386", "type": "理论", "summary": "1. 该工作在稳定性差异极大的二维与三维模型玻璃中，定量考察了纵波与横波Ioffe-Regel频率之比及其与声衰减的关系。\n2. 三维玻璃中该比值近似等于低频横波与纵波声衰减系数之比，二维体系则无此对应；且该比值随玻璃稳定性升高而显著下降，在最稳定样品中趋近于1。\n3. 这表明足够稳定的玻璃中纵波声衰减与横波可比、不可忽略，挑战了理论研究中常见的忽略纵波衰减的假设，并警示不应将弱退火玻璃的结论简单外推至稳定玻璃。", "summary_source": "deepseek", "authors": [{"name": "Licun Fu"}, {"name": "Mingyu Zhu"}, {"name": "Xinyu Chang"}, {"name": "Lijin Wang"}], "featured_authors": [{"name": "Licun Fu"}, {"name": "Mingyu Zhu"}, {"name": "Xinyu Chang"}, {"name": "Lijin Wang"}], "author_count": 4}, {"id": "2609.22400", "category": "cond-mat", "title": "Raman scattering in cuprate oxychlorides high-temperature superconductors single-crystals", "abstract": "We investigate the Raman response of sodium-doped cuprate oxychloride Na$_x$Ca$_{2-x}$CuO$_2$Cl$_2$ high-temperature superconductors across their entire phase diagram, from the antiferromagnetic to the superconducting region. In addition to the expected Raman-active phonon modes, we detect several additional modes that can be interpreted as being excited via a resonance process enabled by strong electron--phonon coupling. To verify the resonance effect, the Raman response at different incident photon energies was measured. At high energies, there is a well-defined $B_{1g}$ mode in the antiferromagnetic phase, which can be interpreted as a bimagnon We follow its temperature and doping dependence, providing information on the multimagnon excitation in these cuprates, which can be theoretically linked to the exchange interaction.", "url": "https://arxiv.org/abs/2609.22400", "type": "数值", "summary": "1. 该工作系统测量了钠掺杂铜氧氯化物高温超导体 Na_xCa_{2-x}CuO_2Cl_2 单晶在整个相图（从反铁磁到超导区）的拉曼响应。\n2. 除预期拉曼活性声子外，还观测到可由强电子-声子耦合驱动的共振过程激发的额外模式，并通过改变入射光子能量验证该共振，且在高能下识别出反铁磁相中可作为双磁子解释的明确 B1g 模式。\n3. 对其温度和掺杂依赖的追踪给出了多磁子激发信息，可与交换相互作用理论联系，为铜氧化物自旋动力学及电声耦合研究提供约束。", "summary_source": "deepseek", "authors": [{"name": "Chafic Fawaz"}, {"name": "Yingzheng Gao"}, {"name": "Luca Laveder"}, {"name": "Lorenzo Menon"}, {"name": "Owen Moulding"}, {"name": "Rolf Heid"}, {"name": "Blair W Lebert"}, {"name": "Christophe Bellin"}, {"name": "Keevin Beneut"}, {"name": "David Santos-Cottin"}, {"name": "Ikuya Yamada"}, {"name": "Yuichi Okazaki"}, {"name": "Hajime Yamamoto"}, {"name": "Masaki Azuma"}, {"name": "M.-A. Méasson"}, {"name": "Matteo d'Astuto"}], "featured_authors": [{"name": "Chafic Fawaz"}, {"name": "Yingzheng Gao"}, {"name": "Luca Laveder"}, {"name": "Masaki Azuma"}, {"name": "M.-A. Méasson"}, {"name": "Matteo d'Astuto"}], "author_count": 16}, {"id": "2609.22420", "category": "cond-mat", "title": "Bootstrap certification of string order in quantum spin chains", "abstract": "The many-body bootstrap certifies ground-state properties by minimizing energy over correlators constrained only by positivity, without any variational wavefunction. Its cost, however, grows exponentially with the size of the operators involved, placing the long-range string correlators that diagnose topological phases out of reach. We overcome this by treating string operators as primary objects: bare and endpoint-dressed strings satisfy a closed operator algebra with one another and with local words, yielding a semidefinite program whose cost grows only polynomially with string length. A single computation then yields estimates of string correlators of all lengths. Rigorous two-sided bounds are obtained for each target string once the ground-state energy is pinned within a window. When benchmarked against density-matrix renormalization group computations on the cluster Ising and spin$-1$ Heisenberg chains, the method certifies the nonlocal string order of the cluster and Haldane phases directly from the Hamiltonian. Our rigorous certification of string order parameters reveal that the sharpness of the bounds is set by which operators enter the calculation, not by their length alone. By exploiting algebraic closure of strings and local words, our framework lifts spatially extended observables into polynomially tractable bootstrap variables, opening up a route to wavefunction-free certification of nonlocal order in quantum many-body systems.", "url": "https://arxiv.org/abs/2609.22420", "type": "理论+数值", "summary": "1. 该工作把裸弦与端点修饰弦作为基本算符，构建多体bootstrap的半正定规划，无需试探波函数即可从哈密顿量认证量子自旋链中的弦序。\n2. 关键在于弦算符与局域算符彼此构成闭合代数，使计算代价只随弦长多项式增长，单次计算即给出所有长度的弦关联函数，并在基态能量被限定于一定窗口时给出严格双侧界。\n3. 在cluster Ising与自旋1海森堡链上与DMRG基准对比，该方法直接从哈密顿量认证了cluster相与Haldane相的非局域弦序，并表明界的锐度取决于参与计算的算符而非弦长，为无波函数的非局域序认证开辟路径。", "summary_source": "deepseek", "authors": [{"name": "Sagnik Banerjee"}, {"name": "Haoyu Guo"}, {"name": "Debanjan Chowdhury"}], "featured_authors": [{"name": "Sagnik Banerjee"}, {"name": "Haoyu Guo"}, {"name": "Debanjan Chowdhury"}], "author_count": 3}, {"id": "2609.22440", "category": "cond-mat", "title": "A low-symmetry ground state of dense two-dimensional hydrogen", "abstract": "Hydrogen under pressure is an extremely complex system featuring molecular dissociation, metallization, and anomalous melting. While bulk hydrogen has been studied for nearly a century, its two-dimensional counterpart remains unexplored. Using first-principles structural searches and relaxations in supercells containing up to 512 atoms, we identify ground-state structures of dense two-dimensional hydrogen showing no evidence of long-range crystalline order over the simulated length scales. Within density functional theory, these structures have lower enthalpy than all crystalline candidates considered over an intermediate pressure interval between molecular and atomic crystals. This preference already emerges with classical nuclei and persists as the supercell size increases, while the dominant structure-factor peaks grow substantially more slowly than in the crystalline reference phases. Although crystals with very large primitive cells cannot be rigorously excluded, these findings support the possibility of a disordered ground state and identify dense two-dimensional hydrogen as a promising setting for investigating competition between crystallization and structural disorder.", "url": "https://arxiv.org/abs/2609.22440", "type": "理论+数值", "summary": "1. 该工作采用第一性原理结构搜索与超胞弛豫（最多512个原子），在分子晶体与原子晶体之间的中间压力区间识别出致密二维氢的低对称基态候选结构，其焓低于所考察的全部晶体相，且在模拟尺度上未见长程晶序。\n2. 其核心证据是这种低对称偏好在经典原子核近似下即已出现，并随超胞尺寸增大而持续，同时主导结构因子峰的增长明显慢于晶体参考相，说明该行为并非有限尺寸假象。\n3. 尽管无法严格排除具有超大原胞的晶体，结果足以支持无序基态的可能性，并提示致密二维氢可作为研究结晶与结构无序竞争的有力平台。", "summary_source": "deepseek", "authors": [{"name": "Cesare Cozza"}, {"name": "Chris J. Pickard"}, {"name": "Guglielmo Mazzola"}], "featured_authors": [{"name": "Cesare Cozza"}, {"name": "Chris J. Pickard"}, {"name": "Guglielmo Mazzola"}], "author_count": 3}, {"id": "2609.22527", "category": "cond-mat", "title": "Diffusion with stochastic resetting in the presence of a delta killing trap: Drift-controlled survival regimes", "abstract": "We study a one-dimensional diffusive particle subject to stochastic resetting to its initial position, in the presence of an imperfect, localized target that can absorb (kill) the particle, modeled by a delta-function killing rate. The central question is how stochastic resetting competes with drift-induced transience and the target's finite reactivity. Exact Laplace-space expressions are derived for the non-normalized propagator and survival probability, for arbitrary diffusion coefficient $D$, resetting rate $r$, and killing strength $k$, first in the absence of drift and then under a constant drift. The long-time behavior separates into distinct regimes. Without resetting, unbiased diffusion exhibits the recurrent algebraic survival law $S(t)\\sim t^{-1/2}$, whereas any nonzero drift renders the motion transient with respect to the target and leaves a nonzero ultimate survival probability. By contrast, any $r>0$ and $k>0$ repeatedly renews encounters with the target and restores eventual absorption, yielding an exponential survival law $S(t)\\sim A e^{-\\theta t}$. The decay rate $\\theta$ is given by the dominant (rightmost) pole of the Laplace transform, and the surviving density converges after normalization to an explicit quasi-stationary profile. The driftless and perfectly absorbing limits recover standard resetting results. These formulas provide a unified description of the crossover between recurrence-controlled, transience-controlled, and renewal-controlled survival.", "url": "https://arxiv.org/abs/2609.22527", "type": "理论", "summary": "1. 该工作研究随机重置下受δ函数杀伤陷阱与恒定漂移支配的一维扩散，导出任意D、r、k下传播子与生存概率的精确拉普拉斯表达式。\n2. 其核心卖点是揭示漂移导致的瞬态逃逸与重置-杀伤反复更新相遇之间的竞争，长期行为分为复发、瞬态与更新控制三类生存区制。\n3. 该结果给出漂移下任何r>0、k>0均恢复指数吸收，衰减率由拉普拉斯变换最右极点决定，并可推广至准稳态密度与相关随机重置吸收问题。", "summary_source": "deepseek", "authors": [{"name": "Alain Mazzolo"}], "featured_authors": [{"name": "Alain Mazzolo"}], "author_count": 1}, {"id": "2609.22533", "category": "cond-mat", "title": "Two-Stage Ordering Kinetics in Binary Mixtures of Ellipsoidal Particles", "abstract": "We investigate the nonequilibrium phase-ordering kinetics of a binary mixture of uniaxial ellipsoidal particles interacting via the anisotropic Gay-Berne potential using large-scale molecular dynamics simulations. Following a temperature quench from the isotropic and homogeneous phase into the coexistence region, the system exhibits two distinct ordering processes occurring on different time scales. At first, rapid orientational ordering leads to the formation and coarsening of nematic domains, characterized by dynamical scaling, generalized Porod-law behavior, and a growth law $\\ell(t) \\sim t^{1/2}$ consistent with nonconserved order-parameter dynamics. Later, the system undergoes binary phase separation driven by compositional fluctuations. This compositional ordering process shows a transition from diffusive growth $\\ell(t) \\sim t^{1/3}$ to hydrodynamic regimes, with finite-size scaling analysis indicating asymptotic viscous growth $\\ell(t) \\sim t$. Despite the presence of global orientational order, the phase-separation kinetics remains effectively isotropic. These results demonstrate a clear separation between orientational and compositional ordering dynamics, governed by distinct conservation laws, and provide a unified framework for understanding phase ordering in anisotropic particle systems.", "url": "https://arxiv.org/abs/2609.22533", "type": "理论+数值", "summary": "1. 该工作通过大规模分子动力学模拟，研究Gay-Berne势单轴椭球二元混合物淬火至共存区后的非平衡相有序动力学。\n2. 两阶段有序分离：取向有序为非守恒序参量动力学，畴尺寸呈t^{1/2}增长与广义Porod律；组分相分离由扩散t^{1/3}转为黏性流体线性增长，且整体近似各向同性。\n3. 这揭示了取向与组分有序由不同守恒律支配，并为各向异性粒子体系的相有序提供统一框架。", "summary_source": "deepseek", "authors": [{"name": "Parameshwaran A"}, {"name": "Sanjay Puri"}, {"name": "Bhaskar Sen Gupta"}], "featured_authors": [{"name": "Parameshwaran A"}, {"name": "Sanjay Puri"}, {"name": "Bhaskar Sen Gupta"}], "author_count": 3}, {"id": "2609.22541", "category": "cond-mat", "title": "Intermittency in Wind-Driven Fires", "abstract": "We construct a wind-driven forest-fire model in one dimension in which a fire can jump gaps between trees to ignite disjoint downwind forests. The size of a gap that a fire can jump depends on the fire intensity, which increases as the fire propagates through trees and diminishes as the fire jumps gaps. Trees grow on empty sites at rate $r$ and lightning strikes each site with rate $f$. When $f\\ll r/L$, where $L$ is the system length, lightning is sufficiently rare that quasi-deterministic dynamics arises where all trees are consumed when a lightning-induced fire occurs. For $f\\gg L^{-\\mu}$ with $\\mu\\approx 0.8$, lightning is sufficiently frequent that a steady state is reached, but with unexpected behaviors for the forest- and gap-size distributions. Intermittency arises in between these regimes, with coexisting temporal domains of deterministic and chaotic dynamics.", "url": "https://arxiv.org/abs/2609.22541", "type": "理论", "summary": "1. 该工作构建了一维风驱森林火灾模型，允许火越过树木间隙点燃下风向互不相连的林地，并据此考察树木生长率 r 与雷击率 f 的竞争。\n2. 其核心在于火强度随传播增大、随越隙减弱，使可跳跃间隙尺寸动态变化；模型在 f≪r/L 时呈准确定性、在 f≫L^{-μ}（μ≈0.8）时达稳态但林火与间隙尺寸分布反常。\n3. 介于二者之间出现间歇性，即确定性与混沌动力学的时间域共存，提示风驱火传播中尺度分布与临界行为的普适研究需关注这种混合时序。", "summary_source": "deepseek", "authors": [{"name": "Laurent Hébert-Dufresne"}, {"name": "Aanjaneya Kumar"}, {"name": "S. Redner"}], "featured_authors": [{"name": "Laurent Hébert-Dufresne"}, {"name": "Aanjaneya Kumar"}, {"name": "S. Redner"}], "author_count": 3}, {"id": "2609.22558", "category": "cond-mat", "title": "Compressive Splitting in Brittle Solids: The Inverse of Wrinkling in Sheets", "abstract": "Axial splitting is the dominant failure mode of brittle solids under compression, yet its mechanical origin remains unclear. We show that clamped loading platens suppress lateral Poisson expansion, generating boundary-induced tensile stresses at the specimen interior -- the compressive analog of wrinkling in stretched sheets. This mechanism provides a predictive strength law, relating axial splitting to tensile strength, geometry, and confinement pressure. This is validated against diverse materials ranging from rocks to ceramics, establishing axial splitting as a geometry-controlled elastic process rather than a stochastic flaw problem.", "url": "https://arxiv.org/abs/2609.22558", "type": "理论", "summary": "1. 该工作揭示脆性固体轴向劈裂的力学起源：夹持压板抑制横向泊松膨胀，在试样内部产生边界诱导拉应力，即拉伸薄板起皱的压缩对应。\n2. 其核心卖点是给出可预测的强度定律，将轴向劈裂与抗拉强度、几何构型和围压定量关联，并在岩石到陶瓷等多种材料上得到验证。\n3. 该结果把轴向劈裂确立为由几何控制的弹性过程而非随机缺陷问题，为脆性材料强度预测与失效判据提供明确启发。", "summary_source": "deepseek", "authors": [{"name": "Maryam Khodadad"}, {"name": "Francois Barthelat"}, {"name": "John D. Clayton"}, {"name": "George Gazonas"}, {"name": "Kaushik Dayal"}], "featured_authors": [{"name": "Maryam Khodadad"}, {"name": "Francois Barthelat"}, {"name": "John D. Clayton"}, {"name": "George Gazonas"}, {"name": "Kaushik Dayal"}], "author_count": 5}, {"id": "2609.22618", "category": "cond-mat", "title": "Probing $d$-wave pairing in the $t$-$t'$-$U$ Hubbard model with tensor-backflow wave functions", "abstract": "Building on the recently developed tensor-backflow method, which accurately describes energies and stripe states in the Fermi-Hubbard model, we investigate $d$-wave pairing in the two-dimensional $t$-$t'$-$U$ Hubbard model. For the $8\\times8$ lattice, we improve the wave function using symmetry projections followed by one Lanczos step, whereas for the $12\\times 12$ and $16\\times 16$ lattices, we apply one Lanczos step without symmetry projection. We focus primarily on the parameter regime with filling $n=0.875$, on-site repulsion $U=8$ and next-nearest-neighbor hopping $t'=-0.2t$, a regime in which enhanced $d$-wave pairing has been reported. The resulting energies are competitive with those obtained using state-of-the-art neural quantum states. For example, on a $16\\times 16$ lattice with periodic boundary conditions, the tensor-backflow wave function after one Lanczos step without explicit symmetry enforcement achieves a relative energy difference of $4.4\\times 10^{-3}$ from the symmetry-preserving neural quantum state result. From the real space pair correlations, for $t'=-0.2t$, we observe stronger $d$-wave pair correlations together with the characteristic relative sign between horizontal and vertical bond-pair components. Compared with $t'=0$, finite negative $t'$ increases the spectral weight of the corresponding pair-density matrix, which indicates the enhanced overall $d$-wave pair fluctuations. The leading eigenvalue is enhanced on the $8\\times8$ lattice for both with and without symmetry projections. For larger lattices such as $12\\times 12$ and $16\\times 16$, the leading pair-density matrix spectral weight is distributed among several nearly degenerate eigenmodes rather than being concentrated in a single dominant mode. This indicates enhanced and more broadly distributed $d$-wave pair fluctuations, but no single eigenvalue exhibits the extensive scaling required for ODLRO.", "url": "https://arxiv.org/abs/2609.22618", "type": "理论", "summary": "1. 该工作用张量回流波函数结合对称投影与一步Lanczos，研究二维t-t'-U Hubbard模型在n=0.875、U=8、t'=-0.2t下的d波配对，尺寸达8×8至16×16。\n2. 其卖点是能量可与最先进神经量子态竞争（16×16上相对能量差仅4.4×10⁻³），并给出横向与纵向键对分量间特征性相对符号及增强的配对密度矩阵谱权重。\n3. 结果表明d波配对涨落增强且分布于多个近简并本征模，但无单一本征值呈现ODLRO所需的广延标度，提示有限尺寸下尚未建立长程配对有序。", "summary_source": "deepseek", "authors": [{"name": "Xiao Liang"}], "featured_authors": [{"name": "Xiao Liang"}], "author_count": 1}, {"id": "2609.22666", "category": "cond-mat", "title": "GRAINSMITH: A Generator of Polycrystalline Models for Atomistic Simulations with Statistical and Grain-Boundary Morphology Control", "abstract": "Atomistic studies of grain-boundary engineering, grain-size effects and dopant enrichment require reproducible models with prescribed microstructural features. We present GRAINSMITH, an open-source Python package for generating statistically controlled polycrystalline models with selectable grain-boundary morphologies for molecular dynamics and subsequent relaxation. Within supported feature combinations, a single configuration specifies grain-size and volume distributions, crystallographic texture, boundary-area-weighted disorientation-angle distributions, phase composition and grain-boundary dopant placement. Crystal construction supports 230 crystallographic space groups. Periodic Voronoi and volume-targeted Laguerre tessellations provide planar boundaries, while distinct geometry backends generate smoothly curved and band-limited self-affine boundaries. A registry of twenty-six checks assesses applicable inputs, construction properties and outputs. Each run exports LAMMPS data and Extended XYZ files together with structural and statistical descriptors and machine-readable provenance. For a fixed software version and computational environment, the configuration and random seed determine byte-reproducible atomic configurations and scientific data across supported worker counts. By combining statistical specification, boundary-morphology control and reproducible atomistic output, GRAINSMITH supports systematic studies of microstructural effects and quantitative comparisons across generated models.", "url": "https://arxiv.org/abs/2609.22666", "type": "理论+数值", "summary": "1. 该工作提出并开源了 GRAINSMITH，一个用于原子尺度模拟的多晶模型生成器，可在给定配置与随机种子下生成统计可控、晶界形貌可选的多晶结构以供分子动力学及后续弛豫使用。\n2. 其技术卖点在于用单一配置统一编码晶粒尺寸/体积分布、晶体织构、边界面积加权取向差分布、相组成与晶界掺杂，并支持230个空间群、Voronoi/Laguerre平面及弯曲/带限自仿射晶界，还以26项检查、LAMMPS与Extended XYZ导出和字节级可复现性保证输出可验证。\n3. 该工具为晶界工程、晶粒尺寸效应和掺杂偏析等微结构影响的系统研究提供可复现模型，并支持跨模型定量比较与后续实验/理论验证。", "summary_source": "deepseek", "authors": [{"name": "Oguzhan Orhan"}, {"name": "Soner Özgen"}], "featured_authors": [{"name": "Oguzhan Orhan"}, {"name": "Soner Özgen"}], "author_count": 2}, {"id": "2609.22907", "category": "cond-mat", "title": "On the precise boundary of the Néel antiferromagnetic phase in the Shastry-Sutherland model", "abstract": "The ground state phase diagram of the Shastry-Sutherland model remains controversial. In particular, the nature of the transition between the plaquette valence bond solid (PVBS) phase and the Néel antiferromagnetic (AFM) phase is still under debate. While some studies suggest a direct transition between the two phases, others propose the existence of a narrow intermediate quantum spin liquid regime. To address this issue, we perform large-scale Density Matrix Renormalization Group calculations to determine the Néel AFM phase boundary in the Shastry-Sutherland model. By applying staggered boundary pinning fields and directly measuring the bulk staggered magnetization, and through systematic extrapolations with respect to truncation error as well as careful finite-size scaling, we find that the staggered magnetization remains finite across the controversial region $0.78 \\lesssim J_{1}/J_{2} \\leq 0.81$, which was suggested to host a quantum spin liquid phase in some studies. Together with the previously established consensus placing the PVBS phase boundary at $J_{1}/J_{2} \\approx 0.78$, these results provide evidence against the existence of an intermediate quantum spin liquid phase and support a direct PVBS--Néel AFM transition in the Shastry-Sutherland model.", "url": "https://arxiv.org/abs/2609.22907", "type": "理论+数值", "summary": "1. 该工作用大规模DMRG，结合交错边界钉扎场与体交错磁化测量，确定Shastry-Sutherland模型的Néel反铁磁相边界。\n2. 其关键证据是经截断误差外推与有限尺寸标度，在0.78≲J1/J2≤0.81争议区测得有限体交错磁化。\n3. 结合PVBS边界约0.78，这反对中间量子自旋液体并支持直接PVBS–Néel相变，为相图争议提供数值约束。", "summary_source": "deepseek", "authors": [{"name": "Rongyi Lv"}, {"name": "Xiangjian Qian"}, {"name": "Mingpu Qin"}], "featured_authors": [{"name": "Rongyi Lv"}, {"name": "Xiangjian Qian"}, {"name": "Mingpu Qin"}], "author_count": 3}, {"id": "2609.22992", "category": "cond-mat", "title": "From Local Atomic Motifs to Thermodynamic State: An Interpretable Physics-Informed Framework for Cu-Zr Metallic Glasses", "abstract": "Machine-learning models that relate local atomic structure to the thermodynamic state of metallic glasses typically assess physical consistency after training rather than enforcing it during learning. Here, we develop a multi-task physics-informed neural network (PINN) that predicts temperature directly from Voronoi-motif population histograms while incorporating autograd-derived gradient constraints representing physically motivated relationships between structural motifs, quench rate, and temperature. The model simultaneously classifies each configuration as liquid, supercooled/transition, or glass through an auxiliary classification head. The classification task achieves 96.6% test accuracy with a macro-F1 score of 0.95, while the regression head yields a mean absolute error of 23.4 K on a trajectory-disjoint held-out test set. Five-fold trajectory-grouped cross-validation, deep-ensemble predictions, and Monte Carlo dropout are used to assess model robustness and predictive uncertainty. Sensitivity analyses demonstrate that physics constraints can be incorporated over a broad range of loss weights without compromising predictive accuracy, while substantially improving compliance with the prescribed physical trends. Benchmarking against conventional machine-learning regressors further demonstrates competitive predictive performance. SHAP analysis across the cross-validation ensemble identifies the coupled near-icosahedral motif family, particularly the full icosahedral motif and its single-atom-perturbed counterpart, as the dominant structural fingerprints of the glassy state. These results demonstrate that physically motivated constraints can be embedded directly into motif-based structure-property models, providing a pathway from post-hoc interpretability toward physically constrained machine learning for metallic glasses.", "url": "https://arxiv.org/abs/2609.22992", "type": "理论+数值", "summary": "1. 该工作构建多任务物理信息神经网络，由Voronoi基元分布直方图直接预测Cu-Zr金属玻璃温度，并判别液态、过冷/转变态与玻璃态。\n2. 其卖点是以自动微分梯度约束将基元—淬火速率—温度的物理关系嵌入训练，宽损失权重下精度不降而物理趋势符合度显著提升；分类准确率96.6%，回归MAE 23.4 K。\n3. SHAP分析把耦合近二十面体基元族（完整二十面体及其单原子扰动对应体）识别为玻璃态主导结构指纹，为金属玻璃从后验可解释走向物理约束机器学习提供路径。", "summary_source": "deepseek", "authors": [{"name": "Prashil S. Joshi"}], "featured_authors": [{"name": "Prashil S. Joshi"}], "author_count": 1}, {"id": "2609.23150", "category": "cond-mat", "title": "Correlation-assisted spin-selective metallicity in strained and bilayer altermagnets", "abstract": "Altermagnets combine vanishing net magnetization with a momentum-dependent spin-split electronic structure, providing a route to spin-polarized carriers without ferromagnetism. Here, we investigate how electronic correlations, doping, uniaxial strain, and interlayer coupling control altermagnetism within a minimal Hubbard-type model for mono- and bilayer systems. Comparing Hartree--Fock theory with the rotationally invariant slave-boson (RISB) approach, we demonstrate the robustness of altermagnetic order against quasiparticle renormalization and reveal a separation between the onset of magnetic order and the loss of quasiparticle coherence at stronger coupling. In the monolayer, doping produces a pronounced particle--hole asymmetry, while its combination with uniaxial strain generates a fully spin-polarized Fermi surface close to half-filling. In the bilayer, stacking that favors ferroic alignment of the layer altermagnetic order parameters allows their momentum-dependent spin splittings to combine constructively. Weak asymmetric doping additionally induces intra-unit-cell charge order, resulting in fully spin-polarized low-energy carriers. At a bilayer filling of five electrons in four orbitals, we find a continuous paramagnet-to-altermagnet transition followed, at stronger coupling, by an evolution toward a Mott-like regime with strongly suppressed quasiparticle weight. Our results establish correlations, strain, doping, and stacking as complementary means of controlling altermagnetic metals and generating fully spin-polarized Fermi surfaces.", "url": "https://arxiv.org/abs/2609.23150", "type": "理论", "summary": "1. 该工作用最小哈伯德模型，结合哈特里-福克与旋转不变从属玻色子方法，研究单层和双层交错磁体中关联、掺杂、单轴应变及层间耦合对自旋选择性金属性的调控。\n2. 其要点是交错磁序在准粒子重整化下仍稳健，并揭示磁序出现与准粒子相干性损失在强关联下的分离；单层中掺杂与应变协同可在近半满生成完全自旋极化费米面，双层中合适堆叠使层间动量依赖自旋劈裂相长，弱非对称掺杂还可诱导胞内电荷序并实现低能载流子全自旋极化。\n3. 该工作表明关联、应变、掺杂与堆叠是调控交错磁金属并产生全自旋极化费米面的互补手段，也为双层五电子填充下顺磁-交错磁连续转变及向莫特型区演化提供启示。", "summary_source": "deepseek", "authors": [{"name": "Marnin J. Di Nunzio"}, {"name": "Frank Lechermann"}, {"name": "Ilya M. Eremin"}], "featured_authors": [{"name": "Marnin J. Di Nunzio"}, {"name": "Frank Lechermann"}, {"name": "Ilya M. Eremin"}], "author_count": 3}, {"id": "2609.23168", "category": "cond-mat", "title": "An active soft glassy rheology model", "abstract": "Biological materials such as the cytoskeleton and confluent cell monolayers are active, dense systems continuously subjected to internal stresses and strains, making their rheological characterization essential. While activity in soft matter can be modeled across multiple length scales, its mechanical consequences remain strongly model dependent and no unified theoretical framework has yet emerged. Here, we study the rheology of dense active amorphous materials using the Soft Glassy Rheology (SGR) model, incorporating activity at the mesoscopic scale of local elements as a stochastic strain rate that is persistent on some timescale $\\tau_p$. We show that activity opens a long-time relaxation channel, driving a crossover from SGR-like power-law rheology to Maxwell-like behavior at the lowest frequencies. Combining analytical arguments in limiting regimes with numerical simulations, we characterize the resulting fluidisation time scale and its dependence on the activity parameters, which shows strong analogies with effective temperatures introduced elsewhere that similarly encode activity-induced fluidisation. Our active SGR model provides a minimal mesoscopic route to understanding how driving by activity modifies the rheology of dense amorphous materials.", "url": "https://arxiv.org/abs/2609.23168", "type": "理论+数值", "summary": "1. 该工作将活性引入软玻璃流变学（SGR）模型，把活性建模为介观局部单元上在时间尺度τ_p内持续存在的随机应变率，以研究稠密活性非晶材料的流变学。\n2. 其核心在于揭示活性开辟长时松弛通道，使最低频响应从SGR型幂律流变跨越到Maxwell型行为，并结合极限解析论证与数值模拟刻画流化时间尺度对活性参数的依赖。\n3. 该最小介观框架为理解活性驱动如何改变稠密非晶材料流变学提供途径，且其流化时间尺度与别处有效温度图像高度类比，可启发后续理论、模拟与实验。", "summary_source": "deepseek", "authors": [{"name": "Raffaele Mendozza"}, {"name": "Tobias Müller"}, {"name": "Peter Sollich"}], "featured_authors": [{"name": "Raffaele Mendozza"}, {"name": "Tobias Müller"}, {"name": "Peter Sollich"}], "author_count": 3}, {"id": "2609.23346", "category": "cond-mat", "title": "Long-range self-avoiding walk in one dimension: a Monte Carlo study", "abstract": "We study the one-dimensional long-range self-avoiding walk in the grand-canonical ensemble where the statistical weight of a jump of length $r$ decays algebraically as $r^{-(d+\\sigma)}$. Using large-scale Monte Carlo simulations with an efficient irreversible update scheme, we obtain high-precision estimates of the critical fugacity $z_c$, the universal Binder ratio $Q_N^c$, the correlation-length exponent $\\nu$, and the anomalous dimension $\\eta$. For $\\sigma>1$, the critical fugacity varies smoothly with $\\sigma$, while the Binder ratio and the critical exponents remain consistent with the short-range universality class. For $\\sigma \\le 1$, by contrast, the results clearly depart from short-range behavior, identifying $\\sigma=1$ as the boundary between long-range and short-range regimes. In the long-range Wilson-Fisher regime with $1/2 < \\sigma \\leq 1$, $\\eta$ agrees with the long-range Gaussian-fixed-point prediction $\\eta_{\\mathrm{GFP}}=2-\\sigma$, whereas $Q_N^c$ and $\\nu$ vary nontrivially with $\\sigma$ and exhibit discontinuous jumps at $\\sigma=1$. These findings are in good agreement with the recently proposed universality diagram in the $(d,\\sigma)$ plane for long-range O$(n)$ models, with the self-avoiding walk corresponding to the $n\\to0$ limit.", "url": "https://arxiv.org/abs/2609.23346", "type": "理论+数值", "summary": "1. 用大规模蒙特卡洛研究一维长程自避行走，在巨正则系综中高精度测定临界逸度、Binder比和临界指数。\n2. 技术核心是高效不可逆更新，借其识别σ=1为长程与短程普适类边界，并得到1/2<σ≤1时η与2−σ一致。\n3. 结果与(d,σ)平面长程O(n)模型普适图相符，为n→0自避行走提供数值支持并提示σ=1处存在非连续行为。", "summary_source": "deepseek", "authors": [{"name": "Jiang Zhou"}, {"name": "Ziyu Liu"}, {"name": "Pengcheng Hou"}, {"name": "Zhijie Fan"}, {"name": "Youjin Deng"}], "featured_authors": [{"name": "Jiang Zhou"}, {"name": "Ziyu Liu"}, {"name": "Pengcheng Hou"}, {"name": "Zhijie Fan"}, {"name": "Youjin Deng"}], "author_count": 5}, {"id": "2609.23391", "category": "cond-mat", "title": "Ultralow-Barrier Ion Transport in the Subnitride Electride Ba$_3$N for High-Rate Sodium Storage", "abstract": "Electrides, ionic crystals in which excess electrons are delocalized within interstitial voids rather than bound to specific atomic sites, exhibit exotic physicochemical behaviors, yet their potential as electrochemical energy-storage hosts remains largely unexplored. Here, using comprehensive first-principles calculations, we demonstrate that the quasi-one-dimensional subnitride electride Ba$_3$N offers a compelling route to overcome the long-standing performance trade-offs in sodium-ion battery anodes. Spontaneous Na intercalation into the open interchain channels establishes thermodynamically stable phases, generating an exceptionally flat low-potential plateau that avoids the high-potential sloping losses of hard carbon while preserving an essential safety margin against dendrite formation. Crucially, the itinerant interstitial anionic electron sea dynamically flattens the potential landscape by suppressing site-specific orbital interactions, enabling ultrafast Na ion transport with an exceptionally low migration barrier. This work establishes a design paradigm for harnessing electride chemistry to achieve ultrafast battery electrodes.", "url": "https://arxiv.org/abs/2609.23391", "type": "理论+数值", "summary": "1. 该工作使用第一性原理计算，评估准一维亚氮化物电子化物Ba3N作为钠离子电池负极，并揭示Na自发嵌入开链间通道形成热力学稳定相。\n2. 其关键机制在于间隙阴离子电子海抑制位点特异性轨道作用并动态抹平势能面，使Na迁移势垒极低，并在稳定嵌入相下形成平坦低电位平台、规避硬碳的倾斜损失。\n3. 这为利用电子化物化学设计超快电池电极提供范式，并指向兼顾高倍率、低电位与抗枝晶安全裕度的储钠材料。", "summary_source": "deepseek", "authors": [{"name": "Seulbi Kim"}, {"name": "Bo Gyu Jang"}], "featured_authors": [{"name": "Seulbi Kim"}, {"name": "Bo Gyu Jang"}], "author_count": 2}, {"id": "2609.23426", "category": "cond-mat", "title": "Non-Hermitian Quantum Mechanics I: Instantaneous Self-Energy", "abstract": "Starting from the unitary evolution of a closed quantum system, we rigorously demonstrate that the projection of the global wavefunction onto an arbitrary local subsystem is governed by an exact, time-dependent non-Hermitian Schrödinger equation. Crucially, the derivation does not rely on conventional approximations such as the Born approximation, the Markov approximation, or the wide-band limit. The central quantity is the \\textit{instantaneous self-energy}, a time-dependent and generally non-Hermitian operator that encodes environmental backaction and, together with the subsystem Hamiltonian, forms the exact time-local generator of the projected dynamics. By benchmarking the conventional non-Hermitian approximation against this exact framework, we systematically expose its limitations. These results provide a rigorous microscopic foundation for the emergence of effective non-Hermitian dynamics in quantum systems.", "url": "https://arxiv.org/abs/2609.23426", "type": "理论+数值", "summary": "1. 该工作从闭系统幺正演化出发，严格导出任意局域子系统投影波函数的精确含时非厄米薛定谔方程。\n2. 核心是瞬时自能：含时非厄米算符编码环境反作用，与子系统哈密顿量构成精确时间局域生成元，且不依赖玻恩、马尔可夫或宽带近似。\n3. 该框架为有效非厄米动力学的涌现提供严格微观基础，并可检验常规非厄米近似的适用边界与失效机制。", "summary_source": "deepseek", "authors": [{"name": "Lingfeng Liu"}, {"name": "Wei-Wei Yang"}, {"name": "Jiangping Hu"}, {"name": "Zhesen Yang"}], "featured_authors": [{"name": "Lingfeng Liu"}, {"name": "Wei-Wei Yang"}, {"name": "Jiangping Hu"}, {"name": "Zhesen Yang"}], "author_count": 4}, {"id": "2609.23513", "category": "cond-mat", "title": "Critical Touching of Temporal Entanglement Transitions", "abstract": "Equilibrium phase transitions are conventionally categorized into first-order and continuous phase transitions. Far from equilibrium, many new transitions emerge during the real-time evolution of quantum systems. One such transition is the temporal entanglement transition (TET) characterized by the nonanalyticity of the entanglement spectrum. So far, all TETs occur through a linear crossing of the leading Schmidt levels in different symmetry sectors, resembling a first-order transition in equilibrium. A natural question is whether a continuous TET, featured by entanglement spectrum touching, is possible. In a periodically driven transverse $J_1$-$J_2$ Ising chain, we show that two such TETs can merge into a critical touching, where the leading levels meet tangentially without exchanging, realizing the temporal analog of a continuous phase transition. Near the critical frequency, the temporal separation of the two TETs vanishes continuously and its derivative with respect to frequency diverges, a nonanalytic signature that is absent in a single first-order TET. This finite-frequency touching arises from the interplay between a weak symmetry-preserving perturbation of the product initial state and Floquet corrections. Further extending the frequency scan reveals a second critical touching at a higher frequency, and the two critical frequencies enclose a finite window with no TET. These features can be understood from a second-order Floquet Hamiltonian and persist across a broad range of coupling ratios, establishing the critical touching as a distinct form of TET.", "url": "https://arxiv.org/abs/2609.23513", "type": "理论", "summary": "1. 在周期驱动的横向 J1-J2 Ising 链中，追问时间纠缠转变能否以纠缠谱能级相切的形式连续发生。\n2. 两个 TET 可合并为临界相切：领头 Schmidt 能级切向相遇而不交换，转变间隔随频率连续消失且导数发散，源于初始态微扰与 Floquet 修正的相互作用。\n3. 该相切可由二阶 Floquet 哈密顿量理解并在较宽耦合比范围内稳健存在，为时间纠缠转变确立了区别于一级交叉的新类别。", "summary_source": "deepseek", "authors": [{"name": "Ting-Long Wang"}, {"name": "Shi-Xin Zhang"}, {"name": "Shuai Yin"}, {"name": "Yi-Fan Jiang"}], "featured_authors": [{"name": "Ting-Long Wang"}, {"name": "Shi-Xin Zhang"}, {"name": "Shuai Yin"}, {"name": "Yi-Fan Jiang"}], "author_count": 4}, {"id": "2609.23563", "category": "cond-mat", "title": "Deterministic control of antiferromagnetic domain walls by circular phonons", "abstract": "In an antiferromagnet, areas with different orientations of the antiferromagnetic Néel vector, which plays the role of the order parameter, can coexist, thus forming antiferromagnetic domains separated by domain walls. This suggests that antiferromagnets can possess the functionalities of magnetic storage media. Whether one can benefit from these functionalities crucially depends on the availability of efficient means for deterministic control of antiferromagnetic domain walls. Here, we demonstrate an approach to deterministically control domain walls in the van der Waals antiferromagnet Ni-doped $MnPS_3$ via dynamic engineering of the crystal lattice. By resonantly exciting a pair of nearly degenerate orthogonal infrared-active $A_u$ and $B_u$ phonon modes with circularly polarized mid-infrared light, we induce helicity-dependent reconfiguration of 180° antiferromagnetic domains, providing evidence for a phonon-induced effective field conjugate to the Néel order parameter. The domain kinetics exhibit a pronounced helicity asymmetry governed by the interplay between domain-wall elasticity and defect-mediated pinning, enabling small phonon-driven perturbations to accumulate into stable domain transformations. Our results establish dynamic lattice control and defect engineering as means for deterministic control of antiferromagnetic order.", "url": "https://arxiv.org/abs/2609.23563", "type": "理论", "summary": "1. 该工作在范德瓦尔斯反铁磁体Ni掺杂MnPS₃中，用圆偏振中红外光共振激发晶格声子，实现了反铁磁畴壁的确定性调控。\n2. 近简并正交Au/Bu声子模的圆偏振共振激发产生螺旋度依赖的有效场，驱动180°Néel畴重构；畴壁弹性与缺陷钉扎竞争决定其动力学不对称性。\n3. 该结果表明动态晶格调控与缺陷工程可作为反铁磁序确定性操控的通用手段，为反铁磁存储与逻辑器件的零磁场操作提供思路。", "summary_source": "deepseek", "authors": [{"name": "Vladislav Bilyk"}, {"name": "Nikolai Khokhlov"}, {"name": "Viktoriia Radovskaia"}, {"name": "Peter Kim"}, {"name": "Pietro Diona"}, {"name": "Ravi Kaushik"}, {"name": "Luca Maranzana"}, {"name": "Takeshi Hayashida"}, {"name": "Sergey Artyukhin"}, {"name": "Edwin Hang Tong Teo"}, {"name": "Apoorva Chaturvedi"}, {"name": "Carl S. Davies"}, {"name": "Andrei Kirilyuk"}, {"name": "Alexey Kimel"}, {"name": "Dmytro Afanasiev"}], "featured_authors": [{"name": "Vladislav Bilyk"}, {"name": "Nikolai Khokhlov"}, {"name": "Viktoriia Radovskaia"}, {"name": "Andrei Kirilyuk"}, {"name": "Alexey Kimel"}, {"name": "Dmytro Afanasiev"}], "author_count": 15}, {"id": "2609.23564", "category": "cond-mat", "title": "Dual Role of Mobile Interstitials in Defect Kinetics: From Retardation to Acceleration", "abstract": "Mobile interstitial atoms redistribute while defects migrate, complicating prediction of defect kinetics and leading to contradictory reports of acceleration and retardation. We formulate defect activation in a grand-canonical ensemble at fixed interstitial chemical potential and define a pathway free-energy landscape $\\Delta G(\\Lambda;T,\\mu)$ and the corresponding activation free energy $\\Delta G^{\\ddagger}$. We compute these quantities using both hyperplane-constrained thermodynamic integration via a mean force relation and a two-state chemical-potential integration, denoted TSCPI. The latter requires sampling only the initial and transition states; a single chemical-potential integration then yields $\\Delta G^{\\ddagger}(T,\\mu)$ across a wide $\\mu$ range, enabling rapid mapping over temperature and chemical potential. Applied to vacancy diffusion in FCC, BCC, and HCP metals with H (including in plane and cross plane diffusion in Zr) and in BCC W with He, both free energy routes agree with diffusion coefficients from molecular dynamics mean square displacements. The resulting maps reveal regimes of suppression and enhancement, including a crossover from suppression to enhancement with increasing hydrogen concentration. A site occupancy analysis links barrier shifts to state dependent site spectrum changes and transferable interstitial interaction terms.", "url": "https://arxiv.org/abs/2609.23564", "type": "理论+数值", "summary": "1. 该工作在固定间隙原子化学势的大正则系综中定义缺陷激活路径自由能景观ΔG(Λ;T,μ)与激活自由能ΔG‡，并应用于FCC、BCC、HCP金属中H及BCC W中He的空位扩散。\n2. 其技术卖点是用超平面约束热力学积分与仅需初态和过渡态采样的双态化学势积分TSCPI，一次μ积分即可快速映射宽温度和化学势范围，且与分子动力学均方位移扩散系数一致。\n3. 所得相图揭示随氢浓度升高由抑制转向增强等区制，并将势垒移动归于状态依赖位点谱变化和可迁移间隙相互作用项，为缺陷动力学预测提供统一框架。", "summary_source": "deepseek", "authors": [{"name": "Shihao Zhang"}, {"name": "Shihao Zhu"}, {"name": "Junping Du"}, {"name": "Shuhei Shinzato"}, {"name": "Ju Li"}, {"name": "Shigenobu Ogata"}], "featured_authors": [{"name": "Shihao Zhang"}, {"name": "Shihao Zhu"}, {"name": "Junping Du"}, {"name": "Shuhei Shinzato"}, {"name": "Ju Li"}, {"name": "Shigenobu Ogata"}], "author_count": 6}, {"id": "2609.23611", "category": "cond-mat", "title": "Uni-Macro-FRPN: Full-Resolution and Cross-Scale Learning for Polymers", "abstract": "Polymer properties emerge from interactions across scales, yet existing polymer models typically preserve either detailed monomer chemistry without an explicit polymer graph or polymer connectivity with simplified monomer representations, due to computational constraints, as polymers typically contain tens of thousands of atoms. We present Uni-Macro-FRPN (FRPN), a Full-Resolution Polymer Network that retains both detailed atom-level and monomer-level features and explicit polymer structure information within a unified framework. Two Transformers jointly learn atom-informed monomer semantics, sequence order, and chain topology from BigSMILES-derived representations. On the Block Copolymer Database (BCDB) lamellar-versus-non-lamellar classification task, FRPN achieves 86.4% accuracy and 90.6% ROC-AUC, establishing state-of-the-art performance. Ablation results indicate that the gain is not explained solely by increased parameter count. On a linear homopolymer benchmark, monomer-centric learning remains competitive, highlighting a boundary case where polymer-scale organization is simple. To test generalization beyond linear polymers, we further construct an all-atom molecular-dynamics benchmark of 1640 datapoints spanning diverse monomer chemistries, sequence orderings, chain topologies, and physical properties. FRPN achieves the strongest overall performance on this topology-rich benchmark, with diagnostics supporting the benefit of jointly modeling monomer chemistry and polymer structure. Taken together, FRPN provides a practical route for moving polymer representation learning beyond monomer-centric representations. The leading performance of FRPN also suggests a promising direction for polymer informatics: future polymer prediction models should treat polymers not only as collections of monomer descriptors, but as complete multiscale chemical and topological objects.", "url": "https://arxiv.org/abs/2609.23611", "type": "理论", "summary": "1. 该工作提出 Uni-Macro-FRPN（FRPN）全分辨率聚合物网络，在统一框架内保留原子级与单体级特征及显式聚合物结构，并用两个 Transformer 从 BigSMILES 表示中联合学习单体语义、序列顺序与链拓扑。\n2. 其核心优势在于跨尺度联合建模：在 BCDB 层状/非层状分类上达 86.4% 准确率与 90.6% ROC-AUC，消融显示增益不能仅归因于参数量，并在 1640 个全原子分子动力学数据点的拓扑丰富基准上总体最优。\n3. 这提示未来聚合物预测应把聚合物视为完整的多尺度化学与拓扑对象，而非单体描述符集合，为超越单体中心表示提供可行方向。", "summary_source": "deepseek", "authors": [{"name": "Jintao Wu"}, {"name": "Yiran Shan"}, {"name": "Rui Zhang"}], "featured_authors": [{"name": "Jintao Wu"}, {"name": "Yiran Shan"}, {"name": "Rui Zhang"}], "author_count": 3}, {"id": "2609.23618", "category": "cond-mat", "title": "Interplay of spin-orbit coupling and magnetic chirality: Multidirectional spin polarization in a helical antiferromagnet", "abstract": "We investigate spin-dependent transport in a non-collinear helical antiferromagnet in the presence of spin-orbit coupling within a tight-binding framework. Using the Landauer-Büttiker formalism, we analyze the generation of spin polarization arising from the combined effects of the helical magnetic texture and spin-orbit interaction. We find that finite spin polarization can be generated simultaneously along the $\\hat{x}$, $\\hat{y}$, and $\\hat{z}$-directions, in contrast to the predominantly single-axis spin polarization commonly observed in conventional spin-filtering systems. The multidirectional spin polarization originates from the symmetry breaking introduced by the non-collinear magnetic order. We further show that the spin polarization is modified significantly in the presence of spin-orbit coupling and it has strong dependence on the parameters associated with the helical system. In particular, long-range hopping significantly enhances the spin-filtering effect, leading to large spin polarization components along all three spatial directions.", "url": "https://arxiv.org/abs/2609.23618", "type": "理论", "summary": "1. 该工作基于紧束缚框架与Landauer-Büttiker形式，研究了自旋轨道耦合与非共线螺旋反铁磁序共存时的自旋相关输运及自旋极化产生。\n2. 其核心卖点在于揭示非共线磁序破缺对称性可同时产生沿x、y、z三个方向的自旋极化，并证明自旋轨道耦合显著调制该极化，长程跃迁更会增强自旋过滤并放大各分量，区别于常规单轴自旋过滤。\n3. 这为在螺旋反铁磁/自旋轨道耦合体系中设计多方向自旋极化输运、理解磁手性与对称性破缺的协同效应提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Kallol Mondal"}, {"name": "Sudin Ganguly"}, {"name": "Santanu K. Maiti"}], "featured_authors": [{"name": "Kallol Mondal"}, {"name": "Sudin Ganguly"}, {"name": "Santanu K. Maiti"}], "author_count": 3}, {"id": "2609.23623", "category": "cond-mat", "title": "Phase field modelling of microstructure transformations in Zr-Sn alloy during irradiation", "abstract": "In this work we study peculiarities of spatial rearrangement of solute and vacancy concentrations in Zr-Sn alloy at stages of both thermal treatment of solid solution and irradiation of annealed alloy under reactor conditions. To this end, we exploit phase field modelling including reaction rate theory and CALPHAD method combined in one generalized approach. Simulations were done in 3D in order to get a detailed information about rearrangement of solutes and defects in a bulk. We discuss the emergence of the secondary phase at the stage of thermal treatment and its stability under neutron irradiation. We analyze an influence of the irradiation dose onto statistical properties of the secondary phase particles.", "url": "https://arxiv.org/abs/2609.23623", "type": "理论+数值", "summary": "1. 该工作采用相场模拟，将反应速率理论与CALPHAD方法纳入统一框架，在三维空间中研究Zr-Sn合金固溶热处理及反应堆中子辐照条件下溶质与空位浓度的空间重排。\n2. 其技术卖点在于在同一相场框架中耦合热力学与动力学以刻画第二相析出，并在三维体相中同时追踪溶质与空位演化，进而统计分析辐照剂量对第二相颗粒统计性质的影响。\n3. 这为预测Zr-Sn合金在辐照下微结构演化、评估第二相颗粒稳定性以及衔接热力学计算与反应堆服役条件提供了可扩展的模拟思路。", "summary_source": "deepseek", "authors": [{"name": "V. O. Kharchenko"}, {"name": "D. O. Kharchenko"}, {"name": "A. V. Dvornichenko"}], "featured_authors": [{"name": "V. O. Kharchenko"}, {"name": "D. O. Kharchenko"}, {"name": "A. V. Dvornichenko"}], "author_count": 3}, {"id": "2609.23626", "category": "cond-mat", "title": "The effect of homopolymer adding on aggregation behavior in amphiphilic triblock copolymers containing rigid blocks", "abstract": "The effect of B homopolymer adding on the aggregation behavior of amphiphilic coil/rod/coil BAB triblock copolymers was studied using lattice self-consistent field theory. It depends on the length of the hydrophobic rod block and copolymer concentration. Compared with the solutions, at low concentrations, homopolymer addition is favorable to the emergence of cubic and large lamellar micelles. Although it enriches the structural behavior, the rearrangement is suppressed. As rod blocks increase, the rearrangement is related to the orientation-dependent diffusion and inverse diffusion processes. At relatively high concentrations, adding homopolymers promotes rearrangement. For long rod block case, the arrangements related to inverse laminarization and the cooperative growth emerges. At high concentrations, for short rod block system, homopolymer addition is advantageous to micelle rearrangement concerned with order/disorder transition, and the rearrangements in the system of intermediate length and long rod blocks are suppressed. This work aids in understanding of the growth mechanism of micelles with rigid block cores.", "url": "https://arxiv.org/abs/2609.23626", "type": "理论", "summary": "1. 该工作用格子自洽场理论研究B均聚物添加对两亲性线圈/棒/线圈BAB三嵌段共聚物聚集行为的影响。\n2. 其核心发现是该效应依赖疏水棒段长度与浓度：低浓度下添加均聚物促进立方/大层状胶束形成却抑制重排，高浓度下则随棒段长度促进或抑制重排。\n3. 这有助于理解刚性嵌段核胶束的生长机制，并提示均聚物可通过取向依赖扩散/逆扩散、逆层化与协同生长调控重排。", "summary_source": "deepseek", "authors": [{"name": "X.-G. Han"}, {"name": "H. Zhang"}, {"name": "Z. H. Sun"}, {"name": "M. Y. Zhu"}], "featured_authors": [{"name": "X.-G. Han"}, {"name": "H. Zhang"}, {"name": "Z. H. Sun"}, {"name": "M. Y. Zhu"}], "author_count": 4}, {"id": "2609.23632", "category": "cond-mat", "title": "The ferromagnetic diatomic molecules with the mixed spin-1/2 and spin-1", "abstract": "Diatomic molecules consisting of one spin-1/2 ($\\sigma$) and one spin-1 ($S$) atom are put at each site of the Bethe lattice (BL) of the coordination number $q=3, 4$, or 6. Alongside the ferromagnetic (FM) interactions of individual atoms within a molecule, the molecules are permitted to engage in ferromagnetic interactions with their nearest neighbors (NN) through diverse bilinear interaction parameters $J$. The spin-1 sites are also under the influence of crystal field $D$. The phase diagrams on the ($D, T$) planes for a given $q$ are obtained by investigating the thermal variations of magnetizations for the case with zero external magnetic field $(H)$. It is discovered that the phase diagrams rely on $q$ both qualitatively and quantitatively. The crystal field is also included which operates only on the spin-1 sites. Three separate FM phases are observed with ($\\sigma,S$) being $(1/2,1), (1/2,0)$ at the ground state level and a phase region with small magnetization (SM) values at a higher temperature range. In addition to the reentrant behavior in the transition zone from one phase to the other, the model produces first- and second-order phase transitions. Additionally, the impact of $H$ on the magnetization curves is examined, yielding quite intriguing findings.", "url": "https://arxiv.org/abs/2609.23632", "type": "理论+数值", "summary": "1. 该工作将混合自旋-1/2与自旋-1的双原子分子置于配位数q=3、4、6的Bethe晶格上，在分子内铁磁耦合、最近邻双线性铁磁相互作用及仅作用于自旋-1的晶场D下，通过零场磁化强度随温度变化构建(D,T)相图并考察外磁场H的影响。\n2. 其核心在于：相图对q既有定性也有定量依赖，观察到三个独立铁磁相（基态(σ,S)=(1/2,1)与(1/2,0)，以及高温小磁化区），并伴随重入行为和一级、二级相变。\n3. 这提示Bethe晶格配位数与晶场可协同调控混合自旋分子磁体的相竞争，并为后续有限尺寸、真实晶格或实验探测外场磁化提供可检验基准。", "summary_source": "deepseek", "authors": [{"name": "E. Albayrak"}], "featured_authors": [{"name": "E. Albayrak"}], "author_count": 1}, {"id": "2609.23636", "category": "cond-mat", "title": "Tailoring structural, electronic, optical, and magnetic properties of rare-earth gallates RGaO$_3$ (R = Ho, Er, Tm) via first-principles investigations", "abstract": "Ab initio calculations of cubic perovskites RGaO$_3$ (R = Ho, Er, Tm) were performed using the full-potential linearized augmented plane wave (FP-LAPW) method within the framework of density functional theory (DFT). We investigated their structural, electronic, magnetic, and optical properties in detail. In the optimized configurations, the lattice constants ranged from 3.83 to 3.85 A. The electronic band structures indicate that ErGaO$_3$ is semiconducting, whereas HoGaO$_3$ and TmGaO$_3$ exhibit half-metallic behavior, probably due to the interaction of spin-orbit coupling with the electronic states near the Fermi level. Optical response of half-metallic compounds (HoGaO$_3$,TmGaO$_3$) is strongly governed by their spin polarization electronic structure. The semiconducting spin channel absorbs ultraviolet photons, while metallic or small gap channel interacts with infrared light. This dual behavior enables spin selective optical excitation, relevant for spintronics and optoelectronics applications. These compounds show high surface reflectivity, with TmGaO$_3$ achieving a maximum reflectivity of 69%. Moreover, their optical conductivity mainly occurs at higher energies, indicating suitability for high-energy optoelectronic applications. The calculated magnetic moments suggest a robust ferromagnetic character across this series.", "url": "https://arxiv.org/abs/2609.23636", "type": "理论+数值", "summary": "1. 该工作采用FP-LAPW方法和DFT框架的第一性原理计算，系统研究了立方钙钛矿RGaO3 (R=Ho, Er, Tm)的结构、电子、磁性与光学性质，并优化得到3.83–3.85 Å的晶格常数。\n2. 计算表明ErGaO3为半导体，而HoGaO3和TmGaO3可能因自旋轨道耦合与费米能级附近电子态作用呈半金属性，其光学响应由自旋极化电子结构决定，半导体自旋通道吸收紫外光、金属通道响应红外光，实现自旋选择性光激发。\n3. 该系列材料具有稳健铁磁性，TmGaO3表面反射率最高达69%且光导主要位于高能区，这为自旋电子学、光电子学及高能光电器件提供了候选体系。", "summary_source": "deepseek", "authors": [{"name": "T. Usman"}, {"name": "K. Liaqat"}, {"name": "S. Khan"}, {"name": "M. Yar Khan"}, {"name": "S. Ali Khan"}], "featured_authors": [{"name": "T. Usman"}, {"name": "K. Liaqat"}, {"name": "S. Khan"}, {"name": "M. Yar Khan"}, {"name": "S. Ali Khan"}], "author_count": 5}, {"id": "2609.23641", "category": "cond-mat", "title": "Computational investigation of a perovskite LaBiO$_{3}$ for photovoltaic, thermoelectric, and optoelectronic applications", "abstract": "Using density functional theory (DFT) with the ONCVVPSP pseudopotential and PBE functional, this study investigates the structural, electronic, elastic, optical, and thermoelectric properties of the trigonal LaBiO$_{3}$ perovskite oxide (space group R3c). Ground-state parameters lattice constant, volume, bulk modulus, and its pressure derivative were determined using the equation of state. Applying the Hubbard correction (GGA+U) revealed an indirect, wide band gap of 3.51 eV. Mechanical properties, including the anisotropy factor, elastic modulus, and Poisson's ratio, were calculated via the Voigt-Reuss-Hill averaging scheme. The bulk-to-shear modulus ratio identifies the trigonal phase as ductile. Additionally, Debye temperatures and sound velocities were computed. Optical characteristics (absorption coefficient, refractive index, and electron energy loss function) were evaluated across a 0-35 eV spectral range. Finally, semi-classical transport coefficients, including electrical conductivity, Seebeck coefficient, and power factor, were calculated to assess the material's thermoelectric potential.", "url": "https://arxiv.org/abs/2609.23641", "type": "理论+数值", "summary": "1. 该工作基于DFT（ONCVVPSP赝势、PBE）系统计算了三方R3c相LaBiO₃钙钛矿的结构、电子、弹性、光学与热电性质。\n2. 关键在于GGA+U给出3.51 eV间接宽带隙，Voigt-Reuss-Hill平均表明其具延性，并配合德拜温度、0–35 eV光学响应与半经典输运系数。\n3. 该结果为这一无铅钙钛矿氧化物在光伏、热电及光电子应用中的后续筛选与实验验证提供了可对照的第一性原理参数基准。", "summary_source": "deepseek", "authors": [{"name": "M. M. Woldemariam"}, {"name": "N. G. Debelo"}, {"name": "T. K. Tufa"}, {"name": "E. M. Gurmesa"}, {"name": "S. H. Didu"}, {"name": "S. N. Asfaw"}, {"name": "D. T. Keno"}], "featured_authors": [{"name": "M. M. Woldemariam"}, {"name": "N. G. Debelo"}, {"name": "T. K. Tufa"}, {"name": "S. H. Didu"}, {"name": "S. N. Asfaw"}, {"name": "D. T. Keno"}], "author_count": 7}, {"id": "2609.23644", "category": "cond-mat", "title": "Electronic energy structure and optical properties of In$_{4}$CdI$_{6}$ from $\\textit{ab initio}$ calculations", "abstract": "This work presents the $\\textit{ab initio}$ calculations of the electronic energy spectrum of the In$_{4}$CdI$_{6}$ compound. The study was conducted within the framework of density functional theory (DFT), using local density approximation (LDA) and general gradient approximation (GGA) pseudopotentials, and the Heyd-Scuseria-Ernzerhof (HSE06) hybrid functional. The GGA approximation was implemented using the PBE and PBEsol exchange-correlation functional. Based on the electronic energy structure, the type of the minimum band gap was determined, and an analysis of the energy level dispersion for both the valence and conduction bands was performed. Furthermore, the effective masses of electrons ($\\textit{m}_{c}$) and holes ($\\textit{m}_{v}$) for In$_{4}$CdI$_{6}$ were established. The energy band analysis was complemented by the calculation of the density of states (DOS). Based on the electronic energy spectrum, the real and imaginary components of the dielectric function are calculated. Using the Kramers-Kronig relations, we also derive such fundamental optical functions of In$_{4}$CdI$_{6}$ as the refractive index $\\textit{n}$, and the extinction coefficient $\\textit{k}$.", "url": "https://arxiv.org/abs/2609.23644", "type": "理论+数值", "summary": "1. 该工作基于密度泛函理论，采用LDA、GGA（PBE、PBEsol）与HSE06杂化泛函计算了In4CdI6的电子能谱和光学性质。\n2. 其核心结果包括判定最小带隙类型、解析价带与导带色散、提取电子和空穴有效质量及态密度，并由介电函数实部与虚部经Kramers-Kronig关系得到折射率n和消光系数k。\n3. 这些第一性原理数据可为In4CdI6的能带工程、载流子输运评估和光学响应设计提供定量参考。", "summary_source": "deepseek", "authors": [{"name": "I. V. Semkiv"}, {"name": "N. T. Pokladok"}, {"name": "F. O. Ivashchyshyn"}, {"name": "A. I. Ka
