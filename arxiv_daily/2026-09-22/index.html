ry map from one layer to the next one of an $r=2$ Neural Network based on the CV Tits Satake universality class; in perspective, this new tool increases expressivity.", "url": "https://arxiv.org/abs/2609.23395", "type": "理论", "summary": "1. 在本文中，我们详细证明了可解群 $\\mathcal{S}_{2,2+p}$（相当于 Calabi Vesentini 对称空间 $\\mathrm{SO(2,2+p)/SO(2)\\times SO(2+p)}$ 的度量，与可解群 $\\mathcal{S}_{\\mathrm{L}(-1,p)}$ 之间的同构齐次非对称特殊流形 L$(-1,p)$ 的凯勒度量。\n2. $\\mathrm{Iso}_{\\mathrm{L}(-1,p)}$ 对 CV 流形可解坐标的作用可以直接构造。\n3. 这种识别为 Cartan 神经网络提供了一个有价值的工具，在基于 CV Tits Satake 通用类的 $r=2$ 神经网络的从一层到下一层的每个映射中引入了额外的非线性变换；从长远来看，这个新工具提高了表现力。", "summary_source": "local-fallback", "authors": [{"name": "Pietro Fré"}, {"name": "Mario Trigiante"}, {"name": "Antoine Van Proeyen"}], "featured_authors": [{"name": "Pietro Fré"}, {"name": "Mario Trigiante"}, {"name": "Antoine Van Proeyen"}], "author_count": 3}, {"id": "2609.23399", "category": "hep-th", "title": "Spin density from second order transport in fluids", "abstract": "We study the hydrodynamics of a charged fluid with spin degrees of freedom. We argue that, in a conformal field theory in 3+1 dimensions, the spin density is related to a linear combination of standard second-order transport coefficients, and an additional term quadratic in the gauge- and mixed gauge-gravitational anomaly coefficients. We compute the spin density in several free and holographic theories and compare the results.", "url": "https://arxiv.org/abs/2609.23399", "type": "理论", "summary": "1. 该工作研究了3+1维共形场论中含自旋自由度的带电流体，建立其流体力学描述并将自旋密度与二阶输运系数联系起来。\n2. 关键物理在于自旋密度由一个常规二阶输运系数的线性组合，加上规范—混合规范引力反常系数的二次贡献共同决定，并在若干自由与全息理论中计算比较。\n3. 这表明白旋密度可作为探测量子反常与高阶输运耦合的敏感量，为约束全息模型及弱耦合自旋流体力学提供明确基准。", "summary_source": "deepseek", "authors": [{"name": "Domingo Gallegos"}, {"name": "Roi Klein"}, {"name": "Amos Yarom"}], "featured_authors": [{"name": "Domingo Gallegos"}, {"name": "Roi Klein"}, {"name": "Amos Yarom"}], "author_count": 3}, {"id": "2609.23556", "category": "hep-th", "title": "Gauge Origami of the Conifold $\\times$ $\\mathbb{C}$", "abstract": "We construct gauge-origami systems on the toric Calabi--Yau fourfold $\\mathcal{C}\\times\\mathbb{C}$ from its brane brick model. Brick matchings and phase boundaries determine elementary D6- and D4-brane framings, respectively, realizing the magnificent-four, tetrahedron-instanton, and spiked-instanton sectors in a unified framed quiver quantum mechanics. We define their partition functions by Jeffrey--Kirwan residues and describe the fixed points in terms of colored BPS crystals. General gauge-origami configurations are obtained by combining these elementary sectors through their common fractional D0-brane quiver. This construction provides a first step toward gauge origami on general toric Calabi--Yau fourfolds.", "url": "https://arxiv.org/abs/2609.23556", "type": "理论", "summary": "1. 我们根据其膜砖模型在复曲面 Calabi--Yau 四重 $\\mathcal{C}\\times\\mathbb{C}$ 上构建了规范折纸系统。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Taro Kimura"}, {"name": "Go Noshita"}], "featured_authors": [{"name": "Taro Kimura"}, {"name": "Go Noshita"}], "author_count": 2}, {"id": "2609.23776", "category": "hep-th", "title": "Where's Kasner? OPE Signature of Kasner Exponents", "abstract": "At large $N$, the analytic structure of holographic thermal correlation functions contains non-trivial information about the near-singularity region of dual black holes. In particular, complex-time singularities can be related to geodesics that probe the black hole interior and bounce off the singularity. We analyse the asymptotic behaviour of holographic OPE data entering scalar two-point functions in states dual to black branes whose blackening factors truncate at finite order in inverse powers of the radial coordinate. For this class of geometries, we find a direct relation between the power-law exponent of these bouncing singularities and the Kasner exponent associated with the time direction near the black hole singularity. We discuss the regime of validity of this relation and comment on possible extensions to the transverse spatial directions.", "url": "https://arxiv.org/abs/2609.23776", "type": "理论", "summary": "1. 该工作在大N下分析进入标量两点函数的全息OPE数据渐近行为，对象为黑化因子在径向坐标逆幂有限阶截断的黑膜态，聚焦复时间反弹奇点的幂律指数。\n2. 其核心卖点是发现这些反弹奇点的幂律指数与黑洞奇点附近时间方向的Kasner指数直接相关，从而将边界OPE数据与内区Kasner几何定量联系起来。\n3. 该对应为用边界关联函数探测黑洞内部近奇点几何提供了途径，在讨论有效范围后，有望推广至横向空间方向的Kasner指数与更一般截断几何。", "summary_source": "deepseek", "authors": [{"name": "Nejc Čeplak"}, {"name": "Samuel Valach"}], "featured_authors": [{"name": "Nejc Čeplak"}, {"name": "Samuel Valach"}], "author_count": 2}, {"id": "2609.23938", "category": "hep-th", "title": "Projective geometry of second-order supersymmetry", "abstract": "We show that anomaly-free second-order supersymmetry (SUSY) in quantum mechanics admits a projective-geometric formulation in terms of a projective connection and a vector field preserving it. Once the physical coordinate and energy origin are fixed, these data determine the partner Hamiltonians and supercharges; the field's quadratic invariant fixes the central parameter and candidate singlet energies. The fixed-point structure of this field yields explicit criteria for smooth continuation of the quantum operators through superpotential zeros. The classically fictitious similarity transformation selects affine data whose covariant factors generate the Schwarzian quantum correction. Dimensional reduction of a Riemannian model reproduces these affine data through the volume measure, while a coordinate adapted to the selected field implements coupling-constant metamorphosis. A one-gap Lame pair illustrates the relation between the SUSY auxiliary geometry and the Gelfand-Dikii-Virasoro structure governing physical solution products. Its Lax-Novikov integral acts on Schrodinger solutions through the first-order action of a projective stabilizer; in the reflectionless limit it becomes proportional, in the physical coordinate, to the auxiliary third Bol operator.", "url": "https://arxiv.org/abs/2609.23938", "type": "理论", "summary": "1. 我们证明，量子力学中的无异常二阶超对称性（SUSY）承认射影几何公式，即射影连接和保存它的矢量场。\n2. 其 Lax-Novikov 积分通过射影稳定器的一阶作用作用于薛定谔解；在无反射极限下，它在物理坐标中与辅助第三个 Bol 算子成比例。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Stevan Cebrian"}, {"name": "Mikhail S. Plyushchay"}], "featured_authors": [{"name": "Stevan Cebrian"}, {"name": "Mikhail S. Plyushchay"}], "author_count": 2}, {"id": "2609.23991", "category": "hep-th", "title": "Cassini Ansatz in the Skyrme Model", "abstract": "We investigate the stretching of a spherically symmetric solution in the Skyrme model. The three-dimensional generalization of the Cassini ovals is considered as ansatz of extension. The linear dependence of static energy on the longitudinal deformation parameter is obtained with a slope $\\sigma \\approx 0.14\\ \\mathrm{ GeV}^2$, which is in good agreement with the string tension known from various models of confinement.", "url": "https://arxiv.org/abs/2609.23991", "type": "理论", "summary": "1. 该工作研究 Skyrme 模型中球对称解沿纵向拉伸的形变，并采用三维推广的 Cassini 卵形线作为延展试探波函数。\n2. 其核心发现是静态能量随纵向形变参量线性增长，斜率 σ≈0.14 GeV²，并与多种禁闭模型给出的弦张力相符。\n3. 其启示在于 Skyrme 模型中拉伸的孤子可有效模拟禁闭弦的线性势，为强子弦、重子结构及相关有效模型研究提供可检验的图像。", "summary_source": "deepseek", "authors": [{"name": "N. V. Gerasimeniuk"}, {"name": "A. A. Korneev"}, {"name": "A. V. Molochkov"}, {"name": "O. G. Tkachev"}], "featured_authors": [{"name": "N. V. Gerasimeniuk"}, {"name": "A. A. Korneev"}, {"name": "A. V. Molochkov"}, {"name": "O. G. Tkachev"}], "author_count": 4}, {"id": "2609.24227", "category": "hep-th", "title": "Critical Kasner scaling from Cauchy-horizon collapse near holographic phase transitions", "abstract": "We study continuous scalar-hair bifurcations from stationary black holes with a nonextremal Cauchy horizon. Although the exterior deformation vanishes at criticality, the critical zero mode generically develops a logarithmic branch at the reference Cauchy horizon, producing a nonuniform critical limit. We show that the coefficient of this logarithm in the scalar perturbation, together with local Cauchy-horizon data, determines the exponential collapse rate of the Einstein-Rosen bridge. If the post-collapse geometry evolves into a Kasner regime, the boundary order-parameter scaling $O\\propto|\\lambda-\\lambda_c|^\\beta$ further implies $ 1-p_t\\propto|\\lambda-\\lambda_c|^{2\\beta}. $ Crucially, zero-mode matching fixes both the critical exponents and the associated amplitudes, without any fit to the nonlinear interior. We illustrate this mechanism in the transition from rotating BTZ to hairy rotating black holes. For scalarized RN-AdS$_4$ black branes, we quantitatively verify the predicted Kasner scaling using fully nonlinear numerical solutions. At low temperature, two charged models with identical linear critical data instead approach different infrared endpoints, yielding respectively power-law and inverse-logarithmic Kasner scaling. Thus interiors near a finite-temperature bifurcation are controlled by zero-mode transmission, whereas low temperature scaling is governed by the nonlinear infrared completion.", "url": "https://arxiv.org/abs/2609.24227", "type": "理论", "summary": "1. 我们研究来自具有非极值柯西视界的静止黑洞的连续标量毛发分叉。\n2. 在低温下，具有相同线性临界数据的两个带电模型反而接近不同的红外端点，分别产生幂律和反对数卡斯纳标度。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Ling-Long Gao"}, {"name": "Yan Liu"}, {"name": "Hong-Da Lyu"}], "featured_authors": [{"name": "Ling-Long Gao"}, {"name": "Yan Liu"}, {"name": "Hong-Da Lyu"}], "author_count": 3}, {"id": "2609.24344", "category": "hep-th", "title": "Saddle-Order Universality in Ensemble-Averaged Black Hole Thermodynamics", "abstract": "We establish a saddle-order proposition for the ensemble-averaged generalized free energy in reduced Euclidean black hole ensembles. Under regularity and stability assumptions, the leading fluctuation contribution is determined by the order of the first stabilizing term around the dominant saddle. An ordinary critical point is governed by a quartic soft mode, giving a quarter-temperature contribution instead of the familiar half-temperature Gaussian result. We verify this analytically for four-dimensional RN-AdS and Kerr-AdS black holes and map their thermodynamic controls to a common quartic normal form, whose scaling function connects the critical and Gaussian regimes along the zero-field one-well direction. The proposition also extends to coupled collective modes with weighted-homogeneous leading potentials. These results provide a unified description of reduced-ensemble fluctuations through black hole criticality.", "url": "https://arxiv.org/abs/2609.24344", "type": "理论", "summary": "1. 该工作建立约化欧几里得黑洞系综中系综平均广义自由能的鞍点阶数命题，并解析验证四维RN-AdS与Kerr-AdS。\n2. 其关键机制是首位稳定项阶数决定领头涨落：普通临界点的四次软模给出四分之一温度贡献，而非高斯半温度结果。\n3. 该框架将黑洞热力学控制映射为共同四次正规形，并为约化系综涨落与临界性提供统一描述，可推广至加权齐次势耦合集体模式。", "summary_source": "deepseek", "authors": [{"name": "Ankit Anand"}, {"name": "Peng Cheng"}], "featured_authors": [{"name": "Ankit Anand"}, {"name": "Peng Cheng"}], "author_count": 2}, {"id": "2609.24360", "category": "hep-th", "title": "Miwa deformation of WLZZ matrix models", "abstract": "In this paper we propose a universal way to define multivariate orthogonal polynomials for the positive branch of WLZZ matrix models. This allows us to generalize from the Gaussian case, previously considered in the literature, the strict superintegrability property and the Miwa deformation formulas.", "url": "https://arxiv.org/abs/2609.24360", "type": "理论", "summary": "1. 该工作针对WLZZ矩阵模型的正分支，提出构造多元正交多项式的普适方案。\n2. 其核心卖点是将此前仅限高斯情形的严格超可积性与Miwa形变公式推广至一般WLZZ模型。\n3. 这表明多元正交多项式可作为研究非高斯WLZZ模型超可积性、Miwa形变及可积结构的统一工具。", "summary_source": "deepseek", "authors": [{"name": "T. Diudin"}, {"name": "A. Popolitov"}], "featured_authors": [{"name": "T. Diudin"}, {"name": "A. Popolitov"}], "author_count": 2}, {"id": "2609.24364", "category": "hep-th", "title": "Spin-curvature effects in slowly rotating black hole spacetime", "abstract": "We investigate the spin-curvature interaction for a massive spin-1/2 quantum particle in a slowly rotating black hole spacetime. In contrast to the flat Minkowski space, the curved spacetime introduces non-trivial spin connections into the Dirac equation due to the direct curvature-spin interaction. The force arising from this non-trivial spin-curvature coupling makes the particle deviate from its geodesics. We first calculate the tetrads in the co-moving frame of the particle in the slowly rotating black hole background. We then compute the components of the relativistic quantum force, arising from the spin-curvature interaction, using these co-moving tetrads up to linear order in the rotation parameter ($a$) of the black hole. The procedure of computing the force is based on the WKB approximation and the Gordon decomposition method for the Dirac probability four current. Our results show that the rotation parameter modifies the magnitude of the force by introducing a term that decays more rapidly with radial distance than the force magnitude in a static spherically symmetric Schwarzschild black hole spacetime.", "url": "https://arxiv.org/abs/2609.24364", "type": "理论", "summary": "1. 该工作研究慢转黑洞时空中大质量自旋-1/2粒子的自旋-曲率相互作用，并在粒子随动标架下计算量子力。\n2. 其技术核心是用WKB近似与Gordon分解处理Dirac概率四流，在线性旋转参数a下给出非平凡自旋联络导致的力分量。\n3. 结果表明黑洞自转引入随径向距离衰减更快的修正项，从而改变自旋-曲率力的径向行为。", "summary_source": "deepseek", "authors": [{"name": "Arpita Jana"}, {"name": "Subhajit Mazumdar"}, {"name": "Sunandan Gangopadhyay"}], "featured_authors": [{"name": "Arpita Jana"}, {"name": "Subhajit Mazumdar"}, {"name": "Sunandan Gangopadhyay"}], "author_count": 3}, {"id": "2609.24366", "category": "hep-th", "title": "T-duality of string charge density/bit threads correspondence in type II supergravity", "abstract": "In this paper, we study Abelian T-duality of the string charge density/bit threads correspondence in ten-dimensional Type II supergravity. T-duality along the common compact circle maps the Type IIB F1-NS5-P background to a Type IIA P-NS5-F1 background with the winding and momentum charges exchanged. The radial F1 source remains an F1 source, and its projected charge density gives a bit-thread flow whose maximal flux reproduces the black hole entropy. The same duality maps D1-D5-P to D0-D4-F1. In this case, a radial D1 source becomes a D2 source wrapped on the dual circle. Contracting the resulting spatial bivector with the normalized closed one-form on that circle gives a conserved effective radial flow whose maximal flux again reproduces the entropy. Although the local metrics, dilatons, source currents, and flow norms change, the dilaton-weighted transverse area density and the integrated maximal flux are invariant. These results provide a nontrivial T-duality test of the correspondence and extend it from string currents to wrapped-brane currents that reduce to string-like flows.", "url": "https://arxiv.org/abs/2609.24366", "type": "理论", "summary": "1. 该工作研究十维II型超引力中弦电荷密度/比特线对应的阿贝尔T-对偶，沿共同紧致圆将IIB的F1-NS5-P映为IIA的P-NS5-F1，并把D1-D5-P映为D0-D4-F1。\n2. 关键机制是对偶交换缠绕与动量荷：径向F1源仍给出最大通量复现黑洞熵的比特线流；D1变为缠绕对偶圆的D2，将空间双矢量与归一化闭一形式缩并后得守恒有效径向流，其最大通量亦复现熵，且伸缩子加权横向面积密度与积分最大通量不变。\n3. 结果构成该对应的非平凡T-对偶检验，并暗示可把弦电流推广到约化为弦状流的包裹膜电流，为超引力中熵、流与对偶不变量的联系提供约束。", "summary_source": "deepseek", "authors": [{"name": "Houwen Wu"}, {"name": "Shuxuan Ying"}], "featured_authors": [{"name": "Houwen Wu"}, {"name": "Shuxuan Ying"}], "author_count": 2}, {"id": "2609.24415", "category": "hep-th", "title": "Dynamical Schwinger Production of Dipole--Antidipole Pairs in a Fractonic Lattice", "abstract": "We investigate field-induced excitation production from the unit-filled Mott background of a one-dimensional dipole-conserving Bose--Hubbard chain driven by a periodic quadratic potential, realizing a time-dependent rank-two electric field. Unlike protocols that manipulate pre-existing dipolar or fractonic excitations, we address their production from an initially Mott-like state without prepared dipolar or fractonic excitations. A single correlated hop directly nucleates the compact $|030\\rangle$ configuration at the atomic energy $3U$, while a lower manifold derived from $2U$ contains spatially resolved dipole--antidipole configurations. Exact diagonalization shows that finite hopping turns this lower manifold into a dispersive band whose finite-chain edge lies substantially below the compact $3U$ scale. Despite this lower energetic edge, its normalized odd-harmonic spectral weight is perturbatively suppressed as $(J/U)^2$, reflecting virtual hybridization of the initial and final eigenstates. A consistent second-order treatment of the $|1111\\rangle\\leftrightarrow|0220\\rangle$ channel includes diagonal self-energy shifts and predicts a weak-field resonance displacement confirmed by exact time evolution. Extended-chain dynamics shows genuine dipole--antidipole separation together with redistribution into higher-energy many-body sectors. The resulting mechanism provides a condensed-matter analogue of multiphoton dynamical Schwinger production in which exact dipole conservation replaces mobile opposite charges by mobile opposite dipoles, while isolated fractonic charges remain immobile.", "url": "https://arxiv.org/abs/2609.24415", "type": "理论", "summary": "1. 该工作研究一维偶极守恒Bose-Hubbard链在周期二次势驱动下，从单位填充Mott态动力学产生偶极-反偶极对，等效为含时二阶电场。\n2. 卖点是单次关联跃迁成核|030>，有限跃迁使2U流形成色散带，但奇次谐波谱重按(J/U)^2抑制，二阶自能修正的弱场共振位移经精确演化证实。\n3. 该机制为多光子动态Schwinger产生提供凝聚态类比：偶极守恒取代移动的相反电荷，而孤立分形电荷仍不可动。", "summary_source": "deepseek", "authors": [{"name": "Celio R. Muniz"}, {"name": "R. N. Costa Filho"}], "featured_authors": [{"name": "Celio R. Muniz"}, {"name": "R. N. Costa Filho"}], "author_count": 2}, {"id": "2609.24483", "category": "hep-th", "title": "Unistochastic reduction of multi-matrix coherent-state kernels", "abstract": "We revisit the finite-$N$ coherent-state overlap integrals appearing in multi-matrix BPS correlators. For commuting coherent-state parameters, these integrals take the form $I_N(C)=\\int_{U(N)}d\\mu_H(U)\\, \\exp\\!\\left(\\sum_{ij}C_{ij}|U_{ij}|^2\\right)$. We show that $I_N(C)$ is naturally the Laplace transform of the Haar-pushforward measure on the unistochastic set. Row and column stochasticity reduce the source variables from $N^2$ to $(N-1)^2$. For $N=3$, using the known Haar-induced measure on the unistochastic body, we obtain a compact three-dimensional Bessel-integral representation. For general finite $N$, the same formulation gives an exact low-order moment expansion via Weingarten calculus and a direct Haar-pushforward sampling program.", "url": "https://arxiv.org/abs/2609.24483", "type": "理论", "summary": "1. 该工作重新考察多矩阵BPS关联子中的有限N相干态重叠积分，并证明其可化为单随机集合上Haar推前测度的Laplace变换。\n2. 关键卖点是通过行、列随机性将源变量从N^2降至(N-1)^2；N=3给出三维Bessel积分表示，任意有限N可得Weingarten低阶矩展开。\n3. 该表述还提供直接的Haar推前采样方案，并暗示可用单随机几何统一计算相关多矩阵BPS相干态核。", "summary_source": "deepseek", "authors": [{"name": "Shannon Wang"}], "featured_authors": [{"name": "Shannon Wang"}], "author_count": 1}, {"id": "2609.24521", "category": "hep-th", "title": "Braneworld tidal charge through the classical double copy", "abstract": "We investigate the classical double copy of the rotating black-hole geometry induced on the brane in the Randall-Sundrum II scenario. The influence of the five-dimensional bulk is encoded in the effective four-dimensional geometry through a tidal charge, while the metric admits a Kerr-Schild representation over a flat background. We construct the corresponding single and zeroth copies and find that their regular sources are entirely proportional to the tidal charge, whereas the mass-dependent contribution is source-free in the regular region. Comparison with Kerr-Newman reveals a formal correspondence between the tidal charge and the squared electromagnetic charge at the level of the induced geometry and its double copies, despite their different physical origins and the fact that the tidal charge may take either sign. When an electromagnetic field is included on the brane, both contributions enter the low-energy Kerr-Schild geometry and its double copies only through the combination $Q^2+\\beta$. These results illustrate how physically distinct brane and bulk contributions can become indistinguishable in the classical double copy of an effective geometry.", "url": "https://arxiv.org/abs/2609.24521", "type": "理论", "summary": "1. 该工作研究了RS-II膜上旋转黑洞诱导几何的经典双拷贝，并构造相应的单拷贝与零拷贝。\n2. 其正则源完全正比于潮汐电荷，质量依赖项在正则区域无源；潮汐电荷与Kerr-Newman电荷平方形式对应，含电磁场时仅以Q²+β出现。\n3. 这表明物理起源不同的膜与体贡献可在有效几何的经典双拷贝中变得不可区分，提示解读此类源时需谨慎。", "summary_source": "deepseek", "authors": [{"name": "Juan C. La Cruz"}, {"name": "Jesús A. Rodríguez"}], "featured_authors": [{"name": "Juan C. La Cruz"}, {"name": "Jesús A. Rodríguez"}], "author_count": 2}, {"id": "2609.24557", "category": "hep-th", "title": "On the (In)equivalence of de Sitter and Holographic Entanglement Entropies in Lovelock Gravity", "abstract": "We investigate the relation between de Sitter entropy and holographic entanglement entropy in higher-curvature gravity and its braneworld realization. Using the canonical formulation of the gravitational action and the Euclidean gravitational path integral, we derive the de Sitter entropy, including contributions from higher-curvature surface terms, and compare it with the holographic entanglement entropy obtained from the corresponding entropy functional. We first consider Gauss-Bonnet gravity and show that the two entropies coincide for static asymptotically de Sitter braneworld spacetimes on the RS II model, while they generally differ for stationary spacetimes. The mismatch in the stationary case arises from an extrinsic-curvature contribution associated with the constant-time surface, which vanishes for static configurations but is generally nonzero for stationary geometries. We then extend the analysis to general Lovelock gravity and show that the agreement between the de Sitter entropy and holographic entanglement entropy persists for static asymptotically de Sitter braneworld spacetimes in the RS II model beyond the Gauss-Bonnet case. We also comment that the same distinction between static and stationary configurations applies to braneworld black holes: the black hole entropy agrees with the holographic entanglement entropy in the static case, while the two generally differ for stationary braneworld black holes. Our results clarify the relation between gravitational and holographic entropies in higher-curvature gravity and provide a broader perspective on holographic correspondence in Lovelock theories and their braneworld realizations.", "url": "https://arxiv.org/abs/2609.24557", "type": "理论", "summary": "1. 该工作利用引力作用量的正则表述与欧氏路径积分，在高斯-博内及一般洛夫洛克引力中导出包含高阶曲率表面项的德西特熵，并在RS II膜世界框架下与由相应熵泛函得到的全息纠缠熵进行系统比较。\n2. 核心结果是：静态渐近德西特膜世界上两者一致，而稳态时空因常时面外曲率贡献一般不相等，且膜世界黑洞熵与全息纠缠熵之间也呈现相同的静态/稳态区分。\n3. 这厘清了高阶曲率引力中引力熵与全息熵的关系，并为洛夫洛克理论及其膜世界实现中的全息对应提供了更广的适用边界与可检验启示。", "summary_source": "deepseek", "authors": [{"name": "Takamasa Kanai"}], "featured_authors": [{"name": "Takamasa Kanai"}], "author_count": 1}, {"id": "2609.24582", "category": "hep-th", "title": "The Gaiotto-Kim Trace Formula and Line Defects", "abstract": "We study the insertion of 4d half-BPS line defects into the trace formula proposed by Gaiotto and Kim, which computes the ellipsoid partition function of the 3d topological quantum field theory (TQFT) arising from a 4d $\\mathcal{N}=2$ superconformal field theory. This yields a homomorphism to 3d Wilson loops, preserving the fusion algebra of the 4d defects. We also present a systematic algorithm for determining the simple objects of a 3d TQFT in terms of Wilson loops in the UV 3d $\\mathcal{N}=2$ abelian Chern-Simons-matter theory. Utilizing supersymmetric localization, we characterize the modular $S$- and $T$-matrices of the TQFT. We apply our algorithm to various 3d TQFTs arising from the trace formula with higher-power monodromy of the $(A_1,G)$ Argyres-Douglas theories.", "url": "https://arxiv.org/abs/2609.24582", "type": "理论", "summary": "1. 该工作将4d半BPS线缺陷插入Gaiotto-Kim迹公式，研究由其给出的3d TQFT椭球配分函数。\n2. 其核心是构造到3d Wilson圈的同态并保持4d缺陷融合代数，且给出由UV 3d N=2阿贝尔CS-物质理论Wilson圈确定3d TQFT单对象的算法，并用超对称局域化刻画模S、T矩阵。\n3. 该框架可推广至含(A1,G) Argyres-Douglas理论高次单值性的3d TQFT，为缺陷与模数据对应提供可计算途径。", "summary_source": "deepseek", "authors": [{"name": "Sungjoon Kim"}, {"name": "Spencer Stubbs"}], "featured_authors": [{"name": "Sungjoon Kim"}, {"name": "Spencer Stubbs"}], "author_count": 2}, {"id": "2609.24649", "category": "hep-th", "title": "ABJM to BMN in a Double Scale Limit: Indices and Bubbling Geometries", "abstract": "We study a double scale limit of $U(N)_k\\times U(N)_{-k}$ ABJM theory, with $N,k\\to\\infty$ and $N/k^2\\to\\nu\\in(0,\\infty)$, at fixed positive total monopole charge $q$. In this limit, the Penrose geometry retains a compact null circle of finite radius, and the sector of monopole charge $q$ carries $q$ units of longitudinal momentum. It is therefore naturally associated with the rank-$q$ BMN matrix model, while $\\nu$ fixes its dimensionless coupling. We establish this relation from both gravity and the supersymmetric index. On the gravity side, we take the double scale limit of Hopf quotients of the Donos--Simón half-BPS geometries. The disk carrying the growing background flux becomes an infinite conducting plane, while the remaining finite disks reproduce the Lin--Maldacena electrostatic problem. Their quantized fluxes map directly to the partition data labeling BMN vacua. On the field-theory side, starting from the finite-$N$, finite-$k$ ABJM localization formula, we prove that, at fixed positive monopole charge $q$, the ABJM superconformal index factorizes coefficientwise in the transverse fugacities into a universal neutral contribution and the refined Witten index of the rank-$q$ BMN matrix model, together with the longitudinal momentum weight. The neutral contribution is precisely the limiting zero-monopole-charge index. Dividing by this universal factor therefore isolates the BMN index summed over all its supersymmetric vacua.", "url": "https://arxiv.org/abs/2609.24649", "type": "理论", "summary": "1. 该文在 N,k→∞、N/k²→ν 固定且总单极荷 q 固定的双标度极限下研究 ABJM 理论，并建立其与 rank-q BMN 矩阵模型的对应。\n2. 其卖点是：引力侧对 Donos-Simón 半BPS 几何取 Hopf 商，使增长通量盘化为无限导电平面并重现 Lin-Maldacena 静电问题，量化磁通对应 BMN 真空数据；场论侧证明 ABJM 超共形指数在横向逸度上逐系数分解为普适中性因子与 rank-q BMN 精细 Witten 指数及纵动量权重。\n3. 该分解表明，除以普适中性因子即可孤立对所有超对称真空求和的 BMN 指数，为 ABJM/BMN 对偶及 bubbling 几何提供可检验判据。", "summary_source": "deepseek", "authors": [{"name": "Zhengyuan Du"}], "featured_authors": [{"name": "Zhengyuan Du"}], "author_count": 1}, {"id": "2609.24806", "category": "hep-th", "title": "Finite-Time Doppler Covariance Spectroscopy in the AdS/CFT correspondence", "abstract": "From a holographic perspective, we formulate an exact finite-duration covariance framework that resolves chirality in the AdS/CFT correspondence. In a rotating BTZ black hole spacetime, relative motion between two boundary controls converts sum-frequency matching on the compact boundary cylinder into discrete velocity resonances indexed by the angular momentum of the scalar field. Because the complete real-control covariance also contains difference-frequency sectors, a two-setting quadrature cycle cancels them and reconstructs the resonant pair contribution from complete positive-semidefinite covariance matrices. For an isolated angular mode, reconstructed pair responses at opposite resonance velocities sample the boundary spectrum at opposite angular momentum and a common control-selected frequency. Their normalized contrast cancels reflection-symmetric control factors and the state-independent operator normalization, yielding a finite-linewidth estimator of intrinsic bath chirality. For a smooth bath spectrum, the bias from common centered even narrowing windows begins at quadratic order in linewidth, extending the protection beyond Gaussian sampling. An explicit real-projection leakage bound controls contamination from neighboring modes. Long-pulse calculations with the exact BTZ spectrum verify phase-cycle reconstruction and quadratic linewidth scaling. Bath-weighted calculations with exact truncated transfer amplitudes establish convergence to this baseline. Under the default controls, the first two nonzero angular modes support extraction from the complete angular sum and reconstruct the BTZ rotation parameter with subpercent deterministic bias. The framework thus separates control-induced resonance kinematics from intrinsic bath chirality and converts finite-time covariance data into a quantitative estimate of the rotating BTZ black hole.", "url": "https://arxiv.org/abs/2609.24806", "type": "理论", "summary": "1. 该工作在AdS/CFT框架下建立精确的有限时长协方差谱学，于旋转BTZ黑洞时空中分辨标量场手性。\n2. 其核心是两设置正交循环抵消差频项、从半正定协方差矩阵重建共振对，并由归一化对比度给出线宽有限的固有浴手性估计。\n3. 该框架将控制诱导的共振运动学与内在手性分离，可由有限时间协方差数据以亚百分比确定性偏差反演BTZ旋转参数。", "summary_source": "deepseek", "authors": [{"name": "Feiyi Liu"}, {"name": "Shiyang Chen"}, {"name": "Yang Wang"}], "featured_authors": [{"name": "Feiyi Liu"}, {"name": "Shiyang Chen"}, {"name": "Yang Wang"}], "author_count": 3}, {"id": "2609.24817", "category": "hep-th", "title": "The Generalized Uncertainty Principle. Massless QED Renormalization", "abstract": "The effective-field-theory interpretation of generalized uncertainty principle (GUP) deformations does not by itself establish whether their tree-level operator content is closed under renormalization. We investigate this question in massless GUP-deformed quantum electrodynamics at one loop and to first order in the deformation parameter. We compute the ultraviolet divergences of the relevant Green functions and determine the counterterm structure. Our central result is that, after eliminating redundant operators, renormalization requires only one independent physical counterterm beyond those associated with the tree-level theory: an axial-axial four-fermion interaction. The original deformation therefore admits a minimal radiative completion at this order. We derive the leading logarithmic running of the induced Wilson coefficient and discuss its operator-level correspondence with the contact interaction arising in Einstein-Cartan gravity.", "url": "https://arxiv.org/abs/2609.24817", "type": "理论", "summary": "1. 该文在无质量GUP形变量子电动力学中，计算一圈及形变参数一阶的紫外发散与抵消项结构。\n2. 核心结果是，剔除冗余算子后，重整化仅需在树级理论之外引入一个独立的轴矢-轴矢四费米相互作用抵消项。\n3. 这表明原形变在此阶可作最小辐射完备，并给出诱导Wilson系数的领头对数跑动及其与Einstein-Cartan引力接触项的算子对应。", "summary_source": "deepseek", "authors": [{"name": "Ezequiel Valero"}, {"name": "Héctor Gisbert"}, {"name": "Victor Ilisie"}], "featured_authors": [{"name": "Ezequiel Valero"}, {"name": "Héctor Gisbert"}, {"name": "Victor Ilisie"}], "author_count": 3}, {"id": "2609.24861", "category": "hep-th", "title": "Quantum inversion of the vacuum hierarchy and multi-kink unbinding in the non-degenerate double sine-Gordon model", "abstract": "We study the quantum corrections to the vacuum energies and to the binding of the multi-kinks of the non-degenerate double sine-Gordon model. With normal ordering defined at the meson mass of the primary vacuum, the one-loop calculation predicts an inversion of the classical vacuum hierarchy, in which quantum fluctuations favour the central secondary vacuum above a coupling set by the classical splitting of the vacua and their meson mass ratio. Matrix-product-state calculations for $n=4$ confirm the inversion, and extrapolation of the bulk energy densities in the lattice spacing supports its persistence in the continuum. The crossing lies below the one-loop prediction, by $22$ percent at $\\alpha=0.3$, and is reproduced closely by the Gaussian effective potential. Finite-chain calculations at $\\alpha=0.3$ show that the central region of the multi-kink of topological charge $Q=4$ expands as the difference of the vacuum energies falls, as a collective-coordinate description predicts, and that beyond the crossing it grows with the size of the system. The composite therefore approaches the loss of its binding with a correction to its total mass still under a tenth of the classical value.", "url": "https://arxiv.org/abs/2609.24861", "type": "理论", "summary": "1. 该工作结合单圈量子修正、矩阵乘积态与有限链计算，研究非简并双正弦-戈登模型中真空能修正和多扭结结合问题。\n2. 其核心在于：以主真空介子质量正规排序时，量子涨落会反转经典真空层级，使中心次真空在耦合超过由真空劈裂与介子质量比设定的阈值后占优；矩阵乘积态证实n=4反转，外推支持连续极限持续，且α=0.3交叉比单圈低22%，高斯有效势可复现。\n3. 这预示连续极限中反转持续存在，Q=4多扭结中心区随真空能差减小而扩张并在交叉后随体系增大，其结合丢失时总质量修正仍低于经典值的十分之一，为多扭结解绑提供可检验图像。", "summary_source": "deepseek", "authors": [{"name": "Jonathan Lozano-Mayo"}], "featured_authors": [{"name": "Jonathan Lozano-Mayo"}], "author_count": 1}, {"id": "2609.24873", "category": "hep-th", "title": "Measuring correlations using local and nonlocal quenches", "abstract": "We present a theoretical proposal for measuring correlation functions in a quantum field system based on the use of quantum quenches. Using the examples of massive and massless scalar field theories, we show that a short-term perturbation of the system leads to a dependence of the further evolution of the average field on the initial state's correlation functions. Considering two types of perturbations, namely local and nonlocal quenches, we show which correlation functions can be measured in each of these cases. The proposed procedure can be applied to study non-Gaussian correlations.", "url": "https://arxiv.org/abs/2609.24873", "type": "理论", "summary": "1. 该工作提出一种基于量子淬火测量量子场系统中关联函数的理论方案，并以有质量和无质量标量场论为例进行展示。\n2. 其核心在于短时扰动后平均场的后续演化依赖于初态关联函数，且局域与非局域淬火分别对应可测量的不同关联函数。\n3. 该流程可应用于研究非高斯关联，显示其在量子场关联测量中的推广潜力。", "summary_source": "deepseek", "authors": [{"name": "Alexey G. Mikhaylenko"}, {"name": "Andrew G. Semenov"}], "featured_authors": [{"name": "Alexey G. Mikhaylenko"}, {"name": "Andrew G. Semenov"}], "author_count": 2}, {"id": "2609.24912", "category": "hep-th", "title": "Gauss--Bonnet running and the de Sitter saddle of quadratic gravity inflation", "abstract": "Inflation driven purely by the quantum running of the curvature-squared couplings of quadratic gravity was shown to accommodate the high scalar tilt favored by recent cosmic microwave background observations, starting from a Euclidean four-sphere at a maximum of the running $R^2$ coupling. That maximum exists only in one renormalization scheme, and is not stationary once the Euler trace anomaly is included. We show that the standard one-loop running, with the usually neglected Gauss--Bonnet coefficient retained, recovers the missing de Sitter state: the Euler running balances the scale dependence of the $R^2$ term at a unique coupling ratio, giving a de Sitter solution that is stationary for the gravitational constraint and for the compact Euclidean action alike, and whose scalaron potential is an extremely flat hilltop ($m^2/H^2\\simeq-5\\times10^{-10}$) joined to an inverse-linear inflationary plateau. The last $N_*\\simeq50$--$60$ $e$-folds are scheme independent, with scalar tilt $n_s\\simeq1-4/(3N_*)$, while the tensor-to-scalar ratio, $r$, is set by the number of matter fields that enhance the running. The current tensor bound excludes pure gravity and sets a minimum matter content, some $4\\times10^6$ conformally coupled scalars or $3\\times10^5$ vectors---$2.6$ times fewer than the momentum-induced scheme requires---while one-loop control to the end of inflation sets a maximum about ten times higher. Across that window the model predicts $r\\gtrsim0.008$ with $0.973\\lesssim n_s\\lesssim0.978$, within reach of upcoming CMB polarization surveys.", "url": "https://arxiv.org/abs/2609.24912", "type": "理论", "summary": "1. 该工作把通常忽略的高斯–博内系数纳入标准单圈重整化群跑动，在二次引力中重新构造了由曲率平方耦合量子跑动驱动的暴胀德西特鞍点。\n2. 其关键在于欧拉跑动与R^2项标度依赖在唯一耦合比下平衡，使德西特解同时满足引力约束与紧致欧几里得作用量，并给出极平坦的标量场山顶势（m^2/H^2≃-5×10^-10）及逆线性暴胀平台。\n3. 该框架预言最后约50–60个e折方案无关，标量倾斜n_s≃1-4/(3N_*)，当前张量上限排除纯引力并要求至少约4×10^6共形标量或3×10^5矢量，而单圈控制给出约十倍上限，窗口内r≳0.008、0.973≲n_s≲0.978，可由未来宇宙微波背景偏振巡天检验。", "summary_source": "deepseek", "authors": [{"name": "Ruolin Liu"}, {"name": "Niayesh Afshordi"}], "featured_authors": [{"name": "Ruolin Liu"}, {"name": "Niayesh Afshordi"}], "author_count": 2}, {"id": "2609.24939", "category": "hep-th", "title": "Chiral Carroll string near Schwarzschild black hole", "abstract": "We obtain the action for the chiral Carroll string moving in a curved string-Carroll target spacetime from a Carroll expansion, in powers of the speed of light $c$, of the action for the relativistic closed bosonic string. Applying this setup to a classical closed bosonic string approaching the $4$-dimensional Schwarzschild black hole, we study the dynamics of the string when it behaves as a chiral Carroll string with the near-horizon string-Carroll expanded geometry as the target spacetime. We find that the chiral Carroll string can have either left-moving or right-moving fluctuations on the horizon, while exhibiting a non-trivial motion in the Rindler spacetime which depends on these horizon fluctuations.", "url": "https://arxiv.org/abs/2609.24939", "type": "理论", "summary": "1. 该工作从相对论性闭玻色弦作用量按光速 c 的幂次作 Carroll 展开，得到弯曲 string-Carroll 靶时空中的手征 Carroll 弦作用量，并将其应用于经典闭玻色弦接近四维 Schwarzschild 黑洞的情形，研究以近视界 string-Carroll 展开几何为靶时空时的手征 Carroll 弦动力学。\n2. 其核心在于表明：手征 Carroll 弦在视界上可具有左行或右行涨落，而这些视界涨落又决定其在 Rindler 时空中的非平凡运动，从而揭示近视界极限下弦自由度与 Rindler 运动之间的耦合。\n3. 这为利用 Carroll 极限与展开理解黑洞近视界弦动力学提供了可操作框架，并提示视界涨落可作为连接 Carroll 对称性与 Rindler 物理的关键切入点。", "summary_source": "deepseek", "authors": [{"name": "Kedar S. Kolekar"}], "featured_authors": [{"name": "Kedar S. Kolekar"}], "author_count": 1}, {"id": "2609.24956", "category": "hep-th", "title": "Towards All-Order Locality in the Higher-Spin Holomorphic Zero-Form Sector", "abstract": "This work addresses the construction of local interaction vertices in the holomorphic zero-form sector obtained from Vasiliev equations. We focus on a requirement on zero-form vertices, previously proposed in a less restrictive form in arXiv:2208.02004 , which, together with spinor spin-locality, guarantees space-time spin-locality. Necessary and sufficient conditions on the holomorphic one-form sector vertices are derived that ensure the existence of holomorphic zero-form vertices satisfying this requirement. As a concrete demonstration, the proposed scheme is applied to compute the spin-local holomorphic $\\eta^2$ zero-form sector vertex, a result that goes beyond previous work where only spinor spin-locality was established. These findings lay the groundwork for a systematic all-order construction of local vertices in higher-spin theory.", "url": "https://arxiv.org/abs/2609.24956", "type": "理论", "summary": "1. 该工作研究Vasiliev方程所得全纯零形式扇区局域顶点的构造，导出了一形式扇区顶点的充要条件以保证满足要求的零形式顶点存在，并计算了η^2顶点。\n2. 其卖点是该条件与旋量自旋局域性结合可保证时空自旋局域性，并给出超越此前仅旋量自旋局域性的全纯η^2自旋局域零形式顶点。\n3. 这为高自旋理论中局域顶点的系统性全阶构造奠定了理论基础。", "summary_source": "deepseek", "authors": [{"name": "D.A. Valerev"}], "featured_authors": [{"name": "D.A. Valerev"}], "author_count": 1}, {"id": "2609.22598", "category": "math-ph", "title": "Cohomology of $\\mathfrak{psl}(n|n)$ in trivial and in adjoint representations", "abstract": "We compute the cohomology of the projective special linear Lie superalgebra $\\mathfrak{psl}(n|n)$ over a field of characteristic zero in trivial and in adjoint coefficients in full detail through its associated Hochschild--Serre spectral sequences. Applications in physics exist for its real form, the projective special unitary Lie superalgebra $\\mathfrak{psu}(n|n)$ --- in particular, $\\mathfrak{psu}(2,2|4)$ for AdS/CFT. We also find the cohomology of $\\mathfrak{sl}(m|n)$ in trivial coefficients along the way and we point out a discrepancy with a previous statement in the literature. We present the explicit cohomology groups of low degree for $n\\leqslant4$.", "url": "https://arxiv.org/abs/2609.22598", "type": "理论", "summary": "1. 该工作计算了特征零域上射影特殊线性李超代数 psl(n|n) 在平凡与伴随表示中的上同调，并借助 Hochschild--Serre 谱序列给出完整推导。\n2. 核心贡献在于完整处理这两类系数，并顺带得到 sl(m|n) 平凡系数上同调、指出文献中先前陈述的不一致。\n3. 因 psu(2,2|4) 与 AdS/CFT 的关联，这些显式结果可为相应超对称场论与全息对偶研究提供代数输入。", "summary_source": "deepseek", "authors": [{"name": "Thiago Oliveira Ferreira"}], "featured_authors": [{"name": "Thiago Oliveira Ferreira"}], "author_count": 1}, {"id": "2609.22759", "category": "math-ph", "title": "Distributional Fractional Taylor Series and Interpretation of the Fractal and Number-Theoretic Explicit Formulas", "abstract": "Motivated by the work of M. L. Lapidus and M. van Frankenhuisjen on fractal explicit formulas for generalized fractal strings, we develop in this paper a distributional fractal Taylor's formula with error term and an exact distributional fractal Taylor series representation for generalized fractal strings. The explicit formulas that the aforementioned authors developed provide a way of expressing a generalized fractal string $\\eta$ in terms of the underlying fractal complex dimensions, under suitable growth assumptions on its geometric zeta function, $\\zeta_{\\eta}$, known as the languidity assumptions. This involves a sum indexed by the complex dimensions of the generalized fractal string, summing over all residues of $\\zeta_{\\eta}$, multiplied by the Mellin transform of a tempered or Schwartz test function $\\phi$, denoted by $\\widetilde{\\phi}$. Under languidity assumptions, there is an error term present. Under stronger assumptions, that is, in the case of strong languidity, no error term is present and the resulting fractal explicit formula is said to be exact. In this paper, we express the residue term in the fractional distributional explicit formulas as the fractional $(-\\omega)^{\\mathrm{th}}$-ordered distributional derivative of the Dirac $\\delta$ distribution, denoted by $Y_{\\omega}$, applied to modified test functions of the form $\\phi(x) \\ln^{k-1}(x)$, where $k$ runs from $1$ to the multiplicity of the pole $\\omega$ of $\\zeta_{\\eta}$. The coefficients in this sum are written in terms of the coefficients in the principal part of the Laurent expansion at $\\omega$ of the geometric zeta function $\\zeta_{\\eta}$, multiplied by the gamma function evaluated at $\\omega$. The results obtained in this paper contribute to the broader program of characterizing fractals in terms of fractal Taylor series expansions involving their underlying fractal complex dimensions.", "url": "https://arxiv.org/abs/2609.22759", "type": "理论", "summary": "1. 该文发展了带误差项的分布型分形泰勒公式，并给出广义分形弦的精确分布型分形泰勒级数表示。\n2. 其核心是将分数阶分布显式公式的留数项写成狄拉克 δ 的 (-ω) 阶分布导数 Y_ω 对 φ(x)ln^{k-1}x 的作用，k 取到 ω 的极点重数，系数由 ζ_η 在 ω 处洛朗主部乘 Γ(ω) 给出。\n3. 这推进了以分形复维数为核心、用分形泰勒展开刻画分形与数论显式公式的研究纲领。", "summary_source": "deepseek", "authors": [{"name": "Michel L. Lapidus"}, {"name": "Matthew Overduin"}], "featured_authors": [{"name": "Michel L. Lapidus"}, {"name": "Matthew Overduin"}], "author_count": 2}, {"id": "2609.22861", "category": "math-ph", "title": "Holomorphic Conformal Cartan Geometry: Conformal Gravity, Twistors, and Ambitwistors", "abstract": "Four-dimensional conformal gravity, twistor theory, and ambitwistor theory are reviewed within the unified framework of holomorphic conformal Cartan geometry. Starting from the spinorial representation of the geometry, the normal $\\mathfrak{sl}(4,\\mathbb{C})$-valued Cartan connection, its curvature $2$-form, and the associated tractor bundles are systematically formulated. Evaluated on the real Lorentzian slice, the quadratic curvature action is shown to reproduce four-dimensional Weyl--Bach conformal gravity upon fixing a Weyl gauge. Local twistor and dual twistor bundles are constructed as associated spin tractor bundles, illustrating how parallel transport yields the classical incidence relations in flat space and chiral integrability constraints in curved backgrounds: anti-self-duality for $\\alpha$-surfaces and self-duality for $\\beta$-surfaces. Furthermore, by pairing local twistors and dual twistors via an invariant canonical pairing, ambitwistor space is shown to parameterize complex null geodesics and symmetrically accommodate both left- and right-handed Weyl curvatures. This framework establishes a direct gauge-theoretic bridge linking conformal Cartan geometry to twistor and ambitwistor theories.", "url": "https://arxiv.org/abs/2609.22861", "type": "理论", "summary": "1. 该文在全纯共形Cartan几何的统一框架下系统重建了四维共形引力、twistor与ambitwistor理论。\n2. 其核心是由sl(4,C)值Cartan联络与曲率构造tractor丛，经Weyl规范固定复现Weyl–Bach引力，并由twistor配对导出ambitwistor空间。\n3. 该框架建立了共形Cartan几何与twistor及ambitwistor理论的规范论桥梁，为曲面手征可积性与复零测地线提供统一启示。", "summary_source": "deepseek", "authors": [{"name": "Chen-Hsu Chien"}], "featured_authors": [{"name": "Chen-Hsu Chien"}], "author_count": 1}, {"id": "2609.23034", "category": "math-ph", "title": "Higher-order and non-geometric symmetries and Noether's theorem in k-cosymplectic Hamiltonian field theory", "abstract": "In this paper, we investigate higher-order symmetries and non-geometric symmetries within the framework of $k$-cosymplectic Hamiltonian field theory. We introduce the concept of generalized infinitesimal symmetry, which relaxes the standard symmetry condition, and then define two new classes of symmetries: higher-order general infinitesimal Cartan symmetries and good non-geometric symmetries. For each of these symmetry classes, we establish a Noether-type theorem that provides explicit conserved quantities for exact $k$-cosymplectic Hamiltonian systems. These results extend and generalize previous work on standard Cartan symmetries in the $k$-cosymplectic setting. Furthermore, we extend all of these results in a parallel fashion to Hamiltonian systems on $k$-symplectic manifolds, demonstrating the unifying nature of our approach. Concrete examples are provided to illustrate the existence and applicability of the proposed symmetries. Our framework offers a systematic geometric treatment of generalized symmetries and their associated conservation laws in classical field theories.", "url": "https://arxiv.org/abs/2609.23034", "type": "理论", "summary": "1. 该工作于k-余辛哈密顿场论框架内考察高阶对称性与非几何对称性，引入放宽标准条件的广义无穷小对称，并定义高阶广义无穷小嘉当对称与良非几何对称两类新对称。\n2. 其核心贡献在于为每类对称建立诺特型定理，对精确k-余辛哈密顿系统给出显式守恒量，并将结论平行推广至k-辛流形，体现统一处理能力。\n3. 该几何框架为经典场论中广义对称与守恒律的系统研究提供方法，并可启发更一般的辛几何与场论推广。", "summary_source": "deepseek", "authors": [{"name": "Manuel de León"}, {"name": "Xuefeng Zhao"}], "featured_authors": [{"name": "Manuel de León"}, {"name": "Xuefeng Zhao"}], "author_count": 2}, {"id": "2609.23119", "category": "math-ph", "title": "Long time stability of low--frequency packets of modes at finite total energy", "abstract": "We consider the FPUT $\\alpha$-model with $N$ particles and initial data with small total energy $E$, independent of $N$. In particular, we prove that if the energy is initially given to Fourier modes of wave number $\\pi k/N\\leq \\theta_*$, then it does not flow to modes of wave number larger than $\\theta_*$ up to long times of order $E^{-(1-\\epsilon/2)}$, $\\theta_*$ and $\\epsilon$ being small numbers. The proof relies on the closeness of the Toda lattice to the FPUT system. Unlike previous approaches, we do not make use of the action-angle variables of the Toda system, but we exploit the Flaschka integrals of the latter. Actually, we find a suitable recombination of the Flaschka integrals whose quadratic part is used to control the packet, the higher order part fulfilling very good estimates.", "url": "https://arxiv.org/abs/2609.23119", "type": "理论", "summary": "1. 该工作研究有限总能量下 FPUT α 模型的低频模包长时间稳定性，证明若初始能量仅赋予波数 πk/N≤θ_* 的傅里叶模，且总能量 E 很小并与 N 无关，则直至时间尺度 E^{-(1−ε/2)} 能量都不会流向波数大于 θ_* 的模。\n2. 其技术核心是利用 Toda 晶格与 FPUT 的接近性，但回避 Toda 作用-角变量，转而重组 Flaschka 积分量，以其中二次部分控制该模包、高阶部分获得良好估计。\n3. 这为有限能量下 FPUT 能量输运提供严格长时限制，并提示 Flaschka 积分量重组可成为不依赖作用-角变量的近可积晶格稳定性分析工具。", "summary_source": "deepseek", "authors": [{"name": "Dario Bambusi"}, {"name": "Antonio Ponno"}], "featured_authors": [{"name": "Dario Bambusi"}, {"name": "Antonio Ponno"}], "author_count": 2}, {"id": "2609.23175", "category": "math-ph", "title": "Six-wave scattering in Hamiltonian Dysthe equations: Euler matching and integrability obstructions", "abstract": "We compute the effective six-wave interaction in spatial and temporal Hamiltonian Dysthe equations and compare it with the complete degree-six coefficient of the deep-water Euler Hamiltonian. On every compact subset $K$ of a generic quadratic-dispersion resonance patch, exact resonances persist under a small cubic correction to the dispersion, and \\[ W_6\\bigl(\\Phi_{\\lambda,\\varepsilon}(z)\\bigr) =\\varepsilon\\frac{4BD}{aL(z)}+O_K(\\varepsilon^2) \\] uniformly in the resonance point $z$ and the deformation parameter $\\lambda$. Here $L$ is the spectral diameter and $B,D$ are the local cubic and mean-flow coefficients. Thus $BD\\ne0$ gives nonzero scattering on relatively open resonance sets. At the Craig--Guyenne--Sulem temporal coefficients, the corresponding exact Euler resonances satisfy \\[ \\frac{\\mu}{4}W_6^{\\rm E}\\bigl(1+\\mu\\Psi_\\mu(z)\\bigr) =-\\frac{8}{L(z)}+O_K(\\mu), \\] where $\\mu$ is the relative bandwidth. The leading term comes from nine contractions of quartic vertices; every other connected degree-six contribution is uniformly bounded. We classify the coefficient values for which the generic six-wave coefficient vanishes identically; in the temporal case, this also gives cancellation on every non-permutation four-wave resonance. Outside these sets, the Zakharov--Schulman condition restricts every regular $C^3$ quadratic leading symbol to $\\operatorname{span}\\{1,k,\\omega(k)\\}$, the span of the symbols of wave action, momentum, and linear energy. Consequently the physical Dysthe models cannot support an inverse-scattering hierarchy with infinitely many linearly independent regular $C^3$ quadratic leading symbols. The cancellation sets contain known nonlinear Schrödinger, mixed Chen--Lee--Liu, Calogero--Moser derivative nonlinear Schrödinger, and Hirota representatives.", "url": "https://arxiv.org/abs/2609.23175", "type": "理论", "summary": "1. 我们计算了时空哈密顿量 Dysthe 方程中的有效六波相互作用，并将其与深水欧拉哈密顿量的完整六阶系数进行比较。\n2. 我们对通用六波系数同样消失的系数值进行分类；在时间情况下，这也消除了每个非排列四波共振。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Alex J. Sutherland"}, {"name": "Solomon C. Yim"}], "featured_authors": [{"name": "Alex J. Sutherland"}, {"name": "Solomon C. Yim"}], "author_count": 2}, {"id": "2609.23244", "category": "math-ph", "title": "Routing and memory in the three-dimensional mirror model on K-lattice", "abstract": "We study numerical observables relevant to delocalization in the three-dimensional Manhattan mirror model, also known as the K-lattice. Our principal experiment separates the locations of transmitting boundary channels from the routing between them. We derive an exact conditional comparison that preserves all transmission and reflection aperture sets, and find a statistically resolved deficit of physical transmission relative to this comparison. Nearby transmitting channels are themselves suppressed relative to a uniform subset with the same cardinality. A second experiment resolves the contribution of repeated vertices by their return age. The squared norm of the signed old-memory remainder is consistent with an inverse-square-root decay over the measured range. Annular experiments quantify decreasing continuation losses, while an initially apparent history dependence fails independent replication. Finally, a periodic configuration has a connected auxiliary contact graph but only finite routing cycles. These results identify estimates on reflection routing and adaptively selected revisit charges that may assist a rigorous proof. They do not establish an infinite-volume delocalized phase.", "url": "https://arxiv.org/abs/2609.23244", "type": "理论", "summary": "1. 该工作在三维曼哈顿镜像模型（K晶格）上数值研究非局域化相关可观测量，分离透射边界通道的位置与通道间路由，并按返回年龄分解重复顶点贡献。\n2. 其核心是构造保持全部透射与反射孔径集合的精确条件比较，由此发现物理透射的统计显著亏缺、邻近透射通道相对同基数均匀子集的抑制，以及旧记忆余项平方范数符合逆平方根衰减。\n3. 这些结果给出反射路由估计和自适应重访电荷，可为严格证明提供线索，但尚未建立无限体积非局域化相，且初始表观历史依赖未获独立复现。", "summary_source": "deepseek", "authors": [{"name": "Jian Gu"}, {"name": "Paul Schaeffer"}, {"name": "Qin Hao"}], "featured_authors": [{"name": "Jian Gu"}, {"name": "Paul Schaeffer"}, {"name": "Qin Hao"}], "author_count": 3}, {"id": "2609.23608", "category": "math-ph", "title": "Resurgence and Complex Geodesics for the Heisenberg Heat Kernel", "abstract": "We study complex geodesic actions and heat-kernel resurgence on isotropic Heisenberg groups. For real endpoints with $r>0,y\\ne0$, the nonzero finite singularities reached by analytic continuation of the minimizing-saddle Borel germ are exactly the finite complex action differences. For nonresonant endpoints, we construct row-finite directional Stokes operators and compute the positive-ray Stokes matrix and its logarithm explicitly; the primitive alien support can be strictly smaller than the full Borel singular support. Near the vertical axis, we obtain uniform two-term large-order asymptotics from the nearest Borel singularity. Cubic resonances admit uniform $A_2$ confluence formulas. We also identify the combination of resurgent sectors selected by the original Fourier contour. Positive Borel summation is exact at horizontal endpoints. At nonzero isotropic complex endpoints, no finite normal trajectories exist, but the signed vertical action lattice is the complete limiting spectrum. The action and Stokes structures are independent of the dimension on isotropic $H^n$.", "url": "https://arxiv.org/abs/2609.23608", "type": "理论", "summary": "1. 该工作在各项同性海森堡群上研究热核的复测地线作用与复兴理论，分析实端点下最小鞍点博雷尔胚解析延拓的有限奇点、非共振端点的斯托克斯算子及竖直轴大阶渐近。\n2. 其核心卖点是证明这些奇点恰为复作用差，显式计算正射线斯托克斯矩阵与对数，并发现 alien 支撑可严格小于博雷尔奇异支撑，而立方共振给出均匀 A2 汇合公式并确定傅里叶轮廓选出的复兴扇区。\n3. 由此可知 n 维各向同性海森堡群上作用与斯托克斯结构不依赖维数，复端点无有限法向轨迹而带符号竖直作用格构成完整极限谱，水平端点正博雷尔求和精确，为热核复分析与测地线研究提供了可迁移框架。", "summary_source": "deepseek", "authors": [{"name": "Xinxing Tang"}], "featured_authors": [{"name": "Xinxing Tang"}], "author_count": 1}, {"id": "2609.23772", "category": "math-ph", "title": "Local conservation laws and symmetries of three-dimensional incompressible Euler flow", "abstract": "We classify all smooth local conservation laws of three-dimensional homogeneous incompressible Euler flow in velocity and pressure, allowing explicit time and position and derivatives of arbitrary finite order. Modulo currents vanishing on solutions and currents with identically zero divergence, the classical mass, momentum, angular-momentum, kinetic-energy and helicity balances, together with generalised time-dependent momentum, exhaust the classification. We also classify all smooth finite-order local symmetry characteristics and adjoint symmetries: differential expressions satisfying the linearised Euler equations and their formal adjoint on solutions, respectively. Every symmetry characteristic is equivalent on solutions to one induced by a point transformation. Every adjoint symmetry has a multiplier representative, whose product with the Euler equations is identically a divergence. These representatives exhaust the restrictions of all local conservation-law multipliers to solutions. The conservation-law proof has three stages: classification of adjoint symmetries using their determining equations, verification of explicit multiplier identities, and the correspondence between multiplier restrictions and current classes. A common analysis of highest-derivative responses reduces both symmetry problems to order at most one.", "url": "https://arxiv.org/abs/2609.23772", "type": "理论", "summary": "1. 该工作分类了三维齐次不可压缩欧拉流在速度和压强变量下所有有限阶光滑局部守恒律、对称特征与伴随对称。\n2. 其关键手段是通过最高阶导数响应将两类对称问题约化至一阶，并用乘子表示和确定方程完成守恒律分类。\n3. 结果表明除经典守恒量与广义含时动量外无新守恒律，对称特征均由点变换诱导，为后续分类提供基准。", "summary_source": "deepseek", "authors": [{"name": "Alexey Shevyakov"}], "featured_authors": [{"name": "Alexey Shevyakov"}], "author_count": 1}, {"id": "2609.23794", "category": "math-ph", "title": "Sum of Three Squares and Particle in a Cubic Box - Degeneracies", "abstract": "We address the problem of determining the degeneracy of a particular energy eigenvalue corresponding to a quantum particle trapped in a cubic box. In other words, we aim to find the number of ways a specific positive integer can be written as the sum of three natural number squares. This is a classic problem in number theory. We provide a closed-form, exact solution to the problem. We do not claim to provide proofs, as we have none; instead, we build up the formulae starting from simple cases where the answer could be deduced by studying the list of degeneracies. We present ample examples that could be verified against the degeneracy calculated numerically via the brute-force method. We arrived at the solution by meticulously studying the list of degeneracies for the first five million numbers, generated by Mathematica$^{\\circledR}$.", "url": "https://arxiv.org/abs/2609.23794", "type": "理论", "summary": "1. 该工作研究立方盒中量子粒子的能级简并，把给定能量本征值的简并度化为将对应正整数写成三个自然数平方和的表示数，并给出闭式精确公式。\n2. 其核心处理方式是在缺乏严格证明的情况下，从可手算的简单情形归纳公式，并用 Mathematica 对前五百万个整数暴力枚举得到的简并列表进行验证。\n3. 这为三平方和定理与立方箱能谱之间建立了可直接核对的对应，也为后续给出严格证明或推广到其他边界条件提供线索。", "summary_source": "deepseek", "authors": [{"name": "S. Pratik Khastgir"}], "featured_authors": [{"name": "S. Pratik Khastgir"}], "author_count": 1}, {"id": "2609.23864", "category": "math-ph", "title": "Quantum modularity in refined topological recursion", "abstract": "In this paper we study the Borel summability and quantum modularity of the free energy computed by refined topological recursion on the Weber-type refined spectral curve. On the one hand, we verify expected properties, namely, Stokes rays come in a pair and the Borel-Laplace sum of the free energy coincides with the Barnes double gamma function. Somewhat unexpectedly, on the other hand, we prove that the generating function of the Stokes constants along each ray is a Jacobi quantum modular function. Our proof suggests that quantum modularity may be a general feature of refined topological recursion, applicable beyond the Weber-type refined spectral curve.", "url": "https://arxiv.org/abs/2609.23864", "type": "理论", "summary": "1. 该文研究Weber型精化谱曲线上精化拓扑递归所得自由能的Borel可和性与量子模性。\n2. 关键卖点是意外证明沿每条Stokes射线的Stokes常数生成函数为Jacobi量子模函数，并验证预期Borel可和性。\n3. 该证明暗示量子模性可能是精化拓扑递归的一般特征，并可推广到Weber型精化谱曲线之外。", "summary_source": "deepseek", "authors": [{"name": "Veronica Fantini"}, {"name": "Kento Osuga"}], "featured_authors": [{"name": "Veronica Fantini"}, {"name": "Kento Osuga"}], "author_count": 2}, {"id": "2609.24418", "category": "math-ph", "title": "Recursive construction of spectral basis and its application to matrices", "abstract": "We prove a recursive formula for construction of generalized spectral basis. Example of application is presented for symbolic computation with non-diagonalizable matrix that describes electromagnetic wave propagation in anisotropic media. The method is general enough and can be applied, for example, to multivectors of the Clifford algebra.", "url": "https://arxiv.org/abs/2609.24418", "type": "理论", "summary": "1. 该文证明构造广义谱基的递推公式，并展示其在矩阵上的应用。\n2. 其技术卖点是能对描述各向异性介质电磁波传播的非对角化矩阵进行符号计算。\n3. 该方法足够通用，可推广至Clifford代数的多重向量等对象，显示更广适用前景。", "summary_source": "deepseek", "authors": [{"name": "A. Acus"}, {"name": "A. Dargys"}], "featured_authors": [{"name": "A. Acus"}, {"name": "A. Dargys"}], "author_count": 2}, {"id": "2609.24465", "category": "math-ph", "title": "The Hadamard parametrix on globally hyperbolic spacetimes with Robin boundary conditions: Fundamental solutions and Hadamard states", "abstract": "On a $d$-dimensional, $d\\geq 2$, globally hyperbolic spacetime with a timelike boundary $(\\mathcal{M},g)$, we investigate the Klein-Gordon equation with Robin boundary conditions. First of all, we prove existence and uniqueness of the advanced and retarded fundamental solutions, discussing in addition their structural properties. Secondly, under the hypothesis of infinitesimal convexity of $\\partial\\mathcal{M}$ and of local finiteness of boundary reflections for broken null bicharacteristics, we characterize their wavefront set in the interior $\\mathring{\\mathcal{M}}$, using the propagation of singularities theorem of Melrose and Sjöstrand. In the second part of the paper, we introduce a notion of Robin-Hadamard two-point correlation function as a positive distribution on $\\mathcal{M}\\times\\mathcal{M}$ with prescribed antisymmetric part and singular structure, the latter being characterized in terms of its wavefront set. We complement this definition with a local Hadamard form. Up to a smooth remainder, this consists of the standard directed Hadamard parametrix together with additional contributions associated with the reflected null rays. Their coefficients are determined by transport equations supplemented by Robin matching conditions at the boundary. The construction applies to an arbitrary, but finite number of reflections. We prove that this local formulation is equivalent to the wavefront set condition, thereby establishing a counterpart of Radzikowski's theorem in the presence of a timelike boundary. Finally, starting from the ground state on suitable static backgrounds and using a deformation argument, we prove existence of Robin-Hadamard two-point correlation functions on the class of spacetimes considered.", "url": "https://arxiv.org/abs/2609.24465", "type": "理论", "summary": "1. 在 $d$ 维、$d\\geq 2$、具有类时边界 $(\\mathcal{M},g)$ 的全局双曲时空上，我们研究具有 Robin 边界条件的 Klein-Gordon 方程。\n2. 它们的系数由输运方程确定，并辅以边界处的 Robin 匹配条件。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Beatrice Costeri"}, {"name": "Claudio Dappiaggi"}, {"name": "Benito Alberto Juárez-Aubry"}], "featured_authors": [{"name": "Beatrice Costeri"}, {"name": "Claudio Dappiaggi"}, {"name": "Benito Alberto Juárez-Aubry"}], "author_count": 3}, {"id": "2609.24493", "category": "math-ph", "title": "Payoffs and perception mediate environmental feedback in an N-player trust game with Q-learning", "abstract": "Trust develops through learning, while collective behavior can alter the environment in which later decisions are made. Reinforcement-learning models describe adaptation, and eco-evolutionary models describe behavior-environment feedback, but how an endogenous environment changes trust through material incentives and perceived states remains unclear. We couple a fixed-role, two-population hierarchical trust game populated by heterogeneous tabular $Q$-learning agents to a centered endogenous environment. For the main feedback comparisons, we initialize the fixed-payoff baseline and feedback branches from the same learned state to control for prior learning. We then compare responses when payoff parameters or the observed environmental tier vary. As the payoff multiplication factor increased, successful trust in the fixed-payoff game crossed from a low to a higher finite-horizon level, led by risk-seeking investors. Environmental feedback promoted trust near perception-tier boundaries and reinforced its decline at the high-return operating point. At the high-return operating point, payoff feedback reinforced the learning-driven decline in trust. Stronger drive and longer horizons deepened this negative effect. Compared with a fixed-payoff trust game, environmental feedback carries past collective outcomes into future payoffs and observed states.", "url": "https://arxiv.org/abs/2609.24493", "type": "理论", "summary": "1. 该工作将固定角色、两群体的层级信任博弈与中心化内生环境耦合，并用异质表格Q学习智能体模拟N人信任动态。\n2. 卖点在于用相同学习状态初始化基线/反馈分支以隔离历史学习，发现反馈在感知层级边界促进信任、在高回报点强化信任下滑。\n3. 这暗示内生环境会把过去集体结果带入未来收益和观测状态，故信任治理需关注收益强度、学习视界与感知边界的耦合。", "summary_source": "deepseek", "authors": [{"name": "Ruqiang Guo"}, {"name": "Zhaoyi Hu"}, {"name": "Fangfang Wang"}, {"name": "Linjie Liu"}], "featured_authors": [{"name": "Ruqiang Guo"}, {"name": "Zhaoyi Hu"}, {"name": "Fangfang Wang"}, {"name": "Linjie Liu"}], "author_count": 4}, {"id": "2609.24506", "category": "math-ph", "title": "Proactive Incentive Regulation in Multi-Agent Systems with Environmental Feedback", "abstract": "In environmental feedback systems, self-interested behaviors of rational agents often undermine cooperation and environmental sustainability. Although punitive incentive mechanisms are widely recognized as effective in addressing such social dilemmas, the timing of their implementation under different environmental conditions remains insufficiently understood. In this paper, we develop a multi-agent environmental feedback game framework with coupled incentive intensities across resource states. We investigate how system dynamics vary with incentive intensity under both resource-abundant and resource-scarce conditions. Theoretical analysis shows that imposing penalties in resource-abundant states can transform the system from a tragedy of the commons into a bistable regime that supports full cooperation. In contrast, imposing penalties in resource-scarce states leads to complex dynamical behaviors, including interior stability, heteroclinic cycles, and Hopf bifurcations, which hinder the emergence of stable cooperation. These results highlight the importance of timing in incentive regulation. Proactive intervention under favorable environmental conditions is more effective in sustaining cooperation than delayed enforcement after environmental degradation.", "url": "https://arxiv.org/abs/2609.24506", "type": "理论", "summary": "1. 该工作构建了一个资源状态与激励强度耦合的多智能体环境反馈博弈框架，比较资源充裕和稀缺条件下惩罚强度对系统动力学的影响。\n2. 理论分析表明，资源充裕时施加惩罚可将公地悲剧转变为支持完全合作的双稳态；资源稀缺时惩罚则导致内部稳定性、异宿环和霍普夫分岔等复杂动力学，抑制稳定合作的出现。\n3. 结果凸显激励监管时机的重要性：在环境尚好时主动干预比环境退化后延迟执法更能维持合作，为环境反馈系统中的合作治理提供启示。", "summary_source": "deepseek", "authors": [{"name": "Xinyang Cao"}, {"name": "Shijia Hua"}, {"name": "Linjie Liu"}], "featured_authors": [{"name": "Xinyang Cao"}, {"name": "Shijia Hua"}, {"name": "Linjie Liu"}], "author_count": 3}, {"id": "2609.24781", "category": "math-ph", "title": "Batalin-Vilkovisky algebras from Ševera bicomplexes", "abstract": "A Ševera bicomplex is a bicomplex $(M,d_{0},d_{1})$ whose differentials $d_{i}$ are Grothendieck differential operators of order $\\leq i$ with respect to a given $A$-module structure on $M$, where $A$ is a graded commutative algebra. One also requires that $(M,d_{0})$ admits a contracting homotopy $K$ that is a differential operator of the same order as $d_{0}$. Under suitable assumptions, the differential $d_{2}$ of the second page of the spectral sequence associated with $(M,d_{0},d_{1})$ is a Batalin-Vilkovisky operator on $E_{2}$, so that when $E_{2}$ is a free rank 1 $A$-module, the graded commutative algebra structure of $A$ is enhanced to a Gerstenhaber algebra structure, and the choice of a $d_{2}$-closed basis element for $E_{2}$ further enhances this to a Batalin-Vilkovisky algebra structure. The prototypical example of this construction is Ševera's description of the Batalin--Vilkovisky algebra structure on the algebra of smooth functions of an odd symplectic manifold. Throughout the whole article we look at Batalin-Vilkovisky algebras through the lenses of Cartan calculus. Indications of a generalization to derived Cartan calculus are briefly discussed in the concluding section.", "url": "https://arxiv.org/abs/2609.24781", "type": "理论", "summary": "1. 该文在适当假设下由Ševera双复形及其收缩同伦出发，在谱序列第二页E2上构造Batalin–Vilkovisky算子并得到相应BV代数结构。\n2. 关键机制是d2在适当假设下成为E2上的BV算子；E2为自由秩1 A模且取d2闭基元时，A的交换代数结构被提升为Gerstenhaber和BV代数。\n3. 该框架以Cartan calculus统一审视BV代数，以奇辛流形光滑函数代数为原型，并暗示向导出Cartan calculus的推广。", "summary_source": "deepseek", "authors": [{"name": "Eugenia Boffo"}, {"name": "Domenico Fiorenza"}], "featured_authors": [{"name": "Eugenia Boffo"}, {"name": "Domenico Fiorenza"}], "author_count": 2}, {"id": "2609.24888", "category": "math-ph", "title": "Constraints for Physical Gauge Groups Coming from the Causal Action Principle", "abstract": "The constraints for the effective local gauge groups stemming from the causal action principle for causal fermion systems are reviewed. The constraint which are quadratic in the gauge potentials (coming from the so-called bilinear logarithmic terms) are shown to make a connection between the structures of Lie algebras and Clifford algebras. This connection is worked out systematically starting from general chiral potentials corresponding to the gauge group $\\mathrm{U}(N) \\times \\mathrm{U}(N)$. The general results are illustrated in various examples.", "url": "https://arxiv.org/abs/2609.24888", "type": "理论", "summary": "1. 该工作回顾并系统分析了因果作用原理对因果费米子系统有效局域规范群所施加的约束。\n2. 其核心卖点是：源于双线性对数项的规范势二次约束建立了李代数与克利福德代数结构之间的对应，并从一般手征势（对应U(N)×U(N)）出发系统推导该约束，且以多个例子展示其具体形式。\n3. 这为从因果作用原理出发筛选物理上允许的规范群、理解有效规范场论中李代数与克利福德代数约束的起源提供了明确线索，并提示后续可推广到更一般的规范群与手征势情形。", "summary_source": "deepseek", "authors": [{"name": "Felix Finster"}, {"name": "Niels Gresnigt"}], "featured_authors": [{"name": "Felix Finster"}, {"name": "Niels Gresnigt"}], "author_count": 2}, {"id": "2609.25000", "category": "math-ph", "title": "Don't mind the gap: Absolutely Continuous Edge Spectrum in a Mobility Gap", "abstract": "We study the edge spectrum of two-dimensional lattice Hamiltonians and magnetic Schrödinger operators in a mobility gap, an energy interval in which the bulk spectrum is potentially localized rather than necessarily absent. Under suitable localization and boundary assumptions, we prove that a constant nonzero bulk topological index implies that the entire interval belongs to the absolutely continuous spectrum of the corresponding half-space operator. The absolutely continuous spectral multiplicity is bounded below by the absolute value of the index at almost every energy in the interval. The first version of the auxiliary-space cut construction in Section 2.3 was generated using ChatGPT 6.", "url": "https://arxiv.org/abs/2609.25000", "type": "理论", "summary": "1. 该工作研究了二维格点哈密顿量与磁薛定谔算符在迁移率隙中的边缘谱，并在适当的局域化与边界假设下，建立体拓扑指数与相应半空间算符谱之间的严格联系。\n2. 其关键结论是：常数非零体拓扑指数迫使整个迁移率隙进入半空间算符的绝对连续谱，且绝对连续谱重数在几乎每个能量点不低于该指数的绝对值。\n3. 该结果说明迁移率隙中的非平凡体拓扑必然伴随绝对连续而非局域的边缘谱，并为无序拓扑体系中边缘态的稳定性提供谱理论判据。", "summary_source": "deepseek", "authors": [{"name": "Simon Becker"}, {"name": "Mengxuan Yang"}], "featured_authors": [{"name": "Simon Becker"}, {"name": "Mengxuan Yang"}], "author_count": 2}, {"id": "2609.22159", "category": "quant-ph", "title": "The Limit and Its Ground. QBism, Scientific Realism, and the Born Rule", "abstract": "QBists insist that theirs is a realist position while denying that the quantum formalism represents a mind-independent world. The insistence is hard to place. The realism debate is throughout a dispute about represented content, so a theory that denies standing in the representation relation appears not to take up a position within that debate at all. This paper examines the most developed attempt to make good on the QBist claim--David Glick's perspectival normative realism--and argues that it fails instructively. Glick seeks the ground of the Born rule's objectivity among states of affairs and construes an agent's perspective as a location within an already-constituted world; finding no state of affairs fit to bind every agent at once, he must book the ground as brute. Phenomenology supplies the third thing his picture lacks. A horizon is not a position within the world but the condition under which a world is given. Read as an agent's weighting--her curvature--of such a horizon, the quantum state is neither a defective description nor a brute posit, and the Born rule articulates the invariant lawfulness by which any sense confers a curvature at all.", "url": "https://arxiv.org/abs/2609.22159", "type": "理论", "summary": "1. 该文考察Glick的\"视角规范实在论\"这一为QBism实在论主张辩护的最成熟方案，论证其失败具有教益，并引入现象学的\"视域\"补足其缺失的第三项。\n2. 卖点在于将量子态解读为能动者对视域（世界被给予的条件而非世界内位置）的加权即曲率，从而既非缺陷描述亦非粗暴设定，玻恩规则表达意义赋予的不变规律性。\n3. 这一解读为QBism的实在论承诺提供了免于粗暴设定的辩护，并提示实在论争论应转向意义赋予的可能性条件而非被表象的内容。", "summary_source": "deepseek", "authors": [{"name": "Harald A Wiltsche"}], "featured_authors": [{"name": "Harald A Wiltsche"}], "author_count": 1}, {"id": "2609.22176", "category": "quant-ph", "title": "Every architecture of six two-qubit gates is locally universal on three qubits", "abstract": "We present the \\emph{first} analytical determination of the exact accessible dimension for every fixed architecture of arbitrary two-qubit gates on three qubits. A support word represents which pair of qubits each two-qubit gate acts on, and its reduced length is obtained by merging consecutive gates on the same pair. If the reduced length is $r$, then the set of implementable three-qubit unitaries has accessible dimension $d(w)=\\min\\{63,9r+9\\}$. Consequently, six arbitrary two-qubit gates are \\emph{necessary and sufficient for local universality}: every fixed architecture reaches a nonempty open subset of $\\mathrm{SU}(8)$ when its reduced length is at least six. The result is stronger than existence of one favorable architecture. Every reduced six-slot support word is locally universal, including the alternating nearest-neighbor line $AB,BC,AB,BC,AB,BC$. The upper bound follows from a standard parameter-counting argument. The matching lower bounds are proved by Jacobian certificates in the Pauli basis. Up to qubit relabeling and reversal, there are $22$ reduced architectures of lengths two through six. For each one, a product of rational Pauli rotations yields a nonzero maximal minor modulo the prime $1{,}000{,}003$. Thus, any obstruction to global universality with six two-qubit gates must go beyond parameter counting, connectivity, and differential rank.", "url": "https://arxiv.org/abs/2609.22176", "type": "理论", "summary": "1. 该工作首次解析确定了三量子比特上任意固定两比特门架构的可达维数，并给出 d(w)=min{63,9r+9}。\n2. 其技术卖点是用参数计数上界与泡利基雅可比证书下界，证明六个两比特门对局域通用既必要又充分，且无需优选架构。\n3. 这表明六门全局通用性的阻碍不能只归于参数计数、连通性或微分秩，后续需寻找更深层代数几何约束。", "summary_source": "deepseek", "authors": [{"name": "Hyunho Cha"}, {"name": "Jungwoo Lee"}], "featured_authors": [{"name": "Hyunho Cha"}, {"name": "Jungwoo Lee"}], "author_count": 2}, {"id": "2609.22189", "category": "quant-ph", "title": "Physics-Informed Classical and Quantum Neural Networks for One-Dimensional Schrodinger Eigenvalue Problems", "abstract": "The Schrodinger equation in one spatial dimension admits a small set of exactly solvable potentials that serve as natural proving grounds for any new eigenvalue solver. We formulate Physics-Informed Neural Networks (PINNs) and Physics-Informed Quantum Neural Networks (PIQNNs) for the time-independent Schrodinger equation and apply them to three of these benchmarks: the harmonic oscillator, the infinite square well, and the finite square well. In each case a composite loss encodes the differential-equation residual, the normalization condition, the boundary behavior, and the orthogonality between eigenstates, so that the trial wave function is driven toward a genuine eigenfunction without supervised data. The eigenvalues and wave functions returned by both methods are compared against the exact spectra and against three classical references: the matrix Numerov method, the finite difference method, and the shooting method. For the smooth oscillator the two neural solvers reproduce the lowest four eigenvalues to parts per million, while for the square wells they recover the analytic levels with comparable fidelity even where the potential is discontinuous. The quantum circuit, built as a layered angle-embedding ansatz with strongly entangling blocks, converges more reliably than its classical counterpart on the higher excited states, where the loss landscape of the classical network becomes harder to navigate.", "url": "https://arxiv.org/abs/2609.22189", "type": "理论+数值", "summary": "1. 该工作将物理信息神经网络与物理信息量子神经网络用于一维定态薛定谔方程本征值问题，并在谐振子、无限深方势阱和有限深方势阱三个可解析基准上求解本征值与波函数。\n2. 其核心是将方程残差、归一化、边界行为和本征态正交性组合成无监督复合损失，并发现分层角度嵌入拟设与强纠缠块的量子线路在高激发态上比经典网络收敛更稳定。\n3. 这表明在经典损失景观难以导航时，量子神经网络可为无监督本征求解提供更可靠路径，并为势场不连续情形下的谱计算与量子算法交叉研究提供启发。", "summary_source": "deepseek", "authors": [{"name": "Tariq Mahmood"}, {"name": "Waqas Arshad"}, {"name": "Bilal Naseer"}, {"name": "Alfredo Raya"}], "featured_authors": [{"name": "Tariq Mahmood"}, {"name": "Waqas Arshad"}, {"name": "Bilal Naseer"}, {"name": "Alfredo Raya"}], "author_count": 4}, {"id": "2609.22190", "category": "quant-ph", "title": "Non-Markovian Quantum Decay in Complex Environments: A Hyperstatistical Approach", "abstract": "The exponential decay of an unstable quantum state, as described by standard Markovian theories such as Fermi's Golden Rule, assumes a simple, structureless environment. However, in complex environments characterized by disorder, long-range interactions, or strong fluctuations, local decay rates fluctuate, leading to non-Markovian dynamics and power-law ``long-time tails.'' In this paper, we apply the recently proposed \\textit{hyperstatistics} framework to solve the problem of quantum decay in such complex environments. By considering a $\\gamma$-distribution of local decay rates across mesoscopic domains, we derive a macroscopic survival probability governed by a $q$-exponential function. We then use the $q$-generalized Gamma function, defined via the Mellin transform of the $q$-exponential, to calculate the moments of the decay-time distribution. We show that the mean quantum lifetime is finite for $q<2$. The convergence of the second moment instead requires the stricter condition $q<3/2$. For $1<q<3/2$ both the mean lifetime and its variance are finite, for $3/2\\le q<2$ the mean lifetime remains finite but lifetime fluctuations become infinitely broad, and for $q\\ge2$ the mean lifetime itself diverges. This result provides a physical interpretation linking extreme environmental complexity to Anderson localization and Griffiths-like phases.", "url": "https://arxiv.org/abs/2609.22190", "type": "理论", "summary": "1. 该工作将超统计框架用于复杂环境中的非马尔可夫量子衰变，通过介观区域局部衰变率的伽马分布推导出由q指数函数支配的宏观存活概率，并用q广义伽马函数的梅林变换计算衰变时间分布的矩。\n2. 其核心结果是给出矩收敛的q阈值：平均量子寿命在q<2时有限，二阶矩需q<3/2；当1<q<3/2时均值与方差均有限，3/2≤q<2时均值有限但寿命涨落无限宽，q≥2时均值本身发散。\n3. 该结果将极端环境复杂性同安德森局域化及格里菲斯型相联系起来，为无序、长程相互作用或强涨落体系中的非马尔可夫衰变提供可检验的物理图像。", "summary_source": "deepseek", "authors": [{"name": "Nicola Fabiano"}], "featured_authors": [{"name": "Nicola Fabiano"}], "author_count": 1}, {"id": "2609.22445", "category": "quant-ph", "title": "A Near-Optimal Joint Lower Bound for Sparse Quantum Linear System Solvers", "abstract": "Quantum linear system solvers form one of the central algorithmic primitives in quantum computing, with applications ranging from differential equations and optimization to machine learning. Their cost is commonly measured through query complexity, which counts the number of oracle calls needed to access the input matrix. In the sparse-access model, this complexity is governed by three parameters: the condition number $\\kappa$, the sparsity $s$ of the input matrix, and the target precision $\\varepsilon$. The dependence on $\\kappa$ and $\\varepsilon$ is already well understood through the lower bound $\\Omega(\\kappa\\log(1/\\varepsilon))$, which matches the best known scaling in these parameters. Once the sparsity $s$ is included, however, the expected lower bound has long been conjectured to be $\\Omega(\\kappa\\sqrt{s}\\log(1/\\varepsilon))$. Recent work by Mori et al. [Quantum Sci. Tech. 11 035063 (2026)] made an important step towards this goal by establishing the lower bound $\\Omega(\\kappa\\sqrt{s})$ for constant error $\\varepsilon$. In this work, we complete the picture and prove the full joint lower bound $\\Omega(\\kappa\\sqrt{s}\\log(1/\\varepsilon))$ in the sparse-access model, thereby establishing the anticipated dependence on all three parameters simultaneously.", "url": "https://arxiv.org/abs/2609.22445", "type": "理论+数值", "summary": "1. 本文在稀疏访问模型下证明了量子线性系统求解器关于条件数κ、稀疏度s和目标精度ε的联合查询复杂度下界Ω(κ√s log(1/ε))。\n2. 其技术卖点在于将先前仅对常数误差成立的Ω(κ√s)与关于κ和ε的Ω(κ log(1/ε))统一为三参数同时有效的完整下界，验证了长期猜想的近最优标度。\n3. 这为稀疏访问模型下的量子线性系统求解器提供了近最优基准，表明在现有模型内对κ、s、ε的联合依赖已基本确定，后续提升需考虑额外结构或不同访问模型。", "summary_source": "deepseek", "authors": [{"name": "Dhrumil Patel"}], "featured_authors": [{"name": "Dhrumil Patel"}], "author_count": 1}, {"id": "2609.22673", "category": "quant-ph", "title": "Collective Chirped STIRAP in a Pair of Three-Level Atoms: Dressed-Manifold Dynamics and Compensation of the Rydberg-Rydberg Interaction-Induced Detuning", "abstract": "We investigate collective chirped stimulated Raman adiabatic passage (STIRAP) in a pair of identical three-level atoms using a
