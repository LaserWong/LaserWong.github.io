ectly, without solving a coupled system of nonlinear differential equations. Applying this result to the bosonic gain-loss Lindblad equation, we obtain the exact dynamical map for arbitrary time-dependent gain and loss rates. The gain-loss master equation provides a canonical description of a driven harmonic oscillator coupled to a thermal bath. We benchmark the construction by deriving the time evolution of the Wigner function of an initial Fock state and comparing it with independent phase-space results. We further apply the resulting dynamical map to evaluate the code-space survival probability of a binomial bosonic code under driven gain-loss dynamics.", "url": "https://arxiv.org/abs/2609.24617", "type": "理论+数值", "summary": "1. 该工作推导了含时主方程生成元为 α(t)A+β(t)B 时，时间顺序与反时间顺序传播子的显式闭合因子化。\n2. 其关键技术是当 [A,B] 为 A、B 伴随作用的共同特征算符，即满足 [A,[A,B]]=λ_A[A,B]、[B,[A,B]]=λ_B[A,B] 时，可直接确定因子化系数，无需解魏-诺曼分解中的非线性耦合微分方程组。\n3. 该结果应用于玻色增益-损耗林德布拉德方程，获得任意时变增益与损耗率下的精确动力学映射，并为福克态维格纳函数演化和二项式玻色码码空间存活概率提供可解析评估。", "summary_source": "deepseek", "authors": [{"name": "Léonce Dupays"}], "featured_authors": [{"name": "Léonce Dupays"}], "author_count": 1}, {"id": "2609.24636", "category": "quant-ph", "title": "Phase space anatomy of dynamical quantum phase transitions", "abstract": "Dynamical quantum phase transitions (DQPT) are commonly defined either by the behavior of a late-time order parameter or by nonanalyticities in a quantum state's return rate. We show that discrete phase space fundamentally separates these two notions by the scale of information they require. An order parameter transition is determined by a local reduced state, requiring no quasiprobability negativity. In contrast, general global returns can contain information absent from every proper reduced state. For stabilizer returns, we derive an exact decomposition of the rate into distinct costs from loss of support and destructive quantum interference. Dynamics of a qutrit Potts chain show that selective cancellation can reverse the ranking of competing block returns and delay their exchange. An exact control also exhibits a thermodynamic return cusp with zero negativity at the crossing. The existence of a return singularity and the role of interference in selecting its branches are therefore distinct physical questions.", "url": "https://arxiv.org/abs/2609.24636", "type": "理论", "summary": "1. 该工作从离散相空间剖析动力学量子相变，区分了序参量转变与回归率非解析性这两种常见判据。\n2. 其核心论点是：序参量转变由局域约化态决定且无需准概率负性，而全局回归可携带所有真约化态缺失的信息；对稳定子回归，回归率被精确分解为支撑损失与破坏性干涉两类代价。\n3. 三能级波茨链显示选择性相消可逆转竞争块回归的排序并延迟其交换，精确控制还给出交叉处零负性的热力学回归尖点；因此回归奇异性的存在与干涉对分支的选择是不同物理问题。", "summary_source": "deepseek", "authors": [{"name": "Zakaria Mzaouali"}], "featured_authors": [{"name": "Zakaria Mzaouali"}], "author_count": 1}, {"id": "2609.24670", "category": "quant-ph", "title": "Wigner-positive quantum states can have lower entropy than the vacuum", "abstract": "The Wigner entropy conjecture posits that pure Gaussian states minimize the Shannon entropy of non-negative Wigner functions, known as the Wigner entropy. We show that mixing a specific pure Wigner-negative state with another suitably chosen quantum state can restore Wigner positivity while retaining a Wigner entropy that is slightly - but strictly - below the vacuum entropy. As a consequence, we disprove the Wigner entropy conjecture, as well as the stronger Wigner majorization conjecture, by deriving simple analytical counterexamples with violations of the entropy bound no larger than $10^{-3}$. Such states with sub-vacuum Wigner entropy can be found arbitrarily close to the vacuum and can also exhibit sub-vacuum Wigner-Rényi $\\alpha$-entropy for $0<\\alpha<2$. We identify the physical mechanism behind the existence of such states, which arises from a subtle interplay between the uncertainty principle and non-Gaussianity. The key idea of this paper was developed with the help of AI tools, building on the characterization of extreme non-negative Wigner functions.", "url": "https://arxiv.org/abs/2609.24670", "type": "理论", "summary": "1. 该工作通过混合特定纯Wigner负态与恰当量子态，构造出Wigner正性但Wigner熵严格略低于真空的态，并以解析反例否证Wigner熵猜想及更强的Wigner主序化猜想。\n2. 其关键卖点在于熵违反不超过0.001、态可任意接近真空，且对0<α<2呈现亚真空Wigner-Rényi α-熵；机制源自不确定性原理与非高斯性的微妙相互作用。\n3. 这揭示非负Wigner函数不一定受真空熵下界约束，暗示非高斯性可突破高斯极值图像，并为修正相关猜想及研究量子信息中的非高斯效应提供启发。", "summary_source": "deepseek", "authors": [{"name": "Zacharie Van Herstraeten"}, {"name": "Nicolas J. Cerf"}, {"name": "Ulysse Chabaud"}], "featured_authors": [{"name": "Zacharie Van Herstraeten"}, {"name": "Nicolas J. Cerf"}, {"name": "Ulysse Chabaud"}], "author_count": 3}, {"id": "2609.24680", "category": "quant-ph", "title": "Unified spatiotemporal quantum states and spatiotemporal entanglement from Kirkwood-Dirac phase space", "abstract": "The notion of a spatiotemporal quantum state extends the conventional concept of a spatial quantum state to the spatiotemporal domain. Such states are represented by unit-trace operators that encode correlations among quantum events distributed across space and time. In this work, we use the spatiotemporal Kirkwood-Dirac phase space to provide a unified characterization of spatiotemporal quantum states. Spatiotemporal states obtained from Kirkwood-Dirac distributions are generally non-Hermitian and nonnormal; whereas those constructed from Margenau-Hill distributions are Hermitian. We provide a unification via (quasi)probabilistic mixture of Kirkwwod-Dirac spatiotemporal states which encompasses almost all existing formulations of spatiotemporal quantum states. We derive recursive expressions for spatiotemporal states and elucidate the relation between Kirkwood-Dirac nonclassicality and the temporality of spatiotemporal states. We further extend the construction to many-fold correlation functions and establish its connection with out-of-time-ordered correlators (OTOCs). We also develop a more general unifying framework based on (quasi)probabilistic mixture of $s$-parametrized spatiotemporal states and establish their Petz time reversal and application in studying Kubo-Martin-Schwinger (KMS) condition in two-time setting. Finally, we apply this framework to characterize quantum entanglement in spacetime and analyze spatiotemporal entanglement using several complementary entropy measures.", "url": "https://arxiv.org/abs/2609.24680", "type": "理论", "summary": "1. 该工作基于时空Kirkwood-Dirac相空间统一刻画时空量子态，并推广至多重关联、OTOC与s参数化框架。\n2. 其关键卖点是表明KD时空态一般非厄米非正规，而Margenau-Hill态厄米，并用(准)概率混合统一现有表述、联系KD非经典性与时间性。\n3. 这为时空纠缠、OTOC、KMS条件及s参数化时间反演提供统一路径，并启发用互补熵度量刻画时空量子关联。", "summary_source": "deepseek", "authors": [{"name": "Zhian Jia"}, {"name": "Mei-Hui Xiao"}], "featured_authors": [{"name": "Zhian Jia"}, {"name": "Mei-Hui Xiao"}], "author_count": 2}, {"id": "2609.24933", "category": "quant-ph", "title": "A thermal microwave bus for neutral atom quantum computing", "abstract": "High-fidelity two-qubit gates in neutral-atom arrays rely on the Rydberg blockade, which is intrinsically short ranged and requires long range connectivity to be achieved through atom shuttling. We propose a four level architecture, where the typical ground state qubit can be leveraged for its long lifetime and the Rydberg states couple to a microwave cavity, allowing for long range cavity mediated gates. We first find the thermal dependence of two established protocols, the dispersive iSWAP native to the Tavis-Cummings model and the Controlled phase gate generated from driving the cavity. We simulate them under the presence of Rydberg decay, thermal photons, finite cavity linewidth and find fidelities which accompany closed form bounds. We then introduce the bichromatic Raman gate, which only virtually populates the Rydberg states and cancels dispersive shifts to mitigate both atomic and cavity decay, achieving a fidelity of $F = 0.997$. Finally, we consider a full optical tweezer array in a microwave cavity, and show that using a cavity mediated gate to close the periodic boundaries of the toric code shortens an error correction round by a factor of 2.3 for realistic array sizes. This was then applied to the wider family of Bivariate bicycle codes, and we find that it shortens a round of the gross code by a factor of 4.8.", "url": "https://arxiv.org/abs/2609.24933", "type": "理论", "summary": "1. 该工作提出四能级架构：长寿命基态比特与耦合微波腔的里德伯态结合，实现腔介导长程两比特门，并评估色散 iSWAP 与受控相位门的热依赖。\n2. 其核心是双色拉曼门，仅虚占据里德伯态并抵消色散位移，从而抑制原子与腔衰减，在热光子与有限线宽下达到 F=0.997。\n3. 在光镊阵列中，腔介导门闭合环面码边界使纠错轮缩短 2.3 倍，用于二元自行车码族时 gross 码缩短 4.8 倍，表明该总线可加速中性原子量子纠错。", "summary_source": "deepseek", "authors": [{"name": "Matthew J.H. Kendall"}, {"name": "Christopher J. Watson"}, {"name": "Michael Ben Shem"}, {"name": "Jonathan D. Breeze"}], "featured_authors": [{"name": "Matthew J.H. Kendall"}, {"name": "Christopher J. Watson"}, {"name": "Michael Ben Shem"}, {"name": "Jonathan D. Breeze"}], "author_count": 4}, {"id": "2609.24953", "category": "quant-ph", "title": "Tight entropy contraction beyond detailed balance", "abstract": "We establish quantitative entropy contraction bounds for finite-dimensional quantum channels beyond detailed balance. For channels compatible with a faithful conditional expectation, we show that GNS (Gelfand--Naimark--Segal) norm contraction yields relative entropy contraction with only a logarithmic loss in the dimensional constant. For quantum Markov semigroups with a faithful asymptotic conditional expectation, this gives a lower bound on the complete modified logarithmic Sobolev constant in terms of the GNS spectral gap. The bounds allow initial entanglement with an external environment and are independent of its system size. Applications to alternating reservoir pulses and continuously coupled energy ladders give bounds with optimal size dependence.", "url": "https://arxiv.org/abs/2609.24953", "type": "理论", "summary": "1. 该工作在无需细致平衡假设的条件下，为有限维量子信道建立了相对熵收缩的定量界，并将其推广至具有忠实渐近条件期望的量子马尔可夫半群。\n2. 核心卖点是用GNS范数收缩推出相对熵收缩且维度常数仅付对数代价，并以GNS谱隙给出完全修正对数Sobolev常数的下界，同时允许初始系统与环境纠缠而界不随环境尺寸增长。\n3. 这为交替热库脉冲和连续耦合能级梯等模型给出了尺寸依赖最优的估计，并表明超越细致平衡时谱方法仍可约束量子马尔可夫半群的混合与热化行为。", "summary_source": "deepseek", "authors": [{"name": "Li Gao"}, {"name": "Jingyu Guo"}], "featured_authors": [{"name": "Li Gao"}, {"name": "Jingyu Guo"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
