orrelation time and averaging-window scale vanishes, rapidly fluctuating corrections disappear and the effective dynamics converges to a deterministic macroscopic transport equation. We show that the emergent macroscopic dynamics has the exact Gorini-Kossakowski-Sudarshan-Lindblad (GKSL) form: coherent Hamiltonian evolution arises from deterministic subquantum flow, while dissipative channels emerge from quadratic noise correlations. The framework further demonstrates how non-separable interaction Hamiltonians can arise from strictly local, state-dependent stochastic feedback fields. In the fluctuation-free limit, the model reduces naturally to the standard von Neumann equation, providing a unified stochastic foundation for both open and closed quantum dynamics.", "url": "https://arxiv.org/abs/2605.29508", "type": "理论", "summary": "1. 该工作发展了双协方差随机框架的相互作用推广，从子系统希尔伯特空间上的局域随机微分方程出发，利用多尺度伊藤演算和滑动窗口平均推导出粗粒化双协方差算子的封闭演化方程。\n2. 其核心在于明确分离快微观涨落与慢宏观观测时间标度，并在流体力学极限下证明有效动力学精确收敛为GKSL形式，其中相干演化源自确定性亚量子流，耗散通道源于二次噪声关联。\n3. 这为开放与封闭量子动力学提供了统一的随机基础，同时展示了严格局域的、态依赖的随机反馈场如何自然产生不可分离相互作用哈密顿量。", "summary_source": "deepseek", "authors": [{"name": "Andrei Khrennikov"}], "featured_authors": [{"name": "Andrei Khrennikov"}], "author_count": 1}, {"id": "2605.29521", "category": "quant-ph", "title": "Ground-state estimation of the Heisenberg model on frustrated lattices with Sample-based Krylov Quantum Diagonalization", "abstract": "Quantum spin simulations of frustrated lattices remain challenging for both classical and quantum algorithms, particularly in parameter regimes relevant to quantum spin liquid (QSL) phases. In this work, we apply Sample-based Krylov Quantum Diagonalization (SKQD) to estimate the ground state of the antiferromagnetic XXZ Heisenberg model on the $J_1$--$J_2$ square lattice, the Kagome lattice, and a 1D chain, studying system sizes from 12 to 72 spins. In our application of SKQD, we identify a ZZ deformation of $\\Delta=2$ as a sufficiently sparse Hamiltonian and introduce two modifications to the SKQD framework tailored to spin models: a canonical bitstring compression scheme that preserves the effectiveness of configuration recovery under spin-flip degeneracy, and the use of multiple Krylov subspaces to improve ground state coverage without any increase in quantum resources. For the 1D chain and Kagome lattice, SKQD achieves sub-percent ground-state energy errors at system sizes up to 24 spins, including a relative error of $0.002\\%$ on the 12-site Kagome lattice, surpassing the best prior VQE result of $0.01\\%$ on the same system while requiring no variational optimization. SKQD further extends to system sizes well beyond the reach of prior quantum algorithm studies, reaching 72 spins across all three geometries. Beyond 24 spins, accuracy degrades to relative errors of $19\\%$--$36\\%$ at 72 sites, but the gradual scaling of error with system size suggests these limits are set by available shot budgets and circuit depth rather than fundamental algorithmic constraints. Although classical tensor network methods remain state-of-the-art for these models, this work establishes a new benchmark for quantum simulation of the frustrated Heisenberg model and demonstrates SKQD as a scalable, hardware-compatible approach for studying strongly correlated spin systems.", "url": "https://arxiv.org/abs/2605.29521", "type": "理论+数值", "summary": "1. 该工作应用基于采样的Krylov量子对角化方法，对J1-J2正方、Kagome及一维链上的反铁磁XXZ海森堡模型进行基态估计，系统尺寸达12至72自旋。\n2. 技术核心在于采用Δ=2的ZZ稀疏化哈密顿量，并引入典型比特串压缩与多Krylov子空间修正，无需变分优化即在24自旋内实现亚百分误差，12位Kagome格点相对误差0.002%。\n3. 误差随系统尺寸平缓增长，表明当前精度受限于采样预算与电路深度而非算法本质，为可扩展的量子模拟受挫自旋系统建立了新基准。", "summary_source": "deepseek", "authors": [{"name": "Calvin Brooks"}, {"name": "Henry Zou"}, {"name": "Trevor David Rhone"}], "featured_authors": [{"name": "Calvin Brooks"}, {"name": "Henry Zou"}, {"name": "Trevor David Rhone"}], "author_count": 3}, {"id": "2605.29557", "category": "quant-ph", "title": "Quantum Subliminal Learning", "abstract": "Machine learning models can inherit hidden behavioral traits through innocuous public interfaces, a phenomenon known as subliminal learning. Here we extend this framework to quantum models and study two distillation pathways: an auxiliary channel on random inputs and a restricted task channel in which the student matches a public supervised output while the hidden behavior resides on a disjoint task. Both classical and quantum neural networks (QNNs) exhibit efficient auxiliary-channel subliminal learning, but the task channel shows strong architecture dependence. Classical neural networks transmit little hidden-task information through the public-task interface, whereas QNNs retain most of the hidden-task signal. We show that a unified geometric picture explains both regimes: transmission is controlled by the teacher drift magnitude together with the fraction of hidden-task-relevant drift that remains visible through the public interface. These results identify a concrete security concern for quantum model supply chains and suggest a controlled route for hidden-information transfer in quantum information processing.", "url": "https://arxiv.org/abs/2605.29557", "type": "理论+数值", "summary": "1. 该工作将机器学习中的潜意识学习现象拓展至量子模型，系统研究了辅助通道与受限任务通道两种蒸馏路径下隐藏行为特征的传递规律。\n2. 其核心物理发现是量子神经网络在任务通道中高效保留大部分隐藏信号而经典网络几乎无传递，该架构依赖性由教师漂移幅度与公共界面可见的隐藏相关漂移比例构成的统一几何图景精确解释。\n3. 这直接揭示了量子模型供应链中特有的安全风险，并为量子信息处理中通过控制几何参数实现隐蔽信息转移提供了理论路径。", "summary_source": "deepseek", "authors": [{"name": "Shi-Xin Zhang"}, {"name": "Yu-Qin Chen"}], "featured_authors": [{"name": "Shi-Xin Zhang"}, {"name": "Yu-Qin Chen"}], "author_count": 2}, {"id": "2605.29609", "category": "quant-ph", "title": "Engineering recoil heating in coherent-scattering levitated optomechanics", "abstract": "Recoil heating from photon scattering is a fundamental source of decoherence in optical trapping, severely limiting the preparation of nonclassical motional states. In cavity setups in the coherent scattering configuration, a predictive theory of recoil heating rate is missing, as usual perturbative approaches fail in the presence of sharp optical resonances. Hence, current works assume that the recoil heating rate is approximately equal to its free-space value. Here we show that this is not the case, as the electromagnetic environment can strongly modify recoil heating rate by the Purcell effect. Specifically, we predict that this rate can be significantly suppressed in state-of-the-art microcavities, for both center-of-mass and librational motion. To establish these results, we develop a general theoretical framework based on macroscopic quantum electrodynamics and on the few-mode quantization approach developed in nanophotonics. Our method applies to particles trapped in the presence of arbitrary electromagnetic structures, thus providing a route to engineering motional decoherence in levitated optomechanics by photonic structure design.", "url": "https://arxiv.org/abs/2605.29609", "type": "理论", "summary": "1. 该工作建立了基于宏观量子电动力学和纳米光子学少模量子化的理论框架，系统计算了相干散射光阱中反冲加热率。\n2. 核心物理在于揭示了电磁环境可通过Purcell效应显著改变反冲加热率，并预测在微腔中对质心和转动运动均可实现抑制。\n3. 这为通过光子结构设计定向调控光悬浮系统的运动退相干提供了理论途径，适用于任意电磁环境中的粒子。", "summary_source": "deepseek", "authors": [{"name": "Maksim Lednev"}, {"name": "Uroš Delić"}, {"name": "Johannes Feist"}, {"name": "Carlos Gonzalez-Ballestero"}], "featured_authors": [{"name": "Maksim Lednev"}, {"name": "Uroš Delić"}, {"name": "Johannes Feist"}, {"name": "Carlos Gonzalez-Ballestero"}], "author_count": 4}, {"id": "2605.29694", "category": "quant-ph", "title": "Tripartite Interactions Induced Strongly Correlated Quantum Emissions", "abstract": "Efficient generation of multiquanta emission is crucial for quantum information processing but remains challenging due to its typical reliance on higher-order quantum processes. Here, we theoretically demonstrate strongly correlated photon-phonon emission enabled by direct tripartite interaction. This interaction facilitates the formation of high-order multiquanta states without more intermediate state transitions, thereby avoiding the suppressed transition rates associated with multiple sequential processes and substantially improving resonant transitions. As a result, high-efficiency strongly correlated even-quanta emission (e.g., two photons and two phonons) can be achieved in the presences of dissipation. Beyond that, we show that introducing two-photon dissipation enables strongly correlated odd-quanta emission (e.g., two photons and one phonon) in the tripartite interaction system by parity-protected suppression of single-photon loss and reconstruction of higher-order multiquanta processes. Our work extends multiquanta emission into the tripartite coupling regime and holds promising potential for applications in hybrid quantum networks.", "url": "https://arxiv.org/abs/2605.29694", "type": "理论", "summary": "1. 该工作理论上展示了通过直接三体相互作用实现强关联光子-声子发射，无需中间态跃迁从而避免高阶过程导致的速率抑制。\n2. 其核心在于利用三体共振跃迁实现高效偶量子发射（如双光子双声子），并引入两光子耗散以宇称保护机制压制单光子损耗，重构高阶多量子过程以实现奇量子发射（如双光子单声子）。\n3. 这为在耗散环境中实现强关联多量子发射提供了可扩展路径，并有望推动混合量子网络中的量子信息处理应用。", "summary_source": "deepseek", "authors": [{"name": "Qian Bin"}, {"name": "Ying Wu"}, {"name": "Franco Nori"}, {"name": "Xin-You Lü"}], "featured_authors": [{"name": "Qian Bin"}, {"name": "Ying Wu"}, {"name": "Franco Nori"}, {"name": "Xin-You Lü"}], "author_count": 4}, {"id": "2605.29724", "category": "quant-ph", "title": "Bound-state-protected phase metrology for a quantum emitter in a Su-Schrieffer-Heeger bath", "abstract": "We study local phase estimation for a single quantum emitter coupled to a bosonic Su-Schrieffer-Heeger (SSH) bath within a microscopic lattice model. Dimerization opens a central gap supporting an in-gap emitter-bath bound state, which suppresses complete relaxation of the emitter coherence. A Dyson-equation analysis yields the local bath Green's function, the in-gap bound-state condition, and the emitter residue controlling the retained phase information. The phase quantum Fisher information links gap formation, detuning, and emitter-bath coupling to the post-transient metrological response. At resonance, stronger coupling enhances transient hybridization but reduces the retained signal by lowering the emitter weight in the bound state. Away from resonance, late-time averages, retention times, and useful interrogation windows track how phase-information protection weakens as the emitter is tuned toward and beyond the band edge. A uniform-chain control shows that the retained signal disappears when the gap closes. In the bulk local-coupling geometry considered here, the response is insensitive to the sign of the dimerization, so the protocol probes spectral-gap physics and bound-state support rather than the SSH winding sector.", "url": "https://arxiv.org/abs/2605.29724", "type": "理论", "summary": "1. 该工作通过微观晶格模型研究单个量子发射器与玻色子Su-Schrieffer-Heeger浴耦合的局域相位估计，并利用Dyson方程分析获得局域浴格林函数及束缚态条件。\n2. 其物理核心在于二聚化诱导的中心能隙内发射器-浴束缚态抑制了相干完全弛豫，而相位量子Fisher信息揭示能隙、失谐与耦合对后瞬态计量响应的调控机制。\n3. 该协议对二聚化符号不敏感，因此为探测能隙物理而非拓扑绕数提供了明确途径，并为基于束缚态保护的量子传感策略奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Sofia Evangelou"}], "featured_authors": [{"name": "Sofia Evangelou"}], "author_count": 1}, {"id": "2605.29725", "category": "quant-ph", "title": "Non-Perturbative Closed Form for the Typical Bipartite Mutual Information of Haar-Random States", "abstract": "The average bipartite quantum mutual information $\\langle I(A{:}B)\\rangle$ of Haar-random pure states can be expressed exactly through Page's formula in terms of digamma functions. We show that this quantity admits a single non-perturbative closed form: $\\langle I(A{:}B)\\rangle = (d_A^2-1)(d_B^2-1)\\,\\mathcal{G}(d_A,d_B,d_E)$, where $\\mathcal{G}$ is given by an explicit convergent integral over a Bose--Einstein kernel. The overall factor $(d_A^2-1)(d_B^2-1)=\\dim[\\mathfrak{su}(d_A)]\\cdot\\dim[\\mathfrak{su}(d_B)]$ is exact, not merely asymptotic. The asymptotic expansion of $\\mathcal{G}$ in $1/N$ yields a Bernoulli-factorised series whose coefficients involve $\\zeta(1{-}2k)$; this series diverges, and our integral is its exact Borel sum. The integral representation also makes $\\langle I\\rangle < (d_A^2{-}1)(d_B^2{-}1)/(2N)$ manifest via a scale-inversion symmetry of the kernel. Our derivation traces the mutual information's structure to an exact decomposition of Page's entropy into a diagonal (Dirichlet) contribution and a Schur-majorisation eigenvalue correction, whose assembly into the mutual information cleanly separates classical from quantum correlations.", "url": "https://arxiv.org/abs/2605.29725", "type": "理论", "summary": "1. 该工作导出了Haar随机纯态平均二分量子互信息的非微扰闭式，为一含Bose–Einstein核的显式收敛积分。\n2. 其核心特征在于精确因子(d_A^2−1)(d_B^2−1)不依赖渐近近似，且通过核的尺度反演对称性直接证明上界⟨I⟩ < (d_A^2−1)(d_B^2−1)/(2N)，同时渐近展开的Borel可和性由积分严格实现。\n3. 该结果将Page熵分解为对角项与Schur序修正，使经典与量子关联在结构上分离，为随机纯态互信息的解析刻画及向其他系综的推广提供了范例。", "summary_source": "deepseek", "authors": [{"name": "Zhi-Wei Wang"}, {"name": "Pei-Wen Li"}, {"name": "Samuel L. Braunstein"}], "featured_authors": [{"name": "Zhi-Wei Wang"}, {"name": "Pei-Wen Li"}, {"name": "Samuel L. Braunstein"}], "author_count": 3}, {"id": "2605.29732", "category": "quant-ph", "title": "Exact Geometric Typicality and Bipartite Entanglement from the Projected Central Limit Theorem on Hyperspheres", "abstract": "Starting from the exact Projected Central Limit Theorem on hyperspheres, we rederive the Beta distribution for subsystem occupation probabilities and Lubkin's purity formula from elementary hyperspherical moments, quantifying the finite-size ``platykurtic'' suppression of tails relative to the Gaussian approximation used in standard eigenstate-thermalization and typicality treatments. Our main new result concerns the bipartite quantum mutual information $\\langle I(A{:}B)\\rangle$ for Haar-random pure states. We show that its full asymptotic expansion in $1/N$ admits a Bernoulli-factorized form in which every order $k \\ge 1$ carries the symmetric factor $(d_A^{2k}-1)(d_B^{2k}-1)$ and all higher odd-order corrections vanish identically. Through an exact algebraic reorganization of Page's formula (conjectured in Ref.~\\cite{Page1993} and subsequently proven~\\cite{Foong1994, SanchezRuiz1995, Sen1996}), we establish that the leading finite-size correction separates into a dominant $\\mathfrak{su}(d_A) \\otimes \\mathfrak{su}(d_B)$ bipartite quantum coherence contribution $(d_A^2 - 1)(d_B^2 - 1)/(2N)$ and a subtracted classical-probability (Cartan $\\otimes$ Cartan) contribution $(d_A - 1)(d_B - 1)/(2N)$, and we trace this separation to the difference between diagonal and eigenvalue entropies via Schur's majorisation theorem, with the dimensional counts $(d-1)$ and $(d^2-1)$ acquiring meaning through the Cartan structure of the generalised Bloch decomposition. These results admit a single non-perturbative closed form: the exact typical mutual information factors as $\\langle I(A{:}B)\\rangle = (d_A^2-1)(d_B^2-1)\\,\\mathcal{G}(d_A,d_B,d_E)$, with $\\mathcal{G}$ given by an explicit Bose--Einstein integral whose asymptotic expansion in $1/N$ reproduces the Bernoulli series.", "url": "https://arxiv.org/abs/2605.29732", "type": "理论", "summary": "1. 该工作基于超球面上精确投影中心极限定理，重新导出子系统概率Beta分布及Lubin纯度公式，并给出Haar随机纯态双粒子互信息< I(A:B) >的完整1/N渐近展开。\n2. 主要技术亮点在于互信息展开呈伯努利因子化形式，所有高阶奇次修正严格为零，且通过Page公式代数重组将主导有限尺寸修正分离为su(d_A)⊗su(d_B)量子相干与Cartan⊗Cartan经典概率两部分。\n3. 这为精确刻画有限尺寸典型纠缠与热化尾巴抑制提供了非微扰闭式（Bose-Einstein积分形式），并启示量子相干与经典概率在纠缠层次上的代数分离可由Schur主要化定理统一理解。", "summary_source": "deepseek", "authors": [{"name": "Zhi-Wei Wang"}, {"name": "Pei-Wen Li"}, {"name": "Samuel L. Braunstein"}], "featured_authors": [{"name": "Zhi-Wei Wang"}, {"name": "Pei-Wen Li"}, {"name": "Samuel L. Braunstein"}], "author_count": 3}, {"id": "2605.29774", "category": "quant-ph", "title": "Quantum algorithms for density functional theory with minimal readout", "abstract": "While quantum computers have shown significant promise for electronic structure calculations, their potential to accelerate density functional theory (DFT) calculations remains unclear. In this work, we present a qubit-efficient encoding scheme for wavefunctions in Kohn--Sham (KS) DFT, together with a quantum algorithm that computes all occupied orbitals simultaneously. We further show that our algorithm is particularly well suited to the Harris functional, enabling the total energy to be evaluated with a potential exponential speedup over classical approaches by entirely avoiding the costly readout of the electronic density. In addition, we propose a second method for achieving self-consistent DFT calculations using multiple copies of the wavefunction, which likewise circumvents density readout. The applicability of our algorithms is demonstrated through several numerical examples, and their efficiency is compared with that of existing approaches.", "url": "https://arxiv.org/abs/2605.29774", "type": "理论+数值", "summary": "1. 该工作提出一种量子比特高效的Kohn-Sham轨道编码方案，结合量子算法并行计算所有占据轨道，服务于密度泛函理论。\n2. 其技术核心在于利用Harris泛函，通过完全避免电子密度读出实现总能量评估的潜在指数加速，并给出另一自洽变体。\n3. 这为量子计算克服电子结构模拟中密度读出瓶颈、加速实际材料与化学体系的第一性原理计算提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Yuansheng Zhao"}, {"name": "Hirofumi Nishi"}, {"name": "Taichi Kosugi"}, {"name": "Satoshi Hirose"}, {"name": "Hiroki Sakagami"}, {"name": "Tatsuki Oikawa"}, {"name": "Tatsuya Okayama"}, {"name": "Yu-ichiro Matsushita"}], "featured_authors": [{"name": "Yuansheng Zhao"}, {"name": "Hirofumi Nishi"}, {"name": "Taichi Kosugi"}, {"name": "Tatsuki Oikawa"}, {"name": "Tatsuya Okayama"}, {"name": "Yu-ichiro Matsushita"}], "author_count": 8}, {"id": "2605.29820", "category": "quant-ph", "title": "Adaptive Stabilizer State Fidelity Certification", "abstract": "Certifying the fidelity of a prepared state to a target stabilizer state is a fundamental task in quantum information processing. Ref. [Phys. Rev. A 99, 042337 (2019)] gave the optimal worst-case lower bound from one fixed stabilizer generator gauge, but gauge dependence can leave a large fidelity ambiguity. We develop an adaptive extension that reports the full certified fidelity interval. First, for a single gauge, we derive the complementary optimal worst-case upper bound. We then formulate gauge selection as an adaptive design problem in which each round solves exact endpoint linear programs and chooses a new gauge by a witness elimination policy. We prove monotonic tightening, exact recovery once all nontrivial stabilizers are covered, and the worst-case necessity of full coverage. Finally, we identify structured syndrome distributions for which adaptivity beats this exponential benchmark, and we numerically confirm faster concentration.", "url": "https://arxiv.org/abs/2605.29820", "type": "理论+数值", "summary": "1. 该工作提出了自适应稳定子态保真度认证协议，报告完整保真度可信区间而非仅最坏情况界。\n2. 技术核心在于通过线性规划端点求解和证人消除策略自适应选择稳定子生成元规范，严格证明单调收紧及完全覆盖的必要性。\n3. 这揭示了结构化综合征分布可超越指数基准实现更快收敛，为量子态认证提供了可适应测量的鲁棒框架。", "summary_source": "deepseek", "authors": [{"name": "Kun Wang"}], "featured_authors": [{"name": "Kun Wang"}], "author_count": 1}, {"id": "2605.29838", "category": "quant-ph", "title": "Gate Parameter Lee-Yang Zeros and Dynamical Phases in Quantum Circuits", "abstract": "We propose gate-parameter Lee-Yang zeros of Loschmidt amplitudes as probes of dynamical phases in finite quantum circuits. We illustrate this approach using a brickwork model, where the time evolution is generated by repeated application of a Floquet operator. The Loschmidt amplitude can be expressed as a rational function of the gate parameters. At fixed system size and large circuit depth, its zeros in one complexified gate parameter, with the other parameter held fixed, condense onto limiting curves. We show that these curves comprise a universal component governed by equimodular Floquet eigenvalues, as described by the Beraha-Kahane-Weiss theorem, together with state-dependent contributions controlled by the overlap of eigenstate of the Floquet operator with the initial state. As one of the parameters is varied, the set of zeros reorganizes abruptly, providing a finite-qubit diagnostic of a dynamical phase transition. This mechanism does not rely on integrability: while integrability enables an exact calculation of the Loschmidt amplitude, the condensation of zeros follows from spectral competition and local unitarity alone.", "url": "https://arxiv.org/abs/2605.29838", "type": "理论+数值", "summary": "1. 该工作将门参数化Loschmidt振幅的Lee-Yang零点作为有限量子电路中动力学相的探针。\n2. 主要卖点在于揭示了零点凝聚曲线由等模Floquet特征值（符合Beraha-Kahane-Weiss定理）与初始态重叠的态依赖贡献共同决定，并随参数变化突然重组，构成有限量子比特的动力学相变诊断。\n3. 该机制仅依赖谱竞争与局域幺正性，无需可积性，为一般幺正量子电路的动力学相研究提供了普适性工具。", "summary_source": "deepseek", "authors": [{"name": "Chang Liu"}, {"name": "Yu Wu"}, {"name": "Yunfeng Jiang"}, {"name": "Yang Zhang"}], "featured_authors": [{"name": "Chang Liu"}, {"name": "Yu Wu"}, {"name": "Yunfeng Jiang"}, {"name": "Yang Zhang"}], "author_count": 4}, {"id": "2605.29883", "category": "quant-ph", "title": "Dynamical Casimir photons from rotation of a nonspherical particle", "abstract": "We consider a non-spherical neutral particle spinning in free space and interacting with the electromagnetic quantum vacuum. When the rotation axis is orthogonal to the particle symmetry axis, the scattered field develops frequency sidebands that induce the parametric emission of dynamical Casimir photon pairs. Under the structural constraint of a maximum tip velocity, the emission rate is maximized for a nearly spherical geometry and is further enhanced near a polaritonic resonance. For realistic material parameters, even these optimized upper bounds remain exceedingly small, setting stringent quantitative limits on free-space rotational dynamical Casimir emission with a single nanoparticle.", "url": "https://arxiv.org/abs/2605.29883", "type": "理论+数值", "summary": "1. 该工作理论分析了非球形中性粒子自由旋转时，因旋转轴与对称轴正交而引发的散射场频率边带，并由此参量发射动态卡西米尔光子对。\n2. 其核心在于揭示尖端速度约束下近球形几何与极化激元共振可优化发射率，但即便理想上限在现实参数下仍极低。\n3. 这为自由空间单纳米粒子旋转动态卡西米尔发射设置了严格的定量可行界限，并启发未来对材料色散与几何微调的探索。", "summary_source": "deepseek", "authors": [{"name": "Guilherme C. Matos"}, {"name": "Lucas Bianchi"}, {"name": "Jeremy N. Munday"}, {"name": "François Impens"}, {"name": "Reinaldo de Melo e Souza"}, {"name": "Paulo A. Maia Neto"}], "featured_authors": [{"name": "Guilherme C. Matos"}, {"name": "Lucas Bianchi"}, {"name": "Jeremy N. Munday"}, {"name": "François Impens"}, {"name": "Reinaldo de Melo e Souza"}, {"name": "Paulo A. Maia Neto"}], "author_count": 6}, {"id": "2605.29944", "category": "quant-ph", "title": "Quadratic Sums-of-Powers for Fixed-Parameter Tractable Quantum-Circuit Simulation", "abstract": "Strongly simulating a quantum circuit, that is, computing an output amplitude, amounts to summing the circuit's Feynman paths, a weighted count over assignments to the Boolean ``path'' variables. The circuit's gates induce correlations among these variables, forming a graph whose structure determines the hardness of the simulation task. This sum-of-powers viewpoint underlies recent simulators built on knowledge-representation tools from artificial intelligence, namely binary decision diagrams and weighted model counting. We show that the structural quantity most accurately governing the difficulty is the rank-width of the path-variable graph, and we give an algorithm that evaluates the amplitude in time that is exponential only in this rank-width and polynomial in the circuit size. Rank-width can be far smaller than the widths that control competing methods: as corollaries, our algorithm reproduces a recent decision-diagram simulation breakthrough as a special case and matches the Markov--Shi tensor-network contraction bound. To complement this, we exhibit circuit families on which our algorithm provably beats both competing methods. The new method applies to every circuit built from Hadamard and diagonal gates, in particular to circuits over Clifford+T. In practical terms, general-purpose decision-diagram and model-counting tools can serve as the workhorse, with our specialized algorithm dispatched to exploit a small rank-width of the associated graph when it is present.", "url": "https://arxiv.org/abs/2605.29944", "type": "理论+数值", "summary": "1. 该工作将量子电路的输出振幅计算转化为路径变量图上的幂次求和，并证明图秩宽是支配模拟难度的关键结构量。\n2. 核心卖点是给出一个算法，其运行时间仅随路径变量图的秩宽指数增长，而随电路规模多项式增长，且秩宽可远小于竞争方法的宽度参数。\n3. 这揭示了决策图与张量网络收缩方法在秩宽视角下的统一性，并为哈达玛-对角门电路（包括Clifford+T）的高效经典模拟提供了可验证的优势路径。", "summary_source": "deepseek", "authors": [{"name": "Alexis de Colnet"}, {"name": "Floris Geerts"}, {"name": "Rihan Hai"}, {"name": "Alfons Laarman"}, {"name": "Joon Hyung Lee"}, {"name": "Guillermo A. Pérez"}], "featured_authors": [{"name": "Alexis de Colnet"}, {"name": "Floris Geerts"}, {"name": "Rihan Hai"}, {"name": "Alfons Laarman"}, {"name": "Joon Hyung Lee"}, {"name": "Guillermo A. Pérez"}], "author_count": 6}, {"id": "2605.29959", "category": "quant-ph", "title": "Quantitative semidefinite certificates for ground-state energies of Pauli Hamiltonians", "abstract": "The $k$-local Hamiltonian problem is a central model for quantum many-body systems and Hamiltonian complexity. Semidefinite programming and noncommutative sum-of-squares hierarchies provide systematic certificates for ground-state energies, but existing finite-convergence results give no quantitative guarantee on the accuracy of the low hierarchy levels accessible in computation. We prove explicit finite-level convergence rates for these hierarchies in the Pauli setting. For $k$-local Hamiltonians whose Pauli expansion contains only even-weight terms, we show that both the NPA-type lower-bound hierarchy and the upper-bound hierarchy on the spectral minimum have error at most $C(k)\\xi^{n,4}_{d+1}/n$, where $\\xi^{n,4}_{d+1}$ is the smallest root of a Krawtchouk polynomial and $C(k)$ is independent of the number of qubits $n$ and the hierarchy level $d$. General $k$-local Hamiltonians reduce to this even-weight case by adding one ancilla qubit while preserving the spectrum. The proof constructs almost-reproducing kernels for the Pauli algebra and relates their spectra to Krawtchouk polynomials, giving a noncommutative analogue of recent kernel-based convergence analyses for commutative polynomial optimization. These results provide the first quantitative finite-level accuracy guarantees for noncommutative semidefinite relaxations of Pauli Hamiltonians.", "url": "https://arxiv.org/abs/2605.29959", "type": "理论+数值", "summary": "1. 该工作证明了Pauli哈密顿量基态能量的半定规划及非交换平方和层级具有显式有限层级收敛速率，为偶数权重项情形给出了误差上界。\n2. 其核心技术在于构造Pauli代数的几乎再生核，将其谱分析归约为Krawtchouk多项式求根，从而获得与量子比特数和层级数无关的定量精度估计。\n3. 这为k-局域哈密顿量问题的非交换半定松弛提供了首个量化误差保证，可指导实际层级选取并启发将再生核技巧推广至其他非交换优化问题。", "summary_source": "deepseek", "authors": [{"name": "Igor Klep"}, {"name": "Nando Leijenhorst"}, {"name": "Victor Magron"}], "featured_authors": [{"name": "Igor Klep"}, {"name": "Nando Leijenhorst"}, {"name": "Victor Magron"}], "author_count": 3}, {"id": "2605.30013", "category": "quant-ph", "title": "Elfs, transducers and quantum walks", "abstract": "Electric flow sampling (elfs) is a new tool in the quantum walk toolbox and a useful primitive for solving search, sampling and optimization problems on graphs. We refine this tool by showing that there exists a zero-error transducer for implementing elfs. More broadly, we establish a zero-error transducer for reflecting about the intersection of two subspaces, yielding an errorfree transducer version of the effective gap lemma. Building on this result, we obtain improved quantum walk algorithms for estimating effective resistances and span program witness sizes with an optimal error scaling, and for sampling from the random walk arrival distribution, via the composition of many elfs. Using this last algorithm, we obtain an up-to-quadratic quantum speedup for semi-supervised learning on expander graphs.", "url": "https://arxiv.org/abs/2605.30013", "type": "数值", "summary": "1. 该工作提出了零误差换能器实现量子行走中的电涌采样(elfs)，并推导出子空间反射的有效引理换能器版本。\n2. 其技术核心在于利用换能器组合实现有效电阻与跨度程序见证大小估计的最优误差缩放，以及随机游走到达分布的精确采样。\n3. 这为扩展图上的半监督学习提供了至多二次量子加速，并可能推动量子行走在图算法中的进一步应用。", "summary_source": "deepseek", "authors": [{"name": "Simon Apers"}, {"name": "Jérémie Roland"}, {"name": "Yuxin Zhang"}], "featured_authors": [{"name": "Simon Apers"}, {"name": "Jérémie Roland"}, {"name": "Yuxin Zhang"}], "author_count": 3}, {"id": "2605.30026", "category": "quant-ph", "title": "On the question of noise as a resource in quantum computing", "abstract": "Noise is usually regarded as the main obstacle to achieving a scalable quantum advantage, but recent evidence in quantum reservoir computing [L. Domingo, F. Borondo, and G. G. Carlo. Taking advantage of noise in quantum reservoir computing, Scientific Reports, 13:8790, 2023] suggests that certain channels can, in appropriate regimes, improve performance by enriching the reservoir's effective dynamics. Motivated by this idea we propose a geometric mechanism to explain how non-unital noise applied together with a universal gate set leads to a faster approach to Haar-like distributions of the final states. We find that noise of this kind induces an effective volume expansion on the manifold of pure states. In order to intuitively understand this we use a minimal 1 qubit model where we take the amplitude damping channel and combine it with a renormalization rule that associates to each resulting mixed state a representative pure state. This composition defines a globally expanding nonlinear map on the space of pure states. We analytically derive the local area expansion factor and identify the global expansion threshold. Finally, we combine amplitude damping with the G3 = {H, T, CNOT} universal gate set to show how the approach to Haar-like behavior is faster in an appropriate parameter region. This leads us to propose noise as a possible resource in future quantum algorithms.", "url": "https://arxiv.org/abs/2605.30026", "type": "理论+数值", "summary": "1. 该工作提出几何机制，将非幺正噪声视为量子计算中加速态分布趋近Haar均匀性的潜在资源。\n2. 其技术核心在于通过振幅阻尼通道与重归一化规则构建纯态流形上的全局扩张非线性映射，并解析导出局域面积扩张因子及全局扩张阈值。\n3. 这为在特定参数区域将噪声从障碍转化为量子算法的功能性资源提供了可检验的几何图像与理论依据。", "summary_source": "deepseek", "authors": [{"name": "J. Montes"}, {"name": "F. Borondo"}, {"name": "Gabriel G. Carlo"}], "featured_authors": [{"name": "J. Montes"}, {"name": "F. Borondo"}, {"name": "Gabriel G. Carlo"}], "author_count": 3}, {"id": "2605.30110", "category": "quant-ph", "title": "Alternative adiabatic quantum dynamics with algorithmic applications", "abstract": "In adiabatic quantum computing the aim is to track an eigenstate as the Hamiltonian changes. In the usual setup this is achieved using the natural time-dependent Hamiltonian evolution of the system and the main technical tool is the adiabatic theorem. We propose several alternative processes that achieve the same goal, but can easily be implemented on a gate-based quantum computer without the overhead of simulating time-dependent Hamiltonian evolution. We give a general framework for deriving `adiabatic' theorems for these processes. As an application, we give various algorithms for solving the Quantum Linear Systems Problem (QLSP) with optimal scaling in the condition number. One of these algorithms was previously developed in [Cunningham, Roland 2024] and another can be seen as a randomised version of the discrete adiabatic algorithm of [Costa et al. 2022]. We also describe versions of Trotterisation in our framework, which allows several results from [An et al. 2025] to be reproduced in a randomised setting. In particular, bounds on the Trotter error in terms of the fidelity are obtained that are asymptotically better than the standard bounds.", "url": "https://arxiv.org/abs/2605.30110", "type": "理论+数值", "summary": "1. 提出了可在门量子计算机上实现的替代绝热量子动力学过程及其绝热定理通用框架。\n2. 该框架避免了时间依赖哈密顿演化模拟，并导出求解量子线性系统问题的条件数最优缩放算法。\n3. 由此得到的保真度视角下Trotter误差界限渐近优于标准结果，拓展了离散绝热算法的随机化应用。", "summary_source": "deepseek", "authors": [{"name": "Joseph Cunningham"}, {"name": "Jérémie Roland"}], "featured_authors": [{"name": "Joseph Cunningham"}, {"name": "Jérémie Roland"}], "author_count": 2}, {"id": "2605.30124", "category": "quant-ph", "title": "Simulation of smooth models of potentials with singular point using Many-Interacting-Worlds Method", "abstract": "The deterministic many-interacting-worlds method proposed in 2014 showed potential among the numerous interpretation of quantum mechanics. The successful application of this method in harmonic oscillator has been promoted for a long time. In this article we continue the idea about using this method to solve some bounded systems different from harmonic oscillator potential and extend to 2 dimension cases. We focus on the potential with singularity like coulomb potential and finite trap potential by some asymptotic smooth method. The numerical simulation mainly based on the dynamical algorithm proposed in many-interacting-worlds method will be used to approach the stationary states of given systems. Our results shows the consistency to the matrix Numerov method in standard quantum mechanics in solving bounded systems and provides the possibility to solve more complex systems.", "url": "https://arxiv.org/abs/2605.30124", "type": "理论+数值", "summary": "1. 本文利用多相互作用世界方法对具有奇异点的光滑势模型（如库仑势与有限陷阱势）进行数值模拟，并扩展至二维束缚系统。\n2. 其技术核心是通过渐近光滑处理奇异点，使动力学算法逼近稳态解，结果与标准量子力学中的矩阵Numerov方法高度一致。\n3. 这验证了该确定论诠释框架在奇异势问题中的有效性，为模拟更复杂多体系统提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Wen Chen"}, {"name": "An Min Wang"}], "featured_authors": [{"name": "Wen Chen"}, {"name": "An Min Wang"}], "author_count": 2}, {"id": "2605.30142", "category": "quant-ph", "title": "Koopman--von Neumann Molecular Dynamics for Green--Kubo Transport Coefficients", "abstract": "We formulate the Green--Kubo transport coefficients of classical molecular dynamics as a readout problem for quantum algorithms using the Koopman--von Neumann (KvN) representation. Both NVE and Nosé--Hoover-type NVT dynamics are derived as unitary evolutions on Hilbert spaces associated with the corresponding classical phase spaces. Numerical benchmarks on finite grids show that the discretization error in the correlation function decreases as a power law in the number of grid points $N_z$. Equivalently, with $N_z=2^{n_z}$, the error decreases exponentially in the register size $n_z$, so a target accuracy $\\epsilon$ requires $n_z=\\mathcal{O}(\\log(1/\\epsilon))$ qubits. To read out a transport coefficient, we input a flux-excited state to quantum phase estimation (QPE). The probability $P_0$ of measuring the QPE ancilla register in the all-zero state corresponds to a Bartlett-windowed Green--Kubo integral. With maximum-likelihood amplitude estimation, the statistical estimation of $P_0$ defined by this QPE oracle improves from the $N_{\\rm queries}^{-1/2}$ scaling of direct shot sampling to scaling close to $N_{\\rm queries}^{-1}$. Our circuit-resource analysis shows that one step of the NVE propagator can be built with $\\mathcal{O}(n^2)$ CX gates, where $n=n_x+n_p$ is the total number of position and momentum qubits. For the NVT propagator, the centered-difference Pauli-decomposition implementation of the Nosé--Hoover friction term scales as $\\mathcal{O}(n_\\xi n_p\\,2^{n_p})$, where $n_p$ and $n_\\xi$ are the numbers of momentum and thermostat qubits, respectively. The proposed framework is a concrete step toward translating the principles of quantum algorithms into the transport-coefficient calculations required in practical molecular simulation.", "url": "https://arxiv.org/abs/2605.30142", "type": "数值", "summary": "1. 该工作利用Koopman–von Neumann表示将经典分子动力学的Green–Kubo输运系数计算转化为量子相位估计的读出问题，并给出了NVE与Nosé–Hoover型NVT系综的幺正演化形式。\n2. 其技术优势在于离散化误差随量子比特数指数下降（n_z=O(log(1/ε))），且通过最大似然振幅估计使输运系数统计采样标度从N_queries^{-1/2}优化至接近N_queries^{-1}。\n3. 该框架为量子算法在分子模拟输运系数计算中的实际应用提供了具体路径，电路资源分析表明NVE传播器可由O(n^2)个CX门构建。", "summary_source": "deepseek", "authors": [{"name": "Masari Watanabe"}, {"name": "Hirofumi Nishi"}, {"name": "Taichi Kosugi"}, {"name": "Shigekazu Hidaka"}, {"name": "Ryo Sakurai"}, {"name": "Yu-ichiro Matsushita"}], "featured_authors": [{"name": "Masari Watanabe"}, {"name": "Hirofumi Nishi"}, {"name": "Taichi Kosugi"}, {"name": "Shigekazu Hidaka"}, {"name": "Ryo Sakurai"}, {"name": "Yu-ichiro Matsushita"}], "author_count": 6}, {"id": "2605.30143", "category": "quant-ph", "title": "End-to-End Molecular Dynamics with a Langevin Thermostat on Quantum Circuits", "abstract": "We construct a quantum-circuit framework for finite-temperature molecular dynamics in the canonical ensemble (NVT) with a Langevin thermostat, connecting canonical state preparation to subsequent physical-property readouts. The classical nuclear phase-space distribution is encoded as a Koopman--von Neumann (KvN) wave function, and canonical state preparation is formulated as Langevin-type Fokker--Planck relaxation. The Hamiltonian Liouville flow, momentum friction, and momentum diffusion are decomposed into separate circuit blocks. The friction block is represented by a symmetrized momentum-space dilation, whereas the diffusion block is implemented as a cosine filter realized by probabilistic imaginary-time evolution (PITE). We analytically quantify the leading-order temperature bias caused by replacing the Gaussian diffusion kernel with this PITE-realized cosine filter. This analysis yields an internal-temperature correction that targets the desired physical equilibrium distribution. As a proof-of-concept demonstration connecting quantum chemistry to KvN nuclear dynamics, we study the H$_2$ molecule. Numerical simulations show relaxation from a nonequilibrium phase-space distribution to a canonical KvN state. From this canonical state, we demonstrate two complementary readouts: a dynamical quantum-phase-estimation readout of the vibrational density of states associated with the H--H stretch coordinate and a static canonical evaluation of the transition-state-theory (TST) rate constant. This work demonstrates, in a minimal molecular system, a circuit-level protocol that connects Langevin canonical state preparation to physical-property calculations, providing a concrete step toward quantum--classical hybrid molecular dynamics on quantum computers.", "url": "https://arxiv.org/abs/2605.30143", "type": "理论+数值", "summary": "1. 该工作构建了在量子电路上实现Langevin恒温正则系综(NVT)分子动力学的端到端框架，将经典核相空间分布编码为Koopman–von Neumann波函数，并通过Fokker–Planck弛豫制备正则态。\n2. 其技术核心在于将摩擦与扩散分解为独立电路模块：摩擦模块采用对称动量空间膨胀，扩散模块通过概率虚时演化实现余弦滤波器，并解析量化了由该滤波器引入的温度偏差及相应校正。\n3. 这为量子-经典混合分子动力学在量子计算机上的实现提供了具体电路级协议，尤其适用于从正则态直接读取振动态密度和过渡态理论速率常数等物理量。", "summary_source": "deepseek", "authors": [{"name": "Masari Watanabe"}, {"name": "Hirofumi Nishi"}, {"name": "Taichi Kosugi"}, {"name": "Shigekazu Hidaka"}, {"name": "Ryo Sakurai"}, {"name": "Yu-ichiro Matsushita"}], "featured_authors": [{"name": "Masari Watanabe"}, {"name": "Hirofumi Nishi"}, {"name": "Taichi Kosugi"}, {"name": "Shigekazu Hidaka"}, {"name": "Ryo Sakurai"}, {"name": "Yu-ichiro Matsushita"}], "author_count": 6}, {"id": "2605.30165", "category": "quant-ph", "title": "Tunneling phase diagram: A machine-learning framework for multidimensional kinetic isotope effects", "abstract": "The kinetic isotope effect (KIE) is the conventional probe for quantum tunneling, yet its composite nature conflates tunneling with zero-point energy and classical kinetics. Here, we introduce the tunneling phase diagram, a machine-learning framework that decouples true tunneling strength by decoding the nonlinear relationship between KIE and the tunneling factor (\\k{appa}). With exceptional fidelity (R^2 > 0.98, RMSE = 0.21), this framework reveals an anomalous high KIE-low \\k{appa} spanning 300-600 K, thereby defining a paradigm for the quantitative assessment of quantum tunneling.", "url": "https://arxiv.org/abs/2605.30165", "type": "数值", "summary": "1. 该工作引入了一个基于机器学习的隧穿相图框架，用于从多维动力学同位素效应中解码隧穿因子与KIE的非线性映射关系。\n2. 其核心卖点在于以R²>0.98的高保真度分离出纯净隧穿强度，并首次在300–600 K区间发现高KIE与低隧穿因子共存的异常相区。\n3. 这为量子隧穿效应的定量评估确立了新范式，有望在复杂反应体系中指导隧穿机制的精确识别与温区分析。", "summary_source": "deepseek", "authors": [{"name": "Xinrui Yang"}, {"name": "Zhigang Wang"}], "featured_authors": [{"name": "Xinrui Yang"}, {"name": "Zhigang Wang"}], "author_count": 2}, {"id": "2605.30217", "category": "quant-ph", "title": "Programmable Dissipation via Partial Quantum Error Correction", "abstract": "Noise is typically treated as the adversary of quantum information processing. For open quantum dynamics, however, dissipation is part of the target physics, creating a tension with fault-tolerant architectures designed to suppress decoherence. Here we show that logical noise can instead be turned into a calibrated resource. We treat the error-correction cycle as a programmable primitive: one fault-tolerant round induces a logical completely positive trace-preserving map, and decoder/recovery randomization generates a controllable family of logical channels whose convex mixtures realize Kraus-channel mixing. This enables direct compilation of target dissipators into effective logical dynamics without explicit ancilla qubits for encoding the bath degree of freedoms. We derive an accuracy criterion for multi-step simulation in which the code distance is chosen so that uncontrolled logical errors remain a small fraction of the intended dissipation per step, rather than being driven below an arbitrarily small closed-system tolerance. Partial quantum error correction thus repurposes fault-tolerant structure to sculpt dissipation, offering a resource-efficient route to quantum simulation of open quantum systems.", "url": "https://arxiv.org/abs/2605.30217", "type": "理论+数值", "summary": "1. 该工作提出通过部分量子纠错将逻辑噪声转化为可编程耗散资源，用于开放量子动力学模拟。\n2. 其核心在于将纠错周期视为可编程原语，利用解码器与恢复随机化实现Kraus信道混合，避免显式编码环境自由度。\n3. 这为基于容错架构的耗散工程提供了资源高效路径，尤其适用于含噪声中等规模量子器件上的开放量子系统模拟。", "summary_source": "deepseek", "authors": [{"name": "Sameer Dambal"}, {"name": "Michael AD Taylor"}, {"name": "Yu Zhang"}], "featured_authors": [{"name": "Sameer Dambal"}, {"name": "Michael AD Taylor"}, {"name": "Yu Zhang"}], "author_count": 3}, {"id": "2605.30238", "category": "quant-ph", "title": "Indefinite Causal Order Reverses the Real-Complex Hierarchy", "abstract": "Can causal relations be subject to quantum indefiniteness, similar to other physical properties? The process-matrix framework formalises this possibility: valid processes are defined by what local laboratories can implement, without assuming a global causal order. Standardly, the local labs are assumed to implement arbitrary quantum instruments. We ask what happens when symmetries restrict these local operations. Symmetry constraints, such as those arising from missing reference frames, superselection constraints, or the antiunitary symmetry defining real quantum theory, enlarge the admissible process cone. Do these extra processes generate genuinely new correlations? We prove a sharp dichotomy: no for any finite unitary symmetry, yes for real quantum theory. Recent work has shown that, under fixed and definite causal order, complex quantum theory is strictly richer than real quantum theory. Our work shows that this hierarchy is reversed under indefinite causal order: real quantum theory realizes strictly more process correlations than complex quantum theory.", "url": "https://arxiv.org/abs/2605.30238", "type": "理论", "summary": "1. 该工作研究不定因果序下由对称性限制（如实量子理论）允许的额外过程，并证明此时实数与复数量子理论的关联层次发生反转。\n2. 其核心卖点在于揭示任意有限酉对称性不产生新关联，但实量子理论在不定因果序中可实现严格更多过程关联，颠覆固定序下复数理论优越性。\n3. 这为重构因果结构与理论能力关系提供了关键基准，并启发非因果场景中实量子理论潜在优势的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Jacopo Surace"}, {"name": "Shintaro Minagawa"}, {"name": "Ravi Kunjwal"}], "featured_authors": [{"name": "Jacopo Surace"}, {"name": "Shintaro Minagawa"}, {"name": "Ravi Kunjwal"}], "author_count": 3}, {"id": "2605.30252", "category": "quant-ph", "title": "Quantum optimization beyond QUBO for industrial logistics and scheduling", "abstract": "The increasing complexity of industrial scheduling and transport routing problems motivates the study of alternative optimization formulations and computational paradigms. In this work, we study how higher-order unconstrained binary optimization (HUBO) formulations of such problems map onto quantum optimization workflows in both noisy and fault-tolerant regimes. We consider three representative logistics and manufacturing use cases and formulate each as a HUBO problem. This captures process intricacies, such as highly correlated assembly-line scheduling rules, which are difficult to express faithfully with the standard quadratic (QUBO) form, while at the same time reducing the number of binary variables required in the quantum mapping, thus lowering qubit demand. We compare the HUBO formulations with corresponding QUBO encodings, highlighting a key trade-off: while HUBO reduces qubit requirements through compact binary encoding, it introduces higher-order interaction terms that increase circuit depth, limiting feasibility on current quantum hardware. The proposed formulations are validated using classical solvers across several problem instances and benchmark small routing problem instances using bias-field digitized counterdiabatic quantum optimization in classical simulation. We complement these results with a resource and scalability analysis, focusing on the capacitated vehicle routing problem as a representative large-scale industrial use case. Our analysis indicates that while HUBO formulations offer advantages in qubit scaling compared to QUBO encodings, their practical implementation is constrained by gate fidelity, coherence, and circuit depth, making hybrid quantum-classical workflows and early fault-tolerant quantum hardware the most plausible settings for their practical use.", "url": "https://arxiv.org/abs/2605.30252", "type": "理论+数值", "summary": "1. 该工作将工业物流与调度问题表述为高阶无约束二元优化形式，并与标准二次形式进行对比分析。\n2. 其关键卖点在于HUBO通过紧凑编码减少量子比特需求，但引入的高阶相互作用项显著增加电路深度。\n3. 这表明混合量子-经典工作流与早期容错量子硬件是其实用化最可行的路径。", "summary_source": "deepseek", "authors": [{"name": "Juan F. R. Hernandez"}, {"name": "Pavle Nikacevic"}, {"name": "Enrique Solano"}, {"name": "Chinonso Onah"}, {"name": "Agneev Guin"}, {"name": "Arne-Christian Voigt"}, {"name": "Archismita Dalal"}], "featured_authors": [{"name": "Juan F. R. Hernandez"}, {"name": "Pavle Nikacevic"}, {"name": "Enrique Solano"}, {"name": "Agneev Guin"}, {"name": "Arne-Christian Voigt"}, {"name": "Archismita Dalal"}], "author_count": 7}, {"id": "2605.30271", "category": "quant-ph", "title": "Quantum Synchronization of Fock States", "abstract": "Synchronization, a ubiquitous phenomenon in classical systems, has recently been extended to the quantum domain. Here, we show quantum synchronization of a bosonic mode exhibiting a Fock state-like limit cycle, manifesting as a steady state with a negative Wigner function. We demonstrate that this non-classical state can be phase-locked to an external drive, achieving synchronization within an Arnold tongue regime. We argue that synchronization is a dynamical property and fundamentally tied to the suppression of phase slips, which we show to occur with exponentially decreasing probability. We introduce a novel method to extract the phase slip rate from the Lindblad time evolution of the system. This work opens new avenues for understanding and manipulating non-classical synchronization dynamics.", "url": "https://arxiv.org/abs/2605.30271", "type": "理论", "summary": "1. 该工作展示了玻色模中具有Fock态极限环的量子同步，稳态表现为负Wigner函数。\n2. 其核心在于将非经典态相位锁定至外部驱动，在Arnold舌区内实现同步，并证明同步本质上是相位滑移被指数抑制的动力学过程。\n3. 这为从Lindblad演化提取相位滑移率及操控非经典同步动力学提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Fabian Hassler"}, {"name": "David Scheer"}, {"name": "Samah Saquaque"}, {"name": "Steven Kim"}], "featured_authors": [{"name": "Fabian Hassler"}, {"name": "David Scheer"}, {"name": "Samah Saquaque"}, {"name": "Steven Kim"}], "author_count": 4}, {"id": "2605.30301", "category": "quant-ph", "title": "Improved sample complexity bound for sample-based Lindbladian simulation", "abstract": "We establish improved sample-complexity bounds for sample-based Lindbladian simulation based on the Wave Matrix Lindbladization (WML) algorithm. For a jump operator $L$ with dimension $d$, we derive an explicit non-asymptotic sample complexity bound $n_d^*(t,\\varepsilon) \\le \\left( \\frac{2d+3}{8} \\right) \\|L\\|_\\infty^2 \\left( \\frac{t^2}{\\varepsilon} \\right)$, holding for simulation time $t$ and error $\\varepsilon$. This refines the dimension dependence of the best previously known bound, $O(d^2 t^2/\\varepsilon)$, from [Go et al., Quantum Sci. Tech. 10, 045058 (2025)]. Remarkably, we show that this dimensional overhead can be entirely avoided when $\\| L\\|_\\infty^2 = O(1/d)$, a condition satisfied with high probability for random Lindblad operators, yielding a typical-case sample complexity of $O(t^2/\\varepsilon)$. On the other hand, in the worst case, we show that WML necessarily requires $\\Omega(dt^2/\\varepsilon)$ samples by constructing an explicit example with a rank-one Lindblad operator. Our results reveal a sharp dichotomy between typical and adversarial sample complexities in Lindbladian simulation, thereby strengthening the theoretical foundations of sample-based quantum algorithms.", "url": "https://arxiv.org/abs/2605.30301", "type": "理论+数值", "summary": "1. 该工作基于波矩阵林德布拉德化算法，建立了样本基林德布拉德演化的非渐近改进样本复杂度上界，即n_d^*(t,ε)≤((2d+3)/8)||L||_∞^2(t^2/ε)，突破了此前O(d^2 t^2/ε)的维度依赖限制。\n2. 其技术卖点在于证明当跳跃算符谱范数平方满足O(1/d)条件时（随机Lindblad算符高概率成立），样本复杂度降至O(t^2/ε)而与维度无关，且通过秩一算符构造证明最坏情形必为Ω(d t^2/ε)，从而揭示出典型与对抗复杂性的严格二分。\n3. 这一结果不仅精炼了样本基量子模拟的理论基础，更指明实际量子系统中Lindbladian模拟的样本资源主要由典型而非最坏情形决定，为高效噪声量子算法设计提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Siheon Park"}, {"name": "Youngjin Seo"}, {"name": "Byeongseon Go"}, {"name": "Dhrumil Patel"}, {"name": "Mark M. Wilde"}, {"name": "Hyukjoon Kwon"}], "featured_authors": [{"name": "Siheon Park"}, {"name": "Youngjin Seo"}, {"name": "Byeongseon Go"}, {"name": "Dhrumil Patel"}, {"name": "Mark M. Wilde"}, {"name": "Hyukjoon Kwon"}], "author_count": 6}, {"id": "2605.30302", "category": "quant-ph", "title": "Quantum Desynchronization of Limit Cycles", "abstract": "It is well known from classical physics that weakly coupled self-sustained oscillators may spontaneously lock their phases. Just like classical synchronization is known to break down due to noise induced phase slips, we show here how the synchronization of continuous variable quantum systems breaks down by proliferation of quantum phase slips. Within a Keldysh path integral formulation of limit cycles, we analyze the phase dynamics and show how, in spite of strong phase correlations, quantum phase slips degrade the actual phase locking. This approach also allows us to address non-Markovian effects on the synchronization of limit cycles, which we illustrate explicitly for superconducting resonators coupled via a voltage biased double quantum dot.", "url": "https://arxiv.org/abs/2605.30302", "type": "理论", "summary": "1. 该工作通过Keldysh路径积分方法研究连续变量量子系统极限环的同步行为，发现量子相位滑移的增殖会破坏相位锁定，导致量子去同步化。\n2. 技术核心在于建立极限环相位动力学的非微扰路径积分描述，并显式处理非马尔可夫效应，以电压偏置双量子点耦合的超导谐振器为例验证机制。\n3. 这一理论框架为理解噪声诱导相位滑移在量子同步中的根本作用提供基础，并启发非马尔可夫环境中同步边界的可控性研究。", "summary_source": "deepseek", "authors": [{"name": "Hans Christiansen"}, {"name": "Jens Paaske"}], "featured_authors": [{"name": "Hans Christiansen"}, {"name": "Jens Paaske"}], "author_count": 2}, {"id": "2605.30304", "category": "quant-ph", "title": "Analytical model for structured light propagation through a turbulent atmosphere", "abstract": "We develop a straightforward analytical framework for the propagation of spatial light modes through a turbulent atmosphere. Built upon the split-step approach with the mode-based optical field representation, it directly assesses how turbulence-induced phase fluctuations deplete the optical power in the original mode and re-distribute it into neighboring spatial modes. Importantly, this power transfer scales linearly with the propagation distance in a uniform channel, yielding a simple solution for arbitrary distances in the form of a matrix exponential. The transfer rate is determined by the spatial spectral overlap between the turbulence spectrum and the acceptance spectrum for a pair of interacting spatial modes. The model predicts the average power in each spatial mode and is exact when a single mode strongly dominates all others. Our predictions show reasonably good agreement with simulations up to medium-to-strong turbulence levels. The model also confirms the scalings with mode order previously known as empirical observations.", "url": "https://arxiv.org/abs/2605.30304", "type": "理论+数值", "summary": "1. 该工作基于分步法与模态光场表示，建立了结构光在湍流大气中传播的解析模型。\n2. 其核心在于揭示功率转移线性依赖于传播距离，转移率由湍流谱与模式接受谱的重叠决定，并给出任意距离的矩阵指数解。\n3. 这为量化复杂信道中高阶空间模式的串扰提供了可解析计算的框架，并可拓展至非均匀湍流或波导系统。", "summary_source": "deepseek", "authors": [{"name": "Konstantin Kravtsov"}], "featured_authors": [{"name": "Konstantin Kravtsov"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
