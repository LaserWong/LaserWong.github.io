<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-05-29 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="eyebrow">arXiv Daily Digest · 2026-05-29</div>
      <h1>Daily ArXiv Selection</h1>
      <p>
        数据来自 arXiv 当天的 <code>cond-mat</code>、<code>hep-th</code>、<code>math-ph</code>、<code>quant-ph</code> 四个分类页，口径限定为 <code>New submissions</code>。
        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。
      </p>
      <div class="stats" id="stats"></div>

        <div class="field">
          <label>类型</label>
          <div class="chip-row" id="type-filters"></div>

        <div id="result-count">正在加载…</div>
        <div><a href="../index.html">返回归档</a></div>
      </div>

    <section class="paper-grid" id="paper-grid"></section>
    <section class="empty" id="empty-state">没有匹配到结果，试试清空搜索词或恢复筛选。</section>

  <script>
    const papers = [{"id": "2605.28861", "category": "cond-mat", "title": "Comment on \"Spin-1/2 Kagome Heisenberg Antiferromagnet: Machine Learning Discovery of the Spinon Pair-Density-Wave Ground State\"", "abstract": "A recent article [Phys. Rev. X 15, 011047 (2025)] utilizes group-equivariant convolutional neural networks to study the ground state of the kagome Heisenberg antiferromagnet. On the largest finite-size cluster studied to date ($N=108$), the authors report variational energies significantly lower than other numerical methods, including state-of-the-art density matrix renormalization group (DMRG) calculations. In contrast to previous results suggesting a possible spin-liquid ground state, the authors observe a spinon pair-density-wave ground state. We find that: (i) the reported low energies are artifacts of broken ergodicity in the Metropolis--Hastings sampling, since the single-spin-flip update rule utilized by the authors effectively freezes the Markov chains; and (ii) when ergodic sampling is enforced via spin-exchange updates, the neural network converges to energies significantly higher than existing DMRG results, calling the paper's claims into question.", "url": "https://arxiv.org/abs/2605.28861", "type": "理论+数值", "summary": "1. 该评论指出利用组等变卷积神经网络研究kagome海森堡反铁磁体基态的文章，在最大N=108簇上报告的低能量是Metropolis-Hastings采样遍历性破缺的假象。\n2. 其技术关键在于发现单自旋翻转更新冻结马尔可夫链产生虚假低能，而强制自旋交换更新恢复遍历性后，神经网络能量显著高于密度矩阵重正化群结果，推翻了自旋子对密度波基态结论。\n3. 这强调了在神经网络变分蒙特卡洛中严格验证采样遍历性的必要性，对机器学习方法求解强关联量子多体问题提供了方法论警示。", "summary_source": "deepseek", "authors": [{"name": "Helia Kamal"}, {"name": "Dominik Kufel"}, {"name": "DinhDuy Vu"}, {"name": "Chris R. Laumann"}, {"name": "Norman Y. Yao"}], "featured_authors": [{"name": "Helia Kamal"}, {"name": "Dominik Kufel"}, {"name": "DinhDuy Vu"}, {"name": "Chris R. Laumann"}, {"name": "Norman Y. Yao"}], "author_count": 5}, {"id": "2605.28929", "category": "cond-mat", "title": "Improving CFT Operators Using Machine Learning", "abstract": "Finite-size effects limit the accuracy with which conformal data can be extracted from lattice simulations of critical systems. While action improvement suppresses some corrections to scaling, it does not address operator-dependent effects arising from imperfect lattice representations of continuum conformal fields. In this work, we propose a data-driven method for improving lattice operators themselves, constructing estimators with enhanced overlap with the corresponding primary operators of the continuum conformal field theory. We identify improved lattice representations of leading spin and energy operators in three two-dimensional critical systems: the Ising model, the q = 3 Potts model, and the dilute q = 3 Potts model. In all cases, the resulting operators exhibit reduced corrections to scaling and yield more accurate estimates of scaling dimensions compared to conventional lattice choices. The code and analysis workflows used to produce these results are made available in an accompanying GitHub repository.", "url": "https://arxiv.org/abs/2605.28929", "type": "理论+数值", "summary": "1. 该工作提出了一种数据驱动方法，通过机器学习改进格点算符，以增强其与连续共形场论主算符的重叠。\n2. 其技术核心在于利用统计学习构造改进算符，在伊辛模型、q=3 Potts模型及其稀释模型中显著降低标度修正并提升标度维数的估计精度。\n3. 这为临界系统格点模拟提供了算符优化的通用框架，有望推广至其他共形场论模型及更高维度系统。", "summary_source": "deepseek", "authors": [{"name": "Lior Oppenheim"}, {"name": "Snir Gazit"}, {"name": "Zohar Ringel"}], "featured_authors": [{"name": "Lior Oppenheim"}, {"name": "Snir Gazit"}, {"name": "Zohar Ringel"}], "author_count": 3}, {"id": "2605.28949", "category": "cond-mat", "title": "Order-disorder trade-off in dirty quantum systems", "abstract": "We prove a trade-off theorem for order and disorder parameters in one-dimensional quantum spin systems with quenched disorder. For a disordered ensemble with exact Ising symmetry and average translation symmetry, any gapped ensemble must have one and only one of the following: an $O(1)$ order parameter or an $O(1)$ disorder parameter with even parity, both of the Edwards-Anderson type. The result extends to nearly gapped ensembles that accommodate Griffiths-type rare-region effects. These results offer a powerful and rigorous framework to understand the disorder effects beyond perturbative approaches. As applications, we (1) establish the existence of string order parameters for SPT phases; (2) derive a Lieb-Schultz-Mattis-type constraint for disordered ensembles, which requires a nearly gapped ensemble to spontaneously break the symmetry; and (3) discuss similar trade-off relations for disordered fermion chains, leading to an improved understanding of certain \"intrinsically disordered\" topological phases.", "url": "https://arxiv.org/abs/2605.28949", "type": "理论", "summary": "1. 该工作严格证明了一维量子自旋体系中淬火无序下的有序-无序参数权衡定理。\n2. 其核心在于无需微扰假设，直接给出有能隙或近能隙系综中必具O(1)的有序或偶宇称无序参数（Edwards-Anderson型），并涵盖Griffiths稀有效应。\n3. 该结果为无序系统中SPT相弦序存在性、LSM型约束及本征无序拓扑相的理解提供了严格框架。", "summary_source": "deepseek", "authors": [{"name": "Jinmin Yi"}, {"name": "Chong Wang"}], "featured_authors": [{"name": "Jinmin Yi"}, {"name": "Chong Wang"}], "author_count": 2}, {"id": "2605.28993", "category": "cond-mat", "title": "Reinterpreting Memory Effects in Nonequilibrium Systems: From Temporal Dynamics to Steady-State Signatures via NEGF", "abstract": "We investigate memory effects and quantum transport in two-dimensional lattice systems within the framework of non-equilibrium Green's functions and Schwinger-Keldysh non-equilibrium quantum field theory. Starting from a 2D tight-binding Hamiltonian, we employ the Dyson expansion on the Keldysh contour and the second-order Born and self-consistent Born Approximation to derive the electronic self-energies associated with elastic and inelastic scattering this http URL disorder produces a local self-energy and a rapidly decaying memory kernel, characteristic of Markovian dynamics, whereas electron-phonon coupling generates temporally nonlocal self-energies and genuine Non-Markovian behavior. We demonstrate that these distinct memory signatures are directly reflected in the spectral function, which we propose as a diagnostic probe of non-equilibrium memory effects. Further we explore 1PI and 2PI effective actions to see their memory perspectives studying their coarse-graining behavior. Building on this theoretical framework, we further apply the conventional NEGF formalism to two paradigmatic two-dimensional models-the Hofstadter and an RKKY-coupled system to explore how different microscopic Hamiltonians influence Markovian and Non-Markovian nature. Our results provide a unified connection between scattering mechanisms, memory effects, and quantum transport in low-dimensional systems.", "url": "https://arxiv.org/abs/2605.28993", "type": "理论", "summary": "1. 该工作基于非平衡格林函数与Schwinger-Keldysh场论，重释二维晶格非平衡系统中的记忆效应，将其与量子输运性质统一关联。\n2. 卖点在于通过区分无序引起的局域马尔可夫自能与电子-声子耦合产生的非定域非马尔可夫自能，揭示谱函数可直接作为稳态记忆效应的诊断探针。\n3. 这为低维系统中非马尔可夫动力学的实验辨识及基于有效作用的粗粒化建模提供了理论框架，可拓展至强关联与耗散体系。", "summary_source": "deepseek", "authors": [{"name": "Pragya Chaudhary"}], "featured_authors": [{"name": "Pragya Chaudhary"}], "author_count": 1}, {"id": "2605.29023", "category": "cond-mat", "title": "Critical states and anomalous wave transport in an aperiodic polariton monotile", "abstract": "Recently \"the Hat\" monotile was introduced into the family of aperiodic tilings and quasicrystals boasting physical properties lying at the boundary of ordered and disordered systems. Here we study the two-dimensional wave transport, transverse localization and scaling properties of the quantum modes in a Monotile quasilattice. Our system is based on reconfigurable optical lattices for cavity-polaritons which provide flexible means to study wavepacket dynamics, strong nonlinear phenomena, and power-driven condensation in this new type of an aperiodic tiling. We confirm the existence of localized and critical states in the Monotile through direct diagonalization of the Schrödinger equation. Scaling analysis on the moments of the wavefunction distribution reveals anomalous transport regimes of super-diffusive and near sub-diffusive polariton transport associated with the fractal structure of the Monotile Hilbert space. We propose a strategy using resonantly excited polariton fluids to verify our findings.", "url": "https://arxiv.org/abs/2605.29023", "type": "理论", "summary": "1. 该工作研究了单铺砌准晶中极化激元的波输运、横向局域化与量子模的标度性质。\n2. 其技术核心在于直接对角化薛定谔方程确认临界态存在，并通过波函数矩的标度分析揭示与希尔伯特空间分形结构关联的超扩散与近亚扩散反常输运。\n3. 这为利用共振激发极化激元流体验证非周期铺砌中的强非线性与凝聚现象提供了可重构光学晶格平台。", "summary_source": "deepseek", "authors": [{"name": "Valtýr Kári Daníelsson"}, {"name": "Helgi Sigurðsson"}], "featured_authors": [{"name": "Valtýr Kári Daníelsson"}, {"name": "Helgi Sigurðsson"}], "author_count": 2}, {"id": "2605.29029", "category": "cond-mat", "title": "Geometry-based Discovery of Calcium Battery Cathodes Accelerated by Foundational Machine-Learned Models", "abstract": "Calcium batteries (CBs) are an attractive post-Li-ion technology, offering the appeal of Ca's natural abundance and high volumetric energy density. However, practical realization of CBs remains limited by the scarcity of positive electrode (cathode) materials that support reversible Ca$^{2+}$ (de)intercalation under electrochemical conditions. To address this challenge, we screen the materials project (MP) database for novel host structures that can intercalate Ca using geometry- and chemistry-based design principles. Specifically, we employ the Voronoi polyhedral volume as a descriptor of site compatibility for hosting Ca in potential frameworks. Further, we down-select candidate structures progressively through criteria including charge neutrality, absence of non-Ca mobile cations, thermodynamic (meta)stability, average voltage, and Ca migration barriers ($E_m$) using foundational machine-learning (ML) models. Subsequently, we validate the ensemble-ML-predicted $E_m$ in a subset of the final candidates using density functional theory based nudged elastic band calculations. Overall, from an initial pool of 52,945 MP structures, our workflow identifies 37 promising Ca cathode candidates, several of which exhibit favorable combinations of thermodynamic (meta)stability, voltage, and Ca-mobility, marking them as strong candidates for synthesis and electrochemical characterization. Particularly, we identify two Ca cathode candidates with markedly low Ca$^{2+}~E_m$ (CaSc$_2$V$_2$O$_8$ and CaVSO$_4$F$_3$), and four cathode candidates with thermodynamically stable charged states (Ca$_3$(CoO$_2$)$_4$, Ca$_3$Mn$_4$(TeO$_6$)$_2$, CaVF$_5$, and CaVSO$_4$F$_3$). Beyond identifying Ca-cathodes, our work establishes geometry-based descriptors and ML-based workflows as transferable methods for high-throughput screening, enabling the rapid discovery of novel materials for battery and other applications.", "url": "https://arxiv.org/abs/2605.29029", "type": "理论+数值", "summary": "1. 该工作基于几何兼容性描述符（Voronoi多面体体积）和基础机器学习模型，从材料项目数据库中高通量筛选出37种有前景的钙电池正极候选材料。\n2. 其技术核心在于利用Voronoi体积作为Ca²⁺位点兼容性的几何描述符，并集成机器学习模型预测热力学稳定性、电压和Ca迁移势垒，再以DFT-NEB验证。\n3. 该工作建立的几何描述符与机器学习流程具有可迁移性，为高吞吐发现其他电池材料和其他应用中的新型宿主结构提供了通用筛选策略。", "summary_source": "deepseek", "authors": [{"name": "Dereje Bekele Tekliye"}, {"name": "Achinthya Krishna Bheemaguli"}, {"name": "Gopalakrishnan Sai Gautam"}], "featured_authors": [{"name": "Dereje Bekele Tekliye"}, {"name": "Achinthya Krishna Bheemaguli"}, {"name": "Gopalakrishnan Sai Gautam"}], "author_count": 3}, {"id": "2605.29034", "category": "cond-mat", "title": "Topological superconductivity from Abelian fractional Chern insulators", "abstract": "Can a Laughlin anyon fluid become a topological superconductor? We answer this question for a $\\nu=1/3$ fractional Chern insulator (FCI) using a $U(3)$ infrared parton theory. Three charge-$e/3$ constituents form the electron, while three constituent pairs form a gauge-invariant charge-$2e$ Cooper pair. The resulting superconductors share an ordinary charge-$2e$ sector but differ in their neutral color response, giving an SC$^\\ast$ with the parent Laughlin $U(1)_3$ order, a chiral topological superconductor with $c_-=3/2$, and a strong-pairing anyon superconductor with $c_-=3$. The same framework organizes a nearby $\\sigma_{xy}=0$ charge density wave (CDW) state. At commensurate filling, the normal state and the $c_-=3$ and $c_-=3/2$ superconducting descendants are naturally tied to a period-three density order background, while the SC$^\\ast$ branch can preserve microscopic translations. Away from commensuration, a chargon metal can pair into the same $c_-=3/2$ topological superconductor. The FCI, reentrant CDW, and chiral superconductivity are unified in the $U(3)$ parton theory.", "url": "https://arxiv.org/abs/2605.29034", "type": "理论", "summary": "1. 该工作利用U(3)部分子理论，将ν=1/3分数陈绝缘体中的Laughlin任意子流体描述为拓扑超导体。\n2. 其要点在于由三个电荷e/3组成粒子形成电子，并由三对组成粒子构建电荷2e库珀对，进而揭示超导态在普通电荷扇区相同但中性色响应不同，产生三种区分超导相（SC*、手性拓扑超导及强配对任意子超导）。\n3. 该框架统一了分数陈绝缘体、再入电荷密度波和手性超导，为在公度及非公度填充下调控拓扑超导态提供了有效途径。", "summary_source": "deepseek", "authors": [{"name": "Taige Wang"}], "featured_authors": [{"name": "Taige Wang"}], "author_count": 1}, {"id": "2605.29056", "category": "cond-mat", "title": "Multifractal Complexity of the Chandler Wobble and Its Anomalous Disappearance (2015--2020): A MFDFA Study", "abstract": "The Chandler wobble (CW) -- the $\\sim$433-day free nutation of Earth's rotation pole -- experienced an anomalous near-disappearance between 2015 and 2020, followed by a re-excitation with an approximately $180^{\\circ}$ phase reversal. Using Multifractal Detrended Fluctuation Analysis (MFDFA) applied to more than six decades (1962--2024) of daily IERS EOP C04 polar motion data, this study provides the first multifractal characterisation of the CW and its recent anomaly. Global MFDFA shows that the residual polar motion components and the CW amplitude are genuine multifractal processes with strongly $q$-dependent generalised Hurst exponents and broad singularity spectra. Surrogate-data tests with shuffled and phase-randomised ensembles demonstrate that this multifractality originates from the combined action of long-range temporal correlations and heavy-tailed excitation statistics. A sliding-window analysis reveals a pronounced collapse in long-range persistence and multifractal spectral width of the geometric polar motion signal several years before and during the 2015--2020 amplitude minimum, indicating a genuine dynamical regime change rather than a simple suppression of oscillation amplitude. In contrast, the amplitude- and phase-related variables retain broad multifractal spectra and stable scaling exponents across all epochs, revealing a dynamical decoupling between the geometry of the CW and the multiscale structure of its amplitude and phase fluctuations. These findings highlight the CW amplitude as an exceptionally multifractal integrator of geophysical excitation and suggest that multifractal metrics may provide early-warning indicators of major transitions in Earth rotation dynamics.", "url": "https://arxiv.org/abs/2605.29056", "type": "理论", "summary": "1. 该工作利用多重分形去趋势波动分析（MFDFA）处理1962–2024年每日极移数据，首次刻画钱德勒摆动（CW）及其2015–2020年异常消失的多重分形特征。\n2. 其核心发现是CW残差与振幅均为多重分形过程，源于长程时间相关与重尾激励统计耦合；异常期间几何极移信号的长程持续性和谱宽显著衰减，标志动力学期数变化而非简单振幅抑制，且振幅-相位变量保持宽谱，揭示动力学解耦。\n3. 这暗示CW振幅作为地球物理激励的多重分形积分器，其多重分形指标可成为地球自转动力学重大转变的早期预警判据。", "summary_source": "deepseek", "authors": [{"name": "Sebastián Jaroszewicz"}, {"name": "Nahuel Mendez"}, {"name": "Maria P. Beccar-Varela"}, {"name": "Maria Cristina Mariani"}], "featured_authors": [{"name": "Sebastián Jaroszewicz"}, {"name": "Nahuel Mendez"}, {"name": "Maria P. Beccar-Varela"}, {"name": "Maria Cristina Mariani"}], "author_count": 4}, {"id": "2605.29162", "category": "cond-mat", "title": "Passive memory reshapes active persistence", "abstract": "Many active systems move in complex environments whose mechanical response is slow and history dependent. To address this regime, we study the collective dynamics of self-sustained active particles in non-Markovian media within a generalized Langevin framework with memory. We focus on the competition between the timescales of active persistence and viscoelastic relaxation in the environment. Using a minimal interacting model with an exponential memory kernel, we show that environmental memory qualitatively reshapes motility-induced phase separation of self-propelled active particles. When the memory timescale becomes comparable to the active persistence time, delayed viscoelastic stresses generate an effective anti-persistence that suppresses clustering and produces a broad metastable regime with slow nucleation dynamics. By contrast, for long memory timescales, reduced friction at short times enhances the effective propulsion velocity and restores phase separation. Our results demonstrate that the surrounding medium is not merely a passive background for active motion, but can actively regulate the emergence, stability, and dynamics of collective organization in active matter.", "url": "https://arxiv.org/abs/2605.29162", "type": "理论", "summary": "1. 该工作通过广义Langevin框架系统研究了自驱动活性粒子在非马尔可夫记忆介质中的集体动力学。\n2. 其核心发现是记忆时间尺度与主动持续时间竞争时，延迟粘弹性应力产生有效反持续性抑制团簇，而长记忆则通过短时减摩恢复相分离。\n3. 这揭示出环境记忆并非被动背景，而是主动调控活性物质中相分离的涌现、稳定与慢速成核动力学。", "summary_source": "deepseek", "authors": [{"name": "Ivan Di Terlizzi"}, {"name": "Lara Koehler"}, {"name": "John D. Treado"}], "featured_authors": [{"name": "Ivan Di Terlizzi"}, {"name": "Lara Koehler"}, {"name": "John D. Treado"}], "author_count": 3}, {"id": "2605.29179", "category": "cond-mat", "title": "Sustainable Metal-Organic Framework Water Harvesters in the Artificial Intelligence Era", "abstract": "Metal-organic frameworks (MOFs) are excellent candidates for water harvesting due to their tunable pore environments, which can be precisely engineered to capture and release water in arid conditions. Integrating artificial intelligence (AI) into MOF discovery can further accelerate the design of high-performance sorbents by identifying structural features that enhance atmospheric water harvesting (AWH), stability, and cycling efficiency. In this Perspective, we examine key MOF design principles, including cooperative adsorption, operational relative humidity (RH), uptake capacity, hysteresis, and scalability. We highlight recent design advancements such as multivariate strategies and long-arm linker extension, and examine how these principles tune pore capacity and hydrophilicity, while preserving stability and crystallinity. Furthermore, we discuss how AI, large language models (LLMs), and data mining can accelerate the discovery process through predictive synthesis, inverse design, and elucidating synthesis-structure-property relationships for the next generation of MOF water harvesters.", "url": "https://arxiv.org/abs/2605.29179", "type": "理论", "summary": "1. 本展望系统考察了金属有机框架在大气水收集中的关键设计原则，包括协同吸附、操作相对湿度、吸附容量、滞后效应及可扩展性，并评述了多元策略与长臂连接体扩展等最新进展。\n2. 技术核心在于通过精准调控孔道容量与亲水性在保持稳定性和结晶性的同时优化水吸附-脱附循环性能，并引入人工智能、大语言模型及数据挖掘以加速高性能吸附剂的发现。\n3. 该工作预示了AI驱动的逆向设计与合成-结构-性能关系解析将推动下一代可持续MOF水收集器的理性开发与规模化应用。", "summary_source": "deepseek", "authors": [{"name": "Reid A. Coyle"}, {"name": "Shyam Chand Pal"}, {"name": "Peter Walther"}, {"name": "Saeun Park"}, {"name": "Bin Feng"}, {"name": "Zhiling Zheng"}], "featured_authors": [{"name": "Reid A. Coyle"}, {"name": "Shyam Chand Pal"}, {"name": "Peter Walther"}, {"name": "Saeun Park"}, {"name": "Bin Feng"}, {"name": "Zhiling Zheng"}], "author_count": 6}, {"id": "2605.29185", "category": "cond-mat", "title": "Records, drift, and the longest increasing subsequence of biased Gaussian random walks", "abstract": "The longest increasing subsequence (LIS) of a random walk has so far been studied mainly for zero-mean, symmetric step increments. We numerically investigate the LIS of biased Gaussian random walks, with unit-variance increments and positive drift $\\mu_{p} = \\Phi^{-1}(p)$, where $p = \\mathbb{P}(\\xi>0)$. In contrast with the symmetric case, we find that for every fixed $p>1/2$ the mean LIS length grows linearly, $\\langle L_{n}(p)\\rangle \\sim a(p)n$, with $a(p)$ increasing from $0$ at $p=1/2$ to $1$ as $p \\to 1$. The record count is also linear, with coefficient $\\lambda(p)$ given by Spitzer's formula for the mean ascending ladder epoch, and the LIS becomes increasingly aligned with this record skeleton as $p$ grows. At the symmetric point $p=1/2$, the record skeleton collapses to the Sparre Andersen $\\sqrt{n}$ scale, while the LIS returns to the symmetric finite-variance $\\sqrt{n}\\log{n}$ regime. Near this limit, the excess $a(\\mu_{p})-\\lambda(\\mu_{p})$ vanishes more slowly than linearly in the drift, although our data do not resolve a single power law. The empirical distribution of $L_{n}$ also changes across the singular point, from lognormal-like at $p=1/2$ to fluctuations consistent with Gaussian behavior for every sampled $p>1/2$.", "url": "https://arxiv.org/abs/2605.29185", "type": "数值", "summary": "1. 该工作数值研究了有偏高斯随机游走的最长递增子序列（LIS），偏置由步长正概率p>1/2表征。\n2. 核心发现是LIS平均长度线性增长且系数a(p)从p=1/2的0增至1，与Spitzer公式给出的记录骨架线性系数λ(p)高度关联；对称点处LIS标度突变为√n log n，且超额a-λ随漂移消失慢于线性，分布从对数正态过渡至高斯。\n3. 这刻画了漂移驱动下随机序统计从次线性到线性标度的奇异相变，为极值序结构与标度律的理论建模提供了关键数值基准。", "summary_source": "deepseek", "authors": [{"name": "J. Ricardo G. Mendonça"}], "featured_authors": [{"name": "J. Ricardo G. Mendonça"}], "author_count": 1}, {"id": "2605.29201", "category": "cond-mat", "title": "Partial Entropy production of active particles with hidden states in potentials", "abstract": "Partially observed stochastic systems can appear (almost) time-reversal symmetric while in fact operating far from equilibrium. The present work extends the perturbative framework introduced in [Phys. Rev. Lett. 136, 198302 (2026)] to calculate in a generic confining potential the partial entropy production, which quantifies the time-reversal asymmetry of a generic active particle with hidden self-propulsion. Focusing on the harmonic case, we apply our framework to reproduce an exact result for the partial entropy production rate of an active Ornstein-Uhlenbeck particle and to derive the partial entropy production rate of a run-and-tumble particle.", "url": "https://arxiv.org/abs/2605.29201", "type": "理论", "summary": "1. 该工作扩展了微扰框架，用于计算限制在一般势阱中活性粒子的部分熵产生，从而量化隐藏自推进所导致的时间反演不对称性。\n2. 其技术核心在于通过部分观测视角，重现了活性Ornstein-Uhlenbeck粒子的精确结果并首次推导了run-and-tumble粒子的部分熵产生率。\n3. 这为利用部分熵产生诊断隐藏自由度非平衡行为的实验与理论提供了普适分析工具。", "summary_source": "deepseek", "authors": [{"name": "Jacob Knight"}, {"name": "Gunnar Pruessner"}], "featured_authors": [{"name": "Jacob Knight"}, {"name": "Gunnar Pruessner"}], "author_count": 2}, {"id": "2605.29338", "category": "cond-mat", "title": "Effective Theory of Fermion Quartet Condensation", "abstract": "We develop a theory of superconductivity (or superfluidity) based on condensed fermion quartets focusing on the dilute spin-$\\frac{1}{2}$ systems at zero temperature. In the spirit of the Bardeen--Cooper--Schrieffer ansatz, a variational wavefunction is constructed such that, within the so-called ``dilute quartet approximation\", it is the ground state of an effective quartic Hamiltonian. For a given two-body interaction in favor of quartetting, the gap parameter is suitably defined and the gap equation is also derived. As to the excited states, an intuitive physical picture based on a sixteen-dimensional ``occupation space\" is depicted and the associated eigen-energies are obtained. This theory is applied to compute the superfluid fraction, which is found to be the same as in conventional superconductors, despite the interacting nature of the quartet problem.", "url": "https://arxiv.org/abs/2605.29338", "type": "理论+数值", "summary": "1. 该工作发展了一个基于费米子四重态凝聚的超流理论，通过变分波函数和稀薄四重态近似求解了有效四次哈密顿量的基态。\n2. 技术要点在于定义了四重态能隙参数并导出能隙方程，同时利用十六维“占据空间”直观描述了激发态谱。\n3. 该理论为研究四体关联主导的量子流体现象，特别是在冷原子与核物质中检验能隙方程与超流分数的普适性提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Qiao-Ru Xu"}, {"name": "Congjun Wu"}], "featured_authors": [{"name": "Qiao-Ru Xu"}, {"name": "Congjun Wu"}], "author_count": 2}, {"id": "2605.29520", "category": "cond-mat", "title": "On certain combinatorial expressions of TASEP transition probabilities", "abstract": "We study combinatorial structures arising from finite-time transition probabilities of the Totally Asymmetric Simple Exclusion Process with open boundary conditions. While much of the existing combinatorial theory regarding the TASEP concerns the steady-state distribution, we focus instead on the transient dynamics. We first show that the enumeration of transition sequences between two configurations of the open TASEP is equivalent to the enumeration of standard Young tableaux of a family of non-classical shapes which have been of recent interest in the combinatorial literature. This extends to the open-boundary setting the correspondence between the TASEP with periodic boundaries and cylindric tableaux. We then introduce a family of tableau-like objects associated with Young diagrams in which repetitions of cells are allowed, subject to the partial order induced by the diagram. For each diagram, we collect the numbers of these objects into an exponential generating function. We prove that the entries of the homogeneous open TASEP transition matrix can be expressed as signed sums of such generating functions over suitable families of diagrams. This gives a combinatorial and order-theoretic interpretation of finite-time transition probabilities for the open TASEP, analogous to the combinatorial mappings known for steady-state probabilities.", "url": "https://arxiv.org/abs/2605.29520", "type": "理论", "summary": "1. 该工作研究了开放边界完全不对称简单排斥过程有限时间转移概率的组合结构，建立了与一类非经典形状标准杨表的等价关系。\n2. 其核心创新在于引入允许单元格重复的新型表对象，并将转移矩阵元表达为这些对象指数生成函数的带符号和，从而给出动力学的序理论解释。\n3. 这为理解边界驱动排斥过程的瞬态行为提供了组合框架，并可能启发其他可积随机过程或非平衡系统的类似构造。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo Vito Dal Zovo"}], "featured_authors": [{"name": "Lorenzo Vito Dal Zovo"}], "author_count": 1}, {"id": "2605.29552", "category": "cond-mat", "title": "Emergence of Dynamical Anisotropy induced by Demixing in a Binary System with Differential Diffusivity under an External Potential", "abstract": "Spontaneous demixing in active matter is a ubiquitous phenomenon that is crucial for numerous living processes ranging from bacterial swarming to sorting of cells in dense tissues. Here, we systematically investigate the effect of spatially varying potential acting along one direction and packing fraction on the binary mixture of particles with different diffusivities. Our results indicate that the presence of an external potential promotes demixing over a larger range of packing fractions, while also fostering a more pronounced 'hexatic order' within the bands of less diffusive \"cold\") particles formed near the minima of the potential. The mean-squared displacements (MSD) of \"cold\" and \"hot\" particles in different directions exhibit a distinct behavior. In contrast to the long-time sub-diffusive behavior of the \"cold\" particles, the \"hot\" ones display diffusive nature following an intermediate plateau. However, in the direction transverse to the applied potential, both types of particles undergo normal diffusion. Furthermore, interesting non-Gaussian characteristics are observed, corresponding to the spatial distribution of the displacement of \"hot\" and \"cold\" particles. Interestingly, our results reveal the formation of a 'percolating band', and the emergence of such dynamic anisotropy is not observed in the absence of an external potential. These aspects are highly relevant to the dynamics of various systems-including densely packed tissues, bacterial motility in confined spaces, and granular segregation in the pharmaceutical industry.", "url": "https://arxiv.org/abs/2605.29552", "type": "理论", "summary": "1. 该工作系统研究了外势场中不同扩散率二元混合物自发去混所诱导的动力学各向异性。\n2. 其核心发现是冷粒子在势阱方向呈现长时亚扩散、热粒子经历中间平台后扩散，而横向均为正常扩散，并形成渗透带与六角序。\n3. 这为理解受约束活性物质（如密集组织、细菌运动）中的异常输运与相分离提供了关键线索。", "summary_source": "deepseek", "authors": [{"name": "Rashmi Trivedi"}, {"name": "Subhajit Paul"}, {"name": "Sumanta Kundu"}, {"name": "Sunita Kumari"}], "featured_authors": [{"name": "Rashmi Trivedi"}, {"name": "Subhajit Paul"}, {"name": "Sumanta Kundu"}, {"name": "Sunita Kumari"}], "author_count": 4}, {"id": "2605.29617", "category": "cond-mat", "title": "Finite-temperature micromagnetic model bridging atomic- and macro-scale magnetism", "abstract": "A multi-scale finite-temperature micromagnetic model is presented, based on the Landau-Lifshitz equation and the Bernoulli differential equation. This model accurately reproduces classic Maxwell magnetostatics of paramagnets for high temperatures and accurately reproduces standard micromagnetics described by the conventional Landau-Lifshitz model in ferromagnets. The Landau-Lifshitz-Bernoulli (LLBe) model can, by design, directly couple atomic-scale simulations with micromagnetics and output consistent predictions of bulk magnetic properties at finite temperatures, from below to above the material's Curie temperature. The LLBe model is validated against established solvers: MUMAX3 for zero-temperature micromagnetics, and FEMCE for high-temperature classic magnetostatics. We present an application of the LLBe model by simulating Heat-Assisted magnetic recording on a thin magnetic track with local heating, demonstrating the multi-scale finite-temperature capabilities of the LLBe.", "url": "https://arxiv.org/abs/2605.29617", "type": "理论+数值", "summary": "1. 该工作提出了一个基于Landau-Lifshitz方程与Bernoulli微分方程的有限温度微磁模型（LLBe），实现了从原子尺度到宏观尺度的磁学桥接。\n2. 其核心卖点在模型能同时精确复现高温顺磁体Maxwell静磁学与铁磁体标准微磁学，并直接耦合原子尺度模拟与微磁模拟，输出从低温到居里温度以上一致的块体磁性质。\n3. 该模型经MUMAX3与FEMCE验证，通过对薄磁轨热辅助磁记录的模拟展现了多尺度有限温度能力，为相关存储技术提供了跨尺度模拟途径。", "summary_source": "deepseek", "authors": [{"name": "R. Kiefe"}, {"name": "J. S. Amaral"}], "featured_authors": [{"name": "R. Kiefe"}, {"name": "J. S. Amaral"}], "author_count": 2}, {"id": "2605.29672", "category": "cond-mat", "title": "Generation of Bloch Points with Controlled Spin Texture Using Geometrical Boundary Conditions", "abstract": "Bloch points are three-dimensional topological singularities in magnetization that play a key role in topological transformations of spin textures, such as skyrmion creation or annihilation. While topology often enforces the existence of Bloch points in confined geometries like cylindrical nanowires, deterministic control over their position and magnetic configuration remains challenging. Here we demonstrate the generation of Bloch points with controlled spin texture by engineering geometrical boundary conditions in three-dimensional nanomagnets. By introducing a chirality interface between two three-dimensional double-helix nanowires of opposite handedness, forming a kinked, non-collinear structure, we impose competing topological constraints that uniquely define the magnetization configuration surrounding the Bloch point. A saturating magnetic field nucleates head-to-head or tail-to-tail domain configurations at the chirality interface, producing a Bloch-point domain wall with deterministic polarity, circulation and helicity. This geometrical approach enables full three-dimensional control of Bloch point domain walls allowing deterministic engineering of their spin texture and its selective coupling to current-induced Oersted fields.", "url": "https://arxiv.org/abs/2605.29672", "type": "理论", "summary": "1. 该工作通过设计三维纳米磁体的几何边界条件，在由相反手性双螺旋纳米线构成的手性界面处实现了布洛赫点的确定性生成。\n2. 其核心卖点在于利用几何约束施加竞争性拓扑条件，从而唯一确定布洛赫点周围磁化织构，实现了极性、手性和螺旋度的独立控制。\n3. 这一几何方法为三维磁拓扑缺陷的全方位控制提供了新途径，并启发了其与电流感生奥斯特场的选择性耦合。", "summary_source": "deepseek", "authors": [{"name": "Naëmi Leo"}, {"name": "Daniel Wolf"}, {"name": "Alicia Estela Herguedas Alonso"}, {"name": "Oleksandr Zaiets"}, {"name": "Jakub Jurczyk"}, {"name": "Takeaki Gokita"}, {"name": "John Fullerton"}, {"name": "Dedalo Sanz-Hernandez"}, {"name": "Claire Donnelly"}, {"name": "Andrea Sorrentino"}, {"name": "Eva Pereiro"}, {"name": "Lucia Aballe"}, {"name": "Peter Fischer"}, {"name": "Rachid Belkhou"}, {"name": "Claas Abert"}, {"name": "Dieter Suess"}, {"name": "Axel Lubk"}, {"name": "Aurelio Hierro-Rodriguez"}, {"name": "Amalio Fernández-Pacheco"}], "featured_authors": [{"name": "Naëmi Leo"}, {"name": "Daniel Wolf"}, {"name": "Alicia Estela Herguedas Alonso"}, {"name": "Axel Lubk"}, {"name": "Aurelio Hierro-Rodriguez"}, {"name": "Amalio Fernández-Pacheco"}], "author_count": 19}, {"id": "2605.29730", "category": "cond-mat", "title": "Spin-Orbit Coupling Effects on the Structural and Electronic Properties of Planar Pentagonal p-MS$_{2}$ (M = Si, Ge, and Pb)", "abstract": "Spin-orbit coupling (SOC) plays an important role in determining the structural and electronic properties of recently proposed two-dimensional planar pentagonal materials. In this work, density functional theory calculations are employed to investigate SOC effects in p-MS$_{2}$ systems (M = Si, Ge, and Pb). Our results indicate that the p-SiS$_{2}$ structure is likely unstable, except for p-GeS$_{2}$ and p-PbS$_{2}$. A detailed j-resolved (total angular momentum) orbital analysis reveals that SOC enhances electronic localization, leading to a slight structural contraction and a reconstruction of electronic states near the Fermi level, this effect becoming stronger for heavier M atoms. While p-GeS$_{2}$ remains metallic, SOC drives a metal-semiconductor transition in p-PbS$_{2}$ and opening a quasi-direct band gap of about 0.475 eV. In addition, the conduction band minimum state of p-PbS$_{2}$ exhibits pronounced anisotropy along the S-S bonds. These findings provide insight into SOC-driven structural and electronic reconstruction in planar pentagonal chalcogenides p-MS$_{2}$ and suggest that p-PbS$_{2}$ may be a promising candidate for gas-sensing applications.", "url": "https://arxiv.org/abs/2605.29730", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算，系统研究了自旋-轨道耦合效应对平面五边形p-MS₂（M=Si, Ge, Pb）结构稳定性与电子性质的影响。\n2. 其核心在于采用j分辨轨道分析，揭示了SOC增强电子局域化并导致结构微缩及费米面附近电子态重构，进而驱动p-PbS₂发生金属-半导体转变，打开约0.475 eV准直接带隙。\n3. 这一发现为理解平面五边形硫属化物中SOC驱动的结构与电子重构提供了机制性见解，并预示p-PbS₂因其导带底各向异性可能成为气体传感候选材料。", "summary_source": "deepseek", "authors": [{"name": "Phuc-Dang Truong"}, {"name": "Cao-Huu-Tai Nguyen"}, {"name": "Nguyen-Bao-Tran Ngo"}, {"name": "Khanh-Van Huynh"}, {"name": "Jan Minar"}, {"name": "Worawat Meevasana"}, {"name": "Yen-Mi Tran"}, {"name": "Trung-Phuc Vo"}], "featured_authors": [{"name": "Phuc-Dang Truong"}, {"name": "Cao-Huu-Tai Nguyen"}, {"name": "Nguyen-Bao-Tran Ngo"}, {"name": "Worawat Meevasana"}, {"name": "Yen-Mi Tran"}, {"name": "Trung-Phuc Vo"}], "author_count": 8}, {"id": "2605.29743", "category": "cond-mat", "title": "Exact Solution of the Discrete Wormlike Chain Model", "abstract": "We present an exact solution of the discrete wormlike chain (DWLC) model describing a single semiflexible polymer under arbitrary external force. Through exact closure relations between pair angular correlations and single-site angular densities, we derive complete self-consistent equations determining the free energy functional and all thermodynamic properties without additional approximations. The key innovation is an exact closure relation connecting the pair angular distribution function to the single-site angular density, enabling the exact integration of the entropy functional. We validate the theoretical framework against known limits (rigid rod and random coil regimes), compare with continuum wormlike chain predictions, and demonstrate excellent agreement with recent theoretical results (Marantan \\& Mahadevan, 2018). The approach naturally extends to multiple-chain systems and phase transitions, positioning it as a versatile framework for understanding polymer mechanics from the nanoscale to the macroscopic limit.", "url": "https://arxiv.org/abs/2605.29743", "type": "理论", "summary": "1. 该工作给出了离散蠕虫链模型在任意外力下的精确解，通过闭合关系严格确定自由能泛函与所有热力学性质。\n2. 其核心在于建立了成对角度关联与单点角度密度之间的精确闭合方程，无需额外近似即可实现熵泛函的精确积分。\n3. 该框架可自然推广至多链体系与相变问题，为从纳米尺度到宏观极限的聚合物力学提供统一理论工具。", "summary_source": "deepseek", "authors": [{"name": "Benaoumeur Bakhti"}], "featured_authors": [{"name": "Benaoumeur Bakhti"}], "author_count": 1}, {"id": "2605.29745", "category": "cond-mat", "title": "Geometry and localization: Probing Localization Landscape Theory on the Bethe Lattice", "abstract": "The Localization Landscape Theory (LLT) offers a classical analogy for understanding Anderson localization through an effective confining potential, whose percolation threshold has been proposed to mark the mobility edge. While this correspondence shows striking numerical agreement in three dimensions, its theoretical foundations remain an open question. In this work, we extend the analysis of the LLT on the Bethe lattice presented in~\\cite{Tonetti2026}. In this setting in both the Anderson localization transition and the LLT percolation problem admit exact solutions. Our analysis reveals that the two transitions are distinct, with markedly different critical behaviors. Notably, the LLT percolation transition falls into the standard mean-field universality class, in sharp contrast with the unconventional critical behavior of the Anderson transition on the Bethe lattice. Nonetheless, the LLT framework reproduces several exact results, capturing nontrivial features of the very low-disorder regime: it predicts the position of the isolated eigenvalue, the minimal disorder at which both the LLT percolation curve and the mobility edge first appear, and the Aizenman--Warzel lower bound for localization. We also study the dependence of the LLT percolation threshold on the energy shift, evaluate the LLT prediction for the Density of States, and derive several results on the statistical properties of the variables controlling the problem. Finally, we develop an extreme-value analysis showing that the LLT prediction for the Density of States overestimates the amplitude of the tails close to the boundary of the continuous spectrum. These findings provide an exact analytical benchmark showing that, despite its geometric appeal, the LLT does not generally reproduce the quantum critical properties of Anderson localization, while still offering a powerful tool to understand its very low-disorder regime.", "url": "https://arxiv.org/abs/2605.29745", "type": "理论+数值", "summary": "1. 本文在Bethe格点上严格求解并对比了局域化景观理论(LLT)逾渗与Anderson局域化转变的临界行为。\n2. 核心发现是LLT逾渗属于标准平均场普适类，与Anderson转变的非常规临界行为截然不同，但LLT仍能精确预言极低无序区的孤立本征值位置、最小无序阈值及下界。\n3. 该工作为LLT在局域化问题中的适用范围提供了精确解析基准，明确其否定对量子临界性质的预言能力，但确认了其在极低无序区的有效工具地位。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo Tonetti"}, {"name": "Leticia F. Cugliandolo"}, {"name": "Marco Tarzia"}], "featured_authors": [{"name": "Lorenzo Tonetti"}, {"name": "Leticia F. Cugliandolo"}, {"name": "Marco Tarzia"}], "author_count": 3}, {"id": "2605.29746", "category": "cond-mat", "title": "Zeeman Pumping of Higgs Bosons in the Balian--Werthamer State", "abstract": "Based on equations of motion of an SO(5) pseudo-spin, we demonstrate a quantum quench protocol using the magnetic pulse to excite an $\\textit{undamped}$ heavy Higgs boson in the Balian--Werthamer superfluid (or superconductor). To achieve that, it is essential to include the dipolar interaction in the effective Hamiltonian and to calculate the ground state self-consistently. The pumped heavy Higgs mode has the twisted angular momentum $J=2$ with the projection $J^{\\,}_z=0$ and couples to a well-known light Higgs mode ($J=1$, $J^{\\,}_z=0$). The numerical method of 26-point Lebedev quadrature is implemented concretely so as to observe the real-time coupled oscillation.", "url": "https://arxiv.org/abs/2605.29746", "type": "理论+数值", "summary": "1. 该工作基于SO(5)赝自旋运动方程，提出利用磁脉冲激发Balian–Werthamer超流态中无阻尼的重希格斯玻色子。\n2. 其关键卖点是包含偶极相互作用并自洽计算基态，使重希格斯模（J=2，J_z=0）与轻希格斯模（J=1，J_z=0）耦合，并通过26点Lebedev求积数值方法观测实时振荡。\n3. 这为在超导/超流多分量系统中实现可控希格斯模泵浦与耦合提供了明确的理论方案与数值验证。", "summary_source": "deepseek", "authors": [{"name": "Qiao-Ru Xu"}], "featured_authors": [{"name": "Qiao-Ru Xu"}], "author_count": 1}, {"id": "2605.29810", "category": "cond-mat", "title": "Criticality in the disordered $N$-color Ashkin-Teller model", "abstract": "The $N$-color Ashkin-Teller model corresponds to $N$ Ising models coupled by four-spin interactions. We consider the two-dimensional case in presence of quenched disorder and use scale invariant scattering theory to determine all the solutions of the exact renormalization group fixed points equations. The weak disorder sector is characterized by a solution that, for any fixed $N$ larger than 1, is a line of fixed points with Ising thermal exponents and continuously varying magnetic exponents. The number of fixed point solutions allowed by the symmetries of the model increases at strong disorder illustrating the growing dependence on the distributions of the two random couplings. The presence of some critical exponents which do not depend on the symmetry parameter $N$ confirms this type of superuniversality as a peculiar feature of random criticality.", "url": "https://arxiv.org/abs/2605.29810", "type": "理论", "summary": "1. 该工作利用尺度不变散射理论，解析求解了二维无序N色Ashkin-Teller模型的重整化群不动点方程，获得了全部可能的固定点解。\n2. 弱无序区域发现一条固定点线，其伊辛热指数不变量而磁指数连续变化；强无序区域不动点数目增多，凸显随机耦合分布的影响。\n3. 临界指数与对称性参数N无关的超普适性被确认为无序临界性的独特特征，为理解随机系统的普适类结构提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Youssef Makoudi"}, {"name": "Gesualdo Delfino"}], "featured_authors": [{"name": "Youssef Makoudi"}, {"name": "Gesualdo Delfino"}], "author_count": 2}, {"id": "2605.29821", "category": "cond-mat", "title": "Accelerated Discovery of Nitrogen-Coordinated Dual-Atom Hydrogen Evolution Reaction Electrocatalysts via Machine Learning Potentials", "abstract": "The hydrogen evolution reaction (HER) is central to sustainable hydrogen production, and nitrogen coordinated dual atom catalysts (DACs) offer a promising route to noble metal activity at low cost. Yet their vast compositional and coordination design space remains underexplored, as density functional theory (DFT) screening at scale is prohibitive. Here, we map the HER landscape of graphene supported TM2@Nx-Gr DACs, screening 23 transition metals across 20 nitrogen coordination motifs using a machine learning potential (MLP) benchmarked against DFT. Intermediate coordination (2N to 4N) consistently yields near-optimal {\\Delta}GH*, with Ti2@2Na, Mn2@2Na, Fe2@2Na, Cu2@2Na, Rh2@2Na, Zr2@2Na, Zr2@2Nb, Zr2@2Nc, Nb2@2Nc, Zr2@2Nd, Mn2@2Ne, Mn2@2Nf, Ti2@3Na, Au2@3Na, Fe2@3Na, Pd2@3Nb, Rh2@3Nc, Rh2@3Nd, Au2@3Nd, V2@4Na, Ti2@4Nb, Pd2@4Nb, Ti2@4Nc, Cr2@4Nd, Ni2@4Nd, Cu2@4Nd emerging as standout, synthesizable candidates, most exhibiting metallic or narrow gap (<0.25 eV) character. The MLP reaches near-DFT accuracy, with a mean absolute error of 80 meV for Gibbs binding free energies at orders of magnitude lower computational cost, establishing MLP driven screening as a practical engine for next-generation catalyst discovery.", "url": "https://arxiv.org/abs/2605.29821", "type": "理论+数值", "summary": "1. 该工作利用机器学习势对石墨烯负载的氮配位双原子催化剂进行高通量筛选，评估了23种过渡金属与20种配位构型的析氢反应活性。\n2. 其核心卖点是机器学习势预测吉布斯自由能的平均绝对误差仅80 meV，接近密度泛函理论精度，但计算成本降低数个数量级，从而实现对庞大化学空间的系统探索。\n3. 这为复杂配位环境下电催化剂的理性设计提供了高效计算范式，有望加速低成本、高活性双原子催化剂的实验发现与开发。", "summary_source": "deepseek", "authors": [{"name": "Yanmei Zang"}, {"name": "Hyun Gyu Park"}, {"name": "Gi Beom Sim"}, {"name": "Tae Hyeon Park"}, {"name": "Ho Jin Lee"}, {"name": "Xiaorong Zou"}, {"name": "D. ChangMo Yang"}, {"name": "Soohaeng Yoo Willow"}, {"name": "Hye Jung Kim"}, {"name": "Chang Woo Myung"}], "featured_authors": [{"name": "Yanmei Zang"}, {"name": "Hyun Gyu Park"}, {"name": "Gi Beom Sim"}, {"name": "Soohaeng Yoo Willow"}, {"name": "Hye Jung Kim"}, {"name": "Chang Woo Myung"}], "author_count": 10}, {"id": "2605.29871", "category": "cond-mat", "title": "Enhanced Density Fluctuations Near a Disordered Chiral Topological Transition", "abstract": "The universal statistics of density fluctuations of localized quantum states may offer unprecedented opportunities to probe and understand quantum transport in connection with dimensionality, coherence, symmetry and disorder. To date, the possible role of topological phase transitions in the fluctuation statistics is not studied yet. Using a Su-Schrieffer-Heeger chain subject to off-diagonal disorder (so that chiral symmetry is preserved), this work investigates how a disorder driven topological phase transition impacts on the spatial fluctuations of the logarithmic wave-packet density $\\ln P(r)$ at distance $r$ from the initial excitation. Away from the transition, in both topological and trivial localized phases, the standard deviation follows the conventional one-dimensional scaling $\\sigma[\\ln P(r)]\\sim r^{\\theta}$ with $\\theta\\simeq 1/2$. Near the transition, however, the fluctuation growth is enhanced: the fitted exponent $\\theta$ increases above $1/2$ in a nonmonotonic manner before returning close to $1/2$ at criticality. We interpret this behavior from the energy-resolved density of states and localization length. Near the transition, several energy sectors carry appreciable spectral weight and exhibit competitive decay rates, preventing a single localization scale from dominating the accessible wave-packet tail and thereby enhancing the fluctuations of $\\ln P(r)$. Our results establish wave-packet fluctuation statistics as a dynamical diagnostic of disordered chiral topological transitions and motivate broader studies of fluctuation phenomena in disordered topological quantum systems.", "url": "https://arxiv.org/abs/2605.29871", "type": "理论+数值", "summary": "1. 该工作通过手征无序SSH链研究无序驱动拓扑相变附近波包对数密度涨落的标度行为。\n2. 关键发现在于：靠近相变时，涨落标准偏差指数θ非单调增大至超过1/2，源于多个能量区间竞争衰减破坏单一局域尺度主导。\n3. 这建立了波包涨落统计作为无序手征拓扑相变的动态诊断手段，并为无序拓扑量子系统中涨落现象的广泛研究提供启发。", "summary_source": "deepseek", "authors": [{"name": "Hai-Tao Ding"}, {"name": "Sen Mu"}, {"name": "Leong-Chuan Kwek"}, {"name": "Gabriel Lemarié"}, {"name": "Jiangbin Gong"}], "featured_authors": [{"name": "Hai-Tao Ding"}, {"name": "Sen Mu"}, {"name": "Leong-Chuan Kwek"}, {"name": "Gabriel Lemarié"}, {"name": "Jiangbin Gong"}], "author_count": 5}, {"id": "2605.29875", "category": "cond-mat", "title": "Estimates of ground state energies for the quantum SK and 2D-EA model, using deGennes-Suzuki-Kubo mean-field annealing dynamics", "abstract": "We perform a large scale simulation of quantum annealing in the Sherrington-Kirkpatrick (SK) spin glass up to a system size $N=40000$ to estimate its ground state energy using the deGennes-Suzuki-Kubo mean-field Ising dynamics, extending the earlier results (reported in Eur. Phys. J. B {\\bf 98}, 226 (2025)). Here we numerically solve the deGennes-Suzuki-Kubo annealing dynamics to obtain the spin configurations and subsequently the ground state energy for a given system size at the end of the annealing (to the desired quantum system at the corresponding values of the transverse field), starting from a quantum paramagnetic state. The method shows high efficiency, with an overall algorithmic cost of $O(N^3)$ in estimating the energy of the ground state. We later extend this method to study the ground state energy of the Edwards-Anderson (EA) spin glass on a square lattice.", "url": "https://arxiv.org/abs/2605.29875", "type": "理论+数值", "summary": "1. 该工作采用deGennes-Suzuki-Kubo平均场退火动力学，对量子SK自旋玻璃（最大N=40000）及二维EA模型进行大规模数值模拟，估算了其基态能量。\n2. 其技术核心在于从量子顺磁态出发数值求解该平均场退火动力学以获取自旋构型，并以O(N³)算法复杂度高效实现基态能量估计。\n3. 这为大规模自旋玻璃基态能量计算提供了可扩展的平均场动力学框架，有望推广至更复杂无序量子多体系统的优化与模拟。", "summary_source": "deepseek", "authors": [{"name": "Soumyaditya Das"}, {"name": "Soumyajyoti Biswas"}, {"name": "Bikas K. Chakrabarti"}], "featured_authors": [{"name": "Soumyaditya Das"}, {"name": "Soumyajyoti Biswas"}, {"name": "Bikas K. Chakrabarti"}], "author_count": 3}, {"id": "2605.29884", "category": "cond-mat", "title": "Charged Abelian Higgs phase transitions in three-dimensional compact lattice U(1) gauge models with multicharge scalar matter", "abstract": "We consider three-dimensional (3D) lattice Abelian Higgs models, with compact U(1) gauge variables coupled to a doubly-charged $N$-component complex scalar field (CLAH). We focus on their phase transitions between the disordered-confined (DC) and ordered-deconfined (OD) phases. When they are continuous they belong to the 3D Abelian Higgs (AH) universality class associated with the stable charged fixed point (CFP) of the renormalization-group flow of the 3D AH field theory, or scalar electrodynamics, describing $N$-component complex scalar fields minimally coupled to a U(1) gauge field. This CFP exists only for a sufficiently large number of components, i.e., $N \\ge N_d^*$, where the integer $N_d^*$ depends on the spatial dimension $d$ (for example $N_4^*=183$). To estimate $N_3^*$, we look for the minimum number $N_{\\rm cL}$ of scalar components of 3D doubly-charged CLAH models developing continuous transitions along their DC-OD transition line. For this purpose, we present finite-size scaling analyses of Monte Carlo simulations for $N\\in[4,10]$, up to lattice sizes $L\\approx 100$. The results provide evidence of continuous DC-OD transitions for $N=10$, and weak first-order transitions for $N\\le 7$. They are not conclusive for $N=8,\\,9$. Therefore, we estimate $N_{\\rm cL}=9(1)$.", "url": "https://arxiv.org/abs/2605.29884", "type": "理论+数值", "summary": "1. 该工作通过蒙特卡洛模拟研究三维紧致U(1)格点规范模型中带双电荷N分量标量场的无序-禁闭与有序-解禁闭相变。\n2. 其卖点在于利用有限尺寸标度分析，从N=4至10的大尺度模拟中确定连续相变存在的阈值分量数N_cL=9(1)。\n3. 这为三维阿贝尔希格斯理论中稳定带电不动点的存在性及相变普适类分类提供了关键数值约束。", "summary_source": "deepseek", "authors": [{"name": "Claudio Bonati"}, {"name": "Filippo Mariani"}, {"name": "Ettore Vicari"}], "featured_authors": [{"name": "Claudio Bonati"}, {"name": "Filippo Mariani"}, {"name": "Ettore Vicari"}], "author_count": 3}, {"id": "2605.29925", "category": "cond-mat", "title": "Carrier Localization in Pnictogen-Based Chalcohalides from Defect-Bound Hot Polarons", "abstract": "Pnictogen-based solar absorbers have gained prominence as promising nontoxic and stable alternatives to lead-halide perovskites (LHPs), but are severely limited by carrier localization, preventing their performance from approaching those of LHPs. Recent efforts have uncovered routes to overcome carrier localization, but these early efforts only considered intrinsic factors. Herein, we push beyond these limited early efforts, examining the role of defects, not only on cold carriers but also hot carriers. Focusing on the structurally one-dimensional pnictogen chalcohalide BiSBr, we find that whilst this material intrinsically does not exhibit carrier localization, vacancies introduced during synthesis or post-treatment lead to pronounced extrinsic self-trapping via the formation of defect-bound hot polarons-excited charge-carriers strongly coupled to local defect-induced vibrational modes. These above-gap defect states divert hot carriers from cooling to the band edge, thus depleting the mobile carrier population. Our findings establish the key role of defect-bound hot polarons in mediating extrinsic localization and offer new mechanistic insights into the interplay between defects, lattice coupling, and excited-state charge-carrier transport, which are critical to designing efficient perovskite-inspired solar absorbers.", "url": "https://arxiv.org/abs/2605.29925", "type": "理论", "summary": "1. 该工作通过研究BiSBr中缺陷对热载流子的影响，揭示了缺陷束缚热极化子导致pnictogen基chalcohalide中载流子局域化的新机制。\n2. 其物理卖点在于发现合成或后处理引入的空位通过与局域缺陷振动模式强耦合形成缺陷束缚热极化子，将热载流子从冷却到带边过程中转移，从而消耗移动载流子。\n3. 这为理解缺陷、晶格耦合与激发态载流子输运的相互作用提供了关键机理，对设计高效钙钛矿启发太阳能吸收剂具有明确指导意义。", "summary_source": "deepseek", "authors": [{"name": "Xiaoyu Guo"}, {"name": "Junzhi Ye"}, {"name": "Cibrán Lopez Alvarez"}, {"name": "Maciej Oskar Liedke"}, {"name": "Maik Butterling"}, {"name": "Mutibah Alanazi"}, {"name": "Yi-Teng Huang"}, {"name": "Jiajie Wu"}, {"name": "Zhilong Zhang"}, {"name": "Lars Van Turnhout"}, {"name": "Yorrick Boeije"}, {"name": "Bofeng Xue"}, {"name": "Qingyu Wang"}, {"name": "Hugh Lohan"}, {"name": "Seán R. Kavanagh"}, {"name": "Andreas Wagner"}, {"name": "Eric Hirschmann"}, {"name": "Robert A. Taylor"}, {"name": "Akshay Rao"}, {"name": "Edgardo Saucedo"}, {"name": "Claudio Cazorla"}, {"name": "Robert L. Z. Hoye"}], "featured_authors": [{"name": "Xiaoyu Guo"}, {"name": "Junzhi Ye"}, {"name": "Cibrán Lopez Alvarez"}, {"name": "Edgardo Saucedo"}, {"name": "Claudio Cazorla"}, {"name": "Robert L. Z. Hoye"}], "author_count": 22}, {"id": "2605.29945", "category": "cond-mat", "title": "Entropy of Liquids and Glasses from Recurring Structural Patterns", "abstract": "We compute the low-temperature configurational entropy of a two-dimensional supercooled liquid. Our method, based on a higher-dimensional version of the Grassberger--Procaccia algorithm, can be implemented in a manner that is entirely agnostic with respect to both the dynamics and the theoretical framework, as any genuine notion of order should be. In this construction, entropy is obtained as the decay rate of recurrent structural patterns with increasing patch size, directly linking entropy reduction to the growing persistence of amorphous order. Because the method requires only particle positions, without any knowledge of the interaction potential or even of the particle sizes, it can be applied directly to both equilibrium and nonequilibrium aging configurations. The resulting configurational entropy, together with the higher-order Rényi complexities, agree quantitatively with values obtained from conventional definitions. Remarkably, the entropies measured during aging coincide with their equilibrium counterparts when compared at the same inherent-structure energy.", "url": "https://arxiv.org/abs/2605.29945", "type": "数值", "summary": "1. 该工作通过重复结构模式的衰减率计算了二维过冷液体与玻璃的低温构型熵，并推广了Grassberger-Procaccia算法至高维。\n2. 技术卖点在于方法完全独立于相互作用势、粒子大小及动力学框架，仅需粒子位置，直接揭示熵减与无定形有序增强的联系。\n3. 所得构型熵及高阶Rényi复杂度与常规定义定量一致，且老化熵与本征结构能量下的平衡熵重合，为玻璃态熵的非平衡测量提供了不依赖理论的方案。", "summary_source": "deepseek", "authors": [{"name": "Nina Javerzat"}, {"name": "Gerhard Jung"}, {"name": "Jorge Kurchan"}, {"name": "Misaki Ozawa"}], "featured_authors": [{"name": "Nina Javerzat"}, {"name": "Gerhard Jung"}, {"name": "Jorge Kurchan"}, {"name": "Misaki Ozawa"}], "author_count": 4}, {"id": "2605.29957", "category": "cond-mat", "title": "Universal thermokinetic decomposition of short-time information fluctuations", "abstract": "Biological, artificial, and physical systems dissipate energy to accurately transmit information. While tools of information theory have been used to characterize information-processing capabilities, how reliably this information is acquired along individual trajectories, and which aspects require a thermodynamic cost, is an open question. In this work, we focus on the stochastic predictability of an arbitrary Langevin dynamics, defined as the pointwise mutual information between the current and future states of a system. We show that the fluctuations of predictability obey a universal thermokinetic decomposition at short times, which reveals that information fluctuations are suppressed by energy dissipation and become stronger with increased dynamical activity. Remarkably, we find that the average predictability, i.e., the short-time mutual information, does not carry any dependence on the underlying thermodynamic and kinetic features. Thus, the role of dissipation at short times is not to enhance information, but to reduce its fluctuations. Such dissipative control is effective only when instantiated by nonlinear operations. Moreover, energy consumption governs short- and long-time precision in stochastic oscillators through structurally different mechanisms that can be independently tuned. Our decomposition offers a fundamental thermodynamic basis for understanding the reliability of information transmission in nonequilibrium systems, the constraints on precision in biological systems, and the design of energy-limited control strategies.", "url": "https://arxiv.org/abs/2605.29957", "type": "理论", "summary": "1. 该工作针对任意Langevin动力学，提出了短时点互信息涨落的普适热动力学分解。\n2. 其核心发现是信息涨落被能量耗散抑制且随动力学活动增强，而平均可预测性不依赖热力学与动力学特征。\n3. 这为非平衡系统信息传输可靠性、生物精度约束及能量受限控制策略的设计提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Giorgio Nicoletti"}, {"name": "Daniel M. Busiello"}], "featured_authors": [{"name": "Giorgio Nicoletti"}, {"name": "Daniel M. Busiello"}], "author_count": 2}, {"id": "2605.29969", "category": "cond-mat", "title": "Prototype-Guided Latent Alignment for Data-Efficient Fine-Tuning of Molecular Foundation Models", "abstract": "Machine learning interatomic potentials (MLIPs) have transformed materials discovery by leveraging graph neural networks (GNNs) to predict material properties with near density functional theory (DFT) accuracy. While large-scale pretrained foundation models offer transferable baseline representations, they frequently struggle to generalise to out-of-distribution (OOD) target systems -- a common challenge in modelling complex or chemically diverse materials. Fine-tuning is the standard remedy, but the high cost of generating DFT-labelled configurations confines adaptation to data-scarce regimes, where over-parameterised GNNs amplify overfitting and degrade target-domain performance. To address this, we propose a prototype-based alignment approach for data-efficient fine-tuning of MLIPs. Our method identifies local structural similarities between the source and target domains by grouping atoms with analogous chemical environments based on their latent representations. Each target-domain atom's energy contribution is aligned to its source-domain prototype, introducing an inductive bias that anchors fine-tuned representations to the pretrained structure, encouraging effective reuse of learned interactions and improving generalisation without restrictive assumptions on the target chemistry. We evaluate our method on the rMD17 benchmark using equivariant MACE and invariant SchNet across varying data budgets, and extend evaluation to the MACE-OFF foundation models on the SPICE dataset. Our approach consistently improves predictive accuracy in the low-data regime, reducing energy MAE by up to 18% over standard fine-tuning baselines.", "url": "https://arxiv.org/abs/2605.29969", "type": "理论+数值", "summary": "1. 该工作提出一种原型引导的潜在对齐方法，用于数据高效地微调分子基础模型中的机器学习原子间势。\n2. 其核心在于利用原子潜在表示的化学环境相似性，将目标域能量贡献对齐至源域原型，从而引入归纳偏置，缓解过参数化图神经网络在小样本下的过拟合。\n3. 这为复杂或化学多样性材料体系中低数据场景下的迁移学习与泛化提供了直接且可推广的优化策略。", "summary_source": "deepseek", "authors": [{"name": "Rushikesh Pawar"}, {"name": "Harshit Rawat"}, {"name": "Ayush Kumar"}, {"name": "Phani Motamarri"}], "featured_authors": [{"name": "Rushikesh Pawar"}, {"name": "Harshit Rawat"}, {"name": "Ayush Kumar"}, {"name": "Phani Motamarri"}], "author_count": 4}, {"id": "2605.29989", "category": "cond-mat", "title": "Thermodynamic and magnetocaloric properties of a triangular spin-1/2 cluster with Dzyaloshinskii-Moriya interaction", "abstract": "We present a theoretical investigation of the magnetic and thermodynamic properties of the triangular spin-1/2 cluster with Dzyaloshinskii-Moriya (DM) interaction, described by a spin-1/2 Heisenberg Hamiltonian with antisymmetric exchange interactions. The energy spectrum and ground-state phase diagram reveal the presence of ferromagnetic (FM), ferrimagnetic (FI), and frustrated (FR) phases, strongly influenced by the total spin and the DM interaction. We analyze magnetization and susceptibility, showing that at low temperatures the system exhibits a characteristic 1/3 magnetization plateau, while thermal fluctuations suppress magnetic order at higher temperatures. The entropy and specific heat display residual entropies due to ground-state degeneracies, Schottky-type anomalies at intermediate temperatures, and additional low-temperature features related to phase transitions. Particular attention is given to the magnetocaloric effect (MCE), characterized by both direct and inverse regimes depending on the magnetic field variation. We find that the DM interaction enhances the complexity of the MCE, leading to nontrivial entropy variations as a function of the magnetic field. These results provide insights into the role of frustration and anisotropy in tuning the MCE of properties triangular spin clusters, with relevance to \\mathrm{Cu}_{3}-based molecular magnets.", "url": "https://arxiv.org/abs/2605.29989", "type": "理论+数值", "summary": "1. 该工作理论研究了含Dzyaloshinskii-Moriya相互作用的三角自旋1/2团簇的热力学与磁热性质。\n2. 其卖点在于解析了DM相互作用下铁磁、亚铁磁与阻挫相图，以及低温1/3磁化平台和磁热效应中直接与逆转变的物理机制。\n3. 这为理解阻挫和各向异性在Cu₃基分子磁体中调控磁热效应提供了理论启示。", "summary_source": "deepseek", "authors": [{"name": "Jordana Torrico"}, {"name": "Romulo A. Silva"}, {"name": "S. M. de Souza"}, {"name": "Onofre Rojas"}], "featured_authors": [{"name": "Jordana Torrico"}, {"name": "Romulo A. Silva"}, {"name": "S. M. de Souza"}, {"name": "Onofre Rojas"}], "author_count": 4}, {"id": "2605.30007", "category": "cond-mat", "title": "Hidden Ising models from the generalized Yang-Baxter equation", "abstract": "We introduce a one dimensional spin $\\frac{1}{2}$ Hamiltonian with multi-site interactions, but still local. The algebra of its Hamiltonian densities resembles that of the transverse field Ising model. Using this fact we show that its spectrum is free-fermionic but with a huge degeneracy for each level. The source of the degeneracy is a set of local conserved quantities that act like a classical background field for the quantum system. The thermodynamics of this system is contrasted with the standard Ising model. At the gapless points in the energy spectrum, we show that this system can be derived from the quantum inverse scattering method adapted to a multi-site generalization of the Yang-Baxter equation as introduced by E. Rowell and Z. Wang. The $R$-matrix is constructed using generators of extraspecial 2-groups. This helps us extract all the conserved charges and lay the framework for a general mechanism to generate such multi-site interaction spin systems that are transverse field Ising models under the hood. A remark on how to obtain P. Fendley's free-fermion in disguise models in this formalism is also included.", "url": "https://arxiv.org/abs/2605.30007", "type": "理论", "summary": "1. 该工作引入一类具有多体相互作用的局域一维自旋1/2哈密顿量，证明其谱为自由费米子且能级存在巨大简并。\n2. 卖点在于哈密顿量密度代数类似横向场Ising模型，简并来自一组局域守恒量，通过广义Yang-Baxter方程及extraspecial 2-群的R矩阵构造提取所有守恒荷。\n3. 这为构建多体相互作用隐藏Ising模型提供通用框架，并为理解Fendley的伪装自由费米子模型给出形式化注释。", "summary_source": "deepseek", "authors": [{"name": "Akash Sinha"}, {"name": "Somnath Maity"}, {"name": "Pramod Padmanabhan"}, {"name": "Vladimir Korepin"}], "featured_authors": [{"name": "Akash Sinha"}, {"name": "Somnath Maity"}, {"name": "Pramod Padmanabhan"}, {"name": "Vladimir Korepin"}], "author_count": 4}, {"id": "2605.30012", "category": "cond-mat", "title": "Charting the thermodynamic stability of hybrid perovskite alloys with machine learning", "abstract": "Alloy-based perovskite solar cells offer tunable properties and improved stability, but their complexity has impeded accurate modeling, hindering development. We present a machine-learning (ML) accelerated atomistic modeling approach for the phase stability of (Cs/FA)Pb(Br/I)3 and (Cs/FA)Sn(Br/I)3 perovskites, with FA being formamidinium. To make such quaternary alloys tractable, we adopt a two-level ML strategy, combining 1) graph neural network interatomic potentials trained on density functional theory data for efficient structure relaxations with 2) secondary ML models for direct energy prediction from unrelaxed structures. These models enable computations of free energy landscapes across compositions and phases, capturing alloy disorder and FA molecular orientations. Our results reveal narrower stable composition regions for the Sn-based system compared to its Pb-based counterpart, limiting options for compositional engineering. Maximum stability occurs at high I content, and no stabilization is observed near the center of the composition space. Our results guide the design of stable perovskites.", "url": "https://arxiv.org/abs/2605.30012", "type": "理论+数值", "summary": "1. 该工作提出机器学习加速原子建模方法，系统计算了(Cs/FA)Pb(Br/I)3和(Cs/FA)Sn(Br/I)3四元混合钙钛矿的相稳定性自由能图景。\n2. 其卖点在于两级机器学习策略：图神经网络势函数加速结构弛豫，二级模型直接从未弛豫结构预测能量，有效捕捉合金无序与FA分子取向效应。\n3. 这揭示锡基体系稳定组成区间更窄且最大稳定性位于高碘含量，为中心组成空间无稳定化现象提供了成分工程指导。", "summary_source": "deepseek", "authors": [{"name": "Jarno Laakso"}, {"name": "Armi Tiihonen"}, {"name": "Patrick Rinke"}], "featured_authors": [{"name": "Jarno Laakso"}, {"name": "Armi Tiihonen"}, {"name": "Patrick Rinke"}], "author_count": 3}, {"id": "2605.30016", "category": "cond-mat", "title": "Magnetic precession induced spin accumulation in collinear antiferromagnets", "abstract": "Generating and characterizing uniform and staggered spin polarization in antiferromagnets is one of the key challenges for antiferromagnetic spintronic technology. Here, we perform perturbative theory, group-theoretical symmetry analysis, low energy and ab initio simulations to propose that the magnetic precession near the equilibrium magnetic axis could generate finite uniform and staggered spin polarization at the opposite magnetic sublattices (referring to total magnetic and Néel vector generation) in a single AFM semiconductors. This response does not require the heterojunction setup and could eliminate the lattice mismatch issues at the junction. Through scrutinizing all symmetrically-protected vanishing magnetic moment groups and especially focusing on parity-time (PT ) invariant groups, we identify the symmetry constraints that describe the staggered spin accumulation responses, and disclose their fieldlike and dampinglike characters. This unravels a hidden spin accumulation mode in AFM semiconductors. Furthermore, we simulate such an effect using a perturbative approach and suggest that electric gate field and Floquet light-dressing can effectively manipulate these responses.", "url": "https://arxiv.org/abs/2605.30016", "type": "理论+数值", "summary": "1. 该工作通过微扰理论、群论对称性分析和第一性原理模拟，提出磁性进动可在共线反铁磁半导体中诱导均匀和交错自旋极化。\n2. 其核心发现是无需异质结结构，基于PT不变群的对称性约束可描述交错自旋积累的场致与阻尼特性。\n3. 这揭示了反铁磁半导体中隐藏的自旋积累模式，并为电场门控及Floquet光调控其响应提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Q. Xue"}, {"name": "J. Zhou"}], "featured_authors": [{"name": "Q. Xue"}, {"name": "J. Zhou"}], "author_count": 2}, {"id": "2605.30028", "category": "cond-mat", "title": "Hysteretic Acoustic Band Structures in Shape-Memory Composite Thin Rods", "abstract": "We investigate the propagation of longitudinal elastic waves in one-dimensional periodic composite rods composed of alternating segments of a shape-memory alloy (NiTiCu) and a polymer spacer (Parylene C). In the thin-rod regime, the longitudinal phase velocity reduces to $c=\\sqrt{E/\\rho}$, which coincides with the regime in which the elastic modulus of NiTiCu has been measured directly through its acoustic response across the martensitic transformation. Using the standard transfer-matrix method along the heating and cooling branches of the transformation separately, we compute the Bloch band structure of the infinite periodic system and the transmission spectrum of finite composite rods. Because the elastic modulus of NiTiCu follows different paths upon heating and cooling, the same external temperature within the transformation interval corresponds to two different phase fractions and, consequently, to two different phononic spectra. The resulting hysteresis of the underlying material is thus transferred to the collective acoustic response of the periodic structure: stop-band edges trace closed loops in the temperature--frequency plane, and the transmission coefficient of a finite rod at a fixed temperature depends on the previous thermal history. We further show that the geometric filling fraction of the active segment provides a complementary tuning mechanism, modifying the width of the spectral hysteresis loops and the position of specific gap closures independently of temperature. These results illustrate how a first-order structural phase transition with intrinsic thermal hysteresis manifests itself in the dispersion relation of a periodic elastic medium.", "url": "https://arxiv.org/abs/2605.30028", "type": "理论", "summary": "1. 该工作在一维形状记忆合金/聚合物周期复合细棒中实验测量了纵波的传播，并基于传输矩阵方法计算了其随温度变化的能带结构与透射谱。\n2. 其物理核心在于利用NiTiCu马氏体相变中弹性模量在加热与冷却路径上的差异，使同一温度对应两套声子带结构，导致带边在温度-频率平面形成闭环且透射系数呈现热历史依赖性。\n3. 这为将材料本征热滞后直接映射至周期性弹性介质的色散关系提供了原理验证，启发利用填充分数独立调控谱滞后回环以实现可重配置声子晶体或热记忆声学器件。", "summary_source": "deepseek", "authors": [{"name": "R. Esquivel-Sirvent"}, {"name": "B. Manzanares-Martínez"}, {"name": "J. Manzanares-Martínez"}], "featured_authors": [{"name": "R. Esquivel-Sirvent"}, {"name": "B. Manzanares-Martínez"}, {"name": "J. Manzanares-Martínez"}], "author_count": 3}, {"id": "2605.30061", "category": "cond-mat", "title": "Slave-rotor theory of correlated altermagnets on the Lieb lattice", "abstract": "We investigate the metal-insulator transition driven by the onsite repulsive interaction $U$ in an altermagnetic Hubbard model defined on a Lieb lattice. Using the slave-rotor approach at half filling, we find that the system exhibits a cascade of interaction-driven phase transitions. As $U$ increases, the system evolves from a normal metal to an altermagnetic metal, then to an altermagnetic insulator, and eventually to an altermagnetic Mott insulator characterized by the complete suppression of the quasiparticle weight. These phases are supported by the calculation of the electronic spectral function, which features spin-split bands in both the metallic and insulating regimes. However, the spin splitting becomes substantially suppressed in the Mott insulating phase. Our results suggest that the observation of spin splitting in the spectral function of $d$-wave altermagnets with a Lieb-lattice-like structure may be limited to the weak-to-moderate correlation regime.", "url": "https://arxiv.org/abs/2605.30061", "type": "理论+数值", "summary": "1. 该工作运用奴隶转子方法系统研究了利布晶格半满时交变磁哈伯德模型中库仑排斥U驱动的金属-绝缘体级联相变。\n2. 其核心在于揭示了从正常金属经交变磁金属和交变磁绝缘体到准粒子权重完全消失的交变磁莫特绝缘体的完整相序列，并发现电子谱函数在金属与绝缘态均呈自旋劈裂能带，但莫特相中劈裂被强烈抑制。\n3. 这一结果指明，在d波交变磁体利布晶格类似结构中，谱函数自旋劈裂的实验观测仅存在于弱至中等关联区间，为关联交变磁系统的相图界定提供了理论标尺。", "summary_source": "deepseek", "authors": [{"name": "Vanuildo S. de Carvalho"}, {"name": "Hermann Freire"}, {"name": "Rodrigo G. Pereira"}], "featured_authors": [{"name": "Vanuildo S. de Carvalho"}, {"name": "Hermann Freire"}, {"name": "Rodrigo G. Pereira"}], "author_count": 3}, {"id": "2605.30084", "category": "cond-mat", "title": "Supercooling of liquids, as described by the Enskog-Vlasov kinetic equation", "abstract": "A model combining Enskog's collision integral for dense fluids with a Vlasov-style description of the van der Waals force is applied to supercooling. First, the spinodal temperature $T_{s}$ is calculated, at which a liquid becomes unstable to small perturbations and transitions to solid. In particular, it turns out that isochoric cooling allows one to reach a lower temperature than isobaric cooling. Second, the surface tension of a supercooled liquid-vapor interface is shown to diverge at $T_{s}$. The singularity is caused by an oscillatory region emerging on the liquid side of the interface as $T\\rightarrow T_{s}$; it develops because the liquid approaches instability, and the interface starts radiating (so far, evanescent) waves. At $T=T_{s}$, the waves cease to be evanescent and the oscillatory region extends to infinity -- hence, the singularity of the surface tension. Since this effect has a clear physical interpretation, it should occur regardless of the model and approximations under which it was obtained. This and the other results of the paper are illustrated using argon and several other fluids.", "url": "https://arxiv.org/abs/2605.30084", "type": "理论", "summary": "1. 该工作基于Enskog-Vlasov动理学方程模型研究过冷液体，计算了旋节线温度并发现等容冷却可达到比等压更低的过冷度。\n2. 核心物理在于揭示过冷液体-蒸汽界面表面张力在旋节线处发散的机制：界面液体侧因接近失稳出现振荡区，波由倏逝转为传播，导致振荡区延伸至无穷。\n3. 这一发散效应具有清晰的物理图像，应独立于具体模型而存在，可为理解其他过冷体系中的界面奇异性提供普适启发。", "summary_source": "deepseek", "authors": [{"name": "E. S. Benilov"}], "featured_authors": [{"name": "E. S. Benilov"}], "author_count": 1}, {"id": "2605.30125", "category": "cond-mat", "title": "Quantum Spin-5/2 Blume-Capel Model in a Random Transverse-Cryst
