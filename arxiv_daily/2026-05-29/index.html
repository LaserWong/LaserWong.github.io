alline Field Anisotropy", "abstract": "In this work, we investigate the thermodynamic properties of the quantum Blume-Capel model with spin \\( S = 5/2 \\) in the presence of transverse and random crystalline fields. The system is described by a Hamiltonian that includes ferromagnetic exchange interactions between nearest neighbors, a longitudinal single-ion anisotropy, and a transverse single-ion anisotropy. Using a mean-field approach based on Bogoliubov's inequality for the Gibbs free energy, we derive the fundamental thermodynamic potential and the equation of state for the magnetization. The influence of the longitudinal and transverse anisotropy parameters on the magnetic ordering and phase transitions is analyzed in detail. We present magnetization versus temperature diagrams for various combinations of the anisotropies, exploring both positive and negative values. Our results reveal that the system exhibits standard second-order phase transitions for most parameter ranges, with no evidence of tricritical behavior. However, for certain positive values of the anisotropies, the model displays a first-order phase transition within the ordered phase, characterized by a jump from a higher-spin ordered state to a lower-spin ordered state. The critical temperatures are shown to be sensitive to the magnitude and sign of the anisotropy parameters. In particular, negative transverse anisotropies favor magnetic order, raising the critical temperature, while positive anisotropies promote disorder, lowering the critical temperature. This study provides a comprehensive analysis of the phase diagram of the \\( S = 5/2 \\) quantum Blume-Capel model and highlights the role of transverse fields in modifying the critical behavior.", "url": "https://arxiv.org/abs/2605.30125", "type": "理论+数值", "summary": "1. 该工作采用基于Bogoliubov不等式的平均场方法，研究了自旋S=5/2量子Blume-Capel模型在随机横向晶场各向异性下的热力学性质。\n2. 其技术要点在于系统分析纵向与横向单离子各向异性对磁有序和相变的影响，发现多数参数区呈现二级相变，但正各向异性可在有序相内诱导从高自旋到低自旋态的一级相变。\n3. 这揭示了负横各向异性增强磁有序、提高临界温度，而正各向异性促进无序、降低临界温度，为理解横向晶场在量子自旋体系中的角色提供了相图依据。", "summary_source": "deepseek", "authors": [{"name": "Claudio M. Salgado"}, {"name": "Karollaine C. Leite"}, {"name": "Thiago M. Tunes"}, {"name": "Marcelo F. Z. de Arruda"}, {"name": "Jorge L. B. de Faria"}, {"name": "Alberto S. de Arruda"}], "featured_authors": [{"name": "Claudio M. Salgado"}, {"name": "Karollaine C. Leite"}, {"name": "Thiago M. Tunes"}, {"name": "Marcelo F. Z. de Arruda"}, {"name": "Jorge L. B. de Faria"}, {"name": "Alberto S. de Arruda"}], "author_count": 6}, {"id": "2605.30128", "category": "cond-mat", "title": "Towards exascale fully relativistic pseudopotential density functional theory calculations enabled by mixed-precision computation and compressed-communication using residual based subspace iteration", "abstract": "Noncollinear (NC) magnetism and spin-orbit coupling (SOC) are indispensable for predictive ab initio materials simulations with pronounced relativistic effects and magnetic frustration, yet they significantly increase the cost of cubic-scaling density functional theory (DFT) by introducing complex 2-component wavefunctions per electron and consequently much larger eigenproblems. We present a GPU-centric high-performance framework for NC-SOC DFT that combines: (i) algorithmic advances for solving finite-element (FE) discretized DFT equations; (ii) residual-based Chebyshev filtered subspace iteration (R-ChFSI), tolerant to inexact matrix-vector products, for the resulting sparse generalized eigenproblem; (iii) a matrix-free strategy for accelerating FE Poisson solver; (iv) R-ChFSI-enabled mixed-precision computation with block floating-point compressed MPI communication at compression ratios over 4x, preserving double-precision robustness while reducing compute and data movement costs; and (v) a communication efficient band-partitioning algorithm to improve scalability. Numerical results demonstrate improved time-to-solution and excellent scaling on exascale architectures, enabling fully relativistic pseudopotential DFT simulations of up to 100,000 electrons.", "url": "https://arxiv.org/abs/2605.30128", "type": "理论+数值", "summary": "1. 该工作提出了面向千万亿次架构的GPU-centric全相对论赝势密度泛函理论计算框架，实现了多达100,000电子的模拟。\n2. 其核心卖点是利用残差基切比雪夫滤波子空间迭代，支持混合精度计算和块浮点压缩MPI通信，在超过4倍压缩比下保持双精度鲁棒性，大幅降低计算与数据移动成本。\n3. 这为在极端规模并行系统上高效求解包含非共线磁性与自旋轨道耦合的复杂材料问题提供了可扩展的方法论基础。", "summary_source": "deepseek", "authors": [{"name": "Nikhil Kodali"}, {"name": "Gourab Panigrahi"}, {"name": "Nishant Gupta"}, {"name": "Kartick Ramakrishnan"}, {"name": "Sundaresan G"}, {"name": "Rudra Panch"}, {"name": "Sambit Das"}, {"name": "Vishwas Rao"}, {"name": "Phani Motamarri"}], "featured_authors": [{"name": "Nikhil Kodali"}, {"name": "Gourab Panigrahi"}, {"name": "Nishant Gupta"}, {"name": "Sambit Das"}, {"name": "Vishwas Rao"}, {"name": "Phani Motamarri"}], "author_count": 9}, {"id": "2605.30185", "category": "cond-mat", "title": "Theory of distribution skewness effect on polydisperse random close packing", "abstract": "We investigate the random close packing density, $\\phi_\\textrm{RCP}$, of polydisperse hard sphere systems using a theoretical framework based on the equilibrium model of crowding. We derive a closed-form solution for $\\phi_\\textrm{RCP}$ in terms of the moments of the diameter distribution, enabling an analytical exploration of the effects of polydispersity ($\\delta$) and skewness ($S$) on packing density. For a binary mixture, it is possible to explore a broader range of dependence of $\\phi_\\textrm{RCP}$ on $\\delta$ for a given $S$ or on $S$ for a given $\\delta$. We show that the dependencies of $\\phi_\\textrm{RCP}$ on skewness for a variety of continuous distributions collapse onto a theoretical master curve obtained for the binary mixture case. By correcting the theory so that it obeys known exact limiting behaviours for extreme size asymmetry, our analytical predictions not only agree with previously obtained numerical results, but also predict previously unexplored regions of the $\\phi_\\textrm{RCP}$ parameter space.", "url": "https://arxiv.org/abs/2605.30185", "type": "理论+数值", "summary": "1. 该工作基于平衡拥挤模型，推导出多分散硬球随机密堆积分数关于粒径分布矩的解析表达式。\n2. 其核心在于揭示了偏度对堆积密度的影响，并发现连续分布数据可坍缩至二元混合理论主曲线。\n3. 这为预测极端尺寸不对称等未探索区域的堆积密度提供了可修正的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Vinay Vaibhav"}, {"name": "Carmine Anzivino"}, {"name": "Alessio Zaccone"}], "featured_authors": [{"name": "Vinay Vaibhav"}, {"name": "Carmine Anzivino"}, {"name": "Alessio Zaccone"}], "author_count": 3}, {"id": "2605.30196", "category": "cond-mat", "title": "Role of structure and charge trapping on the bipolaron formation and magnetic-field response of gated conjugated polymers", "abstract": "Conjugated polymers exhibit unique spin-dependent phenomena arising from weak yet critical hyperfine interactions. Understanding these spin effects, particularly the spin-dependent formation and decay of correlated spin pairs, is important for advancing both organic electronics and polymer-based spintronics. Intrinsic magnetic-field responses such as magnetoresistance have primarily been investigated in diode architectures, where electrons and holes coexist. However, such systems are less suitable for probing bipolaron formation in unipolar transport, and the relationship between polymer structure and bipolaron formation in lightly doped polymers remains unclear. Here, we systematically investigate intrinsic magnetoresistance in representative conjugated polymers using field-effect transistors and observe a generally positive magnetoresistance. First-principles simulations reveal that bipolarons preferentially form on short conjugated segments associated with amorphous regions. Moreover, comparisons across these polymers show that enhanced charge trapping correlates with stronger magnetoresistance, implying promoted bipolaron formation. Bipolaron-incorporated energylevel-alignment modeling near metal/polymer interfaces suggests that charge traps can increase the bipolaron density.", "url": "https://arxiv.org/abs/2605.30196", "type": "理论+数值", "summary": "1. 该工作通过场效应晶体管测量共轭聚合物本征磁电阻，结合第一性原理模拟，揭示双极化子优先在无定形区短共轭段形成。\n2. 核心发现是电荷陷阱增强促进双极化子生成并导致正磁电阻，界面能级对齐模型定量解释了陷阱提高双极化子密度的机制。\n3. 这为调控聚合物中自旋相关双极化子动力学及优化有机自旋电子器件磁电阻响应提供了明确理论指导。", "summary_source": "deepseek", "authors": [{"name": "Zuchong Yang"}, {"name": "Vincent Lemaur"}, {"name": "Melissa Berteau-Rainville"}, {"name": "Olivier Bardagot"}, {"name": "Yoann Olivier"}, {"name": "Emanuele Orgiu"}], "featured_authors": [{"name": "Zuchong Yang"}, {"name": "Vincent Lemaur"}, {"name": "Melissa Berteau-Rainville"}, {"name": "Olivier Bardagot"}, {"name": "Yoann Olivier"}, {"name": "Emanuele Orgiu"}], "author_count": 6}, {"id": "2605.28926", "category": "hep-th", "title": "Multi-Loop Negative Geometries", "abstract": "Scattering amplitudes in planar ${\\cal N}=4$ supersymmetric Yang-Mills theory are dual to expectation values of null polygonal Wilson loops. The Amplituhedron provides a geometric construction for the all-loop integrand as the canonical form on the geometric region in the Grassmannian defined by a certain set of inequalities. For a closely related object, the logarithm of the scattering amplitude, the integrand is reproduced in a similar way using negative geometries. When integrated over all loop momenta except one, the result is infrared (IR) finite and equal to the expectation value of a certain Wilson loop with a Lagrangian insertion. At four points, this quantity, ${\\cal F}(g,z)$ only depends on a single cross ratio $z$ and the 't Hooft coupling $g$. At weak coupling, it is known up to three loops from perturbative Wilson loop computations and at strong coupling through the AdS/CFT correspondence at leading order. In this paper, we explore this object further through the lens of the Amplituhedron and negative geometries, which provide very natural IR finite building blocks. We perform an explicit three-loop computation of all negative geometries and show that the number of internal cycles in the diagram is closely linked to the depth of polylogarithms. We calculate the cusp anomalous dimension $\\Gamma_{\\rm cusp}$ by integrating ${\\cal F}(g,z)$ over $z$. We show that the higher-cycle diagrams are suppressed if we consider separate odd and even zeta contributions. Furthermore, we focus on certain convergent infinite series of one-cycle diagrams, perform all-loop order resummations of such contributions, and discuss various features of the result.", "url": "https://arxiv.org/abs/2605.28926", "type": "理论", "summary": "1. 该工作通过Amplituhedron与负几何框架，对平面N=4超杨-米尔斯理论中F(g,z)量进行三圈完整计算，并求其积分得到尖点反常维度Γcusp。\n2. 发现负几何图的内部圈数与多对数函数深度严格对应，且高圈图贡献在区分奇偶zeta时受到压制。\n3. 这对理解红外有限可观测量的微扰结构和全阶重求和提供了几何化启示，并可能推广至其他共形场论。", "summary_source": "deepseek", "authors": [{"name": "Lance J. Dixon"}, {"name": "Umut Oktem"}, {"name": "Shruti Paranjape"}, {"name": "Jaroslav Trnka"}, {"name": "Yongqun Xu"}, {"name": "Shun-Qing Zhang"}], "featured_authors": [{"name": "Lance J. Dixon"}, {"name": "Umut Oktem"}, {"name": "Shruti Paranjape"}, {"name": "Jaroslav Trnka"}, {"name": "Yongqun Xu"}, {"name": "Shun-Qing Zhang"}], "author_count": 6}, {"id": "2605.28933", "category": "hep-th", "title": "Analytic Bootstrap for $O(N)$ Boundary Conformal Field Theories with Interacting Boundaries", "abstract": "We investigate $O(N)$ boundary conformal field theories (BCFTs) with boundary interactions in $d=4-\\epsilon$ and $d=3-\\epsilon$ employing the analytic bootstrap. By deriving universal constraints on conformal data, we show that infinitely many operator expansions can be expressed in terms of a finite set of inputs. Complementing the analytic bootstrap with a perturbative renormalization-group analysis, we identify totally new boundary fixed points in $d=4-\\epsilon$, including non-unitary ones, generated by a boundary cubic coupling, and compute their conformal data to leading order. Moreover, we leverage our solution in $d=3-\\epsilon$ to extract, for the first time, the boundary conformal data for the tricritical $O(N)$ model. Altogether, our approach provides a unified prescription for BCFTs with interacting boundaries and streamlines the determination of bulk and boundary operator expansions.", "url": "https://arxiv.org/abs/2605.28933", "type": "理论", "summary": "1. 该工作运用解析自举与微扰重整化群，系统研究了d=4-ε及d=3-ε中具有边界相互作用的O(N)边界共形场论，发现了包括非幺正新不动点在内的固定点，并首次提取了tricritical O(N)模型的边界共形数据。\n2. 其技术核心是通过导出共形数据普遍约束将无穷算子展开归约为有限输入，结合重整化群分析，统一构建了体算子和边界算子展开的确定方案，为有相互作用边界的边界共形场论提供了自洽框架。\n3. 该框架展示了解析自举在边界临界现象中的普适性与高效性，有望推广至其他对称群或更高阶微扰计算，为系统理解边界共形场论的结构与分类提供清晰路径。", "summary_source": "deepseek", "authors": [{"name": "Xinyu Sun"}, {"name": "Shao-Kai Jian"}, {"name": "Hong Yao"}], "featured_authors": [{"name": "Xinyu Sun"}, {"name": "Shao-Kai Jian"}, {"name": "Hong Yao"}], "author_count": 3}, {"id": "2605.28938", "category": "hep-th", "title": "Gravity Decoupling and Axionic Shift Symmetries", "abstract": "We analyse the rôle of approximate axionic shift symmetries in gravity-decoupling limits arising in type II Calabi-Yau compactifications. Associated with each shift symmetry there is an axionic string whose tension constrains the gradient of the Kähler potential, as expected in regimes where gravity becomes weakly coupled. The gradients of these tensions define vector fields on moduli space, analogous to those associated with BPS particle masses. Together, they characterise the evolution of different effective field theory sectors along asymptotic limits, encoding both their coupling to gravity and their kinetic mixing. By deriving upper bounds on the inner products of these vector fields, we show that they split into mutually orthogonal subsets, one of which decouples from gravity. Finally, we relate the Laplacian of certain axionic string tensions to a divergent moduli space curvature.", "url": "https://arxiv.org/abs/2605.28938", "type": "理论", "summary": "1. 该工作分析II型Calabi-Yau紧致化中近似轴子移对称性在引力退耦极限的核心作用，发现每条对称性对应的轴子弦张力制约Kähler势梯度，这正是引力弱耦合区域的预期行为。\n2. 关键卖点在于张力梯度定义模空间矢量场，与BPS粒子质量梯度矢量场具有类似结构，共同编码不同有效场论扇区沿渐近极限的引力耦合、动能混合及其相互约束。\n3. 通过导出这些矢量场内积的上界，证明其自然分裂为相互正交子集，其中一组完全从引力退耦，并将特定轴子弦张量拉普拉斯算子与模空间曲率发散关联，提供几何新视角。", "summary_source": "deepseek", "authors": [{"name": "Christian Aoufia"}, {"name": "Gonzalo F. Casas"}, {"name": "Fernando Marchesano"}], "featured_authors": [{"name": "Christian Aoufia"}, {"name": "Gonzalo F. Casas"}, {"name": "Fernando Marchesano"}], "author_count": 3}, {"id": "2605.28939", "category": "hep-th", "title": "Dynamical Entanglement Phase Transitions in Holographic CFTs", "abstract": "We study the time evolution of the entanglement structure of holographic conformal field theories after a local quench. Using the mutual information between two spatial intervals as a probe, we find that $1+1$-dimensional conformal field theories exhibit a rich pattern of dynamical phase transitions. In the large-central-charge limit, mutual information develops sharp non-analyticities at critical times, providing a concrete entanglement-based realization of dynamical quantum phase transitions. We find that the dynamics organize into six distinct phases of mutual information, each controlled by the dominance of a different conformal block, or equivalently, a different holographic geodesic configuration. This phase structure goes beyond the standard quasi-particle picture, explaining non-analytic features that are not captured by simple light-cone propagation from the quench points. We further identify a dynamical $D_4$ symmetry acting on the interval endpoints that controls the presence or absence of mutual information. The onset of mutual information is governed by the breaking of this symmetry to a $\\mathbb{Z}_2 \\times \\mathbb{Z}_2$ subgroup, suggesting a symmetry-based characterization of non-equilibrium entanglement dynamics analogous to the role of symmetry in equilibrium critical phenomena. Finally, numerical studies of critical spin chains indicate that finite-$c$ effects smooth out the sharp large-$c$ transitions between different mutual-information phases, while the transitions between phases with and without mutual information appear to remain non-analytic. These results offer a unifying perspective on real-time entanglement dynamics and their critical features in conformal many-body systems.", "url": "https://arxiv.org/abs/2605.28939", "type": "理论", "summary": "1. 该工作通过研究全息共形场论局域淬火后的互信息时间演化，揭示了1+1维CFT中丰富的动力学纠缠相变结构。\n2. 卖点在于互信息动力学组织为六种不同相，每相由特定共形块或全息测地线主导，且互信息开启受D4对称性到Z2×Z2子群破缺控制。\n3. 这为超越准粒子图像理解共形多体系统的实时纠缠动力学及其临界特征提供了对称性描述的普适框架。", "summary_source": "deepseek", "authors": [{"name": "Joseph Dominicus Lap"}, {"name": "Jad C. Halimeh"}, {"name": "David Horn"}, {"name": "Lukas Ebner"}, {"name": "Clemens Seidl"}, {"name": "Berndt Müller"}, {"name": "Andreas Schäfer"}, {"name": "Jakob Minar"}], "featured_authors": [{"name": "Joseph Dominicus Lap"}, {"name": "Jad C. Halimeh"}, {"name": "David Horn"}, {"name": "Berndt Müller"}, {"name": "Andreas Schäfer"}, {"name": "Jakob Minar"}], "author_count": 8}, {"id": "2605.28946", "category": "hep-th", "title": "Constrained integrability and anyonic chains", "abstract": "We review the notion of Yang-Baxter integrability for spin chains that have Hilbert spaces with constraints, such as a Rydberg blockade. We focus on anyonic chains, whose constraints arise from the fusion rules of the fusion categories on which they are based. We discuss the emergence of Temperley-Lieb algebras and present a new result on which types of anyonic chains exhibit them. We then give an overview of known results for integrable anyonic chains and extend them to several fusion categories up to rank $7$. Using a modification of the boost operator formalism, we find several new integrable anyonic chains and discuss some of their properties. These include spin-$\\frac32$ models for $\\mathfrak{su}(2)_k$ fusion categories, anyonic chains based on the Tambara-Yamagami fusion categories TY$(\\mathbb{Z}_n)$, and product fusion categories Fib$\\times$Fib and Fib$\\times$Ising. We review recent results for spin chains based on the Haagerup-Izumi fusion category HI$(\\mathbb{Z}_3)$, and present preliminary numerics for a HI$(\\mathbb{Z}_5)$ model.", "url": "https://arxiv.org/abs/2605.28946", "type": "理论", "summary": "1. 该工作全面回顾任意子链的Yang-Baxter可积性，从融合范畴约束出发，将已知可积模型扩展至秩7范畴，并发现基于su(2)_k自旋-3/2、Tambara-Yamagami型及Fib×Fib等乘积范畴的新可积链。\n2. 技术核心是修正boost算子方法，用于系统识别Temperley-Lieb代数在任意子链中的涌现条件，从而拓展可积分类，并对Haagerup-Izumi HI(Z_5)模型进行了初步数值研究。\n3. 该框架为约束量子系统（如Rydberg阻塞阵列）的可积性提供统一理论，为拓扑量子计算与量子模拟中精确可解模型的实验探索开辟新路径。", "summary_source": "deepseek", "authors": [{"name": "Matthew Blakeney"}, {"name": "Luke Corcoran"}, {"name": "Marius de Leeuw"}], "featured_authors": [{"name": "Matthew Blakeney"}, {"name": "Luke Corcoran"}, {"name": "Marius de Leeuw"}], "author_count": 3}, {"id": "2605.28955", "category": "hep-th", "title": "Bootstrapping the Four-Point NMHV Stress-Tensor Form Factor", "abstract": "We bootstrap the two-loop four-point next-to-maximally helicity-violating (NMHV) ratio function for the chiral stress-tensor form factor in planar maximally supersymmetric Yang-Mills theory (sYM) at the symbol level. Starting from an ansatz built from NMHV leading singularities and the known two-loop five-point one-mass integral function space, we impose finiteness, dihedral symmetry, parity and Galois symmetry, spurious-pole cancellation, collinear limits, and finally triple-collinear consistency, which together fix the result uniquely. We then subject the answer to independent soft and double-soft checks. The resulting symbol contains 78 letters, all drawn from the 88-letter alphabet previously identified for the four-point MHV form factor through four loops. This provides the first multi-loop result for a non-MHV form factor, and direct evidence that the 88-letter alphabet extends beyond the MHV sector, which may provide the natural universal alphabet for four-point form factors. Our result supplies new data for the study of physics and mathematics of multi-loop form factors including the antipodal duality, as well as their relations to Higgs-parton amplitudes in QCD.", "url": "https://arxiv.org/abs/2605.28955", "type": "理论", "summary": "1. 该工作采用自举方法，在符号层面计算了平面N=4超对称杨-米尔斯理论中两圈四点NMHV手征应力张量形状因子比函数。\n2. 从NMHV主导奇异性与两圈五点单质量积分函数空间出发，系统施加有限性、二面体对称性、宇称与伽罗瓦对称性、虚假极点消除、共线极限及三次共线一致性，唯一确定78字母符号解，该字母集源自四圈MHV形状因子88字母字母表。\n3. 首次给出非MHV形状因子多圈结果，证实该88字母字母表可扩展至非MHV扇区，可能构成四点形状因子通用字母表，并为对偶对偶性研究及与QCD希格斯-部分子振幅关联提供新数据。", "summary_source": "deepseek", "authors": [{"name": "Song He"}, {"name": "Jiahao Liu"}, {"name": "Qinglin Yang"}], "featured_authors": [{"name": "Song He"}, {"name": "Jiahao Liu"}, {"name": "Qinglin Yang"}], "author_count": 3}, {"id": "2605.28958", "category": "hep-th", "title": "Quantum State of a Gravitating Region", "abstract": "We propose that any compact $d$-manifold with elliptic data, $\\mathcal{J}$, prepares a quantum state $|\\mathcal{J}\\rangle$ on its $(d-1)$-boundary $\\sigma$. Elliptic data consists of metric and field values, or their conjugates, but not both. No asymptotic structure is required. Inner products and traces are evaluated by the gravitational path integral with closed boundary conditions obtained by gluing elliptic data manifolds. In particular, we give a prescription for the Rényi entropies $S_n$ of a subregion of $\\sigma$. In a class of examples, we find that $S_n$ is nonnegative and nonincreasing with $n$, as required for consistency. We obtain the von Neumann entropy by analytic continuation and find agreement with the minimal surface prescription of Bousso and Penington.", "url": "https://arxiv.org/abs/2605.28958", "type": "理论", "summary": "1. 该工作提出任何具有椭圆数据的紧致d流形可在其(d-1)边界上定义量子态，通过粘合流形构造闭合边界条件并由引力路径积分计算内积与Rényi熵。\n2. 其核心在于无需渐近结构，仅依赖椭圆数据（度规/场值或其共轭）即可给出子区域von Neumann熵的解析延拓处方，且保证非负性与单调性。\n3. 这为无渐近区域的引力系统提供了自洽的量子态描述框架，并与Bousso-Penington最小曲面熵公式一致，可启发全息原理的推广。", "summary_source": "deepseek", "authors": [{"name": "Raphael Bousso"}, {"name": "Sami Kaya"}, {"name": "Guanda Lin"}, {"name": "Arvin Shahbazi-Moghaddam"}], "featured_authors": [{"name": "Raphael Bousso"}, {"name": "Sami Kaya"}, {"name": "Guanda Lin"}, {"name": "Arvin Shahbazi-Moghaddam"}], "author_count": 4}, {"id": "2605.29047", "category": "hep-th", "title": "Asymptotic Quantum Dynamics of Ghost Fields", "abstract": "The dressed propagator of a ghost coupled to ordinary fields develops a pair of complex conjugate poles in the first Riemann sheet above the multi-particle threshold. We study the implications of this pole structure for the asymptotic field and its negative-norm one-particle state. Within the operator formalism of local quantum field theory, we show that interactions between the ghost field and the composite field of the multi-particle state persist at asymptotic times. These induce quantum interference effects that render the negative-norm one-particle state non-orthogonal to, and thus indistinguishable from, a superposition of positive-norm multi-particle states. As a result, no free asymptotic one-particle ghost state exists. The real and imaginary parts of the complex mass admit a clear physical interpretation; in particular, the inverse imaginary part sets the timescale for the onset of non-orthogonality. A freely propagating ghost is therefore confined to time intervals much shorter than its inverse width, so that a detector can never observe an isolated ghost particle asymptotically. Open questions and potential applications are discussed in the conclusions.", "url": "https://arxiv.org/abs/2605.29047", "type": "理论", "summary": "1. 该工作研究了鬼场传播子在多粒子阈以上第一黎曼叶出现复共轭极点对渐近场及其负范数单粒子态的影响。\n2. 其核心在于证明鬼场与复合场相互作用在渐近时间持续存在，量子干涉使负范数态与正范数多粒子态不可区分，从而不存在自由渐近单粒子鬼态。\n3. 复数质量虚部倒数给出非正交性产生的时间尺度，鬼粒子仅能在远小于其逆宽的时间窗口内传播，探测器无法观测孤立鬼粒子，相关模型分析由此获得启发。", "summary_source": "deepseek", "authors": [{"name": "Luca Buoninfante"}], "featured_authors": [{"name": "Luca Buoninfante"}], "author_count": 1}, {"id": "2605.29159", "category": "hep-th", "title": "Asymptotically Safe Gravitational Form Factors from the Proper-Time Flow Equation", "abstract": "We study the renormalization group flow of non-local form factors in four-dimensional quantum gravity within the proper-time formalism at quadratic order in the curvature expansion. We show that the flow equations can be integrated down to $k=0$, allowing the reconstruction of the full momentum dependence of the form factors. Within this framework, we construct asymptotically safe solutions at this order. We find that asymptotic safety of the flow does not automatically ensure a finite cutoff-independent $\\Lambda\\to\\infty$ limit for the integrated solutions, which in general develop a logarithmic divergence $\\ln(q^2/\\Lambda^2)$, so that a renormalization condition is still required. A finite $\\Lambda\\to\\infty$ limit compatible with asymptotic safety is obtained only when the ultraviolet boundary condition selects the non-Gaussian fixed point. This yields finite dimensionful form factors, removes UV logarithmic contributions, and ensures independence from the renormalization scale $\\mu$. The resulting renormalized asymptotically safe form factors display a power-law decay $\\sim1/q^2$ in the ultraviolet and reproduce the expected logarithmic structure in the infrared, with the Planck scale replacing the renormalization scale.", "url": "https://arxiv.org/abs/2605.29159", "type": "理论", "summary": "1. 该工作利用固有时间形式，在曲率二次展开阶研究了四维量子引力中非局域形状因子的重整化群流，并构造了渐近安全解。\n2. 其核心卖点在于将流方程积分至红外极限，恢复形状因子完整动量依赖，并揭示仅当紫外边界条件选择非高斯不动点时，才能获得有限且截断无关的Λ→∞极限及重整化尺度无关性。\n3. 所得重整化渐近安全形状因子在紫外呈~1/q²幂律衰减，红外具预期对数结构，普朗克尺度自然替代重整化尺度，为量子引力非微扰效应提供明确启发。", "summary_source": "deepseek", "authors": [{"name": "Emiliano Maria Glaviano"}], "featured_authors": [{"name": "Emiliano Maria Glaviano"}], "author_count": 1}, {"id": "2605.29282", "category": "hep-th", "title": "Higher Wess-Zumino-Witten term from semistrict higher Chern-Simons theory", "abstract": "We show that in any $2n+2$ dimensions, the higher Chern-Simons action built from a semistrict Lie 2-algebra gives a non-trivial higher Wess-Zumino-Witten (WZW) term under a higher gauge transformation. The key point is that the non-zero Jacobiator directly generates the higher WZW term, hereas it vanishes when reduced to the strict case.", "url": "https://arxiv.org/abs/2605.29282", "type": "理论", "summary": "1. 该工作证明了在任意2n+2维中，由半严格李2-代数构造的高阶Chern-Simons作用量在高阶规范变换下产生非平凡的高阶Wess-Zumino-Witten项。\n2. 其关键卖点在于半严格李2-代数的非零Jacobiator直接生成高阶WZW项，而在严格情形下此项消失。\n3. 这为高维规范理论中拓扑项的构造提供了代数框架，并可能拓展至反常消除及全息对偶领域的研究。", "summary_source": "deepseek", "authors": [{"name": "Mengyao Wu"}], "featured_authors": [{"name": "Mengyao Wu"}], "author_count": 1}, {"id": "2605.29435", "category": "hep-th", "title": "Hypercomplex Yang-Mills Theory as a Bipartite Gauge Field Model", "abstract": "A non-Abelian gauge field framework is proposed using the hypercomplex ring formalism. This extension generates non-compact hyperbolic symmetries, which, alongside the compact gauge symmetries, double the internal degrees of freedom. This will enable the description of bipartite gauge systems and demonstrate how field dissipation operates at the dynamical level. Working within a commutative ring allows for the decoupling of the algebraic structures and facilitates the construction of solutions to the equations of motion.", "url": "https://arxiv.org/abs/2605.29435", "type": "理论", "summary": "1. 该工作基于超复数环形式主义，提出了描述二分规范场系统的超复数杨-米尔斯理论。\n2. 其核心在于引入非紧致双曲对称性，在交换环中实现紧致与非紧致对称性的代数解耦，从而允许构造运动方程的解并刻画场耗散的动力学行为。\n3. 这为研究具有非紧致规范对称性的物理系统（如某些凝聚态或高能模型）提供了可解析处理的理论框架，并启发了对场耗散微观机制的理解。", "summary_source": "deepseek", "authors": [{"name": "C. M. López Arellano"}, {"name": "R. Cartas-Fuentevilla"}], "featured_authors": [{"name": "C. M. López Arellano"}, {"name": "R. Cartas-Fuentevilla"}], "author_count": 2}, {"id": "2605.29789", "category": "hep-th", "title": "Magic Relations and Critical Varieties of Feynman Integrals", "abstract": "Magic relations are a class of integration-by-parts identities where all integrals in the generating sector drop out. Since their presence causes several otherwise successful methods in the Feynman-integral computational pipeline to break down, they are important to detect and understand. In this paper, we take a first step toward a systematic characterization of such identities. Specifically, we observe and argue that the occurrence of magic relations always coincides with the presence of higher-dimensional critical varieties in the generating sector. This provides a practical computational test to check if a family of Feynman integrals can contain magic relations and to find them, which we implement in the ancillary Mathematica file Magic-Test.m. Additionally, we discuss how to count the number of master integrals in the presence of higher-dimensional critical varieties, classify the behavior of magic relations under symmetries, and we discuss their interplay with cuts.", "url": "https://arxiv.org/abs/2605.29789", "type": "理论", "summary": "1. 该工作首次系统刻画了Feynman积分中魔法关系（生成扇区全部积分退出的分部恒等式）与高维临界簇之间的必然联系。\n2. 其核心卖点是提出基于高维临界簇存在的实用计算测试（Magic-Test.m代码），实现魔法关系的自动检测与发现，并拓展了主积分数目在高维临界簇下的计数方法、对称性分类及与切割的相互作用分析。\n3. 这为理解魔法关系导致部分Feynman积分计算管道失效的深层机制提供了理论基础，并为构建更鲁棒的计算方法提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Giulio Crisanti"}, {"name": "Hjalte Frellesvig"}, {"name": "Andrzej Pokraka"}, {"name": "Sid Smith"}], "featured_authors": [{"name": "Giulio Crisanti"}, {"name": "Hjalte Frellesvig"}, {"name": "Andrzej Pokraka"}, {"name": "Sid Smith"}], "author_count": 4}, {"id": "2605.29831", "category": "hep-th", "title": "Five-dimensional Geometry from Spinning Amplitudes", "abstract": "Massive spinor-helicity variables in four dimensions are a useful tool for studying amplitudes between higher-spin fields and gravitons. Among them a special, simple set of amplitudes reproduces the linearized stress-energy tensor of a Kerr black hole in the classical limit. In this work we initiate the study of the classical limit of three-point spinor-helicity amplitudes in five dimensions. We introduce the map between the spinor invariants and the expectation values of spin operators and match the amplitude building blocks with those of the multipole expansion. Interestingly, in order to take the classical limit of a general amplitude, we need to augment the multipole structures with the Hodge dual of the classical spin tensor. We study the classical limit of alternative spinning states not described by fully-symmetric products of polarisations and conclude that they can describe the same spacetimes. Finally, by relaxing the orthogonality condition of the spin tensor we are able to model spacetimes with a single rotational isometry and match these to the classical limit of amplitudes allowing for an internal spin shift. Along the way we also identify the class of amplitudes describing the Myers-Perry black hole and comment on its generalization to arbitrary dimensions.", "url": "https://arxiv.org/abs/2605.29831", "type": "理论", "summary": "1. 本工作系统研究了五维三点自旋-螺旋度振幅的经典极限，建立了其与旋转时空几何的对应关系。\n2. 核心在于将自旋不变量映射为自旋算符期望值，并通过引入经典自旋张量的Hodge对偶来扩充多极结构，从而统一描述具有单旋转等距的时空。\n3. 这为从振幅构建高维Kerr及Myers-Perry黑洞的线性化几何提供了明确路径，并可能推广至任意维度。", "summary_source": "deepseek", "authors": [{"name": "Lucile Cangemi"}, {"name": "Iustin Surubaru"}], "featured_authors": [{"name": "Lucile Cangemi"}, {"name": "Iustin Surubaru"}], "author_count": 2}, {"id": "2605.29923", "category": "hep-th", "title": "Black Hole Photon Rings Saturate the Quantum Chaos Bound", "abstract": "We study the quantum chaos bound in the photon ring region surrounding black holes. By evaluating the Lyapunov exponent associated with unstable null geodesics in a broad class of generalized Kerr geometries, as well as the temperature induced by a string probe, we show that the quantum chaos bound is exactly saturated on equatorial circular orbits of the photon ring. We confirm our result by deriving the same exponent from out-of-time-order correlators in the near ring region. As a byproduct, we show that the photon ring saturation of the quantum chaos bound implies the saturation of the Bekenstein bound on the rate of information emission from the ringdown phase through the quasi-normal modes in the eikonal limit. Our results extend the known correspondence between black hole thermodynamics and chaotic dynamics, highlighting the role of the photon ring as a probe of the fundamental limits on thermalization and information scrambling in black holes.", "url": "https://arxiv.org/abs/2605.29923", "type": "理论", "summary": "1. 该工作通过计算广义Kerr几何中不稳定零测地线的Lyapunov指数以及弦探针诱导的温度，证明了黑洞光子环上的赤道圆轨道精确饱和量子混沌界。\n2. 其核心在于从近环区的out-of-time-order关联函数导出相同指数，并由此表明光子环饱和混沌界同时意味着eikonal极限下准正则模辐射信息的Bekenstein界饱和。\n3. 这扩展了黑洞热力学与混沌动力学的对应关系，凸显光子环作为探测黑洞热化与信息扰乱基本极限的独特探针价值。", "summary_source": "deepseek", "authors": [{"name": "D. Giataganas"}, {"name": "G.F. Giudice"}, {"name": "A. Kehagias"}, {"name": "F. Quevedo"}, {"name": "A. Riotto"}], "featured_authors": [{"name": "D. Giataganas"}, {"name": "G.F. Giudice"}, {"name": "A. Kehagias"}, {"name": "F. Quevedo"}, {"name": "A. Riotto"}], "author_count": 5}, {"id": "2605.29990", "category": "hep-th", "title": "Perturbative Nicolai-Map Diagrammatics: Application to Poincaré Supergravity", "abstract": "We develop a perturbative, diagrammatic framework for constructing Nicolai maps and apply it to four-dimensional $\\mathcal{N}=1$ Poincaré supergravity expanded around flat Minkowski space. It provides an alternative to the coupling-flow-operator construction, which faces several obstructions when extended to local supersymmetry. Expanding the bosonic effective action and the Nicolai map jointly in the gravitational coupling $\\kappa$ and the loop-counting parameter $\\hbar$, we derive the Nicolai-map defining conditions, i.e. the free-action and determinant-matching conditions, order by order. The diagrammatics enumerates all admissible local terms in the Nicolai-map ansatz from the effective-action diagrams and reduces the construction to a finite system of nonlinear polynomial equations. Carried through order $\\kappa^{2}$, the resulting constraints are found to be independent of the detailed bosonic input and hierarchical, order-$\\kappa^{2}$ consistency further restricting the order-$\\kappa$ data. A consistent Nicolai-map construction for the Einstein--Hilbert graviton sector is found to require the Rarita--Schwinger gravitino already at this order: Einstein gravity admits a Nicolai map only through its $\\mathcal{N}=1$ supersymmetric completion, Poincaré supergravity, supporting Nicolai's characterization of supersymmetry.", "url": "https://arxiv.org/abs/2605.29990", "type": "理论", "summary": "1. 该工作发展了微扰的Nicolai映射图解方法，以引力耦合常数κ与圈参数ħ联合展开玻色子有效作用与映射，在四维平坦闵氏时空背景下应用于N=1庞加莱超引力，逐阶导出自由作用与行列式匹配条件，替代了在局域超对称中遇到障碍的耦合流算子构造。\n2. 其技术卖点在于从有效作用图系统地枚举Nicolai映射ansatz中所有允许的局域项，将构造归约为有限非线性多项式方程组，并在κ^2阶发现所得约束与详细玻色子输入无关且呈层次结构，一致性条件进一步限制κ阶数据。\n3. 该框架通过证实爱因斯坦引力只需超对称完备化至庞加莱超引力便容许一致Nicolai映射，支持了Nicolai关于超对称作为该映射存在前提的论断，并为局域超对称中Nicolai映射的图解法研究提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Ji-Seong Chae"}, {"name": "Hun Jang"}, {"name": "Junhyeok Lee"}], "featured_authors": [{"name": "Ji-Seong Chae"}, {"name": "Hun Jang"}, {"name": "Junhyeok Lee"}], "author_count": 3}, {"id": "2605.30098", "category": "hep-th", "title": "Coupling Higher Form Structures of the EFT of Force Free Electrodynamics to Gravity", "abstract": "We know that the charged Reissner Nordstr$ö$m black hole metric is obtained from the Einstein Hilbert gravitational action. This action has the kinetic term $F^2 = (da)^2$. Motivated by the higher-form symmetry structure of the EFT of Force Free Electrodynamics, we replace the Maxwell field-strength contribution in the Einstein Hilbert action by the gauge-invariant combination $(b-da)^2$, where $a_\\mu$ is the worldsheet gauge field and $b_{\\mu\\nu}$ is a background two-form field. This ensures that the new action has a higher form symmetry $b \\rightarrow b+d\\Lambda, a\\rightarrow a+\\Lambda$. Here, unlike in qed, $\\Lambda$ may be any one form (not necessarily a differential one form $\\partial_\\mu \\phi$). The higher form symmetry here is one with the conserved current being a two form and the charge integrated on surfaces. Intuitively, it is the number/current of vector field lines that is conserved here, not the current of particles. Thus, integrating over a surface through which the field lines pierce is sufficient to find the number of these lines that are passing through; so the charge is integrated on surfaces, rather than on the volume. After fixing a particular gauge for the fields $a_\\mu$ and $b_{\\mu\\nu}$, we obtain a generalized black-hole metric. We find that on hypersurfaces satisfying $(r-t)=$ constant, this metric reduces locally to a Reissner Nordstr$ö$m geometry with an effective charge parameter depending on the constant $(r-t)$.", "url": "https://arxiv.org/abs/2605.30098", "type": "理论", "summary": "1. 该工作将无阻力电动力学有效场论的高阶形式对称性耦合至引力，通过用规范不变组合(b-da)²替代F²修改爱因斯坦-希尔伯特作用，其中a为世界面规范场、b为二形式背景场。\n2. 技术核心在于新作用具有b→b+dΛ、a→a+Λ的高阶形式对称性，Λ为任意一形式，其守恒流为二形式、电荷由曲面积分定义，对应矢量场线数守恒而非粒子流守恒。\n3. 所得广义黑洞度规在(r-t)=常数超曲面局域化为Reissner-Nordström几何，有效电荷参数依赖于该常数，为高阶形式结构在引力系统中产生时空依赖电荷提供了具体构造。", "summary_source": "deepseek", "authors": [{"name": "Harsh Anand"}], "featured_authors": [{"name": "Harsh Anand"}], "author_count": 1}, {"id": "2605.30276", "category": "hep-th", "title": "Self-dual holography: four-point AdS/CFT correlators in higher-spin gravity", "abstract": "Self-dual theories, being UV-finite, should have their own AdS/CFT dualities. Higher-spin extensions of self-dual theories are attractive to simplify the CFT duals. The maximal self-dual theory is Chiral higher-spin gravity, which should be dual to a subsector of Chern--Simons matter theories. As a step toward establishing self-dual holography, we develop the Fefferman--Graham expansion and holographic dictionary for arbitrary spin self-dual theories. As an application, we derive bulk-to-bulk propagators and compute three- and four-point AdS/CFT correlators in a contraction of Chiral higher-spin gravity, which is a higher-spin extension of self-dual Yang--Mills theory.", "url": "https://arxiv.org/abs/2605.30276", "type": "理论", "summary": "1. 该工作建立了任意自旋自对偶理论的Fefferman-Graham展开与全息字典，并计算了手性高自旋引力收缩模型中的三点与四点AdS/CFT关联函数。\n2. 其核心在于利用自对偶理论的UV有限性，通过手性高自旋引力与陈-西蒙斯物质子扇区之间的精确对偶，实现了对高自旋全息关联函数的解析推导。\n3. 这为建立自对偶全息对偶的完整框架奠定了基础，并提供了探索更高自旋引力与规范理论对偶的新途径。", "summary_source": "deepseek", "authors": [{"name": "Evgeny Skvortsov"}, {"name": "Richard Van Dongen"}], "featured_authors": [{"name": "Evgeny Skvortsov"}, {"name": "Richard Van Dongen"}], "author_count": 2}, {"id": "2605.30354", "category": "hep-th", "title": "Quiver Approach to Symmetry Theories", "abstract": "Global symmetry anomalies of a quantum field theory (QFT) can be packaged as specific couplings of a higher-dimensional symmetry theory (SymTh). In this work we show that for 5D superconformal field theories (SCFTs) engineered from M-theory backgrounds $X$ a Calabi-Yau cone, this data can be extracted from the path algebra of branes probing $X$. This provides a complementary algebraic approach compared with more geometric computations based on the explicit calculation of triple intersection numbers in a resolved geometry and / or $\\eta$-invariants extracted from the boundary geometry $\\partial X$. Our method applies in situations where the counterpart geometric computation is either unknown or combinatorially unwieldy. We illustrate with several toric threefold examples, including orbifolds $\\mathbb{C}^{3} / \\Gamma$ and more general non-orbifold Calabi-Yau cones of Sasaki-Einstein five-manifolds.", "url": "https://arxiv.org/abs/2605.30354", "type": "理论", "summary": "1. 该工作提出用箭袋路径代数从Calabi-Yau锥的探针系统提取5D超共形场论全局对称性反常的耦合数据。\n2. 其卖点在于将对称性理论计算从几何三重交点数或η不变量转化为代数方法，适用于几何计算未知或组合复杂的情形。\n3. 这为弦论构造中超共形场论对称性反常的研究提供了可互补的代数工具，尤其适用于环面三维流形等非轨道几何背景。", "summary_source": "deepseek", "authors": [{"name": "Vivek Chakrabhavi"}, {"name": "Mirjam Cvetič"}, {"name": "Jonathan J. Heckman"}, {"name": "Shani Meynet"}], "featured_authors": [{"name": "Vivek Chakrabhavi"}, {"name": "Mirjam Cvetič"}, {"name": "Jonathan J. Heckman"}, {"name": "Shani Meynet"}], "author_count": 4}, {"id": "2605.28856", "category": "math-ph", "title": "Inverse scattering for the linear system associated with the coupled Gerdjikov--Ivanov equations", "abstract": "We consider a certain first-order linear system of ordinary differential equations, and we analyze the direct and inverse scattering problems for that linear system. The linear system involves two potentials in the Schwartz class, and those potentials linearly depend on the spectral parameter. This linear system is related to the integrable system of nonlinear partial differential equations known as the DNLS (derivative nonlinear Schrödinger) system III, which is also known as the Gerdjikov--Ivanov system. When analyzing the direct problem, we describe the pertinent properties of the Jost solutions and the scattering coefficients. The bound states poles and the associated normalization constants are represented via a matrix triplet pair, enabling us to deal with any number of bound states and any multiplicities. The inverse scattering problem comprises the determination of the two potentials when the reflection coefficients and the bound-state information are available. To solve the inverse problem, we establish a linear system of integral equations where the kernel and nonhomogeneous term are determined by the Fourier transforms of the reflection coefficients and the matrix triplet pair representing the bound-state information. This system of linear integral equations is the counterpart of the system of Marchenko integral equations available for the AKNS system associated with the integrable NLS (nonlinear Schrödinger) system. We recover the potentials from the solution of our established Marchenko integral system. When we use the time-evolved reflection coefficients and the time-evolved matrix triplets, the corresponding time-evolved potential pair yields a solution of the Gerdjikov--Ivanov system.", "url": "https://arxiv.org/abs/2605.28856", "type": "理论", "summary": "1. 该工作针对含谱参数线性依赖势的耦合Gerdjikov–Ivanov方程组，完整分析了其正、逆散射问题。\n2. 其核心在于利用矩阵三元组统一表征任意数目与重数的束缚态信息，并建立相应Marchenko积分方程以重构势函数。\n3. 所得时演化势对直接给出Gerdjikov–Ivanov系统的解，为派生非线性薛定谔III型系统的可积性研究提供了严格逆散射框架。", "summary_source": "deepseek", "authors": [{"name": "Ramazan Ercan"}], "featured_authors": [{"name": "Ramazan Ercan"}], "author_count": 1}, {"id": "2605.29134", "category": "math-ph", "title": "Transitions with the same energy difference in the Bohr model of the hydrogen atom", "abstract": "In the Bohr model of the hydrogen atom, the energy levels are a negative constant divided by the square of the level number. It is well known that special pairs of transitions exist that have the same energy difference, and a systematic treatment of this is given in the paper by Do and Phan ( arXiv:2010.08338 ). In this paper we describe a simple method (using equal norms of Gaussian integers, and the Brahmagupta--Fibonacci identity) for finding all such pairs of transitions. We also analyze cascades of equal-frequency transitions, and use a theorem due to Fermat to show that cascades with more than three levels are not possible.", "url": "https://arxiv.org/abs/2605.29134", "type": "理论", "summary": "1. 该工作基于高斯整数的等范数和布拉马古普塔-斐波那契恒等式，提出了一种系统找出氢原子玻尔模型中具有相同能量差的所有跃迁对的简单方法。\n2. 其技术核心在于利用数论恒等式将能级差匹配转化为整数范数相等问题，并借助费马定理严格证明等频跃迁的级联不可能超过三个能级。\n3. 这一数论视角为精确刻画玻尔模型中跃迁简并的完整结构提供了封闭解，并可能启发其他能级差值类问题的代数分类研究。", "summary_source": "deepseek", "authors": [{"name": "Matthias W. Reinsch"}], "featured_authors": [{"name": "Matthias W. Reinsch"}], "author_count": 1}, {"id": "2605.29203", "category": "math-ph", "title": "A Lorentzian construction of timelike Liouville field theory on the cylinder", "abstract": "Timelike Liouville field theory is a candidate model for positive curvature two-dimensional quantum gravity, but a mathematically controlled Lorentzian formulation has remained elusive. In this paper we construct the theory on the cylinder $\\mathbb{R}\\times \\mathbb{S}^1$ in the integer screening sector for a natural algebra of renormalized exponential observables. Starting from a renormalized finite-volume torus regularization, we construct infinite-volume Euclidean correlation functions, prove analytic continuation in the time variables, and identify the resulting Lorentzian boundary values by explicit contour formulas. This yields exact Lorentzian correlators for a natural class of exponential observables. We then prove locality: spacelike separated vertex operators commute in the Lorentzian theory. For smeared observables generated by the integer-charge fields $e^{2nb\\phi}$, these Lorentzian expectation values define a vacuum functional on an ordered $*$-algebra and support an AQFT-type quantization without positivity. More precisely, we obtain isotone local algebras, a complete locally convex space $\\mathcal H$ with dense algebraic subspace $\\mathcal H_0$ carrying a nondegenerate Hermitian form (shown to be indefinite for $b<8^{-1/2}$), a continuous cyclic representation, operator-topologically closed represented local algebras, an action of cylinder translations by continuous linear homeomorphisms, and locality for the represented local net. The construction does not produce a Hilbert space or a Haag-Kastler net of local von Neumann algebras in the usual sense, but it shows that a substantial part of the Euclidean-to-Lorentzian and algebraic reconstruction mechanism survives in this nonpositive setting for timelike Liouville theory on the cylinder.", "url": "https://arxiv.org/abs/2605.29203", "type": "理论", "summary": "1. 本文在圆柱面上为类时Liouville场论构造了洛伦兹形式，在整数筛选扇区中通过重正化指数可观测量得到了精确关联函数并证明了局域性。\n2. 其卖点在于从欧几里得环面正则化出发，经解析延拓与围道积分得到洛伦兹边界值，并在非正定AQFT框架下建立了保序局域代数与连续循环表示。\n3. 这启示即使在无希尔伯特空间且正定性缺失时，欧几里得到洛伦兹的解析延拓与代数重构机制仍可部分存活，为二维量子引力非微扰处理提供新范例。", "summary_source": "deepseek", "authors": [{"name": "Sourav Chatterjee"}], "featured_authors": [{"name": "Sourav Chatterjee"}], "author_count": 1}, {"id": "2605.29241", "category": "math-ph", "title": "Connection Factorization in Constrained Quantum Mechanics", "abstract": "We investigate constrained quantum motion on curves and surfaces using connection factorization methods. We show that Laplace operators admit an exact half-connection factorization generated by connection one-forms. The first-order part of the Laplacian is identified with the Darboux rotational connection of the orthogonal frame. Elimination of this rotational connection naturally produces quadratic geometric invariants analogous to supersymmetric Riccati potentials. Using orthonormal moving frames, we derive effective geometric contributions for planar curves, spatial curves, and embedded surfaces. We further analyze Dirac reductions using structure equations and show that for Fermi-type reductions the scalar Jensen--Koppe--da Costa contribution is cancelled in the reduced Dirac sector, leaving a residual first-order spinorial derivative structure. The resulting framework suggests the existence of hidden nilpotent covariant differential complexes naturally generated by geometric connection structures.", "url": "https://arxiv.org/abs/2605.29241", "type": "理论", "summary": "1. 该工作利用连接因子化方法研究了曲线和曲面上约束量子系统的动力学，证明了拉普拉斯算子可被连接一形式精确分解为半连接形式。\n2. 其技术核心在于将拉普拉斯的一阶部分等同为正交标架的Darboux旋转连接，消除该连接后自然产生与超对称Riccati势类似的二次几何不变量。\n3. 这一框架揭示了由几何连接结构自然生成的隐藏幂零协变微分复形，为低维约束量子模型和狄拉克约化提供了新的理论工具。", "summary_source": "deepseek", "authors": [{"name": "A. Nuramatov"}], "featured_authors": [{"name": "A. Nuramatov"}], "author_count": 1}, {"id": "2605.29485", "category": "math-ph", "title": "Robustness of Valley-Hall Interface Modes Against Sharp Bending", "abstract": "It is well known that band inversion across a straight interface in a periodic medium gives rise to interface modes that are localized near the interface and propagate along it inside the bulk spectral gap. This phenomenon constitutes the key mechanism underlying the valley-Hall effect. In this paper, we address the long-standing problem of the robustness of such interface modes. We prove that, when the interface is bent through an angle of $\\frac{2\\pi}{3}$, the interface modes persist for every frequency in the bulk spectral gap where the group velocity is non-vanishing, except for a finite exceptional set. We also show that corner-localized modes, if they occur, can appear only at these exceptional frequencies and have finite multiplicity. To the best of our knowledge, this is the first rigorous mathematical theory of the bending immunity of valley-Hall interface modes.", "url": "https://arxiv.org/abs/2605.29485", "type": "理论", "summary": "1. 该工作严格证明了在周期介质中，当谷霍尔界面以2π/3锐角弯曲时，除有限例外频率外，所有群速度非零的界面模仍存在于体谱隙中。\n2. 其核心卖点在于首次建立弯曲免疫性的严格数学理论，并揭示角局域模仅可能出现在这些例外频率且具有有限重数。\n3. 这为拓扑界面模在复杂路径中的鲁棒传播提供了严谨的理论支撑，并启发对谷霍尔效应抗弯曲极限的进一步量化研究。", "summary_source": "deepseek", "authors": [{"name": "Habib Ammari"}, {"name": "Jiayu Qiu"}], "featured_authors": [{"name": "Habib Ammari"}, {"name": "Jiayu Qiu"}], "author_count": 2}, {"id": "2605.29594", "category": "math-ph", "title": "Free energy expansion of determinantal Coulomb gases in the quadratic fields with a point charge", "abstract": "We study a determinantal Coulomb gas in the complex plane associated with the external potential $$ Q(z)=\\frac{1}{1-\\tau^2}\\big(|z|^2-\\tau \\text{Re } z^2\\big)-2c\\log|z-a|, $$ where $\\tau\\in[0,1)$, $c\\ge0$, and $a\\ge0$. In the regimes where the associated droplet is simply or doubly connected, we derive the free energy expansion up to and including the constant term, with all coefficients computed explicitly, thereby extending recent results in the isotropic case $\\tau=0$. In particular, we identify the constant term with the Liouville action associated with the droplet. Our result admits a natural interpretation in terms of asymptotic expansions of moments of characteristic polynomials for the elliptic Ginibre ensemble. The proof is based on a deformation framework involving both the singularity location $a$ and the anisotropy parameter $\\tau$, relating variations of the free energy to refined asymptotics of planar orthogonal polynomials. The asymptotic analysis relies on the foliation flow method of Hedenmalm and Wennman, providing an alternative to the Riemann--Hilbert approach used in the isotropic setting. The present work suggests a general framework connecting free energy expansions, refined asymptotics of planar orthogonal polynomials, and conformally invariant geometric functionals, with several intermediate results already formulated for general algebraic Hele-Shaw potentials.", "url": "https://arxiv.org/abs/2605.29594", "type": "理论", "summary": "1. 该工作针对含二次势与点电荷对数势的各向异性行列式库仑气体，推导自由能展开至常数项并显式给出所有系数，将各向同性结果推广至各向异性，并确认常数项与液滴区域的Liouville作用量等价。\n2. 其技术核心为构建同时依赖奇点位置与各向异性参数的变形框架，将自由能变化关联至平面正交多项式的精细渐近，并采用叶状流方法替代传统Riemann-Hilbert方法完成分析。\n3. 该结果在椭圆Ginibre系综特征多项式矩的渐近展开中具有自然诠释，并为更一般的代数Hele-Shaw势系统提供了连接自由能展开与共形不变几何泛函的统一框架。", "summary_source": "deepseek", "authors": [{"name": "Sung-Soo Byun"}, {"name": "Meng Yang"}, {"name": "Eui Yoo"}], "featured_authors": [{"name": "Sung-Soo Byun"}, {"name": "Meng Yang"}, {"name": "Eui Yoo"}], "author_count": 3}, {"id": "2605.30006", "category": "math-ph", "title": "Corner Quantization of 4D $BF$ Theory", "abstract": "This note studies the quantized corner structure of four-dimensional $BF$ theory, classifies the associated free and physical corner algebras and constructs possible representations. In the abelian case, for arbitrary closed oriented surfaces and in the presence or absence of a cosmological term, explicit presentations of the corner algebras are obtained in terms of generators and relations, identifying them as infinite-dimensional oscillator-type Lie algebras with an abelian summand. A construction of infinite families of simple modules via bosonic Fock space representations is provided. In the non-abelian case on the torus, the corner algebras are described as quotients constructed from the central extensions of double-loop algebras over certain non-semisimple Lie algebras. A construction of infinite families of simple Fock-type modules of the free corner algebra via an induced module procedure is also provided. The resulting modules descend only trivially to the physical quotient, revealing an obstruction in the present construction in the non-abelian setting.", "url": "https://arxiv.org/abs/2605.30006", "type": "理论", "summary": "1. 该工作研究了四维BF理论的角点量子化结构，分类了自由与物理角点代数，并构造了相关表示。\n2. 其在阿贝尔情形下明确给出了无穷维振子型李代数的生成元与关系，在非阿贝尔情形下描述了来自双环代数中心扩张的商代数。\n3. 阿贝尔情形通过玻色子Fock空间构造了无限系列单模，而非阿贝尔Fock型模仅平凡降落到物理商，揭示了构造障碍。", "summary_source": "deepseek", "authors": [{"name": "Giovanni Canepa"}, {"name": "Alberto S. Cattaneo"}, {"name": "Filippo Fila-Robattino"}, {"name": "Timon Leupp"}], "featured_authors": [{"name": "Giovanni Canepa"}, {"name": "Alberto S. Cattaneo"}, {"name": "Filippo Fila-Robattino"}, {"name": "Timon Leupp"}], "author_count": 4}, {"id": "2605.30176", "category": "math-ph", "title": "The Fermionic Signature Operator in the Reissner-Nordström Geometry in Horizon-Penetrating Coordinates", "abstract": "We study the Dirac equation in the Reissner-Nordström geometry in horizon-penetrating coordinates up to the Cauchy horizon. A mass decomposition theorem is proved, which gives a covariant representation of the spacetime inner product that naturally involves the fermionic signature operator and the fermionic flux operator. We compute their spectra and show that both are bounded symmetric operators on the solution space $\\mathcal{H}_m$ of the massive Dirac equation. The corresponding fermionic projector state is constructed and shown to satisfy the Hadamard condition. Lastly, we give some physical interpretations of the fermionic flux operator.", "url": "https://arxiv.org/abs/2605.30176", "type": "理论", "summary": "1. 该工作基于穿越视界坐标系统一研究了Reissner-Nordström度规下Cauchy视界内的Dirac方程，证明了质量分解定理。\n2. 其核心在于引入费米子签名算符和费米子流算符实现时空内积的协变表示，证明二者为解空间上的有界对称算符，并构造出满足Hadamard条件的费米子投影态。\n3. 这为弯曲时空量子场论中费米子场的边界条件设定及黑洞内部量子涨落分析提供了严谨的算子理论框架。", "summary_source": "deepseek", "authors": [{"name": "Felix Finster"}, {"name": "Christoph Krpoun"}], "featured_authors": [{"name": "Felix Finster"}, {"name": "Christoph Krpoun"}], "author_count": 2}, {"id": "2605.30199", "category": "math-ph", "title": "The Continuum Limit Analysis of Causal Fermion Systems for Curved Spacetimes", "abstract": "We construct the causal fermion system for globally hyperbolic spacetimes starting in the framework of algebraic quantum field theory. The fermionic projector is identified with the one-particle density operator of a quasi-free Hadamard state. The ultraviolet regularization is built into the fermionic projector via a chart-independent $i\\varepsilon$-regularization scheme. The continuum limit analysis is developed in globally hyperbolic spacetimes. It is shown that the Euler-Lagrange equations of the causal action principle are satisfied in this setup if and only if the coupled Einstein-Dirac equations hold.", "url": "https://arxiv.org/abs/2605.30199", "type": "理论", "summary": "1. 该工作从代数量子场论出发，为整体双曲时空构造了因果费米子系统，并建立了其连续极限分析。\n2. 核心在于将费米子投影子等同于准自由Hadamard态的单粒子密度算符，并通过图无关的iε正则化方案实现紫外截断。\n3. 证明了在此框架下因果作用原理的欧拉-拉格朗日方程等价于耦合的爱因斯坦-狄拉克方程。", "summary_source": "deepseek", "authors": [{"name": "Patrick Fischer"}, {"name": "Felix Finster"}], "featured_authors": [{"name": "Patrick Fischer"}, {"name": "Felix Finster"}], "author_count": 2}, {"id": "2605.28859", "category": "quant-ph", "title": "Analytic Properties of the Jost Functions via the Poincaré-Picard Theorem", "abstract": "The analytic properties of the Jost functions are fundamental in quantum scattering theory and in the analytic continuation of the scattering matrix into the complex energy plane. In this work, the analyticity of the Jost functions is investigated from the perspective of parameter-dependent ordinary differential equations. Starting from the radial Schrödinger equation for a short-range central potential, a first-order differential system is derived for the coefficient functions associated with the Ricatti--Bessel and Ricatti--Neumann solutions. The multivalued dependence on the energy variable is shown to originate from the square-root relation between energy and momentum. By explicitly factorizing the momentum-dependent branching terms, the scattering problem is transformed into a differential system whose coefficients are single-valued analytic functions of the complex energy. Using the classical theory of analytic dependence of solutions of ordinary differential equations on parameters, it is shown that the transformed Jost functions are single-valued analytic functions of the energy variable for finite radial distance. The geometric interpretation of the factorization procedure is also discussed in terms of the topology of the associated Riemann surface.", "url": "https://arxiv.org/abs/2605.28859", "type": "理论", "summary": "1. 该工作利用Poincaré-Picard定理，从参数依赖常微分方程角度严格分析了短程势散射中Jost函数在复能量平面的解析性质。\n2. 通过显式因子化动量依赖分支项，将散射问题转化为系数为能量单值解析函数的微分系统，证明变换后Jost函数是能量的单值解析函数。\n3. 这为理解散射矩阵的解析延拓提供了严格的数学框架，其黎曼面拓扑解释有助于揭示复能平面上的分支结构与物理奇点。", "summary_source": "deepseek", "authors": [{"name": "Yannick Mvondo-She"}], "featured_authors": [{"name": "Yannick Mvondo-She"}], "author_count": 1}, {"id": "2605.28875", "category": "quant-ph", "title": "Quantum and Thermal Properties of the Klein-Gordon Inverted Harmonic Oscillator with Physical Applications", "abstract": "We develop a systematic framework for the quantum and thermal properties of a Klein-Gordon scalar field subject to an inverted harmonic potential $-{1\\over2} m^2\\omega^2 x^2$. Starting from a non-Hermitian momentum substitution $P \\to P - m\\omega x$, we employ a symplectic phase-space rotation $V = \\exp\\!\\left[-\\tfrac{\\pi}{8}(xp+px)\\right]$ to map the system onto an analytically tractable effective harmonic oscillator evaluated at $xe^{i\\pi/4}$. This allows us to define a well-regulated partition function $Z(\\beta,\\omega,m)$ and derive closed-form expressions for the free energy, entropy, and thermal correlation functions. We then apply this framework to three physical settings: (i) scalar field fluctuations during cosmological inflation, (ii) quantum fields near black-hole horizons, and (iii) order-parameter dynamics near second-order phase transitions in condensed matter. Our results unify previously scattered results in the literature and provide new predictions for the finite-temperature spectral density and entanglement entropy of unstable quantum systems.", "url": "https://arxiv.org/abs/2605.28875", "type": "理论+数值", "summary": "1. 该工作通过非厄米动量替换与辛相空间旋转，将Klein-Gordon反谐振子系统映射为可解析求解的有效谐振子，并建立了其量子与热力学性质的系统框架。\n2. 主要技术手段是引入$P \\to P - m\\omega x$的非厄米替换并以$\\exp[-\\pi/8(xp+px)]$实现相空间旋转，从而严格导出配分函数、自由能、熵及热关联函数的闭式表达式。\n3. 该框架统一了宇宙学暴胀、黑洞视界附近量子场以及凝聚态二阶相变中不稳定系统的散乱结果，并为有限温谱密度与纠缠熵提供了可检验的理论预测。", "summary_source": "deepseek", "authors": [{"name": "Kevin Hernández"}], "featured_authors": [{"name": "Kevin Hernández"}], "author_count": 1}, {"id": "2605.28885", "category": "quant-ph", "title": "Polar Fidelities, Holevo Bases, and Unitary Factors of Generalized Fidelity", "abstract": "Motivated by several open problems in the Afham-Ferrie theory of generalized fidelity, we study polar fidelities, Holevo bases, and unitary factors on \\(\\Pd\\), the cone of \\(d\\times d\\) complex positive definite matrices. We prove that, for every fixed pair \\(P,Q\\in\\Pd\\), the one-sided polar fidelities \\(x\\mapsto F_{P^x}(P,Q)\\) and \\(x\\mapsto F_{Q^x}(P,Q)\\), as well as their symmetrization, are nondecreasing on \\((-\\infty,1]\\) and nonincreasing on \\([1,\\infty)\\). Hence the polar paths realize exactly the interval \\([\\FM(P,Q),\\FU(P,Q)]\\) on \\([-1,1]\\), yielding pointwise, generally pair-dependent realizations of all \\(z\\)-fidelity values with \\(z\\ge1/2\\) and of the Log-Euclidean fidelity as generalized fidelities. We also show that for \\(d\\ge2\\) and \\(0<z<1/2\\), such realization fails in general, even for interior fidelities. We further solve the fixed-pair Holevo-base equation \\(F_R(P,Q)=\\FH(P,Q)\\), classify all Holevo bases, and classify exactly which unitary factors of generalized fidelity can arise from a base \\(R\\). These are precisely the unitaries \\(W\\) for which \\(P^{-1/2}Q^{1/2}W\\) is similar to a positive definite matrix. This recovers the special-unitary constraint and disproves the global reverse inclusion \\(SU(d)\\) for \\(d\\ge2\\).", "url": "https://arxiv.org/abs/2605.28885", "type": "理论", "summary": "1. 该工作针对正定矩阵锥上的极地保真度、Holevo基及广义保真度的酉因子展开研究，解决了Afham-Ferrie理论中的若干开放问题。\n2. 关键技术结果包括：证明固定对下极地保真度在(-∞,1]上非减、[1,∞)上非增，进而实现所有z≥1/2的z-保真度与对数欧几里得保真度，并揭示0<z<1/2时一般不可实现；同时完全分类Holevo基及可表示出的酉因子，其充要条件为P^{-1/2}Q^{1/2}W相似于正定矩阵。\n3. 这些结果严格刻画了广义保真度谱系的代数与几何结构，特别是反驳了全局逆包含SU(d)的猜想，为量子信息保真度度量提供了更精细的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Trung Dung Vuong"}], "featured_authors": [{"name": "Trung Dung Vuong"}], "author_count": 1}, {"id": "2605.28906", "category": "quant-ph", "title": "Uncertainty relations in classical and quantum theories of electromagnetism", "abstract": "Sharp uncertainty relations restricting the values of variances in the position space and in the momentum (wavevector) space are derived. They have the same form $\\Delta r\\Delta k\\ge 5/2$ in the classical theory of light beams, in the quantum theory of coherent light beams, and in the quantum theory of individual photons.", "url": "https://arxiv.org/abs/2605.28906", "type": "理论", "summary": "1. 该工作在经典光束、相干光束量子及单光子量子理论中统一导出了位置与波矢空间方差的不确定关系。\n2. 其核心在于三种描述均给出相同形式 ΔrΔk≥5/2，揭示了电磁理论中不确定性的普适结构。\n3. 这为经典与量子电磁学中不确定原理的等价性提供了严格证明，可启发相关波动系统的联合测量极限研究。", "summary_source": "deepseek", "authors": [{"name": "Iwo Bialynicki-Birula"}, {"name": "Zofia Bialynicka-Birula"}], "featured_authors": [{"name": "Iwo Bialynicki-Birula"}, {"name": "Zofia Bialynicka-Birula"}], "author_count": 2}, {"id": "2605.28925", "category": "quant-ph", "title": "A local description of strong symmetries and strong-to-weak symmetry breaking in quantum many-body systems", "abstract": "In mixed states of quantum systems, symmetries come in two types: strong and weak. Furthermore, it has been argued that in quantum many-body systems, strong symmetries can be \"spontaneously broken\" down to weak symmetries. An issue is that as previously formulated, such \"strong-to-weak symmetry breaking\" appears to be a fairly non-local effect. In this paper, we show how to understand and diagnose strong symmetries and strong-to-weak symmetry breaking in an explicitly local way. Our main technical tool is a rigorous definition of strong symmetry in the limit of infinite volume, which generalizes the conventional finite-volume definitions, and for which we give several equivalent formulations, including one involving the concept of \"local charge coherence\". Finally, we introduce von Neumann systems, which in infinite-volume symmetries are intermediate between strong and weak symmetries. We derive a Lieb-Schultz-Mattis type anomaly constraint for von Neumann symmetries (and therefore, in particular, strong symmetries) in quantum spin chains.", "url": "https://arxiv.org/abs/2605.28925", "type": "理论", "summary": "1. 本文提出在无限体积极限下严格定义强对称性，并基于局域电荷相干性概念建立其等效形式，从而局域描述量子多体混合态中的强对称性及其向弱对称性的自发破缺。\n2. 核心卖点为将此前视为非局域的强-弱对称性破缺效应转化为明确局域诊断，并引入介于强与弱对称性之间的冯·诺依曼体系对称性。\n3. 所得量子自旋链中冯·诺依曼对称性的Lieb-Schultz-Mattis型异常约束，为理解混合态对称性结构及其物理后果提供了严格的局域框架和可验证的判据。", "summary_source": "deepseek", "authors": [{"name": "Ruizhi Liu"}, {"name": "Jinmin Yi"}, {"name": "Dominic V. Else"}], "featured_authors": [{"name": "Ruizhi Liu"}, {"name": "Jinmin Yi"}, {"name": "Dominic V. Else"}], "author_count": 3}, {"id": "2605.28927", "category": "quant-ph", "title": "Quantum encodings that preserve persistent homology", "abstract": "Given a data set with a notion of distance, such as a point cloud in Euclidean space, topological data analysis (TDA) uses techniques from algebraic topology and metric geometry to infer the topology of a hypothetical manifold from which the data are sampled. This inference is achieved by calculating topological invariants, some of which are difficult to compute classically. Meanwhile, quantum TDA utilizes quantum processes to extract the invariants used in making such inferences in an attempt to speed up the computations. Because applying transformations to the original classical dataset could alter the associated topological invariants, we investigate which quantum encodings would best preserve the invariants of the original dataset. This line of inquiry is distinct from standard approaches in quantum TDA, whose typical starting point is not from the classical dataset directly, but rather from the associated combinatorial objects, such as simplicial complexes, which typically demand a lot of resources to construct. We take the first step at a more direct approach by focusing on which quantum encodings acting directly on the data are admissible for applying quantum algorithms to extract topological features from classical datasets.", "url": "https://arxiv.org/abs/2605.28927", "type": "理论+数值", "summary": "1. 该工作研究了直接作用于经典数据集的量子编码对持续性同调不变量的保持性，区别于标准量子拓扑数据分析从单纯复形出发的间接方法。\n2. 其技术卖点在于系统刻画了从原始数据直接构建量子态时所需的编码条件，避免了高资源消耗的经典几何预处理步骤。\n3. 这为量子算法高效提取经典数据的拓扑特征提供了可操作的编码设计原则，并有望推动量子机器学习与拓扑数据分析的实质性结合。", "summary_source": "deepseek", "authors": [{"name": "Arthur J. Parzygnat"}, {"name": "Andrew Vlasic"}], "featured_authors": [{"name": "Arthur J. Parzygnat"}, {"name": "Andrew Vlasic"}], "author_count": 2}, {"id": "2605.28945", "category": "quant-ph", "title": "Quantum-Enhanced Zero-Error Communication and Storage under Positional Uncertainty", "abstract": "Permutation channels model communication and storage scenarios in which the positional identity of the physical carriers is partially or completely lost, so that the transmitted information is only accessible up to an unknown reordering. Here we show that quantum mechanics can dramatically enhance zero-error communication through such channels. For cyclic reorderings of $n$ $d$-level systems, and in the absence of positional metadata, the number of classical zero-error messages scales asymptotically as $d^n/n$, whereas quantum protocols can fully recover the identity-channel value $d^n$. Ancilla-assisted protocols further increase this number to $d^{2n}/n$, enabling dense coding under positional uncertainty. We also analyze dihedral permutation channels and derive general Pólya-like formulas for the number of distinguishable messages in a broad class of permutation groups. Finally, for the symmetric group $S_n$, corresponding to complete scrambling of the information carriers, the number of distinguishable messages scales as $n^{d-1}$ classically, compared with $n^{d(d+1)/2-1}$ for quantum protocols and $n^{d^2-1}$ in the ancilla-assisted setting. Our results establish a fundamental quantum advantage for communication and storage under positional uncertainty.", "url": "https://arxiv.org/abs/2605.28945", "type": "理论", "summary": "1. 该工作研究排列通道中位置不确定性下的零错误通信与存储，展示了量子协议相较于经典协议的指数级容量提升。\n2. 核心创新在于发现循环重排下量子协议可完全恢复身份信道值 \\(d^n\\)，而辅以辅助量子比特更实现 \\(d^{2n}/n\\) 的密集编码增益。\n3. 这为无位置元数据场景下的量子通信与存储提供了明确界定的优势，并启发了基于群论的通用可区分消息计数框架。", "summary_source": "deepseek", "authors": [{"name": "Arnau Diebra"}, {"name": "David González-Lociga"}, {"name": "Mark Hillery"}, {"name": "John Calsamiglia"}, {"name": "Emili Bagan"}], "featured_authors": [{"name": "Arnau Diebra"}, {"name": "David González-Lociga"}, {"name": "Mark Hillery"}, {"name": "John Calsamiglia"}, {"name": "Emili Bagan"}], "author_count": 5}, {"id": "2605.28967", "category": "quant-ph", "title": "Local Strong-to-Weak Spontaneous Symmetry Breaking", "abstract": "We propose a local notion of strong-to-weak spontaneous symmetry breaking (SW-SSB), through a local one-point fidelity correlator. Compared with the previous definition in terms of a two-point fidelity correlator, our local formulation offers two key advantages: (1) it is easier to detect in large systems: for a system of size $N$ and with ${\\rm poly}(N)$ amount of resources, one can detect the local fidelity order up to volume scale $O(\\log(N))$; and (2) the local SW-SSB order remains well defined in the thermodynamic limit, where the density matrix itself is not well defined. We show that key features of SW-SSB, including stability under finite-depth symmetric channels and long-range conditional mutual information, persist within this local framework. Our definition is conceptually analogous to local thermalization, as exemplified by pure states obeying the eigenstate thermalization hypothesis (ETH). For critical states, the local one-point fidelity correlator defines an interesting class of defect problems. We demonstrate the applicability of the local formulation through several concrete examples, and derive the universal scaling behavior of the local fidelity correlator in a range of critical systems, including ground states of conformal field theories as well as ballistic and diffusive free-fermion metals.", "url": "https://arxiv.org/abs/2605.28967", "type": "理论", "summary": "1. 该工作通过局部单点保真度关联函数提出强到弱自发对称性破缺的局域概念，并验证其在热力学极限下依然良好定义。\n2. 其卖点在于局域表述仅需poly(N)资源即可探测系统体积标度O(log N)的序，且稳定性与长程条件互信息等核心特征仍成立。\n3. 这为临界系统（如共形场论基态、弹道与扩散自由费米子金属）中保真度关联函数的普适标度行为提供了新分类，并类比于满足本征态热化假说的局域热化问题。", "summary_source": "deepseek", "authors": [{"name": "Francisco Divi"}, {"name": "Leonardo A. Lessa"}, {"name": "Chong Wang"}], "featured_authors": [{"name": "Francisco Divi"}, {"name": "Leonardo A. Lessa"}, {"name": "Chong Wang"}], "author_count": 3}, {"id": "2605.29113", "category": "quant-ph", "title": "Local diagnostics for strong-to-weak spontaneous symmetry breaking and non-equilibrium phase transitions", "abstract": "We construct strongly $\\mathbb{Z}_2$-symmetric local Markov/Lindblad dynamics exhibiting transitions between strong-paramagnetic behavior and strong-to-weak spontaneous symmetry breaking. In 1+1d, an absorbing-state construction gives a transition with scaling consistent with the parity-conserving branching-annihilating random-walk universality class. In 2+1d, a pair-flip variant of Toom's rule provides evidence for a stable strong-paramagnetic/weakly symmetry-broken regime and a transition into an active SWSSB regime. We also introduce a marginal fidelity correlator of radius $R$, a local proxy for the usual SWSSB fidelity order parameter requiring tomography only on $\\mathcal{O}(R^d)$-size regions. For broad classes of states, including symmetry-projected Gibbs-like states satisfying suitable local indistinguishability assumptions, we bound the error between the marginal and global fidelity correlators by terms decaying exponentially in $R$. These marginal fidelities provide a model-independent diagnostic of SWSSB in absorbing-state transitions, where microscopic notions of defects or activity are not universal.", "url": "https://arxiv.org/abs/2605.29113", "type": "理论", "summary": "1. 该工作构建强ℤ₂对称局域马尔可夫/林德布拉德动力学，在1+1d和2+1d中实现了从强顺磁到强-弱自发对称性破缺的非平衡相变。\n2. 引入半径R的边缘保真度关联子作为SWSSB局域代理，仅需O(Rᵈ)区域层析，对广类状态证明其与全局保真度的误差指数衰减于R。\n3. 这为吸收态转变中的SWSSB提供了模型无关诊断，可推广至其他非平衡相变及无明确定义缺陷的系统。", "summary_source": "deepseek", "authors": [{"name": "Carolyn Zhang"}], "featured_authors": [{"name": "Carolyn Zhang"}], "author_count": 1}, {"id": "2605.29242", "category": "quant-ph", "title": "Hybrid Gaussian-exponential zero-noise extrapolation for periodic circuits", "abstract": "Zero-noise extrapolation provides a practical means of suppressing gate errors in current noisy intermediate-scale quantum hardware. The accuracy of the zero-noise estimate depends sensitively on the fidelity of the assumed noise model to the actual error scaling. This work introduces a hybrid Gaussian-exponential extrapolation scheme tailored for quantum circuits with periodic structure, which are ubiquitous in quantum algorithms. Under Pauli diagonal errors, by constructing and analyzing an approximate Markov process for the transfer of Pauli operators, we prove a central limit theorem: the noise amplification factor weakly approaches a log-normal distribution, which motivates augmenting the standard exponential model with Gaussian variance corrections. The resulting model requires no prior noise characterization and applies directly to arbitrary periodic circuits. Performance is assessed on Trotterized Ising dynamics, random circuits, and Grover search algorithm using Qiskit noise simulators. For moderate to large circuit depths, the hybrid model yields measurable reductions in bias relative to previous extrapolation variants, indicating its utility for error mitigation on near-term quantum hardware.", "url": "https://arxiv.org/abs/2605.29242", "type": "理论+数值", "summary": "1. 该工作针对周期性量子电路提出一种混合高斯-指数零噪声外推误差抑制方案，无需先验噪声表征即可直接应用。\n2. 其关键卖点是在Pauli对角误差下证明了噪声放大因子弱收敛于对数正态分布，从而引入高斯方差修正标准指数模型以提升外推精度。\n3. 这为近中期量子硬件上周期性算法（如Trotter化动力学、Grover搜索）的实用化误差缓解提供了可直接部署的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Tao Wang"}, {"name": "Yun Shang"}], "featured_authors": [{"name": "Tao Wang"}, {"name": "Yun Shang"}], "author_count": 2}, {"id": "2605.29279", "category": "quant-ph", "title": "Permutation Matrix Representation for Quantum Simulation: Comparative Resource Analysis", "abstract": "We present a comparative study of the permutation matrix representation (PMR) method for Hamiltonian simulation alongside other leading quantum algorithms. Our analysis focuses on resource costs for simulating both time-independent and time-dependent Hamiltonians. For the time-independent case, we benchmark PMR against quantum signal processing (QSP) and qubitization, using the Rydberg interaction Hamiltonian as a representative example. For the time-dependent case, we compare the time-dependent extension of PMR with the quantum highly oscillatory protocol (qHOP), applied to a Floquet-driven transverse field Ising model in arbitrary spatial dimensions. In both regimes, we find that PMR offers complementary advantages in resource requirements and exhibits favorable scaling with certain system parameters, suggesting that it may provide practical benefits on resource-constrained quantum hardware.", "url": "https://arxiv.org/abs/2605.29279", "type": "理论+数值", "summary": "1. 该工作针对量子模拟中的置换矩阵表示法，与量子信号处理、量子化及高频振荡协议等前沿算法展开了资源成本对比研究。\n2. 其技术卖点在于揭示了PMR在模拟时间无关及时间依赖哈密顿量时，对特定系统参数呈现更优缩放，并在资源约束硬件上表现出互补优势。\n3. 这为在资源受限量子设备中利用PMR实现高效量子模拟提供了明确依据，并启发了针对里德伯相互作用及弗洛凯驱动横场伊辛模型等体系的优化方案。", "summary_source": "deepseek", "authors": [{"name": "Hriday Sabharwal"}, {"name": "Itay Hen"}], "featured_authors": [{"name": "Hriday Sabharwal"}, {"name": "Itay Hen"}], "author_count": 2}, {"id": "2605.29374", "category": "quant-ph", "title": "Candidate collapse-noise correlators from Generalized Trace Dynamics: a Hubble-scale spectral line under structural assumptions", "abstract": "We present a conditional construction of candidate CSL-type collapse-noise correlators inspired by Generalized Trace Dynamics (GTD). The construction is not a parameter-free derivation from the minimal GTD Grassmann algebra. It rests on a chain of explicit structural postulates, listed in Section 1; within that auxiliary structure the spectral form and amplitude follow by computation rather than by phenomenological fitting. The resulting narrow-band spectrum at the Hubble scale lies outside the bands of current CSL bounds, so the framework is not in tension with existing high-frequency data. We compute the two-point function of a candidate collapse-noise operator associated with the GTD aikyon decomposition $q_i = q_B + a_0\\beta_i q_F$. In the minimal Grassmann algebra, $q_F$ appears only multiplied by Grassmann generators $\\beta_i$, the reduction of $\\mathrm{Tr}(q_F^\\dagger\\Gamma^\\mu q_F)$ to ghost-mode operators is obstructed by the nilpotent $\\delta\\beta = \\beta_2 - \\beta_1$, and the pure-fermion coefficient $\\beta_1\\beta_2$ has no ordinary sign, modulus, or inverse. We therefore introduce an auxiliary canonical fermionic Fock-space sector for $q_F$, equivalently replacing the nilpotent pure-fermion coefficient by an ordinary effective scalar body parameter. This replacement is an independent structural postulate, not a consequence of the original minimal action. Under this auxiliary postulate, together with a scalar bilinear $J = \\mathrm{Tr}(q_F^\\dagger q_F)$ as bath operator, positive-norm canonical quantization, and an effective sign choice $\\sigma = \\pm1$ for the scalarized pure-fermion sector, elementary Wick contraction gives a Wightman line at $|\\omega| = 2\\omega_0$ with amplitude $A_J = (\\hbar/2m_R\\omega_0 L_{\\mathrm{aik}}^2)^2\\cdot N\\cdot D$. The cosmological identification $\\omega_0 \\sim H_0$ places the line at twice the Hubble scale. [truncated]", "url": "https://arxiv.org/abs/2605.29374", "type": "理论", "summary": "1. 该文基于广义迹动力学，在引入辅助结构假设的链条下，条件性地构造了CSL型坍缩噪声关联函数的候选形式。\n2. 技术上通过将幂零纯费米子系数替换为有效标量体参数，并采用规范量子化与Wick收缩，计算得到位于哈勃尺度二倍的窄带谱线，其振幅无需现象学拟合。\n3. 所得谱线避开当前CSL实验约束频带，为将坍缩模型与宇宙学尺度关联提供了可检验的理论构造路径。", "summary_source": "deepseek", "authors": [{"name": "Tejinder P. Singh"}], "featured_authors": [{"name": "Tejinder P. Singh"}], "author_count": 1}, {"id": "2605.29436", "category": "quant-ph", "title": "Total, quantum, and classical measures of anticoherence for mixed spin states", "abstract": "Anticoherent spin states have isotropic low-order spin moments and are relevant to direction-independent metrology and quantum reference-frame alignment. In contrast to pure states, for mixed states such isotropy may originate either from genuine quantum correlations or from classical statistical mixing. We introduce an axiomatic framework for mixed-state $t$-anticoherence based on the symmetric qubit embedding. We distinguish total $t$-anticoherence, non-decreasing under SU(2)-covariant channels, from quantum $t$-anticoherence, defined as a resource monotone relative to a chosen total measure and constrained to coincide with it on pure states. This yields a classical contribution as their difference. We construct total measures based on reduced-state purity, Hilbert-Schmidt distance, and cumulative multipoles, and we discuss fidelity-based total candidates. We construct quantum counterparts via convex-roof extensions of pure-state functionals tied to bipartite entanglement in the symmetric sector. We provide explicit mixed-state examples, identify states with maximal quantum anticoherence supported on anticoherent subspaces, study robustness under particle loss for different types of states, and characterize the trade-off between purity and the maximal achievable anticoherence order.", "url": "https://arxiv.org/abs/2605.29436", "type": "理论", "summary": "1. 该工作为混合自旋态引入了基于对称量子比特嵌入的公理化t-反相干框架，区分了总反相干与量子反相干。\n2. 其核心在于通过凸包扩展构造量子反相干的资源单调量，使其与纯态上的二分纠缠度量一致，并利用约化态纯度和累积多极矩构建总度量。\n3. 这为定向无关计量和量子参考系中对混合态各向同性资源（尤其是经典与量子贡献的分离）的量化及操控提供了理论工具。", "summary_source": "deepseek", "authors": [{"name": "Jérôme Denis"}, {"name": "Tara Lacaille"}, {"name": "John Martin"}, {"name": "Eduardo Serrano-Ensástiga"}], "featured_authors": [{"name": "Jérôme Denis"}, {"name": "Tara Lacaille"}, {"name": "John Martin"}, {"name": "Eduardo Serrano-Ensástiga"}], "author_count": 4}, {"id": "2605.29508", "category": "quant-ph", "title": "Quantum Markovian Dynamics from a Double Covariance Stochastic Framework", "abstract": "We develop an interacting extension of the Double Covariance Model (DCM), a stochastic subquantum framework in which macroscopic quantum dynamics emerge through coarse-graining of correlated microscopic fluctuations. Starting from local stochastic differential equations on subsystem Hilbert spaces, we derive a closed evolution equation for a coarse-grained double covariance operator using multi-scale Itô calculus and sliding-window averaging. The construction explicitly incorporates two separated temporal scales: a fast microscopic fluctuation scale governing subquantum stochastic processes and a slower macroscopic observation scale associated with coarse-grained dynamics. Within the hydrodynamic limit, where the ratio between microscopic c
