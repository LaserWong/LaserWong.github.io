se $U(1)$ monopole symmetry is enhanced to $SO(3)$. We find that the lowest charge monopole value for QED$_3$ is close to 2 as expected for the emergent $SO(3)$ current, the second lowest charge monopole matches a prediction from a fuzzy sphere calculation, while higher $q$ monopoles match the corresponding sQED$_3$ values with relative error of just one percent. We also find similar evidence for dualities between QED$_3$ with $N=1,k=-(2m+1)/2$ and one scalar coupled to two $U(1)$ gauge fields, which has an effective description as sQED$_3$ with $N=1,k=\\frac{m+1}{m}$ and $q_s=mq_f$ for $m>1$. Finally, by fitting many values of $q$ we show that the $q^0$ term at large $q$ for QED$_3$ takes the same nonzero value that appears in the universal EFT for parity preserving $U(1)$ theories, even though parity is broken for $k\\neq0$. For sQED$_3$, a similar fit gives zero $q^0$ term for $k\\neq0$, unlike the universal nonzero value previously observed for $k=0$.", "url": "https://arxiv.org/abs/2609.37795", "type": "理论", "summary": "1. 我们计算 QED$_3$ 中电荷 $q$ 单极子算子的缩放维数，其中 $N$ 二元复费米子和 Chern-Simons 能级 $k$，在 $k,N$ 很大并且 $k/N$ 固定的情况下以小顺序排列。\n2. 最后，通过拟合 $q$ 的多个值，我们表明 QED$_3$ 的 $q$ 处的 $q^0$ 项采用与奇偶校验保留 $U(1)$ 理论的通用 EFT 中出现的相同的非零值，即使奇偶校验对于 $k\\neq0$ 来说已被破坏。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Shai M. Chester"}, {"name": "Éric Dupuis"}], "featured_authors": [{"name": "Shai M. Chester"}, {"name": "Éric Dupuis"}], "author_count": 2}, {"id": "2609.37806", "category": "hep-th", "title": "Effective Field Theory for Holographic Compact Objects", "abstract": "We study heavy-heavy-light-light correlators in holographic CFTs when the heavy operator is dual to a compact object localized on scales much smaller than the AdS radius. In the long-wavelength regime, the internal structure of the heavy state is described by a worldline effective field theory, whose local operators encode finite-size response coefficients such as tidal Love numbers. Focusing on weakly self-gravitating objects, we show that the Witten diagrams generated by local heavy-light interactions reorganize into the Born series of an effective wave equation for the light bulk field. We reproduce the same correlator by solving this wave equation with localized interactions and identify how the worldline Wilson coefficients are encoded in the CFT data. Our results provide a direct relation between the finite-size response of compact objects in AdS and the dimensions and OPE coefficients of heavy-light and light-light composite operators in the dual CFT.", "url": "https://arxiv.org/abs/2609.37806", "type": "理论", "summary": "1. 当重算子与位于比 AdS 半径小得多的尺度上的致密物体对偶时，我们研究全息 CFT 中的重-重-轻-轻相关器。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Miguel Correia"}, {"name": "Vasco Gonçalves"}, {"name": "Filipe Serrano"}], "featured_authors": [{"name": "Miguel Correia"}, {"name": "Vasco Gonçalves"}, {"name": "Filipe Serrano"}], "author_count": 3}, {"id": "2609.38030", "category": "hep-th", "title": "Diagrammatic construction of GKZ systems for polygonal functions", "abstract": "We investigate the recently introduced polygonal hypergeometric functions [ arXiv:2502.12127 , arXiv:2507.01904 ], which are conjectured to evaluate multipoint parametric one-loop conformal integrals in arbitrary dimensions. These functions can be systematically constructed using a diagrammatic algorithm that operates in terms of simple planar shapes. Given an $n$-point polygonal power series, we formulate the corresponding GKZ hypergeometric system, which admits an explicit diagrammatic interpretation. In particular, the transianic matrix, which encodes all the relevant diagrammatic data, determines the corresponding toric matrix along with a basis of the lattice of relations, thereby singling out a finite subsystem of $n(n-3)/2$ toric equations. This finite subsystem consists of second- and third-order equations, whereas the full toric family also includes higher-order ones. We illustrate the general procedure with several prominent examples of polygonal functions, including the fourth Appell and the Srivastava--Daoust functions.", "url": "https://arxiv.org/abs/2609.38030", "type": "理论", "summary": "1. 该工作针对猜想可计算任意维多点单圈共形积分的多边形超几何函数，系统构建了相应的GKZ超几何系统。\n2. 关键在于以transianic矩阵编码全部图解数据，进而确定环面矩阵与关系格基，挑出n(n-3)/2个二、三阶环面方程的有限子系统。\n3. 这为以平面图形构造超几何系统、并将完整环面方程族约化至有限低阶子系统提供了可推广的程序，第四Appell与Srivastava–Daoust函数即为例证。", "summary_source": "deepseek", "authors": [{"name": "K.B. Alkalaev"}, {"name": "Semyon Mandrygin"}, {"name": "Y.M. Zalishchansky"}], "featured_authors": [{"name": "K.B. Alkalaev"}, {"name": "Semyon Mandrygin"}, {"name": "Y.M. Zalishchansky"}], "author_count": 3}, {"id": "2609.38052", "category": "hep-th", "title": "Logarithmic gravity from a very slow roll limit of inflation", "abstract": "We study the inflationary no-boundary wavefunction in a ``linear-roll limit,'' in which $G_N \\to 0$ while the Hubble scale $H$ and the slope of the inflaton potential are held fixed. Although bulk graviton fluctuations are suppressed in this limit, quantum inflaton fluctuations remain finite. Because reheating occurs on a surface of fixed inflaton value, these fluctuations become fluctuations of the conformal factor of the reheating metric. The probability measure for these fluctuations simplifies drastically and becomes Gaussian, even for large fluctuations. The resulting log-correlated theory at superhorizon scales is a $d$-dimensional analog of Liouville gravity without the exponential potential, which we call Logarithmic Gravity. The quadratic and linear terms are determined by conformally covariant scattering data; in even dimensions we relate them to the critical GJMS operator and Branson $Q$-curvature. From bulk unitarity, we argue that one-loop effects do not generate additional conformal-factor dependence in the physical probability measure, and we verify the cancellation explicitly in $2 + 1$ dimensions. For the no-boundary norm with a rolling inflaton, we show that the noncompact residual conformal symmetries can be gauge fixed with a finite Faddeev-Popov determinant, so they do not force the sphere contribution to vanish. In addition, conditioning on the absence of vacuum decay by bubble nucleation generates the Liouville exponential potential in the probability measure.", "url": "https://arxiv.org/abs/2609.38052", "type": "理论", "summary": "1. 该工作研究暴胀无边界波函数在线性滚动极限下的行为，即保持哈勃尺度和暴胀子势斜率固定而令牛顿常数趋于零。\n2. 其核心是再加热面上的有限量子涨落化为共形因子涨落，概率测度简化为高斯，并给出无指数势的d维刘维尔引力，偶数维项关联临界GJMS算子与Branson Q曲率。\n3. 该结果论证体幺正性下一维环不额外生成共形因子依赖，残余共形对称可用有限法捷耶夫-波波夫行列式规范固定，且条件化无真空衰变更生成刘维尔指数势。", "summary_source": "deepseek", "authors": [{"name": "Jordan Cotler"}, {"name": "Victor Ivo"}, {"name": "Juan Maldacena"}], "featured_authors": [{"name": "Jordan Cotler"}, {"name": "Victor Ivo"}, {"name": "Juan Maldacena"}], "author_count": 3}, {"id": "2609.38064", "category": "hep-th", "title": "On Grey Galaxies and D3-branes on the Conifold", "abstract": "We study the effective potentials for various probe D-branes surrounding AdS$_5$ black holes in consistent truncations of type IIB supergravity on Sasaki-Einstein 5-manifolds $Y^{p,q}$, focusing in particular on the conifold base $T^{1,1}$. The probes are either dual Giant Gravitons having support on AdS spacetime dimensions or D3 probe branes wrapped on non-contractible cycles of the internal manifold, which then appear \"point-like\" in the AdS spacetime. The non-contractible cycles of $T^{1,1}$ and $Y^{p,q}$ topologically stabilize the branes at a finite size, and we find stable supersymmetric wrapped D3 branes on Gutowski-Reall black holes, effectively providing a stable BPS composite system in AdS$_5$ made by a black hole surrounded by a baryonic condensate. We show that the onset of superradiance in the black hole backgrounds matches the emergence of stable minima in the probe effective potentials, extending the constructions of Dual Dressed Black Holes and the Grey Galaxies. We comment on the relevance of this result for recent studies concerning the classical cohomology problem and the associated fortuitous states in the dual Klebanov-Witten theory.", "url": "https://arxiv.org/abs/2609.38064", "type": "理论", "summary": "1. 该文研究了Sasaki-Einstein五维流形Y^{p,q}（尤以锥形底T^{1,1}）上IIB超引力一致截断中AdS5黑洞周围探针D膜的有效势。\n2. 关键在于非收缩闭链可拓扑稳定D3膜，超辐射起始与有效势稳定极小同时出现，并给出重子凝聚包裹Gutowski-Reall黑洞的BPS复合系统。\n3. 该结果扩展了对偶修饰黑洞与灰色星系图景，并可能为Klebanov-Witten对偶中的经典上同调问题及偶然态研究提供线索。", "summary_source": "deepseek", "authors": [{"name": "Antonio Amariti"}, {"name": "Riccardo Salto"}, {"name": "Chiara Toldo"}], "featured_authors": [{"name": "Antonio Amariti"}, {"name": "Riccardo Salto"}, {"name": "Chiara Toldo"}], "author_count": 3}, {"id": "2609.38130", "category": "hep-th", "title": "Boundaries and defects in conformal field theories at finite temperature", "abstract": "We consider conformal boundaries and defects in Euclidean conformal field theory (CFT) at finite temperature and infinite volume. We distinguish defects that wrap the thermal circle and defects that are localised at a point on it. In both set-ups, and for any dimension and co-dimension, we classify bulk one-point functions of scalar, vector and spin-2 primaries. We relate the low-temperature expansion of bulk scalar one-point functions to zero-temperature defect CFT data and new finite-temperature data of defect primaries. For localised defects, we derive one-point bootstrap sum rules using periodicity and the defect operator expansion. We consider several examples in free bulk CFTs: unitary and non-unitary boundary CFTs, a wrapping monodromy defect, and a localised magnetic line. We determine thermal defect CFT data in all examples. For defects wrapping the thermal circle, we compute thermodynamic observables. For localised defects, we observe a Hurwitz zeta function decomposition of one-point functions suggestive of an underlying dispersion relation.", "url": "https://arxiv.org/abs/2609.38130", "type": "理论", "summary": "1. 该工作研究有限温度欧氏CFT中的共形边界与缺陷，区分绕热圈与点局域缺陷，并分类标量、矢量及自旋2原初场的体单点函数。\n2. 其核心是用低温展开联系零温缺陷CFT数据与有限温缺陷原初数据，并导出局域缺陷的单点bootstrap求和规则。\n3. 自由体CFT算例确定了热缺陷CFT数据，缠绕缺陷可算热力学量，局域缺陷的Hurwitz zeta分解暗示潜在色散关系。", "summary_source": "deepseek", "authors": [{"name": "Daniele Artico"}, {"name": "Adam Chalabi"}], "featured_authors": [{"name": "Daniele Artico"}, {"name": "Adam Chalabi"}], "author_count": 2}, {"id": "2609.38151", "category": "hep-th", "title": "CMB Injection Bounds on Moduli Fields", "abstract": "Light scalar fields with gravitational strength interactions (moduli) are ubiquitous in string, supergravity, and extra-dimensional models. If produced in the early universe with lifetimes exceeding the epoch of recombination, slowly decaying moduli inject energetic particles into the Standard Model plasma, leaving distinct imprints on the cosmic microwave background (CMB). In this paper we systematically derive CMB injection bounds on light moduli ($10^3\\ {\\rm eV}\\leq m_{\\rm{mod}}\\leq 10^8\\ {\\rm eV}$) across the primary cosmological production channels: vacuum misalignment, heavy scalar/inflaton decay, thermal emission from the primordial plasma including production from a Hagedorn phase of hot strings. We show that these injection bounds impose stringent constraints that are complementary to both the standard cosmological moduli problem and fifth force bounds.", "url": "https://arxiv.org/abs/2609.38151", "type": "理论", "summary": "1. 该工作系统推导了寿命超过复合时期的轻模场（质量10^3–10^8 eV）衰变并向标准模型等离子体注入能量时，由宇宙微波背景给出的限制。\n2. 其关键在于统一覆盖真空错位、重标量/暴胀子衰变以及原初等离子体热产生（含热弦Hagedorn相贡献）等主要宇宙学产生通道，并给出对引力强度耦合模场的严格约束。\n3. 这些限制与标准宇宙学模问题及第五力实验限制互补，为弦论、超引力和额外维模型中的模场参数空间提供了独立且可检验的约束。", "summary_source": "deepseek", "authors": [{"name": "Naman Agarwal"}, {"name": "Andrew R. Frey"}, {"name": "Ratul Mahanta"}, {"name": "Anshuman Maharana"}, {"name": "Fernando Quevedo"}, {"name": "Gonzalo Villa"}], "featured_authors": [{"name": "Naman Agarwal"}, {"name": "Andrew R. Frey"}, {"name": "Ratul Mahanta"}, {"name": "Anshuman Maharana"}, {"name": "Fernando Quevedo"}, {"name": "Gonzalo Villa"}], "author_count": 6}, {"id": "2609.38167", "category": "hep-th", "title": "Exact bispectra in strongly mixed multifield inflation", "abstract": "Using the effective field theory of inflationary fluctuations extended by a massive isocurvature scalar, at unit sound speed, we compute the primordial bispectra generated by every cubic interaction of dimension four or less in the unitary gauge, with the curvature--isocurvature quadratic mixing resummed to all orders in the dimensionless mixing strength $\\lambda=\\rho/H$. Placing the mixing in the free Hamiltonian [...], every scale-invariant tree-level bispectrum reduces to a single Schwinger-parameter integral over independent leg kernels, and what perturbation theory calls single, double and triple exchange are contact diagrams of the resummed theory. At strong mixing we unveil genuinely new, exact multifield bispectrum shapes with no correlation to the standard shapes used in data analyses. The squeezed limit carries a cosmological collider signal with a universal frequency set by the dressed mass parameter $\\mu_{\\rm eff}$ at every exchange order. At weak mixing the clock coefficients are obtained in closed form and reduce [...] to the known perturbative single- and double-exchange results, exactly; the triple-exchange leading coefficient is obtained in closed form at every mass, in terms of hypergeometric functions, for the first time. At strong mixing the collider amplitude scales as $e^{\\pi(\\lambda-2\\mu_{\\rm eff})/2}$ over the whole $(\\lambda,\\mu_{\\rm eff})$ plane. This encompasses all previously studied regimes as particular cases [...]. A first confrontation of the six exact shapes with the Planck PR4 binned bispectrum shows a preference for strong mixing, where the cosmological collider oscillations invade mildly squeezed configurations [...]. The shapes of all interactions over the whole plane [...] are released with the code that produced them, so that a template at any mixing and mass can be read off in milliseconds.", "url": "https://arxiv.org/abs/2609.38167", "type": "理论", "summary": "1. 该工作用含质量等曲率标量的暴胀涨落有效场论，在单位声速下重求和各阶曲率—等曲率混合，精确计算所有四维及以下三次相互作用生成的原初双谱。\n2. 技术卖点是将混合纳入自由哈密顿量，使尺度不变树级双谱化为独立腿核的单一Schwinger积分，微扰交换成为接触图；强混合给出与标准模板无关的新形状，挤压极限的对撞机频率由修饰质量μ_eff统一设定，振幅按e^{π(λ-2μ_eff)/2}缩放，弱混合下系数闭式约化，并以超几何函数首次给出三交换主导项。\n3. 与Planck PR4分箱双谱的首次对比偏好强混合，且对撞机振荡侵入弱挤压组态；公开的全平面形状和代码可毫秒生成任意混合与质量的模板，为多场暴胀及宇宙对撞机信号提供可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Lucas Pinol"}], "featured_authors": [{"name": "Lucas Pinol"}], "author_count": 1}, {"id": "2609.36009", "category": "math-ph", "title": "Coherent energy cascades in nonlinear disordered Hamiltonians", "abstract": "The familiar wave kinetic theory revolves around turbulent energy cascades characterized by random phases of the individual normal modes. By contrast, recent years have revealed turbulent cascades where the transfer of energy is mediated by phase-coherent dynamics. Such coherent cascades have been previously established in deterministic systems with a tightly controlled algebraic structure of the mode interactions, such as nonlinear Schrödinger equations. Here, we show that the presence of phase-coherent cascades is robust with respect to substantial alterations of the mode couplings. We prove that, in infinite-dimensional resonant Hamiltonian systems with fully resonant normal mode spectra and random nonlinear couplings, a structured subset of couplings --- an infinitesimal fraction of the total --- suffices to support coherent cascades characterized by phase alignment, the formation of power-law spectra, and either unbounded growth of Sobolev norms or a finite-time blow-up. Numerical simulations further demonstrate the emergence of coherent cascades from random initial data through a process of phase locking, suggesting a mechanism for their emergence in broader classes of initial data and systems. We thus show that disordered mode interactions can sustain, rather than block, coherent energy transport across arbitrarily distant scales.", "url": "https://arxiv.org/abs/2609.36009", "type": "理论", "summary": "1. 该工作证明在具有完全共振模式谱与随机非线性耦合的无穷维哈密顿系统中，相干能量级联对模式耦合的显著改变仍稳健：仅需总耦合中极小比例的结构化子集。\n2. 其核心卖点在于，该结构化子集耦合可产生相位锁定、幂律谱，并导致索伯列夫范数无界增长或有限时间爆破；数值模拟进一步显示随机初值能经相位锁定自发涌现相干级联。\n3. 这表明无序模式相互作用非但不必然阻断能量传输，反而能在任意远尺度间维持相干能量输运，为更广泛系统与初值中相干级联的出现提供机制启发。", "summary_source": "deepseek", "authors": [{"name": "Anxo Biasi"}, {"name": "Brad Cownden"}, {"name": "Oleg Evnin"}, {"name": "Alvaro Iturbe Jabaloyes"}], "featured_authors": [{"name": "Anxo Biasi"}, {"name": "Brad Cownden"}, {"name": "Oleg Evnin"}, {"name": "Alvaro Iturbe Jabaloyes"}], "author_count": 4}, {"id": "2609.36332", "category": "math-ph", "title": "Combinatorics and loop equations for antisymmetrised and Hermitised matrix product ensembles", "abstract": "The order $m$ antisymmetrised matrix product ensemble is represented by the product $X_1^T\\cdots X_m^TJX_m\\cdots X_1$, where $X_1,\\ldots,X_m$ are independent real Ginibre matrices and $J$ is the elementary antisymmetric matrix, while the order $m$ Hermitised matrix product ensemble is represented by $X_1^\\dagger\\cdots X_m^\\dagger HX_1\\cdots X_m$, where $X_1,\\ldots,X_m$ are now independent complex Ginibre matrices and $H$ is a Hermitian matrix drawn from the Gaussian unitary ensemble. These ensembles have recently been shown to be related to certain Muttalib--Borodin ensembles and integrals of Harish-Chandra--Itzykson--Zuber type, thereby motivating further investigation into their eigenvalue statistics. In this work, we construct ribbon graphs and constellations that are enumerated by the mixed cumulants of these ensembles and give loop equation characterisations for the generating functions of said cumulants when $m=1$.", "url": "https://arxiv.org/abs/2609.36332", "type": "理论", "summary": "1. 该工作针对反对称化与 Hermitised 矩阵乘积系综，构造了由混合累积量枚举的 ribbon 图与星座。\n2. 关键卖点是在 m=1 时用 loop equation 刻画这些累积量生成函数，衔接组合枚举与随机矩阵谱统计。\n3. 这为研究其本征值统计及与 Muttalib-Borodin 系综、HCIZ 型积分的联系提供了组合与 loop 方程工具。", "summary_source": "deepseek", "authors": [{"name": "Stephane Dartois"}, {"name": "Anas. A Rahman"}], "featured_authors": [{"name": "Stephane Dartois"}, {"name": "Anas. A Rahman"}], "author_count": 2}, {"id": "2609.36792", "category": "math-ph", "title": "Analysis of Delay Differential Equations Using the Offset Linear Canonical Transform", "abstract": "Motivated by the work of Ohira and the advantages of the offset linear canonical transform (OLCT) over the Fourier transform (FT), this paper proposes an OLCT based framework for solving a class of delay differential equations. By exploiting the operational properties of the OLCT, the original delay differ- ential equation is transformed into a Volterra-type delay integral equation in the transform domain and solved numerically using Brunners method of steps . An explicit analytical solution is derived for a special case to investigate the effect of the delay parameter. A unified transform-domain formulation is also established by relating the proposed OLCT approach to its Fourier transform counterpart. Numerical and graphical results demonstrate the accuracy and effectiveness of the proposed method and validate it through comparisons with the Fourier transform based formulation of Ohira . The proposed framework may provide a promising foundation for solving non linear delay differential equations involving transcendental terms, as both the OLCT and the resulting Volterra integral equation possess the essential properties required to handle non linearities and transcendental terms.", "url": "https://arxiv.org/abs/2609.36792", "type": "理论", "summary": "1. 该文提出基于偏移线性正则变换（OLCT）的框架求解一类延迟微分方程，利用OLCT运算性质将原方程化为变换域中的Volterra型延迟积分方程，并采用Brunner步进法数值求解，同时对特殊情形给出显式解析解以考察延迟参数影响。\n2. 其核心卖点在于借助OLCT相对Fourier变换的灵活性建立统一变换域表述，并通过与Ohira的Fourier变换方法对比验证数值精度与有效性。\n3. 该框架有望为处理含超越项的非线性延迟微分方程提供基础，因为OLCT与所得Volterra积分方程具备处理非线性与超越项所需的关键性质。", "summary_source": "deepseek", "authors": [{"name": "Gita Rani Mahato Manab Kundu"}], "featured_authors": [{"name": "Gita Rani Mahato Manab Kundu"}], "author_count": 1}, {"id": "2609.36897", "category": "math-ph", "title": "Reduced Solutions of Toda Systems for Arbitrary Complex Simple Lie Algebras", "abstract": "We study reduced solutions of Toda systems generated by spherical metrics for an arbitrary complex simple Lie algebra. The main result is an intrinsic centralizer parametrization: for a spherical metric, the reduced family is the positive Iwasawa slice cut out by the centralizer of the principal image of closure of monodromy group. As an application, we transfer existing spherical-metric existence results to the diagonal Toda source tuple.", "url": "https://arxiv.org/abs/2609.36897", "type": "理论", "summary": "1. 该文研究了由球面度量生成的任意复单李代数 Toda 系统的约化解。\n2. 核心结果是内蕴中心化子参数化：球面度量的约化族由单值群闭包主像的中心化子截出正岩泽切片。\n3. 作为应用，可将已有球面度量存在性结果迁移至对角 Toda 源元组。", "summary_source": "deepseek", "authors": [{"name": "Yiqian Shi"}, {"name": "Chunhui Wei"}, {"name": "Bin Xu"}], "featured_authors": [{"name": "Yiqian Shi"}, {"name": "Chunhui Wei"}, {"name": "Bin Xu"}], "author_count": 3}, {"id": "2609.37060", "category": "math-ph", "title": "Exact Elastodynamic Homogenization of Laminated Composites Revisited", "abstract": "This paper revisits Willis' elastodynamic homogenization (Mechanics of Materials, 41 (2009) 385-393) of periodic laminate composites and uses the equivalent inclusion-based method (EIM) to evaluate the unique effective constitutive properties with eigen-fields. The microstructure-specific Green's function is essential in Willis's exact homogenization method, which was derived from the corresponding periodic laminates. Our re-examination identifies several algebraic differences in the published formulae for the Floquet number and the related effective properties. In parallel, this paper simulates inhomogeneities with a comparison medium containing two eigen-fields, namely eigenstrain and eigen-momentum, to simulate stiffness and mass density mismatch, respectively. Therefore, the general Green's function can be directly used. The exact homogenization method with the updated specific Green's function is compared to the proposed EIM with eigen-fields homogenization scheme, and excellent agreement is obtained. The present paper provides a base to extend the homogenization framework to multi-dimensional Willis-type homogenization.", "url": "https://arxiv.org/abs/2609.37060", "type": "理论", "summary": "1. 该文重新审视了Willis关于周期层状复合材料的精确弹性动力学均匀化理论，并修正了已发表公式中的若干代数差异。\n2. 其核心手法是引入含本征应变与本征动量的双本征场等效夹杂法，以统一处理刚度与质量密度失配，并避免使用微观结构专属格林函数。\n3. 修正后的精确均匀化结果与等效夹杂法高度一致，为向多维Willis型均匀化框架推广奠定了基础。", "summary_source": "deepseek", "authors": [{"name": "Chunlin Wu"}, {"name": "Huiming Yin"}], "featured_authors": [{"name": "Chunlin Wu"}, {"name": "Huiming Yin"}], "author_count": 2}, {"id": "2609.37333", "category": "math-ph", "title": "Tripartite System Dynamics of Cooperation Ecological Resources and Adaptive Regulation", "abstract": "To address commons dilemmas under costly social cooperation, this paper develops a tripartite coevolutionary system that integrates social behavior, ecological resource dynamics, and institutional regulation. Institutional intervention is modeled as an adaptive feedback mechanism whose intensity responds to deviations from prescribed cooperation and ecological targets. Through equilibrium analysis, stability analysis, and phase space characterization, we identify the principal operating regimes and transition mechanisms of the coupled system. The results show that the system admits a sustainable operating equilibrium in which cooperation, ecological resources, and institutional regulation coexist. We further establish the structural stability of a desirable operating state characterized by full cooperation, peak resource availability, and persistently minimal intervention. In addition to these stable regimes, the system exhibits bistability and limit cycles, indicating that alternative long term outcomes may arise from different initial conditions and parameter configurations. These nonlinear mechanisms generate a persistent crackdown rebound policy trap, in which intensified intervention temporarily improves cooperation and resource conditions but eventually produces recurrent oscillations and prevents system wide consensus. The proposed framework provides a system level explanation of governance failure and offers analytical insights for designing adaptive institutional regulation in coupled human environment systems.", "url": "https://arxiv.org/abs/2609.37333", "type": "理论", "summary": "1. 该文构建了耦合社会行为、生态资源与制度调控的三方协同演化系统，并以自适应反馈建模制度干预强度。\n2. 其卖点是通过平衡态、稳定性与相空间分析识别运行区制与转变，并揭示自适应反馈导致的双稳、极限环及“严打—反弹”政策陷阱。\n3. 该框架从系统层面解释治理失灵，并为耦合人类—环境系统中的自适应制度调控设计提供分析启示。", "summary_source": "deepseek", "authors": [{"name": "Linjie Liu"}, {"name": "Yike Li"}, {"name": "Shijia Hua"}], "featured_authors": [{"name": "Linjie Liu"}, {"name": "Yike Li"}, {"name": "Shijia Hua"}], "author_count": 3}, {"id": "2609.37411", "category": "math-ph", "title": "A posteriori controllability of non-linear remodelling in linear elastic continua", "abstract": "We investigate the a posteriori controllability of remodelling within the framework of Geometric Control Theory applied to continuum systems. Remodelling is described through an isochoric Bilby--Kroner--Lee decomposition, where the internal structural transformation is represented by a remodelling tensor and its evolution is governed by a stress-driven constitutive law. Assuming infinitesimal deformation and remodelling stretches, while retaining finite rotations of the principal remodelling directions, we derive a nonlinear state-space representation in terms of principal remodelling stretches and orientation variables. This formulation allows the remodelling process to be interpreted as a finite-dimensional nonlinear control system parametrised by the material position. Equilibrium configurations are characterised, and under-actuated controllability problems are studied by means of the tools of Geometric Control Theory. The three-dimensional setting shows that the nonlinear coupling between remodelling stretches and orientations enables complete steering of the internal state through a reduced number of independent controls, while the planar reduction reveals a loss of controllability despite the presence of nonlinearity. The results provide a first systematic investigation of remodelling controllability and further support the development of Continuum Control Theory as a framework for the analysis and design of controlled internal structural transformations in continuous media.", "url": "https://arxiv.org/abs/2609.37411", "type": "理论", "summary": "1. 我们研究了应用于连续体系统的几何控制理论框架内重构的后验可控性。\n2. 三维设置表明，重塑拉伸和方向之间的非线性耦合可以通过减少独立控制的数量来完全控制内部状态，而平面还原则揭示了尽管存在非线性，但可控性的损失。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Salvatore Di Stefano"}, {"name": "Marta Zoppello"}], "featured_authors": [{"name": "Salvatore Di Stefano"}, {"name": "Marta Zoppello"}], "author_count": 2}, {"id": "2609.37696", "category": "math-ph", "title": "Distribution of Scattering Matrix Elements in the case of Symplectic Symmetry", "abstract": "Scattering theory is at the core of gaining information about most quantum systems. In general, analytic progress is difficult and the investigation of universal features using statistical methods is of interest. Commonly this is carried out within the Heidelberg approach which models the Hamiltonian of the target by a random matrix. Hitherto, such investigations were performed for systems that are effectively spinless or have total angular momentum conservation. In light of recent experimental progress it has become relevant to also investigate systems with half-integer spin. Using supersymmetry, we derive the distribution for the real and imaginary parts of the scattering matrix elements and the corresponding cross sections in the case of symplectic symmetry. These results complete the derivations for Dysons threefold way.", "url": "https://arxiv.org/abs/2609.37696", "type": "理论", "summary": "1. 该工作针对具有半整数自旋、因而由辛对称性支配的量子散射系统，在随机矩阵海德堡框架下推导散射矩阵元实部与虚部的分布以及相应截面分布。\n2. 其核心方法是用超对称技术处理辛对称性系综，从而把此前主要限于无自旋或总角动量守恒情形的统计散射理论推广到自旋轨道耦合显著的系统，并补全戴森三分类。\n3. 这一结果使半整数自旋介观或混沌散射实验可直接检验辛对称性统计，也为进一步比较三类对称性下的普适涨落与截面关联提供了基准。", "summary_source": "deepseek", "authors": [{"name": "Nils Gluth"}, {"name": "Thomas Guhr"}], "featured_authors": [{"name": "Nils Gluth"}, {"name": "Thomas Guhr"}], "author_count": 2}, {"id": "2609.37724", "category": "math-ph", "title": "Influence of Time Reversal Invariance Breaking on the Distribution of Off-Diagonal Scattering Matrix Elements and Cross Sections", "abstract": "Scattering theory is a key tool for the investigation of quantum systems. Universal approaches are of interest, particularly in the framework of Random Matrix Theory. Dyson's Threefold way classifies systems according to their behavior under time reversal. In these three cases the distribution of off-diagonal scattering matrix elements and cross sections were recently calculated. However, in many applications systems neither display full nor fully broken time reversal invariance, such as systems in tuneable external magnetic fields. The study of these systems has a long history, also in Random Matrix Theory. We investigate the influence of time reversal invariance breaking on the universal behavior of the mentioned distributions. Using supersymmetry we succeed in deriving exact expressions for the distribution of off-diagonal scattering matrix elements and cross sections in systems with half-integer or integer/no spin in the absence of further symmetries. We find that the distributions are symmetric while the scattering matrix elements are not. Furthermore, our results might considerably facilitate the data analysis of time reversal invariance breaking.", "url": "https://arxiv.org/abs/2609.37724", "type": "理论", "summary": "1. 该工作研究时间反演不变性部分破缺（如可调外磁场下既非完全保持亦非完全破缺）对非对角散射矩阵元与截面分布的普适行为的影响，利用超对称方法分别在自旋为半整数与整数（含零）且无其他对称性的情形下导出了精确表达式。\n2. 其核心卖点在于给出了破缺过程中分布的严格解析结果，并指出分布本身关于某一变换对称，而散射矩阵元并不具备该对称性，从而将Dyson三分类之间的中间区间纳入统一的随机矩阵理论描述。\n3. 该结果可用于提取时间反演破缺强度的数据分析，并为存在部分破缺对称性的量子输运与散射实验提供更可靠的普适拟合框架。", "summary_source": "deepseek", "authors": [{"name": "Nils Gluth"}, {"name": "Ahmed Aldabag"}, {"name": "Thomas Guhr"}], "featured_authors": [{"name": "Nils Gluth"}, {"name": "Ahmed Aldabag"}, {"name": "Thomas Guhr"}], "author_count": 3}, {"id": "2609.37738", "category": "math-ph", "title": "Breaking the Spin Degeneracy for Distributions of Off-Diagonal Scattering Matrix Elements in the Case of Symplectic Symmetry", "abstract": "Recently derived exact expressions for the distributions of scattering matrix elements show that all combinations of ingoing and outgoing spin orientations are equally distributed. We propose a model suitable for experimental realization that breaks this degeneracy by introducing a spin preference in the channels. With the help of supersymmetry we derive a corresponding nonlinear sigma model. We exactly calculate the distributions of real and imaginary part in first order of the parameter measuring the preference. Quite remarkably, while breaking the spin degeneracy leads to different distributions for the favored and unfavored spin orientation, the real and imaginary parts of these altered distributions are the same as in the case of unbroken spin degeneracy.", "url": "https://arxiv.org/abs/2609.37738", "type": "理论", "summary": "1. 该工作针对辛对称性下非对角散射矩阵元分布中自旋取向完全简并的现象，提出了一个在通道中引入自旋偏好、可在实验上实现的模型来打破这一简并。\n2. 其技术核心是借助超对称方法导出相应的非线性σ模型，并在偏好参数的一阶近似下精确求得散射矩阵元实部与虚部的分布。\n3. 最值得注意的是，尽管自旋偏好与非偏好取向的分布已不同，但两者的实部与虚部分布仍与未破缺自旋简并情形一致，这为自旋分辨的散射统计实验提供了可检验的预言。", "summary_source": "deepseek", "authors": [{"name": "Nils Gluth"}, {"name": "Thomas Guhr"}], "featured_authors": [{"name": "Nils Gluth"}, {"name": "Thomas Guhr"}], "author_count": 2}, {"id": "2609.37943", "category": "math-ph", "title": "Continuum Limit for One-Dimensional Moiré Relaxation", "abstract": "We establish convergence of minimizers for a minimal one dimensional atomic-scale model for relaxation in moiré materials to those of a one-dimensional continuum limit functional analogous to those commonly used in practice to model relaxation. The atomic-scale model consists of two periodic chains containing $N$ and $N+1$ atoms per common cell and is exactly moiré-periodic at the atomic scale. Its energy combines harmonic nearest-neighbor intralayer interactions with nonlocal interlayer interactions generated by an even $C^2$ pair potential with polynomial decay. The associated continuum energy couples linear elasticity to a periodic misfit potential, obtained by periodizing the pair potential, which penalizes unfavorable local stackings.", "url": "https://arxiv.org/abs/2609.37943", "type": "理论", "summary": "1. 该工作为一维莫尔材料弛豫的极小原子尺度模型建立严格连续极限，证明其能量最小化序列收敛到常用连续泛函的最小化子。\n2. 原子模型由每公共胞含N与N+1原子的两条周期链构成，层内为谐振近邻作用，层间为具多项式衰减偶C^2对势的非局域耦合；极限泛函将线性弹性与由周期化对势得到的周期失配势耦合，惩罚不利堆叠。\n3. 这为实践中经验性使用的连续弛豫模型提供微观推导基础，并启示可将类似收敛框架推广到更高维莫尔体系及层间相互作用更一般的设定。", "summary_source": "deepseek", "authors": [{"name": "Hao Lan"}, {"name": "Michael Hott"}, {"name": "Jeff Calder"}, {"name": "Alexander B. Watson"}], "featured_authors": [{"name": "Hao Lan"}, {"name": "Michael Hott"}, {"name": "Jeff Calder"}, {"name": "Alexander B. Watson"}], "author_count": 4}, {"id": "2609.38017", "category": "math-ph", "title": "Quantum percolation conjecture on regular trees", "abstract": "For Bernoulli bond percolation on every regular tree of degree at least three, we prove that infinite clusters appear strictly before absolutely continuous spectrum. Throughout an explicit supercritical interval, the adjacency operator of every open cluster almost surely has no absolutely continuous component. Together with Bordenave's theorem, this gives $p_c<p_{ac}<1$.", "url": "https://arxiv.org/abs/2609.38017", "type": "理论", "summary": "1. 该工作严格证明，在度至少为三的正则树上，伯努利键渗流中的无限簇出现严格早于绝对连续谱的出现，并由此分离经典渗流阈值与量子渗流阈值。\n2. 其技术核心在于构造一个显式超临界区间，并证明在该区间内每个开簇的邻接算子几乎必然没有绝对连续谱分量，结合Bordenave定理后得到 p_c<p_ac<1。\n3. 这解决了正则树上的量子渗流猜想，并为随机图上的谱相变、无序系统中的局域化以及后续量子渗流与谱理论交叉研究提供了明确的评判基准与启发。", "summary_source": "deepseek", "authors": [{"name": "Simon Becker"}, {"name": "Izak Oltman"}], "featured_authors": [{"name": "Simon Becker"}, {"name": "Izak Oltman"}], "author_count": 2}, {"id": "2609.38074", "category": "math-ph", "title": "On the Spectrum of Some Temperley-Lieb Spin Chains", "abstract": "We review mathematical results about the spectrum of spin-$s$ chains with a nearest neighbor interaction given by the projection onto the singlet state of two spin-$s$ degrees of freedom. Up to normalization, these interaction terms generate a Temperley-Lieb algebra at loop parameter $d=2s+1$. We also present several new results. First, we prove a ferromagnetic ordering of energy levels across symmetry sectors of the model, thus generalizing a previous result of Nachtergaele, Spitzer and Starr (2004) for the spin-$\\tfrac12$ $XXZ$ chain. This enables us to determine a uniform lower bound on the finite volume spectral gap for these spin chains. By combining a variational estimate with Knabe's finite size criterion, we show that the exact spectral gap of the GNS Hamiltonian of the fully polarized state is $1-2/d$. Furthermore, this value serves as a lower bound for the gap of the maximally mixed ground state. Finally, we show that the ground state projectors on open chains satisfy the Jones-Wenzl recursion, thereby recovering a known result that the degeneracies are the quantum integers $[L+1]_q$ for $q+q^{-1}=d$. We discuss how the high degeneracy of the ground states allows the model to break a continuous symmetry while remaining gapped, and renders that gap unstable.", "url": "https://arxiv.org/abs/2609.38074", "type": "理论", "summary": "1. 该工作综述自旋-s链的谱理论：最近邻相互作用取两自旋-s单态投影，归一化后生成环参数d=2s+1的Temperley-Lieb代数，并提出若干新结果。\n2. 主要卖点是证明跨对称扇区的能级铁磁序，推广了Nachtergaele-Spitzer-Starr关于自旋-1/2 XXZ链的结论；结合变分估计与Knabe有限尺寸判据，得到全极化态GNS哈密顿量精确能隙1-2/d，并作为最大混合基态能隙下界；开链基态投影子满足Jones-Wenzl递推，简并度为量子整数[L+1]_q。\n3. 这一高简并谱结构使模型能在保持能隙的同时破缺连续对称性，但也使该能隙不稳定；这为Temperley-Lieb自旋链的对称破缺、能隙稳定性及有限体积谱分析提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Robert Ferydouni"}, {"name": "Bruno Nachtergaele"}], "featured_authors": [{"name": "Robert Ferydouni"}, {"name": "Bruno Nachtergaele"}], "author_count": 2}, {"id": "2609.35978", "category": "quant-ph", "title": "Chern-number estimation: nearly optimal quantum algorithm and provable quantum speedup", "abstract": "Topological phases of matter are characterized by global properties of quantum states beyond conventional local order parameters. The Chern number is a central invariant in this characterization, linking the geometry of quantum states to robust physical observables and making its determination key to understanding quantum matter. We construct a nearly optimal quantum algorithm for estimating the Chern number of a smooth Hamiltonian family over a two-dimensional parameter torus with a unique, gapped ground state, including interacting many-body systems. The algorithm transports and reuses two ground-state copies prepared at a single reference point and uses generalized quantum signal processing to coherently accumulate geometric phases. It achieves a Hamiltonian-oracle evolution time of $\\tilde{O}(L_xL_y/\\Delta_{\\min}^3)$, where $L_x,L_y$ bound the parameter derivatives of the Hamiltonian and $\\Delta_{\\min}$ is a known spectral-gap lower bound. We prove a matching worst-case oracle lower bound, even when the Chern number is promised to be zero or one, establishing optimality up to polylogarithmic factors. For local Hamiltonian families with an inverse-polynomial gap and a supplied guiding state, exact Chern-number computation is in $\\mathsf{FBQP}$ and is $\\mathsf{BQP}$-hard, and merely deciding whether the Chern number is zero or one is already $\\mathsf{BQP}$-complete. These results establish how efficiently quantum computers can estimate a quantized topological invariant and provide evidence for quantum advantage in characterizing topological phases.", "url": "https://arxiv.org/abs/2609.35978", "type": "理论+数值", "summary": "1. 物质的拓扑相的特征是量子态的全局特性超出了传统的局域序参数。\n2. 对于具有逆多项式间隙和提供的引导状态的局部哈密顿族，精确的陈数计算在 $\\mathsf{FBQP}$ 中，并且是 $\\mathsf{BQP}$ 困难的，并且仅仅确定陈数是零还是一就已经是 $\\mathsf{BQP}$ 完成的。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Soichiro Imamura"}, {"name": "Shintaro Ae"}, {"name": "Kazuki Sakamoto"}, {"name": "Ryu Hayakawa"}, {"name": "Chusei Kiumi"}], "featured_authors": [{"name": "Soichiro Imamura"}, {"name": "Shintaro Ae"}, {"name": "Kazuki Sakamoto"}, {"name": "Ryu Hayakawa"}, {"name": "Chusei Kiumi"}], "author_count": 5}, {"id": "2609.35986", "category": "quant-ph", "title": "Asymptotically Optimal Mixed-State Cloning", "abstract": "We determine asymptotic global fidelities of cloning generic mixed states with simple (non-degenerate) full-rank spectra. In fixed dimension $d$, let $n$ inputs and $m_n$ outputs satisfy $m_n/n\\to\\gamma>1$. For a known simple full-rank spectrum $p_1>\\cdots>p_d>0$, we prove that the optimal root fidelity between the entire output and the product target state is $$ F_\\rm{orb}(\\gamma,p) =\\prod_{i<j} \\frac{\\sqrt{\\gamma}+\\sqrt{q_{ij}(\\gamma-1+q_{ij})}} {\\gamma+q_{ij}}, \\qquad q_{ij}=\\frac{p_j}{p_i}. $$ When the spectrum is unknown, one spectrum-independent cloner attains $$ F_\\rm{univ}(\\gamma,p) =\\left(\\frac{2\\sqrt\\gamma}{1+\\gamma}\\right)^{(d-1)/2} F_\\rm{orb}(\\gamma,p), $$ uniformly on compact subsets of the simple full-rank chamber and is minimax optimal. The two factors quantify spectral and eigenbasis uncertainty. Our channels combine classical processing of Schur--Weyl labels with a covariant Cartan-sector channel. Local asymptotic normality and a Gaussian fidelity bound against arbitrary channels yield the converses. For flat projector states $\\rho=P/r$, with $P$ a rank-$r$ orthogonal projector, we separately prove the optimum $\\gamma^{-r(d-r)/2}$. Furthermore, we estimate the exact asymptotic fidelity of purify--clone--trace (PCT), and show that our cloners strictly outperform PCT at every fixed gain for simple full-rank spectra and rank-$r$ projector states with $1<r<d$.", "url": "https://arxiv.org/abs/2609.35986", "type": "理论", "summary": "1. 该工作确定了具有简单满秩谱的混合态渐近最优克隆问题，给出已知谱、未知谱通用克隆以及秩-r投影态的最优全局根保真度。\n2. 其主要卖点是构造了结合Schur-Weyl标签经典处理与协变Cartan扇区信道的克隆方案，并用局部渐近正态性与高斯保真度上界证明逆命题；未知谱时通用克隆器在简单满秩区域达到minimax最优，两因子分别量化谱与特征基不确定性。\n3. 该结果给出混合态克隆的渐近极限，并证明在固定增益下所提克隆器严格优于纯化-克隆-追踪（PCT）方案，对量子克隆、态估计与信息处理基准具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Jiani Fei"}, {"name": "Jinzhao Wang"}], "featured_authors": [{"name": "Jiani Fei"}, {"name": "Jinzhao Wang"}], "author_count": 2}, {"id": "2609.35990", "category": "quant-ph", "title": "Out-of-time-order Correlators in Volcano potentials", "abstract": "The out-of-time-order correlator (OTOC) has emerged as an important diagnostic for quantum information scrambling and a key signature of quantum chaos. In this work, we discuss out-of-time-order correlators, analytically and numerically, for the so-called Volcano potentials. This family of potentials parametrically interpolates between bounded wells and confining walls, and includes Pöschl-Teller as a specific case. Through a combination of numerical diagonalization and semiclassical analysis, we investigate various regimes of the potential parameter regimes containing regions of both positive and negative curvatures. Moreover, we demonstrate in this case that short-time exponential growth of the OTOC does not necessarily signal global quantum chaos; instead, it correlates with the sampling of negative curvature regions by excited states.", "url": "https://arxiv.org/abs/2609.35990", "type": "理论+数值", "summary": "1. 该工作对 Volcano 势中的 OTOC 进行了解析与数值研究，结合数值对角化和半经典分析，覆盖从有限深势阱到约束壁的参数区间，并包含 Pöschl-Teller 特例。\n2. 其卖点在于在同时具有正、负曲率的参数范围内表明，短时 OTOC 指数增长未必指示全局量子混沌，而是与激发态采样负曲率区域相关联。\n3. 这提示短时指数增长应被视为局部几何不稳定性而非全局混沌的充分证据，并需结合谱统计或更长时间行为等指标来诊断信息扰乱。", "summary_source": "deepseek", "authors": [{"name": "Aritra Banerjee"}, {"name": "Reetik Jangir"}, {"name": "Rishant Sharma"}], "featured_authors": [{"name": "Aritra Banerjee"}, {"name": "Reetik Jangir"}, {"name": "Rishant Sharma"}], "author_count": 3}, {"id": "2609.36006", "category": "quant-ph", "title": "Fast Hamiltonian engineering from cut polytope geometry", "abstract": "Hamiltonian engineering (HE) simulates quantum dynamics under a target Hamiltonian using a native entangling system Hamiltonian and restricted control, with applications from quantum gate design to analog quantum simulation. Observing that, for many systems, formulating HE as a linear program only requires specific commutation relations between the control pulses and the system Hamiltonian, we provide a unified framework for broad classes of $2$-local qubit, qudit, and fermionic systems. We reformulate time-optimal HE as a complex $k$-cut polytope problem, with $k$ the number of distinct phases in these commutation relations, and prove it NP-complete for every finite $k$. We therefore relax the polytope to the elliptope and apply a Krivine-type rounding, yielding pulses informed by the system and target Hamiltonians, which we then use in a linear program. We derive how many informed pulses are necessary and sufficient for the linear program to be reliably feasible. Additionally mixing in uniformly sampled pulses guarantees a solution close to the relaxation value from $\\mathrm{O}(m)$ pulses, with $m$ the number of interaction terms. Together with upper and lower bounds on the optimal quantum run time, this yields an $\\mathrm{O}(\\sqrt{m})$ approximation ratio. In benchmarks on a fully connected Ising model, a chiral clock model for qudits, and the fermionic Harper-Hofstadter model, our approach attains near-optimal quantum run times wherever the optimum is computable, reaches run times that saturate with the lattice size in the fermionic case, and outperforms state-of-the-art methods with $\\mathrm{O}(m)$ pulses. This establishes a unified approach with provable guarantees to the automatic programming of analog quantum simulators.", "url": "https://arxiv.org/abs/2609.36006", "type": "理论+数值", "summary": "1. 该工作提出统一框架，将时间最优哈密顿量工程重述为复k-割多面体问题，证明对任意有限k均NP完全，并通过椭球体松弛与Krivine型舍入结合线性规划构造控制脉冲。\n2. 其卖点在于仅依赖控制脉冲与系统哈密顿量的对易关系，给出信息脉冲必要充分数量及混入均匀脉冲后O(m)脉冲逼近松弛值的保证，并导出O(√m)近似比与运行时间上下界。\n3. 在完全连通Ising、qudit手性时钟和费米子Harper-Hofstadter基准中，该方法在最优可计算时达到近最优、费米情形运行时间随格点尺寸饱和且优于现有O(m)脉冲方法，为模拟量子模拟器自动编程提供可证明保证的统一途径。", "summary_source": "deepseek", "authors": [{"name": "Thomas Joachim Friese"}, {"name": "Özgün Kum"}, {"name": "Aram W. Harrow"}, {"name": "Martin Kliesch"}], "featured_authors": [{"name": "Thomas Joachim Friese"}, {"name": "Özgün Kum"}, {"name": "Aram W. Harrow"}, {"name": "Martin Kliesch"}], "author_count": 4}, {"id": "2609.36008", "category": "quant-ph", "title": "Entanglement spectrum and magic in higher-dimensional free fermionic systems", "abstract": "We study fermionic non-local magic in higher-dimensional free-fermion systems through the lens of the entanglement spectrum. For translationally invariant Gaussian states in strip geometries, dimensional reduction maps the problem to independent lower-dimensional momentum sectors, leading in two dimensions to a multiplicative logarithmic violation of the boundary law analogous to Gioev-Klich-Widom scaling. We further show that the second Rényi fermionic non-local magic is bounded by the capacity of entanglement and introduce an entanglement-temperature deformation that probes the low-energy structure of the entanglement Hamiltonian. Applied to the matter-Majorana sector of the Kitaev model, this response is exponentially suppressed in the Abelian phase and algebraic in the non-Abelian phase, where its ratio with the capacity approaches a universal constant. Out of equilibrium, we extend the quasi-particle description to fermionic non-local magic in higher-dimensional quenches and show that random Gaussian circuits exhibit diffusive spreading in two spatial dimensions.", "url": "https://arxiv.org/abs/2609.36008", "type": "理论", "summary": "1. 我们通过纠缠谱的透镜研究高维自由费米子系统中的费米子非局域魔法。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Beatrice Magni"}, {"name": "Daniele Iannotti"}, {"name": "Riccardo Travaglino"}], "featured_authors": [{"name": "Beatrice Magni"}, {"name": "Daniele Iannotti"}, {"name": "Riccardo Travaglino"}], "author_count": 3}, {"id": "2609.36016", "category": "quant-ph", "title": "Is rapid mixing stable?", "abstract": "Several physically interesting Lindbladians, such as those describing generic open quantum system models as well as engineered state preparation processes, are often rapidly mixing, that is, they relax to steady states in time scaling polylogarithmically with the system size. Owing to the short mixing times, it is physically expected that local perturbations do not substantially increase the mixing time. In this work we question this expectation and ask whether rapid mixing survives. We provide counterexamples showing that rapid mixing is not stable in general, even when the perturbation does not change the steady state. We also show that arbitrarily weak local Hamiltonian perturbations can destroy rapid mixing. Complementing these results, we develop an array of sufficient conditions which imply stable rapid mixing, including several classes of quasifree fermionic systems, commuting Lindbladians, and local spin systems. We also identify conditions under which modified logarithmic Sobolev inequalities (MLSIs), a stronger form of convergence, lead to stable rapid mixing. As a further implication of our results, we show that rapid mixing does not imply a positive MLSI constant.", "url": "https://arxiv.org/abs/2609.36016", "type": "理论", "summary": "1. 该工作审视开放量子系统中Lindblad动力学快混合的稳定性，追问局域微扰是否仍使弛豫到稳态的时间随系统尺寸呈多对数增长。\n2. 其核心在于构造反例表明快混合一般不稳定：即使稳态不变，任意弱的局域哈密顿微扰也能破坏快混合；并给出稳定快混合的充分条件，包括准自由费米子、对易Lindbladian和局域自旋系统，以及修正对数Sobolev不等式（MLSI）导致稳定快混合的条件。\n3. 该结果进一步表明快混合并不蕴含正的MLSI常数，提示开放多体态制备与耗散工程中须区分混合时间稳定性与更强收敛判据。", "summary_source": "deepseek", "authors": [{"name": "Jordi A. Montañà-López"}, {"name": "Barbara Roos"}, {"name": "Sebastian Stengele"}, {"name": "Ángela Capel"}, {"name": "Rahul Trivedi"}], "featured_authors": [{"name": "Jordi A. Montañà-López"}, {"name": "Barbara Roos"}, {"name": "Sebastian Stengele"}, {"name": "Ángela Capel"}, {"name": "Rahul Trivedi"}], "author_count": 5}, {"id": "2609.36029", "category": "quant-ph", "title": "Out-of-Time-Ordered Correlators Beyond Lindblad", "abstract": "Out-of-time-ordered correlators (OTOCs) provide a powerful probe of quantum chaos and scrambling. While the Lindblad formalism is often used to describe OTOCs in open systems, microscopic mechanisms that give rise to the Lindblad equation at the level of time-ordered correlation functions do not necessarily justify this approach at the level of OTOCs. Starting from a microscopic model of a subsystem coupled to a random bath, we show that the resulting OTOC dynamics contains an additional contribution compared to the standard Lindblad approach. This contribution, induced by correlations between different replicas, allows key properties of the underlying unitary dynamics such as long-time freeness to be retained and information scrambling to be captured more faithfully. As an application, we show that this extended formalism can be used to numerically study OTOCs in large closed systems by replacing part of the system with a dissipative boundary, offering a way to study operator spreading and higher-order correlations beyond directly accessible system sizes.", "url": "https://arxiv.org/abs/2609.36029", "type": "理论+数值", "summary": "1. 该工作从子系统耦合随机浴的微观模型出发，推导了超越 Lindblad 的 OTOC 动力学，并揭示不同复本间关联会引入标准 Lindblad 描述所缺失的额外贡献。\n2. 其核心卖点在于更忠实地保留底层幺正动力学的长时自由性并刻画信息扰乱，同时可将部分系统替换为耗散边界，以数值研究超出直接可及尺寸的算符扩散和高阶关联。\n3. 这为开放量子系统中的 OTOC、量子混沌与信息扰乱提供了更微观一致的描述框架，并启发用耗散边界模拟大闭合系统的非局域关联与算符增长。", "summary_source": "deepseek", "authors": [{"name": "Elisa Vallini"}, {"name": "Felix Fritzsch"}, {"name": "Pieter W. Claeys"}], "featured_authors": [{"name": "Elisa Vallini"}, {"name": "Felix Fritzsch"}, {"name": "Pieter W. Claeys"}], "author_count": 3}, {"id": "2609.36113", "category": "quant-ph", "title": "Collectivity limits quantum entanglement", "abstract": "Understanding what limits many-body quantum entanglement is a central problem in physics. Spatial locality has long provided a fundamental mechanism: correlations between a region and its complement must be mediated through a small spatial interface, thereby constraining their entanglement. Here we show that universal constraints on entanglement can persist even when interactions are strongly nonlocal, through collectivity: many weak interactions suppress collective quantum fluctuations while retaining a finite overall interaction scale. We establish this mechanism rigorously for generic gapped Hamiltonians with Kac-normalized power-law interactions $r^{-\\alpha}$ on a $D$-dimensional lattice. For arbitrary bipartitions, we prove that the ground-state entanglement scales at most logarithmically with system size for $\\alpha<D/2$ and subextensively for $D/2<\\alpha<D$, due to suppressed collective fluctuations around individual sites. For spatially regular bipartitions with codimension-one boundaries, we show that collective suppression can be propagated to successively larger length scales through a renormalization-group construction. As a result, we prove that the entanglement bound improves to polylogarithmic scaling for $D/2<\\alpha<(D+1)/2$, and remains parametrically stronger than the arbitrary-bipartition bound for $(D+1)/2<\\alpha<D$. Together, these results reveal collectivity as a fundamental mechanism for constraining many-body entanglement alongside spatial locality.", "url": "https://arxiv.org/abs/2609.36113", "type": "理论", "summary": "1. 了解限制多体量子纠缠的因素是物理学的一个中心问题。\n2. 结果，我们证明了对于 $D/2<\\alpha<(D+1)/2$，纠缠界改进为多对数缩放，并且在参数上仍然强于 $(D+1)/2<\\alpha<D$ 的任意二分界。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Donghoon Kim"}, {"name": "Tomotaka Kuwahara"}], "featured_authors": [{"name": "Donghoon Kim"}, {"name": "Tomotaka Kuwahara"}], "author_count": 2}, {"id": "2609.36127", "category": "quant-ph", "title": "Near-Optimal Parallel Unitary Process Tomography in Diamond Distance", "abstract": "Unitary process tomography is the act of learning how an unknown unitary gate acts on a quantum system. It is an essential procedure for realizing a functioning quantum computer. As quantum technologies develop, it is important to understand the computational resources needed to conduct unitary process tomography using a variety of types of circuits. In particular, when measuring error in diamond distance, it is known how to achieve optimal query complexity using a sequential circuit architecture, but it had not been known whether a parallel circuit architecture could achieve the same optimal query complexity. In this work, we prove that unitary process tomography with near-optimal query complexity is indeed possible using a parallel circuit by introducing an explicit, novel parallel procedure. This closes the gap between sequential and parallel circuits up to a logarithmic factor, showing that parallel and sequential strategies are nearly equally capable for this task.", "url": "https://arxiv.org/abs/2609.36127", "type": "理论", "summary": "1. 该工作证明在钻石距离误差度量下，酉过程层析可用并行线路达到近最优查询复杂度，并给出显式新流程。\n2. 其卖点在于显式构造并行流程，把并行与顺序架构的查询复杂度差距缩小到仅对数因子。\n3. 这表明并行与顺序策略在该任务上能力近乎等价，为量子过程层析的并行实现与资源分析提供启发。", "summary_source": "deepseek", "authors": [{"name": "Noam Scully"}, {"name": "Sisi Zhou"}], "featured_authors": [{"name": "Noam Scully"}, {"name": "Sisi Zhou"}], "author_count": 2}, {"id": "2609.36162", "category": "quant-ph", "title": "From Classical to Quantum Channels: Achieving Positive Covert Rates", "abstract": "In this paper, we study the conditions under which covert communication at positive rates is feasible over discrete memoryless classical, classical-quantum, and quantum channels. For classical point-to-point channels, we show that if the dimension of the channel input probability simplex exceeds that of the channel output probability simplex, equivalently, if the input alphabet has larger cardinality than the output alphabet, then positive covert rates are achievable for certain classes of Discrete Memoryless Channels (DMCs). We further show that allowing the innocent symbol (i.e., the symbol transmitted in the no-communication mode) to be chosen appropriately can enlarge the class of DMCs for which positive covert rates are achievable. We also study covert communication over classical Multiple-Access Channels (MACs), where the additional transmitter effectively enlarges the set of available channel input pairs, and we show that the conditions required to satisfy the covertness constraint are less restrictive for MACs than for point-to-point channels. We extend these results to classical-quantum DMCs by showing that if the dimension of the input probability simplex exceeds the affine dimension of the set of output states that can be induced at the channel output, then positive covert rates are achievable for certain classes of classical-quantum DMCs. Finally, for quantum channels, we show that if the innocent state (i.e., the state transmitted in the no-communication mode) is mixed, then the covertness constraint can always be satisfied by a non-trivial input ensemble. Consequently, positive covert rates are achievable whenever the legitimate receiver can distinguish at least two states in a suitable such ensemble.", "url": "https://arxiv.org/abs/2609.36162", "type": "理论", "summary": "1. 在本文中，我们研究了在离散无记忆经典、经典量子和量子信道上以正速率进行隐蔽通信的可行性的条件。\n2. 我们将这些结果扩展到经典量子 DMC，表明如果输入概率单纯形的维数超过可以在通道输出处诱导的输出状态集的仿射维数，则对于某些类别的经典量子 DMC 可以实现正隐蔽率。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Hassan ZivariFard"}, {"name": "Xiaodong Wang"}, {"name": "Alexei Ashikhmin"}], "featured_authors": [{"name": "Hassan ZivariFard"}, {"name": "Xiaodong Wang"}, {"name": "Alexei Ashikhmin"}], "author_count": 3}, {"id": "2609.36203", "category": "quant-ph", "title": "Near-optimal quantum simulation of lattice Lindbladian dynamics", "abstract": "We consider the problem of simulating dynamics under geometrically local Lindbladians acting on a lattice of qudits. We present an algorithm to approximate the time evolution under these Lindbladians for evolution time $t$ and on $N$ qudits to diamond norm error $\\varepsilon$ using geometrically local circuits of depth $O(t \\ \\polylog(Nt/\\varepsilon))$. Our results thus achieve a performance comparable to that of the Haah-Hastings-Kothari-Low (HHKL) algorithm for lattice Hamiltonian simulation.", "url": "https://arxiv.org/abs/2609.36203", "type": "理论+数值", "summary": "1. 该工作研究晶格 qudit 上几何局域 Lindbladian 的量子模拟问题，并给出近似其时间演化的量子算法。\n2. 其卖点是用深度 O(t polylog(Nt/ε)) 的几何局域线路将演化误差压至 diamond 范数 ε，性能可比 HHKL 哈密顿量模拟算法。\n3. 这表明局部 Lindbladian 动力学可在近最优深度下模拟，为开放量子系统的大规模量子模拟提供复杂度基准。", "summary_source": "deepseek", "authors": [{"name": "Rahul Trivedi"}, {"name": "Xiehang Yu"}, {"name": "Daniel Malz"}], "featured_authors": [{"name": "Rahul Trivedi"}, {"name": "Xiehang Yu"}, {"name": "Daniel Malz"}], "author_count": 3}, {"id": "2609.36213", "category": "quant-ph", "title": "Bivariate Bicycle Codes over Group Algebras", "abstract": "We study a weighted-shift formulation of bivariate bicycle group-algebra (BBGA) codes over finite group algebras. One binary shift acts by right multiplication and the other by left multiplication; associativity ensures that these shifts commute even for a nonabelian seed group. Bivariate polynomials in the shifts, including mixed monomials, therefore define CSS codes. We give explicit sparsity bounds and distinguish nonabelian seed groups from codes that are intrinsically inequivalent to abelian realizations. For $D_3$, a pair of weighted permutation shifts generates a regular $C_6\\times C_{12}$ action and recovers the known $[[144,12,12]]$ and $[[144,14,14]]$ bivariate bicycle codes. We also present a computer-verified $[[144,16,12]]$ code over $A_4\\times C_6$, with every check of weight eight. This example belongs to the established nonabelian two-block group-algebra family. Exhaustive low-weight enumeration and an intrinsic stabilizer-support invariant certify that it is inequivalent to any ordinary abelian BB or two-block group-algebra realization, even under qubit permutations combined with local Clifford operations. Finally, a nonuniform weighted-shift construction over $\\mathbb{F}_2[C_3]$ yields a $[[18,4,3]]$ code with check weights six and eight. An exact enumeration of its minimum stabilizer supports rules out every ordinary binary 2BGA realization at that length, under the same equivalence. This establishes that the unrestricted weighted-shift formulation extends beyond the ordinary 2BGA class, even with an abelian seed group.", "url": "https://arxiv.org/abs/2609.36213", "type": "理论", "summary": "1. 该文在有限群代数上研究双变量自行车群代数（BBGA）码的加权移位表述，用右乘与左乘移位及混合单项式构造CSS码。\n2. 关键卖点是非交换种子群下结合律保证两类移位对易，并给出稀疏度界和内在稳定子支撑不变量，证明A4×C6上的[[144,16,12]]码与二元域C3群代数上的[[18,4,3]]码在量子比特置换及局域Clifford下不等价于普通阿贝尔BB或双块群代数实现。\n3. 这表明无限制加权移位框架可超越普通2BGA类，即使种子群阿贝尔，也为设计检查权重受控且具非阿贝尔本质的新CSS码提供启示。", "summary_source": "deepseek", "authors": [{"name": "Chaobin Liu"}], "featured_authors": [{"name": "Chaobin Liu"}], "author_count": 1}, {"id": "2609.36266", "category": "quant-ph", "title": "Quantifying Teleportation Overhead in Distributed Unitary Coupled-Cluster Ansätze", "abstract": "Distributed quantum computing (DQC) has been proposed as a way to scale quantum algorithms for practical applications beyond monolithic quantum processor architectures. Among these applications, quantum chemistry is widely regarded as one of the most promising use cases for quantum computing. In this work, we estimate the distributed-resource requirements of unitary coupled-cluster (UCC) ansätze for quantum chemistry, focusing on unitary coupled-cluster singles and doubles (UCCSD), unitary pair coupled-cluster doubles (UpCCD), and unitary pair coupled-cluster with generalized singles and doubles (UpCCGSD) circuits for hydrogen chains. We focus on a teleportation-based approach to DQC, quantitatively comparing a naive distribution method to the output of the TeleSABRE algorithm. For both approaches, we estimate the cost of handling nonlocal two-qubit gates across a fixed midpoint or quarter-point partition, reporting Bell-pair/classical-communication costs in teleportation. Across Jordan-Wigner and Bravyi-Kitaev, we find that UpCCD with spin-blocked Jordan-Wigner ordering gives the most favorable scaling, while UCCSD incurs substantially larger distributed-resource requirements.", "url": "https://arxiv.org/abs/2609.36266", "type": "数值", "summary": "1. 该工作估算了氢链UCCSD、UpCCD与UpCCGSD拟设在基于传态的分布式量子计算中的资源开销，并比较朴素分布与TeleSABRE算法的结果。\n2. 其关键是在中点或四分之一点划分下，跨Jordan-Wigner与Bravyi-Kitaev映射量化非局域两比特门所需的贝尔对与经典通信成本，发现自旋分块Jordan-Wigner排序的UpCCD扩展性最优，UCCSD开销显著更大。\n3. 这为分布式量子化学的拟设选择、费米子映射和路由协同优化提供依据，并提示低传态开销的成对耦合簇结构更利于跨处理器扩展。", "summary_source": "deepseek", "authors": [{"name": "Grier M. Jones"}, {"name": "Hassan Tariq Shafi"}, {"name": "Zixuan Wang"}, {"name": "Thomas Trenty"}, {"name": "Zachary Vernec"}, {"name": "Hans-Arno Jacobsen"}], "featured_authors": [{"name": "Grier M. Jones"}, {"name": "Hassan Tariq Shafi"}, {"name": "Zixuan Wang"}, {"name": "Thomas Trenty"}, {"name": "Zachary Vernec"}, {"name": "Hans-Arno Jacobsen"}], "author_count": 6}, {"id": "2609.36273", "category": "quant-ph", "title": "Puncturing for Adaptive Entanglement-Assisted Stabilizer Codes", "abstract": "Quantum error-correcting codes are essential for reliable quantum communication. The achievable parameters can be improved by using entanglement-assisted stabilizers at the cost of consuming pre-shared Bell pairs. If the availability of such Bell pairs is intermittent, the ability to adapt the code to available resources is beneficial. That is, to pick a single mother code that can be adapted to different entanglement budgets. To achieve this, we extend an existing puncturing construction for standard/unassisted stabilizers to the entanglement-assisted setting through a three-step procedure: Interpreting the code as an unassisted stabilizer, puncturing a receiver-side qubit, and recovering an entanglement-assisted representation. This procedure reduces the number of required Bell pairs by one while preserving the number of transmitted and logical qubits. We derive a bound on the resulting distance loss and establish conditions for preserving the original code distance. Finally, we analyse distinct, randomly generated, entanglement-assisted stabilizers with five to eight transmitted qubits. Of these codes, 14.75% have a greater distance than their associated unassisted representations. Among this subset, 81.4% admit at least one puncturing choice that preserves the original entanglement-assisted distance. These results illustrate how puncturing can reduce entanglement requirements while maintaining code distance.", "url": "https://arxiv.org/abs/2609.36273", "type": "理论", "summary": "1. 该工作将标准稳定子码的打孔构造推广至纠缠辅助情形，构造可适配不同贝尔对预算的自适应母码。\n2. 其核心是三步流程：先视为非辅助稳定子，再打孔接收端量子比特，最后恢复纠缠辅助表示；减少一个贝尔对并保持传输与逻辑量子比特数，同时给出距离损失界和距离保持条件。\n3. 对五至八个传输量子比特的随机码分析表明，14.75%的码距离高于相应非辅助表示，其中81.4%可打孔保持原距离，显示打孔可在降低纠缠需求时维持码距。", "summary_source": "deepseek", "authors": [{"name": "Nicolai Peder Bülow Pedersen"}, {"name": "Jakob Kaltoft Søndergaard"}, {"name": "Jaron Skovsted Gundersen"}, {"name": "René Bødker Christensen"}, {"name": "Petar Popovski"}], "featured_authors": [{"name": "Nicolai Peder Bülow Pedersen"}, {"name": "Jakob Kaltoft Søndergaard"}, {"name": "Jaron Skovsted Gundersen"}, {"name": "René Bødker Christensen"}, {"name": "Petar Popovski"}], "author_count": 5}, {"id": "2609.36335", "category": "quant-ph", "title": "Conversable Quantum Fire in the Standard Model", "abstract": "Quantum fire consists of quantum states that can be efficiently functionally cloned but cannot be transmitted using one-way classical communication. Whereas all previous quantum-fire constructions with proven untelegraphability are relative to an oracle, ours, based on one-shot signatures, is in the standard model. Our construction achieves two further notions that we introduce: (a) keyless untelegraphability, a strengthening of untelegraphability; and (b) conversability, meaning that a flame, though not telegraphable via one-way classical communication, can be transmitted via classical interaction. Hence one-way and two-way classical communication differ qualitatively in their power to transmit this quantum fire. We use these two novel properties of quantum fire, along with its clonability, to give one of the first cryptographic applications of quantum fire. Keyless untelegraphability forces the distribution of serial numbers of valid flames to have high min-entropy, while conversability and clonability allow the corresponding flame to be cloned and transferred using only classical communication. We present two variants of our conversable quantum-fire construction. The first, based on one-shot signatures (instantiable from subexponential iO, subexponentially secure one-way functions, and LWE), supports polynomially many flames, and super-logarithmic min-entropy of the serial-number distribution. The second, under the stronger assumption of exponentially unforgeable one-shot signatures (instantiable relative to a classical oracle), supports exponentially many flames, and linear min-entropy.", "url": "https://arxiv.org/abs/2609.36335", "type": "理论", "summary": "1. 该工作在标准模型而非预言机下，基于一次性签名构造了可对话量子火，并给出两种变体：分别支持多项式多火焰与超对数最小熵、指数多火焰与线性最小熵。\n2. 其卖点是引入无密钥不可电报性与可对话性：量子火不能经单向经典通信传输，却能经经典交互传输，从而定性区分单向与双向经典通信，并迫使有效火焰序列号分布具高最小熵。\n3. 这为在标准模型下实现量子火及其密码学应用提供了具体路径，并提示经典交互可作为传输特定量子态的关键资源。", "summary_source": "deepseek", "authors": [{"name": "Ofer Casper"}, {"name": "Barak Nehoran"}, {"name": "Or Sattath"}], "featured_authors": [{"name": "Ofer Casper"}, {"name": "Barak Nehoran"}, {"name": "Or Sattath"}], "author_count": 3}, {"id": "2609.36336", "category": "quant-ph", "title": "Separability rigidity of Gaussian states under positive domination", "abstract": "We prove a separability rigidity theorem for finite-mode Gaussian states. Let $\\rho_G$ be Gaussian and let $\\mathcal I$ be a fixed partition of the modes. If $\\rho_G$ dominates a nonzero positive operator $T$ that is separable across $\\mathcal I$, $0\\neq T\\preccurlyeq \\rho_G$, then $\\rho_G$ itself is separable across $\\mathcal I$. The dominated operator is arbitrary and need not be Gaussian. As consequences, convex mixing among finitely many separability partitions creates no new Gaussian states: a Gaussian state belonging to such a convex class is already separable across one fixed partition. In particular, full inseparability and genuine multipartite entanglement coincide for finite-mode Gaussian states, and identical copies of a biseparable Gaussian state cannot activate genuine multipartite entanglement. We also show that the implication cannot be reversed by constructing a fully separable Gaussian state that dominates a positive multiple of a genuine multipartite entangled state.", "url": "https://arxiv.org/abs/2609.36336", "type": "理论", "summary": "1. 该工作证明了有限模高斯态在正支配下的可分离性刚性定理：若高斯态支配一个非零且关于固定模划分可分离的正算子，则该高斯态本身在该划分下可分离。\n2. 其关键卖点是支配算子可任意且无需高斯，由此推出有限个划分的凸混合不产生新高斯态，且全不可分离与真正多体纠缠在高斯态中重合。\n3. 该结果意味着双可分离高斯态的相同拷贝不能激活真正多体纠缠，并提示用非高斯可分离算子作探针来区分高斯纠缠结构；反向命题不成立。", "summary_source": "deepseek", "authors": [{"name": "Evgeny Shchukin"}, {"name": "Peter van Loock"}], "featured_authors": [{"name": "Evgeny Shchukin"}, {"name": "Peter van Loock"}], "author_count": 2}, {"id": "2609.36408", "category": "quant-ph", "title": "Dynamical resource theory of time-reversal symmetry breaking", "abstract": "Time-reversal symmetry and its violation (T-violation) are fundamental across diverse physics domains, from particle physics to fluctuation theorems and reciprocity. While time-reversal symmetry for isolated systems is simply determined by the Hamiltonian, quantifying the magnitude of T-violation, especially in noisy quantum processes, has been a subject of ongoing debate. Here, we propose an operationally meaningful framework to quantify the intrinsic T-violation of quantum channels. We integrate operationally defined time-reversal transformations into dynamical resource theory to formulate T-violation as a resource. T-violation decomposes into two distinct components: kinematic T-violation originating from antiunitary motion-reversal, and nonunitality driven purely by thermodynamics. This decomposition resolves the longstanding confusion between broken time-reversal symmetry and non-invertibility. Finally, we analyze the resulting resource theory of kinematic T-violation, showing that it is neither quality-like nor quantity-like, and proving the existence of a universal golden unit even within classical channels.", "url": "https://arxiv.org/abs/2609.36408", "type": "理论", "summary": "1. 该工作提出了一个操作上有意义的动力学资源理论框架，用以量化量子信道内在的时间反演破缺，并将操作定义的时间反演变换纳入其中。\n2. 其核心在于将时间反演破缺分解为源于反幺正运动反转的运动学分量和纯粹由热力学驱动的非单位性分量，从而澄清对称破缺与不可逆性之间的长期混淆，并证明运动学时间反演破缺资源既非品质型也非数量型，且经典信道中亦存在普适黄金单元。\n3. 这一分解为在噪声量子过程中区分对称性破缺与不可逆性提供了可操作判据，并启示后续在开放量子系统、热力学与量子信息交叉领域探索资源量化与普适基准。", "summary_source": "deepseek", "authors": [{"name": "Jisho Miyazaki"}, {"name": "Kohdai Kuroiwa"}, {"name": "Mio Murao"}], "featured_authors": [{"name": "Jisho Miyazaki"}, {"name": "Kohdai Kuroiwa"}, {"name": "Mio Murao"}], "author_count": 3}, {"id": "2609.36464", "category": "quant-ph", "title": "Degree Balance as a Fine-Grained Complexity Boundary for Quantum SAT", "abstract": "The local Hamiltonian problem is the canonical $\\mathsf{QMA}$-complete problem, and $O(2^n)$ time classical algorithms and $O(2^{n/2})$ time quantum algorithms are known to solve the problem in the worst case. It is not clear how to improve these brute force strategies for a broad class of the problem because ground states are highly entangled in general, and we cannot directly apply known strategies for classical CSPs. In this work, we present exponentially faster classical and quantum algorithms under two mild assumptions: (1) the Hamiltonian is frustration-free on YES instances, and (2) it is approximately regular, meaning that every qubit is acted upon by approximately the same number of constraints. We complement these upper bounds by showing that, assuming (Q)SETH, quantum 5-SAT admits no non-trivial worst-case speedup. Our lower bound further demonstrates that the dependence of our algorithms on regularity is in some sense nearly optimal. Specifically, quantum 5-SAT remains (Q)SETH-hard even for Hamiltonians in which all but $O(\\sqrt{n})$ qubits participate in only constantly many constraints, while the remaining $O(\\sqrt{n})$ qubits each participate in $O(\\sqrt{n})$ constraints. By contrast, if either the size of this high-degree subset or the degrees of its qubits is reduced by a factor of $n^\\delta$, for any $\\delta>0$, our algorithm solves the problem in time $O(2^{(1- \\varepsilon)n})$ for some $\\varepsilon>0$. Together, our upper and lower bounds establish a fine-grained complexity dichotomy for quantum satisfiability.", "url": "https://arxiv.org/abs/2609.36464", "type": "理论+数值", "summary": "1. 该工作针对局部哈密顿量与量子SAT，在YES实例无挫且近似正则的假设下，给出指数加速的经典和量子算法。\n2. 其核心在于用(Q)SETH下界证明量子5-SAT无非平凡最坏情形加速，并表明算法对正则性的依赖近乎最优，形成细粒度复杂度二分。\n3. 这表明度数平衡是量子SAT复杂度的一类精细分界，为利用约束度数结构的算法设计与下界证明提供了可扩展框架。", "summary_source": "deepseek", "authors": [{"name": "Atsuya Hasegawa"}, {"name": "Jonas Kamminga"}, {"name": "François Le Gall"}, {"name": "Suguru Tamaki"}], "featured_authors": [{"name": "Atsuya Hasegawa"}, {"name": "Jonas Kamminga"}, {"name": "François Le Gall"}, {"name": "Suguru Tamaki"}], "author_count": 4}, {"id": "2609.36480", "category": "quant-ph", "title": "Improved Quantum Algorithms for Black-Box Abelian Group Decomposition", "abstract": "Decomposing finite Abelian black-box groups into cyclic factors is a basic problem in quantum computation. We give a quantum algorithm for decomposing finite Abelian black-box groups by adapting the quantum sampling and classical lattice-reduction method of Regev's factoring algorithm. The algorithm computes an invariant-factor decomposition and corresponding cyclic generators with high probability. For a group G of order at most 2^n with unique encodings and reversible group-operation cost T_op = Omega(sqrt(n)), our algorithm uses O(sqrt(n)) quantum circuits, each with O~(n T_op) gates and executed at most O(n) times. For comparison, we consider the Cheung-Mosca algorithm, which decomposes the Sylow p-subgroups separately. We also consider the common-modulus implementation of the extended Cheung-Mosca algorithm. Our algorithm reduces the sum of the circuit gate counts from O~(n^2 T_op) to O~(n^(3/2) T_op). The total quantum time bound decreases from O~(n^3 T_op) to O~(n^(5/2) T_op), and the quantum space bound decreases from O(n^2) to O(n) qubits. The classical computation uses polynomially many bit operations and group-operation queries. These improvements rely on two technical ingredients. We prove that the integer relation lattices used in our algorithm admit, with high probability, integral bases whose vectors have Euclidean norm at most exp(O(sqrt(n))). We preserve the circuit-size advantage of Regev's algorithm for group decomposition by incorporating all O(n) sampled generators while keeping the lattice-reduction dimension at O(sqrt(n)).", "url": "https://arxiv.org/abs/2609.36480", "type": "理论+数值", "summary": "1. 将有限阿贝尔黑盒群分解为循环因子是量子计算中的一个基本问题。\n2. 这些改进依赖于两个技术要素。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Junrong Luo"}, {"name": "Yinan Li"}, {"name": "Francois Le Gall"}], "featured_authors": [{"name": "Junrong Luo"}, {"name": "Yinan Li"}, {"name": "Francois Le Gall"}], "author_count": 3}, {"id": "2609.36511", "category": "quant-ph", "title": "Affine spin-pencil factorization of generalized driven anisotropic Rabi--Stark Hamiltonians in an inhomogeneous orthosymplectic superalgebra", "abstract": "We construct a supersymmetric factorization for generalized driven anisotropic Rabi--Stark Hamiltonians using an affine factor $\\hat{A}=\\hat{C}+\\hat{a}\\hat{D}$ in an inhomogeneous orthosymplectic superalgebra, with two real invertible spin matrices $\\hat{C}$ and $\\hat{D}$. The six real pencil parameters constrain nine Hamiltonian frequencies and one energy offset up to an overall frequency scale. The normal product $\\hat{A}^{\\dagger}\\hat{A}$ has an exact zero-energy ground doublet and, with its antinormal partner $\\hat{A}\\hat{A}^{\\dagger}$, gives a Witten index of two. For distinct pencil roots with finite baseline slopes, coherent gauges define a Bargmann hierarchy and endpoint conditions for exceptional finite-polynomial states. The spin grading organizes four limiting cases, comprising two driven-oscillator families with every baseline exact and the constrained anisotropic-Rabi and Rabi--Stark sheets, which meet at the degenerate-qubit isotropic Rabi model. An aligned interior example adds direct and longitudinal drives, Stark deformation, and intensity-dependent coupling while retaining the factorization.", "url": "https://arxiv.org/abs/2609.36511", "type": "理论", "summary": "1. 我们使用非齐次正交超代数中的仿射因子 $\\hat{A}=\\hat{C}+\\hat{a}\\hat{D}$ 构造广义驱动各向异性 Rabi-Stark Hamiltonian 的超对称分解，并具有两个实数可逆自旋矩阵 $\\hat{C}$ 和 $\\hat{D}$。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "B. M. Rodriguez-Lara"}, {"name": "F. H. Maldonado-Villamizar"}, {"name": "A. Kafuri"}, {"name": "A. Moroz"}], "featured_authors": [{"name": "B. M. Rodriguez-Lara"}, {"name": "F. H. Maldonado-Villamizar"}, {"name": "A. Kafuri"}, {"name": "A. Moroz"}], "author_count": 4}, {"id": "2609.36574", "category": "quant-ph", "title": "Shared Phase Arithmetic for Parallel Quantum Rotations", "abstract": "A layer of diagonal quantum gates can be specified by an integer-valued function on computational basis states. This description suggests implementing the layer by evaluating that function reversibly and translating its value into a phase using a shared quantum register. We develop this viewpoint for parallel phase kickback (PPK): the weighted sum of several rotation parameters is computed coherently, added once to a phase-gradient state, and then uncomputed. The construction separates the cost of representing a phase function from the cost of applying it. We prove correctness, give explicit error bounds, and analyze logical gate counts for general weights, pairs of rotations, and weights with disjoint binary support. With Clifford-only encoding, a batch uses at most $4(b-1)$ T gates at $b$-bit phase resolution, excluding initialization. The first phase reference is prepared with independent rotations synthesized by Gridsynth; additional phase-gradient states then follow from the disjoint-support construction with $O(b)$ T gates each. The resulting bounds identify when shared phase arithmetic reduces amortized rotation cost and when encoding overhead limits that advantage.", "url": "https://arxiv.org/abs/2609.36574", "type": "理论+数值", "summary": "1. 该工作提出面向并行量子旋转的共享相位算术框架，用可逆求值整数函数并经共享寄存器将值转为相位，实现并行相位回踢。\n2. 其技术要点是将相位函数表示与施加成本解耦，并证明正确性、给出误差界与门数分析；b位分辨率下批处理≤4(b−1)个T门（不含初始化）。\n3. 该结果界定了共享相位算术何时降低摊销旋转成本，以及编码开销何时抵消该优势，为并行旋转合成与资源评估提供判据。", "summary_source": "deepseek", "authors": [{"name": "Anbang Wu"}, {"name": "Liqiang Lu"}, {"name": "Pu Pang"}, {"name": "Jianwei Yin"}, {"name": "Jingwen Leng"}, {"name": "Minyi Guo"}], "featured_authors": [{"name": "Anbang Wu"}, {"name": "Liqiang Lu"}, {"name": "Pu Pang"}, {"name": "Jianwei Yin"}, {"name": "Jingwen Leng"}, {"name": "Minyi Guo"}], "author_count": 6}, {"id": "2609.36579", "category": "quant-ph", "title": "Root-system structure of sloppiness in passive Gaussian metrology", "abstract": "Passive transformations of an $n$-mode squeezed probe become locally unidentifiable when the quantum Fisher matrix loses rank. For pure zero-mean Gaussian probes, we show that the $C_{n}$ restricted-root system of $\\mathrm{Sp}(2n,\\mathbb{R})/\\mathrm{U}(n)$ governs this exact sloppiness. For squeezing magnitudes $r_{1},\\ldots,r_{n}$ in the canonical basis, the roots $2r_{j}$ and $r_{j}\\pm r_{k}$ label the local phase rotations and two beam-splitter quadratures, and their vanishing identifies every Fisher-null direction. The associated Fisher weights quantify the approach to each singular wall. At fixed positive mean photon number, we solve the E-optimal probe-design problem of maximizing the smallest passive Fisher eigenvalue in two explicit generator normalizations. In the canonical phase and beam-splitter angle convention, the unique optimum in the fundamental Weyl chamber is an arithmetic progression approaching the consecutive-odd-integer dual-Weyl direction at large resource. With an invariant generator norm, the smallest eigenvalue is independent of the passive frame and the optimum lies exactly on that ray at every resource. Uniform squeezing instead minimizes the local-phase A-optimal cost while leaving one beam-splitter quadrature unidentifiable for every mode pair. Finally, the two quadratures of each identifiable mode pair saturate the quantum-geometric incompatibility bound, and the largest compatible passive submodel has $n(n+1)/2$ parameters at a regular spectrum. The resulting classification separates local identifiability, sensitivity optimization, and simultaneous attainability.", "url": "https://arxiv.org/abs/2609.36579", "type": "理论+数值", "summary": "1. 该工作研究被动高斯计量中量子Fisher矩阵降秩导致的局部不可辨
