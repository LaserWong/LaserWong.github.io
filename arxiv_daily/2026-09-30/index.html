<head>
  <meta charset="utf-8">

  <title>arXiv 2026-09-30 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

  <script>
    const papers = [{"id": "2609.35838", "category": "cond-mat", "title": "Memory-induced optimal switching in a dynamic Ising-Kuramoto model", "abstract": "We study a globally coupled stochastic system in which each unit carries an Ising spin and a continuous phase. The spins undergo Glauber switching with relaxation rate $\\gamma$, while the phases are driven by Ornstein-Uhlenbeck noise with correlation time $\\tau$. A spin-dependent phase interaction supports a composite coherent mode, $Z_m=N^{-1}\\sum_j\\sigma_j e^{i\\theta_j}$, that can order even when the ordinary phase coherence is small. Linear response about the nonmagnetic incoherent state gives the synchronization threshold $K_{\\mathrm c}=[(\\mu+\\beta_s\\gamma)\\chi_\\gamma]^{-1}$, where $\\chi_\\gamma$ is a memory-weighted Laplace transform of the free phase correlation function. The competition between the increasing Glauber response and the decreasing memory susceptibility produces a finite switching rate at which $K_{\\mathrm c}$ is minimized. We derive a general sufficient condition for such an interior optimum and show that finite-time Ornstein-Uhlenbeck correlations satisfy the required fast-switching asymptotics, whereas the white-noise limit need not. Finite-size simulations reproduce the nonmonotonic threshold, its shift toward slower switching as $\\tau$ increases, antiphase composite order in a nonmagnetic state, and mode mixing on a magnetized background.", "url": "https://arxiv.org/abs/2609.35838", "type": "理论+数值", "summary": "1. 该工作研究全局耦合随机系统：单元含Glauber翻转自旋与OU噪声驱动相位，并考察自旋依赖相位耦合支持的复合相干模式Z_m。\n2. 其核心是解析给出同步阈值K_c=[(μ+β_sγ)χ_γ]^{-1}，揭示Glauber响应与记忆磁化率竞争产生使K_c最小的有限翻转速率，并导出内点最优充分条件。\n3. 这表明有限关联时间可经记忆效应非单调调控同步阈值，为反相复合序、磁化背景模式混合及最优切换提供可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Reon Hayashi"}], "featured_authors": [{"name": "Reon Hayashi"}], "author_count": 1}, {"id": "2609.35940", "category": "cond-mat", "title": "Discrete Scale Invariance of Ising Mesons", "abstract": "Discrete scale invariance often arises from resonant few-body or singular scale-invariant dynamics. We show that it can instead emerge in the internal motion of a composite excitation in an ordered quantum magnet. In the marginal $1/r^4$ transverse-field Ising chain, long-range bonds generate an asymptotic inverse-square attraction between dressed domain walls, with strength fixed by the spontaneous magnetization. The dressed two-kink threshold curvature sets the relative kinetic scale. Together, these independently accessible quantities determine the scale-anomaly exponent and hence the meson hierarchy. In the supercritical regime, the same exponent governs geometric binding-energy and size ratios, logarithmic level accumulation, and log-periodic threshold scattering. Full-spin exact diagonalization and a fourth-order weak-field Hamiltonian support the coupled energy--size scaling in the finite window between core and ring effects. This provides a microscopic many-body realization of quantum limit-cycle physics, with its universal scaling fixed by magnetic order and kink mobility.", "url": "https://arxiv.org/abs/2609.35940", "type": "理论+数值", "summary": "1. 该工作揭示在长程横场Ising链的有序量子磁体中，复合元激发（Ising介子）的内部运动可涌现离散标度不变性，而非仅由少体共振或奇异标度动力学产生。\n2. 其机制是边际1/r^4长程键诱导缀饰畴壁间渐近平方反比吸引，强度由自发磁化固定，缀饰双扭结阈值曲率设定动能标度，二者共同决定标度反常指数及超临界区的介子层级、几何结合能与尺寸比、对数能级堆积和对数周期阈值散射。\n3. 这为量子极限环物理提供了微观多体实现，表明普适标度由磁序与扭结迁移率固定，并可由全自旋精确对角化与四阶弱场哈密顿量在核心与环效应之间的有限窗口内检验。", "summary_source": "deepseek", "authors": [{"name": "Denis V. Vasilyev"}, {"name": "Abbas Ali Saberi"}], "featured_authors": [{"name": "Denis V. Vasilyev"}, {"name": "Abbas Ali Saberi"}], "author_count": 2}, {"id": "2609.35960", "category": "cond-mat", "title": "Advancing Fuzzy-Sphere CFTs: $\\mathrm{SO}(3)$-Rotation-Resolving Exact Diagonalization, 3D Ising Heavy Primaries, and Quasi-Hole-Space Projection", "abstract": "Fuzzy-sphere regularization has recently emerged as a powerful framework for studying three-dimensional conformal field theories (CFTs). In this work, we exploit symmetry and Hilbert-space structures to substantially advance this framework. We develop an exact-diagonalization algorithm that resolves the full $\\mathrm{SO}(3)$ rotational symmetry, reducing computational costs by factors of several hundred. For the three-dimensional Ising CFT, we identify around 100 primary operators, including a large number of previously unknown heavy scalar primaries up to scaling dimension $\\Delta\\approx16.5$. We also resolve the tension between previous fuzzy-sphere and bootstrap results regarding the parity-odd scalar primary. Furthermore, we identify a branch of scalar primaries associated with $\\phi^n$ operators in the $\\phi^4$ Lagrangian description, beginning with the identity, $\\sigma$, $\\epsilon$, $\\epsilon'$, and $\\sigma'$. Their wave functions exhibit a semi-classical structure closely related to states invariant under area-preserving diffeomorphisms of the sphere. Finally, we show that critical points involving fractional quantum Hall states can be studied within a substantially reduced Hilbert space spanned by quasi-hole states of the corresponding model quantum Hall wave functions like the Laughlin state. This suggests a general strategy for exploring CFTs intertwined with topologically ordered phases.", "url": "https://arxiv.org/abs/2609.35960", "type": "理论+数值", "summary": "1. 该工作利用对称性与希尔伯特空间结构，发展了可分辨完整SO(3)旋转的精确对角化算法，并在三维Ising CFT中识别出约100个初级算符，含大量标度维数至Δ≈16.5的重标量初级算符。\n2. 其技术卖点在于完整SO(3)分辨使计算成本降低数百倍，化解了宇称奇标量初级算符与共形自举结果的矛盾，并揭示与φ^n算符对应、波函数呈面积保持微分同胚不变态半经典结构的标量分支。\n3. 此外，准空穴空间投影表明分数量子霍尔临界点可在由Laughlin态准空穴张成的显著缩减空间中研究，为探索与拓扑有序相交织的CFT提供了通用策略。", "summary_source": "deepseek", "authors": [{"name": "Zheng Zhou"}, {"name": "Yin-Chen He"}], "featured_authors": [{"name": "Zheng Zhou"}, {"name": "Yin-Chen He"}], "author_count": 2}, {"id": "2609.35984", "category": "cond-mat", "title": "Nonreciprocal Chiral Automata", "abstract": "Odd pressure is a parity-odd transport coefficient that gives an isotropic pressure response to vorticity in compressible two-dimensional fluids. By asymmetrically coupling vortical and compressional modes, it provides a direct mechanism for a nonreciprocal hydrodynamic response reminiscent of several biological systems. Yet microscopic models realizing odd pressure as a transport coefficient are relatively scarce. Here, we construct one such model using a lattice-gas cellular automaton based on the Frisch-Hasslacher-Pomeau II model with rest particles and chiral collisions, whose Chapman-Enskog coarse-graining produces a nonzero odd pressure coefficient. The key ingredient is a local parity-breaking collision that weakly rotates moving particles in the presence of a rest particle. At hydrodynamic scales, this microscopic rule acts as an effective magnetic field, converting the model's bulk viscosity into odd pressure. More generally, we derive expressions relating Hall viscosity, odd pressure, and odd torque to their parity-even counterparts in our model.", "url": "https://arxiv.org/abs/2609.35984", "type": "理论", "summary": "1. 该工作构建了含静止粒子的FHP-II二维格子气元胞自动机，引入手性碰撞，并通过Chapman-Enskog粗粒化获得非零奇压力系数。\n2. 其核心是局域宇称破缺碰撞：在静止粒子存在时令运动粒子微弱旋转，该微观规则在流体尺度等效为磁场，将体黏度转化为奇压力。\n3. 该模型进一步给出霍尔黏度、奇压力与奇力矩同其宇称偶对应量的关系，为在格子气框架中实现非互易手性输运提供了可检验途径。", "summary_source": "deepseek", "authors": [{"name": "Andrew A. Allocca"}, {"name": "Armin Rahmani"}, {"name": "Pouyan Ghaemi"}, {"name": "Sriram Ganeshan"}], "featured_authors": [{"name": "Andrew A. Allocca"}, {"name": "Armin Rahmani"}, {"name": "Pouyan Ghaemi"}, {"name": "Sriram Ganeshan"}], "author_count": 4}, {"id": "2609.36036", "category": "cond-mat", "title": "Magnetoplasmon molecule", "abstract": "We investigate a two-dimensional electron system in an external magnetic field. An intrinsic four-particle excitation of the electron system, which we term a magnetoplasmon molecule, is observed. The molecule comprises two identical electrons and two Fermi holes with opposite spins. Both electrons and one Fermi hole participate in the collective plasma oscillations of the electron system, whereas the second Fermi hole neutralizes the excess electronic charge. We examine the interaction between the magnetoplasmon molecule and a magnetoexciton condensate.", "url": "https://arxiv.org/abs/2609.36036", "type": "理论", "summary": "1. 该工作研究并观测了外磁场下二维电子体系中的本征四粒子激发，并将其命名为磁等离激元分子。\n2. 该激发由两个相同电子与两个自旋相反的费米空穴组成，其中两个电子和一个空穴参与集体等离子体振荡，另一个空穴中和多余电子电荷，从而形成中性复合体并与磁激子凝聚体相互作用。\n3. 这一图像把等离激元、空穴关联和磁激子凝聚耦合起来，为在强磁场二维电子系统中探索可调控的中性量子复合物及其与凝聚态的杂化提供了启示。", "summary_source": "deepseek", "authors": [{"name": "A. V. Larionov"}, {"name": "A. V. Gorbunov"}, {"name": "A. B. Van'kov"}, {"name": "D. A. Shchigarev"}, {"name": "L. V. Kulik"}, {"name": "V. Umansky"}], "featured_authors": [{"name": "A. V. Larionov"}, {"name": "A. V. Gorbunov"}, {"name": "A. B. Van'kov"}, {"name": "D. A. Shchigarev"}, {"name": "L. V. Kulik"}, {"name": "V. Umansky"}], "author_count": 6}, {"id": "2609.36051", "category": "cond-mat", "title": "Excitonic Stripe Order in the Two-Orbital Hubbard-Kanamori Model", "abstract": "Excitonic condensation and stripe formation are two distinct manifestations of electronic correlations. While excitonic order naturally arises in multi-orbital systems, stripe order is a prominent feature of doped correlated-electron models. Here, we investigate an excitonic analogue of stripe order in the two--orbital Hubbard-Kanamori model on the square lattice, characterized by a spatial modulation of inter-orbital particle-hole coherence and, in the orbital-parity-symmetric limit, spontaneous breaking of a relative orbital $\\mathbb{Z}_2$ symmetry. Using unrestricted real-space Hartree-Fock calculations complemented by random-phase-approximation instability analysis, we determine how the Kanamori interactions select different excitonic channels. The sign of Hund's exchange controls the spin character of the condensate: ferromagnetic Hund coupling favors triplet excitonic order, whereas antiferromagnetic Hund coupling stabilizes singlet excitonic order. Upon doping, commensurate excitonic density waves develop incommensurate textures, including excitonic stripes and, in the triplet sector, spiral excitonic density waves. We further show that crystal-field splitting strongly reorganizes the excitonic instability by modifying inter-orbital nesting and can stabilize triplet excitonic order even in the absence of pair hopping. Our results establish excitonic stripes as a distinct symmetry-broken state of multi-orbital correlated systems and identify microscopic routes for their stabilization.", "url": "https://arxiv.org/abs/2609.36051", "type": "理论+数值", "summary": "1. 该工作研究了方格子上双轨道哈伯德-卡纳莫里模型中的激子条纹序，并用无限制实空间哈特里-福克与随机相近似分析其不稳定性。\n2. 其核心为卡纳莫里相互作用选择激子通道，洪德交换符号决定自旋：铁磁稳定三重态，反铁磁稳定单重态；掺杂后形成非公度激子条纹及三重态螺旋密度波。\n3. 该工作将激子条纹确立为多轨道关联体系的一类独特对称破缺态，并指出晶场分裂与轨道嵌套等微观路径可用于稳定它。", "summary_source": "deepseek", "authors": [{"name": "Rafael D. Soares"}, {"name": "Luke Staszewski"}, {"name": "Chunhan Feng"}, {"name": "Alexander Wietek"}], "featured_authors": [{"name": "Rafael D. Soares"}, {"name": "Luke Staszewski"}, {"name": "Chunhan Feng"}, {"name": "Alexander Wietek"}], "author_count": 4}, {"id": "2609.36084", "category": "cond-mat", "title": "Measuring trainable degrees of freedom in materials graph neural networks: a random-subspace intrinsic dimension analysis", "abstract": "Final predictive accuracy is the standard basis for comparing graph neural networks (GNNs) in materials-property prediction, but it does not show how strongly performance depends on access to trainable parameter-space directions. Here, we introduce trainable-degree dependence as a complementary characterization of materials GNN learning. Using random-subspace intrinsic-dimension analysis, we train CGCNN, ALIGNN, and DimeNet++ in randomly oriented parameter subspaces across six prediction tasks and measure how performance recovers as independent trainable degrees of freedom are restored. The resulting recovery curves separate endpoint accuracy from the trainable-dimensional demand required to recover it. They reveal distinctions that final errors alone miss: metallic classification and log-bulk-modulus regression recover near-reference performance from small fractional subspaces, formation-energy and band-gap prediction show stronger architecture dependence, and phonon prediction is most sensitive to dimensional restriction. Dataset-size sweeps show that band-gap models require larger fractional subspaces as training data grows, whereas formation-energy and bulk-modulus responses are more stable. A width sweep shows that fractional thresholds can remain stable while absolute threshold dimensions increase with model size. Random-subspace analysis therefore provides a targeted stress test for how materials GNNs use their optimization space.", "url": "https://arxiv.org/abs/2609.36084", "type": "理论+数值", "summary": "1. 最终预测精度是比较材料性能预测中的图神经网络 (GNN) 的标准基础，但它并没有显示性能对可训练参数空间方向的依赖程度。\n2. 数据集大小的扫描表明，随着训练数据的增长，带隙模型需要更大的分数子空间，而地层能量和体积模量响应则更加稳定。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Shehroz Ahmad Shoaib"}, {"name": "Kangming Li"}], "featured_authors": [{"name": "Shehroz Ahmad Shoaib"}, {"name": "Kangming Li"}], "author_count": 2}, {"id": "2609.36248", "category": "cond-mat", "title": "Topology Obstructs Nodeless Excitons", "abstract": "Lowest-energy excitons are usually expected to have nodeless $1s$-like envelope wavefunctions. We show that band topology can obstruct this expectation. The exciton envelope wavefunction is a section of the valence-conduction transition bundle, whose topology can enforce momentum-space zeros, with their parity or signed total index fixed by the corresponding characteristic class. We exemplify this behavior in a minimal $PT$-symmetric three-band model with a rank-two transition bundle characterized by Euler number $\\nu^e=2$. By directly solving the Bethe-Salpeter equation with both contact and Rytova-Keldysh interactions, we find that the lowest exciton contains two zeros, each with index $+1$, and is less strongly bound than its topologically trivial counterpart. We further classify topology-enforced exciton nodal structures for real and complex transition bundles in dimensions $d \\leq 3$. Our results establish the topology of the transition bundle as a direct constraint on exciton wavefunctions and spectra.", "url": "https://arxiv.org/abs/2609.36248", "type": "理论", "summary": "1. 该工作把激子包络波函数视为价带-导带跃迁丛的截面，研究能带拓扑是否以及如何迫使最低激子出现节点，并在最小 PT 对称三带模型中直接求解 Bethe-Salpeter 方程。\n2. 其核心卖点是揭示拓扑可由特征类固定节点的宇称或带符号总指标：在 Euler 数 ν^e=2 的秩二跃迁丛中，最低激子含两个指标为 +1 的零点，且比拓扑平庸对应态束缚更弱，并进一步分类 d≤3 维实/复丛的拓扑强制节点结构。\n3. 这将跃迁丛拓扑确立为激子波函数与谱的直接约束，为拓扑材料中激子束缚能和光学选择定则提供可检验判据及后续实验/理论启发。", "summary_source": "deepseek", "authors": [{"name": "Lumen Eek"}], "featured_authors": [{"name": "Lumen Eek"}], "author_count": 1}, {"id": "2609.36260", "category": "cond-mat", "title": "Derivation of Fokker-Planck equation and its entropy production", "abstract": "We derive the Fokker-Planck equation and its entropy production from the master equation. To this end we consider a discrete space of states where the master equation is defined and appropriate transition rates are introduced. A transition rate has two parts, one of which is the ordinary term proportional to the inverse of the spacing and the other is inversely proportional to the square of the spacing corresponding to the variance of the independent stochastic variable. In the continuous space limit, we obtain the Fokker-Planck as well as the rate of entropy production and the flux of entropy. We also consider the case where the space of states is the phase space and discuss the equations appropriate for systems in contact with several heat reservoirs and for isolated systems.", "url": "https://arxiv.org/abs/2609.36260", "type": "理论", "summary": "1. 该工作从主方程出发，在离散状态空间中引入包含间距一次倒数和二次倒数两部分的跃迁率，并在连续极限下推导出福克-普朗克方程及其熵产生率与熵流。\n2. 其技术卖点是把跃迁率中与间距平方倒数成正比的项解释为独立随机变量的方差，从而在离散到连续过渡中自然给出扩散项、熵产生率和熵流。\n3. 该框架进一步适用于以相空间为状态空间的体系，可讨论与多个热库接触及孤立系统的相应方程，为非平衡热力学与随机动力学分析提供启示。", "summary_source": "deepseek", "authors": [{"name": "Tânia Tomé"}, {"name": "Mário J. de Oliveira"}], "featured_authors": [{"name": "Tânia Tomé"}, {"name": "Mário J. de Oliveira"}], "author_count": 2}, {"id": "2609.36343", "category": "cond-mat", "title": "Directional strain control of magnetism in MnBi$_2$Se$_4$, MnSb$_2$Se$_4$, and MnSb$_2$Te$_4$ freestanding monolayers", "abstract": "MnBi$_2$Se$_4$, MnSb$_2$Se$_4$, and MnSb$_2$Te$4$ are layered magnetic quantum materials of interest for spintronic and topological electronic applications, where control of magnetic order at the atomic scale is essential. These materials are particularly sensitive to strain. We investigate their strain-dependent magnetism in the monolayer limit using first-principles calculations across the full two-dimensional strain space spanned by independent variations of the two in-plane strain components. Our results show that the Mn-projected local moments depend primarily on the volumetric strain, whereas the magnetic ground state, exchange interactions, magnetocrystalline anisotropy, and ordering temperature show pronounced directional and composition-dependent responses. We also observe strain-induced competition between the phases, with MnBi$_2$Se$_4$, and MnSb$_2$Se$_4$ monolayers exhibiting a more diverse range of competing magnetic states, while MnSb$_2$Te$_4$ monolayer remains ferromagnetic over a larger portion of strain space. MnSb$_2$Te$_4$ also exhibits a substantially larger out-of-plane magnetocrystalline anisotropy, while showing a weaker dependence on strain than the Se-based materials. The calculated magnetic ordering temperature maps further highlight the role of two-dimensional strain to tune thermal magnetic stability in these materials. These results establish magnetoelastic trends across this family of Mn-based chalcogenide monolayers.", "url": "https://arxiv.org/abs/2609.36343", "type": "理论+数值", "summary": "1. 该工作用第一性原理计算研究了MnBi2Se4、MnSb2Se4和MnSb2Te4自支撑单层在由两个面内应变分量独立变化所张成的完整二维应变空间中的磁性。\n2. 其关键物理在于：Mn投影局域磁矩主要由体积应变决定，而磁基态、交换作用、磁晶各向异性和磁有序温度呈显著方向与组分依赖，并可出现应变诱导的磁相竞争；MnSb2Te4在更大应变范围内保持铁磁，面外各向异性更强且对应变依赖更弱。\n3. 该工作建立了这一Mn基硫属化物单层家族的磁弹趋势，为通过二维应变调控自旋电子学与拓扑电子学应用中的热磁稳定性提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Swarnava Ghosh"}, {"name": "Tanvir Sohail"}, {"name": "Markus Eisenbach"}], "featured_authors": [{"name": "Swarnava Ghosh"}, {"name": "Tanvir Sohail"}, {"name": "Markus Eisenbach"}], "author_count": 3}, {"id": "2609.36447", "category": "cond-mat", "title": "Derivation of the General Solution of the Black-Scholes Boundary-Value Problem", "abstract": "There are infinitely many functions that satisfy the Black-Scholes partial differential equation and the terminal condition corresponding to the European call option. This means that the Black-Scholes formula, which led to the award of the 1997 Nobel Prize in Economic Sciences, is not the unique solution, as was once assumed. Consequently, it violates the law of one price, one of the fundamental laws of economics and finance. In this article, we present a rigorous derivation of these solutions to the Black-Scholes boundary value problem.", "url": "https://arxiv.org/abs/2609.36447", "type": "理论", "summary": "1. 该工作针对布莱克-斯科尔斯边值问题，证明在欧式看涨期权终端条件下，满足该偏微分方程的函数并非唯一，并给出这些通解的严格推导。\n2. 其核心卖点在于以严格推导给出满足相同终端条件的无穷多解，表明经典布莱克-斯科尔斯公式仅为其中之一，从而挑战唯一性假设与一价定律。\n3. 这一严格推导为重新审视衍生品定价中的边界条件、无套利约束及一价定律的适用边界提供了理论基础，并提示后续模型需处理解的非唯一性与可识别性问题。", "summary_source": "deepseek", "authors": [{"name": "ByoungSeon Choi"}, {"name": "M.Y. Choi"}], "featured_authors": [{"name": "ByoungSeon Choi"}, {"name": "M.Y. Choi"}], "author_count": 2}, {"id": "2609.36476", "category": "cond-mat", "title": "Crossover of Scaling Behaviors of Work Cumulants in a Driven Gaussian Field Theory", "abstract": "We derive the finite-temperature characteristic function of work (CFW) for a driven $O(N)$ Gaussian field theory and obtain closed-form expressions for all zero-temperature excess-work cumulants. For gapped protocols, we use adiabatic perturbation theory (APT) to derive the $\\tau_Q^{-2}$ scaling for protocols with a nonzero first derivative at either boundary, where $\\tau_Q$ is the protocol duration; smoother boundaries lead to faster decay. For power-law protocols approaching the critical point with exponent $p$, we determine the competition between critical excitations and the regular contribution. The $n$th cumulant's critical contribution follows Kibble--Zurek (KZ) scaling $\\tau_Q^{-p(d+n)/(p+2)}$ for $d+n<2p+4$, acquires a logarithmic correction $\\tau_Q^{-2p}\\log\\tau_Q$ at $d+n=2p+4$, and scales as $\\tau_Q^{-2p}$ above this condition, where $d$ is the spatial dimension. This analytical study of the APT--KZ crossover in a solvable model provides a basis for studying their competition in interacting field theories.", "url": "https://arxiv.org/abs/2609.36476", "type": "理论", "summary": "1. 该工作推导了驱动 O(N) 高斯场论中功的有限温特征函数，并给出零温过剩功各阶累积量的闭式表达式。\n2. 卖点在于解析刻画 APT-KZ 交叉：能隙协议按 τ_Q^{-2} 衰减，幂律趋临界协议的功累积量呈 KZ 标度并含对数修正。\n3. 该可解模型为在相互作用场论中研究绝热微扰与 Kibble-Zurek 机制的竞争提供了基准与启发。", "summary_source": "deepseek", "authors": [{"name": "Yanbo Qiao"}, {"name": "Ruohan Xu"}, {"name": "H. T. Quan"}], "featured_authors": [{"name": "Yanbo Qiao"}, {"name": "Ruohan Xu"}, {"name": "H. T. Quan"}], "author_count": 3}, {"id": "2609.36497", "category": "cond-mat", "title": "Evanescent-wave Johnson Noise from Superconductors", "abstract": "We compute the evanescent-wave Johnson noise (EWJN) in the vacuum half-space above a superconductor, and the resulting relaxation time ($T_1$) of spin and charge qubits placed at nanometer distances from the surface. The electromagnetic response is described by a single microscopic transverse current-response kernel $Q(q, \\omega)$ for a BCS superconductor. This is computed for varying densities of both non-magnetic impurities and magnetic impurities, for arbitrary frequency and temperature and for wave vectors $q \\ll k_F$ (the Fermi wavevector). When combined with the fluctuation-dissipation theorem and the nonlocal surface impedances of the half-space, this yields the magnetic and electric field noise at any distance $z \\gg k_F^{-1}$ from the surface, from which we obtain $T_1$. Just below $T_c$ the magnetic noise is enhanced relative to the normal state by the coherence (Hebel-Slichter-type) peak of the dissipative conductivity and drops exponentially at lower temperatures; the electric noise shows no coherence peak. The theory predicts that there is a zero-temperature noise floor induced by magnetic impurities. In the gapless regime produced by pair breaking, the finite subgap density of states $\\nu(0)$ yields a temperature-independent noise spectral density and a relaxation rate bounded by $T_1^{-1}(T)\\le[\\nu(0)/\\nu_F]^{2}\\,T_{1,N}^{-1}(T)$ for $T\\ll T_c$, with equality in the extreme nonlocal regime. Here $\\nu(0)$ and $\\nu_F$ are the superconducting and normal-state densities of states at the Fermi energy, and $T_{1,N}(T)$ is the relaxation time the same electrode would produce in its normal state at the same temperature.", "url": "https://arxiv.org/abs/2609.36497", "type": "理论+数值", "summary": "1. 该工作计算了超导体上方真空半空间中的倏逝波约翰逊噪声，并给出距表面纳米级自旋与电荷量子比特的弛豫时间T1。\n2. 其核心是以BCS超导体的单一微观横向电流响应核Q(q,ω)描述电磁响应，计入非磁与磁杂质、任意频率和温度及q≪k_F，结合涨落耗散定理与非局域表面阻抗导出磁场和电场噪声谱。\n3. 该理论预言Tc以下磁噪声因耗散电导相干峰先增强后指数降低、电噪声无相干峰，磁杂质诱导零温噪声底，破对无能隙区满足T1^{-1}(T)≤[ν(0)/ν_F]^2 T_{1,N}^{-1}(T)，为超导量子器件近表面退相干提供定量约束。", "summary_source": "deepseek", "authors": [{"name": "Hruday Mallubhotla"}, {"name": "Gustav Romare"}, {"name": "Ilya Esterlis"}, {"name": "Maxim Vavilov"}, {"name": "Robert Joynt"}, {"name": "Alex Levchenko"}], "featured_authors": [{"name": "Hruday Mallubhotla"}, {"name": "Gustav Romare"}, {"name": "Ilya Esterlis"}, {"name": "Maxim Vavilov"}, {"name": "Robert Joynt"}, {"name": "Alex Levchenko"}], "author_count": 6}, {"id": "2609.36538", "category": "cond-mat", "title": "Frustrated Gd3+ Double Perovskites as High-Performance Magnetocaloric Materials for Sub-100 mK Adiabatic Demagnetization Refrigeration", "abstract": "Achieving temperatures below 100 mK is essential for advancing quantum technologies and exploring fundamental quantum phenomena. While paramagnetic salts have traditionally enabled adiabatic demagnetization refrigeration (ADR), their limitations have driven the search for more effective alternatives. In this work, we present Gd3+-based double perovskites, Ba2GdSbO6 and Sr2GdSbO6, as high-performance magnetocaloric materials. Starting ADR from 2 K and 5 T, these compounds reach 67 mK and 68 mK in small finite magnetic fields, and 83 mK and 78 mK in zero field, respectively, which are the lowest reported ADR temperatures for Gd3+ magnets (S = 7/2) under these conditions. The frustrated geometry and the complex interplay of exchange and dipolar interactions suppress their antiferromagnetic ordering temperatures to 100 and 166 mK for Ba2GdSbO6 and 190 mK for Sr2GdSbO6, while maintaining an outstanding entropy density of 189 mJ K-1 cm-3 and 201 mJ K-1 cm-3, respectively. Notably, Ba2GdSbO6 sustains sub-100 mK cooling even at finite fields of 0.5 T, making it particularly promising for practical ADR applications.", "url": "https://arxiv.org/abs/2609.36538", "type": "理论", "summary": "1. 该工作报道了Gd3+基双钙钛矿Ba2GdSbO6和Sr2GdSbO6，并评估其亚100 mK绝热退磁制冷性能。\n2. 其关键优势在于阻挫几何与交换/偶极相互作用把反铁磁序压低到100–190 mK，同时保持189–201 mJ K−1 cm−3熵密度并实现67–83 mK极低温。\n3. Ba2GdSbO6在0.5 T有限场仍能亚100 mK冷却，表明阻挫双钙钛矿可作为顺磁盐之外实现实用绝热退磁制冷的候选材料。", "summary_source": "deepseek", "authors": [{"name": "Tim Treu"}, {"name": "Marvin Klinger"}, {"name": "Christian Heil"}, {"name": "Hans-Albrecht Krug von Nidda"}, {"name": "Vinicius E. S. Frehse"}, {"name": "Mamoun Hemmida"}, {"name": "Anton Jesche"}, {"name": "Alexander A. Tsirlin"}, {"name": "Philipp Gegenwart"}], "featured_authors": [{"name": "Tim Treu"}, {"name": "Marvin Klinger"}, {"name": "Christian Heil"}, {"name": "Anton Jesche"}, {"name": "Alexander A. Tsirlin"}, {"name": "Philipp Gegenwart"}], "author_count": 9}, {"id": "2609.36554", "category": "cond-mat", "title": "Multicomponent anyons in one-dimensional optical lattices", "abstract": "We investigate the ground-state and dynamical properties of multicomponent interacting anyons confined in a one-dimensional (1D) optical lattice. Adopting the Anyon--Hubbard model, we explore spin and charge correlations as functions of interaction strength and the anyonic statistical parameter. Our results demonstrate that multicomponent effects combined with fractional exchange statistics substantially reshape both charge and spin correlations. For fractional exchange statistics, the canonical symmetric shell structure with prominent singularities in the spinor fermionic momentum distribution undergoes notable structural reconstruction, exhibiting emergent asymmetry, new spectral peaks, and broadened singular features. Unlike the Tonks--Girardeau bosonic gas, pseudobosons, representing a limiting case of anyons, cease to display a dominant zero-momentum peak. Instead, a quasi-fermionic shell structure emerges with finite-momentum peaks, whose locations are modulated by lattice site occupancy and interaction strength. The structure factor of spin correlations uncovers antiferromagnetic ordering in spinor anyon systems, with correlation magnitudes tunable by anyonic exchange statistics. Furthermore, quench dynamics analysis reveals the statistical phase parameter as an effective tuning knob. It enables the switching of dipole oscillations between underdamped and overdamped relaxation regimes and governs overall cloud expansion dynamics. Our findings pave the way for exploring statistics-driven ground-state and dynamical phase transitions in spinor anyon systems.", "url": "https://arxiv.org/abs/2609.36554", "type": "理论", "summary": "1. 该工作用任意子Hubbard模型研究一维光晶格中多分量相互作用任意子的基态与动力学，考察自旋和电荷关联随相互作用及统计参数的变化。\n2. 其卖点是分数统计与多分量效应重构电荷和自旋关联，准玻色子极限下零动量峰消失并形成有限动量准费米壳层，自旋关联显示可调反铁磁序。\n3. 统计相位可作为调控参量，切换偶极振荡的欠阻尼/过阻尼松弛并主导云膨胀，为自旋任意子系统统计驱动的基态与动力学相变探索提供途径。", "summary_source": "deepseek", "authors": [{"name": "Sagarika Basak"}, {"name": "Xi-Wen Guan"}, {"name": "Han Pu"}], "featured_authors": [{"name": "Sagarika Basak"}, {"name": "Xi-Wen Guan"}, {"name": "Han Pu"}], "author_count": 3}, {"id": "2609.36555", "category": "cond-mat", "title": "Generalized Effective Spin-Chain formalism for multicomponent anyons in one-dimensional optical lattices", "abstract": "We develop a generalized effective spin-chain (GESC) formalism for strongly interacting multicomponent anyons in a one-dimensional (1D) optical lattice. By mapping particle motion onto spinless fermions and spin states onto an ordered chain, this framework provides a spin--charge-separated perspective on the physical effects of fractional exchange statistics. In the strong-interaction regime, the leading-order charge Hamiltonian becomes independent of the statistical phase; instead, virtual tunneling through doubly occupied states directly imprints this phase on the spin-exchange coefficients. The GESC formalism captures ground-state properties of the full Anyon--Hubbard model reported in S.~Basak, X.-W.~Guan, and H.~Pu, unpublished manuscript (2026), and reveals that their statistical dependence is predominantly encoded in the explicit anyonic structure of the observables rather than the underlying spin ground state. This formalism uncovers that, out of equilibrium, successive spin exchanges accumulate direction-dependent phases; the resulting interference drives crossover from dispersive to localized impurity transport and generates inversion-asymmetric propagation at intermediate statistics. Suppressed expansion persists for identical and distinguishable impurities, with differences in propagation governed by the interplay between impurity identity and interaction anisotropy. Ultimately, GESC offers a versatile, computationally efficient theoretical framework that connects macroscopic dynamics to microscopic virtual exchange processes, conferring a unique spin--charge-separated vantage for resolving how fractional exchange statistics survives strong interactions and manifests distinctly across static and dynamical regimes.", "url": "https://arxiv.org/abs/2609.36555", "type": "理论", "summary": "1. 我们开发了一种广义有效自旋链（GESC）形式，用于一维（1D）光学晶格中强相互作用的多组分任意子。\n2. GESC 形式主义捕获了 S.~Basak、X.-W.~Guan 和 H.~Pu（未发表的手稿（2026））中报告的完整 Anyon-Hubbard 模型的基态特性，并揭示了它们的统计依赖性主要编码在可观测量的显式任意子结构中，而不是底层的自旋基态中。\n3. 这种形式表明，在不平衡的情况下，连续的自旋交换会积累方向相关的相位；由此产生的干扰驱动从色散杂质传输到局域杂质传输的交叉，并在中间统计处产生反演不对称传播。", "summary_source": "local-fallback", "authors": [{"name": "Sagarika Basak"}, {"name": "Xi-Wen Guan"}, {"name": "Han Pu"}], "featured_authors": [{"name": "Sagarika Basak"}, {"name": "Xi-Wen Guan"}, {"name": "Han Pu"}], "author_count": 3}, {"id": "2609.36591", "category": "cond-mat", "title": "Mechanical Signature of a Chemically Driven Bath", "abstract": "Using optical tweezers, we demonstrate that the CuAAC click reaction increases the positional fluctuations of a trapped 2 micrometer colloid by at least 20% without altering the trap's corner frequency. This excess variance relaxes to the thermal baseline as reagents are depleted. The additional noise is Gaussian, with a flat power spectrum extending past the corner frequency up to 7 kHz. Notably, the noise amplitude decouples from the macroscale reaction rate, and independent molecular force dipoles are orders of magnitude too small to generate the observed variance. Although the chemical free energy released locally exceeds the energy absorbed by the bead by five orders of magnitude, this energy couples inefficiently. The mechanical action of the reacting bath cannot be represented as a sum of independent molecular events.", "url": "https://arxiv.org/abs/2609.36591", "type": "理论", "summary": "1. 该工作用光镊测量2微米胶体在CuAAC点击反应液中的位置涨落，发现反应使涨落方差至少增加20%，陷阱拐角频率不变，且过量方差随反应物耗尽回到热基线。\n2. 其物理卖点是：额外噪声为高斯型、功率谱平坦并延伸至拐角频率以上7千赫兹，幅度与宏观反应速率解耦，独立分子力偶极子产生的方差小几个数量级；局域化学自由能虽比胶体吸收能量高五个数量级，耦合却极低。\n3. 这暗示反应浴的机械作用不能表示为独立分子事件的叠加，化学驱动涨落可能具有集体或非可加性，需发展连接微观反应与介观力学的非平衡理论。", "summary_source": "deepseek", "authors": [{"name": "Tian Huang"}, {"name": "Jintae Park"}, {"name": "Hyuk Kyu Pak"}, {"name": "Steve Granick"}], "featured_authors": [{"name": "Tian Huang"}, {"name": "Jintae Park"}, {"name": "Hyuk Kyu Pak"}, {"name": "Steve Granick"}], "author_count": 4}, {"id": "2609.36681", "category": "cond-mat", "title": "Averaging in thermodynamic dislocation theory: general macroscopically uniform stress and strain states", "abstract": "The averaging procedure, developed for polycrystalline bars under axially symmetric tension or compression, is extended to arbitrary macroscopically uniform stress and strain states. Starting from the equal probability hypothesis for grain orientations, the mean resolved shear stress and the mean resolved elastic and plastic shear strains are defined as root-mean-square averages over all slip-system orientations. Two exact identities for isotropic orientation averages show that the mean resolved shear stress is proportional to the von Mises equivalent stress, and that the direction of macroscopic plastic flow, obtained from the hypothesis that the plastic slip rate on a system is proportional to the resolved shear stress acting on it, is the stress deviator. The result is an associated $J_2$ flow theory whose hardening law is not fitted but follows from the kinetics of thermally activated dislocation depinning and the evolution equations for the dislocation density and the effective disorder temperature of thermodynamic dislocation theory, written as rates with respect to time so that arbitrary loading paths can be followed. For torsion the theory yields the torque--twist relation of bars and tubes without the classical reductions to a shear stress--strain curve. The parameters for copper are identified jointly from Hopkinson-bar tension, dynamic compression at room and elevated temperatures, and torque--twist records at several twist rates. One set of material parameters, consistent with the earlier compression-only identification, describes tension, compression and torsion from room temperature to $1173$\\,K and from $10$ to $2300$\\,s$^{-1}$ to $6$\\,\\% rms over 142 data points; the tension--torsion discrepancy noted by Johnson and Cook is traced to the initial dislocation state of their torsion specimens.", "url": "https://arxiv.org/abs/2609.36681", "type": "理论+数值", "summary": "1. 该工作将热力学位错理论的平均化方法从轴对称拉压推广至任意宏观均匀应力/应变状态，用晶粒取向等概率下对各滑移系取向的均方根平均定义平均分解剪应力与平均弹性、塑性剪应变。\n2. 核心是两条精确恒等式：平均分解剪应力正比于von Mises等效应力，塑性流动方向为应力偏量，由此导出关联J2流动理论；硬化律由热激活位错脱钉动力学及位错密度、有效无序温度的演化率方程给出，按时间率形式可追踪任意加载路径，扭转时直接给出扭矩-扭转关系。\n3. 对铜联合标定Hopkinson杆拉伸、室/高温动态压缩与多速率扭矩-扭转数据，一套参数在室温至1173 K、10–2300 s−1下以6% rms描述142点，并将Johnson-Cook张力-扭转差异归因于扭转试样初始位错状态。", "summary_source": "deepseek", "authors": [{"name": "Khanh Chau Le"}], "featured_authors": [{"name": "Khanh Chau Le"}], "author_count": 1}, {"id": "2609.36682", "category": "cond-mat", "title": "Polar-Domain Volume as a Unified Descriptor of Transport in Ionic Liquids", "abstract": "Developing molecular scale structural descriptors that can quantitatively predict the macroscopic transport properties of ionic liquids remains a longstanding question, owing to the complex interplay between molecular interactions, nanoscale organization, and collective ion dynamics. Here, we use all atom molecular dynamics simulations to establish quantitative structure property relationships between the equilibrium microstructure and two key transport properties viscosity and ionic conductivity in a series of imidazolium based ILs with chemically distinct anions and varying alkyl chain lengths. While viscosity and ionic conductivity exhibit distinct dependencies on alkyl chain length and anion chemistry, these seemingly different trends largely collapse onto unified correlations when expressed in terms of the mean polar-domain volume. In particular, both transport properties exhibit systematic power-law scaling with the mean polar domain volume fraction, revealing a common structural origin underlying the variations in ion and momentum transport across chemically distinct ILs. These results establish polar-domain volume as a physically motivated molecular-scale descriptor and provide a general structure property framework for connecting nanoscale organization to macroscopic transport properties in ILs.", "url": "https://arxiv.org/abs/2609.36682", "type": "数值", "summary": "1. 该工作利用全原子分子动力学模拟，在具有不同阴离子化学和烷基链长度的咪唑类离子液体中，建立平衡微观结构与黏度、离子电导率之间的定量构效关系。\n2. 关键发现是尽管黏度和离子电导率对烷基链长与阴离子化学的依赖不同，二者在以平均极性域体积（分数）表征时基本坍缩到统一的幂律标度关系，表明离子输运与动量输运受共同纳米结构起源支配。\n3. 这确立了平均极性域体积作为有物理依据的分子尺度描述符，并为将离子液体的纳米尺度组织与宏观输运性质关联提供通用构效框架。", "summary_source": "deepseek", "authors": [{"name": "Ganesh K. Rajahmundry"}, {"name": "Tarak K. Patra"}], "featured_authors": [{"name": "Ganesh K. Rajahmundry"}, {"name": "Tarak K. Patra"}], "author_count": 2}, {"id": "2609.36846", "category": "cond-mat", "title": "Locking transition in coupled disordered systems", "abstract": "When a system of many interacting constituents is extended across space, every region carries the same disordered landscape, and it is unclear whether distant regions settle into the same state. We study copies of the Random Energy Model (REM), sharing one disorder realization, coupled along a chain. A first-order transition separates a phase with short-range correlations, from a locked phase in which the entire chain occupies the lowest-energy state with probability one, even at positive temperature. No intermediate ordering lengths occur. In the Generalized REM the chain locks either to the lowest-energy state or to the lowest free-energy valley.", "url": "https://arxiv.org/abs/2609.36846", "type": "理论", "summary": "1. 该工作研究共享同一无序实现的随机能量模型（REM）副本沿一维链耦合，考察空间扩展的无序系统是否会让各区域进入同一状态。\n2. 其核心是一阶“锁定”转变：体系从仅具短程关联的相直接进入整条链以概率1占据最低能态的相，即使温度为正，且不出现中间有序尺度；广义REM中则可锁定到最低能态或最低自由能谷。\n3. 这为理解同一无序景观下耦合系统的全局同步与无序相变提供了最小模型，并暗示相关玻璃态或扩展系统中的锁定行为可由类似机制支配。", "summary_source": "deepseek", "authors": [{"name": "Guy Bunin"}], "featured_authors": [{"name": "Guy Bunin"}], "author_count": 1}, {"id": "2609.36868", "category": "cond-mat", "title": "Quantized Hyperfine Field at an Implanted $μ^+$ Site in PrPb$_3$: Interplay between Localized $f$ Electrons and an Interstitial Charged Particle", "abstract": "The local effect of an interstitial hydrogen-like particle on localized $f$ electrons was studied in PrPb$_3$ by means of $\\mu^+$ spin rotation and relaxation. Spontaneous $\\mu^+$ spin precession with harmonic frequencies was observed for the first time in $f$ electron compounds. We demonstrate that the signal is derived from a coupling between the $\\mu^+$ spin and the hyperfine-enhanced nuclear spin of nearest neighbor (nn) $^{141}$Pr with Ising-like anisotropy. The signal also suggests a marked suppression of spin dynamics of the nn $^{141}$Pr in comparison with that of the bulk $^{141}$Pr. These facts strongly indicate modification of the $f$ electronic state due to the interstitial charged particle.", "url": "https://arxiv.org/abs/2609.36868", "type": "理论", "summary": "1. 利用μ+自旋旋转/弛豫在PrPb3中研究了间隙氢样粒子对局域f电子的影响，并首次在f电子化合物中观测到自发μ+自旋进动的谐波频率信号。\n2. 核心机制是该信号源于μ+自旋与最近邻¹⁴¹Pr中超精细增强核自旋的Ising型各向异性耦合，且最近邻自旋动力学较体相显著抑制。\n3. 这些事实强烈表明间隙带电粒子改变了f电子态，为通过植入μ+或氢样粒子局域探测与调控f电子体系提供了思路。", "summary_source": "deepseek", "authors": [{"name": "T. U. Ito"}, {"name": "W. Higemoto"}, {"name": "K. Ohishi"}, {"name": "N. Nishida"}, {"name": "R. H. Heffner"}, {"name": "Y. Aoki"}, {"name": "A. Amato"}, {"name": "T. Onimaru"}, {"name": "H. S. Suzuki"}], "featured_authors": [{"name": "T. U. Ito"}, {"name": "W. Higemoto"}, {"name": "K. Ohishi"}, {"name": "A. Amato"}, {"name": "T. Onimaru"}, {"name": "H. S. Suzuki"}], "author_count": 9}, {"id": "2609.36886", "category": "cond-mat", "title": "Static versus dynamic universality in the site-diluted kagome Ising model", "abstract": "We study the site-diluted Ising model on the kagome lattice using the Wolff single-cluster algorithm, focusing on both equilibrium and dynamic critical properties. The equilibrium critical exponents $\\nu = 1$ and $\\gamma/\\nu = 7/4$ retain their exact pure Ising values for all spin concentrations $p$ considered, consistent with the marginal irrelevance of disorder at $\\alpha = 0$, with the specific heat crossing over from logarithmic to double-logarithmic growth upon dilution. These static results are shared between the kagome and square lattices. On the dynamic side, $z$ decreases upon dilution on both lattice, opposite to what is observed under local dynamics, with evidence of saturation to a $p$-independent value at strong dilution, suggesting a diluted dynamic fixed point. While $z$ is consistent between the two lattices in the pure case, it differs in the diluted regime, an effect we attribute to the two lattices sitting at different positions along the renormalization-group flow between the Ising and percolation fixed points, rather than to a true asymptotic breakdown of dynamic universality.", "url": "https://arxiv.org/abs/2609.36886", "type": "理论+数值", "summary": "1. 我们使用 Wolff 单簇算法研究了 kagome 晶格上的位点稀释 Ising 模型，重点关注平衡和动态临界特性。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Alexandros Vasilopoulos"}, {"name": "Zeynep Demir Vatansever"}, {"name": "Erol Vatansever"}, {"name": "Gerard T. Barkema"}, {"name": "Nikolaos G. Fytas"}], "featured_authors": [{"name": "Alexandros Vasilopoulos"}, {"name": "Zeynep Demir Vatansever"}, {"name": "Erol Vatansever"}, {"name": "Gerard T. Barkema"}, {"name": "Nikolaos G. Fytas"}], "author_count": 5}, {"id": "2609.36936", "category": "cond-mat", "title": "Ergodicity in a hole-dopped Anderson spin insulator", "abstract": "An interacting many-body system being localized in the presence of disorder can fail to serve as its own bath. In an electronic system, the charge and spin degrees of freedom can act as thermal baths for each other. In this paper, we study the stability of an Anderson insulator in the spin sector with respect to charge doping. We consider one-dimensional two-component fermions in a lattice with large onsite repulsion ($t-J_{XX}$ model) and with a single hole in a random magnetic field. In the absence of the hole the spin sector is localized in arbitrarily weak random magnetic fields. We argue that a single hole thermalizes the spin chain in the weak disorder limit. In this regime our numerical results indicate ergodicity of the system as a whole and delocalization of the hole. At larger magnetic fields the hole eventually localizes with a finite localization length, and the Anderson spin insulator is restored.", "url": "https://arxiv.org/abs/2609.36936", "type": "理论+数值", "summary": "1. 该文研究了一维强在位排斥的两组分费米子t-J_XX模型在随机磁场中掺入单个空穴后，自旋安德森绝缘体的稳定性与掺杂诱导的遍历性问题。\n2. 数值结果表明，弱无序下该空穴可作为移动热浴使自旋链热化，系统整体呈现遍历性且空穴离域；较强磁场下空穴最终以有限局域长度局域化，安德森自旋绝缘体恢复。\n3. 这揭示了电荷掺杂可打破自旋扇区的安德森局域化，为理解电荷与自旋互为热浴以及掺杂诱导的局域化—遍历转变提供了具体方向。", "summary_source": "deepseek", "authors": [{"name": "M. S. Bahovadinov"}, {"name": "A. A. Markov"}, {"name": "G. V. Shlyapnikov"}], "featured_authors": [{"name": "M. S. Bahovadinov"}, {"name": "A. A. Markov"}, {"name": "G. V. Shlyapnikov"}], "author_count": 3}, {"id": "2609.36962", "category": "cond-mat", "title": "Deep Learning GW Quasiparticle Hamiltonians for Many-Body Excited-State Electronic Structure at Scale", "abstract": "Accurate quasiparticle electronic structures are the foundation for understanding excited-state properties of materials and explaining optoelectronic, quantum, and transport phenomena. First-principles GW calculations nevertheless remain computationally intensive for large or configurationally complex systems. Here we introduce DeepH-GW, a deep-learning framework that predicts an effective GW quasiparticle Hamiltonian directly from atomic structure. Building on the local, equivariant message-passing architecture of DeepH, DeepH-GW is trained on high-fidelity plane-wave GW calculations through a real-space Hamiltonian-reconstruction interface. This approach combines the systematic accuracy and broad chemical applicability of plane-wave methods with linear-scaling neural-network inference. Across the systems examined, DeepH-GW reproduces quasiparticle band structures with errors on the order of a few meV. Moreover, we show that, despite the intrinsic nonlocality of many-body interactions, DeepH-GW exhibits strong cross-scale transferability from relatively small training structures to substantially larger supercells. We demonstrate that the framework can accurately capture GW-level electron-phonon band-gap renormalization through predictions in supercells with thermal displacements, illustrating the power of the approach. DeepH-GW therefore provides a practical route toward large-scale many-body simulations and foundation models for excited-state electronic structure.", "url": "https://arxiv.org/abs/2609.36962", "type": "理论+数值", "summary": "1. 该工作提出DeepH-GW深度学习框架，从原子结构直接预测有效GW准粒子哈密顿量。\n2. 其核心是以局域等变消息传递和实空间重构接口，融合平面波GW精度、数meV量级误差与线性标度推理。\n3. 该框架可跨尺度迁移至大超胞并捕捉GW级电声带隙重整化，为大规模激发态模拟与基础模型提供实用路径。", "summary_source": "deepseek", "authors": [{"name": "Xiaoxun Gong"}, {"name": "Zechen Tang"}, {"name": "Woochang Kim"}, {"name": "Yang Li"}, {"name": "Wenhui Duan"}, {"name": "Yong Xu"}, {"name": "Steven G. Louie"}], "featured_authors": [{"name": "Xiaoxun Gong"}, {"name": "Zechen Tang"}, {"name": "Woochang Kim"}, {"name": "Wenhui Duan"}, {"name": "Yong Xu"}, {"name": "Steven G. Louie"}], "author_count": 7}, {"id": "2609.36994", "category": "cond-mat", "title": "Topological Pseudo-Goldstone Modes from Weakly Broken Dipole Conservation", "abstract": "Weakly breaking a continuous symmetry in an ordered phase can convert its Goldstone modes into topological collective bands. We establish this mechanism in a neutral dipole condensate whose conserving parent supports two independent Goldstone phase modes. Weak real flavor mixing pins the phases and selects a chiral condensate. The resulting gyroscopic coupling acts on their winding polarization texture, producing a pseudo-Goldstone sector containing a topological lowest band. Restoring dipole conservation forces the two modes to meet at zero frequency, where their separate band Chern numbers cease to be defined. The same parent dipole charges define a tensor current whose circular response permits model-assisted reconstruction of low-energy embedded local Berry curvature in the benchmark regime. Analytical stability bounds and a large-occupation limit provide a controlled realization of this mechanism.", "url": "https://arxiv.org/abs/2609.36994", "type": "理论", "summary": "1. 该工作在中性偶极凝聚体中建立弱破缺偶极守恒机制，将两支戈德斯通相位模通过弱实味混合与手性凝聚体耦合，生成拓扑赝戈德斯通带。\n2. 其核心机制是陀螺耦合作用于缠绕极化织构，使赝戈德斯通扇区出现拓扑最低带；恢复偶极守恒时两支模零频相遇，单独陈数失去定义。\n3. 母偶极荷定义的张量流其圆响应可在基准区模型辅助重构低能嵌入局域贝里曲率，解析稳定性边界与大占据极限提供受控实现。", "summary_source": "deepseek", "authors": [{"name": "Yan-Guang Yue"}, {"name": "Jie Lou"}, {"name": "Yan Chen"}], "featured_authors": [{"name": "Yan-Guang Yue"}, {"name": "Jie Lou"}, {"name": "Yan Chen"}], "author_count": 3}, {"id": "2609.37008", "category": "cond-mat", "title": "Polar Phase of an Egg-Yolk Particle in a Rotating Magnetic Field", "abstract": "The orbit selected by a magnetic particle in a viscous liquid under a rotating field is commonly described in the instantaneous Stoner--Wohlfarth limit, in which the magnetic moment always occupies a minimum of the anisotropy energy. In this limit, precession out of the field plane exists only for reduced fields $B_0/B_a<1/\\sqrt2$, and stronger fields admit only planar synchronous rotation or libration. We study a macroscopic egg-yolk particle, a printed shell containing two freely rotating permanent magnets in fluid-filled cavities, driven by a compensated rotating field and tracked optically. In addition to synchronous rotation, precession, and libration, the particle exhibits a polar phase: above the instantaneous bound and at high frequency, the shell axis leaves the field plane and locks onto a narrow cone about the rotation axis. We extend the model by a finite viscous friction between the magnets and the shell. The extension introduces a single dimensionless parameter, the ratio $\\kappa$ of inner to outer rotational friction, and reduces to the instantaneous theory as $\\kappa\\to0$. Numerical phase diagrams show that increasing $\\kappa$ tilts the bistable band to higher fields at higher frequencies and extends stable precession above $B_0/B_a=1/\\sqrt2$, whereas for large $\\kappa$ planar libration returns at high frequency. With a calibrated anisotropy field, relaxation rate, and $\\kappa$ of order unity, the model reproduces the terminal state of all measured records and their tilt angles, including the polar cone. In the model the polar state is maintained by a steady rotation of the magnets relative to the shell, driven by the field and anisotropy torques and dissipated by the inner friction; it therefore exists only for intermediate $\\kappa$.", "url": "https://arxiv.org/abs/2609.37008", "type": "理论+数值", "summary": "1. 该工作实验研究了旋转磁场中宏观蛋黄型粒子，并在同步、进动和天平动之外发现高场高频下的极相。\n2. 其卖点是引入磁体与壳层间有限黏性摩擦，以单参数κ推广瞬时理论，使稳定进动越过瞬时上界并重现极锥。\n3. 该极相由磁场与各向异性力矩驱动磁体相对壳层稳态旋转、内摩擦耗散维持，因而仅存在于中等内摩擦比。", "summary_source": "deepseek", "authors": [{"name": "Roberts Treize"}, {"name": "Janis Cimurs"}], "featured_authors": [{"name": "Roberts Treize"}, {"name": "Janis Cimurs"}], "author_count": 2}, {"id": "2609.37010", "category": "cond-mat", "title": "Spin separation of Dirac electrons by twisted and vector optical beams", "abstract": "We demonstrate that twisted and vector optical beams can spatially separate two-dimensional electrons with opposite spin projections. Spin accumulation arises from diverging spin currents induced by structured light together with spin relaxation and diffusion. We derive analytical expressions for the resulting spin density in the quasi-local and diffusion-controlled regimes and numerically calculate the spin textures for the parameters relevant to transition metal dichalcogenide monolayers. Our results suggest a mechanism by which the twist and vector pattern of optical beams can be imprinted onto the electron spin degree of freedom.", "url": "https://arxiv.org/abs/2609.37010", "type": "数值", "summary": "1. 该工作展示了扭曲光束与矢量光束可通过结构化光诱导的空间发散自旋电流，将二维狄拉克电子中相反自旋投影的电子在空间上分离。\n2. 其核心在于结合自旋弛豫与扩散，推导准局域和扩散控制区自旋密度的解析式，并针对过渡金属硫族化合物单层参数计算自旋织构。\n3. 这提出了一种将光束扭曲与矢量偏振图案印刻到电子自旋自由度的机制，为二维材料中的全光自旋调控、自旋输运及相关光电器件设计提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "A. A. Gunyaga"}, {"name": "M. V. Durnev"}, {"name": "S. A. Tarasenko"}], "featured_authors": [{"name": "A. A. Gunyaga"}, {"name": "M. V. Durnev"}, {"name": "S. A. Tarasenko"}], "author_count": 3}, {"id": "2609.37032", "category": "cond-mat", "title": "Finite-momentum trimers and Cooper quartets in a one-dimensional Fermi gas with coexistent $s$- and $p$-wave interactions", "abstract": "We study finite-momentum trimers and Cooper quartets in a one-dimensional two-component Fermi gas with coexistent $s$- and $p$-wave interactions, regularized in the relative momentum of each pair so that they remain Galilean invariant. Pauli blocking alone then makes the trimer dispersion deviate from free center-of-mass motion, so the trimer energy can be lowest at finite total momentum. Allowing this motion expands the $abb$ region among pairs and trimers and removes the region where an odd-wave pair is lowest. The $aabb$ quartet lies below all these branches at every sampled coupling, and in a strip starting on the crossing of the two dimer-pair channels its lowest breakup channel is a moving $abb$ trimer and an atom. At weak interspecies attraction, a variational bound shows that two odd-wave Cooper pairs bind into a quartet, whose binding exceeds that of the coexisting trimer by orders of magnitude as the attraction weakens. At stronger interspecies attraction, the quartet binding relative to two unlike-species dimers disappears when the odd-wave interaction is switched off, although the even-wave interaction dominates the interaction energy. Relative to the in-vacuum case, the Fermi sea enhances the weak-coupling quartet binding, and at fixed scattering lengths the quartet binding grows with density while the coexisting trimer becomes much shallower. These results show that neither the most strongly bound pair nor the dominant interaction energy alone determines whether the quartet binds.", "url": "https://arxiv.org/abs/2609.37032", "type": "理论+数值", "summary": "1. 我们研究一维二维费米气体中的有限动量三聚体和库珀四聚体，具有共存的 $s$ 波和 $p$ 波相互作用，对每对的相对动量进行正则化，以便它们保持伽利略不变性。\n2. $aabb$ 四重奏位于每个采样耦合处的所有这些分支下方，并且在从两个二聚体对通道交叉处开始的条带中，其最低分解通道是移动的 $abb$ 三聚体和原子。\n3. 相对于真空情况，费米海增强了弱耦合四重体结合，并且在固定的散射长度下，四重体结合随着密度的增加而增加，而共存的三聚体变得更浅。", "summary_source": "local-fallback", "authors": [{"name": "Yixin Guo"}], "featured_authors": [{"name": "Yixin Guo"}], "author_count": 1}, {"id": "2609.37034", "category": "cond-mat", "title": "Cavity-QED enhancement of quantum entanglement and battery performance in double quantum dots", "abstract": "We theoretically investigate quantum correlations and energy storage in a single-electron silicon double quantum dot (eDQD) coupled to a single-mode microwave cavity. The charge and spin degrees of freedom are hybridized by Rashba spin-orbit coupling (SOC), while the cavity interacts with the eDQD through spin-photon and charge-photon couplings. Using the reduced thermal density matrix, we characterize spin-charge entanglement by concurrence and quantum coherence by the $l_1$ norm. At low temperature, the cavity strongly modifies the spin-charge correlations, producing distinct regimes of enhanced and suppressed entanglement. We identify a nonlinear crossover between an eDQD-dominated regime and a photon-dressed regime. This crossover is revealed independently by two signatures: a rapid change in the concurrence and the onset of finite photon occupation in the cavity. Its boundary exhibits a dominant $G_{\\rm c}\\propto\\sqrt{\\Omega}$ dependence and is robust against cavity Hilbert-space truncation. Beyond the Rashba coupling studied in [Ferreira et al., Phys. Rev. A 107, 052408 (2023)], we show that the cavity provides an additional tunable means of controlling quantum correlations and energy storage. We further characterize the eDQD as a quantum battery under coherent charging and evaluate its stored energy and ergotropy. The ergotropy varies markedly across a cavity-dressing crossover resembling that identified from entanglement, connecting cavity-induced modification of the dressed states to extractable work. Optimization over the charge-photon coupling reveals parameter-dependent optimal charging regimes and enhanced maximum ergotropy with increasing Rashba coupling. Our results establish cavity coupling and SOC as complementary controls of quantum correlations and extractable energy in semiconductor eDQD-cavity systems.", "url": "https://arxiv.org/abs/2609.37034", "type": "理论+数值", "summary": "1. 我们从理论上研究了耦合到单模微波腔的单电子硅双量子点（eDQD）中的量子相关性和能量存储。\n2. A 107, 052408 (2023)]，我们证明腔提供了控制量子相关性和能量存储的额外可调方法。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Hamid Arian Zad"}, {"name": "Usama Shoukat"}, {"name": "Michal Jaščur"}, {"name": "Hazrat Ali"}, {"name": "Saeed Haddadi"}], "featured_authors": [{"name": "Hamid Arian Zad"}, {"name": "Usama Shoukat"}, {"name": "Michal Jaščur"}, {"name": "Hazrat Ali"}, {"name": "Saeed Haddadi"}], "author_count": 5}, {"id": "2609.37036", "category": "cond-mat", "title": "HyTopo A High-Performance Hierarchical Algorithm for Mapping the Structural Evolution and Transition Networks of Gas Hydrates", "abstract": "Resolving the formation and dissociation mechanisms of hydrate requires identifying not only hydrate-like water, but also the specific cage topologies by which disordered liquid water reorganizes into, or escapes from, crystalline hydrate networks. Here we introduce HyTopo, a cage-topology-centered analysis framework that combines a hydrate order parameter, hierarchical ring and cage recognition, and cage-transition network analysis. Based on local orientational correlations, HyTopo classifies water molecules into liquid-like, precursor-like, hydrate-like, and ice-like environments, and uses this information to guide efficient topological searches for crystalline hydrate cages and defective intermediates. Applications to methane hydrate growth, homogeneous nucleation, and depressurization-induced dissociation reveal that hydrate evolution is governed by heterogeneous and pathway-dependent cage dynamics. During hydrate growth, EA-WPU suppresses the overall proliferation of cage-like structures while altering the balance between defective cages and crystalline sI cages. During nucleation, incomplete cage motifs dominate the early pathway and provide a structural reservoir from which a small fraction of stable 512 and 51262 cages. Hydrate dissociation proceeds through interfacial collapse, bulk decomposition, and dissolved-gas exsolution, with cage lifetimes and transition pathways strongly dependent on cage topology. These results show that HyTopo provides a physically interpretable and topology-resolved route to connect local water ordering, cage formation, structural defects, and hydrate phase transitions in complex molecular simulations.", "url": "https://arxiv.org/abs/2609.37036", "type": "理论+数值", "summary": "1. 该工作提出了HyTopo框架，将水合物序参量、分级环与笼识别及笼转变网络分析相结合，用于甲烷水合物的生长、均匀成核与降压解离模拟分析。\n2. 其核心卖点是基于局域取向关联将水分子划分为类液、前驱、类水合物与类冰环境，用以引导晶体笼与缺陷中间体的高效拓扑搜索，并揭示笼动力学的高度非均匀与路径依赖：成核早期由不完整笼基元主导并充当5^12与5^12 6^2笼的结构储备。\n3. 这为在复杂分子模拟中把局域水有序、笼形成、结构缺陷与相变相衔接，提供了物理可解释且拓扑分辨的分析路径。", "summary_source": "deepseek", "authors": [{"name": "Zherui Chen"}, {"name": "Shuquan Huang"}, {"name": "Ke Xu"}, {"name": "Zhanbo Li"}, {"name": "Xinyu Song"}, {"name": "Haijun Wang"}, {"name": "Dingyuan Tang"}, {"name": "Qingxia Liu"}, {"name": "Yajun Deng"}], "featured_authors": [{"name": "Zherui Chen"}, {"name": "Shuquan Huang"}, {"name": "Ke Xu"}, {"name": "Dingyuan Tang"}, {"name": "Qingxia Liu"}, {"name": "Yajun Deng"}], "author_count": 9}, {"id": "2609.37102", "category": "cond-mat", "title": "Thermodynamics of the space of trajectories governed by a combination of two additive boundary functionals", "abstract": "This paper extends the formalism of stochastic path-space thermodynamics by systematically expanding the space of thermodynamic variables with a spectrum of boundary and relative functionals of random processes. Generalizing the approaches introduced in preprints arXiv:2607.24078 and arXiv:2609.08477 , we investigate the fluctuation statistics of a one-dimensional Ornstein-Uhlenbeck process with an asymmetric linear drift and a step penalty potential at the origin, which models the waiting phase of a molecular Brownian motor. Utilizing the Feynman-Kac formalism and the parabolic cylinder theory, a numerical scheme based on matching logarithmic derivatives via the secant method is constructed. A high-precision eigenvalues of the effective Hamiltonian is obtained, which define the cumulant generating function. We formulate a modified path-space fluctuation theorem of the Gallavotti-Cohen type for the conjugate drift current at a fixed integral occupation time of the system in the dissipative half-plane. The physical and thermodynamic significance of the new variables is elucidated. A combination of \"residence time\" and \"integral current\" functionals is applied to describe an ion channel sensitive to mechanical or electrical stimuli.", "url": "https://arxiv.org/abs/2609.37102", "type": "理论+数值", "summary": "1. 该工作将随机路径空间热力学形式化推广到由两类加性边界泛函共同支配的轨迹空间，并研究具非对称线性漂移与原点阶梯罚势的一维奥恩斯坦-乌伦贝克过程的涨落统计。\n2. 其核心卖点在于结合费曼-卡茨形式与抛物柱函数理论，用割线法匹配对数导数高精度求解有效哈密顿量本征值以构造累积量生成函数，并在固定积分占据时间下给出加拉沃蒂-科恩型路径空间涨落定理。\n3. 该框架揭示驻留时间与积分流等新热力学变量的物理意义，可用于描述机械或电刺激敏感的离子通道，并为分子布朗马达等待相及相关随机过程提供可检验的路径热力学启发。", "summary_source": "deepseek", "authors": [{"name": "V. V. Ryazanov"}], "featured_authors": [{"name": "V. V. Ryazanov"}], "author_count": 1}, {"id": "2609.37106", "category": "cond-mat", "title": "Symmetry-enforced topological parity: revisiting $2\\mathbb{Z}$ classifications beyond cellwise symmetry actions", "abstract": "Momentum-dependent symmetry actions can turn the even-integer constraint of a $2\\mathbb{Z}$ classification of topological insulators and superconductors into an odd-integer constraint without changing the symmetry algebra. For internal and order-two crystalline symmetries in up to four spatial dimensions, we derive parity relations between the Chern or winding number of a gapped Hamiltonian and topological invariants of its momentum-dependent antiunitary symmetry matrices. Whenever the symmetry action enforces odd parity, any symmetry-preserving gapped phase must be topologically nontrivial. Using cellwise actions, which are represented by momentum-independent matrices in a fixed unit-cell basis, as a reference, we determine how locality constrains the realization of odd topological numbers. Explicit model constructions and no-go theorems distinguish three cases: odd values can be realized by finite-range symmetry actions, can be realized by exponentially decaying quasilocal actions but not by finite-range actions, or are impossible in finite-dimensional Bloch systems.", "url": "https://arxiv.org/abs/2609.37106", "type": "理论", "summary": "1. 动量相关对称作用可以将拓扑绝缘体和超导体的 $2\\mathbb{Z}$ 分类的偶整数约束转变为奇整数约束，而不改变对称代数。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Ken Shiozaki"}], "featured_authors": [{"name": "Ken Shiozaki"}], "author_count": 1}, {"id": "2609.37110", "category": "cond-mat", "title": "Weakly interacting Bose-Einstein condensate with stochastic resetting", "abstract": "Stochastic resetting can generate strong correlations in many-body systems through a shared fluctuating environment. Here, we investigate how such dynamically emergent correlations (DEC) coexist with intrinsic (direct) interactions in a weakly repulsive Bose-Einstein condensate described within the Gross-Pitaevskii framework. The condensate undergoes free expansion from an initial Thomas-Fermi state and is stochastically reset to this initial state at a constant rate. We show that the resetting protocol drives the system into a unique nonequilibrium steady state and obtain its density profile, edge statistics, and full counting statistics analytically. The steady-state density retains an inverted-parabolic form within the core, while developing exponentially decaying tails outside it. We further show that resetting induces nontrivial fluctuations of the condensate edge and particle number, yielding exact scaling forms for the edge distribution and the full counting statistics. Our results provide a tractable setting for exploring the interplay between intrinsic repulsive interactions and attractive DEC generated by a common stochastic environment in quantum many-body systems.", "url": "https://arxiv.org/abs/2609.37110", "type": "理论", "summary": "1. 该工作研究弱排斥玻色-爱因斯坦凝聚体从托马斯-费米初态自由膨胀并以恒定速率随机重置的非平衡动力学，在格罗斯-皮塔耶夫斯基框架中解析求得其唯一非平衡稳态。\n2. 其关键卖点在于同时给出稳态密度、凝聚体边缘分布与粒子数全计数统计的精确解，显示核心区保持倒抛物线、外部呈指数尾，且重置诱发非平凡边缘与粒子数涨落及标度形式。\n3. 这为探索内禀排斥相互作用与共同随机环境产生的吸引性动态涌现关联之间的共存与竞争提供了可处理平台，并启发后续量子多体实验与理论。", "summary_source": "deepseek", "authors": [{"name": "Nikhil Mesquita"}, {"name": "Manas Kulkarni"}, {"name": "Satya N. Majumdar"}, {"name": "Sanjib Sabhapandit"}], "featured_authors": [{"name": "Nikhil Mesquita"}, {"name": "Manas Kulkarni"}, {"name": "Satya N. Majumdar"}, {"name": "Sanjib Sabhapandit"}], "author_count": 4}, {"id": "2609.37129", "category": "cond-mat", "title": "Evolution of Magnetism in Ce$_4$Ge$_7$ under Magnetic Field and Pressure", "abstract": "We report the magnetic and transport properties of single-crystalline Ce$_4$Ge$_7$, which crystallizes in a non-centrosymmetric orthorhombic structure (space group C222$_1$). It undergoes an antiferromagnetic transition at $T_N$ = 7.3 K. When a magnetic field is applied along the $b$-axis, a metamagnetic transition occurs at 1.3 T (at 2 K). Correspondingly, this transition gives rise to an anomalous Hall effect, which is dominated by the intrinsic Karplus-Luttinger mechanism. Under hydrostatic pressure, $T_N$ of Ce$_4$Ge$_7$ initially increases slightly and is then gradually suppressed. For pressures above $P_c$ = 10.2 GPa, no magnetic order is observed. The divergence of the $A$ coefficient, the maximum of the residual resistivity, and the non-Fermi liquid behavior around $P_c$ indicate the possible existence of an antiferromagnetic quantum critical point in Ce$_4$Ge$_7$.", "url": "https://arxiv.org/abs/2609.37129", "type": "理论", "summary": "1. 该工作研究了非中心对称正交结构Ce4Ge7单晶在磁场和静水压下的磁性与输运演化。\n2. 主要卖点是b轴1.3 T变磁转变伴随内禀Karplus-Luttinger机制主导的反常霍尔效应。\n3. 压力下TN先微升后被抑制，Pc=10.2 GPa以上磁序消失，A系数发散及非费米液体行为暗示反铁磁量子临界点。", "summary_source": "deepseek", "authors": [{"name": "Kaixin Ye"}, {"name": "Qihe Yu"}, {"name": "Yongjian Li"}, {"name": "Yanan Zhang"}, {"name": "Ye Chen"}, {"name": "Rui Li"}, {"name": "Lin Jiao"}, {"name": "M. Smidman"}, {"name": "Yongjun Zhang"}, {"name": "Yu Liu"}, {"name": "Huiqiu Yuan"}], "featured_authors": [{"name": "Kaixin Ye"}, {"name": "Qihe Yu"}, {"name": "Yongjian Li"}, {"name": "Yongjun Zhang"}, {"name": "Yu Liu"}, {"name": "Huiqiu Yuan"}], "author_count": 11}, {"id": "2609.37142", "category": "cond-mat", "title": "Second-order coherence properties of ultrafast polariton dynamics in plasmonic lattices", "abstract": "The first-order coherence properties of strongly coupled systems supporting polariton lasing and Bose-Einstein condensation (BEC) have been thoroughly studied and show consistent results. In contrast, second-order coherence properties have been found to vary for different systems, and the second-order coherence function can deviate from the value of one, typical for atomic BEC, revealing super-Poissonian fluctuations even above the BEC/polariton lasing threshold. This calls for a deeper understanding of the emission statistics and dynamics in light-based condensates, especially in the non-equilibrium regime. Here we demonstrate a coherent state of polariton emission from a plasmonic lattice measured as the second-order coherence function value separately for $\\mathrm{\\Gamma}$- and non-$\\mathrm{\\Gamma}$-point radiation (ground state and high-energy tail). We observe a high degree of coherence with the value $g^{(2)}(\\tau=0)-1<10^{-4}$. We also demonstrate the ultrafast ($>$1 THz) nature of the dynamics. The process can be interpreted as a BEC with ultrafast, sub-50-fs thermalization, but we also suggest an alternative explanation as superradiance in a system where the emitters have vibrational degrees of freedom.", "url": "https://arxiv.org/abs/2609.37142", "type": "理论", "summary": "1. 该工作测量了等离激元晶格中极化激元发射的二阶相干性，分别对Γ点与非Γ点辐射（基态和高能尾部）提取g^(2)，并表征其超快动力学。\n2. 其核心卖点是在上述两种辐射分量分别观测到g^(2)(0)-1<10^{-4}的高相干性，且动力学速率超过1 THz，对应亚50 fs热化，为光基凝聚体在非平衡区偏离传统原子BEC统计的行为提供直接实验约束。\n3. 这提示该类体系可用超快热化的BEC图像描述，也需考虑含振动自由度的发射体超辐射机制，从而推动后续区分光基凝聚与超辐射的实验和理论判据。", "summary_source": "deepseek", "authors": [{"name": "Evgeny A. Mamonov"}, {"name": "Lukas Freter"}, {"name": "Sioneh Eyvazi"}, {"name": "Elliot W. Lloyd"}, {"name": "Päivi Törmä"}], "featured_authors": [{"name": "Evgeny A. Mamonov"}, {"name": "Lukas Freter"}, {"name": "Sioneh Eyvazi"}, {"name": "Elliot W. Lloyd"}, {"name": "Päivi Törmä"}], "author_count": 5}, {"id": "2609.37174", "category": "cond-mat", "title": "Accurate ground-state entropies from population Monte Carlo: The antiferromagnetic Ising model on the Shastry-Sutherland lattice", "abstract": "We demonstrate how the population annealing Monte Carlo simulation method can be used to compute the ground-state entropy to high precision. This approach is tested for the classical antiferromagnetic Ising model on the Shastry-Sutherland lattice with diagonal couplings chosen twice as strong as the nearest-neighbor interactions. In the absence of an external magnetic field, the model is known to be disordered at all temperatures, with a macroscopically degenerate ground state. We find the ground-state entropy to be $0.458\\,777\\,78(10)$ per site, which is in good agreement with the estimate of a recent study using the corner transfer matrix renormalization group method. The sampled ground-state configurations are analyzed by considering the bond configurations, the local-energy configurations, and the spin-spin correlations. While all observations are consistent with the disordered nature of the ground state, the numerical data suggest a power-law decay of the size distribution of clusters of sites with local energies different from the ground-state level.", "url": "https://arxiv.org/abs/2609.37174", "type": "理论+数值", "summary": "1. 该工作用种群退火蒙特卡罗模拟高精度计算了沙斯特里-萨瑟兰晶格上经典反铁磁伊辛模型的无序基态熵，其中对角耦合取为最近邻耦合的两倍。\n2. 其卖点在于对无外场、宏观简并且全温区无序的基态，采样得到每格点熵0.45877778(10)，并与角转移矩阵重整化群结果一致。\n3. 对键组态、局域能量组态和自旋关联的分析均支持基态无序，且偏离基态能级的局域能量团簇尺寸分布呈幂律衰减，这为刻画和检验此类宏观简并无序态提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Denis Gessert"}, {"name": "Wolfhard Janke"}, {"name": "Martin Weigel"}], "featured_authors": [{"name": "Denis Gessert"}, {"name": "Wolfhard Janke"}, {"name": "Martin Weigel"}], "author_count": 3}, {"id": "2609.37191", "category": "cond-mat", "title": "Uniform-Charge-Density $d$-Wave Superconductivity in the Pure $t$-$J$ Model at $1/8$ Doping on an Infinite Cylinder", "abstract": "The ground state of the square-lattice $t$-$J$ model at $1/8$ hole doping has been the subject of a long-standing controversy, with conflicting numerical reports of stripe order versus superconductivity. Here, we address this debate using the variational uniform matrix product state (VUMPS) method, which optimizes the wave function directly in the thermodynamic limit along the cylinder axis and eliminates the boundary pinning effects that can arise in finite-cylinder calculations. On an infinite cylinder of circumference $L_y = 8$, we find a uniform-charge-density $d$-wave superconducting ground state with quasi-long-range pairing correlations. The dominant pairing occurs at zero center-of-mass momentum, while no sizable finite-momentum pairing component is detected. Twisted-boundary-condition calculations reveal a finite superconducting phase stiffness, with the order-parameter phase winding smoothly to follow the applied flux, providing an independent probe of the robustness of the superconductivity. Moreover, both charge and spin correlations decay rapidly, with no signatures of long-range stripe or magnetic order, in contrast to an $L_y=6$ cylinder at $1/6$ doping where the same method readily identifies stripe order. Our results provide methodologically distinct evidence in the long-standing stripe--superconductivity debate in the pure $t$-$J$ model and reveal uniform $d$-wave superconductivity in a minimal model of doped Mott insulators.", "url": "https://arxiv.org/abs/2609.37191", "type": "理论+数值", "summary": "1. 采用变分均匀矩阵乘积态方法在无限长柱面上直接优化热力学极限波函数，以消除有限柱面计算的边界钉扎效应，研究1/8掺杂纯t-J模型。\n2. 在L_y=8柱面上得到电荷密度均匀、零质心动量的d波超导基态，具准长程配对关联与有限超流刚度，且无长程条纹或磁序。\n3. 这为纯t-J模型长期存在的条纹-超导之争提供了方法上独立的证据，并提示掺杂Mott绝缘体最小模型中可出现均匀d波超导。", "summary_source": "deepseek", "authors": [{"name": "Guangyu Yu"}, {"name": "Zheng Zhu"}], "featured_authors": [{"name": "Guangyu Yu"}, {"name": "Zheng Zhu"}], "author_count": 2}, {"id": "2609.37205", "category": "cond-mat", "title": "The Spectral Cost of Detecting Nonequilibrium at Finite Temporal Resolution", "abstract": "A detector that cannot take two snapshots closer than a time $\\tau_0$ still identifies a fully observed finite Markov generator exactly, provided its gaps are randomized by two clocks. Identification is not detection. For a normal nonequilibrium network, the number of snapshots needed to reject every hidden equilibrium explanation grows as $e^{2\\gamma_{\\mathrm{irr}}\\tau_0}$, where $\\gamma_{\\mathrm{irr}}$ is the slowest damping of rotating modes. No adaptive schedule beats this rate, and a test o
