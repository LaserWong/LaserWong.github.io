n one dependent trajectory attains it.", "url": "https://arxiv.org/abs/2609.37205", "type": "理论", "summary": "1. 该工作研究有限时间分辨率下探测非平衡的谱代价，并区分有限马尔可夫生成元的精确可辨识与真正的非平衡检测。\n2. 关键结论是：对正规非平衡网络，排除所有隐藏平衡解释所需快照数按 e^{2γ_irr τ0} 增长，且任何自适应方案都不能超越该速率。\n3. 该指数速率由旋转模最慢阻尼 γ_irr 决定，并可由单条依存轨迹检验达到，为有限时间分辨率下的非平衡实验设计提供定量基准。", "summary_source": "deepseek", "authors": [{"name": "Murad Aznagulov"}], "featured_authors": [{"name": "Murad Aznagulov"}], "author_count": 1}, {"id": "2609.37275", "category": "cond-mat", "title": "Scale invariance, fractal dynamics, and critical exponents at the phase transition", "abstract": "We propose that, at criticality, equilibrium dynamics effectively evolves on a fractal subspace rather than throughout the full Euclidean space. Starting from Fisher's formulation of the order-parameter correlation function, we interpret the anomalous critical exponent $\\eta$ geometrically through a correlation fractal dimension associated with this effective subspace. Using fractional-calculus tools, we derive a form of the correlation function that recovers critical behavior below the upper critical dimension and obtain an explicit relation between $\\eta$ and a fractal dimension $d_R$ linked to the Riesz fractional derivative. We also examine the Rushbrooke scaling relation and investigate critical behavior in non-integer-dimensional and disordered systems. In the disordered case, controlled by a parameter $\\sigma$, we test the range over which the proposed geometric interpretation remains valid. The results connect scaling laws, critical exponents, correlations, and fractal geometry, suggesting that the anomalous behavior observed at criticality can be understood as a consequence of dynamics constrained to an effective fractal subspace.", "url": "https://arxiv.org/abs/2609.37275", "type": "理论", "summary": "1. 该工作提出临界点处平衡动力学有效演化于分形子空间而非整个欧氏空间，并从Fisher序参量关联函数出发，以关联分形维度几何诠释反常临界指数η。\n2. 其核心是利用分数阶微积分导出上临界维度以下可恢复的关联函数，给出η与Riesz分数阶导数对应的分形维度d_R的显式关系，并借Rushbrooke标度关系、非整数维及σ控制的无序体系检验该几何诠释的适用范围。\n3. 该图像将标度律、临界指数、关联与分形几何相统一，暗示临界反常行为源于动力学受限于有效分形子空间，为理论与数值研究提供了可检验的几何框架。", "summary_source": "deepseek", "authors": [{"name": "Henrique Alves de Lima"}], "featured_authors": [{"name": "Henrique Alves de Lima"}], "author_count": 1}, {"id": "2609.37289", "category": "cond-mat", "title": "Anomalous transport in periodic systems driven by active fluctuations", "abstract": "This dissertation investigates the transport of Brownian particles driven by active fluctuations in periodic potential landscapes. Unlike thermal noise, active fluctuations break detailed balance and violate the fluctuation-dissipation theorem. They model self-propulsion mechanisms and active-bath interactions in biological and synthetic micro-systems. By focusing on white Poisson shot noise with non-Gaussian amplitude statistics, this work systematically uncovers the mechanisms governing three major transport anomalies: giant transport enhancement, absolute negative mobility, and the ratchet effect. Combining Monte Carlo simulations with analytical modeling, this work demonstrates that active fluctuations adhering to a bidirectional skew-normal amplitude distribution enhance directed velocity compared to the free-particle by several orders of magnitude. This giant transport enhancement is fully quantified via a phenomenological jump-relaxation model that decouples particle displacement into instantaneous stochastic jumps and deterministic relaxation towards potential minimum. Extending this model to inertial dynamics reveals that finite particle mass m acts as a dynamic control parameter capable of strengthening, weakening, constructively inducing, or completely suppressing transport enhancement depending on noise variance. Furthermore, an ultra-minimal model for absolute negative mobility is established in a one-dimensional, purely overdamped system, showing that discontinuous shot noise drives transport opposite to an applied bias without requiring particle inertia, nonlinearity of spatially periodic potential, or explicit time-dependent periodic driving. Conversely, under an alternative scaling of the average stochastic force, an asymmetric distribution of fluctuation amplitudes generates net directed transport through a tilting ratchet effect in the zero-bias limit.", "url": "https://arxiv.org/abs/2609.37289", "type": "理论+数值", "summary": "1. 该工作系统研究周期势中活性涨落驱动的布朗粒子输运，聚焦白泊松散粒噪声的非高斯幅度统计，结合蒙特卡洛与解析建模，揭示巨大输运增强、绝对负迁移率和棘轮效应三类异常。\n2. 其核心卖点是用跳跃-弛豫模型将位移分解为瞬时随机跳跃与确定性弛豫，量化双向偏正态幅度分布导致的巨大增强，并表明有限质量可随噪声方差调控输运，且在纯过阻尼一维体系中无需惯性、势非线性或周期驱动即可实现绝对负迁移率。\n3. 这为活性微纳系统中的定向输运控制提供了统一机制图像，并提示幅度分布不对称性与平均力标度可作为设计棘轮和零偏置输运的独立调控自由度。", "summary_source": "deepseek", "authors": [{"name": "Karol Białas"}], "featured_authors": [{"name": "Karol Białas"}], "author_count": 1}, {"id": "2609.37436", "category": "cond-mat", "title": "Phase separation, morphology, and metastability in the three-dimensional active Potts model", "abstract": "We study the three-dimensional active Potts model (APM) on a cubic lattice with 2, 4, and 6 orientational states. The steady-state phase diagrams exhibit low-density gaseous, high-density polar liquid, and liquid--gas coexistence phases, with the phase behavior controlled by density, temperature, and propulsion speed and retaining the main features of the previously studied two-dimensional APM. At weak propulsion, the dense phase forms a slab perpendicular to its direction of motion. With increasing propulsion speed, this morphology persists for the 2-state model, whereas the dense phases for 4 and 6 states reorient and propagate along their longitudinal direction. For the 6-state model, the reoriented dense phase further develops a cylindrical morphology. We also examine the stability of polar liquids against artificially introduced droplets using microscopic simulations and coarse-grained hydrodynamic equations. At high propulsion speeds, counter-propagating droplets can partially modify the initial polar state, while transverse droplets can completely alter it, demonstrating the metastable nature of polar liquids in the three-dimensional active Potts model.", "url": "https://arxiv.org/abs/2609.37436", "type": "理论+数值", "summary": "1. 该工作用微观模拟与粗粒化流体力学研究了立方格点上具有2、4、6个取向态的三维活性Potts模型，绘制了由密度、温度和推进速度控制的稳态相图，包含低密度气相、高密度极性液体及液-气共存。\n2. 其核心在于发现弱推进时致密相形成垂直于运动方向的板状结构，随推进加速，2态保持该形貌，而4、6态致密相转向并沿纵向传播，6态还发展出柱状形貌，并揭示极性液体对人工液滴的亚稳响应：反向液滴部分改变初态，横向液滴可完全改变。\n3. 这为三维活性物质中取向态数如何调控相分离形貌与亚稳性提供了可检验的机制图像，并启示后续实验与理论关注推进速度、液滴取向与维度效应。", "summary_source": "deepseek", "authors": [{"name": "Aditya Kumar Dutta"}, {"name": "Raja Paul"}], "featured_authors": [{"name": "Aditya Kumar Dutta"}, {"name": "Raja Paul"}], "author_count": 2}, {"id": "2609.37512", "category": "cond-mat", "title": "Exact anomalous current fluctuations in the strong-anisotropy limit of the XXZ chain", "abstract": "We study spin-current fluctuations of the folded XXZ chain, which describes the strong-anisotropy limit of the XXZ chain. We obtain an exact expression for the moment-generating function of the time-integrated spin current at infinite temperature. A long-time asymptotic analysis establishes that the rescaled time-integrated current converges to a non-Gaussian distribution described by the M-Wright function. The derivation relies on a nonlocal map to the one-dimensional t-0 model and its exact spin-charge separation. By extending this approach, we also show that the dynamical correlation function of the spins summed over two adjacent sites exhibits a diffusive Gaussian profile at long times.", "url": "https://arxiv.org/abs/2609.37512", "type": "理论", "summary": "1. 该工作在无限温度下考察折叠 XXZ 链的自旋流涨落，给出时间积分自旋流矩生成函数的精确表达式，并解析其长时渐近行为。\n2. 技术核心是通过到一维 t-0 模型的非局域映射和精确自旋-电荷分离，证明重标度积分流收敛到 M-Wright 函数刻画的长时非高斯分布，并得到相邻两格点自旋求和关联的扩散高斯剖面。\n3. 这为强各向异性自旋链的反常涨落与自旋-电荷分离提供精确基准，并提示折叠链映射可用于研究其他非高斯输运及长时扩散关联。", "summary_source": "deepseek", "authors": [{"name": "Taiki Ishiyama"}, {"name": "Taiga Kurose"}, {"name": "Kazuya Fujimoto"}, {"name": "Tomohiro Sasamoto"}], "featured_authors": [{"name": "Taiki Ishiyama"}, {"name": "Taiga Kurose"}, {"name": "Kazuya Fujimoto"}, {"name": "Tomohiro Sasamoto"}], "author_count": 4}, {"id": "2609.37547", "category": "cond-mat", "title": "Screening of Coulomb Interactions in MoS2 Nanoribbons: Enhanced Coulomb interactions, Antiscreening, and Edge Magnetism", "abstract": "MoS2 has attracted significant attention for its promising applications in optoelectronics, owing to the remarkable stability of its excitons and trions. These quasiparticles have large binding energies that arise from the MoS2 moderate band gap and the unconventional screening of Coulomb interactions in low dimensions. Here, we investigate the screening of long-range Coulomb interactions in the 1H and 1T' phases of MoS2 across different dimensionalities, with particular emphasis on nanoribbons. Our analysis is based on first-principles calculations combined with the constrained random-phase approximation. This work presents a comparative study of MoS2, h-BN, black phosphorene, and graphene nanoribbons, with emphasis on the role of Coulomb interactions in shaping their electronic and magnetic properties. In one-dimensional nanoribbons, quantum confinement leads to a substantial enhancement of Coulomb interactions relative to 2D MoS2. Calculations show that the Hubbard U increases from 2.6 eV in the 2D system to nearly 3.5 eV in the semiconducting nanoribbons. In these systems, the Coulomb interaction is long-ranged, with its tail extending over more than 100 A, nearly twice of that in the 2D structure. The presence of asymmetric edge states involving d and p orbitals in non-hydrogen-passivated zigzag MoS2 nanoribbons, in contrast to phosphorene, h-BN, and graphene nanoribbons, results in a finite net magnetization.", "url": "https://arxiv.org/abs/2609.37547", "type": "理论+数值", "summary": "1. 该工作用第一性原理与约束随机相位近似，比较 MoS2 的 1H/1T' 相及 h-BN、黑磷烯、石墨烯纳米带中长程库仑屏蔽，聚焦纳米带电子与磁性。\n2. 在一维纳米带中量子限制显著增强库仑作用：Hubbard U 从二维 2.6 eV 升至半导体纳米带近 3.5 eV，作用尾超 100 Å、近二维两倍；非氢钝化锯齿 MoS2 纳米带因 d/p 不对称边缘态出现有限净磁化。\n3. 这揭示低维屏蔽减弱/反屏蔽与边缘磁性的关联，为 MoS2 纳米带激子、三子和关联效应调控及边缘自旋电子学提供微观依据。", "summary_source": "deepseek", "authors": [{"name": "A. Montaghemi"}, {"name": "H. Hadipour"}, {"name": "A. Khademi"}, {"name": "A. Yazdani"}], "featured_authors": [{"name": "A. Montaghemi"}, {"name": "H. Hadipour"}, {"name": "A. Khademi"}, {"name": "A. Yazdani"}], "author_count": 4}, {"id": "2609.37668", "category": "cond-mat", "title": "Defect Organization in Coexisting Hexagonal and Square Lattices on Ellipsoids", "abstract": "Curvature and topology jointly organize defects in two-dimensional crystals, but their combined role remains unresolved when competing lattice symmetries coexist with spatially varying curvature. We use simulated-annealing Langevin dynamics to study Hertzian particles forming coexisting hexagonal (Hex) and square (Sq) lattices on prolate and oblate ellipsoids. Mapping reduced density and aspect ratio reveals a broad sequence of scar and domain-based morphologies in both Hex-dominant and Sq-dominant backgrounds. Latitude-resolved comparisons show that Gaussian curvature biases defects toward its maxima under weak deformation. Strong prolateness, however, confines high curvature to small polar caps that cannot independently accommodate all defect motifs. Defects then spread toward lower-curvature latitudes to relieve defect crowding and elastic repulsion. In the Hex-dominant regime, this competition drives vertex-contacted domains with neutralized corner contacts, and compensating positive defects locate away from the poles. The Sq-dominant regime features Hex-rich triangular domains, bridged states, and linear or open scars similarly reorganized by curvature anisotropy. On oblate ellipsoids, the extended equatorial high-curvature belt allows defects to separate azimuthally while remaining curvature-localized. This work elucidates that nonuniform curvature can engineer rich defect patterns by selecting the spatial distribution of topological charge and the connectivity of finite defect motifs.", "url": "https://arxiv.org/abs/2609.37668", "type": "理论+数值", "summary": "1. 该工作用模拟退火朗之万动力学研究椭球面上赫兹粒子共存六角与四方晶格的缺陷组织。\n2. 其核心机制是弱形变下高斯曲率将缺陷偏置至高曲率区，强长椭球时极冠无法容纳全部缺陷模体而迫使缺陷迁向低纬，进而选择拓扑荷分布与连通性。\n3. 这为通过椭球曲率编程拓扑荷分布与有限缺陷连通性、从而定制曲面晶体缺陷图案提供了设计原则。", "summary_source": "deepseek", "authors": [{"name": "Wenyu Liu"}, {"name": "Han Xie"}, {"name": "Baohui Li"}, {"name": "Jeff Z.Y. Chen"}, {"name": "Yao Li"}], "featured_authors": [{"name": "Wenyu Liu"}, {"name": "Han Xie"}, {"name": "Baohui Li"}, {"name": "Jeff Z.Y. Chen"}, {"name": "Yao Li"}], "author_count": 5}, {"id": "2609.37689", "category": "cond-mat", "title": "Switching Anomalous Hall and Nernst Responses by Nonmagnetic N Occupation at Fixed Noncoplanar Mn Antiferromagnetic Order", "abstract": "Nonmagnetic atomic occupation can control anomalous transverse transport by modifying magnetic symmetry without changing the underlying magnetic order. We demonstrate this effect using controlled $\\gamma$-Mn, Mn$_4$N, and MnN reference states with the same lattice constant and identical noncoplanar all-in-all-out Mn magnetic configurations, while varying only the occupation of the N sublattice. The anomalous Hall and anomalous Nernst responses exhibit a pronounced zero--finite--zero evolution across the series despite the unchanged Mn spin order. In $\\gamma$-Mn and MnN, the high magnetic symmetry enforces complete cancellation of the Brillouin-zone-integrated Berry curvature. In Mn$_4$N, N occupation lowers the magnetic symmetry while preserving inversion and breaking the relevant twofold rotational symmetries, thereby lifting the cancellation constraint and permitting an uncompensated Berry-curvature contribution along the [111] direction. The resulting finite anomalous Hall conductivity reaches $-126$~S/cm near the Fermi level. These results establish nonmagnetic sublattice occupation as a symmetry-control parameter for Berry-curvature-driven transport in compensated antiferromagnets, independent of changes in the magnetic order.", "url": "https://arxiv.org/abs/2609.37689", "type": "理论", "summary": "1. 该工作在固定非共面全进全出Mn反铁磁序下，仅改变N子晶格占据，比较γ-Mn、Mn4N与MnN的反常霍尔和能斯特响应。\n2. 其卖点是N占据不改Mn磁序却降低磁对称性、保持反演并破缺二重旋转，解除贝里曲率积分抵消，反常霍尔电导近费米面达−126 S/cm。\n3. 这确立非磁性子晶格占据为补偿反铁磁体中调控贝里曲率驱动输运的对称性参量，且无须改变磁序。", "summary_source": "deepseek", "authors": [{"name": "Xin Liu"}, {"name": "Jiyuan Xu"}, {"name": "Li Ma"}, {"name": "Guoke Li"}, {"name": "Dewei Zhao"}, {"name": "Congmian Zhen"}, {"name": "Denglu Hou"}], "featured_authors": [{"name": "Xin Liu"}, {"name": "Jiyuan Xu"}, {"name": "Li Ma"}, {"name": "Dewei Zhao"}, {"name": "Congmian Zhen"}, {"name": "Denglu Hou"}], "author_count": 7}, {"id": "2609.37767", "category": "cond-mat", "title": "Multistate Torsion in Zitterbewegung", "abstract": "We derive nonlinear Zitterbewegung velocity of electrons augmented by band torsion in crystals. The equation of motion with multistate quantum geometric tensors and torsion culminates in transient nonlinear photocurrent responses distinct from the recently measured resonant steady-state photovoltaic effects induced by circularly polarized light. Tomography protocols for measuring the multistate quantum geometric torsion tensors are proposed.", "url": "https://arxiv.org/abs/2609.37767", "type": "理论", "summary": "1. 该工作推导了晶体中能带挠率增强的电子非线性Zitterbewegung速度，并建立含多态量子几何张量与挠率的运动方程。\n2. 其卖点在于多态量子几何挠率产生瞬态非线性光电流，区别于圆偏振光诱导的共振稳态光伏效应。\n3. 文章提出多态量子几何挠率张量的层析测量方案，为实验探测该几何效应及其与已知光伏响应的分离提供启示。", "summary_source": "deepseek", "authors": [{"name": "Wojciech J. Jankowski"}], "featured_authors": [{"name": "Wojciech J. Jankowski"}], "author_count": 1}, {"id": "2609.37812", "category": "cond-mat", "title": "Correlation-assisted topological and metamagnetic transitions in Rashba-coupled superconductors: $t$-$J$-$U$ model study", "abstract": "Unconventional superconductivity commonly emerges in systems characterized by strong electronic correlations, with layered copper-oxides serving as a canonical example. Observation of spin-momentum locking within Bi-family of the cuprates, compatible with the presence of non-negligible Rashba-type spin-orbit coupling (RSOC), calls for an investigation of the joint effects of electronic correlations and RSOC on pairing in copper-oxide and related superconductors. Employing statistically-consistent variational approximation (SGA), we carry out such an analysis by constructing the phase diagram for the case of square-lattice \\textit{t-J-U} model incorporating RSOC. We also investigate the effects of time-reversal-symmetry breaking by Zeeman field, as well as characterize emergent topological superconducting (TSC) states. Chern number $C = \\pm 4$ TSC is found in a broad regime of on-site Coulomb repulsion close to half-filling. The latter is not governed by correlations and emerges also within the weak-coupling Bogoliubov-de Gennes (BdG) scheme. Yet, we identify a distinct $C = \\pm 2$ TSC state that is driven specifically by electronic correlations via a topological transition occurring with no bulk quasiparticle gap closure, and is accompanied by discontinuous metamagnetic and Lifshitz transitions. Moreover, a qualitatively distinct doping evolution of the $d$- and $p$-wave components of the underlying mixed-parity SC order parameter above the metal-to-insulator transition is demonstrated. Our work points toward the relevance of joint correlation and RSOC effects beyond BdG scheme to phase diagrams of RSOC-coupled superconductors.", "url": "https://arxiv.org/abs/2609.37812", "type": "理论+数值", "summary": "1. 该工作用统计一致变分近似构建含Rashba自旋轨道耦合的方格t-J-U模型相图，并表征Zeeman场下的拓扑超导态。\n2. 其卖点是发现关联驱动的C=±2拓扑超导态，其拓扑转变无体能隙闭合，并伴随非连续变磁与Lifshitz转变。\n3. 这指明超越BdG方案联合处理电子关联与Rashba耦合，对相关超导相图和混合宇称配对演化具有启示。", "summary_source": "deepseek", "authors": [{"name": "Tushar Dey"}, {"name": "Maciej Fidrysiak"}, {"name": "Józef Spałek"}], "featured_authors": [{"name": "Tushar Dey"}, {"name": "Maciej Fidrysiak"}, {"name": "Józef Spałek"}], "author_count": 3}, {"id": "2609.37814", "category": "cond-mat", "title": "Hierarchical Fourier Phase Projection for Local Electronic Observables", "abstract": "Large-scale electronic-structure calculations require efficient access to local observables without explicitly constructing all occupied orbitals. We develop hierarchical Fourier phase projection (HPP), which organizes Fourier probes into a reusable spatial hierarchy that progressively removes short-range aliasing while exploiting density-matrix locality. The method provides systematic refinement from low-cost local estimates to the projection-exact limit of the chosen numerical occupation operator, without discarding previously evaluated responses. Tests using frozen Kohn--Sham Hamiltonians for semiconducting and metallic systems demonstrate controllable convergence of electron densities and nonlocal pseudopotential forces, weak size dependence of the probing resolution required for a fixed local accuracy, and near-linear growth of the direct computational cost at fixed probing workload. Inter-level changes further provide practical information for terminating the refinement at finite accuracy. HPP connects electronic locality, observable accuracy, and computational effort within a single hierarchical framework, providing a scalable route to local quantities in large-scale electronic-structure calculations.", "url": "https://arxiv.org/abs/2609.37814", "type": "理论+数值", "summary": "1. 该工作提出分层傅里叶相位投影（HPP），以可复用的空间层级组织傅里叶探针并逐步消除短程混叠，从而高效获取局域电子可观测量。\n2. 其核心卖点是在不丢弃已求响应且不显式构造全部占据轨道的前提下，利用密度矩阵局域性实现对选定占据算符投影精确极限的系统性细化。\n3. 对半导体与金属的冻结Kohn-Sham测试表明，密度与非局域赝势力可控收敛，固定精度所需探测分辨率尺寸依赖弱，为大规模电子结构计算提供了可扩展路径。", "summary_source": "deepseek", "authors": [{"name": "Tao Hu"}, {"name": "Weiqing Zhou"}, {"name": "Zhichang Fu"}, {"name": "Yechen Chen"}, {"name": "Shengjun Yuan"}], "featured_authors": [{"name": "Tao Hu"}, {"name": "Weiqing Zhou"}, {"name": "Zhichang Fu"}, {"name": "Yechen Chen"}, {"name": "Shengjun Yuan"}], "author_count": 5}, {"id": "2609.37927", "category": "cond-mat", "title": "Irreducible Weyl Semimetals", "abstract": "A key objective in Weyl-semimetal (WSM) research is to identify phases built from minimal configurations of Weyl points (WPs), which provide the simplest settings for investigating the intrinsic physics of chiral topological charges. Pang et al. [Phys. Rev. Res. 8, 033304 (2026)] recently established that crystallographically realizable WSMs can be decomposed into linear combinations of 16 minimal \"irreducible Weyl molecules\" (IWMs). A fundamental question remains unresolved: which of these non-decomposable configurations can themselves form standalone crystalline phases? Here we introduce irreducible Weyl semimetals (IWSMs), in which two bands crossing near the Fermi level form an elementary symmetry-compatible complex whose complete Weyl-node configuration is charge neutral and crystallographically indivisible. Combining all 1651 magnetic space groups with Weyl-orbit multiplicities and band-compatibility relations, we classify IWSMs formed by crystalline-symmetry-protected twofold WPs. Only ten of the sixteen primitive inventories admit one-copy realizations, comprising four Pair, four Split, and two Mixed charge-node architectures. Remarkably, this classification uncovers five unconventional and previously unrecognized topological phases: the charge-three Pair IWSM {3, -3}; the Split IWSMs {3, -1, -1, -1}, and {4, -1, -1, -1, -1}; and the Mixed IWSMs {3, 1, -2, -2} and {3, 3, -2, -2, -2}. For all ten classes, symmetry-constrained lattice models verify the complete node inventories, Chern charges, and surface chiral-flow incidence. Our results establish crystalline irreducibility as a phase-level organizing principle beyond individual Weyl nodes and provide a symmetry-resolved framework for identifying minimal Weyl complexes in electronic, phononic, and photonic systems.", "url": "https://arxiv.org/abs/2609.37927", "type": "理论+数值", "summary": "1. 该工作提出不可约外尔半金属概念，结合1651个磁空间群、外尔轨道多重度与能带兼容关系，对对称性保护的二重外尔点构成的完整节点构型进行分类，发现16种本原构型中仅10种可在晶体中单拷贝实现。\n2. 其卖点在于以晶体不可约性而非单个外尔节点作为相层级组织原则，并识别出五种非常规拓扑相，包括电荷数为三的Pair {3,-3}、Split {3,-1,-1,-1}与{4,-1,-1,-1,-1}、Mixed {3,1,-2,-2}与{3,3,-2,-2,-2}，且用对称约束晶格模型验证节点清单、陈数和表面手性流。\n3. 这为在电子、声子与光子体系中识别最小外尔复合体提供了对称性分辨框架，并启发以晶体不可约性搜寻新型拓扑相。", "summary_source": "deepseek", "authors": [{"name": "Ke-Xin Pang"}, {"name": "Yan Gao"}], "featured_authors": [{"name": "Ke-Xin Pang"}, {"name": "Yan Gao"}], "author_count": 2}, {"id": "2609.38003", "category": "cond-mat", "title": "Reversible field-free superconducting diode effect controlled by an antiferromagnet", "abstract": "The semiconductor diode, which allows current to flow preferentially in one direction, is a fundamental building block of numerous modern electronic circuits. Its superconducting analogue---the superconducting diode effect---enables directional dissipationless current flow and may provide similar functionality in future superconducting quantum circuits. Realization of such a nonreciprocal supercurrent requires broken time-reversal symmetry. At zero applied field, this has been typically associated either with intrinsic unconventional superconductivity or extrinsic spin-split electronic states induced by magnetic proximity. Here we demonstrate a field-free superconducting diode effect in conventional superconducting Al proximitized by collinear antiferromagnetic CuMnAs, whose electronic structure breaks time-reversal symmetry without generating spin splitting. By tuning the proximity effect through an insulating AlAs interlayer and correlating the reversal of the diode polarity with the reversal of the remanent Néel state, we establish that the antiferromagnet controls the superconducting diode effect. Our results show that neither spin-split bands nor net magnetization is required for a magnetically controlled field-free superconducting diode effect, extending superconducting nonreciprocity to a broader class of collinear compensated magnets.", "url": "https://arxiv.org/abs/2609.38003", "type": "理论", "summary": "1. 该工作在Al/CuMnAs邻近体系中实现了由共线反铁磁控制的零场超导二极管效应，并用AlAs绝缘层调控邻近效应。\n2. 其物理卖点是共线补偿反铁磁的电子结构可打破时间反演对称性而无自旋劈裂或净磁化，二极管极性随剩余奈尔态翻转。\n3. 这表明磁控零场超导二极管效应不依赖自旋劈裂能带或净磁化，可将超导非互易性拓展到更广泛的共线补偿磁体。", "summary_source": "deepseek", "authors": [{"name": "Filip Krizek"}, {"name": "Kamil Olejník"}, {"name": "Tobias Edwinson"}, {"name": "August Jacobi"}, {"name": "Athira Suresh"}, {"name": "Andrej Farkaš"}, {"name": "Jan Kraus"}, {"name": "Vít Novák"}, {"name": "Christoph Müller"}, {"name": "Vojtěch Pařízek"}, {"name": "Niclas Heinsdorf"}, {"name": "Peter Wadley"}, {"name": "Oliver Amin"}, {"name": "Kevin Edmonds"}, {"name": "Tomas Jungwirth"}, {"name": "Libor Šmejkal"}, {"name": "Anna Birk Hellenes"}, {"name": "Sumit Ghosh"}, {"name": "Michal Mazur"}, {"name": "Dominik Kriegner"}, {"name": "Lucas Casparis"}, {"name": "Saulius Vaitiekėnas"}], "featured_authors": [{"name": "Filip Krizek"}, {"name": "Kamil Olejník"}, {"name": "Tobias Edwinson"}, {"name": "Dominik Kriegner"}, {"name": "Lucas Casparis"}, {"name": "Saulius Vaitiekėnas"}], "author_count": 22}, {"id": "2609.38015", "category": "cond-mat", "title": "Variational Monte Carlo for the Hubbard model", "abstract": "In these lecture notes, we introduce the variational Monte Carlo method for the Hubbard model. First, we briefly introduce the single-orbital Hubbard model and its multi-orbital extension, focusing only on electronic models. Then, we introduce the general scheme under which variational Monte Carlo works and we present the variational wave functions that can properly describe superconductive and magnetic states in single-orbital and multi-orbital Hubbard models. We also detail how to perform Monte Carlo calculations for the given wave functions. We also describe how to optimize a variational wave function with the stochastic reconfiguration method. Finally, we present a few results for correlation functions that can be computed in variational Monte Carlo, to determine, for instance, the presence of charge or spin order and superconductivity.", "url": "https://arxiv.org/abs/2609.38015", "type": "理论+数值", "summary": "1. 该讲义系统介绍了Hubbard模型的变分蒙特卡洛方法，涵盖单轨道与多轨道电子模型。\n2. 其核心在于给出可描述超导和磁性态的变分波函数，并详述蒙特卡洛计算及随机重构优化流程。\n3. 据此可计算关联函数以判别电荷序、自旋序与超导，为Hubbard模型数值研究提供操作指南。", "summary_source": "deepseek", "authors": [{"name": "Luca F. Tocchio"}], "featured_authors": [{"name": "Luca F. Tocchio"}], "author_count": 1}, {"id": "2609.38088", "category": "cond-mat", "title": "Boundary Criticality in (2+1)-dimensional U(1) Dirac Quantum Spin Liquid", "abstract": "An emergent gauge field can control boundary critical behavior without changing the bulk quantum spin liquid. We investigate the boundary criticality in $(2+1)$-dimensional $U(1)$ Dirac spin liquid, whose low-energy physics is described by massless quantum electrodynamics. Using a perturbative renormalization-group analysis in a half-space, we show that Neumann and Dirichlet boundary conditions for the emergent gauge field lead to distinct boundary universality classes. We determine the boundary scaling dimensions of the fundamental fields and gauge-invariant operators that provide observable signatures. We further propose a fermion-gauge lattice model with tunable boundary interactions as a microscopic setting for realizing and probing these boundary universality classes.", "url": "https://arxiv.org/abs/2609.38088", "type": "理论", "summary": "1. 该工作在半空间中用微扰重整化群研究(2+1)维U(1)狄拉克量子自旋液体的边界临界性，其低能物理由无质量量子电动力学描述。\n2. 核心卖点是演生规范场的Neumann与Dirichlet边界条件导致不同的边界普适类，且不改变体态量子自旋液体，并给出基本场与规范不变算符的边界标度维数作为可观测特征。\n3. 作者进一步提出具有可调边界相互作用的费米子—规范场晶格模型，为在微观层面实现和探测这些边界普适类提供了可行平台。", "summary_source": "deepseek", "authors": [{"name": "Huan Jiang"}, {"name": "Zhiming Pan"}, {"name": "Xue-Jia Yu"}, {"name": "Shao-Kai Jian"}], "featured_authors": [{"name": "Huan Jiang"}, {"name": "Zhiming Pan"}, {"name": "Xue-Jia Yu"}, {"name": "Shao-Kai Jian"}], "author_count": 4}, {"id": "2609.38125", "category": "cond-mat", "title": "How Thermodynamically Accessible are Quaternary Mixed-Metal Chalcohalides?", "abstract": "Quaternary mixed-metal chalcohalides (MMCHs) are a promising mixed-anion semiconductor family, but their thermodynamic accessibility remains largely unexplored. We combine density functional theory with the Alexandria Materials Database to carry out a rapid and reliable evaluation of the thermodynamic accessibility of 54 M(II)$_2$M(III)Ch$_2$X$_3$ compounds. All evaluated MMCHs are predicted to be thermodynamically unstable, but a considerable fraction of MMCHs lie within computational uncertainty of the convex hull. Their predicted decomposition follows five distinct reaction pathways, most commonly into M(III)$_2$Ch$_3$, M(II)X$_2$, and M(II)Ch. Solution processing of six Sn-based MMCHs supports our analysis. Notably, this includes the first synthesis of the previously unreported Sn$_2$InS$_2$Br$_3$ in a multiphase film. Our approach identifies convex hull proximity and competing phase formation as key constraints on MMCH synthetic accessibility during solution processing, thereby guiding future MMCH exploration.", "url": "https://arxiv.org/abs/2609.38125", "type": "理论+数值", "summary": "1. 该工作结合DFT与Alexandria数据库，快速评估54种M(II)2M(III)Ch2X3四元混合金属硫卤化物的热力学可及性。\n2. 预测所有MMCH均热力学不稳定，但相当部分处于凸包计算误差内，分解遵循五类路径，最常见生成M(III)2Ch3、M(II)X2和M(II)Ch。\n3. 六种Sn基MMCH溶液加工支持该分析，首次合成Sn2InS2Br3，表明凸包邻近度与竞争相形成是关键合成约束。", "summary_source": "deepseek", "authors": [{"name": "Pascal Henkel"}, {"name": "G. Krishnamurthy Grandhi"}, {"name": "Jarno Laakso"}, {"name": "David Rovira Ferrer"}, {"name": "Edgardo Saucedo"}, {"name": "Jingrui Li"}, {"name": "Paola Vivo"}, {"name": "Miguel A. L. Marques"}, {"name": "Patrick Rinke"}], "featured_authors": [{"name": "Pascal Henkel"}, {"name": "G. Krishnamurthy Grandhi"}, {"name": "Jarno Laakso"}, {"name": "Paola Vivo"}, {"name": "Miguel A. L. Marques"}, {"name": "Patrick Rinke"}], "author_count": 9}, {"id": "2609.38148", "category": "cond-mat", "title": "Anisotropic interface-confined superconductivity in FeTe-based heterostructures", "abstract": "Interface-confined superconductivity emerges from the interaction of electronic states across chemically distinct boundaries, providing a route to engineer superconducting phases where magnetism and topology coexist. Determining the intrinsic nature of such superconductivity, however, is challenging because the superconducting layer is only a few nanometers thick and buried beneath several normal layers. Here, we measure the whole-sample Meissner response of six $\\mathrm{FeTe}$-based heterostructures in a uniform magnetic field using a frequency-domain tunnel-diode resonator. In the ultrathin limit, the conventional normalization of the measured susceptibility, $\\chi(T\\to0)=-1$, fails by tens of percent. We establish the appropriate calibration and invert $\\chi(T)$ to determine the London penetration depth $\\lambda(T)$. Two key results emerge. First, the broad transitions observed in $\\chi(T)$ arise naturally from the extreme geometry and large $\\lambda$, without requiring chemical or structural inhomogeneity; the extracted $\\lambda(T)$ closely tracks the resistive transition. Second, $\\lambda(T)$ and the corresponding superfluid density are inconsistent with a fully gapped isotropic $s$-wave state and instead indicate a strongly anisotropic order parameter possibly with line nodes or deep gap minima. The inferred $\\lambda(0)$ is of order $1\\,\\mu$m, consistent with an independent analysis of the 2D phase stiffness. Despite the distinct chemical, magnetic, and topological character of the three overlayers, all six FeTe heterostructures exhibit similar low-temperature power-law behavior, with no systematic dependence of the superconducting response on overlayer identity. These results point to the interfacial $\\mathrm{FeTe}$ layer as the common origin of superconductivity.", "url": "https://arxiv.org/abs/2609.38148", "type": "理论", "summary": "1. 该工作用频率域隧道二极管谐振器在均匀磁场中测量六种FeTe基异质结的整样品迈斯纳响应，建立超薄极限下适用的校准并反演伦敦穿透深度λ(T)，以确定界面受限超导的本征性质。\n2. 其卖点在于指出超薄极限下χ(0)=-1的常规归一化偏差可达数十个百分点，宽转变可由极端几何与大λ自然解释；λ(T)与超流密度偏离全能隙各向同性s波，支持强各向异性、可能含线节点或深能隙极小。\n3. 六种覆盖层化学、磁性与拓扑性质不同却呈现相似低温幂律且无系统依赖，表明界面FeTe层是超导共同起源，为在磁性与拓扑共存体系中工程化界面超导提供启发。", "summary_source": "deepseek", "authors": [{"name": "Bicky Singh Moirangthem"}, {"name": "Kamal R. Joshi"}, {"name": "Zi-Jie Yan"}, {"name": "Pu Xiao"}, {"name": "Lok-Kan Lai"}, {"name": "Cui-Zu Chang"}, {"name": "Ruslan Prozorov"}], "featured_authors": [{"name": "Bicky Singh Moirangthem"}, {"name": "Kamal R. Joshi"}, {"name": "Zi-Jie Yan"}, {"name": "Lok-Kan Lai"}, {"name": "Cui-Zu Chang"}, {"name": "Ruslan Prozorov"}], "author_count": 7}, {"id": "2609.35958", "category": "hep-th", "title": "Solver Agent: an Agentic AI Framework for Theoretical Physics Computations Applied to F-theory Uplifts of O3-planes and S-folds", "abstract": "We introduce Solver Agent, an AI framework based on large language models for calculations and proofs in mathematics and theoretical physics. The solution process is tracked through a persistent ledger that records assumptions, derivations, and computations. A central agent delegates tasks to specialized sub-agents, while independent agents verify both intermediate steps and the final result. This setup improves the traceability, reproducibility, and verification of computer-assisted calculations. Applying Solver Agent, we study global F-theory uplifts of Type IIB orientifolds and their S-fold generalizations. We establish sufficient conditions for Weierstrass models over projective threefolds with terminal $\\mathbb{Z}_k$ quotient singularities ($k\\in\\{2,3,4,6\\}$) to give $\\mathbb{Q}$-factorial projective elliptically fibered Calabi-Yau fourfolds with isolated Gorenstein terminal quotient singularities. These geometries realize O3-planes and S-folds, where local D3-brane probes of the latter yield four-dimensional $\\mathcal{N}=3$ superconformal field theories. Using stringy invariants, we derive fixed-point contributions to Hodge data and Euler characteristics, and show that these Euler corrections determine the localized D3-brane charges required for tadpole cancellation. We illustrate these results using toric hypersurface constructions, where a single three-dimensional polytope determines both the Type IIB Calabi-Yau threefold and the F-theory base; here, the orientifold double cover naturally forms a bisection of an alternative genus-one-fibered uplift with discrete $\\mathbb{Z}_2$ gauge symmetry. Finally, we provide methods for toric computations and four-form flux analysis in four-dimensional $\\mathcal{N}=1$ compactifications with non-abelian gauge sectors.", "url": "https://arxiv.org/abs/2609.35958", "type": "理论", "summary": "1. 我们介绍 Solver Agent，这是一个基于大型语言模型的人工智能框架，用于数学和理论物理的计算和证明。\n2. 使用弦不变量，我们得出了对 Hodge 数据和欧拉特征的定点贡献，并表明这些欧拉修正决定了蝌蚪消除所需的局部 D3 膜电荷。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Eliott Morgensztern"}, {"name": "Cesar Fierro Cota"}, {"name": "Alessandro Mininno"}], "featured_authors": [{"name": "Eliott Morgensztern"}, {"name": "Cesar Fierro Cota"}, {"name": "Alessandro Mininno"}], "author_count": 3}, {"id": "2609.35961", "category": "hep-th", "title": "Allowable complex saddles with real charges in the gravitational index", "abstract": "We present a new supersymmetric, non-extremal complexification of asymptotically $\\mathrm{AdS}$ black holes, characterized by real charges and multiple complex horizons. We investigate whether these solutions define admissible supersymmetric saddles of the gravitational path integral by applying the Kontsevich-Segal-Witten (KSW) criterion, and compare the resulting gravitational constraints with the convergence conditions of the dual superconformal index. For most of the cases studied, the KSW criterion in the asymptotic region agrees with the index convergence, while the full bulk condition is more stringent and excludes saddles whose chemical potentials lie within the index-convergence domain.", "url": "https://arxiv.org/abs/2609.35961", "type": "理论", "summary": "1. 该工作构造了一类新的渐近AdS黑洞超对称非极值复化解，具有实电荷和多个复视界，并检验其能否成为引力路径积分的可容许超对称鞍点。\n2. 其关键在于应用Kontsevich-Segal-Witten（KSW）判据，将引力约束与对偶超共形指数的收敛条件比较，发现多数情形下渐近区KSW条件与指数收敛一致，但完整体条件更严格，会排除化学势落在指数收敛域内的鞍点。\n3. 这表明仅凭渐近区KSW判据不足以判定鞍点可容许性，完整体约束对引力指数及对偶谱问题具有关键筛选作用。", "summary_source": "deepseek", "authors": [{"name": "Fabio Billiato"}, {"name": "Gianmarco Esposto"}], "featured_authors": [{"name": "Fabio Billiato"}, {"name": "Gianmarco Esposto"}], "author_count": 2}, {"id": "2609.35963", "category": "hep-th", "title": "Type IIB supergravity solutions for polarized IKKT", "abstract": "The general local solutions to complexified Type IIB supergravity which are invariant under the complex Lie superalgebra $F(4)$, and which were derived and classified in arXiv:2508.14959 , are supplemented here by the construction of their flux potentials and field strengths. We then focus on the Type IIB$^\\star$ real form of complex Type IIB supergravity, where we obtain solutions with spacetime metric of the warped product form $dS_{1,5}\\times S^2\\times\\Sigma$. We systematically derive boundary and regularity conditions under which the $dS_{1,5}\\times S^2\\times\\Sigma$ solutions can be analytically continued to regular $S^6\\times S^2\\times\\Sigma$ solutions in Euclidean Type IIB supergravity. Using these results, we construct explicit global solutions. These solutions include explicit realizations of recent proposals for a holographic description of the polarized IKKT model, and we clarify the charges carried by these solutions. We also obtain novel solutions in the same regularity class with different brane charges.", "url": "https://arxiv.org/abs/2609.35963", "type": "理论", "summary": "1. 该工作在复化 IIB 型超引力中补全了 F(4) 不变局域解的通量势与场强，并在 Type IIB* 实形式下得到度规为 dS_{1,5}×S^2×Σ 的翘曲乘积解。\n2. 其关键在于系统推导边界与正则性条件，使这些解可解析延拓为欧氏 IIB 中的正则 S^6×S^2×Σ 解，并据此构造显式整体解，具体实现极化 IKKT 模型的全息描述并澄清其电荷。\n3. 这为极化 IKKT 模型的全息描述提供了显式超引力背景，并表明同一正则类中还存在不同膜电荷的新解，后者可进一步分类以厘清其物理意义。", "summary_source": "deepseek", "authors": [{"name": "Eric D'Hoker"}, {"name": "Michael Gutperle"}, {"name": "Christoph F. Uhlemann"}], "featured_authors": [{"name": "Eric D'Hoker"}, {"name": "Michael Gutperle"}, {"name": "Christoph F. Uhlemann"}], "author_count": 3}, {"id": "2609.35976", "category": "hep-th", "title": "Helicity-Resolved Constructibility from Unified Ward Identities", "abstract": "We show that the large-$z$ behavior of massive higher-spin particles under all-line transverse shifts is controlled by the helicity magnitude rather than the total spin. The apparent additional $z$ growth of nonextremal higher-spin wavefunctions is removed by unified Ward identities acting independently on each vector index. To expose this structure, we embed a four-dimensional massive momentum and its mass into an auxiliary null five-vector, whose fifth-current components characterize the breaking and restoration of the massless Ward identities. These identities determine the fixed-helicity large-$z$ scaling and yield a helicity-resolved constructibility criterion valid for arbitrary spin. Provided the stripped kinematic tensor remains finite in the massless limit, increasing the total spin does not by itself worsen constructibility, and amplitudes with nonnegative coupling dimension are constructible for all helicity configurations at five points and beyond.", "url": "https://arxiv.org/abs/2609.35976", "type": "理论", "summary": "1. 该工作研究大质量高自旋粒子在全线横向平移下的大z行为，并将其质量嵌入辅助零五矢量以统一处理Ward恒等式。\n2. 关键在于证明大z标度由螺旋度大小而非总自旋控制，且逐矢量指标作用的统一Ward恒等式可消除非极端高自旋波函数的额外z增长。\n3. 由此得到对任意自旋成立的螺旋度分辨可构造性判据：若剥离后的运动学张量在无质量极限有限，则增大总自旋本身不恶化可构造性，非负耦合量纲振幅在五点及以上对所有螺旋度组态均可构造。", "summary_source": "deepseek", "authors": [{"name": "Jaehoon Jeong"}], "featured_authors": [{"name": "Jaehoon Jeong"}], "author_count": 1}, {"id": "2609.35985", "category": "hep-th", "title": "Control Problem of de Sitter Vacua with T-brane Uplift", "abstract": "T-branes have been argued to provide a consistent uplift to de Sitter vacua in the context of the LARGE-volume scenario of type IIB string theory. We point out that this construction suffers from a serious control problem: the string-frame volume is bounded from above by a number that depends only on the topology of the Calabi-Yau orientifold and is often $\\mathcal{O}(1)$ or smaller. This observation immediately rules out controlled de Sitter vacua in many models with $h^{1,1}=2$ if the non-perturbative superpotential is generated by D3-brane instantons. We give evidence that similar conclusions apply for $h^{1,1}>2$ and show this explicitly for two models with $h^{1,1}=4$. Our volume bound is seemingly less severe in models where the non-perturbative superpotential is generated by gaugino condensation. However, we study $\\mathcal{O}(600)$ such models and find that, although de Sitter solutions with large volumes are naively possible there, they suffer from uncontrolled warping corrections whose volume suppression is cancelled by other factors, in particular large charges. We also observe that the models with the smallest warping corrections within our set have very small tadpoles and at the same time require a fine-tuned string coupling and flux superpotential, which may indicate an additional problem with the axio-dilaton/complex-structure-moduli stabilization. Finally, we point out an independent challenge related to the stabilization of the brane moduli. Our various results lead us to conclude that it is unlikely that the scenario of T-brane uplifting can be realized in string theory in a self-consistent manner.", "url": "https://arxiv.org/abs/2609.35985", "type": "理论", "summary": "1. 该工作指出LARGE-volume scenario中T-brane uplift存在严重的控制问题：弦框架体积受拓扑上界限制。\n2. 该上界常为O(1)或更小，直接排除h^{1,1}=2中D3-brane instanton型受控dS真空，并在h^{1,1}=4模型中得到显式验证。\n3. 约600个gaugino condensation模型中大体积dS解虽表观存在，却受大电荷抵消体积压低的不受控warping修正，加之brane moduli稳定化等困难，该uplift恐难自洽实现。", "summary_source": "deepseek", "authors": [{"name": "Daniel Junghans"}], "featured_authors": [{"name": "Daniel Junghans"}], "author_count": 1}, {"id": "2609.35997", "category": "hep-th", "title": "D-branes and orientifolds on quasicrystalline orbifold backgrounds", "abstract": "We construct and analyse orientifold descendants of a six-dimensional type IIB $\\mathbb Z_{12}$ quasicrystalline orbifold. The parent background is defined by a Narain-lattice automorphism that is not crystallographic on the geometric torus. We determine the closed-string spectrum and twisted-sector orbit structure, construct a compatible unoriented projection, and compute the Klein bottle, annulus and Möbius strip amplitudes. Tadpole cancellation selects boundary orbits that admit a partially T-dual description as D7-branes at angles and fixes the Chan-Paton gauge group and massless spectrum. The resulting supersymmetric six-dimensional vacuum satisfies the irreducible anomaly constraints, its reducible anomaly polynomial factorizes through the Green-Schwarz mechanism, and its anomaly lattice obeys the Kim-Shiu-Vafa string-probe bound. We also construct a Brane Supersymmetry Breaking descendant with a perturbatively tachyon-free rigid branch, and a freely acting five-dimensional orientifold whose two decompactification limits reproduce a geometric type IIA $\\mathbb Z_3$ orientifold and an antisymmetric type IIB $\\mathbb Z_4$ orientifold. These examples show that quasicrystalline closed-string backgrounds can admit controlled perturbative open-string completions with non-trivial boundary and crosscap sectors.", "url": "https://arxiv.org/abs/2609.35997", "type": "理论", "summary": "1. 该工作构造并分析了六维IIB型Z12准晶orbifold的orientifold后代，其母背景由几何环面上非晶体化的Narain格自同构定义。\n2. 通过确定闭弦谱与扭曲扇区轨道结构、构造相容无向投影并计算Klein瓶、环带和Möbius带振幅，tadpole抵消筛选出可部分T对偶为成角D7膜的边界轨道，并固定Chan-Paton规范群与无质量谱。\n3. 所得六维超对称真空满足不可约反常约束，可约反常多项式经Green-Schwarz机制分解且反常格遵守Kim-Shiu-Vafa弦探针界；还构造微扰无快子的BSB刚性支及两个退紧化极限分别回归IIA Z3和反对称IIB Z4 orientifold的5D自由作用orientifold，表明准晶闭弦背景可具有受控微扰开弦完备。", "summary_source": "deepseek", "authors": [{"name": "Antony Wendels"}], "featured_authors": [{"name": "Antony Wendels"}], "author_count": 1}, {"id": "2609.36015", "category": "hep-th", "title": "Signatures of Bulk Topology from the 't Hooft Worldsheet", "abstract": "We study entanglement entropy in a certain ansatz of matrix quantum mechanics (MQM) wavefunctions which behave as generating functionals for a planar 't Hooft expansion. We argue that these 't Hooft diagrammatics can directly probe aspects of the topology of the bulk dual, such as the contractibility of a thermal or replica $S^1$ cycle. Our argument relies on treating 't Hooft diagrams as a non-perturbative definition of off-shell string theory worldsheets in which contractibility of replica cycle leads to worldsheets punctured by a conical deficit (as first described by Susskind and Uglum). We describe how a deconfinement transition in the MQM is tied to the exchange of dominant topologies, as well as to a candidate description of open string 'edge modes' of Susskind and Uglum. Lastly, we study toy models of black hole evaporation and show that the boundary planar expansion itself diagnoses the exchange of dominance between the disconnected topology and replica wormhole topology, without ensemble averaging and without independently postulating which bulk saddles should be included.", "url": "https://arxiv.org/abs/2609.36015", "type": "理论", "summary": "1. 该工作利用矩阵量子力学波函数的平面特霍夫特展开，论证其作为生成泛函能直接探测体对偶的拓扑特征，例如热圆或复本圆的可收缩性。\n2. 其核心是将特霍夫特图视作离壳弦世界面的非微扰定义：复本圆收缩时对应带锥形亏损的世界面，并把矩阵量子力学退禁闭相变同主导拓扑交换及开弦边缘模式联系起来。\n3. 在黑洞蒸发玩具模型中，边界平面展开无需系综平均或预设体鞍点，即可诊断非连通拓扑与复本虫洞拓扑之间的主导权交换，为引力路径积分中的拓扑选择提供判据。", "summary_source": "deepseek", "authors": [{"name": "Jackson R. Fliss"}, {"name": "Alexander Frenkel"}], "featured_authors": [{"name": "Jackson R. Fliss"}, {"name": "Alexander Frenkel"}], "author_count": 2}, {"id": "2609.36026", "category": "hep-th", "title": "Carroll-Weyl symmetries in flat holography", "abstract": "The degenerate geometry of a null boundary admits an enlarged local conformal freedom: in two dimensions, a Carrollian coframe allows two independent Weyl rescalings, one modulating and the other preserving the boundary volume form. We investigate whether both transformations can be realized as charged asymptotic symmetries in three-dimensional flat holography. We show that Einstein gravity canonically realizes the volume-modulating Carroll-Weyl transformation, together with local Carroll boosts, but does not admit the volume-preserving rescaling as an additional independent asymptotic symmetry. We trace this obstruction both back to the conformal completion of null infinity and to the absence of two independent commuting semisimple generators in the Poincaré algebra. Conformal gravity overcomes this obstruction through bulk dilatations, which supply the missing algebraic direction. We construct an asymptotically flat phase space of conformal gravity in which both types of Carroll-Weyl transformations and local Carroll boosts admit finite, integrable, and generically nonvanishing canonical charges, and derive their centrally extended algebra. Finally, we show that these central extensions arise from boundary anomalies through symplectic descent, yielding a gravitational prediction for Carroll-Weyl anomalies in flat holography.", "url": "https://arxiv.org/abs/2609.36026", "type": "理论", "summary": "1. 零边界的简并几何结构允许扩大的局部共形自由度：在二维中，卡罗尔框架允许两个独立的韦尔重新缩放，一个调节，另一个保留边界体积形式。\n2. 最后，我们证明这些中心延伸是通过辛下降产生的边界异常，从而产生了平面全息中卡罗尔-韦尔异常的引力预测。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Arnaud Delfante"}, {"name": "Chrysoula Markou"}], "featured_authors": [{"name": "Arnaud Delfante"}, {"name": "Chrysoula Markou"}], "author_count": 2}, {"id": "2609.36048", "category": "hep-th", "title": "On the Derivation of Twisted K-Theory from M-Theory", "abstract": "In a restricted untwisted sector, Diaconescu, Moore & Witten (2000, 2003) gave a quantum M-theoretic consistency check, at the level of partition functions, of what one may call \"Hypothesis K\", namely that magnetic and electric type IIA brane charges are jointly quantized in K-theory. We show that the more recently discussed \"Hypothesis H\" --- that magnetic and electric charges in 11D are jointly quantized in coHomotopy --- together with a topological smallness condition on the M-theory circle, systematically implies that IIA charges are quantized in a nonabelian deformation of twisted K-theory by the previously neglected non-linear NS1-brane charge. This is essentially a derivation of twisted K-theory from IR-completed 11D SuGra, and conversely a further consistency check on Hypothesis H from Hypothesis K. We motivate and precisely state this result, discuss its structural implications, and outline the elaborate algebro-topological proof.", "url": "https://arxiv.org/abs/2609.36048", "type": "理论", "summary": "1. 在受限的非扭曲扇区中，Diaconescu、Moore 和 Witten (2000, 2003) 在配分函数层面上对所谓的“假设 K”进行了量子 M 理论一致性检验，即磁和电类型 IIA 膜电荷在 K 理论中联合量子化。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Nikita Golub"}, {"name": "Hisham Sati"}, {"name": "Urs Schreiber"}], "featured_authors": [{"name": "Nikita Golub"}, {"name": "Hisham Sati"}, {"name": "Urs Schreiber"}], "author_count": 3}, {"id": "2609.36234", "category": "hep-th", "title": "A Universal Kaluza-Klein Graviton Cascade Rate", "abstract": "We obtain a general decay rate between Kaluza-Klein (KK) gravitons, resolving an ambiguity in the literature concerning these decays. The amplitude is determined not only by the mass $m_n$ of the decaying particle, but also by the momentum $q$ of the decay products in the parent's rest frame, and is suppressed relative to the expression commonly used in the literature by $(q/m_n)^2$. Phase space gives a general $q^5$-dependent decay rate obtained earlier in Randall-Sundrum models. We identify the cancellation that gives this result as a consequence of the massless 5D graviton, and argue for its universality even with scalar-induced KK violation by absorbing non-minimally coupled scalar fields into the warp-factor. This has significant implications for the potential for cascading dark matter models, and can be used to rule out existing Dark Dimension models, because the rapid cascade that was needed to evade constraints is severely suppressed. The amplitude is established by an explicit calculation that accounts for the backreaction of fields and branes and applies broadly to non-minimal diffeomorphism invariant two-derivative couplings between scalar fields and gravity.", "url": "https://arxiv.org/abs/2609.36234", "type": "理论", "summary": "1. 该工作通过显式计算给出Kaluza-Klein引力子间的一般衰变率，澄清文献中的振幅歧义，计入场与膜的backreaction，并覆盖标量场与引力的非最小二导数微分同胚不变耦合。\n2. 其要点是振幅不仅依赖母粒子质量m_n，还依赖其静止系中衰变产物的动量q，较常用表达式压低(q/m_n)^2，相空间给出q^5衰变率；该抵消源于无质量五维引力子，且通过把非最小耦合标量吸收进warp因子可论证其普适性。\n3. 这对级联暗物质模型意义重大，并可排除现有Dark Dimension模型，因为用于规避限制的快速级联被严重压低。", "summary_source": "deepseek", "authors": [{"name": "Vincent S.H. Lee"}, {"name": "Lisa Randall"}, {"name": "Marcos Riojas"}], "featured_authors": [{"name": "Vincent S.H. Lee"}, {"name": "Lisa Randall"}, {"name": "Marcos Riojas"}], "author_count": 3}, {"id": "2609.36274", "category": "hep-th", "title": "Twisted Cohomology of D-Brane Disk Integrals", "abstract": "Disk-level scattering amplitudes involving one Ramond--Ramond and two NSNS states on a D-brane obey nontrivial identities among scalar world-sheet integrals imposed by gauge and T-duality Ward identities. We investigate the cohomological organization of these relations using twisted de Rham cohomology and show that the Ward identities admit twisted-exact representatives. In the $I/J$ sector, the unique generic linear dependence among the Ward identities is realized one degree lower in the same twisted de Rham complex, revealing a common cohomological origin for the identities and their syzygy. We also identify independent pointwise algebraic relations among the integrands. An independent cohomological rank computation then establishes that the physically selected $I/J$ family spans a five-dimensional subspace of the top twisted cohomology at generic complexified kinematics. Extending the construction to the $K$-family, including the exceptional double-pole representative $K_3$, introduces no additional cohomology direction. Hence the complete $I/J/K$ family considered here spans the same five-dimensional subspace.", "url": "https://arxiv.org/abs/2609.36274", "type": "理论", "summary": "1. 该工作用扭曲de Rham上同调研究D膜盘面含一个RR与两个NSNS态的散射，其中标量世界面积分受规范与T对偶Ward恒等式约束。\n2. 其要点是证明这些Ward恒等式具有扭曲恰当代表，并在I/J扇区发现它们唯一生成线性依赖位于同复形的低一阶，从而把恒等式与其syzygy统一为共同上同调起源，并给出被积函数间的独立逐点代数关系。\n3. 独立上同调秩计算表明，物理选择的I/J族在一般复化运动学下张成五维顶扭曲上同调子空间，K族（含双极点K3）不增添新方向，故完整I/J/K族仍为五维，为盘面积分约化提供共上同调框架。", "summary_source": "deepseek", "authors": [{"name": "Komeil Babaei Velni"}], "featured_authors": [{"name": "Komeil Babaei Velni"}], "author_count": 1}, {"id": "2609.36297", "category": "hep-th", "title": "Interpolating conformal algebra in $(3+1)$ dimensions between the instant form and the light-front form of relativistic dynamics", "abstract": "We extend the interpolation of the Poincaré algebra between instant form dynamics (IFD) and light-front dynamics (LFD) to the conformal algebra in $(3+1)$ dimensions. Building upon our recent formulation of the interpolating conformal algebra in $(1+1)$ dimensions, we propose an interpolation method for the conformal group $SO(4,2)$. A central feature of this work is classifying the $15$ conformal generators into kinematic and dynamic categories as a function of the interpolation angle ($0 \\leq \\delta \\leq \\frac{\\pi}{4}$). We show that among the five additional generators beyond the Poincaré group, the dilatation generator remains strictly kinematic across the entire interpolation region. We also find that in the exact light-front limit ($\\delta = \\frac{\\pi}{4}$), one additional generator from the Special Conformal Transformations (SCT) becomes kinematic in $(1+1)$ but dynamical in $(3+1)$. This behavior shows the advantage of LFD in maximizing kinematic generators and minimizing dynamical complexity. To support this algebraic framework, we construct a $6 \\times 6$ interpolating projective spacetime matrix representation. We detail the explicit transformations of the interpolating time under all $15$ generators, providing a systematic view of conformal symmetry across the relativistic dynamics.", "url": "https://arxiv.org/abs/2609.36297", "type": "理论", "summary": "1. 我们将即时形式动力学 (IFD) 和光锋动力学 (LFD) 之间的庞加莱代数插值扩展到 $(3+1)$ 维度的共形代数。\n2. 我们详细介绍了所有 15 美元生成器下插值时间的显式变换，提供了相对论动力学中共形对称性的系统视图。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Hariprashad Ravikumar"}, {"name": "Chueng-Ryong Ji"}], "featured_authors": [{"name": "Hariprashad Ravikumar"}, {"name": "Chueng-Ryong Ji"}], "author_count": 2}, {"id": "2609.36542", "category": "hep-th", "title": "Emergent Symmetries in Ensemble Averages", "abstract": "It is widely believed that there are no exact global symmetries in quantum gravity. We review recent works showing that global symmetries can nevertheless emerge after ensemble averages of theories, as encountered in holography. As a precision case study, we discuss the ensemble average of two-dimensional Narain-type conformal field theories associated with an even quadratic form of general signature, which is computed by the Siegel-Weil formula and interpreted as a sum over geometries in a three-dimensional Abelian Chern-Simons theory. Global symmetries of the bulk anyons can emerge after the average, as T-dualities relating different theories in the ensemble are \"folded\" into symmetries of a single theory (duality origami). We discuss the relation to the Swampland program, including the emergence of global symmetries at infinite distance. Finally, we recast strong-to-weak spontaneous symmetry breaking (SWSSB) of mixed states as an emergence of symmetries in ensemble averages; in holography, wormholes connecting the two sides of a thermofield-double construction provide its bulk realization. This motivates a new Swampland conjecture.", "url": "https://arxiv.org/abs/2609.36542", "type": "理论", "summary": "1. 该文综述并论证理论系综平均后全局对称性可涌现，并以二维纳拉因型共形场论为精确案例。\n2. 其技术卖点是用西格尔-魏尔公式计算一般签名偶数二次型的平均，解释为三维阿贝尔陈-西蒙斯几何求和，T对偶折叠成体任意子对称性。\n3. 该框架将混合态的强弱自发对称破缺重释为系综平均中的对称涌现，由连接热场双态两侧的全息虫洞实现，并启发新的沼泽地猜想。", "summary_source": "deepseek", "authors": [{"name": "Masahito Yamazaki"}], "featured_authors": [{"name": "Masahito Yamazaki"}], "author_count": 1}, {"id": "2609.36548", "category": "hep-th", "title": "Classical Shadows of Higher-Form BRST Anomalies", "abstract": "We formulate a precise sense in which a BRST anomaly may possess a classical phase space shadow. It is the non-equivariance class of a Hamiltonian symmetry action on covariant phase space. To organize this statement, we introduce the Weil covariant phase space bicomplex, whose basic subcomplex controls equivariant Hamiltonian lifts. We then compare this purely classical class with local BRST descent. For a Hamiltonian admissible mixed transgression, the ghost-number-two descendant $a^{2}_{d-1}$ defines a deghostification map to the charge algebra, which is generated by the failure of the Cartan representative to be equivariant. The induced cohomology class is independent of Bardeen type changes of descent representative. Thus the classical anomaly is a shadow of the BRST anomaly in the precise sense that both are realizations of the same Weil transgression class, while remaining objects of different theories. As an explicit example, we analyze a five dimensional inflow transgression and show that the classical charge cocycle and the BRST descendant arise as two realizations of the same Weil transgression class.", "url": "https://arxiv.org/abs/2609.36548", "type": "理论", "summary": "1. 该工作为BRST反常的经典相空间影子给出精确表述，将其刻画为协变相空间上哈密顿对称作用的非等变性类，并引入Weil协变相空间双复形来组织这一对应。\n2. 其核心卖点在于将局域BRST降阶与经典类统一为同一Weil移行类：对哈密顿容许混合移行，鬼数二后代给出到荷代数的去鬼映射，该荷代数源于Cartan代表的非等变性，且诱导上同调类在Bardeen型改变下不变。\n3. 这为理解高形式反常的经典起源、五维流入移行的具体实现，以及经典荷余循环与BRST后代作为同一Weil移行类的两种实现提供了统一视角，并提示可在更一般协变相空间中检验该影子对应。", "summary_source": "deepseek", "authors": [{"name": "Ruizhi Shen"}, {"name": "Fu-Wen Shu"}], "featured_authors": [{"name": "Ruizhi Shen"}, {"name": "Fu-Wen Shu"}], "author_count": 2}, {"id": "2609.36604", "category": "hep-th", "title": "Color Relations and Off-Shell Double-Copy for Towers of Theories", "abstract": "Only a handful of elementary color building blocks are known to participate in the double copy, most notably the structure constants of gauge theory. This work extends the double copy to include the infinite family of totally antisymmetric ``structure constants'' with arbitrarily many indices. We propose and motivate the Jacobi identities relating these $n$-index structure constants. For each $n$, we provide a derivatively-coupled scalar theory that is color-dual off-shell. The lowest level in this tower is two-dimensional Zakharov-Mikhailov theory, with one theory for each higher spacetime dimension. Each member of the tower exhibits a conserved current associated with color-kinematics duality, a soft theorem, an on-shell recursion relation, and classical conformal invariance. We also provide a tower of modified non-abelian Chern-Simons theories whose fields couple non-linearly through the $n$-index structure constants. The modified Chern-Simons theories are trivially topological and classically conformal but generally exhibit unusual features like kinetic mixing. A potentially unphysical gauge condition is identified that would ensure that the tower is color-dual off-shell.", "url": "https://arxiv.org/abs/2609.36604", "type": "理论", "summary": "1. 该工作把双拷贝拓展至任意多指标的全反对称“结构常数”无穷塔，提出其Jacobi恒等式，并为每个n构造离壳色对偶的导数耦合标量理论；最低层是二维Zakharov-Mikhailov理论，并给出由n指标结构常数非线性耦合的修正非阿贝尔Chern-Simons理论塔。\n2. 每个塔成员均含色-运动学对偶守恒流、软定理、在壳递推与经典共形不变性；修正Chern-Simons理论拓扑且经典共形，却常出现动能混合，并需借助一个可能非物理的规范条件来实现离壳色对偶。\n3. 这为离壳统一色关系与双拷贝、构造更高维色对偶理论提供可操作框架，并提示应检验该塔离壳色对偶所需规范条件的物理合理性。", "summary_source": "deepseek", "authors": [{"name": "James Mangan"}, {"name": "Able Martinez"}, {"name": "Joseph Thomas"}], "featured_authors": [{"name": "James Mangan"}, {"name": "Able Martinez"}, {"name": "Joseph Thomas"}], "author_count": 3}, {"id": "2609.36764", "category": "hep-th", "title": "Dirichlet gravitons in AdS$_4$ and $\\mathcal{L}_Λw_{1+\\infty}$ wedge algebra", "abstract": "We derive the AdS deformation of the flat-space soft-graviton algebra with Dirichlet boundary conditions. Starting from the AdS$_4$ spinor-helicity representation, we Mellin-transform linearized graviton solutions and construct the AdS wedge, including its Laurent completion. The Dirichlet boundary condition pairs opposite helicities, while AdS covariance fixes their relative normalization. Assuming linear closure and normalizing the global modes to reproduce the geometric AdS isometries, covariance and the Jacobi identities uniquely determine the soft-mode bracket. The result is the wedge of $\\mathcal L_\\Lambda w_{1+\\infty}$, where $\\Lambda=-\\ell^{-2}$. This provides a bulk derivation of the cosmological-constant deformation that incorporates the AdS boundary condition, without relying on collinear splitting functions or a self-dual truncation.", "url": "https://arxiv.org/abs/2609.36764", "type": "理论", "summary": "1. 该工作从AdS₄旋量-螺旋度表示出发，对线性化引力子解作Mellin变换，并在Dirichlet边界条件下构造AdS楔及其Laurent完备化。\n2. 其核心在于Dirichlet条件配对相反螺旋度、AdS协变性固定其相对归一化，并在线性闭合与全局模重现几何AdS等距的假设下，由协变性和Jacobi恒等式唯一确定软模括号，得到Λ=-ℓ⁻²的L_Λw_{1+∞}楔代数。\n3. 这为宇宙学常数形变提供了体时空推导，表明AdS边界条件可直接融入软引力代数，且无需依赖共线分裂函数或自对偶截断。", "summary_source": "deepseek", "authors": [{"name": "Hare Krishna"}], "featured_authors": [{"name": "Hare Krishna"}], "author_count": 1}, {"id": "2609.37074", "category": "hep-th", "title": "Notes on algebraic perspective on neural network conformal theories", "abstract": "Neural network conformal theories were first introduced in \\cite{Halverson:2024axc} and exact two-, three- and four-point correlators were computed from an ensemble of infinite-width neural networks. In particular, the four-point correlator of any scalar operator satisfied crossing-symmetry and conformal block decomposition across different channels were in agreement without any constraint on moments. An infinite tower of degenerate operators with the same scaling dimension were found. In this note, we take a closer look at the structure of correlators and relation between operators. We also layout a recipe to construct the algebra of the theory.", "url": "https://arxiv.org/abs/2609.37074", "type": "理论", "summary": "1. 本文从代数视角重新考察神经网络共形理论，细致分析其关联函数结构及算符间关系，并给出构造该理论代数的具体方案。\n2. 其关键贡献在于阐明由无限宽神经网络系综精确算出的二、三、四点关联函数中，任意标量算符的四点函数如何无需对矩加约束即满足交叉对称性与共形块分解、跨通道一致，并解释同一标度维度下无限简并算符塔的代数含义。\n3. 这一代数视角为理解该类共形理论的底层结构、构造其算符代数，以及推广至更一般的关联函数或网络系综提供了可操作的启发。", "summary_source": "deepseek", "authors": [{"name": "Sam Leutheusser"}, {"name": "Joydeep Naskar"}], "featured_authors": [{"name": "Sam Leutheusser"}, {"name": "Joydeep Naskar"}], "author_count": 2}, {"id": "2609.37092", "category": "hep-th", "title": "The Origin and Fate of Rapid Negative Modes in Coleman--De Luccia Tunneling", "abstract": "Coleman--De Luccia tunneling can exhibit an infinite tower of rapidly oscillating negative modes, complicating the semiclassical evaluation of the path integral. We show that this tower does not represent infinitely many bounce-specific instabilities, but instead is tied to a single underlying gravitational conformal sector. This sector is exposed in two different ways: by a large scalar gradient near the bubble wall and by the turning point of a compact Euclidean geometry. The corresponding conformal sector is already present in fluctuations about the false vacuum. Treating the bounce and the false vacuum in the same well-defined gauge and with a common regulator, we find that their high-frequency negative spectra approach one another. The ultraviolet tower therefore cancels from the relative negative-mode count, leaving a single bounce-specific negative mode. This clears a major conceptual obstacle toward a systematic calculation of the Coleman--De Luccia prefactor.", "url": "https://arxiv.org/abs/2609.37092", "type": "理论", "summary": "1. 该工作研究Coleman-De Luccia隧穿中快速振荡负模的起源与归宿，指出其并非无数弹跳专属不稳定性，而对应单一引力共形扇区。\n2. 将弹跳与假真空置于同一规范并共用正则化后，高频负谱趋于一致，紫外负模塔在相对负模计数中相消，仅余一个弹跳专属负模。\n3. 这清除了系统计算Coleman-De Luccia前因子的主要概念障碍，并为半经典路径积分中负模的规范处理提供启示。", "summary_source": "deepseek", "authors": [{"name": "Yutaka Ookouchi"}], "featured_authors": [{"name": "Yutaka Ookouchi"}], "author_count": 1}, {"id": "2609.37099", "category": "hep-th", "title": "Constructing and Probing Three-Boundary Booklet Geometries", "abstract": "Partially entangled thermal states (PETS) provide semiclassical families of black-hole microstates prepared through heavy shell insertions. We extend this shell-state framework and propose three-boundary partially entangled thermal states (PETS$_3$) by replacing the two-index insertion data with a trivalent junction tensor. The corresponding bulk three-boundary booklet geometry is constrained semiclassically by the Israel junction condition, allowing us to identify candidate symmetric and mixed-orientation branches. We verify the self-consistency of this construction by counting states in the symmetric all-black-hole sector. Using a heavy-operator probe, we further estimate the detection-to-universal ratio to be $Z_D/Z_U \\simeq 3$, twice the two-boundary value of $3/2$. These results suggest that a fine-tuned probe localized on one boundary can test the proposed three-boundary shell state and potentially distinguish it from its two-boundary counterpart.", "url": "https://arxiv.org/abs/2609.37099", "type": "理论", "summary": "1. 部分纠缠热态（PETS）提供了通过重壳插入制备的半经典黑洞微态族。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Yan Liu"}, {"name": "Shaodong Zhou"}], "featured_authors": [{"name": "Yan Liu"}, {"name": "Shaodong Zhou"}], "author_count": 2}, {"id": "2609.37269", "category": "hep-th", "title": "Active normal-fluid feedback in quantum turbulence from holography", "abstract": "The two-fluid model provides a powerful phenomenological framework for superfluids, where components interact through vortex-induced mutual friction. Quantum turbulence in such coupled two-fluid systems has become a central theme in low-temperature physics. However, the fundamental incompatibility between discrete vortex-line and continuum descriptions has historically forced reliance on phenomenological parameters. Here, we present an ab initio holographic simulation of this active two-fluid dynamics. Using a fully backreacted gravitational model, we intrinsically incorporate reciprocal momentum exchange and finite-temperature dissipation without empirical inputs. Contrasting continuously driven and freely decaying turbulence, we uncover pronounced non-Gaussian tails and spatial anisotropy in the normal-fluid velocity statistics, arising directly from the dynamical quantized vortex backreaction. Raising the temperature suppresses normal-fluid velocity fluctuations despite increasing the vortex density. This suppression is unambiguously traced to the thermal depletion of the superfluid condensate. Our results establish holographic duality as a rigorous first-principles framework for quantum turbulence, revealing the active role of the normal fluid far from equilibrium and yielding predictions for ongoing cold-atom and superfluid experiments.", "url": "https://arxiv.org/abs/2609.37269", "type": "理论", "summary": "1. 该工作利用全息对偶，构建完全反作用的引力模型，对量子湍流中的双流体动力学进行从头模拟，无需经验参数即可纳入互易动量交换与有限温度耗散。\n2. 其核心卖点在于对比持续驱动与自由衰减湍流时，发现动态量子化涡旋反作用直接导致正常流体速度统计出现显著非高斯尾与空间各向异性，并揭示升温虽提高涡线密度却因超流凝聚体热耗竭而抑制正常流体速度涨落。\n3. 这确立全息对偶作为量子湍流严格第一性原理框架，凸显远离平衡时正常流体的主动反馈角色，并为冷原子与超流实验提供可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Yu-Ping An"}, {"name": "Li Li"}, {"name": "Makoto Tusbota"}, {"name": "Sebastian Waeber"}, {"name": "Hua-Bi Zeng"}], "featured_authors": [{"name": "Yu-Ping An"}, {"name": "Li Li"}, {"name": "Makoto Tusbota"}, {"name": "Sebastian Waeber"}, {"name": "Hua-Bi Zeng"}], "author_count": 5}, {"id": "2609.37346", "category": "hep-th", "title": "Relic of the Kink Shape Mode in a Topological Thick Brane - some implications", "abstract": "The kink soliton provides a simple construction of a topological thick 3-brane sourced by a minimally coupled canonical scalar field in five-dimensional general relativity. Although the flat-space kink is a solution of $\\varphi^4$ theory, the gravitating configuration requires $M_*$-suppressed $\\varphi^6$ corrections to support a stable warped geometry. Unlike its flat-space counterpart, the scalar perturbation spectrum contains no normalizable bound state. We nevertheless identify a single quasi-bound, or resonant, mode. Using a time-independent relative-probability analysis, direct time evolution, and a four-turning-point WKB calculation, we establish a direct connection between this resonance and the massive bound shape mode of the flat-space $\\varphi^4$ kink. We also show that, within an EFT-consistent parameter window, the resonance can transfer energy from bulk geometric fluctuations to localized matter, thereby allowing the possibility of high-scale reheating in the early universe.", "url": "https://arxiv.org/abs/2609.37346", "type": "理论", "summary": "1. 该工作研究五维广义相对论中由最小耦合标量场支撑的拓扑厚3-膜，指出引力化扭结需引入M*压低的φ^6修正以稳定卷曲几何，并分析标量扰动中无归一化束缚态的单个准束缚共振。\n2. 其关键论证在于用静态相对概率、直接时间演化和四转折点WKB确认该共振对应平空间φ^4扭结的有质量形状模，从而揭示弯曲时空中残余的形状模。\n3. 在有效场论允许参数窗口内，该共振可将体几何涨落能量转移给局域物质，为早期宇宙高能标重加热提供可能机制，并启发厚膜谱与宇宙学关联研究。", "summary_source": "deepseek", "authors": [{"name": "Gahan Chattopadhyay"}, {"name": "Soumitra Sengupta"}], "featured_authors": [{"name": "Gahan Chattopadhyay"}, {"name": "Soumitra Sengupta"}], "author_count": 2}, {"id": "2609.37394", "category": "hep-th", "title": "Can Multipartite Entanglement Probe Wormhole Moduli Invisible to Bipartite Entanglement?", "abstract": "We ask whether multipartite entanglement can probe bulk moduli invisible to bipartite entanglement. We study this question in an explicit family of four-boundary AdS$_3$ wormholes related by a Fenchel-Nielsen twist $\\tau$, asking whether the complete set of bipartite RT entropies can remain exactly $\\tau$-independent while the holographic $\\mathtt q=4$ multi-entropy is sensitive to the twist. Within the class of configurations analyzed here, for sufficiently small $|\\tau|$, we find no such regime along the symmetric line $\\ell=m$: the globally minimal $\\mathtt q=4$ network is itself exactly $\\tau$-independent throughout the parameter range analyzed. This conclusion is not a priori obvious: it emerges from a competition among several admissible configurations whose relative ordering changes multiple times as the geometry is varied, and persists up to the point where the bipartite RT entropies themselves become twist-sensitive.", "url": "https://arxiv.org/abs/2609.37394", "type": "理论", "summary": "1. 该工作研究四边界AdS₃虫洞族中Fenchel-Nielsen扭转τ是否只能被全息q=4多熵感知，而所有二分RT熵均与之严格无关。\n2. 沿对称线ℓ=m且在较小|τ|范围内，作者并未发现这种分离：全局最优q=4网络本身也不依赖τ，该结论源于多种允许构型竞争并多次改变排序，并持续到二分RT熵自身开始敏感。\n3. 因此，在所分析构型中多熵并未探测到二分纠缠不可见的体模量，这为高阶纠缠相对二分纠缠的额外探测能力划定了具体边界与限制。", "summary_source": "deepseek", "authors": [{"name": "Norihiro Iizuka"}], "featured_authors": [{"name": "Norihiro Iizuka"}], "author_count": 1}, {"id": "2609.37395", "category": "hep-th", "title": "Multipartite Entanglement Can Probe Wormhole Moduli Invisible to Bipartite Entanglement", "abstract": "In a companion paper, we found that near the untwisted point of a four-boundary AdS$_3$ wormhole, whenever the complete bipartite Ryu-Takayanagi entropy vector is insensitive to a Fenchel-Nielsen twist, the holographic $\\mathtt q=4$ multi-entropy is insensitive as well. Here we show that the situation changes at finite twist. The twist lengthens the crossing geodesics and thereby enlarges the region in which all bipartite RT entropies remain invariant. In part of this enlarged region, a twist-sensitive $\\mathtt q=4$ network becomes globally minimal. We thus find an open region of wormhole moduli space in which the complete bipartite RT entropy vector is exactly unchanged while the $\\mathtt q=4$ multi-entropy detects the twist. Our result provides an explicit example in which the $\\mathtt q=4$ genuine multi-entropy probes bulk geometric information invisible to all bipartite entanglement entropies.", "url": "https://arxiv.org/abs/2609.37395", "type": "理论", "summary": "1. 该工作表明，在四边界AdS3虫洞中，有限Fenchel-Nielsen扭转会改变二分RT熵向量与全息q=4多熵的敏感性关系。\n2. 其卖点在于扭转拉长交叉测地线，扩大所有二分RT熵不变的区域，并使对扭转敏感的q=4网络在该区域内成为全局最小。\n3. 这给出虫洞模空间开区域：完整二分RT熵向量不变而q=4多熵探测到扭转，表明真正的多体纠缠可揭示二分纠缠不可见的体几何信息。", "summary_source": "deepseek", "authors": [{"name": "Takanori Anegawa"}, {"name": "Norihiro Iizuka"}], "featured_authors": [{"name": "Takanori Anegawa"}, {"name": "Norihiro Iizuka"}], "author_count": 2}, {"id": "2609.37401", "category": "hep-th", "title": "Quantum states in an AdS-invariant theory", "abstract": "We note that the description of elementary particles in anti-de Sitter (AdS) quantum theory differs radically from standard approaches. Since the Cartan subalgebra of the AdS algebra has rank 2, it is necessary to consider only those elements that explicitly depend on the eigenvalues of operators in the irreducible representations (IRs) of the algebra. In the literature, AdS symmetry is widely invoked in various quantum applications, such as AdS/QCD. However, such frameworks typically do not take into account the unconventional properties of the AdS algebra IRs investigated in the present paper.", "url": "https://arxiv.org/abs/2609.37401", "type": "理论", "summary": "1. 该文重新审视反德西特不变量子理论中基本粒子的描述，指出其与标准方法存在根本差异，并研究该对称性代数不可约表示的非寻常性质。\n2. 其关键在于反德西特代数的嘉当子代数秩为二，因而只能考虑显式依赖不可约表示中算符本征值的元素，从而揭示常被反德西特/量子色动力学等框架忽略的表示论特征。\n3. 这提示依赖反德西特对称性的量子应用必须纳入这些不可约表示特征，否则粒子态与谱的预言可能不完整，相关模型需重新检验。", "summary_source": "deepseek", "authors": [{"name": "Felix M. Lev"}, {"name": "Valery E. Lyubovitskij"}], "featured_authors": [{"name": "Felix M. Lev"}, {"name": "Valery E. Lyubovitskij"}], "author_count": 2}, {"id": "2609.37536", "category": "hep-th", "title": "The Stieltjes Bootstrap for Feynman Integrals", "abstract": "We prove that scalar Feynman integrals are Stieltjes functions in each kinematic variable $-p_i\\cdot p_j$, as well as in the particle masses, for arbitrary loop order, arbitrary numbers of external legs, and arbitrary internal masses, whenever a certain exponent condition is satisfied. The proof rests on a canonical decomposition of the second Symanzik polynomial with manifestly non-negative coefficients indexed by spanning two-forests. We present a dedicated analysis of the case in which the kinematic variables satisfy relations, as frequently happens in physical applications. We argue that integration-by-parts relations allow the selection of master-integral bases in which every element is a Stieltjes function. The Stieltjes property guarantees the convergence of Padé approximants and provides determinantal (Hankel) constraints on the Taylor coefficients of master integrals that go beyond previously known complete-monotonicity bounds. We develop a numerical strategy that combines these Stieltjes constraints with differential equations to determine the master integrals in the Euclidean region via semidefinite optimization. We demonstrate this approach on the pedagogical example of the six-dimensional massive box integral, and then apply it to the calculation of previously unknown three-loop two-mass integrals needed for three-loop electroweak corrections to the $Z$- and Higgs-boson self-energies.", "url": "https://arxiv.org/abs/2609.37536", "type": "理论", "summary": "1. 该工作证明在特定指数条件下，任意圈数、外腿数和内质量的标量费曼积分对每个运动学变量 -p_i·p_j 及粒子质量均为 Stieltjes 函数，并处理变量间存在关系的情形。\n2. 核心卖点是第二 Symanzik 多项式按张成二森林的显式非负系数分解；结合积分分部关系可选择全由 Stieltjes 函数组成的主积分基，并获得超越完全单调性界的 Padé 收敛与 Hankel 行列式约束。\n3. 作者将该约束与微分方程结合，在欧氏区用半定优化求解主积分，并在六维有质量箱图和三圈双质量积分上验证，为三圈电弱 Z 与 Higgs 自能修正提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Hadrien Brochet"}, {"name": "Maximilian Haensch"}, {"name": "Johannes Henn"}, {"name": "Benjamin Hollering"}, {"name": "Prashanth Raman"}, {"name": "Qinglin Yang"}, {"name": "Simone Zoia"}], "featured_authors": [{"name": "Hadrien Brochet"}, {"name": "Maximilian Haensch"}, {"name": "Johannes Henn"}, {"name": "Prashanth Raman"}, {"name": "Qinglin Yang"}, {"name": "Simone Zoia"}], "author_count": 7}, {"id": "2609.37674", "category": "hep-th", "title": "Reconciling Inflation with the Festina Lente Bound through Affleck-Dine Baryogenesis", "abstract": "The Festina-Lente bound is a swampland conjecture motivated by the behavior of charged BHs in dS spacetime, which imposes a constraint on the masses of charged particles. Although relatively weak in the present-day Universe, it can severely constrain inflation. We clarify its underlying assumptions and show that breaking all gauge symmetries during inflation, with gauge boson masses above the Hubble scale, provides a natural way to evade these constraints. We catalogue single flat directions in the Minimal Supersymmetric Standard Model that completely break its continuous gauge group, together with pairs that achieve complete breaking only when both directions are excited and simultaneously satisfy F- and D-flatness. With suitable lifting operators, such condensates can also generate the baryon asymmetry through the Affleck-Dine mechanism. Within this classification, all single-direction monomials that admit complete breaking carry nonzero $B-L$, providing candidates for Affleck-Dine baryogenesis. We further show that, in this setting, a large condensate compatible with the observed baryon asymmetry and isocurvature constraints readily satisfies the Festina-Lente bound, establishing a natural connection between the FL bound and Affleck-Dine baryogenesis.", "url": "https://arxiv.org/abs/2609.37674", "type": "理论", "summary": "1. 该工作通过Affleck-Dine重子生成调和暴胀与Festina-Lente界，并分类MSSM中能完全破缺连续规范群的单方向与成对平坦方向。\n2. 其技术卖点是暴胀期完全破缺规范对称性且规范玻色子质量高于哈勃尺度，完全破缺的单方向单项式均携带非零B-L。\n3. 这表明兼容观测重子不对称与等曲率限制的大凝聚体可轻松满足FL界，为swampland约束与重子生成建立自然联系。", "summary_source": "deepseek", "authors": [{"name": "Kazuto Nakamura"}, {"name": "Masaki Yamada"}], "featured_authors": [{"name": "Kazuto Nakamura"}, {"name": "Masaki Yamada"}], "author_count": 2}, {"id": "2609.37768", "category": "hep-th", "title": "On perturbative aspects of a nonminimal Lorentz-violating QED with CPT-odd dimension-6 terms", "abstract": "In this paper, we investigate the first-order one-loop quantum corrections generated by all possible nonminimal dimension-6 additive CPT-odd Lorentz-violating (LV) terms to analyze the radiative induction of the Carroll-Field-Jackiw (CFJ)-like terms. We demonstrate that for dimension-6 operators, the resulting CFJ term can diverge for some choices of LV operators; however, in all these cases, this divergence is eliminated for certain relations between LV parameters.", "url": "https://arxiv.org/abs/2609.37768", "type": "理论", "summary": "1. 该文在含CPT奇、六维非最小洛伦兹破缺项的QED中，计算所有此类算符的一阶单圈量子修正，分析CFJ类项的辐射诱导。\n2. 其核心结果在于：部分六维算符会使辐射诱导的CFJ项发散，但所有此类发散均可在洛伦兹破缺参数满足特定关系时消除。\n3. 这提示此类六维CPT奇算符的物理效应需结合洛伦兹破缺参数约束考察，并为后续微扰计算与唯象限制提供依据。", "summary_source": "deepseek", "authors": [{"name": "T. Mariz"}, {"name": "M. Melo"}, {"name": "J. R. Nascimento"}, {"name": "A. Yu. Petrov"}], "featured_authors": [{"name": "T. Mariz"}, {"name": "M. Melo"}, {"name": "J. R. Nascimento"}, {"name": "A. Yu. Petrov"}], "author_count": 4}, {"id": "2609.37795", "category": "hep-th", "title": "Monopoles, duality, and large charge in Chern-Simons QED$_3$", "abstract": "We compute the scaling dimensions of charge $q$ monopole operators in QED$_3$ with $N$ two-component complex fermions and Chern-Simons level $k$, to subleading order in the limit where $k,N$ are large and $k/N$ is fixed. We use this and previous results for scalar QED$_3$ (sQED$_3$) to check the duality between QED$_3$ with $N=1,k=-3/2$ and sQED$_3$ with $N=1,k=2$, who
