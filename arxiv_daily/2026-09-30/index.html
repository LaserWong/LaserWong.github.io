识性，揭示其由Sp(2n,R)/U(n)的C_n限制根系支配，并在固定平均光子数下求解E-最优探针设计。\n2. 其核心在于用根2r_j与r_j±r_k分别标记局部相位旋转和两分束器正交分量，其消失精确刻画所有Fisher零方向并量化奇异壁趋近。\n3. 该分类将局部可辨识性、灵敏度优化与同时可达到性分离，为被动高斯计量及相关量子探针设计提供根系统框架。", "summary_source": "deepseek", "authors": [{"name": "A. Kafuri"}, {"name": "B. M. Rodriguez-Lara"}], "featured_authors": [{"name": "A. Kafuri"}, {"name": "B. M. Rodriguez-Lara"}], "author_count": 2}, {"id": "2609.36694", "category": "quant-ph", "title": "Optimized Randomized Hamiltonian Simulation via Average-Error Analysis", "abstract": "Hamiltonian simulation is a central application of quantum computing. Randomized Hamiltonian simulation approximates the target dynamics by sampling quantum circuits and often allows simpler circuit implementations. We develop a framework for randomized Hamiltonian simulation in which Hamiltonian terms are sampled with arbitrary probabilities and the corresponding short-time evolutions are implemented sequentially. The leading channel error relative to ideal time evolution is governed by the variance of the sampled generators. Minimizing the variance-based upper bound on the worst-case error recovers qDRIFT, a leading randomized Hamiltonian simulation algorithm that samples terms in proportion to their operator norms. For typical input states, however, this sampling distribution need not be optimal. Minimizing Haar-averaged error bounds instead yields sampling probabilities proportional to the Hilbert-Schmidt norms of the terms. This choice can provide smaller average-error bounds than conventional qDRIFT. For Hamiltonians expressed as sums of Pauli strings, we combine this framework with commuting Pauli grouping to obtain smaller error bounds than conventional qDRIFT at fixed $R_z$ depth. Numerical benchmarks for the Sachdev-Ye-Kitaev model show error-bound improvement factors consistent with linear scaling in the number of qubits. For the 108-qubit FeMoco Hamiltonian, the error bounds are reduced by a factor of about 5.65. These results establish average-error optimization as a practical design principle for randomized Hamiltonian simulation.", "url": "https://arxiv.org/abs/2609.36694", "type": "理论+数值", "summary": "1. 该工作建立了随机化哈密顿量模拟框架，以任意概率采样哈密顿项并顺序实现短时演化，将相对理想演化的主导信道误差与采样生成元的方差相联系。\n2. 其核心卖点在于：最小化基于方差的最坏情形误差上界可重现按算符范数采样的qDRIFT，而最小化Haar平均误差界则给出按Hilbert-Schmidt范数采样的概率；结合对易Pauli分组可在固定Rz深度下进一步降低误差界。\n3. 在SYK模型上误差界改善随量子比特数线性增长，108比特FeMoco的误差界约降5.65倍，表明平均误差优化可作为随机化哈密顿量模拟的实用设计原则。", "summary_source": "deepseek", "authors": [{"name": "Hayata Morisaki"}, {"name": "Keisuke Fujii"}], "featured_authors": [{"name": "Hayata Morisaki"}, {"name": "Keisuke Fujii"}], "author_count": 2}, {"id": "2609.36708", "category": "quant-ph", "title": "A Divide-and-Conquer Quantum-Selected Configuration Interaction for Evaluating $π$-$π$ Stacking Interaction Energies in the Benzene Dimer", "abstract": "Accurate evaluation of $\\pi$--$\\pi$ stacking interactions requires a description of electron correlation on a small energy scale. Direct variational quantum calculations of the benzene dimer with CAS(28e,20o) require 40 qubits and deep circuits. Here, we propose Divide-and-Conquer Quantum-Selected Configuration Interaction (Deep QSCI), combining the divide-and-conquer idea of Deep VQE with QSCI, and apply it to the sandwich benzene dimer. We perform QSCI for one monomer and construct a reduced local basis by applying particle-number-conserving one-electron excitations to its ground state. Using this basis and the intermonomer interaction Hamiltonian, we build and diagonalize an effective Hamiltonian of the dimer. Since the monomers have the same structure, the QSCI result is reused for both monomers and across intermolecular distances, reducing the required quantum register from 40 to 20 qubits for the monomer CAS(14e,10o). With 6-31G**, the model gives an attractive minimum of -0.91 kcal/mol at 4.0 $Å$, compared with the counterpoise-corrected CCSD(T) value of -1.14 kcal/mol. With cc-pVDZ, a large cancellation appears between the product-state interaction energy and the energy lowering by diagonalization. This may reflect insufficient consistency of the active orbitals and reduced local bases between monomers. Orbital consistency, reduced-space convergence across basis sets, and charge transfer remain key issues for quantitative accuracy. Deep QSCI thus provides a resource-efficient approach to constructing model interaction curves without repeating monomer quantum calculations at each separation.", "url": "https://arxiv.org/abs/2609.36708", "type": "理论+数值", "summary": "1. 该工作提出 Deep QSCI，将分治法与量子选择组态相互作用结合，仅对单体做量子计算，用于评估苯二聚体的 π-π 堆叠相互作用能。\n2. 其核心是用单体 CAS(14e,10o) 的 QSCI 基态与粒子数守恒单激发构造约化局域基，再以单体间相互作用哈密顿量构建并对角化二聚体有效哈密顿量，使量子比特由40降至20，且同一单体结果可在不同间距复用；6-31G** 下给出4.0 Å处 -0.91 kcal/mol 的吸引极小，接近 CCSD(T) 的 -1.14 kcal/mol。\n3. 该方案为资源受限下构造模型相互作用曲线提供了可行路径，但活性轨道一致性、约化空间跨基组收敛及电荷转移仍是定量精度关键。", "summary_source": "deepseek", "authors": [{"name": "Ryotaro Tajima"}, {"name": "Rei Sato"}, {"name": "Yosuke Iyama"}, {"name": "Ryo Kiguchi"}, {"name": "Yoshitake Kitanishi"}], "featured_authors": [{"name": "Ryotaro Tajima"}, {"name": "Rei Sato"}, {"name": "Yosuke Iyama"}, {"name": "Ryo Kiguchi"}, {"name": "Yoshitake Kitanishi"}], "author_count": 5}, {"id": "2609.36711", "category": "quant-ph", "title": "Quantum States and Spectra of Small Cylindrical and Toroidal Lattices", "abstract": "We examine the spectrum and quantum states of small lattices with cylindrical and toroidal topology subject to a scalar gauge potential that introduces a position dependent phase in the inter-site coupling. Equivalency of gauges assumed in infinite lattices is generally lost due to the periodic boundary conditions, and conditions that restore it are identified. We trace the impact of various system parameters including gauge choice, boundary conditions and inter-site coupling strengths, and an additional axial field. We find gauge dependent appearance of avoided crossings and persistent degeneracies, and we show their impact on the associated eigenstates. Smaller lattices develop prominent gaps in spectral lines associated with edge states, which are suppressed in the thermodynamic limit. Toroidal lattices have counterparts of most of the features observed in cylindrical lattices, but notably they display a transition from localization to delocalization determined by the relation between the field parameter and the number of lattice sites.", "url": "https://arxiv.org/abs/2609.36711", "type": "理论", "summary": "1. 该工作研究了处于标量规范势下的小型柱状与环面晶格的能谱和量子态，该势在格点间耦合中引入位置依赖相位，并系统考察规范选择、边界条件、耦合强度及轴向场的影响。\n2. 其关键发现是周期边界通常破坏无限晶格中的规范等价性并给出恢复条件，同时揭示避免交叉与持续简并的规范依赖及其对本征态的影响；小尺寸边缘态谱隙在热力学极限下被抑制，环面晶格则出现由场参数与格点数关系决定的局域-离域转变。\n3. 这些结果为有限拓扑晶格中规范等价性、边缘态与局域化行为提供基准，并提示环面几何可用于按场参数与格点数调控局域-离域转变。", "summary_source": "deepseek", "authors": [{"name": "Caelan Brooks"}, {"name": "Kunal K. Das"}], "featured_authors": [{"name": "Caelan Brooks"}, {"name": "Kunal K. Das"}], "author_count": 2}, {"id": "2609.36861", "category": "quant-ph", "title": "Exact Trotterization in the Degenerate Quantum Rabi Model", "abstract": "Digital quantum simulation of the quantum Rabi model in the deep strong coupling regime motivates the need for an exact characterization of Trotterization errors, so far known only through qualitative bounds. Here we derive such a characterization in the exactly solvable degenerate limit, valid for arbitrary coupling strength. The first-order Trotter operator admits a closed expression, showing that the generated phase-space trajectory lies exactly on a circle that is rescaled and rigidly rotated with respect to the exact one, rather than merely approximating it. This geometric renormalization yields a closed form for the state fidelity, structurally identical to the physical survival probability governing revivals in the deep strong coupling regime: both are the same geometric question -- the distinguishability of a displaced Fock state -- applied to two different pairs of points in phase space. We further show that this geometric error is exactly correctable by promoting the Trotter-step coupling to a complex amplitude, at no additional circuit cost. These results, obtained in the exactly solvable degenerate limit, provide a benchmark for Trotterization errors in the general Rabi model.", "url": "https://arxiv.org/abs/2609.36861", "type": "理论+数值", "summary": "1. 深度强耦合状态下量子拉比模型的数字量子模拟激发了对 Trotterization 误差精确表征的需求，迄今为止，这些误差只能通过定性界限来了解。\n2. 这些结果是在精确可解的简并极限下获得的，为一般 Rabi 模型中的 Trotterization 误差提供了基准。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "I. Lizuain"}, {"name": "A. Rodriguez-Prieto"}], "featured_authors": [{"name": "I. Lizuain"}, {"name": "A. Rodriguez-Prieto"}], "author_count": 2}, {"id": "2609.36874", "category": "quant-ph", "title": "Closing a single-copy gap to the Holevo bound with two-copy measurements", "abstract": "The Holevo Cramér-Rao bound sets the asymptotically attainable precision of quantum multiparameter estimation, but its attainability with finite quantum state copies remains unresolved in general. While a gap between the single-copy optimum and the Holevo bound persists at any finite copy number for two-parameter estimation models, the higher-parameter case has remained open. Here we disprove universal finite-copy gap persistence beyond two parameters by constructing a three-parameter rank-two model whose Holevo bound is unattainable with one copy but attained exactly with two. We further prove finite-copy persistence for full-rank models with any number of parameters. We then experimentally implement the two-copy collective measurement for the constructed model using superconducting qubits. We observe a two-copy estimation error below the single-copy and separate-measurement bounds determined from state tomography. By introducing controlled depolarization, we show that this precision advantage persists over a finite noise range. Our results connect the attainability of ultimate quantum precision to the structure of the multiparameter estimation model and the resources available for collective measurements.", "url": "https://arxiv.org/abs/2609.36874", "type": "实验", "summary": "1. 该工作构造三参数秩二模型，使Holevo界单拷贝不可达、双拷贝精确可达，并证明满秩模型任意参数数仍存在有限拷贝间隙。\n2. 其核心卖点是用超导量子比特实现该模型的双拷贝集体测量，误差低于单拷贝与分离测量界，并在有限退极化噪声内保持优势。\n3. 这将终极量子精度的可达性联系到多参数量子估计模型结构与集体测量资源，为有限拷贝策略提供启发。", "summary_source": "deepseek", "authors": [{"name": "Changhao Li"}], "featured_authors": [{"name": "Changhao Li"}], "author_count": 1}, {"id": "2609.36901", "category": "quant-ph", "title": "Digital Twin Modeling of Quantum Dynamical Systems: Dissipative Quantum Reservoir Computing", "abstract": "Modeling the response of driven many-body quantum systems from input--output data is difficult: the dynamics are nonlinear, history dependent, and expensive to simulate as system size grows. A paradigmatic case is High-Harmonic Generation~(HHG), where a strong field drives a medium to emit radiation that is highly sensitive to the drive and encodes long-range temporal correlations. We introduce a dissipative quantum reservoir computing~(DQRC) framework that builds a digital twin of such a system, learning its input--output map directly from data while the reservoir---itself a small open quantum system---stays fixed and only a classical readout is trained. We show that a minimal single-qubit reservoir reproduces the HHG response of a substantially larger Ising spin chain, and on a representative benchmark matches and on several metrics surpasses previously reported temporal convolutional and Kolmogorov--Arnold-network models, while using a simpler, physically realizable system. A single fixed reservoir further generalizes across a broad range of drives, indicating that it learns a shared physical response structure rather than memorizing trajectories. These results establish dissipative quantum reservoirs as compact, physically grounded digital twins for nonlinear, memory-dependent quantum dynamics. Code is available at \\href{ this https URL }{ this https URL }.", "url": "https://arxiv.org/abs/2609.36901", "type": "理论", "summary": "1. 提出耗散量子储备池计算框架，由输入-输出数据为强驱动多体量子系统（如高次谐波产生）构建数字孪生。\n2. 仅训练经典读出；固定的小型开放量子储备池中，单量子比特储备池即可复现更大伊辛链的高次谐波响应，并匹配或超越时序卷积与KAN基准。\n3. 该固定储备池在广泛驱动范围泛化，表明其学到共享物理响应结构而非记忆轨迹，为非线性、具记忆的量子动力学提供了紧凑且物理可实现的数字孪生。", "summary_source": "deepseek", "authors": [{"name": "Abhijit Sen"}, {"name": "Bikram Keshari Parida"}, {"name": "Shital Chauhan"}, {"name": "Mahima Arya"}, {"name": "Denys I. Bondar"}], "featured_authors": [{"name": "Abhijit Sen"}, {"name": "Bikram Keshari Parida"}, {"name": "Shital Chauhan"}, {"name": "Mahima Arya"}, {"name": "Denys I. Bondar"}], "author_count": 5}, {"id": "2609.36908", "category": "quant-ph", "title": "Exact quantum algorithm for searching of multiple sets intersection", "abstract": "Grover's algorithm achieves a quadratic speedup for unstructured search when a global oracle for the target set is available. However, its success probability is generally below $100\\%$. To overcome this issue, Long presented a modified version of Grover's search algorithm by introducing a phase-matching condition, which can search for the target set with zero theoretical failure rate. Nevertheless, in many applications, the target set is determined by the intersection of multiple constrained sets. Most existing Grover-based methods are limited to the intersection of only two sets and are not always successful in searching for the target set. In this work, based on Long's method, we propose an algorithm for exactly searching the intersection of multiple sets. We derive and prove a phase-matching condition for searching the intersection exactly. Furthermore, we present a quantum circuit that implements exact intersection search. Finally, we support our theoretical results with numerical simulations.", "url": "https://arxiv.org/abs/2609.36908", "type": "数值", "summary": "1. 该工作基于龙氏相位匹配型格罗弗搜索，提出并构造了精确搜索多个集合交集的量子算法，并给出相位匹配条件、量子线路及数值模拟验证。\n2. 其核心卖点在于将龙氏方法从单一目标或两集合交集推广到多集合交集，并证明可实现理论失败率为零的精确搜索，突破了多数格罗弗类方法仅限两集合且成功率不足的限制。\n3. 这为多约束集合交集搜索提供了可扩展的精确算法框架，并启发后续在量子线路实现、数值模拟及更广泛搜索问题中的推广与验证。", "summary_source": "deepseek", "authors": [{"name": "Sheng-Ao Mao"}, {"name": "Lin Zhang"}, {"name": "Bo Li"}], "featured_authors": [{"name": "Sheng-Ao Mao"}, {"name": "Lin Zhang"}, {"name": "Bo Li"}], "author_count": 3}, {"id": "2609.37091", "category": "quant-ph", "title": "Quantum Query Lower Bounds for Triangle-Listing and Spanners", "abstract": "This paper gives quantum query lower bounds for two relational graph problems, triangle listing and explicit multiplicative spanner construction, in the general graph query model, where quantum adjacency, degree and neighborhood queries are all available in arbitrary superposition. Both results are obtained by reductions via intermediate multi-block search problems. We extend the quantum query recording framework by Zhandry (CRYPTO 2019) and Hamoudi and Magniez (ToCT 2023) to handle a recording architecture for bidirectional oracles and give a generic blockwise soundness framework, which for arbitrary families of local accepting projectors, gives an exact operator-norm characterization of their maximum overlap with the subspace of bounded weight records. Using the intermediate search problems, we exhibit a family of $n$-vertex graphs with $\\Theta(n)$ triangles on which listing any constant fraction of the triangles requires $\\Omega(n^{3/2-o(1)})$ quantum queries. This is the first nontrivial quantum lower bound for triangle listing, a question raised by Jiang and Peng (ICML 2026). Further, we show that, for every fixed $k\\ge 7$, constructing a multiplicative $k$-spanner requires $\\Omega(n^{1+\\frac{1}{2\\mu_k}})$ quantum queries, where $\\mu_k=k/3+O(1)$. For $k\\in\\{7,8\\}$ the bound is $\\Omega(n^{5/4})$, which matches what would be implied by an unproven instance of the Erdős girth conjecture, and for large $k$ the exponent $1+\\frac{3}{2k}$ exceeds the $1+\\frac{4}{3k}$ implied by the provable high girth dense graphs due to Lazebnik, Ustimenko and Woldar, 1995.", "url": "https://arxiv.org/abs/2609.37091", "type": "理论", "summary": "1. 本文给出了一般图查询模型中两个关系图问题（三角形列表和显式乘法扳手构造）的量子查询下界，其中量子邻接、度和邻域查询都可以任意叠加。\n2. 此外，我们还表明，对于每个固定的 $k\\ge 7$，构建乘法 $k$-spanner 需要 $\\Omega(n^{1+\\frac{1}{2\\mu_k}})$ 量子查询，其中 $\\mu_k=k/3+O(1)$。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Yu Chen"}, {"name": "Ananta Mukherjee"}, {"name": "Mingyang Yang"}], "featured_authors": [{"name": "Yu Chen"}, {"name": "Ananta Mukherjee"}, {"name": "Mingyang Yang"}], "author_count": 3}, {"id": "2609.37101", "category": "quant-ph", "title": "Minimal building blocks for molecular quantum circuits with exact spin symmetry", "abstract": "Preserving particle number and spin helps quantum circuits target molecular electronic states, but does not guarantee access to every state with the required quantum numbers. We determine which additional operations, combined with spin-independent orbital rotations connecting all spatial orbitals, generate every real state-space rotation within each complete subspace of fixed particle number $N$, total spin $S$, and spin projection $M_S$. We consider spin-free molecular calculations in real orbitals, without an additional spatial-symmetry restriction, and continuously tunable operations that preserve particle number, full spin symmetry, and real amplitudes. Below the maximal-spin limits set by the electron and hole numbers, repeated singlet-pair transfer between any two fixed spatial orbitals is sufficient. On nontrivial maximal-spin boundaries, pair transfer vanishes, and an additional generator built from one- and two-electron terms is sufficient exactly when its action in the target subspace is not a linear combination of orbital-rotation generators. The minimum number of spatial orbitals needed by one additional generator is two in the interior and three on nontrivial boundaries, even when terms involving more than two electrons are allowed. Both minima are attained using only one- and two-electron terms. The three-orbital optimum rotates two orbitals according to the occupation of a third, and its unitary factors exactly into eight commuting Pauli rotations. Molecular benchmarks show that this operation removes the observed boundary energy-error plateaus, while sparse interior constructions attain the prescribed energy accuracy with fewer compiled CNOT gates in selected fixed-orbital comparisons.", "url": "https://arxiv.org/abs/2609.37101", "type": "理论+数值", "summary": "1. 保留粒子数和自旋有助于量子电路瞄准分子电子态，但不能保证访问具有所需量子数的每个状态。\n2. 即使允许涉及两个以上电子的项，一台附加发生器所需的空间轨道的最小数量在内部为两个，在非平凡边界上为三个。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Mengwei Liu"}, {"name": "Zhenyu Li"}], "featured_authors": [{"name": "Mengwei Liu"}, {"name": "Zhenyu Li"}], "author_count": 2}, {"id": "2609.37136", "category": "quant-ph", "title": "Arbitrary high-dimensional entanglement purification with the superposition of paths", "abstract": "High-dimensional quantum entanglement offers significant advantages over its two-dimensional counterparts in various quantum information processing tasks. We propose a scalable method for implementing an arbitrary high-dimensional entanglement purification protocol (HDEPP) using path superposition. By selecting appropriate single-qudit gates, qudit-flip errors and phase-flip errors can be purified. Counterintuitively, the HDEPP becomes more robust for higher-dimensional systems and exhibits enhanced purification fidelity as the dimension increases. Our HDEPP not only requires fewer operational resources but also in principle can achieve unity fidelity through multiple rounds of iteration. Furthermore, we develop feasible optical schemes to purify the frequency degree of freedom of photons suffering from qudit-flip and phase-flip errors using hyperentanglement. This work paves the way toward high-dimensional quantum communication and quantum networks.", "url": "https://arxiv.org/abs/2609.37136", "type": "理论", "summary": "1. 该工作提出一种基于路径叠加的可扩展任意高维纠缠纯化协议，可纯化高维量子态翻转与相位翻转错误。\n2. 其卖点在于选择合适高维量子门即可纯化两类错误，且维度越高鲁棒性与保真度反而提升，资源更少并可迭代至单位保真度。\n3. 该工作还给出利用超纠缠纯化光子频率自由度的可行光学方案，为高维量子通信与量子网络铺路。", "summary_source": "deepseek", "authors": [{"name": "Zi-Han Zheng"}, {"name": "Wen-Qiang Liu"}, {"name": "Chen-Ming Bai"}, {"name": "Hai-Rui Wei"}], "featured_authors": [{"name": "Zi-Han Zheng"}, {"name": "Wen-Qiang Liu"}, {"name": "Chen-Ming Bai"}, {"name": "Hai-Rui Wei"}], "author_count": 4}, {"id": "2609.37206", "category": "quant-ph", "title": "Optimal Entanglement Routing in Quantum Repeater Chains: Beyond Fixed Operation Order and Purification Schedule", "abstract": "Entanglement routing establishes entangled pairs between distant nodes of a quantum network by purifying and swapping pairs generated on elementary links. Existing methods typically restrict the decision space along two axes: the operation order, often fixed to purify-then-swap (PtS), and the purification schedule of each link, often restricted to pumping. Focusing on linear repeater chains with finite link capacities, we relax both restrictions and study the maximization of the expected end-to-end throughput subject to a fidelity threshold under two quantum-noise models. We develop a unified capacity-aware optimization framework comprising an exact mixed-integer linear program (MILP) under PtS, instantiated with either pumping or general tree purification schedules, and an exact dynamic program (DP) over arbitrary operation orders. Under symmetric Pauli noise, we prove that pumping converges to a fidelity strictly below unity, imposing a capacity-independent feasibility bound and a maximum chain length on every pumping-based PtS method, whereas general tree schedules yield a capacity-dependent bound. We further prove that post-swap purification never increases the throughput, so a free operation order can only increase feasibility. Numerical evaluations confirm the bounds: tree schedules serve over 90\\% of the requests that pumping cannot at moderate fidelity thresholds; within the pumping class, a free operation order recovers much of this advantage; but once links use tree schedules, the tree-based MILP and the order-exact DP serve identical request sets throughout. Operation order and purification schedule are thus substitutes, with the purification schedule the dominant factor governing feasibility under symmetric Pauli noise.", "url": "https://arxiv.org/abs/2609.37206", "type": "理论+数值", "summary": "1. 该工作研究有限链路容量的线性量子中继链，在保真度阈值下最大化端到端期望吞吐，并放宽固定操作顺序与净化调度。\n2. 其卖点是容量感知的精确优化框架：净化后交换下用混合整数线性规划支持泵浦或树形净化，任意顺序由动态规划求解。\n3. 这表明对称泡利噪声下泵浦保真度收敛低于1限制可行性，交换后净化无益，且顺序与调度互为替代、调度主导。", "summary_source": "deepseek", "authors": [{"name": "Aikaterini Mandilara"}, {"name": "Antonia Tsili"}, {"name": "Dimitris Syvridis"}, {"name": "Konstantinos Christodoulopoulos"}], "featured_authors": [{"name": "Aikaterini Mandilara"}, {"name": "Antonia Tsili"}, {"name": "Dimitris Syvridis"}, {"name": "Konstantinos Christodoulopoulos"}], "author_count": 4}, {"id": "2609.37207", "category": "quant-ph", "title": "Near-Optimal Quantum Algorithm and Complexity Analysis for Riccati Problems", "abstract": "We develop quantum algorithms that construct block-encodings of solution matrices for continuous- and discrete-time algebraic Riccati equations (CAREs and DAREs), differential Riccati equations (DREs), and finite Riccati recursions. The Quantum Weighted Riesz Method, unifying four kinds of Riccati problems, constructs projectors onto the solution graphs using weighted Riesz branching operators and recovers the solution matrices. Under the stated access and normalization assumptions, our algorithms for CAREs and DAREs have near-optimal query complexity $\\Theta(\\mathcal R\\alpha)$ up to logarithmic factors, with the generalized singularity factor $\\mathcal R$ that reflects spectral separation, and the output normalization $\\alpha$. For DREs and finite-horizon problems, the query complexity has an additional initialization conditioning factor $\\kappa_{\\rm init}$. We establish product query lower bounds for specified input-oracle families, demonstrating necessary joint dependence on spectral separation and initialization or output scale. We also prove that selected-value promise problems are BQP-complete on explicit circuit-generated families of single-control discrete-time algebraic and zero-terminal differential Riccati equations. Applications include classical feedback evaluation for linear-quadratic control, a query-complexity comparison for stable random-phase approximation Riccati equations in quantum chemistry, and heated boundary control with numerical validation.", "url": "https://arxiv.org/abs/2609.37207", "type": "理论+数值", "summary": "1. 该工作为连续与离散代数Riccati方程、微分Riccati方程及有限Riccati递推四类问题发展了量子算法，可构造解矩阵的块编码并恢复解矩阵。\n2. 其核心是统一的量子加权Riesz方法，用加权Riesz分支算子构造解图投影，在给定访问与归一化假设下对CAREs/DAREs达到忽略对数因子的近最优查询复杂度Θ(Rα)，并给出乘积查询下界及BQP完全性结果。\n3. 这为线性二次控制的反馈计算、量子化学中稳定随机相近似Riccati方程的比较以及热边界控制等提供了可验证的量子加速路径与复杂度基准。", "summary_source": "deepseek", "authors": [{"name": "Jingyao Wang"}, {"name": "Yanqiao Wang"}, {"name": "Bowen Li"}, {"name": "Jin-Peng Liu"}, {"name": "Zhengfeng Ji"}], "featured_authors": [{"name": "Jingyao Wang"}, {"name": "Yanqiao Wang"}, {"name": "Bowen Li"}, {"name": "Jin-Peng Liu"}, {"name": "Zhengfeng Ji"}], "author_count": 5}, {"id": "2609.37210", "category": "quant-ph", "title": "Encoding and Node Choices in Transversal Fault-Tolerant Distributed Quantum Computations: An Initial Study", "abstract": "We compare and study different Bivariate-Bicycle (BB) encodings and node choices for distributed quantum operations such as transversal non-local CNOTs. We observe that while some encodings have more physical qubits requiring more ebits for a distributed computation, reducing ebit consumption alone might not be the best criterion for selecting an encoding for the logical qubits, if the goal is to reduce the logical error rate of the distributed computation; for example, one should also consider encodings with a larger distance, which using more physical qubits can provide. We consider distributed, or non-local, CNOTs and computation of the global gate (GCZ) over distributed logical qubits as examples. The choice of encoding enables particular concurrent operations; e.g., we show that a transversal physical GCZ on a self-dual $[[120,8,12]] BB$ code can realize eight concurrent logical GCZ operations after accounting for the logical permutation induced by transversal Hadamard.", "url": "https://arxiv.org/abs/2609.37210", "type": "理论", "summary": "1. 该工作初步比较了用于分布式横向容错量子计算的双变量自行车（BB）码编码与节点选择，考察横向非局域CNOT及分布式逻辑量子比特上的全局门GCZ等操作。\n2. 其核心发现是：编码所需物理量子比特与ebit消耗并非唯一判据，减少ebit可能不利于降低逻辑错误率，应同时考虑更大码距等编码特性。\n3. 以自对偶[[120,8,12]] BB码为例，横向物理GCZ结合Hadamard诱导的逻辑置换可实现八个并发逻辑GCZ，表明编码选择可支持特定并行操作并启发后续分布式容错方案。", "summary_source": "deepseek", "authors": [{"name": "Seng W. Loke"}], "featured_authors": [{"name": "Seng W. Loke"}], "author_count": 1}, {"id": "2609.37231", "category": "quant-ph", "title": "Ultra-high-distance quantum memories from amplified qLDPC codes", "abstract": "A large code distance does not by itself guarantee a well-protected quantum memory, as faults during syndrome extraction can propagate into correlated data errors. Certifying circuit distance becomes demanding as circuits grow. In this work, we introduce distance amplifiers, a modular approach to increasing both code distance and certified circuit-level protection in quantum low-density parity-check codes. The construction tensors a base code with an amplifier, adapting their syndrome-extraction circuits to the amplified code. To certify the resulting memory, we develop a fault-response certificate that yields rigorous lower bounds on circuit distance. Suitable gate ordering and flag qubits control correlated errors, allowing us to establish explicit conditions under which the amplified circuit distance equals the product of the constituent circuit distances. We prove this multiplicative relation for three types of amplifiers: the flagged $[[4,2,2]]$, hypergraph-product, and rotated surface codes. The certificate extends recursively, so the circuit distance multiplies exactly at every amplification step. For example, four successive applications of the flagged $[[4,2,2]]$ amplifier to a $[[18,4,4]]$ seed yield a $[[13320,64,64]]$ code with the circuit distance $d_{\\mathrm{circ}} \\geq 48$ and check weights $w \\leq 14$. We further show how individual logical qubits can be tracked explicitly through amplification. By enabling high-distance quantum memories to be built and certified from smaller building blocks, our framework offers a systematic route toward scalable fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2609.37231", "type": "理论", "summary": "1. 该工作提出“距离放大器”这一模块化方案，通过将基码与放大器张量积并适配综合征提取线路，构造并认证超高码距的量子LDPC存储器。\n2. 其核心是故障响应证书，可对电路级距离给出严格下界；结合门序与旗标比特抑制关联错误，证明旗标、超图积与旋转表面码三类放大器下电路距离等于各组成电路距离之积，且可递归保持。\n3. 该框架使高码距量子存储器可由小码块构建并认证，例如以旗标[[4,2,2]]对[[18,4,4]]种子四次放大得到[[13320,64,64]]且d_circ≥48，为可扩展容错量子计算提供系统路径。", "summary_source": "deepseek", "authors": [{"name": "Zijian Liang"}, {"name": "Boren Gu"}, {"name": "Yu-An Chen"}, {"name": "Jens Eisert"}, {"name": "Zongyuan Wang"}], "featured_authors": [{"name": "Zijian Liang"}, {"name": "Boren Gu"}, {"name": "Yu-An Chen"}, {"name": "Jens Eisert"}, {"name": "Zongyuan Wang"}], "author_count": 5}, {"id": "2609.37240", "category": "quant-ph", "title": "Approximate majorization and high-order capacity of quantum depolarizing channels", "abstract": "A central challenge in quantum information theory is to determine whether entanglement provides an advantage for information processing when coherent operations across multiple channel uses are allowed. For depolarizing channels, King's proof of the additivity of the minimum output entropy rules out such an advantage for classical communication at leading asymptotic order, while leaving open the possibility of an advantage for higher orders. In this work, we conjecture a majorization relation for the outputs of depolarizing channels and prove an approximate version of this conjecture. Our proof combines an exact ordering of shifted log-determinants with an anti-concentration bound for the spectrum of the product-state output, refining King's analysis based on Schatten norms. As a direct application, we obtain a tight third-order expansion for the classical capacity of quantum depolarizing channels. Consequently, entangled codewords and collective decoding can improve the message size over the product-coding strategy by at most $O(\\log \\log n)$ bits, sharpening our understanding of the role of entanglement in the finite-blocklength regime.", "url": "https://arxiv.org/abs/2609.37240", "type": "理论", "summary": "1. 该工作研究退极化信道在多次相干使用下的高阶经典容量，提出输出态的主序化猜想并证明其近似版本，由此导出经典容量的紧致三阶展开。\n2. 其技术卖点在于结合平移对数行列式的精确排序与乘积态输出谱的反集中界，精化金氏基于沙滕范数的论证，从而获得三阶容量的紧致刻画。\n3. 该结果将纠缠码字与集体解码相对乘积编码的增益限制在双对数阶比特内，限定了纠缠在有限块长退极化信道经典通信中的优势，并为高阶容量与主序化分析提供启示。", "summary_source": "deepseek", "authors": [{"name": "Zhiwei Song"}, {"name": "Xin Wang"}, {"name": "Marco Tomamichel"}, {"name": "Kun Fang"}], "featured_authors": [{"name": "Zhiwei Song"}, {"name": "Xin Wang"}, {"name": "Marco Tomamichel"}, {"name": "Kun Fang"}], "author_count": 4}, {"id": "2609.37270", "category": "quant-ph", "title": "Directional transfer from coherence to longitudinal polarization and algebraic storage in a transmon with Markovian dephasing and a glassy environment: A non-Markovian fractional renewal model", "abstract": "We develop a completely positive and trace-preserving non-Markovian transmon model with longitudinal Markovian dephasing and transverse renewal events motivated by a glassy two-level-system environment. A microscopic Hamiltonian identifies coupling subspaces; a normalized Prabhakar waiting-time law phenomenologically coarse grains slow defect reconfigurations. Forward chronological renewal histories yield an exact map-level Volterra equation, a noncommuting kernel--resolvent master equation, and an equivalent drift-conjugated Caputo-type representation with its required initial-value term. Without energy relaxation, Pauli-space dynamics splits into two one-dimensional subspaces and a coupled $(\\sigma_y,\\sigma_z)$ subspace supporting directional transfer between coherence and longitudinal polarization; $\\sigma_x$ polarization is renewal-insensitive. For heavy-tailed waiting times with $0<\\alpha<1$, branch-cut analysis gives a generic $t^{-\\alpha}$ storage tail in longitudinal polarization generated from initial coherence and $O(t^{-1-\\alpha})$ reverse transfer; constant-rate Poisson renewal yields pole-generated exponential decay. Independent zero-temperature relaxation at finite $T_1$ exponentially cuts off these tails when its rate is below twice the pure-dephasing rate. We compare independent inverse-Laplace reconstructions of the waiting-time density, memory kernel, and selected qubit-response components to assess numerical accuracy. For the studied parameters, Prabhakar renewal gives larger forward-transfer magnitudes at the prescribed readout than both a scale-matched constant-rate Poisson reference and an inhomogeneous Poisson reference matching the full expected-count profile, including finite-$T_1$ tests. Both Poisson references yield larger evaluated finite-window peaks. Disorder-motivated renewal memory reshapes transmon decoherence selectively by state and direction.", "url": "https://arxiv.org/abs/2609.37270", "type": "理论+数值", "summary": "1. 我们开发了一个完全正向且保留痕迹的非马尔可夫传输模型，具有由玻璃两级系统环境驱动的纵向马尔可夫相移和横向更新事件。\n2. $\\sigma_x$ 极化对更新不敏感。\n3. 当其速率低于纯相移速率的两倍时，有限 $T_1$ 下的独立零温度弛豫会以指数方式切断这些尾部。", "summary_source": "local-fallback", "authors": [{"name": "Ruha Uğraş Erdoğan"}, {"name": "Ferit Acar Savacı"}], "featured_authors": [{"name": "Ruha Uğraş Erdoğan"}, {"name": "Ferit Acar Savacı"}], "author_count": 2}, {"id": "2609.37296", "category": "quant-ph", "title": "Parametric DRAG for leakage-suppressed exchange gates in superconducting qubits", "abstract": "Programmable exchange interactions support quantum gates and many-body simulation in superconducting circuits. Fast excitation transfer, however, opens two leakage pathways in weakly anharmonic transmons, degrading gates and driving simulated dynamics outside the encoded state space. We introduce parametric derivative removal by adiabatic gate (PDRAG) to suppress both pathways while preserving the target exchange. Their conjugate structure determines first- and second-derivative corrections implemented through one real frequency command. At $g/2\\pi=100$ MHz, calibrated PDRAG achieves a geometric-mean leakage reduction of $5.27\\times10^5$ relative to the base pulse across 12.5--35 ns in Duffing simulations. At 13 ns, endpoint leakage reaches $1.98\\times10^{-7}$ for the calibrated full-exchange pulse. Transferring the derivative coefficients to a charge Hamiltonian gives a mean 893-fold reduction over 12.5--22 ns after amplitude and carrier recalibration. Floquet return interference and charge-induced gap shifts explain the calibration and transfer gains, connecting compact pulse design to leakage-suppressed programmable interactions.", "url": "https://arxiv.org/abs/2609.37296", "type": "理论+数值", "summary": "1. 提出参数化DRAG（PDRAG）方案，用于超导量子比特交换门，抑制弱非谐transmon中快速激发转移的两条泄漏路径并保持目标交换。\n2. 卖点是用两路径共轭结构将一、二阶导数修正编码为单一实频率指令，Duffing模拟中12.5–35 ns泄漏几何平均降低5.27×10^5。\n3. Floquet回返干涉与电荷诱导能隙移动解释了校准与迁移增益，表明紧凑脉冲设计可支撑泄漏抑制的可编程交换相互作用。", "summary_source": "deepseek", "authors": [{"name": "Yiwen Li"}, {"name": "Xinsheng Tan"}, {"name": "Yang Yu"}], "featured_authors": [{"name": "Yiwen Li"}, {"name": "Xinsheng Tan"}, {"name": "Yang Yu"}], "author_count": 3}, {"id": "2609.37318", "category": "quant-ph", "title": "A magnetic-field insensitive gate set for trapped-ion nuclear spin qubits", "abstract": "We outline a complete set of operations for manipulating nuclear spin qubits of trapped-ions stored in high magnetic fields such as required for Penning trapping, where the nuclear and electron spins are largely decoupled due to the dominance of the external field Hamiltonian. The reduced nuclear magnetic moment results in insensitivity to external magnetic fields compared to the use of an electron spin, but also makes the nuclear spin hard to manipulate on fast timescales. To maintain speed, we propose a two-qubit phase gate technique which utilizes the electron spin, but for which the qubit remains protected from magnetic fields through retaining the nuclear encoding. This method works for magnetic-field insensitive qubits at lower fields as well as for both microwave and laser field gradients.", "url": "https://arxiv.org/abs/2609.37318", "type": "理论", "summary": "1. 该工作提出了一套用于在高磁场（如彭宁阱所需）中操纵囚禁离子核自旋量子比特的完整门操作集合，其中核自旋与电子自旋因外场主导而基本解耦。\n2. 其核心卖点是用电子自旋实现双量子比特相位门以维持操作速度，同时保留核自旋编码使量子比特免受磁场影响，且兼容较低磁场及微波与激光场梯度。\n3. 这为在高磁场、尤其彭宁阱环境下实现抗磁场且快速可控的核自旋量子逻辑提供了可行方案，并可启发对磁场不敏感量子比特的门设计。", "summary_source": "deepseek", "authors": [{"name": "Jonathan Paul Home"}, {"name": "Jeremy Flannery"}, {"name": "Matteo Mazzanti"}, {"name": "Jan Apolin"}, {"name": "Shreyans Jain"}], "featured_authors": [{"name": "Jonathan Paul Home"}, {"name": "Jeremy Flannery"}, {"name": "Matteo Mazzanti"}, {"name": "Jan Apolin"}, {"name": "Shreyans Jain"}], "author_count": 5}, {"id": "2609.37368", "category": "quant-ph", "title": "A Memory-Magic Exchange Law in Streaming Clifford+T Compilation", "abstract": "A phase that reaches a fault-tolerant processor in additive pieces can be remembered until the last piece arrives, or executed on arrival: the first option costs classical memory carried across rounds, the second costs magic states committed before the phase is known. We determine the exchange rate $\\alpha$, committed $T$ gates per bit of memory forgone, for ancilla-free coordinatewise Clifford+$T$ compilation. The Ramanujan bound for the Clifford+$T$ lattice gives $\\alpha\\ge2$ with explicit constants, the square-root barrier of the spectral method. An elementary determinant method, using that quaternion numerators are lattice points on spheres in both real embeddings of $\\mathbb{Q}(\\sqrt2)$, counts words near an arbitrary rotation coset below that barrier and gives $\\alpha\\ge11/5$ asymptotically and unconditionally, and a height dichotomy for the resulting sphere sections raises this to $\\alpha\\ge17/7$. At Clifford-framed cosets the volume law holds up to subexponential factors: all but a vanishing fraction of $z$-rotations need $T$-count $(3-o(1))\\log_2(1/\\varepsilon)$, and processes whose committed pieces are close to Clifford-framed $z$-rotations, including per-rotation pipelines, have $\\alpha\\ge3-o(1)$, which a fractional-passthrough family attains under the Ross-Selinger typical-cost hypothesis. Under an equidistribution conjecture supported by exhaustive enumeration to $T$-count 22, $\\alpha=3$ in general and memory should be shed in whole rotations. The bounds hold even when the phases cancel to the identity; side information enters through a conditional entropy; probabilistic mixing halves the costs but not the rate. With clean ancillas and a phase-gradient catalyst, table lookups batched across coordinates drive the rate to $O(1/\\log\\log(1/\\varepsilon))$, so the constant-rate law is specific to coordinatewise synthesis.", "url": "https://arxiv.org/abs/2609.37368", "type": "理论", "summary": "1. 该工作研究无辅助比特、逐坐标 Clifford+T 流式编译中经典内存与已承诺 T 门之间的交换律，确定交换率 α 为每省一比特内存所付出的已承诺 T 门数。\n2. 其技术卖点是用 Ramanujan 界与基于四元数分子在 Q(√2) 两个实嵌入中球面点格的初等行列式计数，无条件下界从 α≥2 升至 α≥11/5，再经高度二分法达 α≥17/7；对 Clifford 框架陪集与逐旋转流水线则得 α≥3−o(1)，并在均匀分布猜想下预言一般 α=3。\n3. 该交换律在相位相消至恒等时仍成立，侧信息通过条件熵进入；然而引入干净辅助比特与相位梯度催化剂并跨坐标批量查表后，速率降至 O(1/log log(1/ε))，说明恒定交换率是逐坐标合成特有的。", "summary_source": "deepseek", "authors": [{"name": "Jinze Yang"}, {"name": "Yangyang Li"}, {"name": "Xiu-Hao Deng"}], "featured_authors": [{"name": "Jinze Yang"}, {"name": "Yangyang Li"}, {"name": "Xiu-Hao Deng"}], "author_count": 3}, {"id": "2609.37375", "category": "quant-ph", "title": "Consistent histories and the ultrametric on infinite tensor products", "abstract": "The consistent histories formulation of quantum mechanics assigns classical probabilities to sequences of coarse-grained events when the corresponding interference terms vanish. In finite models these terms generically need not vanish exactly, and their smallness alone supplies no asymptotic geometry on the space of histories. We construct such a geometry for histories that accumulate quantum records. When the normalized Dowker - Halliwell interference between two histories factorizes as the cumulative fidelity of their records, its decay is controlled by the accumulated squared Bures distance. In the infinite registration limit, the Kakutani - von Neumann dichotomy gives a sharp sector alternative: summable Bures defect yields weakly equivalent record sequences, whereas nonsummable defect produces orthogonal superselection sectors and vanishing normalized interference. The convergence exponent of the Bures defect defines a pseudo-ultrametric on histories. After quotienting its zero distance degeneracy, it becomes a complete ultrametric, requiring neither compactness of the outcome space nor continuity of the record family, and coincides with the gauge invariant sector metric $\\tilde d$ introduced in \\cite{LesTP}. Its value, the \\emph{consistency rate}, has three equivalent interpretations: it is the sector separation metric, the polynomial growth exponent of the negative logarithm of normalized interference, and, by the Helstrom formula, the corresponding exponent of the negative logarithm of the minimum error probability for discriminating the cumulative records. Classical separation profiles determine the rate: positive long time mean defect gives the maximal value $\\delta=1$, while the borderline profile $d_m^2\\asymp m^{-1}$ produces distinct superselection sectors at zero polynomial rate, $\\delta=0$.", "url": "https://arxiv.org/abs/2609.37375", "type": "理论", "summary": "1. 该工作在无限张量积中为累积量子记录的相干历史构造渐近几何，用Bures缺陷收敛指数定义伪超度量并在商去零距离后得到完备超度量。\n2. 其核心是Kakutani-von Neumann二分：可加Bures缺陷给出弱等价，不可加则产生正交超选择扇区，且一致性速率统一扇区距离、干涉衰减与Helstrom误差指数。\n3. 这揭示经典分离剖面决定该速率：正的长时平均缺陷给出δ=1，而d_m^2≍m^{-1}的边界情形在零多项式速率下仍产生不同超选择扇区。", "summary_source": "deepseek", "authors": [{"name": "Andrew Lesniewski"}], "featured_authors": [{"name": "Andrew Lesniewski"}], "author_count": 1}, {"id": "2609.37429", "category": "quant-ph", "title": "Succinct Arguments for QMA in the Quantum Random Oracle Model", "abstract": "Succinct arguments are a fundamental cryptographic primitive for verifying computational claims with small communication. In the classical setting, succinct arguments for NP can be constructed from unstructured hardness alone (e.g., hash functions) by compiling probabilistically checkable proofs (PCPs) or interactive oracle proofs (IOPs) for NP via the commit-and-open paradigm. In contrast, known succinct arguments for QMA rely on ``structured'' cryptographic primitives, or on the quantum PCP conjecture. We construct the first succinct argument for QMA in the quantum random oracle model (QROM) without relying on additional cryptographic assumptions or unproven conjectures. This yields succinct arguments for QMA from unstructured hardness alone, showing that ideal hash functions not only suffice for succinct arguments for NP but also for QMA. Underlying our result is an efficiency-preserving transformation that compiles quantum interactive oracle proofs (QIOPs), a recently introduced interactive generalization of quantum PCPs, into quantum arguments for the same language, via a natural quantum commit-and-open paradigm. Our transformation applies to every QIOP with public-query soundness, a notion that we formalize to capture a natural requirement of the commit-and-open paradigm and is satisfied by a known QIOP for QMA. As a key ingredient in our transformation, we formalize and construct extractable vector commitments for quantum states with local openings in the QROM, which may be of independent interest.", "url": "https://arxiv.org/abs/2609.37429", "type": "理论", "summary": "1. 该工作构造了量子随机预言机模型(QROM)中QMA的首个简洁论证，无需额外密码学假设或未证明猜想，仅基于非结构化困难性，将理想哈希函数对NP的支撑扩展至QMA。\n2. 其核心是保持效率地将具公开查询可靠性的量子交互式预言证明(QIOP)经量子承诺-打开范式编译为同语言的量子论证，形式化该可靠性，并在QROM中构造带局部打开的提取型量子态向量承诺。\n3. 这为QMA简洁论证摆脱结构化原语和量子PCP猜想提供了直接路径，所引入的提取型向量承诺与公开查询可靠性概念也可能启发QROM中的其他量子证明编译。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Chiesa"}, {"name": "Zihan Hu"}], "featured_authors": [{"name": "Alessandro Chiesa"}, {"name": "Zihan Hu"}], "author_count": 2}, {"id": "2609.37467", "category": "quant-ph", "title": "An Operator-Norm Approach to Security with Quantum Advice", "abstract": "Non-uniform security allows an adversary to receive bounded advice about an oracle before attempting a fresh challenge. This captures the most realistic attacks and has already been studied extensively in prior work. In this work, we introduce an operator-norm approach for non-uniform security in the quantum random oracle and random permutation models. This new approach yields a unified reduction for both search success probability and distinguishing advantage. Previously, the reduction only worked with success probability even in the decision games, yielding a worse bound. Our framework enables tight bounds for Yao's box, both with and without salting, and improved bounds for pseudorandom generators. We also prove an optimal generic salting theorem for decision games. By defining a property of a game, which separates the contributions of the existing queries in the offline stage and subsequent online queries, we obtain stronger bounds for specific salted constructions. These include salted permutation inversion, tight up to logarithmic factors, and salted random-function inversion, tight up to logarithmic factors and the gap already present in classical function inversion.", "url": "https://arxiv.org/abs/2609.37467", "type": "理论", "summary": "1. 该工作引入算子范数方法，研究量子随机预言机和随机置换模型中带量子建议的非均匀安全性。\n2. 其卖点是将搜索成功概率与区分优势统一归约，并克服决策游戏中此前仅用成功概率导致的更差界。\n3. 该框架给出姚氏盒（含加盐）的紧界、伪随机生成器的改进界，以及决策游戏的最优通用加盐定理和特定加盐构造的更强界。", "summary_source": "deepseek", "authors": [{"name": "Minki Hhan"}, {"name": "Sunghyuk Jo"}, {"name": "Qipeng Liu"}], "featured_authors": [{"name": "Minki Hhan"}, {"name": "Sunghyuk Jo"}, {"name": "Qipeng Liu"}], "author_count": 3}, {"id": "2609.37527", "category": "quant-ph", "title": "Digital quantum state preparation by nucleation", "abstract": "Quantum state preparation is crucial for quantum algorithms, and improved state preparation methods can reduce resource requirements by orders of magnitude. In this work, we introduce a state preparation method for lattice Hamiltonians on digital quantum computers inspired by nucleation. In our method, the exact ground state of a small lattice Hamiltonian is prepared in a quantum circuit, then a series of growth stages are performed via Trotterized adiabatic evolution to increase the size of the lattice to the desired model. Using the adiabatic theorem and Trotter error bounds, we provide sufficient conditions on the total evolution time and number of Trotter steps required for nucleation to prepare an initial state with desired fidelity. In addition, we introduce optimized nucleation which considers variational optimization on top of the nucleation structure. For a two-dimensional Ising model, we show that optimized nucleation can outperform a current leading method for state preparation on digital quantum computers.", "url": "https://arxiv.org/abs/2609.37527", "type": "理论+数值", "summary": "1. 该工作提出一种受成核启发的数字量子计算机上晶格哈密顿量量子态制备方法，先制备小晶格精确基态再逐级生长。\n2. 其核心是用Trotter化绝热演化逐级扩大晶格，并借绝热定理与Trotter误差界给出达到目标保真度的充分条件。\n3. 在二维Ising模型中，叠加变分优化的优化成核法优于当前领先的数字量子态制备方法，并有望降低资源需求、启发后续算法设计。", "summary_source": "deepseek", "authors": [{"name": "Jean Paul Sadia"}, {"name": "Morten Hjorth-Jensen"}, {"name": "Dean Lee"}, {"name": "Ryan LaRose"}], "featured_authors": [{"name": "Jean Paul Sadia"}, {"name": "Morten Hjorth-Jensen"}, {"name": "Dean Lee"}, {"name": "Ryan LaRose"}], "author_count": 4}, {"id": "2609.37596", "category": "quant-ph", "title": "Semiclassical spin-bath calculation of the nitrogen-isotope effect on NV$^-$ ensemble coherence in diamond", "abstract": "The ratio $T_2$/$T_2^*$ of the Hahn-echo and Ramsey times of nitrogen-vacancy (NV$^-$) ensembles is independent of the nitrogen concentration [N] and is $\\approx$ 16 in diamond of natural isotopic abundance ($^{14}$N), yet a recent $^{15}$N-doped ensemble magnetometer gives only 8.05 $\\pm$ 0.18 in the single-quantum convention. We ask whether the nitrogen nuclear isotope alone can cause such a reduction. Using a semiclassical spin-bath model with the Jahn-Teller-resolved P1 hyperfine tensor, we show that the fraction of P1 pairs that are hyperfine-degenerate, and hence free to flip-flop, is 1/4 for $^{14}$N (I = 1) but 5/16 for $^{15}$N (I = 1/2). Simulations over [N] = 0.1--100 ppm confirm that this shortens $T_2$ while leaving $T_2^*$ exactly unchanged: $T_2$($^{14}$N)/$T_2$($^{15}$N) = 1.118 $\\pm$ 0.011, independent of [N] and 11$\\sigma$ above unity. The measured contrast, 2.07 $\\pm$ 0.25, is 3.8$\\sigma$ larger, identifying resonant-channel counting as a real but partial contribution and setting a quantitative benchmark for many-body calculations.", "url": "https://arxiv.org/abs/2609.37596", "type": "理论+数值", "summary": "1. 该工作用半经典自旋浴模型结合Jahn-Teller分辨的P1超精细张量，计算氮同位素对金刚石NV^-系综相干的影响。\n2. 其卖点是：超精细简并可自由翻转的P1对比例14N为1/4、15N为5/16，使T2缩短而T2*不变，T2比值1.118且不依赖[N]。\n3. 该机制只能部分解释同位素效应；实测对比度2.07±0.25比计算大3.8σ，表明共振通道计数是真实但非全部贡献，并为多体计算设定量基准。", "summary_source": "deepseek", "authors": [{"name": "Chikara Shinei"}], "featured_authors": [{"name": "Chikara Shinei"}], "author_count": 1}, {"id": "2609.37628", "category": "quant-ph", "title": "Operational theory for photonic circuits: generalizing linear optics beyond quantum theory", "abstract": "We use the analogy between the quadrature operators in quantum optics and the phase-space coordinates in a mechanical harmonic oscillator to generalise the theory of linear optics beyond quantum theory. For this, we introduce a framework for analysing photonic circuits within generalised probabilistic theories based on quadrature operators. Using this framework, we ask whether phenomena like the Hong-Ou-Mandel effect, Mach-Zehnder interferometry are specific to quantum theory or also occur across a broader class of theories. We find the latter: the vanishing photon coincidences at the output of a beam splitter also occur for classical light and for a modified version of quantised light. Similarly, for Mach-Zehnder interferometry we find that there is no qualitative difference between quantum theory and these alternative theories. Our framework can serve as a foundation to study generalised theories of complex photonic set-ups and photonic quantum computers.", "url": "https://arxiv.org/abs/2609.37628", "type": "理论", "summary": "1. 该工作将量子光学中的正交算符类比为机械谐振子的相空间坐标，在广义概率论中建立基于正交算符的光子线路操作框架，从而把线性光学推广到量子理论之外。\n2. 其关键发现是洪-欧-曼德尔效应与马赫-曾德尔干涉并非量子理论独有：分束器输出符合计数消失亦见于经典光及修正量子化光，干涉行为在量子理论与替代理论间无定性差异。\n3. 该框架为复杂光子装置和光子量子计算机的广义理论奠定基础，并提示需重新审视线性光学现象中哪些特征真正依赖量子理论。", "summary_source": "deepseek", "authors": [{"name": "Ismaël Septembre"}, {"name": "Matthias Kleinmann"}, {"name": "Martin Plávala"}], "featured_authors": [{"name": "Ismaël Septembre"}, {"name": "Matthias Kleinmann"}, {"name": "Martin Plávala"}], "author_count": 3}, {"id": "2609.37699", "category": "quant-ph", "title": "Constant-rate quantum codes with low-weight stabilizers and full logical Clifford actions via transversal and fold-transversal gates", "abstract": "Low-space-overhead fault-tolerant quantum computation requires not only high-rate quantum error-correcting codes but also space-efficient implementations of logical operations. Transversal and fold-transversal gates are promising since they limit error propagation and require no additional qubits. However, the logical operations they enable are typically restricted, and a central challenge is to construct codes that combine a complete set of logical Clifford gates with favorable code parameters. In this work, we introduce a family of quantum codes with an asymptotically constant encoding rate and sublogarithmically growing stabilizer weight, while supporting the entire logical Clifford group using only transversal and fold-transversal gates. Our construction is based on classical codes whose code spaces are absolutely irreducible Steinberg modules of their Tanner-graph automorphism groups. Taking hypergraph products of these classical codes yields quantum codes for which all logical Clifford operations can be synthesized from a fixed set of transversal and fold-transversal gates. Moreover, the slow growth of the stabilizer weight enables a high error-correcting performance in small instances. These results provide a path toward fault-tolerant quantum computation with low space overhead using transversal and fold-transversal gates.", "url": "https://arxiv.org/abs/2609.37699", "type": "理论", "summary": "1. 该工作构造了一族量子纠错码，具有渐近恒定的编码率、亚对数增长的稳定子权重，并仅用横向与折叠横向门即可实现完整的逻辑克利福德群。\n2. 其核心机制是将码空间为坦纳图自同构群的绝对不可约斯坦伯格模的经典码作超图积，从而把全部逻辑克利福德操作合成自固定门集，且低权重稳定子有利于小规模实例中的纠错性能。\n3. 这为以低空间开销和受限错误传播实现容错量子计算提供了一条可行路径，并提示代数模与超图积可为兼具高编码率和完整逻辑门集的码设计提供统一框架。", "summary_source": "deepseek", "authors": [{"name": "Takaya Matsuura"}, {"name": "Yohji Chin"}, {"name": "Shohei Kiryu"}, {"name": "Kosuke Fukui"}], "featured_authors": [{"name": "Takaya Matsuura"}, {"name": "Yohji Chin"}, {"name": "Shohei Kiryu"}, {"name": "Kosuke Fukui"}], "author_count": 4}, {"id": "2609.37802", "category": "quant-ph", "title": "Quantum Complexity of Ancilla-Free Unitary Embeddings for Nonlinear Dynamics via Generalized State-Dependent Double-Bracket Flows", "abstract": "Simulating nonlinear dynamics with quantum computers has gained increasing attention. In general, such simulations require additional quantum resources because unitary quantum evolution is linear. A fundamental question is how nonlinear dynamics can be embedded into fully coherent, ancilla-free unitary circuits and how the complexity of the dynamics governs the required quantum resources. In this work, we generalize the ancilla-free double-bracket quantum algorithm for imaginary-time evolution by replacing its state-independent Hamiltonian with a state-dependent Hermitian operator. Our framework recursively calls an initial state preparation oracle and its inverse, and prepares the target solution to any prescribed accuracy using a fully coherent, ancilla-free unitary embedding. We relate the query cost to the complexity of the nonlinear dynamics, specifically their sensitivity to initial conditions. We obtain query upper bounds of $\\exp(O(T))$, $\\exp(O(T^2))$, and $\\exp(\\exp(O(T)))$ when the distance between solutions contracts at least exponentially (contractive), does not increase (nonexpansive), or grows at most exponentially (expansive), respectively, where $T$ is the target evolution time. For the discrete Gross--Pitaevskii equation, our ancilla-free double-bracket circuit achieves optimal worst-case query complexity $\\Theta(e^{gT/2})$ over a specified family of single-qubit initial states, where $g>0$ is the nonlinearity strength. These results connect the complexity of nonlinear dynamics to the query cost of coherent quantum simulation and provide a foundation for designing ancilla-free unitary embeddings with optimal query complexity.", "url": "https://arxiv.org/abs/2609.37802", "type": "理论+数值", "summary": "1. 该工作将无辅助比特的 double-bracket 虚时间演化算法推广到状态依赖厄米算符，提出一种完全相干、无需辅助比特的幺正嵌入框架，用于制备非线性动力学目标解并分析其查询复杂度。\n2. 其核心在于递归调用初态制备 oracle 及其逆，以任意精度实现完全相干、无辅助比特的嵌入，并将查询成本与非线性动力学对初值敏感性关联：当解间距离至少指数收缩、不增长或至多指数增长时，查询上界分别为 exp(O(T))、exp(O(T^2)) 与 exp(exp(O(T)))。\n3. 对离散 Gross–Pitaevskii 方程，该电路在一类单量子比特初态上达到最优的最坏情形查询复杂度 Θ(e^{gT/2})，从而将非线性动力学复杂度与相干量子模拟查询成本相连，并为设计最优查询复杂度的无辅助幺正嵌入提供基础。", "summary_source": "deepseek", "authors": [{"name": "Yuki Ito"}, {"name": "Hideaki Hakoshima"}, {"name": "Keisuke Fujii"}], "featured_authors": [{"name": "Yuki Ito"}, {"name": "Hideaki Hakoshima"}, {"name": "Keisuke Fujii"}], "author_count": 3}, {"id": "2609.37900", "category": "quant-ph", "title": "A Neutral Atom-Based Hybrid Classical-Quantum Approach for the Entanglement Routing Problem", "abstract": "Efficient end-to-end entanglement distribution in quantum information networks requires routing under limited resources and fidelity constraints. We study entanglement routing as a fidelity-constrained unsplittable multicommodity flow problem that maximizes the number of admitted requests. As a proof of concept, we integrate neutral-atom quantum optimization into a hybrid classical--quantum column-generation framework. A classical restricted master problem selects routes, while a pricing problem generates fidelity-feasible paths. We formulate this NP-hard constrained shortest-path pricing problem as a quadratic unconstrained binary optimization (QUBO) problem and address it with hardware-aware register embedding and instance-driven pulse shaping. To our knowledge, this is the first study of neutral-atom quantum optimization as a pricing oracle for fidelity-constrained entanglement routing. On small benchmark instances evaluated with neutral-atom processor emulators, the method, combined with warm-start and post-processing, achieves an optimality gap below 1% across all tested sizes; the selected simulated-annealing route-generation baseline exhibits gaps of up to 6%. These results indicate that the generated bitstrings can provide useful candidate routes for classical refinement within column generation. This proof of concept does not establish quantum utility or scalability; further evaluation on larger instances, against stronger classical baselines, and on quantum hardware is needed.", "url": "https://arxiv.org/abs/2609.37900", "type": "理论+数值", "summary": "1. 该工作将保真度约束下的纠缠路由建模为最大化被接纳请求数的不可分割多商品流问题，并把中性原子量子优化嵌入经典-量子列生成框架。\n2. 其技术要点在于经典受限主问题负责选路，中性原子量子优化充当定价预言机生成保真可行路径，将NP-hard约束最短路径定价写成QUBO，并采用硬件感知寄存器嵌入和实例驱动脉冲整形。\n3. 在小规模基准的中性原子模拟器上，结合热启动与后处理可把最优性间隙压至1%以下，而所选模拟退火基线最高约6%；但该概念验证尚不证明量子效用或可扩展性，仍需在更大实例、更强经典基线与真实硬件上评估。", "summary_source": "deepseek", "authors": [{"name": "M. Yassine Naghmouchi"}, {"name": "Quentin Ma"}, {"name": "Agathe Blaise"}, {"name": "René Veyland"}, {"name": "Wesley Coelho"}], "featured_authors": [{"name": "M. Yassine Naghmouchi"}, {"name": "Quentin Ma"}, {"name": "Agathe Blaise"}, {"name": "René Veyland"}, {"name": "Wesley Coelho"}], "author_count": 5}, {"id": "2609.37999", "category": "quant-ph", "title": "Rapid Mixing of Parallel Kac's Walk: From Spheres to Stiefel Manifolds", "abstract": "Kac's walk is a classical local random walk whose action on a single real unit vector in dimension $d$ mixes in total variation in $\\Theta(d\\log d)$ sequential steps~\\cite{PS17}. Lu, Qin, Song, Yao, and Zhao introduced a parallel version of Kac's walk that mixes a single quantum state in $O(\\log d)$ rounds~\\cite{LQSY+26}. After discretizing the randomness and replacing it by suitable pseudorandom primitives, this parallel walk gives rise to pseudorandom state scramblers, and was subsequently shown to yield pseudorandom unitaries~\\cite{LQSY+25}. We study what happens when the parallel Kac's walk acts simultaneously on $k$ orthonormal quantum states. We prove that, for any $1\\leq k < d$, after $O\\!\\left((k+\\log d)\\log(d/\\varepsilon)\\right)$ steps, the joint distribution of the $k$ output states is $\\varepsilon$-close, in both Wasserstein and total variation distance, to that obtained by applying a common Haar-random unitary to the same inputs. This generalizes the dispersing property of the parallel Kac's walk from a single quantum state to multiple orthonormal quantum states. Equivalently, viewing an ordered collection of $k$ orthonormal states as a point on the complex Stiefel manifold $V_{d,k}=\\{X\\in\\mathbb C^{d\\times k}:X^\\dagger X=I_k\\}$, we show that the parallel Kac's walk mixes rapidly on $V_{d,k}$, with both Wasserstein and total variation mixing times bounded by $O\\!\\left((k+\\log d)\\log(d/\\varepsilon)\\right)$. This extends the Wasserstein mixing result of Pillai, Smith, and Vaikuntanathan for the standard Kac's walk on real Stiefel manifolds~\\cite{PSV26}.", "url": "https://arxiv.org/abs/2609.37999", "type": "理论", "summary": "1. 该工作研究并行Kac随机游走同时作用于k个正交归一量子态，并等价地视为复Stiefel流形V_{d,k}上的随机游走。\n2. 核心是证明任意1≤k<d时，k个输出态经O((k+log d)log(d/ε))步后，联合分布与共同Haar随机酉作用在Wasserstein和全变差下ε接近。\n3. 这将对单个量子态的扩散性质推广至多个正交态，并扩展实Stiefel流形上标准Kac游走的Wasserstein混合结果。", "summary_source": "deepseek", "authors": [{"name": "Qian Chen"}, {"name": "Minglong Qin"}, {"name": "Fang Song"}, {"name": "Penghui Yao"}, {"name": "Mingnan Zhao"}], "featured_authors": [{"name": "Qian Chen"}, {"name": "Minglong Qin"}, {"name": "Fang Song"}, {"name": "Penghui Yao"}, {"name": "Mingnan Zhao"}], "author_count": 5}, {"id": "2609.38007", "category": "quant-ph", "title": "Improved estimate of local Markovianity for quantum Gibbs states", "abstract": "We establish improved locally Markovian properties of quantum Gibbs states at every fixed positive temperature. For finite-range interactions of bounded interaction degree, the conditional mutual information (CMI) decays exponentially with separation, with a prefactor exponential in the boundary size. This improves the exponential volume dependence of the local Markov bounds established by Chen and Rouzé \\cite{Chen2025}. For exponentially and stretched-exponentially decaying interactions, we obtain stretched-exponential CMI decay with a boundary-dependent prefactor. For power-law interactions, we prove inverse-logarithmic or algebraic decay with polynomial region-size dependence. Our proof is static, in contrast to the dynamical approach of Chen and Rouzé. We compare the Gibbs state with a product state obtained by removing boundary interactions, reducing the CMI bound to a relative-entropy loss that we control using locality estimates.", "url": "https://arxiv.org/abs/2609.38007", "type": "理论", "summary": "1. 该工作针对固定正温度下的量子吉布斯态，改进并建立了更优的局部马尔可夫性估计，覆盖有限程、指数、拉伸指数及幂律衰减相互作用。\n2. 其核心是条件互信息随间距指数或拉伸指数衰减，前因子仅随边界尺寸指数增长，优于Chen–Rouzé的体积指数依赖；证明为静态，通过移除边界相互作用与乘积态比较，将CMI界归约为可用局域性估计控制的相对熵损失。\n3. 该结果深化了对热态关联与边界熵结构的理解，并为不同相互作用衰减下的马尔可夫性质及后续热态算法与纠缠研究提供了统一而紧致的出发点。", "summary_source": "deepseek", "authors": [{"name": "Tai Hsuan Yang"}], "featured_authors": [{"name": "Tai Hsuan Yang"}], "author_count": 1}, {"id": "2609.38038", "category": "quant-ph", "title": "Universal quantum coding", "abstract": "Entanglement distillation from noisy bipartite states and reliable quantum communication over noisy channels are fundamental tasks in quantum information theory, yet optimal coding schemes typically rely on prior knowledge of the underlying state or channel. Here, through Schur-Weyl duality, we establish a universal quantum error-correction principle that removes this dependence entirely. We show that the irreducible permutation spaces arising from the local Schur-Weyl decomposition of many identical copies of an unknown bipartite mixed state form maximally entangled quantum code spaces, with an error structure determined entirely by representation theory. Correcting these symmetry-resolved errors yields universal protocols for entanglement distillation and quantum communication that achieve coherent-information rates with exponentially vanishing error and optimal second-order correction. The protocols are invariant under local unitaries and allow both input marginals to be recovered exactly. At finite block length, their achievable rates are governed by an associated Schur-Weyl information spectrum, which we relate to Petz-Rényi conditional entropies of the underlying state. The resulting sample complexity depends only on the relevant spectral ranks, rather than on the respective Hilbert space dimensions. In particular, for $n$-qubit states of $O(\\operatorname{poly} n)$ global rank, we show that a Petz-Rényi conditional-entropy promise suffices for optimal sample-efficient entanglement distillation. Altogether, these results identify Schur-Weyl duality as a fundamental and general mechanism for optimal, tomography-free universal quantum coding, placing entanglement distillation, quantum error correction and quantum communication within a unified representation-theoretic framework.", "url": "https://arxiv.org/abs/2609.38038", "type": "理论+数值", "summary": "1. 该工作通过 Schur-Weyl 对偶建立通用量子纠错原理，消除对未知量子态或信道先验知识的依赖。\n2. 未知双体混合态多副本的局域 Schur-Weyl 分解给出最大纠缠码空间，其表示论错误结构可被纠正，协议达相干信息率与最优二阶修正。\n3. 有限块长下样本复杂度仅依赖谱秩而非 Hilbert 维度，表明 Schur-Weyl 对偶是可统一纠缠蒸馏、纠错与通信的免层析最优编码机制。", "summary_source": "deepseek", "authors": [{"name": "Jacopo Rizzo"}, {"name": "Ludovico Lami"}, {"name": "Jens Eisert"}, {"name": "Lorenzo Leone"}], "featured_authors": [{"name": "Jacopo Rizzo"}, {"name": "Ludovico Lami"}, {"name": "Jens Eisert"}, {"name": "Lorenzo Leone"}], "author_count": 4}, {"id": "2609.38044", "category": "quant-ph", "title": "A Tale of Two Walks: Kipnis, Marchioro and Presutti Meet Kac in a Quantum World", "abstract": "We reveal an unexpected connection between the parallel Kac's walk and the Kipnis-Marchioro-Presutti (KMP) process. The twirling channel induced by the parallel Kac's walk on the symmetric subspace is exactly encoded by a classical Markov chain on partitions, which lifts to a parallel KMP process on complete graphs. This correspondence reduces the analysis of the twirling channel to the mixing of the parallel KMP process. We prove that $O(\\log d+\\log(1/\\varepsilon))$ repetitions suffice to approximate Haar twirling on the symmetric subspace of $(\\mathbb C^d)^{\\otimes t}$ to error $\\varepsilon$, uniformly in the number of copies $t$. For the standard KMP process on general graphs, we prove a mixing-time analogue of Aldous's conjecture: at fixed accuracy, the mixing time of the $t$-particle process is at most a constant times the single-particle mixing time multiplied by the logarithm of the number of vertices, uniformly in $t$. As an application, we improve the total variation mixing-time bound for coordinate hit-and-run on the $n$-dimensional standard simplex from $\\widetilde O(n^3)$ (Kook and Vempala, 2026) to $\\widetilde O(n)$, while removing the dependence on the initial distribution. Our main technical contribution is conditional product structure for both parallel and standard KMP processes. Conditioned on suitable auxiliary randomness, the labeled particles evolve independently. Combining this structure with an exact coupling yields mixing bounds uniform in the number of particles for both unlabeled KMP models. These bounds are sharp up to logarithmic factors and imply rapid convergence of the parallel Kac twirling channel on the symmetric subspace.", "url": "https://arxiv.org/abs/2609.38044", "type": "理论", "summary": "1. 该工作揭示了平行Kac行走与Kipnis-Marchioro-Presutti（KMP）过程之间的意外联系，并将平行Kac行走在对称子空间上诱导的twirling信道精确映射为分拆上的经典马尔可夫链，进而提升为完全图上的平行KMP过程。\n2. 其核心卖点在于证明该twirling信道可用O(log d+log(1/ε))次重复逼近Haar twirling且关于副本数t一致，并通过条件乘积结构与精确耦合给出粒子数一致有界的混合时间，证明一般图上KMP的混合时间满足Aldous猜想的类比。\n3. 这改进了n维标准单纯形上坐标hit-and-run的全变差混合时间界至Õ(n)，并去除了对初始分布的依赖，为量子twirling与经典随机过程间的对应及快速混合分析提供了新范式。", "summary_source": "deepseek", "authors": [{"name": "Qian Chen"}, {"name": "Jingcheng Liu"}, {"name": "Minglong Qin"}, {"name": "Leonard Schulman"}, {"name": "Fang Song"}, {"name": "Penghui Yao"}, {"name": "Mingnan Zhao"}], "featured_authors": [{"name": "Qian Chen"}, {"name": "Jingcheng Liu"}, {"name": "Minglong Qin"}, {"name": "Fang Song"}, {"name": "Penghui Yao"}, {"name": "Mingnan Zhao"}], "author_count": 7}, {"id": "2609.38060", "category": "quant-ph", "title": "Classical Verification of Quantum Computation with Quasilinear Resources, from Compiled Nonlocal Games", "abstract": "Computational self-testing gives a classical verifier command over the quantum register of a single computationally bounded prover. We use this framework to construct the first argument system for BQP with quasilinear total resource requirements in the circuit model. Our argument system is based on the learning with errors (LWE) assumption and requires total resources of $O(\\mathrm{poly}(\\lambda, \\log g)\\cdot g)$ for delegating a circuit with $g$ gates, where $\\lambda$ is the LWE security parameter. This is achieved by constructing a new computational self-test for certifying the prover's quantum state and using it to dequantize the efficient verification protocol of Broadbent (ToC 2018). Specifically, this self-test enables the verifiable, random remote state preparation of tensor product states of the single-qubit Clifford observables $\\sigma_X, \\sigma_Y, \\sigma_Z, (\\sigma_Y-\\sigma_X)/\\sqrt{2}$ and $(\\sigma_Y+\\sigma_X)/\\sqrt{2}$, with constant robustness: the verification error is independent of the number of prepared qubits. This approach was first proposed by Coladangelo et al. (ToC 2024) in the multi-prover setting. We replicate their result in the single-prover setting by applying the compiler proposed by Kalai et al. (STOC 2023)---which turns any nonlocal game into a single-prover argument system---to a modified version of their self-test.", "url": "https://arxiv.org/abs/2609.38060", "type": "理论", "summary": "1. 该工作基于LWE假设与编译非局域博弈，构造了首个总资源准线性的BQP电路单证明者经典验证论证系统。\n2. 其核心是新的计算自检验：可验证随机远程制备σX、σY、σZ及(σY±σX)/√2的张量积态，且验证误差与量子比特数无关。\n3. 该方案借助Kalai等编译器把多证明者自检验迁移到单证明者，为高效量子计算委托与编译非局域博弈提供启示。", "summary_source": "deepseek", "authors": [{"name": "Finn Holler"}, {"name": "Anand Natarajan"}], "featured_authors": [{"name": "Finn Holler"}, {"name": "Anand Natarajan"}], "author_count": 2}, {"id": "2609.38073", "category": "quant-ph", "title": "Optimal Quantum-Classical Separations for Exact Learning", "abstract": "We study exact learning with membership queries for concept classes $\\mathcal C\\subseteq\\{0,1\\}^N$, focusing on the relationships among their deterministic, randomized, and quantum query complexities, denoted $\\mathsf{D}(\\mathcal C)$, $\\mathsf{R}(\\mathcal C)$, and $\\mathsf{Q}(\\mathcal C)$, respectively. The two canonical quantum speedups in this model are witnessed by Grover search and Bernstein-Vazirani, leading to the longstanding conjecture $$ \\mathsf{R}(\\mathcal C)=O(\\mathsf{Q}(\\mathcal C)^2+\\mathsf{Q}(\\mathcal C)\\log N). $$ We first refute this conjecture by constructing concept classes $\\mathcal C$ and $\\mathcal C'$ satisfying \\[ \\mathsf{R}(\\mathcal C)=\\Omega\\!\\left(\\frac{\\mathsf{Q}(\\mathcal C)^3\\log N}{\\log \\mathsf{Q}(\\mathcal C)}\\right) \\qquad\\text{and}\\qquad \\mathsf{D}(\\mathcal C')=\\Omega(\\mathsf{Q}(\\mathcal C')^3\\log N). \\] The first bound matches the upper bound of Arunachalam et al.~[Quantum'21] up to constant factors, while the second matches the upper bound of Servedio and Gortler~[SICOMP'04]. In particular, this shows that the saving in the randomized upper bound of Arunachalam et al. fundamentally relies on randomness. Apart from characterizing the optimal relationship between classical and quantum query complexity, our results are the first to show that quantum speedups for learning can go beyond the Grover and Bernstein-Vazirani paradigms.", "url": "https://arxiv.org/abs/2609.38073", "type": "理论", "summary": "1. 该工作研究概念类在成员查询下的精确学习，考察其确定性、随机化与量子查询复杂度 D、R、Q 的关系，并构造反例推翻了长期猜想 R=O(Q^2+Q log N)。\n2. 其核心结果是构造概念类使 R=Ω(Q^3 log N / log Q)、D=Ω(Q^3 log N)，分别匹配已知随机与确定性上界，并表明随机上界的节省本质上依赖随机性。\n3. 该结果首次证明精确学习中的量子加速可超越格罗弗与伯恩斯坦-瓦齐拉尼范式，并为刻画经典与量子查询复杂度的最优关系提供新方向。", "summary_source": "deepseek", "authors": [{"name": "Srinivasan Arunachalam"}, {"name": "Amin Shiraz Gilani"}, {"name": "Nikhil S. Mande"}], "featured_authors": [{"name": "Srinivasan Arunachalam"}, {"name": "Amin Shiraz Gilani"}, {"name": "Nikhil S. Mande"}], "author_count": 3}, {"id": "2609.38075", "category": "quant-ph", "title": "Ramanujan quantum expanders from the Weil representation", "abstract": "For every odd prime power $q$ and $D=q+1$, we construct an infinite family of Ramanujan quantum expanders of degree $D$. The construction transfers Morgenstern's Ramanujan Cayley graphs on $\\operatorname{PSL}_2(\\mathbb{F}_{p})$ for $p$ which is an even power of $q$, through the odd irreducible subrepresentation of the Weil representation of $\\operatorname{SL}_2(\\mathbb{F}_{p})$. For a quantum expander of dimension $N$, our implementation uses $O(\\log^2 N)$ elementary gates, and $O(\\log N)$ ancilla qudits, using a fixed finite gate set depending on $q$. An advantage compared to the previous work of Iyer, Jain, Jordan, and Somma (FOCS 2026) is that assuming the quantum circuit is implemented exactly, we satisfy the $2\\sqrt{D-1}/D$ singular value bound exactly without any additive error.", "url": "https://arxiv.org/abs/2609.38075", "type": "理论", "summary": "1. 对于每一个奇数次幂 $q$ 和 $D=q+1$，我们构建了一个无限级 $D$ 的拉马努扬量子展开子族。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Siddhartha Jain"}], "featured_authors": [{"name": "Siddhartha Jain"}], "author_count": 1}, {"id": "2609.38085", "category": "quant-ph", "title": "Learning quantum symmetries", "abstract": "Quantum algorithms are powerful tools for finding symmetries of classical objects, most famously through Shor's algorithm and the framework of the Hidden Subgroup Problem (HSP). In this work, we study quantum algorithms for learning symmetries of quantum objects. Our starting point is the recently introduced State Hidden Subgroup Problem (StateHSP), a quantum generalisation of HSP in which the task is to learn the symmetry subgroup of a quantum state. We obtain positive results for non-abelian StateHSP, giving efficient quantum algorithms whenever the hidden subgroup is normal and for ambient groups belonging to a broad class of non-abelian groups, extending the previous general theory beyond the abelian setting. StateHSP learns \\emph{Bose} symmetries, associated with linear representations, whereas physically equivalent pure states are defined only up to global phase. Motivated by this, we introduce a new \\emph{Anyonic} state symmetry learning problem based on a more physically natural notion of symmetry than that considered by StateHSP. We give an efficient quantum algorithm by reducing the problem to StateHSP, where the reduction relies on a new connection between linearisations of projective representations and linear error-correcting codes. As an application, we obtain an improved algorithm for learning stabiliser groups that applies to mixed qudit states of arbitrary local dimension. Finally, we introduce symmetry learning problems for other quantum objects, including unitaries, Hamiltonians, and finite collections of states, and obtain efficient quantum algorithms by reducing them to instances of StateHSP.", "url": "https://arxiv.org/abs/2609.38085", "type": "理论+数值", "summary": "1. 该工作研究量子对象的对称性学习，在非阿贝尔StateHSP和任意子态对称学习上给出高效量子算法。\n2. 其卖点是在隐藏子群为正规子群且环境群属广泛非阿贝尔类时求解StateHSP，并以射影表示线性化与纠错码的联系归约任意子问题。\n3. 该框架可扩展至酉、哈密顿量与有限态集合的对称学习，并改进任意局域维度混合qudit的稳定子群学习算法。", "summary_source": "deepseek", "authors": [{"name": "Isaac Holt"}, {"name": "Sathyawageeswar Subramanian"}], "featured_authors": [{"name": "Isaac Holt"}, {"name": "Sathyawageeswar Subramanian"}], "author_count": 2}, {"id": "2609.38091", "category": "quant-ph", "title": "Optimal Ground-State Preparation with a Guiding State", "abstract": "Suppose a Hamiltonian $H$ has a unique ground state $|\\psi_0\\rangle$ with an eigenvalue $E_0$, and we have an estimate $\\tilde{E}_0$ such that $|\\tilde{E}_0-E_0|\\leq\\delta$, and there is a gap of at least $3\\delta$ between $E_0$ and all other eigenvalues. Suppose we have a unitary $A$ available that can produce a \"guiding state'\" $A|0\\rangle$ that has overlap at least $\\gamma$ with $|\\psi_0\\rangle$. We show how to obtain an $\\varepsilon$-approximation of $|\\psi_0\\rangle$ using $O(\\log(1/\\varepsilon)/\\gamma\\delta)$ applications of $U=e^{iH}$ and $A$, and their inverses. We give two different algorithms, one based on interleaving amplitude amplification and error-reduction in the style of [HMdW03], and one using the composition of transducers. This paper is the state-preparation follow-up to our two recent ground-state-energy estimation papers [JW26, SdW26]. Combined, our results show an optimal $O(\\log(1/\\varepsilon)/\\gamma\\delta)$ upper bound for ground state preparation.", "url": "https://arxiv.org/abs/2609.38091", "type": "理论+数值", "summary": "1. 该工作研究了在已知基态能量近似误差δ、能隙至少3δ且可制备与目标基态交叠至少γ的引导态时，如何以ε精度制备哈密顿量的唯一基态。\n2. 其技术卖点是给出仅需O(log(1/ε)/(γδ))次U=e^{iH}、A及其逆算符的查询上界，并用交叠振幅放大与误差削减、以及转换器复合两类算法实现该复杂度。\n3. 与作者近期基态能量估计结果结合，这一最优上界将引导态交叠γ、能隙与能量误差δ统一进基态制备复杂度，并为量子模拟算法设计提供明确基准与模块化启示。", "summary_source": "deepseek", "authors": [{"name": "Stacey Jeffery"}, {"name": "Rolando D. Somma"}, {"name": "Freek Witteveen"}, {"name": "Ronald de Wolf"}], "featured_authors": [{"name": "Stacey Jeffery"}, {"name": "Rolando D. Somma"}, {"name": "Freek Witteveen"}, {"name": "Ronald de Wolf"}], "author_count": 4}, {"id": "2609.38134", "category": "quant-ph", "title": "Resource Compatibility in Optimal Quantum Symmetry Testing", "abstract": "Can a symmetry be tested optimally without using the quantum resource naturally associated with it? For parallel subgroup-versus-Haar testing, we derive a quantitative representation-theoretic converse for every protocol with zero type-I error: the excess type-II error is bounded below by the sum of two nonnegative penalties, one for weight on suboptimal subgroup types and one for deviations of within-type Schur profiles from their typewise extremal profiles. At optimality, both penalties vanish, yielding support and weight locking for every optimal system marginal. Disjointness of the resulting locked set and the free marginal set rules out resource-free optimality, whereas overlap alone does not establish attainability. For the diagonal torus in dimension $d\\geq 2$, optimal testing without coherence is possible only with a single query. We determine both the exact optimal type-II error over all protocols with incoherent system marginals and the minimum system-marginal coherence required to attain the unrestricted optimum. For the orthogonal subgroup in dimension $d\\geq 2$, a real protocol attains the optimum at every query number. For the qutrit Clifford group, Wigner-positive optimal protocols exist at three and four queries but not from five through nine; whether they exist beyond nine queries remains open. Together, these results relate the subgroup- and query-dependent resource requirements of optimal symmetry testing to structural constraints on optimal system marginals.", "url": "https://arxiv.org/abs/2609.38134", "type": "理论", "summary": "1. 是否可以在不使用与其自然相关的量子资源的情况下对对称性进行最佳测试？\n2. 对于 qutrit Clifford 组，Wigner 正最优协议存在于 3 个和 4 个查询中，但不存在于 5 到 9 个查询中；它们是否存在超过九个查询仍然悬而未决。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Yimeng Cao"}, {"name": "Ranyiliu Chen"}, {"name": "Chengkai Zhu"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "Yimeng Cao"}, {"name": "Ranyiliu Chen"}, {"name": "Chengkai Zhu"}, {"name": "Xin Wang"}], "author_count": 4}, {"id": "2609.38144", "category": "quant-ph", "title": "The exact strong converse exponent for private communication over quantum channels", "abstract": "We determine the exact strong converse exponent for secret-key transmission and generation over general finite-dimensional quantum wiretap channels, measuring reliability and secrecy jointly by squared fidelity to an ideal secret key. We introduce a novel Renyi private information whose regularization characterizes this exponent. An exact integral representation in terms of ordinary private information gives a uniform continuity bound, showing that the regularized quantity converges to private capacity as the Renyi order approaches one. This establishes for any wiretap channel an exponential fidelity decay at every rate above private capacity.", "url": "https://arxiv.org/abs/2609.38144", "type": "
