ned by a walking anomalous dimension. As the mass scales are varied, this walking anomalous dimension interpolates between the cusp anomalous dimension of the on-shell regime and the octagon anomalous dimension of the off-shell regime. Based on the explicit two-loop result and the expected all-order structure, we propose an all-loop form for the walking anomalous dimension both for the form factor and for the four-point scattering amplitude. These all-loop expressions depend on new, presently unknown functions of the 't Hooft coupling.", "url": "https://arxiv.org/abs/2605.16034", "type": "理论", "summary": "1. 该工作研究了平面N=4 SYM库仑支上Sudakov形状因子与四点散射振幅作为库仑支参数及运动学不变量的函数。\n2. 其卖点在于发现了一个新标度极限，其中两者呈现由行走反常维度控制的双对数行为，该维度在壳尖点反常维度与离壳八边形反常维度间插值。\n3. 基于两圈结果与预期全阶结构，提出了行走反常维度的全阶形式，为连接规范理论中壳与离壳红外敏感量之插值提供了可控探针。", "summary_source": "deepseek", "authors": [{"name": "Luis F. Alday"}, {"name": "Elisabetta Armanini"}, {"name": "Andrei V. Belitsky"}, {"name": "Kelian Häring"}, {"name": "Alexander Zhiboedov"}], "featured_authors": [{"name": "Luis F. Alday"}, {"name": "Elisabetta Armanini"}, {"name": "Andrei V. Belitsky"}, {"name": "Kelian Häring"}, {"name": "Alexander Zhiboedov"}], "author_count": 5}, {"id": "2605.16119", "category": "hep-th", "title": "Boundary anomalous dimensions from BCFT: $ϕ^{3}$ theories with a boundary and higher-derivative generalizations", "abstract": "We consider the bulk $\\phi^3$ deformation of the free boundary conformal field theory in the $\\epsilon$ expansion. We determine the leading corrections to the scaling dimensions of boundary fundamental operators and some boundary operator expansion coefficients. Our procedure combines the conformal multiplet recombination with the boundary crossing symmetry. The results cover both the single field case and the multi-field case with $S_{N+1}$ global symmetry, which are associated with the Yang-Lee model and the $(N+1)$-state Potts model respectively. These semi-infinite models describe branched polymers, percolation, and spanning forest at a surface. We generalize these results to some higher derivative theories. In addition, we study the $\\phi^{2n+1}$ theories with $n>1$, but only obtain some boundary operator expansion coefficients.", "url": "https://arxiv.org/abs/2605.16119", "type": "理论", "summary": "1. 该工作利用ε展开，结合共形多重态重组与边界交叉对称，计算了自由边界共形场论在体ϕ^3形变下边界基本算符的反常维数及边界算符展开系数。\n2. 其卖点在于统一处理单场与S_{N+1}对称多场情形，分别对应杨-李模型与(N+1)态Potts模型，并推广至高阶导数理论，给出了表面分支聚合物、渗流等系统的临界行为。\n3. 这为系统研究边界共形场论中的反常维数提供了可解析计算的方法，对理解表面临界现象及相关统计模型的边界效应具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Yongwei Guo"}, {"name": "Wenliang Li"}], "featured_authors": [{"name": "Yongwei Guo"}, {"name": "Wenliang Li"}], "author_count": 2}, {"id": "2605.16168", "category": "hep-th", "title": "Supergravity flows, wormholes and their pseudo-Hermitian holographic duals", "abstract": "We find solutions to consistent truncations of supergravity where some real scalars are analytically extended to imaginary values, ensuring the metric remains real-valued. Among the solutions there are Lorentzian traversable wormholes connecting two asymptotically Anti-de Sitter spacetimes and flows that have a real metric also when uplifted to ten or eleven dimensions. We argue that the holographic duals are pseudo-Hermitian and $PT$-symmetric theories. Wormhole solutions also admit an interpretation as the low-energy theory of two stacks of branes and antibranes after tachyon condensation. The wormhole is then dual to an entangled state of two copies of the theory that lives on a stack of branes. We present some evidence by computing the mutual information between the theories at each boundary and by identifying the Goldstone bosons associated to the breaking of the two copies of Poincaré symmetry to their diagonal subgroup.", "url": "https://arxiv.org/abs/2605.16168", "type": "理论", "summary": "1. 该工作通过解析延拓超引力截断中的实标量至虚数值，构造了保持度规实值的洛伦兹可穿越虫洞解及全息流。\n2. 卖点在于这些解的全息对偶为伪厄米PT对称理论，且虫洞可解释为膜-反膜堆快子凝聚后的低能纠缠态。\n3. 这为利用互信息计算和庞加莱对称性破缺研究非厄米全息对偶及可穿越虫洞的纠缠结构提供了具体途径。", "summary_source": "deepseek", "authors": [{"name": "Jose M. Begines"}, {"name": "Antón F. Faedo"}, {"name": "Carlos Hoyos"}, {"name": "Daniele Musso"}], "featured_authors": [{"name": "Jose M. Begines"}, {"name": "Antón F. Faedo"}, {"name": "Carlos Hoyos"}, {"name": "Daniele Musso"}], "author_count": 4}, {"id": "2605.16172", "category": "hep-th", "title": "Background-Equivariant BRST Observables and i-Particle Propagators from an Auxiliary Quartet in SU(3) Yang-Mills", "abstract": "In this work, we construct a BRST-exact quartet mechanism in $SU(3)$ Yang-Mills theory in the Landau gauge. The quartet sector is cohomologically trivial in the standard vacuum, ensuring equivalence to pure Yang-Mills theory. The transformation rules carry both commutator and anticommutator structures, enlarging the field content from eight to nine degrees of freedom. Working in a prescribed Cartan-oriented background (compatible with the classical equations of motion), the theory induces a mass matrix reproducing the distinct $i$-particle propagator structure of earlier replica models without explicit breaking terms. To respect the BRST doublet theorem, we separate background generation from observable cohomology. Introducing a background-equivariant covariant Cartan frame, we show the filtered $i$-particle bilinear is the lowest perturbative component of an all-orders off-shell BRST cocycle. Despite the complex poles of elementary propagators, its leading two-point function retains a Källén--Lehmann representation with a real positive threshold and positive spectral density. The fully quantized action provides a consistent framework for renormalizability, establishing a systematic mechanism for recovering $i$-particle propagators and identifying BRST-controlled composite observables from a BRST-exact quartet extended to $SU(3)$.", "url": "https://arxiv.org/abs/2605.16172", "type": "理论", "summary": "1. 该工作在SU(3)杨-米尔斯理论朗道规范下，通过引入BRST精确四重态机制将场自由度从八个扩展至九个，构造了背景等变BRST可观测量与i粒子传播子。\n2. 其核心在于利用Cartan取向背景诱导的质量矩阵重现i粒子传播子结构，并借助背景等变协变Cartan框架证明滤波后i粒子双线性是无穷阶离壳BRST上循环的最低阶分量，且其两点函数保持具实正阈值与正谱密度的Källén-Lehmann表示。\n3. 通过分离背景产生与可观测量上同调以尊重BRST双陪集定理，该框架为从BRST精确四重态系统恢复i粒子传播子与识别可重整化BRST控制复合可观测量提供了自洽途径，启发对非阿贝尔规范理论中类粒子激发的严格描述。", "summary_source": "deepseek", "authors": [{"name": "M. M. Amaral"}, {"name": "V.E.R.Lemes"}], "featured_authors": [{"name": "M. M. Amaral"}, {"name": "V.E.R.Lemes"}], "author_count": 2}, {"id": "2605.16188", "category": "hep-th", "title": "Non-Invertible Symmetries in Compactified Supergravities", "abstract": "We study the \\textit{Kaluza--Klein} descent of non-invertible higher-form symmetry defects from eleven-dimensional Supergravity to Type IIA Supergravity. Starting from the eleven-dimensional construction of non-invertible Supergravity defects, we show that the full defect, including its auxiliary topological sector, admits a pushforward along the M-theory circle in the zero-mode Supergravity regime. The seven-dimensional \\textit{Chern--Simons}-like auxiliary theory descends to a six-dimensional \\(BF\\)-type sector. We also show that the compactification of the eleven-dimensional \\textit{Bianchi} sector splits into an invertible \\(H_{[3]}\\)-sector and a twisted non-invertible \\(\\widetilde F_{[4]}\\)-sector, controlled by \\(d\\widetilde F_{[4]}+H_{[3]}\\wedge F_{[2]}=0\\). The resulting Type IIA defect algebra contains both an invertible Picard subgroup and non-invertible \\(BF\\)-dressed defects, with charged probes identified through the standard M-theory/Type IIA brane dictionary.", "url": "https://arxiv.org/abs/2605.16188", "type": "理论", "summary": "1. 该工作研究了从十一维超引力到IIA型超引力的Kaluza-Klein约化中非可逆高形式对称性缺陷的下降与重组过程。\n2. 其关键在于展示了缺陷的辅助拓扑扇区沿M理论圆推进，使七维Chern-Simons型理论降为六维BF扇区，且Bianchi扇区紧化分裂为可逆H[3]扇区与受dF̃+H∧F=0控制的扭曲非可逆F̃[4]扇区。\n3. 由此导出的IIA缺陷代数同时包含可逆Picard子群与非可逆BF-dressed缺陷，并通过标准M理论/IIA弦对偶字典识别带电探针，为超引力中广义非可逆对称性的紧化行为提供了具体框架。", "summary_source": "deepseek", "authors": [{"name": "Fabián Caro-Pérez"}, {"name": "María Pilar García del Moral"}, {"name": "Álvaro Restuccia"}], "featured_authors": [{"name": "Fabián Caro-Pérez"}, {"name": "María Pilar García del Moral"}, {"name": "Álvaro Restuccia"}], "author_count": 3}, {"id": "2605.16254", "category": "hep-th", "title": "Fortuity and Complexity in a Simple Quark Model", "abstract": "We observe and elaborate on a structural similarity between the categorization of monotone and fortuitous BPS operators in supersymmetric theories and gauge invariant quark operators in $SU(N_c)$ QCD. Our designation of fortuity does not rely on supersymmetry and instead uses the BRST cohomology. We argue that within this designation, baryon states are fortuitous while meson states are monotone. We illustrate that in the Veneziano limit of large number of flavors and colors, this designation displays features resembling the fortuitous vs. monotone categorization of BPS operators, e.g., an exponential vs. polynomial dichotomy in the counting of operators. We explore these ideas explicitly in a toy qubit model of quarks. We further investigate the stabilizer Rényi entropy of meson and baryon states as a proxy for the complexity of classical simulation for these states. We show that all mesons display power law complexity and present evidence that typical baryons display super-exponential complexity in the Veneziano limit.", "url": "https://arxiv.org/abs/2605.16254", "type": "理论", "summary": "1. 该工作通过BRST上同调在无超对称条件下定义偶然性，揭示了超对称理论中单调与偶然BPS算符的分类与QCD规范不变夸克算符间的结构相似性。\n2. 其核心洞察在于指出重子态为偶然、介子态为单调，并在Veneziano极限下复现了BPS算符计数中的指数与多项式二分法特征。\n3. 基于稳定子Rényi熵分析，证明介子态经典模拟复杂度呈幂律增长，而典型重子态在Veneziano极限下呈现超指数复杂性，为量子色动力学非微扰计算的复杂性分类提供了定量基准。", "summary_source": "deepseek", "authors": [{"name": "Jackson R. Fliss"}, {"name": "Vishnu Jejjala"}, {"name": "Onkar Parrikar"}], "featured_authors": [{"name": "Jackson R. Fliss"}, {"name": "Vishnu Jejjala"}, {"name": "Onkar Parrikar"}], "author_count": 3}, {"id": "2605.15653", "category": "math-ph", "title": "Thermodynamic Invariants of Coupled Channels: A Many-Channel Tolman-Ehrenfest Effect", "abstract": "When multiple thermodynamic channels are coupled, single-channel equilibrium conditions fail. Extending the Tolman--Ehrenfest effect to the entropy manifold, we derive the unique $n$-channel invariant $\\zeta_i T_i = C$, where $\\zeta_i$ is the holonomy of the Ruppeiner connection. For the granular volume--stress ensemble, Rowe's dilatancy ratio and energy restriction emerge as geometric consequences of the off-diagonal curvature $g_{V\\sigma}$, and the 60-year puzzle of state-dependent $K_\\mu$ is resolved: the correction $\\zeta_V$ reaches $O(1)$ near jamming. The prediction $\\zeta_V\\chi=\\mathrm{const}$ across a shear band is experimentally testable.", "url": "https://arxiv.org/abs/2605.15653", "type": "理论", "summary": "1. 该工作将Tolman-Ehrenfest效应推广至多热力学通道耦合体系，在熵流形上导出由Ruppeiner联络和乐唯一确定的不变量ζ_i T_i = C。\n2. 其物理卖点在于，Rowe剪胀比与能量限制作为非对角曲率g_{Vσ}的几何结果自然涌现，从而将六十年来状态依赖K_μ的难题归因于堵塞附近修正ζ_V达O(1)的几何滞回。\n3. 该工作预言剪切带上ζ_Vχ为常数，为颗粒材料提供了可直接实验检验的几何热力学判据，并启示在多通道耦合系统中广泛存在此类结构不变量。", "summary_source": "deepseek", "authors": [{"name": "Benjamin Hamblin"}, {"name": "Victor Calo"}, {"name": "Klaus Regenauer-Lieb"}], "featured_authors": [{"name": "Benjamin Hamblin"}, {"name": "Victor Calo"}, {"name": "Klaus Regenauer-Lieb"}], "author_count": 3}, {"id": "2605.15679", "category": "math-ph", "title": "Spectral separation of variables from equivalent Lagrangian systems", "abstract": "We investigate the dynamical equivalence of quadratic Lagrangians and its relation to separation of variables. We show that requiring two quadratic Lagrangians to generate the same Euler--Lagrange equations imposes a compatibility condition between the kinetic matrices and the potential. For constant symmetric kinetic matrices, this condition reduces to a commutation relation with the Hessian of the potential, yielding an orthogonal spectral decomposition of the configuration space. The equations of motion then decouple into independent subsystems: generically in block-separated form, and completely when the spectrum is simple. Applications include the Sawada--Kotera system and an $n$-dimensional extension of the Hénon--Heiles model, where the classical integrable parameter regimes are recovered.", "url": "https://arxiv.org/abs/2605.15679", "type": "理论", "summary": "1. 该工作研究了二次拉格朗日系统动力学等价的必要条件，证明常数对称动能矩阵与势能Hessian矩阵的对易关系可导出构型空间的正交谱分解，从而实现谱变量分离。\n2. 其核心卖点在于将该对易条件转化为运动方程的谱解耦：当谱有简并时系统呈块分离形式，谱简单时则完全解耦为一维子系统，从而系统简化了高维耦合拉格朗日系统的动力学分析。\n3. 该谱分离方法成功应用于Sawada-Kotera系统和n维Hénon-Heiles模型，精确恢复了经典可积参数区域，为基于拉格朗日等价性理解可积系统变量分离提供了严格框架。", "summary_source": "deepseek", "authors": [{"name": "Mattia Scomparin"}], "featured_authors": [{"name": "Mattia Scomparin"}], "author_count": 1}, {"id": "2605.16042", "category": "math-ph", "title": "Epstein vector zeta functions related to the ADE Lie algebras", "abstract": "We introduce a vector-valued generalization of the Epstein zeta functions associated with the root lattices of ADE-type Lie algebras. The quadratic forms defining these lattices correspond to the Gram matrices of the simple roots. Using the discriminant group D = P/Q, we construct vector-valued theta series that realize the Weil representation of the metaplectic group Mp(2,Z). The proposed Epstein vector zeta functions are obtained as the Mellin transform of these theta series. By exploiting the equivariance properties of the theta vectors, we derive a matrix functional equation of the Riemann type. We show that the existence of this functional equation is governed by a selection rule: it holds specifically for the subspace of C-invariant vectors, where C is the central element of Mp(2,Z). Finally, we provide a complete classification of the lattices and invariant subspaces for which this matrix functional equation is satisfied.", "url": "https://arxiv.org/abs/2605.16042", "type": "理论", "summary": "1. 该工作通过ADE型李代数根格引入向量值Epstein zeta函数，并利用判别群构造实现Mp(2,Z) Weil表示的向量值theta级数。\n2. 其技术核心在于借助theta向量的等变性导出Riemann型矩阵函数方程，并证明该方程仅对Mp(2,Z)中心元C的不变子空间成立。\n3. 这为根格与自守形式的关系提供了完整分类，有望启发高维zeta函数与表示论交叉领域的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "M.Olshanetsky"}], "featured_authors": [{"name": "M.Olshanetsky"}], "author_count": 1}, {"id": "2605.15266", "category": "quant-ph", "title": "Synthesis and Optimization of Encoding Circuits for Fault-Tolerant Quantum Computation", "abstract": "Preparing arbitrary logical states is a central primitive for universal fault-tolerant quantum computation and the cost of encoded-state preparation contributes directly to the overall resource overhead. This makes the synthesis of efficient general-state encoding circuits an important problem, particularly with respect to two-qubit gate count and circuit depth. Yet the synthesis of such encoders has been studied less extensively than general Clifford circuit synthesis or the preparation of specific logical Pauli-eigenstates. In this work, we develop methods for synthesizing efficient encoders for arbitrary stabilizer codes. We formulate encoder synthesis as a search over stabilizer tableaus and introduce greedy and rollout-based algorithms that exploit the freedom among stabilizer-equivalent realizations of the same encoding isometry. For code families with a modular structure, such as generalized concatenated and holographic codes, we show how large encoders can be assembled from optimized local constituent encoders, and we use SMT-based exact synthesis to obtain optimal local circuits for small instances. We further evaluate the proposed methods on a broad set of stabilizer codes, including holographic and quantum low-density parity-check (qLDPC) codes, and compare them against recent encoder-synthesis methods and existing constructions from the literature, obtaining improvements of up to 43% in two-qubit gate count and up to 70% in depth. Our results support the optimization of encoded-state preparation in several fault-tolerant quantum-computing schemes, and all methods are openly available as part of the Munich Quantum Toolkit.", "url": "https://arxiv.org/abs/2605.15266", "type": "数值", "summary": "1. 该工作为任意稳定子码设计了编码电路的高效合成与优化方法，覆盖从通用搜索到模块化组装的完整框架。\n2. 其核心在于利用编码等距的稳定子等价自由度指导贪心与 rollout 搜索，并采用 SMT 精确综合获取小规模最优局部电路。\n3. 这可将编码电路的双量子门数及深度分别压降最高 43% 与 70%，且方法已集成至开源工具箱，直接服务于多种容错方案中编码态制备的资源优化。", "summary_source": "deepseek", "authors": [{"name": "Tom Peham"}, {"name": "Matthew Steinberg"}, {"name": "Robert Wille"}, {"name": "Sascha Heußen"}], "featured_authors": [{"name": "Tom Peham"}, {"name": "Matthew Steinberg"}, {"name": "Robert Wille"}, {"name": "Sascha Heußen"}], "author_count": 4}, {"id": "2605.15297", "category": "quant-ph", "title": "Towards Deploying Optimistic Quantum Fourier Transforms: An Architecture-Algorithm Co-Design Study", "abstract": "We present an architecture-algorithm co-design study of the Optimistic Quantum Fourier Transform (OQFT) under a surface-code fault-tolerant execution model for reconfigurable neutral-atom hardware. Analyzing the OQFT structure, particularly its reliance on phase-gradient resources and small-scale blocks, highlights architectural requirements for resource mobility and parallel execution. Guided by that, we introduce a hot-zone architecture that decouples data storage from processing and dynamically routes mobile resource packages (magic-state factories, bridge qubits, and phase-gradient registers) to stationary data regions. To expose dominant costs, we route rotation insertions via catalytic phase-gradient addition and heuristically micro-schedule ripple-carry adders to patch-level moves. Under this model, leading Gidney~\\cite{Gidney2018halvingcostof} and Cuccaro~\\cite{cuccaro2004} adders have similar space-time volume but require different levels of parallelism. At the algorithm level, the five-layer OQFT shows a tunable parallelism/latency trade-off: two hot zones match serial-QFT latency, four hot zones roughly halve runtime, and additional hot zones asymptotically approach constant-time execution at substantial resource cost. Across 256-2048-bit instances, the requirements for half-time performance converge to about 500 additional logical ancillae and a peak parallelism of 128 logical qubits. We also identify broader algorithm-architecture bottlenecks, including endianness mismatches between phase-gradient and data registers, addressed via cyclic phase-gradient swaps and alternating QFT reflections. Scoped to surface codes and cultivation-only magic-state factories, our analysis identifies reaction-limited operation and parallelism demand as primary drivers of resource estimation and establishes a generalizable foundation for primitive-based architectural studies.", "url": "https://arxiv.org/abs/2605.15297", "type": "理论+数值", "summary": "1. 该工作针对可重构中性原子硬件上的乐观量子傅里叶变换，开展了表面码容错执行模型下的架构-算法协同设计研究。\n2. 其核心在于提出热区架构，将数据存储与处理解耦并动态路由移动资源包，结合催化相位梯度插入与启发式微观调度以显式暴露延迟与并行性代价。\n3. 这揭示了反应限制与并行需求作为资源估算主要驱动，为基于原语的容错架构通用分析建立了可扩展基础。", "summary_source": "deepseek", "authors": [{"name": "Pedro L. S. Lopes"}], "featured_authors": [{"name": "Pedro L. S. Lopes"}], "author_count": 1}, {"id": "2605.15339", "category": "quant-ph", "title": "Energy-space quantum walks: Thermalization without state convergence", "abstract": "We introduce energy-space quantum walks as a minimal framework to investigate equilibration, thermalization, and irreversibility from an effective-dynamics perspective. By mapping the configuration space of a walk onto a ladder of energy eigenlevels, we reinterpret thermalization as transport in energy space, independently of microscopic system--bath details. At the classical level, the resulting birth--death--lazy dynamics leads to equilibration of the energy distribution and, under suitable conditions, to a Gibbs stationary state. We then embed this dynamics into a unitary, collision-assisted model in which coherence is controlled by a single parameter. A central result is a structural decoupling between population dynamics and coherence generation: while the populations evolve according to the classical process and relax to the Gibbs distribution, the full quantum state exhibits a persistent coherence-induced deviation from the thermal manifold. This establishes a minimal scenario of thermalization without state convergence, where equilibration occurs at the level of populations but not at the level of the full density operator. We quantify this effect using the thermal distance to the Gibbs state and derive perturbative bounds that relate the long-time deviation to classical transport properties. Our results show that coherence acts as a controllable and quantitatively bounded source of nonthermal behavior, providing a clear separation between classical equilibration and genuinely quantum corrections.", "url": "https://arxiv.org/abs/2605.15339", "type": "理论", "summary": "1. 该工作提出能量空间量子行走框架，将构型空间映射为能级阶梯，使热化等效为能量空间输运，并以单一参数控制相干性的碰撞模型嵌入经典生-死-惰性动力学。\n2. 其核心发现是人口动力学与相干产生结构解耦：人口按经典过程松弛至吉布斯分布，而全量子态因持续相干效应始终偏离热流形，实现了平衡化而不状态收敛的最小场景。\n3. 通过热距离扰动界限定量刻画相干诱导的非热偏离，该工作将相干性确立为可控且有界的量子偏差源，为分离经典热化与量子修正提供了明确参考。", "summary_source": "deepseek", "authors": [{"name": "Alana Spak dos Santos"}, {"name": "Renato Moreira Angelo"}], "featured_authors": [{"name": "Alana Spak dos Santos"}, {"name": "Renato Moreira Angelo"}], "author_count": 2}, {"id": "2605.15344", "category": "quant-ph", "title": "Fire and ice: Partially fault-tolerant quantum computing with selective state filtering", "abstract": "We develop an error-corrected quantum computation scheme based on concatenating the five-qubit Laflamme code onto the four-qubit Iceberg code. The approach skates a thin line: it is explicitly not fault tolerant, risking higher logical error rates, and it relies on selective filtering to prepare encoded states for error correction, risking significant overhead. Yet, at realistic simulated noise rates, the scheme is reliable and resource efficient. It forges a practical path toward scalable quantum computation.", "url": "https://arxiv.org/abs/2605.15344", "type": "理论", "summary": "1. 该工作级联五量子比特Laflamme码和四量子比特Iceberg码，提出一种非完全容错但通过选择性状态过滤实现纠错的量子计算方案。\n2. 其核心在于舍弃严格容错性以换取资源效率，借助选择性过滤制备编码态，在模拟噪声下抑制逻辑错误并保持可靠性。\n3. 该策略为当前噪声量子设备提供了一条实用路径，表明部分容错与高效编码结合可实现有竞争力的可扩展量子纠错。", "summary_source": "deepseek", "authors": [{"name": "Ben W. Reichardt"}, {"name": "David Aasen"}, {"name": "Rui Chao"}], "featured_authors": [{"name": "Ben W. Reichardt"}, {"name": "David Aasen"}, {"name": "Rui Chao"}], "author_count": 3}, {"id": "2605.15370", "category": "quant-ph", "title": "Quantum Feature Pyramid Gating for Seismic Image Segmentation", "abstract": "Accurate salt-body delineation is essential for seismic interpretation because salt structures distort wave propagation, complicate velocity-model building, obscure reservoir geometry, and increase uncertainty in exploration and drilling decisions. Although hybrid quantum-classical models have shown competitive performance on small-scale image-classification tasks, their value for dense, pixel-level geophysical prediction remains largely untested. This work introduces quantum feature gating, a hybrid segmentation architecture that embeds a parameterized quantum circuit (PQC) at feature-fusion points within an encoder-decoder pipeline. A 4-qubit, 2-layer PQC with data re-uploading computes a learned convex combination of lateral and top-down features at each Feature Pyramid Network merge point. A global-average-pooling layer maps encoder features to a fixed 4-dimensional quantum input, decoupling the 72-parameter quantum budget from backbone size and image resolution. The method is evaluated on the 2018 TGS Salt Identification Challenge using 4,000 seismic images at 101 x 101 resolution, across two integration topologies, eight circuit variants, and six encoders with 8M to 118M parameters under five-fold cross-validation. In a controlled EfficientNetV2-L ablation at 256 x 256 resolution, replacing the three Quantum FPN Gates with element-wise addition while holding the encoder, loss schedule, splits, and threshold search fixed reduces mean IoU from 0.9389 to 0.8404, a 9.85 percentage-point gap. Inserting the same circuit as skip-connection attention in a custom U-Net improves IoU by 0.88 points over the SolidUNet baseline, showing that the PQC contribution depends on where and what it gates. These results provide controlled evidence that quantum feature fusion can improve dense seismic segmentation.", "url": "https://arxiv.org/abs/2605.15370", "type": "理论+数值", "summary": "1. 该工作提出了一个混合量子-经典分割架构，在编码器-解码器的特征金字塔融合点嵌入参数化量子电路，用于地震图像盐体勾画。\n2. 其技术卖点是采用4量子比特2层电路的数据重上传机制计算特征凸组合，并通过全局平均池化解耦量子预算与骨干规模，在EfficientNetV2-L消融中替换量子门使IoU下降9.85个百分点，证实了量子特征融合的受控有效性。\n3. 这一结果为高分辨率地理预测任务中量子优势的受控验证提供了明确范例，并启发通过改变量子电路在分割骨干中的嵌入位置来发挥不同的门控作用。", "summary_source": "deepseek", "authors": [{"name": "Taha Gharaibeh"}, {"name": "Jyotsna Sharma"}], "featured_authors": [{"name": "Taha Gharaibeh"}, {"name": "Jyotsna Sharma"}], "author_count": 2}, {"id": "2605.15372", "category": "quant-ph", "title": "Orthogonal Polynomials and the MacWilliams Transform for Permutation-Invariant Qudit Codes", "abstract": "We derive an explicit formula for the intrinsic MacWilliams transform for permutation-invariant qudit codes. Such codes naturally live in symmetric power representations, where the relevant error sectors are determined by the irreducible decomposition of the conjugation action on the associated operator space. Using the multiplicity-free structure of this decomposition and the corresponding intertwiner algebra, we identify the intrinsic MacWilliams matrix with a finite Racah transform. The entries are given by a terminating hypergeometric series, and the rows of the matrix are Racah orthogonal polynomials with parameters determined explicitly by the block length and local dimension. Computing the spectrum of the degree-one twirl reveals that this spectrum lies on an affine quadratic lattice. Then we derive a tridiagonal multiplication rule from the representation theory of the adjoint sector. As consequences, we obtain closed-form orthogonality, detailed-balance, and involutivity identities for the transform. The resulting formula supplies an explicit MacWilliams matrix for computing linear programming bounds on permutation-invariant qudit codes.", "url": "https://arxiv.org/abs/2605.15372", "type": "理论", "summary": "1. 本工作推导了置换不变qudit码内禀MacWilliams变换的显式公式，通过表示论中的多重性自由分解将变换矩阵等同于有限Racah变换，其行向量由参数由块长和局域维度确定的Racah正交多项式描述。\n2. 其技术核心在于利用交错子代数结构，从伴随扇区导出三对角乘法规则，并基于此证明变换满足闭式正交性、细致平衡与幂等性恒等式，同时揭示一次扭曲谱位于仿射二次格上。\n3. 所得显式矩阵为计算置换不变qudit码的线性规划界提供了直接代数工具，可系统约束最优量子纠错码的参数，并启发将Racah多项式推广至更一般纠错码的变换理论。", "summary_source": "deepseek", "authors": [{"name": "Ian Teixeira"}], "featured_authors": [{"name": "Ian Teixeira"}], "author_count": 1}, {"id": "2605.15420", "category": "quant-ph", "title": "Coherent States of Non-Null Torus Knots", "abstract": "We construct coherent states for the quantized electromagnetic field that correspond to the classical non-null torus knot solutions of Maxwell's equations in vacuum. We derive the displacement operators from the general relation between classical fields and coherent state amplitudes and verify the defining properties of coherent states through direct computation. We determine the observables of the model: field expectation values, energy density, Poynting vector, helicity, photon number, quadrature uncertainties, and correlation functions, and calculate their expectation values in the knotted coherent states in terms of the integer parameters $(n,m,l,s)$ of the classical solutions. As an example, we particularize the construction in the case of the Hopfion coherent state. These results establish the quantum-classical correspondence for this type of vacuum topological electromagnetic systems.", "url": "https://arxiv.org/abs/2605.15420", "type": "理论", "summary": "1. 该工作为真空中麦克斯韦方程的非零环面纽结经典解构造了对应的量子电磁场相干态。\n2. 其核心在于从经典场与相干态振幅的普遍关系导出位移算符，并通过直接计算验证相干态定义性质，给出场期望值、能量密度、坡印廷矢量、螺旋度等可观测量以整数参数 (n,m,l,s) 表达的期待值。\n3. 这为真空拓扑电磁系统建立了明确的量子-经典对应关系，启发后续对具有非平凡拓扑的量子光场态的实验与理论研究。", "summary_source": "deepseek", "authors": [{"name": "Gabriel Canadas da Silva"}, {"name": "Ion Vasile Vancea"}], "featured_authors": [{"name": "Gabriel Canadas da Silva"}, {"name": "Ion Vasile Vancea"}], "author_count": 2}, {"id": "2605.15439", "category": "quant-ph", "title": "Additivity Results for the Rényi-2 Entanglement of Purification", "abstract": "We reformulate the Rényi entanglement of purification as a constrained minimum output Rényi entropy problem. Equivalently, for $p>1$, this formulation can be expressed in terms of a constrained maximal output Schatten $p$-norm. More precisely, for a completely positive map $\\Omega:L(B')\\to L(A)$, we consider the quantity $\\upsilon_p(\\Omega)$ defined by optimizing $\\|(\\Omega\\otimes \\mathrm{id}_E)(\\sigma^{B'E})\\|_p$ over all bipartite states $\\sigma^{B'E}$ whose $B'$-marginal is maximally mixed. We focus on the case $p=2$. First, we compute $\\upsilon_2$ for the transpose-depolarizing channel and prove that it is multiplicative under tensor powers. We then establish a general multiplicativity criterion: whenever a completely positive map $N:L(B')\\to L(A)$ satisfies $N^{\\dagger} \\mathbin{\\circ} N=a\\,\\mathrm{id}_A+b\\,\\mathrm{Tr}[\\cdot]\\,I_d$ for some constants $a,b\\ge 0$, where $N^{\\dagger}$ denotes the Hilbert-Schmidt adjoint of $N$, the quantity $\\upsilon_2(N)$ is multiplicative under tensor powers. Examples of channels satisfying this criterion include the transpose-depolarizing channel, the depolarizing channel, and their respective complementary channels. Furthermore, we show that, for every completely positive map $\\Omega$, multiplicativity of $\\upsilon_p(\\Omega)$ implies multiplicativity for its complementary map. This yields the corresponding additivity statements for the associated Rényi-2 entanglement of purification.", "url": "https://arxiv.org/abs/2605.15439", "type": "理论+数值", "summary": "1. 该工作将Rényi-2纠缠纯化重新表述为约束最小输出熵问题，并证明其可乘性等价于完全正映射的张量幂可乘性。\n2. 技术关键在于建立可乘性准则：当映射N满足N†∘N = a id_A + b Tr[·] I_d时，υ₂(N)在张量幂下可乘，该准则适用于转置退极化与退极化信道。\n3. 这为纠缠纯化的可加性提供了严格证明，并启发将此类结构推广至其他Rényi指数及量子信息处理中的信道组合。", "summary_source": "deepseek", "authors": [{"name": "Shokoufe Faraji"}, {"name": "Zahra Baghali Khanian"}], "featured_authors": [{"name": "Shokoufe Faraji"}, {"name": "Zahra Baghali Khanian"}], "author_count": 2}, {"id": "2605.15476", "category": "quant-ph", "title": "Quantum Circuit Synthesis Using an Exact T Library", "abstract": "In fault-tolerant quantum circuit synthesis, T gates supplied via magic states dominate space-time cost, while Clifford gates incur negligible overhead. Conventional flows minimize AND count in an {XOR, AND, NOT} basis as a proxy for T, which neglects phase cancellation and can be far from T-optimal. We instead formulate an exact T synthesis problem and canonicalize Boolean functions under Clifford equivalence. By precomputing T-optimal implementations up to seven variables and developing a customized mapper, we reduce the T count by up to 14.3% on EPFL benchmarks and improve the T counts of several cryptographic modules by up to 40%.", "url": "https://arxiv.org/abs/2605.15476", "type": "理论", "summary": "1. 该工作针对容错量子电路综合中的T门优化问题，提出基于精确T库的综合方法，并利用Clifford等价类规范化布尔函数。\n2. 其核心在于预计算最多七变量的T最优实现并开发定制映射器，在EPFL基准测试中T计数降低14.3%，密码模块最高降低40%。\n3. 这为超越传统AND计数代理的T门精确优化提供了可行路径，可启发未来容错量子算法的门级设计。", "summary_source": "deepseek", "authors": [{"name": "Hanyu Wang"}, {"name": "Mingfei Yu"}, {"name": "Xinrui Wu"}, {"name": "Jason Cong"}], "featured_authors": [{"name": "Hanyu Wang"}, {"name": "Mingfei Yu"}, {"name": "Xinrui Wu"}, {"name": "Jason Cong"}], "author_count": 4}, {"id": "2605.15658", "category": "quant-ph", "title": "Wave packet landscape in linear open quantum systems", "abstract": "We develop a quantum landscape approach to characterize the long-time behavior of wave packet spreading in linear open quantum systems. Instead of treating diffusion, localization, and collapse of the wave packet as separate dynamical phenomena, we show that they originate from the symmetry structure of an underlying landscape in covariance space. The geometry of this landscape determines these distinct long time behaviors. Trapping potentials and bath fluctuations act as distinct symmetry-breaking perturbations, leading to noncommuting long-time limits and abrupt changes in the asymptotic wave-packet width. This geometric picture provides a unified origin for wave-packet diffusion, localization, and collapse in dissipative quantum dynamics.", "url": "https://arxiv.org/abs/2605.15658", "type": "理论", "summary": "1. 该工作发展了一个量子景观方法，用于统一描述线性开放量子系统中波包扩散的长时间行为。\n2. 其核心在于揭示了协方差空间中的景观对称性结构是扩散、局域化与坍塌现象的共同起源。\n3. 这为理解陷阱势与热库涨落作为对称性破缺扰动导致的非对易极限与波包宽度突变提供了几何解释。", "summary_source": "deepseek", "authors": [{"name": "Kang Xu"}, {"name": "Miao-Miao Yi"}, {"name": "Zi-Hong Yan"}, {"name": "C. P. Sun"}], "featured_authors": [{"name": "Kang Xu"}, {"name": "Miao-Miao Yi"}, {"name": "Zi-Hong Yan"}, {"name": "C. P. Sun"}], "author_count": 4}, {"id": "2605.15747", "category": "quant-ph", "title": "Quantum game theory for 2 2 games: a mathematical framework", "abstract": "We develop a rigorous mathematical framework for quantum game theory applied to static 2x2 games, extending classical concepts to the quantum setting where players may employ arbitrary unitary operations (pure strategies) or probability measures over the continuous group SU(2) (mixed strategies). The Eisert-Wilkens-Lewenstein protocol is introduced as the standard implementation of quantum 2x2 games. We prove the existence of Nash equilibria for continuous quantum mixed strategies via a fixed-point argument, generalising the classical Nash theorem to the quantum case.", "url": "https://arxiv.org/abs/2605.15747", "type": "理论", "summary": "1. 该工作为静态2×2量子博弈建立了严格数学框架，将经典博弈论扩展至量子设置，其中玩家可采用任意酉变换（纯策略）或SU(2)群上的概率测度（混合策略）。\n2. 其技术核心在于通过Eisert-Wilkens-Lewenstein协议实现量子博弈，并利用不动点论证证明连续量子混合策略下Nash均衡的存在性，从而推广经典Nash定理。\n3. 这为量子博弈的严格分析提供了数学基础，启发后续研究深入探索更广泛量子策略空间及其在量子信息中的可能应用。", "summary_source": "deepseek", "authors": [{"name": "Gloria Ferraris"}, {"name": "Veronica Umanità"}], "featured_authors": [{"name": "Gloria Ferraris"}, {"name": "Veronica Umanità"}], "author_count": 2}, {"id": "2605.15785", "category": "quant-ph", "title": "Dynamical aspects of steady-state subradiance: Detailed balance and its breakdown", "abstract": "The dynamics of dissipative many-body quantum systems sometimes admit an emergent classical description in terms of a Markov chain even though the corresponding state space contains highly entangled states. In particular, a bad-cavity laser is a paradigm system whose dynamics can be formulated as a Markov chain in a two-dimensional state space spanned by collective angular momentum states. In this article, we investigate the connection between a dissipative phase transition that occurs in the subradiant regime of this system in the large atom number limit, and the properties of the underlying Markov chain. In one of the phases, the Markov chain approaches the detailed-balance condition with increasing atom number $N$ and hence becomes effectively time-reversible. This is caused by a collective atomic emission process that effectively reduces the Markov chain to one dimension. In the other phase, we find the emergence of time-asymmetric probability currents in the two-dimensional state space that signals a breakdown of detailed balance. This is accompanied by a macroscopic internal entropy production rate in the Markov chain that scales extensively with the atom number $N$. An observable consequence of the probability currents is a self-pulsing of the cavity light output in this phase, which can be detected as an anti-correlation dip in the intensity correlation function.", "url": "https://arxiv.org/abs/2605.15785", "type": "理论", "summary": "1. 该工作通过马尔可夫链框架研究了耗散多体量子系统稳态亚辐射中的动力学，聚焦于细致平衡条件的成立与破坏。\n2. 其核心在于揭示集体原子发射过程将马尔可夫链约化至一维从而满足详细平衡，而另一相中出现与原子数线性相关的宏观内熵产生及时间不对称概率流。\n3. 这提供了通过腔光输出自脉动与强度关联函数反关联峰直接观测细致平衡破坏的实验途径，推动了量子光学中非平衡相变研究。", "summary_source": "deepseek", "authors": [{"name": "Athreya Shankar"}, {"name": "Simon B. Jäger"}, {"name": "Jarrod T. Reilly"}, {"name": "Raphael Kaubruegger"}, {"name": "Murray J. Holland"}, {"name": "Walter Hahn"}], "featured_authors": [{"name": "Athreya Shankar"}, {"name": "Simon B. Jäger"}, {"name": "Jarrod T. Reilly"}, {"name": "Raphael Kaubruegger"}, {"name": "Murray J. Holland"}, {"name": "Walter Hahn"}], "author_count": 6}, {"id": "2605.15863", "category": "quant-ph", "title": "Gauge-Engineered Tunable Mode Selection in Non-Hermitian Directed-Graph Networks", "abstract": "Non-Hermitian physics enables novel control over open quantum and wave systems, but selectively isolating individual modes without delicate balancing of gain and loss remains challenging. Here we introduce a gauge-engineering method in directed-graph networks that support geometry-protected pure decay modes-eigenstates exhibiting smooth exponential amplitude decay along directed paths. In fully connected configurations, a single dominant mode naturally emerges with a large, tunable energy gap from the rest. By adding synthetic gauge fields via phase-compensated non-reciprocal hopping, we can promote any desired pure decay mode to the dominant position, while preserving its amplitude profile. The approach extends to simultaneous selection of paired modes in half-connected graphs and customizable multi-mode distributions in higher dimensions via orthogonal folding. Our method enables robust, loss/gain-free control over mode profiles, advancing applications in single-mode lasers, sensors, and quantum processing.", "url": "https://arxiv.org/abs/2605.15863", "type": "理论", "summary": "1. 本文提出规范工程方法，在有向图网络中实现无需增益-损耗平衡的可调模式选择。\n2. 通过非互易跃迁添加合成规范场，可任意提升几何保护的纯衰变模式至主导态并保持其幅值分布。\n3. 该方法进一步拓展至成对与多维模式配置，为鲁棒单模激光、传感器及量子处理提供全新路径。", "summary_source": "deepseek", "authors": [{"name": "Wenwen Liu"}, {"name": "Zhang Shuang"}], "featured_authors": [{"name": "Wenwen Liu"}, {"name": "Zhang Shuang"}], "author_count": 2}, {"id": "2605.15953", "category": "quant-ph", "title": "Fast convergence of Dynamic Capacities of GNS-Symmetric Quantum Channels", "abstract": "We consider a quantum system described by a quantum channel $\\Phi$ that is applied at every time step and study the time evolution of its information capacities. When $\\Phi$ is a GNS-symmetric channel (this includes Pauli channels, for example), we give explicit exponential convergence bounds for the classical and quantum capacities. These bounds are in terms of entropic properties of $\\Phi$. We further illustrate how these results help quantify the performance of active versus passive error-correction setups.", "url": "https://arxiv.org/abs/2605.15953", "type": "理论", "summary": "1. 该工作研究了GNS对称量子信道（含Pauli信道）在逐时间步应用下经典与量子容量随时间演化的指数收敛行为。\n2. 其技术核心在于利用信道熵性质导出容量收敛的显式指数界，并揭示收敛速率与信道结构的关系。\n3. 这为主动与被动纠错方案的性能量化对比提供了严谨的理论框架，启发更精细的量子通信系统设计。", "summary_source": "deepseek", "authors": [{"name": "Omar Fawzi"}, {"name": "Li Gao"}, {"name": "Mizanur Rahaman"}, {"name": "Mostafa Taheri"}], "featured_authors": [{"name": "Omar Fawzi"}, {"name": "Li Gao"}, {"name": "Mizanur Rahaman"}, {"name": "Mostafa Taheri"}], "author_count": 4}, {"id": "2605.15969", "category": "quant-ph", "title": "Quantum mechanics for classical transport equations", "abstract": "Classical transport equations with probabilistic initial conditions can be viewed as quantum systems. In a discrete version they are probabilistic automata. The time-local probabilistic information is encoded in a classical wave function. Its unitary evolution obeys a Schrödinger equation. Statistical observables are represented by operators which do not commute with the ones associated to classical observables. Examples are functions of the quantum energy or the quantum angular momentum. They are important conserved quantities. We construct a complex functional integral for the quantum system which describes the probabilistic classical transport equation. The characteristic features of quantum mechanics, as the superposition of wave functions, interference, the importance of phases, non-commuting operators or a unitary time evolution, are realized by probabilistic classical transport equations.", "url": "https://arxiv.org/abs/2605.15969", "type": "理论", "summary": "1. 该工作论证了具有概率初始条件的经典输运方程可视为量子系统，其时间局域概率信息由经典波函数编码并服从薛定谔方程。\n2. 核心在于经典输运方程实现了量子力学所有特征——波函数叠加、干涉、相位、非对易算符及幺正演化，且统计观测量对应不含经典对易关系的量子算符。\n3. 这为经典概率过程与量子形式体系的互通提供了严格构造，启发用量子力学工具解析输运现象中的守恒量与关联函数。", "summary_source": "deepseek", "authors": [{"name": "Christof Wetterich"}], "featured_authors": [{"name": "Christof Wetterich"}], "author_count": 1}, {"id": "2605.15982", "category": "quant-ph", "title": "Biorthogonal Dynamical Quantum Phase Transitions in a Non-Hermitian Kitaev Chain", "abstract": "Dynamical quantum phase transitions in non-Hermitian systems pose fundamental challenges due to the intrinsic biorthogonality of their eigenstates. In this work, we extend a biorthogonal framework to investigate dynamical quantum phase transitions in non-Hermitian topological superconductors. Taking the non-Hermitian Kitaev chain as a prototypical model, we construct an associated-state formalism and reformulate the Loschmidt rate function, dynamical topological order parameter, and dynamical Fisher zeros. Within this framework, we find that the critical times at which dynamical quantum phase transitions occur differ from those based on the conventional self-normal approaches. We further analyze momentum-resolved subsystems at critical momenta and demonstrate the robustness of the biorthogonal framework. Our work highlights the essential role of biorthogonality in nonequilibrium dynamics and establishes a consistent theoretical framework for dynamical quantum phase transitions in non-Hermitian topological superconductors.", "url": "https://arxiv.org/abs/2605.15982", "type": "理论+数值", "summary": "1. 该工作将双正交框架推广至非厄米Kitaev链，研究其动力学量子相变。\n2. 通过构建关联态形式并重新定义Loschmidt率函数与Fisher零点，发现临界时间显著偏离自归一方法的结果。\n3. 这为建立非厄米拓扑超导体非平衡动力学的一致理论框架提供了关键启发。", "summary_source": "deepseek", "authors": [{"name": "Haoran Gu"}, {"name": "Yubo Zhao"}, {"name": "Siyuan Cheng"}, {"name": "Yuee Xie"}, {"name": "Xiaosen Yang"}, {"name": "Yuanping Chen"}], "featured_authors": [{"name": "Haoran Gu"}, {"name": "Yubo Zhao"}, {"name": "Siyuan Cheng"}, {"name": "Yuee Xie"}, {"name": "Xiaosen Yang"}, {"name": "Yuanping Chen"}], "author_count": 6}, {"id": "2605.16010", "category": "quant-ph", "title": "Demonstration of a Multiplexing Trapped Ion Quantum Processing Unit", "abstract": "A fault-tolerant quantum computer is expected to require thousands of qubits. Trapped ion architectures provide a modular approach where the quantum register is divided into multiple subregisters connected by physically moving the corresponding ions. Transporting ions at scale comes with several challenges such as the need to connect thousands of control lines to an ion trap chip. Multiplexing the required control voltages from few input signals to multiple electrodes offers a solution to this wiring challenge. Here we demonstrate a quantum processing unit that combines a surface ion trap with a time multiplexer via a sample-and-hold technique that initially charges electrodes to fixed voltages and disconnects them during qubit operations. We characterize the unit's performance by measuring motional heating rates below one phonon per second in both open and closed switch configurations. We further characterize the sample and hold process and find that sampling intervals below 50 ms are sufficient to keep expected gate errors from decaying charges during the hold phase below $10^{-4}$. Our results indicate that the multiplexing scheme is compatible with high-fidelity operations.", "url": "https://arxiv.org/abs/2605.16010", "type": "实验", "summary": "1. 该工作展示了一种结合表面离子阱与时分复用技术的量子处理单元，通过采样保持方法实现电极电压的复用控制。\n2. 其技术核心在于开关断开后电极维持固定电压，在保持阶段测得运动加热率低于每秒一声子，且采样间隔小于50ms即可将门操作误差控制在10^{-4}以下。\n3. 这证明复用方案与高保真度操作兼容，为克服大规模离子阱芯片的布线瓶颈提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "F. Anmasser"}, {"name": "M. Abu Zahra"}, {"name": "K. Schüppert"}, {"name": "M. Pototschnig"}, {"name": "J. Wahl"}, {"name": "M. Dietl"}, {"name": "M. Pfeifer"}, {"name": "Y. Colombe"}, {"name": "J. Repp"}, {"name": "M. Brandl"}, {"name": "P. Schindler"}, {"name": "C. Rössler"}], "featured_authors": [{"name": "F. Anmasser"}, {"name": "M. Abu Zahra"}, {"name": "K. Schüppert"}, {"name": "M. Brandl"}, {"name": "P. Schindler"}, {"name": "C. Rössler"}], "author_count": 12}, {"id": "2605.16016", "category": "quant-ph", "title": "Beyond Commutativity: Redesigning Trotter Decomposition via Local Symmetry", "abstract": "The product formula, commonly known as Trotter decomposition, is a central tool for digital quantum simulation, whose performance depends critically on how the Hamiltonian is partitioned into tractable blocks. Standard decompositions typically rely on direct commutativity among Hamiltonian terms in a chosen operator representation, which can lead to large residual errors and deep circuits for complex, practically relevant many-body quantum systems. We address this fundamental bottleneck by introducing a new decomposition principle that goes beyond commutativity, grouping Hamiltonian terms into local three-site clusters according to the underlying SU(2) symmetry of the local dynamics. We show that three-site generators fall into at most four SU(2)-symmetry classes, each admitting an effective two-qubit SU(4) representation with exact and efficient implementations. By reducing the number of clusters, this decomposition principle substantially suppresses commutator-induced errors and circuit overhead while preserving underlying physical structures that commutativity-based decompositions may violate. We demonstrate the proposed method on several physically relevant spin-lattice models, where the reduced cluster structure can even realise the second-order product formula without doubling the circuit depth, as would be required by conventional decompositions. Numerical simulations of a Kagome Heisenberg model with triangular spin-chirality interactions show that the proposed method reduces both state infidelity and average spin-chirality bias by more than three orders of magnitude compared with conventional decompositions, while using substantially fewer gates. These results establish local symmetry as a flexible and practical design principle for product-formula simulation, opening a route to more accurate and hardware-efficient simulations of broader classes of many-body systems.", "url": "https://arxiv.org/abs/2605.16016", "type": "理论+数值", "summary": "1. 该工作提出基于局域SU(2)对称性的Trotter分解新原理，将哈密顿项分组为三格点簇以替代传统对易性分组。\n2. 其核心在于三格点生成元仅分四类SU(2)对称性类，每类可有效二比特SU(4)表示，从而在保持物理结构的同时抑制对易子误差并减少电路深度。\n3. 这为数字量子模拟提供通用设计原则，使二阶乘积公式无需加倍电路深度即能实现，有望显著提升复杂多体系统模拟的准确性与硬件效率。", "summary_source": "deepseek", "authors": [{"name": "Naoki Negishi"}, {"name": "Bo Yang"}], "featured_authors": [{"name": "Naoki Negishi"}, {"name": "Bo Yang"}], "author_count": 2}, {"id": "2605.16025", "category": "quant-ph", "title": "Beyond trace-class and Hilbert-Schmidt -- Interaction between operator ideals and von Neumann algebras in quantum physics", "abstract": "Starting from a thorough analysis of the conjugate $\\overline{H}$ of a complex Hilbert space $H$, including its significant importance regarding a representation of the tensor product of two complex Hilbert spaces and its impact to the theorem of Fréchet-Riesz over to a revisit of applications of nuclear and absolutely $p$-summing operators in algebraic quantum field theory (AQFT) in the sense of Araki, Haag and Kastler ($p=2$) and more recently in the framework of general probabilistic spaces ($p=1$), we will outline that Banach operator ideals in the sense of Pietsch, or equivalently tensor products of Banach spaces in the sense of Grothendieck are even lurking in the foundations and philosophy of quantum physics and quantum information theory. In particular, we concentrate on their importance in AQFT (Theorem 5.27). In doing so, we revisit the role of trace-class operators in quantum theory and construct the enveloping $\\tup{C}^\\adj$-algebra, corresponding to an arbitrarily given normed operator ideal (Proposition 5.3 and Theorem 5.5). Applications are presented, including a purely linear algebraic description of the quantum teleportation process, thereby showing a link to quantum information theory, also due to the emergence of the Hadamard-Walsh transform and the controlled NOT gate (Example 4.18). All Hilbert spaces discussed in this paper may be nonseparable (and hence infinite-dimensional).", "url": "https://arxiv.org/abs/2605.16025", "type": "理论", "summary": "1. 该工作系统分析了复数希尔伯特空间共轭、算子理想与冯·诺依曼代数在量子物理中的相互作用，特别考察了超越迹类与希尔伯特-施密特类算子的情形。\n2. 通过引入Pietsch的Banach算子理想与Grothendieck的Banach空间张量积框架，重新审视了迹类算子的基础地位，并构造了任意赋范算子理想对应的包络C*-代数。\n3. 这一框架统一了代数量子场论与量子信息论中的数学描述，为处理非可分希尔伯特空间上的量子过程提供了线性代数化的新视角。", "summary_source": "deepseek", "authors": [{"name": "Frank Oertel"}], "featured_authors": [{"name": "Frank Oertel"}], "author_count": 1}, {"id": "2605.16060", "category": "quant-ph", "title": "Mutually Unbiased Bases for Variational Quantum Initialization: Basis-Union Optimality and Adaptive Family Search", "abstract": "We study mutually unbiased bases (MUBs) as structured finite initialization and adaptation families for variational quantum algorithms. The main theoretical result is that, in every dimension admitting a complete set of MUBs, the complete MUB ensemble maximizes isotropic Gaussian random-Hamiltonian width among all unions of d+1 orthonormal bases in C^d. Equivalently, within this basis-union class, it gives the smallest expected best-of-set minimum for random-Hamiltonian minimization. The proof represents each orthonormal basis as a regular-simplex Gaussian block and uses a centered-convex Gaussian correlation inequality to show that the independent-block case, realized by complete MUBs, is stochastically extremal. We also record a radial extension for Hamiltonians H=RG with R nonnegative and independent, and the unrestricted qubit case, where complete qubit MUBs are globally optimal among arbitrary six-state ensembles by a Bloch-sphere/octahedron mean-width argument. We then separate this coverage theorem from variational training dynamics. For diagonal QUBO costs, the MUB-family dependence of a fully matched construction collapses; for the canonical b=0 label it reduces to ordinary X-mixer QAOA. The empirical method is therefore adaptive MUB-XRot warm-start QAOA rather than canonical matched-mixer MUB-QAOA. In a cross-problem benchmark over MaxCut, weighted MaxCut, MIS, weighted MIS, and knapsack, adaptive MUB-XRot is non-worse than standard QAOA in 80.0% of 1500 paired cases, with win/tie/loss 829/371/300 and mean decoded-ratio improvement +0.1616. A separate QRAO MaxCut study shows that bit-flip MUB-family search reaches mean relaxed ratio 0.921 and improves over the X-variational baseline by +0.0608. The evidence is quality-oriented and incurs substantial runtime overhead; no quantum-advantage claim is made.", "url": "https://arxiv.org/abs/2605.16060", "type": "理论+数值", "summary": "1. 该工作证明了完备互无偏基(MUB)集合在变分量子算法初始化中最大化高斯随机哈密顿量宽度，并发展了自适应MUB-XRot暖启动QAOA方案。\n2. 技术核心在于利用中心凸高斯相关不等式将正交基表示为高斯块，严格证明完备MUB在基并类中随机极值，并通过Bloch球八面体论证获得qubit情形全局最优。\n3. 这为变分量子初始化提供理论最优性保障，但需显著运行时开销；自适应族搜索可望提升混合量子-经典优化性能，未声称量子优势。", "summary_source": "deepseek", "authors": [{"name": "Abed Semre"}, {"name": "Steven Frankel"}], "featured_authors": [{"name": "Abed Semre"}, {"name": "Steven Frankel"}], "author_count": 2}, {"id": "2605.16074", "category": "quant-ph", "title": "When Noisy Quantum Order Finding Remains Recoverable for Shor's Algorithm", "abstract": "Order finding is the core subroutine of Shor's algorithm. On NISQ hardware, phase estimation output distributions are often distorted by noise, making correct order recovery difficult. We study recoverability in noisy order finding: given a measured precision-register distribution, when does standard classical post-processing still return the true order? We analyze 680 distributions from IBM quantum systems across problem instances and circuit settings. For each distribution, we apply continued-fraction post-processing with modular verification and define recoverability as whether the recovered order equals the true one. We characterize each distribution using four features: autocorrelation peak strength, normalized entropy, dominant verified mass fraction, and verified margin fraction. We evaluate these quantities using marginal feature comparisons, single-feature AUROC analysis, and multivariate tree-based classifiers. We use random-forest permutation importance to assess which quantities contribute distinct predictive information once the other features are known. To make classification behavior interpretable, we train a decision tree that exposes threshold rules for recoverable and non-recoverable distributions. We find that recoverability is strongly associated with residual comb-like structure in the measured distribution and the way verified probability mass is organized across candidate denominators. The dominant verified mass fraction is the strongest single-feature indicator of recoverability, and tree-based analysis shows it also provides the primary split in an interpretable threshold description. Some highly distorted distributions remain recoverable when one verified denominator dominates the post-processing mass, while some visibly structured distributions fail because classical post-processing favors an incorrect verified denominator.", "url": "https://arxiv.org/abs/2605.16074", "type": "理论+数值", "summary": "1. 该工作系统研究了含噪量子序查找中标准经典后处理仍能恢复真实序的条件，基于IBM量子系统680个分布，定义可恢复性并通过连分数与模块化验证进行判定。\n2. 通过提取自相关峰强度、归一化熵、主导已验证质量分数和已验证裕度四个特征，利用随机森林和决策树分析，发现主导已验证质量分数是可恢复性的最强单特征指标，且可恢复性与测量分布中残留梳状结构及已验证质量在候选分母上的组织方式强相关。\n3. 这一结果揭示了噪声量子相位估计输出分布的可恢复性物理机制，为NISQ环境下Shor算法序查找的经典后处理优化提供了可解释的阈值规则和定量判据。", "summary_source": "deepseek", "authors": [{"name": "Qingxin Yang"}, {"name": "Stefano Markidis"}], "featured_authors": [{"name": "Qingxin Yang"}, {"name": "Stefano Markidis"}], "author_count": 2}, {"id": "2605.16189", "category": "quant-ph", "title": "Quantum Solvers for Nonlinear Matrix Equations in Quantum Chemistry", "abstract": "We present a quantum algorithm for solving algebraic Riccati equations, with applications to quantum-chemical random-phase approximation (RPA) and higher-order RPA theories. Our method block-encodes stabilizing Riccati solutions via Riesz projectors onto invariant subspaces of an associated non-normal matrix, implemented using contour-integral resolvents and quantum singular value transformations. Applied to $m$-particle, $m$-hole RPA, our algorithm yields a block-encoding of the amplitude solution and estimates the electronic correlation-energy density with it. Under localized-orbital sparsity assumptions, the end-to-end cost scales linearly with system size and polynomially with excitation rank $m$, suggesting an exponential advantage in $m$ over plausible classical local-correlation heuristics. More broadly, this work provides a framework for quantum algorithms for nonlinear matrix equations in quantum chemistry and opens a possible route toward developing quantum algorithms for coupled-cluster theory.", "url": "https://arxiv.org/abs/2605.16189", "type": "理论+数值", "summary": "1. 该工作提出一个量子算法求解量子化学中的代数Riccati方程，用于随机相位近似(RPA)及高阶RPA理论，通过块编码获得稳定解。\n2. 技术上利用围道积分预解式和量子奇异值变换实现非正规矩阵不变子空间上的Riesz投影仪块编码，在局域轨道稀疏假设下使端到端成本随系统尺寸线性、随激发秩m多项式缩放，相对经典局域相关启发式有指数优势。\n3. 这为量子化学中非线性矩阵方程提供了可扩展的量子计算框架，并为发展耦合簇理论等低价态关联问题的量子算法开拓了可能路线。", "summary_source": "deepseek", "authors": [{"name": "Pablo Rodenas-Ruiz"}, {"name": "Andrew Zhao"}, {"name": "Joonho Lee"}], "featured_authors": [{"name": "Pablo Rodenas-Ruiz"}, {"name": "Andrew Zhao"}, {"name": "Joonho Lee"}], "author_count": 3}, {"id": "2605.16195", "category": "quant-ph", "title": "Efficient quantum algorithm for linear matrix differential equations and applications to open quantum systems", "abstract": "We present an efficient, nearly optimal quantum algorithm for solving linear matrix differential equations, with applications to the simulation of open quantum systems and beyond. For unitary or dissipative dynamics, the algorithm computes an entry of the solution matrix with query complexity $\\widetilde{\\mathcal{O}}(\\nu \\mathcal{L} t/\\epsilon)$, where the constant $\\nu$ depends on the problem parameters, $\\mathcal{L}$ involves a time integral of upper bounds on the norms of evolution operators, and $\\epsilon$ is the error. In particular, $\\nu \\mathcal{L}$ is linear in $t$ for unitary dynamics and can be a constant for dissipative dynamics. Our result contrasts prior quantum approaches for differential equations that typically require exponential time for this problem due to the encoding in a quantum state, which can lead to exponentially small amplitudes. We demonstrate the utility of the algorithm through an end-to-end application, namely the simulation of dissipative dynamics for non-interacting fermions, which can be extended to other quantum and classical systems. We compare with classical algorithms and give evidence of polynomial quantum speedups for systems in a lattice, which become more pronounced for systems with long-range interactions and can be shown to be exponential in general. We also provide a lower bound of $\\Omega(\\nu \\mathcal{L} t/\\epsilon)$ for unitary or dissipative dynamics that proves our algorithm is optimal up to logarithmic factors.", "url": "https://arxiv.org/abs/2605.16195", "type": "理论+数值", "summary": "1. 该工作提出一种求解线性矩阵微分方程的高效量子算法，查询复杂度为𝒪̃(𝜈ℒ𝑡/𝜖)，适用于幺正与耗散动力学。\n2. 其主要突破在于避免了将解编码于量子态导致的指数小振幅问题，且对耗散动力学复杂度可为常数，并被证明在log因子内最优。\n3. 该算法在非相互作用费米子耗散模拟中展现多项式至指数级量子加速，尤其适用于长程相互作用格点系统，为开放量子系统及经典系统仿真提供了近优方案。", "summary_source": "deepseek", "authors": [{"name": "Sophia Simon"}, {"name": "Dominic W. Berry"}, {"name": "Rolando D. Somma"}], "featured_authors": [{"name": "Sophia Simon"}, {"name": "Dominic W. Berry"}, {"name": "Rolando D. Somma"}], "author_count": 3}, {"id": "2605.16248", "category": "quant-ph", "title": "Local Softmax and Global Weights in Non-Boolean Event Structures", "abstract": "Softmax and related normalized response functions are widely used in choice theory, machine learning, and cognitive science. In non-Boolean event structures with overlapping contexts, however, local normalization does not automatically yield a global probability weight. We show that imposing single-valuedness on shared atoms -- equivalently, no-disturbance or consistent connectedness -- collapses generalized softmax rules to coordinate parametrizations of the strictly positive part of the admissible-weight polytope. Any strictly positive admissible weight can be represented in this way, while boundary weights arise as limits. Exotic weights that exceed classical or quantum bounds are therefore properties of the event structure and the chosen weight, not of the normalizing link. The resulting hierarchy separates local normalization, cross-context gluing, Cauchy--Gleason linearity, and physical or cognitive realizability.", "url": "https://arxiv.org/abs/2605.16248", "type": "理论+数值", "summary": "1. 该工作研究了非布尔事件结构中广义softmax局部归一化规则与全局概率权重的关系，指出在重叠上下文中仅局部归一化无法确保全局一致性，并引入共享原子单值性条件加以解决。\n2. 技术上，该条件使广义softmax规则坍缩为可容许权重多面体正部的坐标参数化，任何严格正可容许权重均可由此表示，边界权重作为极限，从而明确奇异权重源于事件结构而非归一化链接。\n3. 由此建立的层次结构清晰区分了局部归一化、跨上下文粘合、Cauchy-Gleason线性及物理认知可实现性，为选择理论、机器学习和认知科学中的概率建模提供了严谨的理论基础。", "summary_source": "deepseek", "authors": [{"name": "Karl Svozil"}], "featured_authors": [{"name": "Karl Svozil"}], "author_count": 1}, {"id": "2605.16249", "category": "quant-ph", "title": "The Collapse of Unentangled Stoquastic Merlin-Arthur Proof Systems", "abstract": "Entanglement and interference are among the most fundamental properties of quantum mechanics. In this work, we investigate the role and power of interference in the context of detecting entanglement. We do so from a computational complexity lens by proving that unentanglement gives no additional power to stoquastic Merlin-Arthur verification. For every polynomial number of provers $k=k(n)$, \\[ \\text{StoqMa}(k)=\\text{StoqMa} . \\] Conceptually, the proof separates the role of entanglement from the role of interference: once destructive interference is ruled out by stoquasticity, the product-state constraint can be absorbed into a polynomially larger one-witness stoquastic verification. The main analytic ingredient is a positive, value-based de Finetti theorem for separately symmetric extensions. If $M$ is an entrywise nonnegative positive semidefinite contraction on $A_1\\otimes\\cdots\\otimes A_k$, then the nonnegative product value of $M$ is approximated to additive error $\\epsilon$ by the largest eigenvalue of \\[ \\Pi_R^{<k} (M_{A_{1,1}\\cdots A_{k-1,1}A_k}\\otimes I) \\Pi_R^{<k}, \\qquad R=O\\!\\left(\\frac{k^2\\sum_i\\log\\dim A_i}{\\epsilon^3}\\right), \\] where $\\Pi_R^{<k}$ is the operator on $A_1^{\\otimes R} \\otimes \\cdots \\otimes A_{k-1}^{\\otimes R} \\otimes A_k$ projecting to the subspace $\\mathrm{Sym}^R(A_1) \\otimes \\cdots \\otimes \\mathrm{Sym}^{R}(A_{k-1}) \\otimes A_k$. The spectral relaxation is then realized as an actual one-witness stoquastic verifier. After replacing the uniform permutation averages in the symmetric projectors by inverse-polynomially close dyadic inverse-invariant averages. Consequently, \\[ \\text{StoqMa}(k)=\\text{StoqMa}\\subseteq\\text{AM}\\cap\\text{PP}\\subseteq\\text{PSPACE} . \\] The positive de Finetti theorem is isolated as a standalone technique and may be useful in other nonnegative tensor-optimization and stoquastic-verification settings.", "url": "https://arxiv.org/abs/2605.16249", "type": "理论+数值", "summary": "1. 该工作从计算复杂性角度证明，对于任意多项式个非纠缠证明者，stoquastic Merlin-Arthur验证系统并未获得额外能力，即StoqMA(k)=StoqMA。\n2. 其核心是通过分离纠缠与干涉的作用：借助stoquastic性排除相消干涉后，乘积态约束可被吸收进由正的基于值的de Finetti定理在对称扩张上近似得到的谱松弛，并实现为单证stoquastic验证器。\n3. 正de Finetti定理可作为独立工具用于非负张量优化与stoquastic验证，该结果将StoqMA定位于AM∩PP内，深化了无相消干涉条件下纠缠非计算优势的认知。", "summary_source": "deepseek", "authors": [{"name": "William Gay"}, {"name": "Fernando Granha Jeronimo"}], "featured_authors": [{"name": "William Gay"}, {"name": "Fernando Granha Jeronimo"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
