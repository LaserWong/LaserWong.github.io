<head>

  <title>arXiv 2026-05-18 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2605.15283", "category": "cond-mat", "title": "Stochastic Safety Limits and Scale-Dependent Power Fluctuations in Nuclear Reactors: A Critical Scaling Approach", "abstract": "Applying boundary functionals of random risk processes to various physical problems makes it possible to determine many important characteristics of these problems. For example, a special case of boundary functionals is the time to first reach a level, which is widely and successfully applied to a variety of problems. We consider the application of boundary functionals to solving nuclear safety problems. In situations such as reactor startup, as well as for certain types of reactors, neutron behavior changes. Neutron clustering begins to play an important role, and the distributions characterizing neutron behavior change. The normal Gaussian distribution is replaced by stable limiting, distributions to which the sums of random variables converge. Boundary functionals allow us to accurately calculate the statistics of random events, determine the behavior of reactor power peaks, the probabilities of catastrophic power surges, and other quantities important for reactor safety, providing a mathematical bridge between the abstract theory of directed percolation and engineering calculations of protection parameters. This article examines the first-passage time to reach a certain level.", "url": "https://arxiv.org/abs/2605.15283", "type": "理论+数值", "summary": "1. 该工作将随机风险过程的边界泛函应用于核反应堆安全分析，建立了首次到达时间与功率波动统计的关系。\n2. 其核心在于利用稳定极限分布描述中子群聚行为，揭示了功率尖峰和灾难性功率激增的概率特征。\n3. 这为连接有向渗流理论与反应堆保护参数工程计算提供了数学框架，可启发临界尺度下的安全极限设计。", "summary_source": "deepseek", "authors": [{"name": "V. V. Ryazanov"}], "featured_authors": [{"name": "V. V. Ryazanov"}], "author_count": 1}, {"id": "2605.15292", "category": "cond-mat", "title": "Zitterbewegung velocity in semiclassical electron dynamics", "abstract": "Zitterbewegung plays a major role in electron dynamics in solids, yet is not captured in conventional semiclassical treatments. Here, starting from the quantum Liouville equation, I identify a new Zitterbewegung velocity, which involves the symmetric and antisymmetric components of the quantum geometric tensor oscillating out of phase. The Zitterbewegung velocity resolves the position-shift paradox, recovering the field-induced shift in an electron's position by integrating the semiclassical equations, and is directly related to the famous minimum conductivity of massless Dirac fermions.", "url": "https://arxiv.org/abs/2605.15292", "type": "理论", "summary": "1. 该工作从量子Liouville方程出发，在半经典电子动力学中识别出一个新的Zitterbewegung速度。\n2. 其卖点在于该速度涉及量子几何张量的对称与反对称分量振荡反相，并解决了位置偏移悖论。\n3. 这一速度与无质量狄拉克费米子的最小电导率直接相关，为固体中电子动力学提供了新的理解视角。", "summary_source": "deepseek", "authors": [{"name": "Dimitrie Culcer"}], "featured_authors": [{"name": "Dimitrie Culcer"}], "author_count": 1}, {"id": "2605.15381", "category": "cond-mat", "title": "Chemical Origins of Non-Bonded Interactions Within and Between Solids", "abstract": "Non-bonded interactions govern structure, stability, and function across a wide range of solid-state materials, yet their chemical origins are often difficult to resolve from total energies alone. Here we generalize absolutely localized molecular orbital energy decomposition analysis to quantify and interpret non-bonded interactions within and between solids at the density functional theory level. Across molecular crystals, moiré heterobilayers, and layered perovskite heterostructures, this framework separates lattice-formation energies, interlayer binding energies, and band-structure changes into chemically intuitive contributions from frozen interactions, polarization, and charge transfer. The analysis reveals how dispersion controls polymorph stability in pharmaceutical crystals, how local stacking modulates interlayer coupling in MoS2/WSe2, and how alkali-cation substitution switches the quantum-well character of layered perovskite heterostructures. By connecting emergent solid-state properties to microscopic interaction mechanisms, this framework provides a chemically transparent basis for understanding and designing complex materials.", "url": "https://arxiv.org/abs/2605.15381", "type": "理论+数值", "summary": "1. 该工作将绝对局域分子轨道能量分解分析推广至固体体系，从密度泛函理论层面定量解析固体内部及固体间的非键相互作用。\n2. 其核心在于将晶格形成能、层间结合能及能带结构变化拆解为冻结相互作用、极化和电荷转移三种化学直观贡献，并揭示色散力主导药物晶体多晶型稳定性、局部堆垛调制MoS₂/WSe₂层间耦合以及碱阳离子替换切换层状钙钛矿量子阱特性的微观机制。\n3. 该框架为连接固态宏观性质与微观非键相互作用提供化学透明的分析基础，有助于指导复杂功能材料的理性设计。", "summary_source": "deepseek", "authors": [{"name": "Paul J. Robinson"}, {"name": "Adam Rettig"}, {"name": "Hieu Q. Dinh"}, {"name": "Anton Z. Ni"}, {"name": "Joonho Lee"}], "featured_authors": [{"name": "Paul J. Robinson"}, {"name": "Adam Rettig"}, {"name": "Hieu Q. Dinh"}, {"name": "Anton Z. Ni"}, {"name": "Joonho Lee"}], "author_count": 5}, {"id": "2605.15441", "category": "cond-mat", "title": "Strong universality class in disordered systems", "abstract": "Disordered systems are very rich laboratories for exploring complex systems. In particular, disordered magnetic systems have been extremely important in the last five decades for understanding a wide range of phenomena. In this work, we use the Edwards-Anderson Hamiltonian to obtain the thermodynamic properties of disordered magnetic systems. In this way, we conduct a systematic investigation of magnetization, correlation functions, order parameter, and fractal dimensions, in function of disorder. In this context, the autocorrelation function for order--parameter fluctuations, introduced by Fisher ( Journal of Mathematical Physics 5, 944322 (1964)), provides an important mathematical framework for understanding the second-order phase transition at equilibrium. However, his analysis is restricted to a Euclidean space of dimension $d$, and an exponent $\\eta$ is introduced to correct the spatial behavior of the correlation function at $T=T_c$. In recent work, Lima et al ( Phys. Rev. E 110, L062107 (2024)) demonstrated that at $T_c$ a fractal analysis is necessary for a complete description of the correlation function. We use Monte Carlo simulations to validate analytical results and to show how disorder alters critical exponents , giving rise to different universality classes. On the other hand, there is a subgroup of critical exponents and fractal dimensions that are invariant with disorder. This subgroup heralds a strong universality class.", "url": "https://arxiv.org/abs/2605.15441", "type": "理论+数值", "summary": "1. 该工作利用Edwards-Anderson哈密顿量，通过蒙特卡洛模拟系统研究了无序磁性系统的热力学性质，发现一组不随无序变化的临界指数和分形维数，定义强普适类。\n2. 核心在于结合Fisher的序参量涨落自关联函数与分形分析，揭示无序虽改变临界指数，却存在一个对无序保持不变的临界指数子集与分形维数子群。\n3. 这为从相变理论统一理解无序系统提供了新视角，启发后续探索更多体系中强普适类的存在性及其物理根源。", "summary_source": "deepseek", "authors": [{"name": "Henrique A Lima"}, {"name": "Kaue Hermann"}, {"name": "Ismael S. S. Carrasco"}, {"name": "Jairo R. L. de Almeida"}, {"name": "Fernando A. Oliveira"}], "featured_authors": [{"name": "Henrique A Lima"}, {"name": "Kaue Hermann"}, {"name": "Ismael S. S. Carrasco"}, {"name": "Jairo R. L. de Almeida"}, {"name": "Fernando A. Oliveira"}], "author_count": 5}, {"id": "2605.15447", "category": "cond-mat", "title": "Multifractal and Ergodic Properties of Conductance Fluctuations under Strong Disorder", "abstract": "Understanding the stochastic properties of conductance fluctuations in disordered mesoscopic systems is fundamental to quantum transport. In this work, we investigate the multifractal and ergodic properties of the fictitious time series of conductance in two-dimensional tight-binding models under varying Anderson disorder. Using standard multifractal analysis, we show that conductance fluctuations exhibit a transition from non-ergodic to ergodic behavior as the disorder strength increases, as evidenced by the decay of the conductance correlation function. Remarkably, multifractality persists in both regimes; however, it becomes insensitive to shuffling in the strong-disorder (ergodic) regime, suggesting that distributional effects dominate temporal organization. On the contrary, in the weakly disordered (non-ergodic) regime, long-range correlations play a significant role. These findings are robust against changes in lead geometry (asymmetric vs. symmetric). Our results provide new insights into the interplay between ergodicity, multifractality, and rare events in disordered quantum transport.", "url": "https://arxiv.org/abs/2605.15447", "type": "理论", "summary": "1. 该工作利用标准多重分形分析，研究了二维紧束缚模型在强Anderson无序下电导涨落的遍历与多重分形性质。\n2. 主要发现电导涨落随无序增强经历从非遍历到遍历的转变，且多重分形性在两种区域均存在，但强无序时对洗牌不敏感，揭示分布效应主导而非长程时间相关。\n3. 这些结果为理解无序量子输运中遍历性破缺、多重分形持存以及罕见事件的影响提供了新视角，并验证了对引线几何的鲁棒性。", "summary_source": "deepseek", "authors": [{"name": "Marcos A. A. de Sousa"}, {"name": "Heitor R. Publio"}, {"name": "Henrique A. de Lima"}, {"name": "Adauto J. F. de Souza"}, {"name": "Fernando A. Oliveira"}, {"name": "Anderson L. R. Barbosa"}], "featured_authors": [{"name": "Marcos A. A. de Sousa"}, {"name": "Heitor R. Publio"}, {"name": "Henrique A. de Lima"}, {"name": "Adauto J. F. de Souza"}, {"name": "Fernando A. Oliveira"}, {"name": "Anderson L. R. Barbosa"}], "author_count": 6}, {"id": "2605.15568", "category": "cond-mat", "title": "Local distortions as a source of piezoelectric/stiffness decoupling in B-doped AlScN", "abstract": "We present a first-principles analysis of the wurtzite pseudo-ternary (Al,Sc,B)N to elucidate the structural origin of a decoupling between stiffness $C_{33}$ and piezoelectric response $e_{33}$ upon boron incorporation, using DFT-relaxed 100-atom special quasirandom structures across a broad composition range. Pair distribution function analysis reveals interstitial threefold-coordinated boron atoms that have displaced from the tetrahedral cation site. Direct structural analysis establishes their preferential orientation along the $c$-axis and identifies a scandium-activated creation mechanism. The vertical coordination asymmetry of each cation is quantified through a site-specific axial asymmetry ratio (AAR), showing that boron incorporation progressively symmetrizes the Sc environment. Correlation with Born effective charges demonstrates that this symmetrization is the mechanism behind the piezoelectric enhancement.", "url": "https://arxiv.org/abs/2605.15568", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算，分析了B掺杂AlScN纤锌矿伪三元体系中局部畸变导致刚度C33与压电响应e33解耦的结构起源。\n2. 其卖点在于揭示间隙三配位硼原子沿c轴优先取向，并引入轴向不对称比定量描述Sc环境对称化，此对称化与Born有效电荷关联解释压电增强。\n3. 这为通过局域配位对称性调控压电-力学耦合性能提供了原子尺度机制，并启发在类似纤锌矿铁电材料中探索此类解耦效应。", "summary_source": "deepseek", "authors": [{"name": "Laszlo Wolf"}, {"name": "Geoff L. Brennecka"}, {"name": "Vladan Stevanović"}], "featured_authors": [{"name": "Laszlo Wolf"}, {"name": "Geoff L. Brennecka"}, {"name": "Vladan Stevanović"}], "author_count": 3}, {"id": "2605.15610", "category": "cond-mat", "title": "Non-Relativistic Spin-Orbit Interaction in Triplet Superconductors: Edelstein Effect and Spin Pumping by Electric Fields", "abstract": "Non-relativistic momentum-dependent spin splitting, as observed in collinear altermagnets and non-collinear $p$-wave magnets, provides exciting avenues for controlling spin dynamics. Here, we reveal a distinct form of non-relativistic ``spin-orbit coupling\" in triplet superconductors by demonstrating that the triplet order parameter induces a wave-vector-dependent spin texture of Bogoliubov quasiparticles, thereby entangling their orbital and spin motions. Even in the absence of relativistic spin-orbit coupling, this intertwining of spin and orbital motion allows an electric field to generate spin polarization in a $p$-wave superconductor -- that is, an Edelstein effect. Building on this mechanism, we propose an efficient scheme for the nonlinear generation of a DC spin current via electric near fields, driven by AC spin polarization and electron velocity. This general principle offers a powerful route for generating and manipulating spin currents in unconventional superconductors.", "url": "https://arxiv.org/abs/2605.15610", "type": "理论", "summary": "1. 该工作揭示了三重态超导体中由序参量诱导的波矢相关Bogoliubov准粒子自旋织构，从而形成一种非相对论性自旋轨道耦合，并预言其导致电场驱动的Edelstein效应。\n2. 核心卖点在于无需相对论自旋轨道耦合，仅凭三重态配对即可实现自旋与轨道运动的纠缠，并基于交流自旋极化与电子速度耦合提出近场电场非线性产生直流自旋电流的方案。\n3. 这为在非常规超导体中通过纯电学手段高效产生与操控自旋电流提供了通用原理，有望推动自旋电子学与超导量子技术的交叉发展。", "summary_source": "deepseek", "authors": [{"name": "Ping Li"}, {"name": "G. A. Bobkov"}, {"name": "I. V. Bobkova"}, {"name": "Tao Yu"}], "featured_authors": [{"name": "Ping Li"}, {"name": "G. A. Bobkov"}, {"name": "I. V. Bobkova"}, {"name": "Tao Yu"}], "author_count": 4}, {"id": "2605.15631", "category": "cond-mat", "title": "Topological property of graphene with triangular array of nanoholes", "abstract": "The nontrivial band topology for graphene with regular arrays of nanoholes with $C_{6v}$ symmetry is investigated theoretically. For the case of $3\\sqrt{3} \\times 3\\sqrt{3}$ triangular array of nanoholes, we find an energy gap at $\\Gamma$ point around the Fermi level associated with a band inversion which induces change in parity indices, whereas deep below the Fermi level there are a bunch of valence bands characterized as obstructed atomic limit (OAL) which also accommodate imbalance in parity indices. This band structure renders the gap at the Fermi level topologically trivial and carrying no edge states, while the nontrivial band topology of the OAL manifests in two flat bands in the ribbon structure associated with localized electronic states at ribbon edges. The present results exhibit rich topological behaviors in graphene derivatives waiting for explorations.", "url": "https://arxiv.org/abs/2605.15631", "type": "理论", "summary": "1. 该工作理论上研究了具有C6v对称性规则纳米孔阵列的石墨烯的拓扑能带性质，聚焦于3√3×3√3三角形排列情形。\n2. 其关键发现是费米能级附近能隙因带反转导致宇称指数变化但拓扑平庸，而深价带中受阻原子极限态的非平庸拓扑则表现为带状结构中的平带及边缘局域态。\n3. 这揭示了石墨烯衍生物中丰富的拓扑行为，为探索此类人工结构中隐藏的拓扑相与边缘态提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Yong-Cheng Jiang"}, {"name": "Xing-Xiang Wang"}, {"name": "Xiao Hu"}], "featured_authors": [{"name": "Yong-Cheng Jiang"}, {"name": "Xing-Xiang Wang"}, {"name": "Xiao Hu"}], "author_count": 3}, {"id": "2605.15667", "category": "cond-mat", "title": "A Finite-State Gibbs Construction from a Recognition Cost", "abstract": "On a finite outcome space, the canonical Gibbs distribution is usually obtained by maximizing Shannon entropy at fixed mean of an externally supplied energy functional. This paper studies the finite-state consequences of a ratio-cost construction instead: after adopting the normalized d'Alembert degree-two closure called the Recognition Composition Law (RCL), with unit log-curvature calibration at the reference ratio, the continuous nontrivial positive branch is $J(x)=\\tfrac12(x+x^{-1})-1=\\cosh(\\log x)-1$. Given the induced cost vector $X_\\omega=J(r_\\omega)$, multinomial counting and convex duality recover the finite-state Gibbs weights and the identity $F_{\\mathrm{R}}(q)-F_{\\mathrm{R}}(p)=T_{\\mathrm{R}}\\,D_{\\mathrm{KL}}(q\\Vert p)$; the entropy-maximization steps are classical once the cost is fixed. New technical content includes a non-asymptotic Stirling bound and soft-shell constrained-type theorems for real-valued costs. A three-state example compares the Gibbs law to squared-log, affinity-as-energy, and Tsallis alternatives at the same cost vector and mean-cost constraint, with sample-size power calculations at fixed RCL ground truth. The framework is conditional on axioms (A1)--(A3) and restricted to finite outcome spaces with strictly positive weights; it does not derive the composition law from a more primitive principle.", "url": "https://arxiv.org/abs/2605.15667", "type": "理论+数值", "summary": "1. 该工作基于识别成本构造有限状态吉布斯分布，采用归一化d'Alembert二阶闭包Recognition Composition Law，以比率成本函数J(r)=½(r+r⁻¹)-1定义成本向量。\n2. 其技术核心是通过多项计数与凸对偶恢复吉布斯权重，导出自由能差与KL散度的线性身份F_R(q)-F_R(p)=T_R D_KL(q||p)，并推导非渐近斯特林界与软壳约束型定理。\n3. 这为比率成本驱动的统计力学推理提供了严谨基础，通过三态例子与平方对数、亲和能量等方法比较及样本量功率计算，启示了有限离散系统中的Gibbs构造拓展方向。", "summary_source": "deepseek", "authors": [{"name": "Megan Simons"}, {"name": "Jonathan Washburn"}], "featured_authors": [{"name": "Megan Simons"}, {"name": "Jonathan Washburn"}], "author_count": 2}, {"id": "2605.15730", "category": "cond-mat", "title": "Short-time critical dynamics in the classical cubic dimer model", "abstract": "The classical dimer model on the cubic lattice hosts a columnar ordered phase and a disordered Coulomb phase, separated by a continuous phase transition that lies beyond the conventional Landau-Ginzburg-Wilson paradigm. While its equilibrium critical properties have been extensively studied, the nonequilibrium critical dynamics of this model--particularly in the short-time regime--remains largely unexplored. In this work, we investigate the short-time critical dynamics near the transition using large-scale Monte Carlo simulations. By quenching the system from both ordered and disordered initial states with vanishing initial correlation length, we analyze the scaling behaviors of the order parameter and its time correlation function in the short-time stage. From these scaling behaviors, we accurately determine the critical temperature $T_c = 0.672(1)$ and the static critical exponent $\\beta/\\nu = 0.581(5)$ according to the scaling theory of the short-time dynamics. These results are in excellent agreement with previous equilibrium studies. Moreover, we extract the dynamic critical exponent $z = 1.92(1)$ and, notably, find a negative critical initial slip exponent $\\theta = -1.052(5)$. This unusual negative value contrasts sharply with the positive $\\theta$ typically observed in conventional critical dynamics. We attribute this anomalous behavior to the combined effects of the emergent SO(5) symmetry at criticality and the local U(1) gauge constraint (Gauss law), which enforces a conserved diffusive dynamics and enhances fluctuations in the short-time regime. Our results provide the first comprehensive characterization of nonequilibrium short-time criticality in the three-dimensional dimer model, shedding new light on the universal dynamical features of phase transitions beyond the Landau-Ginzburg-Wilson framework.", "url": "https://arxiv.org/abs/2605.15730", "type": "理论+数值", "summary": "1. 该工作利用大规模蒙特卡洛模拟，从有序和无序初始态淬火，研究了立方晶格经典二聚体模型连续相变中的短时临界动力学，并精确测定了临界温度Tc=0.672(1)及静态指数β/ν=0.581(5)。\n2. 其技术卖点在于提取了动态临界指数z=1.92(1)和反常负的初始滑移指数θ=-1.052(5)，后者源于临界点涌现的SO(5)对称性与局域U(1)规范约束所引入的守恒扩散动力学及短时增强涨落。\n3. 这一研究首次系统刻画了三维经典二聚体模型的非平衡短时临界性，为探索超越朗道-金茨堡-威尔逊范式的相变普适动力学提供了新的理论视角与数值基准。", "summary_source": "deepseek", "authors": [{"name": "Hu-Xiao Peng"}, {"name": "Zheng Yan"}, {"name": "Shuai Yin"}], "featured_authors": [{"name": "Hu-Xiao Peng"}, {"name": "Zheng Yan"}, {"name": "Shuai Yin"}], "author_count": 3}, {"id": "2605.15834", "category": "cond-mat", "title": "Effective increase of a superconducting critical temperature in a high-entropy electron mixture", "abstract": "We show theoretically that a superconducting critical temperature can be effectively increased in a high-entropy mixture of electrons belonging to conduction and valence bands. In order to employ the entropy of mixing into the superconducting phase dynamics, we suggest to use a metallic trap that removes quasiparticle excitations from the superconductor. This makes the concentration of Cooper pairs a dynamic variable of the entropy of mixing, and thus affects the Ginzburg-Landau functional of the superconductor effectively reducing the first expansion coefficient or, in other words, increasing the critical temperature.", "url": "https://arxiv.org/abs/2605.15834", "type": "理论", "summary": "1. 该工作理论上证明，通过高熵混合导带和价带电子可有效提高超导临界温度。\n2. 其核心在于利用金属陷阱移除准粒子激发，使库珀对浓度成为混合熵的动态变量，从而修正Ginzburg-Landau泛函并减小第一展开系数。\n3. 这为通过电子混合熵工程调控超导相变温度提供了新的理论途径。", "summary_source": "deepseek", "authors": [{"name": "Viktoriia Kornich"}], "featured_authors": [{"name": "Viktoriia Kornich"}], "author_count": 1}, {"id": "2605.15841", "category": "cond-mat", "title": "Critical quench dynamics of Wegner's $\\mathbb{Z}_2$ gauge model: a geometric perspective", "abstract": "Wegner's $\\mathbb{Z}_2$ gauge model is the earliest formulation of pure lattice gauge theory and predicts the topological nature of the confinement-deconfinement transition. In three dimensions ($D=3$), the equilibrium critical behavior of the model is understood in terms of geometrically defined objects, namely loop excitations and Fortuin-Kasteleyn (FK) clusters. This work investigates the critical quench dynamics of this model from a geometric perspective, following quenches from both a high-temperature percolation phase and the zero-temperature ground state. Using time-dependent finite-size scaling analysis, we find that the critical non-equilibrium relaxation of the percolation order parameter is governed by a dynamical exponent $z_{\\rm p} \\simeq 2.6$, consistent with that associated with the energy density, $z_{\\rm c}$. Importantly, the value of $z_{\\rm p}$ is robust with respect to the initial quench condition and the choice of geometrical objects. Furthermore, we provide a detailed characterization of the kinetics of different geometrical objects during the evolution from the percolation phase. Notably, we observe that the quench dynamics obeys dynamic scaling in terms of a growing lengthscale, $\\xi_{\\rm p}(t) \\sim t^{1/z_{\\rm p}}$, despite the absence of a local order parameter.", "url": "https://arxiv.org/abs/2605.15841", "type": "理论+数值", "summary": "1. 该工作从几何视角研究三维Wegner Z2规范模型在临界淬火后的非平衡弛豫动力学，初始条件包括高温渗流相和零温基态两种情形。\n2. 其核心贡献在于，通过环激发和Fortuin-Kasteleyn团簇等几何对象的序参量进行时间依赖有限尺寸标度，确定动力学指数z_p≈2.6，该值与能量密度动力学指数z_c一致，且对淬火初态与几何对象选择均呈现鲁棒性。\n3. 这一几何标度框架为在无局域序参量的系统中探索普适的动力学标度行为提供了新途径，相关预测有望在冷原子或量子模拟器上基于环状关联函数进行检验。", "summary_source": "deepseek", "authors": [{"name": "Ramgopal Agrawal"}, {"name": "Leticia F. Cugliandolo"}, {"name": "Marco Picco"}], "featured_authors": [{"name": "Ramgopal Agrawal"}, {"name": "Leticia F. Cugliandolo"}, {"name": "Marco Picco"}], "author_count": 3}, {"id": "2605.15884", "category": "cond-mat", "title": "Cycle affinity and winding localize eigenvalues of Markov generators", "abstract": "The complex eigenvalues of Markov generators govern oscillatory properties of relaxation, autocorrelation, and linear response. Here we show that these eigenvalues are localized by nonequilibrium cycles of the generator, thus revealing a fundamental tradeoff between thermodynamic driving, oscillation, and decay of eigenmodes. Specifically, we prove that each complex eigenvalue is confined to a region determined by the cycle affinity and the eigenvector ``winding number'' of some nonequilibrium cycle. In unicyclic systems, we also demonstrate that the winding number coincides with the ordered eigenvalue index, yielding new thermodynamic bounds on the slowest and fastest relaxation modes. In multicyclic systems, our approach unifies and extends several previous inequalities and proves the Uhl--Seifert ellipse conjecture.", "url": "https://arxiv.org/abs/2605.15884", "type": "理论", "summary": "1. 该工作证明了马尔可夫生成元的复特征值被非平衡循环的亲和性与本征矢量绕数局域化，揭示了热力学驱动与振荡衰减间的根本权衡。\n2. 其核心在于给出特征值由循环亲和及绕数限定的区域，并在单循环系统中证明绕数等于有序指标，导出弛豫模式的新热力学界。\n3. 这统一并扩展了多项不等式，证明了Uhl-Seifert椭圆猜想，为非平衡系统振荡与弛豫的普适约束提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Artemy Kolchinsky"}, {"name": "Naruo Ohga"}, {"name": "Sosuke Ito"}], "featured_authors": [{"name": "Artemy Kolchinsky"}, {"name": "Naruo Ohga"}, {"name": "Sosuke Ito"}], "author_count": 3}, {"id": "2605.15899", "category": "cond-mat", "title": "Solving Classical and Quantum Spin Glasses with Deep Boltzmann Quantum States", "abstract": "Variational neural network models have achieved remarkable success in solving ground-state problems of quantum many-body systems. However, addressing classical and quantum spin glasses remains challenging, as disorder and energy frustration give rise to an exponentially large number of local energy minima separated by high-energy barriers, hindering the efficiency of conventional Metropolis-based Monte Carlo methods. To bridge this gap, we introduce Deep Boltzmann Quantum States, a class of neural quantum states inspired by deep Boltzmann machines that inherit efficient block Gibbs sampling. We also propose two key advances in the training algorithm. Firstly, we combine natural-gradient updates with state-of-the-art stochastic optimizers. Secondly, we gradually tune the hardness of the problem Hamiltonian by interpolating from an easy to a hard regime, without the need to closely approximate the instantaneous adiabatic state at intermediate times. We match the exact solution or the best available estimate for several instances of classical and quantum Ising spin-glass models with infinite-range interactions and hundreds of spins. We also solve instances of the NP-hard Job Shop Scheduling Problem exceeding the current limitations of quantum annealing hardware. To summarize, deep neural architectures with efficient global update rules and trained within an annealing-like scheme, provide a powerful framework for solving real-world hard combinatorial optimization and for investigating disordered quantum many-body systems.", "url": "https://arxiv.org/abs/2605.15899", "type": "理论+数值", "summary": "1. 该工作提出深度玻尔兹曼量子态类神经网络变分方法，用于求解经典与量子自旋玻璃模型的基态问题。\n2. 关键创新在于融合自然梯度更新与先进随机优化器，并通过哈密顿量从易到难插值实现退火式训练，无需近似瞬时绝热态。\n3. 此框架在无限范围相互作用伊辛模型及NP难作业调度问题上超越当前量子退火硬件极限，为受挫量子多体系统与组合优化提供有效工具。", "summary_source": "deepseek", "authors": [{"name": "Luca Leone"}, {"name": "Arka Dutta"}, {"name": "Markus Heyl"}, {"name": "Enrico Prati"}, {"name": "Pietro Torta"}], "featured_authors": [{"name": "Luca Leone"}, {"name": "Arka Dutta"}, {"name": "Markus Heyl"}, {"name": "Enrico Prati"}, {"name": "Pietro Torta"}], "author_count": 5}, {"id": "2605.15903", "category": "cond-mat", "title": "Active Model B$^-$ from Mass-Conserving Reaction-Diffusion Systems", "abstract": "We show that the late-time dynamics of a minimal three-component mass-conserving reaction--diffusion system reduce to a scalar active field theory, Active Model B$^-$ (AMB$^-$), in which a density-dependent interfacial coefficient $\\kappa(\\phi)$ turns negative at high density. This drives a finite-wavelength instability and stabilises microphase-separated patterns, in contrast to the unbounded coarsening of two-component mass-conserving systems. Unlike Active Model B$^+$, AMB$^-$ retains a chemical potential that remains a state function, inherited from the underlying conservation law, but admits no equation of state for the pressure.", "url": "https://arxiv.org/abs/2605.15903", "type": "理论", "summary": "1. 该工作证明，最小三组分质量守恒反应扩散系统的晚期动力学可简化为标量活性场论Active Model B⁻。\n2. 关键卖点在于密度依赖的界面系数κ(φ)在高密度区变负，驱动有限波长不稳定并稳定微相分离图案，且化学势仍为状态函数但压力无状态方程。\n3. 这为活性物质中基于守恒动力学的微相分离机制提供了理论框架，并启示了非平衡态物质中状态方程失效的普遍性。", "summary_source": "deepseek", "authors": [{"name": "Davide Toffenetti"}, {"name": "Beatrice Nettuno"}, {"name": "Henrik Weyer"}, {"name": "Erwin Frey"}], "featured_authors": [{"name": "Davide Toffenetti"}, {"name": "Beatrice Nettuno"}, {"name": "Henrik Weyer"}, {"name": "Erwin Frey"}], "author_count": 4}, {"id": "2605.15914", "category": "cond-mat", "title": "The Directed Abelian Sandpile Model on Cylinders", "abstract": "We study the abelian sandpile model in two dimensions on a directed cylindrical lattice with periodic transverse boundary conditions in the transverse direction and dissipation at one boundary. Recurrent configurations form a finite abelian group, and repeated grain addition at a specific site generates deterministic dynamics on this group. Using Dhar's formulation, the sandpile group is identified with the co-kernel of the reduced directed Laplacian. We show that the group structure admits an exact reduction to a transverse problem, allowing complete determination of its cyclic decomposition. Our results establish a direct connection between the algebraic structure of the sandpile group and the periodicity of the driven dynamics, establishing the manner in which the underlying algebraic structure governs both deterministic and stochastic evolution in directed sandpile.", "url": "https://arxiv.org/abs/2605.15914", "type": "理论", "summary": "1. 该工作研究了圆柱上有向阿贝尔沙堆模型的群结构及其驱动动力学。\n2. 其技术核心在于将沙堆群约化为横向问题并完全确定循环分解，直接联系了代数结构与动力学周期性。\n3. 这为理解有向沙堆中代数结构支配确定性与随机演化提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Abdul Quadir"}, {"name": "Nikita Kalinin"}, {"name": "Ram Ramaswamy"}], "featured_authors": [{"name": "Abdul Quadir"}, {"name": "Nikita Kalinin"}, {"name": "Ram Ramaswamy"}], "author_count": 3}, {"id": "2605.15930", "category": "cond-mat", "title": "Bak--Tang--Wiesenfeld model for various topologies and ranges of interaction", "abstract": "In this paper, the Bak--Tang--Wiesenfeld model for various substrate topologies and a variety of neighborhoods is reconsidered. With computer simulation, we study the distribution of avalanche sizes. Using the Z-score we confirm that independently of the substrate topology and the range of neighborhood, the exponent that governs the power law of the probability distribution of the size of avalanches is the same and approximately equal 1.208(39). However, this requires a smartly chosen number of deposited grains in relation to the linear size of the system.", "url": "https://arxiv.org/abs/2605.15930", "type": "理论+数值", "summary": "1. 该工作重新考察了Bak–Tang–Wiesenfeld模型在不同基底拓扑与邻域范围下的雪崩行为。\n2. 通过Z-score分析确认，雪崩尺寸概率分布的幂律指数约为1.208(39)，且与拓扑及邻域范围无关，但需合理选择沉积颗粒数。\n3. 这为理解自组织临界现象的普适类以及系统有限尺寸标度性质提供了定量依据。", "summary_source": "deepseek", "authors": [{"name": "P. Szczepaniak"}, {"name": "K. Malarz"}], "featured_authors": [{"name": "P. Szczepaniak"}, {"name": "K. Malarz"}], "author_count": 2}, {"id": "2605.15981", "category": "cond-mat", "title": "Orbital Angular Momentum Textures and Currents in a Discrete Helix: Equilibrium and Linear Response", "abstract": "Recently, nonequilibrium orbital angular momentum in low-dimensional systems has attracted renewed attention. Here we introduce a minimal three-orbital tight-binding model for a single helical chain and show that chirality alone generates a momentum-dependent orbital-angular-momentum texture through Slater--Koster hybridization in the local basis $(p_r,p_\\phi,p_z)$, without requiring atomic spin--orbit coupling. In the single-helix geometry, the radial orbital texture vanishes identically, while the azimuthal and longitudinal components remain finite and arise from the odd-in-momentum $(p_z,p_r)$ and $(p_r,p_\\phi)$ sectors. As a result, the equilibrium average orbital texture vanishes by parity, although persistent-like orbital angular momentum currents may still exist and imply chirality-dependent end magnetization in a finite helix. Under an applied longitudinal electric field, the system develops a finite orbital Edelstein response, whereas the projected longitudinal orbital-current conductivity vanishes in the linear regime by parity. When spin degrees of freedom are included, the orbital texture acts as a source of spin polarization through orbital-to-spin transduction. The resulting spin response is controlled by orbital overlap scales much larger than the bare relativistic spin--orbit scale, making it a stronger candidate for spin injection than the conventional spin Edelstein mechanism. These results identify chirality as the minimal microscopic ingredient for generating orbital angular momentum response in one-dimensional systems and support an orbital route to spin selectivity in chiral conductors.", "url": "https://arxiv.org/abs/2605.15981", "type": "理论", "summary": "1. 该工作针对离散螺旋链引入最小三轨道紧束缚模型，研究了手性单生且无需原子自旋-轨道耦合的动量依赖轨道角动量纹理及其平衡与线性响应。\n2. 其核心在于通过Slater-Koster杂化在局域基$(p_r,p_\\phi,p_z)$中产生径向消失、方位角和纵向有限的轨道纹理，并揭示持久类轨道角动量电流导致有限螺旋的末端磁化。\n3. 这为手性导体中基于轨道角动量的自旋注入机制提供了强于传统自旋Edelstein效应的逾两个数量级的轨道途径，并支持手性诱导自旋选择性的微观起源。", "summary_source": "deepseek", "authors": [{"name": "Danny Cordova"}, {"name": "Bertrand Berche"}, {"name": "Ernesto Medina"}], "featured_authors": [{"name": "Danny Cordova"}, {"name": "Bertrand Berche"}, {"name": "Ernesto Medina"}], "author_count": 3}, {"id": "2605.15994", "category": "cond-mat", "title": "Large-$N$ scaling of Tan's contact for the harmonically trapped Tonks--Girardeau gas at finite temperature", "abstract": "We derive the canonical-ensemble scaling of Tan's contact for $N$ harmonically trapped Tonks--Girardeau bosons at finite temperature in the large-$N$ limit. The leading scaling coefficient reproduces the local-density-approximation result and is obtained from a contour-integral representation of the canonical partition function followed by a saddle-point reduction to a phase-space integral with a self-consistent scaled chemical potential. The subleading coefficient is the central new object of this work: it admits an explicit representation in terms of universal phase-space integrals of the Fermi factor, has closed-form Sommerfeld and virial limits, and is identified with the canonical-versus-grand-canonical ensemble difference at fixed mean particle number. In the high-temperature Boltzmann regime the ratio of subleading to leading coefficients collapses to a universal value, traceable to the Poissonian particle-number statistics of the dilute grand-canonical gas. We construct Padé approximants for both scaling functions that interpolate uniformly between the low-temperature Sommerfeld and high-temperature virial regimes; for the subleading coefficient we report a form that is uniformly accurate on our working range of temperatures and asymptotically correct beyond. The scaling law is verified against canonical contour-integration data across the full temperature range.", "url": "https://arxiv.org/abs/2605.15994", "type": "理论", "summary": "1. 该工作推导了有限温度谐振囚禁Tonks-Girardeau气体中Tan接触的大N标度律，包含领先与次领先系数。\n2. 次领先系数通过自洽化学势鞍点约化获得费米因子普适相空间积分表示，并与正则-巨正则系综差异建立明确联系。\n3. 其Sommerfeld与virial极限封闭形式及Padé近似为跨温区接触标度行为提供了精确解析框架。", "summary_source": "deepseek", "authors": [{"name": "Felipe Taha Sant'Ana"}], "featured_authors": [{"name": "Felipe Taha Sant'Ana"}], "author_count": 1}, {"id": "2605.16059", "category": "cond-mat", "title": "Spherically symmetric approaches in the theoretical study of low-dimensional magnets", "abstract": "The main ideas and some of the most important results of the spherically symmetric self-consistent approach and a number of related theoretical algorithms are presented. These methods make it possible to study low-dimensional Heisenberg-type spin models, including frustrated ones, with careful consideration of the theoretic (Mermin-Wagner and Marshall) theorems, as well as the site spin constraint. Thus, the difficulties that may arise in the traditional analysis of low-dimensional magnetic systems are avoided. The approach can also be applied to the spin-pseudospin model, and is also embedded in more complex constructions when considering spin models with free carriers, such as the basic and three-band Hubbard models, t-J and s-d models, and the Kondo lattice.", "url": "https://arxiv.org/abs/2605.16059", "type": "理论+数值", "summary": "1. 该工作系统介绍了球对称自洽方法及其相关算法在低维海森堡自旋模型（包括阻挫系统）理论研究中的核心思想与重要结果。\n2. 其技术关键是通过严格遵循Mermin-Wagner与Marshall定理，并精确满足局域自旋约束，从而规避传统低维磁性分析中的固有困难。\n3. 这一方法可自然推广至自旋-赝自旋模型，并嵌入含自由载流子的复杂模型（如Hubbard、t-J、s-d及Kondo晶格），为低维量子磁体研究提供统一理论框架。", "summary_source": "deepseek", "authors": [{"name": "A.F. Barabanov"}, {"name": "V.E. Valiulin"}, {"name": "A.V. Mikheyenkov"}, {"name": "P.S. Savchenkov"}], "featured_authors": [{"name": "A.F. Barabanov"}, {"name": "V.E. Valiulin"}, {"name": "A.V. Mikheyenkov"}, {"name": "P.S. Savchenkov"}], "author_count": 4}, {"id": "2605.16073", "category": "cond-mat", "title": "Charge Transfer from Perovskite Quantum Dots to Multifunctional Ligands with Tethered Molecular Species", "abstract": "Perovskite quantum dots (pQDs) are promising materials for optoelectronic and photocatalytic applications due to their unique optical properties. To enhance charge carrier extraction or injection donor/acceptor molecules can be tethered to the pQD. These molecules must strongly bind to the ionic surfaces of pQDs without compromising colloidal stability. These we achieve by using multifunctional ligands containing a quaternary ammonium binding group for strong pQDs surface attachment, a long tail group for colloidal stability, and a functional group near the pQD surface. Such pQDs with ferrocene-functionalized ligands show fast photoexcited hole transfer with near-unity efficiency. Density functional theory calculations reveal how ferrocene's molecular structure reorganizes following hole transfer, affecting its charge separation efficiency. This approach can also be extended to in photoexcited electron and energy transfer processes with pQDs. Therefore, this strategy offers a blueprint for creating efficient QD-molecular hybrids for applications like photocatalysis.", "url": "https://arxiv.org/abs/2605.16073", "type": "理论+数值", "summary": "1. 该工作提出一种多功能配体设计策略，实现钙钛矿量子点到分子受体的高效电荷转移。\n2. 其关键在于季铵基团强表面结合与长尾基团保证胶体稳定，铁茂功能化配体实现近单位量子效率的空穴转移。\n3. 这为开发更高效率的量子点-分子杂化光催化体系提供了可推广的设计蓝图。", "summary_source": "deepseek", "authors": [{"name": "Mariam Kurashvili"}, {"name": "Lena S. Stickel"}, {"name": "Jordi Llusar"}, {"name": "Christian Wilhelm"}, {"name": "Fabian Felixberger"}, {"name": "Ivana Ivanović-Burmazović"}, {"name": "Ivan Infante"}, {"name": "Jochen Feldmann"}, {"name": "Quinten A. Akkerman"}], "featured_authors": [{"name": "Mariam Kurashvili"}, {"name": "Lena S. Stickel"}, {"name": "Jordi Llusar"}, {"name": "Ivan Infante"}, {"name": "Jochen Feldmann"}, {"name": "Quinten A. Akkerman"}], "author_count": 9}, {"id": "2605.16110", "category": "cond-mat", "title": "Causation-guided mechanism identification and interpretable reduced-order modeling of damage-driving grain-boundary stress in creep", "abstract": "Grain-boundary (GB) local stress is central to the initiation and evolution of long-term creep damage in polycrystalline superalloys. Owing to the high-dimensional nonlinear relationships between the GB stress response and multiple crystallographic, microstructural, and micromechanical characteristics, it remains challenging to identify the key characteristics governing GB stress and to elucidate their mechanisms of influence. Dislocation-climb-affected crystal-plasticity finite-element simulations of minimal grain clusters are combined with an integrated causation-guided machine-learning framework, in which mechanics-informed descriptors are analyzed by causation entropy to identify governing mechanisms and then distilled into a reduced-order regression form for interpretable prediction of GB normal stress. Among 18 physically motivated characteristics, the GB inclination angle, the slip transmission, the climb-related Schmid-type indicator, and the elastic-modulus mismatch are found to be dominant, revealing the coupled roles of interfacial geometry, crystallographic compatibility, creep stress relaxation, and micromechanical contrast. The identified characteristics hierarchy and functional representation remain effective under multiaxial loading and can be extended to tricrystal systems through physically interpretable nonlocal augmentation when a purely local description becomes insufficient, demonstrating strong physical consistency and robust generalizability across physical conditions. The extracted candidate functions also improve surrogate-model performance across multiple machine-learning model classes, providing supporting evidence for the physical relevance and efficiency of the identified representation. The proposed methods demonstrate strong potential for the development of interpretable machine-learning models and for the study of microscale nonlocal damage.", "url": "https://arxiv.org/abs/2605.16110", "type": "理论+数值", "summary": "1. 该工作结合晶体塑性有限元模拟与因果熵机器学习框架，识别了主导多晶合金蠕变损伤中晶界应力的关键微观机制。\n2. 其卖点在于通过因果熵从18个物理描述符中筛选出晶界倾角、滑移传递、攀移相关Schmid指标和弹性模量失配等主导因素，并建立可解释降阶回归模型。\n3. 该框架具有强物理一致性和泛化能力，可推广到多轴加载和多晶系统，为发展可解释机器学习模型及微观非局部损伤研究提供启发。", "summary_source": "deepseek", "authors": [{"name": "Weichen Kong"}, {"name": "Yanwei Dai"}, {"name": "Yinglin Zhang"}, {"name": "Yinghua Liu"}], "featured_authors": [{"name": "Weichen Kong"}, {"name": "Yanwei Dai"}, {"name": "Yinglin Zhang"}, {"name": "Yinghua Liu"}], "author_count": 4}, {"id": "2605.16123", "category": "cond-mat", "title": "Thermal conductivity of seifertite and pyrite-type SiO$_2$: A comparative study", "abstract": "Thermal conductivity is a fundamental material property that plays a crucial role in understanding the dynamics and evolution of planetary interiors. Despite its importance, the thermal conductivity of seifertite and pyrite-type SiO$_2$ remains unknown. Here, we calculate the lattice thermal conductivities of seifertite and pyrite-type SiO$_2$ using the Green-Kubo method based on molecular dynamics (MD) simulations driven by two machine learning potentials (MLPs) constructed from the SCAN and PBEsol exchange-correlation functionals, with $\\textit{ab initio}$-level accuracy. To demonstrate our methodology, we also compute thermal conductivities using the phonon quasiparticle approach for comparison. Overall, the Green-Kubo method predicts up to 119 % higher thermal conductivity with a temperature dependence close to $T^{-1}$, as it fully captures diffusion-like phonons at high temperatures that are missed by the phonon quasiparticle approach. The 19 % reduction in thermal conductivity across the phase transition from seifertite to the pyrite-type phase suggests the potential formation of a thermally insulating layer in the mantle of super-Earths.", "url": "https://arxiv.org/abs/2605.16123", "type": "理论+数值", "summary": "1. 该工作基于SCAN和PBEsol泛函的机器学习势驱动分子动力学，利用Green-Kubo方法计算了seifertite和pyrite型SiO₂的晶格热导率并与声子准粒子方法对比。\n2. 其技术卖点在于Green-Kubo方法预测热导率比准粒子法高出高达119%，温度依赖接近T⁻¹，完整捕捉了高温下扩散型声子贡献。\n3. 从seifertite到pyrite型相变热导率降低19%，暗示超级地球地幔中可能形成pyrite型热绝缘层，对系外行星内部热演化研究具启示。", "summary_source": "deepseek", "authors": [{"name": "Doyoon Park"}, {"name": "Yihang Peng"}, {"name": "Jie Deng"}], "featured_authors": [{"name": "Doyoon Park"}, {"name": "Yihang Peng"}, {"name": "Jie Deng"}], "author_count": 3}, {"id": "2605.16125", "category": "cond-mat", "title": "Staggering domino-like blast front motion in a one-dimensional cold gas", "abstract": "One-dimensional alternating particle systems are widely used to study interconnections between the hydrodynamics of blast waves in a gas-like medium and the Newtonian dynamics of its corpuscular constituents. We study the model in which point particles with masses $m,\\mu, m,\\mu,\\dots, (m\\geq\\mu)$ are distributed on the positive half-line $\\mathbb{R}_{+}$. Their dynamics are initiated by giving a positive velocity to the leftmost particle; in its course, the particles undergo elastic collisions. For this model with $m/\\mu=2$, it has previously been established that the dynamics that start from random initial positions are consistent with predictions based on Euler's hydrodynamic equation. In particular, they have the following properties: (i) the position of the rightmost particle (shock front) evolves as $t^\\delta$ with $\\delta<1$; (ii) recoiled particles behind the front enter the negative half-axis; (iii) particles with locations $x\\leq0$ move ballistically and eventually take over the total energy of the system. In this paper, we present numerical and analytical results for the dynamics of this model with nonrandom (typically equidistant) initial positions and various values of $m/\\mu$. For $m/\\mu=2$ and equidistant initial positions, our results qualitatively agree with those just mentioned. At the same time, we found an infinite family of numbers $\\{\\mathcal{M}_k\\}$ such that, for $m/\\mu=\\mathcal{M}_k$, the hydrodynamic behavior mentioned changes drastically to the following. At each moment, only a single triplet $m,\\mu, m$ is in motion, whereas all other particles are at rest. As a result, the shock front moves ballistically with an average velocity equal to the initial one. Such a `staggering domino-like' picture is obtained as an exact solution, which yields, in particular, explicit formulas for $\\mathcal{M}_k$ and the particle velocities and positions.", "url": "https://arxiv.org/abs/2605.16125", "type": "理论+数值", "summary": "1. 该工作通过数值与解析方法，研究了一维交变质量冷气体中非随机初始位置下冲击波前沿的动力学，发现质量比取无穷序列ℳ_k时出现戏剧性变化。\n2. 其技术卖点在于精确求解出交错多米诺骨牌式运动：仅单个质量三元组活跃，其余粒子静止，导致前沿以初始速度弹道传播。\n3. 这一结果揭示了离散粒子流中从亚扩散流体动力学到弹道传播的转变机制，为理解质量非均匀系统中的冲击波行为提供了可解范例。", "summary_source": "deepseek", "authors": [{"name": "Taras Holovatch"}, {"name": "Yuri Kozitsky"}, {"name": "Krzysztof Pilorz"}, {"name": "Yurij Holovatch"}], "featured_authors": [{"name": "Taras Holovatch"}, {"name": "Yuri Kozitsky"}, {"name": "Krzysztof Pilorz"}, {"name": "Yurij Holovatch"}], "author_count": 4}, {"id": "2605.16166", "category": "cond-mat", "title": "Rapid Atmospheric Vapor Deposition of H:In2O3 Transparent Conducting Oxide Thin Films", "abstract": "Transparent conducting oxides (TCOs) are essential for the optoelectronics industry, but there is a critical gap in cost-effective methods to rapidly deposit low sheet resistance, high transmittance films without damaging delicate materials, including emerging soft semiconductors like metal-halide perovskites. In this work, atmospheric pressure chemical vapor deposition (AP-CVD) is used to synthesise H:In2O3 films with 7.20+/-0.01 Ohm/sq sheet resistance (0.50+/-0.06 this http URL resistivity) and transmittance up to 89% in the near-infrared (NIR), surpassing commercial sputter-deposited indium tin oxide. The growth rate is 40x higher than atomic layer deposition (ALD), and the AP-CVD films are fully processed under atmospheric conditions at only 140 C. Comparison of secondary ion mass spectrometry and time-of-flight elastic recoil detection analysis with changes in carrier concentration indicate that H dopants are introduced from the water oxidant. There is an increase in mobility form 40+/-10 cm2/Vs to 160+/-30 cm2/Vs when changing from O2 to H2O as the oxidant, which is attributed to H dopants passivating oxygen vacancies that act as carrier scattering centers. This work establishes AP-CVD as a promising method for manufacturing high figure-of-merit TCOs in a rapid, scalable and cost-effective manner, using mild growth conditions compatible with thermally-sensitive materials.", "url": "https://arxiv.org/abs/2605.16166", "type": "理论", "summary": "1. 该工作采用大气压化学气相沉积在140°C下以比原子层沉积高40倍的速率制备H:In2O3透明导电氧化物薄膜。\n2. 技术亮点是水氧化剂引入H掺杂钝化氧空位散射中心，使迁移率从40提升至160 cm²/Vs，获得7.2 Ω/sq薄层电阻与89%近红外透光率，性能超越溅射ITO。\n3. 这确立了AP-CVD作为一种快速、可规模化、低成本的方法，可在温和条件下于热敏感材料上制备高品质透明导电氧化物。", "summary_source": "deepseek", "authors": [{"name": "Xiaoyu Guo"}, {"name": "Hae-Jun Seok"}, {"name": "Eilidh L. Quinn"}, {"name": "Matthew K Sharpe"}, {"name": "Callum. D. McAleese"}, {"name": "Yi-Teng Huang"}, {"name": "Xinjuan Li"}, {"name": "Kexue Li"}, {"name": "Chia-Yu Chang"}, {"name": "Yongjie Wang"}, {"name": "John O'Sullivan"}, {"name": "Katie L. Moore"}, {"name": "Caterina Ducati"}, {"name": "Ruy Sebastian Bonilla"}, {"name": "Han-Ki Kim"}, {"name": "Abderrahime Sekkat"}, {"name": "Robert L. Z. Hoye"}], "featured_authors": [{"name": "Xiaoyu Guo"}, {"name": "Hae-Jun Seok"}, {"name": "Eilidh L. Quinn"}, {"name": "Han-Ki Kim"}, {"name": "Abderrahime Sekkat"}, {"name": "Robert L. Z. Hoye"}], "author_count": 17}, {"id": "2605.16209", "category": "cond-mat", "title": "An agitated oscillator chain", "abstract": "We study how the stationary dynamics of an oscillator chain is modified when coupled to a bath of run-and-tumble particles. First, assuming time-scale separation, we derive the induced Langevin chain dynamics with explicit expressions for the streaming term, friction coefficient, and noise amplitude. At high persistence of the run-and-tumble particle bath, the linear friction turns negative, creating an instability. Second, we find that this anti-damping is arrested at long times due to nonlinear effects, reminiscent of a Rayleigh oscillator. We conclude that a passive harmonic chain can be transformed by its coupling to active matter into a self-sustained fluctuating medium with many-body Rayleigh-like dynamics. That transfer of activity results in pulsations of the displacements, spatial oscillations, and the emergence of persistence in velocities along the chain.", "url": "https://arxiv.org/abs/2605.16209", "type": "理论", "summary": "1. 该工作研究了一端耦合至run-and-tumble颗粒浴的振荡链的平稳动力学，并推导了诱导Langevin链动力学的显式表达式。\n2. 其技术要点在于发现高持久性时线性摩擦系数变负导致反阻尼不稳定性，该不稳定性由非线性效应自限，产生类似Rayleigh振荡器的多体行为。\n3. 这揭示了被动谐振子链可通过与活性物质耦合转变为具有自持涨落和持久速度关联的活性介质，为主动-被动复合系统中的非线性动力学提供了范例。", "summary_source": "deepseek", "authors": [{"name": "Aaron Beyen"}, {"name": "Christian Maes"}, {"name": "Ion Santra"}], "featured_authors": [{"name": "Aaron Beyen"}, {"name": "Christian Maes"}, {"name": "Ion Santra"}], "author_count": 3}, {"id": "2605.16218", "category": "cond-mat", "title": "Lattice Relaxation Flattens Chern Bands in Rhombohedral Graphene Stacks", "abstract": "Motivated by recent observations of integer and fractional Chern insulators in rhombohedral graphene stacks aligned with hexagonal boron nitride (hBN), we propose and study a model in which the moiré potential is defined by the pattern of layer-shear strain fields produced by lattice relaxation in these heterostructures. Although these strain fields decrease exponentially with the number of layers, their imprints on electrons residing away from the contact layer are non-negligible. In the absence of a displacement field, lattice relaxation effects amplify the electronic differences among the two different stackings with hBN. These differences, although attenuated at the single-electron level, survive in the so-called moiré-distant regime and are further enhanced with the inclusion of electron interactions. We find that lattice relaxation plays a crucial role in flattening and isolating a valley-polarized Hartree-Fock electron band with $|C|=1$ Chern number. Our results challenge the conventional wisdom on moiré effects in these heterostructures by illustrating the intertwined effects of long-range Coulomb interactions and lattice relaxation, and opens the door to explore different regimes of twist angles and displacement fields for the search for topological states.", "url": "https://arxiv.org/abs/2605.16218", "type": "理论+数值", "summary": "1. 该工作提出一个模型，以菱方石墨烯/六方氮化硼异质结中晶格弛豫产生的层剪切应变场定义莫尔势，研究整数量子及分数量子陈绝缘体的微观机制。\n2. 技术核心在于发现晶格弛豫效应在无位移场时放大两种堆叠的电子差异，且通过长程库仑相互作用进一步增强了这种差异，从而平坦化并隔离了具有|C|=1陈数的谷极化Hartree-Fock电子能带。\n3. 这一发现挑战了传统观点中莫尔效应仅依赖于转角与位移场的认知，为在异质结的不同位移场和转角区域搜索拓扑态提供了新的物理参数调控思路。", "summary_source": "deepseek", "authors": [{"name": "Luca Nashabeh"}, {"name": "Héctor Ochoa"}], "featured_authors": [{"name": "Luca Nashabeh"}, {"name": "Héctor Ochoa"}], "author_count": 2}, {"id": "2605.16236", "category": "cond-mat", "title": "Acoustic spin resonance in polariton condensates", "abstract": "We theoretically investigate acoustic spin resonance in a spatially homogeneous spinor polariton condensate. A longitudinal acoustic wave generates a time-periodic strain-induced effective magnetic field acting on the condensate pseudospin. When this field is transverse to the static in-plane linear-polarization splitting, it resonantly drives polarization oscillations. We show that spin-dependent interactions shift the resonance and produce nonlinear line shapes, while gain, reservoir dynamics, and spin relaxation make the response dissipative and history-dependent, producing amplitude hysteresis. In the presence of lifetime anisotropy, the condensate can develop a bifurcated stationary state with finite circular polarization, and a resonant acoustic drive can switch between the corresponding out-of-plane branches. A Zeeman splitting provides an additional conservative knob for tuning the resonance frequency. Our results identify coherent acoustic driving as a route to resonant, nonlinear, and switchable control of polariton pseudospin dynamics.", "url": "https://arxiv.org/abs/2605.16236", "type": "理论", "summary": "1. 该工作从理论上研究了均匀自旋极化激元凝聚体中的声学自旋共振现象。\n2. 其核心物理在于纵波感生的时变有效磁场横向耦合静态线偏振分裂，产生共振偏振振荡，并揭示自旋相互作用、耗散及寿命各向异性导致非线性线型、迟滞与分岔稳态。\n3. 这为利用相干声驱动实现极化激元赝自旋的共振、非线性和可切换控制提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "D. A. Saltykova"}, {"name": "A. Kudlis"}, {"name": "A. V. Yulin"}, {"name": "I. A. Shelykh"}], "featured_authors": [{"name": "D. A. Saltykova"}, {"name": "A. Kudlis"}, {"name": "A. V. Yulin"}, {"name": "I. A. Shelykh"}], "author_count": 4}, {"id": "2605.16256", "category": "cond-mat", "title": "Polariton BECs: Theory and Concepts", "abstract": "Polaritons are a superposition of light and matter, that combine Strong Interferences (of light) with Weak Interactions (of excitons), making them WISI (Weakly-Interacting, Strongly-Interfering) particles. Their condensation is the main highlight of a field which occupies a unique position at the intersection of quantum optics, condensed matter physics and nonlinear dynamics of driven, dissipative systems. This chapter surveys selected theoretical concepts of polariton condensates' formation, coherence and dynamics, with an emphasis on their distinctions from their atomic counterparts and on points of ongoing controversy. We argue that linear and non-interacting effects are undervalued in polariton physics, and that a significant part of the phenomenology -- including bosonic correlations and coherence buildup -- can often be understood without invoking strong interactions or genuine quantum effects.", "url": "https://arxiv.org/abs/2605.16256", "type": "理论", "summary": "1. 本文综述极化激元玻色-爱因斯坦凝聚的理论概念，聚焦其与原子凝聚的差异及当前争议。\n2. 核心卖点在于论证线性与非相互作用效应被低估，指出无需强相互作用或量子效应即可解释玻色关联及相干建立等主要现象。\n3. 这为理解驱动耗散系统中光-物质混合凝聚的物理机制提供了新视角，并启发后续实验与理论工作重新审视弱相互作用体系。", "summary_source": "deepseek", "authors": [{"name": "Fabrice Laussy"}], "featured_authors": [{"name": "Fabrice Laussy"}], "author_count": 1}, {"id": "2605.15258", "category": "hep-th", "title": "Generating Rotation in a Snap", "abstract": "We build a new technique to generate rotation from arbitrary static solutions that asymptote to four- or five-dimensional Minkowski spacetime. The method is purely algebraic and does not require solving Einstein equations. It proceeds by transforming the static solution to AdS$\\times$S asymptotics, performing a coordinate shift to a uniformly rotating frame, and then transforming the solution back to asymptotically flat spacetime. We implement this construction in five-dimensional minimal supergravity, although it applies more broadly to any framework admitting AdS$\\times$S geometries and relevant sigma-model transformations. As a first application, we recover simply the Kerr and Myers-Perry black holes directly from Schwarzschild black holes. We then apply the method to the linear class of static Weyl solutions and obtain the first linear ansatz describing an arbitrary number of non-extremal rotating and charged sources. This approach provides a systematic and simple route to constructing non-extremal rotating geometries in four and five dimensions.", "url": "https://arxiv.org/abs/2605.15258", "type": "理论", "summary": "1. 该工作提出一种纯代数方法，从任意渐近四或五维闵可夫斯基时空的静态解直接生成旋转解。\n2. 其技术卖点在于通过将静态解变换至AdS×S渐近、执行均匀旋转坐标系移位并逆变换回平直时空，完全避免求解爱因斯坦方程。\n3. 这为四、五维非极端旋转带电几何（如多源线性Weyl解）的系统构建提供了简洁且可推广的途径。", "summary_source": "deepseek", "authors": [{"name": "Soumangsu Chakraborty"}, {"name": "Pierre Heidmann"}, {"name": "Gela Patashuri"}], "featured_authors": [{"name": "Soumangsu Chakraborty"}, {"name": "Pierre Heidmann"}, {"name": "Gela Patashuri"}], "author_count": 3}, {"id": "2605.15268", "category": "hep-th", "title": "Ising anyons in the $SU(2)_2$ Chern--Simons theory", "abstract": "The present work is motivated by the statement that the Ising minimal model $\\mathcal{M}(4,3)$ is equivalent, at the level of observables, to the $SU(2)_2$ Chern--Simons theory. At first glance, however, these two theories appear to differ substantially. For instance, the number of irreducible highest-weight representations does not match the number of Ising anyons. For tensor products of low degree, these discrepancies are examined in this work. While representation structure differs, it does not affect the observables underlying topological quantum computation algorithms.", "url": "https://arxiv.org/abs/2605.15268", "type": "理论", "summary": "1. 该工作考察了Ising最小模型与SU(2)_2 Chern–Simons理论在低次张量积表示结构上的差异。\n2. 其核心发现是，尽管不可约表示计数与Ising任意子不匹配，但可观测量不影响拓扑量子计算算法。\n3. 这为不同任意子理论框架之间的等价性及在拓扑量子计算中的应用提供了关键约束与检验。", "summary_source": "deepseek", "authors": [{"name": "Artem Belov"}, {"name": "Andrey Morozov"}], "featured_authors": [{"name": "Artem Belov"}, {"name": "Andrey Morozov"}], "author_count": 2}, {"id": "2605.15269", "category": "hep-th", "title": "Kerroll black holes", "abstract": "We construct rotating black holes in Carroll gravity using two distinct approaches. In one of them, we exploit the freedom in the Carroll compatible connection to encode rotation. In particular, we construct rotating solutions in magnetic Carroll gravity by dressing the Carroll-Schwarzschild black hole with a rotational charge. This solution is intrinsically Carrollian and has no Lorentzian analog. In the other approach, we construct an extension of magnetic Carroll gravity from general relativity in an odd-power expansion in the speed of light. This theory contains magnetic Carroll gravity as a subsector but has in general more physical degrees of freedom. We show that this theory admits a Carroll analog of the Kerr black hole as a solution, which we refer to as the \"Kerroll black hole\". Its rotation appears as an intrinsically odd-power effect in the Carroll data. We compute the corresponding conserved charges for both theories.", "url": "https://arxiv.org/abs/2605.15269", "type": "理论", "summary": "1. 该工作通过两种途径在Carroll引力中构造了旋转黑洞解，分别利用相容联络的自由度编码旋转以及从广义相对论做光速奇次幂展开。\n2. 其核心在于磁Carroll引力中的旋转解是纯Carroll的且无Lorentz对应，而扩展理论中的Kerroll黑洞旋转效应表现为奇次幂项，并计算了对应守恒荷。\n3. 这为探索极端非相对论极限下的引力动力学提供了明确构造范例，并启发对Carroll对称性中旋转自由度及守恒量的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Florian Ecker"}, {"name": "Daniel Grumiller"}, {"name": "Lucas Hörl"}, {"name": "Mattéo Leturcq--Daligaux"}, {"name": "Alfredo Pérez"}], "featured_authors": [{"name": "Florian Ecker"}, {"name": "Daniel Grumiller"}, {"name": "Lucas Hörl"}, {"name": "Mattéo Leturcq--Daligaux"}, {"name": "Alfredo Pérez"}], "author_count": 5}, {"id": "2605.15272", "category": "hep-th", "title": "A general proof of integer Rényi QNEC", "abstract": "The Rényi quantum null energy condition conjectures that the second null shape variation of the sandwiched Rényi divergence (SRD) of an excited state relative to the vacuum is non-negative in local Poincaré-invariant quantum field theory, giving a one-parameter generalization of the quantum null energy condition (QNEC). We prove Rényi QNEC for all integer Rényi parameters $n\\geq 2$ for von Neumann algebras carrying a half-sided modular inclusion structure. The only assumption on the excited state is finiteness of its SRD relative to the vacuum. Concretely, for any $\\sigma$-finite von Neumann algebra with such an inclusion, we prove log-convexity, under the associated null-translation semigroup, of the Kosaki $L^n$ norm of any normal positive functional with finite $L^n$ norm.", "url": "https://arxiv.org/abs/2605.15272", "type": "理论", "summary": "1. 该工作证明了对所有整数Rényi参数 n≥2，在带有半侧模包含结构的 von Neumann 代数中，Rényi 量子零能量条件成立。\n2. 其核心在于证明任何具有有限 Kosaki Lⁿ 范数的正常正泛函在零平移半群下满足对数凸性，仅需激发态相对真空的夹层 Rényi 散度有限。\n3. 这为量子场论中的能量不等式族提供了泛代数证明，并揭示了模包含结构与条件熵非负性间的深层联系。", "summary_source": "deepseek", "authors": [{"name": "Tanay Kibe"}, {"name": "Pratik Roy"}], "featured_authors": [{"name": "Tanay Kibe"}, {"name": "Pratik Roy"}], "author_count": 2}, {"id": "2605.15276", "category": "hep-th", "title": "Bordisms between 9d type IIB supergravities and commutator widths of duality groups", "abstract": "We study the topological properties of bordisms interpolating between different 9d gauged supergravities obtained from compactification of type IIB string theory on $\\mathbb{S}^1$ with a non-trivial $\\mathsf{SL}(2,\\mathbb{Z})$ bundle. We describe how such bordisms implement the needed monodromies through stacks of $[p,q]$ 7-branes or gravitational solitons of non-trivial topology. For the later mechanism, we see that the topology of the bordism becomes increasingly complicated for large monodromies, which results in the associated bordisms being arbitrarily suppressed, against expectations on the breaking of global symmetries in Quantum Gravity. Motivated by this, we propose a refinement of the Swampland Cobordism Conjecture for the first bordism group $\\Omega_1({\\rm B}G)$ with a $G$ duality bundle. We argue that even if gravitational solitons can realize the monodromies associated with elements of the commutator subgroup of $G$, if the number of needed commutators is unbounded (in other words, the commutator width of $G$ diverges) then an infinite number of duality defects realizing elements in $G$ need to be included. We test this proposal for different duality groups $G$, and see that our expectations are realized, often in non-trivial ways.", "url": "https://arxiv.org/abs/2605.15276", "type": "理论", "summary": "1. 该论文研究由IIB型弦论在S^1上带非平凡SL(2,Z)丛紧致化所得9维规范超引力之间的边缘拓扑性质。\n2. 其卖点在于发现大单值性下边缘拓扑复杂度导致抑制，进而提出对沼泽地协边猜想的改进：将对偶群G的交换子宽度与第一边缘群Ω_1(BG)的缺陷分类关联。\n3. 这为理解量子引力中全局对称性破缺的拓扑约束提供了新视角，并对弦论紧致化中对偶缺陷的无限分类给出明确的检验条件。", "summary_source": "deepseek", "authors": [{"name": "Camilo las Heras"}, {"name": "Ignacio Ruiz"}], "featured_authors": [{"name": "Camilo las Heras"}, {"name": "Ignacio Ruiz"}], "author_count": 2}, {"id": "2605.15293", "category": "hep-th", "title": "Dimensional reduction of AdS3 Chern-Simons gravity: Schwarzian and affine boundary theories", "abstract": "We study a symmetry-reduced sector of $AdS_3/\\mathbb Z_2$ gravity formulated as an $SO(2,2)$ Chern--Simons theory on a 3D-manifold with toroidal boundary. The reduction is implemented by requiring a globally defined symmetry and restricting to the sector in which the gauge connection is invariant along the symmetry flow. The resulting theory reduces to a two-dimensional BF-like model together with an induced one-dimensional boundary action. We show that the reduced theory admits two inequivalent boundary sectors, originated by two different boundary conditions for the parent 3d theory at the level of the variational principle. On the boundary subspace $A_\\tau=\\Phi$, the universal one-dimensional action reproduces the standard Drinfel'd--Sokolov reduction in JT gravity which captures the Schwarzian boundary dynamics. On the generalized boundary $A_\\tau=\\lambda'\\Phi+u^{-1}\\partial_\\tau u$, the same action instead yields a deformed Schwarzian functional with affine residual symmetry, naturally associated with a non-extremal or Rindler-type regime. We further show how the $\\mathfrak{so}(2,2)$ algebra of the 3D Chern--Simons model naturally leads to current-dressed Kac--Moody extensions of both sectors.", "url": "https://arxiv.org/abs/2605.15293", "type": "理论", "summary": "1. 该工作对AdS₃/Z₂引力的SO(2,2) Chern-Simons表述实施对称性约化，得到带环面边界的二维BF型理论及诱导一维边界作用。\n2. 核心在于通过两种不同的变分边界条件导出两个不等价边界扇区，分别重现JT引力中的Schwarzian动力学和具有仿射残余对称性的变形Schwarzian泛函。\n3. 这为统一描述极值与非极值黑洞边界理论提供了框架，并揭示了so(2,2)代数自然引导至current-dressed Kac-Moody扩展结构。", "summary_source": "deepseek", "authors": [{"name": "Goffredo Chirco"}, {"name": "Lucio Vacchiano"}, {"name": "Patrizia Vitale"}], "featured_authors": [{"name": "Goffredo Chirco"}, {"name": "Lucio Vacchiano"}, {"name": "Patrizia Vitale"}], "author_count": 3}, {"id": "2605.15478", "category": "hep-th", "title": "Comments on higher-derivative corrections in the AdS/CFT duality", "abstract": "We point out that some works on higher-derivative corrections in the AdS/CFT duality use inappropriate \"AdS/CFT dictionary.\" We illustrate the problem using a class of holographic superconductors in the Gauss-Bonnet black hole background. We also point out another problem in previous works. These modifications can change the qualitative behavior of physical quantities such as the spontaneous condensate. Whether the condensate increases or decreases under higher-derivative corrections depends on the system one considers, and there is no universality in this sense.", "url": "https://arxiv.org/abs/2605.15478", "type": "理论", "summary": "1. 该文指出，部分关于AdS/CFT对偶中高阶导数修正的研究使用了不当的全息字典，并以Gauss-Bonnet黑洞背景下的全息超导体为例加以说明。\n2. 其关键物理洞见在于揭示，适当字典会定性改变自发凝聚等量对高阶导数修正的响应方向，且该方向依赖系统，缺乏普适性。\n3. 这要求后续研究在AdS/CFT框架下必须谨慎校验字典的合理性，并为准确评估高阶导数修正对全息模型的影响提供了必要警示。", "summary_source": "deepseek", "authors": [{"name": "Makoto Natsuume"}], "featured_authors": [{"name": "Makoto Natsuume"}], "author_count": 1}, {"id": "2605.15655", "category": "hep-th", "title": "Critical slowing down of black hole phase transition and universal dynamic scaling in AdS black holes", "abstract": "We investigate the dynamical critical behaviour of black hole phase transitions in anti de Sitter spacetime by extending the stochastic framework of free energy landscape dynamics to Kerr AdS black holes. By analyzing the Langevin evolution of the entropy (in contrast to the horizon radius in the RN-AdS case) near criticality, we demonstrate that the system exhibits pronounced critical slowing down, characterized by a significant increase of the autocorrelation time as the critical point is approached. This behaviour is further confirmed by the lowest eigenvalue of the Fokker-Planck equation. By analysing the dynamics along different thermodynamic paths, including variations in temperature, pressure, and angular momentum, and considering both directions - towards and away from criticality, we find that the relaxation time obeys a robust scaling relation, $\\tau=|\\epsilon|^{-2/3}$ near criticality. The same scaling exponent is obtained for RN-AdS, Kerr-AdS, and Bardeen black holes, suggesting the existence of an underlying universal dynamical behaviour across distinct black hole systems. Our results establish a connection between the geometry of the free energy landscape, stochastic nonequilibrium dynamics, and universal critical phenomena in black hole thermodynamics.", "url": "https://arxiv.org/abs/2605.15655", "type": "理论", "summary": "1. 该工作通过将自由能景观随机动力学框架扩展至Kerr-AdS黑洞，分析了熵的Langevin演化，揭示了黑洞相变在临界点附近的临界减速行为。\n2. 其核心发现是弛豫时间满足普适标度关系τ∝|ε|^{-2/3}，经Fokker-Planck方程最低本征值及多种热力学路径验证，并在RN-AdS、Kerr-AdS和Bardeen黑洞中具有相同指数。\n3. 这建立了自由能景观几何、随机非平衡动力学与黑洞热力学普适临界现象间的联系，为揭示不同黑洞系统动态临界行为的普适类提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Mozib Bin Awal"}, {"name": "Prabwal Phukon"}], "featured_authors": [{"name": "Mozib Bin Awal"}, {"name": "Prabwal Phukon"}], "author_count": 2}, {"id": "2605.15776", "category": "hep-th", "title": "Exact Bulk-Boundary Pairs in AdS/CFT", "abstract": "We show that for a CFT$_D$ on a flat open solid torus, the two point function in the Weyl frame is exactly paired with a finite geodesic lying entirely in the AdS$_{D+1}$ bulk interior. This relation is exact and requires neither large $N$, strong coupling, nor heavy operators. The standard boundary-anchored relation is a singular limit of the exact pair. For the free scalar, a mode expansion along $S^1$ generates an infinite tower of effective masses on $H_{D-1}$, whose intricate propagators resum exactly to the same simple higher-dimensional geodesic expression. Together with another exact pair between disjoint entanglement entropy and entanglement wedge cross-section found on the same open solid torus, this result points toward a broader exact-pair program in AdS/CFT.", "url": "https://arxiv.org/abs/2605.15776", "type": "理论", "summary": "1. 该工作证明了在平直开口实心环上，CFT_D两点函数与AdS_{D+1}内部一条有限测地线形成精确体-界对。\n2. 其技术核心在于无需大N、强耦合或重算子，通过S^1上的模式展开将自由标量场的传播子精确求和为高维测地线表达式。\n3. 这连同同一环上纠缠熵与纠缠楔截面的另一精确对，提示AdS/CFT中存在更广泛的精确配对方案。", "summary_source": "deepseek", "authors": [{"name": "Xin Jiang"}, {"name": "Peng Wang"}, {"name": "Haitang Yang"}], "featured_authors": [{"name": "Xin Jiang"}, {"name": "Peng Wang"}, {"name": "Haitang Yang"}], "author_count": 3}, {"id": "2605.15797", "category": "hep-th", "title": "A fluid dual to charged large D membrane paradigm", "abstract": "According to the formulation of the charged large $D$ membrane paradigm, an arbitrary dynamic black hole solution to a theory of gravity with a $U(1)$ gauge field is dual to the dynamics of a membrane in a non-gravitational background. This membrane is endowed with a stress-energy tensor and a charge current, whose conservation equations govern its dynamics. In this work, we demonstrate that the dynamics of these membrane configurations (at the leading nontrivial order in $1/D$) can be mapped to a relativistic charged fluid. Establishing a correspondence for asymptotically flat black holes with a particular class of fluid systems. Unlike the standard AdS/Hydrodynamics correspondence, this dual fluid does not reside on an asymptotic boundary, but is localized strictly on the non-gravitational membrane worldvolume. By evaluating the system in both the Eckart and Landau frames, we systematically extract the out-of-equilibrium transport coefficients. We find that the fluid is governed by a negative effective thermal conductivity and a negative heat capacity, a mechanism that enforces thermodynamic stability in agreement with the quasinormal mode damping in the large $D$ Reissner-Nordström black hole geometry.", "url": "https://arxiv.org/abs/2605.15797", "type": "理论", "summary": "1. 该工作基于大D展开，将带电膜范式中的膜动力学（由应力张量与电荷流守恒方程描述）在领头阶映射为相对论性带电流体，建立了与渐近平直黑洞的对应。\n2. 与AdS/流体对偶不同，该对偶流体严格局限在非引力膜世界体上，而非定域于渐近边界；通过在Eckart和Landau框架下提取的非平衡输运系数，发现负有效热导率和负热容。\n3. 这种负输运系数机制确保了系统热力学稳定性，并与大D Reissner-Nordström黑洞的准正规模阻尼行为一致，为膜范式流体对偶的普适性及黑洞动力学研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Supratim Halder"}, {"name": "Manu Kurian"}, {"name": "Mangesh Mandlik"}], "featured_authors": [{"name": "Supratim Halder"}, {"name": "Manu Kurian"}, {"name": "Mangesh Mandlik"}], "author_count": 3}, {"id": "2605.15968", "category": "hep-th", "title": "Anomalous Transport from Effective Field Theory", "abstract": "A systematic study of chiral effects is presented using an Effective Field Theory framework. By integrating out a massive Dirac fermion at finite temperature in presence of vector and axial background fields, the currents and their anomalies are computed from the path-integral. Chiral effects previously considered separately naturally arise in a unified computation, including new mass corrections. The link between each anomalous transport effect and the anomalies is clearly established, beyond the identification of their coefficients. In particular, we can appreciate how these effects are sourced by the anomalous nature of the theory even in configurations where the anomaly itself vanishes. The consistent and covariant anomalies are both encapsulated in master formulae for the currents which result from a careful treatment of the regularisation. It is finally found that, at finite temperature, the physical currents cannot be inferred simply from the Chern-Simons terms whose divergence reproduce the chiral anomalies.", "url": "https://arxiv.org/abs/2605.15968", "type": "理论", "summary": "1. 该工作基于有效场论框架，通过路径积分在有限温度下整合矢量与轴子背景场中的有质量狄拉克费米子，系统计算了手征流及其反常。\n2. 其核心在于统一导出此前孤立研究的手征效应，揭示质量修正，并明确建立每个反常输运效应与反常的关联，即便在反常为零的构型中效应仍由理论的反常本性驱动。\n3. 这为有限温度下物理流无法由Chern-Simons项直接推断提供了理论依据，并启发了手征反常输运中正则化处理与协变反常一致性的进一步探讨。", "summary_source": "deepseek", "authors": [{"name": "Rémy Larue"}, {"name": "Amaury Marchon"}, {"name": "Jérémie Quevillon"}, {"name": "Diego Saviot"}], "featured_authors": [{"name": "Rémy Larue"}, {"name": "Amaury Marchon"}, {"name": "Jérémie Quevillon"}, {"name": "Diego Saviot"}], "author_count": 4}, {"id": "2605.16034", "category": "hep-th", "title": "Walking Sudakov: From Cusp to Octagon", "abstract": "We study the Sudakov form factor and the four-point scattering amplitude on the Coulomb branch of planar $\\mathcal{N}=4$ SYM as functions of the Coulomb-branch parameters and kinematic invariants. This setup provides a controlled probe of the interpolation between on- and off-shell regimes of infrared-sensitive quantities in gauge theories. We identify a novel scaling limit in which both observables exhibit double-logarithmic behavior gover
