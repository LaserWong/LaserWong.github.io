 assumptions of the no-go theorems that do not apply to our approach. This demonstrates that these no-go theorems are not universally applicable, contrary to their original claims.", "url": "https://arxiv.org/abs/2609.31209", "type": "理论", "summary": "1. 该工作基于van Hove接触变换的酉表示，将经典可观测量表示为Hilbert空间算子，并构建混合经典-量子系统的hybrid van Hove理论。\n2. 其核心是van Hove算子满足与相空间Poisson代数同构的对易代数，且经典波函数相位条件可保证正确期望值，优于Koopman-von Neumann方法。\n3. 该理论指出no-go定理的假设在此框架下不成立，表明其并非普遍适用，并为相互作用经典-量子振子等混合模型提供启示。", "summary_source": "deepseek", "authors": [{"name": "Marcel Reginatto"}, {"name": "Andrés Darío Bermúdez Manjarres"}, {"name": "Sebastian Ulbricht"}], "featured_authors": [{"name": "Marcel Reginatto"}, {"name": "Andrés Darío Bermúdez Manjarres"}, {"name": "Sebastian Ulbricht"}], "author_count": 3}, {"id": "2609.31223", "category": "quant-ph", "title": "Quantum interaction can superactivate cheating under parallel repetition", "abstract": "We study interactive multiprover games and many-round protocols in which the communication between the verifier and the provers is quantum. Parallel repetition is known to suppress soundness error of classical two-prover games arbitrarily close to zero, as shown by Raz (STOC '95), even with quantum strategies as shown by Yuen (ICALP '16), and Bavarian, Vidick and Yuen (STOC '17). Yet, we show that quantum communication can have the opposite, unexpected effect. Specifically, we exhibit a one-round quantum game and two-round $\\mathsf{QMIP}$ protocols whose local (unentangled) value is strictly less than one for a single instance, yet equals one under $n$-fold parallel repetition for every $n \\geq 2$. The key is that parallel repetition not only imposes additional winning conditions but also supplies additional quantum resources as entanglement in the exchanged states can be exploited jointly across copies. Our multiround examples build on superactivation of zero-error capacities of quantum channels. To establish this connection, we introduce quantum games and interactive protocols which capture the one-shot zero-error classical and quantum capacities, both with and without entanglement assistance. Our constructions use quantum-state verification and a teleportation-based reduction from two rounds to one. In contrast, when shared entanglement is allowed, we show that parallel repetition cannot increase the entangled value when at most $3$ messages are exchanged, consistent with classical results of Bellare, Impagliazzo and Naor (FOCS '97), and that of single-prover systems by Kitaev and Watrous (STOC '00). Combining this monotonicity with our quantum game-channel correspondence, we show that entanglement-assisted zero-error classical and quantum capacities cannot be superactivated.", "url": "https://arxiv.org/abs/2609.31223", "type": "理论", "summary": "1. 该工作构造出一轮量子博弈与两轮QMIP协议，其单实例局域（无纠缠）值严格小于1，却在任意n≥2重并行重复下等于1。\n2. 其关键在于并行重复还提供交换态中的纠缠作为额外量子资源，被跨副本联合利用，并借由量子态验证与两轮到一轮的传态归约联系零误差容量超激活。\n3. 这揭示量子通信可使并行重复适得其反而非降低作弊概率，并表明共享纠缠辅助下至多3条消息时纠缠值单调、相关零误差容量不可超激活。", "summary_source": "deepseek", "authors": [{"name": "Archishna Bhattacharyya"}, {"name": "Laura Mančinska"}, {"name": "Yuming Zhao"}], "featured_authors": [{"name": "Archishna Bhattacharyya"}, {"name": "Laura Mančinska"}, {"name": "Yuming Zhao"}], "author_count": 3}, {"id": "2609.31266", "category": "quant-ph", "title": "Locality and filter design for dissipative ground-state preparation", "abstract": "Ground-state preparation is a fundamental challenge in quantum many-body physics, chemistry and materials science. Dissipative state-preparation techniques engineer a Lindbladian coupling to a bath that drives the system to its ground state, needing no initial overlap. Their cost is dominated by the Hamiltonian simulations inside the filtered jump operators, since each jump is a weighted sum of Heisenberg-evolved copies, or branches, of a coupling operator. We reduce this cost by following three simple observations to their logical end. First, on a fixed time grid, linear programming optimises the branch weights, trading the heating response against the circuit cost. Second, Lieb--Robinson bounds let each branch evolve on a patch whose radius grows with its duration. Third, if the dynamics converges quickly and truncation changes the jumps only slightly, the stationary state stays near the ground state even on patches smaller than the light cone. We validate our approach numerically. On a grid of $81$ evolution times, the optimised filter reduces the worst-case heating response, or leakage, more than $116$-fold at equal cost. Across fifteen molecules and six chains, the cost falls by 27 to 56\\% at matched design-grid leakage; at matched cost, the molecular leakage falls by a factor of $2.9$ to $2\\times10^{3}$. Density-matrix simulations show high ground-state fidelity for both filters, and on Ising and Hubbard chains the cheaper filter keeps a ground-state population of at least $0.89$ on patches of three or four sites. The same patches fail on a Heisenberg chain whose truncation error falls more slowly with patch size and whose Lindbladian gap is 12 times smaller than the Ising chain's, pointing to a role for the gap in how far patches can be truncated. At fixed radius the per-branch cost becomes independent of system size, reducing the cost of dissipative state preparation.", "url": "https://arxiv.org/abs/2609.31266", "type": "理论+数值", "summary": "1. 该工作提出耗散基态制备的滤波设计框架，用线性规划优化跳跃算符各分支权重，并借助Lieb-Robinson界将分支演化限制在局域补丁上。\n2. 其卖点是在固定时间网格上权衡加热泄漏与模拟成本，使补丁半径随分支时长增长；当动力学快速收敛时，小于光锥的补丁仍能维持近基态稳态。\n3. 数值上，等成本下最坏泄漏降低逾116倍，十五种分子与六条链成本降低27%至56%，固定半径使单分支成本不随系统尺寸增长；海森堡链上同类补丁失效，其Lindbladian能隙比伊辛链小12倍，提示能隙影响可截断程度。", "summary_source": "deepseek", "authors": [{"name": "Samuel J. Elman"}], "featured_authors": [{"name": "Samuel J. Elman"}], "author_count": 1}, {"id": "2609.31312", "category": "quant-ph", "title": "Causal Query Compression for Lindblad Dynamics: Optimal Queries and Nearly Linear Local Simulation", "abstract": "We construct a causal query compiler for time-dependent Lindblad dynamics and establish query and gate bounds under distinct input models. With coherent block encodings of the Hamiltonian and individual jump operators, a Lipschitz generator can be simulated to diamond-norm error $\\varepsilon$ using $O(1+\\tau+\\log(1/\\varepsilon)/\\log(e+\\log(1/\\varepsilon)/\\tau))$ controlled queries, where $\\tau=T(\\alpha_H+\\sum_\\mu\\alpha_\\mu^2)$. This bound is independent of the time-grid size and is worst-case optimal for $\\tau\\ge1$. Weak active entry and clean return yield a factorial history tail; combining two reuse lengths removes the auxiliary input. A three-call polar correction supplies the Lindblad cells. The compiler also characterizes the minimum oracle action of bounded adaptive Markovian protocols by quantum query complexity and the general adversary bound, up to constant factors. For finite-range dynamics on $n$ lattice sites, efficient coherent evaluation of the local matrices and fixed local parameters give $O(n(T+1)\\operatorname{polylog}X)$ elementary gates, where $X=\\max\\{e,n(T+1)(1+K_t+B)/\\varepsilon\\}$, for piecewise Hölder generators with fixed exponent, local variation bound $K_t$, and at most $B$ breakpoints per term. The jumps need not commute. This gate bound includes evaluation, arithmetic, selection, routing, and environment storage. Its proof combines a spatial decomposition on a common bath, compilation on occupied inputs, and routing on compressed records. Reusing bath storage between short segments gives depth $(T+1)\\operatorname{polylog}X$ and space $n\\operatorname{polylog}X$.", "url": "https://arxiv.org/abs/2609.31312", "type": "理论+数值", "summary": "1. 该工作围绕《Causal Query Compression for Lindblad Dynamics: Optimal Queries and Nearly Linear Local Simulation》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Jacob Kitchen"}], "featured_authors": [{"name": "Jacob Kitchen"}], "author_count": 1}, {"id": "2609.31316", "category": "quant-ph", "title": "Excitation exchange between identical atoms having arbitrary angular momentum", "abstract": "Equations of motion are derived for excitation exchange between two atoms having arbitrary angular momentum.", "url": "https://arxiv.org/abs/2609.31316", "type": "理论", "summary": "1. 该工作从理论层面研究两个完全相同的原子之间的激发交换，并在二者具有任意角动量、未限定具体能级结构的一般情形下推导了相应的运动方程。\n2. 其技术核心在于不把角动量限制于特定值或少数简化能级，而是将任意角动量结构统一纳入两原子激发交换的运动方程与动力学描述。\n3. 由此得到的方程可作为分析任意角动量全同原子间激发交换动力学的通用出发点，并可启发后续向更复杂原子体系或相关谱学问题的拓展。", "summary_source": "deepseek", "authors": [{"name": "P. R. Berman"}, {"name": "Zeyuan Wang"}], "featured_authors": [{"name": "P. R. Berman"}, {"name": "Zeyuan Wang"}], "author_count": 2}, {"id": "2609.31350", "category": "quant-ph", "title": "Sharp Data-Processing Region for Quantum Conditional Rényi Entropies", "abstract": "We study the three-parameter family of quantum conditional Rényi entropies $H_{\\alpha,z}^\\lambda$ introduced in \\textit{Commun. Math. Phys.} 407, 180 (2026). We prove that the previously established data-processing region is sharp. We then characterize the club-sandwiched family through a classical coarse-graining principle: within the full data-processing region, universal monotonicity under deterministic coarse-graining of the classical conditioned register holds if and only if $z = \\alpha$. Finally, we establish rigidity of entropic duality by showing that any universal duality relation for finite-dimensional tripartite pure states must satisfy the known parameter relations. Thus, the data-processing region, the club-sandwiched subfamily, and the duality transformation are each uniquely characterized by their respective universal properties.", "url": "https://arxiv.org/abs/2609.31350", "type": "理论", "summary": "1. 该工作围绕《Sharp Data-Processing Region for Quantum Conditional Rényi Entropies》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Milad M. Goodarzi"}, {"name": "Yucheng Bao"}, {"name": "Marco Tomamichel"}], "featured_authors": [{"name": "Milad M. Goodarzi"}, {"name": "Yucheng Bao"}, {"name": "Marco Tomamichel"}], "author_count": 3}, {"id": "2609.31370", "category": "quant-ph", "title": "Adaptive Dissipative State Preparation through Reinforcement Learning", "abstract": "Dissipative algorithms approach the problem of ground state preparation by mimicking the natural thermalization of a quantum system in contact with a large, low-temperature thermal environment. The environment can be efficiently simulated by a single ancilla qubit with a variable energy gap that is repeatedly coupled to the system qubits to generate a dissipative channel, and then reset after each interaction. Here we present an adaptive implementation of the dissipative algorithm, RL-Adapt, that uses single-shot reinforcement learning to optimize the selection of ancilla frequency and system-bath interaction operator to maximize energy dissipation without relying on a priori knowledge of the system spectrum. The adaptive implementation results in significantly reduced convergence times and can successfully find the ground state even for non-ideal operator pools that fail to converge using non-adaptive, uniform random operator and ancilla frequency selection.", "url": "https://arxiv.org/abs/2609.31370", "type": "数值", "summary": "1. 该工作提出一种自适应耗散基态制备算法，将辅助比特频率与系统-浴相互作用算符的选择建模为单次强化学习优化问题，且不依赖预先知道的系统能谱。\n2. 其核心是用可变能隙单辅助比特反复耦合与重置生成耗散通道，并自适应最大化能量耗散，从而显著缩短收敛时间，并在非理想算符池中仍能找到基态，而非自适应均匀随机选择会失败。\n3. 这表明强化学习可增强耗散基态制备对未知能谱和非理想控制资源的鲁棒性，为后续量子模拟与基态制备算法设计提供启发。", "summary_source": "deepseek", "authors": [{"name": "Nathan M. Myers"}, {"name": "Chenxu Liu"}, {"name": "Yulong Dong"}, {"name": "Nicholas P. Bauman"}, {"name": "Karol Kowalski"}], "featured_authors": [{"name": "Nathan M. Myers"}, {"name": "Chenxu Liu"}, {"name": "Yulong Dong"}, {"name": "Nicholas P. Bauman"}, {"name": "Karol Kowalski"}], "author_count": 5}, {"id": "2609.31372", "category": "quant-ph", "title": "Quantum algorithms for the exponentiation of Toeplitz matrices and applications in partial differential equations", "abstract": "We present quantum algorithms to approximate the exponential of banded Toeplitz matrices. These matrices have central importance in many PDE related problems, but their quantum implementation is hindered by their possibly large norms. Constructing directly the exponential we can circumvent this limitation. By relating the lower/upper shift operators to circulant and skewcirculant generators, which are diagonalised by the QFT, we construct (i) an LCU-based block encoding of banded Toeplitz matrices, (ii) an efficient, controllably truncated Pauli-string decomposition of the circulant eigenphases with a closed-form error bound, and (iii) a specialized QFT-Trotter product formula. As an application we build a block encoding of the propagator of the discretised heat equation with periodic, Dirichlet and Neumann boundary conditions, using a frequency cutoff.", "url": "https://arxiv.org/abs/2609.31372", "type": "理论+数值", "summary": "1. 该工作提出了近似带状Toeplitz矩阵指数的量子算法，并将其用于离散热方程传播子的块编码。\n2. 其核心是利用QFT对角化循环与斜循环生成元，结合基于LCU的块编码、可控截断的Pauli串分解及专用QFT-Trotter乘积公式，在规避大范数限制的同时为循环本征相位给出闭合误差界。\n3. 这一直接构造指数的框架为周期、Dirichlet和Neumann边界条件下偏微分方程的时间演化量子模拟提供了可行路径，并可启发其他结构化矩阵的指数化。", "summary_source": "deepseek", "authors": [{"name": "Xabier Gutiérrez"}, {"name": "Nicola Mariella"}, {"name": "Javier González-Conde"}, {"name": "Sergiy Zhuk"}, {"name": "Mikel Sanz"}], "featured_authors": [{"name": "Xabier Gutiérrez"}, {"name": "Nicola Mariella"}, {"name": "Javier González-Conde"}, {"name": "Sergiy Zhuk"}, {"name": "Mikel Sanz"}], "author_count": 5}, {"id": "2609.31391", "category": "quant-ph", "title": "Shaping of the finite-size chaos crossover in Floquet circuits by coherent-mismatch architecture", "abstract": "We study how the spatial profile of a deterministic coherent gate perturbation affects finite-size quasienergy statistics and operator dynamics in U(1)-symmetric XXZ Floquet circuits. Using a shared homogeneous reference, we compare a single modified bond with an alternating perturbation applied across the whole chain. After separating symmetry sectors and checking several known integrable forms, we find that the alternating circuits move toward circular orthogonal ensemble level statistics and change operator-space entanglement and out-of-time-order correlations at smaller local amplitudes than the single defects. For intermediate numbers of modified bonds, the response is nonmonotonic and also depends on where the bonds are placed, so bond density alone is not enough. A perturbative analysis identifies the additive weight of many modified bonds, while coherent spatial interference reshapes the coupling between nearby eigenstates.", "url": "https://arxiv.org/abs/2609.31391", "type": "理论", "summary": "1. 该工作研究U(1)对称XXZ弗洛凯电路中确定性相干门微扰的空间分布如何影响有限尺寸准能级统计与算符动力学，比较单键修改与全链交替微扰两种架构。\n2. 其卖点在于微扰分析显示多键加性权重与相干空间干涉共同作用，后者重塑近邻本征态耦合，使全链交替微扰在更小局域幅度下推动能级统计趋近圆正交系综并改变算符空间纠缠与乱序关联，且中间键数响应非单调并依赖位置，仅凭键密度不足。\n3. 这为通过微扰架构而非单纯强度调控有限尺寸混沌交叉提供了依据，并对量子模拟中缺陷工程与热化/局域化研究具有启发。", "summary_source": "deepseek", "authors": [{"name": "Xiangjun Tan"}, {"name": "Wenqi Liu"}, {"name": "Hanjie Zhu"}, {"name": "Wenkai Bai"}, {"name": "Zhanning Wang"}], "featured_authors": [{"name": "Xiangjun Tan"}, {"name": "Wenqi Liu"}, {"name": "Hanjie Zhu"}, {"name": "Wenkai Bai"}, {"name": "Zhanning Wang"}], "author_count": 5}, {"id": "2609.31433", "category": "quant-ph", "title": "Angular momentum conservation in two-atom superradiance", "abstract": "Two-atom superradiance is studied for atoms having a J=0 ground state and a J=1 excited state. The atoms lie on the x-axis and are excited by a \\sigma_{+}-polarized laser pulse propagating in the z-direction. We use two, complementary approaches to obtain the final angular momentum in the field, a source-field approach and a Schrodinger picture approach. Both approaches give identical answers, but it is necessary to include terms in both calculations that, at first glance, might not be expected to contribute. We show that, owing to an exchange between a state in which atom 1 is in its m=1 excited state and atom 2 is in its ground state to one in which atom 2 is in its m=-1 excited state and atom 1 in its ground state, the final angular momentum in the field is not necessarily equal to the initial angular momentum in the two-atom system. The missing angular momentum appears as orbital angular momentum of the two atoms.", "url": "https://arxiv.org/abs/2609.31433", "type": "理论+数值", "summary": "1. 该工作研究两个J=0基态、J=1激发态原子沿x轴排列，并由沿z传播的σ+偏振激光脉冲激发时的双原子超辐射角动量守恒。\n2. 其卖点是源场法与薛定谔绘景法给出相同的末态场角动量，但均须计入初看似乎不贡献的项，且特定m=1与m=-1交换过程会改变结果。\n3. 因此末态场角动量不必等于初始两原子角动量，缺失部分作为两原子轨道角动量出现，提示需考虑原子质心运动。", "summary_source": "deepseek", "authors": [{"name": "P. R. Berman"}, {"name": "Zeyuan Wang"}, {"name": "A. Kuzmich"}], "featured_authors": [{"name": "P. R. Berman"}, {"name": "Zeyuan Wang"}, {"name": "A. Kuzmich"}], "author_count": 3}, {"id": "2609.31488", "category": "quant-ph", "title": "Connes Distance in Discrete-Time Quantum Walks", "abstract": "We study the geometric spread of discrete-time quantum walks using Connes' distance formula. We introduce its discrete analogue by adapting the continuous spectral metric to the lattice, with the Dirac operator replaced by the unitary step operator. Focusing first on a (2+1)-dimensional quantum walk, we evaluate the dynamical spread of localized wavepackets to compare propagation in free space against that under a uniform magnetic field. We find that while the free walk shows linear ballistic growth, gauge-induced phases in the magnetic walk constrain the admissible test operators, suppressing the long-time geometric expansion. Furthermore, we apply this discrete framework to a (1+1)-dimensional plastic quantum walk simulating an inhomogeneous spatial metric. The results demonstrate that the discrete Connes distance naturally captures the underlying spatially varying metric, providing a robust measure of the wavepacket's spread that adapts directly to the local simulated geometry.", "url": "https://arxiv.org/abs/2609.31488", "type": "理论+数值", "summary": "1. 该工作将连续谱度量中的Connes距离推广到离散时间量子行走，以幺正步进算子替代Dirac算子，构造格点上的离散类比并数值考察局域波包的几何传播。\n2. 其关键发现是：(2+1)维自由行走呈线性弹道增长，而均匀磁场引入的规范相位限制可容许检验算子，从而压低长时几何扩展；(1+1)维塑性行走则表明该离散距离能自然捕捉空间变化的模拟度规。\n3. 这为在量子行走平台模拟弯曲时空度规与规范场提供了可操作的几何量，并启发用离散Connes距离刻画局域传播与格点几何。", "summary_source": "deepseek", "authors": [{"name": "Rayan Trabelsi"}, {"name": "A. F. Reyes-Lega"}, {"name": "Pablo Arrighi"}], "featured_authors": [{"name": "Rayan Trabelsi"}, {"name": "A. F. Reyes-Lega"}, {"name": "Pablo Arrighi"}], "author_count": 3}, {"id": "2609.31502", "category": "quant-ph", "title": "Parallel and Distributed Fermionic Simulation via Dynamic Encoding", "abstract": "We demonstrate a simple and efficient method to parallelize and distribute Trotterized Hamiltonian simulation of fermionic systems across multiple QPUs. Using combinatorial covering designs to define a minimal set of fermion-qubit encodings, we demonstrate communication cost scaling as $\\mathcal{O}(M r)$ for a system of $M$ fermionic modes and Trotter number $r$, improving on the static encoding bound for $q$ QPUs, $\\mathcal{O}(M^4 q r)$. We compare this approach to dynamic encoding using a randomised method, Pauli-weight based optimisation and hypergraph partitioning. Applying this to the Hamiltonians of a range of molecular systems, we find the combinatorial covering approach results in the lowest communication cost in all but the sparsest Hamiltonians.", "url": "https://arxiv.org/abs/2609.31502", "type": "理论+数值", "summary": "1. 该工作提出并演示一种动态编码方案，将费米子体系的 Trotter 化哈密顿量模拟并行、分布式地扩展到多个量子处理单元（QPU）。\n2. 其核心是用组合覆盖设计构造最小费米子-量子比特编码集合，使通信开销随费米模式数 M 与 Trotter 数 r 呈 O(Mr) 标度，优于 q 个 QPU 下静态编码的 O(M^4 q r)，并与随机化、Pauli 权重优化和超图划分方法比较。\n3. 在多种分子哈密顿量上，除最稀疏情形外，组合覆盖法均实现最低通信成本，为跨 QPU 的大规模费米子量子模拟提供了可扩展的编码策略。", "summary_source": "deepseek", "authors": [{"name": "Michael Williams de la Bastida"}, {"name": "Peter V. Coveney"}], "featured_authors": [{"name": "Michael Williams de la Bastida"}, {"name": "Peter V. Coveney"}], "author_count": 2}, {"id": "2609.31520", "category": "quant-ph", "title": "Complexity Barriers to State Preparation in Quantum Approximate Optimization", "abstract": "For many important optimization problems we are restricted to approximate solutions in practice due to computational complexity. Distinct from the exact optimization setting, approximate optimization admits performance measures beyond whether the optimum is found, with different tradeoffs and complexity. For MaxCut, a near-unity (ordinary) approximation ratio can coexist with near-zero improvement (gain) over a random cut. For the standard encoding, the unconditional classical MaxCut-Gain hardness gap implies that \\emph{any uniformly efficient quantum or hybrid procedure recovering a fixed positive fraction of the optimal classical gain on every input, with at least inverse-polynomial success probability, would place} NP \\emph{in} BQP. Such a procedure is therefore believed impossible under standard assumptions. We broadly address where our worst-case barriers do or do not apply across the quantum algorithm landscape. We prove that the barrier survives quantum random access optimization (QRAO) compression and applies between the classical and relaxed optimal values. For every input, a product state attains the classical optimum. Thus the barrier to reaching the classical threshold does not arise from a need for entanglement. For $d\\in\\{2,3\\}$ variables per qubit, the known decoder transfers encoded energy gain to decoded mean gain by the exact factor $1/d^2$. Combining this identity with MaxCut-Gain hardness gives an operational preparation barrier for QRAO. We also construct hard $n$-qubit families with relative quantum relaxation excess $\\Theta(1/n)$, while the maximally mixed state has energy approximation ratio $1-\\Theta(1/n)$, zero encoded energy gain, and hence zero decoded mean gain. Our results separate the effects of relaxation tightness and energy approximation from operational accessibility, motivating more comprehensive accounting in benchmarking and performance assessment.", "url": "https://arxiv.org/abs/2609.31520", "type": "理论+数值", "summary": "1. 该文研究量子近似优化中态制备的复杂度壁垒，并在量子随机存取优化压缩下证明最大割增益难解性持续存在。\n2. 其核心卖点是证明经典阈值壁垒不源于纠缠需求，且解码增益严格按每量子位变量数的平方倒数传递并构成量子随机存取优化的操作性壁垒。\n3. 该结果将松弛紧致性与能量近似同操作可及性分离，提示量子优化基准应综合计入增益与逆多项式成功概率等操作性指标。", "summary_source": "deepseek", "authors": [{"name": "Stuart Hadfield"}], "featured_authors": [{"name": "Stuart Hadfield"}], "author_count": 1}, {"id": "2609.31554", "category": "quant-ph", "title": "Exact Solutions of the Dunkl--Pauli Equation in the Presence of a Magnetic Field from an su(1,1) Algebraic Approach", "abstract": "We investigate the two-dimensional Dunkl--Pauli equation for a spin--$1/2$ particle in the presence of an external magnetic field within an algebraic framework. While previous studies have provided exact solutions of the Dunkl--Pauli system, its underlying dynamical symmetry and algebraic structure remain largely unexplored. By employing Schrödinger factorization, we construct the generators of the $\\mathfrak{su}(1,1)$ algebra and establish the associated symmetry of the radial sector. The energy spectrum is derived using irreducible unitary representations, and the corresponding Sturmian radial basis is obtained analytically. Furthermore, $\\mathrm{SU}(1,1)$ coherent states are constructed and their time evolution is analyzed, revealing a characteristic radial breathing behavior. The results show that the Dunkl deformation introduces parity-dependent modifications in the spatial structure of the system while preserving its underlying algebraic dynamics.", "url": "https://arxiv.org/abs/2609.31554", "type": "理论", "summary": "1. 该工作在存在外磁场时，用su(1,1)代数框架求解自旋1/2粒子的二维Dunkl-Pauli方程，并建立径向扇区的动力学对称。\n2. 其核心是通过薛定谔分解构造su(1,1)生成元，由不可约幺正表示导出能谱与解析Sturmian径向基，并构造SU(1,1)相干态分析时间演化与径向呼吸。\n3. 结果表明Dunkl形变在保持底层代数动力学的同时引入宇称依赖的空间结构修正，为形变量子系统与相干态动力学研究提供代数框架。", "summary_source": "deepseek", "authors": [{"name": "M.Salazar Ramírez"}, {"name": "B. C. Lütfüoğlu"}, {"name": "H. Bouguerne"}], "featured_authors": [{"name": "M.Salazar Ramírez"}, {"name": "B. C. Lütfüoğlu"}, {"name": "H. Bouguerne"}], "author_count": 3}, {"id": "2609.31609", "category": "quant-ph", "title": "Exact series formulas for the capacities of the amplitude damping channel", "abstract": "We derive explicit, absolutely convergent series formulas for the quantum, unassisted classical, and entanglement-assisted classical capacities of the qubit amplitude damping channel, eliminating residual optimizations and implicit roots. We also obtain analytical upper and lower bounds on two-way assisted quantum and private communication capacities by evaluating a balanced-squashing bound and optimizing the reverse coherent information. Our results characterize the optimal input populations, establish convergence and truncation properties, and provide analytical benchmarks for quantum and classical communication over dissipative channels.", "url": "https://arxiv.org/abs/2609.31609", "type": "理论+数值", "summary": "1. 该工作为量子比特振幅阻尼信道推导了量子容量、无辅助经典容量和纠缠辅助经典容量的显式且绝对收敛的级数公式，并给出了双向辅助量子与私密通信容量的解析上下界。\n2. 其核心卖点是用显式级数消除残余优化和隐式求根，同时通过平衡压缩界与反向相干信息优化刻画最优输入布居及收敛、截断性质。\n3. 这为耗散信道上的量子与经典通信建立了可计算的解析基准，并启发后续容量公式、界与实验协议评估的对照研究。", "summary_source": "deepseek", "authors": [{"name": "Stefano Pirandola"}], "featured_authors": [{"name": "Stefano Pirandola"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
