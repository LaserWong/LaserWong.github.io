布的转变。\n3. 这为将非广延性的出现与温度涨落的对称破缺相联系提供了证据，并提示可从复杂性驱动的角度理解近平衡体系偏离热平衡的统计特征。", "summary_source": "deepseek", "authors": [{"name": "D. Rosales Herrera"}, {"name": "M. Y. Gallegos Ruiz"}, {"name": "A. Fernández Téllez"}, {"name": "J. R. Alvarado García"}, {"name": "J. E. Ramírez"}], "featured_authors": [{"name": "D. Rosales Herrera"}, {"name": "M. Y. Gallegos Ruiz"}, {"name": "A. Fernández Téllez"}, {"name": "J. R. Alvarado García"}, {"name": "J. E. Ramírez"}], "author_count": 5}, {"id": "2609.31533", "category": "cond-mat", "title": "Structural prediction of B$_{18}$Y$_{2}$ cluster: A Machine-Learning-Assisted Basin-Hopping Study", "abstract": "The structural and optical properties of the doubly yttrium-doped boron cluster B$_{18}$Y$_2$ have been systematically investigated using density functional theory calculations. The lowest-energy structure was identified through extensive basin-hopping searches accelerated by a pre-trained MACE machine-learning potential and subsequently refined and validated at the DFT level. The resulting global-minimum structure adopts a double-ring geometry, consisting of two fused B$_9$ rings stabilized by yttrium atoms positioned above and below the boron framework. Vibrational frequency calculations confirm the dynamical stability of the optimized structure, while the calculated infrared and UV--Vis spectra provide characteristic signatures of the Y--B interactions and the electronic structure of the boron framework. These results demonstrate how yttrium doping can stabilize unusual double-ring boron architectures and highlight the effectiveness of machine-learning-assisted basin-hopping searches for exploring the complex potential-energy landscapes of doped boron clusters.", "url": "https://arxiv.org/abs/2609.31533", "type": "理论+数值", "summary": "1. 该工作用密度泛函理论结合预训练MACE机器学习势加速的盆跳搜索，系统研究双钇掺杂硼团簇B18Y2的结构与光学性质并确定其全局最低能构型。\n2. 核心卖点是以机器学习势高效遍历复杂势能面、再经DFT精修与振动频率验证，得到两个融合B9环由上下Y原子稳定的双环全局最小结构，并给出Y–B相互作用及硼骨架电子结构的红外与紫外-可见光谱特征。\n3. 这既说明Y掺杂可稳定非常规双环硼架构，也表明机器学习辅助盆跳是探索掺杂硼团簇复杂势能面的有效策略，可启发后续结构与光谱实验。", "summary_source": "deepseek", "authors": [{"name": "Peter Ludwig Rodríguez-Kessler"}], "featured_authors": [{"name": "Peter Ludwig Rodríguez-Kessler"}], "author_count": 1}, {"id": "2609.31616", "category": "cond-mat", "title": "A Unified Spin-Fermion Framework for Magnetic Diversity in Chromium Monopnictides", "abstract": "Isoelectronic compounds are generally expected to exhibit related electronic, structural, and magnetic behavior. Chromium monopnictides CrX (X= Sb, As, P), however, display a striking evolution from high-temperature altermagnetism in NiAs-type CrSb, through double-helical antiferromagnetism in MnP-type CrAs, to the absence of resolved long-range magnetic order in MnP-type CrP. Here, combining first-principles calculations in the non-collinear Curie-paramagnetic state, structural analysis, magnetic phase-diagram calculations, and exchange-parameter extraction, we establish a unified microscopic framework for this evolution. All three compounds share a formal high-spin $d^5$ configuration, nominally Cr$^{1+}$, coupled to itinerant states of predominantly pnictogen character. From Sb to P, chemical pressure enhances ligand itinerancy and drives the structural evolution from the high-symmetry NiAs lattice to increasingly distorted MnP-type networks. The accompanying reconstruction of competing Cr-Cr exchanges favors A-type antiferromagnetism in CrSb and double-helical order in CrAs, while placing CrP near a frustrated regime with closely competing magnetic tendencies. Our results establish chemical-pressure-driven exchange reconstruction as a general mechanism through which a common spin-fermion electronic structure can generate contrasting magnetic phases in strongly correlated materials.", "url": "https://arxiv.org/abs/2609.31616", "type": "理论+数值", "summary": "1. 通常期望等电子化合物表现出相关的电子、结构和磁性行为。\n2. 我们的结果将化学压力驱动的交换重建确立为一种通用机制，通过该机制，常见的自旋费米子电子结构可以在强相关材料中产生对比的磁相。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Ruoshi Jiang"}, {"name": "Bartomeu Monserrat"}], "featured_authors": [{"name": "Ruoshi Jiang"}, {"name": "Bartomeu Monserrat"}], "author_count": 2}, {"id": "2609.31618", "category": "cond-mat", "title": "Quantum Representation Selects Neutral Skyrmion Molecules", "abstract": "Skyrmions experience a sideways gyroscopic force when they move. Bound molecules can cancel this force; we call them gyroscopically neutral. We show that the quantum states available on each site of a magnet select the composition needed for cancellation. In two models of $SU(3)$ magnetism, this composition changes from a pair to a trimer. Both models assign exactly the same energy to every configuration of their common classical order parameter, isolating the effect of the local quantum states. Neutral molecules can also unwind when additional local states are allowed. Mean field calculations nevertheless find both compositions bound and locally stable, with the neutral trimer surviving sampled interaction changes. Comparing their motion reveals the changed cancellation rule, and prepared neutral molecules translate over short distances with little deformation.", "url": "https://arxiv.org/abs/2609.31618", "type": "理论+数值", "summary": "1. 该工作研究磁体格点上的量子表示如何选择陀螺式中性斯格明子分子的组成，并在两个 SU(3) 磁学模型中比较成对与三聚体两种方案。\n2. 关键卖点是两个模型对共同经典序参量的每个构型赋予完全相同的能量，从而把组成由成对变为三聚体的效应干净地归因于局域量子态，并揭示改变后的陀螺力抵消规则。\n3. 平均场计算显示两种组成均可束缚且局域稳定，中性三聚体在抽样相互作用变化下仍存活，预制中性分子可短距离平动而形变很小，这为通过量子表示调控斯格明子分子输运提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Vishnu Jejjala"}], "featured_authors": [{"name": "Vishnu Jejjala"}], "author_count": 1}, {"id": "2609.30362", "category": "hep-th", "title": "Informational and algebraic renormalization group", "abstract": "Renormalization group (RG) is a core concept in physics from statistical mechanics to quantum field theory, yet its schemes differ widely between field theory and many-body physics. We formulate the Wilsonian RG as a quantum channel, whose Kraus representation yields pure conditional trajectories for pure inputs and recovers mixed-state flows upon averaging. We then develop an algebraic extension applicable beyond the usual momentum-space, factorized setting: the low-energy algebra is constructed from the one-particle spectrum, and coarse graining is a conditional expectation onto it. We further construct a resource theory of RG whose free states are fixed points. Under stated assumptions, the resulting relative-entropy monotone is proportional to $c-c_{\\rm IR}$ to quadratic order along a single stable RG direction near a two-dimensional IR fixed point. We also introduce a complementary measure of the UV information discarded by coarse graining, establish its monotonicity for successive coarse-graining maps, and discuss its holographic realization.", "url": "https://arxiv.org/abs/2609.30362", "type": "理论", "summary": "1. 该工作将Wilsonian重整化群表述为量子信道，其Kraus表示对纯态输入给出纯条件轨迹，平均后恢复混态流，并发展出超越动量空间与因子化情形的代数推广。\n2. 其核心卖点是把低能代数由单粒子谱构造、把粗粒化视为到该代数的条件期望，并建立以不动点为自由态的RG资源理论，使相对熵单调量在二维红外不动点附近沿单一稳定RG方向至二阶与c−c_IR成正比。\n3. 该框架还引入衡量粗粒化所丢弃紫外信息的互补度量，证明其在连续粗粒化映射下的单调性，并讨论全息实现，为统一场论与多体物理中的RG方案提供了可操作的代数与信息论语言。", "summary_source": "deepseek", "authors": [{"name": "Takato Mori"}, {"name": "Teruaki Nagasawa"}], "featured_authors": [{"name": "Takato Mori"}, {"name": "Teruaki Nagasawa"}], "author_count": 2}, {"id": "2609.30369", "category": "hep-th", "title": "Entanglement transitions in holographic conformal interfaces", "abstract": "We study entanglement transitions for pairs of disjoint intervals in two-dimensional holographic interface conformal field theories. We consider several holographic models with equal central charges on the two sides of the interface: thin-wall geometries with one and two branes, the Janus solution, and the super-Janus solution. We first discuss the finite interface contribution to the entanglement entropy of a single interval, distinguishing intervals that cross the interface from those that lie entirely on one side. We then use the mutual information to locate the transition between connected and disconnected Ryu--Takayanagi geodesic configurations for two intervals. When the interface lies between the two intervals, increasing the boundary entropy $\\log g$, which provides a measure of interface strength in the models considered here, generally decreases the critical separation at which the connected configuration ceases to dominate. When both intervals lie on the same side of the interface, the behavior is model dependent: the connected phase persists to larger separations in the Janus and super-Janus models, while the critical separation is unchanged in the thin-wall models. Thus, as diagnosed by the two-interval transition, the interface weakens correlations across the interface while preserving or enhancing correlations between regions on the same side. We also identify a universal ``Silver Blaze'' configuration, in which the interface lies inside one of the intervals and the transition occurs at the same location as in a CFT without an interface, independently of the interface parameters and of the holographic model. This universality follows from a cancellation between crossing and non-crossing interface contributions to the mutual information.", "url": "https://arxiv.org/abs/2609.30369", "type": "理论", "summary": "1. 我们研究二维全息界面共形场论中不相交间隔对的纠缠跃迁。\n2. 因此，正如通过两区间转变所诊断的那样，界面削弱了界面上的相关性，同时保留或增强了同一侧区域之间的相关性。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Evangelos Afxonidis"}, {"name": "Rotem Berman"}, {"name": "Ignacio Carreño Bolla"}, {"name": "Shira Chapman"}, {"name": "Carlos Hoyos"}, {"name": "Osher Shoval"}], "featured_authors": [{"name": "Evangelos Afxonidis"}, {"name": "Rotem Berman"}, {"name": "Ignacio Carreño Bolla"}, {"name": "Shira Chapman"}, {"name": "Carlos Hoyos"}, {"name": "Osher Shoval"}], "author_count": 6}, {"id": "2609.30370", "category": "hep-th", "title": "Tracing out massive fields in cosmology", "abstract": "Cosmological correlators are calculated through the in-in formalism in (quasi-)de Sitter background. Its effective description is best represented by a reduced density matrix. In this work, we study how integrating out a massive field in de Sitter space determines the reduced density matrix of a light field at a finite observation time. Starting from a quasi-single-field model with non-linear couplings, we first evaluate the massive field wavefunctional at fixed final value and then trace over this value. The trace generates branch-mixing terms which are generally present in the Schwinger--Keldysh description. For a conformally coupled massive field, we show explicitly that the light field bispectrum from the effective description agrees with a full theory calculation. This example also shows that decay of a field at the future boundary does not by itself justify discarding its contribution to the trace. We discuss the differences between an exact nonlocal effective description and the local effective field theory obtained through a large mass expansion. We then identify which local cubic terms affect the late-time probability and which contribute only a wavefunctional phase. Finally, we organize the resulting kernels by response, noise, and Schwinger--Keldysh consistency conditions, and discuss the symmetry constraints on the reduced density matrix.", "url": "https://arxiv.org/abs/2609.30370", "type": "理论", "summary": "1. 该工作在准德西特时空中积掉大质量场，通过对固定末值波函数泛函求迹，得到有限观测时刻轻场的约化密度矩阵，并在非线性耦合准单场模型下计算其施温格-凯尔迪什核。\n2. 主要卖点在于：对共形耦合大质量场，有效描述给出的轻场双谱与全理论一致；求迹产生施温格-凯尔迪什分支混合项，说明未来边界上的场衰减本身不足以丢弃其对迹的贡献。\n3. 该框架比较精确非局域有效描述与大质量展开局域有效场论，区分影响晚期概率和仅贡献波函数相位的局域三次项，并按响应、噪声及施温格-凯尔迪什一致性条件组织核，讨论约化密度矩阵的对称性约束。", "summary_source": "deepseek", "authors": [{"name": "Guanhao Sun"}, {"name": "Sam S.C. Wong"}], "featured_authors": [{"name": "Guanhao Sun"}, {"name": "Sam S.C. Wong"}], "author_count": 2}, {"id": "2609.30371", "category": "hep-th", "title": "Boundaries of the compact free boson through edge modes and boundary SymTFT", "abstract": "We study boundary conditions of the compact free boson theory by coupling the bulk scalar to one-dimensional topological edge modes. We show that a single compact edge mode realizes the Dirichlet family, while a two field system realizes the Neumann family; more general compact edge theories can describe superpositions of boundary conditions and reproduce the expected boundary operator spectra. We then study this system in the framework of boundary SymTFT. We show that the edge mode theories of Dirichlet and Neumann boundaries are encoded in the degrees of freedom localized on the corners and the choice of polarization on the topological face of the boundary SymTFT. We further show that the T-duality defect exchanges the data associated with the Dirichlet and Neumann configurations. Finally, we explore extensions involving non-compact edge modes and multiple bulk fields, obtaining continuous boundary spectra in the first case and mixed boundary conditions in the second.", "url": "https://arxiv.org/abs/2609.30371", "type": "理论", "summary": "1. 该文通过将紧致自由玻色子的体标量耦合到一维拓扑边缘模式，系统研究其边界条件，并表明单个紧致边缘模式实现狄利克雷族、双场系统实现诺伊曼族，而更一般的紧致边缘理论可描述边界条件叠加并复现预期边界算符谱。\n2. 其核心卖点是在边界对称拓扑场论框架中，将狄利克雷与诺伊曼边缘理论编码为角局域自由度及拓扑面上的极化选择，并证明T对偶缺陷交换这两类构型的数据。\n3. 对非紧致边缘模式与多体场的推广分别得到连续边界谱和混合边界条件，这提示边缘模式与边界对称拓扑场论可作为统一刻画紧致玻色子边界及其对偶的构造性工具。", "summary_source": "deepseek", "authors": [{"name": "Daniel Robbins"}, {"name": "Subham Roy"}, {"name": "Hassaan Saleem"}], "featured_authors": [{"name": "Daniel Robbins"}, {"name": "Subham Roy"}, {"name": "Hassaan Saleem"}], "author_count": 3}, {"id": "2609.30426", "category": "hep-th", "title": "Classification of Conformal Supersymmetric Deformations of Schwarzschild Spacetime via Super Poisson-Lie T-duality/Plurality", "abstract": "This paper investigates conformal supersymmetric deformations of Schwarzschild spacetime through the framework of super Poisson-Lie T-duality/plurality. We first study super non-Abelian T-duality in $\\sigma$-models featuring a Schwarzschild metric coupled to two fermionic fields. This is realized by describing the original four-dimensional geometry and its dual counterpart via semi-Abelian Drinfeld superdoubles generated by the Lie superalgebras $({\\C}^3 +{\\A})$, ${\\C}^3 \\oplus {\\A}_{1,1}$ and $(2{ \\A}_{1,1}+2{ \\A})^0$, supplemented by two spectator fields. We enforce the vanishing of one-loop beta-function equations for both original and dual models to guarantee UV finiteness at quantum level; this procedure necessitates the inclusion of the dilaton field alongside the metric and the Kalb-Ramond field ($B$-field) already present in the classical action. We further study the curvature invariants, singularity structure, and superisometries, and compare the resulting supergeometries, with particular emphasis on their fermionic parts and $B$-fields. Starting from the decompositions of semi-Abelian Drinfeld superdoubles associated with the $({\\C}^3 +{\\A})$ and ${\\C}^3 \\oplus {\\A}_{1,1}$ Lie superalgebras, we derive the conformal duality/plurality chains for four-dimensional string backgrounds, characterized by a Schwarzschild metric coupled to two fermions. Our results span an interesting spectrum of super Poisson-Lie T-dual $\\sigma$-models described by Lie superalgebras with two bosonic and two fermionic generators. These are all non-trivial and interesting examples of super Poisson-Lie T-dual models which help in the intent of providing a general classification of four-dimensional geometries describing supergravity backgrounds.", "url": "https://arxiv.org/abs/2609.30426", "type": "理论", "summary": "1. 本文在超Poisson-Lie T对偶/plurality框架下，研究Schwarzschild度规耦合两个费米子所描述的四维弦背景的共形超对称形变，并构造相应的超非阿贝尔T对偶σ模型。\n2. 其技术核心是以半阿贝尔Drinfeld超双重实现原几何与对偶几何，强制单圈β函数消失以保证紫外有限，由此引入伸缩子，并比较曲率不变量、奇点结构、超等距及费米子部分与B场。\n3. 由(C^3+A)、C^3⊕A_{1,1}等李超代数分解导出的共形对偶/plurality链，给出两玻色两费米生成元的一类非平凡超Poisson-Lie T对偶模型，为四维超引力背景几何的分类提供线索。", "summary_source": "deepseek", "authors": [{"name": "Ali Eghbali"}, {"name": "Meysam Hosseinpour-Sadid"}, {"name": "Adel Rezaei-Aghdam"}], "featured_authors": [{"name": "Ali Eghbali"}, {"name": "Meysam Hosseinpour-Sadid"}, {"name": "Adel Rezaei-Aghdam"}], "author_count": 3}, {"id": "2609.30453", "category": "hep-th", "title": "de Sitter Spacetime: Geometry, Causal Structure, and Quantum Fields", "abstract": "de~Sitter spacetime plays a central role in modern cosmology, providing an excellent approximation to both inflation and the present accelerated expansion. It also offers a particularly simple setting in which gravity, spacetime symmetry, and quantum field theory depart qualitatively from their Minkowski-space counterparts. These lecture notes introduce de Sitter spacetime, from its geometry and symmetries to quantum fields and perturbations on a fixed \\(3+1\\)-dimensional de Sitter background. We cover coordinate systems, causal structure, unitary representations, particle production in time-dependent backgrounds, and cosmological perturbations, with emphasis on physical interpretation, applications to cosmology, and how curvature reshapes the notions of mass, vacuum, particles, and late-time observables.", "url": "https://arxiv.org/abs/2609.30453", "type": "理论", "summary": "1. 该讲义系统介绍了3+1维de Sitter时空的坐标体系、对称性、因果结构，以及在固定背景上的量子场、粒子产生与宇宙学微扰。\n2. 其核心内容包括不同坐标系的物理诠释、de Sitter群幺正表示、时变背景中的粒子产生和规范不变的微扰演化，并强调曲率如何重塑质量、真空、粒子及晚期可观测量的物理含义。\n3. 这为理解暴胀与当前加速膨胀中的量子场论效应提供了统一框架，也提示后续研究需谨慎处理de Sitter中真空定义、粒子概念与观测量的内在依赖性。", "summary_source": "deepseek", "authors": [{"name": "Azadeh Maleknejad"}, {"name": "Ethan Richardson"}], "featured_authors": [{"name": "Azadeh Maleknejad"}, {"name": "Ethan Richardson"}], "author_count": 2}, {"id": "2609.30473", "category": "hep-th", "title": "Divergences in Nonpolynomial Quantum Field Theories", "abstract": "The structure of divergences in several nonpolynomial scalar quantum field theories are investigated. Various $n$-point Green functions for nonpolynomial theories are calculated and their renormalization is analyzed, with special regard for the nonpolynomial $\\left|\\phi\\right|^{3}$ theory in $4$ spacetime dimensions.", "url": "https://arxiv.org/abs/2609.30473", "type": "理论", "summary": "1. 该文研究了若干非多项式标量量子场论的发散结构，计算多点格林函数并分析其重整化，特别关注四维非多项式 |φ|^3 理论。\n2. 其技术核心是系统计算各 n 点格林函数，刻画非多项式相互作用下的发散类型与重整化处理，而非局限于多项式模型。\n3. 这为厘清四维 |φ|^3 等非多项式理论的可重整化性及后续发散结构分类提供了明确出发点。", "summary_source": "deepseek", "authors": [{"name": "Galib Hoq"}, {"name": "Thomas Curtright"}], "featured_authors": [{"name": "Galib Hoq"}, {"name": "Thomas Curtright"}], "author_count": 2}, {"id": "2609.30754", "category": "hep-th", "title": "Genuine Multi-Entropy of Fully Symmetric Gaussian States", "abstract": "We study the tri-partite genuine Rényi multi-entropy of fully symmetric Gaussian states as a function of the squeezing parameter for different total number of bosonic modes under different subsystem configurations. Exact results for a few modes are obtained, and we conjecture an asymptotic formula at the limit of large squeezing parameter as a function of the replica index $n$, while also finding subleading subsystem-size dependent terms for $n=3$ under a specific tripartition. We analytically show that the genuine $n=2$ Rényi multi-entropy of any pure bosonic Gaussian states is zero for any number of modes and for any tripartition. Furthermore, to investigate the dependence on subsystem size, we plot the curve of genuine Rényi multi-entropy as a function of the number of modes in the subsystems while keeping the total number of modes fixed. We discuss differences and similarities between this result and studies of the multi-entropy curve for Haar random states. In particular, we identify a subsystem size configuration related with the multi-entropy time in an evaporating black hole for which the behavior of the genuine multi-entropy changes.", "url": "https://arxiv.org/abs/2609.30754", "type": "理论", "summary": "1. 该文研究全对称高斯态在三部划分下的真正Rényi多熵，给出少量模式精确结果并分析其随压缩参数与模式数的变化。\n2. 其卖点是导出大压缩下按复本指数n的渐近公式，并证明任意纯玻色高斯态的n=2真正多熵恒为零，且给出n=3特定划分的次领头项。\n3. 该结果在与Haar随机态多熵曲线的异同及蒸发黑洞多熵时间相关子系统配置上，为后续多熵演化研究提供具体参照。", "summary_source": "deepseek", "authors": [{"name": "Hugo A. Camargo"}, {"name": "Mitsuhiro Nishida"}], "featured_authors": [{"name": "Hugo A. Camargo"}, {"name": "Mitsuhiro Nishida"}], "author_count": 2}, {"id": "2609.30964", "category": "hep-th", "title": "Dyonic edge modes in Abelian gauge theory", "abstract": "We find new boundary conditions in four-dimensional Abelian gauge theory with general Chern--Simons boundary couplings. The boundary conditions allow dyonic edge modes and physical boundary symmetries. In particular, one of the new boundary conditions makes both electric and magnetic charges physical. We also study how our boundary conditions and charges transform under the $\\mathrm{SL}(2,\\mathbb Z)$ duality.", "url": "https://arxiv.org/abs/2609.30964", "type": "理论", "summary": "1. 该文在四维阿贝尔规范理论中，针对一般陈-西蒙斯边界耦合寻找新的边界条件。\n2. 其核心是允许双荷边缘模和物理边界对称性，且有一类条件使电荷与磁荷同时成为物理量。\n3. 作者还考察这些条件与荷在SL(2,Z)对偶下的变换，为边界对称性与双荷物理提供新启示。", "summary_source": "deepseek", "authors": [{"name": "Keito Shimizu"}, {"name": "Sotaro Sugishita"}], "featured_authors": [{"name": "Keito Shimizu"}, {"name": "Sotaro Sugishita"}], "author_count": 2}, {"id": "2609.31055", "category": "hep-th", "title": "Hilbert space in the flat limit of AdS/CFT. I. Massive particles", "abstract": "The flat limit of AdS$_4$ spacetime corresponds, at the level of the symmetry algebra, to the Inönü--Wigner contraction $\\mathfrak{so}(2,3) \\to \\mathfrak{iso}(1,3)$. We describe the emergence of the Hilbert space of massive scattering states of arbitrary integer spin $s$ from unitary lowest-weight representations $\\mathcal{D}(\\Delta,s)$ of the conformal group, using a basis of `pseudo-momentum' states first introduced by Fronsdal. These states nicely reduce to Wigner's momentum eigenstates in the limit of vanishing AdS curvature radius $\\ell \\to \\infty$, at fixed $m=\\Delta/\\ell$. A simple conformal map relates this description to conformal fields in $\\mathbb{R}^3$ familiar from radial quantization, with the interior and exterior of the unit ball respectively corresponding to outgoing and ingoing momenta. Under the contraction, and upon appropriate rescaling, the inner product on $\\mathcal{D}(\\Delta,s)$ converges to the standard Lorentz-invariant inner product of Wigner's massive particles, so that unitarity is preserved throughout. The contraction to massless particles is briefly discussed here, and will be treated in detail in a forthcoming paper.", "url": "https://arxiv.org/abs/2609.31055", "type": "理论", "summary": "1. 该工作通过Inönü–Wigner收缩so(2,3)→iso(1,3)，从共形群幺正最低权表示D(Δ,s)构造AdS4平直极限下任意整数自旋s的有质量散射态希尔伯特空间。\n2. 其技术卖点在于采用Fronsdal赝动量基，并借助单位球内外分别对应出射/入射动量的共形映射，使固定m=Δ/ℓ且ℓ→∞时D(Δ,s)内积经重标度收敛为Wigner有质量粒子的洛伦兹不变内积，保持幺正性。\n3. 该结果将AdS/CFT径向量子化与平直空间散射态联系起来，为无质量极限及更一般平直极限下的全息对应提供了可推广框架。", "summary_source": "deepseek", "authors": [{"name": "Kevin Nguyen"}], "featured_authors": [{"name": "Kevin Nguyen"}], "author_count": 1}, {"id": "2609.31237", "category": "hep-th", "title": "Conformal correlator systems", "abstract": "In critical limits of statistical models, there exist non-local correlators that are conformally covariant without belonging to a conformal field theory. To describe such correlators, we define conformal correlator systems, whose axioms are weaker than those of CFT. As a result, $N$-point correlators are determined by $4$-point correlators, instead of $3$-point correlators in CFT. In two dimensions, conformal spins may take arbitrary complex values, leading to correlators with nontrivial monodromies. We show that sphere $4$-point correlators and torus $1$-point correlators obey nontrivial monodromy constraints. We construct correlators with abelian monodromies in free bosonic theories and in critical loop models.", "url": "https://arxiv.org/abs/2609.31237", "type": "理论", "summary": "1. 该工作针对临界统计模型中存在共形协变但不属于共形场论的非局域关联函数，提出并定义了共形关联系统。\n2. 其技术核心在于采用弱于共形场论的公理，使N点关联函数由4点而非3点关联函数确定，并允许二维共形自旋取任意复数值以产生非平凡单值性；该框架进一步表明球面4点与环面1点关联函数受非平凡单值性约束。\n3. 该框架在自由玻色理论和临界圈模型中构造出具有阿贝尔单值性的关联函数，为超越共形场论的临界非局域关联提供分类线索与构造起点。", "summary_source": "deepseek", "authors": [{"name": "Sylvain Ribault"}], "featured_authors": [{"name": "Sylvain Ribault"}], "author_count": 1}, {"id": "2609.31273", "category": "hep-th", "title": "Revisiting three-dimensional GLSMs and K-theoretic I-functions", "abstract": "We revisit the correspondence between three-dimensional gauged linear sigma models and K-theoretic Gromov-Witten theory. We show that the K-theoretic Hori-Vafa formula for the grassmannian arises from the three-dimensional gauge theory upon including an appropriate anomaly-cancellation factor. Furthermore, we derive K-theoretic I-functions for isotropic grassmannians by incorporating symmetric and anti-symmetric tensor representation fields together with suitable boundary conditions.", "url": "https://arxiv.org/abs/2609.31273", "type": "理论", "summary": "1. 该工作重新审视三维规范线性σ模型与K理论Gromov-Witten理论之间的对应关系。\n2. 其核心是引入适当反常抵消因子，使格拉斯曼流形的K理论Hori-Vafa公式可由三维规范理论得到，并通过加入对称与反对称张量表示场及合适边界条件，导出迷向格拉斯曼流形的K理论I函数。\n3. 这表明三维GLSM可作为构造K理论I函数的有效框架，并提示张量表示与边界条件在推广该对应中的关键作用。", "summary_source": "deepseek", "authors": [{"name": "Taro Kimura"}, {"name": "Yinda Li"}, {"name": "Xiaohan Yan"}], "featured_authors": [{"name": "Taro Kimura"}, {"name": "Yinda Li"}, {"name": "Xiaohan Yan"}], "author_count": 3}, {"id": "2609.31309", "category": "hep-th", "title": "Fate of Bouncing Singularities at Finite $G_N$", "abstract": "The gravity approximation to a thermal two-point function can develop a complex-time singularity associated with a trajectory that reaches the black-hole singularity. We show that the corresponding singularity is absent at finite $G_N$. This is done by extending Conformal Field Theory analyticity properties to the second sheet (and to the universal cover). We also put two different upper bounds on the amplitude of the correlator at the would-be singularity, by certain finite partial sums, and by a certain partition function on a manifold with nontrivial topology, where two thermal geometries are glued. We discuss the possible implications for the black hole singularity.", "url": "https://arxiv.org/abs/2609.31309", "type": "理论", "summary": "1. 该工作考察有限牛顿常数 G_N 下热两点函数中与黑洞奇点轨迹相关的复时奇点的命运，表明引力近似给出的该奇点在有限 G_N 时消失。\n2. 技术上，作者将共形场论的解析性推广到第二黎曼面及万有覆盖，并给出振幅在疑似奇点处的两个上界：有限部分和与由两个热几何粘合而成的非平凡拓扑流形上的配分函数。\n3. 这提示黑洞奇点可能并非有限 G_N 理论的基本特征，而更像引力近似在复时解析结构中的伪影，并为后续厘清量子引力中奇点与热场论解析性的关系提供方向。", "summary_source": "deepseek", "authors": [{"name": "Zohar Komargodski"}], "featured_authors": [{"name": "Zohar Komargodski"}], "author_count": 1}, {"id": "2609.31438", "category": "hep-th", "title": "Saddling Timelike Liouville Theory", "abstract": "The two-sphere partition function of timelike Liouville theory admits two complementary semi-classical descriptions whose relation presents a non-perturbative puzzle. A direct path-integral expansion around the round two-sphere saddle reproduces the perturbative small-$\\beta$ expansion, with $\\beta$ the Liouville coupling, of the analytically continued Dorn-Otto-Zamolodchikov-Zamolodchikov (DOZZ) formula, while the latter contains an additional oscillatory factor suggestive of a second saddle contribution. We investigate the origin of this factor in the Liouville zero-mode sector using Picard-Lefschetz theory. Taking as input the Hankel-type contour motivated by the inverse-Gamma representation of the zero-mode integral, we determine its Lefschetz-thimble decomposition depending on $\\beta$. For $0<\\beta<1$, it precisely reproduces the saddle structure encoded in the analytically continued DOZZ result. We identify the integration contour as the source of the difference between the zero-mode saddle descriptions. As $\\beta$ approaches $1$, the zero-mode saddle moves to the boundary of field space, while for $\\beta>1$ the same contour is represented by a single contributing thimble. We further relate this Stokes reorganisation to recent probabilistic constructions of timelike Liouville theory.", "url": "https://arxiv.org/abs/2609.31438", "type": "理论", "summary": "1. 该工作利用Picard-Lefschetz理论研究类时Liouville理论二球面配分函数的零模扇区，考察解析延拓DOZZ公式中额外振荡因子的起源。\n2. 以逆Gamma表示启发的Hankel型围道为输入，所得Lefschetz thimble分解在0<β<1时精确复现解析延拓DOZZ的鞍点结构，并确认围道是零模描述差异之源。\n3. β→1时零模鞍点移至场空间边界，β>1时同一围道仅由单一thimble贡献；该Stokes重排联系近期类时Liouville概率构造，暗示围道选择对非微扰定义至关重要。", "summary_source": "deepseek", "authors": [{"name": "Emilie Despontin"}], "featured_authors": [{"name": "Emilie Despontin"}], "author_count": 1}, {"id": "2609.31504", "category": "hep-th", "title": "Bound States in 2d Yukawa Theory from Hamiltonian Truncation", "abstract": "We study the spectrum of two-dimensional Yukawa theory using Hamiltonian truncation, with a focus on bound states. We extend the framework of Hamiltonian truncation effective theory to include fermions and logarithmic UV divergences. With these corrections, the energy levels converge as a function of the cutoff with the scaling predicted by power counting. We identify a strategy to follow the evolution of fermion-antifermion bound states from weak to strong coupling, and investigate its binding energy, finding good agreement with finite-volume perturbation theory at weak coupling. Finally, we explore the heavy-scalar regime toward the massive Thirring/Sine-Gordon limit, recovering the expected weak-coupling behavior and outlining how the calculation can be extended toward this limit.", "url": "https://arxiv.org/abs/2609.31504", "type": "理论", "summary": "1. 我们使用哈密顿截断研究二维汤川理论的谱，重点关注束缚态。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Olivier Delouche"}, {"name": "Kara Farnsworth"}, {"name": "Francesco Riva"}], "featured_authors": [{"name": "Olivier Delouche"}, {"name": "Kara Farnsworth"}, {"name": "Francesco Riva"}], "author_count": 3}, {"id": "2609.31576", "category": "hep-th", "title": "Bootstrapping Holographic Theories in the Planar Limit", "abstract": "We combine the numerical conformal bootstrap with supersymmetric localization to constrain the spectrum of holographic superconformal field theories in the planar large $N$ limit for finite 't Hooft coupling $\\lambda$. We consider the stress tensor multiplet four-point function in $\\mathcal{N}=4$ $SU(N)$ super-Yang-Mills (SYM), which is holographically dual to closed string scattering, as well as the flavor multiplet correlator in a certain \\( 4d \\) $\\mathcal{N}=2$ $U\\!Sp(2N)$ gauge theory with $SO(8)$ flavor symmetry, which is dual to open string scattering. In both cases, we combine dispersive sum rules with integrated constraints from supersymmetric localization to compute an upper bound on the scaling dimension of the lowest scalar single-trace operator for all $\\lambda$. For $\\mathcal{N}=4$ SYM, we find that our bounds are close to the known integrability result for all $\\lambda$. For the $\\mathcal{N}=2$ theory, where integrability is not yet available, we find that our bounds are close to weak and strong coupling predictions in the relevant regimes.", "url": "https://arxiv.org/abs/2609.31576", "type": "理论", "summary": "1. 该工作将数值共形自举与超对称局域化结合，在平面大N极限和有限't Hooft耦合λ下约束全息超共形场论谱，并分别处理N=4 SU(N) SYM的应力张量多重态四点函数与带SO(8)味对称性的4d N=2 USp(2N)规范理论味多重态关联函数。\n2. 其技术卖点在于把色散求和规则与来自超对称局域化的积分约束联用，对闭弦与开弦散射对偶情形统一给出最低标量单迹算子标度维数的上界，且适用于任意有限λ。\n3. 所得上界在N=4 SYM中与已知可积性结果接近，在尚无可积性的N=2理论中则与弱、强耦合预言相符，表明该混合自举方法可用于检验全息对偶并预测有限耦合谱。", "summary_source": "deepseek", "authors": [{"name": "Shai M. Chester"}, {"name": "Daniele R. Pavarini"}, {"name": "Alessandro Piazza"}], "featured_authors": [{"name": "Shai M. Chester"}, {"name": "Daniele R. Pavarini"}, {"name": "Alessandro Piazza"}], "author_count": 3}, {"id": "2609.30529", "category": "math-ph", "title": "The importance of the change-of-variables integration technique in deriving the PDFs of important probability distributions", "abstract": "The purpose of this article is to explicitly describe how the integration technique known as the change of variables is used in graduate-level Probability and Statistics courses. Throughout the article, we employ this integration technique seven times across various examples and results. We demonstrate that four applications of this technique are required to derive the probability density function (PDF) of the Student's t-distribution.", "url": "https://arxiv.org/abs/2609.30529", "type": "理论", "summary": "1. 该文聚焦变量替换积分技术在研究生概率与统计课程中的作用，通过多个例子与结果七次使用该技术，系统展示其推导重要概率分布概率密度函数的具体流程。\n2. 其关键卖点是明确指出推导学生t分布的概率密度函数需连续四次变量替换，并将这一通常被压缩的积分步骤完整呈现为可复现的教学与推导路径。\n3. 这为统计课程中概率密度函数推导提供了清晰范例，也可启发其他复杂分布、积分变换及教材编排中类似技巧的系统讲授。", "summary_source": "deepseek", "authors": [{"name": "Jorge P. Arpasi"}], "featured_authors": [{"name": "Jorge P. Arpasi"}], "author_count": 1}, {"id": "2609.30619", "category": "math-ph", "title": "The para--Krawtchouk oscillator and its continuum limit", "abstract": "The para--Krawtchouk polynomials define, through their recurrence relation, a finite oscillator model that carries out fractional revival. We determine the continuum limit of this Hamiltonian, both from its recurrence relation and directly on the polynomials. The limit is the singular (isotonic) oscillator $-\\partial_\\eta^2+\\eta^2+\\tfrac{\\gamma^2-1}{4\\eta^2}$: the deformation parameter $\\gamma$ survives as a central impurity of the couplings, decaying as the inverse square of the distance --- the marginal rate, which the continuum scaling turns into a finite $1/\\eta^2$ term. Using the decomposition of the para--Krawtchouk polynomials into two Hahn families, we prove the confluence, for every degree, of the eigenvectors on the two sublattices to generalized Hermite functions. The bispectral pair of the discrete model, which generates the Hahn algebra, becomes in the limit a pair of generators of $\\su$, the dynamical algebra of the singular oscillator.", "url": "https://arxiv.org/abs/2609.30619", "type": "理论", "summary": "1. 该工作确定 para--Krawtchouk 有限振子的连续极限，分别从递推关系与多项式直接入手。\n2. 极限为含中心 1/η² 杂质的奇异（isotonic）振子，变形参数 γ 以平方反比耦合留存并转为有限项。\n3. 借助两个 Hahn 族证明各阶本征矢收敛到广义 Hermite 函数，并使双谱对成为 su 动力学代数的一对生成元，连通离散与连续描述。", "summary_source": "deepseek", "authors": [{"name": "Stéphane Z. Beaulac"}, {"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Marlon Josue Rivera Valladares"}, {"name": "Luc Vinet"}], "featured_authors": [{"name": "Stéphane Z. Beaulac"}, {"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Marlon Josue Rivera Valladares"}, {"name": "Luc Vinet"}], "author_count": 6}, {"id": "2609.30624", "category": "math-ph", "title": "The para--Racah Hamiltonian as an exactly solvable discretization of the Pöschl--Teller box", "abstract": "The para--Racah Hamiltonian is the Jacobi matrix $J$ of the para--Racah polynomials, taken at the persymmetric value of their isospectral deformation parameter: a mirror--symmetric tridiagonal matrix whose spectrum is a \\emph{quadratic} bi--lattice, the squares $(s+a)^2$ and $(s+c)^2$ of two interlaced arithmetic progressions of unit step, and which carries out fractional revival when the grid parameters $a$ and $c$ satisfy a Diophantine condition. As the number of sites grows, $J$ contracts to the trigonometric \\emph{Pöschl--Teller} Hamiltonian on a finite interval. We establish this twice: on the recurrence relation, and on the polynomials themselves, for which it is the confluence Racah~$\\to$~Jacobi. Both grid parameters survive: $c-a$ becomes a scalar centrifugal term at the interior point fixed by the mirror --- the exact analogue of the para--Krawtchouk origin --- while $a+c-1$ sets two confining singular walls at the ends, which turn the spectrum into the quadratic pair $(t+a)^2,(t+c)^2$ with Jacobi eigenfunctions $P_t^{(a+c-1,\\,\\mp(c-a))}$, the two sublattices converging to two families that differ only by the sign of the second Jacobi parameter. The mirror symmetry of $J$ becomes the reflection about the midpoint; it grades the two families and carries the fractional revival to the limit. Algebraically, the bispectral pair of the discrete model, which generates the Racah algebra $\\mathfrak{r}_1$, becomes a pair of generators of the Jacobi algebra $\\mathfrak{j}_1$ --- one rung down the Askey--Wilson hierarchy --- the dynamical algebra of the Pöschl--Teller Hamiltonian.", "url": "https://arxiv.org/abs/2609.30624", "type": "理论", "summary": "1. 该工作围绕《The para--Racah Hamiltonian as an exactly solvable discretization of the Pöschl--Teller box》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Stéphane Z. Beaulac"}, {"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Marlon Josue Rivera Valladares"}, {"name": "Luc Vinet"}], "featured_authors": [{"name": "Stéphane Z. Beaulac"}, {"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Marlon Josue Rivera Valladares"}, {"name": "Luc Vinet"}], "author_count": 6}, {"id": "2609.30636", "category": "math-ph", "title": "The supersymmetric Scarf I Hamiltonian with reflections and its discrete para-Bannai--Ito version", "abstract": "The para-Bannai--Ito polynomials are orthogonal on a Bannai--Ito bi-lattice that is \\emph{two-sided} --- it extends on both sides of a central value $c_0$ --- and depend, besides the two grid parameters, on an isospectral deformation parameter. Their Jacobi matrix $J$ is invariant under the reversal of the sites at one value of that parameter only, the persymmetric point, and we determine its continuum limit there. Because the grid is two-sided, the natural object is the shifted operator $Q=J-c_0$, and the limit is taken about the centre of the band: $Q$ contracts to a first--order Dunkl operator, a supercharge, and $H=Q^2$ to the generalized Pöschl--Teller (Scarf I) Hamiltonian, with little $-1$ Jacobi eigenfunctions --- supersymmetric quantum mechanics with reflections, the reflection entering the square root of the Hamiltonian. The second grid parameter adds a reflection term to the Hamiltonian itself, and the bi-lattice is, up to a shift, the spectrum of the limiting supercharge. The convergence of the eigenvectors is proved directly on the polynomials. On this grid the persymmetric model transfers states perfectly, under an arithmetic condition on the parameters, but never revives fractionally, revival being the work of the deformation; both properties pass to the limit. These results are for an even number of sites; for an odd number of sites the limit is instead the matrix supersymmetric pair of Pöschl--Teller Hamiltonians, with the reflection in the Hamiltonian as a Dunkl potential. The bispectral pair of the discrete model goes over to the Dunkl realization of the anticommutator algebra of the little $-1$ Jacobi polynomials.", "url": "https://arxiv.org/abs/2609.30636", "type": "理论", "summary": "1. 本文研究双边 Bannai-Ito 双格上 para-Bannai-Ito 多项式的连续极限，导出带反射的超对称 Scarf I 哈密顿量及其离散对应。\n2. 其核心在于 persymmetric 点围绕带中心的极限将 Q=J-c0 收缩为一阶 Dunkl 超荷，H=Q^2 化为含反射的 Scarf I 哈密顿量；偶数格点给标量、奇数格点给矩阵超对称对。\n3. 这为离散双正交多项式与含反射超对称量子力学建立统一联系，并可用于分析完美态传输、Dunkl 反交换代数实现及后续连续极限研究。", "summary_source": "deepseek", "authors": [{"name": "Stéphane Z. Beaulac"}, {"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Marlon Josue Rivera Valladares"}, {"name": "Luc Vinet"}], "featured_authors": [{"name": "Stéphane Z. Beaulac"}, {"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Marlon Josue Rivera Valladares"}, {"name": "Luc Vinet"}], "author_count": 6}, {"id": "2609.30931", "category": "math-ph", "title": "Interpolating walk between discrete-time quantum walk and its intrinsic random walk on graph", "abstract": "We consider an interpolation with the parameter $p\\in [0,1]$ between the discrete-time quantum ($p=0$) and its intrinsic random ($p=1$) walks on a finite connected graph. Its time evolution is defined by the convex combination of the Kraus (CPTP) maps of the quantum and random walks. The Kraus map of the random walk is represented by taking a kind of projection of that of the quantum walk. The time evolution of the interpolation is interpreted as the combination of the following two dynamics of $2$ walkers on the same graph correlated with each other: $2$ walkers move independently of each other (no-correlation) with probability $1-p$, while $2$ walkers always move into the same position (the maximal correlation) with probability $p$ at each time step. In this paper, we generalize the random walk to a new walk, namely, the correlated walk, which preserves the intrinsic property and relaxes the maximal correlation of the random walk. This correlation is determined by a partition of the arc sets in the underlying graph. We show that the eigenvalues of the interpolating walk between the correlated and quantum walks live in $\\{ z\\in \\mathbb{C}\\;|\\;1-p\\leq |z|\\leq 1 \\}$ and that the absorption state coincides with that of the correlated walk, which is characterized by the underlying graph structures.", "url": "https://arxiv.org/abs/2609.30931", "type": "理论", "summary": "1. 该工作在图上的离散时间量子行走与其内禀随机行走之间引入参数 p∈[0,1] 的凸组合 Kraus/CPTP 映射插值，并把随机行走推广为由弧集划分定义的关联行走。\n2. 其核心卖点是把该插值诠释为同一图上两个行走者的关联动力学（以概率1-p独立、以概率p完全同位置），并通过弧集划分推广出保留内禀性、放宽最大关联的关联行走，证明插值行走的本征值位于{1-p≤|z|≤1}，且吸收态与关联行走一致并由底层图结构刻画。\n3. 这为连续调节量子与随机行走之间的量子-经典过渡、借助图结构设计关联与吸收行为提供了理论框架，并可能启发有限图上量子行走、开放系统与图划分相关问题的后续研究。", "summary_source": "deepseek", "authors": [{"name": "Yusuke Higuchi"}, {"name": "Etsuo Segawa"}, {"name": "Honoka Shiratori"}, {"name": "Saori Yoshino"}], "featured_authors": [{"name": "Yusuke Higuchi"}, {"name": "Etsuo Segawa"}, {"name": "Honoka Shiratori"}, {"name": "Saori Yoshino"}], "author_count": 4}, {"id": "2609.31072", "category": "math-ph", "title": "A Kinetic Theory Approach To Ordered Fluids: Direct Simulation Monte Carlo Methods", "abstract": "We present a direct simulation Monte Carlo (DSMC) method for the kinetic theory of ordered fluids recently introduced by the authors. The microscopic constituents of these fluids carry an order parameter belonging to a manifold. The method applies Strang splitting to couple a Monte Carlo treatment of the binary collisions with a symplectic integration of the mean-field Vlasov transport on the order-parameter manifold. We use the Nanbu-Babovsky approach for Maxwellian collision kernels, and Bird's acceptance-rejection method for general ones. The mean-field Vlasov force is reconstructed from the particle ensemble at each time step. We also include a Bhatnagar-Gross-Krook (BGK) / Andersen thermostat to control the system temperature. We formulate the method for a generic order-parameter manifold, and specialize it to two-dimensional calamitic (rod-like) molecules. Numerical tests validate the method. We confirm the relaxation to the Maxwellian distribution predicted by the H-theorem, and simulate the mean-field alignment driven by quadratic, Kuramoto, and Onsager interaction potentials. With the Onsager potential we successfully capture the isotropic-nematic phase transition at the correct critical temperature.", "url": "https://arxiv.org/abs/2609.31072", "type": "理论", "summary": "1. 该工作围绕《A Kinetic Theory Approach To Ordered Fluids: Direct Simulation Monte Carlo Methods》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "José A. Carrillo"}, {"name": "Patrick E. Farrell"}, {"name": "Andrea Medaglia"}, {"name": "Umberto Zerbinati"}], "featured_authors": [{"name": "José A. Carrillo"}, {"name": "Patrick E. Farrell"}, {"name": "Andrea Medaglia"}, {"name": "Umberto Zerbinati"}], "author_count": 4}, {"id": "2609.31125", "category": "math-ph", "title": "Unifying non-Markovian Dynamics and Agent Heterogeneity in Scalable Stochastic Networks", "abstract": "Stochastic processes underpin dynamics across biology, physics, epidemiology, and finance, yet accurately simulating them remains a major challenge. Classical approaches such as the Gillespie algorithm are exact for Markovian, time-independent systems, where propensities depend only on the current state and agents of a given type are statistically identical. While efficient, this framework misses a defining feature of many real systems: heterogeneity and memory at the level of individual agents. Cells may divide or differentiate on distinct intrinsic timescales, individuals may preferentially interact with specific partners, and inter-event-time distributions can deviate strongly from the exponential. We introduce MOSAIC (Modeling of Stochastic Agents with Individual Complexity), a general and scalable framework that embeds agent-specific properties directly into the dynamics. MOSAIC unifies heterogeneous rates, dynamic interaction preferences, and both Markovian and non-Markovian waiting-time distributions within a single stochastic formalism, while retaining Gillespie-like computational cost.", "url": "https://arxiv.org/abs/2609.31125", "type": "理论", "summary": "1. 该工作提出可扩展的MOSAIC框架，将个体异质性、动态交互与非马尔可夫等待时间嵌入随机网络动力学。\n2. 其卖点是在单一随机形式中统一异质速率、动态交互偏好及马尔可夫/非马尔可夫等待时间，并保持类似Gillespie的计算成本。\n3. 这为在生物、物理、流行病与金融等大规模随机网络中刻画个体复杂性提供了可扩展路径。", "summary_source": "deepseek", "authors": [{"name": "Aurelien Pelissier"}, {"name": "Miroslav Phan"}, {"name": "Didier Le Bail"}, {"name": "Niko Beerenwinkel"}, {"name": "Maria Rodriguez Martinez"}], "featured_authors": [{"name": "Aurelien Pelissier"}, {"name": "Miroslav Phan"}, {"name": "Didier Le Bail"}, {"name": "Niko Beerenwinkel"}, {"name": "Maria Rodriguez Martinez"}], "author_count": 5}, {"id": "2609.31189", "category": "math-ph", "title": "Differential Recursions, Projective Discriminants, and Algebraic Generating Functions", "abstract": "We study two hierarchies of bivariate generating functions defined by differential recursions: a self-dual hierarchy and a reduced-symmetry hierarchy. Their rational coefficient functions produce palindromic and anti-palindromic triangles, including OEIS A336110 and A140136. For general differential order $p$, the reduced hierarchy decomposes into $p-1$ Horn-type companions. An explicit differential intertwiner of order $p-3$ relates the last companion to the normalized self-dual generating function. The companions share a principal symbol and a rationally parametrized characteristic curve with a projective $S_3$ action. At $p=2$ this construction yields the Narayana quadratic. At $p=3$ the symmetry lifts to $S_4$: two algebraic sectors are edge resolvents of one quartic root configuration, and the nonsymmetric Gross--Witten--Wadia generating function has degree four. For $p=4$ and $p=5$ we derive algebraic equations of degrees six and eight, respectively, and find Galois groups $S_6$ and $S_8$ at generic specializations. At $p=6$ we verify a degree-ten specialization with Galois group $S_{10}$. Their discriminants exhibit a universal cubic characteristic factor and a squared lower-order factor. A boundary factorization explains the observed algebraic degrees and discriminant monomials. We formulate conjectures on algebraicity and Galois groups in the reduced hierarchy and identify a possible mechanism for transcendence in the higher self-dual hierarchy.", "url": "https://arxiv.org/abs/2609.31189", "type": "理论", "summary": "1. 该文研究由微分递推定义的自对偶与约化对称两类双变量生成函数层级，分析其回文与反回文系数三角形、Horn型伴随、代数方程与Galois群。\n2. 技术上，约化层级分解为p−1个Horn型伴随，由p−3阶微分缠绕子联系自对偶函数；边界因子分解与判别式普适三次因子解释了代数次数和判别式单项式。\n3. 该框架将p=2的Narayana二次式与p=3的S4对称、GWW四次生成函数纳入统一图景，并对约化层级代数性、Galois群及高自对偶层级超越机制提出猜想。", "summary_source": "deepseek", "authors": [{"name": "S. Voloshyn"}], "featured_authors": [{"name": "S. Voloshyn"}], "author_count": 1}, {"id": "2609.31365", "category": "math-ph", "title": "Categorical spin-networks: state-sum invariants of 4-manifolds from higher-gauge theory", "abstract": "In this work, we define $(3+1)$-dimensional topological quantum field theories (TQFTs) and their lattice realizations with input data given by a pivotal fusion 2-category; more precisely, our framework applies in wider generality to presemisimple locally fusion pivotal tensor $2$-categories, which are equipped with a so-called \\textit{shadow trace}. We introduce a decoration of triangulated manifolds by the input data, and develop a $20j$-symbol formalism for computing 4-simplex scattering amplitudes. We verify the topological invariance of 20$j$-symbol summations under the 4-dimensional Pachner moves. Furthermore, we also construct explicitly a 3-dimensional Levin-Wen-type lattice Hamiltonian model realizing the state-sum invariant. Our construction can be understood as a higher-dimensional analogue of the spin-networks construction for the Turaev-Viro invariant. Examples arising from $2$-groups are discussed from the perspective of higher gauge theory.", "url": "https://arxiv.org/abs/2609.31365", "type": "理论", "summary": "1. 该工作以pivotal融合2-范畴等为输入，定义(3+1)维TQFT及其三角剖分格点实现。\n2. 其卖点是建立20j符号计算4-单形散射振幅，验证4维Pachner移动不变性，并构造3维Levin-Wen型哈密顿量实现态求和。\n3. 该框架是Turaev-Viro自旋网络构造的高维推广，并为2-群等高阶规范理论提供可计算的态求和与格点模型。", "summary_source": "deepseek", "authors": [{"name": "Hank Chen"}, {"name": "Zhian Jia"}, {"name": "Ran Luo"}, {"name": "Wei Cui"}], "featured_authors": [{"name": "Hank Chen"}, {"name": "Zhian Jia"}, {"name": "Ran Luo"}, {"name": "Wei Cui"}], "author_count": 4}, {"id": "2609.31419", "category": "math-ph", "title": "Agmon estimates for the difference of exact and approximate Dirichlet eigenfunctions for difference operators", "abstract": "We analyze a general class of difference operators $H_\\varepsilon = T_\\varepsilon + V_\\varepsilon$ on $\\ell^2(\\varepsilon\\mathbb{Z}^d)$, where $V_\\varepsilon$ is a multi-well potential and $\\varepsilon$ is a small parameter. We construct approximate eigenfunctions in neighbourhoods of the different wells and give weighted $\\ell^2$-estimates for the difference of these and the exact eigenfunctions of the associated Dirichlet-operators.", "url": "https://arxiv.org/abs/2609.31419", "type": "理论", "summary": "1. 该工作针对格点差分算子 H_ε=T_ε+V_ε（V_ε 为多阱势），在各阱邻域构造近似本征函数，并对近似与精确 Dirichlet 本征函数之差给出加权 ℓ² 估计。\n2. 卖点是将 Agmon 型加权估计推广到一般差分算子，用权重精确刻画阱间隧穿导致的指数小误差量级。\n3. 该结果为多阱格点模型的隧穿分裂、谱渐近及近似本征函数的可靠性提供了严格的非连续框架工具。", "summary_source": "deepseek", "authors": [{"name": "Markus Klein"}, {"name": "Elke Rosenberger"}], "featured_authors": [{"name": "Markus Klein"}, {"name": "Elke Rosenberger"}], "author_count": 2}, {"id": "2609.31481", "category": "math-ph", "title": "Rotationally Symmetric Zoll Metrics with a Cubic Integral", "abstract": "We introduce a new method for constructing Zoll metrics that admit first integrals polynomial in the momenta. The method uses Funk's form of the metric together with an algebraic relation between the first integrals. This reduces the problem to an algebraic system from which all unknown functions can be determined explicitly. In the case of a non-trivial cubic integral, we present an explicit two-parameter family of metrics that covers all such rotationally symmetric Zoll metrics on the $2$-sphere: every such metric is isometric to a member of this family. We compare these metrics with the earlier results of Valent, Duval, and Shevchishin.", "url": "https://arxiv.org/abs/2609.31481", "type": "理论", "summary": "1. 该工作提出用Funk形式与首次积分间代数关系构造允许动量多项式首次积分的Zoll度量的新方法，并将问题约化为可显式求解的代数系统。\n2. 其核心卖点在于，对非平凡三次积分给出二维球面上所有旋转对称Zoll度量的显式两参数族，并证明每个此类度量均等距于该族成员，从而完成分类。\n3. 这为与Valent、Duval和Shevchishin早期结果的比较提供统一框架，并提示可用代数化方法研究更一般的Zoll度量或更高次首次积分。", "summary_source": "deepseek", "authors": [{"name": "Holger R. Dullin"}, {"name": "Vladimir S. Matveev"}, {"name": "Gleb P. Palshin"}, {"name": "Serena Scapucci"}], "featured_authors": [{"name": "Holger R. Dullin"}, {"name": "Vladimir S. Matveev"}, {"name": "Gleb P. Palshin"}, {"name": "Serena Scapucci"}], "author_count": 4}, {"id": "2609.30283", "category": "quant-ph", "title": "Restricting Trainable Lie-Algebra Growth in Equivariant Quantum Networks via Hierarchical Ancilla-Controlled Subspace Projections", "abstract": "Equivariant quantum networks encode symmetry as an inductive bias, which can improve generalization and may also favor optimization convergence. Equivariance alone, however, does not constrain the noncommuting closure of trainable generators, and this closure can still grow rapidly in symmetry-preserving variational circuits. We introduce a hierarchical ancilla-controlled architecture that addresses this Lie-algebra-growth mechanism. Commuting invariant-sector projectors on the data register select parameterized operations on a shared ancilla register, where the noncommuting trainable dynamics is confined. The trainable circuit decomposes into compatible joint sectors, giving a sector-probability-weighted ancilla response and an explicit view of parameter sharing across hierarchical paths. For an ancilla dimension $d_A=2^m$ and $K_\\ell$ retained layer-wise control modes, we prove the group-independent bound $\\dim(\\mathfrak g)\\le (d_A^2-1)\\prod_{\\ell=1}^{L}(K_\\ell+1)$. The bound is polynomial in the number of data qubits when $m$ and $K_\\ell$ remain constant along a logarithmic-depth hierarchy. Particle-number and parity projectors illustrate the general construction, while a fixed Clebsch--Gordan coupling tree supplies a concrete $SU(2)$ realization with rotation-invariant scalar outputs. Finite-size state-vector simulations exhibit slower gradient-variance decay and larger initialization gradients than generic and conventional rotationally equivariant circuits over the studied system sizes. The same realization fits sparse rotation-invariant classification tasks and geometry-dependent Heisenberg ground-state energies. These results support restricted trainable Lie-algebra growth as a structural strategy for initialization trainability in the regimes considered here.", "url": "https://arxiv.org/abs/2609.30283", "type": "理论+数值", "summary": "1. 该工作提出分层受控辅助比特架构，用数据寄存器上对易的不变子空间投影选择辅助比特上的参数化操作，以限制可训练李代数的增长。\n2. 其卖点是群无关上界 dim(g)≤(d_A^2−1)∏(K_ℓ+1)，m、K_ℓ 恒定时随数据比特数多项式增长，且 SU(2) 实现显示更慢梯度方差衰减与更大初始梯度。\n3. 这支持受限可训练李代数增长作为初始化可训练性的结构策略，并适用于稀疏旋转不变分类与几何相关海森堡基态能量任务。", "summary_source": "deepseek", "authors": [{"name": "Ting Li"}, {"name": "Zhiming Xiao"}, {"name": "Qibiao Tang"}], "featured_authors": [{"name": "Ting Li"}, {"name": "Zhiming Xiao"}, {"name": "Qibiao Tang"}], "author_count": 3}, {"id": "2609.30285", "category": "quant-ph", "title": "Non-abelian quantum cellular automata: $1{+}1$-dimensional $SU(2)$ Yang--Mills with fermions", "abstract": "This work provides a digital quantum simulation scheme for $1{+}1$-dimensional $SU(2)$ Yang--Mills theory with Dirac fermions. It takes the form of a quantum circuit, infinitely repeating across space and time with $\\Delta_t=\\Delta_x=\\varepsilon$, whose wires follow lightlike propagation. The construction mirrors the logic of the standard quantum field theory approach, transposed to the discrete setting. Namely, we start from the Dirac quantum walk, restore $SU(2)$ gauge symmetry by introducing the gauge field, lift the walk to a multi-particle QCA while preserving fermionic anticommutation, and equip the gauge field with its own dynamics. Rather than relying on Clebsch--Gordan decompositions, we use the pointwise-product structure of gauge-link updates, which yields self-contained proofs of unitarity and gauge covariance in quantum-computing notation. The construction provides an explicit algorithmic formulation of the theory, whose continuum limit we discuss.", "url": "https://arxiv.org/abs/2609.30285", "type": "理论+数值", "summary": "1. 该工作给出了(1+1)维含狄拉克费米子的SU(2)杨-米尔斯理论的数字量子模拟方案，以时空步长均为ε、导线沿光锥传播的无限重复量子电路实现。\n2. 其关键在于从狄拉克量子行走出发，引入规范场恢复SU(2)规范对称性，再提升为保持费米反交换的多粒子量子元胞自动机并赋予规范场动力学，且利用规范链更新的逐点乘积结构避免Clebsch-Gordan分解，从而以量子计算记号自洽证明幺正性与规范协变性。\n3. 该构造给出了该理论的显式算法表述，并讨论了连续极限，为在量子计算平台上离散化非阿贝尔规范理论及后续实验/理论研究提供了具体路径。", "summary_source": "deepseek", "authors": [{"name": "Dogukan Bakircioglu"}, {"name": "Pablo Arrighi"}], "featured_authors": [{"name": "Dogukan Bakircioglu"}, {"name": "Pablo Arrighi"}], "author_count": 2}, {"id": "2609.30377", "category": "quant-ph", "title": "A Mechanism for the Rényi Hierarchy of Decoherence-Induced Phase Transitions", "abstract": "Decoherence-induced phase transitions (DIPTs) are associated with singular changes in a quantum system's entanglement structure as the decoherence strength varies. In many cases, their critical strengths depend monotonically on the Rényi index of the entanglement diagnostic, forming a Rényi hierarchy. We identify a general mechanism for this hierarchy based on correlation inequalities in replicated statistical models that describe these DIPTs. We demonstrate it in $\\mathbb{Z}_2$ topological stabilizer codes subject to independent phase-flip decoherence on each qubit and in a decohered rotor model with strong $\\text{U}(1)$ symmetry. When the relevant correlations diagnose the DIPTs, these inequalities imply that the critical decoherence strength is nondecreasing with integer Rényi index $R\\geq2$. We show that this mechanism also applies to a class of models with correlated decoherence.", "url": "https://arxiv.org/abs/2609.30377", "type": "理论", "summary": "1. 该工作针对退相干诱导相变（DIPT）中临界退相干强度随纠缠诊断的Rényi指数单调变化所形成的Rényi层级，提出了一个基于复制统计模型关联不等式的一般机制。\n2. 通过在受独立相位翻转退相干的Z2拓扑稳定子码及强U(1)对称退相干转子模型中验证，作者表明当相应关联量可诊断DIPT时，这些不等式要求临界退相干强度随整数Rényi指数R≥2非递减，并推广到一类关联退相干模型。\n3. 该机制将DIPT临界性的Rényi依赖归因于复制模型中的普适关联约束，为理解退相干下量子纠缠转变及其实验观测提供了可检验判据。", "summary_source": "deepseek", "authors": [{"name": "Zhou Yang"}, {"name": "Yuri D. Lensky"}, {"name": "Chao-Ming Jian"}], "featured_authors": [{"name": "Zhou Yang"}, {"name": "Yuri D. Lensky"}, {"name": "Chao-Ming Jian"}], "author_count": 3}, {"id": "2609.30385", "category": "quant-ph", "title": "Colored Weingarten Calculus for Block-Unitary Ensemble", "abstract": "Haar randomness is the standard null model for quantum typicality, scrambling, and random-matrix formulations of thermalization. In many physical settings, however, randomness is naturally constrained to subspaces of Hilbert space. This structure arises, in particular, both in systems with symmetry-resolved sectors and in the Eigenstate Thermalization Hypothesis (ETH), where mesoscopic energy windows define subspaces in which nearby energy eigenstates are mixed. Motivated by these settings, we consider a Block-Unitary Ensemble consisting of independently Haar-random unitaries acting on each subspace. We develop a constructive Weingarten Calculus for this ensemble, providing a unified framework across quantum information and many-body physics. This construction reveals a symmetry-resolved Schur-Weyl duality, where the relevant commutant is not the ordinary permutation algebra, but the one of color-preserving permutations. We apply this framework to quantum states under symmetry constraints and to energy-resolved ensembles for ETH.", "url": "https://arxiv.org/abs/2609.30385", "type": "理论+数值", "summary": "1. 该工作针对各子空间独立 Haar 随机幺正构成的块幺正系综，构造出可计算的着色 Weingarten 演算，用以刻画受子空间约束的随机性及其矩。\n2. 其关键进展在于揭示对称分辨的 Schur-Weyl 对偶：相关对易子并非普通置换代数，而是保色置换代数，从而为对称扇区与 ETH 介观能量窗中的混合提供统一处理框架。\n3. 该框架适用于对称约束量子态和能量分辨系综，为有限对称扇区中的典型性、扰乱、热化及随机矩阵描述提供系统工具，并启发后续在受约束随机性下的量子信息与多体物理研究。", "summary_source": "deepseek", "authors": [{"name": "Daniele Iannotti"}, {"name": "Elisa Vallini"}], "featured_authors": [{"name": "Daniele Iannotti"}, {"name": "Elisa Vallini"}], "author_count": 2}, {"id": "2609.30399", "category": "quant-ph", "title": "Three-uniform edge-ordered hypergraph quantum states: entanglement and its relation to hypergraph properties", "abstract": "The encoding of 3-uniform edge-ordered weighted hypergraphs into multiqubit quantum states is proposed. We derive an analytical expression for the geometric measure of entanglement of hypergraph quantum states and establish its relation to hypergraph properties. The results establish a direct connection between the local structure of hypergraphs, hyperedge weights, and the entanglement of the corresponding quantum states. For equally weighted hypergraphs, it is shown that the entanglement depends explicitly on the vertex degree. The dependence of entanglement on hypergraph parameters is studied analytically and using quantum computing. Hypergraph states associated with chain, star, regular lattice, and binary-tree hypergraphs are examined, and their entanglement is quantified using quantum computing. These results open up the possibility of studying hypergraph properties with quantum programming.", "url": "https://arxiv.org/abs/2609.30399", "type": "理论", "summary": "1. 该工作提出将3-均匀边有序加权超图编码为多量子比特量子态，并推导其几何纠缠度量的解析表达式，建立其与超图性质的关系。\n2. 核心卖点在于把超图的局部结构、超边权重与对应量子态纠缠直接联系起来，并证明等权超图的纠缠显式依赖于顶点度，同时用解析和量子计算研究链、星、规则格和二叉树等超图态的纠缠。\n3. 这为利用量子编程研究超图性质提供了可行途径，并启发后续将超图参数与量子纠缠资源相互映射的理论与实验探索。", "summary_source": "deepseek", "authors": [{"name": "N. A. Susulovska"}, {"name": "Kh. P. Gnatenko"}], "featured_authors": [{"name": "N. A. Susulovska"}, {"name": "Kh. P. Gnatenko"}], "author_count": 2}, {"id": "2609.30490", "category": "quant-ph", "title": "Construction of Partial Join Graphs with Perfect State Transfer in Shunt Decomposition-Based Quantum Walks", "abstract": "In this paper, we define directed partial join graphs with signed couplings and construct discrete-time quantum-walk transition operators for these graphs using the shunt-decomposition framework. The resulting transition operators apply to several important graph families, including complete graphs with loops, circulant partial joins, complete bipartite graphs, tensor powers of complete bipartite graphs, all with signed couplings. For each family, we identify the corresponding structure of the transition operator and derive necessary and sufficient conditions for periodicity and perfect state transfer (PST), when one of the two directed regular graphs admits PST. Based on these results, we identify two types of state transfer; internal PST, which occurs between vertices within the same graph, and coupling PST, which occurs between two components of join graphs. We further develop a double-cover construction for directed partial join graphs and derive conditions for periodicity and PST when the associated transition operators do not necessarily commute. Using this construction, we establish PST results for double covers of complete graphs with loops. In particular, we provide an example in which the complete graph \\(K_n\\) does not exhibit PST for \\(n\\geq4\\), whereas a suitable partial join of \\(K_n\\) exhibits PST when \\(n=2^m\\), \\(m\\geq2\\). Hence, these results extend the class of graph families admitting PST in shunt-decomposition-based quantum walks and provide a unified framework for studying quantum state transfer in graph joins, products, and covers.", "url": "https://arxiv.org/abs/2609.30490", "type": "理论", "summary": "1. 该工作定义带符号耦合的有向部分连接图，并在分流分解框架下构造离散时间量子游走跃迁算符。\n2. 其核心是确定这些图族的跃迁算符结构，并在一个正则图具有PST时导出周期性与PST的充要条件，且区分内禀与耦合PST。\n3. 双覆盖构造给出带自环完全图双覆盖的PST；K_n在n≥4无PST而适当部分连接在n=2^m,m≥2时有PST，从而统一连接、积与覆盖中的态传输研究。", "summary_source": "deepseek", "authors": [{"name": "Banita Katuwal"}, {"name": "Y Lakshmi Naidu"}, {"name": "Srinath M S"}, {"name": "Supriyo Dutta"}], "featured_authors": [{"name": "Banita Katuwal"}, {"name": "Y Lakshmi Naidu"}, {"name": "Srinath M S"}, {"name": "Supriyo Dutta"}], "author_count": 4}, {"id": "2609.30581", "category": "quant-ph", "title": "Encryptability As a Coordinate Choice: Depth-One Homomorphic Federated Learning of Quantum Neural Networks", "abstract": "Encrypted training relies on keeping server-side updates low-degree. This constraint traditionally excludes models whose weights inhabit a compact Lie group (notably variational quantum circuits, where every trainable weight is an $\\mathrm{SU(2)}$ rotation). Expressed in Euler angles or discrete alphabets, these updates appear transcendental, historically demanding prohibitive costs: one client--server round per gate, or upwards of $25{,}000$ operations per weight. This penalty is strictly an artefact of coordinates. In the unit-quaternion (spin) chart, group composition is exactly bilinear (degree two, with coefficients in $\\{-1,0,+1\\}$). Consequently, encrypted rotation updates cost one multiplicative level and federated averaging costs zero in any levelled homomorphic scheme, completely eliminating bootstrapping. This implementation-independent algebraic property is confirmed across two cryptographic backends, introducing only $0.0$ and $-2.0\\times10^{-12}$ rad of aggregation error. Leveraging this reduction yields a non-interactive protocol for encrypted federated training of hybrid quantum--classical networks. It includes correctness proofs for aggregation and sign handling, plus a compilation lemma proving parameterised entanglers add only constant-factor overhead without altering the depth class. Empirically, a paired five-seed study confirms zero measurable utility tax ($\\Delta=+9\\times10^{-6}$ MSE, $p=0.92$), and a noise-budget ablation falsifies the hypothesis that encryption noise regularises. These convergence trends replicate across datasets and scale to $20$ clients. Finally, hardware validation on a $156$-qubit processor achieves $0.9918$ fidelity against a $0.99957$ unencrypted control.", "url": "https://arxiv.org/abs/2609.30581", "type": "理论+数值", "summary": "1. 该工作将量子神经网络权重的可加密性归结为坐标选择，提出用于混合量子-经典网络的深度一层同态加密联邦学习协议。\n2. 其核心卖点是用单位四元数旋量坐标使SU(2)群合成恰为双线性，令加密旋转更新仅需一级乘法、联邦平均零乘法深度并免除自举。\n3. 该协议在两种密码后端和156比特硬件上验证，零可测效用损失且加密噪声不提供正则化，为变分量子电路加密联邦训练提供可行路径。", "summary_source": "deepseek", "authors": [{"name": "Marcel Mordarski"}, {"name": "Nathan Mani"}, {"name": "Arshad Patel"}, {"name": "William Knottenbelt"}, {"name": "Roberto Bondesan"}], "featured_authors": [{"name": "Marcel Mordarski"}, {"name": "Nathan Mani"}, {"name": "Arshad Patel"}, {"name": "William Knottenbelt"}, {"name": "Roberto Bondesan"}], "author_count": 5}, {"id": "2609.30632", "category": "quant-ph", "title": "A Novel $q$-Derivative Framework with Applications to $q$-Deformed Thermodynamics and Leakage Suppression in Superconducting Qubits", "abstract": "We propose a new $q$-derivative operator built directly from Jackson's $q$-number formulation, designed to preserve the structural properties of standard differential calculus while incorporating deformation effects. By analyzing $q$-deformed Heisenberg algebras, we demonstrate that this formulation maintains the consistency of thermodynamic quantities-such as internal energy, particle number, and specific heat-in dilute gas limits without requiring ad-hoc chain-rule modifications. Furthermore, we explore the physical implications of algebraic deformation using the Biedenharn-Macfarlane realization, showing how $q$-deformation induces intrinsic anharmonicity in quantum oscillator spectra and affects multi-level quantum systems ($d \\ge 3$). Applying this algebraic scheme to superconducting transmon qubits, we derive analytical pulse-shaping corrections that generalize the Derivative Removal by Adiabatic Gate (DRAG) technique, offering a robust method to suppress computational leakage in ultra-fast quantum logic operations.", "url": "https://arxiv.org/abs/2609.30632", "type": "理论", "summary": "1. 该工作基于Jackson q数提出新q导数算符，并研究q变形Heisenberg代数、热力学一致性及transmon脉冲整形。\n2. 其卖点在于保留标准微分结构、无需额外链式规则，并揭示q形变非谐性及推广DRAG抑制泄漏。\n3. 这为q变形热力学、量子谐振子谱及超快超导量子逻辑的泄漏抑制提供了统一代数框架与实验启发。", "summary_source": "deepseek", "authors": [{"name": "André A. A. Marinho"}, {"name": "Gisele B. Freitas"}, {"name": "Clovis A. C. Filho"}], "featured_authors": [{"name": "André A. A. Marinho"}, {"name": "Gisele B. Freitas"}, {"name": "Clovis A. C. Filho"}], "author_count": 3}, {"id": "2609.30762", "category": "quant-ph", "title": "A Generalized Stein Lemma for Quantum Channels", "abstract": "We prove a generalized quantum Stein lemma for parallel discrimination of an arbitrary finite-dimensional channel against families of alternative channels. The alternatives are compact and convex, closed under tensor products, and contain a faithful replacer. At every fixed type-I error tolerance, the optimal type-II error exponent equals the regularized Umegaki channel relative entropy minimized over the alternatives, and both defining limits exist. Inputs may be entangled across channel uses and with a reference system. The main technical result constructs exactly trace-preserving approximations with exponentially small diamond error, dominated in completely positive order by free channels at every rate above the common exponent. The proof combines uniform auxiliary map approximation, iterative reduction of the domination rate, and tensor amplification. It yields asymptotic equipartition with trace-preserving smoothing at every subexponentially vanishing error, an exponential strong converse, and stability under vanishing diamond-norm perturbations. Under additional permutation invariance and closure under insertion of a fixed faithful input state and discarding of its output, we also prove an explicit finite-block completion bound. This quantitative construction uses weighted discarding, local operator corrections, and comparison with auxiliary extensions. Applications include state-preserving, coherence-restricted, covariant, entanglement-breaking, and positive-partial-transpose channels. For isometric targets against entanglement-breaking or positive-partial-transpose alternatives, we obtain exact finite-block testing and smoothing formulas.", "url": "https://arxiv.org/abs/2609.30762", "type": "理论", "summary": "1. 该工作证明面向有限维量子信道并行区分的广义量子Stein引理，备择信道族紧凸、张量积封闭且含忠实替换元。\n2. 其核心是在固定第一类错误容限下，最优第二类错误指数等于对备择族取最小后的正则化Umegaki信道相对熵（两个定义极限均存在），并构造指数小钻石误差的保迹近似，受自由信道完全正序支配。\n3. 该框架导出保迹平滑的渐近均分、指数强逆及钻石范数微扰稳定性；应用于态保持、相干限制、协变、纠缠破坏与PPT信道，并对等距目标相对纠缠破坏或PPT备择给出精确有限块检验与平滑公式。", "summary_source": "deepseek", "authors": [{"name": "Minbo Gao"}, {"name": "Zhengfeng Ji"}, {"name": "Chenghua Liu"}], "featured_authors": [{"name": "Minbo Gao"}, {"name": "Zhengfeng Ji"}, {"name": "Chenghua Liu"}], "author_count": 3}, {"id": "2609.30860", "category": "quant-ph", "title": "Classification of Generalised Triorthogonal Codes through Length 54", "abstract": "Magic state distillation is a widely considered primitive in fault-tolerant quantum computation for the preparation of high-fidelity non-Clifford resources. The most commonly considered class of such protocols are generalised triorthogonal codes; these distil $n$ noisy input $\\mathrm{T}$ states into purified third-level diagonal magic states. Extensive prior work has searched this space of protocols, often using heuristic methods that do not guarantee optimality. Existing classification work is limited to protocols distilling $k$ output $\\mathrm{T}$ states with $n+k\\leq 38$ (Nezami and Haah, Phys. Rev. A 106, 012437 (2022)). In this work, we significantly expand this classification to all protocols with lengths $n\\leq 54$. We restrict to distance $d\\geq 3$ to keep the classification to a sensible size, and because efficient searches are well understood at distance $2$ (Singh et al., arXiv:2606.28518 ). Moreover, our results are complementary to synthillation (Campbell and Howard, Phys. Rev. A 95, 022316 (2017)), which can distil third-level states from $\\mathrm{T}$ states, but only at distance $2$. Under optimality in terms of input count, space footprint, and distance for a given output, we find $74$ optimal generalised triorthogonal protocols in our range, $65$ of which are new to the literature. To achieve our classification, we extend the classification of unital triorthogonal spaces of Nezami and Haah from length $38$ to $54$ using a directional derivative method. Using these as the stabiliser spaces, we add logical rows that satisfy the triorthogonality constraints to create full protocols.", "url": "https://arxiv.org/abs/2609.30860", "type": "理论", "summary": "1. 该工作将广义三正交码协议分类扩展到长度不超过54，并限定距离不小于3。\n2. 其核心进展在于用方向导数法将单位三正交空间分类从38扩至54，并添加满足三正交约束的逻辑行构造完整协议，得到74个最优协议、65个新。\n3. 该分类为魔术态蒸馏提供更完整最优基准，并与仅限距离2的合成蒸馏互补，可启发后续协议搜索。", "summary_source": "deepseek", "authors": [{"name": "Adam Wills"}, {"name": "Shubham P. Jain"}, {"name": "Shraddha Singh"}], "featured_authors": [{"name": "Adam Wills"}, {"name": "Shubham P. Jain"}, {"name": "Shraddha Singh"}], "author_count": 3}, {"id": "2609.30910", "category": "quant-ph", "title": "Preparation Changes the Cost of Calibration for Quantum Control", "abstract": "Error-correction records can reveal noise yet supply the information needed for control too slowly. In a surface code under Gaussian dephasing, encoded calibration learns a correlation that reverses the preferred control mainly through rare events. A product probe exposes it more often through the same checks, reducing ideal-record sample complexity from inverse-square to inverse-linear in phase variance. Counting both calibration and execution costs, we show that this gain can repay probe overhead and enable protected tasks within budgets that exclude encoded calibration.", "url": "https://arxiv.org/abs/2609.30910", "type": "理论", "summary": "1. 该工作考察制备策略如何改变量子控制校准成本，并在高斯退相位表面码中比较编码校准与乘积探针方案。\n2. 其核心卖点是编码校准所学关联会反转优选控制且主要依赖稀有事件，而乘积探针借同一组校验更频繁暴露该关联，将理想记录样本复杂度对相位方差由平方反比降至线性反比。\n3. 计入校准与执行总成本后，探针开销可被收益抵消，从而在原本排除编码校准的预算内完成受保护任务，提示制备策略本身应纳入量子控制资源核算。", "summary_source": "deepseek", "authors": [{"name": "Xiu-Hao Deng"}], "featured_authors": [{"name": "Xiu-Hao Deng"}], "author_count": 1}, {"id": "2609.30942", "category": "quant-ph", "title": "Non-factor quantum dynamics and relativity", "abstract": "We consider the effect of relativistic principles on the structure of the local evolutions of non-factor quantum systems such as those which naturally arise in quantum spacetimes and causal structures. Generalising a former result that had been given for factor systems, we show that any evolution which can be applied locally on a direct sum of factor systems and without producing superluminal signals must be linear, unitary, and respect the block decomposition of the system.", "url": "https://arxiv.org/abs/2609.30942", "type": "理论", "summary": "1. 该工作将此前针对因子化量子系统的相对论性结论推广到非因子系统，并考察其局域演化在不产生超光速信号条件下所应服从的结构。\n2. 其核心卖点在于证明：任何能局域施加于因子系统直和之上且不传递超光速信号的演化，必为线性、幺正，并保持该直和的分块分解。\n3. 这为量子时空与因果结构中自然出现的非因子动力学提供了严格约束，也表明相对论原理可成为筛选局域量子演化的基本判据，并启发后续在更一般因果结构中的检验。", "summary_source": "deepseek", "authors": [{"name": "Octave Mestoudjian"}, {"name": "Matt Wilson"}], "featured_authors": [{"name": "Octave Mestoudjian"}, {"name": "Matt Wilson"}], "author_count": 2}, {"id": "2609.31066", "category": "quant-ph", "title": "Modeling quantum neural network gradient with reinforcement learning", "abstract": "Training quantum neural networks (QNNs) on near-term hardware remains hampered by two compounding difficulties: the exponential vanishing of gradient variance known as the barren plateau, and the $\\mathcal{O}(L \\cdot 2^n)$ time and memory cost of differentiating through an $n$-qubit, $L$-layer circuit. We propose RLQ-Grad, a reinforcement-learning-based optimizer in which a classical policy $\\pi_\\phi$ (a spectrally-normalized PPO agent) learns to propose parameter updates directly, conditioned on the QNN's current parameters, loss, accuracy, and previous update. Because the surrogate gradient is emitted by a classical network rather than obtained by differentiating through the unitary $U(\\theta)$, its variance is not constrained by the barren plateau concentration bound, and its cost scales with the number of trainable parameters rather than the Hilbert-space dimension. We prove these properties formally and verify them on a hardware-efficient ansatz across four supervised benchmarks with up to $n=20$ qubits. RLQ-Grad preserves a near-flat gradient-variance curve where backpropagation, parameter-shift, and adjoint differentiation decay by 1 to 2 orders of magnitude. Accounting for the full training pipeline (PPO rollouts, actor-critic updates, and optimizer states), RLQ-Grad needs under 2 MB of memory and runs $2490\\times$, $7876\\times$, and $673\\times$ faster per iteration than these three methods at $n=20$. It improves top-1 accuracy by up to $+10\\%$ over gradient-based baselines on circuits of up to 12 qubits, and matches dedicated barren plateau mitigation methods on CIFAR-10 at 14 to 20 qubits, where evolutionary and gradient-free optimizers collapse to chance.", "url": "https://arxiv.org/abs/2609.31066", "type": "理论+数值", "summary": "1. 提出RLQ-Grad，一种基于强化学习的QNN优化器，用谱归一化PPO经典策略根据当前参数、损失、准确率和上次更新直接生成参数更新。\n2. 其关键卖点是代理梯度由经典网络输出而非对幺正U(θ)求导，从而方差不受贫瘠高原集中界约束，代价随可训练参数数而非希尔伯特空间维度增长，并已形式化证明。\n3. 在四个监督基准与最多20量子比特硬件高效拟设上验证：梯度方差近乎恒定，完整训练内存<2 MB，每步较反向传播、参数移位和伴随法快2490×、7876×、673×，≤12量子比特Top-1提升至多10%，14–20量子比特CIFAR-10媲美专用缓解法。", "summary_source": "deepseek", "authors": [{"name": "Nhan Trong Luu"}, {"name": "Duong Trung Luu"}, {"name": "Nam Ngoc Pham"}, {"name": "Thang Cong Truong"}], "featured_authors": [{"name": "Nhan Trong Luu"}, {"name": "Duong Trung Luu"}, {"name": "Nam Ngoc Pham"}, {"name": "Thang Cong Truong"}], "author_count": 4}, {"id": "2609.31097", "category": "quant-ph", "title": "Supporting functionals and singular boundary geometry of two-qubit entanglement of formation", "abstract": "We give a criterion for the existence of a global supporting affine functional for the entanglement of formation at an entangled two-qubit state. It exists if and only if the spin-flip bilinear form is nondegenerate on the support of the state, or equivalently, if the last concurrence root associated with the support is nonzero. In this case the entanglement of formation is locally Lipschitz continuous. In the degenerate case the state has rank two or three, and its projective support is tangent to the product-state quadric. For suitable perturbations outside the support, the entanglement of formation decreases as the square root of the mixing parameter. The leading term is obtained explicitly. This square-root decrease violates the one-sided Lipschitz bound required for a global supporting affine functional.", "url": "https://arxiv.org/abs/2609.31097", "type": "理论", "summary": "1. 该工作给出两量子比特纠缠形成在纠缠态处存在全局支撑仿射泛函的判据，并分析退化支撑的边界几何。\n2. 存在性等价于支撑上自旋翻转双线性形式非退化或最后concurrence根非零，此时局部Lipschitz连续；退化态秩二或三且投影支撑切于乘积态二次曲面。\n3. 支撑外扰动使纠缠形成按混合参数平方根下降并显式给出首项，违反全局支撑泛函所需单侧Lipschitz界。", "summary_source": "deepseek", "authors": [{"name": "Wei Song"}, {"name": "Xiao-Lan Zong"}], "featured_authors": [{"name": "Wei Song"}, {"name": "Xiao-Lan Zong"}], "author_count": 2}, {"id": "2609.31209", "category": "quant-ph", "title": "Bypassing no-go theorems on mixed classical-quantum systems: the (counter)example of hybrid van Hove theory", "abstract": "Motivated by models of mixed quantum-classical hybrid theories, we consider the representation of classical observables as Hilbert-space operators based on van Hove's unitary representation of contact transformations. This leads to a reformulation of classical mechanics where the phase space density satisfies the Liouville equation and, more importantly, classical observables are represented by van Hove operators that satisfy a commutation algebra isomorphic to the classical Poisson algebra of functions in phase space. Thus, this Hilbert space approach captures all the essential features of the phase space formulation of classical mechanics in that it reproduces its algebraic structure -- something that is not achieved by other approaches such as the Koopman-von Neumann theory. As an important feature, the definition of appropriate physical states in this formalism imposes certain natural requirements on the phase of the classical wave function, which ensure correct expectation values for the observables. Furthermore, we discuss how to extend the approach to the hybrid van Hove theory of mixed classical-quantum systems and illustrate its application with the example of interacting classical and quantum oscillators. Finally, we focus on the question of how hybrid van Hove theory evades no-go theorems on mixed classical-quantum systems and point to the various
