<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-09-28 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

  <script>
    const papers = [{"id": "2609.30311", "category": "cond-mat", "title": "Synchronizing Spectral and Interference Criticalities at an Exceptional Point", "abstract": "Exceptional points (EPs) are spectral singularities, but whether they can be used to control a distinct criticality of coherent interference remains largely unexplored. Here we show in nonlocal superconducting transport how spectral and interference criticalities can be controllably synchronized. In a minimal superconducting double-quantum-dot system, loss imbalance selectively drives one Bogoliubov sector through an EP. The spectral EP and the CAR-ECT interference criticality form distinct structures in control space whose relative ordering can be continuously tuned. At their synchronization point, the interference boundaries between crossed Andreev reflection (CAR) and elastic cotunneling (ECT) coalesce at the EP and bifurcate beyond it, creating a finite CAR-dominated window. The resulting interference window opens with a square-root critical law, whose exponent also governs the finite-temperature observability scale. Detuning unfolds the two criticalities, while retuning restores their intersection, establishing the synchronization as controlled rather than generic. The bifurcation is directly observable in nonlocal conductance. Our results establish exceptional points as spectral control points for independently defined interference criticalities, opening a route to non-Hermitian control of critical quantum interference.", "url": "https://arxiv.org/abs/2609.30311", "type": "理论", "summary": "1. 该工作围绕《Synchronizing Spectral and Interference Criticalities at an Exceptional Point》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Zeng-Zhao Li"}, {"name": "Xiao Xue"}], "featured_authors": [{"name": "Zeng-Zhao Li"}, {"name": "Xiao Xue"}], "author_count": 2}, {"id": "2609.30346", "category": "cond-mat", "title": "What Becomes of the Antiferromagnetic String When Long Range Neel Order Is Lost? Exact Results", "abstract": "Early string descriptions of doped antiferromagnets associate hole motion in a locally Neel ordered background with a path-dependent antiferromagnetic string. We ask what becomes of this mechanism when long range Néel order is lost while short range antiferromagnetic correlations persist. The loss of long range order makes the projective RP^2 description admissible and opens a new topologically nontrivial sector. Its elementary defects are linearly stable half vortices, and a pair of half vortices with opposite windings is logarithmically confined, V(R) = \\k{appa} ln (R/r_{core}), \\k{appa} = {\\pi}\\r{ho}_s /2. The resulting confinement is carried not by a one dimensional string but by an extended two dimensional spin texture. Thus, the loss of long range Neel order does not eliminate antiferromagnetic confinement but opens a distinct projective mechanism in which a local path dependent string is replaced, at long wavelengths, by a global topological texture with logarithmic confinement.", "url": "https://arxiv.org/abs/2609.30346", "type": "理论", "summary": "1. 该工作考察长程奈尔序消失但短程反铁磁关联仍存时，掺杂反铁磁体中空穴运动的反铁磁弦命运，并在投影RP^2框架下给出严格结果。\n2. 其核心是长程序丧失使RP^2描述可行并打开拓扑非平庸扇区，基本缺陷为线性稳定半涡旋，相反绕数半涡旋对呈对数禁闭V(R)=κln(R/r_core)，κ=πρ_s/2，且禁闭由二维自旋织构而非一维弦承载。\n3. 这表明长程奈尔序消失并不消除反铁磁禁闭，而是将局域路径依赖弦在长波下替换为全局拓扑织构的对数禁闭机制，为短程关联反铁磁体中的空穴物理提供新图像。", "summary_source": "deepseek", "authors": [{"name": "Yuri DiMaggio"}], "featured_authors": [{"name": "Yuri DiMaggio"}], "author_count": 1}, {"id": "2609.30363", "category": "cond-mat", "title": "Disentangling the Toric Code", "abstract": "Commuting-projector Hamiltonians with integer spectrum such as the 1+1d Ising ferromagnet and the 2+1d toric code may be regarded as the generators of non-on-site $U(1)$ symmetries. In this paper we study whether these symmetries can be made on-site in the presence of finite and infinite-dimensional ancillae. In the finite-dimensional case, we prove that the fractionalized excitations, such as domain walls and anyons, make it impossible to on-site these Hamiltonians. On the other hand, we show that when infinite dimensional ancillae (e.g., rotors) are allowed, both the 1+1d Ising ferromagnet and the 2+1d toric code can be disentangled, yielding on-site symmetries. This is not in contradiction with the non-trivial ground state order of these Hamiltonians, since the ancilla Hamiltonians are no longer bounded from below. Our results indicate agreement between lattice and quantum field theory anomalies in the presence of infinite-dimensional ancillae, while with finite-dimensional ancillae the obstruction to on-siteability may even be non-invertible.", "url": "https://arxiv.org/abs/2609.30363", "type": "理论", "summary": "1. 该工作研究了整数谱对易投影算子哈密顿量（1+1维伊辛铁磁体与2+1维环面码）所生成的非在位U(1)对称性，在有限维与无限维辅助系统存在时能否被转化为在位对称性。\n2. 其核心证明是：有限维辅助系统下，畴壁与任意子等分数化激发使在位化不可能；而允许无限维辅助系统（如转子）时，两者均可解耦为在位对称性，且因辅助哈密顿量不再有下界，不与非平凡基态序矛盾。\n3. 这表明无限维辅助下格点与量子场论反常趋于一致，而有限维辅助下的在位化阻碍甚至可呈非可逆性，为对称性阻碍、反常与解耦关系提供了明确线索。", "summary_source": "deepseek", "authors": [{"name": "Lei Gioia"}, {"name": "Salvatore D. Pace"}, {"name": "Ruben Verresen"}, {"name": "Shu-Heng Shao"}, {"name": "Ryan Thorngren"}], "featured_authors": [{"name": "Lei Gioia"}, {"name": "Salvatore D. Pace"}, {"name": "Ruben Verresen"}, {"name": "Shu-Heng Shao"}, {"name": "Ryan Thorngren"}], "author_count": 5}, {"id": "2609.30372", "category": "cond-mat", "title": "Non-vanishing Density of States in Disordered Weyl Semimetals", "abstract": "There is disagreement in the literature concerning whether the nodal point of a three-dimensional Weyl semimetal survives weak short-range disorder: instanton calculations including fluctuations claim that the zero-energy density of states $\\rho(0)$ vanishes, while exact numerics find a systematically finite number. We settle this disagreement with a full saddle-point calculation, including both instanton and fluctuations. Within the supersymmetric formulation for disorder, the instanton obeys a nonlinear Weyl equation whose solution is an exact $j=1/2$ hedgehog whose full functional form we numerically compute. We then compute the fluctuations about this saddle point, carefully identifying all zero modes, and computing the reduced superdeterminant as a convergent Fredholm determinant. No fermionic zero mode beyond a Kramers doublet exists, and at finite disorder $w$, the fluctuations become a finite one-loop prefactor, $\\rho(0)=\\mathcal{A} w^{-4} \\exp(-s^*/w^2)(1+O(w^2))$, in normalized units with $s^* = 6.4163(2)$ and $\\mathcal{A} = 27.47(8)$ for Gaussian-correlated disorder. This expression matches exact numerics on a single Weyl cone over four orders of magnitude with no fitted parameters (the amplitude is $\\times 0.76$ the one-loop value), establishing that the density of states is finite for any disorder strength.", "url": "https://arxiv.org/abs/2609.30372", "type": "理论+数值", "summary": "1. 该工作通过包含瞬子与涨落的完整鞍点计算，解决了无序Weyl半金属零能态密度是否消失的争议。\n2. 其关键创新在于精确求解非线性Weyl方程的j=1/2刺猬瞬子，证明除Kramers二重态外无额外费米零模，涨落化为收敛Fredholm行列式。\n3. 所得有限一圈前因子与无拟合参数数值在四个数量级内吻合，表明任意无序强度下零能态密度均非零且有限。", "summary_source": "deepseek", "authors": [{"name": "Justin H. Wilson"}], "featured_authors": [{"name": "Justin H. Wilson"}], "author_count": 1}, {"id": "2609.30455", "category": "cond-mat", "title": "Critical escape dynamics of an active particle moving on curved surfaces", "abstract": "On the macroscopic scale, active (self-propelled) objects moving through complex environments are often subject to effects arising from both the curvature of the surrounding surface and external influences such as gravity. We study the Kramers escape problem for active Brownian particles in two settings: motion in an external potential driven solely by gradient forces, and motion on a curved manifold subject to an additional constant gravitational force. In the absence of translational noise, a sharp dynamical transition occurs when the self-propulsion velocity $v_0$ reaches a critical velocity $v_c$ required for an escape. Above this threshold, the escape rate $k$ follows a universal scaling form, $k \\propto \\exp\\left[-\\mathrm{const}(v_0-v_c)^{-\\gamma}\\right]$, with an exponent $\\gamma=3/2$ for the escape in a potential and $\\gamma=1/2$ for the escape on a curved manifold in the presence of gravity. These distinct exponents reveal how the interplay of activity, surface curvature, and gravity determines the critical escape dynamics. Our theoretical predictions are verified by numerical simulations.", "url": "https://arxiv.org/abs/2609.30455", "type": "理论+数值", "summary": "1. 该工作研究了活性布朗粒子在外势驱动及弯曲流形加恒定重力下的Kramers逃逸，并在无平动噪声条件下分析自驱动速度v0的影响。\n2. 其核心卖点是：无平动噪声时自驱动速度达到临界v_c会发生尖锐动力学转变，逃逸率呈普适标度，外势中γ=3/2而曲面重力中γ=1/2。\n3. 这些不同指数说明活性、表面曲率与重力共同调控临界逃逸动力学；理论预言经数值模拟验证，并可启发复杂环境中活性粒子逃逸与输运研究。", "summary_source": "deepseek", "authors": [{"name": "Maxim Root"}, {"name": "Hartmut Löwen"}, {"name": "Peter Sollich"}, {"name": "Lorenzo Caprini"}, {"name": "Alexander P. Antonov"}], "featured_authors": [{"name": "Maxim Root"}, {"name": "Hartmut Löwen"}, {"name": "Peter Sollich"}, {"name": "Lorenzo Caprini"}, {"name": "Alexander P. Antonov"}], "author_count": 5}, {"id": "2609.30458", "category": "cond-mat", "title": "Hydrogen-stabilized multimodal high-index twin network in iron", "abstract": "Hydrogen significantly affects plasticity in bcc iron, but its role is commonly attributed to dislocation-mediated mechanisms, leaving the influence of hydrogen on phase transformation and deformation twinning poorly understood. We use a density-functional-theory-trained deep-neural-network interatomic potential and large-scale molecular dynamics to study pure bcc Fe and Fe containing 10% hydrogen. It is found that hydrogen lowers the yield stress but, more importantly, increases the persistence of {112} twin variants and suppresses detwinning. This effect stabilizes an interconnected {332}-{10 9 3} multimodal twin network and produces pronounced post-yield hardening. Higher temperature promotes the initial transformation but weakens the persistence of the high-index multimodal twin network. Moreover, twinning follows distinct loading-dependent pathways: compression generates {332} and {10 9 3} boundaries through co-zone and non-co-zone twin-twin interactions, whereas tension produces {7 4 1} boundaries through non-co-zone interactions. These results establish a pathway-based picture in which the intermediate phase determines the accessible twin modes and variant crystallography, while hydrogen and temperature control their kinetic survival and the emergence of high-index twin networks.", "url": "https://arxiv.org/abs/2609.30458", "type": "理论+数值", "summary": "1. 该工作以DFT训练的深度神经网络势结合大规模分子动力学，模拟纯bcc Fe与含10%氢Fe中的孪生与相变。\n2. 其要点是氢虽降低屈服应力，却提升{112}孪生变体持久性、抑制退孪生，稳定{332}-{10 9 3}多模态孪晶网络并产生屈服后硬化。\n3. 这确立路径主导图像：中间相决定可及孪生模式与变体晶体学，而氢与温度控制其动力学存活及高指数孪晶网络的形成。", "summary_source": "deepseek", "authors": [{"name": "Mehrab Lotfpour"}, {"name": "Haoran Cui"}, {"name": "Yan Wang"}, {"name": "Eduardo Vitral"}, {"name": "Lei Cao"}], "featured_authors": [{"name": "Mehrab Lotfpour"}, {"name": "Haoran Cui"}, {"name": "Yan Wang"}, {"name": "Eduardo Vitral"}, {"name": "Lei Cao"}], "author_count": 5}, {"id": "2609.30520", "category": "cond-mat", "title": "Shear stress during self-assembly encodes stiffness of network-based materials", "abstract": "The mechanical properties of network-based materials have been extensively studied under qui- escent conditions, yet their self-assembly in nature occurs mainly in a mechanically stressed envi- ronment. Here, we show that the stiffness of collagen networks, one of the main building blocks of the mammalian extracellular matrix, can be tuned by applying shear stress during gelation, which first strains and aligns the material, then triggers a dramatic irreversible increase in the elastic modulus. This stiffening is anchored by maintaining the stress until the gel is fully matured. Using particle-based simulations, we show that the underlying microscopic mechanism is likely generic to a broad class of network-based systems and arises from two synergetic effects: changes in the network orientation and topology through the formation of permanent contacts that stabilize the system. Our findings are rationalized using a rigidity percolation framework and offer a general principle for encoding elasticity in biological and synthetic networks.", "url": "https://arxiv.org/abs/2609.30520", "type": "数值", "summary": "1. 该工作通过在胶原网络凝胶化过程中施加并维持剪切应力，调控其自组装路径，从而在材料成熟后获得显著且不可逆的弹性模量提升。\n2. 结合粒子模拟，作者指出该增强源于网络取向改变与拓扑重构的协同作用，即受力下形成永久接触以稳定结构，并可用刚度渗流框架统一解释。\n3. 这一结果提示，机械应力可作为自组装过程中的编码参量，为在生物与合成网络中按需写入弹性提供通用原理。", "summary_source": "deepseek", "authors": [{"name": "Lens M. Dedroog"}, {"name": "Olivier Deschaume"}, {"name": "Carmen Bartic"}, {"name": "Yovan de Coene"}, {"name": "Erin Koos"}, {"name": "Minne P. Lettinga"}, {"name": "Mehdi Bouzid"}], "featured_authors": [{"name": "Lens M. Dedroog"}, {"name": "Olivier Deschaume"}, {"name": "Carmen Bartic"}, {"name": "Erin Koos"}, {"name": "Minne P. Lettinga"}, {"name": "Mehdi Bouzid"}], "author_count": 7}, {"id": "2609.30596", "category": "cond-mat", "title": "Emergent Wigner magnon crystals in a fully frustrated Heisenberg four-leg tube", "abstract": "The ground state, magnetization curves, low-temperature thermodynamics, and heat-engine performance of the fully frustrated spin-$1/2$ Heisenberg four-leg tube with antiferromagnetic inter- and intra-plaquette coupling constants J1 and J2 are examined using exact diagonalization, density matrix renormalization group, and localized-magnon theory. In the unfrustrated to weakly frustrated regime J2/J1 << 2, the system exhibits a continuous field-driven quantum phase transition between the gapped Haldane phase and a gapless Tomonaga-Luttinger quantum spin liquid. In the highly frustrated regime J2/J1 > 2, the system contrarily displays discontinuous field-driven quantum phase transitions between the Wigner magnon crystals, which are manifested in zero-temperature magnetization curves as intermediate plateaus at zero, one-quarter, one-half, and three-quarters of the saturation magnetization. The low-temperature magnetic and thermodynamic properties in this regime are accurately captured by an effective interacting lattice-gas model of two monomer quasi-particle species constructed from localized one- and two-magnon states. Finally, we explore a quantum Stirling heat engine using the fully frustrated four-leg tube as the working medium. The work output and efficiency are strongly suppressed near discontinuous field-induced transitions and reach pronounced local maxima well inside the stability regions of the Wigner magnon crystals.", "url": "https://arxiv.org/abs/2609.30596", "type": "理论+数值", "summary": "1. 该工作围绕《Emergent Wigner magnon crystals in a fully frustrated Heisenberg four-leg tube》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Azam Zoshki"}, {"name": "Hamid Arian Zad"}, {"name": "Jozef Strecka"}], "featured_authors": [{"name": "Azam Zoshki"}, {"name": "Hamid Arian Zad"}, {"name": "Jozef Strecka"}], "author_count": 3}, {"id": "2609.30621", "category": "cond-mat", "title": "Assessing the Transferability of General-Purpose MachineLearning Interatomic Potentials for Heterogeneous Catalysis with HetCat26", "abstract": "Foundation machine learning interatomic potentials (MLIPs) promise near-density functional theory (DFT) accuracy across broad areas of chemistry and materials science. However, their performance in describing systems and processes relevant to heterogeneous catalysis remains underexplored. Here, we introduce HetCat26, a collection of benchmark tests designed to assess pre-trained MLIPs across key aspects of catalytic modeling, including surface energetics, metal-metal oxide interactions, adsorption, and catalytic reaction networks. Evaluating fifteen foundation models, we find that performance on existing general materials benchmarks is only weakly predictive of performance on HetCat26; transferability to heterogeneous catalysis cannot be inferred from these general benchmarks. Across the benchmark tests, current models describe surface energetics and, perhaps surprisingly, reaction barriers well, whereas larger errors are observed for adsorption, and DFT site preferences are often not reproduced. Two models, eSEN-30M-OAM and MACE-MH-1-OMAT, nevertheless achieve high accuracy across the properties evaluated. Beyond model benchmarking, HetCat26 highlights the importance of training data consistency: PBE and PBE+U calculations should not be mixed within a training set. Overall, we identify challenges limiting the transferability of current foundation MLIPs to heterogeneous catalysis and, more broadly, to chemical reactions at interfaces, providing guidance for the development of the next generation of foundation models.", "url": "https://arxiv.org/abs/2609.30621", "type": "理论+数值", "summary": "1. 该工作构建HetCat26基准，用于评估通用机器学习原子间势在多相催化中的可迁移性，涵盖表面能、金属-金属氧化物作用、吸附与反应网络。\n2. 评测十五个基础模型发现，通用材料基准表现对HetCat26预测性很弱；表面能与反应势垒描述较好，但吸附误差较大且DFT位点偏好常无法重现。\n3. eSEN-30M-OAM与MACE-MH-1-OMAT精度较高；训练集不应混用PBE与PBE+U，为下一代界面反应基础模型提供指引。", "summary_source": "deepseek", "authors": [{"name": "Alexandre Peuch"}, {"name": "Giaan Kler-Young"}, {"name": "Kaifeng Niu"}, {"name": "Jinwoo Hwang"}, {"name": "Manos Mavrikakis"}, {"name": "Angelos Michaelides"}, {"name": "Fabian Berger"}], "featured_authors": [{"name": "Alexandre Peuch"}, {"name": "Giaan Kler-Young"}, {"name": "Kaifeng Niu"}, {"name": "Manos Mavrikakis"}, {"name": "Angelos Michaelides"}, {"name": "Fabian Berger"}], "author_count": 7}, {"id": "2609.30737", "category": "cond-mat", "title": "Strain-controlled topology and quantum control at a cubic Ce$^{3+}$ crystal-field crossing", "abstract": "Field-tuned crystal-field crossings provide a route to synthetic topology in localized rare-earth degrees of freedom when symmetry-resolved perturbations can independently control the crossing states. Here we show that a field-induced crossing in cubic Ce$^{3+}$ has precisely this structure. For $B\\parallel[001]$, the crossing is protected by a twofold rotation, while the $T_{2g}$ shears $\\epsilon_{xz}$ and $\\epsilon_{yz}$ break that protection and mix the two states through orthogonal pseudospin components. Together with magnetic-field detuning, these controls generate an isolated diabolical point with unit-magnitude Chern charge in a three-dimensional parameter space. Using the CeTe crystal-field scale gives an ideal single-ion crossing near $35.5$ T. A calibrated point-charge calculation gives a representative projected shear coupling $|\\alpha_{T_{2g}}|\\simeq18.1$ meV per unit tensor strain, corresponding to gaps of $0.036$ and $0.072$ meV for tensor shears of $0.10\\%$ and $0.20\\%$. We identify the associated elastic and magnetic signatures, discuss the limitations of the electrostatic estimate in a hybridizing Ce compound, and determine the adiabatic and coherence requirements for cyclic geometric control. The result is a symmetry-based framework that connects high-field crystal-field reconstruction, strain response, and parameter-space topology in rare-earth systems.", "url": "https://arxiv.org/abs/2609.30737", "type": "理论+数值", "summary": "1. 该工作研究立方Ce3+中磁场诱导的晶体场交叉，并分析T2g剪切与场失谐对交叉态赝自旋混合的调控。\n2. 其卖点是二重旋转保护交叉被εxz/εyz剪切与场失谐破坏，生成单位Chern荷孤立点，CeTe下近35.5 T、剪切耦合约18.1 meV。\n3. 这为稀土体系连接高场晶体场重构、应变响应与参数空间拓扑提供对称性框架，并提示静电估计局限及循环几何控制的绝热与相干要求。", "summary_source": "deepseek", "authors": [{"name": "A. Ghosh"}, {"name": "J.T. Haraldsen"}], "featured_authors": [{"name": "A. Ghosh"}, {"name": "J.T. Haraldsen"}], "author_count": 2}, {"id": "2609.30776", "category": "cond-mat", "title": "A hydrogen-informed Rice-Beltz model for crack-tip dislocation emission under mixed-mode loading", "abstract": "The fundamental competition between crack-tip cleavage and dislocation emission dictates the ductile-to-brittle transition in crystalline solids. In hydrogen-charged environments, this delicate balance is disrupted, yet existing models often struggle to self-consistently capture the atomic-scale thermomechanical modulation of the emission barrier. Here, we propose the hydrogen-informed Rice-Beltz framework to quantify the critical stress intensity factors (SIFs) required for initial dislocation nucleation under mixed-mode (I+II) loading. By integrating the elastic interaction of the dilatational field of interstitial hydrogen and the applied stress fields against the incipient dislocation core, the model recovers the non-monotonic relation between the most probable SIF and the hydrogen concentration. Unlike the classical pure mode-I (or mode-II) scenario, the minimization of the local strain energy density is employed to generate closed-form nominal driving forces, which are subsequently embedded into a transition-state-theory framework. This atomistically-informed approach yields the most probable SIF for the first dislocation emission event as a function of the loading rate, slip angle, and hydrogen concentration, providing a rigorous, parameter-free boundary condition for the onset of hydrogen-modulated crack-tip plasticity.", "url": "https://arxiv.org/abs/2609.30776", "type": "理论", "summary": "1. 裂纹尖端解理和位错发射之间的根本竞争决定了结晶固体中的延性到脆性的转变。\n2. 这种基于原子的方法产生了第一次位错发射事件最可能的 SIF，作为加载速率、滑移角和氢浓度的函数，为氢调制裂纹尖端塑性的开始提供了严格的、无参数的边界条件。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Kai Zhao"}], "featured_authors": [{"name": "Kai Zhao"}], "author_count": 1}, {"id": "2609.30791", "category": "cond-mat", "title": "Topological Superconducting Phases in a Strained Altermagnet-Superconductor Heterostructure", "abstract": "We investigate topological superconductivity in a heterostructure consisting of a two-dimensional $s$-wave superconductor and a $d$-wave altermagnet with Rashba spin-orbit coupling. In particular, we study the effects of strain and hopping anisotropy on the topological superconducting phases. By calculating the Chern number, we obtain topological phase diagrams as functions of the chemical potential and the strength of the effective magnetic field induced by the magnetic proximity effect. We find that strain-induced lattice distortion allows topological superconducting phases to emerge over a broad parameter region. Our findings suggest that strain that lowers symmetry can serve as a route to realizing topological superconductivity in altermagnet-superconductor heterostructures.", "url": "https://arxiv.org/abs/2609.30791", "type": "理论+数值", "summary": "1. 该工作研究了二维s波超导体与带拉什巴自旋轨道耦合的d波交替磁体异质结中的拓扑超导相。\n2. 其关键在于计算陈数并给出化学势与磁邻近效应诱导有效磁场下的相图，发现应变诱导晶格畸变使拓扑超导相在更宽参数区出现。\n3. 这暗示降低对称性的应变可作为在交替磁体-超导体异质结中实现拓扑超导的一条途径。", "summary_source": "deepseek", "authors": [{"name": "Keita Yoshizawa"}, {"name": "Ryo Okugawa"}, {"name": "Takami Tohyama"}], "featured_authors": [{"name": "Keita Yoshizawa"}, {"name": "Ryo Okugawa"}, {"name": "Takami Tohyama"}], "author_count": 3}, {"id": "2609.30807", "category": "cond-mat", "title": "Front-based construction of quantum droplets, bubbles, and hole states in a Bose mixture", "abstract": "We study nonlinear holes, bubbles, kink fronts, and quantum-droplet-like states in an elongated Bose mixture governed by an extended Gross-Pitaevskii equation with attractive cubic mean-field interactions and repulsive quartic Lee-Huang-Yang contribution. We classify the constant-amplitude backgrounds: the Bogoliubov-de Gennes spectrum shows that the upper branch is modulationally stable, whereas the lower branch is unstable to long-wavelength perturbations. Grand-potential and pressure determine the vacuum-finite-density coexistence point and the unique background supporting stationary kink and antikink fronts. Symmetric holes on the stable background have a density deficit and integral width that diverge near coexistence as the hole separates into two nonlinear fronts. A multiplicative kink-antikink construction connects bell-shaped states to broad flat-top droplets and approaches the stationary quantum-droplet family as the front separation increases. An antikink-kink sum with equal signs generates bubble-like density depletions without a phase jump, whereas their difference produces dark-hole-like profiles with a $\\pi$ phase difference between the asymptotic backgrounds. Bubble depth increases with front separation, distinguishing gray-like and dark-like profiles. Real-time simulations show that deep bubbles persist under weak random perturbations, demonstrating finite-time robustness without establishing spectral stability. In the asymmetric two-component model, localized relative-density modes can induce spinor-driven breakup on a modulationally stable background, while robust holes persist near the kink limit. Collisions of kink-antikink droplet-like states display phase-dependent merging, asymmetric particle transfer, and effective reflection. These results connect nonlinear fronts with bubbles, phase-jump holes, and self-bound droplets in beyond-mean-field Bose mixtures.", "url": "https://arxiv.org/abs/2609.30807", "type": "理论+数值", "summary": "1. 该工作用含吸引立方项与排斥LHY四阶项的扩展Gross-Pitaevskii方程，研究长条形Bose混合体中的非线性空穴、气泡、扭结前沿与量子液滴态。\n2. 其构造性卖点在于以扭结-反扭结的乘加组合统一给出钟形与平顶液滴、无相位跃变气泡和π相位差暗空穴，并由BdG谱区分稳定背景。\n3. 实时模拟显示深气泡在弱随机扰动下有限时间内保持，但未确立谱稳定性，这为超平均场Bose混合体中连接非线性前沿与自束缚液滴提供启示。", "summary_source": "deepseek", "authors": [{"name": "Sherzod R. Otajonov"}, {"name": "Fatkhulla Kh. Abdullaev"}], "featured_authors": [{"name": "Sherzod R. Otajonov"}, {"name": "Fatkhulla Kh. Abdullaev"}], "author_count": 2}, {"id": "2609.30810", "category": "cond-mat", "title": "The conductance filtration: sink-relative persistence and exact edge sensitivity for heat transport in particle-filled composites", "abstract": "We formulate the thermal conductance $g_e$ of a particle pair as three branch types -- contact, near-contact and bond -- within a single construction, and we introduce the filtration that takes this $g_e$ as its axis (the conductance filtration) together with persistence taken relative to the sink boundary. We then show that the dissipation share is exactly the logarithmic sensitivity of the effective conductance, and that a finite change of a single edge is predicted exactly in closed form. The allocation of the dissipation among branch types, and the idealisation ratio of each mechanism (interface, matrix and particle), are thereby obtained as diagnostic quantities on one and the same graph representation.", "url": "https://arxiv.org/abs/2609.30810", "type": "理论", "summary": "1. 该工作将颗粒对间的热导统一构造为接触、近接触与键三类分支，并引入以热导为轴的过滤及相对汇边界的持续量。\n2. 其核心卖点是证明耗散份额恰为有效热导的对数灵敏度，且单条边的有限变化可由闭式精确预测。\n3. 由此可在同一图表示上诊断分支耗散分配与界面、基体、颗粒机制的理想化比，为颗粒填充复合材料热输运建模与机制识别提供启发。", "summary_source": "deepseek", "authors": [{"name": "Daisuke Yasufuku"}], "featured_authors": [{"name": "Daisuke Yasufuku"}], "author_count": 1}, {"id": "2609.30916", "category": "cond-mat", "title": "Emergence of Nanoscale Modulation in Liquid Crystals as a Result of Short-Range Order Parameter Condensation", "abstract": "The discovery of the twist-bend nematic phase in liquid crystals composed of bent-core and dimeric molecules has revealed an unexpected mechanism for the spontaneous formation of nanoscale periodic structures in soft condensed matter. Unlike conventional liquid-crystalline phases, the twist-bend phase exhibits a nanoscale heliconical modulation despite the absence of molecular chirality. In this note, dedicated to the late R. Meyer, we discuss a Landau phenomenological interpretation of this phenomenon. The central idea is that a short-range orientational order parameter undergoes condensation, giving rise to a heliconical structure characterized by a finite wave vector. We emphasize that the conventional nematic order is already long-ranged, whereas the additional order parameter describes local orientational correlations hidden within the nematic state. The resulting phase transition bears a close analogy to the de Gennes theory of the nematic--smectic-A transition. Fluctuation effects are expected to drive the transition weakly first order. The theory also predicts a new Goldstone mode associated with the spontaneously broken continuous symmetry of the heliconical state", "url": "https://arxiv.org/abs/2609.30916", "type": "理论", "summary": "1. 该文用Landau唯象理论解释非手性弯曲分子液晶中扭转弯曲相纳米螺旋调制的出现。\n2. 其要点在于常规向列序已长程，而附加短程序参量描述隐藏的局域取向关联，产生有限波矢螺旋结构。\n3. 该机制类比de Gennes向列-近晶A转变，涨落使转变弱一级，并预言螺旋态连续对称破缺产生新Goldstone模。", "summary_source": "deepseek", "authors": [{"name": "E.I.Kats"}], "featured_authors": [{"name": "E.I.Kats"}], "author_count": 1}, {"id": "2609.31001", "category": "cond-mat", "title": "Multiorbital periodic Anderson model for CeRh2As2", "abstract": "CeRh2As2 is a heavy-fermion superconductor that exhibits distinct low- and high-field superconducting phases, widely interpreted as reflecting a field-induced change in the parity of the order parameter. However, the superconductivity develops in close proximity to magnetic order whose microscopic origin and nature remain unclear. Moreover, the low-lying crystal-electric-field-split doublets of the Ce 4f electrons appear to realize an unusual \"quasi-quartet\" structure. This has motivated proposals that quadrupolar degrees of freedom play an important role in the low-temperature physics. Here we develop a microscopic heavy-fermion description of CeRh2As2 that incorporates both the quasi-quartet structure and the nonsymmorphic symmetry. Within a multiorbital periodic Anderson model, we include the lowest-lying $\\Gamma_7$ and $\\Gamma_6$ doublets of the Ce 4f electrons, and allow for nonlocal hybridization with the conduction d electrons. Single occupancy of the 4f states is enforced within the rotationally invariant slave-boson formalism. Adopting a mean-field treatment, we first show that the effective low-energy Hamiltonian is accurately captured by a single-orbital tight-binding model, justifying the minimal descriptions widely employed in the literature. Allowing for a magnetic ground state, we find that our model displays metallic $\\mathbf{Q}=(\\pi,\\pi)$ antiferromagnetic order over a wide parameter regime. Ferromagnetic solutions also occur, but in a smaller region of parameter space and with greater sensitivity to carrier concentration and the form of the f-d hybridization. Quadrupolar moments appear only within magnetically ordered phases and are generally small, becoming substantial only when the $\\Gamma_7$ and $\\Gamma_6$ doublets are nearly degenerate. Our results provide a microscopic basis for understanding the itinerant heavy-fermion physics and ordered phases of CeRh2As2.", "url": "https://arxiv.org/abs/2609.31001", "type": "理论", "summary": "1. CeRh2As2 是一种重费米子超导体，具有明显的低场和高场超导相，广泛解释为反映了场引起的有序参数奇偶性的变化。\n2. 采用平均场处理，我们首先证明单轨道紧束缚模型可以准确捕获有效的低能哈密顿量，证明文献中广泛采用的最小描述是合理的。\n3. 4f 状态的单一占据是在旋转不变的从玻色子形式主义中强制执行的。", "summary_source": "local-fallback", "authors": [{"name": "Nico A. Hackner"}, {"name": "Changhee Lee"}, {"name": "P. M. R. Brydon"}], "featured_authors": [{"name": "Nico A. Hackner"}, {"name": "Changhee Lee"}, {"name": "P. M. R. Brydon"}], "author_count": 3}, {"id": "2609.31006", "category": "cond-mat", "title": "Electrically controlled spin-splitting and asymmetric tunnel magnetoresistance in anti-altermagnets", "abstract": "Anti-altermagnets (AAMs) are a recently identified class of layered magnetic materials where opposite spin-splitting in adjacent layers creates a globally spin-degenerate band structure, rendering conventional spectroscopic detection highly difficult. In this paper, we theoretically demonstrate an all-electrical method to manipulate and probe this hidden magnetic order using a dual-gated transport junction. By applying a perpendicular displacement field, we break the spatial inversion symmetry of the lattice, explicitly lifting the global spin degeneracy. We attach ferromagnetic (FM) leads on either side of the AAM. Using quantum transport calculations, we show that this gate-induced spin-splitting manifests as a strongly asymmetric tunnel magnetoresistance (TMR) as a function of the lead magnetization. We identify specific crystallographic orientations where the TMR retains its symmetry despite the fully split bands, a direct consequence of exact momentum-space compensation. We further reveal that Rashba spin-orbit coupling guarantees robust, highly directional transport asymmetries even in the absence of an explicit chemical potential mismatch between the layers. Our findings establish a clear, electrically tunable framework for exploiting AAMs in next-generation spintronic architectures.", "url": "https://arxiv.org/abs/2609.31006", "type": "理论+数值", "summary": "1. 该工作理论研究了双栅极输运结中反交错磁体（AAM）的隐藏磁序，利用垂直位移场打破空间反演对称性、解除全局自旋简并，并以铁磁电极探测其电控自旋劈裂。\n2. 其核心卖点是通过量子输运计算表明栅致自旋劈裂表现为随铁磁电极磁化方向变化的强不对称隧穿磁阻，并识别出因动量空间精确补偿而在完全劈裂能带下仍保持TMR对称性的特定晶向，且Rashba自旋轨道耦合可在无层间化学势失配时保障稳健的方向性输运不对称。\n3. 这为AAM作为电可调自旋电子学平台提供了可探测、可操控的机制，并启发后续实验利用栅压与晶向选择设计低功耗自旋阀或隧穿器件。", "summary_source": "deepseek", "authors": [{"name": "Abhiram Soori"}], "featured_authors": [{"name": "Abhiram Soori"}], "author_count": 1}, {"id": "2609.31015", "category": "cond-mat", "title": "Binary magnetism and directional magnon transport in alkali-doped CrI$_3$", "abstract": "The recent realization of two-dimensional (2D) magnets, with CrI$_3$ as a pioneering example, has opened new avenues in the fields of 2D materials and magnetism. This breakthrough has been followed by extensive efforts to manipulate and exploit their magnetic properties. In this work, we investigate the adsorption of alkali-metal atoms as a route to control the magnetic behavior of monolayer CrI$_3$. We show that, upon adsorption, alkali-metal atoms donate an electron to the CrI$_3$ layer, leading to the formation of inequivalent Cr sites, with one Cr atom exhibiting an enhanced magnetic moment of $4~\\mu_B$, while the other retains its typical $3~\\mu_B$ moment. These modifications significantly alter the magnetic exchange interactions, including the emergence of anisotropic exchange and Dzyaloshinskii--Moriya interactions (DMI). Consequently, the doped systems exhibit non-collinear magnetic ground states, modified temperature-dependent magnetism, and anisotropic spin-wave propagation, with a preferred propagation direction that becomes increasingly pronounced with increasing dopant size. Furthermore, an asymmetry between spin-wave propagation in opposite directions is observed, giving rise to a diode-like effect, particularly for heavier dopants. This behavior is attributed to the enhanced DMI, which breaks the symmetry of the magnon dispersion. These results demonstrate that alkali-metal doping provides an effective route to tune anisotropic and nonreciprocal magnonic properties in two-dimensional magnetic materials.", "url": "https://arxiv.org/abs/2609.31015", "type": "理论", "summary": "1. 该工作研究碱金属原子吸附对单层CrI3磁性的调控，发现吸附原子向CrI3转移电子并形成不等价Cr位点。\n2. 其机制在于电子掺杂使一个Cr磁矩增至4 μB、另一个保持3 μB，并增强各向异性交换与DMI，导致非共线磁基态及各向异性自旋波传播，且传播方向偏好随掺杂原子尺寸增大。\n3. 该效应源于DMI增强破坏磁振子色散对称性，产生相反方向传播不对称的类二极管行为，表明碱金属掺杂可调控二维磁体的各向异性和非互易磁子学性质。", "summary_source": "deepseek", "authors": [{"name": "Cihan Bacaksiz"}, {"name": "Maarten Soenen"}, {"name": "Denis Sabani"}, {"name": "Rai Maciel de Menezes"}, {"name": "Milorad V. Milosevic"}], "featured_authors": [{"name": "Cihan Bacaksiz"}, {"name": "Maarten Soenen"}, {"name": "Denis Sabani"}, {"name": "Rai Maciel de Menezes"}, {"name": "Milorad V. Milosevic"}], "author_count": 5}, {"id": "2609.31067", "category": "cond-mat", "title": "Synthetic Berry curvature in atom-cavity systems", "abstract": "In atom-cavity systems, mean field theory is widely used, in which the quantum cavity operator is replaced by a classical amplitude. Then the problem is converted into atoms moving in a self-consistent potential. The mean field treatment captures the physics of cavity mediated interactions, and predicts the self-organized superradiant phase. In this work, however, we show that it fails for certain atom-cavity coupling: it predicts zero ground state atomic current where the fully quantum calculation exhibits a finite one. We find that the origin of this failure is the non-zero Berry curvature in the synthetic dimension spanned by the photon Fock ladder and real space. In this synthetic picture, the atomic current can be understood as Hall response of cavity detuning, whereas mean field collapses this dimension and discards the atom--photon correlations required for its Hall response. The same beyond-mean-field geometry predicts Laughlin-like photon generation under adiabatic flux insertion. Our work identifies synthetic Berry curvature as a concrete mechanism for the breakdown of static mean field in atom--cavity physics.", "url": "https://arxiv.org/abs/2609.31067", "type": "理论+数值", "summary": "1. 该工作用全量子计算揭示原子-腔系统中静态平均场在特定耦合下失效：预言零基态原子电流，全量子却给出有限值。\n2. 核心机制是光子Fock阶梯与实空间合成维度中的非零Berry曲率，使原子电流成为腔失谐的Hall响应，平均场舍弃相关原子-光子关联。\n3. 同一几何在绝热磁通插入下预言Laughlin-like光子产生，表明合成Berry曲率是原子-腔物理中静态平均场失效的具体机制。", "summary_source": "deepseek", "authors": [{"name": "Zheng Tang"}, {"name": "Rui-Lin Zhang"}, {"name": "Xiaotian Nie"}, {"name": "Li Chen"}, {"name": "Wei Zheng"}], "featured_authors": [{"name": "Zheng Tang"}, {"name": "Rui-Lin Zhang"}, {"name": "Xiaotian Nie"}, {"name": "Li Chen"}, {"name": "Wei Zheng"}], "author_count": 5}, {"id": "2609.31085", "category": "cond-mat", "title": "2D target search with boundary-induced resetting", "abstract": "Most studies of stochastic search processes with resetting focus on spontaneous resetting events that occur at a random sequence of times typically generated by a Poisson process. One of the major consequences of spontaneous resetting is that it yields a finite mean first passage time (MFPT) in unbounded domains, resulting in an optimal resetting rate that minimises the MFPT. An optimal resetting rate can also occur in bounded domains provided that the reset point is not too far from the target. Recently, there has been growing interest in event-based rather than spontaneous resetting, where resetting is triggered when a specific threshold is reached. Identifying the threshold with a physical non-target boundary then leads to so-called boundary-induced resetting. In this paper, we explore the effects of boundary-induced resetting on single-particle diffusive search in a two-dimensional (2D) bounded domain $\\Omega$ containing one or more small interior targets. The interior target boundaries are totally absorbing, whereas the exterior boundary $\\partial \\Omega$ is sticky. That is, whenever the particle reaches a point on $\\partial \\Omega$ it remains attached for a random waiting time $\\tau$ after which it immediately resets to a fixed interior point $\\x_0\\in \\Omega$. Using renewal theory, matched asymptotic analysis and Green's functions we calculate the unconditional MFPT for absorption by any of the targets and compare this with the corresponding MFPT of a search process on the same domain with a reflecting surface $\\partial \\Omega$ and no resetting. We show that boundary-induced resetting only reduces the MFPT relative to the no resetting case if the searcher's reset point $\\x_0$ is sufficiently close to one of the targets.", "url": "https://arxiv.org/abs/2609.31085", "type": "理论", "summary": "1. 该工作研究二维有界域内含一个或多个小吸收目标时，单粒子扩散搜索在边界诱导重置下的行为：外边界为粘性，粒子到达后停留随机等待时间τ，随即重置到固定内点x₀。\n2. 其技术卖点在于结合更新理论、匹配渐近分析与格林函数，解析求得被任一目标吸收的无条件平均首次通过时间，并与同域内反射边界且无重置的情形定量比较。\n3. 结果表明仅当重置点与某一目标足够接近时，边界诱导重置才缩短平均首次通过时间，这为有界域搜索优化和基于事件的重置机制设计提供了明确判据。", "summary_source": "deepseek", "authors": [{"name": "Kevin Chen"}, {"name": "Paul C. Bressloff"}], "featured_authors": [{"name": "Kevin Chen"}, {"name": "Paul C. Bressloff"}], "author_count": 2}, {"id": "2609.31094", "category": "cond-mat", "title": "Thermodynamics of the $q$-deformed Kittel--Shore model for spin-1 particles", "abstract": "Quantum algebras ($q$-algebras) have been used in the literature to deform spin-chain models. In particular, in previous works by the present authors, the Kittel--Shore Hamiltonian was deformed using $\\mathfrak{su}_q(2)$ algebra. The deformed Hamiltonian was presented for a general spin, and the thermodynamic properties were studied for spin-1/2 particles. In this paper, we focus on the $q$-deformation of the Kittel--Shore model for spin-1 systems. We analyse the impact of this deformation on the thermodynamic properties and phase transitions of the system as a function of the deformation parameter $q$. Specifically, we study the specific heat, magnetic susceptibility, and magnetisation, including a detailed analysis of the Curie temperature characterising the ferromagnetic phase. Furthermore, a finite-size scaling analysis is conducted for both the ferromagnetic and antiferromagnetic cases. Results are systematically compared with those of the undeformed model to reveal the physical effects of the $q$-deformation.", "url": "https://arxiv.org/abs/2609.31094", "type": "理论+数值", "summary": "1. 该工作在前期su_q(2)形变Kittel-Shore模型及自旋1/2热力学研究基础上，将分析推广至自旋1体系，系统考察形变参数q对热力学性质和相变的影响。\n2. 除比热、磁化率与磁化强度外，还详细分析铁磁相居里温度，并对铁磁和反铁磁情形进行有限尺寸标度，从而揭示q形变相对于未形变模型的物理效应。\n3. 该工作为q形变量子自旋链在自旋1情形下的热力学与临界行为提供基准，并提示可进一步研究更高自旋、其他形变模型及有限尺寸效应。", "summary_source": "deepseek", "authors": [{"name": "V. Mariscal"}, {"name": "J. J. Relancio"}], "featured_authors": [{"name": "V. Mariscal"}, {"name": "J. J. Relancio"}], "author_count": 2}, {"id": "2609.31101", "category": "cond-mat", "title": "A Flatness-Generalization Relation in the Teacher-Student Tree-Committee Machine", "abstract": "The flatness of the loss landscape at a minimizer is a widely used heuristic for reasoning about neural-network generalization, yet evidence for this relation is mostly empirical and controversial. We study this relation in a teacher-student tree committee machine, where both the ERM estimator and the Hessian spectrum are analytically tractable in the proportional high-dimensional limit. First, we use a zero-temperature Gibbs formulation to obtain predictions for the observables of the typical minimizers of the empirical loss. Secondly, we use Edwards-Jones formalism to derive the limiting Hessian resolvent around these typical minimizers. All predictions agree with finite-size gradient-descent simulations. Finally, we study three measures of flatness, namely the left and right edges and the spectral mean, and check if a decrease in generalization error as the dataset size is increased corresponds to an increase in flatness. We find that the answer strongly depends on the learning task and on the ratio of the number of parameters to the number of data points. In regression, the spectral mean and right edge correlate with the generalization error, while the left edge does so only in the overparametrized regime. In classification this correlation reliably holds only in the highly overparametrized phase, while for underparametrized networks it can even reverse.", "url": "https://arxiv.org/abs/2609.31101", "type": "理论+数值", "summary": "1. 该工作在教师-学生树委员会机中，于比例高维极限下解析研究了经验风险最小化估计量的平坦性与泛化误差之间的关系。\n2. 其技术卖点在于结合零温吉布斯表述与Edwards-Jones形式，解析求得典型极小值处的Hessian预解式，并系统比较左边缘、右边缘和谱均值三种平坦度度量。\n3. 结果显示该关系强烈依赖学习任务及参数-数据比：回归中谱均值和右边缘与泛化误差相关，左边缘仅在过参数化区相关；分类中该相关性仅在高度过参数化时可靠，欠参数化时甚至反转。", "summary_source": "deepseek", "authors": [{"name": "Brandon Livio Annesi"}, {"name": "Davide Straziota"}, {"name": "Enrico Maria Malatesta"}], "featured_authors": [{"name": "Brandon Livio Annesi"}, {"name": "Davide Straziota"}, {"name": "Enrico Maria Malatesta"}], "author_count": 3}, {"id": "2609.31143", "category": "cond-mat", "title": "Shape enantiomerism in semi-rigid polymer liquid crystals", "abstract": "Weakly flexible, directed polymers can adopt a potentially infinite variety of conformations, some of them chiral. We develop a second-virial theory for semi-rigid polymers embedded in a nematic environment based on the assumption that the chains possess no intrinsic molecular chirality but can take on weakly helical conformations of either handedness. We demonstrate how these transient helical fluctuations can be exploited to predict the degree of chain stiffening induced by molecular crowding. The theoretical predictions are in good agreement with large-scale molecular dynamics simulations of bead-spring polymers with tunable backbone flexibility. Although both theory and simulations rule out spontaneous global chiral symmetry breaking imparted by chain conformations alone, they do reveal that polymers can develop pronounced enantiomeric shapes. Nematic fluids of semi-rigid polymers can be viewed as compensated cholesterics composed of transiently helical polymers with zero enantiomeric excess. By quantifying the degree of compensated chiral order developed over a broad range of concentrations and persistence lengths, two distinct regimes of weak and strong enantiomerism can be identified. A crossover between the two occurs when the chain persistence length drops below roughly three times the contour length.", "url": "https://arxiv.org/abs/2609.31143", "type": "理论+数值", "summary": "1. 该工作建立了嵌入向列环境半刚性聚合物的第二维里理论，并结合可调主链柔性的珠簧分子动力学模拟，考察无内禀分子手性链的瞬态螺旋构象如何影响形状对映异构。\n2. 其核心卖点在于用瞬态螺旋涨落定量预测分子拥挤诱导的链刚化，理论与模拟一致，并表明虽无全局手性对称破缺，聚合物仍可形成显著对映体形状，使半刚性向列相可视为零对映体过量的补偿胆甾相。\n3. 通过扫描浓度与持续长度，该框架识别弱、强对映异构两个区间，并在持续长度降至约三倍轮廓长度以下时发生跨接，为理解柔性链在液晶环境中的手性形状序及后续模拟/实验提供定量基准。", "summary_source": "deepseek", "authors": [{"name": "S. Biswas"}, {"name": "W. S. Fall"}, {"name": "H. H. Wensink"}], "featured_authors": [{"name": "S. Biswas"}, {"name": "W. S. Fall"}, {"name": "H. H. Wensink"}], "author_count": 3}, {"id": "2609.31153", "category": "cond-mat", "title": "Slow-fast dynamics of the McKean model with stochastic resetting and diffusion", "abstract": "In this paper we investigate the combined effects of stochastic resetting and diffusion on a slow--fast dynamical system given by the piecewise-linear McKean model. That is, the fast variable $v$ is subject to Gaussian white noise with effective diffusivity $D$ and is reset to a fixed value $v_r$ at a random sequence of times generated from a Poisson process with rate $r$. Assuming that resetting occurs on the fast timescale, we freeze the slow variable \\(w\\) under an adiabatic approximation and determine the resulting non-equilibrium stationary state (NESS) of the fast variable as the solution of a modified Fokker--Planck equation. We show that the NESS can be expressed in terms of parabolic cylinder functions, whose asymptotic behavior allows us to recover the corresponding NESS without diffusion in the small-diffusion limit. The NESS is used to derive an averaged equation for the slow dynamics, whose solution converges to a stable fixed point \\(w^*\\) that depends on \\(D\\), \\(r\\) and \\(v_r\\). This fixed point effectively determines the long-time behaviour of the full system. Finally, we analyze the regime in which resetting occurs on the same timescale as the slow variable. We show how the slow variable now undergoes noisy oscillations due to resetting-induced switching between branches of the fast nullcline and derive the corresponding NESS for $w$ in the non-diffusive case.", "url": "https://arxiv.org/abs/2609.31153", "type": "理论", "summary": "1. 该工作研究分段线性McKean慢快系统中随机重置与扩散的联合效应，并在绝热近似下求解快变量非平衡稳态和慢变量平均动力学。\n2. 其关键在于将修正Fokker-Planck方程的NESS表示为抛物柱函数，可在小扩散极限恢复无扩散结果，并得到依赖D、r、v_r的稳定固定点w*。\n3. 当重置与慢变量同时间尺度时，重置诱导分支切换使慢变量产生噪声振荡，这为理解慢快随机系统的非平衡长期行为提供了机制性启示。", "summary_source": "deepseek", "authors": [{"name": "Jude Swaby"}, {"name": "Paul C. Bressloff"}], "featured_authors": [{"name": "Jude Swaby"}, {"name": "Paul C. Bressloff"}], "author_count": 2}, {"id": "2609.31208", "category": "cond-mat", "title": "Electron paramagnetic resonance of Dy${^3+}$-doped CaWO$_4$: spin Hamiltonian, crystal-field analysis, and linear electric field effect", "abstract": "We report an electron paramagnetic resonance (EPR) study of Dy${^3+}$ in CaWO$_4$ single crystals spanning dopant concentrations from 80~ppb to 247~ppm. The $g$ factors of the ground Kramers doublet at the $S_4$ point-group site, $g_\\parallel = 7.22 \\pm 0.01$ and $g_\\perp = 5.45 \\pm 0.01$, and the hyperfine constants of \\ce{^{161}Dy} and $^{163}$Dy are determined with an order-of-magnitude improvement in precision over the only previous report. A crystal-field analysis constrained jointly by published optical levels and by the measured $g$ tensor identifies the ground doublet as the lower branch of an anticrossing between the near-degenerate $\\|{\\pm}11/2>$ and $\\|{\\mp}13/2>$ states, and explains why optical data alone left the $g$ values unconstrained. \\add{The same parameter set, tested on the excited multiplets of the $^6H$ term, reproduces the ${}^6H_{13/2}$ crystal-field levels better than the optical parameters themselves.} The angular dependence of the linewidth in the $ab$ plane reveals broadening by random internal electric fields through the linear electric field effect. Calibrating these fields with the residual Er$^{3+}$ present in the same crystals yields the first electric-field coupling parameters of Dy$^3+$, $(B_{31}^2+B_{36}^2)^{1/2} = (34\\pm5)\\times10^{-6}$~cm/V, three times the Er$^{3+}$ value and the largest reported for a rare-earth ion in this this http URL residual linewidth and the concentration-dependent lineshape asymmetry follow the quadratic field scaling expected for a second-order Stark shift, which escapes the inversion-site cancellation constraining the linear effect. Both couplings trace back to the $\\sim 20$~cm$^{-1}$ gap to the first opposite-symmetry doublet, a consequence of the dense crystal-field structure of the $J=15/2$ manifold.", "url": "https://arxiv.org/abs/2609.31208", "type": "理论", "summary": "1. 该工作对80 ppb–247 ppm掺Dy3+的CaWO4单晶做电子顺磁共振，精确测定基态g因子与161/163Dy超精细常数。\n2. 其卖点是以光学能级与g张量联合分析指认|±11/2>与|∓13/2>反交叉下支，并借残余Er3+首次标定Dy3+线性电场耦合。\n3. 残余线宽与浓度依赖线型不对称符合二阶Stark位移的二次场标度，耦合源于约20 cm^-1的相反对称双重态能隙，为稀土晶体场研究提供启示。", "summary_source": "deepseek", "authors": [{"name": "Achuthan Manoj Kumar"}, {"name": "Larissa Aboudem-Joumessi"}, {"name": "Remy Dassonneville"}, {"name": "Adrien Savoyant"}, {"name": "Karolina Waszowska"}, {"name": "Pengrui Jiao"}, {"name": "Patrice Bertet"}, {"name": "Philippe Goldner"}, {"name": "Sylvain Bertaina"}], "featured_authors": [{"name": "Achuthan Manoj Kumar"}, {"name": "Larissa Aboudem-Joumessi"}, {"name": "Remy Dassonneville"}, {"name": "Patrice Bertet"}, {"name": "Philippe Goldner"}, {"name": "Sylvain Bertaina"}], "author_count": 9}, {"id": "2609.31213", "category": "cond-mat", "title": "The Paper-Stack Trampoline: Acoustic Restitution in Layered Media", "abstract": "A ball bouncing on a thicker cushion should bounce less. We show that this is not always so . Measuring the coefficient of restitution $e$ of a steel ball dropped on a stack of $N$ sheets of standard A4 printer paper, we find that $e$ first drops, then rises to a pronounced maximum, and only then decreases towards a minimum. The maximum occurs where the acoustic round trip through the stack matches the contact time of the impact. For a contact set by the stack itself, one recovers the classical bar-impact condition of a stack-to-ball mass ratio of order one. Bar impact, however, predicts only a weak recovery, insensitive to the surrounding gas. For paper stacks, the recovery is large and no maximum is resolved when the stack is evacuated: the air trapped between the sheets, not the paper alone, makes the stack a trampoline.", "url": "https://arxiv.org/abs/2609.31213", "type": "数值", "summary": "1. 该工作测量钢球落到N张A4纸堆上的恢复系数，以研究层状介质的声学回弹。\n2. 其卖点是恢复系数非单调，峰值对应堆叠声学往返时间与接触时间匹配，且抽真空后峰值消失，表明层间空气是主因。\n3. 该结果修正更厚缓冲反弹更弱之直觉，并提示经典杆碰撞需计入层间气体，对分层介质冲击与声学耗散有启示。", "summary_source": "deepseek", "authors": [{"name": "Manou Liesker"}, {"name": "Colton Kawamura"}, {"name": "Maria Kieft"}, {"name": "Joshua A. Dijksman"}, {"name": "Antoine Deblais"}], "featured_authors": [{"name": "Manou Liesker"}, {"name": "Colton Kawamura"}, {"name": "Maria Kieft"}, {"name": "Joshua A. Dijksman"}, {"name": "Antoine Deblais"}], "author_count": 5}, {"id": "2609.31240", "category": "cond-mat", "title": "First-principles calculations of the thermodynamic factor of multicomponent alloys", "abstract": "Computing non-dilute diffusion coefficients from Onsager transport coefficients of a multicomponent alloy requires the thermodynamic factor, which measures the curvature of the free energy with respect to composition. As diffusion in metals is mediated by vacancies, the curvature that matters is not that of the vacancy-free alloy, which is straightforward to compute, but that of an alloy carrying a dilute concentration of vacancies. The resulting matrix is nearly singular, and composition fluctuations from which it is obtained converge slowly in Monte Carlo simulations. Here we develop two routes that avoid sampling vacancy composition fluctuations. The first constructs the thermodynamic factor from two quantities, the free-energy curvature of the vacancy-free alloy and the vacancy concentration. The second truncates the semi-grand canonical partition function at a single vacancy and recovers the full thermodynamic factor of the vacancy-containing alloy. The same separation shows that the largest eigenvalue of the diffusion matrix is the vacancy tracer diffusion coefficient for any number of components and any degree of non-ideality, while the remaining eigenvalues scale with the vacancy concentration. Across binary through quinary alloys of the Hf--Mo--Nb--Ti--Zr system, both routes reproduce eigenvalues and eigenvectors of diffusion matrices obtained from fully converged Monte Carlo simulations. The single-vacancy expansion reaches this accuracy with roughly one tenth of the sampling effort. A scaling relation extends both routes to local vacancy chemical potentials away from equilibrium, without additional simulations. These results allow thermodynamic descriptions from atomistic models or CALPHAD assessments to be used directly in mesoscale simulations of mass transport.", "url": "https://arxiv.org/abs/2609.31240", "type": "理论+数值", "summary": "1. 根据多组分合金的 Onsager 输运系数计算非稀释扩散系数需要热力学因子，该因子测量自由能相对于成分的曲率。\n2. 相同的分离表明，扩散矩阵的最大特征值是任意数量的组件和任意程度的非理想性的空位示踪剂扩散系数，而其余特征值随空位浓度成比例。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Damien K. J. Lee"}, {"name": "Shashank Saxena"}, {"name": "Anton Van der Ven"}, {"name": "Anirudh Raju Natarajan"}], "featured_authors": [{"name": "Damien K. J. Lee"}, {"name": "Shashank Saxena"}, {"name": "Anton Van der Ven"}, {"name": "Anirudh Raju Natarajan"}], "author_count": 4}, {"id": "2609.31268", "category": "cond-mat", "title": "Vibrational Mpemba relaxation in a linear damped elastic system", "abstract": "We show that a linear damped elastic system can display a Mpemba-like reversal of vibrational relaxation without any nonlinear constitutive response or amplitude-dependent damping. The mechanism is purely modal. For a one-dimensional Kelvin--Voigt elastic medium, the decay rate of the $n$-th vibrational mode scales as $\\gamma_n\\propto n^2$. We formulate relaxation in terms of a positive modal envelope energy, thereby excluding crossings caused merely by oscillation phase. A one-parameter family of initial states is then constructed such that increasing the initial elastic excitation simultaneously reduces the projection onto the slow fundamental mode. In the invariant two-mode subspace, the relaxation-order crossing is obtained analytically and, for this family, occurs at a universal dimensionless time independent of the selected pair of initial states. In the limiting case where the slowest mode is absent, the dominant relaxation rate changes discontinuously, yielding a direct vibrational analogue of the strong Mpemba effect. We further show that the same relaxation-order reversal occurs in the ordinary mechanical vibrational energy, which decreases monotonically despite retaining the oscillatory dynamics of the underlying modes.", "url": "https://arxiv.org/abs/2609.31268", "type": "理论", "summary": "1. 该工作证明一维Kelvin-Voigt线性阻尼弹性介质无需非线性本构或振幅依赖阻尼即可发生Mpemba式振动弛豫反转，并构造使初始弹性激发增大时慢基模投影减小的单参数初始态族。\n2. 其核心是引入正定模态包络能量以排除振荡相位导致的假交叉，利用第n阶模衰减率γ_n∝n^2的模态层级，在两模不变子空间解析得到与所选初始态对无关的普适无量纲交叉时间；慢模缺失时主导衰减率不连续变化，构成强Mpemba效应的直接振动类比。\n3. 这揭示此类反转可完全源于线性模态谱与初始模态投影，并出现在单调衰减的普通机械振动能量中，为线性弹性与声学系统中的异常弛豫提供可检验线索。", "summary_source": "deepseek", "authors": [{"name": "Kiwamu Yoshii"}, {"name": "Satoshi Takasa"}], "featured_authors": [{"name": "Kiwamu Yoshii"}, {"name": "Satoshi Takasa"}], "author_count": 2}, {"id": "2609.31270", "category": "cond-mat", "title": "Multiscale computational study of the dielectric response of semi-crystalline polyethylene with chemical defects", "abstract": "Polymers are widely used as functional insulating materials, but predicting their dielectric behavior is challenging because multiple mechanisms, acting across different spatial and temporal scales, contribute to their response. In polyethylene (PE), one of the most common polymers, electronic, atomic, and mesoscale dynamics must all be considered. In this work, semicrystalline models of polyethylene were developed and investigated using a multiscale approach. Quantum simulations were employed to describe electronic and vibrational contributions to the dielectric response, while classical molecular dynamics simulations captured the behavior of polymer chains at room temperature and frequencies down to the 10-100 MHz range. The study focuses on the impact of radio-oxidation defects on the dielectric properties of polyethylene. Quantum calculations reveal how electronic and vibrational contributions depend on the local atomic environment surrounding these defects. Comparison with molecular dynamics results highlights the influence of temperature on the static dielectric constant. Structural analyses further assess the effect of each defect type on PE crystallinity. Analysis of dipolar correlation functions shows that different defects interact with one another and with the polymer matrix in distinct ways, affecting permittivity and dielectric loss peaks. For all defect types, defect-defect interactions provide the largest contribution to dielectric response. While most oxidized groups exhibit positive coupling with the PE matrix, alcohol defects display a negative cross-correlation, partially offsetting their impact on the dielectric properties. Our results also show that ketone groups produce the largest dielectric loss between the defects studied.", "url": "https://arxiv.org/abs/2609.31270", "type": "理论+数值", "summary": "1. 该工作构建半结晶聚乙烯多尺度模型，结合量子计算电子/振动介电贡献与经典分子动力学（室温、低至10–100 MHz）模拟，系统考察辐照氧化缺陷对介电响应的影响。\n2. 其核心在于以偶极相关函数解析缺陷与基体及彼此的耦合，揭示缺陷间相互作用主导介电响应，并区分不同氧化基团对介电常数、损耗峰及温度依赖的影响，其中酮基损耗最大、醇基呈负交叉相关。\n3. 该框架将电子/振动、原子链动力学与介观结构及化学缺陷关联，为预测绝缘聚合物在氧化老化下的介电常数与损耗峰提供可检验的多尺度路径。", "summary_source": "deepseek", "authors": [{"name": "Roshal Perepadan Shaju"}, {"name": "Guido Roma"}, {"name": "Xavier Colin"}], "featured_authors": [{"name": "Roshal Perepadan Shaju"}, {"name": "Guido Roma"}, {"name": "Xavier Colin"}], "author_count": 3}, {"id": "2609.31277", "category": "cond-mat", "title": "High-throughput computational discovery of CuI-based ternary $p$-type transparent conductors", "abstract": "P-type transparent conducting materials (TCMs) remain scarce, limiting progress in transparent electronics and tandem photovoltaics. Here, we perform a high-throughput computational search across CuI-based ternary X--Cu--I compounds using the minima hopping method combined with density functional theory. Filtering for thermodynamic stability, optical transparency, and light hole effective mass, we identify 58 candidate p-type TCMs, of which 49 are previously unreported. Twenty are p-type degenerate semiconductors with intrinsic hole carriers, including Cu$_2$FI$_2$ (calculated gap 3.75 eV, hole effective mass $0.262\\,m_0$). We further use this dataset to revisit the chemical modulation of the valence band (CMVB) design rules, originally formulated for Cu-based delafossite oxides. Four generalizations emerge: linear Cu coordination is not required, as tetrahedral coordination (CN = 4) is compatible with p-type TCM character; the mechanism extends to halide-based systems with I $5p$ anion states; the Cu $d$ state energy center $\\epsilon_d$ is a quantitative descriptor for valence band dispersion; and Cu undercoordination in monovalent-anion hosts drives intrinsic p-type carrier generation through stoichiometric charge balance. These results establish a generalized computational framework for the design of p-type halide TCMs.", "url": "https://arxiv.org/abs/2609.31277", "type": "理论+数值", "summary": "1. P型透明导电材料（TCM）仍然稀缺，限制了透明电子和串联光伏发电的进展。\n2. 出现了四个概括：不需要线性 Cu 配位，因为四面体配位（CN = 4）与 p 型中医特征兼容；该机制扩展到具有 I $5p$ 阴离子态的卤化物系统；。\n3. Cu $d$ 态能量中心 $\\epsilon_d$ 是价带色散的定量描述符；单价阴离子主体中的 Cu 和 Cu 配位不足通过化学计量电荷平衡驱动内在 p 型载流子的产生。", "summary_source": "local-fallback", "authors": [{"name": "Michael Seifert"}, {"name": "Miguel A. L. Marques"}, {"name": "Silvana Botti"}], "featured_authors": [{"name": "Michael Seifert"}, {"name": "Miguel A. L. Marques"}, {"name": "Silvana Botti"}], "author_count": 3}, {"id": "2609.31319", "category": "cond-mat", "title": "Criticality enabled long-range order in a U(1)-symmetric spin-1 Heisenberg chain with biquadratic interactions", "abstract": "In a recent paper Nahum argued on the basis of a renormalization-group analysis that, contrary to standard lore, ground states of 1D spin chains with short-range interactions can spontaneously break U(1) ``easy-plane'' spin rotation symmetry. True long-range order of $(S^x,S^y)$ arises at the phase transition between two quasi-long-range-ordered phases. Here we present detailed numerical results for an anisotropic spin-1 chain model. We find a magnetization exponent $\\beta\\approx0.29$, consistent with the $\\epsilon$-expansion prediction $\\beta\\approx0.28$, a divergence of the Luttinger parameter on approaching the transition from both sides with an exponent that we relate to Nahum's transition, and finite-size spectra consistent with a dynamical critical exponent $z\\approx2$. Our results support the critical behavior predicted by Nahum's field theory.", "url": "https://arxiv.org/abs/2609.31319", "type": "理论+数值", "summary": "1. 该工作对各向异性、含双二次相互作用的自旋-1海森堡链进行数值研究，检验临界性诱导的U(1)面内长程有序。\n2. 其核心卖点在于测得磁化指数β≈0.29、Luttinger参数从两侧发散，并给出动力学临界指数z≈2，均与Nahum的ε展开及场论预言相符。\n3. 该结果支持Nahum场论预言的临界行为，表明一维短程自旋链可在两个准长程序相的相变处出现真正的U(1)面内长程序。", "summary_source": "deepseek", "authors": [{"name": "Natalia Chepiga"}, {"name": "Fabian H.L. Essler"}], "featured_authors": [{"name": "Natalia Chepiga"}, {"name": "Fabian H.L. Essler"}], "author_count": 2}, {"id": "2609.31375", "category": "cond-mat", "title": "Polar discontinuity screening by charge disproportionation in ferroelectric-nickelate superlattices", "abstract": "We use density functional theory (DFT) to demonstrate rearrangement of charge disproportionation as a new mechanism for screening polar discontinuities at heterointerfaces. We focus on SmNiO$_3$, a III-III perovskite characterized by an insulating ground state that originates from disproportionation of the electrons at the Ni sites. When interfaced with ferroelectric, II-IV perovskite BaTiO$_3$, this system can display a polar discontinuity whose magnitude is determined by the nature of the interface (NiO$_2$-BaO or SmO-TiO$_2$) and the orientation of the BaTiO$_3$ spontaneous polarization. In the orientation maximizing the interface charge, SmNiO$_3$ compensates by transferring 1 $e$/f.u. between the two interfaces and modifying the disproportionation sequence from Ni$^{4+}$/Ni$^{2+}$ to Ni$^{2+}$/Ni$^{2+}$ at the SmO-TiO$_2$ interface and to Ni$^{4+}$/Ni$^{4+}$ at the NiO$_2$-BaO interface. While this mechanism is potentially universal in all perovskites exhibiting charge disproportionation, our formal analysis of BiNiO$_3$/BaTiO$_3$ superlattices suggests that larger polar discontinuities may need more complex disproportionation patterns for screening.", "url": "https://arxiv.org/abs/2609.31375", "type": "理论+数值", "summary": "1. 该工作用密度泛函理论研究了SmNiO3/BaTiO3等铁电/镍酸盐超晶格，提出电荷歧化重排可作为屏蔽极性不连续性的新机制。\n2. 其关键是在界面电荷最大的取向下，SmNiO3通过界面间转移1 e/f.u.，使Ni歧化由Ni4+/Ni2+分别变为Ni2+/Ni2+与Ni4+/Ni4+。\n3. 该机制可能普适于发生电荷歧化的钙钛矿，而BiNiO3/BaTiO3分析表明更大极性不连续性需更复杂歧化模式。", "summary_source": "deepseek", "authors": [{"name": "Edith Simmen"}, {"name": "Jonathan Amara"}, {"name": "Philippe Ghosez"}, {"name": "Nicola A. Spaldin"}], "featured_authors": [{"name": "Edith Simmen"}, {"name": "Jonathan Amara"}, {"name": "Philippe Ghosez"}, {"name": "Nicola A. Spaldin"}], "author_count": 4}, {"id": "2609.31411", "category": "cond-mat", "title": "Non-Uniform Quantum Well and Barrier Thickness Engineering for Robust Ultra-High TER and Low RA Ferroelectric Tunnel Junctions", "abstract": "HfO$_2$-based ferroelectric tunnel junctions (FTJs) are promising candidates for scalable non-volatile memory, but simultaneously achieving a high tunneling electro-resistance ratio (TER) and a low resistance-area (RA) product remains challenging. To address this challenge, this work introduces non-uniform quantum well (QW) and barrier thickness engineering in HfO$_2$-based multi-QW FTJs using a self-consistent Preisach-based ferroelectric (FE) model integrated with the coherent and inelastic non-equilibrium Green's function (NEGF) formalism. The non-uniform well and barrier configuration produces a wide range of FTJ design landscapes due to closely spaced, broad resonant states in the low resistance state (LRS) and a larger separation in the high resistance state (HRS), resulting in strong polarization-dependent resonant transmission with TER reaching the order of $\\mathbf{1\\times10^{8}\\%}$ and an LRS RA product as low as $\\mathbf{1~\\Omega\\cdot\\mathrm{cm}^{2}}$ at read bias and in the presence of scattering. By incorporating self-consistent elastic scattering into the NEGF framework, we also show that elastic scattering can positively influence the TER and RA performance of non-uniform FTJs by progressively increasing the overlap of the closely spaced resonances. Overall, the results establish non-uniform QW and barrier thickness as an effective and robust design parameter for controlling resonant-state alignment and achieving a favorable combination of high TER and low RA in HfO$_2$-based multi-QW FTJs.", "url": "https://arxiv.org/abs/2609.31411", "type": "理论", "summary": "1. 该工作针对 HfO2 基多量子阱铁电隧道结，引入非均匀量子阱与势垒厚度工程，并采用自洽 Preisach 铁电模型结合相干/非弹性 NEGF 形式进行输运计算。\n2. 其核心卖点是非均匀厚度使低阻态出现密集宽共振、高阻态共振间隔增大，从而获得强极化依赖共振透射，TER 达 1×10^8% 量级且读取偏压下低阻态 RA 低至 1 Ω·cm^2，并揭示弹性散射可通过逐步增强密集共振重叠而正面影响性能。\n3. 这表明非均匀量子阱/势垒厚度可作为调控共振态对齐、兼顾高 TER 与低 RA 的稳健设计参数，为 HfO2 基多量子阱 FTJ 的优化提供明确方向。", "summary_source": "deepseek", "authors": [{"name": "Balram Khattar"}, {"name": "Adarsh Tripathi"}, {"name": "Manish Anand"}, {"name": "Abhishek Sharma"}], "featured_authors": [{"name": "Balram Khattar"}, {"name": "Adarsh Tripathi"}, {"name": "Manish Anand"}, {"name": "Abhishek Sharma"}], "author_count": 4}, {"id": "2609.31414", "category": "cond-mat", "title": "Dielectric response of the antiferromagnetic multiferroics with cycloidal equilibrium for the polarization related to the noncollinear spins", "abstract": "Linear dynamics of the small amplitude perturbations in the antiferromagnetic multiferroics is analytically considered. Equilibrium state in the considered regime is assumed to be cycloidal structure both for the antiferromagnetic vector and the nonzero magnetization vector (presence of weak ferromagnetism in the system is included). The electric polarization of spin origin related to the \"noncollinear\" spins is considered and its influence on the spin dynamics is included. The dynamical electric susceptibility tensor is obtained to demonstrate response of the multiferroics on the alternating electric field. Existence of two polarization projections is found, response of each of them on two projections of the electric field perpendicular to the cycloid direction is presented. Different roles of the in plane and out of plane electric perturbations is demonstrated analytically. Essential role of the low frequency gapless spin wave in the dielectric response is described. Contributions of the spiral structure and the weak ferromagnetism in the dielectric response are specified.", "url": "https://arxiv.org/abs/2609.31414", "type": "理论", "summary": "1. 该工作解析研究了反铁磁多铁材料中小扰动在线性区的动力学，假定平衡态中反铁磁矢量与非零磁化矢量均呈摆线结构（包含弱铁磁性），并纳入非共线自旋起源的自旋致电极化及其对自旋动力学的影响。\n2. 其核心在于导出动态电极化率张量，发现存在两个极化投影，并解析阐明面内与面外电场扰动对垂直于摆线方向的两个电场分量的响应差异，以及低频无能隙自旋波在介电响应中的关键作用。\n3. 该结果明确区分了螺旋结构与弱铁磁性对介电响应的贡献，为在摆线型反铁磁多铁中借助电场探测和调控自旋动力学提供了可检验的理论依据。", "summary_source": "deepseek", "authors": [{"name": "Pavel A. Andreev"}], "featured_authors": [{"name": "Pavel A. Andreev"}], "author_count": 1}, {"id": "2609.31437", "category": "cond-mat", "title": "Maximal Chern Numbers from Finite-Range Hopping", "abstract": "Finite-range hopping constrains both the number of Dirac points and the masses that gap them. We determine the maximal absolute Chern numbers of an isotropic finite-range extension of the Qi--Wu--Zhang model on a square lattice through thirteenth-neighbor hopping. Algebraic zero counting and mass-weighted sum rules yield global bounds, and we construct explicit Hamiltonians that saturate them. We find $|C|_{\\max}=36,40,51$ for eleventh-, twelfth-, and thirteenth-neighbor hopping. Equal numbers of Dirac points can produce different maxima because finite-range mass harmonics distinguish opposite vortex charges differently. Twice the squared hopping radius bounds every maximum through twelfth-neighbor hopping and is saturated at the eleventh and twelfth, but the thirteenth-neighbor maximum exceeds it. Thus finite-range hopping constrains the maximal Chern number in two complementary ways: through the number of Dirac vortices it can generate and through the mass-sign patterns it can assign to them. This geometric viewpoint provides a design principle for high-Chern bands and a route to analogous bounds in moiré and other lattice systems.", "url": "https://arxiv.org/abs/2609.31437", "type": "理论", "summary": "1. 有限范围的跳跃限制了狄拉克点的数量和间隔它们的质量。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Christopher Arriagada Cortés"}, {"name": "Vladimir Juričić"}], "featured_authors": [{"name": "Christopher Arriagada Cortés"}, {"name": "Vladimir Juričić"}], "author_count": 2}, {"id": "2609.31521", "category": "cond-mat", "title": "Complexity drives the symmetry breaking of temperature fluctuations", "abstract": "Frequently, nonextensive systems are described through $q$-exponential functions, where the $q$-parameter determines how far a system is from equilibrium. In this work, we study systems constrained to $q-1\\ll1$ to describe systems near thermal equilibrium, and derive the probability density function and temperature fluctuations. To this end, we derive the series expansion of the $q$-exponential function, yielding a perturbative series that is a superposition of gamma distributions. On the other hand, the temperature fluctuations are expressed as a superposition of Dirac delta functions and their derivatives, meaning that the bulk of the system remains at a constant temperature, while point-temperature variations emerge, marking the system's departure from thermal equilibrium. The statistics of the temperature fluctuations exhibit a transition from a symmetric to a nonsymmetric distribution as the nonextensive parameter increases. These results provide evidence of the association between the emergence of nonextensivity and the symmetry breaking of temperature fluctuations.", "url": "https://arxiv.org/abs/2609.31521", "type": "理论", "summary": "1. 该工作针对非广延参数满足 q−1≪1 的近平衡体系，推导了 q-指数展开下的概率密度函数与温度涨落统计，并刻画其随非广延性增强的演化。\n2. 核心结果是 q-指数的微扰级数可表示为伽马分布叠加，而温度涨落则由狄拉克δ函数及其导数叠加描述，表明体系主体温度恒定，仅在点处出现温度变化，并伴随从对称到非对称分
