  <style>
    :root {

      --accent-2: #1d5f6b;

    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }

    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }

    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }

    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }

    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2605.26207", "category": "cond-mat", "title": "Conserving relaxation-time approximation for electron-electron collisions", "abstract": "We develop a conserving relaxation-time approximation (cRTA), which explicitly enforces conservation of particle number, energy, and momentum and employs an energy-resolved projection onto the full space of collision invariants. This makes the cRTA applicable to transport quantities sensitive to the energy dependence of the nonequilibrium quasiparticle distribution near the Fermi surface. We benchmark the cRTA against several exact and asymptotically exact results. In particular, it reproduces the low- and high-temperature limits of the dc conductivity of a non-Galilean-invariant Fermi liquid (FL) with disorder, the hydrodynamic and collisionless limits of the finite wavevector longitudinal conductivity of a clean Galilean-invariant FL, and the asymptotic scaling forms of the optical conductivity of a clean non-Galilean-invariant FL beyond the semiclassical limit. For several observables, the agreement with exact solutions is quantitative at the percent level. These results demonstrate that the cRTA provides a simple and accurate framework for transport beyond the Fermi surface projection approximation.", "url": "https://arxiv.org/abs/2605.26207", "type": "理论+数值", "summary": "1. 该工作发展了守恒弛豫时间近似（cRTA），通过显式约束粒子数、能量与动量守恒并采用能量分辨投影至碰撞不变量全空间。\n2. 技术核心在于精确描述费米面附近非平衡准粒子分布的能量依赖性，在直流电导率、有限波矢纵电导率及光学电导率等输运量上实现与精确解的百分比级定量吻合。\n3. 这为超越费米面投影近似、简单准确地处理非伽利略不变费米液体及其它系统的输运问题提供了实用框架。", "summary_source": "deepseek", "authors": [{"name": "Sayak Bhattacharjee"}, {"name": "Tatia Kiliptari"}, {"name": "Dmitrii L. Maslov"}], "featured_authors": [{"name": "Sayak Bhattacharjee"}, {"name": "Tatia Kiliptari"}, {"name": "Dmitrii L. Maslov"}], "author_count": 3}, {"id": "2605.26223", "category": "cond-mat", "title": "Quantum Interference Corrections in Electron Hydrodynamics", "abstract": "We show that quantum-interference corrections in an electron fluid are tightly constrained by hydrodynamic Ward identities: charge and momentum conservation protect the $m=0,\\pm1$ sectors, so the leading correction first appears in the spin-two $m=\\pm2$ stress sector. The resulting hydrodynamic Cooperon has a robust infrared structure that renormalizes stress relaxation, and hence the viscosity. In channel flow this lowers the viscous resistivity, producing a hydrodynamic interference signature with the opposite sign to ordinary weak localization.", "url": "https://arxiv.org/abs/2605.26223", "type": "理论", "summary": "1. 该工作利用流体动力学Ward恒等式，严格约束了电子流体中量子干涉修正的结构。\n2. 其核心在于发现电荷与动量守恒保护m=0,±1扇区，使领先修正出现在自旋二m=±2应力扇区，并由此构建了重整化粘度的红外鲁棒Cooperon。\n3. 该结果为通道流中一种符号与弱局域化相反的粘性电阻率干涉特征提供了明确理论预言，可作为电子流体行为的可检验探针。", "summary_source": "deepseek", "authors": [{"name": "Alberto Cortijo"}], "featured_authors": [{"name": "Alberto Cortijo"}], "author_count": 1}, {"id": "2605.26226", "category": "cond-mat", "title": "Hydrodynamic Cooperons in Electron Fluids: Schwinger--Keldysh Derivation and Quantum Corrections to Magnetoresistance", "abstract": "We develop a Schwinger--Keldysh effective theory for quantum-interference corrections in a two-dimensional electron system in the hydrodynamic regime. Starting from the clean hydrodynamic fixed point, we introduce a minimal random-friction disorder model that generates a finite momentum-relaxation time within the self-consistent Born approximation. The disorder-averaged theory then allows us to construct a hydrodynamic Cooperon and to compute the associated self-energy corrections to the collective modes. Conservation laws protect the density and momentum sectors, so that the leading quantum-coherence correction is forced into the spin-two stress sector. The associated stress self-energy renormalizes the shear viscosity and modifies both the Gurzhi response and its low-field magnetohydrodynamic signatures.", "url": "https://arxiv.org/abs/2605.26226", "type": "理论", "summary": "1. 该工作发展了Schwinger-Keldysh有效场论，用于二维电子流体中量子干涉修正的磁阻计算。\n2. 通过构建流体动力学Cooperon并利用守恒律分解，将领先量子修正约束至自旋二应力通道，从而再归一化剪切粘度。\n3. 这为统一理解流体动力学体系中量子相干修正、Gurzhi响应及低场磁阻行为提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Alberto Cortijo"}], "featured_authors": [{"name": "Alberto Cortijo"}], "author_count": 1}, {"id": "2605.26231", "category": "cond-mat", "title": "Competition between pair and single-particle superfluidity in bosonic quasi-flat bands: A Gaussian state approach", "abstract": "The interplay between interactions and quantum geometry can drive weakly dispersive bosons into different exotic many-body phases. In this work we study a quasi flat-band model in one dimension that exhibits an extended pair-superfluid phase in the all-flat-band limit. Introducing single-particle hopping leads to an intriguing competition with a more conventional single-particle superfluid: we find that the pair superfluid remains stable for a finite range of the hopping strength until the system eventually transitions into the conventional superfluid phase. In our study, we make use of a variational Gaussian state approach that provides a unified description of the single-particle and pair superfluid phases, regarding both the ground state wavefunction and the collective excitation spectrum. In particular, we derive a general relation between the speed of sound and a ``quantum geometric kernel'', thereby extending earlier connections to the quantum metric, which relied on single-particle mean-field theory. This approach is combined with insights from the two-boson problem and exact diagonalization to map out the full phase diagram of the model. Our results show that the Gaussian approach is a versatile tool for studying a broad range of superfluid phases of interacting bosons in multi-orbital lattices.", "url": "https://arxiv.org/abs/2605.26231", "type": "理论+数值", "summary": "1. 该工作利用变分高斯态方法研究一维准平带玻色子模型中配对超流与单粒子超流间的竞争。\n2. 其技术核心在于推导了声速与量子几何核的一般关系，统一描述了两种超流相的基态与集体激发谱。\n3. 这为多轨道晶格中相互作用玻色子超流相的研究提供了通用变分框架，并可扩展至更复杂几何效应。", "summary_source": "deepseek", "authors": [{"name": "Maxime Burgher"}, {"name": "Simon Loddo"}, {"name": "Laurens Vanderstraeten"}, {"name": "Nathan Goldman"}, {"name": "Ivan Amelio"}], "featured_authors": [{"name": "Maxime Burgher"}, {"name": "Simon Loddo"}, {"name": "Laurens Vanderstraeten"}, {"name": "Nathan Goldman"}, {"name": "Ivan Amelio"}], "author_count": 5}, {"id": "2605.26261", "category": "cond-mat", "title": "GPU-accelerated finite-temperature Lanczos method for spin Hamiltonians", "abstract": "We present a GPU implementation of the finite-temperature Lanczos method (FTLM) for Heisenberg spin Hamiltonians that targets workstation hardware rather than distributed-memory clusters. The Hamiltonian action is evaluated matrix-free in a row-wise gather formulation. We introduce and compare two state-to-index strategies: a compressed lookup table (CLT), which reduces lookup memory by a factor of 16 relative to a full table while retaining a fixed, branch-light access pattern, and a GPU-adapted combinatorial-ranking scheme that removes the lookup table altogether. Numerical tests against FP64 CPU references show that FP32 GPU arithmetic changes heat capacities and magnetic susceptibilities by amounts several orders of magnitude below the stochastic uncertainty of the FTLM trace estimator at typical sample sizes. Benchmarks show speedups of up to about one order of magnitude over optimized multicore CPU calculations and enable Hilbert-space sectors of dimension ~10^8 on a single workstation GPU. The MATLAB/CUDA implementation, including example input files and benchmark scripts, is openly available at this https URL (archived at DOI: https://doi.org/10.5281/zenodo.20378647 ) under the Apache-2.0 license.", "url": "https://arxiv.org/abs/2605.26261", "type": "理论+数值", "summary": "1. 该工作针对海森堡自旋哈密顿量实现了基于GPU的有限温度Lanczos方法，面向工作站硬件而非分布式集群。\n2. 其核心技术包括无矩阵行收集格式的哈密顿量作用计算，以及压缩查找表和组合排名两种状态索引策略，分别减少查找表内存和消除查找表。\n3. 该方法在单个GPU上可处理维度约10^8的希尔伯特空间，FP32精度引入的误差远低于FTLM迹估计的统计不确定性，速度较优化的多核CPU提升约一个数量级。", "summary_source": "deepseek", "authors": [{"name": "Shadan Ghassemi Tabrizi"}, {"name": "Thomas D. Kühne"}], "featured_authors": [{"name": "Shadan Ghassemi Tabrizi"}, {"name": "Thomas D. Kühne"}], "author_count": 2}, {"id": "2605.26303", "category": "cond-mat", "title": "Extended Bose-Hubbard Model on Small Grids: Exact Diagonalization and Monte Carlo Studies", "abstract": "The superfluid-insulator transition in systems of lattice bosons is usually analyzed in the framework of the Bose-Hubbard model, and has been extensively studied by theory and simulations. Less attention has been paid to the remnants of the transition in truncated lattices, with or without periodic boundary conditions. Here we consider the hard-core limit of the extended Bose-Hubbard model on small square and triangular grids -- i.e., sections of the square and triangular lattices containing up to 13 sites. By mapping out the zero-temperature phase diagram through exact diagonalization, we find ground-state characteristics that are markedly different from those emerging in the thermodynamic limit, together with similarities. The dichotomy between superfluid-like and insulating-like behavior is then investigated in two-dimensional systems of a few interacting bosons in the continuum, subject to confining and optical-lattice potentials mimicking the $3\\times 3$ square grid. Using path-integral Monte Carlo simulations, we compute kinetic and potential energies, as well as superfluidity and exchange-cycle statistics, finding hints of Bose-Hubbard behavior even in systems of just five particles.", "url": "https://arxiv.org/abs/2605.26303", "type": "理论+数值", "summary": "1. 本文通过精确对角化和路径积分蒙特卡洛模拟，分别研究了小型正方与三角网格硬核扩展Bose-Hubbard模型及连续中少数相互作用玻色子的超流-绝缘行为。\n2. 卖点在于揭示截断晶格中基态相图与热力学极限的显著差异，以及仅五个粒子系统中仍可观测到类似Bose-Hubbard模型的超流与交换循环统计特征。\n3. 这为有限尺寸量子多体系统中相变残余的刻画提供了定量基准，并为少体超冷原子体系模拟晶格模型的有效性给出了可信证据。", "summary_source": "deepseek", "authors": [{"name": "Gabriele Costa"}, {"name": "Matteo Ciardi"}, {"name": "Fabio Cinti"}, {"name": "Santi Prestipino"}], "featured_authors": [{"name": "Gabriele Costa"}, {"name": "Matteo Ciardi"}, {"name": "Fabio Cinti"}, {"name": "Santi Prestipino"}], "author_count": 4}, {"id": "2605.26338", "category": "cond-mat", "title": "Phase behavior of solvent-nematogen mixtures", "abstract": "Liquid mixtures with a nematogen can undergo both fluid phase separation and a transition from an isotropic to a nematic state. These phase transitions can couple and lead to phase behavior distinct from simple liquid mixtures or pure liquid crystals. We measured the phase behavior of mixtures of a nematogen (5CB) with simple liquid solvents (squalane and/or squalene). We observed two distinct kinds of binary phase diagrams: with and without a region of isotropic-isotropic coexistence. Varying the ratio of squalene to squalane, we continuously tuned the phase boundaries of the apparent binary system and revealed a region of three-phase coexistence. A mean-field model combining classical models of liquid mixing and nematic ordering quantitatively describes both binary and ternary phase behavior. This simple model predicts a range of topologically complex ternary phase diagrams and extends naturally to systems with more components.", "url": "https://arxiv.org/abs/2605.26338", "type": "理论+数值", "summary": "1. 该工作通过实验测量向列相5CB与角鲨烷/角鲨烯溶剂的二元及三元相图，并结合平均场模型定量描述了观察到的两类二元相图及三相共存区域。\n2. 其核心在于通过调控溶剂组分比例连续调变相边界，揭示了各向同性-各向同性共存区消失与出现的转变，以及三种相共存的完整相拓扑。\n3. 该平均场模型可自然推广至多组分系统，预言了一系列拓扑复杂的三元相图，为工程化设计溶剂-向列相混合物的相行为提供了可延拓的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Sullivan Bailey-Darland"}, {"name": "Takumi Matsuzawa"}, {"name": "Eric R. Dufresne"}], "featured_authors": [{"name": "Sullivan Bailey-Darland"}, {"name": "Takumi Matsuzawa"}, {"name": "Eric R. Dufresne"}], "author_count": 3}, {"id": "2605.26412", "category": "cond-mat", "title": "Multi-Scale Coherence of Represented Flows", "abstract": "Many problems in nonlinear and statistical physics are formulated through represented flows, including physical-space vector fields, phase-space drift fields, and truncated renormalization-group beta functions. We introduce a complementary representation-dependent diagnostic for testing whether finite-separation flow geometry is stable across observational resolution. For two separated points, states, or theories, the method compares the direction of the corresponding vector-field increment after the field has been smoothed at two resolutions. Averaging this normalized comparison over sampled separations gives a coherence matrix tied to the chosen variables, coarse graining, metric, and sampling protocol; it is a consistency test, not a coordinate-invariant quantity. We demonstrate the diagnostic in three settings. Synthetic divergence-free fields with identical Fourier amplitudes, spectra, and scalar two-point correlations nevertheless produce distinct coherence matrices, showing that second-order statistics do not determine cross-resolution increment geometry. Lorenz phase-space tests show that a smooth coordinate wrinkling changes represented drift geometry without changing the underlying dynamics, and that a weak model perturbation lowers finite-separation coherence even when local stretching proxies remain closely matched. Finally, for functional renormalization-group flows of the three-dimensional \\(O(1)\\) scalar theory, projected \\(M=4,5,6\\) LPA beta fields remain internally coherent, while cross-truncation coherence decreases as higher-order coupling directions are activated. The diagnostic provides a practical field-level check of how representations, models, and truncations preserve finite-separation flow geometry, complementing rather than replacing standard local, spectral, or fixed-point diagnostics.", "url": "https://arxiv.org/abs/2605.26412", "type": "理论", "summary": "1. 该工作提出一种表示依赖的诊断方法，通过比较不同平滑分辨率下向量场增量的方向一致性，检验有限分离流几何的跨分辨率稳定性。\n2. 其核心在于构建非坐标不变的相干矩阵，并论证二阶统计量无法决定跨分辨率增量几何，从而揭示表示、截断或模型扰动对流动结构的影响。\n3. 此诊断可作为标准局部、谱与固定点分析的场级补充，为非线性与统计物理中表示流的结构保持特性提供实用检验工具。", "summary_source": "deepseek", "authors": [{"name": "Amir Jafari"}], "featured_authors": [{"name": "Amir Jafari"}], "author_count": 1}, {"id": "2605.26420", "category": "cond-mat", "title": "Ground state correlations in the one-dimensional Fermi one-component plasma", "abstract": "Structural and dynamic correlations in the ground state of the one-dimensional Fermi one-component plasma are studied by Quantum Monte Carlo simulations. Results are presented for the pair correlation function, static structure factor, the one-particle density matrix and the momentum distribution, for the cases of full, partial and no polarization. Evidence is reported of density correlations slowly decaying with distance, with the concurrent emergence of quasi-crystalline order even in the weakly correlated regime. Effects of quantum statistics in the momentum distribution are discussed.", "url": "https://arxiv.org/abs/2605.26420", "type": "数值", "summary": "1. 采用量子蒙特卡洛模拟研究一维费米单分量等离子体基态的结构与动力学关联，涵盖全极化、部分极化及无极化情形。\n2. 揭示了密度关联随距离缓慢衰减及弱关联区准晶序的出现，定量给出对关联函数、静态结构因子与动量分布。\n3. 该工作为理解一维费米系统中超越朗道液体行为的集体激发与量子统计效应提供了数值基准。", "summary_source": "deepseek", "authors": [{"name": "Massimo Boninsegni"}], "featured_authors": [{"name": "Massimo Boninsegni"}], "author_count": 1}, {"id": "2605.26541", "category": "cond-mat", "title": "Super-Arrhenius Dynamic Slowdown Revealed by Slow Variable Modulation in the Fragile Supercooled Liquid", "abstract": "The super-Arrhenius dynamic slowdown in fragile supercooled liquids remains one of the central unresolved questions in condensed matter physics. In this study, we analyze particle jump dynamics in a prototypical fragile glass-forming liquid, the Kob-Andersen Lennard-Jones (KALJ) model. Using the displacement of jumping particles as the reaction coordinate, we demonstrate the emergence of non-Poissonian dynamics as the temperature decreases. In the mildly supercooled regime, the outer region of the first coordination shell of a jumping particle exhibits a significant distribution shift during the jump motion. By comparing the survival probability with its slow-fluctuation limit using this distribution as a slow variable, we confirm that particles in this region modulate the jump dynamics, enhance the jump rate fluctuations, and thereby induce the dynamic slowdown as supercooling proceeds. As the temperature decreases, this behavior extends to the outer regions of the second coordination shell and beyond, intensifying the dynamic slowdown. This spatial growth of the slow variables responsible for dynamic disorder exhibits close correspondence with an increase in the static correlation length. These results provide a microscopic mechanism for the super-Arrhenius dynamic slowdown in the KALJ model.", "url": "https://arxiv.org/abs/2605.26541", "type": "理论+数值", "summary": "1. 该工作通过分析Kob-Andersen Lennard-Jones模型中粒子跳跃动力学，揭示了慢变量调制导致脆性过冷液体出现超Arrhenius动态减速的微观机制。\n2. 其技术核心在于利用跳跃粒子位移作为反应坐标，发现第一配位壳外层分布作为慢变量可诱导跳变速率的非泊松涨落，从而解释动态减速。\n3. 这为将动态无序的慢变量空间增长与静态关联长度建立对应关系，并推广至其他玻璃形成体系提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Zhiye Tang"}, {"name": "Shubham Kumar"}, {"name": "Shinji Saito"}], "featured_authors": [{"name": "Zhiye Tang"}, {"name": "Shubham Kumar"}, {"name": "Shinji Saito"}], "author_count": 3}, {"id": "2605.26570", "category": "cond-mat", "title": "Ultrametricity of Energy Minimum Configurations of RNA Secondary Structures in the Nussinov Model", "abstract": "We present a numerical study of the ultrametric properties of the set of RNA secondary structures with the maximum number of base pairs (energetically degenerate minima) within the maximum matching model (Nussinov algorithm). Using 18 natural small nuclear RNAs as examples, we show that the degree of nontrivial ultrametricity varies widely. We consider the optimization problem for the degree of nontrivial ultrametricity of RNA secondary structures with the maximum number of base pairs under a fixed nucleotide composition. It is found that permuting the nucleotide sequence can strongly change the degree of ultrametricity, indicating the key role of nucleotide order in shaping the hierarchical properties of RNA secondary structures.", "url": "https://arxiv.org/abs/2605.26570", "type": "理论+数值", "summary": "1. 该工作数值研究了Nussinov最大匹配模型中RNA二级结构能量简并极小值（最大碱基对数）集合的超度量性质。\n2. 以18种天然小核RNA为例，发现非平凡超度量性程度差异显著；固定核苷酸组成时，序列排列可强烈改变该性质，揭示核苷酸顺序在塑造RNA二级结构层次特性中的关键作用。\n3. 这为理解RNA二级结构能量景观的几何结构以及通过序列设计调控分子层次组织提供了明确启示，并可能推广至其他生物序列的层次性研究。", "summary_source": "deepseek", "authors": [{"name": "A.P. Zubarev"}], "featured_authors": [{"name": "A.P. Zubarev"}], "author_count": 1}, {"id": "2605.26650", "category": "cond-mat", "title": "Quantum statistical mechanics: Gauge invariance, operator shifting, hyperdensity functionals, and nonequilibrium sum rules", "abstract": "We provide an extended acount of the recent statistical mechanical theory of gauge invariance against operator shifting in quantum many-body systems ( arXiv:2509.20494 ). The gauge transformation is enacted by a shifting superoperator that displaces the fundamental position and momentum degrees of freedom. The shifting superoperator constitutes a map between Hilbert space operators and it features Lie algebra commutator structure. Averages of general observables remain invariant under the shifting both in and out of thermal equilibrium, as well as in groundstates. The gauge invariance induces exact sum rules that interconnect global observables and associated locally resolved correlation functions. In particular we describe the resulting one-body force, hyperforce, product, and two-body sum rules. We relate the shifting superoperator to a previously formulated quantum canonical transformation and present the generalization of quantum shifting to multi-component systems. The gauge theory respects fundamental fermionic and bosonic particle properties, as we demonstrate by proving the compatibility of operator shifting and exchange symmetry. We formulate the quantum version of hyperdensity functional theory to provide formal access to hyperforces as well as to general averaged quantum observables via universal density functionals. For time-dependent situations, we describe quantum dynamical gauge invariance and prove exact dynamical sum rules for nonequilibrium situations, as generated by Hamiltonian time dependence. We argue for the fundamental status of statistical mechanical gauge invariance based on the compliance of the underlying geometry with canonical quantization according to Dirac's correspondence principle. Analogies and differences of the quantum mechanical sum rules with their classical counterparts remain indicative of the respective levels of description.", "url": "https://arxiv.org/abs/2605.26650", "type": "理论+数值", "summary": "1. 该工作扩展了量子多体系统统计力学中关于算子移位规范不变性的理论，涵盖平衡与非平衡情形。\n2. 其卖点在于揭示移位超算符的Lie代数结构，并证明其诱导精确单体力、超力、乘积及二体求和规则。\n3. 这为量子超密度泛函理论提供形式框架，并确立非平衡动力学规范不变性，启发后续求和规则验证。", "summary_source": "deepseek", "authors": [{"name": "Johanna Müller"}, {"name": "Matthias Schmidt"}], "featured_authors": [{"name": "Johanna Müller"}, {"name": "Matthias Schmidt"}], "author_count": 2}, {"id": "2605.26668", "category": "cond-mat", "title": "Spatiotemporal Structures of Parametrically Driven Nonlinear Lattices", "abstract": "We theoretically investigate the effects of parametric driving on the one-dimensional Frenkel-Kontorova model, a nonlinear many-body lattice system. It is numerically found that a parametric vibration induces spatiotemporal ordering characterized by the subharmonic frequency $\\omega_{\\mathrm{ex}}/2$ and wavenumber $k$ which takes nontrivial values depending on the vibration strength $P_{\\mathrm{ac}}$ and frequency $\\omega_{\\mathrm{ex}}$. With increasing $P_{\\mathrm{ac}}$, $k$ gradually increases and discontinuously jumps up to $k=\\pi$. Based on an extended linear stability analysis, we show that the former $k$ resonance (the latter $\\pi$ resonance) corresponds to the unstable (stable) mode and that the $k$ resonance is made possible by the interplay between the parametric amplification and the collective fluctuation developing through the nonlinear effect.", "url": "https://arxiv.org/abs/2605.26668", "type": "理论+数值", "summary": "1. 该工作理论研究了参量驱动对一维Frenkel-Kontorova非线性晶格模型中时空有序结构的诱导效应。\n2. 其卖点在于揭示亚谐频率响应下波数k随驱动强度递增并跳跃至π共振的机制，源于参量放大与非线性集体涨落的耦合。\n3. 这为理解参量驱动多体晶格中的时空序调控及稳定模式选择提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Yu Funami"}, {"name": "Kazushi Aoyama"}], "featured_authors": [{"name": "Yu Funami"}, {"name": "Kazushi Aoyama"}], "author_count": 2}, {"id": "2605.26741", "category": "cond-mat", "title": "MatFormBench: A Benchmarking Evaluation Framework for Target-Driven Materials Formulation", "abstract": "Inverse design of materials has significantly advanced target-driven formulation optimization, yet existing materials machine learning benchmarks remain limited to forward property prediction, failing to systematically evaluate inverse optimization and generation algorithms, a critical gap that hinders the progress of target-driven materials design. To address this limitation, we propose MatFormBench, a novel benchmarking ecosystem tailored to evaluate and guide generative strategies for target-driven formulation. MatFormBench integrates a physics-driven formulation generation scheme to generate synthetic samples that faithfully emulate realistic materials structure-property response relationships, complemented by five escalating difficulty levels to quantify the complexity of these relationships. To rigorously assess algorithm performance, we further propose MatFormScore, a multi-dimensional metric that comprehensively quantifies performance across five critical axes: target success, search efficiency, exploratory capacity, robustness, and stability. We validate MatFormBench by evaluating 39 diverse inverse design algorithms, covering classical surrogate-assisted black-box search, state-of-the-art deep generative models, and increasingly popular Large Language Model (LLM)-based recommendation strategies. Across 1170 standardized algorithm-task evaluations, diffusion-based models demonstrate the strongest overall performance, while Variational Autoencoder (VAE)-based and Genetic Algorithm (GA)-based methods exhibit distinct advantages in specific scenarios. By establishing a unified evaluation standard for target-driven materials formulation, MatFormBench enables reproducible benchmarking, principled algorithm comparison, and diagnostic analysis of inverse design strategies, providing a foundational tool for advancing materials inverse design.", "url": "https://arxiv.org/abs/2605.26741", "type": "理论+数值", "summary": "1. 该工作提出了一个用于评估目标驱动材料配方逆向设计算法的基准框架MatFormBench，包含物理驱动的配方生成方案与五级难度分层。\n2. 其核心卖点在于构建了MatFormScore多维指标，从目标成功率、搜索效率、探索能力、鲁棒性和稳定性五个维度全面量化算法性能。\n3. 通过对39种算法在1170项标准化任务上的系统评估，该框架为材料逆向设计算法选择与诊断分析提供了可重复的标准化基础。", "summary_source": "deepseek", "authors": [{"name": "Linhan Wu"}, {"name": "Chenxi Wang"}, {"name": "Chuhan Yang"}, {"name": "Zhengwei Yang"}, {"name": "Yuyang Liu"}], "featured_authors": [{"name": "Linhan Wu"}, {"name": "Chenxi Wang"}, {"name": "Chuhan Yang"}, {"name": "Zhengwei Yang"}, {"name": "Yuyang Liu"}], "author_count": 5}, {"id": "2605.26779", "category": "cond-mat", "title": "Weak first-order phase transition out of the classical kagome spin liquid", "abstract": "The low-temperature fate of the spin-liquid regime in the classical kagome Heisenberg antiferromagnet has been debated for over three decades. Using an expansion in the number of spin components, we show that, contrary to earlier Monte Carlo simulations, the spin liquid terminates at a weak first-order phase transition into the $\\sqrt{3}\\times\\sqrt{3}$ phase which ordered moment saturates at zero temperature. Adding second-neighbor interactions, this transition belongs to a line of first-order phase transitions that ends at a critical point. For comparison, the pyrochlore antiferromagnet remains disordered at all temperatures.", "url": "https://arxiv.org/abs/2605.26779", "type": "理论+数值", "summary": "1. 该工作利用自旋分量数展开，证明经典kagome海森堡反铁磁体中的自旋液体在低温下通过弱一级相变进入饱和有序矩的√3×√3相。\n2. 其核心在于揭示该一级相变在加入次近邻相互作用后构成一条终止于临界点的相变线，与早期蒙特卡洛模拟结果相悖。\n3. 这为理解几何阻挫体系中自旋液体的相变本质提供了新视角，并与烧绿石反铁磁体始终无序的行为形成关键对比。", "summary_source": "deepseek", "authors": [{"name": "Cecilie Glittum"}, {"name": "Olav F. Syljuåsen"}], "featured_authors": [{"name": "Cecilie Glittum"}, {"name": "Olav F. Syljuåsen"}], "author_count": 2}, {"id": "2605.26794", "category": "cond-mat", "title": "Superconductivity-enhanced phonon angular momentum", "abstract": "We theoretically investigate the properties of phonon angular momentum in the superconducting state, using fulleride compounds in an external magnetic field as a model system. The electron orbital angular momentum injected by an external field is transferred to the phonon subsystem via electron--phonon coupling. We show that this field-induced phonon angular momentum is significantly enhanced and undergoes a sign reversal upon entering the superconducting state. In the normal state, the dominant energy scale governing the response function is the electronic bandwidth $D$. In the superconducting state, the phonon energy scale $\\omega_1$ enters the denominator, leading to an enhancement of order $D/\\omega_1$. The observed sign change in the response can be explained by the competition between Fermi surface and Fermi volume contributions.", "url": "https://arxiv.org/abs/2605.26794", "type": "理论", "summary": "1. 该工作通过理论模型研究超导态中声子角动量的性质，以富勒烯化合物在外磁场中为例。\n2. 其核心物理在于超导态下电子-声子耦合引入的响应函数能量尺度从电子带宽转变为声子频率，导致声子角动量增强约D/ω₁并出现符号反转。\n3. 这揭示了超导凝聚对声子角动量的调控机制，为理解超导相与晶格动力学的耦合提供新视角，可启发相关光谱或热输运探测。", "summary_source": "deepseek", "authors": [{"name": "Natsuki Okada"}, {"name": "Philipp Werner"}, {"name": "Shintaro Hoshino"}], "featured_authors": [{"name": "Natsuki Okada"}, {"name": "Philipp Werner"}, {"name": "Shintaro Hoshino"}], "author_count": 3}, {"id": "2605.26814", "category": "cond-mat", "title": "Neural Autoregressive Control Variates for the Quantum Monte Carlo Sign Problem", "abstract": "We train a pair of autoregressive models to construct zero-mean control variates to mitigate the sign problem in quantum Monte Carlo simulations. The two autoregressive networks are confined to the positive- and negative-sign sectors with strictly disjoint support, and each is exactly normalized over its sector. Their difference is therefore structurally zero-mean, providing an unbiased auxiliary observable whose correlation with the sign estimator controls the variance reduction. We implement the method within the stochastic series expansion framework, which we extend to frustrated lattices by developing an incremental loop-topology update. Sign-ergodic sampling is achieved through a twist channel, which is the unique sign-changing mechanism on non-bipartite lattices. We implement the control variates as autoregressive transformers with an end-of-sequence parity mask that enforces exact sign-sector resolution, while the incremental loop-count change and cumulative frustration parity are incorporated as topological features. On the triangular-lattice Heisenberg antiferromagnet, we benchmark the method in the small-$N$ limit. The control variate reduces the standard error of the average sign by up to an order of magnitude and that of the energy estimator by a factor of three to five, remaining effective even when the average sign drops below $10^{-3}$. This work lays out the framework and provides a proof-of-principle demonstration that autoregressive control variates can effectively mitigate the sign problem. Scaling to larger systems with physics-informed architectures is the subject of future work.", "url": "https://arxiv.org/abs/2605.26814", "type": "理论+数值", "summary": "1. 该工作训练一对严格限制在正负符号扇区且各自归一化的自回归模型，构造结构零均值控制变量，以无偏方式降低量子蒙特卡洛模拟中符号估计的方差。\n2. 其技术核心在于通过自回归变压器的序列结束奇偶掩码实现精确符号扇区分辨，并结合增量环拓扑更新与扭曲通道，在非二分格点上实现符号遍历采样与方差缩减。\n3. 这为未来结合物理启发架构将控制变量方法扩展至更大尺寸的受挫量子系统提供了原理验证与明确技术路线。", "summary_source": "deepseek", "authors": [{"name": "Bei Qiao"}, {"name": "Lei Wang"}], "featured_authors": [{"name": "Bei Qiao"}, {"name": "Lei Wang"}], "author_count": 2}, {"id": "2605.26834", "category": "cond-mat", "title": "Influence of helicoidal spin-orbit coupling and Rabi coupling in dynamics of 2D Bose-Einstein Condensates", "abstract": "This study explores the dynamics of Bose-Einstein condensates (BECs) with helicoidal spin-orbit coupling (SOC) and Rabi coupling, confined under a two-dimensional harmonic potential. The relationship between helicoidal SOC, non-linear interactions along with Rabi coupling and their impact on the stability and non linear trapped modes of the condensate is analyzed using a coupled Gross-Pitaevski (GP) framework. A linearized GP equation is used to investigate modulation instability (MI), demonstrating the impact of strong coupling effects and anisotropic confinement on the instability dynamics. It has been shown that the modulation instability in the condensate is predominantly governed by the competition between the attractive and repulsive mean-field interactions. Additionally, stability regimes are altered by the harmonic confinement, enhancing their susceptibility to SOC-induced asymmetry and intra- and intercomponent interactions. These results shed light on the possibility for unique quantum phases and emergent characteristics of helicoidal SOC-driven condensates.", "url": "https://arxiv.org/abs/2605.26834", "type": "理论", "summary": "1. 本研究利用耦合Gross-Pitaevskii方程分析螺旋自旋轨道耦合与拉比耦合下二维玻色-爱因斯坦凝聚体的动力学。\n2. 其核心在于通过线性化方程揭示调制不稳定性由平均场相互作用竞争主导，谐波束缚增强对SOC不对称性的敏感度。\n3. 这为探索螺旋SOC驱动凝聚体中独特的量子相和涌现特性提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Sai Satyaprakash Biswal"}, {"name": "S. Saravana Veni"}], "featured_authors": [{"name": "Sai Satyaprakash Biswal"}, {"name": "S. Saravana Veni"}], "author_count": 2}, {"id": "2605.26868", "category": "cond-mat", "title": "Electronic properties governing the phase stability and elastic anisotropy of C14 and C15 Cr-Hf-Nb Laves phases", "abstract": "This study utilizes Density Functional Theory (DFT) to investigate the thermodynamic stability, elastic anisotropy, and electronic properties of C14 and C15 Laves phases within the Cr--Hf--Nb system. Both formation enthalpies and comprehensive elastic property analyses confirm the energetic and mechanical stability of the C14 (HfNb$_2$, HfCr$_2$, NbCr$_2$) and C15 (HfCr$_2$, NbCr$_2$) phases. Furthermore, the evaluation of elastic anisotropy reveals a descending order of HfCr$_2$ > NbCr$_2$ > HfNb$_2$ for the C14 phase, contrasting with NbCr$_2$ > HfNb$_2$ > HfCr$_2$ for the C15 phase. Finally, electronic structure and COHP analyses indicate that strong anti-bonding behavior near the Fermi level within the XM$_2$ M--M bonds acts as a primary destabilization mechanism for both of these Laves phases.", "url": "https://arxiv.org/abs/2605.26868", "type": "理论+数值", "summary": "1. 利用密度泛函理论计算了Cr-Hf-Nb体系中C14和C15 Laves相的形成焓、弹性常数与电子结构，确认了HfNb₂等相的稳定性和弹性各向异性顺序。\n2. 通过COHP分析揭示，费米能级附近XM₂结构中M–M键的强反键行为是这两种Laves相的主要失稳电子机制。\n3. 该电子稳定性判据为理解及调控拓扑密堆Laves相的相稳定性提供了微观视角，对设计新型高温合金成分具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "M. Díaz-Choque"}, {"name": "C. F. Schuch"}, {"name": "L. T. F. Eleno"}], "featured_authors": [{"name": "M. Díaz-Choque"}, {"name": "C. F. Schuch"}, {"name": "L. T. F. Eleno"}], "author_count": 3}, {"id": "2605.26887", "category": "cond-mat", "title": "Self-Consistent Spectral Quadrature Approach to Many-Body Green Functions", "abstract": "We develop a self-consistent spectral quadrature (sc-SQ) framework for the calculation of many-body Green functions. The method approximates the Källén--Lehmann spectral measure by Gauss--Christoffel (GC) quadrature, yielding a rational Green function representation with guaranteed spectral positivity that exactly reproduces the first $2N$ spectral moments at pole order $N$. A key component is an SVD-based rank-selection criterion on the Hankel matrix, which identifies the numerically resolvable pole rank $N^*$ from the singular-value gap and acts as a precision-guided diagnostic of correlation complexity. The scheme is made self-consistent by requiring that the spectral function used to evaluate expectation values coincides with the spectral function generated by the quadrature reconstruction. This defines a fixed-point hierarchy that connects systematically to established approximations, including Hartree--Fock and Hubbard-I, and incorporates non-perturbative features such as multi-peak spectral structure. We benchmark the approach for the Anderson impurity model against numerical renormalization group (NRG) results and apply it within dynamical mean-field theory for the Hubbard model on the Bethe lattice. The method captures the three-peak Anderson impurity spectrum and the suppression of quasiparticle weight in the half-filled Hubbard model on the Bethe lattice, including Mott-gap formation on the insulating branch for $N\\geqslant 5$, in qualitative agreement with NRG references.", "url": "https://arxiv.org/abs/2605.26887", "type": "理论+数值", "summary": "1. 该工作发展了一种自洽谱求积(sc-SQ)框架，用于计算多体Green函数。\n2. 方法通过Gauss-Christoffel求积近似Källén-Lehmann谱测度，结合SVD基秩选准则识别可解析极点阶数，自洽固定点层次连接Hartree-Fock与Hubbard-I近似。\n3. 在Anderson杂质模型和Bethe格点Hubbard模型的DMFT应用中，该框架定量再现三峰谱结构与Mott隙形成，为强关联体系提供可控非微扰数值途径。", "summary_source": "deepseek", "authors": [{"name": "Stanislav Yu. Kruchinin"}], "featured_authors": [{"name": "Stanislav Yu. Kruchinin"}], "author_count": 1}, {"id": "2605.26889", "category": "cond-mat", "title": "Orbital Magnetization from Uniform and Periodic Magnetic Fields", "abstract": "Magnetization is thermodynamically defined as the derivative of the grand potential with respect to a uniform magnetic field. However, a uniform magnetic field makes the kinetic momentum operators noncommuting and Landau-quantizes the electron motion. This changes the zero-field momentum-space to Landau-levels and raises a fundamental question: how can the thermodynamic response to a uniform field be reproduced by a linear-response calculation carried out in the momentum space of the zero-field problem? We address this question analytically in a quantum Hall ferromagnet that allows the orbital magnetization $M$ to be computed in a closed form. We first compute $M$ from the local Hartree--Fock projector response to a periodic magnetic field with zero net flux. We then compute $M$ from the derivative of the grand potential with respect to a uniform magnetic field along the Středa line. The two approaches give the same result, even though the first keeps the Hilbert space fixed while the second changes the Landau-level degeneracy. Their agreement suggests that we should view orbital magnetization as the energy associated with the spectral flow that gives rise to the Středa formula. Our work provides a tutorial introduction to orbital magnetization and its relation to the Středa formula.", "url": "https://arxiv.org/abs/2605.26889", "type": "数值", "summary": "1. 该工作解析计算了量子霍尔铁磁体中轨道磁化强度M，并比较了周期磁场（零净通量）与均匀磁场两种定义的等效性。\n2. 其核心在于证明通过固定Hilbert空间的局域Hartree–Fock响应与改变Landau能级简并的均匀场导数给出相同M，将M解释为Středa公式中谱流对应的能量。\n3. 这为理解均匀磁场下轨道磁化强度的热力学一致性提供了理论框架，并可推广至一般拓扑能带体系的磁响应分析。", "summary_source": "deepseek", "authors": [{"name": "Chunli Huang"}], "featured_authors": [{"name": "Chunli Huang"}], "author_count": 1}, {"id": "2605.26932", "category": "cond-mat", "title": "Long-range deformations in Gaussian States", "abstract": "Imaginary-time evolution by a local Hamiltonian cannot induce a phase transition in one dimension, but longer-range interactions may subvert such constraints. Starting from the ground state of the Kitaev Majorana chain, we modify the wave function by an imaginary-time evolution generated by a quadratic Hamiltonian with power-law couplings that enhance pairing correlations, typically of the form $1/r^{\\alpha}$, where $r$ is the distance between two sites. As the state remains Gaussian, entanglement and correlation functions can be computed analytically. We find that the decay exponent $\\alpha$ controls three distinct infrared regimes: for $\\alpha>1$, the deformation produces only smooth crossovers at finite deformation strength, while the topological regime is reached only asymptotically as the deformation strength tends to infinity. At $\\alpha=1$, the deformation induces an immediate flow to the topological phase: an infinitesimal deformation strength drives the system to a topological regime, and in a particular case, an emergent Kramers-Wannier symmetry enforces Ising-like scaling at long distances. For $\\alpha<1$, the deformed state shows the same critical-like behavior for all non-zero deformation strength. We observe that even with arbitrarily long-range interactions, these models do not display a sharp phase transition at non-zero deformation strength.", "url": "https://arxiv.org/abs/2605.26932", "type": "理论+数值", "summary": "1. 该工作通过虚时演化在Kitaev Majorana链基态上施加长程二次型哈密顿量的变形，解析研究了高斯态中配对关联指数衰减对红外行为的影响。\n2. 其核心在于揭示衰减指数α=1处出现奇异性：无穷小变形强度即驱动系统进入拓扑相，并伴生隐现的Kramers-Wannier对称性与Ising标度行为。\n3. 这表明即使存在任意长程相互作用，非零变形强度下仍无尖锐相变，为理解长程耦合高斯态中拓扑序的平滑过渡提供了解析框架。", "summary_source": "deepseek", "authors": [{"name": "Francisco Pereira"}, {"name": "Nandagopal Manoj"}, {"name": "Sara Murciano"}], "featured_authors": [{"name": "Francisco Pereira"}, {"name": "Nandagopal Manoj"}, {"name": "Sara Murciano"}], "author_count": 3}, {"id": "2605.26945", "category": "cond-mat", "title": "A tridiagonal matrix-valued process with stochastic resetting for arbitrary Dyson index $β>0$", "abstract": "We introduce a symmetric tridiagonal matrix-valued process ($\\beta$-TMP) $H(t)$ whose diagonal entries $H_{k,k}(t)$ evolve independently via an Ornstein-Uhlenbeck process starting at the origin and the off-diagonal entries $H_{k,k+1}(t)$ evolve independently via the Cox-Ingersoll-Ross process, starting at the origin and with parameters that depend on the row index $k$. We show that the joint distribution of the entries of the matrix can be computed exactly at all times and moreover, the joint distribution of its $N$ real eigenvalues can be computed exactly at all times too. We then subject this time-evolving matrix-valued process to stochastic resetting with rate $r$ in two different settings: (i) simultaneous resetting of the matrix entries to the origin with rate $r$ ($\\beta$-SRTMP process) and (ii) independent resetting of the matrix entries to the origin with rate $r$ ($\\beta$-IRTMP process). We show that the joint distribution of the eigenvalues of the $\\beta$-SRTMP process at long times can be computed analytically and it coincides with the joint distribution of the positions of the resetting Dyson Brownian motion in its stationary state for arbitrary $\\beta>0$. For the $\\beta$-IRTMP stationary ensemble, computing analytically the joint distribution of eigenvalues or even the average density of eigenvalues is difficult. However, generating the stationary $\\beta$-IRTMP ensemble numerically is relatively straightforward and we compare its numerical average eigenvalue density to the corresponding analytical results for the $\\beta$-SRTMP stationary ensemble with same parameter values, showing that they are quite different from each other. Finally, we provide a simple and concrete application of this tridiagonal matrix-valued process in computing the annealed partition function of a disordered quantum tight-binding Hamiltonian on a one-dimensional lattice.", "url": "https://arxiv.org/abs/2605.26945", "type": "理论+数值", "summary": "1. 该工作引入了一个具有任意Dyson指数β>0的对称三对角矩阵值过程，并精确计算了其时变特征值联合分布。\n2. 其卖点在于通过随机重置使得同步重置稳态的特征值联合分布与重置Dyson布朗运动一致，且与独立重置的数值结果显著不同。\n3. 这为计算一维无序紧束缚量子哈密顿量的退火配分函数提供了直接可用的随机矩阵框架。", "summary_source": "deepseek", "authors": [{"name": "Gernot Akemann"}, {"name": "Satya N. Majumdar"}, {"name": "Patricia Päßler"}], "featured_authors": [{"name": "Gernot Akemann"}, {"name": "Satya N. Majumdar"}, {"name": "Patricia Päßler"}], "author_count": 3}, {"id": "2605.27040", "category": "cond-mat", "title": "Designing Multivalent Copolymers for Selective Targeting of Multicomponent Surfaces", "abstract": "Selective targeting of membranes with a specific receptor profile is an ongoing challenge in targeted drug delivery. We investigate the adsorption of copolymers on a multicomponent receptor-covered surface using grand-canonical Monte Carlo simulations and demonstrate that polymers can be designed to target a particular receptor density profile. To achieve this, the ligand profile on the polymers should match the targeted receptor profile, and the ligand--receptor affinity should be inversely proportional to the ligand profile. While the same can be obtained using multivalent nanoparticles, the entropic effects due to polymer conformations significantly enhance the binding selectivity of multivalent polymers compared to nanoparticles. Surprisingly, the ligand distribution on the polymer plays a crucial role, whereas the persistence length does not. The optimal selectivity to the overall receptor concentration is obtained by the Poisson distribution of ligands (random copolymer), whereas the maximal selectivity to a specific receptor profile is obtained by a defined sequence of grouped alternating ligands (regular copolymer). Interestingly, the regular copolymer can become anti-selective when ligands of the same type are in homogenous blocks, showing that specific ligand distribution qualitatively affects the targeting ability. These findings suggest that sequence control is necessary to selectively target a specific density profile of membrane receptors using linear copolymers.", "url": "https://arxiv.org/abs/2605.27040", "type": "理论+数值", "summary": "1. 该工作通过巨正则蒙特卡洛模拟研究了共聚物在多组分受体表面的吸附行为，展示了通过匹配配体与受体分布来设计选择性靶向策略的可能性。\n2. 其核心发现是聚合物构象的熵效应显著增强了结合选择性，且配体分布而非持续长度起决定作用，随机共聚物优化总体浓度选择性而规则共聚物优化特定分布选择性。\n3. 这启示了线性共聚物的序列控制是实现膜受体密度分布选择性靶向的关键，并为理性设计靶向递送载体提供了物理机制。", "summary_source": "deepseek", "authors": [{"name": "Vid Ravnik"}, {"name": "Urban Bren"}, {"name": "Tine Curk"}], "featured_authors": [{"name": "Vid Ravnik"}, {"name": "Urban Bren"}, {"name": "Tine Curk"}], "author_count": 3}, {"id": "2605.27059", "category": "cond-mat", "title": "Quantum Geometric Origin of Hall Viscosity and Nonlocal Hall Conductivity in Lattice Bands", "abstract": "We show that Hall viscosity in lattice bands is governed by a band-projected electric quadrupole encoded within the quantum geometry: Berry curvature sets the projected-coordinate algebra, while the quantum metric determines the quadrupolar spread of a wave packet. The same structure enters the quadratic wave-vector coefficient of the nonlocal Hall conductivity, yielding a lattice viscosity-conductivity relation. In ideal bands, the deviation from the Landau-level form is quantified by Berry curvature fluctuations. Our results establish the nonlocal Hall response as an electrical signature of the quantum geometry underlying Hall viscosity and as a transport diagnostic of geometric idealness.", "url": "https://arxiv.org/abs/2605.27059", "type": "理论", "summary": "1. 该工作证明晶格能带霍尔粘度由带投影电四极矩控制，其量子几何根源为贝里曲率与量子度规分别决定投影坐标代数与波包四极散度。\n2. 核心卖点是揭示相同几何结构同时进入非局域霍尔电导率的二次波矢系数，导出晶格粘度-电导率关系。\n3. 在理想能带中，偏离朗道能级形式的偏差由贝里曲率涨落量化，为非局域霍尔响应诊断能带几何理想性提供电学途径。", "summary_source": "deepseek", "authors": [{"name": "Danyu Shu"}, {"name": "Ryotaro Sano"}, {"name": "Ai Yamakage"}, {"name": "Hiroshi Funaki"}, {"name": "Mamoru Matsuo"}], "featured_authors": [{"name": "Danyu Shu"}, {"name": "Ryotaro Sano"}, {"name": "Ai Yamakage"}, {"name": "Hiroshi Funaki"}, {"name": "Mamoru Matsuo"}], "author_count": 5}, {"id": "2605.27060", "category": "cond-mat", "title": "Molecular Dynamics Study of Defect Evolution Mechanisms in 3C-SiC for Quantum Technologies", "abstract": "The migration of point defects and formation of spin defects in 3C-SiC were investigated using molecular dynamics simulations, with migration barriers obtained from Nudged Elastic Band (NEB) calculations and finite temperature diffusivities evaluated using both mean square displacement (MSD) and jump frequency approaches. While both methods reproduce Arrhenius behavior, the jump frequency formulation exhibits improved statistical stability. Activation energies of 2.12~eV for carbon vacancies and 0.88~eV for carbon interstitials are obtained, consistent with literature. The resulting mobility hierarchy governs defect evolution and complex formations. Interstitial vacancy recombination competes with vacancy aggregation into divacancies, influencing the stabilization of spin active defect centers. The study also provides a consistent framework for diffusion analysis in atomistic simulations.", "url": "https://arxiv.org/abs/2605.27060", "type": "数值", "summary": "1. 该工作通过分子动力学模拟研究了3C-SiC中点缺陷迁移与自旋缺陷形成机制。\n2. 技术核心在于结合NEB计算迁移势垒，并对比均方位移与跳频方法评估扩散率，揭示跳频法统计更优且碳空位与间隙激活能分别约2.12 eV与0.88 eV。\n3. 这为原子尺度扩散分析提供了统一框架，并阐明了空位-间隙复合与双空位聚集竞争调控自旋缺陷稳定化的动力学根源。", "summary_source": "deepseek", "authors": [{"name": "Irslan Ullah Ashraf"}, {"name": "Gaetano Calogero"}, {"name": "Ioannis Deretzis"}, {"name": "Giorgio Lo Presti"}, {"name": "Damiano Ricciarelli"}, {"name": "Elisabetta Paladino"}, {"name": "Antonino La Magna"}], "featured_authors": [{"name": "Irslan Ullah Ashraf"}, {"name": "Gaetano Calogero"}, {"name": "Ioannis Deretzis"}, {"name": "Damiano Ricciarelli"}, {"name": "Elisabetta Paladino"}, {"name": "Antonino La Magna"}], "author_count": 7}, {"id": "2605.27077", "category": "cond-mat", "title": "Electron Polaron at Neutral 180$^\\circ$ Domain Wall in PbTiO$_3$: Stability, Trapping Energies, and Transverse Polarization", "abstract": "We use density-functional theory with a Hubbard correction to investigate Ti-centered electron polarons at neutral PbO-centered $180^\\circ$ domain walls in tetragonal PbTiO$_{3}$. The Hubbard parameter for Ti $3d$ states is determined using the finite-size-corrected polaronic energy-level alignment procedure, yielding stable electron-polaron formation in bulk PbTiO$_3$ with a trapping energy of $-$0.06 eV. In the domain-wall supercell, the excess electron localizes on Ti and forms a Ti$^{3+}$ center with an occupied $d_{xy}$ orbital in-gap state. Comparison of bulk-like and near-wall Ti sites shows that their trapping energies differ by only about 0.01 eV, indicating that this neutral domain wall does not provide a significant thermodynamic driving force for electron-polaron segregation. While the Ising-like reversal of the out-of-plane polarization is preserved, the localized electron induces a finite transverse polarization component normal to the wall, enhancing a local Néel-like distortion that is strongest when the polaron is located at the wall. These results show that neutral $180^\\circ$ domain walls in PbTiO$_3$ do not substantially alter the stability of Ti-centered electron polarons, but they can couple to the polaron-induced lattice distortion through a localized transverse polarization response.", "url": "https://arxiv.org/abs/2605.27077", "type": "理论", "summary": "1. 该工作采用含Hubbard修正的密度泛函理论，并利用有限尺寸修正的极化能级对齐方法确定Hubbard U，系统研究了四方相PbTiO₃中中性180°畴壁处Ti中心电子极化子的稳定性、俘获能及横向极化行为。\n2. 关键物理发现是，畴壁处极化子俘获能仅比体相小约0.01 eV，表明中性畴壁不提供显著的偏析热力学驱动力；但局域电子在垂直畴壁方向诱导出有限横向极化分量，增强局域Néel型畸变，同时保持面外极化的Ising型反转。\n3. 该结果表明，中性取向畴壁虽不显著改变极化子热力学稳定性，但其局域横向极化响应机制为理解铁电体中极化子与畴壁的耦合，以及通过极化子操纵畴壁局域功能特性提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Mohammad Amirabbasi"}, {"name": "Jochen Rohrer"}, {"name": "Karsten Albe"}], "featured_authors": [{"name": "Mohammad Amirabbasi"}, {"name": "Jochen Rohrer"}, {"name": "Karsten Albe"}], "author_count": 3}, {"id": "2605.27151", "category": "cond-mat", "title": "Identifying and designing altermagnetic crystals in real space", "abstract": "Altermagnetism is a compensated magnetic phase characterized by zero net magnetization and exchange-driven spin splitting. However, identifying altermagnets among collinear antiferromagnets usually requires full magnetic-space-group or spin-group analysis, which is not intuitive. Here we formulate a simple real-space criterion based on how the crystallographic operations of the host nonmagnetic structure permute the two opposite-spin sublattices. For simplicity, we focus on collinear compensated antiferromagnets commonly described by type-III magnetic space groups, whose magnetic primitive cell coincides with the host nonmagnetic crystallographic primitive cell. In this class, altermagnetic spin splitting is generally allowed unless inversion operation exists which transfer between the two opposite-spin sublattices. First-principles calculations on representative noncentrosymmetric and centrosymmetric materials demonstrate these criterions. Similar rules can also be applied to low-dimensional crystals or pseudocrystals. Our work reduces the identification of altermagnetism to a transparent real-space symmetry test and provides a practical route for discovering altermagnetic crystals.", "url": "https://arxiv.org/abs/2605.27151", "type": "理论+数值", "summary": "1. 该工作基于宿主非磁性结构晶体学操作对相反自旋子晶格的置换，提出了识别和设计交错磁晶体的实空间判据。\n2. 其核心在于指出对III型磁空间群描述的共线补偿反铁磁体，只要不存在连接两个相反自旋子晶格的反演操作，即可允许交换驱动的自旋分裂。\n3. 这为将交错磁的识别简化为透明实空间对称性测试提供了途径，并可推广至低维晶体或赝晶体，指导新型交错磁材料的发现。", "summary_source": "deepseek", "authors": [{"name": "Ying Chen"}, {"name": "Qiushi Huang"}, {"name": "Yu Wu"}, {"name": "Xiaolan Yan"}, {"name": "Su-Huai Wei"}], "featured_authors": [{"name": "Ying Chen"}, {"name": "Qiushi Huang"}, {"name": "Yu Wu"}, {"name": "Xiaolan Yan"}, {"name": "Su-Huai Wei"}], "author_count": 5}, {"id": "2605.27193", "category": "cond-mat", "title": "Algebras of order parameters in one-dimensional spin systems", "abstract": "We study order parameters in one-dimensional quantum lattice models with finite invertible or non-invertible symmetry. We investigate what properties a string operator must satisfy in order to acquire a non-vanishing expectation value in a given gapped phase. We deduce that multiplets of string order parameters organise into a Lagrangian algebra in the Drinfel'd centre of the symmetry category. In particular, we highlight the role of the multiplication rule as governing the fusion of the twisted sector local operators that constitute the string operator in the infrared limit. Our derivations exploit the tensor network approach to the classification of gapped phases and its reformulation in terms of module categories over the symmetry category. Within this framework, a gapped phase is associated with a pattern of spontaneous symmetry breaking wherein a Morita class of algebras of topological lines is preserved in the ground state subspace. The crux of the proof is to show that the expectation value of any string operator explicitly depends on the tube algebra module associated with the Lagrangian algebra, which is realised as the full centre of the corresponding module category. Finally, we demonstrate that these techniques extend to phases of symmetric mixed states.", "url": "https://arxiv.org/abs/2605.27193", "type": "理论+数值", "summary": "1. 该工作研究了一维自旋系统中具有有限可逆或不可逆对称性的序参数，揭示字符串序参数多重态组织成对称范畴Drinfel'd中心中的拉格朗日代数。\n2. 其核心在于利用张量网络与模范畴框架，证明字符串算符期望值依赖于与拉格朗日代数关联的管代数模，该代数实现为模范畴的全中心。\n3. 这为理解一维对称保护拓扑相和混合态对称相的结构提供了代数分类工具，并为高维推广与对称性分数化研究开辟了路径。", "summary_source": "deepseek", "authors": [{"name": "Ameya Chavda"}, {"name": "Clement Delcamp"}, {"name": "Alex Turzillo"}, {"name": "Minyoung You"}], "featured_authors": [{"name": "Ameya Chavda"}, {"name": "Clement Delcamp"}, {"name": "Alex Turzillo"}, {"name": "Minyoung You"}], "author_count": 4}, {"id": "2605.27199", "category": "cond-mat", "title": "Quantum fluctuations and chaos in fully connected spin models", "abstract": "We investigate beyond-mean-field dynamics in a fully connected $\\mathrm{SU}(3)$ spin-exchange model, focusing on the interplay between chaotic dynamics and quantum fluctuations. Using the two-particle irreducible (2PI) effective action formalism, we derive equations of motion that systematically account for higher-order correlations generated by interactions, and demonstrate how quantum fluctuations can regularize chaotic dynamics displayed by macroscopic observables. Our results show that an accurate treatment of fluctuations is essential for describing macroscopic dynamics in quantum many-body systems and promote 2PI as a robust framework for connecting microscopic correlations to macroscopic nonequilibrium phenomena.", "url": "https://arxiv.org/abs/2605.27199", "type": "理论", "summary": "1. 该工作应用双粒子不可约有效作用量形式，研究了全连接SU(3)自旋交换模型中量子涨落与混沌动力学的相互作用。\n2. 其核心在于揭示量子涨落能规则化宏观可观测量的混沌行为，并系统计入由相互作用产生的高阶关联。\n3. 这为精确描述量子多体系统宏观非平衡动力学提供了关键框架，并推广了连接微观关联与宏观现象的方法论。", "summary_source": "deepseek", "authors": [{"name": "Aleksandra A. Ziolkowska"}, {"name": "Aleksandr N. Mikheev"}], "featured_authors": [{"name": "Aleksandra A. Ziolkowska"}, {"name": "Aleksandr N. Mikheev"}], "author_count": 2}, {"id": "2605.27201", "category": "cond-mat", "title": "Electride States and Superconductivity in Dense Potassium Carbides", "abstract": "Carbon possesses remarkable physicochemical properties, enabling main group metals to react with it under high pressure and produce superconducting compounds. However, the research on high-pressure potassium carbides remains still unsystematic and inadequate. Using first-principles calculations and state-of-the-art swarm intelligence structure prediction techniques, we comprehensively explore the binary novel potassium-carbon system and characterize their structural, electronic, and superconducting properties under compression. Calculations of electron-phonon coupling show that monoclinic K7C (space group C2/m) with high K concentration is a zero-dimensional electride superconductor with a transition temperature Tc of 0.6 K at 25 GPa. By contrast, the Tc of orthorhombic KC with symmetry Imma increases upon decompression owing to the phonon softening of both acoustic and optical branches. Impressively, Imma KC reaches a maximum Tc of 21.4 K at 25 GPa, which is highly desirable for low-pressure metallic carbide superconductors. This work provides valuable insights into K-C compounds and broadens the diversity of metal carbide superconductors.", "url": "https://arxiv.org/abs/2605.27201", "type": "理论+数值", "summary": "1. 该工作采用第一性原理计算与群体智能结构预测，系统研究了高压下二元钾碳化合物的结构、电子与超导性质。\n2. 其关键发现是富钾单斜K7C为零维电子化物超导体（Tc=0.6 K），而正交Imma KC在25 GPa下因声子软化实现高达21.4 K的超导转变温度。\n3. 这为低压金属碳化物超导体的设计提供了新思路，并拓展了金属碳化物超导体的多样性。", "summary_source": "deepseek", "authors": [{"name": "Jiance Sun"}, {"name": "Ting Zhong"}, {"name": "Shoutao Zhang"}], "featured_authors": [{"name": "Jiance Sun"}, {"name": "Ting Zhong"}, {"name": "Shoutao Zhang"}], "author_count": 3}, {"id": "2605.27218", "category": "cond-mat", "title": "Amorphous vs. Short-Range-Ordered Complexions: Consequences for Grain-Boundary-Mediated Plasticity in Nanocrystalline Al-Ni Alloys", "abstract": "Amorphous grain-boundary (GB) complexions in thermally stable nanocrystalline alloys are commonly assumed to be structurally homogeneous, yet their disordered nature makes them susceptible to local short-range ordering (SRO). The influence of local SRO on GB-mediated plasticity mechanisms in such complexions remains poorly understood. This article employs large-scale Monte Carlo and molecular dynamics simulation to address this gap through simulations of nanocrystalline Al-Ni alloys at two Ni concentrations, 2 at.% and 4 at.%. Annealing at 913 K produces thick uniform amorphous intergranular film complexions, while annealing at 378 K produces semi-amorphous complexions containing FCC-type and BCC-type SRO. These two complexion states produce fundamentally different mechanical responses. Amorphous complexions act as dislocation sinks, suppressing shear localization and promoting homogeneous plasticity through shear transformation zones, but at the cost of lower strength. SRO complexions generate higher strength but also promote heterogeneous stress concentrations across the GB network, leading to intense shear localization regardless of Ni concentration. This contrast reflects a fundamental shift in governing mechanism, from shear-transformation-zone-controlled behavior in amorphous complexion alloys to GB-stress-heterogeneity-controlled behavior in SRO complexion alloys. These findings highlight the potential of complexion engineering to tailor the mechanical properties of nanocrystalline materials.", "url": "https://arxiv.org/abs/2605.27218", "type": "理论+数值", "summary": "1. 该工作通过大规模蒙特卡洛和分子动力学模拟，揭示了纳米晶Al-Ni合金中非晶与短程有序晶界复合体对塑性机制的差异化影响。\n2. 其核心在于发现非晶复合体以剪切转变区主导均匀塑性（低强度），而短程有序复合体因晶界应力异质性诱发强烈剪切局域化（高强度）。\n3. 这为通过晶界复合体工程独立调控纳米晶材料的强度与塑性提供了明确的物理机制指导。", "summary_source": "deepseek", "authors": [{"name": "Frederic Sansoz"}, {"name": "Eve-Audrey Picard"}], "featured_authors": [{"name": "Frederic Sansoz"}, {"name": "Eve-Audrey Picard"}], "author_count": 2}, {"id": "2605.27229", "category": "cond-mat", "title": "At-Scale Data-Driven Exploration of High-Voltage Cathode-Active Materials for Sodium Batteries", "abstract": "Sodium-ion batteries (SIBs) share similar electrochemistry with Li but offer several advantages, including high abundance in nature and low cost, as well as suitability for fast charging due to a Na-ion mobility higher than that of Li. The development of high-voltage SIBs heavily relies on the discovery of novel, robust cathode-active materials (CAMs). All-inorganic materials represent the most mature and practical choice as CAMs for next-generation SIBs; however, their family spans a vast and chemically diverse space. In this work, we present a large-scale, chemically validated database of stable materials for SIB cathode discovery, curated from four major databases: Materials Project, AFLOW, OQMD, and GNoME. Generalizable and transferable descriptor-based machine learning (ML) models are developed based on a dataset of charged-only structures rather than charged/discharged pairs. Using a committee of the top four trained ML models, average voltage and specific capacity are predicted as target properties. Finally, a subset of top-ranked candidate CAMs is validated through explicit, high-throughput first-principles calculations of voltage profiles, phase stability, structural robustness upon sodiation/desodiation, and electronic properties. Together, this integrated data curation, ML ranking and predictions, and first-principles validation strategy establishes a scalable and transferable framework for accelerating the discovery of stable, high-voltage CAMs for SIBs and beyond.", "url": "https://arxiv.org/abs/2605.27229", "type": "理论+数值", "summary": "1. 该工作构建了涵盖四个主要数据库的大规模化学验证稳定材料库，并开发了基于描述符的机器学习模型，用于筛选高压钠电池正极活性材料。\n2. 其技术核心在于仅利用充电态结构数据集训练出通用可迁移的模型，通过多模型集成预测平均电压与比容量，并经第一性原理计算验证候选材料的结构稳定性和电子性质。\n3. 这建立了一种集数据整合、机器学习排序与第一性原理验证于一体的可扩展框架，可推广至其他电池体系的正极材料加速发现。", "summary_source": "deepseek", "authors": [{"name": "Suchona Akter"}, {"name": "Mohammad R. Momeni"}], "featured_authors": [{"name": "Suchona Akter"}, {"name": "Mohammad R. Momeni"}], "author_count": 2}, {"id": "2605.27275", "category": "cond-mat", "title": "Non-stationary current fluctuations in 1D boundary-driven diffusive systems via Macroscopic Fluctuation Theory", "abstract": "While Macroscopic Fluctuation Theory (MFT) has been highly successful in analyzing non-equilibrium steady states, its application to non-steady-state processes remains limited. In this study, we apply MFT to the relaxation process of one-dimensional boundary-driven diffusive systems coupled to particle reservoirs at both ends. We exactly derive the current variance for systems with a constant diffusion coefficient and arbitrary mobility, as well as the cumulant generating function for the current in Reflective Brownian Motion (RBM). Our results demonstrate that non-steady current fluctuations during the approach to a steady state can be quantitatively described within the MFT framework.", "url": "https://arxiv.org/abs/2605.27275", "type": "理论", "summary": "1. 该工作将宏观涨落理论拓展至一维边界驱动扩散系统弛豫过程中非稳态电流涨落的精确描述。\n2. 其卖点在于导出了恒定扩散系数及任意迁移率下电流方差的精确解，并揭示了反射布朗运动中电流累积生成函数的显式形式。\n3. 这为非平衡弛豫过程中涨落现象的定量研究提供了可解析求解的理论框架，有望推广至更一般的输运系统。", "summary_source": "deepseek", "authors": [{"name": "Daisuke Suzuki"}, {"name": "Tomohiro Sasamoto"}], "featured_authors": [{"name": "Daisuke Suzuki"}, {"name": "Tomohiro Sasamoto"}], "author_count": 2}, {"id": "2605.27297", "category": "cond-mat", "title": "Geometry and relaxation dynamics of nematic loops", "abstract": "Disclination lines in three-dimensional nematic liquid crystals generically form closed loops whose topology is classified by homotopy theory. While this classification successfully captures global topological features, it does not encode the geometry of the defect profile along the loop, which can strongly influence defect dynamics. Here, we propose a geometric description of nematic disclination loops using the Clifford algebra Cl(3,0). This approach naturally captures the geometry of the local defect profile, as well as changes along the loop, which is mathematically a SU(2) holonomy. Simulations of the dynamics of defect loops with specified geometries embedded in nematic liquid crystals demonstrate that loops nucleate the growth of \"topological blobs\" of defects, which later dissipate leaving uniform nematic textures. Self-twist of the defect profile leads to nucleation of additional linking disclination lines, with a simple arithmetic relation between total self-twist and linking number. In contrast, loops with an even number of discrete profile transitions generate patterns with threading between loops, but no linking. These results establish a direct connection between the geometric holonomy of a disclination loop and its subsequent evolution, and may be extendable to more complex order parameter manifolds, such as cholesterics or smectics.", "url": "https://arxiv.org/abs/2605.27297", "type": "理论+数值", "summary": "1. 该工作利用Clifford代数提出向列液晶中向错环的几何描述，并通过数值模拟研究其弛豫动力学。\n2. 卖点在于揭示了环局域缺陷轮廓的SU(2)和乐与演化间的直接关联，包括自扭与环绕数的简单算术关系及拓扑泡的成核与消散。\n3. 这一几何框架可推广至手性向列相或近晶相等更复杂序参量流形，为拓扑缺陷动力学研究提供新视角。", "summary_source": "deepseek", "authors": [{"name": "F. Aprile"}, {"name": "A. J. H. Houston"}, {"name": "G. Gonnella"}, {"name": "D. Marenduzzo"}, {"name": "T. N. Shendruk"}, {"name": "G. Negro"}], "featured_authors": [{"name": "F. Aprile"}, {"name": "A. J. H. Houston"}, {"name": "G. Gonnella"}, {"name": "D. Marenduzzo"}, {"name": "T. N. Shendruk"}, {"name": "G. Negro"}], "author_count": 6}, {"id": "2605.27325", "category": "cond-mat", "title": "Microstructure-Aware Deep Learning Bridges Atomistics to Macroscale for Shock-to-Detonation Prediction", "abstract": "The shock-to-detonation transition in energetic materials is governed by coupled processes spanning Angstroms to millimeters and femtoseconds to microseconds, where traditional multiscale models fail due to the lack of scale separation. We address this grand challenge by directly bridging large-scale molecular dynamics (MD) simulations with continuum finite-element (FE) models using MISTnetX, a convolutional deep neural network. Trained on MD simulations of shock propagation through complex microstructures, MISTnetX captures shock-microstructure interactions, hotspot formation, and the transition to deflagration, supplying critical sub-grid information to FE simulations of mechanics, shocks, thermal transport, and chemistry. Applied to a synthetic but realistic nanostructured plastic-bonded RDX composite, MISTnetX enables parameter-free prediction of the full run-to-detonation transition.", "url": "https://arxiv.org/abs/2605.27325", "type": "理论+数值", "summary": "1. 该工作利用微观结构感知的深度学习网络MISTnetX，将大尺度分子动力学模拟与连续介质有限元模型直接桥接，实现了从原子尺度到宏观尺度的冲击起爆全过程无参数预测。\n2. 核心卖点在于MISTnetX直接从分子动力学训练数据中捕获冲击波与复杂微结构相互作用、热点形成及向爆燃的转变，并为力学、冲击、热输运与化学反应有限元模拟提供关键次网格信息。\n3. 该方法突破了传统多尺度模型缺乏尺度分离的困境，为含能材料中跨越近十个量级时空尺度的冲击起爆问题提供了可推广的计算范式。", "summary_source": "deepseek", "authors": [{"name": "Simon Gonzalez-Zapata"}, {"name": "Aidan Pantoya"}, {"name": "Chunyu Li"}, {"name": "Marisol Koslowski"}, {"name": "Alejandro Strachan"}], "featured_authors": [{"name": "Simon Gonzalez-Zapata"}, {"name": "Aidan Pantoya"}, {"name": "Chunyu Li"}, {"name": "Marisol Koslowski"}, {"name": "Alejandro Strachan"}], "author_count": 5}, {"id": "2605.27368", "category": "cond-mat", "title": "Spontaneous persistent currents and time-reversal symmetry breaking in thick-walled Weyl semimetal cylinders", "abstract": "We theoretically investigate the Aharonov-Bohm effect in a thick-walled Weyl semimetal (WSM) cylinder subject to an external axial magnetic field. By employing a low-energy effective Hamiltonian, we analytically solve the eigenvalue problem for both infinite and finite-length cylindrical geometries. We apply infinite-mass boundary conditions at the radial walls and MIT bag boundary conditions at the cylinder caps to properly account for intra-node confinement and inter-valley scattering, respectively. Our numerical results demonstrate that the spatial separation of the Weyl nodes acts as an internal chiral gauge field. This geometric field intrinsically breaks time-reversal (TR) symmetry, lifting the chiral degeneracy even at zero external flux. This symmetry breaking manifests as spontaneous persistent currents and the unfolding of conductance channels. Furthermore, longitudinal confinement induces propagation-direction-dependent energy splitting, altering the partial density of states and causing spatio-chiral current imbalances.", "url": "https://arxiv.org/abs/2605.27368", "type": "理论+数值", "summary": "1. 该工作从理论上研究了厚壁外尔半金属圆柱在外加轴向磁场中的阿哈罗诺夫-玻姆效应，通过低能有效哈密顿量解析求解无限长与有限长圆柱的能谱。\n2. 关键物理卖点在于空间分离的外尔节点作为内禀手征规范场，本质上破坏时间反演对称性，在零外部磁通下产生自发持续流并展开电导通道。\n3. 这揭示了纵向约束引起的传播方向依赖能量分裂改变部分态密度并导致空间-手征电流失衡，为设计基于手征输运的电子器件提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "J. C. Pérez-Pedraza"}, {"name": "Juan A. Cañas"}, {"name": "Daniel A. Bonilla"}, {"name": "A. Martín-Ruiz"}], "featured_authors": [{"name": "J. C. Pérez-Pedraza"}, {"name": "Juan A. Cañas"}, {"name": "Daniel A. Bonilla"}, {"name": "A. Martín-Ruiz"}], "author_count": 4}, {"id": "2605.26122", "category": "hep-th", "title": "Critical Inter-Horizon Thermal Dynamics on the Lukewarm Reissner-Nordström-de Sitter Manifold", "abstract": "We reinterpret the lukewarm sector of four-dimensional Reissner--Nordström--de Sitter black holes as the exact zero-dissipation thermal manifold of an effective two-horizon nonequilibrium system. In the fixed-charge sector, the inter-horizon thermal affinity controls the entropy production and vanishes precisely on the lukewarm branch. The corresponding linearized thermal mode is governed by an exact relaxation coefficient \\(K_L(\\rho)\\), with \\(\\rho=r_+/r_c\\), and changes stability at the critical ratio \\[ \\rho_*=\\frac{1+\\sqrt{3}-\\sqrt{2}\\,3^{1/4}}{2}\\approx 0.4354, \\] where the relaxation time diverges as \\(\\tau\\sim |\\rho-\\rho_*|^{-1}\\). We then encode this critical structure in a minimal Bragg--Williams functional and an Onsager--Machlup action for the effective trajectories of the thermal mode. In this way, the lukewarm branch is promoted from a geometric equal-temperature locus to a critical inter-horizon thermal manifold.", "url": "https://arxiv.org/abs/2605.26122", "type": "理论", "summary": "1. 该工作将四维Reissner-Nordström-de Sitter黑洞的lukewarm区域重新阐释为两事件视界间非平衡系统的精确零耗散热流形。\n2. 其核心发现是固定电荷扇区中视界间热亲和力精确控制熵产生并在lukewarm分支消失，且线性化热模式在临界比ρ*≈0.4354处弛豫时间发散，该临界结构由最小Bragg-Williams泛函与Onsager-Machlup作用量完整描述。\n3. 这一提升将几何等温线转化为临界热流形，为黑洞热力学与非平衡统计物理交叉提供了新的理论框架，尤其启发了多视界系统临界动力学与弛豫行为的研究。", "summary_source": "deepseek", "authors": [{"name": "J. Khalloufi"}, {"name": "H. El Moumni"}, {"name": "K. Masmar"}], "featured_authors": [{"name": "J. Khalloufi"}, {"name": "H. El Moumni"}, {"name": "K. Masmar"}], "author_count": 3}, {"id": "2605.26124", "category": "hep-th", "title": "Astrophysical environment around a black hole in the braneworld and its optical signatures", "abstract": "We investigate the impact of braneworld theory on the astrophysical environment surrounding a black hole. The black hole is sourced by localized matter from the bulk, which could describe both regular and singular (Schwarzschild) black hole. Employing an Einstein cluster description for the environment, we find that the anisotropic nature of the cluster, coupled with finite brane tension, leads to a weakening of gravity due to the quadratic and nonlocal corrections to the effective four-dimensional field equations. Consequently, this effect prevents horizon formation within the environment. Applying current constraints on the brane tension derived from neutron star observations, we demonstrate that this effect is particularly relevant for sub-stellar mass black holes embedded in compact environments. Furthermore, we investigate the optical signatures of finite brane tension in this scenario, specifically focusing on the black hole shadow and Einstein ring radii. We show that the Einstein ring radius decreases with a smaller brane tension, whereas the black hole shadow radius increases--somewhat contradicts the weakening gravity effects. Ultimately, these two observables may jointly serve to constrain the value of the brane tension in a very specific astrophysical scenarios.", "url": "https://arxiv.org/abs/2605.26124", "type": "理论", "summary": "1. 本文研究膜世界理论中由体局域物质形成的黑洞周围的引力环境，并使用爱因斯坦团模型描述其各向异性介质。\n2. 其核心发现是有限膜张力的二次与非局域修正导致引力减弱，从而阻止视界形成，该效应对亚恒星质量黑洞尤为显著。\n3. 通过分析黑洞阴影与爱因斯坦环半径随膜张力的相反变化趋势，提出联合观测这两个光学特征可有效约束膜张力参数。", "summary_source": "deepseek", "authors": [{"name": "M. F. Fauzi"}, {"name": "A. O. Latief"}, {"name": "A. Sulaksono"}], "featured_authors": [{"name": "M. F. Fauzi"}, {"name": "A. O. Latief"}, {"name": "A. Sulaksono"}], "author_count": 3}, {"id": "2605.26185", "category": "hep-th", "title": "Symmetries of tensionless strings", "abstract": "In a recent article, arXiv:2605.12414 , it is stated that a certain scale transformation has been \"systematically overlooked\" in discussions of the tensionless string. Here we point out that this kind of symmetry is treated in numerous places, in the classical as well as the quantum theory.", "url": "https://arxiv.org/abs/2605.26185", "type": "理论", "summary": "1. 该工作指出，关于无张力弦理论中一类尺度变换对称性此前被系统忽略的论断并不成立。\n2. 其核心在于阐明该对称性在经典与量子理论中已有广泛讨论与处理，并非新发现。\n3. 这为后续无张力弦的对称性研究提供了更全面的文献背景，避免重复劳动。", "summary_source": "deepseek", "authors": [{"name": "Ulf Lindström"}], "featured_authors": [{"name": "Ulf Lindström"}], "author_count": 1}, {"id": "2605.26202", "category": "hep-th", "title": "Fermion Families and Pontryagin Class: Topological Field Theory via Colour Symmetry Extension", "abstract": "Family puzzle asks why the Standard Model (SM) features exactly 3 families of quarks and leptons. Motivated by topological constraints, we study 4-dimensional fermionic anomalies with discrete $Z_n$ symmetry, classified by the 5d spin bordism group. We show that only the group-cohomology subclass H$^5(Z_n,U(1))\\cong Z_n$ can be canceled by an anomalous $Z_n$-symmetric 4d $Z_n$-gauge topological quantum field theory (TQFT), while beyond-group-cohomology $A_{Z_n} p_1$ involving the Pontryagin class $p_1$ cannot (except $n=2,3$). More generally, we prove that any cocycle $\\alpha_d\\in$H$^d(Z_n,U(1))$ in odd spacetime dimension $d\\ge3$ is trivialised by the symmetry extension $1\\to Z_n\\to Z_{n^2}\\to Z_n\\to 1,$ and we construct the corresponding symmetric anomalous boundary TQFT. For $d=5$ and $n=3$, this yields a Spin$\\times Z_3$-symmetric 4d $Z_3$-gauge TQFT that cancels the mixed discrete $(\\bf B+L)$-gauge-gravitational anomaly of the SM in the absence of 3 \"sterile\" right-handed neutrinos $\\nu_R$. We further analyze a generalized SM with $N_c$ colors and $N_f$ families and argue that missing $N_f$ copies of the $\\nu_R$ can be naturally replaced by that 4d anomalous $Spin\\times_{Z_2^F} Z_{2 N_f,{{\\bf B} + {\\bf L}}}$ symmetric $Z_{N_c}$-gauge TQFT under the anomaly cancellation, via an appropriate $Z_{N_c}$-color symmetry extension construction $1\\to Z_{N_c}\\to Spin\\times Z_{N_cN_f}\\to Spin\\times_{Z_2^F} Z_{2N_f}\\to1$ of anomalous topological order. For minimal nonzero positive integers $N_c$ and $N_f$, we find the minimal color extensions: $N_c=3, N_f \\ge 3$; $N_c=4, N_f \\ge 2$; and $N_c=12, N_f \\ge 6$. If we further require that an SM baryon is a fermion so $N_c$ is odd, then $Z_{N_c}=Z($SU$(N_c))$ color center, we prove 3 families and 3 colors, $N_c=N_f=3$, is the unique case that stands out. We also prove that $A_{Z_3}p_1= 0\\mod3$ for the mod 3 cohomology class in an appropriate context.", "url": "https://arxiv.org/abs/2605.26202", "type": "理论", "summary": "1. 该工作利用色对称扩张和庞特里亚金类，构造了消除标准模型反常的边界拓扑量子场论，并解释了费米子家族数目的起源。\n2. 其技术关键是对5d旋量配边群分类的群上同调与超越群上同调子类的区分，证明仅前者能被对称TQFT取消，且通过Z_n→Z_{n^2}扩张可平凡化奇维上循环。\n3. 由此证明在重子为费米子条件下，N_c=N_f=3是唯一满足最小颜色扩张且无额外右手中微子的特殊情形，为家族谜题提供了拓扑约束解答。", "summary_source": "deepseek", "authors": [{"name": "Zheyan Wan"}, {"name": "Juven Wang"}, {"name": "Shing-Tung Yau"}], "featured_authors": [{"name": "Zheyan Wan"}, {"name": "Juven Wang"}, {"name": "Shing-Tung Yau"}], "author_count": 3}, {"id": "2605.26212", "category": "hep-th", "title": "EFTs with Symmetric Moduli Spaces: the Landscape and the Swampland", "abstract": "The Swampland Distance Conjecture (SDC) states that, for any infinite-distance limit in the moduli space of a quantum gravity effective field theory (EFT), there should exist an infinite tower of states that become exponentially light. According to the Emergent String Conjecture, such a tower should consist either of tensionless strings or of Kaluza-Klein modes, each with a mass-decay rate that depends in a precise way on the dimension of the effective field theory. In this paper, we use the results obtained in arXiv:2508.18401 on the SDC for symmetric moduli spaces and how these rates are encoded in the weight polytope of the corresponding particle-state representations to determine the symmetric space EFTs and representations that have these decay rates. Remarkably, assuming that the particle states transform in an irreducible representation, the list of possible polytopes and moduli spaces is finite. Different EFTs are related by embedding one moduli space in another or by taking a decompactification limit. Requiring compatibility of the particle representations under such branching, we find that, while most of the theories can be obtained from an EFT based on $E_{8(8)}$, there remain three in our list that appear to be impossible to get from M- or string-theory compactifications. Using the same embedding procedure, we also identify the string and brane representations that should be present in the spectrum.", "url": "https://arxiv.org/abs/2605.26212", "type": "理论", "summary": "1. 该工作利用对称模空间中的沼泽地距离猜想，通过权多面体对有效场论及粒子表示的衰变率进行分类。\n2. 其核心在于发现嵌入与解紧致化分支下理论列表有限，且大部分可溯源于基于E8(8)的有效场论。\n3. 这为鉴别无法从M/弦理论紧致化得到的候选沼泽地理论及完整粒子谱提供了明确判据。", "summary_source": "deepseek", "authors": [{"name": "Stephanie Baines"}, {"name": "Veronica Collazuol"}, {"name": "Bernardo Fraiman"}, {"name": "Mariana Graña"}, {"name": "Daniel Waldram"}], "featured_authors": [{"name": "Stephanie Baines"}, {"name": "Veronica Collazuol"}, {"name": "Bernardo Fraiman"}, {"name": "Mariana Graña"}, {"name": "Daniel Waldram"}], "author_count": 5}, {"id": "2605.26224", "category": "hep-th", "title": "$S$-duality, boundary states, and higher-form symmetries on ALE spaces", "abstract": "We study Abelian $S$-duality of Maxwell theory on $A$-type asymptotically locally Euclidean (ALE) spaces. Unlike on closed four-manifolds, the Maxwell path integral on an ALE space is not naturally a scalar partition function. Rather, it decomposes into theta-function blocks labeled by flat $U(1)$ holonomy sectors on the asymptotic lens-space boundary. We interpret these blocks as components of the Hilbert-space boundary state prepared by the ALE path integral. With this interpretation, the apparent failure of ordinary modularity is replaced by vector-valued modular covariance under the action of the modular group. We test this picture explicitly for Eguchi-Hanson space by gluing it to its orientation reversal. The resulting close
