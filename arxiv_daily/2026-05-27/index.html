d four-manifold is diffeomorphic to $S^2\\times S^2$, and the natural pairing of the two ALE boundary states reproduces the standard Maxwell partition function on $S^2\\times S^2$. We then refine the construction by turning on electric and magnetic $1$-form symmetry backgrounds. In their presence, the ALE theta blocks are not ordinary functions, but sections of a line bundle over the Cartan torus associated with the $A_{N-1}$ root lattice, reflecting the mixed electric-magnetic $1$-form anomaly. We also discuss gauging discrete $\\mathbb Z_k$ subgroups of the $1$-form symmetries and show that the vector-valued boundary-state structure remains the natural covariant framework after gauging. In this sense, ALE spaces behave as chiral building blocks for four-dimensional Maxwell theory: individual ALE blocks carry sector-resolved boundary data, while gluing pairs these sectors to produce an ordinary closed-manifold partition function, much like the pairing of left- and right-moving conformal blocks in two-dimensional CFT.", "url": "https://arxiv.org/abs/2605.26224", "type": "理论", "summary": "1. 该工作研究了A型渐近局部欧几里得空间上的阿贝尔S-对偶性，揭示Maxwell路径积分分解为以平坦U(1)和乐扇区标记的theta函数块。\n2. 其核心在于将这些块解释为希尔伯特空间边界态，从而将普通模性失效替换为模群的向量值模协变性，并在Eguchi-Hanson空间上通过配对得到显式验证。\n3. 这为四维Maxwell理论提供了手征积木块解释，通过配对产生闭流形配分函数，为处理高阶形式对称性、混合反常及离散规范子群提供了统一框架。", "summary_source": "deepseek", "authors": [{"name": "Mohamed M. Anber"}], "featured_authors": [{"name": "Mohamed M. Anber"}], "author_count": 1}, {"id": "2605.26250", "category": "hep-th", "title": "Krylov Complexity in Periodically Driven CFTs and Critical Fermions", "abstract": "We study Krylov construction in periodically driven conformal field theories and their lattice realisations via critical fermions. Two types of driving are considered: a square-wave drive and a continuous sinusoidal drive. Using the Arnoldi construction, we examine Arnoldi coefficients and return amplitudes in periodically driven conformal field theories in the heating and non-heating phases. In the heating phase, the Arnoldi coefficients approach unity exponentially; in contrast, in the non-heating phase, they exhibit oscillatory behaviour. For the lattice realisations, we further analyse the Krylov complexity of the correlation matrix, quasi energy level statistics, and the graph structure induced by the Floquet operator. Although the two drives exhibit similar Krylov growth on the CFT side, their lattice realisations exhibit markedly different spectral and graph signatures, indicating distinct mechanisms governing the transition between the heating and non-heating phases.", "url": "https://arxiv.org/abs/2605.26250", "type": "理论", "summary": "1. 该工作运用Krylov构造与Arnoldi迭代对周期性驱动共形场论及临界费米子晶格模型中的复杂度展开研究，考虑方波与正弦波两种驱动形式。\n2. 在加热相中Arnoldi系数指数趋近于1，非加热相则呈现振荡行为；尽管CFT侧Krylov复杂度增长相似，晶格实现在准能级统计、关联矩阵Krylov复杂度及Floquet算子图结构上展现出截然不同的特征，指示加热相变由不同微观机制主导。\n3. 这为利用Krylov复杂度与Arnoldi系数作为探针诊断Floquet系统中的加热-非加热相变提供了理论依据，并强调了连续场论近似与离散晶格物理之间可能存在的本质差异。", "summary_source": "deepseek", "authors": [{"name": "Ankit Gill"}, {"name": "Anurag Sarkar"}], "featured_authors": [{"name": "Ankit Gill"}, {"name": "Anurag Sarkar"}], "author_count": 2}, {"id": "2605.26360", "category": "hep-th", "title": "Torsional black holes and wormholes in Einstein-Cartan-Maxwell gravity with a conformal scalar field", "abstract": "We formulate a one-parameter extension of Weyl transformations in first-order gravity and show that it defines a conformally coupled scalar sector with dynamical torsion. The construction reduces to the standard torsionless conformal coupling in the limit $\\lambda\\to 1$. In the corresponding Einstein-Cartan-Maxwell theory, we derive exact static solutions in asymptotically flat and asymptotically locally AdS spacetimes. These solutions describe scalar-dressed black holes, regular black holes, and traversable wormholes, depending on the values of the integration constants and of the deformation parameter. We show that torsion can regularize the scalar field and, for suitable branches, also improve the geometric singularity structure. In the AdS sector, the existence of topological black holes requires a nonvanishing electric charge. These results provide new exact examples of regular and torsional configurations in four-dimensional gravity.", "url": "https://arxiv.org/abs/2605.26360", "type": "理论", "summary": "1. 该工作在第一性引力中提出Weyl变换的单参数扩展，并导出爱因斯坦-卡尔坦-麦克斯韦理论中带共形标量场的精确静态解，涵盖扭转黑洞、规则黑洞与可穿越虫洞。\n2. 其核心卖点在于揭示动态扭转可正则化标量场并改善几何奇点结构，且在渐近局部AdS扇区中证实拓扑黑洞需要非零电荷。\n3. 这些结果为四维引力中规则与扭转构型提供新精确范例，可启发后续对黑洞奇点规避及虫洞可穿越性的理论探索。", "summary_source": "deepseek", "authors": [{"name": "Luis Avilés"}, {"name": "Omar Valdivia"}, {"name": "Rodolfo Véliz"}, {"name": "Carlos Vera"}], "featured_authors": [{"name": "Luis Avilés"}, {"name": "Omar Valdivia"}, {"name": "Rodolfo Véliz"}, {"name": "Carlos Vera"}], "author_count": 4}, {"id": "2605.26617", "category": "hep-th", "title": "On a mixed-state extension of the holographic signal inequality", "abstract": "A novel inequality was proposed in \\cite{Balasubramanian:2025hxg} for tripartite holographic states, using which it was argued, that purely GHZ-like tripartite entanglement is not allowed in holography. In this short note, we generalize this inequality to mixed states by canonical purification following \\cite{Yuan:2024yfg} and exhibit a class of holographic geometries that violate this generalized inequality. We argue that the analogous mixed-state extension for four parties fails for the same reason. Finally, we conjecture a new inequality for tripartite holographic states and give supporting evidence.", "url": "https://arxiv.org/abs/2605.26617", "type": "理论", "summary": "1. 该工作通过规范纯化将三体全息信号不等式推广至混合态，并构造了违反该不等式的全息几何实例。\n2. 主要技术卖点在于揭示全息混合态中GHZ类纠缠的约束机制，以及四体类似扩展因相同原因失效。\n3. 这为全息纠缠结构中混合态不等式的进一步研究提供了方向，所猜测的新不等式有待验证。", "summary_source": "deepseek", "authors": [{"name": "Joydeep Naskar"}], "featured_authors": [{"name": "Joydeep Naskar"}], "author_count": 1}, {"id": "2605.26706", "category": "hep-th", "title": "Nonlinear Breit-Wheeler Process Driven by Intense Squeezed Light", "abstract": "The nonlinear Breit-Wheeler process is a fundamental phenomenon of strong-field quantum electrodynamics and is usually studied for classically prescribed laser backgrounds. Here we examine how the statistical properties of a squeezed coherent driving field modify nonlinear Breit-Wheeler pair production. Using a polarization-resolved Monte Carlo framework with stochastic averaging over the field-amplitude distribution derived from the Husimi Q-function, we simulate collisions of gamma photons with squeezed light and identify clear source-state-dependent modifications of the pair production signal. These effects include the smoothing of harmonic structure, the enhancement of higher-order multiphoton channels, and the suppression of the single-laser-photon absorption channel when stronger-field realizations raise the dressed-mass threshold. Within the selected spectral window, the degree of positron polarization increases monotonically with the squeezing parameter, while the angular distributions broaden as the statistical weight of larger field amplitudes increases. Our results show that, even at fixed mean electric-field amplitude, the statistical fluctuations inherent to the squeezed coherent state can substantially reshape spectral, angular, and spin-resolved observables in strong-field pair production. These findings illustrate a direct link between source-state-dependent field statistics and strong-field pair production observables, and provide a theoretical framework for studying how squeezed-state preparation of the driving field can influence high-energy QED processes.", "url": "https://arxiv.org/abs/2605.26706", "type": "理论", "summary": "1. 本工作基于Husimi Q函数导出场振幅分布，发展偏振分辨蒙特卡洛框架模拟压缩相干光驱动的非线性Breit-Wheeler对产生过程。\n2. 其核心卖点在于揭示即使固定平均场强，压缩态固有振幅统计涨落仍可重塑正电子能谱、角分布与极化度，包括谐波平滑、高阶多光子通道增强及单光子吸收抑制。\n3. 这建立了驱动场量子态统计与强场QED可观测量的直接关联，为利用压缩光操控高能对产生过程提供了理论与模拟基础。", "summary_source": "deepseek", "authors": [{"name": "Xin Ge"}, {"name": "Kai-Hong Zhuang"}, {"name": "Pei-Lun He"}, {"name": "Yue-Yue Chen"}], "featured_authors": [{"name": "Xin Ge"}, {"name": "Kai-Hong Zhuang"}, {"name": "Pei-Lun He"}, {"name": "Yue-Yue Chen"}], "author_count": 4}, {"id": "2605.26743", "category": "hep-th", "title": "Thermal Casimir Effect in A Schwarzschild-like Wormhole Spacetime", "abstract": "We study the finite-temperature Casimir effect for a massless scalar field confined between two parallel plates in a Schwarzschild-like wormhole spacetime. Imposing Dirichlet boundary conditions, we compute the renormalized Casimir free energy in the comoving frame. We find that the thermal correction to the renormalized Casimir free energy decreases gradually with the temperature and becomes independent of the background geometry in this frame. Thermodynamic quantities derived from the Casimir free energy, namely, the renormalized Casimir entropy, internal energy, and heat capacity at constant volume, exhibit distinct temperature dependence. At low temperatures, all thermodynamic quantities recover the expected behavior, consistent with the fundamental laws of thermodynamics. These results provide a compact framework for analyzing quantum vacuum forces in gravitational backgrounds.", "url": "https://arxiv.org/abs/2605.26743", "type": "理论", "summary": "1. 该工作研究了施瓦西型虫洞时空中两平行板间标量场的有限温度卡西米尔效应，计算了重整化自由能。\n2. 关键在于发现热修正随温度递减且在共动系中与背景几何无关，导出的热力学量呈现明确温度依赖。\n3. 这为在引力背景下分析量子真空力提供了紧凑框架，且低温恢复热力学基本定律行为。", "summary_source": "deepseek", "authors": [{"name": "Arista Romadani"}, {"name": "Apriadi Salim Adam"}, {"name": "Ar Rohim"}, {"name": "Bintoro Anang Subagyo"}, {"name": "Agus Purwanto"}], "featured_authors": [{"name": "Arista Romadani"}, {"name": "Apriadi Salim Adam"}, {"name": "Ar Rohim"}, {"name": "Bintoro Anang Subagyo"}, {"name": "Agus Purwanto"}], "author_count": 5}, {"id": "2605.26822", "category": "hep-th", "title": "Null Strings Gauged and Reloaded, II: Consistent Classical Treatment of the Null Strings", "abstract": "We observed that the null strings, tensionless strings with Carrollian worldsheets, exhibit an extra gauge symmetry, \\textit{Carroll-Weyl} gauge symmetry, which cannot be obtained from ultra-relativistic Carrollian limit of tensile strings. Due to the existence of this symmetry, the BMS$_3$ algebra of constraints, which is obtained as the Carrollian limit of two Virasoro algebras of the standard tensile strings, should be replaced with an BMS$_3$ algebra extended by a weight one operator. To establish further the existence and necessity of the Carroll-Weyl gauge symmetry, we carefully work through Hamiltonian analyses of constrained/gauged systems. We also discuss the extended BMS$_3$ algebra of constraints.", "url": "https://arxiv.org/abs/2605.26822", "type": "理论", "summary": "1. 文章通过约束系统哈密顿分析，严格确立了无张力弦（卡罗尔世界面）存在额外Carroll-Weyl规范对称性，且该对称性无法从有张力弦的超相对论极限导出。\n2. 核心技术在于证明该对称性迫使约束代数从标准BMS₃代数（两个维拉宿代数卡罗尔极限）替换为包含权重1算子的扩展BMS₃代数，从而根本改变约束结构。\n3. 这为无张力弦经典动力学提供了自洽哈密顿描述，并为BMS对称性延伸及卡罗尔几何规范理论建立关键代数框架。", "summary_source": "deepseek", "authors": [{"name": "M.M. Sheikh-Jabbari"}, {"name": "H. Yavartanoo"}], "featured_authors": [{"name": "M.M. Sheikh-Jabbari"}, {"name": "H. Yavartanoo"}], "author_count": 2}, {"id": "2605.26829", "category": "hep-th", "title": "A universal geometric mechanism for chaos-bound violations in black hole spacetimes", "abstract": "Violation of the Maldacena-Shenker-Stanford (MSS) chaos bound has been observed in various black hole spacetimes, but its physical origin remains unclear. In particular, it is uncertain whether these violations arise from modifications of general relativity or reflect a more fundamental feature of black hole spacetimes. In this work, we systematically investigate the instability of circular geodesics across a broad class of black hole solutions in Einstein, scalar-tensor, and higher-curvature gravity. We show that the violations are governed by the relative behavior of unstable circular orbits and the horizon structure in near-extremal regimes. When the relevant orbit remains outside the horizon as the surface gravity vanishes, the instability scale persists, and the chaos bound can be violated. On the other hand, as the orbit approaches the degenerate horizon, the instability becomes suppressed by the associated divergent gravitational time dilation, ultimately leading to saturation of the bound. Motivated by these results, we propose a geometric conjecture that determines the applicability of the MSS bound directly from the photon-sphere and horizon structure of the spacetime. Our findings identify a universal geometric criterion that governs the applicability of the MSS bound in black hole spacetimes, revealing a fundamental constraint on extending the quantum chaos bound to classical gravitational settings.", "url": "https://arxiv.org/abs/2605.26829", "type": "理论", "summary": "1. 该工作系统研究了爱因斯坦、标量-张量及高曲率引力中黑洞的圆测地线不稳定性，以阐明MSS混沌界违反的物理起源。\n2. 其技术核心是揭示不稳定圆轨道与近极端视界结构的相对行为主导违反：轨道留在视界外时不稳定性持续使界可破，轨道趋近退化视界时时间膨胀抑制不稳定性导致界饱和。\n3. 这提出普适几何准则——由光子球与视界结构直接判定MSS界的适用性，为量子混沌界向经典引力扩展提供了根本约束。", "summary_source": "deepseek", "authors": [{"name": "Terkaa Victor Targema"}, {"name": "Kazuharu Bamba"}, {"name": "Usman Zafar"}], "featured_authors": [{"name": "Terkaa Victor Targema"}, {"name": "Kazuharu Bamba"}, {"name": "Usman Zafar"}], "author_count": 3}, {"id": "2605.26853", "category": "hep-th", "title": "A reparametrization invariant nonabelian surface holonomy", "abstract": "We introduce a nonabelian surface holonomy that is constructed from a one-form gauge potential that takes values in a loop algebra of the $U(N)$ gauge group. The surface holonomy parallel transports a nonabelian string. Although it is not manifest in our formulation, we will see that our nonabelian surface holonomy is invariant under reparametrizations of the surface.", "url": "https://arxiv.org/abs/2605.26853", "type": "理论", "summary": "1. 该工作从取值于U(N)环代数的一形式规范势出发，构造了一个非阿贝尔曲面和乐。\n2. 其技术核心在于该和乐实现非阿贝尔弦的平行输运，且虽不显式但保持曲面重参数化不变性。\n3. 这为规范场论中非阿贝尔扩展对象的几何与拓扑性质研究提供了新的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Dongsu Bak"}, {"name": "Andreas Gustavsson"}], "featured_authors": [{"name": "Dongsu Bak"}, {"name": "Andreas Gustavsson"}], "author_count": 2}, {"id": "2605.26892", "category": "hep-th", "title": "Constrained Symplectic Quantization II: The Free Scalar Field", "abstract": "Constrained symplectic quantization is a functional formulation of quantum field theory in which quantum fluctuations are sampled through a deterministic Hamiltonian flow in an auxiliary intrinsic time $\\tau$. In this paper we extend the quantum-mechanical framework introduced in [1] to a relativistic scalar quantum field theory in Minkowski space-time. The construction is based on the analytic continuation of fields and action from $\\mathbb{R}$ to $\\mathbb{C}$ together with constraints that select stable intrinsic-time trajectories and, at the same time, define convergent integration cycles for the corresponding microcanonical functional. We show that, in the continuum limit, the microcanonical generating functional reproduces the Feynman generating functional. For the free scalar field in $1+1$ dimensions we derive the constrained equations of motion, implement the resulting dynamics numerically, and verify real-time two-point correlators, equal-time commutator relations, and Dyson--Schwinger equations including the expected contact terms.", "url": "https://arxiv.org/abs/2605.26892", "type": "理论", "summary": "1. 本文将约束辛量子化框架从量子力学推广至闵氏时空中的相对论性标量量子场论。\n2. 技术核心是借助场及作用量的复解析延拓与约束条件，选取稳定的本征时间轨迹并定义收敛的微正则泛函积分。\n3. 数值验证了连续极限下自由标量场的实时两点关联函数、等时对易关系及含接触项的Dyson-Schwinger方程，为实时间量子场论提供确定性哈密顿采样路径。", "summary_source": "deepseek", "authors": [{"name": "Francesco Scardino"}, {"name": "Martina Giachello"}, {"name": "Giacomo Gradenigo"}], "featured_authors": [{"name": "Francesco Scardino"}, {"name": "Martina Giachello"}, {"name": "Giacomo Gradenigo"}], "author_count": 3}, {"id": "2605.27070", "category": "hep-th", "title": "Geometrically constrained multi-kink configurations in generalized impurity-doped field theories", "abstract": "This short communication investigates impurity coupling in generalized field theories where scalar coupling is introduced directly at the level of the kinetic and gradient contributions of the energy. We show that the fundamental aspects of the original theory, which has been previously investigated in the impurity-free setting, can be extended to the inhomogeneous scenario. In particular, an interpretation in terms of geometrically-constrained effective one-field theories with impurities is possible in the separable case. We show that BPS multi-kink configurations are possible in the model, as well as in the usual half-BPS scalar theories.", "url": "https://arxiv.org/abs/2605.27070", "type": "理论", "summary": "1. 本文研究广义杂质掺杂场论中通过动能和梯度项直接引入标量耦合所导致的多kink构型。\n2. 其核心卖点在于揭示了可分离情形下杂质诱导的几何约束有效单场理论，并证明BPS多kink解的存在性。\n3. 这为不均匀背景中场论中拓扑孤子的构造与分类提供了明确的理论框架与推广路径。", "summary_source": "deepseek", "authors": [{"name": "D. Bazeia"}, {"name": "M. A. Liao"}, {"name": "M.A. Marques"}], "featured_authors": [{"name": "D. Bazeia"}, {"name": "M. A. Liao"}, {"name": "M.A. Marques"}], "author_count": 3}, {"id": "2605.27206", "category": "hep-th", "title": "Structure of $\\mathcal{N} = 2$ superfield higher-spin abelian cubic interactions", "abstract": "In this article we study the structure of the $\\mathcal{N}=2$ abelian higher-spin cubic $(\\mathbf{s_1}, \\mathbf{s_2}, \\mathbf{s_2})$ vertices and the corresponding $\\mathcal{N}=2$ higher-spin supercurrents, introduced in arXiv:2408.00668 . These interactions are possible only for $\\mathbf{s_1} \\geq 2 \\mathbf{s_2}$. Conserved supercurrents are constructed as descendants of the \\textit{principal supercurrent}, which is uniquely characterized by simple differential conditions and admits an explicit representation in terms of $\\mathcal{N}=2$ higher-spin super-Weyl tensors. We derive the analytic form of the abelian vertices and identify the corresponding analytic higher-spin $\\mathcal{N}=2$ supercurrents. We show that the vertex structure is fully determined by the analytic supercurrents $J^{++}_{\\alpha(s-1)\\dot{\\alpha}(s-1)}$, $J^+_{\\alpha(s-1)\\dot{\\alpha}(s-2)}$, and $\\bar{J}^+_{\\alpha(s-2)\\dot{\\alpha}(s-1)}$. The analytic form of the vertices provides a simple framework for analyzing their component structure. As an example, we explore the component content of such interactions on the Bel--Robinson diagonal. Using the superfield inverse Noether procedure, we study higher-spin gauge transformations for the $\\mathcal{N}=2$ vector multiplet associated with the $(\\mathbf{s}, \\mathbf{1}, \\mathbf{1})$ interaction. In the rigid limit, for odd $\\mathbf{s}$ these transformations reduce to the $\\mathcal{N}=2$ superspace generalization of zilch-type higher-spin symmetries.", "url": "https://arxiv.org/abs/2605.27206", "type": "理论", "summary": "1. 该工作系统研究了N=2阿贝尔高阶自旋三次顶点(s1,s2,s2)的结构，构造了相应的守恒超流并导出了顶点解析形式。\n2. 其核心在于通过主超流和解析超流J^{++}、J^+等唯一确定顶点，并利用超场逆Noether程序将规范变换与zilch型超对称性关联。\n3. 这为N=2超场中高阶自旋相互作用的分类及规范对称性分析提供了统一框架，可启发非阿贝尔推广和分量内容的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Nikita Zaigraev"}], "featured_authors": [{"name": "Nikita Zaigraev"}], "author_count": 1}, {"id": "2605.27256", "category": "hep-th", "title": "Thermal conformal partial waves from flat-space and defect CFT", "abstract": "We establish a correspondence between conformal partial waves on flat, thermal, and defect backgrounds using the shadow formalism. We demonstrate that scalar one-point thermal blocks can be systematically obtained from their four-point flat-space and two-point defect counterparts by considering specific operator configurations. This framework allows us to derive the thermal Casimir equation as a diagonal reduction of the flat-space Casimir system without introducing chemical potentials. We further show that defect two-point blocks with a spin-$l$ exchange operator correspond to thermal one-point blocks for an external spin-$l$ operator.", "url": "https://arxiv.org/abs/2605.27256", "type": "理论", "summary": "1. 该工作利用shadow形式主义建立了平坦时空、热场及缺陷背景中共形部分波之间的对应关系。\n2. 其技术核心在于通过特定算子构型，从平坦四点块与缺陷两点块系统导出热Casimir方程，且无需引入化学势。\n3. 这为热共形场论与缺陷共形场论的统一框架提供了明确启发，并可推广至非零化学势或高阶自旋系统。", "summary_source": "deepseek", "authors": [{"name": "K.B. Alkalaev"}, {"name": "Semyon Mandrygin"}, {"name": "Vladimir Samsonov"}], "featured_authors": [{"name": "K.B. Alkalaev"}, {"name": "Semyon Mandrygin"}, {"name": "Vladimir Samsonov"}], "author_count": 3}, {"id": "2605.27359", "category": "hep-th", "title": "Wilson coefficients from a non-renormalization theorem in 2D SYM", "abstract": "Matrix string theory ( arXiv:hep-th/9703030 , arXiv:hep-th/9701025 , arXiv:hep-th/9710009 ) is a conjectured duality between two-dimensional maximally supersymmetric $U(N)$ Yang-Mills theory and type-IIA string theory in ten-dimensional Minkowski spacetime. The IR description of this gauge theory is governed by the symmetric product orbifold $(\\mathbb{R}^8)^N/S_N$ CFT. The leading irrelevant deformation from this IR fixed point is the Dijkgraaf-Verlinde-Verlinde operator, which comes with an unknown Wilson coefficient. We determine this coefficient using non-renormalization arguments from the UV gauge theory. The result is consistent with the matrix string theory conjecture and gives a first-principles check of the relation between $g_{\\rm YM}$ and the string coupling. We also comment on the prospects for fixing further Wilson coefficients using similar methods.", "url": "https://arxiv.org/abs/2605.27359", "type": "理论", "summary": "1. 该工作利用二维最大超对称杨-米尔斯理论中的非重整化定理，确定了红外对称乘积轨形CFT主导不可约微扰算符的Wilson系数。\n2. 其核心在于从紫外规范理论出发，通过非重整化论证严格得到该系数，避免了直接处理红外强耦合区间，且结果与矩阵弦理论中杨-米尔斯耦合与弦耦合常数的关系自洽。\n3. 这为从第一性原理检验弦理论对偶提供了精确约束，并暗示类似方法可拓展至更高阶Wilson系数的确定。", "summary_source": "deepseek", "authors": [{"name": "Kabir Bajaj"}], "featured_authors": [{"name": "Kabir Bajaj"}], "author_count": 1}, {"id": "2605.26410", "category": "math-ph", "title": "Generalized Minkowski Theorem for Tetrahedra in ${\\rm dS}^3$ and ${\\rm AdS}^3$", "abstract": "We formulate and prove a constant-curvature, holonomy-valued Lorentzian analogue of Minkowski theorem for generalized tetrahedra in the constant-curvature Lorentzian spaces ${\\rm dS}^3$ and ${\\rm AdS}^3$. Four non-trivial based ${\\rm SO}^+(1,2)$ holonomies, or equivalently ${\\rm SL}(2,\\mathbb{R})$ spin lifts, determine intrinsic face normals, a dihedral Gram matrix $G$, and oriented triple products of intrinsic face normals. Under closure, nondegeneracy, and the outward convex branch condition, these data reconstruct a unique strictly convex tetrahedron up to ambient isometry. The sign of $\\det G$ selects the de Sitter or anti-de Sitter model, and the prescribed holonomies are exactly the based Levi-Civita face holonomies of the reconstructed tetrahedron. The extrinsic face normals also define a polar-dual projective tetrahedron. In particular, the all-null AdS sector gives ideal dual tetrahedra, and the all-timelike AdS sector gives hyperideal dual tetrahedra. In the all-spacelike sector, changing to ${\\rm SU}(2)$ real form recovers the reconstruction theorem for Euclidean spherical and hyperbolic tetrahedra.", "url": "https://arxiv.org/abs/2605.26410", "type": "理论", "summary": "1. 该工作将Minkowski定理推广到常曲率洛伦兹空间dS3和AdS3，通过四个非平凡基于SO+(1,2)完整（SL(2,R)自旋提升）唯一重构广义四面体至等距同构，并定义极对偶投影四面体。\n2. 其技术核心在于闭包、非退化及外向凸支条件下，由内禀面法向与Gram矩阵G决定几何，det G符号选择时空模型，全类空扇区经SU(2)实形式回归欧几里得与双曲情形，全零面和全时限AdS扇区分别给出理想与超理想对偶四面体。\n3. 这严格化了常曲率洛伦兹时空离散几何重构，为量子引力中四面体数据构造及双曲几何联系提供了统一框架。", "summary_source": "deepseek", "authors": [{"name": "Hongguang Liu"}, {"name": "Qiaoyin Pan"}], "featured_authors": [{"name": "Hongguang Liu"}, {"name": "Qiaoyin Pan"}], "author_count": 2}, {"id": "2605.26773", "category": "math-ph", "title": "Laplace's law for sharp and diffuse interfaces", "abstract": "We study both diffuse and sharp liquid-vapor interfaces. The equilibrium equation of fluids is derived by using the principle of virtual work in a domain including the interfaces. For diffuse interfaces, the surface tension coefficient depends on the density profile across the interface. For sharp interfaces, the liquid-vapor layer is mathematically represented by a geometric surface and its specific energy is a Dirac delta function at the surface. We compare the both approaches and find relations between the surface tension coefficient and parameters of the models.", "url": "https://arxiv.org/abs/2605.26773", "type": "理论", "summary": "1. 该工作基于虚功原理在包含界面的区域中推导流体平衡方程，系统比较了弥散与尖锐两种液-汽界面模型的描述。\n2. 其关键贡献在于阐明弥散界面表面张力系数与密度剖面的依赖关系，以及尖锐界面表面能量作为狄拉克δ函数的几何表征，并给出了两模型参数间的映射。\n3. 这一理论框架为统一理解界面张力与界面结构的关系提供了定量桥梁，可用于推广至其他复杂相界系统的Laplace定律分析。", "summary_source": "deepseek", "authors": [{"name": "Sergey L. Gavrilyuk"}, {"name": "Henri Gouin"}], "featured_authors": [{"name": "Sergey L. Gavrilyuk"}, {"name": "Henri Gouin"}], "author_count": 2}, {"id": "2605.26946", "category": "math-ph", "title": "Partial theta-series and branching rules for the $\\sl(3)$ parabolic Verma modules", "abstract": "The monodromy of the $\\sl(3)$ Casimir flat connection around root hyperplanes is studied. For the computation of the traces of the root monodromy operators, acting on the parabolic Verma modules, we deduce branching rules w.r.t. the corresponding root $\\sl(2)$ subalgebras. We show that the traces of the monodromy operators are partial theta functions of special type.", "url": "https://arxiv.org/abs/2605.26946", "type": "理论", "summary": "1. 该工作研究了sl(3) Casimir平坦联络在根超平面上的单值性及其对抛物Verma模的作用。\n2. 通过推导关于根sl(2)子代数的分支规则，将根单值算子的迹刻画为特殊的部分theta级数。\n3. 这为利用部分theta函数研究李代数表示论中的单值性结构提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Dotsenko Egor"}], "featured_authors": [{"name": "Dotsenko Egor"}], "author_count": 1}, {"id": "2605.27198", "category": "math-ph", "title": "Bounds on relative modular Hamiltonians in general QFT", "abstract": "The relative entropy between two states is a key concept in quantum information theory and quantum field theory. In the setting of quantum field theory, its computation requires the handling of relative modular Hamiltonians, which are typically very difficult to compute explicitly. In this paper, we exploit locality properties of general algebraic QFTs to estimate relative modular Hamiltonians between two states, $\\omega$ and $\\tilde{\\omega}$, and hence also their relative entropy, in terms of the modular Hamiltonian of a reference state $\\hat{\\omega}$, which might be better understood. For suitable pairs of states we can estimate the relative modular Hamiltonian for the algebra of a region $V_2$ from above, resp. from below, in terms of the modular Hamiltonian of $\\hat{\\omega}$ on a larger region $V_3$, resp. a smaller region $V_1$. Pairs of states and choices of regions which are susceptible to our scheme are related to the presence of superluminal signalling in the sense of Sorkin's paradox. If $\\omega=\\hat{\\omega}$, then there exists a unitary that maps $\\omega$ to $\\tilde{\\omega}$ on $V_3$ and that does not allow superluminal signalling from the spacelike complement $V_3'$ to $V_2$, resp. from $V_1$ to $V_2'$, if our upper, resp. lower, bound applies. To investigate the strength of our estimates we consider coherent states for CCR systems, focussing particularly on free scalar fields. Our estimates apply even if the relative modular Hamiltonian cannot be computed exactly. For sufficiently regular excitations we recover an exact result by squeezing. Our method thus yields an independent proof for the relative entropy formula in cases where the relative modular Hamiltonian cannot be computed exactly. For massless fields we establish the analogous result also for double cone regions. These results indicate that our estimates do not lose too much information.", "url": "https://arxiv.org/abs/2605.27198", "type": "理论", "summary": "1. 该工作利用一般代数量子场论的局域性，通过参考态的模哈密顿量给出两态间相对模哈密顿量在特定区域上的上下界估计，从而约束相对熵。\n2. 其卖点在于将上下界与Sorkin悖论中的超光速信号存在性直接关联，并在自由标量场相干态及无质量场双锥区域中验证了估计在无法精确计算时仍可恢复严格结果。\n3. 这为代数QFT中相对熵的近似计算提供了通用框架，尤其适用于相对模哈密顿量未知的情形，并为高能理论中此类估计的广泛应用奠定了独立证明基础。", "summary_source": "deepseek", "authors": [{"name": "Adriano Chialastri"}, {"name": "Christoph Minz"}, {"name": "Ko Sanders"}], "featured_authors": [{"name": "Adriano Chialastri"}, {"name": "Christoph Minz"}, {"name": "Ko Sanders"}], "author_count": 3}, {"id": "2605.26205", "category": "quant-ph", "title": "Exact strong zero modes are generic in integrable spin systems with large anisotropy", "abstract": "Strong zero modes (SZMs) are edge-localized operators that commute with the Hamiltonian up to corrections exponentially small in system size, yielding anomalously long edge coherence times. In some settings, notably certain integrable models, this commutator can be made to vanish exactly at finite size, defining an exact SZM (ESZM). Existing ESZM constructions in the integrable setting, however, have proceeded model by model and have not been unified into a common framework. Here, I show that ESZMs arise generically in a broad family of integrable spin models with anisotropic interactions. Their existence follows from two algebraic properties of the underlying R- and K-matrices -- quasi-periodicity in the spectral parameter and tracelessness, respectively -- providing a uniform, model-independent mechanism. The framework recovers the known ESZM in XXZ chain and its higher-spin generalizations as special cases and predicts ESZMs in previously unrecognized models.", "url": "https://arxiv.org/abs/2605.26205", "type": "理论", "summary": "1. 该工作证明，在具有强各向异性的可积自旋系统中，精确强零模（ESZM）是普遍存在的，而非仅出现在个别模型。\n2. 其统一机制基于R-矩阵的谱参数拟周期性和K-矩阵的无迹性，为ESZM的存在提供了模型无关的代数判据。\n3. 该框架不仅统一了已知ESZM特例，还预言了新的实现平台，为拓扑量子存储与长寿命边缘相干性的设计提供了代数指导。", "summary_source": "deepseek", "authors": [{"name": "Sascha Gehrmann"}], "featured_authors": [{"name": "Sascha Gehrmann"}], "author_count": 1}, {"id": "2605.26215", "category": "quant-ph", "title": "Universal Bound for Entanglement Generation", "abstract": "We derive a universal condition for entanglement generation under general bilinear interactions in the presence of white thermal noise. While various protocols have been proposed to enhance the amount of generated entanglement, it remains unclear whether they can also relax the threshold for entanglement generation itself. Using a Gorini-Kossakowski-Sudarshan-Lindblad description, we analyze general multimode systems and derive a separability-preserving condition for bilinear interactions under white thermal noise. As an application to gravity-induced entanglement, we show that the gravitational interaction must dominate over thermal noise for entanglement to arise. In particular, this bound cannot be relaxed by changing the initial state or by introducing mediator systems, although such ingredients may enhance the amount of entanglement once it is generated. These results establish a general limitation on entanglement-generation protocols in thermal environments.", "url": "https://arxiv.org/abs/2605.26215", "type": "理论", "summary": "1. 该工作基于Gorini-Kossakowski-Sudarshan-Lindblad主方程，推导了白色热噪声下一般双线性相互作用保持可分离性的普适条件。\n2. 其核心发现是纠缠产生的阈值由热噪声主导，且该阈值不能通过改变初始态或引入中介系统加以放宽。\n3. 这一结果确立了热环境中纠缠生成协议的基本限制，对引力诱导纠缠等方案的设计与验证具有直接约束作用。", "summary_source": "deepseek", "authors": [{"name": "Alfred Li"}, {"name": "Daisuke Miki"}, {"name": "Yanbei Chen"}], "featured_authors": [{"name": "Alfred Li"}, {"name": "Daisuke Miki"}, {"name": "Yanbei Chen"}], "author_count": 3}, {"id": "2605.26219", "category": "quant-ph", "title": "Entanglement Pattern Transition of Quantum States from Directed Percolation", "abstract": "Changes in the entanglement structure and critical phenomena are hallmarks of quantum phase transitions. Here, we discuss how they appear in transitions between classes of states with distinct entanglement patterns beyond the paradigm of stable equilibrium phases of matter. Using a mapping between stochastic automata and isometric Tensor Network States (isoTNS), we construct a two-dimensional quantum state from the Domany-Kinzel automaton, which is a (1+1)D process with an absorbing phase transition in the directed percolation class. At the critical point of the automaton, the corresponding isoTNS hosts algebraic correlations in all spatial directions. The continuous parent Hamiltonian of this state has a degenerate ground state manifold. It consists of a product state (the absorbing state) and a second state that undergoes a transition from pairwise entanglement between distant regions, similarly to the W state, to a state with trivial entanglement. Our results demonstrate how the correspondence between isoTNS and classical stochastic evolution can be used to probe the Hilbert space structure beyond stable ground state manifolds.", "url": "https://arxiv.org/abs/2605.26219", "type": "理论+数值", "summary": "1. 该工作利用随机自动机与等距张量网络态的对应，从Domany-Kinzel自动机构造了具有有向渗流类临界性的二维量子态，并刻画了其基态纠缠模式的转变。\n2. 其核心在于揭示经典临界动力学（吸收相变）在等距张量网络中产生各向同性代数关联，以及父哈密顿量简并基态从类W态的两体纠缠向平凡纠缠的连续过渡。\n3. 这为利用经典随机过程与张量网络映射来研究超越热力学极限基态流形的纠缠结构，并为探索非平衡临界量子相提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Julian Boesl"}, {"name": "Frank Pollmann"}, {"name": "Michael Knap"}], "featured_authors": [{"name": "Julian Boesl"}, {"name": "Frank Pollmann"}, {"name": "Michael Knap"}], "author_count": 3}, {"id": "2605.26227", "category": "quant-ph", "title": "Mode-selective excitation in parametrically driven coupled quantum oscillators", "abstract": "A parametrically driven classical harmonic oscillator exhibits resonant instability when driven at twice its natural frequency, with the lowest energy configuration remaining unaffected by the drive. In contrast, the ground state of the quantum mechanical counterpart shows a non-trivial response to such a drive due to the spatial delocalization of the wavefunction. The standard realization of PR involves modulating the natural frequency of the oscillator. Here we study a different drive protocol in which the coupling between two such quantum harmonic oscillators is modulated parametrically. We show that the drive frequency can in principle be tuned to selectively excite any desired normal mode, while leaving the other close to its ground state. Only states with even quantum numbers in each normal mode are populated. Within the parametric resonance window the excitations follow a power-law decay with respect to occupation number, in contrast to the exponential decay observed off-resonance. We also briefly discuss how this framework can be extended to a system of N coupled oscillators", "url": "https://arxiv.org/abs/2605.26227", "type": "理论", "summary": "1. 该工作研究了通过参数调制两个耦合量子谐振子间的耦合强度，实现选择性激发任意简正模而几乎不扰动其他模的方案。\n2. 其物理亮点在于驱动频率可精确匹配目标模的两倍频率，激发态仅占据偶量子数，并在共振窗口内呈现幂律衰减而非指数衰减。\n3. 这一机制可自然推广至N个耦合振荡器系统，为量子态选择性制备和多模量子控制提供了新的物理途径。", "summary_source": "deepseek", "authors": [{"name": "Ranjani Seshadri"}], "featured_authors": [{"name": "Ranjani Seshadri"}], "author_count": 1}, {"id": "2605.26240", "category": "quant-ph", "title": "Amplification and generation bounds of gravity-induced entanglement in pulsed optomechanical systems", "abstract": "We investigate gravity-induced entanglement between the output optical fields of two red-detuned pulsed optomechanical systems with their masses coupled by mutual gravitational interaction. For each individual system, the optomechanical interaction realizes a beam-splitter state swap between an incident optical pulse and its mechanical mode. Using two rectangular pulses for each system -- the first to imprint a nonclassical state on the mechanical modes and the second to read the gravitationally generated entanglement back onto the outgoing light -- we show that the amount of entanglement can be amplified by preparing the input in a squeezed or Fock state. However, the threshold for entanglement generation is set by the competition between the gravitational coupling and thermal decoherence, $g_G>2\\gamma_m N_{\\rm th}$, and cannot be lowered by any choice of input state. We prove this bound for two-mode Gaussian inputs and show that it continues to hold for Fock-state inputs. We further analyze how imperfect detection modifies the threshold and identify the entanglement-annihilating and entanglement-breaking regimes, which are set by the thermal decoherence accumulated over the interaction time, independent of the gravitational coupling.", "url": "https://arxiv.org/abs/2605.26240", "type": "理论", "summary": "1. 该工作理论分析了两个红失谐脉冲光机械系统中引力诱导纠缠的放大与产生界限，利用光束分裂器状态交换将非经典态或纠缠写入并读出至输出光场。\n2. 其核心发现是纠缠可通过压缩态或数态输入放大，但产生阈值由引力耦合与热退相干竞争决定（\\(g_G>2\\gamma_m N_{\\rm th}\\)），且对双模高斯态和数态输入均不可降低。\n3. 这为引力诱导纠缠的实验探测明确了不可逾越的阈值条件，并揭示了热退相干主导的纠缠破坏区域与纠缠打破区域，指导脉冲序列和测量保真度的设计。", "summary_source": "deepseek", "authors": [{"name": "Daisuke Miki"}, {"name": "Alfred Li"}, {"name": "Yanbei Chen"}], "featured_authors": [{"name": "Daisuke Miki"}, {"name": "Alfred Li"}, {"name": "Yanbei Chen"}], "author_count": 3}, {"id": "2605.26272", "category": "quant-ph", "title": "Kubo-Ando Means and Rigidity of Quantum Positivity Cones", "abstract": "We investigate the stability of quantum positivity cones under nonlinear operator means. Specifically, we examine how Kubo--Ando means interact with the separable, positive partial transpose (PPT), and Schmidt-number cones. By analyzing the curvature of operator monotone functions at the identity, we give a strict rigidity phenomenon: weighted arithmetic means are the only Kubo--Ando means that preserve the separable cone in all dimensions. We show that the strictly positive curvature of any non-arithmetic mean explicitly forces a violation of the PPT condition, even in the foundational two-qubit setting, and can strictly increase the Schmidt number of the resulting operator. Finally, using the Choi--Jamiołkowski correspondence, we translate these geometric obstructions to the map-theoretic setting, concluding that convex mixing is the uniquely permissible Kubo--Ando operation for preserving entanglement-breaking quantum channels.", "url": "https://arxiv.org/abs/2605.26272", "type": "理论", "summary": "1. 本文考察Kubo–Ando均值与量子正性锥（可分、PPT及施密特数锥）的相容性，揭示非线性算子均值下的锥结构稳定性。\n2. 通过分析算子单调函数在单位元处的曲率，发现严格刚性：加权算术平均是唯一在所有维度下保持可分锥的Kubo–Ando均值，且非算术平均的正曲率必然导致PPT条件破坏并提升施密特数。\n3. 借助Choi–Jamiołkowski对应，将几何障碍转化为映射论框架，推论凸混合是保持纠缠破坏量子信道的唯一允许的Kubo–Ando运算。", "summary_source": "deepseek", "authors": [{"name": "Mohsen Kian"}], "featured_authors": [{"name": "Mohsen Kian"}], "author_count": 1}, {"id": "2605.26331", "category": "quant-ph", "title": "Uncertainty Relation for a Single Observable", "abstract": "Uncertainty relations are usually formulated as trade-off relations between two or more observables. Here we show that the uncertainty of a single observable already has a nontrivial lower bound originating from the noncommutativity between the observable and the quantum state. We prove sharp lower bounds on the variance of a single observable and then sharpen them further by introducing the classical uncertainty of the observable under a fixed state. The optimal coefficient is determined solely by the smallest and largest eigenvalues of the state. Our results include an optimal state-dependent improvement of Luo's Wigner--Yanase-type relation and a direct bound showing that coherence or asymmetry of the state with respect to the observable gives an unavoidable contribution to its uncertainty. For qubits, the sharpened bounds become exact identities, giving a complete decomposition of the variance into classical and noncommutative parts. These single-observable relations also yield improved product-form uncertainty relations for pairs of observables.", "url": "https://arxiv.org/abs/2605.26331", "type": "理论", "summary": "1. 该工作证明单个可观测量已存在由可观测量与量子态非对易性导致的非平凡方差下限，并进一步引入经典不确定性加以锐化。\n2. 其技术要点在于最优系数仅由态的最小与最大本征值决定，所得量子比特下界成为精确恒等式，实现了方差到经典与非对易部分的完备分解。\n3. 这为单可观测量不确定性的起源提供了严格刻画，并由此改进对易可观测量对的不确定性关系，启发后续测量与信息理论的发展。", "summary_source": "deepseek", "authors": [{"name": "Haruki Yamashita"}, {"name": "Aina Mayumi"}, {"name": "Gen Kimura"}], "featured_authors": [{"name": "Haruki Yamashita"}, {"name": "Aina Mayumi"}, {"name": "Gen Kimura"}], "author_count": 3}, {"id": "2605.26377", "category": "quant-ph", "title": "Single-Ensemble Multiparameter Squeezing with Qudits", "abstract": "Quantum-enhanced multiparameter sensing is often associated with distributed architectures or 2-anticoherent states, whereas squeezing in a single collective ensemble is typically limited to single-parameter metrology. Here, we show that a single ensemble can support simultaneous multiparameter squeezing when each sensor is promoted from a qubit to a qudit (i.e., spin with $d$ energy levels). We develop a general framework in which the optimal product probe state, the corresponding global readout observables, and the associated squeezing parameters are all determined from the single-site quantum Fisher information matrix. We then present a minimal qudit construction for two-parameter vector magnetic field sensing with local dimension $d=3$. We further identify a collective twisting-like interacting Hamiltonian that generates such multiparameter-squeezed states and numerically demonstrate scalable metrological gain. In particular, for a trapped-ion qutrit chain with power-law interactions, we obtain up to 12 dB enhancement in two-parameter sensing for $N=256$ sensors. Our results establish qudit-enabled multiparameter squeezing in a single ensemble as a distinct route to multiparameter quantum metrology with global readout, and highlight its potential advantage over distributed multi-ensemble strategies in the fixed-sensor-budget regime.", "url": "https://arxiv.org/abs/2605.26377", "type": "理论+数值", "summary": "1. 该工作证明将传感器从量子比特提升至量子比特（自旋d能级）可使单个系综同时支持多参数压缩，并建立普适框架。\n2. 其核心在于从单点量子Fisher信息矩阵导出最优乘积探针态与全局读出观测量，并识别出产生压缩态的集体扭转型相互作用哈密顿量。\n3. 这为固定传感器预算下采用单系综全局读出的多参数量子计量提供了区别于分布式策略的可行途径，并在256个离子链中演示了12 dB两参数传感增益。", "summary_source": "deepseek", "authors": [{"name": "Xiaoshui Lin"}, {"name": "Chunlei Qu"}, {"name": "Chong Zu"}, {"name": "Chuanwei Zhang"}], "featured_authors": [{"name": "Xiaoshui Lin"}, {"name": "Chunlei Qu"}, {"name": "Chong Zu"}, {"name": "Chuanwei Zhang"}], "author_count": 4}, {"id": "2605.26389", "category": "quant-ph", "title": "Scar Full Eigenstate Thermalization Hypothesis", "abstract": "The eigenstate thermalization hypothesis (ETH) provides a fundamental mechanism for emergent statistical mechanics in isolated chaotic quantum systems, asserting that individual energy eigenstates behave as pseudorandom vectors within an energy window. This enables a complete characterization of nontrivial correlations among matrix elements in the energy eigenbasis, as described by the full ETH ansatz. Nevertheless, this description breaks down in systems exhibiting quantum many-body scars, which host non-thermal eigenstates with extensive energy. In this Letter, we address this problem by formulating the \\textit{scar full ETH}, which captures correlations among matrix elements involving scar states. The corresponding scaling forms and factorization properties are established using typicality arguments. Multi-time correlation functions for scar states are then organized in terms of both thermal and scar cumulants, providing a nontrivial reorganization of higher-order correlations. We numerically demonstrate the validity of this framework in the paradigmatic model of quantum scars, the PXP model. Our results pave the way for a systematic understanding of intriguing correlations in systems with quantum many-body scars.", "url": "https://arxiv.org/abs/2605.26389", "type": "理论+数值", "summary": "1. 该工作针对量子多体疤痕破坏传统本征态热化假说的问题，提出了疤痕完备本征态热化假说形式。\n2. 其核心卖点在于利用典型性论证建立了涉及疤痕态的矩阵元标度律与因子化性质，并通过热累积量与疤痕累积量重新组织高阶关联。\n3. 这一框架为系统理解量子疤痕系统中非平庸关联结构提供了理论基础，并在PXP模型中得到了数值验证。", "summary_source": "deepseek", "authors": [{"name": "Ning Sun"}, {"name": "Yanting Cheng"}], "featured_authors": [{"name": "Ning Sun"}, {"name": "Yanting Cheng"}], "author_count": 2}, {"id": "2605.26522", "category": "quant-ph", "title": "A Resource Comparison of Logical T-State Preparation", "abstract": "Logical T state preparation is a major overhead source in fault tolerant architectures built from stabilizer operations. Existing protocols, however, are reported under different code families, noise models, postselection rules, and cost conventions, making direct comparison difficult. We compare three representative preparation routes: magic state distillation, magic state cultivation, and code switching, using currently available results. Rather than reducing heterogeneous data to a single cost metric, we retain source native cost units and record output error, single attempt cost, expected cost per accepted output, footprint, latency, and reporting completeness for each configuration. Within the current dataset, distillation reaches the lowest output error regime; code switching achieves the lowest reported single attempt cost and the smallest explicit footprint among the compatible rows; and recent RP2 cultivation results add low cost cultivation points with output errors between 1e-6 and 1e-9. As a simple algorithm level case study, we also examine the reported preparation routes under an error budget motivated by Shor factoring algorithm, in order to relate single state preparation costs to full workload requirements. The resulting comparison clarifies the trade offs currently supported across the literature, while remaining bounded by the conventions and coverage of the underlying papers.", "url": "https://arxiv.org/abs/2605.26522", "type": "理论+数值", "summary": "1. 该工作系统比较了魔术态蒸馏、魔术态培育和码切换三种逻辑T态制备路线，采用原生成本单位而非单一聚合指标进行跨方案对比。\n2. 其卖点在于保留输出误差、单次尝试成本、期望成本、足迹、延迟和报告完整性等多维原生指标，避免了异构数据简化带来的信息损失。\n3. 这为容错量子计算中逻辑T态制备的资源权衡提供了量化基准，并启示在统一噪声模型下开展更全面的跨方案比较。", "summary_source": "deepseek", "authors": [{"name": "Jianshuo Gao"}, {"name": "Xiao Yuan"}, {"name": "Yuan Yao"}], "featured_authors": [{"name": "Jianshuo Gao"}, {"name": "Xiao Yuan"}, {"name": "Yuan Yao"}], "author_count": 3}, {"id": "2605.26586", "category": "quant-ph", "title": "Analytical Singular-Value Structure of Analytic-Continuation Kernels from Slepian Information Theory", "abstract": "Analytic continuation from imaginary-time Green's functions to real-frequency spectra is a central ill-posed inverse problem in quantum many-body physics. We show that the thermal kernel admits an analytical generalized singular-value structure once its purely dynamical part is separated from the statistical weight imposed by the heat bath. The dynamical kernel is the imaginary-bandwidth continuation of Slepian's finite Fourier transform and is governed by the same Sturm-Liouville algebra that yields prolate spheroidal wave functions. Fermionic and bosonic statistics then enter as gauge transformations of the frequency-space inner product, producing self-adjoint effective potentials but no numerical kernel diagonalization. The Shannon number, $N_c=\\beta\\wmax/\\pi$, fixes the upper information capacity of this pure Laplace channel. Finally, the optimal sampling points are obtained as eigenvalues of a Legendre colleague matrix, giving a deterministic compressed-sensing grid without iterative root searches.", "url": "https://arxiv.org/abs/2605.26586", "type": "理论+数值", "summary": "1. 该工作运用Slepian信息理论，解析地揭示了从虚时格林函数解析延拓至实频谱的热核奇异值结构。\n2. 其核心在于将热核的纯动力学部分与统计权重分离，并证明动力学核是有限傅里叶变换的虚频带延拓，且玻色子与费米子统计以规范变换形式影响频率空间内积。\n3. 所导出的Shannon数N_c=βω_max/π精确刻画纯拉普拉斯通道的信息容量，而最优采样点作为Legendre伴随矩阵本征值给出，为压缩感知方案提供了无需迭代的确定性格点。", "summary_source": "deepseek", "authors": [{"name": "Masayuki Ohzeki"}], "featured_authors": [{"name": "Masayuki Ohzeki"}], "author_count": 1}, {"id": "2605.26610", "category": "quant-ph", "title": "End-to-End PDE-Based Quantum Algorithms for Multi-Asset Option Pricing under Local and Stochastic Volatility", "abstract": "Multi-asset option pricing under local- and stochastic-volatility models leads naturally to high-dimensional parabolic PDEs. We develop an end-to-end quantum PDE framework for European option pricing under local-volatility Black--Scholes and Heston models. The framework takes classical contract and model data as input and returns classical estimates of selected option values. We solve the pricing PDEs after finite-difference discretization on spatial grids. For $N=2^n$ grid points per spatial direction and $d$ assets, the end-to-end gate complexity for single-point recovery, counted in elementary CNOT gates and one-qubit Pauli-axis rotations, has leading grid-size dependence $\\widetilde{O}(d^2 N^{2+d/2})$ for local-volatility Black--Scholes and $\\widetilde{O}(d^2 N^{d+2})$ for Heston. Relative to grid-based finite-difference baselines, these scalings correspond to polynomial improvement factors $N^{d/2}$ and $N^d$, respectively. These estimates translate to Clifford+T resources via standard compilation. We complement the complexity analysis with numerical benchmarks against standard classical methods. In the Heston setting, the framework recovers option prices across strikes together with the associated implied-volatility smile/skew. Overall, this work provides a complete end-to-end quantum pricing pipeline with explicit resource accounting and theoretical performance guarantees.", "url": "https://arxiv.org/abs/2605.26610", "type": "理论+数值", "summary": "1. 该工作构建了端到端量子PDE框架，用于本地波动率Black-Scholes和Heston模型下多资产欧式期权定价，输入输出均为经典数据。\n2. 技术核心在于有限差分离散化后，单点恢复的门复杂度对网格点数具有N^{d/2}或N^d的多项式改进，并给出Clifford+T资源估计及数值基准验证。\n3. 此框架为高维金融衍生品定价提供了含理论优势证明的完整算法管线，推动了实用化量子加速在金融工程中的可量化探索。", "summary_source": "deepseek", "authors": [{"name": "Nikita Guseynov"}, {"name": "Nana Liu"}, {"name": "Chi Seng Pun"}, {"name": "Tushar Vaidya"}], "featured_authors": [{"name": "Nikita Guseynov"}, {"name": "Nana Liu"}, {"name": "Chi Seng Pun"}, {"name": "Tushar Vaidya"}], "author_count": 4}, {"id": "2605.26644", "category": "quant-ph", "title": "Evolution of Hypoequilibrium States in Steepest Entropy Ascent Models for Nonequilibrium Quantum Thermodynamics", "abstract": "A formal development of the hypoequilibrium (HE) state concept within the Steepest-Entropy-Ascent Quantum Thermodynamics (SEAQT) framework is presented, emphasizing its rigorous mathematical formulation. Using a general decomposition of the Hilbert space, HE states are defined in operator language and the reduced evolution of the associated intensive parameters for the regime where the dissipative dynamics commutes with the Hamiltonian is derived. It is proved that the $M$-th order HE family (where $M$ is the number of spectral sectors) constitutes an invariant manifold under the SEAQT equation of motion, ensuring that states initially representing a ``mixture of canonicals'' maintain this structure throughout their evolution. Furthermore, a formal connection is established between the HE ansatz and the rate-controlled constrained equilibrium (RCCE) method, identifying HE variables as constraint potentials. Finally, the model is extended to non-Hamiltonian SEAQT (NH-SEAQT) interactions to describe thermodynamically consistent energy and entropy exchanges between subsystems and heat baths. This work provides the formal foundation for reduced-order modeling of far-from-equilibrium relaxation and transport processes, and supports a methodology previously applied across various physical and chemical systems.", "url": "https://arxiv.org/abs/2605.26644", "type": "理论", "summary": "1. 该工作在陡峭熵增量子热力学框架下，以希尔伯特空间分解为工具，严格定义了算符语言中的亚平衡态并推导了其简化动力学演化。\n2. 其核心在于证明M阶亚平衡族构成动力系统的不变流形，且将亚平衡变量识别为速率约束平衡方法中的约束势，从而建立了形式联系。\n3. 这为非平衡弛豫与输运过程的降阶建模提供了严格数学基础，并支持了拓展至非哈密顿相互作用的统一热力学描述。", "summary_source": "deepseek", "authors": [{"name": "Gian Paolo Beretta"}, {"name": "Rohit Kishan Ray"}, {"name": "Michael R. von Spakovsky"}], "featured_authors": [{"name": "Gian Paolo Beretta"}, {"name": "Rohit Kishan Ray"}, {"name": "Michael R. von Spakovsky"}], "author_count": 3}, {"id": "2605.26705", "category": "quant-ph", "title": "Analytical Model of Clock Drift in Quantum Key Distribution and a Simple Synchronization Algorithm", "abstract": "Clock synchronization is critical for maintaining low error rates in quantum key distribution. Here, we describe how a frequency mismatch between the transmitter and receiver clocks affects the quantum bit error rate in quantum key distribution, and derive from this model a simple synchronization algorithm together with clock stability requirements for practical operation. Our algorithm continuously compensates for both frequency mismatch and time-offset fluctuations directly from detection timestamps. It does not require a dedicated synchronization channel or auxiliary qubit sequence, converges from a large frequency mismatch within approximately one second of photon acquisition, and remains effective in low-photon-count regimes (more than 30 dB of channel loss) using standard hardware. We validate our approach by demonstrating successful key exchange over 100 km of fiber and continuous operation over 24 hours in a 16 km metropolitan network using commercial systems, with performance equivalent to using a service channel for clock synchronization.", "url": "https://arxiv.org/abs/2605.26705", "type": "理论+数值", "summary": "1. 该工作通过解析模型揭示了量子密钥分发中时钟频率失配导致量子比特误码率上升的物理机制，并由此导出一种仅基于光子检测时间戳的同步算法及时钟稳定性要求。\n2. 该算法无需专用同步信道或辅助量子比特，从检测时间序列连续校正频率偏移与时间漂移，能在信道损耗超过30 dB、初始失配达10 kHz量级时约一秒内收敛，并兼容标准商用硬件。\n3. 在100 km光纤链路和16 km城域网24小时连续运行实验中，该方案实现了与传统服务信道同步等效的密钥交换性能，为简化量子密钥分发系统同步架构、降低硬件开销提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Loïc Millet"}, {"name": "Boris Korzh"}, {"name": "Rob Thew"}, {"name": "Gianluca Boso"}], "featured_authors": [{"name": "Loïc Millet"}, {"name": "Boris Korzh"}, {"name": "Rob Thew"}, {"name": "Gianluca Boso"}], "author_count": 4}, {"id": "2605.26863", "category": "quant-ph", "title": "Zero-field dipolar decoupling of color center ensembles via universal qutrit control", "abstract": "Dipolar interactions are a major source of decoherence in dense ensembles of color centers in diamond. Current protocols demand using bias magnetic fields detrimental in many scenarios. We present ZENITH (Zero-field Ensemble Neutralization via Interleaved Trilevel Handling), a pulsed sequence to cancel dipolar interactions among V-degenerate spin-1 systems. We reveal excellent coherence survival, compatibility with existing sensing sequences, and improved DC detection, advancing a general framework to control interacting degenerate multilevel systems, of broad interest in quantum technologies.", "url": "https://arxiv.org/abs/2605.26863", "type": "理论", "summary": "1. 该工作提出了名为ZENITH的零磁场偶极解耦脉冲序列，通过通用qutrit控制对金刚石色心集合中V简并自旋-1系统的偶极相互作用进行高效解耦，从而显著抑制退相干并延长相干时间。\n2. 其核心物理卖点在于无需外加偏置磁场，仅借助交错的三能级操控即可完全抵消偶极耦合，同时保持与现有磁传感序列的高度兼容，并提升直流磁场探测灵敏度，展现出优异的相干保持率。\n3. 这为量子传感与量子信息处理中相互作用多能级系统的零场控制提供了普适框架，不仅可推广至其他固态量子平台，更在生物、化学等零磁环境以及微波传感、量子存储等领域展现出重要应用前景。", "summary_source": "deepseek", "authors": [{"name": "Antonio Verdú"}, {"name": "Ana Teresa Gea-Caballero"}, {"name": "Santiago Oviedo-Casado"}, {"name": "Fedor Jelezko"}, {"name": "Javier Prior"}], "featured_authors": [{"name": "Antonio Verdú"}, {"name": "Ana Teresa Gea-Caballero"}, {"name": "Santiago Oviedo-Casado"}, {"name": "Fedor Jelezko"}, {"name": "Javier Prior"}], "author_count": 5}, {"id": "2605.26866", "category": "quant-ph", "title": "Encrypted Cloning, Absolute Maximal Entanglement and Quantum Secret Sharing", "abstract": "The no-cloning theorem prohibits the creation of identical copies of quantum information, imposing fundamental constraints on quantum technologies. A recently proposed protocol, encrypted cloning, introduced by Yamaguchi and Kempf, showed that perfect qubit clones can be produced if they are simultaneously encrypted with a single-use key. They also observed a connection between this scheme and quantum secret sharing (QSS). However, it remained an open question whether encrypted cloning could be generalised to arbitrary dimensions, and the broader relationship between the two schemes had not been formally established. In this work, we address both questions by framing encrypted clones as Absolutely Maximally Entangled (AME) states. In parallel with recent work by Ceará that utilises Zadoff-Chu sequences, we independently develop a complementary framework for arbitrary dimensions based on Weyl-Heisenberg displacement operators, both tracing back to the original qubit construction by Yamaguchi and Kempf. We analytically compute the encrypted state and prove that an encrypted qudit system comprising two signal-noise qudit pairs is equivalent to a five-party AME state in any dimension, provided the input state is uniform. We then formalise the connection to QSS by proving that a threshold QSS scheme can achieve the fundamental objectives of encrypted cloning, establishing QSS as the natural general framework within which encrypted cloning can be contextualised.", "url": "https://arxiv.org/abs/2605.26866", "type": "理论", "summary": "1. 该工作利用Weyl-Heisenberg位移算符将加密克隆方案推广至任意维度，并证明其等价于五方绝对最大纠缠态。\n2. 技术关键在于解析计算表明均匀输入下的信号-噪声纠缠对系统自然对应多维AME态，从而建立加密克隆与量子秘密共享的形式化关联。\n3. 这为理解加密克隆的通用构造提供了QSS框架，并对高维量子信息处理与纠缠资源分类具有启示意义。", "summary_source": "deepseek", "authors": [{"name": "Zheng Liang Lim"}, {"name": "Hoi-Kwong Lo"}], "featured_authors": [{"name": "Zheng Liang Lim"}, {"name": "Hoi-Kwong Lo"}], "author_count": 2}, {"id": "2605.26867", "category": "quant-ph", "title": "Entangling power and fidelity diagnostic for bipartite quantum channels", "abstract": "We study two complementary diagnostics of bipartite quantum channels, namely fidelity preservation across different classes of input states and entanglement generation from product inputs, given by properly defined entangling power for bipartite channels. We show that the fidelity averaged over any fixed Schmidt-coefficients local-unitary orbit for equal local dimensions is completely determined by average input-output fidelity and its restriction to product inputs. We also introduce concurrence- and negativity-based entangling power for 2-qubit channels, prove their convexity and monotonicity under local postprocessing, and show that, unlike the previously proposed linear-entropy quantity, they vanish for all separable channels. Examples of non-separable channels are investigated. Finally, we generalize our definitions of entangling power to non-product inputs, and provide an analytical lower bound for the concurrence-based entanglement variation, showing its effectiveness with specific examples.", "url": "https://arxiv.org/abs/2605.26867", "type": "理论", "summary": "1. 该工作研究了二分量子信道的两个互补诊断量：任意固定Schmidt系数局部酉轨道上的平均保真度与基于并发纠缠和负性的纠缠能力。\n2. 其卖点在于提出并发纠缠和负性定义的纠缠能力，证明了凸性和局域后处理单调性，并指出其可区分所有可分离信道，同时给出了非乘积输入下纠缠变化的解析下界。\n3. 这为量子信道分类、纠缠资源量化以及特定非可分离信道的结构分析提供了理论工具与启发。", "summary_source": "deepseek", "authors": [{"name": "Marcin Rudziński"}, {"name": "Gianluigi Tartaglione"}, {"name": "Karol Życzkowski"}], "featured_authors": [{"name": "Marcin Rudziński"}, {"name": "Gianluigi Tartaglione"}, {"name": "Karol Życzkowski"}], "author_count": 3}, {"id": "2605.26920", "category": "quant-ph", "title": "Extremal Marginal States of Maximal Rank in $(d, d+m)$", "abstract": "We study the extreme points of the convex set $\\mathcal{C}(\\rho_1,\\rho_2)$ of bipartite quantum states with fixed marginals $\\rho_1$ and $\\rho_2$. We construct extreme points in $(d,\\,d+m)$ dimension, of rank $d+m$, matching the highest possible value, for all $d\\geq 3$, $m > \\frac{d^2-2d-2}{2}$ (when $d=2$, $m\\geq 1$). This proves the existence of extremal states with relatively large rank and also covers all the known examples. We further show that, in order to analyze the extreme points of $\\mathcal{C}(\\rho_1,\\rho_2)$, it is sufficient to study the special case $\\mathcal{C}(\\mathcal{D}_1,\\mathcal{D}_2)$, where the marginals are diagonal. Additionally, we observe that it is sufficient to consider $d_1\\leq d_2$. Thus, our results show that apart from possibly a few finite cases, for each $d_1$, the maximal rank is achieved almost all times.", "url": "https://arxiv.org/abs/2605.26920", "type": "理论", "summary": "1. 该工作构造了具有固定边缘态的双边量子态凸集中秩达到最大可能值d+m的极端点，覆盖所有已知情形且适用于大多数维度组合。\n2. 其核心在于证明了分析此类极端点可归结为边缘为对角阵的特殊情形，并基于此系统建立了高秩极端态的存在性。\n3. 这为理解量子关联与边缘约束的极值结构提供了完整框架，并暗示了极端点最大秩问题在有限例外之外普遍可达。", "summary_source": "deepseek", "authors": [{"name": "Indu Bala"}, {"name": "Swapan Rana"}], "featured_authors": [{"name": "Indu Bala"}, {"name": "Swapan Rana"}], "author_count": 2}, {"id": "2605.27052", "category": "quant-ph", "title": "Semiclassical foundation of universality in chaotic quantum circuits", "abstract": "The fundamental correspondence between quantum chaotic single-particle systems and random matrix theory is well-understood via periodic orbit theory. In contrast, we show that many-body systems with explicit subsystem structure possess characteristics different from the single-particle theory. We present a periodic orbit theory for many-body systems with well defined semiclassical limit. For this we identify periodic orbit families arising exclusively in the many-body setting and implement a central limit theorem characterizing their correlations. Based on this we demonstrate that spectral correlations in chaotic quantum circuits are characterized by the breaking of individual time translation invariance of periodic orbits in the subsystems into residual synchronous time translations only. This provides a systematic approach to confirming random matrix universality in deterministic many-body systems.", "url": "https://arxiv.org/abs/2605.27052", "type": "理论", "summary": "1. 该工作为具有明确子系统的混沌量子电路构建了多体周期轨道理论，并推导出谱关联的普适形式。\n2. 其核心在于识别出多体独有的周期轨道族，通过中心极限定理刻画其统计关联，并证明子系统间时间平移对称性破缺至同步平移。\n3. 这为从确定性多体动力学直接导出随机矩阵谱统计提供了半经典基础与系统性验证框架。", "summary_source": "deepseek", "authors": [{"name": "Maximilian F. I. Kieler"}, {"name": "Felix Fritzsch"}, {"name": "Arnd Bäcker"}], "featured_authors": [{"name": "Maximilian F. I. Kieler"}, {"name": "Felix Fritzsch"}, {"name": "Arnd Bäcker"}], "author_count": 3}, {"id": "2605.27210", "category": "quant-ph", "title": "Qiskit QuantumKatas: Adapting Microsoft's Quantum Computing exercises for LLM evaluation", "abstract": "We adapt Microsoft's QuantumKatas -- a well-established quantum computing curriculum -- from Q# to Qiskit, the most widely-adopted quantum computing framework, and package it with an evaluation framework for systematic LLM assessment. The resulting benchmark comprises 350 tasks across 26 categories, spanning fundamental gates through advanced algorithms (Grover's, Simon's, Deutsch-Jozsa), error correction, key distribution, and quantum games. Each task includes a natural language prompt, canonical solution, and deterministic test verification via classical circuit simulation. By building on the QuantumKatas' proven pedagogical design rather than creating tasks from scratch, we inherit a principled difficulty progression and comprehensive concept coverage while contributing the framework adaptation, evaluation infrastructure, and empirical analysis. We evaluate 16 LLMs across 7 prompting configurations -- a total of 39,200 model runs -- to demonstrate the benchmark's utility. Three key findings emerge: (1) the benchmark effectively differentiates model capabilities, with best-configuration pass rates ranging from 32.3% to 83.1% and a 26.1 pp average gap between frontier and open-source models; (2) models perform well at implementing known algorithms (SimonsAlgorithm 82.1%, BasicGates 81.6%) but struggle with problem encoding (SolveSATWithGrover 34.4%, DistinguishUnitaries 40.0%); and (3) chain-of-thought prompting shows a modestly bimodal effect -- it is the best strategy for three models (two of them explicitly reasoning-tuned per vendor documentation) but degrades performance for the rest, leaving it mid-pack in aggregate (56.3% mean) behind few-shot-5 (57.8%). We release the benchmark, evaluation framework, and baseline results to support research on LLM capabilities in quantum computing.", "url": "https://arxiv.org/abs/2605.27210", "type": "理论+数值", "summary": "1. 该工作将Microsoft的QuantumKatas从Q#移植至Qiskit，构建含350个任务、26类别的量子计算基准，用于系统评估大语言模型。\n2. 其核心在于继承Katas的渐进式难度与代数验证设计，结合自然语言提示与确定性电路模拟，实现模型能力的分辨与痛点挖掘。\n3. 基准揭示前沿与开源模型间26.1个百分点的平均通过率差距，并发现模型在算法实现上优于问题编码，为LLM在量子计算领域的评估提供了标准化基础设施。", "summary_source": "deepseek", "authors": [{"name": "Juan Cruz-Benito"}, {"name": "Ismael Faro"}], "featured_authors": [{"name": "Juan Cruz-Benito"}, {"name": "Ismael Faro"}], "author_count": 2}, {"id": "2605.27228", "category": "quant-ph", "title": "Bose-Einstein thermal operators for semidefinite optimization", "abstract": "We establish that semidefinite programs (SDPs) over the unbounded positive semidefinite cone are mathematically equivalent to thermodynamic systems of independent bosonic modes: the eigenvalues of the optimization variable play the role of expected occupation numbers, the linear objective plays the role of total expected energy, and the linear equality constraints play the role of conserved non-commuting charges. Building on this perspective, we recast general SDPs as bosonic free-energy minimization problems at strictly positive temperature, regularized by the Bose-Einstein entropy; the original SDP is recovered in the zero-temperature limit. The optimal primal variable takes the form of a Bose-Einstein thermal operator parametrized by the dual variables. We prove an approximation-error bound that depends on the ground-space degeneracy and the spectral gap of the dual slack operator, improving on the linear-in-dimension worst-case duality gap of interior-point methods. We also introduce the Bose-Einstein quantum relative entropy as a Bregman divergence on the unbounded positive semidefinite cone, generated by the negative Bose-Einstein entropy. We propose it as a natural divergence for unnormalized positive operators, for which the standard Umegaki relative entropy can become negative, and we show that it satisfies a restricted monotonicity property under affine maps modeling bosonic Gaussian channels. Finally, we develop hybrid quantum-classical algorithms for the regularized SDP using only Hamiltonian simulation, Hadamard tests, and classical sampling, and bound their runtime in closed form. Unlike existing quantum SDP solvers, whose runtimes scale polynomially with an a priori upper bound on the primal trace, our framework operates directly on the unbounded cone, replacing this bound with a dependence on the spectral structure of the dual slack operator.", "url": "https://arxiv.org/abs/2605.27228", "type": "理论+数值", "summary": "1. 该工作建立了半定规划与独立玻色子模式热力学系统的数学等价，将问题重述为正温度下玻色自由能最小化，最优解由玻色-爱因斯坦热算子参数化。\n2. 其核心是利用玻色-爱因斯坦熵正则化导出依赖对偶slack算子谱间隙与基态简并度的近似误差界，并定义无界正定锥上的玻色-爱因斯坦量子相对熵。\n3. 该框架为无需原始迹先验上界的混合量子-经典SDP算法开辟新路径，运行时间由对偶算子的谱结构决定，替代了现有方法的线性维数依赖。", "summary_source": "deepseek", "authors": [{"name": "Michele Minervini"}, {"name": "Nana Liu"}, {"name": "Mark M. Wilde"}], "featured_authors": [{"name": "Michele Minervini"}, {"name": "Nana Liu"}, {"name": "Mark M. Wilde"}], "author_count": 3}, {"id": "2605.27262", "category": "quant-ph", "title": "Nonasymptotic bounds for quantum purity amplification", "abstract": "In quantum purity amplification, one is given $n$ copies of a noisy quantum state $\\rho \\in \\mathbb{C}^{d \\times d}$ and asked to prepare $k$ copies of its principal eigenstate $|v_d\\rangle$. Several prior works have derived information-theoretically optimal algorithms for this problem, but the bounds they prove are only shown in the asymptotic regime as the number of samples $n$ tends to infinity. In this paper, we establish the following nonasymptotic guarantee: if $\\rho$'s eigenvalues are sorted $p_1 \\leq \\cdots \\leq p_d$ and $p_{d-1} < p_d$, then \\begin{equation*} n = O\\Big(k + \\frac{k}{\\delta} \\cdot \\frac{1-p_d}{(p_d-p_{d-1})^2}\\Big) \\end{equation*} copies suffice to output a state with fidelity at least $1-\\delta$ with $|v_d^{\\otimes k}\\rangle$. Our bound holds for arbitrary spectra, and is independent of the dimension $d$. In the case of depolarizing noise, our finite-sample guarantee matches the optimal asymptotic scaling. Our proof is based on the combinatorics of random Young diagrams.", "url": "https://arxiv.org/abs/2605.27262", "type": "理论+数值", "summary": "1. 该工作建立了量子纯度放大问题的非渐近样本复杂度上界，保证n个拷贝足以输出与目标纯态保真度不低于1-δ的k份副本。\n2. 其核心在于推导了一个与维度d无关、适用于任意谱的有限样本界，并在退极化噪声下匹配最优渐近标度。\n3. 这一结果揭示了随机杨图组合学在量子信息理论中的关键作用，为有限样本量子态重构提供了严格理论支撑。", "summary_source": "deepseek", "authors": [{"name": "Thilo Scharnhorst"}, {"name": "Jack Spilecki"}, {"name": "John Wright"}], "featured_authors": [{"name": "Thilo Scharnhorst"}, {"name": "Jack Spilecki"}, {"name": "John Wright"}], "author_count": 3}, {"id": "2605.27278", "category": "quant-ph", "title": "Optimal quantum locally differentially private mechanisms in the high-privacy regime", "abstract": "We optimize the trade-off between privacy and utility in the high-privacy regime. We adopt local differential privacy (LDP) and its quantum extension, quantum local differential privacy (QLDP), for privacy protection, and investigate utility functions including the Holevo information (which reduces to the mutual information in the classical case) and the error exponents in symmetric and asymmetric hypothesis testing. These utility functions have classical and quantum optimal values, which are denoted by $C$ and $Q$, respectively, in this abstract for simplicity. In this paper, we provide optimal LDP and QLDP mechanisms achieving the classical and quantum optimal values in the high-privacy regime, and prove that the asymptotic ratio $Q/C$ in this regime takes the same value regardless of the utility function. Our results reveal quantum advantages (more precisely, $Q/C\\ge3/2$) for the above utility functions when the protected private data are $n$-ary with $n\\ge3$.", "url": "https://arxiv.org/abs/2605.27278", "type": "数值", "summary": "1. 该工作在高隐私区域优化局部差分隐私（LDP）与量子局部差分隐私（QLDP）的隐私-效用权衡，针对Holevo信息及对称与非对称假设检验误差指数构建了实现经典最优值C与量子最优值Q的最优机制。\n2. 核心结论是证明了在高隐私区域渐近比率Q/C对上述效用函数取相同常数，且当受保护私有数据为n元（n≥3）时该比率下界为3/2，揭示了确定的量子优势。\n3. 此结果建立了高隐私约束下量子隐私保护度量相对于经典方案的定量基准，为量子局部差分隐私的理论最优性提供普适判据，并指引了实际量子隐私机制设计。", "summary_source": "deepseek", "authors": [{"name": "Yuuya Yoshida"}], "featured_authors": [{"name": "Yuuya Yoshida"}], "author_count": 1}, {"id": "2605.27369", "category": "quant-ph", "title": "Generalized multilevel amplitude damping channels and their thermodynamic performances", "abstract": "We introduce a new class of quantum channels, the Generalized Multilevel Amplitude Damping (GMAD) channels, to model noise and decoherence effects in a qudit coupled to a thermal environment. The degradation of energetic resources under GMADs is investigated by evaluating work functionals and ergotropic capacitances, with particular attention to the coherent and incoherent contributions to ergotropy, for which we introduce new quantifiers. Our analysis sheds light on how to optimally prepare a qudit in a thermal environment in order to preserve its value from the perspective of work extraction, and reveals several counterintuitive phenomena: the ergotropic capacitance of a GMAD channel is not monotonic in the temperature of the environment; moreover, iterating the map can lead to crossings between ergotropic functionals at different temperatures, indicating the presence of a Markovian Mpemba effect.", "url": "https://arxiv.org/abs/2605.27369", "type": "理论", "summary": "1. 该工作引入广义多级幅度阻尼信道，模拟qudit与热库耦合下的退相干，并评估其做功泛函与ergotropic电容。\n2. 核心在于量化相干与非相干对ergotropy的贡献，揭示ergotropic电容随温度非单调以及迭代映射出现马尔可夫Mpemba效应。\n3. 这为理解热环境中qudit的功提取优化与反直觉热力学行为提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Vito Vetrano"}, {"name": "Vittorio Giovannetti"}, {"name": "Vasco Cavina"}], "featured_authors": [{"name": "Vito Vetrano"}, {"name": "Vittorio Giovannetti"}, {"name": "Vasco Cavina"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
