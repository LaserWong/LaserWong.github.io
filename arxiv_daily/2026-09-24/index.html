ectively, while maintaining a relative arithmetic error below $10^{-4}$. This work provides a scalable hardware foundation for high-fidelity flux control in dynamic superconducting quantum circuits.", "url": "https://arxiv.org/abs/2609.27456", "type": "数值", "summary": "1. 该工作提出频域反演与时域拟合方法，用紧凑混合IIR/FIR滤波器实时补偿超导磁通控制线畸变。\n2. 前瞻并行化使FPGA以1.2 GSa/s处理波形，双比特C-Z门Pauli保真度中位数接近软件参考的99.57%。\n3. 补偿时间从微秒扩展至百微秒时LUT与DSP仅增约14%和4%，为动态超导电路高保真磁通控制提供可扩展硬件基础。", "summary_source": "deepseek", "authors": [{"name": "Qi Zhou"}, {"name": "Zi-Hao Mei"}, {"name": "Peng Duan"}, {"name": "Peng Wang"}, {"name": "Liang-Liang Guo"}, {"name": "Hao-Ran Tao"}, {"name": "Wei-Cheng Kong"}, {"name": "Hui Yang"}, {"name": "Guo-Ping Guo"}, {"name": "Zhao-Yun Chen"}], "featured_authors": [{"name": "Qi Zhou"}, {"name": "Zi-Hao Mei"}, {"name": "Peng Duan"}, {"name": "Hui Yang"}, {"name": "Guo-Ping Guo"}, {"name": "Zhao-Yun Chen"}], "author_count": 10}, {"id": "2609.27488", "category": "quant-ph", "title": "On Relationship Between Circuit Depth and Trainability of VQAs", "abstract": "The training efficiency of Variational Quantum Algorithms (VQAs) is dictated by the geometry of their loss landscapes, which can be formally analysed by mapping these functions to random fields on manifolds. Instead of VQAs, we can then directly study the corresponding random fields, in our case, the Wishart Hypertoroidal Random Fields (WHRFs). We are mostly interested in the distribution of critical points (especially local minima) of WHRFs. For this purpose, the Kac-Rice formula is presented, reformulated, and simulated. The findings identify a phase transition in the distribution of local minima. Beyond a specific threshold, local minima concentrate near the global minimum in function value, meaning that even local minima are good approximators of the global one. The threshold is governed by the ratio between the problem Hamiltonian degrees of freedom and by the number of independent parameters in the VQA. Since the degrees of freedom parameter scales exponentially, we propose symmetry reduction operations to lower the degrees of freedom. This mathematically reduces the dimension, scaling down the required parameter threshold and enabling to solve bigger problems.", "url": "https://arxiv.org/abs/2609.27488", "type": "理论+数值", "summary": "1. 该工作将VQA损失景观映射为流形上的随机场，转而研究Wishart超环面随机场的临界点，并用Kac-Rice公式重述与模拟其局部极小值分布。\n2. 其核心发现是局部极小值分布存在相变：超过由问题哈密顿量自由度与VQA独立参数数目之比确定的阈值后，局部极小值在函数值上向全局极小值集中。\n3. 由于自由度随规模指数增长，作者提出对称性约化以降低维度与所需参数阈值，为联系电路深度/参数量与可训练性并求解更大问题提供可行路径。", "summary_source": "deepseek", "authors": [{"name": "Jan Michálek"}, {"name": "Martin Friák"}, {"name": "Petr Vašík"}], "featured_authors": [{"name": "Jan Michálek"}, {"name": "Martin Friák"}, {"name": "Petr Vašík"}], "author_count": 3}, {"id": "2609.27497", "category": "quant-ph", "title": "Optimal low-rank compression of quantum dynamics", "abstract": "Local quantum interactions generate dynamics in an exponentially large Hilbert space, yet locality and entanglement restrict the information that can spread and accumulate. Bounds on propagation and entanglement growth, together with tensor networks, exploit these restrictions to discard information unnecessary for describing the evolution. This leads to a sharper question: how much information must any low-rank representation retain? Here we determine these limits, up to logarithmic factors, for short-range interactions. For time-independent evolution, the optimal rank obeys $\\log D=\\widetilde O(t+\\sqrt{\\log(1/\\epsilon)})$, with matching lower bounds fixing the accuracy exponent $1/2$; for arbitrary driving, matching fixed-time bounds instead give $2/3$. Correspondingly, the corresponding dynamical entanglement spectra exhibit distinct small-$\\alpha$ Rényi laws, $\\alpha^{-1}$ and $\\alpha^{-2}$. In one dimension, the static limit is constructively attained by an explicit MPO algorithm, with an analogous extension to Liouvillian dynamics. Together, these results determine the irreducible information required to represent local quantum evolution and uncover distinct entanglement structures in static and driven dynamics.", "url": "https://arxiv.org/abs/2609.27497", "type": "理论+数值", "summary": "1. 该工作确定了短程相互作用下量子动力学低秩压缩的最优信息极限，区分了时间无关演化与任意驱动两种情形，并给出可达的秩标度及匹配下界。\n2. 对时间无关演化，最优秩满足 log D=\\widetilde O(t+\\sqrt{\\log(1/\\epsilon)})，匹配下界锁定精度指数1/2；任意驱动下固定时间匹配界则给出2/3，且动态纠缠谱呈现小α的Rényi律 α^{-1} 与 α^{-2}。\n3. 该结果刻画出局域量子演化不可约的信息需求，揭示静态与驱动动力学具有不同纠缠结构，并为一维显式MPO算法及Liouvillian动力学推广提供启发。", "summary_source": "deepseek", "authors": [{"name": "Hugo Mackay"}, {"name": "Donghoon Kim"}, {"name": "Tan Van Vu"}, {"name": "Tomotaka Kuwahara"}], "featured_authors": [{"name": "Hugo Mackay"}, {"name": "Donghoon Kim"}, {"name": "Tan Van Vu"}, {"name": "Tomotaka Kuwahara"}], "author_count": 4}, {"id": "2609.27530", "category": "quant-ph", "title": "Fate of average symmetry-protected topological states under symmetry-preserving quantum operations", "abstract": "The fate of average symmetry-protected topological (ASPT) states based on the one-dimensional cluster state is investigated by using the Choi mapping, namely, the doubled Hilbert-space formalism. By introducing two effective spins, $\\tau$ and $\\eta$, on each doubled rung, we obtain a transparent representation of the ASPT parent Hamiltonian and systematically identify the conserved stabilizers and the corresponding orders. We further study symmetry-preserving operations that deform the ASPT by combining qualitative effective-Hamiltonian and systematic parent-Hamiltonian analyses with numerical matrix-product-state filtering calculations. We find that although the ASPT remains robust over a broad range of decoherence strengths, strong-to-weak spontaneous symmetry breaking (SWSSB) becomes exact in the maximal-decoherence limit. In addition, we consider symmetry preserving no-click postselection, which removes the exact conservation law supporting the Rényi-2 string order of the ASPT and drives the system toward weak-symmetry spontaneous symmetry breaking (WSSB). Again, the ASPT remains robust over a broad range of postselection strengths, with WSSB becoming pronounced only near the projective limit and exact at the limit itself.", "url": "https://arxiv.org/abs/2609.27530", "type": "理论+数值", "summary": "1. 利用Choi映射，即双重希尔伯特空间形式主义，研究了基于一维簇态的平均对称保护拓扑（ASPT）态的命运。\n2. 同样，ASPT 在广泛的选后优势上仍然保持强劲，WSSB 仅在接近预测极限时变得明显，并且在极限本身处精确。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Yoshihito Kuno"}, {"name": "Takahiro Orito"}], "featured_authors": [{"name": "Yoshihito Kuno"}, {"name": "Takahiro Orito"}], "author_count": 2}, {"id": "2609.27565", "category": "quant-ph", "title": "Efficient learning of Clifford disentanglers and typical $t$-doped unitaries with exponentially more $T$ gates", "abstract": "Highly entangled and highly non-stabilizer quantum states need not be hard to learn. We give efficient algorithms for testing and recovering hidden tensor-product structure in unknown pure state vectors of the form $\\lvert\\psi\\rangle = U_C \\bigotimes_i \\lvert\\psi_i\\rangle$, where $U_C$ is an arbitrary unknown Clifford unitary. Although the Clifford can thoroughly scramble the visible product structure, we prove that the Bell distribution retains a characteristic family of quadratic symmetries. By simultaneously block-diagonalising these symmetries, our algorithms linearize the problem and manage to recover both a disentangling Clifford and the hidden partitions with polynomial sample and computational complexity. This may be viewed as an extension of the abelian StateHSP paradigm in which classical post-processing exposes genuinely quadratic structure. Applied to Choi states, the method yields efficient proper learning algorithms for typical $t$-doped Clifford unitaries in regimes containing exponentially more $T$ gates than previously accessible: the required condition fails only for an exponentially small fraction of circuits when $t\\sim n$, and continues to hold for a constant fraction even when $t=2n$. Our framework also provides tools for compressing structured many-body Hamiltonians and suggests benchmarking protocols for encoded logical product states in the early fault-tolerant regime.", "url": "https://arxiv.org/abs/2609.27565", "type": "理论+数值", "summary": "1. 高度纠缠和高度不稳定的量子态并不难学习。\n2. 应用于 Choi 态，该方法为典型的 $t$ 掺杂 Clifford 酉系统生成了有效的正确学习算法，该算法包含比以前可访问的指数更多的 $T$ 门：所需的条件仅在 $t\\sim n$ 时对指数小部分电路失败，并且即使在 $t=2n$ 时也继续保持恒定分数。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Gerard Aguilar"}, {"name": "Sofiene Jerbi"}, {"name": "Jens Eisert"}, {"name": "Lennart Bittel"}], "featured_authors": [{"name": "Gerard Aguilar"}, {"name": "Sofiene Jerbi"}, {"name": "Jens Eisert"}, {"name": "Lennart Bittel"}], "author_count": 4}, {"id": "2609.27662", "category": "quant-ph", "title": "Geometric perspective on quantum Rabi model: Super adiabatic universality and curvature non-adiabatic effects", "abstract": "Quantum Rabi model (QRM) is a fundamental model in light-matter interactions (LMIs), whereas this finite-component system manifests infinite physics to be explored and a full understanding has not yet been reached after a hundred years since it was proposed. In the present work we create a geometric perspective for the QRM by mapping to a curved nanowire system, with curvature-induced spin-orbit coupling (SOC) manipulatable by LMI strength and frequency ratio, which is capable of revealing and perceiving the property universality and diversity from the ground state to the whole spectrum in a unified picture. Indeed, we unveil a super university in the adiabatic regime which manifests a universal scaling of spin texture ubiquitously valid for different couplings, different frequencies and different energy levels. The curve frame also facilitates our finding that a direction changeover of tangential spin swing emerges in the non-adiabatic spin texture in association with the quantum phase transition (QPT) in the QRM, which endows a geometric non-adiabaticity interpretation and connotation to the QPT. We also clarify that, among the curvature-induced effects, the SOC accounts for the spectral bifurcation and oscillations. Our method and analysis, readily generalized to other light-matter models, opens a dialogue between geometry and physics, thus paving a novel way to gain deeper insight into LMIs.", "url": "https://arxiv.org/abs/2609.27662", "type": "理论", "summary": "1. 该工作将量子Rabi模型映射到弯曲纳米线系统，以曲率诱导自旋轨道耦合为纽带，构建统一几何框架来考察从基态到全谱的普适性与多样性。\n2. 其核心在于揭示绝热区超普适的自旋纹理标度律——对不同耦合、频率和能级均成立，并发现非绝热自旋纹理中切向自旋摆动方向翻转与量子相变对应，曲率诱导自旋轨道耦合还解释谱分叉与振荡。\n3. 该几何非绝热性为量子相变提供新诠释，且方法可推广至其他光-物质模型，开启几何与物理对话并为深入理解光-物质相互作用提供新途径。", "summary_source": "deepseek", "authors": [{"name": "Zu-Jian Ying"}], "featured_authors": [{"name": "Zu-Jian Ying"}], "author_count": 1}, {"id": "2609.27703", "category": "quant-ph", "title": "Refuting the QAOA fixed-angle conjecture", "abstract": "The fixed-angle conjecture for the quantum approximate optimisation algorithm (QAOA) is shown to be false for depth-2 QAOA on 9-regular graphs, and proven to be correct for depth-1 on any regular graph, as well, as for any depth on all 2-regular graphs.", "url": "https://arxiv.org/abs/2609.27703", "type": "数值", "summary": "1. 该工作检验了量子近似优化算法（QAOA）的固定角度猜想，在9-正则图上的深度2 QAOA中给出反例，同时在任意正则图的深度1以及所有2-正则图的任意深度下证明该猜想成立。\n2. 其核心在于明确区分了猜想的成立边界：固定角度假设并非普遍成立，而是依赖于QAOA深度与底层图的正则结构，深度2与9-正则图足以推翻，低深度或2-正则图则保持正确。\n3. 这提示QAOA的角度优化与性能保证需结合具体图结构和线路深度，固定角度策略不能作为一般性结论，并为变分量子算法的理论分析与启发式设计提供了反例驱动的约束。", "summary_source": "deepseek", "authors": [{"name": "Lennart Binkowski"}], "featured_authors": [{"name": "Lennart Binkowski"}], "author_count": 1}, {"id": "2609.27792", "category": "quant-ph", "title": "Improved lower bound for the two-way-assisted quantum capacity of the bosonic thermal-loss channel", "abstract": "The bosonic thermal-loss channel is a fundamental model for quantum communication. This Gaussian channel models the transmission of bosonic systems subject to both loss and thermal noise. It describes many practical systems, including optical fibers, waveguides and free-space links, where background thermal noise is significant. Determining the channel's two-way-assisted quantum capacity, the maximum rate at which quantum information can be transmitted reliably through the channel with two-way classical assistance, remains an open problem. Here, we improve upon the best known lower bound for this capacity for a wide range of channel parameters. We achieve this by combining an improved qubit-bosonic distribution technique with a recently introduced technique for discovering entanglement distillation protocols.", "url": "https://arxiv.org/abs/2609.27792", "type": "理论", "summary": "1. 本文改进了玻色热损耗信道的双向辅助量子容量在广泛参数范围内的已知最佳下界，该容量是允许双向经典辅助时可靠传输量子信息的最大速率。\n2. 其技术核心在于将改进的量子比特—玻色分布技术与近期提出的纠缠蒸馏协议发现技术相结合，从而在更宽参数区间获得更优的量子信息传输速率下界。\n3. 该下界有助于评估光纤、波导和自由空间链路等受热噪声影响玻色信道的双向辅助量子通信能力，并表明分布技术与协议发现方法的结合可启发其他高斯信道的研究。", "summary_source": "deepseek", "authors": [{"name": "Matthew Barber"}, {"name": "Stefano Pirandola"}], "featured_authors": [{"name": "Matthew Barber"}, {"name": "Stefano Pirandola"}], "author_count": 2}, {"id": "2609.27801", "category": "quant-ph", "title": "Improved Transversal Non-Clifford Gates from Cup Products", "abstract": "It is a major challenge in quantum fault-tolerance to obtain low-overhead protocols for performing non-Clifford gates. In this vein, we construct quantum codes with low-weight stabilizers that support transversal (i.e. low-depth) implementations of the non-Clifford $C^{r-1}Z$ gate, for every constant $r\\geq 3$. In particular, we obtain length-$n$ quantum LDPC codes (with constant-weight stabilizers) of polynomial distance $d\\geq n^{(1-\\epsilon)/r}$ supporting transversal $C^{r-1}Z$ gates on a close-to-linear number $k\\geq n^{1-\\epsilon}$ of disjoint tuples of logical qubits, for arbitrarily small $\\epsilon>0$. Our construction is the first with constant-weight stabilizers that obtains $dk\\gg n$, and as a consequence achieves arbitrarily small magic state overhead exponent $\\gamma=\\log(n/k)/\\log(d)>0$. Comparable prior constructions instead required at least polylogarithmic stabilizer weight. We also show how to obtain linearly many $k=\\Omega(n)$ logical $C^{r-1}Z$ gates, though with stabilizer weight and physical circuit depth $n^\\epsilon$. We show that our transversal gates also support addressing (i.e. targeting) of specific logical qubits. To obtain our codes, we develop a general transformation based on cup products that maps classical codes satisfying a multiplication property to quantum codes with transversal $C^{r-1}Z$. We apply this transformation to a new family of classical Tanner codes that we construct from punctured tensor products of algebraic codes.", "url": "https://arxiv.org/abs/2609.27801", "type": "理论", "summary": "1. 该工作利用杯积构造低权稳定子量子码，实现对 C^{r−1}Z 非克利福德门的高效横向（低深度）实现，覆盖任意常数 r≥3。\n2. 其核心卖点在于首次以常权稳定子获得 dk≫n：长度 n、距离 d≥n^{(1−ε)/r} 的量子LDPC码可在近线性多组不相交逻辑量子比特 k≥n^{1−ε} 上横向执行 C^{r−1}Z，使魔态开销指数 γ=log(n/k)/log(d) 任意小，且支持寻址，优于以往需多对数权重的方案。\n3. 该杯积变换将满足乘法性质的经典码映射为具横向 C^{r−1}Z 的量子码，并可作用于由代数码打孔张量积所得的新Tanner码，为低开销容错非克利福德门及编码构造提供了通用框架。", "summary_source": "deepseek", "authors": [{"name": "Louis Golowich"}, {"name": "Itzhak Tamo"}, {"name": "Guanyu Zhu"}], "featured_authors": [{"name": "Louis Golowich"}, {"name": "Itzhak Tamo"}, {"name": "Guanyu Zhu"}], "author_count": 3}, {"id": "2609.27906", "category": "quant-ph", "title": "A sharp norm inequality for entanglement-breaking channels", "abstract": "For a channel $\\Phi$ on $M_d$ written in the generalised Bloch parameterisation $r \\mapsto Ar+c$, we prove that entanglement breaking implies $\\|A\\|_*^2 + \\frac{d(d-1)}{2}|c|^2 \\le (d-1)^2$, where $\\|\\cdot\\|_*$ denotes the nuclear norm. The bound is attained in every dimension by the completely dephasing channel, and at $d=2$ by an explicit family with $c\\neq0$. The qubit case reads $\\|A\\|_*^2+|c|^2\\le1$ and extends to full rank a rank-two condition of Ruskai. The proof sharpens Ruskai's bound $\\|A\\|_*\\le1$ by retaining the POVM completeness relation $\\sum_k f_k=0$, which her argument discards; this recentres $A$ from a second moment into a cross-covariance, and is the entire content of the improvement.", "url": "https://arxiv.org/abs/2609.27906", "type": "理论", "summary": "1. 该工作研究有限维信道在广义Bloch参数化 r↦Ar+c 下的纠缠破坏性，证明其蕴含核范数型不等式 ‖A‖_*^2 + d(d-1)/2 |c|^2 ≤ (d-1)^2。\n2. 核心卖点在于证明保留Ruskai论证丢弃的POVM完备关系 ∑_k f_k=0，使A由二阶矩重中心化为互协方差，从而将 ‖A‖_*≤1 加强为含c的尖锐界；该界被完全退相位信道在所有维达到，d=2另有c≠0的显式族达到。\n3. 这一qubit情形 ‖A‖_*^2+|c|^2≤1 将Ruskai的秩二条件推广至满秩，并为用广义Bloch参数刻画纠缠破坏信道提供了尖锐几何约束与后续理论/实验基准。", "summary_source": "deepseek", "authors": [{"name": "Eran Kopel"}], "featured_authors": [{"name": "Eran Kopel"}], "author_count": 1}, {"id": "2609.27908", "category": "quant-ph", "title": "The quantum lifetime of a future-referential feedback loop: certified index, architecture floor, and thermal bonus", "abstract": "A quantum feedback loop that returns information from a forward simulation to an earlier internal time induces a completely positive trace-preserving map on a message register; iterating that map eventually destroys its ability to carry entanglement. The entanglement-breaking index N = n_EB(Phi), the round at which this happens, is studied here along two axes: the interaction and the bath. On the interaction axis we prove that strict contraction onto a full-rank fixed point forces N finite in every dimension, via an explicit separable ball around the limiting Choi state; the qubit closed form overshoots the exact answer by the factor ln(2 sqrt 3) / ln 3 = 1.1309... on isotropic unital channels, and across 3997 sampled channels index and stability gap are one clock, N [1 - rho(A)] in [0.60, 1.50]. On the bath axis, replacing the zero-temperature ancilla by a thermal one at polarisation p = tanh(hbar omega / 2 k_B T) makes every channel quantity an exact quadratic polynomial in p, and the same one-sided certificates (no eigensolver) establish N = 3 at the reference circuit at every temperature, uniformly on a parameter box. The infinite-temperature index is an architecture floor with closed form and exact measure (46.427% of circuits break entanglement in one round however hot the bath). The floor is not a bound: certified circuits dip below it in interior temperature windows, unit-quantised in depth; over 4.1 million circuits their rate follows a Gaussian cutoff in epsilon = 1 - ||A||_2 with exponent 2.02 [1.90, 2.16], and 12 million more certified circuits show valleys surviving to epsilon = 0.125. Certified endpoints make comparisons exact: temperature moves the index by at most 21/14 = 3/2; the interaction moves it by 1213/3.", "url": "https://arxiv.org/abs/2609.27908", "type": "理论+数值", "summary": "1. 该工作研究了未来指涉反馈回路在消息寄存器上迭代完全正迹保持映射所诱导的纠缠破坏指数N，并沿相互作用与热浴两个轴给出可认证的量子寿命刻画。\n2. 其核心卖点是用极限Choi态附近的显式可分球证明满秩不动点下的严格收缩迫使N有限，并将热浴辅助比特极化p=tanh(ħω/2k_BT)时所有信道量化为p的精确二次多项式，从而无需本征求解器即可获得单边证书。\n3. 该工作还给出无穷温架构下限及其精确测度（46.427%电路一轮即断纠缠），并表明该下限并非严格束缚：内部温度窗口可使认证电路低于它，温度至多移动指数3/2而相互作用可移动1213/3，为反馈量子电路热鲁棒性提供基准。", "summary_source": "deepseek", "authors": [{"name": "Eran Kopel"}], "featured_authors": [{"name": "Eran Kopel"}], "author_count": 1}, {"id": "2609.27993", "category": "quant-ph", "title": "Spectral Gap of the Hexagonal AKLT Model via Boundary-State Factorization", "abstract": "We establish a sufficient condition under which overlapping PEPS boundary states satisfy the approximate factorization criterion for a spectral gap. The condition is formulated in terms of the boundary response induced by cutting bonds through the center of a rectangular region. We decompose this response into a contribution common to all four associated regions and a remainder measured in the instantaneous boundary metric. A single linear transport absorbs the common contribution and yields compatible factorization operators, with an error controlled solely by the remainder. We apply this framework to Ising PEPS and to the spin-3/2 AKLT model on the hexagonal lattice. For Ising PEPS, the required boundary-response estimate reduces to a Dobrushin-Shlosman-type condition. For the hexagonal AKLT model, a rooted expansion in paths and loops isolates the common response, while a local comparison of boundary states together with a scalar Kotecký-Preiss estimate controls the remaining terms. In both cases, the factorization error decays exponentially with the overlap width, up to a prefactor proportional to the cut length. For AKLT, we establish the corresponding physical projector estimate and obtain a uniform spectral gap. For Ising PEPS, the gap implication additionally requires compatible injective regional contractions, as specified in the paper. More generally, the method provides a systematic route from locality of PEPS boundary response to spectral gaps of two-dimensional parent Hamiltonians.", "url": "https://arxiv.org/abs/2609.27993", "type": "理论", "summary": "1. 该工作为二维PEPS母哈密顿量的谱隙建立了基于重叠边界态近似因子化的充分条件，并应用于Ising PEPS与六角格自旋3/2 AKLT模型。\n2. 其卖点是把切割中心键引起的边界响应拆成四区域共有项和瞬时边界度量下的余项，用单一线输运吸收共有项，使因子化误差仅由余项控制并随重叠宽度指数衰减，前因子正比切割长度；对六角AKLT进一步建立物理投影算符估计并得到均匀谱隙，而Ising PEPS的谱隙推论还需相容的单射区域收缩。\n3. 这为从PEPS边界响应局域性系统推导二维谱隙提供了通用路线，并可启发张量网络基态与相关模型的严格分析。", "summary_source": "deepseek", "authors": [{"name": "Michael J. Kastoryano"}], "featured_authors": [{"name": "Michael J. Kastoryano"}], "author_count": 1}, {"id": "2609.28058", "category": "quant-ph", "title": "Quantum Advantage in Topological Data Analysis via Mayer Homology", "abstract": "Prior work has explored quantum algorithms for topological data analysis (TDA), revealing the possibility of exponential quantum speedups in estimating the ratios of Betti numbers to the dimension of the combinatorial Laplacian. However, this quantity is only non-vanishing and efficient-to-quantumly-estimate when Betti numbers are exponentially large, a case for which concrete examples are rarely known. Furthermore, certain randomized classical algorithms are sometimes efficient in this regime. Thus, the prospect of achieving quantum advantage in conventional TDA appears fairly narrow. Here, we address these challenges to the quantum advantage in TDA by developing quantum algorithms for Mayer homology, which generalize simplicial homology to $N$-nilpotent boundary operators ($\\partial^N =0$) and have recently been successfully applied to real-world TDA contexts. We introduce an efficient quantum algorithm for estimating Mayer Betti numbers and their persistent counterparts. We then prove that for high-order simplices, Mayer Betti numbers are often exponentially large in the dense regime, which ameliorates the normalization bottleneck of conventional quantum TDA. In the same regime, we argue that existing dequantization algorithms developed for conventional TDA, when applied to Mayer homology, generally lose theoretical guaranties, facing certain structural barriers that prevent their practical utilities. We also provide logical resource estimates revealing that a quantum computer with roughly a few hundred qubits and sixty million Toffoli gates could solve Mayer homology problems beyond the capabilities of known classical approaches. Finally, we discuss real-world applications of Mayer homology in genomics, supersymmetry, drug discovery, and neuroscience, revealing the potential of our quantum algorithm to deliver real-world impacts via Mayer homology.", "url": "https://arxiv.org/abs/2609.28058", "type": "理论+数值", "summary": "1. 该工作针对由N-幂零边界算子定义的Mayer同调，构造了估计Mayer Betti数及其持续版本的量子算法。\n2. 其核心卖点在于证明稠密区高阶单形的Mayer Betti数常随规模指数增大，从而缓解传统量子TDA的归一化瓶颈，并使既有去量子化算法在该设定下失去理论保证；资源估计显示约数百量子比特与六千万Toffoli门即可处理已知经典方法难以企及的问题。\n3. 这为基因组学、超对称、药物发现与神经科学等实际场景中的Mayer同调应用提供了潜在量子优势路径，并提示后续研究应关注稠密区结构与去量子化边界。", "summary_source": "deepseek", "authors": [{"name": "Nhat A. Nghiem"}, {"name": "Ryan Babbush"}, {"name": "Adam Zalcman"}, {"name": "Dominic W. Berry"}, {"name": "Trung V. Phan"}, {"name": "Guo-Wei Wei"}, {"name": "Ryu Hayakawa"}], "featured_authors": [{"name": "Nhat A. Nghiem"}, {"name": "Ryan Babbush"}, {"name": "Adam Zalcman"}, {"name": "Trung V. Phan"}, {"name": "Guo-Wei Wei"}, {"name": "Ryu Hayakawa"}], "author_count": 7}, {"id": "2609.28112", "category": "quant-ph", "title": "Quantum Topological Data Analysis Beyond Betti Numbers: Complexity Hardness $\\&$ An Algorithm for Torsion Witness", "abstract": "Recent advances have revealed an interplay between quantum computing and topological data analysis (TDA). Most quantum TDA has focused on Betti numbers, which characterize the connectivity and ``holes'' of a dataset. Homology, however, contains additional information in the form of torsion: a nontrivial cycle can become trivial after being repeated finitely, revealing global constraints on how cycles combine and wrap around one another. Beyond applications in biomolecular studies, torsion appears in physical settings including homological quantum rotor codes, discrete charges, and gauge sectors. We study torsion from both classical and quantum perspectives. Given a graph $G$ and its clique complex $K = \\mathrm{Cl}(G)$, we first prove that, for fixed $r$ and prime $p$, deciding whether $H_r(K,\\mathbb{Z})$ contains $p$-torsion is NP-hard. As a corollary, when a homological rotor code is specified by $G$, deciding whether the code has a finite-dimensional logical sector of a given order is NP-hard. We discuss related problems, including the Bockstein homomorphism, Smith normal form, lattice saturation, and cohomology. Second, for a finite set of primes $P$, we develop a quantum algorithm that serves as a one-sided torsion witness. For fixed $r$, it outputs WITNESS or INCONCLUSIVE, i.e. WITNESS certifies that either $H_r(K,\\mathbb{Z})$ or $H_{r-1}(K,\\mathbb{Z})$ contains $p$-torsion for some $p\\in P$ while INCONCLUSIVE makes no claim about its presence or absence. We identify a regime in which the algorithm achieves a near-quadratic quantum speedup over the corresponding classical algorithm under the same input model. Our NP-hardness result complements recent hardness results for estimating Betti numbers, adding a complexity-theoretic perspective to quantum TDA. Together, these results demonstrate that integral homology, beyond its Betti numbers, can be computationally challenging.", "url": "https://arxiv.org/abs/2609.28112", "type": "理论+数值", "summary": "1. 该工作研究同调挠元，证明判定团复形整数同调是否含 p-挠元为 NP 难，并提出量子单侧挠元见证算法。\n2. 其卖点是固定 r,p 时判定 H_r(K,Z) 含 p-挠元属 NP 难，并给出同输入模型下近二次加速的量子见证算法。\n3. 这表明积分同调超越贝蒂数后仍具计算困难，为量子 TDA、同调量子转子码与规范扇区研究提供复杂度视角。", "summary_source": "deepseek", "authors": [{"name": "Nhat A. Nghiem"}, {"name": "Dominic W. Berry"}, {"name": "Trung V. Phan"}], "featured_authors": [{"name": "Nhat A. Nghiem"}, {"name": "Dominic W. Berry"}, {"name": "Trung V. Phan"}], "author_count": 3}, {"id": "2609.28136", "category": "quant-ph", "title": "Unbounded Operators, Physicality, and Modality in Quantum Theories", "abstract": "In this paper, I address the problem regarding the physicality of Hilbert space in quantum mechanics, a topic brought into focus by Carcassi et al.'s paper \"The unphysicality of Hilbert spaces\" recently. I argue for the physicality of the Hilbert space in quantum mechanics, and demonstrate that there are inevitable ambiguity and arbitrariness if we want to identify the set of physical states with a proper subset of it. Moreover, I distinguish the ontological and modal reading of physicality from the pragmatic and operational reading of physicality, and then develop what I call the hierarchical view of physicality. According to this view, physicality is not a monolithic concept, but a layered one that admits degrees. I show the connection between the concept of physicality and modal metaphysics, and finally explain how it can be used to address the interpretational problem of quantum field theory brought by the existence of inequivalent representations.", "url": "https://arxiv.org/abs/2609.28136", "type": "理论", "summary": "1. 该文围绕无界算符、物理性与模态，回应Carcassi等对希尔伯特空间非物理性的主张，论证其物理性并提出层级物理性观点。\n2. 其核心论点是：将物理态等同于希尔伯特空间真子集会带来不可避免的歧义与任意性，物理性应区分本体/模态与实用/操作解读且具层级。\n3. 该层级观点联系模态形而上学，并为量子场论中不等价表示导致的解释问题提供概念工具。", "summary_source": "deepseek", "authors": [{"name": "Zhonghao Lu"}], "featured_authors": [{"name": "Zhonghao Lu"}], "author_count": 1}, {"id": "2609.28147", "category": "quant-ph", "title": "Circuit-depth optimization of quantum partial-search algorithms", "abstract": "Grover's algorithm is optimal in terms of oracle queries. We can trade accuracy for speed, which gives rise to the quantum partial-search algorithm. The partial-search algorithm is implemented using two kinds of Grover operators, global and local, where the former is the standard Grover operator for full search and the latter has a diffusion operator acting on the search subspace. The global-local-global sequence, also known as the Grover-Radhakrishnan-Korepin (GRK) algorithm, has been proved optimal in the oracle-query metric. In this work, we show that the alternating sequence of global and local Grover operators, formed by repeatedly applying a fixed product of global and local Grover operators, can achieve a lower expected circuit depth than the GRK algorithm. Through systematic analysis, we obtain its exact success probability, expected depth, and asymptotically optimal parameters. We derive the boundary, characterized by the ratio between the depths of the oracle and the global diffusion operator, separating the depth-optimal and oracle-optimal partial-search algorithms. When the depths of the oracle and the global diffusion operator are comparable, our proposed alternating partial-search sequence can reduce the minimum expected circuit depth by more than 20\\% compared with the GRK algorithm.", "url": "https://arxiv.org/abs/2609.28147", "type": "理论+数值", "summary": "1. 该工作研究量子部分搜索算法的电路深度优化，提出由全局与局部格罗弗算子固定乘积交替构成的序列。\n2. 通过系统分析给出该交替序列的精确成功概率、期望深度与渐近最优参数，并导出区分深度最优与预言机最优的预言机/全局扩散算子深度比边界。\n3. 当预言机与全局扩散算子深度相当时，该交替序列相比格罗弗-拉达克里希南-科雷平算法可将最小期望电路深度降低逾20%，凸显电路深度优化的价值。", "summary_source": "deepseek", "authors": [{"name": "Yan-Bo Jiang"}, {"name": "Xiao-Hui Wang"}, {"name": "Kun Zhang"}, {"name": "Vladimir Korepin"}], "featured_authors": [{"name": "Yan-Bo Jiang"}, {"name": "Xiao-Hui Wang"}, {"name": "Kun Zhang"}, {"name": "Vladimir Korepin"}], "author_count": 4}, {"id": "2609.28229", "category": "quant-ph", "title": "Distilling Datasets into Shallow Circuits for Quantum Machine Learning", "abstract": "In quantum machine learning, training a quantum model requires each sample to be prepared as a quantum state by a loading circuit that must be re-executed for every shot at every training step. The total burden therefore scales with both the number of samples and the cost of preparation. Existing approaches reduce the loading cost of individual inputs or distill data and compress their representations before applying a separate quantum encoding. This separation can leave resulting samples costly to prepare or cause additional loss of the information during subsequent compilation into shallow circuits. We propose quantum dataset distillation (QDD), which distills the full dataset directly into a small set of shallow circuits. Each synthetic sample is parameterized as a staircase circuit corresponding to a low-rank tensor network, making the sample and its loading circuit the same object. The circuit parameters are optimized classically with exact gradients using distribution matching under an explicit loading budget, without post-hoc state-preparation synthesis. On MNIST and Fashion-MNIST, only 10 circuits per class ($0.0017\\times$ the full dataset size) achieve accuracy comparable to full-data training and outperform selection baselines under matched sample and loading budgets. In finite-shot training, QDD reaches 95\\% of the full-data accuracy with more than $100\\times$ fewer cumulative shots. Additionally, we validate QDD on real quantum hardware, demonstrating its practical deployment potential.", "url": "https://arxiv.org/abs/2609.28229", "type": "理论+数值", "summary": "1. 该工作提出量子数据集蒸馏（QDD），把完整数据集直接蒸馏为每类少量浅层电路，使合成样本与其加载电路合为一体，避免样本压缩与态制备编译相分离的流程。\n2. 其关键在于将每个合成样本参数化为对应低秩张量网络的阶梯电路，在显式加载预算下以分布匹配和精确梯度经典优化参数，无需事后的态制备合成。\n3. 在MNIST与Fashion-MNIST上，每类10个电路（0.0017×全数据）即达到与全量训练相当的精度，有限采样下以逾百倍更少的累计采样达到全量精度的95%，并已在真实硬件验证。", "summary_source": "deepseek", "authors": [{"name": "Guang Lin"}, {"name": "Qibin Zhao"}], "featured_authors": [{"name": "Guang Lin"}, {"name": "Qibin Zhao"}], "author_count": 2}, {"id": "2609.28241", "category": "quant-ph", "title": "Beyond Maximal Entanglement: Exact Resources for Multiparty Encrypted Quantum Cloning", "abstract": "Encrypted quantum cloning distributes an unknown $k$-qubit state among $m$ encrypted clones so that no individual clone reveals the input, yet the state can be recovered from any one clone together with a common quantum key. We ask the inverse question: for a fixed encoding architecture, which multipartite pure states can serve as exact resources for this task? For $m\\ge2$, we completely characterize the pure resources compatible with a sector-wise two-Pauli encoder, with necessity holding for arbitrary completely positive trace-preserving (CPTP) recovery maps. For even $m$, exact recovery requires maximal entanglement across the signal--noise cut. For odd $m$, less entanglement can suffice, provided that the surviving signal correlations have the structure selected by the encoder. We further show, without fixing the encoder, that exact recovery from every authorized subsystem already implies perfect concealment of each individual signal and requires at least $(m-1)k$ ebits of signal--noise entanglement. For graph states, the resource classification reduces to an exact condition on the kernel of the signal--noise cut matrix, leading to binary certification and constructive Clifford recovery. We identify rank-deficient graph resources that attain the architecture-independent entanglement bound and prove that the entire Dicke family, including $W$ states, is excluded for every sector-wise two-Pauli encoder. Our results show that encrypted recovery depends not only on how much entanglement a resource contains, but also on how its correlations are organized relative to the encoder.", "url": "https://arxiv.org/abs/2609.28241", "type": "理论", "summary": "1. 加密量子克隆将未知的 $k$ 量子位状态分布在 $m$ 个加密克隆中，这样就不会出现单个克隆泄露输入的情况，但可以使用公共量子密钥从任何一个克隆中恢复该状态。\n2. 对于图状态，资源分类简化为信号-噪声切割矩阵核上的精确条件，从而导致二进制认证和建设性 Clifford 恢复。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Pritam Roy"}, {"name": "Shashank Gupta"}], "featured_authors": [{"name": "Pritam Roy"}, {"name": "Shashank Gupta"}], "author_count": 2}, {"id": "2609.28287", "category": "quant-ph", "title": "Decoherence Tuning in Voltage-Driven Plasmonic Cavities", "abstract": "Strong light-matter coupling offers a powerful framework for modifying molecular structure, dynamics, and optical response, yet achieving this regime at the single-molecule level remains a central challenge. Scanning Tunneling Microscope Break Junctions (STM-BJ) provide a promising route by combining single-molecule addressability with extreme nanoscale field confinement. However, the metallic environment that enables such confinement also introduces substantial plasmonic and excitonic losses, raising the question of how strong coupling can be realized in a metal-molecule-metal junction. Here, we identify the voltage as the key control parameter. We show that the applied bias not only drives the formation of an interfacial exciton through resonant charge transport but also suppresses its coupling to metallic loss channels. Simultaneously, the plasmonic cavity retains extreme mode confinement while the availability of modes is moderately tuned by voltage. Together, these results establish voltage-driven STM-BJs as electrically tunable single-molecule plasmonic cavities and open new routes for using the powerful STM-BJ toolbox, including quantum transport, tracking chemical dynamics, optoelectronics, and molecular-scale quantum control under strong light-matter coupling.", "url": "https://arxiv.org/abs/2609.28287", "type": "理论", "summary": "1. 该工作以扫描隧道显微镜断裂结为平台，将外加偏压作为关键控制参量，研究金属-分子-金属结中电压驱动等离激元腔的退相干调控与单分子强耦合实现条件。\n2. 其核心机制在于：偏压通过共振电荷输运生成界面激子，并同时抑制该激子与金属损耗通道的耦合；等离激元腔仍维持极端模式局域，且模式可用性可被电压适度调节。\n3. 这确立了电压驱动扫描隧道显微镜断裂结作为电可调单分子等离激元腔，并为量子输运、化学动力学追踪、光电子学及强光-物质耦合下的分子尺度量子控制提供新途径。", "summary_source": "deepseek", "authors": [{"name": "Yuchen Wang"}, {"name": "Oliver Tan"}, {"name": "Norah M. Hoffmann"}], "featured_authors": [{"name": "Yuchen Wang"}, {"name": "Oliver Tan"}, {"name": "Norah M. Hoffmann"}], "author_count": 3}, {"id": "2609.28302", "category": "quant-ph", "title": "Improved convergence radius of the Fer expansion for Hermitian generators", "abstract": "The Dyson series expands the propagator of a time-dependent Hamiltonian in powers of the Hamiltonian, but its truncations are in general not unitary. The Fer expansion writes the same propagator as an infinite product of matrix exponentials, each of them unitary, and its remainder decays doubly exponentially with the number of factors. Convergence, however, is guaranteed only within a finite radius: the time integral of the norm of the Hamiltonian must be smaller than $2$. This is the best value known to date. Here we improve it by about $30\\%$, raising it to about $2.6058$.", "url": "https://arxiv.org/abs/2609.28302", "type": "理论+数值", "summary": "1. 该工作研究含时哈密顿量的Fer展开，在生成元为厄米算符时改进其收敛半径，将保证收敛所需的哈密顿量范数时间积分上界从2提升至约2.6058。\n2. 其技术卖点是在保留无穷矩阵指数乘积幺正性和余项双指数衰减的同时，把已知最优收敛条件放宽约30%，且不引入额外近似。\n3. 这一结果拓展了Fer展开在长时演化、强驱动或非微扰量子动力学中的适用窗口，并为构造更高收敛半径的幺正展开提供了可借鉴思路。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo Bagnasacco"}, {"name": "Vittorio Giovannetti"}], "featured_authors": [{"name": "Lorenzo Bagnasacco"}, {"name": "Vittorio Giovannetti"}], "author_count": 2}, {"id": "2609.28318", "category": "quant-ph", "title": "Scalable simulation of non-Markovian quantum transport by stochastic-phase bath reduction", "abstract": "Accurate simulations of non-Markovian quantum transport remain limited to small systems, and a key bottleneck is that each system site requires an independent set of quantum bath orbitals. We introduce the Stochastic Phase Algorithm (SPA), which replaces the independent local Gaussian baths in single-quasiparticle Holstein models by $R$ shared quantum baths with stochastic site-dependent phases. We prove that phase averaging reproduces the target two-point bath correlation matrix for every $R$, while increasing $R$ systematically suppresses errors from higher-order cross-site correlations. We obtain a fixed-time $O(R^{-1})$ trace-norm error bound with a prefactor independent of system size and connectivity. This spatial compression applies directly to unitary baths and can be combined with coupled-Lindblad spectral compression [Phys. Rev. Lett. 136, 090403 (2026)], which represents each shared environment by a very small number of coupled, damped quantum modes fitted to its thermal bath correlation over the simulation window. Numerically, SPA converges against direct unitary benchmarks on a $3\\times3$ lattice, enables full-state-vector quantum-bath dynamics on a $100\\times100$ lattice, and, with $R=1$, closely reproduces near exact benchmarks for exciton populations in bacteriochlorophyll aggregates and carrier mobility in rubrene.", "url": "https://arxiv.org/abs/2609.28318", "type": "理论+数值", "summary": "1. 该工作提出随机相位算法，将单准粒子霍尔斯坦模型中各格点独立的局域高斯浴替换为少量带随机位点相位的共享量子浴，以模拟非马尔可夫量子输运。\n2. 其关键在于证明相位平均对任意共享浴数均精确复现目标两点浴关联矩阵，增大共享浴数可系统压制高阶跨位点关联误差，并给出固定时间迹范数误差以共享浴数倒数收敛且前置因子不依赖系统尺寸与连接度的上界。\n3. 该空间压缩可直接用于幺正浴并与耦合林德布拉德谱压缩结合，支撑三乘三晶格收敛、一百乘一百晶格的全态矢量量子浴动力学，以及单共享浴下细菌叶绿素聚集体激子布居与红荧烯载流子迁移率的近精确重现。", "summary_source": "deepseek", "authors": [{"name": "Zhen Huang"}, {"name": "Lin Lin"}, {"name": "Pinchen Xie"}], "featured_authors": [{"name": "Zhen Huang"}, {"name": "Lin Lin"}, {"name": "Pinchen Xie"}], "author_count": 3}, {"id": "2609.28326", "category": "quant-ph", "title": "Bridging two families of non-Hermiticity: from non-reciprocal couplings to an imaginary potential using the Lanczos transformation", "abstract": "Two types of non-Hermiticity found in physical systems, i.e., non-reciprocal couplings and complex potentials, have gained considerable interest recently. The former leads to the non-Hermitian skin effect, while the latter gives rise to a range of non-Hermitian symmetries such as parity-time ($PT$) and particle-hole symmetries. Although these two non-Hermitian forms have been incorporated in the same models, so far they have been treated as distinct families of non-Hermiticity. In this work, we establish an isospectral mapping between them using the Lanczos transformation. More specifically, we show that a generalized Hatano-Nelson model $H$ with non-reciprocal and spatially varying couplings can be mapped to a tight-binding model $H_L$ with real symmetric couplings and an imaginary on-site potential. This result holds even when the original $H$ already has an imaginary potential and exceptional points. Our work provides a refreshed understanding of the connection between different forms of non-Hermiticity. It also offers an approach to obtaining an intuitive physical understanding of exceptional points in $H_L$ that are elusive in $H$. Finally, our findings also warrant a versatile approach to constructing non-Hermitian systems with a complex potential and a real spectrum, without $PT$ symmetry.", "url": "https://arxiv.org/abs/2609.28326", "type": "理论", "summary": "1. 该工作用Lanczos变换，将含非互易与空间变化耦合的广义Hatano-Nelson模型等谱映射为实对称耦合加虚位势的紧束缚模型。\n2. 卖点在于该等谱映射在原始模型已有虚势和例外点、且耦合非互易并空间变化时依然成立。\n3. 这为理解H_L中直观而在H中难见的例外点提供途径，并可构造无PT对称却具复势与实谱的非厄米系统。", "summary_source": "deepseek", "authors": [{"name": "Li Ge"}], "featured_authors": [{"name": "Li Ge"}], "author_count": 1}, {"id": "2609.28351", "category": "quant-ph", "title": "Multipartite GHZ diagonal states and their entanglement properties", "abstract": "In this paper, we investigate the family of GHZ diagonal states, which are mixed multipartite quantum states that are diagonal in a GHZ type basis. We show that the class of GHZ diagonal states is highly symmetric and exhibits rich entanglement properties, making it relevant for applications in multipartite quantum key distribution.", "url": "https://arxiv.org/abs/2609.28351", "type": "理论", "summary": "1. 该工作系统考察了在GHZ型基下对角的多体混合量子态族，即GHZ对角态，并刻画其高度对称的结构与丰富的纠缠性质。\n2. 其核心贡献在于证明该态类在GHZ基下对角这一约束下仍保持高度对称，并揭示其内部存在丰富的纠缠层级，为多体纠缠的分析提供结构明确的对象。\n3. 这些性质使GHZ对角态自然适用于多体量子密钥分发等协议，也为多体纠缠的进一步判定、量化与实验实现提供了启发与可推广的态类参考。", "summary_source": "deepseek", "authors": [{"name": "Luka Burduli"}, {"name": "Johannes Moerland"}, {"name": "Peter Schupp"}], "featured_authors": [{"name": "Luka Burduli"}, {"name": "Johannes Moerland"}, {"name": "Peter Schupp"}], "author_count": 3}, {"id": "2609.28367", "category": "quant-ph", "title": "The Minimal Dimension of Entangled-Noise Advantage", "abstract": "Can entangled noise erase entanglement more efficiently than separable noise? Standard robustness restricts the added noise to separable states; generalized robustness allows any state. We prove that the two costs coincide for every two-qubit state and give an explicit full-rank qubit--qutrit state with a strict gap. Positivity under partial transpose (PPT) characterizes separability in both dimensions, so the boundary is not caused by a failure of the PPT criterion. Instead, product-vector geometry permits a rank-one bridge between the two-qubit dual optimizations and supplies a two-dimensional completely entangled subspace for the qubit--qutrit separation. Local isometric embeddings complete the finite-dimensional bipartite classification, also for any fixed multipartite cut. Combined with known three-qubit separation, the result classifies universal equality relative to full separability in all finite multipartite systems.", "url": "https://arxiv.org/abs/2609.28367", "type": "理论+数值", "summary": "1. 该工作比较标准鲁棒性与广义鲁棒性，证明所有两量子比特态中可分离噪声与纠缠噪声的擦除代价相同，并构造满秩的二能级-三能级态展示严格间隙。\n2. 其卖点在于指出该间隙不源于正部分转置判据失效，而由乘积向量几何提供秩一桥接与二维完全纠缠子空间，并经局域等距嵌入完成有限维二分及任意固定多分划的分类。\n3. 结合已知三量子比特分离，该结果可判定所有有限多体系统相对全可分离性是否普遍等号成立，为纠缠噪声优势给出最小维度下界与结构启示。", "summary_source": "deepseek", "authors": [{"name": "Xiao-Ke Wang"}, {"name": "Zi-Yuan Liu"}, {"name": "Ming-Yang Li"}, {"name": "Shengjun Wu"}, {"name": "Zeng-Bing Chen"}], "featured_authors": [{"name": "Xiao-Ke Wang"}, {"name": "Zi-Yuan Liu"}, {"name": "Ming-Yang Li"}, {"name": "Shengjun Wu"}, {"name": "Zeng-Bing Chen"}], "author_count": 5}, {"id": "2609.28461", "category": "quant-ph", "title": "Purely-logarithmic-time- and constant-space-overhead fault-tolerant quantum computation", "abstract": "We prove that constant-space-overhead fault-tolerant quantum computation can be achieved with provably strictly logarithmic time overhead, improving over the best known results with additional subpolylogarithmic factors. Our main construction uses polynomial-subrank transversal logical $\\CCZ$ gates on good quantum locally testable codes to implement addressable universal computation by transferring batches of logical qubits between dense storage and active logical subspaces while reusing the same ancillary workspace. Logical $\\CCZ$ gates are implemented directly by the transversal operation, so only stabilizer resource states require separate preparation. Furthermore, we give an alternative construction that also achieves purely logarithmic time overhead based on modifying the quantum Reed--Solomon magic-state distillation scheme of Nguyen and Pattison. Recursively applying a fixed distillation circuit protected by qLTCs of increasing block length eliminates the subpolylogarithmic time factor.", "url": "https://arxiv.org/abs/2609.28461", "type": "理论", "summary": "1. 我们证明，恒定空间开销的容错量子计算可以通过可证明的严格对数时间开销来实现，通过额外的次多对数因子改进已知的结果。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Zhengyi Han"}, {"name": "Zi-Wen Liu"}], "featured_authors": [{"name": "Zhengyi Han"}, {"name": "Zi-Wen Liu"}], "author_count": 2}, {"id": "2609.28469", "category": "quant-ph", "title": "Compressed Permutation Oracles Revisited", "abstract": "The compressed permutation oracle has been used to analyze the quantum security of a number of cryptographic constructions which resisted prior techniques. However, these analyses were fundamentally limited by the poor soundness of the method: the technique was proven sound only up to $O(N^{1/12})$ queries to permutations on $N$ elements. We revisit this analysis, improving the soundness bound to a tight $\\Omega(N^{1/2})$. In addition to being tighter, our proof is conceptually simpler and more direct, and gives the same bound in the ideal cipher model. The main technical idea is to construct the compression isometry from a simple POVM on the naive purification, a technique which may find wider applications. As immediate applications, our results yield tight, concrete collision and pre-image lower bounds for the sponge hash construction underlying SHA3 and the Davies--Meyer compression function used in SHA1 and SHA2. More broadly, the improved soundness theorem provides a general-purpose tool for analyzing quantum security in settings where random permutations or ideal ciphers serve as the underlying primitive.", "url": "https://arxiv.org/abs/2609.28469", "type": "理论", "summary": "1. 该工作重新审视压缩置换预言机，将量子安全分析中的可靠性界从 O(N^{1/12}) 次查询提升至紧的 Ω(N^{1/2})。\n2. 核心技巧是用朴素纯化上的简单 POVM 构造压缩等距，证明更简洁直接，并在理想密码模型中保持相同界。\n3. 由此可直接导出 SHA3 海绵哈希及 SHA1/SHA2 的 Davies–Meyer 压缩函数的紧碰撞与原像下界，并为随机置换或理想密码下的量子安全分析提供通用工具。", "summary_source": "deepseek", "authors": [{"name": "Joseph Carolan"}, {"name": "Christian Majenz"}], "featured_authors": [{"name": "Joseph Carolan"}, {"name": "Christian Majenz"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
