ation induced by a high-field circular terahertz (THz) drive and its effect on the spin system of EuTiO$_3$ using X-rays. This material exhibits an optical response consistent with the putative magnetic signal observed in related non-magnetic materials. Furthermore, the presence of Eu$^{2+}$ ions enables the use of X-ray magnetic circular dichroism (XMCD) to test for the creation of transient spin polarization. Simultaneously, ultrafast X-ray diffraction (XRD) measures the circular ionic motion from which we determine the mechanical angular momentum. We find a classical ionic contribution of $3\\times10^{-8}~\\mu_B$ from XRD and upper limits of $0.03~\\mu_B$ and $0.11~\\mu_B$ from the sensitivity of XMCD at the europium $M_5$ and $L_2$ edges, probing the $4f$ and $5d$ shells of Eu$^{2+}$, respectively. These observations show that large-amplitude circular ionic motion in this system is not accompanied by a detectable spin polarization despite the clear signature in the optical data, with the XMCD upper bounds and classical contribution differing by many orders of magnitude.", "url": "https://arxiv.org/abs/2609.28214", "type": "理论", "summary": "1. 该工作利用高场圆偏振太赫兹驱动EuTiO₃，结合X射线磁圆二色与超快X射线衍射，直接检验相干圆离子运动与自旋极化之间的关系。\n2. 其技术卖点在于同步测定圆离子运动的机械角动量并检验自旋极化：衍射定出的经典离子贡献仅3×10⁻⁸ μB，而X射线磁圆二色对Eu²⁺的4f和5d壳层分别给出0.03 μB和0.11 μB的上限。\n3. 尽管光学响应清晰，该结果说明大振幅圆离子运动并不伴随可探测的自旋极化，提示螺旋度相关信号可能并非源于瞬态磁化，为辨析动态多铁性提供严格约束。", "summary_source": "deepseek", "authors": [{"name": "Clifford J. Allington"}, {"name": "Matthew J. Lutz"}, {"name": "Enoch"}, {"name": "Fabian Graf"}, {"name": "Martina Basini"}, {"name": "Hiroki Ueda"}, {"name": "Michael Grimes"}, {"name": "Alexander B. Elliott"}, {"name": "Megan F. Biggs"}, {"name": "Ravi Finn"}, {"name": "Shih-Wen Huang"}, {"name": "Merideth A. Henstridge"}, {"name": "Matthias C. Hoffmann"}, {"name": "Takahiro Sato"}, {"name": "Roberto Alonso-Mori"}, {"name": "Diling Zhu"}, {"name": "Quynh L. Nguyen"}, {"name": "Vincent Esposito"}, {"name": "Jeffrey T. Babicz Jr."}, {"name": "Elizabeth Skoropata"}, {"name": "Biaolong Liu"}, {"name": "Eugenio Paris"}, {"name": "Arnau Romaguera Camps"}, {"name": "Elia Razzoli"}, {"name": "Roman Mankowsky"}, {"name": "Flavio Capotondi"}, {"name": "Nicolas Jaouen"}, {"name": "Daniele Pergolesi"}, {"name": "Milan Radovic"}, {"name": "Matteo Savoini"}, {"name": "Steven L. Johnson"}, {"name": "Jeremy A. Johnson"}, {"name": "Urs Staub"}], "featured_authors": [{"name": "Clifford J. Allington"}, {"name": "Matthew J. Lutz"}, {"name": "Enoch"}, {"name": "Steven L. Johnson"}, {"name": "Jeremy A. Johnson"}, {"name": "Urs Staub"}], "author_count": 33}, {"id": "2609.28268", "category": "cond-mat", "title": "Three-photon photoemission on metallic transition metal dichalcogenide NiTe$_{2}$", "abstract": "Three-photon photoemission (3PPE) signals on NiTe$_{2}$ are observed for the first time upon ultraviolet excitations. In the energy range beyond two-photon excitations, an energy-momentum dispersive feature is clearly identified with characteristic light polarization dependence. Based on its dispersion, spectral width, as well as intensity as a function of the parallel momentum, this dispersive 3PPE feature could be ascribed to an image potential resonance overlapping with an unoccupied Ni $4s$ -Te $4d$/$5p$ bulk band in accordance with the electronic band structure. Our results underlie higher-order non-linear photoemission on metallic transition metal dichalcogenides and facilitate future ultrafast studies of coherent electron dynamics in anisotropic, two-dimensional systems.", "url": "https://arxiv.org/abs/2609.28268", "type": "理论", "summary": "1. 该工作首次在紫外激发下观测到金属性过渡金属二硫族化物 NiTe2 的三光子光电子发射信号，并在双光子激发能量之上识别出清晰的能量-动量色散特征。\n2. 其关键在于依据色散、谱宽以及强度随平行动量的变化并结合光偏振依赖，将该特征归因于镜像势共振与未占据 Ni 4s-Te 4d/5p 体带的重叠，且与电子能带结构一致。\n3. 这奠定了金属性过渡金属二硫族化物中高阶非线性光电发射的基础，并推动未来各向异性二维体系中相干电子动力学的超快研究。", "summary_source": "deepseek", "authors": [{"name": "Cheng-Tien Chiang"}, {"name": "Mukesh Singh"}, {"name": "Yu-Jhen Chuang"}, {"name": "Chia-Nung Kuo"}, {"name": "Prabesh Bista"}, {"name": "Yu-Chan Lin"}, {"name": "Chen-Bin Huang"}, {"name": "Ming-Chiang Chung"}, {"name": "Chin Shan Lue"}], "featured_authors": [{"name": "Cheng-Tien Chiang"}, {"name": "Mukesh Singh"}, {"name": "Yu-Jhen Chuang"}, {"name": "Chen-Bin Huang"}, {"name": "Ming-Chiang Chung"}, {"name": "Chin Shan Lue"}], "author_count": 9}, {"id": "2609.28330", "category": "cond-mat", "title": "Topological Fingerprints of Commensurate Order in Twisted Moiré Lattices", "abstract": "Moiré patterns in twisted bilayer materials exhibit long-range periodic order that is highly sensitive to twist angle. Identifying commensurate angles from real-space atomic structures remains challenging, as spectral and geometric methods emphasize global periodicity and are sensitive to disorder and finite-size effects. Here, we introduce a data-driven topological framework that quantifies moiré periodicity by treating atomic configurations as point-cloud data and extracting multiscale signatures using persistent homology. At the core of our approach is a small-neighborhood separation filter that removes redundant local motifs in persistence diagrams while preserving key structural features, enabling sharp minima in Wasserstein distances between twisted and untwisted reference configurations that accurately recover commensurate angles. We benchmark this framework against geometric and spectral similarity measures and show that the resulting topological descriptors remain stable under positional disorder ranging from weak to strong perturbations in the bond length. We further transfer these descriptors using a constrained Gaussian process surrogate to sparsely sampled configurations of a twisted MoTe$_2$ dichalcogenide bilayer. These results establish topological descriptors with neighborhood separation as a robust framework for identifying commensurate order in moiré systems and tracking commensurate structural similarity under disorder, sparsity, and finite-size effects.", "url": "https://arxiv.org/abs/2609.28330", "type": "理论", "summary": "1. 该工作提出数据驱动拓扑框架，将扭转莫尔体系的原子构型视为点云，用持续同调提取多尺度特征，从实空间结构识别公度角。\n2. 其卖点在于小邻域分离滤波器，可在持续图中去除冗余局域基元而保留关键结构特征，使扭转与未扭转参考构型间的瓦瑟斯坦距离出现尖锐极小值，从而准确恢复公度角，并在弱至强键长无序下相较几何与谱度量更稳定。\n3. 该框架进一步经受约束高斯过程代理迁移至稀疏采样的二碲化钼扭转双层构型，表明拓扑描述符结合邻域分离可用于在无序、稀疏与有限尺寸效应下识别莫尔公度序并追踪其结构相似性。", "summary_source": "deepseek", "authors": [{"name": "Collin J. Kovacs"}, {"name": "Jiangxu Li"}, {"name": "Yang Zhang"}, {"name": "Konstantinos D. Vogiatzis"}, {"name": "Adrian Del Maestro"}, {"name": "Vasileios Maroulas"}], "featured_authors": [{"name": "Collin J. Kovacs"}, {"name": "Jiangxu Li"}, {"name": "Yang Zhang"}, {"name": "Konstantinos D. Vogiatzis"}, {"name": "Adrian Del Maestro"}, {"name": "Vasileios Maroulas"}], "author_count": 6}, {"id": "2609.28436", "category": "cond-mat", "title": "Cooperative Domain-Wall Dynamics in a Two-Dimensional Quasiclassical Holstein Model", "abstract": "We investigate charge-density-wave (CDW) coarsening in a two-dimensional quasiclassical Holstein model following thermal quenches into the ordered phase. Although the staggered CDW order parameter is nonconserved, domain-wall motion remains constrained by conservation of the microscopic electronic charge. The simulations exhibit apparent growth exponents between $1/4$ and the Allen--Cahn value $1/2$. These apparent exponents are primarily accounted for by the crossover kinetics $\\dot{L}=[D(T)/L][1+L_\\times^2(T)/L^2]$, where $L_\\times(T)$ is a temperature-dependent crossover length. At low temperature, nearly binary occupations require compatible wall segments to rearrange cooperatively, producing the $L(t)\\sim t^{1/4}$ limit. Thermal broadening creates partially occupied interfacial sites that permit local curvature-driven motion and restore $L(t)\\sim t^{1/2}$ at late times. Fits to the measured growth rate, a dimensionless rate collapse, and a long-time large-system simulation consistently support this crossover picture. These results show that a microscopic conservation law can generate long-lived anomalous coarsening even when the emergent order parameter is nonconserved.", "url": "https://arxiv.org/abs/2609.28436", "type": "理论+数值", "summary": "1. 该工作在二维半经典Holstein模型中模拟热淬火后CDW粗化，研究非守恒序参量下受电荷守恒约束的畴壁动力学。\n2. 其核心是表观指数1/4–1/2源于温度依赖交叉长度：低温协同重排给出t^{1/4}，升温后界面部分占据允许曲率驱动并恢复t^{1/2}。\n3. 这表明微观守恒律可使非守恒涌现序参量出现长寿命反常粗化，为CDW材料淬火实验与粗化理论提供启示。", "summary_source": "deepseek", "authors": [{"name": "Arunangshu Bora"}, {"name": "Sankha Subhra Bakshi"}, {"name": "Ho Jang"}, {"name": "Gia-Wei Chern"}], "featured_authors": [{"name": "Arunangshu Bora"}, {"name": "Sankha Subhra Bakshi"}, {"name": "Ho Jang"}, {"name": "Gia-Wei Chern"}], "author_count": 4}, {"id": "2609.28448", "category": "cond-mat", "title": "Nonequilibrium Phases of Repulsive Self-Attention: Chaos, Attention Condensation, and Emergent Locality", "abstract": "We study the nonequilibrium dynamics of a minimal recurrent transformer with $N$ normalized tokens, $Q=K=I$, and a negative value map $V=-I$. Similarity-based attention selects nearby representations, while the negative value map drives tokens away from the selected field. This feedback can continually reorganize both the representation geometry and the attention network. For $d=2$, the tokens lie on a circle, where the regular polygon is an exact fixed point. As the attention feedback strength $\\gamma$ is increased, the polygon loses stability through a flip bifurcation, giving rise to period-two motion, chaos, and cluster-exchange or cluster-flip states. Despite this temporal complexity, attention remains diffuse as $N\\to\\infty$ at finite fixed softmax sharpness $\\beta$. Attention condensation instead emerges in the scaling regime $\\beta\\sim N^2$. In the hard-routing limit, repulsive updates amplify local perturbations and routing-partner switches transmit them ballistically, producing an emergent butterfly cone in representation space. High-dimensional geometry provides a distinct route to localization. For $d=N\\to\\infty$, simulations from Gaussian initial conditions provide evidence for a condensation transition at $\\beta=O(1)$, driven by dynamically generated finite overlap gaps. Depending on $\\gamma$, the resulting phases include diffuse simplex-like states, consensus flips, condensed active routing with signatures of chaos, and fragmented cluster flips. These results establish temporal activity, attention condensation, and geometric clustering as distinct collective phenomena, and show that sparse attention can sustain persistent dynamics rather than freeze it.", "url": "https://arxiv.org/abs/2609.28448", "type": "理论+数值", "summary": "1. 该文研究了排斥自注意力最小循环 transformer 的非平衡动力学，刻画混沌、注意力凝聚与涌现局域性。\n2. 关键在于揭示反馈强度、softmax 锐度与维度如何调控弥散-凝聚转变，且硬路由下局部扰动经伙伴切换弹道传播形成蝴蝶锥。\n3. 这确立了时间活动、注意力凝聚与几何聚类为不同集体现象，并表明稀疏注意力可维持持续动力学而非冻结。", "summary_source": "deepseek", "authors": [{"name": "Qucheng Gao"}, {"name": "Zuyi Yang"}, {"name": "Xiao Chen"}], "featured_authors": [{"name": "Qucheng Gao"}, {"name": "Zuyi Yang"}, {"name": "Xiao Chen"}], "author_count": 3}, {"id": "2609.26827", "category": "hep-th", "title": "Comment on \"Ultraviolet Completion of the Big Bang in Quadratic Gravity\"", "abstract": "We examine the round Euclidean no-boundary saddle proposed by Liu, Quintin, and Afshordi in \"Ultraviolet Completion of the Big Bang in Quadratic Gravity.\" For a free, massless, conformal realization of their large matter sector, the omitted type-A trace anomaly contributes at leading order in the matter multiplicity. Within the one-loop renormalization-group-improved pure quadratic truncation, both the sphere effective action and the local trace equation show that a stationary point of the running $R^2$ coupling supports a round sphere only if the total Euler anomaly coefficient vanishes. Using the proposed beta function, we further find that no real stationary coupling ratio exists when this coefficient exceeds $79/420$, a bound violated parametrically by the assumed matter sector when the remaining gravitational contributions are perturbatively controlled and of order unity. The local obstruction also applies to a round half-sphere and cannot be removed by shifting its radius. Under these assumptions, the proposed round starting geometry and its stated continuation to Lorentzian inflation are excluded, without ruling out inflation from other initial conditions.", "url": "https://arxiv.org/abs/2609.26827", "type": "理论", "summary": "1. 该评论针对Liu、Quintin与Afshordi提出的二次引力中宇宙大爆炸紫外完备方案，重新审查其圆形欧几里得无边界鞍点。\n2. 其核心在于计入被忽略的A型迹反常：在重整化群改进的纯二次截断中，圆球鞍点需总欧拉反常系数为零；用其β函数，该系数超79/420时无实定常耦合比。\n3. 因此，在文中所设假设下，所提圆球起始几何及其向洛伦兹暴胀的延拓被排除，但不排除其他初始条件引发暴胀。", "summary_source": "deepseek", "authors": [{"name": "Mark A. Shinn"}], "featured_authors": [{"name": "Mark A. Shinn"}], "author_count": 1}, {"id": "2609.26831", "category": "hep-th", "title": "Ordered exponentials and the effective currents of high energy gravity", "abstract": "We derive a Lipatov type effective action for the Reggeized gravitons. In place of the order by order construction of the effective currents from diffeomorphism invariance, we propose a current which is a single ordered exponential $W_{ij}$ along the light cone, generated by the optical tidal matrix integrated once. The nested ordering of it reproduces the known perturbative answer with some new terms added. These new terms are non-local along the light cone and have a structure which the diffeomorphism construction cannot produce, the form of the third order current is also calculated. The effective action, the current to Reggeon vertex and the current to current interaction follow in closed form, in three equivalent writings, one of them covariant. Generally defined $W_{ij}$ reduces to four parameters of the ray bundle, its density, its shear, the orientation of the shear and a rotation of the image. The effective current uses three of them, being the second light cone derivative of a single scalar, it is not sensitive to the orientation. Comparing with the standard eikonal gravitational Wilson line, which is the phase, $W_{ij}$ is the Hessian of the same eikonal: it carries the shear and the focusing that the Abelian phase does not, and it is inverse to the Jacobi propagator of the congruence at first order in the field. A generalization of the proposed ordered operator is discussed as well as applications of the gravitational effective action.", "url": "https://arxiv.org/abs/2609.26831", "type": "理论", "summary": "1. 该工作为Reggeized引力子导出Lipatov型有效作用量，并以沿光锥的有序指数W_ij取代按微分同胚不变性逐阶构造有效流。\n2. 该指数由光学潮汐矩阵一次积分生成，嵌套排序重现已知微扰结果，并给出微分同胚构造无法产生的光锥非局域新项与闭合的流—Reggeon顶点。\n3. W_ij是同一eikonal的Hessian，携带阿贝尔相位所无的剪切与聚焦，最低阶与Jacobi传播子互逆，为高能引力有效描述及其推广提供框架。", "summary_source": "deepseek", "authors": [{"name": "Sergey Bondarenko"}], "featured_authors": [{"name": "Sergey Bondarenko"}], "author_count": 1}, {"id": "2609.26875", "category": "hep-th", "title": "Collapse to extremality: The third law of black hole thermodynamics in quantum gravity", "abstract": "We present a two-step construction to violate the classical third law of black hole thermodynamics for charged black holes in four dimensions. A near-extremal black hole with an $\\mathrm{AdS}_2\\times X$ throat is first prepared and then driven to extremality in finite time by a charged shell. This construction suggests that the second step is universal for near-extremal black holes, and can be used to construct violations of the third law for Kerr black holes. The same description allows us to study the process in quantum gravity. The classical collapse condition selects a BF-violating matter sector, for which we construct a holographic dictionary and derive the quantum transition amplitude. Quantum effects replace the classical extremal endpoint by a probability distribution that vanishes at extremality and peaks at positive energy. This obstruction is consistent with the absence of non-supersymmetric extremal black hole states in quantum gravity. We show that driving the peak close enough to extremality for quantum gravity to become important requires a preparation time that scales with the black hole entropy.", "url": "https://arxiv.org/abs/2609.26875", "type": "理论", "summary": "1. 我们提出了一种两步构造，以违反四维带电黑洞的经典黑洞热力学第三定律。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Gustavo J. Turiaci"}, {"name": "Chih-Hung Wu"}], "featured_authors": [{"name": "Gustavo J. Turiaci"}, {"name": "Chih-Hung Wu"}], "author_count": 2}, {"id": "2609.26883", "category": "hep-th", "title": "Asymptotic limits in class-$\\mathcal{S}$ theories and non-Abelian Hodge theory", "abstract": "We develop a non-Abelian Hodge-theoretic refinement of asymptotic limits in type-$A$ class-$\\mathcal S$ theories, enriching the geometric description of the degenerating UV curve with gauge-theoretic data encoded by the associated Hitchin system. A degeneration of the UV curve produces a long plumbing tube, which we equip with the local monodromy data of a Hitchin-Simpson flat connection admitting a regular-singular logarithmic model. The semisimple and unipotent parts of the monodromy govern, respectively, the power-law and logarithmic growth of flat sections through the tube. Combining this non-Abelian holonomy with the geometric Picard-Lefschetz monodromy yields a decorated cusp label that incorporates Higgs-bundle information and extends tube-wise to intersections of boundary divisors. For each tube, we require the weak gauge algebra specified by the fixture and gluing data to lie in the reductive monodromy centralizer. In type $A$, we organize the local monodromy labels into discrete types specified by the eigenspace multiplicities of the semisimple part and the Jordan type of the nilpotent logarithm of the unipotent part. Finally, we illustrate the construction for $SL(3,\\mathbb C)$ on the four-punctured sphere and $SL(4,\\mathbb C)$ on the two-punctured torus.", "url": "https://arxiv.org/abs/2609.26883", "type": "理论", "summary": "1. 我们在 type-$A$ class-$\\mathcal S$ 理论中开发了渐近极限的非阿贝尔霍奇理论细化，用相关希钦系统编码的规范理论数据丰富了退化 UV 曲线的几何描述。\n2. 最后，我们说明了四穿孔球体上 $SL(3,\\mathbb C)$ 和两穿孔环面 $SL(4,\\mathbb C)$ 的构造。\n3. UV 曲线的退化产生了一个长的管道，我们为它配备了允许正则奇异对数模型的希钦-辛普森平面连接的局部单向数据。", "summary_source": "local-fallback", "authors": [{"name": "Thomas W. Grimm"}, {"name": "Amineh Mohseni"}], "featured_authors": [{"name": "Thomas W. Grimm"}, {"name": "Amineh Mohseni"}], "author_count": 2}, {"id": "2609.26914", "category": "hep-th", "title": "Maximal Total Quantum Dimension at Bounded Rank in Dijkgraaf-Witten Theories", "abstract": "We investigate the maximal total quantum dimension at a bounded categorical rank cutoff $R$ in three-dimensional Dijkgraaf--Witten theories. This optimization problem physically governs the maximal state-optimized torus topological entanglement entropy at a fixed torus ground-state degeneracy, while providing a quantitative constraint on the search space required to classify these topological order phases. We analyze how topological twists (3-cocycles) and gauge-group structures independently govern this trade-off. For elementary-Abelian gauge groups at a fixed prime $p$, we prove that introducing cocycle twists elevates the maximum total quantum dimension from square-root growth $\\Theta_p(R^{1/2})$ to linear growth $\\Theta_p(R)$ in the rank cutoff, driven by the geometric protection of cyclic holonomies. For untwisted theories, we establish sharp envelopes for symmetric and alternating gauge groups, and derive group-theoretic bounds across almost-simple, solvable, and radical-free families. In particular, almost-simple groups and their direct products obey a quadratic-logarithmic upper envelope: $\\log\\mathcal{D} = O((\\log R)^2)$. Finally, we compare these scales against WZW models and discuss the status of the general quadratic-logarithmic envelope conjecture.", "url": "https://arxiv.org/abs/2609.26914", "type": "理论", "summary": "1. 该工作研究了三维Dijkgraaf-Witten理论在范畴秩截断R下总量子维数的最大值问题，并将其与固定环面基态简并时的最大态优化环面拓扑纠缠熵以及拓扑序分类所需搜索空间联系起来。\n2. 主要结论是：对固定素数p的基本阿贝尔规范群，引入3-上循环扭曲后，最大总量子维数由Θ_p(R^{1/2})的平方根增长提升为Θ_p(R)的线性增长，机制是循环和乐的几何保护；未扭曲情形下给出对称群与交错群的尖锐包络，并对几乎单、可解、无根族群导出群论上界，其中几乎单群及其直积满足log D = O((log R)^2)。\n3. 该标度分类既为拓扑序相的搜索与分类提供了定量约束，又通过与WZW模型的比较为一般二次对数包络猜想给出了可检验方向。", "summary_source": "deepseek", "authors": [{"name": "Ce Shen"}], "featured_authors": [{"name": "Ce Shen"}], "author_count": 1}, {"id": "2609.27026", "category": "hep-th", "title": "A note on gauge-covariant vertex operators of the ambitwistor string", "abstract": "We construct gauge-covariant unintegrated vertex operators in an antighost-independent subcomplex of the bosonic ambitwistor string. For a linearized gauge field, a world-sheet ghost-derivative term completes the standard vertex so that BRST closure imposes $\\p^nF_{nmI}=0$ without the Lorenz condition. In the rank-two sector we use an antighost-free ansatz that is sufficient to isolate a diffeomorphism-invariant spin-two subsector. After eliminating auxiliary fields and consistently setting the antisymmetric and scalar combinations to zero, BRST closure gives $R_{mn}=0$ without imposing transversality. We distinguish this construction from the full relative BRST cohomology of the bosonic ambitwistor string, whose additional antighost-dependent states lead to the known higher-derivative spectrum.", "url": "https://arxiv.org/abs/2609.27026", "type": "理论", "summary": "1. 该文在玻色 ambitwistor 弦的反鬼场无关子复形中构造了规范协变的未积分顶点算子，并系统分析其 BRST 闭包条件。\n2. 对线性化规范场，引入世界面鬼场导数项补全标准顶点，使 BRST 闭包在不施加洛伦兹条件时即给出 ∂^n F_{nmI}=0；在秩二扇区采用无反鬼场拟设分离出微分同胚不变的 spin-2 子扇区，消去辅助场并将反对称与标量组合置零后，闭包给出 R_{mn}=0 而无需横性条件。\n3. 该构造与玻色 ambitwistor 弦完整的相对 BRST 上同调不同，后者依赖反鬼场的额外态并导致已知高阶导数谱，表明子复形的选取直接决定所得有效方程与谱内容。", "summary_source": "deepseek", "authors": [{"name": "Osvaldo Chandia"}], "featured_authors": [{"name": "Osvaldo Chandia"}], "author_count": 1}, {"id": "2609.27873", "category": "hep-th", "title": "Spectral Fractional Bosonic Strings: Exact Polyakov Measure and the Critical Dimension", "abstract": "Fractional Laplacians encode anomalous scaling and covariant nonlocal response in quantum matter and holographic boundary systems. We place the corresponding scalar spectral theory on a dynamical closed worldsheet. A metric-dependent intertwiner maps the fractional quadratic form to that of $D$ free bosons, while its zeta Jacobian changes the matter determinant weight from $D$ to $sD$. The prime-determinant transformation includes the zero-mode area factor and determines both the moduli density and the Weyl coefficient $c_{\\rm det}=sD$. Weyl cancellation therefore selects $D_\\ast=26/s$. On the integer critical locus $1\\leq D\\leq26$, $N=26-D$ spectator bosons turn the residual determinant into a local critical CFT. Its fixed-area genus-$g$ vacuum measure is that of 26 free bosons, its torus trace is modular invariant, its plumbing channels are state resolved, and its BRST charge is nilpotent. The $D$ distinguished coordinates remain spectral composites; their pullback yields the Koba--Nielsen amplitudes and massless vertex conditions. Target backgrounds coupled to this distinguished sector retain the ordinary one-loop tensor beta functions, with dilaton deficit $sD-26$ and the corresponding string-frame action. Worldsheet gravity thus turns the fractional exponent into a quantum-geometric consistency parameter.", "url": "https://arxiv.org/abs/2609.27873", "type": "理论", "summary": "1. 该工作将分数拉普拉斯算子置于动力学闭合世界面，构造精确 Polyakov 测度并推导临界维数。\n2. 其核心是度规相关插值映射与 ζ 雅可比把物质行列式权重由 D 调为 sD，Weyl 消去定出 D*=26/s，并在整数临界面恢复局部临界 CFT。\n3. 这表明分数指数 s 可充当量子几何一致性参数，将非局域标度与弦世界面的测度、BRST 及背景 β 函数约束联系起来。", "summary_source": "deepseek", "authors": [{"name": "Tianhao Wu"}, {"name": "Gabriele La Nave"}], "featured_authors": [{"name": "Tianhao Wu"}, {"name": "Gabriele La Nave"}], "author_count": 2}, {"id": "2609.28032", "category": "hep-th", "title": "Relational background field formulation of discrete quantum gravity models: The case of $O(N)$ vector models in zero dimensions", "abstract": "In a recent paper arxiv.org/abs/2609.21031 , we have introduced the concept of a relational background field as a new approach to the renormalization group (RG) for discrete quantum gravity models, focusing on random matrix models. The proposed method offers the dual advantage of preserving the model's gauge symmetry (typically $U(N)$ or $O(N)$), whose breaking in conventional approaches has remained an open problem, and providing a more satisfactory treatment of the continuum or infrared (IR) limit. In this limit, the theory is described by a non-local field theory in dimension $D = 2k + 3$, where $k$ denotes the number of cuts in the effective spectrum as dictated by random matrix theory. This pedagogical paper reviews this construction for real random vector models in zero dimensions, with $O(N)$ as the symmetry group. Following the general strategy of background-field-type formulations, we show, using the BBP (Baik-Ben Arrous-P'ech'e) phase transition, that a partial Hubbard--Stratonovich decomposition of the quartic interaction, involving a matrix-valued intermediate field, allows a preferred notion of scale to emerge. This scale, in turn, defines an RG flow, whose perturbative structure is analyzed. Our calculation demonstrates the existence of an \\textit{asymptotic} Wilson--Fisher-type fixed point, whose sole relevant critical exponent is in qualitative agreement with the double-scaling critical exponent of these models.", "url": "https://arxiv.org/abs/2609.28032", "type": "理论", "summary": "1. 该文在零维实随机向量模型与O(N)对称性框架下，系统阐述关系背景场作为离散量子引力重整化群的新表述。\n2. 其卖点在于借助BBP相变对四次相互作用作部分Hubbard--Stratonovich分解，引入矩阵值中间场，使优选尺度涌现并定义RG流，同时保持O(N)规范对称性并改善连续/红外极限处理。\n3. 微扰计算给出渐近Wilson--Fisher型不动点，其唯一相关临界指数与双标度临界指数定性一致，表明该方法能捕捉离散量子引力的关键临界行为。", "summary_source": "deepseek", "authors": [{"name": "Vincent Lahoche"}, {"name": "Dine Ousmane Samary"}, {"name": "Parham Radpay"}], "featured_authors": [{"name": "Vincent Lahoche"}, {"name": "Dine Ousmane Samary"}, {"name": "Parham Radpay"}], "author_count": 3}, {"id": "2609.28119", "category": "hep-th", "title": "Equal-GNO Sectors and Fuzzy-Sphere Vacua: Large-Charge ADHM-BMN Index Matching", "abstract": "We establish a protected-sector relation between the superconformal index of the three-dimensional ADHM theory and the fixed-vacuum Witten index of BMN matrix quantum mechanics. The comparison selects a positive equal-magnetic-charge sector of the ADHM localization formula and a BMN vacuum made from identical fuzzy-sphere blocks. Equal magnetic charges preserve the complete multiplicity gauge group and make the vector and adjoint determinants independent of the common charge. Fundamental fields instead experience the full monopole background and develop a magnetic gap. In the large-GNO-charge limit, their oscillator determinant decouples from every fixed order of the protected expansion, while the associated vacuum monomial survives and fixes the normalization of the sector. After this normalization, the ADHM matrix integral in the large-GNO-charge limit agrees coefficientwise with the large-block limit of the BMN index. The matching therefore arises from two physically distinct mechanisms: in the large-GNO-charge limit, the fundamental-hypermultiplet excitations become magnetically heavy and decouple on the ADHM side, while in the large-block limit, the finite fuzzy-sphere angular-momentum cutoff is removed on the BMN side, leaving the complete angular tower. We establish the correspondence coefficientwise, distinguish the exact determinant identities from the large-charge asymptotics, and show that the GNO-charge partition becomes, after the M-theory uplift, the distribution of longitudinal momentum among the BMN fuzzy-sphere blocks.", "url": "https://arxiv.org/abs/2609.28119", "type": "理论", "summary": "1. 该工作建立了三维ADHM超共形指数与BMN矩阵量子力学固定真空Witten指数间的受保护扇区对应，并选取ADHM正等磁荷扇区与相同模糊球块构成的BMN真空做系数级比较。\n2. 卖点在于：等磁荷保持完整多重性规范群，使矢量与伴随行列式不依赖公共荷，而基本超多重态感受磁单极背景并产生磁隙，在大GNO荷极限退耦；BMN侧则在大块极限移除模糊球角动量截断、保留完整角动量塔，经真空单项归一化后两边逐系数匹配。\n3. 该工作区分精确行列式恒等式与大荷渐近，并经M理论提升将GNO荷配分解释为BMN模糊球块间纵向动量分配，为矩阵模型指数计算与M理论真空结构提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Sarthak Duary"}, {"name": "Kangning Liu"}], "featured_authors": [{"name": "Sarthak Duary"}, {"name": "Kangning Liu"}], "author_count": 2}, {"id": "2609.28210", "category": "hep-th", "title": "Geometries of Quantum Field Theories", "abstract": "This is an English translation of a book originally published in Japanese by Saiensu-sha in 2015. The book is an introduction to the 3d-3d correspondence, the relation between 3d $\\mathcal{N}=2$ supersymmetric gauge theories and the geometry of 3-manifolds, which arises from the compactification of the 6d $\\mathcal{N}=(2,0)$ theory. The presentation is bottom-up rather than top-down: instead of starting from the 6d theory, we begin by asking what a quantum field theory is, and let the geometry emerge on its own. Along the way we discuss renormalization and low-energy effective theories, gauging as an operation which glues field theories together, the resulting $Sp(2n, \\mathbb{Z})$-action on 3d theories, 3d $\\mathcal{N}=2$ supersymmetric theories and their dualities, the squashed three-sphere partition function and supersymmetric localization, duality domain walls of 4d $\\mathcal{N}=2$ theories, quantum Teichmuller theory, complex Chern-Simons theory and the quantization of the moduli space of flat $SL(2, \\mathbb{C})$-connections on 3-manifolds, with quantum dilogarithm functions as a recurring thread. The emphasis throughout is on geometric and algebraic structures which are invisible in a single field theory, and appear only in the theory space of quantum field theories. Appendices summarize supersymmetry in various dimensions, classical and quantum dilogarithm functions, and cluster algebras. Exercises with difficulty ratings are included in each chapter.", "url": "https://arxiv.org/abs/2609.28210", "type": "理论", "summary": "1. 本书为2015年日文原著的英译本，以自下而上的方式介绍源自6维(2,0)理论紧致化的3d-3d对应，即3维N=2超对称规范理论与3维流形几何的联系。\n2. 其特点是不从6维理论出发，而从\"量子场论是什么\"切入，让几何自行浮现，并串联重整化与低能有效理论、场论粘合式的规范操作、Sp(2n,Z)作用、超对称局域化与椭球三球面配分函数、4维N=2对偶畴壁、量子Teichmüller理论、复Chern-Simons理论与量子双对数函数。\n3. 全书强调仅在量子场论的理论空间中显现、单一理论内部不可见的几何与代数结构，为对偶、局域化及流形量子不变量研究提供统一视角。", "summary_source": "deepseek", "authors": [{"name": "Masahito Yamazaki"}], "featured_authors": [{"name": "Masahito Yamazaki"}], "author_count": 1}, {"id": "2609.28421", "category": "hep-th", "title": "Fermionic cosmic strings in dynamical Chern-Simons gravity", "abstract": "We investigate topological defects produced by a chiral phase transition in a fermionic ultraviolet completion of dynamical Chern-Simons (dCS) gravity. The model contains a complex scalar field with a chiral Yukawa coupling to fermions. Below the chiral symmetry breaking scale, integrating out the gapped bulk modes produces a gravitational Chern-Simons coupling which, we argue, modifies cosmic string solutions from the phase transition. The resulting corrected string metric is supported by a generalization of the Callan-Harvey fermionic zero mode solution, in which the null current generated by these zero modes provides a mechanism for parity violation. In the weak-coupling and weak-gravity regime, we derive the leading order-reduced dCS correction to this exterior metric. We also discuss the effective action description for generic string configurations in dCS gravity. The gravitational Pontryagin term provides the anomaly inflow required to cancel the gravitational anomaly of the chiral worldsheet theory.", "url": "https://arxiv.org/abs/2609.28421", "type": "理论", "summary": "1. 该工作研究动态陈-西蒙斯引力中手征相变产生的拓扑缺陷，在含复标量场与费米子手征汤川耦合的紫外完备化中，积分掉有能隙体模后导出引力陈-西蒙斯耦合，并据此修正宇宙弦解。\n2. 其核心卖点在于修正后的弦度规由推广的卡兰-哈维费米子零模解支撑，这些零模产生的零流为宇称破缺提供了机制，同时在弱耦合与弱引力下给出外部度规的首阶约化陈-西蒙斯修正。\n3. 该框架还以有效作用量描述一般弦构型，并指出引力庞特里亚金项提供反常流入，抵消手征世界面理论的引力反常，为在紫外完备模型中联系拓扑缺陷、宇称破缺与引力反常提供了可检验启示。", "summary_source": "deepseek", "authors": [{"name": "Stephon Alexander"}, {"name": "Heliudson Bernardo"}, {"name": "Shengyuan Zhang"}], "featured_authors": [{"name": "Stephon Alexander"}, {"name": "Heliudson Bernardo"}, {"name": "Shengyuan Zhang"}], "author_count": 3}, {"id": "2609.28456", "category": "hep-th", "title": "Scalar Gauss-Bonnet Wormholes and the Imaginary Distance Bound", "abstract": "We study $O(4)$ symmetric Euclidean wormholes in four-dimensional gravity with a massless scalar linearly coupled to the Gauss-Bonnet invariant. At nonzero coupling, the Einstein wormhole becomes a regular complex saddle that satisfies the Kontsevich-Segal-Witten criterion until its branch ends at a finite coupling. In asymptotically flat space, the Gauss-Bonnet term modifies the scalar displacement and the on-shell action for finite wormholes, but the size dependent parts of both corrections vanish in the large throat limit. The original imaginary distance threshold therefore remains unchanged. A negative cosmological constant already lowers the Einstein large throat imaginary distance relative to its flat space value. When the Gauss-Bonnet coupling is also present, the scalar is no longer a modulus as it develops a logarithmic running and its trajectory has infinite length. Subtracting the logarithmic asymptotic behavior leaves a finite regulated displacement. Its large throat value is shifted upward from the Einstein AdS result by the Gauss-Bonnet interaction and determines the leading large charge behavior of the renormalized fixed charge action.", "url": "https://arxiv.org/abs/2609.28456", "type": "理论", "summary": "1. 我们研究四维引力中的 $O(4)$ 对称欧几里得虫洞，其无质量标量与高斯-邦内不变量线性耦合。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Alex Kehagias"}, {"name": "Antonio Riotto"}], "featured_authors": [{"name": "Alex Kehagias"}, {"name": "Antonio Riotto"}], "author_count": 2}, {"id": "2609.26987", "category": "math-ph", "title": "Asymptotic quasi--local structure induced by Magnetic field", "abstract": "We introduce a magnetic coherent--state frame over the Landau levels of the two--dimensional Landau Hamiltonian, indexed by a discrete metric space combining spatial and energy degrees of freedom. Although overcomplete, the frame is almost--orthogonal, and we use it to endow the CAR $C^*$--algebra over the one--particle Hilbert space with an \\emph{asymptotic quasi--local} (AQL) structure, in which graded commutators of observables localized on disjoint index sets decay exponentially rather than vanish exactly. By means of a family of conditional expectations onto the resulting local subalgebras, we construct a Fréchet $*$--subalgebra of almost--local observables, invariant under the discrete group of lattice translations, which act on it by continuous automorphisms. For the full continuous group of magnetic translations we establish a quantitative control on how local observables spread through this almost--local algebra, and we show that this control suffices to extend graded asymptotic abelianness from the lattice to the entire continuous translation group. The results provide a discrete--continuum dictionary intended as the starting point for extending Lieb--Robinson--type techniques from lattice systems to interacting continuum electrons in a magnetic field.", "url": "https://arxiv.org/abs/2609.26987", "type": "理论", "summary": "1. 我们在二维朗道哈密顿量的朗道能级上引入了磁相干态框架，由结合空间和能量自由度的离散度量空间索引。\n2. 结果提供了一个离散连续介质字典，旨在作为将李布罗宾逊型技术从晶格系统扩展到磁场中相互作用的连续介质电子的起点。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Giuseppe De Nittis"}], "featured_authors": [{"name": "Giuseppe De Nittis"}], "author_count": 1}, {"id": "2609.27178", "category": "math-ph", "title": "Heun Spectrum, Threshold Hierarchy, and One-Loop Quantum Mass of the Christ--Lee Kink", "abstract": "We study the fluctuation spectrum and renormalized one-loop quantum mass of the Christ--Lee kink over the full positive range of its deformation parameter. The fluctuation equation is reduced exactly to general-Heun form, yielding parity-resolved continuum solutions and implicit quantization conditions for the discrete spectrum. At the first nontrivial continuum crossing, the odd Heun solution truncates to a polynomial, giving the exact threshold \\(\\epsilon_1=\\sqrt{\\sqrt{3}-1}\\). For small deformation, the kink separates into two widely spaced \\(\\phi^6\\)-like interfaces and the fluctuation operator develops a long central cavity. This geometry explains the logarithmic growth of the bound-state count, the asymptotically geometric hierarchy of continuum-threshold crossings, and the emergence of a soft relative-translation mode. In the opposite limit, the spectrum approaches the \\(\\phi^4\\) Pöschl--Teller problem, while its even threshold resonance becomes a shallow bound state at finite deformation. The one-loop correction is evaluated in a fixed vacuum-normal-ordering prescription using a common-regulator spectral trace and independently through an imaginary-frequency functional determinant. The two calculations agree throughout representative finite deformations and reproduce the exact \\(\\phi^4\\) limit. In the small-deformation regime, the extended central region produces a logarithmically enhanced negative quantum correction. These results provide a unified analytic and numerical description of how the spectral reorganization of the Christ--Lee kink controls its semiclassical quantum mass.", "url": "https://arxiv.org/abs/2609.27178", "type": "理论", "summary": "1. 该工作将Christ-Lee扭结的涨落方程精确约化为广义Heun形式，给出宇称分辨的连续谱解、离散谱隐式量子化条件及重整化单圈量子质量。\n2. 小形变下扭结分裂为两个远离的φ⁶型界面并形成长中心腔，解释了束缚态数的对数增长、阈值穿越的渐近几何层级与软相对平移模；奇Heun解截断给出精确阈值ε₁=√(√3−1)。\n3. 谱迹与虚频行列式两种独立单圈计算在代表性形变下一致并重现φ⁴极限，暗示中心腔导致的谱重组是半经典量子质量对数增强负修正的根源。", "summary_source": "deepseek", "authors": [{"name": "Mulyanto"}, {"name": "Afif Jalu Pradipta"}, {"name": "Ardian Nata Atmaja"}, {"name": "Bobby Eka Gunara"}], "featured_authors": [{"name": "Mulyanto"}, {"name": "Afif Jalu Pradipta"}, {"name": "Ardian Nata Atmaja"}, {"name": "Bobby Eka Gunara"}], "author_count": 4}, {"id": "2609.27740", "category": "math-ph", "title": "Quantized six-vertex model at roots of unity: Frobenius property and free-parafermion spectra", "abstract": "We study the quantized six-vertex (Q6V) model on arbitrary admissible diagrams at $q=\\varepsilon$, where $\\varepsilon$ is a primitive $N$th root of unity with $N$ odd. For the commuting layer transfer matrices $\\mathbb{T}(y)$ with mixed boundary conditions, we establish the quantum Frobenius property \\[ \\mathbb{T}(y)\\mathbb{T}(\\varepsilon y)\\cdots \\mathbb{T}(\\varepsilon^{N-1}y) = \\mathscr{P}_N(y^N)\\mathbb{I}, \\] where $\\mathscr{P}_N$ is a scalar Laurent polynomial obtained directly from the monomial expansion of $\\mathbb{T}(y)$. Our proof exploits the underlying three-dimensional integrability, in particular the tetrahedron equations and their consequences. The quantum Frobenius relation essentially determines the joint eigenvalues of the associated Hamiltonians up to multiplicities and shows that they take a free-parafermion form, thereby extending such structures from previously known one-dimensional examples to a broad class of genuinely two-dimensional quantized six-vertex models. The construction also admits independent local gauge choices and recovers the long-range-interacting $\\tau_{\\; 2}$ model, which includes the original free-parafermion model as a special case. We also apply the same framework to the relativistic quantum Toda chain at odd roots of unity and obtain the free-parafermion spectra for the relevant Q6V transfer matrices with fixed boundary states.", "url": "https://arxiv.org/abs/2609.27740", "type": "理论", "summary": "1. 该工作研究奇数N次单位根q=ε处任意容许图上的量子化六顶点模型，为混合边界条件的交换层转移矩阵T(y)建立量子Frobenius关系。\n2. 其核心卖点是用三维可积性与四面体方程证明该关系，将相关Hamiltonian联合本征值确定至多重性并化为自由parafermion形式，把该谱结构从已知一维例子推广到广泛二维Q6V模型。\n3. 该构造允许独立局部规范选择，可恢复长程τ₂模型并包含原自由parafermion模型为特例，也给出奇数单位根Toda链固定边界态的对应谱，显示此类谱结构的统一性。", "summary_source": "deepseek", "authors": [{"name": "Rei Inoue"}, {"name": "Atsuo Kuniba"}, {"name": "Yuji Terashima"}, {"name": "Junya Yagi"}], "featured_authors": [{"name": "Rei Inoue"}, {"name": "Atsuo Kuniba"}, {"name": "Yuji Terashima"}, {"name": "Junya Yagi"}], "author_count": 4}, {"id": "2609.27830", "category": "math-ph", "title": "The modular energy range of an interval in chiral conformal field theory", "abstract": "We determine exactly the range of the modular Hamiltonian of an interval in a chiral conformal field theory over states of bounded energy. For an interval of length $R$ in a theory of central charge $c$, and states of mean energy at most $E$, the supremum of the modular energy is $M_{\\max} = \\frac{\\pi R}{2}E + \\frac{c}{6} - \\frac{\\pi c^{2}}{288\\,RE} + O((RE)^{-2})$, and neither constant can be improved. The infimum is logarithmic, $M_{\\min} \\simeq -\\frac{c}{12}[\\ln(24\\pi RE/c)-1]$, so the range is linear above and logarithmic below, the two meeting as $RE \\to 0$; it is strictly wider above, by more than $\\frac{2}{5}\\pi RE$ at every energy, which reduces after a Stieltjes substitution to the positivity of a variance. Both bounds are attained, the one-parameter family of weights proving them being the Legendre structure of the answer. The two ingredients separate cleanly. The coefficient $\\pi R/2$ is Möbius representation theory alone: the complementary weight is a translate of the special conformal generator, hence positive, so for the full modular Hamiltonian the bound needs no additive constant. The constant $c/6$ is precisely the price of truncating that weight at the endpoints, supplied by the quantum energy inequality of Fewster and Hollands; the saturating state places its negative energy exactly there. The constant is accordingly additive over entangling points, being $nc/6$ for $n$ disjoint intervals of equal length. Composing with positivity of relative entropy gives a sharp Bekenstein bound, $\\Delta S_I \\leq \\frac{\\pi R}{2}E + \\frac{c}{6}$, recovering the original form of that inequality from the modular form that by itself imposes no constraint.", "url": "https://arxiv.org/abs/2609.27830", "type": "理论", "summary": "1. 该工作精确确定了手性共形场论中固定长度区间在有限平均能量态上的模哈密顿量取值范围，给出上确界的线性主项加 c/6 常数修正与下确界的对数形式，并证明这些常数不可改进。\n2. 其技术核心是将上界分解为 Möbius 表示论贡献 πR/2 与端点截断代价 c/6：前者源于补权重为特殊共形生成元的平移而自动为正，后者由 Fewster-Hollands 量子能量不等式给出，饱和态把负能量精确置于端点，且 c/6 对纠缠点可加。\n3. 与相对熵正定性组合后可得尖锐 Bekenstein 界 ΔS_I ≤ πR/2 E + c/6，由此从本身不施加约束的模形式恢复原始不等式，并暗示模能量范围、量子能量条件与纠缠熵界之间存在更一般的深层联系。", "summary_source": "deepseek", "authors": [{"name": "Samuel L. Braunstein"}, {"name": "Zhi-Wei Wang"}], "featured_authors": [{"name": "Samuel L. Braunstein"}, {"name": "Zhi-Wei Wang"}], "author_count": 2}, {"id": "2609.27835", "category": "math-ph", "title": "An adaptive weighted extrapolation neural network for dispersive shock waves generated by square-root initial condition of the KdV equation", "abstract": "Simulating dispersive shock waves (DSWs) using physics-informed neural networks (PINNs) presents significant numerical difficulties. In particular, the square-root initial condition exhibits singularity near the origin, making it difficult to fit accurately. This initial fitting error is amplified through nonlinear evolution and gradually accumulates during extrapolation, imposing high demands on the long-term extrapolation capability of numerical methods. Accordingly, this paper proposes an improved physics-guided multistage neural network (IPgMSNN) framework. IPgMSNN is built upon the original PgMSNN framework, with its core innovation focused on the third-stage training strategy. Specifically, online fine-tuning and a weighted target mechanism are introduced, which effectively suppress error accumulation during long-term extrapolation. Numerical experiments systematically evaluate IPgMSNN from three perspectives: forward problem solving, model stability, and parameter inversion. Experimental results demonstrate that IPgMSNN effectively captures high-frequency wavefront details, maintains long-term extrapolation stability, and achieves high-precision parameter inversion, providing an efficient solution for deep learning-based simulation of dispersive nonlinear systems.", "url": "https://arxiv.org/abs/2609.27835", "type": "理论", "summary": "1. 该工作针对KdV方程平方根初值在原点附近不可微、易导致物理信息神经网络拟合误差经非线性演化累积的问题，提出改进的物理引导多阶段神经网络框架IPgMSNN，用于色散激波模拟。\n2. 其核心创新在第三阶段训练中引入在线微调与加权目标机制，以抑制长期外推中的误差累积，从而捕捉高频波前细节并保持外推稳定性，同时实现高精度参数反演。\n3. 这表明将分阶段物理引导与自适应加权外推策略结合，可为含奇异初值的色散非线性系统提供稳定的深度学习求解途径，并可能推广至其他复杂波动的长时间模拟与反问题。", "summary_source": "deepseek", "authors": [{"name": "Xuan-Jie Wang"}, {"name": "Rui Guo"}, {"name": "An-Yao Jin"}, {"name": "Hua-Ying Ren"}], "featured_authors": [{"name": "Xuan-Jie Wang"}, {"name": "Rui Guo"}, {"name": "An-Yao Jin"}, {"name": "Hua-Ying Ren"}], "author_count": 4}, {"id": "2609.27966", "category": "math-ph", "title": "From Null Modes to Gauge Generators: A Bordered Faddeev--Jackiw Theory of Constraint Chains", "abstract": "A null mode of the bordered Faddeev--Jackiw matrix is not, in general, a gauge generator. We determine exactly what the residual kernel encodes and identify the additional condition required for genuine gauge symmetry. Writing $f^{(m)}=\\begin{pmatrix}f^{(0)}&B\\\\-B^{\\mathsf T}&0\\end{pmatrix}$ and $\\Gamma=N^{\\mathsf T}B$, we prove $\\dim\\ker f^{(m)}=\\dim\\ker\\Gamma^{\\mathsf T}+\\dim\\ker\\Gamma-\\operatorname{rank}(\\Pi M\\Pi)$, where $M=B^{\\mathsf T}f^{(0)+}B$ and $\\Pi$ projects onto $\\ker\\Gamma$. The two kernel contributions have distinct meanings: the first consists of null directions of $f^{(0)}$ tangent to the constraint surface, while the second counts independent first-class combinations. We then show that $\\Gamma$ is not the Dirac constraint matrix: it is the primary--secondary block of the reduced constraint matrix, with $M$ providing the secondary--secondary block. For a residual null mode with nonzero multiplier component, we derive the associated two-step chain and prove that it closes to an exact gauge symmetry precisely when the chain contraction vanishes in the effective ring modulo the constraint ideal. A four-variable counterexample shows that the Faddeev--Jackiw stopping condition can hold while the system has no gauge freedom, and that the chain criterion rejects the false generators. Mechanical examples then exhibit the criterion and show that parameter strata can carry distinct gauge and dynamical content that is erased by premature cancellation.", "url": "https://arxiv.org/abs/2609.27966", "type": "理论", "summary": "1. 该工作厘清了带边FJ矩阵零模与规范生成元的关系，给出残差核的精确含义及真规范对称所需的附加条件。\n2. 其技术卖点是给出残差核维数公式，区分切于约束面的零方向与独立第一类组合，并用两步链收缩在约束理想模下的有效环中消失作为真规范判据。\n3. 四变量反例显示FJ停止条件可成立而无规范自由度，链判据能拒绝假生成元；机械例子提示参数分层承载的规范与动力学内容不应被过早消去。", "summary_source": "deepseek", "authors": [{"name": "E. Chan-López"}], "featured_authors": [{"name": "E. Chan-López"}], "author_count": 1}, {"id": "2609.28120", "category": "math-ph", "title": "Frustration-Free Models for Topological Holography: Fusion Spin Chains as Boundary Algebras", "abstract": "We introduce a class of $2d$ quantum spin systems based on a unitary spherical fusion category with a chosen object. These models have frustration-free, reflection positive, but generally non-commuting local interactions, generalizing the Levin-Wen string-net models. Based on the theory developed in arXiv:2510.20662 , we explicitly realize the Temperley-Lieb-Jones algebra, and more generally fusion spin chains as their boundary algebras.", "url": "https://arxiv.org/abs/2609.28120", "type": "理论", "summary": "1. 该工作引入基于幺正球面融合范畴与选定对象的一类二维量子自旋系统，推广Levin-Wen弦网模型。\n2. 这些模型具有无阻挫、反射正性但通常非对易的局域相互作用，并显式实现Temperley-Lieb-Jones代数及更一般的融合自旋链作为其边界代数。\n3. 这为拓扑全息提供无阻挫格点实现，并启示用融合自旋链与边界代数研究体-边对应。", "summary_source": "deepseek", "authors": [{"name": "Zhengwei Liu"}, {"name": "Zishuo Zhao"}], "featured_authors": [{"name": "Zhengwei Liu"}, {"name": "Zishuo Zhao"}], "author_count": 2}, {"id": "2609.26825", "category": "quant-ph", "title": "Free-fermion spectral structure enables strange nonchaotic attractor classification in Aubry-Andre-Harper quantum reservoirs", "abstract": "An Aubry-André-Harper (AAH) quantum reservoir classifies strange nonchaotic attractors (SNAs) against chaos, substantially outperforming reservoirs built from dense random matrices on the full Fock space. Ablations and controlled interventions identify \\emph{free-fermion one-body transition sparsity}, rather than proximity to a quantum phase transition, as the dominant factor under our controls, since $H_0$ is quadratic in fermion operators and only $N(N-1)2^{N-2}=3584$ of the $65{,}280$ Fock-space transitions carry weight. Random on-site disorder, which preserves this quadratic structure, matches AAH accuracy, whereas full-Hilbert-space random matrices and eigenvector permutations, which break it, collapse to the random baseline. We characterize the resulting frequency-selective filtering with a Hamiltonian transition kernel, validate it to $N=8$ qubits, and reproduce it in a second dynamical system. We also use the reservoir as a training-free screen for strange-nonchaotic structure in Kepler RR Lyrae light curves.", "url": "https://arxiv.org/abs/2609.26825", "type": "理论", "summary": "1. 该工作用Aubry-André-Harper量子储备池对奇怪非混沌吸引子与混沌进行分类，并优于稠密随机矩阵储备池。\n2. 消融表明主导因素是自由费米子单体跃迁稀疏性而非量子相变邻近性：二次型H0使65280个Fock跃迁仅3584个有贡献。\n3. 该机制可推广为基于自由费米子稀疏跃迁的储备池设计原则，并为无训练识别Kepler RR Lyrae光变中的奇怪非混沌结构提供途径。", "summary_source": "deepseek", "authors": [{"name": "Suresh Kumarasamy"}, {"name": "Dianavinnarasi Joseph"}, {"name": "Manish Dev Shrimali"}, {"name": "Awadhesh Prasad"}], "featured_authors": [{"name": "Suresh Kumarasamy"}, {"name": "Dianavinnarasi Joseph"}, {"name": "Manish Dev Shrimali"}, {"name": "Awadhesh Prasad"}], "author_count": 4}, {"id": "2609.26885", "category": "quant-ph", "title": "Sustained growth of quantum circuit complexity in many-body Hamiltonian dynamics", "abstract": "The quantum circuit complexity of an evolving many-body quantum system is believed to exhibit a sustained growth, maintained for timescales much longer than the onset of thermalization. Most previous works have focused on models which violate energy conservation, such as random unitary circuits. Here we study generic, local time-independent Hamiltonian dynamics. We unconditionally prove that for generic local Hamiltonians and typical initial product states at high effective temperature, the robust quantum circuit complexity must grow over a very long period of time, attaining an exponentially large value at late times. Our approach relies on two structural properties that we prove rigorously: (i) generic local Hamiltonians satisfy generalized spectral no-resonance conditions of arbitrary order, and (ii) typical high-temperature product states are effectively supported in exponentially many energy eigenstates. These properties have been widely assumed without proof in prior works. As corollaries of this result, we show the late-time state displays robust volume-law entanglement that is irremovable by polynomial-size circuits, and we establish a no fast-forwarding result for generic local Hamiltonians. We also lower bound the complexity of preparing sufficiently large subsystems with local quantum channels, in contrast with sufficiently small thermalizing regions which we show retain low complexity at late times.", "url": "https://arxiv.org/abs/2609.26885", "type": "理论", "summary": "1. 该工作研究一般局域、不含时哈密顿量驱动的多体动力学，在高有效温度下对典型乘积初态严格证明鲁棒量子线路复杂度会长时间持续增长，并在晚期达到指数大值。\n2. 其核心在于首次无条件证明一般局域哈密顿量满足任意阶广义谱无共振条件，且典型高温乘积态有效支持于指数多个能量本征态，从而无需先前工作常作假设即可给出复杂度增长。\n3. 由此导出晚期态具有不可被多项式线路移除的鲁棒体积律纠缠与一般局域哈密顿量的无快速前推，并给出局域量子信道制备足够大子系统的复杂度下界，而足够小的热化区域晚期仍保持低复杂度。", "summary_source": "deepseek", "authors": [{"name": "Wonjun Lee"}, {"name": "Saúl Pilatowsky-Cameo"}, {"name": "Soonwon Choi"}], "featured_authors": [{"name": "Wonjun Lee"}, {"name": "Saúl Pilatowsky-Cameo"}, {"name": "Soonwon Choi"}], "author_count": 3}, {"id": "2609.26892", "category": "quant-ph", "title": "Transparent Domain Walls through Information Convex Sets", "abstract": "In $(2+1)$-dimensional topologically ordered many-body states, transparent (topologically deformable) domain walls are invisible to local topological probes, yet can modify the ground state degeneracy (GSD) and transmute anyons transported across them. Here, we develop an entanglement-bootstrap framework using information convex sets (ICSs) on local and noncontractible annuli to extract information about transparent domain walls directly from ground state wavefunctions at fixed points of Abelian topological phases on a torus, without taking categorical defect data as input. We derive fusion rules governing the action of anyons on extreme points of ICSs on noncontractible annuli and determine their quantum dimensions. Extreme points invariant under transport around the complementary cycle correspond one-to-one to minimum entropy states (MESs), and their number equals the GSD. The maximal topological entanglement entropy (TEE), $\\gamma_{\\rm LW}^{\\max}=\\log({D}/d_\\alpha)$, probes the net effect of walls crossing the chosen annulus, where ${ D}$ is the total quantum dimension and $d_\\alpha$ is the quantum dimension of an extreme point of its ICS. In contrast, the maximal entanglement asymmetry is $\\Delta S_X^{\\max}=\\log\\mathrm{GSD}$. This value is the same for both annulus orientations and reflects the combined effect of the transparent domain walls. We further show that transparent domain walls can give rise to symmetries supported jointly on the two chosen fundamental cycles that cannot be decomposed into a product of two $1$-form symmetry operators, one supported on each cycle. By relating their action on MESs to anyon tunneling and the fusion rules, we clarify how these symmetries connect distinct ground states. Additionally, we apply the framework to Wen's plaquette model, the anisotropic dipolar toric code, and the rank-2 toric code.", "url": "https://arxiv.org/abs/2609.26892", "type": "理论", "summary": "1. 在$(2+1)$维拓扑有序多体态中，透明（拓扑可变形）畴壁对于局部拓扑探针来说是不可见的，但可以修改基态简并（GSD）并改变穿过它们传输的任意子。\n2. 相反，最大纠缠不对称性是$\\Delta S_X^{\\max}=\\log\\mathrm{GSD}$。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Jintae Kim"}, {"name": "Amanda Gatto Lamas"}, {"name": "Jacopo Gliozzi"}, {"name": "Bowen Shi"}, {"name": "Taylor L. Hughes"}, {"name": "Jong Yeon Lee"}], "featured_authors": [{"name": "Jintae Kim"}, {"name": "Amanda Gatto Lamas"}, {"name": "Jacopo Gliozzi"}, {"name": "Bowen Shi"}, {"name": "Taylor L. Hughes"}, {"name": "Jong Yeon Lee"}], "author_count": 6}, {"id": "2609.26898", "category": "quant-ph", "title": "The logical set of Gaussian states under the stabilizer subsystem decomposition", "abstract": "Universal quantum computation requires non-Gaussianity in continuous-variable systems and non-stabilizerness in discrete-variable systems. Yet, mapping a Gaussian state into the Gottesman-Kitaev-Preskill logical subspace can yield a logical qubit with non-stabilizer resources. To understand how the continuous-variable structure determines logical resources, we characterize the image of single-mode Gaussian states under the corresponding extraction channel, known as the stabilizer subsystem decomposition. Specifically, we derive series expressions for the logical Bloch vector and characterize the resulting reachable set, enabling an analytical treatment of the robustness of magic of the logical states. We then turn this geometric framework into a certification tool: by mapping a discrete-variable qubit witness to a continuous-variable squeezing witness, we obtain lower bounds on the squeezing of prepared states. We also show that ensembles of Gaussian states can violate both stabilizer and classical bounds. Violation of the stabilizer bound certifies the relational resource known as \"set-magic,\" while violation of the classical bound enables the certification of cryptographic randomness at moderate squeezing.", "url": "https://arxiv.org/abs/2609.26898", "type": "理论", "summary": "1. 该工作刻画了单模高斯态在稳定子子系统分解提取通道下的逻辑像，推导出逻辑布洛赫矢量的级数表达式，并刻画可达逻辑态集合。\n2. 其技术卖点是将该几何框架转化为认证工具：把离散变量量子比特见证映射为连续变量压缩见证，给出制备态压缩下界，并证明高斯态系综可违反稳定子界与经典界。\n3. 由此可认证关系型“集合魔法”资源，并在中等压缩下实现密码学随机性认证，为利用高斯态的非稳定子逻辑资源提供了可操作途径。", "summary_source": "deepseek", "authors": [{"name": "Santiago Zamora"}, {"name": "Kaustav Chatterjee"}, {"name": "Ulrik Lund Andersen"}, {"name": "Thiago Lucena de Macedo Guedes"}, {"name": "Jonatan Bohr Brask"}, {"name": "A. de Oliveira Junior"}, {"name": "Rafael Chaves"}], "featured_authors": [{"name": "Santiago Zamora"}, {"name": "Kaustav Chatterjee"}, {"name": "Ulrik Lund Andersen"}, {"name": "Jonatan Bohr Brask"}, {"name": "A. de Oliveira Junior"}, {"name": "Rafael Chaves"}], "author_count": 7}, {"id": "2609.26912", "category": "quant-ph", "title": "Influence of fast and slow laser phase noise on the fidelity of the Mølmer-Sørensen trapped-ion gate", "abstract": "High-fidelity two-qubit entangling gates are essential for the realization of useful quantum algorithms on quantum processors. The Mølmer-Sørensen (MS) gate has become a common choice for trapped-ion quantum computing due to its resilience to ion temperature and its demonstrated record fidelities. However, the spectral impurity of the driving laser field impacts gate performance, with phase noise influencing the qubit dynamics through mechanisms operating on different timescales. In this work, we present a comprehensive theoretical analysis of laser phase noise in the MS gate, identifying two spectral ranges which influence the gate fidelity the most: \"fast\" noise at frequencies near the motional mode spectrum, and \"slow\" noise at frequencies on the order of the inverse gate time. We derive the noise Hamiltonians for two common laser beam geometries and obtain analytical expressions for the average gate error in terms of the laser noise power spectral density and gate parameters. For slowly varying noise spectra, we provide simplified error estimates. In addition, we validate our findings against previously published numerical simulations.", "url": "https://arxiv.org/abs/2609.26912", "type": "理论+数值", "summary": "1. 该工作系统理论分析了Mølmer-Sørensen（MS）俘获离子门中激光相位噪声对保真度的影响，识别出靠近运动模式谱的“快速”噪声和量级为门时间倒数的“慢速”噪声两个主要频谱区间。\n2. 其技术核心是针对两种常见激光束几何推导噪声哈密顿量，并给出以激光噪声功率谱密度和门参数表示的解析平均门误差，且对慢变噪声谱提供简化估计，并与既有数值模拟吻合。\n3. 这为俘获离子平台明确激光相位噪声的关键频段与可解析误差标度，可为激光稳频、噪声谱工程及高保真纠缠门的优化提供依据。", "summary_source": "deepseek", "authors": [{"name": "Nikita Semenin"}, {"name": "Ksenia Khabarova"}, {"name": "Nikolay Kolachevsky"}], "featured_authors": [{"name": "Nikita Semenin"}, {"name": "Ksenia Khabarova"}, {"name": "Nikolay Kolachevsky"}], "author_count": 3}, {"id": "2609.26946", "category": "quant-ph", "title": "Monolithic Quantum Error Correction in the Presence of Distinguishability", "abstract": "Quantum error-correcting codes require that the environment cannot distinguish relevant error processes acting on different codewords. In practice, residual Zeeman, Stark, or anharmonic interactions shift the underlying states, making errors distinguishable and weakening the conditions for perfect recovery. We study this effect with an analytically solvable four-level model and a canonical spontaneous-emission noise model for atoms and molecules. Distinguishability raises the effective Kraus rank of the noise channel, lowers the recovered fidelity, and sets an operational checking time that shortens as the frequency separation between the emitted photons increases. We find that rapid syndrome checking suppresses the buildup of distinguishability and quantify how fast one needs to check to restore near-perfect recovery. Error distinguishability is thus a practical limitation of monolithic error correction, and our analysis identifies fast syndrome extraction as a route to mitigating it.", "url": "https://arxiv.org/abs/2609.26946", "type": "理论", "summary": "1. 该工作针对单片量子纠错中环境可区分不同码字错误过程的问题，构建可解析四能级模型并结合原子分子自发辐射噪声，研究残余塞曼、斯塔克与非谐移动导致的可区分性如何削弱完美恢复。\n2. 其核心在于表明可区分性提高噪声信道的有效Kraus秩、降低恢复保真度，并给出随发射光子频率间隔增大而缩短的操作性校验时间；快速综合征检测可抑制可区分性累积，并定量给出恢复近完美纠错所需的检测速率。\n3. 因此，错误可区分性是单片量子纠错的实际限制，而快速综合征提取为缓解该限制提供了可行路径，并对原子分子量子纠错实验的时序设计具有直接启示。", "summary_source": "deepseek", "authors": [{"name": "Shubham P. Jain"}, {"name": "Eric R. Hudson"}, {"name": "Wesley C. Campbell"}, {"name": "Alexey V. Gorshkov"}, {"name": "Victor V. Albert"}], "featured_authors": [{"name": "Shubham P. Jain"}, {"name": "Eric R. Hudson"}, {"name": "Wesley C. Campbell"}, {"name": "Alexey V. Gorshkov"}, {"name": "Victor V. Albert"}], "author_count": 5}, {"id": "2609.26958", "category": "quant-ph", "title": "Soft decoding for quantum LDPC codes with experimental validation", "abstract": "The decoder is a critical component of a fault-tolerant quantum computer, computing corrections based on parity-check measurements performed throughout the computation. A soft decoder supplements its output with a confidence score which, when used alongside post-selection, can substantially improve logical performance. We introduce a soft beam search decoder for quantum low-density parity-check codes that uses internal decoder data as a confidence metric, removing the need for extra computation. We perform circuit-level simulations of five quantum LDPC codes relevant for superconducting and trapped ion architectures equipped with our global soft decoder and we obtain up to $580\\times$ logical-error suppression at a physical error rate of $10^{-3}$ while rejecting only $0.1\\%$ of shots. Then, we simulate an error detected measurement, which is a core logical operation of the walking cat architecture, using a streaming version of soft beam decoder and we achieve up to $210\\times$ error suppression while increasing the rejection probability by only $0.5$ percentage points. Finally, we revisit recent quantum LDPC code memory experiments on trapped ions, demonstrating that our soft decoder doubles the logical qubit lifetimes at the price of a mean rejection rate of $2.6\\%$--$5.6\\%$ per syndrome round, bringing all five codes into the beyond-breakeven regime.", "url": "https://arxiv.org/abs/2609.26958", "type": "实验", "summary": "1. 该工作提出一种用于量子低密度奇偶校验码的软束搜索解码器，并利用电路级模拟及囚禁离子记忆实验进行验证。\n2. 其核心卖点是以解码器内部数据直接给出置信度供后选择，而无需额外计算；在物理错误率10⁻³下，对五类码实现最高580倍逻辑错误抑制且仅拒绝0.1%的采样，并以流式版本用于行走猫架构的错误检测测量，获得最高210倍抑制、拒绝率仅增0.5个百分点。\n3. 在重新分析近期囚禁离子量子LDPC码记忆实验时，该解码器将逻辑量子比特寿命翻倍，代价是每轮综合征平均2.6%–5.6%的拒绝率，并使五类码均进入超越盈亏平衡区。", "summary_source": "deepseek", "authors": [{"name": "Arda Aydin"}, {"name": "Edwin Tham"}, {"name": "Nicolas Delfosse"}, {"name": "Min Ye"}], "featured_authors": [{"name": "Arda Aydin"}, {"name": "Edwin Tham"}, {"name": "Nicolas Delfosse"}, {"name": "Min Ye"}], "author_count": 4}, {"id": "2609.27004", "category": "quant-ph", "title": "Free semigroup non-relativistic phase space states quantisation", "abstract": "Quantisation is considered as an action of classical point operators on field states at the Planck scale of the phase space. Emphasis is placed on the sequence of physical variables. A \"state language/Dirac notation\" for classical mechanics is introduced; in many cases, it replaces the principle of stationary action for conservative systems. Observed classical and quantum dynamics are considered as different vectorisations of the free semigroup contribution of time. There is a dream of describing classical dynamics as complex transformations of state vectors over such a free semigroup, rather than solving differential equations. The transition from the alphabet to states, from states to state functions, and from state functions to measurable quantities is managed by projectors. An attempt is made to provide a derivation of the Legendre transformation. The trivial multiplication of the potential energy by the wave function in the coordinate representation and its non-trivial operator action in the momentum representation are obtained without a Fourier transform nor the Planck scale. The quantisation procedure is divided into two stages: first, the action of point-like classical operators on field functions; and second, accounting for the physically finite scale of the Planck length against the backdrop of the possible infinitesimality in the classical phase space. The concept of an angle between states is introduced, defining the measure of \"quantumness\". The free semigroup time contribution is studied in the context of the Born rule.", "url": "https://arxiv.org/abs/2609.27004", "type": "理论", "summary": "1. 该工作将量子化视为经典点算符在相空间普朗克尺度上对场态的作用，并引入经典力学的狄拉克态语言。\n2. 技术上分两阶段：点状经典算符作用于场函数，再纳入有限普朗克长度；势能的坐标表象乘法与动量表象算符作用无需傅里叶变换。\n3. 该框架或可把经典动力学改写为自由半群上态矢的复变换而非解微分方程，并为量子性度量与玻恩规则提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Georgii Koniukov"}], "featured_authors": [{"name": "Georgii Koniukov"}], "author_count": 1}, {"id": "2609.27053", "category": "quant-ph", "title": "Equivalence of maximal and generic reachability for non-universal Variational Quantum Circuits", "abstract": "Employing problem-specific non-universal Variational Quantum Circuits aligned with a suitable state preparation has become a standard approach to counter the difficulty in training universal ansätze. However, due to their non-universality, diagnosing their reachability and trainability remains reference-state-specific. In this work, we establish the equivalence of maximal reachability and generic reachability over arbitrary reference states as a consequence of the \\emph{principal orbit-type theorem}. Thereafter, assuming that the global minimum of the cost function is achieved on a subset that can be described as the image of a smooth function, we derive necessary and sufficient conditions for non-zero probability of reachability under generically sampled reference states. Furthermore, when the solution set is assumed to be realised through a real analytic map that embeds a solution manifold, we show that local surjectivity is generically obtained on the entire solution manifold if it is attained at a single point. As a practical design rule, the need for local surjectivity automatically translates to a necessary dimensional criterion: reachability requires the target set's topological dimension to be at least as large as the co-dimension of the generic orbit. Numerical simulations show that finite-depth optimisation consistently fails when the dimensional obstruction applies, while unobstructed cases show improved convergence.", "url": "https://arxiv.org/abs/2609.27053", "type": "理论+数值", "summary": "1. 该工作针对非通用变分量子电路的可达性诊断依赖参考态的问题，借助主轨道型定理证明了最大可达性与任意参考态下的一般可达性等价，并给出了一般采样参考态下非零可达概率的充要条件。\n2. 其卖点在于：当全局最优解集可视为光滑映射的像时，可获得一般采样参考态下非零可达概率的充要条件；若解集由实解析映射嵌入解流形，则局部满射性在单点成立即可推广至整个解流形，并导出目标集拓扑维数不小于一般轨道余维数的必要判据。\n3. 数值模拟显示，维数阻塞适用时有限深度优化一致失败，无阻塞时收敛改善，这为诊断非通用拟设的可达性并指导其结构设计提供了可检验准则。", "summary_source": "deepseek", "authors": [{"name": "Vishal S. Ngairangbam"}, {"name": "Michael Spannowsky"}], "featured_authors": [{"name": "Vishal S. Ngairangbam"}, {"name": "Michael Spannowsky"}], "author_count": 2}, {"id": "2609.27103", "category": "quant-ph", "title": "Quantum-Enhanced Sampling of Schrödinger Bridges", "abstract": "We consider the dynamic Schrödinger bridge problem on a finite state space and exploit its Markov structure to decompose the problem into an endpoint coupling and a collection of conditional Markov bridges. To sample from the conditional bridges, we develop a quantum Gibbs sampler based on quantum walks on the bridge path space. Under uniformly positive transition probabilities, we derive a spectral-gap bound and provide an explicit procedure for preparing the initial state. Compared with the update bounds of the corresponding classical Gibbs sampler, our quantum walk-query complexity improves the dependence on the time horizon $T$ from quadratic to linear. For the endpoint coupling, we adapt a quantum box-constrained Newton method to compute the Schrödinger potentials, improving the matrix-scaling complexity, at fixed accuracy, from quadratic to $N^{3/2}$ in the state-space size $N$. Finally, we show that exponential reweighting extends both the Schrödinger bridge formulation and the Gibbs spectral-gap estimate to models with additive running costs.", "url": "https://arxiv.org/abs/2609.27103", "type": "理论", "summary": "1. 该工作研究有限状态空间动态薛定谔桥问题，利用马尔可夫结构将其分解为端点耦合与条件马尔可夫桥，并发展量子采样与势计算方案。\n2. 在一致正转移概率下，给出谱隙界与初态制备，量子行走查询复杂度对T由二次降至线性，盒约束量子牛顿法将矩阵规模复杂度降至N^{3/2}。\n3. 指数重加权将薛定谔桥表述与谱隙估计推广到含加性运行成本的模型，为量子采样与随机最优控制结合提供启发。", "summary_source": "deepseek", "authors": [{"name": "Tom Lollier"}, {"name": "Eyal Neuman"}], "featured_authors": [{"name": "Tom Lollier"}, {"name": "Eyal Neuman"}], "author_count": 2}, {"id": "2609.27128", "category": "quant-ph", "title": "Efficient Learning of Clifford-Scrambled Product States", "abstract": "Clifford circuits acting on product magic states provide a compact ansatz exhibiting extensive magic, volume-law entanglement, and even classically hard sampling under standard complexity assumptions. Here, we efficiently recover its hidden product subsystems from two-copy Bell sampling. Quadratic relations between Bell samples determine the irreducible blocks after removing Pauli stabilizers, and binary linear algebra constructs a Clifford disentangler. For logarithmic-size blocks, approximate learning of the full state is efficient whenever the state remains inverse-polynomially separated from acquiring additional Pauli stabilizers. We efficiently learn $n$-qubit states prepared by random $T$-doped Clifford circuits with $T$-gate density below one via $O(n^2)$ Bell samples, and disentangle hidden product blocks in Clifford-augmented matrix product states. For unitary learning, we exactly learn $T$-depth-one circuits using $O(n^2)$ queries. Finally, we rule out pseudorandom states and unitaries with a product bipartition hidden by Clifford circuits.", "url": "https://arxiv.org/abs/2609.27128", "type": "理论", "summary": "1. 该工作提出了从双拷贝贝尔采样中高效恢复Clifford置乱乘积态隐藏乘积子系统的框架，并将其扩展到量子态与酉算符两类学习任务。\n2. 其技术核心是借助贝尔样本间的二次关系在剔除泡利稳定子后确定不可约块，并用二元线性代数构造Clifford解纠缠器；当块为对数规模且态与新增泡利稳定子保持逆多项式分离时可高效近似学得全态，随机T掺杂Clifford电路（T门密度低于一）仅需O(n^2)次贝尔采样，T深度一的酉也可用O(n^2)次查询精确学得。\n3. 该结果排除了具有Clifford隐藏乘积二分的伪随机态与酉，表明此类置乱结构可被高效解纠缠，并为Clifford增强矩阵乘积态等后续经典模拟与学习方案提供明确启示。", "summary_source": "deepseek", "authors": [{"name": "Tobias Haug"}], "featured_authors": [{"name": "Tobias Haug"}], "author_count": 1}, {"id": "2609.27129", "category": "quant-ph", "title": "Quantum Soundness of a Total-Degree Line-versus-Point Test", "abstract": "We prove quantum soundness of the total-degree diagonal line-vs-point test using the individual-degree soundness theorem of Ji, Natarajan, Vidick, Wright, and Yuen. A random change of coordinates yields projective polynomial decoders of total degree at most $md$. The uniform-line slice of the test bounds the weight of outcomes of degree greater than $d$, which are removed by a common relabeling. This reduction does not yield a dimension-independent soundness bound: the $\\operatorname{poly}(m)$ dependence of the individual-degree theorem persists, as discussed in Section 1.2 of arXiv:2009.12982 .", "url": "https://arxiv.org/abs/2609.27129", "type": "理论", "summary": "1. 该文在量子可靠性框架下证明了对角线对点全次数测试的可靠性，其证明核心是调用 Ji、Natarajan、Vidick、Wright 与 Yuen 的单项次数可靠性定理。\n2. 其技术卖点在于：随机坐标变换构造出总次数至多 md 的投影多项式解码器，均匀线切片限制次数大于 d 的结果权重，再由公共重标号一致移除这些高次项。\n3. 该归约仍未给出与维度无关的可靠性界，单项次数定理中的 poly(m) 依赖依然保留，表明全次数测试的维度无关量子可靠性仍需本质改进。", "summary_source": "deepseek", "authors": [{"name": "Tianrun Zhao"}], "featured_authors": [{"name": "Tianrun Zhao"}], "author_count": 1}, {"id": "2609.27177", "category": "quant-ph", "title": "Sample-Efficient Tomography of a Class of Mixed States with Extensive Entanglement and Magic", "abstract": "Full tomography of a generic many-qubit quantum state requires exponentially many copies, while suitable structural constraints can make reconstruction sample-efficient. Existing approaches exploit, for example, limited entanglement structure, low magic, or constrained state-preparation circuits. Here we consider a class of mixed states that can simultaneously exhibit extensive entanglement and extensive magic. Specifically, we introduce Clifford-encoded block-product (CEBP) states, obtained by applying an unknown global Clifford unitary to a tensor product of arbitrary mixed states supported on unknown blocks of bounded size. We show that, for a fixed block size, CEBP states can be reconstructed using polynomially many copies by exploiting Clifford-preserved Pauli correlations to recover the latent structure and reduce the remaining problem to local tomography. Our result demonstrates that sample-efficient tomography can arise from bounded complexity in a latent frame even when the physical state is highly entangled, highly magical, and mixed, and suggests complexity modulo structured transformations as a broader organizing principle for quantum-state learnability.", "url": "https://arxiv.org/abs/2609.27177", "type": "理论", "summary": "1. 该工作研究一类可同时具有广延纠缠与广延 magic 的混合量子态的样本高效层析，引入 Clifford 编码块积（CEBP）态，即对未知有界大小块上的任意混合态直积施加未知全局 Clifford 幺正。\n2. 其核心卖点在于证明固定块大小时仅需多项式数量拷贝即可重构该态，利用 Clifford 保持的 Pauli 关联恢复隐藏块结构，并将剩余问题归约为局域层析。\n3. 这表明样本高效层析可源于潜在参考系中的有界复杂度，即便物理态高度纠缠、高 magic 且为混合态；并提示以模结构变换的复杂度作为量子态可学习性的更广泛组织原则。", "summary_source": "deepseek", "authors": [{"name": "Pengcheng Liao"}, {"name": "Quntao Zhuang"}], "featured_authors": [{"name": "Pengcheng Liao"}, {"name": "Quntao Zhuang"}], "author_count": 2}, {"id": "2609.27196", "category": "quant-ph", "title": "Quantum Channel Stein's Lemma with an Exponential Strong Converse", "abstract": "We establish the quantum channel Stein lemma at every fixed type-I error tolerance in $(0,1)$ and prove an exponential strong converse under arbitrary adaptive strategies. For any finite-dimensional channel pair, the optimal type-II exponent equals the regularized channel relative entropy and is attained by parallel strategies. When this divergence is finite, every strictly larger type-II rate forces the probability of accepting the null hypothesis to decay exponentially, uniformly over strategies and quantum memories. The proof rests on a uniform Stinespring approximation: tensor powers of the null dilation are approximated by tensor powers of the alternative dilation after applying an auxiliary linear map to the environment. The operator-norm error is exponentially small under a squared-norm bound at any rate above the regularized relative entropy. We construct the approximation from a weak testing bound by iterative rate reduction and a fixed-block tensor expansion with an exact residual. It implies right continuity at order one of the regularized sandwiched Rényi channel divergence, which yields the adaptive converse through the channel chain rule. We also obtain a sharp hockey-stick threshold and a subchannel smoothing asymptotic equipartition property for fixed and subexponentially vanishing diamond-norm errors.", "url": "https://arxiv.org/abs/2609.27196", "type": "理论", "summary": "1. 我们在 $(0,1)$ 中的每个固定 I 类容错处建立了量子通道 Stein 引理，并证明了任意自适应策略下的指数强逆。\n2. 我们还获得了尖锐的曲棍球棒阈值和子通道平滑渐近均分属性，用于固定和次指数消失的钻石范数误差。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Minbo Gao"}, {"name": "Zhengfeng Ji"}, {"name": "Chenghua Liu"}], "featured_authors": [{"name": "Minbo Gao"}, {"name": "Zhengfeng Ji"}, {"name": "Chenghua Liu"}], "author_count": 3}, {"id": "2609.27318", "category": "quant-ph", "title": "Minimal representations of topology-preserving quantum-like states", "abstract": "We provide an equitable partition that gives an exact, minimal representation for the graph Cartesian product formed from quantum-like bits that preserves the relevant spectral and topological properties. We show that this result follows from the fact that the operations of taking the Cartesian product of graphs and constructing equitable partition of the graphs commute. Numerical simulations illustrate the preserved emergent eigenstates in the reduced structures. Additionally, we provide a construction of the minimal structure without passing through the Cartesian product. Finally, we frame quantum-like structures in the language of topology and fibrations.", "url": "https://arxiv.org/abs/2609.27318", "type": "理论+数值", "summary": "1. 该工作为量子类比特构成的图笛卡尔积给出了保持谱与拓扑性质的精确最小表示。\n2. 其技术核心在于证明图笛卡尔积与公平划分构造可交换，并数值验证约化结构保留涌现本征态。\n3. 这为绕过笛卡尔积直接构造最小结构、以拓扑与纤维化语言刻画量子类体系提供了启发。", "summary_source": "deepseek", "authors": [{"name": "William Horvat"}, {"name": "Debadrita Saha"}, {"name": "Nicolás Gigena"}, {"name": "Prineha Narang"}, {"name": "Gregory D. Scholes"}], "featured_authors": [{"name": "William Horvat"}, {"name": "Debadrita Saha"}, {"name": "Nicolás Gigena"}, {"name": "Prineha Narang"}, {"name": "Gregory D. Scholes"}], "author_count": 5}, {"id": "2609.27390", "category": "quant-ph", "title": "Higher-order Spatially Separated Correlations and Quantum Magic in the Long-range Transverse Field Ising Model", "abstract": "Long-range interacting quantum systems exhibit interesting phenomena beyond the nearest-neighbours regime. Such interactions can reach further separated particles and change the behaviour of many-body correlations. Here, we analyse their structure in the antiferromagnetic long-range interaction transverse field Ising model with power-law interactions decaying as $1/r^{\\alpha}$. We examine the spatial behaviour of basis-independent total multipartite correlations, called sector lengths $S_k$, of its ground state in the vicinity of critical points for different interaction exponents $\\alpha$ and fixed system size. These correlation functions were shown to indicate entanglement and the existence of local realistic models, allowing us to make claims about the Bell nonlocality and entanglement in the system. We further investigate them in the context of non-stabiliserness, often referred to as quantum magic, which holds information on their classical simulability and usefulness for quantum computation. We evaluate R{é}nyi stabiliser entropy near and outside the criticality and show that cumulative magic, up to the critical point, increases with $\\alpha$ for all of the examined system sizes. Our results provide new insights into the interplay between the long-range interactions, observable non-classical phenomena and their classical simulability.", "url": "https://arxiv.org/abs/2609.27390", "type": "理论+数值", "summary": "1. 长程相互作用的量子系统表现出超越最近邻体系的有趣现象。\n2. 我们评估了临界点附近和临界点之外的 R{é}nyi 稳定器熵，并表明对于所有检查的系统大小，直到临界点的累积魔力随着 $\\alpha$ 的增加而增加。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Paweł Cieśliński"}, {"name": "Wiesław Laskowski"}], "featured_authors": [{"name": "Paweł Cieśliński"}, {"name": "Wiesław Laskowski"}], "author_count": 2}, {"id": "2609.27456", "category": "quant-ph", "title": "Precision and resource scaling of real-time flux distortion compensation for superconducting quantum control", "abstract": "Real-time waveform generation supports dynamic quantum circuits without pre-storing complete waveforms for every execution path. However, long-lived distortions in flux-control lines degrade gate fidelity, requiring compensation to account for the actual pulse history. A frequency-domain inversion and time-domain fitting method is proposed for resource-efficient real-time flux distortion compensation. The method fits the reconstructed compensation impulse response with a compact hybrid infinite impulse response (IIR) and finite impulse response (FIR) filter. Look-ahead parallelization enables this filter to process synthesized waveforms at 1.2GSa/s on a field-programmable gate array (FPGA). Two-qubit cross-entropy benchmarking shows that real-time IIR filtering achieves a median controlled-Z Pauli fidelity close to the software-reference value of 99.57%. Numerical analysis and FPGA synthesis indicate approximately logarithmic growth in hardware resource use with compensation timescale. Extending compensation from microsecond to hundred-microsecond timescales increases look-up table (LUT) and digital signal processing (DSP) resource use by only about 14% and 4%, resp
