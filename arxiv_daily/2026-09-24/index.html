  <style>
    :root {
      --bg: #f6f1e8;

    * { box-sizing: border-box; }

    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }

    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }

    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }

    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }

    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }

    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }

    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2609.26807", "category": "cond-mat", "title": "Exact Collision Vertex for Stress and Heat Flux", "abstract": "For the hard-sphere Boltzmann equation, we derive an exact nonlinear generating vertex for collisional stress and heat-flux production. The complete two-input Hermite hierarchy for stress resums to a universal traceless tensor times one scalar radial law, while the heat-flux vertex follows from the same law by an exact contraction. Taylor differentiation yields universal bilinear collision tensors with exact stress and heat-flux gradings, without a finite moment closure. DSMC tests, including wall-driven flows and a bimodal Mach-5 shock, recover independently sampled Boltzmann productions and the predicted convergence, while the converged production is independent of the thermal Gaussian foot used for its Hermite representation.", "url": "https://arxiv.org/abs/2609.26807", "type": "理论", "summary": "1. 对于硬球玻尔兹曼方程，我们推导出碰撞应力和热通量产生的精确非线性生成顶点。\n2. DSMC 测试（包括壁驱动流和双峰 Mach-5 激波）恢复了独立采样的玻尔兹曼产生式和预测收敛性，而收敛产生式独立于用于 Hermite 表示的热高斯足。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Ilya Karlin"}], "featured_authors": [{"name": "Ilya Karlin"}], "author_count": 1}, {"id": "2609.26844", "category": "cond-mat", "title": "Suppressed Defect Emission and Enhanced Blue Luminescence of Zn-Doped CuBr Quantum Dots synthesized in Room-Temperature Synthesis", "abstract": "Deep-blue-emitting CuBr quantum dots (QDs) hold promise as nontoxic and heavy-metal-free optoelectronic materials, yet their efficiency is limited by intrinsic defects. We report Zn doping as an effective strategy to mitigate defect-mediated recombination in CuBr QDs synthesized via an eco-friendly supersaturated recrystallization method under ambient conditions. XRD shows lattice contraction, Rietveld refinement confirms substitutional doping, and XPS verifies Cu$^+$/ Zn$^{2+}$ states without secondary phases. HR-TEM analysis reveals uniform 3.46 $\\pm$ 0.12 nm Zn:CuBr QDs with reduced bandgap, after doping, indicating weaker quantum confinement. The dominant emission peaks appear at 406 nm ($Z_f$) and 431 nm ($Z_{1,2}$) under 365 nm excitation. Narrows defect FWHM, elevated band-edge emission, and extends carrier lifetimes, achieving 96.4 \\% color purity with CIE coordinates (0.1520, 0.0395). These findings demonstrate that Zn doping is a simple, scalable, and environmentally benign strategy for engineering efficient blue-emitting CuBr QDs.", "url": "https://arxiv.org/abs/2609.26844", "type": "理论", "summary": "1. 该工作采用室温过饱和重结晶法合成Zn掺杂CuBr量子点，并系统研究其结构、组分及蓝光发射特性。\n2. 其核心卖点是Zn2+替位掺杂导致晶格收缩并减弱量子限域，从而降低带隙、抑制缺陷复合、增强带边发射并延长载流子寿命，在365 nm激发下获得406 nm与431 nm发射，色纯度达96.4%，CIE坐标为(0.1520, 0.0395)。\n3. 这表明Zn掺杂是一种简单、可扩展且环境友好的缺陷工程策略，为发展无重金属、高效深蓝光CuBr量子点光电器件提供了明确思路。", "summary_source": "deepseek", "authors": [{"name": "Aryamol Stephen"}, {"name": "Ruchi Kumari"}, {"name": "Saparja Roy"}, {"name": "P. Jayaram"}, {"name": "A. Biju"}, {"name": "P. M. Sarun"}], "featured_authors": [{"name": "Aryamol Stephen"}, {"name": "Ruchi Kumari"}, {"name": "Saparja Roy"}, {"name": "P. Jayaram"}, {"name": "A. Biju"}, {"name": "P. M. Sarun"}], "author_count": 6}, {"id": "2609.26845", "category": "cond-mat", "title": "Analytical Solution of the Nonlinear Boltzmann Equation For Multicomponent Systems", "abstract": "We present exact analytical solutions to the nonlinear relativistic Boltzmann equation for homogeneous, isotropic massless multi-component systems with non-isotropic scattering cross sections. For a two-component system, we identify three distinct classes of exact solutions, each corresponding to specific constraints among initial energy densities, particle number densities, and scattering cross sections. These solutions comprise the equilibrium state and two novel classes: a hybrid structure featuring a non-equilibrium Maxwell-Juttner distribution coupled with a nontrivial distribution; the former is unprecedented in kinetic theory, while the latter refers to nontrivial dynamics shared by both species, which is novel in the relativistic context.", "url": "https://arxiv.org/abs/2609.26845", "type": "理论", "summary": "1. 该工作针对均匀、各向同性、无质量多组分系统，解析求解了含各向异性散射截面的非线性相对论玻尔兹曼方程，并在双组分情形下按初始能量密度、粒子数密度与散射截面的约束区分出三类精确解。\n2. 其核心卖点在于解中同时包含平衡态与两类新解：一类是偏离平衡的麦克斯韦-于特纳分布与非平凡分布耦合的混合结构，另一类是两种组分共享的非平凡动力学；前者在动理学理论中未见，后者在相对论语境下属新发现。\n3. 这为多组分相对论动理学中非平衡演化、组分耦合及散射截面约束提供了可检验的解析基准，并提示后续可寻找更一般的可解情形或进行数值检验。", "summary_source": "deepseek", "authors": [{"name": "Linyuan Wei"}, {"name": "Yi Wang"}, {"name": "Jin Hu"}, {"name": "Baoyi Chen"}], "featured_authors": [{"name": "Linyuan Wei"}, {"name": "Yi Wang"}, {"name": "Jin Hu"}, {"name": "Baoyi Chen"}], "author_count": 4}, {"id": "2609.26881", "category": "cond-mat", "title": "Fermion bag study of the two-dimensional Majorana-Hubbard model at finite hopping", "abstract": "The two-dimensional Majorana-Hubbard model on the $\\pi$-flux lattice involves the most local interaction possible for a lattice with one relativistic Majorana fermion per site. It is predicted to host a Majorana semimetal, dimerized phases, and quantum-critical points with an emergent $U(1)$ symmetry. Nonperturbative lattice calculations for this model remain a major open challenge, thus far limited to zero hopping. We present quantum Monte Carlo simulations of the model at finite hopping using Hamiltonian fermion bags, which are based on a continuous-time expansion with Boltzmann weights that are Pfaffians of a matrix with dimension set by the expansion order, and which give the sign of the weight. Sign problem severity is related to the location of zero modes in the free hopping matrix, and for couplings $g\\lesssim 0.7$ and $\\beta=L/4$ it is fully removed for lattices up to at least $256$ sites. The interaction strength $g>0$ enhances the $U(1)$-charged dimerization doublet and suppresses the neutral channel, as the renormalization group predicts. Increasing the interactions also restores $U(1)$ symmetry in the component of the dimerization correlator that is even under bond orientation exchange, but not its odd component. There is a persistent anisotropy in the odd component with the symmetry of a lattice nematic. The data is consistent with a gapless semimetal throughout the sign-problem-minimal window.", "url": "https://arxiv.org/abs/2609.26881", "type": "理论+数值", "summary": "1. 该工作采用哈密顿量费米子袋量子蒙特卡罗方法，在有限跃迁下研究二维π通量晶格上的Majorana-Hubbard模型，突破了此前仅限零跃迁的非微扰计算限制。\n2. 其关键贡献在于连续时间展开的权重为维数随阶数变化的矩阵Pfaffian并可判定符号，符号问题严重性与自由跃迁矩阵零模位置相关，在g≲0.7、β=L/4时最多256格点无符号问题。\n3. 相互作用增强U(1)荷二聚化双重态并压制中性通道，偶分量恢复U(1)对称而奇分量保留晶格向列各向异性，且在无符号问题窗口内与无能隙半金属一致，为有限跃迁相图与非微扰研究提供基准和可检验判据。", "summary_source": "deepseek", "authors": [{"name": "Mark Johnston"}, {"name": "Emilie Huffman"}], "featured_authors": [{"name": "Mark Johnston"}, {"name": "Emilie Huffman"}], "author_count": 2}, {"id": "2609.26916", "category": "cond-mat", "title": "Interlayer-correlated fractional quantum Hall state in a trilayer electron system", "abstract": "In multilayer quantum Hall systems, when the layer separation is sufficiently small, the interplay between intralayer and interlayer Coulomb interactions can lead to exotic, multi-component, many-body states. A particular example is the even-denominator fractional quantum Hall state (FQHS) at total filling factor $\\nu=1/2$ in bilayer systems with negligible interlayer tunneling. This state can be understood as a generalized Laughlin state described by the Halperin-Laughlin $\\Psi_{331}$ wavefunction. While such correlated states have been extensively explored in bilayers, little is known about their counterparts in systems with more than two layers. Here, we investigate a trilayer two-dimensional electron system confined to ultrahigh-quality GaAs triple quantum wells. We observe an exotic FQHS at total filling factor $\\nu=5/7$, evinced by a deep longitudinal resistance minimum and a quantized Hall plateau, when the side layers have a density larger than the middle layer and $d/l_B \\simeq 2.2$ ($d$ is the interlayer distance and $l_B$ the magnetic length). This state is naturally interpreted as the long-predicted trilayer, generalized Laughlin ($\\Psi_{33311}$) state, characterized by $\\nu=1/3$-like intralayer correlation within each layer and $\\nu=1$-like interlayer correlation between neighboring layers. Our observation establishes a new member of the Halperin-Laughlin many-body states that extends interlayer coherence to three coupled layers.", "url": "https://arxiv.org/abs/2609.26916", "type": "理论", "summary": "1. 该工作在三层GaAs量子阱二维电子系统中，通过输运测量在总填充因子ν=5/7处观测到分数量子霍尔态，其纵向电阻出现深极小并伴随量子化霍尔平台。\n2. 其关键卖点在于该态出现于两侧层密度高于中间层且d/l_B≈2.2的层间关联区间，可自然解释为长期预言的Ψ33311广义Laughlin态，兼具层内ν=1/3型与相邻层间ν=1型关联。\n3. 这一结果将Halperin-Laughlin多体态与层间相干性拓展至三层耦合体系，为研究多层量子霍尔中的多组分关联、层间隧穿及密度失衡效应提供了明确实验基准。", "summary_source": "deepseek", "authors": [{"name": "Chengyu Wang"}, {"name": "C. T. Tai"}, {"name": "N. Toemtrisna"}, {"name": "A. Gupta"}, {"name": "L. N. Pfeiffer"}, {"name": "K. W. Baldwin"}, {"name": "M. Shayegan"}], "featured_authors": [{"name": "Chengyu Wang"}, {"name": "C. T. Tai"}, {"name": "N. Toemtrisna"}, {"name": "L. N. Pfeiffer"}, {"name": "K. W. Baldwin"}, {"name": "M. Shayegan"}], "author_count": 7}, {"id": "2609.26925", "category": "cond-mat", "title": "First Passage in the Presence of Jump Rate Fluctuations: A Transition from Infinite to Finite Mean", "abstract": "A simple symmetric random walk on a one-dimensional lattice is guaranteed to reach any target site, yet its mean first-passage time diverges. Here, we show that stochastic fluctuations in the jump rate can fundamentally alter this classic result. We find a phase transition in the mean first-passage time: sufficiently broad rate fluctuations render it finite, whereas weaker fluctuations leave it infinite. Our results demonstrate that temporal fluctuations in the jump rate---and hence in the diffusivity---can overcome spatial wandering and regularize otherwise divergent first-passage times.", "url": "https://arxiv.org/abs/2609.26925", "type": "理论", "summary": "1. 该工作研究一维简单对称随机游走在跃迁速率随机涨落下的首次通过时间，并重新审视其经典发散行为。\n2. 其卖点在于揭示平均首次通过时间随跃迁速率涨落强度发生相变：涨落足够宽时有限，较弱时仍发散。\n3. 这显示跃迁速率或扩散率的时间涨落可克服空间游走并正则化原本发散的首次通过时间，提供调控思路。", "summary_source": "deepseek", "authors": [{"name": "Bara Levit"}, {"name": "Shlomi Reuveni"}], "featured_authors": [{"name": "Bara Levit"}, {"name": "Shlomi Reuveni"}], "author_count": 2}, {"id": "2609.26943", "category": "cond-mat", "title": "Viscous Dissipation Governs Bubble Morphology and Failure in Soft Matter", "abstract": "Cavitation, the growth of bubbles in fluids and soft matter, plays a central role in tissue damage, ultrasound therapies, and material failure, yet the influence of viscoelastic dissipation on bubble dynamics remains unclear. Here, we investigate cavitation in polyacrylamide hydrogels with identical elastic moduli but different viscous dissipation. We observe a striking symmetry breaking transition: elastic gels rapidly develop ellipsoidal cavities before rupture, whereas viscoelastic gels sustain large, nearly spherical bubbles. A modified Rayleigh Plesset framework shows that viscous stresses suppress shape instabilities and delay symmetry breaking, whereas elastic stresses accelerate cavity deformation. Finite element simulations independently validate these findings. The Deborah number (De) further captures the competition between material relaxation and cavity growth, with higher De associated with predominantly elastic growth and lower De with greater relaxation. Together, our results establish viscous dissipation as a key stabilizing mechanism that governs bubble morphology and failure in soft materials. These results have direct implications for understanding cavitation-mediated damage in biological tissues, optimizing therapeutic ultrasound, and advancing mechanical characterization of hydrogels for engineering and food processing applications.", "url": "https://arxiv.org/abs/2609.26943", "type": "理论+数值", "summary": "1. 该工作用相同弹性模量但不同黏性耗散的聚丙烯酰胺水凝胶，研究空化气泡形态与破裂。\n2. 其关键在于修正瑞利–普莱塞特框架揭示黏性应力抑制形状失稳并延迟对称破缺、弹性应力加速空腔变形，有限元模拟独立验证，德博拉数刻画松弛与生长竞争。\n3. 这支持将黏性耗散视为软材料中气泡形态与失效的稳定机制，并启发组织损伤、治疗超声和水凝胶力学表征研究。", "summary_source": "deepseek", "authors": [{"name": "Sushma SP"}, {"name": "Anshul Shrivastava"}, {"name": "Imnatoshi Jamir"}, {"name": "Aritra Chatterjee"}, {"name": "Namrata Gundiah"}], "featured_authors": [{"name": "Sushma SP"}, {"name": "Anshul Shrivastava"}, {"name": "Imnatoshi Jamir"}, {"name": "Aritra Chatterjee"}, {"name": "Namrata Gundiah"}], "author_count": 5}, {"id": "2609.26957", "category": "cond-mat", "title": "Matrix Density Waves and Fractionally Charged Point Defects in Flavor Weyl Semimetals", "abstract": "A conventional interaction-driven Weyl density wave is a complex scalar and supports vortex lines, but no topologically stable point defects. We show that two Weyl flavors do not merely duplicate this order. Starting from the matrix-valued internode coherence, a local flavor-symmetric repulsion selects a traceless adjoint condensate within the density-wave sector, while the fermionic ground-state energy locks its complex components into the collinear form $\\mathbf{\\Delta}=\\Phi_0\\mathbf{n} e^{i\\theta}$. The resulting order-parameter manifold, $(S^2\\times S^1)/\\mathbb Z_2$, supports both unit hedgehogs and half-quantum Alice strings of the same electronic mass that gaps the Weyl fermions. An elementary hedgehog binds a single normalizable zero mode whose empty and occupied sectors carry charges $-e/2$ and $+e/2$ at neutrality. An elementary Alice string carries a single chiral electronic mode despite its $\\pi$ phase winding, and transporting a hedgehog around it reverses the hedgehog winding, $N\\rightarrow-N$. Flavor therefore converts spontaneous translation breaking into a route to point-defect fractionalization and intertwines the point- and line-defect sectors of an interaction-generated electronic mass.", "url": "https://arxiv.org/abs/2609.26957", "type": "理论", "summary": "1. 该工作从双味Weyl半金属的矩阵值节间相干出发，构建并分析了局域味对称排斥驱动的矩阵密度波及其拓扑缺陷。\n2. 其卖点在于无迹伴随凝聚被费米基态能量锁定为共线形式，使序参量流形变为(S^2×S^1)/Z2，并同时支持单位刺猬与半量子Alice弦；基本刺猬束缚单个可归一零模，其空与占据扇区在中性时分别带−e/2与+e/2，Alice弦虽有π相位绕转仍携带单支手性模，且绕其输运刺猬会反转缠绕数N→−N。\n3. 这揭示味自由度可将自发平移破缺转化为点缺陷分数化途径，并交织相互作用诱导电子质量的点与线缺陷扇区，为在此类体系中实现分数电荷和缺陷缠绕操控提供启发。", "summary_source": "deepseek", "authors": [{"name": "Shantonu Mukherjee"}, {"name": "Hridis K. Pal"}], "featured_authors": [{"name": "Shantonu Mukherjee"}, {"name": "Hridis K. Pal"}], "author_count": 2}, {"id": "2609.26966", "category": "cond-mat", "title": "An interdimensional funnel enhances topologically protected oscillations in high-dimensional stochastic systems", "abstract": "Biochemical systems such as protein complexes often occupy configuration spaces whose dimensionality grows with the number of molecular components. Although usually viewed as an obstacle to coherent dynamics, here we show that high dimensionality can enhance topologically protected oscillations. In the topological regime, a stochastic system with a $D$-dimensional configuration space develops a steady-state current confined to a one-dimensional edge cycle. The intervening boundary faces between the $D$-dimensional bulk and the one-dimensional cycle form an interdimensional funnel, sequentially pushing the system towards lower dimensional faces, down to the one-dimensional cycle. As a consequence, increasing $D$ enhances the funnel, leading to improved one-dimensional localization and oscillatory coherence. A quantized biorthogonal Zak phase identifies the transition to the topological regime, which additionally exhibits a highly structured non-Hermitian skin effect. In contrast with previous realizations of topological states in stochastic systems, the phenomena we uncover have no counterpart in quantum condensed matter or active matter systems.", "url": "https://arxiv.org/abs/2609.26966", "type": "理论", "summary": "1. 该工作表明高维随机系统中高维性可增强拓扑保护振荡，当构型空间维数为D时稳态电流被限制在一维边缘环上，并伴随高维体相到低维边界面的跨维漏斗。\n2. 其核心卖点在于跨维漏斗逐级将系统推向导数更低的边界面直至一维环，因此提高D反而增强一维局域与振荡相干性，且量子化双正交Zak相标识拓扑转变，并呈现高度结构化的非厄米趋肤效应。\n3. 该机制不同于量子凝聚态或活性物质中的已知拓扑态，为高维生化网络等随机体系利用维度提升振荡鲁棒性提供了新原理。", "summary_source": "deepseek", "authors": [{"name": "Varsha Traynor"}, {"name": "Jaime Agudo-Canalejo"}], "featured_authors": [{"name": "Varsha Traynor"}, {"name": "Jaime Agudo-Canalejo"}], "author_count": 2}, {"id": "2609.26971", "category": "cond-mat", "title": "Robust Strange Metallicity across Attractive and Repulsive Hubbard Models", "abstract": "Using determinant quantum Monte Carlo simulations, we compare charge transport in the two-dimensional attractive and repulsive Hubbard models at strong coupling, $|U|/t=6$. Although the interaction with opposite signs generates qualitatively different low-energy spin, charge, and pairing correlations, both exhibit approximately linear-in-temperature resistivity over a broad intermediate- and high-temperature regime. At asymptotically high temperature this common behavior follows from the moment expansion of the conductivity, whose leading contribution is even in $U$. More strikingly, the similarity persists to temperatures well below $|U|$, where strong interaction-dependent correlations have already developed, and also irrespective of whether resistivity crosses the MIR limit. Using the Nernst--Einstein relation, we find that the common linear-in-temperature resistivity is primarily associated with an approximately Curie-like charge compressibility and weakly temperature-dependent diffusivity. The two models separate only at lower temperatures, where the attractive model develops a pronounced feature in the charge diffusivity correlated with signatures of pair formation. These results show that linear-in-temperature incoherent transport in the Hubbard model can be remarkably insensitive to the microscopic nature of the low-energy correlations. Our results suggest that transport in the incoherent regime appears insensitive to what the system will ultimately become at low temperature; the distinction between competing low-energy states becomes visible only when their characteristic correlations acquire sufficiently long spatial or temporal coherence.", "url": "https://arxiv.org/abs/2609.26971", "type": "理论+数值", "summary": "1. 该工作用行列式量子蒙特卡洛模拟二维强耦合哈伯德模型，在 |U|/t=6 下对比吸引与排斥相互作用中的电荷输运，系统研究电阻率的温度依赖。\n2. 其主要卖点是：尽管相互作用符号相反导致低能自旋、电荷与配对关联定性不同，二者在宽广中高温区直至低于 |U| 仍呈近似线性温度电阻率，且不依赖是否跨越 MIR 极限；该共性可由电导矩展开领头项对 U 为偶，并结合 Nernst-Einstein 关系用近居里型电荷压缩率和弱温度依赖扩散率解释。\n3. 这表明非相干区输运对体系最终低能态并不敏感，只有竞争低能态的特征关联获得足够长空间或时间相干性时差异才显现，为奇异金属与配对形成研究提供启发。", "summary_source": "deepseek", "authors": [{"name": "Xiaoyue Ma"}, {"name": "Emily Z. Zhang"}, {"name": "Thomas P. Devereaux"}], "featured_authors": [{"name": "Xiaoyue Ma"}, {"name": "Emily Z. Zhang"}, {"name": "Thomas P. Devereaux"}], "author_count": 3}, {"id": "2609.26988", "category": "cond-mat", "title": "Electronic Effects of a Twisted Graphene Catenoid Bridge", "abstract": "The interplay between non-trivial background geometries and quantum dynamics has emerged as a powerful tool to tailor the electronic properties of 2D materials. In this work, we investigate the effective quantum dynamics of massless Dirac fermions confined to a twisted graphene structure called a catenoid bridge, which connects two single-layer sheets. By adopting a continuum approach, where the electron dynamics is governed by a purely covariant curved Dirac equation, we obtain the effective Hamiltonian containing both curvature and twist interactions. We found that the torsion modifies the electronic states by producing a geometric phase on the wave function. In addition, the twist also deforms the surface geometry, which leads to a new geometric term in the effective Hamiltonian. This twist potential enhances the barrier around the catenoid throat, which increases the suppression of the inter-layer transmission coefficient. Like the spin-curvature interaction, the spin-twist term has a chiral dependence which is invariant under a combined parity and spin flip transformation. As a result, the electronic states can be restricted to the upper or lower layer. These findings provide valuable insights into how mechanical deformations can be harnessed to control quantum transport in graphene-based wormhole architectures.", "url": "https://arxiv.org/abs/2609.26988", "type": "理论", "summary": "1. 该工作采用连续模型与协变弯曲狄拉克方程，研究受限在连接两层单层石墨烯的扭曲悬链面桥中的无质量狄拉克费米子有效量子动力学，并导出同时包含曲率与扭曲相互作用的有效哈密顿量。\n2. 其核心卖点是揭示扭转通过几何相位修正电子态并改变表面几何，从而引入新的扭曲势，增强悬链面喉部势垒并抑制层间透射系数；自旋-扭曲项具有手性依赖且在宇称与自旋翻转联合变换下不变，可将电子态限制在上层或下层。\n3. 这为利用机械形变调控石墨烯类虫洞结构中的量子输运提供了明确思路，并暗示曲率、扭转与自旋自由度耦合可用于设计层选择或谷/自旋相关的传输器件。", "summary_source": "deepseek", "authors": [{"name": "G. M. Delgado"}, {"name": "J. E. G. Silva"}], "featured_authors": [{"name": "G. M. Delgado"}, {"name": "J. E. G. Silva"}], "author_count": 2}, {"id": "2609.26991", "category": "cond-mat", "title": "Spin Configurations of Anyonic excitations in Moiré Fractional Chern Insulators", "abstract": "We have examined the nature of elementary excitations in particular, their spin polarization, in recently discovered zero-field fractional Chern insulator in twisted bilayer MoTe$_2$. We have found that the finite-size bilayer system, in close proximity to a planar parabolic quantum dot containing a single electron (or a hole), forms an incompressible spin-unpolarized fractional Chern insulator at 1/3 filling factor. The corresponding energy gap is found to be large and weakly dependent on the separation between the quantum dot and the bilayer. We predict that in this fractional Chern insulator coupled to a quantum dot, spin-unpolarized quasiparticles and quasiholes are expected to appear as low-energy elementary excitations. The charge density results indicate that, for the spin-unpolarized quasiparticles, the positive charge is strongly localized near the negatively charged QD within the spin-flipped component, whereas for the spin-polarized quasiparticles, such localization is much less pronounced.", "url": "https://arxiv.org/abs/2609.26991", "type": "理论", "summary": "1. 该工作研究了零场扭曲双层MoTe2分数陈绝缘体中任意子元激发的自旋极化，并构建其与含单电子或空穴的抛物量子点近邻耦合的有限尺寸双层体系。\n2. 发现1/3填充下该体系形成不可压缩的自旋未极化分数陈绝缘体，能隙较大且对量子点与双层间距依赖较弱，低能激发应为自旋未极化准粒子与准空穴。\n3. 电荷密度显示自旋未极化准粒子的正电荷在自旋翻转分量中强局域于带负电量子点附近，而自旋极化时局域显著减弱，为用局域探测识别任意子自旋构型提供思路。", "summary_source": "deepseek", "authors": [{"name": "Vadym Apalkov"}, {"name": "Tapash Chakraborty"}], "featured_authors": [{"name": "Vadym Apalkov"}, {"name": "Tapash Chakraborty"}], "author_count": 2}, {"id": "2609.27054", "category": "cond-mat", "title": "On quantum confinement without barriers", "abstract": "Usually in semiconductor heterostructures, such as quantum wells, the quantum confinement is realized by means of heterobarriers, which are simply the band offsets in adjacent materials. Here the arguments are provided, that the energy dispersions in materials (in simple case determined by effective masses) are important as well. Using a simple model system, such as quantum well with an additional heterojunction, it is shown the predominant localization of the carrier density in the regions with higher effective mass. The possibility of different spatial localization of wave function for different subbands is predicted. This can be applied in semiconductor structures such as quantum cascade lasers.", "url": "https://arxiv.org/abs/2609.27054", "type": "理论", "summary": "1. 该工作论证，在半导体异质结构中，除带阶势垒外，材料的能量色散（简单情形由有效质量决定）也参与量子限制，并用附加异质结的量子阱模型加以说明。\n2. 其核心物理卖点在于，载流子密度优先局域于有效质量较高区域，且不同子带可呈现不同的波函数空间局域，表明限制可由能带色散而非仅由势垒决定。\n3. 这为通过有效质量工程调控半导体量子结构中的载流子分布与子带波函数提供了思路，并对量子级联激光器等器件的设计具有潜在意义。", "summary_source": "deepseek", "authors": [{"name": "I.A. Kokurin"}], "featured_authors": [{"name": "I.A. Kokurin"}], "author_count": 1}, {"id": "2609.27065", "category": "cond-mat", "title": "Thermodynamic Uncertainty Relations in Chaotic Andreev Billiards", "abstract": "We investigate how particle-hole symmetry, quantum interference, and tunnel barriers shape thermodynamic uncertainty relations in chaotic Andreev billiards. Using random-matrix theory and the Mahaux-Weidenmüller scattering approach, we study charge conductance and shot noise across the four Altland-Zirnbauer symmetry classes, from the single-channel extreme quantum limit to the multichannel semiclassical regime and from ideal to opaque contacts. We characterize thermodynamic precision through two complementary ensemble observables: either by averaging the sample-resolved noise-to-conductance ratio, or from the separately averaging noise and conductance. Their pronounced discrepancy in the extreme quantum regime reveals the non-self-averaging character of mesoscopic transport and persists over a broad range of barrier transparencies. For ideal contacts, the first provides a sensitive fingerprint of the Altland-Zirnbauer symmetry class. In the opaque regime, this hierarchy changes. Despite these strong symmetry- and barrier-dependent effects, the standard thermodynamic uncertainty relation remains satisfied throughout all regimes investigated. Our results establish thermodynamic uncertainty as a symmetry-sensitive probe of universal transport in chaotic normal-superconducting systems.", "url": "https://arxiv.org/abs/2609.27065", "type": "理论+数值", "summary": "1. 该工作用随机矩阵理论和Mahaux-Weidenmüller散射方法，研究了混沌Andreev台球中电荷电导与散粒噪声的热力学不确定关系。\n2. 其核心贡献是在四类AZ对称性、单通道至极多通道及理想到不透明接触下，比较两种系综平均定义并揭示极端量子区非自平均输运。\n3. 该结果将热力学不确定性确立为探测混沌正常-超导体系普适输运的对称性敏感探针，且标准TUR在全部考察区间仍成立。", "summary_source": "deepseek", "authors": [{"name": "I. R. A. C. Lucena"}, {"name": "T. J. A. Mori"}, {"name": "M. M. Soares"}, {"name": "D. Bazeia"}, {"name": "A. R. Rocha"}], "featured_authors": [{"name": "I. R. A. C. Lucena"}, {"name": "T. J. A. Mori"}, {"name": "M. M. Soares"}, {"name": "D. Bazeia"}, {"name": "A. R. Rocha"}], "author_count": 5}, {"id": "2609.27108", "category": "cond-mat", "title": "Towards Extended Active Learning for Modelling Ferroelectric Switching: the Need for 'Gold Standards'", "abstract": "For the purpose of modelling ferroelectric switching in wurtzite-structured materials, four cost-effective density-functional theory (DFT) methods (PBE, PBEsol, r2SCAN, and r2SCAN-rVV10) are considered and compared to various ab initio approaches based on the random-phase approximation (RPA), including RPA with singles corrections (RPAR+S), as well as second-order Møller-Plesset perturbation theory (MP2). The purpose is to determine whether an ab initio approach could act as a 'gold standard' for estimating the reliability of DFT, thus determining an optimal DFT method for use in exhaustive tasks such as the training of machine-learning interatomic potentials (MLIP) for large-scale simulations of materials of arbitrary composition and structure such as Al1-xScxN and Zn1-xMgxO, using AlN, Al0.5Sc0.5N, ZnO, and Zn0.5Mg0.5O as model materials. Applications of active learning (AL) are now common, in which results from MLIP simulations are used to enhance the DFT training data set, but future extended active learning (EAL) methods will also need to systematically assess the DFT methodology against a gold standard. Herein, the variability of the ab initio results is found to exceed that required for a robust gold standard, but the DFT and ab initio approaches appear to converge on RPAR+S and r2SCAN-rVV10 as optimal method choices to initiate EAL. The electron correlation energy is found to be dominated by covalent binding effects associated with the high-electron-density anions involved, but the van der Waals dispersion force is seen to be too significant to ignore in ferroelectric modelling.", "url": "https://arxiv.org/abs/2609.27108", "type": "理论+数值", "summary": "1. 为了对纤锌矿结构材料中的铁电开关进行建模，考虑了四种经济有效的密度泛函理论 (DFT) 方法（PBE、PBEsol、r2SCAN 和 r2SCAN-rVV10），并与基于随机相位近似 (RPA) 的各种从头计算方法进行了比较，包括带有单次校正的 RPA (RPAR+S) 以及二阶 Møller-Plesset 微扰理论（MP2）。\n2. 在此，发现从头计算结果的可变性超过了稳健金标准所需的变化，但 DFT 和从头计算方法似乎收敛于 RPAR+S 和 r2SCAN-rVV10 作为启动 EAL 的最佳方法选择。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Jeffrey R. Reimers"}, {"name": "Wenbin Zhang"}, {"name": "Zhe Su"}, {"name": "Musen Li"}, {"name": "Carla Verdi"}, {"name": "Tim Gould"}, {"name": "Wei Ren"}], "featured_authors": [{"name": "Jeffrey R. Reimers"}, {"name": "Wenbin Zhang"}, {"name": "Zhe Su"}, {"name": "Carla Verdi"}, {"name": "Tim Gould"}, {"name": "Wei Ren"}], "author_count": 7}, {"id": "2609.27132", "category": "cond-mat", "title": "Exact Equivariance from Ordinary Neural Networks for Lattice Many-Body Dynamics", "abstract": "Large-scale simulations of correlated electron systems require repeated evaluations of the electronic forces and transition energies driving collective dynamics. Machine-learning surrogates alleviate this bottleneck, but incorporating symmetry often involves carefully designed descriptors or specialized network architectures. We show that ordinary multilayer perceptrons equipped with finite-group averaging provide exactly equivariant surrogates directly from microscopic configurations. The construction separates symmetry enforcement from the internal network architecture and applies to both discrete and continuous lattice degrees of freedom. In the Falicov--Kimball model, it predicts directional hopping free-energy differences; in the Holstein model, its invariant limit generates conservative lattice forces. Benchmarks against exact diagonalization establish microscopic accuracy and agreement of dynamical correlations, while large-scale simulations recover multiscale charge ordering and charge-density-wave coarsening. These results demonstrate an accessible, reusable route to symmetry-preserving many-body dynamics for systems with finite lattice point groups.", "url": "https://arxiv.org/abs/2609.27132", "type": "理论+数值", "summary": "1. 该工作提出用普通多层感知机结合有限群平均，从微观构型直接构造晶格多体动力学中严格等变的机器学习代理模型。\n2. 其关键卖点是将对称性强制与网络内部结构解耦，可同时处理离散和连续晶格自由度；在法利科夫-金博尔模型中预测方向性跳跃自由能差，并在霍尔斯坦模型的不变极限生成保守晶格力，经精确对角化验证微观精度与动力学关联一致。\n3. 这为仅具有限晶格点群的相关电子体系提供了可复用、易实现的保对称多体动力学模拟路径，并可从大规模模拟中恢复多尺度电荷有序与电荷密度波粗化。", "summary_source": "deepseek", "authors": [{"name": "Ho Jang"}, {"name": "Sankha Subhra Bakshi"}, {"name": "Gia-Wei Chern"}], "featured_authors": [{"name": "Ho Jang"}, {"name": "Sankha Subhra Bakshi"}, {"name": "Gia-Wei Chern"}], "author_count": 3}, {"id": "2609.27324", "category": "cond-mat", "title": "Mobility-Gap Robustness and Středa-Hall Separation in Disordered Axion Pumping", "abstract": "We show that the noncommutative second Chern number of a $(3+1)$D disordered axion pump remains quantized beyond global spectral gap closure at $W_g \\approx 14.5$. Large-scale computation of the second Chern number and finite-size scaling demonstrate convergence of $\\mathrm{Ch}_2$ toward $-1$ well into the mobility-gap regime ($W \\lesssim 16.5$), while the Středa-Hall response $\\partial_\\phi \\mathrm{Ch}_{0,3}$ departs rapidly after global spectral gap closure, serving as an internal control that distinguishes bulk mobility-gap protection from finite-size artifacts. Level statistics identify a 3D unitary Anderson transition at each pump slice and locate the mobility-edge bottleneck at $\\tau=0$, with critical disorder $W_c \\approx 18$.", "url": "https://arxiv.org/abs/2609.27324", "type": "理论+数值", "summary": "1. 我们证明，$(3+1)$D 无序轴子泵的非交换二阶陈数在 $W_g \\approx 14.5$ 处保持量子化，超出全局谱间隙闭合。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Bryan Leung"}, {"name": "Emil Prodan"}], "featured_authors": [{"name": "Bryan Leung"}, {"name": "Emil Prodan"}], "author_count": 2}, {"id": "2609.27347", "category": "cond-mat", "title": "THz-Driven Quantum Ionic Magnetism in a Quantum Paraelectric SrTiO3", "abstract": "Magnetic moments carried by rotating ionic motion in crystals are becoming recognized as an important contribution to magnetism, angular momentum transport, and optical activity. However, efficient approaches to their dynamical control are lacking. Here, we report THz-driven generation and optical detection of quantum ionic magnetism in quantum paraelectric SrTiO3. We observe an oscillatory ionic magnetization without a corresponding oscillatory polarization, contradicting from the classical relation M~PXdP/dt while its suppression above the quantum paraelectric regime points to a quantum ionic origin. Analysis shows that this effect results from the beating between quantum ionic eigenstates whose degeneracy is lifted due to the directional symmetry breaking by the THz pulse. The presented approach provides a pathway for the ultrafast control of ionic magnetization in quantum materials for spintronic and thermotronic applications.", "url": "https://arxiv.org/abs/2609.27347", "type": "理论", "summary": "1. 该工作利用太赫兹脉冲在量子顺电体SrTiO3中实现了量子离子磁性的产生和光学探测，并观测到离子磁化强度的振荡。\n2. 其关键点在于：该离子磁化振荡不伴随同频极化振荡，违背经典关系M∝P×dP/dt，且其在量子顺电区之上的抑制表明量子离子起源，可归因于太赫兹脉冲破坏方向对称性导致量子离子本征态简并解除后的拍频。\n3. 这为量子材料中离子磁化的超快调控提供了途径，并可能推动自旋电子学与热电子学应用。", "summary_source": "deepseek", "authors": [{"name": "In Hyeok Choi"}, {"name": "Sergei Urazhdin"}, {"name": "Man Tou Wong"}, {"name": "Zi-Jie Liu"}, {"name": "Keith A. Nelson"}], "featured_authors": [{"name": "In Hyeok Choi"}, {"name": "Sergei Urazhdin"}, {"name": "Man Tou Wong"}, {"name": "Zi-Jie Liu"}, {"name": "Keith A. Nelson"}], "author_count": 5}, {"id": "2609.27352", "category": "cond-mat", "title": "Anisotropic upper critical field in the van der Waals superconducting quasicrystal (Ta$_{0.7}$Nb$_{0.3}$)$_{1.6}$Te", "abstract": "We investigated the upper critical field of a large single grain of the Nb-substituted van der Waals layered quasicrystal (Ta$_{0.7}$Nb$_{0.3}$)$_{1.6}$Te. The sample exhibits a sharp superconducting transition at $T_{\\mathrm{c}}$ = 1.35 K, the highest value reported to date among quasicrystal superconductors. The angular dependence of the critical field exhibits a pronounced criterion dependence: the field determined using the 10% $R_{\\mathrm{N}}$ ($R_{\\mathrm{N}}$: normal-state resistance) criterion is well described by the anisotropic Ginzburg-Landau model, whereas those determined using the 65% and 90% $R_{\\mathrm{N}}$ criteria exhibit Tinkham-like angular dependence characteristic of two-dimensional superconductivity. The high-field part of the resistive transition is well described by a surface-superconductivity model and exhibits a pronounced excitation-current dependence for magnetic fields close to the $ab$ plane, supporting the presence of surface superconductivity on the quasiperiodic $ab$-plane surfaces. The bulk $H_{\\mathrm{c2}}$ is strongly anisotropic, with the in-plane $H_{\\mathrm{c2}}$ exceeding the weak-coupling Pauli limit by a factor of approximately 2.5. For both field orientations, $H_{\\mathrm{c2}}(T)$ deviates upward from the conventional dirty-limit Werthamer-Helfand-Hohenberg prediction at low temperatures. A phenomenologically modified Ginzburg-Landau-Abrikosov-Gorkov model incorporating a spatial distribution of the electronic diffusivity substantially improves the description of $H_{\\mathrm{c2}}(T)$, suggesting that spatial variations in electronic transport properties may contribute to its anomalous temperature dependence.", "url": "https://arxiv.org/abs/2609.27352", "type": "理论", "summary": "1. 该工作测量了Nb取代范德华层状准晶(Ta₀.₇Nb₀.₃)₁.₆Te大单晶的上临界场，其Tc=1.35 K为迄今准晶超导体中最高。\n2. 关键结果是临界场具判据依赖的角度行为：10%R_N符合各向异性GL模型，65%与90%判据呈Tinkham型二维特征，高场区由表面超导模型描述。\n3. 面内Hc2超弱耦合Pauli极限约2.5倍且低温偏离WHH预言，引入电子扩散率空间分布的修正GLAG模型改善描述，提示输运不均匀性可能主导反常温度依赖。", "summary_source": "deepseek", "authors": [{"name": "Koki Kasai"}, {"name": "Yuki Tokumoto"}, {"name": "Taichi Terashima"}, {"name": "Takako Konoike"}, {"name": "Keiichi Edagawa"}], "featured_authors": [{"name": "Koki Kasai"}, {"name": "Yuki Tokumoto"}, {"name": "Taichi Terashima"}, {"name": "Takako Konoike"}, {"name": "Keiichi Edagawa"}], "author_count": 5}, {"id": "2609.27388", "category": "cond-mat", "title": "Strain Engineering of the Topological Gap and Tunable Chern Numbers in the 2D Kagome Metal-Organic Framework Eu$_2$(C$_6$H$_4$)$_3$", "abstract": "The quantum anomalous Hall effect carries dissipationless chiral edge currents without an external magnetic field, yet raising its operating temperature and controlling the number of edge channels remain difficult. Using first-principles calculations, we identify the two-dimensional metal-organic kagome ferromagnet Eu$_2$(C$_6$H$_4$)$_3$ as an intrinsic Chern insulator whose topological gap can be enlarged by mechanical strain. The monolayer has a spin-orbit-coupling-induced gap of 72.7 meV that widens to 124.7 meV under -8% biaxial strain, realizing a quantum anomalous Hall phase with Chern number $\\mathcal{C}=-1$ and a single chiral edge state. The local moments come from the half-filled Eu $4f^{7}$ shell, while the gap-opening spin-orbit coupling is carried by Eu $5d$ states hybridized into the carbon kagome bands. The AB-stacked bilayer couples ferromagnetically and accumulates the per-layer Chern numbers, giving $\\mathcal{C}=-2$ with two co-propagating chiral channels. An out-of-plane electric field then drives the bilayer through a sequence of topological transitions among $\\mathcal{C}=-2$, $-3$, and $-1$, switching the number of edge channels. Together, strain, stacking, and gating give three distinct handles on the gap and the Chern number within a single stoichiometric material.", "url": "https://arxiv.org/abs/2609.27388", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算，将二维金属有机kagome铁磁体Eu₂(C₆H₄)₃识别为本征Chern绝缘体，并研究应变、堆叠与电场对其拓扑带隙和Chern数的调控。\n2. 其关键机制与卖点是半填满Eu 4f⁷提供局域磁矩，而Eu 5d杂化进碳kagome能带的自旋轨道耦合打开带隙；单层带隙72.7 meV，在-8%双轴应变下增至124.7 meV并实现C=-1与单手性边缘态；AB双层累积为C=-2，垂直电场驱动C=-2、-3、-1间拓扑相变，切换边缘通道数。\n3. 这为在单一化学计量材料中利用应变、堆叠和门控独立调控量子反常霍尔相及手性边缘输运提供了明确设计原则。", "summary_source": "deepseek", "authors": [{"name": "Jiaxuan Guo"}, {"name": "Simin Nie"}, {"name": "Fritz B. Prinz"}], "featured_authors": [{"name": "Jiaxuan Guo"}, {"name": "Simin Nie"}, {"name": "Fritz B. Prinz"}], "author_count": 3}, {"id": "2609.27425", "category": "cond-mat", "title": "Uphill and downhill first passage of an active Brownian particle: Asymmetry and exact path reweighting", "abstract": "First passage processes in active systems combine stochastic transport with self-propulsion and orientational persistence, making motion along and against an external bias sensitive to the internal active dynamics. For passive biased diffusion, opposite exits can have different splitting probabilities while their conditional first passage time distributions remain identical. We study how this relation changes for an active Brownian particle driven by a constant external force between two absorbing boundaries. Self-propulsion breaks the equality of the uphill and downhill first passage time distributions and modifies the splitting probabilities. Nevertheless, the two directional path ensembles remain exactly related by spatial reflection, which pairs downhill and uphill first passage paths of the same duration while preserving their orientational history. The log-ratio of the probabilities of a path and its reflected partner defines a path-dependent asymmetry functional and provides an exact reweighting between the two ensembles. In the symmetric half-weighted representation, the uphill and downhill first passage time distributions coincide for arbitrary orientational persistence. The same path relation also allows rare uphill statistics to be reconstructed from the more frequently sampled downhill trajectories. Numerical simulations confirm the weighted equality across the explored bias and persistence regimes, while perturbative and asymptotic analyses clarify how orientational persistence produces the directional asymmetry of the unweighted statistics. The exact relation between the two directional path ensembles suggests that similar symmetry-based reconstruction protocols may be found in other nonequilibrium first-passage problems.", "url": "https://arxiv.org/abs/2609.27425", "type": "理论+数值", "summary": "1. 该工作研究恒定外力下、两吸收边界间活性布朗粒子的上坡与下坡首次通过，考察自驱动和取向持续性对分裂概率与首次通过时间分布的改变。\n2. 其卖点在于，自驱动虽破坏上下坡首次通过时间分布的相等性并修正分裂概率，但两方向路径系综仍由空间反射精确联系，反射配对路径等时长且保留取向历史，其概率对数比定义路径依赖的不对称泛函并给出精确重加权；在对称半权表示下，任意取向持续性下两方向分布重合，并可由更常采样的下坡轨迹重构稀有上坡统计。\n3. 该精确路径关系表明，类似基于对称性的重构方案或可推广至其他非平衡首次通过问题。", "summary_source": "deepseek", "authors": [{"name": "Mykola Tasinkevych"}, {"name": "Xuan My Le"}, {"name": "Artem Ryabov"}], "featured_authors": [{"name": "Mykola Tasinkevych"}, {"name": "Xuan My Le"}, {"name": "Artem Ryabov"}], "author_count": 3}, {"id": "2609.27575", "category": "cond-mat", "title": "Ultrastrong coupling of topologically protected edge and bulk magnetoplasmons without a dedicated cavity", "abstract": "In the ultrastrong light-matter coupling regime, the ability to confine the electric field to subwavelength scales and define an electromagnetic mode is essential. This task is typically achieved through dedicated cavities, such as THz metal resonators. Here, we instead introduce ultrastrong coupling directly between distinct magnetoplasmon excitations, leveraging solely the spatial symmetry of a confined electronic medium in the presence of a magnetic field. By patterning an AlGaN/GaN single quantum well hosting a two-dimensional electron gas into micrometer-scale patches, we tailor the mutual interactions between topologically protected edge and bulk magnetoplasmons, achieving coupling strengths of up to 0.1. The progressive breaking of rotational symmetry determines the coupling rules and leads to the emergence of energy gaps and unique chiral-mode hybridization. Our results highlight a path towards exploiting the symmetry class and topology of the magnetoplasmon wavefunction as a new parameter space for ultrastrong light-matter interaction without a dedicated cavity.", "url": "https://arxiv.org/abs/2609.27575", "type": "理论", "summary": "1. 该工作在不使用专用腔的条件下，通过将承载二维电子气的AlGaN/GaN单量子阱图形化为微米尺度斑块，实现了拓扑保护边缘磁等离激元与体磁等离激元之间的超强耦合。\n2. 其核心卖点在于仅凭磁场中受限电子介质的空间对称性及其逐步破缺来定制两者相互作用，从而获得高达0.1的耦合强度，并产生能隙与独特的手性模式杂化。\n3. 这为无需专用腔的超强光-物质相互作用提供了基于磁等离激元波函数对称性与拓扑的新设计维度，并可能启发可调控的手性极化激元与片上太赫兹研究。", "summary_source": "deepseek", "authors": [{"name": "F. Velli"}, {"name": "P. Sai"}, {"name": "M. Dub"}, {"name": "J. Dzian"}, {"name": "F. Le Mardele"}, {"name": "M. Mittendorff"}, {"name": "M. Orlita"}, {"name": "W. Knap"}, {"name": "C. Lange"}], "featured_authors": [{"name": "F. Velli"}, {"name": "P. Sai"}, {"name": "M. Dub"}, {"name": "M. Orlita"}, {"name": "W. Knap"}, {"name": "C. Lange"}], "author_count": 9}, {"id": "2609.27648", "category": "cond-mat", "title": "Charge and spin qubits in interacting quantum dots coupled to Rashba-active leads", "abstract": "We present a unified study of charge and spin qubits encoded in a single interacting quantum dot tunnel-coupled to Rashba fermionic leads. The dot is described by an Anderson impurity Hamiltonian with either repulsive or attractive local interactions and a magnetic field of arbitrary orientation. In the repulsive regime, a spin qubit is encoded in the singly occupied spin sector, whereas in the attractive regime, close to the degeneracy between the empty and doubly occupied configurations, these two states define a charge-qubit subspace. We combine a weak-coupling Lindblad master equation in the Markovian secular limit with numerically controlled matrix-product-state simulations of the full dot-reservoir system. In equilibrium, we identify magnetic pair breaking in the attractive regime and a weak Rashba-induced magnetic anisotropy when the magnetic field is rotated relative to the spin-orbit axis. In the dynamical regime, relaxation and decoherence are controlled by the energetic gap between the logical manifold and nearby leakage states, and are further enhanced by Rashba-dependent tunneling. These findings show that even a minimal Anderson-impurity description captures key ingredients for coherent spin and charge qubits: the energetic structure of leakage states and spin-orbit-dependent dot-lead hybridization.", "url": "https://arxiv.org/abs/2609.27648", "type": "理论+数值", "summary": "1. 该工作统一研究了与Rashba活性费米子库耦合的单个相互作用量子点中的电荷与自旋量子比特。\n2. 其卖点在于结合弱耦合Lindblad主方程与矩阵乘积态模拟，揭示泄漏态能隙和Rashba依赖隧穿控制弛豫与退相干。\n3. 这表明最小Anderson杂质模型已能捕捉相干自旋/电荷量子比特的关键：泄漏态能级结构与自旋轨道依赖的点-库杂化。", "summary_source": "deepseek", "authors": [{"name": "Grazia Di Bello"}, {"name": "Fabrizio Pavan"}, {"name": "Mattia Trama"}, {"name": "Roberta Citro"}, {"name": "Giulio De Filippis"}, {"name": "Carmine Antonio Perroni"}], "featured_authors": [{"name": "Grazia Di Bello"}, {"name": "Fabrizio Pavan"}, {"name": "Mattia Trama"}, {"name": "Roberta Citro"}, {"name": "Giulio De Filippis"}, {"name": "Carmine Antonio Perroni"}], "author_count": 6}, {"id": "2609.27705", "category": "cond-mat", "title": "Multiscale Entropies as Order Parameters for Nonequilibrium Phase Transitions", "abstract": "We develop a multiscale entropy framework based on the wavelet conditional renormalization group that decomposes the total Shannon entropy into contributions from different spatial scales. Generative modeling enables accurate estimation of these entropies from configurations or snapshots, even in nonequilibrium systems whose underlying probability distributions are unknown. Applications to the equilibrium $\\varphi^4$ model and nonequilibrium active Model B+ show that multiscale entropies reveal criticality and spatial organization obscured in the total entropy. These entropies serve as scale-dependent order parameters for characterizing phase transitions and pattern formation.", "url": "https://arxiv.org/abs/2609.27705", "type": "理论", "summary": "1. 该工作构建了基于小波条件重整化群的多尺度熵框架，将总香农熵分解为不同空间尺度的贡献，并借助生成模型从构型或快照中估计这些熵，无需已知概率分布。\n2. 其核心卖点在于，即便在非平衡且概率分布未知的体系中，多尺度熵仍能揭示被总熵掩盖的临界性与空间组织，并可作为尺度依赖序参量刻画相变与图案形成。\n3. 对平衡φ⁴模型与非平衡活性Model B+的应用表明，该框架为超越单尺度熵、统一描述平衡与非平衡相变提供了可推广的途径。", "summary_source": "deepseek", "authors": [{"name": "Gerhard Jung"}, {"name": "Misaki Ozawa"}], "featured_authors": [{"name": "Gerhard Jung"}, {"name": "Misaki Ozawa"}], "author_count": 2}, {"id": "2609.27723", "category": "cond-mat", "title": "Non-Hermitian engineering of superfluidity in a Rashba spin-orbit-coupled Fermi gas", "abstract": "We investigate superfluid pairing in a two-dimensional Rashba spin-orbit-coupled Fermi gas subject to spin-selective one-body loss. Within the non-Hermitian mean-field framework, we self- consistently solve the gap and number equations and find that moderate dissipation can significantly enhance the pairing gap, resulting in a pronounced nonmonotonic dependence on the dissipation strength. Dissipation also provides an additional control parameter for driving the system across the BCS-BEC crossover. We further analyze the quasi-particle spectrum and identify two distinct superfluid regimes characterized by one and three exceptional rings, separated by an exceptional spectral transition. Interestingly, dissipation can enhance both pairing channels while simultaneously inducing a momentum-dependent phase twist in the triplet component. These results demonstrate that spin-selective dissipation provides a versatile non-Hermitian control knob for manipulating superfluid pairing, spectral structure, and crossover physics in spin-orbit-coupled quantum gases.", "url": "https://arxiv.org/abs/2609.27723", "type": "理论", "summary": "1. 该工作研究了具有自旋选择性单粒子损耗的二维Rashba自旋轨道耦合费米气体中的超流配对，并在非厄米平均场框架下自洽求解能隙方程与粒子数方程。\n2. 其核心结果是中等耗散可显著增强配对能隙并呈现非单调依赖，耗散还可作为驱动BCS-BEC渡越的额外调控参数，而准粒子谱出现由一个和三个奇异环标记的两类超流区及奇异谱转变。\n3. 该机制表明自旋选择性耗散可作为非厄米调控旋钮，同时增强两类配对通道并在三重态分量中引入动量依赖的相位扭转，为自旋轨道耦合量子气体中的配对、谱结构和渡越物理提供可实验探索的调控途径。", "summary_source": "deepseek", "authors": [{"name": "Pingcheng Zhu"}, {"name": "Lihong Zhou"}, {"name": "Jianxin Zhong"}], "featured_authors": [{"name": "Pingcheng Zhu"}, {"name": "Lihong Zhou"}, {"name": "Jianxin Zhong"}], "author_count": 3}, {"id": "2609.27940", "category": "cond-mat", "title": "Movable seams in root-of-unity XXZ chains: Relative flux classes and antiunitary spectral pairing", "abstract": "Starting from the cyclic duality tensors introduced by Vernier, Miao, and Yamazaki (VMY), whose endpoint-traced matrix-product operators obey $\\mathbb Z_N$ Tambara--Yamagami fusion and realize topological defect lines of the compactified-boson conformal field theory, we retain the virtual endpoint as an $N$-state dynamical degree of freedom and construct an exactly movable seam in the spin-$\\tfrac12$ XXZ chain at $q=\\mathrm e^{\\mathrm i\\pi M/N}$ with $\\gcd(M,N)=1$. The local movement identity holds for any unitary $q$-Weyl pair; in the finite cyclic realization, all output phases are locally gauge equivalent and share the same four seam eigenvalues. On a ring, the output gauge becomes a directed twist on a single bond, while endpoint conjugacy reduces the $2N$ labels to two relative $\\mathbb Z_2$ flux classes. An explicit antiunitary symmetry protects the class $\\eta\\equiv M-1\\pmod 2$: for even $N$ it pairs distinct charge sectors isospectrally, whereas for odd $N$ it fixes one sector and squares to $-I$ there. Hence every many-body energy eigenspace in the protected class has even multiplicity. The source value $\\eta_{\\rm VMY}=1-M$ satisfies this condition for every coprime root, whereas the ungauged value $\\eta=0$ does so only for odd $M$. Exact finite-size controls show that the opposite class can contain simple levels, so a global flux invisible to local gauge equivalence distinguishes the two classes spectrally.", "url": "https://arxiv.org/abs/2609.27940", "type": "理论", "summary": "1. 该工作将VMY循环对偶张量的虚端点提升为N态动力学自由度，在q=e^{iπM/N}的自旋1/2 XXZ链中构造出可精确移动的接缝。\n2. 其技术核心是局域移动恒等式对任意幺正q-Weyl对成立，环上端点共轭把2N标签约化为两个相对Z2磁通类，并由反幺正对称性给出η≡M-1 mod2的谱配对。\n3. 该结果意味着VMY源值η=1-M对所有互素根均受保护，而未规范化η=0仅对奇数M成立；有限尺寸检验表明相反类可有单重能级，故整体磁通可通过谱简并区分。", "summary_source": "deepseek", "authors": [{"name": "Boliang Yu"}, {"name": "Ruixin Zhou"}, {"name": "Meisen Gao"}], "featured_authors": [{"name": "Boliang Yu"}, {"name": "Ruixin Zhou"}, {"name": "Meisen Gao"}], "author_count": 3}, {"id": "2609.28012", "category": "cond-mat", "title": "Insight into ordering at nematic twist-bend interfaces", "abstract": "Twist-bend nematics formed by achiral particles support heliconical domains of opposite handedness. Using Monte Carlo and molecular dynamics simulations of repulsive bent particles, we study the interface between two such domains. Rather than a gradually untwisting texture, we find a density-modulated splay-bend-twist structure. The density modulation is along the helix axis with a period of approximately half the bulk pitch, while the twist is locally enhanced in magnitude, alternates in sign, and vanishes only on an undulating surface. An explicit director interpolation shows how gradients along the helix axis and across the interface combine to produce an undulating zero-twist surface.", "url": "https://arxiv.org/abs/2609.28012", "type": "理论+数值", "summary": "1. 该工作利用蒙特卡罗与分子动力学模拟，研究了由非手性弯曲粒子形成的扭曲-弯曲向列中相反手性螺旋畴之间的界面结构。\n2. 其关键在于发现界面并非逐渐解旋的织构，而是密度调制的展曲-弯曲-扭转结构；密度沿螺旋轴以约半体相螺距周期振荡，局部扭转增强并变号，仅在起伏表面上为零，且可由指向矢插值解释螺旋轴与跨界面梯度如何耦合出零扭面。\n3. 这为理解非手性扭曲-弯曲体系的畴壁、缺陷与手性界面物理提供了微观图像，并提示可通过界面设计调控螺旋织构及相关实验观测。", "summary_source": "deepseek", "authors": [{"name": "Szymon Drzazga"}, {"name": "Piotr Kubala"}, {"name": "Lech Longa"}], "featured_authors": [{"name": "Szymon Drzazga"}, {"name": "Piotr Kubala"}, {"name": "Lech Longa"}], "author_count": 3}, {"id": "2609.28013", "category": "cond-mat", "title": "SoLiD26: A First Principles Solid-Liquid Interface Dataset for Machine-learned Interatomic Potentials", "abstract": "Machine-learned interatomic potentials (MLIPs) for solid-liquid interfaces in advanced materials applications, e.g., electrochemistry, catalysis and corrosion, require training data that samples both liquid environments, the solid and the interface itself. We present SoLiD26, a curated solid-liquid interface dataset, containing 15.4 million first-principles atomic structures with up to 576 atoms and 15 chemical elements for training and evaluating MLIPs. The structures were compiled from density functional theory (DFT) calculations performed in studies of solid-liquid interfaces, with most configurations originating from ab initio molecular dynamics (AIMD) simulations. Each record contains atomic species, positions, simulation cell, periodic boundary conditions, potential energy and atomic forces. SoLiD26 includes aqueous coinage metal interfaces, electrode-electrolyte systems, and selected bulk reference structures, calculated with VASP using the PBE functional and D3 dispersion corrections. We describe the data ingestion and preparation pipeline used to construct the dataset. The application of SoLiD26 for training and evaluating MLIPs is demonstrated with a suite of MACE models on a simple training, validation and test split. The dataset enables development and benchmarking of MLIPs for structurally and chemically heterogeneous solid-liquid interfaces.", "url": "https://arxiv.org/abs/2609.28013", "type": "理论+数值", "summary": "1. 该工作构建并公开了SoLiD26，一个经整理的第一性原理固液界面数据集，专用于机器学习原子间势（MLIP）的训练与评估。\n2. 其核心是1540万条DFT结构（最大576原子、15种元素），多数取自AIMD，逐条给出原子种类、坐标、晶胞、周期边界、势能与原子力，覆盖水系币金属界面、电极-电解质体系及体相参考，均用VASP的PBE泛函加D3色散校正计算，并附数据摄取与制备流程，还以MACE模型在简单划分上演示训练与评测。\n3. 该数据集为结构与化学非均质固液界面的MLIP开发与基准比较提供了统一基础，可直接支撑电化学、催化与腐蚀等相关研究。", "summary_source": "deepseek", "authors": [{"name": "Jonas Busk"}, {"name": "Emil J. P. Frost"}, {"name": "Yogeshwaran Krishnan"}, {"name": "Henrik H. Kristoffersen"}, {"name": "August E. G. Mikkelsen"}, {"name": "Xueping Qin"}, {"name": "Xin Yang"}, {"name": "Heine A. Hansen"}, {"name": "Arghya Bhowmik"}, {"name": "Tejs Vegge"}], "featured_authors": [{"name": "Jonas Busk"}, {"name": "Emil J. P. Frost"}, {"name": "Yogeshwaran Krishnan"}, {"name": "Heine A. Hansen"}, {"name": "Arghya Bhowmik"}, {"name": "Tejs Vegge"}], "author_count": 10}, {"id": "2609.28042", "category": "cond-mat", "title": "Theory of optical alignment and orientation of excitons in an ensemble of semiconductor nanoplatelets", "abstract": "We present the theory of exciton optical alignment and optical orientation effects in a single semiconductor nanoplatelet (NPL) and in an ensemble of NPLs. The theoretical model is developed to take into account the emission from both bright and dark exciton states in the case of strong electron-hole exchange interaction and an isotropic distribution of in-plane orientations of the NPLs' edges with respect to the linear polarization axis. The conditions for the linear optical response regime on the polarized resonant excitation of the bright exciton are considered, and the steady-state and time-dependent expressions for polarized photoluminescence are presented for the low temperature case in the Faraday magnetic field at normal incidence. The symmetry of the obtained optical response corresponds to the $C_{2}$ point group for the single NPL and the $C_{\\infty}$ point group for the NPL ensemble. The bright-to-dark exciton coupling mechanism allowing one to observe the optical alignment of the dark exciton is considered. The example calculations of the effects are presented for the parameters close to those of CdSe/CdS core/shell NPLs. The effect of the fluctuations in the exciton parameters in the ensemble on the polarization dephasing in the transverse effective magnetic field is demonstrated.", "url": "https://arxiv.org/abs/2609.28042", "type": "理论+数值", "summary": "1. 我们提出了单个半导体纳米片 (NPL) 和 NPL 集合中的激子光学排列和光学取向效应的理论。\n2. 证明了系综中激子参数的波动对横向有效磁场中偏振相移的影响。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "O. O. Druzhinina"}, {"name": "A. V. Rodina"}], "featured_authors": [{"name": "O. O. Druzhinina"}, {"name": "A. V. Rodina"}], "author_count": 2}, {"id": "2609.28113", "category": "cond-mat", "title": "Position-dependent friction in protein folding from a GLE derived with a non-stationary localized projection distribution", "abstract": "The Generalized Langevin Equation (GLE) is an integro-differential equation of motion for a general observable of a many-body system and is rigorously derived using the projection operator formalism. In the standard derivation, a stationary canonical phase space distribution is used for the projection. Here, we derive a novel class of GLEs using a non-stationary projection distribution that constrains the initial ensemble to a hypersurface in phase space on which the observable has a fixed value $A_0$. As a result, all GLE parameters, and in particular the memory friction kernel, depend on $A_0$ and can be extracted from short simulations that do not sample the entire phase space. Applying this non-stationary GLE to protein folding trajectories, we find for villin and an $\\alpha$-helical poly-alanine segment that the total friction is higher in the folded state. These results demonstrate that observable-dependent friction effects are non-negligible and can be accounted for using non-stationary GLEs derived by constrained projection schemes.", "url": "https://arxiv.org/abs/2609.28113", "type": "理论+数值", "summary": "1. 该工作基于非平稳局域投影分布推导广义朗之万方程，并用于蛋白质折叠轨迹分析。\n2. 其关键在于将初始系综限制在可观测量取固定值的超曲面上，使记忆摩擦核依赖该值并可由短时模拟提取。\n3. 对绒毛蛋白与α-螺旋聚丙氨酸段，折叠态总摩擦更高，表明位置依赖摩擦不可忽略，且约束投影广义朗之万方程可刻画该效应。", "summary_source": "deepseek", "authors": [{"name": "Salma Salem"}, {"name": "Lucas Tepper"}, {"name": "Benjamin J. A. Héry"}, {"name": "Henrik Kiefer"}, {"name": "David D. Girardier"}, {"name": "Roland R. Netz"}], "featured_authors": [{"name": "Salma Salem"}, {"name": "Lucas Tepper"}, {"name": "Benjamin J. A. Héry"}, {"name": "Henrik Kiefer"}, {"name": "David D. Girardier"}, {"name": "Roland R. Netz"}], "author_count": 6}, {"id": "2609.28124", "category": "cond-mat", "title": "Active Self-Consistent Field Theory for Ornstein-Uhlenbeck Polymers", "abstract": "We develop an active self-consistent field theory (ASCFT) for studying the steady-state behavior of active Ornstein--Uhlenbeck polymers. Starting from the stochastic equations of motion under the unified colored noise approximation, we derive an effective Hamiltonian that extends the classical polymer field theory to non-equilibrium systems. The resulting free energy functional incorporates both the Flory--Huggins interaction parameter $\\chi N$ and the persistence time $\\tau$ of the active noise, enabling a unified description of thermodynamic and activity-driven effects. To solve the governing equations, we implement a stable implicit-explicit numerical scheme that handles the fourth-order term induced by activity. Our simulations reveal that increasing activity suppresses microphase separation, with the density modulation amplitude decaying as $\\Delta\\phi \\propto \\tau^{-1/2}$ for large $\\tau$. This scaling is independent of copolymer composition and is confirmed by an asymptotic analysis of the free energy functional in the large-$\\tau$ limit. The ASCFT framework provides a new theoretical tool for predicting and designing the non-equilibrium morphologies of active polymer systems, bridging the gap between traditional self-consistent field theory and active matter physics.", "url": "https://arxiv.org/abs/2609.28124", "type": "理论+数值", "summary": "1. 该工作提出活性自洽场理论（ASCFT），用于研究活性 Ornstein-Uhlenbeck 聚合物的稳态行为，并在统一色噪声近似下从随机运动方程导出有效哈密顿量，将经典高分子场论拓展至非平衡体系。\n2. 其核心是自由能泛函同时纳入 Flory-Huggins 相互作用 χN 与活性噪声持续时 τ，并采用稳定的隐式-显式算法处理活性诱导的四阶项；模拟显示活性抑制微相分离，大 τ 时密度调制幅度满足 Δφ ∝ τ^{-1/2}，且该标度不依赖共聚物组成并经渐近分析验证。\n3. 该框架为预测和设计活性聚合物的非平衡形貌提供了新工具，并在传统自洽场理论与活性物质物理之间建立了桥梁。", "summary_source": "deepseek", "authors": [{"name": "Yuliang Huang"}, {"name": "Chun-Lai Ren"}, {"name": "Qiyun Tang"}], "featured_authors": [{"name": "Yuliang Huang"}, {"name": "Chun-Lai Ren"}, {"name": "Qiyun Tang"}], "author_count": 3}, {"id": "2609.28125", "category": "cond-mat", "title": "Helical Anomaly from Concurrent $\\mathbb{Z}$ and $\\mathbb{Z}_2$ Topology in an Acoustic Semimetal", "abstract": "Topological classification constitutes a cornerstone of modern condensed-matter physics. Historically, topological systems have been predominantly characterized by invariants confined to a single topological class, such as topological insulators with a $\\mathbb{Z}_2$ invariant and Weyl semimetals with an integer ($\\mathbb{Z}$) topological charge. While such classification frameworks in principle permit gapless phases in which bulk and boundary degeneracies are protected by distinct invariants, this regime has received limited focused attention, as coordinating the requisite symmetries within a single band structure is highly nontrivial. Here, we realize such concurrent $\\mathbb{Z}$ and $\\mathbb{Z}_2$ topology in a two-dimensional acoustic semimetal, revealing pseudospin-selective topological bulk modes arising from the interplay between these distinct invariants, termed helical anomaly bulk states (HABSs). Our lattice design exploits layer, sublattice, and gauge-staggered degrees of freedom, enabling modular control of effective time-reversal, chiral, and particle-hole symmetries. The resulting system exhibits bulk degeneracies protected by an integer $\\mathbb{Z}$ invariant and Kramers-like boundary degeneracies protected by a $\\mathbb{Z}_2$ invariant, forming twisted boundary arcs. Crucially, finite-size systems manifest helical or anti-helical edge states coexisting with HABSs, a distinctive signature absent in single-invariant topologies. Our results establish HABSs as a characteristic signature of concurrent topology and demonstrate a new regime where bulk and boundary invariants jointly govern topological transport beyond conventional single-class frameworks.", "url": "https://arxiv.org/abs/2609.28125", "type": "理论", "summary": "1. 该工作利用层、子晶格与规范交错自由度设计二维声学晶格，同时实现整数Z与Z2拓扑不变量，并观测到赝自旋选择的螺旋反常体态与扭转边界弧。\n2. 其关键在于模块化调控有效时间反演、手性与粒子-空穴对称性，使体简并由Z不变量保护、类Kramers边界简并由Z2不变量保护，并在有限尺寸下呈现螺旋/反螺旋边缘态与体态共存。\n3. 并发拓扑表明体态与边界不变量可协同支配拓扑输运，为超越单不变量分类框架的声学及其他波平台研究提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Hou-Yin Li"}, {"name": "Hua-Shan Lai"}, {"name": "Jian-Lan Xie"}, {"name": "Xiao-Chen Sun"}, {"name": "Yan-Feng Chen"}, {"name": "Cheng He"}], "featured_authors": [{"name": "Hou-Yin Li"}, {"name": "Hua-Shan Lai"}, {"name": "Jian-Lan Xie"}, {"name": "Xiao-Chen Sun"}, {"name": "Yan-Feng Chen"}, {"name": "Cheng He"}], "author_count": 6}, {"id": "2609.28148", "category": "cond-mat", "title": "Universal splitting of nonequilibrium phase transitions in driven Potts heat engines", "abstract": "We investigate nonequilibrium phase transitions and thermodynamic properties of driven Potts models coupled to two thermal reservoirs at different temperatures. The interplay with the multi-state structure of the Potts model leads to distinct phase-transition scenarios. The proposed driving scheme breaks the symmetry between the Potts states and gives rise to multiple transitions within the ordered phases, where the phases are characterized by different numbers of stable fixed points. This number can vary from $q$ fixed points to $1$ fixed point, corresponding to $q-1$ distinct transitions. The driving scheme strongly affects the thermodynamic operation regimes, allowing the system to operate as a heat engine. We demonstrate that these phenomena persist for both a mean-field (MF) model and a two-dimensional model, confirming the robustness of the results with respect to dimensionality. For the MF case, we also develop a phenomenological description in the strongly ordered regime that yields analytical expressions for the power, heat currents, and efficiency. Our results show how multi-state collective interactions, nonequilibrium driving, and thermal bias jointly generate a rich phase structure and the emergence of a collective heat engine.", "url": "https://arxiv.org/abs/2609.28148", "type": "理论", "summary": "1. 该工作研究了与两个不同温度热库耦合的受驱波茨模型，系统考察其非平衡相变与热力学性质，并在平均场与二维情形下验证结果的维度鲁棒性。\n2. 核心卖点是驱动力打破波茨各态对称性，使有序相内出现由稳定不动点数从 q 降至 1 所标记的 q−1 个级联相变，并显著拓宽热机运行区。\n3. 该结果说明多态集体相互作用、非平衡驱动与热偏置可协同产生丰富相结构和集体热机，并为强有序区的功率、热流与效率提供解析刻画。", "summary_source": "deepseek", "authors": [{"name": "Vitória T. Henkes"}, {"name": "Gustavo A. L. Forão"}, {"name": "Andre C. Barato"}, {"name": "Carlos E. Fiore"}], "featured_authors": [{"name": "Vitória T. Henkes"}, {"name": "Gustavo A. L. Forão"}, {"name": "Andre C. Barato"}, {"name": "Carlos E. Fiore"}], "author_count": 4}, {"id": "2609.28155", "category": "cond-mat", "title": "Compositionally Engineered Non-Equimolar LaCoO$_3$-Based High-Entropy Perovskites with Enhanced Thermoelectric Performance", "abstract": "The decoupling of phonon and electron transport remains a central challenge in the development of high-performance TE materials. Configurational-entropy maximization is widely invoked as a design principle for decoupling phonon and electron transport. This study investigates compositionally engineered LaCoO$_3$-based high-entropy perovskites to determine whether thermoelectric transport can be improved by tuning cation identity and concentration rather than maximizing configurational entropy. La$_{1-x}$Sr$_x$(CoFeMnCrNi)O$_3$ ($x=0.0$--$0.2$) and selected non-equimolar A- and B-site perovskite compositions were prepared by solid-state reaction. The obtained samples are predominantly single-phase, as confirmed by X-ray diffraction and Rietveld refinement, consistent with the calculated size-disorder parameters. Multication disorder introduces substantial mass and strain-field fluctuations that promote phonon scattering. All samples exhibit p-type, thermally activated electrical transport consistent with adiabatic SPH. Sr substitution progressively reduces the hopping barrier and $\\rho$, whereas non-equimolar B-site engineering partially recovers electrical transport while retaining low k. La$_{0.9}$Sr$_{0.1}$Co$_{0.4}$Cr$_{0.3}$Ni$_{0.1}$Fe$_{0.1}$Mn$_{0.1}$O$_3$, featuring a Co-rich and Cr-rich B-site composition, combines Co-associated mixed valence and spin-state degeneracy that sustain a large alpha with Cr-mediated control of carrier concentration and a reduced polaron hopping barrier of 0.19eV. This composition achieves a power factor of 40--43 $\\mu$W/(m K$^2$) and a $zT\\sim0.072$ at 1100K, approximately 2.7 times that of its equimolar analogue. These results demonstrate that targeted cation chemistry and mass contrast, rather than configurational-entropy maximization alone, provide an effective strategy for balancing electronic and phonon transport in multicomponent oxide TE.", "url": "https://arxiv.org/abs/2609.28155", "type": "理论", "summary": "1. 该工作制备了La1-xSrx(CoFeMnCrNi)O3及非等摩尔A/B位高熵钙钛矿，考察阳离子种类与浓度调控热电输运的可行性。\n2. 其卖点在于质量/应变场起伏增强声子散射，非等摩尔Co/Cr富集B位兼顾低热导与电输运，1100 K时zT~0.072、约为等摩尔样2.7倍。\n3. 该结果说明，定向阳离子化学与质量对比而非单纯最大化构型熵，是平衡多组分氧化物电子与声子输运的有效策略。", "summary_source": "deepseek", "authors": [{"name": "Jitendra Kumar"}, {"name": "David Bérardan"}, {"name": "Diana Dragoe"}, {"name": "Nita Dragoe"}, {"name": "Ashutosh Kumar"}], "featured_authors": [{"name": "Jitendra Kumar"}, {"name": "David Bérardan"}, {"name": "Diana Dragoe"}, {"name": "Nita Dragoe"}, {"name": "Ashutosh Kumar"}], "author_count": 5}, {"id": "2609.28163", "category": "cond-mat", "title": "Rank-One Signal Recovery in Sparse Wishart Noise", "abstract": "We study the high-dimensional recovery of a signal vector $\\mathbf{x}$ in the presence of sparse Wishart-like noise. We define an $N \\times N$ matrix $A = J+(\\theta/N)\\mathbf{xx}^{\\top}$, where $\\mathbf{xx}^{\\top}$ is the rank-one deformation of the random noise matrix $J$. We consider a Wishart-like matrix $J={X}^{\\top} X$, where $X$ is a sparse $M \\times N$ random matrix with entries $X_{ij} = c_{ij}W_{ij}$, with $c_{ij}$ regulating the density of non-zero elements, and $W_{ij}$ the bond weights. Using the replica method, we compute analytically the top eigenpair statistics of $A$, and their dependence on the signal strength $\\theta$, the rectangularity ratio $\\alpha=\\sqrt{M/N}$, and the average connectivity of the noise. The spectral observables are expressed in terms of a system of Recursive Distributional Equations, which are efficiently solved via a Population Dynamics algorithm. They allow us to compute the average largest eigenvalue $\\langle\\lambda_1\\rangle_{A}$, the average top eigenvector component density, and the average overlap between the top eigenvector of $A$ and $\\mathbf{x}$. We identify a critical threshold $\\theta_{\\mathrm{crit}}$--depending on the average connectivity of the noise--that marks a BBP-like phase transition: below this value, $\\langle\\lambda_1\\rangle_{A}$ is unaffected by the signal, and the overlap vanishes. Thus, the signal is not recoverable from the top eigenvector of $A$. For $\\theta>\\theta_{\\mathrm{crit}}$, the signal-related outlier eigenvalue becomes $\\langle\\lambda_1\\rangle_{A}$ and the overlap is nonzero, allowing for recovery of the signal. The results are in excellent agreement with numerical diagonalisation. We show that in the dense limit, the recovery threshold and eigen-statistics converge to the results predicted by the classical BBP transition for additive rank-one deformations of dense Wishart matrices.", "url": "https://arxiv.org/abs/2609.28163", "type": "理论+数值", "summary": "1. 该工作用复本方法解析研究稀疏维沙特型噪声中秩一信号的高维恢复，计算加性秩一变形矩阵的顶层本征统计。\n2. 其卖点是由递归分布方程与群体动力学算法给出最大本征值、顶层本征向量密度及与信号的重叠，并发现依赖噪声平均连通度的BBP型临界阈值。\n3. 低于阈值时重叠消失、信号不可从顶本征向量恢复；高于阈值出现离群本征值且重叠非零，并在稠密极限回归经典BBP结果。", "summary_source": "deepseek", "authors": [{"name": "Preben Forer"}, {"name": "Urte Adomaityte"}, {"name": "Pierpaolo Vivo"}], "featured_authors": [{"name": "Preben Forer"}, {"name": "Urte Adomaityte"}, {"name": "Pierpaolo Vivo"}], "author_count": 3}, {"id": "2609.28180", "category": "cond-mat", "title": "Quantum dynamics of spinful impurity in ideal Bose gas", "abstract": "We discuss the quench dynamics of an isolated system composed of a single spinful impurity in the transverse Rabi field and bath of non-interacting three- and two-dimensional bosons. Specifically, we consider the evolution of bosons and a spin-$\\frac{1}{2}$ particle, initially prepared in a Bose-Einstein condensate state and a magnetic ground state, respectively, with the spin-dependent contact boson-impurity interaction switched on. Applying an original mean-field-like approximation, which naturally reflects the statistical effects of the bosonic bath, we calculate time-dependent components of the average impurity spin and the overlap of the wave function between initial and arbitrary time moments. A key prediction is a substantial speed-up in the decoherence (thermalization) dynamics of the spin degree of freedom compared to results obtained with the Chevy-like ansatz.", "url": "https://arxiv.org/abs/2609.28180", "type": "理论+数值", "summary": "1. 该工作研究理想玻色气体中单个自旋杂质在横向拉比场下的量子淬火动力学，初始为三维和二维无相互作用玻色浴的凝聚态与处于磁基态的自旋-1/2杂质，随后突然开启自旋相关接触相互作用。\n2. 其卖点是提出一种自然包含玻色浴统计效应的类平均场近似，计算杂质平均自旋分量和初态与任意时刻波函数重叠的时间演化，预言自旋退相干与热化较Chevy型拟设显著加快。\n3. 这表明玻色统计和维度会实质性改变自旋杂质的退相干时标，为冷原子杂质淬火动力学及退相干、热化研究提供可检验的近似基准与实验启发。", "summary_source": "deepseek", "authors": [{"name": "O. Hryhorchak"}, {"name": "V. Pastukhov"}], "featured_authors": [{"name": "O. Hryhorchak"}, {"name": "V. Pastukhov"}], "author_count": 2}, {"id": "2609.28213", "category": "cond-mat", "title": "Local time-reversal-invariant topological markers in two dimensions", "abstract": "Local topological markers provide a real-space characterization of topological phases and are suited to noncrystalline models. We derive a local topological marker, the Chern-Simons descendant marker, for characterizing the topology of two-dimensional time-reversal-invariant near-Gaussian states from the one-particle density matrix \\(\\rho\\). We construct an auxiliary three-dimensional state characterized by the local Chern-Simons marker, and use dimensional reduction to obtain the Chern-Simons descendant marker for the original two-dimensional state. This derivation introduces a local Hermitian involution \\(S\\) that is odd under time reversal. When \\([S,\\rho]=0\\), the local Chern-Simons descendant marker reduces to half the difference of the local Chern markers in the \\(S=\\pm1\\) sectors. Constructing an \\(S\\) that commutes exactly with \\(\\rho\\) generally requires fine-tuning, but this is not needed---the local Chern-Simon marker remains well defined whenever \\(\\Gamma=\\{\\rho,S\\}-S\\) has a spectral gap around zero, even when \\([S,\\rho]\\neq0\\). This leaves the practical problem of identifying a suitable \\(S\\) for a given state, which, importantly, is straightforward even when spin is not a candidate. We show this by considering both strong Rashba and Dresselhaus spin-orbit coupling, for which knowledge of the physical origin of the state reduces the general problem of choosing $S$ to a one-parameter family \\(S(\\theta)\\). We evaluate the optimal angle $\\theta$ maximizing the spectral gap of $\\Gamma$ analytically assuming translation invariance, and find that the gap of $\\Gamma$ remains open for a broad range of angles around the optimum. The same value of \\(\\theta\\) remains valid in disordered systems, providing an easy way to obtain choice of \\(S\\) for evaluating the local Chern-Simons descendant marker of the state.", "url": "https://arxiv.org/abs/2609.28213", "type": "理论+数值", "summary": "1. 该工作由单粒子密度矩阵出发，通过辅助三维局域陈-西蒙斯标记与维数约化，推导二维时间反演不变近高斯态的局域陈-西蒙斯后裔标记。\n2. 其卖点是引入时间反演下为奇的局域厄米对合S；只要Γ={ρ,S}-S在零附近有谱隙，即使[S,ρ]≠0，标记仍良定义。\n3. 对无自旋候选者的强Rashba/Dresselhaus自旋轨道耦合，可由态起源约化为单参数S(θ)并解析求最优，且该θ在无序下仍适用。", "summary_source": "deepseek", "authors": [{"name": "Thomas Klein Kvorning"}, {"name": "Miguel F. Martínez"}, {"name": "Julia D. Hannukainen"}], "featured_authors": [{"name": "Thomas Klein Kvorning"}, {"name": "Miguel F. Martínez"}, {"name": "Julia D. Hannukainen"}], "author_count": 3}, {"id": "2609.28214", "category": "cond-mat", "title": "Disentangling spin polarization from driven circular ionic motion in EuTiO$_3$", "abstract": "Coherently driven circular ionic motion has been reported to produce large helicity-dependent optical responses attributed to transient magnetization. However, the microscopic nature and magnitude of this phenomenon, sometimes referred to as dynamical multiferroicity, remain strongly debated. Here, we directly study the connection between ionic circul
