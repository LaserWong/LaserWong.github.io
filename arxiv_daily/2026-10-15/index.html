x-vertex model at odd roots of unity, by a suitable choice of the defining wiring diagram and parameters. This provides a concrete realization of the criterion through the quantum Frobenius property of the quantized six-vertex model, recently established from its three-dimensional integrable structure.", "url": "https://arxiv.org/abs/2610.20166", "type": "理论", "summary": "1. 该文证明，通过选择适当的布线图与参数，任意有限无差异图都可由奇单位根处的量子化六顶点模型实现为阻挫图。\n2. 核心在于利用量子化六顶点模型的量子弗罗贝尼乌斯性质，具体实现自由副费米子谱判据，该性质源于其三维可积结构。\n3. 这为用可积模型构造满足图判据的哈密顿量并研究其自由副费米子谱提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Atsuo Kuniba"}, {"name": "Souta Oikawa"}], "featured_authors": [{"name": "Atsuo Kuniba"}, {"name": "Souta Oikawa"}], "author_count": 2}, {"id": "2610.20398", "category": "math-ph", "title": "Relative entropy in quantum field theory: the case of squeezed fermions", "abstract": "We review the role of relative entropy in quantum field theories, where the local von Neumann algebras are generically of type III. Consequently, only few exact results are known, and even bounds are difficult to obtain. As a new result, we prove that the relative entropy between a locally squeezed state and the Minkowski vacuum is finite for free fermions.", "url": "https://arxiv.org/abs/2610.20398", "type": "理论", "summary": "1. 该文综述了量子场论中相对熵的作用，并针对局域冯诺依曼代数为第三型导致精确结果稀缺的困境，在自由费米子情形下证明局域压缩态与闵可夫斯基真空之间的相对熵有限。\n2. 其核心贡献在于把相对熵从通常难以计算或仅能估计的第三型代数框架，推进到可对局域压缩自由费米子给出严格有限性判定，从而补充了少有的精确结果。\n3. 这一结果暗示局域压缩态与闵可夫斯基真空在自由费米子中保持有限可区分度，并为后续在更一般量子场论中界定相对熵、区分局域激发与真空提供可借鉴的路径。", "summary_source": "deepseek", "authors": [{"name": "Markus B. Fröb"}], "featured_authors": [{"name": "Markus B. Fröb"}], "author_count": 1}, {"id": "2610.20464", "category": "math-ph", "title": "Topological recursion for spin enumeration of hypermaps", "abstract": "We establish topological recursion for the spin enumeration of hypermaps, or, in the dual language, spin dessins d'enfants. This problem has remarkable features distinguishing it from other applications of topological recursion to enumerative combinatorics. First, the spectral curve is elliptic rather than rational, as in most cases studied before. Second, it contains degenerate ramification points, and one has to apply a version of degenerate topological recursion. Finally, the meromorphic correlator differentials have \"moving\" poles on the antidiagonals between pairs of distinct arguments, and one has to adjust the loop equations to this kind of degeneracy as well. The computations involve concepts of different kinds, such as BKP integrability, Gaussian integrals, the x-y swap, and symplectic duality.", "url": "https://arxiv.org/abs/2610.20464", "type": "理论", "summary": "1. 该工作为超映射的自旋枚举建立了拓扑递归，并在对偶语言中处理自旋儿童画。\n2. 其关键新意在于谱曲线为椭圆型、含退化分支点，且关联微分在反对角线上有移动极点，需推广退化拓扑递归与圈方程。\n3. 该框架融合可积性、高斯积分、变量交换与辛对偶，为更一般退化拓扑递归及自旋枚举提供方法启示。", "summary_source": "deepseek", "authors": [{"name": "Alexander Alexandrov"}, {"name": "Boris Bychkov"}, {"name": "Petr Dunin-Barkowski"}, {"name": "Maxim Kazarian"}, {"name": "Sergey Shadrin"}], "featured_authors": [{"name": "Alexander Alexandrov"}, {"name": "Boris Bychkov"}, {"name": "Petr Dunin-Barkowski"}, {"name": "Maxim Kazarian"}, {"name": "Sergey Shadrin"}], "author_count": 5}, {"id": "2610.18953", "category": "quant-ph", "title": "Invertible subalgebras for chiral semion topological order", "abstract": "Chiral topological order is incompatible with strictly two-dimensional local commuting-projector Hamiltonians on finite-dimensional tensor-product Hilbert spaces. Invertible subalgebras (ISAs) provide an alternative framework. We construct an ISA supporting chiral semions, together with its anti-semion commutant, on a square lattice with one qubit per edge. We give explicit non-Pauli generators for both algebras and prove that together they generate all local operators on the Hilbert space. Starting from the $\\mathbb{Z}_4$ toric code, we condense the boson $e^2m^2$ and identify the semion and anti-semion algebras. We then decompose each $\\mathbb{Z}_4$ qudit into two qubits and use a finite-depth circuit to disentangle one qubit per edge fixed by the condensation constraints. Pumping the semion ISA along the $z$ direction defines an explicit three-dimensional non-Clifford quantum cellular automaton (QCA). We show that pumping eight times is equivalent to a translation followed by a finite-depth quantum circuit with ancillary qubits. We also give an explicit finite-depth circuit relating this construction to the semion QCA previously obtained from topological quantum field theory. A similar condensation construction yields a $U(1)_4$ ISA on a square lattice. Together with the semion and earlier odd-prime ISAs, finite stacking realizes every pointed Witt class of bosonic Abelian anyon theories. Finally, we extend both constructions to all spatial dimensions $d=4k{-}2$, with one qubit or $\\mathbb{Z}_4$ qudit on each $(2k{-}1)$-cell for the semion or $U(1)_4$ ISA, respectively.", "url": "https://arxiv.org/abs/2610.18953", "type": "理论", "summary": "1. 该工作围绕《Invertible subalgebras for chiral semion topological order》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Yu-An Chen"}, {"name": "Meng Sun"}, {"name": "Nathanan Tantivasadakarn"}, {"name": "Zongyuan Wang"}, {"name": "Bowen Yang"}], "featured_authors": [{"name": "Yu-An Chen"}, {"name": "Meng Sun"}, {"name": "Nathanan Tantivasadakarn"}, {"name": "Zongyuan Wang"}, {"name": "Bowen Yang"}], "author_count": 5}, {"id": "2610.18954", "category": "quant-ph", "title": "Optimal Disorder Strength for Approximate Unitary $k$-Designs in Spin Chains", "abstract": "Quantum simulators with disordered spin Hamiltonians offer a natural route to Haar-like unitary ensembles, but face a competition. Disorder enhances randomness, yet strong disorder suppresses dynamics and localizes the system in the computational basis. This suggests an optimal intermediate disorder strength for approximating a unitary $k$-design, which has so far been identified mainly empirically. Here, we develop a perturbative theory for the moment gap $\\Delta^{(k)}$, the deviation of the $k$-th moment operator from its Haar value, for the full spectrum of the interacting XXZ chain in a fixed-magnetization sector. We find the non-monotonic asymptotic scalings $\\ln \\Delta^{(k)}\\sim -\\sigma^2$ at weak disorder and $\\ln \\Delta^{(k)}\\sim -1/\\sigma$ at strong disorder, whose crossover sets an optimal disorder strength $\\sigma_c\\sim J_{xy}$, where $J_{xy}$ is the energy scale of the non-random interaction. We further show that a multi-quench protocol further suppresses the gap exponentially in the number of quenches. Numerical simulations confirm both scalings and this exponential suppression, and we demonstrate the usefulness of the protocol for classical shadow tomography. This work suggests that strong disorder may block both thermalization and the formation of unitary designs through a common localization mechanism.", "url": "https://arxiv.org/abs/2610.18954", "type": "理论+数值", "summary": "1. 该工作针对固定磁化扇区中相互作用 XXZ 自旋链，建立微扰理论计算矩间隙 Δ^(k)，即第 k 阶矩算符偏离 Haar 值的程度，并据此确定近似酉 k-设计的最优无序强度。\n2. 其卖点在于揭示非单调渐近标度：弱无序时 ln Δ^(k)∼−σ²，强无序时 ln Δ^(k)∼−1/σ，交叠给出 σ_c∼J_xy，并证明多淬火协议可使矩间隙随淬火次数指数压低，数值模拟验证标度及指数抑制，且展示其用于经典影子层析。\n3. 这暗示强无序可能通过共同局域化机制同时阻碍热化与酉设计形成，为无序自旋模拟器中 Haar 随机性资源的定量刻画、最优参数选择及后续协议设计提供启发。", "summary_source": "deepseek", "authors": [{"name": "Tian-Gang Zhou"}, {"name": "Yi-Neng Zhou"}, {"name": "Thierry Giamarchi"}, {"name": "Julian Sonner"}], "featured_authors": [{"name": "Tian-Gang Zhou"}, {"name": "Yi-Neng Zhou"}, {"name": "Thierry Giamarchi"}, {"name": "Julian Sonner"}], "author_count": 4}, {"id": "2610.18955", "category": "quant-ph", "title": "Stabilizer Rényi Entropy Without a Phase Reference", "abstract": "Stabilizer Rényi entropy quantifies magic relative to a complete Pauli frame. In settings such as helicity states of massless particles, unsynchronized qubit registers, energy eigenbases, and systems under superselection rules, the computational basis may be fixed while the transverse Pauli axes remain unspecified. The stabilizer Rényi entropy then depends on the choice of those axes. We define a phase-averaged stabilizer Rényi entropy by averaging the Pauli moments before taking the logarithm. It is exactly invariant under independent local rephasings. For pure states, it vanishes precisely when the state is a stabilizer state in every phase convention. For a broad class of sparse supports, it reduces to a closed-form function of the basis-state probabilities alone. Within this class, the ceiling for $n$ channels is $\\ln[n^{3}/(6n-5)]$ for $n\\geq3$ and $\\ln\\frac{7}{5}$ for two channels. We apply the invariant to tree-level gluon scattering at four and five points, where the helicity-basis phases are unspecified. It saturates the two- and three-channel ceilings: $\\ln\\frac{7}{5}$ at four points and $\\ln\\frac{27}{13}$ in $3\\to2$ scattering. In same-helicity $2\\to3$ scattering, it lies between a floor of $\\ln\\frac{8}{7}$ and a ceiling of $\\ln\\frac{184}{125}$, reached in the resolved soft limit and particular collinear limits, respectively. In every configuration studied, the invariant is independent of the fixed external colors.", "url": "https://arxiv.org/abs/2610.18955", "type": "理论+数值", "summary": "1. 该工作定义了相位平均的稳定子Rényi熵：先平均Pauli矩再取对数，以刻画计算基固定但横向Pauli轴未指定时的非稳定子性。\n2. 其卖点是在独立局域重相位下严格不变，纯态仅当任意相位约定下均为稳定子态时为零，且对稀疏支撑可化为仅依赖基态概率的闭式与通道数上限。\n3. 对树级胶子散射的应用表明，该不变量适用于相位未定的螺旋度基，且其上下限由软与共线极限达到，且与固定外色无关。", "summary_source": "deepseek", "authors": [{"name": "Jinwei Chu"}, {"name": "Savan Kharel"}], "featured_authors": [{"name": "Jinwei Chu"}, {"name": "Savan Kharel"}], "author_count": 2}, {"id": "2610.18983", "category": "quant-ph", "title": "Instability of Markov chains under infinitesimal coherent dissipation", "abstract": "Under local Lindbladian evolution, the growth of conditional mutual information and its associated Markov length scale is not limited by Lieb-Robinson bounds, yet it has been unclear how quickly the Markov length can increase. We show that an arbitrarily short, strictly local Lindbladian can generate infinite Markov length from a product state. We also construct strictly local Lindbladians that converge rapidly to steady states with algebraically decaying conditional mutual information. Despite their long-range conditional correlations, the states we construct are local reversibly connected to a product state by sublinear depth circuits. Thus infinite Markov length does not imply slow relaxation nor obstruct phase stability when suitably defined.", "url": "https://arxiv.org/abs/2610.18983", "type": "理论", "summary": "1. 该工作研究无穷小相干耗散下马尔可夫链的不稳定性，构造严格局域、任意短时的林德布拉德生成元，证明其可从乘积态产生无限马尔可夫长度。\n2. 关键卖点在于：无限马尔可夫长度不受李布-罗宾逊界限制，且存在严格局域林德布拉德生成元可快速收敛到条件互信息代数衰减的稳态；这些长程条件关联态仍能通过亚线性深度电路局域可逆地连接回乘积态。\n3. 这表明按适当定义，无限马尔可夫长度既不蕴含慢弛豫，也不妨碍相稳定性，为开放量子系统的马尔可夫性、弛豫与相变稳定性关系提供了反例与启发。", "summary_source": "deepseek", "authors": [{"name": "Amir-Reza Negari"}, {"name": "Yijian Zou"}, {"name": "Timothy H. Hsieh"}], "featured_authors": [{"name": "Amir-Reza Negari"}, {"name": "Yijian Zou"}, {"name": "Timothy H. Hsieh"}], "author_count": 3}, {"id": "2610.19054", "category": "quant-ph", "title": "The Generalized BEADS Representation: An Informationally Complete Visualization of Mixed Quantum States", "abstract": "A deep understanding of quantum information theory is essential for quantum science and technology. However, quantum mechanics and particularly quantum information theory suffer from a lack of intuitive images. Visualization tools offer novel perspectives on many problems in quantum physics by revealing important properties of quantum states and processes that are otherwise obscured by abstract mathematical formalisms. Here, we extend the previously established BEADS representation of pure states to the so-called generalized BEADS representation of mixed quantum states. We introduce spherical functions, so-called beads to visualize correlation structures of mixed quantum states. A recursive optimization scheme is used to obtain minimum-entanglement pure state decompositions of all subsystems of a given N-qubit state. We show how correlation function components can be decomposed into individual contributions that directly correspond to different types of correlations of mixed states. This allows us to visually characterize the total correlation, genuine n-partite entanglement, nonclassical quantum-discord-type correlations as well as classical correlations. After outlining the mathematical details relevant for constructing the representation, we examine the generalized BEADS representations for various classes of mixed states including product, classically correlated, separable but nonclassically correlated, as well as entangled states. As exemplary applications of the generalized BEADS representation, we showcase entanglement distillation and the effects of noise channels.", "url": "https://arxiv.org/abs/2610.19054", "type": "理论+数值", "summary": "1. 该工作将纯态BEADS表示推广到N量子比特混态，提出广义BEADS表示，实现混态关联结构的信息完备可视化。\n2. 其核心卖点是用递归优化获得各子系统最小纠缠纯态分解，并把关联函数分量对应到总关联、真多体纠缠、量子失谐型非经典关联与经典关联。\n3. 该表示可直观展示纠缠蒸馏和噪声信道效应，并为混态量子关联分析与信息提取提供通用可视化框架。", "summary_source": "deepseek", "authors": [{"name": "Celina Bräutigam"}, {"name": "Steffen J. Glaser"}, {"name": "Dennis Huber"}], "featured_authors": [{"name": "Celina Bräutigam"}, {"name": "Steffen J. Glaser"}, {"name": "Dennis Huber"}], "author_count": 3}, {"id": "2610.19073", "category": "quant-ph", "title": "A modular quantum computer based on Cornucopia codes", "abstract": "Ultra-high-rate quantum error correction codes can store many logical qubits in a single code block with few physical qubits. A fault-tolerant quantum computer, however, also requires a universal set of logical operations on individually addressable logical qubits, and the ancilla overhead of these operations may erode the advantage of the high encoding rate. Here, we propose the Cornucopia architecture, in which a universal set of logical operations is implemented at low overhead for the Cornucopia codes. In particular, we focus on the [[2844,1426,18]] Cornucopia code as an example and introduce a modular quantum computer built from such code blocks connected by bridges. Each block stores 1,426 logical qubits and serves as a universal logical processor. Exploiting the code's translation symmetry, we construct a family of reusable gadgets that individually address 1,422 logical qubits within each block. These gadgets support three universal logical instruction sets: basic, high-throughput and fixed-extractor. Excluding magic-state factories, a module with sufficient workspace to execute any instruction in the basic set requires an average of 4.1 physical qubits per logical qubit, compared with 3.0 for memory alone. The architecture thus preserves the resource advantage of ultra-high-rate quantum memory while enabling universal logical computation, providing a route towards low-overhead fault-tolerant quantum computers.", "url": "https://arxiv.org/abs/2610.19073", "type": "理论", "summary": "1. 提出基于Cornucopia码的模块化量子计算机架构，以[[2844,1426,18]]码块为例，每块存储1426个逻辑比特并作为通用逻辑处理器。\n2. 其卖点在于利用码的平移对称性构造可复用gadgets，单独寻址1422个逻辑比特，并支持三套通用逻辑指令集，基本集平均仅需4.1物理比特/逻辑比特。\n3. 该架构在保持超高码率量子存储优势的同时实现通用逻辑计算，为低开销容错量子计算提供了一条可行路线。", "summary_source": "deepseek", "authors": [{"name": "Zhide Lu"}, {"name": "Weikang Li"}, {"name": "Yinghao Ma"}, {"name": "Hanyu Yan"}, {"name": "Bingrun Wang"}, {"name": "Yixuan Ma"}, {"name": "Zheng-Zhi Sun"}, {"name": "Dong-Ling Deng"}], "featured_authors": [{"name": "Zhide Lu"}, {"name": "Weikang Li"}, {"name": "Yinghao Ma"}, {"name": "Yixuan Ma"}, {"name": "Zheng-Zhi Sun"}, {"name": "Dong-Ling Deng"}], "author_count": 8}, {"id": "2610.19299", "category": "quant-ph", "title": "Gap-Priced $|T\\rangle$-States: Dynamic $|T\\rangle$ Post-Selection and Budget-Aware Factory Provisioning", "abstract": "Magic $|T\\rangle$-state preparation dominates the cost of fault-tolerant quantum computation on surface codes, yet cultivation and distillation are typically provisioned statically, leaving much of the program's error budget unused. We present Gap-Priced $|T\\rangle$ States (GP$|T\\rangle$-S), a lattice surgery scheduler and factory allocator that co-optimizes both methods under a total $T$-error budget. GP$|T\\rangle$-S uses the complementary gap of each cultivated state as a fidelity estimate and dynamically adjusts the cultivation gap cutoff, converting budget slack into speed by giving the scheduler control over the cultivation post-selection. GP$|T\\rangle$-S also characterizes distillation factories by size, $|T\\rangle$-state production rate, and budget slack, and introduces cultivating factories that embed cultivation within routing channels, achieving fidelities otherwise requiring two-level distillation at a single-level footprint. GP$|T\\rangle$-S organizes these characterizations into a factory catalog, and performs distillation factory allocation over this catalog in tandem with the gap cutoff using dynamic-programming to achieve one of i) minimum spacetime volume, ii) minimum execution time, or iii) minimum space overhead, all within a user-provided $T$-error budget. Across sixteen benchmarks under high and low $T$-error budgets of $10^{-3}$ and $10^{-5}$ respectively, GP$|T\\rangle$-S consistently outperforms cultivation-only and single-factory baselines without exceeding the budget, achieving a 5.5$\\times$ geometric mean speedup in logical cycle count and a 3.4$\\times$ geometric mean reduction in space-time volume.", "url": "https://arxiv.org/abs/2610.19299", "type": "理论+数值", "summary": "1. 该工作提出 GP|T⟩-S，一种在总 T 误差预算下联合优化 |T⟩ 态培养与蒸馏的晶格手术调度器与工厂分配器。\n2. 其技术卖点是用培养态互补间隙估计保真度并动态调整截断，将预算余量转为速度，同时引入嵌入路由通道的单层培养工厂，并借动态规划在工厂目录上联合分配以实现最小时空体积、最短执行时间或最小空间开销。\n3. 在十六个基准上以 10^-3 和 10^-5 预算分别验证，获得 5.5 倍几何平均逻辑周期加速与 3.4 倍时空体积缩减，表明预算感知的魔法态供给可把误差余量转化为资源或速度收益。", "summary_source": "deepseek", "authors": [{"name": "Maxwell Poster"}, {"name": "Sayam Sethi"}, {"name": "Yuhao Liu"}, {"name": "Jonathan Baker"}, {"name": "Costin Iancu"}], "featured_authors": [{"name": "Maxwell Poster"}, {"name": "Sayam Sethi"}, {"name": "Yuhao Liu"}, {"name": "Jonathan Baker"}, {"name": "Costin Iancu"}], "author_count": 5}, {"id": "2610.19304", "category": "quant-ph", "title": "Leakage benchmarking with decohering subgroups in the presence of preparation and measurement errors", "abstract": "A common problem with physical qubits is that the state can leak outside the computational subspace. To characterize the problem, it is desirable to measure both the leakage probability and the fidelity of gates inside the computational subspace. Randomized benchmarking is a readily accessible method for estimating average gate fidelities and can be modified to account for leakage. However, in the presence of state preparation and measurement errors (SPAM) there are parameter degeneracies, and fidelities and leakage become underdetermined. We study the example of qudits with any number of leakage levels under the assumption of gate-independent noise. We show that randomized benchmarking sequences with leakage level decoherence can be analyzed as a Markov process with noisy classical preparations and measurements. This result generalizes to randomized benchmarking with random gates from an arbitrary group that contains a phase-decohering subgroup. We characterize the parameter degeneracy in inferring the Markov process, preparations and measurements. Based on this characterization we develop a measurement and inference method taking advantage of known conservative bounds on SPAM to constrain fidelity, leakage and other parameters of the Markov process, state preparations and measurements. As part of our study, we experimentally implemented the measurement method for a qubit defined on the one-excitation subspace of two transmons, for which there are two leakage levels. We determined confidence intervals accounting for parameter degeneracy for a number of performance parameters of the system. For leakage and fidelity, we compare these intervals to those obtained for several conventional methods for leakage benchmarking.", "url": "https://arxiv.org/abs/2610.19304", "type": "实验", "summary": "1. 该工作构建了在态制备与测量误差下考虑泄漏的基准测试框架，将含泄漏能级退相干的随机基准序列建模为带噪经典制备与测量的马尔可夫过程。\n2. 其技术卖点是将此类随机基准推广到含相位退相干子群的任意群，刻画参数简并，并用已知保守误差界约束保真度与泄漏等参数。\n3. 该框架为态制备与测量误差下泄漏与保真度的可靠推断提供通用途径，并在双传输子单激发子空间量子比特上实验验证，其置信区间可与传统方法比较。", "summary_source": "deepseek", "authors": [{"name": "Shawn Geller"}, {"name": "Tongyu Zhao"}, {"name": "Alex Kwiatkowski"}, {"name": "Scott Glancy"}, {"name": "Raymond W. Simmonds"}, {"name": "Emanuel Knill"}], "featured_authors": [{"name": "Shawn Geller"}, {"name": "Tongyu Zhao"}, {"name": "Alex Kwiatkowski"}, {"name": "Scott Glancy"}, {"name": "Raymond W. Simmonds"}, {"name": "Emanuel Knill"}], "author_count": 6}, {"id": "2610.19459", "category": "quant-ph", "title": "Quantum LDPC Codes from Polynomial Minors", "abstract": "We construct quantum codes from codewords of a cyclic code and the minors of a polynomial matrix. The construction uses a two-row, three-column matrix whose minors yield a second matrix satisfying the CSS orthogonality condition. We derive the code dimension from the greatest common divisors of the entries and minors, with a simplified formula for odd lifting factors. A residue characterization identifies additional common factors of the minors and leads to a method for controlling the dimension through polynomial selection. We also give a condition for changing the minor generator without changing the code. Explicit polynomial constructions yield 13 quantum codes with verified minimum distances, including a $[[255,80,12]]$ code of rate $80/255$.", "url": "https://arxiv.org/abs/2610.19459", "type": "理论", "summary": "1. 该工作由循环码码字与多项式矩阵子式构造量子码，利用两行三列矩阵的子式生成满足CSS正交条件的第二矩阵。\n2. 其核心是由元素及子式的最大公约数导出码维数，对奇提升因子给出简化公式，并用剩余类刻画识别额外公因子，从而通过多项式选择调控维数，且给出子式生成元变更而码不变的判据。\n3. 显式多项式构造获得13个具有已验证最小距离的量子码，含[[255,80,12]]（码率80/255），表明该框架可为高码率量子LDPC码设计及维数调控提供路径。", "summary_source": "deepseek", "authors": [{"name": "Vahid Nourozi"}, {"name": "Roxana Smarandache"}, {"name": "David G. M. Mitchell"}], "featured_authors": [{"name": "Vahid Nourozi"}, {"name": "Roxana Smarandache"}, {"name": "David G. M. Mitchell"}], "author_count": 3}, {"id": "2610.19675", "category": "quant-ph", "title": "Transport Information Beyond Strong Eigenstate Thermalization", "abstract": "Strong eigenstate thermalization (ETH) in operationally mean-ergodic, non-chaotic systems provides an opportunity to investigate whether Floquet eigenstates retain information about classical transport beyond their leading thermodynamic behavior. We address this question using the double kicked top (DKT), which exhibits nonmixing transport and dynamics consistent with weak mixing transport under variation of its control parameters. We show that the coefficient $m$ of the leading finite-size correction to the normalized eigenstate entanglement entropy (EE) $s$ tracks the restructuring between these transport regimes even when the thermodynamic-limit entropy $c$ becomes nearly insensitive to them. This coefficient $m$ is positive for nonmixing transport and negative when dynamics consistent with weak mixing transport dominate. The coefficient's sign reversal in the coexistence regime remains stable as the semiclassical resolution increases. Our results demonstrate that finite-size eigenstate structure can encode signatures of classical transport that are invisible in the thermodynamic-limit entropy, providing an eigenstate-based diagnostic of dynamical organization beyond the leading thermodynamic behavior associated with strong ETH.", "url": "https://arxiv.org/abs/2610.19675", "type": "理论", "summary": "1. 该工作以双踢陀螺为平台，在操作意义上平均遍历且非混沌、并满足强本征态热化的弗洛凯系统中，检验本征态能否在主导热力学行为之外保留经典输运信息。\n2. 其核心发现是归一化本征态纠缠熵的有限尺寸修正系数m：非混合输运时m为正，弱混合输运主导时为负，且共存区中该符号反转在半经典分辨率提高时保持稳定，而热力学极限熵c对此几乎不敏感。\n3. 这表明有限尺寸本征态结构可编码热力学极限熵中不可见的经典输运特征，为超越强本征态热化所主导的热化图像提供基于本征态的动力学组织诊断。", "summary_source": "deepseek", "authors": [{"name": "Avadhut V. Purohit"}, {"name": "Harshit Sharma"}, {"name": "Udaysinh T. Bhosale"}], "featured_authors": [{"name": "Avadhut V. Purohit"}, {"name": "Harshit Sharma"}, {"name": "Udaysinh T. Bhosale"}], "author_count": 3}, {"id": "2610.19676", "category": "quant-ph", "title": "Dynamical Decoupling of Nonclassical States in a Biased-Noise Spin Qudit", "abstract": "Encoding quantum information in $d$-dimensional systems (qudits) with $d>2$ offers appealing new directions for resource-efficient quantum computing. However, protecting the coherence of nonclassical qudit resource states remains an open challenge. Dynamical decoupling (DD) is a well-established technique for extending coherence, but its application to qudits is hindered by the quadratic scaling of the decoupling sequence overhead with the dimension $d$. As a result, demonstrations of qudit DD have so far been limited to low-dimensional qudits. Here, we show that noise-biased qudits enable a nontrivial reduction of this overhead, for example, from quadratic to linear. We perform qudit DD on a model $d=8$ qudit, the nuclear spin of an antimony donor in silicon. We benchmark DD performance on highly nonclassical states such as uniform superpositions, cat states, and Haar random states and measure coherence improvements up to a factor $5$ to $10$. For a spin-cat error correction code, continuous DD extends the coherence time of the logical superposition $|+\\rangle_L$ to $225$~ms, compared to $19$~ms under free evolution and $85$~ms with a Hahn echo. This improvement shows that DD sequences tailored to a system's noise bias can significantly enhance the lifetime of encoded logical qubits.", "url": "https://arxiv.org/abs/2610.19676", "type": "理论", "summary": "1. 该工作在高维自旋 qudit 上实现动力学去耦，利用噪声偏置将序列开销随维度 d 的二次增长降至线性，并在硅中锑施主核自旋 d=8 体系上验证。\n2. 其在均匀叠加、猫态与 Haar 随机态等非经典态上基准测试 DD，获得 5 至 10 倍相干性提升；对自旋猫纠错码，连续 DD 将逻辑 |+⟩_L 相干时间由自由演化的 19 ms 和 Hahn 回波的 85 ms 延长至 225 ms。\n3. 这表明按体系噪声偏置裁剪 DD 序列可显著延长编码逻辑量子比特寿命，为资源高效的高维量子计算与容错存储提供可行路径。", "summary_source": "deepseek", "authors": [{"name": "Arjen Vaartjes"}, {"name": "Namit Anand"}, {"name": "Rocky Y. Su"}, {"name": "Akram Youssry"}, {"name": "Ritik Sareen"}, {"name": "Jeffrey Marshall"}, {"name": "Mark R. van Blankenstein"}, {"name": "Danielle Holmes"}, {"name": "Benjamin Wilhelm"}, {"name": "Bibek Pokharel"}, {"name": "Xi Yu"}, {"name": "Laura A. O'Neill"}, {"name": "Martin Nurizzo"}, {"name": "Alexander M. Jakob"}, {"name": "Fay E. Hudson"}, {"name": "Kohei M. Itoh"}, {"name": "Andrew S. Dzurak"}, {"name": "David N. Jamieson"}, {"name": "Andrea Morello"}], "featured_authors": [{"name": "Arjen Vaartjes"}, {"name": "Namit Anand"}, {"name": "Rocky Y. Su"}, {"name": "Andrew S. Dzurak"}, {"name": "David N. Jamieson"}, {"name": "Andrea Morello"}], "author_count": 19}, {"id": "2610.19873", "category": "quant-ph", "title": "Acoustic scattering from quantum dynamics", "abstract": "Scattering of sound waves propagating in a compressible fluid is linked to the quantum dynamics generated by a class of non-Hermitian Hamiltonian operators. The scattering amplitude is expressed in terms of the corresponding evolution operator. This is used to provide a new proof of the reciprocity theorem in acoustic scattering, conduct analytic low-frequency acoustic scattering calculations, and study the scattering of sound waves by a finite planar array of delta-function point scatters embedded in an infinite acoustic slab. A detailed discussion of acoustic scattering properties of a homogeneous acoustic slab including a pair of delta-function point scatters on one of its faces is provided.", "url": "https://arxiv.org/abs/2610.19873", "type": "理论+数值", "summary": "1. 该工作把可压缩流体中的声波散射与一类非厄米哈密顿量生成的量子动力学相联系，并将散射振幅表示为对应演化算子。\n2. 其技术卖点在于借助该演化算子重新证明声学互易定理，完成低频声散射解析计算，并解析研究无限声学平板中有限平面δ势点散射体阵列及单面含双δ散射体的均匀平板散射。\n3. 这为以非厄米量子力学方法处理经典声学散射提供了可推广框架，并可启发复杂边界、有限阵列及相关非厄米系统的解析与数值研究。", "summary_source": "deepseek", "authors": [{"name": "Farhang Loran"}, {"name": "Ali Mostafazadeh"}], "featured_authors": [{"name": "Farhang Loran"}, {"name": "Ali Mostafazadeh"}], "author_count": 2}, {"id": "2610.19897", "category": "quant-ph", "title": "Trading energy for coherence in mode discrimination", "abstract": "Energy is arguably the main resource in classical physics; coherence is the prototypical quantum resource. In this paper, we study the interplay between these two resources in the task of optimal mode discrimination. This task, motivated by cryptography and metrology, consists of finding in which mode a signal has been encoded, for a given finite set of possible modes. After recalling that the task can be cast as a semi-definite program, we solve completely the case of two-mode discrimination under a hard energy constraint $n\\leq N$. Specifically, we identify the region of modes overlap, for which the maximal energy state (the Fock state with N excitations) is the best choice for discrimination. For other overlaps, having access to coherence leads to better discrimination.", "url": "https://arxiv.org/abs/2610.19897", "type": "理论", "summary": "1. 该文研究最优模式辨别中能量与相干性的相互作用，将任务表述为半正定规划，并在硬能量约束 n≤N 下完全求解双模式辨别。\n2. 其核心结果是识别出模式重叠区域：在某一重叠范围内，最大能量态（含 N 个激发的 Fock 态）最优；其他重叠则利用相干性可提升辨别。\n3. 这为密码学与计量学中的模式识别任务提供了在有限能量下以相干性换取性能的明确资源权衡视角。", "summary_source": "deepseek", "authors": [{"name": "Shuyang Meng"}, {"name": "Valerio Scarani"}], "featured_authors": [{"name": "Shuyang Meng"}, {"name": "Valerio Scarani"}], "author_count": 2}, {"id": "2610.19904", "category": "quant-ph", "title": "Single and coupled quantum van der Pol oscillators: Wigner-function dynamics, exact qutrit solutions, and synchronization", "abstract": "We study quantum van der Pol oscillator in which single-photon pumping competes with a nonlinear two-photon dissipative channel to produce a quantum limit cycle, and the question of how two such oscillators with non-identical intrinsic frequencies synchronize in the sense of phase locking when coupled dissipatively to one another. For a single oscillator, starting from a Lindblad description of the dynamics, we derive the exact Wigner-function evolution equation, and show that its Fokker--Planck approximation admits in the appropriate regime an equivalent classical Itô stochastic description that reproduces remarkably well the full Lindblad dynamics. Notably, the stochastic approach provides an efficient means of capturing system dynamics in the semiclassical regime, where a large number of energy eigenstates contribute and direct numerical simulations become computationally demanding. Restricting to the three lowest Fock states and using a parity symmetry, we obtain in closed form the stationary-state density matrix and its Wigner-function representation that displays pronounced nonclassical features. For two non-identical oscillators, we study the full Lindblad dynamics numerically and characterize synchronization through the stationary-state order parameter as a function of frequency mismatch and dissipative coupling. We find that increasing the effective nonlinear dissipative strength suppresses the synchronized region. Restricting the two oscillators to the three-level qutrit subspace, a parity symmetry reduces the stationary-state problem to an exact $41$-dimensional linear system, allowing to compute the synchronization order parameter. In this reduced description, results in the limit of large dissipation agree closely with those from the full dynamics, while exhibiting in the limit of small dissipation a double-peak synchronization structure accompanied by a phase reversal.", "url": "https://arxiv.org/abs/2610.19904", "type": "理论+数值", "summary": "1. 该工作由Lindblad主方程推导量子van der Pol振子的精确Wigner函数演化方程，并研究两不同频振子的耗散同步。\n2. 其要点是Fokker–Planck近似可等价为经典Itô随机描述，且在宇称对称下于三能级截断给出闭式稳态密度矩阵与精确41维线性同步问题。\n3. 该框架表明半经典随机方法可高效处理多本征态参与区，并揭示强非线性耗散压制同步、弱耗散下出现双峰同步与相位反转。", "summary_source": "deepseek", "authors": [{"name": "Rohitashwa Chattopadhyay"}, {"name": "Vinayak Pendse"}, {"name": "Shamik Gupta"}], "featured_authors": [{"name": "Rohitashwa Chattopadhyay"}, {"name": "Vinayak Pendse"}, {"name": "Shamik Gupta"}], "author_count": 3}, {"id": "2610.19905", "category": "quant-ph", "title": "On the structure of low-rank PPT entangled states violating Peres conjecture", "abstract": "Bound-entangled states with positive partial transpose (PPT) can exhibit quantum steering and Bell nonlocality, disproving the long-standing Peres conjecture and its stronger steering counterpart. These counterexamples, obtained through explicit constructions or numerical searches, raise the question of whether they share a common structural origin. We address this question in the low-rank regime by asking whether known counterexamples can be obtained, up to invertible local filtering, from the complement of an unextendible product basis (UPB). We find that the answer depends crucially on the local dimension. In $3\\otimes3$, the rank-four structure of PPT entangled states implies that both the steerable PPT state of Moroder \\textit{et al.} and the Bell-nonlocal PPT state of Vértesi and Brunner can be obtained from UPB-complement states under invertible local filtering. For three qubits, in contrast, rank-four states that are PPT across every bipartition are separable across each cut. Moreover, comparison of the product-vector structure of the relevant kernels shows that the known three-qubit Bell-nonlocal PPT states cannot be obtained by invertible local filtering from the complement of any three-qubit UPB. Going beyond rank four, we further show that a known rank-eight three-qutrit state, supported on the complement of a UPB and PPT across every bipartition, is genuinely multipartite entangled. These results show that UPBs provide a unifying structural origin for important low-rank PPT entangled states in $3\\otimes3$, but that nonlocal bound entanglement is not, in general, a UPB phenomenon.", "url": "https://arxiv.org/abs/2610.19905", "type": "理论+数值", "summary": "1. 该工作围绕《On the structure of low-rank PPT entangled states violating Peres conjecture》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Gurvir Singh"}, {"name": "Manik Banik"}], "featured_authors": [{"name": "Gurvir Singh"}, {"name": "Manik Banik"}], "author_count": 2}, {"id": "2610.19923", "category": "quant-ph", "title": "Majorana Edge Modes Reshape Kibble-Zurek Scaling in Kitaev Honeycomb Ribbons", "abstract": "Recent progress in programmable quantum simulators motivates exact benchmarks for nonequilibrium dynamics in topological quantum matter. We study the Kitaev honeycomb model driven through its critical regions by a linear ramp of the bond coupling $J_z$ over a ramp time $\\tau$, comparing zigzag and armchair ribbons with fully periodic tubes. The production of excitations exhibits a geometry-dependent finite-size crossover controlled by $N_2/\\sqrt{\\tau}$, the ratio of the ribbon width to the Kibble--Zurek length. Periodic tubes obey the expected critical-line Kibble--Zurek scaling and serve as the boundary-free benchmark. Zigzag ribbons follow the same scaling until defect production is exponentially suppressed by a finite-width algebraic gap floor associated with the formation of Majorana edge modes, whose occupation is pinned by inversion parity. Armchair ribbons instead support transient Majorana edge modes with exponentially small gaps, producing width-parity-dependent defect plateaus: exactly one defect per unit length for odd widths and an approximate, transient plateau near one half for even widths. The quench-generated entanglement entropy and fermionic logarithmic negativity inherit the same geometry-dependent structure, and the negativity further distinguishes the coherence-borne entanglement of the Kibble--Zurek regime from the population-borne entanglement of the edge-mode plateaus. These results identify boundary Majorana modes as the mechanism controlling departures from ideal Kibble--Zurek dynamics and provide geometry-resolved benchmarks for programmable simulations of topological matter.", "url": "https://arxiv.org/abs/2610.19923", "type": "理论+数值", "summary": "1. 该工作线性调节J_z驱动Kitaev蜂窝模型穿越临界区，比较锯齿/扶手椅带与周期管的KZ激发产生。\n2. 其卖点是发现N_2/√τ控制的尺寸交叉及边界马约拉纳模重塑标度：锯齿带缺陷指数压制，扶手椅带平台依赖宽度宇称。\n3. 这为可编程拓扑物质模拟提供几何分辨基准，并表明边界模是偏离理想KZ动力学的控制机制。", "summary_source": "deepseek", "authors": [{"name": "Hyesung Choi"}, {"name": "Antonio Mandarino"}, {"name": "Mahn-Soo Choi"}], "featured_authors": [{"name": "Hyesung Choi"}, {"name": "Antonio Mandarino"}, {"name": "Mahn-Soo Choi"}], "author_count": 3}, {"id": "2610.19936", "category": "quant-ph", "title": "Improved Quantum Algorithms for Rényi Entropies Estimation", "abstract": "Entropy estimation of discrete probability distributions is a fundamental problem in statistical inference and quantum property estimation. In this paper, we study the problem of estimating Rényi entropy $H_\\alpha(\\mathbf{p})$ for any distribution $\\mathbf{p} = (p_i)_{i=1}^n$ given its purified quantum query-access. For non-integer $\\alpha > 1$, our algorithm estimates $H_\\alpha(\\mathbf{p})$ to within additive error $\\epsilon$ using only $\\widetilde{\\mathcal{O}}\\big(n^{\\max\\{1/2,1-1/\\alpha\\}}/\\epsilon\\big)$ queries, which improves the best known upper bound for dependence on both $n$ and $1/\\epsilon$. For $0<\\alpha<1$, our algorithm has query complexity $\\widetilde{\\mathcal{O}}\\big(n^{1/(2\\alpha)}/\\epsilon^{\\max\\{1,1/(2\\alpha)\\}}\\big)$, which improves the dependence on $1/\\epsilon$ of the current best upper bound without incresing its $n$ dependence. Our approach adapts the multi-level estimation framework to relative approximation of the power sums and leverage binary search to remove the requirement of prior knowledge of them. We also strengthen the precision-dependent lower bound to $\\Omega\\big(1/\\epsilon^{\\max\\{1,1/(2\\alpha)\\}}\\big)$ for $0<\\alpha<1$, which identifies the optimal precision dependence of our algorithm.", "url": "https://arxiv.org/abs/2610.19936", "type": "理论+数值", "summary": "1. 该工作围绕《Improved Quantum Algorithms for Rényi Entropies Estimation》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Zongxing Xiong"}, {"name": "Chengshen Gao"}, {"name": "Lvzhou Li"}], "featured_authors": [{"name": "Zongxing Xiong"}, {"name": "Chengshen Gao"}, {"name": "Lvzhou Li"}], "author_count": 3}, {"id": "2610.19962", "category": "quant-ph", "title": "Testing graph isomorphism using simple quantum circuits", "abstract": "The graph isomorphism problem asks whether two graphs are equivalent up to a permutation of their vertices. Its precise computational complexity remains unresolved, and it is still unknown whether a polynomial-time algorithm exists. We investigate whether simple graph-dependent Instantaneous Quantum Polynomial-time (IQP) and Quantum Approximate Optimisation Algorithm (QAOA) circuits can distinguish non-isomorphic graphs. We first show that suitable IQP and QAOA constructions allow the underlying graph to be reconstructed using a polynomial number of samples. Building on previous work using the QAOA energy, we show that Hamming weight distributions can distinguish graph pairs at circuit depths for which the numerically computed energy gap is zero. We then apply graph invariants to the matrix of ZZ correlators on the output distribution. For the specific case of the graph spectrum, at QAOA depth $p=2$, this invariant numerically distinguishes all $10{,}486$ cospectral regular graph pairs tested on up to 18 vertices. For IQP circuits, we introduce a finer invariant based on probability multiplicities within Hamming weight sectors, which distinguishes every non-isomorphic graph pair tested numerically. Finally, we derive exact graph-theoretic characterisations of the IQP output distribution at $\\theta=\\pi/2$ and $\\theta=\\pi/4$. These results show that simple graph-dependent quantum circuits encode substantial structural information, while leaving open whether this information can be extracted efficiently for general graph isomorphism.", "url": "https://arxiv.org/abs/2610.19962", "type": "理论+数值", "summary": "1. 该工作围绕《Testing graph isomorphism using simple quantum circuits》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Samuel Beasley"}, {"name": "Ashley Montanaro"}], "featured_authors": [{"name": "Samuel Beasley"}, {"name": "Ashley Montanaro"}], "author_count": 2}, {"id": "2610.20006", "category": "quant-ph", "title": "Multi-Instantons and Exact-WKB Stokes Jumps in Multi-Well Quantum Mechanics", "abstract": "We study the relation between the exact-WKB Delabaere--Dillinger--Pham Stokes jumps and the multi-instanton expansion of a one-dimensional potential with $N$ equal-depth minima. For a single barrier this relation is the Bogomolny--Zinn-Justin cancellation between the instanton--anti-instanton ambiguity and the Borel ambiguity of perturbation theory, and we extend it to every consecutive barrier interval and to the integration contours themselves. In the dilute large-$T$ regime at fixed nonperturbative grade, we derive the quasi-zero mode integral over the instanton separations from the Euclidean path integral and reduce it to Gamma and Hankel periods. With the local Weber level function of each well and one normalization per well fixed by the local Weber connection matrix, these periods reproduce the two lateral connected exact-WKB coefficients. The two lateral contours of each instanton--anti-instanton separation differ by exactly one Hankel cycle, and this linear Picard--Lefschetz relation reproduces the Stokes jump of the connected coefficient. A numerical solution of the Schrödinger equation for a symmetric triple well confirms the resulting two-barrier level splitting. At higher fixed grade, the map from ordered event sequences to normalized scalar coefficient products is not one-to-one. At leading dilute order the scalar weight of a closed event sequence depends only on the numbers of barrier crossings, $\\mathcal I\\bar{\\mathcal I}$ pairs, and $\\mathcal I\\mathcal I$/$\\bar{\\mathcal I}\\bar{\\mathcal I}$ pairs. We construct two inequivalent grade-six triple-well event sequences with the same product of local Weber amplitudes, which embed in every potential with $N\\ge3$ wells. Our results hold within the regular dilute, one-loop, local Weber approximation.", "url": "https://arxiv.org/abs/2610.20006", "type": "理论+数值", "summary": "1. 该工作研究N等深极小一维势中精确WKB的DDP Stokes跳变与多瞬子展开的关系，将单势垒的BZJ消去推广到各相邻势垒区间及积分围道。\n2. 在固定非微扰阶的稀释大T极限，由欧氏路径积分导出瞬子间距准零模积分并约化为Gamma与Hankel周期；借助各阱局部Weber能级函数和连接矩阵，这些周期重现两侧连通精确WKB系数，而两侧围道相差一个Hankel圈，其Picard–Lefschetz关系给出Stokes跳变。\n3. 对称三阱数值解验证两势垒能级劈裂；高阶固定阶下有序事件序列到标量系数积的映射非一一对应，且存在可嵌入N≥3势的两个不等价六阶三阱序列，提示在规则稀释单圈局域Weber近似内多瞬子—Stokes对应具有序列简并。", "summary_source": "deepseek", "authors": [{"name": "Alireza Behtash"}, {"name": "Syo Kamata"}], "featured_authors": [{"name": "Alireza Behtash"}, {"name": "Syo Kamata"}], "author_count": 2}, {"id": "2610.20078", "category": "quant-ph", "title": "Strong subadditivity of topological entropy on the torus: Rényi order and non-Abelian structure", "abstract": "We classify strong subadditivity for the canonical topological Rényi functional at finite positive orders on an unpunctured torus in the topological quantum field theory of any finite unitary modular tensor category. Universal validity means validity for all pure ground states and all regular region pairs with transverse or disjoint boundaries and compatible corner rounding. At von Neumann order one, the inequality holds universally. For each fixed order strictly between zero and one, universal validity is equivalent to pointedness, meaning that every simple anyon type has quantum dimension one. For every nonpointed category and each finite positive order other than one, we construct a violating pure state and an allowed pair. For a fixed pointed category and fixed order above one, universal validity is equivalent to a same-order modular Fourier entropy bound for every pure state. Global homological constraints on actual unions and intersections and established weighted modular uncertainty prove the order-one theorem. For parallel annuli at fixed flux distribution, the order-one functional is affine in their positive count. At other orders, unequal quantum dimensions on the occupied support induce strict curvature that suitable overlapping regions convert into negative deficits. Under the boundary-charge cutting prescription, the von Neumann theorem extends to arbitrary logical density matrices in the same ground space.", "url": "https://arxiv.org/abs/2610.20078", "type": "理论", "summary": "1. 该工作在未穿孔环面上、任意有限幺正模张量范畴的拓扑量子场论中，分类了有限正阶拓扑Rényi泛函的强次可加性。\n2. 关键结论为：阶一普遍成立；(0,1)阶普适性等价于所有简单任意子量子维数为1；否则可构造违背态，高阶等价于同阶模傅里叶熵界。\n3. 该分类将拓扑熵强次可加性与任意子量子维度、Rényi阶及模不确定性联系起来，并用边界荷切割把阶一定理推广至逻辑密度矩阵。", "summary_source": "deepseek", "authors": [{"name": "Yi Liang"}], "featured_authors": [{"name": "Yi Liang"}], "author_count": 1}, {"id": "2610.20152", "category": "quant-ph", "title": "Pinning of a High-Energy Wavepacket by a Single Impurity", "abstract": "We demonstrate that a single repulsive impurity enhances directional confinement of a high-energy wavepacket in a finite two-dimensional lattice of quantum wells. At energies far above the interwell barriers, the impurity suppresses transverse dynamical tunneling while preserving propagation along a principal lattice axis, even as the corresponding classical regular region shrinks. Confinement is strongest at impurity amplitudes comparable to the barrier height and weakens for stronger perturbations. Spectral analysis links this nonmonotonic pinning to the wavepacket's overlap with eigenstates concentrated along the launch direction, consistent with impurity-induced variational scarring. These results show that a single local defect can control quantum propagation over distances far exceeding its own spatial extent.", "url": "https://arxiv.org/abs/2610.20152", "type": "数值", "summary": "1. 该工作研究有限二维量子阱晶格中单个排斥杂质对高能波包传输的钉扎效应，发现杂质可增强沿主晶轴的定向约束并抑制横向动力学隧穿。\n2. 其关键物理在于：即使能量远高于阱间势垒且经典规则区收缩，钉扎仍出现，并在杂质强度与势垒高度相当时最强，更强扰动反致减弱；谱分析将此非单调行为归因于波包与沿发射方向局域本征态的叠加，符合杂质诱导的变分疤痕图像。\n3. 这表明单个局域缺陷能调控远超其空间尺度的量子传播，为缺陷工程、波包操控及相关量子疤痕研究提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Fartash Chalangari"}, {"name": "Anant Vijay Varma"}, {"name": "Joonas Keski-Rahkonen"}, {"name": "Esa Räsänen"}], "featured_authors": [{"name": "Fartash Chalangari"}, {"name": "Anant Vijay Varma"}, {"name": "Joonas Keski-Rahkonen"}, {"name": "Esa Räsänen"}], "author_count": 4}, {"id": "2610.20159", "category": "quant-ph", "title": "Exact analytical spectra of an effective field-modified radial Schrödinger equation by the Nikiforov--Uvarov method", "abstract": "We revisit the effective radial Schrödinger equation for a charged spinless particle in collinear static electric and magnetic fields that was formulated in our earlier work within the tridiagonal representation approach (TRA). In that model the angular factor of the electric coupling is replaced by the orientation parameter $C=\\cos\\theta$, the linear Zeeman term is diagonal in the azimuthal quantum number, and the effective field-modified central potential takes the form $V(r)=\\Vt(r)+qECr$. Here we show that the same equation can be solved exactly without the TRA, by the Nikiforov--Uvarov (NU) method, once the potential component $\\Vt(r)$ is prescribed. Three examples are worked out in closed form: a Kratzer-type component, which yields a linear-plus-Coulomb-plus-inverse-square central potential; a pseudoharmonic-type component, which yields a linear-plus-harmonic-plus-inverse-square potential; and a Hulthén-type component with a repulsive core (Manning--Rosen form), which yields a screened confining potential with a finite number of $s$-wave bound states. For each case we obtain the energy spectrum, the normalized eigenfunctions in terms of Laguerre or Jacobi polynomials, the location of the potential minimum, and closed-form radial moments. The spectra are independent of the orientation $\\theta$ and of the electric field, in agreement with the structure found by the TRA, while the field enters through the shape of $V(r)$, the radial moments, and the expectation value $\\langle V\\rangle_k$. All analytical results are confirmed by an independent finite-difference diagonalization.", "url": "https://arxiv.org/abs/2610.20159", "type": "理论+数值", "summary": "1. 该工作重新审视共线静电场与磁场中带电无自旋粒子的有效径向薛定谔方程，证明仅用Nikiforov–Uvarov方法即可对给定势分量精确求解，并给出Kratzer、赝谐振和Hulthén型三个闭式实例。\n2. 其卖点在于得到闭式能谱、Laguerre/Jacobi多项式归一化本征函数、势极小位置与径向矩，并表明能谱不依赖取向角与电场，场仅通过势形状、径向矩及⟨V⟩_k体现。\n3. 所有解析结果与三对角表示法结构一致并经有限差分对角化验证，为场修饰径向问题提供独立基准，并提示NU方法在类似有效势模型中的适用性。", "summary_source": "deepseek", "authors": [{"name": "Tunde Joseph Osunmusanmi"}, {"name": "Berihu Teklu"}], "featured_authors": [{"name": "Tunde Joseph Osunmusanmi"}, {"name": "Berihu Teklu"}], "author_count": 2}, {"id": "2610.20198", "category": "quant-ph", "title": "Geometric-resource bounds and permutation-averaged success probabilities for the WZP algorithm", "abstract": "Solving linear systems of equations is a fundamental task in machine learning and optimization. In this work, we extend the original WZP algorithm from real symmetric linear systems to complex Hermitian linear systems. We then study the success probability of the modified WZP algorithm from a resource-theoretic perspective. By expressing the postselection success probability as the expectation value of a positive operator, we derive upper and lower bounds of the maximal success probability over separable, incoherent, and real pure states. These bounds further establish connections between the maximal success probability and geometric entanglement, coherence, and imaginarity. We further show that, under permutation averaging, the averaged success probability is an affine function of the coherence fraction, with its dependence determined by the alignment between the success operator and the equal-superposition state. We also investigate the preprocessed WZP algorithm under subgroup-constrained preprocessing. For the two-level family, the optimal success probability is determined by the maximal projection weight onto the orbit of the target projector. Our results provide a unified perspective on the WZP success probability under different operational constraints.", "url": "https://arxiv.org/abs/2610.20198", "type": "理论+数值", "summary": "1. 该工作将原WZP算法从实对称线性系统扩展到复厄米线性系统，并从资源理论视角分析修正算法的成功概率。\n2. 其核心是把后选择成功概率写成正算符期望值，分别对可分态、非相干态和实纯态导出最大成功概率的上下界，并建立其与几何纠缠、相干性和虚数性的联系；置换平均下成功概率是相干份额的仿射函数，其依赖由成功算符与等叠加态的对齐决定。\n3. 该框架进一步分析子群约束预处理，两能级族的最优成功概率由目标投影算符轨道上的最大投影权重确定，为不同操作约束下WZP成功概率给出统一视角。", "summary_source": "deepseek", "authors": [{"name": "Linlin Ye"}, {"name": "Linmao Wang"}, {"name": "Zhaoqi Wu"}, {"name": "Shao-Ming Fei"}], "featured_authors": [{"name": "Linlin Ye"}, {"name": "Linmao Wang"}, {"name": "Zhaoqi Wu"}, {"name": "Shao-Ming Fei"}], "author_count": 4}, {"id": "2610.20515", "category": "quant-ph", "title": "Petz Recovery through a Single Polar Transformation for Approximate Quantum Error Correction", "abstract": "The Petz recovery map provides a near optimal decoder for approximate quantum error correction, but its inverse square-root normalization complicates circuit implementation. We use the polar structure of the Petz recovery isometry to implement recovery through a single quantum singular value transformation (QSVT). We give explicit block-encoding circuits and an extended recovery isometry that yields approximate Petz recovery without postselection. We bound the diamond distance between the approximate and ideal Petz encoding-recovery channels in terms of a spectrum-weighted loss, which provides a channel specific objective for optimizing the QSVT angles. Uniform polynomial approximation yields an asymptotic error bound that decays exponentially with the number of QSVT iterations, at a rate controlled by the smallest nonzero scaled singular value. Applications to Haar-random encoding and the Hayden-Preskill protocol illustrate the tradeoff between circuit depth and recovery accuracy and place existing scrambling decoders within a common Petz recovery framework.", "url": "https://arxiv.org/abs/2610.20515", "type": "理论+数值", "summary": "1. 该工作利用Petz恢复等距的极分解结构，把近似量子纠错中的Petz恢复实现为单次量子奇异值变换，并给出显式块编码线路与扩展恢复等距。\n2. 其核心卖点在于用扩展恢复等距消除后选择，以谱加权损失给出近似与理想Petz编码-恢复信道的金刚石距离上界，并据此优化QSVT角度；均匀多项式近似使误差随迭代次数指数衰减，衰减率由最小非零缩放奇异值决定。\n3. 这一框架在Haar随机编码与Hayden-Preskill协议中展示了线路深度与恢复精度的权衡，也将现有置乱解码器统一到Petz恢复框架内，为优化近似纠错解码提供明确路径。", "summary_source": "deepseek", "authors": [{"name": "Hanzhang Zhao"}, {"name": "Shenglong Xu"}], "featured_authors": [{"name": "Hanzhang Zhao"}, {"name": "Shenglong Xu"}], "author_count": 2}, {"id": "2610.20536", "category": "quant-ph", "title": "Intermediate memory costs of quantum channel synthesis with a protected subsystem", "abstract": "A quantum memory can preserve a subsystem perfectly while discarding information needed by a later operation. We study the total intermediate dimension required for channel synthesis when the first stage protects a $b$-dimensional subsystem and has a prescribed noncommutative graph imposing full confusability on an $a$-dimensional control register. For a finite family of classically controlled branches, exact synthesis is possible if and only if the target graph contains the prescribed graph of the first stage. For every feasible family, we construct a single processor that implements all branches exactly. The processor uses pairwise nonorthogonal pure program states in a register of dimension at most $a$. A target graph may be realizable with a carrier of dimension $b$, while synthesizing a channel with that graph can require dimension $ab$. We also characterize the closure of the attainable channels, distinguishing exact synthesis from arbitrarily accurate approximation. Finally, for a family built from the trine communication task, a four-dimensional carrier permits exact synthesis with quantum programs under output depolarization. At the same total carrier dimension and without free shared randomness, classical programs have optimal normalized diamond error $(1-\\eta)/4$, where $0\\leq\\eta\\leq1$ is the depolarization strength. For $\\eta<1$, the gap persists under sufficiently small perturbations of the target branches.", "url": "https://arxiv.org/abs/2610.20536", "type": "理论", "summary": "1. 研究了第一阶段保护 b 维子系统、并具在 a 维控制寄存器上强制完全可混淆的非交换图时，信道合成所需的总中间维度。\n2. 核心是证明有限经典控制分支精确合成当且仅当目标图包含第一阶段指定图，并构造用至多 a 维非正交纯程序态的单一处理器，给出 b 与 ab 的载体维度分离。\n3. 可达信道闭包刻画及 trine 任务中去极化下量子程序与经典程序归一化菱形误差 (1-η)/4 的差距表明，保护子系统的中间维度代价应纳入信道合成设计。", "summary_source": "deepseek", "authors": [{"name": "Kai Liu"}, {"name": "Deguang Han"}], "featured_authors": [{"name": "Kai Liu"}, {"name": "Deguang Han"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
