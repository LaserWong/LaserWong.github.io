it a sideways crack-path instability that is amplified as the pulling velocity decreases and nearly vanishes at high pulling velocities. The sideways deviation amplitude decreases logarithmically with increasing pulling velocity and scales as the square root of the filler fraction. Large deviations develop at low mean crack velocities and are associated with effective fracture energies up to two orders of magnitude lower. These findings are consistent with subcritical rupture kinetics and suggest that the deviation amplitude is limited by the elasto-adhesive length.", "url": "https://arxiv.org/abs/2610.20275", "type": "理论", "summary": "1. 该工作发现纳米颗粒填充弹性体存在一种侧向裂纹路径失稳，其随拉伸速度降低而增强、在高速下近乎消失。\n2. 该失稳的侧向偏折幅度随拉伸速度增加呈对数衰减，并近似正比于填料分数的平方根；低平均裂纹速度下的大偏折与有效断裂能最多降低两个数量级相关。\n3. 结果与亚临界破裂动力学一致，并表明偏折幅度受弹性-黏附长度限制，这为理解慢速加载下的裂纹失稳调控、相关模型及弹性体设计提供了启示。", "summary_source": "deepseek", "authors": [{"name": "G. Pallares"}, {"name": "O. Ramos"}, {"name": "L. Vanel"}], "featured_authors": [{"name": "G. Pallares"}, {"name": "O. Ramos"}, {"name": "L. Vanel"}], "author_count": 3}, {"id": "2610.20307", "category": "cond-mat", "title": "Making Weak Interlayer Excitons Absorb: Manipulating the Effective Oscillator Strength via Purcell Engineering of Critical Coupling", "abstract": "Interlayer excitons (IXs) in transition metal dichalcogenide bilayers possess unique dipolar properties, providing a path for exploring correlated many-body phases, electrically tunable dipole-dipole interactions, and long-range exciton transport. However, the large electron-hole separation underlying their dipolar character also results in a significantly reduced oscillator strength, limiting their direct optical interaction with light, and thus the direct probing of their dynamics and many-body interactions. Here, we show that by using Purcell engineering of critical coupling, a weak interlayer transition can absorb as strongly as the dominant intralayer transition, despite its much smaller intrinsic oscillator strength. Using this approach, in an open cavity architecture we demonstrate an order of magnitude IX absorption modulation in bilayer and trilayer MoS2, with doubling of the IX to A-exciton interaction strength weight from ~23% to ~53%. Furthermore, we demonstrate that in a tailored closed cavity architecture, the IX enhancement can reach beyond an order of magnitude, from ~5% to ~83% excitonic absorption, enabling IX absorption similar to intralayer excitons. An analytical description of the interaction is obtained via a closed-form transmission-line model which separates the excitonic and photonic contributions to the optical response, revealing how cavity architecture can be designed towards critical coupling. Our findings establish Purcell engineering of critical coupling as a general route to controlling and enhancing weak excitonic transitions.", "url": "https://arxiv.org/abs/2610.20307", "type": "理论", "summary": "1. 该工作利用临界耦合的Purcell工程，增强二维过渡金属硫化物双层/三层MoS2中弱层间激子（IX）的光吸收，使其可与主导的层内A激子吸收相比拟。\n2. 其核心卖点是通过Purcell临界耦合调控有效振子强度，在开放腔中实现约一个量级的IX吸收调制，将IX与A激子相互作用权重从约23%提升至约53%，并在定制闭合腔中把IX吸收从约5%提高到约83%，同时以闭式传输线模型分离激子与光子贡献。\n3. 这为直接探测弱层间激子的动力学与多体相互作用提供了通用方法，并启示通过腔结构设计可拓展至其他弱激子跃迁体系。", "summary_source": "deepseek", "authors": [{"name": "Saroj Poudyal"}, {"name": "Anabel Atash Kahlon"}, {"name": "Michael Klein"}, {"name": "Matan Meshulam"}, {"name": "Yonatan Gershuni"}, {"name": "Thomas Poirier"}, {"name": "James H. Edgar"}, {"name": "Mukesh Kumar"}, {"name": "Seth Ariel Tongay"}, {"name": "Itai Epstein"}], "featured_authors": [{"name": "Saroj Poudyal"}, {"name": "Anabel Atash Kahlon"}, {"name": "Michael Klein"}, {"name": "Mukesh Kumar"}, {"name": "Seth Ariel Tongay"}, {"name": "Itai Epstein"}], "author_count": 10}, {"id": "2610.20314", "category": "cond-mat", "title": "Coherent and dissipative coupling of multiple photon-magnon hybrids in a chiral microwave resonator", "abstract": "We demonstrate control between level repulsion and level attraction of photon-magnon coupling spectra in a chiral microwave-photon resonator loaded with a 2 mm YIG sphere. By systematically varying the coupling mode volume via the YIG position and the dc-field orientation, we tune the ratio between coherent and dissipative coupling strengths, $J/\\Gamma$, and thereby switch between level repulsion and level attraction in the hybrid spectra. Full-wave electromagnetic and magnetization-dynamics simulations reveal multiple photon-magnon hybrid modes with distinct spatial overlap factors, which quantitatively account for gap sizes and their angular dependence. Strong nonreciprocity appears near $J/\\Gamma \\approx 1$, yielding 28.6 dB isolation ratio in agreement with a unified single-bath input-output model and full-wave simulations. Angular dependence of spectral characterization confirms a picture of the chirality-selection rule and our method of geometric tuning might be useful for considering reconfigurable on-chip isolators.", "url": "https://arxiv.org/abs/2610.20314", "type": "理论+数值", "summary": "1. 该工作在加载2 mm YIG球的手性微波谐振腔中，通过改变YIG位置与直流场取向调控多个光子-磁子杂化模式，并系统测量其相干与耗散耦合竞争下的光谱演化。\n2. 核心卖点是通过几何调节耦合模体积来连续改变相干与耗散耦合强度比J/Γ，从而在同一体系中实现能级排斥与能级吸引的可控切换，并用全波电磁与磁化动力学模拟定量解释模式重叠因子及角度依赖，在J/Γ≈1附近获得28.6 dB非互易隔离。\n3. 该手性选择定则与几何调控方法为可重构片上隔离器及多模光子-磁子混合体系的非互易调控提供了可检验路径。", "summary_source": "deepseek", "authors": [{"name": "Supanat Chantarattana"}, {"name": "Charlie W. F. Freeman"}, {"name": "Daniel Prestwood"}, {"name": "Nimisha Arora"}, {"name": "Vincent Castel"}, {"name": "Hidekazu Kurebayashi"}], "featured_authors": [{"name": "Supanat Chantarattana"}, {"name": "Charlie W. F. Freeman"}, {"name": "Daniel Prestwood"}, {"name": "Nimisha Arora"}, {"name": "Vincent Castel"}, {"name": "Hidekazu Kurebayashi"}], "author_count": 6}, {"id": "2610.20374", "category": "cond-mat", "title": "Effective Graph Neural Representation of Chain Architectures of Block Copolymers Tested by Predicting RPA Instability Limits", "abstract": "Advances in polymer synthesis and computational modeling are expanding the block-copolymer architecture space accessible for phase-behavior design. Machine learning can accelerate this exploration, yet a common representation capable of learning across diverse chain topologies remains lacking. Here, we present a graph neural network (GNN) representation of acyclic AB multiblock architectures, tested by random-phase approximation (RPA) instability prediction. Each chain is represented as a graph, enabling a common model to learn across diverse topologies. This representation, which organizes RPA-related information, retains predictive capability when extrapolated to architectures with more blocks and demonstrates its potential for reuse across tasks through transfer to instability-wavenumber prediction. By effectively linking block-copolymer chain architecture to field-theoretic response, this graph representation not only reconstructs stability-limit curves but also provides a practical route for future self-consistent field theory exploration of ordered phase space across complex topologies.", "url": "https://arxiv.org/abs/2610.20374", "type": "理论+数值", "summary": "1. 该工作提出一种面向无环AB多嵌段共聚物链拓扑的图神经网络表示，并以随机相近似（RPA）不稳定性极限预测作为检验任务，旨在统一学习多样链结构。\n2. 其关键卖点是将每条链编码为图，使单一模型能跨多种拓扑学习，并在外推至更多嵌段时保持预测能力，且可迁移至不稳定性波数预测以复用该表示。\n3. 该表示有效连接嵌段共聚物链结构与场论响应，不仅能重建稳定性极限曲线，也为未来用自洽场理论研究复杂拓扑的有序相空间提供实用路径。", "summary_source": "deepseek", "authors": [{"name": "Xiyue Zhang"}, {"name": "Yutong Wu"}, {"name": "Yi-Xin Liu"}], "featured_authors": [{"name": "Xiyue Zhang"}, {"name": "Yutong Wu"}, {"name": "Yi-Xin Liu"}], "author_count": 3}, {"id": "2610.20380", "category": "cond-mat", "title": "Designing Hamiltonians with Exactly Flat Higher-Vortexable Bands", "abstract": "The zero modes of the Aharonov-Casher Hamiltonian form an exactly flat, vortexable Chern band in any nonuniform magnetic field, analogous to the lowest Landau level. We ask which local Hamiltonians host exactly flat higher-vortexable bands. For a scalar Hamiltonian, an exactly flat first-vortexable band requires a mass proportional to the local field; the Dirac analogue has the same structure. For periodic Bernal bilayer graphene with nonzero mean flux, the exact zero-mode pair is genuinely first-vortexable if and only if the interlayer hopping has nonzero mean; zero-mean hopping instead gives a decomposable pair. Multiorbital models yield exact higher-vortexable chains to arbitrary order, while remaining first order in momentum.", "url": "https://arxiv.org/abs/2610.20380", "type": "理论", "summary": "1. 该工作探究能承载精确平且高阶涡旋能带的局域哈密顿量，从Aharonov-Casher零模出发分析标量、狄拉克、周期Bernal双层石墨烯及多轨道模型。\n2. 其核心发现是：标量哈密顿量的精确一阶涡旋平带要求质量项正比于局域场，狄拉克型结构相同；周期Bernal双层石墨烯在非零平均磁通下，零模对真正一阶涡旋当且仅当层间跃迁均值非零，均值为零则退化为可分解对；多轨道模型可构造任意阶精确高阶涡旋链且保持动量一阶。\n3. 这为按需设计精确高阶涡旋平带、推广朗道能级式结构及探索相关拓扑与关联物态提供了哈密顿量构造原则。", "summary_source": "deepseek", "authors": [{"name": "Daniel Spasic-Mlacak"}, {"name": "Nigel R. Cooper"}], "featured_authors": [{"name": "Daniel Spasic-Mlacak"}, {"name": "Nigel R. Cooper"}], "author_count": 2}, {"id": "2610.20382", "category": "cond-mat", "title": "Analog Cosmology in a Quenched Bose-Einstein Condensate Bubble", "abstract": "Recent interest and realization of ultracold bosons confined in shell-shaped, or bubble, traps have opened up several directions in the study of Bose-Einstein condensates (BECs) in intrinsically curved geometries. Here, we explore the prospect of using thin spherical shell-shaped BECs as analog gravity simulators of an expanding or contracting curved universe. We study an interacting BEC bubble subject to a temporal quench of the interaction strength. Our theoretical approach, which uses a Bogoliubov treatment following a dimensional reduction of a spherical BEC to the low-energy excitations of a shell-shaped structure, demonstrates how this system serves as a laboratory analog for a positively curved universe having a time-varying scale factor. We investigate spontaneous pair production triggered by quenches associated with exponentially decaying or growing interaction strengths, focusing on the emergence of oscillations in the structure factor---analogous to Sakharov oscillations in the Cosmic Microwave Background angular power spectrum. We quantify the entanglement of the produced pairs via logarithmic negativity, and show how this measure may be extracted from the power spectrum. These findings establish a bridge between quantum information science and early-universe cosmology in a laboratory setting.", "url": "https://arxiv.org/abs/2610.20382", "type": "理论", "summary": "1. 该工作把薄球壳形玻色-爱因斯坦凝聚气泡作为膨胀或收缩正曲率宇宙的类比引力模拟器，并研究相互作用强度的时序淬火。\n2. 其卖点是在球面BEC降维后的Bogoliubov框架中，淬火诱导粒子对产生、类Sakharov振荡及可由功率谱提取的对数负度纠缠。\n3. 这为在实验室中连接量子信息科学与早期宇宙学提供了可操作路径。", "summary_source": "deepseek", "authors": [{"name": "Ruotong Zhai"}, {"name": "Brendan Rhyno"}, {"name": "Zain Mehdi"}, {"name": "Naceur Gaaloul"}, {"name": "Smitha Vishveshwara"}, {"name": "Daniel E. Sheehy"}], "featured_authors": [{"name": "Ruotong Zhai"}, {"name": "Brendan Rhyno"}, {"name": "Zain Mehdi"}, {"name": "Naceur Gaaloul"}, {"name": "Smitha Vishveshwara"}, {"name": "Daniel E. Sheehy"}], "author_count": 6}, {"id": "2610.20434", "category": "cond-mat", "title": "Universal enhancement of the pairing gap in a dilute Fermi superfluid", "abstract": "At zero temperature, a dilute Fermi gas with an attractive contact interaction forms a superfluid with gapped fermionic excitations. We show that the gap at weak coupling can be organized as a trans-series expansion in the interaction strength and the asymptotic Gor'kov-Melik-Barkhudarov gap. Low-energy virtual quasiparticles generate corrections that are linear in the gap with a leading coefficient nearly 25$\\times$ larger than the other known coefficients. This substantially increases the gap at intermediate densities, highlighting that systematic corrections are crucial for quantitative predictions.", "url": "https://arxiv.org/abs/2610.20434", "type": "理论", "summary": "1. 该工作研究了零温稀薄吸引接触相互作用费米气体超流能隙的弱耦合结构，将配对能隙组织为相互作用强度与渐近Gor'kov-Melik-Barkhudarov能隙的跨级数展开。\n2. 其核心在于低能虚准粒子产生的修正线性依赖于能隙，且主导系数比已知其他系数大约25倍，从而在中等密度显著增强配对能隙。\n3. 这表明系统性的高阶修正对定量预测稀薄费米超流能隙不可或缺，并提示需重新审视相关密度区的理论基准与实验判读。", "summary_source": "deepseek", "authors": [{"name": "Silas R. Beane"}, {"name": "Roland C. Farrell"}, {"name": "Cameron P. Shotwell"}], "featured_authors": [{"name": "Silas R. Beane"}, {"name": "Roland C. Farrell"}, {"name": "Cameron P. Shotwell"}], "author_count": 3}, {"id": "2610.20491", "category": "cond-mat", "title": "Testing Replica Symmetry Breaking in the three-dimensional Edwards-Anderson model by using vanishing fields", "abstract": "Replica Symmetry Breaking (RSB) theory for spin glasses, which is exact in infinite dimensions, provides detailed predictions for the behavior of these systems. One of these predictions is that vanishing magnetic fields induce chaotic behavior. Here, vanishing has a precise meaning: we refer to an externally applied magnetic field with intensity scaling as $1/\\sqrt{N}$, where $N$ is the number of spins in the system. RSB predicts that this chaotic behavior depends only on the probability density function of the overlap, $P(q)$, as computed at zero field. We proceed to test the RSB prediction in the 3D Edwards-Anderson model, by first computing the $P(q)$ numerically in the absence of a magnetic field. We then use this function as input to analytically compute the statistics of the states in the regime of a vanishing magnetic field, using a representation based on the Bolthausen-Sznitman coalescent process (which is exact for the mean-field Sherrington-Kirkpatrick model). This mixed numerical-analytical approach allows us to determine the prediction of RSB for the overlap distribution function measured in the presence of a small vanishing field, as well as the increase in chaoticity as the field strength grows. The above RSB predictions are quantitatively compared with the outcome of numerical simulations of the three-dimensional Edwards-Anderson in the presence of a small vanishing field, finding very good agreement. This agreement provides strong support for the idea that three-dimensional spin glass at zero magnetic field and low temperature is well described by RSB theory.", "url": "https://arxiv.org/abs/2610.20491", "type": "理论+数值", "summary": "1. 该工作结合零场数值计算与解析方法，检验三维Edwards-Anderson模型中复本对称破缺对消失磁场的预言。\n2. 其核心是以零场重叠分布P(q)为输入，借Bolthausen-Sznitman聚合过程解析计算消失场下态统计与混沌性增长。\n3. 与三维EA在小消失磁场下的模拟定量吻合，支持零场低温三维自旋玻璃可由RSB理论描述，并启发有限维RSB进一步检验。", "summary_source": "deepseek", "authors": [{"name": "Miguel Aguilar-Janita"}, {"name": "Silvio Franz"}, {"name": "Victor Martin-Mayor"}, {"name": "Javier Moreno-Gordo"}, {"name": "Giorgio Parisi"}, {"name": "Federico Ricci-Tersenghi"}, {"name": "Juan J. Ruiz-Lorenzo"}], "featured_authors": [{"name": "Miguel Aguilar-Janita"}, {"name": "Silvio Franz"}, {"name": "Victor Martin-Mayor"}, {"name": "Giorgio Parisi"}, {"name": "Federico Ricci-Tersenghi"}, {"name": "Juan J. Ruiz-Lorenzo"}], "author_count": 7}, {"id": "2610.20498", "category": "cond-mat", "title": "Structural identification in general crystalline systems via Voronoi cell topology", "abstract": "Widely used methods for identifying crystal structure in atomistic simulations are limited in practice to a handful of simple structures, leaving many important crystalline systems without automated classification techniques. Voronoi topology analysis offers a route to classifying arbitrary crystalline and defect environments, but realizing this potential first requires enumerating the Voronoi cell topologies that can arise under thermal perturbation of a structure of interest. We present an algorithm that deterministically enumerates all Voronoi cell topologies arising from generic infinitesimal perturbations of an arbitrary crystal structure, producing structural classifiers that extend automated identification to general crystalline systems. We demonstrate the approach on several structures of general interest.", "url": "https://arxiv.org/abs/2610.20498", "type": "理论+数值", "summary": "1. 针对原子模拟中晶体结构识别长期局限于少数简单构型的问题，该工作提出基于沃罗诺伊元胞拓扑的通用结构识别框架。\n2. 其关键技术点是给出确定性算法，枚举任意晶体结构在一般无穷小扰动下产生的所有沃罗诺伊元胞拓扑，并据此构造分类器以覆盖晶体与缺陷环境。\n3. 该策略把自动结构识别推广到更广泛的晶体体系，并为热扰动下复杂结构与缺陷环境的分类以及相关原子模拟的自动化分析提供可扩展思路。", "summary_source": "deepseek", "authors": [{"name": "Emanuel A. Lazar"}, {"name": "Chris H. Rycroft"}], "featured_authors": [{"name": "Emanuel A. Lazar"}, {"name": "Chris H. Rycroft"}], "author_count": 2}, {"id": "2610.20564", "category": "cond-mat", "title": "Exchange Interactions and Magnon Spectra in bcc Fe(001) Thin Films: A Computational Study", "abstract": "We combined density functional theory with atomistic spin dynamics to understand how surfaces influence magnon dispersion. For this purpose, we investigate thin layers of body-centered cubic iron and compare them with the bulk material. We present how the broken symmetry affects exchange interactions and magnon behavior. Our results reveal enhanced magnetic moments and exchange interactions for surface atoms compared to bulk Fe. The increase in exchange interaction integrals is mostly visible for first- and second-nearest neighbors. We also find a significant spread in exchange values within each coordination shell. Magnon dispersion analysis shows, for the layered system, pronounced band blurring, a significant reduction of maximum frequencies relative to the previously reported bulk values, and the emergence of a low-frequency band outside the \\g{}-point. Our study shows that relying on bulk exchange parameters introduces errors in the magnon spectra of ultrathin systems, underscoring the need for a detailed, system-specific approach.", "url": "https://arxiv.org/abs/2610.20564", "type": "理论+数值", "summary": "1. 该工作用密度泛函理论结合原子尺度自旋动力学，计算bcc Fe(001)薄膜的交换相互作用与磁振子谱，并与体相Fe对比以厘清表面对磁振子色散的影响。\n2. 其要点是表面原子磁矩与交换积分相对体相增强，主要体现于第一、第二近邻，且同一配位壳层内交换值显著分散；分层导致能带模糊、最大频率明显低于体相，并在Γ点之外出现低频支。\n3. 这表明沿用体相交换参数会给超薄体系的磁振子谱引入误差，凸显针对具体体系进行参数化的必要性。", "summary_source": "deepseek", "authors": [{"name": "Joanna Marciniak"}, {"name": "Wojciech Marciniak"}, {"name": "Jorge Luis Briseño-Gómez"}, {"name": "Jan Rusz"}], "featured_authors": [{"name": "Joanna Marciniak"}, {"name": "Wojciech Marciniak"}, {"name": "Jorge Luis Briseño-Gómez"}, {"name": "Jan Rusz"}], "author_count": 4}, {"id": "2610.20569", "category": "cond-mat", "title": "Droplets obstruct Onsager-type solutions of the Ising model in a magnetic field", "abstract": "Onsager solved the two-dimensional Ising model in zero field, but no solution is known in a magnetic field. We prove that in any dimension $d\\ge2$, at every fixed dimensionless field outside a countable set, the free energy obeys no algebraic differential equation in the coupling, even locally. The obstruction arises from droplet geometry: the maximal droplet volume grows as the $d/(d-1)$ power of its boundary size, while an integer band in the pressure coefficients protects the extremal contributions against cancellation. Our result excludes Onsager-type solutions and closed forms in elliptic, hypergeometric, or Painlevé functions of the coupling at these fields.", "url": "https://arxiv.org/abs/2610.20569", "type": "理论+数值", "summary": "1. 该工作证明，在任意维度 d≥2 且固定无量纲磁场偏离一个可数集时，Ising 模型自由能对耦合常数不满足任何代数微分方程，即使局部亦然。\n2. 其核心机制源于液滴几何：最大液滴体积随边界尺度以 d/(d−1) 次幂增长，而压力系数中的整数带保护极值贡献免于相消，从而排除 Onsager 型解。\n3. 这意味着在这些磁场下，自由能不可能关于耦合具有椭圆、超几何或 Painlevé 函数等闭合形式，并为含场 Ising 模型的可积性与解析结构研究划定了明确边界。", "summary_source": "deepseek", "authors": [{"name": "Ran Luo"}, {"name": "Jiahua Tian"}], "featured_authors": [{"name": "Ran Luo"}, {"name": "Jiahua Tian"}], "author_count": 2}, {"id": "2610.20595", "category": "cond-mat", "title": "Landau quantization of $C_3$ high-fold fermions in honeycomb lattices", "abstract": "We present the theory of the Landau levels of $C_3$ high-fold fermions in honeycomb lattices. These fermions arise as a generalization of the tight-binding model in a honeycomb lattice with one orbital per site, known to describe graphene, to a family of models with several orbitals per site transforming according to representations of $C_3$, relevant for triangulene two-dimensional crystals. The models are defined by the number of orbitals $n_a$ and $n_b$ at the $a$ and $b$ sites of the unit cell. They feature energy bands that combine flat bands and Dirac cones, that are isomorphic to those of graphene, the Lieb, $p_{xy}$ honeycomb, and the Kagome tight-binding models. Combining tight-binding and $k\\cdot p$ methods, here we compute the Landau levels of the $(1,1)$, $(1,2)$, $(2,2)$ and $(3,3)$ models, we compare them to those of the reference models, and we explore the similarities and differences with the Landau levels in graphene. Our findings reveal that the nature of $C_3$ high-fold fermions combine Dirac-type Landau quantization, originating from the linear crossings and associated relativistic band dispersion, with anomalous Landau quantization rooted in the quantum geometry of the singular flat bands.", "url": "https://arxiv.org/abs/2610.20595", "type": "理论", "summary": "1. 该工作建立了蜂窝晶格中C₃高重费米子的朗道能级理论，将单轨道石墨烯紧束缚模型推广到格点含多个按C₃表示变换轨道的模型，并用紧束缚与k·p方法计算(1,1)、(1,2)、(2,2)、(3,3)模型的朗道能级。\n2. 其核心卖点是这些模型能带同时含平带与狄拉克锥，并与石墨烯、Lieb、p_xy蜂窝及Kagome模型同构，使朗道量子化兼具线性交叉带来的狄拉克型和奇异平带量子几何导致的反常型。\n3. 这为三角烯二维晶体等C₃高重费米子体系提供了可检验的磁光与量子几何框架，并表明平带—狄拉克带耦合可产生区别于石墨烯的朗道能级结构。", "summary_source": "deepseek", "authors": [{"name": "Luisa Madail"}, {"name": "Joaquín Fernández-Rossier"}], "featured_authors": [{"name": "Luisa Madail"}, {"name": "Joaquín Fernández-Rossier"}], "author_count": 2}, {"id": "2610.18951", "category": "hep-th", "title": "BPS black holes in flat space from quantum mechanics", "abstract": "Despite extensive work on BPS black holes in 4d flat space, there is no direct microstate counting from D-brane quantum mechanics in regimes described by Einstein gravity. We derive an exact formula counting BPS configurations of the D-brane system corresponding to black holes in $N=8$ supergravity obtained from type II strings on $T^6$. As part of the derivation, we relate the BPS equations to a solvable modified Calogero-Moser system. The result agrees with the prediction from the modified elliptic genus of the D1-D5 system, providing a highly nontrivial test of the string dualities relating the two descriptions. We emphasize that this quantum mechanical system is, as a model of quantum black holes, simpler than BFSS and propose some numerical tests to explore this.", "url": "https://arxiv.org/abs/2610.18951", "type": "理论", "summary": "1. 该工作针对平直四维时空中BPS黑洞，从II型弦论在T^6上的紧化出发，在对应N=8超引力的D膜量子力学中推导出精确计数BPS位形的公式。\n2. 其核心卖点在于将BPS方程化为可解的修正Calogero-Moser系统，所得计数与D1-D5系统修正椭圆亏格预言一致，从而对相关弦对偶给出强检验。\n3. 作为量子黑洞模型，该量子力学体系比BFSS更简单，作者提出数值检验方案，并为平直空间BPS黑洞微观计数提供可操作路径。", "summary_source": "deepseek", "authors": [{"name": "Xiaoyi Shi"}, {"name": "Gustavo J. Turiaci"}], "featured_authors": [{"name": "Xiaoyi Shi"}, {"name": "Gustavo J. Turiaci"}], "author_count": 2}, {"id": "2610.18956", "category": "hep-th", "title": "Separation of gravitational perturbations of singly spinning Myers-Perry black holes", "abstract": "Gravitational perturbations of rotating black holes in higher dimensions generally obey coupled partial differential equations. We show that scalar gravitational perturbations invariant under rotations of the transverse sphere of a singly spinning Myers-Perry black hole separate, despite the obstruction to a decoupled Teukolsky equation. Two commuting, second-order angular operators organise the three gauge-invariant curvature components into joint eigenfunctions. The physical radial problem is a $2\\times2$ first-order system, equivalent to a single second-order equation. This gives a separation of the sector containing both the bar-mode and axisymmetric ultraspinning instabilities. Using only ordinary differential equations, we compute the bar-mode quasinormal spectrum in $d=5,6,7$ and find instability onsets at $a/r_+=0.90498$ and $0.83228$ in $d=6,7$. We also compute the growing axisymmetric modes and their onset rotations in $d=6,\\ldots,9$. The construction shows how separability can survive the coupling between gravitational polarisations.", "url": "https://arxiv.org/abs/2610.18956", "type": "理论", "summary": "1. 该工作围绕《Separation of gravitational perturbations of singly spinning Myers-Perry black holes》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Jorge E. Santos"}], "featured_authors": [{"name": "Jorge E. Santos"}], "author_count": 1}, {"id": "2610.18959", "category": "hep-th", "title": "Arithmetic of Duality Defects in 4d Maxwell Theory", "abstract": "We study the arithmetic structure of non-invertible duality defects in 4d $U(1)$ Maxwell theory. First, we recast the problem of realizing an elliptic $SL(2,\\mathbb{Q})$ transformation as a duality defect in terms of complex multiplication for two-tori. The resulting classification includes well-studied cases in the literature, but extends to infinite Diophantine families of defects at a given gauge coupling. Second, we describe their worldvolume theories explicitly, with the Chern--Simons couplings determined by using continued fractions and tridiagonal continuant matrices. Third, we work out the fusion products of these defects, extracting the condensation defects and decoupled sectors both by lattice arithmetic and from the worldvolume descriptions. Finally, we illustrate our findings with the familiar $N$-ality defects (with $N=2,3$), but also give examples of infinite order.", "url": "https://arxiv.org/abs/2610.18959", "type": "理论", "summary": "1. 该工作研究四维 U(1) Maxwell 理论中非可逆对偶缺陷的算术结构，将椭圆 SL(2,Q) 变换实现为对偶缺陷的问题转化为二维环面复乘，并据此分类、描述世界体积理论并计算融合积。\n2. 其技术核心是用复乘完成分类，并将给定规范耦合下的缺陷扩展至无限丢番图族，同时以连分数和三对角 continuant 矩阵确定 Chern-Simons 耦合，且从格算术和世界体积两侧提取凝聚缺陷与解耦扇区。\n3. 这为理解四维非可逆对偶缺陷的融合代数提供了算术框架；N-ality 与无限阶实例可作为检验，并可能启发数论、拓扑场论与弦论中的相关构造。", "summary_source": "deepseek", "authors": [{"name": "Damian van de Heisteeg"}, {"name": "Ling Lin"}, {"name": "Giacomo Maggiorotti"}], "featured_authors": [{"name": "Damian van de Heisteeg"}, {"name": "Ling Lin"}, {"name": "Giacomo Maggiorotti"}], "author_count": 3}, {"id": "2610.18963", "category": "hep-th", "title": "The simplest event shape in $\\mathcal{N}=4$ super Yang--Mills", "abstract": "We study two-point event shapes in planar $\\mathcal{N}=4$ super Yang--Mills, with source, sink and detectors given in terms of half-BPS scalars and their light transforms. Akin to local correlation functions, at order by order in perturbation theory, in the large charge limit, this event shape factorizes into the product of two octagons evaluated on the unit circle. Borrowing the octagon results, we study its behavior with respect to the coupling and the angle between the detectors.", "url": "https://arxiv.org/abs/2610.18963", "type": "理论", "summary": "1. 该工作在平面 N=4 超对称杨-米尔斯理论中研究了由半 BPS 标量及其光变换定义源、汇与探测器的两点事件形状，即最简事件形状。\n2. 其核心贡献在于：在逐阶微扰与大荷极限下，该事件形状类似局域关联函数，可分解为两个八边形在单位圆上的乘积，并借助已有八边形结果分析其对耦合常数和探测器夹角的依赖。\n3. 这为利用可积八边形数据研究规范理论中的事件形状提供了范例，并启示人们在更一般情形下寻找类似因子化结构及可观测的角度依赖。", "summary_source": "deepseek", "authors": [{"name": "Carlos Bercini"}, {"name": "Sidhaarth Kumar"}], "featured_authors": [{"name": "Carlos Bercini"}, {"name": "Sidhaarth Kumar"}], "author_count": 2}, {"id": "2610.18987", "category": "hep-th", "title": "Thermal Giant Graviton Expansion", "abstract": "We construct giant graviton expansions of the thermal and $(-1)^F$-graded partition functions of $\\mathcal{N}=4$ and $\\mathcal{N}=1$ super Yang-Mills theories at zero 't Hooft coupling. These observables are generically non-BPS and do not admit a direct bulk interpretation in a supergravity regime. Instead, we exploit the corresponding self-dual theories, which arise as chiral zero-coupling limits and admit twistor string holographic duals. We apply a quiver generalization of Murthy's expansion motivated by twistor strings. Notably, we obtain expansions at both finite and infinite $N$. We reproduce the terms in these expansions from bulk closed string and D-brane sectors, identifying the nonperturbative corrections with D-instanton/anti-D-instanton pairs. At infinite $N$, resumming the D-instanton sectors reproduces the Hagedorn temperatures of the free gauge theories, providing a microscopic bulk origin for their Hagedorn singularities.", "url": "https://arxiv.org/abs/2610.18987", "type": "理论", "summary": "1. 该工作构造了零 't Hooft 耦合下 N=4 与 N=1 超对称杨-米尔斯理论热配分函数和 (-1)^F 分级配分函数的巨引力子展开。\n2. 其卖点在于用箭图推广的 Murthy 展开处理非 BPS 量，并在有限与无限 N 下与体闭弦和 D-膜扇区逐项匹配。\n3. 该结果把自由规范理论的 Hagedorn 奇点归因于无限 N 下 D-瞬子对扇区求和，为热场论与扭量弦对偶提供微观体解释与后续启发。", "summary_source": "deepseek", "authors": [{"name": "Kasia Budzik"}, {"name": "Atul Sharma"}], "featured_authors": [{"name": "Kasia Budzik"}, {"name": "Atul Sharma"}], "author_count": 2}, {"id": "2610.18993", "category": "hep-th", "title": "Monopoles on the edge", "abstract": "Quantum M2-brane instantons are studied in eleven-dimensional Freund-Rubin backgrounds. The construction uses the identification of the Calabi-Yau cone over the Sasaki-Einstein manifold $\\mathrm{SE}_7$ with the geometric branch of the abelian moduli space of the dual superconformal field theory. A class of BPS cycles in $\\mathrm{SE}_7$ wrapped by M2-branes is identified as links of two-dimensional holomorphic cones whose coordinate rings contain BPS monopole operators. The algebraic structure and R-charge assignment on the moduli space further allow the computation of both the classical exponents and one-loop partition functions of the corresponding M2-brane instantons. Several three-dimensional superconformal field theories are analysed explicitly, and the relation to the corresponding localisation matrix models is discussed.", "url": "https://arxiv.org/abs/2610.18993", "type": "理论", "summary": "1. 该工作在十一维弗罗因德-鲁宾背景中研究量子M2膜瞬子，并借助萨斯基-爱因斯坦七维流形上的卡拉比-丘锥与对偶超共形场论阿贝尔模空间几何分支的对应来构造瞬子。\n2. 其关键在于把M2膜包裹的一类BPS闭链识别为二维全纯锥的链环，并由坐标环中的BPS磁单极算子确定模空间的代数结构与R荷，进而计算瞬子的经典指数和单圈配分函数。\n3. 该框架显式分析若干三维超共形场论并讨论其与局域化矩阵模型的关系，为M2膜瞬子、磁单极算子及全息对偶的非微扰效应提供了可计算且可检验的路径。", "summary_source": "deepseek", "authors": [{"name": "Stefan A. Kurlyand"}], "featured_authors": [{"name": "Stefan A. Kurlyand"}], "author_count": 1}, {"id": "2610.19078", "category": "hep-th", "title": "Coherent states of neutrinos in rotating matter", "abstract": "We study coherent states of neutrinos electroweakly interacting with rotating matter. We start with the Dirac equation for a massive neutrino propagating in background matter with a coordinate dependent effective potential. Then, we consider the limit of massless particles and the specific matter velocity profile. It allows us to reduce the neutrino Hamiltonian to the harmonic oscillator form. We find the exact solutions of the Dirac equation and construct the creation and annihilation operators. Using these results, we build the generalized coherent states of neutrinos. We provide the interpretation of these coherent states in terms of the classical physics. In particular, we demonstrate that the coherent states constructed approach plane waves in the limit of slow matter rotation. We also define the effective neutrino mass owing to the interaction of a massless neutrino with rotating matter. Then, we consider a special case of the generalized coherent states which are called the neutrino coherent states. The situation of the degenerate parameters of the system is also studied. Finally, we apply our results for astrophysical neutrinos propagating in dense matter of a rapidly rotating neutron star (NS). We calculate the effective neutrino masses for different neutrino energies for realistic parameters of NS.", "url": "https://arxiv.org/abs/2610.19078", "type": "理论", "summary": "1. 该工作研究旋转物质中中微子的电弱相互作用，从含坐标依赖有效势的背景物质中质量中微子狄拉克方程出发，在无质量极限与特定物质速度剖面下精确求解并构造广义相干态。\n2. 其核心卖点是将中微子哈密顿量约化为谐振子形式，得到精确解与产生湮灭算符，给出经典物理解释，并证明慢旋转极限下相干态趋于平面波，同时由旋转物质相互作用定义有效中微子质量。\n3. 该框架可直接应用于致密快速旋转中子星中的天体物理中微子，并按不同能量与真实中子星参数计算有效质量，为旋转环境中的中微子传播与振荡研究提供启示。", "summary_source": "deepseek", "authors": [{"name": "Alexander Breev"}, {"name": "Maxim Dvornikov"}], "featured_authors": [{"name": "Alexander Breev"}, {"name": "Maxim Dvornikov"}], "author_count": 2}, {"id": "2610.19130", "category": "hep-th", "title": "Kinetic Equations and Turbulence in Large $N$ Vector and SYK-like Models", "abstract": "We apply large $N$ expansion techniques to derive kinetic equations for strongly coupled, far-from-equilibrium field theories with $O(N)$ symmetry. For large $N$ vector models, the quasi-classical approximation holds. Incorporating arbitrary momentum-dependent interactions, we show the dynamics obey the standard kinetic equation, with the scattering amplitude given by the retarded propagator of the auxiliary Hubbard-Stratonovich field. This has broad applications to systems like spin wave and Langmuir ion-acoustic turbulence. For large $N$ random coupling (SYK-like) models in $d$ dimensions, leading-order melon diagrams induce order-one propagator renormalization and finite spectral width. The corresponding kinetic equation, unlike those for standard weakly interacting systems, does not have a local-in-time collision integral. We find evidence for a stationary, scale-invariant infrared solution, revealing a potentially novel strong turbulence scaling exponent.", "url": "https://arxiv.org/abs/2610.19130", "type": "理论", "summary": "1. 该工作围绕《Kinetic Equations and Turbulence in Large $N$ Vector and SYK-like Models》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Vladimir Rosenhaus"}, {"name": "Daniel Schubring"}], "featured_authors": [{"name": "Vladimir Rosenhaus"}, {"name": "Daniel Schubring"}], "author_count": 2}, {"id": "2610.19149", "category": "hep-th", "title": "Infrared-Finite Positivity Bounds in 4D Gravity", "abstract": "We formulate an S-matrix bootstrap in an exactly flat half-space, where boundary reflection provides geometric infrared control for four-dimensional gravity. Under the channel positivity conditions, we obtain an infrared-finite positivity bound on local four-scalar Wilson coefficients that includes a finite gravitational correction of order $G_N$ and is derived from the full UV absorptive spectrum without specifying a UV theory, imposing a spectral ansatz, requiring weak coupling or expanding the spectrum perturbatively. At fixed dimensionless external state parameters, the coefficient of the leading gravitational correction is independent of the EFT scale and requires neither an arbitrary soft resolution scale nor a model-dependent UV scale. Gaussian wave-packet scattering localizes interactions within the flat region and directly probes bulk Wilson coefficients while exponentially suppressing sensitivity to the boundary. Long-range gravitons remain sensitive to the boundary and give a finite contribution. The smearing functional passes numerical positivity tests with general half-space absorptive kernels in both crossed channels. An explicit string example shows how boundary reflection suppresses the collective contribution of string resonances to the absorptive part of the amplitude, connecting infrared control of low-energy scattering to the UV spectrum of quantum gravity in the same dispersion relation. The framework opens a route to infrared-finite constraints on effective interactions across particle physics and gravity.", "url": "https://arxiv.org/abs/2610.19149", "type": "理论", "summary": "1. 该工作围绕《Infrared-Finite Positivity Bounds in 4D Gravity》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Ziyu Dong"}], "featured_authors": [{"name": "Ziyu Dong"}], "author_count": 1}, {"id": "2610.19172", "category": "hep-th", "title": "One-Loop Renormalization of Spin-$1/2$ SOPHIES", "abstract": "In this paper, three formulations of spin-$1/2$ Second-Order Pseudo-Hermitian quantum field theorIES (SOPHIES) are built from scratch from parity eigenstates. Pseudo-Hermiticity allows the unconstrained fields to satisfy either Fermi--Dirac or Bose--Einstein statistics, while self-conjugate Majorana-like fields are only compatible with Fermi--Dirac. The set of independent four dimension renormalizable self-interactions of the three theories are identified, and the one-loop renormalization of the unconstrained fermionic and bosonic theories coupled to an abelian gauge boson and enhanced with a Pauli term and including self-interactions is studied, together with the one-loop renormalization of the only independent quartic self-interaction of self-conjugate fields. The analysis leads to a rich set of Renormalization Group Equations with deep connections to known theories, like the Dirac formalism and the Klein--Gordon scalar through the fixed points of the Pauli coupling.", "url": "https://arxiv.org/abs/2610.19172", "type": "理论", "summary": "1. 该工作从宇称本征态出发构建了三种自旋-1/2二阶赝厄米量子场论，并对其单圈重整化进行了系统分析。\n2. 核心是未约束场可满足费米或玻色统计、自共轭Majorana型仅兼容费米，并给出耦合阿贝尔规范玻色子与Pauli项时的单圈重整化群方程。\n3. 所得方程通过Pauli耦合不动点与Dirac形式及Klein-Gordon标量等已知理论深刻关联，为后续模型构建与实验检验提供线索。", "summary_source": "deepseek", "authors": [{"name": "I. Díaz-Saldanña"}, {"name": "A. Gutiérrez-Rodríguez"}, {"name": "Armando de la C. Rangel-Pantoja"}, {"name": "Carlos A. Vaquera-Araujo"}], "featured_authors": [{"name": "I. Díaz-Saldanña"}, {"name": "A. Gutiérrez-Rodríguez"}, {"name": "Armando de la C. Rangel-Pantoja"}, {"name": "Carlos A. Vaquera-Araujo"}], "author_count": 4}, {"id": "2610.19258", "category": "hep-th", "title": "Quantum Residues and the Geometry of Perturbative/Non-perturbative Relations", "abstract": "We develop a systematic, Whitham-based construction of perturbative/non-perturbative (P/NP) relations for one-dimensional quantum mechanical systems admitting a genus-one WKB period description, and derive a higher-genus formulation under explicit regularity assumptions. We select external deformations that preserve the independent quantum residues and lift them by varying the internal moduli so that the independent perturbative quantum periods remain fixed. The Riemann bilinear identity then determines the induced evolution of the non-perturbative periods through local residue pairings and the inverse period Jacobian. At genus one, this reduces to a relation between the flow of the non-perturbative quantum period and the energy derivative with respect to the perturbative action, providing a constructive connection between the Rayleigh-Schrödinger expansion and fluctuations around non-perturbative saddles. We recover known P/NP relations and derive extensions for explicitly coupling-dependent potentials, which we verify at the computed orders through independent perturbative and non-perturbative period calculations for quantum-corrected quartic and Jacobi elliptic examples.", "url": "https://arxiv.org/abs/2610.19258", "type": "理论", "summary": "1. 该工作以Whitham方法系统构造一维量子力学体系的微扰/非微扰（P/NP）关系，并在显式正则性假设下导出高亏格表述。\n2. 其核心是选取保持独立量子留数不变的外形变、固定独立微扰周期，再用Riemann双线性恒等式经局部留数配对与周期Jacobian逆导出非微扰周期的演化。\n3. 亏格一时该关系给出非微扰量子周期流与能量对微扰作用量导数间的联系，将Rayleigh-Schrödinger展开与非微扰鞍点涨落关联，并在量子修正四次势与Jacobi椭圆例中验证。", "summary_source": "deepseek", "authors": [{"name": "Can Kozçaz"}], "featured_authors": [{"name": "Can Kozçaz"}], "author_count": 1}, {"id": "2610.19286", "category": "hep-th", "title": "Mutual Information of Measurement in Conformal Field Theories", "abstract": "The mutual information of measurement of a local operator between two spatial regions characterizes the reduction in the uncertainty of measurement outcomes in one region given the outcome in the other. We study the Rényi-Shannon mutual information of measurement in conformal field theories (CFTs). Explicit calculations for scalar primaries and descendants in large $N$ CFTs are performed in the two extreme limits of the intervals being adjacent or largely separated. The results depend on only the cross ratio and the scaling dimension $\\Delta$ of the operator being measured, with striking similarities to the mutual information of entanglement. We find a surprising quadratic dependence as $(\\Delta-1/2)^2$ for adjacent intervals. This dependence superficially seems to violate the information processing inequality, which we discuss and resolve. We also offer a holographic interpretation of the mutual information of measurement.", "url": "https://arxiv.org/abs/2610.19286", "type": "理论", "summary": "1. 该工作在共形场论中定义了局域算符测量的 Renyi-Shannon 互信息，并在大 N 标量主算子及其后代情形下，计算两空间区间相邻与远离两种极限。\n2. 其核心结果是测量互信息仅由交比和算符标度维数 Δ 决定，与纠缠互信息高度相似；相邻区间呈现 (Δ−1/2)^2 的二次依赖，表面似违背信息处理不等式，作者对此进行讨论并化解，同时给出全息解释。\n3. 这为理解测量诱导的关联、检验信息处理不等式在 CFT 中的适用性，以及在全息框架下统一描述测量与纠缠提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Israel Klich"}, {"name": "Ravisankar Rajagopal"}, {"name": "Diana Vaman"}], "featured_authors": [{"name": "Israel Klich"}, {"name": "Ravisankar Rajagopal"}, {"name": "Diana Vaman"}], "author_count": 3}, {"id": "2610.19418", "category": "hep-th", "title": "Linear stability matrix and Lyapunov exponents for stationary spacetime", "abstract": "Lyapunov exponents characterize the average rate at which nearby trajectories in phase space converge or diverge and therefore provide a useful criterion for dynamical stability. In this work, we develop a general framework for analyzing Lyapunov exponents in stationary spacetimes and extend previous studies beyond circular orbits. For a generic stationary spacetime described by $g_{\\mu\\nu}(r,\\theta)$, we show that the phase space relevant to linear perturbations is spanned by $(r,p_r,\\theta,p_\\theta)$ and the corresponding linear stability matrix has rank four. When the spacetime admits a rank-2 Killing tensor, the linear stability matrix can be reduced to a block-diagonal form, allowing the Lyapunov exponents to be obtained analytically. By imposing the appropriate constraint conditions, the formalism further yields the linear stability matrices and Lyapunov exponents for circular and spherical orbits. The validity of the method is illustrated by several representative examples, including the (inverted) harmonic oscillator, planar Kepler motion, and particle motion in Schwarzschild and Kerr spacetimes. These results provide a unified framework for investigating the stability properties of particle orbits in both classical and relativistic dynamical systems.", "url": "https://arxiv.org/abs/2610.19418", "type": "理论", "summary": "1. 该工作建立了在一般稳态时空中分析李雅普诺夫指数的统一框架，将此前限于圆轨道的结果推广到由径向坐标、径向动量、极角与角动量张成的四维线性微扰相空间。\n2. 其核心是证明相应线性稳定性矩阵秩为四，并在存在二阶基灵张量时化为块对角形式以解析求得李雅普诺夫指数，同时通过约束条件统一导出圆轨道与球面轨道的结果。\n3. 该方法经谐振子、平面开普勒运动以及史瓦西和克尔时空中的粒子运动验证，为经典与相对论动力学中轨道稳定性研究提供了可推广的判据与统一语言。", "summary_source": "deepseek", "authors": [{"name": "Xu Ye"}, {"name": "Shao-Wen Wei"}], "featured_authors": [{"name": "Xu Ye"}, {"name": "Shao-Wen Wei"}], "author_count": 2}, {"id": "2610.19485", "category": "hep-th", "title": "Gauge-invariant nonperturbative Wilson action in quantum electrodynamics II", "abstract": "The gradient flow exact renormalization group (GFERG) is a formulation of the exact renormalization group for gauge theories that provides a renormalization group flow preserving the gauge Ward--Takahashi identity exactly. In this paper, we nonperturbatively solve the GFERG flow equation for the simplest nontrivial gauge-invariant Wilson action, introduced in a previous paper, for $D$-dimensional quantum electrodynamics with~$N_f$ flavors (for all~$D$, flavors are counted in units of four-component spinors). For $D=3$ and~$D=2$, a nontrivial infrared fixed point exists even for~$N_f=1$, and the structure of the critical exponents at the fixed point is qualitatively the same as that in the large-$N_f$ limit. We also obtain the gauge-field propagator in the continuum limit; for~$D=2$, it reproduces the dynamical mass of the Schwinger model within a few percent. To the best of our knowledge, apart from the large-$N_f$ approximation, this is the first example in which the Wilson renormalization group in a gauge theory is solved nonperturbatively while manifestly preserving gauge symmetry.", "url": "https://arxiv.org/abs/2610.19485", "type": "理论", "summary": "1. 该工作围绕《Gauge-invariant nonperturbative Wilson action in quantum electrodynamics II》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Sorato Nagao"}, {"name": "Hiroshi Suzuki"}], "featured_authors": [{"name": "Sorato Nagao"}, {"name": "Hiroshi Suzuki"}], "author_count": 2}, {"id": "2610.19522", "category": "hep-th", "title": "Nambu's Dynamics, Strings and Gravitized Quantum Theory", "abstract": "In this article we present a new view on string theory that is rooted in quantum foundations extended to the domain of quantum gravity in the form of gravitized quantum theory, in which the canonical probability measure captured by the Born rule of quantum theory, turns out to be dynamical and contextual. We claim that this gravitization of quantum theory is the essence of string theory. String theory, according to this view, originates in foundations of quantum theory and Nambu's dynamics, which features in the non-perturbative definition of string theory in terms of a T-duality covariant and non-commutative formulation, called the metastring. Nambu's dynamics and the associated cubic and hypercubic objects also appear as the natural language for exploring the new observables and phenomena implied by a dynamical Born rule, including triple and higher order quantum interference, that can be investigated in experiments involving massive quantum probes, and that are also needed for direct empirical tests of the Born rule, a cornerstone of quantum theory.", "url": "https://arxiv.org/abs/2610.19522", "type": "理论", "summary": "1. 该文提出将弦论植根于量子基础与“引力化量子理论”的新观点，主张Born规则概率测度具有动力学与情境性。\n2. 技术卖点是以Nambu动力学和T对偶协变、非交换的metastring实现弦论非微扰表述，并导出动力学Born规则下的高阶干涉。\n3. 这为利用大质量量子探针检验动力学Born规则及三阶以上干涉提供了可实验检验的启示，并联系量子基础与量子引力。", "summary_source": "deepseek", "authors": [{"name": "Tristan Hübsch"}, {"name": "Djordje Minic"}], "featured_authors": [{"name": "Tristan Hübsch"}, {"name": "Djordje Minic"}], "author_count": 2}, {"id": "2610.19634", "category": "hep-th", "title": "Catalan polynomials for the Wishart-Laguerre $β$-ensemble", "abstract": "By means of $W$-representation, we investigate the Wishart-Laguerre $\\beta$-ensemble and present a compact expression for Catalan polynomials. For a special Nekrasov partition function associated with the Wishart-Laguerre $\\beta$-ensemble, we show that it can be expressed as a exponential form of the special Catalan polynomials. Furthermore, we make a rule to calculate the Catalan polynomials by means of Feynman diagrams and present another expression for Catalan polynomials. We also establish the connection between certain Catalan polynomials and knot theory.", "url": "https://arxiv.org/abs/2610.19634", "type": "理论", "summary": "1. 该工作利用W-表示研究Wishart-Laguerre β-系综，给出了Catalan多项式的紧凑表达式，并考察了与之相关的特殊Nekrasov配分函数。\n2. 其核心在于证明该配分函数可写成特定Catalan多项式的指数形式，并建立用Feynman图计算Catalan多项式的规则及另一表达式，同时揭示其与纽结理论的联系。\n3. 这为β-系综、Nekrasov配分函数、Feynman图展开与纽结不变量之间的跨领域联系提供了可操作的代数组合框架，并可能启发后续在随机矩阵与拓扑场论交叉方向的研究。", "summary_source": "deepseek", "authors": [{"name": "Bei Kang"}, {"name": "Lu-Yao Wang"}, {"name": "Ke Wu"}, {"name": "Wei-Zhong Zhao"}], "featured_authors": [{"name": "Bei Kang"}, {"name": "Lu-Yao Wang"}, {"name": "Ke Wu"}, {"name": "Wei-Zhong Zhao"}], "author_count": 4}, {"id": "2610.19963", "category": "hep-th", "title": "The stability of non-Abelian $A_4$ vortices in $SO(3)$ gauge theory", "abstract": "We study the linear energetic stability of non-Abelian vortices in an $SO(3)$ gauge-Higgs theory with residual gauge group $A_4$. In our previous work, we identified two families of such vortices associated with order-two and order-three elements of $A_4$, and found Bogomol'nyi--Prasad--Sommerfield-like behavior at special ratios of the Higgs and gauge-boson mass scales. Here, we investigate their stability against $SO(3)$ gauge and Higgs perturbations by analyzing the second order variation of the vortex tension using analytical and numerical methods. In particular, when all relevant mass scales are equal, we prove linear stability for all vortices in the order-three family. By contrast, at the same mass point, we prove that a vortex in the order-two family is unstable. Thus, although both vortex families exhibit Bogomol'nyi--Prasad--Sommerfield-like behavior in their reduced equations at this mass point, their stability properties in the full $SO(3)$ theory are qualitatively different.", "url": "https://arxiv.org/abs/2610.19963", "type": "理论", "summary": "1. 该工作分析了残留规范群为A4的SO(3)规范-希格斯理论中非阿贝尔涡旋的线性能量稳定性，通过解析与数值方法计算涡旋张力在规范场和希格斯场扰动下的二阶变分。\n2. 关键结果是在所有相关质量标度相等时，证明三阶元素族涡旋全部线性稳定，而二阶元素族中的一个涡旋不稳定，表明约化方程中的BPS型行为不足以决定全SO(3)理论中的稳定性。\n3. 这一差异表明，BPS型约化行为不能保证完整SO(3)理论中的稳定性，提示后续需基于完整微扰谱重新审视不同A4涡旋族的稳定性分类。", "summary_source": "deepseek", "authors": [{"name": "Yoshihiko Abe"}, {"name": "Tetsutaro Higaki"}, {"name": "Kazuya Murakami"}, {"name": "Muneto Nitta"}, {"name": "Ryo Yokokura"}], "featured_authors": [{"name": "Yoshihiko Abe"}, {"name": "Tetsutaro Higaki"}, {"name": "Kazuya Murakami"}, {"name": "Muneto Nitta"}, {"name": "Ryo Yokokura"}], "author_count": 5}, {"id": "2610.20180", "category": "hep-th", "title": "Finite Modular Hamiltonians and Their Singular Limits", "abstract": "Using the open solid torus as a finite parent, we revisit modular flow for spherical regions in conformal field theory. Its nonsingular angular evolution gives finite modular generators in a very simple form, while an exact conformal map to a cavity frame recovers the Rindler, CHM, and stationary-source ball constructions as singular limits. The same finite parent also provides a regular completion of the center obstruction in the complexified ball flow. Charged, Dirac, and inhomogeneous scalar examples are given.", "url": "https://arxiv.org/abs/2610.20180", "type": "理论", "summary": "1. 该工作以开实心环体为有限母体，重新考察共形场论中球形区域的模流，并给出有限形式的模生成元。\n2. 其关键卖点是：非奇异的角向演化使模哈密顿量形式极简，而到腔体坐标系的精确共形映射把Rindler、CHM和稳态源球构造统一为奇异极限，并正则地补全复化球流中的中心障碍。\n3. 带荷、狄拉克与非均匀标量实例显示，该有限母体可作为统一正则化框架，为相关奇异极限及后续模流研究提供具体出发点。", "summary_source": "deepseek", "authors": [{"name": "Panyinyan Li"}, {"name": "Jun Tao"}, {"name": "Haitang Yang"}], "featured_authors": [{"name": "Panyinyan Li"}, {"name": "Jun Tao"}, {"name": "Haitang Yang"}], "author_count": 3}, {"id": "2610.20301", "category": "hep-th", "title": "Realisation of de Sitter space as an excited state in string theory", "abstract": "String theory is widely regarded as the only plausible candidate for a consistent UV-complete theory of quantum gravity. Cosmological observations suggest that our universe is undergoing accelerated expansion, pointing towards the presence of a small positive cosmological constant. Since de Sitter space is the maximally symmetric solution of Einstein's equations with a positive cosmological constant, understanding whether four-dimensional de Sitter space can be realized within string theory has become one of the central questions. Following a series of works that realize de Sitter space as an excited state---namely, as a Glauber--Sudarshan (GS) state in type IIB string theory---our goal has been to extend such a construction to heterotic string theories. Realizing de Sitter space as an excited state over a time-independent supersymmetric Minkowski background provides a mechanism for evading the vacuum-based no-go theorems that obstruct de Sitter solutions in string theory. Starting from a generic M-theory configuration, we obtain four-dimensional de Sitter space in the late-time limit of flat-slicing coordinates in both heterotic $SO(32)$ and heterotic $E_8 \\times E_8$ theories through appropriate dynamical duality sequences. The corresponding GS state is constructed by evaluating the expectation value of the metric operator in M-theory using path-integral techniques. We analyse the conditions required for the existence of a well-defined effective field theory description of the setup and find that these conditions are equivalent to satisfying the null energy condition in a 3+1-dimensional FLRW cosmology. Furthermore, the de Sitter GS states are found to lie well within the temporal bound imposed by the Trans-Planckian Censorship Conjecture, rendering them as transient states. In the case of $E_8\\times E_8$ theory, we also investigate implications arising from axion cosmology.", "url": "https://arxiv.org/abs/2610.20301", "type": "理论", "summary": "1. 该工作在杂化SO(32)与E8×E8弦论中，经M理论构型与动力学对偶序列，把四维de Sitter空间实现为GS激发态。\n2. 关键机制是将其构造为时间无关超对称Minkowski背景上的激发态，绕开基于真空的no-go定理，并用路径积分求度规算符期望值。\n3. 该GS态满足TCC的时间上限而呈瞬态，其有效场论自洽条件等价于3+1维FLRW满足零能量条件，并关联E8×E8的轴子宇宙学。", "summary_source": "deepseek", "authors": [{"name": "Archana Maji"}], "featured_authors": [{"name": "Archana Maji"}], "author_count": 1}, {"id": "2610.20340", "category": "hep-th", "title": "Black hole cohomologies in N=4 SYM", "abstract": "We systematically investigate BPS cohomologies of $\\mathcal{N}=4$ super-Yang-Mills (SYM) theory with gauge group SU$(N)$ with $N=2, 3, 4$, focusing primarily on the BMN sector. We find non-Coulomb graviton cohomologies for $N>2$. For $N>2$, the lightest black hole cohomology in the BMN sector always carries non-trivial $R$-charge and corresponds to the brane-fused type. Therefore, the `core' black holes without hair are `heavier'. We also find that a family of brane-fused cohomologies in $N=3$ is not lifted at the first quantum order. At a fixed charge sector, gravitons carry definite parity under charge conjugation. Up to the levels we have tested, every black hole cohomology either has opposite parity to that of gravitons or is lifted by quantum corrections. We conjecture that black hole cohomologies always carry parity opposite to gravitons in the same charge sector.", "url": "https://arxiv.org/abs/2610.20340", "type": "理论", "summary": "1. 该文系统计算N=4 超杨-米尔斯理论中SU(N)（N=2,3,4）的BPS上同调，主要聚焦BMN扇区。\n2. 发现N>2有非库仑引力子上同调，最轻黑洞上同调带非零R荷且属膜融合型，故无毛核心黑洞更重；N=3一族首阶量子不提升。\n3. 作者猜测同一电荷扇区黑洞上同调宇称总与引力子相反，为区分黑洞微态与引力子及检验量子修正提供普适判据。", "summary_source": "deepseek", "authors": [{"name": "Seunggyu Kim"}, {"name": "Jehyun Lee"}, {"name": "Siyul Lee"}, {"name": "Jaewon Song"}], "featured_authors": [{"name": "Seunggyu Kim"}, {"name": "Jehyun Lee"}, {"name": "Siyul Lee"}, {"name": "Jaewon Song"}], "author_count": 4}, {"id": "2610.20368", "category": "hep-th", "title": "Degeneracy graph determinants and higher-dimensional Young diagrams", "abstract": "Kemp and Ramgoolam proposed a basis of monomials for a commutative semisimple algebra with generators \\(C_1,\\ldots, C_L\\), constructed from a degeneracy graph which records how the eigenspaces of \\( C_1\\) are successively split by \\( C_2,\\ldots, C_L\\). They showed that the basis property is equivalent to the non-vanishing of the determinant of the matrix of values of these monomials on the projector basis, and conjectured a factorised formula for this determinant, as a product of powers of eigenvalue differences. We prove this formula for any number of generators. The proof uses graph analogues of Newton polynomials. Their evaluation matrix is not triangular in general, but expanding the rows of the children of each node of the penultimate layer in a Newton basis of their eigenvalues makes it block triangular, with diagonal blocks given by smaller degeneracy graphs in which the final layer is removed. The formula then follows by induction on the number of layers. We show that the exponents in the determinant are overlap volumes of higher-dimensional Young diagrams attached to the nodes of the graph: intervals, ordinary Young diagrams, plane partitions and their higher analogues. Finally, the block triangular structure gives an explicit recursive inversion of the evaluation matrix, expressing the projectors in the monomial basis.", "url": "https://arxiv.org/abs/2610.20368", "type": "理论", "summary": "1. 该工作证明了Kemp与Ramgoolam的简并图行列式猜想：对任意数量生成元，单项式在投影基上的取值矩阵行列式可按本征值差幂因子化。\n2. 其核心是用图的牛顿多项式类比，将一般非三角的求值矩阵在倒数第二层各节点的子节点行上按本征值牛顿基展开成块三角；对角块为删去末层的较小简并图，故可对层数归纳。\n3. 行列式指数被识别为节点所附高维杨图的交叠体积（区间、杨图、平面分拆及其推广），块三角结构还给出求值矩阵的递归求逆，将投影算子表为单项式。", "summary_source": "deepseek", "authors": [{"name": "Sanjaye Ramgoolam"}, {"name": "Michał Studziński"}], "featured_authors": [{"name": "Sanjaye Ramgoolam"}, {"name": "Michał Studziński"}], "author_count": 2}, {"id": "2610.20493", "category": "hep-th", "title": "Giant Wilson loops from Fredholm determinants", "abstract": "We study large-k symmetric and antisymmetric Wilson loops in N=4 super-Yang-Mills theory. We represent their generating functions as Fredholm determinants built from the Hermite kernel weighted by a symbol function that encodes the representation. Using the integrable structure of the kernel, we systematically apply the Tracy-Widom approach to derive a closed system of integro-differential equations. The equations are then solved order by order in 1/N by a WKB ansatz, while keeping the symbol function general. We find a closed-form expression for the leading and subleading order contributions to the generating functions. Finally, specializing to the two representations, we perform the large-k saddle-point analysis and find the subleading contribution to the Wilson loop. Our results confirm the previously observed discrepancies with the dual D-brane description of giant Wilson loops.", "url": "https://arxiv.org/abs/2610.20493", "type": "理论", "summary": "1. 该文把 N=4 超杨-米尔斯理论中大 k 对称与反对称威尔逊圈的生成函数写成由表示符号函数加权的厄米核弗雷德霍姆行列式。\n2. 其卖点是在保持符号函数一般的同时，借核的可积结构用特雷西-维多姆方法导出闭积分微分方程组，并以半经典拟设逐阶求解 1/N，给出领头与次领头闭式表达式。\n3. 对两种表示做大 k 鞍点分析得到威尔逊圈次领头修正，确认了与巨威尔逊圈对偶 D 膜描述的既有偏差，提示需澄清全息对应。", "summary_source": "deepseek", "authors": [{"name": "Ludvig Chen"}, {"name": "Victor Mishnyakov"}, {"name": "Konstantin Zarembo"}], "featured_authors": [{"name": "Ludvig Chen"}, {"name": "Victor Mishnyakov"}, {"name": "Konstantin Zarembo"}], "author_count": 3}, {"id": "2610.20535", "category": "hep-th", "title": "Thermal AdS two-point functions and loop induced effective one-point vertices", "abstract": "We present a study of thermal two-point functions from Witten diagrams in thermal AdS$_{d+1}$, defined with the conformal boundary $S_\\beta^1 \\times \\mathbb{R}^{d-1}$, with an aim to establish a connection between thermal CFT data and perturbative bulk dynamics. We analyze one-loop tadpole and bench diagrams arising from the cubic $\\phi\\phi\\chi$ interaction in the bulk, segregating the different relative thermal winding sectors for the bench, and also extend the analysis to include quartic scalar contact diagrams with and without derivative interactions. We also analyze the spinning exchange thermal two-point function. Utilizing the split representation of bulk propagators and the method of images we reorganize the thermal Witten diagrams into the standard AdS integrals and obtain spectral and image-sum representations that make KMS periodicity of the correlators manifest. Additionally, we show possible position dependent effective one-point vertices of scalar and spinning fields in the bulk arising from the reduction of the coincident- point thermal bulk to bulk propagator loop, allowing tadpole-type diagrams to be reconstructed from effective local bulk interactions. The bench diagram however retains an intrinsically bi-local structure. We further investigate the thermal one-point coefficients and perturbative OPE data encoded in these thermal correlators, including contributions associated with anomalous dimensions. Finally, we examine their relation to thermal dispersion relations and the role of contributions that are not determined by discontinuity data alone. Our results provide a set of explicit bulk constructions for exploring the analytic structure of thermal CFT correlators and their connection to the thermal conformal bootstrap.", "url": "https://arxiv.org/abs/2610.20535", "type": "理论", "summary": "1. 该工作系统研究了热 AdS$_{d+1}$（边界为 $S^1_\\beta\\times\\mathbb{R}^{d-1}$）中 Witten 图给出的热两点函数，涵盖由 $\\phi\\phi\\chi$ 立方耦合产生的单圈蝌蚪图与长凳图、带/不带导数的四次标量接触图以及自旋交换图，并计算热单点系数与微扰 OPE 数据。\n2. 其核心在于用传播子分裂表示与镜像法将热 Witten 图重组为标准 AdS 积分，得到显式体现 KMS 周期性的谱表示与镜像求和表示，并从重合点热体-体传播子圈约化出位置依赖的有效单点顶点，从而用局域有效相互作用重构蝌蚪类图，而长凳图仍保持内禀双局域性。\n3. 这为热 CFT 关联函数的解析结构、热色散关系及热共形 bootstrap 提供了明确的体时空构造，并提示存在不能仅由不连续性数据确定的贡献。", "summary_source": "deepseek", "authors": [{"name": "Astha Kakkar"}], "featured_authors": [{"name": "Astha Kakkar"}], "author_count": 1}, {"id": "2610.20589", "category": "hep-th", "title": "Post-Newtonian theory in de Sitter and anti-de Sitter spacetimes", "abstract": "We develop the post-Newtonian framework for the near-zone dynamics of a binary in de Sitter and anti-de Sitter spacetime. We consider a binary interacting via a free scalar field in a fixed (A)dS background in $D+1$ spacetime dimensions, with $D\\ge3$ and odd. Using multipole expansion and re-summation techniques, we solve for the field degrees of freedom to obtain an effective particle description in the form of a Fokker action. We derive the equations of motion for the binary up to second post-Newtonian (2PN) order and obtain the corresponding 2PN Hamiltonian and conserved charges in phase space. We show that the conformal algebra, corresponding to the isometry algebra of the (A)dS background, is realised in phase space as a curvature-dependent deformation of the Poincare algebra at each PN order. Our results provide a systematic extension of post-Newtonian effective dynamics to finite-curvature backgrounds. This could serve as a useful framework for studying bound-state dynamics in (A)dS as well as in the corresponding holographic CFT.", "url": "https://arxiv.org/abs/2610.20589", "type": "理论", "summary": "1. 该工作为de Sitter与anti-de Sitter时空中的双体近区动力学建立了后牛顿框架，处理固定(A)dS背景下经自由标量场相互作用且在奇数D+1维（D≥3）中的双星系统。\n2. 其技术要点是以多极展开和重求和消去场自由度，导出Fokker作用量的有效粒子描述，并求得至2PN阶的运动方程、哈密顿量与相空间守恒荷，同时证明(A)dS等距群的共形代数在相空间中以曲率相关方式逐阶形变Poincaré代数。\n3. 这系统地将后牛顿有效动力学推广至有限曲率背景，可为(A)dS束缚态动力学及相应全息CFT研究提供框架。", "summary_source": "deepseek", "authors": [{"name": "R. Loganayagam"}, {"name": "Avi Wadhwa"}], "featured_authors": [{"name": "R. Loganayagam"}, {"name": "Avi Wadhwa"}], "author_count": 2}, {"id": "2610.20602", "category": "hep-th", "title": "Heavy-Heavy-Light-Light correlators from holography on the worldsheet", "abstract": "We study correlation functions of light local operators and defect changing operators on the conformal line set by the 1/2 BPS Wilson line of $\\mathcal N=4$ super Yang-Mills. We consider the defect changing operators associated with geometrical and internal cusp angles, which at strong coupling have a large scaling dimension and back-react on the dual $AdS_2$ world-sheet. We set up a holographic computation of correlation functions, in which the light operators are described by fluctuations around the cusped classical string solution, so that correlators of two defect changing operators and an arbitrary number of light protected operators are obtained from the on-shell action of these fluctuations. We implement this prescription in detail for the case of certain 4-point functions, with two light and two defect changing operators. Finally, since for small cusp angles the defect changing operators become light, we manage to derive relations satisfied by integrated correlators of light operators, valid at any coupling. We verify these relations at strong coupling for both internal and geometrical cusps.", "url": "https://arxiv.org/abs/2610.20602", "type": "理论", "summary": "1. 该工作围绕《Heavy-Heavy-Light-Light correlators from holography on the worldsheet》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Matías Colaneri"}, {"name": "Diego H. Correa"}, {"name": "Víctor I. Giraldo-Rivera"}, {"name": "Nicolás A. Ivanovich"}], "featured_authors": [{"name": "Matías Colaneri"}, {"name": "Diego H. Correa"}, {"name": "Víctor I. Giraldo-Rivera"}, {"name": "Nicolás A. Ivanovich"}], "author_count": 4}, {"id": "2610.18892", "category": "math-ph", "title": "Two-Species Boltzmann--Kac Kinetics with Matsumoto--Yor Nonlinear Collisions: Conserved Energy and Conic Equilibria", "abstract": "We extend Mark Kac's kinetic framework from single-species Euclidean spaces to a two-species, non-linear interaction space on the open cone $(0, \\infty)^2$ governed by the Matsumoto--Yor rational collision involution. We identify a non-linear conserved energy $E(x,y) = x + y + 1/x$ and an invariant conic metric measure $d\\mu = \\frac{dx \\, dy}{x(x+y)}$. By establishing a two-species $H$-theorem, we prove that entropy production vanishes if and only if post-collision velocities are statistically independent ($I(U;V)=0$). In contrast to the transform-domain proof of Letac and Wesołowski~\\cite{letac2000}, which relies on joint Laplace transforms of general measures, our approach yields a direct physical derivation in state space via the transformation law for logarithmic gradients and separation of variables. This uncouples the functional-differential system to uniquely characterize the Generalized Inverse Gaussian (GIG) and Gamma distributions as the non-equilibrium thermodynamic equilibria.", "url": "https://arxiv.org/abs/2610.18892", "type": "理论", "summary": "1. 该工作将玻尔兹曼–卡茨动理学从单物种欧氏空间推广至由松本–约尔非线性有理碰撞对合支配的两物种开锥(0,∞)^2，识别守恒能量E=x+y+1/x与不变锥测度dμ=dxdy/[x(x+y)]，并建立两物种H定理。\n2. 其核心卖点在于：熵产生为零当且仅当碰撞后速度统计独立，并通过对数梯度变换律与分离变量在状态空间直接解耦泛函微分系统，从而无需依赖一般测度联合拉普拉斯变换的变换域证明。\n3. 由此唯一刻画广义逆高斯与伽马分布为非平衡热力学平衡态，为非线性动理学、锥上测度演化及相关概率与统计物理模型提供直接的状态空间分析范式。", "summary_source": "deepseek", "authors": [{"name": "Yoshiaki Itoh"}], "featured_authors": [{"name": "Yoshiaki Itoh"}], "author_count": 1}, {"id": "2610.19004", "category": "math-ph", "title": "Anomalies, higher symmetries, and homotopy theory I: crossed precosheaves and a nonabelian Cech construction", "abstract": "Symmetries of a quantum field theory or a quantum lattice model are expected to be described not by a group but by a homotopy type, whose homotopy groups are the higher symmetry groups and whose Postnikov invariants encode 't Hooft anomalies. We propose a homotopy-theoretic definition of 't Hooft anomalies based on the structure of localized symmetries in the operator-algebraic approach. The input is a crossed precosheaf: a collection of groups attached to regions of space, equipped with pairings recording that the commutator of two transformations localized in two regions is localized in their intersection. To a crossed precosheaf and a finite family of regions we attach a pointed connected homotopy type, the Cech-Loday classifying space. As the family of regions ranges over finite covers of space, the classifying spaces form a pro-object in the homotopy category. There is a canonical map from the ordinary classifying space of the symmetry group to this pro-type. Composing this map with a group action gives an anomaly whose nontriviality obstructs gauging. In favorable cases, the Cech-Loday space is essentially independent of the cover. In such cases, the homotopy fiber of the canonical map is a candidate for the classifying space of the higher group of symmetries. We give examples of crossed precosheaves arising from gauge transformations in continuum field theory and from quantum cellular automata and finite-depth circuits. For quantum spin systems in one and two dimensions, our construction recovers the Else-Nayak index and its generalizations to two dimensions.", "url": "https://arxiv.org/abs/2610.19004", "type": "理论", "summary": "1. 该文提出基于交叉预层与非阿贝尔Cech构造，用同伦论定义't Hooft异常与高阶对称性。\n2. 其要点是把区域局域对称群的交换子配对编码为Cech-Loday分类空间pro-对象，并由典范映射的同伦纤维给出高阶对称群分类空间候选。\n3. 该框架适用于连续场论规范变换、量子元胞自动机与有限深度线路，并在1D/2D量子自旋系统中恢复Else-Nayak指数及其二维推广。", "summary_source": "deepseek", "authors": [{"name": "Anton Kapustin"}, {"name": "Shixiong Xu"}], "featured_authors": [{"name": "Anton Kapustin"}, {"name": "Shixiong Xu"}], "author_count": 2}, {"id": "2610.19171", "category": "math-ph", "title": "A direct theory of strain-gradient special Cosserat rods via the principle of virtual work", "abstract": "Motivated by recent advances in the synthesis of effective one-dimensional mechanical metamaterials, we develop a direct theory of strain-gradient special Cosserat rods based on the principle of virtual work. The internal virtual work is formulated intrinsically in terms of variations of the classical Cosserat strains and their spatial derivatives, without requiring a three-dimensional parent material or a stored energy. Objectivity and insensitivity to rigid virtual displacements characterize the admissible internal-work density, while localization yields the dynamic field equations, higher-order contact interactions, natural boundary conditions, and balances of linear and angular momentum. For inextensible and unshearable rods, the constrained principle determines a unique multiplier functional, although its representation by reactive force and double-force fields possesses a gauge freedom absent from classical rod theory. We also formulate objective elastic, hyperelastic, and viscoelastic constitutive laws, extend transverse hemitropy, transverse isotropy, and flip symmetry to strain-gradient rods, and derive invariant representations of symmetric stored energies. As an application, we study a planar inextensible cantilever under a compressive terminal force. We prove that the eigenvalues of the linearized problem are simple and coincide precisely with the loads at which bifurcation from the straight state occurs. In addition, each bifurcation point generates a connected global branch of nonlinear equilibria that is locally analytic near its origin.", "url": "https://arxiv.org/abs/2610.19171", "type": "理论", "summary": "1. 该工作围绕《A direct theory of strain-gradient special Cosserat rods via the principle of virtual work》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "R. S. Hallyburton"}, {"name": "C. Rodriguez"}], "featured_authors": [{"name": "R. S. Hallyburton"}, {"name": "C. Rodriguez"}], "author_count": 2}, {"id": "2610.19195", "category": "math-ph", "title": "On optimal Wannier decay in dimension three", "abstract": "For a Chern nontrivial Bloch bundle over the three torus, we construct an orthonormal Wannier basis with the optimal pointwise decay $\\mathcal{O}(|x|^{-5/2})$. All but one of the generators decay exponentially. This resolves the question left open in arXiv:2505.01999 .", "url": "https://arxiv.org/abs/2610.19195", "type": "理论", "summary": "1. 该工作针对三维环面上陈数非平凡的Bloch丛，构造了具有最优逐点衰减 O(|x|^{-5/2}) 的正交Wannier基。\n2. 其核心卖点是在陈非平凡拓扑阻碍下达到逐点最优衰减，且除一个生成元外其余Wannier函数均指数局域。\n3. 这解决了 arXiv:2505.01999 留下的公开问题，并为三维拓扑Bloch丛的Wannier局域化极限提供了明确判据。", "summary_source": "deepseek", "authors": [{"name": "Simon Becker"}, {"name": "Zhongkai Tao"}, {"name": "Mengxuan Yang"}], "featured_authors": [{"name": "Simon Becker"}, {"name": "Zhongkai Tao"}, {"name": "Mengxuan Yang"}], "author_count": 3}, {"id": "2610.19221", "category": "math-ph", "title": "On the Mathematical Structure of Helical Shear in Anelastic Continua", "abstract": "We study helical shear of a thick-walled tube made of an incompressible, isotropic hyper-anelastic solid carrying a radially symmetric distribution of axial screw dislocations. Through the Bilby--Kröner--Lee decomposition, the dislocations are encoded in a Weitzenböck material manifold, whose Riemannian metric alone enters the elastic response. Equilibrium reduces at each radius to an algebraic system for the azimuthal and axial shear strains, whose cross terms are proportional to the dislocation strength and to the dependence of the strain energy on the second invariant; the two shear modes therefore couple only in the presence of dislocations. Exact solutions are obtained for neo-Hookean, Fung--Demiray, Gent, Knowles, and Mooney--Rivlin materials, and numerical ones for Gent--Gent materials. The universal relations of Horgan and Saccomandi are extended to dislocated generalized neo-Hookean tubes. Dislocations stiffen the tube when the strain energy stiffens with the first invariant, couple the two shear modes chirally when it depends on the second, and may restrict admissibility: they cap the dislocation strength in Gent and Gent--Gent materials, and contract the admissible traction region in Knowles materials with power-law index below n = 1/2. A weakly nonlinear analysis to third order in the applied tractions and dislocation strength shows that, at first order (linear elasticity), the dislocations leave the shear response unaffected while carrying a residual stress. The chiral coupling enters at second order, through the dependence of the strain energy on the second invariant, so that every dislocated material couples the modes as the Mooney--Rivlin solid with the same second- and third-order moduli. At third order, no new coupling arises; the modes interact through stiffness corrections involving the fourth-order modulus, which the dislocations further correct mode by mode.", "url": "https://arxiv.org/abs/2610.19221", "type": "理论", "summary": "1. 该工作围绕《On the Mathematical Structure of Helical Shear in Anelastic Continua》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Souhayl Sadik"}, {"name": "Giuseppe Saccomandi"}, {"name": "Luigi Vergori"}], "featured_authors": [{"name": "Souhayl Sadik"}, {"name": "Giuseppe Saccomandi"}, {"name": "Luigi Vergori"}], "author_count": 3}, {"id": "2610.19310", "category": "math-ph", "title": "A Nontrivial Lattice Scalar Quantum Field Model", "abstract": "We introduce a new Euclidean quantum model with zero-spin scaled scalar fields on a spacetime hypercubic lattice, which we refer to as the hybrid model. The model coupling parameters are the hopping parameter $\\kappa^2>0$ and the field interaction coupling $\\alpha>0$. Using the technique of lattice scaled fields, with a noncanonical scaling that corresponds to a partial renormalization (wave function renormalization), we show that the partition function of this model satisfies both thermodynamic and ultraviolet stability bounds, with constants which are uniform in the lattice volume $\\Lambda_s$ and the lattice spacing $a\\in(0,1]$. As a consequence, the model has a finite free energy per degree of freedom in the thermodynamic limit $\\Lambda_s\\nearrow\\infty$, at least in the subsequential sense. Subsequently, we can also take the ultraviolet or continuum limit $a\\searrow 0$. Besides the finiteness property of the free energy, for sufficiently small values of the model coupling parameters $\\kappa^2$ and $\\alpha$, we show the model satisfies Osterwalder-Schrader positivity and construct the underlying physical quantum mechanical Hilbert space, and, using a polymer expansion, we show correlations also remain bounded in the thermodynamic limit. Finally, we perturbatively compute an infinite volume truncated four-point correlation showing it is nonzero. Noting that, for fixed $a$, perturbation series in $\\kappa^2$ and $\\alpha$ converges, these results are sufficient to show that our hybrid model makes sense as a lattice quantum field theory in spacetime dimension $d=3,4$, with possible extensions to other higher values of $d$.", "url": "https://arxiv.org/abs/2610.19310", "type": "理论", "summary": "1. 该工作引入超立方格点上的欧几里得量子模型：零自旋缩放标量场，耦合为跳跃参数κ²>0和相互作用α>0，并分析其热力学与连续极限。\n2. 其卖点是用非标准标度（部分波函数重整化）证明配分函数满足对体积和格距一致的热力学与紫外稳定性界，小耦合下具备Osterwalder-Schrader正性、可构造希尔伯特空间、关联有界，且截断四点关联非零。\n3. 这确立了该混合模型在d=3,4作为格点量子场论的意义，并暗示可推广至更高维，为构造非平凡标量场模型提供路径。", "summary_source": "deepseek", "authors": [{"name": "P.A. Faria da Veiga"}, {"name": "R. Mistry"}, {"name": "M. O'Carroll"}], "featured_authors": [{"name": "P.A. Faria da Veiga"}, {"name": "R. Mistry"}, {"name": "M. O'Carroll"}], "author_count": 3}, {"id": "2610.19702", "category": "math-ph", "title": "Coherent-State Integrals Beyond the Domain of Operator Products", "abstract": "Inserting a resolution of the identity between two operators turns a matrix element of their product into a phase-space integral. For unbounded operators the product need not exist on the vector at hand, while the integral may still converge. We follow this gap through the chain $e^{\\mu a^2}e^{\\lambda a^{\\dagger2}}$ of two-photon exponentials, where it can be traced completely. Five regions of parameter space appear: where the Bochner conditions of the strong formulation hold, where the product exists as a vector, where it exists as a sesquilinear form, where the coherent-state integral converges, and where the Fock-space series converges. The first three are strictly nested inside the intersection of the last two, and these two overlap without either containing the other. A single Hermite-type function agrees with the matrix element where it exists and with the integral and the series wherever they converge, so the integral carries the analytic continuation of the matrix element beyond the domain of the product and beyond the convergence of its Fock series. On the real slice of parameter space, an iterated form of the integral also reaches every point where the series converges. The analysis rests on a weak composition lemma whose hypotheses concern only the bra, the ket and the resolving family. For bounded chains the same identity is unconditional, and worked examples of that kind are given in a companion paper.", "url": "https://arxiv.org/abs/2610.19702", "type": "理论", "summary": "1. 该工作围绕《Coherent-State Integrals Beyond the Domain of Operator Products》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Ghasem Asadi Cordshooli"}], "featured_authors": [{"name": "Ghasem Asadi Cordshooli"}], "author_count": 1}, {"id": "2610.20123", "category": "math-ph", "title": "The WKB Riemann-Hilbert Problem for the Painlevé I System", "abstract": "In this paper, we solve the direct monodromy problem for the Borel-summed $0$-parameter solution of Painlevé~I. Using the auxiliary time equation, we first construct formal WKB wave matrices whose amplitudes are regular at the double turning point. Rigorous Borel summation then yields exact WKB matrices in each Stokes region. Uniform estimates on moving action strips provide a common exact wave matrix in a full neighbourhood of the double point, proving that all four incident jumps are identities for consistent column normalisations. We formulate the resulting normalised Riemann--Hilbert problem and prove its existence and uniqueness on the Borel domains of the construction. Finally, after Painlevé scaling, the five Borel-summed solutions coincide with the five rotated tritronquée solutions of Painlevé~I.", "url": "https://arxiv.org/abs/2610.20123", "type": "理论", "summary": "1. 该文针对 Painlevé I 系统的 Borel 求和零参数解，求解其直接单值性问题，借助辅助时间方程在双转向点构造振幅正则的形式 WKB 波矩阵，并通过严格 Borel 求和得到各 Stokes 区域的精确 WKB 矩阵。\n2. 核心卖点在于利用移动作用量条带上的均匀估计，在双转向点全邻域内构造统一精确波矩阵，证明相容列归一化下四个入射跳跃均为恒等，并建立与证明归一化 Riemann-Hilbert 问题的存在唯一性。\n3. 经 Painlevé 标度后，五个 Borel 求和解与 Painlevé I 的五个旋转 tritronquée 解重合，这为精确 WKB、Borel 求和与单值性分析之间搭建了可推广的桥梁。", "summary_source": "deepseek", "authors": [{"name": "Mohamad Alameddine"}, {"name": "Olivier Marchal"}, {"name": "Nikita Nikolaev"}, {"name": "Nicolas Orantin"}], "featured_authors": [{"name": "Mohamad Alameddine"}, {"name": "Olivier Marchal"}, {"name": "Nikita Nikolaev"}, {"name": "Nicolas Orantin"}], "author_count": 4}, {"id": "2610.20166", "category": "math-ph", "title": "Quantized six-vertex realizations of frustration graphs", "abstract": "A recent graph-theoretic criterion for a Hamiltonian to exhibit a free-parafermion spectrum is that its frustration graph be an indifference graph. We show that an arbitrary finite indifference graph can be realized as a frustration graph of the quantized si
