<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-10-15 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="eyebrow">arXiv Daily Digest · 2026-10-15</div>
      <h1>Daily ArXiv Selection</h1>
      <p>
        数据来自 arXiv 当天的 <code>cond-mat</code>、<code>hep-th</code>、<code>math-ph</code>、<code>quant-ph</code> 四个分类页，口径限定为 <code>New submissions</code>。
        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。
      </p>
      <div class="stats" id="stats"></div>
    </section>
    <section class="controls">
      <div class="control-grid">
        <div class="field">
          <label for="search">搜索</label>
          <input class="search" id="search" type="search" placeholder="按标题、作者、摘要、arXiv 编号搜索">
        </div>
        <div class="field">
          <label>分类</label>
          <div class="chip-row" id="category-filters"></div>
        </div>
        <div class="field">
          <label>类型</label>
          <div class="chip-row" id="type-filters"></div>
        </div>
      </div>
      <div class="meta-row">
        <div id="result-count">正在加载…</div>
        <div><a href="../index.html">返回归档</a></div>
      </div>
    </section>
    <section class="paper-grid" id="paper-grid"></section>
    <section class="empty" id="empty-state">没有匹配到结果，试试清空搜索词或恢复筛选。</section>

  <script>
    const papers = [{"id": "2610.18882", "category": "cond-mat", "title": "Phase separating microdomains in highly coarse-grained lipids", "abstract": "A highly coarse-grained model for the lipid monolayer is formulated by considering a two-dimensional system of spherical particles with distinct types of S, U, and C, corresponding to the saturated, unsaturated, and cholesterol molecules. Their interactions are defined as modified Lennard-Jones type with distinct interaction strengths. The phase behavior of the system is studied for various cholesterol compositions, $x$ ranging from 0.1 to 0.6. From the simulation results, we observe that the S- and C-type particles segregate together to form ordered microdomains, with U-type particles at their outer leaflet; consistent with observations in literature. An order parameter $\\Phi$ is defined to quantify the extent of phase separation among the constituents. The time averaged value of $\\Phi$ is found increasing with the $x$ value. Radial distribution function calculations indicate the structural ordering within the phase separated domains.", "url": "https://arxiv.org/abs/2610.18882", "type": "理论+数值", "summary": "1. 该工作构建高粗粒化二维脂质单层模型，将饱和、不饱和和胆固醇分子分别映射为S、U、C球形粒子，采用不同强度的改型Lennard-Jones作用，并在胆固醇组分x=0.1至0.6下模拟相行为。\n2. 其核心是在模拟中观察到S与C粒子共聚集成有序微畴、U粒子位于畴外侧，并引入序参量Φ量化相分离，发现时间平均Φ随x增大，径向分布函数进一步证实畴内结构有序。\n3. 该结果支持胆固醇组分调控脂质单层微畴形成的图像，并为更精细模型与实验验证提供出发点。", "summary_source": "deepseek", "authors": [{"name": "S. Siva Nasarayya Chari"}], "featured_authors": [{"name": "S. Siva Nasarayya Chari"}], "author_count": 1}, {"id": "2610.18885", "category": "cond-mat", "title": "Mechanisms leading to axial segregation of bidisperse particles in rotating tumblers", "abstract": "The origin of segregated axial bands for size-bidisperse particles in long rotating tumblers is a long-standing question in granular flows and a problem of both fundamental and practical interest. Using DEM simulations, we consider the streamwise and time-dependent development of the underlying instability as well as performing a broad parametric study over a wide range of particle size ratios, tumbler lengths and diameters, species fractions, and fill levels to determine the conditions under which axially segregated bands appear. We show that initial radial segregation of the small and large particles in the surface flowing layer results in a layer of mixed particles with a higher bulk density due to more efficient packing over a layer of nearly monodisperse small particles with a lower bulk density. This leads to a granular Rayleigh-Taylor-like instability that produces recirculation cells driving axial band formation. The appearance of a layer of high-density mixed particles over a layer of lower-density monodisperse particles can be directly connected to the operating conditions, explaining why axially segregated bands appear only under certain conditions. Typically, increasing the particle size ratio improves packing and increases the density of the mixed layer, enhancing the Rayleigh-Taylor instability and accelerating axial segregation.", "url": "https://arxiv.org/abs/2610.18885", "type": "理论+数值", "summary": "1. 该工作利用DEM模拟研究长旋转滚筒中双分散颗粒轴向偏析带的时变发展，并系统扫描粒径比、滚筒长径、组分比例和填充率，以确定条带出现的条件。\n2. 其核心物理在于表面流层初始径向偏析形成的高密度混合层覆盖低密度近单分散小颗粒层，触发类瑞利-泰勒不稳定性并产生回流胞，从而驱动轴向条带形成。\n3. 该机制将层状堆积密度差异与操作条件直接关联，可解释条带仅在特定条件下出现，并为通过粒径比等参数预测和调控轴向偏析提供依据。", "summary_source": "deepseek", "authors": [{"name": "Umberto d'Ortona"}, {"name": "Richard Lueptow"}, {"name": "Nathalie Thomas"}], "featured_authors": [{"name": "Umberto d'Ortona"}, {"name": "Richard Lueptow"}, {"name": "Nathalie Thomas"}], "author_count": 3}, {"id": "2610.18980", "category": "cond-mat", "title": "Transmission representation of the Josephson free energy beyond the short-junction limit", "abstract": "Beenakker's formula, $U(\\varphi)-U(0)=\\Delta\\sum_n\\bigl(1-\\sqrt{1-\\tau_n\\sin^2(\\varphi/2)}\\bigr)$, expresses the zero-temperature energy-phase relation of a short Josephson junction through its normal-state transmission eigenvalues. We generalize this transmission representation beyond the short-junction limit and express the phase-dependent free energy of a time-reversal-symmetric $s$-wave junction as a Matsubara sum over channels with frequency-dependent transmissions. The representation constrains the small-phase expansion of the free energy. In particular, we prove that the normalized ratio of its quartic and quadratic coefficients satisfies $-1\\le\\alpha_r\\le7/80$ at finite temperature. We also construct a four-site junction with $\\alpha_r>0$, which disproves the conjectured upper bound $\\alpha_r\\le0$. So that these results can be trusted without repeating the derivations, every numbered equation is formally verified in the Lean proof assistant.", "url": "https://arxiv.org/abs/2610.18980", "type": "理论", "summary": "1. 该工作将约瑟夫森自由能的透射表示推广到短结极限之外，并用频率依赖透射的松原求和描述时间反演对称s波结。\n2. 关键贡献是小相位展开的严格约束：有限温下−1≤α_r≤7/80，且四格点结可实现α_r>0，推翻α_r≤0的猜想。\n3. 所有编号方程均在Lean证明助手中形式化验证，为长结自由能、透射谱及相位展开不等式研究提供了可复用的严格范式。", "summary_source": "deepseek", "authors": [{"name": "Anton R. Akhmerov"}], "featured_authors": [{"name": "Anton R. Akhmerov"}], "author_count": 1}, {"id": "2610.18999", "category": "cond-mat", "title": "Electron-Mediated Phonon Polaritons in Quantum Cavities", "abstract": "Phonon-photon coupling in quantum materials is commonly treated as an effective direct interaction, neglecting the crucial role played by electrons. Here we develop a gauge-invariant theory of cavity phonon polaritons that captures electronic screening, dissipation, and hybridization. We show that screening can suppress polariton formation in metals, severely constraining cavity control of phonon-mediated superconductivity. By contrast, interband electronic resonances in time-reversal-symmetric gapped systems can strongly enhance phonon-photon coupling, enabling robust polariton formation down to the monolayer limit despite electronic absorption. We illustrate these effects in NbSe2, hBN, and gapped graphene. Finally, we show that gauge invariance enforces photon decoupling from a critical soft phonon, establishing a general no-go mechanism for photon condensation.", "url": "https://arxiv.org/abs/2610.18999", "type": "理论", "summary": "1. 该文建立了规范不变的腔声子极化激元理论，将电子屏蔽、耗散与杂化纳入声子-光子耦合，修正了通常的有效直接相互作用图像。\n2. 其核心在于揭示电子响应可双向调控极化激元：金属中屏蔽抑制其形成并限制腔场调控声子介导超导，而时间反演对称的有隙体系中带间共振能增强耦合，甚至在单层极限下抵抗吸收形成稳健极化激元。\n3. 该工作还证明规范不变性要求临界软声子与光子解耦，给出光子凝聚的一般不可行机制，为腔量子材料与声子超导调控提供了明确边界与设计原则。", "summary_source": "deepseek", "authors": [{"name": "Mattia Udina"}, {"name": "David Hagenmüller"}, {"name": "Indranil Paul"}], "featured_authors": [{"name": "Mattia Udina"}, {"name": "David Hagenmüller"}, {"name": "Indranil Paul"}], "author_count": 3}, {"id": "2610.19017", "category": "cond-mat", "title": "Topological superconductivity in layered d-wave altermagnetic metals", "abstract": "We investigate multilayer d-wave altermagnetic metals with odd-parity helical p-wave pairing. In the minimal bilayer system, interlayer tunneling reconstructs the spin-split Fermi surfaces and generates two layer-hybridized sectors with distinct effective chemical potentials. Without Rashba spin-orbit coupling (RSOC), the emergent mirror symmetry and subsystem chiral symmetry stabilize phases with different numbers of helical Majorana edge-mode pairs and additional counterpropagating pairs, jointly characterized by the mirror Chern number and the winding numbers defined along high-symmetry lines. The combination of RSOC and the altermagnetic exchange field gaps out the helical Majorana pairs while, in a certain parameter regime, leaving another pair of counterpropagating Majorana edge modes gapless, giving rise to second-order topological phases with isolated or twofold Majorana corner modes, as well as a hybrid-order phase in which gapless Majorana edge modes coexist with Majorana corner modes. We identify a layer symmetry that elucidates the physical origin of these phases. For an arbitrary N-layer system, such a symmetry naturally arises from the interlayer-coupling matrix, allowing N-fold Majorana corner modes to emerge when all layer-hybridized sectors enter the nontrivial second-order regime. Our results establish the interplay among the layer degree of freedom, odd-parity pairing, and Fermi-surface configurations as a controllable route to engineering topological superconductivity in layered altermagnetic systems.", "url": "https://arxiv.org/abs/2610.19017", "type": "理论", "summary": "1. 该文研究了具有奇宇称螺旋 p 波配对的多层 d 波交变磁性金属，并在最小双层到任意 N 层体系中分析其拓扑超导相。\n2. 其关键在于层间隧穿重构费米面并形成层杂化分区，并结合镜像/子系统手性对称性、RSOC 与交变交换场稳定多种马约拉纳边缘模和角模。\n3. 该工作表明层自由度、奇宇称配对与费米面构型的耦合是可调控路径，并使 N 层体系有望出现 N 重马约拉纳角模。", "summary_source": "deepseek", "authors": [{"name": "Yijie Mo"}, {"name": "Zhongbo Yan"}], "featured_authors": [{"name": "Yijie Mo"}, {"name": "Zhongbo Yan"}], "author_count": 2}, {"id": "2610.19057", "category": "cond-mat", "title": "A Conservative Darcy-Brinkman-Stokes Formulation for PHREEQC-Coupled Reactive Transport with Cell-Based Surface Complexation", "abstract": "We present a mass-conservative Darcy-Brinkman-Stokes (DBS) formulation for reactive transport with cell-based surface complexation in image-based porous media, coupled to PHREEQC and implemented in GeoChemFoam, an OpenFOAM-based toolbox. Dissolved species are transported in the physical mobile-water fraction, adsorbed species are stored as conservative cell-scale surface inventories, and each reactive cell is coupled to PHREEQC. Reactive surface area is prescribed independently as a cell field, so that internal area left unresolved by segmentation of microporous phases can be represented while DBS flow and transport are retained in the resolved pore space. The implementation is verified with a test suite that isolates the coupling of transport and chemistry from the construction of reactive surface area. Aqueous and adsorbed mass balance is evaluated against a one-dimensional analytical retardation benchmark and closed-system batch calculations. The smooth-interface surface-area algorithms are tested on idealised two- and three-dimensional geometries. In a two-scale lithium micromodel, DBS reproduces fully resolved aqueous and sorbed inventories within 0.6% across Pe=0.1-10. The applications comprise Pb2+ retardation by hydrous ferric oxide coatings in a two-dimensional fracture network, competitive Mn2+/Mg2+ exchange in a three-dimensional Kelvin-cell sorbent, and Sr2+/Ca2+ exchange in Estaillades limestone. In the fracture-network and limestone cases, the formulation yields spatially resolved aqueous and adsorbed inventories even where reactive surface area is only partly resolved at the image scale. The framework therefore supports conservative surface-complexation modelling in both resolved and unresolved pore structures, with relevance to contaminant retention, selective ion capture, and radionuclide transport.", "url": "https://arxiv.org/abs/2610.19057", "type": "理论+数值", "summary": "1. 提出质量守恒的DBS反应输运框架，将基于单元的表面络合与PHREEQC耦合，并在GeoChemFoam中实现。\n2. 其技术卖点是溶解态在物理可动水分数中输运、吸附态作为守恒单元尺度表面存量，且反应表面积独立指定为单元场以表征未解析内部面积。\n3. 该框架可在已解析与未解析孔隙结构中保持表面络合质量守恒，并支撑污染物滞留、选择性离子捕获及放射性核素输运研究。", "summary_source": "deepseek", "authors": [{"name": "Hannah P. Menke"}, {"name": "Florian Doster"}, {"name": "Julien Maes"}], "featured_authors": [{"name": "Hannah P. Menke"}, {"name": "Florian Doster"}, {"name": "Julien Maes"}], "author_count": 3}, {"id": "2610.19061", "category": "cond-mat", "title": "Cooperative Boundary Switching of Mesoscopic Real Spectra in a Non-Hermitian Chain Family", "abstract": "At fixed bulk criticality, every fixed nonsingular real single-end potential preserves a growing local population of real eigenvalues in an open analytic family of non-Hermitian chains. An open region of two-end real potentials removes this population. A boundary-amplitude criterion fixes the minimum number of controlled ends. The population grows as $\\sqrt N$, where $N$ is chain length, although its normalized spectral weight vanishes and the local limiting bands remain unchanged. For a representative chain's four zero-detuning settings, an independent passive Hermitian double chain converts this distinction into separated resonances at one fixed local port under a common coupling scan at fixed probe carrier. Its absolute reflection contrast and stability margin both scale as $N^{-1}$, with explicit sufficient resource budgets. Boundary amplitudes thus fix a minimum control requirement that limiting bands and thermodynamic spectral density do not specify.", "url": "https://arxiv.org/abs/2610.19061", "type": "理论", "summary": "1. 该工作在固定体临界性下研究非厄米链族中介观实谱的边界协同切换：固定非奇异实单端势保持局域实本征值布居，而双端实势的开放区域可将其移除。\n2. 其卖点是边界幅度判据确定最少受控端数，且实本征值布居随链长按√N增长，尽管归一化谱权重消失、局域极限带不变；在代表链四个零失谐设置下，无源厄米双链于固定探针载波、共同耦合扫描中把该区别转为固定端口的分离共振，绝对反射对比与稳定裕度均按N^{-1}标度并给出资源预算。\n3. 这说明极限带与热力学谱密度不能规定最小控制需求，边界幅度可为其提供判据，并启发有限尺寸非厄米谱调控与固定端口探测。", "summary_source": "deepseek", "authors": [{"name": "Chengxi Li"}, {"name": "Hao Zhu"}, {"name": "Tie-Fu Zhang"}, {"name": "Wanzi Sun"}, {"name": "Wuming Li"}], "featured_authors": [{"name": "Chengxi Li"}, {"name": "Hao Zhu"}, {"name": "Tie-Fu Zhang"}, {"name": "Wanzi Sun"}, {"name": "Wuming Li"}], "author_count": 5}, {"id": "2610.19083", "category": "cond-mat", "title": "Viscous hydrodynamics from correlated losses", "abstract": "Interactions turn a gas into a fluid. We show that two-body loss can take their place. Correlated loss induces elastic scattering, as required by the optical theorem, which dominates at strong loss via the quantum Zeno effect. A nondegenerate gas with only two-body loss thus flows hydrodynamically, with viscosity and thermal conductivity close to those of the unitary Fermi gas. As loss heats the gas, both grow in time with a universal exponent 3/8. Unlike single-particle loss, two-body loss can engineer collisions, and hence transport, in quantum matter.", "url": "https://arxiv.org/abs/2610.19083", "type": "理论", "summary": "1. 该工作表明，双体损耗可通过关联损耗诱导弹性散射，使仅含双体损耗的非简并气体呈现流体动力学行为。\n2. 其核心机制是关联损耗经光学定理产生弹性散射，并在强损耗下由量子Zeno效应主导，给出接近幺正费米气体的黏度与热导率。\n3. 这提示双体损耗可用于工程化量子物质中的碰撞与输运，且损耗加热时输运系数按普适指数3/8增长，区别于单粒子损耗。", "summary_source": "deepseek", "authors": [{"name": "Aleksandr N. Mikheev"}, {"name": "Orjan Ameye"}, {"name": "Oded Zilberberg"}, {"name": "Jeff Maki"}], "featured_authors": [{"name": "Aleksandr N. Mikheev"}, {"name": "Orjan Ameye"}, {"name": "Oded Zilberberg"}, {"name": "Jeff Maki"}], "author_count": 4}, {"id": "2610.19090", "category": "cond-mat", "title": "Geometry-Encoded Hidden Orientational Memory", "abstract": "Materials usually remember their past through dissipative changes of structure or through a net order. Simulations of caged colloidal ellipsoids at a fluid interface reveal a purely orientational memory. The particles stay in place, the layer has no net alignment, and a pattern written by a field is retained by capillary interactions between neighbors. It lasts hundreds of times longer than a particle takes to reorient, while every particle keeps rotating. The layer also remembers sequence: when two strong fields act one after the other on the same particles, it records which came last.", "url": "https://arxiv.org/abs/2610.19090", "type": "理论+数值", "summary": "1. 该工作通过模拟流体界面上的笼状胶体椭球，揭示一种不依赖结构耗散变化或净取向序的纯取向记忆。\n2. 其关键在于相邻颗粒的毛细相互作用与几何约束共同锁定由外场写入的取向图案，颗粒原地持续转动但整体无净排列，记忆寿命达单颗粒重取向时间的数百倍，并能记录先后施加场的顺序。\n3. 这为在无净序、无结构重构的软物质系统中实现隐藏信息存储与序列记忆提供了机制，并可启发胶体组装和界面器件的设计。", "summary_source": "deepseek", "authors": [{"name": "Vladimir A. Baulin"}], "featured_authors": [{"name": "Vladimir A. Baulin"}], "author_count": 1}, {"id": "2610.19168", "category": "cond-mat", "title": "Symmetry-selected extreme shear compliance in a stable carbon monolayer", "abstract": "Solids that are stiff to most loads and extremely compliant to one are normally built, not found. That internal atomic relaxation lowers elastic constants is textbook; what has remained untested is whether it can be driven far enough to separate the elastic scales of a crystal by an order of magnitude while leaving it mechanically stable. Density functional theory calculations of the complete in-plane elastic tensor of four non-hexagonal carbon monolayers sharing a square lattice metric show that it can: their longitudinal stiffnesses agree to within a factor of two while their shear constants span more than a factor of fifty. Twin T-graphene, previously reported as elastically isotropic from normal strains alone, is the extreme case, with $C_{66}=3.03$~N\\,m$^{-1}$, nearly fifty times below graphene, at an axial stiffness typical of semiconducting monolayers, and a soft Kelvin eigenvalue a factor of $29$ below the others while the Born criteria hold. Symmetry confines the strain-induced relaxation to the $B_{2g}$ sector, a counter-torsion of the carbon sublayers about the short mid-plane bonds that removes $96\\%$ of the clamped-ion shear stiffness with almost no bond stretching and leaves the semiconducting gap intact. Transverse acoustic phonons, finite-temperature dynamics, and large-deformation simulations show that the channel survives beyond the harmonic, zero-temperature limit. Because the selection rule is a point-group statement rather than a chemical one, it yields a screening criterion for other crystals and other strain components.", "url": "https://arxiv.org/abs/2610.19168", "type": "理论+数值", "summary": "1. 该工作用密度泛函理论计算四种共享方形晶格度规的非六角碳单层的完整面内弹性张量，发现其纵向刚度相差不到两倍，而剪切常数跨越五十倍以上，Twin T-graphene以C66=3.03 N/m成为极端剪切软化的稳定实例。\n2. 其机制是应变诱导弛豫被对称性限制在B2g扇区，表现为碳亚层绕短中面键反向扭转，几乎不拉伸化学键即消除96%的钳制离子剪切刚度，使软Kelvin本征值较其他体系低29倍，同时保持半导体带隙并满足Born判据。\n3. 由于该选择定则源于点群而非特定化学成键，它可推广为筛选其他晶体和其他应变分量的准则；横声学声子、有限温度动力学及大变形模拟表明此剪切通道在谐波零温极限之外依然存在。", "summary_source": "deepseek", "authors": [{"name": "J. W. González"}, {"name": "M. Pachecho"}, {"name": "J. D. Correa"}], "featured_authors": [{"name": "J. W. González"}, {"name": "M. Pachecho"}, {"name": "J. D. Correa"}], "author_count": 3}, {"id": "2610.19261", "category": "cond-mat", "title": "Beyond the lemon: Spectra of random Lindblad operators with a Hamiltonian component", "abstract": "Generators of continuous-time quantum Markovian evolution, known as Lindblad operators, play a key role in the theory of open quantum systems. The question of how to define and characterize random Lindblad operators has attracted considerable attention in recent years. Purely dissipative random Lindbladians have been extensively studied using toolboxes of free probability and non-Hermitian random matrix theories, which helped, among other results, to uncover a characteristic lemon-like spectral support. In this work, we focus on random Lindbladians with a Hamiltonian component. We analyze three ensembles of increasing complexity, designed to illustrate the joint effects of dissipative and Hamiltonian dynamics. While the first two ensembles allow for an exact analytic treatment with standard probabilistic and free-probability methods, the generic case of independently random Hamiltonian and dissipative components requires a novel framework that combines operator-valued free probability with sequential noise averaging. For this ensemble, our approach preserves the underlying tensor-product structure of the Lindblad operator and derives a general equation for the spectral boundary. We characterize the effect of Hamiltonian-induced spectral squeezing and explain how the spectral support changes with the relative Hamiltonian strength and the rank of the dissipative component.", "url": "https://arxiv.org/abs/2610.19261", "type": "理论", "summary": "1. 该工作研究含哈密顿量分量的随机林德布拉德算符谱，构建三个复杂度递增的系综以刻画耗散与哈密顿动力学的联合效应，突破此前纯耗散情形的柠檬形谱支集图像。\n2. 其核心创新在于：前两个系综可用标准概率与自由概率方法精确解析，而一般独立随机哈密顿量与耗散分量需结合算符值自由概率和序贯噪声平均，并在保持张量积结构下导出谱边界方程。\n3. 该框架刻画了哈密顿量诱导的谱压缩，阐明谱支集随相对哈密顿强度和耗散分量秩的演化，为开放量子系统随机生成元的谱理论及后续研究提供可扩展工具。", "summary_source": "deepseek", "authors": [{"name": "Mykhailo Hontarenko"}, {"name": "Wojciech Tarnowski"}, {"name": "Sergey Denisov"}, {"name": "Karol Życzkowski"}], "featured_authors": [{"name": "Mykhailo Hontarenko"}, {"name": "Wojciech Tarnowski"}, {"name": "Sergey Denisov"}, {"name": "Karol Życzkowski"}], "author_count": 4}, {"id": "2610.19269", "category": "cond-mat", "title": "Spectral signatures of spin textures and the emergence of a pseudogap", "abstract": "Periodic solids with strongly interacting electrons display phenomena -- from Mott localization to high-temperature superconductivity -- that escape conventional band theory. Efforts to address this unconventional physics have been typically cast in the language of Green's function theories and the associated frequency- and momentum-dependent self-energies capturing strong correlations beyond the reach of mean-field theories. Here, we underscore that frequency- and momentum-dependent self-energies emerge also from mean-field solutions that break translational symmetry, and that these self-energies can display the characteristic fingerprints of strong correlations for certain, physically meaningful, spatial patterns. We showcase this perspective by studying the paradigmatic case of the 2D Hubbard model. We find that already at the mean-field level the doped antiferromagnet displays, in addition to stripes, many quasi-degenerate self-consistent solutions with antiferromagnetic textures organized into antiphase domains separated by hole-rich interfaces, reminiscent of the phase-separation scenario. Remarkably, these solutions map into spectral functions that display very distinctively the phenomenology of the pseudogap, including the nodal-antinodal dichotomy of the self-energy, Fermi arcs, and a complementary Luttinger surface. The result is a conceptually simple description of such an intricate many-body state: the pseudogap emerges as the momentum-space spectral portrait of the real-space interplay between antiferromagnetic domains and the metallic interfaces, which echoes the role of spin-fluctuations identified by nonperturbative methods.", "url": "https://arxiv.org/abs/2610.19269", "type": "理论", "summary": "1. 该工作通过求解二维Hubbard模型平均场自洽解，考察破缺平移对称性的自旋织构及其谱学特征。\n2. 其关键在于掺杂反铁磁体可产生反相畴与富空穴界面构成的准简并解，导致自能呈现节点-反节点二分、费米弧和Luttinger面等赝能隙特征。\n3. 这暗示赝能隙可理解为实空间反铁磁畴与金属界面相互作用的动量空间谱像，并与非微扰方法揭示的自旋涨落作用相呼应。", "summary_source": "deepseek", "authors": [{"name": "Matteo Quinzi"}, {"name": "Andrea Pintus"}, {"name": "Tommaso Chiarotti"}, {"name": "Massimo Capone"}, {"name": "Nicola Marzari"}], "featured_authors": [{"name": "Matteo Quinzi"}, {"name": "Andrea Pintus"}, {"name": "Tommaso Chiarotti"}, {"name": "Massimo Capone"}, {"name": "Nicola Marzari"}], "author_count": 5}, {"id": "2610.19275", "category": "cond-mat", "title": "Atomic ironing for conformal interfaces in freestanding oxide nanomembranes", "abstract": "Atomically well-defined interfaces are essential for realizing functional interlayer coupling in stacked and twisted oxide heterostructures, yet transferred freestanding oxides can develop structural inhomogeneities, including local curvatures, interfacial voids, and incomplete contacts with substrates. Here, we demonstrate that these transfer-induced structural disorders and imperfections evolve substantially and can be suppressed by post-transfer thermal treatments, yielding bulk-like crystalline freestanding oxide nanomembranes. Using freestanding SrTiO3 membranes as a model system, we report a systematic understanding of the role of \"atomic ironing\" and the associated evolution of lattice mosaicity, interfacial roughness, and optical bandgap. We further demonstrate atomically bonded conformal interfaces in twisted SrTiO3 heterostructures, highlighting the importance of post-transfer thermal processes. These results establish a synthetic strategy to restore the structural integrity and intrinsic bulk-like functionality of freestanding oxide nanomembranes, enabling stacked, twisted, and heterogeneously integrated oxide architectures with atomically well-defined interfaces for emerging quantum functionalities.", "url": "https://arxiv.org/abs/2610.19275", "type": "理论", "summary": "1. 该工作以自支撑SrTiO3纳米膜为模型，证明转移后热处理即“原子熨烫”可显著抑制局部弯曲、界面空洞和接触不完整等转移诱导缺陷，并恢复体相级晶体结构。\n2. 其技术卖点在于系统阐明原子熨烫过程中晶格马赛克度、界面粗糙度与光学带隙的演化，并在扭转SrTiO3异质结构中实现原子键合的共形界面。\n3. 该策略为恢复自支撑氧化物纳米膜的结构完整性及本征体相功能、构建原子级明确界面的堆叠/扭转/异质集成架构提供了合成思路，并有望推动新兴量子功能探索。", "summary_source": "deepseek", "authors": [{"name": "Jeongkeun Song"}, {"name": "Keaghan Knight"}, {"name": "Keun-Yeol Park"}, {"name": "Young-Hoon Kim"}, {"name": "Tyler J. Sachs"}, {"name": "Hu Miao"}, {"name": "Jiaqiang Yan"}, {"name": "Celesta S. Chang"}, {"name": "Ambrose Seo"}, {"name": "Ho Nyung Lee"}], "featured_authors": [{"name": "Jeongkeun Song"}, {"name": "Keaghan Knight"}, {"name": "Keun-Yeol Park"}, {"name": "Celesta S. Chang"}, {"name": "Ambrose Seo"}, {"name": "Ho Nyung Lee"}], "author_count": 10}, {"id": "2610.19276", "category": "cond-mat", "title": "Signatures of symmetry-stabilized Dirac fermions in correlated oxide CaNbO3 thin films", "abstract": "Symmetry-protected electronic states in correlated oxides offer a route to combining topology, lattice tunability, and many-body interactions, but creating such topological electronic states in complex oxides remains challenging. Here, we show that oxygen octahedral rotations provide a symmetry-control parameter for stabilizing Dirac-related electronic states in epitaxial CaNbO3 films. By comparing compressively strained tetragonal films and relaxed orthorhombic films, we demonstrate that distinct octahedral rotation patterns preserve nonsymmorphic symmetry and lead to distinct transport signatures consistent with Dirac-like electronic states. The films exhibit metallic transport with high mobility of 138,000 cm2 V-1 s-1, multichannel conduction, and Shubnikov-de Haas oscillations from small high-mobility Fermi pockets. Landau-fan diagram analysis indicates finite Berry-phase contributions, while first-principles calculations reveal a strain-driven evolution from nodal-line band crossings in the orthorhombic phase to Dirac-electron band features in the tetragonal phase. These results establish oxygen octahedral symmetry as a design knob for engineering topological electronic states in correlated perovskite oxides.", "url": "https://arxiv.org/abs/2610.19276", "type": "理论+数值", "summary": "1. 该工作在关联氧化物CaNbO3外延薄膜中，通过对比压应变四方相与弛豫正交相的氧八面体旋转模式，系统研究并识别对称性稳定的Dirac费米子输运特征。\n2. 其卖点在于高迁移率138000 cm2 V-1 s-1、多通道电导和来自小费米口袋的Shubnikov-de Haas振荡，以及Landau扇图所示有限Berry相位与第一性原理揭示的应变驱动能带从正交相节点线交叉到四方相Dirac特征的演化。\n3. 这确立了氧八面体对称性可作为设计旋钮，为在关联钙钛矿氧化物中调控拓扑电子态提供明确启示。", "summary_source": "deepseek", "authors": [{"name": "Yunkyu Park"}, {"name": "Seoung-Hun Kang"}, {"name": "Jeongkeun Song"}, {"name": "Minsik Kong"}, {"name": "Seohee Kim"}, {"name": "Shan Lin"}, {"name": "Eun Sang Choi"}, {"name": "Km Rubi"}, {"name": "Hua Zhou"}, {"name": "Sangmoon Yoon"}, {"name": "Hu Miao"}, {"name": "Satoshi Okamoto"}, {"name": "Jong Mok Ok"}, {"name": "Ho Nyung Lee"}], "featured_authors": [{"name": "Yunkyu Park"}, {"name": "Seoung-Hun Kang"}, {"name": "Jeongkeun Song"}, {"name": "Satoshi Okamoto"}, {"name": "Jong Mok Ok"}, {"name": "Ho Nyung Lee"}], "author_count": 14}, {"id": "2610.19284", "category": "cond-mat", "title": "Chern insulator optics", "abstract": "Chern insulators have optical properties that are strikingly different than ordinary chiral media. Unlike the natural optical activity of the latter, which is a finite-wavelength effect arising from spatial dispersion, the optical activity of a Chern insulator is already present in the long-wavelength limit, and exhibits a striking directional asymmetry in the propagation of circularly polarized light. We study this unnatural optical activity using a recently developed field theory for Chern insulators. For bulk Chern insulators, we derive the normal-incidence transmission and reflection coefficients of multilayer structures, identify the associated Faraday and Kerr angles, and show that these optical rotations provide a direct optical signature of topology at low frequencies. We also show that an interface between bulk Chern insulators can act as a kind of mirror, completely reflecting light at normal incidence when the Chern invariants have opposite signs. Moving to a more realistic model of a two-dimensional current sheet, we study the Faraday and Kerr effects in a thin film of $\\mathrm{Mn}\\mathrm{Bi}_2\\mathrm{Te}_4$ in its Chern insulator phase. The predicted rotations are many orders of magnitude larger than those of optically active media of comparable thickness that are topologically trivial.", "url": "https://arxiv.org/abs/2610.19284", "type": "理论", "summary": "1. 该文基于新近发展的陈绝缘体场论，系统研究了体态及二维电流片模型中的光学活性，推导了多层结构的正入射透射与反射系数，并给出法拉第与克尔旋转角及其拓扑关联。\n2. 其核心卖点在于：陈绝缘体的光学活性在长波极限下即存在，且对圆偏振光传播呈方向不对称；当界面两侧陈数反号时，该界面可充当正入射全反射镜，而在MnBi2Te4陈绝缘体薄膜中预测的旋转比同厚度拓扑平庸光学活性介质大若干数量级。\n3. 这表明低频法拉第/克尔旋转可作为拓扑的直接光学指纹，也为利用陈绝缘体薄膜与反号陈数界面探测拓扑相和设计基于陈数的光学响应提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Jason G. Kattan"}, {"name": "J. E. Sipe"}], "featured_authors": [{"name": "Jason G. Kattan"}, {"name": "J. E. Sipe"}], "author_count": 2}, {"id": "2610.19383", "category": "cond-mat", "title": "Phase Stability and Anisotropic Superconductivity in Ternary M2B4C2 (M=Ca, Mg) Monolayer", "abstract": "In this work, we investigate the phase stability, electronic structure, and superconducting properties of the two-dimensional ternary borocarbides MB$_4$C$_2$ (M = Ca, Mg) using first-principles calculations and fully anisotropic Migdal-Eliashberg theory. Ab initio molecular dynamics, phonon dispersion, and elastic constant calculations confirm that both monolayers are dynamically, thermally, and mechanically stable. Electronic structure analysis reveals an intrinsic metallic nature with a multiband Fermi surface, where states near the $\\Gamma$ point are dominated by in-plane B-$p_x$, $p_y$ orbitals, while zone-boundary states are primarily derived from out-of-plane B-$p_z$ orbitals. The electron-phonon coupling is determined to be $\\lambda = 0.64$ for both materials, driven by the rigid covalent B-B and B-C honeycomb networks. By solving the anisotropic Eliashberg equations, we predict that CaB$_4$C$_2$ and MgB$_4$C$_2$ are nodeless two-gap superconductors with critical temperatures ($T_c$) of 33.4 K and 33.8 K, respectively, at a Coulomb pseudopotential of $\\mu = 0.10$. Furthermore, the superconducting state remains robust under increased Coulomb repulsion ($\\mu = 0.13$), retaining elevated $T_c$ values of 31.2 K and 30.9 K, respectively. These findings establish MB$_4$C$_2$ monolayers as promising candidates for nanoscale superconducting applications and enrich the family of two-dimensional multigap superconductors.", "url": "https://arxiv.org/abs/2610.19383", "type": "理论+数值", "summary": "1. 该工作用第一性原理结合全各向异性Migdal-Eliashberg理论，系统研究了三元硼碳化物MB4C2（M=Ca、Mg）单层的相稳定性、电子结构与超导性质。\n2. 其要点在于以分子动力学、声子色散与弹性常数计算确证动态、热与力学稳定性，揭示多带金属性费米面及B-B/B-C共价网络主导的λ=0.64耦合，并由各向异性Eliashberg方程预言Tc约33.4 K与33.8 K的无节点双能隙超导，在μ=0.13时仍保持约31 K。\n3. 该结果将MB4C2单层确立为纳米尺度超导的候选材料，并拓展了二维多能隙超导体系。", "summary_source": "deepseek", "authors": [{"name": "Jakkapat Seeyangnok"}, {"name": "Udomsilp Pinsook"}, {"name": "Graeme J Ackland"}], "featured_authors": [{"name": "Jakkapat Seeyangnok"}, {"name": "Udomsilp Pinsook"}, {"name": "Graeme J Ackland"}], "author_count": 3}, {"id": "2610.19620", "category": "cond-mat", "title": "Emergent medium-range order in amorphous silicon", "abstract": "Medium-range order (MRO) is an important feature of amorphous materials, but its nature in terms of atomic arrangement has remained elusive. Here, using large-scale machine-learning-driven atomistic simulations of amorphous silicon, we probe the MRO of this archetypal network glass. By characterizing the structure in three dimensions, we reveal that the symmetry of the atomic arrangement around a central atom shows a crossover as a function of distance. At short distances, the structure is determined by local bonding constraints, which evolve from predominantly tetrahedral environments in low-density amorphous silicon to highly coordinated and strongly disordered local environments in very-high-density amorphous silicon. At larger distances, however, distinct cubic- and octahedral-symmetry patterns emerge in the three-dimensional atomic-density distribution, despite the absence of these symmetries at shorter length scales. We find that this crossover is accompanied by a quasi-periodic spatial organization of the topological rings in the structure. The characteristic spacing between ring centers matches the length scale of the first sharp diffraction peak (FSDP) in the structure factor, establishing a direct connection between this reciprocal-space signature of MRO and its real-space organization. These results demonstrate that the FSDP, the spatial correlation of the rings, and emergent orientational symmetries are not independent manifestations of MRO, but reflect different aspects of a common structural organization. Our findings provide a unified real-space picture of MRO in amorphous silicon and suggest that intermediate-range structural order in network glasses emerges from the interplay between local bonding constraints and extended atomic arrangements driven by efficient packing.", "url": "https://arxiv.org/abs/2610.19620", "type": "理论+数值", "summary": "1. 该工作用大规模机器学习原子模拟研究非晶硅中程有序，通过三维结构表征揭示中心原子周围原子排列对称性随距离的交叉。\n2. 短程由局部成键约束主导，从低密度非晶硅的四面体环境变为极高密度下的高配位强无序环境；长程三维原子密度却涌现立方与八面体对称，并伴随拓扑环准周期组织，环心间距与第一锐衍射峰尺度一致。\n3. 这说明第一锐衍射峰、环空间关联与涌现取向对称性并非独立，而是同一中程有序的不同侧面，为网络玻璃中程有序提供统一实空间图像，并提示其源于局部成键约束与高效堆叠驱动的扩展排列之竞争。", "summary_source": "deepseek", "authors": [{"name": "Zhen Zhang"}, {"name": "Stephen R. Elliott"}, {"name": "Yujie Wang"}, {"name": "Walter Kob"}], "featured_authors": [{"name": "Zhen Zhang"}, {"name": "Stephen R. Elliott"}, {"name": "Yujie Wang"}, {"name": "Walter Kob"}], "author_count": 4}, {"id": "2610.19631", "category": "cond-mat", "title": "Active Sculpting: morphodynamics of internally stirred active vesicles", "abstract": "Active flows are often confined by soft, deformable boundaries that they can push against, reshape, and in turn get reorganized by. Motivated by this interplay, we combine theory and numerical simulations to analyze the morphodynamics of an elastic vesicle enclosing a dilute suspension of extensile active particles. We model the two-dimensional vesicle as a weakly extensible elastic ring with bending rigidity, immersed in a Stokesian fluid, and describe the confined active suspension using a kinetic theory. The vesicle and the suspension are coupled hydrodynamically, through the kinematic and dynamic boundary conditions at the interface, and energetically, through a single alignment interaction that simultaneously aligns active particles with the membrane and the membrane with the particles. We show that this interaction reduces to a weak-anchoring boundary condition familiar from passive liquid crystals and derive a closed-form quiescent equilibrium state in which the nematic order in the suspension organizes into a vortex with a +1 defect core. A stability analysis of this state predicts an ordered hierarchy of activity thresholds at which successive shape modes of the vesicle are destabilized, as well as a purely passive, anchoring-driven instability of floppy vesicles. Nonlinear simulations, performed with a volume-conserving immersed boundary method, reveal that each threshold crossing gives rise to a distinct emergent state: a static spindle with boundary-pinned defects, a rotor that tank treads against its own rotation, a fluctuating spinner, and a turbulent state in which the vesicle acts as a self-stirring compartment. Beyond demonstrating how boundary deformability sculpts, and is sculpted by, confined active matter, our results open the door to study hydrodynamic interactions between such active vesicles and to use membrane fluctuations as a probe of activity of suspensions.", "url": "https://arxiv.org/abs/2610.19631", "type": "理论+数值", "summary": "1. 该工作结合理论与数值模拟，研究含伸展型活性颗粒稀悬浮液的弹性囊泡形态动力学，将二维弱可伸、具弯曲刚度的弹性环浸于斯托克斯流体，并以动理学理论描述受限活性悬浮液。\n2. 其核心在于引入单一取向相互作用，使颗粒与膜相互对齐，等价于被动液晶的弱锚定边界条件，从而得到具+1缺陷涡旋的静态平衡态，并预测活性阈值层级及纯被动锚定失稳。\n3. 非线性模拟进一步揭示随阈值跨越出现静态纺锤（边界钉扎缺陷）、滚轮、振荡旋转体与湍流态等不同状态，表明膜变形与受限活性物质相互塑造，并可用膜涨落探测悬浮液活性及研究活性囊泡间流体力学相互作用。", "summary_source": "deepseek", "authors": [{"name": "Devadevan M M"}, {"name": "Brato Chakrabarti"}], "featured_authors": [{"name": "Devadevan M M"}, {"name": "Brato Chakrabarti"}], "author_count": 2}, {"id": "2610.19727", "category": "cond-mat", "title": "Role of Gd 5d-Au 5d hybridization for the magnetic properties of Au-Al-Gd quasicrystal approximants", "abstract": "We have studied the electronic states of magnetic Au-Al-Gd quasicrystal approximants, which exhibit different magnetic ground states at low temperatures, by orbital-selective soft and hard x-ray electron spectroscopies in the paramagnetic phase. Our results reveal that the valence electronic states vary among the Au-Al-Gd approximants with different magnetic ground states, whereas the Gd 4f electrons are localized in all of them. In particular, we find that the Gd 5d states are hybridized with the Au 5d states around the Fermi level, providing information about a local pathway for the intersite exchange interaction between the localized Gd 4f electrons. This hybridization strength varies among these samples. Our findings bring an orbital-resolved microscopic picture to the magnetism of rare-earth-based quasicrystals and approximants.", "url": "https://arxiv.org/abs/2610.19727", "type": "数值", "summary": "1. 该工作利用轨道选择性的软、硬X射线电子能谱，在顺磁相测量了具有不同低温磁基态的金-铝-钆准晶近似相的电子态。\n2. 其核心发现是钆4f电子在所有样品中均局域，而价电子态随不同低温磁基态而异；钆5d与金5d在费米能级附近杂化，为局域钆4f间的跨位交换相互作用提供局域通道，且该杂化强度因样品而变。\n3. 这为稀土基准晶及其近似相的磁性提供了轨道分辨的微观图像，并提示钆5d-金5d杂化强度可作为联系磁基态与交换耦合的关键参量。", "summary_source": "deepseek", "authors": [{"name": "Goro Nozue"}, {"name": "Hidenori Fujiwara"}, {"name": "Satoru Hamamoto"}, {"name": "Yuto Torii"}, {"name": "Mai Sakaguchi"}, {"name": "Sho Nakajima"}, {"name": "Takuya D. Nakamura"}, {"name": "Nonoka U. Sakamoto"}, {"name": "Takayuki Kiss"}, {"name": "Masaki Oura"}, {"name": "Akira Yasui"}, {"name": "Kotaro Higashi"}, {"name": "Naomi Kawamura"}, {"name": "Kojiro Mimura"}, {"name": "Arata Tanaka"}, {"name": "Asuka Ishikawa"}, {"name": "Farid Labib"}, {"name": "Shintaro Suzuki"}, {"name": "Takafumi D. Yamamoto"}, {"name": "Ryuji Tamura"}, {"name": "Akira Sekiyama"}], "featured_authors": [{"name": "Goro Nozue"}, {"name": "Hidenori Fujiwara"}, {"name": "Satoru Hamamoto"}, {"name": "Takafumi D. Yamamoto"}, {"name": "Ryuji Tamura"}, {"name": "Akira Sekiyama"}], "author_count": 21}, {"id": "2610.19744", "category": "cond-mat", "title": "Resolving Structural Uncertainty in Stochastic Dynamical Systems via Ensemble-Based Bayesian Inference", "abstract": "Recovering the interaction structure of complex stochastic dynamical systems from sparse time-series observations is an inherently ill-posed inverse problem. The posterior over network configurations is high-dimensional, highly degenerate, and shaped by the non-equilibrium nature of the available data. To address this, we propose a fully Bayesian, ensemble-based inference framework. Our approach grounds a continuous-time Stochastic Differential Equation (SDE) likelihood formulation---acting mathematically as an Onsager-Machlup quasi-potential for non-equilibrium paths---within a non-parametric Minimum Description Length (MDL) structural prior. This framework rigorously penalizes model complexity and avoids kinetic overfitting by forcing continuous parameters into a finite vocabulary of discrete categories. The joint posterior is optimized using a block-coordinate scheme combining sub-quadratic Markov Chain Monte Carlo (MCMC) topological sampling with deterministic Nelder-Mead parameter optimization. Using highly non-linear macroscopic population dynamics as a benchmark, we demonstrate that inference requires non-stationary transient data to resolve causal information. Furthermore, we prove that propagating structural uncertainty via ensemble-based posterior analysis produces significantly more robust and reliable predictions for downstream perturbation outcomes than traditional single-point (MAP) estimates. The framework is highly generalizable, capturing fundamental topological constraints even under severe generative model mismatches, offering a robust tool for uncertainty-aware inference in complex stochastic systems.", "url": "https://arxiv.org/abs/2610.19744", "type": "理论+数值", "summary": "1. 该工作提出基于系综的全贝叶斯框架，用分块MCMC与Nelder-Mead优化后验，从稀疏时序推断随机动力系统的交互结构。\n2. 其卖点是以连续时间SDE似然作为Onsager-Machlup拟势，并用MDL先验与离散参数词表抑制动力学过拟合。\n3. 该结果表明：非平稳瞬态数据对因果辨识不可或缺，系综后验传播结构不确定性比MAP更稳健，并可推广至模型严重失配场景。", "summary_source": "deepseek", "authors": [{"name": "Francesco Zambelli"}, {"name": "Valeria D'Andrea"}, {"name": "Manlio De Domenico"}], "featured_authors": [{"name": "Francesco Zambelli"}, {"name": "Valeria D'Andrea"}, {"name": "Manlio De Domenico"}], "author_count": 3}, {"id": "2610.19793", "category": "cond-mat", "title": "Orientation-Dependent Universality of Spin-Transport Fluctuations in Two-Dimensional Altermagnets", "abstract": "Universal conductance fluctuations are conventionally organized by symmetry class, but crystalline anisotropy introduces additional structure in spin transport. Here we demonstrate orientation-dependent universal spin-transport fluctuations in disordered two-dimensional $d$-wave altermagnets without spin-orbit coupling. Rotating the altermagnetic orientation changes both longitudinal spin-conductance and transverse spin-Hall conductance fluctuations, while each conserved-spin sector remains in class AI. Altermagnetic orientation controls both the fluctuation amplitudes and the development of disorder-insensitive plateaus. These plateaus become flatter and less sensitive to the altermagnetic strength over the studied parameter ranges as the orientation approaches $45^\\circ$, with representative fluctuation amplitudes of approximately $0.60e/(4\\pi)$ for the longitudinal spin conductance and $0.40\\,e/(4\\pi)$ for the spin-Hall conductance. The longitudinal fluctuation amplitude correlates strongly with anisotropy of the clean-band Fermi-velocity tensor. Spin-sector covariances explain how the conserved channels combine into total fluctuations. Our results extend anisotropy-sensitive universal-fluctuation physics to conserved-spin altermagnetic transport and establish crystalline orientation as a control parameter within a fixed symmetry class.", "url": "https://arxiv.org/abs/2610.19793", "type": "理论", "summary": "1. 该工作研究了无自旋轨道耦合的二维d波交替磁体中无序诱导的自旋输运普适涨落，发现旋转交替磁取向会改变纵向自旋电导和横向自旋霍尔电导涨落，而各守恒自旋扇区仍属AI对称类。\n2. 其核心机制是各守恒自旋扇区保持AI类，但晶体取向可在固定对称类内调控涨落幅度与无序不敏感平台；45°附近平台更平坦且对交替磁强度更弱，纵向与自旋霍尔典型幅度分别约0.60e/(4π)和0.40e/(4π)。\n3. 该结果将各向异性敏感的普适涨落物理拓展至守恒自旋的交替磁输运，并确立晶体取向作为固定对称类内的控制参数，为后续自旋电子学器件与相关实验提供启发。", "summary_source": "deepseek", "authors": [{"name": "Yihan Zhang"}, {"name": "Zheng Qin"}, {"name": "Donghui Xu"}, {"name": "Junjie Zeng"}, {"name": "Zhen Ning"}, {"name": "Rui Wang"}], "featured_authors": [{"name": "Yihan Zhang"}, {"name": "Zheng Qin"}, {"name": "Donghui Xu"}, {"name": "Junjie Zeng"}, {"name": "Zhen Ning"}, {"name": "Rui Wang"}], "author_count": 6}, {"id": "2610.19809", "category": "cond-mat", "title": "Interplay of electric field and electronic correlations in pairing competition in bilayer nickelates", "abstract": "Layer polarization provides a means of tuning the competition between interlayer and intralayer pairing in bilayer nickelates. Using ground-state constrained-path quantum Monte Carlo, we study interlayer $s^{\\pm}$ and intralayer $d$ pairing in a bilayer two-orbital Hubbard model with a layer potential-energy difference $\\varepsilon$ representing an effective perpendicular electric field. Within the parameter range studied, increasing $\\varepsilon$ generally enhances the finite-size pairing vertex contribution $V_d$ and reduces $V_{s^{\\pm}}$, shifting the relative pairing preference toward the $d$-wave channel. Increasing the onsite repulsion enhances both vertex contributions, more strongly in the $d$-wave channel, whereas increasing the crystal-field splitting reduces both and makes $s^{\\pm}$ pairing relatively more competitive. Hund's coupling increases the relative competitiveness of $s^{\\pm}$ pairing at weak bias, while enhancing the relative strength of $d$-wave pairing at large bias. The bias primarily redistributes charge between layers within each orbital sector, accompanied by an increase in the antiferromagnetic spin structure factor. Hund's coupling also enhances local interorbital parallel-spin correlations. These observations suggest possible connections between charge redistribution, magnetic correlations, and pairing competition, offering insight into how layer polarization and multiorbital interactions influence the relative pairing tendencies in the bilayer nickelate model.", "url": "https://arxiv.org/abs/2610.19809", "type": "理论+数值", "summary": "1. 该工作用约束路径量子蒙特卡洛研究双层双轨道哈伯德模型中层间s±与层内d配对竞争，并以层势差ε模拟垂直电场。\n2. 其关键卖点是增大ε提升V_d并降低V_s±，U增强两者、晶体场分裂削弱两者，洪特耦合随偏置改变相对优势；机制涉及层间电荷再分布与反铁磁关联增强。\n3. 这些结果提示电荷再分布、磁关联与配对竞争相互关联，为理解层极化与多轨道相互作用如何调控双层镍酸盐配对倾向提供启发。", "summary_source": "deepseek", "authors": [{"name": "Yanmei Cai"}, {"name": "Yicheng Xiong"}, {"name": "Ying Liang"}, {"name": "Tianxing Ma"}], "featured_authors": [{"name": "Yanmei Cai"}, {"name": "Yicheng Xiong"}, {"name": "Ying Liang"}, {"name": "Tianxing Ma"}], "author_count": 4}, {"id": "2610.19816", "category": "cond-mat", "title": "Nonadiabatic dynamics under slow parametric modulation in nonlinear graphene resonators", "abstract": "Resonantly driven nonlinear systems, from superconducting circuits to nanomechanical resonators, are often described in a rotating frame, where amplitude and phase evolve slowly within a fixed landscape of stable and unstable states. How such systems behave when this landscape moves on their intrinsic timescale remains to be understood. Here, we exploit the strong tension sensitivity of a graphene drum's resonance frequency to reshape the rotating-frame phase space of a bistable mechanical mode in real time, combining an MHz-frequency resonant drive with kHz-frequency tension modulation. When the modulation rate becomes comparable to the mechanical relaxation rate, adiabatic tracking of the fixed points breaks down. Instead, parametric instabilities emerge in the slow dynamics at frequencies set by libration around these points rather than by the mechanical resonance; stronger modulation drives period doubling and chaos. A slow-variable theory predicts where the instabilities occur, and Melnikov analysis captures the onset of chaos. These results show that the rotating frame itself can be parametrically driven, offering a general route to controlling nonadiabatic dynamics in systems ranging from Josephson bifurcation amplifiers to cold atoms.", "url": "https://arxiv.org/abs/2610.19816", "type": "理论", "summary": "1. 该工作在石墨烯鼓谐振器中，以MHz共振驱动叠加kHz张力调制，实时重塑双稳机械模式的旋转框架相空间，研究慢参数调制引发的非绝热动力学。\n2. 其关键发现是，当调制速率接近机械弛豫率时，固定点的绝热跟踪失效，慢动力学中出现由固定点周围天平动频率而非机械共振频率设定的参数不稳定性，更强调制导致倍周期分岔与混沌；慢变量理论预测失稳区域，Melnikov分析刻画混沌起始。\n3. 这揭示旋转框架本身可被参数驱动，为从约瑟夫森分岔放大器到冷原子等平台中调控非绝热动力学提供了通用思路。", "summary_source": "deepseek", "authors": [{"name": "Chris F. D. Wattjes"}, {"name": "Haemin Lim"}, {"name": "Pierpaolo Belardinelli"}, {"name": "John E. Sader"}, {"name": "Peter G. Steeneken"}, {"name": "Farbod Alijani"}], "featured_authors": [{"name": "Chris F. D. Wattjes"}, {"name": "Haemin Lim"}, {"name": "Pierpaolo Belardinelli"}, {"name": "John E. Sader"}, {"name": "Peter G. Steeneken"}, {"name": "Farbod Alijani"}], "author_count": 6}, {"id": "2610.19841", "category": "cond-mat", "title": "Error-controlled switching between discrete and continuum dislocations in a unified defect framework", "abstract": "Simulating defects of every dimension together is expensive, and the savings of adaptive methods are rarely tested at equal accuracy. We present a variational framework in which fields, dislocation lines and defect densities share one free energy, one dissipation law and exact ledgers of mass and Burgers vector, so that a region can change its representation without gaining or losing defects. On this basis, an allocator switches the dislocations themselves between discrete particles, where they are sparse, and a continuous density, where they are dense. The switch is made block by block from local counts, conserves the Burgers vector exactly and is controlled by a single threshold. For $5\\times10^5$ dislocations, the allocator reproduces the discrete model to within 1% in the sparse region at 14-37 times lower cost, depending on the machine; the advantage grows to 81 times at $10^6$ dislocations, and a threshold calibrated on one ensemble meets its error target on an independent one. For an idealized array of dislocation walls in copper, the allocator is 37.5 times cheaper than particle dislocation dynamics and, at almost the same cost, six times more accurate than continuum dislocation dynamics between the walls. In a three-dimensional copper model coupling grain-boundary cavitation with damage, ligaments left at nominal coalescence delay creep rupture by 25-48% (post hoc sweep). By contrast, grids refined at interfaces gain less than twofold once the active region exceeds about 30% of the domain, so representation switching, rather than grid refinement, is the effective form of adaptivity for defect-rich microstructures.", "url": "https://arxiv.org/abs/2610.19841", "type": "理论+数值", "summary": "1. 该工作提出统一缺陷变分框架，使场、位错线与缺陷密度共享同一自由能、耗散律及质量与Burgers矢量精确账本。\n2. 其技术卖点是逐块按局部计数切换离散粒子与连续密度，单阈值控制并精确守恒Burgers矢量，稀疏区误差<1%而成本降低14–81倍。\n3. 该框架在铜中比粒子位错动力学便宜37.5倍且比连续位错动力学精度高6倍，显示表示切换优于界面网格细化，并为蠕变断裂等多尺度预测提供新思路。", "summary_source": "deepseek", "authors": [{"name": "Albert Linda"}], "featured_authors": [{"name": "Albert Linda"}], "author_count": 1}, {"id": "2610.19842", "category": "cond-mat", "title": "Nonadiabatic polaron dynamics from machine-learned hopping trajectories", "abstract": "The formation and motion of small polarons are ubiquitous in energy materials and influence photoinduced processes. Polaron transport is governed by thermally activated lattice dynamics and rare hopping events, requiring spatial and temporal scales only attainable with machine-learning molecular dynamics, which enables extensive sampling of atomic trajectories and polaron configurations over nanoseconds. Moreover, the Born-Oppenheimer approximation underlying standard ab initio molecular dynamics cannot describe the nonadiabatic coupling between electronic states mediated by nuclear motion, which controls energy exchange and excited-state relaxation. Here, we develop a simulation framework that combines machine-learning-assisted polaron dynamics with nonadiabatic molecular dynamics to bridge these complementary aspects of polaron physics, and determine how different polaron-hopping mechanisms affect excited-state dynamics. The enlarged trajectory space allows us to provide the first direct dynamical confirmation of the adiabatic or nonadiabatic classification of polaron hopping regimes originally proposed on the basis of static Marcus-theory arguments, and to connect individual hopping events directly to nonadiabatic electronic transitions. In bulk TiO$_2$, nonadiabatic hoppings occur preferentially when the energy of the polaron-induced gap state approaches the conduction-band manifold, promoting both electronic de-excitation and, via a Landau-Zener mechanism, excitation from the ground state. In MgO, the predominantly adiabatic character of hole-polaron hopping suppresses these effects, leading to longer charge-carrier lifetimes and an absence of thermally activated excitations. At the rutile TiO$_2$(110) surface, hopping events are rarer than in bulk because the excess electron is strongly stabilized in the subsurface region, leading to correspondingly longer de-excitation times.", "url": "https://arxiv.org/abs/2610.19842", "type": "理论+数值", "summary": "1. 该工作构建了机器学习辅助的极化子动力学与非绝热分子动力学相结合的模拟框架，用于研究极化子跳跃对激发态动力学的影响。\n2. 其卖点是首次直接动力学验证基于静态Marcus理论的极化子跳跃绝热/非绝热分类，并把单次跳跃与非绝热电子跃迁关联。\n3. 在TiO2、MgO及金红石TiO2(110)表面的结果说明，跳跃绝热性影响退激发与载流子寿命。", "summary_source": "deepseek", "authors": [{"name": "Daniela Mangano"}, {"name": "Luca Leoni"}, {"name": "Zhongfei Xu"}, {"name": "Li-Min Liu"}, {"name": "Cesare Franchini"}], "featured_authors": [{"name": "Daniela Mangano"}, {"name": "Luca Leoni"}, {"name": "Zhongfei Xu"}, {"name": "Li-Min Liu"}, {"name": "Cesare Franchini"}], "author_count": 5}, {"id": "2610.19870", "category": "cond-mat", "title": "Understanding the Mpemba Effect through a Rule of Thumb", "abstract": "In the Mpemba effect, a system prepared farther from equilibrium relaxes faster than one prepared closer to it. Its persistence across diverse systems, and under different dynamics of the same system, suggests that it is largely rooted in equilibrium properties, with the dynamics deciding only which mode relaxes slowest. Here we propose a simple rule of thumb for anticipating the Mpemba effect: the effect is expected when a single low-order equilibrium moment is nonmonotonic in temperature. The bath singles out this moment as the slowest to relax, so that its displacement from its bath value sets the amplitude of the slowest relaxation mode. We establish this relation exactly for low-dimensional Ornstein--Uhlenbeck processes. We then extend the rule to mean-field models by approximating their relaxation near the final equilibrium state by an Ornstein--Uhlenbeck process. For the mean-field Ising antiferromagnet, which we solve exactly in the thermodynamic limit, this approximation reproduces the main structure of the Mpemba phase diagram, including strong effects far from any phase transition. Finally, we give a general prescription for mean-field systems: identify the slowest symmetry-allowed moment of the normal coordinates at the bath, and follow its equilibrium value as a function of preparation temperature. This offers a practical route from equilibrium observables to anomalous relaxation without diagonalizing the dynamics.", "url": "https://arxiv.org/abs/2610.19870", "type": "理论+数值", "summary": "1. 该工作提出一个判断姆潘巴效应的经验法则：当某个低阶平衡矩随温度非单调时，远离平衡的制备态会表现出更快的弛豫。\n2. 其核心机制是浴将这一低阶矩选为最慢弛豫量，其相对浴平衡值的偏移决定最慢模式的振幅；作者在低维奥恩斯坦-乌伦贝克过程中严格证明，并通过平均场近似推广至多体模型。\n3. 对平均场伊辛反铁磁体，该近似复现了姆潘巴相图的主要结构，并给出无需对角化动力学、仅从平衡可观测矩判断异常弛豫的实用方案。", "summary_source": "deepseek", "authors": [{"name": "Ran Yaacoby"}], "featured_authors": [{"name": "Ran Yaacoby"}], "author_count": 1}, {"id": "2610.19985", "category": "cond-mat", "title": "Absolute area under a scaled Brownian motion with resetting", "abstract": "We investigate the statistical properties and ergodic behavior of the absolute area below the trajectory of a particle subject to stochastic resetting and moving according to a scaled Brownian motion with exponent $\\beta$. We compare the contributions to the absolute area from the waiting times between resets and the backward recurrence time. Using the renewal formalism we derive the lower-order moments of the absolute area under both Poissonian and heavy-tailed power-law resetting waiting time distributions with exponent $\\alpha$. For Poissonian resetting, stochastic interruption suppresses fluctuations, driving the area to be ergodic, regardless of the value of $\\beta$. In contrast, power-law resetting yields a rich spectrum of ergodic regimes. For $0 < \\alpha < 1$, the system displays weak ergodicity breaking and the maximum contribution dominates the area accumulated during the waiting times. For $1+\\beta < \\alpha < 2$, we unveil an ergodic transition exclusive to the subdiffusive regime at $\\alpha=1+\\beta$, where ergodicity is restored. These results clarify the subtle interplay between anomalous diffusion and power-law waiting times between resettings. Our results are tested by numerical simulations exhibiting an excellent agreement.", "url": "https://arxiv.org/abs/2610.19985", "type": "数值", "summary": "1. 该工作研究指数为β的标度布朗运动在随机重置下轨迹下方绝对面积的统计性质与遍历行为，并区分重置间等待时间与后向复发时间的贡献。\n2. 借助更新形式导出泊松与幂律重置下绝对面积的各阶低阶矩：泊松重置抑制涨落、使面积遍历且与β无关，幂律重置则给出丰富遍历相图。\n3. 0<α<1时呈弱遍历破缺且最大等待贡献主导，1+β<α<2时在α=1+β出现亚扩散区特有的遍历恢复，凸显反常扩散与幂律重置等待间的微妙耦合。", "summary_source": "deepseek", "authors": [{"name": "Vicenç Méndez"}, {"name": "Javier Cristín"}], "featured_authors": [{"name": "Vicenç Méndez"}, {"name": "Javier Cristín"}], "author_count": 2}, {"id": "2610.19995", "category": "cond-mat", "title": "Deep Learning of Phase Transitions for Bilinear-Biquadratic Spin-1 Chains from Correlation Aspects", "abstract": "We investigate the role of different correlation functions in reconstructing the phase diagram of the spin-1 bilinear-biquadratic chain, parametrized by the angle $\\theta$ between the bilinear and biquadratic couplings, using our previously developed label-free machine-learning pipeline \\cite{Ming21, Ming23}, in which an autoencoder compresses iDMRG correlation matrices into latent features and K-means clustering with silhouette analysis groups them into phases. Without any prior labels, the scheme reveals four natural phases, the Haldane, dimerized, critical trimerized, and ferromagnetic phases, and accurately locates the Takhtajan-Babujian ($\\theta=-\\pi/4$), $SU(3)$-symmetric Uimin-Lai-Sutherland ($\\theta=\\pi/4$), and Ferro-Dimer ($\\theta=5\\pi/4$) transition points; a shallow supervised refinement further sharpens the phase boundaries. We find that different correlation functions play fundamentally different roles in phase identification. The $SU(3)$-symmetric correlation alone selects a four-cluster partition that can be associated with the four phases, whereas the spin-spin and dimer-dimer correlations must be combined to recover the complete phase diagram. In contrast, the trimer-trimer correlation behaves as a marginal correlation: it is insufficient for phase identification by itself but improves the precision of the predicted phase boundaries when combined with the other correlations. Furthermore, the latent representations and silhouette values reveal signatures that we relate to the $\\theta$ dependence of the correlations within each phase and, tentatively, to the underlying renormalization-group structure. These results demonstrate that machine learning can not only identify quantum phases but also uncover the physical information encoded in different correlation functions.", "url": "https://arxiv.org/abs/2610.19995", "type": "理论+数值", "summary": "1. 该工作利用无标签机器学习流程，将iDMRG关联矩阵经自编码器压缩到潜空间，再用K-means与轮廓分析重构自旋-1双线性-双二次链随θ变化的相图。\n2. 其核心在于揭示不同关联函数的分工：仅SU(3)对称关联即可划分四个相，而自旋-自旋与二聚-二聚关联需联合才能恢复完整相图，三聚-三聚关联虽不能单独区分相却能提高边界精度。\n3. 该框架无需先验标签即可定位TB、ULS与Ferro-Dimer转变点，并表明机器学习可反推出关联函数编码的物理信息及可能的RG结构。", "summary_source": "deepseek", "authors": [{"name": "Ming-Chiang Chung"}, {"name": "Yu-Ting Kuo"}, {"name": "Ian McCulloch"}, {"name": "Yuan-Hong Tsai"}], "featured_authors": [{"name": "Ming-Chiang Chung"}, {"name": "Yu-Ting Kuo"}, {"name": "Ian McCulloch"}, {"name": "Yuan-Hong Tsai"}], "author_count": 4}, {"id": "2610.20043", "category": "cond-mat", "title": "Dicke model of open-shell atoms with tensor polarizability", "abstract": "We study the extended Dicke model obtained from the scalar--vector--tensor polarizability of open-shell atoms coupled to a shared cavity mode. For a single electric-dipole channel, rotational symmetry fixes the tensor to vector ratio; we use $^{168}\\mathrm{Er}$ with $J=6$ as a product-state example. A circular pump produces a chiral Raman vertex whose tensor-dependent matrix elements select the occupied Zeeman sector. The resulting first-order transition occurs before the empty-cavity branch loses local stability, and the ordered state is read out through $\\langle\\hat J_z\\rangle$. A linear pump instead produces an empty-cavity $\\pm x$ cat and a continuous transition into an even-$m$ cat-like state with order parameter $\\langle\\hat J_z^2\\rangle$. With cavity loss alone, the circular trajectory emits a photon burst and approaches a Raman-dark Zeeman pole rather than a finite-field condensate. In the linear geometry, cavity-bright modes are damped toward the cat-like branch while a dark spin mode remains undamped. These are phenomena of that model; the vector-only controls show that they depend on the channel-fixed tensor coupling.", "url": "https://arxiv.org/abs/2610.20043", "type": "理论", "summary": "1. 该工作围绕《Dicke model of open-shell atoms with tensor polarizability》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Ziheng Zhu"}, {"name": "Yu Chen"}], "featured_authors": [{"name": "Ziheng Zhu"}, {"name": "Yu Chen"}], "author_count": 2}, {"id": "2610.20063", "category": "cond-mat", "title": "Sorption Molecular Dynamics of Point Defects in 2D Materials with a Machine Learning Potential", "abstract": "Defect engineering is a crucial tool for tuning and tailoring the properties of two-dimensional (2D) materials. A key challenge is identifying which defects are kinetically stable at room temperature and sufficiently promising to warrant further investigation. However, identifying stable defects with suitable properties using first-principles calculations, such as density functional theory (DFT) is computationally demanding, effectively limiting the scope of high-throughput studies. In this work, we investigate whether the machine learning interatomic potential MACE can reproduce sorption trends (adsorption vs. absorption) previously obtained from high-throughput DFT calculations and extend the analysis to elevated temperatures. A total of 17,624 defect structures from the ADAQ database are simulated using MACE-accelerated molecular dynamics (MD) at both 0 K and 300 K. The results show that MACE successfully reproduces the overall sorption trends observed in DFT calculations at 0 K at a fraction of the computational cost. Simulations performed at 300 K further indicate that the qualitative sorption trends remain largely the same when including finite-temperature effects. These findings demonstrate that MACE-driven MD can be used as an effective high-throughput prescreening tool for defect-related studies in 2D materials, specially related to sorption. While conventional first-principles methods, such as DFT, remain necessary for accurate and quantitative validation, the use of MLIPs enables MD simulations of finite-temperature defect behavior at a fraction of the computational cost of DFT-based MD.", "url": "https://arxiv.org/abs/2610.20063", "type": "理论+数值", "summary": "1. 该工作利用机器学习原子间势 MACE 对 ADAQ 数据库中 17,624 个二维材料点缺陷结构开展分子动力学模拟，在 0 K 与 300 K 下比较吸附/吸收趋势并与高通量 DFT 结果对照。\n2. 其技术优势在于以远低于 DFT-MD 的成本复现 0 K 下 DFT 的总体吸附趋势，并显示 300 K 有限温度效应基本不改变定性趋势。\n3. 这表明 MACE 驱动的 MD 可作为二维材料缺陷吸附研究的高通量预筛选工具，而 DFT 仍用于精确定量验证，并为有限温度缺陷行为模拟提供高效途径。", "summary_source": "deepseek", "authors": [{"name": "Nils-Ruben Skogemyr"}, {"name": "Albin Sjöstedt"}, {"name": "Isak Wernroth"}, {"name": "Isak Häggqvist"}, {"name": "Isac Ljungwald"}, {"name": "Hans-Ove Åkesson"}, {"name": "Henricus R.A. ten Eikelder"}, {"name": "Rickard Armiento"}, {"name": "Joel Davidsson"}], "featured_authors": [{"name": "Nils-Ruben Skogemyr"}, {"name": "Albin Sjöstedt"}, {"name": "Isak Wernroth"}, {"name": "Henricus R.A. ten Eikelder"}, {"name": "Rickard Armiento"}, {"name": "Joel Davidsson"}], "author_count": 9}, {"id": "2610.20127", "category": "cond-mat", "title": "Identification of carbon-related color centers in hBN by high-resolution ab initio photoluminescence modeling", "abstract": "Identification of optically active defects in hexagonal boron nitride (hBN) remains challenging because different defect candidates can produce similar calculated photoluminescence (PL) lineshapes. Here, we demonstrate that force-constant embedding methodology can be extended to calculate high-resolution, vibrationally resolved PL lineshapes in the polar layered material hBN. Benchmarking against the carbon dimer defect, responsible for the 4.1 eV emission, we show that the methodology accurately reproduces the low-energy acoustic phonons and fine spectral features that are inaccessible when using direct supercell calculations. Applying the methodology to neutral carbon trimers ($\\mathrm{C_2 C_B}$ and $\\mathrm{C_2 C_N}$), we find that the calculated PL lineshape and excitation energy of $\\mathrm{C_2 C_N}$ closely match the low-temperature spectrum of the emitter with a zero-phonon line at 1.54 eV. These results establish high-resolution phonon-sideband modeling as a powerful tool for discriminating among candidate defects in polar materials.", "url": "https://arxiv.org/abs/2610.20127", "type": "理论+数值", "summary": "1. 该工作将力常数嵌入方法拓展至极性层状hBN，计算高分辨振动分辨光致发光线型，并用于甄别碳相关色心。\n2. 其核心是力常数嵌入能重现直接超胞难以给出的低能声学声子和精细声子边带，且C2CN的PL线型与激发能匹配1.54 eV零声子线发射体。\n3. 这表明高分辨声子边带建模可作为极性材料中甄别候选缺陷的有力工具，并为hBN色心指认提供依据。", "summary_source": "deepseek", "authors": [{"name": "Vytautas Žalandauskas"}, {"name": "Marek Maciaszek"}, {"name": "Marianne Etzelmüller Bathen"}, {"name": "Julius Janušonis"}, {"name": "Tadas Paulauskas"}, {"name": "Lukas Razinkovas"}], "featured_authors": [{"name": "Vytautas Žalandauskas"}, {"name": "Marek Maciaszek"}, {"name": "Marianne Etzelmüller Bathen"}, {"name": "Julius Janušonis"}, {"name": "Tadas Paulauskas"}, {"name": "Lukas Razinkovas"}], "author_count": 6}, {"id": "2610.20211", "category": "cond-mat", "title": "High-Frequency Mass Transfer Enabling Over-Limiting Currents in Porous Electrodes", "abstract": "Classical film theory predicts a finite diffusion-limited current at porous electrodes. However, over-limiting currents (OLCs), which exceed this limit, are often observed and have been attributed to surface charge, confinement, or electrokinetic effects. Here, we use a frequency-domain framework to identify a different mechanism governed by the time scale of concentration variation. For perfectly reactive interfaces, the spectral Sherwood number, a frequency-dependent dimensionless measure of interfacial mass transfer relative to molecular diffusion, grows as $\\Shnd\\sim\\omega^{1/2}$ at high frequency, while its phase approaches $\\pi/4$. This response corresponds to the semi-infinite Warburg limit of the electrochemical impedance. A scaling analysis shows that the exponent and prefactor are determined by diffusion within a thin layer adjacent to the interface and are therefore independent of the global pore geometry. Numerical results for parallel plates, circular tubes, and twelve porous microstructures confirm this scaling. Geometry, flow strength, and flow direction affect the low-frequency response and crossover frequency, but not the asymptotic scaling in the high-frequency limit. This temporal route to OLCs requires neither surface charge nor confinement and could inform the design of systems for pulsed electrodeposition, mineral recovery and renewable-energy storage.", "url": "https://arxiv.org/abs/2610.20211", "type": "理论+数值", "summary": "1. 该工作以频域框架研究多孔电极中的高频传质，并结合平行板、圆管及十二种多孔微结构的数值计算，揭示由浓度变化时间尺度控制的过极限电流机制。\n2. 其关键机制在于：理想反应界面的谱舍伍德数在高频下按频率平方根增长、相位趋近四十五度，对应半无限瓦尔堡阻抗，且标度指数与前因子仅由界面附近薄层扩散决定，与全局孔几何无关。\n3. 这一无需表面电荷或受限效应的时域路径可为脉冲电沉积、矿物回收与可再生能源存储等设计提供启示，并表明高频传质可成为实现过极限电流的通用机制。", "summary_source": "deepseek", "authors": [{"name": "Md Abdul Hamid"}, {"name": "Kyle C. Smith"}], "featured_authors": [{"name": "Md Abdul Hamid"}, {"name": "Kyle C. Smith"}], "author_count": 2}, {"id": "2610.20216", "category": "cond-mat", "title": "A Topological\\-Geometrical Descriptor (TGD) for Scalable and Interpretable Modeling of Two\\-Dimensional Carbon Networks", "abstract": "We introduce a compact Topological-Geometrical Descriptor (TGD) for planar two-dimensional carbon networks. Atomic coordinates are mapped to a periodic planar graph and represented through ring populations, topological-charge statistics, projected ring geometry, and dual-graph defect adjacency. The resulting modeling vector contains 19 physically interpretable features. We evaluate TGD on 120 published planar carbon allotropes using the DFT relative energy per atom with respect to graphene as the target. Repeated five-fold cross-validation with gradient boosting yields a mean absolute error (MAE) of 0.0826 +/- 0.0138 eV/atom and R2 = 0.803 +/- 0.074. Under the same validation protocol, TGD gives a mean MAE of 0.0828 eV/atom, compared with 0.0929 eV/atom for a 203-feature Matminer representation. We further analyze 360 vacancy-defected graphene configurations spanning 12 vacancy concentrations from 2 to 24 percent. When entire vacancy concentrations are held out, TGD gives a pooled MAE of 0.269 eV/vacancy and R2 = 0.861, outperforming simple baselines based on vacancy concentration alone or non-hexagonal-ring fraction alone. Sensitivity tests show that the inferred edge sets are stable to moderate changes in the adaptive bond factor. Finally, the mean absolute topological charge is examined as a one-variable empirical surrogate for the allotrope dataset and is treated explicitly as dataset-specific rather than universal. These results show that TGD combines compact prediction with direct structural interpretation while making clear the present restriction to single-layer planar carbon networks.", "url": "https://arxiv.org/abs/2610.20216", "type": "理论+数值", "summary": "1. 该工作围绕《A Topological\\-Geometrical Descriptor (TGD) for Scalable and Interpretable Modeling of Two\\-Dimensional Carbon Networks》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Rômulo Uriel Liberal de Oliveira"}, {"name": "Raphael Matozo Tromer"}], "featured_authors": [{"name": "Rômulo Uriel Liberal de Oliveira"}, {"name": "Raphael Matozo Tromer"}], "author_count": 2}, {"id": "2610.20275", "category": "cond-mat", "title": "A Sideways Crack-Path Instability Amplified by Slow Loading", "abstract": "Crack-path instabilities in solids are typically associated with high propagation velocities. In contrast, we show that nanoparticle-filled elastomers exhib
