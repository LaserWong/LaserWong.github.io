gly modify the tunneling ionization probability while leaving the electron's continuum dynamics essentially unchanged. This selective control enables reconstruction of ionization pathways and provides a robust route to extract sub-cycle dynamics from strong-field observables.", "url": "https://arxiv.org/abs/2604.12646", "type": "理论+数值", "summary": "1. 该研究将强相干驱动场与弱明亮压缩真空（BSV）结合构成双色线性偏振场，通过数值模拟揭示了量子光统计对隧穿电离步骤的干涉增强调控作用。\n2. 其关键物理机制在于压缩真空场的非经典统计特性引起瞬时场幅涨落，从而选择性地显著改变隧穿电离概率，而对连续态电子动力学影响微弱。\n3. 这为从强场观测量中重构电离路径、提取亚周期动力学信息提供了稳健的新途径，并建立了量子光学与强场物理的交叉连接。", "summary_source": "deepseek", "authors": [{"name": "G. Singh"}, {"name": "T. Rook"}, {"name": "J. Rivera-Dean"}, {"name": "C. Figueira de Morisson Faria"}], "featured_authors": [{"name": "G. Singh"}, {"name": "T. Rook"}, {"name": "J. Rivera-Dean"}, {"name": "C. Figueira de Morisson Faria"}], "author_count": 4}, {"id": "2604.12684", "category": "quant-ph", "title": "Quasi-Orthogonal Stabilizer Design for Efficient Quantum Error Suppression", "abstract": "Orthogonal geometric constructions are the basis of many many quantum error-correcting codes (QEC), but strict orthogonality constraints limit design flexibility and resource efficiency. We introduce a quasi-orthogonal geometric framework for stabilizer codes that relaxes these constraints while preserving the symplectic commutation structure on the binary symplectic space $\\mathbb{F}_{2}^{2}$. The approach permits controlled overlap between X- and Z-check supports, leading to quasi-orthogonal Pauli operators and a generalized notion of effective distance defined via induced anti-commutation with logical operators. This relaxation expands the stabilizer design space, enabling codes that approach the Gilbert-Varshamov regime with improved logical rates at moderate distances. Finite-length constructions, including quasi-orthogonal variants of the $[[8,3,\\approx 3]]$, $[[10,4,\\approx 3]]$, $[[13,1,5]]$, and $[[29,1,11]]$ codes, demonstrate consistent improvements over strictly orthogonal counterparts. Under depolarizing noise with error rates up to $p=0.30$, logical error rates, fidelities, and trace distances improve by up to two orders of magnitude. These improvements reflect the increased connectivity of the underlying stabilizer geometry while remaining compatible with standard decoding schemes. The proposed framework offers a principled extension of stabilizer code design through quasi-orthogonal geometric structures.", "url": "https://arxiv.org/abs/2604.12684", "type": "理论", "summary": "1. 该研究提出了一种用于稳定子码设计的准正交几何框架，通过放宽严格正交约束但保持二进制辛空间上的对易结构来提升编码效率。\n2. 其核心技术在于允许X与Z校验子支撑集受控重叠，定义了基于逻辑算子诱导反对易的有效距离，从而在中等码距下实现更高的逻辑码率与错误抑制能力。\n3. 该框架系统拓展了稳定子码的设计空间，为在Gilbert-Varshamov界限附近构造高性能量子纠错码提供了新的几何化途径。", "summary_source": "deepseek", "authors": [{"name": "Valentine Nyirahafashimana"}, {"name": "Sharifah Kartini Said Husain"}, {"name": "Umair Abdul Halim"}, {"name": "Ahmed Jellal"}, {"name": "Nurisya Mohd Shah"}], "featured_authors": [{"name": "Valentine Nyirahafashimana"}, {"name": "Sharifah Kartini Said Husain"}, {"name": "Umair Abdul Halim"}, {"name": "Ahmed Jellal"}, {"name": "Nurisya Mohd Shah"}], "author_count": 5}, {"id": "2604.12690", "category": "quant-ph", "title": "An Introduction to Quantum Graphs and Current Applications", "abstract": "Quantum graphs are a paradigmatic model for quantum chaos as well as for spectral theory. We give a concise didactical introduction to quantum graphs, or Schrödinger Hamiltonians on metric graphs, with a focus on results related to quantum chaos, periodic orbit theory and spectral theory. We summarise related seminal results, and give an overview over a few more recent developments.", "url": "https://arxiv.org/abs/2604.12690", "type": "理论", "summary": "1. 该文系统介绍了量子图作为量子混沌与谱理论范式的模型，并聚焦于相关基础成果与近期进展。\n2. 其核心在于阐明了该模型如何统一地通过周期轨道理论处理量子混沌与谱统计问题。\n3. 这为研究波在无序或结构化介质中的传播等更广泛物理系统提供了清晰的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Gregory Berkolaiko"}, {"name": "Sven Gnutzmann"}], "featured_authors": [{"name": "Gregory Berkolaiko"}, {"name": "Sven Gnutzmann"}], "author_count": 2}, {"id": "2604.12707", "category": "quant-ph", "title": "Quantum analogues of exponential sensitivity: from Loschmidt echo to Krylov complexity", "abstract": "One of the fundamental manifestations of classical chaos is exponential sensitivity to initial conditions that is, two trajectories starting from nearly identical initial states diverge exponentially over time. This behavior is quantified by the Lyapunov exponents. Due to the unitary nature of quantum mechanics, such exponential divergence is elusive in quantum systems. As a result, several alternative quantities have been proposed and studied in recent years to capture analogous behavior. In this article, we present a pedagogical overview of three such quantities that have been the focus of intense research in recent years: the Loschmidt echo, out-of-time-order correlators (OTOCs), and Krylov complexity.", "url": "https://arxiv.org/abs/2604.12707", "type": "理论", "summary": "1. 该工作对用以刻画量子混沌中指数敏感性的三种物理量——Loschmidt 回声、失序关联子与 Krylov 复杂度——进行了系统性的教学评述。\n2. 其核心在于比较这三种量在混沌量子体系中对初态扰动的响应行为，揭示了它们作为经典李雅普诺夫指数量子对应物的潜力与内在联系。\n3. 这为在各类量子多体系统、全息对偶及量子信息过程中统一理解与量化量子混沌行为提供了清晰的概念框架。", "summary_source": "deepseek", "authors": [{"name": "Ignacio García-Mata"}, {"name": "Diego A. Wisnicki"}], "featured_authors": [{"name": "Ignacio García-Mata"}, {"name": "Diego A. Wisnicki"}], "author_count": 2}, {"id": "2604.12763", "category": "quant-ph", "title": "Path Integral Approach to Quantum Fisher Information", "abstract": "We present a real-time path-integral formulation of the quantum Fisher information for dynamical parameter estimation. For pure states undergoing unitary evolution, we show that the quantum Fisher information can be expressed as a connected symmetrized covariance of a time-integrated action deformation, equivalently as an integrated insertion of $\\partial_\\lambda S$ in the propagator. This reformulation avoids explicit state reconstruction by rewriting the quantum Fisher information in terms of real-time correlators that are natural targets for many-body methods. We further embed the construction into the Schwinger-Keldysh closed-time-path formalism, identifying the quantum Fisher information with the Keldysh component of an appropriate contour-ordered correlator generated by forward and backward propagating sources. Finally, using the Van Vleck-Gutzwiller approximation we re-derive the compact semiclassical quantum Fisher information expression, clarifying how classical trajectory data control leading-order metrological sensitivity.", "url": "https://arxiv.org/abs/2604.12763", "type": "理论", "summary": "1. 该工作提出了一种针对动力学参数估计的实时路径积分量子费舍尔信息理论框架。\n2. 其核心在于将量子费舍尔信息重构为实时关联函数，并成功嵌入Schwinger-Keldysh闭时路径形式体系，从而规避了显式态重构需求。\n3. 这为利用多体方法计算量子度量精度、以及理解半经典极限下经典轨迹数据对度量灵敏度的主导作用提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Francis J. Headley"}, {"name": "Mahdi RouhbakhshNabati"}, {"name": "Henry Harper-Gardner"}, {"name": "Daniel Braun"}, {"name": "Henning Schomerus"}, {"name": "Emre Köse"}], "featured_authors": [{"name": "Francis J. Headley"}, {"name": "Mahdi RouhbakhshNabati"}, {"name": "Henry Harper-Gardner"}, {"name": "Daniel Braun"}, {"name": "Henning Schomerus"}, {"name": "Emre Köse"}], "author_count": 6}, {"id": "2604.12823", "category": "quant-ph", "title": "The use of the output states generated by the broadcasting of entanglement in quantum teleportation", "abstract": "In this article, we find a theorem that gives a relation between the maximal fidelity of teleportation and the concurrence of the inseparable $X$ state used as a quantum channel in this process. Furthermore, we evaluate the concurrence of the output states generated by the local and nonlocal asymmetric broadcasting of entanglement and prove that the concurrence is greater in the case of nonlocal broadcasting. We analyze the possibility of using the output states obtained by the broadcasting of entanglement as quantum channels in quantum teleportation. We prove, with the help of the above-mentioned theorem, that all the inseparable states given by the local and nonlocal asymmetric broadcasting of entanglement are useful for quantum teleportation. Finally, we show that the maximal fidelity of teleportation is greater in the case when the second scenario is used, i.e., when the quantum channel is generated by the nonlocal asymmetric broadcasting of entanglement.", "url": "https://arxiv.org/abs/2604.12823", "type": "理论+数值", "summary": "1. 该工作建立了量子隐形传态中不可分X态信道并发度与最大保真度的关系定理，并分析了局域与非局域非对称纠缠广播输出态的传态适用性。\n2. 其核心发现在于非局域广播方案产生的信道具有更高并发度，且在所有不可分输出态均适用于量子隐形传态的前提下，该方案能实现更高的最大传态保真度。\n3. 这为基于纠缠广播协议制备高性能量子通信信道提供了明确的理论依据，同时揭示了信道生成方式对隐形传态质量的系统性影响。", "summary_source": "deepseek", "authors": [{"name": "Iulia Ghiu"}, {"name": "Catalina Cirneci"}, {"name": "George Alexandru Nemnes"}], "featured_authors": [{"name": "Iulia Ghiu"}, {"name": "Catalina Cirneci"}, {"name": "George Alexandru Nemnes"}], "author_count": 3}, {"id": "2604.12976", "category": "quant-ph", "title": "Hamiltonian Chaos", "abstract": "Through semiclassical methods the subject of quantum chaos motivates and depends on Hamiltonian chaos research. Presented here is a selection of Hamiltonian chaos topics that in this way get directly related to any of a variety of quantum chaos research problems. The chapter begins with a description of various useful theoretical and computational tools of chaos research, e.g.~surfaces of section, paradigms of chaos, stability analysis, and symbolic dynamics... This is followed by discussions regarding the geometry of chaos, how chaotic systems respond to perturbations, and the complexification of Hamiltonian dynamics. The emphasis is on intuitive explanations and illustrations of various ideas with the references containing more mathematically rigorous expositions.", "url": "https://arxiv.org/abs/2604.12976", "type": "理论", "summary": "1. 本文通过半经典方法，综述了哈密顿混沌的多个主题，包括表面截面、混沌范式、稳定性分析与符号动力学等工具，并将其与各类量子混沌研究问题直接关联。\n2. 其技术亮点在于以直观解释和图示深入阐述混沌几何、系统对扰动的响应以及哈密顿动力学复化等物理概念，同时引用严谨数学论述作为补充。\n3. 这为量子混沌领域提供了基于经典混沌的系统性研究框架，并对发展半经典方法及跨尺度动力学探索具有明确启发意义。", "summary_source": "deepseek", "authors": [{"name": "Steven Tomsovic"}], "featured_authors": [{"name": "Steven Tomsovic"}], "author_count": 1}, {"id": "2604.12982", "category": "quant-ph", "title": "Opportunistic QKD: Exploiting Idle Capacity of Classical WDM Systems", "abstract": "While Quantum Key Distribution (QKD) has been proven in lab environments, large-scale implementation requires integration with existing infrastructure. This paper proposes an opportunistic QKD framework that takes advantage of idle spectral capacity, that is, unused channels in classical fibers, to perform QKD while prioritizing classical traffic. To mitigate crosstalk during the co-propagation of classical and quantum signals, we require a guardband of unused channels between classical and quantum signals. We propose a stochastic traffic model, with a deterministic day-night cycle and fractional Gaussian noise. Monte-Carlo simulations of an 80-channel WDM system with our stochastic traffic model demonstrate that 45-65% of unused spectrum can be repurposed for QKD, depending on the traffic conditions. We also model a key reservoir model, with Available and Recovery states. We define the Reliability Horizon as the 3{\\sigma} depletion threshold. We find a trade-off between buffer reset levels: increasing the buffer reset level extends the reliability horizon but linearly increases recovery time, resulting in longer service \"dark windows\". Furthermore, simulations indicate that the first-passage time follows a heavy-tailed distribution, which is accurately characterized by a composite model combining a diurnal trend and a Bihill transition function. This framework enables network operators to optimize buffer parameters for specific Service Level Agreements (SLAs) in real-world environments.", "url": "https://arxiv.org/abs/2604.12982", "type": "理论+数值", "summary": "1. 该研究提出了一种机会主义量子密钥分发框架，通过利用经典波分复用系统中的空闲频谱容量，在优先保障经典流量的同时执行密钥分发，并基于随机流量模型和密钥库模型进行系统模拟与优化。\n2. 其技术核心在于引入了保护带策略以减轻串扰，构建了包含确定性昼夜周期和分数高斯噪声的随机流量模型，通过蒙特卡洛模拟量化了45-65%未使用频谱的可用性，并分析了缓冲区重置水平与可靠性地平线之间的权衡及首次通过时间的重尾分布。\n3. 这为网络运营商在现实部署中针对特定服务级别协议优化缓冲区参数提供了实用理论框架，对促进量子通信与经典网络的高效协同集成具有明确指导意义。", "summary_source": "deepseek", "authors": [{"name": "Sumit Chaudhary"}, {"name": "Pere Munar Vallespir"}, {"name": "Alonso Viladomat Jasso"}, {"name": "Janis Nötzel"}], "featured_authors": [{"name": "Sumit Chaudhary"}, {"name": "Pere Munar Vallespir"}, {"name": "Alonso Viladomat Jasso"}, {"name": "Janis Nötzel"}], "author_count": 4}, {"id": "2604.13022", "category": "quant-ph", "title": "Classical and Quantum Speedups for Non-Convex Optimization via Energy Conserving Descent", "abstract": "The Energy Conserving Descent (ECD) algorithm was recently proposed (De Luca & Silverstein, 2022) as a global non-convex optimization method. Unlike gradient descent, appropriately configured ECD dynamics escape strict local minima and converge to a global minimum, making it appealing for machine learning optimization. We present the first analytical study of ECD, focusing on the one-dimensional setting for this first installment. We formalize a stochastic ECD dynamics (sECD) with energy-preserving noise, as well as a quantum analog of the ECD Hamiltonian (qECD), providing the foundation for a quantum algorithm through Hamiltonian simulation. For positive double-well objectives, we compute the expected hitting time from a local to the global minimum. We prove that both sECD and qECD yield exponential speedup over respective gradient descent baselines--stochastic gradient descent and its quantization. For objectives with tall barriers, qECD achieves a further speedup over sECD.", "url": "https://arxiv.org/abs/2604.13022", "type": "理论+数值", "summary": "1. 该工作首次对能量守恒下降算法进行一维解析研究，并形式化其随机与量子版本。\n2. 其卖点在于证明随机与量子ECD在正双阱目标上相比梯度下降实现指数加速，且量子版本对高势垒有额外加速。\n3. 这为通过哈密顿模拟开发量子优化算法及非凸优化理论提供了新基础。", "summary_source": "deepseek", "authors": [{"name": "Yihang Sun"}, {"name": "Huaijin Wang"}, {"name": "Patrick Hayden"}, {"name": "Jose Blanchet"}], "featured_authors": [{"name": "Yihang Sun"}, {"name": "Huaijin Wang"}, {"name": "Patrick Hayden"}, {"name": "Jose Blanchet"}], "author_count": 4}, {"id": "2604.13026", "category": "quant-ph", "title": "A complexity phase transition at the EPR Hamiltonian", "abstract": "We study the computational complexity of 2-local Hamiltonian problems generated by a positive-weight symmetric interaction term, encompassing many canonical problems in statistical mechanics and optimization. We show these problems belong to one of three complexity phases: QMA-complete, StoqMA-complete, and reducible to a new problem we call EPR*. The phases are physically interpretable, corresponding to the energy level ordering of the local term. The EPR* problem is a simple generalization of the EPR problem of King. Inspired by empirically efficient algorithms for EPR, we conjecture that EPR* is in BPP. If true, this would complete the complexity classification of these problems, and imply EPR* is the transition point between easy and hard local Hamiltonians. Our proofs rely on perturbative gadgets. One simple gadget, when recursed, induces a renormalization-group-like flow on the space of local interaction terms. This gives the correct complexity picture, but does not run in polynomial time. To overcome this, we design a gadget based on a large spin chain, which we analyze via the Jordan-Wigner transformation.", "url": "https://arxiv.org/abs/2604.13026", "type": "理论+数值", "summary": "1. 本文研究了由正权重对称相互作用项生成的二局域哈密顿量问题的计算复杂性相分类。\n2. 其核心在于揭示了复杂性相与局域项能级排序的物理对应关系，并引入了可计算的新问题EPR*。\n3. 若EPR*可在经典概率多项式时间内求解的猜想成立，则将完全划定此类哈密顿量从易到难的复杂性相边界。", "summary_source": "deepseek", "authors": [{"name": "Kunal Marwaha"}, {"name": "James Sud"}], "featured_authors": [{"name": "Kunal Marwaha"}, {"name": "James Sud"}], "author_count": 2}, {"id": "2604.13027", "category": "quant-ph", "title": "Floquet Many-Body Cages", "abstract": "Many-body cages have very recently emerged as a general route for nonergodic behaviour in quantum matter. Here, we show that new types of many-body cages can be engineered in Floquet circuits with the potential to realize novel nonequilibrium quantum states. For that purpose, we first identify an explicit, general construction of Floquet circuits capable of hosting many-body cages. We then present a generic strategy to engineer and structure Floquet many-body cages. We demonstrate the developed scheme for the quantum hard disk model as a generic constrained model system, realizable for instance in Rydberg atom arrays. We construct Floquet circuits yielding Floquet many-body cages with topological properties and $\\pi$-quasienergy modes, implying `time crystalline' spatiotemporal order. Our results can be directly extended to general quantum circuits, thus providing a new tool to engineer nonequilibrium behaviour in driven systems.", "url": "https://arxiv.org/abs/2604.13027", "type": "理论", "summary": "1. 该研究提出了一种在Floquet电路中构造多体囚禁的通用方案，并以量子硬核盘模型为例演示了拓扑非平庸Floquet多体囚禁的实现。\n2. 其核心在于通过显式电路设计产生具有π准能模的拓扑多体囚禁，从而在驱动系统中涌现出时空有序的“时间晶体”行为。\n3. 该方案可直接推广至一般量子电路体系，为在人工量子平台上设计和调控非平衡物态提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Tom Ben-Ami"}, {"name": "Roderich Moessner"}, {"name": "Markus Heyl"}], "featured_authors": [{"name": "Tom Ben-Ami"}, {"name": "Roderich Moessner"}, {"name": "Markus Heyl"}], "author_count": 3}, {"id": "2604.13033", "category": "quant-ph", "title": "Partial majorization and Schur concave functions on the sets of quantum and classical states", "abstract": "We construct for a Schur concave function $f$ on the set of quantum states a tight upper bound on the difference $f(\\rho)-f(\\sigma)$ for a quantum state $\\rho$ with finite $f(\\rho)$ and any quantum state $\\sigma$ $m$-partially majorized by the state $\\rho$ in the sense described in [1]. We also obtain a tight upper bound on this difference under the additional condition $\\frac{1}{2}\\|\\rho-\\sigma\\|_1\\leq\\varepsilon$ and find simple sufficient conditions for vanishing this bound with $\\,\\min\\{\\varepsilon,1/m\\}\\to0\\,$. The obtained results are applied to the von Neumann entropy. The concept of $\\varepsilon$-sufficient majorization rank of a quantum state with finite entropy is introduced and a tight upper bound on this quantity is derived and applied to the Gibbs states of a quantum oscillator. We also show how the obtained results can be reformulated for Schur concave functions on the set of probability distributions with a finite or countable set of outcomes.", "url": "https://arxiv.org/abs/2604.13033", "type": "理论", "summary": "1. 该论文针对量子态和经典态集合上的Schur凹函数，构造了在部分主化关系下差值f(ρ)-f(σ)的紧上界，并推广至有迹距离约束条件。\n2. 主要技术卖点在于推导了在额外约束∥ρ-σ∥₁≤ε下的优化上界，并引入ε-充分主化秩概念，成功应用于量子振荡器的吉布斯态分析。\n3. 这为量子热力学中的熵估计提供了新工具，并可拓展至经典概率分布上的Schur凹函数研究，具有跨领域理论价值。", "summary_source": "deepseek", "authors": [{"name": "M.E.Shirokov"}], "featured_authors": [{"name": "M.E.Shirokov"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
