  <style>
    :root {

      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));

    }

    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }

    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

    const papers = [{"id": "2604.11846", "category": "cond-mat", "title": "Hierarchical localization in disordered Apollonian networks", "abstract": "We investigate localization properties of the Apollonian network (AN) in the presence of diagonal and off-diagonal disorder. By employing a site-resolved localization measure, we show that the localization degree is strongly dependent on the energy and tied to the hierarchical topology of the network. At the spectral edges, eigenstates are strongly localized on highly connected sites originating from previous generations, a behavior that persists under both disorder mechanisms. In contrast, around zero energy localization is associated with the lowest-degree sites. As disorder breaks the underlying C3 symmetry of the AN, it promotes spatial reconfiguration of these states while preserving their support on low-degree nodes. For diagonal disorder, localization is enhanced over a broad range of negative energies, whereas off-diagonal disorder induces weakening of localization in this region. Finally, we show that the hub dominates the spectral edges but has negligible contribution near the band center, indicating that its associated localized states are robust against disorder. These results highlight how topology and disorder jointly shape localization in complex networks.", "url": "https://arxiv.org/abs/2604.11846", "type": "理论+数值", "summary": "1. 该工作研究了同时存在对角与非对角无序的阿波罗网络中的局域化特性，并采用了格点分辨的局域化度量进行分析。\n2. 研究揭示了局域化程度强烈依赖于能量且与网络层次拓扑相关联，并阐明了两种无序机制下对称性破缺对低度节点上态空间重配置的不同影响。\n3. 这为理解复杂网络中拓扑与无序共同调控量子态局域化的普适机制提供了重要范例。", "summary_source": "deepseek", "authors": [{"name": "Eduardo M. K. Souza"}, {"name": "Francisco A. B. F. de Moura"}, {"name": "Guilherme M. A. Almeida"}], "featured_authors": [{"name": "Eduardo M. K. Souza"}, {"name": "Francisco A. B. F. de Moura"}, {"name": "Guilherme M. A. Almeida"}], "author_count": 3}, {"id": "2604.11850", "category": "cond-mat", "title": "Surface-enhanced Raman scattering and density functional theory study of selected-lanthanide-citrate complexes (lanthanide: Tb, Dy, Ho, Er, Tm, Yb and Lu)", "abstract": "In this study, surface-enhanced Raman scattering (SERS) and density functional theory (DFT) calculations were combined to investigate the SERS spectra of Ln-citrate complexes (Ln: Tb, Dy, Ho, Er, Tm, Yb, and Lu) under 488 and 532 nm excitation. Peak assignment was supported by simulated SERS spectra calculated with an optimized DFT method using large-core effective core potentials. The main bands near 935, 1060, 1315, and 1485 cm-1 were assigned to (C-COO-) + (CH2), (CH2) + (C-O -- Ln), sym(COO-) + (CH2), and asym(COO-) + (CH2), respectively. Relative peak intensities were evaluated by normalizing the bands near 935, 1060, and 1485 cm-1 to that near 1315 cm-1. The ratios I_935/I_1315 and I_1485/I_1315 generally increased from Dy-citrate to Lu-citrate, whereas the I_1060/I_1315 ratio decreased. These trends were observed under both excitation wavelengths. The decrease in relative SERS peak intensity of the 1060 cm-1 band is attributed to stronger Ln-O interaction and reduced polarizability change, whereas the increases of the 935 and 1485 cm-1 bands are likely related to changes in local electronic distribution and effective symmetry sensitivity.", "url": "https://arxiv.org/abs/2604.11850", "type": "理论+数值", "summary": "1. 该工作结合表面增强拉曼散射（SERS）与密度泛函理论（DFT），研究了从铽到镏的七种镧系元素-柠檬酸配合物在488与532 nm激发下的SERS光谱。\n2. 研究通过优化的大型核有效芯势DFT计算支持谱峰指认，并揭示了从Dy到Lu，特征峰相对强度比I_935/I_1315与I_1485/I_1315系统性增加而I_1060/I_1315降低的规律。\n3. 这些变化趋势被归因于镧系-氧相互作用增强引起的极化率变化及局部电子分布改变，为理解镧系配合物的结构-光谱关联及对称敏感性提供了明确依据。", "summary_source": "deepseek", "authors": [{"name": "Hao Jin"}, {"name": "Yuko S. Yamamoto"}], "featured_authors": [{"name": "Hao Jin"}, {"name": "Yuko S. Yamamoto"}], "author_count": 2}, {"id": "2604.11880", "category": "cond-mat", "title": "Classification and correlation signatures of chiral spin liquids on the pyrochlore lattice", "abstract": "We present a systematic classification and variational study of chiral quantum spin liquids on the pyrochlore lattice based on fermionic parton constructions. Focusing on chiral $\\mathrm{U(1)}$ and $\\mathbb{Z}_2$ spin-liquid Ansätze, we characterize their symmetry properties, flux structures, and low-energy spinon spectra within a projective symmetry group framework, and incorporate gauge fluctuations through Gutzwiller-projected wave functions studied by variational Monte Carlo. From the equal-time spin structure factor, we develop correlation-based diagnostics that distinguish gauge-dominated Coulomb phases from states with substantial matter-field and short-range contributions. Distinct chiral flux sectors, though close in energy, exhibit markedly different degrees of emergent $\\mathrm{U(1)}$ gauge-field dominance, reflected in the geometry and contrast of pinch-point singularities. Although these states are not competitive ground states of the nearest-neighbor Heisenberg model, they define a physically meaningful family of proximate chiral phases relevant to extended pyrochlore Hamiltonians.", "url": "https://arxiv.org/abs/2604.11880", "type": "理论+数值", "summary": "1. 本文基于费米子部分子构造，对烧绿石晶格上的手性量子自旋液体进行了系统分类和变分研究，并利用变分蒙特卡洛研究了包含规范涨落的高兹维勒投影波函数。\n2. 研究通过等时自旋结构因子发展了基于关联的诊断方法，能区分规范场主导的库仑相与具有显著物质场和短程贡献的态，并揭示了不同手性通量扇区在演生U(1)规范场主导程度上的显著差异。\n3. 这些手性态虽非最近邻海森堡模型的竞争基态，但为扩展烧绿石哈密顿量所对应的邻近手性相族提供了物理上清晰的分类框架和可观测的特征标记。", "summary_source": "deepseek", "authors": [{"name": "Chunxiao Liu"}, {"name": "Leon Balents"}, {"name": "Yasir Iqbal"}], "featured_authors": [{"name": "Chunxiao Liu"}, {"name": "Leon Balents"}, {"name": "Yasir Iqbal"}], "author_count": 3}, {"id": "2604.11997", "category": "cond-mat", "title": "Raman response in superconducting multiorbital systems with application to nickelates", "abstract": "The recent discovery of high-$T_c$ superconductivity in pressurized and thin film nickelates is nowadays one of the most relevant and active topics in solid-state physics. The origin of superconductivity together with the relevance of multiorbital physics are highly discussed issues in this field. Knowledge of the size of the gap and its symmetry is of fundamental interest to uncover the superconducting mechanism at play in the nickelates. Electronic Raman scattering is a powerful tool to investigate the main characteristics of the gap. Here, we investigate the Raman response in the superconducting phase for three different models: Two-orbital models, including $d_{x^2-y^2}$ and $d_{z^2}$ orbitals, with one and two layers; as well as a bilayer model with the $d_{x^2-y^2}$ orbital as the only active one. For each of these models, we consider different pairing symmetries and determine their characteristic fingerprints in the Raman response. For the two-orbital models, we perform full multiorbital calculations including interorbital and intraorbital scattering, and compare the results with those obtained using the additive Raman response where each band is considered separately. Our results should be useful for discussing the minimal model for superconductivity and its pairing symmetry in nickelates. The obtained results and discussions, as well as the presented formalism, are also of general interest for other multiorbital systems.", "url": "https://arxiv.org/abs/2604.11997", "type": "理论+数值", "summary": "1. 该工作通过计算三种不同轨道构型模型在超导态下的拉曼响应，系统研究了镍基超导体中可能的配对对称性与能隙特征。\n2. 其核心在于对双轨道模型进行了包含轨道间与轨道内散射的全多轨道计算，并揭示了其结果与简单的能带加性响应近似之间的显著差异。\n3. 此研究为确定镍基超导的最小模型与配对对称性提供了关键的理论光谱指纹，其形式化方法也对更广泛的多轨道超导体系具有普适意义。", "summary_source": "deepseek", "authors": [{"name": "Matías Bejas"}, {"name": "Jun Zhan"}, {"name": "Xianxin Wu"}, {"name": "Andreas P. Schnyder"}, {"name": "Andrés Greco"}], "featured_authors": [{"name": "Matías Bejas"}, {"name": "Jun Zhan"}, {"name": "Xianxin Wu"}, {"name": "Andreas P. Schnyder"}, {"name": "Andrés Greco"}], "author_count": 5}, {"id": "2604.12030", "category": "cond-mat", "title": "Phase-space origin of superfluid stability in ring Bose-Einstein condensates", "abstract": "We present a kinetic description of superfluid currents in ring-shaped Bose-Einstein condensates based on the Wigner phase-space formalism. Starting from the Gross-Pitaevskii equation in a toroidal geometry, we derive a Vlasov-type equation for the angular Wigner function, in which the mean-field interaction generates an effective force proportional to the density gradient. Within this framework, we obtain the dispersion relation of collective modes and recover the Bogoliubov spectrum in the long-wavelength limit. We show that the Landau criterion for superfluidity can be interpreted as the absence of resonant phase-space trajectories satisfying the condition \\(\\omega = q v_\\ell\\). In a ring geometry, the quantization of angular momentum leads to a discrete set of velocities, which suppresses the availability of resonant states and strongly inhibits Landau damping. In contrast, in the continuous limit \\(R \\to \\infty\\), the spectrum becomes quasi-continuous and the standard Landau damping mechanism is recovered, establishing a direct connection between kinetic resonances and the energetic criterion for superfluidity. We further analyze the role of Bogoliubov depletion by considering a finite-width angular momentum distribution. Although resonant states formally exist in this case, we show that, for flow velocities below the sound velocity, the phase-space distribution does not provide the gradients required for energy transfer, and the superfluid current remains dynamically stable. Our results provide a unified phase-space interpretation of superfluidity, highlighting the role of angular momentum quantization and the structure of the distribution function in determining the stability of persistent currents.", "url": "https://arxiv.org/abs/2604.12030", "type": "理论", "summary": "1. 该工作基于Wigner相空间形式体系，建立了环形势中玻色-爱因斯坦凝聚体超流电流的动力学描述，从环几何下的Gross-Pitaevskii方程推导出角向Wigner函数的Vlasov型方程。\n2. 研究揭示了环几何中角动量的量子化导致离散的流速谱，从而抑制了满足共振条件 \\(\\omega = q v_\\ell\\) 的相空间轨迹的可获得性，这为朗道阻尼被强烈抑制提供了相空间解释。\n3. 该相空间框架统一解释了超流稳定性，将动力学共振与超流性的能量判据直接联系起来，为理解受限几何中量子流体的非平衡动力学提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "M. O. C. Pires"}], "featured_authors": [{"name": "M. O. C. Pires"}], "author_count": 1}, {"id": "2604.12098", "category": "cond-mat", "title": "Preserving elastic anisotropy with tessellations of granular packings", "abstract": "Multiscale periodic metamaterials have been designed for numerous applications, such as impact absorption, acoustic cloaking, photonic band gaps, and mechanical logic gates. This prior work has focused on optimizing mesoscale structure for desired bulk isotropic properties. In contrast, we seek to develop materials with highly anisotropic elastic properties. To quantify elastic anisotropy, we introduce two rotationally invariant, normalized quantities that characterize the anisotropic response to shear and compression, respectively, $A_G$ and $A_C$. We find that typical crystalline solids possess average elastic anisotropy $\\overline{A}_G \\approx 0.15$ and $\\overline{A}_C \\approx 0.09$. Compared to atomic crystals, jammed granular materials can attain elastic anisotropies that are several orders of magnitude larger. Since grain rearrangements reduce anisotropy in granular materials, to preserve strong elastic anisotropy, we design tessellated granular materials that consist of multiple connected grain-filled voxels, which limit rearrangements and enable highly anisotropic elastic properties. Bulk granular packings with $N$ grains prepared at pressure $p$ have maximal anisotropy for $pN^2\\sim1$ and become isotropic in the large-$pN^2$ limit. We show that homogeneously tessellated granular systems can inherit the elastic response of the constituent voxel configurations with elastic anisotropy up to $100$ times that of crystalline compounds over a range of $pN^2$. We show further methods to tune the elastic anisotropy of tessellations by designing heterogeneously patterned voxel configurations and tessellations that allow large boundary deformations.", "url": "https://arxiv.org/abs/2604.12098", "type": "理论+数值", "summary": "1. 本工作通过设计由多连通颗粒填充体素构成的镶嵌材料来保持强弹性各向异性，并引入旋转不变归一化参量A_G和A_C分别量化剪切与压缩各向异性。\n2. 其技术核心在于揭示颗粒堵塞材料在pN^2∼1时呈现最大各向异性，且均匀镶嵌结构能限制颗粒重排，继承单元配置高达晶体化合物百倍的弹性各向异性。\n3. 这为进一步通过异质图案化体素配置和允许大边界变形的镶嵌设计来调控弹性各向异性提供了明确方法，为各向异性机械超材料的可编程开发带来启示。", "summary_source": "deepseek", "authors": [{"name": "Annie Z. Xia"}, {"name": "Dong Wang"}, {"name": "Catherine La Riviere"}, {"name": "Rebecca Kramer-Bottiglio"}, {"name": "Mark D. Shattuck"}, {"name": "Corey S. O'Hern"}], "featured_authors": [{"name": "Annie Z. Xia"}, {"name": "Dong Wang"}, {"name": "Catherine La Riviere"}, {"name": "Rebecca Kramer-Bottiglio"}, {"name": "Mark D. Shattuck"}, {"name": "Corey S. O'Hern"}], "author_count": 6}, {"id": "2604.12107", "category": "cond-mat", "title": "Disentangling microstructural elements of shear thickening suspensions via computer simulations of a minimal model", "abstract": "We use a minimal model for a dense suspension undergoing thickening and thinning to investigate microstructural changes in 2d simulations. Our simulations show that in steady flow the contact network contains distinct building blocks which are clearly signaled by sharp peaks in the radial distribution function, similar to what is observed in granular jamming. These structures {deform} during thinning. Non-Gaussian stress fluctuations that only emerge during thickening are associated to power law tails in the distribution of local contact forces, which tend to emerge when the flow-induced building blocks form large spanning assemblies. The subset of the contact network characterized by strong contact forces and connectivity large enough to be rigid or over-constrained is increasingly likely to percolate as the system starts to thicken, and to percolate over larger strain windows during thickening. The tendency of these structures to span the sample and to persist is dramatically reduced during thinning, where instead their deformation allows for a more homogeneous spatial redistribution of contact forces, significantly reducing the fluctuations of the macroscopic stress over time.", "url": "https://arxiv.org/abs/2604.12107", "type": "理论+数值", "summary": "1. 该工作通过二维计算机模拟，利用一个极简模型研究了稠密悬浮液在剪切增稠与剪切稀化过程中的微观结构演变。\n2. 其核心在于揭示了剪切增稠期间非高斯应力涨落的起源——流动诱导形成的接触网络构型单元会组装成跨越系统的刚性骨架，并伴随局域接触力的幂律尾部分布。\n3. 这为从微观结构层面区分剪切增稠与剪切稀化的物理机制提供了明确依据，并可指导后续对复杂悬浮体系流变行为的建模与调控。", "summary_source": "deepseek", "authors": [{"name": "William C. J. Buchholtz"}, {"name": "Daniel L. Blair"}, {"name": "Jeffrey S. Urbach"}, {"name": "H. A. Vinutha"}, {"name": "Emanuela Del Gado"}], "featured_authors": [{"name": "William C. J. Buchholtz"}, {"name": "Daniel L. Blair"}, {"name": "Jeffrey S. Urbach"}, {"name": "H. A. Vinutha"}, {"name": "Emanuela Del Gado"}], "author_count": 5}, {"id": "2604.12203", "category": "cond-mat", "title": "Spherical-tensor description of the Jahn--Teller--Hubbard molecule and local electron--phonon entanglement", "abstract": "We investigate the localized-electron character of the Mott-insulating phase in A$_3$C$_{60}$ using a single-site multiorbital electron model coupled to anisotropic molecular vibrations (Jahn--Teller phonons). We apply the spherical-tensor formalism, a framework originally developed in nuclear physics, to analyze the electron--phonon-coupled ground-state multiplet. Focusing on multipole moments, we find that both the conventional electronic quadrupole moment and the lattice displacement associated with the molecular vibrations vanish, even though the degenerate ground-state multiplet implies the presence of quadrupolar degrees of freedom. By analyzing these degrees of freedom within the spherical-tensor framework, we introduce composite (two-body) quadrupole operators involving both electrons and phonons and study their parameter dependence numerically. Furthermore, using quasispin selection rules, we demonstrate that the composite quadrupole does not couple to either the conventional quadrupole or lattice-displacement operators, thereby distinguishing it fundamentally from standard quadrupolar degrees of freedom. In addition, we investigate the nature of the electron--phonon entanglement and characterize it from the viewpoint of angular momentum. Analysis of the entanglement spectrum reveals that the ground state consists of superpositions of multi-phonon states with angular momenta $L_{\\rm ph}=2$ and $L_{\\rm ph}=3$, formed through coupling to three-electron states with $L=1$ and $L=2$.", "url": "https://arxiv.org/abs/2604.12203", "type": "理论+数值", "summary": "1. 该工作采用源自核物理的球张量形式，研究了A3C60中单点多轨道电子模型耦合Jahn-Teller声子的基态多重态，重点分析多极矩特性与局域电子行为。\n2. 通过引入电子-声子复合四极矩算符并利用准自旋选择规则，证明该复合自由度不耦合于传统四极矩或晶格位移算符，从而揭示了新的四极物理机制。\n3. 从角动量视角分析纠缠谱，发现基态由L_ph=2和3的多声子态与L=1和2的三电子态耦合叠加，为强关联电子-声子系统的量子纠缠研究提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Koichiro Takahashi"}, {"name": "Shuichiro Ebata"}, {"name": "Naotaka Yoshinaga"}, {"name": "Shintaro Hoshino"}], "featured_authors": [{"name": "Koichiro Takahashi"}, {"name": "Shuichiro Ebata"}, {"name": "Naotaka Yoshinaga"}, {"name": "Shintaro Hoshino"}], "author_count": 4}, {"id": "2604.12225", "category": "cond-mat", "title": "Steady-State Equilibrium and Nonequilibrium Noisy Network Dynamics", "abstract": "The fluctuating dynamics of a network about its stable, noise-free steady state are theoretically investigated. Various causes of non-equilibrium dynamics are identified in terms of the properties and symmetry of the network connections and the noise covariance matrices. Several equivalent conditions are derived for the dynamics of the noisy network at equilibrium. In particular, non-equilibrium steady state (NESS) dynamics are analyzed in terms of the steady-state probability current and the drift velocity relative to the effective potential surface. Conventional physical Brownian dynamics for overdamped fluctuating dynamics is analyzed from the perspective of the linearized fluctuating noisy network dynamics. Connection with the network reconstruction from time-series data is discussed. It is demonstrated that the overdamped Brownian dynamics in the physical system is a special case of the general noisy directed network in a NESS. Furthermore, a general fluctuation-dissipation relation is derived for the general non-equilibrium noisy network dynamics. These theoretical results are verified by numerical simulations.", "url": "https://arxiv.org/abs/2604.12225", "type": "理论+数值", "summary": "1. 该工作从理论层面系统研究了噪声网络中围绕确定性稳态的涨落动力学，并通过数值模拟验证了理论结果。\n2. 其核心在于为一般非平衡噪声网络动力学推导出普适的涨落耗散关系，并将物理系统中的过阻尼布朗动力学揭示为NESS下一般有向噪声网络的特例。\n3. 这为基于时间序列数据的网络重构提供了理论基础，并建立了非平衡稳态动力学与有效势能面及概率流之间的明晰对应关系。", "summary_source": "deepseek", "authors": [{"name": "Pik-Yin Lai"}], "featured_authors": [{"name": "Pik-Yin Lai"}], "author_count": 1}, {"id": "2604.12249", "category": "cond-mat", "title": "Orbital-selective correlations and angular momentum coupling in heavy actinides Am, Cm, Bk, and Cf under pressure: A many-body perspective", "abstract": "We systematically investigate the electronic structures of americium (Am), curium (Cm), berkelium (Bk), and californium (Cf) in both the ambient-pressure double hexagonal close-packed (dhcp) and high-pressure face-centered cubic (fcc) phases, using density functional theory combined with embedded dynamical mean-field approach. Our results reveal that Am exhibits moderate correlation strength and localized 5f states dominated by jj angular momentum coupling scheme. In Cm and Bk, strong electron correlations drive the system into a localized regime, characterized by Hubbard band formation, large effective electron masses, and non-Fermi liquid behavior. Their magnetic ground states are governed by exchange interactions within an intermediate coupling scheme that shifts toward LS coupling. Remarkably, Cf reenters a jj coupling regime while exhibiting the strongest orbital-selective correlations among the series. Atomic eigenstate probabilities show moderate configurational mixing in Am, whereas Cm, Bk, and Cf maintain nearly fixed trivalent configurations, indicating localized 5f states. Compared with the dhcp phase, the fcc structure generally enhances correlation effects, as evidenced by wider Hubbard bandgaps and increased valence state fluctuation in Am. Analyses of kinetic energy, potential energy, spin susceptibility, and charge susceptibility further corroborate the progressive localization of 5f electrons and the emergence of orbital-selective correlations from Am to Cf. This work establishes a unified picture of 5f electron evolution across the Am-Cf series, elucidating the interplay between spin-orbit coupling, electron correlation, and crystal structure in heavy actinides and offering insights into their behavior under high pressure.", "url": "https://arxiv.org/abs/2604.12249", "type": "理论+数值", "summary": "1. 该工作系统研究了锕(Am)、锉(Cm)、锫(Bk)、锎(Cf)在常压双六方密堆(dhcp)与高压面心立方(fcc)相中的电子结构。\n2. 研究揭示了从Am到Cf的5f电子局域化进程中，角动量耦合机制从jj耦合经中间耦合向LS耦合演变，且Cf在高压下重返jj耦合并呈现最强的轨道选择性关联。\n3. 这为理解重锕系元素中自旋轨道耦合、电子关联与晶体结构的相互作用建立了统一图像，并对高压下其奇异量子行为的探索提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Haiyan Lu"}], "featured_authors": [{"name": "Haiyan Lu"}], "author_count": 1}, {"id": "2604.12264", "category": "cond-mat", "title": "Polymer-free van der Waals assembly of 2D material heterostructures using muscovite crystals", "abstract": "The advent of van der Waals (vdW) heterostructures has enabled formation of bespoke materials with atomic precision, where numerous quantum and topological phenomena have already been discovered. This atomic-layer tunability, however, comes at a cost: individual 2D layers must be picked up, moved, and placed in a deterministic manner while keeping their interfaces atomically clean. Recent advances in machine learning and robotics place even stronger emphasis on the deterministic aspect of vdW assembly. Current polymer-based transfer methods satisfy neither the determinism nor cleanliness requirements. To this end, solutions are needed where adhesion can be dynamically and deterministically controlled without leaving organic contamination. Here, we present a polymer free transfer technique employing thin muscovite (mica) crystals. Temperature control over mica adhesion enables deterministic pick-up, stacking, and release of 2D materials, while their crystalline, inorganic nature ensures pristine interfaces and suppresses strain. Fully compatible with existing fabrication workflows, this approach enables the assembly of demanding vdW heterostructures, including those with exposed conductive layers, moiré superlattices and suspended membranes. Our method represents a promising strategy for vdW heterostructure fabrication toward its automatization.", "url": "https://arxiv.org/abs/2604.12264", "type": "理论+数值", "summary": "1. 该工作提出了一种基于薄层白云母晶体的无聚合物转移技术，用于范德华异质结构的确定性组装。\n2. 其核心技术在于通过温度调控云母的粘附力，实现对二维材料的确定拾取、堆叠与释放，同时利用其无机晶体特性保障了界面的原始清洁度并抑制了应变。\n3. 这为需要暴露导电层、莫尔超晶格或悬浮结构等高要求范德华异质结构的可靠组装及其自动化制备提供了切实可行的新途径。", "summary_source": "deepseek", "authors": [{"name": "Ian Babich"}, {"name": "Timofey M. Savilov"}, {"name": "Natalia A. Mamchik"}, {"name": "Kristina Vaklinova"}, {"name": "Nansi Zhou"}, {"name": "Denis S. Baranov"}, {"name": "Dmitrii A. Litvinov"}, {"name": "Virgil Gavriliuc"}, {"name": "Yue Yuan"}, {"name": "Amoz Chua"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Mario Lanza"}, {"name": "Maciej Koperski"}, {"name": "Kostya S. Novoselov"}, {"name": "Alexey I. Berdyugin"}, {"name": "Makars Šiškins"}], "featured_authors": [{"name": "Ian Babich"}, {"name": "Timofey M. Savilov"}, {"name": "Natalia A. Mamchik"}, {"name": "Kostya S. Novoselov"}, {"name": "Alexey I. Berdyugin"}, {"name": "Makars Šiškins"}], "author_count": 17}, {"id": "2604.12328", "category": "cond-mat", "title": "Charge-4e/6e superconductivity and chiral metal from 3D chiral superconductor", "abstract": "Unconventional superconductivity (SC) characterized by multi-fermion orderings has attracted substantial attention. However, previous studies have largely focused on 2D systems or 3D systems with effective 2D symmetries. Here, we investigate the vestigial phases arising from thermal fluctuations of chiral SC in 3D systems governed by the cubic $O_h$ point group. By constructing low-energy effective Hamiltonians via Ginzburg-Landau analysis and conducting Monte Carlo simulations, we systematically investigate the phase fluctuations of chiral orders within the $E_g$ and $T_{2g}/T_{1u}$ irreducible representations (IRRPs). We identify a phase diagram topology different from 2D counterparts, where the multi-phase intersection manifests as a tetracritical point rather than the triple point typically found in 2D systems. We elucidate the evolution of these phases under thermal fluctuations. Our findings reveal that for both $E_g$ and $T_{2g}/T_{1u}$ IRRPs, the primary chiral orders could melt into a chiral metallic phase across specific parameter regimes. Moreover, for the $E_g$ IRRP, phase fluctuation could also induce a charge-$4e$ phase under certain regime, while for the $T_{2g}$ and $T_{1u}$ IRRPs, it leads to a higher-order charge-$6e$ SC state. Our work paves the way for exploring exotic vestigial orders driven by non-trivial 3D crystalline symmetries.", "url": "https://arxiv.org/abs/2604.12328", "type": "理论+数值", "summary": "1. 该工作通过金兹堡-朗道理论分析和蒙特卡洛模拟，系统研究了三维立方\\(O_h\\)点群下\\(E_g\\)与\\(T_{2g}/T_{1u}\\)不可约表示手性超导体的热涨落诱导残留相。\n2. 其卖点在于揭示了相图拓扑与二维系统的根本差异，即四临界点的出现，并阐明了手性金属相、电荷-4e超导相（对\\(E_g\\)表示）和电荷-6e超导相（对\\(T_{2g}/T_{1u}\\)表示）的生成机制。\n3. 这为理解三维晶体对称性驱动的奇异量子相如高电荷超导态提供了新视角，并为相关拓扑超导材料的探索奠定了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Chu-Tian Gao"}, {"name": "Chen Lu"}, {"name": "Yu-Bo Liu"}, {"name": "Zhiming Pan"}, {"name": "Fan Yang"}], "featured_authors": [{"name": "Chu-Tian Gao"}, {"name": "Chen Lu"}, {"name": "Yu-Bo Liu"}, {"name": "Zhiming Pan"}, {"name": "Fan Yang"}], "author_count": 5}, {"id": "2604.12367", "category": "cond-mat", "title": "Kinetic instability and superconductivity in Li$_2$AuH$_6$ and Li$_2$AgH$_6$ at ambient pressure", "abstract": "Li$_2$AuH$_6$ and Li$_2$AgH$_6$ have been proposed as promising candidates for high-temperature superconductors under ambient pressure. While previous studies confirm the dynamic stability of these two thermodynamically unstable systems, their kinetic stability remains to be verified. In this work, we use path integral molecular dynamics simulations to examine the kinetic stability of Li$_2$AuH$_6$ and Li$_2$AgH$_6$ under ambient pressure. We find both compounds are kinetically unstable. Li$_2$AgH$_6$ undergoes lattice collapse, whereas Li$_2$AuH$_6$ retains a stable fluorite-type Li-Au sublattice, but hydrogen atoms partially dimerize into molecules and diffuse within the host lattice. Using the stochastic path-integral approach, which is a nonperturbative approach applicable to systems with diffusive atoms, we investigate the superconductivity of Li$_2$AuH$_6$ in this state. We predict a superconducting transition temperature of 22 K, well below earlier predictions, due to the low density of states at the Fermi level caused by the collapse of hydrogen sublattice and hydrogen dimerization.", "url": "https://arxiv.org/abs/2604.12367", "type": "数值", "summary": "1. 该研究采用路径积分分子动力学模拟评估了Li2AuH6和Li2AgH6在常压下的动力学稳定性，并利用随机路径积分方法对Li2AuH6的氢二聚化状态进行了超导计算。\n2. 其突出发现是两体系均动力学不稳定，Li2AuH6中氢原子二聚化与扩散导致费米能级态密度降低，从而将超导转变温度预测为22 K，明显低于先前理论值。\n3. 这凸显了动力学因素在超导材料预测中的重要性，并为处理原子扩散系统的非微扰超导理论提供了应用实例，对类似体系的研究具有参考价值。", "summary_source": "deepseek", "authors": [{"name": "Yucheng Ding"}, {"name": "Haoran Chen"}, {"name": "Junren Shi"}], "featured_authors": [{"name": "Yucheng Ding"}, {"name": "Haoran Chen"}, {"name": "Junren Shi"}], "author_count": 3}, {"id": "2604.12430", "category": "cond-mat", "title": "Generalized BChS Model with Group Interactions: Shift in the Critical Point and Mean-Field Ising Universality", "abstract": "We introduce a generalized version of the Biswas-Chatterjee-Sen (BChS) model \\cite{Biswas} with group interactions of size $q$, extending the original pairwise interaction dynamics. Within a mean-field framework, we derive an exact expression for the critical noise $p_c(q)$, showing that it increases monotonically with $q$ and approaches $1/2$ in the large-$q$ limit, consistent with a Gaussian approximation. Despite this shift in the phase boundary, the critical behavior remains unchanged across all $q$: the order parameter scales as $(p_c(q)-p)^{1/2}$, and the relaxation timescale diverges as $|p-p_c(q)|^{-1}$, identical to the original BChS model \\cite{Biswas}. Finite-size scaling of the Binder cumulant, order parameter, and its fluctuations confirm that the system belongs to the mean-field Ising universality class for all $q$. Our results demonstrate that higher-order interactions modify the location of the transition without altering its universality class.", "url": "https://arxiv.org/abs/2604.12430", "type": "理论+数值", "summary": "1. 本研究将 Biswas-Chatterjee-Sen (BChS) 模型推广至包含大小为 q 的群体相互作用，并在平均场框架下精确推导了临界噪声 pc(q) 的表达式。\n2. 尽管 pc(q) 随 q 单调增大并改变相边界位置，但系统的临界行为在所有 q 下均保持不变，序参数和弛豫时间的标度律均与原始 BChS 模型一致，有限尺寸标度分析进一步确认其属于平均场伊辛普适类。\n3. 这一结果表明高阶相互作用仅改变相变位置而不影响其普适类，为理解多体相互作用如何调控临界现象提供了明确的理论参考。", "summary_source": "deepseek", "authors": [{"name": "Amit Pradhan"}], "featured_authors": [{"name": "Amit Pradhan"}], "author_count": 1}, {"id": "2604.12475", "category": "cond-mat", "title": "Explicit proof of Anderson's orthogonality catastrophe for the one-dimensional Fermi polaron with attractive interaction", "abstract": "We provide a fully analytical derivation of Anderson's orthogonality catastrophe for the one dimensional Fermi polaron integrable model, describing a system of $N$ spin-up fermions, with fixed density $n=N/L$, interacting with a single spin-down fermion via an attractive contact potential. The proof combines the determinant representations of the norm of the many-body wave function and of its scalar product with the noninteracting ground state, obtained from the Bethe ansatz solution, with the special properties of Cauchy matrices. We derive the leading asymptotics of the two determinants in the thermodynamic limit and show that the quasi-particle residue $Z$ decays algebraically, $Z=W N^{-\\theta}$. We confirm that the Anderson exponent $\\theta$ is equal to $2\\delta_F^2/\\pi^2$, where $\\delta_F$ is the Bethe-ansatz phase shift at the Fermi edge. The prefactor $W$ is obtained numerically as a function of the interaction parameter.", "url": "https://arxiv.org/abs/2604.12475", "type": "理论+数值", "summary": "1. 该工作对一维吸引相互作用费米极化子模型，给出了安德森正交灾变的完全解析证明。\n2. 其技术卖点在于结合Bethe ansatz的行列式表示与柯西矩阵特性，推导了热力学极限下的主导渐近行为。\n3. 这为精确确定正交灾变指数及预因子提供了基准，可促进相关可积模型或非平衡动力学的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Giuliano Orso"}], "featured_authors": [{"name": "Giuliano Orso"}], "author_count": 1}, {"id": "2604.12531", "category": "cond-mat", "title": "Kinetic Arrest of a First Order Phase Transition", "abstract": "We report a phenomenological theory for the kinetic arrest (KA) of a first-order phase transition, taking the Mott metal-insulator transition in $V_2O_3$ as a test case. By defining a order parameter $\\phi$ related to the monoclinic distortion of the high temperature metallic and mapping its Time-Dependent Ginzburg-Landau (TDGL) dynamics onto a disorder-influenced Imry-Wortis landscape, we derive a universal transcendental condition for the mechanism of the kinetic arrest. We demonstrate that epitaxial substrate-induced clamping in (001)-oriented $V_2O_3$ thin films elevates the elastic activation barriers, trapping the high-symmetry corundum phase down to 4.2~K. This structural suppression of the insulating state robustly explains the observed hysteretic $V$-$I$ switching a hallmark of memristive behaviour. Our work identifies a \"Mott-Glass\" as a structurally arrested non-equilibrium state in the strained thin-film of V$_2$O$_3$. Our work provides a predictive framework for engineering strain-tuned neuromorphic synapses.", "url": "https://arxiv.org/abs/2604.12531", "type": "理论+数值", "summary": "1. 该工作针对一级相变的动力学迟滞现象，提出了一个唯象理论，并以 V2O3 中的 Mott 金属-绝缘体转变为范例，在(001)取向薄膜中实验演示了结构相变被完全抑制。\n2. 理论核心是将序参量的时间依赖 Ginzburg-Landau 动力学映射到受无序影响的 Imry-Wortis 能量景观，导出了决定动力学迟滞机制的普适超越方程，并阐明外延衬底应力抬高了弹性势垒，从而将高温高对称性刚玉相捕获至低温。\n3. 研究确认了应变 V2O3 薄膜中一种结构迟滞的非平衡“Mott-玻璃”态，这为基于应变工程设计和调控类脑神经形态突触器件提供了一个可预测的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Sindhunil Barman Roy"}], "featured_authors": [{"name": "Sindhunil Barman Roy"}], "author_count": 1}, {"id": "2604.12583", "category": "cond-mat", "title": "Electrochemical Performance of Gold Monolayers for Lithium-Ion Batteries: A First Principles Study", "abstract": "Being motivated by recent synthesis of a monolayer of gold, named goldene, from the nano-laminated ternary ceramic phase of Ti3AuC2, we are proposing two phases of goldene viz. goldene-I and goldene-II as anode material for Lithium-Ion batteries using first principles study. This innovative goldene-I monolayer, composed of triangular motifs of gold atoms, exhibits remarkable properties owing to its unique geometric configuration and intrinsic stability. In contrast, a theoretical structure known as goldene-II, featuring a combination of triangular and hexagonal motifs, has been proposed. This structure possesses intrinsic, periodically distributed pores among Au atoms and demonstrates structural integrity and mechanical robustness, even under lithium adsorption. The electronic band spectra and projected density of states reveal the metallic nature of both phases of goldene. Electrochemical evaluations reveal that goldene-II offers favorable lithium-ion adsorption energies, efficient charge transfer, and volumetric capacities. Goldene-I achieves a volumetric capacity of 0.713 Ah/cm3, while goldene-II reaches 0.783 Ah/cm3, confirming its high suitability for lithium storage volumetric capability. Moreover, goldene-I has an ultra-low barrier height of 15 meV, which supports rapid lithium-ion transport.", "url": "https://arxiv.org/abs/2604.12583", "type": "理论", "summary": "1. 本研究通过第一性原理计算，系统评估了由三角形和六边形原子 motifs 构成的两种金单层（金单层-I与-II）作为锂离子电池负极材料的电化学性能。\n2. 其关键物理特性在于，具有周期性孔隙的金单层-II结构展现出有利的锂吸附能与电荷转移效率，而金单层-I则实现了超低的锂离子扩散势垒（15 meV）。\n3. 这为同时追求高体积容量与快速离子传输的二维电极材料设计提供了明确的理论依据与候选体系。", "summary_source": "deepseek", "authors": [{"name": "Ajay Kumara"}, {"name": "Pritam Samanta"}, {"name": "Prakash Parida"}], "featured_authors": [{"name": "Ajay Kumara"}, {"name": "Pritam Samanta"}, {"name": "Prakash Parida"}], "author_count": 3}, {"id": "2604.12585", "category": "cond-mat", "title": "Finite temperature correlation functions of the sine--Gordon model", "abstract": "The sine-Gordon model serves as a foundational $1+1$-dimensional quantum field theory with numerous applications in condensed matter physics. Despite its integrability, characterizing its finite-temperature behavior remains a significant theoretical challenge. Here we use the previously developed Method of Random Surfaces (MRS) to evaluate two-point and higher-order correlation functions. We cross-check these results with known analytical limits, demonstrating that the MRS provides reliable, non-perturbative data in intermediate regimes where traditional form-factor expansions and semiclassical methods are inapplicable. Furthermore, we derive an exact result for arbitrary $N$-point functions satisfying an appropriate selection rule, providing a direct computational method for complex multi-point observables at finite temperature. We also characterize the non-Gaussianity of correlations and demonstrate that the results align with intuitive theoretical expectations.", "url": "https://arxiv.org/abs/2604.12585", "type": "理论+数值", "summary": "1. 该工作利用随机曲面方法计算了正弦-戈登模型在有限温度下的两点及高阶关联函数。\n2. 其技术优势在于该方法能在传统形式因子展开与半经典方法均失效的中间温区提供可靠的非微扰数据，并导出了满足特定选择规则的任意N点函数的精确结果。\n3. 这为直接计算有限温度下复杂的多点观测量提供了明确的数值途径，并可用于系统地表征关联函数的非高斯特性。", "summary_source": "deepseek", "authors": [{"name": "M. Tóth"}, {"name": "J. H. Pixley"}, {"name": "G. Takács"}, {"name": "M. Kormos"}], "featured_authors": [{"name": "M. Tóth"}, {"name": "J. H. Pixley"}, {"name": "G. Takács"}, {"name": "M. Kormos"}], "author_count": 4}, {"id": "2604.12605", "category": "cond-mat", "title": "Quantum dynamics of coupled quasinormal modes and quantum emitters interacting via finite-delay propagating photons", "abstract": "A time-dependent theory for the interactions between spatially separated lossy cavities in a homogeneous background medium using quantized quasinormal modes (QNMs) is presented. The cavities interact via a bath of traveling photons, described by non-bosonic operators that are orthogonal to the open-cavity QNMs. The retarded (i.e., time-delayed) inter-cavity dynamics are fully described by system-bath correlation functions, in which the emission from one cavity appears as the input field for another. Coupling between quantum emitters (described as two-level systems), placed inside a cavity or embedded in an external medium, and the electromagnetic field (cavity modes and bath photons) is included in the theory, which gives rise to both bath-mediated and QNM-mediated interactions between the emitters.", "url": "https://arxiv.org/abs/2604.12605", "type": "理论+数值", "summary": "1. 该工作提出了一个基于量化准正模式的时间依赖理论，用以描述空间分离的损耗光学腔通过传播光子浴发生的相互作用，并包含了腔内或外部介质中量子发射器与电磁场的耦合。\n2. 其技术核心在于采用与开放腔准正模式正交的非玻色子算符描述光子浴，并通过系统-浴关联函数完整刻画了具有有限时间延迟的腔间动力学。\n3. 该理论框架为深入探究开放量子系统中，由浴介导和局域模式介导的多种发射器-发射器相互作用机制提供了统一且严格的基础。", "summary_source": "deepseek", "authors": [{"name": "Robert Meiners Fuchs"}, {"name": "Juanjuan Ren"}, {"name": "Sebastian Franke"}, {"name": "Stephen Hughes"}, {"name": "Marten Richter"}], "featured_authors": [{"name": "Robert Meiners Fuchs"}, {"name": "Juanjuan Ren"}, {"name": "Sebastian Franke"}, {"name": "Stephen Hughes"}, {"name": "Marten Richter"}], "author_count": 5}, {"id": "2604.12609", "category": "cond-mat", "title": "Symmetry breaking structural relaxation and optical transitions of native defects and carbon impurities in LiGa$_5$O$_8$", "abstract": "LiGa$_5$O$_8$ in a spinel type structure has recently been claimed to be an unintentional p-type ultra-wide-band-gap oxide semiconductor. While previous computational work did not yet identify the origin of p-type doping and in fact predicted insulating behavior by compensation of deep acceptors by shallow donors, defect characterization in terms of its optical signatures remains important. Rather than focusing on thermodynamics transition levels, as in earlier work, this present paper focuses on the vertical transitions in a defect configuration diagram of defects in different charge states, representing absorption and emission processes involving carrier capture/emission from/to band edges. In addition, the structural relaxation of several native defects is revisited by allowing for more complex symmetry-breaking distortions in an effort to reconcile conflicting results in the previous literature. Special attention is given to the Li vacancy because it is the shallowest native acceptor. For this defect, the previously reported transition levels are revised on the basis of symmetry-breaking relaxations. The structural relaxations, band structures, and densities of states are compared between the symmetry-broken polaronic and symmetry-conserving non-polaronic states. Finally, we also study carbon impurities, which are likely to originate from growth methods involving organic precursors.", "url": "https://arxiv.org/abs/2604.12609", "type": "理论", "summary": "1. 该工作通过对称性破缺结构弛豫与缺陷构型图垂直跃迁分析，重新表征了LiGa5O8中本征缺陷（特别是Li空位）和碳杂质的电子结构。\n2. 方法上突破了此前对称性保持的限制，通过极化子态弛豫修正了浅受主的跃迁能级，并利用构型图直接对应光吸收/发射过程，解决了文献中能级预测的矛盾。\n3. 这为厘清该宽带隙氧化物p型掺杂来源提供了关键依据，并对涉及有机前驱体的生长工艺中杂质行为的研究具有直接参考价值。", "summary_source": "deepseek", "authors": [{"name": "Klichchupong Dabsamut"}, {"name": "Adisak Boonchun"}, {"name": "Walter R. L. Lambrecht"}], "featured_authors": [{"name": "Klichchupong Dabsamut"}, {"name": "Adisak Boonchun"}, {"name": "Walter R. L. Lambrecht"}], "author_count": 3}, {"id": "2604.12636", "category": "cond-mat", "title": "Nonmonotonic Scaling of the Anomalous Hall Effect in a Bicollinear Antiferromagnet", "abstract": "An anomalous Hall effect (AHE) in antiferromagnetic (AF) systems with no net magnetization is of considerable interest for both fundamental physics and spintronic applications. Of particular interest is the two-dimensional van der Waals antiferromagnet FeTe that has an unusual fully magnetically compensated bicollinear AF structure and exhibits pronounced Kondo interaction leading to strong band renormalization. Here, we investigate the AHE in epitaxial FeTe thin films grown by molecular beam epitaxy. A large anomalous Hall conductivity is exhibited below the Neel temperature (T_N ~ 60 K) and, strikingly, becomes nonlinear at high fields within a narrow temperature window around 49 K, deviating from conventional AHE scaling behavior versus its longitudinal conductivity. Linear fits reveal a pronounced negative peak in the intercept, accompanied by a field-induced canted magnetic moment. The AHE responses are related to the Berry curvature derived from FeTe's topological band structure, highlighting the intricate interplay between topology, magnetism, and electronic transport.", "url": "https://arxiv.org/abs/2604.12636", "type": "理论", "summary": "1. 该工作研究了分子束外延生长的FeTe薄膜中反常霍尔效应的非单调标度行为。\n2. 其卖点在于发现高场下AHE在49 K附近偏离常规标度，与贝里曲率和场致倾斜磁矩相关。\n3. 这为理解拓扑能带结构、反铁磁性与输运性质之间的复杂相互作用提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Ruifeng Wang"}, {"name": "Chi Fang"}, {"name": "Ilya Kostanovski"}, {"name": "Ke Xiao"}, {"name": "Felix Küster"}, {"name": "Jenny Davern"}, {"name": "Naoto Nagaosa"}, {"name": "Stuart S. P. Parkin"}], "featured_authors": [{"name": "Ruifeng Wang"}, {"name": "Chi Fang"}, {"name": "Ilya Kostanovski"}, {"name": "Jenny Davern"}, {"name": "Naoto Nagaosa"}, {"name": "Stuart S. P. Parkin"}], "author_count": 8}, {"id": "2604.12670", "category": "cond-mat", "title": "Role of diffusion-induced grain boundary migration during molten salt corrosion of a Ni-30Cr alloy", "abstract": "The response of Ni-Cr alloys to exposure to molten chloride and fluoride salts is typically characterized by Cr dealloying with the formation of a Cr-depleted bi-continuous porous subsurface layer. The exact mechanism behind the loss of Cr over distances unattainable by lattice diffusion alone is still debated. To address this question, two different surface finishes, namely electropolished and sanded, of a Ni-30Cr alloy were exposed to LiCl-KCl-2wt% EuCl3 eutectic salt at 500 °C for 96 hours. In the absence of fast diffusion pathways, dissolution occurred layer by layer and was kinetically controlled by Ni dissolution, as observed over the grain interiors of the electropolished sample. Grain boundaries were subject to diffusion-induced grain boundary migration (DIGM), leading to the formation of pure Ni islands above grain boundaries. This overall behavior contrasted with the sanded surface response that was characterized by several micrometer deep interconnected porosity and complete Cr depletion. DIGM of the dense grain boundaries created by recrystallization of the sanded surface was responsible for the observed sub-surface microstructure. This work unequivocally establishes DIGM as a key mechanism in alloy molten salt corrosion, and microstructure as a decisive contributor to an alloy's corrosion response.", "url": "https://arxiv.org/abs/2604.12670", "type": "理论", "summary": "1. 该工作通过对比电抛光与打磨表面处理的Ni-30Cr合金在熔盐中的腐蚀行为，揭示了微观结构对腐蚀响应的影响。\n2. 研究明确了扩散诱导晶界迁移是导致亚表面形成纯镍岛并促成铬长程流失的关键物理机制。\n3. 这为理解合金在熔盐中的腐蚀过程及通过微观结构设计提升耐蚀性提供了明确的物理基础。", "summary_source": "deepseek", "authors": [{"name": "Konnor Walter"}, {"name": "Jagadeesh Sure"}, {"name": "Adrien Couet"}, {"name": "Emmanuelle A. Marquis"}], "featured_authors": [{"name": "Konnor Walter"}, {"name": "Jagadeesh Sure"}, {"name": "Adrien Couet"}, {"name": "Emmanuelle A. Marquis"}], "author_count": 4}, {"id": "2604.12701", "category": "cond-mat", "title": "Supercurrent-induced phonon angular momentum", "abstract": "We propose a mechanism of supercurrent-induced phonon angular momentum in mixed parity superconductors and s-wave superconductors with spin orbit coupling. We derive analytical expressions of phonon angular momentum induced by the supercurrent by perturbative calculation. The physical interpretation of this effect is also discussed.", "url": "https://arxiv.org/abs/2604.12701", "type": "数值", "summary": "1. 该工作通过微扰计算，推导了混合宇称超导体及具有自旋轨道耦合的s波超导体中由超流诱导的声子角动量的解析表达式。\n2. 其核心在于揭示了超流作为驱动源，可在特定超导体系中产生可计算的声子轨道角动量，并阐明了该效应的物理图像。\n3. 这为在超导体系中探索声子角动量的非平衡调控及其与电子序的耦合提供了新的理论视角与研究框架。", "summary_source": "deepseek", "authors": [{"name": "Takehito Yokoyama"}], "featured_authors": [{"name": "Takehito Yokoyama"}], "author_count": 1}, {"id": "2604.12722", "category": "cond-mat", "title": "Spintronic THz emitters based on NiCu alloys", "abstract": "We study THz emission from ferromagnet / nonmagnetic material (FM/NM) spintronic nanostructures in which the $Ni_xCu_{1-x}$ alloy with different $x$ is used as an FM, an NM, or both layers. The stoichiometric composition of the NiCu alloys standing at two positions (we denote it as [FM] or [PM]) is chosen so that it is ferromagnetic at room temperature in the case it is used as the FM layer, and is paramagnetic at room temperature for the NM layer. Besides, we choose the nickel ratio $x$ close to each other for both [FM] and [PM] types of the alloy (the difference is only $10\\%$). We show that although NiCu[PM] does not contain heavy metal it acts as an effective converter of spin current into the electric one in our structure showing only 2.8 times smaller efficiency than Pt. Besides, the NiCu[FM] alloy, despite having quite small Curie temperature (approximately $65 ^\\circ C$), acts as an effective spin source having the efficiency only 2 times smaller than Co in similar structures. This shows up the importance of boundary matching in the spintronic THz sources. Our NiCu-based THz sources reveal a possibility of effective thermally induced control of emission of THz radiation due to a unique combination of high emission rate and relatively small Curie temperature.", "url": "https://arxiv.org/abs/2604.12722", "type": "理论", "summary": "1. 该工作利用NiCu合金作为铁磁或顺磁层，构建并研究了自旋太赫兹发射器的发射性能。\n2. 其核心物理在于NiCu顺磁层无需重金属即可高效实现自旋-电荷转换，而铁磁层虽居里温度低仍能高效注入自旋。\n3. 这为通过边界匹配和低居里温度实现热可控太赫兹发射提供了新的材料设计思路。", "summary_source": "deepseek", "authors": [{"name": "E. A. Karashtin"}, {"name": "I. Yu. Pashen'kin"}, {"name": "A. V. Gorbatova"}, {"name": "E. D. Lebedeva"}, {"name": "P. Yu. Avdeev"}, {"name": "N. V. Bezvikonnyi"}, {"name": "A. M. Buryakov"}], "featured_authors": [{"name": "E. A. Karashtin"}, {"name": "I. Yu. Pashen'kin"}, {"name": "A. V. Gorbatova"}, {"name": "P. Yu. Avdeev"}, {"name": "N. V. Bezvikonnyi"}, {"name": "A. M. Buryakov"}], "author_count": 7}, {"id": "2604.12732", "category": "cond-mat", "title": "Quantum percolation in honeycomb lattices under random spin-orbit coupling", "abstract": "We investigate quantum percolation in a honeycomb lattice with site dilution and random spin-orbit coupling. Using exact diagonalization combined with finite-size scaling analysis, we study the metal-insulator transition, extracting the quantum percolation threshold $p_q$, and the correlation-length exponent, $\\nu$. In the absence of spin-orbit coupling, we find that $p_q$ remains finite and demonstrate that the quantum threshold is significantly higher than the classical site-percolation threshold $p_c$ of the honeycomb lattice. When spin-orbit coupling is present, the spectral statistics exhibit a crossover from the Gaussian orthogonal ensemble to the Gaussian symplectic ensemble, reflecting the change in symmetry class. Simultaneously, the quantum percolation threshold shifts systematically to lower occupation probabilities, indicating that the spin-orbit coupling favors delocalization. For sufficiently strong spin-orbit coupling, $p_q$ tends to saturate, while the critical exponent approaches the expected one of the two-dimensional symplectic universality class.", "url": "https://arxiv.org/abs/2604.12732", "type": "理论+数值", "summary": "1. 该工作通过精确对角化与有限尺寸标度分析，研究了具有位置无序稀释和随机自旋轨道耦合的蜂窝晶格中的量子渗透现象。\n2. 研究发现，随机自旋轨道耦合诱导体系对称性类改变（GOE至GSE），并系统性地降低量子渗透阈值，表明其促进了电子离域。\n3. 这为理解二维无序系统中，对称性对量子输运与金属-绝缘体相变临界行为的调控作用提供了明确的理论基准。", "summary_source": "deepseek", "authors": [{"name": "W. S. Oliveira"}, {"name": "Julián Faúndez"}, {"name": "Welles Morgado"}], "featured_authors": [{"name": "W. S. Oliveira"}, {"name": "Julián Faúndez"}, {"name": "Welles Morgado"}], "author_count": 3}, {"id": "2604.12759", "category": "cond-mat", "title": "Localization and Flat Bands in Edge-Inflated Lattices", "abstract": "We study localization and flat-band formation in lattices generated by repeated edge inflation of square, honeycomb, and triangular parent lattices. Replacing each bond by a finite tight-binding chain produces several distinct classes of flat bands: chain-induced flat bands at the eigenenergies of the inserted chains, symmetry-protected zero-energy flat bands in bipartite edge-inflated lattices, and nearly flat junction bands near the spectral edges for sufficiently long chains. We analyze these mechanisms for ordered Lieb-$L$, super$^{L}$honeycomb, and super$^{L}$triangular lattices, and examine their response to bond disorder, site disorder, random magnetic flux, and randomness in the inflation process itself. While bond and site disorder broaden most flat bands, the zero-energy chiral band and the junction-induced flat bands remain robust under certain perturbations. Remarkably, substantial flat-band features also persist in randomly edge-inflated graphs, even in the absence of translational symmetry. In particular, the number of zero-energy states is found to be well estimated by the matching deficiency $N-2\\nu(G)$, indicating that local tree-like structure continues to control the low-energy nullity. These results identify edge-inflated lattices as a broad class of systems in which geometry alone generates robust localization in both ordered and random settings.", "url": "https://arxiv.org/abs/2604.12759", "type": "理论", "summary": "1. 该工作系统研究了正方形、蜂窝和三角形母晶格经边缘膨胀生成的晶格中局域化与平带的形成，重点关注有序Lieb-L、超L蜂窝和超L三角形结构。\n2. 其技术核心在于阐明了链插入诱导、对称性保护零能平带及连接点近平带等多种机制，并揭示了它们在键无序、位点无序、随机磁通及随机膨胀下的鲁棒性差异。\n3. 这些发现表明边缘膨胀晶格作为一类广泛系统，仅凭几何结构即可在有序和无序环境下产生鲁棒局域化，为零能态数目与匹配缺陷的关系提供了新见解。", "summary_source": "deepseek", "authors": [{"name": "Richard Berkovits"}], "featured_authors": [{"name": "Richard Berkovits"}], "author_count": 1}, {"id": "2604.12764", "category": "cond-mat", "title": "Exact demagnetisation field for periodic one-dimensional array of rectangular prisms", "abstract": "The magnetic field from a uniformly magnetised, rectangular prism is known exactly, which is the basis for a large number of micromagnetic simulations. Here we derive an analytical solution for the field from a periodically repeating infinite array of prisms aligned end-to-end, which becomes exact on the center axis in the limit of infinitesimally thin prisms. Using the same method we derive the on-axis field for a one-dimensional array of point dipoles. We validate the obtained results numerically and furthermore compare with the common macrogeometry approach and more recent uniform magnetisation method, demonstrating an excellent convergence rate for the novel method.", "url": "https://arxiv.org/abs/2604.12764", "type": "理论+数值", "summary": "1. 本文推导了无限周期排列的矩形棱柱一维阵列所产生的退磁场的解析解。\n2. 该方法在中心轴上对无穷薄棱柱极限给出精确解，并展现出优于常用宏观几何方法的收敛性。\n3. 这为微磁学模拟提供了新的精确基准，并可提升相关周期性结构计算的效率与精度。", "summary_source": "deepseek", "authors": [{"name": "Frederik Laust Durhuus"}, {"name": "Andrea Roberto Insinga"}, {"name": "Rasmus Bjørk"}], "featured_authors": [{"name": "Frederik Laust Durhuus"}, {"name": "Andrea Roberto Insinga"}, {"name": "Rasmus Bjørk"}], "author_count": 3}, {"id": "2604.12824", "category": "cond-mat", "title": "All optical ultrafast pure spin current in the altermagnet Cr$_2$SO", "abstract": "All-optical generation of pure spin current -- the flow of spin in the absence of a corresponding charge flow -- relies on a symmetry based compensation of valley charge. The 2d $d$-wave altermagnets, ideal spintronics materials due to a very low spin-orbit coupling, possess a magnetic point group and highly anisotropic valley manifolds that would appear to preclude such current compensation, excluding them as materials for the ultrafast generation of pure spin current. Here we show that infra-red valley excitation combined with a THz pulse envelope allows the generation of large and nearly 100\\% pure spin currents in the altermagnet Cr$_2$SO. Our approach is based on a valley selection rule coupling linearly polarized light to spin opposite valleys, along with the intrinsic momentum shift that a co-occurring THz pulse imbues a valley spin excitation with. These results thus provide a practical and all-optical route to the generation of pure spin current in $d$-wave 2d altermagnets, opening a route to lightwave control of spin in an environment with very low intrinsic spin mixing.", "url": "https://arxiv.org/abs/2604.12824", "type": "理论", "summary": "1. 该工作利用红外谷激发与太赫兹脉冲包络相结合的方法，在d波二维交换磁体Cr$_2$SO中实现了大且纯度接近100%的全光超快纯自旋流产生。\n2. 其核心物理机制基于线性偏振光与自旋相反能谷耦合的谷选择定则，以及伴随太赫兹脉冲赋予谷自旋激发的本征动量偏移，从而克服了材料高各向异性能谷对电荷补偿的阻碍。\n3. 这为在自旋混合极低的环境下实现自旋的光波调控开辟了可行路径，并为二维d波交换磁体的超快自旋电子学应用提供了明确方案。", "summary_source": "deepseek", "authors": [{"name": "Deepika Gill"}, {"name": "Ruikai Wu"}, {"name": "Peter Elliott"}, {"name": "Sangeeta Sharma"}, {"name": "Sam Shallcross"}], "featured_authors": [{"name": "Deepika Gill"}, {"name": "Ruikai Wu"}, {"name": "Peter Elliott"}, {"name": "Sangeeta Sharma"}, {"name": "Sam Shallcross"}], "author_count": 5}, {"id": "2604.12939", "category": "cond-mat", "title": "Dynamical Poles in Non-Hermitian Impurity Scattering", "abstract": "In Hermitian impurity scattering, each isolated late-time exponential is the fingerprint of a bound state. We show that this correspondence breaks down in non-Hermitian bands. For a single impurity in a non-Hermitian lattice, the late-time signal is controlled by isolated complex frequencies selected by the analytic continuation of the Green's function relevant to real-time dynamics, which we term dynamical poles (DPs). DPs need not coincide with static bound states: one may appear without any bound-state counterpart, while a static bound state may be dynamically invisible. The remainder of the signal is an incoherent background set by complex continuum edges. Our results establish that the real-time analytic structure of the Green's function, not the static eigenvalue problem alone, organizes non-Hermitian impurity scattering.", "url": "https://arxiv.org/abs/2604.12939", "type": "理论", "summary": "1. 该工作揭示了非厄米杂质散射中晚期指数衰减信号与束缚态的对应关系失效，并引入了控制该动力学的“动力学极点”概念。\n2. 其核心在于证明动力学极点由实时动力学格林函数的解析延拓所选取，它们无需与静态束缚态对应，且连续谱带边贡献非相干背景。\n3. 这确立了对非厄米杂质散射动力学的理解必须基于格林函数的实时解析结构，而非仅依赖静态本征问题，为相关理论研究提供了新范式。", "summary_source": "deepseek", "authors": [{"name": "Ao Yang"}, {"name": "Kai Zhang"}, {"name": "Chen Fang"}], "featured_authors": [{"name": "Ao Yang"}, {"name": "Kai Zhang"}, {"name": "Chen Fang"}], "author_count": 3}, {"id": "2604.12975", "category": "cond-mat", "title": "Probing spinon interactions in the spin-1 bilinear-biquadratic chain", "abstract": "We study the dynamical spin and nematic correlations in the bilinear-biquadratic spin-1 chain in the critical phase hosting deconfined spinons. We demonstrate how spinon interactions can be directly probed in the presence of a magnetic field or a single-ion anisotropy. Our analytical predictions are supported by numerical matrix-product-state (MPS) simulations of the underlying microscopic model.", "url": "https://arxiv.org/abs/2604.12975", "type": "理论+数值", "summary": "1. 该工作研究了双线性-双二次型自旋-1链临界相中自旋子相互作用对应的动力学自旋与向列关联。\n2. 其核心在于揭示了如何利用外磁场或单离子各向异性直接探测自旋子之间的相互作用。\n3. 这为在更广泛的退禁闭自旋子体系中定量研究其相互作用机制提供了明确的理论与数值方案。", "summary_source": "deepseek", "authors": [{"name": "Yonatan Lin"}, {"name": "Oleg A. Starykh"}, {"name": "Anna Keselman"}], "featured_authors": [{"name": "Yonatan Lin"}, {"name": "Oleg A. Starykh"}, {"name": "Anna Keselman"}], "author_count": 3}, {"id": "2604.12979", "category": "cond-mat", "title": "Evidence for Umklapp electron scattering emission from metal photocathodes", "abstract": "Comparison of the measured spectral emission properties of single-crystal Cu(001) and W(111) photocathodes to established photoemission theories reveal evidence for an additional one photon emission process predominantly affecting electron emission near and below the photoemission threshold. This additional photoemission process is postulated to be due to a momentum-resonant Franck-Condon mechanism mediated by inelastic Umklapp electron scattering. An initial first-principles simulation of this emission process (involving the electron thermal effective mass, the inelastic electron mean free path at the vacuum level, and the number of Fermi surfaces in the metal), when combined with a direct one-step band emission model, is consistent with the measured spectral dependencies of both the quantum efficiency and mean transverse energy of electron photoemission from the two single-crystal metal photocathodes.", "url": "https://arxiv.org/abs/2604.12979", "type": "理论+数值", "summary": "1. 该论文通过系统比较单晶Cu(001)与W(111)光电阴极的光谱发射测量与现有光发射理论，揭示了在光发射阈值附近及以下存在一个额外的单光子发射过程。\n2. 其物理创新在于提出该过程由非弹性Umklapp电子散射通过动量共振弗兰克-康登机制介导，并首次利用包含电子热有效质量、真空能级处非弹性平均自由程及费米面数量的第一性原理模拟进行描述。\n3. 模拟结果与直接单步能带发射模型结合，与量子效率和平均横向能量的光谱依赖测量一致，这为金属光电阴极的发射机制提供了新解释，并启发了相关光电子器件的设计与优化研究。", "summary_source": "deepseek", "authors": [{"name": "I-J. Shan"}, {"name": "L.A. Angeloni"}, {"name": "W. Andreas Schroeder"}], "featured_authors": [{"name": "I-J. Shan"}, {"name": "L.A. Angeloni"}, {"name": "W. Andreas Schroeder"}], "author_count": 3}, {"id": "2604.11877", "category": "hep-th", "title": "Generalized symmetries and emergence in axion effective field theories", "abstract": "We study the phenomenological consequences of higher symmetry structures in axion effective field theories. Higher-group and non-invertible symmetries impose parametric constraints on the energy scales at which different symmetries can emerge in the infrared, providing a guide to the ultraviolet physics. We clarify and analyze these emergence constraints in axion EFTs coupled to abelian and non-abelian gauge bosons, with and without charged matter. We show that emergence constraints are universally saturated by anomaly inflow onto topological defects, while in perturbative UV completions they are supererogatory owing to the parametric separation of scales.", "url": "https://arxiv.org/abs/2604.11877", "type": "理论", "summary": "1. 该工作系统研究了轴子有效场论中高阶群与非可逆对称性的唯象学后果，具体分析了它们在与阿贝尔或非阿贝尔规范玻色子（含或不含带电物质）耦合时对红外对称性涌现能标的参数化约束。\n2. 其核心物理在于揭示了这些涌现约束普遍通过异常流入拓扑缺陷而饱和，而在微扰紫外完成中，由于能标分离，这些约束成为超余的。\n3. 这为从红外唯象反推紫外物理提供了明确指南，并对理解对称性涌现机制及相关有效场论的构建具有重要启示。", "summary_source": "deepseek", "authors": [{"name": "Dan Sehayek"}, {"name": "Nathaniel Craig"}], "featured_authors": [{"name": "Dan Sehayek"}, {"name": "Nathaniel Craig"}], "author_count": 2}, {"id": "2604.11884", "category": "hep-th", "title": "Manifest duality and Lorentz covariance for linearised gravity as edge modes", "abstract": "We present the first formulation of linearised gravity in four dimensions which is manifestly Lorentz covariant and democratic, i.e. treats the two frames related by electric-magnetic duality on equal footing. It is well-known that four-dimensional linearised gravity belongs to a class of singleton representations of the four-dimensional conformal algebra $\\mathfrak{so}(2,4)$. Our key insight is viewing this algebra as the isometry of $\\text{AdS}_5$ and realising the massless spin-2 field as an edge mode of a five-dimensional topological field taking values in a specific finite-dimensional representation of $\\mathfrak{so}(2,4)$. The desired four-dimensional action is then found by a covariant boundary reduction procedure.", "url": "https://arxiv.org/abs/2604.11884", "type": "理论", "summary": "1. 本文提出了四维线性引力的首个显式洛伦兹协变且对偶对称的表述框架。\n2. 其核心在于将四维共形代数视为 AdS₅ 等距代数，并将无质量自旋-2场实现为特定有限维表示下五维拓扑场的边缘模式。\n3. 这为通过协变边界约化方法研究引力对偶性及高阶自旋场理论提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Calvin Y.-R. Chen"}, {"name": "Euihun Joung"}, {"name": "Karapet Mkrtchyan"}], "featured_authors": [{"name": "Calvin Y.-R. Chen"}, {"name": "Euihun Joung"}, {"name": "Karapet Mkrtchyan"}], "author_count": 3}, {"id": "2604.11894", "category": "hep-th", "title": "Thermodynamics of Chern-Simons AdS$_5$ black holes coupled to $\\mathrm{SU}(2)$ solitons", "abstract": "We investigate properties of the five-dimensional Chern--Simons AdS black hole coupled to $\\mathrm{SU}(2)$ solitons by means of a minisuperspace approximation adapted to static, spherically symmetric configurations. The reduced action reproduces the known branch of solutions and provides a variational framework in which the boundary terms determine the conserved quantities and their conjugate variables. In particular, we recover the energy and the $\\mathrm{U}(1)$ charge previously obtained by Hamiltonian methods, while the enlarged parameter space also reveals a momentum conjugate to the trace-torsion mode. The Euclidean action yields an entropy satisfying the first law of black hole thermodynamics. In contrast to many other torsional black hole models, the axial torsion parameter, describing the secondary black hole hair, together with the trace-torsion mode, contributes nontrivially to the entropy. The expression for the entropy obtained in this way is further confirmed by the other two methods found in the literature.", "url": "https://arxiv.org/abs/2604.11894", "type": "理论", "summary": "1. 该工作采用迷你超空间近似，研究了五维 Chern-Simons AdS 黑洞与 SU(2) 孤子耦合的静态球对称热力学。\n2. 其卖点在于变分框架揭示了守恒量及其共轭变量，并证明轴扭率和迹扭率对熵有非平凡贡献。\n3. 这为扭率黑洞模型的热力学提供了可靠描述，并支持了变分方法在类似系统中的适用性。", "summary_source": "deepseek", "authors": [{"name": "Laura Andrianopoli"}, {"name": "Dušan Đorđević"}, {"name": "Olivera Miskovic"}], "featured_authors": [{"name": "Laura Andrianopoli"}, {"name": "Dušan Đorđević"}, {"name": "Olivera Miskovic"}], "author_count": 3}, {"id": "2604.11896", "category": "hep-th", "title": "Strong coupling dynamics of defect RG flows in ABJM", "abstract": "Wilson loop operators in ABJM theory provide a rich arena for studying defect conformal field theories (dCFTs) and the renormalization group (RG) flows connecting them. While these are well understood at weak coupling, a complete strong-coupling picture remains an open problem. In this paper, we present a systematic analysis of defect RG flows in ABJM at strong coupling, via holography. By examining fluctuations of fundamental strings in the AdS$_4 \\times \\mathbb{CP}^3$ background around classical AdS$_2$ solutions, we map worldsheet excitations to the operators in the dual dCFT which are responsible for the flows and determine their scaling dimensions, including subleading corrections from one-loop worldsheet effects. We show how different boundary conditions on string coordinates correspond to distinct operators and provide a geometric realization of the RG flows through interpolating boundary conditions. We apply this framework to fermionic 1/2 BPS, bosonic 1/6 BPS, and non-supersymmetric Wilson loops, establishing a coherent strong-coupling picture in which the 1/2 BPS loop is IR stable, the 1/6 BPS loop acts as a saddle point, and the non-supersymmetric configuration emerges as a natural UV fixed point. We also advance a proposal for the holographic dual of a second non-supersymmetric loop, in terms of averaging over Dirichlet boundary conditions.", "url": "https://arxiv.org/abs/2604.11896", "type": "理论", "summary": "1. ABJM 理论中的威尔逊环算子为研究缺陷共形场论 (dCFT) 和连接它们的重正化群 (RG) 流提供了丰富的舞台。\n2. 我们将该框架应用于费米子 1/2 BPS、玻色子 1/6 BPS 和非超对称威尔逊环，建立了一个相干强耦合图像，其中 1/2 BPS 环是红外稳定的，1/6 BPS 环充当鞍点，非超对称配置作为自然紫外固定点出现。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Marco S. Bianchi"}, {"name": "Luigi Castiglioni"}, {"name": "Silvia Penati"}, {"name": "Marcia Tenser"}, {"name": "Diego Trancanelli"}], "featured_authors": [{"name": "Marco S. Bianchi"}, {"name": "Luigi Castiglioni"}, {"name": "Silvia Penati"}, {"name": "Marcia Tenser"}, {"name": "Diego Trancanelli"}], "author_count": 5}, {"id": "2604.11902", "category": "hep-th", "title": "Universal formulae for correlators of a broad class of models", "abstract": "A simple method is presented for deriving universal formulae for the correlators, frequently denoted $W_{g,n}(\\{z_i\\}), i=1,..n$, of a wide range of models of physical and mathematical interest. While many alternative methods exist for constructing such correlators, these formulae can be simply written in terms of one defining function and its derivatives. The method has been applied to the Airy and Bessel models, various minimal string and superstring theories, and their associated intersection theory settings, ordinary and various kinds of supersymmetric Weil-Petersson volumes, and more besides. For all these cases, their $W_{g,n}(\\{z_i\\})$ are just all specializations of the {\\it same} universal formulae. A special variant of the method useful for ${N}{=}1$ supersymmetric cases is also presented. It allows for swift derivations of Norbury's three closed-form formulae for the volumes $V_{g,n}$ ($g{=}1,2,3$) of ${ N}{=}1$ supersymmetric Weil-Petersson volumes, and generalizations of them to a wider set of models. Moreover a new closed-form formula for the genus 4 case $V_{4,n}$ is derived. The straightforward method for how to derive such formulae for $g{>}4$ cases is described. Throughout, crucial roles are played by the underlying integrable KdV flows, as well as the Gel'fand-Dikii equation.", "url": "https://arxiv.org/abs/2604.11902", "type": "理论", "summary": "1. 该论文提出了一种推导广泛物理与数学模型关联函数通用公式的简明方法，并将其应用于Airy模型、贝塞尔模型、多种极小弦与超弦理论及相关相交理论、Weil-Petersson体积等众多体系。\n2. 其核心在于所有体系的关联函数均可通过单一生成函数及其导数的同一组普适公式表达，该方法本质植根于KdV可积流与Gel'fand-Dikii方程。\n3. 这为统一处理各类可积体系关联函数提供了系统框架，并可进一步推广至更高亏格情形及超对称扩展，例如文中已给出N=1超对称Weil-Petersson体积在亏格四的新显式公式。", "summary_source": "deepseek", "authors": [{"name": "Clifford V. Johnson"}], "featured_authors": [{"name": "Clifford V. Johnson"}], "author_count": 1}, {"id": "2604.12037", "category": "hep-th", "title": "From Vacuum to Nucleon: Exact Fixed-Scale Matching of Holographic Current Correlators to QCD", "abstract": "Holographic QCD reproduces the leading short-distance vector-current two-point function in vacuum, fixing the bulk gauge coupling by matching the logarithmic $Q^2$ dependence of the boundary current correlator. We show that this vacuum matching extends to the off-forward hadronic current-current correlator relevant for DDVCS/DVCS. Starting from the fixed-$j$ $t$-channel Witten diagram, we derive a factorized holographic Compton amplitude whose ultraviolet photon vertex is universal and model independent, while all infrared sensitivity is isolated in hadronic conformal moments. In the conformal limit this upper vertex depends only on the pure-AdS bulk wave functions of the virtual photons and yields an exact Gauss hypergeometric kernel. In the collinear window and at a single matching scale $Q=\\mu=\\mu_0=\\mu_\\ast$, this kernel matches exactly the $\\pm$-basis Wilson coefficients of the singlet conformal operator product expansion in perturbative QCD. The channel dictionary is fixed dynamically: the closed-string branch matches the protected $(-)$ eigenchannel, while the open-string branch matches the unprotected $(+)$ eigenchannel, with the first physical even moment $j=2$ and the distinct $\\sqrt{j-2}$ versus $\\sqrt{j-1}$ branch points providing the sharpest anchor. The result is therefore an exact fixed-scale matching statement for the hadronic current-current correlator in the fixed-$j$ channel. It identifies the holographic DDVCS/DVCS amplitude as a hadronic generalization of the familiar vacuum current-correlator matching.", "url": "https://arxiv.org/abs/2604.12037", "type": "理论", "summary": "1. 本研究将全息QCD中的真空流流关联函数匹配方案推广至深度虚康普顿散射相关的非向前强子流流关联函数。\n2. 核心在于推导出因子化的全息康普顿振幅，其上顶点为普适的高斯超几何核，并在单一匹配尺度下与微扰QCD中的共形算子展开系数精确匹配。\n3. 这一精确固定尺度匹配结果为全息框架下研究强子结构提供了新基准，并为探索共形极限到非共形物理的过渡指明了具体路径。", "summary_source": "deepseek", "authors": [{"name": "Kiminad A. Mamo"}], "featured_authors": [{"name": "Kiminad A. Mamo"}], "author_count": 1}, {"id": "2604.12038", "category": "hep-th", "title": "Holographic Open/Closed Exchange in Double Deeply Virtual Compton Scattering: Fixed--$j$ Structural Matching to the $\\pm$-Basis Wilson Coefficients", "abstract": "We show that, in the collinear regime, the fixed--$j$ holographic double deeply virtual Compton scattering (DDVCS) amplitude contains the same hypergeometric hard kernel as the $\\pm$-basis Wilson coefficients of perturbative QCD. Starting from the $t$--channel Witten diagram, we derive the closed-string fixed--$j$ amplitude and obtain the even-spin open-string channel by a parallel replacement rule. After holographic collinear factorization, the upper photon vertex is universal and model independent: in the conformal limit it depends only on the pure-AdS bulk wave functions of the two virtual photons and yields an exact Gauss hypergeometric function of $\\eta^2/\\xi^2$. The Mellin exponent $\\delta_X(j)=j+\\Delta_X(j)-2=2j+\\gamma_X(j)$ is fixed by Witten-diagram $z$-power counting, while all infrared model dependence is isolated in lower hadronic conformal moments. Comparing with the singlet vector Compton form factor in the conformal operator product expansion, we find that at a single matching scale $Q=\\mu=\\mu_0=\\mu_\\ast$ the open channel matches the $(+)$ eigenchannel and the closed channel matches the protected $(-)$ eigenchannel. The sharpest anchor is the first physical even moment $j=2$, together with the distinct $\\sqrt{j-1}$ and $\\sqrt{j-2}$ branch-point structure of the open and closed trajectories. Logarithmic running deforms only the scale dependence, not the channel dictionary. The result is a fixed--$j$, fixed-scale structural matching statement for holographic DDVCS/DVCS, not a claim of all-scale equality or a global fit.", "url": "https://arxiv.org/abs/2604.12038", "type": "理论", "summary": "1. 该工作通过计算全息对偶下的固定j点双深度虚康普顿散射振幅，揭示了其在共形极限下与微扰QCD中±基威尔逊系数具有相同的超几何硬核结构。\n2. 技术关键在于从闭弦通道的固定j振幅出发，通过平行替换规则得到开弦通道，并证明在单一匹配能标下开弦通道与(+)本征道、闭弦通道与受保护的(-)本征道精确对应。\n3. 这一固定j点、固定能标的结构匹配关系为全息QCD与微扰QCD在深度非弹散射过程提供了可严格检验的对应框架，而非主张全能标普适性或全局拟合。", "summary_source": "deepseek", "authors": [{"name": "Kiminad A. Mamo"}], "featured_authors": [{"name": "Kiminad A. Mamo"}], "author_count": 1}, {"id": "2604.12055", "category": "hep-th", "title": "On a Deformed Holomorphic Chern-Simons Theory", "abstract": "We deform classical holomorphic Chern--Simons theory on a Calabi--Yau three-fold $X$ by deforming the complex structure by a deformation parameter $h \\in\\mathscr{H}^{0,1}(T^{1,0}X)$. The corresponding equations of motion admit new \"instanton solutions\" which which are invariant under re-scalings of $h$, and are perhaps more reminiscent of $G_2$-instantons for $G_2$ manifolds. We give examples of such instantons. In particular, when $h$ has non-vanishing Yukawa coupling ${\\rm Yuk}(h,h,h)\\neq 0$, it may be used to define a connection on ${\\rm End}(T^{1,0}X)$ solving the instanton constraint. Interestingly, this connection gives rise to a hermitian (self-adjoint) connection for a real gauge theory on the real bundle ${\\rm End}(TX)$ for only specific directions in deformation space, which may be classified using Morse theory. We quantize the deformed theory around these instanton backgrounds, and derive explicit expressions for the partition function in the limit where the complex structure deformation is large. We study anomalies, and the $h$-dependece of the partition function. In particular, coupling the theory to additional gravitational degrees of freedom, we find that the special directions in deformation space give rise to novel anomaly free theories on ${\\rm End}(T^{1,0}X)$.", "url": "https://arxiv.org/abs/2604.12055", "type": "理论", "summary": "1. 该工作通过引入变形参数 h 对卡拉比-丘三维流形上的经典全纯陈-西蒙斯理论进行变形，研究了新出现的瞬子解及其量子化。\n2. 核心在于揭示了当 Yukawa 耦合非零时，该变形可定义满足瞬子约束的联络，且仅在变形空间的特定方向上对应于实丛上的厄米联络。\n3. 这为在复结构变形空间中选择特殊方向以构造无反常理论提供了新途径，可能对相关高维规范理论与弦论背景的研究具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Eirik Høgmoe Kjelsnes"}, {"name": "Eirik Eik Svanes"}, {"name": "Vegard Undheim"}], "featured_authors": [{"name": "Eirik Høgmoe Kjelsnes"}, {"name": "Eirik Eik Svanes"}, {"name": "Vegard Undheim"}], "author_count": 3}, {"id": "2604.12207", "category": "hep-th", "title": "Arithmetic turbulence: Algebraic derivation of the Euler ensemble attractor", "abstract": "The Euler ensemble was recently supported by large-scale ($4096^3$) direct numerical simulations as the universal statistical attractor of decaying fluid turbulence. Previous mathematical derivations of this ensemble relied on measure-theoretic limits of discrete polygonal loop equations. In this Letter, we present a continuous algebraic derivation. By reformulating the Navier-Stokes equation as a covariant derivative operator flow in the Lagrangian frame, we analytically eliminate advection. Applying Feynman's operational calculus, the 3D non-commutative operator algebra maps to ordering discontinuities (finite-difference jumps) on a 1D momentum loop. This continuous formalism reduces to the discrete, number-theoretic geometric quantization of the Euler ensemble via roots of unity without requiring spatial lattice approximations, demonstrating that macroscopic fluid chaos is a deterministic projection of the Farey sequence.", "url": "https://arxiv.org/abs/2604.12207", "type": "理论", "summary": "1. 该工作从连续代数角度推导了欧拉系综吸引子，通过将纳维-斯托克斯方程重新表述为拉格朗日框架中的协变导数算符流，解析地消除了平流项。\n2. 其核心在于运用费曼算符演算，将三维非对易算符代数映射至一维动量环上的序不连续性，无需空间格点近似即可通过单位根约化为离散数论几何量子化。\n3. 这揭示了宏观流体混沌可作为法里序列的确定性投影，为湍流普适性统计与数论结构的深层关联提供了严格数学框架。", "summary_source": "deepseek", "authors": [{"name": "Alexander Migdal"}], "featured_authors": [{"name": "Alexander Migdal"}], "author_count": 1}, {"id": "2604.12716", "category": "hep-th", "title": "Fermion-fermion scattering in a Rarita-Schwinger model with Yukawa-like interaction", "abstract": "In this work, we investigate the scattering of spin-$3/2$ fermionic particles mediated by a Yukawa-like coupling in the context of the massive Rarita-Schwinger model. The interaction is introduced by replacing $m \\to m_{\\psi} + g\\phi$ in the free spin-$3/2$ Lagrangian. The analysis is performed at both zero and finite temperatures. In the latter case, thermal effects are incorporated using the Thermofield Dynamics (TFD) formalism. In both regimes, we obtain the differential and total cross sections and examine their behavior in the short-range ($m_{\\phi} \\neq 0$) and long-range ($m_{\\phi} = 0$) limits, in order to analyze the influence of zero- and finite-temperature effects.", "url": "https://arxiv.org/abs/2604.12716", "type": "理论", "summary": "1. 该工作基于质量项替换的Yukawa型耦合，在Rarita-Schwinger模型框架内研究了自旋3/2费米子间的散射过程，计算了零温与有限温度下的微分截面和总截面。\n2. 其技术核心在于运用热场动力学形式体系处理有限温度效应，并通过对比有质量媒介子（短程）与无质量媒介子（长程）极限，系统分析了温度对散射行为的影响。\n3. 这为理解高自旋费米子在有限温度环境中的相互作用提供了定量基准，尤其揭示了温度如何调控从汤川势到库仑势转变过程中的散射特征。", "summary_source": "deepseek", "authors": [{"name": "M. C. Araújo"}, {"name": "J. G. Lima"}, {"name": "J. Furtado"}, {"name": "T. Mariz"}], "featured_authors": [{"name": "M. C. Araújo"}, {"name": "J. G. Lima"}, {"name": "J. Furtado"}, {"name": "T. Mariz"}], "author_count": 4}, {"id": "2604.12826", "category": "hep-th", "title": "Symmetries of massless QCD", "abstract": "We present a pedagogical review of certain exact theoretical results concerning the physics of an imaginary world where one quark or more are deprived of their masses.", "url": "https://arxiv.org/abs/2604.12826", "type": "理论", "summary": "1. 该论文对无质量夸克条件下量子色动力学的精确理论结果进行了教学式评述。\n2. 其核心在于系统阐明了手征对称性及其破缺在决定强相互作用低能行为中的关键作用。\n3. 这为理解QCD红外结构、联系微扰与非微扰区域，以及指导格点计算等研究提供了清晰的理论框架。", "summary_source": "deepseek", "authors": [{"name": "A.V. Smilga"}], "featured_authors": [{"name": "A.V. Smilga"}], "author_count": 1}, {"id": "2604.12854", "category": "hep-th", "title": "Mixed-helicity bracket of celestial symmetries", "abstract": "Celestial symmetries of gravity and gauge theory can be enhanced to a $w_{1+\\infty}$ algebra and an $S$-algebra respectively, when restricting to a single graviton/gluon helicity sector. Difficulties in combining both sectors in the full theory have been pointed out in the previous literature. In this work, we face this problem from the covariant phase space perspective and analyze in detail the structure of the mixed-helicity bracket of the higher-spin charges for both gravity and Yang--Mills theory. We show that, when restricting one of the two helicities to the wedge sector, a closed algebra can be obtained for all spins in terms of a notion of shadow charge we introduce. Furthermore, when focusing on the lower spin subalgebra sectors, in the case of gravity, we show that a dual mass extension of the BMS algebra can be consistently constructed; in the case of Maxwell theory, inclusion of magnetic charges allows us to recover a non-vanishing expression for the electromagnetic central charge previously obtained through different methods.", "url": "https://arxiv.org/abs/2604.12854", "type": "理论", "summary": "1. 该工作从协变相空间视角分析了引力与杨-米尔斯理论中混合螺旋度高自旋荷括号的结构。\n2. 通过引入影荷概念，在限制单螺旋度为楔形扇区时实现了全自旋范围的闭合代数结构。\n3. 这为引力中的双质量BMS代数扩展及电磁理论中心荷的显现提供了自洽的相空间表述基础。", "summary_source": "deepseek", "authors": [{"name": "Daniele Pranzetti"}, {"name": "Domenico Giuseppe Salluce"}], "featured_authors": [{"name": "Daniele Pranzetti"}, {"name": "Domenico Giuseppe Salluce"}], "author_count": 2}, {"id": "2604.12873", "category": "hep-th", "title": "The Hidden Symmetries of Yang-Mills Theory in (1+1)-dimensions", "abstract": "We present an integral formulation of classical Yang-Mills theory coupled to fermionic and scalar matter fields in (1+1)-dimensional Minkowski spacetime. By r
