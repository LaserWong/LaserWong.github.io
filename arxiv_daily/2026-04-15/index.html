eformulating the local dynamics in terms of loop-space holonomies, we demonstrate that the path independence of the holonomy eigenvalues constitutes a conservation law, yielding an infinite hierarchy of gauge-invariant, dynamically conserved charges. While a zero-curvature equation is associated with a necessary condition for this path invariance, we note that it is not strictly sufficient on its own. Employing a first-order symplectic formalism, we show that these non-abelian charges generate global symmetry transformations on the fundamental phase-space variables. We rigorously prove that these transformations preserve the physical dynamics, leaving the total Hamiltonian invariant up to first-class constraints. Furthermore, an analysis of the Poisson algebra reveals that these conserved charges are in involution, provided the boundary integration constant lies within the center of the gauge group. This exact, lower-dimensional framework provides a highly tractable setting to investigate the algebraic structures of these hidden symmetries and the meaning of the conserved charges as physical observables, establishing a classical foundation for exploring their role in the quantum regime, such as in strongly coupled lattice gauge theories.", "url": "https://arxiv.org/abs/2604.12873", "type": "理论", "summary": "1. 该工作建立了(1+1)维闵氏时空中经典杨-米尔斯理论耦合费米子与标量物质的积分表述，并基于一阶辛形式体系揭示了其隐藏对称性。\n2. 通过引入环路空间和乐算子的本征值路径无关性，理论导出了一无穷系列的规范不变且动力学守恒的电荷，这些非阿贝尔电荷构成对合关系并生成相空间上的全局对称变换。\n3. 此精确的低维框架为研究这类隐藏对称性的代数结构及其作为物理可观测量提供了可处理的经典基础，尤其可为强耦合晶格规范理论等量子体系中的相关研究提供启示。", "summary_source": "deepseek", "authors": [{"name": "L. A. Ferreira"}, {"name": "G. Luchini"}, {"name": "H. Malavazzi"}], "featured_authors": [{"name": "L. A. Ferreira"}, {"name": "G. Luchini"}, {"name": "H. Malavazzi"}], "author_count": 3}, {"id": "2604.12910", "category": "hep-th", "title": "Infrared Spectral Gap in a Gluonic Dark Sector as the Origin of the Galactic Acceleration Scale", "abstract": "The radial acceleration relation reveals a nearly universal acceleration scale of order $10^{-10}\\,\\mathrm{ms^{-2}}$ in galactic dynamics, whose origin remains unexplained within conventional cold dark matter scenarios. We propose that this scale arises from an intrinsic infrared spectral property of the dark sector. Specifically, we hypothesize that a long-lived, color-neutral gluonic vacuum component survives the post-inflationary expansion era and, at large distances, develops a spectrally rigid lowest-weight structure. The microscopic seed for this infrared organization is provided by the QCD trace anomaly, which breaks classical scale invariance and, through dimensional transmutation, generates an intrinsic infrared scale in the gluonic sector. Requiring Lorentz covariance together with a positive-energy lowest-weight unitary realization then selects the Anti de Sitter algebra $\\mathfrak{so}(2,3)$ as the simplest symmetry admitting a discrete tower of states with a representation-theoretically protected gap. The associated gap introduces a finite correlation length $r_{\\texttt{c}}$ that controls the large-scale coherence of the dark sector. A self-gravitating condensate dominated by the lowest-weight mode generates a characteristic acceleration $g^{}_\\star = G M_h / r_{\\texttt{c}}^2$, naturally of the same order as the observed galactic acceleration scale, within standard Newtonian gravity. In this framework, the galactic acceleration scale appears as the gravitational imprint of a trace-anomaly-seeded infrared spectral gap in a coherent gluonic dark sector, rather than as a consequence of modified gravity or of galaxy-by-galaxy formation histories.", "url": "https://arxiv.org/abs/2604.12910", "type": "理论", "summary": "1. 本文提出一种胶子型暗区模型，其中红外谱隙的引力印记可解释星系动力学中观测到的特征加速度尺度。\n2. 其物理核心在于借助QCD迹反常作为种子，通过SO(2,3)代数实现具有表示论保护能隙的离散态塔，从而产生有限关联长度。\n3. 这为星系加速度尺度问题提供了基于暗区内在量子结构而非修正引力或形成历史的新解释范式。", "summary_source": "deepseek", "authors": [{"name": "Gilles Cohen-Tannoudji"}, {"name": "Jean-Pierre Gazeau"}, {"name": "Hamed Pejhan"}, {"name": "Jean-Pierre Treuil"}], "featured_authors": [{"name": "Gilles Cohen-Tannoudji"}, {"name": "Jean-Pierre Gazeau"}, {"name": "Hamed Pejhan"}, {"name": "Jean-Pierre Treuil"}], "author_count": 4}, {"id": "2604.12980", "category": "hep-th", "title": "State counting in gravity and maximal entropy principle", "abstract": "It is known that the semiclassical approximation to the gravity path integral can be leveraged to explain certain inherently quantum aspects of gravity. One such aspect is the state-counting interpretation of the Bekenstein-Hawking entropy of black holes. A second aspect is the Page curve for the entanglement entropy of Hawking radiation, which agrees with expectations from unitarity. We show that these two questions are equivalent from the gravity path integral point of view. In particular, the Hawking's information loss puzzle gets resolved automatically by considering any (over)complete basis of black hole microstates which is compatible with black hole entropy. The tool which relates the two questions is a convex optimization problem for the von Neumann entropy of Hawking radiation.", "url": "https://arxiv.org/abs/2604.12980", "type": "理论", "summary": "1. 该工作通过引力路径积分证明了黑洞熵的状态计数与霍金辐射的Page曲线是等价的。\n2. 其卖点在于通过von Neumann熵的凸优化问题关联这两个问题，并利用黑洞微观状态基自动解决信息丢失疑难。\n3. 这为理解引力的量子方面提供了统一框架，并对黑洞信息与熵的后续研究具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Juan Hernandez"}, {"name": "Mikhail Khramtsov"}], "featured_authors": [{"name": "Juan Hernandez"}, {"name": "Mikhail Khramtsov"}], "author_count": 2}, {"id": "2604.11976", "category": "math-ph", "title": "Effective Dynamics for the Bose Polaron in the Large-Volume Mean-Field Limit", "abstract": "We consider the dynamics of the Bose polaron system, a dense quantum gas consisting of $N$ bosons evolving in $\\mathbb{R}^3$ in the presence of an impurity particle. The system is studied in the mean-field scaling with initially high density $\\rho$ and large volume $\\Lambda$ of the gas. In the initial state, almost all bosons are in the Bose-Einstein condensate, with a few excitations. We derive from the microscopic dynamics, in the joint limit of large densities and volumes, with the constraint $\\Lambda^3 \\ll \\rho$, the effective description by the translation-invariant Bogoliubov-Fröhlich Hamiltonian, which couples the quantum field of excitations linearly to the impurity particle.", "url": "https://arxiv.org/abs/2604.11976", "type": "理论", "summary": "1. 该工作从微观动力学出发，推导了高密度大体积玻色气体中杂质原子（玻色极化子）在平均场标度下的有效动力学描述。\n2. 核心在于证明了在气体密度ρ极大、体积Λ极大且满足Λ³≪ρ的联合极限下，系统演化可由平移不变的Bogoliubov-Fröhlich哈密顿量精确描述。\n3. 这一严格推导为在超冷原子气体实验中实现和探测该有效模型提供了理论基础，并明确了其适用的参数范围。", "summary_source": "deepseek", "authors": [{"name": "Jonas Lampart"}, {"name": "Peter Pickl"}, {"name": "Siegfried Spruck"}], "featured_authors": [{"name": "Jonas Lampart"}, {"name": "Peter Pickl"}, {"name": "Siegfried Spruck"}], "author_count": 3}, {"id": "2604.12111", "category": "math-ph", "title": "Quantum mechanical model for charge excitation: Surface binding and dispersion", "abstract": "By an idealized quantum mechanical model, we formally describe the dispersion of nonretarded electromagnetic surface waves that express charge density oscillations near a fixed plane in three spatial dimensions (3D) at zero temperature. Our goal is to capture the interplay of microscopic scales that include a confinement length in the emergence of the surface plasmon, a collective low-energy charge excitation in the vicinity of the plane. We start with a time-dependent Hartree-type equation in 3D. This model accounts for particle binding to the plane and the repulsive Coulomb interaction associated with the induced charge density relative to the ground state. By linearizing the equation of motion, we formulate a homogeneous integral equation for the scattering amplitude of the particle wave function in the (z-) coordinate vertical to the plane. For a binding potential proportional to a negative delta function and symmetric-in-z wave function, we apply the Laplace transform with respect to positive z and convert the integral equation into a functional equation that involves several values of the transformed solution. The scattering amplitude and dispersion relation are derived exactly in terms of rapidly convergent series via the Mittag-Leffler theorem. In the semiclassical regime, our result furnishes an asymptotic expansion for the energy excitation spectrum. The leading-order term is found in agreement with the prediction of a classical hydrodynamic model based on a projected-Euler-Poisson system.", "url": "https://arxiv.org/abs/2604.12111", "type": "理论", "summary": "1. 该工作通过理想化的量子力学模型，形式化描述了三维空间中固定平面附近电荷密度振荡所对应的非推迟电磁表面波的色散关系。\n2. 其核心在于针对δ函数束缚势与对称波函数，通过拉普拉斯变换将线性化的运动方程转化为泛函方程，并利用Mittag-Leffler定理精确导出了散射振幅与色散关系。\n3. 所得半经典展开的首项与基于投影欧拉-泊松系统的经典流体力学模型一致，为关联电子体系中表面集体激发的微观-宏观对应提供了严格依据。", "summary_source": "deepseek", "authors": [{"name": "Dionisios Margetis"}], "featured_authors": [{"name": "Dionisios Margetis"}], "author_count": 1}, {"id": "2604.12393", "category": "math-ph", "title": "The parity operator for parafermions and parabosons", "abstract": "In this paper we reexamine the definition of parafermions and parabosons by means of Green's triple relations, and extend these relations by including a parity operator $P$ which is also determined by means of triple relations. As a consequence, we are dealing with new algebraic structures. It is shown that the algebra underlying a set of $n$ parafermions together with $P$ is the orthogonal Lie algebra $so(2n+2)$. The Fock spaces correspond to particular irreducible representations of $so(2n+2)$, and the action of $P$ in these spaces leads to interesting observations. Next, we show that the algebra underlying a set of $n$ parabosons together with $P$ is the orthosymplectic Lie superalgebra $osp(2|2n)$. In this case, the Fock spaces correspond to certain irreducible infinite-dimensional representations of $osp(2|2n)$. Both for parafermions and parabosons the spectrum of $P$ is closely related to the so-called order of statistics $p$, introduced by Green.", "url": "https://arxiv.org/abs/2604.12393", "type": "理论", "summary": "1. 该工作通过格林的三角关系重新审视了仲费米子与仲玻色子的定义，并引入由三角关系决定的宇称算符P，从而构建了新的代数结构。\n2. 其核心在于揭示了n个仲费米子与P构成的代数对应正交李代数so(2n+2)，而n个仲玻色子与P对应正交超李代数osp(2|2n)，其福克空间分别对应特定不可约表示。\n3. 这为基于李（超）代数的统计物理统一描述提供了数学框架，并通过P的谱与格林统计阶p的联系启发了对广义统计性质的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "N.I. Stoilova"}, {"name": "J. Van der Jeugt"}], "featured_authors": [{"name": "N.I. Stoilova"}, {"name": "J. Van der Jeugt"}], "author_count": 2}, {"id": "2604.12402", "category": "math-ph", "title": "Contact Geometry of Relativistic Particle Motion", "abstract": "We introduce a new geometric framework for relativistic particle dynamics based on contact geometry and suitable for treating dissipative processes like particle decay. The dynamics is formulated on a nine--dimensional extended phase space consisting of four position coordinates, four momenta, and an additional variable (functioning as a geometric variant of the particle's proper time). In this setting, the evolution is generated by an evolution contact vector field with a contact Hamiltonian encoding the mass shell. By promoting the proper time to an independent variable, the relativistic Hamilton canonical equations are rewritten in a fully geometric form without having to identify the proper time with a parameter along the worldlines. This makes for instance the evolution of massless particles (photons) well-defined without the need of reparametrization. The framework is then applied to decaying particles. Finally, we formulate a covariant kinetic theory and show how decaying particles can be described geometrically in this framework, changing the entropy.", "url": "https://arxiv.org/abs/2604.12402", "type": "理论", "summary": "1. 该工作发展了一种基于接触几何的相对论性粒子动力学新框架，旨在处理粒子衰变等耗散过程，并在包含四位置、四动量和一额外变量（功能类似固有时）的九维扩展相空间中表述动力学。\n2. 主要技术优势在于将固有时提升为独立变量，利用演化接触矢量场和接触哈密顿量重写相对论哈密顿正则方程，实现了无需沿世界线参数化的完全几何形式，从而使得如光子等无质量粒子的演化无需重参数化即可明确定义。\n3. 此框架成功应用于描述衰变粒子，并形式化了协变动理学理论，展示了如何几何地描述衰变粒子及其对熵的改变，为相对论性系统中耗散过程的深入研究提供了新的理论视角和启发。", "summary_source": "deepseek", "authors": [{"name": "Begum Atesli"}, {"name": "Ogul Esen"}, {"name": "Michal Pavelka"}], "featured_authors": [{"name": "Begum Atesli"}, {"name": "Ogul Esen"}, {"name": "Michal Pavelka"}], "author_count": 3}, {"id": "2604.12819", "category": "math-ph", "title": "Generalised (bi-)Hamiltonian structures of hydrodynamic type and (bi-)flat F-manifolds", "abstract": "We introduce the notions of generalised (bi-)Hamiltonian structures which generalise naturally the (bi-)Hamiltonian structures of evolutionary partial differential equations. In the hydrodynamic case, these structures are characterised in terms of geometric data. Furthermore, we show that a generalised (bi)-Hamiltonian structure of hydrodynamic type can be associated with any (bi-)flat F-manifold, and it is compatible with the corresponding principal hierarchy.", "url": "https://arxiv.org/abs/2604.12819", "type": "理论", "summary": "1. 该论文引入并研究了广义（双）哈密顿结构，这一概念自然拓展了演化偏微分方程的（双）哈密顿结构，特别针对流体动力学类型进行了深入分析。\n2. 核心创新点在于使用几何数据完全刻画了流体动力学类型的广义（双）哈密顿结构，证明其可与任意（双）平坦F流形相关联，且与相应的主层次结构兼容。\n3. 这项工作为流体动力学可积系统提供了基于F流形的统一几何框架，为进一步探索哈密顿结构与可积层次理论之间的内在联系指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Paolo Lorenzoni"}, {"name": "Zhe Wang"}], "featured_authors": [{"name": "Paolo Lorenzoni"}, {"name": "Zhe Wang"}], "author_count": 2}, {"id": "2604.12822", "category": "math-ph", "title": "Conservative field equations and scalar fields (equations for leptons)", "abstract": "This paper proposes SU(2)-gauge-invariant field equations involving interaction with a scalar field. A connection with the Dirac equation is discussed.", "url": "https://arxiv.org/abs/2604.12822", "type": "理论", "summary": "1. 该论文构建了与标量场相互作用的SU(2)规范不变场方程。\n2. 其核心在于提出了一个统一规范场与标量场的理论框架，并建立了其与狄拉克方程的理论关联。\n3. 此框架为在规范理论背景下构建更基本的轻子场论模型提供了新的出发点与理论启示。", "summary_source": "deepseek", "authors": [{"name": "Nikolay Marchuk"}], "featured_authors": [{"name": "Nikolay Marchuk"}], "author_count": 1}, {"id": "2604.12858", "category": "math-ph", "title": "Scattering and inverse scattering for multipoint potentials at high energies", "abstract": "We consider the Schrödinger equation with a multipoint potential of Bethe-Peierls-Thomas-Fermi type. For this singular potential, we develop scattering and inverse scattering at high energies. In particular, in this framework, our results include analogs of the \"regular\" Born-Faddeev formula for the scattering amplitude and analogs of related \"regular\" inverse scattering reconstructions at high energies. Related results for scattering solutions at high energies are also presented.", "url": "https://arxiv.org/abs/2604.12858", "type": "理论", "summary": "1. 该工作针对贝特-派尔斯-托马斯-费米型多点奇异势，建立了高能区间的散射与逆散射理论框架。\n2. 核心在于将经典的玻恩-法捷耶夫散射振幅公式及相关逆散射重建方法，成功推广至此类奇异势场。\n3. 这为高能散射理论应用于具有奇异相互作用的量子系统建模提供了新的严格数学基础。", "summary_source": "deepseek", "authors": [{"name": "P.C. Kuo"}, {"name": "R.G. Novikov"}], "featured_authors": [{"name": "P.C. Kuo"}, {"name": "R.G. Novikov"}], "author_count": 2}, {"id": "2604.12984", "category": "math-ph", "title": "A variationally consistent mesoscopic Cosserat theory with distributed defects and configurational forces", "abstract": "We develop a variationally consistent mesoscopic extension of Cosserat elasticity motivated by the breakdown of compatibility in classical formulations. By admitting compatibility-breaking perturbations, the classical theory ceases to remain closed under admissible variations, necessitating an enlargement of the constitutive framework. This leads naturally to a formulation in which torsion and curvature are treated as independent distributed measures of defects. The theory is constructed using a Palatini-type variational approach, with the coframe and connection as independent fields. The resulting Euler--Lagrange equations yield both the standard balance laws and defect-related excitation fields. Material invariance gives rise to configurational forces and moments, which emerge as Noether currents and are directly linked to defect transport governed by the Bianchi identities. The framework provides a unified description of defect kinematics, configurational mechanics, and microstructural evolution. Illustrative examples and numerical evaluations demonstrate how defect transport generates configurational forces and highlight the underlying Maxwell-type structure of the theory. The proposed formulation offers a consistent geometric foundation for the analysis of structured solids with evolving internal geometry and provides a basis for future developments in defect dynamics and dissipative processes.", "url": "https://arxiv.org/abs/2604.12984", "type": "理论", "summary": "1. 该工作通过变分方法建立了一个介观尺度的、变分自洽的Cosserat弹性理论框架，以处理经典理论中相容性破缺的缺陷问题。\n2. 其核心在于采用Palatini型变分原理，将标架场与联络作为独立场变量，从而将扭转与曲率自然地处理为独立分布的缺陷度量，并导出与缺陷相关的激励场及作为Noether流的构型力。\n3. 该理论为具有演化内几何的结构化固体分析提供了统一的几何基础，并为缺陷动力学和耗散过程的后续研究奠定了框架。", "summary_source": "deepseek", "authors": [{"name": "Lev Steinberg"}], "featured_authors": [{"name": "Lev Steinberg"}], "author_count": 1}, {"id": "2604.11814", "category": "quant-ph", "title": "After 100 Years of Quantum Mechanics: Toward a Constructive Observation-Centered Perspective", "abstract": "Quantum mechanics owes much of its extraordinary success to a Hilbertian program of mathematical formalization. Yet, the formalism remains poorly aligned with the practical limitations of computations in finite dimensions and under finite accuracy. In this perspective, we argue that this mismatch points to the need for a new mathematical program: a rigorous constructive theory for effective descriptions to identify essential degrees of freedom. We propose an observation-centered point of view in which signals are treated as the primary objects of analysis, while wave functions and Hamiltonians are reconstructed as auxiliary structures to rationalize the observed data. Our starting point is a signal-based spectral equation that reformulates frequency analysis as an operator problem. We connect this point of view to results on prolate Fourier theory, spectral analysis with finite observation time, and short-time quantum simulation. We highlight a sharp accuracy transition relating necessary observation time to the effective spectral density of a signal for achieving accurate resolution. The resulting framework integrates approximation as a fundamental necessity more directly into the foundations of quantum mechanics and points toward a broader program for the effective description of complex quantum systems, such as those found in the molecular sciences.", "url": "https://arxiv.org/abs/2604.11814", "type": "理论+数值", "summary": "1. 该论文针对量子力学形式体系与有限维计算及有限精度实践的不匹配，提出了一个以观测为中心的构造性数学方案，旨在通过信号分析重构波函数与哈密顿量作为辅助结构来发展有效描述理论。\n2. 其物理卖点在于引入信号基频谱方程，将频率分析重塑为算子问题，并揭示了观测时间与信号有效谱密度之间决定分辨精度的尖锐转变，关联了Prolate傅里叶理论、有限时谱分析和短时量子模拟。\n3. 这一框架将近似性作为基本需求更直接地整合入量子力学基础，为分子科学等领域的复杂量子系统的有效描述研究指明了新的理论路径和更广泛的研究计划。", "summary_source": "deepseek", "authors": [{"name": "Timothy Stroschein"}, {"name": "Markus Reiher"}], "featured_authors": [{"name": "Timothy Stroschein"}, {"name": "Markus Reiher"}], "author_count": 2}, {"id": "2604.11823", "category": "quant-ph", "title": "Perspectivist Account of Truth-Theoretic Semantics in Quantum Mechanics", "abstract": "According to various no-go results in the foundations of quantum mechanics, for any system associated to a Hilbert space of dimension higher than two, it is not possible to assign definite truth values to all propositions pertaining to the system without generating a Kochen-Specker contradiction. In this respect, the Bub-Clifton uniqueness theorem is utilized for arguing that truth-value definiteness is consistently restored with respect to a determinate sublattice of propositions defined by the state of the quantum system concerned and a particular observable to be measured. On this basis, a perspectivist/contextual account of truth valuation in the quantum domain is produced that satisfies Tarski's criterion of material adequacy for a theory of truth. In light of the latter, perspectivist truth conforms to perspective or context-bound correspondence of a de re nature, designating locally an objectively existing state of affairs. Such an account derives by virtue of the microphysical nature of physical reality in displaying a context-dependence of facts; thus, it essentially opposes a non-perspectival, metaphysically fixed point of reference, or a panoptical standpoint from which to state all facts of nature.", "url": "https://arxiv.org/abs/2604.11823", "type": "理论", "summary": "1. 该工作基于Bub-Clifton唯一性定理，为量子力学构建了一种满足塔尔斯基实质恰当性条件的透视主义真值语义学。\n2. 其核心在于通过量子系统状态与待测可观测量所确定的命题确定子格，一致地恢复了真值确定性，从而规避了Kochen-Specker矛盾。\n3. 这一方案从微观物理实在的事实语境依赖性出发，从根本上反对了非透视的形而上学固定参照点或可陈述自然全部事实的全景立场。", "summary_source": "deepseek", "authors": [{"name": "Vassilios Karakostas"}], "featured_authors": [{"name": "Vassilios Karakostas"}], "author_count": 1}, {"id": "2604.11825", "category": "quant-ph", "title": "Quantum algorithms for Young measures: applications to nonlinear partial differential equations", "abstract": "Many nonlinear PDEs have singular or oscillatory solutions or may exhibit physical instabilities or uncertainties. This requires a suitable concept of physically relevant generalized solutions. Dissipative measure-valued solutions have been an effective analytical tool to characterize PDE behavior in such singular regimes. They have also been used to characterize limits of standard numerical schemes on classical computers. The measure-valued formulation of a nonlinear PDE yields an optimization problem with a linear cost functional and linear constraints, which can be formulated as a linear programming problem. However, this linear programming problem can suffer from the curse of dimensionality. In this article, we propose solving it using quantum linear programming (QLP) algorithms and discuss whether this approach can reduce costs compared to classical algorithms. We show that some QLP algorithms, such as the quantum central path algorithm, have up to polynomial advantage over the classical interior point method. For problems where one is interested in the dissipative weak solution, namely the expected values of the Young measure, we show that the QLP algorithms offer no advantage over direct classical solvers. Moreover, for random PDEs, there can be up to polynomial advantage in obtaining the Young measure over direct classical PDE solvers. This is a significant advantage over standard PDE solvers, since the Young measure provides a more detailed description of the solution. We also propose some open questions for future development in this direction.", "url": "https://arxiv.org/abs/2604.11825", "type": "理论+数值", "summary": "1. 该论文针对非线性偏微分方程的奇异或振荡解，利用耗散测度值解将其表述为线性规划问题，并引入量子线性规划算法进行求解以应对维数灾难。\n2. 其技术卖点在于量子中心路径算法在获取随机偏微分方程青年测度时相比经典内点法具有多项式加速，从而能更精细描述解结构，但对耗散弱解无优势。\n3. 这为量子算法在测度值框架下增强对解振荡与不确定性的刻画提供了新途径，并指明了该交叉领域未来发展的开放性问题与研究方向。", "summary_source": "deepseek", "authors": [{"name": "Shi Jin"}, {"name": "Nana Liu"}, {"name": "Maria Lukacova-Medvidova"}, {"name": "Yuhuan Yuan"}], "featured_authors": [{"name": "Shi Jin"}, {"name": "Nana Liu"}, {"name": "Maria Lukacova-Medvidova"}, {"name": "Yuhuan Yuan"}], "author_count": 4}, {"id": "2604.11830", "category": "quant-ph", "title": "A skepticism on the concept of quantum state related to quantum field theory on curved spacetime", "abstract": "Some skeptical arguments on the physical reality of quantum states are given. First, I argue that the algebraic formalism of quantum field theory in curved spacetime (algebraic QFTCS, AQFTCS) leads to such a skepticism. Of course we have the purely mathematical notion of states on a $C^{*}$-algebra $\\mathfrak{A}$, but usually in non-relativistic quantum mechanics and quantum field theory in Minkowski spacetime (QFTM), not all of them are considered to be physically real; Some of them are physically real (or realizable) states, but others are non-physical ``fictional'' states. Only the states which can be expressed as a density matrix on a fixed ``physical Hilbert space'' (the GNS representation space of $\\mathfrak{A}$ w.r.t. the vacuum) are viewed to be physically real. On the other hand, in QFTCS, there is no distinguished physical Hilbert space; no distinguished vacuum state. Thus we cannot distinguish physically real states from fictional states. The second part of my argument is a counterargument to what I call ``pragmatic realism on quantum states'', which insists as follows: ``We are permitted to regard a quantum state as a physical reality, because the concept of quantum state is indispensable in quantum physics.'' I argue that the concept of quantum state is indeed dispensable in non-relativistic QM, and hence this pragmatic realist thesis is vacuous there. I give a conjecture that it is also dispensable in QFTM and QFTCS, and some preliminary considerations on it.", "url": "https://arxiv.org/abs/2604.11830", "type": "理论", "summary": "1. 该工作基于弯曲时空量子场论的代数框架，对量子态物理实在性的概念提出了系统性质疑。\n2. 核心论证指出，弯曲时空中缺乏唯一的物理希尔伯特空间与真空态，导致无法区分物理可实现态与虚构的数学态。\n3. 这促使学界重新审视量子场论中代数结构相对于态表述的优先性，并可能推动对量子基础更彻底的表述方式的探索。", "summary_source": "deepseek", "authors": [{"name": "Hideyasu Yamashita"}], "featured_authors": [{"name": "Hideyasu Yamashita"}], "author_count": 1}, {"id": "2604.11831", "category": "quant-ph", "title": "Q-LINK: Quantum Layerwise Information Residual Network via a Messenger Qubit for Barren Plateaus Mitigation", "abstract": "In hybrid classical-quantum computing, variational quantum algorithms (VQAs) have emerged as a promising approach in the Noisy Intermediate-Scale Quantum (NISQ) era; however, their performance is often hindered by barren plateaus, where gradients vanish exponentially, rendering optimization ineffective. In this work, we introduce a residual-inspired quantum circuit architecture that incorporates a single messenger qubit, referred to as Q-LINK. By conducting numerical simulations on random quantum states, we observe that Q-LINK significantly enhances optimization behavior by sustaining larger gradient variance and accelerating convergence. Additionally, Q-LINK improves convergence efficiency by 4-6 times and increases gradient variance by up to two orders of magnitude compared with the Vanilla model. To further characterize the impact of the proposed structure, we analyze the expressibility of the circuits before and after introducing Q-LINK and find that the overall expressibility value remains largely unchanged, indicating that the original representational capacity of the circuit is preserved. In addition, we visualize the loss landscapes of different architectures to provide insights into how the proposed design reshapes the cost function landscape. These results demonstrate that introducing only a single messenger qubit can effectively mitigate barren plateau effects while maintaining the ability to explore the Hilbert space of variational quantum circuits.", "url": "https://arxiv.org/abs/2604.11831", "type": "理论+数值", "summary": "1. 该工作提出了一种名为Q-LINK的、受残差结构启发的量子电路架构，其中引入了一个额外的“信使”量子比特，旨在缓解变分量子算法中的贫瘠高原问题。\n2. 其核心在于，仅通过单个信使比特的层间连接，即可在保持电路整体表达能力不变的同时，将梯度方差提升高达两个数量级，并显著加速优化收敛。\n3. 这为在噪声中等规模量子设备上设计具有良性优化景观的变分量子电路提供了简洁有效的架构思路，并可通过可视化损失景观进一步理解其作用机制。", "summary_source": "deepseek", "authors": [{"name": "Zhehao Yi"}, {"name": "Rahul Bhadani"}], "featured_authors": [{"name": "Zhehao Yi"}, {"name": "Rahul Bhadani"}], "author_count": 2}, {"id": "2604.11857", "category": "quant-ph", "title": "Blind Catalytic Quantum Error Correction: Target-State Estimation and Fidelity Recovery Without \\textit{A Priori} Knowledge", "abstract": "Catalytic quantum error correction (CQEC) recovers quantum states via catalytic covariant transformations but requires full knowledge of the target state. We introduce \\emph{blind CQEC}, which estimates the target from the noisy output alone before catalytic recovery. Five estimation strategies are benchmarked across three noise models (dephasing, depolarizing, amplitude damping), four quantum algorithms ($d = 4$--$64$), Haar-random states up to $d = 256$, and mixed-state targets with variable purity. Key results: (i)~coherence maximization achieves $ F_{ rec } > 0.95$ for $d \\leq 16$ without noise-model knowledge, matching the oracle to within $4\\%$; (ii)~channel inversion is required at $d = 64$ ($ F_{ rec } = 0.905$); (iii)~estimation and recovery fidelities are linearly correlated ($r > 0.99$), identifying target estimation as the sole bottleneck; (iv)~an analytical crossover dimension $d^* \\approx 25$--$40$ separates noise-model-free and noise-informed regimes, bridged by a hybrid interpolation strategy; (v)~copy scaling follows $1 - F(n) \\sim n^{-\\alpha}$ with $\\alpha \\in [0.4, 2.2]$, spanning the statistical averaging and denoising synergy limits. Standard linear inversion tomography fails as a CQEC target estimator, validating the need for decoherence-aware strategies. An end-to-end VQE demonstration for H$_2$ shows $3.4\\times$ energy-error reduction with channel-inversion blind CQEC.", "url": "https://arxiv.org/abs/2604.11857", "type": "理论+数值", "summary": "1. 该工作提出了一种无需目标态先验知识的盲催化量子纠错协议，结合目标态估计与催化恢复过程，并在多种噪声模型、量子算法及目标态纯度条件下进行了系统基准测试。\n2. 核心发现是纠错保真度与估计保真度呈强线性相关，将性能瓶颈明确归因于目标态估计，并解析给出了噪声模型无关与噪声信息依赖机制之间的维度交叉区域。\n3. 这一框架为实际量子算法（如变分量子本征求解器）的误差缓解提供了有效路径，演示中实现了能量误差数量级的降低。", "summary_source": "deepseek", "authors": [{"name": "Hikaru Wakaura"}], "featured_authors": [{"name": "Hikaru Wakaura"}], "author_count": 1}, {"id": "2604.11858", "category": "quant-ph", "title": "From Symmetry and Reduction to Physically Meaningful Relational Observables in Many-Body Quantum Theory", "abstract": "We consider symmetries and reduction in non-relativistic many-body quantum mechanics, with the aim of identifying physically meaningful observables in systems such as molecules and crystalline solids. To this end, we propose a unified framework based on two additional postulates supplementing the standard quantum-mechanical formalism. For stable systems, the physically relevant states are normalizable stationary states, while physically meaningful observables are required to be invariant under a selected subgroup of the symmetry group and under Galilean boosts. In addition, we postulate the existence of a map from the set of all observables allowed by quantum mechanics to the corresponding invariant physically meaningful observables. The originality of the present work does not lie in specific reductions, but in the unified framework that connects symmetry reduction and relational many-body quantum theory. We interpret entities like superselection rules and quantum reference frames as important parts of the postulated process of obtaining the physically meaningful relational description. In particular, the requirement of Galilean-boost invariance added strengthens the criterion for physical observability by excluding quantities that depend on the choice of inertial frame. An important consequence of the postulates is that in the considered cases every physically meaningful observable necessarily depends on more than one non-invariant observable, the latter being typically associated with degrees of freedom assigned to a single particle. The postulates thus lead to theories that are well aligned with the literature on reduction and the description of molecules, while at the same time being consistent with the relational interpretation of quantum mechanics, according to which the complete physical description of a system is defined only relative to other systems.", "url": "https://arxiv.org/abs/2604.11858", "type": "理论", "summary": "1. 该工作为多体量子理论建立了基于对称性与约化的统一框架，以识别分子与晶体等系统中具有物理意义的可观测量。\n2. 其核心在于引入包含伽利略提升不变性在内的附加公设，系统排除了依赖于惯性系选择的非物理量，从而强化了可观测量物理意义的判据。\n3. 这为关联性量子理论与分子物理等具体领域的对称性约化描述提供了严格的公理化基础，并揭示了物理可观测量必然关联于多个粒子自由度的本质特性。", "summary_source": "deepseek", "authors": [{"name": "Ville J. Härkönen"}], "featured_authors": [{"name": "Ville J. Härkönen"}], "author_count": 1}, {"id": "2604.11864", "category": "quant-ph", "title": "Spectral-angular parametrization of open qudit dynamics", "abstract": "We present a parametrization of density matrices (mixed states) in a finite-dimensional Hilbert space $\\mathbb{C}^n$, particularly suited to the description of their time evolution as open quantum systems governed by GKLS dynamics. A generic (non-degenerate) density matrix $rho_{\\mathbf{r},\\pmb{\\phi}}$, characterized by $n^2-1$ real parameters, naturally decomposes into two sets: (i) an $(n-1)$-tuple $\\mathbf{r}$ of spectral parameters, constrained to lie in a convex polytope, and (ii) a set of $n^2-n$ angular variables $\\pmb{\\phi}$, associated with the flag manifold $\\simeq \\mathrm{SU}(n)/\\mathbb{T}^{n-1}$, where $\\mathbb{T}^{n-1}$ is the standard maximal diagonal torus, in the spirit of the Tilma--Sudarshan construction. A key observation is that the spectral parameters $\\mathbf{r} = (r_1, \\ldots, r_{n-1})$ admit a natural Lie-algebraic interpretation: they are precisely the simple root coordinates of the eigenvalue vector in the Cartan subalgebra of $A_{n-1} = \\mathfrak{sl}(n)$, with each $r_i = p_i - p_{i+1}$ corresponding to the simple root $\\alpha_i = e_i - e_{i+1}$. The convex polytope constraining $\\mathbf{r}$ is thus the positive Weyl chamber of $A_{n-1}$, and the full spectral domain $R_{n-1}$ is the corresponding weight polytope. This parametrization leads to a partial decoupling of the dynamics: the evolution of the angular variables depends on both the Hamiltonian and the dissipative part of the Lindblad generator, whereas the evolution of the spectral parameters involves only the dissipative contribution. Low-dimensional examples for $n=2$ and $n=3$ are discussed in detail, including an application to the trichromatic structure of human colour perception, and we propose an alternative definition of purity expressed solely in terms of the spectral parameters $\\mathbf{r}$.", "url": "https://arxiv.org/abs/2604.11864", "type": "理论", "summary": "1. 该工作提出了有限维开放量子系统密度矩阵的谱-角参数化方法，适用于GKLS动力学描述。\n2. 其卖点在于谱参数对应李代数简单根坐标，导致角变量演化依赖哈密顿量与耗散，而谱参数演化仅由耗散决定。\n3. 这为低维实例（如颜色感知）分析和基于谱参数的纯度新定义提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Jean-Pierre Gazeau"}, {"name": "Kaoutar El Bachiri"}, {"name": "Zakaria Bouameur"}, {"name": "Yassine Hassouni"}], "featured_authors": [{"name": "Jean-Pierre Gazeau"}, {"name": "Kaoutar El Bachiri"}, {"name": "Zakaria Bouameur"}, {"name": "Yassine Hassouni"}], "author_count": 4}, {"id": "2604.11872", "category": "quant-ph", "title": "Eigenstate thermalization", "abstract": "We provide a pedagogical introduction to eigenstate thermalization. This phenomenon, which occurs in generic systems, allows one to understand why thermalization takes place in isolated quantum systems under unitary dynamics. We motivate eigenstate thermalization using random matrix theory and discuss recent complementary results for the volume-law entanglement entropy of Haar-random states. We discuss numerical results that highlight the corresponding behaviors in quantum many-body systems.", "url": "https://arxiv.org/abs/2604.11872", "type": "理论+数值", "summary": "1. 该工作提供了关于本征态热化的教学性综述，旨在阐释孤立量子系统中热化发生的机制。\n2. 其核心在于结合随机矩阵理论论证了本征态热化这一普遍现象，并借助Haar随机态的体律纠缠熵等近期结果加以佐证。\n3. 这为理解量子多体系统中对应的数值模拟行为建立了清晰的理论桥梁，并深化了对非平衡统计物理基础的认识。", "summary_source": "deepseek", "authors": [{"name": "Rohit Patil"}, {"name": "Marcos Rigol"}], "featured_authors": [{"name": "Rohit Patil"}, {"name": "Marcos Rigol"}], "author_count": 2}, {"id": "2604.11876", "category": "quant-ph", "title": "Quantum Mpemba effect in chaotic systems with conservation laws", "abstract": "Closed chaotic quantum systems relax after a quench into a Gibbs ensemble. At late times, the relaxation speed is determined by their conservation laws and hydrodynamics. As a result, there exist pairs of initial states which thermalize to the same ensemble, yet exhibit drastically different hydrodynamic relaxation. We show in two chaotic spin chains how this enables a simple and robust realization of the quantum Mpemba effect: a system initially closer to equilibrium relaxes slower than one that starts farther away, despite both approaching the same final state.", "url": "https://arxiv.org/abs/2604.11876", "type": "理论", "summary": "1. 该论文在具有守恒律的封闭混沌量子系统中，通过数值模拟两种自旋链的淬火弛豫，实现了量子姆潘巴效应。\n2. 其核心物理机制在于揭示弛豫晚期速度由守恒律和流体动力学支配，导致热化到同一吉布斯系综的初态对中更近平衡者弛豫更慢。\n3. 这为理解量子多体系统的非单调热化动力学提供了新视角，并对基于守恒律调控弛豫过程的研究具有明确启示。", "summary_source": "deepseek", "authors": [{"name": "Thomas Martin Müller"}, {"name": "Silvia Pappalardi"}, {"name": "Rosario Fazio"}], "featured_authors": [{"name": "Thomas Martin Müller"}, {"name": "Silvia Pappalardi"}, {"name": "Rosario Fazio"}], "author_count": 3}, {"id": "2604.11952", "category": "quant-ph", "title": "A Relativizing MIP for BQP", "abstract": "Complexity class containments involving interactive proof classes are famously nonrelativizing: although $\\mathsf{IP} = \\mathsf{PSPACE}$, Fortnow and Sipser showed that that there exists an oracle relative to which $\\mathsf{coNP} \\not\\subseteq \\mathsf{IP}$. In contrast, the question of whether the containment $\\mathsf{BQP} \\subseteq \\mathsf{IP}$ is relativizing remains wide open. In this work we make progress towards resolving this question by showing that the containment $\\mathsf{BQP} \\subseteq \\mathsf{MIP}$ holds with respect to any classical oracle. We obtain this result by constructing, for any classical oracle $O$, a $\\mathsf{PCP}$ proof system for $\\mathsf{BQP}^{O}$ where the verifier makes polynomially many classical queries to an exponentially-long proof, and to the oracle $O$. Our construction is inspired by the state synthesis algorithm of Grover and Rudolph, and serves as a complement to the \"exponential PCP\" constructed by Aharonov, Arad, and Vidick, which achieves similar parameters but which is based on different ideas and does not relativize. We propose relativization as a proxy for prover efficiency, and hope that progress towards an $\\mathsf{IP}$ for $\\mathsf{BQP}$ in the oracle world will lead to a non-cryptographic interactive protocol for proving any quantum computation to a classical skeptic in the unrelativized world, which is a longstanding open problem in quantum complexity theory.", "url": "https://arxiv.org/abs/2604.11952", "type": "理论+数值", "summary": "1. 该研究为任意经典预言机O构造了一个BQPO的PCP证明系统，其中验证者仅需对指数长证明和预言机进行多项式次经典查询，从而证明了BQP ⊆ MIP在经典预言下的相对化成立。\n2. 该构造的核心技术卖点在于借鉴了Grover-Rudolph的状态合成算法，其相对化特性与Aharonov等人基于不同思想构建的“指数PCP”形成互补。\n3. 这项工作将相对化视为证明者效率的代理，为在非相对化世界中构建面向经典验证者的、非密码学的量子计算交互证明协议提供了潜在路径。", "summary_source": "deepseek", "authors": [{"name": "Scott Aaronson"}, {"name": "Anand Natarajan"}, {"name": "Avishay Tal"}, {"name": "Agi Villanyi"}], "featured_authors": [{"name": "Scott Aaronson"}, {"name": "Anand Natarajan"}, {"name": "Avishay Tal"}, {"name": "Agi Villanyi"}], "author_count": 4}, {"id": "2604.12094", "category": "quant-ph", "title": "Why does the wavefunction 'collapse' in relational approaches to quantum mechanics?", "abstract": "I argue that there is a straightforward way to understand the occurrence of wavefunction collapses or 'quantum events' in relational approaches to quantum mechanics: we necessarily encounter a discontinuity in our description when a system interacts with the reference relative to which we are describing it, since the reference system cannot be described relative to itself. This makes it clear how recent concerns around quantum events in relational quantum mechanics should be resolved. However, the solution requires accepting that quantum mechanics is not a complete description of all physical facts, and moreover I argue that this is most likely inevitable if we want to be able to give a precise description of quantum events.", "url": "https://arxiv.org/abs/2604.12094", "type": "数值", "summary": "1. 该论文在关系性量子力学框架下解释了波函数“坍缩”现象，提出当系统与描述它的参考系统相互作用时，描述必然遭遇不连续性。\n2. 其关键物理机制在于参考系统无法相对于自身被描述，这种不连续性直接导致了量子事件，从而化解了近期该理论中的相关争议。\n3. 这表明量子力学不能完整描述所有物理事实，且这种不完整性很可能在精确刻画量子事件时无法避免，因而对量子基础理论发展具有明确启示。", "summary_source": "deepseek", "authors": [{"name": "Emily Adlam"}], "featured_authors": [{"name": "Emily Adlam"}], "author_count": 1}, {"id": "2604.12131", "category": "quant-ph", "title": "Dequantizing Short-Path Quantum Algorithms", "abstract": "The short-path quantum algorithm introduced by Hastings (Quantum 2018, 2019) is a variant of adiabatic quantum algorithms that enables an easier worst-case analysis by avoiding the need to control the spectral gap along a long adiabatic path. Dalzell, Pancotti, Campbell, and Brandão (STOC 2023) recently revisited this framework and obtained a clear analysis of the complexity of the short-path algorithm for several classes of constraint satisfaction problems (MAX-$k$-CSPs), leading to quantum algorithms with complexity $2^{(1-c)n/2}$ for some constant $c>0$. This suggested a super-quadratic quantum advantage over classical algorithms. In this work, we identify an explicit classical mechanism underlying a substantial part of this line of work, and show that it leads to clean dequantizations. As a consequence, we obtain classical algorithms that run in time $2^{(1-c')n}$, for some constant $c'>c$, for the same classes of constraint satisfaction problems. This shows that current short-path quantum algorithms for these problems do not achieve a super-quadratic advantage. On the positive side, our results provide a new ``quantum-inspired'' approach to designing classical algorithms for important classes of constraint satisfaction problems.", "url": "https://arxiv.org/abs/2604.12131", "type": "理论+数值", "summary": "1. 该工作通过识别经典机制，实现了短路径量子算法在约束满足问题上的去量子化。\n2. 其卖点在于揭示了一种可导致干净去量子化的经典机制，并导出了时间复杂度为2^{(1-c')n}的经典算法。\n3. 这为约束满足问题的经典算法设计提供了量子启发的新途径，并指出当前短路径量子算法未实现超二次加速。", "summary_source": "deepseek", "authors": [{"name": "François Le Gall"}, {"name": "Suguru Tamaki"}], "featured_authors": [{"name": "François Le Gall"}, {"name": "Suguru Tamaki"}], "author_count": 2}, {"id": "2604.12142", "category": "quant-ph", "title": "Fault-tolerant simulation of the electronic structure using Projector Augmented-Waves and Bloch orbitals", "abstract": "Strongly correlated materials are a natural target for fault-tolerant quantum computers, but they require tools beyond those developed for molecules. Electronic wavefunctions vary rapidly near nuclei yet remain delocalized across many unit cells, and bulk properties must be converged systematically with respect to finite-size errors. To resolve such issues, we present the Bloch--UPAW framework that combines Bloch-orbital $k$-space structure with unitary projector-augmented-wave (UPAW) augmentation. The UPAW Hamiltonian, expressed directly in the Bloch basis, retains explicit control of Brillouin-zone sampling, and incorporates near-nuclear physics through strictly local on-site corrections. The construction is independent of the underlying one-particle representation, so it applies to both plane-wave and localized bases, and it handles supercells for symmetry-breaking phenomena more efficiently. We derive a linear-combination-of-unitaries decomposition and a block-encoding circuit suitable for qubitization; UPAW augmentation adds one ancilla qubit and no Toffoli gates at leading order relative to a Bloch-only block encoding. Asymptotically, the Toffoli cost scales as $\\mathcal{O}(N_k^3)$ when refining the $k$-mesh and as $\\mathcal{O}(N_a^{3.5})$ when enlarging the supercell, enabling convergence to be steered by the most favorable route for a given material. Resource estimates for bulk diamond show approximately an order-of-magnitude reduction in Toffoli count relative to prior work on periodic solids.", "url": "https://arxiv.org/abs/2604.12142", "type": "理论+数值", "summary": "1. 该工作提出了结合布洛赫轨道与幺正投影缀加平面波（UPAW）的Bloch-UPAW框架，用于强关联材料的容错量子模拟。\n2. 其技术优势在于哈密顿量能显式控制布里渊区采样，并通过严格局域的原子位点修正高效处理近核区物理与超胞。\n3. 该框架为周期固体量子计算的资源估算提供了新路径，金刚石算例显示toffoli门数量可比先前工作降低约一个数量级。", "summary_source": "deepseek", "authors": [{"name": "Rishabh Bhardwaj"}, {"name": "Alexander Reed Muñoz"}, {"name": "Travis E. Jones"}, {"name": "John Golden"}], "featured_authors": [{"name": "Rishabh Bhardwaj"}, {"name": "Alexander Reed Muñoz"}, {"name": "Travis E. Jones"}, {"name": "John Golden"}], "author_count": 4}, {"id": "2604.12157", "category": "quant-ph", "title": "Scalable Qumode-Qubit State Transfer and Fast-forward Quantum Fourier Transform using Oscillators", "abstract": "Transferring the information stored in the expansion coefficients of a multi-qubit state to the coefficients of a continuous-variable state is an important protocol for communicating quantum information. It was shown in previous work how to transfer an $n$-qubit state to a single qumode in $\\mathcal{O}(2^n)$ time. We show that by transferring this state to $m$ qumodes, the runtime can be improved to $\\mathcal{O}(2^{n/m})$. Furthermore, we demonstrate how multi-qumode state transfer can be used as a subroutine for approximately realizing the $n$-qubits quantum Fourier transform on $m$-qumode with runtime scaling $\\mathcal{O}(m2^{n/m}/\\epsilon+m^2)$, accelerating qubit quantum Fourier transform using qumodes. This work presents a scalable approach to convert discrete and continuous quantum information between an arbitrary number of qubits and qumodes. It represents a crucial step forward in mixed analog-digital quantum signal processing for computing, sensing, and communication.", "url": "https://arxiv.org/abs/2604.12157", "type": "理论", "summary": "1. 该研究提出了一种可扩展的量子比特0-量子模式态传输方案，并基于此实现了对n量子比特量子傅里叶变换的加速近似实现。\n2. 其核心进展在于利用m个量子模式的并行存储，将n量子比特态的传输时间从指数级O(2^n)压缩至O(2^{n/m})，并以此构建了运行时间为O(m2^{n/m}/ε+m^2)的近似量子傅里叶变换子程序。\n3. 这为混合模拟-数字量子信息处理提供了一种通用接口，有望推动基于连续变量系统的量子计算、传感与通信协议的发展。", "summary_source": "deepseek", "authors": [{"name": "Joel Bierman"}, {"name": "Shubdeep Mohapatra"}, {"name": "Huiyang Zhou"}, {"name": "Yuan Liu"}], "featured_authors": [{"name": "Joel Bierman"}, {"name": "Shubdeep Mohapatra"}, {"name": "Huiyang Zhou"}, {"name": "Yuan Liu"}], "author_count": 4}, {"id": "2604.12186", "category": "quant-ph", "title": "Quantum Message Passing for Factor Graphs over Finite Abelian Groups", "abstract": "We develop a quantum message-passing framework for factor graphs over finite abelian groups. Our starting point is the task of discriminating between a collection of quantum states indexed by the elements of a finite abelian group $\\mathcal{G}$ whose overlaps respect the structure of a group-covariant pure-state channel (PSC). For such channels, we show that the Gram matrix constructed from the output states is diagonalized by the character basis of the dual group $\\widehat{\\mathcal{G}}$. Hence, the channel is characterized, up to isometric equivalence, by its character-indexed eigen list. Based on this representation, we analyze the induced classical-quantum channels associated with check, equality, homomorphism, marginalization, and automorphism factors. For each factor, we derive explicit update rules showing that if the incoming messages are heralded mixtures of group-covariant PSCs, then the outgoing message remains in the same class. This provides a closed quantum message-passing framework for tree-structured factor graphs assembled from these primitives. The framework applies directly to several standard code families over finite abelian groups, including polar codes, LDPC codes, and convolutional and turbo codes. It recovers the previously studied $q$-ary formulation as the special case $(\\mathcal{G}=\\mathbb{Z}_q)$, while extending the belief propagation with quantum messages (BPQM) framework introduced by Renes to non-cyclic alphabets and more general factor-graph constraints described by homomorphisms between products of abelian groups.", "url": "https://arxiv.org/abs/2604.12186", "type": "理论", "summary": "1. 本工作针对有限阿贝尔群上的因子图，发展了一套量子消息传递框架，其核心是处理具有群协变纯态信道结构的量子态区分任务。\n2. 该框架的关键在于证明了输出态的Gram矩阵可由对偶群的字符基对角化，从而导出针对校验、同态、边缘化等因子的封闭更新规则。\n3. 此框架可直接应用于极码、LDPC码等多类群代数码，将已有的二元BPQM方案推广至非循环字母表及更一般的同态约束情形。", "summary_source": "deepseek", "authors": [{"name": "Avijit Mandal"}, {"name": "Henry D. Pfister"}], "featured_authors": [{"name": "Avijit Mandal"}, {"name": "Henry D. Pfister"}], "author_count": 2}, {"id": "2604.12187", "category": "quant-ph", "title": "A Bundle Isomorphism Relating Complex Velocity to Quantum Fisher Operators", "abstract": "We show that averaging matter dynamics over stochastic gravitational fluctuations gives rise to a complex velocity field \\(\\eta_{\\mu} = \\pi_{\\mu} - i u_{\\mu}\\) living as a section of the pullback bundle \\(E = \\pi_{2}^{*}(T^{*}M)\\to \\mathcal{C}\\times M\\). We prove that \\(\\eta_{\\mu}\\) is isomorphic, via the Schrödinger representation, to the symmetric logarithmic derivative (SLD) operator \\(L_{\\mu}\\) on the Hilbert space \\(\\mathcal{H}_{x} = L^{2}(\\mathcal{C})\\), up to a trace-zero projection. This isomorphism \\(\\widetilde{\\mathcal{T}}:\\Gamma (E / \\sim)\\to \\Gamma (\\mathcal{L})\\) is a bundle isomorphism preserving the flat \\(U(1)\\) connection (proved in \\cite{meza2026topological}) and the quantum Fisher metric. The quantum Fisher information metric \\(g_{\\mu \\nu}^{\\mathrm{FS}}\\) is expressed directly in terms of \\(\\eta_{\\mu}\\) as \\(g_{\\mu \\nu}^{\\mathrm{FS}} = - \\frac{4m^{2}}{\\hbar^{2}}\\mathrm{Re}\\langle (\\eta_{\\mu} - \\langle \\eta_{\\mu}\\rangle)(\\eta_{\\nu} - \\langle \\eta_{\\nu}\\rangle)\\rangle_{\\mathcal{P}}\\). The holonomy of \\(\\eta_{\\mu}\\) is quantized, leading to topological phases observable in atom interferometry.", "url": "https://arxiv.org/abs/2604.12187", "type": "理论", "summary": "1. 该工作证明了在随机引力涨落下平均的物质动力学产生的复速度场 η_μ，通过薛定谔表示与希尔伯特空间上的对称对数导数算符 L_μ 同构。\n2. 其核心在于构建了保持 U(1) 平坦联络与量子 Fisher 度规的丛同构，并将该度规直接表达为 g_{μν}^{FS} ∝ Re⟨(η_μ−⟨η_μ⟩)(η_ν−⟨η_ν⟩)⟩_P。\n3. 这为通过原子干涉仪观测 η_μ 的整数量子化 holonomy 所导致的拓扑相位提供了明确的数学框架与理论预言。", "summary_source": "deepseek", "authors": [{"name": "Jorge Meza-Domínguez"}], "featured_authors": [{"name": "Jorge Meza-Domínguez"}], "author_count": 1}, {"id": "2604.12224", "category": "quant-ph", "title": "Current conservation and amplitude regularisation of the Landau problem: Bohm--Madelung description", "abstract": "This work investigates the dynamics of a charged particle in a uniform magnetic field within the Bohm--Madelung formulation of quantum mechanics. In this representation, the stationary Schrodinger equation separates into coupled amplitude and phase equations, where the amplitude sector admits a Sturm--Liouville structure supporting Ermakov--Lewis invariants. The analysis considers two complementary regularisation schemes: a global Fisher--information--based regularisation and a local canonical (shell) Bohm regularisation derived from stationary flux closure. These are applied within distinct classes of stationary flow, characterised by vanishing and nonvanishing component currents. It is shown that the radial and axial sectors remain globally regularisable, preserving analytic structure across the domain. In contrast, the azimuthal sector develops a nonseparable, generally complex-valued amplitude structure due to gauge-induced coupling. Nevertheless, a consistent local regularity is recovered at the level of canonical branches, where amplitude--momentum relations organise the solution in a well-defined manner. Regularisation thus acts as a structural reorganisation mechanism in amplitude space, preserving the Landau spectral scale while reorganising the flux-sector structure through branch-wise amplitude--momentum relations, thus establishing branch-wise organisation as a natural framework for describing stationary Bohmian dynamics in the Landau problem.", "url": "https://arxiv.org/abs/2604.12224", "type": "理论", "summary": "1. 该工作在Bohm-Madelung量子力学表述下，系统研究了均匀磁场中带电粒子的定态动力学，通过分析定态薛定谔方程分离出的耦合振幅与相位方程，聚焦于电流守恒条件与两类互补振幅正则化方案的构建与应用。\n2. 其核心物理机制在于结合全局Fisher信息正则化与局部壳Bohm正则化，揭示了振幅空间中的结构重组：径向与轴向部分保持全局正则性，而规范耦合导致的方位部分复值振幅结构通过分支级振幅-动量关系实现局部正则化。\n3. 这确立了分支级组织作为描述朗道问题中定态Bohmian动力学的自然框架，为处理规范诱导耦合的量子系统提供了结构性见解，并启发了量子流体动力学中通量重组与谱尺度维持的理论研究。", "summary_source": "deepseek", "authors": [{"name": "Anand Aruna Kumar"}], "featured_authors": [{"name": "Anand Aruna Kumar"}], "author_count": 1}, {"id": "2604.12267", "category": "quant-ph", "title": "Quantum Chaos and Quantum Information: Interactions and Implications", "abstract": "The notion of Shannon entropy is crucial for the theory of classical information. In quantum information theory, an analogous key role is played by the von Neumann entropy: quantum information processing is closely related to entropy dynamics. This reveals a direct link with the theory of quantum chaotic systems, which can be characterized by a positive entropy production. Furthermore, noise, which inevitably affects any quantum system, can be modeled by a random quantum operation or by coupling to an environment in a generic chaotic state. In this contribution, we emphasize the universality of quantum chaotic dynamics and discuss its implications for quantum information processing.", "url": "https://arxiv.org/abs/2604.12267", "type": "理论", "summary": "1. 本文建立了量子混沌系统与量子信息处理之间的理论联系框架，并强调了前者的普适性。\n2. 其核心在于阐明了以正熵产生为特征的量子混沌动力学，为模拟量子噪声和随机操作提供了普适机制。\n3. 这为理解开放量子系统中信息处理的根本限制，以及设计抗噪声的量子计算协议提供了重要的理论指导原则。", "summary_source": "deepseek", "authors": [{"name": "Arul Lakshminarayan"}, {"name": "Karol Życzkowski"}], "featured_authors": [{"name": "Arul Lakshminarayan"}, {"name": "Karol Życzkowski"}], "author_count": 2}, {"id": "2604.12276", "category": "quant-ph", "title": "Periodic dynamics in an Ising chain with a quadratic transverse field", "abstract": "A quadratic well plays a central role in a wide variety of modern physical theories and applications. In this work, we investigate many-body dynamics in a quadratic well, using an Ising chain as a paradigmatic example. In contrast to a uniform Ising chain, where the quantum phase transition is driven by the field strength, the present system exhibits spatially varying quantum phases along the chain. Through analysis of the Majorana representation, we obtain exact solutions for localized modes, revealing a topologically degenerate spectrum in the thermodynamic limit. In the case of a finite-size quantum phase region, the Kramers-like degeneracy is lifted by a constant shift, leading to periodic oscillations for a finite-temperature thermal initial state. Numerical simulations of the magnetization, local density of state, and quench fidelity support our conclusions. Our findings enrich the understanding of many-body dynamics in a trapping field.", "url": "https://arxiv.org/abs/2604.12276", "type": "理论+数值", "summary": "1. 该工作研究了横向磁场呈二次型分布的伊辛链中的多体动力学行为。\n2. 通过马约拉纳表象分析获得局域模的精确解，揭示了热力学极限下的拓扑简并能谱。\n3. 这一结果为理解受限势场中多体系统的非平衡演化提供了新的理论视角。", "summary_source": "deepseek", "authors": [{"name": "H. P. Zhang"}, {"name": "Z. Song"}], "featured_authors": [{"name": "H. P. Zhang"}, {"name": "Z. Song"}], "author_count": 2}, {"id": "2604.12279", "category": "quant-ph", "title": "Numerically optimized amplitude-robust controlled-Z gate for ultracold neutral atoms with individual addressing capability", "abstract": "We numerically optimized a scheme for a neutral atom Rydberg blockade symmetric controlled-Z (CZ) gate to increase its robustness to variations in the Rabi frequency. This gate scheme uses analytically defined phase profiles of the laser pulse and demonstrates increased robustness to variations in the Rabi frequency almost by an order of magnitude compared to previous proposals. We demonstrate the applicability of our gate protocol to individual addressing in Rydberg excitation, taking into account the asymmetry of Rabi frequencies for two atoms that are individually excited by tightly focused laser beams. This allows for reducing the effects of residual thermal motion of trapped atoms and beam pointing instability on gate fidelities. We investigated the performance of our gate protocol for single-photon and two-photon Rydberg excitation schemes and showed its advantages for individual addressing at finite temperatures of trapped atoms.", "url": "https://arxiv.org/abs/2604.12279", "type": "理论+数值", "summary": "1. 该工作通过数值优化设计了一种适用于中性里德堡原子的受控Z门方案。\n2. 其技术核心在于利用解析设计的激光脉冲相位轮廓，将门操作对拉比频率波动的鲁棒性提升近一个数量级，并适用于存在不对称激发条件的单原子寻址。\n3. 该方法能有效抑制原子残余热运动和光束指向不稳定性的影响，为有限温度下基于中性原子的可扩展量子计算提供了可行的门操作策略。", "summary_source": "deepseek", "authors": [{"name": "K.V. Kozenko"}, {"name": "V.V. Gromyko"}, {"name": "I.I. Beterov"}, {"name": "I.I. Ryabtsev"}], "featured_authors": [{"name": "K.V. Kozenko"}, {"name": "V.V. Gromyko"}, {"name": "I.I. Beterov"}, {"name": "I.I. Ryabtsev"}], "author_count": 4}, {"id": "2604.12345", "category": "quant-ph", "title": "Quantum Kicked Top: A Paradigmatic Model", "abstract": "The quantum kicked top (QKT) is one of the most widely studied models in quantum chaos, providing a minimal yet powerful framework for exploring the relationship between classical nonlinear dynamics and quantum behavior. Unlike many chaotic systems with infinite-dimensional Hilbert spaces, the QKT possesses a finite-dimensional Hilbert space, making it analytically and numerically controllable while still showing a rich dynamical phenomena. In this chapter, we present a comprehensive introduction to the QKT as a paradigmatic model of quantum chaos. Starting from the classical kicked top, we derive the discrete nonlinear map governing the dynamics on the unit sphere and analyze its phase space structure through fixed points, stability analysis, bifurcations and Lyapunov exponents. We then discuss the role of symmetries, including rotational and time-reversal symmetry, and how their breaking modifies the dynamics. The quantum description is developed using Floquet theory, where the periodically driven spin system is represented by a unitary Floquet operator acting on a $(2j+1)$-dimensional Hilbert space. Within this framework, signatures of quantum chaos such as spectral statistics, entanglement generation and recurrences are discussed. The model also admits an interpretation as a system of interacting qubits, enabling explicit few-qubit realizations and direct connections with quantum information measures through reduced density matrices and entanglement entropy. By linking classical phase space structures with quantum dynamical indicators, the QKT provides a clear setting to investigate the emergence of chaotic behavior in the semiclassical limit. The chapter, therefore, highlights the quantum kicked top as a bridge between nonlinear classical dynamics, quantum chaos and modern quantum information science.", "url": "https://arxiv.org/abs/2604.12345", "type": "理论+数值", "summary": "1. 本章节全面阐述了量子受击陀螺模型，将其作为量子混沌研究的范式系统，系统介绍了从经典非线性映射到量子Floquet理论的全套框架。\n2. 其核心优势在于通过有限维希尔伯特空间实现严格可解性，同时明确揭示了经典相空间结构与量子谱统计、纠缠产生等混沌特征之间的对应关系。\n3. 该模型为在可控少比特系统中实验研究半经典极限下的混沌涌现，以及探索非线性动力学与量子信息科学之间的深层联系提供了理想平台。", "summary_source": "deepseek", "authors": [{"name": "Avadhut V. Purohit"}, {"name": "Udaysinh T. Bhosale"}], "featured_authors": [{"name": "Avadhut V. Purohit"}, {"name": "Udaysinh T. Bhosale"}], "author_count": 2}, {"id": "2604.12347", "category": "quant-ph", "title": "Noise-Enhanced Self-Healing Dynamics in Non-Hermitian Systems", "abstract": "Self-healing is the ability of a wave packet to spontaneously restore its spatial profile after scattering. As an emergent feature of non-unitary dynamics, it has attracted significant interest in non-Hermitian physics. Here, we systematically investigate how stochastic noise influences edge self-healing. Counterintuitively, we find that noise can constructively enhance this dynamical process. Weak noise prolongs the self-healing window by aligning the finite-time Lyapunov exponent of the reference state with the maximum imaginary part of the energy spectrum. Remarkably, strong noise universally stabilizes asymptotic profile recovery across the entire spectrum by inducing an effective non-unitary drift-diffusion dynamics. We analytically elucidate these distinct mechanisms using a general finite-time Lyapunov exponent analysis, complemented by a dedicated perturbation theory for the strong-noise regime. Our results provide concrete guidance for realizing robust non-Hermitian dynamics in realistic noisy environments.", "url": "https://arxiv.org/abs/2604.12347", "type": "理论", "summary": "1. 该工作系统研究了随机噪声对非厄米系统中边缘自愈动力学的影-响。\n2. 其卖点在于揭示噪声可构造性增强自愈过程，弱噪声通过对齐参考态的有限时间李雅普诺夫指数与能谱最大虚部来延长自愈窗口，强噪声则通过诱导有效的非幺正漂移-扩散动力学普遍稳定渐近轮廓恢复。\n3. 这为在真实噪声环境中实现稳健的非厄米动力学提供了具体理论指导。", "summary_source": "deepseek", "authors": [{"name": "Wuping Yang"}, {"name": "H. Huang"}], "featured_authors": [{"name": "Wuping Yang"}, {"name": "H. Huang"}], "author_count": 2}, {"id": "2604.12361", "category": "quant-ph", "title": "Noise-Robust Ultrafast Entanglement Generation in Rydberg Atoms via Quantum Optimal Control", "abstract": "We present a comprehensive theoretical analysis of ultrafast entanglement generation between two Rydberg-blockaded atoms, explicitly accounting for realistic laser noise. Using femtosecond Gaussian pulses as a baseline, we systematically evaluate Bell-state fidelity sensitivity to amplitude and phase noise across white, pink (1/f), and Ornstein-Uhlenbeck spectra using Monte Carlo ensemble simulations. Our results show that amplitude noise is well tolerated, with fidelities above 90% even at 30% noise levels, while phase noise is the primary limiting factor, causing fidelity to drop rapidly beyond about 1% noise amplitude. The spectral structure of the noise is also important: pink noise consistently causes less fidelity loss than white noise of the same amplitude. By applying quantum optimal control theory (QOCT) with the D-MORPH algorithm under multiple equality constraints, we obtain a double-pulse structure with a spectral notch that achieves approximately 99% fidelity in the noise-free case and maintains high fidelity under moderate amplitude noise. A breakdown threshold near 1% amplitude noise is identified, beyond which even optimized pulses cannot sustain coherent control. These results offer practical benchmarks for the development of ultrafast neutral-atom quantum processors operating in the femtosecond regime.", "url": "https://arxiv.org/abs/2604.12361", "type": "理论+数值", "summary": "1. 该工作理论分析了里德堡阻塞原子间超快纠缠生成，并系统评估了多种激光噪声谱下贝尔态保真度。\n2. 通过量子最优控制理论设计出具有频谱陷波特性的双脉冲结构，在无噪声下实现约99%保真度并耐受30%幅度噪声。\n3. 这为飞秒尺度中性原子量子处理器建立了关键的噪声容限基准与脉冲优化范式。", "summary_source": "deepseek", "authors": [{"name": "Tanveer Ahmad"}, {"name": "Muhammad Muneer"}], "featured_authors": [{"name": "Tanveer Ahmad"}, {"name": "Muhammad Muneer"}], "author_count": 2}, {"id": "2604.12369", "category": "quant-ph", "title": "A Periodic Orbit Trace Formula for Quantum Scrambling: The Role of the Normally Hyperbolic Invariant Manifold", "abstract": "Out-of-Time-Order Correlators (OTOCs) quantify quantum information scrambling, but their connection to localized phase-space structures, such as chemical transition states, requires formal development. We derive a leading-order semiclassical expansion for the local microcanonical OTOC in systems with an index-1 saddle point, expressing the scrambling rate as a coherent sum over unstable periodic orbits on the Normally Hyperbolic Invariant Manifold (NHIM). Valid in the semiclassical limit and the intermediate-time regime before the Ehrenfest time, our derivation utilizes the Normal Form theory of the transition state, which transforms the Hamiltonian near the saddle into an integrable (though generally non-separable) form dependent on conserved actions. We outline the derivation of the microcanonical trace, the semiclassical propagator for integrable systems, the factorization of the stability matrix, and the Schur complement reduction of the stationary phase approximation. Our result extends periodic-orbit trace methods to scrambling observables, yielding a local instability exponent {\\Lambda}(J) governing the leading semiclassical growth window. As a special case, when the observation time coincides with the intrinsic periods of the contributing orbits, the trace sum reduces to an effective 1.5{\\Lambda} scaling, resulting from the competition between local hyperbolic growth and wavepacket dilution. This simplified form is conditional; the full expansion retains a coherent sum over orbit periods. Finally, we discuss how the dependence of the instability on transverse actions establishes a theoretical mechanism for mode-selective control of scrambling, and outline a numerical evaluation strategy to test these predictions.", "url": "https://arxiv.org/abs/2604.12369", "type": "理论+数值", "summary": "1. 本文推导了在指数为1的鞍点附近，局域微正则OTOC的首阶半经典展开，将量子信息混饨率表达为法向双曲不变流形上不稳定周期轨道的相干求和。\n2. 其核心在于将过渡态正规形式理论与周期轨道迹公式结合，得到了由横向量子数决定的局域不稳定性指数Λ(J)，该指数主导了Ehrenfest时间前的半经典增长窗口。\n3. 此框架建立了混饨率对横向作用的依赖关系，为模式选择性地调控量子信息混饨提供了理论机制，并指明了可通过数值计算验证的路径。", "summary_source": "deepseek", "authors": [{"name": "Stephen Wiggins"}], "featured_authors": [{"name": "Stephen Wiggins"}], "author_count": 1}, {"id": "2604.12381", "category": "quant-ph", "title": "Enhanced quantum illumination of a lossy target: A sequential interaction model", "abstract": "The effectiveness of quantum illumination (QI) of a lossy target is investigated in a realistic setting in which the signal sequentially interacts with a noisy environment and the target. The target is considered at a temperature distinct from its surroundings, while both the interactions are modeled as an action of independent beam splitters with different reflectivities. The detection performance is quantified using the signal-to-noise ratio (SNR) and the quantum Chernoff bound (QCB), the latter providing an upper bound on the error probability. The performance of the Gaussian two-mode squeezed state (TMSS) is compared with that of the optimal classical protocol based on coherent states (CS). The proposed model shows that TMSS consistently achieves a higher SNR than CS for a low-reflectivity target and an arbitrary phase change and remains robust against thermal noise. Furthermore, a sufficiently lower QCB is obtained for TMSS than in previously reported results, indicating greater distinguishability between the presence and absence of the target. These findings underscore the role of realistic modeling in improving QI-based detection of lossy targets, with potential relevance to quantum radar and lidar systems.", "url": "https://arxiv.org/abs/2604.12381", "type": "理论", "summary": "1. 该研究在信号与环境及目标顺序相互作用的模型中，探究了量子照明对损耗目标的探测效能。\n2. 其核心发现在于高斯双模压缩态在低反射率目标及任意相位下，信噪比始终优于经典相干态方案且抗热噪声。\n3. 这为基于更现实模型提升量子照明探测能力、进而推动量子雷达与激光雷达应用提供了明确依据。", "summary_source": "deepseek", "authors": [{"name": "Shilpi Srivastava"}, {"name": "Shubhrangshu Dasgupta"}], "featured_authors": [{"name": "Shilpi Srivastava"}, {"name": "Shubhrangshu Dasgupta"}], "author_count": 2}, {"id": "2604.12395", "category": "quant-ph", "title": "Permutationally symmetric molecular aggregates", "abstract": "Linear optical spectra of molecular aggregates are often approximated by classical optics methods such as the discrete-dipole approximation (DDA), coherent exciton scattering (CES), and coherent potential approximation (CPA), where the only quantum-mechanical input to the calculation is the linear susceptibility of the monomers. However, the limits of validity of these classical optics methods remain opaque. Here, starting from a quantum mechanical Hamiltonian for the aggregate, we identify a limit where DDA/CPA/CES is exact: all-to-all coupled permutationally symmetric aggregates of $N \\to \\infty$ monomers. The permutational symmetry of this molecular version of the Lipkin-Meshkov-Glick model, which is closely related to that of the molecular polariton problem of many identical molecules coupled to a single-cavity mode, allows us to borrow recent techniques developed for the latter. In particular, we identify a $1/N$ expansion that corrects the classical optics limit with finite $N$ corrections to the linear response of the aggregate. These corrections feature as Raman-like transitions of a single monomer. We illustrate these findings with calculations on the very physically-relevant setup of a homodimer. Our findings clarify how quantum optical features that go beyond classical optics can already be present in simple arrays of quantum emitters such as molecular aggregates.", "url": "https://arxiv.org/abs/2604.12395", "type": "理论+数值", "summary": "1. 该研究从分子聚集体的量子力学哈密顿量出发，推导出经典光学方法（如离散偶极近似）在特定极限下严格成立的条件：即全耦合置换对称的无穷大单体聚集体系。\n2. 其技术核心在于借用了分子极化子问题中发展的方法，针对该Lipkin-Meshkov-Glick模型的分子版本，构建了可修正经典光学极限的1/N展开理论。\n3. 该理论揭示有限尺寸修正表现为单体的拉曼型跃迁，明确了简单量子发射体阵列中已存在超越经典光学的量子光学特征。", "summary_source": "deepseek", "authors": [{"name": "Sricharan Raghavan-Chitra"}, {"name": "Arghadip Koner"}, {"name": "Joel Yuen-Zhou"}], "featured_authors": [{"name": "Sricharan Raghavan-Chitra"}, {"name": "Arghadip Koner"}, {"name": "Joel Yuen-Zhou"}], "author_count": 3}, {"id": "2604.12410", "category": "quant-ph", "title": "Notes on some inequalities, resulting uncertainty relations and correlations. 1. General mathematical formalism", "abstract": "We analyze the Schwarz inequality and its generalizations, as well as inequalities resulting from the Jensen inequality. They are used in quantum theory to derive the Heisenberg-Robertson (HR) and Schroedinger-Robertson (SR) uncertainty relation for two non-commuting observables and their generalizations to three or more non-commuting observables. Jensen's inequality, in turn, is helpful in deriving various the \"sum uncertainty relations\" for two or more observables. Using these inequalities, we derive various types of generalized uncertainty relations for more than two non--commuting observables and analyze their properties and critical points. We also study the connections between the generalizations of the HR and SR uncertainty relations for two and more observables and the correlations of these observables in the state of the quantum system under study. In this analysis, we pay special attention to the consequences of the generalized SR uncertainty relation for three non--commuting observables on their correlations in a given state of a quantum system and to the connections of this relation with the appropriate correlation matrix, whose matrix elements are the quantum versions of the Pearson coefficient. We show also that the SR uncertainty relation (including the generalized ones) can be written in an equivalent way using these Pearson coefficients.", "url": "https://arxiv.org/abs/2604.12410", "type": "理论", "summary": "1. 该工作基于施瓦茨不等式与延森不等式，系统推导了多个不对易可观测量间的广义海森堡-罗伯逊与薛定谔-罗伯逊不确定关系，并分析了其性质与临界点。\n2. 核心进展在于将三个及以上可观测量间的不确定关系与量子皮尔逊系数构成的关联矩阵相联系，并给出了基于该系数的等价表述形式。\n3. 这一形式化框架为分析多体量子系统中可观测量间的复杂关联，以及探索超越标准不确定性原理的量子关联结构提供了新工具。", "summary_source": "deepseek", "authors": [{"name": "Krzysztof Urbanowski"}], "featured_authors": [{"name": "Krzysztof Urbanowski"}], "author_count": 1}, {"id": "2604.12450", "category": "quant-ph", "title": "$\\mathbb{Z}_{2}$ Skin Channels and Scale-Dependent Dynamical Quantum Phase Transitions", "abstract": "We analytically describe the dynamically separated $\\mathbb{Z}_{2}$ skin channels (wavepacket evolutions) under periodic boundary condition (PBC) in non-Hermitian systems with anomalous time-reversal symmetry (ATRS), by combining the semiclassical worldline perspective with an enhanced understanding of skin effects. These channels, tied to the initial state and relevant symmetries, exhibit individually exponential-dominated time evolution in momentum space, where their amplitude maxima evolve toward the dominant momenta. In real space, they circulate around the one-dimensional (1D) chain, tracing semiclassical worldlines. Such circulations imply quantum revivals and dynamical quantum phase transitions (DQPTs) regardless of any wavepackets' phase interference, with the latter showing scale-dependent behavior, a feature distinct from conventional DQPTs. This work rigorously demonstrates our previous findings on worldline windings and the winding-control mechanism, confirming that the core physics is shared with the ordinary skin effect.", "url": "https://arxiv.org/abs/2604.12450", "type": "理论", "summary": "1. 该工作结合半经典世界线视角与对非厄米趋肤效应的深化理解，解析描述了具有反常时间反演对称性系统中周期边界条件下的动态分离$\\mathbb{Z}_{2}$趋肤通道。\n2. 这些通道在动量空间呈现指数主导的演化并在实空间沿一维链循环，其循环特性导致不依赖于波包相位干涉的量子复苏与具有尺度依赖行为的动态量子相变。\n3. 这为基于世界线绕数与缠绕控制机制研究非厄米系统中普适的非平衡动力学行为提供了严格的理论基础与新的方向。", "summary_source": "deepseek", "authors": [{"name": "Yongxu Fu"}], "featured_authors": [{"name": "Yongxu Fu"}], "author_count": 1}, {"id": "2604.12465", "category": "quant-ph", "title": "Demonstrating Record Fidelity for the Quantum Fourier Transform", "abstract": "We demonstrate the Parity Architecture on quantum hardware, using the quantum Fourier transform (QFT) as a benchmark. As a result, a record performance in both fidelity and qubit count is achieved using quantum processors with a native CZ-based instruction set. On the IBM Heron r3 chip, a process fidelity of the QFT algorithm of ${F \\approx 10^{-2}}$ for ${N=50}$ qubits is achieved. The scaling of the speedup compared to previous swap-based methods is super-exponential $\\mathcal{O}(\\exp(N^2))$. Furthermore, we show that the scaling can be improved further by including iSWAP gates in the instruction set.", "url": "https://arxiv.org/abs/2604.12465", "type": "数值", "summary": "1. 该工作基于奇偶架构在量子硬件上演示了量子傅里叶变换，在IBM Heron r3处理器上以50个量子比特实现了约10^{-2}的算法过程保真度。\n2. 其核心优势在于利用原生CZ门指令集实现了超指数级（O(exp(N^2))）的加速标度，相比之前的交换架构方法有显著提升。\n3. 这表明通过进一步引入iSWAP门可优化标度行为，为在大规模量子处理器上实现更复杂的量子算法提供了可行的技术路径。", "summary_source": "deepseek", "authors": [{"name": "Philipp Aumann"}, {"name": "Michael Fellner"}, {"name": "David Alber"}, {"name": "Max Cykiert"}, {"name": "Christoph Fleckenstein"}, {"name": "Roeland ter Hoeven"}, {"name": "Leo Stenzel"}, {"name": "Riccardo J. Valencia-Tortora"}, {"name": "Wolfgang Lechner"}], "featured_authors": [{"name": "Philipp Aumann"}, {"name": "Michael Fellner"}, {"name": "David Alber"}, {"name": "Leo Stenzel"}, {"name": "Riccardo J. Valencia-Tortora"}, {"name": "Wolfgang Lechner"}], "author_count": 9}, {"id": "2604.12516", "category": "quant-ph", "title": "Scattering Faddeev calculations in the double continuum", "abstract": "We use the configuration-space Faddeev formalism to study scattering of three particles in the double continuum where all particles are free. All scattering processes, starting from and ending in both single and double continua, are collected in a unique matrix. We apply our method to the benchmark system of neutron-deuteron scattering.", "url": "https://arxiv.org/abs/2604.12516", "type": "数值", "summary": "1. 本研究采用位形空间Faddeev形式，系统地研究了三个粒子在双连续谱区的散射问题，其中所有粒子均处于自由态。\n2. 其核心方法在于将所有从单/双连续谱始末态出发的散射过程统一收集在一个矩阵中，并应用于中子-氘核散射这一基准体系进行验证。\n3. 该框架为量子少体系统在连续谱区的精确散射计算提供了系统工具，可拓展至核物理与原子分子物理中的复杂反应过程研究。", "summary_source": "deepseek", "authors": [{"name": "Romain Guérout"}], "featured_authors": [{"name": "Romain Guérout"}], "author_count": 1}, {"id": "2604.12560", "category": "quant-ph", "title": "Design automation and space-time reduction for surface-code logical operations using a SAT-based EDA kernel compatible with general encodings", "abstract": "Fault-tolerant quantum computers (FTQCs) based on surface codes and lattice surgery have been widely studied, and there is strong demand for a framework that can identify logical operations with low space-time cost, verify their functionality and fault tolerance, and demonstrate their optimality within a given search space, much like electronic design automation (EDA) in classical circuit design. In this paper, we propose KOVAL-Q, an EDA kernel that verifies and optimizes surface-code logical operations by formulating them as a satisfiability (SAT) problem. Compared with existing SAT-based frameworks such as LaSsynth, our method can handle logical qubits with more flexible surface-code encodings, both as target configurations and as intermediate states. This extension enables the optimization of advanced layouts, such as fast blocks, and broadens the search space for logical operations. We demonstrate that KOVAL-Q can determine the minimum execution time of fundamental logical operations in given spatial layouts, such as $d$-cycle logical CNOTs and $2d$-cycle patch rotations. Their use reduces the execution time of widely studied FTQC applications by about 10% under a simplified scheduling model. KOVAL-Q consists of three subkernels corresponding to different types of constraints, which facilitates its integration as a submodule into scalable heuristic frameworks. Thus, our proposal provides an essential framework for optimizing and validating core FTQC subroutines.", "url": "https://arxiv.org/abs/2604.12560", "type": "理论+数值", "summary": "1. 该工作提出了KOVAL-Q，一种基于可满足性问题（SAT）的电子设计自动化内核，用于验证和优化表面码的逻辑操作。\n2. 其技术优势在于能处理具有更灵活表面码编码的逻辑量子比特，从而支持优化如快速块等先进布局，并拓宽逻辑操作的搜索空间。\n3. 这为将核心子程序验证与优化模块集成到可扩展的启发式框架中，以系统降低容错量子计算的空间时间成本提供了关键工具。", "summary_source": "deepseek", "authors": [{"name": "Wang Liao"}, {"name": "Rei Tokami"}, {"name": "Yasunari Suzuki"}], "featured_authors": [{"name": "Wang Liao"}, {"name": "Rei Tokami"}, {"name": "Yasunari Suzuki"}], "author_count": 3}, {"id": "2604.12629", "category": "quant-ph", "title": "Mutual information harvesting for circularly accelerated detectors", "abstract": "We investigate the mutual information harvesting of two circularly accelerated detectors that interact with the massless scalar fields near a reflecting boundary. We consider that the two detectors share a common rotational axis with the same acceleration and trajectory radius. As the interdetector separation increases, the mutual information may exhibit oscillatory behavior at large acceleration and small radius. For a fixed radius, a larger acceleration leads to a larger peak value of the mutual information. Near the boundary, the mutual information may oscillate and the maximum can be obtained. As the acceleration increases, the mutual information in a small interdetector separation first increases and then decreases. For an intermediate interdetector separation, the mutual information may oscillate with the increase of acceleration. For a not large interdetector separation, when we take large acceleration and small radius, as the energy gap increases, the mutual information first decreases, then oscillates, and finally goes to zero. The combination of large acceleration and small radius corresponds to the fast rotation, which significantly modifies the vacuum fluctuations of the field, leading to the oscillatory behavior. Furthermore, the oscillation intensifies near the boundary, which indicates that it is related to the coherent superposition of boundary reflections.", "url": "https://arxiv.org/abs/2604.12629", "type": "理论", "summary": "1. 本研究考察了在反射边界附近两个共轴等加速度圆周运动的探测器通过与无质量标量场相互作用来提取互信息的现象。\n2. 核心发现是：大加速度与小轨道半径组合导致的快速旋转显著改变了真空涨落，使互信息随探测器间距呈现振荡行为，且边界反射的相干叠加进一步增强了该振荡。\n3. 此结果表明，边界条件与相对论性运动可协同调控探测器间的量子关联，为弯曲时空或受限空间中 relativistic quantum information 的研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Mingkun Quan"}, {"name": "Runhu Li"}, {"name": "Zixu Zhao"}], "featured_authors": [{"name": "Mingkun Quan"}, {"name": "Runhu Li"}, {"name": "Zixu Zhao"}], "author_count": 3}, {"id": "2604.12646", "category": "quant-ph", "title": "Interferometrically Enhanced Asymmetry in Strong-field Ionization with Bright Squeezed Vacuum", "abstract": "We demonstrate that quantum light statistics can be used to control strong-field ionization at the tunneling step. Using a bichromatic linearly polarized field composed of a strong coherent driver and a weak bright squeezed vacuum (BSV), we show through simulation that photoelectron momentum distributions (PMDs) exhibit asymmetries that exceed those obtained with classical fields of comparable intensity by orders of magnitude. This enhancement is uniquely linked to the nonclassical statistics of the BSV field. A semiclassical analysis based on the strong-field approximation (SFA) reveals that the effect originates from fluctuations in the instantaneous field amplitude, which stron
