  <title>arXiv 2026-04-24 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2604.20899", "category": "cond-mat", "title": "Predicting Scale-Up of Metal-Organic Framework Syntheses with Large Language Models", "abstract": "Scalable synthesis remains the gate between MOF discovery and industrial deployment, as scale-up know-how is fragmented across disparate reports. We introduce ESU-MOF, a literature-mined dataset and a positive-unlabeled learning strategy that fine-tunes large language models to predict scalability potential with 91.4% accuracy, enabling rapid data-driven triage for industrial MOF discovery.", "url": "https://arxiv.org/abs/2604.20899", "type": "理论", "summary": "1. 该工作通过文献挖掘和正无标签学习策略微调大语言模型，构建ESU-MOF数据集以预测金属有机框架合成的可规模化潜力。\n2. 主要技术亮点在于实现了91.4%的预测准确率，为工业MOF发现提供数据驱动的快速筛选方法。\n3. 这为弥合实验室发现与工业化部署之间的放大合成鸿沟提供了高通量计算预测途径。", "summary_source": "deepseek", "authors": [{"name": "Peter Walther"}, {"name": "Hongrui Sheng"}, {"name": "Xinxin Liu"}, {"name": "Bin Feng"}, {"name": "Reid Coyle"}, {"name": "Xinhua Yan"}, {"name": "Kyle Smith"}, {"name": "Harrison Kayal"}, {"name": "Shyam Chand Pal"}, {"name": "Zhiling Zheng"}], "featured_authors": [{"name": "Peter Walther"}, {"name": "Hongrui Sheng"}, {"name": "Xinxin Liu"}, {"name": "Harrison Kayal"}, {"name": "Shyam Chand Pal"}, {"name": "Zhiling Zheng"}], "author_count": 10}, {"id": "2604.20976", "category": "cond-mat", "title": "Local Electroneutrality Violation as a Universal Constraint in Confined Electrolytes", "abstract": "We show that finite-size violations of local electroneutrality in confined electrolytes are governed by the topology of the confining domain, yielding a universal hierarchy of deviations across spherical, cylindrical, and planar geometries. Within Poisson-Boltzmann theory, we introduce an electroneutrality deviation ratio that quantifies how global electrostatic constrains associated with compacness and boundary multiplicity modify charge balance inside confined domains. Although electroneutrality is asymptotically restored in all geometries, finite-size deviations are strongest in compact spherical cavities, weaker in cylindrical confinement, and weakest in planar slits. These results identify topology as the structural origin of confinement-induced charge redistribution and stablish the violation of local electroneutrality as global constraint underlying phenomena such as overcharging anf charge reversal, demostrating that confinement-not local-not local geometric details-controls the emergence of these effects.", "url": "https://arxiv.org/abs/2604.20976", "type": "理论", "summary": "1. 该工作展示受限电解质中局部电中性的有限尺度破坏受约束域拓扑控制，并建立了球、柱、平面几何中偏差强度的普适层级。\n2. 通过引入电中性偏差比，在Poisson-Boltzmann框架下揭示了全域静电约束源于域的紧致性与边界多重性，从而定量刻画了有限尺度电荷失衡。\n3. 这确立了约束拓扑而非局部几何细节作为过充电与电荷反转等现象的结构根源，为理解受限离子系统的普适性约束机制提供了明确指引。", "summary_source": "deepseek", "authors": [{"name": "M. Lozada-Cassou"}], "featured_authors": [{"name": "M. Lozada-Cassou"}], "author_count": 1}, {"id": "2604.21033", "category": "cond-mat", "title": "Orientation Dynamics of Gyrotactic Microswimmers in Turbulent Flows", "abstract": "We study the dynamics of gyrotactic microswimmers suspended in homogeneous and isotropic turbulence by using direct numerical simulations (DNS). The swimmers are characterized by three non-dimensional parameters: their aspect ratio ($\\gamma$), a dimensionless swimming speed ($\\phi$), and a dimensionless reorientation time ($\\psi$). Strong gyrotaxis (smaller $\\psi$) promotes vertical alignment of the swimmers, while weak gyrotaxis leads to nearly isotropic orientations. At low swimming numbers, the orientation distribution is largely shape-independent with spheres and spheroids showing marginally greater vertical alignment than rods, whereas at higher activity the peaks of the distributions exhibit largely shape-independent behavior and the tails show a clear dependence on particle shape. However, at large $\\psi$ rods exhibit a stronger alignment along the vertical. We observe that at small $\\psi$ the rod-shaped swimmers respond to shear by aligning with the stretching direction of the strain-rate tensor, while at large $\\psi$ the alignment with the vorticity vector is preferred. The orientation autocorrelation is found to decay exponentially, with a decay rate that scales as $1/(2\\psi)$. Analysis of the mean-squared displacement (MSD) reveals a transition from a ballistic motion at short times to a diffusive regime at longer times. To assess the efficiency of vertical migration, we compute the probability distributions of vertical displacement over a fixed time interval and the time taken to migrate a specific vertical distance. Furthermore, we use a simplified two-dimensional model for spherical swimmers that qualitatively reproduces the key trends observed in the full three-dimensional (3D) simulations.", "url": "https://arxiv.org/abs/2604.21033", "type": "理论+数值", "summary": "1. 该工作通过直接数值模拟研究了均向同性湍流中gyrotactic微生物游泳者的取向动力学，表征了纵横比、无量纲游泳速度与重定向时间三个参数的影响。\n2. 其核心发现是强gyrotaxis促进垂直排列，而弱gyrotaxis导致近各向同性取向；杆状游泳者在不同ψ下对剪切与涡量的响应呈现形状依赖的偏好转变。\n3. 这为理解微生物在湍流中的垂直迁移效率提供了定量框架，并启示了简化二维模型对三维趋势的再现能力。", "summary_source": "deepseek", "authors": [{"name": "Suraj Kumar Nayak"}, {"name": "Vishwanath Shukla"}, {"name": "Akshay Bhatnagar"}], "featured_authors": [{"name": "Suraj Kumar Nayak"}, {"name": "Vishwanath Shukla"}, {"name": "Akshay Bhatnagar"}], "author_count": 3}, {"id": "2604.21165", "category": "cond-mat", "title": "Percolation Critical Probability of Aperiodic Smith Hat tile(1, $\\sqrt3$)", "abstract": "The Smith Hat tile is the first known aperiodic monotile, having been discovered in 2023. The simple structure, constructed using only 8 kites, is unique and well motivated for analysis within percolation theory. The primary goal of this paper is to discover the critical threshold $p_c$ in both site and bond Bernoulli structures using Monte Carlo simulation for the Smith hat tile(1,$\\sqrt3$). Our findings are site and bond values of $p_c^s = 0.822725 \\pm 0.000044$ and $p_c^b = 0.798161 \\pm 0.000044$ for edge percolation and $0.544247 \\pm 0.000101$ for site percolation on the dual graph.", "url": "https://arxiv.org/abs/2604.21165", "type": "理论+数值", "summary": "1. 本文通过蒙特卡洛模拟确定了非周期单瓷砖Smith Hat(1,√3)的点逾渗与键逾渗临界概率。\n2. 给出了边逾渗阈值p_c^s=0.822725±0.000044、p_c^b=0.798161±0.000044及其对偶图点逾渗阈值0.544247±0.000101的高精度结果。\n3. 这为理解非周期序贯逾渗及类似准晶系统提供了基准数据与数值方法参考。", "summary_source": "deepseek", "authors": [{"name": "Haitao Gao"}, {"name": "Aaryash Bharadwaj"}], "featured_authors": [{"name": "Haitao Gao"}, {"name": "Aaryash Bharadwaj"}], "author_count": 2}, {"id": "2604.21194", "category": "cond-mat", "title": "Linking molecular timescales to linear viscoelastic response in dilute and semidilute unentangled wormlike micelle solutions", "abstract": "Unentangled wormlike micelle solutions relax stress through a dynamic interplay of reversible scission and intrachain relaxation involving a hierarchy of molecular timescales whose relationship to linear viscoelastic response remains incompletely resolved. A multiparticle mesoscopic Brownian dynamics framework has been developed in which persistent worms, represented by bead-spring chains with sticky ends, assemble to form wormlike micelles via reversible scission and fusion. Both linear and ring-like micelles are formed across the dilute and semidilute concentration regimes. Accurate predictions of dynamic properties are obtained through inclusion of hydrodynamic interactions using a RPY tensor. We identify and quantify characteristic timescales governing micellar dynamics, including bond lifetimes, self- and non-self-recombination times, breakage times of wormlike micelles of length $L$, relaxation times of various contributions to stress, and the longest relaxation time. The dependence of these timescales on sticker strength, concentration, micellar topology and hydrodynamic interactions is established. The presence of ring micelles is found to moderately prolong recombination and breakage processes, while hydrodynamic interactions are shown to affect some of the timescales by reducing sticker mobility. When appropriately scaled, the dependence on mean length of the non-self-recombination and micelle breakage times collapse onto master curves. Storage and loss moduli exhibit distinctive features in the intermediate-frequency regime that are absent in homopolymer solutions. A clear connection is made between micellar timescales and these signatures in the dynamic moduli at various characteristic frequencies, providing a direct link between microscopic dynamics and macroscopic rheology in unentangled wormlike micellar solutions, in dilute and semidilute concentration regimes.", "url": "https://arxiv.org/abs/2604.21194", "type": "理论+数值", "summary": "1. 该工作通过多粒子介观布朗动力学框架，模拟稀和半稀未缠结蠕虫状胶束溶液中可逆断裂与融合过程，并引入RPY张量描述流体动力学相互作用。\n2. 其核心在于识别并量化了键寿命、重组时间、断裂时间等多层次分子时间尺度，并直接建立其与动态模量中特征频率峰值的对应关系。\n3. 这为桥接微观可逆缔合动力学与宏观线性粘弹性响应提供了定量框架，可推广至其他活性缔合高分子体系。", "summary_source": "deepseek", "authors": [{"name": "Avishek Kumar"}, {"name": "Rico F Tabor"}, {"name": "P. Sunthar"}, {"name": "J. Ravi Prakash"}], "featured_authors": [{"name": "Avishek Kumar"}, {"name": "Rico F Tabor"}, {"name": "P. Sunthar"}, {"name": "J. Ravi Prakash"}], "author_count": 4}, {"id": "2604.21206", "category": "cond-mat", "title": "Magnetic-field control of interactions in alkaline-earth Rydberg atoms and applications to {\\it XXZ} models", "abstract": "We study the magnetic-field dependence of the interactions between two alkaline-earth(-like) Rydberg atoms, ${}^{88}$Sr and ${}^{174}$Yb. Considering the pair of Rydberg states $|ns,{}^3S_1,m_J\\rangle$ and $|(n+1)s,{}^3S_1,m_J\\rangle$, we show that the effective Hamiltonian takes the form of an {\\it XXZ}-type quantum spin model, as in the alkali-atom case [M. Kunimi and T. Tomita, Phys. Rev. A {\\bf 112}, L051301 (2025)]. We find that the behavior of the anisotropy parameter for ${}^{174}$Yb at zero magnetic field is significantly different from that for other atomic species. This behavior originates from the strong spin-orbit coupling in ${}^{174}$Yb. We systematically calculate the interaction parameters of the {\\it XXZ} model in the presence of a magnetic field and show that they can be tuned by the field. As applications to quantum many-body problems, we investigate one-dimensional systems in the large-anisotropy regime and show that the folded {\\it XXZ} model can be realized in ${}^{174}$Yb systems without fine-tuning of the field. We also investigate two-dimensional square-lattice systems and show that a supersolid phase can emerge in the ground state at the mean-field level.", "url": "https://arxiv.org/abs/2604.21206", "type": "理论", "summary": "1. 该工作研究了碱土金属里德堡原子(88Sr和174Yb)中磁场对相互作用的影响，导出了XXZ型量子自旋模型的有效哈密顿量。\n2. 其核心发现是174Yb在零场下各向异性参数显著不同于其他原子，源于其强自旋-轨道耦合，且该参数可通过磁场连续调谐。\n3. 这为实现无需精细调谐的折叠XXZ模型（一维）和基态超固相（二维方晶格，平均场层次）提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Masaya Kunimi"}, {"name": "Takafumi Tomita"}], "featured_authors": [{"name": "Masaya Kunimi"}, {"name": "Takafumi Tomita"}], "author_count": 2}, {"id": "2604.21244", "category": "cond-mat", "title": "BCS-BEC crossover of polaritonic condensates in mass-imbalanced semimetal/semiconductor microcavities", "abstract": "The impacts of the mass imbalance and Coulomb interaction on the complex phase structures of the polaritonic condensates and their Bardeen-Cooper-Schrieffer (BCS)--Bose-Einstein condensation (BEC) crossover in semiconductor and semimetal microcavities are investigated. In the framework of the unrestricted Hartree-Fock approximation, a two-band electron-hole model involving photon mode is analyzed by treating Coulomb attraction and light-matter coupling on equal footing. The single-particle spectral functions and the luminescence properties are then examined. In the semiconducting regime, a positive band gap stabilizes tightly bound excitons and yields predominantly BEC-type excitoniclike polaritonic condensates at low density, while increasing excitation density and reducing mass imbalance drives a continuous crossover toward BCS-type pairing with intermediate and photoniclike polaritonic character. In contrast, the semimetallic regime favors itinerant electron-hole pairing, with BCS-type condensates dominating and BEC excitoniclike coherence emerging only at sufficiently strong Coulomb interaction and large mass imbalance situations. The evolution of luminescence spectra provides clear spectroscopic signatures of these crossover phenomena, offering a unified framework for understanding and controlling polaritonic condensates in microcavity systems.", "url": "https://arxiv.org/abs/2604.21244", "type": "理论+数值", "summary": "1. 该工作利用无限制Hartree-Fock近似，等权处理库仑吸引与光-物质耦合，研究质量不平衡对半导体/半金属微腔中极化激元凝聚体BCS-BEC crossover的影响。\n2. 卖点在于揭示半导体区低密度BEC态随激发密度增大和质量不平衡减小连续演化为BCS态，而半金属区强库仑相互作用和大质量不平衡下才出现BEC类激子相干。\n3. 这为通过质量不平衡和库仑作用调控极化激元配对类型提供了统一框架，其发光谱演化特征可直接在微腔实验中作为交叉现象的谱学探针。", "summary_source": "deepseek", "authors": [{"name": "Thi-Hau Nguyen"}, {"name": "Minh-Tien Tran"}, {"name": "Van-Nham Phan"}], "featured_authors": [{"name": "Thi-Hau Nguyen"}, {"name": "Minh-Tien Tran"}, {"name": "Van-Nham Phan"}], "author_count": 3}, {"id": "2604.21281", "category": "cond-mat", "title": "Fate of the Unbound States in Near-infinitely Deep Potential Models", "abstract": "Based on the one-dimensional model with quasi-periodicity and nearly infinite depth potential well, this paper studies how the depth of the potential well and non-Hermiticity affects the unbound states. By extending the Liu-Xia model to a deeper structure, we confirm through calculating IPR and based on Avila's global theory, that although the potential well is deeper, there are still unbound states within specific energy intervals. Extending the research to non-Hermitian systems with gain-loss effects, we find that the non-Hermiticity leads to the existence of unbound states in a mixed state form composed of bound states and unbounded states. However, there are clear energy boundaries between the mixed regions with unbound states and the pure bound state regions, which can be proved by Avila's global theory. Our research results provide new insights into the unbound states in extreme potential fields.", "url": "https://arxiv.org/abs/2604.21281", "type": "理论", "summary": "1. 该工作通过一维准周期近无限深势阱模型，系统研究了势阱深度与非厄米增益-损耗对非束缚态存在性的影响。\n2. 结合参与率分析与Avila全局理论，证实极深势阱中特定能量区间仍存非束缚态，且非厄米性导致束缚-非束缚混合态，但两者间存在清晰能量边界。\n3. 为极端势场中非束缚态的物理机制提供了新见解，可启发相关准周期及非厄米系统的后续理论研究。", "summary_source": "deepseek", "authors": [{"name": "Shujie Cheng"}, {"name": "Tong Liu"}, {"name": "Gao Xianlong"}], "featured_authors": [{"name": "Shujie Cheng"}, {"name": "Tong Liu"}, {"name": "Gao Xianlong"}], "author_count": 3}, {"id": "2604.21341", "category": "cond-mat", "title": "Fractals of Simple Random Walks in Two Dimensions: A Monte Carlo Study", "abstract": "We present a Monte Carlo study of the fractal geometry of clusters formed by discrete-time simple random walks (sRW) of $L^2$ steps on a periodic square $L\\times L$ lattice. We verify with high precision that the asymptotic behavior of the cluster mass follows $M/L^2 \\simeq (\\ln L)^{-1} [\\frac{\\pi}{2}+b (\\ln L)^{-2}]$, with $b\\approx -(\\pi/2)^{-2}$, demonstrating marginal ``logarithmic fractals\". We further determine the fractal dimension of the hull to be $d_{\\rm hull}=1.333\\,29(14)=4/3$, in excellent agreement with the prediction of Schramm-Loewner evolution ($\\rm SLE_{8/3}$) for the Brownian frontier universality class. More importantly, we analyze the chemical distance $S$ spanning the cluster and obtain strong evidence that it asymptotically scales as $S\\sim L(\\ln L)^{1/4}$, lying exactly on the theoretical upper bound for the chemical distance for level-set percolation clusters on the two-dimensional Gaussian free field. Our numerical results show that the sRW cluster exhibits a conformally invariant external frontier and contains highly efficient asymptotically linear connective paths.", "url": "https://arxiv.org/abs/2604.21341", "type": "理论+数值", "summary": "1. 该工作通过蒙特卡洛模拟，精确验证了二维简单随机行走簇的质量渐近行为遵循对数分形标度，并测得外边界分形维数为4/3，与SLE_{8/3}预言一致。\n2. 核心发现是化学距离S~L(ln L)^{1/4}恰好达到高斯自由场水平集渗流簇的理论上界，证明随机行走簇具有共形不变外边界和高效近线性连通路径。\n3. 这揭示了简单随机行走簇与布朗前沿普适类的精确对应，并为理解对数分形几何及与自由场渗流的深层联系提供了新线索。", "summary_source": "deepseek", "authors": [{"name": "Jiang Zhou"}, {"name": "Ziru Deng"}, {"name": "Pengcheng Hou"}], "featured_authors": [{"name": "Jiang Zhou"}, {"name": "Ziru Deng"}, {"name": "Pengcheng Hou"}], "author_count": 3}, {"id": "2604.21353", "category": "cond-mat", "title": "Collective Excitations and Stability of Nonequilibrium Polariton Supersolids", "abstract": "Formation of nonequilibrium counterparts of supersolids, simultaneously characterized with spontaneous superfluid and crystalline order, was recently reported in incoherently pumped polariton condensates. We investigate collective excitation spectra of this phase and explicitly demonstrate the emergence of gapless Nambu-Goldstone modes due to spontaneously broken continuous phase and translation symmetries. For the recent implementation of the polariton nonequilibrium supersolidity in semiconductor metasurfaces [D. Trypogeorgos et al., Nature 639, 337 (2025)], we demonstrate the key role of attractive polariton interactions, mediated by the excitonic reservoir, for stability of the supersolid phase. Performing a thorough numerical investigation, we identify the conditions for existence of the diagonal and off-diagonal long-range order in negative-mass nonequilibrium supersolids.", "url": "https://arxiv.org/abs/2604.21353", "type": "理论+数值", "summary": "1. 该工作研究了非平衡极化激元超固态相中的集体激发谱与稳定性，并阐明了自发破缺连续相位与平移对称性产生的无能隙Nambu-Goldstone模。\n2. 核心卖点在于揭示激子库介导的吸引性极化激元相互作用对超固态稳定性的关键作用，并通过数值分析确定了负质量非平衡超固态下对角与离对角长程序的存在条件。\n3. 这一结果为理解非平衡凝聚体中超固态的实现机制提供了明确指导，并对半导体微腔中相关量子模拟与拓扑物态研究具有启发。", "summary_source": "deepseek", "authors": [{"name": "A. Grudinina"}, {"name": "J. Cao"}, {"name": "A. Kavokin"}, {"name": "N. Voronova"}, {"name": "A. Nalitov"}], "featured_authors": [{"name": "A. Grudinina"}, {"name": "J. Cao"}, {"name": "A. Kavokin"}, {"name": "N. Voronova"}, {"name": "A. Nalitov"}], "author_count": 5}, {"id": "2604.21366", "category": "cond-mat", "title": "Time-Uniform Error Bound for Temporal Coarse Graining in Markovian Open Quantum Systems", "abstract": "Several approximation procedures, such as the full or partial rotating-wave, time-averaging, and geometric-arithmetic approximations, have been proposed to derive Gorini-Kossakowski-Sudarshan-Lindblad (GKSL) generators from the Born-Markov quantum master equation (e.g., the Redfield equation). Establishing rigorous error bounds for these approximations is of fundamental and practical importance. However, existing bounds face two major limitations: they are highly specific to individual methods, and, more critically, they diverge in the long-time limit, ensuring the accuracy of the derived GKSL generator only in short-time regimes. In this Letter, we resolve both issues by deriving a unified, rigorous error bound for a general class of approximation methods -- termed temporal coarse graining -- that encompasses all aforementioned schemes. Crucially, our error bound is time-uniform. This guarantees that GKSL generators obtained via temporal coarse graining remain accurate for arbitrarily long times, provided the dissipation timescale is significantly longer than the bath correlation timescale.", "url": "https://arxiv.org/abs/2604.21366", "type": "理论", "summary": "1. 本文为马尔可夫开放量子系统中涵盖旋转波近似、时间平均等方法的一类时间粗粒化近似导出了统一且严格的误差上界。\n2. 关键卖点在于该误差界具有时间均匀性，确保导出的GKSL生成元在长时间极限下仍保持准确性，前提是耗散时间尺度远大于库关联时间尺度。\n3. 这为验证开放量子系统马尔可夫主方程近似的长期有效性提供了严格数学基础，并对量子信息处理中的耗散工程具有直接指导意义。", "summary_source": "deepseek", "authors": [{"name": "Teruhiro Ikeuchi"}, {"name": "Takashi Mori"}], "featured_authors": [{"name": "Teruhiro Ikeuchi"}, {"name": "Takashi Mori"}], "author_count": 2}, {"id": "2604.21434", "category": "cond-mat", "title": "Decomposing Fractional Quantum Hall Wave Functions via Operator Contraction Multiplication", "abstract": "We develop a general algebraic scheme to decompose fractional quantum Hall (FQH) wave functions based on the operator contraction multiplication. By introducing fermionic and bosonic operators and establishing three fundamental contraction rules, we achieve an exact decomposition of Laughlin states. This approach naturally extends to multi-component systems by factorizing coupled Jastrow factors via resultants and elementary symmetric polynomials, enabling the first complete decomposition of Halperin states. For Halperin ($2,2,1$) state, we explicitly derive its basic expansion, identify root configurations, and reveal intra- and inter-color squeezing operators, thereby uncovering the underlying generalized Pauli principle. Using this method, we compute orbital entanglement spectra for up to $16$ particles with decomposition dimensions exceeding $10^{11}$, obtaining edge excitation sequences that precisely match chiral Luttinger liquid theory. Our framework breaks through the longstanding limitations of Jack polynomials, provides a unified decomposition for both single- and multi-component FQH states, and opens a new avenue for exploring wave functions for more complex FQH states.", "url": "https://arxiv.org/abs/2604.21434", "type": "理论", "summary": "1. 该工作提出了基于算符缩并乘法的代数方案，实现了Laughlin态与多分量Halperin态波函数的精确分解。\n2. 其核心在于建立费米子和玻色子算符的三种基本缩并规则，并通过结式和初等对称多项式分解耦合Jastrow因子，突破了Jack多项式的长期局限。\n3. 该框架为纠缠谱计算提供了高效工具，其揭示的挤压算符与广义泡利原理可推广至更复杂分数量子霍尔态的理论与数值研究。", "summary_source": "deepseek", "authors": [{"name": "Dong-Hao Guan"}, {"name": "Licheng Wang"}, {"name": "Yuan Zhou"}, {"name": "Ai-Lei He"}, {"name": "Yi-Fei Wang"}], "featured_authors": [{"name": "Dong-Hao Guan"}, {"name": "Licheng Wang"}, {"name": "Yuan Zhou"}, {"name": "Ai-Lei He"}, {"name": "Yi-Fei Wang"}], "author_count": 5}, {"id": "2604.21448", "category": "cond-mat", "title": "Continuum granular flow model with restitution-derived viscoelastic damping", "abstract": "This work presents a unified viscoelastic-viscoplastic continuum framework for modeling rate-dependent granular flows across regimes. The formulation incorporates two distinct rate-dependent mechanisms, namely micro-inertia and viscoelastic dissipation, within a single continuum description. A central contribution is an explicit link between the coefficient of restitution and a continuum viscosity, derived from an analysis of wave attenuation in granular assemblies, thereby establishing a direct connection between particle-scale collision physics and macroscopic damping. This relation is introduced while retaining inertia-dependent plastic flow governed by the classical $\\mu(I)$ rheology. The constitutive model is constructed by meticulously partitioning elastic and viscous responses within the model and corresponding stress-update routine, such that viscous dissipation governs wave propagation and collisional processes without altering the plastic flow rule. The framework is implemented within the material point method to simulate transient processes involving large deformations, material separation, and subsequent reconsolidation. A range of numerical examples, including steady, transient, vibrational, and impact-driven flows, demonstrates that the model captures wave propagation, diffusion, and rate-dependent granular behavior within a unified continuum setting.", "url": "https://arxiv.org/abs/2604.21448", "type": "理论+数值", "summary": "1. 该工作构建了一个统一粘弹性-粘塑性的连续介质框架，用于模拟涵盖稳态、瞬态、振动及冲击驱动等不同工况的率相关颗粒流。\n2. 其核心卖点是通过分析颗粒集合中的波衰减，将恢复系数与连续粘度显式关联，从而在保留经典μ(I)流变学塑性流动的同时，建立了粒子尺度碰撞物理与宏观阻尼之间的直接桥梁。\n3. 该模型为理解颗粒材料中波传播、扩散及率依赖行为提供了统一的连续描述，并有望推广至工程中涉及大变形与分离的复杂瞬态过程。", "summary_source": "deepseek", "authors": [{"name": "Bodhinanda Chandra"}, {"name": "Sachith Dunatunga"}, {"name": "Ken Kamrin"}], "featured_authors": [{"name": "Bodhinanda Chandra"}, {"name": "Sachith Dunatunga"}, {"name": "Ken Kamrin"}], "author_count": 3}, {"id": "2604.21494", "category": "cond-mat", "title": "Data-Driven Thermal and Mechanical Modeling of Defective Covalent Organic Frameworks", "abstract": "Covalent Organic Frameworks (COFs) are versatile two-dimensional (2D) materials for flexible electronics, catalysis, and sensing, owing to their tunable architectures and large surface areas. However, like most materials, COFs inevitably contain synthesis-induced defects, which-similar to graphene-can strongly influence intrinsic properties, such as thermal transport and mechanical strength. To address this challenge, we have assessed the performance of a set of machine learning interatomic potentials (MLIP) capable of efficient large-scale simulations of COFs with quantum accuracy. In doing so, QCOF models (Quantum COF) were developed by tuning the state-of-the-art MACE architecture on an extensive dataset of non-equilibrium COF conformations generated from high-fidelity density functional theory calculations. The accuracy, computational efficiency, memory footprint, and transferability to unseen chemical environments of these models were benchmarked against general-purpose MACE models and their fine-tuned variants. Our results show that an invariant QCOF model with a small descriptor dimensionality and cutoff outperforms all other models in most validation tasks, including scalability to large systems, force prediction in defective COFs, and phonon dispersion calculations. The best-performing QCOF model was then used to run large-scale simulations of thermal conductivity for defective CTF-1 and COF-LZU1 systems via non-equilibrium MD, revealing a more pronounced sensitivity of CTF-1 to structural defects. Stress-strain curves were also investigated, showing that the mechanical response remains nearly invariant at low defect densities, while asymmetric behaviour emerges at large strains. This work thus provides a foundation for the design of robust quantum-informed MLIP for large-scale property simulations of defective of extended network materials.", "url": "https://arxiv.org/abs/2604.21494", "type": "理论+数值", "summary": "1. 该工作开发了基于机器学习原子间势的QCOF模型，用于大规模模拟缺陷共价有机框架的热学和力学性质。\n2. 其卖点在于采用小描述符维度与截断的MACE架构，以量子精度超越通用模型，并揭示CTF-1对缺陷的热导敏感性。\n3. 这为设计鲁棒的量子知情机器学习势，进而实现缺陷网络材料的大规模性质模拟提供了基础。", "summary_source": "deepseek", "authors": [{"name": "Aleksander Szewczyk"}, {"name": "Leonardo Medrano Sandonas"}, {"name": "David Bodesheim"}, {"name": "Bohayra Mortazavi"}, {"name": "Gianaurelio Cuniberti"}], "featured_authors": [{"name": "Aleksander Szewczyk"}, {"name": "Leonardo Medrano Sandonas"}, {"name": "David Bodesheim"}, {"name": "Bohayra Mortazavi"}, {"name": "Gianaurelio Cuniberti"}], "author_count": 5}, {"id": "2604.21500", "category": "cond-mat", "title": "Design optimization of flux concentrators for magnetic tunnel junctions-based sensors", "abstract": "Miniaturized, ultra-sensitive and easily integrable magnetometers are needed for many applications, like space exploration or health monitoring. Achieving this goal requires a magnetic sensor with high sensitivity and low noise. High sensitivity (>1000 %/mT) can be obtained by integrating high gain permalloy flux concentrators (FC). And reducing the magnetic 1/f noise can be realized by increasing the number of magnetic tunnel junctions (MTJs) in the air-gap of the FC. However, this is obtained at the expense of a wider air-gap and consequently a decrease of the magnetic gain and thus of the sensitivity. In this paper, we explore a design optimization scheme in order to find the best trade-off between high FC gain and low magnetic noise. To model the gain of the flux concentrator, we propose two complementary approaches; one is based on finite elements simulations of the FC gain where the influence of geometrical parameters of the air-gap is investigated. Then, in a second step, we propose an analytical formula consistent with all our simulations results and based on magnetic reluctance. Finally, we derive an analytical model of the sensor detectivity from which we can extract the optimal sensor design which allows an improvement by three orders of magnitude of the performances compared to a single junction.", "url": "https://arxiv.org/abs/2604.21500", "type": "理论+数值", "summary": "1. 本文通过有限元模拟与磁阻解析模型，优化设计磁性隧道结传感器中坡莫合金磁通聚集器的几何参数，以平衡高磁增益与低噪声需求。\n2. 核心卖点在于建立磁通聚集器增益的解析公式，并导出传感器探测率模型，揭示空气间隙宽度对增益与噪声的权衡机制。\n3. 该优化方案可使传感器性能比单结设计提升三个数量级，为微型高灵敏度磁力计在空间探测与健康监测中的应用提供理论依据。", "summary_source": "deepseek", "authors": [{"name": "Thomas Brun"}, {"name": "Javier Rial"}, {"name": "Lucia Risoli"}, {"name": "Johanna Fischer"}, {"name": "Philippe Sabon"}, {"name": "Guillaume Jannet"}, {"name": "Matthieu Kretzschmar"}, {"name": "Helene Bea"}, {"name": "Claire Baraduc"}], "featured_authors": [{"name": "Thomas Brun"}, {"name": "Javier Rial"}, {"name": "Lucia Risoli"}, {"name": "Matthieu Kretzschmar"}, {"name": "Helene Bea"}, {"name": "Claire Baraduc"}], "author_count": 9}, {"id": "2604.21512", "category": "cond-mat", "title": "How to quantify long-time rotational motion in molecular systems", "abstract": "We show that all existing methods quantifying rotational motion in molecular fluids eventually fail in systems undergoing complex rotational motion characterised by slow, heterogeneous, or intermittent dynamics. This impacts in particular the study of rotational dynamics in molecular supercooled liquids near their glass transition, as well as discussions of the decoupling between rotational and translational motion and violations of the Debye-Stokes-Einstein relation. We present a brief overview of existing methods and explain why none of them can accurately capture the evolution of rotational dynamics from a diffusive fluid to an arrested solid, thus resolving inconsistent literature results. We then introduce an empirical method that efficiently solves all issues. We benchmark our method devising a family of continuous time random walk models for rotational dynamics. Our method correctly quantifies the statistics of free and caged rotational motion, as well as non-Gaussian and non-Fickian rotational dynamics, and should allow a better characterisation of dynamic heterogeneity in the rotational motion of supercooled molecular fluids.", "url": "https://arxiv.org/abs/2604.21512", "type": "理论", "summary": "1. 该工作揭示了现有分子旋转运动量化方法在慢速、异质或间歇动力学系统中的本质失效，并针对过冷液体玻璃转变附近旋转-平动解耦及Debye-Stokes-Einstein关系违反等争议提供了系统解决方案。\n2. 其核心在于提出一个经验方法，通过构建连续时间随机游走旋转模型族进行严格基准测试，能够准确区分自由与笼中旋转运动的统计规律，同时捕捉非高斯及非菲克旋转动力学特征。\n3. 这一方法为定量刻画过冷分子流体旋转动态异质性提供了可靠分析工具，有望澄清已有文献中因方法失效导致的矛盾结果，并深化对玻璃化转变过程的理解。", "summary_source": "deepseek", "authors": [{"name": "Romain Simon"}, {"name": "Hadrien Bobas"}, {"name": "François Villemot"}, {"name": "Jean-Louis Barrat"}, {"name": "Ludovic Berthier"}], "featured_authors": [{"name": "Romain Simon"}, {"name": "Hadrien Bobas"}, {"name": "François Villemot"}, {"name": "Jean-Louis Barrat"}, {"name": "Ludovic Berthier"}], "author_count": 5}, {"id": "2604.21524", "category": "cond-mat", "title": "Symplectic symmetry of quadratic-band-touching Hamiltonians in two dimensions", "abstract": "The internal low-energy symmetry of the massless Lorentz-invariant Dirac Hamiltonian in $2+1$ dimensions is known to be $O(2N)$, where $N$ is the number of two-component Dirac fermions. Here we point out that there exists an analogous internal symmetry of the single-particle quadratic-band-touching Hamiltonian in two spatial dimensions, and it is the unitary symplectic group, $USp(2N)$. All fermionic bilinears belong to one of the three small irreducible representations of this group. The interacting theory that respects the $USp(2N)$ symmetry and the spatial rotations is constructed and found to allow two independent interaction terms. When these interactions are infrared-relevant the symplectic symmetry either remains preserved or becomes spontaneously broken to $USp(N) \\times USp(N)$. The symmetry in the lattices such as honeycomb to infinite order in the dispersion's expansion in powers of local momentum is given by the overlap of the symplectic and the orthogonal groups. We show that this overlap is $O(2N) \\bigcap USp(2N) = U(N)$.", "url": "https://arxiv.org/abs/2604.21524", "type": "理论", "summary": "1. 本文揭示二维二次能带接触单粒子哈密顿量具有幺正辛群USp(2N)的内部对称性，所有费米子双线性均属于该群三个小不可约表示之一。\n2. 其核心在于构建同时尊重USp(2N)对称性与空间旋转的相互作用理论，并指出当红外相关时对称性可保持或自发破缺至USp(N)×USp(N)。\n3. 该工作表明在蜂窝等晶格中对称性由辛群与正交群的重叠O(2N)∩USp(2N)=U(N)支配，为研究相关拓扑物态与量子临界行为提供了对称性理论基础。", "summary_source": "deepseek", "authors": [{"name": "Igor F. Herbut"}, {"name": "Samson C.H. Ling"}], "featured_authors": [{"name": "Igor F. Herbut"}, {"name": "Samson C.H. Ling"}], "author_count": 2}, {"id": "2604.21533", "category": "cond-mat", "title": "Pairing mechanism and superconductivity in 1313 phase La$_3$Ni$_2$O$_7$", "abstract": "Recently, the observation of superconductivity (SC) with $T_c$ $\\approx$ 3.6 K in the pressurized 1313 La$_3$Ni$_2$O$_7$ has attracted considerable interest. Here, we systematically investigate the electronic properties and superconducting mechanism of 1313 La$_3$Ni$_2$O$_7$ using density functional theory plus dynamical mean-field theory (DFT+DMFT) and random phase approximation (RPA). Our DFT+DMFT calculations reveal that the single-layer (SL) subsystem exhibits nearly insulating behavior, with the $d_{z^2}$ orbital showing Mott physics, while the trilayer (TL) subsystem remains metallic. This indicates that SC primarily resides in the TL subsystem, whose Ni-$e_g$ orbitals are found to be hole-doped relative to bulk La$_4$Ni$_3$O$_{10}$. Based on DFT+DMFT-derived low-energy Hamiltonian, RPA-based analysis yields an $s^{\\pm}$-wave pairing symmetry within the TL subsystem. Importantly, we identify two key factors that contribute to the significant suppression of $T_c$ in 1313 La$_3$Ni$_2$O$_7$ compared to bulk La$_4$Ni$_3$O$_{10}$. First, the hole doping in the TL subsystem, as established by DMFT, leads to a decreased pairing strength, as confirmed by RPA calculations -- a trend resembling that in bulk La$_4$Ni$_3$O$_{10}$. Second, the SL subsystem acts as a bridge connecting adjacent superconducting TL subsystems, thereby forming an S-N-S Josephson junction. The resulting interlayer Josephson coupling governs the phase coherence between TL subsystems and further suppresses the global $T_c$. Combinedly, our findings suggest that the high-$T_c$ phase in the RP La$_3$Ni$_2$O$_7$ family should be attributed to the 2222 La$_3$Ni$_2$O$_7$ rather than the 1313 La$_3$Ni$_2$O$_7$.", "url": "https://arxiv.org/abs/2604.21533", "type": "理论+数值", "summary": "1. 该工作利用DFT+DMFT和RPA方法系统研究了高压下1313相La$_3$Ni$_2$O$_7$的电子性质与超导机制。\n2. 发现超导主要存在于三层子系统中，呈现$s^{\\pm}$-波配对对称性，并揭示了空穴掺杂和单层子系统的S-N-S约瑟夫森结耦合是压低$T_c$的两个关键因素。\n3. 这暗示R-P系列La$_3$Ni$_2$O$_7$的高温超导相应归属于2222相而非1313相。", "summary_source": "deepseek", "authors": [{"name": "Cui-Qun Chen"}, {"name": "Ming Zhang"}, {"name": "Fan Yang"}, {"name": "Dao-Xin Yao"}], "featured_authors": [{"name": "Cui-Qun Chen"}, {"name": "Ming Zhang"}, {"name": "Fan Yang"}, {"name": "Dao-Xin Yao"}], "author_count": 4}, {"id": "2604.21553", "category": "cond-mat", "title": "Dean-Kawasaki fluctuating hydrodynamics for backscattering hard rods", "abstract": "We study a system of backscattering hard rods in one dimension. Contrary to the usual ballistic hard rods, these hard rods flip the sign of their velocities with a rate $\\gamma$. This leads to the decay of the odd moments of velocity while preserving the even moments: the number of conserved quantities in the system becomes half. The introduction of the flipping rate, $\\gamma$, is a kind of integrability-breaking perturbation. One expects a change in the transport properties in the system due to the integrability breaking. We show using a Dean-Kawasaki fluctuating hydrodynamic formulation that for $t \\gg 1/\\gamma$, the two-time density density correlation spreads in a diffusive manner, and for $t \\ll 1/\\gamma$, the correlation spreads ballistically.", "url": "https://arxiv.org/abs/2604.21553", "type": "理论", "summary": "1. 该工作利用Dean-Kawasaki涨落流体动力学，研究了一维背散射硬杆系统，其中硬杆以速率γ翻转速度符号，导致守恒量减半。\n2. 其核心在于揭示可积性破坏引起的输运转变：密度-密度关联函数在短时（t≪1/γ）呈弹道传播，长时（t≫1/γ）过渡为扩散行为。\n3. 这为理解弱可积破坏系统中从弹道到扩散的普遍动力学提供了流体动力学框架，并可推广至其他一维非可积模型。", "summary_source": "deepseek", "authors": [{"name": "Mrinal Jyoti Powdel"}], "featured_authors": [{"name": "Mrinal Jyoti Powdel"}], "author_count": 1}, {"id": "2604.21563", "category": "cond-mat", "title": "Dynamical mean-field theory for dense spin systems at finite temperature", "abstract": "In recent years, a method for computing spin dynamics at infinite temperature (spinDMFT) was developed. It utilizes the ideas of dynamical mean-field theory for fermions: single-site approximation and a self-consistency condition to approximate time-dependent spin correlations. In this work, we develop a crucial extension of the method to systems at finite temperature, able to compute imaginary-time correlations and thermodynamical quantities. We benchmark the method by comparison to results in finite-size systems, obtaining very good agreement with correlations in a random-coupling system, good agreement for a ferromagnetic system and large discrepancies in the case of an antiferromagnet. We note the appearance of ferromagnetic order in the method. We discuss possible extensions and potential applications of the approach.", "url": "https://arxiv.org/abs/2604.21563", "type": "理论+数值", "summary": "1. 该工作将适用于无限温度的自旋动力学平均场理论（spinDMFT）扩展到有限温度，使其能够计算虚时关联函数与热力学量。\n2. 其技术核心在于单点近似与自洽条件，并在随机耦合系统、铁磁系统中与有限尺寸结果吻合良好，但反铁磁系统存在较大偏差。\n3. 该方法自发出现铁磁有序，为发展高阶修正和扩展至实际自旋模型的热力学与动力学研究提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Przemysław Bieniek"}, {"name": "Timo Gräßer"}, {"name": "Götz S. Uhrig"}], "featured_authors": [{"name": "Przemysław Bieniek"}, {"name": "Timo Gräßer"}, {"name": "Götz S. Uhrig"}], "author_count": 3}, {"id": "2604.21643", "category": "cond-mat", "title": "Stable Wave-Function Zeros Indicate Exciton Topology", "abstract": "Excitons are bound states of electrons and holes whose band topology arises from an interplay between the topology of the underlying electronic bands and the structure of the electron-hole interaction. In crystalline solids, symmetry representations and topological invariants of the conduction and valence bands constrain the structure of the exciton envelope wave function. In particular, we show that crystalline symmetry can enforce stable zeros in the exciton wave function. These occur at high-symmetry momenta, including the optically accessible total momentum p=0. We work out how the stable zeros constrain both the relative exciton-band topology (the difference of exciton and non-interacting topological invariants) and the relative band topology (the difference of valence and conduction band invariants), all without requiring detailed knowledge of the band structure or interactions. We establish these results for two-band excitons in inversion- and rotation-symmetric systems in one and two dimensions, where the relevant topological invariants are the Berry phase in one dimension and the Chern number (modulo the rotation order) in two dimensions. In two dimensions, the exciton Chern number itself can also be constrained by zero patterns.", "url": "https://arxiv.org/abs/2604.21643", "type": "理论", "summary": "1. 该工作证明晶体对称性可在激子包络波函数中强制稳定零点，并阐明这些零点如何约束相对激子拓扑与相对能带拓扑。\n2. 核心在于稳定零点出现在高对称动量（含p=0），且约束关系无需详细能带或相互作用知识，适用于一维Berry相位与二维Chern数。\n3. 这为通过波函数零点模式诊断激子拓扑提供了对称性驱动的普适框架，可推广至更多维度和相互作用体系。", "summary_source": "deepseek", "authors": [{"name": "Yoonseok Hwang"}, {"name": "Henry Davenport"}, {"name": "Frank Schindler"}], "featured_authors": [{"name": "Yoonseok Hwang"}, {"name": "Henry Davenport"}, {"name": "Frank Schindler"}], "author_count": 3}, {"id": "2604.21660", "category": "cond-mat", "title": "Self-consistent evaluation of the Berry connection for Wannier functions", "abstract": "The Berry connection is a gauge-dependent quantity frequently used to describe the optical response of solids. Its evaluation requires a k-derivative with respect to the cell periodic-part of the Bloch-functions and is commonly calculated in the Wannier basis by using overlap matrices of cell-periodic parts of Bloch-functions at neighboring k-points. So far, all proposed interpolation schemes for the Berry connection do not account for the matrix structure of the overlap matrices explicitly but treat the matrix elements as independent, or only distinguish between diagonal and off-diagonal entries. In this work, we propose a self-consistent interpolation scheme based on the matrix logarithm resulting in a strongly improved accuracy. Furthermore, we discuss how the basis set incompleteness of the bands used in the ab-initio calculation imposes constraints on the accuracy. We quantify the basis incompleteness based on the singular values of the overlap matrices and relate it to the invariant part of the spread functional $\\Omega_\\mathrm{I}$ of the Wannier functions. Numerical calculations for monolayer MoS2 and bulk Si demonstrate that the proposed interpolation scheme is much less sensitive to the Wannierization details and leads to an improved quality of the velocity matrix and the optical conductivity.", "url": "https://arxiv.org/abs/2604.21660", "type": "理论+数值", "summary": "1. 该工作针对固体光响应计算中Berry联络的Wannier插值，提出了基于矩阵对数的自洽方案，首次完整地考虑了重叠矩阵的矩阵结构，而不是像传统方法那样将矩阵元视为独立或仅区分对角与非对角元素。\n2. 其关键创新包括利用矩阵对数实现高精度插值，并通过重叠矩阵奇异值量化第一性原理计算中能带基组的不完备性，将其与Wannier函数扩展泛函Ω_I的不变部分直接关联，从而揭示了插值精度的内在束缚。\n3. 数值算例表明，该方案对单层MoS2和体硅的Wannier化参数具有很强的鲁棒性，显著提高了速度算符和光学电导率的计算精度，为高通量第一性原理光学响应研究提供了更可靠且实用的Wannier插值工具。", "summary_source": "deepseek", "authors": [{"name": "Martin Thümmler"}, {"name": "Alexander Croy"}, {"name": "Thomas Lettau"}, {"name": "Ulf Peschel"}, {"name": "Stefanie Gräfe"}], "featured_authors": [{"name": "Martin Thümmler"}, {"name": "Alexander Croy"}, {"name": "Thomas Lettau"}, {"name": "Ulf Peschel"}, {"name": "Stefanie Gräfe"}], "author_count": 5}, {"id": "2604.21753", "category": "cond-mat", "title": "Neural surrogates for crystal growth dynamics with variable supersaturation: explicit vs. implicit conditioning", "abstract": "Simulations of crystal growth are performed by using Convolutional Recurrent Neural Network surrogate models, trained on a dataset of time sequences computed by numerical integration of Allen-Cahn dynamics including faceting via kinetic anisotropy. Two network architectures are developed to take into account the effects of a variable supersaturation value. The first infers it implicitly by processing an input mini-sequence of a few evolution frames and then returns a consistent continuation of the evolution. The second takes the supersaturation parameter as an explicit input along with a single initial frame and predicts the entire sequence. The two models are systematically tested to establish strengths and weaknesses, comparing the prediction performance for models trained on datasets of different size and, in the first architecture, different lengths of input mini-sequence. The analysis of point-wise and mean absolute errors shows how the explicit parameter conditioning guarantees the best results, reproducing with high-fidelity the ground-truth profiles. Comparable results are achievable by the mini-sequence approach only when using larger training datasets. The trained models show strong conditioning by the supersaturation parameter, consistently reproducing its overall impact on growth rates as well as its local effect on the faceted morphology. Moreover, they are perfectly scalable even on 256 times larger domains and can be successfully extended to more than 10 times longer sequences with limited error accumulation. The analysis highlights the potential and limits of these approaches in view of their general exploitation for crystal growth simulations.", "url": "https://arxiv.org/abs/2604.21753", "type": "理论+数值", "summary": "1. 该工作利用卷积循环神经网络代理模型模拟变过饱和度下晶体生长，并系统比较了显式与隐式条件化两种参数处理架构的预测性能。\n2. 其核心卖点是显式条件化以极高保真度复现过饱和度对生长速率及刻面形貌的全局与局部影响，且模型可扩展至256倍大域并维持超过10倍长时间序列的低误差积累。\n3. 这为面向实际晶体生长模拟的大规模、长时程代理模型应用提供了明确的技术路径与性能边界参考。", "summary_source": "deepseek", "authors": [{"name": "Matteo Rigoni"}, {"name": "Daniele Lanzoni"}, {"name": "Francesco Montalenti"}, {"name": "Roberto Bergamaschini"}], "featured_authors": [{"name": "Matteo Rigoni"}, {"name": "Daniele Lanzoni"}, {"name": "Francesco Montalenti"}, {"name": "Roberto Bergamaschini"}], "author_count": 4}, {"id": "2604.21762", "category": "cond-mat", "title": "Novel dynamics for an inertial polar tracer in an active bath", "abstract": "A polar tracer immersed in an active bath is known to be propelled forward and therefore activated. Here we report that the induced dynamics of an inertial tracer can be much richer than expected. We investigate a heavy polar tracer immersed in a bath of independent active Brownian particles. Using the projection-operator formalism to integrate out the bath, we show that the tracer's reduced dynamics can be mapped to a stochastic Lorenz equation. According to the attractors in the Lorenz equation, the tracer motion is classified into several different dynamical regimes, including active Brownian motion, chiral active Brownian motion, complex chaotic motion, and zigzag active Brownian motion. For certain regimes, we derive analytical expressions for the propulsion speed, the velocity covariance, and the effective diffusion coefficient. Numerical simulations corroborate these theoretical predictions.", "url": "https://arxiv.org/abs/2604.21762", "type": "理论+数值", "summary": "1. 该工作利用投影算符形式将浸入活性浴的惯性极性示踪剂的约化动力学映射到随机Lorenz方程，系统研究了其丰富运动行为。\n2. 其核心发现是示踪剂运动可分类为主动布朗、手性主动布朗、复杂混沌及锯齿主动布朗等多种动力学区域，并给出了推进速度、速度协方差和有效扩散系数的解析表达式。\n3. 这为理解惯性示踪剂在活性环境中的非线性动力学提供了精确依据，并可推广至其他非平衡复杂系统的约化描述与分析。", "summary_source": "deepseek", "authors": [{"name": "Jing-Bo Zeng"}, {"name": "Ji-Hui Pei"}], "featured_authors": [{"name": "Jing-Bo Zeng"}, {"name": "Ji-Hui Pei"}], "author_count": 2}, {"id": "2604.21807", "category": "cond-mat", "title": "Modeling High Entropy Alloys' Mechanical Property through Natural Language-Derived Descriptors", "abstract": "Processing treatments of alloys, despite being influential to alloy properties, are often neglected in machine-learning aided alloy designs due to the difficulties in expressing this information. We investigated the expressiveness of transformer embeddings through synthesized annealing processing treatment text and verified that embeddings could be utilized to reconstruct the processing parameters of alloys effectively with an R2>0.99. We then utilized the vector representations of alloys' processing treatment descriptions as descriptors to model high-entropy alloys' hardness and achieved a 20% improvement in prediction, verifying that natural language-derived descriptors of processing treatment information could be utilized to improve prediction of alloy properties.", "url": "https://arxiv.org/abs/2604.21807", "type": "理论+数值", "summary": "1. 该工作利用变压器嵌入从合金加工处理文本中提取描述符，用于高熵合金硬度预测建模。\n2. 其卖点在于嵌入能高保真重建加工参数（R²>0.99），且作为描述符使预测精度提升20%。\n3. 这为将隐式加工信息有效纳入机器学习合金设计框架提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Li-Cheng Hsiao"}, {"name": "Zi-Kui Liu"}, {"name": "Wesley Reinhart"}], "featured_authors": [{"name": "Li-Cheng Hsiao"}, {"name": "Zi-Kui Liu"}, {"name": "Wesley Reinhart"}], "author_count": 3}, {"id": "2604.21842", "category": "cond-mat", "title": "Critical role of phase-dependent properties in modeling photothermal sintering of LiCoO2 cathodes", "abstract": "Photothermal (photonic) sintering crystallizes as-deposited amorphous LiCoO2 (LCO) cathodes for solid-state thin-film batteries using millisecond, surface-localized heating. However, process design often relies on 1D models with phase-averaged, temperature-independent properties, which can mispredict peak temperatures and thermal damage margins. Here we develop a multiscale, data-driven framework that provides phase- and grain size-resolved thermophysical inputs for stoichiometric LCO. We train an Allegro neural network potential with near-ab initio accuracy, enabling Green-Kubo calculations of thermal conductivity for crystalline and amorphous phases. The low, weakly density-dependent conductivity of amorphous LCO motivates its use as an effective intergranular phase in a thin-interface model that reproduces observed grain-size-dependent thermal transport. Combined with measured wavelength-resolved optical properties in 1D multiphysics simulations, we show amorphous LCO absorbs more strongly and reaches higher peak temperatures than crystalline LCO; thus crystalline, constant-property models systematically overestimate safe operating windows.", "url": "https://arxiv.org/abs/2604.21842", "type": "理论+数值", "summary": "1. 该工作开发了一个多尺度数据驱动框架，为LiCoO2阴极光热烧结提供相和晶粒尺寸分辨的热物性输入。\n2. 通过Allegro神经网络势实现近从头算精度的Green-Kubo热导率计算，揭示了非晶相低且弱密度依赖的热导率，并构建了薄界面模型复现晶粒尺寸效应。\n3. 结果表明，非晶相吸收更强且峰值温度更高，而常物性模型系统性地高估了安全窗口，凸显了相依赖性质对光热烧结精确建模的关键作用。", "summary_source": "deepseek", "authors": [{"name": "Yang Hu"}, {"name": "Benoit Sklénard"}, {"name": "Wouter Vels"}, {"name": "Yaroslav E. Romanyuk"}, {"name": "Vladyslav Turlo"}], "featured_authors": [{"name": "Yang Hu"}, {"name": "Benoit Sklénard"}, {"name": "Wouter Vels"}, {"name": "Yaroslav E. Romanyuk"}, {"name": "Vladyslav Turlo"}], "author_count": 5}, {"id": "2604.21850", "category": "cond-mat", "title": "OptiMat Alloys: A FAIR End-to-End Agent with Living Database for Computational Multi-Principal Alloy Exploration", "abstract": "The FAIR principles have transformed how computational data and workflows are shared in materials research, yet existing repositories can only serve pre-computed entries -- broad coverage is perpetually incomplete and cannot adapt to new questions on demand. To address these challenges, we present OptiMat Alloys, a large language model-powered conversational agent for multi-principal element alloy exploration built on three pillars: a living database that stores every calculation with provenance, low-barrier accessibility through a web interface requiring zero programming expertise, and built-in uncertainty quantification via cross-potential and cross-configuration validation (see demo here this https URL ). Coupling foundational machine learning interatomic potentials covering near-all periodic table of elements with natural-language interaction, OptiMat Alloys enables targeted, on-demand computation guided by the user's domain knowledge-extending FAIR from pre-computed repositories to on-demand knowledge generation and making computational alloy screening accessible to any materials scientist.", "url": "https://arxiv.org/abs/2604.21850", "type": "理论+数值", "summary": "1. 该工作构建了一个基于大型语言模型的多主元合金探索对话代理，集成活数据库、零编程界面和内置不确定性量化。\n2. 其核心在于通过跨势函数与跨构型验证实现按需计算，将FAIR原则从预先计算库扩展至动态知识生成。\n3. 这为计算合金筛选提供了低门槛、可复现的范式，使材料科学家能借助自然语言交互驱动针对性计算。", "summary_source": "deepseek", "authors": [{"name": "Yang Hu"}, {"name": "Vladyslav Turlo"}], "featured_authors": [{"name": "Yang Hu"}, {"name": "Vladyslav Turlo"}], "author_count": 2}, {"id": "2604.21867", "category": "cond-mat", "title": "Extending Hamiltonian-Adaptive Resolution Simulation to Interfaces: An Updated LAMMPS Implementation and Application to Porous Solids", "abstract": "Many natural phenomena involve processes that happen simultaneously at different characteristic length- and timescales. Typically, the region where the process of interest happens is affected by fluctuations in its surroundings. Modeling these systems requires an effective combination of simulation resolutions. The Hamiltonian-Adaptive Resolution Simulation (H-AdResS) method allows to model dual-resolution systems in length- and time-scales compatible with molecular diffusion, by combining atomistic and particle-based coarse graining models in the same simulation box. In this work, a new implementation of H-AdResS is provided in LAMMPS 2023. New features extend the usage to more diverse interaction potentials and simplify the preparation of input files via dedicated lammps input commands, while keeping the efficiency gain of the basis method. The implementation is benchmarked by reproducing water properties from a reference atomistic simulation. Importantly, the new implementation includes changes in compensation routines allowing to simulate systems with fluctuating density. As an example, the method in its new implementation is applied to modeling a porous metal-organic framework and its gas adsorption structure and transport properties. We demonstrate that structural and dynamic properties in the atomistic region of the dual-resolution scheme are unaffected and remain those of the fully atomistic system, while increasing simulation efficiency. This paves the way for using H-AdResS to simulate complex interfaces across applications in energy storage, electrocatalysis, and membrane technologies.", "url": "https://arxiv.org/abs/2604.21867", "type": "理论+数值", "summary": "1. 该工作实现了哈密顿自适应分辨率模拟方法在LAMMPS 2023中的新版本，扩展至界面系统与多孔固体的模拟应用。\n2. 技术关键在于引入支持波动密度环境的补偿例程，并验证了双分辨率方案中原子区域的结构与动力学性质与全原子模拟一致且效率提升。\n3. 这为H-AdResS方法模拟复杂界面系统（如储能、电催化及膜技术）提供了可扩展的计算框架与实现路径。", "summary_source": "deepseek", "authors": [{"name": "Hari Haran Sudhakar"}, {"name": "Alessandra Serva"}, {"name": "Rocio Semino"}], "featured_authors": [{"name": "Hari Haran Sudhakar"}, {"name": "Alessandra Serva"}, {"name": "Rocio Semino"}], "author_count": 3}, {"id": "2604.20880", "category": "hep-th", "title": "Chern-Simons couplings, modular duality, and anomaly cancellation in abelian F-theory", "abstract": "F-theory compactifications with a nontrivial Mordell-Weil group realize abelian gauge symmetry through rational sections, but their consistency is ultimately a statement about the quantum effective action. We show that compactification on a circle makes this statement concrete: the quantized, parity-odd Chern-Simons couplings of the resulting three-dimensional theory provide a one-loop exact and scheme-independent encoding of all local four-dimensional abelian anomalies, including the mixed gauge-gravitational terms, together with their Green-Schwarz cancellation. We determine these Chern-Simons couplings in two logically independent ways, first from flux-induced terms in the M-theory dual description, and second from an explicit one-loop integration over the complete massive spectrum, including Kaluza-Klein towers and Coulomb-branch states. The agreement fixes all normalizations and clarifies how large gauge transformations reorganize the spectrum. We then show compatibility with type IIB modular duality once the known ten-dimensional duality counterterm is included, and we present a fully explicit rank-two example over projective three-space.", "url": "https://arxiv.org/abs/2604.20880", "type": "理论", "summary": "1. 该工作通过圆紧化将四维F理论中所有局域阿贝尔反常（包括混合规范-引力项）编码为三维理论中精确至单圈的奇宇称Chern-Simons耦合，并实现了Green-Schwarz消去机制。\n2. 其技术核心在于从M理论对偶通量诱导项与对完整大质量谱（含Kaluza-Klein塔和库仑支态）的显式单圈积分两条独立路径确定这些耦合，二者一致固定了所有归一化，并阐明大规范变换对谱的重整。\n3. 这为弦论中反常消去与模对偶性的自洽性提供了具体构造，与IIB型对偶兼容，并在三维射影空间上给出秩二示例，启发在非微扰框架内统一处理有效场论与量子引力约束。", "summary_source": "deepseek", "authors": [{"name": "Mir Faizal"}, {"name": "Arshid Shabir"}], "featured_authors": [{"name": "Mir Faizal"}, {"name": "Arshid Shabir"}], "author_count": 2}, {"id": "2604.20954", "category": "hep-th", "title": "SubTropica", "abstract": "We present SubTropica, a Mathematica package that performs symbolic integration of multi-polylogarithmic integrals using recent advances in tropical geometry. It focuses on the class of linearly-reducible Euler integrals, such as Feynman integrals, and expands them using a tropical subtraction scheme. The engine behind it is HyperIntica, a native Mathematica package for hyperlogarithm integration that can be used independently. This paper documents both packages and illustrates their usage on examples from across different physics applications. Additionally, we introduce an AI-driven library of Feynman integrals, which catalogs diagrams discussed in the literature and serves as a database for computed results. Its online version is available at: this https URL and features a graphical user interface for diagram input and retrieval of records.", "url": "https://arxiv.org/abs/2604.20954", "type": "理论", "summary": "1. 该工作介绍了SubTropica与HyperIntica两个Mathematica包，分别基于热带几何与超对数积分实现多对数型Feynman积分的符号展开与计算。\n2. 其核心卖点在于采用热带减法方案处理线性可约Euler积分，并配套构建了含图形界面的AI驱动费曼积分数据库。\n3. 这为高圈费曼积分的高效符号计算与结果复用提供了系统化工具，可推广至更多量子场论可积结构。", "summary_source": "deepseek", "authors": [{"name": "Mathieu Giroux"}, {"name": "Sebastian Mizera"}, {"name": "Giulio Salvatori"}], "featured_authors": [{"name": "Mathieu Giroux"}, {"name": "Sebastian Mizera"}, {"name": "Giulio Salvatori"}], "author_count": 3}, {"id": "2604.20959", "category": "hep-th", "title": "Twisted traces and quantization of moduli stacks of 3d $\\mathcal{N}=4$ Chern-Simons-matter theories", "abstract": "We conjecture, and show in a plethora of examples, that the sphere partition function of 3d $\\mathcal{N}=4$ Chern-Simons-matter theories equals a sum of twisted traces on tensor products of Verma modules over the quantization of the moduli spaces of vacua. This extends a conjecture of Gaiotto-Okazaki to Chern-Simons-matter theories. We also show that the partition function of every Abelian gauge theory with higher charges has such twisted trace decomposition, and uncover new Abelian dualities between theories with and without Chern-Simons couplings.", "url": "https://arxiv.org/abs/2604.20959", "type": "理论", "summary": "1. 该工作提出并举例验证了3d N=4 Chern-Simons-matter理论的球面配分函数等于真空模空间量子化上Verma模张量积的扭曲迹之和，推广了Gaiotto-Okazaki猜想。\n2. 其技术核心在于对所有高荷阿贝尔规范理论实现了该扭曲迹分解，并据此揭示了有无Chern-Simons耦合理论间的新阿贝尔对偶性。\n3. 这为系统构造Chern-Simons-matter理论的非微扰配分函数提供了代数框架，并启发了更广泛的量子化模空间上的迹恒等式。", "summary_source": "deepseek", "authors": [{"name": "Leonardo Santilli"}], "featured_authors": [{"name": "Leonardo Santilli"}], "author_count": 1}, {"id": "2604.21004", "category": "hep-th", "title": "Invariant Path-Integral Quantization and Anomaly Cancellation", "abstract": "We present an invariant relational path-integral quantization framework for general-relativistic gauge field theories based on the Dressing Field Method. The construction implements an automatic anomaly-cancellation mechanism that encompasses Bardeen-Wess-Zumino counterterms. The resulting framework unifies invariant schemes across contexts ranging from electroweak theory to cosmology, and is amenable to lattice implementations, key to high-precision tests in both domains.", "url": "https://arxiv.org/abs/2604.21004", "type": "理论", "summary": "1. 该工作基于Dressing场方法，为广义相对论性规范场论建立了不变关系路径积分量子化框架。\n2. 其核心卖点在于框架内嵌自动反常抵消机制，自然包含Bardeen-Wess-Zumino抵消项，实现了跨理论的不变性统一。\n3. 这为从电弱理论到宇宙学的高精度格点计算提供了系统且自洽的量子化方案。", "summary_source": "deepseek", "authors": [{"name": "J. François"}, {"name": "L. Ravera"}], "featured_authors": [{"name": "J. François"}, {"name": "L. Ravera"}], "author_count": 2}, {"id": "2604.21014", "category": "hep-th", "title": "3D near-de Sitter gravity and the soft mode of DSSYK", "abstract": "We present a dual gravity interpretation of the complex reparametrization mode $\\psi(u)$ that governs the soft dynamics of double-scaled SYK in the presence of a time-dependent Maldacena-Qi coupling. We find that the dual gravity system takes the form of 2+1-dimensional Einstein-de Sitter gravity with an energy distribution localized on a dS$_2$ slice within dS$_3$. The effective SYK equations of motion take the form of the Israel junction conditions across the dS$_2$ slice. We study the 1D effective action of the SYK soft mode and show that it coincides with the effective action derived from 3D Einstein-de Sitter gravity with conformal boundary conditions on $\\mathscr{I}^\\pm$. The boundary conditions split $\\mathscr{I}^\\pm$ into two hyperbolic $k=-1$ slices, and the holographic screen is placed at the intersection. We adapt the Gibbons-Hawking calculation of the Schwarzschild-de Sitter entropy to the case with $k=-1$ boundary conditions and find that it reproduces the semiclassical DSSYK entropy. The boundary-to-boundary Green functions in 3D de Sitter are equal to the square of DSSYK two-point functions. We give an alternative holographic interpretation of our results in terms of 3D AdS gravity with two time directions.", "url": "https://arxiv.org/abs/2604.21014", "type": "理论", "summary": "1. 该工作建立了双标度SYK模型中软模ψ(u)与3维爱因斯坦-德西特引力的对偶对应，引力系统表现为dS3内局域化于dS2切片上的能量分布。\n2. 关键卖点在于将有效SYK运动方程映射为以色列连接条件，并证明软模一维有效作用量等价于带共形边界条件的3维德西特引力作用量，边界分裂为双曲切片。\n3. 这为德西特空间全息原理提供了新理解，其熵与格林函数计算精确再现了半经典DSSYK结果，并启示了含两时间方向的AdS引力解释。", "summary_source": "deepseek", "authors": [{"name": "Tommaso Marini"}, {"name": "Xiao-Liang Qi"}, {"name": "Herman Verlinde"}], "featured_authors": [{"name": "Tommaso Marini"}, {"name": "Xiao-Liang Qi"}, {"name": "Herman Verlinde"}], "author_count": 3}, {"id": "2604.21015", "category": "hep-th", "title": "Form factors of $\\mathscr{N}=4$ self-dual Yang-Mills from the chiral algebra bootstrap", "abstract": "The chiral algebra bootstrap (CAB) is a novel bootstrap program for form factors in quantum-integrable self-dual gauge theories, some of which in turn are helicity amplitudes in the corresponding gauge theories. The singularities that recursively generate a given (loop-level) form factor are holomorphic collinear splitting functions, equivalently celestial chiral algebra OPEs, of the self-dual theory. In this note, we apply the chiral algebra bootstrap to the simple example of self-dual 4d $\\mathscr{N}=4$ super Yang-Mills (SDSYM). We use a combination of twistor space input, Koszul duality, supersymmetry, and associativity to obtain the all-loop holomorphic collinear splitting functions for SDSYM. We also use associativity to provide a simple proof of the conjecture that there are no double-poles in the loop-level OPEs for this theory. We conclude by computing several form factors, including both a reproduction of several known results and novel form factors up to two loops involving insertions of powers of the anti-self-dual field strength. These form factors compute a supersymmetric version of Higgs amplitudes in the self-dual sector. Detailed sample computations are provided to familiarize the reader with the CAB method.", "url": "https://arxiv.org/abs/2604.21015", "type": "理论", "summary": "1. 本文采用手性代数自举方法研究四维自对偶N=4超杨-米尔斯理论，通过综合运用扭量空间、Koszul对偶、超对称性和结合性约束，系统推导出适用于全圈阶的全纯共线分裂函数，并利用结合性严格证明该理论中圈级算子积展开不存在双极点结构。\n2. 基于这些分裂函数递归构建了多个形状因子至两圈阶，既复现了若干已知结果，也获得了包含任意幂次反自对偶场强插入的新形状因子，它们对应自对偶扇形区中超对称希格斯振幅的具体计算。\n3. 该工作不仅为自对偶规范理论的形状因子提供了高效代数计算方案，而且其结合性论证对一般超共形场论算子积展开的奇点结构分析具有潜在借鉴意义。", "summary_source": "deepseek", "authors": [{"name": "Jaazib Charanya"}, {"name": "Anthony Morales"}, {"name": "Natalie M. Paquette"}], "featured_authors": [{"name": "Jaazib Charanya"}, {"name": "Anthony Morales"}, {"name": "Natalie M. Paquette"}], "author_count": 3}, {"id": "2604.21408", "category": "hep-th", "title": "Holographic complexity of conformal fields in global de Sitter spacetime", "abstract": "We compute the holographic complexity of conformal quantum fields in rigid global de Sitter spacetime (dS$_{d}$) using the volume and action prescriptions. First we consider AdS$_{d+1}$ spacetime in global dS$_{d}$ foliations, and compute the complexity of the CFT supported on the global dS$_{d}$ conformal boundary. Next, we consider CFT supported on a global dS$_d$ (UV) brane embedded in AdS$_{d+1}$ spacetime, and compute the holographic complexity in this brane set up. We compare and contrast the results in the two cases, as well as with related results in the literature obtained in alternative holographic set ups involving patches of de Sitter spacetime covered by static coordinates or conformal (Poincaré) coordinates.", "url": "https://arxiv.org/abs/2604.21408", "type": "理论", "summary": "1. 该工作利用体积与作用量方案，计算了全局de Sitter时空中共形场在AdS叶状结构边界及嵌入膜上的全息复杂度。\n2. 其卖点在于完整处理全局dS几何而非仅局部坐标补丁，并系统比较了两种全息设置及不同方案的结果差异。\n3. 这为理解de Sitter时空量子场论的复杂性与全息宇宙学对偶提供了定量基准，启发后续研究复杂度的时间演化与奇异行为。", "summary_source": "deepseek", "authors": [{"name": "Sanhita Parihar"}, {"name": "Shubho R. Roy"}], "featured_authors": [{"name": "Sanhita Parihar"}, {"name": "Shubho R. Roy"}], "author_count": 2}, {"id": "2604.21447", "category": "hep-th", "title": "$O(d,d)$ symmetric gravity and finite coupling holography", "abstract": "We construct asymptotically AdS$_5$ black brane solutions in a theory of gravity with an infinite series of curvature corrections. The action is based on an $O(d,d)$ symmetric ansatz which has been argued to describe the classical NSNS sector of string theories. We find that, for this general class of theories, the singularity behind the horizon is not resolved by the curvature corrections. The approach to the singularity is however generically modified, being characterized by different Kasner exponents. We also show that, in the presence of a non-trivial dilaton, a slight generalization of these types of curvature corrections can generate dynamically a negative cosmological constant in the region of small coupling. This provides a mechanism through which asymptotic freedom could emerge in the hypothetical string dual of QCD.", "url": "https://arxiv.org/abs/2604.21447", "type": "理论", "summary": "1. 本文在基于O(d,d)对称ansatz的引力理论中构建了含无穷级数曲率修正的渐近AdS₅黑膜解。\n2. 曲率修正不能解除视界后奇点，但改变逼近奇点的Kasner指数；非平凡膨胀子下能动态生成小耦合区的负宇宙常数。\n3. 这为在QCD弦对偶中通过曲率修正实现渐近自由提供了机制性启发，并延伸至有限耦合全息理论。", "summary_source": "deepseek", "authors": [{"name": "Umut Gürsoy"}, {"name": "Pedro Vicente Marto"}, {"name": "Edwan Préau"}], "featured_authors": [{"name": "Umut Gürsoy"}, {"name": "Pedro Vicente Marto"}, {"name": "Edwan Préau"}], "author_count": 3}, {"id": "2604.21535", "category": "hep-th", "title": "Fermion Condensate Inflation, Dynamical Waterfall Mechanism and Primordial Black Holes", "abstract": "Fermion condensate inflation, where inflation emerges from four-fermion interactions induced by spacetime torsion, removes the need for additional scalar fields beyond the Standard Model. In this framework, the fermion field can be decomposed into two distinguished sectors, each giving rise to bound states. After integrating out fermions, the bound fields play the roles of the inflaton and the auxiliary fields, resembling hybrid inflation with a waterfall mechanism. The inclusion of an axial chemical potential naturally introduces a mechanism to end inflation and trigger instant preheating. During the waterfall phase, the effective potential of the fermion condensate supports the formation of non-topological solitons such as Q-balls, which act as seeds of primordial black holes. This model is intrinsically connected to Chern-Simons gravity, which implies a parity-violating universe. Consequently, both the primordial black hole (PBH) dark-matter abundance and parity-violation signatures could provide observational tests of the model.", "url": "https://arxiv.org/abs/2604.21535", "type": "理论", "summary": "1. 本文提出由时空挠率诱导四费米子相互作用的费米子凝聚暴涨模型，无需引入标准模型外的标量场。\n2. 其技术卖点在于通过轴化学势实现暴涨终止与瞬时预加热，并在水落相形成Q球等非拓扑孤子作为原初黑洞种子，同时模型内禀地关联Chern-Simons引力导致宇称破缺。\n3. 这为通过原初黑洞暗物质丰度及宇称破缺信号观测检验暴涨模型提供了具体可实现的途径。", "summary_source": "deepseek", "authors": [{"name": "Stephon Alexander"}, {"name": "Pisin Chen"}, {"name": "Jinglong Liu"}, {"name": "Antonino Marciano"}, {"name": "Misao Sasaki"}, {"name": "Xuan-Lin Su"}], "featured_authors": [{"name": "Stephon Alexander"}, {"name": "Pisin Chen"}, {"name": "Jinglong Liu"}, {"name": "Antonino Marciano"}, {"name": "Misao Sasaki"}, {"name": "Xuan-Lin Su"}], "author_count": 6}, {"id": "2604.21736", "category": "hep-th", "title": "IR behaviour of one-loop complex $\\mathbb{R}\\times S^3$ saddles", "abstract": "Gravitational path-integral over $\\mathbb{R}\\times S^3$ complex metrics with fluctuations is studied in 4D for Einstein-Hilbert gravity in Lorentzian signature, with the aim to investigate the IR properties of complex saddles for various boundary choices. General covariance doesn't allow arbitrary boundary choices for the background and fluctuations. In the ADM-decomposition, while imposing ``no-boundary'' condition at the initial boundary, two scenarios are considered for the final boundary: Dirichlet and fixed extrinsic curvature. Universe undergoes transition from a Euclidean to Lorentzian phase in either scenario, where the dominant saddle in Euclidean phase correspond to a Euclidean metric (imaginary time), while the Lorentzian phase has two complex metrics as dominant saddles which superimpose. One-loop corrected lapse action is computed using Hurwitz-Zeta regularization. UV-divergences canceled by suitable counter terms lead to a renormalized lapse action. One-loop renormalized Hartle-Hawking wave-function is computed using the Picard-Lefschetz and WKB methods, where the contributions coming from the metric-fluctuations show secularly growing infrared divergences as the Universe expands. This is compared with the situation in pure Lorentzian dS, corresponding to a Universe transitioning from an initial state of vanishing conjugate momenta to final state of fixed extrinsic curvature, thereby giving real saddles. Picard-Lefschetz methods alone are not sufficient to overcome the technical hurdles in the one-loop computation, which needs to be supplemented by an $i\\epsilon$-prescription, achieved via slight complexification of the cosmological constant $\\Lambda$. The UV renormalized one-loop dS wavefunction has the same leading IR divergence as for the Hartle-Hawking no-boundary Universe. Interestingly for all boundary choices considered, the saddles remain KSW-allowed.", "url": "https://arxiv.org/abs/2604.21736", "type": "理论", "summary": "1. 本文计算了四维洛伦兹爱因斯坦-希尔伯特引力中带有涨落的R×S³复度规路径积分，分析了Dirichlet与固定外曲率两种边界下一环修正鞍点的红外性质。\n2. 主要卖点是通过Hurwitz-Zeta正规化与iϵ规范（轻微复化宇宙常数）相结合，发现度规涨落贡献出现随宇宙膨胀而增长的世俗红外发散，且与纯dS宇宙的波函数具有相同主导红外发散。\n3. 该结果表明所有边界选择下的鞍点均保持KSW允许性，为理解无边界宇宙与dS宇宙学波函数的红外行为及量子宇宙学边界条件提供了统一视角。", "summary_source": "deepseek", "authors": [{"name": "Shubhashis Mallik"}, {"name": "Gaurav Narain"}], "featured_authors": [{"name": "Shubhashis Mallik"}, {"name": "Gaurav Narain"}], "author_count": 2}, {"id": "2604.21823", "category": "hep-th", "title": "Unitary Time Evolution and Vacuum for a Quantum Stable Ghost", "abstract": "We quantize a classically stable system of a harmonic oscillator polynomially coupled to a ghost with negative kinetic energy. We prove that due to an integral of motion with a positive discrete spectrum: i) the Hamiltonian has a pure point spectrum unbounded in both directions, ii) the evolution is manifestly unitary, iii) the vacuum is well-defined, iv) expectation values for squares of canonical variables are bounded. Numerical solutions of the Schrödinger equation confirm these results. We argue that the discrete spectrum of the integral of motion enforces stability for extended interactions.", "url": "https://arxiv.org/abs/2604.21823", "type": "理论", "summary": "1. 该工作量子化了一个经典稳定的鬼场-正能振荡器多项式耦合系统，证明了哈密顿量具有双向无界纯点谱。\n2. 其核心在于利用一个具有正离散谱的运动积分，同时确保了幺正演化、真空可定义及正则变量平方期望值有界。\n3. 这启示离散谱运动积分可强制鬼场系统在扩展相互作用下的量子稳定性，为负动能场探究提供了严谨框架。", "summary_source": "deepseek", "authors": [{"name": "Cédric Deffayet"}, {"name": "Atabak Fathe Jalali"}, {"name": "Aaron Held"}, {"name": "Shinji Mukohyama"}, {"name": "Alexander Vikman"}], "featured_authors": [{"name": "Cédric Deffayet"}, {"name": "Atabak Fathe Jalali"}, {"name": "Aaron Held"}, {"name": "Shinji Mukohyama"}, {"name": "Alexander Vikman"}], "author_count": 5}, {"id": "2604.21826", "category": "hep-th", "title": "Quantum mechanics with a ghost: Counterexamples to spectral denseness", "abstract": "We quantise integrable point-particle systems with opposite-sign kinetic terms and nontrivial interactions. Using methods from separability theory, we show that previously determined classical stability conditions also imply discrete separated eigenvalue spectra. The resulting energy spectrum is unbounded above and below but not necessarily dense. We establish sufficient conditions for (i) exactly one accumulation point, or (ii) none at all. This dispels the widespread notion that ghostly quantum systems must have a continuous or dense energy spectrum.", "url": "https://arxiv.org/abs/2604.21826", "type": "理论", "summary": "1. 该工作对含相反符号动能项（鬼场）的可积点粒子系统进行了量子化，并分析了其能谱结构。\n2. 利用可分离性理论，证明经典稳定性条件即可导出离散
