分离的能谱，并建立了仅有一个聚点或无聚点的充分条件。\n3. 这一结果否定了鬼量子系统能谱必然连续或稠密的普遍认知，为相关理论模型的正确性提供了重要约束。", "summary_source": "deepseek", "authors": [{"name": "Cédric Deffayet"}, {"name": "Atabak Fathe Jalali"}, {"name": "Aaron Held"}, {"name": "Shinji Mukohyama"}, {"name": "Alexander Vikman"}], "featured_authors": [{"name": "Cédric Deffayet"}, {"name": "Atabak Fathe Jalali"}, {"name": "Aaron Held"}, {"name": "Shinji Mukohyama"}, {"name": "Alexander Vikman"}], "author_count": 5}, {"id": "2604.21835", "category": "hep-th", "title": "High-energy photon hologram of a photon gas", "abstract": "The photon hologram of a one-particle density matrix of a photon gas is derived including the case where the energy of a probe photon is above the electron-positron pair creation threshold. The explicit expressions for the holograms of a photon gas with one-particle density matrix in the form of a single Gaussian and of coherent and incoherent lattices of Gaussians are obtained. The conditions for resonant cones of coherent scattering by coherent and incoherent lattices are found. These conditions turn out to be different. The explicit expression for the dielectric susceptibility tensor of a photon gas and of a single photon prepared in arbitrary quantum states are derived on the probe photon mass-shell. It is established that a photon gas and a single photon behave in coherent photon scattering as a medium with linear and circular birefringences that is transparent below the electron-positron creation threshold and is absorbing otherwise. It is shown that, for the probe photon energies of order $1$ GeV and higher, the energies of target photons of order $1$ eV and higher, and the photon gas density such that the classical intensity parameter is of order unity, the hologram of the photon gas can be measured with existing experimental facilities.", "url": "https://arxiv.org/abs/2604.21835", "type": "理论", "summary": "1. 该工作推导了光子气体单粒子密度矩阵的高能光子全息图，涵盖探针光子能量超越电子-正电子对产生阈值的情形。\n2. 其卖点在于给出高斯型及相干/非相干晶格光子气的全息显式表达式，并发现共振散射锥条件存在差异，揭示了光子气在阈值处由透明到吸收的转变。\n3. 这为在现有实验设施下测量GeV级探针光子与eV级靶光子耦合、经典强度参数量级为1的光子气体全息图提供了可行性依据。", "summary_source": "deepseek", "authors": [{"name": "P.O. Kazinski"}, {"name": "A.A. Sokolov"}], "featured_authors": [{"name": "P.O. Kazinski"}, {"name": "A.A. Sokolov"}], "author_count": 2}, {"id": "2604.21086", "category": "math-ph", "title": "A Nearest-Neighbor Hard-Core Model on a Penrose Graph", "abstract": "We prove that the maximal graph-density of an independent set in a Penrose P3 tiling considered as a planar non-directed graph is equal to $(57 - 25 \\sqrt{5})/2 \\approx 0.54915$ despite the fact that the graph is bipartite. Accordingly, the extreme Gibbs measure of the nearest-neighbor hard core particle model on this graph is unique for sufficiently large values of the particle activity. This invalidates a natural expectation to observe the coexistence of even and odd phases.", "url": "https://arxiv.org/abs/2604.21086", "type": "理论", "summary": "1. 该工作严格求解了Penrose P3铺砌图上最近邻硬核模型独立集的最大图密度为(57-25√5)/2≈0.54915，并证明了极端Gibbs测度在粒子活性足够大时唯一。\n2. 其关键物理突破在于揭示了该二分图因非周期长程关联而破除偶奇相位共存的自然预期，密度值非半整数且测度唯一。\n3. 这为准晶格点上统计力学模型提供了严格范例，启发对非周期系统对称性破缺与相共存机制的重新审视。", "summary_source": "deepseek", "authors": [{"name": "A. Mazel"}, {"name": "I. Stuhl"}, {"name": "Y. Suhov"}], "featured_authors": [{"name": "A. Mazel"}, {"name": "I. Stuhl"}, {"name": "Y. Suhov"}], "author_count": 3}, {"id": "2604.21250", "category": "math-ph", "title": "How it cools? Studying the heat flow out of a semi-infinite slab in welding: An analytical approach", "abstract": "Additive manufacturing and welding processes are highly sensitive to heat dissipation, where improper thermal management leads to residual stresses, distortions, and cracking. Existing heat transfer models, such as Rosenthal's solutions, fail to handle finite 3D geometries, cooling effects, or transient behavior, limiting their accuracy. We overcome these limitations by developing an analytical framework that incorporates cooling boundary conditions mimicking Newton's Law of Cooling. Using two different and proven-equivalent approaches, Laplace transform and Fourier series, we derive closed-form solutions for transient and steady-state temperature profiles under various heat sources, including Gaussian, ellipsoidal, double-ellipsoidal, and time-dependent on/off switch sources. We compare our analytical solutions to numerical implementations, demonstrating strong agreement while providing deeper physical insight. This approach significantly reduces computational cost and experimental requirements, making it a scalable tool for optimizing thermal predictions and mitigating residual stresses in metal-based manufacturing. Additionally, our framework enables the generation of synthetic datasets for machine learning models to predict heat distribution efficiently.", "url": "https://arxiv.org/abs/2604.21250", "type": "理论", "summary": "1. 该工作发展了一个解析框架，通过引入牛顿冷却定律的边界条件，研究焊接中半无限大平板的热流问题。\n2. 技术核心在于运用拉普拉斯变换与傅里叶级数两种等价方法，导出高斯、椭球及时间开关型热源下的瞬态与稳态温度分布闭式解，并与数值结果高度吻合。\n3. 该解析方案大幅降低了计算开销，可直接用于优化金属制造中的热管理与残余应力预测，并为机器学习模型生成高质量合成数据集。", "summary_source": "deepseek", "authors": [{"name": "Fawzi Aly"}, {"name": "Alex Kitt"}, {"name": "Luke Mohr"}], "featured_authors": [{"name": "Fawzi Aly"}, {"name": "Alex Kitt"}, {"name": "Luke Mohr"}], "author_count": 3}, {"id": "2604.21267", "category": "math-ph", "title": "On invariant solutions of linear time-fractional diffusion-wave equations with variable coefficients", "abstract": "We study invariant solutions of a certain class of time-fractional diffusion-wave equations with variable coefficients via Lie symmetry analysis. In physics, the fractional diffusion equation describes transport dynamics that are governed by anomalous diffusion while the fractional wave equation describes oscillations and wave propagation in various physical systems. In order to obtain exact invariant solutions of these equations, we firstly determine infinitesimal symmetries with respect to the variable coefficients of the equations. With the help of these symmetries, we then find solutions in terms of Mittag-Leffler functions, generalized Wright functions and Fox H-functions.", "url": "https://arxiv.org/abs/2604.21267", "type": "理论", "summary": "1. 该项工作运用李对称分析方法，针对含变系数的线性时间分数阶扩散与波动方程，系统研究了其不变解，此类方程在描述反常扩散和波传播等非局域动力学现象中具有重要物理背景。\n2. 其技术要点在于根据方程中变系数的具体类型确定无穷小对称生成元，并利用这些对称性，构造出以Mittag-Leffler函数、广义Wright函数及Fox H函数为核心的精确解析解。\n3. 这一研究成果为分数阶偏微分方程在非局域动力学中的精确求解提供了基于对称性的系统方法，并有望推动变系数分数阶模型在物理及工程中的进一步应用。", "summary_source": "deepseek", "authors": [{"name": "Sodbaatar Adiya"}, {"name": "Khongorzul Dorjgotov"}, {"name": "Bayarmagnai Gombodorj"}, {"name": "Hiroyuki Ochiai"}, {"name": "Uuganbayar Zunderiya"}], "featured_authors": [{"name": "Sodbaatar Adiya"}, {"name": "Khongorzul Dorjgotov"}, {"name": "Bayarmagnai Gombodorj"}, {"name": "Hiroyuki Ochiai"}, {"name": "Uuganbayar Zunderiya"}], "author_count": 5}, {"id": "2604.21373", "category": "math-ph", "title": "The Geometry Underlying the Quantum Harmonic Oscillator", "abstract": "We consider two-dimensional harmonic oscillator in the complex Bargmann-Fock-Segal representation with $T^*{\\mathbb R}^{2}={\\mathbb C}^2$ as classical phase space. We show that the eigenfunctions $\\psi_n$ of the quantum Hamiltonian correspond to complex radial coordinates in the reduced phase space ${\\mathbb C}^2/{\\mathbb Z}_n\\subset{\\mathbb C}^2$. They describe ${\\mathbb Z}_n$-invariant motion of particle along a circle $S^1$ in lens space $S^3/{\\mathbb Z}_n\\subset{\\mathbb C}^2/{\\mathbb Z}_n$, where ${\\mathbb Z}_n$ is the cyclic group of rotation by an angle $2\\pi/n$ on the circle $S^1$, $n=1,2,...\\,$. Thus the general solution of the Schrödinger equation carries information about an infinite number of admissible classical states $\\psi_n$ that can be mapped to other states after lifting into the quantum bundle. We show that in the Kepler/hydrogen atom problem there is a similar correspondence between classical and quantum states.", "url": "https://arxiv.org/abs/2604.21373", "type": "理论", "summary": "1. 该工作揭示了二维量子谐振子在复Bargmann-Fock-Segal表示中本征函数与经典相空间几何结构的对应关系。\n2. 其关键发现是本征函数对应简化相空间C^2/Z_n中的复径向坐标，描述了透镜空间S^3/Z_n中粒子沿S^1的Z_n不变圆周运动。\n3. 这一几何框架与开普勒/氢原子问题中的经典-量子态对应类似，为理解量子系统相空间几何结构的普适性提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Alexander D. Popov"}], "featured_authors": [{"name": "Alexander D. Popov"}], "author_count": 1}, {"id": "2604.21547", "category": "math-ph", "title": "Yang-Baxter Integrability and Exceptional-Point Structure in Pseudo-Hermitian Quantum Impurity Systems", "abstract": "We develop a mathematically controlled framework for Yang--Baxter integrability in pseudo-Hermitian quantum impurity systems arising from periodic driving of a Dirac-like bath. The effective impurity Hamiltonian possesses a dynamically generated $\\PT$ symmetry and exhibits exceptional points (EPs) where it becomes non-diagonalizable. We construct a Lax operator based on a rank-one biorthogonal projector associated with the impurity contact sector and prove that it satisfies an RLL relation within a projector algebra, leading to an $\\etamet$-modified RTT structure and a commuting family of transfer matrices. The associated rational projector-type $R$-matrix satisfies the Yang--Baxter equation in the $\\PT$-unbroken phase and extends continuously to the EP through a regularization of the biorthogonal projector. Within this framework we derive biorthogonal Bethe equations and show that the Gaudin matrix becomes defective at the EP, motivating the diagnostic $\\mathcal{R}=\\kappa(G)\\,|\\det G|$ that sharply separates EP singularities from Kondo criticality. We further prove that Bethe rapidities exhibit square-root coalescence and $\\mathbb{Z}_2$ monodromy at the EP, reflecting the underlying Jordan structure, and that the effective pseudo-Hermitian Hamiltonian emerges from the periodically driven microscopic system with controlled operator-norm error $\\mathcal{O}(1/\\Omega)$ via the Floquet--Magnus expansion.", "url": "https://arxiv.org/abs/2604.21547", "type": "理论", "summary": "1. 该工作为周期性驱动狄拉克浴产生的伪厄米量子杂质系统建立了杨-巴克斯特可积性的严格数学框架。\n2. 核心卖点在于构造基于一阶双正交投影子的Lax算子，证明其在PT未破缺相满足杨-巴方程并通过正则化连续延拓至异常点，进而导出双正交Bethe方程，并在异常点处揭示Gaudin矩阵缺陷与快度平方根合并及Z2单值性。\n3. 这为利用可积性诊断异常点奇异性与近藤临界性的本质区别提供了理论基础，并展示了通过Floquet-Magnus展开以可控误差驱动伪厄米有效哈密顿量的途径。", "summary_source": "deepseek", "authors": [{"name": "Vinayak M. Kulkarni"}], "featured_authors": [{"name": "Vinayak M. Kulkarni"}], "author_count": 1}, {"id": "2604.21583", "category": "math-ph", "title": "Derivation of Gibbs measure from Gibbs state with the fractional Bessel interaction in Two Dimensions", "abstract": "We derive the classical Gibbs measure on $\\mathbb{T}^2$ associated with the fractional Bessel interaction potential $\\widehat{v}_\\beta(k)=\\langle k\\rangle^{-\\beta}$ from a renormalized grand-canonical quantum Bose gas with the same interaction. Our result covers the whole range $\\frac32<\\beta\\leq2$, where $\\widehat{v}_\\beta(k)$ is not summable and the quantum model cannot be written in the usual density-square form, as the associated self-energy diverges. We therefore need to renormalize the zero mode by a centered number-fluctuation term and then develop a detailed analysis for the high-frequency remainders. All this allows us to implement a low-frequency localization and obtain the convergence of the quantum relative free energy to the classical fractional-Bessel free energy, as well as the convergence of the reduced density matrices to the limiting Gibbs measure.", "url": "https://arxiv.org/abs/2604.21583", "type": "理论", "summary": "1. 本文从重整化巨正则量子玻色气体出发，导出了二维环面上具有分数Bessel相互作用势的经典Gibbs测度。\n2. 其技术核心在于针对不可加和势及发散自能，引入中心数涨落项重整化零模，并精细分析高频余项，实现低频局域化。\n3. 该工作为处理奇异相互作用量子模型的经典极限问题提供了可推广的重整化框架与分析方法。", "summary_source": "deepseek", "authors": [{"name": "Phan Thành Nam"}, {"name": "Rongchan Zhu"}, {"name": "Xiangchan Zhu"}], "featured_authors": [{"name": "Phan Thành Nam"}, {"name": "Rongchan Zhu"}, {"name": "Xiangchan Zhu"}], "author_count": 3}, {"id": "2604.21630", "category": "math-ph", "title": "The KMS and GNS Spectral Gap of Quantum Markov Semigroups", "abstract": "We establish a relation between the exponential decay rates of quantum Markov semigroups with respect to different inner products. More precisely, it was conjectured by Fagnola, Poletti, Sasso and Umanità that for a Gaussian quantum Markov semigroup, the exponential decay rate with respect to the KMS inner product is bounded below by the exponential decay rate for the GNS inner product. We show that this is indeed the case and not limited to Gaussian quantum Markov semigroups, but holds for quantum Markov semigroups with a faithful normal invariant state on arbitrary von Neumann algebras. Additionally, the KMS inner product can be replaced by a whole class of inner products induced by operator monotone functions.", "url": "https://arxiv.org/abs/2604.21630", "type": "理论", "summary": "1. 该工作证明了在任意冯·诺依曼代数上带有忠实正规不变态的量子马尔可夫半群中，KMS内积下的指数衰减率不小于GNS内积下的指数衰减率，从而确认了Fagnola等人的猜想。\n2. 其技术核心在于建立了不同内积间谱隙的一般比较关系，并进一步将KMS内积替换为由算子单调函数诱导的一类内积，实现了广泛推广。\n3. 这为分析量子动力学中的混合速率提供了统一框架，并启发研究更复杂量子马尔可夫过程的指数衰减行为。", "summary_source": "deepseek", "authors": [{"name": "Melchior Wirth"}], "featured_authors": [{"name": "Melchior Wirth"}], "author_count": 1}, {"id": "2604.20912", "category": "quant-ph", "title": "Quantum-HPC Software Stacks and the openQSE Reference Architecture: A Survey", "abstract": "Quantum resources are increasingly integrated into high-performance computing (HPC) and cloud environments, but quantum high-performance computing (QHPC) software stacks remain isolated, often proprietary, full-stack solutions lacking common interfaces across runtime, resource management, orchestration, and execution layers. This paper analyzes nine production QHPC stacks and identifies common design patterns and emerging requirements, covering deployment models, application interaction patterns, SDK support, and readiness for fault-tolerant operation. The survey exposes consistent needs in runtime abstraction, resource management, interconnect semantics, and observability. Based on these findings, we propose the open quantum-HPC software ecosystem ( openQSE) reference architecture as a first step toward unifying the state-of-the-practice. openQSE defines a set of layer boundaries that allow different implementations to interoperate while preserving deployment flexibility, and is structured to support both current noisy intermediate-scale quantum (NISQ) workloads and future fault-tolerant quantum computing (FTQC) systems without changes to upper-layer application interfaces.", "url": "https://arxiv.org/abs/2604.20912", "type": "理论", "summary": "1. 该工作调查了九个生产级量子-高性能计算软件栈，提炼出运行时抽象、资源管理、互连语义与可观测性等共性需求，并据此提出openQSE参考架构。\n2. 其核心在于通过定义层边界实现不同实现间的互操作，同时保持部署灵活性，并支持从NISQ到FTQC的无缝过渡，且不改变上层应用接口。\n3. 这为量子-HPC软件栈的标准化提供了系统化路径，有望推动异构计算环境中量子与经典资源的统一调度与协同执行。", "summary_source": "deepseek", "authors": [{"name": "Amir Shehata"}, {"name": "Brian Austin"}, {"name": "Tom Beck"}, {"name": "Lukas Burgholzer"}, {"name": "Alex Chernoguzov"}, {"name": "Spencer Churchill"}, {"name": "Andrea Delgado"}, {"name": "Yasuko Eckert"}, {"name": "Jeffery Heckey"}, {"name": "Kevin Kissell"}, {"name": "Katherine Klymko"}, {"name": "Josh Moles"}, {"name": "Thomas Naughton"}, {"name": "Lee James O'Riordan"}, {"name": "Christian Ortiz Pauyac"}, {"name": "Guen Prawiroatmodjo"}, {"name": "Ermal Rrapaj"}, {"name": "Jiri Schindler"}, {"name": "Laura Schulz"}, {"name": "Sebastian Stern"}, {"name": "Tyler Takeshita"}, {"name": "Miwako Tsuji"}, {"name": "Aleksander Wennersteen"}, {"name": "Travis Humble"}, {"name": "Martin Schulz"}], "featured_authors": [{"name": "Amir Shehata"}, {"name": "Brian Austin"}, {"name": "Tom Beck"}, {"name": "Aleksander Wennersteen"}, {"name": "Travis Humble"}, {"name": "Martin Schulz"}], "author_count": 25}, {"id": "2604.20952", "category": "quant-ph", "title": "Adiabatic Error Cancellation in Berry Phase Estimation", "abstract": "In this work, we show that Berry phase estimation admits a natural and universal adiabatic error-cancellation mechanism, making it a promising candidate for practical quantum computing before full fault tolerance. Combining finite-runtime evolutions under $\\pm H$ along the loop cancels the leading $O(T^{-1})$ phase error exactly, and Richardson extrapolation further reduces the residual error to an oscillatory term with endpoint-controlled coefficient $O(\\|\\dot H(0)\\|^2\\Delta(0)^{-4}T^{-2})$. Beyond this deterministic cancellation, we establish that, for suitable smooth runtime distributions, runtime randomization suppresses the remaining oscillatory contribution to $O(T^{-M})$ for any fixed $M$, leading to a randomized Hadamard-test algorithm for Berry phase estimation over the full range $[0,2\\pi)$ with improved runtime scaling under standard sample complexity.", "url": "https://arxiv.org/abs/2604.20952", "type": "理论+数值", "summary": "1. 该工作发现Berry相位估计天然具有绝热误差消除机制，通过组合正反哈密顿量的有限时间演化精确消去主导O(T⁻¹)相位误差。\n2. 其核心在于结合Richardson外推将残差降至端点可控的O(T⁻²)振荡项，并利用运行时随机化进一步抑制到任意高阶O(T⁻ᴹ)，实现随机化Hadamard-test算法。\n3. 这为全容错前实用量子计算提供了一种相位估计的加速方案，特别是对含时哈密顿量模拟和几何量子计算具有直接应用前景。", "summary_source": "deepseek", "authors": [{"name": "Chusei Kiumi"}], "featured_authors": [{"name": "Chusei Kiumi"}], "author_count": 1}, {"id": "2604.20961", "category": "quant-ph", "title": "Ansätz Expressivity and Optimization in Variational Quantum Simulations of Transverse-field Ising Model Across System Sizes", "abstract": "We explore the application of the Variational Quantum Eigensolver (VQE) to investigate the ground state properties, particularly the entanglement entropy, of the Transverse Field Ising Model (TFIM) in one, two, and three dimensions, considering systems of up to 27 spins. By benchmarking VQE results against exact diagonalization and analyzing the entanglement properties across different system sizes and geometries, we assess the algorithm's effectiveness in capturing critical phenomena. Using results of TFIM, we also investigate how VQE's expressivity and optimization influence the simulation of highly entangled quantum states. We employ different ansätze: the hardware-efficient EfficientSU2 from Qiskit, the physics-inspired Hamiltonian Variational ansätz (HVA) and HVA with symmetry breaking, and benchmark their performance using energy variance, entanglement entropy, spin correlations, and magnetization. We further discuss the implications for scaling these methods to larger quantum systems.", "url": "https://arxiv.org/abs/2604.20961", "type": "理论+数值", "summary": "1. 该论文应用变分量子本征求解器研究一至三维横场伊辛模型最多27个自旋的基态纠缠熵，并与精确对角化进行基准测试。\n2. 其核心在于系统比较硬件高效EfficientSU2、物理启发哈密顿变分拟设及对称破缺变体，利用能量方差、纠缠熵等多项指标评估表达性与优化能力。\n3. 这为将变分量子算法扩展至更大体系时，针对高度纠缠量子态选择合适的拟设结构与优化策略提供了定量参考。", "summary_source": "deepseek", "authors": [{"name": "Ashutosh P. Tripathi"}, {"name": "Nilmani Mathur"}, {"name": "Vikram Tripathi"}], "featured_authors": [{"name": "Ashutosh P. Tripathi"}, {"name": "Nilmani Mathur"}, {"name": "Vikram Tripathi"}], "author_count": 3}, {"id": "2604.21012", "category": "quant-ph", "title": "Light-induced Self-Organization in Cooperative Free Space Atomic Arrays", "abstract": "We investigate how laser-driven, cooperative dipole-dipole interactions in weakly trapped atomic arrays give rise to self-organized configurations. Starting from an analytically tractable two-emitter system, we identify the possible steady-state spatial arrangements accessible to the atoms. We then extend this analysis to larger ensembles in both linear and ring geometries. In linear chains, we demonstrate the emergence of topologically nontrivial dimerized configurations across a range of initial interatomic spacings. In ring geometries, we find that the system undergoes self-organized contraction and expansion, enabling access to length scales below those set by the trapping lattice. Our results demonstrate that collective light-matter interactions in free space can spontaneously generate modified ordered geometries, even when the emitters are initially separated by distances larger than their transition wavelength.", "url": "https://arxiv.org/abs/2604.21012", "type": "理论", "summary": "1. 该工作研究了激光驱动下弱束缚原子阵列中合作偶极相互作用导致的自组织构型。\n2. 其技术卖点在于从可解析的两发射体系统出发，在链中揭示拓扑非平庸二聚化，在环中实现超越陷阱晶格尺度的自组织收缩与膨胀。\n3. 这为利用自由空间集体光-物质相互作用自发生成亚波长有序原子阵列提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Sara Molló-Guri"}, {"name": "Oriol Rubies-Bigorda"}, {"name": "Raphael Holzinger"}, {"name": "Jonah S. Peter"}, {"name": "Susanne F. Yelin"}], "featured_authors": [{"name": "Sara Molló-Guri"}, {"name": "Oriol Rubies-Bigorda"}, {"name": "Raphael Holzinger"}, {"name": "Jonah S. Peter"}, {"name": "Susanne F. Yelin"}], "author_count": 5}, {"id": "2604.21089", "category": "quant-ph", "title": "A rigorous quasipolynomial-time classical algorithm for SYK thermal expectations", "abstract": "Estimating local observables in Gibbs states is a central problem in quantum simulation. While this task is BQP-complete at asymptotically low temperatures, the possibility of quantum advantage at constant temperature remains open. The Sachdev-Ye-Kitaev (SYK) model is a natural candidate: at any constant temperature, its Gibbs states have polynomial quantum circuit complexity and are not described by Gaussian states. Rigorous analyses of the SYK model are difficult due to the failure of known techniques using random matrix theory, cluster expansions, and rigorous formulations of the quantum path integral and replica trick. Despite this, we give a rigorous proof of a quasipolynomial-time classical algorithm that estimates SYK local thermal expectations at sufficiently high constant temperature. Our result introduces a new Wick-pair cluster expansion that we expect to be broadly useful for disordered quantum many-body systems.", "url": "https://arxiv.org/abs/2604.21089", "type": "理论+数值", "summary": "1. 该工作严格证明了存在一个准多项式时间经典算法，用于估计SYK模型在足够高恒定温度下的局域热期望值。\n2. 其技术核心是引入一种新的Wick-pair簇展开，成功绕过了随机矩阵理论、团展开及路径积分等传统方法在SYK模型分析中的失效问题。\n3. 该结果不仅为恒温下SYK模型热力学量的经典可计算性提供了严格依据，其簇展开技术预期也将推广至其他无序量子多体系统。", "summary_source": "deepseek", "authors": [{"name": "Alexander Zlokapa"}], "featured_authors": [{"name": "Alexander Zlokapa"}], "author_count": 1}, {"id": "2604.21123", "category": "quant-ph", "title": "Qubit-efficient and gate-efficient encodings of graph partitioning problems for quantum optimization", "abstract": "We introduce a qubit- and gate-efficient higher-order unconstrained binary optimization (HUBO) encoding for graph partitioning problems requiring label-count minimization. This widely applicable class of problems includes minimum graph coloring, minimum $k$-cut, and community detection. To the best of our knowledge, this is the first work to address the optimization versions of these problems in a quantum setting, rather than only their decision counterparts. Our construction encodes each $k$-valued vertex variable using $\\lceil \\log_2 k \\rceil$ bits and employs a novel lexicographic penalty system that implicitly minimizes partition count without requiring dedicated indicator variables. We derive provably sufficient conditions on all penalty coefficients, including those arising from Rosenberg quadratization, guaranteeing feasibility and optimality of the lowest-energy solution. Analogous conditions are derived for a one-hot encoding to enable controlled comparison. We also show that our encoding reduces two-qubit gate count per QAOA layer from $\\Theta(|V||k|^2 + |E||k|)$ for the one-hot encoding to $\\Theta(|E| \\cdot |k| \\lceil\\log_2 |k|\\rceil)$. Benchmarking on a quantum annealer demonstrates that our logarithmic encoding significantly improves solution quality and time-to-solution for minimum graph coloring relative to one-hot encoding, with greater advantage as problem size increases.", "url": "https://arxiv.org/abs/2604.21123", "type": "数值", "summary": "1. 该工作提出了一种适用于量子优化的图划分问题高效编码，首次在量子设置中处理最小图着色、最小k-割等问题的优化版本而非仅决策版本。\n2. 其核心卖点是采用⌈log₂k⌉比特的对数编码与字典序惩罚系统隐式最小化分区数，并推导了包括Rosenberg量子化在内的惩罚系数充分条件，保证最低能量解的可行性和最优性。\n3. 该编码使QAOA中每层双量子比特门数从Θ(|V||k|²+|E||k|)降至Θ(|E|·|k|⌈log₂|k|⌉)，在量子退火器上对最小图着色问题显著提升解质量和时间-解比，且优势随问题规模增大而增强。", "summary_source": "deepseek", "authors": [{"name": "Tristan Zaborniak"}, {"name": "Prashanti Priya Angara"}, {"name": "Vikram Khipple Mulligan"}, {"name": "Hausi Müller"}, {"name": "Ulrike Stege"}], "featured_authors": [{"name": "Tristan Zaborniak"}, {"name": "Prashanti Priya Angara"}, {"name": "Vikram Khipple Mulligan"}, {"name": "Hausi Müller"}, {"name": "Ulrike Stege"}], "author_count": 5}, {"id": "2604.21266", "category": "quant-ph", "title": "On the importance of hyperparameters in initializing parameterized quantum circuits", "abstract": "There has been intensive research on increasing the utility and performance of Parameterized Quantum Circuits (PQCs) in the past couple of years. Owing to this research, there are now several inductive biases available to a quantum algorithms researchers to design a good circuit for their chosen task. In this paper, we focus on the problem of finding performant initial parameters for a given PQC. Different from previous research that focuses on finding the right \\emph{distribution}, we focus on finding the \\emph{hyperparameters} for any given distribution. To that end we introduce an evolutionary-search based algorithm that finds optimal hyperparameter given a PQC and quantum task. Our empirical results indicate that our algorithm consistently leads to selection of performant initial parameters tuned specifically to the ansatz and the quantum task leading to faster convergence and performance. More importantly, our algorithm does not \\emph{negatively} affect the barren plateau phenomenon. In other words, the initial parameters suggested by algorithm do not worsen the gradient variance scaling for a given initializing distribution.", "url": "https://arxiv.org/abs/2604.21266", "type": "理论+数值", "summary": "1. 该工作聚焦于参数化量子电路中初始参数的超参数选择问题，引入基于演化搜索的优化算法。\n2. 其技术核心在于针对给定变分电路与量子任务自动搜索最优超参数，从而获得适配的初始参数，加速收敛且不恶化贫瘠高原现象。\n3. 这为在保持梯度方差可训练性的前提下提升变分量子算法性能提供了实用策略，并启发更广泛的自适应初始化方案。", "summary_source": "deepseek", "authors": [{"name": "Ankit Kulshrestha"}, {"name": "Sarvagya Upadhyay"}], "featured_authors": [{"name": "Ankit Kulshrestha"}, {"name": "Sarvagya Upadhyay"}], "author_count": 2}, {"id": "2604.21274", "category": "quant-ph", "title": "Random Access Codes: Explicit Constructions, Optimality, and Classical-Quantum Gaps", "abstract": "A random access code (RAC) encodes an $L$-bit string into a $k$-bit $(L>k)$ message from which any designated source bit can be recovered with high probability. Its quantum counterpart, a quantum random access code (QRAC), replaces the $k$-bit message with $k$ qubits. While upper bounds on the decoding success probability have long been studied in both classical and quantum settings, explicit constructions of optimal codes are known only in special cases, even for classical RACs. In this paper, we develop a constructive framework for classical $(L,k)$-RACs under both average- and worst-case criteria. We show that optimal code design reduces to selecting $2^k$ points in $\\{0,1\\}^L$ and $[0,1]^L$ for the average- and worst-case criteria, respectively, so as to minimize a distance-like objective. This characterization yields explicit constructions for general $(L,k)$. For $k=L-1$, we further obtain closed-form optimal encoders and decoders for both criteria, and show that the resulting classical $(L,L-1)$-RACs attain the corresponding proved upper bounds. We also show that these optimal classical codes induce $(L,L-1)$-QRACs that attain a conjectured upper bound on the decoding success probability. Numerical optimization suggests little difference between RACs and QRACs in the average-case setting, but a potentially large classical-quantum gap in the worst-case nonasymptotic regime.", "url": "https://arxiv.org/abs/2604.21274", "type": "理论+数值", "summary": "1. 该工作为经典随机存取码（RAC）建立了构造性框架，给出了平均与最坏情形下一般参数的最优编码显式构造。\n2. 其技术关键在于将最优码设计转化为极小化距离型目标函数的点选择问题，并导出了闭合形式的编解码器。\n3. 这表明经典最优编码诱导的量子RAC可达到猜想的最优界，且最坏情形下经典与量子性能可能存在显著差距。", "summary_source": "deepseek", "authors": [{"name": "Ruho Kondo"}, {"name": "Yuki Sato"}, {"name": "Hiroshi Yano"}, {"name": "Yota Maeda"}, {"name": "Kosuke Ito"}, {"name": "Naoki Yamamoto"}], "featured_authors": [{"name": "Ruho Kondo"}, {"name": "Yuki Sato"}, {"name": "Hiroshi Yano"}, {"name": "Yota Maeda"}, {"name": "Kosuke Ito"}, {"name": "Naoki Yamamoto"}], "author_count": 6}, {"id": "2604.21287", "category": "quant-ph", "title": "StabilizerBench: A Benchmark for AI-Assisted Quantum Error Correction Circuit Synthesis", "abstract": "As quantum hardware scales toward fault tolerant operation, the demand for correct quantum error correction (QEC) circuits far outpaces manual design capacity. AI agents offer a promising path to automating this synthesis, yet no benchmark exists to measure their progress on the specialized task of generating QEC circuits. We introduce StabilizerBench, a benchmark suite of 192 stabilizer codes spanning 12 families, 4-196 qubits, and distances 2-21, organized into three tasks of increasing difficulty: state preparation circuit generation, circuit optimization under semantic constraints, and fault tolerant circuit synthesis. Although motivated by QEC, stabilizer circuits exercise core competencies required for general quantum programming, including gate decomposition, qubit routing, and semantic preserving transformations, while admitting efficient verification via the Gottesman Knill theorem, enabling the benchmark to scale to large codes without the exponential cost of full unitary comparison. We define a unified generator weighted scoring system with two tiers: a capability score measuring breadth of success and a quality score capturing circuit merit. We also introduce continuous fault tolerance and optimization metrics that grade error resilience and circuit improvements beyond binary pass or fail. Following the design of classical benchmarks such as SWE-bench, StabilizerBench specifies inputs, verification oracles, and scoring but leaves prompts and agent strategies open. We evaluate three frontier AI agents and find the benchmark discriminates across models and tasks with substantial headroom for improvement.", "url": "https://arxiv.org/abs/2604.21287", "type": "理论+数值", "summary": "1. 该工作提出了StabilizerBench基准套件，包含192个稳定子码（4至196量子比特，距离2至21），用于评估AI在量子纠错电路合成中的表现。\n2. 其核心卖点在于利用Gottesman-Knill定理实现无需指数代价的电路验证，并引入能力与质量两级评分系统及连续容错度量。\n3. 这为AI自动化生成容错量子电路提供了标准化测试框架，当前前沿模型表现尚存明显提升空间。", "summary_source": "deepseek", "authors": [{"name": "Andres Paz"}, {"name": "Christian Tarta"}, {"name": "Cordelia Yuqiao Li"}, {"name": "Mayee Sun"}, {"name": "Sarju Patel"}, {"name": "Sylvie Lausier"}], "featured_authors": [{"name": "Andres Paz"}, {"name": "Christian Tarta"}, {"name": "Cordelia Yuqiao Li"}, {"name": "Mayee Sun"}, {"name": "Sarju Patel"}, {"name": "Sylvie Lausier"}], "author_count": 6}, {"id": "2604.21288", "category": "quant-ph", "title": "Third Quantization for Order Parameter (I): BCS-BEC crossover with macroscopically coherent state", "abstract": "We revisit the quantization of the order parameter, which we refer to as third quantization, from the perspective of the commutation relation between the phase operator of the order parameter and the particle-number operator. We show that this macroscopic commutation relation does not constitute an independent fundamental postulate added to quantum mechanics, but instead emerges naturally from second quantization in the thermodynamic limit for both bosonic and fermionic many-body systems. In this sense, both Bose-Einstein condensates (BECs) and Bardeen-Cooper-Schrieffer (BCS) states can be understood as macroscopic quantum states described by bosonic coherent states: in BEC, bosons condense into a single coherent mode with a well-defined phase, while in BCS systems, collective excitations of Cooper pairs can also acquire an effectively bosonic coherent description. On this basis, we propose a new macroscopic interpretation of the BCS-BEC crossover. To characterize this crossover, we model a conventional superconductor as an assembly of macroscopically separated superconducting segments. As the intra-segment coupling increases, the system evolves from a BCS-like regime toward a BEC-like regime, in which the segments collectively behave as macroscopic coherent states. Inter-segment tunneling then locks their phases, establishes global phase coherence, and gives rise to a bulk Bose-Einstein condensate. The phase diagram of the BCS-BEC crossover can thus be understood as a manifestation of a macroscopic quantum process governed by the coherent-state dynamics of the order parameter. Our results provide a unified perspective on BEC, BCS superconductivity, and the BCS-BEC crossover within the framework of third quantization.", "url": "https://arxiv.org/abs/2604.21288", "type": "理论+数值", "summary": "1. 该工作从相位算符与粒子数算符的宏观对易关系出发，证明其非独立公设而从第二量子化的热力学极限自然涌现，并提出BCS-BEC crossover的第三量子化新诠释。\n2. 核心在于将常规超导体建模为宏观分离的超导片段，通过片段内耦合增强和片段间隧穿锁定相位，将crossover归结为序参量相干态动力学主导的宏观量子过程。\n3. 这为统一理解BEC、BCS超导及BCS-BEC crossover提供了第三量子化框架，并启发以宏观相干态观点重审其他量子多体现象的涌现机制。", "summary_source": "deepseek", "authors": [{"name": "Guo-Jian Qiao"}, {"name": "Miao-Miao Yi"}, {"name": "Xin Yue"}, {"name": "C. P. Sun"}], "featured_authors": [{"name": "Guo-Jian Qiao"}, {"name": "Miao-Miao Yi"}, {"name": "Xin Yue"}, {"name": "C. P. Sun"}], "author_count": 4}, {"id": "2604.21348", "category": "quant-ph", "title": "Ghost Degrees of Freedom Without Quantum Runaway: Exact Moment Bounds from an Operator Conservation Law", "abstract": "We prove an exact quantum conservation law for a harmonic oscillator coupled to a ghost degree of freedom: a second classical conserved quantity lifts to a quantum operator that commutes with the Hamiltonian with no hbar corrections, yielding a rigorous, state-independent upper bound on the mean squared phase-space radius for all time and every quantum state with finite initial second moments. The proof uses only canonical commutation relations and the Leibniz rule; it requires no confining potential, no spectral assumptions, and no perturbative expansion. The interaction studied here is bounded and vanishes at large separations, the generic situation in effective field theory, yet this suffices to guarantee quantum stability in the sense of bounded second moments. Three independent numerical frameworks (Heisenberg picture, Schrodinger picture, and Fock-space diagonalization) confirm wavepacket confinement below the analytic bound, a real energy spectrum, and Poisson level statistics numerically consistent with an integrable structure. The absence of a confining potential means the proof is silent on spectral discreteness and the existence of a ground state; those questions, addressed for polynomial confining interactions in concurrent work, remain open for the interaction class studied here and represent the sharpest targets for future work. Ghost quantum instability is therefore not an inevitable consequence of a wrong-sign kinetic term but depends critically on the interaction structure.", "url": "https://arxiv.org/abs/2604.21348", "type": "理论+数值", "summary": "1. 该工作证明了一个与鬼自由度耦合的谐振子系统存在精确量子守恒律，导出所有态的平均相空间半径严格上界。\n2. 其核心在于无需束缚势或微扰，仅利用正则对易关系与莱布尼茨法则便获得态无关二阶矩界，并由三种独立数值框架确认。\n3. 这揭示鬼量子不稳定性并非负动能的必然结果，而强烈依赖相互作用结构，为无束缚势系统的稳定性判据提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Christopher Ewasiuk"}, {"name": "Stefano Profumo"}], "featured_authors": [{"name": "Christopher Ewasiuk"}, {"name": "Stefano Profumo"}], "author_count": 2}, {"id": "2604.21463", "category": "quant-ph", "title": "Dynamical Regimes of Two Qubits Coupled through a Transmission Line", "abstract": "We investigate the reduced dynamics of two identical superconducting qubits capacitively coupled through a finite-length transmission line. Starting from circuit quantization, we derive a circuit Hamiltonian that naturally separates the line modes into even- and odd-parity sectors coupled to collective qubit operators. Depending on the hierarchy between the qubit frequency $\\omega_q$, the mode spacing $\\omega_{TL}$, and the coupling scale $\\omega_g$, the line acts either as a structured reservoir or as a discrete few-mode coupler. In the long-line continuum limit, each sector is described by a Drude--Lorentz spectral density and the dynamics is solved with the hierarchical equations of motion. Using the Breuer--Laine--Piilo measure, we identify the parameter region in which the reduced dynamics exhibits non-Markovian relaxation. In the short-line limit, the continuum description breaks down and the dynamics becomes respectively multimode or single-mode. This establishes a unified cQED picture of the dynamical regimes of finite-length transmission lines in superconducting-circuit architectures.", "url": "https://arxiv.org/abs/2604.21463", "type": "理论+数值", "summary": "1. 该工作研究两个相同超导量子比特通过有限长度传输线电容耦合的约化动力学，依据频率层级划分了长线连续极限和短线离散极限下传输线作为结构化储层或离散少模耦合器的不同区域。\n2. 其物理卖点在于自然分离传输线模式为偶奇宇称部分，在长线极限下采用Drude-Lorentz谱密度和分层运动方程求解动力学，并利用Breuer-Laine-Piilo非马尔可夫度量识别了非马尔可夫弛豫参数区域。\n3. 这为超导电路架构中有限长度传输线耦合量子比特的动力学建立了统一cQED图像，揭示了从连续谱结构化储层到离散少模耦合的转变，并对量子调控提供明确启发。", "summary_source": "deepseek", "authors": [{"name": "Fabio Borrelli"}, {"name": "Giovanni Miano"}, {"name": "Carlo Forestiere"}], "featured_authors": [{"name": "Fabio Borrelli"}, {"name": "Giovanni Miano"}, {"name": "Carlo Forestiere"}], "author_count": 3}, {"id": "2604.21509", "category": "quant-ph", "title": "Catalytic quantum thermodynamics beyond additivity and reduced-state monotones", "abstract": "The generalized second laws of quantum thermodynamics are usually formulated in terms of Rényi divergences and the associated family of generalized free energies. In catalytic thermal transformations, this framework typically certifies the existence of a suitable catalyst but does not make the catalytic contribution explicit in the resulting system-level inequalities. Here we develop a complementary formulation based on non-additive divergences, whose pseudo-additive structure yields a family of generalized free energies with an explicit catalyst-dependent correction term. For uncorrelated catalytic thermal transformations, we show that this leads to non-additive second-law relations that make the catalytic contribution explicit and provide nontrivial constraints on admissible catalysts when the catalyst is returned only approximately. We also analyze correlated catalytic thermal transformations and show, through explicit finite-dimensional examples, that reduced-state data are generally insufficient to characterize thermodynamic accessibility: the thermo-majorization behavior of the joint transformation can change while the system and catalyst marginals remain fixed, and even states with identical marginals and the same mutual information can exhibit different thermo-majorization accessibility. Our results show that non-additivity can be thermodynamically informative in uncorrelated catalysis, whereas correlated catalysis generally requires a genuinely joint-state-sensitive description beyond reduced-state monotones.", "url": "https://arxiv.org/abs/2604.21509", "type": "理论", "summary": "1. 该工作发展了一类基于非加性散度的量子热力学公式，在催化热变换中显式引入催化剂依赖的修正项，并推导出非关联情形下显含催化贡献的非加性第二定律不等式。\n2. 核心卖点在于利用非加性散度的伪加性结构，使催化修正项在自由能族中解析显现；同时通过有限维实例揭示关联催化中约化态数据与互信息均不足以判定热力学可达性，需依赖联合态描述。\n3. 这启发非关联催化中非加性本身蕴含可提取的热力学信息，而关联催化则要求超越约化态单调量的联合态敏感框架，为催化剂设计与热力学资源理论提供了更严格约束。", "summary_source": "deepseek", "authors": [{"name": "Ali Can Günhan"}, {"name": "Onur Pusuluk"}, {"name": "Thomas Oikonomou"}, {"name": "G. Baris Bagci"}], "featured_authors": [{"name": "Ali Can Günhan"}, {"name": "Onur Pusuluk"}, {"name": "Thomas Oikonomou"}, {"name": "G. Baris Bagci"}], "author_count": 4}, {"id": "2604.21513", "category": "quant-ph", "title": "Quantum jump correlations in long-range dissipative spin systems", "abstract": "We characterize nonequilibrium phases in long-range dissipative spin systems through the statistical properties of quantum jump trajectories. While the average dynamics governed by the Lindblad master equation provides access to steady-state expectation values of order parameters, the quantum trajectory framework reveals features encoded in the spatial and temporal correlations of detection events. Focusing on a model exhibiting a paramagnetic-to-ferromagnetic phase transition, we investigate the full counting statistics of quantum jumps using a tilted Lindbladian approach. We combine this with cluster mean-field and cumulant expansion techniques, which allow us to capture, respectively, the short- and long-range structure of jump correlations. In addition, we study the waiting-time distributions of detection events. We show that quantum jump correlations display clear signatures of the underlying phases and reveal distinct dynamical features across the transition. Our results highlight the potential of trajectory-resolved observables as probes of collective behavior in open quantum many-body systems and provide new insights into the role of long-range interactions in shaping nonequilibrium dynamics.", "url": "https://arxiv.org/abs/2604.21513", "type": "理论+数值", "summary": "1. 该工作通过量子跳跃轨迹的统计特性，表征了长程耗散自旋体系中的非平衡相及其相变特征。\n2. 其技术核心在于结合倾斜Lindblad方法与团簇平均场和累积量展开，同时捕捉跳跃相关性的短程与长程结构。\n3. 这揭示了轨迹分辨观测量可作为开放量子多体系统集体行为的探针，为理解长程相互作用下的非平衡动力学提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Giulia Salatino"}, {"name": "Anna Delmonte"}, {"name": "Zejian Li"}, {"name": "Rosario Fazio"}, {"name": "Alberto Biella"}], "featured_authors": [{"name": "Giulia Salatino"}, {"name": "Anna Delmonte"}, {"name": "Zejian Li"}, {"name": "Rosario Fazio"}, {"name": "Alberto Biella"}], "author_count": 5}, {"id": "2604.21560", "category": "quant-ph", "title": "Quantum plasmonics with N emitters: bright hybrid continuum selection", "abstract": "We construct mode-selective effective models describing the interaction of the quantum plasmon-polariton field supported by a finite dielectric medium and one or several quantum emitters. The construction of the effective model is based on the decomposition of the field into bright modes relevant to the interaction with the emitters and dark modes, which do not interact with the emitters. We show that the quantum plasmon-polariton field can be represented equivalently by a double-continuum spectrum or by a single hybrid continuum spectrum for each emitter. The system of the electromagnetic field coupled to a finite medium is composed of two families of continuum modes, each of them with an infinite degeneracy. The two families are deformations of the free electromagnetic field and the free medium, induced by the interaction between them, as described by the Lippmann-Schwinger equations. We show that if there are $N$ emitters interacting with this plasmon-polariton field, the effective interaction involves a much smaller set of bosonic continuum modes: the interacting part of the continuum can be described by $N$ non-degenerate one-dimensional continua, one for each emitter. The representation of the interaction in terms of a single hybrid continuum spectrum coincides with the one within the macroscopic Langevin model with bulk medium. This coincidence is explained by an exact compensation of two terms, one in the coupling term of the Hamiltonian and the other one in a Green tensor identity.", "url": "https://arxiv.org/abs/2604.21560", "type": "理论", "summary": "1. 该工作构建了描述有限介质中量子等离激元极化子场与多个量子发射体相互作用的模式选择有效模型。\n2. 其物理核心在于将场分解为亮模与暗模，并证明每个发射体对应的相互作用可等效为单个混合连续谱，从而将N个发射体的连续谱自由度简化为N个非简并一维连续谱。\n3. 该混合连续谱表示与宏观Langevin模型的一致性揭示了耦合项与格林张量恒等式间的精确抵消，为量子等离激元多体问题提供了简化计算框架。", "summary_source": "deepseek", "authors": [{"name": "Georgii Semin"}, {"name": "Hans-Rudolf Jauslin"}, {"name": "Gérard Colas des Francs"}, {"name": "Stéphane Guérin"}], "featured_authors": [{"name": "Georgii Semin"}, {"name": "Hans-Rudolf Jauslin"}, {"name": "Gérard Colas des Francs"}, {"name": "Stéphane Guérin"}], "author_count": 4}, {"id": "2604.21565", "category": "quant-ph", "title": "Pulse Shaping for Superconducting Qubits", "abstract": "High-fidelity control of superconducting qubits requires carefully shaped microwave pulses that account for multiple error channels. In this work, we present a pedagogical introduction to pulse-shaping techniques for transmon qubits, aiming to provide a unified, accessible framework that integrates physical intuition for pulse design, analytical understanding of gate-level descriptions, and practical considerations of hardware. This article further aims to serve as a guide for students and early researchers entering superconducting quantum computing. We begin by examining simple pulse envelopes and their spectral properties, highlighting how finite bandwidth leads to leakage outside the computational subspace. These observations motivate the introduction of the derivative removal by adiabatic gate (DRAG) technique, which uses a quadrature component proportional to the pulse's time derivative to suppress off-resonant excitations. We analyze the single-qubit case using the Magnus expansion, which provides a clear understanding of the order-by-order introduction of error channels. We discuss the practical hardware realities of control pulse generation, focusing on arbitrary waveform generators (AWG), local oscillators (LO), and IQ mixing. Common imperfections are discussed in terms of their impact on the effective pulse shape and qubit Hamiltonian. Finally, we extend the discussion to two-qubit operations, focusing on the cross-resonance gate and the emergence of effective interactions.", "url": "https://arxiv.org/abs/2604.21565", "type": "理论", "summary": "1. 该工作为超导transmon量子比特提供了统一的脉冲整形教学框架，整合了脉冲设计的物理直觉、门级分析和硬件实践。\n2. 其核心卖点在于系统引入导数消除绝热门(DRAG)技术及Magnus展开，通过正交分量补偿有限带宽导致的能级泄漏，逐阶阐明误差机制。\n3. 这为单比特及cross-resonance双比特门的高保真度控制提供了可操作的指导，可推广至更复杂的量子比特系统与实验平台。", "summary_source": "deepseek", "authors": [{"name": "Animesh Patra"}, {"name": "Ankur Raina"}], "featured_authors": [{"name": "Animesh Patra"}, {"name": "Ankur Raina"}], "author_count": 2}, {"id": "2604.21574", "category": "quant-ph", "title": "Generalized stochastic spin-wave theory for open quantum spin systems", "abstract": "We propose a semiclassical framework for solving open quantum dynamics in driven-dissipative spin systems. Our method consists of generalized spin-wave approximations tailored to describing quantum trajectories unravelled from the master equation, and generically applies to regimes beyond the reach of conventional spin-wave theories, including short-range interactions and local quantum jumps, enabling the efficient simulation of large-scale interacting spins. We illustrate the versatility of our framework by studying a variable-range driven-dissipative Ising model on a 2D lattice. When the dissipation acts along the drive axis, we find a continuous phase transition breaking the $\\mathbb{Z}_2$ symmetry, and demonstrate that the interaction range, when tuned from fully-connected to nearest-neighbour, profoundly alters the universality class of the criticality. With the dissipation along the interaction axis, we show the emergence of a first-order transition. Demonstrated with both state-diffusion and quantum-jump types of trajectory dynamics, our framework provides a powerful toolbox for the efficient semiclassical description of non-equilibrium dynamics and many-body phases in spin systems.", "url": "https://arxiv.org/abs/2604.21574", "type": "理论+数值", "summary": "1. 该工作提出了一个半经典框架，用于求解驱动-耗散自旋系统中由主方程量子轨迹描述的开放量子动力学。\n2. 其核心在于广义自旋波近似与轨迹解耦方法结合，可处理短程相互作用和局域量子跳变等常规理论失效的区域。\n3. 这为高效模拟大尺度非平衡自旋系统的多体相变与临界现象，以及调控相互作用范围改变普适类提供了实用工具。", "summary_source": "deepseek", "authors": [{"name": "Zejian Li"}, {"name": "Anna Delmonte"}, {"name": "Rosario Fazio"}], "featured_authors": [{"name": "Zejian Li"}, {"name": "Anna Delmonte"}, {"name": "Rosario Fazio"}], "author_count": 3}, {"id": "2604.21594", "category": "quant-ph", "title": "Composite quantum gates simultaneously compensated for multiple errors", "abstract": "Systematic control errors remain a primary obstacle to realizing high-fidelity single-qubit gates. We introduce composite pulse sequences that implement X and Hadamard gates while simultaneously compensating amplitude (Rabi-frequency), detuning (frequency), and duration errors. Our construction uses two complementary strategies: (i) derivative-based cancellation of error terms in the full unitary (not just the transition probability), formulated via the Cayley-Klein parametrization, and (ii) direct minimization of the average gate infidelity over prescribed error ranges. We derive symmetric five-pulse solutions with closed-form phases that cancel all first-order terms (including the mixed derivative), and numerically optimize longer sequences -- up to 15 pulses -- to achieve higher-order suppression. We also show that standard ``universal'' five-pulse sequences (U5a/U5b) emerge as simple phase-shifted instances of our symmetric solutions, yielding broad robustness to both detuning and amplitude errors. Finally, we construct variable-area sequences for $R_x(\\pi/2)$, which, up to virtual Z rotations, benchmark the Hadamard gate. Across all families we observe the expected trade-off between sequence length and robustness window, with substantial boosts in fidelity over large error domains.", "url": "https://arxiv.org/abs/2604.21594", "type": "理论+数值", "summary": "1. 该工作设计了同时补偿幅度、失谐与持续时间误差的复合脉冲序列，实现了X门与Hadamard门的高保真实现。\n2. 其技术核心在于通过Cayley-Klein参数化进行全酉算子的导数误差抵消，并结合平均门保真度直接最小化，推导出对称五脉冲封闭解并数值优化至15脉冲以压制高阶误差。\n3. 该构造统一了标准U5a/U5b序列作为特例，并拓展至可变面积R_x(π/2)门，揭示了序列长度与鲁棒性窗口之间的基本折中关系。", "summary_source": "deepseek", "authors": [{"name": "Hristo Tochev"}, {"name": "Nikolay Vitanov"}], "featured_authors": [{"name": "Hristo Tochev"}, {"name": "Nikolay Vitanov"}], "author_count": 2}, {"id": "2604.21656", "category": "quant-ph", "title": "Speed-oriented quantum circuit backend", "abstract": "We present a new software package for efficient quantum circuit generation, designed to achieve optimal runtime performance. Despite being in an early stage of development, our implementation demonstrates significant advantages over existing tools. Using the quantum Fourier transform (QFT) as a benchmark, we show that our backend can generate circuits for systems with up to 2000 qubits faster than widely used frameworks such as Qiskit and Q#. This improvement is particularly relevant for applications where classical preprocessing time, including circuit generation, must be minimized to not diminish any potential quantum advantage - for example, in combinatorial optimization tasks. Additionally, our software provides high-level primitives for bit- and integer-level manipulations, offering a simplified interface for integration with high-level quantum programming languages.", "url": "https://arxiv.org/abs/2604.21656", "type": "数值", "summary": "1. 该工作研发了一个以运行速度为核心设计目标的量子电路后端软件包，在针对量子傅里叶变换的基准测试中，即便处于早期阶段，也已实现对高达2000量子比特系统的电路高效生成，速度明显优于Qiskit和Q#。\n2. 其关键技术优势在于优化了电路生成流程，大幅压减了经典预处理时间，从而确保在组合优化等任务中经典开销不会侵蚀量子加速带来的潜在优势。\n3. 这一成果为需要快速经典预处理的量子应用提供了直接且高效的电路生成方案，同时其位与整数级操作的高级原语简化了与高层量子编程语言的集成，为量子软件的实用化演进奠定了接口基础。", "summary_source": "deepseek", "authors": [{"name": "Sören Wilkening"}], "featured_authors": [{"name": "Sören Wilkening"}], "author_count": 1}, {"id": "2604.21695", "category": "quant-ph", "title": "Lagrange: Operating Italy's First Publicly-Accessible Quantum Computer for Research and Education", "abstract": "We describe the design, implementation, and nine-month operational experience of the software management stack for Lagrange, an IQM Spark five-qubit superconducting quantum computer jointly acquired by LINKS Foundation, Politecnico di Torino and the Italian National Institute of Metrological Research (INRiM), and managed by LINKS. Lagrange is, to our knowledge, the first quantum computer in Italy that is fully operational and accessible to students and researchers from multiple institutions under formal service agreements, and to the general public under commercial agreements. When installed in mid-2025, the IQM Spark hardware was delivered by the vendor with authentication only: no billing, project management or fair usage enforcement were provided. We developed a modular middleware layer that filled that gap without modifying any vendor client software, by intercepting API calls through a proxy that enforces project-based budgets, reservation-aware authorisation, and per-user fairness policies. The middleware adopts a plugin architecture that cleanly separates vendor-specific logic from site-specific policies, enabling reuse across different quantum hardware backends and deployment contexts. Since entering production in September 2025, the system has processed over 240,000 quantum jobs totalling more than 1 week of QPU execution time, with greater than 98% uptime. Notably, students at Politecnico di Torino regularly use the machine during both lectures and formal examinations -- a practice we believe to be unique in Europe. We report on the system architecture, the operational lessons learned, and the infrastructure choices that made this deployment possible.", "url": "https://arxiv.org/abs/2604.21695", "type": "理论", "summary": "1. 本文报道了意大利首台公开可访问的量子计算机Lagrange的软件管理栈设计与九个月运行经验，该系统基于IQM Spark五比特超导硬件。\n2. 核心卖点在于通过代理拦截API实现模块化中间件层，在不修改供应商客户端软件的前提下，强制执行项目预算、预约授权与用户公平策略，并采用插件架构分离厂商逻辑与站点策略。\n3. 该系统已处理超过24万次量子任务，QPU执行时间超一周，且学生可在课堂与考试中常态化使用，为量子计算在教育和研究中的实际部署提供了可复用的基础设施范例。", "summary_source": "deepseek", "authors": [{"name": "Paolo Viviani"}, {"name": "Fabrizio Bertone"}, {"name": "Giacomo Vitali"}, {"name": "Emanuele Dri"}, {"name": "Federico Stirano"}, {"name": "Giuseppe Caragnano"}, {"name": "Francesco Lubrano"}, {"name": "Antonino Nespola"}, {"name": "Olivier Terzo"}, {"name": "Matteo Cocuzza"}, {"name": "Bartolomeo Montrucchio"}, {"name": "Giovanna Turvani"}, {"name": "Gianluca Bertaina"}, {"name": "Marco Coisson"}, {"name": "Davide Calonico"}, {"name": "Fabrizio Pirri"}, {"name": "Pietro Asinari"}], "featured_authors": [{"name": "Paolo Viviani"}, {"name": "Fabrizio Bertone"}, {"name": "Giacomo Vitali"}, {"name": "Davide Calonico"}, {"name": "Fabrizio Pirri"}, {"name": "Pietro Asinari"}], "author_count": 17}, {"id": "2604.21778", "category": "quant-ph", "title": "Symplectic split-operator method for the time-dependent unitary Tavis-Cummings model", "abstract": "We present a fast, memory-efficient, unitarity-preserving numerical method beyond the rotating-wave approximation for the closed Tavis-Cummings model in which a multilevel spin system interacts with a cavity mode. This model can describe the interaction of an ensemble of spins with a cavity mode in which the spin frequency and other parameters are time-dependent. The method exploits the fact that, while the Tavis-Cummings model is not tri-diagonal, it can be brought into tri-diagonal form by a change of basis that can be implemented purely by re-indexing (permuting basis elements), which is a fast operation. By truncating the Fock basis of the cavity mode, the computational complexity of the method is linear in the total dimension of the coupled system, both in time and memory. The method can be employed to simulate any closed quantum system whose Hamiltonian terms can be brought into tri-diagonal form.", "url": "https://arxiv.org/abs/2604.21778", "type": "理论+数值", "summary": "1. 该工作针对含时Tavis-Cummings模型，提出了一种快速、内存高效且保持酉性的辛分裂算符数值方法，超越旋转波近似，用于模拟多能级自旋系综与腔模的耦合动力学。\n2. 其技术关键在于通过基矢的纯重新索引操作将系统哈密顿量化为三对角形式，从而应用辛分裂算符实现计算时间和内存复杂度均与总系统维度呈线性关系的高精度演化。\n3. 该方法可推广至任何哈密顿量能通过基矢重排化为三对角形式的封闭量子系统，为含时自旋-腔相互作用等问题的数值模拟提供了高效、通用的框架。", "summary_source": "deepseek", "authors": [{"name": "Roman Ovsiannikov"}, {"name": "Kurt Jacobs"}, {"name": "Andrii G. Sotnikov"}, {"name": "Denys I. Bondar"}], "featured_authors": [{"name": "Roman Ovsiannikov"}, {"name": "Kurt Jacobs"}, {"name": "Andrii G. Sotnikov"}, {"name": "Denys I. Bondar"}], "author_count": 4}, {"id": "2604.21788", "category": "quant-ph", "title": "Partial oracles quantum algorithm framework -- Part I: Analysis of in-place operations", "abstract": "The partial oracles framework is a quantum search algorithm that has the potential to exceed the quadratic speedup of Grover's algorithm, up to a theoretical maximum of an exponential speedup. Until now, however, the framework has lacked an explicit method for constructing the operator that represents the search iteration. In this paper, we provide the missing construction, for the special case of an oracle function definable using only in-place operations (that is, where the calculated result of the oracle function can be read just from the qubits in the search index). The restriction to in-place operations means that the current work does not yet exhibit quantum advantage: oracle functions constructed using only in-place operations are always classically reversible. To demonstrate quantum advantage, it will be necessary to extend this construction method to include out-of-place operations (part II). As part of the construction of the search iteration operator, we define a new type of transform, the reciprocal transform, which is applied to the oracle function. We show that the reciprocal transform obeys a chain rule, which makes it possible to break down complex transforms into simple steps. To illustrate the practical application of this search method, we apply the reciprocal transform to elementary operations from the SHA-256 hash algorithm: addition modulo $2^n$, the $Maj(a, b, c)$ function, the $Ch(a, b, c)$ function, and the bit shift functions. We also introduce the QFrame python library, which is used to automate the construction of quantum circuits that represent reciprocal transforms.", "url": "https://arxiv.org/abs/2604.21788", "type": "数值", "summary": "1. 该工作为部分oracle量子搜索框架提供了缺失的迭代算子构造方法，针对仅使用原地操作的oracle函数。\n2. 核心技术创新是定义了互逆变换及其链式法则，可将复杂变换分解为简单步骤，并展示了在SHA-256基本运算中的具体应用。\n3. 尽管当前局限于经典可逆的原地操作，该构造框架为后续扩展到非原地操作以实现超越Grover加速的量子优势奠定了基础。", "summary_source": "deepseek", "authors": [{"name": "Fintan M. Bolton"}], "featured_authors": [{"name": "Fintan M. Bolton"}], "author_count": 1}, {"id": "2604.21791", "category": "quant-ph", "title": "Rigorous Security Proofs for Practical Quantum Key Distribution", "abstract": "This thesis is concerned with rigorous security analyses of practical Quantum Key Distribution (QKD) protocols, using a variety of modern proof techniques. The main results are as follows. First, we establish a security proof for variable-length QKD protocols against IID collective attacks, and extend this result to coherent attacks using the postselection technique. In doing so, we resolve a long-standing flaw in the application of the postselection technique to QKD, thereby placing it on a rigorous mathematical footing. Second, we develop a method to bound phase error rates in entropic uncertainty relation-based and phase error rate-based proofs, using only the observed statistics of the protocol, even when detectors are imperfect and only approximately characterized. This removes a key assumption of identical detector behaviour and enables these techniques to be applied in realistic settings. Third, we present a very general security analysis based on the marginal-constrained entropy accumulation theorem. The resulting framework can be readily adapted to practical imperfections and side channels, and is suitable for certification efforts. Finally, we show that the security of QKD protocols under realistic authentication assumptions can be reduced to the standard idealized setting, where authentication is assumed to behave honestly, with only minor protocol modifications. A distinctive feature of this thesis is its unified presentation of several major QKD security proof frameworks using consistent protocol descriptions and notation. Consequently, this thesis is intended not only as a collection of new technical results, but also as a useful reference for understanding rigorous security analysis in quantum key distribution.", "url": "https://arxiv.org/abs/2604.21791", "type": "理论", "summary": "1. 该工作针对实际量子密钥分发协议，建立了变长协议在独立同分布集体攻击下的严格安全证明，并利用后选择技术将其推广至相干攻击。\n2. 其技术核心在于修复后选择技术在量子密钥分发应用中长期存在的数学缺陷，并发展出仅依赖观测统计量即可界定相位误码率的方法，无需假设探测器行为一致。\n3. 这为在实际设备不完美与边信道条件下应用严格安全分析提供了直接依据，并统一了多个主要证明框架，有望推动量子密钥分发认证与标准化工作。", "summary_source": "deepseek", "authors": [{"name": "Devashish Tupkary"}], "featured_authors": [{"name": "Devashish Tupkary"}], "author_count": 1}, {"id": "2604.21800", "category": "quant-ph", "title": "Variance Geometry of Exact Pauli-Detecting Codes: Continuous Landscapes Beyond Stabilizers", "abstract": "Exact quantum codes detecting a prescribed set of Pauli errors are approached through algebraic constructions--stabilizer, codeword-stabilized, permutation-invariant, topological, and related families. Geometrically, exact Pauli detection is governed by joint higher-rank numerical ranges of these Pauli operators, whose structure for rank $\\geq 2$ is largely uncharted. From this viewpoint, we show that such codes often form connected continuous families rather than collections of disjoint solution regions. These families are characterized by a single scalar derived from the Knill-Laflamme conditions: denoted $\\lambda^*$, it is the Euclidean norm of the signature vector of Pauli expectation values on the maximally mixed code state, and provides a one-parameter summary of the code's joint Pauli variance profile. Within these continuous landscapes, stabilizer codes occupy only discrete, measure-zero subsets of the attainable $\\lambda^*$-spectrum, exposing a largely unexplored continuum of genuinely nonadditive exact codes. We establish this picture by analyzing the geometry of higher-rank operator compressions, and extend it to symmetry-restricted settings where cyclic and permutation symmetries are imposed on both the error model and the code projector. Small-system cases reveal interval, singleton, and empty regimes through eigenvalue interlacing and symmetry-sector decompositions; larger systems are treated numerically via Stiefel-manifold optimization and symmetry-adapted parameterizations. In every unrestricted and symmetry-compatible case analyzed, the attainable $\\lambda^*$-spectrum forms a single closed interval whenever nonempty--although a general proof remains open. These results place stabilizer, symmetric, and nonadditive code families within a unified higher-rank variance framework, suggesting a continuous geometric perspective on the landscape of exact quantum codes.", "url": "https://arxiv.org/abs/2604.21800", "type": "理论+数值", "summary": "1. 该工作从Pauli算子联合高阶数值范围的几何视角研究精确Pauli检测码，证明其通常构成连通连续族而非孤立解区域，揭示了大量非可加精确码的连续体。\n2. 其核心在于通过Knill-Laflamme条件导出的标量λ*（最大混合态上Pauli期望值签名向量范数）作为码的联合Pauli方差剖面单参数摘要，并指出稳定子码仅占据可达到λ*谱的零测子集，且该谱在无限制及对称兼容情形下形成单闭区间。\n3. 这为统一稳定子、置换不变及非可加码族的高阶方差几何提供了理论框架，并激发了对连续景观中新型精确量子码以及一般闭区间性证明的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Arunaday Gupta"}, {"name": "Baisong Sun"}, {"name": "Xi He"}, {"name": "Bei Zeng"}], "featured_authors": [{"name": "Arunaday Gupta"}, {"name": "Baisong Sun"}, {"name": "Xi He"}, {"name": "Bei Zeng"}], "author_count": 4}, {"id": "2604.21805", "category": "quant-ph", "title": "The clock ambiguity is back with a vengeance", "abstract": "Page and Wootters (1983) showed how time and dynamics can emerge in a stationary system containing a clock. Albrecht (1995) later showed, for discrete time, that within this framework any dynamical evolution can be obtained simply by choosing a different clock. Marletto and Vedral (2017) claimed that this ambiguity disappears assuming that the clock and the rest of the world do not interact. I show that their proof relies on an incorrect mathematical assumption. Also, eliminating the ambiguity completely would obstruct spacetime symmetries. Whereas the original clock ambiguity concerns all possible histories of a discrete-time system evolving under arbitrary Hamiltonians, but not the Hamiltonians themselves, I prove a stronger version for continuous and discrete unbounded time: the ambiguity extends to both histories and Hamiltonians, including noninteracting ones. Only the dimension of the Hilbert space remains. One might hope to dismiss the ambiguity as merely perspectival, but I show that this would predict incorrect correlations between outcomes and their records, making even knowledge impossible. Purely relational approaches therefore face both the stronger and the original clock ambiguity problems. The ambiguity is removed by taking into account the physical meaning of the operators.", "url": "https://arxiv.org/abs/2604.21805", "type": "理论", "summary": "1. 该工作重新审视Page-Wootters框架中的时钟歧义性，证明在连续与离散无界时间下歧义扩展至历史、哈密顿量乃至非相互作用情形，仅余希尔伯特空间维度不变。\n2. 核心卖点在于揭示Marletto-Vedral的无相互作用消除歧义证明存在数学错误，并阐明消除歧义将破坏时空对称性，且纯关系性方法无法回避。\n3. 这警示任何关系性时间理论必须纳入算符的物理意义以消除歧义，否则将导致结果与记录的错误关联，甚至使知识成为不可能。", "summary_source": "deepseek", "authors": [{"name": "Ovidiu Cristinel Stoica"}], "featured_authors": [{"name": "Ovidiu Cristinel Stoica"}], "author_count": 1}, {"id": "2604.21824", "category": "quant-ph", "title": "Deterministic generation of grid states with programmable nonlinear bosonic circuits", "abstract": "Bosonic quantum error correction enables hardware-efficient protection of quantum information by encoding logical qubits in harmonic oscillators. Bosonic grid states, such as Gottesman-Kitaev-Preskill (GKP) states, are particularly promising due to their potential to correct small displacements and boson loss. However, their generation remains challenging, typically relying on probabilistic protocols or auxiliary qubit systems. Here, we propose deterministic protocols for generating bosonic grid states using programmable nonlinear bosonic circuits composed solely of squeezing, displacement, and Kerr operations. We show that aiming to enforce GKP symmetries in the output of these circuits yields states with competitive performance with respect to current realizations, but whose quality saturates with increasing circuit depth due to imperfect symmetry restoration. Instead, we find that these bosonic circuits naturally give rise to a distinct class of states, that we label as phased-comb states, which are unitarily related to standard grid states but feature an intrinsic phase structure. We demonstrate that these states define a scalable bosonic quantum error-correcting code with near-optimal performance under boson loss comparable to that of approximate GKP states. We further analyze their logical operations and show how to implement a universal gate set for them. Our results establish programmable nonlinear bosonic circuits as a viable route towards the generation of scalable bosonic quantum error-correcting states beyond standard GKP encodings.", "url": "https://arxiv.org/abs/2604.21824", "type": "理论", "summary": "1. 该工作提出利用压缩、位移和Kerr操作构成的可编程非线性玻色子电路，确定性生成玻色子网格态，并发现此类电路自然产生一类具有内禀相位结构的相位梳态。\n2. 相位梳态与标准GKP态幺正等价，在玻色子丢失下实现近最优纠错性能，且构成可扩展纠错码，支持通用逻辑门集，克服了深度增加时对称性恢复不完善的限制。\n3. 该成果无需辅助量子比特或概率协议，为利用非线性玻色子电路实现超越标准GKP编码的可扩展玻色子量子纠错提供了非微扰途径。", "summary_source": "deepseek", "authors": [{"name": "Yanis Le Fur"}, {"name": "Javier Lalueza-Puértolas"}, {"name": "Carlos Sánchez Muñoz"}, {"name": "Alberto Muñoz de las Heras"}, {"name": "Alejandro González-Tudela"}], "featured_authors": [{"name": "Yanis Le Fur"}, {"name": "Javier Lalueza-Puértolas"}, {"name": "Carlos Sánchez Muñoz"}, {"name": "Alberto Muñoz de las Heras"}, {"name": "Alejandro González-Tudela"}], "author_count": 5}, {"id": "2604.21863", "category": "quant-ph", "title": "Replay-buffer engineering for noise-robust quantum circuit optimization", "abstract": "Deep reinforcement learning (RL) for quantum circuit optimization faces three fundamental bottlenecks: replay buffers that ignore the reliability of temporal-difference (TD) targets, curriculum-based architecture search that triggers a full quantum-classical evaluation at every environment step, and the routine discard of noiseless trajectories when retraining under hardware noise. We address all three by treating the replay buffer as a primary algorithmic lever for quantum optimization. We introduce ReaPER$+$, an annealed replay rule that transitions from TD error-driven prioritization early in training to reliability-aware sampling as value estimates mature, achieving $4-32\\times$ gains in sample efficiency over fixed PER, ReaPER, and uniform replay while consistently discovering more compact circuits across quantum compilation and QAS benchmarks; validation on LunarLander-v3 confirms the principle is domain-agnostic. Furthermore we eliminate the quantum-classical evaluation bottleneck in curriculum RL by introducing OptCRLQAS which amortizes expensive evaluations over multiple architectural edits, cutting wall-clock time per episode by up to $67.5\\%$ on a 12-qubit optimization problem without degrading solution quality. Finally we introduce a lightweight replay-buffer transfer scheme that warm-starts noisy-setting learning by reusing noiseless trajectories, without network-weight transfer or $\\epsilon$-greedy pretraining. This reduces steps to chemical accuracy by up to $85-90\\%$ and final energy error by up to $90\\%$ over from-scratch baselines on 6-, 8-, and 12-qubit molecular tasks. Together, these results establish that experience storage, sampling, and transfer are decisive levers for scalable, noise-robust quantum circuit optimization.", "url": "https://arxiv.org/abs/2604.21863", "type": "数值", "summary": "1. 该工作通过工程化重放缓冲区，系统性解决了深度强化学习优化量子电路中TD目标可靠性忽略、全量量子经典评估开销及无噪声轨迹丢弃三大瓶颈。\n2. 其核心卖点包括退火重放规则ReaPER+将采样从TD误差优先级过渡至可靠性感知，课程学习加速方案OptCRLQAS摊销评估费用，以及轻量级缓冲区传输方案复用无噪声轨迹，分别实现最高32倍样本效率提升、67.5%每集时间缩减及90%最终能量误差降低。\n3. 这确立了经验存储、采样与传输作为可扩展噪声鲁棒量子电路优化关键杠杆的地位，且该原则已通过领域无关基准验证，为其他强化学习优化问题提供了明确范式借鉴。", "summary_source": "deepseek", "authors": [{"name": "Akash Kundu"}, {"name": "Sebastian Feld"}], "featured_authors": [{"name": "Akash Kundu"}, {"name": "Sebastian Feld"}], "author_count": 2}, {"id": "2604.21908", "category": "quant-ph", "title": "Efficient Classical Simulation of Heuristic Peaked Quantum Circuits", "abstract": "Peaked quantum circuits, whose output distribution is sharply concentrated on a single bitstring, have emerged as a promising candidate for verifiable quantum advantage, as the correctness of the quantum output can be checked by simply comparing against the known peak. Recent work by Gharibyan et al. arXiv:2510.25838 claimed heuristic quantum advantage using peaked circuits executed on Quantinuum's 56-qubit H2 processor. These peaked circuits concentrate their output on a single hidden bitstring by training a shallow simulable circuit variationally and inserting an obfuscated permutation to increase the depth to a level that makes classical simulation intractable, with estimated runtimes of years for the largest instances. We show that these circuits can be efficiently simulated classically. We describe a method that efficiently performs a full tensor network contraction, allowing near-exact sampling and extraction of the peaked bitstring. The method exploits the mirrored structure of the circuit and iteratively cancels both halves into a Matrix Product Operator (MPO), and avoids the obfuscated permutation by greedily reducing the MPO bond dimension through a process we call unswapping. The method can fully contract and extract the peak of the largest circuit in approximately one hour on a single GPU, around half the time it took to run on the quantum hardware.", "url": "https://arxiv.org/abs/2604.21908", "type": "理论+数值", "summary": "1. 该工作提出一种高效经典模拟方案，可近乎精确地提取启发式峰值量子电路中的峰值比特串。\n2. 其关键技术在于利用电路镜像结构，通过迭代抵消构建矩阵乘积算符并运用解交换贪心降低键维，避开混淆置换的复杂度。\n3. 这表明当前声称的启发式量子优势实例在经典模拟下仅需单GPU一小时即可完成，为峰值电路的可验证性提供重要警示。", "summary_source": "deepseek", "authors": [{"name": "David Kremer"}, {"name": "Nicolas Dupuis"}], "featured_authors": [{"name": "David Kremer"}, {"name": "Nicolas Dupuis"}], "author_count": 2}, {"id": "2604.21919", "category": "quant-ph", "title": "Algorithmic Locality via Provable Convergence in Quantum Tensor Networks", "abstract": "Belief propagation has recently emerged as a powerful framework for evaluating tensor networks in higher dimensions, combining computational efficiency with provable analytical guarantees. In this work, we develop the first end-to-end theory of tensor network belief propagation for a class of projected entangled pair states satisfying \\emph{strong injectivity}. We show that when the injectivity parameter exceeds a constant threshold, BP fixed points can be found efficiently, and a cluster-corrected BP algorithm computes physical quantities to $1/\\mathrm{poly}(N)$ error in $\\mathrm{poly}(N)$ time for an $N$ qubit system. We identify a striking phenomenon we term \\emph{algorithmic locality}: local perturbations of the tensor network affect the BP fixed point with an influence decaying rapidly with distance. As a result, updates to the fixed point after a local perturbation can be carried out using only local recomputation. Moreover, through the cluster expansion, this locality extends to observables, implying that local expectation values can be approximated from local data with controlled accuracy. Our results provide the first rigorous guarantee for the effectiveness of tensor-network belief propagation on a wide class of many-body states, bridging a gap between widely used numerical practice and provable algorithmic performance.", "url": "https://arxiv.org/abs/2604.21919", "type": "理论+数值", "summary": "1. 该工作针对满足强注入性的一类投影纠缠对态，建立了张量网络置信传播的首个完整端到端理论。\n2. 其核心在于证明注入性参数超过常数阈值时，置信传播不动点可高效求得，并揭示“算法局域性”：局部扰动对不动点的影响随距离指数衰减，从而仅需局部重计算更新。\n3. 这为使用置信传播高效计算高维张量网络的物理量提供了严格理论保障，弥合了广泛数值实践与可证明算法性能之间的鸿沟。", "summary_source": "deepseek", "authors": [{"name": "Siddhant Midha"}, {"name": "Yifan F. Zhang"}, {"name": "Daniel Malz"}, {"name": "Dmitry A. Abanin"}, {"name": "Sarang Gopalakrishnan"}], "featured_authors": [{"name": "Siddhant Midha"}, {"name": "Yifan F. Zhang"}, {"name": "Daniel Malz"}, {"name": "Dmitry A. Abanin"}, {"name": "Sarang Gopalakrishnan"}], "author_count": 5}, {"id": "2604.21929", "category": "quant-ph", "title": "Subsystem-Resolved Spectral Theory for Quantum Many-Body Hamiltonians", "abstract": "We study spectral properties of quantum many-body Hamiltonians through a subsystem-based framework. Given a Hamiltonian of the form $H = \\sum_{X \\subseteq \\Lambda} \\Phi(X)$ acting on a tensor product Hilbert space, we associate to each subset $S \\subseteq \\Lambda$ a subsystem Hamiltonian $H_S$ and its spectrum $\\mathcal{S}(S) = \\sigma(H_S)$. This produces a family of spectra indexed by subsystems, allowing spectral data to be organized according to interaction structure. We show that subsystem Hamiltonians admit local approximations: $H_S$ can be approximated by operators supported on finite neighborhoods with an error bounded by $\\|H_S - H_{S,r}\\| \\le |S| e^{-\\mu r} \\|\\Phi\\|_\\mu$. As a consequence, subsystem spectra are stable under truncation in the sense that $d_H(\\mathcal{S}(S), \\sigma(H_{S,r})) \\le |S| e^{-\\mu r} \\|\\Phi\\|_\\mu.$ We then prove that for disjoint subsets $S_1, S_2 \\subseteq \\Lambda$, the subsystem spectrum is approximately additive: $d_H\\big(\\mathcal{S}(S_1 \\cup S_2), \\mathcal{S}(S_1) + \\mathcal{S}(S_2)\\big) \\le (|S_1| + |S_2|) e^{-\\mu D} \\|\\Phi\\|_\\mu,$ where $D = d(S_1, S_2)$. In the finite-range case, this relation becomes exact. The results show that spectral properties reflect the locality of interactions not only at the level of operators, but also at the level of spectra. The framework provides a way to study many-body systems in which interaction geometry directly shapes spectral behavior.", "url": "https://arxiv.org/abs/2604.21929", "type": "理论+数值", "summary": "1. 该工作为形如$H=\\sum_X\\Phi(X)$的量子多体哈密顿量建立了子体系谱理论，将谱数据按子系统组织并研究其性质。\n2. 其核心在于证明了子体系哈密顿量可被有限邻域算子指数逼近，且不相交子集的谱近似满足可加性，误差由相互作用指数衰减率和距离控制。\n3. 这揭示了相互作用局域性不仅体现在算符层面，也直接映射到谱结构，为理解几何与谱行为的关联提供了新框架。", "summary_source": "deepseek", "authors": [{"name": "MD Nahidul Hasan Sabit"}], "featured_authors": [{"name": "MD Nahidul Hasan Sabit"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
