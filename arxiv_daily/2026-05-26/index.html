<head>

  <title>arXiv 2026-05-26 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2605.24029", "category": "cond-mat", "title": "Supersymmetry Without Time-Reversal Invariance in Model A: A FRG perspective", "abstract": "We show that, contrary to common belief, supersymmetry alone is not sufficient in Model A dynamics to ensure relaxation toward a stationary state satisfying time-reversal invariance (TRI). An additional condition on top of supersymmetry is required for TRI, which we analyze in detail. We explicitly construct a model that is supersymmetric but violates TRI, and argue that, at least perturbatively, TRI nevertheless emerges as an effective large-scale symmetry. Using the functional renormalization group (FRG), we further show that the dynamical effective action, $\\Gamma[\\varphi,\\tilde\\varphi]$, contains the derivative of the equilibrium effective action, $\\Gamma^{\\mathrm{eq}}[\\varphi]$, whose renormalization-group flow is identical to that of the equilibrium theory order by order in the derivative expansion. Finally, extending the same line of reasoning, we show that the probability distribution of the total magnetization in the Ising model can be recovered within the Model A framework.", "url": "https://arxiv.org/abs/2605.24029", "type": "理论", "summary": "1. 该工作证明，在Model A动力学中超对称性本身不足以保证稳态满足时间反演不变性，并构造了一个超对称但违反时间反演不变性的模型。\n2. 其核心在于利用泛函重整化群揭示，动力学有效作用量包含平衡有效作用量的导数，且二者的重正化群流在导数展开下逐阶等价。\n3. 这为非平衡统计系统中时间反演对称性的涌现机制提供了新的理解途径，并展示了在Model A框架内恢复Ising模型总磁化概率分布的可行性。", "summary_source": "deepseek", "authors": [{"name": "Sankarshan Sahu"}, {"name": "Bertrand Delamotte"}, {"name": "Adam Rançon"}, {"name": "Matthieu Tissier"}], "featured_authors": [{"name": "Sankarshan Sahu"}, {"name": "Bertrand Delamotte"}, {"name": "Adam Rançon"}, {"name": "Matthieu Tissier"}], "author_count": 4}, {"id": "2605.24061", "category": "cond-mat", "title": "Universal classification of continuous phase transitions with two order parameters", "abstract": "The continuous phase transition, indicated by the macroscopic order parameter and the occurrence of the spontaneous symmetry breaking, is well illustrated based on the Ginzburg-Landau's paradigm. In systems described by one order parameter, the phase diagram is only composed of the normal phase and the ordered phase. However, in systems with two or more order parameters, much richer phase diagrams and critical phenomena may emerge. According to coupling terms of the free energy, we classify the systems with two order parameters into several categories, featuring different patterns of phase diagrams and critical scalings respectively. Our work propose the new avenue to studying and evaluating the complex systems only based on the coupling terms in expressions of free energy.", "url": "https://arxiv.org/abs/2605.24061", "type": "理论+数值", "summary": "1. 该工作对具有两个序参量的连续相变进行了普适分类，依据自由能耦合项将系统划分为若干类别。\n2. 其核心在于揭示了不同耦合形式对应不同的相图模式和临界标度行为，从而扩展了Ginzburg-Landau范式。\n3. 这为仅基于自由能耦合项评估和预测复杂多序参量系统的相变行为提供了系统的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Yilun Xu"}, {"name": "Feng-xiao Sun"}], "featured_authors": [{"name": "Yilun Xu"}, {"name": "Feng-xiao Sun"}], "author_count": 2}, {"id": "2605.24078", "category": "cond-mat", "title": "Controlling spin-$\\frac 12$ antiferromagnetic interaction strength in nanographene dimers", "abstract": "We demonstrate that the effective spin-exchange coupling $J$ in open-shell nanographene dimers can be precisely tuned via tip-induced dehydrogenation of selected carbon atoms. Using the double ionization potential equation-of-motion coupled-cluster singles and doubles (DIP-EOM-CCSD) method, we accurately compute the singlet-triplet gaps, which correspond directly to the exchange coupling $J$. We show that the position of the dehydrogenated (or hydrogen-passivated) site in triangulene dimers strongly modulates the singlet-triplet splitting, allowing $J$ to be tuned over a wide range - from a few meV to several tens of meV. This strategy provides a simple yet powerful route for designing tailored spin models with alternating or spatially patterned spin-exchange couplings.", "url": "https://arxiv.org/abs/2605.24078", "type": "理论", "summary": "1. 该工作利用扫描隧道显微镜尖端诱导脱氢，精确调控了开壳层纳米石墨烯二聚体中的反铁磁自旋交换耦合强度J。\n2. 采用DIP-EOM-CCSD方法由单重态-三重态能隙直接提取J，并揭示脱氢位点可在几至数十meV范围内实现耦合的宽幅连续调制。\n3. 这一策略为构建具有交替或空间图案化交换耦合的定制自旋模型提供了简洁而通用的实验途径，启发了基于纳米石墨烯的量子模拟设计。", "summary_source": "deepseek", "authors": [{"name": "Robiatul Adawia"}, {"name": "Pawel Tecmer"}, {"name": "Pawel Potasz"}], "featured_authors": [{"name": "Robiatul Adawia"}, {"name": "Pawel Tecmer"}, {"name": "Pawel Potasz"}], "author_count": 3}, {"id": "2605.24105", "category": "cond-mat", "title": "Theory of supercooled water", "abstract": "We introduce a model of water contemplating true supercooled-liquid states that, as such, are metastable with respect to the crystalline-solid ones. Its numerical solutions reproduce from Speedy-Angell's stability-limit picture to Poole et al.'s metastable liquid--liquid criticality. The real existence of a liquid--liquid critical point is found to gain significant theoretical plausibility from a hitherto unnoticed analogy with the ``inversion thermodynamics'' of Joule-Thomson gas throttling process and, by extension, with the equivalent phenomenology exhibited by black holes.", "url": "https://arxiv.org/abs/2605.24105", "type": "理论+数值", "summary": "1. 该工作构建了一个描述真实过冷液体亚稳态的理论模型，其数值解同时复现了Speedy-Angell稳定性极限图像与Poole等人的亚稳液-液临界性。\n2. 核心卖点在于揭示了液-液临界点与焦耳-汤姆逊气体节流过程“反转热力学”之间此前未受关注的类比，并推广至黑洞等效现象。\n3. 这为水的反常热力学行为提供了统一的理论框架，并暗示液-液临界性在从凝聚态到引力系统的复杂物理中可能具有普适性。", "summary_source": "deepseek", "authors": [{"name": "Jacobo Troncoso"}, {"name": "Claudio A. Cerdeiriña"}], "featured_authors": [{"name": "Jacobo Troncoso"}, {"name": "Claudio A. Cerdeiriña"}], "author_count": 2}, {"id": "2605.24115", "category": "cond-mat", "title": "Anderson Localization: A Floquet operator Krylov space perspective", "abstract": "The problem of Anderson localization, as well as the single particle localization-delocalizaton transition of the Aubry-André model, is studied employing operator Krylov space methods. It is shown that even when the dynamics is generated by a Hamiltonian, studying the dynamics at stroboscopic rather than continuous times has its advantages. In particular, mapping the dynamics to an effective Floquet problem results in an operator Krylov space description where quantities such as the spectral function can be computed with fewer computational resources, while a moment method exists that allows for the extraction of Krylov parameters directly from the discrete time autocorrelation function. For stroboscopic dynamics, the operator Krylov space corresponds to the dynamics of an edge operator of an inhomogeneous Floquet transverse field Ising model, with the parameters of this effective model generated recursively. The Krylov parameters show disorder-averaged renormalization with their distribution narrowing as the recursion step increases. It is shown that a more physical spectral function is obtained from the Krylov parameters obtained from the disorder-averaged autocorrelation function, rather than the disorder-averaged Krylov parameters. The delocalized (localized) phase is shown to correspond to the appearance (absence) of a Porter-Thomas distribution, a ballistically propagating (localized) wavefront in operator Krylov space, and a smooth (discrete) Berstein-Szegö power-spectrum. The localization-delocalization transition is also demonstrated in operator Krylov space. A Porter-Thomas distribution is also observed at the critical point. The long-time dynamics and the inverse participation ratio at the critical point is shown to exhibit behavior consistent with a multi-fractal scaling with system size.", "url": "https://arxiv.org/abs/2605.24115", "type": "理论+数值", "summary": "1. 该工作利用算子Krylov空间方法研究安德森局域化及Aubry-André模型中的局域化-退局域化转变。\n2. 其技术关键在于将哈密顿量动力学映射为有效Floquet问题，从离散时间自相关函数递推提取Krylov参数，并揭示局域化相与退局域化相在算子Krylov空间中分别对应Porter-Thomas分布的有无、波前传播的弹道或局域特征以及Bernstein-Szegö功率谱的光滑或离散结构。\n3. 这为利用算子Krylov空间研究无序系统中的局域化动力学及临界多分形行为提供了新视角，尤其展示了从无序平均自相关函数提取的Krylov参数能给出更物理的谱函数。", "summary_source": "deepseek", "authors": [{"name": "Hsiu-Chung Yeh"}, {"name": "Aditi Mitra"}], "featured_authors": [{"name": "Hsiu-Chung Yeh"}, {"name": "Aditi Mitra"}], "author_count": 2}, {"id": "2605.24234", "category": "cond-mat", "title": "The structure of a melt: The case of liquid bismuth", "abstract": "Molecular Dynamics (MD) is performed on supercells of 216 atoms of bismuth, going from 300 K to 573 K in 100 steps and maintaining it in the liquid state, at 573 K, during 500 steps using the Materials Studio (MS) suite of codes. The Pair Distribution Functions (PDFs) and the Plane Angle Distributions (PADs) of the last 1, 10, 25 and 100 steps of the MD have been obtained. Averaging the last 100 steps, as representative of the liquid, Reverse Monte Carlo (RMC) was applied to obtain 4 atomic structures, one for each set of initial random velocities. Then, a detailed structural study of liquid bismuth at 573 K was undertaken; PDFs and PADs are calculated and reported. Two noticeable peaks appear for the PDFs, at 3.25 and 6.55 Å, along with a pseudo peak (shoulder) at 4.6 Å. This shoulder (after the first peak) of the PDFs is found to be related to the third and fourth neighbor peaks of the crystalline Wyckoff structure and also to the diagonal distances in deformed squares in the liquid structure. For completeness J(r)s are also reported. Two prominent peaks in the MS PADs are observed: 53° and 85°; and two for the RMC PADs: 58° and 90°, suggesting the existence of deformed triangles and squares. Less abundant are higher-order geometrical structures.", "url": "https://arxiv.org/abs/2605.24234", "type": "理论+数值", "summary": "1. 该工作通过分子动力学模拟与反蒙特卡洛方法，系统解析了液态铋在573 K时的原子级结构特征。\n2. 其核心在于利用对分布函数和平面角分布，识别出液态中变形三角形和正方形的存在，并指出PDF肩峰来源于晶体第三、四近邻与液态变形正方形对角线距离的关联。\n3. 这为液态金属短程序结构的多尺度解析提供了明确的结构判据，并启示了同类熔体几何构型的研究路径。", "summary_source": "deepseek", "authors": [{"name": "Flor B. Quiroga"}, {"name": "Isaías Rodríguez"}, {"name": "David Hinojosa"}, {"name": "Alexander Valladares"}, {"name": "Renela M. Valladares"}, {"name": "Ariel A. Valladares"}], "featured_authors": [{"name": "Flor B. Quiroga"}, {"name": "Isaías Rodríguez"}, {"name": "David Hinojosa"}, {"name": "Alexander Valladares"}, {"name": "Renela M. Valladares"}, {"name": "Ariel A. Valladares"}], "author_count": 6}, {"id": "2605.24268", "category": "cond-mat", "title": "Resonant interactions in the $α$-FPUT lattice with site-dependent coefficients", "abstract": "The wave turbulence framework has proven to be an effective tool for analyzing certain features of nonlinear energy transfer in one-dimensional nonlinear chains. In this work, we extend this approach to the $\\alpha$-FPUT problem when the spring stiffness $\\chi$ and the nonlinear coefficient $\\alpha$ are site-dependent. Although three-wave interactions are non-resonant for constant coefficients, their spatial modulation gives rise to a non-trivial resonant manifold. In this framework, we derive a new kinetic equation that suggests the possibility of substantially faster thermalization with respect to the constant coefficient case. The new kinetic equation includes also an extra term that can be associated to the Bragg-scattering mechanism, which promotes the isotropization of the wave-action spectral density function.", "url": "https://arxiv.org/abs/2605.24268", "type": "理论", "summary": "1. 该工作将波湍流框架推广至含空间依赖弹簧刚度χ与非线性系数α的α-FPUT晶格，处理了其非线性能量转移问题。\n2. 核心卖点在于揭示空间调制使原本非共振的三波相互作用产生非平凡共振流形，并导出包含布拉格散射项的新动力学方程。\n3. 该方程预示显著加快的热化过程及波谱各向同性化，为理解无序非线性晶格的热化与能量输运提供了关键理论工具。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo Migliorelli"}, {"name": "Giovanni Dematteis"}, {"name": "Sergio Chibbaro"}, {"name": "Miguel Onorato"}], "featured_authors": [{"name": "Lorenzo Migliorelli"}, {"name": "Giovanni Dematteis"}, {"name": "Sergio Chibbaro"}, {"name": "Miguel Onorato"}], "author_count": 4}, {"id": "2605.24276", "category": "cond-mat", "title": "Resonances in Overdamped Odd Materials", "abstract": "Odd viscoelasticity arises in parity-violating nonequilibrium materials, where it leads to unconventional mechanical responses and oscillatory relaxation even in overdamped systems. While many living and active chiral materials present promising candidates to exhibit odd viscoelasticity, there is currently no approach that allows for a rheological inference of the large number of elastic and viscous moduli that even a minimal isotropic odd viscoelastic material can depend on. Generalizing the century-old Papkovich-Neuber ansatz to active materials, our work introduces an odd Papkovich-Neuber (OPN) solution -- an analytic solution for any isotropic linear odd fluid or solid, each described by up to 6 independent moduli -- that enable us to study the boundary-driven response in geometries that mimic common rheology methods. OPN solutions reveal three physically distinct resonances in odd viscoelastic solids that are characteristic of the underlying material moduli and can all be interpreted within a single geometric framework. Underlying this unification is an equivalent description of overdamped odd viscoelastic materials in terms of damped harmonic oscillators. Resonances appear as the effective damping coefficients of these oscillators vanish, which is facilitated by the activity that powers odd material properties.", "url": "https://arxiv.org/abs/2605.24276", "type": "理论", "summary": "1. 该工作将经典Papkovich-Neuber解推广至奇活性材料，提出了奇Papkovich-Neuber（OPN）解析解，用于描述各向同性线性奇流体或固体的边界驱动响应，并涵盖多达六个独立模量。\n2. 其主要物理发现是揭示出过阻尼奇粘弹性固体中存在三种特征性共振，这些共振源于体系等效阻尼谐振子的有效阻尼系数因活性驱动而消失。\n3. 这为基于简单流变几何的奇材料模量推断提供了统一解析框架，并启发在活性手性体系中对这类本征共振的实验观测。", "summary_source": "deepseek", "authors": [{"name": "Julius Kiln"}, {"name": "Alexander Mietke"}], "featured_authors": [{"name": "Julius Kiln"}, {"name": "Alexander Mietke"}], "author_count": 2}, {"id": "2605.24334", "category": "cond-mat", "title": "Systematic comparison of approximations and functionals in first-principle calculations of aluminum-based III-V ferroelectric nitrides", "abstract": "We revisit first-principles predictions of structural, ferroelectric, and electronic properties in aluminum-based III-V nitride alloys, focusing on Al1-xScxN and Al1-xBxN. Using density functional theory within a unified 48-atom supercell framework, we systematically assess the role of chemical disorder and exchange-correlation approximations by comparing the virtual crystal approximation (VCA) and special quasirandom structures (SQS), as well as PBE, PBESol, SCAN, and SCAN+rVV10 functionals. We demonstrate that, even amongst the similar PBE and PBESol functionals, big quantitative and qualitative differences emerge. In particular, the VCA or SQS PBESol (a popular functional) strongly underestimate the stability domain of the ferroelectric wurtzite phase in Al1-xScxN compared to SQS PBE or SQS SCAN. We demonstrate that the 5-fold coordinated hexagonal phase predicted in 2002 by Farrer and Bellaiche [Phys. Rev. B 66, 201203] is a low-energy metastable state between the four-fold coordinated ferroelectric wurtzite phase and the six-fold coordinated rocksalt phase near the transition point upon increasing the Sc content. In contrast, Al1-xBxN shows a much faster destabilization of the wurtzite ferroelectric phase, with bond breaking which strongly distorts the wurtzite structure (with enhanced polarization) and eventually favor a zincblende phase and a threefold coordinated hexagonal layer phase. Our analysis highlights the critical importance of both local disorder and exchange-correlation treatment in predicting the functional properties of III-V nitride ferroelectrics. Overall, SQS combined with SCAN provides the most consistent theoretical framework for understanding and optimizing emerging nitride-based ferroelectric materials.", "url": "https://arxiv.org/abs/2605.24334", "type": "理论+数值", "summary": "1. 该工作系统比较了虚拟晶体近似与特殊准随机结构，以及PBE、PBESol、SCAN等泛函对铝基III-V氮化物铁电体第一性原理预测的影响。\n2. 其核心发现是PBESol显著低估Al1-xScN铁电纤锌矿相的稳定区间，而SQS结合SCAN提供最一致的理论框架。\n3. 这揭示了局域无序与交换关联处理对氮化物铁电功能性质预测的关键作用，为材料优化与新兴铁电设计提供了可靠基准。", "summary_source": "deepseek", "authors": [{"name": "Alejandro Mercado Tejerina"}, {"name": "Peng Chen"}, {"name": "Keisuke Yazawa"}, {"name": "Andriy Zakutayev"}, {"name": "Laurent Bellaiche"}, {"name": "Charles Paillard"}], "featured_authors": [{"name": "Alejandro Mercado Tejerina"}, {"name": "Peng Chen"}, {"name": "Keisuke Yazawa"}, {"name": "Andriy Zakutayev"}, {"name": "Laurent Bellaiche"}, {"name": "Charles Paillard"}], "author_count": 6}, {"id": "2605.24365", "category": "cond-mat", "title": "Thermodynamics of classifiers", "abstract": "The Landauer principle bridges the energetic cost and information processing, showing that irreversible computation inevitably demands energy dissipation. As energy demands from computation continue to rise, approximate computing has attracted considerable attention. Approximate computing is based on the idea that energy consumption can be reduced by sacrificing computational accuracy. This raises a fundamental question about the relationship between error and thermodynamic cost in information processing. In this study, we derive the error-cost trade-off in the binary classifier by considering classification based on Markov processes. We obtain the lower bounds on the Bayes error in terms of thermodynamic costs such as entropy production and dynamical activity. Our results show that when entropy production or dynamical activity vanishes, the Bayes error reaches $1/2$, equivalent to random guessing, while greater thermodynamic costs enable lower error. This establishes a fundamental trade-off between error and cost in information processing by thermodynamic systems. Because the Bayes error provides the lowest achievable error among all possible classifiers, the classification error cannot fall below the obtained bounds given the entropy production or dynamical activity. We also discuss the quantum generalization and show that the Bayes error of the quantum classifier is bounded from below by the variance of the Hamiltonian.", "url": "https://arxiv.org/abs/2605.24365", "type": "理论", "summary": "1. 该工作基于马尔可夫过程推导了二元分类中贝叶斯误差与热力学成本（熵产生和动力学活动）之间的基本权衡关系。\n2. 核心发现是当熵产生或动力学活动为零时贝叶斯误差必为1/2，且更大的热力学成本允许更低的误差界。\n3. 这一结果建立了信息处理精度与能耗的基本折中，并启发量子分类器误差受哈密顿量方差的下界约束。", "summary_source": "deepseek", "authors": [{"name": "Yoshihiko Hasegawa"}], "featured_authors": [{"name": "Yoshihiko Hasegawa"}], "author_count": 1}, {"id": "2605.24376", "category": "cond-mat", "title": "Dilute Magnetism and Edge-State Engineering in Monolayer SnO", "abstract": "Tin monoxide (SnO) is a p-type oxide semiconductor whose electronic properties can be widely modified via atomic-scale engineering. Using density functional theory, we investigate the electronic and magnetic properties of transition-metal (TM = Mn, Fe, Co and W) doped SnO monolayer within a large supercell. We find that all dopants induce finite localized magnetic moments, primarily originating from $d$-orbitals of the impurity atoms. We show that these localized magnetic states give rise to nearly dispersionless bands in the vicinity of the Fermi energy (taking Co doped SnO as an example). In addition, we investigate dimensional effects by constructing nanoribbon geometries of SnO monolayer. The ribbons exhibit intrinsic edge-localized states that are largely independent of ribbon width. For chiral nanoribbons oriented along a low-symmetry direction of the square lattice, we find that oxygen-rich edges are thermodynamically most stable and remain semiconducting, whereas Sn-terminated edges host metallic one-dimensional conduction channels. Our results demonstrate that transition-metal doping and edge engineering provide effective routes to tailor the electronic properties of SnO monolayer, making it a promising candidate for future spintronic and nanoelectronic applications.", "url": "https://arxiv.org/abs/2605.24376", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算研究了过渡金属掺杂SnO单层的稀磁性和边缘态工程，分析了Mn、Fe、Co和W掺杂的电子结构与磁性。\n2. 技术核心在于揭示了杂质d轨道诱导的局域磁矩及近费米能级准无色散平带，并发现手性纳米带的氧终止边保持半导体性而锡终止边呈现金属一维通道。\n3. 这为通过掺杂和边缘工程协同调控二维氧化物半导体磁性及导电通道，进而设计自旋电子学和纳米电子学器件提供了明确路线。", "summary_source": "deepseek", "authors": [{"name": "Yuya Fukuta"}, {"name": "Souren Adhikary"}, {"name": "Kazuhito Tsukagoshi"}, {"name": "Katsunori Wakabayashi"}], "featured_authors": [{"name": "Yuya Fukuta"}, {"name": "Souren Adhikary"}, {"name": "Kazuhito Tsukagoshi"}, {"name": "Katsunori Wakabayashi"}], "author_count": 4}, {"id": "2605.24378", "category": "cond-mat", "title": "Light-Driven Ferroic Switching Enables Reversible Control of Hydrogen Adsorption Thermodynamics", "abstract": "Reversible ultrafast switching of surface thermodynamics is highly desirable for hydrogen storage and catalysis yet remains elusive at the nanoscale. Here we demonstrate that photoinduced ferroic-order switching in two-dimensional ionic ferroelectric monolayers enables rapid, reversible control of hydrogen binding. In TiGeSe$_3$, carrier-density-driven redistribution of transition-metal 3\\textit{d} orbital occupations triggers a sequential evolution from the ferroelectric ground state to paraelectric phases with staggered or Zig-Zag antiferromagnetic order. This switch continuously tunes the hydrogen adsorption free energy from 0.33 to 1.11 eV, shifting the interface from near-thermoneutrality to spontaneous desorption. Nonadiabatic dynamics indicate that electron-phonon coupling promotes nonthermal H release, while picosecond carrier recombination rapidly restores the initial ferroic order, closing an ultrafast reversible cycle. Generality is further validated in AgBiP$_2$Se$_6$ and CuInP$_2$S$_6$, establishing ferroic order as an optically addressable knob for dynamic thermodynamic reconfiguration beyond static design.", "url": "https://arxiv.org/abs/2605.24378", "type": "理论", "summary": "1. 该工作展示了二维离子铁电单层中光致铁性序切换实现氢吸附热力学的快速可逆控制。\n2. 其核心在于载流子密度驱动的过渡金属3d轨道占据变化触发铁电-顺电与反铁磁相变，连续调谐氢吸附自由能达0.33–1.11 eV。\n3. 这为超越静态设计的动态表面热力学重构建立了光学可寻址的铁性开关机制，并验证了在多种铁电材料中的普适性。", "summary_source": "deepseek", "authors": [{"name": "Xueqing Wan"}, {"name": "Zhenlong Zhang"}, {"name": "Charles Paillard"}, {"name": "Jian Zhou"}, {"name": "Jinyang Ni"}, {"name": "Chuanlu Yang"}, {"name": "Zhijun Jiang"}, {"name": "Laurent Bellaiche"}], "featured_authors": [{"name": "Xueqing Wan"}, {"name": "Zhenlong Zhang"}, {"name": "Charles Paillard"}, {"name": "Chuanlu Yang"}, {"name": "Zhijun Jiang"}, {"name": "Laurent Bellaiche"}], "author_count": 8}, {"id": "2605.24382", "category": "cond-mat", "title": "Colossal Type-II Multiferroic Polarization Driven by Collinear Spin Orders", "abstract": "Achieving strong magnetoelectric coupling (MEC) together with large ferroelectric polarization remains a central challenge in type-II multiferroics. In conventional spin-driven multiferroics, the induced polarization is usually mediated by spin-orbit coupling (SOC) or spin-lattice coupling (SLC). Since many representative systems are based on 3d transition-metal ions, where SOC is relatively weak and SLC-induced lattice distortions are often limited, their polarizations are typically much smaller than those of proper ferroelectrics. Moreover, electric polarizations in type-II multiferroics are generally induced by spiral spin orders stabilized by competing magnetic interactions, which often leads to relatively low magnetic transition temperatures. In this Letter, using spin-group symmetry, we propose an SOC- and SLC-independent route to MEC in collinear 3d magnetic systems. We show that, even for a noncentrosymmetric lattice structure, different collinear magnetic configurations can either forbid or allow electric polarization, indicating direct magnetic control of polarization and hence strong MEC. The first-principles calculations excluding SOC on monolayer 2H-VS2 support this picture: a collinear stripy antiferromagnetic order induces an in-plane ferroelectric polarization up to 25.00 {\\mu}C/cm2, about two orders of magnitude larger than that of typical type-II multiferroics. Furthermore, our microscopic model suggests that the induced polarization originates from SOC-independent p-d hybridization governed by electronic hopping. Our results suggest a possible route toward type-II multiferroics combining strong MEC with large electronic polarization in collinear 3d magnetic systems.", "url": "https://arxiv.org/abs/2605.24382", "type": "理论+数值", "summary": "1. 本文提出一种基于自旋群对称性、不依赖自旋轨道耦合与自旋晶格耦合的磁电耦合新路径，在共线3d磁体中实现强铁电极化。\n2. 其核心在于利用非中心对称晶格中不同共线磁序对极化的允许或禁止，并通过电子跳跃主导的p-d杂化机制，在单层2H-VS2中获得高达25.00 μC/cm²的面内铁电极化。\n3. 该工作为在共线3d磁性体系中同时实现强磁电耦合与大电子极化提供了明确的设计思路和材料平台。", "summary_source": "deepseek", "authors": [{"name": "Chengxi Huang"}, {"name": "Xinhai Tu"}, {"name": "Jintao Jiang"}, {"name": "Xiangang Wan"}, {"name": "Erjun Kan"}], "featured_authors": [{"name": "Chengxi Huang"}, {"name": "Xinhai Tu"}, {"name": "Jintao Jiang"}, {"name": "Xiangang Wan"}, {"name": "Erjun Kan"}], "author_count": 5}, {"id": "2605.24409", "category": "cond-mat", "title": "Spiral and Mixed Plaquette-Dimer Phases in the $S=1$ and $3/2$ Shastry-Sutherland Heisenberg Model", "abstract": "We investigate the ground-state phase diagram of the $S=1$ and $S=3/2$ Heisenberg model on the two-dimensional Shastry-Sutherland lattice (SSL) using density matrix renormalization group (DMRG) and cluster mean-field theory (CMFT). Between the dimer phase and Néel antiferromagnetic phases, we identify two intermediate phases: a mixed plaquette-dimer (MPD) phase and a spiral phase. These phases are characterized via bond energies and spin-spin correlation functions; phase boundaries are located from the ground-state energy derivative and entanglement entropy. The MPD phase exhibits strong intradimer correlations and weak tetramerization on the empty plaquettes, and its transitions to the dimer and spiral phases are first order. Combining our results with the known boundaries for $S=1/2$ and the classical limit $S\\to\\infty$, we construct a global $S$-$g$ phase diagram. This diagram reveals the progressive suppression of quantum effects with increasing $S$ and offers a theoretical framework for larger-$S$ SSL materials.", "url": "https://arxiv.org/abs/2605.24409", "type": "理论+数值", "summary": "1. 该工作利用密度矩阵重正化群与团簇平均场理论，确定了S=1与3/2 Shastry-Sutherland海森伯模型的基态相图。\n2. 其核心发现在于揭示了介于二聚体相和奈尔反铁磁相之间的混合plaquette-dimer相与螺旋相，并通过键能和自旋关联函数给出了相变特征。\n3. 结合低自旋与经典极限的结果构建的全局S-g相图，揭示了量子效应随自旋增大的抑制规律，为更高自旋SSL材料的理论描述提供了框架。", "summary_source": "deepseek", "authors": [{"name": "Han-Qing Wu"}, {"name": "Muwei Wu"}, {"name": "Shou-Shu Gong"}], "featured_authors": [{"name": "Han-Qing Wu"}, {"name": "Muwei Wu"}, {"name": "Shou-Shu Gong"}], "author_count": 3}, {"id": "2605.24430", "category": "cond-mat", "title": "Superconfined Antiferromagnons on the Two-Dimensional Penrose Lattice", "abstract": "We find novel confined states in the spin-$S$ nearest-neighbor antiferromagnetic Heisenberg model on the two-dimensional Penrose lattice. Linear spin waves have massively degenerate eigenstates strictly confined to tricoordinated sites. They contrast with the well-known itinerant analogs in the tight-binding model, where electrons are confined but extended to both tricoordinated and pentacoordinated sites. It is the site potentials in the spin-wave Hamiltonian, originating from Coulomb interactions between electrons, that confine spin waves to minimally coordinated sites only. Confined states in the tight-binding Hamiltonian consist of six types of building blocks, whereas those in the spin-wave Hamiltonian consist of only four of them. Confined spin waves are robust against $1/S$ corrections. Emergent $O(S^{0})$ interactions further confine -- superconfine -- spin waves into two separate groups within tricoordinated sites.", "url": "https://arxiv.org/abs/2605.24430", "type": "理论", "summary": "1. 该工作在二维彭罗斯晶格上的自旋-S反铁磁海森堡模型中发现了严格局限在三配位点的超束缚自旋波态。\n2. 其核心在于自旋波哈密顿量中的位点势源自电子库仑相互作用，仅将自旋波限制在最小配位点，且束缚态对1/S修正鲁棒，并存在O(S^0)相互作用导致的组内超束缚。\n3. 这为准晶体系中磁性激发的几何束缚机制提供了新视角，并启示了探索拓扑序与局域化协同效应的方向。", "summary_source": "deepseek", "authors": [{"name": "Takashi Inoue"}, {"name": "Shoji Yamamoto"}], "featured_authors": [{"name": "Takashi Inoue"}, {"name": "Shoji Yamamoto"}], "author_count": 2}, {"id": "2605.24439", "category": "cond-mat", "title": "Emergence of Triplet Superconductivity from Cavity Vacuum Fluctuations", "abstract": "Engineering quantum materials with cavity fields has emerged as a powerful route to manipulate phases of quantum matter in solids. Here we demonstrate that cavity vacuum fluctuations alone can drive the emergence of triplet superconductivity in an otherwise singlet superconductor. The vacuum field renormalizes the electronic band structure in a polarization dependent manner, reshaping the Fermi surface and altering the competition among symmetry allowed pairing channels. As a result, multiple superconducting phases arise from the cavity vacuum fluctuations. Above a critical light matter coupling, the leading instability switches from singlet to triplet pairing, yielding a superconducting state absent in the bare material. This vacuum induced symmetry transition produces distinct modifications of the gap structure and low energy quasiparticle spectrum. Our results establish cavity vacuum engineering as a mechanism for generating unconventional superconducting phases and stabilizing triplet states of potential relevance for topological superconductivity.", "url": "https://arxiv.org/abs/2605.24439", "type": "理论", "summary": "1. 该工作展示了腔真空涨落本身可驱动原本的单重态超导体转变为三重态超导。\n2. 其核心在于真空场以极化依赖方式重整化电子能带结构，重塑费米面并改变对称性允许的配对通道，从而诱导超导相变。\n3. 这为利用腔真空工程产生非常规超导相和稳定三重态提供了机制，对拓扑超导研究具有潜在启发。", "summary_source": "deepseek", "authors": [{"name": "Xin-Xin Yang"}, {"name": "Shuai Zhang"}, {"name": "Kun Ding"}, {"name": "Xiaopeng Li"}], "featured_authors": [{"name": "Xin-Xin Yang"}, {"name": "Shuai Zhang"}, {"name": "Kun Ding"}, {"name": "Xiaopeng Li"}], "author_count": 4}, {"id": "2605.24455", "category": "cond-mat", "title": "Multi-Source Domain Transfer Learning for Accurate Property Prediction in Two-Dimensional Materials", "abstract": "Machine learning has revolutionized materials discovery, but data scarcity remains a critical bottleneck for complex functional properties. As emerging systems, two-dimensional (2D) materials possess limited overall data volumes. Evaluating their diverse functional properties requires time-consuming simulations, hindering unified high-throughput screening. Furthermore, restrictions in known structural prototypes lead to highly fragmented data distributions. To address these challenges, we propose a multi-source domain transfer learning framework to extract generalizable and complementary knowledge from diverse crystalline systems. To mitigate data scarcity, the framework employs a shared feature extractor that integrates adversarial transfer learning with maximum mean discrepancy, mapping crystal structures into a domain-invariant latent space while preserving underlying physical correlations. To resolve distribution fragmentation, a sample-adaptive weighted ensemble strategy is subsequently utilized to dynamically aggregate predictions from multiple source domains. Relying solely on crystal structures, the framework predicts 2D carrier mobilities with an R2 score exceeding 0.90. The framework successfully screened 55 novel high-mobility 2D semiconductors, which were validated via first-principles electron-phonon coupling analysis, confirming their exceptional transport properties and stability. This work can potentially accelerate machine learning-assisted materials design and discovery with less data restriction.", "url": "https://arxiv.org/abs/2605.24455", "type": "理论+数值", "summary": "1. 该工作提出多源域迁移学习框架，从多种晶体系统提取可泛化互补知识，以解决二维材料数据稀缺与分布碎片化问题。\n2. 其核心在于结合对抗迁移学习与最大均值差异构建域不变隐空间，并采用样本自适应加权集成策略动态聚合多源域预测。\n3. 仅凭晶体结构预测载流子迁移率R²超过0.90，筛选出的55种高迁移率二维半导体经第一性原理验证，为低数据依赖的材料设计提供了范式。", "summary_source": "deepseek", "authors": [{"name": "Huiyang Zhang"}, {"name": "Xinyu Chen"}, {"name": "Qionghua Zhou"}, {"name": "Jinlan Wang"}], "featured_authors": [{"name": "Huiyang Zhang"}, {"name": "Xinyu Chen"}, {"name": "Qionghua Zhou"}, {"name": "Jinlan Wang"}], "author_count": 4}, {"id": "2605.24467", "category": "cond-mat", "title": "The peculiar response of Kelvin-Voigt chains with a free end", "abstract": "We exactly solve a model of a heterogeneous chain of overdamped, harmonically coupled particles with momentum-conserving dissipation. Despite being governed by a non-symmetric drift operator, the system admits an analytical diagonalization by use of a forward-difference transformation. In case of one free end, the response matrix shows a peculiar staircase form: the response of particle i to a force acting on particle j is independent of the properties and the length of the chain-part between i and j. For rank-deficient interaction matrices, the state space is decomposed into free and constrained subspaces. We demonstrate that this separation has clear physical consequences: the free subspace governs steady state responses, while the constraint subspace governs the relaxation after cessation of forcing. These results establish a framework for analyzing heterogeneous overdamped dynamics with momentum conservation.", "url": "https://arxiv.org/abs/2605.24467", "type": "理论", "summary": "1. 该工作精确求解了具有自由端的异质Kelvin-Voigt过阻尼链模型，并实现了非对称漂移算符的解析对角化。\n2. 其核心技术在于利用前向差分变换揭示响应矩阵的阶梯形式：粒子i对j作用的响应独立于中间链段的性质与长度。\n3. 这为秩亏缺相互作用系统中自由与约束子空间的物理分离及稳态与弛豫行为的统一分析提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Rupayan Saha"}, {"name": "Matthias Krüger"}], "featured_authors": [{"name": "Rupayan Saha"}, {"name": "Matthias Krüger"}], "author_count": 2}, {"id": "2605.24474", "category": "cond-mat", "title": "Techno-economic Analysis of Light Isotope-enriched Elements for Lightweighting Applications", "abstract": "Lightweighting is critical to mass-sensitive applications such as aircraft and space transportation. Conventional lightweight strategies often rely on new designs of materials and structures. An alternative approach is to enrich the lightest stable isotopes in an element to reduce the elements atomic mass while having little effect on structural and chemical properties. However, the economic feasibility of this concept remains unclear. Here we present a techno-economic analysis of light isotope-enriched elements for lightweighting applications by estimating isotope enrichment cost and the economic gain from mass reduction. The enrichment cost is scaled from established large-scale processes. Twelve common aerospace-relevant elements are considered, including Li, B, C, Mg, Cl, Ti, Ni, Fe, Cu, Zn, Mo, and Sn. We find that nine elements, especially Li, B, Zn, Ni, Mo, and Sn, show potentially attractive economic benefit at moderate enrichment levels, whereas C, Mg, and Fe provide little or no benefit. With the optimized enrichment levels, an Airbus A380 is expected to save approximately USD 700 K over a 30-year operational lifetime, a SpaceX Falcon 9 could save USD 516 K, and a SpaceX Starship is expected to save USD 2.37 million over its whole lifetime. While the exact enrichment cost needs to be further investigated, these results provide an initial screening of promising candidate elements and highlight isotopic mass reduction as a potential drop-in lightweighting strategy.", "url": "https://arxiv.org/abs/2605.24474", "type": "理论+数值", "summary": "1. 该工作对轻同位素富集元素在航空航天轻量化中的经济可行性进行了技术经济分析，评估了12种常见元素的富集成本与质量减轻收益。\n2. 其核心发现是Li、B、Zn等9种元素在适度富集水平下具有潜在经济吸引力，并量化了空客A380等机型全寿命周期数百万美元的预期节省。\n3. 这为同位素质量减轻作为“即插即用”轻量化策略提供了初始筛选，并指出了需进一步验证的具体候选元素及成本优化方向。", "summary_source": "deepseek", "authors": [{"name": "Wenbo Bao"}, {"name": "Zhihao Yang"}, {"name": "Taeyoung Wang"}, {"name": "Joseph F. Wild"}, {"name": "Yuan Yang"}], "featured_authors": [{"name": "Wenbo Bao"}, {"name": "Zhihao Yang"}, {"name": "Taeyoung Wang"}, {"name": "Joseph F. Wild"}, {"name": "Yuan Yang"}], "author_count": 5}, {"id": "2605.24502", "category": "cond-mat", "title": "Implicit Binarization via Complex Phase Dynamics in Combinatorial Optimization", "abstract": "We introduce a physics-inspired continuous relaxation framework that yields substantially improved solutions for NP-hard combinatorial optimization problems, including Quadratic Unconstrained Binary Optimization (QUBO), binary sparse coding, and planted-solution Ising models. By parameterizing discrete binary variables as continuous wave-like states on the complex unit circle, we inherently smooth highly non-convex energy landscapes. We show that representing binary variables as complex phases reveals an implicit regularization mechanism that promotes convergence toward discrete states. Extracting this mechanism yields significant improvements even within standard real-valued optimization frameworks, using this regularizer explicitly. Empirically, this regularization yields vastly higher ground-state convergence rates than standard real-valued alternatives. Our models achieved zero error in large-scale 160x160 QUBO tasks under severe noise (sigma=0.25), and outperformed traditional algorithms (OMP and LASSO) in underdefined sparse coding with perfect recovery at sigma=0.15. The solver's robustness was further validated by recovering exact ground-state configurations in 8 out of 11 rigorously engineered planted-solution benchmarks.", "url": "https://arxiv.org/abs/2605.24502", "type": "理论+数值", "summary": "1. 该工作提出一种基于复相位动力学的连续松弛框架，将离散二元变量参数化为复单位圆上的连续波态，以求解QUBO、二元稀疏编码等NP难组合优化问题。\n2. 其核心卖点是揭示了一种隐式二值化正则化机制，该机制通过平滑高度非凸的能量景观促进态收敛至离散二元解，并可显式移植至标准实值优化框架。\n3. 这一物理启发的松弛方法在强噪声下实现了大规模组合优化问题的高效精确求解，为设计鲁棒且可扩展的启发式优化算法提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Khen Cohen"}, {"name": "Mark Glass"}, {"name": "Meir Feder"}, {"name": "Yaron Oz"}], "featured_authors": [{"name": "Khen Cohen"}, {"name": "Mark Glass"}, {"name": "Meir Feder"}, {"name": "Yaron Oz"}], "author_count": 4}, {"id": "2605.24510", "category": "cond-mat", "title": "Strong Eigenstate Thermalization from Mean-Ergodic Non-chaotic Dynamics", "abstract": "We report an example of a many-body system, derived from the double kicked top (DKT), with non-chaotic yet mean-ergodic dynamics that displays \\textit{strong} eigenstate thermalization hypothesis (ETH) in the quantum regime. The analysis addresses a key open question: whether \\textit{strong} ETH is a quantum analog of ergodicity (or mean-ergodicity). Despite non-chaotic dynamics, the fluctuations of the diagonal matrix elements of an observable scale as $D^{-1/2}$, where $D$ denotes the Hilbert space dimension. Furthermore, the off-diagonal matrix elements show Gaussian statistics together with a smooth function $f_O(\\bar{E}, \\omega)$ that becomes nearly uniform in the large-$k_\\theta$ domain. Our findings show that even mean-ergodic and non-chaotic systems can exhibit \\textit{strong} ETH.", "url": "https://arxiv.org/abs/2605.24510", "type": "理论", "summary": "1. 该工作从双脉冲顶模型导出多体系统，发现其非混沌但平均遍历的动力学可呈现强本征态热化。\n2. 技术核心在于可观测量对角矩阵元涨落按希尔伯特空间维度的负二分之一次幂标度，非对角元呈高斯统计且光滑谱函数在大耦合区近均匀。\n3. 这揭示了平均遍历而非混沌已足够实现强ETH，为量子热化与遍历性关系提供关键反例。", "summary_source": "deepseek", "authors": [{"name": "Avadhut V. Purohit"}, {"name": "Harshit Sharma"}, {"name": "Udaysinh T. Bhosale"}], "featured_authors": [{"name": "Avadhut V. Purohit"}, {"name": "Harshit Sharma"}, {"name": "Udaysinh T. Bhosale"}], "author_count": 3}, {"id": "2605.24537", "category": "cond-mat", "title": "Rare events of small-noise Doob conditioned processes", "abstract": "Doob fixed-time conditioning enables the sampling of rare trajectories of Markov processes by modifying the drift so that reaching a prescribed target at a given time is guaranteed. We study the statistics of this conditioned path ensemble through the moment generating function in the weak-noise large deviation regime. Since the Doob drift is rarely available in closed form, we reinterpret the conditioned ensemble as the original process post-selected on the terminal constraint, thereby avoiding explicit construction of the Doob transform. This viewpoint then yields an optimal-control representation for the leading exponential contribution to the generating function, expressed as a variational principle with terminal boundary conditions set by the Doob end-point constraint. We illustrate the framework with two analytical examples and with an application to heat dissipation of a minimal model of biomolecular folding.", "url": "https://arxiv.org/abs/2605.24537", "type": "理论+数值", "summary": "1. 本文在弱噪声大偏差框架下，借助矩生成函数刻画Doob固定时间条件过程的稀有事件统计。\n2. 其技术核心在于避免直接构造通常无闭式的Doob漂移，将条件系综重新解释为原过程在终端约束下的后选择，进而导出由终点Doob约束控制边界条件的最优控制变分原理，以获取主导指数贡献。\n3. 该框架为稀有轨迹路径系综的分析提供可操作的变分方法，已被解析例证及生物分子折叠热耗散最小模型验证，有望推广至更广泛的涨落问题。", "summary_source": "deepseek", "authors": [{"name": "Iago N. Mamede"}, {"name": "Francesco Coghi"}], "featured_authors": [{"name": "Iago N. Mamede"}, {"name": "Francesco Coghi"}], "author_count": 2}, {"id": "2605.24557", "category": "cond-mat", "title": "Application and Performance Assessment of Annealing Methods for Electrostatic-Energy-Based Configuration Search in Mixed Crystals", "abstract": "In first-principles design of solid solutions and disordered materials, exhaustive evaluation of all possible substitutional configurations is often impractical because the number of site occupations increases exponentially. Here, we develop a framework for pre-screening mixed-crystal configurations using annealing methods, where the Ewald electrostatic energy is used as the objective function. Substitutional occupations are represented by binary variables, allowing the Ewald energy to be mapped onto an Ising-type Hamiltonian and the search for low-energy configurations to be formulated as a combinatorial optimization problem. We implement this formulation using simulated annealing (SA) and quantum annealing (QA), and benchmark their performance against exhaustive search. For the small-scale system CaYAlO$_4$, SA achieved a speed-up of about 30 times, while QA achieved a speed-up of more than 100 times; both methods identified all lowest-energy configurations. For the medium-scale system $\\beta$-KSbF$_4$ and the large-scale Ba-doped SiAlON system, SA achieved speed-ups of about 200-300 times while robustly identifying the lowest-energy structures. In contrast, QA was effective for the small-scale case but showed limited speed-up for medium-scale problems and missed some low-energy configurations due to chain breaks. These results indicate that SA is currently the most robust and general-purpose approach for rapid pre-screening of mixed-crystal configurations based on electrostatic energy. The proposed formulation can be implemented automatically using publicly available libraries and provides a practical route for accelerating candidate-structure generation before first-principles calculations.", "url": "https://arxiv.org/abs/2605.24557", "type": "理论+数值", "summary": "1. 该工作开发了基于退火方法的混合晶体构型预筛选框架，将Ewald静电能映射为Ising哈密顿量，把低能构型搜索转化为组合优化问题。\n2. 模拟退火在小、中、大尺度体系中分别实现约30倍、200–300倍加速并稳健识别最低能结构，而量子退火仅在小尺度有效，中尺度因链断裂受限。\n3. 该框架可利用公开库自动实现，为第一性原理计算前的候选结构生成提供实用加速路径，其中模拟退火是当前最鲁棒通用的方案。", "summary_source": "deepseek", "authors": [{"name": "Tack Saquai"}, {"name": "Kenta Hongo"}, {"name": "Ryo Maezono"}, {"name": "Tom Ichibha"}], "featured_authors": [{"name": "Tack Saquai"}, {"name": "Kenta Hongo"}, {"name": "Ryo Maezono"}, {"name": "Tom Ichibha"}], "author_count": 4}, {"id": "2605.24720", "category": "cond-mat", "title": "Quantum Printing: Laguerre-Gaussian Beam Induced Topological Magnetic Textures", "abstract": "Structured light has become a practical tool for controlling matter by applying tailored, space- and time-dependent electromagnetic fields. We show that Laguerre-Gaussian pulses imprint non-collinear magnetic textures via the spatial structure of optical magnetic field. Our route offers a direct spatial selectivity determined by the optical features without relying on material anisotropic interactions. The proposed printing approach does not require interfacial anisotropy or bulk chirality, current-driven torques, or thermal quenching. We use micromagnetic simulations to demonstrate the potential to create topological charge density emerging during the pulse and reveal control through the optical topological properties and polarization. These results suggest structured-light quantum printing as a viable approach for magnonics and motivate studies toward reconfigurable topological textures enabled by ultrafast THz optics and non-thermal control.", "url": "https://arxiv.org/abs/2605.24720", "type": "理论+数值", "summary": "1. 该工作提出利用拉盖尔-高斯脉冲的光学磁场空间结构在材料中印刻非共线磁织构的方法。\n2. 其技术卖点在于直接通过光学特征实现空间选择性，无需依赖各向异性、手性、电流或热淬火。\n3. 这为基于超快太赫兹光学的可重构拓扑磁织构非热控制提供了可行途径，并启发了磁子学研究。", "summary_source": "deepseek", "authors": [{"name": "Yuefei Liu"}, {"name": "Tien-Tien Yeh"}, {"name": "Alexander V. Balatsky"}], "featured_authors": [{"name": "Yuefei Liu"}, {"name": "Tien-Tien Yeh"}, {"name": "Alexander V. Balatsky"}], "author_count": 3}, {"id": "2605.24814", "category": "cond-mat", "title": "Analytic Origin of Green-Function Compression in the Intermediate Representation", "abstract": "Information compression plays a central role in diverse fields of modern science and technology, from communication theory to machine learning. In condensed-matter physics, the intermediate representation (IR) basis has recently been developed as an efficient method for compressing imaginary-time Green functions, which are fundamental quantities for describing quantum many-body systems. This compression relies on the rapid decay of the singular values with the basis index and the unusually weak growth of the effective rank with inverse temperature. Because of these useful features, the IR basis is now widely used as a standard method in quantum many-body calculations. However, the analytic origin of its compression capability has remained unclear. Here we uncover a finite-Laplace-transform structure underlying the IR kernel, which reveals that the eigenfunctions of the IR kernel admit a natural expansion in terms of classical special functions, the oblate spheroidal wave functions. This finite-Laplace-transform structure also enables us to analytically clarify the compression mechanism of the IR basis. Our results provide a mathematical foundation for the compression of imaginary-time Green functions, connecting quantum many-body physics with theories of information compression and finite integral transforms.", "url": "https://arxiv.org/abs/2605.24814", "type": "理论+数值", "summary": "1. 该工作揭示了中间表示基压缩虚时格林函数的解析起源，发现其核函数具有有限拉普拉斯变换结构。\n2. 通过将本征函数展开为扁球面波函数，解析说明了有效秩随逆温度弱增长的压缩机制。\n3. 这为量子多体计算中的格林函数压缩提供了数学基础，并连接了信息压缩与有限积分变换理论。", "summary_source": "deepseek", "authors": [{"name": "Takahiro Misawa"}], "featured_authors": [{"name": "Takahiro Misawa"}], "author_count": 1}, {"id": "2605.24887", "category": "cond-mat", "title": "Edge Dislocation Mediated Anomalous Charge Transfer in Face Centered Cubic High Entropy Alloys", "abstract": "Charge transfer in concentrated alloys governs their structural stability and functional response, and can be strongly perturbed by lattice defects. In high-entropy alloys, the interaction between edge dislocations and volume misfit plays a central role in solid-solution strengthening models; however, the influence of dislocations on the local charge transfer has not been explicitly investigated. In this work, large-scale ab initio calculations are employed to examine the dislocation-mediated charge transfer in CoNi, CoCrNi and CoCrFeMnNi alloys. The calculations reveal an anomalous charge redistribution near edge dislocation cores, including deviation from the conventional electronegativity trend. The observed behavior is shown to originate from collective electronegativity equalisation effects rather than simple pairwise atomic interactions. Furthermore, the asymmetric atomic volume response within the compressive and tensile regions of the dislocation field is rationalised in terms of anomalous magneto-volume fluctuations. These results establish a direct coupling between dislocation-induced electronic redistribution and local volumetric response in chemically complex alloys. The demonstrated coupling between dislocation-mediated charge transfer and atomic volume fluctuations provides a pathway toward electronically informed solid-solutions strengthening models and defect-aware alloy design strategy for chemically complex alloys. These findings further suggest that local electronic redistribution near dislocation-cores can play a critical role in governing the deformation behavior and defect-enbergetics in high-entropy alloys.", "url": "https://arxiv.org/abs/2605.24887", "type": "理论+数值", "summary": "1. 该工作利用大规模第一性原理计算，研究了面心立方高熵合金中边缘位错介导的反常电荷转移行为。\n2. 其核心发现是位错芯附近电荷重分布偏离常规电负性趋势，源于集体电负性均衡而非简单对相互作用，并将非对称原子体积响应归因于反常磁体积涨落。\n3. 这建立了位错诱导电子重分布与局域体积响应间的直接耦合，为发展电子层面固溶强化模型和缺陷感知合金设计提供了思路。", "summary_source": "deepseek", "authors": [{"name": "Gautam Anand"}, {"name": "Swarnava Ghosh"}, {"name": "Suman Chabri"}, {"name": "Markus Eisenbach"}], "featured_authors": [{"name": "Gautam Anand"}, {"name": "Swarnava Ghosh"}, {"name": "Suman Chabri"}, {"name": "Markus Eisenbach"}], "author_count": 4}, {"id": "2605.24927", "category": "cond-mat", "title": "Strong Correlation Effect and In-gap State in the Doped Electron-Hole Two-Band Hubbard Model Based on the Dynamical Mean-Field Theory", "abstract": "We investigate the strong correlation effect in the spinless electron-hole two-band Hubbard model using the dynamical mean-field theory. At half filling, both the renormalization factor $Z$ and the number of conduction electrons (valence holes) $n_c$ decrease with increasing the interband Coulomb interaction $U$ down to $Z\\sim 0.15$ and $n_c\\sim 0.1$ for $U_c \\sim \\mbox{bandwidth}$ at which the first-order Lifshitz transition occurs from a correlated semimetal with a large effective mass $m^*/m=Z^{-1}$ to a band insulator with a finite gap due to the Hartree shift. A slight hole doping $x$ in the band insulator with a large $U>U_c$ yields a remarkable correlated semimetal with $Z\\sim 0.1$ at $x\\sim 0.01$, where in-gap states emerge above the valence band top and those weights increase with increasing $x$ together with the increase in $Z$ similar to the in-gap states observed in doped Mott insulators.", "url": "https://arxiv.org/abs/2605.24927", "type": "理论", "summary": "1. 该工作利用动力学平均场理论，系统研究了掺杂电子-空穴两带Hubbard模型中强关联效应及能隙内态的形成。\n2. 其核心发现是：带间库仑相互作用驱动一级Lifshitz相变，从重费米子半金属转变为哈特里位移导致的能带绝缘体；轻微空穴掺杂后立即出现类莫特绝缘体的能隙内态，且重整化因子随掺杂先降后升。\n3. 该结果揭示了关联半金属与能带绝缘体之间掺杂诱导转变的物理机制，为理解能隙内态及强关联体系中的金属-绝缘体相变提供了重要理论参照。", "summary_source": "deepseek", "authors": [{"name": "Masashi Akiyama"}, {"name": "Yusuke Inokuma"}, {"name": "Yoshiaki Ono"}], "featured_authors": [{"name": "Masashi Akiyama"}, {"name": "Yusuke Inokuma"}, {"name": "Yoshiaki Ono"}], "author_count": 3}, {"id": "2605.24947", "category": "cond-mat", "title": "Efficient cooling by ferroelectric or ferromagnetic hysteresis loops", "abstract": "An efficient cooling effect is put forward, by means of external electric or magnetic fields along hysteresis loops. A simplified model of hysteresis is used for numerical illustration. The model is based upon a second-order expansion of the energy in powers of polarization and external field. The electrocaloric effect along hysteresis loops is discussed for comparison.", "url": "https://arxiv.org/abs/2605.24947", "type": "理论+数值", "summary": "1. 该工作提出利用铁电或铁磁滞回线施加外电场或外磁场实现高效冷却效应。\n2. 技术关键在于采用基于极化与外场能量二阶展开的简化滞后模型进行数值演示，并与电卡效应对比。\n3. 这为开发基于滞回线路径的固态制冷新策略提供了物理依据及设计启发。", "summary_source": "deepseek", "authors": [{"name": "M. Apostol"}], "featured_authors": [{"name": "M. Apostol"}], "author_count": 1}, {"id": "2605.25003", "category": "cond-mat", "title": "Rheotaxis of microswimmers in colloid-laden channel flow", "abstract": "Microswimmers are often found in heterogeneous and crowded environments within narrow conduits under external flow conditions, enabling them to perform interesting translational and rotational maneuvers, such as swimming in the upstream direction, following walls, and oscillatory motion. Studying such systems helps us understand the motility behaviors of microswimmers (pushers, pullers, or neutrals) and develop applications such as targeted drug delivery. To study the motion of microswimmers in a channel flow with the presence of hard, monodisperse spherical colloids, we adopted the spherical squirmer model to represent the microswimmers, along with a mesoscale simulation framework, multi-particle collision dynamics (MPCD), to represent the background fluid. In the absence of colloids, a squirmer in a microchannel flow develops an increased probability of moving away from the walls and oscillates between the walls as the flow speed increases compared to the squirmer speed, with a dominant upstream orientation near the walls. However, the presence of the colloids makes the pusher swim towards the center of the channel and upstream direction, and the puller swim away from the center of the channel at low flow speeds. At high flow speeds, the flow carries all the squirmers, resulting in a dominant upstream direction in the channel center. We observe that this leads to a decrease in the local velocity of the squirmer in the flow direction for pusher, neutral, and puller-type squirmers. We also observe that, for a constant colloidal packing fraction, the local velocity magnitude of the puller along the flow direction is less than that of the pusher.", "url": "https://arxiv.org/abs/2605.25003", "type": "理论+数值", "summary": "1. 该工作采用球形squirmer模型结合多粒子碰撞动力学模拟，研究了微游泳者在含硬球胶体的通道流中的流变趋性行为。\n2. 其核心发现是胶体存在使pusher型游动者向通道中心及上游运动，而puller型在低速时远离中心，且puller沿流向的局域速度幅值小于pusher。\n3. 这为理解复杂拥挤环境中微游泳者的定向运动机制提供了物理图像，并对靶向药物递送等应用中的流控设计具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Margam Ramprasad"}, {"name": "Shubhadeep Mandal"}, {"name": "Pallab Sinha Mahapatra"}], "featured_authors": [{"name": "Margam Ramprasad"}, {"name": "Shubhadeep Mandal"}, {"name": "Pallab Sinha Mahapatra"}], "author_count": 3}, {"id": "2605.25032", "category": "cond-mat", "title": "Target-Distribution-Guided Cross-Functional Fine-Tuning of Machine-Learning Interatomic Potentials", "abstract": "Cross-functional fine-tuning of machine-learning interatomic potentials (MLIPs) is often treated as a relabeling problem, where configurations generated at one density-functional level are relabeled using a higher-fidelity target functional. However, the resulting training data may be drawn from the wrong equilibrium distribution, because the statistical weights of configurations change across exchange--correlation functionals. Here we address this distribution mismatch using a target-distribution-guided workflow based on self-learning hybrid Monte Carlo (SLHMC), in which trial configurations are proposed by a machine-learning potential and accepted or rejected using target-functional density-functional-theory energies. Using rutile TiO$_2$ as a test system, we fine-tune the MACE-MP-0 foundation potential toward PBE, r$^2$SCAN, and HSE06 target functionals. The resulting adapted potentials reproduce target-anchored nearest-neighbor Ti--O distributions, radial distribution functions, and the NPT cell metrics examined here more accurately than the foundation-model and off-target relabeling controls considered in this work. In particular, HSE06-guided fine-tuning improves structural and thermodynamic properties that are difficult to access with direct hybrid-functional molecular dynamics because of the computational cost of exact exchange. These results indicate that target-distribution coverage is an essential component of cross-functional MLIP transfer, and that accurate target-level labels alone may be insufficient when the configurational distribution is mismatched.", "url": "https://arxiv.org/abs/2605.25032", "type": "理论+数值", "summary": "1. 该工作提出目标分布引导的跨泛函微调流程，基于自学习混合蒙特卡洛方法，利用目标泛函能量接受或拒绝构型，解决机器学习原子间势函数微调中构型统计权重失配问题。\n2. 其卖点在于通过分布修正而非单纯标签替换，使微调后势函数准确复现金红石TiO₂的目标泛函（PBE、r²SCAN、HSE06）下的近邻距离、径向分布函数及NPT晶胞参数。\n3. 这提示仅高精度标签不足，构型分布覆盖是跨功能分子动力学势迁移的关键，为高效获取混合泛函级别的结构与热力学性质提供了可行替代路径。", "summary_source": "deepseek", "authors": [{"name": "Yuki Nagai"}, {"name": "Bo Thomsen"}, {"name": "Motoyuki Shiga"}], "featured_authors": [{"name": "Yuki Nagai"}, {"name": "Bo Thomsen"}, {"name": "Motoyuki Shiga"}], "author_count": 3}, {"id": "2605.25053", "category": "cond-mat", "title": "Assessment of a GW-BSE approximation scheme on an asymmetric two-dimensional interacting electron system in a perpendicular magnetic field", "abstract": "A GW-BSE approximation scheme is assessed by applying it to a model of asymmetric two-dimensional (2D) interacting electron system. The model is assumed to have a parabolic band characterized by two independent effective mass parameters. A perpendicular magnetic field is applied to the asymmetric 2D electron system, and the well-known Kohn's theorem is still valid, i.e., the cyclotron resonance is not affected by the electron-electron interaction. This theorem imposes a constraint on the approximation scheme employed in the treatment of electron-electron interaction. In the present study, the Green's function is calculated in the self-consistent Hartree-Fock approximation. The electron density correlation function is calculated by solving a Bethe-Salpeter equation (BSE) in the ladder diagram approximation. It is found that, the excitation frequency near the cyclotron resonance frequency approaches a value that is lower than the cyclotron resonance frequency at small wave vectors, when two effective masses are different. When two effective masses are the same, the excitation frequency approaches the cyclotron resonance frequency at small wave vectors as required. Our findings suggest that the approximation scheme used in this theoretical investigation fails to satisfy the requirement due to the Kohn's theorem, and one should go beyond this approximation scheme.", "url": "https://arxiv.org/abs/2605.25053", "type": "理论+数值", "summary": "1. 该工作评估了GW-BSE近似方案在垂直磁场中不对称二维相互作用电子系统上的应用，其中能带由两个独立有效质量参数描述。\n2. 其核心发现是当有效质量不同时，小波矢下激发频率低于回旋共振频率，违反了Kohn定理对电子-电子相互作用近似所施加的约束。\n3. 这表明该近似方案无法满足Kohn定理要求，未来需要发展超越GW-BSE框架的理论方法以正确描述此类系统中的集体激发。", "summary_source": "deepseek", "authors": [{"name": "Xiaoguang Wu"}], "featured_authors": [{"name": "Xiaoguang Wu"}], "author_count": 1}, {"id": "2605.25072", "category": "cond-mat", "title": "Topological metal-insulator transitions in one-dimensional non-Hermitian quasicrystals: beyond PT-symmetry", "abstract": "One-dimensional non-Hermitian quasicrystals with parity and time-reversal (PT) symmetry can simultaneously exhibit localization-delocalization transition, topological phase transition, and PT-symmetry-breaking transition. This motivates this work to investigate how the absence of PT symmetry impacts topological metal-insulator transitions in non-Hermitian quasicrystals. We propose a non-Hermitian quasiperiodic model that generally does not preserve PT symmetry and demonstrate that, in most parameter regions, such a system supports triple phase transitions that encompass localization, topology, and degeneracy-breaking. The system may also exhibit a particular type of localization-delocalization transition analogous to the Hermitian case, namely, without activating topological phase transitions or degeneracy-breaking transitions. Our work extends the topological metal-insulator transitions previously studied in PT-symmetric systems to a more general class of non-Hermitian setting, and further reveals that non-Hermitian systems can host distinct types of localization behavior.", "url": "https://arxiv.org/abs/2605.25072", "type": "理论", "summary": "1. 该文提出一个通常不保持PT对称性的非厄米准周期模型，研究其中的拓扑金属-绝缘体转变。\n2. 其核心在于系统在大部分参数区域支持局域化、拓扑和简并破缺的三重相变，也可单独发生类厄米局域化—退局域化转变。\n3. 这将对拓扑金属-绝缘体转变的认知从PT对称系统拓展至一般非厄米体系，并揭示非厄米系统可存在异于PT情形的局域化行为。", "summary_source": "deepseek", "authors": [{"name": "Guangjie Zhang"}, {"name": "Bing Shao"}, {"name": "Longwen Zhou"}, {"name": "Jiangbin Gong"}, {"name": "Weiwei Zhu"}], "featured_authors": [{"name": "Guangjie Zhang"}, {"name": "Bing Shao"}, {"name": "Longwen Zhou"}, {"name": "Jiangbin Gong"}, {"name": "Weiwei Zhu"}], "author_count": 5}, {"id": "2605.25128", "category": "cond-mat", "title": "Orbital-Engineered Altermagnetism in Two-Dimensional Square Lattices", "abstract": "Altermagnetism is characterized by even-parity spin-momentum locking in spin-split bands despite zero net magnetization and negligible spin-orbit coupling. Here, we formulate a microscopic framework that links altermagnetic splitting in two-dimensional (2D) square lattices to orbital character. Using tight-binding models and symmetry analysis, we show that, within the minimal antiferromagnetic square-lattice model, single-orbital lattices remain spin-degenerate, whereas interwoven dual-orbital configurations lift Kramers degeneracy and generate d-wave or g-wave altermagnetic states. The spin-splitting originates from orbital anisotropy in the same-spin hopping channels. Guided by this framework, we identify M-TCNX (M = Cr, Mn, Fe; TCNX = TCNE, TCNQ) metal-organic framework monolayers with mcm topology as candidate g-wave altermagnets. Our work provides a symmetry-explicit wavefunction-level design framework for orbital-controlled altermagnetism in 2D square lattices.", "url": "https://arxiv.org/abs/2605.25128", "type": "理论", "summary": "1. 该工作构建了一个微观框架，将二维正方形晶格中的反铁磁自旋分裂与轨道特性相联系，并通过紧束缚模型与对称性分析阐明了单轨道晶格保持自旋简并而双轨道构型产生d波或g波反铁磁态。\n2. 其核心在于揭示了相同自旋跳跃通道中的轨道各向异性是自旋分裂的起源，从而实现了无需净磁化与自旋轨道耦合的反铁磁轨道工程。\n3. 该波函数级对称性设计框架为在二维正方形晶格中探索轨道控制的反铁磁体提供了明确指引，有望拓展至更多金属有机框架体系。", "summary_source": "deepseek", "authors": [{"name": "Yixuan Che"}, {"name": "Peibo Xu"}, {"name": "Haifeng Lv"}, {"name": "Xiaojun Wu"}, {"name": "Jinlong Yang"}], "featured_authors": [{"name": "Yixuan Che"}, {"name": "Peibo Xu"}, {"name": "Haifeng Lv"}, {"name": "Xiaojun Wu"}, {"name": "Jinlong Yang"}], "author_count": 5}, {"id": "2605.25153", "category": "cond-mat", "title": "First-principles finite-size correction schemes for point defects of Cu$_3$N", "abstract": "Point defects play a key role in determining semiconductor properties, such as electrical conductivity and photoluminescence, and often enable functional behavior. Accurate first-principles supercell simulations of point defects require reliable finite-size corrections. In this study, we combine PBE+U structural relaxations with HSE hybrid-functional calculations to determine defect formation energies and thermodynamic transition levels of Cu$_3$N. Finite-size trends are quantified using $\\Gamma$-point calculations in supercells containing 256, 864, and 2048 atoms. We assess and extend the Makov-Payne and Lany-Zunger correction schemes by introducing additional $1/L^n$ terms, together with core-level potential alignment and defect-specific scaling models. Using Cu$_3$N as a case study, we show that charged vacancies with strongly localized defect states are accurately described by the Makov-Payne-type scaling ($1/L + 1/L^{3}$), whereas interstitial defects with shallow or weakly localized electronic character are better captured by a hydrogenic impurity model that accounts for defect-band dispersion. Residual trends for neutral or weakly localized defects are described by higher-order polynomial fits in $1/L^{3}$ and $1/L^{4}$. Hybrid-functional energetics corrected using PBE+U-based finite-size trends confirm the intrinsic $p$-type character of Cu$_3$N under the conditions considered and demonstrate that no single finite-size correction can be transferred across all defect types.", "url": "https://arxiv.org/abs/2605.25153", "type": "理论+数值", "summary": "1. 该工作结合PBE+U结构弛豫与HSE杂化泛函计算，系统评估了Cu3N点缺陷形成能和热力学转变能级的有限尺寸修正方法。\n2. 其技术核心在于引入1/L^n高阶项和缺陷特定标度模型，区分了Makov-Payne型（强局域缺陷）与氢杂质模型（弱局域或离域缺陷）的适用场景。\n3. 结果表明杂化泛函修正证实Cu3N在本征条件下为p型半导体，且单一有限尺寸方案无法跨缺陷类型移植。", "summary_source": "deepseek", "authors": [{"name": "Abdul M. Reyes"}, {"name": "Sebastian E. Reyes-Lillo"}, {"name": "Eduardo Menéndez-Proupin"}], "featured_authors": [{"name": "Abdul M. Reyes"}, {"name": "Sebastian E. Reyes-Lillo"}, {"name": "Eduardo Menéndez-Proupin"}], "author_count": 3}, {"id": "2605.25187", "category": "cond-mat", "title": "Unfrustrated Self-Morphing of Bulk Liquid Crystal Elastomers", "abstract": "Precise manipulation of shape-morphing responsive materials is crucial for applications in soft robotics and adaptive structures. While notable precision has been achieved in thin two-dimensional sheets, an accurate volumetric shape-morphing remains a major challenge due to geometric frustration, which inevitably generates complex, residual elastic stresses. In this work, we extend the geometric approach used for thin sheets to bulk Liquid Crystal Elastomers (LCEs). By examining their reference Ricci curvature, we formulate the minimal set of conditions required for a three-dimensional nematic director field to undergo stress-free, frustration-free deformations upon actuation. Through this mathematical framework, we identify two distinct classes of geometrically compatible bulk systems. The first class comprises twistless director fields that remain frustration-free across all temperatures, leading to holographic design principles demonstrated through \"Planar\" and \"Smectic\" LCE subfamilies. The second class features twisted configurations that exhibit unique, temperature-selective compatibility, leading to non-monotonic accumulation of internal elastic stresses that relax completely at a predefined target temperature. Our framework establishes a firm mathematical foundation for robust forward and inverse design protocols in bulk LCEs.", "url": "https://arxiv.org/abs/2605.25187", "type": "理论", "summary": "1. 该工作将薄片几何方法扩展到块体液晶弹性体，通过考察其参考Ricci曲率，推导出无应力、无挫折三维形变所需的必要场条件。\n2. 它识别出两类几何兼容体系：无扭转全场无挫折体系与扭转体系，后者在预定目标温度处残余弹性应力完全释放。\n3. 这为块体液晶弹性体提供了一套严格的数学框架，能够支撑鲁棒的前向设计与逆向设计协议。", "summary_source": "deepseek", "authors": [{"name": "Shachaf Rotem"}, {"name": "Hillel Aharoni"}], "featured_authors": [{"name": "Shachaf Rotem"}, {"name": "Hillel Aharoni"}], "author_count": 2}, {"id": "2605.25197", "category": "cond-mat", "title": "Light-Driven Intrinsic Perfect Superconducting Diode Effect", "abstract": "We demonstrate the perfect superconducting diode effect (SDE) -- unidirectional supercurrent with 100% diode efficiency -- in light-driven nonequilibrium systems. Although the perfect SDE is difficult to achieve in equilibrium, monochromatic light induces the perfect SDE in systems lacking inversion and time-reversal symmetries. More strikingly, multi-frequency light enables the perfect SDE even in centrosymmetric systems via dynamical symmetry breaking. Our results establish a general principle for realizing unidirectional superconducting transport based on nonequilibrium control and symmetry engineering.", "url": "https://arxiv.org/abs/2605.25197", "type": "理论", "summary": "1. 该工作展示了光驱动非平衡系统中实现100%二极管效率的完美超导二极管效应。\n2. 其核心在于单色光诱导缺反演和时间反演对称系统的完美SDE，而多频光通过动力学对称性破缺在中心对称系统中实现同样效应。\n3. 这为基于非平衡控制和对称性工程实现单向超导输运建立了通用原理，启发实验与理论研究。", "summary_source": "deepseek", "authors": [{"name": "Makoto Ichikawa"}, {"name": "Youichi Yanase"}], "featured_authors": [{"name": "Makoto Ichikawa"}, {"name": "Youichi Yanase"}], "author_count": 2}, {"id": "2605.25269", "category": "cond-mat", "title": "Non-local low energy neutral excitations in a strongly disordered triangular Mott magnet Cr$_3$Se$_2$Br$_5$", "abstract": "Understanding if low-energy excitations can remain itinerant in the presence of strong disorder remains a central challenge in frustrated quantum magnets, where disorder is generally expected to localize excitations through Anderson-like mechanisms. Here we report the emergence of charge-neutral itinerant excitations in a van der Waals compound Cr$_3$Se$_2$Br$_5$, a strongly disordered $S = 3/2$ Mott insulator with a frustrated triangular lattice. Structural analysis reveals substantial intrinsic disorder arising from Cr-site deficiency and Se/Br-site mixing, which appear to be fixed and cannot be readily tuned. No long-range magnetic order or conventional glassy behavior is observed. In addition to its highly insulating nature, the magnetic specific heat C_mag/T and thermal conductivity \\k{appa}_xx/T both exhibit linear temperature dependencies with substantial finite intercepts. In particular, a sizeable field-independent residual term $\\kappa/T \\approx 0.03~\\mathrm{W\\,m^{-1}\\,K^{-2}}$ is observed, providing compelling evidence of itinerant low-energy excitations that carry entropy without charge. These findings conceptually advance our understanding of quantum matter by demonstrating a rare regime where the interplay of disorder, frustration, and electronic correlations actively reshapes the nature of low-energy excitations, allowing itinerant neutral excitations to coexist with strong intrinsic disorder.", "url": "https://arxiv.org/abs/2605.25269", "type": "理论", "summary": "1. 该工作通过比热和热导率测量，在强无序三角晶格S=3/2 Mott绝缘体Cr₃Se₂Br₅中，发现电荷中性巡游低能激发与固有Cr位缺失及Se/Br位混合无序共存，且系统无长程磁序或典型玻璃行为。\n2. 其核心物理卖点是磁比热C_mag/T和热导率κ_xx/T均呈现线性温度依赖，并存在显著场无关残余热导率κ/T≈0.03 W m⁻¹ K⁻²，直接证明强无序环境下仍存在携带熵的无电荷巡游准粒子激发。\n3. 该发现突破了安德森局域化对无序系统激发行为的传统预期，揭示了阻挫、无序与电子关联的协同作用可重塑低能激发图像，为理论描述量子自旋液体及关联无序相提供了关键实验基准。", "summary_source": "deepseek", "authors": [{"name": "Wenhao Liu"}, {"name": "Dechen Zhang"}, {"name": "Yuanqi Lyu"}, {"name": "Lebing Chen"}, {"name": "Lifang Hu"}, {"name": "Keith M. Teddei"}, {"name": "Yuting Zhang"}, {"name": "Steve Shelton"}, {"name": "Moon Kim"}, {"name": "Xiqu Wang"}, {"name": "Michael A. Susner"}, {"name": "James G. Analytis"}, {"name": "Dung-Hai Lee"}, {"name": "Lu Li"}, {"name": "Bing Lv"}, {"name": "Robert J. Birgeneau"}], "featured_authors": [{"name": "Wenhao Liu"}, {"name": "Dechen Zhang"}, {"name": "Yuanqi Lyu"}, {"name": "Lu Li"}, {"name": "Bing Lv"}, {"name": "Robert J. Birgeneau"}], "author_count": 16}, {"id": "2605.25270", "category": "cond-mat", "title": "Thermal PBE in warm dense matter: Does it matter and is it accurate?", "abstract": "Conditional probability density functional theory has recently been used to derive the temperature dependence of the Perdew-Burke-Ernzerhof (PBE) generalized gradient approximation (GGA) for the exchange-correlation (XC) free energy. We implement and systematically benchmark thermal PBE within Kohn-Sham density functional theory calculations of warm dense matter. Comparisons with the local density approximation (LDA) and PBE functionals, as well as thermal LDA, show that thermal PBE significantly improves the description of warm dense matter properties, including energies, forces, pressures, and electronic charge densities. In particular, thermal PBE exhibits close agreement with path integral Monte Carlo (PIMC) reference data at negligible additional computational cost. This work demonstrates the practical utility of thermal PBE as an accurate semilocal functional for simulations in the warm dense regime.", "url": "https://arxiv.org/abs/2605.25270", "type": "理论+数值", "summary": "1. 该工作实现并系统基准测试了热PBE交换关联泛函在温稠密物质Kohn-Sham密度泛函计算中的表现。\n2. 主要卖点在于热PBE在几乎无额外计算成本下，与路径积分蒙特卡洛参考数据高度一致，并显著改进了能量、力、压力和电子电荷密度的描述。\n3. 这证明了热PBE作为精确半局域泛函在温稠密物质模拟中的实用价值，为相关计算提供了可靠且高效的替代方案。", "summary_source": "deepseek", "authors": [{"name": "Kushal Ramakrishna"}, {"name": "Mani Lokamani"}, {"name": "Zhandos A. Moldabekov"}, {"name": "Tobias Dornheim"}, {"name": "Kieron Burke"}, {"name": "Attila Cangi"}], "featured_authors": [{"name": "Kushal Ramakrishna"}, {"name": "Mani Lokamani"}, {"name": "Zhandos A. Moldabekov"}, {"name": "Tobias Dornheim"}, {"name": "Kieron Burke"}, {"name": "Attila Cangi"}], "author_count": 6}, {"id": "2605.25351", "category": "cond-mat", "title": "Anomalous Subsurface Vacancy Stabilization Dictated by Geometry-Electronic Decoupling on Metal Surfaces", "abstract": "Vacancy formation energetics fundamentally govern the structural integrity and catalytic behavior of metal surfaces. Contrary to conventional coordination-dependent broken-bond models, we identify an
