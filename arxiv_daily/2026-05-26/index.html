anomalous thermodynamic inversion on close-packed surfaces across Ir, Pt, Au with face-centered cubic (FCC) lattice and Be, Zn, Cd with hexagonal close-packed (HCP) lattice, where subsurface vacancies are intrinsically more stable than surface ones. Using high-throughput DFT calculations and machine learning force fields, we demonstrate that the physical origins of this anomaly are fundamentally decoupled between the two crystal systems. For the FCC trio, pronounced surface relaxation and a profound real-space electronic localization induce directional, covalent-like intralayer bonding, materializing a \"geometry-electronic decoupling\" mechanism. Crucially, this unconventional thermodynamic hierarchy enables a dynamic \"self-healing\" mechanism on Pt(111) that preserves an intact topmost layer and prevents catalytic degradation during hydrogen evolution and oxygen reduction reactions. It also successfully decoding the critical defect threshold (~8%) for lifting the Au(100) surface reconstruction. Our work challenges classical scalar defect models and provides a fresh paradigm for engineering catalyst surface integrity.", "url": "https://arxiv.org/abs/2605.25351", "type": "理论+数值", "summary": "1. 该工作通过高通量密度泛函计算与机器学习力场，揭示了Ir、Pt、Au等面心立方及Be、Zn、Zn等六角密堆积金属密堆积面上次表面空位反常稳定的热力学翻转现象。\n2. 其核心物理卖点在于发现FCC金属中表面弛豫与实空间电子强局域化诱发类共价层内键合，形成“几何-电子解耦”机制，颠覆了经典配位依赖断键模型。\n3. 这为Pt(111)表面动态自修复机制及Au(100)表面重构临界空位阈值（~8%）提供了定量解释，为设计耐催化降解的金属表面提供了新范式。", "summary_source": "deepseek", "authors": [{"name": "Yiming Tan"}, {"name": "Pai Li"}], "featured_authors": [{"name": "Yiming Tan"}, {"name": "Pai Li"}], "author_count": 2}, {"id": "2605.25386", "category": "cond-mat", "title": "Non-Hermitian Twisting Theory under the open boundary condition", "abstract": "The non-Hermitian skin effect (NHSE) is a hallmark of non-Hermitian system, yet its generalized Brillouin zone (GBZ) description is restricted to periodic systems. We develop a site-resolved theory via a local scaling transformation (LST), introducing local twisting $T_n$ to quantify metric operator $\\xi$ nontriviality. This elucidates the NHSE's origin and uncovers the generalized multiple-channel skin effect (MCSE). Exploiting $T_n$'s translational independence, we define the Zahlen-Brillouin Zone (ZBZ), extending non-Hermitian band theory to nonperiodic and disordered lattices. Furthermore, we unify the $\\xi$ with GBZ Riemannian geometry, establishing the metric and state correspondence (MSC) as the principle for real-space localization. With a global skin index $\\mathbf\\Gamma$ for phase transitions, our results provide a universal paradigm for non-Hermitian physics in both crystalline and amorphous media.", "url": "https://arxiv.org/abs/2605.25386", "type": "理论+数值", "summary": "1. 该工作提出基于局域标度变换的非厄米绞缠理论，通过定义位置依赖的局部扭曲T_n构建Zahlen-布里渊区，从而将非厄米能带理论从周期系统拓展至开放边界、无序及非周期晶格。\n2. 其核心卖点在于建立度量算子ξ与广义布里渊区黎曼几何的等价关系，提出度量-态对应原则作为实空间局域化的普适原理，并引入全局皮肤指数Γ统一刻画多通道皮肤效应与拓扑相变。\n3. 这一理论为晶体与非晶介质中的非厄米物理提供了严格统一框架，对无序系统及准晶等非周期材料中的非厄米拓扑物态实验与理论研究具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Chen-Hao Zhao"}, {"name": "Jia-Rui Li"}, {"name": "Yuping Tian"}, {"name": "Wei-Jiang Gong"}], "featured_authors": [{"name": "Chen-Hao Zhao"}, {"name": "Jia-Rui Li"}, {"name": "Yuping Tian"}, {"name": "Wei-Jiang Gong"}], "author_count": 4}, {"id": "2605.25387", "category": "cond-mat", "title": "Microfluidic Actuation by Einstein-de Haas Spin Torque", "abstract": "We propose spin-current microfluidic actuation of a sealed liquid metal. Spin angular momentum injected from Pt contacts enters the liquid as an Einstein-de Haas torque and is converted through micropolar angular-momentum balance into viscous flow without pressure drive, moving walls, magnetic fields, Lorentz forces, or charge flow through the liquid. The dc velocity obeys universal spin-diffusion scaling, and the finite-frequency spin-mechanical admittance resolves viscous momentum diffusion, spin transport, microrotation relaxation, and interface transparency of the liquid-metal channel.", "url": "https://arxiv.org/abs/2605.25387", "type": "理论", "summary": "1. 该工作提出利用爱因斯坦-德哈斯自旋扭矩实现密封液态金属的微流控驱动。\n2. 其核心在于将自旋角动量注入通过微极角动量平衡转化为粘性流，无需压力或磁场，且直流速度服从自旋扩散标度。\n3. 这为开发无电荷流、无移动部件的微流控器件及研究自旋-力学耦合动力学提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Xin Hu"}, {"name": "Mamoru Matsuo"}], "featured_authors": [{"name": "Xin Hu"}, {"name": "Mamoru Matsuo"}], "author_count": 2}, {"id": "2605.25406", "category": "cond-mat", "title": "Beyond Local Detailed Balance: Microscopic Rates Reshape Nonequilibrium Phase Behavior", "abstract": "Local detailed balance (LDB) is a central guiding principle for modeling nonequilibrium stochastic dynamics, yet it only constrains the ratio of forward and backward transition rates and does not fix the steady state. Although the functional form of rates under the same LDB has been shown to affect correlation properties in weakly interacting systems, whether it can reshape phase behavior in strongly interacting systems remains unclear. Here, for a two-dimensional driven lattice gas with attractive nearest-neighbor interactions, we consider hopping rates with a parameter that preserves the same LDB but tunes asymmetry along the driving force. We find that this parameter controls qualitative phase behavior: in the homogeneous phase, it reverses the sign of the structure-factor discontinuity and hence the anisotropy in long-range density correlations; in the phase-separated regime, it switches the orientation of anisotropic patterns and their long-time stability. Both effects are coherently captured by an approximate fluctuating hydrodynamic equation. The results demonstrate that, in contrast to equilibrium systems, nonequilibrium phase behavior depends on specific dynamical rules even when following the same LDB.", "url": "https://arxiv.org/abs/2605.25406", "type": "理论", "summary": "1. 该工作针对二维吸引相互作用驱动格子气，引入一个保持局部细致平衡但调节跃迁不对称性的速率参数，研究其对非平衡相行为的重塑作用。\n2. 其核心发现是，该参数可反转均匀相结构因子间断符号及长程密度关联各向异性，并切换相分离图案取向与稳定性，且由近似涨落流体力学方程统一描述。\n3. 这揭示非平衡相行为对具体动力学规则的依赖，表明相同局部细致平衡下相行为可定性不同，为理解非平衡稳态分类提供了关键启示。", "summary_source": "deepseek", "authors": [{"name": "Takahiro Kanazawa"}, {"name": "Kyogo Kawaguchi"}, {"name": "Kyosuke Adachi"}], "featured_authors": [{"name": "Takahiro Kanazawa"}, {"name": "Kyogo Kawaguchi"}, {"name": "Kyosuke Adachi"}], "author_count": 3}, {"id": "2605.25432", "category": "cond-mat", "title": "Disentangling the contributions of individual cations to magnetic order in a spinel high entropy oxide", "abstract": "High entropy oxides (HEOs) can possess long-range ordered magnetic states despite their extreme chemical disorder. Very little is known about how the different chemical constituents in HEOs contribute to the emergence of these magnetic states. In this work, we leverage element-specific magnetometry attained via x-ray magnetic circular dichroism (XMCD) to understand how magnetic order is driven in two ferrimagnetic spinel-structured HEOs with compositions (Cr,Mn,Fe,Co,Ni)$_3$O$_4$ and (Cr,Mn,Fe,Co,Ni)$_{2.4}$Ga$_{0.6}$O$_4$. We find that while the magnetic transition is simultaneous for all chemical species, the rate at which their magnetic moments grow is strongly cation dependent. This behavior is explained by the varying $\\textit{3d}$ crystal field level fillings of the magnetic cations, which in turn determine their ability to participate in the different magnetic exchange pathways available in the spinel structure. Dominant $A$-$B$ sublattice exchange enables some species to harden rapidly ($\\textit{e.g.}$ tetrahedral Fe$^{3+}$ and octahedral Ni$^{2+}$) while others exhibit a sluggish transition due to frustration from competing interactions ($\\textit{e.g.}$ octahedral Fe$^{3+}$ and Cr$^{3+}$). Non-magnetic substitution suppresses these differences, introducing broken magnetic linkages that relieve frustration. Tailoring the magnetism of HEO spinels therefore requires detailed knowledge of both their site selectivities and their exchange pathways.", "url": "https://arxiv.org/abs/2605.25432", "type": "理论", "summary": "1. 该工作利用X射线磁圆二色性实现元素特异性磁测量，解析了两种铁磁尖晶石高熵氧化物中单个阳离子对长程磁序的贡献。\n2. 其核心在于揭示磁阳离子3d晶体场填充决定其参与不同交换路径的能力，主导A-B亚晶格交换使四面体Fe³⁺快速磁化，竞争交换导致八面体Cr³⁺等缓慢转变并呈现阻挫。\n3. 这启示定制高熵尖晶石磁性需同时考虑位点选择性与交换路径，非磁性替代可缓解阻挫，为设计新型磁性高熵材料提供了关键指导。", "summary_source": "deepseek", "authors": [{"name": "Mario Ulises González-Rivas"}, {"name": "Chun-Fu Chang"}, {"name": "Martin Bluschke"}, {"name": "Jessica Freese"}, {"name": "Peter Bencok"}, {"name": "Ronny Sutarto"}, {"name": "Teak D. Boyko"}, {"name": "Robert J. Green"}, {"name": "George A. Sawatzky"}, {"name": "Liu Hao Tjeng"}, {"name": "Alannah M. Hallas"}], "featured_authors": [{"name": "Mario Ulises González-Rivas"}, {"name": "Chun-Fu Chang"}, {"name": "Martin Bluschke"}, {"name": "George A. Sawatzky"}, {"name": "Liu Hao Tjeng"}, {"name": "Alannah M. Hallas"}], "author_count": 11}, {"id": "2605.25484", "category": "cond-mat", "title": "Spin layer groups and their corepresentations", "abstract": "Spin layer groups are the crystallographic symmetry groups with a periodic plane, and their symmetry operations are inherited from three-dimensional (3D) spin space groups. However, the direct application of 3D symmetry groups to two-dimensional systems is often inadequate due to anisotropic axes and dimensional reduction. In this work, we systematically classify inequivalent spin layer groups and analytically derive their irreducible corepresentations. This classification establishes a foundational framework for investigating symmetry-protected properties and novel quantum states in low-dimensional magnetic materials.", "url": "https://arxiv.org/abs/2605.25484", "type": "理论", "summary": "1. 该工作系统分类了不等价的自旋层群并解析推导了其不可约共表示。\n2. 其技术核心在于克服了将三维自旋空间群直接用于二维系统时由于各向异轴和维度约化导致的对称性描述缺陷。\n3. 这为低维磁性材料中对称性保护的性质与新奇量子态的研究提供了基础的分类学框架。", "summary_source": "deepseek", "authors": [{"name": "Zeying Zhang"}, {"name": "Gui-Bin Liu"}, {"name": "Mu Tian"}, {"name": "Run-Wu Zhang"}, {"name": "Zhi-Ming Yu"}, {"name": "Yugui Yao"}], "featured_authors": [{"name": "Zeying Zhang"}, {"name": "Gui-Bin Liu"}, {"name": "Mu Tian"}, {"name": "Run-Wu Zhang"}, {"name": "Zhi-Ming Yu"}, {"name": "Yugui Yao"}], "author_count": 6}, {"id": "2605.25485", "category": "cond-mat", "title": "Transition from Homogeneous to Domain-Wall-Mediated Polarization Switching in BaTiO3: A Machine-Learning Molecular Dynamics Study", "abstract": "Polarization switching in ferroelectric BaTiO3 can proceed through fundamentally different mechanisms - yet the conditions that determine which pathway is realized remain poorly understood. Using machine-learning potential-based molecular dynamics with the MACEField model, we systematically vary supercell size to reveal a clear transition from homogeneous polarization switching to domain-wall-mediated switching, accompanied by a coercive field increase of over 50%. Shannon entropy analysis demonstrates that this transition is driven by size-dependent polarization fluctuations that promote 180 degree domain-wall nucleation - establishing a direct, quantitative link between local configurational disorder and macroscopic switching behavior. Furthermore, the switching pathway and hysteresis response are shown to depend critically on supercell geometry and the relative orientation of applied stress and electric field. These findings reveal that homogeneous and domain-wall-mediated switching are distinct physical regimes in BaTiO3, and that atomistic simulations must account for system size to correctly capture the operative switching mechanism.", "url": "https://arxiv.org/abs/2605.25485", "type": "理论+数值", "summary": "1. 该工作利用基于MACEField模型机器学习势的分子动力学模拟，揭示了BaTiO3铁电体中随超胞尺寸增大从均匀极化翻转到畴壁介导翻转的明确转变。\n2. 其技术核心在于通过Shannon熵分析建立了尺寸依赖的极化涨落与180度畴壁成核之间的定量联系，并发现矫顽场因翻转机制转变而增大超过50%。\n3. 这确立了均匀与畴壁介导翻转为截然不同的物理区间，指明原子模拟必须考虑系统尺寸以正确预测铪钛酸钡的宏观开关行为。", "summary_source": "deepseek", "authors": [{"name": "Po-Yen Chen"}, {"name": "Teruyasu Mizoguchi"}], "featured_authors": [{"name": "Po-Yen Chen"}, {"name": "Teruyasu Mizoguchi"}], "author_count": 2}, {"id": "2605.25594", "category": "cond-mat", "title": "Sensitivity to perturbations in the three-dimensional Anderson model", "abstract": "We investigate the fidelity susceptibility, which quantifies the sensitivity of single-particle eigenstates to perturbations, in the three-dimensional Anderson model. As a function of disorder strength $W$, it exhibits two distinct peaks. The first peak signals a crossover at weak disorder strength from plane-wave states to single-particle quantum chaos, and its position shifts toward $W\\to 0$ in the thermodynamic limit. The second peak emerges, to high numerical accuracy, at the critical disorder strength associated with the Anderson localization transition. We further show that the divergence of the first peak is maximal, scaling as the square of the inverse frequency cutoff, whereas the divergence of the second peak is submaximal. We relate the latter suppression to the fractal structure of single-particle eigenstates at criticality. We discuss two distinct scenarios that give rise to the peaks in the fidelity susceptibilities. Moreover, studying the scaling of typical fidelity susceptibilities above the Anderson transition, we find evidence of two distinct regimes of nonergodic behavior.", "url": "https://arxiv.org/abs/2605.25594", "type": "理论+数值", "summary": "1. 该工作通过计算保真度敏感度，系统研究了三维安德森模型中单粒子本征态对扰动的敏感性。\n2. 其核心发现是随无序强度扫描出现两个不同起源的峰值，分别对应弱无序量子混沌交叉与安德森局域化转变临界点，且临界峰的超标度抑制源于本征态的分形结构。\n3. 这为区分无序系统中量子混沌与临界标度行为提供了定量判据，并揭示了安德森转变以上存在两个不同的非遍历区域。", "summary_source": "deepseek", "authors": [{"name": "Piotr Tokarczyk"}, {"name": "Lev Vidmar"}, {"name": "Anatoli Polkovnikov"}, {"name": "Patrycja Łydżba"}], "featured_authors": [{"name": "Piotr Tokarczyk"}, {"name": "Lev Vidmar"}, {"name": "Anatoli Polkovnikov"}, {"name": "Patrycja Łydżba"}], "author_count": 4}, {"id": "2605.25606", "category": "cond-mat", "title": "A sweeping twist defect as a topological flagellum that drives colloid motion", "abstract": "Nematic liquid crystals can dramatically reconfigure under dynamic forcing, providing exciting opportunities in active matter. Here, we study a hybrid disk colloid rotated by an external field which generates a dynamic companion topological defect. The disk moves faster when the defect sweeps across the disk's face. We identify the defect as a non-singular twist wall, characterize the twist energy landscape, and identify the sweeping motion as a topological instability. As the defect sweeps, it reverses the handedness of twist and lowers the free energy in the fluid in the gap above the disk. Landau-de Gennes modeling shows that the sweeping wall behaves as a propagating director texture: the director field is nearly stationary in the wall frame, while nematogens rotate locally as the wall passes. The nematogens' rotation generates a viscous stress on the surface of the disk that hastens its propulsion. Thus, the defect acts as a flagellum that powers colloid swimming, providing an example of a dissipative topological structure whose dynamics can be harnessed to perform useful work.", "url": "https://arxiv.org/abs/2605.25606", "type": "理论", "summary": "1. 该工作通过外场旋转混合盘状胶体，在向列液晶中产生并研究了扫描扭转缺陷驱动胶体运动的动力学机制。\n2. 其物理卖点在于将扫描运动识别为拓扑不稳定性，揭示缺陷作为非奇异扭转壁反转手性并降低自由能，且指向矢旋转在盘面产生粘性应力推进胶体。\n3. 这为利用耗散拓扑结构驱动微尺度游动提供了范例，并对活性物质与微流控中的定向输运设计有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Qi Xing Zhang"}, {"name": "Claire Dore"}, {"name": "Mojtaba Rajabi"}, {"name": "Edward B. Steager"}, {"name": "Kathleen J. Stebe"}], "featured_authors": [{"name": "Qi Xing Zhang"}, {"name": "Claire Dore"}, {"name": "Mojtaba Rajabi"}, {"name": "Edward B. Steager"}, {"name": "Kathleen J. Stebe"}], "author_count": 5}, {"id": "2605.25683", "category": "cond-mat", "title": "Analysis of Critical Points in a Permutation Model on Hierarchical Lattices by Real-Space Renormalization Group", "abstract": "The permutation model is a classical spin system where elements of the symmetric group interact with one another. The partition function of this model is directly related to the entanglement structure of random quantum circuits and random tensor networks. In these contexts, the entanglement entropy undergoes a transition between area-law and volume-law scaling, depending on the model parameters. This transition point has attracted considerable attention. In the present work, we investigate the ferromagnetic-paramagnetic phase transition of the permutation model, which corresponds to the entanglement entropy transition. Using exact real-space renormalization group calculations on self-dual hierarchical lattices, we numerically determine finite-replica critical points for (q=mn=2,...,6). We compare the results with the duality prediction based on the Fourier transform of the symmetric group and then extrapolate the b=3 data toward the replica limit $mn\\to0$, where the effective dimension is two. The comparison supports the duality-based estimate while also clarifying the systematic uncertainty associated with the extrapolation formula.", "url": "https://arxiv.org/abs/2605.25683", "type": "理论+数值", "summary": "1. 该工作通过实空间重整化群精确计算了自偶层次晶格上排列模型的有限副本铁磁-顺磁临界点。\n2. 其核心在于利用对称群傅里叶变换的对偶预测，并将b=3数据外推至副本极限mn→0，逼近二维有效维度下的纠缠熵转变。\n3. 这为验证副本极限下临界行为的对偶描述提供了定量支持，同时揭示了外推公式的系统不确定性。", "summary_source": "deepseek", "authors": [{"name": "Ryuki Ito"}, {"name": "Taisei Matsuo"}, {"name": "Masayuki Ohzeki"}], "featured_authors": [{"name": "Ryuki Ito"}, {"name": "Taisei Matsuo"}, {"name": "Masayuki Ohzeki"}], "author_count": 3}, {"id": "2605.25736", "category": "cond-mat", "title": "Spectral properties of non-Hermitian real random matrices with long-range correlations", "abstract": "We investigate the spectral properties of non-Hermitian real random matrices whose entries exhibit long-range correlations decaying as~$|r-r'|^{-\\alpha}$. We find a progressive breakdown of the circular law, controlled by the decrease of~$\\alpha$. In all cases, the radial eigenvalue density decreases away from the origin. At~$\\alpha>1$, an effective radius, reminiscent of the circular law, is retrieved, while instead, for~$\\alpha<1$, the eigenvalue distribution broadens with matrix size and its spectral radius grows like a power law, with exponents numerically close to the exponents controlling the magnitude of fluctuations in the extended central limit theorem. The case~$\\alpha=1$ appears as a case with self-similar eigenvalue density, and slowly growing spectral radius. Long-range correlations also enhance clustering of real eigenvalues and slow the resorption of the Saturn effect. These results reveal a correlation-driven transition and suggest the emergence of a new universality class for correlated non-Hermitian random matrices.", "url": "https://arxiv.org/abs/2605.25736", "type": "数值", "summary": "1. 该工作系统研究了具有长程幂律相关性（衰减指数α）的非厄米实随机矩阵的谱性质。\n2. 其核心在于揭示了α由大变小驱动圆律普适破坏、谱半径幂律增长及实特征值聚类增强等行为，并在α=1处呈现自相似谱密度。\n3. 这指示了非厄米随机矩阵中存在由相关性决定的新普适类，为理解相关无序系统中的谱统计提供了明确指引。", "summary_source": "deepseek", "authors": [{"name": "Ulysse Marquis"}], "featured_authors": [{"name": "Ulysse Marquis"}], "author_count": 1}, {"id": "2605.25744", "category": "cond-mat", "title": "Collective deformation of anisotropic particles with internal pulsation", "abstract": "Capturing the emergence of deformation waves in contractile living tissues is a challenge that has recently been tackled with models of actively deformable particles. Inspired by the anisotropic deformation of cardiomyocytes in cardiac tissues, we examine how the pulsation of elliptical particles affects their collective properties in dense assemblies. We introduce two types of deformation where the eccentricity of each particle is subject to a periodic drive, and examine the interplay between nematic order and synchronized deformation via a systematic phase diagram. We derive a hydrodynamic description through a coarse-graining procedure, and show that it qualitatively captures the main collective states of the microscopic dynamics. Overall, our model provides key insights into how an active anisotropic deformation yields waves that self-organize into various dynamical patterns.", "url": "https://arxiv.org/abs/2605.25744", "type": "理论+数值", "summary": "1. 该工作通过引入受周期性驱动的椭圆粒子偏心率变形，系统研究了密集组装中各向异性主动粒子的集体脉动行为与相图。\n2. 其技术核心在于粗粒化推导出流体动力学描述，并揭示了向列序与同步变形之间的相互作用机制。\n3. 这为理解心肌组织等收缩性活系统中自组织变形波的涌现提供了清晰的物理图景与模型基础。", "summary_source": "deepseek", "authors": [{"name": "Luca Casagrande"}, {"name": "Alessandro Manacorda"}, {"name": "Etienne Fodor"}], "featured_authors": [{"name": "Luca Casagrande"}, {"name": "Alessandro Manacorda"}, {"name": "Etienne Fodor"}], "author_count": 3}, {"id": "2605.25774", "category": "cond-mat", "title": "Topological fragility and bilinear magnetoelectric resistance in gapless edge states", "abstract": "In time-reversal symmetric systems such as topological and higher-order topological insulators, 1D spin-momentum locked edge and hinge states are theoretically ``perfectly conducting'', being immune to backscattering by non-magnetic disorder. Here, we reveal a fundamental ``topological fragility'': these states exhibit a bilinear magnetoelectric resistance significantly larger than in 2D systems. This effect requires two ingredients: (i) spin-momentum locking, which maximizes time-reversal symmetry breaking in the non-linear regime, and (ii) random spin-orbit interaction -- the same mechanism behind Elliott - Yafet spin relaxation in heavy elements. Together, these generate a robust backscattering channel when a modest external magnetic field is applied. Our theory requires no gap opening or complex many-body effects, offering a simple and general mechanism that quantitatively explains recent observations in Bismuth hinge states.", "url": "https://arxiv.org/abs/2605.25774", "type": "理论", "summary": "1. 该工作揭示了拓扑绝缘体及高阶拓扑绝缘体中无能隙边缘态存在的“拓扑脆弱性”，即其双线性磁电阻效应远强于二维体系。\n2. 其核心机制在于自旋动量锁定在非线性区域最大化时间反演对称性破缺，结合随机自旋轨道耦合在微弱外磁场下形成稳健背散射通道。\n3. 该理论无需能隙打开或多体效应，为定量解释铋铰链态近期实验观测提供了简单普适的物理图像。", "summary_source": "deepseek", "authors": [{"name": "Cosimo Gorini"}, {"name": "Matthieu Bard"}, {"name": "Sophie Gueron"}, {"name": "Hélène Bouchiat"}, {"name": "Giovanni Vignale"}], "featured_authors": [{"name": "Cosimo Gorini"}, {"name": "Matthieu Bard"}, {"name": "Sophie Gueron"}, {"name": "Hélène Bouchiat"}, {"name": "Giovanni Vignale"}], "author_count": 5}, {"id": "2605.25812", "category": "cond-mat", "title": "Equivalent-neighbor $k$-core percolation in two dimensions", "abstract": "We perform large-scale numerical simulations to investigate the critical behavior of $k$-core percolation in two dimensions with an extended interaction range $r$. By systematically varying both the core index $k$ and the interaction range $r$, we construct a comprehensive phase diagram in the $(k,r)$ plane. In contrast to $k$-core percolation in infinite dimensions, no hybrid transition is observed in two dimensions: the phase diagram contains only a continuous transition regime and a strictly first-order regime, separated by a tricritical or critical-end point $(k_s,r_s)$. For $k<k_s$ and $r<r_s$, the transition is continuous and belongs to the universality class of standard two-dimensional (2D) percolation. For $k>k_s$ and finite $r>r_s$, the transition is discontinuous, with no hybrid features or critical singularities. In this first-order regime, the pseudocritical point approaches the critical point as $1/\\ln L$, where $L$ is the linear system size, distinct from the $L^{-d}$ scaling typical of conventional thermodynamic first-order transitions in $d$ dimensions. This logarithmic finite-size drift is consistent with a nucleation-driven mechanism, in which rare voids trigger the collapse of the finite-range $k$-core. These results demonstrate that geometric constraints can fundamentally alter the nature of $k$-core percolation found in finite dimensions.", "url": "https://arxiv.org/abs/2605.25812", "type": "理论+数值", "summary": "1. 该工作通过大规模数值模拟系统研究了二维等价邻域k-core渗流中相互作用范围r与核心阈值k的临界行为，构建了完整的(k,r)相图。\n2. 其关键物理发现为相图仅含连续相变与严格一级相变区域，由三临界点或临界端点分隔；连续相变归属标准二维渗流普适类，一级相变中伪临界点以1/ln L漂移，源于稀有空洞驱动的成核机制，异于常规的L^{-d}标度。\n3. 这揭示了几何约束可根本改变非局域相互作用系统中k-core渗流的相变性质，为理解有限维度下类似模型的临界现象提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Qiyuan Shi"}, {"name": "Ming Li"}, {"name": "Youjin Deng"}], "featured_authors": [{"name": "Qiyuan Shi"}, {"name": "Ming Li"}, {"name": "Youjin Deng"}], "author_count": 3}, {"id": "2605.25872", "category": "cond-mat", "title": "Cluster moves with an entropic reservoir accelerate low-temperature simulations of three-dimensional spin glasses", "abstract": "We present an algorithm for the simulation of three-dimensional spin glasses deep in the low-temperature phase: Parallel Tempering enhanced with Houdayer moves and with an entropic reservoir (PTHR). Although differences with the standard Houdayer algorithm are small, PTHR allows us to equilibrate a large number of samples of $L=16$ lattices with Gaussian couplings for temperatures $T\\geq 0.2$. We show that the computational complexity displays better size scaling than standard Parallel Tempering. For finite sizes, our method outperforms other cluster algorithms by a speedup factor of around 64. In close analogy with standard Parallel Tempering, PTHR's computational complexity strongly relates to temperature chaos.", "url": "https://arxiv.org/abs/2605.25872", "type": "数值", "summary": "1. 该工作提出一种结合Houdayer移动与熵库的并行回火算法(PTHR)，用于三维自旋玻璃深低温模拟。\n2. 其技术核心在于熵库的引入使L=16格子样本在T≥0.2下高效平衡，计算复杂度标度优于标准并行回火，速度提升约64倍。\n3. 这一算法与温度混沌的强关联表明，它为研究自旋玻璃低温相及优化大规模模拟提供了具体路径。", "summary_source": "deepseek", "authors": [{"name": "Claudio Chilin"}, {"name": "Enzo Marinari"}, {"name": "Víctor Martín-Mayor"}, {"name": "Giorgio Parisi"}, {"name": "Juan J. Ruiz-Lorenzo"}, {"name": "David Yllanes"}], "featured_authors": [{"name": "Claudio Chilin"}, {"name": "Enzo Marinari"}, {"name": "Víctor Martín-Mayor"}, {"name": "Giorgio Parisi"}, {"name": "Juan J. Ruiz-Lorenzo"}, {"name": "David Yllanes"}], "author_count": 6}, {"id": "2605.25884", "category": "cond-mat", "title": "Scaling features for the stress fluctuations in the OFC model", "abstract": "We consider the Olami-Feder-Christensen (OFC) model on a square two-dimensional lattice with open boundary conditions. The model exhibits self-organized criticality and explains the Gutenberg-Richter law observed for earthquakes. A parameter $\\alpha$ controls the level of local dissipation: $\\alpha < 0.25$ corresponds to locally dissipative and $\\alpha = 0.25$ marks locally conservative dynamics. The avalanche size distribution follows a decaying power-law, with a non-universal critical exponent. Here, we examine the probability distribution of the difference between avalanche size and area. This quantity remains unexplored despite being of significant interest in earthquakes. We find a power-law with a scaling exponent close to one in the conservative OFC model. The scaling feature vanishes even for the physically relevant case $\\alpha = 0.21$. To examine the robustness of such features, we also examine the same quantity in the BTW and Manna sandpile models on a square lattice. We find that the power-law behavior survives for these systems due to locally conservative dynamics. We further examine the local and total stress fluctuations in the OFC model for both locally conservative and dissipative dynamics. The finite-size scaling analysis of the power spectra for the stress fluctuations reveals qualitatively the same but quantitatively significantly different behavior. The dynamic exponent describing the divergence of the correlation time with system size changes from nearly ballistic in the conservative to diffusive behavior in the locally dissipative dynamics with $\\alpha = 0.21$. The local stress also exhibits a signature of nearly canonical $1/f$ noise in the intermediate regime, and $1/f^2$-type scaling dominates the high-frequency regime.", "url": "https://arxiv.org/abs/2605.25884", "type": "理论+数值", "summary": "1. 该工作通过分析OFC模型的局部与总应力涨落功率谱，系统研究了应力波动的标度行为在不同耗散参数下的变化。\n2. 核心发现是保守情况下动态指数近乎弹道（约1），而α=0.21耗散下变为扩散行为，且中间频率区出现近1/f噪声特征。\n3. 这些标度特征为理解自组织临界系统中应力传播动力学及地震统计规律提供了关键约束，并值得在其他模型中检验其普适性。", "summary_source": "deepseek", "authors": [{"name": "Naveen Kumar"}, {"name": "Rahul Chhimpa"}, {"name": "Avinash Chand Yadav"}], "featured_authors": [{"name": "Naveen Kumar"}, {"name": "Rahul Chhimpa"}, {"name": "Avinash Chand Yadav"}], "author_count": 3}, {"id": "2605.25915", "category": "cond-mat", "title": "Mutual Friction in Dissipative Gross-Pitaevskii Thermal Counterflow Turbulence", "abstract": "We report numerical simulations of the dissipative Gross-Pitaevskii equation for a bulk region of thermal-counterflow turbulence. Quasistationary states are obtained over a range of forcing, damping, and healing-length parameters. The mutual-friction acceleration exhibits cubic scaling with the mean relative velocity between the superfluid and normal-fluid components, and the coefficient of this scaling is linked to the phenomenological damping parameter. The intervortex spacing follows the expected dimensional scaling in the weak-forcing regime. Comparison with a straight-vortex-line model suggests that the vortex-line orientations are nearly isotropic.", "url": "https://arxiv.org/abs/2605.25915", "type": "理论+数值", "summary": "1. 该工作对耗散Gross-Pitaevskii方程热逆流湍流体进行了数值模拟，获得了准稳态并扫描了强迫、阻尼与愈合长度参数。\n2. 主要发现是互摩擦力加速度与超流-正常流体相对速度均值呈三次方标度关系，其系数与唯象阻尼参数直接关联。\n3. 与直涡线模型对比揭示涡线取向近似各向同性，为理解超流湍流中耗散过程的结构和标度行为提供了数值基础。", "summary_source": "deepseek", "authors": [{"name": "Kyo Yoshida"}, {"name": "Hideaki Miura"}, {"name": "Yoshiyuki Tsuji"}], "featured_authors": [{"name": "Kyo Yoshida"}, {"name": "Hideaki Miura"}, {"name": "Yoshiyuki Tsuji"}], "author_count": 3}, {"id": "2605.25938", "category": "cond-mat", "title": "Exact Single-Scale Outer Solution of the Abrikosov Vortex in the Extreme Type-II Limit", "abstract": "We determine the exact outer structure of the Abrikosov vortex in the extreme type-II limit, which occurs when the Ginzburg-Landau parameter $\\kappa$ diverges. In this limit, Ginzburg-Landau theory simplifies, outside a shrinking core, to a closed nonlinear theory for the superfluid velocity subject to an algebraic density constraint. The resulting solution is asymptotically exact everywhere outside the vanishing vortex core, demonstrating that both magnetic field and superconducting density vary on the length scale of the London penetration depth. This establishes that the conventional two-length-scale picture of the vortex does not hold in the $\\kappa\\gg 1$ limit.", "url": "https://arxiv.org/abs/2605.25938", "type": "理论", "summary": "1. 该工作严格求解了极端第二类极限（金兹堡-朗道参数κ发散）下Abrikosov涡旋的精确外部结构。\n2. 其核心在于证明涡旋外部超流速度满足含代数密度约束的闭合非线性理论，且磁场与超导密度仅以伦敦穿透深度为单一标度变化，推翻了传统的双标度图像。\n3. 这为高κ超导体中涡旋物理的精确描述提供了渐近严格的理论基础，并启示了非线性约束在强第二类极限中的普适作用。", "summary_source": "deepseek", "authors": [{"name": "Eugene B. Kolomeisky"}], "featured_authors": [{"name": "Eugene B. Kolomeisky"}], "author_count": 1}, {"id": "2605.25946", "category": "cond-mat", "title": "Generalized field mixing for endpoint criticality with marginal flow: resolving the four-state Potts endpoint in the square-lattice $J_1$--$J_2$ Ising model", "abstract": "Identifying the asymptotic criticality of a critical endpoint is challenging, as pseudo-first-order signatures persist over accessible system sizes and mask its underlying critical nature. This ambiguity is amplified at endpoints controlled by a marginally irrelevant scaling field, where logarithmic flow delays the onset of asymptotic scaling. Here we develop a generalized field-mixing framework for endpoint criticality governed by one relevant scaling field together with a marginally irrelevant one, a setting that lies outside the conventional two-relevant-field formulation. By constructing a finite-size pseudocritical manifold, the framework removes the normal relevant detuning and exposes the residual marginal drift, enabling controlled histogram- and Binder-based finite-size analyses. We apply this approach to the frustrated square-lattice $J_1$--$J_2$ Ising model, where the location and even the nature of the stripe-ordering endpoint have remained controversial for decades. The endpoint is isolated directly as a distinct singular point, rather than inferred from where the phase boundary appears most Potts-like, and its asymptotic criticality is shown to follow four-state Potts universality with logarithmic corrections. This identification is independently supported by direct comparison with the Potts point of the Ashkin--Teller model and by consistent Binder scaling in both the magnetic and nematic sectors. Our results resolve a longstanding numerical ambiguity in a paradigmatic frustrated Ising system and establish a general framework for extracting asymptotic endpoint criticality in the presence of marginal flow.", "url": "https://arxiv.org/abs/2605.25946", "type": "理论+数值", "summary": "1. 该工作发展了一个广义场混合框架，用于处理由一个相关标度场和一个边缘无关场共同支配的端点临界性。\n2. 其核心在于通过构造有限尺寸赝临界流形来移除正常相关失谐，从而暴露残余边缘漂移，实现基于直方图和Binder比的受控有限尺寸分析。\n3. 这一框架成功将正方形格子J1-J2伊辛模型中条纹有序端点直接识别为四态Potts普适性类，并带有对数修正，为存在边缘流的端点临界性提取提供了通用方案。", "summary_source": "deepseek", "authors": [{"name": "Yihua Sun"}, {"name": "Yuchen Fan"}], "featured_authors": [{"name": "Yihua Sun"}, {"name": "Yuchen Fan"}], "author_count": 2}, {"id": "2605.25972", "category": "cond-mat", "title": "Excess entropy scaling of the transverse sound speed in simple fluids", "abstract": "A calculation of the transverse sound velocity as a function of excess entropy is presented for several simple fluids, including the Lennard-Jones, Yukawa, one-component plasma, inverse-power law (soft sphere) and hard sphere models. A quasi-universal character of this dependence is established, extending Rosenfeld's excess-entropy scaling of transport coefficients to the transverse sound velocity. The results are discussed in terms of the soft- to hard-sphere crossover and the Frenkel crossover between gas-like and liquid-like dynamics.", "url": "https://arxiv.org/abs/2605.25972", "type": "理论+数值", "summary": "1. 该工作针对Lennard-Jones、Yukawa、单组分等离子体、逆幂律及硬球等多种简单流体，计算了横向声速随过剩熵的变化关系。\n2. 其核心卖点在于发现该依赖关系呈现准普适标度，成功将Rosenfeld输运系数的过剩熵标度推广至横向声速，并关联了软球-硬球交叉与Frenkel气体-液体动力学转变。\n3. 这为统一热力学与动力学性质的标度行为提供了关键桥梁，并启发将此类普适标度拓展至更复杂流体体系。", "summary_source": "deepseek", "authors": [{"name": "Sergey Khrapak"}], "featured_authors": [{"name": "Sergey Khrapak"}], "author_count": 1}, {"id": "2605.25982", "category": "cond-mat", "title": "Light-Induced Transient Polarization Reversal in Rhombohedrally Stacked Bilayer Transition-Metal Dichalcogenides via an Electronic Mechanism", "abstract": "Light-induced sliding ferroelectricity in two-dimensional van der Waals materials enables polarization control via relative layer motion. However, polarization switching occurs on the time scale of shear modes (tens of ps) and requires very large fluences, potentially damaging the samples. Here, using constrained density functional theory and many-body real-time simulations, we demonstrate an ultrafast electronic reversal of the total out-of-plane polarization sign in the photoexcited state, without requiring interlayer sliding, in rhombohedrally stacked transition-metal dichalcogenide bilayers. The polarization changes sign relative to its initial ground-state value at moderate fluences and within 200 fs, about 50 times faster than the typical shear-mode period. The ultrafast switching is driven by a rearrangement of localized dipoles around the tungsten sites. We establish a novel general mechanism for electronic control of low-dimensional ferroelectrics common to all polar multilayers having type II band alignment. Our work has direct implications for ultrahigh-speed volatile optical memory operating on sub-ps time scales.", "url": "https://arxiv.org/abs/2605.25982", "type": "理论+数值", "summary": "1. 该工作利用约束密度泛函理论与多体实时模拟，在光激发菱面堆叠双层过渡金属硫族化合物中实现了无需层间滑动的超快电子极化翻转。\n2. 其主要技术突破在于极化符号在200飞秒内完成反转，比典型剪切模周期快约50倍，机制源于钨位点局域偶极子的重排。\n3. 这建立了一种适用于所有具有II型能带排列极性多层膜的电子控制铁电通用机制，为亚皮秒易失性光存储器提供了直接启发。", "summary_source": "deepseek", "authors": [{"name": "Xiangzhou Zhu"}, {"name": "Stefano Mocatti"}, {"name": "Matteo Calandra"}], "featured_authors": [{"name": "Xiangzhou Zhu"}, {"name": "Stefano Mocatti"}, {"name": "Matteo Calandra"}], "author_count": 3}, {"id": "2605.25987", "category": "cond-mat", "title": "Boltzmann Distribution from Invariance of Coarse-Graining-Scale and Energy-Shift", "abstract": "We present a concise derivation of the Boltzmann form for single-particle energy distributions in classical many-body Hamiltonian systems. The derivation relies on two physical facts: coarse-graining-scale invariance of the empirical distribution and invariance under a uniform shift of the energy zero. These conditions uniquely yield the Boltzmann factor, whose parameter is fixed by the mean energy per particle. For separable Hamiltonians, the equilibrium weight factorizes into kinetic and configurational contributions sharing the same parameter, identified from the kinetic part as the inverse kinetic temperature. The principle extends to any physical quantity with a stationary distribution and translational invariance. It is illustrated in a one-dimensional diatomic hard-core gas and a nonlinear lattice chain, where it predicts velocity, energy, spacing, collision-time, and pressure-dependent displacement distributions in agreement with simulations. The lattice model further shows how harmonic elasticity, anharmonic corrections, internal pressure, and thermal expansion emerge from the same exponential equilibrium weights. Finally, the relationships among different ensembles are briefly discussed.", "url": "https://arxiv.org/abs/2605.25987", "type": "理论+数值", "summary": "1. 该工作基于粗粒化尺度不变性与能量零点平移不变性，给出了经典多体系统中单粒子能量分布玻尔兹曼形式的简洁推导。\n2. 核心在于利用经验分布对粗粒化尺度和能量平移的不变性唯一确定玻尔兹曼因子，其参数由每粒子平均能量固定，并可分离系统动能部分直接识别为逆动力学温度。\n3. 该原理可推广至任意具有稳态分布和平移不变性的物理量，并在硬核气体与非线性晶格中得以验证，为理解弹性、非谐修正及热膨胀等涌现行为提供了统一视角。", "summary_source": "deepseek", "authors": [{"name": "Weicheng Fu"}, {"name": "Yisen Wang"}, {"name": "Yong Zhang"}, {"name": "Hong Zhao"}], "featured_authors": [{"name": "Weicheng Fu"}, {"name": "Yisen Wang"}, {"name": "Yong Zhang"}, {"name": "Hong Zhao"}], "author_count": 4}, {"id": "2605.25989", "category": "cond-mat", "title": "Beyond Gaussian Statistics in Polymer Melts: Statistical Masking of Persistent Local Constraints", "abstract": "Short polymer chains exhibit clear deviations from Gaussian end-to-end distance statistics, yet the molecular mechanism by which Gaussian behavior is recovered in long chains remains unestablished. Atomistic molecular dynamics simulations of polyethylene melts reveal that conformational heterogeneity persists at the Kuhn scale across all chain lengths, consisting of a mosaic of slow-relaxing, extended aligned chain segments (ACS) and coiled segments -- random conformational sequences (RCS) and chain ends (CE). We show that the end-to-end distance distributions for both unentangled and entangled chains are accurately described by a $q$-Gaussian function, with the entropic index $q$ increasing systematically from $0.67$ (C50) to $0.99$ (C500). This evolution tracks the emergence and accumulation of RCS segments, which are absent in short chains, establishing $q$ as a quantitative ``heterogeneity index''. The $q < 1$ values are a signature of non-extensive statistics, with the ratio of Tsallis to Boltzmann-Gibbs entropy ($S_q/S_1$), computed directly from simulation data without fitting, decreasing from $1.80$ (C50) to $1.03$ (C500). Crucially, we demonstrate that Gaussian recovery does not result from the erasure of Kuhn-scale heterogeneities, as ACS domains persist in all chain lengths above the critical mass ($\\approx 35\\%$). Instead, the transition to Gaussian statistics is a statistical masking effect, where the accumulation of independent RCS segments progressively obscures the non-Gaussian signatures of the persistent ACS domains.", "url": "https://arxiv.org/abs/2605.25989", "type": "理论+数值", "summary": "1. 该工作通过聚乙烯熔体的原子分子动力学模拟，揭示了长链高分子中高斯统计恢复的分子机制。\n2. 其核心发现是端到端距离分布服从q-高斯函数，熵指数q定量表征构象异质性，且高斯恢复源于独立随机卷曲线段累积对持久局部约束的统计掩蔽，而非异质性消除。\n3. 这为利用非广延统计框架定量描述高分子多尺度构象行为提供了明确物理图像，并启发对异质性结构与统计涌现耦合的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "José A. Martins"}], "featured_authors": [{"name": "José A. Martins"}], "author_count": 1}, {"id": "2605.25996", "category": "cond-mat", "title": "Topology of pulsating active matter: Defect asymmetry controls emergent motility", "abstract": "In pulsating active matter, topological defects are motile despite the absence of any macroscopic flows and microscopic self-propulsion. We reveal that this motility arises from a ratchet effect: the mechanochemical coupling between local oscillations and repulsive interactions breaks both spatial and time-reversal symmetries, thus leading asymmetric rotating defects to drift under fluctuations. This mechanism regulates a crossover between spiral waves connecting slow defects and fiber-like waves connecting fast defects, in analogy with the onset of heart rhythm disorder in cardiac tissues. We rationalize this crossover in terms of a fluctuating hydrodynamics that captures how motile defects spontaneously nucleate and move within an ordered background.", "url": "https://arxiv.org/abs/2605.25996", "type": "理论", "summary": "1. 该工作通过脉动活性物质中拓扑缺陷的涌现运动性，揭示了缺陷不对称性如何调控其自发漂移行为。\n2. 其核心发现是局部振荡与排斥相互作用的机械化学耦合产生棘轮效应，同时打破空间与时间反演对称性，导致缺陷在涨落下朝特定方向运动。\n3. 这为理解活性物质中拓扑缺陷的动力学以及类比心脏组织中心律失序的机制提供了涨落流体动力学框架。", "summary_source": "deepseek", "authors": [{"name": "Luca Casagrande"}, {"name": "Alessandro Manacorda"}, {"name": "Etienne Fodor"}], "featured_authors": [{"name": "Luca Casagrande"}, {"name": "Alessandro Manacorda"}, {"name": "Etienne Fodor"}], "author_count": 3}, {"id": "2605.26069", "category": "cond-mat", "title": "Effect of slow bonds on current fluctuations in the symmetric simple exclusion process", "abstract": "The symmetric simple exclusion process (SSEP) is a paradigmatic model of classical non-equilibrium dynamics. Exact results for large deviations of particle current in the SSEP have been obtained in various settings using integrability-based methods. In this Article, we discuss how these results are modified in the presence of localized slow bonds. We consider three conventional geometries: (a) a finite one-dimensional lattice weakly coupled to unequal reservoirs at its boundaries, (b) a semi-infinite one-dimensional lattice weakly coupled to a boundary reservoir, and (c) an infinite one-dimensional lattice with localized slow bonds near the origin. For each case, we present exact expressions for the large deviation function of current and validate them through rare-event simulations based on the cloning algorithm. In connection with our results, we present an elementary derivation of the exact large deviation function for the current in the semi-infinite SSEP, complementing recent results obtained through more elaborate techniques.", "url": "https://arxiv.org/abs/2605.26069", "type": "理论+数值", "summary": "1. 该工作解析研究了局域慢键对对称简单排斥过程中粒子流大偏差函数的精确修正，涵盖有限、半无限及无限一维晶格三种经典几何。\n2. 其核心在于通过克隆算法稀有事件模拟验证了精确表达式，并对半无限系统给出了大偏差基本推导，补充复杂技术结果。\n3. 这展示了局域缺陷如何调控非平衡电流涨落的统计行为，为涨落定理及边界驱动系统的理论与模拟提供了具体启示。", "summary_source": "deepseek", "authors": [{"name": "Soumyabrata Saha"}, {"name": "Sandeep Jangid"}, {"name": "Kapil Sharma"}, {"name": "Tridib Sadhu"}], "featured_authors": [{"name": "Soumyabrata Saha"}, {"name": "Sandeep Jangid"}, {"name": "Kapil Sharma"}, {"name": "Tridib Sadhu"}], "author_count": 4}, {"id": "2605.26094", "category": "cond-mat", "title": "Response of a dipolar BEC to Laguerre-Gaussian beam driven STIRAP", "abstract": "Coherent light-matter coupling via STIRAP can offer a versatile route to nucleate quantized vortices in Bose-Einstein condensates, yet its efficacy in dipolar condensates remains an open question. Can the orbital angular momentum of a Laguerre-Gaussian beam be coherently transferred to a dipolar BEC via STIRAP? We investigate this for a quasi-two-dimensional trapped dipolar condensate using co-propagating Gaussian and Laguerre-Gaussian laser beams. The interplay between long-range dipole-dipole interactions and short-range contact interactions enables access to three interaction-driven phases: superfluid, droplet, and supersolid. We find that the amount of angular momentum transferred from the optical field to the dipolar condensate, along with the nucleation and persistence of vortices, depends strongly on the underlying phases of the dipolar BEC. In the superfluid, STIRAP achieves near-complete population transfer and nucleates a stable, long-lived quantized vortex. In the droplet phase, although the vortex remains pinned within the density profile, the angular momentum is partially retained and oscillatory, accompanied by droplet fragmentation and recombination. In the supersolid phase, when the external magnetic field is oriented perpendicular to the LG beam's propagation direction, the emergence of a modulated density distribution along with a slight reduction in inter-droplet coherence leads to vortex delocalization and eventually expels it along the field direction, yielding a vanishing average angular momentum. However, reorienting the magnetic polarization along the beam propagation direction restores efficient angular momentum transfer and stabilizes the vortex within the supersolid phase. Overall, our results demonstrate a versatile route to engineer vortex states and probe collective excitations in dipolar Bose gases via coherent light-matter coupling.", "url": "https://arxiv.org/abs/2605.26094", "type": "理论", "summary": "1. 该工作研究偶极玻色-爱因斯坦凝聚体在拉盖尔-高斯光束驱动STIRAP下的响应，揭示角动量转移与涡旋成核对超流、液滴及超固体三相的依赖关系。\n2. 其核心在于长程偶极-偶极相互作用与短程接触相互作用的竞争，以及外磁场取向对超固体相中涡旋稳定性的关键调控。\n3. 这为通过相干光-物质耦合在偶极量子气体中工程化涡旋态并探测集体激发提供了可调控的多功能途径。", "summary_source": "deepseek", "authors": [{"name": "Deepu Singh"}, {"name": "Hari Sadhan Ghosh"}, {"name": "Arpana Saboo"}, {"name": "Soumyadeep Halder"}, {"name": "Sonjoy Majumder"}], "featured_authors": [{"name": "Deepu Singh"}, {"name": "Hari Sadhan Ghosh"}, {"name": "Arpana Saboo"}, {"name": "Soumyadeep Halder"}, {"name": "Sonjoy Majumder"}], "author_count": 5}, {"id": "2605.24085", "category": "hep-th", "title": "Finite scalar field theory with SU(1,1) spacetime symmetry from near-BPS limits of $\\mathcal{N}=4$ SYM", "abstract": "In this work, we consider an interacting and matrix-valued scalar quantum field theory that emerges from a near-BPS decoupling limit of $\\mathcal{N}=4$ super Yang-Mills. The theory is non-Lorentzian with SU(1,1) spacetime symmetry and admits a (semi-)local action formulation. The interaction can be viewed as arising from a non-abelian gauge field without propagating degrees of freedom. The proposed field theory action has previously been considered as classically equivalent to SU(1,1) Spin Matrix theory. In this work, we examine this equivalence at the quantum level. We show that the classical action is off-shell invariant under the SU(1,1) symmetry group. We then analyze the renormalization properties, showing the theory is finite at all orders in perturbation theory. This provides a rare example of a non-supersymmetric and non-Lorentzian quantum field theory where a non-renormalization theorem holds.", "url": "https://arxiv.org/abs/2605.24085", "type": "理论", "summary": "1. 该工作从𝒩=4超杨-米尔斯理论的近BPS退耦极限出发，构建了一个具有SU(1,1)时空对称性的矩阵值标量量子场论。\n2. 其核心在于证明了经典作用量在SU(1,1)下离壳不变，且该理论在微扰论所有阶有限，给出了非超对称非洛伦兹量子场论中罕见的非重整化定理。\n3. 这为非洛伦兹量子场论的重整化性质研究提供了一个完全有限的可解范例，并确立了其与SU(1,1)自旋矩阵理论在量子层面的等价性。", "summary_source": "deepseek", "authors": [{"name": "Roberto Auzzi"}, {"name": "Stefano Baiguera"}, {"name": "Lihan Guo"}, {"name": "Troels Harmark"}, {"name": "Giuseppe Nardelli"}], "featured_authors": [{"name": "Roberto Auzzi"}, {"name": "Stefano Baiguera"}, {"name": "Lihan Guo"}, {"name": "Troels Harmark"}, {"name": "Giuseppe Nardelli"}], "author_count": 5}, {"id": "2605.24101", "category": "hep-th", "title": "Bremsstrahlung function in $\\mathcal{N}=2$ SCFTs far beyond the supergravity limit", "abstract": "We study the Bremsstrahlung function in two four-dimensional $\\mathcal{N}=2$ superconformal gauge theories: the E-theory, with hypermultiplets in the symmetric and antisymmetric representations, and the D-theory, with antisymmetric and fundamental matter. Using matrix model techniques, we derive exact results at arbitrary coupling for the first few orders in the large-$N$ expansion. At leading order, both theories are shown to be planar equivalent to $\\mathcal{N}=4$ Super Yang-Mills, while beyond the planar limit their behavior differs significantly. For the E-theory, we prove that the subleading correction is exactly given by a derivative of the free energy with respect to the coupling. This relation enables us to determine the complete strong-coupling expansion for the Bremsstrahlung function, including non-perturbative contributions, by exploiting known results for the free energy. For the D-theory, the exact expressions have a more intricate structure. We perform a detailed analysis of the strong-coupling regime of the subleading large-$N$ corrections, showing that, in this case, there are expansions in inverse powers of the coupling which truncate after finitely many terms. We further analyze the non-perturbative effects at strong coupling and derive closed-form expressions also for these contributions. These results provide precise predictions for the holographic duals of both theories beyond the supergravity approximation, probing higher orders in the large-$N$ expansion and the full subleading corrections at strong coupling.", "url": "https://arxiv.org/abs/2605.24101", "type": "理论", "summary": "1. 该工作利用矩阵模型技术，在任意耦合强度下精确计算了两种四维N=2超共形规范理论——E理论（含对称与反对称超多重态）与D理论（含反对称与基础物质）——的Bremsstrahlung函数在大N展开中的前几阶项，并验证了领头阶平面等价于N=4超杨-米尔斯理论，从而首次深入超引力极限之外的区域。\n2. 技术关键在于严格证明E理论中次领头大N修正等价于自由能对耦合常数的导数，据此利用自由能已知解析结果完整确定了强耦合展开的全部非微扰贡献；而对D理论，则揭示出强耦合逆幂级数在有限阶后截断的奇特性质，并同样给出了非微扰部分的闭式表达。\n3. 这些精确结果远超超引力近似，为两种理论的全息对偶提供了大N展开高阶项以及强耦合下完整次领头修正的严格理论预测，这些预测可直接用于检验相应的弦理论双关描述和非微扰全息计算，从而为超越超引力的强耦合现象研究奠定了坚实的理论基准。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo De Lillo"}, {"name": "Paolo Vallarino"}], "featured_authors": [{"name": "Lorenzo De Lillo"}, {"name": "Paolo Vallarino"}], "author_count": 2}, {"id": "2605.24237", "category": "hep-th", "title": "A Matrix Model for Higher-Genus Fuss--Catalan Numbers", "abstract": "The genus--g Fuss--Catalan (FC) number counts the number of ways to obtain a genus-g surface by identifying the edges of a pn--gon via p-valent hyperedges. For p=2 these are the genus--g Catalan numbers which are generated as the trace correlations in the Gaussian matrix model (GUE). Here we construct a simple two-matrix model which generates the higher-genus Fuss--Catalan numbers for any p as the coefficients of its 1/N-expansion. We obtain exact sum rules and an explicit formula for the higher-genus Fuss--Catalan numbers which generalises the Harer--Zagier formula to p>2. We discuss the relation of the higher-genus FC numbers to the intersection numbers and the Euler characteristic of the moduli space of spin-p curves.", "url": "https://arxiv.org/abs/2605.24237", "type": "理论", "summary": "1. 本文构造了一个双矩阵模型，其1/N展开系数精确生成任意p值的高亏格Fuss–Catalan数。\n2. 核心技术亮点在于该模型提供了推广的Harer–Zagier公式及精确求和规则，从而统一了更高亏格组合数的生成函数描述。\n3. 这一工作暗示了高亏格Fuss–Catalan数与旋p曲线模空间的交理论及欧拉示性数之间的深刻联系。", "summary_source": "deepseek", "authors": [{"name": "Anatol Kirillov"}, {"name": "Ivan Kostov"}], "featured_authors": [{"name": "Anatol Kirillov"}, {"name": "Ivan Kostov"}], "author_count": 2}, {"id": "2605.24487", "category": "hep-th", "title": "Hawking radiation from a semi-classical Schwarzschild black hole", "abstract": "This study investigates the evaporation process of a Schwarzschild black hole, incorporating quantum corrections arising from conformal anomaly and vacuum polarization. We demonstrate that these corrections significantly alter the Hawking radiation and the black hole's thermodynamic behavior. Specifically, the black hole exhibits a maximum temperature, after which the radiation begins to decrease, eventually leading to the cessation of Hawking radiation. The final state of the black hole at the end of the evaporation process is found to be an extremal remnant with a vanishing Hawking temperature. Furthermore, we show that the black hole entropy is modified, acquiring a logarithmic correction. Hawking radiation is also examined through the lens of the tunneling method, providing a consistent picture of these quantum effects.", "url": "https://arxiv.org/abs/2605.24487", "type": "理论", "summary": "1. 该工作将共形反常与真空极化作为量子修正纳入史瓦西黑洞半经典框架，全面分析了霍金辐射演化及热力学量在这些修正下的详细行为。\n2. 核心物理发现在于黑洞温度呈现非单调变化：存在最高温度，随后辐射逐步衰减至完全停止，终态为零温极端残余，且熵获得对数修正，显著区别于经典无限升温图像。\n3. 隧穿方法所提供的自洽图像证实了蒸发终止于极端残余的机制，为理解黑洞终态热力学稳定性与量子引力效应的可检验性提供了明确理论方向。", "summary_source": "deepseek", "authors": [{"name": "Moslem Shafiee"}, {"name": "Ahmad Sheykhi"}], "featured_authors": [{"name": "Moslem Shafiee"}, {"name": "Ahmad Sheykhi"}], "author_count": 2}, {"id": "2605.24512", "category": "hep-th", "title": "Graviton scattering in the null surface formulation. Part III: Fourth-order Bondi shear and the tree-level amplitude", "abstract": "We complete a trilogy on quantum graviton scattering in the null surface formulation (NSF) of general relativity by computing the fourth-order Bondi shear $\\sigma^+_4$ and establishing three results of general scope. The perturbative $S$-matrix of the NSF is UV-finite at every loop order. This follows from the kernel scaling $K^{(n)}\\sim\\omega_{\\mathrm{ext}}/q^{n-2}$, which we derive by induction on the recursive null-cone scattering equation; the $L$-loop integrand then scales as $dq/q^{4L}$, which is convergent for all $L\\geq 1$ without regularization. We show that a simple loop-counting formula, $L=(n_1+n_2-6)/2$, classifies the topologically distinct contributions to $2\\to 2$ graviton scattering by the perturbative orders $n_1$, $n_2$ of the out-operators. Tree level ($L=0$) is exhausted by $\\mathcal{M}^{(22)}$, $\\mathcal{M}^{(33)}$, and $\\mathcal{M}^{(24)}$, which together reproduce the Weinberg--DeWitt amplitude $\\mathcal{M}_{\\mathrm{tree}}=-\\kappa^2s^3/(4tu)$. The complete 1-loop amplitude requires, in addition to $\\sigma^+_4$, the fields $\\sigma^+_5$ and $\\sigma^+_6$. At order $n\\geq 4$ the standard Jordan--Pauli argument, which equates the advanced and retarded null-cone contributions, must be extended. The advanced cone receives additional contributions from $\\delta\\sigma^+_j$ ($j<n$), the nontrivial scattering corrections determined at previous orders. We formulate this as a generalized Jordan--Pauli relation that provides a systematic, order-by-order procedure for computing $\\sigma^+_n$ from the free incoming datum $\\sigma^-$. The computation of $\\sigma^+_4$ uses three retarded-cone pairs, the conformal factor $\\delta\\Omega^-_4$, and -- for the first time -- advanced-cone corrections from pairs $(1,3)$ and $(2,2)$ built from the known $\\sigma^+_2$ and $\\sigma^+_3$", "url": "https://arxiv.org/abs/2605.24512", "type": "理论", "summary": "1. 该工作完成了零曲面表述下引力子散射的三部曲，计算了四阶Bondi剪切，并建立了三个一般性结果。\n2. 其核心在于通过核标度行为证明该表述的微扰S矩阵在所有圈级紫外有限，且给出了2→2散射中树图与圈图贡献的简单分类公式。\n3. 所推广的Jordan-Pauli关系提供了逐阶计算高阶Bondi剪切的系统框架，直接为完整单圈振幅乃至更高阶结果奠定基础。", "summary_source": "deepseek", "authors": [{"name": "C. N. Kozameh"}, {"name": "G. O. Depaola"}], "featured_authors": [{"name": "C. N. Kozameh"}, {"name": "G. O. Depaola"}], "author_count": 2}, {"id": "2605.24615", "category": "hep-th", "title": "Discrete Laplacian Structure and Kernel Reduction of the Gap Equation in $d=4k+3$ Gross--Neveu Model at Imaginary Chemical Potential", "abstract": "We observe a remarkable mathematical structure in the gap equations of the large-$N$ Gross--Neveu model at imaginary chemical potential in odd spacetime dimensions $d = 4k+3$. We show they can be written as the sum of two parts: one defined by higher-order discrete Laplacian patterns and a cut-off dependent part given by truncated asymptotic expansion of a hypergeometric function. We argue that this picture corresponds to a deeper relationship between thermal field theories in these odd $d$ and exactly-solvable one-dimensional quantum problems. We find that the thermal mass at specific imaginary chemical potential values is fixed where internal energy balances entropic states of thermal modes which is physically equivalent with OPE inversion formula techniques where thermal mass values arise from transcendental sets of equations.", "url": "https://arxiv.org/abs/2605.24615", "type": "理论", "summary": "1. 该工作揭示了虚化学势下d=4k+3维Gross-Neveu模型能隙方程的高阶离散拉普拉斯结构与核约化形式。\n2. 其技术卖点在于将方程分解为离散拉普拉斯模式部分与超几何函数截断渐近展开部分，并建立了与一维可解量子问题的深层对应。\n3. 这暗示热质量由内能-熵态平衡固定，等价于OPE反演公式技术，为理解奇数维热场论的非微扰机制提供了新路径。", "summary_source": "deepseek", "authors": [{"name": "Evangelos G. Filothodoros"}], "featured_authors": [{"name": "Evangelos G. Filothodoros"}], "author_count": 1}, {"id": "2605.24724", "category": "hep-th", "title": "Beyond Algebraic Solutions to Stringy Spacetime", "abstract": "Active feedback between geometry and physics is woven throughout the study of Nature at its fundamental level, and is of key importance in string theory. Methods of complex algebraic geometry in particular have brought about an unrivaled abundance of solutions, counted well into hundreds of orders of magnitude, reciprocated by the discovery of the wholly unexpected mirror symmetry. However, recent developments demonstrate that there are rich additional possibilities, made possible by certain generalizations that, at first glance, appear to be non-algebraic. Nevertheless, they are remarkably well-aligned within an overall mirror-symmetric framework, are amenable to almost as comprehensive quantitative analysis, and hint at a deeper relationship with symplectic geometry.", "url": "https://arxiv.org/abs/2605.24724", "type": "理论", "summary": "1. 该工作揭示了弦论中超越传统代数几何方法的时空解，证明非代数推广仍可纳入镜像对称框架。\n2. 其技术核心在于这些非代数解同样支持全面定量分析，并暗示其与辛几何的深层结构关联。\n3. 这为弦论背景下代数几何与辛几何之间更基本联系的探索提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Tristan Hübsch"}], "featured_authors": [{"name": "Tristan Hübsch"}], "author_count": 1}, {"id": "2605.24739", "category": "hep-th", "title": "Chirality loss during brane merging: a universal power law from the Jackiw-Rebbi index", "abstract": "We investigate the rate at which chiral fermion localisation is lost when two domain walls merge in extra-dimensional braneworld scenarios, using the $(1+1)$-dimensional Jackiw-Rebbi framework as a controlled analytical laboratory. As the inter-brane separation $d$ decreases, left- and right-handed zero modes hybridise and chiral asymmetry is progressively lost. We show that the spatial separation between the chiral zero modes follows a universal power law $|\\Delta_{\\mathrm{abs}}|\\propto d^{\\gamma}$ in the merging limit $d\\to 0^{+}$, with the critical exponent $\\gamma$ determined solely by the Jackiw-Rebbi topological index $N_{\\mathrm{JR}}$, and independent of the fermionic mass gap, the integrability of the scalar sector, and the detailed shape of the domain wall profile. Comparing the integrable sine-Gordon model with four members of the non-integrable double sine-Gordon family, all sharing $N_{\\mathrm{JR}}=1$, we find $\\gamma\\in[0.930,0.985]$. For the sine-Gordon model we derive the closed-form overlap integral $I(d)=2d/\\sinh(2d)$, from which the exact chiral separation follows as a ratio of hyperbolic functions without free parameters. This result identifies $\\gamma$ as the crossover plateau of a local effective exponent $\\gamma_{\\mathrm{eff}}(d)$, explaining the sub-unit value analytically and tracing the universality to the Pöschl-Teller structure of the $N_{\\mathrm{JR}}=1$ zero mode. The universality of $\\gamma$ implies that the rate of four-dimensional Yukawa coupling collapse during brane merging is a topological invariant, insensitive to the microscopic scalar dynamics generating the walls.", "url": "https://arxiv.org/abs/2605.24739", "type": "理论", "summary": "1. 本文利用Jacksow-Rebbi零模分析膜合并过程，确定手性费米子局域化丧失遵从由拓扑指数N_JR决定的普适幂律。\n2. 关键卖点是发现临界指数γ的普适性唯一源于Jacksow-Rebbi指标，与质量隙和畴壁形状无关，并在sine-Gordon模型中给出无参数精确解。\n3. 该结论表明膜合并中手性不对称的消亡速率是拓扑不变量，预示膜世界模型内四维Yukawa耦合崩溃的普适行为。", "summary_source": "deepseek", "authors": [{"name": "H. P. Pinheiro"}, {"name": "C. A. S. Almeida"}], "featured_authors": [{"name": "H. P. Pinheiro"}, {"name": "C. A. S. Almeida"}], "author_count": 2}, {"id": "2605.24783", "category": "hep-th", "title": "Multicritical points of gravitational solitons and a black hole in four dimensions", "abstract": "We present the first realization of multicritical points in four-dimensional general relativity, specifically within the context of Plebański nonlinear electrodynamics, using a polynomial structural function denoted as $\\mathcal{H}(P)$. We show that this construction provides a systematic mechanism to engineer multicritical behavior in gravitational systems. By establishing an explicit mapping between matter theories expressed as power series in the Maxwell invariant $F$ and the Plebański formulation, we construct new families of electrically charged asymptotically anti-de Sitter black holes and magnetically charged solitons. In the grand-canonical ensemble, we analyze their thermodynamic properties and uncover a rich phase structure. We demonstrate that the soliton sector develops multiple swallowtail structures, signaling first-order phase transitions and allowing the coexistence of several magnetically charged solitons with a single electrically charged black hole. These configurations define multicritical points that generalize previously known triple points. We further show that the number of coexisting phases is controlled by the degree of the polynomial structural function, providing a direct link between the nonlinear electrodynamics couplings and the thermodynamic phase structure. In contrast, the black hole branch does not display swallowtail behavior, and it does not allow multiple electrically charged black holes to coexist with a magnetically charged soliton.", "url": "https://arxiv.org/abs/2605.24783", "type": "理论", "summary": "1. 该工作首次在四维时空Plebanski非线性电动力学框架内，通过多项式结构函数实现了引力系统的多临界点，并构造了带电渐近反德西特黑洞与磁荷孤子新家族。\n2. 其技术核心在于建立物质场到Plebanski形式的显式映射，揭示孤子扇区多重燕尾结构所标志的一级相变与多相共存机制，且共存相数目由多项式度直接控制。\n3. 这为通过非线性电动力学耦合系统性调控引力热力学相结构提供了明确路径，启发更一般类型的多临界点与高维推广研究。", "summary_source": "deepseek", "authors": [{"name": "Moaathe Belhaj Ahmed"}, {"name": "Moisés Bravo-Gaete"}, {"name": "Robert B. Mann"}, {"name": "Constanza Quijada"}], "featured_authors": [{"name": "Moaathe Belhaj Ahmed"}, {"name": "Moisés Bravo-Gaete"}, {"name": "Robert B. Mann"}, {"name": "Constanza Quijada"}], "author_count": 4}, {"id": "2605.24978", "category": "hep-th", "title": "Defect Conformal Manifolds along RG Domain Walls between $\\mathbb Z_N$-Parafermions and Minimal Models", "abstract": "We investigate the renormalization group (RG) domain walls interpolating between the $\\mathbb{Z}_N$ parafermion theory (the critical $N$-state Potts model) and the Virasoro minimal model $\\mathcal{M}_{N+1}$. These flows are genuinely non-perturbative and an explicit construction of Gaiotto type RG domain wall remains elusive. We bypass this limitation by employing a bottom-up approach centered on the emergence of ``phantom currents\". By tracking the preserved non-invertible symmetries ($\\mathfrak{so}(3)_N$) along the flow, we extract the exact spectrum of these currents localized on the defect. We demonstrate that the presence of a spin-1 phantom current allows the interface to be marginally deformed, dynamically generating a continuous defect conformal manifold. Furthermore, we show that an extra spin-2 operator, crucially as a $W^{(3)}$-algebra descendant of the spin-1 phantom current, rigidly constrains the UV-IR stress tensor mixing via the cluster decomposition principle. This algebraic framework enables the exact computation of the parameter-dependent transmission rate across the conformal manifold, which we observe strictly vanishes in the large-$N$ limit as a consequence of macroscopic target space collapse.", "url": "https://arxiv.org/abs/2605.24978", "type": "理论", "summary": "1. 该工作采用自底向上方法，绕过Gaiotto型显式构造限制，通过追踪沿RG流的非可逆对称性(so(3)_N)提取局域幻影电流谱，构建了Z_N parafermion与Virasoro最小模型M_{N+1}之间畴壁上的缺陷共形流形。\n2. 其技术核心在于：自旋1幻影电流的边际变形动态生成连续缺陷流形，同时其W^{(3)}代数自旋2后代通过集团分解原理严格约束UV-IR应力张量混合，进而精确计算参数依赖的传输率。\n3. 该代数框架揭示大N极限下传输率严格消失源于宏观靶空间坍缩，为研究非微扰畴壁上的可积变形与非可逆对称性实现提供了严格可解的范例。", "summary_source": "deepseek", "authors": [{"name": "Jin-Rui Zhang"}, {"name": "Jing-Hao Jin"}, {"name": "Ting-Kai Chen"}, {"name": "Jin Chen"}], "featured_authors": [{"name": "Jin-Rui Zhang"}, {"name": "Jing-Hao Jin"}, {"name": "Ting-Kai Chen"}, {"name": "Jin Chen"}], "author_count": 4}, {"id": "2605.25035", "category": "hep-th", "title": "Flux Quantization of Type IIA in Unstable K-Theory", "abstract": "The traditional conjecture that RR-flux is quantized in stable K-cohomology fails to account for the presence of NS-brane sources: These impose nonlinear relations -- reductions of the famous quadratic relation on M-brane flux -- that can only be captured by unstable nonabelian cohomology theories. Here we consider a deformation of unstable K-theory which properly quantizes the fluxes coupling to D0/D2/NS5-branes, find a twisted version that quantizes also the fluxes coupling to NS1/D4-branes, and show that this oxidizes to a proper electromagnetic quantization of M-brane fluxes.", "url": "https://arxiv.org/abs/2605.25035", "type": "理论", "summary": "1. 该工作提出在非稳定K-理论形变下对IIA型弦论RR通量进行量子化的理论方案，修正了传统稳定K-上同调无法处理NS-膜源非线性约束的不足。\n2. 其核心技术在于通过形变非稳定K-理论刻画NS5/D0/D2膜通量耦合，并引入扭曲版本统一量子化NS1/D4膜通量，进而升维至M-膜通量的电磁量子化。\n3. 这为从非稳定上同调角度构建弦/M-理论通量量子化的完整框架提供了有力启发，尤其适用于含多类膜源的非微扰背景。", "summary_source": "deepseek", "authors": [{"name": "Pinak Banerjee"}, {"name": "Hisham Sati"}, {"name": "Urs Schreiber"}], "featured_authors": [{"name": "Pinak Banerjee"}, {"name": "Hisham Sati"}, {"name": "Urs Schreiber"}], "author_count": 3}, {"id": "2605.25178", "category": "hep-th", "title": "Pseudorandom Dynamics in the SYK Model and Cryptographic Censorship in JT Gravity", "abstract": "We argue that the SYK model provides a conditional realization of Cryptographic Censorship in JT gravity. By using the Weingarten calculus and random matrix universality, we prove that the SYK disorder ensemble is an approximate unitary $k$-design for all $k=\\poly(N)$, with deviation controlled by the spectral form factor. We then formulate the planted-SYK hardness conjecture and provide evidence from spectral universality and the low-degree polynomial framework. Under this conjecture, the approximate design becomes a gravitationally pseudorandom unitary. Together with the efficient causal wedge reconstruction in JT gravity, this leads to the conclusion that typical states in the SYK microcanonical window must have event horizons in their bulk duals, with the horizonless fraction doubly exponentially small. We further identify the regularized geodesic length of the maximal interior slice as the explicit distinguishing operator. Its prediction gap grows linearly with time due to the stretching of the black hole interior, linking Cryptographic Censorship to the complexity equals volume conjecture.", "url": "https://arxiv.org/abs/2605.25178", "type": "理论", "summary": "1. 该工作论证了SYK模型在JT引力中条件实现密码学审查，通过分析系综伪随机性与黑洞事件视界的必然联系。\n2. 利用Wigner重排公式和随机矩阵普适性证明SYK系综为近似酉k-design，并借助planted-SYK硬度猜想将其提升为引力伪随机酉，从而将视界缺失分数压制至双重指数小。\n3. 识别最大内部切片测地线长度作为区分算符，其预测差距线性增长，建立了密码学审查与复杂度等于体积猜想的量化关联。", "summary_source": "deepseek", "authors": [{"name": "Pouya Golmohammadi"}], "featured_authors": [{"name": "Pouya Golmohammadi"}], "author_count": 1}, {"id": "2605.25243", "category": "hep-th", "title": "Quantum-Corrected Q-balls in the Friedberg-Lee-Sirlin Model", "abstract": "We study the real-time quantum dynamics of Q-balls in the Friedberg-Lee-Sirlin model within the inhomogeneous Hartree approximation. The mean fields are evolved self-consistently with the leading quantum two-point functions, which are implemented numerically through a stochastic ensemble representation. After introducing a renormalized formulation and a classical-limit scaling, we simulate single-Q-ball configurations in $3+1$ dimensions and compare their quantum-corrected evolution with the corresponding classical dynamics. We find a clear separation between a classical regime, where quantum fluctuations remain small and the evolution closely follows the classical solution, and a quantum regime, where the fluctuation sector carries a sizable fraction of the Noether charge. We also observe a periodic exchange of Noether charge between the mean fields and the fluctuation modes within the Hartree approximation. We further investigate the stability of quantum-corrected Q-balls and find an intermediate window in which configurations that are classically stable become unstable once Hartree fluctuations are included. Our results provide a first step toward real-time quantum simulations of Q-balls in renormalizable two-field soliton models.", "url": "https://arxiv.org/abs/2605.25243", "type": "理论", "summary": "1. 该工作利用随机系综表示实现重整化的非均匀Hartree近似，在3+1维Friedberg-Lee-Sirlin模型中结合经典极限标度，实时模拟了平均场与量子两点函数自洽演化下的量子修正Q球动力学。\n2. 其核心发现是量子涨落可携带显著比例的Noether荷并与平均场发生周期性交换，同时经典稳定构型在引入Hartree涨落后出现失稳窗口，由此清晰划分出量子区和经典区。\n3. 这为可重整双场孤子模型建立起实时量子模拟框架，并定量揭示了量子涨落对孤子稳定性及荷转移的关键影响，有望拓展至更广泛的多场孤子系统与非平衡量子动力学研究。", "summary_source": "deepseek", "authors": [{"name": "Yong-Xiang Su"}, {"name": "Qi-Xin Xie"}, {"name": "Shuang-Yong Zhou"}], "featured_authors": [{"name": "Yong-Xiang Su"}, {"name": "Qi-Xin Xie"}, {"name": "Shuang-Yong Zhou"}], "author_count": 3}, {"id": "2605.25251", "category": "hep-th", "title": "Some universalities in the partition functions of low-dimension gravity models", "abstract": "In this work, first we discuss the connections between various low-dimensional quantum gravity models, including 3d Chern-Simons, 2d JT and 2d BF theory, 2d Liouville and 2d WZW, and 1d Schwarzian through holography and dimension reduction, and discuss some universalities in their partition functions. Then, we specifically examine the JT partition function and the newly found partition function of $\\mathcal{N}=(2,2)$ on $S^2$ and $\\text{AdS}_2$ and discuss their similarities and therefore examine our proposed universalities further. We change the parameters in each model and based on the change in the structure of the partition function, strengthen our conjectures. We also use eigenfunctions, spectra and the behaviors of Wheeler-DeWitt wavefunctions to generate more universalities between these low-dimensional quantum gravity models, specifically in their partition functions. Then, we use entanglement entropy, complexity and RG flows, particularly in the context of wormholes, to find more universalities in quantum gravity models. Finally, we use the new results about the connections between wormholes and defects to discuss our universalities further.", "url": "https://arxiv.org/abs/2605.25251", "type": "理论", "summary": "1. 该工作系统梳理了低维量子引力模型（如Chern-Simons、JT、Liouville等）配分函数之间的普适性关联，并通过全息对偶与降维将其统一。\n2. 其技术核心在于利用本征函数谱、Wheeler-DeWitt波函数及虫洞-缺陷结构，揭示不同模型配分函数在参数变化下的共同行为。\n3. 这为建立低维量子引力统一描述、深化全息对偶及虫洞纠缠结构理解提供了理论线索。", "summary_source": "deepseek", "authors": [{"name": "Mahdis Ghodrati"}], "featured_authors": [{"name": "Mahdis Ghodrati"}], "author_count": 1}, {"id": "2605.25315", "category": "hep-th", "title": "Negative entropy in scrambling black holes", "abstract": "We present a microscopic statistical-mechanical foundation for interpreting the horizon area of a scrambling black hole as coherent information, equivalently negative conditional quantum entropy, in Hawking's pair-creation picture. We derive the entropy increase induced in a black hole when an infalling object is absorbed and scrambled into its microscopic degrees of freedom. Up to finite-reservoir corrections, this increase takes a canonical form at the Hawking temperature, regardless of the entropy carried by the infalling object. Applying this entropy formula to an incoming mode paired by time reversal with an outgoing Hawking radiation mode, we show that their partition-function contributions cancel in the coherent-information balance associated with the horizon area. The resulting area response is then determined only by the energy flux, in agreement with the black-hole first law.", "url": "https://arxiv.org/abs/2605.25315", "type": "理论", "summary": "1. 该工作为将混沌黑洞视界面积诠释为霍金对产生图像中的相干信息（即负条件量子熵）提供了微观统计力学基础。\n2. 其核心在于导出下落物体被吸收和随机化后引发的黑洞熵增在霍金温度下呈规范形式，且与入射熵无关，而时间反演配对模的配分函数贡献在相干信息平衡中抵消。\n3. 这揭示了黑洞面积响应仅由能流决定，与热力学第一定律一致，为理解黑洞熵的统计起源和信息悖论提供了明确的量子信息论启发。", "summary_source": "deepseek", "authors": [{"name": "Koji Azuma"}], "featured_authors": [{"name": "Koji Azuma"}], "author_count": 1}, {"id": "2605.25355", "category": "hep-th", "title": "A Celestial Description of Planar Super-Yang-Mills Theory", "abstract": "We extend the celestial Roiban-Spradlin-Volovich-Witten (RSVW) formalism developed in our previous work to minitwistor superspace. Using the Drummond-Henn formula for all tree-level amplitudes in N=4 supersymmetric Yang-Mills (SYM) theory, we construct tree-level N^k-MHV celestial leaf amplitudes and show that their minitwistor-Fourier transforms are given by integrals over moduli spaces of families of minitwistor lines. We also adapt the Korchemsky-Sokatchev twistor-transform techniques for gluon amplitudes to the minitwistor-Fourier transforms of leaf amplitudes. We then describe two dynamical formulations of these celestial amplitudes. First, we show that semiclassical correlators of Wilson operators supported on algebraic cycles in minitwistor superspace act as generating functionals for tree-level N^k-MHV leaf-gluon amplitudes. Second, we analyse a semiclassical minitwistor sigma model, identify its vertex operators, and construct from them celestial gluon operators that close on the S-algebra in the semiclassical approximation; their leading-trace semiclassical correlators again reproduce the tree-level N^k-MHV leaf amplitudes. A companion paper extends this construction beyond tree level, in particular to one-loop amplitudes via a celestial version of the Brandhuber-Spence-Travaglini formalism.", "url": "https://arxiv.org/abs/2605.25355", "type": "理论", "summary": "1. 该工作将天球RSVW形式论推广至迷你扭超空间，构造了N=4超杨-米尔斯理论中所有树图N^k-MHV叶振幅。\n2. 其核心在于叶振幅的迷你扭傅里叶变换由迷你扭线族模空间积分实现，且半经典Wilson算子和迷你扭西格玛模型均作为其生成泛函。\n3. 这为天球全息对偶和超杨-米尔斯理论在圈图层次的扩展提供了框架，姊妹论文已将其推广至单圈振幅。", "summary_source": "deepseek", "authors": [{"name": "Igor Mol"}], "featured_authors": [{"name": "Igor Mol"}], "author_count": 1}, {"id": "2605.25473", "category": "hep-th", "title": "The Diagrammar of Quantum Magnusian", "abstract": "The logarithm of the time-evolution operator has been termed Magnusian, on account of the fact that its expansion describes the Magnus series. The diagrammatic expansion and computation of the classical Magnusian has been completely established in terms of tree graphs and their Hopf algebra. Recent works initiated extensions into quantum field theory, revealing general structures of loop expansions while finding intriguing relations between different diagrams. In this work, we advance the loop expansion further by providing an efficient diagrammatic algorithm to calculate the weight factor of each graph in the quantum Magnusian, known as the Murua coefficient. This is achieved by incorporating two complementary perspectives on the Magnusian at the same time: the color basis and the black-and-white basis. We extract the Murua coefficients from the Magnus series by utilizing these two bases while implementing an exponentiated Wick contraction. In turn, we identify the loop-level extension of Murua's recursive formula. Eventually, we establish a set of edge contraction rules which facilitate a direct recursive computation of the Murua coefficients at the purely diagrammatic level, without referencing or directly manipulating the underlying Magnus expansion. This shows that the matrix elements of the quantum Magnusian can be computed from graph manipulations alone.", "url": "https://arxiv.org/abs/2605.25473", "type": "理论", "summary": "1. 该工作提出了一个基于颜色基与黑白基双重表示的计算量子Magnusian中Murua系数的纯图算法。\n2. 其卖点在于通过指数化Wick收缩与边收缩递归规则，无需直接展开Magnus级数即可从图操作导出矩阵元。\n3. 这为量子场论中高阶图展开与递归计算的简化提供了明确的技术路径与理论框架。", "summary_source": "deepseek", "authors": [{"name": "Li Guo"}, {"name": "Joon-Hwi Kim"}, {"name": "Jung-Wook Kim"}, {"name": "Sungsoo Kim"}, {"name": "Sangmin Lee"}, {"name": "Jian-Rong Li"}], "featured_authors": [{"name": "Li Guo"}, {"name": "Joon-Hwi Kim"}, {"name": "Jung-Wook Kim"}, {"name": "Sungsoo Kim"}, {"name": "Sangmin Lee"}, {"name": "Jian-Rong Li"}], "author_count": 6}, {"id": "2605.25481", "category": "hep-th", "title": "Bulk Motion in Global AdS$_3$ from the Boundary Energy-Density Perspective", "abstract": "We study how bulk propagation in global AdS$_3$ is encoded in boundary energy densities of the dual CFT$_2$ on the cylinder. A key feature of the global geometry, which is absent in the Poincaré-patch description, is that a null excitation emitted from the boundary reaches the antipodal boundary point after $\\Delta\\tau=\\pi$ and returns to the original boundary point after $\\Delta\\tau=2\\pi$. We show that this periodic boundary-to-boundary propagation is reflected in the CFT energy density as chiral peaks that meet at the antipodal point and reappear after one global period. For a wave-packet state, the leading energy density consists of two chiral peaks moving along the boundary light-cone directions; their relative weights encode the impact parameter of the corresponding bulk null ray. For a state prepared by a heavy operator with Euclidean regulator, the exact cylinder stress tensor gives two periodic chiral pulses moving along the boundary light-cone directions. These pulses reach the antipodal point and return to the original point at the same global times as the radial null geodesic in the bulk. Thus the boundary energy density captures the boundary-to-boundary propagation and periodicity of localized bulk excitations in global AdS$_3$.", "url": "https://arxiv.org/abs/2605.25481", "type": "理论", "summary": "1. 该工作通过分析对偶CFT₂柱面上的能量密度，完整刻画了全局AdS₃中零激发的边界到边界周期性传播。\n2. 其核心发现在于：能量密度由两个沿边界光锥传播的手性峰组成，这些峰在反极点相遇并周期返回，周期与体径向零测地线的全局时间Δτ=π和2π精确同步，且波包态中峰的相对权重直接编码体零射线的碰撞参数。\n3. 这为利用边界能量密度直接观测全局AdS时空中的体激发时空结构提供了精确定量途径，并对全息原理中体局域性的边界表征给出明确启发。", "summary_source": "deepseek", "authors": [{"name": "Shiki Yoshikawa"}], "featured_authors": [{"name": "Shiki Yoshikawa"}], "author_count": 1}, {"id": "2605.25497", "category": "hep-th", "title": "Degenerate Bifurcations and Universal Relaxation Scaling in Black Hole Thermodynamics", "abstract": "We present a dynamical systems approach to black hole thermodynamic criticality based on bifurcation equations. We construct an effective thermodynamic landscape in which black holes relax toward equilibrium fixed points. To describe this process, we introduce a flow parameter $\\tau$, interpreted as a phenomenological relaxation time, which governs the approach toward equilibrium configurations in thermodynamic state space. Near critical points, the thermodynamic flow simplifies into universal mathematical forms, which allows different black holes to be grouped into different universality classes based on their critical behaviour. Our analysis further shows critical slowing down, with relaxation timescales determined entirely by the local bifurcation structure.", "url": "https://arxiv.org/abs/2605.25497", "type": "理论", "summary": "1. 该工作基于分岔方程建立黑洞热力学临界性的动力系统框架，并引入弛豫时间参数描述状态空间中的趋衡过程。\n2. 其核心在于揭示临界点附近热力学流简化为普适形式，从而按临界行为对黑洞进行普适类划分，并展示完全由局部分岔结构决定的临界减慢标度。\n3. 这为统一理解黑洞热力学相变动力学提供了理论框架，并可能启发对更一般引力系统中非平衡弛豫过程普适标度律的探索。", "summary_source": "deepseek", "authors": [{"name": "Bidyut Hazarika"}, {"name": "Mozib Bin Awal"}, {"name": "Prabwal Phukon"}], "featured_authors": [{"name": "Bidyut Hazarika"}, {"name": "Mozib Bin Awal"}, {"name": "Prabwal Phukon"}], "author_count": 3}, {"id":
