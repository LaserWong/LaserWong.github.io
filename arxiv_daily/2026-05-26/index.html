ying assignment within 1-4 tries, with marked bitstrings amplified clearly above the background distribution, exceeding 20 percent probability. The evaluation of Q-LEAK on real quantum hardware revealed at least one classically verified SAT assignment, despite the presence of noise. These results point to a potential path toward quantum-assisted verification of side-channel protections.", "url": "https://arxiv.org/abs/2605.25728", "type": "理论+数值", "summary": "1. 该工作提出一种基于Grover搜索的量子验证方法Q-LEAK，用于侧信道泄露及其防护措施的形式化验证。\n2. 其核心在于将两迹线泄露谓词与CNF约束编译为Oracle，实现平方根加速搜索，并克服经典SAT在XOR重型密码电路上的扩展性瓶颈。\n3. 这为借助量子计算辅助评估侧信道防护方案的实际有效性开辟了可行性路径。", "summary_source": "deepseek", "authors": [{"name": "Walid El Maouaki"}, {"name": "Alberto Marchisio"}, {"name": "Muhammad Shafique"}], "featured_authors": [{"name": "Walid El Maouaki"}, {"name": "Alberto Marchisio"}, {"name": "Muhammad Shafique"}], "author_count": 3}, {"id": "2605.25760", "category": "quant-ph", "title": "Thermalization in Spatially Extended Open Quantum Systems: Local versus Global Markovian Evolution", "abstract": "We investigate the dynamics of a qubit chain locally coupled to a thermal reservoir, modeled through repeated collisions with particles drawn from a heat bath. Under suitable conditions, the resulting Lindblad equation is thermodynamically consistent -- it drives the system toward thermal equilibrium -- while remaining local at short times. This framework reveals a crossover between the global Lindblad equation derived from the secular approximation in weak-coupling theory and the local dissipative models often employed in the literature, which generally fail to ensure thermodynamic consistency.", "url": "https://arxiv.org/abs/2605.25760", "type": "理论", "summary": "1. 该工作通过重复碰撞模型研究了局域耦合热库的量子比特链热化动力学。\n2. 其核心在于证明适当条件下局域Lindblad方程短时热力学一致，并揭示其与全局secular方程的交叉行为。\n3. 这为区分开放量子系统局域与全局马尔可夫演化的适用性提供了理论判据。", "summary_source": "deepseek", "authors": [{"name": "Jorge Tabanera-Bravo"}, {"name": "Massimiliano Esposito"}, {"name": "Felipe Barra"}, {"name": "Juan M.R. Parrondo"}], "featured_authors": [{"name": "Jorge Tabanera-Bravo"}, {"name": "Massimiliano Esposito"}, {"name": "Felipe Barra"}, {"name": "Juan M.R. Parrondo"}], "author_count": 4}, {"id": "2605.25768", "category": "quant-ph", "title": "Rethinking Expressibility-Trainability Trade-off in Hybrid Quantum Neural Networks", "abstract": "Hybrid quantum neural networks (HQNNs) integrate parameterized quantum circuits (PQCs) within classical networks, where the behavior of the underlying PQCs is often the primary focus of analysis. In this context, expressibility and trainability are widely used to characterize PQC's performance and are commonly assumed to exhibit a trade-off, where highly expressive circuits are more susceptible to barren plateaus. However, the validity of this relationship in HQNNs remains unclear. In this paper, we systematically analyze the expressibility--trainability relationship in HQNNs across varying circuit depths, qubit counts, entanglement topologies. We consider different training configurations, including pure PQCs, quantum-only training in hybrid setting, and full end-to-end training of hybrid models. Our results show that pure PQCs exhibit only a weak and regime-dependent trade-off, while hybrid architectures increasingly disrupt and can eliminate this relationship under full hybrid training. This indicates that classical components reshape the optimization landscape, decoupling trainability from PQC expressibility. We further propose a multi-objective neural architecture search (NAS) framework that jointly optimizes expressibility, trainability, and task performance over a combined classical--quantum design space, revealing different Pareto-optimal solutions under full end-to-end and quantum only training in hybrid setting. different trainability definitions. Our results suggest that hybridization is not just an implementation detail, but a defining factor in the performance of quantum machine learning models.", "url": "https://arxiv.org/abs/2605.25768", "type": "理论+数值", "summary": "1. 该工作系统分析了混合量子神经网络中量子电路深度、量子比特数与纠缠拓扑对可表达性-可训练性关系的影响，并提出了联合优化可表达性、可训练性与任务性能的多目标神经架构搜索框架。\n2. 关键发现是经典组件重塑了优化景观，使得混合端到端训练架构能消除纯参数化量子电路中的弱权衡，实现可训练性与电路可表达性的解耦。\n3. 这表明混合化并非实现细节，而是量子机器学习模型性能的决定性因素，为量子-经典协同设计提供了明确优化方向。", "summary_source": "deepseek", "authors": [{"name": "Muhammad Kashif"}, {"name": "Muhammad Shafique"}], "featured_authors": [{"name": "Muhammad Kashif"}, {"name": "Muhammad Shafique"}], "author_count": 2}, {"id": "2605.25792", "category": "quant-ph", "title": "Boundary $0/π$ logical subspace and bulk dynamical probes in flux-controlled anomalous Floquet quantum walks", "abstract": "We formulate a one-dimensional flux-controlled anomalous Floquet quantum walk and show that it admits a direct microscopic realization in a driven bipartite lattice. The walk consists of a coin-dependent drift step and a momentum-dependent coin mixing step, so the same evolution operator governs quasienergy bands, boundary modes, and bulk dynamics in real space. Because the walk is chiral, the quasienergy gaps at $0$ and $\\pi/T$ carry independent topological information, which organizes trivial, $0$-only, $\\pi$-only, and coexistence sectors in the $(M,\\phi)$ plane. In the coexistence sector, a $0$ mode and a $\\pi$ mode reside on the same edge and span a natural boundary logical subspace. One Floquet period acts there as a relative phase operation and produces a clear $2T$ response in local boundary observables. In the bulk, the same anomalous Floquet structure is probed dynamically in two complementary ways. Frame-resolved mean chiral displacements approach the two winding numbers in the clean pre-reflection window of the symmetric time frames, while selected benchmark cuts at a representative $0$ gap closing and a representative $\\pi$ gap closing exhibit distinct local stroboscopic responses, with the $\\pi$ gap benchmark showing a much stronger odd-even alternation. The boundary logical subspace and the bulk dynamical probes are therefore organized within one flux-controlled anomalous Floquet quantum walk, suggesting a symmetry-protected route to quantum-walk information primitives in driven microstructured lattices.", "url": "https://arxiv.org/abs/2605.25792", "type": "理论+数值", "summary": "1. 该工作构建了通量控制的反常Floquet量子行走，并实验实现在驱动双粒子晶格中，其演化算符统一描述准能带、边界模与体态动力学。\n2. 核心在于手性导致的独立0与π/T拓扑能隙，在共存区同一边缘的0模与π模构成自然逻辑子空间，Floquet周期产生局域边界2T响应，体态动力学通过帧分辨手性位移与频闪基准切割揭示两绕数与奇偶交替特征。\n3. 这为在驱动微结构晶格中基于对称性保护实现量子行走信息原语提供了明确路线，并建立了边界逻辑子空间与体态拓扑探测的统一框架。", "summary_source": "deepseek", "authors": [{"name": "WeiCheng Ning"}, {"name": "YanSheng Liu"}, {"name": "XiaoXue Zhang"}, {"name": "XiZheng Zhang"}], "featured_authors": [{"name": "WeiCheng Ning"}, {"name": "YanSheng Liu"}, {"name": "XiaoXue Zhang"}, {"name": "XiZheng Zhang"}], "author_count": 4}, {"id": "2605.25828", "category": "quant-ph", "title": "Sideband fingerprints of antibunched light in cascaded quantum wave mixing", "abstract": "Quantum wave mixing on a single superconducting qubit produces a hierarchy of coherent side peaks associated with elastic multiphoton scattering pathways. In a cascaded source--probe geometry these pathways become sensitive to the photon statistics of the radiation emitted by the source qubit. We develop an analytical theory of this effect starting from the cascaded master equation in the weak-driving regime. In the coherent-filtering limit $\\gamma_{\\rm s}\\gg\\gamma_{\\rm pr}$, the standard coherent--coherent wave-mixing hierarchy is recovered. In the opposite limit $\\gamma_{\\rm pr}\\gg\\gamma_{\\rm s}$, side peaks associated with multiphoton absorption from the antibunched source field are parametrically suppressed. Numerical solutions confirm the analytical scaling laws. The resulting sideband hierarchy provides a frequency-domain fingerprint of antibunched itinerant microwave light.", "url": "https://arxiv.org/abs/2605.25828", "type": "理论+数值", "summary": "1. 该工作发展了级联量子波混频中反聚束光边带指纹的分析理论，基于弱驱动级联主方程处理超导量子比特的源-探测几何。\n2. 其核心在于揭示边带层级对光子统计的敏感性：在探测弛豫远大于源弛豫时，多光子吸收边带被参量抑制，形成反聚束光的频域特征。\n3. 这为利用边带层级指纹直接测量行波微波场的反聚束统计提供了明确路径，并启发相干与非经典辐射波混频的区分方案。", "summary_source": "deepseek", "authors": [{"name": "R. D. Ivanovskikh"}, {"name": "W. V. Pogosov"}, {"name": "A. A. Elistratov"}, {"name": "A. Yu. Dmitriev"}, {"name": "T. R. Sabirov"}, {"name": "A. V. Vasenin"}, {"name": "S. A. Gunin"}, {"name": "O. V. Astafiev"}], "featured_authors": [{"name": "R. D. Ivanovskikh"}, {"name": "W. V. Pogosov"}, {"name": "A. A. Elistratov"}, {"name": "A. V. Vasenin"}, {"name": "S. A. Gunin"}, {"name": "O. V. Astafiev"}], "author_count": 8}, {"id": "2605.25841", "category": "quant-ph", "title": "A Variational Dissipative Framework for Quantum Algorithms", "abstract": "Dissipation engineering has attracted growing interest as an approach to controlling open quantum systems through engineered system-environment interactions. Standard variational quantum circuits are usually built from unitary operations and therefore explore only a restricted family of states. To go beyond this limitation, we introduce a variational dissipative framework in which ancilla-assisted engineered dissipation is incorporated into parameterized quantum algorithms. In this framework, system-only variational layers are combined with trainable dissipative modules, so that the circuit can prepare a broader class of mixed states through ancilla-assisted nonunitary transformations. Within this framework, the same ancilla-assisted dissipative block is used in two representative settings with different objectives. For ground-state search, it is integrated into a dissipative variational quantum eigensolver to improve the convergence toward low-energy states. For state recovery, it is trained as a recovery channel to suppress preparation noise and enhance fidelity with the target state. In both cases, the block is realized through parameterized system-ancilla couplings followed by ancilla reset and trace-out. Our results show that engineered dissipation can be incorporated into variational quantum circuits as a reusable trainable primitive rather than treated only as a source of noise. In this sense, the proposed framework identifies ancilla-assisted dissipative channels as a concrete variational resource that can support both optimization and recovery tasks within a unified design.", "url": "https://arxiv.org/abs/2605.25841", "type": "数值", "summary": "1. 该工作提出了一个变分耗散框架，将辅助比特辅助的工程耗散集成到参数化量子算法中。\n2. 其核心在于通过可训练耗散模块与系统变分层结合，实现非酉变换以制备更广泛混合态，并作为可重用原语支持优化与恢复任务。\n3. 这为耗散工程从噪声来源转变为量子算法的可调控变分资源提供了统一设计思路。", "summary_source": "deepseek", "authors": [{"name": "Yuan Yao"}, {"name": "Ruipeng Xing"}, {"name": "Yongjian Gu"}, {"name": "Yiming Huang"}, {"name": "Xiao Yuan"}], "featured_authors": [{"name": "Yuan Yao"}, {"name": "Ruipeng Xing"}, {"name": "Yongjian Gu"}, {"name": "Yiming Huang"}, {"name": "Xiao Yuan"}], "author_count": 5}, {"id": "2605.25862", "category": "quant-ph", "title": "Bargmann Zeros as a Diagnostic of the Tunneling Transition in Double-Well Quantum Systems", "abstract": "Complex zeros of wavefunctions represented as entire functions in Bargmann--Fock space encode structural information about the underlying quantum state. Prior work employed zero galleries of randomly generated polynomial superpositions of Fock states as visual fingerprints suitable for classification. Here we examine whether Bargmann zeros of physically realized eigenstates of one-dimensional anharmonic and double-well Hamiltonians carry a recognizable signature of the tunneling transition in the symmetric double well. Ground and first-excited eigenstates are obtained from a variational ansatz consisting of a physically motivated symbolic envelope multiplied by a small flexible correction network, trained by Rayleigh--Ritz minimization of the finite-difference Hamiltonian expectation value and validated to reproduce energies to within $\\sim 10^{-5}\\,\\mathrm{Ha}$. The resulting wavefunctions are projected onto the harmonic-oscillator basis and the complex zeros of the truncated Bargmann polynomial are located by numerical root-finding. For harmonic and quartic-anharmonic potentials the zeros show no preferred orientation. For double-well eigenstates, by contrast, the zeros condense onto the imaginary axis. A sweep of the barrier parameter $a$ from $0.5$ to $2.3$ reveals a continuous migration of zeros toward the imaginary axis, concurrent with the exponential collapse of the tunneling splitting $\\Delta(a) = E_1 - E_0$ over $3.5$ decades. This condensation is traced to a sign-alternation pattern in the Fock-coefficient spectrum that is characteristic of bimodally localized wavefunctions. The complex zero set of the Bargmann-represented wavefunction thereby provides a compact, purely analytic diagnostic for the tunneling regime of one-dimensional double-well Hamiltonians, extending the random-polynomial zero-image framework to physical eigenstates.", "url": "https://arxiv.org/abs/2605.25862", "type": "理论+数值", "summary": "1. 该工作通过计算一维对称双阱势基态和第一激发态的Bargmann多项式复零点，证明零点的虚轴凝聚可作为隧穿转变的诊断。\n2. 其物理创新在于揭示零点凝聚与隧穿分裂指数衰减超过3.5个量级同步发生，且源于双模局域波函数Fock系数符号交替模式。\n3. 这为单维双阱哈密顿量隧穿区域提供了比传统能谱更紧凑、可直接解析的纯分析诊断工具。", "summary_source": "deepseek", "authors": [{"name": "Tughanbulut Kurtulush"}, {"name": "Maciej Janowicz"}], "featured_authors": [{"name": "Tughanbulut Kurtulush"}, {"name": "Maciej Janowicz"}], "author_count": 2}, {"id": "2605.25974", "category": "quant-ph", "title": "PauLIB: A High-Performance Library for Processing Pauli Strings", "abstract": "Processing large Pauli sums is a significant bottleneck in quantum chemistry, Pauli propagation, and Pauli-based compilation. Existing frameworks often suffer from Python interpreter overhead or utilize hash-map data structures that hinder SIMD vectorization and complicate multi-threaded merging. We present PauLIB, a header-only C++20 library designed to eliminate these bottlenecks through three key architectural choices. A bit-packed binary symplectic representation that encodes each qubit in two bits, reducing Pauli multiplication to a bitwise XOR and a population count; a sorted array layout that replaces hash maps to enable branch-predictable SIMD bulk operations; and a struct-of-arrays (SoA) memory layout that exposes contiguous word arrays for explicit SIMD vectorization. Benchmarks at 500 qubits show that single Pauli string multiplication runs at 25ns per operation-14 times faster than PauliEngine and 660 times faster than Qiskit-flat across all pair counts tested. Hamiltonian outer-product multiplication is approximately 10 times faster than PauliEngine and 45 times faster than Qiskit at all tested sizes. Greedy commutation grouping, the dominant preprocessing cost in variational algorithms, achieves up to 21,000 times speedup over PennyLane, driven by the compact bit-packed representation. The compact layout reduces the memory footprint of a one-million-term Hamiltonian at 500 qubits from 1,036MB (Qiskit) to 142MB, a 7.3 times reduction that directly enables larger problem sizes within a fixed memory budget. PauLIB is open source and provides C++ and Python interfaces.", "url": "https://arxiv.org/abs/2605.25974", "type": "理论+数值", "summary": "1. 该工作提出了PauLIB，一个基于C++20的头文件库，专为大规模Pauli字符串处理设计，旨在消除量子化学、Pauli传播与编译中的性能瓶颈。\n2. 其核心技术采用位打包二进制辛表示（每量子比特两比特）、排序数组布局替代哈希映射及结构体数组内存布局，将Pauli乘法简化为按位XOR与人口计数，并利用SIMD向量化与分支可预测性，在500量子比特下实现单次乘法25ns（快PauliEngine 14倍、Qiskit 660倍）。\n3. 该库将百万项哈密顿量内存占用从Qiskit的1036MB降至142MB，贪心对易分组加速达21000倍，为在固定内存下处理更大量子系统及加速变分算法预处理提供了直接路径。", "summary_source": "deepseek", "authors": [{"name": "Florian Krötz"}], "featured_authors": [{"name": "Florian Krötz"}], "author_count": 1}, {"id": "2605.25986", "category": "quant-ph", "title": "Training-Free Quantum Generative Paradigm via Local Parent Hamiltonians", "abstract": "We propose a training-free quantum generative paradigm, which is fundamentally different from current generative models, which demand substantial computational power, face practical scalability limits, and often function as opaque black boxes, despite their remarkable success. We enable image and text generation without parameter training, by constructing a local parent Hamiltonian whose ground state encodes the target distribution and then solving the global Hamiltonian. Rooted directly in quantum mechanical principles, this approach establishes a new pathway for generative modeling that leverages superposition and entanglement to maintain global consistency.", "url": "https://arxiv.org/abs/2605.25986", "type": "理论", "summary": "1. 该工作提出一种无需参数训练的量子生成范式，通过构造局域母哈密顿量，将其基态编码为目标分布，并求解全局哈密顿量实现图像与文本生成。\n2. 其核心卖点在于直接基于量子力学原理，利用态的叠加与纠缠保持全局一致性，避开了传统生成模型的大规模训练与黑箱局限。\n3. 这为生成模型开辟了一条全新量子路径，有望推动无需训练、可解释且可扩展的量子生成学习应用。", "summary_source": "deepseek", "authors": [{"name": "Shu Tian"}, {"name": "Jiaqi Hu"}, {"name": "Rebing Wu"}, {"name": "Yu Shi"}], "featured_authors": [{"name": "Shu Tian"}, {"name": "Jiaqi Hu"}, {"name": "Rebing Wu"}, {"name": "Yu Shi"}], "author_count": 4}, {"id": "2605.26021", "category": "quant-ph", "title": "Toward General Quantum Control with Physics-Informed Large Language Models", "abstract": "Quantum control is essential for quantum information science and technology, yet designing high-fidelity control protocols remains challenging due to complex optimization landscapes, hardware noise, and long pulse sequences. Existing numerical solvers often require problem-specific engineering and produce opaque control amplitudes, while naive large language models (LLMs) lack the physical consistency and long-horizon precision for reliable quantum control synthesis. Here we introduce VF-QCTRL, a physics-informed large language model framework for general quantum control that combines symbolic reasoning with optimization to propose analytic control ansätze and coherently refine their parameters through feedback. To systematically evaluate LLM-driven quantum control, we develop QCTRL-BENCH, a benchmark spanning sixteen tasks across single- and multi-qubit systems, closed and open quantum dynamics, noiseless and noisy settings, and both analytic and numerical protocols. Across the benchmark, VF-QCTRL demonstrates strong universality, accuracy, efficiency, and interpretability: it applies to generic quantum control systems without task-specific training, achieves performance competitive with or exceeding state-of-the-art conventional solvers in both noiseless and noisy regimes with query efficiency, exhibits favorable inference-time scaling and pulse resolution scaling, and derives physically interpretable analytical protocols directly from prompts. Our results establish physics-informed LLM-based quantum control as a promising paradigm for accurate, efficient, interpretable, and training-free quantum control protocol design across a broad range of quantum systems.", "url": "https://arxiv.org/abs/2605.26021", "type": "理论+数值", "summary": "1. 该工作提出了VF-QCTRL框架，将物理知识融入大型语言模型，实现单、多量子比特系统在封闭与开放、有噪与无噪条件下的通用量子控制协议设计。\n2. 其核心卖点是结合符号推理与优化反馈，从提示中直接生成物理可解释的解析控制方案，无需任务特定训练即可在精度、效率和可解释性上匹敌或超越传统数值求解器。\n3. 这为建立基于物理语言模型的量子控制范式提供了明确路径，可推动噪声环境下可解释控制协议的自动化设计及推理时标度律的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Yusheng Zhao"}, {"name": "Han Wang"}, {"name": "Xin Liu"}, {"name": "Xinjie Song"}, {"name": "Jixi He"}, {"name": "Lingwei Song"}, {"name": "Yuanhe Ji"}, {"name": "Ken Deng"}, {"name": "Runqing Zhang"}, {"name": "Zhiguo Huang"}, {"name": "Ling Qian"}, {"name": "Jize Han"}, {"name": "Di Luo"}], "featured_authors": [{"name": "Yusheng Zhao"}, {"name": "Han Wang"}, {"name": "Xin Liu"}, {"name": "Ling Qian"}, {"name": "Jize Han"}, {"name": "Di Luo"}], "author_count": 13}, {"id": "2605.26096", "category": "quant-ph", "title": "Rounding Almost Commuting Hamiltonians", "abstract": "Commuting Hamiltonians lie at the boundary between classical constraint satisfaction and quantum many-body physics, exhibiting rich quantum structure while remaining more tractable than general noncommuting models. In contrast, physical Hamiltonians are rarely exactly commuting, which naturally motivates the study of almost commuting Hamiltonians. Despite their relevance, the implications of approximate commutation are only poorly understood. In this work, we show how to efficiently approximate any almost commuting $2$-local qubit Hamiltonian by a commuting one: we give a locality-preserving algorithmic rounding technique that maps any $2$-local Hamiltonian $H=\\sum_{i=1}^m h_i$ with $\\|[h_i,h_j]\\| \\leq \\epsilon$ to a nearby Hamiltonian $\\hat{H}$ whose terms pair-wise commute, and which is within overall distance $\\|H-\\hat{H}\\| = O(m\\,\\epsilon^{1/6})$. As a consequence, we show that $\\delta$-approximations to the ground energy for $\\epsilon$-almost commuting $2$-local qubit Hamiltonians lie in $\\mathsf{NP}$ when $\\delta \\gg m\\epsilon^{1/6}$, extending the classical containment well beyond the commuting setting. Finally, we present two applications of our rounding framework: Gibbs sampling and fast Hamiltonian simulation for almost commuting systems.", "url": "https://arxiv.org/abs/2605.26096", "type": "理论+数值", "summary": "1. 该工作提出了一种保局域性的算法取整技术，将任意近似对易的2-局域量子比特哈密顿量映射为精确对易的哈密顿量。\n2. 其核心在于证明映射误差为\\(O(m\\epsilon^{1/6})\\)，并由此将基态能量的\\(\\delta\\)-近似问题纳入\\(\\mathsf{NP}\\)类，推广了经典可解性范围。\n3. 这为近似对易系统的吉布斯采样与快速哈密顿模拟提供了严格框架，并启发对更一般近对易模型的复杂性分类。", "summary_source": "deepseek", "authors": [{"name": "Islam Faisal"}, {"name": "Anand Natarajan"}, {"name": "Alexander Poremba"}], "featured_authors": [{"name": "Islam Faisal"}, {"name": "Anand Natarajan"}, {"name": "Alexander Poremba"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
