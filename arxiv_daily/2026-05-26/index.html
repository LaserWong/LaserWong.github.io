"2605.25560", "category": "hep-th", "title": "Finite-$N$ BMN index across all vacuum sectors", "abstract": "We compute the finite-$N$ Witten index of BMN matrix quantum mechanics after summing over all partition-labeled supersymmetric vacuum sectors. Starting from the unitary-matrix integral for each sector, we develop two complementary evaluation methods: a symmetric-group character expansion, which reduces each fixed fugacity order to a finite combinatorial sum, and a residue expansion in which the contributing poles are organized by rooted trees, with a colored-tree generalization for multi-partition sectors. Direct integration and constant-term extraction provide independent checks in explicit examples. We evaluate every vacuum sector for $N\\leq 9$. In the equal-fugacity expansion, the coefficients near charges $j\\sim N^2$ show entropy growth of order $N^2$, and the sector sum does not cancel this growth. The finite-$N$ data also reveal a nontrivial sectoral organization: near $j=N^2$, the sector giving the largest contribution changes with $N$, from single-partition sectors at small rank to double-partition sectors starting at $N=5$. We call this phenomenon dominance switching. These results provide a quantitative finite-$N$ foundation for using the BMN index as a diagnostic of protected plane-wave black-hole microstates and suggest a bulk interpretation in terms of plane-wave black holes dressed by macroscopic M2 giant gravitons, analogous to dual dressed black holes in $AdS_5\\times S^5$.", "url": "https://arxiv.org/abs/2605.25560", "type": "理论", "summary": "1. 该工作通过求和所有分区标记的超对称真空扇区，计算了BMN矩阵量子力学的有限N Witten指数。\n2. 对称群特征展开与留数展开（推广至色树）两种互补方法精确定位了等权展开中近j~N²处N²量级的熵增长，并揭示了从单分区到双分区扇区的占优切换现象。\n3. 这为BMN指数作为平面波黑洞微观态诊断提供了有限N定量基础，并暗示了宏观M2巨引力子装饰的平面波黑洞的体对偶图象。", "summary_source": "deepseek", "authors": [{"name": "Chi-Ming Chang"}, {"name": "Sarthak Duary"}, {"name": "Kangning Liu"}], "featured_authors": [{"name": "Chi-Ming Chang"}, {"name": "Sarthak Duary"}, {"name": "Kangning Liu"}], "author_count": 3}, {"id": "2605.25578", "category": "hep-th", "title": "Fermion renormalized vertex functions, effective mass, and condensate in an external Yang-Mills gauge field", "abstract": "We investigate the renormalized fermion-gluon vertex, the fermion effective mass, and the fermion condensate when the fermion propagates in an external Yang-Mills gauge field. We use an exact Green's function for the Dirac operator in a non-Abelian plane-wave gauge field to construct the renormalized vertex function, calculate the on-shell fermion self-energy, and the background-dependent condensate. We consider both the background and operator fields in the axial gauge $k^{\\mu } \\mathcal{A}_{\\mu }^{a}=0$, thereby preserving the gauge. Its applications to strong-field QCD and non-Abelian Schwinger physics are discussed.", "url": "https://arxiv.org/abs/2605.25578", "type": "理论", "summary": "1. 该工作利用非阿贝尔平面波规范场中狄拉克算符的精确格林函数，构造了重整化费米子-胶子顶点，并计算了在壳费米子自能和背景依赖的凝聚。\n2. 其技术核心在于轴规范下同时处理背景场与算符场，从而在保持规范不变性的前提下提取费米子有效质量与凝聚的背景依赖行为。\n3. 这为强场QCD与非阿贝尔Schwinger机制中的费米子性质研究提供了精确的理论框架和计算工具。", "summary_source": "deepseek", "authors": [{"name": "V. V. Parazian"}], "featured_authors": [{"name": "V. V. Parazian"}], "author_count": 1}, {"id": "2605.25588", "category": "hep-th", "title": "A Casimir obstruction to asymptotically flat black-brane completions of non-supersymmetric 7-branes", "abstract": "We study axisymmetric 7-brane solutions in the dilaton-gravity sector of 10d supergravity, including the backreaction of the Casimir energy induced by monodromies around the transverse circle. Without Casimir energy, we find that the system is analytically solvable and admits locally flat asymptotics with arbitrary deficit angles, but the corresponding solutions contain a naked singularity at finite proper distance. We investigate whether this singularity can be replaced by a regular finite-horizon black-brane core once Casimir backreaction is included. We find that, within our ansatz, Casimir backreaction obstructs an asymptotically locally flat black-brane completion of the naked 7-brane solution.", "url": "https://arxiv.org/abs/2605.25588", "type": "理论", "summary": "1. 该工作研究了考虑Casimir能量反作用后，10维超引力中非超对称7-膜的轴对称解。\n2. 主要发现Casimir反作用阻碍了用渐近局部平坦黑膜替换裸奇点的构造。\n3. 这表明紧致化单值性诱导的Casimir效应可严格限制超引力中奇异性的黑洞完成。", "summary_source": "deepseek", "authors": [{"name": "Yuta Hamada"}, {"name": "Hayate Kimura"}], "featured_authors": [{"name": "Yuta Hamada"}, {"name": "Hayate Kimura"}], "author_count": 2}, {"id": "2605.25647", "category": "hep-th", "title": "Endpoint formulation and Molien--Weyl structure for the \\(N=2\\), large--\\(d\\) BFSS/BMN models", "abstract": "We study the \\(N=2\\), large--\\(d\\) sector of BFSS/BMN-type matrix quantum mechanics on the lattice in the Gaussian regime. We develop a radial endpoint formulation in which the bulk, gauge, and longitudinal degrees of freedom are integrated out, leaving transverse endpoint variables governed by an effective holonomy potential. We show that this planar endpoint formulation is equivalent to the angular Molien--Weyl description of the gauge-projected partition function, up to a universal spectator factor. This relation allows the low-temperature expansion of the endpoint partition function to be obtained from the Molien--Weyl result, whose quadratic coefficient \\(d(d+1)/2\\) counts Gaussian singlet states above the vacuum. We then analyze the continuum limit of the quadratic coefficient and show that it separates into a Gaussian contribution, a \\(D\\)-channel, and a \\(\\beta\\)-channel. The naive Gaussian term becomes trivial, while the exact holonomy kernel generates finite continuum contributions through singular dependence on the endpoint Gaussian width and anisotropic coupling. We then study the geometry of the holonomy potential and show that its relevant saddle is a constrained boundary saddle on the aligned branch, rather than an unconstrained critical point. The associated transverse expansion captures the local saddle geometry, but any finite polynomial truncation has a trivial continuum limit. Finally, we introduce a non-polynomial toy model based on \\(V_{\\rm toy}(B)=-\\log\\cosh B\\), which provides a completion of the transverse expansion and reproduces exactly the continuum \\(D\\)-channel contribution \\(-2d\\). This prepares the geometric interpretation of the \\(D\\)-channel as a Wishart--Stiefel entropy associated with an emergent four-dimensional geometry embedded \\(\\mathbb R^d\\) in the endpoint formulation.", "url": "https://arxiv.org/abs/2605.25647", "type": "理论", "summary": "1. 该工作为N=2、大d BFSS/BMN型矩阵量子力学建立径向端点形式，通过积分掉体、规范和纵向自由度得到受有效holonomy势支配的横向端点变量，并证明其等价于角度Molien-Weyl描述。\n2. 其技术核心在于引入非多项式玩具模型\\(V_{\\rm toy}(B)=-\\log\\cosh B\\)完备化横向展开，精确再现连续极限中规范投影配分函数的二次系数结构，并将D-通道贡献\\(-2d\\)识别为嵌入\\(\\mathbb R^d\\)的四维几何的Wishart-Stiefel熵。\n3. 该形式为在全息背景下精确计算矩阵量子力学低温展开、揭示有效势几何与边界熵的深层联系提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Badis Ydri"}], "featured_authors": [{"name": "Badis Ydri"}], "author_count": 1}, {"id": "2605.25650", "category": "hep-th", "title": "Khovanov complexes for bipartite links", "abstract": "Recently, for a limited class for bipartite links, the complicated Khovanov-Rozansky matrix factorization technique was reduced to an analogue of elementary Kauffman-Khovanov cycle calculus for an arbitrary $N$. In this note, we demonstrate the consistency of such reduction with the computation of the bipartite Khovanov polynomials for $N=2$. Namely, we explain how the Kauffman-Khovanov $2^2$-hypercube is shrinked to the bipartite 3-hypercube.", "url": "https://arxiv.org/abs/2605.25650", "type": "理论", "summary": "1. 该工作针对二分链环，将任意N的Khovanov-Rozansky矩阵因式分解简化为类似Kauffman-Khovanov循环演算。\n2. 其技术核心在于证明N=2时，二分Khovanov多项式可通过将2^2-超立方体收缩至3-超立方体一致计算。\n3. 这为二分链环的Khovanov复形向高N推广提供了可操作的简化框架。", "summary_source": "deepseek", "authors": [{"name": "A. Anokhina"}, {"name": "E. Lanina"}, {"name": "A. Morozov"}], "featured_authors": [{"name": "A. Anokhina"}, {"name": "E. Lanina"}, {"name": "A. Morozov"}], "author_count": 3}, {"id": "2605.25817", "category": "hep-th", "title": "Null Strings Gauged and Reloaded, I: Null Strings Have Carroll-Weyl Gauge Symmetry", "abstract": "Null strings, strings with Carrollian worldsheets, are traditionally described by the Isberg-Lindström-Sundborg-Theodoridis (ILST) action, which is obtained via a tensionless limit of standard tensile strings. In a recent work, we observed that the ILST action enjoys an overlooked partial-gauge symmetry whose existence calls into question the consistency of {standard} null strings analysis found in the literature. In this paper, we show that the Carrollian geometry provides us with two Weyl scaling options, in contrast to a single Weyl scaling available for the ordinary tensile string worldsheet. Defining the null string theory by the action that realizes the two Carroll-Weyl scalings as well as the 2D diffeomorphisms as local (gauge) symmetries, we construct the new null string action. We show that the ILST action is obtained after fixing one of the two Carroll-Weyl scalings of the action that we construct, and that the residual part of this symmetry is precisely the overlooked partial-gauge symmetry. We hence clarify the Carroll-geometric origin of the overlooked symmetry and pave the way for a consistent quantization of null strings.", "url": "https://arxiv.org/abs/2605.25817", "type": "理论", "summary": "1. 该文构造了具有双卡洛尔-外尔标度及二维微分同胚局域对称性的新零弦作用量，并阐明其通过固定一个外尔标度约化为传统ILST作用量。\n2. 其核心技术贡献在于揭示被忽视的局域偏规范对称性实则源于卡洛尔几何中独立的外尔标度残差对称性，明确了其几何起源。\n3. 这为消除经典分析的不一致性及建立零弦的一致量子化方案提供了关键理论基础，并启发了弦论无张力极限的卡洛尔几何视角。", "summary_source": "deepseek", "authors": [{"name": "M.M. Sheikh-Jabbari"}, {"name": "H. Yavartanoo"}], "featured_authors": [{"name": "M.M. Sheikh-Jabbari"}, {"name": "H. Yavartanoo"}], "author_count": 2}, {"id": "2605.25827", "category": "hep-th", "title": "Hard cutoff and gauge theories", "abstract": "According to usual calculations, the use of a hard cutoff $\\Lambda$ in gauge theories leads to a violation of gauge invariance. This seems to generate a tension between gauge theories and the Wilsonian effective field theory (EFT) paradigm, where $\\Lambda$ has the physical meaning of ultimate scale of the theory, the scale above which the latter has to be replaced by its UV completion. In the present work, considering the Euler-Heisenberg correction to the free Maxwell action, we present a way to introduce the Wilsonian hard UV cutoff $\\Lambda$ that preserves gauge invariance at the quantum level. For both scalar and fermionic QED, we recover the well-known Euler-Heisenberg result obtained within proper-time regularization, apart from terms that are generically cutoff-suppressed. These terms, periodic in the inverse background field, might become relevant in regimes where the latter probes scales not much smaller than $\\Lambda$. On the theoretical side, the methods developed in the present work represent a first step towards a new (closer in spirit to the Wegner-Houghton construction) realization of the Wilsonian renormalization group program in gauge theories.", "url": "https://arxiv.org/abs/2605.25827", "type": "理论", "summary": "1. 该工作针对规范理论中硬截断Λ破坏规范不变性的矛盾，提出一种在量子层次保持规范不变性的Wilson型硬紫外截断引入方案，其中截断具有作为理论终极标度的明确物理含义，并成功应用于标量及旋量QED的Euler-Heisenberg有效作用量计算。\n2. 该方案通过保留规范对称性恢复proper-time正规化下的标准结果，仅产生被Λ压制的周期于逆背景场的修正项，这些项在背景场尺度接近截断Λ时可能变得显著，从而揭示截断与背景场耦合带来的新物理效应。\n3. 这为构建更贴近Wegner-Houghton构造的规范理论Wilsonian重整化群程序奠定了关键第一步，并为极端场强下检验截断物理以及探索规范理论紫外完备性提供了理论工具与实验启发。", "summary_source": "deepseek", "authors": [{"name": "V. Branchina"}, {"name": "F. Contino"}, {"name": "R. Gandolfo"}, {"name": "A. Pernace"}], "featured_authors": [{"name": "V. Branchina"}, {"name": "F. Contino"}, {"name": "R. Gandolfo"}, {"name": "A. Pernace"}], "author_count": 4}, {"id": "2605.25999", "category": "hep-th", "title": "Proof of Quantum Conformal Invariance in $\\mathcal N=4$ Super-Yang-Mills Theory via $\\mathcal N=1$ Superfields", "abstract": "Using the $\\mathcal{N}=1$ superfield formalism, we prove that the superconformal symmetry of $\\mathcal{N}=4$ super-Yang-Mills theory is preserved in the quantum theory. We demonstrate that the $\\mathcal{N}=1$ calculation is sufficient to guarantee the full $\\mathcal{N}=4$ supersymmetry, and show that the results are exact without receiving any higher-order corrections.", "url": "https://arxiv.org/abs/2605.25999", "type": "理论", "summary": "1. 该工作通过N=1超场形式严格证明了N=4超杨-米尔斯理论的超共形对称性在量子层次保持。\n2. 其核心卖点在于仅依赖N=1超对称计算即可保障完整的N=4超对称性，且所得量子修正精确为零。\n3. 这为理解该理论的本征超共形结构及其非微扰行为提供了简洁证明框架，并为可类比的简化特例到普适结论的论证策略树立了范例。", "summary_source": "deepseek", "authors": [{"name": "Akihisa D.-E. Tateishi"}], "featured_authors": [{"name": "Akihisa D.-E. Tateishi"}], "author_count": 1}, {"id": "2605.26055", "category": "hep-th", "title": "Krylov Complexity for Plane Wave Matrix Model", "abstract": "We study Krylov complexity in BMN Plane Wave Matrix Model at large mass deformation. We consider various consistent reductions of the matrix model that allow us to perform a Hamiltonian analysis which leads to different notions of the Krylov complexity. In the first part of the paper, we study the Krylov state complexity considering systematic reduction of $N=3$ and $N=4$ representations of the matrix model, which reveals a universal characteristic scaling for the Lanczos coefficients and fix them completely in terms of the mass deformation parameter. In the second part of the paper, we study the Krylov operator growth in the matrix model and compute the corresponding Lanczos coefficients. In both cases, we observe a \\emph{linear} scaling of Lanczos coefficients with the mass parameter. The early time growth in Krylov complexity receives quadratic correction due to the presence of the massive deformation in the matrix model. Our analysis reveals that such massive corrections appear at same order in time for both the notion of the Krylov complexity.", "url": "https://arxiv.org/abs/2605.26055", "type": "理论", "summary": "1. 该工作系统研究了BMN平面波矩阵模型在大质量变形下的Krylov态复杂度与算子增长，分析了N=3和N=4约化表示中的Lanczos系数。\n2. 关键发现在于Lanczos系数随质量参数呈线性标度，且早期时间增长中质量形变引入的同阶二次修正对两类Krylov复杂度均成立。\n3. 这为理解带质量形变的矩阵模型中的混沌动力学与全息对偶提供了普适的复杂度标度框架。", "summary_source": "deepseek", "authors": [{"name": "Dibakar Roychowdhury"}], "featured_authors": [{"name": "Dibakar Roychowdhury"}], "author_count": 1}, {"id": "2605.26077", "category": "hep-th", "title": "On Perturbatively Dressed Observables", "abstract": "A central lesson of gravity is that local observables are ill-defined. Coordinates themselves are a redundancy of description, so any particular point in spacetime is only meaningful once defined relationally by clocks, rulers, or asymptotic data. Despite extensive formal work on this subject, explicit calculations of the resulting gravitationally-dressed observables are more scarce. In this paper we perturbatively compute dressed matrix elements of local operators in electrodynamics and general relativity, including both potential and radiative photons and gravitons. Our expressions indicate that dressing is not ornamental: it universally induces kinematic singularities that can substantively reshape observables. We further show how dressing is mathematically equivalent to gauge fixing, as demonstrated by a dynamical temporal gauge in which the gauge-fixing vector is itself a geodesic fluid.", "url": "https://arxiv.org/abs/2605.26077", "type": "理论", "summary": "1. 该论文微扰计算了电动力学与广义相对论中局域算符的 dressed 矩阵元，涵盖势场及辐射光子与引力子。\n2. 其关键发现是 dressing 普遍引入运动学奇点，并揭示了其与规范固定（通过时空变分规范实现）的数学等价性。\n3. 这为理解引力系统中局域观测量的定义及 dressing 对可观测量的实质影响提供了明确计算框架。", "summary_source": "deepseek", "authors": [{"name": "Clifford Cheung"}, {"name": "Allic Sivaramakrishnan"}, {"name": "Jordan Wilson-Gerow"}, {"name": "Lihang Zhou"}], "featured_authors": [{"name": "Clifford Cheung"}, {"name": "Allic Sivaramakrishnan"}, {"name": "Jordan Wilson-Gerow"}, {"name": "Lihang Zhou"}], "author_count": 4}, {"id": "2605.26080", "category": "hep-th", "title": "Intersecting Surface Operators in 6d Holomorphic Field Theories", "abstract": "We study intersecting surface operators in 6d holomorphic field theories with the aim of unraveling associated quantum integrable structures. We first study the intersections of surface operators in 6d holomorphic Chern-Simons theory on $\\mathbb{C}^3$. Computing their correlation function, we find a local operator at the intersection of the surface operators with a form reminiscent of the leading nontrivial term in the quasi-classical expansion of a rational $R$-matrix, as predicted by Costello. We provide evidence that this $R$-matrix-like operator satisfies a Yang-Baxter-type relation. We then derive the associated coproduct of the chiral algebra supported by surface operators from their OPE. We also study intersecting surface operators in 6d holomorphic BF theory and derive the local leading form of the corresponding $R$-matrix-like operator. When this theory is placed on twistor space, where it describes the self-dual sector of 4d Yang-Mills theory, this operator is expected to provide a local building block for quantum integrable structures anticipated in that setting.", "url": "https://arxiv.org/abs/2605.26080", "type": "理论", "summary": "1. 该工作系统研究了六维全纯Chern-Simons理论与BF理论中相交曲面算符在C^3上的关联函数与算子积展开，旨在揭示其蕴含的量子可积结构。\n2. 其核心卖点是从相交点关联函数中导出了形如有理R矩阵准经典展开主导项的局部算符，并验证其满足Yang-Baxter型关系，进而通过OPE推导了曲面算符所支撑手征代数的余积。\n3. 这一结果为扭量空间上四维自对偶Yang-Mills理论中量子可积结构的构造提供了局部构建块，并指明了从高维全纯场论理解可积系统微观机制的可行路径。", "summary_source": "deepseek", "authors": [{"name": "Meer Ashwinkumar"}], "featured_authors": [{"name": "Meer Ashwinkumar"}], "author_count": 1}, {"id": "2605.24431", "category": "math-ph", "title": "AKLT State is Indeed the Observation Process of a causal Hidden quantum Markov Model", "abstract": "We present a rigorous formulation of the spin-1 Affleck--Kennedy--Lieb--Tasaki (AKLT) state within the framework of hidden quantum Markov models (HQMMs). We show that the AKLT ground state admits a natural representation as the observable output of a causal HQMM, thereby endowing it with an underlying hidden quantum memory that is fully consistent with its standard finitely correlated (matrix product state) description. This viewpoint yields a compact and structurally transparent characterization of the AKLT chain as a quantum spin system equipped with intrinsic quantum memory. Our results further indicate that the HQMM framework provides a promising setting for analyzing measurement-based quantum computation (MBQC) and related information-processing tasks.", "url": "https://arxiv.org/abs/2605.24431", "type": "理论", "summary": "1. 该工作将自旋-1 AKLT基态严格重构为因果隐藏量子马尔可夫模型的可观测输出过程。\n2. 其核心在于揭示AKLT态隐藏量子记忆与矩阵乘积态描述的等价性，提供紧凑透明的量子记忆表征。\n3. 这为基于测量的量子计算提供了统一框架，并有望推广至一般有限关联系统的信息处理分析。", "summary_source": "deepseek", "authors": [{"name": "Abdessatar Souissi"}], "featured_authors": [{"name": "Abdessatar Souissi"}], "author_count": 1}, {"id": "2605.24563", "category": "math-ph", "title": "ODE/IM Correspondence at the Free-Fermion Point. Laguerre Wronskians, Shifted Symmetric Functions, and Quantum KdV", "abstract": "We consider the ODE/IM correspondence for the value $c=-2$ of the Virasoro central charge (free-fermion point) and the associated quantum KdV model $-$ the quantization of the second hamiltonian structure of the classical periodic KdV model. We prove that the ODE/IM correspondence is complete (in the sense of V. Bazhanov, S. Lukyanov, and A. Zamolodchikov), namely that any solution of the Bethe equations coincides with the spectrum of a rational extension of the (quantum) harmonic oscillator. To this end, on the ODE side we consider Crum$-$Darboux transformations of the harmonic oscillator and the associated Laguerre Wronskians, which are remarkable special functions parametrized by pairs of partitions which we study in depth. As a further result, on the IM side, we diagonalize explicitly the first three hamiltonian operators of quantum KdV (in the free field representation): the eigenstates are Schur functions and the eigenvalues are shifted symmetric functions on partitions. We give two applications of this result: i) we prove that the eigenvalues are given by the evaluation of the Newton symmetric polynomials at the poles of the associated monster potentials, as further conjectured by V. Bazhanov, S. Lukyanov, and A. Zamolodchikov; ii) we show that these hamiltonian operators also belong to the algebra of hamiltonian operators obtained by quantizing the first hamiltonian structure of the classical periodic dispersionless KdV model.", "url": "https://arxiv.org/abs/2605.24563", "type": "理论", "summary": "1. 该工作建立了自由费米子点处ODE/IM对应的完备性，并关联到量子KdV模型的前三个哈密顿量对角化。\n2. 技术核心在于利用Crum-Darboux变换和Laguerre Wronskians将Bethe解映射为谐振子有理扩展谱，并得到Schur函数本征态与移位对称函数本征值。\n3. 这揭示了量子KdV哈密顿量同时属于无色散经典KdV第一哈密顿结构的量子化代数，为相关可积系统提供了精确对应。", "summary_source": "deepseek", "authors": [{"name": "Davide Masoero"}, {"name": "Giulio Ruzza"}], "featured_authors": [{"name": "Davide Masoero"}, {"name": "Giulio Ruzza"}], "author_count": 2}, {"id": "2605.25277", "category": "math-ph", "title": "Cyclic F-manifolds, distinguished connections and integrability", "abstract": "We show that Hertling-Manin F-manifolds provide the appropriate theoretical framework for studying the integrability of quasilinear systems of first-order evolutionary partial differential equations of the form ${\\bf u}_t=X\\circ {\\bf u}_x$ under the mild assumption that $X$ is a cyclic vector field with respect to the F-product $\\circ$. This approach is very general and allows us to treat even non-regular systems that were previously beyond the scope of existing techniques. Like in the regular case the information about integrability is contained in a torsionless connection associated with the system and the integrability condition reduces to a geometric condition involving the Riemann tensor of the connection and the structure functions of the product.", "url": "https://arxiv.org/abs/2605.25277", "type": "理论", "summary": "1. 该工作证明了Hertling-Manin F-流形为形如u_t=X∘u_x的拟线性系统可积性提供了合适理论框架，仅需X是循环向量场。\n2. 其核心在于可积性信息包含于系统关联的无挠联络，而可积条件归结为该联络的黎曼张量与乘积结构函数的几何约束。\n3. 这一方法推广至非正则系统，为拟线性可积系统的几何分类和新型可积模型构造开辟了道路。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Arsie"}, {"name": "Paolo Lorenzoni"}], "featured_authors": [{"name": "Alessandro Arsie"}, {"name": "Paolo Lorenzoni"}], "author_count": 2}, {"id": "2605.25494", "category": "math-ph", "title": "Compactified imaginary Toda theory", "abstract": "Based on the work of Guillarmou, Kupiainen, and Rhodes, we construct compactified imaginary Toda theory on closed Riemann surfaces, extending the rank-one construction to the higher-rank setting. This theory is expected to describe critical higher-rank models with extended symmetries, such as web models. We construct the correlation functions and prove that they satisfy the axioms of conformal field theory, including Segal's gluing axioms. On the Riemann sphere, we express the correlation functions as Dotsenko--Fateev type integrals. In the case $\\mathfrak g=\\mathfrak{sl}_n$, under a semidegenerate condition, we obtain a closed formula for the three-point structure constant.", "url": "https://arxiv.org/abs/2605.25494", "type": "理论", "summary": "1. 该工作基于Guillarmou等人秩一结果，将紧致化虚Toda理论推广至任意高秩李代数情形，并在闭黎曼曲面上完成严格构造。\n2. 核心技术突破在于证明关联函数满足共形场论全部公理（含Segal粘合公理），并在球面上给出Dotsenko-Fateev型多重积分表示，使理论适用于描述具有扩展对称性的临界高秩模型（如sl_n相关web模型）。\n3. 对sl_n情形在半退化条件下导出三点结构常数封闭公式，为共形场论与可积模型交叉研究提供了严格可计算框架，并可能推广至其他李代数。", "summary_source": "deepseek", "authors": [{"name": "Yi-An Yao"}], "featured_authors": [{"name": "Yi-An Yao"}], "author_count": 1}, {"id": "2605.25755", "category": "math-ph", "title": "Derivation of the focusing $Φ^6_1$ measure in the optimal mass regime from many-body quantum Gibbs states", "abstract": "We derive the focusing $\\Phi^6_1$ measure on the torus $\\mathbb{T}$ as the high-temperature/mean-field limit of many-body quantum Gibbs states with an attractive three-body interaction. The main difficulty in the focusing setting is to relate the classical mass cutoff to the quantum particle-number cutoff. Our result reaches the optimal mass threshold for the classical field identified by Oh, Sosoe, and Tolomeo (2022), and thereby extends the earlier work of Rout and Sohinger (2025). At the critical threshold, the short-range interaction is allowed to shrink to a Dirac delta function on a logarithmic scale in the temperature parameter. Strictly below the threshold, the same convergence holds with a polynomial dependence on the temperature. Moreover, we establish a quantum-level phase transition at the same mass threshold. The proof develops the variational framework of Lewin, Nam, and Rougerie (2015) in the focusing setting and relies on two new ingredients: a non-factorized trial state construction and a delicate tail estimate for the interacting lower symbol. These allow us to control the localization and relative entropy errors caused by the particle-number cutoff, as well as the contribution of the focusing exponential weight.", "url": "https://arxiv.org/abs/2605.25755", "type": "理论", "summary": "1. 该工作由多体量子吉布斯态在高温/平均场极限下导出环面上聚焦Φ^6_1测度，并达到由Oh等识别的经典场最优质量阈值。\n2. 关键技术在于引入非因子化试验态与相互作用下符号精细尾估计，以控制粒子数截断所致的局域化与相对熵误差及聚焦指数权重贡献。\n3. 这为从量子多体系统极限构造经典场测度及揭示量子级相变提供了严格的变分框架，并扩展了相关模型在临界门槛处的理论理解。", "summary_source": "deepseek", "authors": [{"name": "Lin Lü"}, {"name": "Phan Thành Nam"}, {"name": "Rongchan Zhu"}], "featured_authors": [{"name": "Lin Lü"}, {"name": "Phan Thành Nam"}, {"name": "Rongchan Zhu"}], "author_count": 3}, {"id": "2605.25899", "category": "math-ph", "title": "Chern numbers in quantum graphs", "abstract": "Quantum graphs provide an analytically tractable setting for the study of Chern numbers and band degeneracies in periodic systems. We study the Chern numbers of energy bands in a two-dimensional square lattice quantum graph. We approach the problem by mapping the lattice to a single-vertex quantum graph with two loops of equal lengths pierced by magnetic fluxes. By establishing the degeneracy condition for its energy levels, we show that the model possesses two topological phases: a trivial phase, where the Chern numbers of all energy bands are $0$, and the nontrivial one, where the Chern numbers of successive energy bands alternate between $\\pm1$. By applying the degeneracy condition, we calculate Chern-number phase diagrams analytically as a function of the node scattering matrix parameters and compare the results with numerical calculations.", "url": "https://arxiv.org/abs/2605.25899", "type": "理论", "summary": "1. 该工作通过将二维正方晶格量子图映射为含磁通双环单顶点量子图，解析研究了能带陈数及其拓扑相变。\n2. 其核心在于建立能级简并条件，据此解析导出陈数相图，揭示节点散射矩阵参数调控平凡（陈数均为0）与非平凡（相邻能带陈数交替为±1）拓扑相。\n3. 这为周期系统中陈数与能带简并的解析处理提供了可精确求解的量子图框架，启发了拓扑相图在类似可积模型中的推广。", "summary_source": "deepseek", "authors": [{"name": "Or Swartzberg"}, {"name": "Omri Gat"}, {"name": "Boris Gutkin"}], "featured_authors": [{"name": "Or Swartzberg"}, {"name": "Omri Gat"}, {"name": "Boris Gutkin"}], "author_count": 3}, {"id": "2605.26024", "category": "math-ph", "title": "Field theory of $\\mathfrak{su}(n)$: the absence of non-zero scatterings", "abstract": "We inspect $\\mathfrak{su}(n)$ forms, providing greater detail for $n=2,3$, as a toy model for a field theory in finite dimensions and with gauge symmetries. Relying on homological perturbation theory, we show that there are no scattering amplitudes with trivalent tree-level diagrams, except for the interaction vertex, thus extending a known argument of Cattaneo--Mnëv to arbitrary $n$. In contrast to this, we show how to obtain non-trivial higher products when transferring to a larger space of fields.", "url": "https://arxiv.org/abs/2605.26024", "type": "理论", "summary": "1. 该工作考察了 $\\mathfrak{su}(n)$ 形式（特别对 $n=2,3$ 给出细节）作为有限维规范对称场论的玩具模型。\n2. 其核心卖点是基于同调微扰理论证明除相互作用顶点外不存在三顶点树图级散射振幅，从而将 Cattaneo–Mnëv 论证推广至任意 $n$，并展示转移至更大场空间可获得非平凡高乘积。\n3. 这为有限维规范场论中散射振幅的消失性及代数结构的拓广提供了严格论证与构造启发。", "summary_source": "deepseek", "authors": [{"name": "Eugenia Boffo"}, {"name": "Ján Pulmann"}, {"name": "Ľuboš Ravas"}], "featured_authors": [{"name": "Eugenia Boffo"}, {"name": "Ján Pulmann"}, {"name": "Ľuboš Ravas"}], "author_count": 3}, {"id": "2605.24108", "category": "quant-ph", "title": "Bell State Analysis Provides an Optimal Basis Saturating the Quantum Cramer-Rao in Rotation Sensing", "abstract": "The second-order anti-coherent state of light is known to saturate the Cramer-Rao Bound (QCRB) for rotation sensing around an arbitrary axis. However, due to the complexity of the state and the inefficiency of state tomography, parameter extraction remains an open problem. In this manuscript, we approach the problem of parameter extraction using pair-wise Bell state analysis with an additional path degree of freedom. Due to the transformation property of rotation, only the symmetric Bell states will show up in projection in the final state. We exploit this advantage to develop a scheme for extracting the rotation angle for N=4 and N=6 second-order anti-coherent states.", "url": "https://arxiv.org/abs/2605.24108", "type": "理论", "summary": "1. 本文利用成对Bell态分析与额外路径自由度，实现了二阶反相干态旋转角参数的有效提取。\n2. 其核心在于利用旋转变换下仅对称Bell态出现在投影中的特性，避免了完整态层析的复杂性。\n3. 该方案为饱和量子Cramér-Rao界的旋转感知提供了一条可行路径，并可拓展至更高阶反相干态。", "summary_source": "deepseek", "authors": [{"name": "Zhuoran Bao"}, {"name": "Daniel F. V. James"}], "featured_authors": [{"name": "Zhuoran Bao"}, {"name": "Daniel F. V. James"}], "author_count": 2}, {"id": "2605.24120", "category": "quant-ph", "title": "Quantum Sensing and Quantum Error Correction: Two Sides of the Same Coin", "abstract": "Quantum metrology has been making amazing progress in the past decades. It is always in researchers' interest to search for new optimal states that improve parameter estimation. In this paper, we point out a connection between the code's error correcting capacity and its ability to act as a sensor. We backed our claim by providing an example that relates the Absorption emission code to the sensor state for arbitrary state rotation. It is hoped that, in building such a unified theory, one can draw inspiration from error correction to develop promising quantum sensors.", "url": "https://arxiv.org/abs/2605.24120", "type": "理论", "summary": "1. 本文揭示了量子纠错码的纠错能力与其参数估计传感能力之间的内在对偶性，并以吸收发射码为例证明了该联系。\n2. 其技术核心在于将纠错码的码空间结构映射为对任意态旋转最优估计的传感态，从而统一了两种看似不同的资源利用视角。\n3. 该工作启发可从纠错编码理论中系统性地推导新型量子传感器的设计方案，为高精度量子计量学提供结构化指导。", "summary_source": "deepseek", "authors": [{"name": "Zhuoran Bao"}, {"name": "Daniel F. V. James"}], "featured_authors": [{"name": "Zhuoran Bao"}, {"name": "Daniel F. V. James"}], "author_count": 2}, {"id": "2605.24122", "category": "quant-ph", "title": "Phase-resolved multichannel quantum escape between limit cycles", "abstract": "Driven-dissipative quantum systems can recover stable dynamical attractors in the semiclassical limit, including coexisting limit cycles. At finite fluctuation strength, this classical coexistence becomes quantum metastability: the corresponding oscillatory states undergo rare fluctuation-induced transitions. We demonstrate phase-resolved quantum escape between two such states in a driven optomechanical resonator. Unlike escape from fixed points, switching between extended attractors occurs across a periodic basin boundary and depends on the phase at which fluctuations approach it. Using quantum-jump trajectories across a controlled quantum-to-classical crossover, we reconstruct the escape geometry directly from switching events. Escape from the small-amplitude cycle proceeds through a single radial corridor and exhibits near-Arrhenius scaling, whereas escape from the large-amplitude cycle involves competing phase-localized corridors with distinct effective activation scales. The resulting curvature in the switching-rate scaling, together with event-conditioned phase distributions, identifies finite-fluctuation multichannel quantum escape between extended attractors.", "url": "https://arxiv.org/abs/2605.24122", "type": "理论+数值", "summary": "1. 该工作在驱动光力学谐振器中演示了两个共存极限环之间的相分辨量子逃逸过程。\n2. 其关键是通过量子跳变轨迹重构逃逸几何，发现大振幅周期环存在多个相位局域竞争通道及不同有效激活标度。\n3. 这为理解有限涨落下扩展吸引子之间量子逃逸的多通道物理图像提供了直接依据。", "summary_source": "deepseek", "authors": [{"name": "Caroline Nowoczyn"}, {"name": "Ludwig Mathey"}, {"name": "Kilian Seibold"}], "featured_authors": [{"name": "Caroline Nowoczyn"}, {"name": "Ludwig Mathey"}, {"name": "Kilian Seibold"}], "author_count": 3}, {"id": "2605.24166", "category": "quant-ph", "title": "Optimal Quantum Differential Privacy via Fisher Information Spectral Analysis", "abstract": "The Quantum Fisher Information (QFI) metric governs a fundamental duality: it quantifies both how precisely a parameter can be estimated (metrology) and how distinguishable two quantum states are (privacy). We exploit this duality to establish a geometry-aware framework for quantum differential privacy (DP) that replaces isotropic depolarizing noise with direction-dependent noise aligned to the QFI eigenstructure of the quantum embedding. We prove six principal theorems: (1) the minimax-optimal mechanism concentrates the noise budget in the dominant QFI eigenmode, achieving $\\varepsilon = (\\Delta^2/2)\\lambda_{\\max}(1-c\\gamma)$ with $O(d/\\lambda_{\\max})$ advantage; (2) mixed-state QFI decomposition reveals that dephasing in the adversary's basis $\\textit{increases}$ accessible information, while misaligned-basis dephasing provides constructive privacy amplification from hardware noise; (3) a tight privacy $-$ utility uncertainty relation $\\varepsilon \\cdot (1 - F) \\ge \\frac{\\Delta^2}{2}\\frac{\\operatorname{Tr}(F)}{d}$; (4) adaptive QFI estimation converging at $O(1/\\sqrt{n})$ yields $1.92\\times$ tighter bounds; (5) QFI-aligned composition saturates at $O(1)$ versus $O(k)$ for standard composition; and (6) hardware noise can be harnessed for privacy amplification. Adversarial vulnerabilities, Wasserstein guarantees, subspace projection, and a zero-knowledge audit protocol follow as corollaries. Results are validated on Qiskit Aer GPU simulations, IBM Quantum hardware (ibm_fez, 156 qubits), and against classical DP baselines, achieving equivalent utility at $\\varepsilon \\approx 0.001$ versus $\\varepsilon \\approx 4800$ for classical DP.", "url": "https://arxiv.org/abs/2605.24166", "type": "理论+数值", "summary": "1. 该工作基于量子Fisher信息度量在参数估计与状态区分间的对偶性，建立了几何感知的量子差分隐私框架。\n2. 其核心是用QFI本征结构导引方向依赖性噪声替代各向同性去极化，并严格证明了最优机制、隐私-效用不确定关系等六条定理。\n3. 这为量子隐私保护提供了理论最优噪声注入策略，并揭示了硬件噪声可用于隐私放大，在超导量子处理器上实现ε约0.001的等效效用。", "summary_source": "deepseek", "authors": [{"name": "Justice Owusu Agyemang"}, {"name": "Jerry John Kponyo"}, {"name": "Elliot Amponsah"}, {"name": "Godfred Manu Addo Boakye"}], "featured_authors": [{"name": "Justice Owusu Agyemang"}, {"name": "Jerry John Kponyo"}, {"name": "Elliot Amponsah"}, {"name": "Godfred Manu Addo Boakye"}], "author_count": 4}, {"id": "2605.24177", "category": "quant-ph", "title": "Towards Scalable Quaternary Message-Passing Decoding for Quantum Error Correction", "abstract": "The scalability and interpretability of message-passing (MP) decoding, such as (quaternary) Belief Propagation, remain open challenges in quantum error correction. Even for surface codes, arguably the first testbed for decoding methods, studies of improved MP decoders have mostly been restricted to small distances ($d \\lesssim 19$). Moreover, the mismatch with established message-passing theory limits the decoder's interpretability, making it unclear whether MP decoding can sustain its effectiveness at large system sizes. This work takes a step toward a more principled and interpretable MP decoding framework, with the goal of making MP-based decoding more reliable and bridging theory and practice. We introduce a dilution method, which allows a quaternary Min-Sum (MS) decoder to exhibit an apparent depolarizing threshold of $16\\%$ up to distance $20$, outperforming Minimum-Weight Perfect Matching in finite-length regimes. Notably, for $X$-noise, the standard MS decoder under dilution has worst-case complexity $O(N \\log^2 d)$ and outperforms BP-OSD at $d=65$. The observed $\\sim 9\\%$ threshold may correspond to a true asymptotic threshold. Finally, we give a graph-dilution argument that interprets the success of the dilution method and offers insight into when MP algorithms can genuinely scale. Taken together, these results provide encouraging progress toward scalable and interpretable MP decoding in quantum error correction.", "url": "https://arxiv.org/abs/2605.24177", "type": "理论+数值", "summary": "1. 该工作引入一种稀释方法，使四进制Min-Sum解码器在有限距离内实现16%的退极化阈值，优于最小权重完美匹配。\n2. 其技术核心在于稀释技术将最坏情况复杂度降至O(N log^2 d)，并在X噪声下观察到约9%的潜在渐近阈值。\n3. 这为消息传递解码在量子纠错中实现可扩展性和可解释性提供了图论解释与理论支撑。", "summary_source": "deepseek", "authors": [{"name": "Boqing Zhang"}, {"name": "Henry D. Pfister"}, {"name": "Hanwen Yao"}, {"name": "Siyuan Niu"}], "featured_authors": [{"name": "Boqing Zhang"}, {"name": "Henry D. Pfister"}, {"name": "Hanwen Yao"}, {"name": "Siyuan Niu"}], "author_count": 4}, {"id": "2605.24230", "category": "quant-ph", "title": "Detectability Limits for Intra-Block Temporal Drift in Finite-Key Entanglement-Based QKD", "abstract": "We study the statistical detectability of intra-block temporal drift in finite-key entanglement-based quantum key distribution, with particular relevance to E91-type parameter estimation and monitoring. Drift is modeled as a mean-preserving Lipschitz perturbation of Bernoulli observables, capturing structured temporal variation that is invisible to global-average tests. For a block of size $n$ and confidence levels $(\\alpha,\\beta)$, we formulate a minimax hypothesis-testing problem and define the minimal detectable amplitude. We derive matching lower and upper bounds yielding $\\delta_{\\min}(n,\\alpha,\\beta)=\\Theta(n^{-1/2})$: if $n\\delta^2 \\to 0$, no level-$\\alpha$ procedure can guarantee nontrivial uniform power over the admissible drift class, whereas a calibrated CUSUM statistic detects drift at the matching scale. Explicit constants for linear, sinusoidal, and step profiles, together with simulations, confirm the predicted scaling collapse. The result quantifies a finite-block monitoring-resolution limit and is distinct from composable security certification.", "url": "https://arxiv.org/abs/2605.24230", "type": "理论+数值", "summary": "1. 该工作研究有限密钥纠缠量子密钥分发中块内时间漂移的统计可检测性，将漂移建模为伯努利观测的均值保持Lipschitz扰动，并基于minimax假设检验框架推导最小可检测振幅与块长的标度关系。\n2. 核心卖点在于证明漂移可检测性存在Θ(n^{-1/2})的固有极限，标定CUSUM统计量可达到该下界，而全局平均检验完全失效；对线性、正弦及阶跃轮廓给出显式常数，模拟确认标度塌缩。\n3. 该结果定量刻画了有限码长下块监控的分辨率极限，与可组合安全性认证相互独立，为实际E91型QKD系统的参数估计与实时漂移检测提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Rafael Duarte Marcelino"}, {"name": "Julio Smanioto Garcia"}, {"name": "Matheus Rufino"}], "featured_authors": [{"name": "Rafael Duarte Marcelino"}, {"name": "Julio Smanioto Garcia"}, {"name": "Matheus Rufino"}], "author_count": 3}, {"id": "2605.24324", "category": "quant-ph", "title": "A Matched Spectral Benchmark of Quantum Inspired Feature Maps", "abstract": "Quantum machine learning is often motivated by the idea that quantum systems can expose useful high-dimensional structure that is difficult to access with classical models. We isolate one central component of this claim: the fixed data-encoding map. Amplitude, angle, and basis encoding are evaluated as deterministic feature maps for classical supervised learning under matched output dimensionality and strong classical controls. The benchmark compares these encodings against raw linear models, random Fourier features, polynomial features, PCA, RBF SVMs, and shallow neural networks across diverse classical datasets. Rather than treating performance as a single endpoint, we analyze the geometry of each representation through effective rank, condition number, centered kernel alignment, predictive performance, and practical overhead. The resulting picture is mechanistic: amplitude encoding can remove magnitude information through unit-sphere normalization, angle encoding can become geometrically redundant with raw linear features, and basis encoding can impose a binary Hamming geometry that is poorly aligned with smooth decision structure. These findings do not argue against quantum computation, however, they show that fixed quantum-inspired encoding geometry alone is not a reliable source of machine-learning advantage on classical data.", "url": "https://arxiv.org/abs/2605.24324", "type": "理论+数值", "summary": "1. 该工作对振幅、角度和基编码等量子启发式特征映射进行了匹配谱基准测试，评估其在经典监督学习中的表现。\n2. 通过有效秩、条件数和中心核对齐等几何分析，揭示出固定编码映射本身无法可靠提供机器学习优势的机理。\n3. 这提醒量子机器学习优势的根源需超越固定编码几何，转而关注量子计算的其他独特能力。", "summary_source": "deepseek", "authors": [{"name": "Toheeb Ogunade"}, {"name": "Taofeek Kassim"}, {"name": "Etinosa Osaro"}], "featured_authors": [{"name": "Toheeb Ogunade"}, {"name": "Taofeek Kassim"}, {"name": "Etinosa Osaro"}], "author_count": 3}, {"id": "2605.24335", "category": "quant-ph", "title": "Local Impurity Induced Growth and Scrambling in Clean Free Fermions", "abstract": "We study impurity-induced particle growth and scrambling in clean one-dimensional free-fermion systems. We show that a single local impurity can act as a branching source: particle or operator weight propagates coherently into the free bulk, returns to the impurity, and is locally converted into additional degrees of freedom. We develop this branching picture in three complementary settings: a monitored free-fermion model with feedback, a fully unitary interacting particle model, and Heisenberg operator dynamics with an interacting impurity. In the monitored model, we find a feedback-driven transition for both boundary and bulk impurities. In the unitary particle and operator models, a boundary impurity gives rise to an analogous transition from saturation to sustained growth and scrambling. These results reveal how a single impurity can generate complex many-body dynamics in an otherwise clean and free quantum system.", "url": "https://arxiv.org/abs/2605.24335", "type": "理论", "summary": "1. 该工作研究一维清洁自由费米子系统中单一局域杂质诱导的粒子增长与纠缠乱码现象，并建立分支传播图像。\n2. 其技术核心是揭示杂质充当分支源，使粒子或算符权重相干传播至自由体并返回后被局域转化为额外自由度，且在监测反馈、幺正相互作用粒子与海森堡算符三种框架中均观察到由此引发的相变。\n3. 这表明单一杂质可在本应平凡的量子系统中驱动复杂多体动力学，为理解可控杂质诱导的量子复杂性与纠缠增长提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Qucheng Gao"}, {"name": "Vikram Ravindranath"}, {"name": "Xiao Chen"}], "featured_authors": [{"name": "Qucheng Gao"}, {"name": "Vikram Ravindranath"}, {"name": "Xiao Chen"}], "author_count": 3}, {"id": "2605.24360", "category": "quant-ph", "title": "Multiple fidelities and joint numerical range", "abstract": "We investigate the effectiveness of entanglement detection based on multiple fidelities via the geometry of the joint separable numerical range. When all reference states are product states, we derive a necessary and sufficient criterion for such detection: either some pair of reference states has nontrivial moduli of the local inner products on both subsystems, or the orthogonal complement of the span of the reference states is completely entangled. We further show that there exist sets of reference product states for which no proper subset is effective for entanglement detection, whereas the full set is. A typical example of this phenomenon is provided by unextendible product bases. Moreover, for a pair of reference product states on a bipartite system with arbitrary local dimensions, we characterize both the joint numerical range and the joint separable numerical range, showing that the joint separable numerical range is determined solely by their local fidelities, as illustrated by a representative two-qubit example. Our results offer a systematic approach to designing effective entanglement witnesses and lay the groundwork for extensions to higher-dimensional and multipartite scenarios.", "url": "https://arxiv.org/abs/2605.24360", "type": "理论+数值", "summary": "1. 该工作通过联合可分数值范围的几何，系统研究了基于多个保真度进行纠缠检测的有效性条件。\n2. 其核心在于导出乘积参考态下检测的充要条件，并揭示存在仅全集有效而任何真子集无效的参考态集合，典型例子为不可扩展乘积基。\n3. 这为设计高效纠缠见证提供了系统框架，并为向高维与多体系统的推广奠定了几何基础。", "summary_source": "deepseek", "authors": [{"name": "Pei Li"}, {"name": "Bang-Hai Wang"}], "featured_authors": [{"name": "Pei Li"}, {"name": "Bang-Hai Wang"}], "author_count": 2}, {"id": "2605.24373", "category": "quant-ph", "title": "Semiclassical Propagation and the Dynamics of Configuration Space", "abstract": "This work explores the non-relativistic quantum propagator $K(x,t)$ as a solution of the Schrödinger equation. We suppose that the propagator takes the form ${\\rm exp}\\left(\\frac{\\mathrm{i}}{\\hbar}S+R\\right)$, generalizing the usual WKB ansatz by allowing an additive exponent $R$ whose role as a measure of quantumness is investigated. Since $S$ is subject to the assumption that it is a solution of the Hamilton-Jacobi equation, here we are further interested in the role of $R$ and its interpretation as a measure of quantumness. Several systems are studied as concrete examples to illustrate this approach. Furthermore, a proposal to generalize it for fields is put forward. This is tested for some simple systems. Finally, the possibilities to use this approach for the case of systems whose dynamics are controlled by the Hamiltonian constraint are analyzed.", "url": "https://arxiv.org/abs/2605.24373", "type": "理论", "summary": "1. 该工作研究非相对论量子传播子K(x,t)作为薛定谔方程的解，提出推广WKB形式的ansatz：exp(iS/ℏ+R)，其中附加因子R的量子性度量作用在多个系统中得到检验。\n2. 其核心机制在于S严格满足哈密顿-雅可比方程，而R则捕捉了量子涨落对传播子振幅的修正，从而将经典与量子效应在传播子中分离并量化。\n3. 本文进一步展示了该方案可推广至场论，并应用于哈密顿约束系统，为研究量子引力的半经典动力学以及约束系统的量子化提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "V.S. Morales-Salgado"}], "featured_authors": [{"name": "V.S. Morales-Salgado"}], "author_count": 1}, {"id": "2605.24478", "category": "quant-ph", "title": "Quantum Dynamics of Interacting dissipative oscillators: A novel scheme", "abstract": "We investigate the dynamics of interacting quantum harmonic oscillators coupled to thermal reservoirs under the influence of an external driving field. In a novel theoretical scheme, we first analyze the case of two interacting oscillators, each coupled to its own thermal reservoir, with an external source applied to the first oscillator. By diagonalizing the total Hamiltonian through successive Bogoliubov transformations, we obtain explicit expressions for the oscillator energies. A key finding is that off resonance, the energy of the second oscillator grows unboundedly, whereas on resonance, it remains bounded and periodic. We then derive the Husimi functions for both oscillators and the reduced Husimi functions for initially separable coherent and number states. The shift of the Husimi function's maximum away from the origin at zero temperature confirms continuous energy gain under specific parameter conditions. An explicit formula for the reduced density matrix components in the number state basis is also provided. Finally, we generalize the model to $n$ interacting oscillators in a thermal medium driven by a classical field. For the three-oscillator case, we show that on resonance, the energies of the first and third oscillators grow, while the energy of the second oscillator remains periodically bounded. These results offer insights into energy transfer and localization in coupled oscillator systems in thermal environments.", "url": "https://arxiv.org/abs/2605.24478", "type": "理论", "summary": "1. 该工作提出一个理论方案，研究相互作用的耗散量子谐振子在外部驱动下的动力学，并推广至n个振子情形。\n2. 采用连续Bogoliubov变换对角化总哈密顿量，揭示了非共振时第二振子能量无界增长而共振时保持有界周期的行为，并给出Husimi函数与约化密度矩阵的显式表达式。\n3. 这为理解热环境中耦合振子系统的能量传递与局域化提供了新视角，并可推广至多体量子耗散系统的控制研究。", "summary_source": "deepseek", "authors": [{"name": "Ronak Moradi"}, {"name": "Fardin Kheirandish"}], "featured_authors": [{"name": "Ronak Moradi"}, {"name": "Fardin Kheirandish"}], "author_count": 2}, {"id": "2605.24494", "category": "quant-ph", "title": "Electrodynamics as a Theory of Persistent Stochastic Processes", "abstract": "A process-theoretic approach to electrodynamics based on persistent Kac-type stochastic processes is developed. Finite-velocity stochastic propagation is taken as primary, while relativistic wave equations arise as emergent descriptions after analytic continuation of Telegrapher-type dynamics. The Dirac and Maxwell equations are interpreted as arising from closely related persistent propagation structures differing only in spin representation. The framework is not intended to modify the successful empirical predictions of quantum electrodynamics, but to provide a different underlying ontology. Particles and fields are not treated as primitive entities with fixed intrinsic properties. Instead, relativistic particle and field structures emerge as stable collective modes of coupled persistent stochastic dynamics. Mass and charge acquire interpretations respectively as persistence and stochastic coupling scales. Stationary bound states are interpreted as metastable persistent stochastic modes with nontrivial internal sector dynamics. Spontaneous emission is viewed as stochastic destabilization of such modes, while stimulated emission arises through resonant synchronization of persistent transition currents by incident radiation. Gauge interactions are introduced at the level of propagation-sector amplitudes prior to the emergence of observable probabilities. Radiative effects, including the anomalous magnetic moment of the electron, are interpreted as effective stochastic dressing of coupled matter--radiation processes. Some comments on gauge symmetry, equilibration and the Standard Model are also included.", "url": "https://arxiv.org/abs/2605.24494", "type": "理论", "summary": "1. 该工作基于Kac型持续随机过程，发展电动力学的过程论框架，以有限速度随机传播为原始，相对论波动方程通过Telegrapher型解析延拓涌现。\n2. 其核心卖点在于粒子和场非原始实体，而是耦合持续随机动力学的稳定集体模式，质量与电荷分别对应持续性及随机耦合标度，规范相互作用在传播扇区振幅层次引入。\n3. 该框架保留QED经验预言但提供不同本体论，将自发辐射与受激辐射分别诠释为随机失稳与共振同步，为规范对称性与标准模型的过程论起源提供新启发。", "summary_source": "deepseek", "authors": [{"name": "Partha Ghose"}], "featured_authors": [{"name": "Partha Ghose"}], "author_count": 1}, {"id": "2605.24519", "category": "quant-ph", "title": "On Constructing and Decoding Quantum Triorthogonal Codes", "abstract": "A triorthogonal code is a binary quantum Calderbank-Shor-Steane (CSS) code defined by a triorthogonal matrix. Triorthogonal codes are a key ingredient in magic-state distillation, since they allow for transversal $\\mathsf{T}$ gates, a non-Clifford logical operation useful for achieving universal fault-tolerant quantum computation. Their construction is challenging because it must satisfy simultaneous pairwise and triple-wise overlap constraints, as well as row-weight requirements. In this work, we study the construction and decoding of triorthogonal codes with prescribed dual-distance properties. We derive an existence criterion for even-weight triorthogonal generator matrices with a target dual minimum distance. The criterion combines triorthogonality constraints with MacWilliams identities via Krawtchouk-polynomial conditions on the dual weight distribution, yielding an integer linear programming formulation for the construction problem. We find new nontrivial triorthogonal codes that are not necessarily generated by classical triply-even codes. The decoding performance of high-distance triorthogonal codes obtained via the doubling construction is then evaluated over the dephasing channel. We compare bounded-distance decoding, belief propagation plus ordered-statistics post-processing, and a GRAND-based decoder adapted to the quantum setting, which turns out to be a promising option.", "url": "https://arxiv.org/abs/2605.24519", "type": "理论+数值", "summary": "1. 本文针对量子三元正交码的构造与译码开展研究，系统推导了具有目标对偶最小距离的偶重三元正交生成矩阵的存在性准则，该准则通过Krawtchouk多项式条件将三元正交性中的成对与三重重叠约束及行重要求同MacWilliams恒等式联系起来，并基于整数线性规划构造出非经典三偶生成的新非平凡三元正交码。\n2. 其核心技术贡献在于将码构造问题转化为整数线性规划，通过求解整数线性规划问题获得满足对偶距离条件的偶重三元正交生成矩阵，从而突破了传统依赖经典三偶生成码的局限，实现了对三元正交码的灵活构造。\n3. 在退相位信道下，对通过加倍构造获得的高距离三元正交码进行了译码性能评估，比较了有界距离译码、置信传播加有序统计后处理以及适应量子设置的GRAND译码器，结果显示GRAND译码器在译码性能上具有明显优势，这为高容错量子计算中魔法态蒸馏所需的资源优化提供了新的码构造方法和译码策略。", "summary_source": "deepseek", "authors": [{"name": "Alessio Baldelli"}, {"name": "Olai Å. Mostad"}, {"name": "Hsuan-Yin Lin"}, {"name": "Eirik Rosnes"}, {"name": "Massimo Battaglioni"}], "featured_authors": [{"name": "Alessio Baldelli"}, {"name": "Olai Å. Mostad"}, {"name": "Hsuan-Yin Lin"}, {"name": "Eirik Rosnes"}, {"name": "Massimo Battaglioni"}], "author_count": 5}, {"id": "2605.24555", "category": "quant-ph", "title": "Algebraic Tomography of Non-Hermitian Floquet Systems from Observable Traces", "abstract": "We formulate a framework of Floquet algebraic tomography for finite-dimensional non-Hermitian monodromy matrices from observable trace sequences $\\zeta_n^{(O)}={\\rm Tr}(OM^n)$. Since these sequences are constrained by the characteristic polynomial of $M$, the inverse problem is a finite-dimensional algebraic reconstruction problem rather than a generic exponential fit. We organize the reconstruction through the observable resolvent, spectral determinant, and Dirichlet spectral data, separating the common spectral skeleton from observable-dependent dressing. Cayley--Hamilton and Hankel methods recover the similarity-invariant spectral data, while multi-observable and Liouville-space extensions connect the construction to realization theory and tomography reconstruction. We further clarify the limits of identifiability from restricted observable algebras: the data determine a visible representative, micromotion can enlarge the sampled visible operator space, and exact symmetries impose residual invisible sectors. Two examples, a driven transmon qutrit and a finite non-Hermitian Floquet SSH chain, demonstrate leakage-induced visibility expansion, observable-dependent phase response, EP-accessible branch geometry, and disorder/probe-dependent observable-dimension readouts.", "url": "https://arxiv.org/abs/2605.24555", "type": "理论", "summary": "1. 该工作建立了从可观测量迹序列重建有限维非厄米Floquet系统单值矩阵的代数层析成像理论框架。\n2. 其核心在于利用特征多项式约束将逆问题化为有限维代数重建，通过可观测量解析和谱数据分离谱骨架与可观测依赖修饰，并借助Cayley-Hamilton与Hankel方法恢复相似不变谱数据。\n3. 该框架阐明了受限可观测量代数下的可辨识性极限，包括可见代表、微运动扩展可视空间及对称性不可见扇区，为实验层析成像提供了可操作的理论指导。", "summary_source": "deepseek", "authors": [{"name": "Syo Kamata"}], "featured_authors": [{"name": "Syo Kamata"}], "author_count": 1}, {"id": "2605.24645", "category": "quant-ph", "title": "Geometric phases of reduced states in the transverse-field Ising chain", "abstract": "Geometric phases have been extensively investigated in a wide range of quantum systems, often revealing deep connections to the underlying topology of many-body states. In this work, we examine two geometric phases defined for mixed quantum states$-$the interferometric geometric phase and the Uhlmann phase$-$extracted from two-site reduced density matrices of the transverse-field Ising model with nearest-neighbor interacting spins. By applying coordinated local unitary rotations to the spins, we compute the geometric phases associated with the two-site states across the critical point. We find that the interferometric phase is a more reliable indicator of the quantum phase transition in this model than the Uhlmann phase.", "url": "https://arxiv.org/abs/2605.24645", "type": "理论", "summary": "1. 该工作研究了横场Ising链中从两体约化密度矩阵提取的干涉几何相位与Uhlmann相位。\n2. 通过协调局域幺正旋转计算临界点附近的几何相位，发现干涉相位对量子相变的指示更为可靠。\n3. 这为利用混合态几何相位探测量子多体系统的相变提供了更优的判据。", "summary_source": "deepseek", "authors": [{"name": "Chiragkumar R. Vasani"}, {"name": "Erik Sjöqvist"}], "featured_authors": [{"name": "Chiragkumar R. Vasani"}, {"name": "Erik Sjöqvist"}], "author_count": 2}, {"id": "2605.24798", "category": "quant-ph", "title": "Improved Dual Attack and Trapdoor Sampling via Quantum Rejection Sampling", "abstract": "In this work, we revisit the dual attack and GPV trapdoor sampling, focusing on the lattice Gaussian sampling term, which can be a significant bottleneck in the overall complexity. We show that this sampling step can be quantumly accelerated by combining the lower bound underlying Wang and Ling's analysis of Klein's algorithm with the quantum rejection sampling (QRS) framework proposed by Ozols et al. Specifically, this lower bound gives precisely the pointwise domination condition required for quantum rejection sampling when given coherent oracle access to a truncated Klein proposal distribution, which yields a quantum procedure for preparing the truncated dual $q$-ary lattice Gaussian with a quadratic reduction in the sampling complexity. The truncation radius is chosen so that the truncated distribution is negligibly close to the full lattice Gaussian in total variation distance. Substituting this sampler into the dual attack framework results in reduced overall attack-cost estimates. Compared with Pouly and Shen's modern dual attack under the same parameter choices, our estimates reduce the attack cost by \\(9\\), \\(4\\), and \\(13\\) bits for Kyber-512, Kyber-768, and Kyber-1024, respectively. We also report the corresponding estimates with modulus switching. Finally, by replacing the Markov chain Monte Carlo (MCMC) sampler with the QRS algorithm, we achieve a similar quadratic speedup in the GPV signing process.", "url": "https://arxiv.org/abs/2605.24798", "type": "理论+数值", "summary": "1. 该工作重新审视格基对偶攻击与GPV陷门采样，利用量子拒绝采样加速了作为整体复杂度瓶颈的格高斯采样步骤。\n2. 其技术核心在于将Wang-Ling关于Klein算法的下界与量子拒绝采样框架结合，实现了截断对偶q-ary格高斯态制备的二次复杂度降低，并分别将Kyber-512/768/1024的攻击成本降低9、4、13比特。\n3. 这为后量子密码算法安全性评估提供了量子加速攻击实用化路径，同时通过替换马尔可夫链蒙特卡洛采样器，为GPV签名过程带来了类似的二次加速潜力。", "summary_source": "deepseek", "authors": [{"name": "Cong Ling"}, {"name": "Hao Yan"}, {"name": "Nicholas Zhao"}], "featured_authors": [{"name": "Cong Ling"}, {"name": "Hao Yan"}, {"name": "Nicholas Zhao"}], "author_count": 3}, {"id": "2605.24923", "category": "quant-ph", "title": "Singularizing preserving countable additivity quantum channels on quantum measurable cardinals", "abstract": "We investigate the structural and dynamical properties of a class of quantum channels on von Neumann algebras induced by averaging over operator groups via the Pettis integral. Utilizing the classical Yosida--Hewitt decomposition, we focus on the interplay between the set-theoretic properties of the underlying space and the topological nature of the resulting quantum states. We establish a suffucient condition under which a channel preserves $\\sigma$-additivity and exhibits a singularizing property, completely suppressing the normal component of any incoming state. In conjunction with the theory of Ulam real-valued measurable cardinals, this framework reveals a novel phenomenon: the existence of quantum channels that transform normal states into singular yet strictly $\\sigma$-additive states. Furthermore, we analyze the structural constraints on the preservation of state purity imposed by the cardinality of the continuum, and extend our constructions to invariant measures on groups and their unitary representations, establishing the convergence of their Cesàro averages in the strong operator topology.", "url": "https://arxiv.org/abs/2605.24923", "type": "理论", "summary": "1. 该工作研究了由Pettis积分对算子群取平均诱导的von Neumann代数上量子信道的结构与动力学，利用Yosida-Hewitt分解分析了底层空间集合论性质与量子态拓扑性质间的关联。\n2. 其技术核心是建立了信道保持σ-可加性并完全抑制正则分量的奇异化充分条件，结合Ulam实值可测基数理论，揭示了将正则态变换为奇异且严格σ-可加态的信道存在性。\n3. 这为理解集合论性质对量子信道态纯度保持的结构约束提供了新框架，并为群上不变测度与酉表示中Cesàro平均的强算子拓扑收敛性分析奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Sviatoslav V. Dzhenzher"}], "featured_authors": [{"name": "Sviatoslav V. Dzhenzher"}], "author_count": 1}, {"id": "2605.25008", "category": "quant-ph", "title": "Nonreciprocal Landau-Zener Tunneling in the Presence of Heat-Bath-Induced Colored Noise", "abstract": "In this work, we investigate the effects of heat-bath-induced colored noise on nonreciprocal Landau-Zener tunneling. We perform numerical calculations of the instantaneous energy levels and find that noise induces stochastic fluctuations in these levels. Beyond such fluctuations, sufficiently large nonreciprocity parameters enable noise to further trigger the emergence of multiple exceptional points. The corresponding tunneling probability is significantly modified by colored noise. On the one hand, colored noise generally enhances the tunneling probability under nonadiabatic sweeping. On the other hand, it can break the reciprocity of Landau-Zener tunneling in the adiabatic limit. In particular, for large nonreciprocity parameters, the adiabatic tunneling probability is insensitive to noise and determined by exceptional points. We plot the phase diagram of tunneling probability as a function of the sweep rate and nonreciprocity parameter, for different amplitudes and correlation times of colored noise. Analytically, we derive the exact expression for the tunneling probability in the absence of noise and an approximate solution in the white-noise limit, employing Weber functions and the Wiener-Hermite expansion method. Some implications of our theory are discussed.", "url": "https://arxiv.org/abs/2605.25008", "type": "理论+数值", "summary": "1. 该工作通过数值计算瞬时能级，研究了热浴诱导色噪声对非互易Landau-Zener隧穿的影响，发现噪声导致能级随机涨落并在大非互易参数时触发多个例外点。\n2. 其核心在于揭示色噪声在非绝热扫掠下增强隧穿概率，而在绝热极限下可打破互易性，且大非互易参数时绝热隧穿概率对噪声不敏感而由例外点决定。\n3. 该文绘制了不同噪声振幅和关联时间下隧穿概率随扫速与非互易参数的相图，并利用韦伯函数和Wiener-Hermite展开得到无噪声及白噪声极限的解析解，为噪声驱动非厄米系统动力学及非互易量子控制提供理论指导。", "summary_source": "deepseek", "authors": [{"name": "Yi Cao"}, {"name": "Jie Liu"}], "featured_authors": [{"name": "Yi Cao"}, {"name": "Jie Liu"}], "author_count": 2}, {"id": "2605.25089", "category": "quant-ph", "title": "Dissipative preparation of injective tensor network states", "abstract": "The preparation of tensor network states is a fundamental prerequisite for a wide range of quantum simulation tasks. While many unitary protocols for preparing these states have been investigated, dissipative state preparation provides a powerful alternative since it can be robust to noise and initialization errors. In this paper, we construct both continuous-time and discrete-time geometrically local dissipative processes whose unique steady state is a given injective tensor network state. Our method prepares all injective matrix product states on $N$ sites to an error $\\varepsilon$ in $O(\\log (N/\\varepsilon))$ time, yielding an exponential improvement over previously known dissipative preparation schemes. For two and higher-dimensional tensor network states, we prove that when the tensors of the state are \\emph{highly injective}, the constructed dissipative processes are rapid-mixing i.e., they prepare a state $\\varepsilon$-close to the $N$-site target state in $O( \\log (N/\\varepsilon))$ time. For these states, our approach provides a polynomial speedup over known unitary methods for states defined on lattices and an exponential speedup for states on general bounded-degree graphs. We corroborate our theoretical results with numerical studies that indicate that the dissipative protocol can rapidly prepares states outside the high-injectivity assumption.", "url": "https://arxiv.org/abs/2605.25089", "type": "理论+数值", "summary": "1. 本工作构建了连续与离散时间的几何局域耗散过程，其唯一稳态为目标可注入张量网络态。\n2. 该方法制备可注入矩阵积态至误差ε所需时间为O(log(N/ε))，较已知耗散方案实现指数加速；对高注入性高维张量网络态亦保证快速混合，并提供对酉方法的多项式至指数级加速。\n3. 数值结果提示该协议在超出高注入性假设时仍能快速制备，为量子模拟与容错计算中可注入张量网络态的高效制备提供新路径。", "summary_source": "deepseek", "authors": [{"name": "Drishti Baruah"}, {"name": "Georgios Styliaris"}, {"name": "J. Ignacio Cirac"}, {"name": "Rahul Trivedi"}], "featured_authors": [{"name": "Drishti Baruah"}, {"name": "Georgios Styliaris"}, {"name": "J. Ignacio Cirac"}, {"name": "Rahul Trivedi"}], "author_count": 4}, {"id": "2605.25102", "category": "quant-ph", "title": "Extracting Universal Entanglement Scaling from Mixed Fermionic Gaussian States via Entanglement Projected Entropy", "abstract": "Identifying spatial quantum correlations in mixed states is challenging because thermal mixed-state contributions obscure the entanglement encoded in subsystem entropy. Here, we introduce the entanglement projected entropy, a diagnostic for extracting boundary-sensitive quantum correlations from mixed fermionic Gaussian states. By resolving subsystem entropy into Gaussian entanglement channels and projecting their purification partners onto the physical complement, we obtain a closed-form expression in terms of the physical covariance matrix. In a one-dimensional free-fermion chain, it removes the volume-law mixed-state background and recovers the zero-temperature conformal scaling with the $c/3$ coefficient. In a two-dimensional half-filled $\\pi$-flux model, it reveals a universal finite-temperature scaling collapse governed by an effective Dirac infrared length. These results establish entanglement projected entropy as a Gaussian spatial filter for boundary-sensitive quantum correlations hidden in mixed-state entropy.", "url": "https://arxiv.org/abs/2605.25102", "type": "理论", "summary": "1. 该工作引入纠缠投影熵，从混合费米子高斯态中提取边界敏感的量子关联普适标度。\n2. 其卖点在于通过将子系统熵分解为高斯纠缠通道并投影至物理补空间，获得仅依赖协方差矩阵的闭式表达式。\n3. 该诊断在一维链中恢复零温共形标度c/3，在二维π-通量模型中揭示有限温普适标度坍塌，可作为提取混合态隐藏量子关联的高斯空间滤波器。", "summary_source": "deepseek", "authors": [{"name": "Jia-Wen Tao"}, {"name": "Hui-Ke Jin"}], "featured_authors": [{"name": "Jia-Wen Tao"}, {"name": "Hui-Ke Jin"}], "author_count": 2}, {"id": "2605.25118", "category": "quant-ph", "title": "A framework for the benchmarking of transport-induced excitations in shuttling-based ion-trap quantum processors", "abstract": "We develop a theoretical and numerical framework to analyze the effect of transport on the motional states of ions in a trapped-ion quantum processor. We decompose the shuttling protocol into primitive operations and characterize these in terms of their heating performance. Instead of having to simulate the whole transport protocol for each complete ion trajectory, the method allows us to determine the heating properties of each primitive operation separately and obtain the global result through an algebraic expression. We demonstrate our method by applying it to an 8-qubit quantum processor design based on linear transport and swap operations for all-to-all connectivity. We show how to incorporate the price of motional operations at the level of the compiler as a cost function.", "url": "https://arxiv.org/abs/2605.25118", "type": "数值", "summary": "1. 该工作提出了一个理论数值框架，用于分析基于穿梭的离子阱量子处理器中输运对离子运动态的加热效应。\n2. 其技术要点在于将输运协议分解为原始操作并分别表征其加热性能，再通过代数表达式组合得到全局结果。\n3. 这为在编译器层面将运动操作代价纳入成本函数，优化量子处理器编译策略提供了直接方法。", "summary_source": "deepseek", "authors": [{"name": "Rodrigo Munoz"}, {"name": "Phil Nuschke"}, {"name": "Teresa Meiners"}, {"name": "Brigitte Kaune"}, {"name": "Christian Ospelkaus"}], "featured_authors": [{"name": "Rodrigo Munoz"}, {"name": "Phil Nuschke"}, {"name": "Teresa Meiners"}, {"name": "Brigitte Kaune"}, {"name": "Christian Ospelkaus"}], "author_count": 5}, {"id": "2605.25302", "category": "quant-ph", "title": "Causal Order Cannot Be An Observable", "abstract": "Recent developments in the formalisation of quantum causal structures have made it possible to test and compare hypotheses about causal structure empirically, rather than being a-priori assumptions. Such differences in causal structure may be leveraged to distinguish between the processes they belong to, akin to distinguishing between quantum states known to belong to different eigenspaces of an observable. So how far this analogy can be pushed? Can causal order be interpreted as a kind of observable? Can it be measured? To this end we construct a completely operational definition of observables in terms of `discrimination tasks'. This begins with some base set of classes (analogous to a quantum observable's eigenspaces) before we impose three conditions on how these classes relate under discrimination tasks. These conditions recover the properties of a standard observable, letting us apply this definition to non-state entities such as quantum processes, which naturally encode causal structure. These conditions can be described in plain language as (1) `members of any class are perfectly distinguishable from members of any other' (i.e. our classes are `sharp'), (2) `entities perfectly distinguishable pairwise are all perfectly distinguishable by a joint intervention', and (3) `if all members of a class are perfectly distinguishable from an entity, then the whole class is perfectly distinguishable from it jointly'. By analysing classes of quantum processes having strict causal orders, we find causal classes which are sharp but violate condition 2, and classes which violate condition 3. This implies that causal order cannot be an observable. We note cases in the literature which claim to prove the opposite, and discuss them. We find their analyses presume special circumstances equivalent to conditions (2) and (3), and so do not contradict our own findings.", "url": "https://arxiv.org/abs/2605.25302", "type": "理论", "summary": "1. 该工作通过构建基于区分任务的可观测量操作性定义，证明因果顺序不满足所定义的观测量的三个条件，从而否定了将因果顺序视为可观测量的可能性。\n2. 技术核心在于对量子过程进行类划分，并施加精确的区分条件（sharp性、两两完全可区分性的联合干预可区分性、类的联合可区分性），发现严格因果顺序类违反后两个条件。\n3. 这为量子因果结构理论提供了操作性的概念基础，并澄清了文献中声称测量因果顺序的结论仅适用于特殊性条件，不具普遍性。", "summary_source": "deepseek", "authors": [{"name": "Declan Maguire"}, {"name": "Fabio Costa"}], "featured_authors": [{"name": "Declan Maguire"}, {"name": "Fabio Costa"}], "author_count": 2}, {"id": "2605.25324", "category": "quant-ph", "title": "Unsupervised learning for the systematic identification of nondispersive wave packets in driven helium", "abstract": "Nondispersive wave packets in driven helium are long-lived quantum states that follow classical resonant orbits without spreading. Their identification typically requires detailed analysis of phase-space structures and extensive exploration of parameter regimes. In this work, we introduce an unsupervised learning approach to automate the identification of physically relevant states in the driven helium atom. Using a Floquet-based description, quantum states are computed and represented as probability distributions in configuration and phase space, which serve as input to a convolutional neural network that constructs a low-dimensional embedding of the data. Clustering in the embedding space reveals distinct classes of quantum states. By combining geometric analysis, physical parameter inspection, and time-evolution studies, we identify clusters corresponding to frozen planet states and nondispersive wave packets. The method successfully recovers known NDWP regimes without prior labeling, demonstrating that the learned representation captures physically meaningful structures in a systematic and automated manner. These results establish unsupervised representation learning as an effective tool for the systematic analysis of complex quantum datasets.", "url": "https://arxiv.org/abs/2605.25324", "type": "数值", "summary": "1. 本文引入无监督学习方法，基于Floquet描述和卷积神经网络嵌入聚类，自动识别驱动氦原子中的非色散波包和冻结行星态。\n2. 该方法的物理卖点在于无需先验标注即可从量子态概率分布的低维聚类中系统恢复已知的非色散波包区域。\n3. 这为复杂量子数据集的自动物理特征提取提供了一种可推广的无监督表征学习范式。", "summary_source": "deepseek", "authors": [{"name": "Juan M. Scarpetta"}, {"name": "Gustavo A. Parra"}, {"name": "Alejandro González-Melan"}, {"name": "Javier Madroñero"}], "featured_authors": [{"name": "Juan M. Scarpetta"}, {"name": "Gustavo A. Parra"}, {"name": "Alejandro González-Melan"}, {"name": "Javier Madroñero"}], "author_count": 4}, {"id": "2605.25552", "category": "quant-ph", "title": "Beyond Logical Circuits: Hardware-Aware Analysis of Expressibility and Trainability in Variational Quantum Algorithms", "abstract": "Variational quantum algorithms (VQAs) rely on parameterized quantum circuits (PQCs), whose performance is governed by expressibility and trainability. Existing studies typically evaluate these properties at the logical circuit level, implicitly assuming that designed PQCs remain unchanged during hardware execution. In practice, however, hardware-aware transpilation modifies circuit structure through qubit mapping, routing, and basis decomposition, potentially altering PQC behavior. In this paper, we perform a systematic hardware-aware analysis of expressibility and trainability by comparing logical and transpiled PQCs across multiple ansatz families, qubit counts, and circuit depths. Expressibility is measured using fidelity-based KL divergence, while trainability is quantified through gradient variance. Our results show that transpilation acts as an implicit architectural perturbation, producing strongly ansatz-dependent effects. Expressibility deviations exceed upto 125% in some cases, while trainability variations reach up to 25%. Structured ansatzes are generally more robust, whereas highly entangled architectures are more sensitive to transpilation-induced transformations. We further show that transpilation can alter the commonly assumed expressibility-trainability trade-off, demonstrating that logical-level analyses may not reliably predict hardware-level behavior. These findings highlight the importance of hardware-aware evaluation for accurate characterization of VQAs.", "url": "https://arxiv.org/abs/2605.25552", "type": "数值", "summary": "1. 该工作系统比较了变分量子算法中逻辑层与硬件感知编译后的参数化电路，用量子保真度KL散度和梯度方差量化了表现力与可训练性偏差。\n2. 其核心发现是编译作为隐式架构扰动，可导致表现力偏差最高达125%、可训练性变化达25%，并逆转通常假设的表现力-可训练性权衡关系。\n3. 这揭示了逻辑级分析无法可靠预测硬件级行为，指明实际量子计算中电路评估必须纳入硬件约束，为可扩展VQA设计提供关键依据。", "summary_source": "deepseek", "authors": [{"name": "Muhammad Kashif"}, {"name": "Muhammad Shafique"}], "featured_authors": [{"name": "Muhammad Kashif"}, {"name": "Muhammad Shafique"}], "author_count": 2}, {"id": "2605.25609", "category": "quant-ph", "title": "High fidelity preservation of photonic hyperentanglement in a free-space optical delay line", "abstract": "Photonic hyperentanglement enables increased information capacity and enhanced functionality for quantum communication and networking. However, synchronization of hyperentangled photon pairs requires maintaining correlations simultaneously across multiple degrees of freedom (DOFs). The preservation of polarization and energy-time entanglement in hyperentangled photon pairs is demonstrated using a free-space optical delay line based on nested Herriott cells. After a delay of 647 ns, a two-photon interference visibility of 93.9(3)% is observed in the energy-time DOF, while a CHSH parameter of 2.758(5) is obtained in the polarization DOF. These results confirm that entanglement correlations in both DOFs are preserved after propagation through the delay line. They demonstrate that free-space optical delay lines are compatible with complex photonic quantum states and provide a promising route toward delay-based memories for synchronization and multiplexing in quantum networks.", "url": "https://arxiv.org/abs/2605.25609", "type": "理论", "summary": "1. 该工作实验演示了利用嵌套Herriott池自由空间光学延迟线高保真度保持光子超纠缠态在偏振和能量-时间两个自由度上的关联。\n2. 关键卖点是647 ns延迟后能量-时间自由度双光子干涉可见度达93.9(3)%且偏振自由度CHSH参数达2.758(5)，证实两自由度纠缠同时保持。\n3. 这证明自由空间延迟线与复杂光子量子态兼容，为量子网络中基于延迟的存储器实现同步与复用提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Yu Guo"}, {"name": "Arya Chowdhury"}, {"name": "Pranay Tiwari"}, {"name": "Jia Boon Chin"}, {"name": "Anindya Banerji"}, {"name": "Alexander Ling"}], "featured_authors": [{"name": "Yu Guo"}, {"name": "Arya Chowdhury"}, {"name": "Pranay Tiwari"}, {"name": "Jia Boon Chin"}, {"name": "Anindya Banerji"}, {"name": "Alexander Ling"}], "author_count": 6}, {"id": "2605.25667", "category": "quant-ph", "title": "Dissipative Time Quasicrystals from Multilevel Interference", "abstract": "Boundary time crystals exhibit spontaneous breaking of continuous time-translation symmetry through persistent periodic oscillations in driven-dissipative many-body systems. Here, we show that multilevel interference provides a natural route beyond periodic order, enabling dissipative time quasicrystals without externally imposed quasiperiodic driving. We consider a collectively driven-dissipative four-level ensemble with two degenerate excited states and two degenerate ground states. In the thermodynamic limit, the exact mean-field dynamics reduces to an irrational flow on a two-dimensional torus, yielding quasiperiodic order parameters with discrete spectra generated by two incommensurate fundamental frequencies. Vanishing maximal Lyapunov exponents demonstrate that the nonlinear self-consistent dynamics remains nonchaotic. Our results establish a minimal interference-induced mechanism for time-quasiperiodic order and open a route toward higher-dimensional quasiperiodic dynamics in multilevel systems.", "url": "https://arxiv.org/abs/2605.25667", "type": "理论", "summary": "1. 该工作利用多能级干涉机制，在集体驱动的四能级耗散系统中实现了时间准晶序，无需外部准周期驱动。\n2. 其核心在于平均场动力学简化为二维环面上的无理流，产生两个不可公度频率的准周期序参量，且最大李雅普诺夫指数为零以保证非混沌性。\n3. 这为多能级系统中自发时间准周期序的干涉诱导机制建立了基础，并指向更高维权度准周期动力学的实现途径。", "summary_source": "deepseek", "authors": [{"name": "Kang Shen"}, {"name": "Xiangming Hu"}, {"name": "Fei Wang"}], "featured_authors": [{"name": "Kang Shen"}, {"name": "Xiangming Hu"}, {"name": "Fei Wang"}], "author_count": 3}, {"id": "2605.25692", "category": "quant-ph", "title": "Homomorphic Quantum Error Correction", "abstract": "Homomorphic quantum error correction aims to protect quantum data against both unauthorized access and environmental noise during server-based processing. We investigate the algebraic compatibility between quantum homomorphic encryption and quantum error correction, determining precise conditions under which encrypted encoded states remain inside the relevant code space during storage and computation. Our work establishes a necessary and sufficient criterion for an $[[n,1,d]]$ stabilizer code to remain compatible with the restricted transversal block-Pauli masking $U_{\\rm enc}(a,b)=(X^aZ^b)^{\\otimes n}$, stated explicitly for $[[n,1,d]]$ codes and extending directly to code-space preservation for $[[n,k,d]]$ codes. We verify this condition for standard examples (bit-flip and Shor codes, with the phase-flip repetition code following analogously), derive a practical criterion for Calderbank-Shor-Steane codes, and extend the analysis to three-dimensional color codes. A critical challenge emerges for non-Clifford gate implementation: the Shor code lacks a naive transversal $T$-gate implementation of the desired logical operation on encrypted encoded data. We present two routes around this obstruction. First, suitable triorthogonal codes admit transversal $T$-type logical implementations, up to Clifford corrections. Second, logical-gate masking gives code-space compatibility for arbitrary stabilizer codes, provided that suitable unitary representatives of the required logical gates are available. These results separate code-space compatibility from a full cryptographic security proof and provide explicit criteria for combining error correction with homomorphic processing in cloud quantum computing.", "url": "https://arxiv.org/abs/2605.25692", "type": "理论", "summary": "1. 该工作从代数兼容性出发，为同态量子纠错建立了稳定子码在横向块Pauli掩码下保持码空间的必要充分判据，并推广至一般[[n,k,d]]码。\n2. 其技术亮点在于验证了位翻转码、Shor码、CSS码及三维颜色码的兼容性，明确指出非Clifford门实现的障碍，并提出基于triorthogonal码横向T门和逻辑门掩码两条绕过路径。\n3. 该结果将码空间兼容性与完整安全性证明分离，为云量子计算中组合纠错与同态加密提供了显式代数准则，并指明了非Clifford逻辑门的可行实现方向。", "summary_source": "deepseek", "authors": [{"name": "Kornikar Sen"}, {"name": "Miguel A. Martin-Delgado"}], "featured_authors": [{"name": "Kornikar Sen"}, {"name": "Miguel A. Martin-Delgado"}], "author_count": 2}, {"id": "2605.25728", "category": "quant-ph", "title": "Q-LEAK: Quantum-Based LEAKage Verification for Side-Channel Countermeasures", "abstract": "Formal verification of power side-channel leakage and its countermeasures in cryptographic algorithms is challenging, as SAT-based methods fail to scale on XOR-heavy, time-unrolled cryptographic circuits with realistic leakage models. We construct compact Conjunctive Normal Form (CNF) cases modeling one-bit leakage under two-trace conditions, linking key dependence and state evolution. Classical solvers quickly reach complexity limits, so we propose Q-LEAK, a quantum-based verification approach using Grover's algorithm, compiling each CNF into an oracle and applying amplitude amplification to search in O(sqrt(N)) oracle calls, with oracles that encode the two-trace leakage predicate and the CNF constraints. Benchmarking against classical SAT shows both potential gains and practical resource limits. In noiseless tests on 5-7 variable benchmarks, Q-LEAK consistently recovered a satisf
