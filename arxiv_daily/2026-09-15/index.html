upling, the leading entropy exhibits an $O(N^3)$ scaling rather than the $O(N^2)$ behavior characteristic of conventional black holes; this scaling mismatch is the central result of our analysis. We further find no intrinsic Hawking temperature -- only a characteristic scale -- and a heat capacity that is negative at both the low- and high-temperature endpoints. Holding the physical radius fixed instead yields a genuine $O(N^2)$ scaling, so the power of $N$ is convention-dependent rather than an unambiguous prediction -- though the sign and temperature-scale mismatches persist either way. Rather than establishing a black-hole interpretation of the finite-temperature IKKT matrix model, these results provide a quantitative benchmark against which future analytical, numerical, and holographic investigations can be tested.", "url": "https://arxiv.org/abs/2609.13163", "type": "理论", "summary": "1. 该工作在新近提出的有限温度IKKT矩阵模型框架中，引入立方Myers项，计算模糊S^2背景的单圈自由能、内能、熵与热容，并评估其与黑洞热力学的对应。\n2. 其核心结果是，在固定Myers耦合下领头阶熵呈O(N^3)标度而非传统黑洞的O(N^2)，且无内禀霍金温度、只有特征尺度，热容在低温和高温端点均为负；若改为固定物理半径则恢复O(N^2)，说明N幂次依赖约定，但符号与温度尺度失配依旧。\n3. 这些结果因此不支持将模糊S^2直接解释为黑洞，而是为后续解析、数值和全息研究提供可检验的定量基准。", "summary_source": "deepseek", "authors": [{"name": "Koichiro Matsumoto"}], "featured_authors": [{"name": "Koichiro Matsumoto"}], "author_count": 1}, {"id": "2609.13365", "category": "hep-th", "title": "Constructing Concrete Colour Tensors for Simple Lie Algebras", "abstract": "We describe the implementation and use of colour_tensors: a Mathematica package built for the concrete construction of explicit colour tensors involving arbitrarily charged particles in any gauge theory. These can be used to directly determine linear relations among colour tensors and compute a number of otherwise difficult, representation-theoretic quantities relevant to scattering amplitudes such as colour-interference between partial amplitudes.", "url": "https://arxiv.org/abs/2609.13365", "type": "理论", "summary": "1. 该工作介绍了 Mathematica 软件包 colour_tensors 的实现与使用，可在任意规范理论中为任意荷的粒子显式构造具体的色张量，并直接给出它们之间的线性关系。\n2. 其技术卖点在于以色张量的具体构造替代抽象的表示论推导，从而自动计算部分振幅间色干涉等原本困难的表示论量。\n3. 这为散射振幅中色代数的显式处理提供了通用工具，并提示该具体张量方法可推广至更广泛的规范理论与高阶计算。", "summary_source": "deepseek", "authors": [{"name": "Jacob L. Bourjaily"}, {"name": "Michael Plesser"}, {"name": "Philip Velie"}], "featured_authors": [{"name": "Jacob L. Bourjaily"}, {"name": "Michael Plesser"}, {"name": "Philip Velie"}], "author_count": 3}, {"id": "2609.13370", "category": "hep-th", "title": "Bootstrapping currents and stress tensors in 3d CFTs", "abstract": "We perform a numerical conformal bootstrap study of the mixed system of correlation functions involving a spin-1 $\\mathrm{U}(1)$ current $J$ and the stress-energy tensor $T$ in parity-preserving 3d CFTs. We find universal bounds on the stress-tensor two-point function $c_T$, which numerically reproduce the conformal collider bounds on $\\langle JJT\\rangle$ and $\\langle TTT\\rangle$, as well as bounds on the leading parity-even and parity-odd scalar operator dimensions. Under mild assumptions, we determine the values of the $\\langle JJT\\rangle$ and $\\langle TTT\\rangle$ three-point functions in the $\\mathrm{O}(2)$ vector model. The $\\langle TTT\\rangle$ result is new and $\\langle JJT\\rangle$ is consistent with a previous result in the literature.", "url": "https://arxiv.org/abs/2609.13370", "type": "理论", "summary": "1. 该工作对保持宇称的三维共形场论中自旋1 U(1) 流 J 与能量-动量张量 T 的混合关联函数进行数值共形自举研究，给出 c_T、宇称偶/奇标量算符维数等普适界。\n2. 其核心在于通过 J-T 混合系统在数值上复现 ⟨JJT⟩ 与 ⟨TTT⟩ 的共形对撞机界，并在温和假设下确定 O(2) 矢量模型的三点函数值，其中 ⟨TTT⟩ 为新结果而 ⟨JJT⟩ 与已有文献一致。\n3. 这表明流与能量-动量张量联合自举可提取三维 CFT 的谱信息与三点耦合，为检验 O(2) 模型、对撞机约束及相关模型提供独立途径。", "summary_source": "deepseek", "authors": [{"name": "Vasiliy Dommes"}, {"name": "Rajeev S. Erramilli"}, {"name": "Colum Flynn"}, {"name": "Alexandre Homrich"}, {"name": "Petr Kravchuk"}, {"name": "David Poland"}, {"name": "David Simmons-Duffin"}, {"name": "George Yuzhe Zhou"}], "featured_authors": [{"name": "Vasiliy Dommes"}, {"name": "Rajeev S. Erramilli"}, {"name": "Colum Flynn"}, {"name": "David Poland"}, {"name": "David Simmons-Duffin"}, {"name": "George Yuzhe Zhou"}], "author_count": 8}, {"id": "2609.13374", "category": "hep-th", "title": "The index from a nonpoint and RG flows", "abstract": "We extend the algebro-geometric construction of bifiltered affine schemes that encode both the Higgs branch and the Macdonald index of 4d $\\mathcal{N}=2$ superconformal field theories to theories with non-trivial Higgs branches. For the Argyres--Douglas theories $\\mathcal{D}_p(SU(N))$, we find that a universal potential, given by a function in the Casimir invariants of $\\mathfrak{sl}(N)$, determines the scheme. The scheme is given by a `fattened' nilpotent orbit closure, encoding the OPE decoupling structure of the 4d theory. A procedure we call syzygy maximization fixes the precise potential in a broad range of examples, and the resulting schemes reproduce the 4d data. The underlying graded ring gives conjectural presentations of Zhu's $C_2$-algebra of the associated vertex operator algebra, while the bifiltration refines Arakawa's associated scheme by retaining the R-symmetry information. We find that Higgs branch renormalization group flows are realized by pulling back the same universal potential to the corresponding Slodowy slices, including flows for which the infrared Higgs branch is a point. In particular, our construction provides a systematic method for determining the Macdonald indices of the $\\mathcal{D}_p(SU(N), O)$ theories, for which no general expressions were previously known.", "url": "https://arxiv.org/abs/2609.13374", "type": "理论", "summary": "1. 该工作将编码4d N=2超共形场论Higgs分支与Macdonald指标的双滤过仿射概形构造推广至非平凡Higgs分支。\n2. 其卖点在于由sl(N) Casimir不变量构造普适势，经syzygy maximization确定加厚幂零轨道闭包，并给出Zhu C2代数猜想表示。\n3. 这为Higgs分支重整化群流提供统一描述，并给出D_p(SU(N),O)理论Macdonald指标的系统计算方法。", "summary_source": "deepseek", "authors": [{"name": "Monica Jinwoo Kang"}, {"name": "Craig Lawrie"}, {"name": "Jaewon Song"}], "featured_authors": [{"name": "Monica Jinwoo Kang"}, {"name": "Craig Lawrie"}, {"name": "Jaewon Song"}], "author_count": 3}, {"id": "2609.13377", "category": "hep-th", "title": "Integrable Chiral Quantum Field Theories with Spacetime-Dependent Interactions", "abstract": "We construct a class of integrable chiral fermionic quantum field theories with interactions depending on both space and time. The construction starts with a unitary, regular, difference-form two-body scattering matrix that satisfies braiding unitarity and the Yang--Baxter equation. Each freely moving right- or left-moving particle carries a characteristic coordinate that remains constant along its trajectory, and the scattering matrix depends on differences of these coordinates. The many-body amplitudes form a discrete connection over coordinate-ordering sectors. The Yang--Baxter equation gives its local flatness, while periodicity on a spatial circle produces quantum Knizhnik--Zamolodchikov difference equations expressing global flatness. In terms of a reference amplitude satisfying the exchange and qKZ constraints, these transports determine the exact fixed-particle-number wavefunction. We derive the characteristic form of the spacetime-dependent interaction and illustrate the construction with a chiral $SU(2)$ Gross--Neveu realization. Independent reparametrizations of the right- and left-moving characteristics yield genuine space-time dependence, whereas equal-slope affine maps recover the spatially homogeneous, time-dependent case.", "url": "https://arxiv.org/abs/2609.13377", "type": "理论", "summary": "1. 该工作构造了一类相互作用同时依赖空间与时间的可积手征费米子场论，出发点为满足辫子幺正性和Yang-Baxter方程的正则差形式散射矩阵。\n2. 其核心是引入沿自由轨迹守恒的左右手征坐标，使散射只依赖坐标差，多体振幅在坐标排序扇区上形成离散联络；Yang-Baxter方程对应局部平坦性，圆周周期性导出qKZ差分方程对应全局平坦性，从而给出固定粒子数的精确波函数。\n3. 独立重参数化左右特征坐标产生真实时空依赖，等斜率仿射映射退回空间均匀的时间依赖情形；手征SU(2) Gross-Neveu实现显示该框架能构造非均匀可积模型并联系qKZ理论。", "summary_source": "deepseek", "authors": [{"name": "Pradip Kattel"}], "featured_authors": [{"name": "Pradip Kattel"}], "author_count": 1}, {"id": "2609.13381", "category": "hep-th", "title": "The Conformal $w$-Algebra", "abstract": "Einstein gravity in four asymptotically flat dimensions is governed by a tower of soft theorems obeying an $\\mathcal{L}w_{1+\\infty}$ commutator algebra. This algebra is deformed to $\\mathcal{L}_\\Lambda w_{1+\\infty}$ in the conformally related AdS$_4$ and dS$_4$ spacetimes. Here we construct the larger ``conformal $w$-algebra\", denoted $\\mathcal{C}w_{1+\\infty}$, which acts on conformal gravity in all of these spacetimes. It includes $\\mathcal{L}w_{1+\\infty}$, $\\mathcal{L}_\\Lambda w_{1+\\infty}$ and the $\\mathfrak{so}(4,2)$ 4D conformal algebra as subalgebras. We show that $\\mathcal{C}w_{1+\\infty}$ is the conformal completion of either $\\mathcal{L}w_{1+\\infty}$ or $\\mathcal{L}_\\Lambda w_{1+\\infty}$. A derivation of $\\mathcal{C}w_{1+\\infty}$ is given as the symmetry of the twistor action of self-dual conformal gravity.", "url": "https://arxiv.org/abs/2609.13381", "type": "理论", "summary": "1. 该工作构造了作用于共形引力的更大共形 w-代数 Cw_{1+∞}，统一涵盖平坦、AdS4 与 dS4 等时空中的软定理代数。\n2. 其核心是证明 Cw_{1+∞} 包含 Lw_{1+∞}、L_Λw_{1+∞} 和 so(4,2) 作为子代数，并是前两者的共形完备化；它可由自对偶共形引力的扭量作用量对称性导出。\n3. 该框架将平直及共形相关的 AdS4/dS4 时空中的软定理代数纳入单一结构，为共形引力与软定理的扭量对称性描述提供了统一视角。", "summary_source": "deepseek", "authors": [{"name": "Simon Heuveline"}, {"name": "Nia Robles Del Pino"}, {"name": "Andrew Strominger"}], "featured_authors": [{"name": "Simon Heuveline"}, {"name": "Nia Robles Del Pino"}, {"name": "Andrew Strominger"}], "author_count": 3}, {"id": "2609.13386", "category": "hep-th", "title": "Matrix Theory from Holography", "abstract": "We propose a setup that embeds Matrix Theory for M-theory into the AdS/CFT correspondence, allowing the former to be tested using the latter. The central claim is a triality among the BMN matrix model of rank $m$, a large-charge monopole sector of ABJM theory with charge $J$, and M-theory on the maximally supersymmetric eleven-dimensional pp-wave with a compact lightlike direction. The relevant ABJM limit sends $N,k,J\\to\\infty$ while keeping $N/k^2$ and $m=J/k$ fixed. We provide quantitative evidence for this triality by showing that, in this triple-scaling limit, the ABJM superconformal index agrees precisely with a grand-canonical sum of Witten indices of the $U(m)$ BMN matrix model. This relation also yields a compact grand-canonical expression for the BMN index, which we use to revisit its large-$m$ behavior. Our analytic and numerical results reveal strong boson--fermion cancellations and show no evidence for the previously claimed $e^{O(m^2)}$ growth when the BMN charge scales as $Q \\sim m^2$. We further study the correspondence between the BPS cohomologies of the two theories by constructing a letter-level dictionary. This leads to a new notion of BPS fortuity in ABJM theory that survives even at strict $N=\\infty$: although the usual fortuity associated with finite-$N$ trace relations disappears in the triple-scaling limit, each fixed-monopole sector is governed by the effective rank $m$, and finite-$m$ trace relations generate fortuitous states that map directly to fortuitous states of the BMN matrix model. Finally, we discuss connections to related concepts such as large-charge matrix models, open--closed--open triality, and worldline holography.", "url": "https://arxiv.org/abs/2609.13386", "type": "理论", "summary": "1. 该工作围绕《Matrix Theory from Holography》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Shota Komatsu"}, {"name": "Eunwoo Lee"}, {"name": "Chintan Patel"}], "featured_authors": [{"name": "Shota Komatsu"}, {"name": "Eunwoo Lee"}, {"name": "Chintan Patel"}], "author_count": 3}, {"id": "2609.13558", "category": "hep-th", "title": "Electromagnetic Duality Sensitivity of Holographic Complexity", "abstract": "We investigate electromagnetic duality as a diagnostic of the sensitivity of information content of holographic complexity via \"complexity=anything\" in Einstein-ModMax theory. Functionals constructed solely from gravitational invariants are duality invariant, whereas matter-sensitive functionals can distinguish electromagnetic configurations that share the same bulk geometry and energy-momentum tensor. As an explicit example, we consider a functional involving $F_{\\mu\\nu}F^{\\mu\\nu}$ and show that its complexity and complexity growth vary along the duality orbit, interpolating between purely electric, mixed electric-magnetic, and purely magnetic configurations. This provides an explicit realization of the freedom inherent in generalized holographic complexity and shows that different choices of complexity functional can retain different sensitivity to information about the bulk matter sector even when the gravitational geometry is insensitive to that information.", "url": "https://arxiv.org/abs/2609.13558", "type": "理论", "summary": "1. 该工作在全息复杂度框架下，利用“complexity=anything”于Einstein-ModMax理论中，考察电磁对偶作为诊断量如何反映全息复杂度所含信息的敏感性。\n2. 其关键物理点在于：仅由引力不变量构造的泛函对偶不变，而含物质项的泛函可区分具有相同体几何与能动张量的电磁位形；以含场强平方项的泛函为例，其复杂度及增长率沿对偶轨道从纯电、混合到纯磁连续变化。\n3. 这既显式实现了广义全息复杂度的选择自由度，也表明即便引力几何对物质信息不敏感，不同复杂度泛函仍可保留对该信息的不同敏感性，为后续定义检验提供方向。", "summary_source": "deepseek", "authors": [{"name": "Mojtaba Shahbazi"}, {"name": "Mehdi Sadeghi"}], "featured_authors": [{"name": "Mojtaba Shahbazi"}, {"name": "Mehdi Sadeghi"}], "author_count": 2}, {"id": "2609.13649", "category": "hep-th", "title": "Dimensional reduction and thermodynamics of a non-local scalar field theory", "abstract": "In this paper, we study the dimensional reduction of a nonlocal scalar field theory to 1+2 dimensions. This nonlocal model introduces a light mass parameter as a scale that primarily modifies the infrared regime of the theory. We constraint the external sources to a bidimensional plane to obtain the effective Green's function and propose an effective Lagrangian for the scalar field in 1+2 dimensions. Using the static propagator, we calculate the interaction energy between point-like charges in the planar space. Furthermore, we evaluate the causal and Feynman Green's functions, and discuss the unitarity of the effective planar model at tree level. Finally, we implement the Matsubara formalism to investigate the thermodynamics of the planar model. The exact thermal free energy shows the fractional degrees of freedom characteristic of kinematic confinement and imposes a strict low-temperature validity bound ($T \\ll \\Lambda$) to preserve the macroscopic thermodynamic stability.", "url": "https://arxiv.org/abs/2609.13649", "type": "理论", "summary": "1. 该工作研究了非局域标量场论向1+2维的维度约化，通过将外源限制在二维平面得到有效格林函数并构造平面有效拉氏量。\n2. 其核心在于引入主要修正红外区间的轻质量标度，利用静态传播子计算平面点电荷相互作用能，并检验因果/费曼格林函数、树级幺正性及松原热力学。\n3. 精确热自由能呈现运动学禁闭所导致的分数自由度，并给出T≪Λ的低温有效性条件，以维护宏观热力学稳定性，并为低维非局域模型研究提供约束。", "summary_source": "deepseek", "authors": [{"name": "S. Duque Cesar"}, {"name": "M. J. Neves"}], "featured_authors": [{"name": "S. Duque Cesar"}, {"name": "M. J. Neves"}], "author_count": 2}, {"id": "2609.13994", "category": "hep-th", "title": "A new product entropy", "abstract": "We propose a new product entropy, defined as the Rényi (or von Neumann) entropy of a normalized product operator constructed from two density matrices. We establish a duality showing that the SVD entanglement entropy of a subsystem for two pure states is exactly equivalent to the product entropy of the complementary subsystem. This connection provides both a transparent physical interpretation in terms of the spectral diversity of the subsystem state product and a computationally efficient route that bypasses the reduced transition matrix. For low-lying eigenstates, we derive analytical expressions for the subsystem product entropy between the ground state and primary excitations in two-dimensional conformal field theories, explicitly verified against the critical Ising chain. In quantum quench dynamics, the quasiparticle picture yields time evolution in the scaling limit: following a global quench, the subsystem product entropy exhibits distinct sequences of thermalization and revivals, whereas under a local operator quench, it develops characteristic plateaus whose constant values are determined by the inserted operator. Extensive numerical calculations on the critical Ising chain confirm the analytical predictions with excellent accuracy.", "url": "https://arxiv.org/abs/2609.13994", "type": "理论", "summary": "1. 该文提出乘积熵，即两密度矩阵归一化乘积算符的 Rényi 或冯诺依曼熵，并建立其与奇异值分解纠缠熵的对偶关系。\n2. 其核心卖点是对偶：两纯态子系统的奇异值分解纠缠熵等于互补子系统的乘积熵，可解释为谱多样性并绕过约化跃迁矩阵。\n3. 该框架为两态关联与淬火动力学提供可计算熵度量，共形场论预言已在临界 Ising 链验证。", "summary_source": "deepseek", "authors": [{"name": "Jiaju Zhang"}, {"name": "Zhuo-Yu Xian"}, {"name": "René Meyer"}, {"name": "Song He"}, {"name": "Bin Chen"}], "featured_authors": [{"name": "Jiaju Zhang"}, {"name": "Zhuo-Yu Xian"}, {"name": "René Meyer"}, {"name": "Song He"}, {"name": "Bin Chen"}], "author_count": 5}, {"id": "2609.14165", "category": "hep-th", "title": "Modular flow and the area operator", "abstract": "In the context of the AdS/CFT correspondence, the Jafferis-Lewkowycz-Maldacena-Suh (JLMS) formula relates the boundary modular Hamiltonian to the HRT area operator and the corresponding bulk modular Hamiltonian. In standard discussions of a holographic code built from perturbative excitations on a fixed classical background, the $A/4G$ term dominates over the bulk modular Hamiltonian in the limit $G \\to 0$. However, this setup is insufficient to describe the action of boundary modular flows that change the classical background. In contrast, our recent discussion of `large' codes provides a useful framework to obtain a JLMS formula that relates bulk and boundary modular flows acting on appropriate states in the code. Here, one sees that the bulk modular Hamiltonian is not in fact subdominant when the modular flow defined by one state acts on another state peaked around a sufficiently different classical background. Instead, the bulk modular Hamiltonian can be of order $1/G$ and can dominate over the $A/4G$ term. Nevertheless, we show that if the two states have the same classical background except for data conjugate to the HRT area then, under mild assumptions and over a large range of flow parameters, the modular-flowed state is described by a classical background given by the HRT-area flow alone.", "url": "https://arxiv.org/abs/2609.14165", "type": "理论", "summary": "1. 该工作在AdS/CFT下利用“large”码框架，构建了联系边界与体能区模流的JLMS公式，以刻画可改变经典背景的模流作用。\n2. 其要点是：当一态定义的模流作用于经典背景显著不同的另一态时，体模哈密顿量不再次主导，可达1/G阶并超过A/4G项。\n3. 若两态除与HRT面积共轭的数据外具有相同经典背景，则在温和假设和较宽流参数范围内，模流态仍由仅含HRT面积流的经典背景描述，为超越固定背景的全息纠缠几何提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Xi Dong"}, {"name": "Donald Marolf"}, {"name": "Pratik Rath"}], "featured_authors": [{"name": "Xi Dong"}, {"name": "Donald Marolf"}, {"name": "Pratik Rath"}], "author_count": 3}, {"id": "2609.14296", "category": "hep-th", "title": "Holographic Casimir Effect for Mixed Boundary Conditions and non-CFTs", "abstract": "This paper investigates the holographic Casimir effect in AdS/BCFT with a brane-localized scalar field. The scalar field takes different values at the strip's two boundaries, leading to mixed boundary conditions. The massive brane-localized scalar field typically breaks the boundary conformal symmetries, allowing us to study the holographic Casimir effect in non-CFTs. In two-dimensional spacetime, we apply the holographic g-theorem to prove the holographic bound on the Casimir effect for general brane-localized matter fields. In higher dimensions, we find that the brane-localized scalar field reduces the Casimir amplitude when the mass squared \\(m^2=0\\), but can increase it when \\(m^2 < 0\\). Additionally, there is a no-hair theorem for the cases where \\(m^2>0\\). These findings indicate that relevant boundary deformations can enhance the Casimir effect. As a byproduct, we obtain a gravitational dual of the repulsive Casimir force under mixed boundary conditions and argue that it aligns with the cosmic censorship conjecture.", "url": "https://arxiv.org/abs/2609.14296", "type": "理论", "summary": "1. 该文在AdS/BCFT框架下引入膜局域标量场，并令条带两侧边界取不同标量值，从而在混合边界条件和非共形边界场论中研究全息卡西米尔效应。\n2. 其核心在于质量项破坏边界共形对称性：二维情形借助全息g定理证明一般膜局域物质场对卡西米尔效应的全息界，高维则表明m^2=0时降低卡西米尔振幅、m^2<0时可增强，并给出m^2>0的无毛定理。\n3. 该结果说明相关边界形变可增强卡西米尔效应，并作为副产品给出混合边界条件下排斥性卡西米尔力的引力对偶，暗示其与宇宙监督猜想相容。", "summary_source": "deepseek", "authors": [{"name": "Bing-Ji Ding"}, {"name": "Hua-Chao Liu"}, {"name": "Rong-Xin Miao"}], "featured_authors": [{"name": "Bing-Ji Ding"}, {"name": "Hua-Chao Liu"}, {"name": "Rong-Xin Miao"}], "author_count": 3}, {"id": "2609.14305", "category": "hep-th", "title": "Pseudo entropy from entanglement entropy", "abstract": "Pseudo entropy extends entanglement entropy from a single quantum state to a pair of nonorthogonal states and is generally complex. Taking advantage of Cauchy-Riemann equations, Kramers-Kronig relations, and analytic continuation in state parameters, we show how and to what extent real and imaginary parts of pseudo entropy can be derived from ordinary entanglement entropy. For families with holomorphic coefficients in finite-dimensional Hilbert spaces, the reduced transition matrix equals the ordinary reduced density matrix formula evaluated at complex parameters. Then a convergent Taylor series gives the real and imaginary parts of pseudo entropy from even and odd derivatives of entanglement entropy at the real midpoint. The matrix identity also gives formulae for excess pseudo entropy and Renyi entropies, and interpolation formulae for families with polynomial coefficients. We apply these results to boundary-state quenches and thermal states in conformal field theory, and to fermionic and bosonic Gaussian states and quenches. In conformal field theory, Kramers-Kronig relations give the first moment of the imaginary part in terms of the central charge and one-point functions for boundary states.", "url": "https://arxiv.org/abs/2609.14305", "type": "理论", "summary": "1. 该工作建立从普通纠缠熵提取赝熵的解析框架，借助柯西-黎曼方程、克拉默斯-克勒尼希关系和态参数解析延拓，界定赝熵实部与虚部可在何种程度上由纠缠熵确定。\n2. 对有限维希尔伯特空间中系数全纯的态族，约化跃迁矩阵等于普通约化密度矩阵公式在复参数处的取值，故可由实中点处纠缠熵的偶阶与奇阶导数通过收敛泰勒级数分别得到赝熵的实部与虚部，并给出过剩赝熵、雷尼熵及多项式系数族的内插公式。\n3. 该框架应用于共形场论中的边界态淬火与热态以及费米子和玻色子高斯态与淬火，表明在共形场论中克拉默斯-克勒尼希关系可将虚部一阶矩用中心电荷与边界态单点函数表示。", "summary_source": "deepseek", "authors": [{"name": "Abhigyan Saha"}, {"name": "Piotr Sułkowski"}, {"name": "Tadashi Takayanagi"}], "featured_authors": [{"name": "Abhigyan Saha"}, {"name": "Piotr Sułkowski"}, {"name": "Tadashi Takayanagi"}], "author_count": 3}, {"id": "2609.14330", "category": "hep-th", "title": "Relations between the higher Hamiltonians of the trigonometric and the rational spin Calogero-Sutherland models", "abstract": "In this paper we study the relations between the Hamiltonian hierarchy generated by trigonometric Cherednik-Dunkl operators and the one generated by rational Dunkl operators. We develop two nested structures relating these two hierarchies. The first nested relation reconstructs the higher rational spin Calogero-Sutherland Hamiltonians exactly from the trigonometric ones. The second nested relation reconstructs the higher trigonometric spin Calogero-Sutherland Hamiltonians as leading terms from the rational ones. In addition, we provide an explanation of the eigenvalues of the trigonometric spin Calogero-Sutherland Hamiltonians in terms of $N$-colored Young diagrams and Maya diagrams.", "url": "https://arxiv.org/abs/2609.14330", "type": "理论", "summary": "1. 该工作围绕《Relations between the higher Hamiltonians of the trigonometric and the rational spin Calogero-Sutherland models》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Yue Li"}, {"name": "Fan Liu"}, {"name": "Lu-Yao Wang"}, {"name": "Jie Yang"}], "featured_authors": [{"name": "Yue Li"}, {"name": "Fan Liu"}, {"name": "Lu-Yao Wang"}, {"name": "Jie Yang"}], "author_count": 4}, {"id": "2609.14345", "category": "hep-th", "title": "Free Field Realization of $\\mathcal{W}$-Algebra Associated with Exceptional Lie Algebras", "abstract": "We study the free field realization of the $\\mathcal{W}$-algebra associated with the exceptional Lie algebras $E_6$, $E_7$, $E_8$, and $F_4$. We develop a recursive construction in which a $\\mathcal{W}$-algebra of rank $r$ is obtained from a $\\mathcal{W}$-algebra of rank $r-1$ together with a free boson. The $\\mathcal{W}$-currents are constructed from the zero commutation relation with the screening charges. The $\\mathcal{W}E_6/\\mathcal{W}E_7$ algebra is constructed from the $\\mathcal{W}D_5/\\mathcal{W}D_6$ algebra and is shown to be the same as that realized from the $\\mathcal{W}A_5/\\mathcal{W}E_6$ algebra, up to a change of the free field basis. The spin-$8$ generator of the $\\mathcal{W}E_8$ algebra is built from the $\\mathcal{W}D_7$ algebra. The recursive construction of the $\\mathcal{W}BC_r$ algebras is also studied. We then realize the $\\mathcal{W}F_4$ algebra based on the $\\mathcal{W}BC_3$ algebra. Furthermore, the $\\mathcal{W}$-charges of the generators of the $\\mathcal{W}E_{6,7}$, $\\mathcal{W}BC_{2,3}$, and $\\mathcal{W}F_4$ algebras are calculated and expressed in terms of the Casimir invariants.", "url": "https://arxiv.org/abs/2609.14345", "type": "理论", "summary": "1. 该工作研究例外李代数E6、E7、E8和F4对应W-代数的自由场实现，并建立由秩r-1的W-代数加一个自由玻色子递推得到秩r的构造。\n2. 其核心是用与筛选荷零对易构造W-流，证明WE6/WE7的WD5/WD6实现与WA5/WE6实现仅差自由场基变换，并由WD7构造WE8自旋8生成元、由WBC3实现WF4。\n3. 该框架还给出WE6,7、WBC2,3和WF4生成元的W-荷随卡西米尔不变量的表达，并把WBC_r递推纳入统一构造。", "summary_source": "deepseek", "authors": [{"name": "Daichi Ide"}, {"name": "Katsushi Ito"}, {"name": "Shigeki Miyazaki"}], "featured_authors": [{"name": "Daichi Ide"}, {"name": "Katsushi Ito"}, {"name": "Shigeki Miyazaki"}], "author_count": 3}, {"id": "2609.14401", "category": "hep-th", "title": "Entanglement Harvesting Landscapes: A Common Computational Framework", "abstract": "Entanglement harvesting provides an operational means of probing the nonlocal correlation structure of quantum fields through localized detector-field interactions. Although harvesting has been investigated in a wide variety of spacetime backgrounds and quantum field states, existing studies largely focus on individual detector configurations or specific physical settings. In this work, we develop a unified perturbative framework for entanglement harvesting with localized Unruh-DeWitt detectors that is applicable to arbitrary detector trajectories and quantum field states through the corresponding Wightman function. By expressing the detector response in terms of dimensionless variables and analytically reducing the perturbative integrals to numerically efficient representations, the framework enables a systematic exploration of multidimensional harvesting landscapes, phase boundaries, and harvesting robustness. As representative applications, we investigate inertial detectors in the Minkowski vacuum, thermal field states, and uniformly accelerated observers. We show that finite temperature enhances both the local detector response and the nonlocal exchange amplitude, leading, within the perturbative Gaussian-switching framework considered here, to an enlargement of the harvesting region in parameter space. The resulting harvesting landscapes provide a global characterization of detector-field interactions and demonstrate how temperature and observer motion reshape the competition between local detector noise and nonlocal field correlations. The framework developed here provides a unified and readily extensible methodology for investigating entanglement harvesting across a broad class of relativistic quantum systems.", "url": "https://arxiv.org/abs/2609.14401", "type": "理论", "summary": "1. 该工作构建了一个统一的微扰框架，利用局域Unruh-DeWitt探测器研究纠缠收获，并借助Wightman函数使其适用于任意探测器轨迹与任意量子场态。\n2. 其关键卖点在于将探测器响应表示为无量纲变量，并把微扰积分解析约化为数值高效的表示，从而系统探索多维收获景观、相边界及鲁棒性；在闵可夫斯基真空、热态和匀加速观测者等例子中，有限温度同时增强局域响应与非局域交换，并在该高斯开关微扰框架内扩大参数空间中的收获区域。\n3. 该框架提供了统一且易于扩展的方法论，可用于广泛相对论量子系统中的纠缠收获研究，并表明温度与观察者运动如何重塑局域探测器噪声与非局域场关联之间的竞争。", "summary_source": "deepseek", "authors": [{"name": "Rahul Nigam"}, {"name": "Ujjwala Vadrevu"}, {"name": "Akshay Kulkarni"}], "featured_authors": [{"name": "Rahul Nigam"}, {"name": "Ujjwala Vadrevu"}, {"name": "Akshay Kulkarni"}], "author_count": 3}, {"id": "2609.14423", "category": "hep-th", "title": "Caterpillar Degenerations of Spectral Curves and Double Gelfand-Zeitlin Geometry", "abstract": "In this paper, we study the decomposition, in the caterpillar or weak-coupling limit, of a spectral curve with two irregular poles of order two, namely a spectral curve of type $(2,2)$, into two spectral curves each having one regular singularity(order-$1$ pole) and one irregular pole of order two, namely spectral curves of type $(1,2)$ or $(2,1)$. Such spectral curves can be identified with a double Gelfand--Zeitlin (DGZ) system. We show that the Duistermaat--Heckman measure on the DGZ side can be identified with the Weyl measure on the gauge-theory side arises from gluing two quivers. Furthermore, the Fourier expansion of the isomonodromic tau function can be interpreted as a Peter--Weyl expansion in the real polarization of the DGZ system. On the other hand, we introduce the nodal caterpillar spectral network. Applying the caterpillar spectral network, we then obtain an explicit expression for the Stokes matrix up to a normalization factor. This expression agrees with the existing analytic formulas. Moreover, we identify the variation of endpoint normalization arising in the Stokes computation with the equivariant Euler class of the fluctuation complex over the Coulomb moduli space. As a result, the variations produce both the perturbative coefficients of isomonodromy tau and the perturbative partition function, and thus give an identification of them without using conformal blocks. Finally, using the gluing technique for spectral curves and the DGZ system, we predict the perturbative coefficients of the conjectural higher-rank $P_{\\mathrm{III}}$ isomonodromic tau function from the viewpoint of spectral geometry.", "url": "https://arxiv.org/abs/2609.14423", "type": "理论", "summary": "1. 该工作围绕《Caterpillar Degenerations of Spectral Curves and Double Gelfand-Zeitlin Geometry》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "George Y. Liu"}], "featured_authors": [{"name": "George Y. Liu"}], "author_count": 1}, {"id": "2609.14497", "category": "hep-th", "title": "M2 brane in AdS$_4\\times S^7/\\mathbb Z_k$: 2-loop correction to $\\frac{1}{2}$-BPS Wilson loop vs localization in ABJM theory", "abstract": "We study the quantization of an M2 brane wrapping $\\mathrm{AdS}_2\\times S^1$ inside $\\mathrm{AdS}_4\\times S^7/\\mathbb{Z}_k$, dual to the $\\frac{1}{2}$-BPS circular Wilson loop in ABJM theory. The classical action and the one-loop contribution were previously shown to reproduce the gauge-theory localization result. Here we extend the analysis to the two-loop order. In an adapted static and $\\kappa$-symmetry gauge the world-volume action contains no cubic interaction vertices, so that the two-loop correction is determined entirely by quartic interactions and is manifestly free of logarithmic UV divergences. We find that the bosonic and fermionic contributions combine into a perfect square $ {\\mathscr X}^2$ where ${\\mathscr X}$ is a linear combination of the bosonic and fermionic 3d Green's functions and their derivatives. The evaluation of $\\mathscr X$ requires fixing the $\\mathrm{AdS}_2$ boundary quantization of the massless fermionic modes. With the boundary conditions selected by the preserved supersymmetry, $\\mathscr X$ vanishes and hence the complete two-loop correction is found to be zero. This result would not be consistent with identifying the M2-brane loop expansion directly with the large-$N$ expansion of the canonical, fixed-$(N,k)$ localization prediction. Instead, it agrees precisely with the recent proposal that the semiclassical M2-brane partition function should be matched to the gauge-theory grand-canonical ensemble, in which the Wilson loop expectation value is perturbatively one-loop exact. The vanishing of the two-loop correction thus provides a non-trivial test of this grand-canonical identification.", "url": "https://arxiv.org/abs/2609.14497", "type": "理论", "summary": "1. 该工作将AdS₄×S⁷/ℤ_k中包裹AdS₂×S¹的M2膜量子化推进至两圈，以检验ABJM理论中1/2-BPS圆Wilson圈的对偶局域化预言。\n2. 其要点是在静态与κ对称规范下世界体作用量无三次顶点，两圈修正仅由四次相互作用决定且无对数紫外发散；玻色与费米贡献组成完全平方X²，取保持超对称的AdS₂边界条件后X=0，故两圈修正为零。\n3. 该零结果与将M2膜圈展开直接等同于固定(N,k)局域化的大N展开不符，却支持把半经典M2膜配分函数匹配到规范理论巨正则系综、且Wilson圈微扰一圈精确的提议，并构成非平凡检验。", "summary_source": "deepseek", "authors": [{"name": "M. Beccaria"}, {"name": "S.A. Kurlyand"}, {"name": "A.A. Tseytlin"}, {"name": "J. van Muiden"}], "featured_authors": [{"name": "M. Beccaria"}, {"name": "S.A. Kurlyand"}, {"name": "A.A. Tseytlin"}, {"name": "J. van Muiden"}], "author_count": 4}, {"id": "2609.14603", "category": "hep-th", "title": "Attraction and repulsion along extremal Einstein--two-Maxwell--dilaton branches", "abstract": "We study extremal mass branches in four-dimensional Einstein gravity coupled to one dilaton and two Maxwell fields with opposite-sign dilaton couplings. For generic couplings the extremal mass is governed by a nonlinear first-order equation with no known closed-form solution. We prove that this equation has a unique positive $C^2$ solution on the full real charge-ratio line and that the solution is real analytic, so positivity on the entire positive charge cone selects a unique global mass branch. Along this branch, any two nonproportional positive charge vectors attract for $ab>-1$, have vanishing leading force at $ab=-1$, and repel for $ab<-1$. The same transition fixes the transverse convexity of the extremal mass surface and the sign of the mass difference under arbitrary finite positive-charge partitions. The sign theorem extends to higher dimensions through the known dimensional rescaling. A radial reconstruction then shows that every point of the mass branch defines an asymptotically flat exterior with a finite-area inner endpoint, while smooth or analytic horizon extension is a separate condition that restricts the couplings and scalar flow.", "url": "https://arxiv.org/abs/2609.14603", "type": "理论", "summary": "1. 该工作研究四维爱因斯坦引力耦合一个伸缩子与两个麦克斯韦场（耦合反号）的极值质量分支，并证明控制该分支的非线性一阶方程在全实电荷比直线上有唯一正二阶可微解且实解析。\n2. 其核心卖点在于该唯一全局分支给出吸引—排斥判据：任意两个非比例正电荷矢量在 ab>-1 时吸引、ab=-1 时领头力消失、ab<-1 时排斥，并同步确定极值质量面的横向凸性及任意有限正电荷分割下质量差的符号。\n3. 该符号定理可经维数缩放推广到高维；径向重构表明分支每点定义渐近平直外域与有限面积内端点，而光滑或解析视界延拓是额外限制耦合与标量流的独立条件。", "summary_source": "deepseek", "authors": [{"name": "Ye Zhou"}], "featured_authors": [{"name": "Ye Zhou"}], "author_count": 1}, {"id": "2609.14617", "category": "hep-th", "title": "Monopole fission", "abstract": "There is a 4N-dimensional moduli space of SU(2) BPS monopoles with charge N, but introducing a Higgs potential removes this degeneracy and yields a repulsive force between monopoles. However, if a point in the BPS monopole moduli space is sufficiently symmetric, then it flows to a similar non-BPS saddle point solution once the Higgs potential is introduced. Monopole fission, into constituent monopoles with lower charges, results from symmetry breaking perturbations of such saddle point solutions. This fission is investigated numerically, by evolving the gradient flow equations of the Yang-Mills-Higgs theory, with initial conditions and symmetry breaking perturbations created using rational maps between Riemann spheres. The results resemble components of BPS monopole scattering processes obtained within the geodesic approximation for low speed monopole dynamics.", "url": "https://arxiv.org/abs/2609.14617", "type": "理论", "summary": "1. 该工作数值研究带Higgs势的SU(2) Yang-Mills-Higgs理论中BPS单极子裂变为低电荷单极子。\n2. 其核心是高度对称BPS模空间点在Higgs势下流向非BPS鞍点，破缺微扰触发裂变；数值上以有理映射构造初态并演化梯度流。\n3. 所得裂变模式类似低能BPS单极子散射的测地近似组分，提示鞍点解与散射动力学存在联系。", "summary_source": "deepseek", "authors": [{"name": "Paul Sutcliffe"}], "featured_authors": [{"name": "Paul Sutcliffe"}], "author_count": 1}, {"id": "2609.14627", "category": "hep-th", "title": "Emergent Einstein-Cartan gravity from a spinor loop", "abstract": "In Einstein-Cartan spinor gravity under the irreversible vierbein postulate, only the spinor among the first-order variables has a kinetic term of its own at tree level. Any nonzero background vierbein breaks the local-Lorentz (LL) symmetry spontaneously. Our previous work showed that the spinor loop generates the kinetic and mass terms of the LL gauge field, manifesting LL as a hidden local symmetry. Here we show that the spinor loop also generates the vierbein two-point function, while respecting the background gauge invariance and satisfying the Ward-Takahashi identities of the true gauge invariance, for both the general-coordinate and LL symmetries. The scheme-independent logarithmic divergence assembles the familiar induced-gravity ingredients: a cosmological constant, an Einstein-Hilbert and a Weyl-squared term for the metric sector, and a mass and a higher-derivative kinetic term for the totally antisymmetric torsion. In the vierbein sector, this torsion is carried by the derivative of the antisymmetric part of the linear vierbein fluctuation. This part is the would-be Nambu-Goldstone boson of the spontaneously broken LL symmetry, and its couplings in the minimally coupled action are all fixed by general-coordinate and LL gauge invariance. The five induced terms form a single effective action, manifestly invariant under both symmetries, completing the vierbein sector of the hidden-local-Lorentz emergent-gravity scenario.", "url": "https://arxiv.org/abs/2609.14627", "type": "理论", "summary": "1. 在不可逆四元标架假设下，该工作计算爱因斯坦-嘉当旋量引力中旋量圈对四元标架两点函数的诱导贡献，并验证广义坐标与局部洛伦兹规范不变性及Ward-Takahashi恒等式。\n2. 其卖点是方案无关的对数发散自动生成宇宙学常数、爱因斯坦-希尔伯特与外尔平方项，以及全反对称挠率的质量和高阶动能项；四元标架扇区的挠率由线性涨落反对称部分的导数携带，即自发破缺局部洛伦兹的准南部-戈德斯通玻色子。\n3. 五项诱导项构成单一有效作用量，显式保持两种规范对称性，补全隐藏局部洛伦兹涌现引力图景的四元标架扇区。", "summary_source": "deepseek", "authors": [{"name": "Yadikaer Maitiniyazi"}, {"name": "Shinya Matsuzaki"}, {"name": "Kin-ya Oda"}, {"name": "Yoshiki Uchida"}, {"name": "Masatoshi Yamada"}], "featured_authors": [{"name": "Yadikaer Maitiniyazi"}, {"name": "Shinya Matsuzaki"}, {"name": "Kin-ya Oda"}, {"name": "Yoshiki Uchida"}, {"name": "Masatoshi Yamada"}], "author_count": 5}, {"id": "2609.14689", "category": "hep-th", "title": "BCS Gap Equation on Riemannian Manifolds: A Heat Kernel Analysis", "abstract": "In this paper, we investigate the Bardeen-Cooper-Schrieffer (BCS) theory of superconductivity formulated on a three dimensional Riemannian manifold. We derive the gap equation in the path integral picture by employing a Hubbard-Stratonovich transformation followed by a saddle point approximation. Under the assumption that the length scale set by the metric is much larger than the healing length, we solve the gap equation to find a slowly varying gap function that exhibits the effects of curvature. To rigorously address the ultraviolet divergences inherent in the gap equation, we utilize heat kernel expansion techniques, which provide a systematic and mathematically transparent renormalization scheme. We explicitly evaluate the renormalized gap equation at both zero and finite temperatures, computing the relevant integrals asymptotically in the weak-coupling limit ($\\Delta \\ll \\mu$). Furthermore, we establish a universal, regularization-independent relation connecting the finite-temperature gap to the zero-temperature gap and the temperature itself. Based on this fundamental relation, we analytically prove the monotonic decrease of the energy gap with increasing temperature ($\\partial \\Delta / \\partial T < 0$), successfully recovering the standard universal BCS behavior near the critical temperature within a curved space framework.", "url": "https://arxiv.org/abs/2609.14689", "type": "理论", "summary": "1. 该工作在三维黎曼流形上研究BCS超导，由路径积分经Hubbard-Stratonovich变换和鞍点近似导出能隙方程，并在度规尺度远大于愈合长度时求出含曲率效应的缓变能隙解。\n2. 其核心卖点是用热核展开系统重整化紫外发散，在弱耦合Δ≪μ下渐近计算零温与有限温重正化积分，并建立不依赖正则化的有限温能隙、零温能隙与温度的普适关系。\n3. 据此可解析证明能隙随温度单调下降（∂Δ/∂T<0），在弯曲空间重现临界温度附近的普适BCS行为，为曲率影响超导相变的研究提供了可推广的重整化思路。", "summary_source": "deepseek", "authors": [{"name": "Levent Akant"}, {"name": "Emine Ertugrul"}, {"name": "O. Teoman Turgut"}], "featured_authors": [{"name": "Levent Akant"}, {"name": "Emine Ertugrul"}, {"name": "O. Teoman Turgut"}], "author_count": 3}, {"id": "2609.15109", "category": "hep-th", "title": "Hyperbolic monopole-type solutions in $SU(3)$ Yang-Mills theory", "abstract": "We construct $S^1$-invariant solutions of the $SU(3)$ pure Yang-Mills theory on four-dimensional Euclidean space using the Cho-Faddeev-Niemi decomposition and a harmonic map from $S^2$ into the flag manifold $F_3=SU(3)/U(1)^2$. The resulting ansatz reduces the full Yang-Mills equations to coupled radial equations. Solving the coupled equations, we derive two types of solutions: analytic self-dual solutions interpreted as noninteracting clusters of hyperbolic monopoles and non-self-dual numerical solutions that can be interpreted as hyperbolic monopole-antimonopole bound states. In the large-mass limit of the hyperbolic monopole-antimonopole bound states, their normalized action approaches the energy of the corresponding non-Bogomolny $SU(3)$ monopole in flat space.", "url": "https://arxiv.org/abs/2609.15109", "type": "理论", "summary": "1. 该工作在四维欧氏SU(3)纯Yang-Mills理论中，基于Cho-Faddeev-Niemi分解与到F3的调和映射构造S^1不变解，并求解所得耦合径向方程。\n2. 其技术卖点是把完整Yang-Mills方程严格约化为耦合径向方程，得到解析自对偶双曲单极子团簇解与非自对偶数值单极子-反单极子束缚态解。\n3. 大质量极限下束缚态归一化作用量趋于平直空间非Bogomolny SU(3)单极子能量，提示双曲结构可联系平直单极子谱。", "summary_source": "deepseek", "authors": [{"name": "Yuki Amari"}], "featured_authors": [{"name": "Yuki Amari"}], "author_count": 1}, {"id": "2609.15237", "category": "hep-th", "title": "Quantum geometry of gravitons", "abstract": "We uncover the quantum geometric structure of graviton Wigner functions and stress-energy tensors via quantum field theory in curved spacetime, revealing the phase-space geometry of spacetime and relativistic quantum-state manifolds. We show that the polarization mode expansion of the underlying graviton field operator is fully captured by quantum geometry, as encoded in the spinor-helicity formalism, thereby establishing the geometric framework from the outset. Applying this to a weak gravitational background, we demonstrate the roles of the quantum metric and connection in describing graviton transport beyond the chiral vortical effect. We also clarify the role of the quantum metric in normalizing the perfect-fluid graviton stress tensor within this approach. This work paves the path for explorations of multistate Hilbert-space geometry in high-energy and gravitational physics. In addition, this framework naturally encompasses lower-spin excitations, allowing for a unified quantum geometric treatment of bosonic and fermionic many-body systems in condensed matter and particle physics.", "url": "https://arxiv.org/abs/2609.15237", "type": "理论", "summary": "1. 该工作基于弯曲时空量子场论揭示了引力子维格纳函数与能动张量的量子几何结构，并刻画时空相空间及相对论量子态流形的几何。\n2. 其关键创新在于用旋量-螺旋度形式完整捕捉引力子场算符的极化模展开，并在弱引力背景中阐明量子度规与联络对引力子输运的作用，超越手征涡旋效应，同时说明量子度规对理想流体引力子能动张量的归一化。\n3. 这一框架为高能与引力物理中的多态希尔伯特空间几何研究开辟道路，并可自然纳入低自旋激发，从而统一处理凝聚态与粒子物理中的玻色型和费米型多体系统。", "summary_source": "deepseek", "authors": [{"name": "M. Mehraeen"}], "featured_authors": [{"name": "M. Mehraeen"}], "author_count": 1}, {"id": "2609.15286", "category": "hep-th", "title": "Spectral Chaos from a Fluctuating Quantum Horizon", "abstract": "Black holes are conjectured to be maximally chaotic, with their quantum spectra expected to exhibit universal random-matrix correlations. This expectation, however, has so far rested largely on holographic descriptions or on many-body models in which randomness is introduced rather than derived from the microscopic degrees of freedom of the horizon itself. In the horizon matrix model, the fuzzy sphere supports highly degenerate parton states whose multiplicity accounts for the black-hole entropy. We show that quantum fluctuations of the horizon geometry lift this degeneracy and generate an ensemble of one-parton Hamiltonians. Both the operator structure and the rank-dependent covariance of this ensemble are determined by the microscopic model, rather than fixed by quenched couplings. Despite this structured covariance, the resulting spectra exhibit GOE, GUE, and GSE statistics dictated by their antiunitary symmetry classes, with the adjacent-gap statistic becoming increasingly self-averaging with matrix size. The model also realizes the universal Pandey--Mehta orthogonal-to-unitary crossover, with the crossover scale determined by the microscopic geometric covariance. A rank-resolved variance analysis shows that the fluctuation strength remains broadly distributed across tensor ranks up to the microscopic cutoff, providing a microscopic basis for the observed Wigner--Dyson universality and effectively nonlocal dynamics. The antiunitary symmetry acts directly on the fuzzy-sphere geometry, so the Dyson class of a conditional Hamiltonian is determined by the antiunitary symmetry of the underlying quantum geometry. This provides a microscopic counterpart of the Stanford--Witten relation between geometry and random-matrix universality in JT gravity. These results establish a microscopic route from quantum horizon geometry to black-hole spectral chaos.", "url": "https://arxiv.org/abs/2609.15286", "type": "理论", "summary": "1. 该工作在视界矩阵模型中以模糊球视界几何的量子涨落解除部分子简并，生成单部分子哈密顿量系综并考察其谱混沌。\n2. 其卖点在于算符结构与秩依赖协方差由微观几何涨落而非淬火耦合决定，谱仍呈反幺正对称类支配的GOE/GUE/GSE统计及Pandey-Mehta跨类。\n3. 这为Wigner-Dyson普适性提供微观基础，建立量子视界几何到黑洞谱混沌的微观路径，并对应JT引力的Stanford-Witten关系。", "summary_source": "deepseek", "authors": [{"name": "Chong-Sun Chu"}], "featured_authors": [{"name": "Chong-Sun Chu"}], "author_count": 1}, {"id": "2609.15316", "category": "hep-th", "title": "On the commuting charges and the Bethe ansatz for the quantised Kadomtsev-Petviashvili equation", "abstract": "We study the quantised version of the Kadomtsev-Petviashvili equation in the formulation proposed in [4]. We analyse two aspects. One is the conservation of the first higher charge $H_3$ (besides the total mass $H_0$, the momentum $H_1$ and the Hamiltonian $H_2$). We find the expression of $H_3$ and prove commutativity, provided we regularise a specific ultraviolet divergence. The result then does not depend on the choice of a regulator, under fairly general assumptions. We then study the Bethe ansatz in finite volume and obtain a general solution to the two-body problem. We have used AI supervised by us to aid the proofs.", "url": "https://arxiv.org/abs/2609.15316", "type": "理论", "summary": "1. 该工作研究文献[4]表述下的量子化KP方程，分析其对易守恒荷与有限体积Bethe ansatz。\n2. 其核心是构造H3并证明其与H0、H1、H2对易，需正则化特定紫外发散，且结果在一般假设下与正则化无关；并给出有限体积两体Bethe ansatz一般解。\n3. 这为量子KP可积结构的严格化及有限体积谱/多体Bethe ansatz研究提供了可推广的起点，并展示了人工智能辅助证明的可行性。", "summary_source": "deepseek", "authors": [{"name": "Chiara Paletta"}, {"name": "Alessandro Torrielli"}], "featured_authors": [{"name": "Chiara Paletta"}, {"name": "Alessandro Torrielli"}], "author_count": 2}, {"id": "2609.15512", "category": "hep-th", "title": "A fluid dual to large $D$ membrane paradigm at first subleading order", "abstract": "The large $D$ membrane paradigm establishes a duality between the dynamics of black holes and the evolution of a codimension-one timelike membrane in a non-gravitational background. In this work, we formulate the relativistic fluid dynamics dual to an uncharged black hole in asymptotically flat spacetime at the first subleading order in the $1/D$ expansion. Due to the absence of a timelike asymptotic boundary, unlike in AdS/CFT fluid-gravity duality, we construct an effective fluid intrinsically on the dynamical membrane, whose equations of motion are exactly equivalent to the subleading order membrane equations. By performing this fluid-dynamical analysis in the Landau frame, we show that the system behaves as a fluid influenced by an effective background force. Out-of-equilibrium viscous effects emerge naturally, allowing us to extract the fluid transport coefficients directly from the bulk viscous pressure and shear stress tensor. Furthermore, the fluid exhibits a negative pressure, capturing the intrinsic surface tension of the $(D-1)$-dimensional membrane worldvolume.", "url": "https://arxiv.org/abs/2609.15512", "type": "理论", "summary": "1. 该工作在1/D展开首个次领头阶，构建了渐近平直时空中无电荷黑洞对应的相对论流体动力学对偶。\n2. 其卖点是在无类时渐近边界时于动力学膜上内蕴构造有效流体，朗道标架下方程精确等价于次领头阶膜方程，粘滞效应自然出现。\n3. 该流体呈负压并对应膜的固有表面张力，提示可从体粘滞压强与剪切张量直接提取输运系数并拓展无边界流体/引力对偶。", "summary_source": "deepseek", "authors": [{"name": "Supratim Halder"}, {"name": "Manu Kurian"}, {"name": "Mangesh Mandlik"}], "featured_authors": [{"name": "Supratim Halder"}, {"name": "Manu Kurian"}, {"name": "Mangesh Mandlik"}], "author_count": 3}, {"id": "2609.15737", "category": "hep-th", "title": "Black holes and phase transitions in Conformal Gravity", "abstract": "We explore the thermodynamic properties of static black holes in conformal gravities in arbitrary, even dimensions. In the spherically symmetric case, up to local Weyl rescalings, these spacetimes are static and unique, due to a Birkhoff's theorem that applies for all conformal gravities whose Lagrangians are complete contractions of $k$ Weyl tensors in dimension $D=2k$. The solutions can be chosen to be asymptotically locally (A)dS or flat, and the horizon can be extended to be a surface of arbitrary constant curvature, $\\gamma$. We focus on the asymptotically AdS case, for which the cosmological constant at infinity is an integration constant, and compute the mass of the spacetime in terms of the diverse hair parameters which have a purely gravitational origin. We show that the first law of thermodynamics is satisfied, and study phase transitions in the canonical ensemble, showing the existence of zeroth-order black-hole/black-hole phase transitions for arbitrary dimension.", "url": "https://arxiv.org/abs/2609.15737", "type": "理论", "summary": "1. 该文研究任意偶数维共形引力中静态黑洞的热力学，借助Birkhoff定理给出球对称时空的唯一性并计算其质量。\n2. 卖点在于无穷远宇宙学常数为积分常数，质量由纯引力起源的hair参数表示，且首定律成立并存在任意维零阶黑洞相变。\n3. 这表明共形引力中黑洞相变结构不依赖于具体维度，为推广至更一般共形不变量引力理论提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Luis Guajardo"}, {"name": "Luis Gutiérrez Frez"}, {"name": "Seyed Naseh Sajadi"}, {"name": "Julio Oliva"}], "featured_authors": [{"name": "Luis Guajardo"}, {"name": "Luis Gutiérrez Frez"}, {"name": "Seyed Naseh Sajadi"}, {"name": "Julio Oliva"}], "author_count": 4}, {"id": "2609.15929", "category": "hep-th", "title": "String charge density/bit threads correspondence and its S-duality in type IIB supergravity", "abstract": "We identify the spatial projection of a conserved string charge density with a bit-thread flow. This correspondence gives bit threads a string worldsheet description and allows us to compute black hole entropy from the maximal entropy flux of a worldsheet-derived current. We first reproduce the BTZ entropy and then extend the construction to the ten-dimensional F1-NS5-P and D1-D5-P systems. Under Type IIB S-duality, the F1 current maps to the D1 current. Although the local currents, metrics, and flow norms change, the maximal physical flux remains unchanged and gives the same entropy. This provides a nontrivial check of the correspondence. Finally, we propose a D1-D5 boundary-matching conjecture. In the coarse-grained picture, each string-charge line defines an entropy-carrying tube. The boundary CFT entanglement entropy and the bulk black hole entropy both fix the product of the number of tubes and the maximum entropy carried by each tube. For a fixed tube discretization, they assign the same capacity to each tube. They therefore describe the same conserved maximal entropy flux, providing an information-flow interpretation of the equality between entanglement entropy and black hole entropy.", "url": "https://arxiv.org/abs/2609.15929", "type": "理论", "summary": "1. 该工作将守恒弦荷密度的空间投影与bit-thread流对应，赋予bit threads弦世界面描述，并利用世界面诱导流的最大熵通量计算黑洞熵，先在BTZ复现，再推广至十维F1-NS5-P和D1-D5-P系统。\n2. 其关键在于IIB S-对偶下F1流映射为D1流：虽局部流、度规和流范数改变，最大物理通量及对应熵不变，构成对该对应的非平凡检验，并据此提出D1-D5边界匹配猜想。\n3. 粗粒化图像中每条弦荷线定义携带熵的管，边界CFT纠缠熵与体黑洞熵共同固定管数与单管最大熵之积，且对固定离散化赋予相同容量，故二者描述同一守恒最大熵流，为纠缠熵与黑洞熵相等提供信息流解释。", "summary_source": "deepseek", "authors": [{"name": "Houwen Wu"}, {"name": "Shuxuan Ying"}], "featured_authors": [{"name": "Houwen Wu"}, {"name": "Shuxuan Ying"}], "author_count": 2}, {"id": "2609.15952", "category": "hep-th", "title": "Direct-to-Symbol Integration from Landau Analysis", "abstract": "We propose a Landau-analysis-inspired strategy for directly computing the symbol of integrals that evaluate to multiple polylogarithms in twisted cohomology. The central idea is to identify all ways in which singular hypersurfaces, twisted hypersurfaces, and integration boundaries can interact when external parameters are varied, giving rise to logarithmic or algebraic branch points. By tracking how an integral is modified when analytically continued around each of its branch points, we can recursively construct its symbol. We illustrate this approach by outlining an efficient algorithm for computing the symbol of finite integrals over twisted hyperplane arrangements, when they are expanded around special values of the twist parameter. This algorithm can be used to compute the (transcendental) integrands of cosmological correlators in conformally coupled theories to any order in the twist expansion.", "url": "https://arxiv.org/abs/2609.15952", "type": "理论", "summary": "1. 该工作提出一种受 Landau 分析启发的策略，用于直接计算扭曲上同调中可表示为多重多对数积分的 symbol。\n2. 其核心在于系统识别奇异超曲面、扭曲超曲面与积分边界在外部参数变动时的相互作用，追踪积分绕各分支点解析延拓的变化以递归构造 symbol，并给出扭曲超平面排列上有限积分在 twist 参数特殊值附近展开的高效算法。\n3. 该框架可将共形耦合理论中宇宙学关联子的超越被积函数计算至 twist 展开的任意阶，为绕过传统函数积分、直接从分支结构获取 symbol 提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Craig Larkin"}, {"name": "Andrew J. McLeod"}, {"name": "Andrzej Pokraka"}, {"name": "Lecheng Ren"}], "featured_authors": [{"name": "Craig Larkin"}, {"name": "Andrew J. McLeod"}, {"name": "Andrzej Pokraka"}, {"name": "Lecheng Ren"}], "author_count": 4}, {"id": "2609.13434", "category": "math-ph", "title": "Microscopic Parametric Correlations and Spectral Rigidity in the Non-Hermitian Threefold Way", "abstract": "We study microscopic spectral correlations between two nearby parameter values in the three non-Hermitian Gaussian bulk classes: $A$ (unconstrained), $AI^\\dagger$ (complex symmetric), and $AII^\\dagger$ (complex self-dual, with each degenerate doublet counted once). Parameter dependence is modelled by stationary matrix Ornstein--Uhlenbeck evolution, whose microscopic time scale is $N^{-1}$. For every positive integer replica number $n$, we derive exact finite-$N$ auxiliary-field integral representations for joint characteristic-polynomial moments and obtain their bulk asymptotics as $N\\to\\infty$ with $n$ fixed. With the spectrum normalized to the unit disk, correlations near a bulk point $z_0$, between spectral positions $z_1,z_2$ at times $t_1,t_2$, depend only on $s=N|z_1-z_2|^2+N(1-|z_0|^2)|t_1-t_2|$. Adopting the static Hermitian/non-Hermitian replica continuation yields explicit two-time kernels; for $AI^\\dagger$ and $AII^\\dagger$ these are replica conjectures and, to our knowledge, the first microscopic two-time kernels proposed for these classes. They determine density correlations, cross-time eigenvalue-count covariances, and equal-time number variances. For a disk of mean eigenvalue count $y$, the latter obey $\\mbox{Var}\\mathcal N_X(D_y)=\\kappa_X\\sqrt y+ \\beta_X/\\sqrt y+o(y^{-1/2})$, with explicitly given constants for each class. Exact perturbation theory further identifies eigenvector nonorthogonality as the mechanism of short-time spectral diffusion and yields a basis-independent condition number for a two-dimensional Kramers eigenspace in class $AII^\\dagger$. Direct simulations agree quantitatively with its conjectured inverse-gamma law.", "url": "https://arxiv.org/abs/2609.13434", "type": "理论", "summary": "1. 该文在非厄米高斯三重类A、AI†、AII†中研究近邻参数的微观谱关联，用平稳奥恩斯坦-乌伦贝克矩阵演化建模参数依赖。\n2. 技术卖点是导出任意正整数复制数n下联合特征多项式矩的精确有限N辅助场表示，并首次为AI†和AII†提出显式双时核，标度为s=N|Δz|²+N(1-|z0|²)|Δt|。\n3. 这为理解非厄米谱扩散中本征矢非正交性机制、AII†中二维Kramers空间条件数及逆伽马律模拟检验提供了微观框架。", "summary_source": "deepseek", "authors": [{"name": "Yan V Fyodorov"}], "featured_authors": [{"name": "Yan V Fyodorov"}], "author_count": 1}, {"id": "2609.14172", "category": "math-ph", "title": "Certified robustness of quantum spin textures under magnetic-field perturbations", "abstract": "How much can a magnetic field change before a quantum spin texture loses its skyrmion charge? We address this question by combining the geometry of local spin expectation values with spectral perturbation theory. For a triangulated spin-$s$ texture, we determine the smallest change in its local moments that makes the reconstructed topological charge ill-defined, allowing unequal error bounds and fixed boundary moments. This geometric threshold yields explicit bounds on magnetic-field perturbations that preserve the ground-state charge, with $1/N$ scaling when the gap and geometric margin have positive limits. We apply the bounds to finite spin-$1/2$ systems with exchange and Dzyaloshinskii--Moriya interactions. In a rigorously verified seven-spin example, the charge changes at a single certified field while the excitation gap and all local spin polarizations remain bounded away from zero; at such a crossing the geometric margin and the field certificate vanish linearly. The results provide quantitative certificates of texture stability and clarify the limitations of spectral-gap protection.", "url": "https://arxiv.org/abs/2609.14172", "type": "理论", "summary": "1. 该工作结合局域自旋期望值几何与谱微扰论，研究量子自旋织构拓扑荷在磁场扰动下的认证鲁棒性。\n2. 其为三角化自旋-s织构给出重构荷失去良定义的最小局域矩改变，并导出保基态荷的显式磁场界及1/N标度。\n3. 在严格验证的七自旋例子中，电荷在单个认证磁场处改变而能隙与局域极化仍非零，表明谱隙保护存在明确局限。", "summary_source": "deepseek", "authors": [{"name": "Raúl Sánchez Galán"}, {"name": "Robert Wieser"}], "featured_authors": [{"name": "Raúl Sánchez Galán"}, {"name": "Robert Wieser"}], "author_count": 2}, {"id": "2609.14209", "category": "math-ph", "title": "Pauli Supported Invariants for Periodic Graphs-Derived Hamiltonians", "abstract": "We introduce a graph invariant obtained from Pauli decompositions of Hamiltonians derived from local graph neighborhoods. Given a rooted h-hop neighborhood, we construct a local adjacency operator, embed it into a common Hilbert space dimension, and define its Pauli-support set as the collection of Pauli strings appearing with nonzero coefficients. For periodic graphs, we prove invariance under lattice-compatible graph equivalence and establish converse results under root-separation hypothesis. The framework naturally extends to Lie closures, commutants, and Cartan-type structures generated by the associated Pauli supports. We further discuss extensions to aperiodic graphs with finite local complexity and make connections to cut-and-project models of quasicrystals and notably, Penrose tilings. From a quantum information perspective, the resulting invariants provide a operator-theoretic description of graph-based Hamiltonians and offer a new mechanism for comparing graph-based quantum systems through Pauli-support data.", "url": "https://arxiv.org/abs/2609.14209", "type": "理论", "summary": "1. 该工作提出由局部图邻域导出的哈密顿量的泡利分解所定义的图不变量：对根节点有限跳数邻域构造局部邻接算符，嵌入统一维度的希尔伯特空间，并以非零系数出现的泡利串集合为泡利支撑集。\n2. 其卖点在于证明周期图下该不变量在格点相容图等价下不变，并在根分离假设下得到逆定理，且可推广至泡利支撑生成的李闭包、交换子与嘉当型结构。\n3. 这为有限局部复杂度的非周期图及切割投影模型、彭罗斯镶嵌等准晶体系提供了算子论描述，并给出通过泡利支撑数据比较图量子系统的新机制。", "summary_source": "deepseek", "authors": [{"name": "Sarah Chehade"}, {"name": "Andrew Vlasic"}, {"name": "Rebekah Herrman"}, {"name": "Rick Mukherjee"}], "featured_authors": [{"name": "Sarah Chehade"}, {"name": "Andrew Vlasic"}, {"name": "Rebekah Herrman"}, {"name": "Rick Mukherjee"}], "author_count": 4}, {"id": "2609.14242", "category": "math-ph", "title": "Liouville integrability of Beltrami-Maxwell fields with sources: A geometric theory of magnetic surfaces", "abstract": "We study classical Maxwell fields with non-trivial sources in four-dimensional Minkowski spacetime. In particular, contact and symplectic geometric aspects are discussed. As a point of departure, it is shown that a few classes of solutions with sources are constructed from the so-called Beltrami fields, where these fields are contact forms on three-dimensional Riemannian manifolds. In addition, several applications in these classes are provided. One is to give a solution to the London equations for superconductors. Another one is that, if there is a non-trivial conserved quantity along the magnetic vector field, then the Maxwell system can be viewed as a Liouville integrable Hamiltonian system on a four-dimensional symplectic manifold, where this manifold is obtained by a symplectization of the contact manifold. As examples, Maxwell fields with the Lundquist model, a restricted case of the ABC flow model, and so on, are shown to be integrable in the above sense.", "url": "https://arxiv.org/abs/2609.14242", "type": "理论", "summary": "1. 该工作从接触与辛几何视角研究四维Minkowski时空中带源的经典Maxwell场，并借助Beltrami场构造若干带源解类。\n2. 关键在于：沿磁场存在非平凡守恒量时，Maxwell系统在接触流形辛化所得的四维辛流形上成为Liouville可积Hamilton系统。\n3. Lundquist模型与受限ABC流等实例均被证明可积，并可给出超导London方程的解，为磁面的几何理论提供启示。", "summary_source": "deepseek", "authors": [{"name": "Shin-itiro Goto"}], "featured_authors": [{"name": "Shin-itiro Goto"}], "author_count": 1}, {"id": "2609.14949", "category": "math-ph", "title": "Boundary transmission and excursion geometry in the Lorentz mirror model: a numerical study", "abstract": "We study boundary transmission and excursion geometry in the planar Lorentz mirror model through finite-volume numerical experiments. Cylinder penetration quantiles grow approximately linearly with circumference over the simulated range, with a systematic upward drift in the normalized quantiles when vacancies are present. Estimated slab-transmission probabilities yield exponential confinement bounds with quantified statistical confidence at the tested widths. Planar excursions conditioned to reach a distant boundary exhibit transverse ranges proportional to the exit radius, while their repeated-visit fractions vary strongly with mirror density. Endpoint-label collision probabilities substantially exceed a general gluing lower bound, although they account for only part of the observed same-column crossing probability. Finally, rerouting at repeated vertices preserves the exit while substantially shortening the sampled paths. These findings characterize finite-volume transport and excursion geometry without determining an asymptotic scaling exponent or resolving infinite-plane localization.", "url": "https://arxiv.org/abs/2609.14949", "type": "理论", "summary": "1. 该工作用有限体积数值实验研究平面洛伦兹镜模型的边界透射与逸出几何。\n2. 其卖点在于通过有限体积统计量化穿透分位数线性增长、透射指数约束及端点标签碰撞超过粘合下界。\n3. 这些结果刻画有限体积输运与逸出几何，但未确定渐近标度指数，亦未解决无限平面局域化。", "summary_source": "deepseek", "authors": [{"name": "Jian Gu"}, {"name": "Qin Hao"}], "featured_authors": [{"name": "Jian Gu"}, {"name": "Qin Hao"}], "author_count": 2}, {"id": "2609.15812", "category": "math-ph", "title": "The Robust Ten Martini Problem", "abstract": "We solve the robust ten martini problem: Cantor spectrum with no arithmetic restriction on the irrational frequency for Type I analytic one-frequency quasiperiodic Schrodinger operators. We introduce Type I through a new acceleration-type quantity with stability under analytic perturbations. This yields a global open class of analytic potentials whose associated operators have Cantor spectrum for every irrational frequency.", "url": "https://arxiv.org/abs/2609.15812", "type": "理论", "summary": "1. 该工作解决了稳健版十杯马提尼问题，证明I型解析单频准周期薛定谔算子对任意无理频率均具有康托谱，且频率无需满足任何算术限制。\n2. 其技术核心是引入一种在解析扰动下稳定的新加速型量来刻画I型算子，从而构造出一个全局开的解析势类，使上述谱结论不依赖微扰或频率的算术性质。\n3. 该结果将康托谱的稳健性提升为开类性质，为研究无算术限制的准周期算子谱理论提供了新工具，并启示后续可推广至其他解析势类与谱分形问题。", "summary_source": "deepseek", "authors": [{"name": "Lingrui Ge"}, {"name": "Svetlana Jitomirskaya"}, {"name": "Jiangong You"}], "featured_authors": [{"name": "Lingrui Ge"}, {"name": "Svetlana Jitomirskaya"}, {"name": "Jiangong You"}], "author_count": 3}, {"id": "2609.15908", "category": "math-ph", "title": "Sharp decay thresholds for eigenvalues of discrete Schrödinger operators on $\\mathbb{Z}^2$", "abstract": "We study eigenvalues of discrete Schrödinger operators $H=\\Delta+V$ on $\\mathbb{Z}^2$, where $\\Delta$ is the uncentered Laplacian, i.e., the un-normalized adjacency operator of $\\mathbb{Z}^2$ and $V$ decays at infinity. By Weyl's theorem, the essential spectrum of $H$ is $[-4,4]$. We determine the sharp decay thresholds for existence of eigenvalues in three distinct spectral regimes. While it is natural to expect different behavior at the spectral edge $\\lambda=\\pm4$, and the bulk, there is a further distinction between the regular energies $0<|\\lambda|<4$ and the interior critical energy $\\lambda=0$ stemming from the reducibility of the corresponding Fermi surface in the latter case. For every $0<|\\lambda|<4$, we construct potentials $V$ satisfying $|V(n)|\\leq C|n|^{-1}$ for which $\\lambda$ is an eigenvalue of $\\Delta+V$, and prove absence of eigenvalues when $|V(n)|\\leq C|n|^{-1-\\varepsilon}$ for some $\\varepsilon>0$. At $\\lambda=0$, the critical power changes and we construct potentials $V$ satisfying $|V(n)|\\leq C|n| ^{-2}$ for which $0$ is an eigenvalue of $\\Delta+V$, as well as prove absence when $|V(n)|\\leq C|n|^{-2-\\varepsilon}$ for any $\\varepsilon>0$. Finally, at each spectral edge, we show that, for every $K\\geq3$, an eigenvalue can be created by potentials supported on exactly $K$ sites, whereas a potential supported on at most two sites cannot create an edge eigenvalue. The proofs combine Green-function expansions and moment cancellation, Hilbert-space-valued iterations, discrete Carleman estimates, and a uniform Green-kernel estimate.", "url": "https://arxiv.org/abs/2609.15908", "type": "理论", "summary": "1. 该工作确定了Z^2上离散薛定谔算子Δ+V在谱边、正则能量0<|λ|<4及内临界λ=0三类区域的尖锐特征值衰减阈值。\n2. 其卖点在于揭示λ=0因费米面可约化而使临界幂次从|n|^{-1}变为|n|^{-2}，并融合Green函数展开、矩抵消与离散Carleman估计。\n3. 谱边处恰K≥3个支撑位点的势可造特征值，而≤2个不能；这为离散临界谱问题提供明确基准。", "summary_source": "deepseek", "authors": [{"name": "Shirshendu Ganguly"}, {"name": "Wencai Liu"}], "featured_authors": [{"name": "Shirshendu Ganguly"}, {"name": "Wencai Liu"}], "author_count": 2}, {"id": "2609.13312", "category": "quant-ph", "title": "Physical Counterexamples to the Wigner Shannon Entropy Conjecture", "abstract": "We construct physical quantum states with everywhere positive Wigner functions whose Shannon entropy lies below the vacuum value $1+\\ln\\pi$. Besides an explicit finite-energy counterexample, we obtain rank-two finite-Fock-support families with analytic positivity and entropy bounds. For fixed Fock level $n$ and coherence fraction $0\\le\\lambda<1$, the entropy difference satisfies $h(W)-(1+\\ln\\pi)=(2n-2^n\\lambda^2)t^2+O_{n,\\lambda}(t^4)$, yielding finite-support counterexamples for every $n\\ge3$ above an explicit coherence threshold. We also show that the absence of a negative quadratic term does not preclude entropy descent: a fully coherent vacuum--one-photon core with a vanishing positive thermal repair gives $h(W)-(1+\\ln\\pi)=-4t^6/3+o(t^6)$. For the vacuum--three-photon construction, we determine the logarithmic asymptotic of the minimum fixed-thermal mixing weight required for Wigner nonnegativity. Finally, optimizing over all one-mode Wigner-nonnegative states with mean photon number at most $E$, we prove that the maximal entropy deficit has the sharp scale $E^\\gamma/[\\ln(1/E)]^\\beta$, where $\\gamma\\simeq0.7412033679$ and $\\beta\\simeq0.5861054961$. Thus the vacuum entropy is recovered as $E\\to0$, but the optimal deficit decays much more slowly than any universal linear correction in the mean energy.", "url": "https://arxiv.org/abs/2609.13312", "type": "理论+数值", "summary": "1. 该工作为Wigner Shannon熵猜想构造了Wigner函数处处为正、熵低于真空值1+lnπ的物理量子态及有限能量反例。\n2. 其核心是显式Fock支撑与真空-光子构造、熵差微扰展开，以及最大熵亏损按E^γ/[ln(1/E)]^β尖锐衰减。\n3. 这表明该猜想不成立；平均光子数E→0时真空熵虽恢复，但最优亏损远慢于任何普适线性修正。", "summary_source": "deepseek", "authors": [{"name": "Zixuan He"}], "featured_authors": [{"name": "Zixuan He"}], "author_count": 1}, {"id": "2609.13360", "category": "quant-ph", "title": "Structured Quantum Kernels for Chaotic Forecasting", "abstract": "Quantum kernels promise exponentially large feature spaces, but expressive circuits render their Gram matrices uninformative, bandwidth tuning collapses them toward classical RBF, and the practical consensus is that quantum kernels add nothing on classical data. We answer another productive question, an architectural one: whether the structure of an encoding circuit can carry an inductive bias that tuned classical kernels lack. We introduce AeRot, a quantum kernel fusing amplitude encoding of l2-normalized delay windows with a grouped single-qubit rotation layer that assigns contiguous temporal blocks to each qubit, making the circuit delay-window-aware. On Lorenz-63 kernel ridge regression with cross-validated bandwidths over 100 seeds, AeRot outperforms tuned RBF and Matern-5/2, the advantage emerging at physical horizons >= 0.15 tu and reaching +0.137 mean R^2 at 0.25 tu (5 qubits, window 32). Linear-stability analysis of the window tail localises the advantage to the unstable saddle-approach regime: AeRot wins 83% of windows in the most unstable decile, with the win rate rising monotonically with tail instability and a sign flip at the local stability boundary. The difficulty is fold-branch ambiguity: trajectories approaching the saddle are locally diverging, and Euclidean kernels struggle to resolve which lobe the trajectory will commit to. Structural diagnostics confirm Gram matrices structurally distinct from tuned RBF, with strictly higher target-kernel alignment at every horizon. The gain is architectural: a finite-sample inductive-bias effect of temporally structured encoding on a folded attractor, with no computational-separation claim attached. To our knowledge this is the first mechanistic localisation of quantum-kernel advantage to a specific dynamical regime of a classical system.", "url": "https://arxiv.org/abs/2609.13360", "type": "理论", "summary": "1. 该工作围绕《Structured Quantum Kernels for Chaotic Forecasting》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Zhihui Wang"}, {"name": "Sujit Roy"}, {"name": "Ata Akbari"}, {"name": "Manil Maskey"}, {"name": "Rahul Ramachandran"}], "featured_authors": [{"name": "Zhihui Wang"}, {"name": "Sujit Roy"}, {"name": "Ata Akbari"}, {"name": "Manil Maskey"}, {"name": "Rahul Ramachandran"}], "author_count": 5}, {"id": "2609.13371", "category": "quant-ph", "title": "Moment-Selective Quantum Designs in Aperiodic Temporal Ensembles", "abstract": "We introduce a general mechanism for engineering moment-selective temporal designs with hierarchically structured aperiodic drives. At special control settings where the driven dynamics is constrained by a finite symmetry group, lower-order moments can already reproduce Haar statistics while a selected higher-order deviation remains nonzero. A small static detuning from such a setting generically produces an exponentially long lifetime whose exponent scales inversely with the square of the detuning. We illustrate this mechanism in qubit systems through exact Fibonacci and silver-mean constructions with tetrahedral and icosahedral resonances, for which the first retained non-Haar moments occur at orders $3$ and $6$, respectively. We further show that stochastic control fluctuations produce a qualitatively different cutoff from coherent detuning. Finally, we propose a finite-time signature of the long-lived moment that can be measured without requiring observations over exponentially long times.", "url": "https://arxiv.org/abs/2609.13371", "type": "理论", "summary": "1. 该工作提出用分层非周期驱动构造矩选择时间量子设计的通用机制，并在量子比特系统中以精确斐波那契与银均值构造及四面体、二十面体共振演示，首个保留非Haar矩分别出现在3阶和6阶。\n2. 其核心是：驱动受有限对称群约束时，低阶矩已具Haar统计而选定高阶矩非零；小静态失谐使该矩指数长寿命且寿命指数按失谐平方反比，随机控制涨落给出不同截止。\n3. 作者进一步提出无需指数长时间观测的有限时间矩签名，为在相干失谐与随机噪声下检验并利用高阶非Haar时间随机性提供实验路径。", "summary_source": "deepseek", "authors": [{"name": "Yang Peng"}], "featured_authors": [{"name": "Yang Peng"}], "author_count": 1}, {"id": "2609.13388", "category": "quant-ph", "title": "CUDA-Q Logical: Retargetable Compilation for Fault-Tolerant Quantum Computing", "abstract": "Realizing fault-tolerant quantum computing requires mapping logical programs to heterogeneous quantum error correction (QEC) codes and diverse fault-tolerant execution models, scheduling physical resources, and coupling to real-time classical control and feedback. Specialized tools exist for each step but rely on manual composition and translation that discard assumptions and provenance, separating resource estimates from the compiler artifacts they describe, and making it difficult to validate correctness, compare architectures, or attribute costs to specific design choices. We present CUDA-Q Logical, an extensible compiler infrastructure for retargetable fault-tolerant compilation, analysis, and execution. Interoperable with CUDA-Q and other mainstream front-ends, CUDA-Q Logical progressively lowers target-independent logical programs through a constrained logical virtual machine, QEC microcode, physical gate schedules, and real-time control plans, with each layer preserving semantics and provenance, while verifying composition and resource constraints. By deriving every resource estimate directly from compiler artifacts, the framework unifies compilation and resource analysis, enabling successively refined estimates and principled cross-architecture comparison while permitting QEC codes, execution models, decoders, and hardware architectures to be introduced as modular extensions. Across workloads ranging from application-architecture studies to qLDPC surgery and detector-error-model composition, we show that schedule-derived estimates reconcile with established independent models. Crucially, this compiler-visible structure exposes cost drivers hidden by aggregate analytical formulas, carries QEC artifacts intact into simulation, and demonstrates a complete compilation pipeline for fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2609.13388", "type": "理论+数值", "summary": "1. 该工作提出并实现了CUDA-Q Logical，一个面向容错量子计算的可重定向编译、分析与执行基础设施，可将目标无关的逻辑程序逐步降低为逻辑虚拟机、QEC微码、物理门调度及实时控制计划。\n2. 其核心卖点在于各层均保留语义与来源信息，资源估计直接由编译产物导出，从而统一编译与资源分析、支持跨架构比较，并允许QEC码、执行模型、解码器和硬件架构以模块化扩展形式接入。\n3. 该框架能暴露被聚合解析公式掩盖的成本驱动因素，将QEC产物完整带入模拟，并给出可验证的端到端容错编译流水线，为后续架构权衡与资源分析提供启发。", "summary_source": "deepseek", "authors": [{"name": "Alexander McCaskey"}, {"name": "Justin Lietz"}, {"name": "Adam Holmes"}, {"name": "Kohei Nakaji"}, {"name": "Vadym Kliuchnikov"}, {"name": "Yifan Hong"}, {"name": "Amalee Wilson"}, {"name": "Andres Paz"}, {"name": "Bettina Heim"}, {"name": "Bruno Schmitt"}, {"name": "Krysta M. Svore"}], "featured_authors": [{"name": "Alexander McCaskey"}, {"name": "Justin Lietz"}, {"name": "Adam Holmes"}, {"name": "Bettina Heim"}, {"name": "Bruno Schmitt"}, {"name": "Krysta M. Svore"}], "author_count": 11}, {"id": "2609.13392", "category": "quant-ph", "title": "Orientation-dependent Pauli noise in one-dimensional discrete-time quantum walks", "abstract": "Discrete-time quantum walks exhibit ballistic spreading that is highly sensitive to decoherence. We study the long-time dynamics of a one-dimensional discrete-time quantum walk under Pauli noise acting on the coin. Choosing the unitary coin such that its invariant Bloch-sphere axis is orthogonal to the axis fixed by the conditional shift, we identify the distinct effects of noise aligned with either dynamical axis or orthogonal to both. Using a Fourier-space Pauli-superoperator formalism, we derive expressions for the first two position moments and long-time asymptotics for X-, Y-, Z-, and depolarizing noise. All channels induce a crossover from ballistic to diffusive spreading, with a second moment growing linearly at long times. The approach to this regime is channel dependent: it is exponentially fast for X-, Z-, and depolarizing noise, but algebraic, with a leading $t^{-1/2}$ correction, for Y-noise. The position distributions retain distinct finite-noise signatures, including a Gaussian-like profile with a central depression for Y-noise. In the maximal-noise limit, depolarizing, Y-, and Z-noise yield the classical binomial distribution for arbitrary initial coin states, whereas X-noise does so only when the initial state has no component along the noise axis. Thus, the quantum-to-classical transition is governed by the relative alignment of the noise, the coherent walk dynamics, and the initial state.", "url": "https://arxiv.org/abs/2609.13392", "type": "理论", "summary": "1. 该工作研究一维离散时间量子行走中作用于硬币的泡利噪声，选取不变布洛赫轴与条件平移固定轴正交的硬币幺正，并用傅里叶空间泡利超算符形式推导位置前两阶矩及长时渐近。\n2. 其卖点在于区分噪声与两个动力学轴的取向：X、Z和退极化噪声下趋于扩散是指数快，而Y噪声为代数趋近并带主导t^{-1/2}修正，且Y噪声位置分布呈中心凹陷的高斯型轮廓。\n3. 在最大噪声极限下，退极化、Y和Z噪声对任意初始硬币态给出经典二项分布，而X噪声仅当初始态无噪声轴分量时如此，说明量子到经典转变由噪声、相干行走与初始态的取向对齐共同决定。", "summary_source": "deepseek", "authors": [{"name": "Alejandro Contreras Reynoso"}, {"name": "Adrian Ortega"}, {"name": "Thomas Gorin"}], "featured_authors": [{"name": "Alejandro Contreras Reynoso"}, {"name": "Adrian Ortega"}, {"name": "Thomas Gorin"}], "author_count": 3}, {"id": "2609.13456", "category": "quant-ph", "title": "Reusable selected-time channels for quantum simulation of non-Markovian dynamics", "abstract": "Non-Markovian quantum-state diffusion (QSD) provides a microscopic trajectory description of open-system dynamics, but trajectories associated with a chosen initial state are not directly reusable as quantum channels. We develop a constructive framework that converts the QSD propagator into an input-independent Kraus channel for a fixed bath preparation and a selected evolution time. The construction incorporates reservoir memory through a finite-mode approximation of the bath covariance and yields a deterministic channel representation that can be compressed for approximate implementation with a system-ancilla circuit. For the qubit systems considered here, the construction closes exactly in vacuum and extends systematically to finite temperatures. Two-qubit examples with structured reservoirs validate the vacuum channel construction, illustrate its finite-temperature extension for a chosen initial state, and show that the complexity of the reservoir description can differ substantially from the ancilla space required for quantum realization. The framework therefore establishes a direct bridge from microscopic reservoir memory to reusable non-Markovian quantum simulation and provides a foundation for optimized hardware implementations and extensions to larger systems and multitime dynamics.", "url": "https://arxiv.org/abs/2609.13456", "type": "理论+数值", "summary": "1. 该工作将非马尔可夫量子态扩散传播子转化为固定浴制备和选定演化时间下与输入无关的克劳斯信道，使原本依赖初态的轨迹可复用为量子信道。\n2. 其技术核心是用有限模式近似编码浴协方差中的记忆，并给出可压缩的确定性信道表示，从而能在系统-辅助比特电路中近似实现，且在真空精确闭合、可系统推广至有限温度。\n3. 双比特结构储库算例验证了真空构造并展示有限温度扩展，表明储库描述的复杂度可与量子实现所需辅助空间显著不同，为优化硬件及推广至更大系统和多时刻动力学奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Yusui Chen"}], "featured_authors": [{"name": "Yusui Chen"}], "author_count": 1}, {"id": "2609.13496", "category": "quant-ph", "title": "Reservoir Support Sets the Minimum Loss for Non-Hermitian Dynamics", "abstract": "The minimum loss required to reproduce non-Hermitian dynamics depends on how many physical modes each reservoir can address coherently. Established positive-matrix criteria bound this cost. We construct a phase-controlled cubic-root Su-Schrieffer-Heeger chain in which three-mode reservoirs attain the unrestricted passivity threshold throughout its phase diagram and halve the minimum pair-supported loss at a tuned point. The bound constrains exact conditional trajectories, including time-dependent Marko
