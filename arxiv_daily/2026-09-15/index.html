<head>

  <title>arXiv 2026-09-15 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2609.13256", "category": "cond-mat", "title": "Localization Landscapes as Operator-Induced Geometry for Heterogeneous Systems", "abstract": "Heterogeneous operators often organize response through hidden barriers, wells, and weakly communicating compartments that are not faithfully described by Euclidean distance or raw graph connectivity alone. We study this structure through the localization landscape, obtained from a single source solve, and the associated effective potential $W_{\\mathrm{eff}} = 1/u$. Starting from both discrete Schrödinger-type operators and heterogeneous reaction-diffusion operators, we show how $W_{\\mathrm{eff}}$ induces effective wells, basin partitions, and Agmon-type neighborhoods that serve as an operator-aware geometry for localization and transport. This geometry explains the spatial support of low-energy eigenmodes, produces adaptive receptive fields on a fixed graph, sharpens locality in attention-like interactions, and yields bottleneck-sensitive modulation of diffusion. We also include a finite-element reaction-diffusion example with strongly compartmentalized coefficients, demonstrating that the same framework extends beyond simple grid operators to heterogeneous continuum systems. The results support a precise conclusion: localization-landscape geometry is a strong inductive bias when relevance is controlled by confinement, barriers, and low-energy accessibility, but its benefits are task-dependent rather than universal.", "url": "https://arxiv.org/abs/2609.13256", "type": "理论", "summary": "1. 该工作将局域化景观视为异质算子诱导的几何，从离散薛定谔型与异质反应扩散算子出发，通过单次源求解构造有效势 W_eff=1/u，并考察其有效势阱、盆地划分与 Agmon 型邻域。\n2. 其核心卖点在于该几何能刻画低能本征模的空间支撑，在固定图上产生自适应感受野，锐化注意力式相互作用的局域性，并给出对瓶颈敏感的扩散调制，且可推广至强分区系数的有限元反应扩散连续系统。\n3. 这支持一个明确结论：当相关性由束缚、势垒和低能可达性控制时，局域化景观几何是强归纳偏置，但其收益依赖任务而非普适。", "summary_source": "deepseek", "authors": [{"name": "Josué García-Ávila"}], "featured_authors": [{"name": "Josué García-Ávila"}], "author_count": 1}, {"id": "2609.13273", "category": "cond-mat", "title": "A thermomechanical framework for strongly nonlocal continua", "abstract": "The paper presents a consistent thermomechanical framework for strongly nonlocal continua, a type of generalized media in which a material's response at a point depends on deformation and temperature gradients within its neighborhood. Such dependence is responsible for localization phenomena having an intrinsic size, and nonlocal modeling also serves as a practical regularization tool to prevent mesh dependence. Nonlocality is of the integral type, using a kernel function that gives the relative influence of neighboring points on a central point. The paper develops three sources of nonlocality: (1) nonlocal momentum balance equations; (2) nonlocal conservation laws (including the first and second laws of thermodynamics); and (3) a material's nonlocal constitutive structure. Balance equations are derived using the principle of virtual power, permitting non-smooth force and displacement fields and non-smooth boundary surfaces with indistinct normal directions. The balance equations differ from those of classical local continua. Conservation laws also differ from those of local continua, with the mechanical power and heating at a point being averaged over its neighborhood. These laws are developed for processes that are sufficiently slow to minimize additional meso-scale kinetic energy due to internal turbulence. Stress, entropy, and dissipative forces are obtained as averaged derivatives of the free energy function with respect to strain, temperature, and internal variables. An example is presented of a stretched elastoplastic bar with a small defect, and nonlocality is shown to impart a characteristic size to the deformation pattern.", "url": "https://arxiv.org/abs/2609.13273", "type": "理论", "summary": "1. 该文为强非局部连续介质建立了一个自洽的热力学框架，其中点响应依赖邻域内变形与温度梯度。\n2. 其卖点在于用虚功率原理导出非局部动量平衡与热力学守恒律，并以自由能对应变、温度和内变量的平均导数给出应力、熵与耗散力。\n3. 拉伸弹塑性杆小缺陷算例显示非局部性给变形图案引入特征尺寸，为尺寸效应建模和网格依赖正则化提供依据。", "summary_source": "deepseek", "authors": [{"name": "Matthew R. Kuhn"}], "featured_authors": [{"name": "Matthew R. Kuhn"}], "author_count": 1}, {"id": "2609.13378", "category": "cond-mat", "title": "The price of locality: Maxwell-Cattaneo charge transport in Schwinger-Keldysh effective field theory", "abstract": "We determine the conditions under which the nonlinear Maxwell-Cattaneo theory of charge transport admits a local Gaussian Schwinger-Keldysh embedding with a particular modified dynamical KMS symmetry. We show that treating the additional vector as intrinsically dissipative fundamentally modifies the entropy-current analysis: the hydrostatic generating functional no longer fixes all entropy-current improvements, which must instead be supplied independently. Subsequently we discuss the additional constraints not contained in the hydrodynamic analysis that are imposed by the modified KMS transformation becoming a symmetry of the action. We both interpret and supply the corresponding stochastic quasi-hydrodynamics.", "url": "https://arxiv.org/abs/2609.13378", "type": "理论", "summary": "1. 该工作确定非线性 Maxwell-Cattaneo 电荷输运在何种条件下可嵌入具修正动力学 KMS 对称性的局域高斯 Schwinger-Keldysh 有效场论。\n2. 关键在于把附加矢量视为内禀耗散会改变熵流分析，使静流体生成泛函不再固定全部熵流改进项，并须由修正 KMS 对称性补充约束。\n3. 这为构建相应随机准流体力学提供基础，并表明局域嵌入的代价是熵流改进需独立指定且受超出常规流体的约束。", "summary_source": "deepseek", "authors": [{"name": "Andrea Amoretti"}, {"name": "Matteo Anselmi"}, {"name": "Daniel K. Brattan"}], "featured_authors": [{"name": "Andrea Amoretti"}, {"name": "Matteo Anselmi"}, {"name": "Daniel K. Brattan"}], "author_count": 3}, {"id": "2609.13387", "category": "cond-mat", "title": "Quantum Stochastic Walks on the Permutation Group", "abstract": "How rapidly does order give way to randomness, and can quantum coherence accelerate this process? We address these questions through the paradigmatic problem of card shuffling, formulated as a random walk on the symmetric group $S_n$. We first recast the random-transposition walk studied by Diaconis and Shahshahani, as well as more general walks generated by conjugacy classes of $S_n$, in continuous time. We then identify the transition matrix of each classical walk with a permutation Hamiltonian generating a corresponding unitary quantum walk. Purely unitary evolution, however, does not generically converge to the uniform distribution in the classical sense of mixing: coherence preserves information rather than erasing it. We therefore embed the problem into a quantum stochastic walk, where coherent dynamics competes with the dissipative process responsible for classical mixing. In this setting, quantum coherence assists randomization. We prove that it can only decrease the distance from the uniform distribution in the computational basis and can therefore accelerate mixing. An analysis of the slowest mode yields a criterion for the coupling strength required to produce an appreciable speedup. Finally, numerical results reveal a scaling collapse of the ratio between quantum and classical mixing times onto a simple one-parameter form. Our results illustrate how coherence and dissipation can cooperate in the emergence of randomness in walks on permutation groups.", "url": "https://arxiv.org/abs/2609.13387", "type": "理论+数值", "summary": "1. 该工作将对称群上的随机对换洗牌及由共轭类生成的一般游走改写为连续时间过程，并把经典转移矩阵对应为置换哈密顿量生成的幺正量子游走。\n2. 鉴于纯幺正演化因保持相干而不抹除信息、无法经典收敛，作者引入相干与耗散竞争的量子随机游走，证明在计算基下相干只能缩短到均匀分布的距离并加速混合，且由最慢模式给出显著加速所需耦合强度的判据。\n3. 数值结果显示量子与经典混合时间之比可坍缩为单参数标度形式，说明相干与耗散能协同促成置换群游走中随机性的出现，并为后续量子混合加速研究提供可检验的定量启示。", "summary_source": "deepseek", "authors": [{"name": "Feng He"}, {"name": "Arthur Hutsalyuk"}, {"name": "Giuseppe Mussardo"}, {"name": "Andrea Stampiggi"}], "featured_authors": [{"name": "Feng He"}, {"name": "Arthur Hutsalyuk"}, {"name": "Giuseppe Mussardo"}, {"name": "Andrea Stampiggi"}], "author_count": 4}, {"id": "2609.13391", "category": "cond-mat", "title": "Effective theory of the hidden-order pseudogap phase in a doped antiferromagnet", "abstract": "The microscopic origin of the pseudogap phase constitutes a longstanding puzzle related to the emergence of high-temperature superconductivity in cuprate materials. In this work, we develop an effective model for doped antiferromagnets in terms of fluctuating stripes, or string-like domain walls, which obscure the antiferromagnetic order of the spin background. The open ends of such domain walls of the N'eel order are treated as vortices in the resulting lattice gauge theory. We numerically evaluate the phase diagram by classical Monte Carlo simulations, using percolation-based geometric order parameters to diagnose hidden N'eel order. At high temperatures, we identify a BKT-type crossover in which the domain wall ends become deconfined. We interpret this as the $T^*$ crossover from the hidden order regime to the paramagnetic metal above. At low temperatures, we identify stripe instabilities. Predictions of our effective model can be tested in ultracold fermion quantum simulators.", "url": "https://arxiv.org/abs/2609.13391", "type": "理论+数值", "summary": "1. 该工作针对掺杂反铁磁体构建了一个以涨落条纹或弦状畴壁为自由度的有效模型，并将奈尔序畴壁开放端点映射为格点规范理论中的涡旋。\n2. 其核心在于用经典蒙特卡洛结合基于渗流的几何序参量诊断隐藏奈尔序，揭示高温下畴壁端点退禁闭的BKT型渡越并对应隐藏序区到顺磁金属的T*转变，低温则出现条纹不稳定性。\n3. 该框架为铜氧化物赝能隙相微观起源提供了可检验图像，并可在超冷费米子量子模拟器中验证相关预言。", "summary_source": "deepseek", "authors": [{"name": "Gaia De Paciani"}, {"name": "Gesa Dünnweber"}, {"name": "Johannes Poersch"}, {"name": "Simon M. Linsel"}, {"name": "Henning Schlömer"}, {"name": "Fabian Grusdt"}], "featured_authors": [{"name": "Gaia De Paciani"}, {"name": "Gesa Dünnweber"}, {"name": "Johannes Poersch"}, {"name": "Simon M. Linsel"}, {"name": "Henning Schlömer"}, {"name": "Fabian Grusdt"}], "author_count": 6}, {"id": "2609.13399", "category": "cond-mat", "title": "Superconducting Diode Effect in Josephson $φ_0$ Junction", "abstract": "We investigate the superconducting diode effect in a Josephson junction with a ferromagnetic weak link in the presence of Rashba spin-orbit coupling. While the standard $\\varphi_0$ junction model is valid only for weak exchange fields $h \\lesssim T_c$, realistic ferromagnetic barriers typically operate in the regime $h \\gg T_c$, where the conventional Ginzburg-Landau gradient expansion becomes insufficient and requires the inclusion of higher order gradient terms to ensure stability of the free energy. By extending the free energy with such higher order term, we demonstrate that the linear gradient coupling alone leads to finite momentum Cooper pairing while leaving the critical current symmetry unchanged. The interplay between this linear term and the higher order gradient one leads to the Josephson diode effect.", "url": "https://arxiv.org/abs/2609.13399", "type": "理论", "summary": "1. 该工作研究了含拉什巴自旋轨道耦合与铁磁弱连接的约瑟夫森结中的超导二极管效应，并针对真实铁磁势垒常见的h≫Tc区间，将金兹堡-朗道自由能展开推广到包含高阶梯度项。\n2. 其核心在于指出线性梯度耦合本身只导致有限动量库珀配对而不改变临界电流对称性，唯有其与高阶梯度项协同才产生约瑟夫森二极管效应。\n3. 这修正了传统φ0结模型仅适用于弱交换场h≲Tc的局限，表明强交换场下高阶梯度项对自由能稳定性和二极管效应判定不可或缺，并提示后续实验与理论需在强铁磁势垒区重新审视该效应。", "summary_source": "deepseek", "authors": [{"name": "A. Janalizadeh"}, {"name": "Y. M. Shukrinov"}, {"name": "M. R. Kolahchi"}], "featured_authors": [{"name": "A. Janalizadeh"}, {"name": "Y. M. Shukrinov"}, {"name": "M. R. Kolahchi"}], "author_count": 3}, {"id": "2609.13411", "category": "cond-mat", "title": "Tripartite entanglement in chaotic eigenstates", "abstract": "It is now well-established that classical statistical mechanics emerges from the entanglement structure of quantum chaotic systems, as quantified by the (subsystem) eigenstate thermalization hypothesis (ETH). While this statement rests on the well-studied bipartite entanglement of the eigenstates of such systems, recent years have shown that many-body states are often characterized by multipartite entanglement, raising the question: what are the universal multipartite entanglement features of chaotic eigenstates? We answer this question in part by studying a tripartite generalization of the ergodic bipartition ansatz through the lens of two tripartite entanglement probes, the Rényi tripartite multi-entropy and the Rényi reflected entropy. We derive leading-order analytical expressions for the ensemble averages of both quantities using a saddle-point analysis. Beyond these measures, we obtain the average of the Rényi-2 reflected density matrix, $\\rho_{AA^*}^{(2)}$,which controls the Rényi-2 reflected entropy. We show that $\\rho_{AA^*}^{(2)}$ in a chaotic eigenstate is well-described by this ensemble average which, unlike an ordinary reduced density matrix, takes three qualitatively distinct forms across subsystem-size regimes, which may be viewed as a tripartite generalization of subsystem ETH. We benchmark our analytical predictions against exact diagonalization of the mixed-field Ising model.", "url": "https://arxiv.org/abs/2609.13411", "type": "理论+数值", "summary": "1. 该工作研究混沌本征态的三分纠缠普适性，考察遍历二分拟设的三分推广，并用Rényi三分多熵与Rényi反射熵两个探针刻画其系综平均。\n2. 通过鞍点分析给出两者领头阶解析表达式，并得到控制Rényi-2反射熵的反射密度矩阵平均，证明混沌本征态中该平均可良好描述相应矩阵，且在子系统尺寸区间呈现三种定性不同形式，构成子系统ETH的三分推广，并以混合场Ising模型精确对角化校验。\n3. 这为多体混沌中多分纠缠的普适统计描述提供了可计算框架，并提示将ETH从二分约化密度矩阵拓展至三分反射结构及更高分纠缠。", "summary_source": "deepseek", "authors": [{"name": "Junjia Zhang"}, {"name": "Ramanjit Sohal"}, {"name": "Shinsei Ryu"}], "featured_authors": [{"name": "Junjia Zhang"}, {"name": "Ramanjit Sohal"}, {"name": "Shinsei Ryu"}], "author_count": 3}, {"id": "2609.13426", "category": "cond-mat", "title": "Spatial instability of a homogeneous superconductor after an interaction quench", "abstract": "We investigate the quantum dynamics of a conventional superconductor, described by the attrac- tive Hubbard model, driven far from equilibrium by quenching the Hubbard attraction. We evolve the full density matrix of the system in time using the Heisenberg equation of motion, tracking the spatiotemporal dynamics of the pairing and density fields. We use very weakly inhomogeneous initial conditions to probe the stability of the homogeneous dynamics to spatial perturbations. At initial times after the quench the pairing and density fields remain homogeneous in space while fluctuating in time. However, depending on the quench strength the spatially uniform dynamics can become unstable beyond a threshold time, with emergence of spatial textures. The onset time for the instability depends on the strength of the quench and the initial inhomogeneity. At long times the system evolves towards a state with significantly reduced spatial heterogeneity. The time dependence of the global superconducting order parameter suggests two broad categories of re- sponse to a quench. One of these involves strongly inhomogeneous pairing and bond currents in the nonequilibrium superconductor.", "url": "https://arxiv.org/abs/2609.13426", "type": "理论", "summary": "1. 该工作用吸引Hubbard模型研究常规超导体在相互作用淬火后的量子动力学，并追踪配对与密度场的时空演化。\n2. 其卖点在于演化完整密度矩阵并采用极弱非均匀初条件，揭示均匀动力学可在阈值时间后失稳并涌现空间织构。\n3. 长期演化趋向空间异质性显著降低的态，且全局序参量时间行为区分出两类淬火响应，其中一类伴随强非均匀配对与键流。", "summary_source": "deepseek", "authors": [{"name": "Medha Roy Choudhury"}, {"name": "Sankha Subhra Bakshi"}, {"name": "Pinaki Majumdar"}, {"name": "Amit Ghosal"}], "featured_authors": [{"name": "Medha Roy Choudhury"}, {"name": "Sankha Subhra Bakshi"}, {"name": "Pinaki Majumdar"}, {"name": "Amit Ghosal"}], "author_count": 4}, {"id": "2609.13432", "category": "cond-mat", "title": "Fuzzy Erdos-Renyi random graphs: Spectral statistics", "abstract": "Within a random-matrix-theory (RMT) approach, we perform a detailed numerical study of the spectral statistics of fuzzy Erdos-Renyi (ER) random graphs. Specifically, we consider the membership values of the vertices and edges of a fuzzy ER graph model as random variables. In this way, the corresponding adjacency matrices become sparse matrices with random entries. Then, we apply standard RMT measures to characterize the eigenvalues and eigenvectors of ensembles of Hermitian and non-Hermitian adjacency matrices of both undirected and directed fuzzy graphs. We demonstrate that the average degree of the ER model serves as the scaling parameter of the spectral properties of the corresponding fuzzy setups.", "url": "https://arxiv.org/abs/2609.13432", "type": "理论+数值", "summary": "1. 该工作围绕《Fuzzy Erdos-Renyi random graphs: Spectral statistics》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "J. A. Mendez-Bermudez"}], "featured_authors": [{"name": "J. A. Mendez-Bermudez"}], "author_count": 1}, {"id": "2609.13474", "category": "cond-mat", "title": "Magnon Theory of Domain Wall Wavefronts and the Ballistic Diffusive Crossover in the Classical Anisotropic Landau Lifshitz Spin Chain", "abstract": "We study the far-from-equilibrium dynamics of domain-wall initial states in the integrable lattice Landau--Lifshitz spin chain. Building on the linear spin-wave description of domain-wall spreading, we derive the long-wavelength magnon dispersion directly from the microscopic integrable Hamiltonian and use it to characterize the propagation and broadening of the resulting wavefronts. The dispersion interpolates between a quadratic form at the isotropic point and a linear form in the easy-plane regime. In the isotropic limit, the quadratic dispersion leads to diffusive broadening, whereas in the easy-plane regime the domain-wall front propagates ballistically. Keeping the leading nonlinear correction to the linear dispersion gives a cubic dispersive term, which produces a characteristic $t^{1/3}$ broadening of the ballistic front. We further show that the sign of this cubic correction changes at a critical anisotropy, leading to a reversal of the dispersive wake from trailing to advancing. The resulting critical point occurs at $\\Delta_c=1/7$, corresponding to $\\gamma_c\\simeq 1.047$. Numerical simulations of the full nonlinear spin dynamics confirm the analytical scaling and demonstrate the coexistence of the amplitude-independent spin-wave front with amplitude-dependent nonlinear soliton propagation.", "url": "https://arxiv.org/abs/2609.13474", "type": "理论+数值", "summary": "1. 该工作研究了可积格点朗道-利夫希茨自旋链中畴壁初态的远离平衡动力学，并在线性自旋波框架下由微观哈密顿量推导长波磁振子色散，用以刻画畴壁波前的传播与展宽。\n2. 其核心在于色散由各向同性点的二次型过渡到易面区的线性型，从而给出由扩散到弹道的转变；非线性领头立方项带来弹道波前的 t^{1/3} 展宽，且其符号在临界各向异性 Δ_c=1/7 处反转，使色散尾迹由后拖变为前伸。\n3. 数值模拟验证了解析标度，并显示振幅无关的自旋波前沿与振幅依赖的非线性孤子传播可共存，为可积自旋链的非平衡输运与波前结构提供了可检验图像。", "summary_source": "deepseek", "authors": [{"name": "Akash Sarkar"}], "featured_authors": [{"name": "Akash Sarkar"}], "author_count": 1}, {"id": "2609.13497", "category": "cond-mat", "title": "Scaling equations for Bose-Einstein condensate dynamics across all interaction regimes", "abstract": "We derive a unified set of scaling equations for Bose-Einstein condensates in time-dependent harmonic traps, connecting the weakly interacting Gaussian regime to the strongly interacting Thomas-Fermi regime. The exact Gross-Pitaevskii ground-state density is taken as a fixed profile in rescaled coordinates, with its dynamics described by three scaling factors corresponding to compression or expansion along the three spatial directions. The resulting equations contain no adjustable parameter, since their coefficients are determined once from the initial state. They recover analytically the Gaussian variational and Thomas-Fermi scaling equations in their respective limits and satisfy an axis-resolved virial theorem. The approach also yields the global phase and the low-lying collective-mode frequencies of the condensate. We benchmark the model against three-dimensional Gross-Pitaevskii simulations and against measured expansion energies. The model remains accurate across all interaction regimes, in strongly anisotropic traps, and along time-dependent sequences including a relatively fast quench, up to the point where the underlying frozen-profile hypothesis, shared by all three scaling approaches, breaks down.", "url": "https://arxiv.org/abs/2609.13497", "type": "理论+数值", "summary": "1. 该工作推导统一标度方程，描述时变谐振势中玻色-爱因斯坦凝聚体从弱相互作用高斯区到强相互作用托马斯-费米区的动力学，以精确 Gross-Pitaevskii 基态密度为冻结轮廓，并引入三个方向标度因子。\n2. 方程无可调参数，系数仅由初始态确定；它解析恢复高斯变分与托马斯-费米标度方程，满足轴分辨维里定理，并给出全局相位与低阶集体模频率。\n3. 经三维 Gross-Pitaevskii 模拟和实测膨胀能量检验，该模型跨所有相互作用区、强各向异性陷阱及含较快淬火序列保持准确，直至共享的冻结轮廓假设失效，为跨区动力学建模与实验预测提供可检验框架。", "summary_source": "deepseek", "authors": [{"name": "D. C. Marinica"}, {"name": "C. Puertas González"}, {"name": "T. Estrampes"}, {"name": "N. Gaaloul"}, {"name": "E. Charron"}], "featured_authors": [{"name": "D. C. Marinica"}, {"name": "C. Puertas González"}, {"name": "T. Estrampes"}, {"name": "N. Gaaloul"}, {"name": "E. Charron"}], "author_count": 5}, {"id": "2609.13532", "category": "cond-mat", "title": "Non-reactive sintering enhances density and ionic conductivity of NASICON solid electrolytes", "abstract": "NASICON materials are promising solid electrolytes for room-temperature sodium solid-state batteries and are typically synthesized via solid-state reaction. While sintering has been extensively studied, the effect of calcination on electrolyte properties remains poorly understood. In this work, the temperatures at which the NASICON phase forms in Na3Zr2Si2PO12 and Na3.4Zr2Si2.4P0.6O12 are identified. Calcination temperature is then varied between 900 °C and 1200 °C to obtain powders with different degrees of reaction prior to sintering. Under identical sintering conditions, higher NASICON phase content in the calcined powder is shown to yield denser electrolytes. Non-reactive sintering also improves grain boundary conductivity, increasing it by 130% for Na3.4Zr2Si2.4P0.6O12 and raising total conductivity from 1.60 to 2.95 mS/cm for powders calcined at 900 °C and 1200 °C, respectively. Finally, it is shown that phosphorus loss during processing compromises cycling stability against Na metal electrodes, and that adding off-stoichiometric phosphorus resolves this issue, while reaching a critical current density of 5.0 mA/cm^2 and a room-temperature conductivity of 3.82 mS/cm with over 400 hours of stable cycling. Overall, these findings directly relate synthesis and processing conditions to the final material properties and electrochemical performance of NASICON solid electrolytes.", "url": "https://arxiv.org/abs/2609.13532", "type": "理论", "summary": "1. 该工作确定Na3Zr2Si2PO12与Na3.4Zr2Si2.4P0.6O12中NASICON相形成温度，并在900–1200 °C改变煅烧温度以调控烧结前粉体反应程度。\n2. 非反应烧结提高致密度与电导：晶界电导增130%，总电导1.60→2.95 mS/cm；补偿磷流失后达5.0 mA/cm²、3.82 mS/cm和400 h循环。\n3. 这些结果将合成与加工条件直接关联到NASICON电解质的材料性质与电化学性能，为室温钠固态电池优化提供依据。", "summary_source": "deepseek", "authors": [{"name": "Andrea Cornelio"}, {"name": "Björn Mieller"}, {"name": "Johannes Baller"}, {"name": "Andrea Fantin"}, {"name": "Janina Roik"}, {"name": "Jessica Kindt"}, {"name": "Jonas Krug von Nidda"}, {"name": "Tim-Patrick Fellinger"}, {"name": "Gustav Graeber"}], "featured_authors": [{"name": "Andrea Cornelio"}, {"name": "Björn Mieller"}, {"name": "Johannes Baller"}, {"name": "Jonas Krug von Nidda"}, {"name": "Tim-Patrick Fellinger"}, {"name": "Gustav Graeber"}], "author_count": 9}, {"id": "2609.13541", "category": "cond-mat", "title": "Slow Thermalization and Long-Lived Coherence across Acoustic Phonon Branches in BAs", "abstract": "The exceptionally high thermal conductivity of cubic boron arsenide (BAs) arises from suppressed three-phonon scattering associated with its large acoustic--optical gap. In this regime, four-phonon processes become non-negligible, creating an unusual scattering hierarchy with unexplored consequences for nonequilibrium phonon dynamics. Here, time-resolved x-ray diffuse scattering reveals exceptionally slow, branch-dependent acoustic phonon thermalization and long-lived coherence. Exploiting branch sensitivity in one-phonon diffuse scattering, we resolve transverse acoustic (TA) and longitudinal acoustic (LA) thermalization times of 29.2 and 13.9~ps, respectively; even the LA timescale is at least three times that in common semiconductors. Phonon dispersion calculations assign coherent oscillations at 0.19 and 0.27~THz to the TA and LA modes, respectively; both persist with little decay over 50~ps, with comparable coherence found only in diamond. These findings provide a direct dynamical manifestation of the weak phonon scattering underlying the exceptional thermal transport of BAs.", "url": "https://arxiv.org/abs/2609.13541", "type": "理论+数值", "summary": "1. 该工作利用时间分辨X射线漫散射，在立方硼砷（BAs）中分辨出支依赖的声子热化，测得横声学支（TA）与纵声学支（LA）热化时间分别为29.2 ps和13.9 ps。\n2. 借助单声子漫散射的支选择性，它揭示了由大光学-声学带隙抑制三声子散射、四声子过程不可忽略所形成的异常散射层级，并将0.19与0.27 THz相干振荡分别归于TA与LA模式，二者在50 ps内几乎不衰减。\n3. 该结果直接给出了BAs极高热导率背后弱声子散射的动力学证据，也提示可在其他高导热材料中寻找长寿命相干声子。", "summary_source": "deepseek", "authors": [{"name": "Zeyu Xiang"}, {"name": "Ying Peng"}, {"name": "Ange Benise Niyikiza"}, {"name": "Fanghao Zhang"}, {"name": "Haoyuan Li"}, {"name": "Takahiro Sato"}, {"name": "Thomas Linker"}, {"name": "Yanwen Sun"}, {"name": "Meredith Henstridge"}, {"name": "Vincent Esposito"}, {"name": "James F. Cotter"}, {"name": "Diling Zhu"}, {"name": "Zhifeng Ren"}, {"name": "Bolin Liao"}], "featured_authors": [{"name": "Zeyu Xiang"}, {"name": "Ying Peng"}, {"name": "Ange Benise Niyikiza"}, {"name": "Diling Zhu"}, {"name": "Zhifeng Ren"}, {"name": "Bolin Liao"}], "author_count": 14}, {"id": "2609.13542", "category": "cond-mat", "title": "Local Response Theory of Electrified Interfaces from Screened Effective Charges", "abstract": "First-principles, electronic-structure simulations provide direct access to ground-state, global system properties. In the context of computational electrochemistry these are, e.g., bias-dependent energies, free energies, work functions, and capacitances. However, a comparably systematic local description of how these quantities respond to biasing via interfacial charging is still missing. Here, we introduce the screened electrochemical Born effective charge (SEBEC), a mixed total-energy derivative that measures the force response of an atomic degree of freedom to interfacial charging under electrochemical boundary conditions. SEBECs play the role for electrochemistry that Born effective charges play in the modern theory of polarization: they provide an unambiguous decomposition of global response and generate the same formal structures for structural relaxation, capacitance, and electrochemical Stark tuning that are familiar from solid-state response theory. The broader implication is a local response framework that brings electrochemical interfaces closer to the conceptual rigor long established for insulating solids.", "url": "https://arxiv.org/abs/2609.13542", "type": "理论+数值", "summary": "1. 该工作针对电化学界面缺乏系统性局域响应描述的问题，引入屏蔽电化学玻恩有效电荷（SEBEC），用混合总能量导数刻画电化学边界条件下界面充电对原子自由度的力响应。\n2. 其核心卖点在于：SEBEC为电化学提供了类似极化现代理论中玻恩有效电荷的局域量，可无歧义地分解全局响应，并生成结构弛豫、电容与电化学Stark调谐的统一形式框架。\n3. 这一局域响应理论有望把电化学界面研究提升到绝缘固体长期拥有的概念严谨性水平，并为第一性原理电化学模拟中的响应分解与谱学解释提供可推广思路。", "summary_source": "deepseek", "authors": [{"name": "Nicolas G. Hörmann"}, {"name": "Nicolas Bergmann"}, {"name": "Karsten Reuter"}], "featured_authors": [{"name": "Nicolas G. Hörmann"}, {"name": "Nicolas Bergmann"}, {"name": "Karsten Reuter"}], "author_count": 3}, {"id": "2609.13656", "category": "cond-mat", "title": "Probing the anomalous symmetry-breaking in kagome material CsV3Sb5 via third-order nonlinearity", "abstract": "The kagome material has rapidly established itself as a research frontier in condensed matter physics, owing to its distinctive geometric structure and the rich array of unconventional physical phenomena. In the kagome AV3Sb5 (A = K, Rb, Cs) family, the charge-ordered state exhibits a remarkable characteristic, i.e., anomalous symmetry-breaking, which is tied to the topological nature of the electronic band structure. Here, we report the third-order nonlinear longitudinal and Hall responses that persist stably up to room temperature in the kagome material CsV3Sb5. Notably, the nonlinear responses demonstrate significant enhancement below the charge density wave (~ 77 K) order and anomalous symmetry-breaking (~ 39 K) state. The scaling analysis indicates that the third-order nonlinear transport is governed jointly by quantum geometric contribution and extrinsic scattering. This study realizes a giant third-order nonlinear response and provides a distinct method to detect anomalous symmetry-breaking in CsV3Sb5.", "url": "https://arxiv.org/abs/2609.13656", "type": "理论", "summary": "1. 该工作测量了笼目材料CsV3Sb5的三阶非线性纵向与霍尔响应，其在室温下仍稳定存在，并在电荷密度波（约77 K）与反常对称破缺（约39 K）之下显著增强。\n2. 标度分析表明三阶非线性输运由量子几何贡献与外在散射共同支配，由此实现巨非线性响应并直接映射对称破缺。\n3. 这提供了一种探测CsV3Sb5中反常对称破缺的独特输运手段，可推广至其他拓扑笼目体系与电子有序研究。", "summary_source": "deepseek", "authors": [{"name": "Zheng Dai"}, {"name": "Fengyi Guo"}, {"name": "Shuai Zhang"}, {"name": "Xiubing Li"}, {"name": "Congcong Li"}, {"name": "Yufan Ju"}, {"name": "Ziqi Wang"}, {"name": "Bin Cheng"}, {"name": "Zhe Ying"}, {"name": "Fengqi Song"}], "featured_authors": [{"name": "Zheng Dai"}, {"name": "Fengyi Guo"}, {"name": "Shuai Zhang"}, {"name": "Bin Cheng"}, {"name": "Zhe Ying"}, {"name": "Fengqi Song"}], "author_count": 10}, {"id": "2609.13658", "category": "cond-mat", "title": "Thixotropy versus viscoelasticity: a matter of time", "abstract": "Thixotropic and viscoelastic materials both retain their deformation history and are difficult to distinguish. However, a stationary linear response obeys the Kramers-Kronig relations. A structure that evolves during a sweep renders the spectrum inconsistent with them, so the residual from one chirp and no model measures nonstationarity. It survives the small-amplitude limit, returns to its baseline at any stationary state, and, for bounded restructuring, peaks near the structural time. We verify this on eight models and demonstrate it on published spectra of a thixotropic silica suspension.", "url": "https://arxiv.org/abs/2609.13658", "type": "理论", "summary": "1. 该工作提出并验证了一种无需模型、基于单次啁啾扫描的克拉默斯-克勒尼希残差判据，用于区分触变性与粘弹性材料。\n2. 其技术核心在于平稳线性响应满足克拉默斯-克勒尼希关系，而扫描中结构演化使谱违背该关系，由此定义的残差在微小振幅极限下仍存在、在任意稳态回归基线，并在有界重构时于结构时间附近达峰。\n3. 该判据在八个模型上得到验证，并成功用于已发表的触变性二氧化硅悬浮液谱，为无模型识别非平稳性与触变性提供了可推广的流变学诊断。", "summary_source": "deepseek", "authors": [{"name": "Rishabh V. More"}], "featured_authors": [{"name": "Rishabh V. More"}], "author_count": 1}, {"id": "2609.13683", "category": "cond-mat", "title": "Heating of black-Si by microwaves at 2.45 GHz: effect of nano-needle orientation", "abstract": "Silicon, which is highly reflective and has negligible absorption at the microwave 2.45 GHz range, can be heated when it is turned into black-Si with a surface texture of nano-needles made by SF6/O2 plasma etching. Microwave heating of flat Si and of black-Si with vertical and with tilted (oriented) nano-needles was compared under identical conditions in a cylindrical TM010 resonator. Samples were placed horizontally on a 150-micrometer-thick cover glass, which standardized their height and position inside the cavity and allowed a common calibration of the radiation thermometer against a K-type thermocouple. Under a stepwise protocol of only 2-3-4 W of microwave power (60 s per step), black-Si with vertical needles reached ~ 260 C, systematically exceeding flat Si (~ 190 C), while black-Si with oriented needles showed a delayed but abrupt onset of heating at 3 W. In situ monitoring of the cavity resonance revealed a 2-3 MHz downshift of the resonance frequency f for all samples, with the drift consistently appearing once the sample temperature exceeded ~ 120 - 150 C, consistent with thermally activated carrier generation in Si. At a given temperature, each sample loads the cavity at a different f and quality factor Q, indicating an orientation-dependent effective permittivity of the nano-needle array, in line with the strong form birefringence of tilted black-Si. Application potential and challenges in the quantitative temperature and permittivity determination are discussed.", "url": "https://arxiv.org/abs/2609.13683", "type": "理论", "summary": "1. 该工作在2.45 GHz圆柱TM010腔内，以相同条件对比平面Si、垂直与倾斜纳米针黑硅的微波加热。\n2. 垂直针黑硅约260 °C，高于平面Si约190 °C；倾斜针样品3 W才延迟突变升温；共振f下移2–3 MHz，Q与等效介电常数随取向变化。\n3. 这为通过纳米针取向调控微波吸收/加热及黑硅形式双折射提供依据，但定量温度与介电常数反演仍具挑战。", "summary_source": "deepseek", "authors": [{"name": "Massimiliano Zamengo"}, {"name": "Haoran Mu"}, {"name": "Hsin-Hui Huang"}, {"name": "Tomas Katkus"}, {"name": "Darius Gailevičius"}, {"name": "Saulius Juodkazis"}, {"name": "Junko Morikawa"}], "featured_authors": [{"name": "Massimiliano Zamengo"}, {"name": "Haoran Mu"}, {"name": "Hsin-Hui Huang"}, {"name": "Darius Gailevičius"}, {"name": "Saulius Juodkazis"}, {"name": "Junko Morikawa"}], "author_count": 7}, {"id": "2609.13724", "category": "cond-mat", "title": "Lagrangian approach to origami vertex analysis: Multistability", "abstract": "Studying the multistability of origami structures presents challenges due to the nonlinearity of their kinematics and the high-dimensional configuration spaces that are difficult to visualize and explore exhaustively. To address this, we utilize the Lagrangian framework for origami to exploit symmetries and obtain reduced-dimensional slices of the configuration space. Our analysis of degree-6 vertices with reflection symmetry reveals topological transitions in their kinematic space as sector angles are varied, with implications for the number of symmetry-constrained minima and the emergence of metastable regions. These lower-dimensional slices are amenable to exhaustive search and visualization. A subsequent full-space stability analysis shows that 18 of 41 degree-6 and 14 of 45 degree-8 symmetry-constrained minima remain minima when all locally compatible perturbations, including those that break symmetry, are admitted. The metastable regions, which would likely be overlooked by numerical optimization alone, are influenced by the interplay between the boundaries of admissible kinematic space and crease mechanical properties. We extend our analysis to cone-like vertices with higher symmetry and one-degree-of-freedom kinematics, exploring symmetry-breaking phenomena, combinatorial structure, and their consequences for branchwise stability. The stability landscapes uncovered have potential applications in mechanical metamaterials, mechanical computing, origami-based robotics, and structures designed to self-deploy and retain their shape.", "url": "https://arxiv.org/abs/2609.13724", "type": "理论+数值", "summary": "1. 该工作围绕《Lagrangian approach to origami vertex analysis: Multistability》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Matthew Grasinger"}, {"name": "Andrew Gillman"}, {"name": "Philip Buskohl"}], "featured_authors": [{"name": "Matthew Grasinger"}, {"name": "Andrew Gillman"}, {"name": "Philip Buskohl"}], "author_count": 3}, {"id": "2609.13762", "category": "cond-mat", "title": "Surrogate-assisted three-dimensional Gross--Pitaevskii characterization of Bose--Einstein condensate transport on an atom chip", "abstract": "We develop a surrogate-assisted workflow for millimeter-scale transport of a $^{87}$Rb Bose--Einstein condensate (BEC) on a multi-wire atom chip. Gradient-based inverse optimization generates 42 current schedules spanning seven regularization strengths and six transport durations. A low-cost Gaussian phase-space model ranks these schedules by endpoint overlap at three atom numbers. A Thomas--Fermi scaling (Ermakov) model estimates cloud dimensions for case-specific moving-grid construction. We then evaluate selected schedules in detail with the three-dimensional Gross--Pitaevskii equation (GPE). At $N=10^3$ and $T=0.5$ s, the surrogate predicts a larger axial center-of-mass (COM) excursion than at longer durations. The GPE confirms this prediction and reveals sloshing that persists through delivery, with an endpoint fidelity $F_{3D}=0.9244$. For all five longer transports, the surrogate predicts near-unit endpoint overlap for the top-ranked schedules, and GPE propagation using these schedules gives $F_{3D}>0.9997$. At $N=10^4$ and $T=2.0$ s, the surrogate-selected schedule similarly gives $F_{3D}=0.999932$. These results demonstrate that the surrogate estimates provide a useful low-cost basis for candidate screening, while GPE propagation resolves the transport dynamics and the delivered condensate state.", "url": "https://arxiv.org/abs/2609.13762", "type": "理论+数值", "summary": "1. 该工作围绕《Surrogate-assisted three-dimensional Gross--Pitaevskii characterization of Bose--Einstein condensate transport on an atom chip》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Naoki Shibuya"}], "featured_authors": [{"name": "Naoki Shibuya"}], "author_count": 1}, {"id": "2609.13787", "category": "cond-mat", "title": "Thermodynamic geometry of inclusion statistics", "abstract": "We investigate the thermodynamic geometry of an ideal quantum gas obeying inclusion statistics, characterized by a negative statistical parameter $g < 0$. In this framework the grand-canonical partition function admits a finite maximum fugacity, and the thermodynamic scalar curvature $R$ is strictly positive for all $g < 0$, reflecting effective attractive statistical interactions analogous to those of a bosonic system. As the fugacity approaches its maximum value, $R$ diverges, signaling a phase transition of the Bose-Einstein condensation type. A key distinction from the ordinary ideal Bose gas is that the condensation temperature is elevated relative to the bosonic case, and finite-temperature condensation occurs even in the dimensional regime $1/2 < D/\\sigma \\leq 1$ where standard bosons do not condense, while for $D/\\sigma \\leq 1/2$ the transition temperature vanishes. Three independent criteria; divergence of $R$, the maximum fugacity singularity, and the non-analytic cusp in the specific heat, coincide at the same condensation point, confirming the thermodynamic consistency of the transition.", "url": "https://arxiv.org/abs/2609.13787", "type": "理论", "summary": "1. 该工作用热力学几何研究负统计参数 g<0 的包容统计理想量子气体。\n2. 其卖点在于标量曲率 R>0 并在最大逸度处发散，且与比热非解析尖点在同一凝聚点重合。\n3. 这提示包容统计可提高凝聚温度，并在 1/2 < D/σ ≤ 1 区间实现有限温凝聚，而 D/σ ≤ 1/2 时转变温度消失。", "summary_source": "deepseek", "authors": [{"name": "M. H. Naghizadeh Ardabili"}, {"name": "Omid Yahyayi Monem"}, {"name": "Habib Esmaili"}, {"name": "Zahra Ebadi"}, {"name": "Hosein Mohammadzadeh"}], "featured_authors": [{"name": "M. H. Naghizadeh Ardabili"}, {"name": "Omid Yahyayi Monem"}, {"name": "Habib Esmaili"}, {"name": "Zahra Ebadi"}, {"name": "Hosein Mohammadzadeh"}], "author_count": 5}, {"id": "2609.13834", "category": "cond-mat", "title": "On Rare Nonresonant Regions and Subdiffusive Transport in an Interacting Disordered Quantum Chain", "abstract": "We study rare nonresonant regions in a canonical one-dimensional disordered quantum spin chain by directly implementing the iterated Schrieffer-Wolff construction underlying the recent work of De Roeck, Giacomin, Huveneers and Prosniak on subdiffusive transport. For finite systems, we compute the probability that a disorder realization remains nonresonant through successive scales of the flow, while separately monitoring operator proliferation and the spatial localization of dressed local observables. The survival probability decays at most exponentially with system size over the numerically accessible regime. Resolving this decay scale by scale yields failure rates associated with successive Schrieffer-Wolff steps. The first rate is obtained analytically in excellent agreement with numerics, while higher-scale rates decrease rapidly throughout the regime studied. These results support the summability mechanism required for exponentially rare but parametrically long nonresonant regions, which provide the insulating bottlenecks responsible for subdiffusive transport. At the smallest couplings studied, the survival probability under our conditions exceeds the rigorous lower bound by six to seven orders of magnitude, demonstrating how conservative the constants required by the proof are while confirming that its underlying physical mechanism is quantitatively visible at accessible scales. More broadly, our results show how direct numerical implementations can provide an independent and physically transparent test of technically demanding constructive proofs, a methodology that may become increasingly useful as machine-assisted proofs become more common.", "url": "https://arxiv.org/abs/2609.13834", "type": "理论+数值", "summary": "1. 该工作直接实现迭代Schrieffer-Wolff变换，在一维相互作用无序自旋链中数值研究稀有非共振区域，计算无序实现跨尺度保持非共振的概率并监测算符增殖与局域观测量缀饰。\n2. 其要点在于：存活概率在可及范围内至多随尺寸指数衰减，逐尺度分解给出各步失败率，首步解析与数值高度吻合、更高尺度速率迅速下降，由此支持指数稀有却参量极长的非共振区所需的可求和机制，即亚扩散输运的绝缘瓶颈。\n3. 最小耦合下存活概率高于严格下界六至七个数量级，说明证明常数极为保守但机制在可及尺度上定量可见；直接数值实现可为繁难构造性证明提供独立且物理透明的检验，随机器辅助证明普及或更具价值。", "summary_source": "deepseek", "authors": [{"name": "A. Scardicchio"}, {"name": "S. L. Sondhi"}], "featured_authors": [{"name": "A. Scardicchio"}, {"name": "S. L. Sondhi"}], "author_count": 2}, {"id": "2609.13884", "category": "cond-mat", "title": "A Direct Algebraic Approach to Normal Ordering of Exponential Bosonic Operators with Applications to Two-Dimensional Excitonic Form Factors", "abstract": "We develop a systematic algebraic approach, based on the Wei--Norman factorization method, to the normal ordering of exponential bosonic operators and apply it to derive analytical excitonic form factors in two-dimensional semiconducting materials. By introducing an auxiliary parameter, the normal-ordering problem is reduced to a system of ordinary differential equations determined by the commutation relations of the underlying closed Lie algebra. The approach is first illustrated for exponential operators associated with the Heisenberg--Weyl and $su(1,1)$ algebras, and is then extended to two-mode bosonic operators involving $su(2)$ and a six-generator closed algebra that contains two coupled $su(1,1)$ subalgebras. For the excitonic application, the Levi--Civita transformation maps the two-dimensional exciton problem onto an oscillator representation, providing a natural formulation in terms of bosonic creation and annihilation operators. Combined with the Laplace and Fourier representations of the Rytova--Keldysh potential, this formulation reduces the interaction matrix elements to the evaluation of exponential bosonic form factors. The isotropic problem is governed by a three-generator $su(1,1)$ algebra, whereas the anisotropic case requires the full six-generator algebra together with an additional $su(2)$ factorization. Explicit analytical expressions for both form factors, $\\langle e^{-rt}\\rangle$ and $\\langle e^{i\\mathbf q\\cdot\\mathbf r}\\rangle$, are obtained, providing useful building blocks for matrix-element calculations in two-dimensional excitonic systems and potentially in other quantum problems involving exponential bosonic operators.", "url": "https://arxiv.org/abs/2609.13884", "type": "理论+数值", "summary": "1. 该工作围绕《A Direct Algebraic Approach to Normal Ordering of Exponential Bosonic Operators with Applications to Two-Dimensional Excitonic Form Factors》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Duy-Anh P. Nguyen"}, {"name": "Ngoc-Tram D. Hoang"}, {"name": "Dang-Khoa D. Le"}, {"name": "Van-Hoang Le"}], "featured_authors": [{"name": "Duy-Anh P. Nguyen"}, {"name": "Ngoc-Tram D. Hoang"}, {"name": "Dang-Khoa D. Le"}, {"name": "Van-Hoang Le"}], "author_count": 4}, {"id": "2609.13912", "category": "cond-mat", "title": "Unbiased first-principles construction of complete tensorial spin Hamiltonians", "abstract": "Magnetic ground states are commonly predicted using spin Hamiltonians whose interaction terms are selected a priori, potentially overlooking the microscopic interactions that govern complex magnetic order. Here, we introduce a general framework for the unbiased first-principles construction of symmetry-complete tensorial spin Hamiltonians and its automated implementation in AMATIS. The framework constructs the Hamiltonian directly from density-functional theory while rigorously enforcing quantum spin algebra and crystallographic symmetry. Applied to representative two-dimensional van der Waals magnets, the framework reproduces established magnetic interactions and uncovers hidden physics beyond conventional spin models, including chiral interactions that stabilize metastable skyrmions, higher-rank tensorial interactions that reconstruct the magnetic phase diagram and establish stabilizing competing multi-Q phases, and an emergent p-wave altermagnetic electronic structure. Our results demonstrate that unbiased tensorial Hamiltonian construction provides a predictive alternative to the conventional practice of manually selecting spin-model interactions, enabling first-principles discovery of unconventional magnetic phases.", "url": "https://arxiv.org/abs/2609.13912", "type": "理论+数值", "summary": "1. 该工作提出了从密度泛函理论出发、无预设地构建对称性完备张量自旋哈密顿量的一般框架，并实现了自动化工具AMATIS。\n2. 其核心在于严格保持量子自旋代数与晶体对称性，从而复现已知相互作用并揭示手性相互作用稳定亚稳斯格明子、高阶张量相互作用重构磁相图并稳定竞争多Q相、以及涌现p波交变磁电子结构等常规自旋模型遗漏的物理。\n3. 这表明无偏张量哈密顿量构建可作为手动选择自旋模型相互作用的预测性替代方案，为第一性原理发现非常规磁相提供启发。", "summary_source": "deepseek", "authors": [{"name": "Haichang Lu"}, {"name": "Boyang Deng"}, {"name": "Hiroshi Katsumoto"}, {"name": "John Robertson"}, {"name": "Weisheng Zhao"}, {"name": "Stefan Blügel"}], "featured_authors": [{"name": "Haichang Lu"}, {"name": "Boyang Deng"}, {"name": "Hiroshi Katsumoto"}, {"name": "John Robertson"}, {"name": "Weisheng Zhao"}, {"name": "Stefan Blügel"}], "author_count": 6}, {"id": "2609.13939", "category": "cond-mat", "title": "Towards a Metal-Organic Framework with Pore-Confined Electrons", "abstract": "Electrides are an unconventional class of materials in which electrons are localized in crystallographic void spaces rather than solely around atomic nuclei, giving rise to appealing properties such as low work functions, strong electron-donating character, and even superconductivity. Here, we use ab initio methods to investigate metal-organic framework (MOF) electrides, a new class of materials that combines the interstitial electrons of electrides with the permanent porosity and chemical tunability of MOFs. These materials host pore-confined electrons: occupied electronic states localized in the pore space and with bands slightly below or crossing through the Fermi level. Using density functional theory calculations, we establish several design rules for stabilizing pore-confined electrons in MOFs via an anion-electron exchange process and identify candidate MOF electrides. As a proof-of-concept, we also demonstrate that the pore-confined electrons can directly facilitate chemical reactions, substantially lowering the activation barrier for H2 dissociation without requiring adsorption at a surface site. We envision that pore-confined electrons in nanoporous materials may enable a fundamentally new type of catalysis in which chemical reactions take place in the pore space, driven by electron-centered active sites.", "url": "https://arxiv.org/abs/2609.13939", "type": "理论+数值", "summary": "1. 该工作采用从头算方法研究金属有机框架电子化物，将间隙电子与金属有机框架的永久孔隙性和化学可调性结合，并筛选出可稳定孔道限域电子的候选材料。\n2. 其核心卖点是确认了占据电子态局域于孔道空间、能带略低于或穿过费米能级，并通过阴离子-电子交换过程建立稳定化设计规则，还以氢分子解离为例证明孔道限域电子无需表面吸附即可显著降低反应活化能。\n3. 这预示纳米多孔材料中的孔道限域电子可催生一类以电子为中心活性位、反应在孔空间内发生的新型催化，并为后续理论设计与实验验证提供明确方向。", "summary_source": "deepseek", "authors": [{"name": "Julia H. Baratta"}, {"name": "Andrew S. Rosen"}], "featured_authors": [{"name": "Julia H. Baratta"}, {"name": "Andrew S. Rosen"}], "author_count": 2}, {"id": "2609.13987", "category": "cond-mat", "title": "Sequential Retrieval in Dense Associative Memory: Asymptotic Dynamics and Storage Capacity", "abstract": "We study the retrieval dynamics of an $n$-body asymmetric dense associative memory model, in which sequential retrieval is implemented by shifting one pattern index in the higher-order Hebbian interaction. The model exhibits sequential retrieval of the stored patterns, and the retrieval state corresponds to a stable limit-cycle attractor. The storage capacity is defined as the maximum loading rate for which this limit cycle remains stable. Using generating functional analysis, we derive the dynamical equations describing the sequential retrieval state. The generating functional analysis reveals that the retarded self-interaction term vanishes in the asymmetric model, and the resulting overlap dynamics is reproduced by an Amari-Maginu-type signal-to-noise analysis. Also, we find that for the interaction order $n\\ge 3$, the normalized storage capacity decreases monotonically with increasing interaction order, in contrast to symmetric Modern Hopfield models.", "url": "https://arxiv.org/abs/2609.13987", "type": "理论", "summary": "1. 该工作研究n体非对称稠密联想记忆模型：通过平移高阶Hebbian相互作用中的模式指标实现序列检索，并用生成泛函分析推导渐近动力学方程与存储容量。\n2. 其关键机制是检索态对应稳定极限环吸引子，容量由该极限环保持稳定的最大加载率定义；非对称性使延迟自相互作用项消失，重叠动力学可由Amari-Maginu型信噪分析复现，且n≥3时归一化容量随相互作用阶数单调下降，与对称Modern Hopfield模型相反。\n3. 这为稠密联想记忆的序列动力学、极限环稳定性与容量标度提供了可解析基准，并提示非对称高阶相互作用可能改变现代Hopfield类模型的容量—阶数关系。", "summary_source": "deepseek", "authors": [{"name": "Mao Mishima"}, {"name": "Ayaka Sakata"}, {"name": "Kazushi Mimura"}], "featured_authors": [{"name": "Mao Mishima"}, {"name": "Ayaka Sakata"}, {"name": "Kazushi Mimura"}], "author_count": 3}, {"id": "2609.13996", "category": "cond-mat", "title": "Local pair correlations and network geometry govern collective oscillations in nonreciprocal Ising networks", "abstract": "Nonreciprocal many-body dynamics can develop a swap phase characterized by spontaneous global oscillations far from equilibrium. To determine how local nonreciprocal interactions predict global oscillations and how broadly this prediction applies, we compare mean-field theory, independent-node theory, and nearest-neighbor spin-coupling theory for a two-spin nonreciprocal Ising model on networks of fixed coordination number (\\(z=4\\)). Nearest-neighbor spin-coupling theory retains nine independent joint edge probabilities. Monte Carlo benchmarks show that it predicts the oscillation amplitude, angular momentum, and period on edge-swapped networks with a 2.1\\% aggregate mean absolute relative error. We then extend the square lattice to degree-preserving edge-swapped networks and find sharply different behavior. With increasing system size, the oscillation amplitude and angular momentum decay strongly on the periodic square lattice but remain nearly size independent on edge-swapped networks. These results show that identical local parameters do not determine the macroscopic phase. The contrasting finite-size trends identify network geometry as a key determinant of collective oscillations at fixed local interaction parameters.", "url": "https://arxiv.org/abs/2609.13996", "type": "理论+数值", "summary": "1. 该工作针对配位数为四的非互易伊辛网络，比较平均场、独立节点与最近邻自旋耦合理论，并用蒙特卡洛基准检验其对交换相集体振荡的预测，同时对比周期方格与度保持边交换网络的有限尺寸行为。\n2. 其关键贡献在于最近邻自旋耦合理论保留九个独立联合边概率，能以百分之二点一的总平均绝对相对误差同时预测振荡幅度、角动量与周期，并揭示相同局域参数下网络几何可显著改变宏观相行为。\n3. 这为理解非互易网络中局域相互作用与全局振荡的关系提供了明确线索：宏观相并非由相同局域参数唯一决定，网络几何与局域配对关联应作为设计、预测和调控集体动力学的关键自由度。", "summary_source": "deepseek", "authors": [{"name": "Zihua Liu"}, {"name": "Xudong Wu"}, {"name": "Liantuan Xiao"}], "featured_authors": [{"name": "Zihua Liu"}, {"name": "Xudong Wu"}, {"name": "Liantuan Xiao"}], "author_count": 3}, {"id": "2609.14134", "category": "cond-mat", "title": "Exact solutions of hidden free fermion models", "abstract": "Hidden-free-fermion (HFF) Hamiltonians exhibit free-fermion spectra despite lacking an explicit quadratic representation, yet their algebraic provenance and periodic-boundary behavior remain open questions. Here we establish that a broad class of HFF models arises from distinct Lax operator realizations of a twisted multistate Perk--Schultz \\(R\\) matrix. Its reflected degeneration generates a closed finite hierarchy of mutually commuting transfer matrices, whose functional relations determine the complete many-body spectrum. As a decisive example, we solve the inhomogeneous free-fermions-in-disguise (FFD) chain, which exhibits HFF, nested HFF, or interacting spectra, depending on its coupling. The homogeneous FFD chain with both one-wrap and periodic boundary conditions exhibits an emergent cubic finite-size gap while retaining the exact \\(z=3/2\\) bulk behavior. The construction extends to higher-state and face-type realizations, providing a common algebraic framework for coupling-dependent spectral organization and multiscale behavior in interacting quantum systems.", "url": "https://arxiv.org/abs/2609.14134", "type": "理论", "summary": "1. 该工作通过扭曲多态Perk–Schultz R矩阵的不同Lax实现，建立并精确求解了一类隐藏自由费米子模型。\n2. 其关键卖点是由反射退化生成有限对易转移矩阵层级，精确确定多体谱；FFD链在周期边界下出现立方有限尺寸能隙并保留z=3/2体行为。\n3. 该构造可推广至更高态与面型实现，为相互作用量子系统中耦合依赖的谱组织与多尺度行为提供统一代数框架。", "summary_source": "deepseek", "authors": [{"name": "Mingchen Zheng"}, {"name": "Balázs Pozsgay"}, {"name": "Shu Chen"}], "featured_authors": [{"name": "Mingchen Zheng"}, {"name": "Balázs Pozsgay"}, {"name": "Shu Chen"}], "author_count": 3}, {"id": "2609.14179", "category": "cond-mat", "title": "Ultrafast Magnetization Induced from Raman-Active Axial Chiral Phonons", "abstract": "Axial chiral phonons, which carry angular momentum and exhibit unusually large magnetic moments, provide a new degree of freedom for controlling the time-reversal symmetry and magnetic properties of quantum materials. While infrared-active axial phonons are efficiently excited to large amplitudes by circularly polarized terahertz pulses, their application may be constrained by short lifetimes, small penetration depths, low spatial resolution, and limited availability of optical sources. Here, we report that an axial Raman-active phonon mode in CeF3 exhibits a significant magnetic moment and an exceedingly long lifetime that more closely matches the paramagnetic spin dynamics. The axial phonon population is resonantly driven by a near-infrared laser pulse with rotating linear polarization, known as an optical centrifuge, a coherent control scheme never applied to solids before. The phonon-driven magnetization observed by time-resolved Faraday rotation scales quadratically with incident power and rapidly decreases at high temperatures, consistent with phonon inverse Faraday effect from many-body spin-phonon coupling. Our findings open a new avenue for using shaped laser pulses from widely accessible light sources to manipulate coherent axial chiral phonons and ultrafast spintronics.", "url": "https://arxiv.org/abs/2609.14179", "type": "理论+数值", "summary": "1. 该工作报道CeF3中拉曼活性轴向手性声子具有显著磁矩和异常长寿命，并用近红外旋转线偏振脉冲（光学离心机）共振激发，经时间分辨法拉第旋转观测到声子驱动的超快磁化。\n2. 其卖点在于以光学离心机这种此前未用于固体的相干控制方案驱动拉曼活性模式，规避红外活性声子对太赫兹源、短寿命与浅穿透的依赖；磁化随功率二次增长并在高温迅速衰减，符合多体自旋-声子耦合的声子逆法拉第效应。\n3. 这为利用广泛可及光源的整形脉冲操控相干轴向手性声子并推动超快自旋电子学提供了新路径。", "summary_source": "deepseek", "authors": [{"name": "Chuankun Huang"}, {"name": "Alexander Milner"}, {"name": "Jiaming Luo"}, {"name": "Jianbo Ye"}, {"name": "Gaihua Ye"}, {"name": "Junjie Zhang"}, {"name": "Cynthia Nnokwe"}, {"name": "Boris I. Yakobson"}, {"name": "Rui He"}, {"name": "Valery Milner"}, {"name": "Hanyu Zhu"}], "featured_authors": [{"name": "Chuankun Huang"}, {"name": "Alexander Milner"}, {"name": "Jiaming Luo"}, {"name": "Rui He"}, {"name": "Valery Milner"}, {"name": "Hanyu Zhu"}], "author_count": 11}, {"id": "2609.14191", "category": "cond-mat", "title": "Haldane-Holstein model at fractional filling: Route to bosonic fractional Chern insulator and quantum anomalous Hall crystal", "abstract": "Electron-phonon coupling is generally expected to suppress band topology, driving a topological band insulator into a trivial phase. Here we show that, using the prototypical Haldane-Holstein model at partial filling of a topological band, strong electron-phonon coupling can instead stabilize topological phases of matter. The electron-phonon coupling plays a double role: it generates the longer-range interactions that correlate the carriers and, in the attractive channel, also binds them into bosonic pairs. For spinful electrons, it pairs opposite spins into charge-$2e$ bipolarons that form a bosonic fractional Chern insulator (FCI) at filling $\\nu=1/2$ with charge-$e$ semionic excitations. Tuning the band topology and the coupling strength maps out a rich phase diagram containing this bosonic FCI, superconductors condensed at the $M$ and $K$ points, and several charge-ordered solids. For spin-polarized electrons, strong coupling instead stabilizes a $C=2$ quantum anomalous Hall crystal (QAHC) at $\\nu=1/3$. Electron-phonon coupling thus emerges as a route to, rather than an obstruction against, topology in partially filled Chern bands.", "url": "https://arxiv.org/abs/2609.14191", "type": "理论+数值", "summary": "1. 该工作利用分数填充的Haldane-Holstein模型，研究电子-声子耦合如何影响陈带拓扑，并发现强耦合可稳定拓扑物态。\n2. 其核心机制是电子-声子耦合的双重作用：既产生长程相互作用以关联载流子，又在吸引通道形成电荷2e双极化子；自旋电子在ν=1/2给出带电荷e半子激发的玻色分数量子陈绝缘体，自旋极化电子在ν=1/3稳定C=2量子反常霍尔晶体，并伴随M/K点超导与多种电荷有序相。\n3. 这表明电子-声子耦合可从拓扑的抑制因素转变为在部分填充陈带中实现拓扑相的新路径。", "summary_source": "deepseek", "authors": [{"name": "Zezhu Wei"}, {"name": "Ang-Kun Wu"}, {"name": "Di Xiao"}, {"name": "Shi-Zeng Lin"}], "featured_authors": [{"name": "Zezhu Wei"}, {"name": "Ang-Kun Wu"}, {"name": "Di Xiao"}, {"name": "Shi-Zeng Lin"}], "author_count": 4}, {"id": "2609.14241", "category": "cond-mat", "title": "The effect of light scattering in cavity electrodynamics: Fresnel equations with decoherence", "abstract": "We consider the effect of light decoherence in a Fabri-Perot (FP) microcavity. We show that, when present, it may significantly change its linear response to the incident this http URL optical properties of the bounding mirrors are described using the classical electrodynamics, and the light scattering causing the phase breaking is treated as a multichannel scattering problem employing a model introduced by Büttiker to describe dephasing in electron transport. We show that the dephasing causes a gradual erosion of the cavity photon mode and thus impedes the formation of molecular polaritons. Consequently, the polaritons signatures in the transmission and absorption optical spectra of the microcavity are fading away as the scattering intensifies.", "url": "https://arxiv.org/abs/2609.14241", "type": "理论", "summary": "1. 该工作研究法布里-珀罗微腔中的光退相干，建立含退相干的菲涅耳方程，以描述其对入射光线性响应的显著改变。\n2. 其关键处理是在镜面仍由经典电动力学描述的前提下，将引起相位破坏的光散射视为多通道散射，并借用比特克电子输运退相干模型，从而把腔模耗散与镜面响应纳入统一框架。\n3. 该模型表明退相干会逐步侵蚀腔光子模并抑制分子极化激元的形成，使透射和吸收谱中的极化激元特征随散射增强而消退，为评估实际微腔中的无序与损耗提供了可检验依据。", "summary_source": "deepseek", "authors": [{"name": "Natalya A. Zimbovskaya"}, {"name": "Abraham Nitzan"}], "featured_authors": [{"name": "Natalya A. Zimbovskaya"}, {"name": "Abraham Nitzan"}], "author_count": 2}, {"id": "2609.14390", "category": "cond-mat", "title": "Reservoir-conditioned virtual returns generate random Liouvillian skin localization in a reciprocal Mott insulator", "abstract": "Directional dissipation can concentrate relaxation modes in space, but connecting this accumulation to controlled microscopic processes in correlated matter requires separating virtual charge motion from spin coherence. We study this connection in a half-filled Hubbard chain with reciprocal hopping and number-conserving, direction-selective returns of virtual doublon--hole defects. Eliminating charge defects and then Mott coherences yields asymmetric spin-exchange rates under an explicit separation of timescales, with full short-chain dynamics supporting the reduction on finite exchange times. Balanced random returns concentrate the stationary population and several low-lying right modes at sample-selected positions rather than a predetermined edge, producing random Liouvillian skin localization despite zero end-to-end logarithmic rate bias. The accumulated rate imbalance determines an exact finite-density hard-core stationary state and a one-particle activated relaxation scale governed by random barriers. This connection between locally calibrated return rates, many-body stationary weights and slow relaxation offers a means of controlling transport in constrained open quantum matter without changing the reciprocal Hamiltonian.", "url": "https://arxiv.org/abs/2609.14390", "type": "理论", "summary": "1. 该工作在半填充Hubbard链（互易Mott绝缘体）中，研究粒子数守恒、方向选择的虚双占-空穴缺陷返回如何分离虚电荷运动与自旋相干，并建立储层条件与开量子多体动力学的联系。\n2. 其核心在于消去电荷缺陷与Mott相干性后，在时间尺度分离下得到非对称自旋交换率，短链全动力学支持该约化；平衡随机返回将稳态布居和若干低能右模局域于样本选定位置，产生随机Liouvillian趋肤局域，即便端到端对数速率偏置为零。\n3. 累积速率失配进一步给出有限密度硬核稳态的精确形式及随机势垒控制的单粒子激活弛豫标度，表明可在不改变互易Hamiltonian的前提下，通过局域标定返回率调控受限开放量子物质的输运。", "summary_source": "deepseek", "authors": [{"name": "Y. T. Wang"}, {"name": "X. Z. Zhang"}, {"name": "W. M. Liu"}], "featured_authors": [{"name": "Y. T. Wang"}, {"name": "X. Z. Zhang"}, {"name": "W. M. Liu"}], "author_count": 3}, {"id": "2609.14540", "category": "cond-mat", "title": "Anisotropic Nanoparticle Rejamming Triggers Thermodynamic Cavitation in Elastomer Nanocomposites", "abstract": "Nanoparticles can dramatically reinforce elastomers while paradoxically causing cavitation at lower strains. Despite decades of research, the microscopic origin of this behavior has remained unsettled. Here, molecular dynamics simulations reveal that cavitation and failure arise from the nanoparticulate reinforcement mechanism itself. Initial jamming of the nanoparticulate network leads to a buildup of negative pressure in the elastomer matrix, reinforcing it and simultaneously driving it towards a cavitation limit. This crisis is initially averted by yield of the particle network. However, an anisotropic rejamming event of the nanoparticles ultimately drives a runaway negative pressure buildup that leads to cavitation and failure. These results identify nanoparticle-network-induced thermodynamic cavitation as the origin of void formation in elastomeric nanocomposites, and they establish collective filler dynamics as a potential point of control of ultimate failure.", "url": "https://arxiv.org/abs/2609.14540", "type": "理论+数值", "summary": "1. 该工作利用分子动力学模拟揭示，纳米粒子增强弹性体纳米复合材料中的空化与失效并非外因，而是源于纳米颗粒增强机制本身。\n2. 其核心物理图像是粒子网络的初始堵塞在弹性体基体中积累负压，既增强基体又把体系推向空化极限，该危机先被粒子网络屈服缓解，但随后各向异性再堵塞导致负压失控并触发空化与失效。\n3. 这些结果将空洞形成归因于纳米粒子网络诱导的热力学空化，并确立集体填料动力学作为调控最终失效的潜在控制点，为设计更韧弹性体纳米复合材料提供微观启示。", "summary_source": "deepseek", "authors": [{"name": "Harshad Bhapkar"}, {"name": "Pierre Kawak"}, {"name": "David S. Simmons"}], "featured_authors": [{"name": "Harshad Bhapkar"}, {"name": "Pierre Kawak"}, {"name": "David S. Simmons"}], "author_count": 3}, {"id": "2609.14541", "category": "cond-mat", "title": "Phase ordering kinetics in Light-Heavy-Vacancy model: unusual coarsening dynamics", "abstract": "We study a one dimensional lattice model of coupled driven system where two kinds of hardcore particle species, `light' and `heavy', move on a fluctuating landscape. Light particles prefer to move upward along the local height gradient of the landscape, and heavy particles prefer to move downhill. In addition, these particle species also exert bias on the local height profile. The unoccupied or vacant parts of the landscape experience no bias and undergo symmetric height fluctuations. In an earlier work, we had derived a phase diagram of the system consisting of different kinds of ordered and disordered phases. In the ordered phase, one or both particle species phase-separate, while the landscape forms a large hill or deep valley. Here we study coarsening by monitoring the development of long-range order in the particles and landscape from an initially disordered state. Unlike conventional phase-ordering systems, where coarsening proceeds through the formation and merger of ordered domains, here we find that domains formed at early times become unsustainable at later times. Instead of merging together, these early domains disintegrate and new domains emerge which finally give rise to large scale ordered structure in the long time limit, resulting a highly unusual coarsening behavior. For particle coarsening, the characteristic length scale grows with two distinctly different power law exponents at early and late times. The landscape coarsening is even more dramatic where the length scale decreases for brief time-intervals, instead of increasing continuously. The height fluctuations of the landscape shows periodic oscillations with time during the coarsening phase. Using linear hydrodynamics we explain that this is caused by three normal modes which move through the system like travelling waves. We calculate the propagation velocities of these modes within mean field approximation.", "url": "https://arxiv.org/abs/2609.14541", "type": "理论+数值", "summary": "1. 该工作在一维轻重空位格点模型中，研究轻、重硬核粒子与起伏高度场耦合时的相有序动力学，并监测从无序初态到长程有序的粗化过程。\n2. 其关键物理机制在于早期有序畴并非合并而是失稳分解、随后新畴重组；粒子特征长度在早、晚期呈两种幂律增长，景观长度可短暂减小，高度涨落周期性振荡，可由三支行波型线性流体力学模式解释。\n3. 这为存在非平衡驱动与粒子—景观反馈的相有序体系提供新范式，提示线性模式可决定粗化标度，并需在更高维、实验平台及参数区间中检验其普适性。", "summary_source": "deepseek", "authors": [{"name": "Chandradip Khamrai"}, {"name": "Sakuntala Chatterjee"}], "featured_authors": [{"name": "Chandradip Khamrai"}, {"name": "Sakuntala Chatterjee"}], "author_count": 2}, {"id": "2609.14550", "category": "cond-mat", "title": "Statistical Landscape Exploration and Weak-Field Defects in Selective Oscillator Ising Machines", "abstract": "Oscillator Ising machines (OIMs) provide an analog dynamical approach to combinatorial optimization, but comparatively little is known about the statistical structure of the ensembles they generate. Using the Sherrington-Kirkpatrick (SK) spin-glass model, we introduce a selective oscillator scheme, OIM+, in which successive annealing epochs are combined with energy-based elimination and repopulation of replicas. We characterize the resulting states through overlap distributions, Hamming distances, hierarchical clustering, and local-field statistics. OIM+ explores structured low-energy regions while retaining a nontrivial ensemble of configurations despite repeated selection. We identify sparse weak-local-field residual defects as a characteristic limitation of the dynamics. A short Metropolis-Hastings refinement preferentially corrects these defects, indicating that the oscillator dynamics performs the dominant collective exploration while the remaining corrections are predominantly local. The weak fields arise mainly from cancellation among competing interaction terms rather than uniformly weak couplings. The same behavior persists for an antiferromagnetically biased SK ensemble, where the hybrid method reaches a pooled mean energy comparable to a substantially longer pure Metropolis anneal. The complete protocol also achieves competitive performance on standard G-set Max-Cut benchmarks. These results suggest a natural division of labor between collective analog search and targeted local refinement.", "url": "https://arxiv.org/abs/2609.14550", "type": "理论+数值", "summary": "1. 该工作基于SK自旋玻璃模型，提出选择性振荡器方案OIM+，将连续退火历元与按能量淘汰和复制副本结合，统计刻画其构型系综。\n2. 其卖点在于结合重叠分布、Hamming距离、层次聚类与局域场统计，揭示低能区非平庸系综及稀疏弱局域场残余缺陷源于竞争项相消，短Metropolis精修可优先修正。\n3. 这暗示模拟集体搜索与定向局域精修可自然分工，混合协议在反铁磁偏置SK与G-set Max-Cut上具竞争力，并可媲美显著更长的纯Metropolis退火。", "summary_source": "deepseek", "authors": [{"name": "Ömer Önder"}, {"name": "Aydın Cem Keser"}], "featured_authors": [{"name": "Ömer Önder"}, {"name": "Aydın Cem Keser"}], "author_count": 2}, {"id": "2609.14556", "category": "cond-mat", "title": "Conserved quantities in a bosonic tight-binding chain with non-Hermitian quartic terms", "abstract": "We investigate local conserved quantities in non-Hermitian bosonic lattice systems whose underlying Yang--Baxter structure remains unclear. Focusing on a one-dimensional bosonic chain with quartic interactions of creation operators, we provide a new representation of the local conserved quantities previously constructed by Sanatani and Shiraishi. Using Fourier transformation and trigonometric identities, we systematically derive these conserved quantities and show directly that they form a mutually commuting family. We further extend the construction to interactions extending beyond a single site, cubic interactions, asymmetric hopping, and an on-site potential. Our results provide a unified framework for constructing and characterizing local conserved quantities in this class of non-Hermitian many-body systems.", "url": "https://arxiv.org/abs/2609.14556", "type": "理论", "summary": "1. 该工作研究非厄米玻色格点体系中的局部守恒量，聚焦一维玻色链中产生算符构成的四体相互作用，并为此前所得局部守恒量提供新表示。\n2. 其关键推进在于借助傅里叶变换与三角恒等式系统推导这些守恒量，并直接证明它们构成相互对易族；这在杨-巴克斯特结构尚不明确时尤为重要。\n3. 该构造可推广至跨格点相互作用、三体相互作用、非对称跃迁以及在位势，为这类非厄米多体系统提供统一的局部守恒量构造与刻画框架。", "summary_source": "deepseek", "authors": [{"name": "Tetsuya Iwasaki"}, {"name": "Hosho Katsura"}], "featured_authors": [{"name": "Tetsuya Iwasaki"}, {"name": "Hosho Katsura"}], "author_count": 2}, {"id": "2609.14586", "category": "cond-mat", "title": "A New Framework for Interfacial Statistics: Exact n-Point Correlations of Gaussian Level Sets", "abstract": "We derive exact analytical expressions for higher-order correlations of Gaussian level-set interfaces, establishing a direct link between bulk field statistics and interface geometry. This framework enables efficient reconstruction of disordered media, detailed modeling of {Gaussian foams}---structured, double-thresholded interfaces with tunable morphology---and analysis of {memory-enhanced anisotropy} reflecting directional persistence in surface structure. These results open new possibilities for characterizing complex transport, guiding stochastic reconstructions, designing materials with desired properties, quantifying the information content of correlation functions and modelling directional processes on irregular boundaries.", "url": "https://arxiv.org/abs/2609.14586", "type": "理论", "summary": "1. 该工作推导了高斯随机场水平集界面的任意n点关联函数的精确解析表达式，在高斯场体统计量与界面几何之间建立了直接联系。\n2. 其核心卖点在于无需近似即可刻画高阶界面关联，并据此构建了可调形貌的双阈值\"高斯泡沫\"模型与反映表面方向持续性的记忆增强各向异性描述。\n3. 该框架为无序介质的随机重构、复杂输运表征、按需材料设计以及关联函数信息量的定量评估提供了统一且可推广的分析工具。", "summary_source": "deepseek", "authors": [{"name": "Aleksei M. Cherkasov"}, {"name": "Kirill M. Gerke"}, {"name": "Aleksey Khlyupin"}], "featured_authors": [{"name": "Aleksei M. Cherkasov"}, {"name": "Kirill M. Gerke"}, {"name": "Aleksey Khlyupin"}], "author_count": 3}, {"id": "2609.14609", "category": "cond-mat", "title": "Why 2D Models Fail to Capture Flow Properties in 3D Heterogeneous Media: A Connectivity Perspective", "abstract": "We analyze how the equivalent hydraulic conductivity, $K_{eq}$, varies with the coarsening scale $\\lambda/I$ in 2D and 3D heterogeneous media. Their local hydraulic conductivity, $k({\\bf r})$, follows a lognormal distribution in all cases, while spatial connectivity of $k({\\bf r})$ ranges from high (HCS), through intermediate or multi-Gaussian (ICS) and low (LCS), to unstructured (NS). Using a stochastic approach, we characterize the full distribution $P[\\log(K_{eq})]$, and its moments: mean $\\langle K_{eq}\\rangle$, log-variance $\\sigma_{\\log(K_{eq})}^{2}$, and log-skewness $\\gamma_{\\log(K_{eq})}$, as a function of $\\lambda/I$. Significant contrasts appear between 2D and 3D, which we interpret in terms of two key factors associated with spatial dimensionality. We observe that, compared with ICS, LCS and HCS exhibit two distinct features: existing analytical expressions for coarse-graining of $k({\\bf r})$ in multi-Gaussian media do not apply, while $P[\\log(K_{eq})]$ deviates from Gaussian at all scales $\\lambda/I$. Critical path analysis is then used to quantify the connectivity of our samples, and show that $K_{eq}$ exhibits a power-law dependence on it. Our results reveal that connectivity can lead to substantial differences between 2D and 3D macroscopic flow properties, even for the same geostatistical parameters, highlighting the severe limitations of using 2D models to represent 3D flows.", "url": "https://arxiv.org/abs/2609.14609", "type": "理论", "summary": "1. 该工作用随机方法系统比较了二维与三维非均质介质中等效水力导度 K_eq 随粗化尺度 λ/I 的变化，并针对高、中、低及无结构空间连通性表征 P[log K_eq] 及其均值、对数方差和对数偏度。\n2. 其核心发现在于：与多高斯介质不同，低连通和高连通介质的粗化解析式失效，且 P[log K_eq] 在所有尺度偏离高斯；临界路径分析进一步表明 K_eq 对连通性呈幂律依赖，而二维与三维差异源于维度相关的两个关键因素。\n3. 这意味着即使地质统计参数相同，连通性也
