v controls, rather than preparation of one final state. A connected-chain protocol tests effective reservoir support through calibrated finite-time emission. Full system-auxiliary propagation then bounds conditional fidelity and target yield for every one-particle input. A coherent controller that accurately prepares the selected endpoint fails this propagator test. A singular-value bound excludes every unitary realization of the same conditional map. These results connect local reservoir access to a measurable loss cost for prescribed dynamics.", "url": "https://arxiv.org/abs/2609.13496", "type": "理论+数值", "summary": "1. 该工作构建相位可控的立方根SSH链，研究储库相干可寻址模式数如何决定非厄米动力学所需的最小损耗。\n2. 关键卖点是三模式储库可在整个相图达到无限制被动阈值，并在调谐点将最小配对支持损耗减半，且该界约束含时马尔可夫控制下的精确条件轨迹而非仅末态。\n3. 由此将储库局部访问能力与给定动力学的可测损耗代价相联系，为条件轨迹实现、控制协议验证及非厄米动力学模拟提供定量判据。", "summary_source": "deepseek", "authors": [{"name": "Alena Mastiukova"}], "featured_authors": [{"name": "Alena Mastiukova"}], "author_count": 1}, {"id": "2609.13505", "category": "quant-ph", "title": "Heuristic Quantum Amplitude Amplification: A Traffic QUBO Case Study", "abstract": "Quantum Amplitude Amplification (QAA), the generalization of Grover's algorithm, is well-positioned for combinatorial optimization and is particularly promising for Quadratic Unconstrained Binary Optimization (QUBO) problems. QAA is appealing due to its ability to drive the quantum system to a target state, yielding the globally optimal solution with probability over $90$+%. However, realizing QAA for application-scale optimization currently exceeds quantum hardware capacity, which is further compounded by unresolved algorithmic challenges regarding the choice of free parameters. In this study, we address these issues by utilizing a realistic traffic flow QUBO problem to investigate the implementation of QAA as a heuristic solver. Specifically, allowing the diffusion operator parameter to take non-$\\pi$ values expands the capabilities of QAA. This unlocks a new multiple-shot, low-iteration strategy that aims for a high cumulative probability rather than maximizing the probability of a single basis state. Using $25$-qubit simulations, our results demonstrate that heuristic QAA addresses two of the main challenges cited in previous studies. Firstly, heuristic QAA works even at a single iteration, reducing circuit depth by orders of magnitude compared to standard QAA. And secondly, we show that the problem-dependent parameters necessary for reaching optimal algorithmic performance can be reliably approximated with minimal upfront classical computing overhead.", "url": "https://arxiv.org/abs/2609.13505", "type": "数值", "summary": "1. 该工作以实际交通流QUBO问题为案例，将量子振幅放大（QAA）作为启发式求解器，在25量子比特模拟中考察其实现方式与参数选择。\n2. 其核心在于允许扩散算子参数偏离π，从而采用多次采样、低迭代策略最大化累积成功概率而非单一基态概率，使单次迭代即可运行并将线路深度较标准QAA降低若干数量级，同时可用极少经典预计算可靠近似问题相关参数。\n3. 这表明启发式QAA可缓解应用尺度优化中硬件深度与自由参数两大瓶颈，为近期量子设备求解组合优化及后续实验与算法设计提供可行路线。", "summary_source": "deepseek", "authors": [{"name": "Kip Nieman"}, {"name": "Daniel Koch"}], "featured_authors": [{"name": "Kip Nieman"}, {"name": "Daniel Koch"}], "author_count": 2}, {"id": "2609.13550", "category": "quant-ph", "title": "An entropic characterization of Haag duality", "abstract": "Motivated by Haag duality in quantum spin systems, we show that Haag duality for a pair of commuting factors generated by increasing sequences of finite-dimensional matrix algebras is equivalent to the asymptotic vanishing of a suitable conditional mutual information. For two-dimensional spin systems, let an annulus separate a finite region from the exterior. Haag duality then holds for a region $A$ if and only if the mutual information of the inner region and the exterior, conditioned on the part of $A$ inside the annulus, vanishes as the outer radius becomes large. As a corollary, assuming a strict area law with subleading corrections, Haag duality holds for single cones, and it holds for unions of two or more disjoint cones precisely when the topological entanglement entropy vanishes. For translation-invariant pure states on spin chains, half-chain Haag duality is equivalent to vanishing entropy density.", "url": "https://arxiv.org/abs/2609.13550", "type": "理论", "summary": "1. 该工作证明，对于由有限维矩阵代数递增序列生成的两个对易因子，Haag 对偶等价于相应条件互信息的渐近消失。\n2. 在二维自旋系统中，令环带分隔有限区域与外部，则内部区域与外部在环带内 A 部分条件下的互信息随外半径消失，当且仅当 A 满足 Haag 对偶；自旋链半链情形则等价于熵密度为零。\n3. 作为推论，在带次领头修正的严格面积律下，单锥满足 Haag 对偶，而两个及以上不相交锥的并仅当拓扑纠缠熵为零时成立，为以纠缠量判定对偶与拓扑序提供依据。", "summary_source": "deepseek", "authors": [{"name": "Ruizhi Liu"}, {"name": "Lauritz van Luijk"}], "featured_authors": [{"name": "Ruizhi Liu"}, {"name": "Lauritz van Luijk"}], "author_count": 2}, {"id": "2609.13600", "category": "quant-ph", "title": "Braid map definition of SLH-networks and the series product", "abstract": "This article investigates a cascade of quantum systems within an SLH-network. The SLH-network is defined rigorously by using the so-called braid-map. An expression is derived for the time-evolution of the network with finite delay. The series product is retrieved in the instantaneous feed-forward limit.", "url": "https://arxiv.org/abs/2609.13600", "type": "理论", "summary": "1. 该文用辫映射严格定义SLH网络，并针对有限延迟推导网络的时间演化表达式。\n2. 其核心在于辫映射提供的严格构造，使有限延迟级联的时间演化可显式表达，并在瞬时前馈极限下还原串联积。\n3. 这为含有限延迟量子网络的级联提供统一框架，并表明串联积对应瞬时前馈的理想极限。", "summary_source": "deepseek", "authors": [{"name": "Luc Bouten"}], "featured_authors": [{"name": "Luc Bouten"}], "author_count": 1}, {"id": "2609.13749", "category": "quant-ph", "title": "Time domain non-linear quantum interferometry", "abstract": "Interferometry is a powerful method for studying many fundamental phenomena ranging from gravitational waves to anyon excitations. Besides loss of coherence in the interferometer paths, quantum mechanics sets an incompressible bound for linear interferometry arising from the quantum noise of the light beam, called the shot noise limit. Here, we implement a non-linear quantum interferometer that uses a microwave cavity and a magnetic field resilient anharmonic superconducting quantum circuit made of granular aluminum. The circuit enables interferometry beyond the shot noise limit. A direct application of our findings is the detection of dark matter (axions or dark photons), high-frequency gravitational waves or astronomical masers.", "url": "https://arxiv.org/abs/2609.13749", "type": "理论", "summary": "1. 该工作实现了基于微波腔与颗粒铝耐磁场非谐超导量子电路的时域非线性量子干涉仪。\n2. 其技术卖点是以非谐超导电路引入非线性，使干涉测量突破线性干涉仪的散粒噪声极限。\n3. 该结果可直接用于探测轴子/暗光子暗物质、高频引力波和天文脉泽。", "summary_source": "deepseek", "authors": [{"name": "C. Fruy"}, {"name": "A. Théry"}, {"name": "B. Hue"}, {"name": "W. Legrand"}, {"name": "L. Jarjat"}, {"name": "J. Craquelin"}, {"name": "M.R. Delbecq"}, {"name": "A. Cottet"}, {"name": "T. Kontos"}], "featured_authors": [{"name": "C. Fruy"}, {"name": "A. Théry"}, {"name": "B. Hue"}, {"name": "M.R. Delbecq"}, {"name": "A. Cottet"}, {"name": "T. Kontos"}], "author_count": 9}, {"id": "2609.13790", "category": "quant-ph", "title": "Binary Optimization with Complex Constraints via Quantum Approximate Multi-Objective Optimization", "abstract": "We show that a class of binary optimization problems with complex non-quadratic objectives or constraints can be reformulated as multi-objective quadratic unconstrained binary optimization problems. When the objective and constraints depend on a small number of quadratic features and are monotone with respect to their preferred directions, at least one globally optimal solution lies in the Pareto set of the associated MO-QUBO. This enables the constraints to be evaluated classically on Pareto-optimal candidates rather than encoded as penalties. We demonstrate the approach for binary portfolio optimization under a Conditional Value-at-Risk constraint. Using Quantum Approximate Multi-Objective Optimization on an illustrative 100-asset instance, we approximate the mean-variance Pareto front using an IBM Quantum computer and derive mean-CVaR fronts through classical post-processing. The hardware results recover the overall structure of the classical front and yield near-optimal feasible portfolios for different risk bounds.", "url": "https://arxiv.org/abs/2609.13790", "type": "理论+数值", "summary": "1. 该工作把含非二次目标或复杂约束的二进制优化重写为多目标QUBO，并在100资产CVaR约束投资组合上用量子近似多目标优化验证。\n2. 当目标与约束只依赖少数二次特征且对偏好方向单调时，全局最优解之一位于MO-QUBO的Pareto集，故约束可在Pareto候选上经典评估而非作惩罚项。\n3. 该途径避免惩罚编码、把复杂约束转为Pareto候选的经典评估，初步表明量子-经典多目标优化可用于CVaR等风险约束组合。", "summary_source": "deepseek", "authors": [{"name": "Andres Ruiz"}, {"name": "Soumyadip Ghosh"}, {"name": "Stefan Woerner"}], "featured_authors": [{"name": "Andres Ruiz"}, {"name": "Soumyadip Ghosh"}, {"name": "Stefan Woerner"}], "author_count": 3}, {"id": "2609.13839", "category": "quant-ph", "title": "What Output-Equivalence Oracles Miss: An Empirical Study of Equivalence-Invisible Bug Fixes in Quantum Transpilers (Qiskit, tket, Cirq)", "abstract": "Quantum compilers are judged correct by an output-equivalence oracle: the compiled circuit must compute the same unitary as the original, modulo global phase and a qubit-layout permutation. This oracle, by construction, checks only that semantic map, not the circuit's own layout, permutation, or phase records: a defect there, or in a fixed-seed run's determinism, can pass unseen though the record is public. We measure how often this happens in real merged compiler fixes: a systematically identified corpus of Qiskit transpiler bug-fixes, classified by an independently dual-coded, source-validated manifestation taxonomy. Nineteen of 68 fixes (28%, 95% Wilson CI 19-40%) repair faults that this equivalence screen does not catch, even one augmented with compilation-validity, circuit-quality, and performance checks. A secondary wider-window robustness sample produced a nearly identical fraction (29/104, 27.9%, CI 20-37%). A conservative floor remains even restricted to the one unconditionally equivalence-invisible channel (a corrupted layout or permutation record): 10 of 68 fixes (15%, CI 8-25%) beneath the 28% headline. The gap is not Qiskit-specific: it replicates in tket (7 of 21, 33%), with Cirq smaller but consistent. We detected no systematic differences on five inexpensive PR-level characteristics (19 vs 49, underpowered to rule out a modest true difference). This class dominates the invisible set, concentrating at representation-boundary crossings. We release the corpus, codebook, and coding artifacts. Here we only measure it.", "url": "https://arxiv.org/abs/2609.13839", "type": "理论", "summary": "1. 该工作构建并双编码校验了Qiskit、tket与Cirq转译器已合并缺陷修复语料，量化输出等价性预言机漏检的等价不可见缺陷比例。\n2. 其核心发现是：68个Qiskit修复中19个（28%，95% Wilson置信区间19–40%）即使加入编译有效性、电路质量与性能检查仍未被察觉，仅布局或排列记录损坏这一无条件不可见通道仍有10/68（15%），tket复现为7/21（33%），Cirq较小但一致。\n3. 这表明仅验证输出等价性会系统性遗漏表示边界处的记录类缺陷，需将布局、排列、相位记录及固定种子确定性纳入验证，公开语料与码本为后续研究提供基础。", "summary_source": "deepseek", "authors": [{"name": "Furqan Nasir"}, {"name": "Arif Shah"}, {"name": "Iftikhar Alam"}], "featured_authors": [{"name": "Furqan Nasir"}, {"name": "Arif Shah"}, {"name": "Iftikhar Alam"}], "author_count": 3}, {"id": "2609.13863", "category": "quant-ph", "title": "Open Quantum Systems", "abstract": "Open quantum systems describe quantum systems that interact unavoidably with their environments. These notes introduce the physical origins of decoherence and dissipation in realistic settings, developing the theoretical framework of reduced dynamics and quantum master equations within the connection to thermodynamics in the quantum regime. Additionally, a set of relevant exercises are proposed to reinforce the acquisition of knowledge. The text equips readers with the tools to model and analyze open quantum dynamics.", "url": "https://arxiv.org/abs/2609.13863", "type": "理论", "summary": "1. 该文围绕开放量子系统，系统梳理退相干与耗散在真实环境中的物理起源，并构建约化动力学与量子主方程的理论框架。\n2. 其核心贡献在于将环境诱导的非幺正演化、约化密度矩阵描述和量子主方程统一到开放系统框架，并明确关联量子热力学，辅以配套习题强化掌握。\n3. 这为建模和分析开放量子动力学提供可直接使用的工具，并为真实量子平台中退相干、耗散及量子热力学效应的后续研究提供启发。", "summary_source": "deepseek", "authors": [{"name": "Erik Torrontegui"}, {"name": "Ricardo Puebla"}], "featured_authors": [{"name": "Erik Torrontegui"}, {"name": "Ricardo Puebla"}], "author_count": 2}, {"id": "2609.13870", "category": "quant-ph", "title": "Hiai--Petz Skew Informations and Sharp Uncertainty Relations for a Single Observable", "abstract": "We study intrinsic quantum uncertainty associated with a single observable from the viewpoint of skew information. By relaxing ordinary additivity while retaining the other fundamental uncertainty requirements, we introduce a class of Hiai--Petz nonadditive skew informations that contains Hansen's metric-adjusted skew informations as the boundary case $\\theta=1$. Our main quantitative result is a sharp single-observable uncertainty relation for the full Hiai--Petz class. For a fixed state, the optimal coefficient depends only on its largest and smallest eigenvalues and remains sharp even after the maximal classical contribution to the variance is retained. The general theorem yields, as special cases, sharp bounds for metric-adjusted skew informations, the SLD quantum Fisher information, and the power-commutator family. We further show that $K_s(\\rho,A)=\\frac12\\|[\\rho^s,A]\\|_{\\mathrm{HS}}^2$, $1/2\\le s<1$, is realized within the Hiai--Petz framework through Stolarsky operator means, thereby establishing its convexity for $1/2<s<1$. More generally, for each fixed operator monotone function $f$, the Hiai--Petz spectral kernel interpolates geometrically between the metric-adjusted skew information $I^f$ and the common endpoint $K_1$. The resulting family obeys an exact power-trace-weighted composition law, replacing ordinary additivity in the interior $0<\\theta<1$.", "url": "https://arxiv.org/abs/2609.13870", "type": "理论", "summary": "1. 该工作围绕《Hiai--Petz Skew Informations and Sharp Uncertainty Relations for a Single Observable》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Gen Kimura"}], "featured_authors": [{"name": "Gen Kimura"}], "author_count": 1}, {"id": "2609.14019", "category": "quant-ph", "title": "Conditional Quantum Flow Matching for Data-Scarce Physiological Signal Augmentation", "abstract": "Generative augmentation is a standard remedy for label scarcity in physiological signal classification, but existing quantum generative models start from uninformative noise, ignoring class structure that is already available. We propose Conditional Quantum Flow Matching (CQFM): a single 306-parameter circuit, conditioned on both flow time and class label, transports a compact class-conditional prior toward the target distribution. Quantum flow matching as published is unconditional, so this is to our knowledge the first conditional one, and the first EEG augmentation on a parameterized quantum circuit. A nonnegative spectral embedding removes the need for tomography at readout. On BCI Competition IV-2a, starting from a prior rather than noise is worth $+5.1$ accuracy points over QuDDPM (9/9 subjects), though at that operating point a class-conditional Gaussian matches CQFM. Where the prior fails the transport earns its keep: given one transferred from other subjects it regains $+7.2$ TSTR points (9/9).", "url": "https://arxiv.org/abs/2609.14019", "type": "理论", "summary": "1. 提出条件量子流匹配CQFM，用单个306参数线路以流时间和类标签为条件，将紧凑类条件先验输运至目标分布，用于稀缺生理信号增强。\n2. 首次实现条件量子流匹配与参数化量子线路上的EEG增强，以非负谱嵌入免除读出层析，尽管该工作点类条件高斯可持平。\n3. 在BCI IV-2a上，先验起点较QuDDPM提升5.1点，先验失配时跨被试输运再获+7.2 TSTR点，凸显数据稀缺场景价值。", "summary_source": "deepseek", "authors": [{"name": "Chi-Sheng Chen"}, {"name": "Samuel Yen-Chi Chen"}], "featured_authors": [{"name": "Chi-Sheng Chen"}, {"name": "Samuel Yen-Chi Chen"}], "author_count": 2}, {"id": "2609.14031", "category": "quant-ph", "title": "No cardinality bound for squashed entanglement", "abstract": "Squashed entanglement is an additive bipartite entanglement measure. For a state $\\rho_{AB}$, it is defined as the infimum of all conditional mutual information $I(A:B\\mid E)$ evaluated on extensions $\\rho_{ABE}$. It was unresolved whether there is a bound on the dimension of the conditioning system, $E$, needed for this optimization. We show that no such cardinality bound is possible. Explicitly, we find that the squashed entanglement for a partially dephased Bell pair on two qubits cannot be achieved for any finite dimensional extension $E$. A crucial ingredient of this proof is a direct sum step, which in a sense, symmetrizes two purifying systems while keeping the conditional mutual information unchanged and the coherence no worse.", "url": "https://arxiv.org/abs/2609.14031", "type": "理论+数值", "summary": "1. 该工作研究压缩纠缠这一可加二分纠缠度量，其定义为扩展态ρ_ABE上条件互信息I(A:B|E)的下确界，并证明优化所需条件系统E的维数不存在有限基数上界。\n2. 其关键卖点是给出两量子比特部分退相干贝尔态的显式反例，证明其压缩纠缠无法由任何有限维E达到；证明中引入直和步骤，对称化两个纯化系统而保持条件互信息不变且不损害相干性。\n3. 这意味着计算压缩纠缠时不能先验限制条件系统的维数，相关数值方法与理论分析须显式处理无限维E，并可能促使人们重新审视其他纠缠度量的基数问题及其操作解释。", "summary_source": "deepseek", "authors": [{"name": "Rabsan Galib Ahmed"}, {"name": "Graeme Smith"}], "featured_authors": [{"name": "Rabsan Galib Ahmed"}, {"name": "Graeme Smith"}], "author_count": 2}, {"id": "2609.14070", "category": "quant-ph", "title": "Formulating Multistage Cutting Stock Problems as QUBO", "abstract": "Cutting stock problems are of large relevance to a variety of industry branches. Here, we present a linear programming formulation for a restricted version of the multistage 2D cutting stock problem with Guillotine cuts and test it on published benchmark instances. After this, we derive a non-exact reformulation in quadratic unconstrained binary optimization (QUBO) form via unbalanced penalization, which we show to have possible benefits in modeling the problem with usable leftovers. This work mainly considers the restricted formulation, in which the dimensions of each cut are determined by those of a single required piece. We further discuss how the approach can be extended to the unrestricted problem, which allows more general cutting patterns involving cuts with dimensions of multiple required pieces and naturally gives rise to quadratic terms in the inequalities of the problem formulation. We showcase solutions via a Simulated Annealing solver for the restricted problem class, where we mainly study the performance of the iterative augmented Lagrangian method. We also discuss possible applications of Quantum Annealing in this setting, as a strong motivation to research QUBO formulations.", "url": "https://arxiv.org/abs/2609.14070", "type": "理论+数值", "summary": "1. 该工作针对闸刀式切割的多阶段二维切割库存问题，给出限制版本的线性规划表述并在公开基准实例上测试，又通过非平衡惩罚导出二次无约束二值优化（QUBO）的非精确重构。\n2. 其技术卖点在于该QUBO形式便于建模可用余料，并可借多零件尺寸切割引发的二次不等式项推广至非限制切割模式；作者以模拟退火求解限制类，重点评估迭代增广拉格朗日方法，同时讨论量子退火的应用前景。\n3. 这为把多阶段切割库存问题接入退火与量子退火求解框架提供了可行思路，但当前结论受限制表述和非精确罚化约束，后续应检验非限制扩展及工业余料场景的实际收益。", "summary_source": "deepseek", "authors": [{"name": "Marcel Seelbach Benkner"}, {"name": "Chiara Capecci"}, {"name": "Sebastian Nagies"}, {"name": "Javed Akram"}, {"name": "Sebastian Rubbert"}, {"name": "Dimitrios Bantounas"}, {"name": "Philipp Hauke"}, {"name": "Michael Johanning"}, {"name": "Michael Moeller"}], "featured_authors": [{"name": "Marcel Seelbach Benkner"}, {"name": "Chiara Capecci"}, {"name": "Sebastian Nagies"}, {"name": "Philipp Hauke"}, {"name": "Michael Johanning"}, {"name": "Michael Moeller"}], "author_count": 9}, {"id": "2609.14110", "category": "quant-ph", "title": "Torsion detection in clique complexes is conditionally $QMA_1$-hard", "abstract": "Quantum algorithms for topological data analysis compute Betti numbers, the ranks of the homology groups of a simplicial complex, which can be read off from the kernel of a combinatorial Laplacian. Deciding whether a Betti number of a clique complex is nonzero is $QMA_1$-hard, and remains so under a spectral gap promise on vertex-weighted graphs. Integral homology, however, contains information inaccessible to the Laplacian spectrum. A new part that appears in integral homology is torsion: cycles that become boundaries only after being traversed several times, as in a projective plane or a Klein bottle. We ask how hard it is to detect torsion, and we answer with a simple reduction. We attach to an arbitrary clique complex a fixed $31$-vertex triangulation of the projective plane. The $k$th mod-$2$ Betti number of the input then reappears as $2$-torsion two degrees up, while all rational homology disappears and every combinatorial Laplacian acquires a constant spectral gap. We conclude that detecting torsion in clique complexes of unweighted graphs is $NP$-hard, even under a constant gap promise, and that it is $QMA_1$-hard if mod-$2$ clique homology is.", "url": "https://arxiv.org/abs/2609.14110", "type": "理论+数值", "summary": "1. 该工作研究团复形中整同调挠元的检测难度，并利用附加固定31顶点射影平面三角剖分的归约来分析其复杂度。\n2. 该归约把输入的第k个模2贝蒂数上移两阶变为2-挠元，同时消去有理同调并令所有组合拉普拉斯算子具有常数谱隙。\n3. 由此可知无权图团复形中的挠元检测在常数谱隙承诺下仍为NP难，且若模2团同调为QMA_1难则挠元检测亦条件性QMA_1难。", "summary_source": "deepseek", "authors": [{"name": "Adam Wesołowski"}], "featured_authors": [{"name": "Adam Wesołowski"}], "author_count": 1}, {"id": "2609.14131", "category": "quant-ph", "title": "Operator Learning with Variational Quantum Circuits", "abstract": "A new methodology is developed for quantum machine learning which enables variational quantum circuits to learn linear and non-linear solution operators to differential equations. This is devised by extending the framework of the DeepONet, a technique for modeling differential equations. The branch and trunk neural networks are replaced by variational quantum circuits, leveraging the quantum universal approximation theorem. The methodology is tested on several differential equations and yields low approximation & generalization errors even with shallow circuit depths. In addition, it does not encounter barren plateaus during training. The model displays improved error and parameter scaling relative to the classical DeepONet. This is due to the intrinsic property that the approximation error depends on the dimension of the input function space, rather than the number of sensor locations. A theoretical framework is established in the form of explicit error bounds, which measure the contributions of the truncation, branch, and trunk circuit errors to the total operator approximation error. Full derivations for the error bounds are developed in the norms $L^2$, $L^p$, $C^0$, and Sobolev $H^k$, along with a classical-quantum comparative analysis (as Supplemental Materials).", "url": "https://arxiv.org/abs/2609.14131", "type": "理论+数值", "summary": "1. 该工作提出以变分量子电路替代深度算子网络中分支与主干网络的量子算子学习框架，用于学习微分方程的线性与非线性解算子。\n2. 其核心卖点在于借助量子通用逼近定理，浅层电路即可获得低近似与泛化误差，训练中不出现贫瘠高原，且误差与参数缩放优于经典深度算子网络，因近似误差取决于输入函数空间维度而非传感器数目。\n3. 该框架还建立显式误差界，将截断、分支和主干电路误差分解至总算子逼近误差，并在L2、Lp、C0与Sobolev Hk范数下给出完整推导，为量子算子学习的精度与可扩展性提供理论依据。", "summary_source": "deepseek", "authors": [{"name": "Jorgen Wu"}, {"name": "Masoud Barati"}, {"name": "Peyman Givi"}], "featured_authors": [{"name": "Jorgen Wu"}, {"name": "Masoud Barati"}, {"name": "Peyman Givi"}], "author_count": 3}, {"id": "2609.14203", "category": "quant-ph", "title": "Trace-Norm Overlaps of Quantum States: Interpolation, Equality, and Data-Processing Rigidity", "abstract": "Let $\\rho$ and $\\sigma$ be density operators on a separable Hilbert space. For $0<\\alpha<1$, we study the directed trace-norm overlap $\\Phi_\\alpha(\\rho,\\sigma)=\\|\\rho^\\alpha\\sigma^{1-\\alpha}\\|_1$ and its symmetrized form $\\mathcal F_\\alpha(\\rho,\\sigma)=\\frac12\\bigl(\\Phi_\\alpha(\\rho,\\sigma)+\\Phi_{1-\\alpha}(\\rho,\\sigma)\\bigr)$. At $\\alpha=\\tfrac12$, both quantities coincide with the root Uhlmann--Jozsa fidelity. Our aim is not to introduce a new notion of fidelity, but to understand how these overlaps vary with the parameter and when equality occurs in the resulting inequalities. We first prove that $\\alpha\\mapsto\\Phi_\\alpha(\\rho,\\sigma)$ is log-convex. This yields a sharp lower bound for $\\mathcal F_\\alpha$ in terms of the root fidelity, together with a stronger intermediate geometric-mean bound. We also show that $\\Phi_\\alpha$ is the trace functional $Q_{\\alpha,1/2}$ associated with the $\\alpha$-$z$ Renyi divergence, which connects the directed overlap with the known $\\alpha$-$z$ Renyi theory. We then determine the exact data-processing behavior of the symmetrized family. Universal monotonicity under quantum channels holds only at $\\alpha=\\tfrac12$; for every other value of $\\alpha$, it already fails under diagonal pinching of faithful real qubit states. In finite dimensions, we give a complete spectral description of the equality cases and provide explicit noncommuting examples. We also discuss some natural questions about overlap-preserving maps. Finally, we prove that the difference between the Petz overlap and the directed trace-norm overlap vanishes exactly when $\\rho$ and $\\sigma$ commute, without requiring either faithfulness or any additional support assumption.", "url": "https://arxiv.org/abs/2609.14203", "type": "理论", "summary": "1. 该工作围绕《Trace-Norm Overlaps of Quantum States: Interpolation, Equality, and Data-Processing Rigidity》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Zahra Maleki Khouzani"}, {"name": "Seyed Mahmoud Manjegani"}], "featured_authors": [{"name": "Zahra Maleki Khouzani"}, {"name": "Seyed Mahmoud Manjegani"}], "author_count": 2}, {"id": "2609.14252", "category": "quant-ph", "title": "Efficient expectation value estimation for quantum circuits via extended stabilizer frameworks and adaptive variance estimation", "abstract": "Classical simulability of quantum circuits plays a central role in characterizing and quantifying quantum computational advantage. Typically, the presence of non-Clifford gates introduces an exponential runtime overhead for classically estimating expectation values of observables. In this work, we introduce an efficient simulation framework that integrates the sum-over-Clifford method with quasi-probability-based stabilizer simulation to directly estimate expectation values. To optimize efficiency, we incorporate a circuit-adaptive reduction via variance estimation protocol, which terminates simulations once an empirical confidence bound is sufficient to guarantee the prescribed error tolerance. Our method circumvents overly conservative Hoeffding's inequality, thereby reducing the dependence on the gate-wise stabilizer extent from quadratic to linear in the low-variance regime, while maintaining the same space complexity as previous approaches. We explicitly prove the sample-complexity reduction for random quantum circuits and T-doped Clifford circuits and also empirically validate these advantages in the quantum approximate optimization algorithm and quantum kernel method.", "url": "https://arxiv.org/abs/2609.14252", "type": "理论+数值", "summary": "1. 该工作提出融合克利福德求和法与准概率稳定子模拟的框架，直接估计量子电路可观测量期望值。\n2. 其卖点是用电路自适应方差估计提前终止模拟，以经验置信界保证误差，避开过保守霍夫丁界，并在相同空间复杂度下将低方差区门级稳定子扩展依赖由二次降为线性。\n3. 对随机电路与T门掺杂克利福德电路证明样本复杂度降低，并在量子近似优化算法与量子核方法中实证验证这些优势。", "summary_source": "deepseek", "authors": [{"name": "Yunseo Hwang"}, {"name": "Giwon Song"}, {"name": "Kyoung Keun Park"}, {"name": "Hyukjoon Kwon"}, {"name": "Taehyun Kim"}], "featured_authors": [{"name": "Yunseo Hwang"}, {"name": "Giwon Song"}, {"name": "Kyoung Keun Park"}, {"name": "Hyukjoon Kwon"}, {"name": "Taehyun Kim"}], "author_count": 5}, {"id": "2609.14463", "category": "quant-ph", "title": "Arithmetic of Bohr Frequencies Governs Uniform Mixing in Randomly Timed Quantum Spin Chains", "abstract": "Randomizing the readout time averages the mode interference in a quantum walk. We ask when this makes the site populations of a uniformly coupled $XY$ chain exactly uniform for every initial site. For $N\\ge2$ spins, this is possible when $N+1$ is a power of two, a prime, or twice a prime. It is impossible when $15\\mid(N+1)$, $21\\mid(N+1)$, or $6\\mid(N+1)$ with $N\\ge11$. Uniformity uniquely fixes the averaged cosine coherences according to the mirror parities of the modes. Equal Bohr frequencies can impose incompatible coherence values. We classify these parity collisions using vanishing sums of roots of unity and prove existence in the positive cases through a phase distribution on a torus.", "url": "https://arxiv.org/abs/2609.14463", "type": "理论", "summary": "1. 该工作围绕《Arithmetic of Bohr Frequencies Governs Uniform Mixing in Randomly Timed Quantum Spin Chains》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Musung Kang"}], "featured_authors": [{"name": "Musung Kang"}], "author_count": 1}, {"id": "2609.14519", "category": "quant-ph", "title": "Robustness of Hidden-Variable Theories and Matrix Scaling", "abstract": "Motivated by quantum foundations and complexity theory, Aaronson formalized a hidden-variable theory inspired by a proposal by Schrödinger. To any quantum state and unitary, this Schrödinger theory assigns a joint probability distribution via the Sinkhorn algorithm: rescale the columns and rows of the entrywise modulus of the unitary so that the marginals match the Born rule for the initial and final quantum states, respectively. He conjectured that this map is robust, i.e., inverse polynomially small perturbations in the inputs lead to inverse polynomially small perturbations of the joint distribution, which is important for complexity theoretic applications. We present a counterexample to this conjecture: We construct a pure state and two unitaries that are exponentially close, yet the joint probability distributions assigned by the Schrödinger theory differ by at least an inverse-linear term in at least one entry, and by a constant in total variation distance. We also propose a modified version of Schrödinger's theory that satisfies robustness, while retaining all of its other desirable properties. This yields a complete picture of which axioms of Aaronson can be simultaneously satisfied by hidden-variable theories.", "url": "https://arxiv.org/abs/2609.14519", "type": "理论+数值", "summary": "1. 该工作研究Aaronson形式化的薛定谔型隐变量理论的鲁棒性，通过矩阵缩放/Sinkhorn算法将幺正矩阵逐元素模的行列重标度以匹配Born边缘分布，并否证其鲁棒性猜想、提出修正理论。\n2. 其技术核心是构造反例：一个纯态与两个指数接近的幺正算符，使薛定谔理论分配的联合分布在至少一个条目上相差反比线性量级，总变差距离为常数；同时提出修正版本恢复逆多项式鲁棒性并保留其他优点。\n3. 该结果厘清了Aaronson诸公理在隐变量理论中可同时满足的边界，为量子基础与复杂度理论中的应用、以及矩阵缩放的稳定性分析提供了明确约束与启发。", "summary_source": "deepseek", "authors": [{"name": "Giulio Malavolta"}, {"name": "Harold Nieuwboer"}, {"name": "Akshay Ramachandran"}, {"name": "Michael Walter"}], "featured_authors": [{"name": "Giulio Malavolta"}, {"name": "Harold Nieuwboer"}, {"name": "Akshay Ramachandran"}, {"name": "Michael Walter"}], "author_count": 4}, {"id": "2609.14524", "category": "quant-ph", "title": "Preparation of Multimode NOON States via Floquet-Engineered Conditional Chiral Excitation", "abstract": "The NOON states possess Heisenberg-limited phase sensitivity and are crucial for quantum-enhanced metrology. In our work, we develop a Floquet-engineered conditional-routing framework in which a $d$-level quantum controller mediates the dynamics of $d$ bosonic modes. For an arbitrary odd dimension $d=2s+1$, the $d$-level system can act as a ``quantum knob\" by tuning its initial states to coherently control the direction of chiral excitation flow, such that different controller eigenstates generate distinct cyclic-routing branches of the bosonic excitations. By choosing $s$ harmonics, we construct an exact qudit-controlled cyclic permutation and use it to formulate a general protocol for preparing odd-$d$-mode NOON states. The same framework also enables programmable complex amplitudes through appropriate preparation of the controller state. As concrete realizations, we show that the three-mode case requires only a single harmonic and exhibits two oppositely directed chiral branches together with a stationary branch, whereas the five-mode case requires two harmonics and both nearest- and next-nearest-neighbor chiral hoppings. Meanwhile, taking the three-mode realization as a representative example, we assess the influence of systematic imperfections and dissipation on the conditional-routing dynamics and identify parameter regimes in which the routing operation remains accurate. Our results establish a systematic Floquet construction for controllable chiral routing and multimode NOON-state generation in arbitrary odd-dimensional networks, with potential applications in quantum information processing and quantum metrology.", "url": "https://arxiv.org/abs/2609.14524", "type": "理论", "summary": "1. 该工作围绕《Preparation of Multimode NOON States via Floquet-Engineered Conditional Chiral Excitation》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Mengxue Li"}, {"name": "Bo Tian"}, {"name": "H. Z. Shen"}, {"name": "Haodi Liu"}, {"name": "Gangcheng Wang"}], "featured_authors": [{"name": "Mengxue Li"}, {"name": "Bo Tian"}, {"name": "H. Z. Shen"}, {"name": "Haodi Liu"}, {"name": "Gangcheng Wang"}], "author_count": 5}, {"id": "2609.14529", "category": "quant-ph", "title": "Parameter-Efficient Quantum NLP for Paraphrase Detection: Performance, Robustness, and Entanglement", "abstract": "Rigorous empirical validation of quantum machine learning on natural language tasks remains scarce. We evaluate a 10-qubit hybrid quantum-classical variational circuit (2,148 parameters) for paraphrase detection across three benchmarks: MRPC, Quora Question Pairs (QQP), and adversarial PAWS. On QQP (n = 10 seeds), the circuit achieves 75.53% +/- 0.75%. accuracy, statistically outperforming parameter-matched classical baselines (DeepMLP: p = 0.015, Cohen's d = 1.20; F1: p < 0.001, d = 2.32) and surpassing DistilBERT-4bit with 31,191 fewer parameters. On MRPC the optimal 2-layer variant reaches 92% of BERT-base accuracy at 54,000 lower parameter cost. Circuit depth analysis reveals a dataset-depth scaling effect; entanglement analysis via the Meyer-Wallach measure identifies multi-qubit entanglement as the primary performance driver (r = 0.85 across four variants). Adversarial evaluation on PAWS reveals emergent robustness: 98.2% recall versus 81.6% classical (+16.6 pp, d = 1.24, p < 0.001), without adversarial training. These results constitute the first systematic parameter-matched multi-benchmark empirical validation of hybrid variational circuits for NLP. All results are from classical simulation; hardware validation is future work.", "url": "https://arxiv.org/abs/2609.14529", "type": "理论+数值", "summary": "1. 该工作在MRPC、QQP与对抗PAWS三个基准上系统评测了一个10量子比特混合量子-经典变分线路（2148个参数）的释义检测性能。\n2. 其卖点是参数匹配下统计超越经典基线，Meyer-Wallach纠缠度主导性能（r=0.85），且对抗召回率提升16.6个百分点。\n3. 这为混合变分量子NLP提供了首个参数匹配的多基准实证依据，但结果均来自经典模拟，硬件验证仍是后续方向。", "summary_source": "deepseek", "authors": [{"name": "Farha Nausheen"}, {"name": "Khandakar Ahmed"}, {"name": "Farina Riaz"}], "featured_authors": [{"name": "Farha Nausheen"}, {"name": "Khandakar Ahmed"}, {"name": "Farina Riaz"}], "author_count": 3}, {"id": "2609.14537", "category": "quant-ph", "title": "Controlling quantum state transfer in rooted products", "abstract": "Godsil and McKay (1978) showed that the rooted product is a powerful tool for constructing non-isomorphic cospectral pairs of graphs. Despite lacking a convenient tensor product structure, we show that the rooted product is useful for constructing graphs with good quantum state transfer properties. In particular, we prove a simple transference principle: if a graph $X$ has quantum state transfer and $Y$ is a controllable graph, their rooted product $X^Y$ has quantum state transfer (inherited from $X$). This complements a folklore property of Cartesian product which preserves perfect state transfer. However, the rooted product is a significantly sparser graph and, more importantly, can be easily used to construct efficient high-fidelity state transfer even if $X$ has no quantum state transfer. Our proof exploits the fact that a rooted product creates a large number of strongly cospectral pairs of vertices and that its condition number can be controlled by its pendant subgraph.", "url": "https://arxiv.org/abs/2609.14537", "type": "理论", "summary": "1. 该文将图论中的根积用于量子态传输，证明了若一个图具有量子态传输且另一图为可控图，则其根积可继承来自前者的量子态传输。\n2. 其核心卖点是与笛卡尔积保持完美态传输的经典性质互补：根积更稀疏，并可在原图本身无量子态传输时构造高效高保真传输，证明依赖大量强共谱顶点对及由悬挂子图控制的条件数。\n3. 这为在稀疏或受限耦合网络中设计高保真量子态传输提供了构造原理，并表明强共谱性与条件数可作为图设计的可用资源。", "summary_source": "deepseek", "authors": [{"name": "Addison Ballif"}, {"name": "Christino Tamon"}, {"name": "Gabriel Tucker"}], "featured_authors": [{"name": "Addison Ballif"}, {"name": "Christino Tamon"}, {"name": "Gabriel Tucker"}], "author_count": 3}, {"id": "2609.14621", "category": "quant-ph", "title": "A pretty-tight converse on the classical capacity of generalized amplitude-damping channels", "abstract": "The classical capacity of a quantum channel is the highest rate at which classical information can be transmitted with vanishing error. Although the capacities of many fundamental quantum channels have been established, the capacity of the generalized amplitude-damping channel remains an open problem in quantum Shannon theory. In this work, we revisit a converse bound introduced by Brandão et al. [Phys. Rev. Lett. 106, 230502 (2011)], which upper-bounds the classical capacity in terms of a correlation measure. For the generalized amplitude-damping channel, we derive a relaxation of this measure that makes the converse bound efficiently computable. Numerical comparisons demonstrate that our bound is pretty tight in general and nearly coincides with the Holevo information at nonzero temperatures, significantly improving upon existing bounds across the entire parameter range.", "url": "https://arxiv.org/abs/2609.14621", "type": "理论+数值", "summary": "1. 该工作重新审视 Brandão 等人提出的量子信道经典容量逆定理上界，并针对广义振幅阻尼信道构造了一种可高效计算的关联度量松弛，从而用以界定其经典容量。\n2. 其技术核心是将原有难以计算的关联度量松弛为可处理形式，数值结果表明该上界整体相当紧致，并在非零温度下与 Holevo 信息几乎重合，全参数范围内显著优于现有界。\n3. 这为广义振幅阻尼信道的容量刻画提供了更紧的上界，并表明关联度量松弛方法可推广至其他开放量子信道的容量逆定理研究。", "summary_source": "deepseek", "authors": [{"name": "Kun Fang"}], "featured_authors": [{"name": "Kun Fang"}], "author_count": 1}, {"id": "2609.14626", "category": "quant-ph", "title": "Derivatives of Quantum Randomness: Separating Pseudorandom Unitaries from Pseudorandom (Function-like) States", "abstract": "Quantum computation gives rise to new pseudorandom primitives for states and unitaries, including pseudorandom state generators (PRSGs), pseudorandom function-like state generators (PRFSGs), and pseudorandom unitaries (PRUs). In this paper, we show a full unitary oracle separation between PRFSGs and PRUs. The separation holds between the strongest state notion and the weakest unitary notion: even adaptively secure, quantum-accessible PRFSGs do not imply non-adaptively secure, forward-only PRUs, even when their implementations are allowed to be non-unitary and use an arbitrary number of ancillary qubits. This reveals a fundamental distinction between pseudorandomness for quantum states and for quantum unitaries. Our main technical idea is to view a candidate PRU construction with access to state generation oracles as a map from the underlying oracle states to implemented unitaries, and to study the derivatives of this map. These derivatives are inherently low rank, and we exploit this low-rank structure to distinguish the resulting unitaries from truly random ones. We believe this differential perspective may be useful for studying other structural questions about quantum states and unitaries.", "url": "https://arxiv.org/abs/2609.14626", "type": "理论", "summary": "1. 该工作证明了伪随机函数型量子态生成器与伪随机酉算子之间的完全酉谕示分离：即使自适应安全、量子可访问的状态生成器允许非酉实现和任意辅助量子比特，也不能推出非自适应安全、仅前向的伪随机酉算子。\n2. 其技术卖点在于将访问态生成谕示的候选伪随机酉算子构造视为从谕示态到所实现酉算子的映射，并研究该映射的导数；这些导数本质低秩，可据此把所得酉算子与真随机酉算子区分开。\n3. 这揭示量子态与量子酉算子的伪随机性存在根本区别，且这种微分视角可能有助于研究量子态和酉算子的其他结构性问题。", "summary_source": "deepseek", "authors": [{"name": "Minki Hhan"}], "featured_authors": [{"name": "Minki Hhan"}], "author_count": 1}, {"id": "2609.14632", "category": "quant-ph", "title": "Linear equations mod $n$ are pseudo-telepathic", "abstract": "We prove that the quantum monad in dimension $2n$ admits no natural transformation to the polymorphism clone of linear equations modulo $n$. Consequently, for every $n\\geq 2$, there exists an unsatisfiable system of linear equations over $\\mathbb{Z}_n$ whose constraint system game admits a perfect finite-dimensional quantum strategy. As a corollary, we completely characterise pseudo-telepathic constraint languages in finite dimension. The proof combines a result of Harding, Jager, and Smith on group-valued measures on subspaces of Hilbert spaces with the polymorphism-minion characterisation of quantum pseudo-telepathy.", "url": "https://arxiv.org/abs/2609.14632", "type": "理论", "summary": "1. 该工作证明2n维量子单子到模n线性方程组多态克隆不存在自然变换，由此对每个n≥2构造出不可满足的Z_n线性方程组，其约束系统博弈拥有有限维完美量子策略，并在有限维下完全刻画了伪心灵感应约束语言。\n2. 其技术卖点是把Harding–Jager–Smith关于Hilbert空间子空间群值测度的结果与量子伪心灵感应的多态-minion刻画相结合，以自然变换的不存在性导出量子优势。\n3. 该结论将伪心灵感应约束语言的分类推进为完整定理，提示群值测度与多态克隆工具可用于系统判定更广泛约束系统博弈的量子可满足性。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo Ciardo"}], "featured_authors": [{"name": "Lorenzo Ciardo"}], "author_count": 1}, {"id": "2609.14644", "category": "quant-ph", "title": "Collective-dissipation-controlled thermal rectification and entropy production in a three-terminal three-qubit XXZ spin chain", "abstract": "We investigate thermal rectification and its thermodynamic cost in a three-qubit XXZ spin chain coupled to three thermal reservoirs: two local baths attached to the boundary qubits and a collective bath jointly coupled to the middle and right qubits. This asymmetric dissipative architecture allows the collective environment to actively reshape energy transport. We show that the heat current carried by the collective bath changes sign as its temperature is varied, and that the spin-chain anisotropy provides an effective internal control parameter for suppressing the boundary heat currents. These features yield thermal rectification coefficients of about $3.36\\%$ at maximum bias and up to $20.1\\%$ in the strongly anisotropic regime, although the latter comes at the cost of severely reduced heat currents. Beyond rectification, we evaluate the steady-state entropy production rate and identify a low-irreversibility operating window near the collective-current reversal, whereas increasing the local boundary couplings monotonically raises the thermodynamic cost. Our results establish collective dissipation as a tunable control mechanism for quantum heat transport and uncover a nontrivial trade-off among rectification, heat-current magnitude, and irreversible losses.", "url": "https://arxiv.org/abs/2609.14644", "type": "理论+数值", "summary": "1. 该工作在三量子比特XXZ自旋链中引入两个边界局域热浴和一个同时耦合中、右量子比特的集体热浴，研究热整流及其热力学代价。\n2. 其核心卖点是集体浴所载热流随其温度变号、自旋链各向异性可抑制边界热流，从而在最大偏置和强各向异性区分别实现约3.36%与20.1%的整流系数，并在稳态熵产生率分析中发现近集体热流反转的低不可逆窗口。\n3. 这表明集体耗散可作为量子热输运的可调控制机制，并揭示整流、热流幅度与不可逆损失之间存在非平凡权衡。", "summary_source": "deepseek", "authors": [{"name": "Alireza Nourmandipour"}], "featured_authors": [{"name": "Alireza Nourmandipour"}], "author_count": 1}, {"id": "2609.14707", "category": "quant-ph", "title": "Unique determination and generation of rank two single-qubit quantum channels", "abstract": "An important problem in quantum technologies is the generation of a target evolution of an open quantum system. A core component of this task is the ability to determine whether the actual evolution of the system coincides with the target evolution. For the generation of unitary quantum channels in open quantum systems, it was shown by Goerz, Reich and Koch [New J. Phys. {\\bf 16} 055012 (2014)] that for determining whether the actual evolution coincides with a desired unitary it is sufficient to compare their action on three special density matrices. In this work, we consider controlled generation and unique determination of non-unitary quantum channels in open quantum systems with particular emphasis on rank two single-qubit quantum channels. We prove that to uniquely determine such quantum channels it is sufficient to consider their action on only three suitably chosen density matrices. Based on this theoretical result, we numerically investigate generation of various non-unitary target single-qubit quantum channels in open quantum systems using coherent and incoherent controls.", "url": "https://arxiv.org/abs/2609.14707", "type": "数值", "summary": "1. 该工作针对开放量子系统中非幺正量子信道的受控生成与唯一判定问题，重点研究秩二单量子比特量子信道，并证明仅需考察其在三个适当选取的密度矩阵上的作用即可唯一确定此类信道。\n2. 其核心推进在于把幺正信道三密度矩阵判定推广到特定非幺正情形，并基于该判定条件，用相干与非相干控制数值研究多类非幺正目标信道的生成。\n3. 这为开放量子系统中非幺正演化的验证与可控实现提供了可操作的判据和数值依据，并提示三密度矩阵方案可能推广到更一般的信道判定与生成任务。", "summary_source": "deepseek", "authors": [{"name": "Nina Kuklina"}, {"name": "Vasilii Vasilenko"}, {"name": "Boris Volkov"}, {"name": "Alexander Pechen"}], "featured_authors": [{"name": "Nina Kuklina"}, {"name": "Vasilii Vasilenko"}, {"name": "Boris Volkov"}, {"name": "Alexander Pechen"}], "author_count": 4}, {"id": "2609.14964", "category": "quant-ph", "title": "Exact Breit-Rabi formulae for the nitrogen-vacancy center in diamond", "abstract": "The hyperfine structure that the nitrogen-vacancy (NV) center in diamond has with its nitrogen nucleus is of immense importance for quantum sensing and quantum computing. Current methods of calculating the NV hyperfine energy eigenvalues and eigenstates with respect to an axial magnetic field - i.e., calculating the NV Breit-Rabi formula - resort to numerical methods and analytic approximations. Here we provide an exact, closed-form expression to the NV hyperfine energy eigenvalues and eigenstates for both the nitrogen-14 and -15 cases.", "url": "https://arxiv.org/abs/2609.14964", "type": "理论+数值", "summary": "1. 该工作给出了金刚石氮-空位色心在轴向磁场下超精细能级与本征态的精确闭式 Breit-Rabi 公式，并覆盖 14N 与 15N。\n2. 其卖点在于以精确闭式解替代此前依赖数值方法和解析近似的结果，直接给出随轴向磁场变化的超精细本征能量与本征态。\n3. 这为 NV 色心量子传感与量子计算中磁场依赖的超精细能级计算和自旋操控提供了更可靠的解析基础。", "summary_source": "deepseek", "authors": [{"name": "Alex Tritt"}, {"name": "Lincoln D. Turner"}, {"name": "Michael S. J. Barson"}], "featured_authors": [{"name": "Alex Tritt"}, {"name": "Lincoln D. Turner"}, {"name": "Michael S. J. Barson"}], "author_count": 3}, {"id": "2609.14989", "category": "quant-ph", "title": "Correlation and Branching Mechanisms in the Quantum-to-Classical Transition of Interacting Systems", "abstract": "We analyze the quantum-to-classical transition of interacting systems from the viewpoint of reduced dynamical closure. Bohmian trajectories are used as a diagnostic of the probability flow generated by the full wavefunction, rather than as an alternative set of quantum predictions. A closed classical or semiclassical description of a retained coordinate can emerge either because interaction-induced correlations are suppressed or because the observable of interest is insensitive to the correlations that remain. Three models are used to isolate distinct mechanisms. In a hard-core collision, the leading tail of a broad relative-coordinate wave packet reaches the boundary before its center and generates spatial nonseparability through reflection and interference. In the Rabi model, the mixed quantum-classical Ehrenfest approximation fails when spin-position covariances prevent the spin dynamics from being determined solely by the mean oscillator coordinate. In an internal-state-dependent force model, the total mean position obeys an exact Ehrenfest equation, while the wavefunction separates into branch-resolved pointer components; mean classicality therefore does not imply branch-level classicality. These examples show that the quantum-to-classical transition of interacting systems is controlled not only by wave-packet localization but also by whether and how interaction-induced correlations enter the reduced equations of motion.", "url": "https://arxiv.org/abs/2609.14989", "type": "理论+数值", "summary": "1. 该工作从约化动力学闭合视角分析相互作用体系的量子-经典过渡，以玻姆轨迹诊断全波函数生成的概率流，并用三个模型分离不同机制。\n2. 其核心在于表明闭合的经典或半经典描述既可源于相互作用诱导关联被抑制，也可源于目标可观测量对残余关联不敏感，并分别由硬核碰撞的尾端反射干涉、拉比模型中自旋-位置协方差导致的埃伦费斯特失效，以及内态依赖力模型中均值经典性与分支级经典性的分离予以例证。\n3. 这提示量子-经典过渡不仅受波包局域化控制，更取决于相互作用诱导关联是否及如何进入约化运动方程，为混合量子-经典近似与退相干判据提供可检验视角。", "summary_source": "deepseek", "authors": [{"name": "Bingyu Cui"}], "featured_authors": [{"name": "Bingyu Cui"}], "author_count": 1}, {"id": "2609.15004", "category": "quant-ph", "title": "Failure of the Asymptotic Equipartition Property for Quantum Channels", "abstract": "We establish two results on the asymptotic equipartition property (AEP) for quantum channels. First, the AEP formulated using smoothing over completely positive trace-preserving maps fails in general. Second, the AEP with smoothing over subchannels (completely positive trace-nonincreasing maps) is equivalent to the strong converse for parallel quantum channel Stein's lemma, to a sharp threshold for the channel hockey-stick divergence, and to an AEP for the channel Lorenz divergence. The counterexample reveals a surprising separation between channel and subchannel smoothing. Although states and classical channels admit a sharp, dimension-independent completion bound, which we establish, the corresponding single-shot gap for quantum channels is unbounded already for qubits. This separation persists asymptotically: we construct qutrit channel pairs with finite max-relative entropy whose CPTP-smoothed rate strictly exceeds the regularized channel relative entropy. The asymptotic gap between channel and subchannel smoothing is unbounded across the family, even when the subchannel approximation error decays exponentially. To establish the equivalences, we develop a uniform filter that converts Lorenz smoothing into a single nearby subchannel. The four conjectured formulations thus share a common asymptotic threshold, whose validity for general channel pairs remains open. Together, these results separate this threshold question from the obstruction imposed by exact trace preservation.", "url": "https://arxiv.org/abs/2609.15004", "type": "理论", "summary": "1. 该工作围绕《Failure of the Asymptotic Equipartition Property for Quantum Channels》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Gilad Gour"}], "featured_authors": [{"name": "Gilad Gour"}], "author_count": 1}, {"id": "2609.15040", "category": "quant-ph", "title": "Scaling up multi-mode entanglement generated by mode swapping", "abstract": "Entanglement between two local multi-photon multi-mode systems can be generated by swapping a pair of modes between the two local multi-mode systems. In this presentation, we consider possible strategies for the efficient generation of entanglement between systems with three or more modes. It is shown that the choice of photon number inputs in the local systems adds a new degree of freedom to the non-local interference effects observed in the output photon number statistics.", "url": "https://arxiv.org/abs/2609.15040", "type": "理论", "summary": "1. 该工作研究通过在两局域多光子多模系统间交换一对模式来产生纠缠，并系统考察在三个及以上模式时高效生成多模纠缠的可行策略与方案。\n2. 其关键物理机制在于，局域系统输入光子数的选择为输出光子数统计中的非局域干涉效应引入了新的自由度，从而可直接调控纠缠的生成与优化。\n3. 这为扩展多模纠缠源、设计更优的模式交换协议，以及后续多光子多模量子信息实验与理论研究提供了明确启发与新的思路。", "summary_source": "deepseek", "authors": [{"name": "Yuki Kodama"}, {"name": "Holger F. Hofmann"}], "featured_authors": [{"name": "Yuki Kodama"}, {"name": "Holger F. Hofmann"}], "author_count": 2}, {"id": "2609.15099", "category": "quant-ph", "title": "Biorthogonal Time-Dependent Variational Principle for Non-Hermitian Systems", "abstract": "We develop a biorthogonal time-dependent variational principle for real-time dynamics of non-Hermitian quantum many-body systems. Independent left and right matrix-product states obey coupled bivariational tangent-space equations whose cross-Gram matrix defines an oblique projection. A matrix-free scaled Taylor action propagates the resulting non-normal local generators without assembling dense matrices or storing a Krylov basis. We distinguish the fully coupled algorithm, which solves the cross-pairing problem and truncates the two bond bases jointly, from an efficient independently propagated approximation used for large systems. Independent truncation can make the retained left-right pairing nearly singular; overlap drift and the smallest singular value of the bond cross matrix expose this failure, while coupled truncation substantially delays it. Exact benchmarks and convergence tests validate the method. Applied to an interacting long-range non-Hermitian Ising chain, it resolves a biorthogonal dynamical quantum phase transition and shows that a weak imaginary field shifts the leading critical time from $t^{\\ast}|J|=1.84$ to $1.04$.", "url": "https://arxiv.org/abs/2609.15099", "type": "理论+数值", "summary": "1. 该工作提出非厄米量子多体实时动力学的双正交含时变分原理，令独立的左右矩阵乘积态服从耦合双变分切空间方程，交叉Gram矩阵定义斜投影，并以免组装矩阵的缩放Taylor作用传播非正规局域生成元。\n2. 其技术要点在于区分完全耦合截断与独立传播近似：前者联合截断左右键基以解决交叉配对并显著延迟近奇异失效，后者面向大系统，且重叠漂移与键交叉矩阵最小奇异值可诊断该失效。\n3. 精确基准与收敛测试验证了该方法，并在相互作用长程非厄米Ising链上分辨出双正交动力学量子相变，表明弱虚场可将主导临界时间由 t*|J|=1.84 移至 1.04。", "summary_source": "deepseek", "authors": [{"name": "Younes Javanmard"}, {"name": "Sina Kazemian"}], "featured_authors": [{"name": "Younes Javanmard"}, {"name": "Sina Kazemian"}], "author_count": 2}, {"id": "2609.15139", "category": "quant-ph", "title": "A train--prune--readout--rewrite workflow for interpretable quantum learning", "abstract": "AI for Science aims not only to predict complex physical systems from data, but also to extract mathematical structure and physically testable representations from learned models. Here, a train--prune--readout--rewrite workflow is developed that separates physical-domain grounding from three increasingly stringent analysis claims: algebraically equivalent readout of a trained predictor, compact teacher-faithful symbolic rewriting on the sampled physical domain, and transformation-based tests of learned internal representations. The workflow is implemented with complex-valued Kolmogorov--Arnold networks, whose explicit edge functions enable post-pruning analytic readout of the retained computation. In analytically controlled single-qubit tasks, rewriting recovered the quadratic structure of purity, whereas von Neumann entropy yielded only a domain-bounded symbolic surrogate; physics-aligned variable grouping preserved symbolic fidelity. For two-qubit entanglement-related tasks, shared learning exposed a common internal representation whose physical content was interrogated directly. Local-unitary transformations rejected a direct invariant-coordinate interpretation, while fixed-decoder transfer showed that the shared activation carries Pauli-correlation information in a transformation-consistent form. Task-related invariant spectral features were subsequently recovered through low-order nonlinear readouts. Separate predictive tests retained high accuracy for three-qubit classification and controlled ten-qubit purity regression with over one million complex inputs. These results establish an evidence-resolved framework for distinguishing physical grounding, readable computation, faithful symbolic compression and transformation-tested physical structure in constrained complex-valued scientific learning.", "url": "https://arxiv.org/abs/2609.15139", "type": "理论+数值", "summary": "1. 该工作提出\"训练—剪枝—读出—重写\"流程，用复值Kolmogorov–Arnold网络把物理域依据与三级递进分析主张分离，并在单、两、三及十量子比特任务上验证。\n2. 其卖点在于剪枝后可对保留计算做解析读出：重写能复原纯度的二次结构，而冯诺依曼熵仅得域内有界符号代理；局域酉变换否定了不变量坐标解释，固定解码迁移却显示共享激活以变换一致方式携带泡利关联信息。\n3. 这为受限复值科学学习提供了以证据分级区分物理依据、可读计算、忠实符号压缩与经变换检验的物理结构的框架。", "summary_source": "deepseek", "authors": [{"name": "Siran Zhang"}, {"name": "Shuming Cheng"}, {"name": "Xiang Li"}, {"name": "Jinyi Liu"}], "featured_authors": [{"name": "Siran Zhang"}, {"name": "Shuming Cheng"}, {"name": "Xiang Li"}, {"name": "Jinyi Liu"}], "author_count": 4}, {"id": "2609.15302", "category": "quant-ph", "title": "Universality from Quadratic Angular-Momentum Operations: Exact Dynamical Lie Algebras and the Role of the Casimir Obstruction", "abstract": "Universality relies on combining operators with different algebraic properties, which depend on the physical structure of the Hilbert space encoding the information. Systems of identical symmetric particles---including bosons and symmetric collections of spin-$1/2$ particles---can be mapped to angular-momentum systems, where rotations supplemented by quadratic, spin-squeezing interactions provide universal control. We revisit universality in this framework and confirm that such linear and quadratic operations provide universal control on every fixed-particle-number subspace. At the abstract level, however, we show that the dynamical Lie algebra generated by all degree-at-most-two elements does not exhaust the full universal enveloping algebra of $\\mathfrak{su}_{\\mathbb{R}}(2)$, contrary to a stronger claim made previously: higher powers of the quadratic Casimir element cannot be generated by commutators and linear combinations. This obstruction does not conflict with fixed-sector universality because, under a fixed irreducible spin-$n/2$ representation, all powers of the Casimir element act as scalar multiples of the identity. We determine the resulting abstract dynamical Lie algebras exactly and show that the central-free and full degree-at-most-two algebras map, respectively, onto $\\mathfrak{su}_{\\mathbb{R}}(n+1)$ and $\\mathfrak{u}_{\\mathbb{R}}(n+1)$, establishing special-unitary and full-unitary universality. We further derive a practical degree-two universality criterion and discuss finite-dimensional SSRC universality.", "url": "https://arxiv.org/abs/2609.15302", "type": "理论", "summary": "1. 该工作围绕《Universality from Quadratic Angular-Momentum Operations: Exact Dynamical Lie Algebras and the Role of the Casimir Obstruction》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Tim Heib"}, {"name": "Pérola Milman"}], "featured_authors": [{"name": "Tim Heib"}, {"name": "Pérola Milman"}], "author_count": 2}, {"id": "2609.15394", "category": "quant-ph", "title": "Object Detection Using Quantum Transfer Learning", "abstract": "Object detection requires the joint learning of semantic identity and continuous spatial geometry. Existing quantum transfer learning approaches have focused mainly on classification tasks and do not support regression. Here, we introduce a physics informed hybrid classical-quantum architecture for object detection in which a pre-trained MobileNetV2 maps visual features into an eight qubits variationally quantum Hilbert space. The Hilbert space is partitioned into two task specific subspaces for semantic classification and geometric localization. Local quantum expectation values are used to predict continuous bounding box coordinates, while circuit topology regulates the flow of quantum information between the two tasks. We compare linear and circular CNOT topologies and show that periodic boundary conditions suppress bipartite entanglement without degrading detection performance. The circular architecture reaches a bipartite von Neumann entropy of 0.1688 bits and a Meyer-Wallach entanglement measure of 0.0370, while achieving an mAP@0.5 of 0.9448 and an mAP@0.5:0.95 of 0.6558. A thermodynamic formulation further interprets the total learning loss as a variation in Helmholtz free energy. It interprets geometric localization as an effective internal energy contribution and semantic classification as an entropic contribution. These results indicate that high performance in the proposed object detection model does not require maximal entanglement. Instead, efficient learning can emerge through topology controlled information flow, targeted restriction of entanglement, and information renormalization within the Hilbert space.", "url": "https://arxiv.org/abs/2609.15394", "type": "理论+数值", "summary": "1. 该工作提出物理启发的混合经典-量子目标检测架构，以预训练MobileNetV2将特征映射至八量子比特变分希尔伯特空间，并划分分类与定位子空间。\n2. 其技术卖点是用环形CNOT拓扑调控任务间量子信息流：周期边界抑制双分纠缠而不损检测，冯诺依曼熵0.1688比特时mAP@0.5达0.9448，并将总损失诠释为亥姆霍兹自由能变分。\n3. 这启示高性能目标检测不必追求最大纠缠，而可通过拓扑控制信息流、定向限制纠缠及希尔伯特空间信息重整化实现高效学习。", "summary_source": "deepseek", "authors": [{"name": "Mohammad Bahrami"}, {"name": "Morteza Rafiee"}, {"name": "Mohsen Norouzi"}], "featured_authors": [{"name": "Mohammad Bahrami"}, {"name": "Morteza Rafiee"}, {"name": "Mohsen Norouzi"}], "author_count": 3}, {"id": "2609.15411", "category": "quant-ph", "title": "Exact quantum circuits for a Heisenberg triangle with Dzyaloshinskii-Moriya interaction", "abstract": "We construct exact quantum circuits for a three-spin Heisenberg triangle with Dzyaloshinskii-Moriya (DM) interaction. A change of basis reduces pure DM evolution with arbitrary couplings to two single-qubit rotations, giving a circuit with at most 8 CNOT gates. When $J$ and $D$ are each the same on all bonds, one fixed basis gives a circuit with at most 10 CNOT gates for any real $J,D,t$. Local spin rotations extend the construction to a family with unequal DM couplings and nonzero exchange, requiring at most 14 CNOT gates. All circuits act on the full Hilbert space. An alternative pure DM implementation uses five two-qubit DM gates: analytically retuning the angles of one symmetric Strang step makes it exact. A 12-spin kagome example illustrates the use of these exact local blocks in lattice simulation.", "url": "https://arxiv.org/abs/2609.15411", "type": "数值", "summary": "1. 该工作围绕《Exact quantum circuits for a Heisenberg triangle with Dzyaloshinskii-Moriya interaction》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Andrey Zhukov"}], "featured_authors": [{"name": "Andrey Zhukov"}], "author_count": 1}, {"id": "2609.15477", "category": "quant-ph", "title": "Engineering dissipation and control pulses for high-fidelity fault-tolerance quantum computing", "abstract": "Cat-state qubits, a prominent class of bosonic encodings, offer a promising pathway toward hardware-efficient fault-tolerant quantum computing. In this manuscript, we propose an optimally robust control protocol for the cat-state qubits which are stabilized by engineering two-photon dissipation. By deriving an effective two-level description in the cat-state subspace and applying shortcut-to-adiabaticity via inverse engineering, we design a robust protocol to achieve fast and high-fidelity state transfer in the cat-state qubit. We analyze the sensitivity to systematic control errors and identify an optimal robustness condition that strongly suppresses errors induced by imperfections in the driving fields. Furthermore, we show that dissipative confinement efficiently suppresses leakage out of the cat-state subspace caused by the pure dephasing, highlighting an intrinsic advantage of dissipative-cat qubits. This work establishes a robust and leakage-suppressing framework for high-fidelity bosonic qubit control, offering a promising route toward scalable fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2609.15477", "type": "理论", "summary": "1. 该工作针对由双光子耗散稳定的猫态量子比特，提出一种结合逆向工程绝热捷径的优化鲁棒控制协议，以实现快速且高保真的态转移。\n2. 其技术核心是导出猫态子空间的有效二能级描述，分析系统控制误差敏感性，并确定能强抑制驱动场不完美所致误差的最优鲁棒条件。\n3. 此外，耗散约束可高效抑制纯退相干导致的子空间泄漏，体现耗散猫态比特的内在优势，为可扩展容错量子计算建立鲁棒且抑制泄漏的高保真玻色子控制框架。", "summary_source": "deepseek", "authors": [{"name": "Shao-Wei Xu"}, {"name": "Zhe-Yuan Zhang"}, {"name": "Yi-Tong Shi"}, {"name": "Ye-Hong Chen"}, {"name": "Yan Xia"}], "featured_authors": [{"name": "Shao-Wei Xu"}, {"name": "Zhe-Yuan Zhang"}, {"name": "Yi-Tong Shi"}, {"name": "Ye-Hong Chen"}, {"name": "Yan Xia"}], "author_count": 5}, {"id": "2609.15632", "category": "quant-ph", "title": "A Nonrecursive Lindblad Quantization of Dissipative Polynomial Dynamics", "abstract": "We present a direct and nonrecursive construction that maps an arbitrary planar polynomial dissipative flow $\\dot{\\alpha}=h(\\alpha,\\alpha^*)$ to an open quantum system in Gorini--Kossakowski--Sudarshan--Lindblad form. Given the homogeneous components of the classical drift, the corresponding Hamiltonian and collapse-operator blocks are obtained algebraically and independently at each degree. No recursive cancellation of lower-order terms is required: in the large-amplitude limit $|\\alpha|\\sim S\\to\\infty$, ordering-generated lower-degree terms are parametrically suppressed, while mean-field closure yields the prescribed leading $O(S)$ drift for semiclassically localized states. This provides a simple and systematic route from dissipative classical dynamics to explicit open-quantum-system realizations, without claiming a unique microscopic quantization of the classical flow. We demonstrate the construction for stable fixed points, a Hopf bifurcation, and a bistable-ring flow. The corresponding Liouvillian spectra recover the classical relaxation exponents, the radial Floquet exponent and neutral phase direction of a limit cycle, and the separation between local relaxation and inter-ring switching in the bistable case. These examples show that the construction can be used not only to analyze a given quantum model, but also to design open quantum systems with prescribed classical dynamical structures in the semiclassical limit.", "url": "https://arxiv.org/abs/2609.15632", "type": "理论", "summary": "1. 该工作提出一种直接且非递归的构造，将任意平面多项式耗散流映射为Gorini-Kossakowski-Sudarshan-Lindblad型开放量子系统，并按经典漂移的齐次分量代数地给出相应哈密顿量与坍缩算符。\n2. 其核心卖点在于各阶块可独立获得、无需递归抵消低阶项，并证明在大振幅半经典局域态极限下序生成的低阶项被参数压低，平均场闭合恢复预设的主导O(S)漂移。\n3. 对稳定不动点、Hopf分岔和双稳环的演示表明，相应Liouvillian谱可重现经典弛豫指数、极限环径向Floquet指数与中性相位方向以及环间切换分离，从而为按半经典动力学设计开放量子系统提供系统途径。", "summary_source": "deepseek", "authors": [{"name": "Tingfei Li"}], "featured_authors": [{"name": "Tingfei Li"}], "author_count": 1}, {"id": "2609.15705", "category": "quant-ph", "title": "Performance in Symmetry-Restricted Searches for Post-Quantum Correlations", "abstract": "Searches for post-quantum correlations depend on two distinct ingredients: how abundant such correlations are in the underlying correlation space and how efficiently the chosen representation preserves their distinguishability from quantum correlations. We quantify these effects by introducing the popularity rate and the projection acceptance, whose product defines the search performance. We illustrate these concepts in binary-outcome Bell scenarios with symmetry-related sites, using the CHSH and pyramid representations. Particular attention is paid to the distinction between exchange-symmetric synchronous correlations and correlations satisfying only exchange symmetry. In the synchronous quantum sector, the common-vector representation follows automatically from synchrony, whereas exchange symmetry alone defines a substantially larger correlation space. We show that this distinction can qualitatively change the effectiveness of a projected search: the pyramid representation, which retains substantial discriminatory power in the synchronous sector, has no discriminatory power when only exchange symmetry is imposed. Our results provide a simple framework for assessing and comparing searches for post-quantum correlations.", "url": "https://arxiv.org/abs/2609.15705", "type": "理论", "summary": "1. 该工作引入流行率与投影接受度的乘积作为搜索性能指标，并在具有对称相关位点的二值结果Bell场景中比较CHSH与金字塔表示对后量子关联的搜索效果。\n2. 其关键在于区分交换对称的同步关联与仅满足交换对称的关联：同步量子扇区自动导出共向量表示，而仅交换对称对应更大关联空间，使金字塔表示在同步扇区保持显著区分力，却在仅交换对称时完全失效。\n3. 这一框架为评估和比较后量子关联搜索，以及理解对称性约束与表示选择如何影响可区分性，提供了简洁且可推广的判据。", "summary_source": "deepseek", "authors": [{"name": "Marek Gazdzicki"}, {"name": "Francesco Giacosa"}], "featured_authors": [{"name": "Marek Gazdzicki"}, {"name": "Francesco Giacosa"}], "author_count": 2}, {"id": "2609.15728", "category": "quant-ph", "title": "A Modular, Topology-Aware Software Stack for Entanglement-Based Distributed Quantum Computing", "abstract": "Distributed quantum computing (DQC) seeks to scale beyond the limits of monolithic processors by interconnecting multiple quantum processing units (QPUs) through entanglement-based links. Realizing this vision requires the co-design of hardware and software across the domains of quantum networking, compilation, and scheduling, yet existing tools remain fragmented between monolithic circuit compilers and long-distance quantum network simulators. We present an open-source, topology-informed framework for the compilation and scheduling of distributed quantum programs. Given an input circuit and a description of the target network, the framework partitions and reconstructs the circuit into a distributed program that respects the specified inter- and intra-QPU topology, covers cross-QPU operations through gate and state teleportation, and schedules the result under either deterministic or stochastic entanglement-generation models. By accepting and emitting standard OpenQASM, the framework interoperates with existing monolithic toolchains, and its standardized module interfaces allow partitioning and scheduling strategies to be interchanged and benchmarked. Using this framework, we show that the best-performing compilation strategy varies across the tested circuits and network configurations, and that both network topology and intra-QPU connectivity substantially affect the entanglement cost of execution. These findings underscore the need for a co-design approach to distributed quantum computing, which our framework is designed to support.", "url": "https://arxiv.org/abs/2609.15728", "type": "理论", "summary": "1. 该工作提出了一个开源、拓扑感知的分布式量子程序编译与调度框架，可将输入电路和目标网络描述划分并重构为遵守QPU间及QPU内拓扑的分布式程序。\n2. 其卖点在于用门与态隐形传态覆盖跨QPU操作，以标准OpenQASM与现有单体工具链互操作，并通过标准化模块接口互换、基准测试划分与调度策略，支持确定性和随机纠缠产生模型。\n3. 实验显示最佳编译策略随电路和网络配置而变，网络拓扑与QPU内连通性显著影响纠缠开销，凸显分布式量子计算软硬件协同设计的必要性。", "summary_source": "deepseek", "authors": [{"name": "Luke Andreesen"}, {"name": "Shobhit Gupta"}, {"name": "Sean Sullivan"}, {"name": "Manish Kumar Singh"}], "featured_authors": [{"name": "Luke Andreesen"}, {"name": "Shobhit Gupta"}, {"name": "Sean Sullivan"}, {"name": "Manish Kumar Singh"}], "author_count": 4}, {"id": "2609.15738", "category": "quant-ph", "title": "Disentangling QAOA: From Weakly Entangled Circuits to a Classical QUBO Solver", "abstract": "The role of entanglement in quantum optimization remains actively debated. To address this question, we focus on the fixed-parameter expanding-depth regime of the quantum approximate optimization algorithm (QAOA), where a compact two-parameter schedule is trained once on small instances and then applied as the problem size and circuit depth increase. To probe this regime beyond full state-vector simulation, we perform approximate matrix product state simulations for up to 50 qubits and 100 layers and quantify entanglement by the bond dimension. We observe an entangle--disentangle profile, with the peak bond dimension decreasing with depth and eventually saturating. This observation motivates an extreme approximation: projecting the state onto the product-state manifold (bond dimension one) after every two-qubit interaction. Based on this approximation, we introduce BOND-1, a quantum-inspired classical solver. Despite the drastic simplification, BOND-1 achieves cut ratios above 0.95 relative to the best known values on standard GSet MaxCut benchmarks with up to 20000 variables, and in some cases it matches those values. It achieves these results without per-instance optimization and has linear memory cost, while per-instance tuning can provide further improvement. These results show that, in this regime, a substantial fraction of the optimization power of QAOA survives even in the complete absence of entanglement. Our conclusions, however, are specific to this setting and do not imply that entanglement is unnecessary for quantum optimization in general.", "url": "https://arxiv.org/abs/2609.15738", "type": "理论+数值", "summary": "1. 该工作研究固定参数、扩展深度的QAOA，用MPS模拟至50量子比特、100层，并以键维量化纠缠。\n2. 其卖点是观察到纠缠先增后减且峰值键维随深度下降并饱和，进而每两比特门后投影到乘积态，提出经典QUBO求解器BOND-1。\n3. 在GSet MaxCut至2万变量上，BOND-1无需逐例优化即达最优已知割比0.95以上，表明该设定下QAOA优化力可在无纠缠时保留，但结论不外推。", "summary_source": "deepseek", "authors": [{"name": "Boris I. Bantysh"}, {"name": "Andrey Yu. Chernyavskiy"}, {"name": "Denis A. Kulikov"}, {"name": "Maksim A. Gavreev"}, {"name": "Evgeniy O. Kiktenko"}], "featured_authors": [{"name": "Boris I. Bantysh"}, {"name": "Andrey Yu. Chernyavskiy"}, {"name": "Denis A. Kulikov"}, {"name": "Maksim A. Gavreev"}, {"name": "Evgeniy O. Kiktenko"}], "author_count": 5}, {"id": "2609.15739", "category": "quant-ph", "title": "Pauli spectrum and nonstabilizerness of random fermionic Gaussian states", "abstract": "We characterize the magic of random fermionic Gaussian states through their Pauli spectrum and their stabilizer entropies. For the Haar ensemble of Majorana Gaussian states we derive closed finite-$N$ expressions for the average stabilizer purities and reconstruct the Pauli spectrum exactly, as a mixture of products of beta-distributed variables resolved by Majorana weight. The stabilizer entropies, and their filtered versions, freeze at Rényi index $q_c=2$: for $q>2$ the magic density is $1/(q-1)$, controlled by rare weight-two Majorana strings. Resolving these contributions requires exponentially many characteristic samples, making direct sampling estimates of the stabilizer entropies inefficient in this frozen regime. For Haar-random Gaussian states at fixed filling, we express the averaged stabilizer purities at positive integer $q$ as coefficient integrals over $\\mathrm{SU}(2q)$, with dimension independent of $N$, and evaluate the $q=2$ case exactly. We establish that the frozen density describes typical states in the Majorana and half-filled number-conserving ensembles and relate these ensembles to the corresponding $\\mathrm{SYK}_2$ ground states. Finally, we show that typical fermionic Gaussian states retain certified magic after discarding any fixed fraction $\\kappa<\\kappa_\\star^{\\rm G}\\simeq0.7613$ of their modes in the thermodynamic limit, remaining magical even beyond the $2/3$ threshold for Haar-random states in the full Hilbert space.", "url": "https://arxiv.org/abs/2609.15739", "type": "理论+数值", "summary": "1. 该工作刻画随机费米子高斯态的Pauli谱与稳定子熵，并给出Majorana高斯系综平均稳定子纯度及Pauli谱的有限N精确表达。\n2. 其卖点是稳定子熵在Rényi指数q_c=2处冻结，q>2时magic密度为1/(q-1)且由稀有双Majorana串主导，固定填充下q=2可精确求解。\n3. 这表明典型费米子高斯态丢弃固定比例κ<κ*≈0.7613的模式后仍保留可认证magic，并联系SYK₂基态，为魔性资源鲁棒性提供依据。", "summary_source": "deepseek", "authors": [{"name": "Xhek Turkeshi"}, {"name": "Piotr Sierant"}, {"name": "Poetri Sonya Tarabunga"}], "featured_authors": [{"name": "Xhek Turkeshi"}, {"name": "Piotr Sierant"}, {"name": "Poetri Sonya Tarabunga"}], "author_count": 3}, {"id": "2609.15764", "category": "quant-ph", "title": "Low-Depth Initial-State Preparation for Ground-State Energy Estimation of Two-Dimensional Strongly Correlated Systems", "abstract": "Quantum algorithms for ground-state energy estimation require initial states with non-negligible fidelity to the ground state. Guided by classical simulations, we design shallow circuits for the two-dimensional half-filled Hubbard model by first preparing an approximate Heisenberg ground state and then applying charge-fluctuation gates derived directly from the Schrieffer-Wolff (SW) generator. For the Heisenberg model, we demonstrate effective parameter transfer from a $4\\times4$ lattice to lattices up to $10\\times10$ without further optimization. We obtain promising lower bounds on the ground-state fidelity using tensor-network simulations, variational Monte Carlo reference states, and estimates of the ground-state energy and singlet gap. Exact $4\\times4$ calculations show that the SW gates substantially improve the Hubbard ground-state fidelity of the embedded Heisenberg state. The successful Heisenberg parameter transfer supports the use of these small-lattice results to design shallow Hubbard circuits on larger lattices beyond the reach of classical simulations. For a $10\\times10$ lattice, the estimated preparation cost is on the order of $10^5$ $T$ gates, including Clifford+$T$ synthesis, which is well within the megaquop regime. These results offer a route to low-cost initial-state preparation for ground-starongly correlated systems.", "url": "https://arxiv.org/abs/2609.15764", "type": "理论+数值", "summary": "1. 该工作为二维半填充Hubbard模型基态能量估计设计了浅层初态制备线路，先制备近似Heisenberg基态，再施加由Schrieffer-Wolff生成元导出的电荷涨落门。\n2. 其核心在于Heisenberg参数从小晶格无优化迁移至10×10，且SW门在精确4×4计算中显著提升嵌入Heisenberg态的Hubbard基态保真度。\n3. 这为用小晶格设计超越经典模拟的大晶格浅层Hubbard线路提供依据，10×10制备约需10^5个T门，处于megaquop范围。", "summary_source": "deepseek", "authors": [{"name": "Ryo Watanabe"}, {"name": "Keisuke Fujii"}], "featured_authors": [{"name": "Ryo Watanabe"}, {"name": "Keisuke Fujii"}], "author_count": 2}, {"id": "2609.15829", "category": "quant-ph", "title": "Higher-order quantum thermodynamics: equilibrium and causal structure", "abstract": "Quantum thermodynamics is traditionally formulated as a theory of equilibrium states and state transformations. Recent advances in higher-order quantum transformations, which describe physical scenarios beyond states and channels and provide a systematic framework for causal order, raise the question of how equilibrium should be defined and preserved in this more general setting. Starting from the Gibbs state as the unique equilibrium state, we identify equilibrium preservation as its natural higher-order extension. We show that, while this principle can in general give rise to distinct classes of transformations, all such distinctions disappear when equilibrium preservation is required completely, namely under arbitrary ancillary extensions. Remarkably, every transformation satisfying this condition is causally ordered, making causal order an emergent consequence of thermodynamic equilibrium. We establish this result for arbitrary higher-order maps and use the resulting framework to introduce free-energy-like quantities for quantum channels. Our findings reveal a fundamental connection between thermodynamic equilibrium and causal structure, providing a foundation for a fully fledged theory of higher-order quantum thermodynamics.", "url": "https://arxiv.org/abs/2609.15829", "type": "理论", "summary": "1. 该工作从Gibbs态作为唯一平衡态出发，将平衡保持作为其自然高阶扩展，系统研究高阶量子变换中平衡的定义与保持问题。\n2. 其核心贡献在于：完全平衡保持（即允许任意辅助扩展）会消除不同变换类的区分，且所有满足该条件的变换均因果有序，使因果序成为热力学平衡的涌现结果；该结论对任意高阶映射成立，并由此为量子信道引入类自由能量。\n3. 这揭示了热力学平衡与因果结构之间的基本联系，为完整的高阶量子热力学理论奠定基础，并启发后续在因果序与量子资源理论交叉方向的研究。", "summary_source": "deepseek", "authors": [{"name": "Simon Milz"}, {"name": "Kyrylo Simonov"}, {"name": "Zoltán Zimborás"}, {"name": "Tamal Guha"}, {"name": "Saptarshi Roy"}, {"name": "Giulio Chiribella"}], "featured_authors": [{"name": "Simon Milz"}, {"name": "Kyrylo Simonov"}, {"name": "Zoltán Zimborás"}, {"name": "Tamal Guha"}, {"name": "Saptarshi Roy"}, {"name": "Giulio Chiribella"}], "author_count": 6}, {"id": "2609.15842", "category": "quant-ph", "title": "Instantiating Microcrypt: Obstacles and opportunities via tailored state certification", "abstract": "Recent work has introduced the Hamiltonian phase state (HPS) assumptions, which postulate that Hamiltonian phase states can be used to instantiate pseudorandom and one-way state generators. Additionally, it has been conjectured that these assumptions can be true, even if one-way functions do not exist. This is exciting, because if true, then the HPS assumptions provide a route to the instantiation of Microcrypt. In this work we falsify this conjecture, by proving that if the HPS assumptions are true, then one-way functions exist. While this removes the possibility of instantiating genuine Microcrypt cryptography with Hamiltonian phase states, it shows that the HPS assumptions provide novel inherently quantum assumptions for the construction of classical cryptography. Technically we achieve this via a method for the construction of one-way puzzles from one-way state generators and tailored \"measure first, ask later\" state certification protocols. This generalizes prior constructions of one-way puzz
