会导致二维与三维宏观流动性质显著不同，因此用二维模型刻画三维流动存在严重局限。", "summary_source": "deepseek", "authors": [{"name": "Cristian Picighelli"}, {"name": "Ivan Colecchio"}, {"name": "Marcelo Piva"}, {"name": "Alejandro D. Otero"}, {"name": "Alejandro Boschan"}], "featured_authors": [{"name": "Cristian Picighelli"}, {"name": "Ivan Colecchio"}, {"name": "Marcelo Piva"}, {"name": "Alejandro D. Otero"}, {"name": "Alejandro Boschan"}], "author_count": 5}, {"id": "2609.14613", "category": "cond-mat", "title": "Altermagnetism across the BCS-BEC crossover", "abstract": "We study a two-dimensional paired Fermi system in which altermagnetism produces a spin splitting that depends on momentum. The interaction strength is described through the two-body binding energy, so that the chemical potential and pairing gap evolve self-consistently from the weak-coupling Bardeen-Cooper-Schrieffer (BCS) regime to the strong-coupling Bose-Einstein-condensate (BEC) regime at fixed density. The stability of the uniform paired state is examined by giving the pairs a small center-of-mass momentum and following the resulting change in free energy. We show that at zero temperature, the phase stiffness follows a universal quadratic suppression, $J/J_0 = 1 - (\\alpha/\\alpha_0)^2$, across the entire fully gapped crossover regime. Deviations from this relation emerge only on the BCS side upon the opening of gapless Bogoliubov pockets, which rapidly reduce the stiffness and can trigger an instability toward finite-momentum pairing. In the BEC regime, this universal quadratic correction corresponds to the altered effective mass of the tightly bound composite bosons. The model therefore provides a simple setting in which to compare altermagnetic pair breaking on the BCS and BEC sides of the crossover.", "url": "https://arxiv.org/abs/2609.14613", "type": "理论", "summary": "1. 该工作研究了二维配对费米系统中交变磁性导致的自旋劈裂随动量变化，并以两体束缚能描述相互作用，在固定密度下自洽求解从弱耦合BCS到强耦合BEC的化学势与配对能隙。\n2. 其核心卖点是通过给配对态施加微小质心动量并追踪自由能变化，发现在零温全能隙交叉区间相刚度遵循普适二次压制 J/J0=1-(α/α0)^2；偏离仅出现在BCS侧，当无隙Bogoliubov口袋打开时刚度骤降并可能触发有限动量配对失稳。\n3. 该模型为比较交变磁性在BCS与BEC两侧的配对破坏提供了简洁平台，并提示BEC区修正可理解为紧束缚复合玻色子有效质量的改变。", "summary_source": "deepseek", "authors": [{"name": "Iogann Tolbatov"}, {"name": "Luca Salasnich"}], "featured_authors": [{"name": "Iogann Tolbatov"}, {"name": "Luca Salasnich"}], "author_count": 2}, {"id": "2609.14623", "category": "cond-mat", "title": "Thermodynamic Realizability of Hidden Markov Processes: Attainment, Observable Certificates, and the Price of Architecture", "abstract": "What is the least dissipative finite Markov machine that can reproduce a given stochastic process exactly? A basic compactness worry is that a minimizing sequence might lower its cost only by sending microscopic rates to infinity, never converging to an actual finite-rate machine. We prove that this escape is impossible at fixed hidden dimension. States of vanishing stationary occupation can be traced out, and infinitely fast conductance classes can be contracted, without increasing entropy production or losing the limiting observed path law. Hence the exact-law cost $V_n(P)$ is attained and lower semicontinuous at every fixed state count, with no cap on rates or mean activity. Adding a positive price $\\kappa$ per used hidden state yields an attained optimum over all finite dimensions and an exact representation by globally calibrated lower certificates built from finitely many observable path expectations. The lower envelope $G_\\kappa(P)=\\min_n[V_n(P)+\\kappa n]$ defines an architecture phase diagram whose slope is the selected state count; divergence of that count as $\\kappa\\downarrow0$ is equivalent to failure of any finite machine to attain the all-dimension infimum $V_\\infty(P)$. For the two-block renewal family $P_q$, we derive complete finite-dimensional phase-type cancellation equations, give an explicit four-phase counterexample to a tempting restricted parameterization, and prove strictly positive minimal dissipation at every feasible finite dimension for all $0<q<1$. These results reduce the remaining problem to one sharp question: can growing hidden architecture drive the dissipation of $P_q$ to its all-dimension infimum without any finite optimizer, and in the strongest scenario, to zero?", "url": "https://arxiv.org/abs/2609.14623", "type": "理论+数值", "summary": "1. 该工作研究精确重现给定随机过程的最小耗散有限隐马尔可夫机器，证明固定隐维度下最小化序列不会通过速率发散逃逸，从而精确律代价V_n(P)可达且下半连续。\n2. 其卖点在于对被使用的隐状态施加正价格κ，获得全有限维度上的可达最优，并以有限可观测路径期望构造精确下证书；Gκ(P)=min_n[V_n(P)+κ n]定义架构相图，其斜率即选定状态数。\n3. 对两段更新族P_q，工作给出有限维相型消去方程与四相反例，并证明所有可行有限维最小耗散严格为正，从而将剩余问题聚焦为增长架构能否在无有限优化器时将耗散推至全维下确界甚至零。", "summary_source": "deepseek", "authors": [{"name": "Murad Aznagulov"}], "featured_authors": [{"name": "Murad Aznagulov"}], "author_count": 1}, {"id": "2609.14665", "category": "cond-mat", "title": "Thermodynamic Geometry of an Ideal Quon Gas", "abstract": "We investigate the equilibrium thermodynamics and thermodynamic Riemannian geometry of an ideal quon gas within the grand canonical ensemble. By incorporating the algebraic deformation parameter $q$, the system generalizes standard bosonic behavior while recovering the conventional ideal Bose gas in the undeformed limit. A rigorous examination of the ground-state occupation reveals two disconnected mathematical domains of the fugacity. By enforcing thermodynamic continuity, single-valuedness, and consistency with the high-temperature classical limit, we exclude the second mathematical branch and establish the lower interval as the unique physically admissible state space. This identifies the deformation parameter as an intrinsic, generalized Bose--Einstein condensation threshold. Employing the Fisher-Rao metric on the equilibrium parameter manifold, we probe the thermodynamic scalar curvature across all temperature regimes. The scalar curvature remains strictly positive throughout the physical domain, confirming that the deformation preserves an effectively attractive statistical interaction without inducing fermionic tendencies. Near the critical condensation threshold, the curvature increases sharply and exhibits a definitive divergence, providing an unambiguous geometric signature of macroscopic coherence and critical fluctuations. Below the transition temperature, the pinning of fugacity eliminates a fluctuating degree of freedom, collapsing the scalar curvature to zero.", "url": "https://arxiv.org/abs/2609.14665", "type": "理论", "summary": "1. 该工作围绕《Thermodynamic Geometry of an Ideal Quon Gas》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Leila Yousefzadeh"}, {"name": "Hosein Mohammadzadeh"}, {"name": "Habib Esmaili"}, {"name": "Zahra Ebadi"}, {"name": "Morteza Nattagh Najafi"}], "featured_authors": [{"name": "Leila Yousefzadeh"}, {"name": "Hosein Mohammadzadeh"}, {"name": "Habib Esmaili"}, {"name": "Zahra Ebadi"}, {"name": "Morteza Nattagh Najafi"}], "author_count": 5}, {"id": "2609.14668", "category": "cond-mat", "title": "Finite-temperature quantum Monte Carlo study of Dirac quantum criticality: Algorithmic advances and comprehensive analysis", "abstract": "We present a systematic study of the quantum phase transition from a Dirac semimetal to an antiferromagnetic Mott insulator in the honeycomb-lattice Hubbard model, using finite-temperature auxiliary-field quantum Monte Carlo (AFQMC) simulations. Given the dynamical critical exponent $z=1$ at criticality, we scale the inverse temperature $\\beta$ with the linear system size $L$, i.e., $\\beta t=L$ (with $t$ as the hopping amplitude), to approach the thermodynamic and zero-temperature limits simultaneously. On the algorithmic front, we generalize the fast Fourier transform in path propagation to multi-sublattice systems and employ the delayed update technique in configuration updates to accelerate the AFQMC simulations. These advances enable us to access unprecedented system sizes of up to $3528$ sites (with $L=42$ and $\\beta t = 42$). We additionally use twist-averaged boundary conditions to reduce the finite-size effects in computed observables. On the physical side, we determine the Dirac quantum criticality via finite-size scaling analysis of the spin correlations and off-diagonal single-particle Green's function, and locate the critical point at $U_c/t=3.731(4)$ with the critical exponents $\\nu=1.097(7)$, $\\eta_{\\phi}=0.72(2)$ and $\\eta_{\\psi}=0.155(6)$. We further corroborate the critical point by examining several relevant quantities, including the quasiparticle weight, Fermi-liquid parameter, charge compressibility, $U$-derivative of double occupancy, and fidelity susceptibility. Our work establishes an independent benchmark for the chiral Heisenberg Gross-Neveu-Yukawa criticality in the honeycomb Hubbard model, offering a complementary perspective to previous ground-state simulations.", "url": "https://arxiv.org/abs/2609.14668", "type": "理论+数值", "summary": "1. 该工作围绕《Finite-temperature quantum Monte Carlo study of Dirac quantum criticality: Algorithmic advances and comprehensive analysis》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Hou-Min Du"}, {"name": "Qian Sun"}, {"name": "Yuan-Yao He"}], "featured_authors": [{"name": "Hou-Min Du"}, {"name": "Qian Sun"}, {"name": "Yuan-Yao He"}], "author_count": 3}, {"id": "2609.14673", "category": "cond-mat", "title": "Misfit-dislocation hierarchy governs sliding of asymmetric non-CSL grain boundaries", "abstract": "Grain boundary (GB) deformation significantly influences the mechanical response of polycrystalline materials, yet most atomistic studies have focused on coincidence site lattice (CSL) boundaries. Motivated by in situ atomic-resolution observations, we investigate step-free sliding along asymmetric non-CSL tilt GBs in face-centered cubic (FCC) metals using atomistic modeling. In these incommensurate GBs, a dense array of primary misfit dislocations accommodates the local interfacial mismatch, whereas a more widely spaced array of secondary GB misfit dislocations accommodates the residual mismatch. Uniform sliding calculations reveal two distinct quantities: the minimum GB structural periodicity {\\lambda}, defined by the repeating arrangement of primary GB misfit dislocations, and the slip vector b, determined by the minimum displacement-shift-complete translation that restores an equivalent GB structure. Nonuniform sliding proceeds through the glide of secondary GB misfit dislocations, which carry b and transform successive boundary segments between crystallographically equivalent translation states. These secondary misfit dislocations dissociate into partials, each carrying a partial Burgers vector b_p and connecting intermediate interfacial states. The characteristic spacing between secondary misfit partials defines a longer periodicity {\\Lambda}. Below the athermal stress, each partial glides through a two-step thermally activated kink-pair mechanism, advances the partial by one structural period l. These results establish a unified crystallographic and dislocation-based framework for understanding stress-driven sliding in structurally complex asymmetric GBs.", "url": "https://arxiv.org/abs/2609.14673", "type": "理论+数值", "summary": "1. 受原位原子分辨观测启发，采用原子模拟研究FCC金属中非对称非CSL倾斜晶界的无台阶滑动。\n2. 其卖点是揭示失配位错层级：初级阵列容纳局部错配并定义结构周期λ，次级位错承载滑移矢量b，分解部分位错经扭折对热激活逐周期l滑移。\n3. 这一晶体学与位错统一的框架为复杂非对称非CSL晶界的应力驱动滑移提供机制解释，并启发多晶金属界面变形建模。", "summary_source": "deepseek", "authors": [{"name": "Kunqing Ding"}, {"name": "Yazhuo Liu"}, {"name": "Yin Zhang"}, {"name": "Lihua Wang"}, {"name": "Xiaodong Han"}, {"name": "Ting Zhu"}], "featured_authors": [{"name": "Kunqing Ding"}, {"name": "Yazhuo Liu"}, {"name": "Yin Zhang"}, {"name": "Lihua Wang"}, {"name": "Xiaodong Han"}, {"name": "Ting Zhu"}], "author_count": 6}, {"id": "2609.14683", "category": "cond-mat", "title": "Persistent nonlinear Hall effect driven by parallel field across a topological phase transition and intraband sign-reversing integer quantum Hall effect", "abstract": "We investigate the linear and nonlinear Hall effects in a two-dimensional Rashba spin-orbit coupled nodal ring electronic system. We consider both the cases of linear Hall effect, the Berry curvature induced anomalous Hall and the perpendicular magnetic field-induced integer quantum Hall effect. We observe that the system exhibits a topological gap along the boundary of the nodal ring that strongly depends on the radius of the nodal ring and the strength of the Rashba spin-orbit interaction, resulting in the quantum anomalous Hall effect. Subsequently, we include a perpendicular uniform magnetic field and obtain the exact Landau levels that exhibit sign reversal in the slope with magnetic field around the ring boundary. This causes a sign reversal in the quantum Hall conductivity in the same band by tuning the magnetic field. Most importantly, we also show that when the magnetic field is strictly parallel to the system, it can induce an anisotropy to the Berry curvature that leads to the emergence of the nonlinear Hall effect. Additionally, tuning the parallel field can close and reopen the topological gap, resulting in the reverse topological phase transition from the topological Chern insulator to a trivial insulator. The nonlinear Hall effect remains persistent in both phases, but its dependence on the chemical potential exhibits distinct signatures. Noticeably, the nonlinear Hall response exhibits a sign-changing peak structure in Chern insulating phase whereas it displays a single-sign response in trivial insulating phase. These distinct signatures suggest that nonlinear Hall can serve as a probe to study such a topological phase transition.", "url": "https://arxiv.org/abs/2609.14683", "type": "理论", "summary": "1. 该工作研究了二维Rashba自旋轨道耦合节点环体系中的线性与非线性霍尔效应，并计入垂直磁场下的整数量子霍尔效应与精确朗道能级。\n2. 平行磁场诱导贝里曲率各向异性而产生非线性霍尔效应，并可通过能隙闭合重开驱动拓扑相变；垂直磁场下朗道能级斜率反号使同一能带内量子霍尔电导变号。\n3. 非线性霍尔响应在Chern绝缘相呈变号峰结构、在平庸绝缘相呈单符号响应，可作为探测该拓扑相变的实验探针。", "summary_source": "deepseek", "authors": [{"name": "Suheel Ahmad Malik"}, {"name": "M. A. H. Ahsan"}, {"name": "SK Firoz Islam"}], "featured_authors": [{"name": "Suheel Ahmad Malik"}, {"name": "M. A. H. Ahsan"}, {"name": "SK Firoz Islam"}], "author_count": 3}, {"id": "2609.14731", "category": "cond-mat", "title": "Colossal magnetostriction effect in rare-earth orthoferrites", "abstract": "Within the entire gamut of magnetostrictive, piezomagnetic, and ferromagnetic shape memory alloy systems, the striction effect is found to vary from a few tens of parts per million to a few percent. Here, we report the observation of an unprecedentedly large magnetic-field-induced lattice strain along the $c$ axis (more than 60-100% at 90 kOe field) in single crystals of orthorhombic $R$FeO$_3$ ($R$ = Dy, Ho) below their spin-reorientation transition temperature $T_{SR}$. However, the striction effect is two orders of magnitude smaller along the $a$ and $b$ axes. Like magnetostriction, the magnetodielectric effect is highly anisotropic and very large along the $c$ axis. Such gigantic striction and dielectric effects along the $c$ axis arise as a result of a magnetic-field-induced first-order structural phase transition which possibly stems from large spin-orbit coupling (and, thereby, enormous magnetocrystalline anisotropy). The observed colossal striction in rare-earth orthoferrites could open new opportunities for applications requiring large, reversible magnetic-field-induced strain.", "url": "https://arxiv.org/abs/2609.14731", "type": "理论", "summary": "1. 该工作在正交结构RFeO3（R=Dy、Ho）单晶中，于自旋重取向转变温度T_SR以下观测到沿c轴由磁场诱导的巨磁致伸缩，应变在90 kOe下可达60%–100%以上。\n2. 其核心机制是磁场诱导的一级结构相变，可能源于强自旋轨道耦合与巨大磁晶各向异性，导致c轴伸缩与磁介电效应异常巨大且高度各向异性，而a、b轴响应小两个数量级。\n3. 该发现将巨磁致伸缩拓展到稀土正铁氧体体系，并为需要大且可逆磁场诱导应变的器件应用提供了新候选材料与调控自由度。", "summary_source": "deepseek", "authors": [{"name": "Moumita Das"}, {"name": "Arup Ghosh"}, {"name": "Moumita Nandi"}, {"name": "Arumugam Thamizhavel"}, {"name": "Dipten Bhattacharya"}, {"name": "Prabhat Mandal"}], "featured_authors": [{"name": "Moumita Das"}, {"name": "Arup Ghosh"}, {"name": "Moumita Nandi"}, {"name": "Arumugam Thamizhavel"}, {"name": "Dipten Bhattacharya"}, {"name": "Prabhat Mandal"}], "author_count": 6}, {"id": "2609.14786", "category": "cond-mat", "title": "Fast dynamical control of quantum droplets via Feshbach resonances", "abstract": "We propose a variational shortcut-to-adiabaticity scheme for the fast dynamical control of one-dimensional quantum droplets in ultracold Bose-Bose mixtures. The control is implemented through time-dependent mean-field (MF) and beyond-mean-field (BMF) nonlinearities, which can be adjusted by tuning intra- and interspecies scattering lengths near Feshbach resonances. Using a bright-droplet variational ansatz, together with inverse engineering, we derive time-dependent interaction protocols that connect prescribed initial and target self-bound states while suppressing residual excitations. We analyze three representative settings: simultaneous control of the MF and BMF terms, control with fixed BMF nonlinearity and time-dependent MF interaction, and control with fixed MF nonlinearity and time-dependent BMF interaction. For the constrained cases, additional variational degrees of freedom are introduced to optimize the protocols while respecting the imposed restrictions. Direct numerical simulations of the extended Gross-Pitaevskii equation confirm final fidelities exceeding $0.99$ on short time scales, and show that the optimised protocols are robust against finite calibration errors of the nonlinear control strength. Our results provide a route toward fast state-to-state manipulation of self-bound quantum fluids and may be useful for controlled matter-wave engineering in ultracold mixtures.", "url": "https://arxiv.org/abs/2609.14786", "type": "理论+数值", "summary": "1. 该工作提出基于变分绝热捷径的方案，通过费什巴赫共振附近原子内与种间散射长度的时变调控，实现一维玻色-玻色混合体中量子液滴的快速动力学控制。\n2. 以亮液滴变分拟设结合逆向工程导出时变相互作用协议，抑制残余激发，约束情形下增设变分自由度优化；GP模拟短时保真度超0.99且对控制强度误差鲁棒。\n3. 该方案为自束缚量子流体的快速态到态操控提供可行路径，并有望用于超冷混合体中的受控物质波工程。", "summary_source": "deepseek", "authors": [{"name": "Jing Li"}, {"name": "Thomas Fogarty"}, {"name": "Thomas Busch"}, {"name": "Andreas Ruschhaupt"}], "featured_authors": [{"name": "Jing Li"}, {"name": "Thomas Fogarty"}, {"name": "Thomas Busch"}, {"name": "Andreas Ruschhaupt"}], "author_count": 4}, {"id": "2609.14846", "category": "cond-mat", "title": "Prescreening Point Defects in Semiconductors With Machine Learning", "abstract": "High-throughput calculations using density-functional theory (DFT) are commonly used to explore point defects for applications in power electronics and quantum technologies. There is currently a major shift away from these traditional simulation techniques towards machine learning (ML) methods. We explore a class of physics-guided ML models for predicting defect formation energies and zero-phonon lines (ZPL) to identify point defects for quantum applications. The models are specifically targeted for use in a prescreening step for accelerated high-throughput workflows, and are therefore designed to avoid the costly relaxation step typically present with ML interatomic potentials (MLIPs). We compare performance for single and double point defect systems in 4H-SiC with ridge, kernel ridge, and multilayer perceptron (MLP) models using three different descriptors representing the defect systems. For vacancies and substitutions, the optimized models give mean absolute errors (MAEs) of 0.437 eV for the formation energy and 0.202 eV for ZPLs, which is just above the level at which such predictions can be useful even beyond the targeted prescreening, i.e., in some applications they may completely replace the need for costly DFT calculations. For interstitials the MAEs are larger, 1.101 eV for the formation energy and 0.230 eV for the ZPL, which, while still useful for prescreening, will not generally be useful for more detailed characterization. Hence, while the results may be further improved by model design and optimization, the models presented in this work are already useful for prescreening in high-throughput characterization of point defects.", "url": "https://arxiv.org/abs/2609.14846", "type": "理论+数值", "summary": "1. 该工作探索物理引导机器学习模型，预测半导体点缺陷的形成能与零声子线，用于量子应用的高通量预筛选。\n2. 其核心优势在于免去MLIP常见的昂贵弛豫步骤，在4H-SiC空位/替位缺陷上形成能与ZPL的MAE分别约0.437 eV和0.202 eV。\n3. 这为高通量缺陷表征提供预筛选方案，空位/替位缺陷甚至可能部分替代DFT，而间隙缺陷仍需优化。", "summary_source": "deepseek", "authors": [{"name": "Paul Karlsson"}, {"name": "Joel Davidsson"}, {"name": "Rickard Armiento"}], "featured_authors": [{"name": "Paul Karlsson"}, {"name": "Joel Davidsson"}, {"name": "Rickard Armiento"}], "author_count": 3}, {"id": "2609.14906", "category": "cond-mat", "title": "Neural-Network Solutions to Real-Space Charge Density and Generalization", "abstract": "The Hohenberg-Kohn theorem establishes that, in principle, the ground state (GS) charge density contains all GS information of a many-electron system, such that all GS observables can be expressed as functionals of the GS charge density. Conventional Kohn-Sham density functional theory requires iterative solution of the self-consistent-field equations at substantial computational cost, motivating the development of deep learning surrogates for electronic structure calculations and, in turn, accelerating computer-aided materials design. Here, we propose \\textbf{AIDEN}, an \\underline{A}tomic-\\underline{I}nteraction \\underline{D}ensity \\underline{E}quivariant \\underline{N}etwork for solving real-space charge density. AIDEN separates the element-dependent one-center density from environment-induced density redistribution and represents the latter through complementary atom- and edge-centered tensor correlations. A continuous low-rank Gaussian decoder then reconstructs the density at arbitrary spatial coordinates while reusing atomic encodings independently of the evaluation grid. AIDEN achieves state-of-the-art accuracy on periodic crystal benchmarks while remaining competitive for molecular systems, and further demonstrates zero-shot transferability across several structurally distinct out-of-distribution case studies. Furthermore, AIDEN provides substantially faster inference than both baseline models and full SCF calculations, enabling efficient charge density reconstruction for large-scale electronic structure calculations.", "url": "https://arxiv.org/abs/2609.14906", "type": "理论+数值", "summary": "1. 该工作提出AIDEN——一种原子相互作用密度等变网络，用于从结构直接求解实空间基态电荷密度，并将元素依赖的单中心密度与环境诱导的密度重分布分离建模。\n2. 其核心在于用原子与键中心的互补张量关联描述环境重分布，并以连续低秩高斯解码器在任意坐标重建密度，从而在周期性晶体基准上达到最优精度、对分子体系具竞争力，并展现跨结构零样本泛化与快于自洽场计算的推断速度。\n3. 这为以深度学习替代昂贵的自洽场迭代、实现大规模电子结构计算中的高效密度重构提供了可行路径，并有望加速计算辅助材料设计。", "summary_source": "deepseek", "authors": [{"name": "Yuxuan Zeng"}, {"name": "Taoyuze Lv"}, {"name": "Zhicheng Zhong"}], "featured_authors": [{"name": "Yuxuan Zeng"}, {"name": "Taoyuze Lv"}, {"name": "Zhicheng Zhong"}], "author_count": 3}, {"id": "2609.14925", "category": "cond-mat", "title": "Machine Learning Guided CALPHAD Design of Ru-Stabilized BCC B2 Refractory Alloys", "abstract": "Refractory alloys with a ductile body-centered-cubic (BCC) matrix strengthened by ordered B2 precipitates offer a high-temperature analogue to the gamma/gamma-prime architecture of Ni-based superalloys. Ruthenium is particularly attractive as a B2 stabilizer because RuHf, RuZr, and RuTi can retain ordered phases well above 1300 C. In this work, equilibrium CALPHAD calculations were coupled with random-forest-guided active learning to explore a ten-element Nb-based, Ru-bearing composition space containing Nb, Ta, Mo, V, Ru, Ti, Zr, Hf, Al, and Y at 1 at.% resolution. Across 500 CALPHAD-evaluated alloys, the calculations reproduced the principal trends reported for the Ru-B2 design space. RuHf and RuZr remained stable to the solidus, RuTi commonly exhibited a solutionizing window, and Al-containing alloys preferentially formed competing sigma and A15 phases. The upper bound of the BCC+B2 field increased from a median of approximately 1570 C at 5 at.% Ru to approximately 1980 C near 9-10 at.% Ru. Among the group-IV additions, Hf, Zr, and Ti produced progressively lower two-phase stability. Re-screening using physically motivated criteria identified 100 alloys satisfying requirements for high-temperature BCC+B2 stability, absence of liquid, phase purity, and appropriate secondary-phase fraction, including 19 Ru-lean compositions and two independently reported HfRu-B2 alloys. The results establish practical compositional design rules for Ru-stabilized dual-phase refractory alloys and identify phase-specific BCC/B2 lattice misfit as a key target for future design cycles.", "url": "https://arxiv.org/abs/2609.14925", "type": "理论+数值", "summary": "1. 该工作将平衡CALPHAD计算与随机森林引导的主动学习相耦合，在十元Nb基含Ru成分空间以1 at.%分辨率评估500个合金，系统搜索BCC基体加B2析出相难熔合金。\n2. 主要卖点是复现并量化了Ru-B2设计趋势：RuHf/RuZr稳定至固相线，RuTi有固溶窗口，Al促生sigma/A15相，BCC+B2上限随Ru由5 at.%的约1570°C升至9–10 at.%的约1980°C；按物理准则筛出100个合格成分，含19个低Ru合金。\n3. 该结果不仅为Ru稳定双相难熔合金提供可操作的成分设计规则，也将BCC/B2相特异晶格错配确立为后续设计周期的关键调控目标。", "summary_source": "deepseek", "authors": [{"name": "Nathan Peterson"}, {"name": "Avik Mahata"}, {"name": "Nick Beaver"}, {"name": "Mohsen Kivy"}], "featured_authors": [{"name": "Nathan Peterson"}, {"name": "Avik Mahata"}, {"name": "Nick Beaver"}, {"name": "Mohsen Kivy"}], "author_count": 4}, {"id": "2609.14994", "category": "cond-mat", "title": "Heisenberg-like critical behavior in the quasi-two-dimensional metallic ferromagnet LaCrSb3", "abstract": "LaCrSb3 is a material exhibiting both quasi-two-dimensional spin fluctuations and three-dimensional magnetic interaction characteristics. By measuring the isothermal magnetization of single-crystals and conducting a systematic critical behavior analysis, we clarify the critical properties of its ferromagnetic phase transition and the intrinsic magnetic interaction mechanism. Based on high-precision isothermal magnetization data measured in the vicinity of the critical point, the Curie temperature for the ferromagnetic-paramagnetic phase transition is determined to be TC = 126 K, with the critical exponents obtained as $\\beta$ = 0.376, $\\gamma$ = 1.417 and $\\delta$ = 4.76 via the self-consistent iterative method based on the Arrott-Noakes equation. The reliability of these critical exponents is verified by the Widom scaling law, the magnetic state scaling equation and other analyses. A comparison with theoretical models demonstrates that the critical behavior of the magnetic phase transition in this system basically belongs to the universality class of the three-dimensional Heisenberg model. This conclusion is further confirmed by the distance-dependent decay behavior of the exchange interaction J(r), revealing the dominant role of isotropic direct exchange interactions in this system. Finally, drawing on research findings of other quasi-two-dimensional magnetic materials, this work proposes that LaCrSb3 may exhibit finite-temperature magnetic order in the two-dimensional limit, thereby possessing important theoretical research significance and promising practical application prospects.", "url": "https://arxiv.org/abs/2609.14994", "type": "理论", "summary": "1. 该工作基于单晶等温磁化测量和临界行为分析，厘清LaCrSb3铁磁相变的临界性质与本征磁性相互作用机制。\n2. 定出TC=126 K及β=0.376、γ=1.417、δ=4.76，经维多姆标度律与磁态标度验证，临界行为属三维海森堡普适类。\n3. 交换作用J(r)的衰减表明各向同性直接交换主导，并启示该材料在二维极限可能仍有有限温度磁序。", "summary_source": "deepseek", "authors": [{"name": "Qianhui Mao"}, {"name": "Haotian Deng"}, {"name": "Bin Chen"}, {"name": "Jinhu Yang"}], "featured_authors": [{"name": "Qianhui Mao"}, {"name": "Haotian Deng"}, {"name": "Bin Chen"}, {"name": "Jinhu Yang"}], "author_count": 4}, {"id": "2609.15050", "category": "cond-mat", "title": "Scalable construction of force-constant basis sets for large-scale anharmonic lattice-dynamical calculations", "abstract": "A projector-based formulation of force constants in crystalline materials provides a systematic framework for constructing force-constant bases and determining force constants from force--displacement datasets while rigorously satisfying crystal symmetry, permutation symmetry, and translational invariance. In this work, we develop an efficient eigenvalue solver for projection matrices and integrate it into the projector-based framework. The proposed method substantially reduces the computational cost and enables practical calculations for large-scale systems, low-symmetry crystals, and higher-order force constants that are difficult to treat using conventional approaches. Applications to self-consistent phonon calculations for assessing the grain-boundary excess free energy, lattice thermal conductivity calculations in complex compounds, and fourth-order force-constant estimations demonstrate the efficiency and robustness of the proposed framework for large and complex materials systems.", "url": "https://arxiv.org/abs/2609.15050", "type": "理论+数值", "summary": "1. 该工作针对投影子力常数框架，发展了投影矩阵的高效本征值求解器，并集成到力常数基组构建与力-位移数据拟合流程中，以支撑大规模非谐晶格动力学计算。\n2. 其核心优势是在严谨满足晶体对称性、置换对称性和平移不变性的同时，显著降低力常数基组构建成本，使低对称晶体、高阶力常数及大体系计算成为可能。\n3. 该框架已在晶界过剩自由能的自洽声子评估、复杂化合物晶格热导率计算和四阶力常数估计中得到验证，为大而复杂材料体系的非谐晶格动力学模拟提供了可扩展且稳健的途径。", "summary_source": "deepseek", "authors": [{"name": "Atsuto Seko"}, {"name": "Atsushi Togo"}], "featured_authors": [{"name": "Atsuto Seko"}, {"name": "Atsushi Togo"}], "author_count": 2}, {"id": "2609.15092", "category": "cond-mat", "title": "Bias and Correlations in Quasiperiodicity: Impact on Localization in an Extended Aubry-André Model", "abstract": "Unlike in Anderson localization - where any amount of uncorrelated disorder localizes all eigenstates in one dimension - a one-dimensional system with quasiperiodic potential supports a richer range of localization behavior. This paper investigates the fundamental question of which potential characteristics govern localization properties. We characterize quasiperiodic potentials using two independent parameters, correlation and bias, and demonstrate that bias, in addition to correlation, critically influences localization. Through the study of an extended Aubry-André model, in which a tunable parameter allows systematic control over both the bias and correlation of the potential, we show that bias is key in determining the fraction of delocalized states. An increase in the potential strength generally enhances the tendency toward localization, while simultaneously strengthening the correlations in the quasiperiodic potential. This apparent counterintuitive behavior can be understood in terms of the bias parameter: increasing the potential strength reduces the bias, which in turn favors localization. For the family of Hamiltonians considered, we identify two critical bias thresholds: below the lower threshold, the entire spectrum is localized, whereas below the higher threshold, at most a fraction of the states can be delocalized, precluding delocalization of the entire spectrum. To further test our framework, we examine a quasiperiodic model with zero bias and find that, despite its correlated nature, all states become localized even at very weak potential strengths - recovering the Anderson-like scenario.", "url": "https://arxiv.org/abs/2609.15092", "type": "理论", "summary": "1. 该工作通过扩展 Aubry-André 模型，将准周期势分解为关联与偏置两个独立参数，系统研究二者如何共同决定一维系统中的局域化行为。\n2. 其核心卖点在于揭示偏置而非仅关联是控制非局域态比例的关键：增强势强度总体促进局域化，却同时减小偏置，从而解释了关联增强反而有利于局域化的反直觉现象。\n3. 作者进一步识别出两个临界偏置阈值——低于低阈值全谱局域，低于高阈值至多仅有部分态可非局域化；并验证零偏置关联准周期模型在极弱势下仍全谱局域，暗示偏置可作为刻画准周期局域化的独立控制参量。", "summary_source": "deepseek", "authors": [{"name": "Adithya J D"}, {"name": "Ranjan Modak"}, {"name": "Shaon Sahoo"}], "featured_authors": [{"name": "Adithya J D"}, {"name": "Ranjan Modak"}, {"name": "Shaon Sahoo"}], "author_count": 3}, {"id": "2609.15116", "category": "cond-mat", "title": "Ionic-Radius Mismatch as a Structural Lever for Tuning Phase Transitions and Luminescent Thermometry", "abstract": "The widespread implementation of luminescence thermometers requires a comprehensive understanding of the structural factors governing their thermometric performance. Establishing such structure-property relationships is essential for the rational design of sensing materials with application-tailored characteristics. This is particularly relevant for phase-transition-based luminescence thermometers, which offer exceptionally high relative sensitivities. The systematic analysis of K3Lu(PO4)2:Eu3+ demonstrates that introducing co-dopant ions with a controlled ionic-radius mismatch provides an effective strategy for tailoring phase-transition characteristics. This approach enables both the phase-transition temperature and thermal operating range to be controlled. Specifically, the transition temperature shifts from 210 K for K3Lu(PO4)2:Eu3+ to 310 K for K3Lu(PO4)2:Eu3+,10%La3+, while the operating range broadens from 30 to 60 K. Importantly, linear correlations between the ionic-radius mismatch parameter, {\\Omega}, and the phase-transition temperature, enthalpy, and entropy provide a quantitative framework for controlling the thermodynamics of the transition through compositional engineering. Beyond luminescence thermometry, these relationships establish a general strategy for designing materials exhibiting first-order phase transitions with tailored thermodynamic characteristics, opening opportunities for their optimization across a broad range of functional applications.", "url": "https://arxiv.org/abs/2609.15116", "type": "理论+数值", "summary": "1. 该工作系统研究了K3Lu(PO4)2:Eu3+中引入离子半径失配共掺离子对相变与发光测温的调控。\n2. 其卖点在于建立离子半径失配参数Ω与相变温度、焓、熵的线性关系，并实现210→310 K相变温度和30→60 K热工作范围调控。\n3. 这为通过组分工程定制一阶相变热力学、并推广至发光测温以外功能材料设计提供了可量化策略。", "summary_source": "deepseek", "authors": [{"name": "A. Javaid"}, {"name": "M. Szymczak"}, {"name": "A. Sieradzki"}, {"name": "L. Marciniak"}], "featured_authors": [{"name": "A. Javaid"}, {"name": "M. Szymczak"}, {"name": "A. Sieradzki"}, {"name": "L. Marciniak"}], "author_count": 4}, {"id": "2609.15231", "category": "cond-mat", "title": "Quasilocal transport in the integer quantised Hall effect: adiabatic separation, local Ohm's law, and Joule heating of the incompressible strips", "abstract": "We reassess the semiclassical route to integer quantum Hall transport around one idea: the separation of fast, quantised cyclotron motion from a slow, self-consistently screened guiding-centre landscape. Bohr--Sommerfeld quantisation of the canonical action fixes the Landau spectrum; smooth confinement turns it into Born--Oppenheimer surfaces with adiabatic parameter $\\ell|\\nabla V|/\\hbar\\omega_c$; screening supplies the self-consistent field. Transport is quasilocal, $R_H=\\int\\rho_Hj_y\\,dx/\\int j_y\\,dx$ with $j_y\\propto1/\\rho_l$, so within the regularised local Ohm model the incompressible strips attract the current by weight and the computed Joule-power profile follows the current profile. In linear response the intrinsic electrostatic AC correction of the frozen-profile model is reactive, $\\mathrm{Im}\\,R_H\\propto\\omega$, with $\\mathrm{Re}\\,R_H-R_H^{\\rm DC}\\propto\\omega^{2}$ below $10^{-9}$ up to $2$~MHz. With the current fed back into the electrostatics at $1$--$5\\,\\mu$A, where the Hall drop is one to five cyclotron gaps, the driven boundary condition breaks the reflection symmetry of the bar, the Hall drop concentrates in one strip (interchanged to $10^{-9}$ under current reversal), and the plateau narrows from its low-field flank while, for the GaAs parameters studied, its high-field edge stays at $\\nu(0)=2$. A local transverse thermal closure inspired by Akera, evaluated as a post-process on the frozen profile with two phonon-loss laws, indicates that the narrow current-carrying strips of the low-field flank may heat by of order the lattice temperature; with the activated-heat-capacity closure the cold strip loses its stationary solution at model-dependent currents of $0.3$--$2\\,\\mu$A. The thermal conclusions are bounded by the loss law and by the frozen profile, and are presented as estimates.", "url": "https://arxiv.org/abs/2609.15231", "type": "理论+数值", "summary": "1. 该工作重新审视整数量子霍尔输运的半经典图像，基于快回旋运动与慢导心势的绝热分离建立准局域输运与局域欧姆定律框架。\n2. 其卖点在于用绝热分离和自洽屏蔽导出准局域输运：不可压缩条带按权重吸引电流、焦耳热随电流分布，且电流反馈破坏反射对称并集中霍尔电压降。\n3. 这为整数量子霍尔中准局域输运与不可压缩条带焦耳热提供半经典图像，但热学结论受声子损失律和冻结势剖面限制，应视为估计。", "summary_source": "deepseek", "authors": [{"name": "A. Siddiki"}], "featured_authors": [{"name": "A. Siddiki"}], "author_count": 1}, {"id": "2609.15259", "category": "cond-mat", "title": "Borromean Criticality in Two Dimensions", "abstract": "The characteristic feature of counterflow superfluids consisting of $N\\geq 3$ components -- the so-called Borromean supercounterfluids (BSCF) -- is the presence of $N$ distinct elementary topological excitations (vortices) despite having only $N-1$ independent Goldstone modes. We show that this remarkable property clearly manifests itself at the Berezinskii-Kosterlitz-Thouless-type transition from the BSCF to the normal state, under the conditions of slight to moderate deviations from the case of exact intercomponent symmetry. More generally, our analysis also applies to any multicomponent superfluid with intercomponent drag fine-tuned to the value when certain composite vortices compete energetically with elementary ones.", "url": "https://arxiv.org/abs/2609.15259", "type": "理论", "summary": "1. 该工作分析了二维 N≥3 组分 Borromean 超逆流（BSCF）在组分间对称性轻微至中度破缺条件下向正常态发生的 BKT 型相变。\n2. 其核心卖点在于，尽管体系仅有 N−1 个独立 Goldstone 模，却存在 N 种基本拓扑涡旋，且该异常在临界区清晰显现并支配转变行为。\n3. 更一般地，该分析适用于任何组分间拖曳被精细调节至特定值、使复合涡旋与基本涡旋能量竞争的多组分超流体，为识别此类拓扑激发与临界现象提供启示。", "summary_source": "deepseek", "authors": [{"name": "Alexandru Golic"}, {"name": "Igor Timoshuk"}, {"name": "Albert Samoilenka"}, {"name": "Egor Babaev"}, {"name": "Boris Svistunov"}], "featured_authors": [{"name": "Alexandru Golic"}, {"name": "Igor Timoshuk"}, {"name": "Albert Samoilenka"}, {"name": "Egor Babaev"}, {"name": "Boris Svistunov"}], "author_count": 5}, {"id": "2609.15271", "category": "cond-mat", "title": "Disorder-Tailored Delocalization", "abstract": "We derive disorder fields tailored by the details of a choice of a delocalized wave function. We first investigate the unidirectional Hatano-Nelson chain and its localization properties under $M$-base diagonal disorder with variable weights. The spectrum forms loops in the complex plane and the loop parameter is a good quantum number similar to a momentum. All eigenstates are subexponentially `localized', i.e. the logarithm of the absolute value of the wave function performs a random walk in space, and are characterized by a corresponding length scale $\\xi_{sel}$ as shown in 1998 by Silvestrov for the general Hatano-Nelson chain. For $M=2$ real-valued binary disorder with equal weights the model was solved in Zeitschrift für Naturforschung A 81 421, yielding Cassini oval spectral loops and a diverging subexponential localization length for two eigenstates and for disorder weaker than a critical value set by the hopping strength. When the disorder field for any $M$ and arbitrary weights is confined to circles in the complex plane with radius equal to the hopping strength, the circle center will belong to the spectrum and to one of the spectral loops, and host a plane-wave-like eigenstate with diverging $\\xi_{sel}$. We generalize to tailoring on-site disorder for a given eigenstate at a given energy, for any lattice dimension, and any hopping field (both ordered and disordered), for Hermitian and non-Hermitian systems. We exemplify by constructing a one-dimensional chain with Anderson-localized eigenstates hosting a completely delocalized one with random phases. The localization length diverges as $1/|E|^{2/3}$ upon approaching the delocalized state. Our method can be used for the systematic construction of disorder fields which host predefined eigenstates with arbitrary properties.", "url": "https://arxiv.org/abs/2609.15271", "type": "理论+数值", "summary": "1. 该工作提出按选定离域波函数反向定制无序场的方法，并以单向Hatano-Nelson链为例研究M基对角无序下的复谱环与亚指数局域化，其中环参数类似动量可作为好量子数。\n2. 其核心卖点在于：当无序场取复平面上半径等于跃迁强度的圆时，圆心落入谱及某个谱环，并对应ξ_sel发散的平面波式本征态；方法可推广至任意维度、任意跃迁场及厄米/非厄米体系。\n3. 该框架能以给定能量和本征态定制在位无序，并在Anderson局域化链中嵌入完全离域态，其局域长度按1/|E|^{2/3}发散，为无序工程和预定波函数态提供启发。", "summary_source": "deepseek", "authors": [{"name": "Yeongjun Kim"}, {"name": "Supriyo Ghosh"}, {"name": "Sergej Flach"}], "featured_authors": [{"name": "Yeongjun Kim"}, {"name": "Supriyo Ghosh"}, {"name": "Sergej Flach"}], "author_count": 3}, {"id": "2609.15299", "category": "cond-mat", "title": "Benchmarking Machine-Learning Interatomic Potentials for Dynamical Stability in Inorganic Semiconductor Nanocrystals: A CdSe Case Study", "abstract": "Machine-learning interatomic potentials (MLIPs) enable nanosecond-scale atomistic simulations of inorganic semiconductor nanocrystals, but low errors on held-out configurations do not necessarily guarantee stable molecular dynamics. We benchmark five graph-neural-network MLIPs, SchNet, PaiNN, NequIP, Allegro and MACE, for dynamical stability in a chloride-passivated cadmium selenide nanocluster containing 149 atoms. The models were trained under harmonized conditions on 1,000 configurations and evaluated against 2,000 held-out configurations generated using density functional theory, considering force accuracy, computational efficiency, uncertainty and structural stability during 1 ns simulations at 300 K. Allegro produced the lowest validation force mean absolute errors, ranging from 12 to 14 meV per angstrom, whereas SchNet produced the largest, ranging from 84 to 110 meV per angstrom. This ranking did not predict dynamical robustness: NequIP remained stable for 1 ns without additional training data, whereas MACE became stable only after an ensemble-based active-learning procedure added 34 uncertainty-selected configurations. PaiNN and Allegro remained unstable after the addition of 100 and 95 configurations, respectively, and SchNet also failed to achieve stable dynamics within the tested augmentation budget. Under the benchmark hardware conditions, the machine-learning potentials required 6-66 ms per molecular-dynamics step, compared with approximately 20 s for density functional theory. These results show that held-out prediction errors alone are insufficient for selecting interatomic potentials for finite, surface-dominated nanostructures. Reliable deployment requires long-timescale dynamical testing combined with uncertainty-guided refinement, while the effectiveness and data efficiency of active learning remain strongly architecture dependent.", "url": "https://arxiv.org/abs/2609.15299", "type": "理论+数值", "summary": "1. 该工作在统一条件下基准测试五种图神经网络机器学习势在149原子氯钝化CdSe纳米团簇中的动力学稳定性。\n2. 卖点是验证力误差不能预测1 ns、300 K动力学稳定性：Allegro误差最低仍不稳定，MACE需不确定性主动学习加34构型才稳定。\n3. 对有限表面主导纳米结构，仅靠留出误差不足以选势，可靠部署需长时动力学测试与不确定性引导精修，且主动学习效率依赖架构。", "summary_source": "deepseek", "authors": [{"name": "M. Usman"}, {"name": "M. Suleymanova"}, {"name": "Z. U. Abideen"}, {"name": "M. Fernández-Pendás"}, {"name": "I. Infante"}], "featured_authors": [{"name": "M. Usman"}, {"name": "M. Suleymanova"}, {"name": "Z. U. Abideen"}, {"name": "M. Fernández-Pendás"}, {"name": "I. Infante"}], "author_count": 5}, {"id": "2609.15300", "category": "cond-mat", "title": "Engineering Competing Fractional Topological States in a BHZ Superlattice", "abstract": "Scalar superlattices offer a route from simple topological bands to fractionalized states, while multicomponent systems raise the additional question of which fractional order is energetically selected. We show that a scalar superlattice applied to the Qi-Wu-Zhang (QWZ) Chern-insulator model produces an isolated C = +1 miniband with strongly improved Berry-curvature and quantum metric uniformity. Exact diagonalization of the projected interaction identifies a 1/3 fractional Chern insulator in this miniband. Restoring the time-reversed partner to form the Bernevig-Hughes-Zhang (BHZ) superlattice yields, at total filling 2/3, a balanced fractional quantum spin Hall (FQSH)-like state and a fully polarized 2/3 fractional Chern insulator. Their competition separates two aspects of fractional-state control: the finite-momentum intercomponent coupling governs the stability of the balanced FQSH-like state, whereas a uniform pseudospin anisotropy shifts the relative energies of conserved sectors and can switch the global ground state between the balanced and polarized states. These results establish a minimal lattice setting that connects topological-miniband reconstruction, fractional-state formation, and fractional-state selection, illustrating how distinct levels of control can be combined to navigate competing fractional topological states.", "url": "https://arxiv.org/abs/2609.15300", "type": "理论+数值", "summary": "1. 该工作将标量超晶格施加于QWZ陈绝缘体，并恢复时间反演配对构建BHZ超晶格，以研究竞争的分数量子拓扑态。\n2. 其关键是在C=+1微带中通过投影相互作用发现1/3分数陈绝缘体，并在BHZ的2/3填充下揭示平衡FQSH态与极化FCI的竞争。\n3. 该最小晶格框架将拓扑微带重构、分数态形成与分数态选择联系起来，并表明分量间耦合与赝自旋各向异性可分别调控竞争性分数拓扑态的稳定性与基态。", "summary_source": "deepseek", "authors": [{"name": "Ke-Chen Liu"}, {"name": "Chen Cheng"}], "featured_authors": [{"name": "Ke-Chen Liu"}, {"name": "Chen Cheng"}], "author_count": 2}, {"id": "2609.15323", "category": "cond-mat", "title": "Statistical levels and spatial modes of Fock-space heterogeneity in many-body localization crossovers", "abstract": "Near many-body localization crossovers, local memory fluctuates strongly among eigenstates and ensemble realizations, but the observed heterogeneity combines contributions from different statistical levels. We develop a statistical framework based on configuration-space distance distributions that uses a variance decomposition to separate fluctuations within eigenstates, between eigenstates of one sample, and between samples. Applying this framework to random-cosine and quasiperiodic-cosine Ising ensembles with the same one-site field marginal, we find that, at the exact-diagonalization sizes studied, the clearest difference occurs among disorder realizations or quasiperiodic phase samples, whereas within-eigenstate and within-sample eigenstate-to- eigenstate contributions remain broadly comparable. Spatial covariances show that random outer fluctuations have a much stronger uniform component, whereas quasiperiodic phase fluctuations are organized more strongly at finite wave number and partly cancel in the spatial average controlling the distance center. We find that, near the crossover in the random ensemble, the ensemble-averaged distance center is particularly sensitive to changes in the nominal field strength. Combined with sample-to-sample differences in the realized field amplitude, this mean response accounts for much of the sample-to-sample variation in the distance center. Analysis of half-chain entanglement further shows that its sample-to-sample fluctuations likewise reflect the combined effects of amplitude variations and its own mean response. An application to a fixed-magnetization spin chain demonstrates the framework in a constrained configuration space. Resolving both statistical level and spatial mode therefore provides a more complete picture of sample- dependent many-body memory and its configuration-space probability geometry.", "url": "https://arxiv.org/abs/2609.15323", "type": "理论", "summary": "1. 该工作提出基于构型空间距离分布的统计框架，用方差分解分离本征态内、同一样本本征态间和样本间涨落，并应用于随机与准周期余弦伊辛系综。\n2. 其核心卖点是同时分辨统计层次与空间模式：随机外涨落更均匀，准周期涨落集中于有限波数并部分抵消，交叉区距离中心对场强及实现场幅差异敏感。\n3. 该框架表明，分辨统计层次与空间模式可更完整刻画样本依赖的多体记忆及其构型空间概率几何，并在固定磁化自旋链中展示。", "summary_source": "deepseek", "authors": [{"name": "Yu-Jing Liu"}, {"name": "Chen Cheng"}], "featured_authors": [{"name": "Yu-Jing Liu"}, {"name": "Chen Cheng"}], "author_count": 2}, {"id": "2609.15371", "category": "cond-mat", "title": "Unified contact-free formulation of linear-response transport theory", "abstract": "Thermal Hall transport is conventionally formulated as a current--current Kubo response supplemented by an energy-magnetization correction obtained through an auxiliary pseudogravitational magnetic field. Motivated by this structure, we develop a unified contact-free moment formulation of linear response to scalar sources. For channels whose source contributions vanish in the dc limit, the transport coefficient is the low-frequency residue of a retarded moment--moment correlator, with equal-time endpoint contributions incorporated before the dc limit is taken. The formulation uses only scalar sources, requires no separate magnetization subtraction, is independent of the local-current gauge, and is invariant under admissible redistributions of bond or interaction energy. It organizes particle, grand-energy, and specified spin-density channels within a common source--moment response matrix. Quadratic Landau--Lifshitz spin waves illustrate the method: the secular growth of polarization-moment correlations isolates the finite Hall residue and yields the magnon thermal Hall and spin Nernst coefficients from the same paraunitary band geometry. The formulation provides a unified operator framework that simplifies the organization of particle, thermal, and spin transport and can streamline calculations by eliminating separate contact and magnetization corrections.", "url": "https://arxiv.org/abs/2609.15371", "type": "理论+数值", "summary": "1. 该工作提出无需接触项的统一矩表述，用标量源统一描述线性响应中的粒子、热与自旋输运通道。\n2. 对直流极限下源贡献消失的通道，输运系数为推迟矩—矩关联子的低频留数，等时端点项须在取极限前计入；仅用标量源，免磁化减除且不依赖局域电流规范。\n3. 该框架可简化粒子、热与自旋输运组织，并以同一赝幺正能带几何从极化矩关联子的久期增长中提取磁子热霍尔与自旋能斯特系数，省去接触与磁化修正。", "summary_source": "deepseek", "authors": [{"name": "Ziqian Wang"}, {"name": "Ji Feng"}], "featured_authors": [{"name": "Ziqian Wang"}, {"name": "Ji Feng"}], "author_count": 2}, {"id": "2609.15380", "category": "cond-mat", "title": "Active pistons extract work by periodic compression alone", "abstract": "Active matter is liable to invent protocols that evade the constraints of equilibrium thermodynamics. We put forward active pistons that extract work by periodic compression alone without changing any bulk property of the system. Such pistons necessarily couple the perturbation imposed by an external operator with some degrees of freedom internal to active components. We illustrate this design principle with elastic networks composed of self-aligning motile particles. For slow protocols, self-alignment always overwhelms mechanical friction when the internal activity exceeds a specific threshold controlled by fluctuations. We identify the key response coefficient that helps delineate regimes of work extraction, and reveal that the corresponding phase diagram follows a master curve with re-entrance in terms of noise amplitude. Overall, our active pistons embody a novel design principle with broad implications for building innovative engines far from equilibrium.", "url": "https://arxiv.org/abs/2609.15380", "type": "数值", "summary": "1. 该工作提出“活性活塞”方案：仅靠周期性压缩即可从自对齐运动粒子构成的弹性网络中提取功，且不改变系统任何体相性质。\n2. 其核心在于将外部算符施加的扰动与活性组分的内禀自由度耦合，并给出关键响应系数；慢协议下，当内活性超过由涨落控制的阈值时，自对齐效应总可压过机械摩擦，对应功提取区域的相图沿噪声幅度呈现带回入的主曲线。\n3. 这一设计原则表明非平衡活性系统可规避平衡热力学约束，为构建远离平衡的新型引擎提供了可操作的思路与参数判据。", "summary_source": "deepseek", "authors": [{"name": "Paul Bernard"}, {"name": "Euijoon Kwon"}, {"name": "Benjamin Buhl"}, {"name": "Étienne Fodor"}, {"name": "Olivier Dauchot"}], "featured_authors": [{"name": "Paul Bernard"}, {"name": "Euijoon Kwon"}, {"name": "Benjamin Buhl"}, {"name": "Étienne Fodor"}, {"name": "Olivier Dauchot"}], "author_count": 5}, {"id": "2609.15402", "category": "cond-mat", "title": "Geometry-induced flocking and topological sound on a defect-free curved surface", "abstract": "We study an ordered polar active flock on a torus and show that topological sound persists on a compact curved surface without topological defects or physical boundaries. Using the covariant Toner Tu theory, we derive an effective nonHermitian Dirac operator whose curvature-induced mass changes sign across the outer and inner equators, producing two Jackiw Rebbi domain walls. These support co-propagating but distinct chiral edge excitations: a density mode localized on the positively curved outer equator and a Goldstone mode localized on the negatively curved inner equator. The bulk bands possess opposite half-integer Chern numbers whose jumps across the domain walls are determined by the sign of the Gaussian curvature. We further show that the localised modes are protected by a one-dimensional Callias index theorem, while the sum of the local indices obeys the Poincare Hopf theorem on the compact surface. Our results establish that curvature alone, independent of defects and boundaries, is sufficient to generate and protect topological sound in active matter, providing a unified connection between non-Hermitian topology, differential geometry, and hydrodynamic theory of collective motion.", "url": "https://arxiv.org/abs/2609.15402", "type": "理论", "summary": "1. 该工作用协变Toner-Tu理论研究环面上的有序极性活性群集，在无拓扑缺陷和物理边界的紧致曲面上推导有效非厄米Dirac算子，证明拓扑声仍然存在。\n2. 曲率诱导的Dirac质量在内、外赤道反号，形成两个Jackiw-Rebbi畴壁，支持共传播但不同的局域模式：正曲率外赤道的密度模与负曲率内赤道的Goldstone模；体带半整数陈数跳变由高斯曲率符号决定，局域模受一维Callias指标定理保护，指标和满足Poincaré-Hopf定理。\n3. 这确立曲率本身、无需缺陷或边界即可产生并保护活性物质拓扑声，为统一非厄米拓扑、微分几何与集体运动流体力学提供联系，并启发无缺陷曲面活性系统的后续研究。", "summary_source": "deepseek", "authors": [{"name": "Devendra Saini"}, {"name": "Atanu Bhatta"}, {"name": "Pritha Dolai"}], "featured_authors": [{"name": "Devendra Saini"}, {"name": "Atanu Bhatta"}, {"name": "Pritha Dolai"}], "author_count": 3}, {"id": "2609.15417", "category": "cond-mat", "title": "From bending to stretching driven peeling of heterogeneous adhesives", "abstract": "We study theoretically the peeling behavior of adhesives. Adopting a fracture mechanics approach, we derive the equation of motion of the adhesion front propagating at the interface between the adhesive and the substrate from which the peel strength is inferred. The originality of our approach lies in the description of the interplay during peeling between the stretching and the bending modes of deformation of the adhesive that is described as a F{\\''o}ppl-Von Karman's thin film. Considering first a straight adhesion front, we retrieve the most salient feature of homogeneous adhesives, namely a peeling angle dependent peel strength driven by bending at large angles and by stretching at low angles. We also derive the shape of the adhesive that can be described using a single bending length scale derived from our model. We then investigate the impact of adhesion heterogeneities. We evidence that the deformations of the adhesion front are governed by a non-local interface elasticity the strength of which decreases with the peeling angle. This phenomenon reflects the transition between a stretching dominated peeling at low angle to a bending driven peeling at large angles that is captured in our model. This transition impacts the stability of adhesive fronts that relaxe more slowly from perturbations and gives rise to a stronger toughening effect in presence of a disorder distribution of adhesion energy at low peeling angles. Overall, this study sheds light on the central role played the elastic deformations of adhesives on their peeling behavior. The proposed framework unfolds the complex interplay between the deformation of adhesives and the peeling driving force that may be leveraged to engineer heterogeneous adhesives with enhanced properties. It also provides rich insights on the mechanisms underlying the emergence of non-local elasticity in interface problems.", "url": "https://arxiv.org/abs/2609.15417", "type": "理论", "summary": "1. 该工作用断裂力学方法理论研究了非均质粘附剂的剥离，推导界面粘附前沿运动方程并预测剥离强度。\n2. 其核心是用Föppl–von Kármán薄板耦合弯曲与拉伸，揭示剥离角调控的非局域界面弹性及前沿失稳与增韧机制。\n3. 该框架将粘附剂弹性变形与剥离驱动力关联，为设计高性能非均质粘附剂和理解界面非局域弹性提供启发。", "summary_source": "deepseek", "authors": [{"name": "Laurent Ponson"}], "featured_authors": [{"name": "Laurent Ponson"}], "author_count": 1}, {"id": "2609.15428", "category": "cond-mat", "title": "Shannon Entropy as an Order Parameter for the Two-Dimensional Confined Coulomb Systems: Exact Balance Law, Topological Charge Sum Rule, and Boundary Saturation", "abstract": "We establish a complete information-theoretic framework for the known minimum-energy configurations of the two-dimensional Thomson problem on a hard-wall disk, based on the Shannon entropy of the Voronoi topological charge distribution. Two exact results are proven and hold for all studied systems of size $N=12$--$10^5$. First, an entropy balance law decomposes the total entropy into bulk, boundary, and mixing contributions without approximation. Second, a topological charge sum rule fixes the total charge at twice the number of boundary particles plus six; together with the observed separation of bulk and boundary coordination numbers, it yields exact relations between the populations of three- and four-coordinated boundary particles and the bulk charge. We further prove that the boundary entropy is bounded by the binary maximum and that saturation of this bound is equivalent to the bulk charge per boundary particle approaching minus one half, a regime that the framework itself restricts to boundaries of at least twelve particles. All identities are verified numerically to machine precision, locating bulk nucleation at $56$ particles, the maximum of global disorder at $146$, and the onset of boundary saturation beyond about $1000$. The framework carries over to closed spherical geometry, where the total charge is fixed at twelve.", "url": "https://arxiv.org/abs/2609.15428", "type": "理论+数值", "summary": "1. 该工作以Voronoi拓扑电荷分布的Shannon熵为序参量，建立硬壁圆盘上二维Thomson最小能构型的信息论框架。\n2. 其核心卖点是两个精确结果：熵无近似分解为体相、边界、混合项，且总电荷被定为两倍边界粒子数加六并导出边界熵饱和判据。\n3. 该框架经机器精度验证可标定体相成核、全局无序极大与边界饱和，并可推广至总电荷固定为十二的球面几何。", "summary_source": "deepseek", "authors": [{"name": "Goergiy K. Lavrov"}, {"name": "Eduard G. Nikonov"}], "featured_authors": [{"name": "Goergiy K. Lavrov"}, {"name": "Eduard G. Nikonov"}], "author_count": 2}, {"id": "2609.15441", "category": "cond-mat", "title": "Analysis of Granular Flow in a Wedge-Shaped Hopper", "abstract": "We study the velocity and stress distribution for a planar granular flow in a wedge-shaped hopper using Discrete Element Method simulations. Periodic boundary conditions are used in the direction normal to the plane of the flow to simulate a layer system. A parametric study is carried out varying system parameters (orifice width, wedge angle, wall friction and hopper height) and particle properties (particle diameter and particle friction). Scaling relations are obtained for the velocity and stress ratios. The data indicate that the stresses are not dependent on the shear rate, as in the Mohr-Coulomb rheology, however, the friction coefficient varies spatially, and the coaxiality condition is violated in some regions of the flow. A theory based on the scaling relations is presented, which gives good predictions for all the cases studied. Based on the theory, an expression for the mass flow rate, incorporating the effect of system parameters and particle properties is derived, which gives a close match with the computed mass flow rates for all the cases.", "url": "https://arxiv.org/abs/2609.15441", "type": "理论+数值", "summary": "1. 该工作采用离散元方法模拟楔形料斗中的平面颗粒流，并通过周期性边界构造层状体系，系统考察出口宽度、楔角、壁面摩擦、料斗高度、颗粒直径与颗粒摩擦对速度和应力分布的影响。\n2. 其核心是给出速度与应力比的标度关系，发现应力对剪切速率不敏感（与 Mohr-Coulomb 流变一致），但摩擦系数呈空间变化且部分区域违背共轴条件，并据此建立统一理论。\n3. 该理论进一步导出包含系统参数与颗粒属性的质量流量表达式，且与所有模拟工况吻合，可为楔形料斗颗粒流建模和定量设计提供可检验的标度框架。", "summary_source": "deepseek", "authors": [{"name": "Afroz Momin"}, {"name": "Devang Khakhar"}], "featured_authors": [{"name": "Afroz Momin"}, {"name": "Devang Khakhar"}], "author_count": 2}, {"id": "2609.15466", "category": "cond-mat", "title": "Reconstruction of the superstatistical temperature distribution from single-particle kinetic energies", "abstract": "The framework of superstatistics can be used to describe non-Maxwellian single-particle velocity distributions as mixtures of Maxwellian distributions, where the weight is imposed by a probability density associated to the inverse temperature $\\beta = 1/(k_B T)$. Among the typical model choices for $\\beta$ are gamma, inverse gamma and lognormal distributions, sometimes called the universality classes of superstatistics. Given a set of observed velocities, however, there is no direct method to determine the underlying temperature distribution, as temperature itself is not a phase-space observable, and numerically inverting the Laplace transform is an unreliable process. In this work, we show that Jaynes' principle of maximum entropy can be used to successfully reconstruct the inverse temperature distribution from data, by using the logarithmic moments of the kinetic energy as constraints. Although the kinetic energy distributions for the three universality classes are almost indistinguishable at the same mean and variance of $\\beta$, the method correctly discriminates between them.", "url": "https://arxiv.org/abs/2609.15466", "type": "理论+数值", "summary": "1. 该工作针对超统计框架中无法由单粒子速度直接确定逆温度概率密度的问题，提出一种基于最大熵原理的重建方法，并以动能的对数矩作为约束。\n2. 其核心卖点在于避免直接数值反演拉普拉斯变换，并在贝塔均值和方差相同的条件下正确区分伽马、逆伽马与对数正态等超统计普适类。\n3. 这为从可观测动能数据推断非麦克斯韦速度分布背后的温度涨落统计提供了可行途径，并对相关实验数据分析与超统计模型辨识具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Sergio Davis"}], "featured_authors": [{"name": "Sergio Davis"}], "author_count": 1}, {"id": "2609.15629", "category": "cond-mat", "title": "Percolation threshold in cluster-assembled nanogranular palladium films and related strategies for hydrogen detection", "abstract": "Electrical transport in cluster-assembled nanogranular palladium films was investigated in-situ during growth by Supersonic Cluster Beam Deposition. The percolation onset is observed at a thickness of 1.5 nm, while the percolation completion at 2.5 nm. Films at the percolation thickness (2 nm) and beyond the percolation end (5 nm) were subsequently exposed ex-situ to 0.25% hydrogen in air to investigate how hydrogen-induced structural changes in Pd clusters modulate electrical transport and can be exploited as mechanism for selective hydrogen detection. Implantation of palladium clusters in soft polymer styrene-ethylene-butylene-styrene was also explored to promote clusters separation and enhance quantum tunnelling phenomena within electrical transport. The observed electrical transport pattern features stable baselines in air, suggesting material stability, fast response time (T50% < 10 s), and the coexistence of reversible and irreversible components in conduction changes induced by hydrogen exposure. The irreversible component is tentatively attributed to hydrogen-promoted partial coalescence of Pd clusters. The behaviour of the polymer implanted samples suggests an alternative gas detection mechanism where hydrogen-induced polymer swelling dominates over palladium structural modifications. These results disclose novel possible transducing routes for miniaturized hydrogen detection and multimodal sensing.", "url": "https://arxiv.org/abs/2609.15629", "type": "理论", "summary": "1. 该工作通过超音速团簇束沉积原位研究了团簇组装纳米颗粒钯薄膜生长中的电输运，确定渗流起始与完成厚度分别约为1.5纳米和2.5纳米。\n2. 在0.25%氢气空气中，薄膜基线稳定、半响应时间小于10秒，且电导变化兼具可逆与不可逆分量；不可逆分量归因于钯团簇部分聚并，聚合物样品则受氢致溶胀主导。\n3. 这些结果揭示了微型化氢气检测和多模态传感的新型换能路径。", "summary_source": "deepseek", "authors": [{"name": "A. Debot"}, {"name": "D. Balakrishnan"}, {"name": "A.M. Philippe"}, {"name": "E. Barborini"}], "featured_authors": [{"name": "A. Debot"}, {"name": "D. Balakrishnan"}, {"name": "A.M. Philippe"}, {"name": "E. Barborini"}], "author_count": 4}, {"id": "2609.15646", "category": "cond-mat", "title": "Liquid water stability as network resilience", "abstract": "Liquid water is unusually stable, remaining liquid across a wide range of temperatures and even when confined to spaces only a few molecules wide. Yet it eventually fails in both settings: boiling at the critical temperature or drying in narrow pores, phenomena normally studied separately. Water's hydrogen-bond network is thought to underlie this stability, but tracking bond survival has not resolved the puzzle. Extending a concept we recently introduced for wetting (J. Am. Chem. Soc. 148, 21572 (2026)), we show that these stability limits can be accurately derived from a previously overlooked network property: resilience, the capacity to locally repair a broken bond. Only interactions too weak to be repaired constitute genuine defects, a far smaller population than conventional definitions suggest. While intact bonds remain abundant up to failure and conventionally broken bonds already percolate well before it, instability coincides with the percolation of these genuine defects. Comparing local interaction energies with a single intrinsic scale (identified a priori) predicts the wetting-hydrophobicity crossover, nanoconfinement cavitation, and bulk criticality. These phenomena are thus unified through a common molecular framework whose energetic scale also matches a long-unexplained spectroscopic feature of water. A single, parameter-free molecular criterion rooted in network resilience suffices.", "url": "https://arxiv.org/abs/2609.15646", "type": "理论+数值", "summary": "1. 该工作把液态水的稳定性极限，即体相临界沸腾与纳米孔干燥，统一归结为氢键网络被忽视的回弹性——局部修复断键的能力，并据此推导失稳条件。\n2. 其核心卖点在于仅把弱到无法修复的相互作用视为真正缺陷，其数量远少于传统断键；完整键在失稳前仍大量存在，传统断键早已渗流，而失稳恰与真正缺陷渗流重合。\n3. 以单一先验内禀能量尺度比较局部相互作用，该框架无需拟合参数即可预测润湿—疏水转变、纳米受限空化与体相临界性，且该尺度对应水长期未解释的光谱特征，为界面与受限水提供统一分子判据。", "summary_source": "deepseek", "authors": [{"name": "Nicolás A. Loubet"}, {"name": "Gustavo A. Appignanesi"}], "featured_authors": [{"name": "Nicolás A. Loubet"}, {"name": "Gustavo A. Appignanesi"}], "author_count": 2}, {"id": "2609.15717", "category": "cond-mat", "title": "The Case Against Hall-Petch Hardening in High Entropy Carbide Ceramics", "abstract": "Grain size is often used with the Hall-Petch relationship to justify differences in hardness in ceramic materials. Herein, hardness does not vary systematically with grain-size for fully dense, single-phase (Cr,Mo,Ta,V,W)C1-{\\delta} high entropy carbide ceramics for grain sizes that varied by a factor of three. Fully dense, single-phase ceramics with grain sizes from 9.3+/-0.3 to 28.8+/-0.7 microns exhibited a pronounced indentation size effect, with Vickers hardness decreasing from ~28-30 GPa at 0.49 N to ~20-21 GPa at 9.81 N, and Berkovich nanohardness ranging from 26 to 30 GPa at 10 mN. However, at a given load, hardness remained within a narrow range across the grain-size series, and no consistent Hall-Petch dependence was resolved. The lack of grain-size dependence likely indicates that the deformation volume sampled by the indenter was not controlled by grain-boundary interactions; instead, hardness was governed primarily by indentation load and local response of the rock salt carbide matrix.", "url": "https://arxiv.org/abs/2609.15717", "type": "理论+数值", "summary": "1. 该工作以完全致密单相(Cr,Mo,Ta,V,W)C1−δ高熵碳化物陶瓷为对象，在9.3±0.3至28.8±0.7 μm晶粒尺寸范围内检验硬度与Hall-Petch关系。\n2. 核心结果是显著压痕尺寸效应：维氏硬度从0.49 N下约28–30 GPa降至9.81 N下约20–21 GPa，Berkovich纳米硬度在10 mN下为26–30 GPa；但同一载荷下晶粒尺寸变化三倍硬度仍处于窄区间，未分辨出一致Hall-Petch依赖，表明压痕取样体积不受晶界交互控制，而由载荷与岩盐碳化物基体局域响应主导。\n3. 这质疑了以晶粒尺寸和Hall-Petch关系解释陶瓷硬度差异的惯例，提示高熵碳化物硬度评价应优先分离压痕尺寸效应与基体本征局域变形机制。", "summary_source": "deepseek", "authors": [{"name": "Ali Sarikhani"}, {"name": "Ana C. Feltrin"}, {"name": "Gregory E. Hilmas"}, {"name": "David W. Lipke"}, {"name": "Douglas E. Wolfe"}, {"name": "Stefano Curtarolo"}, {"name": "Shen J. Dillon"}, {"name": "William G. Fahrenholtz"}], "featured_authors": [{"name": "Ali Sarikhani"}, {"name": "Ana C. Feltrin"}, {"name": "Gregory E. Hilmas"}, {"name": "Stefano Curtarolo"}, {"name": "Shen J. Dillon"}, {"name": "William G. Fahrenholtz"}], "author_count": 8}, {"id": "2609.15839", "category": "cond-mat", "title": "Collective adaptation to time-dependent targets for active Brownian particles", "abstract": "We consider a minimal model of active agents which collectively learn to reach a target macroscopic state via a decentralized adaptation process. Agents are modeled as active Brownian particles which randomly reorient to a given direction through tumbling events. An average target state is encoded into a reward function evaluated by each agent. Agents can tune one of the parameters of their microscopic dynamics, called `policy' (e.g., speed or reorientation direction), to optimize their reward function thanks to information exchange with neighboring agents. We describe the evolution of the policy distribution across the agent population with a kinetic theory, under the assumption that the adaptation process is slow with respect to the physical dynamics. The adaptation process is illustrated on several learning protocols with either fixed or time-dependent target velocities. A characteristic learning time $\\tau$ combining teaching and mutations emerges from the dynamics. For time-oscillating targets at angular frequency $\\omega$, the collective dynamics oscillates in time, with an oscillation amplitude and phase shift determined by the product $\\omega \\tau$. An unlocking transition to a non-adaptable state is also observed for a rotating target velocity.", "url": "https://arxiv.org/abs/2609.15839", "type": "理论+数值", "summary": "1. 该工作构建了一个由主动布朗粒子组成的最小模型，通过去中心化适应与邻域信息交换，使集体学会达到由奖励函数编码的目标宏观态，并可用动理论描述策略分布的演化。\n2. 在适应慢于物理动力学的假设下，其核心卖点是导出结合示教与突变的特征学习时间τ，并揭示对频率ω振荡目标的学习响应由ωτ决定振幅与相位，以及旋转目标下的失锁转变。\n3. 这为活性物质中学习、适应与非平衡集体行为的统一描述提供了框架，并启发后续在时变环境与实验活性系统中检验锁定/失锁机制。", "summary_source": "deepseek", "authors": [{"name": "Gerhard Jung"}, {"name": "Eric Bertin"}], "featured_authors": [{"name": "Gerhard Jung"}, {"name": "Eric Bertin"}], "author_count": 2}, {"id": "2609.15854", "category": "cond-mat", "title": "Chiral Antiferromagnetism from Momentum-Space Resonance in a 2D Semiconductor", "abstract": "Understanding the principles governing the emergence of chiral quantum phases is a fundamental challenge, not only for uncovering new mechanisms of quantum-state formation but also for realizing giant electronic responses and transport phenomena arising from chirality and topology. While Fermi-surface instabilities in metals can stabilize complex ordered states through multiple competing scattering channels, their microscopic origin is often obscured by the complexity of the underlying electronic structure, limiting the development of general microscopic design principles. Here, we introduce a complementary strategy based on the simplicity of semiconductor band extrema. Using the layered van der Waals semiconductor GdGaI, whose low-energy electronic structure consists of simple electron and hole valleys, we discover the spontaneous emergence of an intertwined chiral triple-$q$ antiferromagnetic state accompanied by a cooperative reconstruction of the electron-hole band edges, beyond the conventional expectation of a single-$q$ ground state. This collective reconstruction generates substantial momentum-space Berry curvature, giving rise to a pronounced spontaneous anomalous Hall effect despite the semiconducting character and negligible net magnetization. Remarkably, this chiral state is realized within an atomically well-defined ($\\approx2a$), topologically nontrivial magnetic texture, showing that such collective quantum states can emerge at an exceptionally small length scale from a simple two-dimensional magnetic semiconductor. More broadly, our results introduce a remarkably simple design concept for chiral quantum matter: using simple semiconductor band extrema as building blocks for resonance-like interplay in momentum space, providing a route to Berry curvature, topological transport, and emergent quantum phases.", "url": "https://arxiv.org/abs/2609.15854", "type": "理论", "summary": "1. 该工作以低能电子/空穴谷结构简单的层状范德华半导体GdGaI为对象，提出利用半导体带边动量空间共振诱导手性量子相的策略，并预言其中自发形成手性三重-q反铁磁态。\n2. 其核心发现是电子-空穴带边协同重构超越常规单-q基态，产生显著动量空间贝里曲率与自发反常霍尔效应，且该手性态处于原子级局域（约2a）、拓扑非平庸的磁织构中，净磁化可忽略。\n3. 这揭示简单半导体带边可作为动量空间共振构建手性量子物质的模块，为在极小尺度上实现贝里曲率、拓扑输运与涌现量子相提供可设计路径。", "summary_source": "deepseek", "authors": [{"name": "R. Okuma"}, {"name": "T. Ikenobe"}, {"name": "Y. Fujisawa"}, {"name": "K. Yamagami"}, {"name": "H. C. H. Wu"}, {"name": "T. Nakamura"}, {"name": "Y. Ihara"}, {"name": "H. Ishikawa"}, {"name": "H. Suwa"}, {"name": "H. Ishizuka"}, {"name": "Y. Akagi"}, {"name": "T. Kaneko"}, {"name": "C. H. Hsu"}, {"name": "Y. Obata"}, {"name": "N. Tomoda"}, {"name": "M. Dronova"}, {"name": "K. Nagasawa"}, {"name": "H. Saito"}, {"name": "D. Ueta"}, {"name": "H. Sagayama"}, {"name": "J. Yamaura"}, {"name": "M. Arita"}, {"name": "K. Yogendra"}, {"name": "S. Ideta"}, {"name": "K. Kindo"}, {"name": "T. Nakajima"}, {"name": "S. J. Blundell"}, {"name": "T. Kondo"}, {"name": "K. Shimada"}, {"name": "Y. Okamoto"}, {"name": "Y. Okada"}], "featured_authors": [{"name": "R. Okuma"}, {"name": "T. Ikenobe"}, {"name": "Y. Fujisawa"}, {"name": "K. Shimada"}, {"name": "Y. Okamoto"}, {"name": "Y. Okada"}], "author_count": 31}, {"id": "2609.15891", "category": "cond-mat", "title": "Modulated structures in discrete approximations to a three-dimensional cholesteric model on a recursive lattice", "abstract": "We study finite-state approximations to a chiral nematic lattice model whose local directors are embedded in three-dimensional orientational space. The model analyzed here is formulated in terms of a rotated quadrupolar interaction, which provides a direct angular chirality parameter $\\Delta$ and reduces to the usual planar chiral-nematic form for directors confined to the xy plane. On a rooted Cayley tree, the statistical problem is written as a nonlinear recursion for branch partition functions. In the infinite-coordination limit, with $rJ_Q$ fixed, the recursion becomes a softmax map for the state probabilities. We analyze Cartesian three-state, planar four-state, and non-planar four-state discretizations. The first supports ordered and period-two attractors, whereas the planar four-state discretization displays a sequence of commensurate and longer-period modulated attractors. Its disordered fixed point loses stability at $t=9/16$ through a complex-conjugate pair with phase $q=\\pm 2\\Delta$, so a modulated critical mode is selected for every nonzero chirality. The non-planar four-state set is intrinsically anisotropic and, when the stated model is reconstructed directly, supports prominent period-three as well as period-two and higher-period cycles. Because attractor stability does not by itself establish global thermodynamic stability, the diagrams reported here are interpreted as attractor/stability diagrams rather than equilibrium phase diagrams.", "url": "https://arxiv.org/abs/2609.15891", "type": "理论+数值", "summary": "1. 该工作围绕《Modulated structures in discrete approximations to a three-dimensional cholesteric model on a recursive lattice》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "William de Castilho"}], "featured_authors": [{"name": "William de Castilho"}], "author_count": 1}, {"id": "2609.15941", "category": "cond-mat", "title": "Fractional vortices in a spin-isotropic spiral spin liquid", "abstract": "Spiral spin liquids are magnetic states whose classical ground-state manifold consists of planar incommensurate spin spirals with wave vectors lying on a continuous ring or surface in reciprocal space. The resulting subextensive degeneracy suppresses magnetic long-range order and gives rise to liquid-like behavior. Despite numerous material realizations and theoretical investigations, the structure of low-temperature spin configurations of spin-isotropic Heisenberg spiral spin liquids has remained poorly understood. Here, we classify and characterize the classical topological defects supported by these systems. We uncover a rich family of vortex types involving concerted windings of spin directions, spiral-plane normals, and wave-vector orientations, yielding a $\\mathbb{Z} \\times \\mathbb{Z}_2$ classification. Remarkably, the elementary defects are half-vortices carrying fractional $2\\pi$ windings in both spin and momentum space and obey fusion rules resembling to those of Ising anyons. Large-scale classical simulations of a square-lattice spiral spin liquid reveal that these vortices are dense in the spiral-spin-liquid regime, and bind tightly below an order-by-disorder phase transition, eventually fusing to vacuum.", "url": "https://arxiv.org/abs/2609.15941", "type": "理论+数值", "summary": "1. 该工作系统分类并刻画了自旋各向同性海森堡螺旋自旋液体中的经典拓扑缺陷，并结合方格子模型的大规模经典模拟研究其低温自旋构型。\n2. 其核心卖点是发现自旋方向、螺旋面法矢与波矢取向协同绕转的丰富涡旋族，给出 Z×Z2 分类，并揭示基本缺陷为在自旋与动量空间均带分数 2π 绕数的半涡旋，其融合规则类似 Ising 任意子；模拟还表明这些涡旋在螺旋自旋液体区密集存在，在有序化相变下紧密束缚并最终融合为真空。\n3. 这为理解阻挫磁体中分数化拓扑激发、缺陷介导相变及可能的任意子型统计提供了明确框架，并启发在真实材料或冷原子平台中探测半涡旋与融合行为。", "summary_source": "deepseek", "authors": [{"name": "Cecilie Glittum"}, {"name": "Han Yan"}, {"name": "Johannes Reuther"}], "featured_authors": [{"name": "Cecilie Glittum"}, {"name": "Han Yan"}, {"name": "Johannes Reuther"}], "author_count": 3}, {"id": "2609.15947", "category": "cond-mat", "title": "Charge order before superconductivity in the doped kagome Dirac spin liquid", "abstract": "Doping a quantum spin liquid is expected to give a superconductor. On kagome it gives charge order first, because of band structure rather than interaction. In the chargon (Higgs) construction of its U(1) Dirac spin liquid the two gauge components, degenerate on square and triangular lattices, are split by a line-graph effect: one disperses, four minima at $-(1+\\sqrt6)t$; the other has two exactly flat lowest bands at $-2t$. Only the dispersive component condenses, over a bare-mass window of width exactly $(\\sqrt6-1)t$, in which the doped spin liquid forms charge and loop-current crystals on the $M$, $K$ and $K/2$ stars, the physical U(1) unbroken: a chargon Higgs phase that does not superconduct. Its pairing channels are those of the $\\mathbb{Z}_2$ descendants, a pair-density wave, uniform $d+id$ excluded at leading order and at all orders on the $M$ star. The projective symmetry group reduces the quartic competition to one angle, on which projected on-site repulsion sits exactly at the $M$/$K/2$ boundary, a direction protected to all orders by $O(4)\\times U(1)$ under renormalization, though lattice matching gives the physical coupling off-ray components. The competing $M$-star crystals are degenerate through sextic order, split only at eighth. The charge sector carries its own classification, the charged counterpart of the undoped bilinear-and-monopole catalog, which holds no charge-carrying operator; it puts the doped Mott insulator and kagome metals on one $F$-irrep grid, separated by the charge-order irrep ($F_1$ there, $F_3$ here) and the Landau cubic. Predicted: $C_2$-odd ($F_3$) charge order, no cubic invariant; vestigial pair phases of period $h/4e$ or $h/6e$; loop-current fields of order ten gauss at herbertsmithite's $^{17}$O and $^{35}$Cl; and, if the $\\Gamma$ flux orders with the condensate, charge and current order setting in together below the condensation scale.", "url": "https://arxiv.org/abs/2609.15947", "type": "理论", "summary": "1. 该工作基于笼目U(1)狄拉克自旋液体的电荷子(希格斯)构造，研究掺杂后为何先出现电荷序而非超导。\n2. 关键机制是线图效应分裂两个规范分量，仅色散分量在裸质量窗口(√6−1)t内凝聚，形成M/K/K/2星上的电荷与环流晶体，物理U(1)未破缺。\n3. 该框架预言C2奇(F3)电荷序、h/4e或h/6e残留配对相与约十高斯环流场，并把掺杂Mott绝缘体和笼目金属统一到F不可约表示分类。", "summary_source": "deepseek", "authors": [{"name": "Yasir Iqbal"}], "featured_authors": [{"name": "Yasir Iqbal"}], "author_count": 1}, {"id": "2609.13163", "category": "hep-th", "title": "The Fuzzy-Sphere as a Black Hole in the IKKT Matrix Model: An Assessment", "abstract": "Black-hole thermodynamics has been reproduced with remarkable success from the BFSS matrix model, but the corresponding test in the closely related IKKT matrix model has awaited its recently proposed finite-temperature formulation. We investigate this correspondence within that framework. Introducing a cubic Myers term, we compute the complete one-loop thermodynamics -- free energy, internal energy, entropy, and heat capacity -- of a fuzzy $S^2$ background. No gravitational dual is known for this specific background, so we compare these quantities against the D0 and D2 black holes as the closest available reference points. At fixed Myers co
