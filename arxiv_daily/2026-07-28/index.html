a开源软件包。\n2. 其核心技术是递归累积量算法，支持稠密、稀疏和迭代求解器后端，统一处理粒子、电荷和热流。\n3. 在JC系统光子计数和非线性电路QED热引擎中的应用表明，该方法能高效揭示间歇性、反聚束及热力学不确定关系。", "summary_source": "deepseek", "authors": [{"name": "Aaron Daniel"}, {"name": "Marcelo Janovitch"}], "featured_authors": [{"name": "Aaron Daniel"}, {"name": "Marcelo Janovitch"}], "author_count": 2}, {"id": "2607.24438", "category": "quant-ph", "title": "Quantum Fisher information and imperfect detection in a monitored fermion chain", "abstract": "We study the metrological properties of a continuously monitored Kitaev chain in the presence of imperfect detection. The system is conditioned on a no-click record, while each emitted fermion is registered only with probability $0\\leq q\\leq 1$. Because the conditional dynamics remains Gaussian, the steady state is fully characterized by the fermionic correlation matrix. This allows a direct evaluation of the quantum Fisher information and of the mean Uhlmann curvature. For perfect detection, the monitored steady state retains a singular critical structure and the quantum Fisher information with respect to the chemical potential becomes super-extensive. For any $q<1$, imperfect detection introduces a finite smoothing length that rounds the singularity and restores extensive scaling. The detector efficiency behaves instead as a compatible mixed-state estimation parameter, as signaled by the vanishing mean Uhlmann curvature. These results show that incomplete trajectory information destroys the metrological enhancement associated with monitored criticality through a mechanism that differs from ordinary thermal smearing.", "url": "https://arxiv.org/abs/2607.24438", "type": "理论", "summary": "1. 该工作研究了不完美探测下持续监测Kitaev链的计量性质，通过费米子关联矩阵解析计算了量子Fisher信息与平均Uhlmann曲率。\n2. 关键物理进展在于发现完美探测时化学势的量子Fisher信息呈超广延标度，而任何不完美探测引入有限光滑长度消除奇异性、恢复广延标度，且探测器效率表现为兼容参数。\n3. 这揭示了不完全轨迹信息以不同于普通热模糊的机制破坏监测临界性的计量增强，为理解开放量子系统的临界计量学鲁棒性提供了明确洞见。", "summary_source": "deepseek", "authors": [{"name": "Giovanni Di Fresco"}, {"name": "Davide Valenti"}, {"name": "Angelo Carollo"}], "featured_authors": [{"name": "Giovanni Di Fresco"}, {"name": "Davide Valenti"}, {"name": "Angelo Carollo"}], "author_count": 3}, {"id": "2607.24479", "category": "quant-ph", "title": "Two-copy nondistillability of Werner states: sharp partial-trace inequalities and finite-copy extensions", "abstract": "We solve the two-copy distillability problem for Werner states in every local dimension. Our main matrix result is a sharp, dimension-free inequality: for every rank-at-most-two operator, the sum of the squared Hilbert--Schmidt norms of its two partial traces is bounded by twice its squared Hilbert--Schmidt norm plus one half of the squared modulus of its trace. This implies that a Werner state $\\rho_\\alpha$ is two-copy distillable if and only if $\\alpha<-1/2$. In particular, the two-ququart state $\\rho^{(4)}_{-1/2}$ is two-copy undistillable, resolving Problem 5 of Horodecki, Rudnicki, and Życzkowski. For an arbitrary finite number $k$ of copies, we give three exact formulations of the remaining problem. At the endpoint $\\alpha=-1/2$, undistillability is equivalent to nonnegativity of the endpoint partial-trace form on every rank-at-most-two operator. We also derive an equivalent hierarchy of operator inequalities $H_k(\\psi)\\succeq0$ for pure states with a maximally mixed qubit marginal. The two-copy proof does not formally induct, because partial trace can increase rank and $2$-positivity is not generally preserved by tensor products. We prove two rigorous many-copy extensions. First, the quadratic form factorizes exactly on tensor-factorized witnesses; for any such decomposition, the endpoint inequality holds if its possible rank-two factor is supported on a block containing at most two copies. Second, we construct explicit constants $\\gamma_k>0$ such that $\\alpha\\ge-\\gamma_k$ implies $k$-copy undistillability in every dimension. The initial proofs were generated by ChatGPT 5.6 Sol; the authors have verified and rewritten them to enhance readability and provide additional context.", "url": "https://arxiv.org/abs/2607.24479", "type": "理论", "summary": "1. 该工作解决了任意局域维度下Werner态的两拷贝可蒸馏性问题，给出了完整的充要条件。\n2. 核心在于证明了一个尖锐的无维数部分迹不等式：任意秩不超过2的算子的两部分迹的希尔伯特-施密特范数平方和受限于其总范数平方与迹模平方的线性组合。\n3. 这为多拷贝蒸馏问题提供了精确的算子不等式层次结构，并揭示了在端点处不可蒸馏性与部分迹形式非负性之间的等价关系。", "summary_source": "deepseek", "authors": [{"name": "Kishor Bharti"}, {"name": "Rishikesh Gajjala"}, {"name": "Tobias Haug"}], "featured_authors": [{"name": "Kishor Bharti"}, {"name": "Rishikesh Gajjala"}, {"name": "Tobias Haug"}], "author_count": 3}, {"id": "2607.24480", "category": "quant-ph", "title": "A Bohmian version of a 2-state quantum system", "abstract": "I construct a Bohmian version of a 2-state quantum system, where in addition to the quantum state, the system is characterized by a definite physical state which changes stochastically under the guidance of the quantum state. I argue that the probabilities produced by this process are well-defined, contrary to claims in \"Why quantum mechanics cannot be formulated as a Markov process\" by D. Gillespie (1994) about a related model.", "url": "https://arxiv.org/abs/2607.24480", "type": "理论", "summary": "1. 该工作为二态量子系统构建了一个Bohmian版本，系统除量子态外还拥有在量子态引导下随机演化的确定物理态。\n2. 其技术核心在于证明该随机过程产生的概率是良定义的，反驳了Gillespie关于此类模型无法构成马尔可夫过程的论断。\n3. 这为量子力学中隐变量理论与随机过程相容性提供了新例证，并可能启发对多态系统Bohmian描述的拓展研究。", "summary_source": "deepseek", "authors": [{"name": "Matthew Dickau"}], "featured_authors": [{"name": "Matthew Dickau"}], "author_count": 1}, {"id": "2607.24496", "category": "quant-ph", "title": "Bulk spectra and the non-Hermitian skin effect in systems with long-range couplings", "abstract": "To achieve translational symmetry for the computation of the band structure of a lattice model, one can either consider an infinite lattice or impose periodic boundary conditions. While in sys- tems with short-range couplings these two approaches are equivalent, we show that for long-range couplings one can obtain considerably different results. We compare the two methods on the basis of one-dimensional quantum emitter chains both in free space and when coupled to a waveguide. The latter system allows for asymmetric couplings enabling the non-Hermitian skin effect, which we analyze using the two different band-structure calculation methods. We find that only periodic boundary conditions lead to physically and mathematically robust results, while the infinite-chain approach entails convergence issues and is unable to satisfyingly explain the emergence of the non- Hermitian skin effect in the waveguide system. In addition, the waveguide system yields unusual findings like a non-star shaped generalized Brillouin zone and strongly localized eigenstates with zero winding number.", "url": "https://arxiv.org/abs/2607.24496", "type": "理论+数值", "summary": "1. 该工作通过比较无限晶格与周期边界条件两种能带计算方法，揭示了长程耦合系统中两者结果的显著差异，并分析了波导耦合量子发射器链中的非厄米趋肤效应。\n2. 主要发现在于周期边界条件方能给出物理稳健的结果，而无限链方法存在收敛问题，且无法解释波导系统中非星形广义布里渊区及零缠绕数强局域态的涌现。\n3. 这为长程耦合非厄米系统的能带计算提供了方法学参考，并启发对非常规布里渊区拓扑性质及趋肤效应机制的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Jonathan Sturm"}, {"name": "Pia Kreß"}, {"name": "Adriana Pálffy"}], "featured_authors": [{"name": "Jonathan Sturm"}, {"name": "Pia Kreß"}, {"name": "Adriana Pálffy"}], "author_count": 3}, {"id": "2607.24557", "category": "quant-ph", "title": "Entanglement Distillation and Swapping Scheduling in Quantum Repeaters with Noisy Memories", "abstract": "Entanglement distillation and entanglement swapping have been extensively studied assuming perfect quantum memories. However, near-term quantum networks will be fundamentally limited by quantum memories with a finite coherence time, resulting in complex choices for the timing and ordering of these operations. In this work, we study entanglement distillation and entanglement swapping at the level of the elementary building blocks of noisy quantum repeater networks, with the goal of elucidating the fundamental tradeoffs induced by memory decoherence. First, we focus on a minimal one-hop setting, where we analytically compare ``distill-as-soon-as-possible'' and ``distill-as-late-as-possible'' strategies against a baseline strategy that simply discards the older entangled state. We find that in the low memory coherence time regime, discarding the older entangled state achieves higher expected output fidelity, while in the high coherence time regime, delaying distillation until the end achieves the highest expected output fidelity and, over most of the deadline range, the highest weighted coherent information, at the expense of a lower success probability. We then extend our analysis to two-hop repeater chains using Monte Carlo simulation. In this setting, we find that the highest weighted coherent information is achieved by strategies that defer distillation to the end of the time window, with \\textsf{Distill-ALAP-then-Swap-ALAP} and \\textsf{Swap-ASAP-then-Distill-ALAP} leading at different operating points, while \\textsf{Discard-Oldest-then-Swap} never reaches positive weighted coherent information in any regime tested. Together, these results clarify how decoherence reshapes the optimal operation timing in quantum networks and provide instructive insights into the link-level principles that govern larger-scale architectures.", "url": "https://arxiv.org/abs/2607.24557", "type": "理论+数值", "summary": "1. 该工作在有限相干时间的量子存储器中继器基元中，系统比较了纠缠蒸馏与交换的多种调度策略对输出保真度与加权相干信息的影响。\n2. 关键发现是低相干区“丢弃最老纠缠态”策略保真度最优，高相干区“推迟蒸馏至窗口末”策略加权相干信息最高，两跳场景下延迟交换与延迟蒸馏的组合占优。\n3. 这为理解退相干如何重塑量子网络最优操作时序提供了定量依据，并为更大规模中继器架构的链路级设计原则指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Siddharth Chander"}, {"name": "Xinan Chen"}, {"name": "Allen Zang"}], "featured_authors": [{"name": "Siddharth Chander"}, {"name": "Xinan Chen"}, {"name": "Allen Zang"}], "author_count": 3}, {"id": "2607.24644", "category": "quant-ph", "title": "Quantum-Limited Symbol-Blind Channel Estimation for Coherent State Discrimination", "abstract": "Residual dispersion breaks temporal-mode matching in photon-starved coherent links. For equiprobable $M$-ary PSK coherent states in a known spectral mode, with unknown symbols and carrier phase, we establish the quantum limit for blind joint estimation of group delay and second-order dispersion: after eliminating the common phase, it is $4N_s\\mathbf{C}$, set by the covariance of the centered generators alone. A multi-output quantum pulse gate with photon-number-resolving detection locally attains it and supports reception below the standard quantum limit under turbulent fading.", "url": "https://arxiv.org/abs/2607.24644", "type": "理论", "summary": "1. 该工作针对光子匮乏相干链路中未知符号和载波相位的等概率M元PSK相干态，建立了盲联合估计群延迟与二阶色散的量子极限。\n2. 其核心在于证明消除公共相位后，极限由居中生成元协方差决定（4N_s C），且多输出量子脉冲门配合光子数分辨探测可局域达到该极限。\n3. 该方案在湍流衰落条件下支持低于标准量子极限的接收，为星地量子通信等光子匮乏场景的色散补偿与信道估计提供了可实现途径。", "summary_source": "deepseek", "authors": [{"name": "Hongxu Chen"}, {"name": "Renzhi Yuan"}, {"name": "Haifeng Yao"}, {"name": "Mugen Peng"}], "featured_authors": [{"name": "Hongxu Chen"}, {"name": "Renzhi Yuan"}, {"name": "Haifeng Yao"}, {"name": "Mugen Peng"}], "author_count": 4}, {"id": "2607.24657", "category": "quant-ph", "title": "Geometric bounds on multiparameter Heisenberg scaling in optical metrology with limited squeezed resources", "abstract": "The simultaneous estimation of multiple parameters is a central task in quantum metrology, distributed sensing, and the calibration of large photonic interferometers. A fundamental question is how many independent parameter combinations can inherit Heisenberg scaling from a given number of squeezed probes in a multimode Gaussian network. Here, we answer this question for arbitrary passive linear optical networks. For a $p$-parameter, $M$-channel interferometer probed by $k$ single-mode squeezed states and at least one coherent state in the remaining channels, we show that the rank of the Heisenberg-scaling coefficient of the quantum Fisher information matrix is bounded by $n_{\\rm HS}\\le \\min\\{p,k(k+3)/2\\}$, which corresponds to the maximum number of independent combinations of parameters that can be estimated with Heisenberg-scaling sensitivity. The bound separates into two geometrically distinct contributions. The covariance contribution of the quantum Fisher information, which describes squeezing-enhanced fluctuations, provides at most $k(k+1)/2$ parameter combinations estimable at Heisenberg-scaling sensitivity, while the first-moment contribution provides at most $k$ additional independent parameter combinations with Heisenberg-scaling sensitivity. We identify the conditions for saturating these bounds and construct a passive family of interferometers that saturates these bounds.", "url": "https://arxiv.org/abs/2607.24657", "type": "理论", "summary": "1. 该工作针对有限压缩资源的光学多参数计量，推导了任意无源线性网络中多参数海森堡标度灵敏度的几何界限。\n2. 核心在于将量子Fisher信息矩阵的海森堡标度系数秩分解为协方差与第一矩贡献，并证明其受限于n_HS≤min{p, k(k+3)/2}，其中k为压缩态数目。\n3. 该界限为设计饱和此约束的无源干涉仪家族提供了理论依据，并明确了压缩资源在多参数估计中的极限能力。", "summary_source": "deepseek", "authors": [{"name": "Atmadev Rai"}, {"name": "Paolo Facchi"}, {"name": "Vincenzo Tamma"}], "featured_authors": [{"name": "Atmadev Rai"}, {"name": "Paolo Facchi"}, {"name": "Vincenzo Tamma"}], "author_count": 3}, {"id": "2607.24682", "category": "quant-ph", "title": "CP-preserving channels", "abstract": "Completely positive (CP) matrices are ubiquitous in modern science and technology with applications in optimization, graph theory, and quantum entanglement. Recently, Johnston \\emph{et al.} [Linear Algebra and its Applications, 2022] have cast CP matrices into the framework of quantum resource theories, where CP states serve as free states and CP-preserving channels act as free operations. This work addresses several questions raised in their work. Specifically, we provide the necessary and sufficient conditions of CP-preserving channels in small dimensions, which are necessary in higher dimensions, and discuss the resource quantification via the trace distance of non-negativity. By constructing an explicit counterexample, we demonstrate that the trace-distance measure of non-negativity violates strong monotonicity. We also provide an alternative proof that every CPDNN channel $\\Phi:\\MM_n\\to \\MM_2$ is CPCP. Additionally, we show that any unital CPDNN map $\\Phi:\\MM_2\\to \\MM_n$ is also CPCP.", "url": "https://arxiv.org/abs/2607.24682", "type": "理论+数值", "summary": "1. 该工作研究了CP保持信道的刻画与资源度量问题，给出了小维数下的充要条件。\n2. 其关键贡献在于证明了迹距离非负性度量违反强单调性，并揭示了低维CPDNN信道的CPCP性质。\n3. 这为量子资源理论中CP矩阵的资源量化和高维信道分类提供了结构性的判定依据。", "summary_source": "deepseek", "authors": [{"name": "Indu Bala"}, {"name": "Sourav Das"}, {"name": "Swapan Rana"}], "featured_authors": [{"name": "Indu Bala"}, {"name": "Sourav Das"}, {"name": "Swapan Rana"}], "author_count": 3}, {"id": "2607.24686", "category": "quant-ph", "title": "Stacking the Deck: Tunable Trainability in Stacked LCUs", "abstract": "Variational quantum circuits have been central to many proposed near-term applications of quantum computing, but a growing body of evidence suggests that trainability and quantum advantage are fundamentally at odds: ansätze expressive enough to resist efficient classical simulation tend to exhibit barren plateaus, while structures that provably rule out barren plateaus typically render them classically simulable. We propose a stacked linear combination of unitaries (S-LCU) as a variational ansatz which provides a tunable trade-off between barren plateaus and classical simulability. Using a diagrammatic analysis, we bound the loss-landscape variance of the Free Fermion S-LCU, whose elements are fermionic Gaussian unitaries. We prove a variance lower bound of $\\Omega(1/(n k^{3l}))$, with a simulation cost of $O(k^{2l} n^3)$ using the best known classical algorithm, compared to a quantum gate complexity of only $O(lkn^2)$. The number of layers $l$ serves as a single dial that trades computational complexity against the rate of cost concentration. This offers practitioners a systematic method for constructing ansätze with a complexity-trainability trade-off that best suits their application and hardware.", "url": "https://arxiv.org/abs/2607.24686", "type": "理论+数值", "summary": "1. 该工作提出堆叠线性组合酉（S-LCU）变分拟设，实现可训练性与经典可模拟性的可调权衡。\n2. 通过图解分析给出自由费米子S-LCU损失景观方差下界Ω(1/(n k^{3l}))，经典模拟代价O(k^{2l} n^3)，量子门复杂度仅O(lkn^2)，层数l作为单一调节参数。\n3. 这为面向应用与硬件，系统构造复杂度—可训练性权衡的变分拟设提供了明确方法。", "summary_source": "deepseek", "authors": [{"name": "Nikhil Khatri"}, {"name": "Stefan Zohren"}, {"name": "Gabriel Matos"}], "featured_authors": [{"name": "Nikhil Khatri"}, {"name": "Stefan Zohren"}, {"name": "Gabriel Matos"}], "author_count": 3}, {"id": "2607.24687", "category": "quant-ph", "title": "Sharp continuity of quantum conditional entropy", "abstract": "We prove the sharp uniform continuity bound for quantum conditional entropy. If two bipartite states are at trace distance at most $\\delta$ and $d=\\dim A$, the optimal dimension-only modulus of continuity is $h_2(\\delta)+\\delta\\log(d^2-1)$ up to $\\delta=1-d^{-2}$ and $2\\log d$ thereafter, where $h_2$ denotes the binary entropy. When $\\dim B\\ge d$, this bound is tight for every $\\delta\\in[0,1]$. The key proof idea was developed with the assistance of ChatGPT 5.6 Sol, building on and adapting the tight classical proof of Alhejji \\& Smith [IEEE ISIT (2020)], which follows a conceptually different approach.", "url": "https://arxiv.org/abs/2607.24687", "type": "理论", "summary": "1. 该工作严格证明了量子条件熵对迹距离的均匀连续性最优上界。\n2. 其核心在于导出仅依赖子系统A维度的模量 h₂(δ)+δlog(d²-1)（δ≤1-d⁻²），并在B维度足够大时证明该界对所有δ紧致。\n3. 这为量子信息论中熵量连续性的精确分析提供了统一框架，并可直接应用于纠缠蒸馏与量子信道的容量界。", "summary_source": "deepseek", "authors": [{"name": "Mario Berta"}, {"name": "Pablo Costa Rico"}, {"name": "Gereon Kossmann"}, {"name": "Ludovico Lami"}, {"name": "Julius A. Zeiss"}], "featured_authors": [{"name": "Mario Berta"}, {"name": "Pablo Costa Rico"}, {"name": "Gereon Kossmann"}, {"name": "Ludovico Lami"}, {"name": "Julius A. Zeiss"}], "author_count": 5}, {"id": "2607.24693", "category": "quant-ph", "title": "Quantum Incapacity beyond No-Cloning and PPT Mechanisms", "abstract": "We show an explicit qutrit channel whose private and quantum capacities both vanish, although it is neither antidegradable nor positive under partial transposition (PPT). This resolves two longstanding open problems in quantum information theory: whether zero quantum capacity can occur outside the PPT and antidegradable classes, and whether antidegradability is the only nontrivial mechanism that forces the private capacity to vanish. For qutrit systems $A$ and $B$, the channel is \\[ \\Lambda_{A\\to B}(X)= \\frac{1}{2}X+\\frac{1}{4}\\left(\\operatorname{Tr}(X)\\mathbb{1}_{B}-X^{\\mathsf T} \\right). \\] We prove that, for every tensor power and every finite-dimensional quantum reference system, the complementary output dominates the receiver output in relative entropy. Consequently, we show that the optimized private and coherent information vanish at every blocklength, and hence $P(\\Lambda)=Q(\\Lambda)=0$. The proof uses a nonpositive, adjoint-preserving signed lift whose weighted defect admits an exact rank-three completely positive factorization. Applying established Bogoliubov--Kubo--Mori/relative-entropy comparison results and complete less-noisy tensorization results then yields the stated order at every tensor power, leading to zero quantum and private capacities. Meanwhile, we show that the channel is neither PPT nor antidegradable. The channel therefore realizes exact quantum and private incapacity beyond the standard PPT-based bound-entanglement mechanism and the no-cloning mechanism.", "url": "https://arxiv.org/abs/2607.24693", "type": "理论+数值", "summary": "1. 该工作构造了一个qutrit信道，其私密容量和量子容量均为零，但该信道既非部分转置正（PPT）也非反降级，解决了量子信息理论中两个长期未决问题。\n2. 技术核心在于利用非正、伴随保持的有符号提升及其权重缺陷的精确秩三完全正分解，结合相对熵比较与完全less-noisy张量化结果，证明每一张量幂次下优化私有信息和相干信息均消失。\n3. 该信道实现了超越标准PPT束缚纠缠和不可克隆机制之外的量子与私密无容量，暗示存在更广的零容量信道类，并启发对容量消失新机制的探索。", "summary_source": "deepseek", "authors": [{"name": "Chengkai Zhu"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "Chengkai Zhu"}, {"name": "Xin Wang"}], "author_count": 2}, {"id": "2607.24704", "category": "quant-ph", "title": "How Many Shots Does It Take? A Noise-Aware Quantum Resource Allocation Framework", "abstract": "Any algorithm execution on quantum computers requires several repeated and costly executions (known as shots) to obtain reliable results. In this work, we propose a closed-form accurate analytical expression to determine optimal number of shots required for reliable execution of any algorithm on a quantum computer. We also present a theoretically grounded technique to distribute fixed shot budget across different partitions in a quantum circuit minimizing the total error. Our proposed analytical model helps to reduce the shots associated with reliable execution of quantum algorithms by about 58\\% compared to current practice, in turn reducing the energy consumption by upto 62\\%. Furthermore, our proposed optimal shot allocation technique across different partitions reduces total error by up to 73\\% compared to conventional approaches.", "url": "https://arxiv.org/abs/2607.24704", "type": "理论+数值", "summary": "1. 该工作提出了一个噪声感知的量子资源分配框架，导出了决定量子算法可靠执行所需最优测量次数的闭式解析公式。\n2. 其核心在于理论引导的固定测量预算跨电路分区最优分配技术，在减少约58%测量次数的同时将总误差降低高达73%，并相应降低能耗62%。\n3. 这为噪声量子计算机上的资源高效算法执行提供了定量分析工具，并可推广至其他量子任务的测量预算优化与误差缓解。", "summary_source": "deepseek", "authors": [{"name": "Prateek P. Kulkarni"}, {"name": "Sumit K. Mandal"}], "featured_authors": [{"name": "Prateek P. Kulkarni"}, {"name": "Sumit K. Mandal"}], "author_count": 2}, {"id": "2607.24712", "category": "quant-ph", "title": "Sample complexity of quantum resource testing via one-shot quantum blurring", "abstract": "Quantum resource testing is a fundamental primitive of quantum information processing, profoundly connected to resource manipulation. Its goal is to discriminate $n$ copies of a given resourceful state $\\rho$ from all free (i.e., resourceless) states; key instances for applications are entanglement testing and quantum magic testing. The asymptotic characterisation relies on the recently proven generalised quantum Stein's lemma, which establishes the rate of decay of the false negative error probability for a fixed false positive error probability. This result, however, is intrinsically asymptotic and thus can provide no finite-resource guarantees, which makes its practical implications unclear. Here, we establish the first rigorous finite-$n$ bounds on quantum resource testing and hence quantum resource manipulation, providing explicit estimates on the number of copies needed to achieve a prescribed performance. As notable consequences, we obtain (a) the convergence of the regularised Rényi relative entropies of a resource, which settles the important open problem from [Fang/Hayashi, IEEE ToIT 72:6, 2026]; and (b) the first sample-complexity bound for asymmetric resource testing: for any fixed false positive error probability, a false negative error probability of at most $\\delta$ can be achieved with $n=O\\left(\\frac{\\log(1/\\delta)}{D^\\infty(\\rho\\|F)}\\right)$ copies of $\\rho$, in the limit where $\\delta \\to 0$.", "url": "https://arxiv.org/abs/2607.24712", "type": "理论", "summary": "1. 该工作首次建立有限副本下量子资源测试的严格样本复杂度界，给出固定误警概率时漏警概率至多δ所需副本数的显式上界。\n2. 其核心是通过单次量子模糊技术，揭示样本复杂度与资源度量D^∞(ρ∥F)间的对数反比标度律n=O(log(1/δ)/D^∞(ρ∥F))。\n3. 此结果解决了正则化Rényi相对熵收敛性的开放问题，并为有限资源下量子态区分与资源操作提供了实践保证。", "summary_source": "deepseek", "authors": [{"name": "Dmitry Grinko"}, {"name": "Ludovico Lami"}], "featured_authors": [{"name": "Dmitry Grinko"}, {"name": "Ludovico Lami"}], "author_count": 2}, {"id": "2607.24714", "category": "quant-ph", "title": "Efficient LLM-Generated Shuttling Compilers for Complex Trapped-Ion Architectures", "abstract": "Trapped-ion quantum computers rely on shuttling compilers, which cast an input algorithm into a sequence of ion-qubit movements within a given architecture. We present the first study in which a single frontier large language model (LLM), Claude Opus 4.7, generates and iteratively refines the full Python code of shuttling compilers from written specifications. We start with a compiler for (i) a linear segmented trap, extend it to (ii) a trap with junctions, and finally achieve efficient compilation for (iii) a broad class of connected trap graphs. The compilers for the more general cases are seeded with code from the previous ones. We benchmark the LLM-generated compilers against state-of-the-art hand-crafted ones using a common suite of quantum circuits. The number of shuttling timesteps is reduced by up to 76% for (i) and up to 39% for (ii). For the broad case (iii) of freely connected architectures, we find large variations in the required number of shuttling timesteps, depending on the connectivity. A densely connected, junction-rich architecture yields an order-of-magnitude reduction in shuttling timesteps compared to a corridor-like one. Repeating the complete generation and evaluation with a second frontier LLM, Claude Fable 5, reproduces these findings, with the Fable 5 compilers surpassing the hand-crafted ones more often on the largest circuits. Our results show that an unmodified frontier LLM can produce working, correct, and competitive shuttling compilers without additional manual algorithmic engineering, thus reducing the development time for new architectures from several months to a few days.", "url": "https://arxiv.org/abs/2607.24714", "type": "理论+数值", "summary": "1. 该工作首次使用单一前沿大语言模型从零生成并迭代优化离子阱量子计算机的shuttling编译器，覆盖线性分段陷阱、带结陷阱及一般连接图架构。\n2. 其技术核心在于通过递进式代码生成，使LLM自动重用先前编译器代码，为复杂架构产出的编译器在标准测试电路上最多减少76%的shuttling时步数，且另一模型复现了结果。\n3. 这展现出未微调的通用LLM能够生成正确且具有竞争力的完整编译器，有望将新架构的编译器开发周期从数月缩短至数天，并推动离子阱量子计算的自动化设计流程。", "summary_source": "deepseek", "authors": [{"name": "Fabian Kreppel"}, {"name": "Reza Salkhordeh"}, {"name": "Ferdinand Schmidt-Kaler"}, {"name": "André Brinkmann"}], "featured_authors": [{"name": "Fabian Kreppel"}, {"name": "Reza Salkhordeh"}, {"name": "Ferdinand Schmidt-Kaler"}, {"name": "André Brinkmann"}], "author_count": 4}, {"id": "2607.24722", "category": "quant-ph", "title": "Scalable Variational Quantum Optimization via Pauli Correlation Encoding: Application to Large-Scale Power Demand Portfolio Optimization", "abstract": "Variational quantum algorithms offer a promising route to combinatorial optimization, but their applicability is limited by the challenge of encoding large-scale problems within restricted qubit resources. In this work, we introduce a scalable variational framework based on Pauli correlation encoding (PCE) and apply it to electric power demand portfolio optimization. Binary variables are represented through expectation values of Pauli correlation operators, which encode multi-body correlations of the quantum state and provide a continuous relaxation enabling compact representations with few qubits. We further propose a two-stage hybrid formulation, in which a time-averaged problem provides initialization for a time-resolved optimization. Numerical simulations demonstrate near-optimal performance across problem sizes ranging from $m$=18 to 10,296, with normalized cost gaps on the order of $10^{-4}$ relative to solutions with certified optimality. We show that the performance is governed by the interplay between continuous relaxation and discretization: the effective resolution of the correlator representation determines how reliably improvements in the continuous loss translate into better discrete solutions, with larger systems exhibiting more consistent behavior. Finally, we demonstrate robustness on a trapped-ion quantum processor, where high-quality solutions are obtained despite noise and finite sampling. These results establish PCE as a physically motivated and qubit-efficient framework for large-scale combinatorial optimization.", "url": "https://arxiv.org/abs/2607.24722", "type": "数值", "summary": "1. 该工作提出基于Pauli相关编码（PCE）的可扩展变分量子优化框架，并应用于大规模电力需求组合优化问题。\n2. 其核心卖点在于通过Pauli相关算子期望值编码二进制变量，实现连续松弛与紧凑表示，并采用两阶段混合公式；数值模拟显示归一化成本差距约10^{-4}，且系统越大性能越一致，关键在于关联表示的有效分辨率。\n3. 这一框架在捕获离子量子处理器上展现了噪声鲁棒性，为以少量量子比特实现大规模组合优化提供了物理驱动的可行方案。", "summary_source": "deepseek", "authors": [{"name": "Takuya Yoshioka"}, {"name": "Keita Sasada"}, {"name": "Riku Usuki"}, {"name": "Yuichiro Nakano"}, {"name": "Keisuke Fujii"}], "featured_authors": [{"name": "Takuya Yoshioka"}, {"name": "Keita Sasada"}, {"name": "Riku Usuki"}, {"name": "Yuichiro Nakano"}, {"name": "Keisuke Fujii"}], "author_count": 5}, {"id": "2607.24725", "category": "quant-ph", "title": "Pulse engineering via projection of response functions at infinite nonlinear order", "abstract": "Optimal control problems arise in a wide range of scientific disciplines, but the corresponding optimization algorithms often display a strong dependence on hyperparameters that significantly influence performance and convergence. For the optimal implementation of quantum algorithms, these challenges are further amplified by high-dimensional control landscapes and the need for high-fidelity operations. Here, we propose an algorithm for optimal control problems in quantum computing to efficiently generate high-fidelity control protocols for multi-qubit systems in a hyperparameter and gradient free manner. The method, referred to as Pulse Engineering via Projection of response functions at infinite nonlinear order (PEPRino), leverages the framework of response theory to navigate the control landscape to find high-fidelity implementations. This is achieved by determining the control landscape via response functions to infinite order, efficiently evaluated by resummation in terms of the first and second order response function. To demonstrate the approach, we apply it to quantum systems consisting of two and three qubits for the optimal implementation of the Quantum Fourier Transform (QFT). We benchmark the proposed algorithm against the Chopped Random Basis (CRAB) algorithm utilizing the Nelder-Mead method, focusing on the 2-qubit scenario. The results indicate faster convergence regarding iteration steps and computational time, highlighting the advantages of our approach.", "url": "https://arxiv.org/abs/2607.24725", "type": "理论+数值", "summary": "1. 该工作提出了一种无超参数无梯度的量子最优控制算法PEPRino，用于高效生成多量子比特系统的高保真控制协议。\n2. 其技术核心在于利用响应函数至无穷阶的投影（通过一、二阶响应函数重求和实现）来直接导航控制景观，避免传统算法对超参数和梯度的依赖。\n3. 该算法在二/三量子比特量子傅里叶变换实现中相比CRAB算法表现出更快的迭代收敛速度，为量子控制优化提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Lia Kley"}, {"name": "Ludwig Mathey"}], "featured_authors": [{"name": "Lia Kley"}, {"name": "Ludwig Mathey"}], "author_count": 2}, {"id": "2607.24728", "category": "quant-ph", "title": "Classical simulation and model concentration in passive linear optics", "abstract": "Passive linear optics is a restricted model of quantum computation, with complexity-theoretic evidence of quantum advantage for sampling tasks and low losses that make it attractive for near-term algorithms. In qubit architectures, a body of work has revealed a close connection between barren plateaus and classical simulability. Whether an analogous tradeoff exists for bosonic systems remains largely unexplored. Building on a recently developed representation-theoretic framework for moments of random passive linear-optical circuits, we characterize the concentration of expectation values for relevant families of particle-number-preserving observables by evaluating their projections into irreducible representations of the unitary group and analyzing their asymptotic scaling. We show that concentration is governed by the misalignment of the projections into irreducible representations of the input state and the observable, giving a unified representation-theoretic interpretation of generalized entanglement and locality in the bosonic setting. We further relate these concentration properties to existing classical simulation techniques, identifying broad classes of trainable observables that admit efficient classical simulation. Conversely, we identify Fock-state inputs and observables that appear to evade exponential concentration while retaining a polynomially large signal component not accessible to known efficient classical simulation methods. The separation is only partial: most of the signal remains classically tractable, and the residual part, while not exponentially suppressed, is small enough that a truncation serves as a classical surrogate with polynomially small error. Our framework nonetheless provides a systematic route for searching for regimes that unambiguously combine the absence of exponential concentration and lies beyond known efficient classical simulation methods.", "url": "https://arxiv.org/abs/2607.24728", "type": "理论+数值", "summary": "1. 该工作利用表示论框架，表征了无源线性光学电路中可观测量期望值的集中行为，并建立了与经典模拟技术的关联。\n2. 其核心发现是集中由输入态与可观测量在酉群不可约表示中的投影失配决定，从而统一了玻色子体系中广义纠缠与局域性的表示论诠释。\n3. 这为系统搜索同时避免指数集中且无法被已知高效经典模拟方法处理的参数区域提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Léo Monbroussou"}, {"name": "Hugo Thomas"}, {"name": "Hela Mhiri"}, {"name": "Zoë Holmes"}, {"name": "Elham Kashefi"}], "featured_authors": [{"name": "Léo Monbroussou"}, {"name": "Hugo Thomas"}, {"name": "Hela Mhiri"}, {"name": "Zoë Holmes"}, {"name": "Elham Kashefi"}], "author_count": 5}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
