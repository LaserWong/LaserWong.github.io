24163", "category": "cond-mat", "title": "Dynamic hysteresis in an autocatalytic reaction network", "abstract": "Here we show that an autocatalytic reaction network can exhibit dynamic hysteresis as a result of the competition between its intrinsic relaxation time scale and that of the periodic drive. The autocatalytic reaction steps generate bistability in the concentration of the autocatalytic species, and periodic pumping of the product species provides the external drive. Hysteresis arises from the lag between the concentration response of the autocatalytic species and the external periodic drive. The resulting hysteresis-loop area quantifies the extent of the system's hysteretic response. Using the periodically driven Schlögl model as a representative bistable chemical system, we use this loop area to determine how the magnitude of the hysteretic response is controlled by the driving protocol, intrinsic fluctuations, and the size of the system. Varying the driving frequency and the strength of the fluctuations causes a turnover of the hysteresis loop area, whereas the area changes monotonically with driving amplitude and system size. These trends identify the driving protocol and fluctuation strength as primary controls on the magnitude of dynamic hysteresis. In contrast to stochastic resonance, which is typically associated with weak periodic forcing and noise-assisted amplification, dynamic hysteresis can characterize the reaction-system response over a wider range of external control conditions. We further show that the delayed concentration response is mirrored in Shannon entropy and in the total entropy production rate, connecting dynamic hysteresis to information-theoretic and stochastic-thermodynamic measures of irreversibility. Overall, we identify and interpret the role of the controlling factors in chemical dynamic hysteresis and suggest implications for efficient chemical logic gates and eventually, chemical computers.", "url": "https://arxiv.org/abs/2607.24163", "type": "理论", "summary": "1. 该工作展示了自催化反应网络中，内在弛豫时间与周期性驱动竞争所致的动态迟滞现象。\n2. 其卖点在于通过周期性驱动态Schlögl模型的迟滞回线面积，定量揭示驱动协议、涨落强度与系统尺寸对迟滞响应的控制规律。\n3. 这为利用化学动态迟滞构建高效化学逻辑门乃至化学计算机提供了明确的控制维度和信息-热力学启发。", "summary_source": "deepseek", "authors": [{"name": "Sheela Yadav"}, {"name": "Jason R. Green"}, {"name": "Moupriya Das"}], "featured_authors": [{"name": "Sheela Yadav"}, {"name": "Jason R. Green"}, {"name": "Moupriya Das"}], "author_count": 3}, {"id": "2607.24208", "category": "cond-mat", "title": "Hidden topology and strong quantum metric bounds in trivial systems", "abstract": "The quantum metric integral (QMI) in two-dimensional (2D) systems is conventionally bounded from below by the Chern number. For systems with zero Chern number or identically vanishing Berry curvature, however, this bound becomes trivial and provides no useful geometric constraints. Here, we develop a dimension-reduction framework that decomposes the 2D QMI into lower-dimensional components in a nested-loop way. With this method, we establish a nonzero lower bound on the QMI arising from one-dimensional topological obstructions even when the conventional 2D topology is trivial. We explicitly demonstrate this mechanism in a tilted 2D Su-Schrieffer-Heeger model and an anisotropic Wilson-Dirac model with chiral symmetry. The resulting lower bounds of QMI are determined by the quantized Wannier bands along two different directions. We further investigate the quantum geometry in higher-order topological phases following the same strategy. By introducing Wannier-band basis obtained from the nested Wilson loop, we demonstrate that the Wannier-band QMI is bounded from below by the higher-order topological invariant, e.g. the quadrupole moment in Benalcazar-Bernevig-Hughes model. Our results establish nonzero lower bounds on QMI from a dimension-reduction framework, thereby generalizing the fundamental relation between quantum geometry and topology.", "url": "https://arxiv.org/abs/2607.24208", "type": "理论", "summary": "1. 该工作提出一个降维框架，将二维量子度量积分分解为嵌套环低维分量，在常规拓扑平庸系统中建立非零下界。\n2. 其卖点在于通过Wannier带基揭示下界由一维拓扑阻碍或高阶拓扑不变量（如四极矩）决定。\n3. 这为一般化量子几何与拓扑的基本关系提供了明确途径，适用于各类平庸但几何受限的系统。", "summary_source": "deepseek", "authors": [{"name": "Chang-An Li"}, {"name": "Yulin Qin"}, {"name": "Bo Fu"}, {"name": "Jian Li"}], "featured_authors": [{"name": "Chang-An Li"}, {"name": "Yulin Qin"}, {"name": "Bo Fu"}, {"name": "Jian Li"}], "author_count": 4}, {"id": "2607.24231", "category": "cond-mat", "title": "Distinct finite-temperature phase diagrams of non-invertible Kennedy--Tasaki duals", "abstract": "Do two Hamiltonians related by a non-invertible transformation necessarily share the same finite-temperature phase diagram? For a cluster-model interpolation $H(s)$ and its Kennedy--Tasaki dual $\\tilde H(s)$, the map is a partial isometry and equates only their all-plus-sector partition functions. In one dimension, thermal order is forbidden on both sides, leaving only the common zero-temperature transition at $s=\\tfrac12$. In three dimensions, however, the inequivalence is exact already at $s=0$: the cluster model has an analytic paramagnetic free energy, whereas its dual $\\mathbb Z_2$ gauge theory has a deconfinement transition at $T_c\\approx1.31$. Quantum Monte Carlo shows that the mismatch occupies a finite window of the interpolation, marked by a self-dual frozen wedge on the cluster side and a deconfined dome on the gauge side; once both close the two phase diagrams agree again, coinciding over the entire remaining interval up to the shared trivial endpoint $s=1$.", "url": "https://arxiv.org/abs/2607.24231", "type": "理论+数值", "summary": "1. 该工作通过量子蒙特卡洛模拟，对比了非可逆Kennedy-Tasaki对偶下簇模型插值与Z₂规范理论的有限温度相图。\n2. 其核心发现是对偶不等价性在三维中占据有限窗口：簇侧出现自对偶冻结楔，规范侧出现退禁闭穹顶，而一维中两者仅共享零温转变。\n3. 这提示非可逆对偶的有限温度相图不等价性依赖于维度与局域对称性，为理解非可逆对称性在热力学中的作用提供了典型范例。", "summary_source": "deepseek", "authors": [{"name": "Weiguang Cao"}, {"name": "Haruki Watanabe"}], "featured_authors": [{"name": "Weiguang Cao"}, {"name": "Haruki Watanabe"}], "author_count": 2}, {"id": "2607.24252", "category": "cond-mat", "title": "Non-Reciprocal yet Equilibrium Critical Dynamics", "abstract": "Non-reciprocal interactions find broad applicability in non-equilibrium and living systems. Their canonical implementation involves asymmetric couplings between two entities, which generally induce spatio-temporal patterns and time-dependent steady states that break time-translational invariance, representing a clear deviation from equilibrium physics. Although their phenomenology is well understood, whether non-reciprocal interactions induce new universality classes, and if so, under what conditions, remains an open question. In the present work, we perform a field-theoretic renormalization group (RG) analysis of the dynamics of two non-reciprocally coupled $n$-vector order parameters possessing a $U(n)$ symmetry, generalizing previous results to order parameters with multiple components, a feature that has been shown to generate novel non-equilibrium critical behavior in certain non-reciprocal systems. To lowest order in $\\epsilon = 4-d$, we find that the non-reciprocal coupling is RG-irrelevant, and the critical behavior is governed by the equilibrium fixed point of the Model A universality class of Hohenberg and Halperin with $2n$ vector components, even though the transition is into a non-equilibrium state. Our results demonstrate that non-reciprocity alone may not be sufficient to induce novel universality classes.", "url": "https://arxiv.org/abs/2607.24252", "type": "理论+数值", "summary": "1. 该文采用场论重整化群方法，分析了两个非互易耦合且具U(n)对称性的n-矢量序参量在4-d展开下的临界动力学。\n2. 其技术要点在于发现非互易耦合在最低阶ε展开中是不相关微扰，临界行为由具有2n分量的平衡Model A普适类支配。\n3. 这表明非互易性本身不足以诱导新的非平衡普适类，为理解非互易系统的临界现象提供了明确判据。", "summary_source": "deepseek", "authors": [{"name": "Emir Sezik"}], "featured_authors": [{"name": "Emir Sezik"}], "author_count": 1}, {"id": "2607.24272", "category": "cond-mat", "title": "Catalyst Diffusion Transformer: Generative Inverse Design of Heterogeneous Catalysts", "abstract": "The vast chemical design space and complex, interdependent design variables make catalyst discovery for targeted properties highly labor- and resource-intensive. Although generative models have emerged as a promising solution, existing approaches are generally limited to single-property conditioning or narrow chemical spaces. Here, we present Catalyst Diffusion Transformer (CatDiT), a unified framework for inverse catalyst design that generates valid and novel structures ranging from intermetallic alloys to oxide surfaces. By learning compressed latent representations, CatDiT enables efficient training and rapid sampling while supporting simultaneous conditioning on adsorbate type, binding energy, and catalyst class. The model provides reliable control of discrete properties and directional control of continuous properties, enriching candidate pools for reaction-specific catalyst discovery. As a representative application, multi-conditional generation for the nitrogen reduction reaction (NRR) yields 28 density functional theory (DFT)-relaxed alloy candidates that satisfy the target activity window and lie above the pure-metal *N-*H scaling line, corresponding to a ~1.5-fold enrichment over the source distribution. These results establish CatDiT as a practical and scalable approach for property-directed catalyst inverse design and targeted catalyst generation.", "url": "https://arxiv.org/abs/2607.24272", "type": "理论+数值", "summary": "1. 该工作提出了Catalyst Diffusion Transformer框架，用于从金属间合金到氧化物表面的异构催化剂逆向生成设计。\n2. 其核心在于通过压缩潜在表示实现高效训练与快速采样，并支持吸附物种、结合能及催化剂类别等多条件联合控制。\n3. 这为氮还原反应等多条件目标导向的催化剂筛选提供了可扩展方案，约1.5倍富集了满足活性窗口的DFT弛豫候选材料。", "summary_source": "deepseek", "authors": [{"name": "Hayoung Doo"}, {"name": "Dong Hyeon Mok"}, {"name": "Seoin Back"}, {"name": "Jonggeol Na"}], "featured_authors": [{"name": "Hayoung Doo"}, {"name": "Dong Hyeon Mok"}, {"name": "Seoin Back"}, {"name": "Jonggeol Na"}], "author_count": 4}, {"id": "2607.24327", "category": "cond-mat", "title": "Aligning Heterogeneous DFT Datasets: A Graph Neural Network Approach to Cross-Functional Formation Energies", "abstract": "Heterogeneous density functional theory (DFT) calculations, particularly plane-wave implementations, introduce systematic formation energy errors ranging from tens to hundreds of meV/atom, depending on the selection of exchange-correlation functionals, kinetic energy cutoffs, pseudopotentials, and dispersion corrections. As demonstrated by the MatPES dataset, identical structures can exhibit an average energy discrepancy of 107 meV/atom between PBE and r2SCAN calculations. Such method-dependent discrepancies hinder the integration of multi-source DFT data, greatly limiting the scale and quality of datasets for training robust materials AI models. Here, we resolve this fundamental data silo barrier via graph-based transfer learning. Leveraging 380,190 structurally paired PBE-r2SCAN entries from the MatPES database, we train a structure-aware graph neural network to predict cross-functional energy residuals and align inconsistent DFT energy scales. By adopting GPTFF model architecture, the model converts conventional PBE energies to r2SCAN-level accuracy with a mean absolute error of 14.3 meV/atom, compared with 18.2 meV/atom achieved by CHGNet. This versatile approach effectively upgrades massive legacy PBE datasets to high-precision r2SCAN standards. It enables reliable predictions of phase stability, battery voltage profiles, and reaction thermodynamics, while allowing the integration of multi-source DFT data to advance the development of high-performance materials foundation models.", "url": "https://arxiv.org/abs/2607.24327", "type": "理论+数值", "summary": "1. 本文提出一种图神经网络方法，利用MatPES数据库中近38万组结构配对数据，通过迁移学习将PBE泛函形成能预测至r2SCAN精度。\n2. 该模型采用GPTFF架构预测跨泛函能量残差，对齐异质DFT能量标度，平均绝对误差仅14.3 meV/原子，优于CHGNet的18.2 meV/原子。\n3. 该工作为整合多源DFT数据、升级历史PBE数据集提供了有效工具，可提升相稳定性与电化学性质预测可靠性，支撑高性能材料基础模型开发。", "summary_source": "deepseek", "authors": [{"name": "Yidong Huang"}, {"name": "Tenglong Lu"}, {"name": "Hanwen Kang"}, {"name": "Junfeng Huang"}, {"name": "Sheng Meng"}, {"name": "Miao Liu"}], "featured_authors": [{"name": "Yidong Huang"}, {"name": "Tenglong Lu"}, {"name": "Hanwen Kang"}, {"name": "Junfeng Huang"}, {"name": "Sheng Meng"}, {"name": "Miao Liu"}], "author_count": 6}, {"id": "2607.24455", "category": "cond-mat", "title": "A Grand-Canonical Solution to a Class of Random Optimization Problems", "abstract": "We introduce a general framework to solve a class of combinatorial opti- mization problems, including the matching problem, the Traveling Salesman Problem, and also the minimum weight k-factor problem. By reformulating these problems as an arrangement model, we recast the optimization task into a grand-canonical ensemble, where chemical potentials are used to re- lax strict topological constraints. The analytical solution found can serve as a polynomial-time algorithm to compute an approximate minimum cost for arbitrary k and link-weight distributions. Our framework is complementary to existing approaches and reveals new connections between combinatorial optimization and the statistical physics of disordered systems.", "url": "https://arxiv.org/abs/2607.24455", "type": "理论+数值", "summary": "1. 该工作构建了一个巨正则系综框架，将匹配问题、旅行商问题及最小权重k-因子问题等随机优化问题转化为排列模型。\n2. 其核心在于引入化学势松弛严格的拓扑约束，从而得到解析解，并可作为任意k及链接权重分布下的多项式时间近似算法。\n3. 这一框架补充了现有方法，揭示了组合优化与无序系统统计物理之间的新关联，为设计更高效的优化算法提供了物理启发。", "summary_source": "deepseek", "authors": [{"name": "Izat B Baybusinov"}, {"name": "Enrico M Fenoaltea"}, {"name": "Zhen Han"}, {"name": "Yi-Cheng Zhang"}], "featured_authors": [{"name": "Izat B Baybusinov"}, {"name": "Enrico M Fenoaltea"}, {"name": "Zhen Han"}, {"name": "Yi-Cheng Zhang"}], "author_count": 4}, {"id": "2607.24456", "category": "cond-mat", "title": "Exceptional Cones from an Indefinite Bogoliubov Metric in Hyperbolic Polariton Condensates", "abstract": "Long-wavelength Bogoliubov phonons in an ordinary condensate realize the standard acoustic Lorentz metric. We show that a condensate formed in a hyperbolic polariton band realizes a different collective geometry with an indefinite Bogoliubov metric whose spatial signature is inherited from the opposite signs of the band curvatures. This metric converts the acoustic light cone into a hyperbolic stability wedge, separating propagating quasiparticles from dynamically unstable ones. In a driven-dissipative condensate, gain saturation turns this metric relation into a non-Hermitian Bogoliubov dispersion. The zero-discriminant surface becomes an exceptional cone in the parametric space $(q_x,q_y,\\Delta_{\\rm NH})$, appearing as an exceptional hyperbola at fixed gain saturation. Across this surface the Bogoliubov branches coalesce, the biorthogonal phase rigidity collapses, and the spectrum changes from propagation to amplified or overdamped dynamics. Our results identify hyperbolic polariton condensates as a controllable setting where non-Hermitian exceptional degeneracies are organized by an effective Bogoliubov metric.", "url": "https://arxiv.org/abs/2607.24456", "type": "理论", "summary": "1. 该工作揭示了双曲极化激元凝聚体中长波Bogoliubov激发的有效度量具有不定性，其空间符号继承自能带曲率相反，并由此产生例外锥结构。\n2. 核心物理在于不定度量将标准声学光锥转化为双曲稳定楔，在驱动-耗散下增益饱和导致非厄米色散，零判别面在参数空间中形成例外锥（固定增益时为例外双曲线），跨越时支合并且双正交相位刚性坍缩。\n3. 这使双曲极化激元凝聚体成为由有效Bogoliubov度量组织非厄米例外简并的可控平台，为探索从传播到放大或过阻尼的奇异动力学提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Junhui Cao"}, {"name": "Kirill Bazarov"}, {"name": "Alexey Kavokin"}], "featured_authors": [{"name": "Junhui Cao"}, {"name": "Kirill Bazarov"}, {"name": "Alexey Kavokin"}], "author_count": 3}, {"id": "2607.24478", "category": "cond-mat", "title": "Learning limit cycles via Hebbian synaptic plasticity", "abstract": "We investigate high-dimensional, non-linear dynamical systems when exposed to incoherent periodic inputs and Hebbian-like synaptic plasticity. Our findings reveal a striking phenomenon: depending on the interplay between the strength of the periodic drive and synaptic plasticity, the system's phase diagram can give rise to a region where, once both inputs are removed, the collective dynamics spontaneously settles into a limit cycle. This suggests that periodic drives can imprint lasting rhythmic patterns into the network through plasticity, effectively teaching it to oscillate on its own. Numerical simulations on finite size systems show that the limit cycle phase can be easily detected on single-sample trajectories, while averaged curves are affected by strong finite size effects due to sample-to-sample fluctuations of the period of the limit cycles.", "url": "https://arxiv.org/abs/2607.24478", "type": "数值", "summary": "1. 该工作研究了高维非线性动力系统在非相干周期输入与Hebbian突触可塑性作用下的集体动力学。\n2. 核心发现在于周期驱动与可塑性的竞争使系统在输入移除后自发进入极限环，该相可通过单样本轨迹检测。\n3. 这揭示了外部节律通过可塑性印记为网络内在振荡的机制，为学习与记忆的动力学模型提供启发。", "summary_source": "deepseek", "authors": [{"name": "Samantha J. Fournier"}, {"name": "Luca Vincenzo Spallanzani"}, {"name": "Pierfrancesco Urbani"}], "featured_authors": [{"name": "Samantha J. Fournier"}, {"name": "Luca Vincenzo Spallanzani"}, {"name": "Pierfrancesco Urbani"}], "author_count": 3}, {"id": "2607.24599", "category": "cond-mat", "title": "Quantum oscillation fingerprints of altermagnetism in hole-doped RuO2", "abstract": "Altermagnetism, characterized by its ferromagnetism-like spin-splitting band structure and antiferromagnetism-like magnetic order, has garnered considerable attention recently. Although hole doping may promote magnetism in the debated altermagnet candidate RuO2, the evolution of its electronic and magnetic properties under hole doping remains poorly understood. Based on first-principles calculations, we employ quantum oscillations to study hole-doped RuO2. We find that hole doping can enhance spin splitting and reconstruct the Fermi surface in RuO2, which is revealed by the angle-dependent quantum oscillation frequency. By tracking a pair of closed Fermi-surface pockets, we identify a meaningful correlation between the magnetic moment of Ru and a quantum-oscillation-based signature of spin splitting. This correlation follows a quasi-linear trend over a broad doping range, which can be captured by a minimal two-dimensional d-wave altermagnetic model. In addition, the hole-doped RuO2 exhibits a transition from a nonmagnetic to an altermagnetic state via an intermediate state. The quasi-linear correlation through quantum oscillation and the distinct quantum oscillation frequency of the stable altermagnetic state can serve as useful signatures for identifying the altermagnetic state in RuO2. Our results provide a comprehensive framework for understanding hole-doped RuO2, offering new insights into altermagnetic transitions and their identification.", "url": "https://arxiv.org/abs/2607.24599", "type": "理论+数值", "summary": "1. 该工作基于第一性原理计算，通过量子振荡研究了空穴掺杂RuO₂中的交变磁性特征。\n2. 其物理核心在于揭示磁矩与量子振荡自旋分裂信号间的准线性关联，该关联可由最小二维d波交变磁模型描述。\n3. 这为空穴掺杂RuO₂中稳定交变磁态的识别及非磁-交变磁跃迁提供了明确的量子振荡指纹。", "summary_source": "deepseek", "authors": [{"name": "Yuchi Yang"}, {"name": "Yusheng Hou"}], "featured_authors": [{"name": "Yuchi Yang"}, {"name": "Yusheng Hou"}], "author_count": 2}, {"id": "2607.24619", "category": "cond-mat", "title": "Control of morphology and topology in a lattice model of branching morphogenesis", "abstract": "We present a lattice model for morphogen-controlled branching morphogenesis which combines ideas and concepts from non-equilibrium physics and developmental biology. In this model, the stochastic occupation dynamics of cells is coupled with signaling molecules (morphogens) produced by the cells. We investigate growth patterns governed by morphogen concentration gradients, spanning regimes ranging from the diffusion-limited aggregation limit to the stochastic surface growth (Eden model) limit. Moreover, we introduce control over topology by a local operator and study growth, degrowth, and steady-state dynamics of branched patterns. The topology-preserving steady-state clusters exhibit a power-law scaling of radius of gyration with cluster size, yielding the exponents $0.68\\pm0.01$ in square lattice and $0.67\\pm 0.01$ in hexagonal lattice.", "url": "https://arxiv.org/abs/2607.24619", "type": "理论", "summary": "1. 该工作融合非平衡物理与发育生物学，将细胞的随机占据动力学与其产生的形态发生素信号分子相耦合，构建了一个晶格模型，并通过局域算符实现了对分支形态发生中形态与拓扑的控制。\n2. 其核心卖点在于局域算符对分支拓扑的精细调控，以及系统揭示了受形态发生素浓度梯度支配的生长模式，涵盖了从扩散限制聚集极限到随机表面生长极限的完整区间，并研究了生长、退化与稳态动力学过程。\n3. 稳态下拓扑保持团簇的回转半径与尺寸满足幂律标度，在方格和六角格上分别给出标度指数0.68±0.01和0.67±0.01，这一结果不仅为分支形态发生的普适类提供了定量证据，也为非平衡生长动力学的分类与建模提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Christian Hanauer"}, {"name": "Frank Jülicher"}, {"name": "Efe Ilker"}], "featured_authors": [{"name": "Christian Hanauer"}, {"name": "Frank Jülicher"}, {"name": "Efe Ilker"}], "author_count": 3}, {"id": "2607.24620", "category": "cond-mat", "title": "A General Model of Interfacial Chemical Equilibrium in Phase-Field Method", "abstract": "We report a new approach to interfacial equilibria among multiple solution phases in the phase-field method. It employs auxiliary non-conserved variables to describe the composition differences among different phases, and their temporal evolution is driven by the differences among different chemical diffusional potentials. It is reduced to the Wheeler-Boettinger-McFadden (WBM) model of equal interfacial chemical compositions and to the Kim-Kim-Suzuki (KKS) model of equal interfacial chemical diffusion potentials as two limiting cases. It can directly incorporate thermodynamic databases without any further approximations and simplifications. It is generally applicable to a wide range of problems involving composition evolution and chemical equilibria, including processes such as interdiffusion between two ordered phases not sharing any common composition range, which would pose difficulty to the existing treatments using WBM and KKS models.", "url": "https://arxiv.org/abs/2607.24620", "type": "理论", "summary": "1. 该工作提出了相场法中多相界面化学平衡的通用模型，通过引入辅助非守恒变量描述相间成分差异。\n2. 其核心在于以化学扩散势差驱动变量演化，统一了界面成分相等（WBM）与扩散势相等（KKS）两种极限情形。\n3. 该模型可直接整合热力学数据库，适用于无共同成分区间的有序相间互扩散等现有方法难以处理的问题。", "summary_source": "deepseek", "authors": [{"name": "Yanzhou Ji"}, {"name": "Long-Qing Chen"}], "featured_authors": [{"name": "Yanzhou Ji"}, {"name": "Long-Qing Chen"}], "author_count": 2}, {"id": "2607.24679", "category": "cond-mat", "title": "Sign-optimized Quantum Monte Carlo", "abstract": "The sign problem breaks the polynomial scaling of Quantum Monte Carlo methods. We alleviate it by rotation of the local basis of the Hilbert space, such that the phase of off-diagonal matrix elements of the rotated Hamiltonian is minimized. These minima coincide with optima of the average sign. We benchmark our method for frustrated Heisenberg antiferromagnets in one dimension and on the two-dimensional maple-leaf lattice. Our approach reveals more efficient bases with improved sign in a large part of the parameter space for all models considered, enabling us to reach lower temperatures, on par with state-of-the-art numerical linked cluster expansions which we directly compare to.", "url": "https://arxiv.org/abs/2607.24679", "type": "理论+数值", "summary": "1. 该工作针对量子蒙特卡洛方法的符号问题，提出通过旋转希尔伯特空间局域基以最小化哈密顿量非对角元相位的方法。\n2. 核心在于将平均符号优化等价于相位极小化，并在一维及二维枫叶晶格受挫海森堡模型中实现显著符号改善，可达更低温度。\n3. 这为强关联受挫系统的低温数值模拟提供了可扩展的基优化策略，且与数值链接团簇展开等精确方法具有可比性。", "summary_source": "deepseek", "authors": [{"name": "Julius S. Herz"}, {"name": "Robin Schäfer"}, {"name": "Matías G. Gonzalez"}, {"name": "David J. Luitz"}], "featured_authors": [{"name": "Julius S. Herz"}, {"name": "Robin Schäfer"}, {"name": "Matías G. Gonzalez"}, {"name": "David J. Luitz"}], "author_count": 4}, {"id": "2607.24740", "category": "cond-mat", "title": "Anyon Condensation In Symmetry-Enriched Topological Phases: $G$-Grading of Multifusion Categories", "abstract": "Although anyon condensation is a standard mechanism for relating topological orders, anyon condensation in symmetry-enriched topological (SET) phases is more intricate because the condensate must also be compatible with the global symmetry. We study symmetry-preserving anyon condensation in SET phases described by the enlarged Hu-Geer-Wu (HGW) string-net model with multifusion-category input data. We show that a $G$-preserving condensation is characterized by a compatible grading of the input multifusion category, and that this grading constructs the multifusion-category input of the child SET phase. To make this construction concrete, we consider the case where the relevant data come from a finite group extension $E$ of $G$ by $N$: an $E$-graded fusion category induces a $G$-SET input by passing to the quotient symmetry $G$, and the resulting input naturally carries a compatible $N$-grading that implements the further condensation inside the SET phase while preserving $G$. We illustrate the construction using three quantum-double examples: the trivial extension $\\mathbb{Z}_2\\times\\mathbb{Z}_2$, the non-Abelian semidirect product $S_3$, and the nontrivial central extension $\\mathbb{Z}_4$. The $\\mathbb{Z}_4$ example further shows that symmetry fractionalized anyons do not obstruct symmetry-preserving condensation once the condensate is treated as a physical coherent state.", "url": "https://arxiv.org/abs/2607.24740", "type": "理论", "summary": "1. 该工作通过多融合范畴的G-分次刻画了对称富集拓扑相中保持全局对称性的任意子凝聚过程。\n2. 其技术核心在于利用有限群扩展构造相容分次，将凝聚与商对称性诱导的输入数据建立直接对应。\n3. 这为理解对称分数量子化任意子在相干态下不阻碍凝聚提供了明确框架，并可由量子双例子具体验证。", "summary_source": "deepseek", "authors": [{"name": "Nianrui Fu"}, {"name": "Siyuan Wang"}, {"name": "Yu Zhao"}, {"name": "Yidun Wan"}], "featured_authors": [{"name": "Nianrui Fu"}, {"name": "Siyuan Wang"}, {"name": "Yu Zhao"}, {"name": "Yidun Wan"}], "author_count": 4}, {"id": "2607.22775", "category": "hep-th", "title": "Exact Holomorphic Cayley Lumps in Eight Dimensions", "abstract": "A class of exact self-dual solutions is constructed for an eight-dimensional sigma model describing four-dimensional embeddings in Euclidean space. The theory admits a Spin(7)-invariant Cayley four-form that generates a Bogomolny-type bound for the Nambu-Goto action. The saturation of this bound leads to a first-order self-duality equation for embedding coordinates. A quaternionic polynomial ansatz has been shown to fail systematically by a residual sign mismatch, indicating an intrinsic algebraic obstruction. By contrast, the holomorphic embeddings of C^2 into C^4 satisfy the self-duality equation identically. The relationship between the present construction and the earlier work of Corrigan et al. on higher-dimensional self-duality and Gauntlett et al. on calibrated branes is discussed. Computer algebraic calculations using all 480 admissible octonionic bases show that only a small subset calibrates a given holomorphic embedding.", "url": "https://arxiv.org/abs/2607.22775", "type": "理论", "summary": "1. 该工作针对八维sigma模型中四维嵌入的Cayley lump系统，构造了一类精确全纯自对偶解，并证明其恒满足Spin(7)不变的Bogomolny型界。\n2. 其技术卖点在于揭示全纯嵌入C²→C⁴恒为一阶自对偶方程的解，而四元数多项式ansatz因固有符号不匹配而系统失效，表明存在代数障碍。\n3. 该构造与Corrigan等人及Gauntlett等人关于高维自对偶与校准膜的工作直接关联，且所有480个八元数基的穷举计算显示仅少数基校准给定全纯嵌入，为模型空间提供新约束。", "summary_source": "deepseek", "authors": [{"name": "Graeme Donald Robertson"}], "featured_authors": [{"name": "Graeme Donald Robertson"}], "author_count": 1}, {"id": "2607.22791", "category": "hep-th", "title": "Comments on deformed phase-space cosmology, SUSY and black holes", "abstract": "This paper presents the construction of the supersymmetric (SUSY) deformed version of the time dependent metric that describes the interior of the Schwarzschild BH. First, the noncommutative bosonic model is constructed by inducing the deformation in the minisuperspace coordinates and the associated canonical momentum. Following the methods of SUSY quantum mechanics, the supercharges of the deformed models are constructed and the deformed SUSY Wheeler-DeWitt equation is obtained. The classical dynamics are also obtained using the WKB approximation, we find the classical solutions and the conditions to satisfy the Hamiltonian constraint for both the SUSY and bosonic cases. Finally, the effects of the deformation in the context of deformed phase space cosmology and black holes are discussed.", "url": "https://arxiv.org/abs/2607.22791", "type": "理论", "summary": "1. 该论文构造了描述Schwarzschild黑洞内部含时度规的超对称形变版本，涵盖玻色与超对称情形。\n2. 通过极小超空间坐标及共轭动量引入非对易形变，构造超荷并导出形变超对称Wheeler-DeWitt方程，进而利用WKB近似求解经典动力学与哈密顿约束条件。\n3. 该形变框架为探索形变相空间宇宙学及黑洞内部的量子修正效应提供了具体理论途径。", "summary_source": "deepseek", "authors": [{"name": "O. López-Aguayo"}, {"name": "J. C. López-Domínguez"}, {"name": "G. E. Pérez-Cuéllar"}, {"name": "M. Sabido"}], "featured_authors": [{"name": "O. López-Aguayo"}, {"name": "J. C. López-Domínguez"}, {"name": "G. E. Pérez-Cuéllar"}, {"name": "M. Sabido"}], "author_count": 4}, {"id": "2607.22914", "category": "hep-th", "title": "Tensor Catalyzed Decoherence of Primordial Scalar Fluctuations", "abstract": "We provide the first complete calculation of the leading contribution to the decoherence of primordial fluctuations in the scalar part of the metric fluctuations within simplest, single-clock, inflationary models, assuming decoherence comes from gravitational interactions with an environment made up of the other, unmeasured, short-wavelength scalar and tensor modes. We include the contributions from {\\it all} of the contributing interactions at leading order in powers of $(H/M_p)^2$ and of the slow-roll parameter $\\epsilon_1$. Unlike all extant calculations in the literature we find a result that is {\\it not} slow-roll suppressed (and so is the same order of magnitude as tensor-mode decoherence). The difference arises because the dominant decoherence comes from interactions that involve {\\it both} the tensor and scalar environments simultaneously (and so are missed when they are examined separately). We verify that the leading contributions to decoherence are UV finite (as they must be). We confirm that the interactions driving decoherence become time-local and Gaussian in the deep super-Hubble inflationary regime and show how this can be used to reliably compute the evolution of the purity in the late-time regime relevant for observations (where naive perturbation theory is known to break down). The same derivation shows explicitly why the effects that undermine perturbation theory for decoherence do not also undermine the basic inflationary prediction for the amplitude of primordial fluctuations (in agreement with general arguments).2", "url": "https://arxiv.org/abs/2607.22914", "type": "理论", "summary": "1. 该工作首次完整计算了最简单场暴胀模型中原初标量曲率涨落因引力与短波长标量及张量环境耦合导致的退相干主导贡献。\n2. 其核心发现是退相干效应不具慢滚压低，源于先前被忽略的同时涉及标量场和张量场的混合环境相互作用。\n3. 这证实了超视界区域退相干动力学的局部性与高斯基化，为可靠计算观测相关纯度演化提供了框架，并解释了该效应为何不破坏暴胀谱标准预言。", "summary_source": "deepseek", "authors": [{"name": "C.P. Burgess"}, {"name": "D. Dineen"}, {"name": "R. Holman"}, {"name": "Greg Kaplanek"}], "featured_authors": [{"name": "C.P. Burgess"}, {"name": "D. Dineen"}, {"name": "R. Holman"}, {"name": "Greg Kaplanek"}], "author_count": 4}, {"id": "2607.22938", "category": "hep-th", "title": "Mass/electric versus NUT/magnetic charges: duality from scattering amplitudes in $D\\geq4$ and for all bosonic spins", "abstract": "We revisit Kerr-NUT metrics and related spin-$s$ fields in $D\\geq4$, and study their associated scattering amplitudes. Starting in position space, we highlight the interpretation of mass and (multiple) NUT charges as being associated to distinct solutions of the rotation-deformed radial equation, which is made explicit in Cartesian multi-Kerr-Schild coordinates. This interpretation extends to electromagnetism with magnetic-type charges, and also extends to higher-spin counterparts, in accordance with the classical double or multi copy. We then establish a notion of ``electric-magnetic\" duality in higher dimensions, relating mass/electric to NUT/magnetic charges, which generalises the $D=4$ case in a novel manner. For $D\\geq6$, this involves the choice where the multiple magnetic charges are equal. The duality is revealed in momentum space, by the 3-point scattering amplitudes that generate the solutions. For all spins, these amplitudes are constructed from a spin-raising operator $\\mathcal S_\\mu$ and take the form $\\varepsilon^{\\mu_1\\cdots\\mu_s}{\\mathcal S}_{\\mu_1}\\cdots {\\mathcal S}_{\\mu_s}$ acting on a scalar seed. The scalar seed of the electric sector is dual to that of the magnetic sector: where the former's rotation dependence resums to a Bessel function $J_{\\frac{D-5}{2}}$, the latter resums to a Bessel function $J_{-\\frac{D-5}{2}}$. Finally, we explore the notion of self-duality that arises from this picture. Studying the classical $2\\!\\mapsto\\!2$ amplitudes that determine leading-order scattering, we find no evidence of a higher-dimensional analogue of the integrability of $D=4$ self-dual gravity.", "url": "https://arxiv.org/abs/2607.22938", "type": "理论", "summary": "1. 该文重新审视了D≥4维Kerr-NUT度规及任意自旋玻色场的散射振幅，建立了质量/电型与NUT/磁型荷之间的对偶关系。\n2. 其要点在于通过自旋提升算符构造的3点振幅揭示了对偶性，电扇区与磁扇区的标量种子旋转依赖分别凝聚为贝塞尔函数J_{(D-5)/2}与J_{-(D-5)/2}。\n3. 对2→2散射振幅的分析表明，高维自对偶引力缺乏D=4情形下的可积性，这为探索高维引力对偶与经典双拷贝结构提供了约束。", "summary_source": "deepseek", "authors": [{"name": "Ricardo Monteiro"}, {"name": "Lecheng Ren"}, {"name": "Daniel Siretanu"}], "featured_authors": [{"name": "Ricardo Monteiro"}, {"name": "Lecheng Ren"}, {"name": "Daniel Siretanu"}], "author_count": 3}, {"id": "2607.23025", "category": "hep-th", "title": "Overcrowding and the Finite-$N$ Hilbert Space", "abstract": "Finite-$N$ trace relations reorganize the Hilbert space of gauge-invariant operators beyond the freely generated large-$N$ description. We study this structure using the Hironaka decomposition of the invariant ring of $d$ Hermitian $N\\times N$ matrices. We first prove that the primary invariants may always be chosen to be homogeneous single-trace operators. We then show that, for any such choice, a nontrivial secondary invariant must appear by degree $L_{N,d}=2\\log_d N+\\log_d\\log_d N+\\mathcal{O}_d(1)$, which is parametrically below the first universal trace identity at degree $N+1$. This is a global overcrowding effect: exponentially many independent short single traces compete for only $1+(d-1)N^2$ algebraically independent coordinates. The overcrowding scale matches the fastest scrambling times expected for fast scramblers. We argue that this agreement of scales is not accidental: overcrowding provides a microscopic algebraic picture of scrambling in matrix models. Low-rank examples show that secondary invariants can distinguish configurations with identical primary data and, for suitable dynamics, label semiclassical sectors connected by instantons. These results identify the Hironaka decomposition as a natural framework for organizing perturbative and intrinsically finite-$N$ information in collective descriptions of gauge theories.", "url": "https://arxiv.org/abs/2607.23025", "type": "理论", "summary": "1. 该工作利用Hironaka分解揭示了有限N规范理论中迹关系对规范不变算子希尔伯特空间的全局重新组织。\n2. 其核心发现是主不变量可统一取为齐次单迹算子，且第二类不变量必在远低于N+1的度数L_{N,d}出现，源于指数多短单迹与少数代数独立坐标间的过度拥挤，其尺度与快scrambling时间精确匹配。\n3. 这为矩阵模型中scrambling提供了微观代数图像，并通过第二类不变量区分半经典扇区，奠定了系统处理有限N微扰与非微扰信息的自然框架。", "summary_source": "deepseek", "authors": [{"name": "Robert de Mello Koch"}, {"name": "Anik Rudra"}, {"name": "Augustine Larweh Mahu"}], "featured_authors": [{"name": "Robert de Mello Koch"}, {"name": "Anik Rudra"}, {"name": "Augustine Larweh Mahu"}], "author_count": 3}, {"id": "2607.23172", "category": "hep-th", "title": "Horava Stars Revisited: New Phases of Incompressible Stars and Black Holes, and Buchdahl's Theorem", "abstract": "I study a particular exact solution for static stars in four-dimensional non-projectable Horava gravity, which has been proposed as a renormalizable gravity model without the ghost problem by abandoning Einstein's equal-footing treatment of space and time through anisotropic scaling with z > 1. Considering the spherically symmetric static black-hole solutions in z = 3 Horava gravity as the exterior spacetimes of stars, I obtain an exact solution for incompressible (i.e., uniform-density) static stars with an arbitrary cosmological constant and isotropic pressure, and lambda=1, in which Birkhoff's theorem holds. For a vanishing cosmological constant, I obtain a modified Buchdahl bound on the maximum compactness for uniform-density stars, which ranges from 4/9 to 1. By contrast, I find that Ultra-Compact Objects (UCOs) with compactness C > 1 also exist with negative pressure while, surprisingly, satisfying all four standard energy conditions. UCOs include the regular (non-singular) black-hole solutions with masses above the extremal black-hole mass. In these solutions, the matter is localized at the timelike core region bounded by the inner horizon, while their exterior metrics are unaffected by the core matter and identical to the corresponding vacuum Horava black-hole solutions. These long-sought regular black-hole solutions are essential manifestations of Birkhoff's theorem in Horava gravity. I also find negative-mass stars with positive pressure that violate all standard energy conditions. Finally, I prove Buchdahl's theorem in non-projectable Horava gravity. The proof uses a weight-monotonicity condition on the average density and Birkhoff's theorem, together with the usual assumption that average density is non-increasing.", "url": "https://arxiv.org/abs/2607.23172", "type": "理论", "summary": "1. 该工作系统研究了非投映Horava引力中不可压缩静态星体的新相，包括超致密物体与规则黑洞解。\n2. 其核心发现是超致密物体在满足所有标准能量条件下存在，并获得了修改的Buchdahl界限（4/9到1），同时证明了Buchdahl定理在该理论中的成立。\n3. 这为理解Horava引力中星体与黑洞的紧致性极限提供了新框架，并启示了规则黑洞解与Birkhoff定理的深层关联。", "summary_source": "deepseek", "authors": [{"name": "Mu-In Park"}], "featured_authors": [{"name": "Mu-In Park"}], "author_count": 1}, {"id": "2607.23253", "category": "hep-th", "title": "On the Nucleon Effective Mass in Neutron Stars Cooling", "abstract": "The cooling of neutrons stars, which are composed of ultra-high-density nuclear matter, strongly depends on the equation of state because the dominant cooling sources are neutrinos produced in their interiors. Here, we investigate the cooling properties of neutron stars, focusing on effective nucleon masses, whose impacts have been recently examined in supernova explosion and proto-neutron star cooling. The uncertainties of effective masses originate from the difference in the attractive interaction of scalar meson and the definition of the Dirac and Landau masses. At first, we employ so-called Walecka models that allow these two masses to be introduced within a unified framework and evaluate the resulting cooling curves. Based on the Walecka model, we compute the emissivity of the neutrons and the direct Urca process and their cooling curves. We demonstrate that the Dirac and Landau masses affect cooling of massive neutron stars, although most previous cooling simulations do not distinguish them. We also perform cooling simulations with two realistic equation of states based on relativistic mean-field (RMF) theory, whose differences arise from properties of only effective masses among characteristic parameters. These results are broadly consistent with those obtained from the Walecka models, indicating that the treatment of effective nucleon masses may be an important source of uncertainty in neutron-star cooling.", "url": "https://arxiv.org/abs/2607.23253", "type": "理论", "summary": "1. 本研究基于Walecka模型与相对论平均场理论，系统考察了Dirac质量与Landau质量对中子星冷却曲线及直接Urca过程发射率的影响。\n2. 技术关键在于区分了以往模拟中未明确分离的两种有效核子质量，揭示了它们在致密物质冷却中的不同作用。\n3. 结果表明，有效核子质量的具体处理可能是中子星冷却模拟中一类重要且被忽视的不确定性来源。", "summary_source": "deepseek", "authors": [{"name": "Yuuki Sugiyama"}, {"name": "Akira Dohi"}], "featured_authors": [{"name": "Yuuki Sugiyama"}, {"name": "Akira Dohi"}], "author_count": 2}, {"id": "2607.23331", "category": "hep-th", "title": "Effects of Curvature-Scalar Coupling on Vacuum Energy in Flat (3+1)-Dimensional Space-Time", "abstract": "We investigated how a magnetic topological defect affects the vacuum polarization of a charged massive scalar field in a flat $(3+1)$-dimensional space-time. The defect was modeled as an impenetrable to matter field finite-thickness tube with magnetic flux inside. We implemented the most general form of the Robin boundary condition on the surface of the magnetic tube, which enables a fully general analysis of the problem. We have found that in flat spacetime, the total vacuum energy generated by a magnetic topological defect depends on the curvature $\\xi$, except for special cases corresponding to the Dirichlet and Neumann boundary conditions. By contrast, when Robin's general boundary conditions are imposed, the induced vacuum energy acquires an explicit dependence on the curvature coupling $\\xi$, which is significant even in flat space-time. A detailed study of the dependence of the effect on the boundary condition parameter has been carried out. The obtained results highlight the nontrivial role played by boundary conditions in vacuum polarization phenomena.", "url": "https://arxiv.org/abs/2607.23331", "type": "理论", "summary": "1. 该工作研究了平坦(3+1)维时空中磁性拓扑缺陷对带电标量场真空极化的影响，并采用最一般Robin边界条件进行了全面分析。\n2. 主要发现是即使在平坦时空，真空能也依赖于曲率-标量耦合ξ，此效应在Dirichlet和Neumann边界条件时消失，而在一般Robin边界条件下显著显现。\n3. 这揭示了边界条件在真空极化现象中的非平凡作用，为理解拓扑缺陷与量子场耦合的机制提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Volodymyr Gorkavenko"}, {"name": "Oleh Barabash"}, {"name": "Pavlo Nakaznyi"}, {"name": "Mariia Tsarenkova"}, {"name": "Nazar Yakovenko"}, {"name": "Andrii Zaporozhchenko"}], "featured_authors": [{"name": "Volodymyr Gorkavenko"}, {"name": "Oleh Barabash"}, {"name": "Pavlo Nakaznyi"}, {"name": "Mariia Tsarenkova"}, {"name": "Nazar Yakovenko"}, {"name": "Andrii Zaporozhchenko"}], "author_count": 6}, {"id": "2607.23616", "category": "hep-th", "title": "Standard Model Effective Field Theory and Oscillons", "abstract": "We show that the inclusion of a dimension-six operator in the Higgs potential has a dramatic impact on the stability of oscillons in the $SU(2)$ bosonic sector of the Standard Model, extending their lifetime by orders of magnitude. This happens for the physical value of the ratio between the Higgs and W boson masses, $m_H/m_W=1.556$ and for the dimension-six operator $O_6 = (\\Phi^\\dagger \\Phi)^3$ whose coupling constant is below the current upper bound.", "url": "https://arxiv.org/abs/2607.23616", "type": "理论", "summary": "1. 该工作通过标准模型有效场论研究表明，Higgs势中的维度-6算符可显著延长SU(2)玻色子扇区振荡子的寿命达数个数量级。\n2. 其核心卖点在于，在物理质量比m_H/m_W=1.556及耦合常数低于当前实验上限时，该算符改变了振荡子的稳定机制。\n3. 这为早期宇宙非平衡动力学及高阶算符对振荡现象的影响提供了新的理论视角与实验探测方向。", "summary_source": "deepseek", "authors": [{"name": "Z. Drogosz"}, {"name": "E.I. Sfakianakis"}, {"name": "K. Slawinska"}, {"name": "A. Wereszczynski"}], "featured_authors": [{"name": "Z. Drogosz"}, {"name": "E.I. Sfakianakis"}, {"name": "K. Slawinska"}, {"name": "A. Wereszczynski"}], "author_count": 4}, {"id": "2607.23620", "category": "hep-th", "title": "$\\mathcal{N}=2$ supersymmetric Yang-Mills thermodynamics from effective field theory", "abstract": "We compute the weak-coupling free energy density of pure four-dimensional $\\mathcal{N}=2$ supersymmetric Yang-Mills (SYM) theory through second order in the 't Hooft coupling $\\lambda$ at finite temperature using effective-field-theory methods. The contribution from the hard scale $T$ is obtained from massless three-loop vacuum diagrams in the full theory, and that from the electric scale $\\sqrt{\\lambda}\\,T$ from a two-loop calculation in the dimensionally reduced three-dimensional effective theory. In contrast to $\\mathcal{N}=4$ SYM, the theory is asymptotically free: the coupling-renormalization counterterm, together with the EFT unit-operator counterterm, cancels all $1/\\epsilon$ poles. The remaining renormalization-scale dependence is fixed by the one-loop beta function. The expansion reproduces earlier results through order $\\lambda^{3/2}$, and the order-$\\lambda^2$ term is new.", "url": "https://arxiv.org/abs/2607.23620", "type": "理论", "summary": "1. 该工作利用有效场论方法计算了纯四维\\mathcal{N}=2超对称杨-米尔斯理论在有限温度下至't Hooft耦合\\lambda^2阶的弱耦合自由能密度。\n2. 其技术卖点在于通过三维降维有效理论分别处理硬标度T与电标度\\sqrt{\\lambda}\\,T的贡献，并借助渐近自由性质的重整化抵消消除所有极点。\n3. 这为检验\\mathcal{N}=2超对称非阿贝尔规范理论的热力学行为以及后续非微扰或输运研究提供了精确的微扰基准。", "summary_source": "deepseek", "authors": [{"name": "Ubaid Tantary"}, {"name": "Qianqian Du"}], "featured_authors": [{"name": "Ubaid Tantary"}, {"name": "Qianqian Du"}], "author_count": 2}, {"id": "2607.23659", "category": "hep-th", "title": "Stability and Chaotic Dynamics in a Nonlinearly Confined ghost-sector Hamiltonian", "abstract": "We investigate the nonlinear dynamics of a Hamiltonian system containing a ghost degree of freedom coupled to a canonical sector through nonlinear interactions. The model consists of one positive-energy and one negative-energy mode, augmented by quartic and sextic nonlinearities that regularize the large-amplitude behavior of the system. Unlike conventional ghost models, which typically exhibit runaway trajectories due to the indefinite nature of the kinetic energy, the present Hamiltonian possesses a confining nonlinear structure that renders the accessible energy surfaces compact for finite total energy. We derive the equations of motion and analyze the geometric properties of the Hamiltonian flow. Particular attention is devoted to the interplay between local ghost-induced instability and global nonlinear confinement. We show that the sextic contribution dominates the asymptotic dynamics and prevents escape to infinity despite the presence of a negative-energy sector. As a consequence, the model provides a controlled framework for studying bounded dynamics in ghost-coupled systems. The phase-space structure is investigated through numerical integration, Poincaré surfaces of section, and Lyapunov analysis. Depending on the interaction strength and nonlinear couplings, the system exhibits a transition from regular quasi-periodic motion to chaotic dynamics characterized by positive maximal Lyapunov exponents. Remarkably, chaotic trajectories remain confined within compact regions of phase space, yielding a realization of bounded chaotic motion in a ghost-containing Hamiltonian system. These results provide a concrete example of how nonlinear self-interactions can regularize ghost dynamics at the classical level and indicate a useful prototype for studying stability, confinement, and chaos in nonstandard Hamiltonian theories.", "url": "https://arxiv.org/abs/2607.23659", "type": "理论", "summary": "1. 该工作研究了一类包含鬼自由度的哈密顿系统，通过四次与六次非线性约束实现有界相空间动力学。\n2. 其技术关键在于六次非线性主导的渐近约束机制在局部鬼致不稳定性下仍能阻止系统逃逸，从而允许有界混沌运动的存在。\n3. 这为非标准哈密顿理论中利用非线性自相互作用正则化鬼动力学、研究经典稳定与混沌提供了可控范本。", "summary_source": "deepseek", "authors": [{"name": "Zahra Molaee"}, {"name": "Soleyman Fatholahzadeh"}], "featured_authors": [{"name": "Zahra Molaee"}, {"name": "Soleyman Fatholahzadeh"}], "author_count": 2}, {"id": "2607.23747", "category": "hep-th", "title": "Freezing Swampland: A Krylov Complexity Criterion for the Weak Gravity Conjecture", "abstract": "We propose a quantum-information-theoretic perspective on the Weak Gravity Conjecture through the behavior of Krylov spread complexity. For a charged thermofield double state holographically dual to an AdS Reissner--Nordström black hole, we show that the extremal limit on the black-hole side is accompanied by an effective freezing of Krylov spreading. In this regime, the return amplitude becomes effectively a pure phase, and the dual quantum state ceases to spread nontrivially in Krylov space. We then incorporate charged matter and study the effect of Schwinger pair production in the near-horizon region. Within this semiclassical near-extremal analysis, the frozen behavior is lifted once the discharge channel is opened, and the dynamics become nontrivial again. This suggests that the Weak Gravity Conjecture may admit a complexity-based interpretation in terms of the absence of exact freezing in the presence of an available discharge channel. More broadly, our results point to a new connection between the swampland program, black-hole physics, and quantum information theory.", "url": "https://arxiv.org/abs/2607.23747", "type": "理论", "summary": "1. 该工作基于Krylov展开复杂度为弱引力猜想提出了一个量子信息视角的判据。\n2. 其技术要点在于发现带电热场双态在极端黑洞极限下Krylov展开有效冻结，而近极端区域Schwinger对产生打开放电通道后冻结解除。\n3. 这暗示弱引力猜想可能源于复杂度意义下放电通道的存在性，为沼泽地计划、黑洞物理与量子信息理论建立了新联系。", "summary_source": "deepseek", "authors": [{"name": "Amin Faraji Astaneh"}, {"name": "Reza Ghomi Shurkaie"}], "featured_authors": [{"name": "Amin Faraji Astaneh"}, {"name": "Reza Ghomi Shurkaie"}], "author_count": 2}, {"id": "2607.23760", "category": "hep-th", "title": "The extremal Reissner-Nordström throat from non extremal near horizon expansions", "abstract": "The near horizon region of a non extremal black hole has a universal Rindler form, but the strict horizon limit is not an ordinary Lorentzian geometry. In the String Carroll expansion of this non extremal near horizon metric,the transverse angular directions form a base and the time-radial Rindler directions appear as a distinguished two-dimensional longitudinal sector fibered over this base. We study how this String Carroll expansion behaves for the Reissner-Nordström (RN) black hole as the extremal limit is approached, where the expected near horizon geometry is the Lorentzian $AdS_2 \\times S^2$ throat. We show that while for the four-dimensional non extremal RN geometry, the String Carroll expansion correctly captures the near horizon Rindler region, it is not sufficient to recover the extremal $AdS_2 \\times S^2$ throat. The reason is that the higher order terms, which are suppressed in the String Carroll expansion, become essential in the extremal limit. We show that in Eddington-Finkelstein coordinates, the required contribution appears at second order and restores the radial dependence needed for the $AdS_2$ geometry. The extremal $AdS_2 \\times S^2$ throat is then obtained as the zero-temperature limit of the scaled throat geometry. In static coordinates, the temporal sector of the extremal throat geometry can be obtained from a second order near horizon expansion, but the radial sector cannot be obtained from any finite order truncation and requires contributions from all orders in the near horizon expansion.", "url": "https://arxiv.org/abs/2607.23760", "type": "理论", "summary": "1. 该工作通过非极端Reissner-Nordström黑洞的近视界弦Carroll展开，研究其趋近极端极限时AdS₂×S²喉几何的恢复问题。\n2. 其核心发现是弦Carroll零阶展开仅捕获近视界Rindler区域，而极端AdS₂×S²喉需二阶及以上高阶项：在Eddington-Finkelstein坐标下二阶项恢复径向依赖，在静态坐标下径向扇区需所有阶展开。\n3. 这表明极端黑洞的渐近AdS₂几何不能由有限阶近视界展开完全描述，为理解极端极限与近视界展开的层级关系提供了严格约束。", "summary_source": "deepseek", "authors": [{"name": "Anirudhda Shinde"}, {"name": "Mangesh Mandlik"}], "featured_authors": [{"name": "Anirudhda Shinde"}, {"name": "Mangesh Mandlik"}], "author_count": 2}, {"id": "2607.24037", "category": "hep-th", "title": "R-Twisting, Fibered Knots, and Gauge Theories", "abstract": "We argue that R-twisting implies the Seiberg-Witten curves of 4d Argyres-Douglas theories could be combined with the R-twisted circle to form the mapping tori of torus knots, inspired by Milnor fibration theorem. Then 3d gauge theories labeled by mapping tori are generated, which in the IR capture 4d BPS spectrum and mutations. This construction addresses the boundary problem of the domain wall approach in \\cite{Cecotti:2011iy}. These 3d theories show a supersymmetry enhancement, and are related to 3d rank zero theories.", "url": "https://arxiv.org/abs/2607.24037", "type": "理论", "summary": "1. 该工作论证R-twisting将4d Argyres-Douglas理论的Seiberg-Witten曲线与R-twisted圆结合，构造环面结的映射环面。\n2. 其技术核心是生成标记映射环面的3d规范理论，红外捕获4d BPS谱与突变，并解决畴壁边值问题。\n3. 这些3d理论显现超对称增强且与秩零理论关联，为4d-3d对偶及BPS谱研究提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Shi Cheng"}], "featured_authors": [{"name": "Shi Cheng"}], "author_count": 1}, {"id": "2607.24242", "category": "hep-th", "title": "Light-like retarded correlators and the horizon", "abstract": "We show that retarded correlators in conformal field theories of scalar primary operators evaluated at finite temperature using $AdS/CFT$ scale anomalously at large light like momenta. The anomalous scaling depends on the curvature of the horizon. Setting the momenta equal to the frequency $\\omega$, the retarded correlator for black holes with planar horizons scales as $\\omega^{\\frac{2}{d+2} (2\\Delta - d) }$ as opposed to the scaling behaviour of $\\omega^{2\\Delta - d}$ expected by dimensional analysis at generic fixed momenta and large frequencies. $\\Delta$ is the dimension of the primary and $d$, the number of space-time dimensions. For black holes with spherical and hyperbolic horizons when the frequency squared equals the Casimir along the horizon, the retarded correlator scales as $\\omega^{\\frac{2\\Delta -d}{2} }$. We establish this using exact results in $d=2$, and a numerical analysis of the Heun equation for the $AdS_5$ planar black hole and finally using the WKB approximation in general $d$. The exact result for black holes with hyperbolic horizon as well as the analysis at large $d$ provides additional checks for the anomalous scaling behaviour. Finally we evaluate the anomalous scaling exponent for the stress tensor correlator in all its 3 channels.", "url": "https://arxiv.org/abs/2607.24242", "type": "理论", "summary": "1. 该工作利用AdS/CFT对偶，研究了有限温度下共形场论中标量初级算符的类光推迟关联函数，发现其在大类光动量下出现反常标度行为，且该标度依赖于黑洞视界曲率。\n2. 其核心在于通过精确求解（d=2）、数值分析AdS5平面黑洞的Heun方程及一般d下的WKB近似，揭示了标度指数由视界曲率与算符维度共同决定，并推广至应力张量关联函数的三个通道。\n3. 这为理解全息对偶中有限温度关联函数的非平庸标度行为提供了新机制，有助于探索强耦合系统中量子关联特性的全息描述。", "summary_source": "deepseek", "authors": [{"name": "Justin R. David"}, {"name": "Leonard Schwarze"}], "featured_authors": [{"name": "Justin R. David"}, {"name": "Leonard Schwarze"}], "author_count": 2}, {"id": "2607.24266", "category": "hep-th", "title": "Dynamical Quarks in the Ensemble of Center Vortices with Monopole Defects: Color Confinement Beyond External Probes", "abstract": "We consider the interaction of dynamical quarks with the ensemble of oriented and nonoriented center vortices proposed to describe flux-tube formation between quark probes in pure Yang-Mills theory. The quark sector is described in terms of bosonized color currents. Within this fluid-like framework, the infrared vortex--monopole condensate restricts finite-energy configurations to be color neutral. Furthermore, neutral distributions of constituent color densities embedded in the condensate generate frustrated regions, providing a mechanism for their localization into finite-size configurations. The resulting picture is consistent with lattice evidence indicating that center vortices play a central role in shaping the hadron spectrum.", "url": "https://arxiv.org/abs/2607.24266", "type": "理论", "summary": "1. 该工作将动力学夸克引入带单极缺陷的中心涡旋系综，通过玻色化色流描述夸克扇区，研究色禁闭机制。\n2. 其物理卖点在于揭示红外涡旋-单极凝聚体如何强制有限能量态色中性，并指出中性色密度分布在该凝聚体中形成受阻区域，导致局域化。\n3. 这为理解中心涡旋在强子谱塑造中的核心角色提供了超越外探针的动力学框架，与格点证据一致。", "summary_source": "deepseek", "authors": [{"name": "Luis E. Oxman"}], "featured_authors": [{"name": "Luis E. Oxman"}], "author_count": 1}, {"id": "2607.24342", "category": "hep-th", "title": "General Properties of the Thermo-Metric for CV event manifolds and the magnetization combinatorial scheme", "abstract": "Following previous results recently obtained by us, on Information Geometry versus Geometrical Thermodynamics and on the exact calculation of partition functions for extended Souriau Gibbs distributions on Calabi Vesentini manifolds, we study the differential geometry of the corresponding thermo-metrics. A general intriguing scheme is discovered and put into evidence. A small yet significant difference, distinguishes the even from the odd dimensional instance of the microscopic CV manifolds. Apart from that the complete thermo-space is flat when no constraint is introduced. Freezing the magnetic fields, which can be done according to complicated combinatorials, forces the thermo-system to evolve on curved submanifolds of the thermo--space that have a structure depending only on the length of the $n-1$ chain of frozen contiguous magnetic fields. The behavior of Riemann tensor components for such spaces is codified by a symmetric matrix with peculiar behavior along special symmetrically arranged submanifolds that, might be responsible for the generation of curvature walls and for the categorical partitioning of the thermo space. The embedding of this curved submanifold into $\\mathbb{R}^{2n-1}$ can be traced back to the vanishing of magnetic fields and, in this case, the flat metric on $\\mathbb{R}^{2n-1}$ is the $\\mathfrak{a}_{2n-1}$ simple Lie algebra Cartan matrix. In another version the flat embedding reveals the geometric interpretation of the $n$-manifold as a generalized translation hypersurface. The boundary at infinity has a hypercube structure whose face central points and vertices appear, numerically, to be the end-points of all geodesics depending only on their angular slope at the start. This general feature is reminiscent of the causal structure at infinity of Lorentzian space-times and of Penrose diagrams.", "url": "https://arxiv.org/abs/2607.24342", "type": "理论", "summary": "1. 该工作研究了Calabi-Vesentini流形上热力学位形空间中热度量的微分几何性质。\n2. 关键发现是：无约束时热空间平坦；冻结磁场导致弯曲子流形，其曲率由对称矩阵编码，并嵌入为简单李代数Cartan矩阵或广义平移超曲面。\n3. 这揭示了热空间边界具有超立方体结构与类Penrose图因果形态，为热力学几何的范畴化分区和因果结构提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Pietro Fre"}, {"name": "Alexander S. Sorin"}, {"name": "Mario Trigiante"}], "featured_authors": [{"name": "Pietro Fre"}, {"name": "Alexander S. Sorin"}, {"name": "Mario Trigiante"}], "author_count": 3}, {"id": "2607.24477", "category": "hep-th", "title": "Supersymmetric Moduli Space and Vacua with Vector Fields in $D=4$ Gauged $\\mathcal{N}=8$ Supergravity", "abstract": "When fermions are taken to be anti-periodic along a spacelike $S^1$ in $AdS_4$, certain ground states of the supergravity theory are described by AdS-soliton-like spacetimes. We study these geometries within the purely dilatonic STU model obtained from the compactification of M-theory on $S^7$ in the presence of non-trivial gauge fields. The resulting configurations define a rich family of everywhere regular supersymmetric vacua that holographically describe strongly coupled ``confining'' gauge theories in three dimensions. We provide a complete characterization of the moduli space of supersymmetric solutions in terms of the vacuum expectation values of the dimension-one operators of the truncation.", "url": "https://arxiv.org/abs/2607.24477", "type": "理论", "summary": "1. 该工作从M理论在S⁷上紧致化的STU模型中构造了带规范场的AdS孤子型超对称真空，并完整刻画了其模空间。\n2. 卖点在于这些处处正则的超对称解全息对应三维强耦合禁闭规范理论，且模空间由截断中维数一算子的真空期望值完全参数化。\n3. 这为从超引力研究全息禁闭以及规范理论真空的几何起源提供了明确的模空间框架。", "summary_source": "deepseek", "authors": [{"name": "Andrés Anabalón"}, {"name": "Stefano Maurelli"}, {"name": "Marcelo Oyarzo"}, {"name": "Mario Trigiante"}], "featured_authors": [{"name": "Andrés Anabalón"}, {"name": "Stefano Maurelli"}, {"name": "Marcelo Oyarzo"}, {"name": "Mario Trigiante"}], "author_count": 4}, {"id": "2607.24499", "category": "hep-th", "title": "Spin-resolved double-trace thermal coefficients in holography", "abstract": "It was previously shown that the stress-tensor sector of the OPE, together with the KMS condition, fixes holographic thermal two-point functions at vanishing spatial separation. We extend this construction to nonzero spatial separation, where the KMS condition leaves a residual ambiguity that depends only on the spatial separation. We show that this ambiguity is fixed by the zero-frequency bulk wave equation, which can be solved analytically in terms of Heun functions. This gives an efficient method for computing thermal coefficients of double-trace operators resolved by spin. We also study the Lorentzian analytic structure of the resulting correlator and show that complex bulk-cone singularities which appear at spacelike separation in the stress-tensor sector do not persist in the full two-point function; they are resolved by the double-trace contribution.", "url": "https://arxiv.org/abs/2607.24499", "type": "理论", "summary": "1. 该工作将全息热两点函数从零空间分离推广至非零空间分离，通过零频率体波动方程解析求解（Heun函数）消除KMS条件所留歧义，计算了自旋分辨的双迹算符热系数。\n2. 技术核心在于利用Heun函数解析固定空间分离依赖的残余自由度，并揭示完整关联函数的洛伦兹解析结构，证明体锥奇点被双迹贡献消解。\n3. 这为全息框架下自旋分辨输运系数的计算提供了高效解析方法，并阐明双迹算符对奇点结构的物理约化机制。", "summary_source": "deepseek", "authors": [{"name": "Ilija Burić"}, {"name": "Ivan Gusev"}, {"name": "Andrei Parnachev"}], "featured_authors": [{"name": "Ilija Burić"}, {"name": "Ivan Gusev"}, {"name": "Andrei Parnachev"}], "author_count": 3}, {"id": "2607.24576", "category": "hep-th", "title": "Near-Light-Cone Nonhydrodynamic Structure from Boosted Hydrodynamics", "abstract": "Hydrodynamics provides a universal description of many-body systems at long wavelengths. Its long-lived collective excitations, known as hydrodynamic modes, admit long-wavelength expansions whose convergence is encoded in the analytic structure of retarded correlators of conserved quantities in thermal equilibrium. We show that a boost can change which nonhydrodynamic singularity limits such an expansion. At large boost, the relevant singularity originates in the large-momentum, near-light-cone region of the rest-frame spectrum. After removing the Lorentz-factor growth, the rescaled convergence scale is controlled by the microscopic spectral structure of the theory. We explicitly demonstrate this in two examples: relaxation-time kinetic theory and holography.", "url": "https://arxiv.org/abs/2607.24576", "type": "理论", "summary": "1. 本工作通过分析相对论性流体力学在有限动量下的解析结构，发现升速会改变限制长波展开的非流体动力学奇点。\n2. 其核心在于指出大升速下该奇点源于静止系谱函数中的近光锥区域，且标度化后的收敛尺度由微观谱结构控制。\n3. 这揭示了升速如何将流体力学有效性的边界推向微观动力学，并已在弛豫时间动力学与全息对偶中具体验证。", "summary_source": "deepseek", "authors": [{"name": "Navid Abbasi"}, {"name": "Jewel Kumar Ghosh"}, {"name": "Dirk H. Rischke"}], "featured_authors": [{"name": "Navid Abbasi"}, {"name": "Jewel Kumar Ghosh"}, {"name": "Dirk H. Rischke"}], "author_count": 3}, {"id": "2607.24632", "category": "hep-th", "title": "Krylov complexity and spectral density of BMN matrix model", "abstract": "We use Krylov complexity as a typical diagnostic of quantum many body dynamics in the context of BMN matrix model at large mass gap. We calculate several physical entities, for example, the moments and return amplitudes at large mass deformation. We calculate them for both spread complexity of states as well as Krylov growth of operators in the matrix model. We propose a general expression for the moments at any given order $n$. We also discuss orthogonal polynomials for spread as well as operator Krylov complexity. In the context of the Krylov operator growth we further compute the spectral function and the density of states. A careful analysis of the spectral function near the resonance reveals various IR divergences in addition to the physical collective modes. These collective modes appear to be exceptionally stable due to large mass gap. On the other hand, the UV of the theory appears to be extremely damped due to higher scattering rates. We carefully diagnose these IR divergences near resonance which reveals that these collective modes are in fact non-propagating and should be thought of as diffusion modes or relaxation modes with infinite relaxation time. We also calculate the Krylov variance and Krylov entropy for the matrix model and in particular at early time. The linear early time growth of the Krylov entropy confirms the onset of quantum chaos in the matrix model at large mass gap.", "url": "https://arxiv.org/abs/2607.24632", "type": "理论", "summary": "1. 该工作以Krylov复杂度为诊断，研究了大质量间隙下BMN矩阵模型的量子多体动力学，计算了矩、返回振幅及算符与态的Krylov增长。\n2. 其关键发现在于谱函数共振附近的红外发散揭示集体模实为非传播扩散模（无限弛豫时间），且早期Krylov熵线性增长证实量子混沌。\n3. 这为利用Krylov复杂度识别矩阵模型中的非传播模及量化混沌动力学提供了明确框架，尤其适用于大质量间隙系统。", "summary_source": "deepseek", "authors": [{"name": "Dibakar Roychowdhury"}], "featured_authors": [{"name": "Dibakar Roychowdhury"}], "author_count": 1}, {"id": "2607.23041", "category": "math-ph", "title": "Nonlocal Cubic Density Gibbs Measures from Bosonic Gibbs States with Three-Body Interactions", "abstract": "We study the high-temperature mean-field limit of grand-canonical bosonic Gibbs states on the torus with renormalized nonlocal three-body interactions. In dimensions two and three, we construct the limiting nonlinear classical Gibbs measure and prove convergence of the relative free energy and of the reduced density matrices of every fixed order; in three dimensions, a smallness condition on the interaction is imposed. The proof combines the density-channel representation of the interaction with a coherent-state variational method based on the upper-symbol representation of the free Gibbs state. The same framework also contains, as a special case, the homogeneous positive-type model studied by Lewin, Nam, and Rougerie (2021).", "url": "https://arxiv.org/abs/2607.23041", "type": "理论", "summary": "1. 该工作在高温度平均场极限下，从环面上具有重整化非局域三体相互作用的巨正则玻色子吉布斯态出发，构造了非线性经典吉布斯测度并证明了相对自由能与任意阶约化密度矩阵的收敛性。\n2. 其技术核心在于将相互作用的密度通道表示与自由吉布斯态的上符号相干态变分方法相结合，在二维和三维中完成构造且在三维中需小条件，同时将均匀正定型推广为特例。\n3. 这为具有三体相互作用的玻色子体系到非局域经典统计力学的桥梁提供了严格框架，并启发了高温平均场极限下多体量子-经典对应的一般证明路径。", "summary_source": "deepseek", "authors": [{"name": "Hao Liang"}], "featured_authors": [{"name": "Hao Liang"}], "author_count": 1}, {"id": "2607.23084", "category": "math-ph", "title": "$\\mathcal{P}(Φ)_2$ Theory from many-body quantum Gibbs states", "abstract": "We derive the $\\mathcal{P}(\\Phi)_2$ measure on the two-dimensional unit torus as the rigorous limit of many-body quantum Gibbs states. In particular, the quantum model corresponding to the $\\Phi^{2p}_2$ measure is formulated in the grand-canonical ensemble with a general symmetric $p$-body interaction potential which is not required to have a factorized form. Unlike in the $\\Phi^4_2$ case investigated by Fröhlich--Knowles--Schlein--Sohinger in \\cite{FKSS25}, in the treatment of higher-order interactions, Wick renormalization generates a full hierarchy of lower-order interactions which we organize systematically using a graphical formalism. One key ingredient of our analysis is a logarithmic stability estimate for both the nonlocal Hartree functional and the many-body Hamiltonian that is uniform in the interaction range, allowing us to use the positivity of the leading $p$-body interaction to control all lower-order terms generated by the Wick counterterms.", "url": "https://arxiv.org/abs/2607.23084", "type": "理论", "summary": "1. 该工作从多体量子Gibbs态严格推导出二维环面上$\\mathcal{P}(\\Phi)_2$测度。\n2. 通过图形形式化系统组织高阶Wick重整化产生的层级低阶相互作用，并利用对数稳定性估计统一控制反项。\n3. 这为严格构造更多非高斯量子场论模型提供了系统化的分析框架与图形方法。", "summary_source": "deepseek", "authors": [{"name": "Phan Thành Nam"}, {"name": "Zhilin Yang"}, {"name": "Xiangchan Zhu"}], "featured_authors": [{"name": "Phan Thành Nam"}, {"name": "Zhilin Yang"}, {"name": "Xiangchan Zhu"}], "author_count": 3}, {"id": "2607.23151", "category": "math-ph", "title": "Explicit higher order rational rogue waves of the nonlinear Schrödinger equation", "abstract": "The $N$-th order rational rogue wave of the nonlinear Schrödinger equation (NLS), which depends on $2 N-2$ real parameters, has been shown to be impossible to generate by the nonlinear superposition formula. We here generate this sequence by a three-term recurrence relation, each step only requiring the computation of three $N-1$-th order determinants of $2 N-2$ variables, while the previous method requires two determinants of order $2 N$ in $2 N$ variables. This allows us to obtain explicitly the seventh wave with its six arbitrary complex parameters. These very compact expressions open the possibility to investigate the possible existence of new patterns in addition to the already observed ones (concentric rings, polygonal configurations, \\dots).", "url": "https://arxiv.org/abs/2607.23151", "type": "理论", "summary": "1. 该工作通过三项递推关系显式生成了非线性薛定谔方程的N阶有理怪波序列，每个步骤仅需计算三个N-1阶行列式。\n2. 其技术优势在于将先前方法所需的两个2N阶行列式计算简化为低阶行列式，从而首次得到含六个任意复参数的第七阶怪波解析表达式。\n3. 这些紧凑表达式为探索除同心环、多边形构型外的新图案提供了可能，并启发了其他可积系统中高怪波结构的生成策略。", "summary_source": "deepseek", "authors": [{"name": "Robert Conte"}, {"name": "ENS Paris-Saclay"}, {"name": "University of Hong Kong"}], "featured_authors": [{"name": "Robert Conte"}, {"name": "ENS Paris-Saclay"}, {"name": "University of Hong Kong"}], "author_count": 3}, {"id": "2607.23864", "category": "math-ph", "title": "Localization of quantum systems at Liouville tori", "abstract": "We consider a collection of pairwise commuting quantum observables in the setting of Berezin--Toeplitz quantization of a closed Kähler manifold and assume that the Arnold--Liouville theorem applies to their principal symbols. We use joint eigensections of these observables to define isometric embeddings of the quantum spaces into $L^2(\\Lambda_{a_0})$, where $\\Lambda_{a_0}$ is a fixed Liouville torus. These embeddings allow a broad class of quantum observables, including some defined by discontinuous functions, to be realized as sequences of operators on $L^2(\\Lambda_{a_0})$ that converge strongly to multiplication operators. We discuss the spectral implications of this convergence and give applications to contractions of Lie algebra representations and to pairs of spectral projections of quantum observables.", "url": "https://arxiv.org/abs/2607.23864", "type": "理论", "summary": "1. 该工作利用闭凯勒流形上交换量子观测值的联合本征截面，将量子空间等距嵌入固定Liouville环面的L²空间。\n2. 其技术核心在于通过嵌入将含不连续函数在内的大类量子观测值实现为L²环面上强收敛于乘法算子的算子序列。\n3. 这一收敛的谱分析为李代数表示收缩及量子观测值谱投影对的交叉关系提供了明确推导路径。", "summary_source": "deepseek", "authors": [{"name": "Ood Shabtai"}], "featured_authors": [{"name": "Ood Shabtai"}], "author_count": 1}, {"id": "2607.23873", "category": "math-ph", "title": "A phase transition for the hard sphere model on the hyperbolic plane", "abstract": "The hard sphere model is a classical model from statistical physics in which particles are represented by equal-sized spheres. Longstanding predictions from the physics literature indicate that in $\\mathbb{R}^2$ and $\\mathbb{R}^3$ the system undergoes a phase transition, but it remains a major open problem to confirm this. We prove the existence of a phase transition for this model in the hyperbolic plane.", "url": "https://arxiv.org/abs/2607.23873", "type": "理论", "summary": "1. 该工作针对硬球模型这一经典统计物理系统，在双曲平面上严格证明了其在足够高的密度下存在从无序流体到有序晶体的相变，解决了该模型在平坦空间中长期悬而未决的严格证明难题。\n2. 其技术突破在于利用双曲几何的负曲率导致的位形空间指数膨胀，有效压制熵效应，使得硬球系统的长程有序在有限密度下稳定存在，从而实现了相变存在性的严格数学推导。\n3. 这一结果不仅为非欧几何中统计力学相变理论提供了首个严格范例，也为曲率调控物质相行为在引力系统或凝聚态物理中的潜在应用提供了重要理论启发。", "summary_source": "deepseek", "authors": [{"name": "Lewis Bowen"}, {"name": "Marcus Michelen"}, {"name": "Will Perkins"}], "featured_authors": [{"name": "Lewis Bowen"}, {"name": "Marcus Michelen"}, {"name": "Will Perkins"}], "author_count": 3}, {"id": "2607.24060", "category": "math-ph", "title": "Local Weyl law and length-minimising loops on hyperbolic surfaces", "abstract": "We study the variance of a local Weyl law over a fixed smooth energy window, when averaged over large Weil--Petersson hyperbolic surfaces. Our results are consistent with the predictions of Berry's random wave model. Our approach allows to explicitly integrate certain test functions which depend on lengths of based geodesic loops, and relate them to the associated lengths of the closed geodesics in their free-homotopy class. We thus utilise the work of Mirzakhani, with exact stationary phase arguments, to identify correct main and error terms, making explicit the asymptotic behaviour of the variance of the local Weyl law. Furthermore, we introduce the geometric notion of length-minimising geodesic loops and sequences, based at a point. We prove a complete characterisation of the topology of these, namely that they are simple. This forms a key ingredient in our study, and yields a new streamlined argument to bound the contributions of remainder terms which depend on lengths of pairs of different short primitive geodesic loops. To illustrate the generality of our results, we further introduce a family of \"exploring\" loops based at a point, which might be of independent interest.", "url": "https://arxiv.org/abs/2607.24060", "type": "理论", "summary": "1. 该工作分析了在Weil–Petersson双曲曲面系综上平均时固定能量窗口内局部Weyl定律的方差，确认其渐近行为与Berry随机波模型预言一致。\n2. 其技术核心在于将方差表达式与基于点的测地线环长度关联，利用Mirzakhani积分与精确驻相法识别主项，并通过证明长度最小化环必为简单环来精确控制剩余项。\n3. 所引入的“探索”环族为双曲曲面上的量子混沌与谱统计研究提供了新工具，该方法有望推广至其他几何随机系综。", "summary_source": "deepseek", "authors": [{"name": "Daniel Meriaz"}], "featured_authors": [{"name": "Daniel Meriaz"}], "author_count": 1}, {"id": "2607.24188", "category": "math-ph", "title": "A doubled Gordon threshold for palindromic quasiperiodic Schrödinger operators", "abstract": "We consider one-frequency quasiperiodic Schrödinger operators \\[ (H_{v,\\alpha,\\theta}u)(n) = u(n+1)+u(n-1) + v(\\theta+n\\alpha)u(n) \\] acting on $\\ell^2(\\mathbb Z)$, where $\\alpha\\notin\\mathbb Q$ and $v\\in C^2(\\mathbb T,\\mathbb R)$ is an even function. We develop a new Gordon-type method that exploits approximate repetitions and palindromic symmetries simultaneously. Denote by $L(E)$ the Lyapunov exponent and let \\[\\beta(\\alpha) = \\limsup_{|k|\\to\\infty} -\\frac{\\log\\|k\\alpha\\|_{\\mathbb R/\\mathbb Z}}{|k|}. \\] We prove that, for every completely resonant phase $2\\theta\\in\\alpha\\mathbb Z+\\mathbb Z$, $E$ cannot be an eigenvalue if $L(E)<2\\beta(\\alpha)$. As an application, consider the almost Mathieu operator \\[ (H_{\\lambda,\\alpha,\\theta}u)(n) = u(n+1)+u(n-1) + 2\\lambda\\cos\\bigl(2\\pi(\\theta+n\\alpha)\\bigr)u(n). \\] We show that if $2\\theta\\in\\alpha\\mathbb Z+\\mathbb Z$ and $1<|\\lambda|<e^{2\\beta(\\alpha)}$, then $H_{\\lambda,\\alpha,\\theta}$ has purely singular continuous spectrum. This resolves the remaining absence-of-eigenvalues part of a conjecture of Avila and Jitomirskaya concerning the sharp spectral transition for completely resonant phases.", "url": "https://arxiv.org/abs/2607.24188", "type": "理论", "summary": "1. 该工作针对回文型拟周期薛定谔算子，发展了一种同时利用近似重复与回文对称性的Gordon型方法，证明了当Lyapunov指数低于2β(α)时完全共振相位处不存在特征值。\n2. 其技术核心是将Gordon阈值从通常的β(α)翻倍至2β(α)，并借此严格导出几乎Mathieu算子在耦合常数1<|λ|<e^{2β(α)}区间内的纯奇异连续谱。\n3. 这解决了Avila-Jitomirskaya关于完全共振相位谱跃迁猜想的剩余无特征值部分，并展示了系统对称性对Gordon方法判定能力的显著增强。", "summary_source": "deepseek", "authors": [{"name": "Wencai Liu"}], "featured_authors": [{"name": "Wencai Liu"}], "author_count": 1}, {"id": "2607.24238", "category": "math-ph", "title": "Milnor metric for Morse--Smale flows from field theory", "abstract": "We study the partition function of Abelian $BF$ theory with an axial gauge fixing condition given by a Morse--Smale vector field, and we show that it recovers the Milnor metric on the determinant line on the twisted cohomology of the manifold. To do this we use the Batalin--Vilkovisky formalism and, in particular, a BV pushforward to cohomology in two steps. In this context, the Milnor metric serves as the generalisation of the Ruelle dynamical zeta function evaluated at zero for systems containing both closed orbits and critical points. This, together with a classic result due to Schwarz on the partition function of $BF$ theory in the Lorenz gauge, provides a field-theoretic realisation of Fried's conjecture, which is true for Morse--Smale flows.", "url": "https://arxiv.org/abs/2607.24238", "type": "理论", "summary": "1. 该工作通过研究阿贝尔BF理论在Morse–Smale向量场所给轴向规范固定条件下的配分函数，证明了其恢复流形扭曲上同调行列式线上的Milnor度量。\n2. 其核心在于运用BV形式主义实施两步推向上同调操作，使Milnor度量作为包含闭轨道与临界点的Ruelle动力系统zeta函数在零点处的推广出现。\n3. 该结果结合Schwarz关于洛伦兹规范BF理论配分函数的经典工作，为Morse–Smale流实现了Fried猜想的场论证明，统一了动力系统zeta函数与拓扑场论解析扭变。", "summary_source": "deepseek", "authors": [{"name": "Giovanni Molinari"}, {"name": "Michele Schiavina"}], "featured_authors": [{"name": "Giovanni Molinari"}, {"name": "Michele Schiavina"}], "author_count": 2}, {"id": "2607.24530", "category": "math-ph", "title": "A turning point principle for liquid Lane-Emden stars", "abstract": "Upon fixing the adiabatic index, the spherically symmetric liquid Lane-Emden stars governed by the Euler-Poisson system with a \"stiffened gas\" equation of state $p=\\rho^\\gamma-1$ form a one-parameter family, naturally parametrised by the central density $\\kappa=\\bar\\rho_\\kappa(0)\\in(1,\\infty)$. In contrast to the gaseous case, the liquid free boundary breaks the self-similarity of the family and bends the mass-radius curve, creating extrema of the mass when $\\gamma<2(d-1)/d$. We formulate a turning point principle in the spirit of Zel'dovich, Wheeler and Thorne, and of its rigorous relativistic counterpart from the works of Hadžić, Lin and Rein: the number of radial growing modes equals the negative Morse index of the linearised operator, is locally constant along the family, and can change only at the turning points of the mass-radius curve, the bending orientation there dictating whether a growing mode is gained or lost. We describe the large central density limit in which the gaseous tail (read off from a planar dynamical system) determines whether the mass-radius curve spirals, and hence whether the number of growing modes remains bounded or tends to infinity. As corollaries we recover and sharpen the known radial (in)stability results for liquid Lane-Emden stars and, in combination with existing non-radial analysis, obtain a turning point criterion for non-radial stability.", "url": "https://arxiv.org/abs/2607.24530", "type": "理论", "summary": "1. 该工作针对具有硬化气体状态方程的流体Lane-Emden星，通过中心密度参数化单参数族，研究其径向稳定性与质量-半径曲线极值点的关系。\n2. 核心在于建立了严格的转折点原理：径向增长模的数量等于线性化算子的负Morse指数，仅在质量-半径曲线的转折点处改变，且弯曲方向决定模的得失。\n3. 该原理为流体星径向与非径向稳定性分析提供了统一判据，并揭示大中心密度极限下质量-半径曲线螺旋行为与增长模数目有界或无穷的关联。", "summary_source": "deepseek", "authors": [{"name": "King Ming Lam"}], "featured_authors": [{"name": "King Ming Lam"}], "author_count": 1}, {"id": "2607.22810", "category": "quant-ph", "title": "Wigner negativity and stellar rank for SU(1,1) states", "abstract": "Quasiprobability distributions for systems endowed with SU(1,1) dynamical symmetry have received surprisingly little attention, despite the central role of this symmetry in two-photon physics, squeezed states, and nonlinear interferometry. Here, we fill this gap by constructing a full covariant family of $s$-ordered quasiprobability distributions defined on the two-sheeted hyperboloid, or equivalently, on the Poincaré unit disk via stereographic projection. A key result is that the Wigner function is strictly positive for all Perelomov SU(1,1) coherent states, in sharp contrast to the SU(2) case. This positivity endows Wigner negativity with an unambiguous operational meaning: any negative volume is a direct signature of genuinely quantum behavior. We further examine the stellar rank of SU(1,1) states, defined through the zeros of the Husimi $Q$-function, and show how it compares with Wigner negativity as a geometry-adapted witness of nonclassicality in this setting. We further introduce a hierarchy of generalized multipoles through a harmonic expansion of the density operator on the hyperboloid, providing a complementary framework for probing quantumness. This offers a comprehensive toolkit for characterizing and quantifying quantum resources in SU(1,1) systems.", "url": "https://arxiv.org/abs/2607.22810", "type": "理论", "summary": "1. 该工作为SU(1,1)动力学对称系统构建了双叶双曲面上的s-有序准概率分布族，并定义了其Wigner负性和恒星秩。\n2. 关键物理卖点是证明所有Perelomov SU(1,1)相干态的Wigner函数严格为正，与SU(2)情形形成鲜明对比，从而赋予Wigner负体积以直接标志量子行为的操作意义。\n3. 该工作通过几何适配的非经典性判据及广义多极展开，为表征和量化SU(1,1)系统中的量子资源提供了完整工具箱，可启发非线性干涉仪等平台的研究。", "summary_source": "deepseek", "authors": [{"name": "A. B. Klimov"}, {"name": "A. Muñoz"}, {"name": "F. Leuchs"}, {"name": "J.-P. Gazeau"}, {"name": "L. L. Sanchez-Soto"}], "featured_authors": [{"name": "A. B. Klimov"}, {"name": "A. Muñoz"}, {"name": "F. Leuchs"}, {"name": "J.-P. Gazeau"}, {"name": "L. L. Sanchez-Soto"}], "author_count": 5}, {"id": "2607.22818", "category": "quant-ph", "title": "Practical advantage beyond the quadratic speedup limit with fully-quantum walks", "abstract": "We introduce a new class of fully-quantum Metropolis walks in which both the proposal and acceptance steps are intrinsically quantum. Unlike standard quantum walks obtained by quantizing classically efficient Markov chains, our algorithm employs Hamiltonian simulation as a quantum-na
