  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;

    }
    * { box-sizing: border-box; }
    body {
      margin: 0;

      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }

    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }

    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }

    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }

    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2607.22730", "category": "cond-mat", "title": "Fourth-order closure obstruction and chiral nonlocality in circular kinetic magnetotransport", "abstract": "Closing an angular moment hierarchy at the stress level omits a definite back-action from higher Fermi-surface harmonics. For a circular two-dimensional Fermi surface, streaming changes angular momentum by one, so the shortest omitted sequence, $1\\!\\to\\!2\\!\\to\\!3\\!\\to\\!2\\!\\to\\!1$, adds a fourth-order term to the current eigenvalue, $\\Lambda(q)=\\gamma_1+\\nu q^2-\\kappa_4q^4+\\cdots$, with $\\nu=v_F^2/(4\\gamma_2)$ and $\\kappa_4=\\nu^2/\\gamma_3$. We call this missing operator term the fourth-order closure obstruction. Its gradient expansion is controlled when $\\nu q^2/\\gamma_3\\ll1$. Circular symmetry carries the same coefficient into a radial bi-Laplacian within each conserved angular-momentum block, and retaining $m=3$ exactly, without a gradient expansion, amplifies higher radial modes monotonically. At zero field, positive collision rates exclude real-wave-number poles and response zeros; an equal-rate tail gives a square-root completion. A magnetic field makes the coefficient chiral, produces a Hall sign reversal, and enhances it when the $m=3$ harmonic is long lived. In the collisionless high-field limit, the complete hierarchy becomes a Bessel pole--zero ladder, while finite closures form rational approximants to it. The result separates a controlled low-gradient coefficient from its geometry- and field-dependent finite-wave-number completion.", "url": "https://arxiv.org/abs/2607.22730", "type": "理论", "summary": "1. 该工作研究了圆对称二维费米面上角动量层级在应力闭合时产生的高阶谐波反作用，导出了电流本征值的四阶项κ₄q⁴并定义为四阶闭合阻碍。\n2. 其物理卖点在于梯度展开受控条件νq²/γ₃≪1，圆对称将同一系数映射到径向双拉普拉斯算符，磁场则引入手征性、霍尔符号反转并增强效应。\n3. 该结果分离了受控低梯度系数与几何及场依赖的有限波数完成，为理解无碰撞极限下的Bessel极零梯级及有限闭合的有理逼近提供了框架。", "summary_source": "deepseek", "authors": [{"name": "P. Shubham Parashar"}], "featured_authors": [{"name": "P. Shubham Parashar"}], "author_count": 1}, {"id": "2607.22742", "category": "cond-mat", "title": "Statistical Mechanics of Thermal Diffusion in Rough Energy Landscapes", "abstract": "Starting from a variational principle for mass transport, we present a broadly applicable statistical framework describing thermal diffusion in complex solids. We show that microscopic thermodynamic and kinetic fluctuations govern non-Arrhenius diffusion, with kinetic terms described by machine-learnable relative diffusion contributions. For vacancy diffusion in solid solutions, deviation from Arrheniusness may occur when ordering effects start to become important but at higher temperatures, approximately Arrhenius behavior can occur, aided by configurational entropy and competing energy fluctuations.", "url": "https://arxiv.org/abs/2607.22742", "type": "数值", "summary": "1. 该工作基于质量输运变分原理，构建了描述粗糙能量景观中复杂固体热扩散的统计力学框架。\n2. 其核心在于揭示微观热力学与动力学涨落对非Arrhenius扩散的支配作用，且动力学项可由机器学习获取的相对扩散贡献描述。\n3. 该框架为理解固溶体空位扩散中偏离或恢复Arrhenius行为的竞争机制提供了理论工具，并启发了扩散系数的数据驱动预测路径。", "summary_source": "deepseek", "authors": [{"name": "Soham Chattopadhyay"}, {"name": "Blas P. Uberuaga"}], "featured_authors": [{"name": "Soham Chattopadhyay"}, {"name": "Blas P. Uberuaga"}], "author_count": 2}, {"id": "2607.22831", "category": "cond-mat", "title": "New class of exactly flat topological bands - compact localised states protected by local graph topology", "abstract": "Strongly correlated quantum matter is fundamentally defined by the tension between non-commuting quantum operators. Hamiltonians exhibiting macroscopic degeneracies are of general interest in this field because they imply an infinite susceptibility to any non-commuting perturbation. In moiré heterostructures, engineering such extensive degeneracies in the kinetic Hamiltonian creates a fertile garden for exotic strongly correlated phases of matter to emerge from the resulting flat bands. Here, we introduce a prescription to construct an infinite family of exact flat band Hamiltonians supported on the faces of arbitrary graphs. We demonstrate this algorithm on the faces of four Bravais lattices. Using a discrete graph generalization of the Atiyah-Singer index theorem, we prove that the extensive degeneracies of such face-graph Hamiltonians are protected by the local topology of the face-graph connectivity. The resulting macroscopic null spaces yield compact localised states that remain localised over time due to frustration in hopping pathways. We discuss the broad implications of such non-dispersing quantum modes in diverse settings, from arrested dynamics in quantum networks and quantum machine learning algorithms to Majorana-free topological quantum computation.", "url": "https://arxiv.org/abs/2607.22831", "type": "理论+数值", "summary": "1. 该工作提出一种在任意图结构的面格点上构造精确平带哈密顿量的统一方案，生成由局域图拓扑保护的压缩局域态。\n2. 其核心技术突破在于利用离散图版本的阿蒂亚-辛格指标定理，严格证明平带简并性源于面图连通性的局部拓扑不变性，而非晶格对称性。\n3. 这为量子网络中的动力学冻结、量子机器学习中的非色散模式设计以及无需马约拉纳的拓扑量子计算提供了可扩展的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Tamaghna Hazra"}], "featured_authors": [{"name": "Tamaghna Hazra"}], "author_count": 1}, {"id": "2607.22901", "category": "cond-mat", "title": "Bimodal colloids highlight the structural mirror of rigidity percolation and yielding", "abstract": "In metastable particulate gels, it is tempting to believe that the dynamic similarities between the fluid-to-solid non-linear phase transition of rigidity percolation and the solid-to-fluid transition that occurs during yielding represent mirror images of the same continuous process. Even though these behaviors are clearly dynamically similar, their multi-scale nature makes it difficult to determine if they could also follow a unified structural pathway. We know from model monodisperse colloidal gels that both yielding and the elastic modulus seem to be heavily influenced by a small subset of topologically distinct singly-connected bridges linking mesoscale features. Here we use particle simulations to examine the participation of different classes of particle-level bonds and their contributions to the bulk mechanical response. We find that rigidity is disproportionately supported by singly connected intercluster bridges, whereas yielding localizes at bonds with high edge-betweenness centrality (EBC); strikingly, these independently identified populations substantially overlap and perform comparable mechanical roles. Bimodality exposes this correspondence by concentrating large-particle contacts in both populations, thereby providing a compositional label for the common backbone. Thus, rigidity and yielding are opposing mechanical manifestations of the same mesoscale structure: the intercluster bottlenecks that establish rigidity are also the sites at which rigidity is preferentially lost.", "url": "https://arxiv.org/abs/2607.22901", "type": "理论+数值", "summary": "1. 该工作通过双峰胶体粒子模拟，揭示了刚性渗流与屈服在结构上互为镜像——两者共享相同的介观瓶颈骨架。\n2. 其核心卖点在于发现单连接桥与高边介数中心性键在机械贡献上高度重叠，双峰组分直接标记了这一共同结构。\n3. 这为统一理解颗粒凝胶的线性和非线性力学响应提供了结构基础，并启发了利用组分设计调控流变行为的策略。", "summary_source": "deepseek", "authors": [{"name": "Robert A. Campbell"}, {"name": "Ziye Zhuang"}, {"name": "Ali Mohraz"}, {"name": "Safa Jamali"}], "featured_authors": [{"name": "Robert A. Campbell"}, {"name": "Ziye Zhuang"}, {"name": "Ali Mohraz"}, {"name": "Safa Jamali"}], "author_count": 4}, {"id": "2607.22933", "category": "cond-mat", "title": "Emergent integrable dynamics in a non-integrable Rydberg-atom chain", "abstract": "We show that integrable and non-integrable dynamics can coexist in the same Rydberg-atom chain, depending on the initial state in which the system is prepared. In the setting we consider, Rydberg atoms mainly experience an effective dipolar interaction and, within the nearest-neighbor approximation, their dynamics can be mapped onto an effective integrable Fermi gas with ballistic transport. The inclusion of longer-range couplings, however, is essential for the theory to be predictive; those terms break the conservation laws associated with integrability, enabling, in particular, the emergence of genuine diffusive transport. We study the dynamics generated by a bipartition protocol and reveal a sharp qualitative change in behavior as the particle density is varied, suggesting the possibility of accessing weaker and stronger integrability breaking dynamics in the same Hamiltonian depending on the relevance of local interactions. We propose a theoretical mechanism that accounts for the differences. Our findings provide clear and concrete evidence that integrability breaking is not solely a property of the Hamiltonian and of the magnitude of the couplings that break integrability, but also of the state in which the system is prepared.", "url": "https://arxiv.org/abs/2607.22933", "type": "理论", "summary": "1. 该工作通过二分协议研究非可积里德伯原子链，展示了可积与不可积动力学依据初始态共存的明确证据。\n2. 其核心在于最近邻近似下映射为可积费米气体，而长程耦合破坏可积性并导致粒子密度依赖的弹道到扩散输运转变。\n3. 这证实可积性破缺不仅取决于哈密顿量，更依赖于初始态中局域相互作用的重要性，为可积性破缺的态依赖性提供了物理解释。", "summary_source": "deepseek", "authors": [{"name": "Gianluca Morettini"}, {"name": "Luca Capizzi"}, {"name": "Leonardo Mazza"}, {"name": "Maurizio Fagotti"}], "featured_authors": [{"name": "Gianluca Morettini"}, {"name": "Luca Capizzi"}, {"name": "Leonardo Mazza"}, {"name": "Maurizio Fagotti"}], "author_count": 4}, {"id": "2607.22942", "category": "cond-mat", "title": "Single crystal growth, structural and magnetic properties of CeZn$_{2-x}$Ga$_{2+x}$", "abstract": "The tetragonal BaAl$_4$ ($I4/mmm$) parent structure underpins a diverse family of materials exhibiting novel phenomena, including nematic superconductivity, topological semimetallicity, and heavy fermion behavior. The recent growth of ternary R-Zn-Ga compounds, such as the previously reported CeZn$_2$Ga$_2$, has explored some of the members exhibiting rare-earth magnetism within this family. In this paper, we report on the structural and magnetic properties of single crystals of CeZn$_{2-x}$Ga$_{2+x}$, a Ga-rich analogue of CeZn$_2$Ga$_2$. Our CeZn$_{2-x}$Ga$_{2+x}$ samples exhibit magnetic properties distinct from the paramagnetic behavior previously reported for CeZn$_2$Ga$_2$. We observe a magnetic transition around 4 K, pronounced metamagnetic states at low temperatures, and strong magnetic anisotropy. Though there are batch-to-batch variations that suggest a strong sensitivity to local structural imperfections, we consistently see the presence of magnetic transitions and metamagnetic states in our crystals. To investigate the local structural sensitivity hypothesis, we performed Reverse Monte Carlo analysis of collected powder neutron diffraction data, revealing the presence of significant local crystallographic disorder of the magnetic Ce site. Our findings demonstrate that the positional disorder drives competing ferromagnetic and antiferromagnetic correlations that lead to the observed spin glass behavior and complex anisotropic magnetism. This study illustrates that tuning the local crystallographic disorder enables engineering frustrated magnetic states in BaAl$_4$-type and similar intermetallic structures.", "url": "https://arxiv.org/abs/2607.22942", "type": "理论+数值", "summary": "1. 该工作生长了CeZn$_{2-x}$Ga$_{2+x}$单晶，并表征其结构及磁性，观察到约4 K的磁转变、低温变磁性态与强磁各向异性。\n2. 通过反向蒙地卡罗分析粉末中子衍射数据，揭示Ce位置显著的局部晶格无序驱动了铁磁与反铁磁关联的竞争，导致自旋玻璃行为。\n3. 该结果说明调节局部晶格无序可在BaAl$_4$型及类似金属间化合物中工程设计阻挫磁态。", "summary_source": "deepseek", "authors": [{"name": "Danila Sokratov"}, {"name": "H. Cein Mandujano"}, {"name": "Ram Kumar"}, {"name": "Jared Z. Dans"}, {"name": "Phineas Sobel"}, {"name": "Nicholas A. Crombie"}, {"name": "Alicia Manjón-Sanz"}, {"name": "Danielle R. Yahne"}, {"name": "Philip Piccoli"}, {"name": "Peter Y. Zavalij"}, {"name": "Efrain E. Rodriguez"}, {"name": "Johnpierre Paglione"}], "featured_authors": [{"name": "Danila Sokratov"}, {"name": "H. Cein Mandujano"}, {"name": "Ram Kumar"}, {"name": "Peter Y. Zavalij"}, {"name": "Efrain E. Rodriguez"}, {"name": "Johnpierre Paglione"}], "author_count": 12}, {"id": "2607.22976", "category": "cond-mat", "title": "Spectral Topology and Non-Bloch Band Theory for Domain-Wall Systems", "abstract": "We study the spectral topology of one-dimensional non-Hermitian models in a domain-wall configuration, where different domains are arranged in a ring geometry. While eigenstates can localize near an interface under the non-Hermitian skin effect, we show that the localization of an eigenstate originates from the difference in the spectral winding numbers, with respect to the corresponding eigenenergy, between the two adjacent domains. We then obtain the conditions for the generalized Brillouin zone (GBZ) in the complex momentum space, by extending the Ronkin-function formalism to the domain-wall configuration. In addition to the conventional skin modes that correspond to standing waves on individual domains under the open boundary condition, a unique type of traveling-wave-like skin modes emerges, whose construction involves all domains. Besides their difference in the spatial profiles, these two types of modes obey distinct GBZ conditions, making them differentiable on the GBZ. Interestingly, the traveling-wave-like modes further carry a finite flux spectral winding number, indicating their boundary sensitivity.", "url": "https://arxiv.org/abs/2607.22976", "type": "理论", "summary": "1. 该工作研究了一维非厄米模型在畴壁构型中的谱拓扑与非布洛赫能带理论。\n2. 其核心在于揭示本征态在界面局域化源于相邻畴谱缠绕数差异，并推广Ronkin函数得到广义布里渊区条件，进而发现行波型趋肤模式及其有限通量谱缠绕数。\n3. 这为非厄米畴壁系统中边界敏感性与模式分类提供了明确的理论框架与可验证的谱拓扑判据。", "summary_source": "deepseek", "authors": [{"name": "Mingtao Xu"}, {"name": "Rui Wang"}, {"name": "Tian-Shu Deng"}, {"name": "Wei Yi"}], "featured_authors": [{"name": "Mingtao Xu"}, {"name": "Rui Wang"}, {"name": "Tian-Shu Deng"}, {"name": "Wei Yi"}], "author_count": 4}, {"id": "2607.22978", "category": "cond-mat", "title": "Response Morphologies of a Canonical Fluctuation Diagnostic Across Ehrenfest Phase Transitions", "abstract": "Microcanonical inflection-point analysis identifies MIPA-type higher-order transition structures from derivatives of the microcanonical entropy. Until recently, however, there was no canonical formulation for probing the corresponding fluctuation-level behavior directly from measurable energy fluctuations without reconstructing the density of states. Previous work addressed this limitation by introducing a canonical fluctuation diagnostic that quantifies energy-fluctuation asymmetry. Here, we investigate how this diagnostic behaves across representative first-, second-, and third-order phase transitions in the Ehrenfest classification. We consider the eight-state Potts model, the two-dimensional Ising model, and ideal three-dimensional Bose--Einstein condensation. The Potts and Ising systems exhibit a robust paired-extremum structure of the diagnostic near their respective transition regions, whereas ideal Bose--Einstein condensation exhibits a discontinuous response at the condensation temperature in the thermodynamic limit. These results show that a single fluctuation-based observable can display qualitatively distinct response morphologies across thermodynamic regimes, reflecting sensitivity to the nature of the underlying phase transition rather than serving as a direct classifier of Ehrenfest order.", "url": "https://arxiv.org/abs/2607.22978", "type": "理论", "summary": "1. 本文研究了能量涨落不对称性诊断量在Ehrenfest一级、二级与三级相变中的响应形态，涵盖八态Potts模型、二维Ising模型及理想三维玻色-爱因斯坦凝聚。\n2. 其技术核心在于通过直接测量能量涨落而不重构态密度，揭示Potts与Ising体系中的鲁棒双极值结构，以及BEC在热力学极限下的不连续响应。\n3. 这一结果表明单一涨落可观测量对相变本质敏感，但并非Ehrenfest阶次的直接分类器，为涨落诊断的普适应用提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Fangfang Wang"}, {"name": "Wei Liu"}, {"name": "Ying Tang"}, {"name": "Zengru Di"}], "featured_authors": [{"name": "Fangfang Wang"}, {"name": "Wei Liu"}, {"name": "Ying Tang"}, {"name": "Zengru Di"}], "author_count": 4}, {"id": "2607.23003", "category": "cond-mat", "title": "Uncertainty-quantified $J$-integral computation for quasicontinuum and finite element methods", "abstract": "The $J$-integral is a fundamental concept in fracture mechanics, quantifying the energy release rate that drives crack propagation. While extensively implemented in finite element (FE) codes and adapted for atomistic calculations, its application within multiscale frameworks bridging atomistic and continuum formulations remains unexplored. This work presents a rigorous implementation and validation of the $J$-integral within the three-dimensional quasicontinuum (QC3D) method, computed under plane strain assumptions, using continuum fields (stress, strain energy density) derived from the interatomic potential via the Cauchy-Born rule. The implementation is validated against linear elastic fracture mechanics (LEFM) theory and the virtual crack extension (VCE) method across three regimes: (1) small-strain linear elasticity, with a prescribed anisotropic $K$-field displacement applied throughout; (2) the same field evaluated through the nonlinear Cauchy-Born constitutive relation, without atomic relaxation; and (3) the same relation with atomic relaxation enabled, allowing the crack-tip region to equilibrate. Excellent agreement is shown throughout. We further introduce a Markov chain Monte Carlo framework to statistically quantify the uncertainty of $J$-integral results for a given mesh and integration domain, applicable to conventional FE methods as well. Predictive capability is demonstrated via a QC3D simulation of a three-point bending test of silicon, where the computed critical energy release rate agrees closely with the Griffith criterion. This work establishes a reliable framework for evaluating crack driving forces in multiscale fracture simulations with quantified uncertainty, enabling large-scale fracture simulations while resolving atomistic mechanisms at the crack tip.", "url": "https://arxiv.org/abs/2607.23003", "type": "理论+数值", "summary": "1. 该工作将J积分严谨实现于三维准连续体方法中，并在线弹性、非线性本构及原子弛豫三种情形下基于平面应变假设完成验证。\n2. 其技术亮点在于引入马尔可夫链蒙特卡洛框架对给定网格与积分域下的J积分结果进行统计不确定性量化，且可推广至传统有限元方法。\n3. 这为多尺度断裂模拟中裂纹驱动力评估提供了具量化不确定性的可靠框架，有望在大尺度计算中同时解析裂尖原子机制。", "summary_source": "deepseek", "authors": [{"name": "Sai Harshith Badi"}, {"name": "Stephen M. Whalen"}, {"name": "Ronald E. Miller"}, {"name": "Ellad B. Tadmor"}], "featured_authors": [{"name": "Sai Harshith Badi"}, {"name": "Stephen M. Whalen"}, {"name": "Ronald E. Miller"}, {"name": "Ellad B. Tadmor"}], "author_count": 4}, {"id": "2607.23056", "category": "cond-mat", "title": "Evolution of the electronic and superconducting properties of Re-based quinary high-entropy alloys under chemical and physical pressure", "abstract": "We report a comparative study of chemical- and physical-pressure effects on the electronic and superconducting properties of the Re-based quinary high-entropy alloys (HEAs) [Nb0.67-xRex][TiZrHf]0.33 (x = 0.10, 0.20, and 0.56). Increasing Re concentration suppresses the superconducting transition temperature Tc from 5.4 to 3.9 K while producing positive, composition-dependent cocktail-effect ratios. Field-dependent transport and magnetization establish all three compositions as strongly type-II superconductors and identify x = 0.20 as the most distinctive composition, with the largest upper critical field and Ginzburg-Landau parameter and a Maki parameter close to unity. Most importantly, the pressure coefficient of Tc changes sign across the bcc-hcp structural change: dTc/dP is positive for the bcc x = 0.10 and 0.20 samples, with values of approximately 0.018 and 0.053 K/GPa, respectively, but negative for the hcp x = 0.56 sample, with a value of approximately -0.033 K/GPa. This systematic contrast within a single chemically related alloy series establishes a robust structure-associated superconducting response and identifies crystal structure as a key organizing variable under compression. Metallic transport and superconductivity remain robust up to approximately 8 GPa in all three compositions. These results reveal that chemical substitution and hydrostatic compression are complementary but nonequivalent routes for tuning superconductivity in Re-based HEAs.", "url": "https://arxiv.org/abs/2607.23056", "type": "理论", "summary": "1. 该工作对比研究了化学替代与静水压缩对Re基五元高熵合金超导电性的影响，发现增加Re浓度抑制Tc并产生组成依赖的正鸡尾酒效应比。\n2. 关键卖点在于超导转变温度的压力系数随bcc-hcp结构转变改变符号，bcc相为正、hcp相为负，揭示了结构相关的超导响应。\n3. 这表明在同类合金体系中晶体结构是调控超导的关键变量，化学与物理压力是互补但不等效的调控途径。", "summary_source": "deepseek", "authors": [{"name": "Thiagarajan Maran"}, {"name": "Yoshiya Uwatoko"}, {"name": "Sathea Suweatha M N"}, {"name": "Sonika Jangid"}, {"name": "R.P. Singh"}, {"name": "Arumugam Sonachalam"}, {"name": "Sathiskumar Mariappan"}], "featured_authors": [{"name": "Thiagarajan Maran"}, {"name": "Yoshiya Uwatoko"}, {"name": "Sathea Suweatha M N"}, {"name": "R.P. Singh"}, {"name": "Arumugam Sonachalam"}, {"name": "Sathiskumar Mariappan"}], "author_count": 7}, {"id": "2607.23103", "category": "cond-mat", "title": "Janus-induced atomic reconstruction amplifies twist-angle modulation of interlayer thermal transport in moiré bilayers", "abstract": "In two-dimensional moiré bilayers, atomic reconstruction, the spontaneous structural relaxation toward energy-minimizing stacking registries in the near-commensurate regime, can strongly modify local stacking and interlayer coupling, providing a possibility to significantly control phonon-mediated properties. Here we show that the twist-angle dependence of interlayer thermal conductance can be modified by introducing Janus-induced mirror-symmetry breaking into bilayer MoS2. The intrinsic out-of-plane dipole in MoSSe/MoS2 bilayers leads to frictionless interface, and reduces the lattice deformation energy, thereby promoting atomic-reconstruction into locally distorted aperiodic moiré patterns. These features weaken interlayer coupling and suppress phonon transmission across the interface, leading to an anomalously strong twist-angle dependence of thermal conductance, with a pronounced minimum at small twist angles and a reduction rate nearly one order of magnitude larger than that of twisted bilayer MoS2. Our results demonstrate that interlayer thermal transport is modified by atomic reconstruction, highlighting Janus-induced mirror-symmetry breaking as an effective way to promoting phonon engineering in two-dimensional moiré structures.", "url": "https://arxiv.org/abs/2607.23103", "type": "理论", "summary": "1. 该工作通过引入Janus诱导的镜像对称破缺，在MoSSe/MoS₂双层畴界中促进原子重构，从而增强层间热导率随扭角的变化调制。\n2. 其物理核心在于Janus面外偶极子产生无摩擦界面并降低变形能，使小扭角区热导出现显著最小值且下降幅度比扭转双层MoS₂大近一个数量级。\n3. 这一结果揭示了原子重构可有效调控二维莫尔超晶格中的声子输运，为基于镜像对称破缺的声子工程提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Bin Xu"}, {"name": "Rulei Guo"}, {"name": "Jie Sun"}, {"name": "Hiroo Suzuki"}, {"name": "Takuma Yoshida"}, {"name": "Ichiro Nakaya"}, {"name": "Koki Sawasaki"}, {"name": "Yasuhiko Hayashi"}, {"name": "Shohei Chiashi"}, {"name": "Tomoki Machida"}, {"name": "Junichiro Shiomi"}], "featured_authors": [{"name": "Bin Xu"}, {"name": "Rulei Guo"}, {"name": "Jie Sun"}, {"name": "Shohei Chiashi"}, {"name": "Tomoki Machida"}, {"name": "Junichiro Shiomi"}], "author_count": 11}, {"id": "2607.23127", "category": "cond-mat", "title": "Quantum fluctuation-driven transport crossover between two liquid states in distinguishable helium-4", "abstract": "We show the emergence of a quantum fluctuation-driven transport crossover between two liquid states in distinguishable helium-4 obeying Boltzmann statistics, in the absence of atomic exchange. Using path integral centroid molecular dynamics simulations over 0.1-3.3 K and 1-60 bar, we investigate the transport properties of two distinct liquid states: the low quantum-dispersion liquid (LQDL) and the high quantum-dispersion liquid (HQDL). While LQDL exhibits conventional liquid behavior consistent with the Stokes-Einstein (SE) relation, HQDL emerges at lower temperatures and displays anomalous gas-like transport characterized by superdiffusion and ultralow viscosity, accompanied by a breakdown of the SE relation. This counterintuitive emergence of gas-like dynamics upon cooling reflects the dominant role of nuclear quantum fluctuations, in contrast to thermal fluctuations at higher temperatures. Across the LQDL-HQDL boundary, we identify a transport crossover marked by a qualitative change in the velocity autocorrelation function (VAF), a transition in the Prandtl number, and the emergence of transport minima in shear and kinematic viscosities, thermal conductivity, and thermal diffusivity. These minima reflect a crossover from liquid-like to gas-like transport upon cooling in the low-temperature subcritical region, in addition to the universal transport minima observed in the supercritical regime. The transition from oscillatory to monotonic VAF defines a second Frenkel line, distinct from the conventional Frenkel line observed in the supercritical region. LQDL is a heat-transport-dominated dissipative fluid, whereas HQDL is a momentum-dominated inertial fluid. These results demonstrate that nuclear quantum fluctuations alone induce gas-like liquid behavior and provide a unified picture of transport phenomena in distinguishable helium-4 without superfluidity.", "url": "https://arxiv.org/abs/2607.23127", "type": "理论+数值", "summary": "1. 该工作通过路径积分质心分子动力学模拟，研究了可区分氦-4中低量子色散液态与高量子色散液态之间的量子涨落驱动输运交叉。\n2. 其核心发现是低温高量子色散液态呈现反常气体状输运（超扩散、超低粘度），伴随斯托克斯-爱因斯坦关系失效，且速度自相关函数由振荡型转为单调型定义了第二弗伦克尔线。\n3. 这揭示了核量子涨落可独立诱导类气体液态行为，为无超流条件下输运现象的普适图像提供了统一框架。", "summary_source": "deepseek", "authors": [{"name": "Mika Tanabe"}, {"name": "Momoko Tsujimoto"}, {"name": "Kenichi Kinugawa"}], "featured_authors": [{"name": "Mika Tanabe"}, {"name": "Momoko Tsujimoto"}, {"name": "Kenichi Kinugawa"}], "author_count": 3}, {"id": "2607.23164", "category": "cond-mat", "title": "Active flows drive anchoring of nematics at rigid walls", "abstract": "Although confinement strongly influences flows in active materials, it remains unclear how active particles align at rigid boundaries when no thermodynamic anchoring is imposed. We address this question using continuum simulations of active nematics, together with analytical arguments based on a reduced near-wall description. In the flow-tumbling regime, extensile systems align parallel to the boundary, whereas contractile systems align perpendicular to it, consistent with active anchoring observed at active-passive interfaces. In the flow-aligning regime, the preferred orientation depends on the sign of activity and of the flow aligning parameter: either the shear-like flow generated near the wall selects the Leslie angle, or no unique alignment is established. These results provide a unified framework for activity-induced anchoring at rigid walls, demonstrating that boundary alignment in dense active matter can emerge solely from the interplay between self-generated flows and orientational dynamics.", "url": "https://arxiv.org/abs/2607.23164", "type": "理论+数值", "summary": "1. 该工作通过连续模拟和近壁约化解析，研究了无热力学锚定时主动向列相在刚性壁处的取向行为。\n2. 其卖点在揭示流动翻滚区伸张系统平行、收缩系统垂直排列，流动取向区取向由Leslie角或活性及参数决定。\n3. 这提供了活动诱导锚定的统一框架，表明边界排列可仅源于自生流与取向动力学的耦合。", "summary_source": "deepseek", "authors": [{"name": "Michael Fang"}, {"name": "Ioannis Hadjifrangiskou"}, {"name": "Sumesh P. Thampi"}, {"name": "Julia M. Yeomans"}, {"name": "Jan Rozman"}], "featured_authors": [{"name": "Michael Fang"}, {"name": "Ioannis Hadjifrangiskou"}, {"name": "Sumesh P. Thampi"}, {"name": "Julia M. Yeomans"}, {"name": "Jan Rozman"}], "author_count": 5}, {"id": "2607.23173", "category": "cond-mat", "title": "Field-tuned incommensurate fan phase in an Ising-like triangular antiferromagnet", "abstract": "Using single-crystal neutron diffraction we report the observation of a field-tuned incommensurate phase in a field range just below magnetization saturation in the Ising-like triangular-lattice antiferromagnet Na$_2$BaCo(PO$_4$)$_2$. This phase occurs for magnetic fields applied along the Ising axis and exhibits an in-plane incommensurate propagation vector that moves along the hexagonal Brillouin zone boundary upon varying field, challenging the simple $XXZ$ antiferromagnetic description of the system. Within a semiclassical framework, we successfully identify this pre-saturation phase as a coplanar fan phase and study the role of dipole-dipole interactions and bond-dependent exchange anisotropy in its stabilization mechanism. We additionally present a minimal exchange model including interlayer couplings, which reproduces the complex magnetic phase diagram in field including the observed field-dependence of the incommensurate propagation vector in the fan phase.", "url": "https://arxiv.org/abs/2607.23173", "type": "理论+数值", "summary": "1. 该工作利用单晶中子衍射，在三角晶格反铁磁体Na₂BaCo(PO₄)₂中沿Ising轴加磁场的条件下，观测到磁化饱和前存在磁场调制的非公度相，并基于半经典框架将其识别为共面扇形相。\n2. 该非公度相的面内传播矢量随磁场增强沿六方布里渊区边界移动，挑战了简单XXZ模型描述，且偶极相互作用与键依赖交换各向异性是其稳定机制的核心。\n3. 包含层间耦合的最小交换模型成功再现了该体系完整的磁场-温度相图及非公度矢量的场依赖性，为三角晶格阻挫反铁磁体中多体磁序的精确理论提供了实验基准。", "summary_source": "deepseek", "authors": [{"name": "D. Flavián"}, {"name": "R. Okuma"}, {"name": "P. Manuel"}, {"name": "Q. Huang"}, {"name": "H. Zhou"}, {"name": "R. Coldea"}], "featured_authors": [{"name": "D. Flavián"}, {"name": "R. Okuma"}, {"name": "P. Manuel"}, {"name": "Q. Huang"}, {"name": "H. Zhou"}, {"name": "R. Coldea"}], "author_count": 6}, {"id": "2607.23180", "category": "cond-mat", "title": "Generalized Bloch-like ground states in distinct electron-site configurations derived from the same quasiperiodic structure", "abstract": "Sutherland-Kalugin-Katz (SKK) states have been proposed as generalized Bloch-like states in quasiperiodic systems where the absence of translational symmetry prevents the application of Bloch's theorem. However, previous studies have largely relied on ansatz-based arguments, and a systematic procedure for constructing the SKK state from a specified Hamiltonian has remained unclear. In this work, we develop a constructive approach based on a generalized Fourier transform of creation operators in tight-binding models. We then apply this framework to vertex and dual models on the Ammann-Beenker (AB) tiling that stem from the same quasiperiodicity but differ in their electron-site configurations. Our construction reproduces the previously reported SKK state in the ground state of the vertex model and reveals a corresponding SKK state in the ground state of the dual model with high fidelity. The structural correspondence between the two SKK states indicates that such states are not tied to a particular choice of electron sites and reflect the underlying quasiperiodicity of the AB tiling.", "url": "https://arxiv.org/abs/2607.23180", "type": "理论", "summary": "1. 本文发展了一种基于产生算符广义傅里叶变换的构造方法，从紧束缚哈密顿量系统构建Sutherland-Kalugin-Katz（SKK）态，并应用于Ammann-Beenker铺砌的顶点与对偶模型。\n2. 该方法无需预设假设，成功再现顶点模型基态中的已知SKK态，并在对偶模型基态中发现具有高保真度的对应SKK态。\n3. 两类SKK态的结构对应表明，此类广义Bloch态并非由特定电子位点配置决定，而是根植于准周期铺砌的底层准周期性。", "summary_source": "deepseek", "authors": [{"name": "Yuki Yamamoto"}, {"name": "Nayuta Takemori"}], "featured_authors": [{"name": "Yuki Yamamoto"}, {"name": "Nayuta Takemori"}], "author_count": 2}, {"id": "2607.23221", "category": "cond-mat", "title": "Chiral Dynamics of an Intruder across Dilute and Hydrodynamic Regimes", "abstract": "We introduce and simulate an analytically tractable model for an intruder of arbitrary shape in a nonequilibrium bath, with chirality originating from the bath, the intruder, or their coupling. In the dilute regime, a Langevin description derived from a Boltzmann-Lorentz equation shows how intruder geometry governs ratchet effects and odd response. In the dense regime, the dynamics of the intruder are instead governed by the hydrodynamic modes of the bath and edge currents, which are described by a Stokes equation including a chiral torque density. Our results link shape to chiral transport and show that odd response arises from distinct mechanisms in the dilute and dense limits.", "url": "https://arxiv.org/abs/2607.23221", "type": "理论", "summary": "1. 该工作引入了一个可解析求解的侵入者模型，研究稀薄与稠密非平衡浴中的手性动力学。\n2. 其卖点在于通过玻尔兹曼-洛伦兹方程和含手性扭矩密度的斯托克斯方程，分别揭示稀薄和稠密极限下几何驱动的棘轮效应与奇响应的不同机制。\n3. 这为连接侵入者形状与手性输运行为提供了理论框架，并为设计非平衡浴中手性响应实验指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Raphaël Maire"}, {"name": "Ignacio Pagonabarraga"}], "featured_authors": [{"name": "Raphaël Maire"}, {"name": "Ignacio Pagonabarraga"}], "author_count": 2}, {"id": "2607.23223", "category": "cond-mat", "title": "Kinetic and Hydrodynamic Theories of Chiral Intruder Dynamics in Nonequilibrium Baths", "abstract": "We study the chiral dynamics of an intruder immersed in a nonequilibrium bath in two complementary limits: the dilute kinetic regime and the dense hydrodynamic regime. In the dilute limit, starting from a Boltzmann-Lorentz description, we derive an effective Langevin equation whose coefficients are given explicitly by geometry-dependent boundary integrals. This formulation separates the effects of intruder-shape chirality from those of chiral intruder-bath interactions. We find that the chiral interactions generate an odd response and a torque, whereas the chirality of the intruder leads to a ratchet effect. We also show that fluctuation-dissipation-like relations exist and that certain symmetry-allowed couplings vanish in the dilute regime. In the dense regime, we argue that intruder dynamics are governed primarily by bath hydrodynamics and torque-density-driven edge currents not captured by the previous framework. These currents can generate both an antisymmetric drag and a curvature-induced torque, leading to an antisymmetric response when inertia is accounted for. Taken together, these results provide a step toward understanding the mechanisms governing the chiral dynamics of an intruder in a nonequilibrium bath across different scales.", "url": "https://arxiv.org/abs/2607.23223", "type": "理论", "summary": "1. 该工作分别在稀薄动理学与稠密流体力学极限下理论研究了非平衡浴中手性入侵者的动力学行为。\n2. 其物理卖点在于稀薄极限从Boltzmann-Lorentz方程导出有效Langevin方程，分离形状手性与手性相互作用效应，揭示棘轮效应与奇响应扭矩，并指出稠密极限下扭矩密度驱动边缘电流产生反对称拖曳与曲率诱导的惯性反对称响应。\n3. 这为跨尺度理解非平衡浴中手性动力学提供了统一理论框架，并启示了涨落-耗散关系及对称允许耦合在稀薄极限下的消失等普适性特征。", "summary_source": "deepseek", "authors": [{"name": "Raphaël Maire"}, {"name": "Ignacio Pagonabarraga"}], "featured_authors": [{"name": "Raphaël Maire"}, {"name": "Ignacio Pagonabarraga"}], "author_count": 2}, {"id": "2607.23252", "category": "cond-mat", "title": "Current- and field-driven domain wall dynamics and chirality switching in a planar helimagnet", "abstract": "We study the effect of electric current and magnetic field on the dynamics of chirality in a helimagnet with a strong easy-plane anisotropy. Using a continuum theory, derived for a quasi-one-dimensional frustrated ferromagnet close to the Lifshitz point, we show that a domain wall connecting domains with opposite chiralities can be driven by the current via the dissipative (non-adiabatic) component of the spin-transfer torque. Further, it is demonstrated that the adiabatic part of the torque in the presence of a magnetic field breaks the symmetry of the effective magnetic potential energy with respect to the chirality. We show that the leading symmetry-breaking term arises in the third order in the magnetization gradient, and derive the conditions of the chirality switching. Our conclusions are supported by numerical spin-lattice simulations.", "url": "https://arxiv.org/abs/2607.23252", "type": "理论+数值", "summary": "1. 该工作通过连续场理论研究强易面螺旋磁体中电流与磁场驱动的畴壁动力学及手性翻转。\n2. 关键发现在于非绝热自旋转矩驱动畴壁运动，且磁场下绝热项通过磁化梯度的三阶项破缺手性对称性。\n3. 这为手性翻转条件的确定及自旋电子学中手性操控提供了理论依据与数值验证。", "summary_source": "deepseek", "authors": [{"name": "Roman Teslia"}, {"name": "Oleksiy Kolezhuk"}], "featured_authors": [{"name": "Roman Teslia"}, {"name": "Oleksiy Kolezhuk"}], "author_count": 2}, {"id": "2607.23259", "category": "cond-mat", "title": "Microphase Separation in Quorum-Sensing Active Particles with Competing Interactions", "abstract": "Standard quorum-sensing models in active matter exhibit collective phenomena such as motility-induced phase separation. Here, we show that incorporating competing sensing ranges-- a minimal ingredient inspired by microbial communication --qualitatively changes this behavior, replacing macroscopic phase separation with self-organized microphases characterized by an emergent finite length scale. Starting from the microscopic dynamics, we derive a coarse-grained field theory whose coefficients are explicitly related to the moments of the microscopic sensing function. This mapping enables a direct comparison between particle-based simulations and continuum theory, allowing the characteristic modulation and correlation lengths to be predicted directly from the microscopic interaction parameters. Two-dimensional numerical simulations confirm these predictions and reveal a transition from macrophase separation to finite-wavelength density modulations as the competition between sensing scales increases. For stronger competing interactions, the system develops a peculiar cluster phase with an interstitial percolating network, which is captured by a higher-order gradient expansion. Our results identify competing quorum-sensing interactions as a simple microscopic mechanism for generating tunable active microphases.", "url": "https://arxiv.org/abs/2607.23259", "type": "理论+数值", "summary": "1. 该工作通过引入竞争感知范围，揭示了活性粒子系统从宏观相分离到自组织微相分离的转变。\n2. 其卖点在于从微观动力学推导出粗粒化场论，系数直接关联感知函数矩，实现从微观参数预测特征调制与关联长度。\n3. 这为设计具有可调有限波长的活性微相提供了简单微观机制，并可推广至其他非平衡多体系统。", "summary_source": "deepseek", "authors": [{"name": "Michele Antonioli"}, {"name": "Nicoletta Gnan"}, {"name": "Claudio Maggi"}], "featured_authors": [{"name": "Michele Antonioli"}, {"name": "Nicoletta Gnan"}, {"name": "Claudio Maggi"}], "author_count": 3}, {"id": "2607.23383", "category": "cond-mat", "title": "Fermi-level mediated acceleration of flash sintering of oxide ceramics", "abstract": "The atomistic understanding of flash sintering (FS) remains speculative, despite its efficiency and versatility in materials processing. Employing first-principles calculations we demonstrate how charge compensation of a range of defects in the prototypical Y-stabilized cubic ZrO$_2$ (YSZ) shifts Fermi level E$_F$ up during FS, thereby accelerating cation migration for fast mass transport. The charge transition of Zr vacancy, V$_{Zr}^q$, reduces its bulk diffusion barrier in V$_{Zr}^{-4}$ during flash by 2 eV, relative to V$_{Zr}^0$ before flash, which is triggered by the charge equilibrium of nonstoichiometric defects. The substituent defect Y$_{Zr}$, released by annihilating O vacancy, V$_O$, in Y$_{Zr}$V$_O$Y$_{Zr}$ defect complex, acts as electron acceptor and favors V$_{Zr}^0$ before flash whereas excess V$_O$, as electron donor thermally generated at the FS onset, upshift E$_F$ and thus support V$_{Zr}^{-4}$. The proposed mechanism of Fermi-level mediated cation diffusion for YSZ is generalized to other flash-sintered ceramics and has considerable bearing on the general theory of FS techniques in oxide ceramics.", "url": "https://arxiv.org/abs/2607.23383", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算揭示了氧化物陶瓷闪烧中费米能级介导阳离子加速迁移的微观机制。\n2. 其核心在于闪烧起始时热生成氧空位作为电子施主使费米能级上移，将锆空位从V\\(_{Zr}^0\\)转变为V\\(_{Zr}^{-4}\\)，使扩散势垒降低约2 eV。\n3. 该费米能级介导的阳离子扩散机制可推广至其他闪烧氧化物陶瓷，为建立闪烧技术的普适理论提供了关键启发。", "summary_source": "deepseek", "authors": [{"name": "Qin-Kun Li"}, {"name": "Evgeni S. Penev"}, {"name": "Boris I. Yakobson"}], "featured_authors": [{"name": "Qin-Kun Li"}, {"name": "Evgeni S. Penev"}, {"name": "Boris I. Yakobson"}], "author_count": 3}, {"id": "2607.23392", "category": "cond-mat", "title": "Hyperdeterminant wavefunctions", "abstract": "We systematically introduce hyperdeterminant wavefunctions as a variational-wavefunction-based theoretical framework for strongly correlated quantum states of matter, together with practical numerical simulation algorithms. This framework generalizes previously known fermionic parton constructions, yields reliable microscopics with intuitive physical pictures, and allows direct access to the fractionalized degrees of freedom together with associated microscopic effective field theories. We demonstrate the applications of this framework to fractional Chern insulators and quantum spin liquids. We comment that the hyperdeterminant states belong to a more general class of variational wavefunctions: the fused Gaussian states.", "url": "https://arxiv.org/abs/2607.23392", "type": "数值", "summary": "1. 该工作系统引入超行列式波函数作为强关联量子态的变分波函数理论框架及数值模拟算法。\n2. 其卖点在于推广费米子部分子构造，直接获取分数化自由度及相应微观有效场论。\n3. 这为分数量子反常霍尔绝缘体与量子自旋液体研究提供新视角，并指出其属于更一般的熔合高斯态族。", "summary_source": "deepseek", "authors": [{"name": "Guan-Lin Lin"}, {"name": "Di Xiao"}, {"name": "Ying Ran"}], "featured_authors": [{"name": "Guan-Lin Lin"}, {"name": "Di Xiao"}, {"name": "Ying Ran"}], "author_count": 3}, {"id": "2607.23409", "category": "cond-mat", "title": "Tailoring the Frequency-Dependent Optical Response of Hematite through Mono- and Co-Doping: A First-Principles Study", "abstract": "Understanding the effects of doping on the crystal structure and optical properties of semiconductor materials is crucial for advancing next-generation semiconductor and photonic technologies. Although various studies have focused on doped hematite ($\\alpha$-Fe$_2$O$_3$), the relationship between dynamical stability and optical properties remains insufficiently explored. This study presents a comprehensive first-principles investigation that simultaneously evaluates the phonon dispersion characteristics and frequency-dependent optical response of B-doped, Y-doped, and (B, Y)-co-doped $\\alpha$-Fe$_2$O$_3$, providing deeper insights into the underlying mechanisms. We examined the finite-temperature vibrational properties, dielectric function, and optical characteristics to comprehend the lattice dynamics and light-matter interactions under electromagnetic radiation. Vibrational thermodynamics reveal that pristine and Y-doped hematite maintain dynamic stability, while B-doped hematite exhibits imaginary phonon modes indicating lattice instability due to distortions in the Fe--O framework. Notably, Y co-doping with B helps suppress these soft modes, restoring structural stability through lattice relaxation and improved interatomic forces. B doping enhances low-energy absorption by introducing additional states in the valence band, while Y doping alters orbital hybridization, leading to a broader dispersion. In the optical regime, doped hematite displays dominant interband transitions below $2$ eV and strong absorption between 1.80 eV and 4 eV. The (B, Y) co-doping combines the low-energy benefits with an improved optical response profile. In summary, doping significantly enhances lattice vibrations, light-matter interactions, and optical responses, providing an effective strategy for tailoring hematite for diverse applications in photoactive, optoelectronic, and photonic technologies.", "url": "https://arxiv.org/abs/2607.23409", "type": "数值", "summary": "1. 基于第一性原理计算，系统研究了B、Y单掺杂及共掺杂α-Fe₂O₃的声子稳定性与频率依赖光学响应。\n2. 通过分析声子色散和介电函数，发现Y共掺杂可有效抑制B掺杂引入的虚声子模，恢复结构稳定，并协同增强低能吸收与能带色散。\n3. 该工作为通过共掺杂策略协同调控赤铁矿的结构稳定性与光吸收性能，进而优化其在光活性与光电器件中的应用提供了理论支撑。", "summary_source": "deepseek", "authors": [{"name": "Abdul Ahad Mamun"}, {"name": "Muhammad Anisuzzaman Talukder"}], "featured_authors": [{"name": "Abdul Ahad Mamun"}, {"name": "Muhammad Anisuzzaman Talukder"}], "author_count": 2}, {"id": "2607.23461", "category": "cond-mat", "title": "Molecular dynamics with a first-principles-validated universal machine-learning potential reveals dynamic elementary processes of growth-related adspecies on GaN(0001)", "abstract": "Atomic-scale understanding of the surface elementary processes in metalorganic vapor phase epitaxy (MOVPE) of GaN has so far relied on static density-functional-theory (DFT) energetics and on first-principles molecular dynamics (FPMD) limited to a few tens of picoseconds. Here we combine FPMD with a universal machine-learning interatomic potential (MLIP), UMA, to follow the dynamics of growth-related adspecies on GaN(0001) over time scales inaccessible to purely first-principles approaches. FPMD simulations of a GaNH admolecule coexisting with H adatoms reveal a hitherto unrecognized diffusion mode, in which the N atom lifts the Ga atom of the GaNH unit off the surface layer during migration, and show that the lifted Ga abstracts an H adatom from the surface, events invisible to static DFT. Single-point UMA calculations on FPMD snapshots reproduce the first-principles relative energies along the trajectory (RMSE of about 8.5 meV/atom) without any retraining. Long-time MLIP-based MD (150 ps) then reveals dynamics never observed within the FPMD window: site-to-site H-adatom hopping, which gates the migration paths of the growth unit, and reversible dissociation of the GaNH unit into independently migrating Ga and NH adspecies. This work constitutes, to our knowledge, the first application of an MLIP to the molecular dynamics of GaN MOVPE.", "url": "https://arxiv.org/abs/2607.23461", "type": "理论+数值", "summary": "1. 该工作结合第一性原理分子动力学与通用机器学习势UMA，追踪了GaN(0001)表面生长相关吸附物种在百皮秒时间尺度的动态行为。\n2. 其技术核心在于单点UMA计算以约8.5 meV/原子的精度复现第一性原理相对能量，并发现了H原子跳跃门控迁移路径及GaNH单元可逆解离等静态DFT不可见的基元过程。\n3. 这为原子尺度理解GaN的MOVPE生长机制提供了动态证据，并展示了通用机器学习势超越第一性原理时间限制、揭示表面复杂动力学的广阔前景。", "summary_source": "deepseek", "authors": [{"name": "Yoshito Takaesu"}, {"name": "Akira Kusaba"}, {"name": "Junko Ishii"}, {"name": "Shigenori Matsushima"}, {"name": "Yoshihiro Kangawa"}], "featured_authors": [{"name": "Yoshito Takaesu"}, {"name": "Akira Kusaba"}, {"name": "Junko Ishii"}, {"name": "Shigenori Matsushima"}, {"name": "Yoshihiro Kangawa"}], "author_count": 5}, {"id": "2607.23562", "category": "cond-mat", "title": "On the flash temperature in sliding rubber contacts", "abstract": "We present an analytical theory for the flash temperature for viscoelastic solids sliding on rigid and randomly rough surfaces. The theory takes into account the surface roughness on all relevant length scales.", "url": "https://arxiv.org/abs/2607.23562", "type": "理论", "summary": "1. 该工作提出了粘弹性固体在刚性随机粗糙表面上滑动时闪温的解析理论。\n2. 其技术卖点在于全面计入所有相关长度尺度上的表面粗糙度对闪温的贡献。\n3. 这为橡胶摩擦热效应的定量预测与材料界面设计提供了理论工具。", "summary_source": "deepseek", "authors": [{"name": "B.N.J. Persson"}], "featured_authors": [{"name": "B.N.J. Persson"}], "author_count": 1}, {"id": "2607.23603", "category": "cond-mat", "title": "Local micromechanics in a mean-field model of glasses reveal key properties of its non-equilibrium RSB phase", "abstract": "A recently formulated mean-field model of glasses features an equilibrium, zero-temperature Replica-Symmetry-Breaking (RSB) transition in some parameter range. In this range, the model's solution in the Replica-Symmetric phase is expressed in terms of an effective, self-consistent random potential for uncoupled degree of freedoms, where the transition to the RSB phase is characterized by the emergence of spectral-edge localized modes and a pseudogapped quartic vibrational spectrum, resulting in a finite spin-glass susceptibility. These properties are preserved in numerical solutions of the model under non-equilibrium conditions, i.e., upon an instantaneous quench. Inspired by recent advances in computer glasses, we define a micromechanical response function --- the linear response to local force monopoles --- in the framework of the mean-field model. We establish exact relations between the force monopole stiffness and global susceptibilities, which suggest a close correspondence between the non-equilibrium RSB phase of the model and the above-mentioned effective random potential description. As such, the obtained micromechanical observables constitute a concrete realization of the collective degrees of freedom of the model, offering a bridge between a glassy mean-field model and finite-dimensional glasses. We show that the model's vibrational spectrum can be computed solely from the monopole response statistics and, by employing a marginal stability criterion, we extract a characteristic frequency/stiffness scale of soft glassy modes, which is related to the boson peak in finite-dimensional, laboratory glasses.", "url": "https://arxiv.org/abs/2607.23603", "type": "理论+数值", "summary": "1. 该工作在平均场玻璃模型中定义力单极子线性响应，揭示了其非平衡复制对称破缺相中的谱边局域模与赝能隙振动谱。\n2. 其技术卖点在于严格建立单极子刚度与全局磁化率的精确关系，并证明振动谱可仅由响应统计计算，将非平衡RSB相等价于有效自洽随机势。\n3. 这一微观力学框架搭建了平均场模型与有限维玻璃间的桥梁，并利用边缘稳定性准则提取的软模式特征频率直接对应于实验室玻璃中的玻色峰。", "summary_source": "deepseek", "authors": [{"name": "Makoto Suda"}, {"name": "Edan Lerner"}, {"name": "Eran Bouchbinder"}], "featured_authors": [{"name": "Makoto Suda"}, {"name": "Edan Lerner"}, {"name": "Eran Bouchbinder"}], "author_count": 3}, {"id": "2607.23654", "category": "cond-mat", "title": "Pair-Density Wave from Doping an Altermagnetic Mott Insulator", "abstract": "Pair-density-wave (PDW) superconductivity is a state in which the superconducting order parameter modulates at a finite wavevector. Using large-scale density matrix renormalization group, we study the doped altermagnetic Mott insulator in the checkerboard $t$-$J$ model, where altermagnetic exchange anisotropy is encoded microscopically through anisotropic ferromagnetic next-nearest-neighbor exchange. By mapping the ground-state phase diagram as a function of doping and altermagnetic anisotropy, mainly on six-leg cylinders, we identify a transition from a uniform $d$-wave superconducting regime with charge modulation to a PDW regime coexisting with stripe order. In the PDW regime, we report an unconventional wave-vector locking $\\mathbf Q_{\\mathrm{PDW}}\\approx 2\\mathbf Q_{\\mathrm{Stripe}}$ along the cylinder direction, in contrast to the conventional relation. Pair correlations reveal a two-scale structure, consisting of short-distance local $d$-wave pairing and long-distance finite-momentum PDW correlations. A symmetry-based Ginzburg--Landau analysis is presented for the observed locking. Our results identify altermagnetism as a strong-coupling, microscopically grounded route to finite-momentum superconductivity in doped Mott insulators.", "url": "https://arxiv.org/abs/2607.23654", "type": "理论+数值", "summary": "1. 该工作利用大规模密度矩阵重整化群研究棋盘格t-J模型，刻画了掺杂交错磁莫特绝缘体从均匀d波超导到与条纹序共存的配对密度波（PDW）的相变。\n2. 其核心发现是PDW波矢与条纹序波矢间满足非常规锁定关系Q_PDW≈2Q_Stripe，且配对关联呈现短程局域d波与长程有限动量PDW的两尺度结构，并基于对称性给出了金兹堡-朗道分析。\n3. 这确立了交错磁体系作为强耦合、有微观基础的有限动量超导实现途径，为掺杂莫特绝缘体中PDW的机理研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Shuai A. Chen"}, {"name": "Qianqian Chen"}, {"name": "Guangyu Yu"}, {"name": "Zheng Zhu"}], "featured_authors": [{"name": "Shuai A. Chen"}, {"name": "Qianqian Chen"}, {"name": "Guangyu Yu"}, {"name": "Zheng Zhu"}], "author_count": 4}, {"id": "2607.23695", "category": "cond-mat", "title": "Engineering two-body interaction for the Moore-Read State", "abstract": "Engineering interactions that stabilize non-Abelian fractional quantum Hall phases is a central challenge in strongly correlated topological matter and quantum simulation. We introduce a differentiable framework for inverse Hamiltonian design, in which Haldane pseudopotentials are optimized by gradient-based exact diagonalization to stabilize target fractional quantum Hall phases. In spherical geometry, the Haldane pseudopotentials are treated as variational parameters and optimized in a JAX-based exact-diagonalization framework. By directly maximizing the overlap between the many-body ground state and the Moore-Read state, we obtain a robust pseudopotential profile that has Pfaffian overlaps exceeding $99\\%$ for systems up to $N_e=12$, substantially improving over conventional Coulomb interactions. Analyses of the neutral excitation spectrum and orbital entanglement spectrum further confirm that the optimized interaction stabilizes the Pfaffian topological phase. Our results demonstrate that essential features of the three-body Pfaffian parent Hamiltonian can be effectively encoded in a suitably designed two-body interaction. Furthermore, they identify a nearly universal exponentially decaying pseudopotential profile that stabilizes the Pfaffian phase and establishes a general framework toward engineering non-Abelian topological order in quantum simulation.", "url": "https://arxiv.org/abs/2607.23695", "type": "理论+数值", "summary": "1. 该工作提出一个可微逆哈密顿设计框架，通过优化Haldane赝势的两体相互作用来稳定Moore-Read态。\n2. 利用基于JAX的精确对角化梯度下降，直接最大化多体基态与Moore-Read态的重叠，获得指数衰减的赝势分布，Pfaffian重叠超99%。\n3. 结果表明两体相互作用可有效编码三体Pfaffian母哈密顿量的核心特征，为量子模拟中工程化非阿贝尔拓扑序提供了通用框架。", "summary_source": "deepseek", "authors": [{"name": "Yi Yang"}, {"name": "Xin Wan"}, {"name": "Zi-Xiang Hu"}], "featured_authors": [{"name": "Yi Yang"}, {"name": "Xin Wan"}, {"name": "Zi-Xiang Hu"}], "author_count": 3}, {"id": "2607.23764", "category": "cond-mat", "title": "Berry curvature effects of chiral superconducting rhombohedral graphene", "abstract": "We study the Berry curvature effects of the Bogoliubov quasiparticles in chiral superconducting rhombohedral graphene. Using a two-band Bogoliubov-de Gennes Hamiltonian to describe the superconducting quasiparticles, we calculate the momentum-space Berry curvature, the orbital magnetic moment, the anomalous thermal-Hall and the anomalous spin- and orbital-Nernst transport of the chiral $p$-wave superconducting states. We investigate the impact of the normal-state energy band warping in rhombohedral graphene, which can cause the Bogoliubov Fermi surface for quasiparticle excitations. We find that the Bogoliubov Fermi surface qualitatively modulates the anomalous Hall transports, inducing a deviation of the thermal Hall conductivity from the quantized value and strongly enhancing the spin- and orbital-Nernst responses.", "url": "https://arxiv.org/abs/2607.23764", "type": "理论", "summary": "1. 该工作通过两带Bogoliubov-de Gennes哈密顿量，研究了手性超导菱面石墨烯中Bogoliubov准粒子的动量空间贝里曲率、轨道磁矩以及反常热霍尔和自旋/轨道能斯特输运。\n2. 核心发现是正常态能带翘曲诱导出Bogoliubov费米面，其定性调制反常霍尔输运，导致热霍尔电导偏离量子化值并显著增强自旋和轨道能斯特响应。\n3. 这为揭示手性超导中能带拓扑与量子几何效应对准粒子输运的协同调制机制提供了关键理论判据。", "summary_source": "deepseek", "authors": [{"name": "Jian-Hua Zeng"}, {"name": "Zhi Wang"}, {"name": "Qian Niu"}], "featured_authors": [{"name": "Jian-Hua Zeng"}, {"name": "Zhi Wang"}, {"name": "Qian Niu"}], "author_count": 3}, {"id": "2607.23768", "category": "cond-mat", "title": "Nanoscale linear response of strongly disordered stable solids", "abstract": "Strongly disordered solids exhibit distinctive properties at the nanoscale, where conventional continuum theory breaks down. We show that their disorder-averaged linear response can be described by a modified continuum theory in which the response coefficients are local but depend nonlocally on the structural properties. The stability criterion requires the response operator to be positive semidefinite, which naturally leads to a correlated Wishart disorder. In the limit of strong disorder, these equations reduce the long-wavelength response to a scalar disorder-induced contrast field. In elasticity, this field describes the formation of a stiff shell around rigid nanoparticles and boundaries, whose characteristic extent is set by the nonaffine length. The predictions are confirmed by molecular-dynamics simulations of a Lennard-Jones glass and a model polymer. Direct calculation of the nonlocal elastic kernels further shows that the response is predominantly local on the scale of the stiffened interphase.", "url": "https://arxiv.org/abs/2607.23768", "type": "理论+数值", "summary": "1. 该工作针对强无序稳定固体的纳米尺度线性响应，提出了修正连续介质理论，其响应系数局域但非局域依赖于结构性质。\n2. 关键卖点在于稳定性要求响应算子半正定导出相关Wishart无序，强无序下长波长响应约化为标量无序诱导对比场，并以非仿射长度刻画刚性纳米颗粒与边界的硬化壳层。\n3. 这为在无序固体中融合局域响应与非局域结构关联提供了直接可验证的理论框架，对玻璃态材料纳米力学与界面设计具有启发。", "summary_source": "deepseek", "authors": [{"name": "D. V. Babin"}, {"name": "I. O. Raikov"}, {"name": "Y. M. Beltukov"}], "featured_authors": [{"name": "D. V. Babin"}, {"name": "I. O. Raikov"}, {"name": "Y. M. Beltukov"}], "author_count": 3}, {"id": "2607.23812", "category": "cond-mat", "title": "Electrolytes confined between polarizable surfaces in slit pores with anisotropic permittivity tensor", "abstract": "We present a method that enables efficient simulations of coarse-grained electrolyte solutions inside a narrow slit pore with an anisotropic dielectric permittivity tensor. The electrostatic equations for polarizable surfaces are solved using a 2D periodic Green's function method combined with a slab-corrected anisotropic 3D Ewald summation. We apply this approach in Monte Carlo simulations to study 1:1 electrolytes confined between both polarizable dielectric and metallic surfaces. Our results show that dielectric anisotropy aggressively reshapes the double-layer structure. While a coordinate stretching transformation demonstrates that individual ion-image interactions depend strictly on the bulk-like parallel permittivity, the suppression of the perpendicular permittivity dramatically amplifies direct in-plane ion-ion correlations. Under strong anisotropy, these lateral correlations dominate the thermodynamics completely, rendering the structural profiles of mutually opposing dielectric and metallic boundaries practically identical by forcing the smaller cations directly into the contact plane of the larger anions.", "url": "https://arxiv.org/abs/2607.23812", "type": "理论+数值", "summary": "1. 该工作提出一种结合二维周期格林函数与各向异性三维Ewald求和的算法，实现了极化狭缝内各向异性介电张量电解质溶液的高效蒙特卡罗模拟。\n2. 其核心发现为坐标拉伸变换表明离子-镜像作用仅依赖于平行介电常数，而垂直介电分量的抑制显著增强面内离子关联，致使电介质与金属边界下的双电层结构趋于一致。\n3. 这揭示了各向异性介电环境下横向关联对热力学的完全主导，为纳米限域离子输运及储能器件中的双电层调控提供了新启示。", "summary_source": "deepseek", "authors": [{"name": "Alexandre P. dos Santos"}, {"name": "Yan Levin"}], "featured_authors": [{"name": "Alexandre P. dos Santos"}, {"name": "Yan Levin"}], "author_count": 2}, {"id": "2607.23824", "category": "cond-mat", "title": "The Uhlenbeck-Ford model in two dimensions: Reference system for fluid-phase free-energy calculations", "abstract": "We investigate the Uhlenbeck-Ford (UF) model as a reference system for free-energy calculations in two-dimensional (2D) fluids. The 2D virial coefficients are computed exactly up to tenth order and combined with molecular simulation data to construct highly accurate numerical representations of the equation of state and the excess Helmholtz free this http URL then determine the phase diagram of the model in order to establish the thermodynamic stability limits of the fluid phase and thereby identify the range of applicability of the UF model as a fluid reference system. In the course of this analysis, we identify the solid, hexatic, and fluid phases, and show that the fluid remains the only thermodynamically stable phase, independent of density, for scaling parameters up to $p\\lesssim 70$. Finally, we demonstrate the practical applicability of the 2D UF model as a reference system through thermodynamic integration calculations of the free energy of a two-dimensional Lennard-Jones fluid.", "url": "https://arxiv.org/abs/2607.23824", "type": "理论+数值", "summary": "1. 该工作将二维Uhlenbeck-Ford模型用作流体自由能计算的参考系统，精确计算了维里系数至十阶，并结合分子模拟构建了状态方程与过量亥姆霍兹自由能的高精度数值表示。\n2. 其关键技术在于确定了相图中固相、六角相和流体相的存在，并揭示了标度参数p≲70时流体相在所有密度下均为唯一热力学稳定相，明确了参考系统的适用条件。\n3. 通过热力学积分成功计算二维Lennard-Jones流体的自由能，验证了该参考系统的实用性，为二维简单流体及更广泛相互作用体系的热力学研究提供了可靠基准。", "summary_source": "deepseek", "authors": [{"name": "Samuel Cajahuaringa"}, {"name": "Rodolfo Paula Leite"}, {"name": "Maurice de Koning"}], "featured_authors": [{"name": "Samuel Cajahuaringa"}, {"name": "Rodolfo Paula Leite"}, {"name": "Maurice de Koning"}], "author_count": 3}, {"id": "2607.23907", "category": "cond-mat", "title": "Growth and remodeling control shape memory in morphogenetic rods", "abstract": "Mechanical instabilities provide a general design principle for shaping developing organs and engineering soft materials. However, in slender structures, simple elastic buckling tends to erase rather than preserve shape complexity: structures relax to the simplest possible shape, erasing finer detail. Living systems nonetheless build complex, reproducible morphologies from continually remodeling material, while remaining robust to noise arising across scales. Using analytical theory and numerical simulations of a minimal model of growing visco-elasto-plastic rods, we show that remodeling plays two opposing roles: At low plasticity, patterns coarsen through elastic relaxation, while high plasticity converts fluctuations into geometric disorder. This sets a trade-off between shape complexity and reproducibility with an optimal intermediate plasticity, which protects initial patterns. Growth breaks this trade-off by suppressing both failure modes, enabling complex shapes to be reproducibly generated. Our results identify remodeling and growth rates as two knobs governing whether an encoded pattern is remembered, degraded, or transformed.", "url": "https://arxiv.org/abs/2607.23907", "type": "理论+数值", "summary": "1. 该工作通过粘弹塑性杆的极小模型理论与数值模拟，分析了重塑在形态发生中的双重作用。\n2. 核心发现是存在最优中间塑性以保护初始图案，而生长能同时抑制弹性粗化与塑性无序。\n3. 这揭示了重塑率与生长率作为控制杆状结构形状记忆编码、退化或转变的关键旋钮。", "summary_source": "deepseek", "authors": [{"name": "Nicolas Romeo"}, {"name": "David B. Brückner"}, {"name": "Noah P. Mitchell"}], "featured_authors": [{"name": "Nicolas Romeo"}, {"name": "David B. Brückner"}, {"name": "Noah P. Mitchell"}], "author_count": 3}, {"id": "2607.23985", "category": "cond-mat", "title": "Symmetry Criterion for Van Hove Criticality at Non-Time-Reversal-Invariant Momenta", "abstract": "At non-time-reversal-invariant momenta (non-TRIMs), time-reversal symmetry does not constrain the linear term of the band dispersion. Whether $\\nabla E$ vanishes is therefore determined entirely by the representation theory of the little group. For nondegenerate bands, $\\nabla E$ is forced to zero if and only if the vector representation $\\Gamma_{\\mathrm{vec}}$ of the little group does not contain the trivial representation $\\Gamma_1$. When $\\Gamma_{\\mathrm{vec}}$ does contain $\\Gamma_1$, $\\nabla E$ is not forced to vanish for any nondegenerate band; the classification instead depends on the multiplicity of $\\Gamma_1$ in $\\Gamma_{\\mathrm{vec}}$. For degenerate bands, the Wigner-Eckart theorem and Clebsch--Gordan coefficients determine whether linear couplings vanish, with classification performed at the subband level. Applied to space group 225, the criterion explains why the $W$ point is critical for all nondegenerate bands, the degenerate $E$ bands are generically noncritical, and the $K$ and $U$ points host parameter-dependent criticality. Supporting phase diagrams reveal a two-tier hierarchy: symmetry enforces $\\nabla E=0$, while band parameters determine higher-order character. We extend this classification to all space groups hosting non-TRIMs in the single-group limit, providing a symmetry-dictated, parameter-independent framework for engineering Van Hove singularities in three-dimensional quantum materials.", "url": "https://arxiv.org/abs/2607.23985", "type": "理论+数值", "summary": "1. 该工作基于小群表示理论，提出了非时间反演不变动量点处能带临界性（∇E=0）的对称性判据。\n2. 卖点在于利用矢量表示与平凡表示的关系及维格纳-埃卡特定理，给出了参数无关的对称性决定条件，并分类了简并与非简并能带情形。\n3. 这为在三维量子材料中系统设计范霍夫奇点提供了空间群层面的参数无关框架，适用于单群极限下所有具有非时间反演不变动量点的空间群。", "summary_source": "deepseek", "authors": [{"name": "Min-Quan Kuang"}, {"name": "Hua-Yu Li"}], "featured_authors": [{"name": "Min-Quan Kuang"}, {"name": "Hua-Yu Li"}], "author_count": 2}, {"id": "2607.24038", "category": "cond-mat", "title": "Magnetic-texture winding controls fermion-parity switches in an interacting $p$-wave magnet wire", "abstract": "Coplanar magnetic spirals map locally onto uniform spin--orbit-coupled wires, but on a ring the rotating spin frame can change the electronic boundary condition. We prove, level by level in every fixed-particle-number sector, that even and odd texture windings impose boundary phases separated by half the single-electron flux period. Changing the winding by one also changes the physical pitch in inverse proportion to the circumference; a symmetric comparison removes this leading pitch correction. In the number-conserving topological phase, a global parity constraint then reverses the fermion-parity assignment of neighboring phase-winding branches. Density-matrix renormalization-group simulations show this reversal, support an Ising transition coexisting with a gapless charge mode, and relate the finite-size parity splitting to an independently calculated charge stiffness. Magnetic-texture winding thus changes the many-body spectrum through a global boundary condition that is not determined by the local band dispersion, providing a closed-geometry, number-conserving probe of topological pairing.", "url": "https://arxiv.org/abs/2607.24038", "type": "理论+数值", "summary": "1. 该工作以共面磁螺旋环上的相互作用p波磁线为模型，通过解析推导与密度矩阵重整化群模拟，证明了磁纹理绕数在每一固定粒子数扇区中通过边界相位差控制费米子宇称的翻转。\n2. 其核心在于揭示全局宇称约束使粒子数守恒拓扑相中相邻相位分支的费米子宇称分配反转，该反转完全由绕数决定的全局边界条件主导，且有限尺寸宇称分裂与电荷刚度自洽关联，而非局域能带色散。\n3. 这为在封闭几何中利用磁纹理绕数作为拓扑配对数守恒探针提供了理论框架，并暗示了与无能隙电荷模式共存的Ising相变，深化了对拓扑超导微观机制的认识。", "summary_source": "deepseek", "authors": [{"name": "Hyun-Yong Lee"}], "featured_authors": [{"name": "Hyun-Yong Lee"}], "author_count": 1}, {"id": "2607.24078", "category": "cond-mat", "title": "Thermodynamics with thermodynamic variable first-passage time. I. From stochastic trajectories to nonlinear transport equations", "abstract": "The theoretical foundation of combining external nonequilibrium thermodynamics, the nonequilibrium statistical operator method, and stochastic first passage time thermodynamics are explored. It is shown that including a random lifetime of a metastable state in the generalized distribution function allows the first passage time to be considered as a fully - fledged macroscopic coordinate. A microscopic justification for this approach is provided, and a generalized thermodynamic potential is introduced. A procedure for closing the transport equations based on on thermodynamic consistency conditions is developed. It is shown that in the generalized Maxwell - Catteneo equation, the classical relaxation time is strictly replaced by the mean first passage time, which imparts internal macroscopic nonlinearity to the system. Using renewal theory, the exact mathematical structure of transport memory kernels for non-Markovian processes is derived. A qualitative comparative analysis of various approaches to the thermodynamic description of nonequilibrium phenomena is presented.", "url": "https://arxiv.org/abs/2607.24078", "type": "理论", "summary": "1. 该工作探索了将外部非平衡热力学、非平衡统计算符方法与随机首次通过时间热力学相结合的理论基础。\n2. 其核心在于将亚稳态随机寿命引入广义分布函数，使首次通过时间成为完备宏观坐标，并建立基于热力学一致性条件的输运方程闭合程序。\n3. 这为精确推导非马尔可夫过程输运记忆核的数学结构提供了框架，并揭示平均首次通过时间替代经典弛豫时间后赋予系统内部宏观非线性。", "summary_source": "deepseek", "authors": [{"name": "V. V. Ryazanov"}], "featured_authors": [{"name": "V. V. Ryazanov"}], "author_count": 1}, {"id": "2607.24094", "category": "cond-mat", "title": "Thermodynamics with thermodynamic variable first-passage time. II. Dynamics of explosive boiling of superheated liquid, critical indices, fractional calculus", "abstract": "Within the framework of stochastic first-passage time thermodynamics (TFPT) and power-law distributions (Mittag-Leffler and Levy), the appearance of fractional Caputo derivatives in hydrodynamic equations is substantiated. The developed framework is applied to the problem of explosive boiling of a superheated liquid: an integral formula for nonlocal entropy production is derived and the critical index of dissipation intensity is calculated, along with qualitative changes in these parameters upon introducing external pressure. It is found that dissipation at a given instant is strictly determined by the integral history of the macroscopic matter flow J(t) over the entire evolutionary interval up to the moment of phase explosion. The calculated critical dissipation index z strictly describes the kinetic catastrophe and the violation of Prigogine's minimum entropy production principle near spinodals.", "url": "https://arxiv.org/abs/2607.24094", "type": "理论", "summary": "1. 该工作在随机首通时间热力学与幂律分布框架下，论证了流体力学方程中分数阶Caputo导数的出现，并应用于过热水液体爆炸沸腾问题。\n2. 其卖点在于推导了非局部熵产生积分公式并计算耗散临界指数z，揭示了给定时刻耗散严格由宏观物质流J(t)的完整演化历史决定。\n3. 这为定量描述动力学灾变及近旋节线处Prigogine最小熵产生原理的违反提供了明确框架，启发其他非平衡相变问题的分数阶建模。", "summary_source": "deepseek", "authors": [{"name": "V. V. Ryazanov"}], "featured_authors": [{"name": "V. V. Ryazanov"}], "author_count": 1}, {"id": "2607.24102", "category": "cond-mat", "title": "Response-Selected Hidden Hyperuniformity in Hydrodynamic Active Matter", "abstract": "Hyperuniformity in active matter is usually treated as a property of a prescribed density or continuum field. This view misses a basic feature of hydrodynamic active matter: an incompressible fluid does not respond equally to every microscopic force. Longitudinal forcing is absorbed into pressure, whereas transverse forcing drives flow. The relevant question is therefore not only whether particles are uniformly arranged or whether the total activity is small, but which sector of the active forcing is selected by the physical response. Here we introduce response-selected hyperuniformity, in which long-wavelength order is a property of a source-response pair. In a reversible valence-one fluid with no prescribed partners, locally neutral clusters screen the signed active-moment sector that controls transverse flow, producing a first-moment spectrum that vanishes quadratically at low wavenumber. Locally unscreened moments instead generate a nonzero infrared plateau. The resulting transverse-force spectrum has a universal crossover from fourth- to sixth-order scaling, with the crossover set by the ratio of the unscreened residual to the screened analytic contribution. Complete partner renewal preserves this normal form, establishing exchangeable multipole inheritance, while turnover tunes the residual through an independently measured local defect density. The zero-residual limit yields strictly hyperuniform velocity fluctuations; any finite residual causes defect-controlled infrared leakage and sets a finite screening length. Thus microscopic exchange need not destroy hidden hyperuniform flow order, but rare unscreened moments determine how far the quiet-flow regime survives.", "url": "https://arxiv.org/abs/2607.24102", "type": "理论", "summary": "1. 该工作引入响应选择的隐藏超均匀性概念，将流体动力学活性物质中的长波有序定义为源-响应对而非单一密度场的性质。\n2. 其卖点在于揭示不可压缩流体中纵向活性力被压力屏蔽而横向力驱动流动，导致横向力谱从四阶到六阶标度的普适交叉，且交换性多极继承维持正态形式。\n3. 这为活性物质中缺陷控制的红外泄漏机制如何限定静流区生存范围提供了定量描述，并指出完全伙伴更新不会破坏隐藏超均匀流动秩序。", "summary_source": "deepseek", "authors": [{"name": "Liyu Zhong"}, {"name": "Yang Jiao"}], "featured_authors": [{"name": "Liyu Zhong"}, {"name": "Yang Jiao"}], "author_count": 2}, {"id": "2607.24107", "category": "cond-mat", "title": "Atomic-scale phase-field modeling with dopants: Stochastic self-consistent harmonic approximation with fractional site occupancy", "abstract": "Phase-field modeling has achieved great success in predicting pattern formation in materials, such as the formation of ferroelectric domains. However, because it is typically based on continuum mechanics, conventional phase-field modeling cannot be straightforwardly applied to atomic-scale pattern formation, such as dopant segregation and vacancy ordering, which are driven by chemical potentials. Here, we extend the phase-field concept to the atomic scale by formulating the free energy of atomic systems within stochastic self-consistent harmonic approximation (SSCHA) theory to allow fractional site occupations. Our methodology enables us to directly calculate the derivative of the free energy with respect to site occupation and thereby obtain the chemical potential, successfully reproducing Ag distributions in bulk Cu as well as the resulting lattice expansion. Furthermore, we applied our methodology to investigate dopant segregation around a {\\Sigma}5(310)[001] Cu grain boundary doped with Ag atoms. We found that Ag atoms preferentially segregate at the vertices of the triangular motif of a grain boundary. As the number of dopants increases, excess Ag atoms segregate near the vertices and then at the bottom sites of the triangular motif. This study extends the phase-field concept to discrete atomic systems, enabling the identification of preferential dopant-segregation sites and thereby visualizing atomic-scale pattern formation.", "url": "https://arxiv.org/abs/2607.24107", "type": "理论", "summary": "1. 该工作将相场建模扩展到原子尺度，基于随机自洽谐近似理论并引入分数位点占据，实现原子级自由能计算。\n2. 其核心在于直接求取自由能对位点占据的导数以获得化学势，成功再现银在铜中的分布及晶格膨胀，并揭示银在Σ5(310)铜晶界三角顶点优先偏析。\n3. 这为将相场概念推广至离散原子系统、识别原子尺度图案形成中的优先偏析位点提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Kairi Masuda"}, {"name": "Yu Kumagai"}], "featured_authors": [{"name": "Kairi Masuda"}, {"name": "Yu Kumagai"}], "author_count": 2}, {"id": "2607.24133", "category": "cond-mat", "title": "Coupling of Cation and Anion Dynamics in Solid Electrolytes Revealed by Virtual Isotopic Substitution Molecular Dynamics", "abstract": "We characterise the interplay between cation-translational and anion-rotational dynamics on the model system $\\rm \\alpha\\text{-}Li_{2}SO_{4}$ through virtual isotopic substitution molecular dynamics (VISMD) simulations. We independently control in turn the lithium translational- and sufate rotational- diffusivity by varying the masses of lithium and oxygen, respectively, showing that both diffusivities exhibit power-law relationships with the masses of each individual component. Changing either diffusivity produces an effect on the other; i.e. there exists a bidirectional coupling between anion and cation diffusive dynamics. From our variable-temperature/variable-mass dataset we demonstrate that the apparent activation energy for lithium diffusion depends strongly on the isotope mass, decreasing with accelerated sulfate dynamics; an observation which provides clear evidence of mode-coupling between cation and anion dynamics.", "url": "https://arxiv.org/abs/2607.24133", "type": "理论+数值", "summary": "1. 该工作采用虚拟同位素替代分子动力学模拟，基于变温变质量数据集，在α-Li₂SO₄体系中系统揭示了阳离子平移与阴离子旋转动力学间的双向耦合关系。\n2. 其核心物理贡献在于独立调控锂和氧的同位素质量以分别控制锂扩散与硫酸根旋转，发现两者扩散率呈幂律依赖且相互影响，并由锂表观活化能随硫酸根转动加速而降低直接证实了阳离子-阴离子模式耦合。\n3. 该结果为固体电解质中离子传输的协同机制提供了定量描述，启示可通过同位素工程或阴离子转动设计来优化锂离子电导率，对高性能固态电解质研发具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Xintian Wang"}, {"name": "Andrew L. Goodwin"}, {"name": "Theodosios Famprikis"}], "featured_authors": [{"name": "Xintian Wang"}, {"name": "Andrew L. Goodwin"}, {"name": "Theodosios Famprikis"}], "author_count": 3}, {"id": "2607.
