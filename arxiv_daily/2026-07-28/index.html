tive proposal mechanism, enlarging the class of quantum walks beyond classical counterparts. We target the problem of sampling from the low-temperature Gibbs distribution of classical dense Ising models, within a fixed error in total variation distance. This approach achieves about a cubic polynomial asymptotic advantage over previous quantum-walks, resulting in a total sixth-degree polynomial queries speedup compared to the best classical walk. This shows that speedups beyond the widely assumed quadratic limit are possible within the quantum walk formalism. We perform a complete fault-tolerant compilation of all algorithmic primitives and benchmark against CPU, GPU, and FPGA implementations of the best classical Markov chain. Under identical hardware assumptions, the resulting advantage runtime crossover is reduced from approximately $10^3$ years for conventional quantum walks to less than one day. These results identify fully-quantum Markov chains as a promising route toward practical quantum advantage.", "url": "https://arxiv.org/abs/2607.22818", "type": "理论+数值", "summary": "1. 该工作提出一类提议与接受步骤均量子化的全量子Metropolis游走，用于固定总变差误差下经典密集伊辛模型低温吉布斯采样。\n2. 其核心在于采用哈密顿模拟作为量子原生提议机制，相比此前量子游走实现约三次多项式渐近加速，对最佳经典游走总加速达六次多项式，突破二次加速极限。\n3. 完整容错编译显示，相同硬件假设下加速比交叉时间从传统量子游走的约千年降至不足一天，指明全量子马尔可夫链通往实用量子优势的具体路径。", "summary_source": "deepseek", "authors": [{"name": "Massimiliano Incudini"}, {"name": "Guglielmo Mazzola"}], "featured_authors": [{"name": "Massimiliano Incudini"}, {"name": "Guglielmo Mazzola"}], "author_count": 2}, {"id": "2607.22852", "category": "quant-ph", "title": "Bias-preserving cat-cat CNOT gate via vacuum-conditional beam-splitter", "abstract": "Cat qubits can exhibit strong noise bias due to their exponentially enhanced bit-flip times and only polynomially reduced phase-flip times with increasing photon number, which makes them attractive candidates for hardware-efficient quantum error correction. However, it is difficult to maintain this strong noise bias in logical operations such as CNOT gates between cats. Here, we propose a coherent CNOT gate scheme between two dissipative cats that preserves the exponential noise bias. The proposed gate relies only on unitary operations, which avoids the non-idealities associated with many existing gate schemes that rely on engineered dissipations. Assuming good component lifetimes and precise nonlinearity engineering, the proposed gate can enable logical memory in the megaquop regime (logical error rates < 10^-6) with a distance-7 repetition code consisting of 13 cat qubits.", "url": "https://arxiv.org/abs/2607.22852", "type": "理论", "summary": "1. 该工作提出一种基于真空条件分束器的耗散猫量子比特间相干CNOT门方案，旨在保持猫态固有的指数级比特翻转噪声偏置。\n2. 其技术核心在于仅使用幺正操作实现门操作，避免现有方案中工程耗散带来的非理想性，从而维持噪声偏置优势。\n3. 在理想组件寿命与精确非线性工程条件下，该门可用13个猫量子比特的距离7重复码实现错误率低于10⁻⁶的逻辑存储，迈向百万量子操作区域。", "summary_source": "deepseek", "authors": [{"name": "Yufeng"}, {"name": "Connor T. Hann"}, {"name": "Kyungjoo Noh"}, {"name": "Harald Putterman"}, {"name": "Ron Belyansky"}, {"name": "Arne L. Grimsmo"}, {"name": "Oskar Painter"}], "featured_authors": [{"name": "Yufeng"}, {"name": "Connor T. Hann"}, {"name": "Kyungjoo Noh"}, {"name": "Ron Belyansky"}, {"name": "Arne L. Grimsmo"}, {"name": "Oskar Painter"}], "author_count": 7}, {"id": "2607.22863", "category": "quant-ph", "title": "Universal scaling framework for parameterized quantum evolutions at criticality", "abstract": "Variational ansätze are a cornerstone of quantum many-body physics, providing compact approximations to complex ground states using finite resources. Recent quantum-technology advances have introduced a new class based on layered parameterized evolutions. Assessing whether they can represent critical ground states is challenging: correlations span all length scales, while finite circuit depth limits how far they extend. Building on finite-resource scaling from tensor networks, we assign each ansatz an emergent correlation length $\\xi_D$, the longest range over which it faithfully captures critical correlations. Its growth with refinement parameter $D$, $\\xi_D \\propto D^\\kappa$, defines an exponent $\\kappa$ measuring how efficiently an architecture converts resources into long-distance correlations. Applying this framework to the critical transverse-field Ising model, with $D$ the circuit depth of parameterized evolutions, we compare ansätze with nearest-neighbor and long-range generators, and layers where generators act separately or combined. All ansätze are compatible with algebraic growth, but fitted exponents range from $\\kappa\\simeq1$ to $\\kappa\\simeq3$. Exponential interactions give the largest exponents, while power-law interactions stay close to nearest-neighbor behavior, showing long-range support alone gives no scaling advantage. Combined-generator layers generally outperform separable ones, so layer organization matters alongside interaction range. Finally, a quasiparticle analysis shows finite depth leaves an unresolved window of width $\\xi_D^{-1}$ around the low-energy modes responsible for long-distance correlations. The emergent correlation length thus acts as an infrared resolution scale, providing a benchmark for critical-state preparation and a guide for designing resource-efficient variational architectures.", "url": "https://arxiv.org/abs/2607.22863", "type": "理论+数值", "summary": "1. 该工作针对参数化量子演化在临界点的表征能力，提出了基于有限资源标度的普适框架，通过赋予每个变分拟设一个涌现关联长度ξ_D来量化其捕获临界关联的有效范围。\n2. 在临界横场Ising模型上以电路深度D为资源参数，发现拟设的关联长度增长指数κ介于1至3之间，指数相互作用生成器效率最高，幂律相互作用并不优于最近邻，且组合层结构显著优于可分结构，揭示了层组织方式与相互作用范围同等重要。\n3. 结合准粒子分析表明有限深度导致低能模附近出现宽度~ξ_D⁻¹的未分辨窗口，从而将ξ_D确立为红外分辨尺度，为评估量子器件制备临界态的保真度以及设计资源高效的可变分架构提供了系统性的理论基准与设计指南。", "summary_source": "deepseek", "authors": [{"name": "Jan T. Schneider"}, {"name": "Cristian Tabares"}, {"name": "Alejandro González-Tudela"}, {"name": "Luca Tagliacozzo"}], "featured_authors": [{"name": "Jan T. Schneider"}, {"name": "Cristian Tabares"}, {"name": "Alejandro González-Tudela"}, {"name": "Luca Tagliacozzo"}], "author_count": 4}, {"id": "2607.22998", "category": "quant-ph", "title": "A Resource Estimation Model for the Hardware-Software Co-Design of Distributed Quantum Architectures", "abstract": "In distributed quantum computing (DQC), executing monolithic quantum circuits across multiple interconnected quantum processing units (QPUs) requires dedicated communication qubits to generate and distribute entanglement. Because the number of physical qubits within a QPU is finite, a trade-off emerges where allocating more communication qubits increases the capacity of quantum channels for concurrent non-local operations, but reduces the number of computational qubits available for local gate operations. Distributed quantum compilation routinely ignores this channel capacity, while hardware architects lack a method to determine it prior to quantum circuit partitioning. Moreover, scheduling entanglement on demand introduces severe latency, whereas pre-fetching exposes stored pairs to decoherence. We propose an economic order quantity model from perishable inventory theory to optimize the trade-off between entanglement distribution latency and the time cost of decoherence. The resulting estimate is driven by algorithmic demand and physical constraints, offering a dual application for the hardware-software co-design of high-performance DQC: for hardware architects, it gives the optimal allocation of dedicated communication qubits in static heterogeneous architectures; for compiler developers, it gives the optimal number to reserve dynamically in homogeneous architectures.", "url": "https://arxiv.org/abs/2607.22998", "type": "理论+数值", "summary": "1. 该工作基于易腐库存理论的经济订货量模型，为分布式量子架构中的通信与计算量子比特分配权衡建立了资源估计框架。\n2. 其核心在于同时优化纠缠分发延迟与退相干时间成本，为硬件架构师提供静态异构架构中的最优通信比特分配，为编译器开发者提供同构架构下的动态预留方案。\n3. 这为分布式量子计算中的硬件-软件协同设计提供了可量化的信道容量优化依据，有助于提升非局域操作并发性与系统整体保真度。", "summary_source": "deepseek", "authors": [{"name": "Raymond P. H. Wu"}, {"name": "Chathurika Ranaweera"}, {"name": "Sutharshan Rajasegarar"}, {"name": "Ria Rushin Joseph"}, {"name": "Jinho Choi"}, {"name": "Seng W. Loke"}], "featured_authors": [{"name": "Raymond P. H. Wu"}, {"name": "Chathurika Ranaweera"}, {"name": "Sutharshan Rajasegarar"}, {"name": "Ria Rushin Joseph"}, {"name": "Jinho Choi"}, {"name": "Seng W. Loke"}], "author_count": 6}, {"id": "2607.23039", "category": "quant-ph", "title": "Revisiting the invariant ring of two-qubit mixed states", "abstract": "Local unitary equivalence serves as the cornerstone for classifying entanglement in bipartite quantum systems. Mathematically, it reduces to the study of polynomial invariants of the density matrix under the action of local unitary groups. The collection of all such polynomial invariants forms a ring, known as the invariant ring. However, identifying the complete generators of the invariant ring is the central issue. In 2007, for the two-qubit system, King et al fully characterized the structure of the invariant ring and determined its Cohen--Macaulay decomposition. In this paper, we revisit their work, with a focus on the computation of the Molien series and the construction of invariants. On one hand, we rigorously derive the Molien series via explicit contour integration over the maximal torus, filling in all previously omitted computational steps. On the other hand, we systematically construct all invariants using a graphical method, and then reduce the candidate set by applying various identities and algebraic relations, obtaining a generating set consisting of 21 invariants. This paper aims to make this important result more widely accessible to researchers in quantum information and invariant theory through the above discussions.", "url": "https://arxiv.org/abs/2607.23039", "type": "理论", "summary": "1. 局域幺正等价是两体纠缠分类的基石，该工作重新审视了两量子比特混合态的不变环，严格推导了其Molien级数并系统构造了所有不变量，填补了此前围道积分计算中省略的关键步骤。\n2. 其技术核心在于通过最大环面上的显式围道积分解析计算Molien级数，并采用图形方法结合代数恒等式与关系约化候选不变量，最终得到由21个多项式不变量构成的生成集。\n3. 这一系统性推导使King等人关于两量子比特不变环的完备代数结构更易被量子信息与不变理论领域的研究者理解与采纳，为局域酉等价分类提供了可直接应用的代数工具。", "summary_source": "deepseek", "authors": [{"name": "Bing Xie"}, {"name": "Lin Zhang"}], "featured_authors": [{"name": "Bing Xie"}, {"name": "Lin Zhang"}], "author_count": 2}, {"id": "2607.23066", "category": "quant-ph", "title": "The Ruskai-Audenaert conjecture & equipartitions of positive operators", "abstract": "Several open problems in quantum information theory can be formulated as equipartition problems for positive operators, asking for a decomposition into bounded-rank positive parts under uniform constraints. The existence problems for SIC-POVMs and MUBs are of this type, as is the Ruskai-Audenaert conjecture. We first show that certain problems of this form can be attacked using equivariant cohomology, and then present new results on the Ruskai-Audenaert conjecture. In its weak form, this conjecture asserts that every quantum channel admits a convex decomposition into a minimal number of generalized extreme points; in its strong form, one with equal weights. We prove the strong conjecture in all dimensions for a set of channels of nonzero measure, including all cq- and qc-channels, as well as for all channels with qubit inputs. We also prove the weak conjecture for all qutrit channels, along with further results on convex decompositions of quantum channels.", "url": "https://arxiv.org/abs/2607.23066", "type": "理论", "summary": "1. 该工作将正算子的等分问题作为统一框架，研究量子信息中若干存在性问题，并针对Ruskai-Audenaert猜想给出新结果。\n2. 其关键进展在于利用等变上同调方法，证明了强猜想在包括所有cq-和qc-信道在内的非零测度信道集以及qubit输入信道中成立，弱猜想对所有qutrit信道成立。\n3. 这为量子信道凸分解以及SIC-POVM、MUB等存在性问题的进一步求解提供了有效的理论途径。", "summary_source": "deepseek", "authors": [{"name": "Niranjan Kumar"}, {"name": "Michael M. Wolf"}], "featured_authors": [{"name": "Niranjan Kumar"}, {"name": "Michael M. Wolf"}], "author_count": 2}, {"id": "2607.23074", "category": "quant-ph", "title": "Digital techniques for the frustrated Ising ring: the role of counter-diabatic terms", "abstract": "We investigate the role of local counter-diabatic (CD) terms in enhancing the performance of discrete-time digital protocols for a frustrated Ising ring, a system with an exponentially small spectral gap that acts as a bottleneck for conventional quantum annealing. The techniques investigated range from a digitised version of a fixed-schedule protocol, including lowest-order analytical CD terms, all the way to a full-fledged Quantum Approximate Optimisation Algorithm (QAOA), including variational CD terms (DC-QAOA). By analyzing the resulting residual energy, we show that DC-QAOA combined with Chopped RAndom Basis (CRAB) quantum control techniques for optimizing the circuit parameters, can outperform all the other strategies. By monitoring the ground-state population during the dynamics we learn that DC-QAOA finds effective shortcuts towards the target state through intermediate excited states, a process that is unexpectedly enhanced by the inclusion of local CD unitaries. Our results highlight the importance of flexible variational control of CD dynamics and demonstrate that digital optimization can explore operator dynamics that remain inaccessible to standard analytical CD constructions.", "url": "https://arxiv.org/abs/2607.23074", "type": "理论+数值", "summary": "1. 该工作系统研究了在具有指数小能隙的受挫伊辛环中，局域反绝热项对离散时间数字协议性能的影响，涵盖从固定调度数字协议到变分反绝热量子近似优化算法（DC-QAOA）等多种策略。\n2. 其技术核心在于DC-QAOA结合CRAB参数优化可显著降低残余能量，并通过监测基态布居揭示其通过中间激发态实现有效捷径，这超越了标准解析反绝热构造。\n3. 这凸显了灵活变分控制反绝热动力学的重要性，表明数字优化能够探索解析构造无法触及的算符动力学，为量子退火和组合优化提供了新路径。", "summary_source": "deepseek", "authors": [{"name": "Kiran Thengil"}, {"name": "Vincenzo Roberto Arezzo"}, {"name": "Giuseppe E. Santoro"}], "featured_authors": [{"name": "Kiran Thengil"}, {"name": "Vincenzo Roberto Arezzo"}, {"name": "Giuseppe E. Santoro"}], "author_count": 3}, {"id": "2607.23240", "category": "quant-ph", "title": "Nested Integral Generator Theorem: From Operator Tautologies to Families of Exact Integral Identities", "abstract": "Inserting resolutions of the identity is a standard technique for representing states and operators throughout quantum theory, quantum field theory, and related areas of mathematical physics. This paper elevates this procedure to a rigorous, representation-independent framework through the Nested Integral Generator Theorem. Starting from operator tautologies, the theorem systematically generates exact multi-fold integral identities by successive insertions of continuous resolutions of the identity followed by projection onto arbitrary orthonormal basis vectors. The resulting construction applies to arbitrary finite compositions of closed operators acting on arbitrary target states and establishes a general mapping from operator equalities to families of exact integral identities. Using the theory of vector-valued integration, explicit and verifiable sufficient conditions are derived under which inner products may be interchanged rigorously with Bochner integrals, thereby placing a step that is often left implicit in the physics literature on a firm mathematical foundation. As an immediate consequence, the theorem yields exact integral representations for individual operator functions. Its scope is illustrated through elementary, polynomial, and analytic single-mode operators, as well as single- and two-mode Gaussian unitaries, including squeezing and beam splitting. The framework is further applied to two nontrivial examples beyond standard Gaussian calculations: an exact integral representation of a Kerr-squeezed coherent-state overlap and exact Fock-basis matrix elements for a composite two-mode Gaussian network expressed in terms of bivariate Hermite polynomials.", "url": "https://arxiv.org/abs/2607.23240", "type": "理论+数值", "summary": "1. 该工作提出嵌套积分生成定理，将单位分解插入程序提升为严格表示无关框架，从算子恒等式系统生成精确的多重积分恒等式家族。\n2. 技术核心是向量值积分理论导出内积与Bochner积分交换的充分必要条件，为算子恒等式向积分恒等式的映射奠定严格数学基础。\n3. 该框架直接生成任意算子函数的积分表示，并成功应用于Kerr压缩相干态重叠及双模高斯网络Fock基矩阵元等非标准高斯计算。", "summary_source": "deepseek", "authors": [{"name": "Ghasem Asadi Cordshooli"}], "featured_authors": [{"name": "Ghasem Asadi Cordshooli"}], "author_count": 1}, {"id": "2607.23324", "category": "quant-ph", "title": "Gravitational acceleration encoded in Jaynes Cummings exchange frequencies: Quantum Fisher information, readout, and validity conditions", "abstract": "We derive an effective trapped atom--cavity model in which a constant gravitational acceleration shifts the oscillator equilibrium and changes the local standing-wave coupling, thereby encoding the acceleration in the Jaynes Cummings exchange frequencies. With the atom and motion initially in their ground states and the cavity field initially coherent, we solve the closed-system carrier dynamics exactly and derive the displaced-frame quantum Fisher information (QFI) of the joint atom-cavity state. This QFI is proportional to the square of the local coupling slope, grows quadratically with interrogation time, and scales linearly with mean photon number. At the node, phase-referenced Ramsey detection gives a sign-sensitive estimate of axial acceleration and locally saturates the joint QFI. Away from the node, photon counting and phase-optimized homodyne detection provide cavity readouts when the cavity state carries more QFI than the atomic state. At the off-node operating point studied, Lindblad simulations show that cavity loss produces a finite-time QFI optimum. Lamb Dicke and sideband-suppression conditions control the carrier approximation. In the closed-system benchmark, the carrier-model QFI agrees with the atom-cavity QFI obtained from the unexpanded model after tracing out motion.", "url": "https://arxiv.org/abs/2607.23324", "type": "理论+数值", "summary": "1. 该工作推导了一个有效陷印原子-腔模型，将重力加速度通过振子平衡位移与局域驻波耦合变化编码于Jaynes-Cummings交换频率，并精确求解了闭系统载波动力学。\n2. 其技术核心是量子Fisher信息正比于局域耦合斜率平方且随询问时间二次增长，节点处相位参考Ramsey检测饱和联合QFI，离节点时光子计数与优化零差检测可提取腔态QFI。\n3. 这为基于腔QED的加速度精密测量提供了理论基准，并揭示了腔损耗导致有限时间QFI最优以及Lamb-Dicke条件对载波近似的控制。", "summary_source": "deepseek", "authors": [{"name": "Salman Sajad Wani"}, {"name": "Mughees Ahmed Khan"}, {"name": "Mohammad Haris Khan"}, {"name": "Fardeen Ahmad Sofi"}, {"name": "Abrar Ahmed Naqash"}, {"name": "Saif Al-Kuwari"}], "featured_authors": [{"name": "Salman Sajad Wani"}, {"name": "Mughees Ahmed Khan"}, {"name": "Mohammad Haris Khan"}, {"name": "Fardeen Ahmad Sofi"}, {"name": "Abrar Ahmed Naqash"}, {"name": "Saif Al-Kuwari"}], "author_count": 6}, {"id": "2607.23407", "category": "quant-ph", "title": "Performance Analysis of QAOA Across Distributed Quantum Network Topologies Using SwitchQNet", "abstract": "Quantum data-center (QDC) architectures aim to scale distributed quantum computing (DQC) by interconnecting multiple quantum processing units (QPUs), but their performance depends strongly on how algorithmic communication patterns interact with entanglement generation, switch reconfiguration, and network topology. This paper studies the Quantum Approximate Optimization Algorithm (QAOA) as a graph-structured optimization workload for QDC-based distributed quantum computing. We adapt QAOA to SwitchQNet, a distributed quantum compiler framework that schedules communication and entanglement generation over switch-based QDC networks, by adding a routing generator that converts graph-dependent two-qubit cost interactions into remote-CX communication requests across QPUs. Using this extension, we evaluate QAOA instances across Clos, fat-tree, and spine-leaf topologies, measuring communication latency, EPR-pair overhead, EPR wait time, retry overhead, and sensitivity to buffer size, look-ahead depth, communication-qubit count, EPR latency, and EPR fidelity assumptions. The results show that QAOA obtains modest but consistent latency reductions, highlighting its value as a diagnostic benchmark for studying the interaction between algorithm structure, entanglement management, and quantum-network architecture.", "url": "https://arxiv.org/abs/2607.23407", "type": "理论+数值", "summary": "1. 该工作将量子近似优化算法适配至SwitchQNet分布式量子编译框架，在Clos、胖树和脊叶等多种网络拓扑上评估其分布式执行性能。\n2. 其卖点在于通过路由生成器将图依赖的双量子比特代价交互转化为跨量子处理单元的远程CX通信请求，系统测量了通信延迟、EPR对开销、等待时间及重试开销等关键性能指标。\n3. 这为利用QAOA作为诊断基准，深入理解算法结构与纠缠管理、量子网络架构之间的相互作用提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Samanvay Sharma"}, {"name": "Siyuan Niu"}, {"name": "Amin Taherkhani"}, {"name": "Michal Hajdusek"}, {"name": "Rodney Van Meter"}], "featured_authors": [{"name": "Samanvay Sharma"}, {"name": "Siyuan Niu"}, {"name": "Amin Taherkhani"}, {"name": "Michal Hajdusek"}, {"name": "Rodney Van Meter"}], "author_count": 5}, {"id": "2607.23414", "category": "quant-ph", "title": "Multiconfigurational Mixed Quantum-Classical Approach for Correlated Many-Body Dynamics", "abstract": "In this work, we introduce a multiconfigurational mixed quantum-classical many-body approach for simulating the finite-temperature correlated multi-exciton dynamics in the presence of phonon-induced static and dynamic disorder. In this mixed quantum-classical approach, the excitonic subsystem is described using a multiconfigurational wavefunction that extends beyond the mean-field limit, while the phonons are evolved quasi-classically. Using this approach, we simulate a multi-excitonic dissipative system and show how the interplay between phonon-induced dynamic disorder and exciton-exciton many-body interactions determines excitation-dependent excitonic transport and spatial correlations. Our results show that while the mean-field approach produces semi-quantitatively accurate diffusive dynamics, it does not capture the spatial correlations as expected. We find that a mean-field path approximation, where we generate pre-computed trajectories using our mean-field mixed quantum-classical approach and then perform multiconfigurational dynamics, can reproduce the spatial correlations to a good accuracy, positioning this approach as an efficient method for capturing spatial correlations in complex systems.", "url": "https://arxiv.org/abs/2607.23414", "type": "数值", "summary": "1. 本文提出一种多组态混合量子-经典多体方法，用于模拟包含声子诱导静态及动态无序的有限温度关联多激子动力学。\n2. 其技术核心在于采用超越平均场极限的多组态波函数描述激子子系统，同时让声子准经典演化，并通过平均场路径近似以低计算成本准确再现空间关联。\n3. 该工作为复杂体系中研究激子-声子耦合与多体相互作用驱动的输运及关联效应提供了高效且可扩展的模拟框架。", "summary_source": "deepseek", "authors": [{"name": "Pritha Ghosh"}, {"name": "Rajanya Sarkar"}, {"name": "Arkajit Mandal"}], "featured_authors": [{"name": "Pritha Ghosh"}, {"name": "Rajanya Sarkar"}, {"name": "Arkajit Mandal"}], "author_count": 3}, {"id": "2607.23416", "category": "quant-ph", "title": "A partial-trace matrix inequality and Werner-state distillability", "abstract": "Motivated by the equivalent partial-trace formulations of Werner-state distillability [P. Costa Rico, Lett. Math. Phys. 115, 47 (2025); S.-Y. Qi et al., Phys. Rev. A 110, 012406 (2024)], we prove a bipartite partial-trace inequality for every matrix of rank at most two. As applications, we prove the two-copy undistillability of NPT Werner states in arbitrary local dimension, thereby resolving this open problem highlighted in [P. Horodecki et al., PRX Quantum 3, 010101 (2022)]. We further prove a two-parameter extension of the matrix inequality and show that two individually one-copy-undistillable NPT Werner states cannot activate each other's one-copy distillability. We also resolve the singular-value maximization problem associated with the two-ququart case.", "url": "https://arxiv.org/abs/2607.23416", "type": "理论", "summary": "1. 该工作证明了秩不超过二的矩阵的部分迹不等式，并用于解决任意维NPT Werner态的两副本不可蒸馏性问题。\n2. 其技术核心是利用该不等式严格证明了NPT Werner态在任意局域维数下均无两副本可蒸馏性，解决了长期开放问题。\n3. 这为束缚纠缠蒸馏理论提供了关键约束，并启发了对纠缠激活及多副本蒸馏限制的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Zhiwei Song"}, {"name": "Lin Chen"}], "featured_authors": [{"name": "Zhiwei Song"}, {"name": "Lin Chen"}], "author_count": 2}, {"id": "2607.23450", "category": "quant-ph", "title": "A strong converse for stabilizer codes over Pauli channels via the blowing-up lemma", "abstract": "We prove a strong converse for quantum communication over Pauli channels within the class of stabilizer codes. If a code whose code space is a full joint eigenspace of a stabilizer group transmits above the coherent information of its own input state, its entanglement fidelity decays exponentially in the block length; the encoder may be any isometry onto that space and the decoder any channel. For memoryless channels this determines the $\\varepsilon$-quantum capacity of the class for every $\\varepsilon < 1$, so that tolerating a constant error buys no rate; for antidegradable channels, such as the depolarizing channel with error probability $p \\in [1/4, 3/4]$, that capacity is zero, while for $p \\in [1/4,1/2)$ partial-transposition bounds provably cannot certify a strong converse. The proof uses neither additivity assumptions nor semidefinite relaxations: optimal decoding succeeds precisely on an event in a product probability space, so the blowing-up lemma of Ahlswede, Gács and Körner applies, and the side information it produces is charged against the coherent information. The argument also constrains near-deterministic decoding for codes of any kind, and we isolate the encoder-side statement that would extend it to all of them.", "url": "https://arxiv.org/abs/2607.23450", "type": "理论", "summary": "1. 该工作针对Pauli信道上稳定子码，证明了强逆定理：若传输速率超过输入态的相干信息，纠缠保真度随码长指数衰减，且编码可为到稳定子空间任意等距映射，解码任意信道。\n2. 技术核心采用blowing-up引理，无需可加性假设或半定松弛，确定了稳定子码类对任意ε<1的ε-量子容量，表明容忍常数误差不提高速率；反退化信道(如去极化信道p∈[1/4,3/4])容量为零，且p∈[1/4,1/2)时部分转置界无法证明强逆。\n3. 该论证还约束了任意码的近确定性解码，并分离出扩展至所有码所需的编码器侧条件，为通过blowing-up引理研究更广码类的强逆问题提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Marco Tomamichel"}], "featured_authors": [{"name": "Marco Tomamichel"}], "author_count": 1}, {"id": "2607.23569", "category": "quant-ph", "title": "A Probabilistic Representation for Multi-State Discrete-time Quantum Walks", "abstract": "Building upon the pioneering framework of Vu (2026), we construct a probabilistic representation for three-state discrete-time quantum walks on integer lattices and validate it through empirical examples. Furthermore, we establish that this representation converges to the continuum solution of multi-state Dirac partial differential equations. Broadly, our findings demonstrate that this probabilistic paradigm serves as a robust alternative for simulating higher-dimensional quantum walks, opening new theoretical avenues to analyze quantum dynamics using classical stochastic processes.", "url": "https://arxiv.org/abs/2607.23569", "type": "理论", "summary": "1. 该工作基于Vu(2026)框架，为整数格点上的三态离散时间量子游走构建了概率表示并通过实例验证。\n2. 其核心在于证明该概率表示收敛至多态狄拉克偏微分方程的连续解，从而以经典随机过程模拟高维量子游走。\n3. 这为未来利用经典概率方法分析量子动力学提供了严格的理论桥梁与可扩展的替代方案。", "summary_source": "deepseek", "authors": [{"name": "Hoang Vu"}], "featured_authors": [{"name": "Hoang Vu"}], "author_count": 1}, {"id": "2607.23573", "category": "quant-ph", "title": "Quantum Speed Limits and the Ultimate Scaling of the Quantum Sensors", "abstract": "Quantum metrology promises sensitivity beyond classical strategies, yet it remains unsettled how quantum-enabled precision should scale with physical resources and how to interpret quantum advantage. We provide a physically grounded resource accounting that clarifies the true Heisenberg limit and resolves apparent super-Heisenberg paradoxes. We demonstrate that the Heisenberg limit is best viewed as an information-theoretic manifestation of the quantum speed limit. We illustrate these ideas with a simple, super-resolving phase-estimation protocol based on Rabi oscillations in two-level atoms driven on an $m$-photon resonance. In this setting, the phase error scales as $n^{-m/2}$, where $n$ is the average photon number. Recasting metrological sensitivity through quantum dynamical speed limits yields operational bounds that reconcile such super-resolution strategies with the standard Heisenberg interpretation and identify the relevant resources in the norm of the generator. We also revisit the common attribution of the NOON state's $1/n$ scaling to quantum entanglement. We show that such an attribution is not generic and the Heisenberg $1/n$ scaling does not, by itself, certify entanglement as the enabling resource.", "url": "https://arxiv.org/abs/2607.23573", "type": "理论", "summary": "1. 该工作通过量子速度极限的信息论诠释，为量子计量学中的海森堡极限建立了物理资源核算，并解决了表观超海森堡悖论。\n2. 其核心在于揭示基于m光子共振拉比振荡的相位估计协议中，误差标度n^{-m/2}源于生成器范数，且海森堡1/n标度自身不必然证明纠缠是关键资源。\n3. 这为量子传感器中资源识别与超分辨策略设计提供了操作界限，并重新定义了量子优势的判据。", "summary_source": "deepseek", "authors": [{"name": "Yusef Maleki"}], "featured_authors": [{"name": "Yusef Maleki"}], "author_count": 1}, {"id": "2607.23590", "category": "quant-ph", "title": "An Integrated DFT-Wannier-Quantum Embedding Pipeline for Strongly Correlated Materials: Scaling Benchmarks in Li-hBN", "abstract": "The seamless integration of Density Functional Theory (DFT) with quantum variational algorithms is essential for the predictive simulation of strongly correlated materials. In this work, we present an end-to-end computational pipeline - comprising DFT geometry relaxation, non-self-consistent field (NSCF) calculations, and Wannier-based orbital localization - to prepare active-space Hamiltonians for quantum embedding. We utilize the Adaptive Variational Quantum Eigensolver (ADAPT-VQE) framework, significantly enhanced by a Greedy-Operator Commutativity Partitioning (GOCP) approach and a Taylor-expanded O(5) operator evolution strategy to efficiently manage the exponential scaling of the Hilbert space. We demonstrate this framework through a systematic benchmark study of Li-hBN, mapping the system onto qubit registers and investigating the convergence behavior as the active space is expanded from 8 to 14 spatial orbitals. Our results quantify the relationship between active-space size and computational demand, identifying a critical \"scaling wall\" where classical simulation costs transition from manageable to intractable. This study provides a rigorous performance baseline for the DFT-to-ADAPT-VQE workflow and offers empirical insights into the memory and processing limits currently facing hybrid quantum-classical architectures using advanced co-processing strategies.", "url": "https://arxiv.org/abs/2607.23590", "type": "理论+数值", "summary": "1. 该工作构建了一个集成密度泛函理论几何弛豫、非自洽计算与Wannier局域轨道的端到端计算管线，为强关联材料准备活性空间哈密顿量并用于量子嵌入。\n2. 其技术核心在于利用贪心算子交换性划分与泰勒展开O(5)算子演化策略增强ADAPT-VQE框架，有效抑制希尔伯特空间指数增长的复杂性。\n3. 通过对Li-hBN系统活性空间从8到14轨道扩展的系统基准测试，量化了计算需求随尺度增长的缩放墙，为混合量子-经典架构的性能极限提供了实证基线。", "summary_source": "deepseek", "authors": [{"name": "Hermawan Kresno Dipojono"}], "featured_authors": [{"name": "Hermawan Kresno Dipojono"}], "author_count": 1}, {"id": "2607.23641", "category": "quant-ph", "title": "Optimal Dynamic Cooling of Multiple Qubits", "abstract": "We solve the closed-system problem of cooling $M$ qubits, selected from $N$ identical thermal qubits, to the lowest common local temperature allowed by unitarity. The optimal protocol consists of two conceptually distinct steps. First, a passive rearrangement assigns the largest eigenvalues of the initial state to target sectors of lowest Hamming weight, thereby minimizing the total target energy. Second, a target-only complex-Hadamard transformation within each fixed-Hamming-weight subspace equalizes the one-qubit target marginals without changing any target-sector probability or the total energy. Consequently, imposing a common local temperature costs neither cooling depth nor additional work: the constrained optimum coincides with the unconstrained passive minimum for every $N>M$ and every initial temperature. The complex-Hadamard correction may nevertheless be costly at the circuit level. We therefore derive an exact arithmetic criterion for when the same optimum can be attained by a temperature-independent computational-basis permutation alone, and exhaustively classify the resulting finite-size islands of feasibility for $M+2\\leq N\\leq 128$. At isolated temperatures, further optimal permutations can arise through numerical cancellations between different thermal eigenvalue shells. These alternative realizations may reduce implementation complexity, but they cannot improve the cooling curve already attained by the universal protocol. We also derive the exact cooling curve, prove that at least two ancillary qubits are necessary and sufficient for nontrivial cooling, and show that joint many-target cooling can strictly outperform parallel single-target strategies.", "url": "https://arxiv.org/abs/2607.23641", "type": "理论+数值", "summary": "1. 该工作解决了从N个相同热量子比特中动态冷却M个选定比特至单位性允许的最低共同局域温度的封闭系统最优协议问题。\n2. 其技术核心是将冷却分解为被动重排与复哈达玛变换两步，使共同局域温度约束下的最优与无约束被动最小值一致，并推导了计算基置换达到同一最优的精确算术准则及N≤128下的有限尺寸分类。\n3. 该工作证明至少两个辅助比特对非平凡冷却必要且充分，联合多目标冷却策略优于并行单目标策略，为低复杂度量子冷却协议的理论设计与电路实现提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Mattia Reda"}, {"name": "Massimiliano Sacchi"}, {"name": "Chiara Macchiavello"}, {"name": "Giacomo Guarnieri"}], "featured_authors": [{"name": "Mattia Reda"}, {"name": "Massimiliano Sacchi"}, {"name": "Chiara Macchiavello"}, {"name": "Giacomo Guarnieri"}], "author_count": 4}, {"id": "2607.23681", "category": "quant-ph", "title": "Mitigation of Measurement-Induced State Transitions via a Fast-Load and Fast-Clear Readout", "abstract": "High-fidelity and rapid qubit readout is essential for superconducting quantum processors, typically realized through the quantum non-demolition (QND) dispersive interaction within a qubit-resonator architecture. However, the achievable readout speed and fidelity are fundamentally limited by measurement-induced state transitions (MIST). For a transmon qubit, MIST is highly sensitive to the offset charge $n_g$ due to the charge dispersion of its higher-lying energy levels. In this work, we systematically investigate $n_g$-dependent MIST dynamics governed by the diabaticity and symmetry of pulse shaping within a charge-sensitive transmon architecture. We engineer fast-load and fast-clear pulses that effectively suppress resonator photon overshoots, thereby demonstrating a highly practical strategy to mitigate MIST without requiring complex waveforms or real-time feedback. Utilizing active gate-voltage control and rapid feedback, the measurement-induced transition probability is precisely mapped against $n_g$ and the steady-state resonator photon number, exhibiting strong agreement with numerical Floquet branch analysis. Ultimately, we evaluate the $n_g$-averaged total error probabilities for both readout and post-readout stages, verifying that a straightforward three-step pulse scheme consistently minimizes overall readout errors. Within the framework of large-scale superconducting quantum processors, this practical, hardware-free approach inherently offers a better trade-off between the readout signal-to-noise ratio and QND preservation.", "url": "https://arxiv.org/abs/2607.23681", "type": "实验", "summary": "1. 该工作系统研究了超导transmon量子比特中测量诱导态跃迁对offset电荷的依赖动力学，并通过设计快加载与快清除脉冲抑制谐振子光子过冲，提出实用的MIST缓解策略。\n2. 其核心卖点在于结合主动门电压控制与快速反馈，精确刻画MIST概率随n_g及稳态光子数的映射，且实验与Floquet分支分析高度一致。\n3. 基于简单三步脉冲方案评估n_g平均总错误概率，表明该方法在不牺牲读出信噪比的前提下有效保护量子非破坏性，为大规模超导量子处理器的高保真读出提供硬件无关路径。", "summary_source": "deepseek", "authors": [{"name": "Wei-En Lin"}, {"name": "Li-Chieh Hsiao"}, {"name": "Chen-Hsun Ma"}, {"name": "Erh-Hsiang Yeh"}, {"name": "Wei-Lun Peng"}, {"name": "Hsi-Sheng Goan"}, {"name": "Cen-Shawn Wu"}, {"name": "Yueh-Nan Chen"}, {"name": "Yung-Fu Chen"}, {"name": "Chung-Ting Ke"}, {"name": "Chii-Dong Chen"}], "featured_authors": [{"name": "Wei-En Lin"}, {"name": "Li-Chieh Hsiao"}, {"name": "Chen-Hsun Ma"}, {"name": "Yung-Fu Chen"}, {"name": "Chung-Ting Ke"}, {"name": "Chii-Dong Chen"}], "author_count": 11}, {"id": "2607.23683", "category": "quant-ph", "title": "Qutrit-Based Neural Quantum Kernels for Classification Tasks", "abstract": "Neural quantum kernels (NQKs) construct quantum kernels by pretraining a quantum neural network (QNN) and subsequently reusing the trained circuit as a task-adapted embedding. Extending this framework to qudits, with local unitaries in $\\mathrm{SU}(d)$, provides a natural route to richer data embeddings through the increased local degrees of freedom and a direct interface for multiclass classification via intrinsically multi-level quantum systems. In this work, focusing on qutrits ($d=3$), we extend NQKs to the qudit setting and perform a systematic study of key design choices, including the number of encoded features, the number of qutrits, the kernel construction (1-to-$n$ and $n$-to-$n$), and the parameterization of $\\mathrm{SU}(3)$ unitaries. Across binary and three-class tasks on four benchmark datasets, qutrit NQKs improve over the corresponding QNN baselines in nearly all settings considered and can benefit from scaling both the feature budget and the system size, although the magnitude of these gains may saturate, is dataset-dependent, and depends on the chosen parameterization. In particular, an ablation over $\\mathrm{SU}(3)$ parameterizations shows that the unitary representation can substantially impact both optimization behaviour and classifier performance. These findings highlight the potential of qudit-based quantum models not only as a straightforward generalization of qubit-based architectures, but also as a promising means to better exploit complex data structures in quantum machine learning.", "url": "https://arxiv.org/abs/2607.23683", "type": "理论+数值", "summary": "1. 该工作将神经量子核框架推广至qutrit系统，系统研究了特征编码数量、qutrit数、核构造方式及SU(3)幺正参数化等设计选择。\n2. 核心卖点在于通过增加局部自由度及多层级量子系统实现更丰富的数据嵌入，并揭示SU(3)参数化对优化行为和分类性能的关键影响。\n3. 这为利用qudit模型更高效地处理复杂数据结构提供了明确路径，表明其不仅是qubit架构的自然推广，更是量子机器学习中值得进一步探索的方向。", "summary_source": "deepseek", "authors": [{"name": "Camila Cristiano-Romero"}, {"name": "Pablo Rodriguez-Grasa"}, {"name": "Mikel Sanz"}], "featured_authors": [{"name": "Camila Cristiano-Romero"}, {"name": "Pablo Rodriguez-Grasa"}, {"name": "Mikel Sanz"}], "author_count": 3}, {"id": "2607.23727", "category": "quant-ph", "title": "Can PCE solve the factorisation problem via optimisation?", "abstract": "The ongoing progress in quantum technologies has fueled a sustained exploration of their potential applications across various domains, particularly in computational problems that are considered intractable for classical systems. Among these problems, integer factorisation remains of special interest due to its relevance to widely used cryptographic schemes such as RSA. Among the different possibilities, one approach to factorisation is to convert the problem into a binary optimisation problem. However, current proposals usually need a large number of qubits that make them unfeasible within the current hardware. In this work, we investigate a possible adaptation of the Pauli Correlation Encoding (PCE) algorithm to the factorisation problem. Due to its compression capability, it can drastically reduce the number of needed qubits. The proposed approach explores how the structure and dynamics of the PCE framework may be employed to encode and analyze candidate factor relations within a quantum computational setting. Rather than presenting a replacement for established quantum factorisation methods, this study aims to provide a preliminary examination of the feasibility and limitations of the proposed adaptation. We discuss the algorithmic design, its conceptual relationship with existing quantum approaches, and the practical constraints associated with implementation on current or near-term quantum hardware. Initial observations suggest that the method may offer an alternative perspective for studying factorisation within the broader context of quantum computation, although no claim is made regarding computational advantage. These results are intended primarily as an exploratory contribution to ongoing research in quantum algorithms and computational number theory.", "url": "https://arxiv.org/abs/2607.23727", "type": "理论+数值", "summary": "1. 该工作探索了将Pauli Correlation Encoding (PCE)算法应用于整数因子分解问题的可行性，通过将问题转化为二进制优化问题来减少所需的量子比特数量。\n2. 其技术卖点在于PCE的压缩能力显著降低了硬件资源需求，并利用其框架结构和动力学特性来编码和分析候选因子关系。\n3. 尽管尚未声称计算优势，但该方法为在近期量子硬件上研究因子分解问题提供了替代视角，并对量子算法与计算数论的交叉研究具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Fernando Alonso"}, {"name": "Colomán Samprón"}, {"name": "Jacobo Veiga"}, {"name": "Andrés Gómez"}], "featured_authors": [{"name": "Fernando Alonso"}, {"name": "Colomán Samprón"}, {"name": "Jacobo Veiga"}, {"name": "Andrés Gómez"}], "author_count": 4}, {"id": "2607.23773", "category": "quant-ph", "title": "Quantum Separability in Polynomial Time", "abstract": "The quantum separability problem asks whether a bipartite density matrix is separable or is $\\eta$-far from every separable state. We give a randomized polynomial-time algorithm for this problem for every fixed constant gap $\\eta>0$, when distance is measured in the Euclidean norm.", "url": "https://arxiv.org/abs/2607.23773", "type": "理论+数值", "summary": "1. 本文给出了一个随机多项式时间算法，用于判定双体密度矩阵是否为可分离态或在欧几里得范数下与所有可分离态相距至少固定常数η。\n2. 该算法的卖点在于通过凸优化与随机化技术，首次实现了对任意固定常数η>0的量子可分离性问题的多项式时间求解。\n3. 这为纠缠检测与量子信息理论中的基本问题提供了高效的算法工具，有望推动相关实验和理论研究的进展。", "summary_source": "deepseek", "authors": [{"name": "Giulio Malavolta"}], "featured_authors": [{"name": "Giulio Malavolta"}], "author_count": 1}, {"id": "2607.23847", "category": "quant-ph", "title": "A Slice-Rank Drift Bound for Random Quantum \\(k\\)-SAT", "abstract": "Random quantum satisfiability is a natural quantum analogue of random constraint satisfaction and a basic model for frustration-free local Hamiltonians. Despite extensive work on its satisfiable and unsatisfiable regimes, the quantitative location of the random quantum \\(k\\)-SAT threshold has remained poorly understood, with the best general upper bounds leaving a large gap to the known lower bounds. In this paper we prove a new upper bound on the satisfiability threshold of random quantum \\(k\\)-SAT. Our result improves the previously known asymptotic upper bound by a factor of order \\(k\\), giving a bound of order \\(2^k/k\\). The improvement is also significant at small values of \\(k\\); in particular, for random quantum \\(3\\)-SAT we obtain a substantially smaller explicit upper bound than the one previously available. The proof combines the geometric formulation of generic quantum satisfiability with a dimension-decay analysis of the full satisfying subspace. The key input is a multiplicative Shearer-type inequality for tensor-product subspaces, which quantifies how global dimension forces nontrivial local dimension on typical sets of qubits.", "url": "https://arxiv.org/abs/2607.23847", "type": "理论", "summary": "1. 该工作证明了随机量子k‑SAT可满足性阈值的一个新上界，改进因子为k量级。\n2. 其技术核心在于结合几何形式与维度衰减分析，并引入张量积子空间的乘性Shearer型不等式。\n3. 这为精确确定随机量子约束满足问题阈值及理解纠缠结构提供了新工具。", "summary_source": "deepseek", "authors": [{"name": "Jean Bernoulli Ravelomanana"}], "featured_authors": [{"name": "Jean Bernoulli Ravelomanana"}], "author_count": 1}, {"id": "2607.23956", "category": "quant-ph", "title": "Dynamical Quantum Phase Transitions in a Pseudo-Hermitian Hamiltonian: The Imbalanced-Pairing Kitaev Model", "abstract": "Although parity-time (PT)-symmetric Hamiltonians are often associated with real energy spectra, PT symmetry is neither a sufficient nor a necessary condition for a real spectrum. More generally, real spectra are associated with the broader class of pseudo-Hermitian Hamiltonians, of which PT-symmetric Hamiltonians constitute a simple subclass. Here, we investigate the nonequilibrium dynamics of the imbalanced-pairing Kitaev model, a prototypical pseudo-Hermitian system, under a linearly time-dependent chemical potential. The dynamics are analyzed within the biorthogonal framework using the concept of dynamical quantum phase transitions (DQPTs). We show that, under a linear ramp protocol, DQPTs occur only when the post-ramp Hamiltonian possesses a real energy spectrum. For positive values of the non-Hermiticity parameter ($\\gamma>0$), where the energy spectrum remains entirely real, a ramp crossing a single quantum critical point gives rise to a single family of critical times, analogous to the Hermitian case. Furthermore, for ramps crossing two critical or exceptional points, the critical sweep velocity above which DQPTs disappear decreases as the non-Hermiticity parameter is reduced and vanishes in the staggered-pairing limit, $\\gamma=-1$.", "url": "https://arxiv.org/abs/2607.23956", "type": "理论+数值", "summary": "1. 该工作通过线性变化化学势驱动，在双正交框架下研究了伪厄米不平衡配对Kitaev模型中的动力学量子相变。\n2. 核心发现是此类相变仅当后斜坡哈密顿量能谱全实时出现，且跨越两个临界或异常点时消失的临界速度随非厄米参数减小而下降，并于交错配对极限归零。\n3. 这建立了非厄米体系中动力学相变与能谱实性的直接关联，为利用非厄米调控探索量子临界动力学提供了可检验的理论预言。", "summary_source": "deepseek", "authors": [{"name": "R. Jafari"}, {"name": "Alireza Akbari"}, {"name": "Shukhrat Mardonov"}, {"name": "H. Yavartanoo"}], "featured_authors": [{"name": "R. Jafari"}, {"name": "Alireza Akbari"}, {"name": "Shukhrat Mardonov"}, {"name": "H. Yavartanoo"}], "author_count": 4}, {"id": "2607.23959", "category": "quant-ph", "title": "Scalable Photon-Mediated Two-Qubit Gates with Spectrally Noisy Quantum Emitters", "abstract": "When two quantum bits are coupled through a cavity, a two-qubit gate can be realized between them either in the near-resonant regime over a timescale established by the coupling strength of the qubits with the cavity, or in the dispersive regime, over a longer timescale established by the combination of the coupling strength and the frequency detuning between the qubits and the cavity. When the qubits are spectrally noisy or differently detuned from the cavity, the fidelity for the operation can be drastically reduced in either case, precluding scalable realizations. We introduce the protocol for optimal cavity-enabled gates (POCEG) that is shown, through reliable numerical and analytical solutions, to overcome spectral differences between quantum bits and to achieve high fidelity between disparate/noisy quantum emitters. Namely, for a cavity with low damping rate, we apply a sequence of pulses to the qubits at the frequency of the cavity while periodically modulating the coupling of the qubits to the cavity. Alternatively, in the case of a large damping rate, we operate in the dispersive regime and overcome spectral disparities by applying the pulses at a frequency far-detuned from the cavity. In both instances, we find for the quantum state transfer between the two qubits that, with a modest inter-pulse delay, the fidelity that would otherwise be strongly suppressed by the spectral mismatch of the qubits can be increased beyond 99.9%. These protocols have the capacity to bring two-qubit gates between solid state systems across the threshold required for fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2607.23959", "type": "数值", "summary": "1. 该工作提出一种针对光谱噪声或失谐量子发射器的腔辅助两比特门协议(POCEG)，以解决可扩展性难题。\n2. 其技术核心是通过在腔频或远离腔频施加脉冲并周期调制量子比特-腔耦合，分别适用于低或高阻尼腔，将量子态转移保真度提升至99.9%以上。\n3. 这一方案有望使固态量子比特系统达到容错量子计算所需的两比特门保真度阈值，推动规模化实现。", "summary_source": "deepseek", "authors": [{"name": "Shreekanth S. Yuvarajan"}, {"name": "W. A. Coish"}, {"name": "David Hucul"}, {"name": "Herbert F. Fotso"}], "featured_authors": [{"name": "Shreekanth S. Yuvarajan"}, {"name": "W. A. Coish"}, {"name": "David Hucul"}, {"name": "Herbert F. Fotso"}], "author_count": 4}, {"id": "2607.23988", "category": "quant-ph", "title": "Scaling a CUDA-Q GQE + QSCI pipeline to 40 qubits for EUV photoresist chemistry", "abstract": "We scale a CUDA-Q-native pipeline coupling a generative quantum eigensolver (GQE) to quantum-selected configuration interaction (QSCI) across active spaces of 14 to 44 qubits, applied to the extreme-ultraviolet (EUV) photoresist chemistry of monoalkyltin oxo-hydroxides. A GPT-2 policy emits UCCSD operator sequences; sampled bitstrings become determinants, diagonalised classically, and a cross-circuit generalised-eigenvalue refinement makes every reported GQE+QSCI energy a variational upper bound. Every rung from 14 to 40 qubits carries an exact CASCI or FCI reference, up to 166 million determinants for SnO at 32 qubits. The pipeline is chemically accurate, below 1.6 mHa, through 30 qubits on methyltin trihydroxide and through 32 on SnO, on the best seed at the top rungs. Circuit depth rather than training length is the scaling lever; the refined subspace grows near-linearly with the operator count while staying a vanishing fraction of the determinant space, 0.017% at the 32-qubit SnO rung. It also runs on the 54-qubit IQM Emerald processor, at the shallow depths its routed two-qubit gates allow, reaching +0.330 mHa for SnO at 14 qubits from a CCSD-amplitude-ordered pool prefix and +3.92 mHa for the industrial n-butyltin ligand at 22 qubits from depth-truncated trained circuits under per-circuit readout self-calibration, 81% of the active-space correlation; classical configuration recovery on those counts tightens the 22-qubit result to +0.18 to 0.21 mHa. For the methyl resist, ionisation collapses the classical UCCSD(T) Sn-C bond dissociation energy from 72.6 to 21.2 kcal/mol, the switch that flips solubility on exposure. Against that, the 40-qubit result is support-limited at 22.8 mHa, the full trained ansatz on hardware awaits better fidelities, and classical subspace expansion reaches the 32 to 40-qubit spaces with no quantum sampler, so that boundary is mapped, not beaten.", "url": "https://arxiv.org/abs/2607.23988", "type": "理论+数值", "summary": "1. 该工作将生成量子本征求解器与量子选定组态相互作用耦合的CUDA-Q流水线扩展至40量子比特，用于单烷基锡氧氢氧化物的极紫外光刻胶化学计算。\n2. 其技术核心在于电路深度而非训练步数是缩放杠杆，子空间随算子数近线性增长且仅占行列式空间的0.017%，并在54量子比特IQM处理器上通过深度截断与自校准达到1.6 mHa以内的化学精度。\n3. 这为利用当前含噪量子处理器研究实际光刻胶反应提供了可扩展的混合量子经典框架，但40量子比特结果限于22.8 mHa，该边界仅被映射而非攻克，提升保真度方能实现更大活性空间的化学精度。", "summary_source": "deepseek", "authors": [{"name": "Karim Elgammal"}, {"name": "Marc Maußner"}], "featured_authors": [{"name": "Karim Elgammal"}, {"name": "Marc Maußner"}], "author_count": 2}, {"id": "2607.23990", "category": "quant-ph", "title": "DeComp2: Description Complexity aware Decomposition", "abstract": "Quantum compilers optimize execution-only proxies such as gate count, depth, and fidelity, treating the compiled circuit as the unit of cost. This conflates two distinct resources, how much the substrate has to do at run time, and how much has to be said to describe what to do. Unrolling a looped program leaves run-time cost unchanged while erasing the hierarchical structure on which downstream optimization and reuse rely. We propose lifting the compiler objective from execution to life cycle complexity by pairing the circuit complexity $\\mathcal{C}_{\\mathrm{circ}}$ with a Kolmogorov-style description complexity $\\mathcal{C}_{\\mathrm{Kol}}$ of the emitted circuit, and minimizing the additive total $\\mathcal{C}_{\\mathrm{tot}} = \\alpha\\,\\mathcal{C}_{\\mathrm{circ}} + \\beta\\,\\mathcal{C}_{\\mathrm{Kol}}$. The mirrors the additive positional and kinetic entropy of the second law of quantum complexity, and reads as a minimum-description-length regularizer over the otherwise degenerate set of $\\mathcal{C}_{\\mathrm{circ}}$-minimizers. We instantiate the objective on $SU(2)$ through exhaustive HT-enumeration with compression-based surrogates upper-bounding $\\mathcal{C}_{\\mathrm{Kol}}$. Across a Haar-representative target grid the two surrogates correlate positively with $\\mathcal{C}_{\\mathrm{circ}}$ yet break its rank order on a non-trivial fraction of points, ruling out a tight functional dependence. With calibrated weights the joint cost selects, for a small but operationally meaningful fraction of targets, a candidate that is neither the shortest nor the most compressible HT-string in the $\\varepsilon$-ball, exhibiting the compilation choices a $\\mathcal{C}_{\\mathrm{circ}}$-only optimizer discards and motivating $\\mathcal{C}_{\\mathrm{Kol}}$ as an active optimization signal for hierarchical intermediate representation for compiler.", "url": "https://arxiv.org/abs/2607.23990", "type": "理论+数值", "summary": "1. 该工作提出了DeComp2框架，将Kolmogorov描述复杂度与电路复杂度联合作为量子编译的优化目标，以总复杂度最小化取代传统执行指标。\n2. 其技术核心是通过压缩代理上界估计描述复杂度，并在Haar均匀目标网格上揭示了两类复杂度存在非平凡序关系破坏，排除了简单函数依赖。\n3. 这为量子编译器引入生命周期视角的层次化优化提供了理论依据，并激励在中间表示中主动利用描述复杂度作为结构感知的优化信号。", "summary_source": "deepseek", "authors": [{"name": "Aritra Sarkar"}], "featured_authors": [{"name": "Aritra Sarkar"}], "author_count": 1}, {"id": "2607.23996", "category": "quant-ph", "title": "Recoverable Quantum Computation: An Information-Centric Paradigm for Quantum Computing with Errors", "abstract": "Quantum computing promises transformative advances in computation, communication, sensing, and machine learning. Yet the realization of large-scale fault-tolerant quantum computers remains hindered by the enormous overhead required for quantum error correction. This challenge raises a fundamental question: Must useful quantum computing wait until fully fault-tolerant quantum hardware becomes available? In this Perspective, we propose Recoverable Quantum Computation (RQC), an information-centric paradigm for quantum computing with errors. Rather than requiring faithful preservation of the complete quantum state, RQC focuses on preserving the computational information required to accomplish a given task. A quantum computation is considered recoverable if the desired computational information can be extracted from noisy quantum outputs with an overhead that preserves quantum advantage relative to the best known classical method. We introduce recoverability as an operational principle for evaluating noisy quantum computations and propose practical metrics based on recovery overhead and recoverability efficiency. We illustrate the framework using quantum Fourier transform period estimation on IBM quantum hardware and a conceptual example from quantum machine learning, demonstrating that useful computational information may remain recoverable despite significant physical errors. Building on these examples, we propose a preliminary classification of quantum applications according to their expected recoverability and outline a research roadmap toward a predictive theory of recoverability. RQC is intended not as an alternative to fault-tolerant quantum computing, but as a complementary paradigm for understanding and evaluating useful quantum computation in the broad intermediate regime between today's noisy quantum processors and tomorrow's fault-tolerant quantum computers.", "url": "https://arxiv.org/abs/2607.23996", "type": "理论+数值", "summary": "1. 该工作提出可恢复量子计算（RQC）这一以信息为中心的范式，用于在存在错误的情况下进行有用量子计算。\n2. 其核心在于引入可恢复性操作原则与基于恢复开销和可恢复性效率的度量，使计算信息即便在物理噪声下仍可提取并保持量子优势。\n3. 这为从当前噪声处理器到未来容错量子计算机的中间区域提供了评估与分类框架，推动了可恢复性预测理论的研究路线。", "summary_source": "deepseek", "authors": [{"name": "Shengwang Du"}], "featured_authors": [{"name": "Shengwang Du"}], "author_count": 1}, {"id": "2607.24014", "category": "quant-ph", "title": "Scalable Quantum Machine Learning: Trainability, Expressivity and Efficiency", "abstract": "Designing scalable parameterized quantum circuits for machine learning faces three fundamental obstacles: barren plateaus that prevent gradient-based training, the absence of provable guarantees that the learned function class is classically hard, and prohibitive circuit evaluations per gradient step. We propose the unitary brick-wall: a $k$-particle fermionic architecture for nearest-neighbor hardware, combining Reconfigurable Beam Splitter gates with interleaved single-qubit phase gates and a non-Gaussian magic-state encoding, where the particle number $k$ is a tunable dial trading classical simulation hardness against training cost. Trainable. The brick-wall has dynamical Lie algebra $\\mathfrak{u}(n)$ and directly parametrizes $U(n)$ via Givens rotations, enabling Haar initialization. Two-body correlator readouts achieve gradient variance $\\Theta(k^2/n^5)$. Expressive. Classical hardness is controlled by the particle number $k$: best-known classical algorithms for sampling and for two-body expectation values run in time $2^{\\Theta(k)}\\mathrm{poly}(n)$, worst-case #P-hardness holds at $k = n^{\\epsilon}$, and average-case hardness applies at $k = \\Theta(n)$. Efficient. A multi-layer parallel parameter-shift rule computes all $O(n^2)$ gradients from $k(8n+4)$ circuit evaluations per gradient step, a factor $3n/(8k)$ reduction over the $3n^2$ evaluations required by the standard parameter-shift rule. The unitary butterfly variant targets all-to-all hardware, with depth $2\\log n$ and $n\\log n$ parameters. It achieves similar hardness guarantees at $8k\\log n$ evaluations per gradient step, the same factor $3n/(8k)$ reduction. Its trainability is established at two levels: the absence of exponential barren plateaus is unconditional, whereas the sharp $\\Theta(k^2/n^5)$ rate holds under a two-particle approximate-2-design conjecture.", "url": "https://arxiv.org/abs/2607.24014", "type": "理论+数值", "summary": "1. 该工作提出基于k粒子费米子砖墙架构的可扩展量子机器学习方案，同步处理可训练性、表达性与效率三大核心障碍。\n2. 其技术核心在于使用动力学李代数u(n)实现Haar初始化，通过粒子数k调控经典模拟硬度，并采用多层并行参数平移规则将梯度评估次数由3n²降至k(8n+4)。\n3. 该架构在无条件避免指数级贫瘠高原的同时，以两粒子近似2-design猜想为基础获得Θ(k²/n⁵)的梯度方差速率，为近期量子硬件上的可训练量子机器学习提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Iordanis Kerenidis"}], "featured_authors": [{"name": "Iordanis Kerenidis"}], "author_count": 1}, {"id": "2607.24050", "category": "quant-ph", "title": "Pound-Drever-Hall Feedforward for Trapped-Ion Optical Qubits", "abstract": "Laser phase noise is one of the limiting factors that dictate gate fidelities and coherence times in trapped-ion quantum systems. Previous studies have reported that when the Rabi frequency of an ion qubit is close to the servo-bump phase-noise frequency, the driving laser limits the fidelity and coherence time. This issue has typically been mitigated by choosing a Rabi frequency outside the servo-bump region. However, this constrains the usable range of gate speeds and can limit the achievable fidelity. To address this issue, we developed an active phase-noise stabilization system for a barium-ion optical-qubit laser at 1762 nm, employing a fiber electro-optic modulator (EOM) with an electrical feedforward servo. Our results demonstrate that this setup, based on the Pound-Drever-Hall (PDH) feedforward method, can suppress servo-bump phase noise by 15 dB near the bump peak frequency in our locking system. The laser phase noise is analyzed using delayed self-heterodyne interferometry (DSHI). We further tested the stabilized laser on an optical qubit and observed a clear improvement in coherence time based on the measured amplitude decay of Rabi oscillations, even when the Rabi frequency lies within the servo-bump bandwidth. This technique can be readily adapted to other optical qubits with minimal modifications.", "url": "https://arxiv.org/abs/2607.24050", "type": "理论", "summary": "1. 该工作开发了基于Pound-Drever-Hall前馈的主动相位噪声稳定系统，用于囚禁离子光学量子比特的1762 nm激光，并实验验证了其对相干时间的改善。\n2. 关键技术在于利用电前馈伺服通过光纤电光调制器抑制伺服凸起相位噪声达15 dB，使拉比频率在伺服凸起带宽内仍能保持较长相干时间。\n3. 该方法可便捷地推广至其他光学量子比特，为克服激光相位噪声对门保真度和相干时间的限制提供了一条实用途径。", "summary_source": "deepseek", "authors": [{"name": "Jia-Yang Gao"}, {"name": "Jianwei Lee"}, {"name": "Morteza Ahmadi"}, {"name": "Manas Mukherjee"}], "featured_authors": [{"name": "Jia-Yang Gao"}, {"name": "Jianwei Lee"}, {"name": "Morteza Ahmadi"}, {"name": "Manas Mukherjee"}], "author_count": 4}, {"id": "2607.24067", "category": "quant-ph", "title": "Non-classical photon statistics in frequency-modulated double quantum dot cavity systems", "abstract": "The quantum dynamics of a double quantum dot two-level system, coupled to a leaking microwave resonator mode, is theoretically investigated. The double quantum dot is driven by applying a continuous field giving rise to time-dependent modulations of its energy separation between the ground levels of each dot, forming the qubit. Therefore, the cavity resonances occur when the difference between the resonator and the qubit frequencies equals the multiple of the modulation frequency, respectively. In the strong Coulomb interaction limit and the weak couplings of the combined system, i.e. the qubit and the single-mode cavity, to corresponding electronic, phononic or photonic reservoirs, we have demonstrated that the output cavity electromagnetic field is formed of a single-photon flux obeying the sub-Poissonian quantum photon statistics. This was proved via Fano's factor behaviour or by comparing the resonator's second- and third-order photon correlation functions, respectively. The phonon, the cavity mode dephasing or the environmental temperatures influence on the quantum properties of the photons are also discussed.", "url": "https://arxiv.org/abs/2607.24067", "type": "数值", "summary": "1. 该工作从理论上研究了由连续场驱动导致能隙周期性调制的双量子点两能级系统与泄漏微波谐振腔耦合时的量子动力学，并分析了输出腔场的光子统计特性。\n2. 其核心物理卖点在于：通过调制使腔频与量子比特频差等于调制频率整数倍时产生共振，在强库仑相互作用及系统-电子/声子/光子库弱耦合下，输出腔场表现为Fano因子小于1及高阶关联函数呈现反聚束效应的亚泊松单光子通量，从而验证了非经典光子统计的产生。\n3. 该工作不仅为利用固态量子点腔系统实现片上可控单光子源提供了理论依据，还系统揭示了声子耦合、腔模退相及环境温度对光子量子统计的影响机制，为后续实验优化退相控制与温度条件以提升光子非经典品质指明了方向。", "summary_source": "deepseek", "authors": [{"name": "T. Mihaescu"}, {"name": "A. Isar"}, {"name": "M. A. Macovei"}], "featured_authors": [{"name": "T. Mihaescu"}, {"name": "A. Isar"}, {"name": "M. A. Macovei"}], "author_count": 3}, {"id": "2607.24127", "category": "quant-ph", "title": "Tree Tensor Network Reservoir Computing: Hierarchical Ensemble with Invariant Phase Boundaries", "abstract": "We propose Tree Tensor Network Reservoir Computing (TTN-RC), a quantum-inspired reservoir computing framework for time-series prediction that uses the hierarchical structure of Tree Tensor Networks as a random reservoir. To control the exponential concentration or divergence of TTN outputs, we introduce a hierarchical ensemble method that partitions a fixed-size reservoir into multiple independent sub-reservoirs. In the tested NARMA benchmarks, TTN-RC achieves competitive or improved performance compared with conventional Echo State Networks, especially for tasks requiring higher-order nonlinear processing and longer contextual dependence. We also derive an expected contraction rate based on the reservoir Jacobian and develop a mean-field description of the reservoir-state statistics. These analyses identify an asymptotic stability boundary at $\\sigma_{T}=\\sqrt{2}$ in the large per-tree-size limit, where several theoretical indicators converge. Our results provide a design principle for tensor-network-based reservoir computing and clarify how hierarchical reservoir topology controls stability and nonlinear information processing.", "url": "https://arxiv.org/abs/2607.24127", "type": "理论+数值", "summary": "1. 该工作提出树张量网络储层计算框架，利用其层次随机结构进行时间序列预测，并在NARMA基准中展现优于传统回声状态网络的性能。\n2. 其技术核心在于引入层次集成方法抑制输出指数发散，并基于储层雅可比矩阵推导出收缩率与平均场描述，识别出大树极限下的渐近稳定性边界σ_T=√2。\n3. 这为张量网络储层计算提供了层次拓扑控制稳定性与非线性信息处理能力的设计原则，启发相关量子启发或经典时间序列模型的进一步分析。", "summary_source": "deepseek", "authors": [{"name": "Daiki Sasaki"}, {"name": "Chih-Chieh Chen"}, {"name": "Tomah Sogabe"}], "featured_authors": [{"name": "Daiki Sasaki"}, {"name": "Chih-Chieh Chen"}, {"name": "Tomah Sogabe"}], "author_count": 3}, {"id": "2607.24129", "category": "quant-ph", "title": "Local Universality and Structural Certificates for Minimal Fixed-Depth Two-Qutrit Gate Decomposition", "abstract": "We study a dimension-saturating fixed-core ansatz in which four copies of a fixed, non-tunable two-qutrit core $K\\in SU(9)$ are interleaved with five adjustable local layers from $L=SU(3)\\otimes SU(3)$. Since $\\dim SU(9)=80$ and $5\\dim L=80$, this is the shortest fixed-core architecture not excluded by parameter counting. We formulate the smooth map $\\Phi_K:L^5\\to SU(9)$ and use its right-trivialized differential to give verifiable certificates for local universality. We construct an explicit Clifford-word core whose Pauli-label splitting makes the identity-point differential an exact isometry, and we classify all 2304 symplectic actions satisfying the same splitting criterion. We also prove a structural obstruction for an important symmetry class: every complex-symmetric core $K=K^{T}$, including every core generated by a time-independent real-symmetric Hamiltonian in the chosen computational basis, has identity-point differential rank at most 78; hence any full-rank certificate for such a core must occur away from that point. We then assess a hardware-motivated superconducting core generated by a noncommuting, temporally asymmetric drive. Direct calculation verifies $K_{\\rm sc}\\neq K_{\\rm sc}^{\\mathsf T}$, and the core achieves $F_{\\rm avg}\\ge 0.999$ for all 1000 Haar-random targets tested under the stated restart protocol. We also report favorable sampled Jacobian-rank, structured-target, and robustness diagnostics. These results establish local universality at the parameter-counting-minimal, dimension-saturating depth, with an exact Clifford certificate complemented by a hardware-motivated numerical case study. Throughout, we separate exact local certificates from numerical evidence for broader synthesis performance.", "url": "https://arxiv.org/abs/2607.24129", "type": "理论+数值", "summary": "1. 该工作研究了维数饱和的固定核心ansatz，其中四个不可调双qutrit核心与五个可调局域层交错，构造了参数计数最小深度下的局域普适性理论。\n2. 技术卖点在于给出了可验证的局域普适性判据：显式构造了Clifford字核心使恒等点微分精确等距，并证明复对称核心的恒等点微分秩至多为78。\n3. 这为基础门分解的精确解析证书与硬件驱动数值验证分离提供了明确框架，指导了维度饱和架构下的量子编译与实验实现。", "summary_source": "deepseek", "authors": [{"name": "Yurui Liu"}, {"name": "Ruoting Dou"}, {"name": "Peng Xu"}, {"name": "Xinsheng Tan"}, {"name": "Shengjun Wu"}, {"name": "Yang Yu"}, {"name": "Zeng-Bing Chen"}], "featured_authors": [{"name": "Yurui Liu"}, {"name": "Ruoting Dou"}, {"name": "Peng Xu"}, {"name": "Shengjun Wu"}, {"name": "Yang Yu"}, {"name": "Zeng-Bing Chen"}], "author_count": 7}, {"id": "2607.24195", "category": "quant-ph", "title": "Parallelizable Exact Synthesis of Quantum Circuits via Semi-Tensor Product", "abstract": "Exact synthesis is a useful tool in quantum compilation by providing optimal alternative implementations of small circuit shards and is widely used as a circuit re-synthesis optimization kernel. However, existing exact synthesis methods suffer from encoding overhead, poor parallel scalability, and memory bottlenecks. This paper introduces a parallel exact synthesis framework for CNOT and phase polynomial circuits, which is based on the semi-tensor product (STP) theory of matrices. By enumerating undirected partial-gate topologies and solving the missing gate directions separately, we are able to parallelize both stages and achieve a parallel speedup of up to $12.8\\times$ with 32 workers on this NP-hard problem. More specifically, for each topology, the circuit semantics are converted into canonical STP formulas, and feasibility is decided by a right-to-left factorization procedure that removes infeasible direction assignments. On randomly generated synthesis targets, STP is typically $100\\times-1000\\times$ faster than the SAT-based baseline on small instances, and remains competitive for more difficult instances. When integrated in a real-world circuit optimization workflow, our algorithm outperforms the SAT-based approach on 89% of cases in QASMBench, and achieves a median speedup of $1.91\\times$.", "url": "https://arxiv.org/abs/2607.24195", "type": "理论+数值", "summary": "1. 该工作提出基于半张量积理论的可并行精确合成框架，用于CNOT与相位多项式量子电路。\n2. 其核心在于通过枚举无向部分门拓扑并独立求解门方向实现并行化，并利用从右至左因式分解判定STP公式可行性。\n3. 该方法在随机实例上比SAT基线快三个数量级，并可在真实优化流程中实现中位1.91倍加速，为量子编译器中的重合成核提供可扩展方案。", "summary_source": "deepseek", "authors": [{"name": "Chenjian Li"}, {"name": "Dingchao Gao"}, {"name": "Xiangzhen Zhou"}, {"name": "Ji Guan"}, {"name": "Pengcheng Zhu"}, {"name": "Zhufei Chu"}], "featured_authors": [{"name": "Chenjian Li"}, {"name": "Dingchao Gao"}, {"name": "Xiangzhen Zhou"}, {"name": "Ji Guan"}, {"name": "Pengcheng Zhu"}, {"name": "Zhufei Chu"}], "author_count": 6}, {"id": "2607.24258", "category": "quant-ph", "title": "MPStab: an hybrid stabilizers tensor-network quantum circuit simulator", "abstract": "The development of techniques for simulating quantum systems using classical computers is a paramount task for two primary reasons: i) there exist configurations for which classical computers are remarkably effective and will continue to be so, and ii) exploring the limits of classical computation facilitates the identification of the regimes of competence for quantum computers. In this work, we present MPStab, a quantum circuit simulator based on a hybrid formalism combining stabilizers and tensor networks, recently introduced in Ref. [1]. We present the package, its core functionalities, and explore its performances in a few interesting simulation regimes.", "url": "https://arxiv.org/abs/2607.24258", "type": "数值", "summary": "1. 该工作提出了一个基于混合稳定子与张量网络形式的量子电路模拟器MPStab。\n2. 其技术核心在于将稳定子表示与张量网络收缩有机融合，在若干关键模拟区间展现了性能优势。\n3. 这为经典模拟量子电路的极限探索及量子计算优势区域界定提供了具体工具与基准测试框架。", "summary_source": "deepseek", "authors": [{"name": "Giulio Crognaletti"}, {"name": "Mattia Robbiano"}, {"name": "Michele Grossi"}, {"name": "Matteo Robbiati"}], "featured_authors": [{"name": "Giulio Crognaletti"}, {"name": "Mattia Robbiano"}, {"name": "Michele Grossi"}, {"name": "Matteo Robbiati"}], "author_count": 4}, {"id": "2607.24309", "category": "quant-ph", "title": "On the two-copy distillability of Werner states and a new partial trace inequality", "abstract": "Problem 5 in {\\it Five Open Problems in Quantum Information Theory} [PRX Quantum 3, 010101 (2022)], asks whether the two-ququart Werner state $\\varrho(4,-\\tfrac12)$ is two-copy distillable, where $\\varrho(d,\\alpha)=(I+\\alpha F)/(d^2+\\alpha d)$. We answer it in the negative. To this end, we show the following stronger statement: for all $C\\in M_{d_1d_2}(\\mathbb{C})$ of rank at most $r \\le d_1 d_2$, $\\mathrm{tr}_1(C)\\|_F^2+\\|\\mathrm{tr}_2(C)\\|_F^2 \\le r\\|C\\|_F^2+\\frac{1}{r}|\\mathrm{tr}(C)|^2$. A result by Costa Rico on the equivalence of this inequality with two-copy undistillability at $r = 2$ then settles Problem 5: $\\varrho(4,-\\tfrac{1}{2})$ is not two-copy distillable. Furthermore, we show that $\\varrho(d,\\alpha)$ is two-copy undistillable for every $d\\ge2$, if and only if $\\alpha\\ge-\\tfrac{1}{2}$. Thus, the one and two-copy distillability regions of $\\varrho(d,\\alpha)$ coincide. These results have been found and written up with AI tools, pointing towards a structural change affecting the field of quantum information and computation.", "url": "https://arxiv.org/abs/2607.24309", "type": "理论", "summary": "1. 该工作回答了PRX Quantum公开问题5，证明两个四维Werner态ρ(4,−½)不可两拷贝蒸馏。\n2. 其技术核心是建立一个新的部分迹不等式并证明它与r=2时两拷贝不可蒸馏性等价，从而完整刻画Werner态的可蒸馏区域。\n3. 这揭示了单拷贝与两拷贝蒸馏区域的重合性，可能推动量子纠缠蒸馏理论中结构性的重新理解。", "summary_source": "deepseek", "authors": [{"name": "Thomas C. Fraser"}, {"name": "Felix Huber"}, {"name": "Balázs Pozsgay"}, {"name": "István Vona"}], "featured_authors": [{"name": "Thomas C. Fraser"}, {"name": "Felix Huber"}, {"name": "Balázs Pozsgay"}, {"name": "István Vona"}], "author_count": 4}, {"id": "2607.24318", "category": "quant-ph", "title": "Fast Generation of Metrologically Relevant Fock State Mixtures", "abstract": "We propose a fast laser pulse sequence for the generation of non-thermal Fock state mixtures of the motion of a trapped ion, targeted at displacement metrology beyond the standard quantum limit. Using a polaron-frame description of the ion-laser interaction, we identify a resonant operating point-zero detuning and a Rabi frequency matching the trap frequency-at which selective population trapping survives strong driving, enabling preparation speeds beyond the weak-driving limit of previous protocols without requiring ground-state cooling. We trace the residual infidelity at large Lamb-Dicke parameter $\\eta$ to a single coherent process, the counter-rotating blue-sideband term neglected in the rotating-wave approximation, and show that it is suppressed by two routine calibrations: a percent-level refocusing of the pulse duration and a small compensating Bloch-Siegert detuning. Numerical simulations of the full sequence show that this refinement keeps the preparation error at or below the $10\\%$ level up to $\\eta\\approx0.5$ and restores the displacement-sensing Fisher information that the uncorrected protocol loses at strong coupling, recovering up to 9 dB relative to the nominal sequence.", "url": "https://arxiv.org/abs/2607.24318", "type": "理论+数值", "summary": "1. 该工作提出一种快速激光脉冲序列，用于生成囚禁离子运动的非热Fock态混合物，以超越标准量子极限的位移计量。\n2. 其技术关键在于利用极化子框架识别零失谐与拉比频率匹配阱频的共振工作点，强驱动下选择性粒子俘获实现无需基态冷却的快速制备，并通过校准反旋转蓝边带项抑制大Lamb-Dicke参数下的保真度损失。\n3. 该方案在η≈0.5时制备误差低于10%，恢复位移传感Fisher信息并提升达9 dB，为快速制备计量相关非经典态提供了实用路径。", "summary_source": "deepseek", "authors": [{"name": "Gonzalo Reina Rivero"}, {"name": "Marcel Morillas-Rozas"}, {"name": "Alberto López-García"}, {"name": "Javier Cerrillo"}], "featured_authors": [{"name": "Gonzalo Reina Rivero"}, {"name": "Marcel Morillas-Rozas"}, {"name": "Alberto López-García"}, {"name": "Javier Cerrillo"}], "author_count": 4}, {"id": "2607.24350", "category": "quant-ph", "title": "Electron Shuttle Waiting Times for Electric Field Sensing", "abstract": "We explore the use of waiting-time statistics in a quantum electron shuttle for electric-field sensing. Electron shuttles convert nanomechanical motion into charge transport, showing a noise-broadened crossover between stochastic tunneling and mechanically assisted charge transfer. This allows investigation of how transport fluctuations encode electromechanical parameters. Using a single-level quantum shuttle in strong-Coulomb-blockade and high-bias regimes with a Markovian quantum master equation, we analyze stationary dynamics in phase space and waiting time distributions. By estimating the electromechanical coupling, proportional to the electric field, we evaluate the classical Fisher information in waiting times and compare it with the quantum Fisher information of the stationary state. We relate the metrological response to mean waiting time, variance, and Fano factor. Our results show that the crossover from tunneling to shuttling is characterized by enhanced fluctuations and increased parameter sensitivity, leading to a pronounced enhancement of the Fisher information.", "url": "https://arxiv.org/abs/2607.24350", "type": "理论+数值", "summary": "1. 该工作探索基于量子电子穿梭机等待时间统计的电场传感新方案，通过电荷输运涨落提取电机械参数。\n2. 技术核心是采用马尔可夫量子主方程分析强库仑阻塞与高偏压下穿梭机的相空间动力学及等待时间分布，发现从随机隧穿到机械辅助电荷转移的噪声展宽交叉区中平均等待时间、方差及Fano因子涨落增强，经典Fisher信息明显上升并超越稳态量子Fisher信息，从而有效估计与电场成正比的电机械耦合强度，并将计量响应与这些统计量直接关联。\n3. 这一结果为利用纳米机械运动驱动的电荷涨落实现高灵敏度电场传感提供了基于等待时间统计的优化策略、理论支撑和可直接检验的诊断指标，具有明确的计量应用前景。", "summary_source": "deepseek", "authors": [{"name": "Alberto Mayorgas"}, {"name": "Alberto López-García"}, {"name": "Enamul Haque"}, {"name": "Javier Cerrillo"}], "featured_authors": [{"name": "Alberto Mayorgas"}, {"name": "Alberto López-García"}, {"name": "Enamul Haque"}, {"name": "Javier Cerrillo"}], "author_count": 4}, {"id": "2607.24404", "category": "quant-ph", "title": "A Bogoliubov-ratio framework for quantum-information diagnostics of time-dependent two-mode Boson Hamiltonian", "abstract": "We present a compact and unified framework for quantum-information diagnostics of time-dependent two-mode bosonic systems based on the Bogoliubov ratio $\\lambda_k(\\eta) \\equiv \\beta_k(\\eta)/\\alpha_k(\\eta)$. For a general time-dependent quadratic two-mode Hamiltonian, the state dynamics is exactly reduced to a single complex Riccati equation for $\\lambda_k$. Upon tracing out one partner mode, the spectrum of the one-mode reduced density matrix is determined entirely by the squared magnitude $q_k(\\eta) = \\vert{}\\lambda_k(\\eta)\\vert{}^2$. Consequently, we could construct the explicit, model-independent formula for the for the reduced-state purity, linear entropy, Rényi-2 entropy, and von Neumann entropy without reconstructing and diagonalizing the reduced density matrix on a model-by-model basis using coupled squeezing parameters ($r_k, \\phi_k$). We demonstrate the utility of this framework in two distinct non-stationary setups: primordial cosmological perturbations and a chirped-pulse nondegenerate optical parametric amplifier. In the cosmological context, our formulation clarifies how background-induced phase rotation and frequency softening regulate squeezing growth and state mixedness; in the optical domain, it captures the delayed onset, suppression of squeezing accumulation, and late-time entropy saturation induced by finite pump duration and frequency chirp. By cleanly factorizing model-dependent driving protocols from universal information-theoretic metrics, this framework offers an efficient, standardized diagnostic tool for a broad class of parametrically driven quadratic bosonic systems.", "url": "https://arxiv.org/abs/2607.24404", "type": "理论+数值", "summary": "1. 该工作提出基于Bogoliubov比率λ_k的紧凑统一框架，用于时变双模玻色系统的量子信息诊断。\n2. 核心卖点在于将态动力学精确约化为单个复Riccati方程，由|λ_k|^2直接给出约化密度矩阵谱，无需逐模型对角化。\n3. 该框架将模型依赖的驱动协议与通用信息度量清晰分离，为宇宙学扰动及光学参量放大等参数驱动二次玻色系统提供了标准化诊断工具。", "summary_source": "deepseek", "authors": [{"name": "Shi-Cheng Liu"}, {"name": "Lei-Hua Liu"}, {"name": "Bichu Li"}, {"name": "Yuebing Zhou"}, {"name": "Hai-Qing Zhang"}], "featured_authors": [{"name": "Shi-Cheng Liu"}, {"name": "Lei-Hua Liu"}, {"name": "Bichu Li"}, {"name": "Yuebing Zhou"}, {"name": "Hai-Qing Zhang"}], "author_count": 5}, {"id": "2607.24406", "category": "quant-ph", "title": "Floquet time-convolutionless master equation for non-Markovian driven quantum systems", "abstract": "We study the dynamics of open quantum systems driven by an external time-periodic force. Combining Floquet theory and the time-convolutionless projection operator technique we derive a time-local quantum master equation which exactly takes into account the periodic driving, while treating the system-environment interaction within second order in the coupling strength without performing the Markov approximation. The resulting equation of motion for the reduced density matrix is called Floquet time-convolutionless master equation. Employing the example of the driven spin-boson system, we demonstrate that this master equation is capable of describing strong non-Markovian effects, while yielding the Floquet-Lindblad master equation in the Markovian limit. A characteristic feature of memory effects in such driven dissipative systems is the emergence of sharp peaks of the trace-distance based non-Markovianity measure as a function of the driving amplitude, which can be traced back to quasienergy crossings leading to almost decoherence-protected subspaces through a quasienergy-induced dissipative decoupling mechanism.", "url": "https://arxiv.org/abs/2607.24406", "type": "理论", "summary": "1. 该工作结合Floquet理论与时间无卷积投影算符技术，导出了适用于非马尔可夫周期驱动开放量子系统的时间局域主方程。\n2. 其在二阶系统-环境耦合下保留非马尔可夫记忆，以自旋-玻色子模型揭示准能量交叉引起的耗散解耦机制，形成非马尔可夫性测度的尖锐峰值。\n3. 这为解析驱动耗散系统中的记忆效应及利用准能量结构调控量子相干提供了理论工具。", "summary_source": "deepseek", "authors": [{"name": "Pietro Follia"}, {"name": "Heinz-Peter Breuer"}, {"name": "Bassano Vacchini"}], "featured_authors": [{"name": "Pietro Follia"}, {"name": "Heinz-Peter Breuer"}, {"name": "Bassano Vacchini"}], "author_count": 3}, {"id": "2607.24429", "category": "quant-ph", "title": "QuantumFCS.jl: Efficient Full-Counting Statistics for Open Quantum Systems", "abstract": "Full-counting statistics (FCS) provides a systematic framework for characterising current fluctuations in quantum transport, quantum optics, and open quantum systems. We introduce this http URL , an open-source Julia package for efficient and flexible numerical FCS calculations. The package defines currents through monitored jump operators and weights, allowing particle, electric, and heat currents to be treated within the same workflow. It implements a recursive cumulant algorithm with dense, sparse, and iterative solver backends, making it suitable for models that are challenging for direct dense methods. We demonstrate the package on photon counting in a driven-dissipative Jaynes-Cummings system near the blockade-breakdown phase transition and on heat-current fluctuations in a non-linear circuit-QED heat engine. These examples show how higher cumulants reveal intermittency between bright and dim emission, antibunching, and provide probes of thermodynamic uncertainty relations. Benchmarks against an existing FCS implementation show substantial speed-ups.", "url": "https://arxiv.org/abs/2607.24429", "type": "理论+数值", "summary": "1. 该工作发布了QuantumFCS.jl，一个用于开放量子系统全计数统计的高效Juli
