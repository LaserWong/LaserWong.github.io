n a Ward or entropic identity supplies a signed quadratic form. Higher orders need extra dynamics. Three exactly solvable tests exhibit both outcomes and show that the endpoint inequality can hold while running monotonicity fails. Massive scalars yield nonmonotone filtered free energies on every odd dimensional $p$-sphere with $p\\geq3$. A generalized-free surface-defect $b$-function is strictly monotone when the defect-primary dimension $\\widehat\\Delta$ satisfies $1/2\\leq\\widehat\\Delta<1$, and necessarily nonmonotone for $0<\\widehat\\Delta<1/2$. At the threshold, its flow coefficient is completely monotone in the canonical spectral coordinate, with derivatives of every order alternating in sign. A local four-dimensional monodromy defect realizes the full transition. Under a stated assumption on the large-component entropy limit, disk entropy and sphere free energy share endpoints and total $F$ loss but distribute it differently over scale. Rank matching separates endpoint ordering, running monotonicity, and the distribution of loss over scale.", "url": "https://arxiv.org/abs/2608.02447", "type": "理论", "summary": "1. 该工作提出“秩匹配”机制，解释局域减除为何有时能产生重整化群单调量，并用精确可解的缺陷与熵检验加以验证。\n2. 其技术核心是局域抵消项决定尺度导数阶数；一阶减除仅当 Ward 或熵恒等式提供符号确定的二次型时才闭合，而更高阶需要额外动力学。\n3. 这为区分端点序、流动单调性与随尺度损失分布提供了统一框架，并为重整化群不可逆性的严格判定给出可解析检验的判据。", "summary_source": "deepseek", "authors": [{"name": "Francesco Scardino"}], "featured_authors": [{"name": "Francesco Scardino"}], "author_count": 1}, {"id": "2608.02452", "category": "hep-th", "title": "Confinement as Decoding: Higher Form Codes and Lattice Yang-Mills Theory", "abstract": "We study the relationship between quantum error correction, confinement, and lattice Yang-Mills theory. We first formulate decoding for finite Abelian homological codes in terms of higher form gauge fields. For positive local noise, the logical classes are topological sectors of a Nishimori ensemble, and the optimal decoding error is determined by the relative weights of the nontrivial sectors. We derive Fourier relations between logical probabilities, disorder operators, and information in the channel environment, and we give contour and fractional moment criteria for a threshold. We then study a four dimensional $\\Z_N$ memory and its possible relation to confining $\\PSU(N)$ vacua. Finally, we define a finite curvature center sheet model coupled to Wilson $\\SU(N)$ link variables. In this model the conditional logical probabilities are center twisted Yang-Mills partition functions. A strong coupling expansion gives the leading effective interaction for the syndrome and shows that local syndrome correlations can decay even when the global sheet sectors are mixed. We also show that the likelihood for a separated pair of syndrome worldlines is the center monopole correlator. Its decay determines a transfer matrix mass. This distinguishes the suppression of global flux sectors from the local spectral information needed to discuss a mass gap.", "url": "https://arxiv.org/abs/2608.02452", "type": "理论", "summary": "1. 该工作把量子纠错解码与禁闭统一起来，先用高阶规范场表述有限阿贝尔同调码的解码，再研究四维Z_N记忆与PSU(N)禁闭真空及中心薄片模型。\n2. 作者导出逻辑概率、无序算符与信道环境信息的傅里叶关系，给出阈值的轮廓与分数矩判据，并证明校验子条件概率为中心扭曲杨-米尔斯配分函数；强耦合展开显示局域校验子关联可衰减而全局扇区仍混合。\n3. 成对校验子世界线的似然由中心磁单极子关联给出，其衰变决定转移矩阵质量，从而将整体通量扇区抑制与局域质量隙谱信息明确区分。", "summary_source": "deepseek", "authors": [{"name": "Ning Bao"}], "featured_authors": [{"name": "Ning Bao"}], "author_count": 1}, {"id": "2608.00546", "category": "math-ph", "title": "Renormalizations in holomorphic field theories on Kähler manifolds", "abstract": "The divergence of Feynman graph integrals is one of the central issues in the study of perturbative quantum field theories. A rigorous formulation of these integrals usually requires renormalization. In this paper, we prove that the Feynman graph integrals arising from holomorphic field theories on closed real-analytic Kähler manifolds are convergent with respect to heat-kernel renormalization, Cauchy principal value renormalization, and zeta-function renormalization. Moreover, these three renormalization procedures produce the same value. Our proof is based on the theory of wonderful compactifications in algebraic geometry, which provides a geometric understanding of these integrals. As a consequence, we establish a gauge anomaly formula for these graph integrals.", "url": "https://arxiv.org/abs/2608.00546", "type": "理论", "summary": "1. 该工作针对闭实解析Kähler流形上的全纯场论，证明其费曼图积分在热核重整化、柯西主值重整化与zeta函数重整化下均收敛，且三种方案给出完全相同的结果。\n2. 其核心卖点在于运用代数几何中的奇妙紧化对图积分给出整体几何刻画，将三种重整化程序统一起来，并由此严格证明收敛性、导出规范反常公式。\n3. 这一代数几何途径为理解Kähler背景下全纯场论的量子修正与反常几何起源提供了新工具，也有望用于弦论等更高维几何模型中的严格计算。", "summary_source": "deepseek", "authors": [{"name": "Minghao Wang"}, {"name": "Junrong Yan"}], "featured_authors": [{"name": "Minghao Wang"}, {"name": "Junrong Yan"}], "author_count": 2}, {"id": "2608.00637", "category": "math-ph", "title": "Remarks on Regular Approximations to the Robin Aharonov-Bohm Hamiltonian", "abstract": "In the space $\\mathbb R^3$, for Robin parameter $L>0$, it is shown that there is a family of Schrödinger operators with penetrable toroidal solenoid and variable conductivity that approximates the magnetic Aharonov-Bohm operator with a Robin boundary condition at the solenoid (border). It is also shown that approximations via smooth potentials and then a barrier in the solenoid interior give Dirichlet boundary conditions. The approximations are in the strong resolvent sense and obtained through the $\\Gamma$-convergence technique, and they hold for the more general setting of smooth, closed and compact surfaces and continuous and bounded magnetic potentials.", "url": "https://arxiv.org/abs/2608.00637", "type": "理论", "summary": "1. 该文针对 R^3 中 Robin 参数 L>0 的磁 Aharonov-Bohm 哈密顿量，构造了具可穿透环状螺线管与可变电导率的 Schrödinger 算子族，并在强预解意义下证明其逼近 Robin 边界条件。\n2. 其技术核心是利用 Gamma-收敛将奇异磁场与边界条件作为极限实现，且证明经光滑势加螺线管内部势垒的另一种逼近给出 Dirichlet 边界条件。\n3. 这些正则逼近推广到任意光滑闭紧曲面及连续有界磁势，为处理带边界奇异 Aharonov-Bohm 型算子的谱与动力学问题提供了统一而稳健的构造性框架。", "summary_source": "deepseek", "authors": [{"name": "Cesar R. de Oliveira"}], "featured_authors": [{"name": "Cesar R. de Oliveira"}], "author_count": 1}, {"id": "2608.00751", "category": "math-ph", "title": "Generalized Marginals of tie -Wigner Distribution nand Lagrangian Tomography", "abstract": "We develop a symplectic formulation of the Lagrangian Radon transform based on the transitive action of the symplectic group on the Lagrangian Grassmannian. This geometric framework naturally extends the classical notion of the marginals of the Wigner transform, viewed as elementary tomograms, to arbitrary Lagrangian subspaces. The resulting generalized tomography provides a unified treatment of position and momentum measurements related by symplectic rotations. As applications, we revisit the Pauli reconstruction problem and establish reconstruction formulas for density operators from generalized Lagrangian tomograms.", "url": "https://arxiv.org/abs/2608.00751", "type": "理论", "summary": "1. 该工作提出基于辛群在拉格朗日格拉斯曼流形上传递作用的拉格朗日Radon变换辛形式，将Wigner变换的经典边缘（基本断层图）推广到任意拉格朗日子空间。\n2. 其技术核心在于以辛旋转统一处理位置与动量测量，并由此建立密度算子由广义拉格朗日断层图重构的公式，重新审视了Pauli重构问题。\n3. 这一几何框架为量子态层析与相空间测量提供了统一语言，或可为更一般相空间上的重构协议与实验方案带来新启发。", "summary_source": "deepseek", "authors": [{"name": "Maurice de Gosson"}], "featured_authors": [{"name": "Maurice de Gosson"}], "author_count": 1}, {"id": "2608.00920", "category": "math-ph", "title": "Analysis of Conjectural Improvements to Minkowski's Lower Bound on the Sphere Packing Density", "abstract": "Torquato and Stillinger conjectured an exponential improvement of Minkowski's classical lower bound on the maximal density of sphere packings in high-dimensional Euclidean space $\\mathbb{R}^d$ using a pair-correlation-function optimization framework. Conditional on their realizability conjecture, we show that a simple family of hyperuniform pair correlation functions yields polynomial improvements over Minkowski's lower bound of the form $\\phi_{\\mathrm{max}} \\gtrsim d^\\beta 2^{-d}$ for every fixed $\\beta >1$ in sufficiently high dimensions. As the polynomial exponent is allowed to increase with dimension, this family continuously approaches the previously conjectured exponential improvement. We further derive the same exponential asymptotic rate independently from the Cohn--Elkies dual linear programming upper bound formulation, demonstrating that its radial objective test functions cannot asymptotically exclude packings with the Torquato--Stillinger density scalings. The agreement between these alternative approaches provides new evidence that exceptionally dense disordered sphere packings may exist in high dimensions and strengthens the case for the Torquato--Stillinger conjectural lower bound.", "url": "https://arxiv.org/abs/2608.00920", "type": "理论", "summary": "1. 本文分析Torquato-Stillinger猜想，证明超均匀对关联函数可在高维使球堆积密度下界改进至d^β 2^{-d}，β>1。\n2. 该结果与Cohn-Elkies对偶线性规划独立给出的指数渐近一致，表明其径向目标函数无法排除TS密度标度堆积。\n3. 这一吻合为高维存在异常致密无序球堆积提供新证据，支持Torquato-Stillinger猜想。", "summary_source": "deepseek", "authors": [{"name": "Carlo Vanoni"}, {"name": "Alan Guo"}, {"name": "Salvatore Torquato"}], "featured_authors": [{"name": "Carlo Vanoni"}, {"name": "Alan Guo"}, {"name": "Salvatore Torquato"}], "author_count": 3}, {"id": "2608.01110", "category": "math-ph", "title": "Connes spectral distance on twisted fuzzy torus", "abstract": "In this paper, we study the Connes spectral distance between states on the fuzzy torus. We construct a Dirac operator by commutators and anticommutators. Based on this Dirac operator, we construct a spectral triple of the fuzzy torus. We study some properties of the spectral distance on the fuzzy torus. We find that there is a reciprocal Pythagorean theorem between the spectral distances. We construct a conditional expectation function of the optimal element which can lead to a contraction of the corresponding Lipschitz seminorm. We find that for any diagonal states, the corresponding optimal elements of spectral distances are also diagonal. We explicitly calculate the spectral distances of some simple states, including basic states and some simple mixed states. We find that there are some kinds of cyclic symmetry in both the optimal elements and the spectral distances between the diagonal states. Furthermore, we also construct a fuzzy torus with some type of conformal twist, and study the relation between conformal parameters and spectral distances.", "url": "https://arxiv.org/abs/2608.01110", "type": "理论", "summary": "1. 该工作通过交换子与反对易子构造模糊环面上的Dirac算子及相应谱三元组，并据此系统研究Connes谱距离。\n2. 其主要技术发现是谱距离满足互为倒数的勾股定理，且借助最优元的条件期望可实现Lipschitz半范数的收缩，对角态的最优元保持对角并呈现循环对称性，若干基本态与混合态的谱距离获显式结果。\n3. 通过构造一类共形扭曲的模糊环面并揭示共形参数对谱距离的影响，该研究为非交换几何中的量子几何与谱距离计算提供了新的技术途径。", "summary_source": "deepseek", "authors": [{"name": "Zhi-Kang You"}, {"name": "Bing-Sheng Lin"}], "featured_authors": [{"name": "Zhi-Kang You"}, {"name": "Bing-Sheng Lin"}], "author_count": 2}, {"id": "2608.01219", "category": "math-ph", "title": "Dual Variational Principles for Curl Forces", "abstract": "Curl forces are position-dependent, non-conservative, and non-dissipative forces that, in general, cannot be derived from an ordinary potential energy. Consequently, their equations of motion do not, in general, follow from a standard variational principle. In this paper, we present a dual variational formulation for particle dynamics under curl forces. By introducing variables dual to position and velocity and an auxiliary function, we construct a pre-dual action in which the equations of motion act as constraints. Stationarity with respect to the primal variables defines a dual-to-primal mapping, whose substitution into the pre-dual action gives an action expressed entirely in terms of the dual variables. The Euler--Lagrange equations of the dual action recover both the original equations of motion and their prescribed initial conditions. We also introduce an auxiliary dual Hamiltonian that is conserved along stationary dual trajectories, although it does not represent the physical energy. The formulation is illustrated using two nonlinear curl force fields in two and three dimensions and the classical Ziegler column. These examples demonstrate that non-conservative curl-force dynamics can admit variational descriptions even in the absence of an ordinary potential energy or a conventional Lagrangian.", "url": "https://arxiv.org/abs/2608.01219", "type": "理论", "summary": "1. 该工作为旋度力作用下的粒子动力学提出一种对偶变分表述，引入位置与速度的对偶变量和辅助函数，构造出以运动方程为约束的前对偶作用量。\n2. 其技术核心在于由对偶作用量的变分驻定性恢复原始运动方程与给定初始条件，并沿对偶轨迹定义守恒的辅助对偶哈密顿量，尽管该量并非物理能量。\n3. 这为缺乏普通势能或常规拉格朗日量的非保守系统提供了变分描述途径，并在二维与三维非线性旋度力场及经典齐格勒柱等实例中展示其适用性。", "summary_source": "deepseek", "authors": [{"name": "Arash Yavari"}, {"name": "Amit Acharya"}], "featured_authors": [{"name": "Arash Yavari"}, {"name": "Amit Acharya"}], "author_count": 2}, {"id": "2608.01596", "category": "math-ph", "title": "Beyond $K$-Theory: Geometry and Holomorphy in Hyperbolic Band Theory", "abstract": "Topological $K$-theory supplies the decisive stable classification principle for gapped free-fermion phases in Euclidean crystals once symmetry and stabilization are fixed. In hyperbolic band theory, by contrast, it is less decisive for the full band problem: generalized momentum sectors vary through moduli spaces, but passing to ordinary $K$-classes collapses their geometric and holomorphic variation. We distinguish kinematical holomorphy, in which complex geometry organizes the sector spaces, from dynamical holomorphy, in which that geometry informs a Hamiltonian or projector, and formulate the resulting loss as an observable-factorization problem. For a compact hyperbolic surface $X$, we prove nonfactorization in three settings: fibrewise $K^0(X)$, occupied-state $K^0(B)$, and operator-algebraic $K$-theory. The affected quantities include spectra and Higgs spectral curves, the Berry holonomy and the quantum metric, the partially filled Hall response, and the Fermi surface and nodal geometries. We also identify the quantized pairings and local charges retained by topology. Up to an explicit area factor, the Kotani--Sunada bottom-band Hessian is the Hodge inner product on $H^1(X;\\mathbb R)$. Together with the integral intersection form, it recovers the homology-marked principally polarized Jacobian and hence, by Torelli and uniformization, the underlying complex and hyperbolic surface, though not a full Teichmüller marking. We also separate finite-rank sectors from the thermodynamic bulk. Locally faithful covers reproduce polynomial traces exactly and control continuous spectral observables. In arithmetic congruence towers, analytic observables converge as $O(|G_n|^{-\\eta})$ for some $\\eta>0$, and $C^s$ observables as $O((\\log |G_n|)^{-s})$, while established coherent large-rank limits recover bulk density-of-states moments.", "url": "https://arxiv.org/abs/2608.01596", "type": "理论", "summary": "1. 该工作针对双曲能带理论中拓扑K-理论无法保留动量扇区几何与全纯变化的问题，将其表述为可观测量因子化问题，并在紧致双曲面上证明纤维K^0(X)、占据态K^0(B)与算子代数K-理论三种设置下的不可因子化。\n2. 其技术卖点是区分运动学与动力学全纯性，证明Kotani-Sunada底带Hessian（除显式面积因子外）即H^1(X;R)上的Hodge内积，并与整相交形式一起恢复同调标记的主极化Jacobian及底层复/双曲曲面。\n3. 这为谱曲线、Berry联络、量子度量、费米面等几何可观测量与拓扑保留的量子化配对提供严格框架，并给出算术同余塔中解析与C^s可观测量的收敛速率，可推广至非欧晶格拓扑态与大秩极限研究。", "summary_source": "deepseek", "authors": [{"name": "Steven Rayan"}], "featured_authors": [{"name": "Steven Rayan"}], "author_count": 1}, {"id": "2608.01878", "category": "math-ph", "title": "Collective superintegrable systems from the Guillemin--Sternberg torus action", "abstract": "We present a novel approach to the superintegrability of collective Hamiltonians invariant under a Hamiltonian action of a connected semisimple compact Lie group, $G$, on a symplectic manifold, $M$. By exploiting a Hamiltonian torus action that goes back to Guillemin and Sternberg [GS,1983], we demonstrate that the functional dimensions of $\\mathfrak{H} := \\mathcal{J}^*(C^\\infty(\\mathfrak{g}^*)^G)$, where $\\mathcal{J}: M \\to \\mathfrak{g}^*$ is the momentum map of the $G$ action, and its centralizer $\\mathfrak{F}$ in $C^\\infty(M)$ satisfy the equality $\\mathrm{ddim}(\\mathfrak{H}) + \\mathrm{ddim}(\\mathfrak{F}) = \\mathrm{dim}(M)$. Together with a non-triviality condition, this ensures that the Abelian Poisson algebra $\\mathfrak{H}\\subset C^\\infty(M)$ represents a superintegrable system, and it also follows that the momentum map of the GS torus action yields action variables for the system. Our work provides a new insight into collective superintegrability complementing earlier results of Bolsinov and Jovanović.", "url": "https://arxiv.org/abs/2608.01878", "type": "理论", "summary": "1. 该工作借助Guillemin–Sternberg环面作用，针对紧半单李群G在辛流形上的哈密顿作用，构造了一类集体超可积系统并给出其判定条件。\n2. 其核心在于证明G不变拉回代数H与其中心化子F满足函数维数关系ddim(H)+ddim(F)=dim(M)，并指出GS环面作用的动量映射可提供作用变量。\n3. 这一结果将集体超可积性与约化环面作用联系起来，为推广Bolsinov–Jovanović的相关理论及研究集体模型的可积结构提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "L. Feher"}], "featured_authors": [{"name": "L. Feher"}], "author_count": 1}, {"id": "2608.01996", "category": "math-ph", "title": "Geometric theory of generalised continua using moving frames", "abstract": "Generalised continuum theories couple the macroscopic deformation and the micro-/meso-scopic deformation of an underlying micro-structure. They can account for internal length-scale effects and higher-order mechanical loadings absent from classical Cauchy elasticity and has shown its efficiency in modelling metamaterials. This has led to a proliferation of higher-grade and higher-order models (e.g. strain-gradient, micromorphic, micro-polar) whose underlying kinematic reduction strategies, in particular to reduce the number of material parameters, are rarely identifiable from the free energy alone. It leaves two open issues: the lack of a systematic criterion for selecting an appropriate model, and a persistent ambiguity regarding the physical status of the local frames (''directors of matter'') used in their kinematic description. Are they physical quantities describing the change of state of the given micro-structure or arbitrary kinematic descriptors of its deformation\\,? This work addresses both questions through a gauge-theoretic formulation of generalised continua in finite strains. While relying on tools and modelling choices consistent with the existing geometric literature on continuum mechanics, the present approach departs from it in its objectives, aiming at a unifying classification of available mechanical models rather than the description of a specific microstructural phenomenon such as defects. In this work, generalised configurations are defined as moving frames over classical configurations, and invariance with respect to the reference generalised configuration is shown to be a necessary and sufficient condition for a gauge invariance, recovering the micromorphic theory as the general-purpose theory of the deformation of arbitrary directors of matter. A systematic classification of first-order generalised media follows from structural group reduction, while strain-gradient continua are recovered through convected frames, and finally constrained media (e.g. couple-stress) are addressed.", "url": "https://arxiv.org/abs/2608.01996", "type": "理论", "summary": "1. 该工作针对广义连续介质理论中模型选择缺乏系统判据与局域标架物理地位模糊的问题，提出用活动标架在有限应变下建立规范场论表述，并将广义构型定义为经典构型上的活动标架。\n2. 其核心卖点是证明参考广义构型不变性等价于规范不变性，并通过结构群约化统一分类一阶广义介质，由此恢复微形态理论、随体活动标架下的应变梯度连续介质以及约束介质（如偶应力）理论。\n3. 这为从自由能以外的运动学结构出发选择合适高阶模型提供了系统判据，澄清了“物质指向子”究竟是物理量还是任意运动学描述符的争议，并为超材料等微结构介质的力学建模给出明确指导。", "summary_source": "deepseek", "authors": [{"name": "Boris Kolev"}, {"name": "Cl{é}ment Ecker"}], "featured_authors": [{"name": "Boris Kolev"}, {"name": "Cl{é}ment Ecker"}], "author_count": 2}, {"id": "2608.02028", "category": "math-ph", "title": "A Hamiltonian approach to the CH-KP equation", "abstract": "A model governing quasi-unidirectional wave propagation at the surface of a shallow layer of water is derived from Euler equations by long wave asymptotics together with Hamiltonian reduction techniques. The balance between nonlinearity, dispersion and weak dependence on the second planar coordinate is examined and results in the so-called CH-KP equation, a mildly nonlinear version of the well known Kadomtsev-Petviashvili equation. The Hamiltonian structure of the model is obtained by Dirac reduction from the intermediate step of a fully-nonlinear, long-wave system for stratified fluids. A particular scaling is considered that reduces such system to the one-dimensional CH equation in a limiting case. Examples of weak peakon-type solutions are provided, chosen to illustrate the collision behavior supported by the limiting equation.", "url": "https://arxiv.org/abs/2608.02028", "type": "理论", "summary": "1. 该工作从欧拉方程出发，利用长波渐近与哈密顿约化推导出控制浅水层准单向波传播的CH-KP方程。\n2. 其关键在于通过分层流体全非线性长波系统的狄拉克约化获得模型的哈密顿结构，并在特定标度下回归一维CH方程，同时给出弱peakon型解的碰撞行为示例。\n3. 这为广义KP类方程及哈密顿约化方法在浅水波与奇异波相互作用研究中的应用提供了可推广的理论框架。", "summary_source": "deepseek", "authors": [{"name": "R. Camassa"}, {"name": "G. Falqui"}, {"name": "E. Sforza"}], "featured_authors": [{"name": "R. Camassa"}, {"name": "G. Falqui"}, {"name": "E. Sforza"}], "author_count": 3}, {"id": "2608.02057", "category": "math-ph", "title": "Quantum Vortices in a Boundary Layer: New Results and Perspectives", "abstract": "Here, we investigate the motion of a thin circular quantum vortex filament near the infinite planar surface. The fluid surrounding this surface moves with a non-zero velocity $\\bf{v}$, which is parallel to the surface. We study the specific features of this quantum system and show that they are quite suitable for the boundary layer theory. The developed model allows us to calculate the vortex energy spectrum, $E = E({\\bf p})$, where ${\\bf p}$ is the total momentum of a vortex ring. We have demonstrated that this function has complex non-trivial dependence on the velocity $\\bf{v}$. It is stated that the inverse effective mass of a vortex under consideration is of a tensorial nature. In certain quantum states, the system shows the possibility of both negative and positive effective mass existing. This study employs a novel quantization method for classical closed vortex filaments, developed by the author earlier.", "url": "https://arxiv.org/abs/2608.02057", "type": "理论", "summary": "1. 该工作研究无限平面附近薄圆量子涡丝在平行于表面的非零速度场中的运动，并将其纳入边界层理论框架。\n2. 主要进展是建立可计算涡环能量谱 E(p) 的模型，揭示其对外部速度 v 的非平庸依赖，并指出逆有效质量为张量，特定量子态可正可负。\n3. 这为量子涡旋边界层现象以及利用正负有效质量态调控涡旋动力学提供了新的理论视角。", "summary_source": "deepseek", "authors": [{"name": "Sergei V. Talalov"}], "featured_authors": [{"name": "Sergei V. Talalov"}], "author_count": 1}, {"id": "2608.02179", "category": "math-ph", "title": "$q$-Deformed Topological Recursion: Quantum Curves and Non-perturbative Analysis", "abstract": "This work investigates the $q$-deformation of $(r,s)$-Airy structures and their realization via $q$-difference operators, providing a bridge between quantum spectral curves and integrable systems. We construct an all-order $q$-WKB solution for the matrix systems associated with the $q$-quantized curve $E_q(x,y)=0$. We demonstrate that the resulting non-perturbative connected $q$-amplitudes satisfy a set of shifted $q$-loop equations, which can be interpreted as the Ward identities of a $q$-deformed $\\mathcal{W}(\\mathfrak{gl}_r)$ algebra. Our main result provides a rigorous classification of admissible $(r,s,q)$ pairs and $q$-Casimir configurations that satisfy the $q$-topological type property. This ensures that the semi-classical expansion is uniquely governed by the $q$-topological recursion, offering new insights into the $q$-quantization of mirror curves and their underlying algebraic structures.", "url": "https://arxiv.org/abs/2608.02179", "type": "理论", "summary": "1. 该工作研究(r,s)-Airy结构的q-形变，借助q-差分算子建立量子谱曲线与可积系统间的联系，并构造相应矩阵系统的全阶q-WKB解。\n2. 其核心结果是证明非微扰连通q-振幅满足一组平移q-圈方程，可解释为q-形变W(gl_r)代数的Ward恒等式，且对满足q-拓扑型性质的(r,s,q)与q-Casimir构型给出严格分类。\n3. 这确保半经典展开由q-拓扑递归唯一控制，为镜像曲线的q-量子化及底层代数结构提供新的非微扰视角。", "summary_source": "deepseek", "authors": [{"name": "Fridolin Melong"}, {"name": "Raimar Wulkenhaar"}], "featured_authors": [{"name": "Fridolin Melong"}, {"name": "Raimar Wulkenhaar"}], "author_count": 2}, {"id": "2608.02543", "category": "math-ph", "title": "On the local conformal structure of Imaginary Liouville theory", "abstract": "Imaginary Liouville theory was recently proposed as a path integral construction of a non-rational conformal field theory (CFT) with central charge less than one (Usciati et al. 2026). In the present work, we establish Ward identities and Belavin-Polyakov-Zamolodchikov differential equations in this framework, assuming a precise conjecture on the decay of the Laplace transform of Imaginary Gaussian multiplicative chaos. These results provide a first step towards a rigorous implementation of the conformal bootstrap program for conformal field theories with central charge lower than one. This work is the first to investigate the intrinsic properties of Imaginary Liouville theory beyond exact computations.", "url": "https://arxiv.org/abs/2608.02543", "type": "理论", "summary": "1. 该论文针对Usciati等人近期提出的、以路径积分构造中心荷小于一非有理共形场论的虚刘维尔理论，刻画其局域共形结构并推导Ward恒等式与BPZ微分方程。\n2. 技术卖点在于将虚高斯乘性混沌的拉普拉斯变换衰减行为作为一个明确猜想，并在此假设下严格得到该理论局域共形代数对关联函数的约束。\n3. 这些结果首次超越精确可计算量、触及该类理论的固有性质，为c<1共形场论的共形自举程序提供了严格化的第一步与可检验的猜想目标。", "summary_source": "deepseek", "authors": [{"name": "Baptiste Cerclé"}, {"name": "Romain Usciati"}], "featured_authors": [{"name": "Baptiste Cerclé"}, {"name": "Romain Usciati"}], "author_count": 2}, {"id": "2608.00055", "category": "quant-ph", "title": "Symmetry-initialized quantum Gibbs sampling: a non-Abelian asymmetry cascade", "abstract": "For a quantum Gibbs sampler whose mixing bottleneck is a weakly broken symmetry, I show that the correct initialization is determined by representation theory. I first prove a general speedup-versus-prefactor dichotomy: by exactly eliminating slow-mode overlap, I convert a nominal prefactor reduction into a fundamental, asymptotic acceleration of the system's mixing time. I then show that when the bottleneck is a weakly broken symmetry, the otherwise exponentially expensive bottleneck eigenvector is the symmetry this http URL a non-Abelian group $G$, I prove that the correct initialization target is the group-averaging asymmetry. Projecting this asymmetry out requires a $G$-invariant input. Partial, subgroup-invariant inputs produce a cascade of mixing-time speedups indexed by the subgroup lattice. Conversely, matching first moments alone is provably this http URL asymmetry is a directly measurable initialization target. I verify these results analytically and numerically in an $SU(2)$ Davies sampler where total-spin multiplets constitute the slow modes. The predicted speedup cascade emerges with relaxation rates scaling linearly with the symmetry-breaking parameter. Finally, the model maps the boundaries of the asymmetry target, illustrating where the separate matching of conserved logical data becomes necessary.", "url": "https://arxiv.org/abs/2608.00055", "type": "理论+数值", "summary": "1. 该工作针对混合瓶颈为弱破缺对称性的量子吉布斯采样器，证明正确初始化由表示论决定，并给出非阿贝尔对称性破缺级联。\n2. 其核心在于证明消除慢模重叠可将标称前因子优化转化为渐近加速，并指出目标为群平均不对称性，部分子群不变输入产生按子群格索引的加速级联。\n3. 这提供了可直接测量的初始化目标；在SU(2) Davies采样器中验证了弛豫率随对称破缺参数线性标度的级联，并标定了需单独匹配守恒逻辑数据的边界。", "summary_source": "deepseek", "authors": [{"name": "Soo-Jong Rey"}], "featured_authors": [{"name": "Soo-Jong Rey"}], "author_count": 1}, {"id": "2608.00108", "category": "quant-ph", "title": "Canonical quantization of the Pais-Uhlenbeck oscillator with a higher-derivative perturbation: a covariant phase space approach", "abstract": "In this paper, we apply the covariant phase space formalism to the perturbative canonical quantization of the Pais-Uhlenbeck oscillator, with the acceleration-squared term treated as a perturbation. We quantize this model by constructing the symplectic form on the low-energy solution space. We then compute the energy spectrum and the unequal-time commutator in a perturbative way, and obtain the results that agree with the expansion of the exact low-energy theory. The perturbation method bypasses the standard Ostrogradsky construction and naturally decouples the Ostrogradsky ghost. This work extends our previous perturbative quantization scheme to genuine higher-derivative theories.", "url": "https://arxiv.org/abs/2608.00108", "type": "理论", "summary": "1. 该工作利用协变相空间形式，将加速度平方项视作高阶导数微扰，在低能解空间上构造辛形式，实现对Pais-Uhlenbeck振子的微扰正则量子化。\n2. 技术的核心在于绕开标准Ostrogradsky构造，使得Ostrogradsky鬼在低能有效理论中自然退耦，并用于微扰计算能量谱与不等时对易子。\n3. 所得微扰结果与精确低能理论的展开一致，表明该方案可扩展到真正的高阶导数场论，为无鬼的正则量子化路径提供了明确依据。", "summary_source": "deepseek", "authors": [{"name": "Jie-qiang Wu"}, {"name": "Jinan Zhao"}], "featured_authors": [{"name": "Jie-qiang Wu"}, {"name": "Jinan Zhao"}], "author_count": 2}, {"id": "2608.00189", "category": "quant-ph", "title": "Phase transitions in quantum-circuit compilation", "abstract": "Quantum-circuit compilation aims at finding an optimized realization of a target circuit under given constraints, e.g., the minimization of hardware-induced errors and the unitary-equivalence of the circuit. We connect the compilation process with the thermodynamics of a many-body spin system: circuit infidelity plays the role of the energy function and low-temperature states correspond to compiled circuits. In the paradigmatic case where crosstalk between parallel gates is present, we find a phase transition between a disordered phase and an antiferromagnetic brick-wall phase, compatible with the Ising universality class. At larger crosstalk, we observe a $\\mathbb{Z}_3$-ordered regime, suggesting that increasingly serial compiled circuits are associated with emergent $\\mathbb{Z}_n$-ordered phases. When the unitary-equivalence constraint is removed, these phases disappear, showing that the equivalence between circuits underlies the emergent criticality and constitutes a source of complexity in quantum-circuit compilation and, more generally, in equivalence-constrained optimization. Finally, we observe that the Kolmogorov complexity of the circuit enhances the emergence of ordered phases.", "url": "https://arxiv.org/abs/2608.00189", "type": "理论+数值", "summary": "1. 该工作将量子线路编译映射为多体自旋系统的热力学问题，并系统研究其平衡相变。\n2. 以线路保真度为能量函数，发现串扰诱导的Ising类相变及Zₙ有序相，且移除幺正等价约束后相变消失。\n3. 这揭示了幺正等价约束是编译复杂性与涌现临界性的来源，为约束优化提供了统计物理新视角。", "summary_source": "deepseek", "authors": [{"name": "Andrea De Girolamo"}, {"name": "Davide Rattacaso"}, {"name": "Simone Notarnicola"}, {"name": "Ilaria Siloi"}, {"name": "Simone Montangero"}], "featured_authors": [{"name": "Andrea De Girolamo"}, {"name": "Davide Rattacaso"}, {"name": "Simone Notarnicola"}, {"name": "Ilaria Siloi"}, {"name": "Simone Montangero"}], "author_count": 5}, {"id": "2608.00224", "category": "quant-ph", "title": "Marked vertex search on disordered graphs with Rosenzweig-Porter phases", "abstract": "Quantum marked vertex search algorithms are known to outperform their classical counterparts, yet their behavior in the presence of disorder remains largely unexplored. Here, we address this gap by studying marked vertex search on disordered random graphs. To introduce disorder, we implement the Rosenzweig-Porter (RP) model, a random matrix ensemble with tunable ergodic, non-ergodic extended, and localized phases, on Erdős-Rényi (ER) graphs. This produces a doubly random system where ER graph connectivity randomizes which interactions exist, while RP disorder controls their strength and `on-site' potentials, providing a two-parameter framework to study quantum dynamics on disordered networks. First, we show that the characteristic Wigner-Dyson-to-Poisson spectral crossover of the RP ensemble survives under graph constraints across the sparse-to-dense range, and we derive an analytical estimate for the finite-size localization boundary that shifts systematically with the graph edge probability $p$, consistent with a resonant-hybridization argument. Thereafter, using this disordered graph ensemble, we study the marked vertex search problem and find that search performance tracks the underlying quantum phase directly. Counterintuitively, the ergodic phase, despite supporting fast transport, yields lower success probability than the localized phase, which achieves high success probability at the cost of significantly longer search times. These results establish a direct and quantitative link between random matrix disorder on graphs and the performance of continuous-time quantum walk search, and suggest that disorder, rather than being merely an obstacle, can be exploited as a tunable parameter in quantum search protocols.", "url": "https://arxiv.org/abs/2608.00224", "type": "理论+数值", "summary": "1. 该工作研究了Rosenzweig-Porter无序作用在Erdős-Rényi随机图上标记顶点搜索问题，构建连接随机性与能级无序的双参数模型。\n2. 技术卖点在于刻画RP谱交叉在稀疏到稠密图下的存续，并解析导出有限尺寸局域化边界；搜索性能直接追踪量子相，局域相以长时换高成功率，遍历相反而较低。\n3. 这提示无序可作为可调资源而非障碍，为连续时间量子行走搜索协议及无序量子网络上的量子信息处理提供定量设计思路。", "summary_source": "deepseek", "authors": [{"name": "Sabyasachi Chakraborty"}, {"name": "Tilen Cadez"}, {"name": "Sonjoy Majumder"}, {"name": "Rohit Kishan Ray"}], "featured_authors": [{"name": "Sabyasachi Chakraborty"}, {"name": "Tilen Cadez"}, {"name": "Sonjoy Majumder"}, {"name": "Rohit Kishan Ray"}], "author_count": 4}, {"id": "2608.00225", "category": "quant-ph", "title": "Dissipation in Periodically Driven Quantum Systems: Partial Secularization and Thermodynamic Consistency", "abstract": "Periodically driven open quantum systems are central to quantum thermodynamics and quantum control. These systems are typically described using Floquet-Born-Markov master equations, derived with the use of a full secular approximation, and whose thermodynamic implications are often overlooked. In this context, we show that such a strong secular approximation may lead to unphysical predictions for steady state energy currents. We then demonstrate that a coarse-grained formulation of the master equation can regularize these issues while yielding completely positive dynamics and consistent energy currents. The coarse-graining time has a clear physical interpretation, as it defines the temporal resolution at which a Markovian master equation can describe the evolution of the periodically driven system. We show the consistency and validity of our approach by comparing to an exact non-Markovian simulation in paradigmatic examples: a driven two-level system and a three-level maser coupled to hot and cold thermal reservoirs. Our work provides a practical framework for correctly applying the secular approximation in periodically driven-dissipative systems and for assessing the accuracy of master equations of the GKSL form.", "url": "https://arxiv.org/abs/2608.00225", "type": "理论+数值", "summary": "1. 该工作研究周期驱动开放量子系统中的耗散问题，表明完全久期近似会带来稳态能量流的非物理预言，并给出替代方案。\n2. 其核心在于对主方程采用粗粒化形式，使粗粒化时间具有清晰物理含义，即马尔可夫方程可描述该驱动演化的时间分辨率，同时保证完全正定性与热力学一致的能量流，并通过驱动二能级系统和三能级激微波的精确非马尔可夫模拟加以验证。\n3. 这为周期驱动耗散系统中正确应用久期近似以及评估GKSL形式主方程的适用精度提供了实用理论框架。", "summary_source": "deepseek", "authors": [{"name": "Luísa T. Tude"}, {"name": "Carlos Ortega-Taberner"}, {"name": "Roberta Zambrini"}, {"name": "Gonzalo Manzano"}], "featured_authors": [{"name": "Luísa T. Tude"}, {"name": "Carlos Ortega-Taberner"}, {"name": "Roberta Zambrini"}, {"name": "Gonzalo Manzano"}], "author_count": 4}, {"id": "2608.00265", "category": "quant-ph", "title": "No low-degree tests for quantum states", "abstract": "We study the problem of testing low-degree phase states, namely m-qudit quantum states of the form $q^{-m/2} \\sum_{x \\in \\mathbb{F}_q^m} \\omega^{f(x)} |x>$, where $f$ is a degree-$d$ polynomial. In contrast to the classical setting, where low-degree polynomials admit highly efficient classical testers, it is not known whether analogous quantum tests exist. We show that no such quantum low-degree test exists: any tester requires $\\Omega(\\binom{\\lfloor m/2\\rfloor}{\\lfloor (d-1)/2 \\rfloor})$ copies to determine whether a given state is a degree-$d$ phase state or is far from every such state. Our results follow from a general framework that relates quantum testing of codeword phase states to classical decoding properties of the dual code, which allows us to leverage known bounds on the tolerance of high-rate Reed--Muller codes to random errors.", "url": "https://arxiv.org/abs/2608.00265", "type": "理论", "summary": "1. 该工作证明不存在检验量子低阶相位态的低度测试，任何测试器都需Ω(⌊m/2⌋选⌊(d−1)/2⌋)个副本才能区分目标态与远离所有低阶态的状态。\n2. 其技术核心是将码字相位态的量子检验归结为对偶码的经典译码性质，并借助高码率Reed–Muller码对随机错误的容错下界导出所需副本数。\n3. 这揭示了量子态检验与经典编码理论之间的深层联系，为后续量子性质测试的复杂度下界研究提供了可迁移的分析框架。", "summary_source": "deepseek", "authors": [{"name": "Omar Alrabiah"}, {"name": "Srinivasan Arunachalam"}, {"name": "Sabee Grewal"}, {"name": "John Wright"}], "featured_authors": [{"name": "Omar Alrabiah"}, {"name": "Srinivasan Arunachalam"}, {"name": "Sabee Grewal"}, {"name": "John Wright"}], "author_count": 4}, {"id": "2608.00365", "category": "quant-ph", "title": "Hamiltonian Thresholds for Objective Records", "abstract": "Classical objectivity requires an environment to witness a pointer value, not merely to decohere it. We derive microscopic Hamiltonian laws for this distinction. Exact QND product monitoring yields a certified two-edge strong-Darwinism window: sufficient witnesses cross the optimal record-discrimination edge while retaining an unobserved complement that crosses the residual-coherence edge. Under additional regularity assumptions, the supplement gives converse bounds at the same logarithmic scale. For controlled-phase monitors, environmental asymmetry gives a single-fragment information bound, a redundancy converse, and, in efficient i.i.d. streams, an achievable block-capacity law for redundant witnesses. A finite-temperature spin-phase bath shows the physical separation: hot probes can decohere efficiently while losing the local asymmetry needed for objective witnesses.", "url": "https://arxiv.org/abs/2608.00365", "type": "理论", "summary": "1. 该工作针对经典客观性需环境见证指针值而非仅使其退相干这一区分，推导了微观哈密顿量层面的阈值律。\n2. 其核心进展是在精确QND乘积监测下给出认证的双边强达尔文窗口，并在受控相位监测下得到单碎片信息界、冗余反向界以及i.i.d.流下的可达块容量律。\n3. 有限温度自旋相位浴表明热探针虽可高效退相干却丢失客观见证所需的局域不对称性，为客观记录的涌现与失效提供可检验物理判据。", "summary_source": "deepseek", "authors": [{"name": "Jie Gu"}], "featured_authors": [{"name": "Jie Gu"}], "author_count": 1}, {"id": "2608.00414", "category": "quant-ph", "title": "Sparse Quantum State Preparation with Sublinear T-Count", "abstract": "We study the fault-tolerant cost of preparing sparse quantum states, measured by $T$-count in the Clifford+$T$ model. Here an $n$-qubit state is called $s$-sparse if it is supported on at most $s$ computational-basis states. For arbitrary $n$-qubit states, the optimal $T$-count is $\\Theta(\\sqrt{2^n\\log(1/\\epsilon)}+\\log(1/\\epsilon))$, but for $s$-sparse states the best previous upper bounds remained linear in $s$. We show that any $n$-qubit $s$-sparse state can be prepared up to error $\\epsilon$ using $\\widetilde{O}(\\min\\{s,\\ n^{3/4}\\sqrt{s}\\}+\\sqrt{s\\log(1/\\epsilon)}+\\log(1/\\epsilon))$ $T$ gates, giving the first sublinear dependence on $s$ once the support is sufficiently large. Our approach is based on a support-aware synthesis theorem for sparse Boolean functions, which may be of independent interest. We also prove that, for every $0<\\epsilon\\le 1/6$ and $2\\le s\\le 2^{n/2}$, sparse-state preparation requires $\\Omega(\\min\\{s,\\sqrt{ns}\\})$ $T$ gates, showing that linear dependence on $s$ is unavoidable in the small-support regime and substantially narrowing the gap between the known upper and lower bounds within this parameter range.", "url": "https://arxiv.org/abs/2608.00414", "type": "理论", "summary": "1. 该论文研究容错Clifford+T电路中稀疏量子态制备的T门数代价，针对至多s个计算基态支撑的n比特态给出新的上界与下界。\n2. 技术上基于稀疏布尔函数的支撑感知综合定理，将任意s稀疏态的T门数降至O~(min{s,n^{3/4}√s}+√(s log(1/ε))+log(1/ε))，首次在大支撑区间实现亚线性于s的标度。\n3. 同时证明在该参数范围需Ω(min{s,√(ns)})个T门，说明小支撑区线性依赖不可避免，并为容错量子态制备的复杂度刻画收窄了差距。", "summary_source": "deepseek", "authors": [{"name": "Jingquan Luo"}, {"name": "Lvzhou Li"}], "featured_authors": [{"name": "Jingquan Luo"}, {"name": "Lvzhou Li"}], "author_count": 2}, {"id": "2608.00443", "category": "quant-ph", "title": "Trading Imaginary Time for Randomness in Ground State Preparation", "abstract": "Imaginary-time evolution (ITE) is a foundational method for ground state preparation on quantum computers. However, because ITE is non-unitary, existing implementations incur a sample complexity and/or classical cost that scales exponentially with the target imaginary time $\\beta$. Moreover, the state itself converges slower than the energy, making accurate estimation of arbitrary ground state observables even more expensive. In this work, we improve upon standard ITE by introducing twirled imaginary-time evolution (TITE), which pairs ITE with real-time evolution applied for a random duration drawn from a carefully designed distribution. We prove that this randomization quadratically suppresses the trace distance to the ground state, and thus also the error of arbitrary observables, which allows roughly half of the imaginary time to be replaced with real-time evolution ($\\beta \\mapsto \\beta/2$) while maintaining the same level of accuracy. Because real-time evolution is unitary and does not incur an overhead in sample complexity or classical computation, this affords a quadratic reduction in the cost of any black-box ITE implementation, including Trotterization and quantum imaginary-time evolution. We demonstrate the efficiency of our algorithm in noisy circuit-level simulations of a non-integrable Ising chain, showing substantial improvements over standard ITE.", "url": "https://arxiv.org/abs/2608.00443", "type": "数值", "summary": "1. 该工作提出扭曲虚时演化（TITE），将虚时演化与按精心设计分布随机持续时间的实时演化配对，以改进量子基态制备。\n2. 其技术核心是证明该随机化将到基态的迹距离与任意可观测量误差二次方抑制，使虚时长度可由β降至β/2，同时因实时演化幺正且无样本开销，使任意黑盒虚时实现（如Trotter化与QITE）成本二次降低。\n3. 在非可积Ising链的含噪电路模拟中展示较标准虚时演化的显著改进，为近期量子器件上的基态制备与可观测量估计提供了更高效且抗噪的实用方案。", "summary_source": "deepseek", "authors": [{"name": "Alvan Arulandu"}, {"name": "John M. Martyn"}, {"name": "Isaac L. Chuang"}], "featured_authors": [{"name": "Alvan Arulandu"}, {"name": "John M. Martyn"}, {"name": "Isaac L. Chuang"}], "author_count": 3}, {"id": "2608.00550", "category": "quant-ph", "title": "Multiparameter quantum estimation in a photon system induced by gravitational redshift", "abstract": "As photons propagate through curved spacetime, gravitational effects become unavoidable. In particular, gravitational redshift can induce significant distortion in photon wave packets, making it es?sential to investigate parameter estimation within this context. While previous research has focused on single-parameter estimation using the quantum Cramer-Rao bound, the multiparameter scenario remains largely unexplored. In this work, we investigate multiparameter quantum estimation for a photon system subject to gravitational redshift under both amplitude-damping and Ohmic-like dephasing channels. Our analysis reveals that the quantum Cramer-Rao bound fails to provide a tight error bound for the two-parameter estimation involving the initial phase and weight parameters inboth types of noisy channels. To overcome this limitation, we numerically compute two tighter error bounds, i.e., the Holevo Cramer-Rao bound and the Nagaoka bound, when utilizing a semidefinite program. We demonstrate that the Nagaoka bound yields the tightest error bound among all considered bounds, consistent with the general hierarchy of multiparameter quantum estimation. Furthermore, for the three-parameter estimation, including the initial weight parameter, the phase parameter, and the strength of gravitational redshift, we observe significantly enhanced estimation precision in the strong-coupling regime compared to the weak-coupling regime under the amplitude-damping channel. Similarly, in the Ohmic-like dephasing channel, the sub-Ohmic regime consistently affords higher precision than the Ohmic and super-Ohmic regimes.", "url": "https://arxiv.org/abs/2608.00550", "type": "理论+数值", "summary": "1. 该工作研究光子受引力红移影响后，在振幅阻尼与类欧姆退相位通道中的多参数量子估计问题。\n2. 其要点在于证明两参数估计时量子克拉美-罗界不再紧致，并利用半定规划数值求解Holevo界与Nagaoka界，结果表明Nagaoka界给出最紧误差下界。\n3. 对含权重、相位及引力红移强度的三参数估计，振幅阻尼通道下强耦合区精度高于弱耦合区，类欧姆通道则中亚欧姆区精度最高，可为弯曲时空量子计量提供参考。", "summary_source": "deepseek", "authors": [{"name": "Wei Ye"}, {"name": "Hui Cao"}, {"name": "Songtao Zhang"}, {"name": "Xiang Zhu"}, {"name": "Huan Zhang"}, {"name": "Ying Xia"}, {"name": "Shixun You"}, {"name": "Daisheng Zhang"}, {"name": "Shoukang Chang"}], "featured_authors": [{"name": "Wei Ye"}, {"name": "Hui Cao"}, {"name": "Songtao Zhang"}, {"name": "Shixun You"}, {"name": "Daisheng Zhang"}, {"name": "Shoukang Chang"}], "author_count": 9}, {"id": "2608.00560", "category": "quant-ph", "title": "Adaptive operator-generated subspaces for effective many-body Hamiltonians", "abstract": "Electronic-structure and embedding workflows terminate in effective many-body Hamiltonians, whereas quantum eigensolver studies often start from hand-built qubit models. We present the Adaptive Clifford-Algebra Subspace Eigensolver (A-CASE), a single-reference, operator-generated Rayleigh--Ritz method. Overlap, Hamiltonian, observable, and response matrices are reconstructed from one shared Pauli-expectation bank, while adaptive growth scores overlap-aware local pencils and rejects symmetry leakage or near-linear dependence. A strict FCIDUMP adapter supplies the active-space boundary. For linear H$_4$ in STO-3G with CAS(4e,4o), the mapped sector agrees with independent determinant FCI to $3.1\\times10^{-15}$ Ha. At a nine-vector budget A-CASE has a $3.019$ mHa error; replacing the determinant reference by a two-operator ADAPT-VQE state reduces it to $0.342$ mHa, without implying a matched total-cost advantage. Under a matched contract, the fixed-reference route uses one state preparation versus ADAPT-VQE's ninety but measures roughly an order of magnitude more Pauli words. Exact fixed-angle ADAPT-GCIM gives $13.364$ mHa at the nearest size match and $10.674$ mHa at the iteration match, with its transition-pair burden reported separately. Across a broader benchmark ladder, fixed Krylov bases are generally more accurate and often narrower but substantially less well conditioned. A grouped bootstrap propagates finite-shot variability through thresholding, diagonalization, root matching, spectral weights, susceptibility, and broadening; its bands are explicitly heuristic and conditional, not finite-sample confidence certificates. The work establishes an executable path from an interchange Hamiltonian to energies, correlations, and response, without claiming materials accuracy, favorable scaling, or quantum advantage.", "url": "https://arxiv.org/abs/2608.00560", "type": "理论+数值", "summary": "1. 该工作提出自适应Clifford-代数子空间本征求解器(A-CASE)，利用共享泡利期望值库重建重叠、哈密顿量、可观测量与响应矩阵，进行算符生成的Rayleigh-Ritz求解。\n2. 其卖点是以重叠感知的自适应生长排除对称泄漏与近线性相关，在H4/STO-3G的CAS(4e,4o)下使映射扇区与独立FCI一致到3.1e-15 Ha；固定参考路线仅需一次态制备但测量更多泡利词，而双算符ADAPT-VQE参考在九向量时误差降至0.342 mHa。\n3. 这为从互换哈密顿量到能量、关联与响应的可执行路径提供了基准，并给出启发式条件性不确定度带，但明确不主张材料精度、有利标度或量子优势，对子空间方法比较具有参考价值。", "summary_source": "deepseek", "authors": [{"name": "Ginanjar Utama"}, {"name": "Hermawan Kresno Dipojono"}], "featured_authors": [{"name": "Ginanjar Utama"}, {"name": "Hermawan Kresno Dipojono"}], "author_count": 2}, {"id": "2608.00596", "category": "quant-ph", "title": "Breakdown of the optical saturation regime in molecular single-photon emitters", "abstract": "Solid-state single organic molecules, such as dibenzoterrylene (DBT) in organic matrices, are prominent deterministic single-photon sources, usually modeled as effective two-level systems (TLS). We show that single DBT molecules in anthracene nanocrystals, under strong continuous-wave driving, depart from this picture: instead of the expected saturation, fluorescence is strongly suppressed at high resonant pump power, while the linewidth broadens beyond the TLS prediction -- an \\emph{anomalous saturation} regime. Comparing coherent and incoherent excitation and independently calibrating temperature via phonon-induced dephasing rules out laser-induced heating and intersystem crossing. Instead, a model of intensity-dependent excited-state absorption (ESA) toward a short-lived dark state quantitatively reproduces both the fluorescence suppression and the linewidth broadening. We further show that matrix quality mitigates this quenching, and that pulsed excitation schemes are strategic toward full population inversion, with direct implications for quantum nanophotonics and molecular optomechanics.", "url": "https://arxiv.org/abs/2608.00596", "type": "理论", "summary": "1. 该工作实验揭示单个DBT分子在蒽纳米晶中受强连续光驱动时偏离二能级饱和行为，出现荧光抑制与线宽反常增宽。\n2. 通过相干/非相干激发对比及声子温标排除加热与系间窜越，建立依赖强度的激发态吸收至短寿命暗态模型，定量重现反常饱和。\n3. 这为优化分子单光子源基质质量与采用脉冲激发实现完全布居反转提供依据，并影响量子纳米光子学与分子光力学。", "summary_source": "deepseek", "authors": [{"name": "Hugo Levy-Falk"}, {"name": "Daniele De Bernardis"}, {"name": "Elena Fanella"}, {"name": "Louise Morlaës"}, {"name": "Costanza Toninelli"}], "featured_authors": [{"name": "Hugo Levy-Falk"}, {"name": "Daniele De Bernardis"}, {"name": "Elena Fanella"}, {"name": "Louise Morlaës"}, {"name": "Costanza Toninelli"}], "author_count": 5}, {"id": "2608.00670", "category": "quant-ph", "title": "Coordinate space representation for quantum simulation of scalar field theory", "abstract": "Quantum computing provides a promising framework for the simulation of quantum field theories, where the computational cost depends both on the quantum algorithm employed and on the representation of the Hamiltonian. We investigate a formulation of the $\\phi^4$ model based on the harmonic-oscillator basis in coordinate space. We derive the lattice $\\phi^4$ Hamiltonian in this representation and analyze the structure of the resulting one-body matrix and interaction tensor. We show that both exhibit an effective band-diagonal structure, allowing controlled truncations of the Hamiltonian while preserving the low-energy spectrum. We validate this formulation by comparing low-energy observables obtained from numerical diagonalization with those computed in the standard harmonic-oscillator momentum-space representation. Finally, we estimate the resources required to encode the Hamiltonian on a quantum computer using both binary and unary boson-to-qubit mappings. By exploiting effective locality, the coordinate-space representation reduces the resources required for quantum simulation over a broad range of parameters.", "url": "https://arxiv.org/abs/2608.00670", "type": "理论+数值", "summary": "1. 该工作提出并数值验证了用于标量场论量子模拟的坐标空间谐振子基表示，推导了格点φ^4哈密顿量，并与动量空间表示的低能观测量进行比对。\n2. 核心卖点在于揭示单体和相互作用张量均呈有效带状结构，允许可控截断而不破坏低能谱；采用二进制和幺正玻色子-量子比特映射后，可显著减少广泛参数范围内的量子模拟资源需求。\n3. 这为量子计算机上标量场论的大规模模拟提供了可扩展的坐标空间编码路径，并为其他量子场论的表示优化提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Gaetan Bardy"}, {"name": "Matthieu Saubanere"}, {"name": "Adrian Tanasa"}], "featured_authors": [{"name": "Gaetan Bardy"}, {"name": "Matthieu Saubanere"}, {"name": "Adrian Tanasa"}], "author_count": 3}, {"id": "2608.00741", "category": "quant-ph", "title": "Quantum Speedups for Testing Similar Means", "abstract": "Property testing of distributions is a central topic in information theory, learning theory, and statistics. While quantum algorithms are known to offer significant speedups for property testing of a single distribution or a pair of distributions, it is unclear whether quantum algorithms provide speedups for property testing of $m$ ($m\\geq 3$) distributions. This work focuses on quantum algorithms for testing whether $m$ distributions have similar means or are $\\epsilon$-far from mean similarity under two models. In the query model, the algorithm can choose which distribution to sample from, whereas in the sampling model, the distributions are selected uniformly. We design quantum algorithms with complexities $\\tilde{O}(1/\\epsilon)$ (the $\\tilde{O}$ notation hides poly-logarithmic factors) and $\\tilde{O}(\\sqrt{m}/\\epsilon)$ in the query and sampling models, respectively, achieving quadratic speedups over the classical counterparts. We further establish quantum lower bounds of $\\Omega\\left(1/\\epsilon\\right)$ and $\\Omega\\rbra{m^{1/3}+\\frac{m^{1/4}}{\\epsilon}}$ for the query model and the sampling model, demonstrating the optimality of our quantum algorithms in terms of the dependence on $\\epsilon$ up to logarithmic factors.", "url": "https://arxiv.org/abs/2608.00741", "type": "理论+数值", "summary": "1. 该工作研究m个分布均值相似性检验，在查询模型与采样模型下设计量子算法并证明复杂度下界。\n2. 技术上，查询模型复杂度为Õ(1/ε)，采样模型为Õ(√m/ε)，均相对经典实现二次加速，且下界Ω(1/ε)与Ω(m^{1/3}+m^{1/4}/ε)表明ε依赖最优。\n3. 这表明量子加速可扩展至多分布（m≥3）的性质检验，为更一般分布族与模型间复杂度研究提供了新基准。", "summary_source": "deepseek", "authors": [{"name": "Chengshen Gao"}, {"name": "Yongzhen Xu"}, {"name": "Shenggen Zheng"}, {"name": "Lvzhou Li"}], "featured_authors": [{"name": "Chengshen Gao"}, {"name": "Yongzhen Xu"}, {"name": "Shenggen Zheng"}, {"name": "Lvzhou Li"}], "author_count": 4}, {"id": "2608.00930", "category": "quant-ph", "title": "Parallel Repetition in the Two-Player Quantum Cloning Game", "abstract": "We study parallel repetition in the two-player quantum cloning game, a monogamy-of-entanglement game motivated by quantum position verification. Colisson Palais, Escolà-Farràs, and Speelman bounded the value of $n$ copies between $(3/4)^n$ and $\\cos^{2n}(\\pi/8)$. For two copies, we prove that neither bound is tight. An explicit challenge-dependent strategy achieves value $(5+\\sqrt{17})/16>9/16$, so strong parallel repetition fails for the unrestricted game. A block Gram matrix argument gives the upper bound $(11+\\sqrt{65})/32<\\cos^4(\\pi/8)$ and strictly improves the previous parallel-repetition upper bound for every $n$. For every $n$, challenge-independent strategies have optimal value $(3/4)^n$.", "url": "https://arxiv.org/abs/2608.00930", "type": "理论", "summary": "1. 论文研究双玩家量子克隆博弈的并行重复问题，并在两拷贝情形下精确评估其博弈值。\n2. 其要点在于构造显式挑战依赖策略说明强并行重复失败，并借助分块 Gram 矩阵给出严格优于此前上界的结果。\n3. 该结果对所有 n 改进并行重复上界，为量子位置验证及纠缠单配性协议提供了更紧的理论约束。", "summary_source": "deepseek", "authors": [{"name": "Eli Coe Naig"}, {"name": "Stephen A. Fenner"}], "featured_authors": [{"name": "Eli Coe Naig"}, {"name": "Stephen A. Fenner"}], "author_count": 2}, {"id": "2608.01011", "category": "quant-ph", "title": "Complete Existence Classification of Seven-Partite Absolutely Maximally Entangled States", "abstract": "We prove that an absolutely maximally entangled state of seven qudits exists if and only if the local dimension satisfies $d\\geq 3$. Prior to this work, to the best of our knowledge, $\\text{AME}(7,d)$ states were known to exist only when $d$ is a prime power other than $2$, or when $d$ can be expressed as a product of dimensions for which existence was already known. Since it has been proved that no $\\text{AME}(7,2)$ state exists, it remains to establish existence for all $d\\geq 3$. We construct cyclic quadratic-phase states for every odd local dimension and develop a coupled binary--odd-dimensional construction for every dimension congruent to $2$ modulo $4$. Together with the known power-of-two cases and the product property of AME states, these constructions cover every local dimension $d\\geq 3$.", "url": "https://arxiv.org/abs/2608.01011", "type": "理论", "summary": "1. 该论文给出七体绝对最大纠缠态存在性的完整分类，严格证明七 qudit 的 AME 态存在当且仅当局域维度 d≥3。\n2. 技术卖点在于利用循环二次相位态覆盖所有奇维情形，并引入二元-奇维耦合构造处理 d≡2 (mod 4) 的维度，再结合已知的 2 的幂情形与乘积性质补全全部 d≥3。\n3. 该分类彻底解决七体 AME 的存在性问题，为高维多体纠缠资源在量子纠错、全息对偶及相关模型中的可用性给出了精确的维度门槛。", "summary_source": "deepseek", "authors": [{"name": "Fei Shi"}, {"name": "Xiande Zhang"}, {"name": "Qi Zhao"}, {"name": "Lvzhou Li"}], "featured_authors": [{"name": "Fei Shi"}, {"name": "Xiande Zhang"}, {"name": "Qi Zhao"}, {"name": "Lvzhou Li"}], "author_count": 4}, {"id": "2608.01088", "category": "quant-ph", "title": "Twenty-one characterizations of reversible quantum channels", "abstract": "Reversible quantum channels play a fundamental role in quantum dynamics and quantum information processing. A quantum channel is reversible if there exists another quantum channel acting as its left inverse. Due to their intrinsic significance and wide applications, it is desirable to characterize reversible quantum channels from diverse perspectives. In this work, we study reversible quantum channels on finite-dimensional Hilbert spaces, with particular emphasis on the case of different input and output dimensions. We systematically present twenty-one equivalent characterizations of reversible quantum channels from algebraic, geometrical, and information-theoretical perspectives. Among these characterizations, some are well known, while others, implicit in the literature or formulated in other contexts, are clarified here; the Choi-state characterization is derived in this work. Specifically, we prove that the Choi states of reversible quantum channels admit three equivalent forms: the spectral, direct-sum, and tensor-product representations. These twenty-one equivalent characterizations establish a comprehensive framework for reversible quantum channels, provide diverse insights into the structural and information-theoretic properties of quantum channels, and facilitate applications of reversibility in quantum information processing such as quantum error correction, quantum teleportation, and quantum thermodynamics.", "url": "https://arxiv.org/abs/2608.01088", "type": "理论", "summary": "1. 该工作针对有限维Hilbert空间上的可逆量子信道，特别关注输入与输出维数不相等的一般情形，系统提出了来自代数、几何和信息论视角的二十一种等价刻画。\n2. 其主要卖点是建立了统一完整的表征框架，其中Choi态表征为本文新推导，并证明可逆信道的Choi态具有谱分解、直和及张量积三种等价表示形式。\n3. 该框架为量子纠错、量子隐形传态和量子热力学等过程中信道可逆性的判定与利用，提供了结构化的理论判据和实用工具。", "summary_source": "deepseek", "authors": [{"name": "Nan Li"}, {"name": "Yuan Li"}, {"name": "Hanyu Yang"}, {"name": "Shunlong Luo"}], "featured_authors": [{"name": "Nan Li"}, {"name": "Yuan Li"}, {"name": "Hanyu Yang"}, {"name": "Shunlong Luo"}], "author_count": 4}, {"id": "2608.01124", "category": "quant-ph", "title": "Maximal Rényi Relative Entropy for $α>2$", "abstract": "Quantum relative entropies play a fundamental role in quantum information theory. In the classical setting, Rényi relative entropies constitute, up to linear combinations, the most general class of relative entropies, naturally motivating the search for their minimal and maximal quantum extensions. The minimal extension is known to be the reverse sandwiched Rényi relative entropy for $\\alpha\\in[0,1/2)$ and the sandwiched Rényi relative entropy for $\\alpha\\geq 1/2$. In contrast, the maximal extension had previously been identified only for $\\alpha\\in[0,2]$, where it is given by the geometric Rényi relative entropy. In this work, we complete this characterization by proving that for $\\alpha>2$, the maximal extension is given by the $\\alpha$-$z$ Rényi relative entropy with $z=\\alpha-1$. As an application, we determine when an energy-incoherent state can be transformed into an energy-coherent state by a Gibbs-preserving operation assisted by an uncorrelated catalyst, thereby fully characterizing the coherence-generating power of this class of operations in the catalytic setting.", "url": "https://arxiv.org/abs/2608.01124", "type": "理论", "summary": "1. 该工作证明对α>2，最大Rényi相对熵扩展由参数z=α-1的α-z Rényi相对熵给出。\n2. 其核心在于补全最大扩展的完整刻画，并用于判定催化吉布斯保持操作能否将能量非相干态转化为相干态。\n3. 这为量子相对熵族的极值结构及催化相干性生成能力提供了确定性的理论边界。", "summary_source": "deepseek", "authors": [{"name": "Roberto Rubboli"}], "featured_authors": [{"name": "Roberto Rubboli"}], "author_count": 1}, {"id": "2608.01308", "category": "quant-ph", "title": "Sharp Quantum Capacity Thresholds: Exponential Strong Converses for Degradable and Antidegradable Channels", "abstract": "The quantum capacity of a noisy channel quantifies the maximum rate at which quantum information can be transmitted reliably. For general channels, its evaluation requires an optimization over arbitrarily many channel uses. Degradable channels form a central exception: their capacity is given by the single-letter coherent information, while antidegradable channels have zero capacity. Nevertheless, even for these fundamental classes, it has remained open whether communication above capacity becomes possible when a fixed non-maximal error is tolerated. Here we resolve this problem by proving an exponential strong converse for every finite-dimensional degradable and antidegradable channel: at any rate above capacity, the fidelity of every coding scheme decays exponentially with the number of channel uses. As an immediate consequence, we establish the first all-code exponential strong converse for the quantum erasure channel throughout its full parameter range, strengthening previous results that applied only to almost all codes. We also show that exponential strong-converse bounds are preserved under receiver post-processing. This yields efficiently computable semidefinite-programming bounds for arbitrary finite-dimensional channels, improved bounds for Pauli channels, and an exact exponential strong converse for a nondegradable multilevel amplitude-damping family.", "url": "https://arxiv.org/abs/2608.01308", "type": "理论+数值", "summary": "1. 该工作证明了任意有限维可退化与反退化信道的指数强逆定理，即高于容量的所有编码保真度随信道使用次数指数衰减。\n2. 关键技术在于证明强逆界在接收端后处理下保持，从而为一般信道提供可有效计算的半定规划界，并首次给出量子擦除信道全参数范围的全体编码指数强逆。\n3. 这为信道容量有限块长行为与容错量子通信提供了普适下界，并可能推广至更多非退化信道族及实际编码方案。", "summary_source": "deepseek", "authors": [{"name": "Tulja Varun Kondra"}, {"name": "Raphael Brinster"}, {"name": "Hermann Kampermann"}, {"name": "Dagmar Bruß"}, {"name": "Nikolai Wyderka"}], "featured_authors": [{"name": "Tulja Varun Kondra"}, {"name": "Raphael Brinster"}, {"name": "Hermann Kampermann"}, {"name": "Dagmar Bruß"}, {"name": "Nikolai Wyderka"}], "author_count": 5}, {"id": "2608.01316", "category": "quant-ph", "title": "Compiler Framework for 3D Neutral-Atom Quantum Computers", "abstract": "Neutral-atom quantum computers can now arrange atoms in three-dimensional tweezer arrays, yet every existing compiler assumes a flat geometry. We present Piqasso, a compiler that exploits the vertical axis by stacking storage, entanglement, and readout into distinct layers. Its pipeline pairs an analytical placement respecting axial-clearance optics with a router that brings gate partners together via short vertical hops---bypassing in-plane crossing conflicts through out-of-plane detours---and a multi-AOD scheduler that parallelizes transport across focal planes. On 34 circuits, Piqasso reduces atom transport distance by 2.1$\\times$ over a state-of-the-art planar compiler, yielding up to 7.3$\\times$ faster execution, 2.2$\\times$ higher movement fidelity, and 1.8$\\times$ fewer serialized transport rounds, with all gains widening at scale.", "url": "https://arxiv.org/abs/2608.01316", "type": "理论", "summary": "1. 该工作提出面向三维中性原子量子计算机的编译器框架Piqasso，将存储、纠缠与读出分层堆叠于垂直光镊阵列中。\n2. 其核心技术在于结合轴向光学间隙的解析布局、垂直跳跃路由绕过平面交叉冲突，以及跨焦平面的多AOD并行调度。\n3. 在34个电路测试中，相较先进平面编译器将原子输运距离缩短2.1倍，执行速度最高提升7.3倍、运动保真度提升2.2倍、串行输运轮次减少1.8倍，且优势随规模扩大。", "summary_source": "deepseek", "authors": [{"name": "Chen Huang"}, {"name": "Zhemin Zhang"}, {"name": "Zhao Zhang"}, {"name": "Xudong Lv"}, {"name": "Zhiding Liang"}], "featured_authors": [{"name": "Chen Huang"}, {"name": "Zhemin Zhang"}, {"name": "Zhao Zhang"}, {"name": "Xudong Lv"}, {"name": "Zhiding Liang"}], "author_count": 5}, {"id": "2608.01365", "category": "quant-ph", "title": "Expressive Power and Limitations of Multi-photon Quantum Neural Networks", "abstract": "Quantum neural networks (QNNs) have shown promise in leveraging quantum computation for machine learning tasks. Utilizing multiple identical photons as input, multi-photon quantum neural networks (MPQNNs) have the potential to enhance the expressivity through increasing the photon number. However, how precisely the expressivity of an MPQNN is affected by an increase in photon number, and whether it can be infinitely enhanced by increasing the photon number, remains unexplored. In this work, we quantitatively estimate the expressivity of this model by deriving upper bounds on approximation error in two cases. In the case of a fixed observable, there exists a threshold that scales linearly with the mode number. Below the threshold, the expressivity of an MPQNN can be enhanced polynomially by increasing the photon number. Above the threshold, however, increasing the photon number does not affect the expressivity. In the case of a trainable observable, the expressivity can always be enhanced polynomially by increasing the photon number. These findings are then validated by numerical simulations. Our work elucidates the performance enhancement of multi-photon quantum feature in QNNs, as well as its limitations, offering guidance for leveraging multi-photon advantages in quantum machine learning.", "url": "https://arxiv.org/abs/2608.01365", "type": "理论+数值", "summary": "1. 该工作定量研究了多光子量子神经网络（MPQNN）的表达能力，并为两种观测量情形导出了逼近误差上界。\n2. 其核心发现在于：固定观测量下存在随模式数线性增长的光子数阈值，低于阈值时表达性随光子数多项式增强，高于阈值则饱和；可训练观测量下则始终可多项式增强。\n3. 这为量子机器学习中利用多光子量子特征并规避其局限提供了明确判据，也为后续理论分析与实验设计给出指导。", "summary_source": "deepseek", "authors": [{"name": "Zeyu Xiao"}, {"name": "Weixu Shi"}, {"name": "Yizhi Wang"}, {"name": "Lingling Lao"}, {"name": "Junjie Wu"}], "featured_authors": [{"name": "Zeyu Xiao"}, {"name": "Weixu Shi"}, {"name": "Yizhi Wang"}, {"name": "Lingling Lao"}, {"name": "Junjie Wu"}], "author_count": 5}, {"id": "2608.01438", "category": "quant-ph", "title": "Automated Construction and Verification of Unextendible Product Bases", "abstract": "Unextendible product bases (UPBs) are important structures in quantum information theory, with applications to completely entangled subspaces, bound entanglement, and local indistinguishability. Since many properties and applications of UPBs are closely related to their cardinalities, one of the central problems in the study of UPBs is to determine whether UPBs of prescribed sizes exist in a given multipartite system. In this paper, we introduce a SAT-assisted framework based on decompositions of the \\(N\\)-dimensional hypercube. We define \\(O_N\\)-tile decompositions and prove a tile-to-UPB theorem: every \\(O_N\\)-tile decomposition induces a UPB through a construction based on tile-wise Fourier product bases and a global stopper state. We then encode the search for such decompositions as a Boolean satisfiability (SAT) problem and use SAT solvers to generate explicit instances. In terms of verification, we also implement a UPB verification algorithm based on local orthogonality graphs and unsaturated subspaces. The algorithm can be used to determine whether an arbitrary finite set of product states forms a UPB. Using this framework, we obtain UPBs of several sizes in some tripartite and quadripartite systems, including sizes \\(13,14,\\ldots,23\\) in \\(\\mathbb C^3\\otimes\\mathbb C^3\\otimes\\mathbb C^3\\). Moreover, the small-dimensional instances obtained here can serve as seed UPBs for recursive constructions, leading to further examples in larger multipartite systems.", "url": "https://arxiv.org/abs/2608.01438", "type": "理论+数值", "summary": "1. 该工作提出基于N维超立方体分解的SAT辅助框架，用于自动构造并验证多体系统中的不可扩展乘积基(UPB)。\n2. 技术核心是证明每个O_N-瓦片分解经逐瓦片Fourier乘积基与全局stopper态诱导一个UPB，并把搜索编码为布尔可满足性问题，同时用局域正交图与未饱和子空间实现UPB验证算法。\n3. 由此在C^3⊗C^3⊗C^3中获得大小13至23的UPB，且小维实例可作为递归构造种子，为更大多体系统提供新例子。", "summary_source": "deepseek", "authors": [{"name": "Zicheng Han"}, {"name": "Wanchen Zhang"}, {"name": "Fei Shi"}, {"name": "Xiande Zhang"}], "featured_authors": [{"name": "Zicheng Han"}, {"name": "Wanchen Zhang"}, {"name": "Fei Shi"}, {"name": "Xiande Zhang"}], "author_count": 4}, {"id": "2608.01483", "category": "quant-ph", "title": "Spatial-Order Hierarchy of Time-Dependent Exchange-Correlation Potential", "abstract": "Exact time-dependent density-functional theory separates the exchange-correlation potential into interaction and kinetic-correlation components, but the structural relation between them remains unknown. We establish a representability constraint based on the off-diagonal expansion of the one-electron reduced density matrix relative to a time-dependent Hartree-Fock (TDHF) reference. A non-zero linear term generates a non-HF current density while the kinetic-correlation component remains HF representable; higher-order off-diagonal structure activates the kinetic component. In a one-dimensional two-electron correlation quench, retaining the exact interaction component while setting the kinetic component to zero suppresses the density broadening of the exact evolution. These results establish a hierarchy of density equations of motion and provide an exact constraint for non-adiabatic functional construction.", "url": "https://arxiv.org/abs/2608.01483", "type": "理论+数值", "summary": "1. 该工作通过相对于含时Hartree-Fock参考的单电子密度矩阵非对角展开，建立了精确含时密度泛函理论中交换关联势的相互作用与动能关联两分量须满足的可表示性约束。\n2. 其物理卖点是揭示线性非对角项产生非HF电流密度而动能关联分量仍保持HF可表示，只有更高阶非对角结构才激活动能关联，且在一维两电子关联淬火中，去除该分量会抑制精确演化的密度展宽。\n3. 这一结果给出密度运动方程的分层结构及非绝热泛函构造的精确约束，为近似泛函方案提供了可检验的严格基准。", "summary_source": "deepseek", "authors": [{"name": "Naoki Negishi"}], "featured_authors": [{"name": "Naoki Negishi"}], "author_count": 1}, {"id": "2608.01723", "category": "quant-ph", "title": "Ring Optimized M-APSK Modulation for Discrete Modulated CV-QKD", "abstract": "This paper proposes a multi ring M-APSK constellation optimization method for discrete-modulated continuous variable quantum key distribution. Unlike conventional APSK structures with fixed ring spacing and predefined ring probabilities, the proposed method optimizes the ring radius ratio and ring probability to improve the finite-size secret key rate. A method based on the Gram matrix is used to calculate the nonzero spectrum of the average state $\\tau$, and fidelity is used to compare the optimized discrete average state with the Gaussian average state. The results show that the proposed structure extends the maximum transmission distance of 16-APSK by approximately 15% compared with the conventional binomial APSK structure. The optimization gain is larger for small size APSK constellations, where the average state has a larger structural gap from Gaussian modulation.", "url": "https://arxiv.org/abs/2608.01723", "type": "数值", "summary": "1. 该工作针对离散调制连续变量量子密钥分发，提出一种多环M-APSK星座优化方法，通过联合优化环半径比与环概率提升有限码长下的安全密钥率。\n2. 技术要点是利用Gram矩阵计算平均态τ的非零谱，并以保真度刻画优化离散平均态与高斯平均态的结构差距，从而指导星座参数设计。\n3. 结果显示16-APSK最大传输距离较常规二项式APSK延长约15%，且小尺寸APSK因结构差距更大而获益更多，为实际CV-QKD系统性能改进提供了方向。", "summary_source": "deepseek", "authors": [{"name": "Seonguk Kim"}, {"name": "Jun Heo"}], "featured_authors": [{"name": "Seonguk Kim"}, {"name": "Jun Heo"}], "author_count": 2}, {"id": "2608.01770", "category": "quant-ph", "title": "The Sample Complexity of Fidelity Estimation to a Known Rank-$r$ Reference State Is $\\widetildeΘ(r^2/\\varepsilon^2)$", "abstract": "We settle the sample complexity of estimating the root Uhlmann fidelity $F(\\rho,\\sigma)=\\operatorname{tr}\\sqrt{\\sqrt{\\sigma}\\rho\\sqrt{\\sigma}}$ between an unknown state $\\rho$ and a known rank-$r$ reference state $\\sigma$. Writing $S(r,\\varepsilon)$ for the sample complexity at additive error $\\varepsilon$, we resolve the open problem posed by Wang by closing, up to logarithmic factors, the gap between the previously known bounds $\\Omega(r/\\varepsilon^2)$ and $O(r^2/\\varepsilon^2)$. We prove $S(r,\\varepsilon)=\\widetilde{\\Theta}(r^2/\\varepsilon^2)$ for all $0<\\varepsilon\\le\\varepsilon_0$, where $\\varepsilon_0>0$ is a universal constant. The lower bound already holds on a $2r$-dimensional system when $\\sigma$ is maximally mixed on a fixed $r$-dimensional subspace, and for a hard family of states that do not commute with $\\sigma$. The proof combines exact spectral moment matching, a radially size-biased doubly correlated Wishart model, and the Cauchy identity, reducing state indistinguishability to a long-cycle estimate for a weighted random permutation. A direct-sum embedding and binomial thinning yield the optimal $1/\\varepsilon^2$ dependence. We also prove a near-quadratic lower bound $\\widetilde{\\Omega}(r^2)$ for quantum spectrum estimation at constant accuracy. Combined with the recent $O(r^2(\\log\\log r/\\log r)^2)$ upper bound, this determines the polynomial order of the sample complexity in this regime and establishes a near-quadratic barrier.", "url": "https://arxiv.org/abs/2608.01770", "type": "理论", "summary": "1. 该工作严格确定了未知态与已知秩-r参考态之间Uhlmann保真度估计的样本复杂度为Θ~(r^2/ε^2)，从而解决了Wang提出的开放问题。\n2. 其核心在于结合精确谱矩匹配、径向尺寸偏置的双相关Wishart模型与Cauchy恒等式，将态不可区分性归结为加权随机置换的长圈估计，并利用直和嵌入与二项稀疏化获得最优1/ε^2依赖。\n3. 这为量子谱估计建立了近二次样本复杂度壁垒，并为设计最优保真度与谱估计协议、理解非对易态可区分性提供了明确基准。", "summary_source": "deepseek", "authors": [{"name": "Gye Jin Lee"}, {"name": "Sunghyeon Jo"}], "featured_authors": [{"name": "Gye Jin Lee"}, {"name": "Sunghyeon Jo"}], "author_count": 2}, {"id": "2608.01831", "category": "quant-ph", "title": "Symmetry-Projected Compatible Multiparameter Quantum Sensing", "abstract": "We establish a general symmetry-projection framework for multiparameter quantum sensing. Decomposing encoding generators into subspace-preserving and subspace-changing components relative to a symmetry sector identically eliminates all cross-sector elements of the quantum Fisher information matrix (QFIM) and the mean symmetric logarithmic derivative (SLD) commutator matrix. When projected subspace-changing generators act as a scalar within the occupied subspace, the corresponding QFIM block reduces to four times the symmetrized covariance matrix, regardless of probe state purity. For parity-protected collective $\\mathrm{SU}(2)$ spin systems, this renders the transverse QFIM directly certifiable via spin fluctuations, with the optimal axis aligned with the anti-squeezed quadrature. Applied to a dissipative one-axis-twisting system, our framework reveals that highly mixed transient states can exhibit nearly balanced, Heisenberg-scaled QFIM components for transverse--longitudinal parameter pairs $(\\theta_y,\\theta_z)$ over a broad time window. Furthermore, while the steady state retains an isotropic transverse QFIM scaling as $N^2/3$, weak compatibility for transverse parameter pairs $(\\theta_x,\\theta_y)$ exhibits a sharp parity dependence---failing for odd $N$ but restored for even $N$. The resulting symmetry protection eliminates the Uhlmann curvature for transverse--longitudinal pairs, enabling simultaneous saturation of the multi-parameter quantum Cramér-Rao bound in the asymptotic limit.", "url": "https://arxiv.org/abs/2608.01831", "type": "理论", "summary": "1. 该工作建立了多参数量子传感的对称性投影一般框架，将编码生成元相对于对称扇区分解为保子空间与跨子空间分量，从而消去量子Fisher信息矩阵与对称对数导数对易矩阵的跨扇区项。\n2. 其技术要点是投影后的跨子空间生成元在占据子空间内为标量时，QFIM块化为四倍对称协方差矩阵；在宇称保护的SU(2)自旋系统中横向QFIM可由自旋涨落直接验证。\n3. 应用于耗散单轴扭曲系统时，该框架显示高度混合瞬态可具有横向-纵向对的近平衡海森堡标度QFIM分量，且稳态横向兼容性呈奇偶差异，对称保护最终使多参数量子Cramér-Rao界可同时饱和。", "summary_source": "deepseek", "authors": [{"name": "G. R. Jin"}, {"name": "Z. Y. Zhou"}, {"name": "W. Yang"}], "featured_authors": [{"name": "G. R. Jin"}, {"name": "Z. Y. Zhou"}, {"name": "W. Yang"}], "author_count": 3}, {"id": "2608.01909", "category": "quant-ph", "title": "Optimality of Gaussian Entanglement of Formation", "abstract": "We prove that the entanglement of formation of every two-mode Gaussian state coincides with its Gaussian restriction, solving a longstanding open problem in continuous variable quantum information theory. The key result is a sharp affine relation between entanglement and a generalized Einstein-Podolsky-Rosen observable, valid for arbitrary pure two-mode states, including non-Gaussian ones. Our result extends to bisymmetric multimode Gaussian states, and also provides a measurable lower bound on the entanglement of formation of arbitrary non-Gaussian states.", "url": "https://arxiv.org/abs/2608.01909", "type": "理论", "summary": "1. 该文证明任意双模高斯态的纠缠形成熵恰等于其高斯限制下的值，解决了连续变量量子信息中长期开放的问题。\n2. 关键技术在于建立纠缠与广义EPR可观测量间的锐利仿射关系，该关系对包括非高斯态在内的纯双模态普遍成立。\n3. 结果可推广至双对称多模高斯态，并为任意非高斯态的纠缠形成熵提供可实验测量的下界。", "summary_source": "deepseek", "authors": [{"name": "Gerardo Adesso"}], "featured_authors": [{"name": "Gerardo Adesso"}], "author_count": 1}, {"id": "2608.02041", "category": "quant-ph", "title": "Towards Tensor-Network SAT-Solvers for Quantum-Classical Workflows", "abstract": "Integrated HPC/QC systems aim to combine classical high-performance computing with quantum processors, but cannot be reduced to mechanisms for dispatching quantum kernels. An integrated architecture must support aspects such as observability, which cannot be implemented using QPUs alone, as well as fallback execution and cost-aware decisions on whether to replace quantum tasks with classical surrogates. Such mechanisms must be approximate or benefit from problem structure to soften the inescapable exponential classical worst-case complexity. In this work, we study tensor-network ground-state search, as such a surrogate, for optimisation problems. This combines key quantum primitives with advanced classical simulation. It provides initial empirical indicators for surrogate selection criteria, and exposes end-to-end toolchain effects that may be missed when transformation steps are studied in isolation. We compare a native polynomial unconstrained optimisation to-higher-order-Ising and a quadratised quadratic unconstrained binary optimization to-quadratic-Ising formulation for Max-3-SAT. Both are encoded as matrix product operator and optimised using density matrix renormalisation group approaches, with simulated annealing (SA) as classical performance baseline. Our results show that quadratisation is not a neutral transformation step: auxiliary variables and pairwise couplings substantially degrade solution quality relative to the native higher-order representation, while SA matches or outperforms DMRG across all tested instances. Since the optima of Boolean satisfiability (SAT)-derived problems are classical product states, DMRGs advantages dont materialise here. These findings suggest that surrogate selection in HPC/QC runtimes must be encoding- and instance-aware and provide empirical groundwork for informed decisions on fallback strategies and architecture co-design.", "url": "https://arxiv.org/abs/2608.02041", "type": "理论+数值", "summary": "1. 该工作研究张量网络基态搜索作为量子-经典混合工作流中替代量子任务的经典代理，面向Max-3-SAT优化问题。\n2. 其技术要点是系统比较原生高阶Ising与二次化QUBO两种矩阵乘积算子编码下的DMRG求解，发现二次化的辅助变量和成对耦合明显损害解质量，而模拟退火在全部实例上匹配或超越DMRG。\n3. 这表明混合运行时中的代理选择必须编码与实例感知，为回退策略和架构协同设计提供了实证基础。", "summary_source": "deepseek", "authors": [{"name": "Benjamin Zec"}, {"name": "Lukas Schmidbauer"}, {"name": "Maja Franz"}, {"name": "Wolfgang Mauerer"}], "featured_authors": [{"name": "Benjamin Zec"}, {"name": "Lukas Schmidbauer"}, {"name": "Maja Franz"}, {"name": "Wolfgang Mauerer"}], "author_count": 4}, {"id": "2608.02054", "category": "quant-ph", "title": "Scaled Caldeira-Leggett Dynamics: Deterministic Trajectories and the Classical Limit", "abstract": "The dynamics of an open quantum system in the high-temperature regime of the Caldeira-Leggett model using a Bohmian language is investigated. By expressing the density matrix in polar form, generalized continuity and Hamilton-Jacobi equations are obtained. Thermal effects appear explicitly in the former, while they influence the latter only indirectly through an effective potential. Remarkably, the effective potential does not vanish in the classical limit and cannot, in general, be decomposed into simple additive quantum and thermal contributions. Instead, it retains a nontrivial structure leading to a residual temperature dependence in the resulting dynamics. As a consequence, the resulting temperature-dependent-classical trajectories remain deterministic even in the presence of a thermal environment. This behavior contrasts with the stochastic dynamics observed in the Langevin description and reflects the ensemble-based nature of the present approach. To further explore the quantum-to-classical transition, a scaled version of the Caldeira-Leggett equation is introduced by scaling both the density matrix and Planck constant through a quantumness parameter. This parameter takes the value one in the fully quantum regime and smoothly approaches zero in the classical limit. Applications to Gaussian states demonstrate a gradual suppression of coherence and interference, governed jointly by thermal effects and the transition parameter.", "url": "https://arxiv.org/abs/2608.02054", "type": "理论", "summary": "1. 该工作
