summary_source": "deepseek", "authors": [{"name": "D. Chevizovich"}, {"name": "V. Matic"}, {"name": "Z. Przulj"}, {"name": "S. Galovic"}], "featured_authors": [{"name": "D. Chevizovich"}, {"name": "V. Matic"}, {"name": "Z. Przulj"}, {"name": "S. Galovic"}], "author_count": 4}, {"id": "2608.02155", "category": "cond-mat", "title": "Band topology and symmetry-driven magneto-optical response in two-dimensional d-wave altermagnets with staggered spin-orbit coupling", "abstract": "Altermagnets combine compensated collinear magnetic order with momentum-dependent spin splitting, providing a route to transverse electronic and optical responses without a net ferromagnetic moment. We develop a strictly periodic four-band tight-binding model for a two-dimensional d-wave altermagnet and distinguish the roles of three spin orbit coupling (SOC) channels: uniform Rashba SOC, a sublattice-staggered Rashba interaction, and bond-staggered SOC. In the absence of SOC, the d-wave kinetic anisotropy produces spin-polarized Dirac points on orthogonal Brillouin-zone boundaries, related by the altermagnetic fourfold spin-group symmetry. Uniform Rashba SOC mixes the spin sectors and shifts these nodes but preserves the antiunitary symmetry that forbids an integrated Hall response. The sublattice-staggered Rashba term breaks this symmetry and activates transverse optical response, whereas the bond-staggered SOC provides the mass that gaps the boundary nodes. Their combined action generates strong Berry-curvature hot spots and, within a narrow parameter window, an isolated lower two-band manifold with Chern number C=-2. For the representative parameters considered here it is possible to stabilize a Chern insulator phase. Using covariant-velocity Kubo calculations, we show that large optical Hall conductivity and circular dichroism extend well beyond the nonzero-Chern region and are controlled by SOC-induced avoided crossings and symmetry breaking. We further find that carrier doping strongly modifies the resonant and dc Hall responses through Pauli blocking and the occupation of Berry-curvature hot spots, enabling gate-controlled sign reversals. These results identify the complementary roles of distinct interfacial SOC mechanisms in producing topology and tunable magneto-optical activity in compensated two-dimensional magnets.", "url": "https://arxiv.org/abs/2608.02155", "type": "理论+数值", "summary": "1. 该工作建立了二维 d 波交变磁体的严格周期四带紧束缚模型，系统区分三种自旋轨道耦合通道对其能带拓扑与磁光响应的影响。\n2. 其核心在于揭示均匀 Rashba、子格交错 Rashba 与键交错 SOC 分别实现自旋混合、对称性破缺和边界节点质量项，协同产生陈数 C=-2 的拓扑相，并驱动显著 Berry 曲率热点。\n3. 载流子掺杂可经泡利阻塞与热点占据改变共振及直流霍尔响应乃至符号反转，为无净磁矩二维磁体中的栅控磁光器件提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Meysam Bagheri Tagani Carmine Autieri"}, {"name": "Wojciech Brzezicki"}], "featured_authors": [{"name": "Meysam Bagheri Tagani Carmine Autieri"}, {"name": "Wojciech Brzezicki"}], "author_count": 2}, {"id": "2608.02156", "category": "cond-mat", "title": "Inhomogeneous Ising Model on 2D kagomé Lattice: Fermionic field approach", "abstract": "We investigate the two-dimensional inhomogeneous Ising model (2DIM) on the kagom'e lattice by mapping it onto a particular non-symmetric eight-vertex model and constructing the corresponding $R$-matrix. Using a fermionic representation, we evaluate the partition function and derive explicit expressions for the main thermodynamic quantities. In the thermodynamic limit, we obtain an exact equation for the critical surface determining the phase transition of the model. We also calculate the free energy, specific heat, and spontaneous magnetization in the ferromagnetic case. Furthermore, we show that when one or two coupling constants vanish, the model reduces, respectively, to the square-lattice and one-dimensional Ising models. In both limits, our results reproduce the corresponding exact critical couplings and free energies.", "url": "https://arxiv.org/abs/2608.02156", "type": "理论+数值", "summary": "1. 该工作采用费米子场方法处理二维kagomé晶格上的非均匀伊辛模型，通过映射到非对称八顶点模型并构造相应R矩阵，建立了完整求解框架。\n2. 技术亮点在于用费米子表示严格计算配分函数，在热力学极限下得到决定相变的精确临界曲面方程，并给出铁磁情形下自由能、比热和自发磁化的显式表达式。\n3. 当单个或两个耦合常数消失时，模型分别退化为正方晶格与一维伊辛模型，所得临界耦合及自由能与已知精确结果一致，为相关可积统计模型提供了统一理解。", "summary_source": "deepseek", "authors": [{"name": "Shahane A. Khachatryan"}, {"name": "Zhidong Zhang"}, {"name": "Ara G. Sedrakyan"}], "featured_authors": [{"name": "Shahane A. Khachatryan"}, {"name": "Zhidong Zhang"}, {"name": "Ara G. Sedrakyan"}], "author_count": 3}, {"id": "2608.02211", "category": "cond-mat", "title": "Front Selection Is Not Determined by Renormalization-Group Stability", "abstract": "The Fisher--Kolmogorov--Petrovsky--Piskunov equation provides a paradigmatic example of front propagation and asymptotic-state selection. Using a unified renormalization-group (RG) framework, we show that its traveling-wave solutions form a continuous family of RG fixed points and that all fronts with $v \\ge 2$ are RG-stable. Nevertheless, the asymptotically selected front is not determined by RG stability. The FKPP equation therefore provides an explicit example in which RG fixed-point stability and asymptotic-state selection are distinct concepts.", "url": "https://arxiv.org/abs/2608.02211", "type": "理论", "summary": "1. 该工作以FKPP方程为例，在统一重整化群框架中证明行波解构成连续RG不动点族，且所有v≥2的前沿均RG稳定，但渐近选择的前沿并非由RG稳定性决定。\n2. 其核心技术贡献是将渐近态选择与不动点稳定性在可解模型中严格解耦，表明连续不动点流形上的稳定性分析不足以唯一预测实际传播速度。\n3. 这一结论提醒人们不可将重整化群不动点的稳定性直接等同于物理渐近选择，也激励在更广泛的非平衡传播系统中重新考察初值条件与全局动力学约束的作用。", "summary_source": "deepseek", "authors": [{"name": "Ko Okumura"}], "featured_authors": [{"name": "Ko Okumura"}], "author_count": 1}, {"id": "2608.02241", "category": "cond-mat", "title": "Proximity effects of chiral magnetization on transition metal dichalcogenides monolayers", "abstract": "We consider the proximity effects of a commensurate chiral $120^{\\circ}$ Néel magnetic structure on the transport and optical properties of a transition metal dichalcogenide monolayer (TMD ML). The enlarged magnetic unit cell leads to the folding of the Brillouin zone and enables efficient intervalley spin-flip scattering. Starting from a six band tight binding model, we develop an effective $k\\cdot p$ model, which describes the coupling between charge carriers in the TMD ML and the chiral magnetization. We predict the anomalous antiferromagnetic Hall effect (AHE) for conduction electrons and describe it accounting for the interplay between anomalous velocity, side jump, and skew scattering contributions. The proximity of the chiral magnetization also leads to the mixing and splitting of the exciton resonances in the two valleys which are related by the time reversal symmetry despite zero net magnetization. Finally, we demonstrate the possibility to measure the distribution of in-plane orientation of the chiral magnetization through Faraday rotation and the ellipticity of incident linearly polarized light.", "url": "https://arxiv.org/abs/2608.02241", "type": "理论", "summary": "1. 该工作从六带紧束缚模型出发，系统研究了公度手性120°奈尔磁结构邻近效应对过渡金属二硫族化物单层输运和光学性质的影响。\n2. 其主要技术卖点是建立有效k·p模型，揭示磁元胞导致的布里渊区折叠与谷间自旋翻转散射，并预言由反常速度、侧跳和斜散射共同决定的反常反铁磁霍尔效应。\n3. 最稳妥的启示是：尽管体系净磁化为零，谷激子共振的混合劈裂以及线性偏振光的法拉第旋转与椭偏率仍可直接探测手性磁结构的面内取向分布。", "summary_source": "deepseek", "authors": [{"name": "Vladimir N. Mantsevich"}, {"name": "Igor S. Krivenko"}, {"name": "Dmitry S. Smirnov"}], "featured_authors": [{"name": "Vladimir N. Mantsevich"}, {"name": "Igor S. Krivenko"}, {"name": "Dmitry S. Smirnov"}], "author_count": 3}, {"id": "2608.02260", "category": "cond-mat", "title": "Valley-controlled chiral magnetism in transition metal dichalcogenide monolayers", "abstract": "We put forward the Ruderman-Kittel-Kasuya-Yosida (RKKY) interaction in transition metal dichalcogenide monolayers as a tool to create and control a chiral magnetic texture. We show that in the spin-valley locking regime, the RKKY interaction acts as a Dzyaloshinskii-Moriya coupling with an effective spin rotation period exactly equal to the tripled lattice constant. Using mean field theory and classical Monte Carlo simulations, we demonstrate that this interaction qualitatively reshapes the phase diagram of atomically thin antiferromagnets. It destroys the chirality-related phase transition by selecting a single chirality value even when the RKKY interaction is small. At the same time, it shifts the Berezinskii-Kosterlitz-Thouless transition associated with spins orientation to higher temperatures. We argue that the valley degree of freedom of electrons mediating the RKKY interaction provides a powerful control knob for exploring non-universal phase transitions and quantum spin liquid states in two-dimensional van der Waals heterostructures.", "url": "https://arxiv.org/abs/2608.02260", "type": "理论+数值", "summary": "1. 该工作提出利用过渡金属硫族化物单层中的RKKY相互作用产生并调控手性磁织构。\n2. 其核心在于RKKY等效为DM耦合，自旋旋转周期恰为三倍晶格常数，平均场与蒙特卡洛表明其重塑反铁磁相图。\n3. 谷自由度可作为控制旋钮，为二维范德华异质结中非普适相变及量子自旋液体态研究提供启发。", "summary_source": "deepseek", "authors": [{"name": "Igor S. Krivenko"}, {"name": "Vladimir N. Mantsevich"}, {"name": "Dmitry S. Smirnov"}], "featured_authors": [{"name": "Igor S. Krivenko"}, {"name": "Vladimir N. Mantsevich"}, {"name": "Dmitry S. Smirnov"}], "author_count": 3}, {"id": "2608.02261", "category": "cond-mat", "title": "Pressure-Driven Evolution of Electronic and Magnetic Correlations in Bilayer Nickelate La3Ni2O7", "abstract": "The recent discovery of high-temperature superconductivity in pressurized bilayer La3Ni2O7 has sparked intense research interest, yet the microscopic mechanism governing its pressure-dependent superconducting transition temperature (Tc) remains elusive. In this work, we investigate the electronic and magnetic correlations of La3Ni2O7 under high pressure using a combination of density-functional theory (DFT), constrained random phase approximation (cRPA), and dynamical mean-field theory (DMFT). We find that while hydrostatic pressure enhances the interlayer hopping and the bare superexchange energy scale (4t2/U), it simultaneously drives the system toward a more itinerant regime by reducing the relative correlation strength (U/W). Crucially, our results reveal a distinct orbital-selective evolution: the Ni dx2-y2 states become increasingly itinerant, whereas the Ni dz2 orbitals retain a more localized character. This pressure-induced itinerancy significantly enhances the hybridization between the two, leading to a dramatic amplification of the Kondo-like screening of the local dz2 moments by the itinerant dx2-y2 electrons. Consequently, the effective magnetic exchange coupling (Jeff), which serves as the pairing glue, is suppressed in the high-pressure regime. Our findings suggest that the monotonic decrease of Tc at high pressures is driven by the dominance of Kondo screening over superexchange interactions, providing a coherent microscopic explanation for the dome-shaped superconducting phase diagram in La3Ni2O7.", "url": "https://arxiv.org/abs/2608.02261", "type": "理论+数值", "summary": "1. 该工作联合DFT、cRPA与DMFT计算，系统研究了高压下层状镍氧化物La3Ni2O7的电子与磁关联演化。\n2. 其核心发现是压力同时增强层间超交换但削弱U/W，使Ni dx2-y2巡游化而dz2保持局域，从而放大Kondo屏蔽并压制有效磁交换Jeff。\n3. 这一机制为高压区Tc单调下降及穹顶形超导相图提供了微观解释，对理解双层镍酸盐压力调控超导有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Jian Zhou"}, {"name": "Rui Song"}, {"name": "Haiyan Lu"}], "featured_authors": [{"name": "Jian Zhou"}, {"name": "Rui Song"}, {"name": "Haiyan Lu"}], "author_count": 3}, {"id": "2608.02297", "category": "cond-mat", "title": "Quantum resetting with memory", "abstract": "We introduce a quantum stochastic resetting protocol with uniform memory, in which each resetting event returns the system to a state visited at a time chosen uniformly from its entire history. The resulting dynamics is nonunitary, non-Markovian and a direct quantum generalization of the classical preferential relocation model. Working in the energy eigenbasis, we derive the exact evolution of every density-matrix element for an arbitrary time-independent Hamiltonian and show that the Hamiltonian enters the dynamics only through the corresponding Bohr frequencies. This leads to a natural distinction between two classes of quantum systems: gapped and gapless. In \\emph{gapped systems} (systems with a discrete energy spectrum), while the diagonal elements remain unchanged, the off-diagonal elements of the density matrix in the energy eigenbasis decay algebraically with a continuously varying exponent and with an amplitude that oscillates periodically in $\\log t$. The system therefore approaches a stationary state that is independent of the resetting rate and retains a strong memory of the initial state. In \\emph{gapless systems} (systems with a continuous energy spectrum), arbitrarily small Bohr frequencies prevent stationarity. Instead, the position distribution spreads on the universal (ultra-slow) scale $\\log(rt)/r$, independently of the initial state and of the details of the Hamiltonian. We illustrate these results with a two-level system, a harmonic oscillator, and a free quantum particle, and contrast them with their classical counterparts.", "url": "https://arxiv.org/abs/2608.02297", "type": "理论", "summary": "1. 该工作提出带均匀记忆的量子随机重置协议：每次重置将系统送回其历史中均匀随机选取的某个状态，得到经典偏好迁移模型的非幺正、非马尔可夫量子推广。\n2. 它在能量本征基下精确求解任意不显含时哈密顿量的全部密度矩阵元，证明哈密顿量只通过玻尔频率起作用，并由此区分有隙与无隙系统。\n3. 有隙系统的非对角元以连续可变的幂指数代数衰减并在log t上周期振荡，稳态与重置率无关且保留初态记忆；无隙系统则呈现普适超慢标度log(rt)/r。", "summary_source": "deepseek", "authors": [{"name": "Gabriele de Mauro"}, {"name": "Manas Kulkarni"}, {"name": "Satya N. Majumdar"}], "featured_authors": [{"name": "Gabriele de Mauro"}, {"name": "Manas Kulkarni"}, {"name": "Satya N. Majumdar"}], "author_count": 3}, {"id": "2608.02298", "category": "cond-mat", "title": "Long and short time linear response of metals: a geometric approach", "abstract": "The time-dependent quantum geometric tensor, which captures dipole fluctuations of bound electrons, is essential for understanding the electronic properties of insulators, superconductors, and flat bands. It is often considered subleading for low-energy descriptions of metals that are dominated by intra-band processes. Here, we revisit this perspective and highlight scenarios where the quantum geometry of the wavefunctions close to the Fermi surface plays a significant role. We compute the time-dependent quantum geometric tensor for metals, explain its divergence, and contrast it against singular geometric tensors of Dirac and Weyl semi-metals. We identify the ratio of Drude to total spectral weight, $D/\\mathcal{S}_1$, as a lattice-scale probe of bound versus itinerant charge, and quantify it in the kagome metal, where the two van Hove fillings respond differently despite identical Fermi surfaces.", "url": "https://arxiv.org/abs/2608.02298", "type": "理论+数值", "summary": "1. 该工作用几何方法统一处理金属在长时与短时尺度下的线性响应，计算了金属的含时量子几何张量并解释其发散起源。\n2. 核心卖点在于指出费米面附近波函数量子几何在金属中可不再只是次领头，并与Dirac/Weyl半金属的奇异几何张量形成对比；德鲁德权重与总谱权重之比D/S_1可作为束缚与巡游电荷的晶格尺度探针。\n3. 在kagome金属中，两种范霍夫填充在费米面相同的情况下给出不同的D/S_1，为区分几何与能带填充效应以及后续光谱测量提供了清晰靶标。", "summary_source": "deepseek", "authors": [{"name": "Nishchhal Verma"}, {"name": "Raquel Queiroz"}], "featured_authors": [{"name": "Nishchhal Verma"}, {"name": "Raquel Queiroz"}], "author_count": 2}, {"id": "2608.02301", "category": "cond-mat", "title": "Equilibrium gigahertz acoustics reveals long-range confinement in liquids", "abstract": "Understanding how the mechanical properties of liquids confined within nanometer-scale gaps differ from bulk behavior is central to biophysics, lubrication, catalysis, electrochemistry, and surface science. Yet the characterization of ultrathin confined liquids remains challenging, as many existing approaches rely on destructive or intrusive contact-based techniques, mostly measuring the liquid flow in the low frequency regime. Here, we present a non-invasive, all-optical technique based on ultrafast laser ultrasonics that probes confined liquids at equilibrium in the gigahertz frequency range. The method measures the phase and amplitude of time-domain Brillouin scattering signals transmitted through liquid layers whose thickness is varied step by step with subnanometer effective sampling. Supported by numerical modeling of acoustic propagation and optical detection, these signals allow us to extract the thickness-dependent acoustic velocity and attenuation of confined liquids. We show that nanometric confinement modifies the GHz acoustic response of glycerol, the liquid crystal 8CB, and a butyl-based ionic liquid over unexpectedly long spatial scales. These effects extend from a few nanometers to several tens of nanometers and reveal bound interfacial layers, acoustic stiffening, and enhanced solid-like behavior under confinement. Our results open a route to probing liquid confinement in a scarcely explored regime: dynamically measured at gigahertz frequencies, yet sufficiently weakly perturbative to preserve the equilibrium confined state.", "url": "https://arxiv.org/abs/2608.02301", "type": "理论+数值", "summary": "1. 该工作发展了一种基于超快激光超声的全光学非侵入方法，在吉赫兹频段平衡探测纳米受限液体，并逐层提取受限液体的声速与衰减。\n2. 其技术卖点在于利用时域布里渊散射的相位与振幅结合亚纳米有效步进采样，由此观察到甘油、液晶8CB及离子液体在数至数十纳米尺度上的声学硬化与类固体行为。\n3. 这为在弱扰动、平衡条件下动态研究液体限域效应开拓了新途径，对界面流体物理与相关应用具有参考价值。", "summary_source": "deepseek", "authors": [{"name": "Ievgeniia Chaban"}, {"name": "Thomas Pezeril"}], "featured_authors": [{"name": "Ievgeniia Chaban"}, {"name": "Thomas Pezeril"}], "author_count": 2}, {"id": "2608.02313", "category": "cond-mat", "title": "Colloidal Systems", "abstract": "This book has one primary goal: To get you moving quickly from learning basic principles of colloid science, to designing colloidal systems for function or motion in the lab. It is not intended to provide encyclopedic knowledge about all aspects of colloid and surface science; rather, I have chosen not to include many topics of genuine importance. In reaching the intended goal, I use two parallel strategies. First, I give practical results that can be used immediately. If there is a cumbersome calculation, I have worked to reframe it into a table or figure. This is the case for Hamaker constants and hydrodynamics of spheroids, for instance. Second, I describe the physics of various colloidal phenomena, so that you as a researcher can think about alternative strategies. In balancing algorithms with explanations, I provide plug-and-chug example problems to familiarize you with units, constants, and typical values. The practice problems provide extensions to the most basic theory that open new possibilities, while also giving results that are useful in practical and research studies. Throughout the book, I provide data we commonly use for viscosities, zeta potentials, ionic phenomena, and other parameters. Rather than providing every reference and every technique, I have provided those references and techniques that we most often use in our lab. In the end, this book aims not to be an exhaustive study of colloids, but rather to be a doorway to producing desired colloidal systems as quickly as possible.", "url": "https://arxiv.org/abs/2608.02313", "type": "理论+数值", "summary": "1. 该工作以专著形式整合胶体科学基础原理与面向实验的胶体体系设计方法，目标是从基础快速过渡到功能或运动体系的构建。\n2. 其主要特色是将Hamaker常数、椭球流体力学等繁杂计算重构为表格与绘图，并提供含典型数值和单位的算例及常用实验参数，兼顾物理机制与直接可用的定量工具。\n3. 这为胶体研究者提供了一条从理论认知到实验设计的快捷入口，也对实验驱动型综述或教材的编写方式具有借鉴意义。", "summary_source": "deepseek", "authors": [{"name": "Darrell Velegol"}], "featured_authors": [{"name": "Darrell Velegol"}], "author_count": 1}, {"id": "2608.02342", "category": "cond-mat", "title": "Pressure-induced concurrent amorphization and superconductivity in topological material NbNiTe5", "abstract": "We have systematically studied the structural and electronic properties of a topological material NbNiTe5 under high pressure. The evolution of the normal state resistance shows a non-monotonic trend from 0.7 GPa to 5.1 GPa, in accordance with the second-order transition along the inter-layer direction observed in X-ray diffraction and Raman spectra. At around 10 GPa, the sample starts amorphization, which is concurrent with the emergence of superconductivity. Upon further compression, the structural disorder enhances and the superconducting transition becomes clearer, suggesting that the superconductivity is modulated by the degree of disorder in NbNiTe5 under high pressure. Within 45.7 GPa, the superconducting transition temperature (Tc) slowly rises from 0.6 K at 9.5 GPa to 1.4 K at 45.7 GPa. Our findings extend the family of transition metal chalcogenide superconductors and shed new light on understanding superconductivity in disordered systems.", "url": "https://arxiv.org/abs/2608.02342", "type": "理论", "summary": "1. 该工作对拓扑材料NbNiTe5开展高压下的结构与电子性质系统研究，追踪了从正常态电阻异常到非晶化与超导出现的全过程。\n2. 其核心发现在于约10 GPa时非晶化与超导同时出现，且随压力增大结构无序增强、超导转变更清晰，显示超导受无序度调控。\n3. 这扩展了过渡金属硫族化物超导家族，并为理解无序体系中的超导机制提供了新的实验线索。", "summary_source": "deepseek", "authors": [{"name": "Lingxiao Zhao"}, {"name": "Yi Zhao"}, {"name": "Bangshuai Zhu"}, {"name": "Qi Wang"}, {"name": "Cuiying Pei"}, {"name": "Juefei Wu"}, {"name": "Jin-Ke Bao"}, {"name": "Wen-He Jiao"}, {"name": "Yanpeng Qi"}], "featured_authors": [{"name": "Lingxiao Zhao"}, {"name": "Yi Zhao"}, {"name": "Bangshuai Zhu"}, {"name": "Jin-Ke Bao"}, {"name": "Wen-He Jiao"}, {"name": "Yanpeng Qi"}], "author_count": 9}, {"id": "2608.02362", "category": "cond-mat", "title": "Superconducting ternary compounds Li-X-B (X=Mo, W) within the mild pressure range: First-principles predictions", "abstract": "Among the superconducting hydrides under high pressure, a number of studies concentrate on the ternary compounds to explore unique superconductors, which are capable of reducing the stable pressure and maintain superconductivity. In this work, to verify our proposed strategy of ternary composition lines (TCLs) to explore ternary compounds, we combined the first-principles calculations and crystal structure predictions to study the ternary compounds Li-X-B (X=Mo, W) under high pressure. After calculations along five and four TCLs in Li-W-B and Li-Mo-B, respectively, five Li-W-B compounds and four Li-Mo-B compounds were predicted. The compositions of LiWB4, Li4MoB2 and LiMo2B2 could be thermodynamically stable under high pressure, and Li2WB6 is around 0.02 eV/atom above the convex hull at 0 GPa, which has potential for synthesizing. Both of the predicted Li2WB6 P6/mmm and Li2WB4 R-3m are superconducting and their Tc are around 11 K, which are similar to the Tc of WB2 P6/mmm around 100 GPa. An anomalous increase of Tc was found in Li4MoB2 C2/m upon compression. We carried out full ternary search (FTS) to evaluate the validity of the TCLs strategy in Li-W-B system at 0 GPa. Our results are helpful for understanding the phase diagram of Li-X-B (X=Mo, W) under high pressure and the introducing of Li atoms provide candidate structures to reduce the measured stable pressure from ~100 GPa in WB2 P6/mmm to 0 GPa. Meanwhile, we preliminary validate the strategy of TCLs in structure predictions and we expect to improve this strategy in the future, shedding light on the studies of ternary compounds.", "url": "https://arxiv.org/abs/2608.02362", "type": "数值", "summary": "1. 该工作结合第一性原理计算与晶体结构预测，沿三元组分线系统研究了高压下Li-X-B（X=Mo,W）体系，并预测出多个热力学稳定或近稳定的三元化合物。\n2. 其核心结果是Li2WB6与Li2WB4呈现约11 K的超导转变温度，且Li原子引入可将WB2所需约100 GPa的稳定压力降至0 GPa，同时发现Li4MoB2在压缩下Tc反常升高。\n3. 这初步验证了三元组分线策略的有效性，为在温和压力下探索三元超导材料及丰富相关高压相图提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Bangshuai Zhu"}, {"name": "Juefei Wu"}, {"name": "Dexi Shao"}, {"name": "Junjie Wang"}, {"name": "Yu Han"}, {"name": "Cuiying Pei"}, {"name": "Qi Wang"}, {"name": "Jian Sun"}, {"name": "Yanpeng Qi"}], "featured_authors": [{"name": "Bangshuai Zhu"}, {"name": "Juefei Wu"}, {"name": "Dexi Shao"}, {"name": "Qi Wang"}, {"name": "Jian Sun"}, {"name": "Yanpeng Qi"}], "author_count": 9}, {"id": "2608.02373", "category": "cond-mat", "title": "Bayesian Inference with Structured Signal: Static Replica Symmetry Breaking on the Nishimori Line in the Planted Spin Glass", "abstract": "A common assumption in theoretical models of Bayesian inference is that the signal has i.i.d. components. To study the effect of correlations in the signal prior, we consider a minimal model: the planted spin glass on random regular graphs, where the signal is sampled from an Ising model with coupling $\\kappa$. Depending on the phase of the prior, we find that adding structure in the signal can either help or hinder inference. In the paramagnetic regime, correlations in the signal lower the reconstruction threshold, so that weaker signal strength is sufficient for recovery. In the ferromagnetic regime, the prior alone already enables partial recovery, and we identify the threshold above which the observations provide additional information. When the prior itself is in a replica symmetry breaking (RSB) phase, we detect a static RSB transition in the posterior under Nishimori conditions. This provides an example where a non-separable, correlated prior leads to static RSB in a Bayes-optimal inference problem. We discuss the consequences of this glassy phase for algorithmic performance, in particular for Belief Propagation.", "url": "https://arxiv.org/abs/2608.02373", "type": "理论+数值", "summary": "1. 该工作研究信号先验具有空间相关性时的贝叶斯推断问题，以随机正则图上的植入自旋玻璃为最小模型，其中真实信号由带耦合强度κ的Ising先验采样产生。\n2. 主要技术卖点在于系统刻画相关先验对重建阈值的影响：顺磁先验降低重建阈值，铁磁先验可独立实现部分恢复，且当先验处于复制对称破缺相时，后分布在Nishimori线上呈现静态复制对称破缺。\n3. 这一非可分离相关先验导致静态玻璃相的实例，为信念传播算法在贝叶斯最优推断中性能下降提供了物理解释，并推动对更一般相关先验下算法极限的研究。", "summary_source": "deepseek", "authors": [{"name": "Andrea Vincenzo Dell'Abate"}, {"name": "Louise Budzynski"}], "featured_authors": [{"name": "Andrea Vincenzo Dell'Abate"}, {"name": "Louise Budzynski"}], "author_count": 2}, {"id": "2608.02384", "category": "cond-mat", "title": "Second-harmonic generation in twisted double bilayer graphene: Double-resonant enhancement from moiré flat bands", "abstract": "We theoretically investigate second-harmonic generation (SHG) in twisted double bilayer graphene (TDBG) with AB--AB and AB--BA stacking configurations using a perturbative approach based on an effective continuum Hamiltonian. We present a systematic analysis of the SHG response as a function of twist angle, vertical bias voltage, Fermi energy, and stacking configuration. We find that the SHG signal is strongly enhanced at small twist angles due to the emergence of moiré flat bands and the associated increase in the joint density of states. Beyond this conventional enhancement mechanism, we demonstrate that the reduced bandwidth enables a pronounced double-resonant process, in which optical transitions at both $\\omega$ and $2\\omega$ are simultaneously satisfied over extended regions of the moiré Brillouin zone. This mechanism leads to a substantial amplification of the SHG response, analogous to the enhancement observed in systems with discrete energy levels, but realised here in a tuneable moiré band structure. Furthermore, we show that the AB--AB and AB--BA configurations exhibit a systematic $\\pi$ phase shift in the SHG response at large bias voltages, reflecting their distinct symmetry and electronic structure. Our results identify double-resonance effects as a generic mechanism for enhancing SHG in moiré systems and provide a unified framework for understanding and controlling nonlinear optical responses in tuneable flat-band materials.", "url": "https://arxiv.org/abs/2608.02384", "type": "理论", "summary": "1. 该工作基于连续哈密顿量的微扰理论，系统计算了双层转角双石墨烯在AB-AB与AB-BA堆叠下的二次谐波产生响应。\n2. 其核心卖点在于揭示窄带宽莫尔平带可使ω与2ω光学跃迁同时满足，形成扩展布里渊区内的双共振放大机制。\n3. 这为在可调平带材料中统一理解和调控非线性光学响应提供了通用框架与明确理论指引。", "summary_source": "deepseek", "authors": [{"name": "Takaaki V. Joya"}, {"name": "Takuto Kawakami"}, {"name": "Mikito Koshino"}], "featured_authors": [{"name": "Takaaki V. Joya"}, {"name": "Takuto Kawakami"}, {"name": "Mikito Koshino"}], "author_count": 3}, {"id": "2608.02393", "category": "cond-mat", "title": "Floquet spin-group framework and its application to light-tailored spin splitting in collinear magnets", "abstract": "Altermagnets combine momentum-dependent spin splitting with vanishing net magnetization, opening new opportunities for spintronics. Recent studies have shown that periodic driving by linearly or circularly polarized light, as well as by multicolor light fields, can control spin splitting in altermagnets and conventional antiferromagnets, and can even generate spin splitting patterns absent in equilibrium. Despite this progress, a unified principle connecting the dynamical symmetry of light to the symmetry of spin-split bands remains lacking, limiting the systematic design of light-induced spin structures. Here, by combining the spin group of crystals with the dynamical group of light, we establish a unified Floquet spin group framework for the study of periodically driven collinear magnets with negligible spin-orbit coupling. This framework systematically determines the allowed parity, momentum dependence, and nodal structure of spin splitting under different driving protocols. Guided by this symmetry classification, we show that odd-parity, even-parity, and mixed-parity spin splittings can be switched within the same material by tailoring the driving field. We further uncover higher-order $h$-wave and $k$-wave spin splittings in three-dimensional systems. Our work establishes a unified symmetry framework for light-controlled spin splitting and provides general principles for engineering nonequilibrium spin-band structures in altermagnets and related magnetic materials.", "url": "https://arxiv.org/abs/2608.02393", "type": "理论", "summary": "1. 该工作将晶体自旋群与光的动力学群相结合，建立了统一的Floquet自旋群框架，用于研究自旋轨道耦合可忽略的周期性驱动共线磁体中的光致自旋劈裂。\n2. 该框架系统决定了不同驱动方案下自旋劈裂的允许宇称、动量依赖和节点结构，并证明在同一材料中通过整形光场可切换奇宇称、偶宇称与混合宇称劈裂，还预言三维系统中的高阶h波与k波劈裂。\n3. 这为交错磁体及相关磁性材料中非平衡自旋能带结构的设计提供了普遍对称性原理，可指导光控自旋劈裂与自旋电子学器件的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Tongshuai Zhu"}, {"name": "Zixuan Li"}, {"name": "Huaiqiang Wang"}, {"name": "Su-Huai Wei"}, {"name": "Jiawei Ruan"}], "featured_authors": [{"name": "Tongshuai Zhu"}, {"name": "Zixuan Li"}, {"name": "Huaiqiang Wang"}, {"name": "Su-Huai Wei"}, {"name": "Jiawei Ruan"}], "author_count": 5}, {"id": "2608.02426", "category": "cond-mat", "title": "Screening phonon-mediated superconductors from static orbital Hamiltonians", "abstract": "The first-principles search for superconductors is severely limited by the high cost of electron-phonon coupling (EPC) calculations. Here we develop a low-cost, physically transparent framework that identifies strong-EPC materials directly from static orbital-based Hamiltonians without explicit phonon perturbation calculations. Verification using density functional perturbation theory (DFPT) for representative superconductors shows that the framework captures semi-quantitatively the EPC scale at substantially lower computational cost. Applied to more than 36,000 compounds in the MattKeyBond database, it identifies 34 dynamically stable superconducting candidates with calculated $T_c > 10$ K after DFPT verification. These candidates reveal two distinct routes to relatively high-$T_c$ superconductivity: a metallized covalent $\\sigma$-bond route that is more favorable for achieving high-$T_c$ superconductors, and a Fermi-level density-of-states accumulation route that can enhance $T_c$ but usually to a more limited extent.", "url": "https://arxiv.org/abs/2608.02426", "type": "理论+数值", "summary": "1. 该工作发展了一个仅基于静态轨道哈密顿量、无需显式声子微扰计算即可筛选强电声耦合超导材料的低成本、物理透明框架，并用DFPT对代表性超导体进行了验证。\n2. 其技术卖点在于以远低于DFPT的计算开销半定量捕捉电声耦合强度，并在MattKeyBond数据库逾36000种化合物中筛出34个经DFPT验证后Tc>10K的动态稳定超导候选物。\n3. 这些候选物揭示了通向较高Tc的两类路径：金属化共价σ键路线更有利于实现高温超导，而费米面态密度积累路线的增超导作用通常有限，为高通量超导搜索提供了物性导向。", "summary_source": "deepseek", "authors": [{"name": "Jian-Feng Zhang"}, {"name": "Ze-Feng Gao"}, {"name": "Xiao-Qi Han"}, {"name": "Dingshun Lv"}, {"name": "Miao Gao"}, {"name": "Kai Liu"}, {"name": "Xinguo Ren"}, {"name": "Zhong-Yi Lu"}, {"name": "Tao Xiang"}], "featured_authors": [{"name": "Jian-Feng Zhang"}, {"name": "Ze-Feng Gao"}, {"name": "Xiao-Qi Han"}, {"name": "Xinguo Ren"}, {"name": "Zhong-Yi Lu"}, {"name": "Tao Xiang"}], "author_count": 9}, {"id": "2608.02456", "category": "cond-mat", "title": "Real-time dynamics of the two-step charge-density-wave transition in bulk 1T-TaS$_2$", "abstract": "The charge-density wave (CDW) of bulk 1T-TaS2 is built from Star-of-David (SoD) clusters tiling a sqrt{13} x sqrt{13} superlattice, and it melts through a two-step sequence accompanied by order-of-magnitude changes in resistivity. Whether these steps proceed by collapse of the SoD amplitude or by rearrangement of the SoD lattice has remained unresolved, because the relevant dynamics occur on length and time scales beyond the reach of ab initio molecular dynamics. Here we follow the CDW transitions in real time using a machine-learning force field trained on first-principles data, giving access to 1404-atom supercells over 5 ns. The two steps are mechanistically distinct. Above 200 K, SoD clusters translate coherently by transiently dissolving and re-forming about shifted centers, a deformation-formation process that preserves the local SoD amplitude while randomizing the interlayer stacking order and nucleating domain walls. Only near 350 K does the SoD distortion itself collapse. These results provide microscopic support for the recently proposed two-step model of the CDW transition and offer a framework for interpreting light-induced hidden phases and cavity-modified transition temperatures in 1T-TaS2.", "url": "https://arxiv.org/abs/2608.02456", "type": "理论+数值", "summary": "1. 该工作采用基于第一性原理数据训练的机器学习力场，对块体1T-TaS2的两步电荷密度波转变进行实时模拟，实现1404原子超胞、5纳秒时间尺度。\n2. 关键物理在于两步机制截然不同：200 K以上大卫之星团簇通过瞬态溶解并在偏移中心重构的方式相干平移，保持局域幅度但随机化层间堆叠并成核畴壁；约350 K时团簇畸变本身才坍缩。\n3. 该结果从微观上支持两步转变模型，为解释光致隐藏相及腔修饰转变温度提供了可迁移的计算框架。", "summary_source": "deepseek", "authors": [{"name": "Daeheon Kim"}, {"name": "Jinseok Oh"}, {"name": "Kahyeon Koh"}, {"name": "Yejun Cho"}, {"name": "Angel Rubio"}, {"name": "Noejung Park"}, {"name": "Dongbin Shin"}], "featured_authors": [{"name": "Daeheon Kim"}, {"name": "Jinseok Oh"}, {"name": "Kahyeon Koh"}, {"name": "Angel Rubio"}, {"name": "Noejung Park"}, {"name": "Dongbin Shin"}], "author_count": 7}, {"id": "2608.02511", "category": "cond-mat", "title": "Comparison of Lindblad and circuit approaches for quantum heat transport", "abstract": "We compare two popular models applicable to analyzing heat transport by thermal microwave photons in quantum circuits. The first model is derived from a weak-coupling Lindblad master equation, with transition rates determined by Fermi's golden rule induced by thermal dissipation sources. The second approach employs a circuit model, where thermal Johnson-Nyquist noise generated by dissipative elements introduces currents, and consequently Joule power, in other parts of the circuit. This leads to a Landauer type expression of heat transport where the transmission coefficient is proportional to the transconductance in the circuit. We find that the two models yield identical results in a linear circuit in the weak coupling limit with an analytic expression of power in an archetypal circuit of a cavity mediating heat between two baths. Our analysis yields a quantitative assessment of the range of validity of the weak coupling assumption in a circuit. Due to the correspondence of the two results, we feel confident in applying the weak coupling Lindblad model also for analyzing heat transport in quantum circuits consisting, e.g. of qubits and/or non-linear resonators.", "url": "https://arxiv.org/abs/2608.02511", "type": "理论", "summary": "1. 该工作系统比较了描述量子电路中热微波光子输运的两种模型：弱耦合Lindblad主方程与含约翰逊-奈奎斯特噪声的电路模型。\n2. 结果表明在线性电路中弱耦合极限下两者给出完全一致的解析热功率表达式，并定量给出了弱耦合近似的有效范围。\n3. 这一对应关系为将Lindblad弱耦合模型推广至含量子比特或非线性谐振器的量子热输运研究提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Bayan Karimi"}], "featured_authors": [{"name": "Bayan Karimi"}], "author_count": 1}, {"id": "2608.02513", "category": "cond-mat", "title": "Strain engineering of transient exciton diffusion in WSe2 monolayers at cryogenic temperatures", "abstract": "Tungsten-based transition metal dichalcogenides exhibit dark excitons as the energetically lowest states. These are crucial for exciton thermalization and propagation and they dominate low-temperature photoluminescence via the emergence of pronounced phonon sidebands. After a resonant excitation, highly mobile hot dark excitons are formed, which quickly thermalize into an equilibrium distribution. The application of strain modifies the exciton energy landscape and, in particular, the relative energy separation between bright and dark exciton states. The impact of strain on the transient photoluminescence and diffusion of non-equilibrium excitons has remained largely unexplored so far. In this work, we investigate the spatiotemporal exciton dynamics in strained hBN-encapsulated WSe2 monolayers at cryogenic temperatures. We demonstrate that tensile strain abruptly increases the excess energy of hot excitons, thereby accelerating their transient diffusion. We trace this back to suppressed phonon-mediated scattering from bright to dark excitons. Furthermore, we predict a periodic modulation of the transient exciton diffusion in the presence of a compressive strain resulting from strain-driven emission of M phonons. The gained microscopic insights illustrate how strain can be used to engineer transient photoluminescence and exciton diffusion in technologically promising 2D semiconductors.", "url": "https://arxiv.org/abs/2608.02513", "type": "理论", "summary": "1. 该工作通过低温时空分辨光致发光测量，研究了hBN封装WSe2单层中应变对瞬态激子扩散的调控。\n2. 其核心发现是张应变增大了热激子过剩能量并抑制亮到暗激子的声子散射，从而加快瞬态扩散；同时预言压应变下M声子发射导致扩散周期性调制。\n3. 这为利用应变工程调控二维半导体瞬态发光与激子输运提供了微观机制层面的可行思路。", "summary_source": "deepseek", "authors": [{"name": "Roberto Rosati"}, {"name": "Mohammed Adel Aly Nouh"}, {"name": "Robert Schmidt"}, {"name": "Rudolf Bratschitsch"}, {"name": "Ermin Malic"}], "featured_authors": [{"name": "Roberto Rosati"}, {"name": "Mohammed Adel Aly Nouh"}, {"name": "Robert Schmidt"}, {"name": "Rudolf Bratschitsch"}, {"name": "Ermin Malic"}], "author_count": 5}, {"id": "2608.02524", "category": "cond-mat", "title": "Gradient expansion approximation of the inhomogeneous electron-gas revisited: Higher-order corrections", "abstract": "In our recently published work (our Ref. 1) we revisited the gradient expansion approximation (GEA) of the interacting electron gas, and recalculated the leading-order contribution$-$with respect to the Wigner-Seitz radius $r_s$$-$to the coefficient $B_{xc}[n]$ of the square of the gradient of the electron density in the high-density and slowly varying limits. That work resolved historical controversies regarding these coefficients and demonstrated that serious misconceptions have led to incorrect constraints being imposed on popular functionals within the generalized gradient approximation (GGA). In the present paper, we extend this calculation to obtain the coefficient of the next-to-leading term, which scales as $r_s \\ln(r_s)$ relative to the leading order. First, we establish a systematic framework to evaluate the integral expressions for the $b_{xc}$ coefficient of the leading term ($\\sim q^2$) of the density-density response function in the long-wavelength limit ($q \\to 0$)$-$a prerequisite for computing $B_{xc}[n]$. The significance of the calculation stems from the proof that the coefficient of this $r_s \\ln(r_s)$ term receives no corrections from higher-order diagrammatic expressions. Consequently, our derived value serves as an exact, definitive constraint for future GGA functional development; in the high-density slowly-varying limit, any valid functional must reproduce the exact constraints established in both our previous work and the present paper.", "url": "https://arxiv.org/abs/2608.02524", "type": "理论+数值", "summary": "1. 该工作重新考察非均匀电子气的梯度展开近似，计算了高密度缓变极限下交换关联梯度项系数相对领头阶的 \\(r_s\\ln r_s\\) 高阶修正。\n2. 其技术核心是建立长波极限下密度-密度响应函数 \\(b_{xc}\\) 系数的系统化积分框架，并证明该高阶项不受更高阶图修正，从而得到唯一确定值。\n3. 这一结果为广义梯度近似泛函在高密度慢变化极限下提供了精确且规范性的约束，可供后续泛函构建直接采用。", "summary_source": "deepseek", "authors": [{"name": "Mario Benites"}, {"name": "Angel Rosado"}, {"name": "Efstratios Manousakis"}], "featured_authors": [{"name": "Mario Benites"}, {"name": "Angel Rosado"}, {"name": "Efstratios Manousakis"}], "author_count": 3}, {"id": "2608.02544", "category": "cond-mat", "title": "Thermal Stability of Two-Dimensional Crystals with Extended OH Hydrogen-Bonded Chains", "abstract": "Numerical simulations of the dynamics of monolayer structures of molecules deposited on a sheet of hexagonal boron nitride (h-BN) have been performed. It is shown that molecules containing benzene rings and hydroxyl groups in their structure can form stable two-dimensional crystals with linear chains of hydrogen bonds OH$\\cdots$OH$\\cdots$OH$\\cdots$ Such structures are formed by the following molecules: phenol (C$_6$H$_5$OH), hydroquinone (C$_6$H$_4$(OH)$_2$), 4-phenylphenol (C$_6$H$_5$--C$_6$H$_4$OH), 4-(4-phenylphenyl)phenol (C$_6$H$_5$--C$_6$H$_4$--C$_6$H$_4$OH), paracetamol (CH$_3$C(O)NHC$_6$H$_4$OH), 4-hydroxybenzanilide (C$_6$H$_5$C(O)NHC$_6$H$_4$OH) and 4,4-dihydroxybenzanilide (C$_6$H$_4$OHC(O)NHC$_6$H$_4$OH). On the one hand, the benzene rings in these molecules ensure their strong interaction with the flat substrate; on the other hand, they do not hinder the formation of extended hydrogen-bonded chains. The monolayer structures of these molecules exhibit high thermal stability: the onset melting temperatures of their 2D crystals are 47, 187, 127, 247, 167, 307, and 377 $^\\circ$C, respectively. The simulations allow us to conclude that multilayer structures composed of h-BN sheets and molecules of hydroquinone, paracetamol, and 4-hydroxybenzanilide can be used for the development of novel proton-exchange membranes capable of operating at elevated temperatures.", "url": "https://arxiv.org/abs/2608.02544", "type": "数值", "summary": "1. 该工作通过分子动力学模拟，考察了含苯环与羟基的酚类分子在六方氮化硼（h-BN）基底上形成单层二维晶体的结构及热稳定性。\n2. 其核心在于苯环与基底提供强吸附，而羟基可形成连续的OH···OH···OH氢键链；七种二维晶体的起始熔化温度分布在47至377°C之间，展示出明显差异。\n3. 这一机制为利用h-BN与氢醌、对乙酰氨基酚及4-羟基苯甲酰苯胺的多层复合结构开发高温质子交换膜提供了物理依据。", "summary_source": "deepseek", "authors": [{"name": "Alexander V. Savin"}], "featured_authors": [{"name": "Alexander V. Savin"}], "author_count": 1}, {"id": "2608.02552", "category": "cond-mat", "title": "Magnetic Skyrmion Interacting with Optical Skyrmion", "abstract": "Magnetic skyrmions (MSks) and optical skyrmions (OSks) embody topology in matter and in light, respectively. Here we investigate the interaction between a single MSk and an OSk beam. Three distinct nonlinear dynamical modes are identified: rotation, skipping, and trochoidal motion. By decomposing the optical driving force into gradient, orbital-angular-momentum, and spin-angular-momentum contributions, we clarify their respective roles of radial confinement, azimuthal drift, and precessional modulation. The skipping motion arises from the azimuthal asymmetry of the OSk beam and exhibits spatial selectivity originating from the magnetization-polarization coupling between the MSk and OSk. In three dimensions, the coupling acquires a propagation-dependent phase dominated by the differential Gouy phase, which yields $z$-asymmetric skipping trajectories. These results bridge topological particles and topological fields within a unified framework, offering helicity-selective and phase-programmable routes to optomagnonic control.", "url": "https://arxiv.org/abs/2608.02552", "type": "理论", "summary": "1. 该工作数值研究了单个磁斯格明子与光斯格明子束的相互作用，识别出旋转、跳跃和余摆线三种非线性动力学模式。\n2. 其要点在于将光驱动力分解为梯度、轨道角动量与自旋角动量贡献，阐明径向约束、方位漂移与进动调制机制，并指出跳跃运动源于光束的方位不对称及磁化-极化耦合。\n3. 三维耦合中传播依赖的差分Gouy相位导致z不对称跳跃轨迹，为拓扑粒子与拓扑场统一框架下实现螺旋度可选、相位可编程的光磁子操控提供了途径。", "summary_source": "deepseek", "authors": [{"name": "Lan Bo"}, {"name": "Jian Chen"}, {"name": "Xichao Zhang"}, {"name": "Yan Zhou"}, {"name": "Chengwei Qiu"}, {"name": "Masahito Mochizuki"}], "featured_authors": [{"name": "Lan Bo"}, {"name": "Jian Chen"}, {"name": "Xichao Zhang"}, {"name": "Yan Zhou"}, {"name": "Chengwei Qiu"}, {"name": "Masahito Mochizuki"}], "author_count": 6}, {"id": "2608.00159", "category": "hep-th", "title": "The Lorentzian Geometry of Tunneling in Global de Sitter at Late Time", "abstract": "It is widely believed that Coleman--De Luccia (CDL) instantons characterize tunneling transitions in a de Sitter multiverse. Their most naive interpretation uses analytic continuation to Lorentzian de Sitter at the minimal size of the spatial three-sphere. However, what one really wants is a geometry where a small bubble of new vacuum forms within the huge spatial sphere of an old parent de Sitter. Even by applying de Sitter isometries to the original CDL solutions, this cannot in general be achieved. In particular, it fails in the gravity-dominated regime, i.e. for up-tunneling and for transitions with heavy domain walls. These cases remain pathological in that the whole multiverse is in the causal future of every single up-tunneling event. To solve this problem, we develop a Hamiltonian description of how a small off-shell bubble grows and eventually goes on shell within the large spatial sphere of late-time de Sitter. We provide the corresponding WKB analysis, recovering the CDL rate. We explain that our tunneling process and that of CDL are described by two different analytic continuations of a unique on-shell trajectory in the Hamiltonian treatment. Our analysis has crucial implications for the Larfors--Johnson problem, which questions the standard mechanism for populating the string-theoretic flux landscape on the basis of an instability of the relevant domain walls.", "url": "https://arxiv.org/abs/2608.00159", "type": "理论", "summary": "1. 该工作提出全局德西特时空晚期隧穿的真实洛伦兹几何，建立了小离壳泡在大空间球内生长到上壳的哈密顿描述。\n2. 其核心在于给出相应WKB分析并重现Coleman-de Luccia速率，且表明该过程与CDL是同一上壳轨迹的两种不同解析延拓。\n3. 这一框架化解了重畴壁与上隧穿情形下整个多重宇宙处于每一事件因果未来的病态，并对Larfors-Johnson问题及弦论通量景观布居机制具有关键启示。", "summary_source": "deepseek", "authors": [{"name": "Thibaut Coudarchet"}, {"name": "Ben Freivogel"}, {"name": "Bjoern Hassfeld"}, {"name": "Arthur Hebecker"}], "featured_authors": [{"name": "Thibaut Coudarchet"}, {"name": "Ben Freivogel"}, {"name": "Bjoern Hassfeld"}, {"name": "Arthur Hebecker"}], "author_count": 4}, {"id": "2608.00169", "category": "hep-th", "title": "Dynamics of nucleation in thermal phase transitions", "abstract": "We study dynamical effects during nucleation in thermal first-order phase transitions in field theory. Focusing on the classical regime of the decay of a metastable state, we present the general formula for the thermal decay rate including the dynamical prefactor and give a recipe for its systematic evaluation. We describe the physical mechanism which reduces the actual thermal decay rate with respect to the statistical rate obtained in equilibrium theory. We also discuss the thermality conditions ensuring the existence of a steady-state thermal rate, in which case our formula is exact up to exponentially small corrections. We show that it reproduces the known results for the nucleation rate in stochastic mechanics and field theory, and allows us to unify and go beyond them. We illustrate this in real-time numerical simulations of simple field theory models. We observe significant non-perturbative contributions which can dominate the dynamical prefactor in weakly-coupled field theories at moderate exponential suppression of the decay rate. We explore the connection of these non-perturbative effects to oscillons. Notably, our numerical method requires exponentially less computing time than direct simulations of decays and is thus applicable to systems with arbitrarily strong exponential suppression. Finally, we discuss small or poorly thermalized systems when the thermality conditions are violated and the steady-state rate does not exist.", "url": "https://arxiv.org/abs/2608.00169", "type": "理论", "summary": "1. 该工作研究热一级相变中亚稳态经典衰变动力学，给出包含动力学预因子的热衰变率一般公式，并提供了其系统评估方案。\n2. 其主要物理内容在于揭示实际热衰变率低于平衡统计率的动力学机制，证明在满足热性条件时该公式精确至指数小修正，并发现弱耦合场论中非微扰振荡子贡献可主导动力学预因子。\n3. 这为强指数压低系统的衰变模拟提供了指数级加速方法，也为热性条件破坏的小或弱热化系统的成核动力学研究打开了窗口。", "summary_source": "deepseek", "authors": [{"name": "Oliver Gould"}, {"name": "Joonas Hirvonen"}, {"name": "Andrey Shkerin"}, {"name": "Sergey Sibiryakov"}], "featured_authors": [{"name": "Oliver Gould"}, {"name": "Joonas Hirvonen"}, {"name": "Andrey Shkerin"}, {"name": "Sergey Sibiryakov"}], "author_count": 4}, {"id": "2608.00185", "category": "hep-th", "title": "Minimal Massive Gravity Coupled to Higher Spins", "abstract": "Among three-dimensional massive gravities, Minimal Massive Gravity (MMG) is distinguished by a parameter regime in which the AdS bulk theory and the dual conformal field theory can be simultaneously unitary. We couple MMG to a finite tower of higher-spins by promoting the fields of its first-order formulation to $\\mathfrak{sl}(N)$-valued ones. We also present an extended formulation involving a group-valued Stückelberg scalar, which realizes the higher-spin translations broken by the massive deformation. We then construct AdS$_2\\times$S$^1$ solutions carrying higher-spin hair specific to the massive theory. Finally, we analyse the mass spectrum of the higher-spin modes around AdS$_3$.", "url": "https://arxiv.org/abs/2608.00185", "type": "理论", "summary": "1. 该工作将最小有质量引力与有限高阶自旋塔耦合，把其一阶表述中的场提升为sl(N)取值场。\n2. 技术要点是引入群值Stückelberg标量的扩展表述，并构造带高阶自旋毛的AdS2×S1解。\n3. 通过分析AdS3上高阶自旋模的质量谱，为三维有质量引力与边界CFT的同时幺正性提供新探针。", "summary_source": "deepseek", "authors": [{"name": "Franz Ciceri"}, {"name": "Nihat Sadik Deger"}, {"name": "Bastien Duboeuf"}, {"name": "Henning Samtleben"}], "featured_authors": [{"name": "Franz Ciceri"}, {"name": "Nihat Sadik Deger"}, {"name": "Bastien Duboeuf"}, {"name": "Henning Samtleben"}], "author_count": 4}, {"id": "2608.00204", "category": "hep-th", "title": "Infrared Problem in Quantum Electrodynamics", "abstract": "It is well known that the inclusive cross section in QED is infrared finite. In the standard diagram techniques this result follows from cancellation of infrared divergences. We construct a new diagram technique where the diagrams for inclusive cross sections (and, more generally, for inclusive scattering matrix) do not contain infrared divergences.", "url": "https://arxiv.org/abs/2608.00204", "type": "理论", "summary": "1. 该工作针对量子电动力学中的红外问题，构造了一种新的图解技术，使 inclusive 散射截面及 inclusive 散射矩阵的各图元不出现红外发散。\n2. 其核心在于将传统方案中依赖红外发散相消的有限性直接嵌入图解构造，从而无需逐项抵消即可获得红外安全结果。\n3. 这为 QED 中红外安全量的系统高阶计算提供了更直接的图展开路径，也可能启发其他规范理论中的红外处理方案。", "summary_source": "deepseek", "authors": [{"name": "Igor Frolov"}, {"name": "Albert Schwarz"}], "featured_authors": [{"name": "Igor Frolov"}, {"name": "Albert Schwarz"}], "author_count": 2}, {"id": "2608.00363", "category": "hep-th", "title": "Projecting Gravitational Fluctuations onto Near-Horizon Throats", "abstract": "We show that, for stationary geometries whose linearized fluctuation equations separate into radial and angular Heun equations, a pair of diffeomorphisms projects the full problem onto two coupled, isospectral Gauss hypergeometric problems in complementary spacetime regions. This projection requires Robin boundary conditions to be imposed at the intersection between the complementary regions, which are uniquely fixed by requiring the two diffeomorphisms to match there. The method provides an independent derivation of recent results obtained from the correspondence between Heun connection coefficients and instanton partition functions in the Nekrasov-Shatashvili limit. As an application, we identify a subset of modes in Kerr-de Sitter and Kerr-anti-de Sitter black holes that, in the near-extremal limit, continuously reduce to a basis of the Schwarzian/Jackiw-Teitelboim functional space of gravitational fluctuations.", "url": "https://arxiv.org/abs/2608.00363", "type": "理论", "summary": "1. 该工作针对线性化扰动方程可分离为径向与角向Heun方程的稳态时空，证明一对微分同胚可将完整问题投影为互补时空区域中两个耦合且等谱的Gauss超几何问题。\n2. 其技术要点是在两区域交界处施加由微分同胚匹配唯一确定的Robin边界条件，从而独立导出Heun连接系数与Nekrasov-Shatashvili瞬子配分函数对应中的近期结果。\n3. 这一投影方法识别出Kerr-de Sitter与Kerr-anti-de Sitter黑洞在近极端极限下连续退化为Schwarzian/Jackiw-Teitelboim引力涨落基的模态，为近视界喉道动力学研究提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Alejandro Cabo-Bizet"}, {"name": "Vasil Dimitrov"}, {"name": "Dario Martelli"}, {"name": "Lorenzo Ruggeri"}], "featured_authors": [{"name": "Alejandro Cabo-Bizet"}, {"name": "Vasil Dimitrov"}, {"name": "Dario Martelli"}, {"name": "Lorenzo Ruggeri"}], "author_count": 4}, {"id": "2608.00376", "category": "hep-th", "title": "Fibre Inflation Beyond BHP: Constraints and a BHP-Free Regime", "abstract": "We study a restricted fibre-dependent $\\alpha'$-loop sector in Type IIB Large Volume Scenario fibre inflation beyond the conventional Berg-Haack-Pajer (BHP) parametrisation. Motivated by effective-field-theory corrections in K3-fibred Calabi--Yau orientifolds, we analyse BHP-complete, partially BHP-driven and BHP-free configurations. For BHP-driven cases, the additional corrections act as effective deformations of the standard fibre potential and are bounded at the percent level relative to the corresponding BHP structures, with logarithmic terms typically more restricted due to their effects on the slope and curvature. At the effective-field-theory level, we identify a BHP-free fibre-inflation regime, referred to as $\\alpha'$-loop inflation, in which the conventional KK- and winding-type BHP channels vanish while the generalized loop sector stabilises the fibre modulus and supports slow-roll inflation. This regime exhibits a characteristic hierarchy between fibre-dependent loop structures controlled by the large-volume suppression and satisfies CMB, Kähler-cone, large-volume and heavy-modulus constraints. Our results show that fibre inflation is sensitive to the orientifold and brane configurations, and that corrections beyond the BHP ansatz can generate new controlled inflationary regimes.", "url": "https://arxiv.org/abs/2608.00376", "type": "理论", "summary": "1. 研究IIB大体积情形纤维暴涨中超越BHP参数化的纤维相关α'圈修正，区分BHP完备、部分驱动与无BHP构型。\n2. 识别出无BHP的α'圈暴涨机制：传统KK与缠绕通道消失，广义圈修正稳定纤维模并支持慢滚，满足CMB等约束。\n3. 表明纤维暴涨对定向折叠与膜配置敏感，超越BHP的修正可生成新的受控暴涨区域，为弦宇宙学模型提供启发。", "summary_source": "deepseek", "authors": [{"name": "Xin Gao"}, {"name": "Zhiwei Li"}, {"name": "Chuying Wang"}], "featured_authors": [{"name": "Xin Gao"}, {"name": "Zhiwei Li"}, {"name": "Chuying Wang"}], "author_count": 3}, {"id": "2608.00590", "category": "hep-th", "title": "IR Black Hole Instabilities Trigger Species-Scale Particle Production", "abstract": "We propose a novel UV-IR mechanism in quantum gravity in which black hole instabilities act as a bridge to the most ultraviolet sector of the theory. Specifically, we argue that when black holes reach a critical temperature associated with a light tower of states, they undergo a phase transition that sources particles near the species scale, a threshold beyond which any effective field theory of gravity fails. Using the existing numerical results, we show that production of such particles through Hawking radiation is always subdominant. We also extend our investigation to a large family of dyonic and dilatonic black holes and show how the conclusion depends on the origin of the gauge symmetry, its dilatonic coupling, and the charge under that gauge symmetry.", "url": "https://arxiv.org/abs/2608.00590", "type": "理论", "summary": "1. 该工作提出量子引力中一种新颖的红外-紫外机制：黑洞不稳定性充当连接红外物理与理论最深紫外区的桥梁。\n2. 其卖点在于，当黑洞达到与轻态塔相关的临界温度时发生相变并在物种标度附近产生粒子，且数值表明霍金辐射的产生始终次主导；研究还推广至带dyon及伸缩子的黑洞族，并显示结论依赖于规范对称性起源、伸缩耦合与规范荷。\n3. 这为厘清有效场论失效边界、检验黑洞物理与物种标度关系提供了明确理论参照与可计算平台。", "summary_source": "deepseek", "authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Alek Bedroya"}, {"name": "Dieter Lüst"}, {"name": "Houri-Christina Tarazi"}], "featured_authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Alek Bedroya"}, {"name": "Dieter Lüst"}, {"name": "Houri-Christina Tarazi"}], "author_count": 4}, {"id": "2608.00665", "category": "hep-th", "title": "Spectral Functions of $J/ψ$ Meson in Rotating Thermal Background from Holography", "abstract": "We investigate the spectral functions of the $J/\\psi$ meson in a rotating thermal background within the soft-wall holographic model. The global rotation is implemented through a rotating AdS-like metric, while a local inertial frame is introduced in which the vector field can be decomposed into different spin states. We solve the equations of motion of the vector field in the bulk with incoming wave condition near the horizon and compute the retarded Green function, from which we extract the invariant-mass spectral functions for $J/\\psi$. When the momentum is parallel to the rotation axis, the peak energies shift by $-\\Omega J_z$, as expected by a coupling between rotation and angular momentum, while the widths are nearly independent to $\\Omega$. When the momentum is in perpendicular direction, the spectral functions for spin-$\\pm1$ states deviate significantly from the single-peak behavior and the energy shifts depart from $-\\Omega J_z$. The resulting triplet splittings of the spectral functions provides a holographic perspective on spin-dependent vector meson properties in rotating systems.", "url": "https://arxiv.org/abs/2608.00665", "type": "理论", "summary": "1. 该工作利用软墙全息模型研究了旋转热背景中J/ψ介子的不变质量谱函数。\n2. 其技术要点是在旋转AdS度规中引入局域惯性系以分解矢量场的自旋态，并发现平行于转动轴时峰位按−ΩJ_z移动而宽度基本不变，垂直时自旋±1态偏离单峰并出现三重劈裂。\n3. 这为从全息角度理解旋转夸克胶子等离子体中矢量介子的自旋依赖性质提供了可检验的理论图像。", "summary_source": "deepseek", "authors": [{"name": "Xin-Li Sheng"}, {"name": "Jun-Xia Chen"}, {"name": "Defu Hou"}, {"name": "Hai-Cang Ren"}], "featured_authors": [{"name": "Xin-Li Sheng"}, {"name": "Jun-Xia Chen"}, {"name": "Defu Hou"}, {"name": "Hai-Cang Ren"}], "author_count": 4}, {"id": "2608.00758", "category": "hep-th", "title": "Aspects of the quantization of non-linear electrodynamics in an uniform magnetic background", "abstract": "The canonical and path integral quantization for non-linear electrodynamics in the presence of an external electromagnetic (EM) field are proposed in this work. The EM background field is introduced expanding a general lagrangian of a generic non-linear electrodynamics around the background for small fluctuations of the propagating fields, where we consider up to the quadratic terms in the propagating fields. As consequence, we obtain an electrodynamics linearized by the presence of the external EM field. Thereby, we study the canonical quantization calculating the energy for the ground state of the linearized EM field in terms of an external magnetic field. The microcausality of the model also is discussed through the Pauli-Jordan function. We also define a generating functional for the linearized EM field, in which, in the Coulomb gauge, the Green function of the model is obtained, and we can construct the perturbative formalism like in standard quantum field theory (QFT). As application of the perturbation theory, the effective potential at one loop is calculated for the linearized EM field coupled to a complex scalar field. We apply the results in the case of the Modified Maxwell ED.", "url": "https://arxiv.org/abs/2608.00758", "type": "理论", "summary": "1. 该工作给出了均匀电磁背景中非线性电动力学的正则与路径积分量子化方案，将一般拉氏量对背景场展开并保留至传播场二次项。\n2. 其技术要点是在外磁场中建立线性化理论并计算基态能量，通过Pauli-Jordan函数讨论微观因果性，且在库仑规范下构造生成泛函与格林函数。\n3. 作为应用，计算了线性化场与复标量场耦合的单圈有效势，并具体展示于修正Maxwell电动力学，为强背景场下非线性QFT研究提供可推广框架。", "summary_source": "deepseek", "authors": [{"name": "M. J. Neves"}], "featured_authors": [{"name": "M. J. Neves"}], "author_count": 1}, {"id": "2608.00784", "category": "hep-th", "title": "Classical Black Hole Scattering to Celestial Amplitudes in Effective Theories of Gravity", "abstract": "This thesis investigates quantum field theoretic approaches to classical gravity beyond General Relativity. Using worldline effective field theory, worldline quantum field theory, and on shell scattering amplitudes, it investigates compact-object dynamics in dark-sector models, scalar tensor gravity, dynamical Chern Simons gravity, and Einstein Maxwell dilaton theory. The thesis derives a range of conservative and radiative observables, including impulses, waveforms, eikonal phases, two-body potentials, and scattering angles, while incorporating effects associated with spin, parity violation, infrared structure, and multi-loop integrals. It also constructs celestial eikonal amplitudes and analyzes their conformal data in gravitational theories beyond General Relativity. Collectively, these results broaden the application of modern quantum field theoretic techniques to gravitational dynamics and contribute to a more detailed understanding of gravity beyond the Einsteinian framework. (Detailed abstract in the thesis.)", "url": "https://arxiv.org/abs/2608.00784", "type": "理论", "summary": "1. 该工作运用世界线有效场论、世界线量子场论和在壳散射振幅，研究暗物质、标量-张量、动力学Chern-Simons及爱因斯坦-麦克斯韦-膨胀理论中的经典黑洞散射与致密体动力学。\n2. 其主要技术特色是统一推导脉冲、波形、eikonal相位、两体势和散射角等保守与辐射可观测量，融入自旋、宇称破缺、红外结构和多圈积分效应，并构造超广义相对论的celestial eikonal振幅及其共形数据。\n3. 这为量子场论散射方法在广义相对论之外引力有效理论中的推广，以及黑洞天体物理可观测量的精确计算提供了系统性理论框架与明确启示。", "summary_source": "deepseek", "authors": [{"name": "Saptaswa Ghosh"}], "featured_authors": [{"name": "Saptaswa Ghosh"}], "author_count": 1}, {"id": "2608.01125", "category": "hep-th", "title": "Symmetric formulation for higher spin correlators, quantum effective action and anomaly", "abstract": "We develop a constructive framework for the three-point higher spin conformal correlation function, originally introduced in our previous work, and apply it as the foundation for constructing the quantum effective action of the corresponding higher spin conformal gauge theory. Employing a symmetric refinement of the earlier construction, we analyze the principal singularity of the three-point function and the associated effective action. This leads to a general method for extracting the dominant singularity and investigating the anomalous local contributions to the effective action.", "url": "https://arxiv.org/abs/2608.01125", "type": "理论", "summary": "1. 该工作发展了一种构造高自旋共形场论三点关联函数的对称化方案，并将其作为基础，系统构建了相应高自旋共形规范理论的量子有效作用量。\n2. 主要技术亮点在于利用对早期构造的对称精化，系统分析三点函数的主奇异点，从而给出从有效作用量中提取主导奇异贡献并研究反常局域项的通用方法。\n3. 这一框架为从基本关联函数出发理解高自旋规范理论的反常结构、以及量子有效作用量的非局域与局域性质提供了清晰可行的理论路径。", "summary_source": "deepseek", "authors": [{"name": "Melik Karapetyan"}, {"name": "Ruben Manvelyan"}], "featured_authors": [{"name": "Melik Karapetyan"}, {"name": "Ruben Manvelyan"}], "author_count": 2}, {"id": "2608.01154", "category": "hep-th", "title": "Testing bare open-string-metric areas against flavour entanglement in finite-density D3-D7", "abstract": "We test whether bare codimension-two areas in the D7-brane open string metric (OSM) reproduce the leading probe-brane contribution to boundary entanglement entropy in the massless finite-density D3-D7 system at zero temperature. The established Chang-Karch-Uhlemann benchmark contains shape-dependent volume terms in a controlled probe regime. By contrast, the connected strip family terminates at a maximal width and the selected strip finite part saturates at the disconnected-reference value, while the lower-area spherical branch is area-like rather than volume-like at large radius. The OSM construction nevertheless detects the density-induced crossover scale, and its geometric landmarks occur at order-one multiples of a pole-defined longitudinal response length. A low-temperature regulator shows that no density-controlled horizon-volume term survives the zero-temperature limit. Bare OSM areas therefore diagnose open-sector crossover physics but do not, in general, compute flavour entanglement entropy.", "url": "https://arxiv.org/abs/2608.01154", "type": "理论", "summary": "1. 该工作针对零温无质量有限密度D3-D7系统，检验了D7膜开弦度规中裸余二维面积能否复现边界纠缠熵的领先探针膜贡献。\n2. 与已确立的Chang-Karch-Uhlemann基准相比，连通条带族在最大宽度处截断且有限部分趋于断连参考值，低面积球状分支在大半径处呈面积型而非体积型；低温正规化亦不产生密度控制的视界体积项，但裸面积仍可探测密度诱导交叉尺度，其几何标志为极点定义纵向响应长度的一倍量级。\n3. 因此裸开弦度规面积可作为开扇区交叉物理的诊断量，却一般不能用于计算味纠缠熵，后续需借助完整全息纠缠泛函或正规化方案加以修正。", "summary_source": "deepseek", "authors": [{"name": "Fuminori Okabayashi"}], "featured_authors": [{"name": "Fuminori Okabayashi"}], "author_count": 1}, {"id": "2608.01349", "category": "hep-th", "title": "Exact Finite-$N$ eRS Surface-Defect Indices and Giant-Graviton Corrections in $\\mathcal N=4$ SYM", "abstract": "We study the finite-$N$ superconformal index of four-dimensional $\\mathcal N=4$ $U(N)$ Yang--Mills theory with antisymmetric elliptic Ruijsenaars--Schneider (eRS) insertions. The eRS insertions turn the uninserted index, which is an unweighted spectral sum, into a family of protected observables weighted by eRS eigenvalues and therefore retain finite-$N$ information not determined by the ordinary index alone On the codimension-one locus $t=q$, $p=uv$, the eRS operators become conjugate to free shifts, allowing us to rewrite the self-glued index as a bilateral free-fermion determinant. This gives exact finite-$N$ formulas for all antisymmetric ranks and makes the $u\\leftrightarrow v$ structure manifest. On the boundary $v=0$, we determine the complete stable tower of pure $u^{kN}$ defect-resolved corrections, while the bilateral two-charge formula captures the reflected $v^{kN}$ sectors and mixed $u$--$v$ contributions, including the first mixed giant-graviton sector. We also develop the expansion away from the solvable locus through second order. Finally, we reproduce the ordinary one-giant coefficient from a maximal-D3 determinant and identify the additional microscopic input required to complete the bulk derivation of the defect correction.", "url": "https://arxiv.org/abs/2608.01349", "type": "理论", "summary": "1. 该文研究四维 N=4 U(N) 超对称杨-米尔斯理论中带反对称 eRS 插入的有限 N 超共形指标，系统计算表面缺陷相关的巨引力子修正。\n2. 其核心卖点是在 t=q、p=uv 轨迹上把自粘指标化为双边自由费米子行列式，得到所有反对称秩的精确有限 N 公式，并显明 u↔v 结构及首阶混合巨引力子扇区。\n3. 该工作同时给出可解轨迹外的二阶偏离，并指出完成体理论缺陷修正导出所需的额外微观输入，为后续面缺陷指标研究提供可推广框架。", "summary_source": "deepseek", "authors": [{"name": "Ji-Seong Chae"}], "featured_authors": [{"name": "Ji-Seong Chae"}], "author_count": 1}, {"id": "2608.01372", "category": "hep-th", "title": "Quantization of Galilean Electrodynamics: a non-trivially trivial theory", "abstract": "We consider the quantization of the non-relativistic limit of electrodynamics called Galilean electrodynamics. To that end, we apply the Dirac bracket formalism to understand the constraints and dynamics of the theory and analyze its gauge structure. We show that the theory is fully constrained, which eliminates all the degrees of freedom from the path integral.", "url": "https://arxiv.org/abs/2608.01372", "type": "理论", "summary": "1. 该工作针对电动力学的非相对论极限——伽利略电动力学，运用Dirac括号形式体系处理其量子化，系统考察了理论的约束结构、动力学行为与规范性质。\n2. 其核心卖点在于证明该理论是一个完全受约束的系统，路径积分中的全部动态自由度均被约束条件消去，从而形成一种“非平凡却平凡”的量子理论。\n3. 这一结论为非相对论规范场论的量子化方法、约束系统的路径积分处理及低能极限下的对称性分析提供了有普适意义的参照与启发。", "summary_source": "deepseek", "authors": [{"name": "Rafael Hernandez"}, {"name": "Juan Miguel Nieto Garcia"}, {"name": "Ander Urtiaga"}], "featured_authors": [{"name": "Rafael Hernandez"}, {"name": "Juan Miguel Nieto Garcia"}, {"name": "Ander Urtiaga"}], "author_count": 3}, {"id": "2608.01729", "category": "hep-th", "title": "de Sitter holography from a Lorentzian torus", "abstract": "We show that the quantum entanglement between the conformal field theories (CFTs) living on the future and past boundaries in the de Sitter/conformal field theory (dS/CFT) correspondence can be described by Wick rotating to a geometry with two timelike directions. We propose a new realization of the dS/CFT correspondence in which quantum gravity on this two-time geometry is holographically dual to a CFT defined on a Lorentzian torus. We show that this duality reproduces key features of dS holography, including the dS entropy, correlation functions, and pseudoentropy. Finally, by extending the framework of path-integral optimization, we explain how dS spacetime emerges from the CFT on the Lorentzian torus.", "url": "https://arxiv.org/abs/2608.01729", "type": "理论", "summary": "1. 该工作通过Wick转动将dS/CFT中未来与过去边界CFT间的量子纠缠映射到含两个类时方向的几何，并提出该双时间几何上的量子引力与定义在Lorentzian环面上的CFT全息对偶的新实现。\n2. 其技术要点在于利用双时间几何与Lorentzian环面CFT的联系，统一重现dS熵、关联函数与赝熵，并借助路径积分优化框架推导dS时空从该CFT涌现。\n3. 这一对偶为dS全息及宇宙学时空的量子纠缠结构提供了新的具体实现，有望推动dS/CFT中边界关联与体涌现机制的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Kosei Fujiki"}, {"name": "Michitaka Kohara"}, {"name": "Javier Moreno"}, {"name": "Kotaro Shinmyo"}, {"name": "Tadashi Takayanagi"}], "featured_authors": [{"name": "Kosei Fujiki"}, {"name": "Michitaka Kohara"}, {"name": "Javier Moreno"}, {"name": "Kotaro Shinmyo"}, {"name": "Tadashi Takayanagi"}], "author_count": 5}, {"id": "2608.01762", "category": "hep-th", "title": "Primordial Correlators from a Kaluza-Klein Graviton Continuum", "abstract": "Cosmological collider signals are usually discussed for isolated massive particles, whose exchange produces characteristic logarithmic oscillations in primordial correlators. In this work, we study how this signal is modified when the exchanged states form a continuous mass spectrum. We first develop a spectral representation for inflationary correlators mediated by a continuum field. In the soft limit, the non-analytic part of the seed function is expressed as a Fourier--Laplace transform of the spectral weight with respect to logarithmic momentum variables. This representation shows that a continuum superposes clock signals with different frequencies and can dephase the sharp oscillation associated with a single massive particle. We then realize this mechanism in an RS2-like inflationary braneworld, where the inflaton is localized on a de Sitter brane in a five-dimensional AdS bulk. The tensor sector contains a localized massless graviton and a continuum of Kaluza-Klein gravitons starting at \\(m=3H/2\\). We derive the KK wavefunctions and identify the brane spectral weight fixed by the continuum wavefunction on the brane. Applying this weight to the inflaton four-point function, we find a smooth seed function rather than a persistent logarithmic clock oscillation. This behavior follows from the fact that the continuum starts at zero clock frequency, while the KK spectral weight vanishes near threshold. Our results provide a concrete higher-dimensional example in which deviations from the standard cosmological collider signal encode the structure of a continuum high-energy spectrum.", "url": "https://arxiv.org/abs/2608.01762", "type": "理论", "summary": "1. 该工作研究通货膨胀宇宙学碰撞子信号在交换态具有连续质量谱时的修正，提出了连续谱场中介的原初关联函数谱表示。\n2. 在RS2型膜世界实现中，局域化膨胀子与始于m=3H/2的KK引力子连续谱耦合，四关联种子函数因阈值处谱权重消失而呈光滑而非对数振荡。\n3. 这一结果表明连续高能谱结构可通过偏离标准宇宙学碰撞子钟信号的形式得到编码，为探测额外维连续谱提供了具体范例。", "summary_source": "deepseek", "authors": [{"name": "Shuntaro Aoki"}], "featured_authors": [{"name": "Shuntaro Aoki"}], "author_count": 1}, {"id": "2608.01818", "category": "hep-th", "title": "Holographic Thermodynamics of Dyonic Dilaton AdS Black Holes", "abstract": "We investigate the holographic dual of the extended bulk thermodynamics of dyonic dilaton AdS black holes by allowing both the cosmological constant and Newton's gravitational constant to vary. In the dual CFT thermodynamics, the central charge $C$ and chemical potential $\\mu$ as its conjugate enter the thermodynamic relations, in addition to $(\\tilde{T},\\tilde{S})$, $(\\tilde{Q},\\tilde{\\Phi})$, $(\\tilde{P},\\tilde{\\Psi})$, $(\\tilde{\\mathcal{P}},\\tilde{V})$. We consider sixteen different ensembles related to those five pairs of thermodynamic variables which we separate into fixed volume and pressure ensembles. Due to the symmetry on ($\\tilde{Q},\\tilde{P}$), we only need to analyze five ensembles each in fixed volume and pressure ensembles. In the fixed volume ensembles, it is found that the fixed ($\\tilde{Q},\\tilde{P},\\tilde{V},\\mu$) and ($\\tilde{\\Phi},\\tilde{P},\\tilde{V},\\mu$) exhibit a zeroth-order phase transition. Interestingly, the fixed ($\\tilde{\\Phi},\\tilde{\\Psi},\\tilde{V},C$) ensemble shows the zeroth- and first-order phase transitions at above and below critical potential $\\tilde{\\Upsilon}_c$, respectively. In the fixed pressure ensembles, it is found that richer structures appear where the sign of $\\mu$ heavily influences phase space for several ensembles. For fixed ($\\tilde{Q},\\tilde{P},\\tilde{\\mathcal{P}},\\mu$) and ($\\tilde{\\Phi},\\tilde{P},\\tilde{\\mathcal{P}},\\mu$), they show the zeroth-, first-, and second-order phase transitions. For the fixed ($\\tilde{\\Phi},\\tilde{\\Psi},\\tilde{\\mathcal{P}},\\mu$) ensemble, there is only a zeroth-order phase transition occurs. The other ensembles which we do not mention eventually do not show any phase transition. These findings provide deeper insight into how bulk gravitational variations, particularly regarding the cosmological and gravitational constants, translate to exact critical phenomena and richer phase structures within CFT.", "url": "https://arxiv.org/abs/2608.01818", "type": "理论", "summary": "1. 该工作同时变动宇宙学常数与牛顿常数，研究双荷dilaton AdS黑洞的扩展体热力学及其全息CFT对应。\n2. 其要点是在CFT中引入中心荷C及共轭化学势μ，系统分析固定体积与固定压力下的十六种系综，发现零级、一级与二级相变，并揭示μ符号对相空间的显著影响。\n3. 这些结果说明体引力常数与宇宙学常数的变分可转化为CFT中的精确临界现象和更丰富相结构，为全息热力学系综分类提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Muhammad Fitrah Alfian Rangga Sakti"}, {"name": "Robert Mann"}, {"name": "Piyabut Burikham"}], "featured_authors": [{"name": "Muhammad Fitrah Alfian Rangga Sakti"}, {"name": "Robert Mann"}, {"name": "Piyabut Burikham"}], "author_count": 3}, {"id": "2608.01989", "category": "hep-th", "title": "Coarse-Graining and the Classification of Long-Range Correlations in Quantum Field Theory", "abstract": "A conservation-law-guided classification framework is developed for the execution of coarse-graining operations in quantum field theory. Coarse-graining produces a selection at the level of Feynman diagrams. Diagrams with nonzero momentum transfer are suppressed by oscillatory factors, zero-momentum-transfer ladder diagrams can accumulate through geometric series resummation to produce a spectral pole, and single-bubble topologies contribute only to the continuum. Conservation laws govern this classification. For operators protected by a Ward identity, the matrix element at zero momentum is guaranteed to be nonvanishing. For operators protected by BRST symmetry, the Slavnov-Taylor identities provide no mandatory suppression. The two cases differ in the strength of the algebraic guarantee. For unprotected operators the injection term vanishes and the spectral function remains continuous. The sign of the single-bubble contribution is determined by spin statistics. A positive sign leads to amplificative feedback in the ladder resummation, a negative sign leads to suppressive feedback. These two attributes, the nonvanishing of the injection term and the sign of the single-bubble contribution, are the defining criteria of the classification. As a direct application, a general classification of local operators is established within the emergence framework and verified on eight physical channels and three known solvable systems. The framework indicates which emergence paths are possible for each operator; whether the critical condition is reached is left for independent nonperturbative computation. The logical structure of this classification is parallel to the strategy used in deriving fluid equations from molecular kinetic theory in classical statistical physics.", "url": "https://arxiv.org/abs/2608.01989", "type": "理论", "summary": "1. 该工作提出一个由守恒律引导的量子场论粗粒化分类框架，通过对费曼图分级筛选确定长期关联的谱结构。\n2. 其技术核心是证明零动量梯形图经几何级数重求和可产生谱极点，而单气泡图仅贡献连续谱且其符号由自旋统计决定，从而以注入项是否非零和反馈符号为判据对局域算符分类。\n3. 该分类为涌现框架下各算符的可能涌现路径提供了系统约束，并类比经典动力学理论推导流体方程，为后续非微扰临界性计算奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Jinku Guo"}], "featured_authors": [{"name": "Jinku Guo"}], "author_count": 1}, {"id": "2608.02262", "category": "hep-th", "title": "Superloop Equations and Minimal Surfaces I: Confining minimal surface in $4D, N=1$ SYM", "abstract": "We formulate the loop equations of pure $4d, N=1$ super Yang--Mills (SYM) theory in a finite geometric form. The usual equal-point loop derivatives are singular because the order of gauge-field insertions is lost when contour points coincide. Our path-ordered operator calculus (POOC) keeps the insertions in distinct ordered slots, forms the graded commutators and Jacobi combinations, and only then takes the coincidence limit. This removes the spurious kinematical singularities without introducing a cutoff; the genuine ultraviolet contact remains a separate physical distribution. We apply POOC to the exact Itoyama--Takashino superloop hierarchy and construct a Lorentzian supersymmetric Hodge-dual (SHD) surface functional. Its Hodge-resolved area derivative is annihilated by the local chiral and anti-chiral loop operators. Exact additivity under surface-geodesic sewing shows that the exponential of this zero mode multiplies any solution of the complete finite-$N$ hierarchy without changing the equations. For planar contours the SHD functional is the geometric area. In particular, for a long rectangular Wilson loop, $W[C_{T,L}]\\sim\\exp[-i\\sigma_kLT]$ and $E_k(L)=\\sigma_kL>0$. Thus the construction gives an exact nonperturbative confining area-law factor in $ N=1$ SYM. After Euclidean continuation, the same SHD factor is an exact fixed point of the deterministic zero-noise SYM gradient flow. Its interpretation as a dynamically selected equilibrium still requires stability in the long-flow-time, large-volume, and zero-noise limits, but this does not affect the exact zero-mode and finite-$N$ dressing theorems. The complete planar Wilson-loop solution, including the undressed fluctuation factor and excitation spectrum, will be developed in the next papers of this series.", "url": "https://arxiv.org/abs/2608.02262", "type": "理论", "summary": "1. 本文用路径有序算符微积分将纯四维N=1超杨-米尔斯理论的圈方程写成有限几何形式，并构造了超对称Hodge对偶曲面泛函。\n2. 其技术核心是先在分离有序槽中取分级对易子与Jacobi组合再取重合极限，使该曲面泛函的Hodge面积导数被手征圈算符湮灭，且对长矩形Wilson圈给出精确非微扰面积律因子exp[-iσLT]。\n3. 这为N=1 SYM中禁闭面积律提供了精确零模与有限N dressing定理，并为欧氏梯度流的动态选择问题留下稳定性这一可检验的后续课题。", "summary_source": "deepseek", "authors": [{"name": "Alexander Migdal"}], "featured_authors": [{"name": "Alexander Migdal"}], "author_count": 1}, {"id": "2608.02368", "category": "hep-th", "title": "Subleading Asymptotic Charges in Massless Scalar QED", "abstract": "We study subleading asymptotic charges of a U(1) gauge field coupled to a charged massless scalar field in Minkowski spacetime. We consider a phase space for which the scalar-field initial data on null infinity have compact support, while the gauge-field initial data admit an asymptotic expansion with inverse-power tails in retarded (advanced) time, which we refer to as initial-data tails. We identify three finite charges at the null infinities which are conserved under scattering. One is a renormalized version of the standard subleading soft charge. The second is a logarithmic charge which is the difference of the coefficients of the leading order tails at the future and past ends of null infinity. The third is a new charge that probes the average of the tail coefficients. We conjecture that the third charge is associated with a new class of large gauge transformations which diverge linearly in retarded time.", "url": "https://arxiv.org/abs/2608.02368", "type": "理论", "summary": "1. 该工作在闵氏时空无质量标量QED中研究U(1)规范场与带电标量场的次领头渐近荷，并引入具有逆幂尾部初值数据的相空间。\n2. 他们找到三种散射守恒的有限荷：重整化的标准次领头软荷、由未来与过去零无穷远端部系数差决定的对数荷，以及探测尾部系数平均值的新荷。\n3. 他们猜想第三种荷对应一类随时间线性发散的大规范变换，为渐近对称与软定理研究提供了新线索。", "summary_source": "deepseek", "authors": [{"name": "Éanna É. Flanagan"}, {"name": "Zhihan Liu"}], "featured_authors": [{"name": "Éanna É. Flanagan"}, {"name": "Zhihan Liu"}], "author_count": 2}, {"id": "2608.02447", "category": "hep-th", "title": "Rank matching in renormalization-group irreversibility: Exact defect and entropic tests", "abstract": "Why do local subtractions produce renormalization-group monotones in some settings but fail in others? We propose rank matching. Local counterterms fix how many scale derivatives scheme independence requires. Every derivative adds one connected insertion, while the available positivity inputs are bilinear forms or positive second variations and therefore control only quadratic data. Degree one is the last subtraction whose scale derivative stays within their direct reach. First-order subtractions can close whe
