  <style>
    :root {

    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);

    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;

    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }

    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }

    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }

    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }

  </style>

  <script>
    const papers = [{"id": "2608.00002", "category": "cond-mat", "title": "Prismatic Soft Cubes", "abstract": "Soft cells are shapes without sharp corners that can fill the space without gaps and overlaps [2]. A sharp corner is a point on the surface of the solid through which no smooth curve passes. In the paper introducing the concept of soft cells [2], the authors proved that there exists an algorithm that can soften tilings consisting of convex polyhedra, preserving the lattice points and combinatorial structure of the original tiling. Although the algorithm guarantees (with a few restrictions) that there exists a soft tiling that is combinatorially equivalent to the convex polyhedral tiling, the proof does not address how to find all such tilings. For a polyhedral tiling based on a truncated octahedral cell, paper [3] shows how to find all soft tilings for a fixed symmetry group. In this paper, we extend this method and apply it to the cubic lattice, imposing only natural conditions, rather than symmetry constraints. The natural conditions being, the directions of edge half-tangents of the tiling are restricted to lattice directions, and the edges of the tiling are planar. This results in 26 soft cubic cells with different geometries. A total of 68 fundamental domains can be created from the cells, which can be classified into 8 groups based on their lattice symmetry. The paper also presents an algorithmic process (with a corresponding program in language Python) for classifying the 26 non-equivalent geometric cell types.", "url": "https://arxiv.org/abs/2608.00002", "type": "理论+数值", "summary": "1. 该工作将软胞元（无尖角且可无缝隙填充空间）的完整分类方法推广到立方晶格，仅施加边半切线沿晶格方向以及棱边为平面等自然条件，而非对称性约束，从而得到26种不同几何的软立方体胞元。\n2. 其技术卖点在于系统枚举并自动分类这些软立方体：由它们可生成68个基本域，按晶格对称性归为8组，并提供了相应的Python算法程序完成几何类型的判别。\n3. 这一工作为其他凸多面体软化的全分类提供了可推广的计算途径，对无尖角空间填充结构的设计和晶格几何研究具有直接参考价值。", "summary_source": "deepseek", "authors": [{"name": "Kinga Kocsis"}], "featured_authors": [{"name": "Kinga Kocsis"}], "author_count": 1}, {"id": "2608.00032", "category": "cond-mat", "title": "Static compliance and directional instability in indefinite conformation states", "abstract": "A conformation tensor is positive definite for every physically realizable polymer microstructural state. Numerical discretization can move the conformation tensor outside the positive-definite domain. This raises a question: can the least eigenvalue alone identify the first unstable direction? We answer it by linearizing Oldroyd-B, equilibrium-normalized FENE-P and Giesekus models about uniform frozen states. All include solvent viscosity and stress diffusion. We examine every non-zero planar Fourier mode, assuming each model's uncoupled constitutive tangent is strictly stable. The margin $1+r\\chi$ measures the balance between solvent damping and the zero-frequency polymer response. The complete velocity--conformation system is stable if and only if this margin is positive. At zero margin, a simple stationary root appears; finite inertia changes growth rates but not the neutral boundary. At fixed wavenumber and other parameters, decreasing $\\lambda_1$ identifies the first neutral direction. Oldroyd-B and equilibrium-normalized FENE-P first become neutral along principal directions; Giesekus mobility can instead make an oblique direction neutral first. For the reference case, onset is $\\lambda_{1,c}=-1.933$ at $\\theta_c=23.94^\\circ$, before the principal-axis prediction. Along this family, the all-direction threshold approaches $-2.319$ as the other principal stretch grows, whereas the formal principal-axis extrapolation tends to negative infinity. A rational-parameter counterexample, matrix spectra and uniform forced-base calculations test the neutral boundary and both sides. These results concern one linear, uniform, planar Fourier mode, not nonlinear or inhomogeneous-flow stability. Within this scope, onset depends not on indefiniteness alone but also on constitutive-tangent geometry and wavevector direction.", "url": "https://arxiv.org/abs/2608.00032", "type": "理论+数值", "summary": "1. 该工作将Oldroyd-B、平衡归一化FENE-P与Giesekus模型在均匀冻结构型附近线性化，逐一考察所有非零平面傅里叶模，回答最小特征值能否识别首选失稳方向。\n2. 核心发现是稳定性由溶剂阻尼与零频聚合物响应的余量1+rχ决定；最小特征值不足，Giesekus迁移可使斜向先失稳，而主轴向预测在参考点λ1,c=-1.933、θc=23.94°处失准。\n3. 这为数值模拟中构型非正定状态后的线性判据指出须结合本构切线几何与波矢方向，并为高维正则化或投影方案提供了可检验的基准。", "summary_source": "deepseek", "authors": [{"name": "Yuan Yu"}], "featured_authors": [{"name": "Yuan Yu"}], "author_count": 1}, {"id": "2608.00116", "category": "cond-mat", "title": "AC Field-driven orientational crossover and energy dissipation in suspended magnetic nanoparticles", "abstract": "By combining the Landau--Lifshitz--Gilbert equation with Brownian rotational dynamics of magnetic nanoparticles (MNPs), we theoretically investigate the role of particle rotation through easy-axis reorientation in magnetic fluid hyperthermia (MFH). Our results reveal a field-driven crossover in the stationary orientation of the easy axes, from predominantly perpendicular to predominantly parallel or antiparallel to the applied field as the field amplitude increases. Although the precise crossover field depends on particle size and excitation frequency, it occurs at approximately $0.5H_k$, where $H_k$ is the uniaxial anisotropy field. These orientational regimes are directly linked to the underlying microscopic dynamics and the associated MFH performance through the occurrence of switching and non-switching hysteresis cycles, predominantly associated with Néel magnetization reversal and Brownian particle rotation, respectively. The relative importance of these dissipation mechanisms also depends on frequency: at $f=1$ MHz, Brownian heating dominates at low field amplitudes, whereas Néel heating dominates at high fields. By contrast, at $f=100$ kHz, both contributions remain comparable over most of the investigated field range.", "url": "https://arxiv.org/abs/2608.00116", "type": "理论", "summary": "1. 该工作结合Landau-Lifshitz-Gilbert方程与布朗转动动力学，理论研究了悬浮磁纳米颗粒易轴取向重取向对磁流体热疗耗散的影响。\n2. 其核心发现是易轴稳态取向随场幅增加发生从垂直到场到平行/反平行的交叉，交叉场约为各向异性场H_k的一半，并区分了Néel翻转与布朗转动主导的滞回耗散机制。\n3. 这为通过调节场幅和频率选择加热机制提供了理论依据，并提示磁场参数可调控取向重排及热疗效率，有助于优化交变磁热疗方案。", "summary_source": "deepseek", "authors": [{"name": "Iago López-Vázquez"}, {"name": "Siraj Ul Haq"}, {"name": "Kazuya Okada"}, {"name": "Sergiu Ruta"}, {"name": "Roy W. Chantrell"}, {"name": "Òscar Iglesias"}, {"name": "David Serantes"}], "featured_authors": [{"name": "Iago López-Vázquez"}, {"name": "Siraj Ul Haq"}, {"name": "Kazuya Okada"}, {"name": "Roy W. Chantrell"}, {"name": "Òscar Iglesias"}, {"name": "David Serantes"}], "author_count": 7}, {"id": "2608.00131", "category": "cond-mat", "title": "Wrinkling of Randomly Heterogeneous Film-Substrate Systems", "abstract": "Wrinkling instabilities in stiff films on compliant substrates are strongly affected by spatial fluctuations in film stiffness. We develop a homogenized instability theory for one-dimensional film--substrate systems with random bending stiffness. The heterogeneous stability equation is reformulated as a Lippmann--Schwinger equation for the curvature field, and a strong-contrast expansion is derived using a local--nonlocal kernel decomposition and a cavity-field formulation. Truncation at third order yields an effective polarizability and a Dyson-type dispersion relation for predicting the critical load and wavenumber. The stiffness is modeled as an exponentially mapped Gaussian random field, allowing the required two- and three-point connected statistics to be obtained analytically. The theory is validated against generalized eigenvalue calculations and Fourier spectral simulations. Increasing stiffness contrast lowers the critical load and shifts the instability toward higher wavenumbers, producing shorter wrinkles. At weak contrast, the threshold follows the universal scaling $N_c^{(0)}-N_c\\sim\\varepsilon^2$, whereas at moderate and strong contrast the third-order approximation is more accurate than the second-order theory. Wavelength selection is controlled by the ratio of the dominant material wavelength $\\lambda^\\ast$ to the harmonic-mean reference wavelength $\\lambda_H$. For $\\lambda^\\ast/\\lambda_H<1$, the harmonic-mean model accurately predicts the wrinkle wavelength. The framework provides a mechanics-based tool for reliability assessment and design of statistically heterogeneous film--substrate systems.", "url": "https://arxiv.org/abs/2608.00131", "type": "理论+数值", "summary": "1. 该工作针对弯曲刚度随机起伏的一维薄膜-基底系统，提出均匀化失稳理论，给出临界载荷与临界波数的解析预测。\n2. 其核心是将异质稳定性方程改写为曲率场的Lippmann-Schwinger方程，经局域-非局域核分解与腔场方法做三阶强对比展开，获得有效极化率及Dyson型色散关系，并利用指数映射高斯随机场解析得到二、三点关联统计。\n3. 结果表明刚度反差增强将降低临界载荷并转向短波褶皱，弱反差下阈值满足N_c^(0)-N_c~ε^2，波长选择取决于λ*/λ_H；该框架可用于统计异质膜-基底系统的可靠性与设计。", "summary_source": "deepseek", "authors": [{"name": "Xinyu Xing"}, {"name": "Liyu Zhong"}, {"name": "Feng Deng"}, {"name": "Sheng Mao"}], "featured_authors": [{"name": "Xinyu Xing"}, {"name": "Liyu Zhong"}, {"name": "Feng Deng"}, {"name": "Sheng Mao"}], "author_count": 4}, {"id": "2608.00157", "category": "cond-mat", "title": "An asymptotically solvable model of many-body critical phases: mobility edges, scars, and inverted scars", "abstract": "While the prethermal regime of random many-body localized (MBL) systems is dominated by accidental many-body resonances, another class of resonances, originating from the underlying potential structure, is expected in large-size deterministic systems. It is known that this class of resonances can lead to single-particle critical phases that are neither localized nor extended, but the consequences in interacting systems remain unclear. In this work, we construct an asymptotically solvable model of a one-dimensional nearest-neighbor interacting spin chain, whose spatial structure induces a hierarchy of mirror-like many-body resonances. We derive two phases in the thermodynamic limit, characterized by the satisfaction and violation of a version of the weak eigenstate thermalization hypothesis (ETH). While these two phases are similar to the usual MBL and ETH phases, there exist rare eigenstates that behave like the opposite phase, interpreted as many-body scars and inverted scars. Surprisingly, the two phases can be separated by a finite-temperature phase transition, corresponding to a thermodynamic many-body mobility edge, which was often believed to be impossible. Our results also suggest the existence of delocalized rare regions in an otherwise-localized interacting Aubry-André model, even if there are no low-disorder regions like those in random systems. This challenges the common belief that there is no avalanche instability in quasiperiodic MBL.", "url": "https://arxiv.org/abs/2608.00157", "type": "理论", "summary": "1. 本文构建了一维近邻相互作用自旋链的可渐近求解模型，其空间结构产生镜式多体共振等级，并推导热力学极限下的两个相。\n2. 技术要点在于用弱本征态热化假说的成立与破坏刻画相，并揭示与通常相相反的罕见本征态作为多体疤痕与倒置疤痕，伴随有限温度多体迁移率边相变。\n3. 该结果暗示准周期安德烈模型的局域相内部可存在非局域稀有区域，提示无需随机无序也可发生雪崩失稳，挑战现有多体局域化图景。", "summary_source": "deepseek", "authors": [{"name": "Yi-Ting Tu"}, {"name": "Zi-Jian Li"}, {"name": "Sankar Das Sarma"}], "featured_authors": [{"name": "Yi-Ting Tu"}, {"name": "Zi-Jian Li"}, {"name": "Sankar Das Sarma"}], "author_count": 3}, {"id": "2608.00210", "category": "cond-mat", "title": "Chiral Magnon Mixing by Symmetry-Breaking in Collinear Ferrimagnets", "abstract": "Magnons in ferromagnets possess spin angular momentum defined by right-handed precession of the moment around the magnetization direction. In antiferromagnets with no net magnetization, left-and right-handed magnons are degenerate in the absence of an applied field. Ferrimagnets possess uncompensated magnetic sublattices, which should natively possess right-and left-handed magnons where their energy is split by the internal molecular field. Here, we show that RMn6Sn6 (R = Tb, Er) ferrimagnets possess right and left-handed magnon bands that cross at finite momentum (k) within the basal plane, defining modes with opposite dynamical chirality. Depending on the symmetry of the ferrimagnetic order, which may be manipulated by varying the rare-earth magnetic anisotropy or with applied field, the band crossing may remain a nodal line or may be gapped. The gapped modes contain hybridized chiral excitations whose chirality becomes k-dependent.", "url": "https://arxiv.org/abs/2608.00210", "type": "理论", "summary": "1. 该工作研究RMn6Sn6（R=Tb,Er）共线亚铁磁体中左右手磁振子能带在基面有限动量处的交叉及对称性破缺对其的调控。\n2. 其要点是，内部分子场使相反手性磁振子能量劈裂，交叉模可随稀土磁各向异性或外场调节的磁序对称性保持为节线或打开能隙，从而形成手性依赖动量的杂化激发。\n3. 这为利用亚铁磁体的磁对称性工程调控手性磁振子色散，并探索手性输运或拓扑磁性现象提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Dhurba R. Jaishi"}, {"name": "Tyler J. Slade"}, {"name": "S. X. M. Riberolles"}, {"name": "Bing Li"}, {"name": "Tianxiong Han"}, {"name": "D. M. Pajerowski"}, {"name": "D. L. Abernathy"}, {"name": "Barry Winn"}, {"name": "Melissa Graves-Brook"}, {"name": "B. G. Ueland"}, {"name": "R. J. McQueeney"}], "featured_authors": [{"name": "Dhurba R. Jaishi"}, {"name": "Tyler J. Slade"}, {"name": "S. X. M. Riberolles"}, {"name": "Melissa Graves-Brook"}, {"name": "B. G. Ueland"}, {"name": "R. J. McQueeney"}], "author_count": 11}, {"id": "2608.00226", "category": "cond-mat", "title": "Analytical Charge Density Profile of Vortex Core in Weak-Coupling Superconductor", "abstract": "Self-consistent Bogoliubov-de Gennes calculations have long shown that solving the Poisson equation inside a superconducting vortex turns a one-signed charge depletion into a modulation that alternates in sign with period $\\pi/k_F$. We give an elementary account of that result. Taking the Caroli-de Gennes-Matricon bound states in a step-like gap, we show that the normalization of the bound-state spinor is nearly independent of angular momentum, which collapses the mode sum into closed form. Inside the core the vortex winding removes one Bessel channel from a completeness sum, so the density vanishes on the vortex line and carries Friedel-like oscillations of wavevector $2k_F$; outside it the sum gives a $1/r$ envelope decaying over a coherence length, with a residual ripple. The bound-state charge does not integrate to zero, so neutrality obliges the extended states to compensate it exactly. That compensation is complete at long wavelength but fails at the diameter of the Fermi circle, and what survives is a sign-alternating $2k_F$ modulation reduced only by $4k_F^2/(4k_F^2+k_{TF}^2)$, a factor lying between one-half and three-quarters for any metal. The oscillation is therefore not a delicate effect but a consequence of neutrality and the inefficiency of screening at large momentum transfer: in the screened total the smooth terms cancel and only the ripple is left.", "url": "https://arxiv.org/abs/2608.00226", "type": "理论+数值", "summary": "1. 该工作给出了弱耦合超导体涡旋芯区电荷密度的解析表达式，解释了自洽Bogoliubov-de Gennes计算中符号交替的密度调制。\n2. 运用卡洛利–德热纳–马特里孔束缚态的自旋量归一化近似，模式求和化为闭式；由电中性要求，扩展态精确补偿束缚态电荷，但大动量转移屏蔽低效，仅留下按2k_F振荡的残余密度。\n3. 该结果说明此类2k_F调制是中性条件与屏蔽失效的必然结果而非精细效应，为涡旋芯局域电子结构的理论分析提供了简洁可靠的基础。", "summary_source": "deepseek", "authors": [{"name": "Chi-Ken Lu"}], "featured_authors": [{"name": "Chi-Ken Lu"}], "author_count": 1}, {"id": "2608.00390", "category": "cond-mat", "title": "Skyrmion Excitations in the $ν=-1$ Quantum Hall state in Monolayer Graphene", "abstract": "We investigate the skyrmion excited states atop the $SU(4)$ quantum Hall ferromagnetic ground state at filling factor $\\nu=-1$ in monolayer graphene. The competition among short-range anisotropic interactions, the Zeeman coupling, and sublattice symmetry-breaking potential gives rise to four distinct spin-valley-ordered ground-state phases. Combining effective field theory with the Hartree--Fock approximation, we develop a variational framework that incorporates both the long-range Coulomb interaction and the symmetry-breaking terms on an equal footing. Variational minimization determines the optimal skyrmion texture, including both its spatial radial profile and internal $SU(4)$ spinor structure. We establish the phase diagram of skyrmion excitations, identify thirteen distinct skyrmion phases under different external-field conditions, and determine their spin-valley textures, energies, and characteristic sizes. The robustness of the results against different radial ansätze demonstrates the reliability of our variational approach. Our work provides a systematic framework for studying skyrmion excitations in multicomponent quantum Hall ferromagnets and can be naturally extended to more general $SU(4)$ quantum Hall systems.", "url": "https://arxiv.org/abs/2608.00390", "type": "理论+数值", "summary": "1. 该工作研究单层石墨烯ν=-1填充因子下SU(4)量子霍尔铁磁基态上的斯格明子激发，并提出了结合有效场论与Hartree-Fock近似的变分框架。\n2. 其物理学特色是同等处理长程库仑相互作用与短程各向异性、塞曼耦合和子晶格对称破缺项，通过变分极小化确定斯格明子的空间径向轮廓及内部SU(4)旋量结构。\n3. 该框架识别出十三种不同外场条件下的斯格明子相，给出其自旋-谷纹理、能量与特征尺寸，并可自然推广到更一般的SU(4)量子霍尔系统，为多分量量子霍尔铁磁体激发研究提供系统路径。", "summary_source": "deepseek", "authors": [{"name": "Jincheng An"}, {"name": "Ajit C. Balram"}, {"name": "Ganpathy Murthy"}], "featured_authors": [{"name": "Jincheng An"}, {"name": "Ajit C. Balram"}, {"name": "Ganpathy Murthy"}], "author_count": 3}, {"id": "2608.00593", "category": "cond-mat", "title": "Uncertainty-guided active learning for surrogate prediction of stream-finishing wear fields", "abstract": "In stream finishing, the wear experienced by a workpiece depends strongly on its orientation within the rotating abrasive media. Determining suitable orientations to achieve uniform wear requires evaluating the wear-rate field over all feasible orientations. Although the discrete element method (DEM) accurately resolves particle interactions, simulating hundreds of feasible orientations for a new geometry is computationally expensive. We present an uncertainty-guided surrogate framework that predicts, directly from geometry, the three fields governing erosion: per-triangle normal impact velocity, tangential impact velocity, and particle impact flux. These fields are combined through the Finnie wear model to reconstruct the wear-rate distribution. The surrogate employs a deep ensemble whose disagreement estimates epistemic uncertainty, enabling an active-learning strategy that selectively performs DEM simulations for the most uncertain orientations. Trained using only $13\\%$ of the $696$ feasible orientations, the surrogate achieves Spearman rank correlations of $0.93$, $0.89$, and $0.93$ for the normal impact velocity, tangential impact velocity, and particle impact flux, respectively. Moreover, the predicted uncertainty is well calibrated, reliably anticipating prediction error and the fidelity of the reconstructed wear field, which matches DEM with a Spearman rank correlation of up to $0.97$ for low-uncertainty orientations and degrades in a controlled manner as uncertainty increases.", "url": "https://arxiv.org/abs/2608.00593", "type": "理论+数值", "summary": "1. 该工作提出不确定度引导的主动学习代理模型，直接由几何预测控制冲刷磨损的三个场。\n2. 卖点在于用深度集成估计认知不确定度，仅对最不确定姿态运行DEM，以13%数据达到约0.9的斯皮尔曼相关。\n3. 这为面向均匀磨损的工件取向优化提供高效代理路径，也可推广至其他高代价离散元或数值仿真场景。", "summary_source": "deepseek", "authors": [{"name": "Anand Kumar"}, {"name": "Puli Saikiran"}, {"name": "Vineet Dawara"}, {"name": "Koushik Viswanathan"}], "featured_authors": [{"name": "Anand Kumar"}, {"name": "Puli Saikiran"}, {"name": "Vineet Dawara"}, {"name": "Koushik Viswanathan"}], "author_count": 4}, {"id": "2608.00597", "category": "cond-mat", "title": "Confinement-Induced Optimization of Fluctuation-Induced Forces in Active Fluids", "abstract": "Active matter generates nonequilibrium fluctuations that mediate effective interactions between immersed objects. While fluctuation-induced (FI) forces in active fluids depend on activity, density, and geometry, their dependence on confinement remains poorly understood. We study FI forces between fixed intruders in two-dimensional active fluids composed of self-propelled circular or rodlike particles using Langevin dynamics simulations. We find that the FI force exhibits a pronounced nonmonotonic dependence on intruder separation, reaching a maximum at an optimal gap size well beyond the depletion regime, in contrast to the commonly assumed monotonic decay. This optimal confinement is robust across parameters and is more pronounced for elongated particles. The effect arises from a confinement-controlled balance between particle transport and crowding: narrow gaps hinder exchange between inner and outer regions, whereas large separations effectively decouple the intruders. At intermediate distances, enhanced crowding around the intruders generates maximal collision-rate asymmetries, leading to the strongest effective interactions. These results identify confinement geometry as a key control parameter for FI forces in active matter.", "url": "https://arxiv.org/abs/2608.00597", "type": "理论+数值", "summary": "1. 该工作通过朗之万动力学模拟，研究二维活性流体中固定侵入体间的涨落诱导力，发现其随间距呈强非单调变化。\n2. 其核心在于揭示最佳间隙源于粒子输运与拥挤间的受限平衡，且该效应在棒状粒子中更为显著，突破常规单调衰减认识。\n3. 这确立了受限几何作为活性物质涨落诱导力关键控制参数的地位，为主动流体中力调控与微纳器件设计提供新方向。", "summary_source": "deepseek", "authors": [{"name": "Reza Shaebani"}, {"name": "Hashem Fatemi"}, {"name": "Hamidreza Khalilian"}, {"name": "Jalal Sarabadani"}], "featured_authors": [{"name": "Reza Shaebani"}, {"name": "Hashem Fatemi"}, {"name": "Hamidreza Khalilian"}, {"name": "Jalal Sarabadani"}], "author_count": 4}, {"id": "2608.00707", "category": "cond-mat", "title": "Conditional grain-graph diffusion for property-guided inverse design of polycrystalline microstructures", "abstract": "Graph representations compactly encode polycrystalline microstructures while retaining grain topology and grain boundary information. We present a conditional graph diffusion framework for property-guided inverse design of dual-phase Ti-6Al-4V microstructures. An enhanced grain graph neural network (GNN) with grain boundary edge features, learnable node and edge embeddings, and multi-statistic pooling serves as a forward surrogate for stress prediction and candidate evaluation. The conditional diffusion model generates candidates through reverse diffusion under prescribed {\\alpha}-phase volume fraction, elastic modulus, and yield-stress proxy targets. Across four target regimes and independently seeded starting sets, generated candidates consistently approach the prescribed properties, including a target outside the property envelope of the existing microstructures. Local crystallographic consistency is evaluated post-generation from deviations from the Burgers orientation relationship (BOR). BOR-aware ranking increases mean BOR consistency by up to 44.9% and 56.4% for the in- and out-of-envelope targets, respectively, while maintaining property alignment. Finite element validation of the five best candidates in each primary design case yields a maximum absolute relative error of 1.0% in their mean properties. In a representative benchmark, diffusion requires 32 candidate evaluations per input graph, compared with approximately 40,000 for random search and evolutionary optimization, and reduces runtime by approximately two orders of magnitude in the tested implementations. These results establish conditional grain-graph diffusion as an efficient framework for property-guided polycrystalline microstructure design.", "url": "https://arxiv.org/abs/2608.00707", "type": "理论+数值", "summary": "1. 该工作提出基于条件晶粒图扩散的逆向设计框架，用于面向性能的双相Ti-6Al-4V多晶组织生成。\n2. 其技术核心是带晶界边特征与多统计池化的增强图神经网络代理模型，并结合BOR一致性排序，使目标属性与晶体学一致性同时受控。\n3. 该方法仅需32次候选评估即逼近目标性能，较随机搜索与进化优化快约两个数量级，为多晶微结构高效按需设计提供了可行范式。", "summary_source": "deepseek", "authors": [{"name": "Yuheng Zhou"}, {"name": "Xiao Shang"}, {"name": "Huicong Chen"}, {"name": "Yu Zou"}], "featured_authors": [{"name": "Yuheng Zhou"}, {"name": "Xiao Shang"}, {"name": "Huicong Chen"}, {"name": "Yu Zou"}], "author_count": 4}, {"id": "2608.00773", "category": "cond-mat", "title": "A Large-scale Parallel Implementation of Quasi-Four-Component Relativistic Density Functional Theory with Numeric Atom-centered Orbitals", "abstract": "We present a large-scale parallel implementation of fully relativistic density functional theory (DFT) for both molecules and periodic solids, using the quasi-four-component (Q4C) method and numeric atom-centered orbital basis sets. Our approach employs a domain decomposition method on nonuniform real-space integration grids, which enables order-N integration of the Q4C Hamiltonian matrix elements using efficient, distributed-memory and compute-parallel real-space operations. Next, we build the Hamiltonian and overlap matrices in a two-dimensional block-cyclic distribution layout. The resulting generalized eigenvalue problems are solved with the massively parallel ELPA eigenvalue solver library. We benchmark memory usage, parallel efficiency, and scalability across multiple MPI tasks and compute nodes. This algorithm extends the reach of fully relativistic DFT simulations for periodic solids, tested up to 3,383 atoms per unit cell (216,628 basis functions) and likely still well below the true reach of the implementation. As a demonstration, we calculate the fully relativistic band structure for a 3,383 atom-per-unit-cell doped hybrid organic-inorganic perovskite, (PEA)2(Pb1-xBix)I4 (PEA=phenethylammonium), showing nearly ideal scalability between 336 and 672 physical CPU cores.", "url": "https://arxiv.org/abs/2608.00773", "type": "理论+数值", "summary": "1. 该工作实现了基于数值原子轨道基组与准四分量相对论密度泛函理论的大规模并行算法，适用于分子和周期体系。\n2. 其核心是对非均匀实空间网格进行区域分解，从而近线性标度地积分哈密顿矩阵元，并采用分块循环矩阵分布配合ELPA库求解本征问题，完成单胞3383原子、216628基函数的计算。\n3. 该实现表现出近理想的并行可扩展性，为掺杂杂化钙钛矿等超大周期性体系的全相对论电子结构研究提供了切实可行的计算途径。", "summary_source": "deepseek", "authors": [{"name": "Wentao Zhang"}, {"name": "Rundong Zhao"}, {"name": "Volker Blum"}], "featured_authors": [{"name": "Wentao Zhang"}, {"name": "Rundong Zhao"}, {"name": "Volker Blum"}], "author_count": 3}, {"id": "2608.00777", "category": "cond-mat", "title": "Magnetoelastic control of quantum correlations and field sensitivity in a spin-1/2 Heisenberg dimer", "abstract": "We investigate the thermodynamic and quantum properties of a magnetoelastic spin-1/2 Heisenberg dimer, where the exchange interaction depends on the dimer displacement. By combining an exact treatment of the spin sector with a harmonic description of the vibrational degree of freedom, we obtain an effective model in which each spin configuration is associated with a distinct vibrational mode, leading to a non-factorizable partition function. We analyze the thermal behavior and identify regimes corresponding to entangled and fully polarized states. Quantum correlations are analyzed through concurrence and local quantum uncertainty, showing that while entanglement is rapidly suppressed by temperature, nonclassical correlations persist over a broader range due to the competition between spin sectors. We further examine the magnetic Fisher information, which provides a measure of the sensitivity of the system to the external magnetic field. Its behavior reveals enhanced response in crossover regions where magnetoelastic effects induce strong redistribution of the level populations. Our results demonstrate that magnetoelastic coupling plays a central role in controlling both quantum correlations and magnetic response, establishing a direct link between entanglement, nonclassical correlations, and thermodynamic sensitivity in coupled spin-dimer systems.", "url": "https://arxiv.org/abs/2608.00777", "type": "理论", "summary": "1. 该文研究自旋1/2海森伯二聚体中磁弹性耦合对量子关联与磁场灵敏度的热力学调控。\n2. 其卖点在于精确求解自旋并谐波化振动自由度，得到不可因子化配分函数，并发现在能级重排区Fisher信息响应增强。\n3. 这建立了纠缠、非经典关联与热力学灵敏度间的直接联系，为耦合自旋二聚体量子度量应用提供了启示。", "summary_source": "deepseek", "authors": [{"name": "E. W. B. de Souza"}, {"name": "Moises Rojas"}, {"name": "Onofre Rojas"}], "featured_authors": [{"name": "E. W. B. de Souza"}, {"name": "Moises Rojas"}, {"name": "Onofre Rojas"}], "author_count": 3}, {"id": "2608.00849", "category": "cond-mat", "title": "Spin Quantum Hall Effect: the Critical Exponents", "abstract": "The spin quantum Hall effect (SQHE) provides one of the few examples of an Anderson localization transition for which exact critical exponents are known, making it an important testing ground for theories of disordered topological systems and conformal field theory. The corresponding network model, obtained by replacing the random $U(1)$ phases of the Chalker--Coddington model with random $SU(2)$ matrices, belongs to symmetry class C of the Altland--Zirnbauer classification and is believed to describe quasiparticle transport in two-dimensional disordered superconductors with broken time-reversal symmetry. In this work, we perform high-precision numerical calculations of the localization-length exponent ($\\nu$) and the boundary critical exponent ($\\mu$) for the SQHE network model using the recently developed $S$-matrix approach to random networks.", "url": "https://arxiv.org/abs/2608.00849", "type": "理论+数值", "summary": "1. 该论文利用近期发展的随机网络S矩阵方法，对自旋量子霍尔效应网络模型进行了高精度数值计算，提取局域化长度临界指数ν与边界临界指数μ。\n2. 技术卖点在于将无规SU(2)相位网络归入Altland-Zirnbauer C类，以精确数值结果检验无序超导体中时间反演破缺系统的临界行为与共形场论预言。\n3. 这为二维破缺时间反演超导体的无序量子相变和拓扑边界性质提供了可靠基准，也有助于厘清SQHE作为已知精确临界指数范例的地位。", "summary_source": "deepseek", "authors": [{"name": "Hrant Topchyan"}, {"name": "Win Nuding"}, {"name": "Andreas Klümper"}, {"name": "Ara Sedrakyan"}], "featured_authors": [{"name": "Hrant Topchyan"}, {"name": "Win Nuding"}, {"name": "Andreas Klümper"}, {"name": "Ara Sedrakyan"}], "author_count": 4}, {"id": "2608.00942", "category": "cond-mat", "title": "Evidence for superconductivity at 190 K in a pressure-overdoped cuprate", "abstract": "It is well established that the critical temperature ($T_c$) of cuprate superconductors can be tuned by pressure. For example, compression decouples the hole doping from chemical doping allowing for overdoped samples far beyond what is possible at ambient pressure. In this work, multiple techniques are used to probe the onset of the Meissner effect at $T_c$ as a function of pressure in $\\mathrm{Pb_{0.4}Bi_{1.6}Sr_2Ca_2Cu_3O_{10+\\delta}}$ (Bi-2223) to 60 GPa in different compression environments. Samples compressed under quasihydrostatic conditions exhibit a distinctive non-monotonic pressure dependence of $T_c$ below 25 GPa, in agreement with previous reports. With further increase in pressure $T_c$ climbs continuously to 190 K at 60 GPa. Evidence for critical temperatures exceeding those reported to date for cuprates at ambient and high pressures, the results may be understood in terms of the proposed second superconducting regime at high hole doping.", "url": "https://arxiv.org/abs/2608.00942", "type": "理论", "summary": "1. 该工作在不同的压缩环境中对Bi-2223铜氧化物施加准静水压至60 GPa，并利用多种探测手段系统测量了超导临界温度Tc随压力的演化。\n2. 核心发现在于Tc在25 GPa以下呈非单调压力依赖，随后持续升高，至60 GPa时达到190 K，显著超过迄今报道的铜氧化物常压与高压超导转变温度。\n3. 这为高空穴掺杂区存在第二个超导态区域的提议提供了直接证据，对理解铜氧化物配对机制及高压超导探索方向具有明确启示。", "summary_source": "deepseek", "authors": [{"name": "Alexander C. Mark"}, {"name": "Huu T. Do"}, {"name": "David Rodriguez"}, {"name": "D. Gonzalez Arevalo"}, {"name": "Adam Denchfield"}, {"name": "Eduardo H.T. Poldi"}, {"name": "Daniel P. Phelan"}, {"name": "N. K. Man"}, {"name": "Rssell J. Hemley"}], "featured_authors": [{"name": "Alexander C. Mark"}, {"name": "Huu T. Do"}, {"name": "David Rodriguez"}, {"name": "Daniel P. Phelan"}, {"name": "N. K. Man"}, {"name": "Rssell J. Hemley"}], "author_count": 9}, {"id": "2608.00948", "category": "cond-mat", "title": "Spin-chirality-driven nonrelativistic Edelstein effects in two-dimensional antiferromagnets", "abstract": "Charge current-induced magnetic moment accumulation-Edelstein effect has been extensively attracting attention for its promising applications in spintronics. While most prior works focus on the spin-orbit coupling (SOC) induced Edelstein responses that rely on the presence of heavy elements, the nonrelativistic Edelstein effect (in the absence of SOC) that could be applied in a broader material family has been largely unexplored. Here, we perform a combined group-theoretical and ab initio numerical simulation study to show that vector spin chirality could serve as an effective control parameter of nonrelativistic Edelstein responses in antiferromagnetic system. In addition to spin degree of freedom, we also explore the orbital angular momentum contributions to current-induced magnetic moments (dubbed orbital Edelstein effect), which obey distinct symmetry constraints from the spin counterpart. Microscopically, vector spin chirality k gives rise to electronic and Zeeman-like band-geometric quantities, such as the anomalous spin/orbital polarizability and the Berry connection polarizability, which govern the nonrelativistic Edelstein responses. Our work identifies vector spin chirality as a key magnetic order parameter to enable and tune nonrelativistic Edelstein effects, and uncovers a new route toward electrically controlling magnetization without relying on SOC effect.", "url": "https://arxiv.org/abs/2608.00948", "type": "理论+数值", "summary": "1. 该工作结合群论分析与第一性原理模拟，研究了二维反铁磁体中由矢量自旋手性驱动的非相对论Edelstein效应。\n2. 其要点在于证明矢量自旋手性可作为无自旋轨道耦合条件下自旋与轨道Edelstein响应的共同控制参量，两者受不同对称约束，微观上源于类塞曼能带几何量与Berry联络极化率。\n3. 这为无需重元素或自旋轨道耦合即可实现电流诱导磁化调控提供了新机制，并拓展至更广泛的反铁磁自旋电子学材料体系。", "summary_source": "deepseek", "authors": [{"name": "Hao Zuo"}, {"name": "Xiaoyin Li"}, {"name": "Jian Zhou"}], "featured_authors": [{"name": "Hao Zuo"}, {"name": "Xiaoyin Li"}, {"name": "Jian Zhou"}], "author_count": 3}, {"id": "2608.01016", "category": "cond-mat", "title": "Predictive Formulas for Scattering Mean Free Path for General Disordered Dielectric Media Beyond the Long-Wavelength Regime", "abstract": "We derive predictive formulas for the scattering mean free path $\\ell_s$ of statistically homogeneous two-phase dielectric media in dimensions $d=1,2,3$. Unlike Mie-based estimates limited to identical circular or spherical scatterers, the formulas apply to arbitrarily shaped and polydisperse particulate media as well as nonparticulate media, with microstructure entering through the spectral density. The formulas are based on the exact strong-contrast expansion for the effective dynamic dielectric constant. We apply them to five nonhyperuniform and hyperuniform models and validate selected cases using finite-difference time-domain simulations. For $k_1/s \\lesssim 1$, where $k_1$ is the incident wavenumber and $s$ is the specific surface, the predictions agree well with simulations and are consistent with Mie theory where applicable, while improving accuracy for two-dimensional transverse-magnetic polarization. Mie estimates become more accurate for $k_1/s \\gtrsim 1$. For hyperuniform media with $\\widetilde{\\chi}_V(k)\\sim k^\\alpha$ at small $k$, the theory predicts $\\ell_s\\sim k_1^{-(d+1+\\alpha)}$; stealthy hyperuniform media are transparent over a finite wavenumber interval. These results provide a microstructure-based route to predict and design wave transport in general disordered dielectric materials.", "url": "https://arxiv.org/abs/2608.01016", "type": "理论+数值", "summary": "1. 该工作推导了d=1,2,3维统计均匀两相介质中散射平均自由程的预测公式，适用于任意形状、多分散及非颗粒型无序介质。\n2. 其技术核心是基于动态有效介电常数的精确强对比展开，使微结构信息仅通过谱密度进入，并在k₁/s≲1区间优于Mie理论。\n3. 该公式为超均匀介质预言了ℓ_s∝k₁^{-(d+1+α)}的标度律，为设计宽频透明或可调控波输运的无序材料提供了微结构路线。", "summary_source": "deepseek", "authors": [{"name": "Jaeuk Kim"}, {"name": "Salvatore Torquato"}], "featured_authors": [{"name": "Jaeuk Kim"}, {"name": "Salvatore Torquato"}], "author_count": 2}, {"id": "2608.01162", "category": "cond-mat", "title": "From oligomers to entangled polymers: How to train a transferable machine learning interatomic potential", "abstract": "Over the past decade, Machine Learning Interatomic Potentials (MLIPs) have emerged as a powerful technique for performing molecular dynamics (MD) simulations with nearly ab initio accuracy. Alongside the development of new descriptors and advanced machine learning architectures, sophisticated procedures for the generation of diverse and accurate reference datasets have been established. To date, research has focused primarily on MLIPs for crystalline or amorphous inorganic and small molecular systems; however, large macromolecules such as polymers remain underrepresented in the literature, despite beeing an important class of materials. In this work, we investigate several aspects of developing MLIPs for polymers, utilizing polyethylene as a representative, yet simple model system. First, we compare various local atomic descriptors, identifying the Atomic Cluster Expansion (ACE) as the most effective for this application. Second, we implement and automatized active learning scheme to efficiently generate diverse training data and demonstrate that ACE potentials fitted on small oligomers are transferable to larger polymers. Given that the accurate reproduction of the density depends critically on a correct description of intermolecular interactions, which are far more complex to learn than intramolecular interactions, we carefully evaluate the performance of the ACE potentials with respect to non-bonded interactions. By utilizing the computationally efficient OPLS-AA force field as a ground truth reference, we are able to perform a direct comparison of nanosecond-scale MD trajectories resulting from the ACE and reference potential. We find that the ACE potential accurately reproduces key thermodynamic, structural and dynamical properties.", "url": "https://arxiv.org/abs/2608.01162", "type": "理论+数值", "summary": "1. 该工作以聚乙烯为模型体系，比较了多种局域原子描述符，并借助自动化的主动学习方案，训练出从小齐聚物迁移到大聚合物的ACE机器学习原子间势。\n2. 其技术核心在于以OPLS-AA力场为基准进行纳秒尺度分子动力学直接对比，重点检验非键相互作用，从而准确复现热力学、结构和动力学性质。\n3. 这为高分子体系机器学习势的构建与数据生成提供了可推广的基准方法，有望支撑纠缠聚合物等复杂体系的高精度模拟。", "summary_source": "deepseek", "authors": [{"name": "Mirko Fischer"}, {"name": "Andreas Heuer"}], "featured_authors": [{"name": "Mirko Fischer"}, {"name": "Andreas Heuer"}], "author_count": 2}, {"id": "2608.01235", "category": "cond-mat", "title": "Twist-induced magnetic topological phase transition in stacked altermagnetic CrO", "abstract": "Interlayer twisting offers a geometric route to controlling electronic states, but whether it can simultaneously reconstruct magnetic symmetry and band topology remains unclear. Here, based on symmetry analysis and first-principles calculations, we show that commensurate twisting drives magnetic topological phase transitions in stacked bilayer CrO. In particular, it transforms an antiferromagnetic Dirac semimetal into either a $d$-wave altermagnetic bipolarized Weyl semimetal or an unconventional compensated magnetic Weyl semimetal. A key result is that the Weyl points in the $d$-wave altermagnetic phase lie at generic $k$ points in the Brillouin zone and are protected by the spin symmetry $\\left\\{ C_2 T||C_{2z} T\\right\\}$. This sharply contrasts with conventional two-dimensional Weyl semimetals, where Weyl points are typically protected by mirror or rotational symmetries and thus pinned to high-symmetry lines. We further show that commensurate twisting preserves the spin symmetry $\\left\\{ C_2 T||C_{2z} T\\right\\}$, making the Weyl phase a robust consequence of twisting rather than a fine-tuned feature of a specific angle. Our work establishes a symmetry-based route to engineering magnetic topological phases in twisted two-dimensional materials.", "url": "https://arxiv.org/abs/2608.01235", "type": "理论+数值", "summary": "1. 该工作通过对称性分析与第一性原理计算，研究双层CrO中公度转角诱导的磁拓扑相变。\n2. 其核心发现在于转角使反铁磁狄拉克半金属转变为d波交错磁双极化外尔半金属或非常规补偿磁性外尔半金属，且外尔点由{C2T||C2zT}自旋对称性保护于一般k点。\n3. 该结果确立了利用转角重构磁对称性与能带拓扑的普适途径，为二维磁性材料拓扑工程提供了可扩展方案。", "summary_source": "deepseek", "authors": [{"name": "Zi-Hao Ding"}, {"name": "Ze-Feng Gao"}, {"name": "Xiang-Hua Kong"}, {"name": "Peng-Jie Guo"}, {"name": "Zhong-Yi Lu"}], "featured_authors": [{"name": "Zi-Hao Ding"}, {"name": "Ze-Feng Gao"}, {"name": "Xiang-Hua Kong"}, {"name": "Peng-Jie Guo"}, {"name": "Zhong-Yi Lu"}], "author_count": 5}, {"id": "2608.01280", "category": "cond-mat", "title": "Algorithmic overlaps in the Baxter-Wu model: cluster dynamics under Novotny-Evertz updates", "abstract": "We study the spatial overlap of successive spin configurations generated by Markov chain Monte Carlo simulations of the Baxter-Wu model. Using the Novotny-Evertz sublattice-freezing single-cluster update, we track the mean and variance of the algorithmic overlap across the critical region. We show that, even in this three-spin model, the overlap acts as an algorithmic observable that follows the thermodynamics of the transition: the single-cluster overlap mean behaves like an order parameter, dropping from a finite ordered-phase plateau toward zero across $T_c$. The overlap does not diverge at criticality, instead it remains finite and its finite-size value decays as a clean power law, $U_2(T_c)\\sim L^{-\\psi}$, over eleven sizes with an exponent $\\psi{=}0.378(4)$ smaller than the value $\\approx0.42$ found for the Ising and Potts models under standard Fortuin-Kasteleyn cluster dynamics, indicating that it reflects the Novotny-Evertz sublattice-freezing dynamics rather than any static property of the model.", "url": "https://arxiv.org/abs/2608.01280", "type": "理论+数值", "summary": "1. 该工作通过Novotny-Evertz子晶格冻结单簇更新，在Baxter-Wu模型临界区测量连续自旋构型之间的算法重叠的均值与方差。\n2. 其卖点在于发现单簇重叠均值在Tc处从有序相平台降至零，行为类似序参量；临界点重叠不发散，且有限尺寸值服从幂律衰减，指数ψ=0.378(4)小于Ising/Potts模型标准FK团簇动力学所得约0.42。\n3. 这表明该重叠对应Novotny-Evertz子晶格冻结动力学而非静态性质，可作为诊断蒙特卡洛更新机制与临界涨落耦合的灵敏算法可观测量。", "summary_source": "deepseek", "authors": [{"name": "Ian Pilé"}, {"name": "Lev Shchur"}], "featured_authors": [{"name": "Ian Pilé"}, {"name": "Lev Shchur"}], "author_count": 2}, {"id": "2608.01363", "category": "cond-mat", "title": "Quantum geometry and RKKY in flat bands", "abstract": "Flat conduction bands quench the group velocity and thus challenge conventional, dispersion-driven pictures of the Ruderman-Kittel-Kasuya-Yosida (RKKY) interaction, where localized moments are coupled via an effective exchange mediated by conduction electrons. Here we show that RKKY interactions in the flat-band limit are not extinguished by the vanishing group velocity but are instead mediated by the quantum geometry of Bloch states. Starting from a microscopic RKKY derivation, we demonstrate that the Brillouin-zone-averaged quantum metric controls the long-wavelength structure of the static susceptibility, thereby determining the magnetic correlation length and the spin stiffness. As a result, the finite spatial spread of Wannier functions provides an effective long-range coupling channel even when single-particle dispersion is absent. Furthermore, we establish the general principle that the ordering temperature is governed by the quantum metric in finite and low-dimensional samples, effectively circumventing the thermodynamic-limit constraint of the Mermin-Wagner theorem. Specifically, our theoretical investigation reveals that increasing the quantum metric enhances magnetic rigidity and leads to a corresponding rise in the critical temperature within finite-sized systems.", "url": "https://arxiv.org/abs/2608.01363", "type": "理论", "summary": "1. 该工作从微观推导出发，研究平带极限下RKKY交换作用，证明其并未因群速度消失而熄灭，而是由布洛赫态的量子几何主导。\n2. 核心在于揭示布里渊区平均量子度量决定静态磁化率的长波结构，进而控制磁关联长度与自旋刚度，使万尼尔函数的有限空间展宽成为无单粒子色散时的有效长程耦合通道。\n3. 这一原理表明有限与低维体系的有序温度受量子度量支配，可规避Mermin-Wagner热力学极限约束，且增大量子度量会增强磁刚性并提升临界温度。", "summary_source": "deepseek", "authors": [{"name": "Chang-geun Oh"}, {"name": "Makoto Shimizu"}, {"name": "Youichi Yanase"}, {"name": "Shuichi Murakami"}], "featured_authors": [{"name": "Chang-geun Oh"}, {"name": "Makoto Shimizu"}, {"name": "Youichi Yanase"}, {"name": "Shuichi Murakami"}], "author_count": 4}, {"id": "2608.01368", "category": "cond-mat", "title": "Bulk-Boundary Correspondence in Semi-Infinite Chains from Sublattice Zeros", "abstract": "We provide an alternative derivation of the bulk-boundary correspondence for semi-infinite chains. To describe edge states, we analytically continue the usual Bloch Hamiltonian to complex wave vectors $k$. To start, we note that the zeros of a Bloch wavefunction are related to edge states, at least in systems with nearest-neighbour hoppings. We show that an analytically continued Bloch Hamiltonian with chiral symmetry has exceptional points, where two different states coalesce. These special points are related to the adiabatic protection of edge states. We derive a winding number that counts the number of topological edge states protected by chiral symmetry.", "url": "https://arxiv.org/abs/2608.01368", "type": "理论", "summary": "1. 该工作针对最近邻跳跃的半无限链，提出从布洛赫波函数亚晶格零点出发，解析延拓体哈密顿量到复波矢，从而重新推导体-边对应关系。\n2. 其核心在于证明延拓后的手征对称哈密顿量具有例外点，这些例外点与边态的绝热保护相关，并导出可计入手征对称保护的拓扑边态数目的绕数定义。\n3. 这一方法绕过了传统布里渊区周期性的要求，为半无限或无平移不变性系统的拓扑边界对应提供了更直接的判据，也可望推广到更高维边界或含相互作用及无序的体系。", "summary_source": "deepseek", "authors": [{"name": "Ilya Iakoub"}, {"name": "Nicolas Levasseur"}, {"name": "Kylian Lionnet"}, {"name": "Richard MacKenzie"}], "featured_authors": [{"name": "Ilya Iakoub"}, {"name": "Nicolas Levasseur"}, {"name": "Kylian Lionnet"}, {"name": "Richard MacKenzie"}], "author_count": 4}, {"id": "2608.01487", "category": "cond-mat", "title": "Griffiths phase in clique percolation in random geometric graphs", "abstract": "In this study, we discuss the clique percolation in the ensembles of random geometric graphs with different kernels that quantify the geometrical constraints. For the sharp cut-off we find the wide Griffiths phase of extended criticality with the power-law behavior. One boundary of the Griffiths phase is the generalization of a percolation critical point for the ER ensemble when the percolation within the large but finite cluster emerges. The second boundary corresponds to the point in the parameter space when the percolation in the entire clustered system becomes available. For the power-law kernel, richer behavior with a clique-size-dependent boundary between the effective ER and geometric regimes has been identified. The Griffiths phase in this case exists as well. Finally, the pattern with the exponential kernel has been analyzed. We briefly discuss the possible applications of our findings.", "url": "https://arxiv.org/abs/2608.01487", "type": "理论", "summary": "1. 该文研究随机几何图系综中的团簇渗流，系统分析陡截断、幂律与指数三类核函数所对应几何约束的影响。\n2. 核心发现在陡截断核下存在宽Griffiths相与幂律扩展临界性，相边界由有限大团簇内类ER渗流涌现和整体团簇系统可渗流两个条件共同决定；幂律核则呈现团簇尺寸依赖的有效ER-几何区边界。\n3. 指数核模式亦被明确分析，这些结果拓展了经典渗流相图，可为受几何约束网络的团簇结构、鲁棒性与渗流临界行为研究提供理论参考。", "summary_source": "deepseek", "authors": [{"name": "Vasilii Tiselko"}, {"name": "Olga Valba"}, {"name": "Alexander Gorsky"}], "featured_authors": [{"name": "Vasilii Tiselko"}, {"name": "Olga Valba"}, {"name": "Alexander Gorsky"}], "author_count": 3}, {"id": "2608.01520", "category": "cond-mat", "title": "Reciprocal Skin Effect from Internal Rotation", "abstract": "We present a class of lattices in which an internal rotation---a conserved compact angular momentum in each unit cell---turns reciprocal couplings into a non-Hermitian skin effect. In each conserved channel, the rotation character makes the left- and right-going amplitudes unequal, so the channel localizes directionally while the full Hamiltonian remains reciprocal, with conjugate channels pinned to opposite boundaries. Every channel is exactly solvable and carries an integer point-gap winding: under exact channel conservation, the phases form $\\Z^{q}$, with one integer per conjugate channel pair, $q$ unbounded across multiplets, and $q=j+\\tfrac{1}{2}$ for half-integer spin $j$ in the symplectic class AII$^{\\dagger}$. Mixing conjugate channels collapses the grading to a critical, scale-free skin effect, with only the odd AII$^{\\dagger}$ $\\Z_{2}$ parity surviving. A cyclic three-site lattice and a passive lossy resonator array realize the effect.", "url": "https://arxiv.org/abs/2608.01520", "type": "理论", "summary": "1. 该工作提出一类由元胞内守恒紧致角动量（内转动）将互易耦合转化为非厄米趋肤效应的晶格模型。\n2. 每条守恒通道精确可解并携带整数点隙绕数，共轭通道分别钉扎于相对边界，形成Z^q体拓扑；混合共轭通道使分级塌缩为临界无标度趋肤效应。\n3. 该机制可由循环三格点晶格和无源损耗谐振子阵列实现，为在互易系统中实现定向局域化与拓扑边界态提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Kin Hung Fung"}, {"name": "C. T. Chan"}], "featured_authors": [{"name": "Kin Hung Fung"}, {"name": "C. T. Chan"}], "author_count": 2}, {"id": "2608.01582", "category": "cond-mat", "title": "LieStoNet: Learning Lie Symmetries from Spatiotemporal Data for Stochastic Dynamical Systems", "abstract": "Symmetry is central to modern machine learning and physics: invariances and equivariances improve sample efficiency, robustness, and out-of-distribution generalization, while symmetry principles guide scientific modeling. Yet for stochastic dynamical systems the relevant continuous symmetries are rarely known, and symmetry discovery for SDEs has remained essentially unexplored. We introduce \\textit{LieStoNet}, an end-to-end, \\emph{template-free} framework for discovering Lie-point symmetries of SDEs directly from spatiotemporal trajectories, without prespecifying symmetry groups, templates, or canonical coordinates. Building on the seminal SDE Lie-symmetry theory of Gaeta and Quintero (1999), which formalizes Lie-point SDE symmetries and their relation to Fokker-Planck symmetries, LieStoNet learns neural surrogates for drift and diffusion from increments, then learns projectable generators by enforcing the SDE determining equations, separately regularizing for closure under Lie brackets, adherence to the Lie algebra axioms (bilinearity, antisymmetry, Jacobi), and a non-redundant independent basis. The surrogate also defines an associated Fokker-Planck equation, enabling optional discovery of its Lie-point symmetries in parallel. Across multiple canonical SDEs with known analytic symmetries, LieStoNet recovers generators consistent with the ground-truth symmetry algebra, providing interpretable symmetry discovery for noisy dynamics. Code is available at \\href{ this https URL }{this link}.", "url": "https://arxiv.org/abs/2608.01582", "type": "理论+数值", "summary": "1. 该工作提出LieStoNet，一个无需预置对称群、模板或正则坐标的端到端框架，直接从随机动力系统的时空轨迹中学习SDE的李点对称生成元。\n2. 其核心在于用神经网络代理漂移与扩散增量，强制满足SDE决定方程，并分别正则化李括号封闭性、李代数公理及非冗余独立基，也允许并行发现对应Fokker-Planck方程的对称性。\n3. 这为噪声动力学中未知连续对称性的可解释数据驱动发现提供了通用方案，并有望改善随机系统的物理建模及机器学习的外推与样本效率。", "summary_source": "deepseek", "authors": [{"name": "Shida Liu"}, {"name": "Abhishek Gupta"}, {"name": "Sumit Sinha"}, {"name": "L. Mahadevan"}], "featured_authors": [{"name": "Shida Liu"}, {"name": "Abhishek Gupta"}, {"name": "Sumit Sinha"}, {"name": "L. Mahadevan"}], "author_count": 4}, {"id": "2608.01799", "category": "cond-mat", "title": "Impedance of an electric double layer capacitor with a multi-component electrolyte", "abstract": "I derive the impedance response of an ideal electrolyte containing an arbitrary number of mobile ionic species between blocking planar electrodes, described by the Poisson--Nernst--Planck equations. By transforming the linearized equations to a charge--salt basis, the response is written in terms of a multi-component diffusion--migration matrix and its eigenvalues/eigenvectors. When all diffusivities are equal, the charge mode decouples from the neutral concentration subspace and the classical binary-electrolyte result is recovered. In contrast, unequal diffusivities couple charge relaxation to one or more neutral composition modes. For a ternary electrolyte with two cations and one anion, this coupling produces additional diffusive features and broadens the crossover between resistive and capacitive regimes. The results found in this paper provide a minimal continuum explanation for why mixed electrolytes can display impedance spectra that cannot be interpreted as a simple binary electrolyte with an averaged diffusion coefficient.", "url": "https://arxiv.org/abs/2608.01799", "type": "理论", "summary": "1. 该工作推导了阻塞平板电极间含任意数目可移动离子物种的理想电解质双电层电容器的阻抗响应。\n2. 其卖点在于将线性化 PNP 方程变换至电荷-盐基，借助多组分扩散-迁移矩阵的本征分解揭示不等扩散系数下电荷弛豫与中性组分模的耦合。\n3. 这为混合电解质阻抗谱中无法用平均扩散系数的二元模型解释的附加扩散特征与阻容过渡展宽提供了最小连续介质解释。", "summary_source": "deepseek", "authors": [{"name": "David Fertig"}], "featured_authors": [{"name": "David Fertig"}], "author_count": 1}, {"id": "2608.01803", "category": "cond-mat", "title": "Fluid-structure coupling governs a dynamic transition in foam scraping", "abstract": "Foam scraping exhibits a dynamic transition between a slip state, in which the foam moves beneath a plate, and a scraping state, in which the foam is expelled from the confined region. Although this transition has been associated with the propagation of local T1 rearrangements, the physical parameter controlling their propagation remains unclear. Here, we investigate the dependence of the critical scraping velocity on the liquid fraction, bulk viscosity, and surfactant system. For all examined conditions, the critical capillary number follows $\\mathrm{Ca}_c\\propto\\phi^{-1}$, apart from a solution-dependent prefactor. We propose a local fluid--structure-coupling model in which viscous work transmitted through the Plateau-border network competes with the effective energetic cost required for one T1 event to trigger the next. The observed scaling implies an effective energetic cost governed by the Laplace pressure and is consistent with a small local compressive component of the bubble deformation. These results identify local coupling between interstitial flow and bubble deformation as a mechanism controlling the macroscopic slip--scraping transition.", "url": "https://arxiv.org/abs/2608.01803", "type": "理论", "summary": "1. 该工作实验研究了泡沫刮擦中动态转变的临界速度对液相分数、体相粘度和表面活性剂体系的依赖，发现临界毛细数满足 Ca_c ∝ φ^{-1}，仅前因子随体系变化。\n2. 其核心在于提出局部流固耦合模型：经 Plateau 边界网络传递的粘性功需超过触发相邻 T1 重排的有效能量代价，而标度表明该代价由 Laplace 压力主导且对应气泡形变的微小局部压缩分量。\n3. 这识别出间隙流动与气泡形变的局部耦合是控制宏观滑动-刮擦转变的机制，为泡沫加工与复杂界面流变研究提供明确方向。", "summary_source": "deepseek", "authors": [{"name": "Rei Kurita"}, {"name": "Masaya Endo"}], "featured_authors": [{"name": "Rei Kurita"}, {"name": "Masaya Endo"}], "author_count": 2}, {"id": "2608.01811", "category": "cond-mat", "title": "Universal Scaling of the Magnetocaloric Effect in 2D Ising Monolayers and Bilayer", "abstract": "We report a Monte Carlo study of the magnetocaloric effect (MCE) in two-dimensional ferromagnetic Ising models on square, honeycomb, and triangular lattices with monolayer and bilayer configurations. Using Binder cumulant analysis, we determine the critical temperature ($T_c$) of each structure and find that $T_c$ increases with coordination number, from the honeycomb ($r=3$) to the triangular ($r=6$) lattice. In contrast, the magnetic entropy change ($-\\Delta S_M$) decreases with coordination number, reaching its maximum for the honeycomb lattice. After normalization by their peak values and appropriate temperature scaling, both $-\\Delta S_M$ and the field exponent $n$ collapse onto universal master curves for different magnetic fields and across all six lattice structures at a fixed low field. This demonstrates universal MCE scaling independent of coordination number and layer count. Critical scaling analysis further supports the observed universality and power-law behavior. Unlike $-\\Delta S_M$, the adiabatic temperature change ($\\Delta T_{ad}$) increases with coordination number, whereas the magnetic Grüneisen parameter ($\\Gamma_M$) follows the same trend as $-\\Delta S_M$. Although the peak value of $-\\Delta S_M$ decreases with coordination number, the relative cooling power and cooling capacity remain nearly unchanged due to compensating broadening of the $-\\Delta S_M$ curves. The field dependence of $-\\Delta S_M$, relative cooling power, and cooling capacity follows power laws up to $\\sim2.6$ T (assuming $J\\approx1$ meV). Hysteresis analysis shows that lattices with lower coordination numbers exhibit a faster reduction in loop width with increasing temperature. These results establish the universal scaling behavior of the magnetocaloric effect in two-dimensional monolayer and bilayer magnetic lattices and provide guidelines for designing magnetic refrigerants.", "url": "https://arxiv.org/abs/2608.01811", "type": "理论+数值", "summary": "1. 该工作通过蒙特卡洛模拟系统研究了二维单层及双层Ising模型在方格、蜂窝和三角格子上的磁热效应，并利用Binder累积量确定各结构临界温度。\n2. 其核心发现是磁熵变及其场指数n经峰值归一化与温度标度后在不同磁场和六种晶格结构间坍缩为普适主曲线，且标度行为独立于配位数和层数。\n3. 该普适性结合相对制冷功率因峰宽补偿而基本不变的规律，为低维磁制冷材料设计及临界标度理论提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Basit Iqbal"}, {"name": "Kingshuk Sarkar"}], "featured_authors": [{"name": "Basit Iqbal"}, {"name": "Kingshuk Sarkar"}], "author_count": 2}, {"id": "2608.01817", "category": "cond-mat", "title": "Emergent modular Luttinger liquid from spin-partitioned entanglement in the one-dimensional Hubbard model", "abstract": "We study the spin-partitioned entanglement Hamiltonian of the one-dimensional repulsive Hubbard model. By combining bosonization with exact diagonalization, we show that tracing out one spin species produces a modular Luttinger liquid, whose properties fundamentally differ from those of the physical system. While the modular spectrum is fully dispersionless and possesses a momentum-independent entanglement gap, its eigenstates exhibit algebraic correlations governed by a single effective Luttinger parameter equal to the geometric mean of the charge and spin Luttinger parameters. The resulting entanglement spectrum displays a universal branching hierarchy in excellent agreement with exact diagonalization. We further demonstrate that the modular ground state is nearly identical to that of the spinless Luttinger liquid. These results uncover a universal modular structure in interacting one-dimensional fermionic systems.", "url": "https://arxiv.org/abs/2608.01817", "type": "理论+数值", "summary": "1. 该工作研究一维排斥性 Hubbard 模型中自旋分划的纠缠哈密顿量，结合玻色化与精确对角化揭示其为一个涌现的模Luttinger液体。\n2. 其核心在于模谱完全无色散且纠缠隙与动量无关，代数关联由电荷与自旋Luttinger参数的几何平均唯一决定，模基态与无自旋Luttinger液体几乎一致。\n3. 这揭示了相互作用一维费米子体系中普适的模结构，为以纠缠哈密顿量刻画隐藏低能物理提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Ádám Bácsi"}, {"name": "Catalin Pascu Moca"}, {"name": "Balázs Dóra"}], "featured_authors": [{"name": "Ádám Bácsi"}, {"name": "Catalin Pascu Moca"}, {"name": "Balázs Dóra"}], "author_count": 3}, {"id": "2608.01838", "category": "cond-mat", "title": "Topological Defects in Triple-$Q$ Magnetic Orders: A Fixed-Lattice Homotopy Classification", "abstract": "Multiple-$Q$ magnetic orders combine continuous spin rotations with discrete crystalline sectors associated with translations and point-group transformations, producing a richer defect structure than conventional single-$Q$ magnets. We classify the bulk defects of all seven stable phases for $N=2$ and $3$ in the $M$-point triple-$Q$ Ginzburg--Landau theory with $(\\Vfour\\rtimes\\Dthree)\\times\\OO(N)$ symmetry, where $\\Vfour$ is the translation-generated Klein four-group. The atomic lattice is treated as a prescribed background, with lattice dislocations and disclinations excluded and the three Fourier fields retaining their physical $M$-point labels. The parent-group transformations continuously connected to the identity form $G_0=\\{e\\}\\times\\SO(N)$. For a reference-state stabilizer $H$, the connected component containing the reference state is $G_0/(H\\cap G_0)$, not the quotient obtained by projecting $H$ onto spin space. This distinction gives the orthogonal triple-$Q$ phase the full manifold $\\OO(3)$, with chirality walls and Abelian $\\ZZ_2$ frame vortices rather than non-Abelian binary-polyhedral vortices. Every connected component of the $\\OO(2)$ phases supports an integer $2\\pi$ vortex, whereas fractional windings close only when attached to a discrete-domain wall and are linearly confined at nonzero wall tension. Translation symmetry further forbids cross-gradient bilinears, reducing the quadratic elastic sector to an isotropic and an $M$-point-locked anisotropic stiffness. The classification separates free internal defects, crystalline domain walls, and wall-bound composites in triple-$Q$ magnets.", "url": "https://arxiv.org/abs/2608.01838", "type": "理论", "summary": "1. 该工作对三重Q磁性序的体缺陷给出固定晶格同伦分类，覆盖N=2和3的M点模型中共七个稳定相。\n2. 其卖点在于用与恒等相连的父群G0={e}×SO(N)处理稳定子，使正交三重Q相获得完整流形O(3)及阿贝尔Z2帧涡旋。\n3. 该分类区分自由内部缺陷、晶体畴壁与壁束缚复合体，为多Q磁性材料中缺陷探测与后续理论提供清晰框架。", "summary_source": "deepseek", "authors": [{"name": "Jin-Tao Jin"}, {"name": "Yi Zhou"}], "featured_authors": [{"name": "Jin-Tao Jin"}, {"name": "Yi Zhou"}], "author_count": 2}, {"id": "2608.01882", "category": "cond-mat", "title": "Gap distributions between successive personal bests in cricket: Data and Models", "abstract": "Successive personal best performances provide a natural measure of progression in an athlete's career. Classical record theory predicts a universal gap distribution, $P(g)\\sim 1/g$, for independent and identically distributed (i.i.d.) sequences. However, sporting careers are shaped by learning, aging, changes in ability, and external influences that violate these assumptions. We investigate the statistics of inter-record gaps, defined as the number of innings between successive personal best scores, in cricket. Using career records of leading Test, ODI, and T20 players obtained from ESPN Cricinfo. We find that the empirical distributions are well described by truncated power law $P(g) \\propto g^{-\\alpha} e^{-\\lambda g}$ with exponents in the range (0.799 $\\leq \\alpha \\leq$ 0.843). Much of this deviation disappears when the temporal ordering of innings is destroyed, indicating that career evolution plays a key role in shaping record occurrence. Bootstrap-shuffled careers, which preserve individual score distributions and career lengths while removing temporal ordering, yield significantly larger exponents ($\\alpha \\approx 0.939\\text{--}0.979$). These findings show that the progression of personal best performances retains information about the temporal organization of a player's career and cannot be fully explained by simple stochastic record processes. More generally, they illustrate how record statistics are altered in nonstationary and path-dependent systems.", "url": "https://arxiv.org/abs/2608.01882", "type": "理论", "summary": "1. 该工作利用ESPN Cricinfo的Test、ODI与T20球员职业数据，实证研究了板球中连续个人最佳成绩之间的击球局数间隔分布。\n2. 其核心发现是经验间隔服从截断幂律（指数约0.80–0.84），而打乱局数时间顺序后指数升至0.94–0.98，表明职业演化与非平稳性显著塑造记录出现过程。\n3. 这为记录统计在非平稳、路径依赖系统中的行为提供了典型例证，对更广义复杂系统中的进展量与极值建模具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Priyanka D. Bhoyar"}, {"name": "Prashant M. Gade"}], "featured_authors": [{"name": "Priyanka D. Bhoyar"}, {"name": "Prashant M. Gade"}], "author_count": 2}, {"id": "2608.01892", "category": "cond-mat", "title": "Microscopic magnetic phase evolution in the Weyl semimetal Mn$_3$Sn revealed by $μ^+$SR", "abstract": "We report a comprehensive muon spin relaxation ($\\mu^+$SR) and bulk magnetization study of the antiferromagnetic (AFM) Weyl semimetal Mn$_3$Sn (composition Mn$_{2.99}$Sn). Mn$_3$Sn is reported to exhibit a commensurate inverse triangular (IT) AFM phase, an incommensurate (IC) helical AFM phase, and a proposed low-temperature spin-glass-like state. In our sample, we establish the respective transition temperatures for these phases to be $T_\\mathrm{N} = 418$ K, $T_\\mathrm{t} \\approx 275$ K, and $T_\\mathrm{f} = 21$ K. Investigating the low-temperature regime below $T_\\mathrm{f}$, we find no evidence of a static spin-glass state. Instead, the sample exhibits an increasing ferromagnetic (FM) component accompanied by a localized slowing of spin fluctuations, indicating that these phenomena may be decoupled. In the IC helical AFM phase, fitting the zero-field (ZF) spectra reveals an asymmetric internal magnetic-field distribution, indicating that the magnetic structure is heavily modified by anharmonicity. Upon warming above 150 K, a continuous redistribution of muon spectral weight reveals a broad regime of coexisting local magnetic environments associated with the IC helical and IT-AFM phases. In the commensurate IT-AFM phase above $T_\\mathrm{t}$, a persistent missing fraction in the initial asymmetry indicates that a subset of implanted muons, corresponding to roughly 20% of the sample-related asymmetry, undergoes unresolved ultrafast depolarization. Finally, we observe temperature-driven shifts in muon site populations above 325 K. Ultimately, our results show a highly dynamic magnetic landscape in Mn$_3$Sn, demonstrating how its complex magnetic orders often coexist and evolve continuously with temperature.", "url": "https://arxiv.org/abs/2608.01892", "type": "理论+数值", "summary": "1. 该工作联合μ+SR与体磁化测量，系统表征了Weyl半金属Mn3Sn中微观磁相随温度的演化，并标定了T_N=418K、T_t≈275K和T_f=21K三个转变温度。\n2. 核心发现是低温下不存在静态自旋玻璃态，而是铁磁分量增强与局域自旋涨落减速并存，同时非共线螺旋相呈现由非谐性导致的不对称内场分布，且各磁相在宽温区内共存演化。\n3. 这一高度动态的磁景观为理解Weyl半金属中复杂磁序的竞争与连续转变，以及其与拓扑输运性质的关联提供了关键的微观实验依据。", "summary_source": "deepseek", "authors": [{"name": "U. Miniotaite"}, {"name": "O. K. Forslund"}, {"name": "H. Luetkens"}, {"name": "V. Rai"}, {"name": "J. Persson"}, {"name": "G. D. Morris"}, {"name": "D. Zuhair"}, {"name": "D. W. Tam"}, {"name": "S. Nandi"}, {"name": "Y. Sassa"}, {"name": "M. Månsson"}], "featured_authors": [{"name": "U. Miniotaite"}, {"name": "O. K. Forslund"}, {"name": "H. Luetkens"}, {"name": "S. Nandi"}, {"name": "Y. Sassa"}, {"name": "M. Månsson"}], "author_count": 11}, {"id": "2608.01902", "category": "cond-mat", "title": "Wannier-Stark localization, confinement and edge states", "abstract": "The boundary between a system's bulk and the vacuum can be modeled by a potential which confines the electrons to the bulk. Here we present the example of the Wannier-Stark linear potential, generated by an electric field along one axis of a two-dimensional lattice. Along that axis, the potential generates electronic states which are localized around each lattice site, with eigenenergies which form the Wannier-Stark ladder. In the transverse direction, the states are governed by a tight binding model with free Bloch states. In the ground state, filling these states under the Pauli principle generates an insulating bulk and an edge which can be metallic in the transverse direction. This paper explains the concepts of localization, localization length, filling and confinement. The paper also acquaints the readers with the use of Bessel functions in the solution of a simple physical model. These topics can be easily included in courses on solid state physics, and only require prior knowledge of quantum mechanics.", "url": "https://arxiv.org/abs/2608.01902", "type": "理论", "summary": "1. 该论文以沿二维晶格某一方向施加线性势场为模型，系统阐述了Wannier-Stark局域化、局域长度、泡利填充以及由此产生的体态与边缘态物理图像。\n2. 其技术要点在于电场方向形成分立Wannier-Stark阶梯局域态，横向为自由布洛赫态，基态填充后体态绝缘而边缘可能呈横向金属性，并通过贝塞尔函数给出解析解。\n3. 该工作为固体物理教学提供了仅需量子力学基础即可讲授局域化与边缘导电概念的简洁范例，或可启发对更一般梯度势下约束态的研究。", "summary_source": "deepseek", "authors": [{"name": "N. Aucar Boidi"}, {"name": "A. Aharony"}, {"name": "O. Entin-Wohlman"}, {"name": "C.Proetto"}], "featured_authors": [{"name": "N. Aucar Boidi"}, {"name": "A. Aharony"}, {"name": "O. Entin-Wohlman"}, {"name": "C.Proetto"}], "author_count": 4}, {"id": "2608.01925", "category": "cond-mat", "title": "A numerical study to analyze the interplay of Weissenberg number and viscosity ratio in a log-strain tensorial model for viscoelastic fluids", "abstract": "We present a computational study aimed at exploring the different and independent roles of the Weissenberg number and of the ratio between the polymeric and solvent viscosity contributions in a viscoelastic fluid model. The tensorial model under investigation, recently proposed, is based on a logarithmic relation between the elastic (or recoverable) strain and the elastic stress. In this model, the elastic strain plays the role of a conformation tensor and its evolution equation inherently preserves its determinant and positive definiteness. These properties are also enforced in the computational method employed in the study. A finite-difference discretization in time is combined with a stabilized mixed finite element formulation based on the Variational Multiscale method for the spatial discretization and with a generalized Lie derivative approach for the advection terms. The behavior of the model is analyzed in paradigmatic pressure-driven flows and we find that the value of the viscosity ratio is crucial in determining to which extent non-Newtonian flow profiles are observed upon increasing the Weissenberg number. By comparing the solutions of the log-strain tensorial model with those of a suitable Generalized Newtonian Fluid model, we show that flow-type dependence plays a significant role even in the simple planar flow past a cylinder.", "url": "https://arxiv.org/abs/2608.01925", "type": "理论+数值", "summary": "1. 该工作通过数值模拟系统考察了Weissenberg数与聚合/溶剂黏度比对对数应变张量黏弹性流体模型行为的影响。\n2. 技术核心是采用时间有限差分、变分多尺度稳定化混合有限元及广义李导数处理对流项，严格保持构型张量的行列式与正定性，并发现黏度比决定非牛顿速度剖面随Weissenberg数增强的程度。\n3. 与广义牛顿流体解的对比表明即使简单圆柱绕流也存在显著流型依赖性，这为构建更可靠的黏弹性本构模型及数值格式提供了明确参照。", "summary_source": "deepseek", "authors": [{"name": "Nehal Dash"}, {"name": "Ramon Codina"}, {"name": "Giulio G. Giusteri"}], "featured_authors": [{"name": "Nehal Dash"}, {"name": "Ramon Codina"}, {"name": "Giulio G. Giusteri"}], "author_count": 3}, {"id": "2608.01991", "category": "cond-mat", "title": "Spin Josephson diode effect induced by higher-harmonic spin Josephson currents in a diffusive Josephson junction", "abstract": "We theoretically investigate the spin Josephson diode effect (SJDE) in a diffusive Josephson junction with a Rashba metal layer under a ferromagnetic exchange field. Within the quasiclassical Green's function framework, we derive analytical expressions for the first- and second-harmonic spin Josephson currents. The interplay between Rashba spin-orbit interaction and the exchange field breaks inversion and time-reversal symmetries, generating additional cosine terms in the spin current-phase relations and a finite phi0 phase shift. This phase shift induces an intrinsic asymmetry between forward and backward spin currents, leading to the SJDE without an external magnetic field. Numerical results show that the efficiency decreases with increasing metal thickness due to suppression of the second-harmonic component, while its dependence on spin-orbit interaction strength reflects competing effects between phase shift enhancement and harmonic suppression. These findings demonstrate that the interplay between harmonic components provides a mechanism for nonreciprocal spin transport without requiring suppression of spin-singlet correlations.", "url": "https://arxiv.org/abs/2608.01991", "type": "理论+数值", "summary": "1. 该工作利用准经典格林函数理论，研究了扩散约瑟夫森结中 Rashba 金属层在铁磁交换场下的自旋约瑟夫森二极管效应。\n2. 其核心在于解析导出第一、二次谐波自旋电流，揭示 Rashba 自旋轨道耦合与交换场协同破缺对称性并产生有限 phi0 相移，从而无需外磁场即可实现正反向自旋流不对称。\n3. 该机制表明高次谐波与基波分量的竞争可调控非互易自旋输运效率，为不依赖抑制自旋单态关联的自旋电子学器件设计提供了思路。", "summary_source": "deepseek", "authors": [{"name": "Shin-ichi Hikino"}], "featured_authors": [{"name": "Shin-ichi Hikino"}], "author_count": 1}, {"id": "2608.02007", "category": "cond-mat", "title": "Benchmarking the fermionic quasi-1D many-body problem", "abstract": "We investigate the validity of effective one-dimensional models for quasi-1D fermionic systems by benchmarking a coupled-channel approach against the exact low-energy theory derived from the underlying three-dimensional problem in the weakly and strongly attractive limits. We show that reproducing the exact two-body scattering amplitude is insufficient to construct the correct effective low-energy theory of quasi-1D fermions. In the weakly attractive regime, it does not capture the emergent three-body interaction induced by transverse excitations. In the strongly attractive regime, it yields an atom-dimer scattering length with an incorrect dependence on the three-dimensional scattering length. These results demonstrate the limitations of effective one-dimensional descriptions based solely on two-body physics and highlight the need to explicitly include few-body correlations in quasi-1D systems.", "url": "https://arxiv.org/abs/2608.02007", "type": "理论", "summary": "1. 该工作通过将耦合道方法与由三维问题导出的精确低能理论对比，基准检验了准一维费米子系统的有效一维模型在弱吸引和强吸引极限下的有效性。\n2. 其核心发现是仅复现精确两体散射振幅不足以构造正确的有效低能理论，因为弱吸引区会遗漏横向激发诱导的三体相互作用，强吸引区则给出错误的原子-二聚体散射长度对三维散射长度的依赖。\n3. 这揭示了准一维体系中基于两体物理的一维描述的局限，凸显了在准一维多体问题中显式纳入少体关联的必要性。", "summary_source": "deepseek", "authors": [{"name": "Ekaterina Gradova"}, {"name": "Fr{é}d{é}ric Chevy"}], "featured_authors": [{"name": "Ekaterina Gradova"}, {"name": "Fr{é}d{é}ric Chevy"}], "author_count": 2}, {"id": "2608.02042", "category": "cond-mat", "title": "Enhanced and robust superconductivity in La0.8Sr0.2NiO2 membranes compressed up to 210 GPa", "abstract": "The discovery of superconductivity in infinite-layer nickelate thin films has opened a new frontier for exploring unconventional oxide superconductors beyond the copper oxide family. However, the presence of substrate hampers investigations under very high pressure. Recently, this problem was circumvented by a study of freestanding Nd0.85Sr0.15NiO2 membranes, which revealed that superconducting transition temperature kept increasing as the pressure was ramped up to 91 GPa, without showing signs of saturation. Naturally, one wonders what would happen at even higher pressures. Here, we report that superconductivity in a freestanding La0.8Sr0.2NiO2 membrane persists under applied ultrahigh pressures up to 210 GPa. The superconducting transition onset temperature exhibits a continuous dome-like evolution, increasing from 16 K at ambient pressure to a peak of 74.5 K at 146 GPa, and then gradually decreasing to 57.4 K at 210 GPa. Such robustness of superconductivity against ultrahigh pressure has not been observed in high-Tc oxide superconductors before.", "url": "https://arxiv.org/abs/2608.02042", "type": "理论", "summary": "1. 该工作报道了自支撑La0.8Sr0.2NiO2膜在最高210 GPa超高压下的超导电性测量，得到转变温度随压力的完整演化。\n2. 核心发现是超导态在210 GPa仍不消失，Tc呈穹顶状变化，自常压16 K升至146 GPa处74.5 K峰值后降至57.4 K，显示出高Tc氧化物中前所未有的抗压鲁棒性。\n3. 该结果对无限层镍酸盐超导配对机制构成强约束，并激励研究者利用极端压力探索更宽压力区间内的非常规超导相图。", "summary_source": "deepseek", "authors": [{"name": "Shu Cai"}, {"name": "Yuqing Tian"}, {"name": "Shengjun Yan"}, {"name": "Jinyu Zhao"}, {"name": "Bo Hao"}, {"name": "Jianfeng Zhang"}, {"name": "Shuaihang Sun"}, {"name": "Yang Ding"}, {"name": "Qi Wu"}, {"name": "Ho-kwang Mao"}, {"name": "I. Bozovic"}, {"name": "Yuefeng Nie"}, {"name": "Liling Sun"}], "featured_authors": [{"name": "Shu Cai"}, {"name": "Yuqing Tian"}, {"name": "Shengjun Yan"}, {"name": "I. Bozovic"}, {"name": "Yuefeng Nie"}, {"name": "Liling Sun"}], "author_count": 13}, {"id": "2608.02131", "category": "cond-mat", "title": "Coherent migration of the single excitation injected into finite-length segment of the biomolecular chain", "abstract": "We study the migration of a single excitation excited at a structural element of a finite molecular segment, which is a part of a long biomolecular chain. The excitation cannot leave the segment and is locally coupled to thermal vibrations of the lattice, forming a self-trapped state corresponding to a nonadiabatic polaron. The time-dependent probability distribution of finding the excitation at the nodes of the segment is calculated, with particular emphasis on the role of the initial excitation position. A formal analogy is observed between the present model and continuous-time quantum walk models on finite chains with reflecting boundaries. The results reveal an asymmetry in the probability distribution for nodes symmetrically positioned with respect to the initially excited site, which arises solely from the asymmetric placement of the initial excitation within the finite segment. The only exception occurs when the initially excited node is located at the center of the segment, where the probability distribution becomes symmetric. The complex interference pattern and the absence of well-defined revivals stem from the non-equidistant spectrum of mode frequencies, leading to progressive dephasing of the constituent modes. As a result, the initially well-localized probability maximum fragments into one dominant maximum accompanied by several secondary maxima of lower intensity. These findings highlight the importance of boundary conditions and initial-state geometry in controlling quantum transport in finite molecular systems.", "url": "https://arxiv.org/abs/2608.02131", "type": "理论+数值", "summary": "1. 该工作研究注入到有限长生物分子链段内单个结构节点的激发发生相干迁移的情形，计算其含时概率分布，并着重考察初始激发位置的作用。\n2. 其物理卖点在于发现初始位置的非对称放置使关于注入点对称的节点上概率分布出现不对称，唯一例外是中心注入；非等距模谱导致模式退相位，使初始局域峰分裂为主峰与多个次峰。\n3. 该结果强调边界条件与初始态几何对有限分子体系中量子输运的控制作用，为生物分子链及连续时间量子游走平台的输运调控提供了启发。", "
