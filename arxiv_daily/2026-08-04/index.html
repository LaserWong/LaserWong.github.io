用玻姆语言研究高温Caldeira-Leggett模型，导出密度矩阵极坐标形式的广义连续性方程与Hamilton-Jacobi方程，并提出含量子性参数的标度方程描述量子-经典过渡。\n2. 其要点是有效势在经典极限不消失且不能分解为量子与热贡献之和，使温度依赖的经典轨迹保持确定性，与Langevin随机描述形成对比。\n3. 该标度框架可用于Gaussian态展现热效应与过渡参数共同抑制相干性和干涉，为理解开放系统量子退相干及经典极限提供路径。", "summary_source": "deepseek", "authors": [{"name": "S. V. Mousavi"}, {"name": "S. Miret-Artés"}], "featured_authors": [{"name": "S. V. Mousavi"}, {"name": "S. Miret-Artés"}], "author_count": 2}, {"id": "2608.02090", "category": "quant-ph", "title": "Field-Free Transverse Aharonov--Bohm Phase Gate for an Orbital $l$-Qubit", "abstract": "Free-space Aharonov--Bohm (AB) Bessel modes are known to carry a flux-dependent azimuthal Schrödinger probability current and kinetic orbital angular momentum. We extend this response to the spin-resolved conserved Dirac current of a core-excluded finite-wall annular guide and show that confinement converts its surviving orbital component into a transverse Aharonov--Bohm (TAB) propagation phase for a straight traveling mode whose centroid path has zero projection onto $\\mathbf A$. The radial-gradient current reverses under spin reversal; retaining the complete evanescent tail closes it as a boundary contribution, leaving a spin-independent orbital phase $\\Delta\\phi_{ln}\\propto l\\Phi L_{\\rm int}\\langle\\rho^{-2}\\rangle_{ln}/v_z$. Opposite-winding modes $|\\pm l\\rangle$ form a same-path qubit implementing $R_z(2\\delta_l)$ with differential readout and common-mode phase rejection, while direct first-order crosstalk requires the angular harmonic $m=\\pm2l$. For a $100\\,\\mu\\mathrm{m}$ section with $a=20\\,\\mathrm{nm}$, $R=30\\,\\mathrm{nm}$, $E_z=10\\,\\mathrm{meV}$, and $|l|=10$, the sensitivity is $0.1885\\,\\mathrm{mrad/mG}$ and $R_z(\\pi)$ occurs at $16.67\\,\\mathrm{G}$. Finite-wall confinement thus turns intrinsic azimuthal Dirac current into a guided field-free phase operation.", "url": "https://arxiv.org/abs/2608.02090", "type": "理论+数值", "summary": "1. 该工作将自由空间阿哈罗诺夫-玻姆贝塞尔模的磁通响应推广至芯排除有限壁环形波导，提出基于轨道角动量叠加态的无场横向AB相位门。\n2. 其核心在于约束使残余狄拉克轨道流转化为与自旋无关的传播相位Δφ∝lΦL_int⟨ρ⁻²⟩/v_z，并利用|±l⟩同路径量子比特实现R_z(2δ_l)操作，差分读出抑制共模相位且一阶串扰仅来自m=±2l谐波。\n3. 该机制将内禀方位角狄拉克流转化为导引相干相位操作，为固态或电子波导中轨道量子比特的集成化、低串扰量子信息处理提供了可参数化路径。", "summary_source": "deepseek", "authors": [{"name": "Ju Gao"}, {"name": "Fang Shen"}], "featured_authors": [{"name": "Ju Gao"}, {"name": "Fang Shen"}], "author_count": 2}, {"id": "2608.02119", "category": "quant-ph", "title": "Better accuracy with fewer qubits: Single-particle basis set optimization for quantum chemistry on quantum computers", "abstract": "In spite of recent advances, quantum computers are expected to be sufficiently noisy in the coming few years to the extent of limiting quantum chemical calculations to relatively small number of orbitals. However, even with reasonable quality single particle basis sets, small active spaces with limited orbitals can result in a significant fraction of correlation energy being lost, motivating the design of moderate quality qubit-efficient basis sets for quantum algorithms. We begin by reoptimizing the existing minimal basis sets using a genetic algorithm-inspired approach in conjunction with aggressive refinement strategies, and generate modified minimal basis sets (MSTO-kG basis; k = 2-11) for atoms from H through F. The ground state energies of H through F using our MSTO bases at FCI level of theory yield ground state energies that are comparable or sometimes even lower than those obtained using 6-31G basis sets. In the case of Li, the MSTO bases surpass the performance of cc-pVQZ bases. Thus, we obtain better atomic energies with same number of qubits relative to STO bases, and better/comparable energies with fewer qubits relative to higher quality bases. In the case of molecules, H2 performs poorly; a finding that is consistent with an earlier work in literature. For other molecules, Li2, C2, LiH, BeH and BeH2, the FCI results (except C2 for which we employ CISD) from our bases are comparable to/outperform those from 6-31G basis. Finally, we compare the resources required between different bases and find that MSTO bases yield better energies than the competing basis sets while incurring fewer qubits and two-qubit gates with VQE, QPE, and HHL. The logical T-gate counts are also found to be considerably lower for QPE and HHL respectively. Overall, our work paves way for more accurate yet less qubit-hungry quantum chemical calculations using near-term quantum computers.", "url": "https://arxiv.org/abs/2608.02119", "type": "理论+数值", "summary": "1. 该工作针对量子化学量子计算中活性空间受限的问题，提出以遗传算法启发式策略优化单粒子基组，构建了适用于H至F原子的MSTO-kG基组。\n2. 其核心优势在于：在相同量子比特数下，MSTO基的FCI原子能量优于或媲美STO及6-31G基组，Li甚至超过cc-pVQZ，且分子计算在VQE、QPE和HHL中显著降低量子比特、双比特门及T门资源。\n3. 这为近期含噪量子计算机上开展更精确且更少量子比特消耗的量子化学模拟提供了切实可行的基组优化路径。", "summary_source": "deepseek", "authors": [{"name": "Subimal Deb"}, {"name": "V. S. Prasannaa"}], "featured_authors": [{"name": "Subimal Deb"}, {"name": "V. S. Prasannaa"}], "author_count": 2}, {"id": "2608.02245", "category": "quant-ph", "title": "Quantum computer-based simulation of Stark many-body localization in a 1D Fermi-Hubbard model", "abstract": "Many-body localization (MBL) is a dynamical phenomenon that describes the non-ergodicity of isolated quantum many-body systems. In contrast to thermalization, this phenomenon leads to a long-lived memory of initial states of local systems and slow growth of entanglement. In this work, we study Stark MBL in a 12-qubit correlated fermionic system described by the one-dimensional Fermi-Hubbard model using Hamiltonian simulation on an IBM superconducting qubit quantum computer. To enable such a computation on current-day noisy hardware, we combine a series of compilation steps, including the use of the spin-resolved Jordan-Wigner transformation, employing SWAP networks, and integrating a tensor-network-based quantum circuit optimization routine on top of a standard circuit optimization pipeline. As a result, there is approximately an 88$\\%$ and 87$\\%$ reduction in two-qubit gate count and circuit depth, respectively. Through such simulations of the real-time dynamics using Trotterized quantum circuits, we exhibit a crossover from thermalizing dynamics of the system at a weak tilt of the field to a strongly localized behavior at large tilt with short evolution times. We also benchmark our obtained results with respect to those from exact simulations.", "url": "https://arxiv.org/abs/2608.02245", "type": "理论+数值", "summary": "1. 该工作利用IBM超导量子计算机，通过12比特一维Fermi-Hubbard模型的哈密顿量模拟，研究倾斜场下Stark多体局域化的实时动力学。\n2. 其技术卖点在组合自旋分辨Jordan-Wigner变换、SWAP网络与张量网络电路优化，使双量子比特门数和电路深度分别降低约88%和87%，实现含噪硬件上的Trotter化模拟。\n3. 结果显示系统从弱倾斜场的热化动力学到强倾斜场局域化行为的交叉，并与精确模拟基准一致，为在近期量子设备上探索非平衡多体物理提供实用范例。", "summary_source": "deepseek", "authors": [{"name": "Abdul Kalam"}, {"name": "Prasenjit Deb"}, {"name": "Akitada Sakurai"}, {"name": "Tapan Mishra"}, {"name": "V.S. Prasannaa"}, {"name": "B. P. Das"}], "featured_authors": [{"name": "Abdul Kalam"}, {"name": "Prasenjit Deb"}, {"name": "Akitada Sakurai"}, {"name": "Tapan Mishra"}, {"name": "V.S. Prasannaa"}, {"name": "B. P. Das"}], "author_count": 6}, {"id": "2608.02333", "category": "quant-ph", "title": "Finite-Syndrome Compression of Quantum Fisher Information", "abstract": "Readable error records can protect quantum sensing because they prevent physically distinct noise trajectories from being irreversibly mixed. A finite detector or ancilla, however, can retain only finitely many syndrome values, and a general criterion for deciding which records may be merged without losing metrological information is absent. We formulate the problem for a fixed fine-grained classical-quantum record and parameter-independent compression into at most $M$ flags. We prove an exact identity expressing the lost symmetric-logarithmic-derivative quantum Fisher information (SLD QFI) as a sum of state-weighted squared distances between fine and coarse SLD scores. Consequently, optimal finite-syndrome design is exactly an operator-valued clustering problem, and zero loss is characterized by a support-resolved common-SLD condition. We extend the identity to the full multiparameter SLD QFI matrix and distinguish local QFI preservation from recovery of an entire statistical model. For exact recovery of a quantum code, we separately show that, when each fine error is individually correctable, the minimum number of readable syndromes is the chromatic number of a Knill-Laflamme incompatibility graph. For qubit random-unitary noise we obtain a finite partition formula. A planar random-Pauli model admits a conditional-variance representation and, for a uniform error axis, the exact optimum $F_M^{\\star}=[M\\sin(\\pi/M)/\\pi]^2$, with deficit $\\pi^2/(3M^2)+O(M^{-4})$. These results identify the information-theoretic cost of finite syndrome resolution while making explicit the side-information assumptions required for any passive noise-to-erasure interpretation.", "url": "https://arxiv.org/abs/2608.02333", "type": "理论+数值", "summary": "1. 该工作针对有限探测器只能保留有限个纠错子值的情形，提出了有限综合征压缩下量子费希尔信息损失的一般判据，并建立了损失量的精确恒等式。\n2. 其核心卖点是将最优有限综合征设计等价转化为算子值聚类问题，证明零损失对应支撑分解的公共SLD条件，并给出Knill-Laflamme不相容图色数的精确恢复判据。\n3. 这为量子传感与纠错中有限分辨率的资源代价提供了定量刻画，也明确了被动噪声-擦除解释所需边信息假设的适用范围。", "summary_source": "deepseek", "authors": [{"name": "Jianqi Sheng"}], "featured_authors": [{"name": "Jianqi Sheng"}], "author_count": 1}, {"id": "2608.02403", "category": "quant-ph", "title": "Entanglement Generation Beyond Quantum Theory: From Product States to Popescu-Rohrlich Boxes", "abstract": "Entanglement generation is a fundamental dynamical capability in quantum information science and underpins many quantum advantages. While quantum theory enables it through unitary dynamics, boxworld, a generalized probabilistic theory admitting Popescu--Rohrlich boxes with supraquantum correlations, has no reversible transformation capable of generating entanglement. We show that this no-go picture changes fundamentally once reversibility is relaxed to pure-state preservation. We construct a pure-state-preserving transformation that maps every uncorrelated pure state to a Popescu--Rohrlich box and completely classify all pure-state-preserving entangling transformations in the simplest bipartite boxworld. Our results provide the first explicit mechanism for generating beyond-quantum entanglement without introducing mixing and demonstrate a physical distinction between reversibility and pure-state preservation that is obscured by the structure of quantum theory.", "url": "https://arxiv.org/abs/2608.02403", "type": "理论", "summary": "1. 该工作研究boxworld广义概率理论中纯态保持变换的纠缠生成能力，证明其可将任意无关联纯态映射为Popescu-Rohrlich盒。\n2. 技术核心是对最简单二分boxworld中所有纯态保持纠缠变换给出完整分类，揭示放弃可逆性后超量子纠缠可在无混合条件下产生。\n3. 该结果凸显可逆性与纯态保持间的物理区分，为广义概率理论中动力学能力及其量子信息启示提供了新基准。", "summary_source": "deepseek", "authors": [{"name": "Shun Umekawa"}, {"name": "Akihiro Hokkyo"}, {"name": "Hayato Arai"}, {"name": "Kazuaki Takasan"}], "featured_authors": [{"name": "Shun Umekawa"}, {"name": "Akihiro Hokkyo"}, {"name": "Hayato Arai"}, {"name": "Kazuaki Takasan"}], "author_count": 4}, {"id": "2608.02427", "category": "quant-ph", "title": "Caustics and Superenergy in the Quantum Bouncer", "abstract": "We investigate the quantum interference and energetic phenomena associated with classical caustics in the quantum bouncing ball problem, we refer to as quantum caustics. By considering an initial Gaussian wavepacket, we show that caustics associated with the underlying classical trajectory families are exhibited. We connect the associated phase singularity chains in the vicinity of the caustic with the semiclassical Pearcey function built on the cusp catastrophe lines. We also quantify the amount of superenergy exhibited in these solutions - regions of space where the local energy exceeds the largest constituent energy eigenvalue. We give a complimentary description of the caustic and superenergy behavior using the Madelung/Bohm trajectories, which gives additional insight about the energy of the trajectories and how they traverse the phase singularity chains.", "url": "https://arxiv.org/abs/2608.02427", "type": "理论", "summary": "1. 作者用量子弹跳球中的高斯波包研究经典焦散对应的量子干涉与能量现象，并明确刻画了所谓量子焦散。\n2. 其要点是将焦散附近的相位奇点链与基于尖点灾变线的半经典Pearcey函数联系，并通过Madelung/Bohm轨迹揭示局域能量超过最大成分本征值的超能量行为。\n3. 该工作为量子经典对应中的焦散结构与能量异常提供了整合性理论框架，也为其他重力或曲面反射波包系统的检验与推广带来启发。", "summary_source": "deepseek", "authors": [{"name": "Marko. M. Ćosić"}, {"name": "Andrew N. Jordan"}], "featured_authors": [{"name": "Marko. M. Ćosić"}, {"name": "Andrew N. Jordan"}], "author_count": 2}, {"id": "2608.02451", "category": "quant-ph", "title": "Spread complexity as a probe in generalized and long-range Aubry-Andre-Harper models", "abstract": "We investigate the spread complexity of quantum quenches in generalized and long-range Aubry-Andre-Harper (AAH) models, encompassing regimes with and without mobility edges. In particular, in the generalized AAH models supporting energy-dependent mobility edges, we demonstrate that the long-time averaged spread complexity exhibits nonanalytic behavior when the post-quench quasiperiodic potential crosses the mobility edge associated with the energy of the initial eigenstate, thereby accurately identifying the mobility-edge transition. Such a behavior is supported by the spreading of local density of states. We further derive analytical expressions for the moments and the corresponding Lanczos coefficients for quenches between the limits of vanishing and strong quasiperiodic potentials. The Lanczos coefficients display qualitatively distinct behavior depending on the presence of mobility edges - they exhibit an initial plateau followed by a decay with the Krylov basis index, in contrast to the nearly constant behavior of the conventional AAH model without mobility edges. For LR hopping, the coefficients decay with the Krylov basis index for quenches from the localized to the extended phase, while they coincide with the AAH results for quenches in the opposite direction.", "url": "https://arxiv.org/abs/2608.02451", "type": "理论", "summary": "1. 该工作研究广义与长程Aubry-Andre-Harper模型中量子淬火的展开复杂度，并利用其探测迁移率边跃迁。\n2. 其要点在于显示长时平均展开复杂度在末态准周期势越过初态能量对应的迁移率边时出现非解析行为，且Lanczos系数因迁移率边有无而呈现平台后衰减或近似常数等不同特征。\n3. 这为利用展开复杂度识别迁移率边，并刻画长程跳变在局域化—退局域化淬火中的方向不对称性提供了新探针。", "summary_source": "deepseek", "authors": [{"name": "Triyas Sapui"}, {"name": "Tanoy Kanti Konar"}, {"name": "Subinay Dasgupta"}, {"name": "Aditi Sen De"}], "featured_authors": [{"name": "Triyas Sapui"}, {"name": "Tanoy Kanti Konar"}, {"name": "Subinay Dasgupta"}, {"name": "Aditi Sen De"}], "author_count": 4}, {"id": "2608.02517", "category": "quant-ph", "title": "Thermalization of open quantum systems with pseudomodes", "abstract": "Pseudomode approaches allow for an exact and unapproximated description of a quantum system interacting arbitrarily strongly with a bath. In general, a system coupled to pseudomodes will not thermalize to the system's Gibbs state: This is to be expected when the system-bath coupling is non-perturbative, but conflicts with common thermodynamic intuition when the system-bath coupling is asymptotically weak. We explore under which circumstances pseudomode models satisfy detailed balance (and subsequently thermalize to the system Gibbs state) and how specific choices of parameters can force \"weak\" detailed balance that is restricted to a limited frequency range. A combination of Hermitian and non-Hermitian pseudomodes that yields a flat effective-temperature profile is also considered. The results and criteria established here are relevant for the construction of pseudomode models in contexts where thermodynamic consistency is required.", "url": "https://arxiv.org/abs/2608.02517", "type": "理论", "summary": "1. 该工作利用伪模方法研究开放量子系统并检验其热化行为，明确探讨了系统在任意强耦合条件下是否、以及何时热化到吉布斯态，并系统分析详细平衡成立的条件。\n2. 其核心结论是：伪模模型满足细致平衡依赖于特定参数条件，而某些参数选取只能实现受限频率范围内的“弱”细致平衡，这为弱耦合极限下的热力学直觉提供了必要修正。\n3. 该判据对构造热力学一致的伪模模型具有直接指导意义，包括通过厄米与非厄米伪模的组合实现平坦有效温度分布，并为后续强耦合热化研究提供了可检验框架。", "summary_source": "deepseek", "authors": [{"name": "R. Kevin Kessing"}, {"name": "Thibaut Lacroix"}, {"name": "Susana F. Huelga"}, {"name": "Martin B. Plenio"}], "featured_authors": [{"name": "R. Kevin Kessing"}, {"name": "Thibaut Lacroix"}, {"name": "Susana F. Huelga"}, {"name": "Martin B. Plenio"}], "author_count": 4}, {"id": "2608.02587", "category": "quant-ph", "title": "Entanglement of flower states", "abstract": "The mysterious nature of entanglement, one of the most prominent exquisitely quantum phenomena, is reflected in its intricate operational structure, with a hierarchy of classes of free operations that enable its manipulation at different levels of effectiveness. Here we use the class of 'flower states', parametrised by their (even) local dimension $2k$, to shine light on some aspects of this varied landscape. We compute all the main entanglement measures for flower states, uncovering a large gap between all forms of distillable entanglement, equal to 1 ebit independently of the local dimension, and the entanglement cost under local operations and classical communication (LOCC), known to be equal to $\\log\\big(2\\sqrt{k}\\big)$. Even under the strictly more powerful class of non-entangling (NE) operations, we show that their cost is still equal to $\\log\\big(1+\\sqrt{k}\\big)$, only about an ebit less than for LOCCs. This result, which we prove by calculating the recently introduced tempered entanglement negativity for these states, demonstrates the largest known 'irreversibility gap', i.e. the difference between distillable entanglement and entanglement cost, under NE operations, equal to $\\Theta\\big(\\frac12 \\log d\\big)$, with $d$ being the local dimension. A notable consequence is that the celebrated squashed entanglement is not a monotone under NE operations. Finally, we compute the exact cost under LOCC operations for flower states; this is given by the Schmidt number, which turns out to be additive over multiple copies and equal to $\\min_{r|k} \\log\\left( r + \\frac{k}{r} \\right)$; for prime $k$ this reduces to $\\log(k+1)$, about twice the standard LOCC cost. These last results leverage the uncertainty relations over cyclic groups proved by Tao and Meshulam.", "url": "https://arxiv.org/abs/2608.02587", "type": "理论", "summary": "1. 该文以局域维数2k的花态为对象，系统计算其主要纠缠度量，揭示可蒸馏纠缠恒为1 ebit与纠缠代价间的巨大不可逆间隙。\n2. 核心贡献是证明非纠缠操作下纠缠代价为log(1+√k)，仅比LOCC代价少约一ebit，从而给出已知最大的NE不可逆间隙Θ(1/2 log d)，并推出squashed纠缠不是NE单调量。\n3. 文中还利用Tao-Meshulam循环群不确定关系精确计算LOCC代价等于可加施密特数，素数k时为log(k+1)，为自由操作层级下的纠缠不可逆性提供了严格范例。", "summary_source": "deepseek", "authors": [{"name": "Samrat Sen"}, {"name": "Ludovico Lami"}], "featured_authors": [{"name": "Samrat Sen"}, {"name": "Ludovico Lami"}], "author_count": 2}, {"id": "2608.02590", "category": "quant-ph", "title": "Optimal Quantum de Finetti Theorems via Argmax Rounding", "abstract": "We prove optimal finite quantum de Finetti upper bounds. Given a bosonic state $\\rho_N\\in D(\\mathrm{Sym}^N(\\mathbb C^d))$, there is a probability measure $\\nu$ on the unit sphere such that \\[ \\left\\| \\rho_N^{(2)}-\\int |u\\rangle\\langle u|^{\\otimes 2}\\,d\\nu(u) \\right\\|_1 \\le \\frac{\\sqrt{d-1}}{N-1}. \\] By purification, the bosonic theorem also gives the optimal $O(d/N)$ upper bound for arbitrary exchangeable states. These results settle the dimension dependence left open by Christandl, König, Mitchison, and Renner (CMP 2007). The proof casts de Finetti approximation as sum-of-squares rounding and applies the argmax method of Jeronimo, Wu, and Xu (manuscript 2026). More generally, $t$-site marginals satisfy $O(t\\sqrt d/N)$ bosonic and $O(td/N)$ permutation-invariant bounds. Our proof formulates de Finetti approximation as the integrality gap of a symmetric-extension semidefinite program and rounds an optimum by the argmax principle. The sharp bounds have several consequences. For every fixed $\\varepsilon\\in(0,1)$, we construct a channel with input dimension $D=\\exp(O_\\varepsilon(\\sqrt d\\log d))=\\exp(o(d))$ whose outputs are $\\varepsilon$-close to separable states of local dimension $d$ and whose image contains every such separable state, thereby refuting Watrous's disentangler conjecture. We also obtain deterministic $\\exp(\\widetilde O(\\sqrt d/\\varepsilon))$-time algorithms for explicit Best Separable State without perfect completeness and for trace-distance separability testing. Finally, spectral truncation gives the first dimension-free bosonic de Finetti theorem in Hilbert--Schmidt distance, with the optimal rate $\\Theta(N^{-1/2})$ when the dimension may grow.", "url": "https://arxiv.org/abs/2608.02590", "type": "理论+数值", "summary": "1. 该工作证明最优有限量子de Finetti上界，涵盖玻色与任意可交换态，解决Christandl等人遗留的维数依赖问题。\n2. 卖点是将de Finetti近似化为对称扩展半定规划的argmax舍入，得到t-体界，并用谱截断获得Hilbert-Schmidt距离下无维数定理。\n3. 结果反驳Watrous解缠器猜想，并导出确定性可分态判定算法，为量子信息与SDP松弛提供新联系。", "summary_source": "deepseek", "authors": [{"name": "Fernando Granha Jeronimo"}, {"name": "Pei Wu"}, {"name": "Haochen Xu"}], "featured_authors": [{"name": "Fernando Granha Jeronimo"}, {"name": "Pei Wu"}, {"name": "Haochen Xu"}], "author_count": 3}, {"id": "2608.02600", "category": "quant-ph", "title": "Nearly tight lower bounds for estimating quantum functionals: Uhlmann fidelity, trace distance, and von Neumann entropy", "abstract": "In this paper, we present a unified framework for proving lower bounds for estimating functionals of quantum states. We therefore resolve several open problems by establishing lower bounds that match known upper bounds: we show that it requires $\\widetilde{\\Omega}(N^2)$ samples to estimate the Uhlmann fidelity, trace distance, and von Neumann entropy. Moreover, they immediately imply matching query lower bounds of $\\widetilde{\\Omega}(N)$ by quantum sample-to-query lifting. These lower bounds imply the near-optimality of a dozen quantum algorithms since 2016.", "url": "https://arxiv.org/abs/2608.02600", "type": "理论+数值", "summary": "1. 该工作提出一个统一框架，用于推导估计量子态泛函所需的样本与查询复杂度下界，并据此解决若干长期开放问题。\n2. 其核心在于证明 Uhlmann 保真度、迹距离和 von Neumann 熵均需 \\widetilde{\\Omega}(N^2) 个样本，且通过样本到查询提升进一步得到匹配的 \\widetilde{\\Omega}(N) 查询下界，与已知上界吻合。\n3. 这些近紧下界直接说明自 2016 年以来约十余种量子估计算法的样本与查询复杂度接近最优，并为后续算法设计划定了明确基准。", "summary_source": "deepseek", "authors": [{"name": "Qisheng Wang"}], "featured_authors": [{"name": "Qisheng Wang"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
