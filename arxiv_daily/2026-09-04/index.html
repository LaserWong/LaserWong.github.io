opological phase transition", "abstract": "For a general class of two-dimensional non-interacting semi-metallic electron systems on a lattice, we derive an explicit formula for the whole conductivity matrix, by using Euclidean many-body formalism. The semi-metallic phase takes place whenever two Bloch bands touch at the Fermi energy with conical intersections and generally occurs at the transition between distinct integer quantum Hall phases. Unlike the longitudinal conductivity (which depends solely on the shape of the cones at the Fermi level), the transverse conductivity is remarkably determined both by the conical structures of the bands and by the nature of the two nearby topological phases. Generically, in the semi-metallic state, neither the longitudinal nor the transverse conductivities are quantized in integer multiples of a universal conductivity quantum; however, universality of the conductivity matrix is restored under the assumption of emergent rotational symmetry of the linearized Hamiltonian at the Fermi points. Using our formula, we compute the conductivity matrix for several physically relevant models of quantum Hall fluids at the topological phase transition, exhibiting cases where the transverse conductivity is quantized in half-integer multiples of $e^2/h$ and cases where it depends continuously on an external strain parameter, thus shedding light on its universality or non-universality features.", "url": "https://arxiv.org/abs/2609.03832", "type": "理论", "summary": "1. 该工作对一类二维无相互作用晶格半金属系统推导出完整电导率矩阵的显式公式，涵盖拓扑相变处能带锥形接触的一般情况。\n2. 其要点在于揭示纵向电导率仅由费米能级处锥形带结构决定，而横向电导率还依赖邻近整数量子霍尔相，且普适量子化唯有在线性化哈密顿量具有涌现旋转对称性时才恢复。\n3. 这为判断量子霍尔流体拓扑相变处横向电导率的半整数量子化或对外部应变连续依赖等普适与非普适行为提供了明确计算工具与理论判据。", "summary_source": "deepseek", "authors": [{"name": "Simone Fabbri"}, {"name": "Giovanna Marcelli"}, {"name": "Alessandro Giuliani"}], "featured_authors": [{"name": "Simone Fabbri"}, {"name": "Giovanna Marcelli"}, {"name": "Alessandro Giuliani"}], "author_count": 3}, {"id": "2609.03863", "category": "math-ph", "title": "Classification of abstract Bose field models", "abstract": "We classify a class of abstract Bose field models in quantum field theory up to unitary equivalence. The class includes abstract free Bose field models, abstract van Hove--Miyatake models, and infrared-renormalized van Hove--Miyatake models. Moreover, as an application of our classification, we classify quadratic interaction models. In particular, our results answer a question of A. Arai concerning the classification of infrared-renormalized van Hove--Miyatake models.", "url": "https://arxiv.org/abs/2609.03863", "type": "理论", "summary": "1. 本文对量子场论中一类包含自由玻色、van Hove–Miyatake 与红外重整化模型的抽象玻色场模型，在酉等价意义下给出完整分类。\n2. 主要技术贡献在于构造统一的分类框架并推广至二次相互作用模型，从而回答了 A. Arai 关于红外重整化 van Hove–Miyatake 模型分类的问题。\n3. 该结果有助于理解无红外截断场模型的等价结构，并为相关量子场模型的分类与表征问题提供可借鉴的方法。", "summary_source": "deepseek", "authors": [{"name": "Yasumichi Matsuzawa"}], "featured_authors": [{"name": "Yasumichi Matsuzawa"}], "author_count": 1}, {"id": "2609.04057", "category": "math-ph", "title": "Limits of Stochastic Semigroups and Block-Triangular Majorisation", "abstract": "We investigate limits of semigroups of stochastic matrices defined by their invariant distribution. Given probability vectors $\\gamma(\\beta)$ depending on a parameter $\\beta$, we introduce a notion of convergence as $\\beta\\to\\infty$ for the corresponding semigroups of $\\gamma(\\beta)$-preserving stochastic matrices and investigate the structure of the resulting limit. In general, the limiting semigroup differs from the semigroup preserving the limiting distribution, showing that these two operations do not commute. We develop a general framework for such limiting semigroups and study in detail the case in which the invariant distributions are Gibbs vectors at the inverse temperature $\\beta$. We show that the limiting semigroup consists of block-upper-triangular stochastic matrices subject to additional substochasticity constraints. We characterise and enumerate their extremal elements and determine the preorder on probability vectors induced by the action of the semigroup. The resulting notion of Block-Triangular majorisation interpolates between ordinary majorisation and upper triangular (aka unordered) majorisation. We show that it is completely characterised by a finite family of monotones and analyse the corresponding behaviour of Rényi $\\alpha$-entropies as $\\beta\\to\\infty$.", "url": "https://arxiv.org/abs/2609.04057", "type": "理论", "summary": "1. 该工作针对由不变分布γ(β)定义的一族随机矩阵半群，提出了参数β→∞时半群收敛极限的框架，并具体分析了γ为逆温度β吉布斯向量的情形。\n2. 其技术核心是证明极限半群为满足额外次随机约束的分块上三角随机矩阵，由它们诱导的Block-Triangular优序介于普通优序与上三角优序之间，且可被有限个单调量完全表征，同时决定了Rényi α熵在该极限下的行为。\n3. 这一结果揭示了取极限与保持极限分布两种构造的不对易性，为联系零温统计力学、优序理论及资源理论中的渐近转化问题提供了严格数学工具。", "summary_source": "deepseek", "authors": [{"name": "Fabio Deelan Cunden"}, {"name": "Jakub Czartowski"}, {"name": "Giovanni Gramegna"}, {"name": "Marilena Ligabò"}], "featured_authors": [{"name": "Fabio Deelan Cunden"}, {"name": "Jakub Czartowski"}, {"name": "Giovanni Gramegna"}, {"name": "Marilena Ligabò"}], "author_count": 4}, {"id": "2609.04060", "category": "math-ph", "title": "A simple derivation of the zero-temperature BCS functional from the reduced BCS Hamiltonian", "abstract": "We consider a grand-canonical reduced BCS Hamiltonian on the full fermionic Fock space with an attractive pairing interaction supported in an energy shell around the Fermi surface. For fixed chemical potential, we prove that the exact finite-volume ground-state energy differs from the minimum of the corresponding finite-volume BCS functional by a volume-independent error. As a consequence, the BCS variational principle is exact for the ground-state energy density in the thermodynamic limit.", "url": "https://arxiv.org/abs/2609.04060", "type": "理论", "summary": "1. 该工作从约化BCS哈密顿量出发，在固定化学势下证明有限体积基态能量与BCS泛函极小值之差存在与体积无关的误差界。\n2. 其核心在于不依赖能量壳宽度等额外假设，直接通过配对相互作用的谱结构导出严格估计，从而给出BCS变分原理精确性的简洁推导。\n3. 该结果确立热力学极限下基态能量密度由BCS泛函精确决定，为超导模型的严格分析与泛函方法的进一步应用提供了可靠基础。", "summary_source": "deepseek", "authors": [{"name": "Christian Hainzl"}, {"name": "Riccardo Panza"}], "featured_authors": [{"name": "Christian Hainzl"}, {"name": "Riccardo Panza"}], "author_count": 2}, {"id": "2609.02999", "category": "quant-ph", "title": "Computing with qLDPC Codes by Climbing the Chain Map Hierarchy", "abstract": "We develop a framework for logical computation with qLDPC codes that places logical Pauli, Clifford, and non-Clifford operations on the same footing. This brings the simple homological description of Pauli logicals to the patchwork landscape of logical Clifford and non-Clifford operations, providing a tool for the discovery of new logical gates. In particular, we define the chain map hierarchy: a family of chain complexes whose homology classes encode logical unitary and code surgery operations at any level of the Clifford hierarchy, precisely analogous to the chain complex description of Pauli logicals. Consequently, intuition for Pauli logicals can be leveraged to discover new logical operations on qLDPC codes. For instance, the familiar ability to deform Pauli logicals with stabilizers---i.e. boundaries of the chain complex---becomes a way to search for constant-depth unitary implementations of (non-)Clifford logical gates. Using this strategy, we discover constant-depth unitary implementations of the full logical Clifford group on any number of blocks of the 2D toric code, including within a single block, and addressable logical CCZ gates on any triple of logical qubits on any number of blocks of the 3D toric code. Beyond manifold codes, we find addressable non-Clifford gates on codes with many encoded qubits. The chain map hierarchy naturally encompasses and extends other constructions of logical gadgets, for instance providing a universal parameterization of cup products. As such, our work provides a unified, useful, and intuitive language for computing with qLDPC codes.", "url": "https://arxiv.org/abs/2609.02999", "type": "理论", "summary": "1. 该工作提出链映射层级框架，将 qLDPC 码上的 Pauli、Clifford 与非 Clifford 逻辑运算纳入同一同调描述。\n2. 其核心在于让链复形边界所对应稳定子形变成为搜索常深度酉实现的手段，并以此发现 2D 与 3D toric code 上的完整 Clifford 门及可寻址 CCZ 门。\n3. 这为量子 LDPC 码的逻辑门发现提供了统一且直观的语言，并有望推广至杯积等更多逻辑 gadget 的普适构造。", "summary_source": "deepseek", "authors": [{"name": "Rahul Sahay"}, {"name": "David M. Long"}, {"name": "Vedika Khemani"}], "featured_authors": [{"name": "Rahul Sahay"}, {"name": "David M. Long"}, {"name": "Vedika Khemani"}], "author_count": 3}, {"id": "2609.03021", "category": "quant-ph", "title": "Quantum low-density lattice codes", "abstract": "Gottesman-Kitaev-Preskill (GKP) codes provide a family of promising schemes for encoding discrete quantum information (qudits) into infinite-dimensional bosonic modes based on mathematical lattices. While such codes, when concatenated with discrete-variable codes, are relatively well studied, the construction and decoding of native GKP codes has largely remained open due to the computationally hard problems encountered. To address this challenge, we advocate a strategy of co-designing the decoder and the quantum error-correcting code itself by constructing lattices for which decoding is feasible: The requirement of efficient decoding effectively determines the quantum error-correcting code. This construction is built on classical low-density lattice codes (LDLCs), a lattice analogue of low-density parity-check codes, here lifted to families of GKP codes. Concretely, we introduce quantum versions of classical, randomly constructed LDLCs. We show that after suitable dimensionality reduction these codes have code properties comparable to or better than concatenated GKP-surface codes of equal number of modes. However, the GKP-LDLCs constructed here do not have a strictly sparse parity check matrix, which motivates our study of the performance of natively analog message-passing decoders originally developed for LDLCs when applied to concatenated GKP-LDPC codes. We show that the fully analog, linear-time decoder achieves performances close to state-of-the-art hybrid qubit-analog decoders. To facilitate future research on the structure and performance of general GKP codes, the relevant source code will be released in open-source Julia packages this http URL and this http URL .", "url": "https://arxiv.org/abs/2609.03021", "type": "理论", "summary": "1. 该工作提出一类量子低密度格码，将经典随机低密度格码构提升为GKP码族，并倡导译码器与纠错码的协同设计。\n2. 其要点在于用高效可译性反向确定格构造，降维后码参数可与等模式数的级联GKP-曲面码相当或更优。\n3. 全模拟线性时间消息传递译码性能接近混合译码方案，为一般GKP码的结构与译码极限研究提供了开源工具和明确进路。", "summary_source": "deepseek", "authors": [{"name": "Timo Hillmann"}, {"name": "Jens Eisert"}, {"name": "Francesco Arzani"}], "featured_authors": [{"name": "Timo Hillmann"}, {"name": "Jens Eisert"}, {"name": "Francesco Arzani"}], "author_count": 3}, {"id": "2609.03032", "category": "quant-ph", "title": "Approximate cubic phase states in a trapped ion", "abstract": "Universal quantum computation with continuous variables cannot be attained solely with a set of Gaussian operations, it requires the addition of a non-Gaussian element, at least of third order in the quadrature operators, such as the cubic phase state. In this work, we present a method to generate a quantum state in the vibrational mode of a trapped ion that exhibits characteristics compatible with the cubic phase state, such as the distinctive oscillating pattern in its Wigner function. This state emerges from the nonlinear Jaynes-Cummings interaction native to the trapped-ion model, and under the assumption of an initial coherent vibrational state with a large occupation number. Consequently, the evolved vibrational state approximates the cubic phase state with high fidelity, and we use the variance of a nonlinear combination of the quadratures to characterize it. Finally, we provide an analytical expression for its cubicity that shows the high performance of the approximate vibrational cubic phase state.", "url": "https://arxiv.org/abs/2609.03032", "type": "理论", "summary": "1. 该工作在囚禁离子振动模上提出一种制备近似三次相位态的方法，所得态呈现维格纳函数中的特征振荡结构。\n2. 其核心在于利用体系固有的非线性Jaynes-Cummings相互作用和大占据数初始相干态，并以正交算符非线性组合方差及三次性解析表达式刻画保真度。\n3. 这为连续变量通用量子计算提供了可行的非高斯资源，也为其它离子或声子平台的高保真非高斯态制备与验证指明方向。", "summary_source": "deepseek", "authors": [{"name": "C. Ventura-Velázquez"}, {"name": "Juan Mauricio Torres"}], "featured_authors": [{"name": "C. Ventura-Velázquez"}, {"name": "Juan Mauricio Torres"}], "author_count": 2}, {"id": "2609.03053", "category": "quant-ph", "title": "Multi-Boundary Many-Body Quantum Teleportation", "abstract": "Unlike standard quantum teleportation, many-body teleportation uses scrambling to transmit quantum information. In this protocol, initially localized information spreads over many degrees of freedom and is later refocused at the receiver by a simple coupling between the systems, followed by further many-body evolution. The protocol was developed from models of traversable wormholes in holography and has become a useful probe of scrambling. In particular, it can distinguish genuine scrambling from decoherence or noise when out-of-time-order correlators fail, and can reveal signatures of different scrambling mechanisms, including the distinctive behavior expected in holographic systems. Holography predicts that related protocols can transmit information between selected boundaries of multi-boundary wormhole geometries. Motivated by this setting, we study single-qubit many-body teleportation among three systems of qubits. The initial state consists of EPR pairs distributed among them, providing a simple analogue of an infinite-temperature three-boundary holographic state. We analyze the protocol with one-dimensional and all-to-all dynamics, both analytically and numerically using random circuits. We find that the third system suppresses teleportation once the spreading message reaches the region of qubits that are entangled with it. In one dimension, both the minimum coupling required for successful teleportation and the fidelity depend on the distance from the injection site to this region, a feature reminiscent of holographic causal shadows. For all-to-all dynamics, successful teleportation is instead restricted to early times and to sufficiently few qubits entangled with the third system. A third system therefore provides spatial, or subsystem, resolution of information spreading that is absent from the two-sided protocol. Our results offer a step toward many-body teleportation networks.", "url": "https://arxiv.org/abs/2609.03053", "type": "理论+数值", "summary": "1. 该文研究三个量子比特系统间的单比特多体隐形传态，以跨系统分布的EPR对构造无穷温三边界全息态的类比，并在一维与全连接随机电路下做解析和数值分析。\n2. 核心机制是第三个系统会抑制传态：当加扰信息扩散到与其纠缠的比特区域时传态被破坏；一维动力学中最小耦合及保真度取决于注入点到该区域的距离，类似全息因果阴影，全连接动力学则只允许早期且纠缠比特很少时成功。\n3. 这种三边界方案提供了双边界协议所不具备的空间分辨能力，可用于区分真实加扰与退相干或噪声，并为多体隐形传态网络研究提供明确出发点。", "summary_source": "deepseek", "authors": [{"name": "Tal Schwartzman"}, {"name": "Antonio F. Rotundo"}, {"name": "Raz Monsonego"}, {"name": "Shira Chapman"}], "featured_authors": [{"name": "Tal Schwartzman"}, {"name": "Antonio F. Rotundo"}, {"name": "Raz Monsonego"}, {"name": "Shira Chapman"}], "author_count": 4}, {"id": "2609.03065", "category": "quant-ph", "title": "Distinctness threshold for pseudorandom unitaries", "abstract": "Pseudorandomness is increasingly recognized as a key property of ensembles in quantum information theory, statistical mechanics, and quantum many-body physics. Yet it appears in two conceptually different forms: statistical pseudorandomness, embodied by unitary designs, and computational pseudorandomness captured by pseudorandom unitaries (PRUs). The relationship between these two forms of pseudorandomness remains surprisingly poorly understood. Existing PRU constructions reveal this interplay where a statistically randomizing ingredient, a unitary design, is combined with classical cryptographic primitives to produce computational pseudorandomness. We show that statistical pseudorandomness is not necessary for computationally pseudorandom unitaries. We do this by replacing the unitary $2$-design layer in the existing constructions with ensembles that are not even state $1$-designs, yet are sufficiently {\\em distinct}, a property we identify to be necessary for any PRU. This yields new non-adaptively secure PRU ensembles whose computational pseudorandomness is obtained without an underlying statistically pseudorandom quantum ensemble, such as a $2$-design. We characterize distinctness via an entangled analogue of anticoncentration and use it to show that distinctness already captures constraints on coherence and imaginarity of PRUs, while identifying broad classes of inputs for which the latter obstruction disappears, enabling real-valued PRUs even for certain (maximally) entangled states. As an application, we use lack of distinctness to constrain the conjectured pseudorandomness of the random phase-Hadamard ensemble to form a PRU.", "url": "https://arxiv.org/abs/2609.03065", "type": "理论", "summary": "1. 该工作证明统计伪随机性并非计算伪随机幺正变换（PRU）的必要条件，通过以仅满足“区分性”的系综替代既有构造中的幺正2-design层，构造了非自适应安全的PRU系综。\n2. 核心在于将区分性刻画为纠缠反集中性质，并用以阐明PRU的相干性与虚数性约束，表明对若干纠缠态可实现实值PRU。\n3. 作为应用，该结果以缺乏区分性限制了随机相位-Hadamard系综构成PRU的猜想，为厘清统计与计算伪随机性的边界及量子多体物理应用提供了判据。", "summary_source": "deepseek", "authors": [{"name": "Asad Raza"}, {"name": "Jens Eisert"}, {"name": "Bill Fefferman"}], "featured_authors": [{"name": "Asad Raza"}, {"name": "Jens Eisert"}, {"name": "Bill Fefferman"}], "author_count": 3}, {"id": "2609.03073", "category": "quant-ph", "title": "Optimized Matrix-Product State Simulations of Quantum Error Correction Circuits", "abstract": "Simulating quantum error correction (QEC) circuits including non-Clifford gates at scale is important to accelerate progress toward fault-tolerant quantum computing. Here we demonstrate that matrix product state (MPS) techniques can handle many QEC circuits exactly and without restriction on gate types. Crucially, we find that MPS efficiency depends sensitively on implementation choices, and we introduce a series of targeted optimizations that reduce bond dimensions and simulation time by several orders of magnitude compared to naive approaches. We illustrate this with examples including: (a) a rotated surface code quantum memory up to distance 11, (b) logical Bell-state preparation up to distance 9, (c) a 15-to-1 magic-state distillation circuit including hundreds of QEC rounds that we optimize to be simulated with only 11 logical qubits (187 physical qubits) and a maximal bond dimension of 64 in under 40 seconds, and (d) a narrow, deep random circuit that scales linearly with the number of T gates. These results demonstrate the importance of circuit-level optimizations and position MPS as a valuable complement to near-Clifford simulators for QEC circuits.", "url": "https://arxiv.org/abs/2609.03073", "type": "理论+数值", "summary": "1. 该工作系统展示了矩阵乘积态方法可精确模拟包含非Clifford门的量子纠错线路，并给出旋转表面码、逻辑贝尔态制备及魔态蒸馏等大规模实例。\n2. 其核心卖点是引入一系列针对线路实现方式的优化，将键维数与模拟时间相对朴素方案降低多个数量级，例如15到1魔态蒸馏线路仅需11个逻辑量子位和最大键维64，在40秒内完成。\n3. 这使矩阵乘积态模拟器成为近Clifford模拟器的重要补充，为容错量子计算线路的经典验证与基准测试提供了可行参考。", "summary_source": "deepseek", "authors": [{"name": "Asier Piñeiro Orioli"}, {"name": "Chen Zhao"}, {"name": "Guido Masella"}, {"name": "Tommaso Macrì"}, {"name": "Hengyun Zhou"}, {"name": "Shannon Whitlock"}], "featured_authors": [{"name": "Asier Piñeiro Orioli"}, {"name": "Chen Zhao"}, {"name": "Guido Masella"}, {"name": "Tommaso Macrì"}, {"name": "Hengyun Zhou"}, {"name": "Shannon Whitlock"}], "author_count": 6}, {"id": "2609.03092", "category": "quant-ph", "title": "Non-Kolmogorov-Arnold-Moser Quantum Sensors for Quantum Parameter Estimation", "abstract": "Non-KAM (Kolmogorov-Arnold-Moser) systems, when subjected to weak time-dependent perturbations, exhibit an abrupt transition to classical chaos through the breakdown of invariant phase-space tori. We showcase the utilization of non-KAM systems in the quantum regime as quantum sensors, leveraging their sensitivity at \\textit{resonances}. Quantum Fisher information (QFI) is a central quantity in quantum parameter estimation theory that measures how much information a quantum state contains about an unknown parameter that is encoded into it. In other words, it quantifies the sensitivity of a quantum state to small changes in that parameter. In this work, through numerical analysis in conjunction with analytical results, we study the performance of the non-KAM systems for quantum sensing applications by computing the QFI. We find that the growth of the QFI is remarkably enhanced when the resonance condition is satisfied. For frequency estimation under Floquet unitary encodings, we derive a transport bound: if the mean excitation number grows as $\\langle\\hat n(t)\\rangle\\sim t^{\\alpha}$, the QFI obeys $I(t)\\lesssim t^{2\\alpha+2}$. The quantum kicked harmonic oscillator, a paradigmatic non-KAM system, realizes the full hierarchy: localized dynamics ($\\alpha=0$) yield quadratic growth, delocalized diffusion along stochastic webs ($\\alpha=1$) yields quartic growth, and translationally invariant resonances ($\\alpha=2$) saturate the bound with anomalous hexic growth, $I(t)\\sim t^{6}$, established analytically at resonance $R=2$ and numerically at $R=4$. The enhancement stems from resonance-induced translational symmetry rather than exponential instability, identifying non-KAM resonances as a metrological resource distinct from chaos-assisted and criticality-based sensing.", "url": "https://arxiv.org/abs/2609.03092", "type": "理论+数值", "summary": "1. 该工作将非KAM量子系统用作量子传感器，通过数值与解析方法计算量子Fisher信息，研究其在弱周期扰动下共振处的参数估计性能。\n2. 针对Floquet幺正编码下的频率估计，作者导出由平均激发数标度决定的传输界I(t)≲t^{2α+2}，并证明量子受击谐振子可在平移不变共振处饱和该界，实现I(t)∼t^6的异常六次方增长。\n3. 该增强源于共振诱发的平移对称性而非指数不稳定性，这识别出非KAM共振为一类不同于混沌辅助与临界性传感的量子计量资源。", "summary_source": "deepseek", "authors": [{"name": "Naga Dileep Varikuti"}, {"name": "Sourav Manna"}, {"name": "Athreya Shankar"}, {"name": "Arul Lakshminarayan"}, {"name": "Vaibhav Madhok"}], "featured_authors": [{"name": "Naga Dileep Varikuti"}, {"name": "Sourav Manna"}, {"name": "Athreya Shankar"}, {"name": "Arul Lakshminarayan"}, {"name": "Vaibhav Madhok"}], "author_count": 5}, {"id": "2609.03194", "category": "quant-ph", "title": "Experimental validation of a compact fault-tolerant architecture for trapped ions", "abstract": "Quantum error correction (QEC) is beginning to enable logical operations that outperform their unencoded physical counterparts, but useful fault-tolerant computation will require more than low-error quantum memory. An effective architecture must orchestrate efficient logical encoding, low-overhead logical operations, and access to the non-Clifford resources required for universal computation. Here, we introduce and experimentally validate such an architecture based on the $[[20,2,6]]$ $C_4$-Helix code, designed for the early fault-tolerant regime. Using Quantinuum Helios, a 98-qubit trapped-ion quantum processor, we experimentally demonstrate the principal components of this architecture: we perform repeated quantum error correction with an error of $4.6^{+6.2}_{-2.6}\\times10^{-5}$ per logical qubit per QEC cycle. We benchmark the complete Clifford group on the two logical qubits of a single codeblock under active error correction, obtaining an error of $2.8^{+1.0}_{-1.6}\\times 10^{-4}$ per two-qubit logical Clifford. We further demonstrate a fault-tolerant chain-map interface between $C_4$-Helix and a distance-5 surface code, preparing a heterogeneous three-logical-qubit GHZ state with a fidelity lower bound of $99.925^{+0.068}_{-0.245}\\%$. In each case, the encoded implementation outperforms its corresponding unencoded physical baseline without relying on postselection. Circuit-level simulations indicate that improvements in physical fidelity bring the same architecture into the $10^{-6}$-$10^{-8}$ logical-error regime targeted for early fault-tolerant computation. Together, these results establish $C_4$-Helix as a hardware-validated fault-tolerant architecture rather than a bare quantum memory.", "url": "https://arxiv.org/abs/2609.03194", "type": "实验", "summary": "1. 该工作介绍并在98比特囚禁离子处理器Helios上实验验证了一种基于[[20,2,6]] C4-Helix码的紧凑容错架构。\n2. 其技术核心在于主动纠错下演示了两个逻辑比特的完整Clifford群，并通过容错链图接口与距离5表面码制备异构GHZ态，且均无需后选择地优于未编码基线。\n3. 这为走向早期容错计算提供了硬件验证基础，电路级模拟显示提升物理保真度可将逻辑错误率推进到10⁻⁶–10⁻⁸目标区间。", "summary_source": "deepseek", "authors": [{"name": "Noah Berthusen"}, {"name": "Ali Lavasani"}, {"name": "Asmae Benhemou"}, {"name": "M.S. Allman"}, {"name": "Joan Dreiling"}, {"name": "Brian Estey"}, {"name": "Cameron Foltz"}, {"name": "Trent Jacobs"}, {"name": "Michael Mills"}, {"name": "Annie Jihyun Park"}, {"name": "Adam P. Reed"}, {"name": "David Hayes"}, {"name": "Tzvetan S. Metodi"}, {"name": "Andrew C. Potter"}], "featured_authors": [{"name": "Noah Berthusen"}, {"name": "Ali Lavasani"}, {"name": "Asmae Benhemou"}, {"name": "David Hayes"}, {"name": "Tzvetan S. Metodi"}, {"name": "Andrew C. Potter"}], "author_count": 14}, {"id": "2609.03226", "category": "quant-ph", "title": "Revealing Many-Body Phases at finite temperatures through Quantum Coherence Distribution", "abstract": "We introduce a diagnostic framework based on the full probability distribution of quantum coherence to probe single-particle and many-body phases at finite temperature. We first apply this approach to the localization transition in the non-interacting Aubry-André model and then extend the analysis to its interacting counterpart, whose phase diagram is substantially richer. We show that the moments of the coherence distribution provide clear signatures of quantum phase transitions and capture the emergence of many-body phases. More importantly, we find that the entropy of the coherence distribution emerges as an even more powerful indicator, retaining clear signatures of the underlying quantum phases while remaining remarkably robust against increasing thermal fluctuations.", "url": "https://arxiv.org/abs/2609.03226", "type": "理论+数值", "summary": "1. 该工作提出一种以量子相干完整概率分布为基础的新型诊断框架，用于在有限温度下探测单粒子与多体量子相及其转变。\n2. 其技术卖点在于系统比较相干分布各阶矩与分布熵在非相互作用及相互作用Aubry-André模型中的表现，发现分布熵对热涨落高度稳健，能比传统矩更可靠地标记局域化与多体相的出现。\n3. 这一发现为在有限温度无序相互作用体系中识别量子相提供了不依赖基态或序参量的新途径，对热平衡态下的多体局域化及其他量子相研究具有直接参考价值。", "summary_source": "deepseek", "authors": [{"name": "Antonio Palamara"}, {"name": "Nicola Lo Gullo"}, {"name": "Antonello Sindona"}, {"name": "Francesco Plastina"}], "featured_authors": [{"name": "Antonio Palamara"}, {"name": "Nicola Lo Gullo"}, {"name": "Antonello Sindona"}, {"name": "Francesco Plastina"}], "author_count": 4}, {"id": "2609.03240", "category": "quant-ph", "title": "Quantum Complexity in Nuclear Scattering and Fission Dynamics", "abstract": "Quantum computers promise advantages for simulating strongly correlated quantum many-body systems, like atomic nuclei, that are beyond the reach of classical computers. Realizing this potential requires understanding the quantum complexity structure of the target problem. We investigate the time-evolution of two key indicators of quantum complexity, bipartite entanglement entropy and non-local magic (non-stabilizerness), in nuclear reaction dynamics. We analyze two representative dynamical processes: scattering in a one-dimensional model of strongly interacting fermions governed by the Negele potential, and a realistic simulation of $^{240}$Pu fission within time-dependent Hartree-Fock-Bogoliubov (TDHFB) theory. In the former case, we find that interactions dynamically generate both entanglement and non-local magic, leaving persistent signatures of quantum complexity in the outgoing states. In the latter, we observe that substantial quantum complexity survives in the spatial bipartition of daughter fragments well beyond scission. The presence of significant non-local magic and entanglement in both cases strongly indicate that quantum computers would provide substantial advantages for accurately simulating nuclear reaction dynamics.", "url": "https://arxiv.org/abs/2609.03240", "type": "理论+数值", "summary": "1. 该工作研究核散射与裂变动力学中量子复杂度的演化，通过一维强相互作用费米子散射及240Pu裂变的含时Hartree-Fock-Bogoliubov模拟，计算两体纠缠熵与非局域魔法。\n2. 其核心发现在于相互作用在出射态中动态产生并遗留纠缠与非局域魔法，且裂变碎片在断裂后仍保留显著空间量子复杂度。\n3. 这为量子计算机在强关联核反应模拟中可能提供的计算优势给出了定量判据，也启发了对重离子反应量子资源结构的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Saurabh V. Kadam"}, {"name": "Antonio Bjelčić"}, {"name": "Nicolas Schunck"}, {"name": "Kyle Wendt"}], "featured_authors": [{"name": "Saurabh V. Kadam"}, {"name": "Antonio Bjelčić"}, {"name": "Nicolas Schunck"}, {"name": "Kyle Wendt"}], "author_count": 4}, {"id": "2609.03272", "category": "quant-ph", "title": "Discrete-time quantum walks with energy-dependent coins", "abstract": "In this work, we extend the scattering quantum walk (SQW) framework to a lattice of energy-dependent point interactions. This yields, within the coined quantum walk (CQW) formalism, a coin operator that is directly related to the scattering matrix of zero-range potentials. The model thus provides a discrete-time quantum-walk (DTQW) analog of a periodic array of point interactions of the Kronig-Penney type, where the walker's wavenumber serves as a continuous, physically transparent control parameter for the coin operation. We analyze the spectra and the dynamics of position probability and entanglement, yielding distinct results for specific energies and point interactions. We relate the spectral structure to the spatial probability distribution and explicitly characterize the long-time entanglement behavior for each point interaction. The transmission modulus determines the quasienergy gap, bandwidth, and maximum group velocity, while also controlling the long-time coin-position entanglement for the initial state considered. The four families of one-dimensional point interactions ($\\delta$, $\\delta'$, crossed and asymmetric) realize qualitatively distinct transmission profiles and span the full range of behavior, including enhanced or strongly suppressed spreading and oscillatory entanglement.", "url": "https://arxiv.org/abs/2609.03272", "type": "理论", "summary": "1. 该工作将散射量子行走推广到含能量依赖点相互作用的晶格，在硬币量子行走框架中构造出由零程势散射矩阵决定的硬币算符，从而给出Kronig-Penney型周期点阵的离散时间量子行走类比。\n2. 其核心是以行走子波数作为连续物理控制参数，证明透射模幅值决定准能隙、带宽与最大群速度，并同时控制所考察初始态的长时硬币-位置纠缠行为。\n3. 四种一维点相互作用（δ、δ′、交叉与不对称）实现定性不同的透射轮廓，覆盖增强或强烈抑制展宽及振荡纠缠等行为，为通过可调散射势设计离散时间量子行走的能带与纠缠提供清晰路径。", "summary_source": "deepseek", "authors": [{"name": "Alana Spak dos Santos"}, {"name": "Thiago T. Tsutsui"}, {"name": "Fabiano M. Andrade"}], "featured_authors": [{"name": "Alana Spak dos Santos"}, {"name": "Thiago T. Tsutsui"}, {"name": "Fabiano M. Andrade"}], "author_count": 3}, {"id": "2609.03323", "category": "quant-ph", "title": "Variable-Cliff Nielsen Geometry and an Exponent -4/3 Lower Bound for the Infinite-Cliff Diameter", "abstract": "Let $D=2^n$ and $M=3n+9\\binom n2$. We study the right-invariant one-step-cliff metric $d_Q$ on $\\operatorname{PU}(D)$, with unit penalty on Pauli weights one and two and penalty $Q$ on all higher weights. If $M/Q_D\\to0$ and $MQ_D^{3/4}/D^2\\to0$, then, for every fixed $0<x<\\pi/\\sqrt3$, \\[ \\mu_D\\bigl(B_{Q_D}([I],x\\sqrt{Q_D})\\bigr)\\le e^{-c_xD^2}. \\] Here $\\mu_D$ is normalized Haar measure. Thus the Haar-typical distance from the identity and the diameter are both asymptotic to $(\\pi/\\sqrt3)\\sqrt{Q_D}$ throughout the window $M\\ll Q_D\\ll D^{8/3}M^{-4/3}$. Choosing $Q_D=\\kappa D^{8/3}M^{-4/3}$ with sufficiently small fixed $\\kappa>0$ yields a Haar-typical lower bound of order $D^{4/3}M^{-2/3}$ for the corresponding infinite-cliff Carnot--Carathéodory distance, outside an $e^{-\\Omega(D^2)}$ exceptional set. The infinite-cliff diameter therefore has exponential lower rate at least $4/3$, disproving Brown's exponent-one conjecture. The same estimate gives a fixed-error no-ancilla two-qubit circuit lower bound of the same order.", "url": "https://arxiv.org/abs/2609.03323", "type": "理论", "summary": "1. 论文对 PU(2^n) 上可变惩罚 Q 的一步克利夫度量，研究 Haar 典型距离并导出无限克利夫直径下界指数 4/3。\n2. 其技术核心是在 M≪Q≪D^{8/3}M^{-4/3} 窗口内证明典型距离与直径均渐近 (π/√3)√Q_D。\n3. 该结果否定 Brown 指数为一猜想，并给出同阶的固定误差无辅助双比特线路下界。", "summary_source": "deepseek", "authors": [{"name": "Honghuai Fang"}], "featured_authors": [{"name": "Honghuai Fang"}], "author_count": 1}, {"id": "2609.03360", "category": "quant-ph", "title": "Nonlinear Dissipation and Hopf Criticality in Driven Dissipative Collective Spins", "abstract": "Self-sustained oscillations in open many-body systems can be organized by two distinct dynamical ingredients: the selection of a finite-amplitude background attractor and the subsequent control of its neutral phase. We develop this bifurcation-based picture for driven-dissipative collective spins and show how the microscopic dissipative structure determines the available background and its response to explicit U(1) breaking. In the thermodynamic-limit mean-field dynamics, a single linear U(1)-covariant jump produces only polar fixed-point backgrounds, whereas nonlinear covariant dissipation provides amplitude-dependent saturation and stabilizes a finite-latitude self-sustained-oscillator manifold through a supercritical Hopf bifurcation. Under coherent U(1) breaking, exact resonance leads to a reversible double-zero degeneracy with vanishing critical frequency rather than a standard Hopf onset. Finite detuning unfolds this singularity into a genuine finite-frequency Hopf boundary, which exists only on the self- sustained-oscillator side and can be either supercritical or subcritical. By contrast, a single linear dissipative U(1)-breaking jump cannot generate a standard Hopf instability: when its phase-pinning invariant vanishes the azimuthal direction remains neutral, whereas otherwise the phase-locked fixed points have a purely real Jacobian spectrum. These results establish a general design principle: nonlinear covariant dissipation selects the self-sustained background, while the structure of the symmetry-breaking channel determines whether the resulting local response is double-zero, genuinely Hopf, or non-Hopf.", "url": "https://arxiv.org/abs/2609.03360", "type": "理论", "summary": "1. 该工作为驱动耗散集体自旋建立基于分岔的动力学图景，阐明微观耗散结构如何决定热力学极限平均场中的背景吸引子及其对U(1)破缺的响应。\n2. 其核心在于：单个线性U(1)协变跳变仅产生极向不动点背景，而非线性协变耗散通过振幅依赖饱和在超临界Hopf分岔处稳定有限纬度的自持振荡流形；精确共振给出零频可逆双零简并，有限失谐才展开为仅存在于振荡侧的真正Hopf边界。\n3. 这确立了明确设计原理：非线性协变耗散选择自持振荡背景，而对称破缺通道的结构决定局域响应是双零、Hopf或非Hopf，为开放量子平台的极限环调控提供直接指引。", "summary_source": "deepseek", "authors": [{"name": "Shu Yang"}, {"name": "Jun Wang"}, {"name": "Weidong Li"}, {"name": "Cangtao Zhou"}, {"name": "Jian-Song Pan"}, {"name": "Jianwen Jie"}], "featured_authors": [{"name": "Shu Yang"}, {"name": "Jun Wang"}, {"name": "Weidong Li"}, {"name": "Cangtao Zhou"}, {"name": "Jian-Song Pan"}, {"name": "Jianwen Jie"}], "author_count": 6}, {"id": "2609.03419", "category": "quant-ph", "title": "In defence of the Ehrenfest mean-field molecular dynamics", "abstract": "Re-visiting the problem of the coupled electronic--nuclear motion, we prove that the so called `mean-field' Ehrenfest picture is an exact theory, rather than an approximation, in the classical limit for nuclei. By establishing its full equivalence to the much more involved Exact Factorization approach to the problem (Abedi {\\it et al.}, Europhys. Lett. {\\bf 106}, 33001 (2014)), our conclusion rehabilitates the mean-field Ehrenfest molecular dynamics as a simple, effective, while formally exact scheme, amenable to the use within the framework of the time-dependent density functional theory.", "url": "https://arxiv.org/abs/2609.03419", "type": "理论+数值", "summary": "1. 该论文重新考察电子-原子核耦合运动，证明在原子核经典极限下平均场Ehrenfest图像是精确理论而非近似。\n2. 其核心论据在于证明Ehrenfest方案与更复杂的精确分解方法完全等价，从而消除了其形式上的近似嫌疑。\n3. 这使简洁的Ehrenfest分子动力学可被合理纳入含时密度泛函理论框架，为非绝热动力学模拟提供了严格而低成本的理论基础。", "summary_source": "deepseek", "authors": [{"name": "Vladimir U. Nazarov"}], "featured_authors": [{"name": "Vladimir U. Nazarov"}], "author_count": 1}, {"id": "2609.03440", "category": "quant-ph", "title": "Convolution absorbing boundaries for explicit-circuit quantum simulation of the wave equation", "abstract": "Explicit quantum circuits for the wave equation, built by Hamiltonian simulation, are restricted to closed domains, in which outgoing waves reflect off the edge of the computational region and return. We lift that restriction with absorbing boundaries of the convolution type - a complex-frequency-shifted perfectly matched layer realised through exponential-kernel memory variables - and make the resulting non-unitary dynamics quantum-implementable by Schrodingerisation. We obtain three results. First, explicit gate-level circuits for the absorbing evolution, obtained by extending a Bell- basis term-evolution circuit to projector-valued operator strings and Trotterising to second order; these run end to end on seventeen to twenty-one qubits and agree with exact references to within a tenth of a percent to a percent. Second, a structural obstruction: the memory form of the absorbing generator carries an irreducibly indefinite Hermitian part, whose largest eigenvalue grows as the square root of the absorption strength divided by the grid spacing and survives any diagonal rescaling of the memory fields. The known recovery threshold for Schrodingerisation then makes the post-selection cost grow exponentially in the simulated time. Third, a remedy: a Lyapunov symmetrizer, precomputed classically, renders the transformed generator dissipative and replaces that time-dependent penalty with a time-independent conditioning factor of several hundred, measured on grids of up to four thousand unknowns and saturating under mesh refinement. The crossover is early: past it the symmetrized recovery is cheaper by four to twenty-six orders of magnitude in post-selection cost, and at the longest horizons tested it is the only recovery that works.", "url": "https://arxiv.org/abs/2609.03440", "type": "理论+数值", "summary": "1. 该工作为波动方程的显式量子电路模拟引入了卷积型吸收边界，借助Schrödingerisation将非酉动力学转化为可在量子线路中实现的含记忆变量演化。\n2. 其技术核心在于用投影算子串的二阶Trotter化构造出可端到端运行的十七至二十一量子比特线路，并通过Lyapunov对称化器将原本不可约不定生成元变为耗散形式，从而把后选择代价从随时间指数增长转为数百量级的时间无关条件因子。\n3. 这一对称化与恢复代价的早期交叉为大规模波动方程量子模拟提供了可行路径，并启发在更广泛非厄米量子模拟中利用经典预计算消除结构性耗散障碍。", "summary_source": "deepseek", "authors": [{"name": "Hoang Anh Nguyen"}, {"name": "Ali Tura"}], "featured_authors": [{"name": "Hoang Anh Nguyen"}, {"name": "Ali Tura"}], "author_count": 2}, {"id": "2609.03491", "category": "quant-ph", "title": "Weakly Driven and Finite Detuning Boundary Time Crystals Enabled by Low-Dissipation Dynamical Channels", "abstract": "Spontaneous breaking of continuous time-translation symmetry in driven-dissipative systems gives rise to boundary time crystals (BTCs), characterized by persistent oscillations sustained by coherent driving and collective dissipation. Conventional BTCs, however, typically require strong driving and exact atom-drive resonance, imposing stringent constraints on their realization. Here we consider two atomic ensembles coupled to a common Markovian reservoir and show that shared dissipation organizes dissipation-free and low-dissipation modes into dynamically accessible low-dissipation channels, enabling BTCs under weak driving and finite detuning. Finite detuning further selects a unique stable limit cycle from an initial-state-dependent family of oscillatory trajectories. Our results establish low-dissipation dynamical channels as a route to robust BTCs under relaxed driving and resonance conditions.", "url": "https://arxiv.org/abs/2609.03491", "type": "理论", "summary": "1. 该工作研究两个原子系综耦合于共同马尔可夫库的驱动耗散系统，提出利用低耗散动力学通道实现弱驱动和有限失谐下的边界时间晶体。\n2. 其核心在于共享耗散将无耗散与低耗散模式组织为可访问的低耗散通道，从而放宽强驱动和精确共振约束，并借助有限失谐从初态依赖振荡族中选出唯一稳定极限环。\n3. 该结果确立了低耗散动力学通道作为在宽松驱动与共振条件下制备鲁棒边界时间晶体的普适途径，为相关耗散多体系统研究提供了新启发。", "summary_source": "deepseek", "authors": [{"name": "Xiang Guo"}, {"name": "Xiaojun Zhang"}, {"name": "Zhihai Wang"}], "featured_authors": [{"name": "Xiang Guo"}, {"name": "Xiaojun Zhang"}, {"name": "Zhihai Wang"}], "author_count": 3}, {"id": "2609.03625", "category": "quant-ph", "title": "Quantum Quasi-Monte Carlo: a window for pre-asymptotic quantum advantage", "abstract": "Numerical integration with Monte Carlo methods is a central computational task in many scientific and industrial applications, including financial derivative pricing and risk management. Classical Monte Carlo algorithms are computationally demanding: achieving an accuracy $\\epsilon$ typically requires a number of function evaluations scaling as $O(1/\\epsilon^2)$. Quantum-accelerated Monte Carlo methods based on quantum amplitude estimation can in principle quadratically improve this dependence. However, \\textit{quasi}-Monte Carlo methods have not been explored in the quantum context. In this work, we introduce a quantum quasi-Monte Carlo algorithm that combines low-discrepancy nets with quantum amplitude estimation. The proposed method prepares the quasi-random point set coherently in superposition. The method does not yield an asymptotic improvement over classical quasi-Monte Carlo, since the total error separates into a discretization error, determined by the finite net, and a quantum estimation error. Instead, we explore a pre-asymptotic advantage window: for a target accuracy that would classically require $2^q$ low discrepancy points, one can prepare a higher-resolution net of size $2^Q$, with $Q>q$, in superposition and reach the same accuracy using significantly fewer function queries. This window can be controlled by tuning the circuit resolution and amplitude-estimation parameters, making the approach relevant for practical regimes where the number of queries is finite rather than asymptotically large.", "url": "https://arxiv.org/abs/2609.03625", "type": "数值", "summary": "1. 该工作提出一种量子拟蒙特卡洛算法，将低差异拟随机网与量子振幅估计相结合，用于数值积分任务。\n2. 其技术要点是利用相干叠加制备规模为2^Q的高分辨率低差异点集，并将总误差分解为有限网的离散误差与量子估计误差，从而在Q>q的预渐近范围内以更少函数查询达到经典2^q点集所能实现的目标精度。\n3. 通过调节线路分辨率与振幅估计参数可控制这一优势窗口，这为金融定价与风险管理等有限查询预算场景下的实用量子加速提供了明确思路。", "summary_source": "deepseek", "authors": [{"name": "Paolo Recchia"}, {"name": "Zhan Yu"}, {"name": "Kelvin Koor"}, {"name": "Patrick Rebentrost"}], "featured_authors": [{"name": "Paolo Recchia"}, {"name": "Zhan Yu"}, {"name": "Kelvin Koor"}, {"name": "Patrick Rebentrost"}], "author_count": 4}, {"id": "2609.03638", "category": "quant-ph", "title": "Entanglement dynamics of accelerated atoms with environment-induced interactions", "abstract": "We investigate the influence of environment-induced interactions on the entanglement dynamics of two uniformly accelerated atoms coupled to a fluctuating massless scalar field with a reflecting boundary. The two atoms are aligned vertically to the boundary. The entanglement behaviors are influenced by the competition between the environment-induced interatomic and the environment-induced atom-plate interactions, which can be characterized by certain critical values. The maximum of concurrence generated during evolution decreases non-monotonically with the acceleration, which implies the anti-Unruh phenomenon can exist for some situations even when both environment-induced interatomic and the environment-induced atom-plate interactions are considered.", "url": "https://arxiv.org/abs/2609.03638", "type": "理论", "summary": "1. 该文研究具有反射边界时两个垂直对齐且匀加速原子通过环境诱导相互作用展现的纠缠动力学。\n2. 其要点是揭示环境诱导的原子间与原子-平板相互作用之间的竞争可由临界值刻画，且并发度最大值随加速度非单调变化。\n3. 这表明在同时计入两类环境诱导相互作用时仍可能出现反Unruh现象，为考察加速体系中的量子信息与真空涨落提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Xuerui Zhou"}, {"name": "Chenhao Ma"}, {"name": "Zixu Zhao"}], "featured_authors": [{"name": "Xuerui Zhou"}, {"name": "Chenhao Ma"}, {"name": "Zixu Zhao"}], "author_count": 3}, {"id": "2609.03703", "category": "quant-ph", "title": "Fractalizing spacetime: Floquet codes with fractonic excitations that are immobile in space and time", "abstract": "We generalize fractalization, a procedure for the construction of fracton models, from space to spacetime. We apply spacetime fractalization to construct fracton floquet codes with syndrome excitations that have limited mobility in space and time. This extends the notion of fracton order to intrinsically dynamical quantum phases of matter that are inequivalent to static fracton phases. We find spacetime type-II fracton floquet codes which have no topological excitations that are mobile in space or time. These codes exhibit an extreme form of quantum discrete time crystal order with response periods that scale exponentially in their linear system sizes. In this context, the no-strings rule that characterizes type-II fractons leads to a superlinear scaling of the floquet code fault-distance with time, potentially lowering the time overhead required for quantum error correction.", "url": "https://arxiv.org/abs/2609.03703", "type": "理论", "summary": "1. 该工作将分形化构造从空间推广到时空，用于构建具有时空受限移动性综合征激发的Floquet分形子码，即时空分形化Floquet码。\n2. 其核心在于得到时空第二类分形子Floquet码，拓扑激发在空间与时间上均不可移动，响应周期随系统线性尺寸指数增长，且无弦规则使码的容错距离随时间的超线性增大。\n3. 该结果将分形子序延伸至不等价于静态分形相的内禀动态量子相，有望降低量子纠错所需的时间开销并为低开销容错方案提供思路。", "summary_source": "deepseek", "authors": [{"name": "Juliette Soule"}, {"name": "Dominic J. Williamson"}], "featured_authors": [{"name": "Juliette Soule"}, {"name": "Dominic J. Williamson"}], "author_count": 2}, {"id": "2609.03706", "category": "quant-ph", "title": "Q-Edge: Symmetry-Reduced Quantum Simulation of Structured Extreme Dependence", "abstract": "High-dimensional simulation of multivariate extremes is fundamentally limited by the combinatorial complexity of dependence, often more than by the scarcity of extreme observations. We show that symmetry admits a lossless orbit-space representation that preserves structured extreme dependence while replacing an exponentially large dependence space with a compact set of symmetry classes. Based on this principle, we develop Q-Edge (Quantum Extreme Dependence Engine), a symmetry-reduced quantum framework that operates directly in orbit space, enabling scalable simulation and digital twins of structured extreme systems. By transferring symmetry into the data representation rather than the quantum circuit, Q-Edge allows unconstrained quantum generative models to exploit dramatically reduced state spaces. For a 30-dimensional problem, approximately 1.6 million angular states collapse to 256 orbit states, reducing the required quantum representation from about 21 qubits to 8. Our results establish a general computational principle for scalable quantum simulation of structured extreme dependence.", "url": "https://arxiv.org/abs/2609.03706", "type": "理论+数值", "summary": "1. 该工作提出Q-Edge框架，在轨道空间中实现对称约化的量子模拟，用以克服高维极值相依建模中依赖结构组合爆炸带来的根本困难。\n2. 其技术核心是将对称性编入数据表示而非量子电路，以无损轨道表示将约160万个角向状态压缩为256个轨道态，使30维问题的量子比特需求从约21个降到8个。\n3. 这为结构化极端相依的可扩展量子模拟建立了一般计算原理，并为高维极端事件数字孪生的实用化提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Hongrui Zhang"}, {"name": "Paolo Recchia"}, {"name": "Ying Chen"}], "featured_authors": [{"name": "Hongrui Zhang"}, {"name": "Paolo Recchia"}, {"name": "Ying Chen"}], "author_count": 3}, {"id": "2609.03748", "category": "quant-ph", "title": "Thermodynamic Irreversibility from Inaccessible Endogenous Quantum Histories", "abstract": "Microscopic unitary dynamics preserves all fine information, yet an isolated finite system can show a robust thermodynamic window in which the entropy associated with a restricted record rises. We ask why information hidden from the current record usually fails to rebuild a low-entropy macrostate. For a fixed projective record, every finite step separates exactly into the evolution predicted from the record alone and an exact correction carried by unresolved microscopic structure. The record-only contribution starts only at second order in time, so all instantaneous change of the record comes from hidden currents between macrostates. We derive the exact entropy rate, separate entropy-spreading from return-oriented currents, and resolve those currents into energy-gap amplitudes. Transitions with the same gap add coherently, revealing how the Hamiltonian and the microscopic state organize hidden information for return. In interacting mixing dynamics the current power is spread over many frequencies; free and deliberately commensurate controls progressively concentrate it, and the engineered dynamics reconstructs a low-entropy macrostate. An independent distribution-level test separates hidden dynamical activity from finite-step return, and an exact classical measure-preserving counterpart shows which parts of the construction are not uniquely quantum. Within the specified record and observation window, irreversibility is therefore not loss of microscopic information, but the failure of that information to organize currents that restore macroscopic order.", "url": "https://arxiv.org/abs/2609.03748", "type": "理论+数值", "summary": "1. 该工作针对固定投影记录下的孤立有限量子系统，建立热力学不可逆性的精确动力学分解，并导出熵率及隐藏流对宏观态演化的作用。\n2. 技术卖点在于证明仅由记录决定的演化在时间二阶才出现，瞬时变化全部来自隐微观态间的相干流；同能隙跃迁的相干叠加及工程化公度控制可集中流功率，重构低熵宏观态。\n3. 这表明在限定记录与观察窗口内，不可逆性并非微观信息丢失，而是信息未能组织恢复性电流；经典保测对应物划定了这一构造中非量子机制的确切边界。", "summary_source": "deepseek", "authors": [{"name": "Borhan Ahmadi"}], "featured_authors": [{"name": "Borhan Ahmadi"}], "author_count": 1}, {"id": "2609.03769", "category": "quant-ph", "title": "Metricity of separable quantum optimal transport with the Hilbert-Schmidt cost", "abstract": "We prove that the square root of the separable quantum optimal transport cost associated with the orthogonal projection onto the antisymmetric subspace defines a genuine distance between density matrices. Equivalently, this establishes the triangle inequality for the order-two Beatty-França quantum optimal transport construction induced by the Hilbert-Schmidt distance between pure states. The result also proves metricity of the corresponding distance derived from separable SWAP fidelity. The proof replaces the unavailable gluing argument by convex-roof duality and a dimension-independent interpolation result for Hermitian operators.", "url": "https://arxiv.org/abs/2609.03769", "type": "理论", "summary": "1. 该工作证明了在Hilbert-Schmidt纯态代价下，由反对称子空间投影诱导的可分离量子最优输运代价的平方根是密度矩阵空间上的度量。\n2. 技术核心是通过凸包对偶和关于厄米算子的维数无关插值不等式绕过不可用的粘合引理，从而建立三角不等式，并证明可分离SWAP保真度距离亦满足度量化条件。\n3. 这为纠缠约束下的量子态最优输运几何提供了严格判据，相关三角不等式有望用于量子信息处理中的距离估计与资源刻画。", "summary_source": "deepseek", "authors": [{"name": "Tomasz Miller"}], "featured_authors": [{"name": "Tomasz Miller"}], "author_count": 1}, {"id": "2609.03778", "category": "quant-ph", "title": "Quantisation of Abstract Data Types", "abstract": "In this paper, we introduce a notion of abstract quantum data type within the framework of universal algebra. This notion provides an algebraic foundation for describing data abstraction in quantum programming. We formally define a quantisation of classical data types and show that their equational specifications can be soundly lifted to the quantum setting. Two standard quantisation methods for classical functions, namely the bit oracle and the phase oracle, arise as special cases of this general construction. We illustrate the framework with applications to quantum arrays and quantum error-correcting codes, showing how they can be understood through the lens of data-type quantisation. We further establish conditions under which quantisation preserves structural relationships and constructions of classical data types, including embeddings, isomorphisms, and products.", "url": "https://arxiv.org/abs/2609.03778", "type": "理论", "summary": "1. 作者将经典抽象数据类型概念引入量子编程，在泛代数框架下提出抽象量子数据类型的严格定义，为量子程序中数据抽象的规格说明与验证建立代数基础。\n2. 该工作的核心是一个一般性的经典数据类型量化构造，可将原数据类型的等式公理规范可靠地提升至量子情形，并令比特预言机与相位预言机统一作为该构造的两个特例出现。\n3. 文章证明了这一量化在嵌入、同构与积等结构保持条件下得以保留，并借助量子数组与量子纠错码示例其应用场景，为量子编程语言中数据类型理论的系统发展提供可扩展的基础。", "summary_source": "deepseek", "authors": [{"name": "Mingsheng Ying"}, {"name": "Zhicheng Zhang"}, {"name": "Kean Chen"}], "featured_authors": [{"name": "Mingsheng Ying"}, {"name": "Zhicheng Zhang"}, {"name": "Kean Chen"}], "author_count": 3}, {"id": "2609.03802", "category": "quant-ph", "title": "Quantum Query Complexity of Finding a Tarski Fixed Point on a High-Dimensional Grid", "abstract": "The Knaster-Tarski fixed-point theorem states that every monotone function over a complete lattice has a fixed point. Beyond its fundamental role in order theory, the theorem and its algorithmic variants have found broad applications in areas such as economics, game theory, and programming languages. While the query complexity of finding a Tarski fixed point has been extensively studied in classical models, comparatively little is known in the quantum setting. We prove an $\\Omega(k\\log n)$ quantum query lower bound for finding a fixed point of a monotone function on $[n]^k$, using the nonnegative spectral adversary method. In the two extremal regimes $n = 2$ and $k = 1$, our quantum lower bound matches the previous classical lower bounds $\\Omega(k)$ and $\\Omega(\\log n)$, respectively. For $n, k\\geq 2$, our bound improves the best previous classical lower bound when $n < k$ and is within a factor of $\\log n / \\log k$ compared to the known classical lower bound when $n \\geq k$. To construct the adversary matrix, we develop the Tree--Filtration Adversary Method. Besides yielding our lower bound, the method offers a more transparent combinatorial interpretation of the nonnegative spectral adversary method. When the hard instances of a problem admit a tree-like organization and suggest an intuition analogous to classical decision-tree lower bounds, our method provide a promising approach to establishing quantum complexity lower bounds.", "url": "https://arxiv.org/abs/2609.03802", "type": "理论+数值", "summary": "1. 该工作证明了在[n]^k格上寻找单调函数Tarski不动点的量子查询复杂度下界为Ω(k log n)，并指出在n=2与k=1极端情形下与已有经典下界一致。\n2. 其技术核心是发展树-过滤adversary方法，通过非负谱adversary构造adversary矩阵，并为下界证明提供了更透明的组合解释。\n3. 该方法为具有树状困难实例结构的问题提供了新途径，有助于将经典决策树下界直觉系统推广到量子查询复杂度设定。", "summary_source": "deepseek", "authors": [{"name": "Tongyang Li"}, {"name": "Weiran Ma"}, {"name": "Ziyi Yang"}, {"name": "Xingyu Zhao"}], "featured_authors": [{"name": "Tongyang Li"}, {"name": "Weiran Ma"}, {"name": "Ziyi Yang"}, {"name": "Xingyu Zhao"}], "author_count": 4}, {"id": "2609.03864", "category": "quant-ph", "title": "Exact Compatibility Geometry of Three-Qubit Entanglement", "abstract": "We present a permutation-symmetric supporting relation between the pairwise concurrences and the three-tangle in three-qubit system, whose extrema are attained only by the symmetric $W$ and GHZ local-unitary classes. Furthermore, by introducing the concept of a four-dimensional compatibility body, we show that our proposed global relation and the previous CKW relation can be uniformly viewed as different supporting directions of the same achievable set. Subsequently, we provide a necessary-and-sufficient semi-algebraic characterization of the complete four-dimensional compatibility of a three-qubit pure state. Based on this, we can conversely describe the compatibility between entangled components: given the remaining entangled components, the missing two-body entangled component can only take values within a precise parameter-free interval. We demonstrate that the above construction also applies to arbitrary concurrence-generated entanglement measures.", "url": "https://arxiv.org/abs/2609.03864", "type": "理论", "summary": "1. 该工作研究三量子比特纠缠的精确相容几何，提出两两并发与三叶纠缠度之间置换对称的支撑关系，其极值仅由对称W和GHZ局域幺正类取得。\n2. 其技术卖点是引入四维相容体，将前述全局关系与CKW关系统一视为同一可达集的不同支撑方向，并给出三比特纯态完整四维相容性的充要半代数刻画。\n3. 由此可反推纠缠分量间的相容性：给定其余分量时，缺失的两体纠缠分量只能落在精确的无参数区间；该构造适用于任意由并发生成的纠缠度量。", "summary_source": "deepseek", "authors": [{"name": "Wei Song"}, {"name": "Xiao-Lan Zong"}, {"name": "Ming Yang"}], "featured_authors": [{"name": "Wei Song"}, {"name": "Xiao-Lan Zong"}, {"name": "Ming Yang"}], "author_count": 3}, {"id": "2609.03925", "category": "quant-ph", "title": "Ultra-Precise Quantum Projective Designs in Constant Depth", "abstract": "Random quantum objects are powerful resources for quantum information processing, yet exact Haar randomness is costly and typically unnecessary. We introduce an explicit sparse commuting circuit ensemble on $n$ qubits that reproduces low-order Haar moments in the stringent relative-error sense. The circuit consists of a sparse Clifford phase layer followed by independent single-qubit Clifford gates. Acting on a simple product state, the resulting ensemble forms $\\epsilon$-approximate projective $2$- and $3$-designs in relative error, with the required logarithmic interaction degree being asymptotically optimal within this circuit family. It admits an ancilla-free implementation of quantum depth $O(\\log(n/\\epsilon))$ on an all-to-all architecture, as well as an adaptive constant-depth implementation---in fact, depth seven---using $O(n\\log(n/\\epsilon))$ ancilla qubits. Departing from existing shallow-design paradigms, our analysis exploits the intrinsic moment structure of commuting phase circuits; at third order, this requires a new block decomposition and combinatorial analysis that also suggests a route toward higher-order shallow designs. Our results show that precise Haar-like statistics can emerge from sparse commuting dynamics with remarkably low quantum resources, with applications to randomized characterization, quantum metrology, quantum algorithms, and many-body physics.", "url": "https://arxiv.org/abs/2609.03925", "type": "理论+数值", "summary": "1. 该工作在 n 量子比特上构造显式稀疏对易电路系综，由稀疏 Clifford 相位层与独立单比特 Clifford 门构成，以相对误差再现低阶 Haar 矩并形成 ε-近似投影 2-与 3-设计。\n2. 其核心在于用对易相位电路的矩结构及新块分解证明对数相互作用度在该族内渐近最优，并给出无需辅助比特时 O(log(n/ε)) 深度和借助 O(n log(n/ε)) 辅助比特的自适应常数深度（深度七）实现。\n3. 这展示了以极低量子资源从稀疏对易动力学涌现精确类 Haar 统计的途径，为高阶浅层设计及随机化表征、量子计量、量子算法和多体物理研究提供可行方向。", "summary_source": "deepseek", "authors": [{"name": "Qingyue Zhang"}, {"name": "Junjie Chen"}, {"name": "Zhou You"}, {"name": "You Zhou"}], "featured_authors": [{"name": "Qingyue Zhang"}, {"name": "Junjie Chen"}, {"name": "Zhou You"}, {"name": "You Zhou"}], "author_count": 4}, {"id": "2609.03928", "category": "quant-ph", "title": "Approximate maximum-likelihood decoding via truncated free energies", "abstract": "Maximum-likelihood decoding (MLD) achieves the minimum logical error rate of stabilizer codes under known i.i.d. Pauli noise, but its exact evaluation is \\#P-hard. Practical pipelines therefore approximate MLD by minimum-weight decoding (MWD), retaining only the lowest-weight recovery per syndrome and discarding the coset degeneracy. The minimum-weight search is in turn implemented by stochastic solvers. We introduce approximate maximum-likelihood decoding (AMLD), a black-box framework that recycles the candidate samples discarded by stochastic inner decoders into a per-class truncated free-energy estimator. For every logical class represented in the candidate pool, the estimator is provably bounded below by the exact free energy and above by the empirical minimum weight. AMLD returns the logical class minimizing the estimated free energy with linear classical overhead. In SA-based Ising-decoder benchmarks, AMLD closes up to $83\\%$ of the MWD--MLD threshold gap across the toric and color codes under bit-flip and depolarizing noise. The largest threshold improvement, from $17.28\\%$ to $18.62\\%$, occurs on the $6.6.6$ color code under depolarizing noise. We further demonstrate AMLD on the $[[144,12,12]]$ bivariate-bicycle code, whose bit-flip decoding problem has a hypergraph structure. This application requires neither matching-based enumeration nor code-specific tensor-network contraction. At $p=0.05$, AMLD reduces the logical error rate by $13\\%$ relative to MWD evaluated on the same BP-OSD candidate pool.", "url": "https://arxiv.org/abs/2609.03928", "type": "理论+数值", "summary": "1. 该工作提出近似最大似然解码（AMLD）黑箱框架，重用随机内层解码器丢弃的候选样本构建逐逻辑类截断自由能估计，并以线性经典开销选出最小自由能逻辑类。\n2. 其核心在于该估计量严格夹在精确自由能与经验最小权重之间，可在不依赖匹配枚举或码专用张量网络缩并的情况下恢复码空间简并信息，逼近最优解码。\n3. 在SA Ising解码基准中，AMLD在环面码与色码上填补最多83%的最小权重解码与最大似然解码阈值差距，并为双变量双环码等一般稳定子码提供通用性能增强思路。", "summary_source": "deepseek", "authors": [{"name": "Yuanqi Liu"}, {"name": "Weilei Zeng"}, {"name": "Junjie Wu"}, {"name": "Lingling Lao"}], "featured_authors": [{"name": "Yuanqi Liu"}, {"name": "Weilei Zeng"}, {"name": "Junjie Wu"}, {"name": "Lingling Lao"}], "author_count": 4}, {"id": "2609.03944", "category": "quant-ph", "title": "On the geometry and typicality of quantum magic", "abstract": "We prove that, for an $n$-qubit system of dimension $d=2^n$, every state satisfying $\\operatorname{Tr}(\\rho^2)\\le 1/(d-a_\\ast)$, with $a_\\ast=0.458327\\cdots$, lies inside the stabilizer polytope and is therefore magic-free. Combining this result with general geometric properties of high-dimensional polytopes, we establish quantitative estimates for the Hilbert--Schmidt inradius and volume radius of the stabilizer polytope, and use them to characterize the typicality of magic in random induced states obtained by tracing out a $k$-dimensional subsystem from a $d\\times k$-dimensional Haar-random pure state. We prove a sharp phase transition in the probability of such states having magic, whose transition dimension $k_\\star$ is bounded between $\\Omega(d^2/\\log^2d)$ and $\\mathcal{O}(d^2)$. We further prove that the number of facets of the stabilizer polytope lies between $\\exp[\\Omega(d^2/\\log^2 d)]$ and $\\exp[\\mathcal{O}(d^2\\log^2 d)]$, substantially improving upon the previous quasipolynomial lower bound and implying that any exact description of the magic-free region requires a doubly exponential number of linear inequalities in the number of qubits. Overall, our results show that the stabilizer polytope exhibits near-maximal geometric complexity allowed for a high-dimensional polytope with a certain number of vertices.", "url": "https://arxiv.org/abs/2609.03944", "type": "理论", "summary": "1. 该工作证明对n量子比特系统（维数d=2^n），满足Tr(ρ^2)≤1/(d−a*)的任意态必位于稳定子多胞形内，因而不具有量子魔法。\n2. 结合高维多胞形几何，其给出稳定子多胞形的Hilbert–Schmidt内径与体积半径的定量界，并刻画随机诱导态中魔法的典型性：概率发生尖锐相变，过渡维数k*介于Ω(d^2/log^2 d)与O(d^2)之间。\n3. 进一步证明稳定子多胞形的面数介于exp[Ω(d^2/log^2 d)]与exp[O(d^2 log^2 d)]之间，改进此前拟多项式下界，表明精确描述无魔法区域需双指数多个线性不等式，几何复杂度接近高维多胞形极限。", "summary_source": "deepseek", "authors": [{"name": "Zhenhuan Liu"}, {"name": "Z-Wen Liu"}], "featured_authors": [{"name": "Zhenhuan Liu"}, {"name": "Z-Wen Liu"}], "author_count": 2}, {"id": "2609.04037", "category": "quant-ph", "title": "Discrete time crystals in disordered anisotropic Heisenberg chains", "abstract": "A discrete time crystal is an out-of-equilibrium phase of matter characterized by the spontaneous breaking of discrete time-translation symmetry. Using extensive numerical simulations based on matrix-product-state methods, we provide evidence for discrete time-crystalline behavior in strongly disordered spin chains with Heisenberg interactions, including the isotropic point, subject to periodic driving. Starting from a many-body localized regime, we observe that rotations induced by delta kicks produce a pronounced subharmonic response at half the drive frequency in spin observables. We investigate the stability of this response against rotation-angle errors through entanglement entropy, quantum Fisher information, short-range spin correlations, and restricted-control ergotropy. Increasing the rotation error reveals an intermediate dynamical regime separating the time-crystalline and Floquet-localized responses. In this regime, most observables exhibit signatures of weakly correlated dynamics reminiscent of Anderson localization.", "url": "https://arxiv.org/abs/2609.04037", "type": "理论+数值", "summary": "1. 该工作通过基于矩阵乘积态的大规模数值模拟，为强无序各向异性海森堡自旋链（含各向同性点）在周期δ脉冲旋转驱动下的离散时间晶体行为提供了证据。\n2. 其要点是从多体局域化初态出发，利用纠缠熵、量子Fisher信息、短程自旋关联及受限控制可提取功验证半频次谐波响应，并刻画该响应随转动角误差增加的变化。\n3. 在时间晶体与Floquet局域化响应之间发现一个中间动力学区域，其中多数观测量呈弱相关且类似Anderson局域化的演化，为区分两类非平衡相指明了可检验的数值标志。", "summary_source": "deepseek", "authors": [{"name": "Francesco Formicola"}, {"name": "Grazia Di Bello"}, {"name": "Antonio De Candia"}, {"name": "Giulio De Filippis"}, {"name": "Carmine Antonio Perroni"}], "featured_authors": [{"name": "Francesco Formicola"}, {"name": "Grazia Di Bello"}, {"name": "Antonio De Candia"}, {"name": "Giulio De Filippis"}, {"name": "Carmine Antonio Perroni"}], "author_count": 5}, {"id": "2609.04064", "category": "quant-ph", "title": "Quantum-Enhanced Phase Estimation with Photon-Added Even and Odd Coherent States in an SU(1,1) Interferometer", "abstract": "We investigate phase estimation in an SU(1,1) interferometer employing $m$-photon-added even and odd coherent states as nonclassical input resources. The phase sensitivity is evaluated through intensity detection and the error propagation method, while the ultimate precision limit is determined from the quantum Cramér-Rao bound with the quantum Fisher information serving as the relevant metrological quantity. Our results demonstrate that photon addition significantly enhances the phase sensitivity, increases the quantum Fisher information, and reduces the quantum Cramér-Rao bound, leading to a clear improvement over the corresponding even and odd coherent states. Furthermore, the achievable sensitivity exceeds the standard quantum limit and gradually approaches the Heisenberg scaling with increasing photon-addition number. We also find that the $m$-photon-added even coherent states exhibit a modest advantage over their odd counterparts. As $m$ increases, however, this distinction becomes progressively weaker, suggesting that photon addition diminishes the role of the initial parity of the coherent state in determining the interferometric performance.", "url": "https://arxiv.org/abs/2609.04064", "type": "理论+数值", "summary": "1. 该工作研究了SU(1,1)干涉仪中以m光子增加偶/奇相干态为输入的非经典相位估计，并通过强度探测、误差传播及量子Fisher信息确定灵敏度与精度极限。\n2. 核心结果是光子增加显著提高了量子Fisher信息并降低了量子Cramér-Rao界，使相位灵敏度超越标准量子极限，且随m增大逐步趋近海森堡标度。\n3. 偶光子增加态相对奇态仅有微弱优势并随m增大而消失，说明光子增加弱化了初始宇称的作用，为优化干涉量子计量提供了有益思路。", "summary_source": "deepseek", "authors": [{"name": "Abdelmajid El Maaroufi"}, {"name": "Mouad Ait Maskour"}, {"name": "Bouchra Maroufi"}, {"name": "Mohammed Daoud"}, {"name": "Saeed Haddadi"}], "featured_authors": [{"name": "Abdelmajid El Maaroufi"}, {"name": "Mouad Ait Maskour"}, {"name": "Bouchra Maroufi"}, {"name": "Mohammed Daoud"}, {"name": "Saeed Haddadi"}], "author_count": 5}, {"id": "2609.04065", "category": "quant-ph", "title": "Small-quench Loschmidt dynamics near quantum critical points", "abstract": "We study the short-time Loschmidt dynamics after a small sudden quench near a quantum critical point. We show that the initial quadratic growth of the Loschmidt rate function is governed by the variance of the quench operator per system size. For a local quench operator, this variance density is exactly equal to the spatial sum of the equal-time connected two-point correlation function in the initial ground state. This relation connects the early-time Loschmidt response to static critical correlations. Assuming power-law correlations at criticality, we classify the finite-size scaling of the short-time coefficient by the scaling dimension of the quench operator. In one dimension, the coefficient is finite, logarithmically enhanced, or algebraically enhanced with system size. We illustrate this operator dependence in the transverse-field Ising chain, where transverse-field and longitudinal-field quenches couple to different critical operators. We also discuss the first correction beyond the quadratic regime using the fourth cumulant of the post-quench Hamiltonian.", "url": "https://arxiv.org/abs/2609.04065", "type": "理论+数值", "summary": "1. 该工作研究量子临界点附近小幅度突然猝灭后的短时Loschmidt动力学。\n2. 核心在于证明Loschmidt速率函数的初始二次增长由猝灭算符的方差密度决定，后者恰为初态等时连通两点关联函数的空间求和，并可由猝灭算符标度维数对短时系数进行有限尺寸标度分类。\n3. 这为通过短时猝灭响应提取临界关联与算符普适性提供可行途径，同时可用四阶累积量讨论二次区间以上的动力学修正。", "summary_source": "deepseek", "authors": [{"name": "Kohei Kobayashi"}], "featured_authors": [{"name": "Kohei Kobayashi"}], "author_count": 1}, {"id": "2609.04076", "category": "quant-ph", "title": "Algebraic Operator Decomposition: A Partitioned Architecture for Noise-Resilient Quantum Computing", "abstract": "We present an operator-decomposition architecture that mathematically maps a global operator into independently executable local operators, reducing the maximum quantum circuit depth at the cost of classical reconstruction and sampling overhead. By framing complex Quantum Circuits around an operator in a vector space that can be algebraically pre-decomposed, AOD complements quantum error correction and error-mitigation approaches by performing algebraic decomposition before quantum execution. Our approach leans in the computer science definition of a Monoid: a design pattern and mathematical concept consisting of a data type, a combining function that is associative, and a safe identity (neutral) element that does not change other values when combined. Simulation wise we define a MapReduce programming model where the addition (+) is the reducer, thus leveraging a naturally stable commutative monoid which carries zero \"negative-probability tax\" or phase conflicts. Furthermore, we define a Vector Space of Linear Operators over Additive Abelian Groups that benefit from this paradigm, including: Inner Products, Series expansions, Traces and Convolutions. Finally, we present the mathematical foundations and simulation results for this paradigm.", "url": "https://arxiv.org/abs/2609.04076", "type": "理论+数值", "summary": "1. 该工作提出代数算子分解架构，将全局算子预先分解为可独立执行的局部算子，以经典重构与采样开销为代价压低最大量子电路深度。\n2. 其核心在于利用幺半群的结合律与安全单位元构建MapReduce式分解，执行前从代数层面规避负概率税与相位冲突，并适用于内积、级数展开、迹与卷积等算子空间。\n3. 该方案与量子纠错和误差缓解正交，可作为编译前预处理层，为近期含噪量子计算中的深度压缩与容错设计提供补充路径。", "summary_source": "deepseek", "authors": [{"name": "Wladimir Silva"}], "featured_authors": [{"name": "Wladimir Silva"}], "author_count": 1}, {"id": "2609.04104", "category": "quant-ph", "title": "Gravitationally Induced Entanglement Across an Event Horizon", "abstract": "It has long been assumed that a particle---having crossed a black hole event horizon unentangled with another particle in the exterior universe---can no longer dynamically entangle with that particle. Here, we demonstrate within a gravitational retarded-potential model that entanglement can in fact be created from scratch between freely falling spatial superpositions across an event horizon. Yet, extracting this state radially requires non-inertial deceleration, triggering soft-graviton bremsstrahlung, and establishing a strict dephasing bound in terms of entangling phase, $\\Gamma\\ge\\frac{729}{160\\pi}\\Phi$. This decoheres the entangled state. By contrast, equivalent macroscopic optical masses allow local tangential harvesting of entanglement via quantum erasure, thus revealing a remarkable geometric duality: Spacetime irreversibly degrades entanglement the moment the localized mass is dragged away from the horizon, while allowing the transverse teleportation of its entangled state to infinity.", "url": "https://arxiv.org/abs/2609.04104", "type": "理论", "summary": "1. 该工作在一个引力推迟势模型中证明，事件视界两侧自由落体的空间叠加态之间可从零开始产生动态引力纠缠。\n2. 其要点是径向提取该纠缠需非惯性减速，伴随软引力子轫致辐射并满足严格退相界 Γ≥729/(160π)Φ；而宏观光学质量可经切向量子擦除实现纠缠提取。\n3. 这表明局域质量被拖离视界时，时空沿径向不可逆地衰减纠缠，却允许纠缠态横向传送至无穷远，为视界引力纠缠几何对偶提供了可定量模型。", "summary_source": "deepseek", "authors": [{"name": "Hatim Salih"}], "featured_authors": [{"name": "Hatim Salih"}], "author_count": 1}, {"id": "2609.04119", "category": "quant-ph", "title": "Non-local Magic: closed-form solution and equivalence with magic of purification", "abstract": "Non-local magic quantifies the non-stabilizerness of a bipartite quantum state that cannot be removed by local unitary transformations. Despite its natural definition, its evaluation generally requires a difficult optimization over local unitaries. Here, we show that for the log-stabilizer fidelity this optimization admits an exact closed-form analytic solution depending only on the Schmidt spectrum. We then introduce the magic of purification, defined as the minimum pure-state magic over all purifications of a mixed state, and show that it naturally induces a resource theory whose free states are normalized stabilizer-code projectors. For the log-stabilizer fidelity, the magic of purification admits a distance-based formulation in terms of the Uhlmann fidelity. Remarkably, we prove that non-local magic coincides with the minimum magic of purification along the unitary orbit of the reduced density operator. Our results provide both an efficient analytical characterization and a mixed-state resource-theoretic interpretation of non-local magic.", "url": "https://arxiv.org/abs/2609.04119", "type": "理论+数值", "summary": "1. 该工作针对双态量子态的非定域魔法，证明基于对数稳定子保真度的优化具有只依赖施密特谱的闭式解析解，并据此引入纯化魔法的概念。\n2. 其核心在于给出纯化魔法的距离型表述（借助Uhlmann保真度），并建立其自由态为归一化稳定子码投影子的资源理论，同时证明非定域魔法等于约化密度矩阵幺正轨道上纯化魔法的最小值。\n3. 这为多体纠缠与非稳定子资源的统一刻画提供了高效解析工具，也为混合态量子资源理论在容错或量子信息处理中的应用开辟了途径。", "summary_source": "deepseek", "authors": [{"name": "Michele Viscardi"}, {"name": "Lorenzo Leone"}, {"name": "Alioscia Hamma"}], "featured_authors": [{"name": "Michele Viscardi"}, {"name": "Lorenzo Leone"}, {"name": "Alioscia Hamma"}], "author_count": 3}, {"id": "2609.04160", "category": "quant-ph", "title": "Vanilla Exact Synthesis of CNOT Circuits is NP-hard", "abstract": "Exact CNOT synthesis asks for a minimum-size CNOT circuit implementing an invertible linear transformation. Although several related synthesis models have been shown to be computationally hard, their hardness proofs rely on additional structure such as restricted qubit connectivity, encoded inputs, or unrestricted intermediate variables. The complexity of the most basic setting---identity input, a fixed number of labelled qubits, no ancillas, and all-to-all CNOT connectivity---had remained unresolved. In this work, we prove that the decision version of this vanilla exact CNOT synthesis problem is NP-complete, and consequently that its optimization version is NP-hard. Our proof gives a polynomial-time reduction from the Hamiltonian-path problem on grid graphs in two steps. First, we isometrically embed the grid graph into a hypercube via a unary encoding map. We then encode this hypercube Hamiltonian path problem into vanilla exact CNOT synthesis. The main challenge is that CNOT synthesis specifies only the final parity matrix and cannot directly enforce the intermediate vertex visits required by a Hamiltonian path. To overcome this difficulty, we introduce extra recorder qubits that encode the required intermediate vertex visits into the final transformation, forcing any CNOT circuit implementation to realize the intended path structure. Beyond CNOT synthesis, our result directly implies hardness for several related problems, including the shortest word problem over $\\mathrm{GL}(n,2)$, distance computation on Cayley graphs over $\\mathrm{GL}(n,2)$, minimization of sequential XOR programs, and exact synthesis of phase polynomial circuits.", "url": "https://arxiv.org/abs/2609.04160", "type": "理论+数值", "summary": "1. 该工作证明了最基础设定下精确CNOT综合的判定问题为NP完全，优化问题为NP困难，其中输入为单位变换、固定标记量子比特、无辅助比特且全连接。\n2. 其技术核心是从网格图哈密顿路问题出发，经一元编码等距嵌入超立方体，并引入记录量子比特将中间访问信息编码进最终变换以绕过CNOT综合仅能约束最终奇偶矩阵的困难。\n3. 该结果直接蕴含若干相关问题的困难性，包括GL(n,2)上的最短词问题、Cayley图距离计算、顺序XOR程序最小化及相位多项式电路的精确综合。", "summary_source": "deepseek", "authors": [{"name": "Chenjian Li"}, {"name": "Ji Guan"}], "featured_authors": [{"name": "Chenjian Li"}, {"name": "Ji Guan"}], "author_count": 2}, {"id": "2609.04165", "category": "quant-ph", "title": "Parameterised graph theory for tensor networks: entanglement rerouting, structural simplification, and agnostic tomography", "abstract": "Parameterised graph theory studies how the complexity of graph-theoretic problems depends on structural parameters of the input graph. This perspective has proved useful in analysing tensor-network simulation (Markov and Shi, 2008). Its implications for tensor-network representations and tomography are less well understood. In particular, which graph parameters determine whether a tensor-network state (TNS) admits a tractable matrix product state (MPS) or tree tensor network (TTN) representation, and which control the complexity of learning the state? We address these questions using parameterised graph theory. First, we show that cutwidth and tree-cutwidth bound the bond dimension overhead required to represent a TNS as an MPS or TTN. In the TTN case, tree-cutwidth also bounds the local dimension of the grouped subsystems. The proofs are based on entanglement rerouting, a tensor-network analogue of rerouting information in a classical network. Second, we derive graph-dependent upper bounds on the sample and computational complexity of realisable TNS tomography, with exponents that depend on cutwidth, tree-cutwidth, and a new graph parameter, learning complexity, which we bound in terms of degree and treewidth. We obtain these results by extending the disentangling MPS learner of (Cramer et al., 2010), as analysed further in (Bakshi et al., 2025; Lin et al., 2025), to TTNs and to tensor networks on arbitrary known graphs. Finally, we extend the framework beyond the realisable setting. For an arbitrary input state, our agnostic learner outputs a pure state whose fidelity is within additive error $\\epsilon$ of the optimum over tensor-network states on the given graph with a given bond dimension, with explicit graph-dependent bounds on sample and computational complexity.", "url": "https://arxiv.org/abs/2609.04165", "type": "理论+数值", "summary": "1. 该工作运用参数化图论，系统刻画了张量网络态约化为矩阵乘积态或树张量网络态所需的键维开销，以及态层析的样本与计算复杂度。\n2. 其核心在于提出纠缠重路由机制，以割宽与树割宽界定结构简化成本，并引入“学习复杂度”参数统一描述可实现与非可实现层析的图依赖上界。\n3. 这为任意已知图结构上的张量网络态学习建立了通用理论框架，并对容错量子态表征与验证提供可操作的复杂度判据。", "summary_source": "deepseek", "authors": [{"name": "Matthias C. Caro"}, {"name": "Natalie McHugh"}, {"name": "Sergii Strelchuk"}], "featured_authors": [{"name": "Matthias C. Caro"}, {"name": "Natalie McHugh"}, {"name": "Sergii Strelchuk"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
