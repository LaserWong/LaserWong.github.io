teraction- and field-driven Lifshitz transitions generate conformal critical phases with effective central charges $c_{\\rm eff}=1/2$, $1$, $3/2$, $2$, and $3$, including a multicritical point where Ising and Luttinger-liquid sectors coexist. Importantly, the central charge is not determined simply by the number of lattice gap closings or Fermi points, but by the number and conformal content of independent low-energy continuum sectors after accounting for lattice symmetries, reciprocal-lattice identifications, and mode equivalences. Thus, Lifshitz transitions may leave the conformal anomaly unchanged or modify the central charge depending on whether spectral reconstruction generates new independent continuum sectors. Real- and momentum-space entanglement spectra provide complementary microscopic signatures, revealing both the conformal content and momentum-space organization of critical modes. Our results establish a microscopic framework linking Fermi-point topology to emergent CFTs and show how interaction-driven spectral reconstruction can generate higher-central-charge criticality and unconventional multicritical behavior.", "url": "https://arxiv.org/abs/2609.03708", "type": "理论", "summary": "1. 该工作在一维扩展量子自旋链中研究了费米点拓扑与涌现共形临界性之间的微观联系，体系含竞争性团簇相互作用、交换各向异性及横场。\n2. 其核心发现是相互作用和场驱动的Lifshitz跃迁可产生中心荷为1/2、1、3/2、2和3的共形临界相（含Ising与Luttinger液体扇区共存的多临界点），且中心荷由计入晶格对称性与倒格矢识别后的独立低能连续区数目决定，而非费米点数或能隙闭合数。\n3. 该框架将费米点拓扑与涌现CFT联系起来，表明谱重构可生成更高中心荷临界性，并为在扩展自旋链中探测非常规共形临界态提供了实空间与动量空间纠缠谱的互补判据。", "summary_source": "deepseek", "authors": [{"name": "Mohammad Abbasi"}, {"name": "Saeed Mahdavifar"}], "featured_authors": [{"name": "Mohammad Abbasi"}, {"name": "Saeed Mahdavifar"}], "author_count": 2}, {"id": "2609.03752", "category": "cond-mat", "title": "Real-space Floquet topology written by the orbital angular momentum of light", "abstract": "Floquet engineering usually treats light as a uniform control field that changes the topology of an entire driven material. Here we show that structured light carrying orbital angular momentum (OAM) enables a different regime, in which topology is written directly in real space. For ultrathin topological insulator films, circularly polarized Laguerre--Gaussian beams generate a radial Floquet mass whose sign changes define a topological annulus bounded by two concentric chiral ring modes. The transition is helicity selective: below a thickness-dependent critical frequency, left-circularly polarized light drives mass inversion, whereas right-circularly polarized light increases the gap and leaves the film trivial. Independently, the OAM quantum number shifts and reshapes the annulus without changing the frequency, intensity, or helicity. In the decoupled-surfaces limit, the same mechanism produces a purely Floquet-induced topological mass and a vortex-core zero mode. These results identify photon OAM as a control parameter for nonequilibrium topology and provide a route to programmable topological landscapes in quantum materials.", "url": "https://arxiv.org/abs/2609.03752", "type": "理论", "summary": "1. 本文展示，携带轨道角动量的涡旋光可在超薄拓扑绝缘体薄膜中直接将Floquet拓扑写入实空间。\n2. 圆偏振拉盖尔-高斯光诱导径向Floquet质量反转，其符号变化勾勒出由两个同心手征环模包围的拓扑环；转变由厚度决定的临界频率控制并依赖螺旋性，而OAM量子数可在不变更频率、强度或螺旋性的情况下移动并重塑该环。\n3. 该结果将光子轨道角动量确立为非平衡拓扑的独立调控自由度，为在量子材料中生成可编程拓扑景观及涡旋核零模提供了切实途径。", "summary_source": "deepseek", "authors": [{"name": "Mohammad Shafiei"}, {"name": "Milorad V. Milošević"}], "featured_authors": [{"name": "Mohammad Shafiei"}, {"name": "Milorad V. Milošević"}], "author_count": 2}, {"id": "2609.03766", "category": "cond-mat", "title": "Ground-State Phase Diagram, Higher-Winding Topology, and Lifshitz Criticality in an Anisotropic Four-Spin XX Chain", "abstract": "We investigate the quantum critical and topological properties of a spin-$1/2$ XX chain with anisotropic four-spin cluster interactions in a transverse magnetic field. The interplay of exchange anisotropy, cluster interactions, and the external field produces a rich phase diagram with multiple gapped topological phases and distinct quantum critical boundaries. We identify several Lifshitz-type transitions arising from reconstructions of the low-energy Fermi-point structure, including an unconventional multicritical point where distinct critical branches intersect and the momentum-space topology undergoes a singular reorganization. In the isotropic limit, a conventional Lifshitz transition emerges through the merging and annihilation of Fermi points, revealing distinct mechanisms of Fermi-point reconstruction within the same model. The gapped phases are characterized by quantized winding numbers $\\nu=0,\\pm1,-2,$ and $\\pm3$, with the higher-winding phases induced by the extended cluster interactions. The $\\nu=\\pm3$ phases exhibit a richer topological structure than conventional short-range Kitaev-type chains and are separated from other sectors by field- and interaction-driven gap closings. These topological distinctions are further reflected in characteristic degeneracy patterns of the lowest levels of the bulk entanglement spectrum. Our results demonstrate that anisotropic multispin interactions provide a versatile route to realizing higher-winding topological phases and unconventional multicriticality in one-dimensional quantum systems.", "url": "https://arxiv.org/abs/2609.03766", "type": "理论+数值", "summary": "1. 该论文研究横向磁场下具有各向异性四自旋簇相互作用的自旋-1/2 XX链，确定其基态相图，其中包含多个有能隙拓扑相和不同量子临界边界。\n2. 技术卖点在于揭示低能费米点结构重构所导致的Lifshitz型相变，包括一个临界分支相交且动量空间拓扑奇异重组的多临界点，以及由扩展簇相互作用诱导的ν=±3高绕数拓扑相。\n3. 这表明各向异性多自旋相互作用是一维量子系统中实现更高绕数拓扑相和非常规多临界性的有效途径。", "summary_source": "deepseek", "authors": [{"name": "Mohammad Abbasi"}, {"name": "Faraz Valeh"}, {"name": "Saeed Mahdavifar"}], "featured_authors": [{"name": "Mohammad Abbasi"}, {"name": "Faraz Valeh"}, {"name": "Saeed Mahdavifar"}], "author_count": 3}, {"id": "2609.03772", "category": "cond-mat", "title": "Heesch Nodal Lines in Inadmissible Achiral Antiferromagnets", "abstract": "Recently, a new class of Weyl semimetals in antiferromagnets named Heesch Weyl semimetals was discovered, which have inadmissible chiral magnetic point group symmetries (inadmissible magnetic point groups are incompatible with ferromagnetic order) and distinctive surface Fermi arcs. In Heesch Weyl semimetals, the Weyl points are pinned at high symmetry momenta with two-dimensional irreducible corepresentations in the Brillouin zone. As the Weyl points are pinned, the Weyl points with opposite topological charges cannot emerge or be brought together for creation and annihilation as in conventional Weyl semimetals. In this work, we show that when mirror or rotoinversion symmetries are restored so that the point group becomes achiral, long doubly degenerate lines connecting Weyl points with opposite topological charges emerge. We call these lines the Heesch nodal lines (HNLs) and their host materials the Heesch nodal line antiferromagnets. HNLs result in a large number of two-dimensional massless Dirac cones for planes intercepting the HNLs in the Brillouin zone. Moreover, a large subset of the HNL antiferromagnets has the special property that the lowest nonvanishing order of the nonlinear anomalous Hall effect starts with the third order. First-principles calculations on representative collinear and noncollinear antiferromagnets, such as MnTe, CrSb, and Mn$_3$GaN, confirm our predictions on the presence of HNLs. When the inadmissible symmetry is broken by strain, the double degeneracy of the HNLs is lifted and the associated massless Dirac cones are gapped out, providing a route to realizing sizable anomalous Hall effects in antiferromagnetic crystals. We conclude that all inadmissible antiferromagnets without parity-time symmetry are topological. They are either Heesch Weyl antiferromagnets or Heesch nodal line antiferromagnets.", "url": "https://arxiv.org/abs/2609.03772", "type": "理论+数值", "summary": "1. 该工作证明，在恢复镜面或旋转反演对称性的不可允手性反铁磁体中，连接相反拓扑荷Weyl点的双简并线——Heesch节线——必然出现。\n2. 其核心在于这些节线使截线平面产生大量二维无质量狄拉克锥，并可使最低阶非线性反常霍尔效应始自三阶；第一性原理计算在MnTe、CrSb和Mn3GaN中证实该预言。\n3. 这揭示所有无PT对称性的不可允反铁磁体均为拓扑材料，且应变可打开节线能隙并诱发显著反常霍尔效应，为反铁磁输运调控提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Xing-Yao Guo"}, {"name": "Chung-Yuen Chan"}, {"name": "Zi-Ting Sun"}, {"name": "Kam Tuen Law"}], "featured_authors": [{"name": "Xing-Yao Guo"}, {"name": "Chung-Yuen Chan"}, {"name": "Zi-Ting Sun"}, {"name": "Kam Tuen Law"}], "author_count": 4}, {"id": "2609.03841", "category": "cond-mat", "title": "The Casimir free energy of peptide films on a silicon substrate: Impact of dielectric-to-metal transition in silicon and nanoparticles in peptide", "abstract": "Using the Lifshitz theory of the van der Waals and Casimir forces, we calculate the Casimir free energy of thin peptide films deposited on silicon substrates. The Casimir free energy is found as a function of film thickness for different fractions of water in the film, in the presence of either nonmagnetic or magnetic nanoparticles, and under the impact of irradiation of a silicon substrate with laser pulses or dopants resulting in the dielectric-to-metal phase transition. It is shown that for a dielectric silicon there is the borderline value of the film thickness, such that the Casimir free energy is negative and contributes to the film stability for thicker films, but is positive and makes the film less stable for thinner ones. According to our results, the borderline value of peptide film thickness decreases with increasing volume fractions of water and in the film. This decrease is more pronounced for the magnetic nanoparticles and becomes stronger with increasing their radius. The borderline value of peptide film thickness is found as a function of the fraction of water in the film. If the silicon substrate is in metallic state, the Casimir free energy of peptide coating is always positive, which makes it less stable. Possible applications of the obtained results in organic electronics and biomedicine are discussed.", "url": "https://arxiv.org/abs/2609.03841", "type": "理论", "summary": "1. 该工作基于Lifshitz理论计算了硅基底上肽薄膜的Casimir自由能随膜厚、含水率及非磁或磁性纳米颗粒的变化，并考察了激光辐照或掺杂诱导硅发生介电-金属转变的影响。\n2. 其核心发现是介电硅情形下存在临界膜厚：较厚薄膜的Casimir自由能为负而增强稳定，较薄薄膜为正而不利稳定；该临界厚度随含水率升高而下降，且磁性颗粒及其半径增大使下降更显著，金属态硅则自由能恒正。\n3. 这一基底介电-金属相变与膜组分调控Casimir稳定性的机制，为有机电子和生物医学中肽涂层界面的稳定性设计提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "G. L. Klimchitskaya"}, {"name": "V. M. Mostepanenko"}], "featured_authors": [{"name": "G. L. Klimchitskaya"}, {"name": "V. M. Mostepanenko"}], "author_count": 2}, {"id": "2609.03854", "category": "cond-mat", "title": "Universal Driven Critical Dynamics of Entanglement Entropy", "abstract": "The Kibble-Zurek mechanism (KZM) and finite-time scaling (FTS) provide a foundational framework for driven critical dynamics, yet their predictive power has been largely confined to local observables. Here, we establish a universal finite-time scaling theory for the nonequilibrium dynamics of quantum entanglement. Using unbiased quantum Monte Carlo simulations, we investigate the corner entanglement entropy of (2+1)-dimensional interacting Dirac fermions driven from ordered phases toward a quantum critical point. We find that the corner entanglement accurately obeys a universal driven scaling governed by the driving rate and system size, persisting whether the initial ordered state is fully gapped or hosts gapless Goldstone modes. Crucially, this dynamical entanglement exhibits a logarithmic dependence on the driving rate, from which the universal corner coefficient of the underlying conformal field theory can be robustly extracted far from equilibrium. These results generalize the KZM from local observables to the intrinsic nonlocal quantum information measures, offering a practical blueprint for characterizing quantum criticality and entanglement on programmable quantum simulators.", "url": "https://arxiv.org/abs/2609.03854", "type": "理论+数值", "summary": "1. 该工作为量子纠缠熵建立了普适的驱动临界有限时间标度理论，并对二维相互作用狄拉克费米子从有序态驱向量子临界点的过程开展了无偏量子蒙特卡洛模拟。\n2. 其核心发现在于不同初态下角纠缠熵均满足由驱动率与系统尺寸联合支配的普适标度，且其对驱动率呈对数依赖，从而可在远离平衡时稳健提取共形场论的角系数。\n3. 这标志着Kibble-Zurek机制从局域观测量推广到非局域量子信息度量，为在可编程量子模拟器上刻画量子临界性与纠缠结构提供了可行路线。", "summary_source": "deepseek", "authors": [{"name": "Chang-Yu Shen"}, {"name": "Shuai Yin"}, {"name": "Zi-Xiang Li"}], "featured_authors": [{"name": "Chang-Yu Shen"}, {"name": "Shuai Yin"}, {"name": "Zi-Xiang Li"}], "author_count": 3}, {"id": "2609.03907", "category": "cond-mat", "title": "Hierarchy of topological superconductivity generated via heterostructures of unconventional $p$-wave magnets", "abstract": "A theoretical framework is proposed to engineer both first and second-order topological superconducting phases in a two-dimensional (2D) heterostructure, consisting of a quantum spin Hall insulator (QSHI) and an unconventional $p$-wave magnet in presence of proximity-induced $s$-wave superconducting pairing. Our analysis establishes that the transitions between the trivial and topological superconducting (TSC) phases can be regulated though the parameters of $p$-wave magnet. Presence of chiral symmetry leads to the characterization of both types of TSC phases by the respective invariants, one-dimensional winding number and quadrupolar winding number. These results are supplemented by an analytical effective low-energy edge theory that yields a deeper insight into the emergence of the different topological phases of the system. Bulk pairing analysis reveals the competition between the effective $(p_x+p_y)$ and $(p_x+ip_y)$ type pairings that are governed by the intrinsic spin-orbit coupling inherited to the QSHI and spin-split bands of the $p$-wave magnet, respectively.", "url": "https://arxiv.org/abs/2609.03907", "type": "理论", "summary": "1. 本文提出在二维异质结中实现一阶与二阶拓扑超导相的理论框架，该体系由量子自旋霍尔绝缘体、非常规p波磁体及近邻诱导的s波超导配对构成。\n2. 其要点在于p波磁体参数可调控平庸与拓扑超导相变，手征对称性容许以绕数及四极绕数分别刻画两类拓扑相，有效边界理论并揭示了体态有效(px+py)与(px+ipy)配对之间的竞争。\n3. 这为在磁性拓扑异质结中实现并控制高阶拓扑超导相提供了清晰的理论指引。", "summary_source": "deepseek", "authors": [{"name": "Koushik R. Das"}, {"name": "Arijit Saha"}], "featured_authors": [{"name": "Koushik R. Das"}, {"name": "Arijit Saha"}], "author_count": 2}, {"id": "2609.03913", "category": "cond-mat", "title": "Electromechanical Domain Wall Propagation in Dielectric Elastomers: An Exact Geometric Resolution via Conformal Mapping", "abstract": "The localized electromechanical phase transition in dielectric elastomers involves complex moving boundaries and severe electrostatic fringe fields driven by high-curvature interfaces. Traditional phenomenological models fundamentally underestimate the configurational forces by completely ignoring the in-plane electric field components and geometric singularities. Here, we present a asymptotically exact geometric framework to resolve the domain wall propagation. By mapping the highly deformed current configuration to a regular parametric strip via conformal mapping, the field singularities are algebraically eliminated. An exact integration by parts directly translates the higher-order geometric metric into a rigorous topological mass term, projecting the global conformal electrostatics into a non-linear $\\sigma$-model Lagrangian density. Incorporating the Gent strain-stiffening model, the continuous translation symmetry yields a Hamiltonian first integral. Eigenvalue analysis and Bogomol'nyi-Prasad-Sommerfield (BPS) bound calculations prove that the domain wall emerges strictly as an asymmetric heteroclinic orbit connecting two saddle points. This geometric resolution provides exact analytical scalings for the localized interface energy, domain wall thickness, and asymptotic decay lengths, eliminating all phenomenological parameters and offering a deterministic paradigm for geometric instabilities in active soft matter.", "url": "https://arxiv.org/abs/2609.03913", "type": "理论+数值", "summary": "1. 该工作针对介电弹性体中的局域电机械相变与畴壁传播，提出了一个基于共形映射的渐近精确几何框架，以修正忽视面内电场和界面奇性的传统模型。\n2. 其核心在于将高变形构型共形映射为规则参数带以代数消除场奇性，并通过精确分部积分将高阶几何度规转化为拓扑质量项，从而把共形静电学投影为非线性σ模型；结合Gent应变刚化本构，平移对称性给出哈密顿首次积分。\n3. 特征值分析与BPS能量下界计算证明畴壁是连接两个鞍点的不对称异宿轨道，同时给出界面能、壁厚与衰减长度的精确标度，为活性软物质中的几何失稳提供了无唯象参数的确定性范式。", "summary_source": "deepseek", "authors": [{"name": "Yu-Xin Xie"}], "featured_authors": [{"name": "Yu-Xin Xie"}], "author_count": 1}, {"id": "2609.03991", "category": "cond-mat", "title": "Boundary- and Screening-Induced Bubbly Phases in Autophoretic Active Matter", "abstract": "Spatial confinement and chemical screening fundamentally reshape the non-equilibrium phase behavior of autophoretic active particles. Here, we present a systematic study mapping the collective dynamics of self-propelled particles governed by chemo-attractive translational forces ($\\mu_t < 0$) and chemo-repulsive rotational torques ($\\mu_r > 0$) across varying screening parameters $\\kappa$, torque magnitudes $\\mu_r$, and boundary condition coefficients $\\Lambda^c$. Beyond standard chemotactic macro-phase separation and dynamic clustering, we report the emergence of novel boundary- and screening-induced bubbly phases, classified into boiling and bursting bubbles. Using a metric triad of steady-state cluster fraction $\\langle S \\rangle$, temporal fluctuation magnitude $\\sigma_S$, and coordination number $\\langle Q \\rangle$, we draw phase diagrams to demarcate phases for no-flux boundaries ($\\Lambda^c = 1$) and chemically permeable interfaces ($\\Lambda^c = 0$) . Increasing chemical screening ($\\kappa$) systematically suppresses long-range attraction, driving sequential phase transitions from macro-scale collapse toward bubbly states, dynamic micro-clusters, and homogeneous gas phases, while simultaneously inducing aggregate shape anisotropy. These findings provide predictive design rules for controlling active assembly and transport in microfluidic environments.", "url": "https://arxiv.org/abs/2609.03991", "type": "理论+数值", "summary": "1. 该工作系统研究了受化学吸引平移力与化学排斥转动矩驱动的自泳活性粒子在改变屏蔽参数、力矩强度和边界条件时的集体动力学。\n2. 其技术要点在于以稳态团簇分数、时间涨落幅度和配位数组成的三元指标绘制相图，揭示屏蔽增强会抑制长程吸引并驱动从宏观坍缩到沸腾/爆裂气泡相等转变。\n3. 这为微流控环境中通过边界通透性与化学屏蔽调控活性自组装和输运提供了可预测的设计规则。", "summary_source": "deepseek", "authors": [{"name": "Kingshuk Panja"}, {"name": "Günther Turk"}, {"name": "Rajesh Singh"}], "featured_authors": [{"name": "Kingshuk Panja"}, {"name": "Günther Turk"}, {"name": "Rajesh Singh"}], "author_count": 3}, {"id": "2609.04006", "category": "cond-mat", "title": "Quenched complexity of marginal states in the Sherrington--Kirkpatrick spin glass", "abstract": "In the Sherrington-Kirkpatrick model the exponentially many metastable states are marginal, so counting them requires breaking the BRST supersymmetry or a two-group replica Ansatz. For four decades this complexity was known only in the annealed approximation, which is unstable at low free energy and predicts states below the Parisi equilibrium free energy. We compute it quenched, with one step of replica symmetry breaking. It leaves the annealed curve where it becomes unstable and vanishes next to the full-RSB equilibrium free energy: the lowest marginal states are thus plausibly the equilibrium states themselves.", "url": "https://arxiv.org/abs/2609.04006", "type": "理论", "summary": "1. 该工作在Sherrington-Kirkpatrick自旋玻璃模型中计算边缘亚稳态的淬火复杂性，采用一步复制对称破缺方案。\n2. 其技术要点是修正退火近似在低自由能区的不稳定性：淬火复杂性在不稳定点脱离退火曲线，并在全复制对称破缺平衡自由能附近消失。\n3. 这一结果表明最低边缘态很可能就是平衡态，为理解边缘相与平衡态的关系及自旋玻璃动力学提供了可靠基准。", "summary_source": "deepseek", "authors": [{"name": "Tiziana De Chirico"}, {"name": "Luca Leuzzi"}], "featured_authors": [{"name": "Tiziana De Chirico"}, {"name": "Luca Leuzzi"}], "author_count": 2}, {"id": "2609.04029", "category": "cond-mat", "title": "Mechanistic Framework for Multicomponent Nanoparticle Assembly: Predicting RNA-lipid and PEI-DNA nanoparticle assembly", "abstract": "The assembly of multicomponent nanoparticles is often kinetically controlled and exhibits strong pathway dependence. Transport, solvent exchange, nucleation/growth, and collision-driven coalescence together determine not only ensemble-averaged properties but also particle-to-particle compositional heterogeneity. Here, we present a computational modeling framework for predicting nanoparticle property distributions by coupling processing conditions, early-stage self-assembly physics, and molecular chemical details with kinetic Monte Carlo (kMC) simulations. The framework combines (i) mixing conditions with solvent-exchange-mediated particle initialization and growth, and (ii) kMC simulations that resolve stochastic collision histories, electrostatics-controlled coalescence, and composition at the level of individual particles. Applied to mRNA lipid nanoparticles, the model predicts size-loading correlations and provides insight into how processing-dependent assembly pathways lead to heterogeneous payload distributions. The kMC simulations further provide merging lineage histories, which explain the emergence of log-normal volume and payload distributions through multiplicative particle-growth pathways. The same framework is also applied to PEI-DNA polyelectrolytic complexation, yielding single-particle-resolved DNA-PEI stoichiometry distributions. The framework and its open-source implementation, FormLNP, provide a process-aware route to predicting and controlling single-particle property distributions across a broad range of multicomponent nanoparticle systems.", "url": "https://arxiv.org/abs/2609.04029", "type": "理论+数值", "summary": "1. 该工作构建了将混合与溶剂交换介导的初始化/生长同动力学蒙特卡洛模拟耦合的计算框架，用于预测mRNA脂质纳米颗粒及PEI-DNA复合物的单颗粒尺寸、载荷和化学计量分布。\n2. 其核心在于逐颗粒解析随机碰撞、静电控制的聚并与谱系合并历史，从而揭示乘法式生长路径如何产生对数正态体积与载荷分布并解释尺寸-载荷关联。\n3. 该框架及其开源实现FormLNP为跨多种多组分纳米颗粒体系、面向加工条件预测和调控单颗粒性质分布提供了可推广路径。", "summary_source": "deepseek", "authors": [{"name": "Turash Haque Pial"}, {"name": "Tine Curk"}], "featured_authors": [{"name": "Turash Haque Pial"}, {"name": "Tine Curk"}], "author_count": 2}, {"id": "2609.04091", "category": "cond-mat", "title": "Effective Hamiltonian description on monitored Majorana chains: correlated power-law hoppings and unconventional entanglement scaling", "abstract": "We investigate the structures of effective Hamiltonians governing monitored dynamics of a one-dimensional Majorana chain through the Lyapunov spectral analysis. We focus on a gapless phase characterized by finite-size scalings different from those in conventional critical and/or frustration-free systems; the spectral gap closing faster than $1/L$ but slower than $1/L^2$ and the entanglement entropy growing as $[\\ln(L)]^2$ with $L$ being the system size. We find that the corresponding effective Hamiltonians have random long-range power-law hoppings with nontrivial magnitude correlations, rather than being independently and identically distributed. To elucidate the role of these non-Gaussian correlations, we construct random power-law hopping models that capture the essential features of the effective Hamiltonians. The spectral gaps of the constructed models decay faster than $1/L$ but slower than $1/L^2$. We find that, in the absence of hopping correlations, the ground-state entanglement exhibits $\\ln(L)$ scaling. In the presence of correlations, by contrast, the entanglement entropy is enhanced and its system-size dependence is consistent with $[\\ln(L)]^2$ scaling over the system sizes studied. These results suggest that correlations among long-range hopping magnitudes are responsible for the entanglement scaling that seldom appears in ground states of conventional isolated quantum systems.", "url": "https://arxiv.org/abs/2609.04091", "type": "理论+数值", "summary": "1. 该工作利用Lyapunov谱分析研究一维Majorana链的受监测动力学，刻画其有效哈密顿量，并聚焦于能隙闭合快于1/L却慢于1/L^2的无隙相。\n2. 其技术要点是发现这些有效哈密顿量包含带非高斯幅度关联的随机长程幂律跳跃，而正是此类关联使纠缠熵从ln L标度增强为(ln L)^2标度。\n3. 这启示长程跳跃幅度之间的关联能产生孤立量子系统基态中罕见的纠缠标度，并为受监测系统与随机长程模型间的等效描述提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Ken Mochizuki"}, {"name": "Hisanori Oshima"}, {"name": "Ryusuke Hamazaki"}, {"name": "Yohei Fuji"}], "featured_authors": [{"name": "Ken Mochizuki"}, {"name": "Hisanori Oshima"}, {"name": "Ryusuke Hamazaki"}, {"name": "Yohei Fuji"}], "author_count": 4}, {"id": "2609.04093", "category": "cond-mat", "title": "Extrinsic orbital Edelstein effect from asymmetric scattering", "abstract": "The generation and manipulation of orbital angular momentum (OAM) by an external electric field constitute one of the central themes of orbitronics. In particular, the electrically induced nonequilibrium OAM polarization, known as the orbital Edelstein effect (OEE), has attracted considerable attention in recent years. While the intrinsic band-geometric mechanism and the role of conventional symmetric impurity scattering in the OEE are well understood, the contribution from disorder-induced asymmetric scattering remains unclear. Here, we develop a semiclassical theory that separates the OEE into intrinsic, Drude, side-jump, and third- and fourth-order skew-scattering channels. Unlike the Drude channel, the intrinsic, side-jump, and skew-scattering responses survive only in systems with broken time-reversal symmetry. We find that in a magnetized Rashba two-dimensional electron gas (2DEG), these disorder-induced mechanisms can substantially exceed the intrinsic contribution. Remarkably, we find that for a system with Rashba coupling of $1$ $eV Å$, the orbital magnetization is about one order of magnitude larger than the spin magnetization for the chosen parameters, highlighting the crucial role of orbital degrees of freedom in the Edelstein effect.", "url": "https://arxiv.org/abs/2609.04093", "type": "理论", "summary": "1. 该工作建立半经典理论，将轨道Edelstein效应分解为内禀、Drude、侧跳及三阶和四阶斜散射通道，并用于磁化Rashba二维电子气。\n2. 其核心发现在于无序致非对称散射贡献在时间反演破缺下可远超内禀项，且当Rashba耦合为1 eV Å时，轨道磁化比自旋磁化大约一个量级。\n3. 这凸显轨道自由度在Edelstein效应中的主导潜力，为轨道电子学中无序散射机制的理论与实验检验提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Sankar Sarkar"}, {"name": "Koushik Ghorai"}, {"name": "Amit Agarwal"}], "featured_authors": [{"name": "Sankar Sarkar"}, {"name": "Koushik Ghorai"}, {"name": "Amit Agarwal"}], "author_count": 3}, {"id": "2609.04097", "category": "cond-mat", "title": "Hydrodynamics of two-dimensional electrons due to scattering by disorder", "abstract": "The hydrodynamic regime of electron transport, induced by fast inter-electron collisions, was discovered in high-quality nanostructures in recent ten years. However, signs of hydrodynamic transport, primarily, the giant negative magnetoresistance, were observed even at very low temperatures, when electron-electron scattering is too weak to affect the transport. To address this puzzle, here we develop a theory of mixed, hydrodynamic and non-Markovian, magnetotransport of two-dimensional electrons at zero temperature in samples with weak but still important disorder. Namely, we account for both the memory effects at electron scattering by localized defects in magnetic field and an unconventional viscosity effect due to electron scattering by defects in bulk and by rough sample edges. Solution of the model yields a strong negative magnetoresistance, which exhibits at zero magnetic field a sharp maximum in narrower samples or a blunt maximum in wider samples. This and other our results explain various properties of the giant negative magnetoresistance observed on ultra-high-quality GaAs quantum wells, thereby we apparently reveal the nature of low-temperature magnetotransport in these systems.", "url": "https://arxiv.org/abs/2609.04097", "type": "理论", "summary": "1. 本工作提出零温二维电子在弱无序与磁场下同时包含流体动力学和非马尔可夫记忆效应的磁输运理论。\n2. 其要点在于将缺陷散射的记忆效应与体内杂质及粗糙边界导致的非常规黏滞纳入统一模型，复现窄/宽样品中强负磁阻的峰形转变。\n3. 该框架为超高质量GaAs量子阱低温巨负磁阻提供了自洽解释，并阐明低温柔性流体输运的微观机制。", "summary_source": "deepseek", "authors": [{"name": "D. R. Raskulov"}, {"name": "K. A. Baryshnikov"}, {"name": "P. S. Alekseev"}], "featured_authors": [{"name": "D. R. Raskulov"}, {"name": "K. A. Baryshnikov"}, {"name": "P. S. Alekseev"}], "author_count": 3}, {"id": "2609.04109", "category": "cond-mat", "title": "Strengthened Silicate Glasses by Residual Stress: Depth of Compression and Surface Flaws Stability Conditions", "abstract": "The application of silicate glasses in severe service environments requires a precise evaluation of structural strength under mechanical loads and surface tribological conditions. Because glass strength is governed by surface flaws and microcracks rather than being an intrinsic material property, residual surface compression fields, balanced by interior tensile zones, are widely implemented to inhibit flaw opening. Rather than relying on conventional allowable stress criteria to establish product acceptance, this study adopts a fracture mechanics framework based on the stress intensity factor KI and fundamental material limits: the critical stress intensity factor KIC for rapid fracture and the threshold stress intensity factor KIth for time-delayed static fatigue failure. Using the Weight Function Method (WFM), KI is evaluated across generic surface flaw depths for two-dimensional continuous (2D-Continuous) surface cracks subjected to non-uniform internal residual stress fields and external loads. Flaw stability criteria are established for both zero-risk and moderate-risk design methodologies. Finally, the interaction and superposition of externally applied mechanical and thermal stresses with internal residual stress fields are evaluated.", "url": "https://arxiv.org/abs/2609.04109", "type": "理论+数值", "summary": "1. 该工作放弃传统容许应力验收准则，改用基于应力强度因子KI的断裂力学框架，考察强化硅酸盐玻璃在残余表面压应力与内部拉应力平衡下的二维连续表面裂纹扩展行为。\n2. 通过权函数法计算非均匀残余应力与外部机械、热应力叠加时的KI，并以KIC与静疲劳阈值KIth为材料极限，确立零风险与中等风险两类缺陷稳定判据，明确压缩层深度与裂纹尺寸对强度的影响。\n3. 这为严苛服役条件下玻璃制品的长期强度评估与验收提供可移植的断裂力学路径，亦对其他脆性材料的残余应力表面强化设计具有参考价值。", "summary_source": "deepseek", "authors": [{"name": "Guglielmo Macrelli"}], "featured_authors": [{"name": "Guglielmo Macrelli"}], "author_count": 1}, {"id": "2609.04149", "category": "cond-mat", "title": "Non-uniform quantum geometry stabilizes generalized Wigner crystals", "abstract": "Moiré materials host fractional Chern insulators and electron crystals in close proximity, but the mechanism selecting between them remains an open question. We address this competition in Chern bands with ideal but momentum-dependent quantum geometry -- Aharonov-Casher bands. We present an ansatz wave function for generalized Wigner crystals and, by comparing its energy to that of the competing Laughlin-like state, map out the phase diagram at filling fraction $\\nu=1/m$ as a function of the degree of geometric non-uniformity. Our work identifies quantum geometry-controlled zero point fluctuations of the charge density of the generalized Wigner crystal as the mechanism controlling its relative stability, implying a kind of quantum Lindemann criterion for the crystal-liquid phase boundary.", "url": "https://arxiv.org/abs/2609.04149", "type": "理论+数值", "summary": "1. 该工作在具有理想但动量依赖量子几何的Aharonov-Casher陈能带中构造广义Wigner晶体的变分波函数，并通过与Laughlin类态的能量比较给出ν=1/m填充下的相图。\n2. 其核心在于揭示量子几何的非均匀性通过调控广义Wigner晶体电荷密度零点涨落来决定其相对稳定性，从而建立晶体-液体相边界的量子Lindemann判据。\n3. 这为莫尔材料中电子晶体与分数陈绝缘体的相选择提供了基于量子几何的描述，并提示动量分辨的几何表征可作为预报相关量子物态的有效途径。", "summary_source": "deepseek", "authors": [{"name": "Nicolás Morales-Durán"}, {"name": "Tobias M. R. Wolf"}, {"name": "Jingtian Shi"}, {"name": "Tomohiro Soejima"}, {"name": "Andrew J. Millis"}, {"name": "Jennifer Cano"}], "featured_authors": [{"name": "Nicolás Morales-Durán"}, {"name": "Tobias M. R. Wolf"}, {"name": "Jingtian Shi"}, {"name": "Tomohiro Soejima"}, {"name": "Andrew J. Millis"}, {"name": "Jennifer Cano"}], "author_count": 6}, {"id": "2609.04162", "category": "cond-mat", "title": "Thermodynamic Concentration Inequalities: Controlling Uncertainty in Finite-Time and Small-Sample Thermodynamic Inference", "abstract": "We derive nonasymptotic upper bounds on the probability that a generalized current of a geometrically ergodic diffusion observed for any amount of time, or its sample mean over any arbitrary sample size, deviates from the stationary mean by more than any given amount. The concentration-of-measure behavior of generalized currents is universally governed by the relaxation time of the underlying dynamics, the locally observed dissipation rate, and the intrinsic local fluctuations of the observable. We uncover stark qualitative and quantitative differences in fluctuations in and out of thermodynamic equilibrium. We further obtain refined inverse thermodynamic uncertainty relations, bounding the variance of generalized currents from above. We construct nonasymptotic confidence intervals for controlling uncertainty in thermodynamic inference from small data, i.e., from short trajectories and small samples, and provide the first quantitative answer to when a trajectory is sufficiently long and a sample is sufficiently large. As an illustration, we apply our results to currents observed on a two-dimensional Ornstein-Uhlenbeck process in and out of equilibrium and show how they can be used to rigorously detect broken detailed balance.", "url": "https://arxiv.org/abs/2609.04162", "type": "理论", "summary": "1. 该工作为几何遍历扩散的广义电流在有限时间与小样本下导出非渐近集中不等式，给出其偏离稳态均值的概率上界。\n2. 核心在于揭示该浓度行为由弛豫时间、局域耗散率及观测量固有局域涨落统一控制，并据此建立逆热力学不确定性关系与置信区间。\n3. 这为从短轨迹和小样本推断热力学量、判断轨迹或样本是否足够大以及检测细致平衡破缺提供了定量判据。", "summary_source": "deepseek", "authors": [{"name": "Rick Bebon"}, {"name": "Aljaž Godec"}], "featured_authors": [{"name": "Rick Bebon"}, {"name": "Aljaž Godec"}], "author_count": 2}, {"id": "2609.04164", "category": "cond-mat", "title": "A Superconducting Peierls Instability", "abstract": "The Peierls instability is a foundational mechanism in condensed matter physics, showing how the electron--phonon interaction can transform a simple metal into an insulating state with a new lattice periodicity. In a one-dimensional (1D) metal the Peierls instability follows from the enhanced electronic response at wavevector $Q=2k_F$ (connecting the Fermi points) producing a Kohn anomaly: a softening of the phonon mode at the same wavevector. Condensation of this mode then generates the tell-tale Peierls periodic lattice distortion and charge-density wave (CDW) that gaps the electronic spectrum. Here we show an analogous instability at the edge of a two-dimensional (2D) superconductor, where a dispersing Andreev bound state (ABS) hosts Bogoliubov Fermi points at $\\pm k_c$. The enhanced quasiparticle response at the connecting wavevector $Q=2k_c$ couples directly to pairing-fluctuations and produces a superconducting Kohn anomaly: a softening of a pairing mode at the same wavevector. Condensation of this mode then generates an edge pair-density wave (PDW) that gaps the ABS. We refer to this as a superconducting Peierls instability and identify the boundary quasiparticle structure that enables it. As a concrete realization, we consider a square-lattice extended Hubbard model whose mixed-symmetry $s+d+ip$ state hosts a dispersing ABS with zero-energy crossings at finite edge momenta. Using self-consistent Bogoliubov--de Gennes (BdG) calculations we show that the order parameter develops an edge PDW, with the wavevector set by the superconducting Kohn anomaly, that gaps the ABS crossings. Our results identify a novel mechanism for spontaneous translation-symmetry breaking in a superconductor. As this superconducting Peierls mechanism does not require an extensive zero-energy flat band or topologically protected edge states, it may apply broadly to unconventional superconductors.", "url": "https://arxiv.org/abs/2609.04164", "type": "理论+数值", "summary": "1. 该工作提出超导Peierls不稳定性机制，指出二维超导体边界上的色散Andreev束缚态可在有限动量处形成Bogoliubov费米点。\n2. 其核心在于配对涨落以波矢2k_c耦合，产生超导Kohn反常并软化配对模，凝聚后形成边界配对密度波并打开束缚态能隙；作者在s+d+ip扩展Hubbard模型中用自洽BdG计算验证了该图像。\n3. 该机制无需平带或拓扑保护边界态，为非常规超导体中自发平移对称性破缺提供了普适新途径。", "summary_source": "deepseek", "authors": [{"name": "Pramodh Senarath Yapa"}, {"name": "Joseph Maciejko"}, {"name": "Frank Marsiglio"}, {"name": "Annica M. Black-Schaffer"}], "featured_authors": [{"name": "Pramodh Senarath Yapa"}, {"name": "Joseph Maciejko"}, {"name": "Frank Marsiglio"}, {"name": "Annica M. Black-Schaffer"}], "author_count": 4}, {"id": "2609.04169", "category": "cond-mat", "title": "Reciprocity can halve what a mechanical network can learn", "abstract": "Tunable mechanical networks are being developed as materials that learn in place. Capacity is estimated by counting tunable parameters against target constraints, ignoring Maxwell-Betti reciprocity, the symmetry every passive, linear elastic network obeys by construction. When p degrees of freedom are both driven and read out, every reachable response block lies in a subspace of codimension p(p-1)/2, whatever the size, topology and stiffnesses; at full overlap nearly half the target space is unreachable. The consequence for training is a number: any learning rule leaves an error at least the norm of the target's antisymmetric part on the shared degrees of freedom, computable before training, and positive definiteness adds an orthogonal second term. A second-order optimiser with the exact Jacobian reaches that floor within 1% in 143 of 144 runs, a bond-local contrastive rule within 0.1% in 22 of 24, and odd couplings restore the lost directions at the price of an external torque source: the network becomes active. Prescribed-displacement drives obey a companion law we prove. The symmetry is classical; its consequence on a fixed graph with finitely many tunable stiffnesses at partial overlap is new. For a published robotic metamaterial it shows that no symmetric positive-definite stiffness matrix meets both targets in the linear model their deposited data integrate.", "url": "https://arxiv.org/abs/2609.04169", "type": "理论", "summary": "1. 该工作证明，线性被动弹性网络因Maxwell-Betti互易性，p个共用驱动/读出自由度上的可达响应块余维为p(p−1)/2，最大学习容量至多减半。\n2. 其技术卖点在于给出训练前可计算的误差下限——目标反对称部分的范数；二阶优化器与键局域对比学习均能逼近该下限，而反对称耦合须外扭矩源才能恢复丢失方向。\n3. 这提示互易性必须纳入力学网络容量估计：被动对称正定刚度无法实现非对称目标，主动单元或外扭矩源是扩展可学习空间的关键。", "summary_source": "deepseek", "authors": [{"name": "Thai-Son Vu"}, {"name": "Hoang-Giang Nguyen"}, {"name": "Quoc-Bao Nguyen"}, {"name": "Sengaloun Keoalounxay"}, {"name": "Bao-Viet Tran"}], "featured_authors": [{"name": "Thai-Son Vu"}, {"name": "Hoang-Giang Nguyen"}, {"name": "Quoc-Bao Nguyen"}, {"name": "Sengaloun Keoalounxay"}, {"name": "Bao-Viet Tran"}], "author_count": 5}, {"id": "2609.04187", "category": "cond-mat", "title": "Wavefunctions for Anyon Superconductors", "abstract": "Anyon superconductivity arises from the condensation of mobile anyons rather than from a conventional Cooper instability, yet a systematic wavefunction description remains lacking. We develop a hierarchy-wavefunction construction for superconducting states derived from parent topological orders and identify their off-diagonal long-range order, condensate charge, chiral central charge, and residual topological order through the plasma analogy and topological field theories. We construct Abelian and non-Abelian examples descending from the semion state, a $\\nu=2/3$ hierarchy state, the $\\nu=1/3$ Laughlin state, $\\nu=1$ integer quantum Hall state, and Pfaffian state. Remarkably, for the semion case, the superconducting many-semion wavefunction is equivalent to a state of fermionized anyons filling two effective Landau levels, recovering Laughlin's original construction of semion superconductor. Finally, we show that hierarchy wavefunctions emerge naturally in the dilute, long-distance limit of the anyon-Hilbert-space formulation, which applies to ideal Chern bands and moiré bands of twisted bilayer MoTe$_2$. Our results establish a unified wavefunction-level framework linking anyon condensation, superconducting order, and topological field theory.", "url": "https://arxiv.org/abs/2609.04187", "type": "理论", "summary": "1. 该文为源于母体拓扑序的任意子超导态构造层级波函数，并统一刻画其非对角长程有序及残余拓扑性质。\n2. 技术核心是借助等离子体类比与拓扑场论确定凝聚电荷、手征中心荷等，并证明半子情形下波函数等价于费米化任意子填充两个有效朗道能级。\n3. 这些层级波函数在稀疏长距离极限下自然涌现，可用于理想陈带及双层MoTe2摩尔带，为统一任意子凝聚、超导序与拓扑场论提供框架。", "summary_source": "deepseek", "authors": [{"name": "Donghae Seo"}, {"name": "Taegon Lee"}, {"name": "Gil Young Cho"}], "featured_authors": [{"name": "Donghae Seo"}, {"name": "Taegon Lee"}, {"name": "Gil Young Cho"}], "author_count": 3}, {"id": "2609.03001", "category": "hep-th", "title": "Taxonomy of Potentials in Asymptotic Limits", "abstract": "In infinite-distance limits of scalar field moduli spaces in quantum gravity, particle masses, brane tensions, and scalar field potentials scale exponentially with geodesic distance. Previous work has shown that the exponential decay rates of particle masses and brane tensions admit a discrete classification. In this work, we extend this classification to the case of scalar field potentials. We find that leading contributions to the potential typically scale with tensions of codimension-1 branes as $V \\sim T_{d-1}^2$ or codimension-0 branes as $V \\sim T_d$, and these relations hold formally even when the associated branes are absent from the spectrum. As a result, the taxonomy rules for potentials are intimately connected to the brane taxonomy rules. More generally, potential contributions can be labeled by a collection of integers, which correspond physically to their transformation properties under Weyl rescalings and their order in the string loop expansion. This implies that the vector $\\vec v = - \\vec \\nabla \\log V$ is lattice-valued, and indeed it lies in precisely the same lattice as the analogous vectors $\\vec \\alpha = - \\vec \\nabla \\log T_d$ for codimension-0 branes of tension $T_d$. We verify our taxonomy rules in various examples in string theory. We show that these rules imply that sums of positive potential terms satisfy the Strong Asymptotic de Sitter Conjecture, which requires $|\\vec \\nabla \\log V| \\geq 2/\\sqrt{d-2}$ in asymptotic regimes of scalar field moduli space, and they imply that higher-derivative gravitational corrections are suppressed by powers of the species scale.", "url": "https://arxiv.org/abs/2609.03001", "type": "理论", "summary": "1. 该工作将量子引力中无穷距离模空间极限下粒子质量与膜张力的指数衰减离散分类推广至标量场势能，给出势贡献的分类规则。\n2. 要点是势的主导贡献按 \\(V\\sim T_{d-1}^2\\) 或 \\(V\\sim T_d\\) 标度，即使相应膜不在谱中；衰变向量 \\(-\\nabla\\log V\\) 与余维0膜向量同处一个格点，由 Weyl 重标度与弦圈阶数标记。\n3. 这些规则在弦论例子中得到验证，直接推出渐近区正势能项满足强渐近 de Sitter 猜想，并预言高阶导数引力修正受物种标度幂次压低。", "summary_source": "deepseek", "authors": [{"name": "Muldrow Etheredge"}, {"name": "Dieter Lüst"}, {"name": "Tom Rudelius"}], "featured_authors": [{"name": "Muldrow Etheredge"}, {"name": "Dieter Lüst"}, {"name": "Tom Rudelius"}], "author_count": 3}, {"id": "2609.03008", "category": "hep-th", "title": "Gravitational Backreaction in de Sitter: A Canonical ADM Approach", "abstract": "We develop a canonical ADM framework for gravitational backreaction during inflation. Our approach extends the formalism used to compute cosmological correlators by applying it to the evolution of the quantum background, which we identify with the metric one-point function. The aim is to assess the quantum stability of inflationary geometries under gravitational backreaction. Within this framework, the backreaction is determined by the expectation values of the Hamiltonian constraint and the equations of motion for the spatial metric. Working in the exact de Sitter limit, we apply the framework to a massless minimally coupled spectator scalar field and the physical graviton polarizations. At one loop, their backreaction renormalizes the relation between the cosmological constant and the Hubble parameter without inducing any secular departure from de Sitter evolution, in agreement with previous results. We perform the calculation using a hard momentum cutoff and show that a fixed physical cutoff allows the homogeneous background equations to be renormalized with time- and background-independent coefficients, in contrast to a fixed comoving cutoff. Finally, we demonstrate that the explicit representation of the backreaction depends on the gauge condition imposed on the metric fluctuations, as well as on the background-fluctuation split. Nevertheless, these different representations are related by a gauge transformation and are therefore physically equivalent.", "url": "https://arxiv.org/abs/2609.03008", "type": "理论", "summary": "1. 该工作提出并采用ADM正则框架研究德西特时空中的引力反作用，将量子背景作为度规单点函数演化，以评估暴胀几何的量子稳定性。\n2. 其技术要点在于：对无质量最小耦合旁观标量场及物理引力子极化进行单圈计算，反作用仅重正化宇宙学常数与哈勃参量关系，不产生离开德西特演化的长期偏离；固定物理截断允许用时间与背景无关的系数重正化均匀背景方程。\n3. 该框架证明反作用的显式表示依赖规范条件与背景-涨落分解，但不同表示由规范变换联系且物理等价，为后续检验暴胀背景的量子稳定性提供了明确基准。", "summary_source": "deepseek", "authors": [{"name": "Giordano Cintia"}], "featured_authors": [{"name": "Giordano Cintia"}], "author_count": 1}, {"id": "2609.03013", "category": "hep-th", "title": "From $Z$ to $a$: High-temperature relations, subleading semi-universality, and conformal anomalies", "abstract": "The free energy of any CFT, $ \\ln Z(\\beta; \\omega_i)$, admits two expansions: high temperature ($\\beta \\rightarrow 0$) and fast rotation ($\\omega_i \\rightarrow 1$). We demonstrate that locality of the thermal effective action forces $\\ln Z$ to take a simple analytic form at all orders in the high temperature expansion, and further imposes an infinite number of sharp relations on the coefficients in this expansion. All are homogeneous, except at order $\\beta^1$ due to the Weyl anomaly. From this, the $a$-anomaly can be extracted from the partition function. The relations resum in the fast-spinning expansion into differential equations in $\\beta$ obeyed by the semi-universal limit and its corrections. We verify the relations in a variety of CFTs. We generalize to any even $d$, but find no similar relations at odd $d$.", "url": "https://arxiv.org/abs/2609.03013", "type": "理论", "summary": "1. 该工作证明任意 CFT 的热配分函数对数 ln Z(beta; omega_i) 在高温展开各阶均受热有效作用局域性约束，展开系数满足无穷多个除 beta^1 阶因 Weyl 反常外均为齐次的严格关系。\n2. 其核心卖点是利用 beta^1 阶对齐次性的破坏从配分函数直接提取 a 反常，并将快速转动展开中的关系重整为半普适极限及其修正所满足的 beta 微分方程。\n3. 这些关系已在多种 CFT 中验证，并推广至任意偶数维而在奇数维不成立，为通过高温与快速转动展开研究共形反常及 CFT 分类提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Arnav Advant"}, {"name": "Harsh Anand"}, {"name": "Nathan Benjamin"}, {"name": "Vipul Kumar"}, {"name": "Shiraz Minwalla"}, {"name": "Jyotirmoy Mukherjee"}, {"name": "Sridip Pal"}, {"name": "Asikur Rahaman"}, {"name": "Pabitra Ray"}], "featured_authors": [{"name": "Arnav Advant"}, {"name": "Harsh Anand"}, {"name": "Nathan Benjamin"}, {"name": "Sridip Pal"}, {"name": "Asikur Rahaman"}, {"name": "Pabitra Ray"}], "author_count": 9}, {"id": "2609.03023", "category": "hep-th", "title": "Holographic zeros and poles from apparent singularities", "abstract": "We study general holographic fluctuation equations with apparent singularities, and the associated spectral functions. We consider the regime where an apparent singularity approaches the boundary, for which the near-boundary behavior of solutions can be determined via an inner/outer matching type of calculation. Depending on properties of the equation, we find that the merging of an apparent singularity with the boundary may generate either a zero or a pole for the corresponding spectral function. Our results also indicate that the recently introduced holographic product formula still applies in the presence of apparent singularities.", "url": "https://arxiv.org/abs/2609.03023", "type": "理论", "summary": "1. 本文研究具有表观奇点的全息涨落方程及其谱函数，重点关注表观奇点趋近边界时的近边界行为。\n2. 通过内/外区匹配计算发现，奇点与边界融合可在谱函数中产生零点或极点，其类型取决于方程性质，且全息乘积公式仍然适用。\n3. 这一结果澄清了全息谱函数解析结构的来源，为可靠提取准正规模与输运系数提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Edwan Préau"}], "featured_authors": [{"name": "Edwan Préau"}], "author_count": 1}, {"id": "2609.03043", "category": "hep-th", "title": "Monstrous parafermionic defects and other non-invertible symmetries in chiral CFTs", "abstract": "The structure of non-invertible symmetries in 2D CFT is closely tied to the algebra of preserved holomorphic fields, its representation theory, and its embedding in the full chiral algebra of the CFT. Unfortunately, finding new embeddings of a chiral algebra into another is a difficult mathematical problem, and one of the major obstacles in the pursue of new and exotic categories of non-invertible symmetries. In this work, we describe a simple general technique that leads to a number of new non-trivial results in this direction: (1) For the holomorphic Monster CFT $V^\\natural$, we show that for every `Fricke' non-anomalous Monster element of order $N$, there is an embedding of the parafermion algebra $\\frac{su(2)_N}{u(1)}$ in $V^\\natural$, we compute the characters of its commutant, and describe the topological defects preserving these subalgebras. (2) We provide an easy-to-check sufficient condition for a holomorphic VOA $V$ to be self-orbifold under a cyclic group of (invertible) symmetries, and determine the associated duality defect. (3) We find several new topological defects in CFTs arising from heterotic strings on $T^4$. (4) We prove a number of VOA embeddings and topological defects in the Leech lattice CFT, in Schellekens theories, and other CFTs of various central charges, and suggest several generalizations of our methods.", "url": "https://arxiv.org/abs/2609.03043", "type": "理论", "summary": "1. 该工作发展了一种在手征共形场论中构造手征代数嵌套的通用方法，从而发现多类非可逆对称性缺陷。\n2. 其关键是在怪兽CFT中针对每个Fricke非反常怪兽元嵌入su(2)_N/u(1) parafermion代数，并算出其交换子字符。\n3. 该方法还给出自轨配的充分判据，并可推广至Leech格、Schellekens理论与T^4 heterotic弦CFT，为搜寻新非可逆对称性提供了路径。", "summary_source": "deepseek", "authors": [{"name": "Roberto Volpato"}], "featured_authors": [{"name": "Roberto Volpato"}], "author_count": 1}, {"id": "2609.03071", "category": "hep-th", "title": "The trans-Planckian problem and gravitational interactions", "abstract": "The strong gravitational interaction of counter-propagating quantum field modes is of foundational importance to the trans-Planckian problem of black hole horizons. This article, in memory of Renaud Parentani, is primarily an exposition of Renaud's attempt, using perturbation theory, a large $N$ approximation, and spherical reduction, to capture a mechanism by which those interactions might quench the trans-Planckian near-horizon quantum field correlations. Before giving a detailed account of Renaud's calculation, the trans-Planckian problem is briefly introduced, and the paper concludes with a discussion of related issues and questions.", "url": "https://arxiv.org/abs/2609.03071", "type": "理论", "summary": "1. 该文为纪念Renaud Parentani，系统阐述其采用微扰论、大N近似与球对称约化处理视界反向传播量子场模强引力相互作用、进而抑制超普朗克关联的方案。\n2. 其技术要点在于将四维视界问题约化为有效模型，以检验强引力耦合能否作为淬灭普朗克尺度近视界场关联的动力学机制。\n3. 这一工作为审视黑洞视界量子场论的自洽性边界、并推动超越微扰方法的量子引力研究提供了明确参照。", "summary_source": "deepseek", "authors": [{"name": "Ted Jacobson"}], "featured_authors": [{"name": "Ted Jacobson"}], "author_count": 1}, {"id": "2609.03126", "category": "hep-th", "title": "Boundary-Value Problem in Type IIB Supergravity and Holography", "abstract": "In precision holography, the Euclidean on-shell action of type IIB supergravity often fails to reproduce the leading large-$N$ free energy of the dual field theory: the type IIB pseudo action, for instance, vanishes identically on the $\\mathrm{EAdS}_5\\times S^5$ background. We address this issue by revisiting the boundary-value problem of the Euclidean type IIB pseudo action from first principles. Classifying the admissible boundary conditions through the variational principle, we construct a generalized pseudo action whose boundary terms implement the choice of ensemble --- fixed potentials versus fixed quantized Page charges --- in which the holographic comparison is performed. For the fixed five-form-charge ensemble, the resulting boundary term reproduces the recently proposed topological correction to the Pasti--Sorokin--Tonin formulation of type IIB supergravity for holographic backgrounds of interest. We then test the generalized pseudo action on two complementary backgrounds: the $\\mathrm{EAdS}_3\\times S^3\\times M_4$ near-horizon geometry of the D1-D5 system and the warped $\\mathrm{EAdS}_6\\times S^2\\times\\Sigma$ solutions dual to five-dimensional SCFTs. In both cases the ten-dimensional on-shell action agrees exactly with that of the corresponding lower-dimensional supergravity, and thereby with the leading large-$N$ free energy of the dual SCFT. Our results establish the choice of boundary conditions --- and hence of ensemble --- as an essential ingredient of precision holography directly in type IIB supergravity, extending recent analyses in eleven-dimensional supergravity.", "url": "https://arxiv.org/abs/2609.03126", "type": "理论", "summary": "1. 本文从变分原理出发重新审视欧几里得IIB型超引力赝作用的边值问题，并构建含边界项的广义赝作用以解决其on-shell作用与对偶场论自由能不一致的问题。\n2. 其要点是通过允许固定势或固定量子化Page荷的系综选择，将十一维超引力中的拓扑修正推广至IIB型的Pasti-Sorokin-Tonin表述，并在D1-D5与翘曲EAdS6背景上实现十维作用与低维超引力及大N自由能的精确匹配。\n3. 这确立了边值条件与系综选取是精密全息中不可省略的要素，为在IIB型超引力层面直接进行高精度全息检验提供普遍框架。", "summary_source": "deepseek", "authors": [{"name": "Soumya Adhikari"}, {"name": "Junho Hong"}, {"name": "Chanyoung Joung"}, {"name": "Geum Lee"}, {"name": "Sourav Roychowdhury"}], "featured_authors": [{"name": "Soumya Adhikari"}, {"name": "Junho Hong"}, {"name": "Chanyoung Joung"}, {"name": "Geum Lee"}, {"name": "Sourav Roychowdhury"}], "author_count": 5}, {"id": "2609.03347", "category": "hep-th", "title": "Conical Defects in JT Gravity from BF Theory: Quantization, Fusion, and Weighted Moduli Spaces", "abstract": "We construct a gauge-invariant BF representative of a conical defect in Jackiw--Teitelboim gravity, with its elliptic direction fixed by the reconstruction of the gravitational variables. In the gravitational sector, the BF observable reproduces the metric defect insertion and its distributional curvature source, and fixes the holonomy around the defect to an elliptic conjugacy class. For a single defect on the disk, the position integral combines with the residual \\(\\mathrm{PSL}(2,\\mathbb R)\\) quotient, leaving a fixed elliptic sector. The exact boundary quantization of this sector gives the elementary kernel and one-defect disk amplitude directly, without using a matrix model. The same local BF operator describes both sharp and blunt defects. Their difference appears only when several defect positions are integrated. BF source composition makes the fractional deficits additive. Requiring a fused source to remain in the gravitational cone sector gives the admissibility condition for defect collisions, while positivity of the hyperbolic area on each component gives the corresponding stability condition. These conditions coincide with those for Hassett weighted curves. Combining these BF results with the known Hassett compactification and conical Weil--Petersson geometry yields the fixed-order genus-zero contact terms and recovers the cluster expansion of deformed JT gravity. Thus sharp and blunt defects differ through the compactified geometry of their relative positions, rather than through the elementary BF operator.", "url": "https://arxiv.org/abs/2609.03347", "type": "理论", "summary": "1. 作者用BF理论构造了JT引力中锥形缺陷的规范不变插入算符，通过椭圆完整类固定其分布曲率源并给出单缺陷圆盘振幅的精确边界量子化。\n2. 其核心在于同一局域BF算符同时涵盖尖锐与钝缺陷；缺陷间的差异仅体现在多体位置积分中，且源复合的分数亏缺相加与碰撞稳定性恰好对应于Hassett加权曲线的容许性与稳定性条件。\n3. 该结果不依赖矩阵模型即可恢复形变JT引力在亏格零的接触项和团展开，为缺陷融合及加权模空间上的量子引力提供了直接的非微扰计算框架。", "summary_source": "deepseek", "authors": [{"name": "Wei Gu"}], "featured_authors": [{"name": "Wei Gu"}], "author_count": 1}, {"id": "2609.03525", "category": "hep-th", "title": "Center-twisted Gribov spectra and the finite-volume Gaussian response in the refined Gribov--Zwanziger framework", "abstract": "We develop a continuum framework for comparing the Gribov--Zwanziger and center-vortex descriptions of confinement through the gauge-invariant twisted partition function of the electric $\\mathbb{Z}_N^{[1]}$ 1-form symmetry. A background 2-form field $B$, equivalently an 't~Hooft twist on a torus, labels a global sector and is not itself a dynamical center vortex. For a minimal irreducible twist on $T^4$, we derive the complete adjoint momentum lattice of $SU(N)$. The twisted spectrum is exactly the scalar spectrum on an enlarged torus with periods $(L_1,L_2,NL_3,NL_4)$ with the ordinary-torus sublattice removed. This yields a finite Faddeev--Popov gap at the flat representative and reduces twisted-minus-untwisted spectral traces to ordinary torus traces. For the refined Gribov--Zwanziger (RGZ) kernel, Poisson resummation gives an exact finite-volume Bessel-function winding sum with a universal center-twist projector. We evaluate the Gaussian one-loop integral at fixed RGZ parameters up to the finite-dimensional global zero-mode/stabilizer normalization. The Zwanziger determinants cancel, while the gauge-fixing/ghost sector leaves a universal massless primed determinant on $T^4$; the untwisted sector also contains constant gluon modes. The only normalization not fixed by the local quadratic Hessian is the relative zero-mode/stabilizer measure of the reducible untwisted and irreducibly twisted flat connections. We also derive closed finite-volume sources for the RGZ stationary equations. The massive response is exponentially suppressed at large volume, whereas the massless factor depends on the global zero-mode normalization. Thus the Gaussian calculation does not by itself establish the strong center-vortex-condensation criterion for $Z[B]/Z[0]$, but it isolates the remaining global normalization problem and separates a global twist from an actual dynamical vortex.", "url": "https://arxiv.org/abs/2609.03525", "type": "理论", "summary": "1. 该工作建立了精致Gribov–Zwanziger框架下、以电Z_N^{[1]} 1-形式对称性的规范不变扭曲配分函数为基础，比较禁闭的Gribov–Zwanziger与中心涡旋描述的统一连续场论方案。\n2. 其技术核心是导出最小不可约扭曲下SU(N)的完整伴随动量晶格，将扭曲谱映射到扩大环面去掉普通子格的标量谱，并通过Poisson求和得到有限体积贝塞尔函数卷绕和及普适中心扭曲投影子。\n3. 结果表明高斯计算本身不足以确立强中心涡旋凝聚判据Z[B]/Z[0]，但将问题归结为全局零模与稳定子相对归一化，从而清晰区分全局扭曲与动力学涡旋，为后续非微扰归一化研究指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Okuto Morikawa"}], "featured_authors": [{"name": "Okuto Morikawa"}], "author_count": 1}, {"id": "2609.03530", "category": "hep-th", "title": "Topics in Kadyshevsky Field Theory", "abstract": "In these notes we deal with several field theoretical topics in the framework of the Quantum Field Theory as developed by Kadyshevsky. The main motivation for studying the Kadyshevsky formalism is that in the kadyshevsky graphs, in contrast with the Feynman graphs, the particles remain on the mass shell. This facilitates the use of phenomenological form factors, {\\it e.g.} Gaussian ones. In the first part we construct the second quantised quasi-particle formalism, which is employed to develop the functional integral formalism. In the latter we develop the path-integral, the Schwinger-Symanzik equations, generalised Wightman functions, and the Kadyshevsky reduction formulas. In the second part we cover the topics: (i) the relation between the Feynman and Kadyshevsky perturbation theory, and (ii) the Gross-Jackiw method in the Kadyshevsky formalism. The latter method is applied to the kadyshevsky formalism for interaction Lagrangians with derivatives, in particular for pion-nucleon interactions: (i) pseudo-vector $NN\\pi$-, (ii) vector $NN\\rho$-, and (iii) gauge-invariant $\\Delta_{33}N\\pi$ coupling.", "url": "https://arxiv.org/abs/2609.03530", "type": "理论", "summary": "1. 该工作系统发展了Kadyshevsky量子场论的准粒子二次量子化与泛函积分形式，并导出路径积分、Schwinger-Symanzik方程及广义Wightman函数等。\n2. 其技术特点在于Kadyshevsky图保持粒子在质量壳上，可自然引入高斯型唯象形状因子，并用Gross-Jackiw方法统一处理含导数及规范不变的各类πN耦合。\n3. 该工作厘清了与Feynman微扰论的联系，为强子唯象模型中离壳效应的处理提供了有价值的非微扰理论框架。", "summary_source": "deepseek", "authors": [{"name": "Th.A. Rijken"}, {"name": "J.W. Wagenarr"}], "featured_authors": [{"name": "Th.A. Rijken"}, {"name": "J.W. Wagenarr"}], "author_count": 2}, {"id": "2609.04016", "category": "hep-th", "title": "Quasi-local form for $α$--$z$ Rényi QNEC from fixed-ray escorts", "abstract": "The fixed-ray escort integral representation expresses $\\alpha$--$z$ Rényi divergence as an average over ordinary relative entropy of a family of escort states. Working in the standard UV-regulated density-matrix description of QFT subregions, we use this representation to derive an escort-averaged entanglement first law, an escort-averaged representation of the $\\alpha$--$z$ information kernel, and an escort-averaged Bekenstein-type bound for ball-shaped regions in conformal field theories. For the conjectural $\\alpha$--$z$ quantum null energy condition (QNEC), we obtain a quasi-local form in which the null energy is evaluated in an escort-averaged state and is corrected by an escort-transport term encoding the failure of escort formation to commute with restriction to a null-deformed region. The $z=\\alpha$ specialization gives a similar quasi-local form of the Rényi QNEC for sandwiched Rényi divergence. We explicitly compute the Rényi QNEC, including the explicit escort transport term, for coherent-state excitations in a free scalar field theory. For the same coherent family, we obtain a positive $\\alpha$--$z$ null Hessian, verifying the conjectured diagonal $\\alpha$--$z$ QNEC for this family.", "url": "https://arxiv.org/abs/2609.04016", "type": "理论", "summary": "1. 该工作利用固定射线escort积分表示，在量子场论子区域的UV正则化密度矩阵框架中推导了escort平均的纠缠第一定律、α–z信息核表示及球域Bekenstein型界，并给出α–z Rényi量子零能量条件(QNEC)的准局部形式。\n2. 该准局部形式的核心在于零能密度由escort平均态计算，同时加入escort输运修正项以刻画escort形成与零形变区域限制不可交换的效应；z=α特例给出夹心Rényi散度QNEC的准局部表述。\n3. 作者在自由标量场相干态激发中显式算出该输运项并验证α–z空Hessian正性，支持了猜想中的对角QNEC，也为全息或耦合系统中的进一步证明提供了技术模板。", "summary_source": "deepseek", "authors": [{"name": "Tanay Kibe"}, {"name": "Pratik Roy"}], "featured_authors": [{"name": "Tanay Kibe"}, {"name": "Pratik Roy"}], "author_count": 2}, {"id": "2609.04035", "category": "hep-th", "title": "Cusped Defects: Cusp Operator Expansion, Conformal Properties and Bootstrap Applications", "abstract": "We analyze general properties of cusped defect lines embedded in generic conformal field theories (CFTs). We prove that suitably defined cusp scaling operators transform like primary operators under general conformal transformations. We show that, via the cusp operator expansion (COE), defects of general shape can be expanded in a basis of cusped defects. These findings are checked and exemplified in the case of the localized magnetic field defect. Finally, we derive analytic constraints on dynamical cusp data by making use of a crossing equation, and discuss possible numerical bootstrap applications of our results.", "url": "https://arxiv.org/abs/2609.04035", "type": "理论", "summary": "1. 该工作系统分析了任意共形场论中带尖角缺陷线的普适性质，并建立了尖点标度算符与共形几何行为之间的严格对应。\n2. 核心卖点是证明尖点算符按初级算符变换，并利用尖点算符展开将一般形状缺陷表示为尖点缺陷基，且以局域磁场缺陷为例给出验证。\n3. 通过推导满足穿越方程的解析约束，该结果为未来用数值共形 bootstrap 方法求解动力学尖点数据提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo Bianchi"}, {"name": "Andrea Cavaglià"}, {"name": "A. David Gutiérrez"}, {"name": "Stefanos R. Kousvos"}, {"name": "Marco Meineri"}], "featured_authors": [{"name": "Lorenzo Bianchi"}, {"name": "Andrea Cavaglià"}, {"name": "A. David Gutiérrez"}, {"name": "Stefanos R. Kousvos"}, {"name": "Marco Meineri"}], "author_count": 5}, {"id": "2609.04041", "category": "hep-th", "title": "Cutting corners: exciting and magical bounds from the cusp bootstrap", "abstract": "An illuminating probe of the dynamics of a line defect is the global geometry of its worldline. For a conformal line defect in a conformal field theory, sharp corners in the worldline, i.e. cusps, host dynamical degrees of freedom characterized in part by a spectrum of scaling dimensions, called cusp anomalous dimensions. We present various general bounds on cusp anomalous dimensions following from unitarity and cutting-and-gluing consistency of different defect geometries. We first establish, for cusps involving conjugate defects, that level crossings upon varying the cusp angle are forbidden between the lightest singlet cusp and any non-singlet cusp, proving that singlet cusps are the lightest. Then, we study line defects arranged in a rectangular geometry, which are subject to bootstrap constraints reminiscent of the spinless modular bootstrap. We find an analytic ``magic\" functional that produces an optimal and universal lower bound on the dimension of a right angle bare cusp in terms of the universal defect Casimir energy between the corresponding defect and its conjugate in flat space.", "url": "https://arxiv.org/abs/2609.04041", "type": "理论", "summary": "1. 该工作研究共形场论中带尖角的世界线缺陷，由幺正性和不同缺陷几何的切割-粘合一致性导出了尖点异常维数的若干一般界限。\n2. 其要点是证明对于共轭缺陷，改变尖角角度时最轻单态尖点与任何非单态尖点不发生能级交叉，从而确立单态尖点最轻，并利用矩形缺陷布局给出类似无自旋模bootstrap的约束。\n3. 文中构造的解析“magic”泛函进一步给出直角裸尖点维数以平面内对应缺陷与其共轭间Casimir能量表示的最优普适下界，为筛选缺陷共形数据提供了确定约束。", "summary_source": "deepseek", "authors": [{"name": "Ryan A. Lanzetta"}, {"name": "Ian Moult"}, {"name": "Yifan Wang"}], "featured_authors": [{"name": "Ryan A. Lanzetta"}, {"name": "Ian Moult"}, {"name": "Yifan Wang"}], "author_count": 3}, {"id": "2609.04099", "category": "hep-th", "title": "SCFT/VOA correspondence and R-twisted reductions of $(A_2,D_{3n-2})$ Argyres--Douglas theories", "abstract": "We study the SCFT/VOA correspondence for the $(A_2,D_{3n-2})$ Argyres--Douglas theories with $n\\geq2$. From the matching of the central charges and the equality of the Schur index with the vacuum supercharacter to all orders, we propose that the associated VOA is the logarithmic doublet algebra $\\mathcal A(4n-2)$ of Feigin, Feigin, and Tipunin. For $n=2$, this correspondence was studied in detail by Buican and Nishinaka, and our proposal extends it to $n\\geq3$. Using the Nahm sum expression for the vacuum supercharacter, we further propose a family of 3d $\\mathcal N=2$ abelian Chern--Simons matter theories that flow to the 3d $\\mathcal N=4$ SCFTs obtained by the R-twisted circle reduction, generalizing the $n=2$ construction. We determine the monopole superpotential and show that the Coulomb branch is $\\mathbb C^2/\\mathbb Z_2$ for every $n$. The superconformal index provides quantitative evidence for the proposed infrared fixed points, including the expected enhancement to $\\mathcal N=4$ supersymmetry and the Higgs and Coulomb branch structure.", "url": "https://arxiv.org/abs/2609.04099", "type": "理论", "summary": "1. 该工作研究 (A_2,D_{3n-2}) Argyres-Douglas 理论的 SCFT/VOA 对应，提出其关联 VOA 为 Feigin-Feigin-Tipunin 对数双重代数 A(4n-2)，将 n=2 结果推广到 n≥3。\n2. 技术要点在于由中心荷匹配及 Schur 指标与真空超特征逐阶相等获得该猜想，并借助 Nahm 和提出一族 3d N=2 阿贝尔 Chern-Simons 物质理论，其经 R-扭约化后的库仑支为 C^2/Z_2。\n3. 超共形指标定量支持所预言的红外不动点、N=4 超对称增强及 Higgs/库仑支结构，为这类 AD 理论的对数 VOA 与三维实现提供了可推广的范例。", "summary_source": "deepseek", "authors": [{"name": "Yutaka Yoshida"}], "featured_authors": [{"name": "Yutaka Yoshida"}], "author_count": 1}, {"id": "2609.04107", "category": "hep-th", "title": "The growth of $SO(9)$ super-representations in Type II string theory", "abstract": "We study the growth of massive $SO(9)$ super-representations in type II and type I string theories. We do this first directly by finding an empirical formula that specifies which representations appear at any level, and then compute the multiplicities from a refined partition function evaluated over finite fields up to level 501 for individual representations, and level 226 for all representations. We then derive asymptotic formulae for the growth of any representation, which are constructed by integrating about the peaks of the refined partition function. Using a Rademacher sum we can find very accurate approximations for the multiplicities of the representations. Unlike the superstring partition function, which only receives contributions from the odd Rademacher terms, the multiplicities for any representation have contributions from both even and odd terms. Finally, we apply the same techniques to the ordinary representations, where a simplified refined partition function allows for better computational speed and simpler expressions for the asymptotic approximations.", "url": "https://arxiv.org/abs/2609.04107", "type": "理论", "summary": "1. 该工作系统研究了II型与I型弦论中大量有质量SO(9)超表示的增长行为，并给出任意能级下表示类型的经验规则。\n2. 技术要点是利用有限域上的精化配分函数逐级计算多重数，并通过峰区积分推导渐近公式，结合Rademacher求和获得高精度近似，揭示一般表示同时包含偶项与奇项贡献，区别于超弦配分函数仅含奇项。\n3. 这一框架为弦光谱表示增长率的解析控制以及普通表示的高效计算提供了清晰途径，并在更高能级及相关弦论模型研究中具有直接推广潜力。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Georgoudis"}, {"name": "Joseph A. Minahan"}, {"name": "Gustav Ström"}, {"name": "Athanasios Zoumis"}], "featured_authors": [{"name": "Alessandro Georgoudis"}, {"name": "Joseph A. Minahan"}, {"name": "Gustav Ström"}, {"name": "Athanasios Zoumis"}], "author_count": 4}, {"id": "2609.04137", "category": "hep-th", "title": "Boundary conditions for axionic wormholes, imaginary distance bound and KSW allowability", "abstract": "We study four-dimensional axion wormholes in the Lorentzian mini-superspace path integral using dual scalar and three-form flux formulations. We analyze this duality for generic metric boundary conditions and real lapse integration contour, and show that it holds on any background, including complex ones. With the Dirichlet condition on the metric, the fixed-flux path integral is evaluated exactly. In the Euclidean regime, saddle geometries organize into same-side and cross-throat segments of the Giddings-Strominger (GS) wormhole, depending on whether the two boundaries lie on the same or opposite sides of the throat. A Picard-Lefschetz analysis in the covering plane of lapse reveals that the cross-throat saddle has vanishing intersection number, and therefore does not contribute. In the asymptotically flat limit, it corresponds to the imaginary wormhole that saturates the imaginary distance bound (IDB). The same conclusion follows independently on the scalar side of the duality, and is confirmed by the exact amplitude. Replacing the Dirichlet condition with a one-parameter Neumann condition, the cross-throat saddle that leads to the imaginary wormholes remains irrelevant for the physical lift of the contour. This purely imaginary parameter characterizing the Neumann condition interpolates continuously between the half- and complete-wormhole geometries. Convergence of the sum over fixed-charge sectors imposes a corresponding interpolating bound not only on the imaginary part of the boundary axion but also on the parameter characterizing the Neumann boundary condition. An independent analysis based on the KSW criterion reproduces exactly the same bound, emphasizing its compatibility with the IDB.", "url": "https://arxiv.org/abs/2609.04137", "type": "理论", "summary": "1. 该工作利用对偶标量与三形式通量两种表述，研究四维轴子虫洞在Lorentzian mini-superspace路径积分中的边界条件，并精确求得了固定通量积分。\n2. 其核心卖点在于通过lapse覆平面上的Picard-Lefschetz分析揭示cross-throat鞍点具有零相交数因而不贡献，且将Dirichlet边界条件推广为单参数Neumann条件后，该鞍点仍不贡献，复参数可连续插值半虫洞与完整虫洞。\n3. 固定电荷扇区求和收敛给出了对边界轴子虚部与Neumann参数的插值约束，并与KSW判据独立导出的界完全一致，表明该界与虚距离界相容，为虫洞路径积分中边界条件的允许性提供了可靠判据。", "summary_source": "deepseek", "authors": [{"name": "Shubhashis Mallik"}, {"name": "Neha"}, {"name": "Gaurav Narain"}], "featured_authors": [{"name": "Shubhashis Mallik"}, {"name": "Neha"}, {"name": "Gaurav Narain"}], "author_count": 3}, {"id": "2609.04191", "category": "hep-th", "title": "Baby-universe state dependence of the wormhole-induced gravi-axion mass gap", "abstract": "Euclidean wormholes can break the axion shift symmetry, and when this symmetry is broken, a periodic potential is created for the axion, and the curvature of this potential at a minimum point can give the axion mass. In this work, we take seriously the assumption that the mere existence of a wormhole does not mean that the axion mass is uniquely determined, and that more information is needed to determine it. We first show that since for a Giddings--Strominger wormhole with symmetry \\(O(4)\\), the gravitational Pontryagin density is zero, the dynamical Chern--Simons interaction can affect quantum effects, including the determinant phase and fermionic selection rules, without changing the classical wormhole action. We also conclude that in a fixed \\(\\alpha\\) sector, the axion can have a specific mass, but this mass depends on the baby-universe state and is not a universal value. Then, for the mixed case of \\(\\alpha\\) sectors that give a distribution of conditional masses, we show that the lower edge of the averaged spectral measure is determined by the essential infimum of the conditional mass squared over the $\\alpha$ distribution. Finally, we conclude that even if almost all individual sectors are massive and the mean mass squared is also non-zero, if the support of the measure accumulates at the symmetric point \\(\\alpha=0\\), the averaged spectral measure will be gapless. To clarify the discussion, we consider a clear example of this situation, which can be a Gaussian baby-universe state, and show that in it the spectral threshold starts at zero and there is no isolated massive pole. Therefore, predicting the mass and cosmology of a gravi-axion from a wormhole without specifying the baby-universe state is not a unique, state-independent prediction.", "url": "https://arxiv.org/abs/2609.04191", "type": "理论", "summary": "1. 该工作证明虫洞诱导的引力轴子质量依赖于婴宇宙态，单一虫洞并不给出唯一质量预测。\n2. 技术上，他们利用O(4)对称Giddings–Strominger虫洞的引力Pontryagin密度为零，说明动力学Chern–Simons项可在不改变经典虫洞作用的情况下影响行列式相位与费米子选择定则，并给出混合α扇区中平均谱测度下界由条件质量平方的本质下确界决定。\n3. 这指出即使几乎所有α扇区均有质量且均方质量非零，只要测度支撑在α=0处累积，平均谱仍无隙，因此引力轴子质量与宇宙学预言必须明确指定婴宇宙态。", "summary_source": "deepseek", "authors": [{"name": "Amin Rezaei Akbarieh"}], "featured_authors": [{"name": "Amin Rezaei Akbarieh"}], "author_count": 1}, {"id": "2609.03034", "category": "math-ph", "title": "Estimating the asymptotics of integer partitions in intermediate dimensions ($d = 3,4,5,6$)", "abstract": "It was recently shown by Yeliussizov \\cite{Yeliussizov} that integer partitions in dimensions $d \\geq 7$ asymptotically grow strictly faster than MacMahon numbers. As MacMahon numbers match with integer partitions in dimensions $d = 1,2$, the comparison of asymptotics of integer partitions with MacMahon numbers in intermediate dimensions ($d = 3,4,5,6$) is an open question. In this work, we perform Markov chain Monte Carlo (MCMC) simulations till $N=15000$ by using adaptive weight learning followed by conventional MCMC steps to numerically estimate the asymptotics of integer partitions in these intermediate dimensions. We numerically establish that in these intermediate dimensions, partitions asymptotically grow faster than MacMahon numbers. More specifically, assuming that the limits exist, we show: $\\lim_{n\\to\\infty}n^{-3/4}\\log p_3(n) = 1.8196 \\pm 0.0019$, $\\lim_{n\\to\\infty}n^{-4/5}\\log p_4(n) = 1.7215 \\pm 0.0045$, $\\lim_{n\\to\\infty}n^{-5/6}\\log p_5(n) = 1.6521 \\pm 0.0059$, and $\\lim_{n\\to\\infty}\\log n^{-6/7}p_6(n) = 1.652 \\pm 0.021$ for partitions in dimensions $d=3,4,5,$ and $6$ respectively. These numbers are all larger than MacMahon leading order asymptotic coefficients of $1.7898, 1.6614, 1.5737,$ and $1.509$ respectively. Additionally, we also find estimates for some of the sub-leading asymptotic terms in $\\log p_d(n)$ in each of the dimensions.", "url": "https://arxiv.org/abs/2609.03034", "type": "理论", "summary": "1. 该工作通过马尔可夫链蒙特卡洛模拟，在N=15000规模下数值估计了中间维度d=3,4,5,6整数分拆的对数渐近。\n2. 其技术特点是采用自适应权重学习预训练后再做标准MCMC采样，给出主阶系数分别为1.8196、1.7215、1.6521与1.652，均超过MacMahon数对应系数，并估计了部分次主导项。\n3. 这一结果把“d≥7时增长快于MacMahon数”的画面推广到中等维度，为后续严格证明及更精确渐近展开提供了清晰的数值参照。", "summary_source": "deepseek", "authors": [{"name": "Avinandan Mondal"}], "featured_authors": [{"name": "Avinandan Mondal"}], "author_count": 1}, {"id": "2609.03197", "category": "math-ph", "title": "Computational Algorithms for Invariant Reduction of Variational Forms", "abstract": "Symmetry reductions of partial differential equations (PDEs) inherit more geometric structures than other types of reductions: invariant conservation laws, variational structures, and, under suitable conditions, Hamiltonian-type structures of the original model descend to the reduced model through the mechanism of invariant reduction. This paper develops computational algorithms that carry out such reductions explicitly. We use the interpretation of variational $p$-forms as conservation laws of an enlarged system --- the (degree-shifted) tangent system --- consisting of the original equations together with their linearizations, in which the perturbation variables are treated as anticommuting. This allows us to formulate the algorithms using well-known concepts from the theory of conservation laws, naturally adapted to the graded-commutative setting. The reduction of conservation laws, variational $1$-forms, and presymplectic structures thereby becomes a single algorithmic procedure. We present (i) a homotopy-based reduction algorithm for systems of evolution equations, implemented in Maple; (ii) a descent reduction algorithm applicable to general $\\ell$-normal systems for $p>0$; and (iii) a simple reduction algorithm available for point symmetries under suitable conditions, including the description of reductions in terms of systems involving fewer independent variables. Examples include nonlinear evolution equations in one and two spatial dimensions, the Laplace equation, the incompressible Euler equations, and the cotangent system of Pavlov's equation.", "url": "https://arxiv.org/abs/2609.03197", "type": "理论", "summary": "1. 该工作为变分形式的不变约化设计了计算算法，使偏微分方程的对称约化得以显式保持守恒律、变分结构及哈密顿类结构。\n2. 其技术核心是把变分p形式解释为包含线性化的切系统中的守恒律，借助反交换扰动变量与分次交换框架，将守恒律、变分1形式与预辛结构的约化统一为单一算法。\n3. 这为实际构造非线性演化方程、Euler方程等系统的几何约化提供了可操作工具，并启发后续利用同伦及下降算法系统处理更广约化问题。", "summary_source": "deepseek", "authors": [{"name": "Kostya Druzhkov"}, {"name": "Alexey Shevyakov"}], "featured_authors": [{"name": "Kostya Druzhkov"}, {"name": "Alexey Shevyakov"}], "author_count": 2}, {"id": "2609.03224", "category": "math-ph", "title": "Optimal bounds for embedded eigenvalues of one-dimensional discrete Schrödinger operators with decaying potentials", "abstract": "In this paper, we consider one-dimensional discrete Schrödinger operators \\begin{align} Hu(n)=(\\Delta+V)u(n)\\nonumber \\end{align} on $\\ell^2(\\mathbb{N})$ with a self-adjoint boundary condition at $n=0$, where $\\Delta$ denotes the discrete Laplacian and $V(n)$ is a real-valued perturbation satisfying $$V(n)=\\frac{O(1)}{1+n}.$$ We determine the sharp transition for the asymptotic coefficient of \\(V\\) governing the existence and nonexistence of embedded eigenvalues.", "url": "https://arxiv.org/abs/2609.03224", "type": "理论", "summary": "1. 该工作研究一维离散薛定谔算子在边界条件与衰减势下的嵌入特征值存在性。\n2. 其技术要点是确定势渐近系数中控制嵌入特征值有无的尖锐临界阈值。\n3. 这为离散算子的谱理论与奇异连续谱过渡问题提供了精确判定依据。", "summary_source": "deepseek", "authors": [{"name": "Jifeng Chu"}, {"name": "Wencai Liu"}, {"name": "Kang Lyu"}], "featured_authors": [{"name": "Jifeng Chu"}, {"name": "Wencai Liu"}, {"name": "Kang Lyu"}], "author_count": 3}, {"id": "2609.03536", "category": "math-ph", "title": "Controllability, returning waves and scattering without reverberation in 3D acoustic dynamic system", "abstract": "The dynamic acoustic scattering system is governed by the wave equation $u_{tt}-\\Delta u+qu=0$ in $\\Bbb R^3,\\,\\,\\,-\\infty<t<\\infty$, with a compactly supported potential $q$ and infinitely distant sources (controls) $f$, which initiate incoming spherical waves $u=u^f(x,t)$ provided $u^f\\big|_{|x|<-t,\\,\\,\\,t<0}=0$. These waves are focused at $x=0$ and fill up the whole space at the moment $t=0$. The system is {\\it controllable} if the set of waves $u^f(\\cdot,0)$ produced by all finite energy controls $f$, covers the space $L_2(\\Bbb R^3)$. As we show, if the Hamiltonian $H=-\\Delta+q$ has the bound states, then in the space the points $a$ appear such that the system, being refocused at $x=a$, loses controllability. The latter leads to a physical effect: the waves $u^f$ of finite energy appear, which vanish simultaneously in the past and future cones $|x|<\\pm\\, t$ and leave the region of inhomogeneity of $q$ without reverberation. This effect has some similarities with the wavefront reversal (Time Reversing Mirror), but is more meaningful from a mathematical point of view.", "url": "https://arxiv.org/abs/2609.03536", "type": "理论", "summary": "1. 该工作研究了三维含势声学散射系统中由无穷远源激发的有限能量波场在零时刻的可控性。\n2. 其要点是证明当哈密顿量存在束缚态时，系统在重新聚焦点处丧失可控性，并据此构造出在过去与未来锥内同时消隐、无混响离开非均匀区的特殊波动。\n3. 这一结果将谱的束缚态结构与可控性缺失及类时间反演镜效应联系起来，为异质介质中无回波定向聚焦提供了数学判据与潜在调控思路。", "summary_source": "deepseek", "authors": [{"name": "Mikhail I. Belishev"}, {"name": "Aleksei F. Vakulenko"}], "featured_authors": [{"name": "Mikhail I. Belishev"}, {"name": "Aleksei F. Vakulenko"}], "author_count": 2}, {"id": "2609.03832", "category": "math-ph", "title": "The conductivity matrix at the t
