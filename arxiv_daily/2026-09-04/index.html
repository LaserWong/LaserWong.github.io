  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2609.02934", "category": "cond-mat", "title": "Classical dipolar Heisenberg models on the Archimedean and Laves lattices", "abstract": "We study classical Heisenberg spins interacting through the dipole--dipole interaction on the eleven Archimedean and eight Laves planar lattices at canonical geometry, which reduce to fifteen distinct vertex sets. For each lattice we compute the Fourier-space interaction matrix $\\Am(\\bk)$, extract the Luttinger--Tisza ordering wave vector $\\bk_{0}$, determine the classical ground state by unconstrained minimization on the commensurate magnetic cell, and evaluate the linearized spin-wave dispersion $\\varepsilon_{i}(\\bk)$ along the high-symmetry path of the (magnetic) Brillouin zone together with the Holstein--Primakoff moment reduction. The ground states fall into three classes: five are collinear, two are non-collinear at angles commensurate with the lattice symmetry, and eight cant at transcendental angles, which we determine to thirty digits. Across the family, failure of the Luttinger--Tisza strong condition coincides exactly with the appearance of incommensurate canting, with no exceptions in either direction. Truncating the interaction range shows that whether a lattice cants is fixed by the local coordination geometry, whereas the value of the canting angle is set by the long-range tail. The quantum corrections are governed by the magnon spectrum through the size of the magnetic basis and are uncorrelated with frustration, so that the frustration and fluctuation classifications are independent; the corner-sharing lattices host the narrowest low-energy branches. The results constitute a spectral atlas of dipolar Heisenberg systems on the full family of $1$-uniform planar tilings and their duals, and provide predictions for inelastic neutron scattering in materials whose magnetic ions occupy Archimedean or Laves lattices, and for artificial arrays of dipolar-coupled nanomagnets.", "url": "https://arxiv.org/abs/2609.02934", "type": "理论+数值", "summary": "1. 该工作对十一种阿基米德与八种Laves平面晶格（合并为十五种顶点集）上的经典偶极海森伯模型作系统研究，求得了各晶格的基态与线性自旋波色散。\n2. 其核心发现在于：Luttinger–Tisza强条件失效与不可公度倾斜严格一致，是否倾斜取决于局域配位，而倾斜角由长程偶极尾确定；量子涨落修正只随磁基大小变化，与阻挫程度无关。\n3. 该结果构成完整谱学图集，可为占据这些晶格的磁性材料提供非弹性中子散射预言，并对偶极耦合纳米磁体人工阵列的设计给出指导。", "summary_source": "deepseek", "authors": [{"name": "Josep Batle"}], "featured_authors": [{"name": "Josep Batle"}], "author_count": 1}, {"id": "2609.02936", "category": "cond-mat", "title": "Dipolar order across Bravais lattice space: classification, spin waves, and a four-attractor phase diagram", "abstract": "Every crystal is a Bravais lattice decorated by a basis, so the dipolar ordering of the fourteen Bravais lattices is the natural starting point for any systematic theory of dipolar magnetism in three dimensions. We determine it here in a single common framework: the interaction tensor is Ewald-summed, the classical ground state is obtained by minimising the lowest Luttinger--Tisza band over the entire Brillouin zone, and the linear spin-wave spectrum with its zero-point corrections is computed for every lattice whose order is collinear. Three results emerge that are not properties of individual lattices but of the landscape. First, two structural principles --- the exact tracelessness of the dipolar tensor in three dimensions, and its identical vanishing at $\\mathbf k=0$ for every cubic-symmetric lattice --- explain the ordering type, the absence of first-order cubic anisotropy, and the systematics of the zero-point moment reduction. Second, exactly one lattice defeats the Luttinger--Tisza construction: for face-centred orthorhombic the optimal eigenvector is not circular, the single-$\\mathbf k$ state is a spin-density wave of non-constant length, and the tabulated energy is a strict lower bound; direct supercell minimisation gives the true ground state. Third, optimising each family over its free metric parameters collapses the whole of Bravais space onto only \\emph{four} attractors, with body-centred tetragonal the global optimum and a single interior optimum at rhombohedral $\\alpha=62.42^\\circ$ lying below face-centred cubic. Three independent published benchmarks are reproduced.", "url": "https://arxiv.org/abs/2609.02936", "type": "理论+数值", "summary": "1. 该工作围绕《Dipolar order across Bravais lattice space: classification, spin waves, and a four-attractor phase diagram》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Josep Batle"}], "featured_authors": [{"name": "Josep Batle"}], "author_count": 1}, {"id": "2609.02946", "category": "cond-mat", "title": "A Unified Description of Dirac-Cone Anisotropies in Two Dimensions", "abstract": "Anisotropies in two-dimensional materials are responsible for a variety of effects that significantly modify their physical properties. In this paper, we present a covariant modification of the Dirac equation that incorporates anisotropies into the effective low-energy description around the Dirac point. The model is constructed by analogy with a Lorentz-violating extension of the Standard Model of elementary particles and yields a (2+1)-dimensional framework describing physical effects such as shifted, tilted, and distorted Dirac cones through its free parameters. The proposed model thus provides a general and unified framework in which distinct anisotropy-induced modifications of the Dirac spectrum and their combinations can be systematically characterized. We further apply the model to strained graphene and show that its effective parameters can be quantitatively extracted from first-principles electronic band structures while retaining a direct geometrical interpretation. These results establish a connection between the microscopic electronic structure and a material-independent effective description of anisotropic two-dimensional Dirac systems.", "url": "https://arxiv.org/abs/2609.02946", "type": "理论", "summary": "1. 该工作提出一个协变修正的二维狄拉克方程，用于统一描述狄拉克锥附近的各向异性低能物理。\n2. 其卖点在于参照洛伦兹破缺扩展构造有效模型，以自由参数系统刻画移动、倾斜与畸变狄拉克锥，并可由应变石墨烯的第一性原理能带定量提取参数。\n3. 这为微观电子结构与材料无关的有效描述之间建立了桥梁，并为二维各向异性狄拉克材料的高通量表征和应变工程提供统一框架。", "summary_source": "deepseek", "authors": [{"name": "L. C. T. Brito"}, {"name": "Cleverson Filgueiras"}, {"name": "D. M. Lopes"}, {"name": "A. G. Martins"}, {"name": "Igor S. S. de Oliveira"}], "featured_authors": [{"name": "L. C. T. Brito"}, {"name": "Cleverson Filgueiras"}, {"name": "D. M. Lopes"}, {"name": "A. G. Martins"}, {"name": "Igor S. S. de Oliveira"}], "author_count": 5}, {"id": "2609.02948", "category": "cond-mat", "title": "FrOGS: Discrete Neural Sampler for Independent Alloy Configurations Across Chemical Conditions", "abstract": "Predicting the thermodynamic properties of an alloy requires sampling its configurations across many chemical conditions and recovering free energies on a common absolute scale. Markov chain Monte Carlo (MCMC) is the standard tool, but it requires separate simulations at different conditions, and auxiliary free-energy methods such as thermodynamic integration are used to place results on a common absolute scale. Modern discrete neural samplers typically use reverse KL divergence as the objective and can be mode-seeking or biased. We present Free energy Offering Generative Sampler (FrOGS), a hybrid discrete neural sampler that couples an autoregressive model to a continuous-time Markov chain (CTMC) to be trained jointly under a single shared loss. FrOGS draws i.i.d. configurations, returns an unbiased estimate of the partition function, and gives consistent estimates of thermodynamic observables. We train a single model across a wide range of chemical conditions to produce estimates on a common absolute free-energy scale. FrOGS matches exact finite-size results on the 2D Ising model and reference phase diagrams for AgPd and CuAu, without mode collapse. We additionally compare to SEGAL, a published autoregressive baseline, and find that only FrOGS recovers the stability range of the CuAu$_3$ phase.", "url": "https://arxiv.org/abs/2609.02948", "type": "理论+数值", "summary": "1. 该工作提出自由能生成采样器FrOGS，将自回归模型与连续时间马尔可夫链联合训练，用于跨化学条件生成独立合金构型。\n2. 其技术卖点是共享损失下获得配分函数的无偏估计与一致热力学观测量，单模型覆盖宽化学条件且置于绝对自由能标度，避免模式坍缩，并在Ising、AgPd和CuAu上匹配基准，重现CuAu3相稳定性。\n3. 该框架有望替代逐点MCMC并省去热力学积分环节，为合金相图和跨化学条件材料热力学的高通量预测提供可靠途径。", "summary_source": "deepseek", "authors": [{"name": "Kyucheol Min"}, {"name": "Elyssa Hofgard"}, {"name": "Tess Smidt"}], "featured_authors": [{"name": "Kyucheol Min"}, {"name": "Elyssa Hofgard"}, {"name": "Tess Smidt"}], "author_count": 3}, {"id": "2609.02957", "category": "cond-mat", "title": "Decoherence-controlled collective criticality in a two-dimensional quantum Stag Hunt", "abstract": "Physical decoherence can preserve the microscopic strategic neutrality condition of a quantum game while changing the thermodynamic regime of the corresponding interacting population. We demonstrate this for an Eisert--Wilkens--Lewenstein (\\textit{EWL}) Stag Hunt embedded as independent nearest neighbor encounters on a square lattice. For the restricted strategies $\\mathsf{Q}=i\\mathbb{Z}$ and $\\mathsf{D}=i\\mathbb{Y}$, noisy two-player payoff matrices are determined for phase damping, depolarization, and amplitude damping and mapped exactly to channel dependent Ising parameters $\\mathfrak{J}(\\Gamma,p)$ and $\\mathfrak{H}(\\Gamma,p)$. Phase damping and depolarization show the clearest contrast: they share the same microscopic neutrality branch $\\mathfrak{H}=0$, while only depolarization suppresses the interaction as $(1-p)^2$. At $\\beta=1$, this produces an exact depolarization-driven square-lattice critical point at $p_{*}\\approx 0.233460\\ldots$, whereas phase damping remains in the ordered coexistence regime along the same neutrality branch. Monte Carlo finite size scaling is consistent with two-dimensional Ising criticality and distinguishes field driven coexistence below $p_{*}$ from a smooth crossover above it. Amplitude damping additionally reveals a strong dependence on channel placement: the post-strategy neutrality branch reaches $\\Gamma=0$ at $p=1/3$ and then disappears. Resource negativity further shows that microscopic two-qubit entanglement and collective interaction strength are distinct quantities. The resulting extended lattice remains an ordinary classical Ising system.", "url": "https://arxiv.org/abs/2609.02957", "type": "理论+数值", "summary": "1. 该工作将正方格点上的含噪EWL猎鹿博弈精确映射为依赖信道的伊辛模型，研究退相干对集体临界性的作用。\n2. 其核心发现在于退极化噪声于β=1处给出精确临界点p*≈0.233460，而相位阻尼保持有序共存，振幅阻尼则消除中性支。\n3. 这显示微观纠缠与集体相互作用强度相互独立，为借退相干调控经典统计力学临界行为提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Rajdeep Tah"}], "featured_authors": [{"name": "Rajdeep Tah"}], "author_count": 1}, {"id": "2609.02968", "category": "cond-mat", "title": "Battery open-circuit voltage is not purely chemical", "abstract": "Open-circuit-voltage (OCV) curves are commonly treated as intrinsic chemical properties of electrode materials. However, this view is incomplete. In ion-insertion batteries, OCV also depends on mechanical state and microstructure. Using finite-element simulations and asymptotic analysis, we show that particle swelling and external loads promote particle--particle contact that generates compressive stresses, shifting the inserted-ion chemical potential. The OCV correction is nonlinear, follows Hertzian contact scaling, and depends on particle arrangement. Identical materials can therefore exhibit different OCV curves in different electrode microstructures. Furthermore, in full cells, electrodes are mechanically coupled through the common stack stress. Thus, cell OCV is a chemo-mechanical property of the entire battery architecture, not chemistry alone.", "url": "https://arxiv.org/abs/2609.02968", "type": "理论+数值", "summary": "1. 该工作通过有限元模拟与渐近分析论证，离子嵌入电池的开路电压并非纯化学量，而与电极颗粒的力学状态和微观结构耦合。\n2. 其核心机制是颗粒溶胀与外载导致颗粒间接触产生 Hertz 型压缩应力，非线性地改变嵌入离子化学势，使得相同材料在不同电极结构中呈现不同 OCV 曲线。\n3. 因此全电池 OCV 应视为整个电池架构的化学-力学性质；后续建模与实验表征需同时考虑堆叠应力、微结构及机械耦合。", "summary_source": "deepseek", "authors": [{"name": "Andrea Giudici"}, {"name": "Christoph Pohl"}, {"name": "Alberto Salvadori"}, {"name": "Colin Please"}, {"name": "Manuel Landstorfer"}, {"name": "Jon Chapman"}], "featured_authors": [{"name": "Andrea Giudici"}, {"name": "Christoph Pohl"}, {"name": "Alberto Salvadori"}, {"name": "Colin Please"}, {"name": "Manuel Landstorfer"}, {"name": "Jon Chapman"}], "author_count": 6}, {"id": "2609.02979", "category": "cond-mat", "title": "IDMate: Window-resolved self-consistent-field proposal screening with finite-temperature response bounds", "abstract": "We introduce IDMate, a Kohn--Sham framework for screening approximate self-consistent-field (SCF) states with a finite-temperature response bound and deterministic reference-map recovery. A charge-neutral factorization separates electronic conditioning from mixer amplification, while fixed-point-preserving rank-one interventions test their roles in the linearized dynamics. For a fixed Hamiltonian, exact electron number, and temperature, strong convexity of the Mermin free-energy functional yields an a posteriori density-matrix bound in a selected spectral window. Across $3{,}586$ stress trials, $1{,}942$ proposals were accepted and none exceeded the window criterion. Under trial independence, the one-sided $95\\%$ zero-event upper bound is $8.4\\times10^{-4}$; treating the 70 correlated ladders as independent units gives $4.2\\times10^{-2}$ per ladder. In three reference configurations, the integrated screening rule replaced ten reference-map evaluations, reproduced the reference-scoring trajectories, and satisfied every terminal comparison criterion. Window and full-space deviations differ by six to eleven orders of magnitude; full-space distance classifies the window decisions with a descriptive pooled AUC of $0.694$ (row-bootstrap $95\\%$ interval $[0.544,\\,0.831]$). A predefined cross-lineage work model does not meet its acceptance criterion, and serial proposal construction makes the production implementation $7.87$ times as costly under the predefined charged-cost accounting as its all-reference counterfactual. IDMate establishes a rigorous exact-trace window bound, a tested accept-or-recover rule, and explicit full-space and implementation targets for net acceleration.", "url": "https://arxiv.org/abs/2609.02979", "type": "理论+数值", "summary": "1. 该工作提出 IDMate，一个在有限温度下以响应界筛选 Kohn–Sham 自洽场候选态、并具确定性参考映射恢复能力的框架。\n2. 其技术要点是利用固定点保持的秩一干预与电荷中性分解分离电子条件化和混频放大，并借 Mermin 自由能强凸性在选定的谱窗口内导出严格的密度矩阵事后界，3586 次应力试验无一超据窗口判据。\n3. 鉴于全空间距离仅具有限的窗口分类能力，该接受-恢复准则为可证加速提供了明确标尺，但序列化构造带来的 7.87 倍代价表明净收益仍待全空间与实现层面的进一步优化。", "summary_source": "deepseek", "authors": [{"name": "Peng Kang"}, {"name": "Da Wan"}, {"name": "Shulin Bai"}, {"name": "Zhen Li"}, {"name": "Yu Liu"}, {"name": "Lei Zheng"}, {"name": "Li-Dong Zhao"}, {"name": "Huibin Xu"}], "featured_authors": [{"name": "Peng Kang"}, {"name": "Da Wan"}, {"name": "Shulin Bai"}, {"name": "Lei Zheng"}, {"name": "Li-Dong Zhao"}, {"name": "Huibin Xu"}], "author_count": 8}, {"id": "2609.03018", "category": "cond-mat", "title": "Microscopically exact transport equation for the quantum Calogero model", "abstract": "We derive an exact transport equation for the quantum Calogero model, i.e. inverse-square interacting bosons on a line, from microscopic first principles.", "url": "https://arxiv.org/abs/2609.03018", "type": "理论", "summary": "1. 该工作直接从微观第一性原理出发，对沿直线运动且具有反平方相互作用的一维玻色子体系——量子Calogero模型，严格推导出精确的输运方程。\n2. 其技术核心在于不引入截断或微扰，仅运用模型精确可积结构，将单粒子相空间分布的完整时间演化严格封闭为自洽的输运方程，从而直接沟通微观动力学与宏观输运描述。\n3. 这为一维可积量子流体输运性质的精确刻画确立了严格的微观基础，也可为广义流体力学等有效理论的适用范围提供可检验的基准。", "summary_source": "deepseek", "authors": [{"name": "Vir B. Bulchandani"}, {"name": "Fabian H. L. Essler"}], "featured_authors": [{"name": "Vir B. Bulchandani"}, {"name": "Fabian H. L. Essler"}], "author_count": 2}, {"id": "2609.03075", "category": "cond-mat", "title": "Orbital current rectifier and linear magnon Edelstein effect in $p$-wave antialtermagnets", "abstract": "We show that $p$-wave magnets efficiently generate magnetization via a linear thermal Edelstein effect arising from the orbital magnetic moments of their magnons. Furthermore, they can generate perfectly nonreciprocal orbital currents through a purely even-order nonlinear response. This makes them promising candidates for orbital-current rectification. Because these transport phenomena originate from the orbital magnetic moment of magnons, they connect magnonics and orbitronics. More generally, we find that odd-parity-wave magnets with coplanar ground states host magnons with zero spin magnetic moment. Instead the magnons carry a collinear, out-of-plane orbital magnetic moment, realizing an orbital version of antialtermagnetism. We establish these general results using symmetry arguments and demonstrate them explicitly for a coplanar ground state with the minimal number of sublattices, inspired by the ground state of CeNiAsO. Our conclusions hold both in absence and presence of spin-orbit coupling.", "url": "https://arxiv.org/abs/2609.03075", "type": "理论", "summary": "1. 该工作证明p波反交变磁体中的磁子轨道磁矩可驱动线性热Edelstein效应，并通过纯偶阶非线性响应产生完美非互易轨道电流，从而实现轨道电流整流。\n2. 其核心在于揭示共面基态下此类磁体的磁子自旋磁矩为零，却携带共线面外轨道磁矩，构成轨道反交变磁性，且该结论在有、无自旋轨道耦合时均成立。\n3. 这一发现将磁子学与轨道电子学相连，为基于轨道磁矩的磁子输运调控及整流器件设计提供了新的材料选择与对称性判据。", "summary_source": "deepseek", "authors": [{"name": "Kristian Mæland"}, {"name": "Björn Trauzettel"}], "featured_authors": [{"name": "Kristian Mæland"}, {"name": "Björn Trauzettel"}], "author_count": 2}, {"id": "2609.03110", "category": "cond-mat", "title": "Critical scaling and soft granular rheology of frictionless non-Brownian suspensions across jamming", "abstract": "We carry out 3D computer simulations to study suspension rheology across the jamming transition for deformable non-Brownian frictionless particles. The simulations are carried out at constant shear rates and suspension densities ($\\dot{\\gamma} , \\phi$), for polydisperse spherical particles. The suspension is probed at densities in the neighbourhood of the jamming point $\\phi_c$ , as well as across much wider density ranges. We carry out critical scaling analysis of our close-to-jamming data and confirm that shear-driven jamming is a second-order critical phenomenon requiring strong corrections on shear. We build maps of the local strain rate exponent to classify flow regimes and examine the effect of the corrections on the suspension rheology. Further, using the critical scaling jamming density, we carry out soft granular rheological scaling over the wider density range, demonstrating an excellent data collapse. The soft granular rheology relations are able to predict our data over almost the entire dynamical and density range.", "url": "https://arxiv.org/abs/2609.03110", "type": "理论+数值", "summary": "1. 该工作通过三维恒定剪切速率与密度控制的数值模拟，系统研究了多分散可变形无摩擦非布朗球形颗粒悬浮液在堵塞转变附近及更宽密度区间的剪切流变。\n2. 其主要技术卖点是给出剪切驱动堵塞为需强剪切修正的二阶临界现象的标度证据，并借助临界堵塞密度将软颗粒流变学标度成功扩展到整个动力学与密度范围，获得良好数据塌缩。\n3. 这为将临界标度与软颗粒流变学框架统一应用于非布朗悬浮液，并依据局域应变率指数图预测复杂流变行为提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Rohan Vernekar"}, {"name": "Romain Mari"}, {"name": "Bruno Chareyre"}, {"name": "Hugues Bodiguel"}], "featured_authors": [{"name": "Rohan Vernekar"}, {"name": "Romain Mari"}, {"name": "Bruno Chareyre"}, {"name": "Hugues Bodiguel"}], "author_count": 4}, {"id": "2609.03111", "category": "cond-mat", "title": "Large deviations for linear regressions", "abstract": "Linear regression is one of the simplest and most widely used tools to learn patterns from data: it fits a set of coefficients so that a linear combination of predictors best matches observed responses. The quality of the fit is measured by the residual sum of squares, the total squared mismatch between predictions and data, whose minimum defines the training loss. We consider Gaussian design and noise, with teacher coefficients independently drawn from a general distribution $p(\\beta)$, and a general class of separable regularizers, including Ridge and Lasso. Using the zero-temperature replica method, we compute analytically the large-deviation statistics of the minimum training loss for large numbers $P$ of predictors and $N$ of observations, with $r=P/N$ fixed. The rate function we compute governs rare sample-to-sample fluctuations of the optimal loss. Extensive numerical simulations are in excellent agreement with our theory and clearly show a pronounced deviation from the Gaussian regime of typical fluctuations in the tails.", "url": "https://arxiv.org/abs/2609.03111", "type": "理论+数值", "summary": "1. 该工作利用零温复制方法解析计算了高维线性回归中最小训练损失的大偏差率函数。\n2. 其技术卖点是在高斯设计与噪声、一般教师先验及可分正则化下，精确刻画稀有样本涨落对最优损失的指数级偏离。\n3. 这为岭回归与套索等模型中超越典型高斯涨落的尾部统计提供了可检验的物理框架与数值验证。", "summary_source": "deepseek", "authors": [{"name": "Silvia Bartolucci"}, {"name": "Fabio Caccioli"}, {"name": "Francesco Caravelli"}, {"name": "Pierpaolo Vivo"}], "featured_authors": [{"name": "Silvia Bartolucci"}, {"name": "Fabio Caccioli"}, {"name": "Francesco Caravelli"}, {"name": "Pierpaolo Vivo"}], "author_count": 4}, {"id": "2609.03123", "category": "cond-mat", "title": "Death by mutants: unusual multicritical dynamics in a two-species model for absorbing state transitions", "abstract": "We explore the phases and active-to-absorbing state phase transitions (AAPT) in a two-species model, where the species A and its mutant B are {\\em asymmetrically} or {\\em nonreciprocally} coupled. We identify a multicritical point that connects the global absorbing state of both the species and its mutant, with a uniform active state. The critical dynamics at this multicritical point is studied within the lowest order perturbation theory. This asymmetric coupling between species A and mutant B leads to unequal and distinct upper critical dimensions $d_c^A$ and $d_c^B$ respectively for A and B dynamics. We show that the multicritical point in this model is characterised by an unusual breakdown of scale-invariance by fluctuation-induced logarithmic modulations with power law behaviour of the order parameter and correlation lengths of the species A at all dimensions $d<d_c^A$. Above $d_c^A$, conventional scale-invariance is restored. The dynamics of the mutant species B belongs to the DP universality class with an upper critical dimension of $d_c^B=4$", "url": "https://arxiv.org/abs/2609.03123", "type": "理论", "summary": "1. 该工作将普通物种及其突变体视为非互易耦合的双物种模型，用最低阶微扰论研究活性至吸收态相变，并识别出连接共同吸收态与均匀活性态的一个多临界点。\n2. 物理卖点在于不对称耦合使两个物种的上临界维度不同，其中突变体仍服从上临界维数为四的有向逾渗类，而另一物种的多临界动力学在对应维数以下由涨落诱导出幂律加对数调制，破坏常规标度不变性。\n3. 该结论在吸收态相变理论中引入了由“突变体致死”引起的非互易多临界机制，为在含方向性或不对称相互作用的晶格系统及生态动力学中检验非传统标度行为提供了明确范例。", "summary_source": "deepseek", "authors": [{"name": "Astik Haldar"}, {"name": "Abhik Basu"}], "featured_authors": [{"name": "Astik Haldar"}, {"name": "Abhik Basu"}], "author_count": 2}, {"id": "2609.03173", "category": "cond-mat", "title": "Topological Boundary States and the Edge Chain in Semi-Infinite Two-Dimensional Insulators", "abstract": "We show that it is possible to compute the adiabatically protected edge and corner states of semi-infinite, two-dimensional, topological insulators by considering the first layer of lattice sites, what we call the \"edge chain,\" independently from the bulk. We start by accepting this claim as an ansatz, then, using the Shemesh theorem, we show that the edge states one finds using our procedure are adiabatically protected, provided we restrict ourselves to adiabatic evolutions that do not break chiral symmetry. We show explicit examples of our method in a 2D extension of the SSH model, the SSH3 model, the Haldane model and the Breathing Kagome Lattice.", "url": "https://arxiv.org/abs/2609.03173", "type": "理论", "summary": "1. 该工作提出一种直接计算半无限二维拓扑绝缘体中受绝热保护的边界态与角态的方法，仅把第一层格点构成的“边缘链”纳入考量。\n2. 核心卖点是以该想法作为假设，并借助Shemesh定理证明在手征对称性不被破坏的绝热演化下所得边缘态仍受绝热保护，从而免去整体体态求解。\n3. 该方法适用于SSH3、Haldane模型与呼吸Kagome晶格，为手征对称类拓扑边界态的降维刻画和模型筛选提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Ilya Iakoub"}, {"name": "Nicolas Levasseur"}, {"name": "Richard MacKenzie"}], "featured_authors": [{"name": "Ilya Iakoub"}, {"name": "Nicolas Levasseur"}, {"name": "Richard MacKenzie"}], "author_count": 3}, {"id": "2609.03179", "category": "cond-mat", "title": "Accelerating stochastic processes through nonequilibrium driving: Thermodynamic constraints on the maximum speed-up", "abstract": "We derive a new set of bounds controlling the speed-up of the survival rate of trajectory-dependent observables induced by the application of a perturbation. Via the study of survival probabilities in two different contexts, continuous-time Markov jump processes and overdamped diffusions, we obtain different fashions of the bound on the achievable boost. These bounds, obtained by a nonlinear response theory of constrained path probabilities, are explicitly linked to thermodynamics. For arbitrary time-dependent survival rates, we find a linear bound that depends on both the perturbation strength and the entropy production rate prior to the perturbation. For rare processes characterized by a constant survival rate, the bound is exponential and is determined by the excess heat generated by the perturbation. We exemplify the inequalities on two prototypical model systems, namely, a unicyclic network and forced diffusion in a bistable potential.", "url": "https://arxiv.org/abs/2609.03179", "type": "理论+数值", "summary": "1. 该工作推导了一组新的热力学约束，界定了非平衡微扰驱动对轨迹依赖可观测量生存率可实现加速提升的幅度。\n2. 技术上，通过约束路径概率的非线性响应理论，对任意时变生存率给出由微扰强度与先验熵产生率共同决定的线性界，并对恒定生存率下的稀有过程给出由超额热量决定的指数界。\n3. 这些结果统一适用于连续时间马尔可夫跳变与过阻尼扩散，并在单环网络与双稳态势阱强迫扩散模型中验证，为热力学约束下稀有事件的加速提供了普适判据。", "summary_source": "deepseek", "authors": [{"name": "Davide Santolin"}, {"name": "Gianmaria Falasco"}], "featured_authors": [{"name": "Davide Santolin"}, {"name": "Gianmaria Falasco"}], "author_count": 2}, {"id": "2609.03193", "category": "cond-mat", "title": "Generative Nested Sampling of Atomistic Thermodynamic Landscapes", "abstract": "Nested sampling (NS) resolves the thermodynamics of an atomistic system from a single simulation, but its practical reach is limited by the Markov-chain updates needed to decorrelate walkers within each likelihood-constrained ensemble. Flow-based NS has removed this bottleneck for gravitational-wave (GW) inference, yet its transfer to atomistic systems is not merely a change of application. Comparing a GW150914-like binary-black-hole likelihood with an eight-particle two-dimensional Lennard-Jones (LJ) system of comparable dimensionality, we show that the two landscapes differ fundamentally: atomistic multimodality is discrete and combinatorial, generated by particle permutations separated by hard collision walls, and its coordinate coupling is dense and collective, whereas the GW posterior exhibits smooth degeneracies and localized parameter coupling. Guided by this diagnosis, we introduce NS-Flows: a single conditional normalizing flow, conditioned on the NS energy bound and trained on a sliding window of recent live sets, that replaces MCMC by direct parallel draws corrected by importance-weighted rejection resampling. Live sets supply data self-consistently, allowing flow training without structured priors or a pre-existing dataset. For LJ disks in PBC, the algorithm reduces energy evaluations by over two orders of magnitude and wall-clock time by roughly one third, an advantage that becomes increasingly favorable as the cost of the potential grows. The flow's generation efficiency further acts as a physical diagnostic: it varies non-monotonically along the annealing trajectory, is lowest in the dense disordered regime, and is quantitatively captured by the constrained ensemble's internal mode complexity together with target drift across the training window, identifying liquid-like ensembles, rather than prior-target separation, as the hard case for current flow architectures.", "url": "https://arxiv.org/abs/2609.03193", "type": "理论+数值", "summary": "1. 该工作针对原子体系提出NS-Flows，将嵌套抽样与条件归一化流结合，并在周期边界LJ盘体系上验证其对热力学景观的采样性能。\n2. 其核心是以能量界为条件，用近期活跃集合的滑动窗口自洽训练单一条件流，再通过重要性加权拒绝重采样替代MCMC，使能量评估减少逾两个数量级，墙钟时间下降约三分之一。\n3. 流的生成效率同时充当物理诊断，定量对应受限系综的内部模态复杂度与目标漂移，指出致密无序液态系综是当前流架构的关键难点与改进方向。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Coretti"}, {"name": "Nico Unglert"}, {"name": "Sebastian Falkner"}, {"name": "Georg K. H. Madsen"}, {"name": "Christoph Dellago"}], "featured_authors": [{"name": "Alessandro Coretti"}, {"name": "Nico Unglert"}, {"name": "Sebastian Falkner"}, {"name": "Georg K. H. Madsen"}, {"name": "Christoph Dellago"}], "author_count": 5}, {"id": "2609.03217", "category": "cond-mat", "title": "Optimal Control of Periodic Nonequilibrium Mechanochemical Systems via Automatic Differentiation", "abstract": "Biological molecular machines are mesoscopic systems that act repeatedly and periodically to perform important cellular tasks while contending with strong fluctuations and operating in an overdamped regime. Optimal control theory is a tool that can be used to understand the design principles behind efficient operation of these machines; however, most studies on optimal control of classical mesoscopic systems have focused on control problems that do not repeat periodically. Here, we automatically differentiate Fokker-Planck simulations to design efficient nonequilibrium control strategies for simple models of periodic molecular machines with and without explicit changes in the machine's chemical state. The designed protocols and theoretical analysis provide insight into the design principles governing efficient driving in these nonequilibrium systems. Designed control protocols should seek to reduce mechanical heat by rotating the entire angular probability distribution at a constant speed without changing its shape, and should reduce chemical heat by reducing the proportion of chemical transitions with large heat.", "url": "https://arxiv.org/abs/2609.03217", "type": "理论+数值", "summary": "1. 该工作利用自动微分对福克-普朗克模拟进行优化，为含或不含化学态变化的周期性分子机器模型设计非平衡最优控制协议。\n2. 其核心在于揭示高效驱动的设计原理：通过匀速整体旋转角向概率分布以抑制力学热，并减少大热化学转变的比例来降低化学热。\n3. 这为理解过阻尼涨落环境中生物分子机器的周期性做功机制，以及启发更真实非平衡器件的控制策略提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "W. Callum Wareham"}, {"name": "David A. Sivak"}], "featured_authors": [{"name": "W. Callum Wareham"}, {"name": "David A. Sivak"}], "author_count": 2}, {"id": "2609.03223", "category": "cond-mat", "title": "A Strategy Toward Room Temperature Topological Hall Effect via Local Moment Magnetism", "abstract": "Topological spin textures in local moment systems hold great promise for technological applications due to their large magnetic moments, strong spin-orbit coupling (SOC), and high tunability. Finding new spin textures that are stable near room temperature is paramount to maximizing their potential for applications. Here, we provide a strategy for realizing topological spin textures at high temperatures by identifying rare earth ($R$) magnets ordering at or near room temperature. We demonstrate the feasibility of this strategy in one of these magnets, hexagonal Gd$_5$Pb$_3$, which orders at $T_C$ = 285 K. The indication for topological spin textures comes from topological Hall effect (THE), which, in Gd$_5$Pb$_3$, occurs between $T$ = 100 - 200 K, an order of magnitude higher temperature than in other reported $R$-based systems. Our results present an opportunity to explore the role of SOC, anisotropic exchange, geometric frustration, and magnetic interactions in stabilizing topological spin textures, and provide a pathway toward realizing them near room temperature in $R$-based magnets.", "url": "https://arxiv.org/abs/2609.03223", "type": "理论", "summary": "1. 该工作提出了一种利用稀土局域磁矩体系在近室温磁有序条件下实现高温拓扑自旋织构的策略，并通过六角Gd5Pb3验证其可行性。\n2. 其核心卖点在于，居里温度285 K的Gd5Pb3在100–200 K范围呈现拓扑霍尔效应，较以往稀土体系高约一个数量级，凸显局域磁矩、自旋轨道耦合与磁相互作用的协同效应。\n3. 该结果为在稀土基磁体中筛选近室温拓扑霍尔效应候选材料提供了清晰路径，并为研究几何阻挫与各向异性交换等稳定机制提供了重要平台。", "summary_source": "deepseek", "authors": [{"name": "Karthik Rao"}, {"name": "Kevin Allen"}, {"name": "Yuxiang Gao"}, {"name": "Arushi"}, {"name": "Sanu Mishra"}, {"name": "Birender Singh"}, {"name": "Kenneth S. Burch"}, {"name": "Liangzi Deng"}, {"name": "Shanta R. Saha"}, {"name": "Johnpierre Paglione"}, {"name": "Minseong Lee"}, {"name": "Vivien Zapf"}, {"name": "Emilia Morosan"}], "featured_authors": [{"name": "Karthik Rao"}, {"name": "Kevin Allen"}, {"name": "Yuxiang Gao"}, {"name": "Minseong Lee"}, {"name": "Vivien Zapf"}, {"name": "Emilia Morosan"}], "author_count": 13}, {"id": "2609.03289", "category": "cond-mat", "title": "Symmetry-breaking line defects embedded to a 3D $O(N)$ critical bulk", "abstract": "While spontaneous breaking of a discrete symmetry in one-dimensional classical systems with short-range interactions is absent, it is expected that a line defect embedded in a bulk criticality exhibits a stable discrete symmetry spontaneous breaking. Here, we investigate the behavior of a pinning-field line defect immersed in a 3D bulk that remains tuned to the $O(N)$ Wilson-Fisher critical point. Employing the fuzzy sphere technique, we provide convincing evidence of the existence of stable defect conformal fixed points, and we demonstrate their renormalization group stability by showing no relevant operator and less effective degrees of freedom than that at bulk fixed point via $g$-function. Moreover, we investigate the defect domain wall operator for various $N$, and we identify that it becomes irrelevance for $N\\gtrsim 3$ but it is relevant for $N<3$.These evidence indicate that a one-dimensional defect coupled to a critical bulk cannot support a stable symmetry spontaneously broken defect fixed point due to domain wall proliferation for $N<3$ Wilson-Fisher universality, while in the case of $N \\gtrsim 3$ a symmetry broken defect is possible.", "url": "https://arxiv.org/abs/2609.03289", "type": "理论", "summary": "1. 该文采用模糊球方法研究三维O(N) Wilson-Fisher临界体统中钉扎场线缺陷的临界行为。\n2. 其核心在于通过缺陷共形不动点、g函数与畴壁算符标度维数分析，确立缺陷固定点的重整化群稳定性，并揭示N<3时畴壁算符相关而N≥3时无关。\n3. 这意味着一维缺陷耦合临界体在N<3时因畴壁增殖无法支撑自发对称性破缺的稳定固定点，而N≳3则可能，为缺陷共形场论研究提供明确参考。", "summary_source": "deepseek", "authors": [{"name": "Shuai Yang"}, {"name": "Liang-dong Hu"}, {"name": "Yan Chen"}, {"name": "W. Zhu"}], "featured_authors": [{"name": "Shuai Yang"}, {"name": "Liang-dong Hu"}, {"name": "Yan Chen"}, {"name": "W. Zhu"}], "author_count": 4}, {"id": "2609.03307", "category": "cond-mat", "title": "Grain boundary evolution in nanoparticles", "abstract": "Grain boundary evolution is a key dynamical process that enables structural rearrangements in nanoparticles and drives them towards low energy configurations. Grain boundaries can also enhance catalytic properties, making it important to understand the elementary processes underlying their evolution for grain boundary engineering in nanoparticles. Compared with bulk materials, nanoparticles have additional rotational and translational degrees of freedom, can accommodate structural changes through shape relaxation, and grain boundaries terminate at free surfaces. However, the atomic-scale mechanisms of GB evolution under these less constrained conditions remain comparatively less understood than in bulk materials. Here, using atomistic simulations, we focus on low energy $\\Sigma3$ (coherent twin boundary) and $\\Sigma11$ grain boundaries, which are among the persistent compact GB structures that emerge during nanoparticle structural evolution. We identify two fundamental atomic displacements, column shift (C) and screw shift (S), that recur during the evolution of these grain boundaries and their junctions. These displacements occur through different atomic pathways and combine in different ways to generate grain boundary migration, structural transformations, and junction evolution. In particular, the same initial and final grain boundary configurations can be connected through different atomic pathways, and a column shift can occur either as a full shift or through disconnection kinks. C and S remain identifiable even when the grain boundary character changes, for example during a $\\Sigma11$ to $\\Sigma3$ transformation. An understanding of these elementary GB processes can help identify strategies to control grain boundary evolution and thereby engineer GB structures in nanoparticles.", "url": "https://arxiv.org/abs/2609.03307", "type": "理论+数值", "summary": "1. 该工作利用原子模拟研究纳米颗粒内低能Σ3与Σ11晶界及其结的演化过程。\n2. 其核心在于识别出柱位移C与螺旋位移S两类基本原子位移，并揭示其组合驱动迁移与结构转变。\n3. 这为通过操控基本晶界过程实现纳米颗粒晶界工程提供了明确原子尺度控制思路。", "summary_source": "deepseek", "authors": [{"name": "Manoj Settem"}, {"name": "Pranav Kumar"}, {"name": "Ajeet K. Srivastav"}], "featured_authors": [{"name": "Manoj Settem"}, {"name": "Pranav Kumar"}, {"name": "Ajeet K. Srivastav"}], "author_count": 3}, {"id": "2609.03388", "category": "cond-mat", "title": "Doping dependence of local moments in infinite layer nickelates", "abstract": "The infinite layer nickelates are notable for their lack of long-range antiferromagnetic ordering, in contrast to the parent compounds of the superconducting cuprates. Instead, the nickelates show evidence of short-range glassy behavior in both the undoped and optimally-doped regimes, implying that local electronic moments exist independent of superconductivity. However, the systematic doping-dependent magnetic behavior is not yet fully resolved, and characterizing it could uncover the relationship between local moments and the superconducting dome. In this work, we use muon spin rotation ($\\mu$SR) on a (La,Sr)NiO$_2$ doping series from the undoped parent compound, through the superconducting dome, to the over-doped normal state (Sr substitution 0% $\\leq$ x $\\leq$ 25%) to probe the magnetic ground state and the temperature-dependent static and dynamic behavior. We find that local moments experience spin freezing into a glassy state at temperatures on the order of a few tens of kelvin regardless of the doping level. We also observe a subtle destabilization of the glassy state with increased hole doping. These observations suggest that magnetism and superconductivity are largely decoupled phenomena with indirect interactions described in a multi-orbital framework.", "url": "https://arxiv.org/abs/2609.03388", "type": "数值", "summary": "1. 该工作利用μSR谱学系统测量了无限层镍氧化物(La,Sr)NiO2从母体经超导穹顶到过掺杂正常态的掺杂系列（Sr含量0–25%），表征局域磁矩的基态与温度依赖行为。\n2. 主要发现是局域矩在所有掺杂水平均于几十开尔文冻结为玻璃态，且随空穴掺杂增加该玻璃态仅发生轻微失稳。\n3. 这表明磁性主要与超导电性去耦，二者以多轨道框架下的间接作用相互关联，为理解局域磁矩与超导穹顶关系提供了实验约束。", "summary_source": "deepseek", "authors": [{"name": "Martin Gonzalez"}, {"name": "Andreas Suter"}, {"name": "Michal Kiaba"}, {"name": "Thomas Prokscha"}, {"name": "Zaher Salman"}, {"name": "Marc Gabay"}, {"name": "Harold Y. Hwang"}, {"name": "Jennifer Fowlie"}], "featured_authors": [{"name": "Martin Gonzalez"}, {"name": "Andreas Suter"}, {"name": "Michal Kiaba"}, {"name": "Marc Gabay"}, {"name": "Harold Y. Hwang"}, {"name": "Jennifer Fowlie"}], "author_count": 8}, {"id": "2609.03465", "category": "cond-mat", "title": "Studying line defect at Deconfined Quantum Criticality via fuzzy sphere regularization", "abstract": "The interplay between bulk critical fluctuations and nontrivial topology can enrich defect physics and give rise to novel defect universality classes. Understanding the fate of such defects therefore constitutes an important open problem. In this work, we studied a particularly simple setting: a (0+1)-dimensional pinning-field defect coupled to a (2+1)-dimensional deconfined quantum critical bulk. Using the fuzzy-sphere regularization, we numerically investigated the defect operator spectrum and extracted several universal quantities characterizing the defect conformal fixed point, including the scaling dimensions of defect-changing(creating) operators and the defect \\(g\\)-function. These results establish the first numerical characterization of line-defect conformal data at deconfined quantum criticality and may stimulate further investigations of defect critical phenomena in topological quantum critical matter.", "url": "https://arxiv.org/abs/2609.03465", "type": "理论+数值", "summary": "1. 该工作采用模糊球正则化，研究(0+1)维钉扎场缺陷耦合(2+1)维去禁闭量子临界体这一最小线缺陷体系。\n2. 技术亮点是从缺陷算符谱中提取缺陷改变（产生）算符的标度维数与缺陷g函数，首次建立去禁闭量子临界下线缺陷共形数据。\n3. 该结果可为拓扑量子临界物质中的缺陷临界现象提供数值基准，并启发对体临界涨落与缺陷耦合是否形成新型缺陷普适类的后续研究。", "summary_source": "deepseek", "authors": [{"name": "Shutao Liu"}, {"name": "Shuai Yang"}, {"name": "Jie Lou"}, {"name": "Yan Chen"}], "featured_authors": [{"name": "Shutao Liu"}, {"name": "Shuai Yang"}, {"name": "Jie Lou"}, {"name": "Yan Chen"}], "author_count": 4}, {"id": "2609.03473", "category": "cond-mat", "title": "Granular Rods Fall Faster in Denser Obstacle Fields", "abstract": "How particle shape affects transport through obstacle fields under external driving is a fundamental question in nonequilibrium physics. We simulate a dissipative rod falling under gravity through randomly placed fixed obstacles. As the obstacle density increases, the mean descent speed decreases, increases, and then decreases again before trapping. The rod can therefore fall faster in a denser obstacle field. Scaling arguments based on collision rates and rod geometry explain all three regimes, their crossovers, and the mean fall distance before trapping. These results reveal nonmonotonic driven transport arising from particle anisotropy.", "url": "https://arxiv.org/abs/2609.03473", "type": "理论", "summary": "1. 该工作通过模拟耗散棒状颗粒在重力驱动下穿越随机固定障碍物场，发现平均下落速度随障碍物密度呈降—升—降的非单调变化，即更密的障碍场中杆反而可能落得更快。\n2. 其核心在于基于碰撞率与杆几何的标度论证，统一解释了三个输运区段、其交叉行为以及颗粒在陷阱前的平均下落距离，并将反常行为归因于颗粒各向异性。\n3. 这为无序介质中各向异性颗粒的非平衡驱动输运提供定量预言，并可启发颗粒分离、过滤及障碍环境中定向传输过程的调控设计。", "summary_source": "deepseek", "authors": [{"name": "Fumiaki Nakai"}, {"name": "Hiroaki Katsuragi"}], "featured_authors": [{"name": "Fumiaki Nakai"}, {"name": "Hiroaki Katsuragi"}], "author_count": 2}, {"id": "2609.03485", "category": "cond-mat", "title": "Such stuff as magic is made on: compact operator algebra, stabilizer polytope and the structure of reduced density matrices in a Kitaev spin liquid", "abstract": "Quantum many-body systems exhibit rich and complex behaviour. Magic has recently emerged as a powerful new diagnostic for probing such systems, complementing other key features such as many-body entanglement. Here, starting from an investigation of the onset of magic within subsystems of a larger many-body quantum system, we show that intricate structures emerge which shed important light on the underlying many-body physics. Focusing on the Kitaev honeycomb model, we first identify the temperature below which local subsystems acquire magic. Remarkably, we find that the optimal magic witnesses active at the onset of magic reveal compact operator spaces that continue to capture the local thermal states throughout their subsequent evolution. For the six-site hexagonal marginal, this connection can be made stronger: the same operator space emerges independently from the symmetries of the local marginal and forms the symmetry-resolved plaquette algebra. When these symmetries are realized exactly, the local state lies entirely within this algebra and the reduced robustness of magic is equal to the full robustness of magic. The same reduced description can also be applied to other local quantum resources, which we illustrate using genuine multipartite entanglement. Furthermore, the operator spaces possess a rich algebraic structure in the form of finite-dimensional Euclidean Jordan algebras, with a natural interpretation in terms of bond and bond-cycle operators. Our general methodology therefore show how the onset of local magic can reveal a compact, physically meaningful operator structure underlying the finite-temperature Kitaev spin liquid, and opens up a new avenue towards reduced descriptions of quantum resources in many-body systems.", "url": "https://arxiv.org/abs/2609.03485", "type": "理论+数值", "summary": "1. 该文针对Kitaev六角模型，考察子系统约化密度矩阵中魔力随温度的涌现，并识别魔力产生的温度阈值。\n2. 其核心在于证明起始阶段最优魔力见证揭示的紧算子代数可持续捕获后续局域热态，且六位六边形边际下该代数与对称分辨plaquette代数及Euclidean Jordan代数结构一致。\n3. 这一约化算子框架同样适用于其他局域量子资源，为有限温度自旋液体及多体量子资源的降维描述提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Snigdh Sabharwal"}, {"name": "Nic Shannon"}, {"name": "Paul Skrzypczyk"}], "featured_authors": [{"name": "Snigdh Sabharwal"}, {"name": "Nic Shannon"}, {"name": "Paul Skrzypczyk"}], "author_count": 3}, {"id": "2609.03500", "category": "cond-mat", "title": "Exact Scaling Laws and Non-Hermitian Topological Phase Transitions of Active Continuum on Hyperbolic Manifolds", "abstract": "The macroscopic collective motion of active continuum on curved manifolds is conventionally addressed through perturbative dynamic renormalization or finite-element simulations, often obscuring the underlying geometric mechanisms. Here, an exact algebraic framework is established to reformulate the active phase transition on hyperbolic spaces $\\mathbb{H}^2$. By rigorously expanding the covariant Navier-Stokes-like equations and applying the Weitzenböck identity, we derive the exact critical threshold $\\alpha_c = \\frac{5}{4}D\\kappa^2$ for macroscopic polarization, which is dictated by the geometric mass gap of the Hodge-de Rham Laplacian. We strictly define the parameter subspace $\\alpha = 2D\\kappa^2$ where the topological free energy reaches the Bogomolny-Prasad-Sommerfield (BPS) limit. This enables the reduction of the complex velocity field to Blaschke products via Möbius gauge symmetry. The flat-space limit ($\\kappa \\to 0$) exactly degenerates to the topological phase of the classical O(2) model, demonstrating that the constant negative curvature acts as an un-perturbative infrared regularization for non-linear amplitude saturation. Furthermore, mapping the non-variational active convective modes onto the defect translational zero-modes yields an intrinsically non-reciprocal interaction matrix. By analytically extending the singular integral operator of the dynamically condensed defect ring, we identify a macroscopic second-order exceptional point (EP2) characterized by a strictly algebraic dynamic scaling law $\\tau \\sim |\\Delta \\nu|^{-1/2}$. This closed-form theoretical paradigm provides exact solutions for geometric frustration and non-Hermitian topology in soft mechanics.", "url": "https://arxiv.org/abs/2609.03500", "type": "理论+数值", "summary": "1. 该工作为双曲流形 H^2 上的活性连续介质建立了严格的代数求解框架，用于精确描述其宏观极化的拓扑相变与标度律。\n2. 核心卖点在于严格导出临界阈值 α_c = 5/4Dκ² 与 BPS 极限 α = 2Dκ²，并借助 Möbius 规范对称性将速度场化为 Blaschke 积，进而发现动态凝聚缺陷环对应宏观二阶奇异点及 τ∼|Δν|^{-1/2} 的代数标度。\n3. 这为几何阻挫与非厄米拓扑在软活性材料中的精确可解模型提供了新范例，并启示常负曲率可作为一类非微扰红外正则化机制。", "summary_source": "deepseek", "authors": [{"name": "Yu-Xin Xie"}], "featured_authors": [{"name": "Yu-Xin Xie"}], "author_count": 1}, {"id": "2609.03510", "category": "cond-mat", "title": "Interplay of B-Site Off-Centering and Molecular Orientations in the Mixed Hybrid Perovskite MAGe1xSnxI3", "abstract": "B-site mixing is a common strategy for tuning properties of halide perovskites. In the lead-free system MAGe1-xSn_xI3, it brings tilting and off-centering into competition. Using large-scale molecular dynamics driven by a machine-learned interatomic potential, we map the structural behavior across the full composition range. MAGeI3 exhibits strong polar B-site off-centering that remains nearly constant up to the cubic transition, together with methylammonium (MA) orientational order that weakens progressively on heating. By contrast, MASnI3 combines octahedral tilting with weaker, predominantly antipolar off-centering. Ge-like behavior persists upon alloying and gives way to Sn-like behavior only beyond roughly 65 % Sn. In the high-temperature phases, the B-site cations remain locally off-centered but directionally disordered. On the Ge-rich side, the distorted inorganic framework biases the soft MA orientational landscape toward a restricted set of preferred directions. This coupling shows how the composition of the inorganic sublattice can tune molecular ordering in lead-free hybrid perovskites.", "url": "https://arxiv.org/abs/2609.03510", "type": "数值", "summary": "1. 本文用机器学习势分子动力学，系统考察了MAGe1−xSnxI3全组分范围内的结构行为。\n2. 核心发现是B位偏离中心可调控MA取向序，富Ge强极性行为直到约65%Sn才转为倾转与弱反极性共存的Sn类行为。\n3. 这为通过B位合金化设计无铅杂化钙钛矿的分子取向自由度及相关功能响应提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Erik Fransson"}, {"name": "Apinya Ngoipala"}, {"name": "Oskar Öjstedt"}, {"name": "Maths Karlsson"}, {"name": "Paul Erhart"}, {"name": "Julia Wiktor"}], "featured_authors": [{"name": "Erik Fransson"}, {"name": "Apinya Ngoipala"}, {"name": "Oskar Öjstedt"}, {"name": "Maths Karlsson"}, {"name": "Paul Erhart"}, {"name": "Julia Wiktor"}], "author_count": 6}, {"id": "2609.03518", "category": "cond-mat", "title": "Orbital-Free DFT-Assisted Machine-Learned Molecular Dynamics for Electric-Field-Driven Ionic Transport", "abstract": "We propose an orbital-free density functional theory (OFDFT)-assisted machine-learned molecular dynamics method in which field-independent interatomic forces are evaluated using a machine-learned potential and atomic charges that depend on the local environment are obtained from OFDFT calculations. The atomic charges obtained by Bader partitioning of the OFDFT electron density are multiplied by the electric-field vector and added to the forces from the machine-learned potential. This approach enables molecular dynamics simulations under an electric field at a lower computational cost than Kohn-Sham DFT (KSDFT)-based molecular dynamics. As a proof of concept, the method was applied to beta-Li3PS4 bulk and an S8/Li3PS4 heterostructure under periodic boundary conditions. For Li3PS4 bulk, OFDFT yielded Li charges and a total charge of the PS4 unit consistent with those obtained using KSDFT. In the heterostructure, Li ions migrated from the Li3PS4 region into the S-rich region within a simulation time of approximately 170 ps. Accompanying this migration, the mean Bader charge of the S atoms that initially formed S8 rings changed from nearly neutral to negative. A comparison with KSDFT for a representative interfacial structure also confirmed that the negative charging of the S atoms upon the arrival of Li and the magnitude of the Li charges were qualitatively reproduced. These results demonstrate the possibility of treating field-driven ionic transport and changes in interfacial charge states using a universal machine-learned potential without training an additional material-specific charge-prediction model.", "url": "https://arxiv.org/abs/2609.03518", "type": "理论+数值", "summary": "1. 该工作将无轨道密度泛函理论（OFDFT）与机器学习分子动力学结合，提出一种在电场下模拟离子输运的方法，并应用于β-Li3PS4体相及S8/Li3PS4异质结构。\n2. 其技术要点是由OFDFT的Bader电荷乘以电场矢量补充到机器学习势给出的原子力，从而在低于KSDFT分子动力学的成本下获得局域环境依赖的电荷响应。\n3. 这一方案表明无需训练材料特异的电荷预测模型即可再现电场驱动迁移及界面S原子随Li到达而负充电，为跨界面离子输运的通用模拟提供了可行方向。", "summary_source": "deepseek", "authors": [{"name": "Yusuke Nishiya"}, {"name": "Hiroya Nakata"}, {"name": "Yosuke Harada"}, {"name": "Yu-ichiro Matsushita"}], "featured_authors": [{"name": "Yusuke Nishiya"}, {"name": "Hiroya Nakata"}, {"name": "Yosuke Harada"}, {"name": "Yu-ichiro Matsushita"}], "author_count": 4}, {"id": "2609.03555", "category": "cond-mat", "title": "Spectral Function Method and Janus Quantum Numbers in Quasiperiodic Systems", "abstract": "The absence of translational symmetry in quasiperiodic systems invalidates conventional band theory, posing the central challenge in the field. Building upon the incommensurate energy band (IEB) concept, we establish a unified spectral theory for quasiperiodic systems by introducing two key advances. First, we develop an efficient spectral function method that calculates $A(k,\\omega)$ using a small truncated Hamiltonian matrix, bypassing full diagonalization. It converges via a distinctive successive locking of energy moments, yielding exact thermodynamic-limit results without finite-size scaling. Second, we introduce that quasiperiodic eigenstates possess Janus quantum numbers: a single eigenstate, continuously tracked across localization transitions, carries dual labels in momentum and real space, which naturally reduce to the familiar Bloch momentum and band index in the commensurate limit. Together with IEB, these advances constitute a ``band theory'' for quasiperiodic systems, enabling us to define, compute, and label states with the same facility as in periodic ones.", "url": "https://arxiv.org/abs/2609.03555", "type": "理论+数值", "summary": "1. 该工作针对准周期体系缺乏平移对称性、使传统能带理论失效的困难，基于非公度能带概念建立了统一的谱理论框架。\n2. 其技术要点是小截断哈密顿量即可算得谱函数A(k,ω)，通过能量矩逐级锁定实现精确热力学极限而无需有限尺寸标度；同时引入Janus量子数，令单个本征态在局域化转变中兼具动量与实空间双标签。\n3. 这为准周期体系提供了与周期体系同等便捷地定义、计算与标记态的方式，为无平移对称系统的能带描述和局域化研究建立了可直接借鉴的范式。", "summary_source": "deepseek", "authors": [{"name": "Tian-Le Wu"}, {"name": "Shi-Ping Ding"}, {"name": "Miao Liang"}, {"name": "Jing-Tao Lü"}, {"name": "Jin-Hua Gao"}], "featured_authors": [{"name": "Tian-Le Wu"}, {"name": "Shi-Ping Ding"}, {"name": "Miao Liang"}, {"name": "Jing-Tao Lü"}, {"name": "Jin-Hua Gao"}], "author_count": 5}, {"id": "2609.03560", "category": "cond-mat", "title": "Sample-specific rectification-like response in a boundary-driven exclusion process", "abstract": "We investigate the current response of a boundary-driven symmetric exclusion process with quenched site disorder. Hard-core particles hop symmetrically on a one-dimensional lattice with site-dependent rates and are injected and removed at the boundaries by two reservoirs of different densities. We approximate the steady-state density profile using a Galerkin projection at linear order and a mean-field closure at higher orders, and thereby obtain the current as a nonlinear function of the reservoir density difference. At linear order in the reservoir density difference, the current-response coefficient depends on the mean reservoir density $\\rho$, in contrast to the homogeneous case. Through the linear-response relation, this dependence leads to an equilibrium current-fluctuation coefficient that is asymmetric under $\\rho\\rightarrow 1-\\rho$. Beyond linear response, nonzero even-order current contributions break the antisymmetry of the current under reversal of the reservoir density difference, producing rectification-like behavior in individual disorder realizations. We further show that spatial-reflection symmetry of the equilibrium density profile rules out such behavior, so broken spatial-reflection symmetry of the profile is a necessary condition for rectification-like behavior. Within the present approximation, we further find that, for continuously distributed site disorder, rectification-like behavior occurs arbitrarily close to equilibrium for almost every disorder realization. At the ensemble level, however, the disorder-averaged current remains antisymmetric because the disorder ensemble is invariant under spatial reflection. These results provide a mechanism for rectification-like transport arising from sample-specific spatial heterogeneity rather than from an explicitly imposed directional asymmetry.", "url": "https://arxiv.org/abs/2609.03560", "type": "理论", "summary": "1. 该工作解析研究了含淬火无序的边界驱动对称排斥过程中，电流对外部密度差响应的非线性特征。\n2. 其核心在于揭示个体无序样品可因平衡密度分布破缺空间反射对称而产生类整流响应，且该行为在连续无序下可任意接近平衡出现，但系综平均仍保持反对称。\n3. 这为无需显式方向不对称、仅由样品特异空间异质性诱导的整流输运提供了明确机制与判断依据，并启示需谨慎区分单样品与系综行为。", "summary_source": "deepseek", "authors": [{"name": "Issei Sakai"}, {"name": "Takuma Akimoto"}], "featured_authors": [{"name": "Issei Sakai"}, {"name": "Takuma Akimoto"}], "author_count": 2}, {"id": "2609.03571", "category": "cond-mat", "title": "Heterogeneous collapse in thermoresponsive copolymer microgels varying molar composition", "abstract": "Understanding the internal architecture of copolymer microgels is crucial for establishing how nanoscale polymer organization controls their stimuli-responsive behavior. Here we focus on thermoresponsive P(N-isopropylacrylamide-co-N-isopropyl-methacrylamide), P(NIPAM-co-NIPMAM), microgels with varying mole fraction of the components, synthesized via radical precipitation polymerization, and we demonstrate that changes in their volume phase transition and equilibrium swelling are governed by composition-dependent internal heterogeneity. Comparison between small-angle neutron scattering (SANS) with isotopic labeling and monomer-resolved simulations show a block-like monomer distribution of the two components. SANS analysis reveals a universal maximum in the polymer mesh correlation length near the transition, evidencing coexistence of collapsed NIPAM-rich and swollen domains. The correlation length increases with increasing NIPMAM content, with a maximum for 75 mol \\% NIPMAM, implying sparse collapsed regions within the network and thus a large degree of heterogeneity induced by the presence of an increasingly large fraction of intercalated, non-collapsing PNIPMAM. The maximum heterogeneity correlates with the equilibrium swelling ratio, indicating that collapsed microgels retain a structural memory of the transition and present a less-compliant structure in response to temperature variations. Overall, these insights highlight a complex effect of the block-like monomer distribution on the responsive properties of copolymer microgels with different compositions, thus providing a design rule for tailoring responsive colloids for functional soft materials.", "url": "https://arxiv.org/abs/2609.03571", "type": "理论+数值", "summary": "1. 该工作结合同位素标记小角中子散射与单体分辨模拟，研究了不同摩尔组成的P(NIPAM-co-NIPMAM)热响应微凝胶的体积相变与溶胀行为。\n2. 其核心发现是单体呈嵌段状分布，并在相变附近存在聚合物网络相关长度的普适极大值，表明NIPAM富集区塌缩与溶胀域共存，且异质性随NIPMAM含量增加而增强。\n3. 该结果将最大内部异质性与平衡溶胀率相关联，指出塌缩微凝胶保留转变的结构记忆，为设计可调响应性软胶体提供了组分调控规则。", "summary_source": "deepseek", "authors": [{"name": "Jacopo Vialetto"}, {"name": "Francesco Brasili"}, {"name": "Letizia Tavagnacco"}, {"name": "Gavino Bassu"}, {"name": "Elena Buratti"}, {"name": "Stephen King"}, {"name": "Emanuela Zaccarelli"}, {"name": "Marco Laurati"}], "featured_authors": [{"name": "Jacopo Vialetto"}, {"name": "Francesco Brasili"}, {"name": "Letizia Tavagnacco"}, {"name": "Stephen King"}, {"name": "Emanuela Zaccarelli"}, {"name": "Marco Laurati"}], "author_count": 8}, {"id": "2609.03576", "category": "cond-mat", "title": "SALTED: a symmetry-adapted machine-learning program for predicting electron-densities in molecules and materials", "abstract": "SALTED provides an open-source Python package for machine learning the quantum-mechanical electron density, $n(\\mathbf{r})$, in molecular and condensed-phase systems based on input atomic coordinates and species. The program adopts a linear atom-centered decomposition of the electron density, which makes it highly transferable across diverse atomistic configurations sharing similar chemical environments. Because of this representation choice, SALTED is naturally interfaced with state-of-the-art electronic-structure programs based on atomic orbitals, namely CP2K, FHI-aims, and PySCF, from which reference electron-density data can be generated and used to train a model. The learning algorithm is based on a symmetry-adapted extension of Gaussian process regression, making SALTED especially efficient in small-data regimes. Thanks to the implementation of vector-field kernel functions, SALTED can also learn the first-order response of the electron density to applied electric fields, $\\partial n(\\mathbf{r})/\\partial \\mathbf{E}$. The application of SALTED within computational workflows has already shown its utility in a wide variety of contexts, including the calculation of polarization vectors and polarizability tensors, the accurate evaluation of Coulomb forces in QM/MM molecular-dynamics simulations, and electronic-structure studies of large-scale 2D materials.", "url": "https://arxiv.org/abs/2609.03576", "type": "理论+数值", "summary": "1. 该工作介绍开源Python包SALTED，通过对称自适应高斯过程回归，依据输入原子坐标和物种预测分子及凝聚相体系的量子力学电子密度n(r)。\n2. 其技术特色是采用密度的线性原子中心分解并实现矢量场核函数，使模型在小数据下高效、跨原子构型可迁移，并可直接对接CP2K、FHI-aims与PySCF，用于学习电子密度对电场的线性响应。\n3. 该方法已在极化矢量与极化率张量计算、QM/MM分子动力学中库仑力的准确评估以及大尺寸二维材料的电子结构研究中展示实用性，为电子结构机器学习流程提供可扩展的统一框架。", "summary_source": "deepseek", "authors": [{"name": "Zekun Lou"}, {"name": "Alan M. Lewis"}, {"name": "Théophane Bernhard"}, {"name": "Lukas Seifert"}, {"name": "Agustin Salcedo"}, {"name": "Florian Kleemiss"}, {"name": "Mariana Rossi"}, {"name": "Andrea Grisafi"}], "featured_authors": [{"name": "Zekun Lou"}, {"name": "Alan M. Lewis"}, {"name": "Théophane Bernhard"}, {"name": "Florian Kleemiss"}, {"name": "Mariana Rossi"}, {"name": "Andrea Grisafi"}], "author_count": 8}, {"id": "2609.03587", "category": "cond-mat", "title": "Charge Regulated conformational properties of polyelectrolyte near an oppositely charged nanoparticle", "abstract": "Customizing the surface characteristics and stimuli-responsive behavior of nanoparticles with polyelectrolytes ushers in a new era across many aspects of our lives, ranging from advanced diagnostics to practical applications. Here, using hybrid CR Monte Carlo/ molecular dynamics simulations, we investigate how charge regulation can play a crucial role in shaping the adsorption dynamics of polyelectrolyte (PE) on oppositely charged nanoparticle (NP). We systematically investigate the influence of salt density, and polymer chain length on the PE-NP interaction. To complement CR results, we also perform molecular simulations under constant charge conditions. At high salt concentrations, CR enhances the adsorption of PE onto the NP surface, leading to a rapid decrease in the radius of gyration of PE; conversely, CC promotes the extended conformation of PE. No clear effect of PE length is observed at either low or high salt concentrations, whereas in CC simulations, the PE relaxes faster on the NP in the case of short chains. Furthermore, By comparing these results, we demonstrate that the MSD of PE follows a more direct path during adsorption implying a ballistic motion, whereas in the CC case, it exhibits subdiffusive behavior and delayed adsorption in both low and high salt density. Our findings indicates that 'tunable CR' is a robust strategy for controlling nanoparticle stability and interaction within a complex biochemical cues.", "url": "https://arxiv.org/abs/2609.03587", "type": "理论+数值", "summary": "1. 该工作利用电荷调节(CR)蒙特卡罗/分子动力学混合模拟，研究聚电解质在带相反电荷纳米颗粒附近的构象与吸附动力学，考察盐浓度和链长的影响。\n2. 其核心发现在于CR使高盐下吸附增强、回转半径快速减小，且吸附轨迹接近弹道运动，而恒电荷条件则倾向伸展构象、亚扩散并延迟吸附。\n3. 这显示可调CR可作为复杂生化环境中调控纳米颗粒稳定性与相互作用的稳健策略，并为链长相关的后续模拟与实验提供借鉴。", "summary_source": "deepseek", "authors": [{"name": "Kawaljeet Kaur"}, {"name": "Rashmi Kandari"}, {"name": "Sunita Kumari"}, {"name": "Subhajit Paul"}], "featured_authors": [{"name": "Kawaljeet Kaur"}, {"name": "Rashmi Kandari"}, {"name": "Sunita Kumari"}, {"name": "Subhajit Paul"}], "author_count": 4}, {"id": "2609.03606", "category": "cond-mat", "title": "Frenkel line of Yukawa fluids within the self-consistent relaxation theory", "abstract": "For a simple model fluid, the Yukawa fluid, the condition for dynamic crossover, known as the Frenkel line, is defined. The condition is related to the fact that the roton minimum in the dispersion relation of longitudinal acoustic-like excitations exists only when the collective vibrational dynamics of particles dominates in the liquid. Based on the self-consistent relaxation theory for the Yukawa fluid, thermodynamic states are determined in which the roton minimum disappears. The obtained values of the state parameters for the Frenkel line are consistent with the results of studies in which the position of this line on the phase diagram of the Yukawa fluid was determined using molecular dynamics simulations. It is shown that the Frenkel line in this system can be determined directly from the structural characteristic -- the static structure factor. A physical interpretation of the roton minimum frequency for the simple liquids near the Frenkel line is proposed.", "url": "https://arxiv.org/abs/2609.03606", "type": "理论+数值", "summary": "1. 该工作采用自洽弛豫理论，以纵声学类激发色散中旋子极小的消失为判据，为Yukawa流体定义了动态交叉弗伦克尔线并确定其热力学状态。\n2. 其核心卖点在于证明旋子极小仅在粒子集体振动动力学主导的液相存在，弗伦克尔线可直接由静态结构因子决定，且所得状态参数与分子动力学模拟结果一致。\n3. 这为基于静态结构特征预测简单液体动力学转变提供了有效途径，也为理解弗伦克尔线附近旋子极小频率的物理本质提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Ilnaz I. Fairushin"}, {"name": "Anatolii V. Mokshin"}], "featured_authors": [{"name": "Ilnaz I. Fairushin"}, {"name": "Anatolii V. Mokshin"}], "author_count": 2}, {"id": "2609.03618", "category": "cond-mat", "title": "Spectral properties of deterministic matrices multiplied by rotationally invariant random non-Hermitian ensembles", "abstract": "In this paper, we study spectral properties of multiplicative deformations of non-Hermitian random matrices. We consider matrices of the form $\\mathbf{A}\\mathbf{B}$, where $\\mathbf{A}$ is a deterministic $N\\times N$ matrix (not necessarily Hermitian) and $\\mathbf{B}$ is a rotationally invariant random matrix. We show that, as $N\\to\\infty$, the boundary of the complex eigenvalue distribution of $\\mathbf{A}\\mathbf{B}$ is governed by simple equations involving the $\\mathcal{R}_1$ and $\\mathcal{R}_2$ transforms of $\\mathbf{B}$.", "url": "https://arxiv.org/abs/2609.03618", "type": "理论", "summary": "1. 该工作研究确定性矩阵 A 与旋转不变非厄米随机矩阵 B 的乘积 AB 在 N→∞ 时的复特征值分布。\n2. 其要点是证明谱分布边界由 B 的 R1 与 R2 变换经简单方程组控制，且允许 A 非厄米。\n3. 这为非厄米随机矩阵乘积和乘法自由卷积的普适谱理论提供了新的解析途径与后续研究基础。", "summary_source": "deepseek", "authors": [{"name": "Pierre Bousseyroux"}, {"name": "Marc Potters"}], "featured_authors": [{"name": "Pierre Bousseyroux"}, {"name": "Marc Potters"}], "author_count": 2}, {"id": "2609.03627", "category": "cond-mat", "title": "Pseudospectral Methods and Critical Phenomena", "abstract": "We employ pseudospectral methods to solve the homogeneous Ornstein-Zernike (OZ) equation for a model fluid in the vicinity of the critical point. Focusing on the Mean-Spherical Approximation (MSA) as a closure to the OZ equation, we obtain numerical estimates for the critical exponents $\\eta$, $\\delta$ and $\\gamma$ for a system of hard-core Yukawa particles both in two and three dimensions. The three-dimensional MSA exponents are already well-known from an analytic solution and are recovered by our numerical methods. The two-dimensional exponents are a new output of this work. The pseudospectral method allows for rapid and highly accurate solution of liquid-state integral equation theories, and enables calculations on truely infinite domains, as needed for highly correlated states. In addition, we analyse the standard Picard iteration scheme and propose a variation of it which provides increased stability and speed of convergence.", "url": "https://arxiv.org/abs/2609.03627", "type": "理论+数值", "summary": "1. 该工作采用伪谱方法求解临界点附近均质Ornstein-Zernike方程，配合平均球近似闭合，得到二维与三维硬核Yukawa流体的临界指数η、δ、γ数值估计。\n2. 其技术要点是伪谱格式可在真正无限域上高精度快速求解液态积分方程理论，并给出改进的Picard迭代方案以提高稳定性与收敛速度。\n3. 二维结果尤其为临界现象与液态理论提供新的数值基准，并对强关联态积分方程的高效算法发展具有启发。", "summary_source": "deepseek", "authors": [{"name": "Jake Skelton"}, {"name": "Joseph Brader"}, {"name": "Salomée Tschopp"}, {"name": "Benjamin Goddard"}], "featured_authors": [{"name": "Jake Skelton"}, {"name": "Joseph Brader"}, {"name": "Salomée Tschopp"}, {"name": "Benjamin Goddard"}], "author_count": 4}, {"id": "2609.03656", "category": "cond-mat", "title": "Finite-temperature mass gap and quench dynamics of mobile impurities in a Fermi gas", "abstract": "Recently, a mass-gap description of mobile impurities in a Fermi gas was introduced, which connects Anderson's orthogonality catastrophe for static impurities to the quasiparticle picture of Fermi polarons through a recoil-induced energy gap in the fermionic dispersion. That description, however, was restricted to zero temperature and did not address dynamics. Here we generalize the mass-gap model to finite temperature by combining the Lee--Low--Pines transformation with a self-consistent Hartree--Fock decoupling of the recoil-induced interaction, and we study the quench dynamics within this framework using the functional-determinant approach. At finite temperature the effective mass gap obeys the self-consistency equation $\\Delta(T)=2U_F\\tanh[\\Delta(T)/4k_B T]$, with $U_F=k_F^2/2M$ and $M$ the impurity mass. This equation admits a nonzero solution below the characteristic temperature $T^*=U_F/(2k_B)$ and closes as $(T^*-T)^{1/2}$. We identify this closing as the mean-field signature of the thermal melting of the polaron and molecule quasiparticles. Computing the Ramsey response $S(t)$ after a sudden quench of the impurity--fermion interaction, we find that its long-time oscillations---quantum beats between the bound and in-gap states---disappear precisely above $T^*$. Our work ties the thermodynamic and dynamical fingerprints of polaron formation to a single temperature-dependent mean-field parameter.", "url": "https://arxiv.org/abs/2609.03656", "type": "理论", "summary": "1. 该工作将费米气体中可移动杂质的质量隙模型推广至有限温度，并系统研究其相互作用猝灭动力学。\n2. 技术卖点在于结合Lee-Low-Pines变换与自洽Hartree-Fock退耦，推导出Δ(T)=2U_F tanh[Δ(T)/4k_B T]的自洽方程，确定非零解仅在T^*=U_F/(2k_B)以下存在并按(T^*-T)^{1/2}闭合，标记准粒子热熔化。\n3. 该框架用单一温度相关平均场参数统一热力学与Ramsey响应中的量子拍消失行为，为冷原子极化子实验提供了可检验的多体预言。", "summary_source": "deepseek", "authors": [{"name": "Baihua Gong"}], "featured_authors": [{"name": "Baihua Gong"}], "author_count": 1}, {"id": "2609.03684", "category": "cond-mat", "title": "Hidden Magnetic Octupolar Order driven by Spin-Orbit coupling in KFeF$_3$", "abstract": "Phase transitions are typically driven by symmetry-breaking structural distortions that lift electronic degeneracies, yet in some cases, these transitions may be driven by a hidden order without conventional structural signatures. Here, we demonstrate that the 3$d$ perovskite, KFeF$_3$, hosts such a hidden instability. Using a combination of high-resolution powder diffraction, magnetometry, symmetry-based analysis and first principles calculations, we reveal that while the 90 K cubic to rhombohedral transition arises from conventional magnetostriction accompanying antiferromagnetic order, a second transition at 40 K lowers the symmetry to monoclinic without any detectable Jahn-Teller distortion or translational symmetry-breaking. Symmetry-based Landau analysis supports a hidden zone centered magnetic octupole order parameter, whose improper coupling accounts for the weak ferromagnetism and pronounced symmetry-breaking strain. Density functional calculations show that spin-orbit coupling suppresses the competing Jahn-Teller instability, and thereby favors higher rank magnetic multipolar degrees of freedom. These findings establish KFeF$_3$ as a model system in which the competing energy scales between spin-orbit coupling and orbital degeneracy result in the emergence of hidden, multipolar order. We show that the control of such magnetic, multipolar order could, in principle, provide a route to induce altermagnetism.", "url": "https://arxiv.org/abs/2609.03684", "type": "理论+数值", "summary": "1. 该工作结合高分辨衍射、磁测量与第一性原理计算，证明钙钛矿KFeF₃在40 K发生了无常规结构与平移对称破缺的隐藏磁八极序相变。\n2. 其核心发现是自旋轨道耦合压制竞争的Jahn-Teller不稳定性，使对称性分析支持的区心磁八极序参量经非本征耦合产生弱铁磁与单斜应变。\n3. 该结果确立了八极序由自旋轨道耦合主导的模型体系，并提示调控此类高阶磁多极序或可为诱导交错磁有序提供可行途径。", "summary_source": "deepseek", "authors": [{"name": "C. A. Crawford"}, {"name": "C. I. Hiley"}, {"name": "N. C. Bristowe"}, {"name": "C. Stock"}, {"name": "J. Gainza"}, {"name": "C. Ritter"}, {"name": "M. R. Lees"}, {"name": "R. I. Walton"}, {"name": "M. S. Senn"}], "featured_authors": [{"name": "C. A. Crawford"}, {"name": "C. I. Hiley"}, {"name": "N. C. Bristowe"}, {"name": "M. R. Lees"}, {"name": "R. I. Walton"}, {"name": "M. S. Senn"}], "author_count": 9}, {"id": "2609.03708", "category": "cond-mat", "title": "Fermi-Point Topology Determines Emergent Conformal Criticality in Extended Quantum Spin Chains", "abstract": "Quantum criticality in one-dimensional quantum systems is characterized by emergent conformal field theories (CFTs), whose central charge counts independent gapless degrees of freedom. Establishing a microscopic connection between this universal conformal structure and the momentum-space topology of the underlying quasiparticle spectrum remains challenging. Here, we uncover a direct correspondence between Fermi-point topology, conformal criticality, and quantum entanglement in an extended quantum spin chain with competing cluster interactions, exchange anisotropy, and a transverse magnetic field. We show that in
