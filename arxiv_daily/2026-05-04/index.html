<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>arXiv 2026-05-04 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2605.00091", "category": "cond-mat", "title": "Locality versus Fock-space structure in East-type models", "abstract": "Local kinetic constraints in quantum many-body systems can generate slow dynamics or complete many-body localisation. Here we focus on a modification of the quantum East model: Inspired by random matrix theory, we randomise the connectivity in Fock space (rendering it nonlocal in real space) while preserving its organisation into neighbouring magnetisation sectors. We find that there is still a transition between two distinct phases, one delocalised and the other localised. We conclude that, for East-type constrained models, the essential ingredient is the structure of the graph in Fock space rather than geometric locality of spin flips.", "url": "https://arxiv.org/abs/2605.00091", "type": "理论", "summary": "1. 该工作修改量子East模型，随机化Fock空间连通性但保留磁化扇区结构，研究其局域化转变。\n2. 核心发现是仍存在从扩展相到局域相的转变，表明East型约束模型中Fock空间图结构而非实空间局域性是决定局域化的关键。\n3. 这为理解约束量子多体系统中动力学局域化的本质机制提供了新视角，提示未来应关注Fock空间拓扑而非几何局域性。", "summary_source": "deepseek", "authors": [{"name": "Achilleas Lazarides"}], "featured_authors": [{"name": "Achilleas Lazarides"}], "author_count": 1}, {"id": "2605.00104", "category": "cond-mat", "title": "Criticality on Rényi defects at (2+1)$d$ O(3) quantum critical points", "abstract": "At a quantum critical point, the universal scaling behavior of Rényi entanglement entropy is controlled by the universality class of the codimension-two Rényi (or conical) defects in the infrared theory. In this work we perform a systematic study of critical correlations along Rényi defect lines in (2+1)d quantum spin models realizing quantum phase transitions described by the O(3) Wilson-Fisher universality class, using large-scale quantum Monte Carlo simulations. We present numerical evidence that, for a fixed Rényi index $n$, there exist multiple Rényi defect universality classes, with distinct critical exponents for the O(3) order parameter on the defect. These universality classes are realized by choosing microscopically different entanglement cuts in lattice models, which we classify as ordinary, special and extraordinary according to their relation to surface criticality. For the extraordinary entanglement cut, we further find evidence for a phase transition on the defect as a function of the Rényi index. Our results highlight the key role of defect universality classes in determining the universal scaling of Rényi entropy, and provide a framework for understanding the previously observed dependence of Rényi entropy scaling on microscopic lattice details.", "url": "https://arxiv.org/abs/2605.00104", "type": "理论+数值", "summary": "1. 该工作采用大规模量子蒙特卡洛模拟，系统研究了(2+1)维O(3)量子临界点上Rényi缺陷线的临界关联行为。\n2. 其关键卖点是揭示了存在多个由不同纠缠切割实现的Rényi缺陷普适类，并发现特殊切割下缺陷上出现随Rényi指数变化的相变。\n3. 这为理解Rényi熵标度对微观格子细节的依赖提供了明确框架，并启发缺陷普适类在量子临界现象中的普适作用。", "summary_source": "deepseek", "authors": [{"name": "Yanzhang Zhu"}, {"name": "Zhe Wang"}, {"name": "Meng Cheng"}, {"name": "Zheng Yan"}], "featured_authors": [{"name": "Yanzhang Zhu"}, {"name": "Zhe Wang"}, {"name": "Meng Cheng"}, {"name": "Zheng Yan"}], "author_count": 4}, {"id": "2605.00135", "category": "cond-mat", "title": "Graph theoretic derivation of mutual linearity for transient probabilities and hitting time distributions in Markov networks", "abstract": "For irreducible, time-homogeneous Markov networks, mutual linearity has recently been established for both occupation probabilities and network currents in the stationary regime as well as in the non-stationary regime in Laplace space. The derivation of this property for the stationary distribution utilized the Markov-chain tree theorem, which also allows for an explicit combinatorial expression of the response ratios under variation of a single transition rate. The extension of this result was proven at the trajectory level by employing the Doob-Meyer decomposition. By employing the all-minors matrix-tree theorem, we show that this property also follows from a graph theoretic formulation and derive explicit combinatorial expressions for the non-stationary response ratios. The stationary result follows as the long-time limit and we also show that the small-time asymptotics are entirely determined by minimal path distances in the underlying graph. Finally we use the graph theoretic approach to prove that mutual linearity also extends to hitting time densities.", "url": "https://arxiv.org/abs/2605.00135", "type": "理论", "summary": "1. 该工作利用所有子式矩阵树定理，从图论推导了马尔可夫网络中瞬态概率与首次击中时间分布的互线性性质。\n2. 技术关键在于给出了非平稳响应比的显式组合表达式，并指出小时间渐近完全由底层图的最短路径距离决定。\n3. 这为解析研究复杂网络中的非平衡瞬态响应与首次通过过程提供了通用图论框架。", "summary_source": "deepseek", "authors": [{"name": "Julian B. Voits"}, {"name": "Ulrich S. Schwarz"}], "featured_authors": [{"name": "Julian B. Voits"}, {"name": "Ulrich S. Schwarz"}], "author_count": 2}, {"id": "2605.00137", "category": "cond-mat", "title": "Demonstration of a fermion Quadrupling Condensate via Quantum Monte Carlo Simulation", "abstract": "Fermionic condensation typically occurs via pairing. In recent decades, however, a fundamental question has emerged: whether alternative forms of order exist, such as condensates of fermion quadruplets. These states--including ``charge-4e\" superconductors and ``charge-0\" counterflow condensates--lie beyond the standard Bardeen-Cooper-Schrieffer framework, and require strong fluctuations and correlation effects that invalidate the BCS mean-field description. This makes the problem notoriously difficult to study numerically at a microscopic level, as it involves both strong interactions and the fermionic sign problem. Here, we present a microscopic fermionic model featuring correlated hopping that significantly mitigates the sign problem, enabling rigorous Monte-Carlo-based analysis. Using large-scale simulations, we demonstrate the existence of a fermion-quadrupling condensate with a transition temperature comparable to the hopping energy scale. These results provide direct numerical evidence for quartic fermionic order in a microscopic system and suggest that these exotic states are also experimentally accessible in ultracold atomic gases.", "url": "https://arxiv.org/abs/2605.00137", "type": "实验", "summary": "1. 该工作通过大规模量子蒙特卡洛模拟，在构建的费米子模型中证明了费米子四重凝聚态的存在。\n2. 其关键创新在于引入关联跳跃机制以显著缓解费米符号问题，从而使微观强关联系统的无偏数值研究可行。\n3. 这一发现为在超冷原子气体中实验实现电荷4e超导体或反向流凝聚等非BCS奇异量子序提供了直接理论依据。", "summary_source": "deepseek", "authors": [{"name": "Alexandru Golic"}, {"name": "Egor Babaev"}, {"name": "Johan Carlström"}], "featured_authors": [{"name": "Alexandru Golic"}, {"name": "Egor Babaev"}, {"name": "Johan Carlström"}], "author_count": 3}, {"id": "2605.00207", "category": "cond-mat", "title": "Activated random walk exhibits self-organized criticality", "abstract": "To explain the ubiquity of power laws and fractals in nature, Bak, Tang, and Wiesenfeld formulated simple conditions for a system to self-organize into a critical state. Dickman, Muñoz, Vespignani, and Zapperi postulated that the self-organized critical state matches the critical state in corresponding fixed-energy models undergoing traditional phase transitions. Although the theory has been applied broadly over the past five decades, no mathematical model has been proven to exhibit the conjectured behavior. Indeed, the originally proposed abelian sandpile model displays nonuniversal behavior stemming from its slow mixing. Marking the first result of its kind, we prove that the 1-d activated random walk model mixes quickly into a stationary state with power-law avalanches and limiting critical density that equals the critical value for the fixed-energy version.", "url": "https://arxiv.org/abs/2605.00207", "type": "理论", "summary": "1. 该工作严格证明一维激活随机游走模型自组织进入临界态，其稳态呈现幂律雪崩且混合快速。\n2. 关键卖点在于首次从数学上验证该模型的临界密度与对应固定能量模型临界值相等，且混合时间有限。\n3. 这一结果为Bak-Tang-Wiesenfeld自组织临界性猜想提供了严格范例，并为相关非平衡相变理论奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Christopher Hoffman"}, {"name": "Tobias Johnson"}, {"name": "Matthew Junge"}, {"name": "Josh Meisel"}], "featured_authors": [{"name": "Christopher Hoffman"}, {"name": "Tobias Johnson"}, {"name": "Matthew Junge"}, {"name": "Josh Meisel"}], "author_count": 4}, {"id": "2605.00211", "category": "cond-mat", "title": "Quantized Collective Fluctuations in Correlated Fermion Systems", "abstract": "Collective excitations in fermionic systems play a crucial role in determining their physical properties. An important challenge is to develop efficient theoretical approaches for describing these excitations and their coupling to fermionic degrees of freedom. In this work, we revisit the problem of quantifying the contributions of individual bosonic modes of collective fluctuations to observable properties of correlated fermion systems within the framework of the Fluctuating Local Field (FLF) method. Whereas the auxiliary field in this method was previously considered only classically, we formulate its systematic extension termed Quantum FLF (Q-FLF) that incorporates selected bosonic Matsubara modes, thus tailoring it to description of quantum collective fluctuations. As a testbed, we apply the approach to a half-filled one-dimensional Hubbard chain and compute the Green's function, the total energy, and the antiferromagnetic susceptibility. Our results demonstrate that the proposed scheme enables an efficient and selective characterization of the contributions of individual bosonic modes. In particular, low Matsubara frequencies are found to have a quantitative impact on integrated observables such as total energy and antiferromagnetic susceptibility. At the same time, an accurate description of single-particle properties requires inclusion of higher-frequency bosonic modes.", "url": "https://arxiv.org/abs/2605.00211", "type": "理论", "summary": "1. 该工作将玻色子松原模引入涨落局域场框架，发展了量子涨落局域场方法（Q-FLF）以描述关联费米子系统的量子集体涨落。\n2. 其核心在于可选择性量化个别玻色子模式对总能量和反铁磁磁化率等可观测量的贡献，并揭示低频率模对积分量的定量影响及高频率模对单粒子性质的必要性。\n3. 这为关联费米子系统中量子集体涨落的高效表征和模式分解提供了系统的理论工具，可推广至更复杂的强关联模型。", "summary_source": "deepseek", "authors": [{"name": "S.S. Onuchin"}, {"name": "Ya. S. Lyakhova"}, {"name": "L.D. Silakov"}, {"name": "A.N. Rubtsov"}], "featured_authors": [{"name": "S.S. Onuchin"}, {"name": "Ya. S. Lyakhova"}, {"name": "L.D. Silakov"}, {"name": "A.N. Rubtsov"}], "author_count": 4}, {"id": "2605.00359", "category": "cond-mat", "title": "Investigation of nonlocal transport associated with the orbital Hall effect in Ti", "abstract": "We investigate nonlocal transport in single-layer Ti Hall bars to explore signatures of orbital-current transport driven by the orbital Hall effect. Despite the negligible spin Hall effect in Ti, we observe a finite nonlocal resistance in the single-layer Ti Hall bar and study its dependence on the central channel width. Finite-element simulations show that the measured signal contains a sizable Ohmic bypass contribution. However, the bypass contribution is strongly suppressed at small channel widths and cannot fully account for the observed nonlocal resistance even when variations in the Ti resistivity are taken into account. Our results therefore suggest an additional nonlocal contribution distinct from the Ohmic bypass background, which may be associated with orbital transport driven by the orbital Hall effect in Ti.", "url": "https://arxiv.org/abs/2605.00359", "type": "数值", "summary": "1. 该工作通过测量单层Ti霍尔条中的非局域电阻，探索了轨道霍尔效应驱动的轨道电流输运。\n2. 卖点在于利用有限元模拟分离欧姆旁路贡献，在小通道宽度下发现无法被旁路解释的剩余非局域信号。\n3. 这为在自旋霍尔效应可忽略的材料中观测纯轨道输运提供了实验证据，并启发对轨道霍尔效应的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Keitaro Takashina"}, {"name": "Naoki Yano"}, {"name": "Asahi Oe"}, {"name": "Mari Taniguchi"}, {"name": "Shuto Kimura"}, {"name": "Kazuya Ando"}], "featured_authors": [{"name": "Keitaro Takashina"}, {"name": "Naoki Yano"}, {"name": "Asahi Oe"}, {"name": "Mari Taniguchi"}, {"name": "Shuto Kimura"}, {"name": "Kazuya Ando"}], "author_count": 6}, {"id": "2605.00415", "category": "cond-mat", "title": "Machine learning evaluation of structural descriptors for supercooled water", "abstract": "The anomalous behavior of liquid water is widely associated with a liquid-liquid phase transition between high- and low-density states in the supercooled regime. At the microscopic level, tetrahedral hydrogen-bond networks govern these properties, motivating structural descriptors that characterize local molecular environments. These structural descriptors quantify features such as tetrahedral order, local density, and the separation between the first and second coordination shells; however, they have largely been proposed independently, with limited systematic comparison. Here we evaluate 16 previously proposed descriptors using a neural-network-based temperature classification framework, enabling an objective assessment of their ability to distinguish temperature-dependent structural changes in supercooled water. We further apply an explainable artificial intelligence method that identifies the structural features responsible for the model predictions. This approach reveals how different descriptors encode local structural information and establishes a data-driven framework for benchmarking structural descriptors in liquid water.", "url": "https://arxiv.org/abs/2605.00415", "type": "理论+数值", "summary": "1. 该工作利用神经网络温度分类框架系统评估了16种过冷水结构描述符区分温度诱导结构变化的能力。\n2. 技术核心在于结合可解释人工智能方法，揭示了不同描述符编码局部四面体有序、密度及壳层分离等结构信息的方式。\n3. 这为液态水液-液相变微观机制的理解以及结构描述符的客观基准化提供了数据驱动范式。", "summary_source": "deepseek", "authors": [{"name": "Kohei Yoshikawa"}, {"name": "Kokoro Shikata"}, {"name": "Kang Kim"}, {"name": "Nobuyuki Matubayasi"}], "featured_authors": [{"name": "Kohei Yoshikawa"}, {"name": "Kokoro Shikata"}, {"name": "Kang Kim"}, {"name": "Nobuyuki Matubayasi"}], "author_count": 4}, {"id": "2605.00441", "category": "cond-mat", "title": "Thermodynamic Charge Partition in Accumulation-Layer Heterostructures", "abstract": "We develop a thermodynamic description of accumulation-layer heterostructures in which the induced sheet density is partitioned between the near-interface accumulation-layer charge and a complementary screening charge in the surrounding structure. Treating this partition as the central state variable yields a complete Helmholtz free energy, a corrected locked-branch chemical potential, and a shifted release potential that separates energetic path selection from geometric capacitance. The physical path is selected spectrally: compressible segments remain fully screened, whereas incompressible segments evolve along a locked branch until release is triggered by the relevant gap. Differential capacitance, tunnel current and plateau width then emerge as different projections of the same coupled thermodynamic structure. A canonical two-stage self-consistent Poisson--Schrödinger reduction supplies universal master functions for the isolated accumulation layer and master surfaces for its finite-buffer extension, making the theory calculable across density and geometry. Comparison with magnetocapacitance and magnetotunneling data supports a picture in which nearby extended charge refills the accumulation layer and the effective screening depth grows with magnetic field.", "url": "https://arxiv.org/abs/2605.00441", "type": "理论", "summary": "1. 该工作建立了积累层异质结构中感应面电荷密度在界面积累层与周围结构间分配的热力学描述。\n2. 其核心是将电荷分配作为中心状态变量，导出完整亥姆霍兹自由能、修正的锁定支化学势及移位释放势，并通过谱选择区分可压缩与不可压缩段的物理路径。\n3. 这为微分电容、隧穿电流与平台宽度提供了统一的热力学投影，且其自洽泊松-薛定谔约化方法适用于不同密度与几何结构。", "summary_source": "deepseek", "authors": [{"name": "Elmar Böckenhoff"}], "featured_authors": [{"name": "Elmar Böckenhoff"}], "author_count": 1}, {"id": "2605.00481", "category": "cond-mat", "title": "Pre-charging polymer surfaces enhances droplet mobility and electrification", "abstract": "Surface-bound electric charge on polymer materials can strongly influence droplet behaviour and solid-liquid charge transfer, but the mechanisms and the means to control these effects remain unclear. In this work, we systematically controlled the surface charge on polymer surfaces, including polytetrafluoroethylene (PTFE) and Nylon-66, by first neutralising the surfaces with an anti-static ion blower and then applying charge using an ion gun. We find that droplets pick up pre-deposited surface ions during the first wetting of the surface, and that the transferred charge directly correlates with the deposited charge encountered by the wetted area for moderate deposited densities (|{\\sigma}_d |<40 {\\mu}C/m2) independent of material properties. We also demonstrate that the deposited charge reduces contact angle and increases contact-line mobility in a manner consistent with an increase in effective solid surface energy. For higher surface charge densities, we observe instabilities such as droplet splitting or detachment. This work demonstrates an effective approach to control solid-liquid electrification, enabling amplification or suppression of surface charge and the directed manipulation of fluid motion on surfaces.", "url": "https://arxiv.org/abs/2605.00481", "type": "理论", "summary": "1. 该工作通过先中和再离子枪充电的方法，系统研究了聚合物表面预置电荷对液滴行为与固液电荷转移的影响。\n2. 核心发现是液滴首次润湿时拾取表面离子，转移电荷量与润湿区沉积电荷密度呈正相关且与材料无关，并揭示了电荷降低接触角、增大迁移率的等效表面能机制。\n3. 这为实现固液带电的主动调控及液滴定向操控提供了可编程的物理途径，尤其适用于微流控和能量收集领域。", "summary_source": "deepseek", "authors": [{"name": "Shuaijia Chen"}, {"name": "Kenta Morita"}, {"name": "Dumindu Dassanayaka"}, {"name": "Hans-Jürgen Butt"}, {"name": "Peter C. Sherrell"}, {"name": "Amanda V. Ellis"}, {"name": "Joseph D. Berry"}], "featured_authors": [{"name": "Shuaijia Chen"}, {"name": "Kenta Morita"}, {"name": "Dumindu Dassanayaka"}, {"name": "Peter C. Sherrell"}, {"name": "Amanda V. Ellis"}, {"name": "Joseph D. Berry"}], "author_count": 7}, {"id": "2605.00521", "category": "cond-mat", "title": "Induced discommensurations in the lock-in transition of charge-density waves", "abstract": "We studied McMillan's free energy of the lock-in transition in charge-density waves. The wave profiles near the critical value were obtained by numerical annealing. First, we demonstrated that our method reproduces the previous studies. The obtained wave profiles include discommensurations near the critical value. Then, we calculated possible wave profiles in the commensurate state. We found that discommensurations are able to be excited in the commensurate state, leading the system to turn out to an incommensurate state. We proposed that these wave profiles result from topological invariants. Moreover, excitation of the discommensurations is favorable for the direction to the original wavelength of the incommensurate state. This is attributed to the nature of McMillan's free energy. The current-induced incommensurations, which we discovered with the diffraction study of $o$-TaS$_3$ [Inagaki \\textit{et al.}, J. Phys. Soc. Jpn. 77, 093708 (2008)], is consistent with this study.", "url": "https://arxiv.org/abs/2605.00521", "type": "理论+数值", "summary": "1. 本文通过数值退火求解McMillan自由能，研究电荷密度波锁相转变中诱导错配区的波剖面。\n2. 其卖点在于发现共度态中可激发拓扑不变量驱动的错配区，导致系统向非共度态转变并恢复原始波长。\n3. 该工作为理解锁相转变的动力学机制和拓扑激发提供了理论依据，并与o-TaS₃衍射实验结果一致。", "summary_source": "deepseek", "authors": [{"name": "Katsuhiko Inagaki"}, {"name": "Satoshi Tanda"}], "featured_authors": [{"name": "Katsuhiko Inagaki"}, {"name": "Satoshi Tanda"}], "author_count": 2}, {"id": "2605.00567", "category": "cond-mat", "title": "Fixed points and crossovers for the hysteresis scaling of dynamic mean-field models", "abstract": "Phase transitions are divided into first-order phase transitions and continuous ones in current classification. While the latter shows striking phenomena of scaling and universality, the former is generically characterized by discontinuous jumps in extensive variables and pronounced hysteresis. Recent studies have demonstrated universal scaling behavior controlled by a cubic fixed point in first-order phase transitions. However, more recent investigations into the hysteresis in a dynamic mean-field quartic model driven through its first-order phase transitions have revealed new scaling exponents for different driving rates. Here, we discover a new exponent for large driving rates arising surprisingly from critical phenomena and show that, depending on the magnitude of the driving rates and on the absence or presence of noise, the same mean-field model remarkably exhibits several universality classes with definite universal scaling exponents governed by their corresponding fixed points through a systematic scaling analysis based on renormalization group theory. The theories and their various crossovers between different fixed points along with complete universal scaling of full curve collapse are verified by numerical results. This further confirms universal scaling in first-order phase transitions.", "url": "https://arxiv.org/abs/2605.00567", "type": "理论+数值", "summary": "1. 本文利用重整化群标度分析，系统研究了动态平均场四次模型驱动通过一级相变时滞后标度行为，发现大驱动速率下的新标度指数源于临界现象。\n2. 其关键卖点是揭示该模型根据驱动速率与噪声条件呈现多个由不同固定点控制的普适类，并通过完整曲线坍塌与交叉行为验证理论。\n3. 这进一步确认了一级相变中普适标度存在，为理解滞后动力学及噪声作用下的标度行为提供了统一的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Jiapeng Yang"}, {"name": "Fan Zhong"}], "featured_authors": [{"name": "Jiapeng Yang"}, {"name": "Fan Zhong"}], "author_count": 2}, {"id": "2605.00571", "category": "cond-mat", "title": "Quantum corrections to the Josephson dynamics: a population-imbalance approach", "abstract": "We investigate quantum corrections to the Josephson dynamics of two weakly coupled Bose-Einstein condensates using the population imbalance as the sole dynamical variable. Starting from the two-variable action, we derive the imbalance-only Lagrangian with a position-dependent mass and quantize it via symmetric operator ordering. The leading quantum corrections to the classical potential and mass are computed via the one-loop quantum effective action, using a covariant background-field method that fully accounts for the coordinate dependence of the mass. This yields explicit expressions for the effective potential and the effective mass, from which we derive the quantum-corrected Josephson frequency. Numerical comparison with exact diagonalization of the two-site Bose-Hubbard model shows that the imbalance-only formulation outperforms the complementary phase-only approach in the regime of strong interactions, which is the natural domain of validity of the population-imbalance description.", "url": "https://arxiv.org/abs/2605.00571", "type": "理论+数值", "summary": "1. 该工作以粒子数不平衡为唯一动力学变量，从双变量作用量出发导出了含位置相关质量的拉格朗日量并对称量子化，研究了两弱耦合玻色-爱因斯坦凝聚体中约瑟夫森动力学的量子修正。\n2. 技术核心在于采用协变背景场方法计算单环量子有效作用量，显式给出有效势和有效质量的解析表达式，从而精确得到量子修正的约瑟夫森频率。\n3. 与双位点Bose-Hubbard模型精确对角化的比较表明，在强相互作用区间该不平衡描述自然优于互补的相位描述，为相关少体量子动力学问题提供了更有效的低维框架。", "summary_source": "deepseek", "authors": [{"name": "Oliver Hideg"}, {"name": "Sofia Salvatore"}, {"name": "Luca Salasnich"}], "featured_authors": [{"name": "Oliver Hideg"}, {"name": "Sofia Salvatore"}, {"name": "Luca Salasnich"}], "author_count": 3}, {"id": "2605.00577", "category": "cond-mat", "title": "Long range proximity effects in planar structures involving the halfmetal ferromagnet La0.7Sr0.3MnO3 and Pt interlayers", "abstract": "Over the last decade, there has been steady research on superconducting junctions with a ferromagnet as the weak link, and where triplet correlations can transport supercurrents over a substantial distances. Of particular interest are halfmetallic ferromagnets, in which only one spin band is present, so that, presumably, the induced supercurrent is fully spin-polarized. We have earlier reported on a study of triplet transport in planar La0.7Sr0.3MnO3(LSMO) nanostrip Josephson junctions with NbTi superconducting contacts, where we found high values for the supercurrents, and large junction lengths (up to 1.3 {\\mu}m). Here, we extend that work by studying the dependence of the critical current Ic on the length of the nanostrip between the contacts and the width of the strip. All junctions show strong supercurrents, but we do not observe simple systematics. Apparently, the fabrication process does not allow sufficient control over some of its parameters. To gain more insight in the mechanism for triplet generation at the LSMO/NbTi interface, we also studied the effect of Pt as an interlayer between the LSMO and the NbTi. For this, we etched a NbTi/Pt electrode structure on a full film of LSMO. The results are highly promising, showing sharp superconducting transitions and zero-resistance states being reached at an electrode distance of 2 {\\mu}m, with indications that larger distances should be feasible.", "url": "https://arxiv.org/abs/2605.00577", "type": "理论", "summary": "1. 该工作扩展了半金属铁磁体La0.7Sr0.3MnO3纳米条约瑟夫森结中三线态超流输运的研究，并引入Pt插层以探索界面三线态产生机制。\n2. 其关键技术在于通过Pt插层实现了长达2微米电极间距的尖锐超导转变和零电阻态，表明有效促进了长程近邻效应。\n3. 这为在半金属中实现全自旋极化超流的长程输运提供了明确途径，并启示通过界面工程优化自旋混合以增强超导关联。", "summary_source": "deepseek", "authors": [{"name": "Junxiang Yao"}, {"name": "Julian van Doorn"}, {"name": "Mariona Cabero"}, {"name": "Jan Aarts"}], "featured_authors": [{"name": "Junxiang Yao"}, {"name": "Julian van Doorn"}, {"name": "Mariona Cabero"}, {"name": "Jan Aarts"}], "author_count": 4}, {"id": "2605.00609", "category": "cond-mat", "title": "Coordination Engineering of Dual-Atom Catalysts for Overall Water Splitting: Mechanistic Insights from Constant-Potential First-Principles and Machine Learning", "abstract": "The rational design of bifunctional electrocatalysts for the hydrogen evolution reaction (HER) and oxygen evolution reaction (OER) is essential for achieving efficient and cost-effective overall water splitting. Atomically dispersed transition-metal catalysts, including single-atom catalysts and dual-atom catalysts (DACs), have emerged as a prominent class of heterogeneous catalysts, in which coordination engineering plays a decisive role in tuning catalytic performance. Herein, we explore coordination-engineered bifunctional overall water splitting electrocatalysts using graphene-supported DACs (TM1TM2-C6-xNx) as model systems. By tuning C/N coordination and dual-metal combinations (Fe, Co, Ni, and Cu), a library of 228 structures was constructed. A three-step screening strategy, combining constant-charge and constant-potential density functional theory with kinetic analysis of proton-coupled electron transfer (PCET), identifies 24 highly active candidates (TM1TM2 = CoNi, CoCu and Co2) with mixed C/N coordination for OER. These catalysts exhibit overpotentials comparable to that of IrO2 and low PCET barriers (lower than 0.40 eV), among which 22 also show high HER activity. Machine learning reveals clear coordination-dependent structure-performance relationships. Such bifunctionality arises from coordination engineering that enables the simultaneous optimization of OER intermediate adsorption and the hydrogen binding strength for HER. This work establishes coordination engineering as an effective strategy for designing high-performance bifunctional dual-atom electrocatalysts for overall water splitting.", "url": "https://arxiv.org/abs/2605.00609", "type": "理论+数值", "summary": "1. 该工作通过恒电位第一性原理计算与机器学习，系统研究了石墨烯负载双原子催化剂中配位工程对析氢和析氧双功能活性的调控机制。\n2. 主要技术卖点在于结合恒电荷与恒电位密度泛函理论及质子耦合电子转移动力学，从228种结构中筛选出24种低过电位和低PCET势垒的OER高活性组合。\n3. 这为理性设计双原子配位环境以同时优化OER中间体吸附和HER氢结合强度提供了明确策略，启示了配位工程在全解水电催化中的普遍有效性。", "summary_source": "deepseek", "authors": [{"name": "Jiahang Li"}, {"name": "Suhang Li"}, {"name": "Chong Yan"}, {"name": "Jiajun Yu"}, {"name": "Qinzhuang Liu"}, {"name": "Ruo-Ya Wang"}, {"name": "Dongwei Ma"}], "featured_authors": [{"name": "Jiahang Li"}, {"name": "Suhang Li"}, {"name": "Chong Yan"}, {"name": "Qinzhuang Liu"}, {"name": "Ruo-Ya Wang"}, {"name": "Dongwei Ma"}], "author_count": 7}, {"id": "2605.00611", "category": "cond-mat", "title": "Suppressing spin qubit decoherence during shuttling via confinement modulation", "abstract": "Reliable long-range qubit shuttling is a powerful tool for scalable quantum computing architectures. We investigate strategies to improve the coherence of moving spin qubits by performing continuous dynamical decoupling by modulating their confinement potential. Specifically, we introduce temporal and spatial breathing shuttling protocols that leverage spin-orbit interactions in hole-spin systems to electrically drive the qubit while moving. This enables efficient dressed-state shuttling, where the spin is continuously rotated during transport, suppressing the effect of low-frequency noise. Using the filter function formalism, we identify driving regimes that efficiently mitigate both global and local magnetic and electric noise sources. We find that confinement-modulated shuttling can significantly enhance coherence during transport, while revealing distinct limitations depending on the correlation length of the noise. Applying our framework to germanium hole-spin qubits, we show that these protocols provide a practical route toward noise-resilient long-range coherent quantum links.", "url": "https://arxiv.org/abs/2605.00611", "type": "理论", "summary": "1. 该工作提出利用限制势调制在自旋量子比特穿梭过程中实施连续动态解耦策略。\n2. 其技术核心在于通过空穴自旋轨道耦合与时空调制协议实现电驱动旋转，抑制低频噪声影响。\n3. 这为基于锗空穴自旋构建噪声鲁棒的长距离相干量子链路提供了实用方案。", "summary_source": "deepseek", "authors": [{"name": "Daniel Q. L. Nguyen"}, {"name": "Maximilian Rimbach-Russ"}, {"name": "Stefano Bosco"}], "featured_authors": [{"name": "Daniel Q. L. Nguyen"}, {"name": "Maximilian Rimbach-Russ"}, {"name": "Stefano Bosco"}], "author_count": 3}, {"id": "2605.00629", "category": "cond-mat", "title": "Monte Carlo study of the superfluid phase of $^4$He", "abstract": "Detailed numerical results obtained with state-of-the-art Quantum Monte Carlo (QMC) simulations are presented for the superfluid phase of $^4$He at saturated vapor pressure. The aim of this contribution is that of providing reliable, up-to-date estimates for this archetypal superfluid, reflecting the methodological progress that has taken place over the past two decades. We simulate a system comprising 2,048 helium atoms, i.e., an order of magnitude greater in size than those for which results currently regarded as standard references were originally obtained. We offer revised estimates for energetic and structural properties, as well as for the ground state condensate fraction.", "url": "https://arxiv.org/abs/2605.00629", "type": "理论+数值", "summary": "1. 该工作采用大规模量子蒙特卡洛模拟，对饱和蒸气压下⁴He超流相的能量、结构性质和基态凝聚分数提供了修正估计。\n2. 其关键在于模拟原子数达2048个，比传统标准参考体系大一个量级，从而显著提升了计算精度与可靠性。\n3. 这为超流氦的基准检验以及更精确的量子多体理论发展提供了重要参考。", "summary_source": "deepseek", "authors": [{"name": "Massimo Boninsegni"}], "featured_authors": [{"name": "Massimo Boninsegni"}], "author_count": 1}, {"id": "2605.00653", "category": "cond-mat", "title": "Dispersion of multiple charged species in an axially symmetric slowly varying channel", "abstract": "The transport and dispersion of multiple species of charged ions are central to many biological and physical processes, including electrokinetic ion separation. However, most theoretical studies of dispersion in channels have focused on neutral solutes, leaving the transport of multiple charged species comparatively unexplored. Differences in ionic diffusivities in a multispecies electrolyte solution generate an self-induced electric fields that drive electromigration. To capture these effects at the macroscopic scale, we combine the lubrication approximation with homogenization theory, under electroneutrality and zero-current constraints, to derive an effective transport equation governing the cross-sectionally averaged concentrations. We apply our model framework to a range of channel geometries and compute the resulting effective dispersion coefficients. Finally, we investigate how channel geometry can be tuned to enhance ionic separation. We observe a geometry-induced electro-diffusive coupling that inhibits solute dispersion in certain channels, leading to a non-monotonic Number of Theoretical Plates (NTP) and making such channels ideal for separation processes.", "url": "https://arxiv.org/abs/2605.00653", "type": "理论", "summary": "1. 该工作结合润滑近似与均匀化理论，推导了多电荷离子在轴向对称渐变通道中横截面积平均浓度的有效输运方程。\n2. 其核心在于揭示了离子扩散率差异产生的自生电场与几何约束下的电-扩散耦合，导致分散系数出现非单调行为。\n3. 这为通过调节通道几何形状增强电动力学离子分离性能提供了理论指导，尤其适用于优化理论塔板数。", "summary_source": "deepseek", "authors": [{"name": "Thakurdas Mahata"}, {"name": "Anirban Chatterjee"}, {"name": "Ameeya Kumar Nayak"}], "featured_authors": [{"name": "Thakurdas Mahata"}, {"name": "Anirban Chatterjee"}, {"name": "Ameeya Kumar Nayak"}], "author_count": 3}, {"id": "2605.00656", "category": "cond-mat", "title": "Renormalized entropy production for optimal transport in jump processes: Make conservative forces optimal again", "abstract": "For continuous-space diffusion processes, there is a strong connection between conservative forces and entropy production. For a given time evolution of the system's state, the entropy production is minimized when the system is driven by a unique conservative force. However, this relation does not extend to jump processes on a discrete state space. In this case, the forces that minimize the entropy production are generally nonconservative, this effect is more pronounced far from equilibrium in the presence of high energy barriers. Here we show that, while conservative forces do not minimize the entropy production for a given time evolution, they are nevertheless uniquely characterized as the minimizer of a quantity we dub the renormalized entropy production. This work explores the properties this quantity shares with entropy production as well as crucial differences between them. We also discuss the conceptual and physical differences between the corresponding optimization problems in finite time. Our theoretical calculations are illustrated with explicit numerical examples.", "url": "https://arxiv.org/abs/2605.00656", "type": "数值", "summary": "1. 该工作针对离散状态空间跳过程，引入重正化熵产生概念，并证明保守力是该新量的唯一最小化者。\n2. 其物理要点在于，虽然保守力不最小化常规熵产生，但重正化熵产生恢复了它在最优输运中的最优性，尤其在远离平衡的高能垒情形下效果显著。\n3. 这一发现为有限时间跳过程的最优控制与热力学代价分析提供了新视角，有望推动非平衡统计理论向离散系统的拓展。", "summary_source": "deepseek", "authors": [{"name": "Andreas Dechant"}, {"name": "Jann van der Meer"}], "featured_authors": [{"name": "Andreas Dechant"}, {"name": "Jann van der Meer"}], "author_count": 2}, {"id": "2605.00732", "category": "cond-mat", "title": "Reconstruction of spin structures from topological charge distributions via generative neural network systems", "abstract": "Localized topological defects inherently possess a multiscale character. While their microstructure configuration depends on the specific physical system, their topological features and mutual interactions can be described on the macroscale in terms of a particle representation. However, determining the physical properties associated with a given defect pattern often requires knowledge of the underlying microscopic structure. In this work, we extend a Wasserstein generative adversarial neural network by incorporating physical constraints and Fourier-space information to generate microscopic spin configurations consistent with prescribed macroscopic patterns and thermodynamic parameters. Using the two-dimensional XY model as a test case, where vortex-antivortex pairs act as long-range interacting defects, we show that the model generates spin configurations that accurately reproduce magnetization, susceptibility, helicity modulus, and spin-spin correlations over a wide range of temperatures below the Kosterlitz-Thouless transition. At the same time, deviations in the specific heat reveal limitations in reproducing higher order energy fluctuations. A complementary analysis based on topological data analysis uncovers subtle differences in global spin-correlation structures at near critical temperatures that are not apparent from conventional correlation functions alone. These results demonstrate both the promise and current limitations of generative approaches for multiscale studies of defect-dominated spin systems and at the same time highlight topological methods as valuable tools for characterizing critical behavior.", "url": "https://arxiv.org/abs/2605.00732", "type": "理论", "summary": "1. 该工作扩展了Wasserstein生成对抗网络，融入物理约束与傅里叶空间信息，从宏观拓扑荷分布重建微观自旋构型。\n2. 在二维XY模型KT相变中，模型准确复现磁化率、螺旋模量与自旋关联，但比热偏差暴露高阶涨落局限；拓扑数据分析揭示近临界全局关联结构的传统方法不可见差异。\n3. 这展示了生成方法在多尺度缺陷自旋系统中的前景与局限，并突出了拓扑数据分析作为表征临界行为的互补工具。", "summary_source": "deepseek", "authors": [{"name": "Kyra H. M. Klos"}, {"name": "Jan Disselhoff"}, {"name": "Michael Wand"}, {"name": "Karin Everschor-Sitte"}, {"name": "Friederike Schmid"}], "featured_authors": [{"name": "Kyra H. M. Klos"}, {"name": "Jan Disselhoff"}, {"name": "Michael Wand"}, {"name": "Karin Everschor-Sitte"}, {"name": "Friederike Schmid"}], "author_count": 5}, {"id": "2605.00802", "category": "cond-mat", "title": "Determination of Density Functional Tight Binding Models for Cerium Allotropes", "abstract": "We have developed Density Functional Tight Binding (DFTB) models for cerium that accurately predict both the electronic band structure and energetic ordering of different allotropes. We show that global optimization of the electronic confining potentials minimize the errors in the predicted Kohn-Sham energies while facilitating determination of a many-body repulsive energy. Our results illustrate the ability of DFTB to accurately reproduce complex f-electron interactions for multiple phases while leveraging minimal Density Functional Theory data.", "url": "https://arxiv.org/abs/2605.00802", "type": "理论+数值", "summary": "1. 该工作为铈的不同同素异形体开发了密度泛函紧束缚模型，准确预测其电子能带结构与能量排序。\n2. 技术关键在于全局优化电子约束势以最小化Kohn-Sham能量误差，同时确定多体排斥能。\n3. 这表明DFTB能依赖少量DFT数据精确复现复杂f电子相互作用，为稀土多相体系的高效模拟提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Nir Goldman"}, {"name": "Artem Samtsevych"}, {"name": "Chiara Panosetti"}], "featured_authors": [{"name": "Nir Goldman"}, {"name": "Artem Samtsevych"}, {"name": "Chiara Panosetti"}], "author_count": 3}, {"id": "2605.00089", "category": "hep-th", "title": "On the Asymptotic Causal Structure in Gravitational EFTs", "abstract": "It is usually assumed that a healthy EFT should not allow superluminal propagation. In the presence of gravity, however, the notion of superluminality becomes subtle, since there is no invariant way to compare with an underlying Minkowski light cone. One can instead resort to an asymptotic criterion: whether the EFT can induce signal propagation faster than what allowed by the asymptotic structure of spacetime. In this work we study the asymptotic causal structure of gravitational EFTs by analysing signal propagation in black-hole backgrounds in the presence of higher-derivative operators. We show that in spacetime dimensions D>4 the effective light cones can lead to genuine asymptotic superluminality, which can be used to constrain the regime of validity of the EFT. By contrast, in D=4 the asymptotic causal structure is universally identical to that of Schwarzschild: prompt null curves remain insensitive to higher-derivative corrections and no asymptotic time advance is possible. We first study the representative operator $R_{\\mu\\nu\\rho\\sigma}F^{\\mu\\nu}F^{\\rho\\sigma}$, then show that this conclusion is true for any EFT, as it relies only on the asymptotic behaviour of the metric. Finally, we discuss two ways to define superluminality in D=4 spacetimes: introducing a covariant cut-off by putting the theory in an asymptotically-AdS background, or imposing a hard cut-off by working at finite distance.", "url": "https://arxiv.org/abs/2605.00089", "type": "理论", "summary": "1. 该工作通过分析引力有效场论中黑洞背景下的信号传播，研究了渐近因果结构。\n2. 主要发现在于时空维度D>4时有效光锥导致真渐近超光速可约束EFT有效范围，而D=4时渐近因果结构与史瓦西黑洞完全一致，无时间提前。\n3. 这为引力EFT的有效性边界及D=4中超光速的重新定义（如引入共形截断或硬截断）提供了理论约束与明确指导。", "summary_source": "deepseek", "authors": [{"name": "Bruno Bucciotti"}, {"name": "Paolo Creminelli"}, {"name": "Alessandro Longo"}, {"name": "Warin Patrick McBlain"}, {"name": "Enrico Trincherini"}], "featured_authors": [{"name": "Bruno Bucciotti"}, {"name": "Paolo Creminelli"}, {"name": "Alessandro Longo"}, {"name": "Warin Patrick McBlain"}, {"name": "Enrico Trincherini"}], "author_count": 5}, {"id": "2605.00203", "category": "hep-th", "title": "Topological charges and confined-deconfined phase transition in holography", "abstract": "In recent years, many interesting works providing a topological description for black hole (BH) properties have appeared in the literature. In particular, in this framework BHs correspond to topological defects in an enlarged (off-shell) parameter space, with an associated total topological charge. In gauge/gravity duality the transition from the confined to the deconfined phase is mapped into the dominance of a BH phase in the gravity side. Here we show, using a holographic AdS/QCD model, that the introduction of an energy scale in anti-de Sitter (AdS) space results in a change in the topological class. Such a modification corresponds to the existence of confined and deconfined phases, separated by a Hawking Page transition at a finite critical temperature.", "url": "https://arxiv.org/abs/2605.00203", "type": "理论", "summary": "1. 本文利用全息AdS/QCD模型，展示了在AdS空间中引入能量尺度如何改变拓扑类，从而描述禁闭与退禁闭相变。\n2. 其核心在于将黑洞视为离壳参数空间中的拓扑缺陷，通过拓扑荷的变化区分相，并以Hawking-Page相变对应有限临界温度下的拓扑类切换。\n3. 这为在全息框架下利用拓扑分类刻画强耦合系统的相结构提供了明确启示，并可推广至其他具有能量尺度的引力对偶模型。", "summary_source": "deepseek", "authors": [{"name": "Nelson R. F. Braga"}, {"name": "William S. Cunha"}], "featured_authors": [{"name": "Nelson R. F. Braga"}, {"name": "William S. Cunha"}], "author_count": 2}, {"id": "2605.00559", "category": "hep-th", "title": "Perturbative Analysis of CPT-Odd Lorentz-Violating Scalar QCD", "abstract": "We perform a complete one-loop renormalization analysis of CPT-odd Lorentz-violating scalar quantum chromodynamics with adjoint scalar matter. Working to first order in the preferred background vector and treating the corresponding operators as perturbative insertions, we compute the ultraviolet-divergent parts of the relevant two-, three-, and four-point Green's functions for the gauge, scalar, and ghost fields. We show that the gauge sector develops the expected Carroll-Field-Jackiw-type correction, which generically turns out to be divergent in our theory, although the divergence vanishes in a certain gauge, while the scalar sector displays the corresponding CPT-odd single-derivative term proportional to the background vector. We further demonstrate that several of the Lorentz-violating corrections the three- and four-point function are ultraviolet finite. All one-loop divergences may be absorbed into counterterms already allowed by the classical Lagrangian, providing an explicit proof of the multiplicative renormalizability of the theory at this order. We also obtain the associated renormalization constants and one-loop $\\beta$-functions for the gauge coupling, the Lorentz violation parameters, and the scalar self-interaction.", "url": "https://arxiv.org/abs/2605.00559", "type": "理论", "summary": "1. 该工作对带有CPT破缺洛伦兹违规的伴随标量量子色动力学完成了完整的一圈重整化分析。\n2. 其核心在于证明规范场获得Carroll-Field-Jackiw型修正，且在特定规范下发散消失，标量场获得对应单导数项，所有一圈发散可被经典拉氏量中的对易项吸收，从而证明了该理论在此阶的乘性可重整性。\n3. 这为后续研究洛伦兹违规标量QCD的高阶量子修正、重整化群流及物理效应提供了明确的重整化常数与β函数。", "summary_source": "deepseek", "authors": [{"name": "J. C. C. Felipe"}, {"name": "L. C. T. Brito"}, {"name": "A. C. Lehum"}, {"name": "B. Altschul"}, {"name": "A. Yu. Petrov"}], "featured_authors": [{"name": "J. C. C. Felipe"}, {"name": "L. C. T. Brito"}, {"name": "A. C. Lehum"}, {"name": "B. Altschul"}, {"name": "A. Yu. Petrov"}], "author_count": 5}, {"id": "2605.00757", "category": "hep-th", "title": "More on Classical Stability of Hopf-like Solitons of the Toroidal-Twisted type", "abstract": "The Faddeev-Hopf model [1] supporting Hopfions was shown to emerge in the low-energy limit of four-dimensional scalar quantum electrodynamics (QED) with two charged scalar fields [2, 3]. Faddeev and Noemi conjectured that the Hopfions and Hopf-like solitons -- vortons -- can be based on a twisted toroidal structure inherent to QED [4-6]. This conjecture was discussed in detail in [2] in the approximation of negligibly small extrinsic curvature. Qualitative and semi-quantitative arguments were used to demonstrate the validity of the Faddeev-Noemi hypothesis. Here we further enhance the proof by applying a numerical analysis which confirms that large-size Hopf-like solitons exist as local energy minima in the full QED theory (in the Faddeev-Skyrme model they become topological solitons representing the global minima in the given topological sector).", "url": "https://arxiv.org/abs/2605.00757", "type": "理论", "summary": "1. 该工作通过数值分析，证实了在四维标量量子电动力学完整理论中，大尺寸环形扭曲型Hopf-like孤子作为局部能量最小值存在。\n2. 其主要进展在于超越了先前小外曲率近似，在非微扰框架下验证了Faddeev-Noemi关于扭结涡旋环拓扑结构的猜想。\n3. 这为理解QED中拓扑孤子的稳定性提供了直接证据，并启发在Faddeev-Skyrme模型中探索类似全局极小构型的可能性。", "summary_source": "deepseek", "authors": [{"name": "Chao-Hsiang Sheu"}, {"name": "Mikhail Shifman"}], "featured_authors": [{"name": "Chao-Hsiang Sheu"}, {"name": "Mikhail Shifman"}], "author_count": 2}, {"id": "2605.00780", "category": "hep-th", "title": "Breakdown of Semiclassical Gravity in Four-Dimensional Black Hole Evaporation", "abstract": "We study black hole formation and evaporation in a four-dimensional semiclassical model that preserves diffeomorphism invariance and reproduces the one-loop trace anomaly. Solving the quantum-corrected Einstein equations for the collapse of a spherically symmetric null shell, we follow the formation and evaporation of a black hole with back-reaction included. The semiclassical solutions develop a spacelike thunderbolt singularity that emerges after the apparent horizon has receded and extends far from the black hole where the semiclassical curvature is a priori expected to be parametrically small. This behavior arises from a nonlinear instability of the higher-derivative semiclassical equations and is generic in models with anomaly-induced quantum corrections. The thunderbolt signals a breakdown of semiclassical effective field theory over macroscopic distances and undermines the standard formulation of the black hole information paradox.", "url": "https://arxiv.org/abs/2605.00780", "type": "理论", "summary": "1. 该工作在保持微分同胚不变并再现单圈迹道反常的四维半经典模型中，研究了球对称零壳塌缩形成黑洞及其蒸发过程，并求解了含反作用的量子修正爱因斯坦方程。\n2. 其核心发现是半经典解在视界退缩后发展出类空霹雳奇点，该奇点延伸至半经典曲率本应参数小的远处，源于高阶导数半经典方程的非线性不稳定性。\n3. 这一结果标志着半经典有效场论在宏观距离上失效，动摇了黑洞信息悖论的标准表述框架，对量子引力理论提出根本性挑战。", "summary_source": "deepseek", "authors": [{"name": "David A. Lowe"}, {"name": "Larus Thorlacius"}], "featured_authors": [{"name": "David A. Lowe"}, {"name": "Larus Thorlacius"}], "author_count": 2}, {"id": "2605.00228", "category": "math-ph", "title": "Classical limit of the Pauli-Fierz dynamics", "abstract": "We study the Schrödinger evolution generated by the Pauli-Fierz Hamiltonian, a model for nonrelativistic quantum electrodynamics, in the classical limit $\\hbar \\rightarrow 0$. In this regime, we rigorously derive the Newton-Maxwell equations of classical electrodynamics as effective dynamics approximating the time evolution. Our result complements prior work by an alternative derivation that provides explicit estimates on the rate of convergence, justifying the validity of the approximation for a special class of initial data.", "url": "https://arxiv.org/abs/2605.00228", "type": "理论", "summary": "1. 该工作严格推导了Pauli-Fierz哈密顿量在经典极限下薛定谔演化趋近于牛顿-麦克斯韦方程的有效动力学。\n2. 其技术核心在于对一类特殊初态给出了收敛速率的显式估计，从而验证了近似在量子电动力学经典极限下的成立性。\n3. 这为非相对论量子电动力学与经典电动力学之间的对接提供了数学严格的桥梁，启发了更广泛半经典极限问题的量化分析。", "summary_source": "deepseek", "authors": [{"name": "Lucas Jougla"}, {"name": "Nikolai Leopold"}], "featured_authors": [{"name": "Lucas Jougla"}, {"name": "Nikolai Leopold"}], "author_count": 2}, {"id": "2605.00316", "category": "math-ph", "title": "Unraveling the Bott spiral", "abstract": "We construct and compute a homotopy-theoretic model for the Bott spiral of symmetry-protected topological phases (SPTs) studied by Queiroz--Khalaf--Stern. We model free and interacting fermionic SPTs using K-theory and reflection-positive invertible field theories (IFTs), resp., and define a twisted generalization of the Atiyah--Bott--Shapiro orientation to produce a free-to-interacting map. We also define and compute spiral maps of IFTs to model dimensional reduction in this context, answering a question of Hason--Komargodski--Thorngren. Our analysis highlights two general aspects of homotopical free-to-interacting maps. First, IFTs are more sensitive than K-theory is to the input symmetry data; in particular, the specification of an Altland--Zirnbauer class is insufficient information to define symmetry type for an IFT. Second, the remnant of Bott periodicity on the interacting side relies on an isomorphism of two extraspecial groups of order 32. Our computations use a novel 4-periodic description of a sector of the twisted ko-homology of elementary abelian 2-groups.", "url": "https://arxiv.org/abs/2605.00316", "type": "理论", "summary": "1. 该工作为Queiroz–Khalaf–Stern所研究的Bott螺旋构造了同伦论模型，分别用K-理论和反射正定可逆场论描述自由与相互作用费米子对称保护拓扑相。\n2. 其核心在于定义Atiyah–Bott–Shapiro定向的扭曲推广以构建自由到相互作用映射，并发现可逆场论对对称类型比K-理论更敏感，且Bott周期性的残余依赖于两个32阶超特殊群的同构。\n3. 这为SPT相中的维度约化与自由-相互作用对应提供了同伦论框架，同时表明Altland–Zirnbauer类不足以为可逆场论唯一定义对称类型，需引入更精细的对称数据。", "summary_source": "deepseek", "authors": [{"name": "Arun Debray"}, {"name": "Cameron Krulewski"}, {"name": "Luuk Stehouwer"}], "featured_authors": [{"name": "Arun Debray"}, {"name": "Cameron Krulewski"}, {"name": "Luuk Stehouwer"}], "author_count": 3}, {"id": "2605.00403", "category": "math-ph", "title": "Generalized Fourier Transforms for Momentum-Space Construction on Riemannian Manifolds", "abstract": "We extend Fourier analysis to curved spaces by defining a Generalized Fourier Transform (GFT) on any Riemannian manifold $\\Sigma$ via spectral decomposition. Under minimal requirements that the transform is an isometric isomorphism and has a kernel diagonalizing the Laplace-Beltrami operator, we prove that the GFT satisfies a generalized Parseval-Plancherel theorem. To resolve the spectral degeneracy that obscures \"momentum space\" in such settings, we require the degenerate sector to be resolved by a local, symmetry-adapted maximal Abelian commuting set (a fiberwise MASA), constructed from geometric differential operators, most notably from Killing data when such symmetries are available. We provide a constructive algorithm for generating these commuting operators and show that the resulting momentum label spaces $\\mathcal{F}$ (discrete, continuous, or mixed) reflect geometric symmetry constraints. We introduce a dual classification: (i) by MASA completeness and Stackel separability, and (ii) by the topology of $\\mathcal{F}$. Finally, we distinguish unitary changes induced by true isometries (which preserve the GFT structure) from changes of coordinate-adapted degeneracy resolution/separation schemes, which may induce inequivalent $k$-space labelings (e.g. Cartesian vs spherical constructions in $\\mathbb{R}^{3}$) while remaining unitarily equivalent on $\\mathcal{L}^{2}\\left[\\Sigma\\right]$. This symmetry-adapted harmonic analysis is intended as a foundation for curved-space mode decompositions; dynamical applications are developed in the subsequent work.", "url": "https://arxiv.org/abs/2605.00403", "type": "理论", "summary": "1. 该工作通过谱分解在任意黎曼流形上定义广义傅里叶变换，扩展了弯曲空间的傅里叶分析。\n2. 其核心突破在于利用几何微分算子构造纤维化最大阿贝尔交换集解析拉普拉斯–贝尔特拉米算子的谱简并，得到受几何对称约束的动量标签空间。\n3. 这为弯曲空间中的模式分解与后续动力学应用（如量子场论或引力理论）提供了严格的调和分析基础。", "summary_source": "deepseek", "authors": [{"name": "Seramika Ariwahjoedi"}, {"name": "Muhammad Farchani Rosyid"}, {"name": "Andika Kusuma Wijaya"}], "featured_authors": [{"name": "Seramika Ariwahjoedi"}, {"name": "Muhammad Farchani Rosyid"}, {"name": "Andika Kusuma Wijaya"}], "author_count": 3}, {"id": "2605.00478", "category": "math-ph", "title": "Strong-disorder expansion of the root-averaged density of states for the Anderson model on the Bethe lattice", "abstract": "We study the root-averaged density of states for the Anderson model on the Bethe lattice in the strong-disorder regime. Here the density of states means the root-averaged spectral measure, not a finite-volume eigenvalue counting limit. We assume that the single-site distribution has compact support and has a locally analytic density on an interval $I^\\sharp$ containing a given interval $I$. Combining the random-walk expansion on the tree with a complex-analytic argument for the single-site Stieltjes transforms, we prove that the scaled averaged diagonal resolvent has a holomorphic continuation to a complex neighborhood of $I$ for all sufficiently large $\\lambda$. By the Stieltjes inversion formula, the root-averaged density of states measure is absolutely continuous on the scaled energy window $\\lambda I$, and its density is real analytic and has a finite-order strong-disorder expansion there. In the scaled form $E=\\lambda\\xi$, the leading coefficient is the local density of the single-site distribution. All odd coefficients vanish, and the higher coefficients are finite sums determined by occupation profiles of short closed walks on the tree. For the uniform single-site distribution, we compute the first nonzero correction term explicitly.", "url": "https://arxiv.org/abs/2605.00478", "type": "理论", "summary": "1. 该工作针对Bethe格点上的安德森模型，结合随机游走展开与单位点Stieltjes变换的复分析论证，证明了强无序下根平均态密度在标度能量窗口上的绝对连续性与实解析性，并导出了其有限阶强无序展开。\n2. 其技术核心在于，对所有足够大的无序强度，标度平均对角预解式可全纯延拓至实轴复邻域，使态密度展开系数由树上短闭游走的占据分布之有限和表示，且所有奇次系数为零。\n3. 这一解析展开方法为树状拓扑系统强无序谱性质提供了可系统计高阶修正的框架，并可推广至其他递归结构上的局域化问题。", "summary_source": "deepseek", "authors": [{"name": "Masahiro Kaminaga"}], "featured_authors": [{"name": "Masahiro Kaminaga"}], "author_count": 1}, {"id": "2605.00589", "category": "math-ph", "title": "Reflection Symmetry, APS Boundary Conditions, and Equivariant Spectral Flow on a Warped Cylinder", "abstract": "We study reflection symmetry and Atiyah-Patodi-Singer (APS) boundary conditions for twisted Dirac operators on a finite warped cylinder. For a complex line twist with holonomy parameter $A$, we show that the reflection lifts to a unitary symmetry of the twisted Dirac setting if and only if $2A\\in\\mathbb Z$. In the resulting reflection-compatible fixed-holonomy case, reflection pairs opposite shifted angular modes, and the paired APS blocks are unitarily equivalent. The reflection trace on the APS harmonic space localizes to the unique self-paired zero-mode sector. We then turn to parameter-dependent versions of the model. For fixed gauge-trivial holonomy, the family remains pointwise \\(O(2)\\)-equivariant, and its spectral flow admits an \\(RO(O(2))\\)-valued decomposition. For genuinely varying holonomy, pointwise \\(O(2)\\)-equivariance is lost along the path. The representation-ring-valued invariant is then replaced by a residual sign-level invariant: the mod-two parity of the APS crossing events.", "url": "https://arxiv.org/abs/2605.00589", "type": "理论", "summary": "1. 该工作系统研究了扭曲圆柱上带APS边界条件的狄拉克算子，揭示了反射对称性提升为幺正对称的充要条件，并分析了谱流在O(2)等变框架下的分解特征。\n2. 其卖点在于发现反射兼容情形下APS块间的幺正等价性与反射迹在唯一自配对零模扇区的局域化，以及变holonomy下谱流不变量退化为模二奇偶性的机制。\n3. 这为理解边界条件对称性对谱流拓扑不变量的约束提供了严格框架，并启发向高维弯曲流形及非阿贝尔规范对称性的推广。", "summary_source": "deepseek", "authors": [{"name": "Taro Kimura"}, {"name": "Sanchita Sharma"}], "featured_authors": [{"name": "Taro Kimura"}, {"name": "Sanchita Sharma"}], "author_count": 2}, {"id": "2605.00075", "category": "quant-ph", "title": "Essential Duality and Maximal Non-signalling Extensions in Algebraic Quantum Field Theory", "abstract": "We show that, under additivity, the maximal von Neumann algebra extension of $\\mathcal{A}(O)$ inside $B(\\mathcal{H})$ whose inner automorphisms are non-signalling with respect to all spacelike-separated regions is $\\mathcal{A}(O')'$. Consequently, $\\mathcal{A}(O)$ is maximal with respect to this property if and only if essential duality holds. The proof is purely algebraic. When essential duality fails, we construct a proper extension all of whose inner automorphisms, and more generally all normal completely positive maps admitting Kraus operators in the algebra, are non-signalling. Under essential duality, any proper extension necessarily admits a signalling operation. An entropic formulation using Araki relative entropy provides a quantitative diagnostic of signalling, though it is not used in the proof. Additional structural results include the wedge-intersection identity $\\mathcal{A}(O')' = \\bigcap_{W \\supset O}\\mathcal{A}(W)$ and equivalent characterisations of essential duality. These results identify essential duality as an operational maximality condition within the given representation.", "url": "https://arxiv.org/abs/2605.00075", "type": "理论", "summary": "1. 该工作证明在可加性假设下，代数量子场论中区域代数𝒜(O)的最大非信号冯·诺依曼扩展为𝒜(O')'，并获得本质对偶性正是该最大性的充要条件。\n2. 其技术核心在于纯代数构造，揭示本质对偶性缺失时可构建非信号真扩展，其中所有内自同构及Kraus算符位于代数内的完全正映射均非信号，而本质对偶性成立时任何真扩展必然包含信号操作。\n3. 这一结果将本质对偶性诠释为表示中的操作论最大性，并提供了基于Araki相对熵的定量非信号诊断，为量子场论中信息因果性与代数结构关联的研究开辟了方向。", "summary_source": "deepseek", "authors": [{"name": "Hassan Nasreddine"}], "featured_authors": [{"name": "Hassan Nasreddine"}], "author_count": 1}, {"id": "2605.00077", "category": "quant-ph", "title": "Left handness in a four-level atomic system", "abstract": "A scheme is proposed for realizing simultaneous negative permittivity and negative permeability based on quantum coherence in a four-level dense atomic system this http URL some parametric conditions the system shows that simultaneous negative permittivity and negative permeability( this http URL handness) can be achieved in a wider frequency band because of quantum this http URL the novelty properties of gain and dispersion near the resonance frequency may have some potential applications.", "url": "https://arxiv.org/abs/2605.00077", "type": "理论", "summary": "1. 该工作在四能级稠密原子系统中提出利用量子相干实现同时负介电常数与负磁导率（左手性）的方案。\n2. 其技术卖点在于量子相干使左手性在更宽频带内实现，且共振频率附近具备增益和色散新颖特性。\n3. 这为基于原子相干效应的宽频左手材料设计以及相关光子学器件提供潜在应用方向。", "summary_source": "deepseek", "authors": [{"name": "Shuncai Zhao"}, {"name": "Zhengdong Liu"}], "featured_authors": [{"name": "Shuncai Zhao"}, {"name": "Zhengdong Liu"}], "author_count": 2}, {"id": "2605.00088", "category": "quant-ph", "title": "A Unified Framework for Locally Stable Phases", "abstract": "We propose a unifying framework for characterizing pure and mixed state phases of matter across equilibrium, non equilibrium, and metastable regimes. We introduce the concept of locally stable states, defined by the operational property that any local operation (including post selection) can be reversed by a local channel. We prove that local stability is equivalent to a state being short range correlated, defined by the decay of both correlations and conditional mutual information. We demonstrate that these properties are invariant under locally reversible channels, thus defining locally stable phases. Furthermore, we prove that local stability implies both the decay of a family of nonlinear correlators, including the fidelity correlator, and the decay of correlations in the canonical purification, thus bridging the gap between mixed and pure states. Along the way, we establish two results which may be of independent interest: we show that post-selection on locally stable (short range correlated) states can be implemented via local channels and that quantum Markov chains can be characterized by the local computability of nonlinear observables.", "url": "https://arxiv.org/abs/2605.00088", "type": "理论", "summary": "1. 该工作提出统一框架，刻画平衡、非平衡及亚稳态下纯态与混合态的局域稳定相。\n2. 核心卖点是引入局域稳定态概念，证明其等价于短程关联，且在局域可逆信道下相位不变。\n3. 这为混合态与纯态相的统一描述奠基础，并揭示后选择可局域实现，启发量子信息与多体物理交叉研究。", "summary_source": "deepseek", "authors": [{"name": "Zhi Li"}, {"name": "Raz Firanko"}, {"name": "Timothy H. Hsieh"}], "featured_authors": [{"name": "Zhi Li"}, {"name": "Raz Firanko"}, {"name": "Timothy H. Hsieh"}], "author_count": 3}, {"id": "2605.00094", "category": "quant-ph", "title": "Graph-theory measures capture weak ergodicity breaking on large quantum systems", "abstract": "We study the onset of weak ergodicity violations in closed quantum many-body systems and focus on cases in which they occur through a transition that is controlled by a model parameter. Our analysis is based on representing quantum systems in Fock space and utilizes graph-theoretical measures. As a main result, we show that the recently introduced graph-energy centrality captures known weak ergodicity-breaking transitions via characteristic changes in its distribution. While most numerical tools are limited to small system sizes, our measure can be calculated analytically for large systems of many hundreds of sites and in some cases, even in the thermodynamic limit. We conclude by demonstrating the applicability of our Fock-space based measure to a kinetically constrained quantum model, where we find evidence for a weak ergodicity-breaking transition accompanied by glassy dynamics.", "url": "https://arxiv.org/abs/2605.00094", "type": "理论+数值", "summary": "1. 该工作利用图论中心性度量，在Fock空间中刻画了封闭量子多体系统的弱遍历性破缺转变。\n2. 其核心在于引入图能量中心性的分布特征，可解析计算数百格点乃至热力学极限下的弱遍历性破缺行为。\n3. 这为大规模量子系统中弱遍历性破缺的检测及玻璃态动力学的理解提供了可解析处理的图论框架。", "summary_source": "deepseek", "authors": [{"name": "Heiko Georg Menzler"}, {"name": "Rafał Świętek"}, {"name": "Mari Carmen Bañuls"}, {"name": "Fabian Heidrich-Meisner"}], "featured_authors": [{"name": "Heiko Georg Menzler"}, {"name": "Rafał Świętek"}, {"name": "Mari Carmen Bañuls"}, {"name": "Fabian Heidrich-Meisner"}], "author_count": 4}, {"id": "2605.00099", "category": "quant-ph", "title": "Provable and scalable quantum Gaussian processes for quantum learning", "abstract": "Despite rapid recent advances in quantum machine learning, the field is in many ways stuck. Existing approaches can exhibit serious limitations, and we still lack learning frameworks that are simple, interpretable, scalable, and naturally suited to quantum data. To address this, here we introduce quantum Gaussian processes, a Bayesian framework for learning from quantum systems through priors over unknown quantum transformations. We show that, under suitable conditions, unitary quantum stochastic processes define Gaussian processes, thereby enabling regression, classification, and Bayesian optimization directly on quantum data. The key ingredient in this framework is sufficient knowledge of a quantum process's structure and symmetries to define an informative prior through its corresponding quantum kernel, effectively injecting a strong, physics-informed inductive bias into the learning model. We then prove that matchgate, or free-fermionic, evolutions give rise to provable and scalable quantum Gaussian processes, providing the first family in our framework where the unknown unitary acts non-trivially on all qubits. Finally, we demonstrate accurate long-range extrapolation, phase-diagram learning in many-body systems, and sample-efficient Bayesian optimization in a quantum sensing task. Our results identify quantum Gaussian processes as a promising route toward simpler and more structured forms of quantum learning.", "url": "https://arxiv.org/abs/2605.00099", "type": "理论+数值", "summary": "1. 该工作引入量子高斯过程框架，通过量子随机过程定义高斯过程，实现对量子数据的贝叶斯回归、分类与优化。\n2. 其核心卖点在于利用量子过程的结构与对称性构建含丰富物理先验的量子核，并证明自由费米子演化给出首个可证明且可扩展的量子高斯过程族。\n3. 这为量子学习提供了一种简单、可解释且天然适合量子数据的结构化途径，有望推动量子传感和多体物理中的高效推断。", "summary_source": "deepseek", "authors": [{"name": "Jonas Jäger"}, {"name": "Paolo Braccia"}, {"name": "Pablo Bermejo"}, {"name": "Manuel G. Algaba"}, {"name": "Diego García-Martín"}, {"name": "M. Cerezo"}], "featured_authors": [{"name": "Jonas Jäger"}, {"name": "Paolo Braccia"}, {"name": "Pablo Bermejo"}, {"name": "Manuel G. Algaba"}, {"name": "Diego García-Martín"}, {"name": "M. Cerezo"}], "author_count": 6}, {"id": "2605.00101", "category": "quant-ph", "title": "Nonreciprocity-enriched steady phases in open quantum systems", "abstract": "Nonreciprocity can profoundly alter the spectra and dynamics of open quantum systems, yet its impact on the long-time steady-state phases of matter has remained largely unexplored. Here we show that the interplay of nonreciprocity, symmetry defects, and spatial boundaries can generate phases beyond the standard spontaneous-symmetry-breaking paradigm. We demonstrate this mechanism by showing that sufficiently strong nonreciprocity turns boundaries into sources and drains of symmetry defects, while simultaneously endowing these defects with chiral dynamics in the bulk. As a result, the conventional uniform symmetry-broken state gives way to a domain-wall traveling-wave phase, in which symmetry defects form a persistent chiral wave. We showcase this mechanism in a bosonic model with \\(Z_{2}\\) symmetry, where periodic boundary conditions support only the conventional symmetric and symmetry-broken phases, whereas open boundary conditions allow the traveling-wave phase. We further show that even in the absence of symmetry breaking, the steady state can exhibit anomalous chiral relaxation: owing to the non-Hermitian skin effect in the stability matrix, local fluctuations are chirally amplified as they approach a boundary, where they eventually decay. Combining mean-field theory with truncated Wigner simulations, we characterize these phases, analyze the order parameter and Goldstone-mode fluctuations of the traveling-wave phase, and confirm its existence in three spatial dimensions.", "url": "https://arxiv.org/abs/2605.00101", "type": "理论+数值", "summary": "1. 该工作揭示了非互易性、对称缺陷与空间边界三者耦合可在开放量子系统中产生超越标准自发对称破缺范式的稳态相。\n2. 其核心机制在于强非互易性将系统边界转化为对称缺陷的源与漏，并赋予缺陷在体区的手性动力学，从而形成畴壁行波稳态。\n3. 该发现为在耗散量子多体体系中探索手性输运与非厄米趋肤效应对稳态性质的调控提供了明确的理论框架和数值证据。", "summary_source": "deepseek", "authors": [{"name": "Ding Gu"}, {"name": "Zhanpeng Fu"}, {"name": "Zhong Wang"}], "featured_authors": [{"name": "Ding Gu"}, {"name": "Zhanpeng Fu"}, {"name": "Zhong Wang"}], "author_count": 3}, {"id": "2605.00106", "category": "quant-ph", "title": "From Tensor Networks to Tractable Circuits, and back", "abstract": "Tensor networks and circuits are widely used data structures to represent pseudo-Boolean functions. These two formalisms have been studied primarily in separate communities, and this paper aims to establish equivalences between them. We show that some classes of tensor networks that are appealing in practice correspond to classes of circuits with specific properties that have been studied in knowledge compilation as \\emph{tractable circuits}. In particular, we prove that matrix product states (tensor trains) coincide with nondeterministic edge-valued decision diagrams and that tree tensor networks exactly correspond to structured-decomposable circuits. These correspondences enable direct transfer of structural and algorithmic results; for example, canonicity and tractability guarantees known for circuits yield analogous guarantees for the associated tensor networks, and vice versa.", "url": "https://arxiv.org/abs/2605.00106", "type": "数值", "summary": "1. 该工作建立了张量网络与可处理电路之间的形式等价关系。\n2. 其核心在于证明矩阵乘积态（张量列）与非确定性边值决策图、树张量网络与结构化可分解电路的精确对应。\n3. 这些对应使得规范性与可处理性保证等结构性和算法结果可在两领域间直接转移。", "summary_source": "deepseek", "authors": [{"name": "Arend-Jan Quist"}, {"name": "Marc Farreras Bartra"}, {"name": "Alexis de Colnet"}, {"name": "John van de Wetering"}, {"name": "Alfons Laarman"}], "featured_authors": [{"name": "Arend-Jan Quist"}, {"name": "Marc Farreras Bartra"}, {"name": "Alexis de Colnet"}, {"name": "John van de Wetering"}, {"name": "Alfons Laarman"}], "author_count": 5}, {"id": "2605.00118", "category": "quant-ph", "title": "Toward Secure Multitenant Quantum Computing: Circuit Affinity, Crosstalk Patterns, and Grouping Strategies", "abstract": "Multitenancy increases throughput and reduces costs in cloud-based quantum computing, but concurrent job execution introduces security risks through inter-circuit crosstalk. We characterize the structural predictability of these interference patterns across seven IBM superconducting processors, spanning Heron (r1-r3) and Nighthawk (r1) architectures and five different circuit types. We evaluate pairwise interactions, by applying the Structural Similarity Index (SSIM) and a structural $t$-statistic to the concurrent execution of five foundational quantum circuits (QAOA, Grover's, QPE, QFT, and ZZFeatureMap), we quantify behavioral consistency across disparate hardware. Our results identify three types of circuits: universally aggressive, universally sensitive, and cotenant-dependent circuits. Aggressive circuits, such as Grover's Algorithm, exhibit a statistically significant interference pattern, yielding a $t$-statistic range of $[1.37,2.61]$ relative to the standalone baselines across all tested pairings. Conversely, sensitive circuits, such as the Quantum Fourier Transform, demonstrate a disproportionate susceptibility to multitenant execution, showing high deviations from single-tenant computational behavior. We demonstrate that crosstalk signatures are highly consistent within architectural revisions--with intra-revision similarity reaching $0.77$ (Hr3) and $0.68$ (Hr2)--while inter-revision similarity drops to $0.43$. Furthermore, we identify a ``topological decoupling\" between Heavy-Hex and square lattice systems, where structural similarity falls to $0.01$ between Heron r1 and Nighthawk r1. These findings provide an empirical foundation for hardware-aware schedulers to strategically pair jobs, maximizing system utilization while preserving computational integrity.", "url": "https://arxiv.org/abs/2605.00118", "type": "理论+数值", "summary": "1. 该工作实验表征了IBM超导量子处理器上多租户执行时电路间串扰干扰的结构可预测性，识别出通用攻击型、敏感型及共租依赖型三类电路。\n2. 其关键发现是串扰特征在相同架构版本内高度一致（内版本相似度达0.77），而跨版本间显著下降（至0.43），并在Heavy-Hex与方格晶格系统间出现拓扑解耦（相似度仅0.01）。\n3. 这为设计硬件感知调度器以策略性配对作业、在提升系统利用率的同时保证计算完整性提供了经验基础。", "summary_source": "deepseek", "authors": [{"name": "Andrew Woods"}, {"name": "Chi-Ren Shyu"}], "featured_authors": [{"name": "Andrew Woods"}, {"name": "Chi-Ren Shyu"}], "author_count": 2}, {"id": "2605.00132", "category": "quant-ph", "title": "Entanglement Enabled Data Transmission over an Arbitrarily Varying Channel", "abstract": "Shared randomness is the central ingredient for stabilizing symmetrizable communication systems against arbitrarily varying jammers. Given the presence of the jammer, however, the question arises how this precious resource could have been distributed. Several works discuss the use of external sources for this task. In this work, we show, based on the most standard optical communication model, how the sender and receiver can employ entangled two-mode squeezed states to counter the jamming attack of an energy-limited jammer during the distribution phase when both the sender and jammer are allowed to use binary phase shift keying and two-mode squeezed vacuum states.", "url": "https://arxiv.org/abs/2605.00132", "type": "理论", "summary": "1. 该工作证明在标准光通信模型中，发送方与接收方可利用纠缠双模压缩态在分布阶段对抗能量受限干扰者的任意变化信道攻击。\n2. 其核心在于双方均采用二进制相移键控与双模压缩真空态时，纠缠资源能有效稳定通信信道，无需依赖外部共享随机性。\n3. 这为在存在任意干扰下利用量子纠缠实现安全通信提供了可行方案，并启发了有限能量干扰环境下纠缠辅助通信的理论与实验研究。", "summary_source": "deepseek", "authors": [{"name": "Janis Nötzel"}, {"name": "Florian Seitz"}], "featured_authors": [{"name": "Janis Nötzel"}, {"name": "Florian Seitz"}], "author_count": 2}, {"id": "2605.00157", "category": "quant-ph", "title": "Asymptotic Replacement for Quantum Channel Products with Applications to Inhomogeneous Matrix Product States", "abstract": "We develop a product-level trace-Dobrushin theory for finite-dimensional quantum channel products and apply it to deterministic and stationary random inhomogeneous matrix product states in left-canonical CPTP gauge. For a product of channels, the centered trace-Dobrushin coefficient quantifies the residual dependence on the input state, and its decay is the criterion for trace-norm forgetting. In the deterministic setting, this decay is equivalent to asymptotic replacement by a moving replacement channel. For two-sided products, pullback forgetting produces a unique boundary state, which determines the canonical replacement family. For stationary random CPTP cocycles, submultiplicativity of the product coefficient yields a trace-Dobrushin Lyapunov exponent. We prove that the almost sure negativity of this exponent is equivalent to quenched trace-norm memory loss and gives exponential forward and pullback convergence to a unique dynamically stationary random replacement channel. When
