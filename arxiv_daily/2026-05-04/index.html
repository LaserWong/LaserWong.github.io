the \\(\\varrho\\)-mixing profile of the channel environment tends to zero, we obtain annealed super-polynomial estimates, while independence gives annealed exponential estimates. Finally, we transfer these estimates to inhomogeneous matrix product states whose auxiliary transfer maps are CPTP. These channel estimates transfer to deterministic and stationary random inhomogeneous MPS, giving infinite-volume limits of trace-closed finite-volume states, quantitative boundary stability, and correlation bounds governed by the same auxiliary product coefficients.", "url": "https://arxiv.org/abs/2605.00157", "type": "理论", "summary": "1. 该工作为有限维量子信道乘积建立了乘积级trace-Dobrushin理论，并应用于左正则CPTP规范下的确定性与平稳随机非齐次矩阵乘积态。\n2. 其核心卖点在于中心化trace-Dobrushin系数指数衰减给出迹范数遗忘严格判据，确定性情形等价于渐近替换为移动替换信道，随机情形通过Lyapunov指数负性保证淬灭收敛，并给出ρ-混合与独立下的退火估计。\n3. 这些信道估计直接转移至非齐次MPS，为无限体积迹闭极限态、定量边界稳定性及关联衰减提供由辅助乘积信道系数统一控制的完整刻画。", "summary_source": "deepseek", "authors": [{"name": "Lubashan Pathirana"}], "featured_authors": [{"name": "Lubashan Pathirana"}], "author_count": 1}, {"id": "2605.00241", "category": "quant-ph", "title": "Exploring the Geometric and Dynamical Properties of Spin Systems and Their Interplay with Quantum Entanglement", "abstract": "This thesis, explores the quantum entanglement and evolution through both a geometric and dynamical perspective. The first part focuses on classical phase space and its central role in Hamiltonian mechanics, emphasizing the importance of symplectic structures in describing mechanical states. The study highlights the formal analogy between classical phase space and the Hilbert space used in quantum mechanics. The second part is devoted to the geometric description of quantum states through the projective structure of Hilbert space. Emphasis is placed on the geometric interpretation of quantum evolution, particularly via the Fubini-Study metric, associated symplectic structures, and the geometric phase acquired during unitary evolutions. The final two parts are dedicated to the study of spin systems (both two-body and many-body) under different interaction models (XXZ Heisenberg and all-range Ising). Both the dynamical aspects (evolution speed, entanglement, and the quantum brachistochrone problem) and the geometric and topological structures of the corresponding quantum states are analyzed.", "url": "https://arxiv.org/abs/2605.00241", "type": "理论", "summary": "1. 该工作从几何与动力学双重视角，系统研究了自旋系统（XXZ海森堡模型及全范围伊辛模型）中的量子纠缠与演化。\n2. 其核心卖点在于利用经典相空间的辛结构与量子希尔伯特空间的射影几何（Fubini-Study度量和几何相位）的形式类比，揭示了演化速度、纠缠与量子速限问题的几何机制。\n3. 这为自旋多体系统中纠缠几何与动力学行为的统一描述提供了清晰框架，并对量子控制与量子信息处理中的最优演化路径设计具有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Jamal Elfakir"}], "featured_authors": [{"name": "Jamal Elfakir"}], "author_count": 1}, {"id": "2605.00259", "category": "quant-ph", "title": "Entanglement Distance of Two- and Multi-Qubit Variational States and Its Quantification with Quantum Computing", "abstract": "We study the entanglement distance of variational quantum states for two-qubit and multi-qubit systems. These states are constructed using variational quantum circuits with $R_Y$ rotations and entangling $CZ$ this http URL the two-qubit case, we analytically derive recurrence relations for expectation values of Pauli observables using. This approach allows us to analytically calculate quantum correlators and evaluate the entanglement distance depending on the circuit parameters and depth. The analysis were extended to a closed one-dimensional chain of $N$ qubits. It is shown that with increasing circuit depth, more qubits influence a given qubit, which reflects the spreading of quantum correlations in the system. For a closed one-dimensional chain of $N$ qubits, explicit analytical expressions are derived for the case of two layers. The results are compared with numerical simulations performed using quantum programming tools. The results agree with the theoretical predictions.", "url": "https://arxiv.org/abs/2605.00259", "type": "理论+数值", "summary": "1. 该工作研究了两量子比特与多量子比特变分量子态的纠缠距离，并基于变分量子电路（RY旋转与CZ纠缠门）解析推导了泡利期望值的递推关系。\n2. 主要技术点在于解析计算了量子关联函数，明确了纠缠距离随电路深度增加而扩展的规律，并在N量子比特一维闭合链的两层电路中给出了显式表达式。\n3. 这为变分量子态的纠缠结构提供了可解析刻画的框架，并对量子计算中量子关联的传播机制与电路设计具有理论启发。", "summary_source": "deepseek", "authors": [{"name": "Kh. P. Gnatenko"}, {"name": "R. O. Hredil"}, {"name": "V. Y. Pinchuk"}, {"name": "M. Z. Seniak"}, {"name": "Yu. T. Shevchuk"}], "featured_authors": [{"name": "Kh. P. Gnatenko"}, {"name": "R. O. Hredil"}, {"name": "V. Y. Pinchuk"}, {"name": "M. Z. Seniak"}, {"name": "Yu. T. Shevchuk"}], "author_count": 5}, {"id": "2605.00341", "category": "quant-ph", "title": "Measuring the largest coefficients of a quantum state", "abstract": "We introduce a hierarchical algorithm for identifying the largest Pauli coefficients of an unknown $n$-qubit quantum state. The algorithm traverses a prefix-based tree whose nodes represent partial sums of squared Pauli coefficients, always expanding branches with the largest estimated weight and discarding the rest. Node weights are estimated using Bell sampling on two copies of the state, or alternatively via SWAP tests on subsystems. We analyze the sample complexity of each node estimation and derive bounds on the total number of nodes expanded as a function of the desired number of coefficients and the state's purity. For states admitting a sparse representation in the Pauli basis, the algorithm achieves a good reconstruction of the dominant components without requiring full state tomography. We validate the method with numerical simulations on Pauli-singleton states and random stabilizer states, showing that the algorithm's performance is competitive with other methods for structured states. Our work addresses an open problem in Pauli sampling and provides a practical tool for the targeted characterization of structured quantum states.", "url": "https://arxiv.org/abs/2605.00341", "type": "理论+数值", "summary": "1. 该工作提出一种分层算法，通过前缀树渐进扩展预测最大Pauli系数的分支，识别未知n量子比特态的最大Pauli系数。\n2. 技术核心在于利用Bell采样或子系统SWAP测试估计节点权重，数值分析给出样本复杂度与扩展节点数界限，无需完整态层析即可重构稀疏Pauli表示态的主要成分。\n3. 这为结构化量子态的靶向表征与开放Pauli采样问题提供了实用方法，并启示了基于分支估计算法在多体量子信息处理中的扩展应用。", "summary_source": "deepseek", "authors": [{"name": "Nicolás Ciancaglini"}, {"name": "Santiago Cifuentes"}, {"name": "Guido Bellomo"}, {"name": "Santiago Figueira"}, {"name": "Ariel Bendersky"}], "featured_authors": [{"name": "Nicolás Ciancaglini"}, {"name": "Santiago Cifuentes"}, {"name": "Guido Bellomo"}, {"name": "Santiago Figueira"}, {"name": "Ariel Bendersky"}], "author_count": 5}, {"id": "2605.00446", "category": "quant-ph", "title": "From quantum storage to amplification: the effect of unwanted couplings and an additional level in cavity-based ensemble quantum memories", "abstract": "Quantum-memory models often reduce complex level structures to an idealized $\\Lambda$ system, potentially missing nearby levels and unwanted couplings that can qualitatively alter the predicted performance. Here, we study an extension of a cavity-based $\\Lambda$-type ensemble memory, a four-level model with unwanted couplings from both the control field and signal, using a fully quantum treatment. We derive explicit expressions for the single-photon storage efficiency, retrieval efficiency, and fidelity, and on this basis identify three distinct dynamical regimes: stable, threshold, and unstable. Within the stable regime, we additionally discriminate between two qualitatively different sub-regimes. Applying the theory to warm-vapor-inspired parameters, we determine the conditions under which the system can still operate as a high-quality quantum memory. More generally, our results provide a practical framework for distinguishing genuine memory operation from amplification and for optimizing realistic quantum memories beyond idealized models.", "url": "https://arxiv.org/abs/2605.00446", "type": "理论+数值", "summary": "1. 该工作将腔基Λ型系综量子记忆模型扩展至四能级，全量子处理了控制场与信号的不需要耦合。\n2. 推导出存储效率、检索效率与保真度的解析表达式，刻画出稳定、阈值与不稳定三个动力学区域，并在稳定区内识别两个不同子区域。\n3. 为在真实体系下区分量子记忆与放大效应提供了判据，并对优化超越理想模型的现实量子存储器具有实际指导意义。", "summary_source": "deepseek", "authors": [{"name": "Jia-Wei Ji"}, {"name": "Christoph Simon"}], "featured_authors": [{"name": "Jia-Wei Ji"}, {"name": "Christoph Simon"}], "author_count": 2}, {"id": "2605.00739", "category": "quant-ph", "title": "A Resource-Efficient Variational Quantum Framework for the Traveling Salesman Problem", "abstract": "The Traveling Salesman Problem (TSP) is a prototypical combinatorial optimization problem, but its quantum implementation is limited by the O(n^2)-qubit overhead of standard one-hot encodings. Here, we propose a resource-efficient variational quantum framework based on compact binary-register encoding, a permutation-preserving problem-inspired ansatz, and a complementary divide-and-conquer execution strategy. The compact encoding reduces the data-qubit requirement to O(n log n), while the divide-and-conquer formulation lowers the number of qubits required in each local hardware execution to the size of the largest subsystem. Numerical simulations on TSP instances with 4, 5, and 6 cities achieve best average success rates of 100%, 100%, and 95.5%, respectively. A local two-qubit implementation of the divide-and-conquer approximation is further evaluated for a 5-city TSP instance on SpinQ Gemini Pro and SpinQ Triangulum II NMR quantum computers. Taken together, the results indicate how compact encoding and divide-and-conquer execution with classical post-processing can be used to study small combinatorial optimization instances on resource-constrained quantum hardware.", "url": "https://arxiv.org/abs/2605.00739", "type": "数值", "summary": "1. 该工作提出一种基于紧凑二进制寄存器编码与分治策略的变分量子框架，用于在资源受限量子硬件上求解旅行商问题。\n2. 其技术核心在于将数据量子比特数从标准O(n²)降至O(n log n)，并通过保排列的拟设和分区执行降低单次运行所需量子比特数至最大子系统规模。\n3. 这为当前中等规模量子处理器上利用紧凑编码与经典后处理结合求解小规模组合优化问题提供了可验证的实用路径。", "summary_source": "deepseek", "authors": [{"name": "Yuefeng Lin"}, {"name": "Chao Zheng"}, {"name": "Cong Guo"}], "featured_authors": [{"name": "Yuefeng Lin"}, {"name": "Chao Zheng"}, {"name": "Cong Guo"}], "author_count": 3}, {"id": "2605.00745", "category": "quant-ph", "title": "Quantum simulation of nanographenes and Trotter error cancellation", "abstract": "Fault-tolerant quantum computing is a promising tool for simulating molecules and materials, but frequently-considered applications require substantial resources, and the gap between hardware capabilities and requirements remains significant. We propose quantum simulation of nanographene $\\pi$-systems as relevant and scalable problems to span the gap between early and large-scale fault-tolerant quantum computing. We examine the efficiency of Trotterized quantum simulation, present a detailed analysis of worst-case, average-case and energy eigenvalue Trotter errors, and show that these Trotter error estimates vary by orders of magnitude. Trotter eigenvalue errors are obtained from a novel tensor-network-based approach which allows spectral analysis of product formulas for systems beyond brute-force calculation. Notably, we observe a Trotter error cancellation phenomenon whereby the Trotter error for energy differences between low-lying eigenstates is significantly smaller than the Trotter error for absolute energies, resulting in approximately an order of magnitude circuit depth reduction for quantum phase estimation calculation of energy gaps. This is a significant result because for most chemical applications, only energy differences are of practical relevance. We estimate that calculation of energy gaps to chemical accuracy between the ground- and excited-states within the Pariser--Parr--Pople model for large 2D nanographenes (up to 140 spin orbitals) requires circuits with $< 3.2 \\times 10^7$ Toffoli gates. This work shows that considering details of chemically-relevant applications and exploiting error cancellation can lead to substantial reductions in resource requirements.", "url": "https://arxiv.org/abs/2605.00745", "type": "理论+数值", "summary": "1. 该工作提出以纳米石墨烯π体系作为连接早期与大规模容错量子计算的可扩展模拟问题，并系统分析了Trotter化量子模拟的误差。\n2. 其技术亮点在于通过张量网络方法实现乘积公式的谱分析，揭示了低能态间能隙的Trotter误差抵消现象，使量子相位估计电路深度降低约一个数量级。\n3. 这为化学精度下大尺寸二维纳米石墨烯（多达140个自旋轨道）的基态-激发态能隙计算提供了明确的资源估算（<3.2×10^7个Toffoli门），凸显了利用化学应用细节与误差抵消大幅降低量子计算资源需求的可行路径。", "summary_source": "deepseek", "authors": [{"name": "Andreas Juul Bay-Smidt"}, {"name": "Nina Glaser"}, {"name": "Marcel D. Fabian"}, {"name": "Earl T. Campbell"}, {"name": "Nick S. Blunt"}, {"name": "Gemma C. Solomon"}], "featured_authors": [{"name": "Andreas Juul Bay-Smidt"}, {"name": "Nina Glaser"}, {"name": "Marcel D. Fabian"}, {"name": "Earl T. Campbell"}, {"name": "Nick S. Blunt"}, {"name": "Gemma C. Solomon"}], "author_count": 6}, {"id": "2605.00747", "category": "quant-ph", "title": "Quantum Interval Bound Propagation for Certified Training of Quantum Neural Networks", "abstract": "Quantum machine learning is a promising field for efficiently learning features of a dataset to perform a specified task, such as classification. Interval bound propagation (IBP) is a popular certified training method in classical machine learning, where the lower and upper bounds are tracked throughout the model. These bounds are used during training to ensure that the model is certified to predict the correct label even under adversarial perturbations. While IBP is successful in classical domain, there are limited certified training efforts in quantum domain. In this paper, we present quantum interval bound propagation (QIBP) to establish a certified training routine for quantum machine learning, certifying the accuracy of models under adversarial perturbations. We implement QIBP using both interval and affine arithmetic to explore the tradeoffs between the two implementations in terms of accuracy and other design considerations. Extensive evaluation demonstrates that the resulting certified trained models have robust decision boundaries, guaranteed to predict the correct class for the samples within the trained adversarial robustness bounds.", "url": "https://arxiv.org/abs/2605.00747", "type": "理论+数值", "summary": "1. 该工作提出了量子区间边界传播(QIBP)方法，用于量子神经网络的可信训练。\n2. 其卖点在于同时采用区间与仿射算术，探索认证精度与计算开销的权衡。\n3. 这为量子机器学习模型在对抗扰动下提供认证鲁棒性保证开辟了道路。", "summary_source": "deepseek", "authors": [{"name": "Emma Andrews"}, {"name": "Nahyeon Kim"}, {"name": "Prabhat Mishra"}], "featured_authors": [{"name": "Emma Andrews"}, {"name": "Nahyeon Kim"}, {"name": "Prabhat Mishra"}], "author_count": 3}, {"id": "2605.00770", "category": "quant-ph", "title": "Topological protection of local quantum Fisher information", "abstract": "In many-body quantum systems, unitary dynamics generically delocalize locally encoded information, causing single-site metrological sensitivity to vanish. We analytically demonstrate that a topological phase can prevent this dispersal. In the open Kitaev chain, a Majorana zero mode fixes the boundary quantum Fisher information (QFI) at a nonzero plateau that persists for times exponentially long in system size. We derive exact analytical expressions for the local QFI and identify the mechanism as the spatial separation of the two Majorana quadratures to opposite ends of the chain. This separation produces a boundary encoding-axis asymmetry that distinguishes topological boundary memory from a generic localized subgap signal. We show numerically that the asymmetry is robust to moderate quenched on-site disorder, while the boundary plateau remains visible under parity-preserving interactions in finite-size real-time simulations. The protocol requires only product-state initialization, Hamiltonian evolution, and single-site readout.", "url": "https://arxiv.org/abs/2605.00770", "type": "理论+数值", "summary": "1. 本文解析证明了拓扑相能够保护局部量子Fisher信息免受幺正动力学导致的离域化，使边界QFI在指数长时间内保持非零平台。\n2. 其物理机制在于马约拉纳零模式将两个正交分量空间分离至链的两端，产生边界编码轴不对称性，以此区分拓扑边界记忆与局域子隙信号。\n3. 该工作为利用拓扑边界实现持久量子计量提供了明确方案，且协议仅需乘积态初始化、哈密顿演化与单站点读出，便于实验验证。", "summary_source": "deepseek", "authors": [{"name": "Marcin Płodzień"}, {"name": "Jan Chwedeńczuk"}], "featured_authors": [{"name": "Marcin Płodzień"}, {"name": "Jan Chwedeńczuk"}], "author_count": 2}, {"id": "2605.00772", "category": "quant-ph", "title": "Entanglement capacity of complex networks from quantum walks", "abstract": "Discrete-time quantum walks provide a natural framework for quantum transport on complex networks. On regular structures, coin-walker entanglement has been widely used to characterize quantum transport and to support quantum algorithmic protocols. However, this notion relies on a fixed Hilbert space factorization separating coin and position and is therefore not directly applicable to more complex, irregular structures. Here we introduce an entanglement measure for general networks based on a bipartition that assigns each node two roles, acting as both a source and a target. The resulting bipartition defines the source-target entanglement, a measure for general networks, motivated by coin-walker entanglement. We show that the connectivity of the network imposes an upper bound on this entanglement and identify graph matchings as the underlying structure governing entanglement generation. We further illustrate that in random graphs improving graph connectivity reduces the attainable entanglement, establishing a structure-dependent constraint on quantum correlations.", "url": "https://arxiv.org/abs/2605.00772", "type": "理论+数值", "summary": "1. 该工作为复杂网络上的量子游走引入一种基于节点源-目标二分的纠缠度量，推广了硬币-游走者纠缠至不规则结构。\n2. 其核心在于揭示图匹配是纠缠生成的底层结构，并证明网络连通性对源-目标纠缠施加了严格上界。\n3. 这建立了网络拓扑与量子关联之间的结构依赖约束，为量子输运及纠缠资源优化提供了理论指导。", "summary_source": "deepseek", "authors": [{"name": "Pravy Prerana"}, {"name": "Sascha Wald"}], "featured_authors": [{"name": "Pravy Prerana"}, {"name": "Sascha Wald"}], "author_count": 2}, {"id": "2605.00794", "category": "quant-ph", "title": "Quantum Simulation of Differential-Algebraic Equations with Applications to Unsteady Stokes Flow", "abstract": "Differential-algebraic equations (DAEs) arise naturally in constrained dynamical systems, but their algebraic constraints and hidden compatibility conditions make them more subtle than standard ordinary differential equations. This paper initiates a quantum-algorithmic study of constrained linear DAEs. We introduce a dilation framework that embeds the generally non-Hermitian constrained evolution into a projected Schrödinger-type dynamics on an enlarged Hilbert space, \\[ i\\frac{d}{dt}\\Psi(t)=P\\tH P\\Psi(t), \\] where $\\tH$ is Hermitian and $P$ is the orthogonal projector onto the lifted constraint subspace. This identifies the DAE evolution with a quantum Zeno-type dynamics and enables the use of block encodings, QSVT-based projector construction, and Hamiltonian simulation. We apply the framework to structure-preserving discretizations of the unsteady Stokes equations, where the pressure enforces the discrete incompressibility constraint. We derive the corresponding projected Hamiltonian formulation, identify low-energy spectral cutoffs motivated by solution smoothness, and discuss the resulting quantum simulation cost in comparison with classical projection-type methods. The results provide a first step toward understanding the potential intersection of quantum algorithms, DAEs, and constrained PDE dynamics.", "url": "https://arxiv.org/abs/2605.00794", "type": "理论+数值", "summary": "1. 该工作提出基于膨胀框架的量子算法，将线性微分代数方程嵌入投影薛定谔动力学，并应用于非稳态斯托克斯流的结构保持离散。\n2. 其技术核心是将约束演化等价为量子芝诺型动力学，利用块编码和基于量子奇异值变换的投影算符构造实现系统模拟。\n3. 这为量子算法与微分代数方程及约束偏微分方程动力学的交叉研究开辟了方向，并给出了相比于经典投影方法的量子模拟成本估计。", "summary_source": "deepseek", "authors": [{"name": "Hsuan-Cheng Wu"}, {"name": "Xiantao Li"}], "featured_authors": [{"name": "Hsuan-Cheng Wu"}, {"name": "Xiantao Li"}], "author_count": 2}, {"id": "2605.00807", "category": "quant-ph", "title": "Probability Distribution Analysis of the Cascaded Variational Quantum Eigensolver", "abstract": "The cascaded variational quantum eigensolver (CVQE) circumvents the need for iterative communication between the quantum and classical processing units that is necessary in the conventional VQE algorithm. While CVQE offers complete freedom to choose the guiding state as input, not all guiding states suffice for solution accuracy, as well as resource efficiency. Our work presents a process based on trapezoidal-state preparation for selecting guiding states that yield accurate many-electron ground-state solutions with minimal resource consumption. By analyzing the state probability distributions at different stages of the CVQE calculations, we determine the optimal guiding-state parameters for given resource constraints. We demonstrate the process by comparing electronic energies along the minimal-energy path for a prototypical bimolecular reaction, $\\mathrm{H}_2 + \\mathrm{H}_2^+ \\rightarrow \\mathrm{H}_3^+ + \\mathrm{H}$, using Noisy Intermediate-Scale Quantum (NISQ) computing.", "url": "https://arxiv.org/abs/2605.00807", "type": "数值", "summary": "1. 该工作提出基于概率分布分析的梯形态制备方法，用于级联变分量子特征求解器中引导态的最优选择。\n2. 其卖点在于通过分析不同计算阶段的状态概率分布，在给定资源约束下确定最优引导态参数，以最小量子资源获得精确多电子基态解。\n3. 这为NISQ计算中的量子化学应用提供了资源高效的引导态选择策略，尤其适用于多步反应路径的能量计算。", "summary_source": "deepseek", "authors": [{"name": "Yi-Hua Lai"}, {"name": "John P.T. Stenger"}, {"name": "Gloria Bazargan"}, {"name": "Igor V. Schweigert"}, {"name": "Daniel Gunlycke"}], "featured_authors": [{"name": "Yi-Hua Lai"}, {"name": "John P.T. Stenger"}, {"name": "Gloria Bazargan"}, {"name": "Igor V. Schweigert"}, {"name": "Daniel Gunlycke"}], "author_count": 5}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
