  <style>
    :root {

    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

    .author-item { display: grid; gap: 4px; }

    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }

    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }

    const papers = [{"id": "2607.21682", "category": "cond-mat", "title": "Symmetry-Adapted Physical and Vibrational Properties of Ferroelectric Perovskite Oxides: Application to PbZrxTi1-xO3", "abstract": "Crystal symmetry governs macroscopic physical properties and lattice dynamics in functional materials. We present a systematic application of tensor analysis and group theory to determine allowed physical-property tensors, vibrational-mode symmetries, and Raman selection rules directly from crystallographic point-group symmetry. The approach is applied to the prototypical ferroelectric PbZrxTi1-xO3 (PZT). Symmetry lowering across the PZT phase diagram increases the number of independent pyroelectric, dielectric, and piezoelectric tensor components and modifies the symmetry classification of Raman-active vibrations. These mode classifications enable symmetry-based decomposition of reported room-temperature powder Raman spectra as a function of composition (x) across the morphotropic phase boundary, revealing the tetragonal-to-rhombohedral transition as a continuous redistribution of spectral intensity rather than emergence of new Raman modes. Persistent subpeak structure in selected modes indicates local symmetry breaking due to cation disorder and lattice anharmonicity, underscoring the importance of crystallographic symmetry analysis for interpreting functional and vibrational properties of ferroelectric perovskite oxides.", "url": "https://arxiv.org/abs/2607.21682", "type": "理论+数值", "summary": "1. 该工作系统应用张量分析和群论，直接从点群对称性确定铁电钙钛矿氧化物的物理性质张量、振动模式对称性和拉曼选择定则，并应用于PbZrₓTi₁₋ₓO₃。\n2. 其物理卖点在于揭示准同型相界处的四方-菱方相变为光谱强度连续重分布而非新模式出现，且亚峰结构指示阳离子无序与晶格非谐性导致的局域对称性破缺。\n3. 这为利用对称性分析分解复杂氧化物光谱并理解其功能与振动性质提供了可推广的方法论启示。", "summary_source": "deepseek", "authors": [{"name": "Sumit Ranjan Maity"}, {"name": "Brajesh Tiwari"}], "featured_authors": [{"name": "Sumit Ranjan Maity"}, {"name": "Brajesh Tiwari"}], "author_count": 2}, {"id": "2607.21705", "category": "cond-mat", "title": "Counting Edge Modes with the Higher Berry Curvature: A Bulk Topological Order Parameter for Quantum Spin Chains", "abstract": "We show that the higher Berry curvature (HBC) can be used to count the gapless edge modes created by an entanglement cut, and thus defines an integer-valued topological order parameter for quantum spin chains. Given an individual spin-chain Hamiltonian, we construct an extending family by interpolating to a reference product Néel state, and show that the integral of the HBC over this extension is equal to the ordinary Berry phase of half of the chain swept out in response to an \\textit{infinitesimal} field. It thus counts the spin of the gapless edge modes exposed by the cut, and a change in its integer value signals a phase transition. We illustrate this with several examples: $S=1/2$, $S=1$, and $S=3/2$ spin-Peierls chains, which undergo `singlet flop' transitions between different patterns of dimerisation; the bilinear-biquadratic chain, which clarifies the connection to the strict symmetry-protected topological phases classification; and the staggered $J_1$--$J_2$ chain, which has both nearest-neighbour and third-neighbour patterns of singlets depending on the signs of the interactions.", "url": "https://arxiv.org/abs/2607.21705", "type": "理论", "summary": "1. 该工作提出通过高贝里曲率（HBC）积分定义整数值拓扑序参量，以计数量子自旋链纠缠切割产生的无间隙边缘模。\n2. 核心物理要点在于证明HBC在延拓族上的积分等于半链在无穷小场驱动下的普通贝里相位，从而直接给出边缘模的自旋数，其突变标志着相变。\n3. 这为利用几何相位探测体态拓扑结构提供了新方案，并揭示了HBC作为普适拓扑序参量在自旋链对称保护拓扑相分类中的潜力。", "summary_source": "deepseek", "authors": [{"name": "Adam J. McRoberts"}, {"name": "Joe Crossley"}, {"name": "Chris Hooley"}, {"name": "Joe H. Winter"}], "featured_authors": [{"name": "Adam J. McRoberts"}, {"name": "Joe Crossley"}, {"name": "Chris Hooley"}, {"name": "Joe H. Winter"}], "author_count": 4}, {"id": "2607.21708", "category": "cond-mat", "title": "Thermal avalanches in a quasiperiodic XXZ model", "abstract": "We study bath-induced thermalization in the many-body localized XXZ spin chain subjected to a quasiperiodic magnetic field. We engineer a thermal inclusion by setting the field strength in one part of the chain below the localization threshold and analyze thermalization via the avalanche mechanism. To study the nature of such avalanches, we use two complementary observables, namely the two-point connected correlation function and the particle-number entropy. Surprisingly, the correlations alone show no signatures of avalanches. Instead, they display a logarithmic growth of the correlation length throughout the dynamics and predict localization lengths of the local integrals of motion that remain well below the avalanche threshold. In contrast, the particle number entropy shows clear signatures of the thermal avalanche, with the avalanche front progressively propagating deeper into the localized subsystem for sufficiently large baths. The discrepancy between the two observables shows that two-point correlations are unreliable in identifying thermal avalanches in quasiperiodic systems, as opposed to the random case. On one hand, qualitative results are consistent with the analytical predictions of the standard avalanche theory. On the other hand, significant quantitative deviations persist, which could be due to short-range resonances generated by the quasiperiodic potential. Our results suggest that the standard avalanche framework requires revision to account for the short-range correlations of quasiperiodic potentials.", "url": "https://arxiv.org/abs/2607.21708", "type": "理论", "summary": "1. 该工作通过工程化热夹杂，研究了准周期XXZ自旋链中的热雪崩热化过程。\n2. 其关键发现是两点关联函数未显示雪崩迹象，而粒子数熵则清晰展示雪崩前沿传播，揭示关联函数在准周期系统中不可靠。\n3. 这暗示标准雪崩理论需修正以纳入准周期势的短程关联效应。", "summary_source": "deepseek", "authors": [{"name": "Paolo Molignini"}, {"name": "Antonio Štrkalj"}], "featured_authors": [{"name": "Paolo Molignini"}, {"name": "Antonio Štrkalj"}], "author_count": 2}, {"id": "2607.21726", "category": "cond-mat", "title": "Ionic Diffusion Properties of Rare-Earth High-Entropy Oxides from a Machine-Learned Interatomic Potential", "abstract": "Rare-earth high-entropy oxides (RE-HEOs) have emerged as a promising class of functional ceramics for solid-state electrochemical applications due to their chemical complexity, structural tunability, and potential for fast oxygen-ion transport. In this work, we investigate oxygen diffusion in ceria-based RE-HEOs of the form Ce$_x$(YLaPrSm)$_{1-x}$O$_{2-\\delta}$ using classical molecular dynamics simulations driven by the Crystal Hamiltonian Graph Neural Network (CHGNet) machine-learned interatomic potential. To improve predictive accuracy for lanthanide-containing systems, we benchmark three CHGNet variants, including a fine-tuned r$^2$SCAN-trained model, against targeted density functional theory (DFT) data that explicitly include f-valence electrons. Simulations across temperature, Ce content, oxygen vacancy concentration, and both fluorite and bixbyite structures reveal that oxygen transport in RE-HEOs is governed by the interplay of two factors: the concentration of mobile vacancies and the local cation environment through which they hop. At fixed composition, ionic conductivity exhibits a non-monotonic dependence on vacancy concentration, with optimal diffusion occurring at moderate vacancy levels and reduced mobility at higher concentrations. Increasing Ce content lowers migration activation energies and enhances diffusivity through low-barrier diffusion networks built from Ce-Ce and Ce-Y edges. Analysis of individual oxygen hopping events provides atomistic insight into how local chemical environments and short-range cation ordering govern transport in high-entropy oxides. Overall, this work demonstrates that machine-learned interatomic potentials can resolve composition-structure-transport relationships in chemically complex oxides, and identifies active pathways through which compositional tuning can enhance oxygen-ion conductivity in RE-HEO materials.", "url": "https://arxiv.org/abs/2607.21726", "type": "理论+数值", "summary": "1. 该工作采用基于CHGNet机器学习原子间势的分子动力学模拟，系统研究了铈基稀土高熵氧化物Ce_x(YLaPrSm)_{1-x}O_{2-δ}中的氧离子扩散行为。\n2. 通过微调r²SCAN训练模型提升对含f价电子镧系体系的预测精度，揭示了氧输运由移动空位浓度与局部阳离子环境共同主导，电导率随空位浓度非单调变化且Ce含量升高通过Ce-Ce/Ce-Y低势垒网络降低迁移激活能。\n3. 证明机器学习势可解析复杂氧化物的成分-结构-输运关系，为通过组分与空位工程优化稀土高熵氧化物的氧离子电导率提供了原子尺度机制与设计方向。", "summary_source": "deepseek", "authors": [{"name": "Mary Kathleen Caucci"}, {"name": "Billy E. Yang"}, {"name": "Saeed S.I. Almishal"}, {"name": "Jon-Paul Maria"}, {"name": "Susan B. Sinnott"}], "featured_authors": [{"name": "Mary Kathleen Caucci"}, {"name": "Billy E. Yang"}, {"name": "Saeed S.I. Almishal"}, {"name": "Jon-Paul Maria"}, {"name": "Susan B. Sinnott"}], "author_count": 5}, {"id": "2607.21801", "category": "cond-mat", "title": "Thermal phase slips in superconducting films near the critical current at arbitrary temperatures", "abstract": "We develop a theory of thermal phase slips in disordered superconducting films biased near the critical current $I_c(T)$. Generalizing recent results obtained close to $T_c$, we show that the optimal fluctuation governing the phase-slip barrier in two dimensions satisfies the exactly integrable Boussinesq equation for arbitrary temperatures $T<T_c$. Since both the transverse and longitudinal sizes of the optimal nucleus diverge as $I\\to I_c(T)$, the Usadel equation for quasiparticles in the presence of a slowly varying order parameter can be solved perturbatively using a gradient expansion. The resulting field theory for a complex order parameter is further reduced to the Boussinesq free energy for a single real field, with the coefficients expressed as Matsubara sums over the solutions of the uniform Usadel equation at $I_c(T)$. The activation barrier near $I_c$ has the asymptotic form $\\Delta F(T,I\\to I_c) = E(T) (1-I/I_c)^\\alpha$. We calculate $E(T)$ over the full temperature range for both two-dimensional films ($\\alpha=3/4$) and one-dimensional wires ($\\alpha=5/4$). For films, the theory is valid within a narrow $10\\%$ window below $I_c(T)$, where the saddle-point configuration remains vortex-free. For wires, $\\Delta F(T,I\\to I_c)$ provides a good approximation to the activation barrier for all temperatures and currents.", "url": "https://arxiv.org/abs/2607.21801", "type": "理论+数值", "summary": "1. 该工作发展了任意温度下无序超导薄膜近临界电流时的热相滑理论，将近期接近超导转变温度的结果推广至全温区。\n2. 其核心在于证明控制二维相滑势垒的最优涨落满足精确可积的Boussinesq方程，并通过梯度展开微扰求解Usadel方程，将复序参量场论约化为实场自由能。\n3. 这给出了二维薄膜和一维线中激活势垒对电流和温度的全温区标度行为，为理解低维超导体的相滑动力学与临界涨落提供了定量框架。", "summary_source": "deepseek", "authors": [{"name": "Ivan M. Artemov"}, {"name": "Mikhail A. Skvortsov"}], "featured_authors": [{"name": "Ivan M. Artemov"}, {"name": "Mikhail A. Skvortsov"}], "author_count": 2}, {"id": "2607.21849", "category": "cond-mat", "title": "Property-Guided Diffusion for Inverse Design of Crystalline Materials", "abstract": "Diffusion-based generative models with property guidance have emerged as a promising paradigm for inverse materials design by enabling the generation of crystalline materials with user-specified target properties. However, despite recent advances, the effectiveness of property guidance, its influence on crystallographic symmetry, and the physical viability of generated materials remain poorly understood. To address these questions, we develop a property-guided framework based on the lightweight diffusion model DiffCrysGen using parameter-efficient adapter fine-tuning and classifier-free guidance (CFG). The resulting framework enables efficient multi-property crystal generation while preserving the knowledge learned during unconditional pre-training. Using formation energy together with saturation magnetization and Vickers hardness as representative inverse-design tasks, we systematically investigate the influence of CFG across a broad range of guidance strengths. Increasing the guidance scale progressively steers the generated property distributions toward the prescribed targets while reducing the fraction of lowest-symmetry ($P1$) structures and increasing the proportion of higher-symmetry structures. To evaluate physical viability, generated structures are geometrically prescreened and subsequently validated using a machine-learning interatomic potential (MLIP)-based workflow comprising structural relaxation and thermodynamic, dynamical, and property-specific analyses. The framework identifies thermodynamically and dynamically stable magnetic and mechanically hard materials with overall success rates of 12.3\\% and 3.9\\%, respectively. These results establish property-guided DiffCrysGen as an efficient framework for inverse materials design while providing new insights into the role of classifier-free guidance in crystal generation.", "url": "https://arxiv.org/abs/2607.21849", "type": "理论+数值", "summary": "1. 该工作提出了基于轻量扩散模型DiffCrysGen与分类器无引导(CFG)的属性引导框架，采用参数高效适配器微调保持预训练知识，实现了从零生成具有指定形成能、饱和磁化强度及维氏硬度等多目标性质的晶体材料。\n2. 其技术卖点在于系统研究了CFG引导强度对生成性质分布、晶体对称性(P1相比例降低、高对称性结构增加)以及物理可行性的影响，并通过几何预筛选与机器学习原子间势(MLIP)工作流(含结构弛豫、热力学与动力学分析)验证了结构的稳定性与目标性能。\n3. 该框架在磁性材料与硬质材料逆向设计中分别以12.3%和3.9%的成功率识别出热力学与动力学稳定结构，为多目标晶体逆向设计提供了高效物理可靠途径，并揭示了CFG引导强度对晶体对称性的调控作用，对后续生成模型中的对称性控制研究具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Sourav Mal"}, {"name": "Subhankar Mishra"}, {"name": "Prasenjit Sen"}], "featured_authors": [{"name": "Sourav Mal"}, {"name": "Subhankar Mishra"}, {"name": "Prasenjit Sen"}], "author_count": 3}, {"id": "2607.21872", "category": "cond-mat", "title": "Crystallization of pristine cubic ice from liquid at ambient pressure", "abstract": "The phase diagram of frozen water is famously rich: to date, over twenty crystalline polymorphs have been identified. Of the low-pressure 'ice I' family, hexagonal (Ih) is the principal form on Earth, while cubic (Ic) is much more elusive. Fundamental questions remain open as to whether cubic ice Ic can form directly from the liquid state, its thermodynamic stability and natural occurrence. Here we show that pristine cubic ice Ic can be formed at atmospheric pressure simply by cooling an aqueous solution confined within mesoporous silica. Using primarily neutron scattering, we show unambiguously that under these conditions, cubic ice Ic forms reproducibly and is the only thermodynamically stable crystalline phase of water. The discovery that cubic ice Ic is directly accessible from the liquid state, and stable at atmospheric pressure, strongly suggests that this polymorph plays a much more significant role in natural and synthetic processes than previously thought.", "url": "https://arxiv.org/abs/2607.21872", "type": "数值", "summary": "1. 本工作在常压下通过介孔二氧化硅限域冷却水溶液，首次实现了纯立方冰Ic从液态的直接结晶。\n2. 中子散射实验明确证实该条件下立方冰Ic可重复形成，且是体系唯一热力学稳定的水结晶相。\n3. 这一发现表明立方冰Ic在自然与合成过程中的重要性远超先前认知，为冰相图及地外冰物理研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Chenwei Zheng"}, {"name": "Paul F. Henry"}, {"name": "Aasim I. Shaffi"}, {"name": "Sanghamitra Mukhopadhyay"}, {"name": "Miroslava Novoveska"}, {"name": "Milz L. Beaumont"}, {"name": "Yidan Wang"}, {"name": "Camilla Di Mino"}, {"name": "Tom F. Headen"}, {"name": "Marta Falkowska"}, {"name": "Christopher A. Howard"}, {"name": "Adam J. Clancy"}, {"name": "Christoph G. Salzmann"}, {"name": "Neal T. Skipper"}], "featured_authors": [{"name": "Chenwei Zheng"}, {"name": "Paul F. Henry"}, {"name": "Aasim I. Shaffi"}, {"name": "Adam J. Clancy"}, {"name": "Christoph G. Salzmann"}, {"name": "Neal T. Skipper"}], "author_count": 14}, {"id": "2607.21882", "category": "cond-mat", "title": "Orbital Embedding and the Physical Definition of Quantum Geometry", "abstract": "The Quantum Geometric Tensor, encompassing the quantum metric and Berry curvature, is a central concept in modern condensed matter physics. However, its standard calculation via $k$-derivatives of the Bloch projector conceals a fundamental ambiguity regarding the choice of unit-cell convention, specifically in the treatment of intra-cell orbital positions (i.e., with or without the orbital position $e^{ikx_\\alpha}$). We resolve this inconsistency by introducing a convention-independent physical QGT defined via a covariant derivative that explicitly incorporates the full position operator. We demonstrate that this formulation is uniquely mandated by the microscopic derivation of the physical current via the Peierls substitution. Notably, we uncover a leading-order failure in standard $k \\cdot p$ effective theories for systems with bond-ordered gaps, identifying a need for caution in their application. Finally, we propose geometric engineering as a new design paradigm, enabling the independent tuning of geometric responses without altering the energy dispersion.", "url": "https://arxiv.org/abs/2607.21882", "type": "理论+数值", "summary": "1. 该工作引入了一种与单位胞约定无关的物理量子几何张量定义，通过协变导数明确包含完整位置算符以消除模糊性。\n2. 其核心在于该定义由Peierls替换微观推导唯一要求，并揭示了标准k·p理论在键序能隙系统中的主要失效。\n3. 这为几何工程新范式奠定基础，使得在不改变能量色散条件下独立调控几何响应成为可能。", "summary_source": "deepseek", "authors": [{"name": "Chang-geun Oh"}, {"name": "Shuichi Murakami"}], "featured_authors": [{"name": "Chang-geun Oh"}, {"name": "Shuichi Murakami"}], "author_count": 2}, {"id": "2607.21930", "category": "cond-mat", "title": "Switchable Altermagnetism via Spin-Induced Improper Polarization", "abstract": "Enabling reversible spin-splitting switching in stray-field-free altermagnets is promising for spintronic applications, but currently limited to a narrow class of polar materials. We propose a broader approach based on spin-induced improper polarization in nonpolar dual-sublattice magnets. We demonstrate this mechanism in DyFeO3, where the product of nonpolar Fe and Dy spin modes transforms as an induced polar mode. Density functional theory shows that the relative Dy--Fe spin alignment selects the polarization, while the Fe sublattice controls nonrelativistic spin splitting, thus enabling reversible switching. These results establish spin-induced improper polarization as a route to switchable altermagnetism in nonpolar bulk systems.", "url": "https://arxiv.org/abs/2607.21930", "type": "理论+数值", "summary": "1. 该工作提出基于自旋诱导不适当极化策略，在非极性双亚格子磁体中实现可切换的交替磁性。\n2. 其核心在于利用Dy和Fe自旋模式乘积诱导极性模式，使Fe亚格子控制的自旋分裂与极化方向联动，实现可逆切换。\n3. 这为非极性块体材料中交替磁性的电控切换提供了普适路径，推动了无杂散场自旋电子学器件的发展。", "summary_source": "deepseek", "authors": [{"name": "Zhihao Dai"}, {"name": "Michele Reticcioli"}, {"name": "Wei Ren"}, {"name": "Hongjun Xiang"}, {"name": "Alessandro Stroppa"}], "featured_authors": [{"name": "Zhihao Dai"}, {"name": "Michele Reticcioli"}, {"name": "Wei Ren"}, {"name": "Hongjun Xiang"}, {"name": "Alessandro Stroppa"}], "author_count": 5}, {"id": "2607.22029", "category": "cond-mat", "title": "Structural stability, electronic structure, and magnetism of the $d^9$ double infinite-layer La$_3$Ni$_2$O$_5$F under chemical pressure and epitaxial strain", "abstract": "Nickelate materials exhibit rich electronic properties that can be engineered toward cuprate-like regimes through topotactic and mixed-anion chemistry. Using first-principles calculations, we investigate the newly synthesized double infinite-layer oxyfluoride La$_3$Ni$_2$O$_5$F and its evolution under chemical pressure and epitaxial strain. The calculated phonon spectrum confirms the dynamical stability of the reported double infinite-layer crystal structure. Further, we find a highly two-dimensional cuprate-like Fermi surface dominated by Ni-$d_{x^2-y^2}$ states, with a moderate rare-earth-derived self-doping yielding an effective $\\sim d^{1.2}_{x^2-y^2}$ filling. These electronic features remain remarkably robust under both chemical pressure and epitaxial strain. Spin-polarized calculations further reveal an extended manifold of nearly degenerate magnetic configurations with different in-plane and out-of-plane spin arrangements. Compressive strain further enhances this magnetic frustration while leaving the underlying electronic structure largely unchanged. Our results thus identify La$_3$Ni$_2$O$_5$F as a promising cuprate analogue and establish lattice engineering as an effective strategy for fine tuning its electronic and magnetic properties.", "url": "https://arxiv.org/abs/2607.22029", "type": "数值", "summary": "1. 该工作利用第一性原理计算，系统研究了d⁹双无限层氧氟化物La₃Ni₂O₅F在化学压力和外延应变下的结构稳定性、电子结构与磁性。\n2. 计算确认其声子谱动力学稳定，电子结构呈现由Ni-d_{x²-y²}态主导的类铜氧化物二维费米面，因稀土自掺杂获得有效~d^{1.2}填充，并对外界扰动保持鲁棒；磁基态包含近乎简并的多重构型，压缩应变增强磁阻挫而不改变电子结构。\n3. 这验证了La₃Ni₂O₅F作为铜氧化物类似物的潜力，并表明晶格工程可有效调控其电子及磁性质，为相关材料设计提供可行策略。", "summary_source": "deepseek", "authors": [{"name": "K. Madani"}, {"name": "Q. N. Meier"}, {"name": "A. Cano"}], "featured_authors": [{"name": "K. Madani"}, {"name": "Q. N. Meier"}, {"name": "A. Cano"}], "author_count": 3}, {"id": "2607.22047", "category": "cond-mat", "title": "Multiplicity of Stable Attractors in Disordered Neural Models", "abstract": "We show how large-deviation statistics allows one to obtain reliable estimates of the multiplicity of stable fixed-points in a model of neural ordinary differential equations previously employed in computational tasks. The result is obtained by developing a suitable perturbative method in the amplitude of the disorder. It turns out that for not-too-large coupling strengths there are no qualitative differences between the symmetric case, when the dynamics is a purely gradient evolution, and the asymmetric case, when limit cycles and chaos can, in principle, arise. The selection of this specific model is dictated by pedagogical reasons, but we are confident that the approach can be extended to other many-degree-of-freedom dynamical models characterized by different classes of random coupling matrices.", "url": "https://arxiv.org/abs/2607.22047", "type": "理论", "summary": "1. 该工作利用大偏差统计方法，对先前用于计算任务的神经常微分方程模型中稳定不动点的多重性给出了可靠估计。\n2. 其技术核心是发展了一种适配无序振幅的微扰方法，并发现对于弱耦合，对称纯梯度动力学与非对称（容许极限环与混沌）情形无定性差异。\n3. 这一方法有望推广至其他由不同类型随机耦合矩阵表征的多自由度动力学模型，为统计物理与计算神经科学的交叉研究提供新工具。", "summary_source": "deepseek", "authors": [{"name": "Raffaele Marino"}, {"name": "Roberto Livi"}, {"name": "Antonio Politi"}], "featured_authors": [{"name": "Raffaele Marino"}, {"name": "Roberto Livi"}, {"name": "Antonio Politi"}], "author_count": 3}, {"id": "2607.22090", "category": "cond-mat", "title": "Accelerating grain boundary modelling and simulation by automated pre-evaluation of the irreducible macroscopic representation", "abstract": "A major challenge in the modelling and simulation of grain boundaries (GBs) is the conflict between the system size and computation capability, which inherently restricts the computationally accessible boundary characters. We present an algorithm to find the irreducible macroscopic representation of any given coincident-site-lattice GB character in the cubic lattice, and thus determine the irreducible size of its supercell. The algorithm is compared with the conventional orthogonal supercell and a published calculation method to assess its merits in saving computational resources. This supercell size parameter can be used to predict which GB character is relatively special across the vast 5D space, as those GBs possess small structural units are likely to exhibit particular structure-property relationships that are worthy of attention. The prediction is confirmed by examining the energy and mobility trends of aluminum mixed GBs obtained from the atomistic simulations.", "url": "https://arxiv.org/abs/2607.22090", "type": "理论+数值", "summary": "1. 该工作提出一种自动算法，用于计算立方晶系中任意重合位点阵晶界特征的不可约宏观表示，并确定其超胞的最小不可约尺寸，以缓解系统尺寸与计算能力的矛盾。\n2. 该算法通过预评估超胞尺寸显著节省计算资源，并利用该尺寸参数预测五维空间中具有小结构单元的特殊晶界，这些晶界可能具有独特的能量与迁移率行为。\n3. 铝混合晶界的原子模拟验证了该预测，为高效筛选和设计特定性能的晶界提供了可扩展的理论指导，推动数据驱动的晶界工程研究。", "summary_source": "deepseek", "authors": [{"name": "Wei Wan"}], "featured_authors": [{"name": "Wei Wan"}], "author_count": 1}, {"id": "2607.22150", "category": "cond-mat", "title": "Fractional parametric resonance in spintronic diodes", "abstract": "Parametric pumping is a powerful tool for the excitation, amplification, and processing of oscillations and waves of different nature. In general, parametric resonance can occur when the pumping frequency $f_p$ and eigenfrequency of a linear mode (or wave) $f_0$ satisfy the relation $f_p$=2$f_0$/n (n=1,2,3,...). While such parametric resonance is well known in mechanical, superconductive, and quantum systems, in magnetic and spintronic systems only the lowest (n=1) parametric resonance at double the spin wave mode frequency $f_p$=2$f_0$ was thoroughly studied and explored. Here, using a theoretical analysis based on both micromagnetic simulations and an analytical model, we show the emergence of resonances at fractional frequencies $f_p$=2$f_0$/n (with n>10) in spintronic diodes driven by the simultaneous action of ac spin-transfer torque (STT, current densities < $10^6$ A/cm2) and voltage-controlled magnetic anisotropy (VCMA, effective anisotropy fields < 50 mT). The analytical model shows that parametric magnetization dynamics is irreducible to the standard Mathieu model of a parametric oscillator and demonstrates the crucial role of VCMA-driven mode frequency modulation: together with parametric coupling, it results in higher-order odd (n=3,5,7,...) fractional resonances, observed above certain VCMA pumping threshold, while simultaneous action with linear STT drive produces thresholdless even (n=4,6,8,...) resonances. This higher-order parametric dynamics is not restricted to VCMA pumping and opens new directions for the application of spintronic diodes for nonlinear signal processing and electromagnetic energy harvesting.", "url": "https://arxiv.org/abs/2607.22150", "type": "理论+数值", "summary": "1. 该工作通过微磁模拟与解析模型，理论揭示了自旋电子二极管中由交流自旋转移矩与电压控制磁各向异性联合驱动下产生的分数频率参量共振，阶数可达十阶以上。\n2. 其核心物理在于证明该参量磁化动力学不可简化为标准Mathieu模型，并阐明VCMA驱动的模式频率调制与参量耦合协同产生阈值依赖的奇数阶共振，而与线性STT驱动结合则产生无阈值的偶数阶共振。\n3. 该高阶分数参量共振不限于VCMA泵浦机制，为自旋电子二极管在非线性信号处理与电磁能量收集领域的应用提供了新的物理基础。", "summary_source": "deepseek", "authors": [{"name": "Andrea Grimaldi"}, {"name": "Denys Slobodianiuk"}, {"name": "Eleonora Raimondo"}, {"name": "Raghav Sharma"}, {"name": "Anna Giordano"}, {"name": "Mario Carpentieri"}, {"name": "Hyunsoo Yang"}, {"name": "Riccardo Tomasello"}, {"name": "Roman Verba"}, {"name": "Giovanni Finocchio"}], "featured_authors": [{"name": "Andrea Grimaldi"}, {"name": "Denys Slobodianiuk"}, {"name": "Eleonora Raimondo"}, {"name": "Riccardo Tomasello"}, {"name": "Roman Verba"}, {"name": "Giovanni Finocchio"}], "author_count": 10}, {"id": "2607.22158", "category": "cond-mat", "title": "Geometric Renormalization and a Chirality Threshold in Recursively Coiled Filaments", "abstract": "Repeated coiling creates a filament hierarchy. We formulate helicalization as an iterated map acting on an arbitrary rod compliance, rather than homogenizing one prescribed construction. A marginal Jordan mode yields an outer-radius inverse-square stiffness class, while pitch disorder creates a Lyapunov threshold between amplified and screened extension--twist response. An exact finite-level rate distinguishes representative amplified and screened cases by level three; direct three-dimensional beam calculations validate the response through level four and convergence through level five.", "url": "https://arxiv.org/abs/2607.22158", "type": "理论+数值", "summary": "1. 该工作将重复卷曲丝状层次结构建模为迭代映射，通过几何重整化研究杆柔度在螺旋化下的力学响应。\n2. 其卖点在于揭示边缘Jordan模导致外半径平方反比刚度类，且螺距无序产生Lyapunov阈值区分拉伸-扭转响应的放大与屏蔽。\n3. 这为生物丝状结构与人工螺旋材料的力学设计提供了精确的理论框架与数值验证途径。", "summary_source": "deepseek", "authors": [{"name": "Hiroyuki Shima"}], "featured_authors": [{"name": "Hiroyuki Shima"}], "author_count": 1}, {"id": "2607.22176", "category": "cond-mat", "title": "GHz non-reciprocal optical conductivity in hematite ($α$-$\\text{Fe}_2\\text{O}_3$)", "abstract": "We study the non-reciprocal properties of the iron oxide $\\alpha$-Fe$_2$O$_3$ (hematite) in the canted easy-plane antiferromagnetic phase, specifically in the GHz to THz frequency range. First, using the the microscopic spin Hamiltonian, we obtain the correct classical ground state where the canting is induced by the Dzyaloshinskii-Moriya interactions (DMI). The magnon spectrum is simulated using linear spin wave theory. We then compute the polarizability and the sub-gap optical conductivities using linear response. We find that the conductivity tensor contains frequency peaks at the zero momentum magnon gaps of order $0.1~$meV which can be tuned by the DMI and on-site anisotropic spin interactions. Furthermore, we show that the canting-induced net magnetic moment $\\mathbf{m}$ represents a measure for the effective time-reversal-symmetry breaking and non-reciprocity of the system: a finite $\\mathbf{m}$ results in a non-zero Hall conductivity. Finally, we discuss the prospective application of hematite in non-reciprocal circulator design, by computing the non-reciprocal circulator transmission amplitude using the conductivities as input.", "url": "https://arxiv.org/abs/2607.22176", "type": "理论", "summary": "1. 该工作利用微观自旋哈密顿量和线性响应理论，计算了赤铁矿倾斜易面反铁磁相中GHz至THz频段的非互易光学电导率。\n2. 其核心在于揭示了倾角诱导的净磁矩作为有效时间反演对称破缺度量，直接导致霍尔电导率，且磁振子隙峰由Dzyaloshinskii-Moriya相互作用和各项异性自旋相互作用调谐。\n3. 这为基于赤铁矿设计非互易环形器提供了电导率输入参数，并为通过净磁矩调控光学非互易性建立了通用物理框架。", "summary_source": "deepseek", "authors": [{"name": "Peng Rao"}, {"name": "Johannes Gröbmeyer"}, {"name": "P. Peter Stavropoulos"}, {"name": "Alexander Mook"}, {"name": "Matthias Althammer"}, {"name": "Hans Huebl"}, {"name": "Alexander Holleitner"}, {"name": "Johannes Knolle"}], "featured_authors": [{"name": "Peng Rao"}, {"name": "Johannes Gröbmeyer"}, {"name": "P. Peter Stavropoulos"}, {"name": "Hans Huebl"}, {"name": "Alexander Holleitner"}, {"name": "Johannes Knolle"}], "author_count": 8}, {"id": "2607.22222", "category": "cond-mat", "title": "Identifying the signatures of residual activity in harmonically bound active Brownian dynamics", "abstract": "A confined self-propelled particle exhibits a range of intriguing dynamical phenomena dictated by the interplay between the intrinsic activity of the particle and the imposed confinement. This competition manifests as a crossover in the steady-state position distribution of a harmonically bound active Brownian particle (HBABP) from Boltzmann-like to bimodal, commonly recognized as the passive and active regimes, respectively, upon variations in activity and confinement strength. We present a comprehensive analysis of the resultant dynamics of an HBABP employing analytical calculations and numerical simulations, examining the variations in the position distribution, residual or resultant velocity, mean square displacement, power spectral density, and effective harmonic confinement at varying activities in the characteristic regimes across the crossover. These analyses provide a reliable identification of the signature of residual or remnant activity in ABP dynamics after being impeded by the harmonic confinement. Our results show that the resultant HBABP dynamics in the regime with a Boltzmann-like position distribution is dominated by residual activity, and the motion in the other regime, with a bimodal position distribution, is similar to that of a harmonically bound Brownian particle--devoid of residual activity--at a displaced position, where the activity is balanced by the restoring force field.", "url": "https://arxiv.org/abs/2607.22222", "type": "理论+数值", "summary": "1. 该工作通过解析计算与数值模拟，系统分析了简谐束缚活性布朗粒子的位置分布、残余速度、均方位移及功率谱密度，以识别活性受束缚后的残余活动特征。\n2. 其核心在于揭示残余活性主导导致玻尔兹曼型分布，而活性被恢复力平衡时则产生类无活性粒子的位移双峰分布这一关键物理机制。\n3. 这为区分活性物质在不同束缚下的动力学行为提供了明确判据，并启发后续研究更复杂束缚场景中的残余活性效应。", "summary_source": "deepseek", "authors": [{"name": "Sanatan Halder"}, {"name": "Manas Khan"}], "featured_authors": [{"name": "Sanatan Halder"}, {"name": "Manas Khan"}], "author_count": 2}, {"id": "2607.22240", "category": "cond-mat", "title": "Fermions on a 1D lattice: localized sources and sinks with dephasing", "abstract": "We study a general one-dimensional spinless fermionic system subject to a localized source, sink, and bulk dephasing. Within the Lindblad framework, we compute the time evolution of the density profile and spatial correlation functions. We find that the presence of bulk dephasing suppresses certain coherent quantum features, such as the Friedel oscillations, and it alters the transport dynamics to exhibit two distinct dynamical regimes instead of three as observed in the absence of dephasing. This effect can be understood as the destruction of ballistic motion caused by the dephasing noise. Under strong dephasing, the density profile becomes similar to the one expected for a classical diffusive regime. We also investigate the system in the presence of both a localized source and sink, placed at a distance of $\\Delta$. Interestingly, quantum coherence generates secondary density peaks at integer multiples of the source-sink separation $\\Delta$, which are systematically washed out as bulk dephasing drives the system toward the classical diffusive limit.", "url": "https://arxiv.org/abs/2607.22240", "type": "理论", "summary": "1. 该工作利用Lindblad主方程框架，研究了存在局域源、漏和体退相干的一维无自旋费米子系统的非平衡密度分布与关联函数演化。\n2. 其物理卖点在于揭示了体退相干如何抑制Friedel振荡等量子相干特征，使输运动力学由三种分区简化为两种，并逐步抹平由量子相干产生的次级密度峰。\n3. 这为理解退相干噪声驱动系统从量子弹道输运向经典扩散极限过渡的机制提供了明确物理图像。", "summary_source": "deepseek", "authors": [{"name": "Elka Bhattacharya"}, {"name": "Sushant Saryal"}, {"name": "Soumya Ghosh"}, {"name": "Kabir Ramola"}], "featured_authors": [{"name": "Elka Bhattacharya"}, {"name": "Sushant Saryal"}, {"name": "Soumya Ghosh"}, {"name": "Kabir Ramola"}], "author_count": 4}, {"id": "2607.22261", "category": "cond-mat", "title": "Composition Anisotropy Drives Large Bulk Photovoltaic Fields Along the Non-polar Vertical Direction in 2D Hybrid Perovskite Ferroelectrics", "abstract": "The photovoltaic electric field of the bulk photovoltaic effect (BPE) reflects the intrinsic ability of ferroelectrics to separate photoexcited excitons into electrons and holes, and are essential parameters for applications such as voltage-readout photodetectors. Because polarization defines the cation-anion displacement and noncentrosymmetric axis, the polar direction is generally one of the orientations exhibiting strong bulk photovoltaic field (EBPE). Here, we report emergent BPE behavior in 2D hybrid perovskite ferroelectrics (HPFs), where EBPE can be two orders of magnitude higher along the vertical nonpolar direction than along the polar in-plane direction. Its magnitude is up to orders of magnitude higher than that of benchmark photoferroelectrics across different material systems and is the highest among 2D HPFs reported so far. This strong BPE response with emergent directional anisotropy originates from the unique coupling among the shift-current BPE mechanism, an efficient photocarrier-generating inorganic part, and an insulator-like organic part, a combination that is conflicting or inaccessible in traditional photoferroelectrics. This composition and anisotropy also produce basic BPE behavior distinct from that of typical photoferroelectrics, including a laser intensity dependent photovoltage and a nonlinear scaling of photovoltage with material dimension. We analyze and develop a series of formulas to describe the emergent photovoltage phenomena, which should be applicable to this novel 2D ferroelectrics family and to polar systems with similar anisotropy and robust photoelectric response.", "url": "https://arxiv.org/abs/2607.22261", "type": "理论", "summary": "1. 该工作报道二维杂化钙钛矿铁电体中沿非极性垂直方向出现比面内极性方向高两个数量级的巨大体光伏电场。\n2. 其技术核心在于利用成分各向异性实现无机层高效光生载流子与绝缘有机层的位移电流耦合，从而获得远超传统光铁电体的光伏场。\n3. 这为理解各向异性极性体系中激光强度依赖光电压及维度非线性标度行为提供了普适分析公式。", "summary_source": "deepseek", "authors": [{"name": "Yuzhong Hu"}, {"name": "Andrii Shcherbakov"}, {"name": "Jonathan Zerhoch"}, {"name": "Lars Schneider"}, {"name": "Shangpu Liu"}, {"name": "Xitao Liu"}, {"name": "Fangping Zhuo"}, {"name": "Lovro Fulanovic"}, {"name": "Felix Deschler"}, {"name": "Martijn Kemerink"}], "featured_authors": [{"name": "Yuzhong Hu"}, {"name": "Andrii Shcherbakov"}, {"name": "Jonathan Zerhoch"}, {"name": "Lovro Fulanovic"}, {"name": "Felix Deschler"}, {"name": "Martijn Kemerink"}], "author_count": 10}, {"id": "2607.22271", "category": "cond-mat", "title": "SAGE-Net: Semantics-Augmented Geometric Encoder for Material Property Prediction", "abstract": "Reliable structure-property modeling is crucial for accelerating materials discovery, where crystal graphs and structure-derived crystallographic descriptions provide complementary geometric and semantic information. Existing multimodal materials models primarily incorporate textual information through post-encoding fusion, latent-space alignment, or attention-based representation interaction mechanisms. However, in most cases, crystallographic semantics are introduced after structural encoding and therefore cannot directly guide the formation of atom-level crystal-graph representations. Here, we present Semantics-Augmented Geometric Encoder Network (SAGE-Net), a flexible multimodal framework that injects description-derived chemical and crystallographic semantics into geometric message passing. SAGE-Net introduces Semantic-Guided Message Passing (SGMP), which gates atom-level updates and enables crystallographic semantics to directly modulate local geometric interactions across multiple graph neural network (GNN) backbones. Across benchmarks covering bandgap, mechanical, transport-related properties, and synthesizability assessment, the SAGE-Net instantiated with different GNN backbones achieves the lowest MAE on eight out of ten JARVIS-DFT regression targets and delivers strong or highly competitive performance against both structure-based and multimodal baselines. For synthesizability assessment, the SAGE-Net demonstrate outstanding classification performance and high recall rates. Interpretability analysis unravels that SAGE-Net effectively captures physically interpretable crystallographic features, viz. space group, dimensionality, polyhedral environments, among others. Together, these results demonstrate SGMP-based SAGE-Net as a general and transferable framework for deeply integrated multimodal materials learning.", "url": "https://arxiv.org/abs/2607.22271", "type": "理论+数值", "summary": "1. 该工作提出了SAGE-Net，一种通过语义引导的消息传递（SGMP）将描述衍生的化学与晶体学语义直接注入几何消息传播的多模态材料性质预测框架。\n2. 其核心卖点是SGMP利用门控原子级更新使晶体学语义直接调制局部几何相互作用，并可灵活集成多种图神经网络骨干。\n3. 该框架在能隙、力学、输运等八个JARVIS-DFT回归目标上取得最低平均绝对误差，在合成性评估中实现高召回率与领先分类性能，并捕获空间群、维度、多面体环境等可解释特征，为深度集成多模态材料学习提供了通用且可迁移的范式。", "summary_source": "deepseek", "authors": [{"name": "Guanghui Zhang"}, {"name": "Yuxuan Yao"}, {"name": "Kieran B. Spooner"}, {"name": "Jun Yin"}, {"name": "Dan Han"}, {"name": "David O. Scanlon"}, {"name": "Lijun Zhang"}], "featured_authors": [{"name": "Guanghui Zhang"}, {"name": "Yuxuan Yao"}, {"name": "Kieran B. Spooner"}, {"name": "Dan Han"}, {"name": "David O. Scanlon"}, {"name": "Lijun Zhang"}], "author_count": 7}, {"id": "2607.22273", "category": "cond-mat", "title": "Unbiased Diffusion Monte Carlo for non local operators", "abstract": "We propose a new mathematically exact method for computing unbiased Diffusion Monte Carlo (DMC) estimates of non-local operators. We demonstrate that the current state-of- the-art technique, Forward Walking, is only exact for local quantities and fails to yield unbiased results for the non-local components of reduced density matrices (RDMs). Our method significantly outperforms Forward Walking, as shown in two systems: in the symmetric Hubbard dimer it yields a pure 1RDM; while in the Helium atom it will give an unbiased 1RDM in the limits of zero time step and infinite walkers.", "url": "https://arxiv.org/abs/2607.22273", "type": "数值", "summary": "1. 该工作提出了一种数学精确的无偏扩散蒙特卡洛方法，用于计算非局域算子估值。\n2. 其技术突破在于克服了传统Forward Walking对约化密度矩阵等非局域分量无法无偏的局限，在对称Hubbard二聚体中输出纯1RDM，在氦原子中于零时间步和无穷游走者极限下得到无偏1RDM。\n3. 这为强关联电子体系中非局域可观测量（如约化密度矩阵）的精确量子模拟提供了可靠方案，并建立了超越局部量模拟的基准。", "summary_source": "deepseek", "authors": [{"name": "Carlos Rodriguez Perez"}, {"name": "Valerio Olevano"}, {"name": "Francesco Sottile"}, {"name": "Vitaly Gorelov"}], "featured_authors": [{"name": "Carlos Rodriguez Perez"}, {"name": "Valerio Olevano"}, {"name": "Francesco Sottile"}, {"name": "Vitaly Gorelov"}], "author_count": 4}, {"id": "2607.22283", "category": "cond-mat", "title": "When Can a Cavity Move a Mott Transition? A Spectral-Density Criterion within Gutzwiller Theory", "abstract": "Can vacuum electromagnetic fluctuations shift a bulk Mott transition? Within the Gutzwiller variational method, we derive a criterion that separates collective spectroscopic hybridization from thermodynamic phase control. We show that a Mott transition shifts only when the electromagnetic environment supplies finite thermodynamic spectral weight with bond-scale variation. A joint frequency--spatial Pauli--Fierz density gives the leading shift. Surface phonon polaritons yield a $d^{-3}$-to-$d^{-5}$ crossover, while finite-coordination variational Monte Carlo supports the predicted critical coefficient and $M/N$ scaling.", "url": "https://arxiv.org/abs/2607.22283", "type": "理论+数值", "summary": "1. 该工作在Gutzwiller框架下推导出谱密度判据，用以判断腔电磁环境能否移动体Mott转变。\n2. 核心卖点是揭示Mott转变移动需电磁环境提供具有键尺度变化的有限热力学光谱权重，由联合频率-空间Pauli-Fierz密度主导。\n3. 该判据可指导腔量子材料中相变的调控，并通过有限配位变分蒙特卡洛验证了临界系数与M/N标度行为。", "summary_source": "deepseek", "authors": [{"name": "Nikhil Vamsodharakan Seshadri"}, {"name": "Yu Zhang"}], "featured_authors": [{"name": "Nikhil Vamsodharakan Seshadri"}, {"name": "Yu Zhang"}], "author_count": 2}, {"id": "2607.22288", "category": "cond-mat", "title": "Understanding interaction-driven transport in flux lattices with evolution-path symmetry", "abstract": "The destruction of Aharonov-Bohm (AB) caging by interaction and the emergence of interaction-induced chiral currents in flux lattices are two paradigmatic examples of interaction-driven quantum transport. While various mechanisms, such as bound-state formation and chiral spectral imbalance, have been proposed, a unifying physical picture remains elusive. Here, we employ the concept of \\textit{evolution-path symmetry} (EPS) and its interaction-induced breaking as a framework to understand interaction-induced delocalization in flux lattices. EPS is defined as the invariance of a path's contribution under combined geometric and phase transformations. We demonstrate that in a $\\pi$-flux rhombic lattice, interactions break the EPS present in the non-interacting limit by modifying the phase accumulation of many-body paths, thereby lifting the destructive interference responsible for AB caging. Furthermore, we apply this framework to explain interaction-induced chiral transport in flux ladders, where interactions break the phase relationship between symmetric paths, leading to a non-vanishing chiral current. Our work establishes EPS as a powerful tool for understanding transport phenomena beyond conventional eigenstate analysis.", "url": "https://arxiv.org/abs/2607.22288", "type": "理论", "summary": "1. 该工作提出演化路径对称性（EPS）及其相互作用诱导破缺的框架，统一理解通量晶格中由相互作用驱动的量子输运现象。\n2. 核心在于揭示相互作用通过修改多体路径相位积累，解除π-通量菱形晶格AB笼所需的相消干涉，并打破通量梯子中的对称路径相位关系以产生非零手性电流。\n3. 这为超越传统本征态分析的输运机制提供了直观诊断工具，可望推广至其他几何阻挫或拓扑系统中的相互作用效应研究。", "summary_source": "deepseek", "authors": [{"name": "Jian-Song Pan"}, {"name": "Xiaofan Zhou"}, {"name": "Wei Yi"}], "featured_authors": [{"name": "Jian-Song Pan"}, {"name": "Xiaofan Zhou"}, {"name": "Wei Yi"}], "author_count": 3}, {"id": "2607.22296", "category": "cond-mat", "title": "Unconventional $\\mathbb{Z}_2\\times\\mathbb{Z}_2\\times\\mathbb{Z}_2$ topological order in the kagome XY toric code", "abstract": "We investigate the quantum phase diagram of the XY toric code (XYTC) on the kagome lattice consisting of $XY$ hexagonal and triangular plaquette operators and conserved star operators. We demonstrate analytically by exploiting an exact local $\\mathbb{Z}_2$-symmetry on dodecagons that the kagome XYTC realizes a $\\mathbb{Z}_2\\times\\mathbb{Z}_2\\times\\mathbb{Z}_2$ topologically ordered phase in the limit of large hexagonal \\mbox{plaquette} operators. This unconventional topological phase involves 64 quasi-particles - Abelian anyons - with restricted mobility on three colored sublattices establishing a quantum dimension of eight. The large number of topological superselection sectors originates from six independent Wilson loop operators, acting as emergent one-form symmetries. The resulting anyon structure is richer than that of established topological codes like the toric and the color code. A corresponding CSS topological stabilizer code is formulated, opening novel possibilities for the encoding and manipulation of topological quantum information.", "url": "https://arxiv.org/abs/2607.22296", "type": "理论+数值", "summary": "1. 该工作通过十二边形上的精确局部Z2对称性，解析证明了kagome晶格XY Toric码在大六边形算符极限下实现非传统的Z2×Z2×Z2拓扑有序相。\n2. 其核心在于此拓扑相包含64种量子维度为八的阿贝尔任意子，任意子在三色子格上受限移动，并由六个独立Wilson环算符（一形式对称性）生成丰富拓扑扇区，结构复杂度超越toric码与色码。\n3. 由此构造的CSS拓扑稳定子码为拓扑量子信息的编码与高维任意子的容错操控提供了全新平台。", "summary_source": "deepseek", "authors": [{"name": "C. Kölbl"}, {"name": "M. Vieweg"}, {"name": "K.P. Schmidt"}], "featured_authors": [{"name": "C. Kölbl"}, {"name": "M. Vieweg"}, {"name": "K.P. Schmidt"}], "author_count": 3}, {"id": "2607.22364", "category": "cond-mat", "title": "Mechanisms of Microstructural Evolution and Degradation in Aluminum under High-Damage Irradiation", "abstract": "Aluminum alloys are widely used in research reactor systems, yet the mechanisms governing irradiation-induced degradation remain poorly understood. Here we combine conventional cascade-overlap molecular dynamics simulations with an accelerated Iterative Kinetic Approach (IKA) to investigate defect evolution in single-crystal Al subjected to 50 keV He irradiation. Benchmarking shows that IKA reproduces the essential defect kinetics of cascade simulations while enabling access to substantially higher accumulated damage. By extending the IKA to higher damage levels, we identified three distinct regimes governing radiation-induced degradation in Al: recombination-driven annihilation, defect accumulation, and sink-controlled absorption. At higher damage, Frank loops dissociate into Shockley partials and stair-rod loops, ultimately driving the nucleation and growth of stacking-fault tetrahedra (SFTs). These transformations progressively convert mobile defects into SFTs. Ultimately, the synergistic effect of interstitial and vacancy loops and SFTs increases irradiation hardening in Al at 300 K. This work provides insight into irradiation-induced degradation in aluminum reactor materials.", "url": "https://arxiv.org/abs/2607.22364", "type": "数值", "summary": "1. 该工作结合传统级联重叠分子动力学与加速迭代动力学方法，研究单晶铝在50 keV He辐照下缺陷演变的微观机制。\n2. 其卖点在于通过IKA实现高累积损伤模拟，识别出复合湮灭、缺陷积累与汇控制吸收三个退化阶段，并揭示弗兰克环分解驱动堆垛层错四面体成核生长。\n3. 这为理解铝基反应堆材料辐照硬化与退化机制提供了明确的物理图像与理论支撑。", "summary_source": "deepseek", "authors": [{"name": "Alhassan S. Issaka"}, {"name": "Sadie Wicks"}, {"name": "Vishal Yadav"}, {"name": "Assel Aitkaliyeva"}, {"name": "Michael R. Tonks"}, {"name": "Simon R. Phillpot"}], "featured_authors": [{"name": "Alhassan S. Issaka"}, {"name": "Sadie Wicks"}, {"name": "Vishal Yadav"}, {"name": "Assel Aitkaliyeva"}, {"name": "Michael R. Tonks"}, {"name": "Simon R. Phillpot"}], "author_count": 6}, {"id": "2607.22462", "category": "cond-mat", "title": "Pulsatile poromechanics in layered soft media controls fluid flow and solute transport: from fundamentals to brain clearance", "abstract": "Soft porous media often feature a heterogeneous structure. Notably, biological tissues - such as cartilage and the brain tissue - consist of two or more layers, with varying mechanical and fluid-flow properties. Despite the ubiquity of periodic loading in these systems, the physical implications of layering on nonlinear poromechanics and solute transport remain poorly understood. Uncovering these coupled mechanisms could clarify the fundamental physics behind pressing topics, such as brain metabolic clearance. Here, we address this gap using a bilayer model of a generic soft porous medium. To isolate the specific role of layering, we select combinations of material properties (porosity, permeability, and p-wave modulus) that maintain an identical poroelastic timescale, $T_{\\mathrm{PE}}$, across four layered configurations and a reference homogeneous case. We demonstrate that while $T_\\mathrm{PE}$ is the key parameter governing the response in a homogeneous medium, the same $T_\\mathrm{PE}$ leads to non-trivial localization/propagation patterns for strain, fluid flow and solute transport in a bilayer medium. These non-intuitive results suggest that layered architectures may provide functional benefits for cellular homeostasis over homogeneous ones. Finally, we show that pathological alterations to the brain's layered structure significantly disrupt fluid-flow and metabolic waste clearance, offering a possible mechanical explanation for impaired transport in disease.", "url": "https://arxiv.org/abs/2607.22462", "type": "理论", "summary": "1. 该工作建立了一个双层软多孔介质模型，研究脉冲加载下分层结构对孔隙力学与溶质输运的调控。\n2. 其核心发现是，即使保持孔隙弹性时间尺度一致，分层仍可产生与均匀介质迥异的应变、流体及溶质局域化与传播模式。\n3. 这提示分层构型可能为细胞稳态提供优势，并揭示脑组织病理改变引发清除障碍的力学机制。", "summary_source": "deepseek", "authors": [{"name": "Matilde Fiori"}, {"name": "Sylvie Lorthois"}], "featured_authors": [{"name": "Matilde Fiori"}, {"name": "Sylvie Lorthois"}], "author_count": 2}, {"id": "2607.22488", "category": "cond-mat", "title": "Exactness of Symmetry-Broken Self-Interaction Correction in the Strongly-Correlated or Classical Limit: Harmonium as a Demonstration", "abstract": "Strong electron correlation is an important challenge to both wavefunction and density functional theory. It has been argued that the Perdew-Zunger 1981 self-interaction correction to any density functional approximation, after symmetry breaking, can correctly describe the ground-state energy in the strongly-correlated limit in which each electron is described by a highly-localized and non-overlapped one-electron spin orbital. It has also been argued that the classical limit, in which Planck's constant tends to zero, is the strongly-correlated limit of quantum mechanics, where standard density functionals fail badly, as demonstrated by the exactly-solvable problem of harmonium (two Coulomb-interacting electrons bound by a spherically-symmetric harmonic-oscillator external potential). Here we combine these two ideas and demonstrate that, for harmonium, symmetry-broken self-interaction correction is exact in the limit where Planck's constant tends to zero, and usefully accurate for all values between 0 and the physical value (1 in atomic units). We also show that the Planck-constant-dependent symmetric ground-state density can be restored by spherical averaging of the broken-symmetry density.", "url": "https://arxiv.org/abs/2607.22488", "type": "理论+数值", "summary": "1. 该工作以双电子谐振子模型为平台，证明对称性破缺的自相互作用修正（SIC）在普朗克常数趋于零的经典极限下精确成立，并在该极限到物理值之间保持有效精度。\n2. 其核心物理卖点在于揭示了经典极限即为量子强关联极限，此时对称性破缺SIC能正确描述高度局域非重叠轨道下的基态能量，且对称性可通过球面平均恢复。\n3. 这为密度泛函理论在强关联体系中的应用提供了确凿修正路径，并启发将对称性破缺SIC推广至更一般多电子系统的经典或强关联极限研究。", "summary_source": "deepseek", "authors": [{"name": "Cody Woods"}, {"name": "Yunzhi Li"}, {"name": "Wenqing Yao"}, {"name": "Chen Li"}, {"name": "John Perdew"}], "featured_authors": [{"name": "Cody Woods"}, {"name": "Yunzhi Li"}, {"name": "Wenqing Yao"}, {"name": "Chen Li"}, {"name": "John Perdew"}], "author_count": 5}, {"id": "2607.22522", "category": "cond-mat", "title": "Exact Neural-Network Representations of the Motzkin States", "abstract": "Motzkin spin chains are paradigmatic frustration-free one-dimensional quantum systems whose ground states feature exactly solvable combinatorial structures and exotic, area-law-violating entanglement scaling. Specifically, colorless Motzkin states exhibit critical logarithmic entanglement divergence \\(\\log N\\) with system size \\(N\\), while their colorful counterparts host supercritical sublinear \\(\\sqrt{N}\\) entanglement growth. Such unconventional entanglement behaviors place these states well beyond the expressive capability of standard matrix product states, which are fundamentally constrained by the entanglement area law. Here, we systematically construct exact, training-free neural-network representations for both colorless and colorful Motzkin states across four mainstream architectures, including recurrent, feedforward, convolutional, and transformer networks. Our core design leverages a causal prefix-sum module, implementable via recurrent updates, feedforward mappings, or masked attention layers, combined with position-selective rectified linear gates that enforce the Motzkin height constraints. For the colorful states, we further introduce a dedicated causal stack module that explicitly encodes the last-in-first-out color-matching rule. Our results demonstrate that neural architectures can accurately capture highly non-trivial entanglement features inaccessible to conventional tensor networks, providing prototypic examples for benchmarking and a constructive design framework for future neural-network quantum state developments targeting strongly entangled quantum systems.", "url": "https://arxiv.org/abs/2607.22522", "type": "理论+数值", "summary": "1. 该工作为无色和彩色Motzkin态构建了精确、免训练的神经网络表示，覆盖循环、前馈、卷积及Transformer四种主流架构。\n2. 核心卖点在于利用因果前缀求和模块与位置选择ReLU门实现高度约束，并通过因果堆栈编码彩色态的后进先出颜色匹配规则。\n3. 该结果证明神经网络能精确捕捉超越标准张量网络能力的反常纠缠标度，为强纠缠量子系统的神经量子态设计提供了基准样例与构造框架。", "summary_source": "deepseek", "authors": [{"name": "Runde Zha"}, {"name": "Yuntian Gu"}, {"name": "Chaohui Fan"}, {"name": "Jia-lin Chen"}, {"name": "Hai-Jun Liao"}, {"name": "Tao Xiang"}], "featured_authors": [{"name": "Runde Zha"}, {"name": "Yuntian Gu"}, {"name": "Chaohui Fan"}, {"name": "Jia-lin Chen"}, {"name": "Hai-Jun Liao"}, {"name": "Tao Xiang"}], "author_count": 6}, {"id": "2607.22527", "category": "cond-mat", "title": "Effective field theories of nonlinear fluctuating hydrodynamics in one dimension", "abstract": "Describing emergent macroscopic phenomena in low spatial dimensions is known to be notoriously challenging, primarily due to strong interactions that render perturbative approaches inapplicable. On the other hand, low-dimensional systems host a wealth of unorthodox phenomena. A prominent example is the emergence of superdiffusive transport in one-dimensional interacting systems, traditionally studied in the framework of nonlinear fluctuating hydrodynamics. After identifying and discussing internal inconsistencies in the previous formulations, in this work we develop a general and systematic approach for constructing effective field theories of one-dimensional hydrodynamic systems in the form of coupled stochastic Langevin-type equations compatible with the physical requirements of local equilibrium states such as the thermodynamic Maxwell relation and fluctuation-dissipation symmetry. We implemented a general numerical integration scheme and exemplified our construction on a simple model of two interacting hydrodynamic modes with a non-Gaussian stationary equilibrium measure.", "url": "https://arxiv.org/abs/2607.22527", "type": "理论+数值", "summary": "1. 该工作发展了一类构建一维非线性涨落流体动力学有效场论的系统方法，形式为耦合随机Langevin方程。\n2. 主要卖点在于解决了先前公式中的内部不一致性，确保与局域平衡态的麦克斯韦关系和涨落耗散对称性严格相容。\n3. 这为统一描述一维相互作用系统中的超扩散输运等非正统宏观现象提供了可检验的理论框架与数值方案。", "summary_source": "deepseek", "authors": [{"name": "Matija Koterle"}, {"name": "Enej Ilievski"}], "featured_authors": [{"name": "Matija Koterle"}, {"name": "Enej Ilievski"}], "author_count": 2}, {"id": "2607.22528", "category": "cond-mat", "title": "Extreme First-Passage Time of Many Interacting Particles", "abstract": "Extreme first-passage events are broadly relevant to biological, chemical, and physical processes in which the first successful arrival determines the outcome. Existing theories are confined to noninteracting searchers. Interacting extreme-statistics problems are notoriously difficult because correlations destroy probability factorization. We establish a general framework for interacting extreme search. A no-go theorem shows that broad classes of bounded interactions cannot beat the $1/\\ln N$ extreme timescale of $N$ independent Brownian searchers, and complementary upper bounds prove that this scale is exact for broad classes of repulsive interactions. We then identify two sharp mechanisms beyond the logarithmic class and derive a unified interaction-driven acceleration limit. In particular, deterministic pairwise interaction can at most reduce the extreme search time to order $1/N$, while stochastic pairwise forcing attains $1/(N\\ln N)$. Our results separate acceleration due to statistical redundancy from that generated by coherent many-body transport or amplified fluctuations, deepening our understanding of interacting stochastic systems.", "url": "https://arxiv.org/abs/2607.22528", "type": "理论", "summary": "1. 该工作建立了相互作用多粒子极端首次通过时间的普适理论框架，并推导了统一的相互作用驱动加速极限。\n2. 其核心在于证明了有界排斥相互作用无法超越$1/\\ln N$的独立布朗搜索时间标度，且确定性成对作用和随机成对强迫分别将时间降至$1/N$和$1/(N\\ln N)$量级。\n3. 这为区分统计冗余与相干多体输运或涨落放大导致的极值加速机制提供了理论基石。", "summary_source": "deepseek", "authors": [{"name": "Ruicheng Bao"}], "featured_authors": [{"name": "Ruicheng Bao"}], "author_count": 1}, {"id": "2607.21621", "category": "hep-th", "title": "Macroscopic statistical field from the spectral function of vacuum fluctuations and its gravitational implications", "abstract": "This paper investigates the possibility that gravity emerges as a macroscopic statistical effect of energy--momentum tensor vacuum fluctuations in flat-spacetime quantum field theory. The spectral function of the energy--momentum tensor commutator serves as the fundamental object, circumventing the vacuum energy catastrophe that plagues induced-gravity approaches. Through momentum-space coarse-graining and the spectral representation, a macroscopic symmetric rank-2 tensor field is constructed at each coarse-graining scale. The coarse-graining scale is promoted from an external control parameter to a dynamical order parameter. Its Langevin dynamics is governed by two renormalization-group fixed points: an ultraviolet repellor at the Planck scale and an infrared attractor at the Hubble scale. The irreversibility of coarse-graining yields an effective temperature inversely proportional to the scale, and the fluctuation--dissipation theorem closes the micro--macro dynamics into a self-consistent loop. The condition for the macroscopic field to acquire a massless spin-2 propagator is the emergence of an isolated pole at zero momentum in the total spin-2 spectral density. This pole is absent in perturbation theory, but we argue that it can arise as a solution compatible with the energy--momentum tensor Ward identity under critical slowing-down of the coarse-graining flow. When the pole is present, Weinberg's low-energy theorem fixes the nonlinear self-coupling uniquely to the Einstein--Hilbert action. Newton's constant and the cosmological constant appear as emergent quantities, and the low-energy limit of the framework is consistent with standard general relativity. Whether the spectral pole actually exists is the central question on which the framework depends; it is in principle testable by lattice gauge theory or nonperturbative functional renormalization-group calculations.", "url": "https://arxiv.org/abs/2607.21621", "type": "理论", "summary": "1. 该工作探索引力作为平坦时空量子场论中能量动量张量真空涨落的宏观统计效应，基于谱函数避开真空能灾难，通过动量空间粗粒化与谱表示构造宏观张量场。\n2. 其核心在于粗粒化尺度从外部参数提升为动力学序参量，朗之万动力学由普朗克与哈勃尺度两个重整化群不动点控制，不可逆性产生有效温度，涨落-耗散定理实现微观-宏观自洽闭环，且宏观场获得无质量自旋2传播子的条件为自旋2总谱密度在零动量处的孤立极点。\n3. 该极点存在时温伯格低能定理唯一将非线性自耦合固定为爱因斯坦-希尔伯特作用量，牛顿常数与宇宙常数作为涌现量，极点的存在性原则上有待格点规范理论或非微扰泛函重整化群检验。", "summary_source": "deepseek", "authors": [{"name": "Jinku Guo"}], "featured_authors": [{"name": "Jinku Guo"}], "author_count": 1}, {"id": "2607.21700", "category": "hep-th", "title": "EFT (String) Tower Building", "abstract": "We develop a bottom-up framework to reconstruct the asymptotic spectrum of light towers in four-dimensional $\\mathcal{N}=1$ effective field theories directly from their Kähler potential. Our construction uses the Integral Scaling Relation, which relates the mass scales of towers becoming light at infinite distance to the tensions of EFT strings, together with the Emergent String Conjecture applied recursively upon decompactification. These conditions organize the tower scaling vectors into a lattice generated by the EFT-string vectors and select the globally consistent tower polytopes. When applied to Kähler potentials arising from string compactifications, our algorithm precisely reproduces the known arrangements of towers and duality frames. We then classify the admissible polytopes for asymptotic Kähler potentials $K\\sim-\\log P(s)$, with $P(s)$ a homogeneous polynomial of degree at most seven, and show that certain apparently consistent Kähler potentials are incompatible with the assumed quantum-gravity constraints. For general polynomials, additional restrictions arise from gluing the tower arrangements across different growth sectors. Remarkably, every tower polytope allowed by our reconstruction can be obtained as a concrete slice of the polytope associated with M-theory on a Joyce $G_2$-manifold. This provides evidence for a form of string universality in which EFT strings act as the fundamental building blocks of the UV tower structure in the EFT perturbative regimes.", "url": "https://arxiv.org/abs/2607.21700", "type": "理论", "summary": "1. 该工作从有效场论的Kähler势出发，发展了一个自底向上的框架用以重建四维N=1超对称理论中渐近光塔谱。\n2. 其核心卖点在于利用积分标度关系与递归应用的涌现弦猜想，将塔标度矢量组织为由EFT弦矢量生成的格点，并分类了多项式Kähler势对应的允许塔多面体。\n3. 分类结果暗示，所有允许的塔多面体均可作为M理论在Joyce G2流形上多面体的切片获得，为EFT弦作为紫外完备结构中基本建构单元的弦普遍性提供了证据。", "summary_source": "deepseek", "authors": [{"name": "Alessandra Grieco"}, {"name": "Ignacio Ruiz"}, {"name": "Irene Valenzuela"}], "featured_authors": [{"name": "Alessandra Grieco"}, {"name": "Ignacio Ruiz"}, {"name": "Irene Valenzuela"}], "author_count": 3}, {"id": "2607.21704", "category": "hep-th", "title": "AdS Black Holes Are Short-Lived inside the Spectral Form Factor", "abstract": "We analyze the contribution of AdS black hole saddles to the spectral form factor of $d$-dimensional CFTs with a gravity dual. At high temperatures, the analytically continued gravitational action of the large AdS black hole is expected to give a leading large-$N$ approximation to the 'slope' of the spectral form factor. When the CFT is put on a $(d-1)$-dimensional spatial sphere of radius $\\ell$, we show that such an evaluation implies unphysical behavior of $Z(\\beta +it)$ at large $t\\gg \\ell$ for $d\\equiv5 \\,({\\rm mod}\\; 4)$. A Picard--Lefschetz analysis of a minisuperspace approximation to $Z(\\beta+it) $ does reveal the required Stokes phenomena that restore consistency. It is found that for $d>3$, the large AdS black hole saddle loses dominance and subsequently disconnects from the relevant integration cycle at $t=O(\\beta)$. For $d=3$, dominance is lost at a time of order $\\beta$, while the Stokes disconnection takes place at $t=O(\\ell)$. After the large black hole saddle disconnects from the path-integral contour, the slope of the spectral form factor becomes dominated by the low-energy end of the spectrum.", "url": "https://arxiv.org/abs/2607.21704", "type": "理论", "summary": "1. 该工作通过Picard-Lefschetz分析揭示了AdS黑洞鞍点在谱形因子中丧失主导性的Stokes现象。\n2. 核心物理是对于d>3，大黑洞鞍点在t~O(β)从积分路径断开，谱形因子斜率转由低能端主导。\n3. 这为全息CFT中大黑洞半经典贡献的短寿命提供了严格论证，并启发对谱形因子斜坡的理解。", "summary_source": "deepseek", "authors": [{"name": "José L. F. Barbón"}, {"name": "Eduardo Velasco-Aja"}], "featured_authors": [{"name": "José L. F. Barbón"}, {"name": "Eduardo Velasco-Aja"}], "author_count": 2}, {"id": "2607.21734", "category": "hep-th", "title": "Page transition for the complexity of an evaporating black hole", "abstract": "Recent results demonstrate that there exists a sharp, Page-like transition for the complexity of subsystems of Haar-random states as their fractional subsystem size surpasses one half. They further demonstrate that this transition also occurs for the holographic complexity of boundary subregions of eternal AdS black holes, assuming the Complexity$=$Volume (CV) proposal for subregions. We interpret this transition as a crossover from spectrum-dominated to basis-dominated subsystem complexity, reflecting the breakdown of approximate thermality beyond half-system size. We then apply this reasoning to an evaporating AdS black hole coupled to a bath, modeled by a quantum circuit undergoing random evolution on an interior subsystem of diminishing size. Using the basis-spectrum decomposition of subsystem complexity, we argue for a similar Page-like transition in the radiation complexity. We then show, using CV for subregions, that the same transition appears in the holographic complexity of the radiation subsystem through the emergence of an island, whose volume gives the dominant contribution. We argue that the island volume contribution resolves an apparent complexity paradox analogous to the information paradox.", "url": "https://arxiv.org/abs/2607.21734", "type": "理论", "summary": "1. 该论文研究蒸发黑洞辐射子系统的复杂度，论证其存在类似Page转变的尖锐过渡。\n2. 技术进步在于利用基-谱分解与子区域复杂度=体积（CV）对偶，揭示岛屿体积主导辐射复杂度并解决相应悖论。\n3. 这为理解黑洞信息问题中复杂度与热化性质的关联提供了新视角，并可能推广至一般量子系统。", "summary_source": "deepseek", "authors": [{"name": "Violet Concepcion"}, {"name": "Yasunori Nomura"}, {"name": "Kyle Ritchie"}, {"name": "Samuel Weiss"}], "featured_authors": [{"name": "Violet Concepcion"}, {"name": "Yasunori Nomura"}, {"name": "Kyle Ritchie"}, {"name": "Samuel Weiss"}], "author_count": 4}, {"id": "2607.21879", "category": "hep-th", "title": "Momentum anisotropy from Resistive Magnetohydrodynamics", "abstract": "We derive relativistic resistive magnetohydrodynamics framework for a two-component ultrarelativistic plasma of massless, oppositely charged particles directly from the Boltzmann-Vlasov equation using the 14-moment approximation. The resulting second-order equations couple the net-charge diffusion current to the shear-stress tensor through the electric field, with all transport coefficients given in closed microscopic form. In the homogeneous limit, the charge-current dynamics is well described by relaxation-type Ohm's law for moderate field strengths, while large viscosity drives the system into an underdamped oscillatory regime absent from the standard Israel-Stewart formulation. Most strikingly, a purely electric field generates sizable momentum anisotropy even without any underlying flow gradient. Under Bjorken expansion this field-induced anisotropy persists but becomes subleading to the hydrodynamic expansion source.", "url": "https://arxiv.org/abs/2607.21879", "type": "理论", "summary": "1. 该工作从Boltzmann-Vlasov方程出发，利用14矩近似导出了适用于双组分超相对论性等离子体的相对论阻性磁流体力学方程组。\n2. 其核心在于方程组将净电荷扩散流与剪切应力张量通过电场耦合，在均匀极限下揭示了纯电场无需流场梯度即可产生可观测动量各向异性的物理机制。\n3. 这一电场诱导的各向异性源在Bjorken膨胀中虽次于流体力学膨胀源，但为研究重离子碰撞或天体等离子体中的非流体动力学动量各向异性提供了微观理论基础。", "summary_source": "deepseek", "authors": [{"name": "Khwahish Kushwah"}, {"name": "Gabriel S. Denicol"}], "featured_authors": [{"name": "Khwahish Kushwah"}, {"name": "Gabriel S. Denicol"}], "author_count": 2}, {"id": "2607.21994", "category": "hep-th", "title": "Linking defects via AdS/CFT holography", "abstract": "In this article, we discuss some supersymmetric probe D5 brane solutions embedded in a type 2b supergravity background solution obtained by deforming the global $AdS_5 \\times S^5$ spacetime. The D5 brane solution of interest has a non-compact worldvolume, and when it is coincidentally placed on top of its anti-$\\overline{\\text{D5}}$ solution, the combination is dual to a codimension-1 defect of the boundary $SYM$ theory. The dual defect becomes a topological symmetry defect of a $U(1)$ $0$-form global symmetry if we move the profile of the probe D5 more towards the boundary of the bulk spacetime, resulting in a U-shaped profile hanging from the boundary. We show how the hanging D5 brane can be used holographically to measure the $U(1)$ global symmetry charge of the heavy determinant operators in the SYM theory by moving them across dual giant graviton D3 branes in the bulk spacetime.", "url": "https://arxiv.org/abs/2607.21994", "type": "理论", "summary": "1. 该工作探讨了将超对称探针D5膜嵌入变形的AdS₅×S⁵背景中，通过其U形悬挂构型实现对边界SYM理论中余维1缺陷与U(1)整体对称性的全息描述。\n2. 其核心物理在于悬挂D5膜被视为U(1)0-形式整体对称性的拓扑对称缺陷，且通过将重行列式算符移过对偶巨引力子D3膜，实现了对该对称性电荷的全息测量。\n3. 这为在全息框架内利用探针膜构型连接不同缺陷并定量探测全局对称性荷提供了可操作的范例，可推广至其他超对称缺陷系统的研究。", "summary_source": "deepseek", "authors": [{"name": "Varun Gupta"}], "featured_authors": [{"name": "Varun Gupta"}], "author_count": 1}, {"id": "2607.22037", "category": "hep-th", "title": "LQC inverse volume corrections inflation driven by fractional power law potentials in light of ACT observations", "abstract": "Here, we investigate the observational viability of fractional power law inflationary potentials, $V(\\varphi) \\propto \\varphi^n$ ($n=$ 1/3, 2/5, 2/3), within the effective framework of Loop Quantum Cosmology (LQC) incorporating inverse volume corrections. By employing LQC modifications to the background dynamics and cosmological perturbation equations in the semi-classical regime, we analytically derive the scalar spectral index $n_{\\rm s}$ and the tensor-to-scalar ratio $r$. These theoretical predictions are confronted with the latest high precision joint observational constraints, including ACT DR6, Planck 2018, DESI BAO, and BICEP/Keck datasets (P-ACT-LB-BK18). While steeper classical power law models are in severe tension with modern data, our results demonstrate that the inclusion of LQC inverse volume effects induces a prominent negative shift in $n_{\\rm s}$. Consequently, for specific viable ranges of the quantum geometric parameters ($\\sigma$ and $\\delta$), the theoretical predictions are translated horizontally across the $r-n_{\\rm s}$ plane. This mechanism successfully steers classically disfavored models back into the tightly constrained 68\\% and 95\\% CLs, significantly improving their consistency with precision cosmological data.", "url": "https://arxiv.org/abs/2607.22037", "type": "理论", "summary": "1. 该工作系统研究了圈量子宇宙学逆体积修正下分数幂律暴胀势的观测可行性。\n2. 其核心发现是逆体积效应导致标量谱指数n_s显著负移，使理论预测在r-n_s平面上水平平移至联合观测数据的68%置信区间内。\n3. 这揭示了量子几何参数通过修正扰动方程路径从而拯救经典排除模型的具体机制，为精确宇宙学约束下的圈量子修正模型提供了明确检验窗口。", "summary_source": "deepseek", "authors": [{"name": "Farough Parvizi"}, {"name": "Kayoomars Karami"}], "featured_authors": [{"name": "Farough Parvizi"}, {"name": "Kayoomars Karami"}], "author_count": 2}, {"id": "2607.22354", "category": "hep-th", "title": "Conformal symmetry, SM and Gravity", "abstract": "This paper is a bottom up attempt to incorporate the standard model and general relativity in a unique quantum field theory. The tentative model presented here in particular is free of chiral gauge and gravitational anomalies that appear in the divergence of currents, and in the divergence and trace of the energy-momentum tensor when the SM matter couples to gravity. The fermion spectrum is composed of two multiplets, the SM (left) multiplet and a mirror copy (right) with opposite handedness. The right multiplet is interpreted as describing the dark matter world. The natural symmetry of the theory is enlarged to incorporate also Weyl invariance, by introducing one or more dilaton fields. After the cosmological and theoretical motivations, the necessary formalism is introduced for algebraic renormalization: gauge fixings, ghosts, propagators and vertices and their interplay in garanteeing the conditions for convergence of the subtracted amplitudes according to the BPHZL scheme, the Slavnov-Taylor identity and the relevant enlarged BRST symmetry. The corresponding (conformal) cohomology is analyzed and found to be trivial: there are no non-trivial even trace anomalies in theories with dilatons, but there are plenty of trivial ones, which require corresponding counterterms in the effective action. It is shown that such counterterms can play an important role in freeing the theory of unphysical particles.", "url": "https://arxiv.org/abs/2607.22354", "type": "理论", "summary": "1. 该工作自底向上构建了一个将标准模型与广义相对论纳入单一量子场论的方案，费米子谱包含SM左多重态及其手征相反的镜像右多重态（暗物质候选）。\n2. 技术核心是通过引入膨胀子将对称性扩大至Weyl不变性，证明共形上同调为平凡，并展示平凡迹反常所需的对消项可有效消除非物理粒子。\n3. 这一框架为在量子场论中同时处理手征反常、引力反常、暗物质与共形对称性提供了明确技术路径，启发后续对膨胀子动力学及唯象学的研究。", "summary_source": "deepseek", "authors": [{"name": "Loriano Bonora"}], "featured_authors": [{"name": "Loriano Bonora"}], "author_count": 1}, {"id": "2607.22382", "category": "hep-th", "title": "Spontaneous Scalarization of Brane Black Holes: Quantum-Enhanced Tachyonic Instabilities", "abstract": "We investigate the spontaneous scalarization of brane-localized charged black holes, focusing on the role of quantum-enhanced tachyonic instabilities. By solving the coupled bulk-brane equations numerically within the Einstein-DeTurck formulation, we construct fully backreacted static black hole solutions and map the system from the semi-classical limit to the strongly coupled quantum-dominated regime. We demonstrate that the holographic quantum effects, parameterized by $\\kappa$, significantly modify the background geometry. Stability analysis, conducted via both effective potential diagnostics and quasinormal mode calculations, confirms that this geometric deformation deepens the negative well of the effective potential, thereby triggering a tachyonic instability. Integrating these results, we establish the global phase diagram of spontaneous scalarization in the $T_h/\\mu-\\kappa$ parameter space. The results reveal that these quantum-enhanced instabilities promote scalarization by substantially raising the critical temperature, providing a clear quantitative signature of quantum effects on black hole hair formation.", "url": "https://arxiv.org/abs/2607.22382", "type": "理论", "summary": "1. 该工作通过数值求解爱因斯坦-德图尔克形式下的耦合膜体-膜方程，构建了完全反作用的膜局域带电黑洞解，并研究了从半经典到强耦合量子主导区域的自发标量化现象。\n2. 其核心卖点在于揭示全息量子效应（由参数κ表征）如何显著修改背景几何，加深有效势的负阱并触发缓子不稳定性，从而在T_h/μ-κ参数空间中建立了完整的相图。\n3. 这一结果证明量子增强的不稳定性通过大幅提高临界温度促进标量化，为量子效应在黑洞毛形成中的定量标志提供了明确启发，并扩展至全息对应与强耦合引力系统。", "summary_source": "deepseek", "authors": [{"name": "Yuxuan Liu"}, {"name": "Yi Ling"}, {"name": "Qian Chen"}], "featured_authors": [{"name": "Yuxuan Liu"}, {"name": "Yi Ling"}, {"name": "Qian Chen"}], "author_count": 3}, {"id": "2607.22442", "category": "hep-th", "title": "TransPlanckian Censorship on Dark Dimension Inflation", "abstract": "It was proposed that extra dimensions can acquire large size by higher dimensional inflation connecting two large hierarchies in particle physics and cosmology, namely the weakness of the actual gravitational force to the largeness of the observable Universe, in terms of one fundamental scale. This proposal is consistent with the observed approximate scale invariant power spectrum of primordial density perturbations only for one or two extra dimensions of around the micron size. While a cosmological history connecting the period of higher dimensional inflation to the beginning of the standard cosmology has recently been studied, we investigate here the TransPlanckian Censorship Conjecture in that context and show that it drastically constrains the parameter space of the model.", "url": "https://arxiv.org/abs/2607.22442", "type": "理论", "summary": "1. 该工作将TransPlanckian审查猜想应用于暗维度膨胀模型，系统约束了高维膨胀连接弱引力与宇宙大尺度的参数空间。\n2. 其关键物理卖点在于揭示TransPlanckian审查仅允许1至2个微米尺度额外维度，否则破坏观测的标度不变功率谱。\n3. 这为高维膨胀宇宙学与标准宇宙学衔接的历史提供了严格判据，并指明了额外维度数目与大小的具体可检验范围。", "summary_source": "deepseek", "authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Ignatios Antoniadis"}, {"name": "Jules Cunat"}], "featured_authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Ignatios Antoniadis"}, {"name": "Jules Cunat"}], "author_count": 3}, {"id": "2607.22451", "category": "hep-th", "title": "Entanglement in Presence of Topological Interfaces and Dualities", "abstract": "Entanglement through interfaces has attracted considerable attention in 2d conformal field theory (CFT). However, it is known that field-theoretic predictions based on the existing framework are in general incompatible with numerical results [1-4]. A new framework for entanglement through topological defects was recently proposed in [5]. It provides a general description of entanglement through topological defects and successfully reproduces the numerical results for the Ising model in all tested cases and regimes. The key insight is that the relevant quantum correlations are encoded in twisted states, allowing for the construction of the full reduced density matrix (RDM). In this work we pursue two objectives. First, we provide new examples by studying defects in the free boson CFT. Second, we extend the framework to topological interfaces connecting two, possibly distinct, CFTs. Of particular interest are interfaces relating dual theories. We show that the reduced density matrix for a duality interface is the projection of the vacuum reduced density matrix onto a single symmetry sector, closely paralleling the framework of symmetry resolution. Unlike symmetry resolution, however, the projection is imposed by the physical interface itself, demonstrating that duality interfaces reflect quantum correlations back into the entangling interval. We establish this mechanism for diagonal and non-diagonal rational CFTs as well as the free boson CFT. Relative entropy allows us to quantify the distinguishability of the duality interface RDM from the vacuum RDM.", "url": "https://arxiv.org/abs/2607.22451", "type": "理论", "summary": "1. 该工作将基于拓扑缺陷的纠缠框架推广至连接不同CFT的拓扑界面，并在自由玻色子CFT中提供新例证。\n2. 其核心发现是对偶界面的约化密度矩阵等价于真空约化密度矩阵在单一对称性扇区上的投影，该投影由物理界面本身强加，反映了量子关联的回射机制。\n3. 这揭示了拓扑界面与对称性分辨之间的内在联系，为理解对偶理论中的纠缠结构和相对熵计算提供了统一视角。", "summary_source": "deepseek", "authors": [{"name": "Christian Northe"}, {"name": "Riccardo Poletti"}, {"name": "Paolo Rossi"}], "featured_authors": [{"name": "Christian Northe"}, {"name": "Riccardo Poletti"}, {"name": "Paolo Rossi"}], "author_count": 3}, {"id": "2607.22497", "category": "hep-th", "title": "Dilatonic states, phase transitions, and criticality in holography", "abstract": "The dilaton is the hypothetical scalar particle associated with spontaneous breaking of approximate scale invariance. It has been predicted to arise dynamically, as a bound state, in special extensions of the standard model of particle physics based on composite dynamics. In confining gauge theories, generic arguments suggest that the scale of explicit symmetry breaking coincides with the
