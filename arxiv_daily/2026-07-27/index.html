 confinement scale, that governs also its spontaneous breaking, by setting the size of all the condensates, as well as the masses of bound states and their excitations. Whether a light dilaton can nevertheless exist in such a context is an open question in quantum field theory, answering which has potentially transformative implications from a conceptual viewpoint, besides having striking phenomenological ramifications. It has been suggested that the mass of the dilaton might be suppressed, in respect to the confinement scale, in the special case in which the underlying strongly coupled dynamics undergoes a zero-temperature (weak) phase transition. Identifying the special conditions under which this happens is the subject of ongoing investigations. A dedicated programme of exploration, carried out within the context of gauge-gravity dualities (holography), has been set up to test the viability of this mechanism. We review the relevant technology within holography, and the status of such a programme, by comparing results obtained in a survey of explicit examples. We do so both within the bottom-up, simplified version of gauge-gravity dualities, but also within the more refined, and complete, top-down approach to holography, in which the gravity theory is known to have a more fundamental origin. We highlight the first examples of confining theories in which a parametrically light holographic dilaton forms as a bound state in a region of parameter space in proximity to a critical point of the field theory.", "url": "https://arxiv.org/abs/2607.22497", "type": "理论", "summary": "1. 该论文系统回顾了在全息对偶框架下对膨胀子态、相变与临界现象的研究进展，通过自下而上与自上而下的模型对比，展示了禁闭规范理论中参量化轻膨胀子束缚态形成的首个范例。\n2. 其核心技术卖点在于利用全息方法揭示了膨胀子质量被参量抑制的机制，当参数空间接近零温临界点时，膨胀子作为束缚态出现且质量远低于禁闭标度。\n3. 该工作为回答轻膨胀子存在性的开放问题提供了非微扰全息证据，并对复合希格斯等超越标准模型现象的唯象研究具有重要启示。", "summary_source": "deepseek", "authors": [{"name": "Daniel Elander"}, {"name": "Maurizio Piai"}], "featured_authors": [{"name": "Daniel Elander"}, {"name": "Maurizio Piai"}], "author_count": 2}, {"id": "2607.22501", "category": "hep-th", "title": "One-loop effective potential in Kalb-Ramond scalar electrodynamics", "abstract": "In this work, we study the effective potential at one loop for the Kalb-Ramond scalar electrodynamics. The model is based on a complex scalar field coupled to the electromagnetic field as usual, and also to the Kalb-Ramond field through the dual vector associated with the strength tensor of the $2$-form gauge field. There is an additional topological coupling of the electromagnetic field and the Kalb-Ramond field. The quantum corrections generated by the Kalb-Ramond sector are computed using dimensional regularization, and the ultraviolet divergences are removed by introducing the appropriate counterterms, leading to a finite renormalized effective potential. We show that the additional tensor interaction induces characteristic modifications to the vacuum structure while preserving perturbative consistency within the regime of validity of the effective theory.", "url": "https://arxiv.org/abs/2607.22501", "type": "理论", "summary": "1. 该工作在Kalb-Ramond标量电动力学中计算了单圈有效势，涉及复标量场与电磁场及Kalb-Ramond张量场的耦合。\n2. 其核心在于通过维数正规化处理张量相互作用导致的紫外发散，并证明额外拓扑耦合在不破坏微扰一致性的前提下，特征性地修正了真空结构。\n3. 这为高阶规范场与物质场耦合的高阶量子修正研究提供了可重正化框架，并启发对类似张量场论中真空相变的探索。", "summary_source": "deepseek", "authors": [{"name": "Pratik Chattopadhyay"}, {"name": "M. J. Neves"}], "featured_authors": [{"name": "Pratik Chattopadhyay"}, {"name": "M. J. Neves"}], "author_count": 2}, {"id": "2607.22519", "category": "hep-th", "title": "Integral Scaling for EFT Strings from the Bottom-Up", "abstract": "Near the core of an EFT string in a 4d $\\mathcal{N}=1$ theory, the scalars are dynamically driven to infinite field distance and a tower of states becomes light, with mass scaling with the string tension in Planck units as $m^2\\sim \\mathcal{T}^{\\,w}$. According to the Integral Scaling Conjecture, $w$ takes only values 1, 2 and 3. In this paper, we examine how this conjecture can follow from the brane-taxonomy rules associated with the Emergent String Conjecture. In this context, we classify the relevant types of duality frames into 74 classes, identify which lattice sites can be relevant EFT candidates, and exhaustively test integral scaling for all of these candidates. We find that it holds with $w\\leq 3$ for all the leading towers and also for the subleading towers below the species scale (up to half-integral subtleties that also appear in top-down examples). We further find evidence that the oscillator modes of EFT string candidates generate the lattices of particles and strings. Moreover, $w=1$ implies a perturbative string limit, but the converse is not true. We compare our classification with concrete type IIA, F-theory and M-theory compactifications.", "url": "https://arxiv.org/abs/2607.22519", "type": "理论", "summary": "1. 该工作依据膜—分类学规则和涌现弦猜想，从底向上将四维N=1超对称EFT弦的对偶框架划分为74类，并系统检验了积分标度猜想。\n2. 其技术要点在于证明所有主导与次主导塔（低于物种标度）均满足w≤3，且w=1对应于微扰弦极限而逆命题不成立，同时发现振荡模可用于生成粒子与弦的晶格。\n3. 这为弦理论中EFT描述的紧致化模型提供了分类约束，并可与IIA、F理论和M理论的具体紧致化实例进行直接比较。", "summary_source": "deepseek", "authors": [{"name": "Muldrow Etheredge"}, {"name": "Alvaro Herráez"}, {"name": "Dieter Lüst"}, {"name": "Luca Melotti"}], "featured_authors": [{"name": "Muldrow Etheredge"}, {"name": "Alvaro Herráez"}, {"name": "Dieter Lüst"}, {"name": "Luca Melotti"}], "author_count": 4}, {"id": "2607.21639", "category": "math-ph", "title": "Probability, Curvature and Spectrum on Graphs", "abstract": "We show that, for a metric graph equipped with the Laplacian operator $\\Delta=-\\frac{d^2}{dx^2}$, the graph trace formula admits a new interpretation in terms of quantum probability and curvature. Our approach is based on a notion of graph curvature inspired by Wilson-lines and holonomy, together with von-Neumann's ergodic theorem.", "url": "https://arxiv.org/abs/2607.21639", "type": "理论", "summary": "1. 该工作对带有拉普拉斯算子的度量图，从量子概率与曲率角度重新诠释了图迹公式。\n2. 其卖点在于引入基于Wilson线与完整性的图曲率概念，并融合冯·诺依曼遍历定理作为技术核心。\n3. 这为图谱理论、量子图模型及曲率-概率对应关系的研究开辟了新方向。", "summary_source": "deepseek", "authors": [{"name": "Tianhong Zhao"}], "featured_authors": [{"name": "Tianhong Zhao"}], "author_count": 1}, {"id": "2607.21750", "category": "math-ph", "title": "Nonlinear Schrödinger equation on a closed 3D elastica knot", "abstract": "An elastica knot is defined in terms of the Frenet-Serret curvature $\\kappa(s,t)$ as a function of the arclength $s$ along the spatial curve ${\\bf r}(s,t)$ at a fixed time $t$, which is a solution of the curvature differential equation $\\partial^{2}_{s}\\kappa(s,t) = -\\;\\kappa^{3}/2 + k_{0}^{4}\\tau_{0}^{2}\\;\\kappa^{-3} + \\lambda\\,k_{0}^{2}\\kappa/2$ that is obtained from a variational principle that minimizes the bending energy of the spatial curve under the constraint of a constant curve length. Here, the Frenet-Serret torsion $\\tau(s,t)$ satisfies the conservation law $\\kappa^{2}(s,t)\\,\\tau(s,t) \\equiv k_{0}^{2}\\,\\tau_{0}$, while $\\lambda$ is a constant of integration. After briefly reviewing the Hasimoto transformation from a space curve ${\\bf r}(s,t)$ to the nonlinear Schrödinger equation (NLSE) $-\\,iD^{-1}\\partial_{t}\\psi = \\partial^{2}_{s}\\psi + \\frac{1}{2}\\,|\\psi|^{2}\\psi$, where the constant $D$ has units of fluid circulation (m$^{2}$/sec), we show how the traveling-wave solution $\\psi(s,t) = \\Psi(s_{t} \\equiv s - c\\,t) \\equiv \\kappa(s_{t})\\;\\exp[i\\theta(s_{t})]$ is mapped onto the curvature equation for an elastica knot, with $\\theta^{\\prime}(s_{t}) \\equiv c/(2D) + k_{0}^{2}\\tau_{0}/\\kappa^{2}(s_{t})$ and the elastica-knot constant $k_{0}^{2}\\lambda = -\\frac{1}{2}\\,(c/D)^{2}$ expressed in terms of the traveling-wave NLSE parameters $(c,D)$. The constraint of a closed 3D elastica knot imposes spatial periodicity conditions that introduce a unique set of knot parameters for which the NLSE traveling wave can exist. The present work shows that the traveling-wave solution on a closed elastica knot requires an extension of the classical elastica-knot parameter space.", "url": "https://arxiv.org/abs/2607.21750", "type": "理论", "summary": "1. 该工作通过Hasimoto变换将非线性薛定谔方程的行波解映射到封闭三维弹性结的曲率方程，并给出了映射参数之间的定量关系。\n2. 其关键物理在于揭示了弹性结常数由行波参数c/D唯一确定，且封闭结的空间周期性条件要求扩展经典弹性结的参数空间。\n3. 这为封闭弹性结上非线性行波的存在性建立了精确数学条件，并为相关曲线型非线性系统提供了理论桥接。", "summary_source": "deepseek", "authors": [{"name": "Alain J. Brizard"}], "featured_authors": [{"name": "Alain J. Brizard"}], "author_count": 1}, {"id": "2607.22021", "category": "math-ph", "title": "Classification of Six-dimensional Real Nilpotent Lie Bialgebras of Symplectic Type and their Poisson-Lie Groups", "abstract": "In this paper, we classify all six-dimensional real nilpotent Lie bialgebras of symplectic type. The Poisson structures on all of the related six-dimensional Poisson-Lie groups are obtained. Some new integrable Hamiltonian systems for which the Poisson-Lie group plays the role of a phase space and its dual Lie group plays the role of a symmetry group of the system are obtained.", "url": "https://arxiv.org/abs/2607.22021", "type": "理论", "summary": "1. 该工作完成了所有六维实幂零辛型李双代数的完全分类。\n2. 其卖点在于得到了所有相关泊松-李群的泊松结构，并揭示其对偶群可作为对称群生成新的可积哈密顿系统。\n3. 这为利用泊松-李群几何构造非平凡可积系统提供了完整的分类基础。", "summary_source": "deepseek", "authors": [{"name": "A.Poursistani"}, {"name": "Gh. Haghighatdoost"}, {"name": "J. Abedi-Fardad"}], "featured_authors": [{"name": "A.Poursistani"}, {"name": "Gh. Haghighatdoost"}, {"name": "J. Abedi-Fardad"}], "author_count": 3}, {"id": "2607.22084", "category": "math-ph", "title": "Lifts of partial cohomological field theories and examples of bi-Hamiltonian structures in the non-semisimple case", "abstract": "We define the lift of a partial cohomological field theory with respect to a Frobenius algebra and the corresponding lift of local polyvector fields, extending the lift procedure proposed by Della Vedova, Lorenzoni, and Savoldi. This allows us to systematically produce examples of non-semisimple homogeneous partial cohomological field theories whose integrable systems possess a second Hamiltonian structure, thus confirming the conjecture of Buryak et al. on an explicit formula for the second Poisson bracket in new non-semisimple cases. Moreover we present some relations of these lift constructions with the Morimoto theory of the lift of geometric structures to the Weil bundle of infinitely near points associated to a local algebra.", "url": "https://arxiv.org/abs/2607.22084", "type": "理论", "summary": "1. 该工作定义了基于Frobenius代数的偏上同调场论的提升与局部多向量场的相应提升。\n2. 其核心在于系统性地构造非半单齐次偏上同调场论示例，使其可积系统具有第二个哈密顿结构，验证了Buryak等人的显式第二泊松括号猜想。\n3. 这些提升构造与Morimoto关于局部代数关联的无穷近点Weil丛上几何结构提升理论建立了联系。", "summary_source": "deepseek", "authors": [{"name": "Guido Carlet"}, {"name": "Dimitrios Makris"}, {"name": "Sergey Shadrin"}], "featured_authors": [{"name": "Guido Carlet"}, {"name": "Dimitrios Makris"}, {"name": "Sergey Shadrin"}], "author_count": 3}, {"id": "2607.22378", "category": "math-ph", "title": "Self-adjoint extensions of $k$-photon light-matter Hamiltonians", "abstract": "Multiphoton light-matter interactions, in which a bosonic mode exchanges $k$ excitations at a time with a quantum system, are a source of genuine nonlinearity in quantum optics and are increasingly accessible experimentally. Here we study the class of operators $H = H_{\\rm mat}\\otimes I + I\\otimes\\omega a^\\ast a + \\Sigma\\otimes(a^\\ast)^k + \\Sigma^\\ast\\otimes a^k$ on $\\mathcal{H}\\otimes L^2(\\mathbb{R})$, coupling a single bosonic mode to an arbitrary matter system through a bounded operator $\\Sigma$. When $\\Sigma$ is normal and nonzero, we prove that $H$ is self-adjoint if and only if $k\\leq2$; for $k\\geq3$ we compute the deficiency indices, parametrise all self-adjoint extensions, and show that every extension has purely discrete spectrum whenever the matter system is finite-dimensional. Our analysis rests on a block Jacobi decomposition paired with a suitable unitary transformation depending on the polar decomposition of $\\Sigma$. The normality of $\\Sigma$ is optimal: a $k$-photon Jaynes-Cummings model, with non-normal coupling, remains self-adjoint for every $k$. We illustrate our results on the $k$-photon Rabi and Dicke models.", "url": "https://arxiv.org/abs/2607.22378", "type": "理论", "summary": "1. 该工作严格分类了k光子光物质哈密顿量的自伴扩展，模型涵盖玻色模通过正规耦合算子与任意有限维物质系统交换k个激发的普遍形式。\n2. 主要技术亮点在于利用块Jacobi分解和极分解诱导的酉变换，证明当Σ正规非零时哈密顿量仅当k≤2自伴，对k≥3完全参数化所有自伴扩展并证明其谱纯离散。\n3. 该结果的最优性由k光子Jaynes-Cummings模型证实，为多光子Rabi和Dicke模型提供了严格数学基础，并启发了对非正规耦合系统自伴性质的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Felix Fischer"}, {"name": "Felix Knapp"}, {"name": "Daniel Burgarth"}, {"name": "Davide Lonigro"}], "featured_authors": [{"name": "Felix Fischer"}, {"name": "Felix Knapp"}, {"name": "Daniel Burgarth"}, {"name": "Davide Lonigro"}], "author_count": 4}, {"id": "2607.22472", "category": "math-ph", "title": "Essential self-adjointness of semi-bounded operators", "abstract": "A semi-bounded operator that is bounded below by one is essentially self-adjoint if the kernel of the adjoint is trivial. This is the case if the kernel of the adjoint belongs to the form domain of the Friedrichs extension. We describe a local version of this criterion, where locality is defined in terms of bounded operators approaching the identity. The result is an abstract operator theoretic framework that generalizes the method by Wienholtz and Simader developed in the context of semi-bounded elliptic partial differential operators. As applications, we obtain competitive results on essential self-adjointness of many-particle Schrödinger operators, pseudo-relativistic Hamiltonians, and the standard model of non-relativistic quantum electrodynamics.", "url": "https://arxiv.org/abs/2607.22472", "type": "理论", "summary": "1. 该工作建立一个抽象算子理论框架，用于判定半有界算子的本质自伴性。\n2. 核心卖点是引入局部化准则，通过逼近恒等算子的有界算子定义局部性，并推广Wienholtz-Simader方法。\n3. 这为多粒子薛定谔算子、伪相对论哈密顿量及非相对论量子电动力学的本质自伴性提供统一证明框架。", "summary_source": "deepseek", "authors": [{"name": "M. Griesemer"}, {"name": "V. Kußmaul"}], "featured_authors": [{"name": "M. Griesemer"}, {"name": "V. Kußmaul"}], "author_count": 2}, {"id": "2607.21666", "category": "quant-ph", "title": "Quantum Correlations in Frustrated Three-Body Systems", "abstract": "Many physical systems are not understood from first principles due to the presence of multi-body quantum correlations. The effort taken to simulate such systems on classical computers increases exponentially with increase in the system size. We study simple, yet non-trivial, three-body frustrated systems that can help in understanding the underlying quantum correlations. First we investigate the ground state of helium-like atoms using the variational method and physically meaningful ansatze, revealing how quantum entanglement arises due to frustration in the system. Next we consider another frustrated three-body system, the hydrogen molecular ion, and analytically demonstrate the nature of its wavefunction arising from the quantum tunneling phenomenon. Finally, we extend these results to model yet another physically important system, the hydrogen bond.", "url": "https://arxiv.org/abs/2607.21666", "type": "理论+数值", "summary": "1. 该工作通过变分法和解析方法研究了类氦原子、氢分子离子及氢键三类受抑三体系统中的量子关联。\n2. 其核心在于揭示量子纠缠源于受抑系统的基态特性，以及量子隧穿决定氢分子离子波函数的关键物理机制。\n3. 这为从第一性原理理解多体量子关联并降低经典模拟复杂度提供了明确的理论模型与可推广的解析途径。", "summary_source": "deepseek", "authors": [{"name": "Chaitali Shah"}, {"name": "Apoorva D. Patel"}], "featured_authors": [{"name": "Chaitali Shah"}, {"name": "Apoorva D. Patel"}], "author_count": 2}, {"id": "2607.21697", "category": "quant-ph", "title": "Non-Clifford quantum cellular automata from invertible topological quantum field theories", "abstract": "Quantum cellular automata (QCAs) describe locality-preserving quantum dynamics and connect quantum information, many-body physics, and topological quantum field theory (TQFT). Constructing a QCA from a TQFT, however, is challenging. Although a topological action can produce a commuting Hamiltonian realizing the desired ground state, it does not by itself specify an automorphism of the full local operator algebra. In this work, we develop a unified algebraic construction that extends the commuting generators of the Hamiltonian to a complete separator-flipper algebra on the full tensor-product Hilbert space, providing a microscopic definition of the corresponding QCA. In three spatial dimensions, our formalism unifies all previously known QCA constructions associated with the $\\mathbb Z_8\\times\\mathbb Z_2$ subgroup of the Witt group, including the $U(1)_2$ and $U(1)_4$ QCAs. The same algebraic structure directly yields new infinite families of generalized $U(1)_2$ and $U(1)_4$ non-Clifford QCAs in dimensions $d=4k-1$. We also reformulate the 4-dimensional $w_2w_3$ QCA and use it to develop a general construction of QCAs from TQFTs associated with arbitrary products of Wu classes. This construction includes two infinite families. The first consists of $w_2^nw_3^m$ QCAs in dimension $d=2n+3m-1$, while the second consists of $w_2w_{4k-1}$ QCAs in dimension $d=4k$. As a contrasting result, we explicitly construct finite-depth quantum circuits for the 5-dimensional $w_3^2$ and $w_2^3$ QCAs, thereby proving that they are trivial, in agreement with the cobordism classification. Overall, these results convert invertible TQFTs into microscopic QCAs, provide a scalable route to higher-dimensional constructions beyond the Clifford setting, and open a systematic approach to classifying their stable structures and boundary anomalies.", "url": "https://arxiv.org/abs/2607.21697", "type": "理论", "summary": "1. 该工作发展了一个统一代数构造，将从可逆拓扑量子场论得到的局域哈密顿量扩展为完整张量积希尔伯特空间上的分离子-翻转子代数，从而微规定义了对应的量子元胞自动机。\n2. 其卖点在于统一了与Witt群ℤ₈×ℤ₂子群相关的已知QCA，并直接导出d=4k-1维中新的非Clifford无穷家族，以及基于Wu类乘积的一般构造，包含w₂ⁿw₃ᵐ型和w₂w₄ₖ₋₁型。\n3. 这为可逆TQFT转化为微观QCA提供了系统性途径，为超越Clifford设置的高维构造和QCA稳定结构与边界反常的分类开辟了方向。", "summary_source": "deepseek", "authors": [{"name": "Meng Sun"}, {"name": "Zongyuan Wang"}, {"name": "Bowen Yang"}, {"name": "Nathanan Tantivasadakarn"}, {"name": "Yu-An Chen"}], "featured_authors": [{"name": "Meng Sun"}, {"name": "Zongyuan Wang"}, {"name": "Bowen Yang"}, {"name": "Nathanan Tantivasadakarn"}, {"name": "Yu-An Chen"}], "author_count": 5}, {"id": "2607.21698", "category": "quant-ph", "title": "Non-Invertible Symmetries Mixing with Witt Non-Trivial Quantum Cellular Automata", "abstract": "Self-dualities and the stacking of symmetry-protected topological (SPT) phases are basic operations on quantum many-body systems. For a $\\mathbb{Z}_p$ one-form symmetry in 3+1d these correspond to the Kramers-Wannier-Wegner duality $S$, which is the gauging operation underlying non-invertible duality symmetries, and the stacking of a 1-form symmetry SPT $T$. In the continuum, they form a central extension of $PSL(2,\\mathbb{Z}_4)$ for $p=2$, and of $SL(2,\\mathbb{Z}_p)$ for odd primes $p$, whose central elements are invertible theories with purely gravitational response. These central extensions are governed by a twisted, graded generalization of the Witt group of abelian anyon theories, which we determine. For $p=2$ the resulting group is the single-qubit Clifford group, with duality and entangler acting as the Hadamard and phase gates. We realize this entire structure microscopically as quantum cellular automata (QCA) acting on a certain local operator algebra associated with a spin lattice Hilbert space on a cubic lattice. Specifically, our local operator algebra is built by starting with all local operators commuting with a $\\mathbb{Z}_p$ 1-form symmetry, and taking the quotient by all the (local) 1-form symmetry generators. The central elements can always be extended to the full tensor product algebra with a uniquely defined QCA class. For $p=2$ they are generated by the non-trivial semion QCA, and for odd prime $p$ they are generated by the non-trivial $\\mathbb{Z}_p$ Clifford QCA. Consequently the lattice fusion rules reproduce the continuum ones only up to these QCAs and lattice translations, giving rise to fusion rules refined by QCAs.", "url": "https://arxiv.org/abs/2607.21698", "type": "理论", "summary": "1. 该工作将3+1维中\\(\\mathbb{Z}_p\\) 1-形式对称性的Kramers-Wannier-Wegner对偶与对称保护拓扑相堆叠实现为晶格上非可逆对称性与量子元胞自动机的混合结构。\n2. 其核心在于利用局域算子代数的商构造和唯一确定的量子元胞自动机扩展，将连续统中由扭曲Witt群描述的中心扩张映射到晶格，使融合规则被非平凡semion或Clifford量子元胞自动机精化。\n3. 这为在晶格模型中严格研究非可逆对称性的代数性质以及推动其在拓扑量子计算中的应用提供了系统框架。", "summary_source": "deepseek", "authors": [{"name": "Kansei Inamura"}, {"name": "Oskar Wojdel"}, {"name": "Lukasz Fidkowski"}, {"name": "Sakura Schafer-Nameki"}], "featured_authors": [{"name": "Kansei Inamura"}, {"name": "Oskar Wojdel"}, {"name": "Lukasz Fidkowski"}, {"name": "Sakura Schafer-Nameki"}], "author_count": 4}, {"id": "2607.21703", "category": "quant-ph", "title": "Frame-Dependent Traces and the Third-Particle Paradox", "abstract": "The Paradox of the Third Particle arises when comparing subsystem descriptions across Quantum Reference Frame (QRF) perspectives. We isolate two distinct origins of the Paradox: the QRF covariance of the partial trace and the failure of the physical Hilbert space to inherit the kinematical tensor-product structure. We give an explicit counterexample to the Relational Trace (RT) resolution: an uncorrelated product state for which the RT statistical condition trivialises. We then introduce a new statistical consistency condition comparing subsystem discarding between external and internal QRFs, together with an associated frame-dependent map, the Perspective Relational Trace (PRT). We argue that our condition captures the operational content of the Paradox: rather than imposing consistency on the whole state space, we characterise exactly the states on which it holds in the Perspective-Neutral (PN) and Quantum-Information (QI) approaches. This separates three levels of description: a PN subsystem of a PN whole, where consistency fails on a characterised set that includes product states; a QI subsystem of a QI whole, where it holds for all states; and a QI subsystem obtained from a PN whole by kinematical partial trace, where the full weakly invariant algebra is recovered, yet consistency holds only on a proper subset. These results show that the PN approach can consistently describe only a closed, isolated system, while the QI approach can accommodate arbitrary subsystems. Tracing out a subsystem from a globally PN state yields a charge-superselected algebra, reproducing in a minimal QRF model the boundary-charge structure of edge modes. We understand the Paradox not as a genuine contradiction, but as the consequence of comparing inequivalent physical layers without tracking which information is externally and which internally accessible.", "url": "https://arxiv.org/abs/2607.21703", "type": "理论", "summary": "1. 该工作通过区分部分迹的量子参考系协变性与物理希尔伯特空间缺少运动学张量积结构两种起源，解析了第三方悖论。\n2. 其核心在于提出视角关系迹(PRT)作为新的统计一致性条件，并证明在视角中性(PN)方法中产品态违反该条件，而量子信息(QI)方法对所有态均适用。\n3. 这揭示了悖论本质上源于比较不同物理信息层级，并为电荷超选择代数与边界荷结构的最小量子参考系模型提供启发。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Palumbo"}, {"name": "Luca Apadula"}], "featured_authors": [{"name": "Alessandro Palumbo"}, {"name": "Luca Apadula"}], "author_count": 2}, {"id": "2607.21706", "category": "quant-ph", "title": "Mixed-state topological order and error-correction thresholds in non-Abelian codes: rigorous results", "abstract": "We present a versatile and mathematically rigorous technique for bounding recovery thresholds in topological codes subject to noise. Our method captures the effect of applying an arbitrary (possibly non-Pauli) local noise channel to the code state of a broad class of two-dimensional codes, including surface codes, non-Abelian quantum doubles, and string-net codes. In each case, we prove that for noise strengths up to some explicit constant value, any initially encoded logical information can be recovered to high precision, and that the noise-corrupted state exhibits key hallmarks of mixed-state topological order: long-range entanglement and emergent higher-form symmetries. We also describe how these methods can be adapted to higher dimensions and correlated noise models.", "url": "https://arxiv.org/abs/2607.21706", "type": "理论", "summary": "1. 该工作针对表面码、非阿贝尔量子双体码及弦网码等一大类二维拓扑码，在任意局域非泡利噪声信道作用下，建立了纠错恢复阈值的严格解析方法。\n2. 其核心结果包括：证明存在一个与系统大小无关的显式常数噪声强度，只要噪声强度低于该常数，初始编码逻辑信息就可以高保真度恢复，并且噪声态呈现出长程纠缠与涌现高阶形式对称性这两个混合态拓扑序的明确标志。\n3. 这些方法还可推广至更高维度以及关联噪声模型，从而为理解拓扑码的噪声鲁棒性以及混合态拓扑序在有限噪声下的存续提供了严格的理论框架和定量基准。", "summary_source": "deepseek", "authors": [{"name": "Sun Woo P. Kim"}, {"name": "Max McGinley"}], "featured_authors": [{"name": "Sun Woo P. Kim"}, {"name": "Max McGinley"}], "author_count": 2}, {"id": "2607.21798", "category": "quant-ph", "title": "Spectral Gap of the Davies Generator for the Mean-Field Heisenberg Model", "abstract": "The mean-field Heisenberg ferromagnet is a quantum spin model on the complete graph with isotropic spin-1/2 interactions. This non-commuting Hamiltonian is permutation and $\\mathsf{SU}(2)$ invariant, and its Gibbs states undergo an $\\mathsf{SU}(2)$ symmetry breaking phase transition at inverse temperature $\\beta=2$. We consider the associated Davies generator, a canonical model of open-system thermalization, and prove tight asymptotic estimates for its spectral gap at all noncritical temperatures. For fixed $\\beta<2$, the gap as a function of number of qubits $n$ is $\\Theta(1)$, while for fixed $\\beta>2$ the gap is $\\Theta(n^{-1})$. The matching upper bound of the spectral gap is witnessed by the total magnetization order parameter, suggesting that the low-temperature ($\\beta>2$) slowdown is associated with broken continuous symmetry. Two key ingredients in our approach are a comparison argument, which introduces auxiliary generators to bound dissipation on nontrivial representations of the symmetry groups $\\mathsf{SU}(2)$ and $\\mathsf{S}_n$, and a decomposition of the space of observables into spherical tensor operators to reveal a form of monotonicity.", "url": "https://arxiv.org/abs/2607.21798", "type": "理论", "summary": "1. 该工作针对平均场海森堡铁磁体的Davies生成元，在所有非临界温度下严格证明了其谱隙的渐近紧界：高温(β<2)为Θ(1)，低温(β>2)为Θ(n⁻¹)。\n2. 通过比较论证引入辅助生成元约束SU(2)与置换群非平凡表示上的耗散，并借助球张量算子分解揭示单调性，确认总磁化序参数刻画谱隙上界，从而将低温慢化归因于连续对称性破缺。\n3. 这一方法为开放量子系统中连续对称性破缺诱导的热化动力学慢化提供了严谨的分析框架，并可推广至其他具有类似对称性的多体热化问题。", "summary_source": "deepseek", "authors": [{"name": "Joao Basso"}, {"name": "Thiago Bergamaschi"}, {"name": "Lin Lin"}, {"name": "Michael Ragone"}, {"name": "Kevin D. Stubbs"}], "featured_authors": [{"name": "Joao Basso"}, {"name": "Thiago Bergamaschi"}, {"name": "Lin Lin"}, {"name": "Michael Ragone"}, {"name": "Kevin D. Stubbs"}], "author_count": 5}, {"id": "2607.21811", "category": "quant-ph", "title": "Efficient Unclonable Encryption from Pauli Eigenstates", "abstract": "We give, to our knowledge, the first plain-model, one-time information-theoretically secure, efficient unclonable encryption scheme for one classical bit. Previous work by Bhattacharyya and Culf (Nature Physics, 2026) and Bhattacharyya, Broadbent, and Culf either only showed $1/\\mathsf{poly}(\\lambda)$ security loss or required inefficient encryption/decryption operations. We avoid both of these caveats; in doing so, we obtain (to our knowledge) the first plain-model construction of many-time secure $1 \\to 2$ unclonable encryption for arbitrary polynomial-length messages, assuming the existence of pseudorandom function-like states (Bartusek and Goldin). The key is a uniformly random non-identity phase-free Pauli on $n$ qubits, and bit $a$ is encrypted as a random $(-1)^a$ eigenstate of that Pauli. The scheme is exponentially secure; we prove that the probability that both receivers recover the bit is at most $\\frac{1}{2}+\\frac{1}{2}\\sqrt{{2^n}/({4^n-1})} = \\frac{1}{2} + O\\left(2^{-n/2}\\right).$ By a lower bound due to Broadbent, Culf, and Rochette, this is the best probability bound achievable with $n$-qubit ciphertexts (up to the constant hidden in the $O(\\cdot)$). The main conceptual idea is to leverage, in a precise spectral sense, the balanced commutation-anticommutation structure of the Pauli group. The proof is intricate but completely elementary and makes use of standard spectral bound techniques. The main technical workhorse is a standalone linear-algebraic lemma that informally relates the positivity of two different operators, each capturing the intuition that if the two receivers can individually decrypt unusually often then they must also disagree often. GPT-5.6 Sol Ultra found this proof in an extended conversation with the author and drafted a preliminary version of this paper. The author is fully accountable for the correctness of this paper.", "url": "https://arxiv.org/abs/2607.21811", "type": "理论", "summary": "1. 该工作基于Pauli相位自由本征态，提出了首个plain-model下一次性信息论安全且高效的经典比特不可克隆加密方案。\n2. 核心卖点在于精确利用Pauli群平衡的对易-反对易谱结构，以n量子比特密文实现指数级安全界，且加密解密仅需随机选Pauli并制备本征态。\n3. 这为多消息安全、延长消息长度的不可克隆加密提供了可实现构造，并印证了Broadbent等人的密文长度下界的最优性。", "summary_source": "deepseek", "authors": [{"name": "Seyoon Ragavan"}], "featured_authors": [{"name": "Seyoon Ragavan"}], "author_count": 1}, {"id": "2607.21836", "category": "quant-ph", "title": "SSP-QST: Spectral Subspace Purification for Photonic Quantum State Tomography", "abstract": "Photonic quantum sensing often uses low-rank entangled probes such as Greenberger-Horne-Zeilinger (GHZ), Bell, and NOON states. Although these probes are ideally rank-1, practical quantum state tomography (QST) can produce density-matrix estimates with many small finite-shot and noise-induced eigenmodes. This eigenvalue contamination can increase the estimated entropy of the reconstruction and reduce the quantum Fisher information (QFI) available for downstream sensing, while fixed rank-1 purification can discard valid signal modes when real probes acquire additional signal modes. We introduce Spectral Subspace Purification for Quantum State Tomography (SSP-QST), a rank-adaptive post-processing layer for least-squares quantum state tomography (LS-QST). SSP-QST eigendecomposes the least-squares estimate, computes a Weyl-motivated noise floor from the measured spectrum and shot count, removes eigenmodes below this floor, and renormalises the retained subspace. It requires no rank prior, no iterative optimisation, and only one eigendecomposition. In Qiskit Aer simulations, SSP-QST achieves the highest fidelity among the tested non-iterative baselines across the evaluated probe ranks, with a maximum fidelity gain of $+0.584$. It also improves shot efficiency by at least $8\\times$ within the tested range. These results show that SSP-QST can make photonic QST more reliable under finite-shot noise while providing a lightweight reconstruction primitive for feedback-oriented quantum sensing pipelines.", "url": "https://arxiv.org/abs/2607.21836", "type": "数值", "summary": "1. 该工作提出一种谱子空间纯化方法（SSP-QST），作为最小二乘量子态层析的秩自适应后处理层。\n2. 其技术关键在于利用韦尔启发噪声基底从密度矩阵谱中自动移除噪声本征模，无需先验秩或迭代优化。\n3. 这为有限样本噪声下光学量子态层析提供了轻量级高保真重建工具，可提升量子传感反馈管线的样本效率。", "summary_source": "deepseek", "authors": [{"name": "Anuvab Sen"}, {"name": "Saibal Mukhopadhyay"}], "featured_authors": [{"name": "Anuvab Sen"}, {"name": "Saibal Mukhopadhyay"}], "author_count": 2}, {"id": "2607.21905", "category": "quant-ph", "title": "Quantum advantage of nonlinear quantum battery and superconducting circuit implementation", "abstract": "A quantum battery is a novel energy storage device that operates on the principles of quantum mechanics. To enhance the charging performance of quantum batteries and further provide theoretical support for their physical implementation, we constructed an optical-field-dependent nonlinear quantum battery model. Meanwhile, we solved for the unbiased form of nonlinear interactions in this model, where the charging power of the proposed model exhibits a superlinear quantum advantage, and the charging time saturates the quantum speed limit. Through theoretical analysis, we confirm that this quantum advantage arises from the quantum effect of multiphoton absorption. Subsequently, with the derived nonlinear function form, we further investigated other properties of this nonlinear quantum battery. Finally, an experimental design scheme for this nonlinear quantum battery in superconducting quantum circuits is presented.", "url": "https://arxiv.org/abs/2607.21905", "type": "实验", "summary": "1. 该工作构建了光场依赖的非线性量子电池模型，并严格求解了非线性相互作用的无偏形式，展示了充电功率的超线性量子优势及充电时间对量子速度极限的饱和。\n2. 其物理卖点在于将量子优势明确归因于多光子吸收过程，并进一步提出了在超导量子电路中实现该非线性电池的完整实验方案。\n3. 这为量子电池的物理实现提供了可检验的理论依据，并启发利用非线性量子效应设计超越经典极限的储能器件。", "summary_source": "deepseek", "authors": [{"name": "Wei-Jun Han"}, {"name": "Peng-Yu Sun"}, {"name": "Guo-Feng Zhang"}], "featured_authors": [{"name": "Wei-Jun Han"}, {"name": "Peng-Yu Sun"}, {"name": "Guo-Feng Zhang"}], "author_count": 3}, {"id": "2607.21907", "category": "quant-ph", "title": "Entanglement purification for arbitrary multipartite high-dimensional Greenberger-Horne-Zeilinger state", "abstract": "High-dimensional qudit (i.e., $d$-level or $d$-state) systems outperform two-dimensional qubit (i.e., 2-level or 2-state) systems in some quantum information processing tasks. We exploit entanglement purification protocols (EPPs) for extracting a subset of high quality arbitrary $d$-dimensional $n$-partite Greenberger-Horne-Zeilinger (GHZ) states from a large set of less entangled GHZ states. In our protocols, qudit-flip and phase-flip errors can be corrected, and the fidelity of the output state can be asymptotically improved to unity by iterating the EPP process. Moreover, the schemes are immune to the number of polluted photons, the fidelity thresholds of the proposed EPPs are developed, and the spatial-based single-qudit operations can be well manipulated with a range of balanced beam splitters, and phase shifters. These features make the proposed schemes offer an alternative method for high-dimensional multipartite entanglement purification.", "url": "https://arxiv.org/abs/2607.21907", "type": "理论", "summary": "1. 该工作提出适用于任意d维n部分高维Greenberger-Horne-Zeilinger态的纠缠纯化协议。\n2. 协议通过迭代操作同时纠正qudit翻转和相位翻转错误，使输出态保真度渐近趋于一，且对污染光子数不敏感。\n3. 基于平衡分束器和移相器的空间单qudit操控为高维多体纠缠纯化提供了可行替代方案。", "summary_source": "deepseek", "authors": [{"name": "Yu-Qing Kong"}, {"name": "Jia-Ye Liu"}, {"name": "Hui-Hui Kong"}, {"name": "Hai-Rui Wei"}], "featured_authors": [{"name": "Yu-Qing Kong"}, {"name": "Jia-Ye Liu"}, {"name": "Hui-Hui Kong"}, {"name": "Hai-Rui Wei"}], "author_count": 4}, {"id": "2607.21995", "category": "quant-ph", "title": "QC-PHAST Search: Classical--Quantum Query Benchmarks for Finite-Pool Rare-Regime Discovery", "abstract": "Rare-regime discovery in parameterized dynamical systems is an active-search problem: find one verified parameter at which a scientifically defined qualitative threshold is crossed, even when acceptable candidates are rare, nonconvex, or fragmented. We introduce Quantum-Classical Phase-space and Stability-Threshold Search (QC-PHAST), an evidence-gated decision protocol and query-accounting framework for finite candidate libraries. A candidate induces a dynamical object, simulator-derived criticality score, and verified first-hit predicate. Scientific metadata and charged pilot evidence are used to assess whether equation-aware search, scalar-score active search, predicate-only search, or only a query-model comparison is admissible. The quantum row is the inherited Grover/Boyer--Brassard--Hoyer--Tapp (BBHT) unknown-$M$ marked-set query reference; it is not a new quantum-search theorem, materialized circuit, or hardware-speedup claim. The result is a regime map. Direct boundary constructions, geometry controls, online simulator loops, and learned-label accounting further identify when classical structure, false positives, calibration cost, or state preparation erases the query-model margin. QC-PHAST is therefore an auditable protocol for deciding when a finite-pool marked-set reference is informative and when classical or resource-aware search should dominate.", "url": "https://arxiv.org/abs/2607.21995", "type": "理论", "summary": "1. 该工作提出了QC-PHAST协议，一个用于有限候选库中参数化动力系统罕见区域发现的经典-量子查询基准框架。\n2. 其技术卖点在于引入证据门控决策与查询记账机制，依据科学元数据及试点证据判定搜索模式的许可性，并刻画经典结构、假阳性、校准费用等因素对查询模型边际的消除条件。\n3. 该协议为量子搜索在有限池标记集问题中的适用性提供了可审计的判据，并指导在资源约束下经典或资源感知搜索应优先占主导的场景。", "summary_source": "deepseek", "authors": [{"name": "Harsh Milind Tirhekar"}, {"name": "Chandrajit Bajaj"}], "featured_authors": [{"name": "Harsh Milind Tirhekar"}, {"name": "Chandrajit Bajaj"}], "author_count": 2}, {"id": "2607.22052", "category": "quant-ph", "title": "Norm of resonance states in quantum scattering and electromagnetic systems", "abstract": "Resonance states spatially diverge and are thus not square integrable. Instead, their norm is defined by the biorthogonal scalar product of left and right states. We replace the corresponding volume integral by a convenient boundary integral in piecewise homogeneous systems and apply this procedure to diverse physical settings. For a quantum particle in any number of dimensions we treat hard-wall and piecewise constant potentials. For electromagnetic systems with piecewise homogeneous material properties, we consider three-dimensional and effectively two-dimensional cavities of arbitrary shape. As examples, we treat the spherical scatterer and the circular disk.", "url": "https://arxiv.org/abs/2607.22052", "type": "理论", "summary": "1. 该工作针对量子散射与电磁系统中共振态空间发散导致非平方可积的问题，提出用边界积分替代体积积分来定义其双正交范数。\n2. 其技术核心在于在分段均匀系统中将双正交标量积的体分转化为仅依赖于边界的面积分，并统一适用于任意维度量子势阱与任意形状电磁腔体。\n3. 这为处理开放系统中共振态的归一化与正交性提供了便捷解析工具，可推广至复杂几何与材料界面问题。", "summary_source": "deepseek", "authors": [{"name": "Florian Lorenz"}, {"name": "Jan Möseritz-Schmidt"}, {"name": "Roland Ketzmerick"}], "featured_authors": [{"name": "Florian Lorenz"}, {"name": "Jan Möseritz-Schmidt"}, {"name": "Roland Ketzmerick"}], "author_count": 3}, {"id": "2607.22088", "category": "quant-ph", "title": "Weak Permanent Anti-Concentration for Random Gaussian Matrices in Boson Sampling", "abstract": "Recent demonstrations of quantum computational advantage have been driven largely by sampling problems. A prominent model, boson sampling, involves sampling from the output distribution of a linear optical network. However, its classical hardness hinges on two plausible yet less-studied conjectures: the average-case hardness of approximating Gaussian permanents, and the permanent anti-concentration conjecture (PACC). The PACC is a purely mathematical assertion regarding the distributional properties of random Gaussian matrices. While the typical magnitude of the permanent has been established for discrete random matrices, the complex Gaussian case, which governs transition amplitudes in linear optical networks, has remained open. Here, we establish a weak anti-concentration bound by upper-bounding the probability that a random Gaussian permanent is superexponentially smaller than its standard deviation. Tightening this bound to an inverse-polynomial fraction would prove the original PACC. As a corollary, we establish the typical magnitude of Gaussian permanents, on par with Tao and Vu's seminal result for Bernoulli matrices. Combined with the Aaronson-Arkhipov framework, our result implies that classically simulating boson sampling to within a superexponentially small total variation distance would collapse the polynomial hierarchy, assuming the remaining conjectures hold.", "url": "https://arxiv.org/abs/2607.22088", "type": "理论", "summary": "1. 该工作针对玻色采样中的随机高斯矩阵，建立了永久量的弱反集中性界，并确定了其典型量级。\n2. 技术核心在于上界了永久量超指数小于标准差的概率，为收紧至逆多项式分数从而证明原永久反集中性猜想指明路径。\n3. 结合Aaronson-Arkhipov框架，该结果暗示若其余猜想成立，经典模拟玻色采样至超指数小总变差距离将导致多项式层级坍缩。", "summary_source": "deepseek", "authors": [{"name": "Fei Meng"}, {"name": "Bin Cheng"}, {"name": "Jianan Li"}, {"name": "Man-Hong Yung"}], "featured_authors": [{"name": "Fei Meng"}, {"name": "Bin Cheng"}, {"name": "Jianan Li"}, {"name": "Man-Hong Yung"}], "author_count": 4}, {"id": "2607.22138", "category": "quant-ph", "title": "Capacitive Loading in Two-dimensional Fluxonium Quantum Processors", "abstract": "Capacitive loading has emerged as a major obstacle to scaling fluxonium qubits from one-dimensional to highly connected two-dimensional (2D) architectures, yet its physical origin remains poorly understood. We derive an analytical relation between the qubit capacitance budget and the achievable capacitive coupling to external circuit elements, identifying the parasitic capacitances of Josephson junctions and Josephson junction arrays as the dominant source of capacitive loading while showing that the qubit-pad geometry can instead be engineered to mitigate it. Building on these insights, we formulate practical design principles and numerically demonstrate ultrafast, high-fidelity two-qubit gates in 2D fluxonium architectures. Our results reveal that capacitive loading does not constitute a fundamental limit for 2D fluxonium quantum processors.", "url": "https://arxiv.org/abs/2607.22138", "type": "理论+数值", "summary": "1. 该工作推导了量子比特电容预算与外部耦合的解析关系，揭示了二维fluxonium处理器中电容负载的物理起源。\n2. 其核心在于识别约瑟夫森结及其阵列的寄生电容为负载主因，并证明焊盘几何可设计缓解，由此实现超快高保真两比特门。\n3. 这为高连通二维fluxonium架构提供了实用设计原则，表明电容负载并非根本限制，可推动可扩展量子计算。", "summary_source": "deepseek", "authors": [{"name": "Quan Guan"}, {"name": "Guo Xuan Chan"}, {"name": "Xu Dou"}, {"name": "Chunqing Deng"}, {"name": "Lijing Jin"}], "featured_authors": [{"name": "Quan Guan"}, {"name": "Guo Xuan Chan"}, {"name": "Xu Dou"}, {"name": "Chunqing Deng"}, {"name": "Lijing Jin"}], "author_count": 5}, {"id": "2607.22195", "category": "quant-ph", "title": "Maximal Fisher Budget Forces Blind Directions in Bipartite Collective SU(d) Metrology", "abstract": "For pure two-qudit probes used in a single fixed setting to estimate a common SU(d) transformation, maximal total Fisher sensitivity and full local identifiability are mutually exclusive. We derive exact identities that determine the trace of the quantum Fisher information matrix from two measurable probe properties: exchange symmetry and collective polarization. Every maximizer is exchange symmetric and maximally entangled. Its Fisher matrix has equal sensitivity in every visible direction, while $d(d-1)/2$ generator directions are blind. More generally, weak compatibility, defined by vanishing mean generator commutators, forces at least $\\lfloor d/2\\rfloor$ blind directions for every pure bipartite probe. A probe-defined antiunitary invariant classifies the complete Fisher spectrum at maximal entanglement, and approaches to the optimum that preserve exchange symmetry have a divergent Holevo cost. The bipartite obstruction is sharp in particle number: for $N\\geq 3$, generalized GHZ probes can satisfy weak compatibility, attain the corresponding $N$-partite Fisher trace bound, and retain full local identifiability. Hence, Fisher sensitivity, weak compatibility, identifiability, and attainable precision are distinct resources in quantum metrology with noncommuting generators.", "url": "https://arxiv.org/abs/2607.22195", "type": "理论", "summary": "1. 该工作针对纯两量子比特探针估计共同SU(d)变换，推导了最大总Fisher灵敏度与完全局部可识别性互斥的精确恒等式，并揭示其由交换对称性和集体极化决定。\n2. 技术核心在于：最大灵敏度探针必为交换对称且最大纠缠，其Fisher矩阵在可见方向等灵敏度但存在d(d-1)/2个盲方向；更一般地，弱兼容性强制至少floor(d/2)个盲方向。\n3. 这阐明在非对易生成元量子计量中，Fisher灵敏度、弱兼容性、可识别性及可达到精度为不同资源，且二分障碍在粒子数≥3时可被广义GHZ探针规避以保留完全可识别性。", "summary_source": "deepseek", "authors": [{"name": "Tariq Aziz"}, {"name": "Naeem Akhtar"}, {"name": "Dong Wang"}, {"name": "Augusto Smerzi"}], "featured_authors": [{"name": "Tariq Aziz"}, {"name": "Naeem Akhtar"}, {"name": "Dong Wang"}, {"name": "Augusto Smerzi"}], "author_count": 4}, {"id": "2607.22248", "category": "quant-ph", "title": "Lower bounds for the CNOT-complexity of linear reversible operators", "abstract": "The CNOT-complexity of an invertible matrix over $\\mathbb{F}_2$ is the minimum number of CNOT gates needed to synthesize the corresponding linear reversible operator. While the maximum CNOT-complexity over all $n \\times n$ matrices is known to be $\\Theta(n^2 / \\log n)$, no explicit family of matrices requiring a superlinear number of CNOT gates is known, and until now the hardest explicitly known family has been the cyclic permutations, with CNOT-complexity $3(n-1)$. We show that lower bounds for the additive complexity of not-necessarily-reversible linear operators can be lifted to the reversible setting with only a small loss. As an application, we use this to describe an explicit family of matrices, constructed from parity-check matrices of error-correcting codes, with CNOT-complexity at least $4n - o(n)$, asymptotically surpassing the cyclic permutations. Moreover, this construction yields an explicit matrix $A \\in \\mathrm{GL}_{n}(\\mathbb{F}_2)$, $n = 17167$, whose CNOT-complexity exceeds that of the cyclic permutation on $n$ symbols.", "url": "https://arxiv.org/abs/2607.22248", "type": "理论", "summary": "1. 该工作为线性可逆算符的CNOT复杂度建立了下界，构造了显式矩阵族，其复杂度超过已知最难的循环置换。\n2. 其核心在于将不可逆算符的加法复杂度下界提升至可逆情形，并利用纠错码奇偶校验矩阵实现复杂度至少4n – o(n)的显式构造。\n3. 这为量子编译中的CNOT门数最优化及经典电路复杂度理论提供了新的构造性下界方法。", "summary_source": "deepseek", "authors": [{"name": "Søren Fuglede Jørgensen"}], "featured_authors": [{"name": "Søren Fuglede Jørgensen"}], "author_count": 1}, {"id": "2607.22337", "category": "quant-ph", "title": "Klein tunneling through an asymmetric barrier: Symmetric transmission and directional pair creation", "abstract": "We prove that the transmission probability for the Klein tunneling through a spatially asymmetric barrier is the same for left and right incidence whenever each asymptotic lead carries a single propagating channel per direction. Time-dependent Wigner-function simulations confirm this and locate the missing directionality in the barrier's interior, where a sharp edge generates several times more under-barrier negative-energy population than a smooth one. Directional control in the Klein regime therefore resides in pair production rather than in the transmitted current.", "url": "https://arxiv.org/abs/2607.22337", "type": "数值", "summary": "1. 该工作严格证明在每条渐近引线每方向仅支持单传播通道时，Klein隧穿通过空间不对称势垒的透射概率对左右入射完全对称。\n2. 时间依赖Wigner函数模拟将方向性缺失定位在势垒内部，尖锐边缘产生的势垒下负能量粒子对数量比平滑边缘多出数倍。\n3. 这揭示Klein隧穿方向控制源于势垒内对产生而非透射电流，为通过边缘工程调控量子输运中的粒子产生机制提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Andre G. Campos"}, {"name": "Denys I. Bondar"}], "featured_authors": [{"name": "Andre G. Campos"}, {"name": "Denys I. Bondar"}], "author_count": 2}, {"id": "2607.22429", "category": "quant-ph", "title": "A route to damage tolerance exceeding $10\\%$ in shuttling-equipped quantum processors", "abstract": "This is a short study of an approach offering high tolerance to damage (i.e. defects or 'drop outs') in solid state fault-tolerant quantum computing. Our method is primarily aimed at semiconductor electron spin-qubit systems, which have been shown to support fast and high-fidelity shuttling along pre-defined paths. We adapt the recent CAbLECAR method of Chadwick and Chong: stabilisers are performed by ancillas which each follow a bespoke pre-programmed path. We consider the simple surface code but we damage the physical lattice, and rely on route-solving software to find efficient pathways under constraints enforcing stabiliser commutation and hook error avoidance. Solutions are then converted to detector error models for Stim and logical error rates are obtained. We express our results by gauging the logical performance against that of a pristine lattice, using the notion of a reduced equivalent surface-code distance; for reasonable underlying error rates we find that $10\\%$ damage leaves roughly half of the pristine equivalent distance ($d_\\text{equiv}\\approx0.48\\,d_\\text{pristine}$ in the large-array limit, rising to $\\approx0.60$ for our smallest array). This suggests that one can tolerate substantial damage by building oversized arrays. We note that investigating damage tolerance of other qLDPC codes is a straightforward generalisation, and potentially one could adapt to damage emerging at runtime.", "url": "https://arxiv.org/abs/2607.22429", "type": "理论", "summary": "1. 该工作针对配备穿梭的半导体自旋量子比特处理器，提出了一种通过预编程穿梭路径容忍超过10%物理损伤的表面码容错方案。\n2. 其核心是利用路线求解软件在满足稳定子对易与钩错误避免约束下生成高效路径，并通过等效表面码距离量化了损伤对逻辑性能的影响。\n3. 该方法可推广至其他量子LDPC码，并有望适应运行时动态出现的损伤，为大尺度容错量子计算提供了实用策略。", "summary_source": "deepseek", "authors": [{"name": "Quinten Eggerickx"}, {"name": "Simon C. Benjamin"}], "featured_authors": [{"name": "Quinten Eggerickx"}, {"name": "Simon C. Benjamin"}], "author_count": 2}, {"id": "2607.22460", "category": "quant-ph", "title": "Algebraic structure of Tiger codes", "abstract": "Tiger codes form a family of multimode bosonic quantum codes that unify several previously known constructions, including cat, paircat, and the two-mode binomial code. In this work, we give a rigorous algebraic treatment of these codes. Starting from a kernel definition of the codespace, we prove that the annihilation-type constraints admit a finite generating set, construct an explicit orthonormal basis, and show that the logical structure of the code is governed by the homology of an underlying chain complex, as expected in the original work on Tiger codes of Xu et al. We then develop a Fourier transform over the codespace to prove that the span of phase-rotated projected coherent states is dense therein, and to yield dual $X$- and $Z$-type descriptions of the code. We further extend the framework to non-linear number constraints, encompassing codes such as the four-legged cat or the repetition cat code. Finally, we investigate the implementation of logical operations. We first generalise the construction of logical Pauli operators proposed by Xu et al. to arbitrary logical spaces, and then construct non-Clifford gates using physical polynomial phase rotations of the form $e^{iP(\\hat{\\boldsymbol{n}})}$. We derive criteria on the real polynomial $P$ which, for positive single-logical-qubit Tiger codes satisfying an additional sign assumption, such as the paircat code, characterise the polynomials $P$ that preserve the codespace by decomposing them into a family of univariate polynomials. Through this decomposition, we relate the degrees of the resulting components to the induced logical action in the Clifford hierarchy. These results establish Tiger codes as a mathematically robust framework for describing a broad class of bosonic encodings.", "url": "https://arxiv.org/abs/2607.22460", "type": "理论", "summary": "1. 该工作对Tiger码进行了严格的代数处理，从码空间核定义出发证明了湮灭型约束的有限生成性，构造了显式正交基并揭示其逻辑结构由链复形同调主导。\n2. 通过码空间傅里叶变换证明相位旋转投影相干态张成空间稠密，导出对偶X与Z型描述，并将框架推广至非线性数约束（如四腿猫码），同时利用多项式相位旋转构造非Clifford门，建立多项式分解与Clifford层级关联。\n3. 这一数学框架为多模玻色编码的代数分类与逻辑操作理性设计提供了严格基础，有望指导新型容错编码与量子计算方案的构造。", "summary_source": "deepseek", "authors": [{"name": "Clément Poirson"}, {"name": "Anthony Leverrier"}, {"name": "Christophe Vuillot"}], "featured_authors": [{"name": "Clément Poirson"}, {"name": "Anthony Leverrier"}, {"name": "Christophe Vuillot"}], "author_count": 3}, {"id": "2607.22466", "category": "quant-ph", "title": "Multiplexed storage and interaction of Rydberg spinwaves via the gradient echo memory protocol", "abstract": "Collective Rydberg excitations offer strong and controllable interactions for quantum information processing, sensing, and nonlinear quantum optics, but their integration with temporally or spectrally multiplexed schemes, such as the Gradient Echo Memory (GEM) protocol, is hindered by rapid motional dephasing caused by the large spinwave wavevector. We demonstrate a new type of multi-photon addressing and interfacing scheme (with levels following the shape of the letter Ń) that allows us to generate collective Rydberg excitations with near-zero momentum transfer, extending the Rydberg spinwave lifetime almost tenfold. The scheme relies on two additional off-resonant driving fields arranged at a magic angle, forming a closed wavevector loop while remaining compatible with GEM-induced inhomogeneous broadening. This enables storage and manipulation of long-lived Rydberg spinwaves in a multimode quantum memory. Using microwave coupling between neighboring Rydberg states, we can control the attenuation between stored excitation modes by interaction-induced decay and demonstrate interaction-controlled diffraction of a retrieved optical signal. Our results reestablish compatibility between Rydberg excitations and GEM, providing a route toward multimode quantum memories with controllable long-range interactions and applications in quantum networking, sensing, and quantum information processing.", "url": "https://arxiv.org/abs/2607.22466", "type": "理论", "summary": "1. 该工作提出基于梯度回波记忆协议与Ń形能级多光子寻址方案，实现动量转移近零的集体里德伯自旋波生成与复用存储。\n2. 技术核心在于利用魔角排列的附加失谐驱动场形成闭合波矢环，将自旋波寿命延长近十倍，并兼容非均匀展宽下的GEM操控。\n3. 该成果重建里德伯激发与梯度回波记忆的兼容性，为可控长程相互作用的复用量子存储器及量子网络、传感等应用开辟新途径。", "summary_source": "deepseek", "authors": [{"name": "Bartosz Niewelt"}, {"name": "Stanisław Kurzyna"}, {"name": "Bartosz Kasza"}, {"name": "Wojciech Wasilewski"}, {"name": "Michał Parniak"}], "featured_authors": [{"name": "Bartosz Niewelt"}, {"name": "Stanisław Kurzyna"}, {"name": "Bartosz Kasza"}, {"name": "Wojciech Wasilewski"}, {"name": "Michał Parniak"}], "author_count": 5}, {"id": "2607.22468", "category": "quant-ph", "title": "Learning to Prepare Molecular Ground States with Transformer Models", "abstract": "Quantum state preparation is a key component of many quantum algorithms. Performing this step efficiently is essential for realizing practical quantum advantage in quantum chemistry applications. Iterative algorithms like ADAPT-VQE can produce shallow ground-state preparation circuits, but become computationally prohibitive for the larger molecules relevant to materials science and pharmaceutical development. Here, we introduce ADAPT-GQE, a generative AI framework that learns to synthesize ground-state preparation circuits for electronic structure calculations. We first use ADAPT-VQE to generate high-quality reference circuits, which are then used as targets for training models for circuit generation. Once trained, the model can efficiently propose and score circuits, enabling reinforcement learning (RL) to drive circuit generation accuracy beyond the accuracy of the ADAPT-VQE training data. This pipeline achieves order-of-magnitude reductions in circuit generation time relative to ADAPT-VQE while maintaining comparable or improved state-preparation accuracy. We demonstrate ADAPT-GQE on imipramine, a well-established tricyclic antidepressant that serves as a representative, challenging target for computational modelling in drug stability protocols. We execute generated circuits on Quantinuum Helios-1, representing a milestone for AI-generated quantum chemistry circuits on state-of-the-art quantum hardware. These results establish a pathway toward automated quantum circuit synthesis for utility-scale quantum computational chemistry.", "url": "https://arxiv.org/abs/2607.22468", "type": "理论+数值", "summary": "1. 该工作提出ADAPT-GQE框架，利用Transformer模型学习生成分子基态制备电路，并在量子硬件上验证。\n2. 技术核心在于先以ADAPT-VQE构造参考电路，再经由强化学习训练生成模型，实现电路生成时间量级缩短且精度相当或更优。\n3. 这为自动化量子电路合成实现实用规模量子计算化学提供了可行路径，并展示了大语言模型在量子算法设计中的潜力。", "summary_source": "deepseek", "authors": [{"name": "Alex Koziell-Pipe"}, {"name": "Jasmine Brewer"}, {"name": "Jem Guhit"}, {"name": "Marwa H. Farag"}, {"name": "Kripa Panchagnula"}, {"name": "Gabriel Laude"}, {"name": "Fabian Finger"}, {"name": "Carlo Gaggioli"}, {"name": "Ludmila Szulakowska"}, {"name": "Oliver J. Backhouse"}, {"name": "Christos Papalitsas"}, {"name": "Jason G. Mustakis"}, {"name": "Thomas Soini"}, {"name": "David Munoz Ramo"}, {"name": "Stephen Clark"}, {"name": "Elica Kyoseva"}, {"name": "Enrico Rinaldi"}], "featured_authors": [{"name": "Alex Koziell-Pipe"}, {"name": "Jasmine Brewer"}, {"name": "Jem Guhit"}, {"name": "Stephen Clark"}, {"name": "Elica Kyoseva"}, {"name": "Enrico Rinaldi"}], "author_count": 17}, {"id": "2607.22495", "category": "quant-ph", "title": "Fractal quantum many-body scars and Hamiltonian inverse design from ZX-calculus", "abstract": "Diagrammatic languages such as ZX-calculus provide compact and intuitive descriptions of quantum processes and have become established tools for circuit simplification, verification, and compilation. However, their potential as a framework for constructing many-body states and the Hamiltonians that host them remains largely unexplored. Here, we introduce families of fractal many-body states obtained from ZX-diagrams based on the Sierpiński triangle and Sierpiński carpet. By construction, the underlying graph connectivity imposes atypical subvolume-law minimum-cut upper bounds on the entanglement, while the actual states are parametrically less entangled still: the triangle family obeys an area law, whereas the carpet family displays approximately logarithmic scaling across the available system sizes. Additionally, their local observables retain fractal-like spatial structure, identifying these states as natural candidates for atypical eigenstates in otherwise thermalizing systems. For the triangle family, we combine parent-Hamiltonian methods, insights from ZX-calculus, and local ZX identities that certify exact annihilation of the target state, producing frustration-free Hamiltonians whose terms admit simple representations in the same diagrammatic language as the states themselves. We then construct a local deformation that produces chaotic level statistics while embedding the fractal ZX state in the bulk of the energy spectrum as an exact quantum many-body scar. Our results demonstrate, through this explicit construction, that ZX-calculus can serve as a framework for Hamiltonian inverse design, in which quantum many-body scars, their local annihilators, and the chaotic Hamiltonians embedding them can be constructed and related through a set of graphical identities.", "url": "https://arxiv.org/abs/2607.22495", "type": "理论", "summary": "1. 该工作利用ZX-演算构造了基于Sierpiński三角形与地毯的分形多体量子态及其哈密顿量。\n2. 其技术核心在于巧用ZX-图形恒等式与母哈密顿方法，构建出嵌入精确分形量子多体疤痕并具有混沌能谱的局域哈密顿量。\n3. 这展示了ZX-演算作为图形化哈密顿量逆设计框架的通用性，为构造与理解非热化量子多体态提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Marcin Szyniszewski"}], "featured_authors": [{"name": "Marcin Szyniszewski"}], "author_count": 1}, {"id": "2607.22503", "category": "quant-ph", "title": "Correlated Coherent Errors in Stabilizer Codes: A General Cumulant Framework and Interference-Based Error Suppression", "abstract": "Coherent errors in stabilizer codes are often correlated across qubits and QEC cycles. Having a general analytical treatment of such noise would thus be extremely valuable. We derive here the exact logical channel induced by repeated QEC cycles under correlated coherent $Z$ noise, and develop a broadly general cumulant-expansion framework that yields a tractable expression for the noise-averaged logical infidelity. Crucially, this expression is non-perturbative in the noise, and applies to arbitrary stabilizer codes and correlation structures. It reveals a feature with no analogue in standard stochastic Pauli error models: the induced channel depends on which stabilizer eigenspace is chosen as the codespace. Exploiting this, we introduce protected stabilizer eigenspace (PROSE) encoding, an error-suppression strategy that selects the optimal codespace. We show that this eigenspace can be efficiently identified in many relevant situations. Further, when combined with logical Pauli twirling, PROSE matches or outperforms standard error suppression techniques (dynamical decoupling, Pauli twirling of physical qubits). We also show that noise correlations, usually assumed to be harmful to QEC, can instead be a resource: with the right encoding, even positive correlations reduce the logical infidelity below the uncorrelated baseline. Our results offer a new, broadly applicable lens on correlated coherent noise in stabilizer codes.", "url": "https://arxiv.org/abs/2607.22503", "type": "理论", "summary": "1. 该工作推导了重复量子纠错循环中相关相干Z噪声诱导的精确逻辑信道，并建立了广泛适用的累积量展开框架，得到对任意稳定子码和相关结构均成立的非微扰噪声平均逻辑不保真度表达式。\n2. 其核心在于揭示逻辑信道对稳定子本征空间选择的依赖性（标准随机泡利错误模型中无此特性），据此提出PROSE编码策略，可高效识别最优码空间并结合逻辑泡利twirling，匹配或超越现有错误抑制技术。\n3. 该工作表明噪声相关性可转化为资源——恰当编码下正相关能进一步降低逻辑不保真度，为设计超越传统方案的容错量子计算架构提供了全新视角。", "summary_source": "deepseek", "authors": [{"name": "Rohan N Rajmohan"}, {"name": "Antoine Brillant"}, {"name": "Peter Groszkowski"}, {"name": "Alireza Seif"}, {"name": "Jens Koch"}, {"name": "Aashish Clerk"}], "featured_authors": [{"name": "Rohan N Rajmohan"}, {"name": "Antoine Brillant"}, {"name": "Peter Groszkowski"}, {"name": "Alireza Seif"}, {"name": "Jens Koch"}, {"name": "Aashish Clerk"}], "author_count": 6}, {"id": "2607.22516", "category": "quant-ph", "title": "Quantum Spectral Model: Data Reuploading with Input-Conditioned Frequency Support", "abstract": "A central design principle in modern machine learning and artificial intelligence is to align a model's inductive bias with the structure of its input data. For matrix-valued inputs, relevant matrix-level relationships can be characterised through spectral values and spectral subspaces; however, common coordinate-wise rotation-gate data-encoding unitaries used in most quantum machine learning models do not explicitly construct such a matrix-level representation. We introduce Quantum Spectral Models (QSMs), in which we construct the generator of the data-encoding unitary directly from each input matrix. We study three QSM variants based on symmetric, global block, and non-overlapping patch-local block Hamiltonians. Their outputs admit truncated Fourier representations in which input-dependent spectral gaps supply candidate phase carriers, while spectral subspaces help determine their coefficients. We evaluate the QSMs and comparison quantum models on two matrix representations of Pendigits and two controlled synthetic tasks defined by spectral statistics. At the largest evaluated circuit depth, QSM variants lead the tested quantum models in mean test accuracy across all four benchmarks. The patch-local QSM leads on Pendigits, whereas the global block-Hamiltonian QSM leads on the controlled spectral tasks. Ablations show a task-dependent reversal: subspace-preserving controls perform better on Pendigits, whereas spectral-value-only controls lead among the tested ablations on the synthetic tasks. Together, these results shed new light on quantum machine-learning model design by showing how input-conditioned spectral representations can provide an analysable inductive bias, while offering a broader perspective on structure-aware model design in machine learning and artificial intelligence.", "url": "https://arxiv.org/abs/2607.22516", "type": "理论+数值", "summary": "1. 该工作提出量子谱模型，通过从输入矩阵直接构造数据编码酉算子的生成器，实现矩阵级结构的显式编码。\n2. 其核心卖点在于利用输入依赖的谱间隙提供相位载波，并借助谱子空间确定傅里叶系数，从而赋予模型可分析的归纳偏置。\n3. 这为量子机器学习中结构感知模型的设计提供了新视角，并揭示了谱表示与子空间控制在任务依赖性能上的关键权衡。", "summary_source": "deepseek", "authors": [{"name": "Peiyong Wang"}, {"name": "Udaya Parampalli"}, {"name": "Casey R. Myers"}], "featured_authors": [{"name": "Peiyong Wang"}, {"name": "Udaya Parampalli"}, {"name": "Casey R. Myers"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];

    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");

    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
