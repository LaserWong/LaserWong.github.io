ta\\in[1/2,\\infty]$ 阶的夹层 Rényi 半径在 $\\alpha=2-1/\\beta$ 处给出相同的族。", "summary_source": "local-fallback", "authors": [{"name": "Nidhal Mghirbi"}, {"name": "Seth Douglas"}], "featured_authors": [{"name": "Nidhal Mghirbi"}, {"name": "Seth Douglas"}], "author_count": 2}, {"id": "2610.20790", "category": "quant-ph", "title": "Infinite magic and the emergence of the continuum", "abstract": "Which features of a quantum state are needed for a relativistic quantum field theory to emerge from a lattice system? We address this question by establishing a quantitative relationship between the type classification of hyperfinite von Neumann algebras and the quantum-information-theoretic resource of nonstabilizerness, also called magic. Our results establish two complementary parts of this relationship. First, we prove that any stabilizer system on a lattice defines a canonical GNS Hilbert space in which local von Neumann algebras do not contain type III factors in their central decomposition. As an explicit example, we prove that for stabilizer systems with short-range order, the local algebras are isomorphic to tensor products of hyperfinite factors of type I or type II. This demonstrates that the absence of magic is accompanied by the absence of type III factors in the local algebras, therefore prohibiting the appearance of a quantum field theory. Second, for the hyperfinite factors of Araki, Woods and Powers, we prove a quantitative equivalence: The limiting factor is of type III if and only if the locally optimized min-relative entropy of magic diverges. This divergence is necessary to generate the continuous spectrum associated to a type III factor. Thus, in this setting, the emergence of a type III factor requires not merely the presence of magic, but an infinite amount of it. These results provide a rigorous setting supporting the proposal that infinite magic is a necessary structural ingredient for the emergence of a relativistic continuum from lattice systems.", "url": "https://arxiv.org/abs/2610.20790", "type": "理论+数值", "summary": "1. 该工作把超有限冯·诺依曼代数的类型分类与量子信息中的非稳定化资源（magic）定量关联起来。\n2. 其核心卖点是证明稳定子晶格的局域代数无III型因子，且Araki-Woods-Powers因子的III型性等价于最优magic最小相对熵发散。\n3. 这支持无限magic是相对论连续统从晶格涌现的必要结构要素，并为后续研究提供代数判据。", "summary_source": "deepseek", "authors": [{"name": "Leo Shaposhnik"}, {"name": "Lorenzo Leone"}, {"name": "Lennart Bittel"}, {"name": "Dimitris Saraidaris"}, {"name": "Alexander Jahn"}, {"name": "Jens Eisert"}], "featured_authors": [{"name": "Leo Shaposhnik"}, {"name": "Lorenzo Leone"}, {"name": "Lennart Bittel"}, {"name": "Dimitris Saraidaris"}, {"name": "Alexander Jahn"}, {"name": "Jens Eisert"}], "author_count": 6}, {"id": "2610.20846", "category": "quant-ph", "title": "Entanglement of superpositions in zero-energy subspace: insights from stabilizer theory", "abstract": "Exact zero-energy eigenstates built from entangled dimers have recently been found in a large class of spin Hamiltonians. While the individual states have a simple structure, their superpositions can have very different entanglement properties. In this work, we study these superpositions for geometrically local spin-1/2 chains with periodic boundary conditions. Using stabilizer theory and polynomial methods, we characterize the subspace they span and find the minimum entanglement entropy between two halves of the chain. For Hamiltonians generated by a single local Pauli interaction with noncommuting translates, this minimum obeys a volume law at fixed interaction range. The structure of the least-entangled superpositions also suggests further exact eigenstate constructions, including zero-energy states separable between the two halves of the chain and states at nonzero energies.", "url": "https://arxiv.org/abs/2610.20846", "type": "理论", "summary": "1. 该工作针对周期边界下几何局域的自旋1/2链，研究零能子空间中由纠缠二聚体精确本征态叠加而成的态，并借助稳定子理论与多项式方法刻画其张成子空间及链两半间的最小纠缠熵。\n2. 其核心发现是，对由单一局域泡利相互作用及其非对易平移生成的哈密顿量，这些叠加态的最小纠缠熵在固定相互作用距离下服从体积律，表明简单二聚体本征态的叠加仍可产生强纠缠。\n3. 最小纠缠叠加态的结构还暗示可进一步精确构造两半可分离的零能态以及非零能态，为相关自旋链中精确本征态与纠缠性质的研究提供启发。", "summary_source": "deepseek", "authors": [{"name": "Konstantin Antipin"}, {"name": "Richik Sengupta"}], "featured_authors": [{"name": "Konstantin Antipin"}, {"name": "Richik Sengupta"}], "author_count": 2}, {"id": "2610.20987", "category": "quant-ph", "title": "Practical wavelength selection for quantum-augmented networks over shared optical fiber", "abstract": "In a quantum augmented network, sharing optical fiber with classical traffic requires quantum wavelength selection to balance logical fidelity, block acceptance, and classical data reception. Here we develop a wavelength-selection framework for an error-corrected three-stage quantum communication protocol. Under a thermal-background model with independent errors, an ideal one-photon receiver, and ideal recovery, we derive an accepted qubit channel and a key-independent lower bound on logical entanglement fidelity. Combining this bound with block acceptance gives an entanglement-fidelity yield bound, which we maximize over evaluated wavelengths subject to fidelity and classical link-budget requirements. For the Steane [[7,1,3]] code at 5 km per traversal and -10 dBm per classical channel, the largest fidelity certificate occurs near 1537 nm, whereas the largest yield bound occurs near 1551 nm. Along the 1.25 Gb/s classical link budget with 0.2% base error, the optimized yield bound falls below 10^-6 near 10 km per traversal, while fidelity remains certified at 0.99 or higher at longer spans. These results distinguish fidelity and yield constraints and identify certified operating regions for quantum-augmented networks sharing optical fiber.", "url": "https://arxiv.org/abs/2610.20987", "type": "理论+数值", "summary": "1. 在量子增强网络中，与经典流量共享光纤需要选择量子波长来平衡逻辑保真度、块接受和经典数据接收。\n2. 这些结果区分了保真度和产量限制，并确定了共享光纤的量子增强网络的经过认证的操作区域。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Nitin Jha"}, {"name": "Prateek Paudel"}, {"name": "Abhishek Parakh"}], "featured_authors": [{"name": "Nitin Jha"}, {"name": "Prateek Paudel"}, {"name": "Abhishek Parakh"}], "author_count": 3}, {"id": "2610.20988", "category": "quant-ph", "title": "Classification of quantum states through conserved operators", "abstract": "Determining whether quantum states can be interconverted by a prescribed set of transformations is a fundamental problem in quantum information. Here we develop a general classification framework based on conserved operators (COs), i.e., not necessarily hermitian matrices having the state of interest as an eigenstate. We first show that COs belonging to the algebra generating the allowed transformations can be obtained from the kernel of a quantum covariance matrix. Their number determines the dimension of the accessible orbit, while their algebraic structure and eigenvalues provide further constraints on state convertibility. We establish general bounds on the number of COs and prove that highest-weight states, like separable states in the case of $n$ qudits, attain the maximum. We also show how these operators generate parent Hamiltonians having the characterized state as an exact ground state. We then also consider positive zero-eigenvalue COs, which encode forbidden directions of reduced density matrices and incorporate rank-based constraints into the same framework. Applying this approach to multiqubit SLOCC, we obtain complementary classifications from algebraic and rank COs. While for $n\\leq 3$ qubits both lead to the usual classes, for $n=4$ qubits they distinguish 17 and 20 types separately, and 29 when combined. The combined classification yields 287 fixed types and $4$ continuous families for $n=5$ qubits, and 4926 fixed types and 147 continuous families for $n=6$ qubits, providing, to our knowledge, the most refined exhaustive classification of SLOCC-convertibility classes based on such data.", "url": "https://arxiv.org/abs/2610.20988", "type": "理论", "summary": "1. 确定量子态是否可以通过一组规定的变换相互转换是量子信息中的一个基本问题。\n2. 虽然对于 $n\\leq 3$ 量子位都导致通常的类别，但对于 $n=4$ 量子位，它们分别区分 17 和 20 种类型，组合时区分 29 种类型。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Federico Petrovich"}, {"name": "R. Rossignoli"}, {"name": "M. Cerezo"}], "featured_authors": [{"name": "Federico Petrovich"}, {"name": "R. Rossignoli"}, {"name": "M. Cerezo"}], "author_count": 3}, {"id": "2610.21000", "category": "quant-ph", "title": "monoprop: Scaling Pauli and Majorana propagation via Anticommutation Indices", "abstract": "We introduce monoprop, an open-source, massively parallel operator-propagation framework for fermion and qubit bases. For $N$ qubits or modes, existing codes represent each of the $K$ tracked operator terms (Pauli strings or products of Majorana operators) as a $2N$-bit string, testing each for anticommutation with the gate at $O(KN)$ cost per gate. Here, we introduce the anticommutation index which rapidly looks up the terms anticommuting with a gate. A local gate changes only the terms that touch its sites, and when terms are truncated to act on few sites, only a fraction $\\sim1/N$ touch any given qubit or mode, and we use this to prove the time per gate scales as $O(K/N)$. This counterintuitive result tells us that for a fixed number of terms, increasing the number of sites can make things faster. We demonstrate this numerically, and show monoprop scales almost ideally to 8192 cores, tracking $9.5\\times10^{10}$ terms. Beyond propagation, we present memory-efficient surrogate graphs, which record one propagation and replay it at new angles, for fast energy re-estimation and parameter gradients, and an efficient method for finding energy-minimising gates and optimal angles for simulating adaptive quantum-chemistry circuits.", "url": "https://arxiv.org/abs/2610.21000", "type": "理论+数值", "summary": "1. 该工作提出开源并行算符传播框架 monoprop，用于追踪费米子与量子比特基组中 Pauli 串和 Majorana 算符乘积在门作用下的演化。\n2. 其核心是反交换索引，能快速查出与门反交换的项；由于局域门只影响所触及位点，且截断到少位点的项仅约 1/N 触及任一比特或模式，故每门耗时被证明为 O(K/N)，固定项数下位点数增加反而更快。\n3. 数值结果验证了这一标度，框架近理想地扩展至 8192 核并追踪 9.5×10^10 项；内存高效的代理图可记录一次传播并在新角度重放，用于能量快速重估与参数梯度，也支持自适应量子化学线路的能量最小化门与最优角度搜索。", "summary_source": "deepseek", "authors": [{"name": "Aaron Miller"}], "featured_authors": [{"name": "Aaron Miller"}], "author_count": 1}, {"id": "2610.21044", "category": "quant-ph", "title": "Singular wave functions and quantum collapse in inverse-power potentials", "abstract": "Quantum collapse (QC) occurs under the action of the inverse-power potential U(r)=-U_{0}/(2r^{n}) in the framework of the Schroedinger equation. The corresponding stationary wave functions feature an infinite number of spatial oscillations at $r\\rightarrow 0$. The ground state (GS) is missing in the presence of the QC, but the available bound states at finite energies may be physically relevant, as they are normalizable. This work aims to produce singular stationary wave functions. The analytical findings represent an asymptotic form of the stationary wave functions at $r\\rightarrow 0$, which fill a continuous spectrum, and some exact solutions for the wave functions, obtained under appropriate conditions. As a regularized version, we also consider the potential truncated at a finite difference from the center. The regularized wave functions feature a finite number of spatial oscillations, the missing GS reappears, and the spectrum of the bound states is discrete.", "url": "https://arxiv.org/abs/2610.21044", "type": "理论", "summary": "1. 该工作研究了反幂势 U(r)=-U0/(2r^n) 下薛定谔方程的量子坍缩，构造了在 r→0 处具有无穷多空间振荡的奇异定态波函数，并给出其连续谱渐近形式与部分精确解。\n2. 其要点在于：量子坍缩导致基态缺失，但有限能量束缚态仍可归一化且物理相关；对中心附近作有限截断的正则化势则使振荡次数有限、基态重现并恢复离散束缚谱。\n3. 这为理解奇异势中的波函数奇异性、连续谱与束缚态的关系提供了可解析处理的范例，并提示截断/正则化对谱结构的关键影响。", "summary_source": "deepseek", "authors": [{"name": "Hidetsugu Sakaguchi"}, {"name": "Boris Malomed"}], "featured_authors": [{"name": "Hidetsugu Sakaguchi"}, {"name": "Boris Malomed"}], "author_count": 2}, {"id": "2610.21071", "category": "quant-ph", "title": "Multiplicative Semidefinite Programming Upper Bounds on Quantum No-Signalling-Assisted Zero-Error Capacity", "abstract": "We study zero-error communication and exact simulation of quantum channels assisted by quantum no-signalling correlations. For a channel with Kraus operator space $K$, we introduce a semidefinite programming parameter $\\Gamma(K)$ that is exactly multiplicative under tensor products and upper-bounds $\\Theta_{\\rm NS}(K)$, where $\\log_2\\Theta_{\\rm NS}(K)=C_{0,\\rm NS}(K)$ and $C_{0,\\rm NS}(K)$ denotes the asymptotic quantum no-signalling-assisted zero-error capacity. Among known upper bounds on $\\Theta_{\\rm NS}$ given by semidefinite programs, $\\Gamma$ is the tightest. We also prove that the previously introduced simulation lower bound $\\Sigma^{-}(K)$ is exactly multiplicative and satisfies $\\Theta_{\\rm NS}(K)\\leq\\Gamma(K)\\leq\\Sigma^{-}(K)\\leq\\Gamma(K)^2$. Using this multiplicativity, we show that neither $S_{0,\\rm NS}(K)=\\log_2\\Sigma^{-}(K)$ nor its regularized extension $S_{0,\\rm NS}(K)=\\lim\\nolimits_{n\\to\\infty}n^{-1}\\log_2\\Sigma^{-}(K^{\\otimes n})$ holds in general. This answers an open question about the asymptotic simulation cost $S_{0,\\rm NS}(K)$. For classical-quantum channels, we obtain sharp bounds. If $r$ is the effective output dimension, then $\\Theta_{\\rm NS}\\leq\\Gamma\\leq(1+r^{1/2})\\Theta_{\\rm NS}/2$ and $\\Gamma\\leq\\Sigma^{-}\\leq(1+r^{1/2})\\Gamma/2$. If $k$ is the minimum rank of the output support projections, then $\\Sigma^{-}/\\Theta_{\\rm NS}\\leq[(1+r^{1/2})/(1+k^{1/2})]^2$, and this bound is sharp for every $1\\leq k\\leq r$. Thus, we obtain the sharp bound $S_{0,\\rm NS}-C_{0,\\rm NS}\\leq2\\log_2[(1+r^{1/2})/(1+k^{1/2})]$.", "url": "https://arxiv.org/abs/2610.21071", "type": "理论+数值", "summary": "1. 该文研究量子无信号关联辅助的零误差通信与信道精确模拟，引入Kraus算子空间K上的半定规划参数Γ(K)，证明其精确乘性并上界Θ_NS(K)。\n2. 卖点是Γ在已知半定规划上界中最紧，并与模拟下界Σ^-满足Θ_NS≤Γ≤Σ^-≤Γ^2，且二者均精确乘性。\n3. 由此证明模拟成本公式一般不成立，并对经典-量子信道给出由r、k控制的尖锐界 S_{0,NS}-C_{0,NS}≤2log_2[(1+r^{1/2})/(1+k^{1/2})]。", "summary_source": "deepseek", "authors": [{"name": "Xin Li"}, {"name": "Yinan Li"}], "featured_authors": [{"name": "Xin Li"}, {"name": "Yinan Li"}], "author_count": 2}, {"id": "2610.21410", "category": "quant-ph", "title": "Parallel Repetition for Entangled Games via Conditional Relative Entropy", "abstract": "We give a proof of the cubic parallel-repetition bound for finite two-player entangled games using quantum conditional relative entropy. For a game with entangled value $1-\\varepsilon<1$ and answer alphabets $\\mathcal A,\\mathcal B$, its $n$-fold repeated value is at most \\[ \\exp[-\\Omega(\\varepsilon^3n/L)],\\qquad L:=\\max\\{1,\\log(|\\mathcal A||\\mathcal B|)\\}, \\] for every $n\\ge1$. This recovers Song's cubic rate. We also prove a threshold bound: the probability of winning a fraction at least $1-\\varepsilon+\\delta$ is at most $\\exp[-\\Omega(\\delta^5n/(\\varepsilon^2L))]$ for $0<\\delta\\le\\varepsilon$. Our information charge is the decrease in relative entropy when a question reference is discarded. Our comparison states preserve the original conditional question law. A chain rule bounds the coordinate charges using the cost of conditioning on checked wins and retaining checked answers. Our main lemma converts small charges into nearby pure-state descriptions and local corrections, each depending only on one player's question. Together with Song's sampler, these enable approximate local preparation of the conditioned workspace.", "url": "https://arxiv.org/abs/2610.21410", "type": "理论", "summary": "1. 该工作用量子条件相对熵证明有限双人纠缠博弈的立方并行重复界：n重纠缠值至多 exp[-Ω(ε^3 n/L)]，L=max{1,log(|A||B|)}，并给出胜率超过阈值的指数上界。\n2. 其技术核心是把弃置问题参照时的相对熵减少定义为信息荷，以保持原条件问题律的比较态和链式法则约束坐标荷，再将小荷转化为近纯态描述及仅依赖单个玩家问题的局域修正。\n3. 结合Song采样器可近似局域制备条件工作空间并复现立方速率，表明条件相对熵可成为纠缠博弈并行重复的可扩展信息论分析工具。", "summary_source": "deepseek", "authors": [{"name": "Rahul Jain"}], "featured_authors": [{"name": "Rahul Jain"}], "author_count": 1}, {"id": "2610.21428", "category": "quant-ph", "title": "Crossovers between Time-Bin and Energy-Time Entanglement in Homodyned Resonance Fluorescence", "abstract": "We theoretically investigate photonic entanglement generated by homodyning resonance fluorescence from a two-level emitter with a phase-locked laser field. Under weak excitation, increasing the relative laser-field amplitude produces crossovers from time-bin to energy--time and back to time-bin entanglement. The intermediate energy--time regime occurs near amplitude matching, where destructive interference suppresses the single-photon component, allowing the two-photon contributions to dominate the coincidence signal. We evaluate the resulting photon statistics and first-order coherence and characterize the entanglement through violations of the CHSH Bell inequality in a Franson interferometer. This scheme provides a route to controlling photonic entanglement through linear optics and coherent interference.", "url": "https://arxiv.org/abs/2610.21428", "type": "理论+数值", "summary": "1. 该工作理论上研究了由双能级发射体共振荧光与锁相激光场零拍混频所产生的光子纠缠，并在弱激发下考察相对激光场振幅变化引发的纠缠类型转换。\n2. 其关键卖点在于：当振幅匹配时，破坏性干涉抑制单光子成分，使双光子符合贡献占主导，从而出现从时间仓到能量-时间再回到时间仓的纠缠交叉，并通过弗朗松干涉仪中的贝尔不等式违背以及光子统计和一阶相干度加以表征。\n3. 该方案表明可借助线性光学与相干干涉主动调控光子纠缠，为可调谐纠缠光源及后续实验实现提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Zi-Qi Zeng"}, {"name": "Jian Wang"}, {"name": "Bang Wu"}, {"name": "Zhiliang Yuan"}], "featured_authors": [{"name": "Zi-Qi Zeng"}, {"name": "Jian Wang"}, {"name": "Bang Wu"}, {"name": "Zhiliang Yuan"}], "author_count": 4}, {"id": "2610.21469", "category": "quant-ph", "title": "Limits of adaptive linear postprocessing in six-state quantum key distribution", "abstract": "Two-way classical communication improves the noise tolerance of quantum key distribution, but the limits of adaptive parity processing remain unclear. For the six-state protocol with equal three-basis error rate $p\\in[p_*,1/2]$, where $p_*=(5-\\sqrt5)/10\\simeq27.64\\%$, we construct a single compatible collective attack that defeats a broad class of linear postprocessing. Each public message may be an affine function of the sender's raw key, chosen adaptively from the public history. For every finite input length and every accepted transcript of positive probability, Eve's optimal probability of recovering any affine function of Alice's raw key is at least Bob's. Consequently, reliable agreement on a linear final key is incompatible with secrecy. The same conclusion holds for arbitrary publicly seeded privacy amplification after reliable recovery of a linear candidate. The proof conditions on the complete transcript, which restricts the two raw keys to affine subspaces. A local degradation of Eve's state, a known Rényi-entropy comparison, and a coset-probability inequality then give the recovery comparison. Both inequalities are proved in self-contained appendices. The result allows block splitting, regrouping, nonzero-syndrome selection, and adaptive linear reconciliation.", "url": "https://arxiv.org/abs/2610.21469", "type": "理论", "summary": "1. 针对六态量子密钥分发在等三基错误率p∈[p*,1/2]（p*≈27.64%）情形，构造单一兼容集体攻击，界定自适应线性后处理的极限。\n2. 其核心证明显示，对任意有限输入长度和正概率接受转录，窃听者恢复发送方原始密钥任意仿射函数的概率不低于接收方，故线性最终密钥与保密性不相容。\n3. 该结论适用于分块、重分组、非零校验子选择及自适应线性协调，并延伸至线性候选可靠恢复后的任意公开种子隐私放大。", "summary_source": "deepseek", "authors": [{"name": "Toyohiro Tsurumaru"}], "featured_authors": [{"name": "Toyohiro Tsurumaru"}], "author_count": 1}, {"id": "2610.21557", "category": "quant-ph", "title": "Reducing the Cost of Qudit State Preparation by Learning a Sparse Structure for SNAP Gates", "abstract": "Preparing quantum states in bosonic qudits with SNAP--Displacement sequences requires both optimizing the gate parameters and deciding which Fock levels should be controlled by each SNAP gate. A fully parameterized ansatz assigns an independent phase to every Fock level in every gate, leading to a number of phases that grows steeply. This constitutes a problem for short to medium term systems as controlling many phases requires complex control pulses which are subject to increased control errors. Previous work reduced this cost by restricting the trainable phases to predefined sparse patterns, such as a diagonal or a grid, which however may not be optimal for a specific target state. In this work, we address this limitation by introducing a method that learns which phases are needed together with their values, using a differentiable mask. A sparsity penalty encourages the removal of unnecessary phases, while temperature annealing gradually turns the masks into binary decisions. We compare the proposed method with fully parameterized and predefined sparse ansatzes on Fourier and Haar-random target states. The evaluation considers both the minimum number of phases required to reach different infidelity thresholds and the overall trade-off between fidelity and phases required, measured through Pareto frontiers and hypervolume. The results show that learning the location of the phases together with their values provides competitive or improved fidelity--resource trade-offs, although the advantage depends on the target state and qudit dimension.", "url": "https://arxiv.org/abs/2610.21557", "type": "理论+数值", "summary": "1. 该工作提出一种可微掩码方法，在SNAP-位移序列中同时学习各SNAP门所需控制的Fock能级位置与相位值，以降低玻色子qudit态制备成本。\n2. 其技术卖点是用稀疏惩罚与温度退火将可微掩码逐步二值化，剔除冗余相位，从而在Fourier与Haar随机目标态上获得竞争或更优的保真度-资源前沿。\n3. 结果表明，联合学习相位位置与数值可提供有竞争力或更优的保真度-资源权衡，但优势依赖目标态与qudit维度，为后续资源优化提供启发。", "summary_source": "deepseek", "authors": [{"name": "Marco Pennazio"}, {"name": "Leonardo Ignazio Pagliochini"}, {"name": "Riccardo Pellini"}, {"name": "Maurizio Ferrari Dacrema"}, {"name": "Paolo Cremonesi"}], "featured_authors": [{"name": "Marco Pennazio"}, {"name": "Leonardo Ignazio Pagliochini"}, {"name": "Riccardo Pellini"}, {"name": "Maurizio Ferrari Dacrema"}, {"name": "Paolo Cremonesi"}], "author_count": 5}, {"id": "2610.21596", "category": "quant-ph", "title": "Time-optimal robust quantum control for partially known errors", "abstract": "Robust quantum control usually assumes one of two extremes: the error is of a known form and only its strength is unknown, or nothing at all is known about it. In practice one often sits in between. The size of a static error is unknown, but its class is known, for example, it only shifts energy levels, or it acts on each subsystem separately. We ask how fast a control can cancel, to first order, every error in such a class. A time-independent Hamiltonian can do this if and only if all errors in the class have zero diagonal in a common basis. In that case an equally spaced energy ladder in this basis does it after one period. A lower bound that holds for any time-dependent control with bounded drive power shows that this simple constant control is optimal for several natural classes, including unknown level shifts and unknown local errors on two subsystems. Completely unknown errors need a time-dependent control, and there, knowing the error class shortens the minimum time by a factor $\\sqrt{d^2+1}$. So partial knowledge of the error changes not only how long an optimal robust control takes, but also its form.", "url": "https://arxiv.org/abs/2610.21596", "type": "理论+数值", "summary": "1. 该工作研究误差类别已知而强度未知时，量子鲁棒控制在一阶下抵消该类所有误差的最短时间问题。\n2. 其核心是：若该类误差在共同基下对角元皆零，则等间距能级阶梯的恒定控制一个周期即最优；有限驱动功率下界证明它对若干自然误差类时间最优。\n3. 这说明误差类别部分已知不仅可将完全未知情形的最短时间缩短为原来的 1/√(d²+1)，还决定最优控制取恒定还是时变形式。", "summary_source": "deepseek", "authors": [{"name": "Llorenç Balada Gaggioli"}], "featured_authors": [{"name": "Llorenç Balada Gaggioli"}], "author_count": 1}, {"id": "2610.21608", "category": "quant-ph", "title": "Driving the cooling process of a quantum system via classical noise", "abstract": "It is known that under particular hypotheses anomalous thermalization processes can occur, such as the Mpemba effect, consisting in a faster cooling down when the system is prepared in a hotter initial condition, thus making convenient to warm up the system before the freezing process in order to make it freeze in a shorter time. It is shown here that the action of a Markovian classical noise during the freezing process can accelerate the approach to the zero-temperature thermal state. This prediction is counterintuitive, especially after observing that a classical noise can be considered equivalent to the action of an infinite-temperature reservoir, since both drive the system toward the same state. These facts lead to the statement that warming up the system during the contact with a low-temperature reservoir can accelerate the cooling process.", "url": "https://arxiv.org/abs/2610.21608", "type": "理论", "summary": "1. 该工作研究了在冻结过程中施加马尔可夫经典噪声对量子系统冷却动力学的影响，并考察其能否加速趋近零温热态。\n2. 核心卖点在于揭示经典噪声虽等价于无穷温热库，却能在低温热库接触下加速系统向零温热态趋近，为Mpemba效应提供新机制。\n3. 这一反直觉结果意味着，在与低温热库接触时对系统进行“加热”可加快冷却，为量子平台中主动调控冷却协议和基态制备提供启发。", "summary_source": "deepseek", "authors": [{"name": "B. Militello"}, {"name": "A. Napoli"}], "featured_authors": [{"name": "B. Militello"}, {"name": "A. Napoli"}], "author_count": 2}, {"id": "2610.21712", "category": "quant-ph", "title": "Size-Dependent High-Order Harmonic Generation from Linear Carbon-Chain Molecules in Linearly Polarized Laser Fields", "abstract": "High-order harmonic generation from molecules is highly sensitive to molecular geometry and strong-field electron dynamics, providing a powerful route for probing and controlling ultrafast processes in extended systems. In this work, we systematically investigate the influence of molecular chain length on HHG from linear carbon-chain molecules C$_2$H$_2$, C$_6$H$_2$, and C$_{10}$H$_2$ driven by an 800 nm linearly polarized laser field. To isolate the molecular-size effect from the influence of different ionization potentials, the laser intensities are adjusted to maintain the same Keldysh parameter for different molecules. Real-time time-dependent density functional theory simulations are performed with the molecular axis aligned parallel to the laser polarization direction. The results show that increasing the molecular chain length significantly enhances the harmonic yield and tends to extend the cutoff region. In particular, C$_{10}$H$_2$ exhibits much stronger plateau harmonics than C$_2$H$_2$, while the intermediate molecule C$_6$H$_2$ shows harmonic intensities between those of C$_2$H$_2$ and C$_{10}$H$_2$. Time-frequency analysis and charge-density evolution reveal that the enhanced HHG emission in longer chains originates from the enlarged electron acceleration distance and increased probability of multi-center recollision, especially near the terminal carbon atoms. These findings demonstrate that molecular-size engineering offers an effective strategy for controlling harmonic emission and optimizing attosecond light sources in extended molecular systems.", "url": "https://arxiv.org/abs/2610.21712", "type": "理论+数值", "summary": "1. 该工作用实时含时密度泛函理论，模拟800 nm线偏振场下线性碳链C2H2、C6H2、C10H2的高次谐波，并调光强保持相同Keldysh参数。\n2. 时频分析与电荷密度演化表明，链增长使电子加速距离增大、终端碳附近多中心回碰概率提高，从而增强平台谐波并延展截止区。\n3. 该结果表明分子尺寸工程是调控扩展分子体系谐波发射、优化阿秒光源的有效途径。", "summary_source": "deepseek", "authors": [{"name": "Yifan Kang"}, {"name": "Yang Yang"}, {"name": "Yingtan Li"}, {"name": "Shuwen Pang"}, {"name": "Huiwen Yang"}, {"name": "Yingdan Zhang"}, {"name": "Shushan Zhou"}], "featured_authors": [{"name": "Yifan Kang"}, {"name": "Yang Yang"}, {"name": "Yingtan Li"}, {"name": "Huiwen Yang"}, {"name": "Yingdan Zhang"}, {"name": "Shushan Zhou"}], "author_count": 7}, {"id": "2610.21723", "category": "quant-ph", "title": "Operator-Space Entanglement Entropy in Random Fermionic Gaussian Dynamics", "abstract": "We study the von Neumann operator-space entanglement entropy (OSEE) of initial product operators evolved under random gaussian dynamics, as modeled by a Brownian SYK$_2$ model. By exploiting a mapping to a domain-wall melting problem, we derive an exact expression for the time-dependent bipartite OSEE in the thermodynamic limit, and obtain an analytic characterization of the corresponding gaussian Page curve emerging at late times. Our results build on recent work on the entanglement dynamics in the all-to-all quantum simple exclusion process, leveraging tools from RMT, including the Coulomb-gas approach and a mapping to the free Jacobi process. Finally, based on our results, we discuss the possibility of relating the OSEE with non-gaussianity measures in the Heisenberg picture.", "url": "https://arxiv.org/abs/2610.21723", "type": "理论+数值", "summary": "1. 该工作研究随机费米子高斯动力学中初始乘积算符的冯·诺依曼算符空间纠缠熵（OSEE），以Brownian SYK2模型为例，并在热力学极限下给出二分OSEE随时间的精确表达式及晚时高斯Page曲线的解析刻画。\n2. 其技术卖点在于将问题映射为畴壁熔化，并借鉴全对全量子简单排斥过程的结果，结合随机矩阵理论中的库仑气体方法与自由Jacobi过程，从而精确解析OSEE动力学。\n3. 这为在Heisenberg绘景中建立OSEE与非高斯性度量的联系提供可能，并启发将随机高斯动力学中的纠缠演化同RMT及非平衡统计模型进一步关联。", "summary_source": "deepseek", "authors": [{"name": "Pablo Bayona-Pena"}, {"name": "Elena Gramellini"}, {"name": "Lorenzo Piroli"}], "featured_authors": [{"name": "Pablo Bayona-Pena"}, {"name": "Elena Gramellini"}, {"name": "Lorenzo Piroli"}], "author_count": 3}, {"id": "2610.21778", "category": "quant-ph", "title": "Same Spectrum, Harder First-Order Training: Phase-Locking in Single- versus Multi-Qubit Re-Uploading Circuits", "abstract": "Angle-encoded variational quantum circuits implement truncated Fourier series. For one-dimensional inputs, a single-qubit re-uploading (serial) circuit represents every function that a multi-qubit circuit with the same encoding budget $E$ can; we find that this exchange of width for depth is not free in first-order training. Because its state lives on the Bloch sphere, all parameters of the serial circuit move the state, at each input, along one complex direction, which we call \\emph{phase-locking}. We prove that this costs no Fourier direction but leaves no direction to spare: however many parameters it has, the serial circuit has at most $2E+2$ tangent directions, one more than its $2E+1$ Fourier coefficients need, while a two-qubit control with the same encoding budget and model class generically has at least $6E+6$. The cost in training is measured against this control, as the number of runs out of 100 that reach the optimum within a fixed step budget. On an exact loss with flat-spectrum targets the gap grows with $E$; at $E=32$ the serial circuit converges in 3, 53 and 83 runs under gradient descent, Adam and Levenberg--Marquardt, the control in 99, 100 and 100. On three real-world series, at matched parameter counts, the serial circuit reaches the least-squares optimum in at most 9 runs under Adam and in 32 to 93 under Levenberg--Marquardt, the control in at least 98 and in all 100; its held-out error is up to about $1.5$ times that of the control under Adam, but no larger in the typical run under Levenberg--Marquardt.", "url": "https://arxiv.org/abs/2610.21778", "type": "理论+数值", "summary": "1. 该工作比较相同编码预算E下单比特串行重上传电路与多比特对照电路，分析其一阶训练差异并提出“相位锁定”。\n2. 其证明相位锁定使串行电路切向方向至多2E+2，仅比所需2E+1个傅里叶系数多一，而双比特对照一般至少6E+6，并用GD/Adam/LM验证。\n3. 这表明相同傅里叶谱不代表同等可训练性；以宽度换深度会增加一阶优化成本，LM可缩小典型泛化差距。", "summary_source": "deepseek", "authors": [{"name": "Michael Poppel"}, {"name": "David Bucher"}, {"name": "Maximilian Zorn"}, {"name": "Markus Baumann"}, {"name": "Sebastian Wölckert"}, {"name": "Claudia Linnhoff-Popien"}, {"name": "Philipp Altmann"}, {"name": "Jonas Stein"}], "featured_authors": [{"name": "Michael Poppel"}, {"name": "David Bucher"}, {"name": "Maximilian Zorn"}, {"name": "Claudia Linnhoff-Popien"}, {"name": "Philipp Altmann"}, {"name": "Jonas Stein"}], "author_count": 8}, {"id": "2610.21797", "category": "quant-ph", "title": "Controlled-Memory Identification with Shared Generators: Dimension--Horizon Tradeoffs and Quantum--Classical Separation", "abstract": "We determine the finite-horizon identification limits of a \\(d\\)-dimensional memory when the control interface is restricted to four shared, time-homogeneous generators. A writer encodes a message by applying a prefix word to a common root state. The verifier then applies a candidate-dependent query word followed by a shared terminal binary test, with each word of length at most \\(T\\). For fixed error tolerances \\(\\lambda_2>0\\) and \\(\\lambda_1+\\lambda_2<1\\), the optimal identification sizes satisfy \\(\\ln N_{\\mathsf Q,4}=\\Theta_{\\lambda_1,\\lambda_2}(\\min\\{d^2,T\\})\\) for arbitrary CPTP generators and \\(\\ln N_{\\mathsf S,4}=\\Theta_{\\lambda_1,\\lambda_2}(\\min\\{d,T\\})\\) for stochastic maps. Four unitary letters and four permutation letters attain these respective bounds, showing that a four-letter reversible alphabet reaches the static code-size orders in optimal quadratic and linear word length. In the fully dimension-limited regime, this yields \\(\\ln N_{\\mathsf Q,4}=\\Theta(d^2)\\) versus \\(\\ln N_{\\mathsf S,4}=\\Theta(d)\\), establishing a quadratic quantum--classical separation in logarithmic code size. Low-overlap Grassmann and agreement-code packings supply the orbit endpoints, while exact inverse query words match each encoded state to its designated test. At the sharp boundary \\(\\lambda_2=0\\), \\(0\\leq\\lambda_1<1\\), all four model classes satisfy \\(\\ln N=\\Theta(\\min\\{\\ln d,T\\})\\). Thus any fixed positive false-acceptance tolerance activates the metric-packing regime, whereas zero false acceptance imposes an exclusive-witness constraint and yields the logarithmic-dimension boundary.", "url": "https://arxiv.org/abs/2610.21797", "type": "理论", "summary": "1. 该工作在控制接口限于四个共享、时间齐次生成元且验证词长不超过 T 的模型下，确定 d 维记忆的有限时域识别容量，并分别对任意 CPTP 生成元和随机映射给出最优识别规模的对数阶。\n2. 其核心结论是四个酉字母与四个置换字母分别达到 ln N_Q=Θ(min{d²,T}) 和 ln N_S=Θ(min{d,T})，在维度受限区形成 Θ(d²) 对 Θ(d) 的二次量子—经典分离；证明用低重叠 Grassmann 与 agreement-code packing 构造轨道端点，并以精确逆查询匹配编码态与指定测试。\n3. 该结果区分两种机制：任意固定正的误接受容差激活度量 packing 区，零误接受则施加排他见证约束，使四类模型均为 Θ(min{ln d,T})，为控制记忆识别中的维度—时域权衡与量子优势边界提供定量判据。", "summary_source": "deepseek", "authors": [{"name": "Yixin Zhao"}], "featured_authors": [{"name": "Yixin Zhao"}], "author_count": 1}, {"id": "2610.21883", "category": "quant-ph", "title": "Hybrid Quantum-Classical Optimization for Emergency-Priority Traffic Signal Control", "abstract": "Emergency-priority traffic signal control requires reducing emergency-vehicle delay while limiting disruption to ordinary traffic. This work investigates a finite-horizon QUBO formulation and compares Exact QUBO optimization, QAOA, CVaR-QAOA, a quantum machine-learning policy, fixed-time control, and max-pressure control in a three-intersection corridor. The study evaluates three traffic-demand regimes, examines the effect of the emergency-priority weight, and compares quantum solutions with the exact QUBO optimum. The optimization-based controllers achieved reliable emergency progression across all tested demand regimes, while max-pressure produced lower ordinary-traffic delay. Increasing emergency priority reduced emergency travel time but increased congestion, with diminishing improvements at larger weights. CVaR-QAOA reproduced the exact QUBO solution more accurately than standard QAOA, although the resulting differences in closed-loop traffic performance were comparatively small.", "url": "https://arxiv.org/abs/2610.21883", "type": "数值", "summary": "1. 该工作在三交叉口走廊建立有限时域QUBO应急优先信号控制模型，并比较精确QUBO、QAOA、CVaR-QAOA、量子机器学习策略、固定配时与最大压力控制。\n2. 结果表明各基于优化的控制均能在三种需求场景下可靠保障应急车通行，但最大压力的普通车延误更低；应急优先权重增大虽缩短应急行程时间，却加重拥堵且边际收益递减，CVaR-QAOA较标准QAOA更准确复现精确QUBO解，但闭环交通性能差异很小。\n3. 这提示量子求解精度的提升未必直接转化为闭环控制收益，需针对交通目标设计代价函数并在更真实路网中验证混合量子-经典优化的实际边界。", "summary_source": "deepseek", "authors": [{"name": "Silvie Illésová"}, {"name": "Vojtěch Novák"}], "featured_authors": [{"name": "Silvie Illésová"}, {"name": "Vojtěch Novák"}], "author_count": 2}, {"id": "2610.21907", "category": "quant-ph", "title": "Selected Stabilizer Subspaces for Compact Many-Body Wave Functions", "abstract": "Selected configuration interaction (SCI) obtains accurate many-body solutions by variationally diagonalising the Hamiltonian in a sparse, iteratively selected set of configurations, but can lose compactness when the target state has broad configurational support. We introduce selected stabilizer interaction (SSI), a fully classical, SCI-inspired method that instead iteratively constructs a nonorthogonal subspace spanned by a systematically enlargeable set of selected stabilizer states. A single stabilizer, generated by Clifford operations, can encode a structured superposition of (possibly exponentially) many configurations, shifting the relevant compression from configurational to stabilizer sparsity. We benchmark ground-state energies, fidelities, superposition degrees and required expansion lengths against exact diagonalization and equivalent SCI schemes for the transverse-field Ising, XXZ Heisenberg, and Hubbard models, finding particularly strong compression from the stabilizer representation in the spin models, and increasing advantage with system size for these systems. The results establish a proof of principle for heuristic selected stabilizer diagonalization, while also identifying particular challenges in symmetry handling and effective exploration of the stabilizer space.", "url": "https://arxiv.org/abs/2610.21907", "type": "理论+数值", "summary": "1. 该工作提出选择性稳定子相互作用（SSI）方法，借鉴选择性组态相互作用思想，以纯经典方式迭代构造由可系统性扩展的稳定子态张成的非正交子空间来逼近多体波函数。\n2. 其核心卖点是单个由Clifford操作生成的稳定子即可编码（可能指数多个）组态的相干叠加，从而将压缩来源从组态稀疏性转移到稳定子稀疏性，并随体系增大展现更强优势。\n3. 在横场Ising、XXZ Heisenberg与Hubbard模型上的基准测试确立了启发式选择性稳定子对角化的原理性证明，同时指出对称性处理与稳定子空间高效探索仍是关键挑战。", "summary_source": "deepseek", "authors": [{"name": "Maria-Andreea Filip"}, {"name": "George H. Booth"}], "featured_authors": [{"name": "Maria-Andreea Filip"}, {"name": "George H. Booth"}], "author_count": 2}, {"id": "2610.21909", "category": "quant-ph", "title": "Looking Beyond Visibility: Resolving the Temporal Structure of Continuous-Wave Four-Photon Hong-Ou-Mandel Interference", "abstract": "Hong-Ou-Mandel interference underpins many photonic quantum information protocols and is commonly characterized by a single visibility parameter. This quantity is typically obtained by averaging over a fixed coincidence window, thereby discarding details of the underlying temporal structure that are critical in continuous-wave processes. Four-photon interference with continuous-wave sources furthermore requires photon pairs with long coherence times, which we generate in microring resonators and measure with ultrafast time-resolved detection. Here, we model and resolve their interference and temporal structure by recording all four photon arrival times and mapping their relative delays onto a three-dimensional coincidence histogram relative to a trigger detection. The resulting structure preserves relative arrival-time correlations that are usually discarded and enables post-processed optimization of coincidence windows to trade off visibility against count rate. This method provides a general benchmark for continuous-wave sources in interference-based quantum network protocols.", "url": "https://arxiv.org/abs/2610.21909", "type": "理论+数值", "summary": "1. 该工作用微环谐振腔产生长相干时间光子对并结合超快时间分辨探测，建模并解析了连续波四光子Hong-Ou-Mandel干涉的时序结构。\n2. 其核心在于记录四个光子的到达时刻，将相对延时映射为相对于触发探测的三维符合直方图，从而保留通常被丢弃的到达时间关联。\n3. 该框架可后处理优化符合窗口，在可见度与计数率间权衡，为连续波光源在干涉型量子网络协议中提供通用基准。", "summary_source": "deepseek", "authors": [{"name": "Sabine Häussler"}, {"name": "Meritxell Cabrejo-Ponce"}, {"name": "Ana Maria Torres"}, {"name": "Baghdasar Baghdasaryan"}, {"name": "Karen Lozano-Mendéz"}, {"name": "Fabian Steinlechner"}], "featured_authors": [{"name": "Sabine Häussler"}, {"name": "Meritxell Cabrejo-Ponce"}, {"name": "Ana Maria Torres"}, {"name": "Baghdasar Baghdasaryan"}, {"name": "Karen Lozano-Mendéz"}, {"name": "Fabian Steinlechner"}], "author_count": 6}, {"id": "2610.21923", "category": "quant-ph", "title": "Opinion bubbles in the quantum Buridan's ass problem", "abstract": "The quantum Buridan's ass problem concerns a network of interconnected nodes in which transitions between the nodes are governed by the laws of quantum mechanics. In such situations interference between probability amplitudes plays a key role in determining whether the probability of leaving the initial node is large or small and also the speed at which the associated transitions occur. In this paper we extend this idea to consider transitions between one given set of coupled nodes and the remainder of the network. We have in mind a quantum analogy to changing an opinion, in which the initially occupied set of nodes is one opinion bubble, with the remaining parts of the network corresponding to a different opinion. We find that quantum interference again plays a crucial role in the dynamics. A further key component is the role of symmetry between the nodes and their interconnections, as it is symmetry that lies at the heart of the Buridan's ass puzzle. In the classical Buridan's ass paradox it is symmetry between competing alternatives that freezes the ass into indecision. In the quantum case, however, interference results in a far richer dynamics.", "url": "https://arxiv.org/abs/2610.21923", "type": "理论", "summary": "1. 该工作将量子布里丹之驴问题从单个初始节点扩展到一组耦合节点与网络其余部分之间的跃迁，并借助“观点气泡”类比研究意见改变的量子动力学。\n2. 其核心卖点在于表明量子干涉与节点/连边对称性共同决定离开初始观点气泡的概率和速度，且量子情形因干涉而比经典对称导致的僵局具有更丰富动力学。\n3. 这为理解量子网络中的观点转变与对称性作用提供了新视角，并启示后续研究可考察多气泡耦合及环境退相干对动力学的影响。", "summary_source": "deepseek", "authors": [{"name": "Leonid Chaichenets"}, {"name": "Jaroslav Novotný"}, {"name": "Igor Jex"}, {"name": "Stephen M. Barnett"}, {"name": "Tamás Kiss"}], "featured_authors": [{"name": "Leonid Chaichenets"}, {"name": "Jaroslav Novotný"}, {"name": "Igor Jex"}, {"name": "Stephen M. Barnett"}, {"name": "Tamás Kiss"}], "author_count": 5}, {"id": "2610.21928", "category": "quant-ph", "title": "Synergistic charging of a quantum battery via Dzyaloshinskii-Moriya interaction and non-Markovian noise", "abstract": "Protecting quantum batteries from environmental noise remains a challenge. Using exact Burshtein-Kubo equations, we study a two-spin quantum battery with Dzyaloshinskii-Moriya (DM) coupling under indepen dent local longitudinal random telegraph noise (RTN). At a fixed effective noise scale, the DM-assisted slow switching protocol yields a superadditive transient ergotropy gain and near-maximal ergotropy during the initial charging stage, while the no-DM slow-switching control reaches comparable ergotropy only in a later revival. A finite superadditive region persists at fixed RTN amplitude, with protocol-dependent location and gain. In the Ising model, the enhancement is nonmonotonic in DM strength, with intermediate coupling giving near-optimal performance. Dressed-channel analysis associates this enhancement with changes in transition frequencies and longitudinal-noise matrix elements that reduce slow-RTN spectral weight. Superadditivity also persists in the tested anisotropic XY model.", "url": "https://arxiv.org/abs/2610.21928", "type": "理论", "summary": "1. 该工作用精确Burshtein-Kubo方程研究独立纵向随机电报噪声下带DM耦合的双自旋量子电池。\n2. 卖点是DM辅助慢切换在固定噪声下产生超可加暂态可提取功增益，初始充电近最大；缀饰通道分析将增强归于跃迁频率与噪声矩阵元改变，降低慢随机电报噪声谱权重。\n3. 超可加性在Ising与各向异性XY模型中持续，DM增强随耦合强度非单调且中间值近最优，为噪声环境下量子电池充电协议与耦合设计提供依据。", "summary_source": "deepseek", "authors": [{"name": "Si-Yu Zhang"}, {"name": "Meng-Long Song"}, {"name": "Hai-Tao Dong"}, {"name": "Xue-Ke Song"}, {"name": "Liu Ye"}, {"name": "Dong Wang"}], "featured_authors": [{"name": "Si-Yu Zhang"}, {"name": "Meng-Long Song"}, {"name": "Hai-Tao Dong"}, {"name": "Xue-Ke Song"}, {"name": "Liu Ye"}, {"name": "Dong Wang"}], "author_count": 6}, {"id": "2610.21936", "category": "quant-ph", "title": "ZZ-Free bSWAP Gates under Strong Driving in Far-Detuned Fixed-Frequency Transmons", "abstract": "Far-detuned frequency allocations in fixed-frequency superconducting processors mitigate spectral crowding but constrain cross-resonance interactions at practical drive amplitudes. Here, we demonstrate that a single strong drive induces a large $XX-YY$ interaction in the far-detuned regime, while a weak second tone tunes the accompanying $ZZ$ phase. The interaction realizes a 150-ns $\\sqrt{\\mathrm{bSWAP}}$ gate, which can directly prepare a maximally entangled state from the ground state. For the implementations on the same qubit pair at matched drive strengths, cross resonance gives a shorter CNOT operation, while $\\sqrt{\\mathrm{bSWAP}}$ gives a 33% shorter SWAP operation with a higher IRB fidelity. The multilevel theory further predicts a regime where stronger driving can yield a speed advantage for CNOT as well, a possibility absent in the two-level model. As an application of the $XX-YY$ interaction, we also demonstrate two-spin squeezing beyond the standard quantum limit through two-axis countertwisting. The interaction realized here complements cross resonance and offers a route to efficient gate synthesis and quantum simulation of interacting spin systems.", "url": "https://arxiv.org/abs/2610.21936", "type": "理论+数值", "summary": "1. 在远失谐固定频率超导量子比特上，用单一强驱动产生大XX-YY相互作用，并以弱二次音调调节ZZ相位，实现150 ns的√bSWAP门，可直接从基态制备最大纠缠态。\n2. 卖点是强驱动下XX-YY与ZZ可独立调控，实现无ZZ相位；同驱动强度下√bSWAP的SWAP比交叉共振短33%且IRB保真度更高，多能级理论还预言更强驱动可使CNOT获得速度优势。\n3. 该相互作用与交叉共振互补，为高效门合成及相互作用自旋系统的量子模拟提供路径，并已用双轴反扭实现超越标准量子极限的双自旋压缩。", "summary_source": "deepseek", "authors": [{"name": "Akinori Machino"}, {"name": "Kazuhisa Ogawa"}, {"name": "Yuto Ikegai"}, {"name": "Takafumi Miyanaga"}, {"name": "Koichiro Ban"}, {"name": "Nilton F. G. Filho"}, {"name": "Hidehisa Shiomi"}, {"name": "Toshi Sumida"}, {"name": "Shuhei Tamate"}, {"name": "Yutaka Tabuchi"}, {"name": "Yasunobu Nakamura"}, {"name": "Makoto Negoro"}], "featured_authors": [{"name": "Akinori Machino"}, {"name": "Kazuhisa Ogawa"}, {"name": "Yuto Ikegai"}, {"name": "Yutaka Tabuchi"}, {"name": "Yasunobu Nakamura"}, {"name": "Makoto Negoro"}], "author_count": 12}, {"id": "2610.22004", "category": "quant-ph", "title": "Thermal activation of photon catalysis in difference-intensity Mach-Zehnder interferometry with squeezed thermal light", "abstract": "Realistic non-Gaussian operations, which can be implemented by mixing a nonclassical Gaussian state with a Fock state at a beam splitter and then heralding on a photon-number-resolving detector, are known to improve phase estimation in a Mach-Zehnder interferometer. The existing studies have considered the single-mode squeezed vacuum for difference-intensity and parity detection, and the two-mode squeezed thermal state for parity detection alone as the initial Gaussian resources. However, a real squeezer in the lab actually produces single-mode squeezed thermal light, which has not been studied in a coherent-plus-resource interferometer. We take up this case and using the phase space Wigner picture, we obtain the heralded state produced by photon subtraction, addition and catalysis on a single-mode squeezed thermal resource, and evaluate the corresponding phase sensitivities. Single-photon catalysis, which is useless on squeezed vacuum, becomes a useful operation for any thermal occupation above $\\nth\\simeq0.2$, and since it heralds with a probability near one-half, it turns out to be the best success-weighted operation over the whole thermal range. In the vacuum limit our results reproduce the known hierarchy, where two-photon catalysis is the best operation. The quantum Fisher information computations confirms that thermal noise enhances the phase information encoded in the catalyzed state, demonstrating that difference-intensity detection closely approaches the ultimate precision bound across most operational regimes, and, together with a loss analysis, verifies the robustness of the effect.", "url": "https://arxiv.org/abs/2610.22004", "type": "理论+数值", "summary": "1. 该工作以单模压缩热光为初始资源，在差分强度马赫-曾德尔干涉仪中考察光子减除、增加和催化的非高斯操作，并用Wigner相空间方法评估预示态与相位灵敏度。\n2. 关键结果是单光子催化在压缩真空下无效，却在热占据数约0.2以上变为有效，且因预示概率接近1/2，成为整个热区间内成功率加权最优操作；真空极限回归双光子催化最优的已知层级，量子Fisher信息显示热噪声反而增强催化态的相位信息，使差分强度探测多数区间逼近终极精度并具损耗鲁棒性。\n3. 这为真实压缩热光源下的非高斯量子度量学提供了可执行方案，并提示热噪声可转化为相位信息优势。", "summary_source": "deepseek", "authors": [{"name": "Kirtpreet Singh"}, {"name": "Arvind"}], "featured_authors": [{"name": "Kirtpreet Singh"}, {"name": "Arvind"}], "author_count": 2}, {"id": "2610.22034", "category": "quant-ph", "title": "Energetic channels in finite many-body quantum charging", "abstract": "We examine how a finite many-body system can function as an effective charger for a single-qubit quantum battery, using the Lipkin-Meshkov-Glick model as a paradigmatic setting. As our figure of merit, we consider the battery ergotropy while explicitly resolving the energetic flows across the composite system. In the absence of intra-charger interactions, we show that the generation of non-zero ergotropy is controlled by the competition between collective coupling and spectral mismatch. We further demonstrate that even passive positive-temperature charger states can generate finite battery ergotropy, provided the charger is sufficiently large and sufficiently hot. Intra-charger interactions restructure the charger spectrum and qualitatively modify the available energetic pathways. While they can enhance the amount of energy accessible for charging, they can simultaneously divert energy into internal many-body and battery-charger interaction channels, producing an energetic impedance to direct charger-to-battery transfer. Consequently, battery ergotropy alone is insufficient to characterize an effective many-body charger: the useful work generated and its energetic provenance must be assessed together.", "url": "https://arxiv.org/abs/2610.22034", "type": "理论", "summary": "1. 该工作以Lipkin-Meshkov-Glick模型为范例，考察有限多体系统如何作为单量子比特量子电池的充电器，并以电池可提取功（ergotropy）为指标，同时分辨复合系统中的能量流。\n2. 其核心卖点在于：无充电器内部相互作用时，非零功由集体耦合与谱失配竞争控制；即使被动正温充电器态，只要充电器足够大且足够热，也能产生有限功；而内部相互作用会重构充电器谱并定性改变可用能量通路。\n3. 这启示我们，内部相互作用虽可提升可充电能量，却会将能量分流到多体内部和电池-充电器相互作用通道，形成对直接转移的能量阻抗，因此仅凭电池功不足以刻画有效的多体充电器，必须同时评估有用功与其能量来源。", "summary_source": "deepseek", "authors": [{"name": "Dara Murphy"}, {"name": "George Mihailescu"}, {"name": "Anne Matthies"}, {"name": "Irene D'Amico"}, {"name": "Steve Campbell"}], "featured_authors": [{"name": "Dara Murphy"}, {"name": "George Mihailescu"}, {"name": "Anne Matthies"}, {"name": "Irene D'Amico"}, {"name": "Steve Campbell"}], "author_count": 5}, {"id": "2610.22069", "category": "quant-ph", "title": "Generalized $m$-body mean-field projections for classical simulation of $d$-dimensional Heisenberg-picture dynamics", "abstract": "Classical simulation of quantum many-body dynamics is challenged by the rapid growth of operator complexity, particularly in higher dimensions where tensor-network methods become increasingly demanding. We develop state-adapted Pauli-weight propagation based on generalized $m$-body mean-field projections, which compress many-body observables into optimal low-body representations in a covariance geometry induced by the initial state. Combined with adaptive Krylov-like restricted Heisenberg dynamics, this provides an alternative to conventional Hilbert--Schmidt Pauli-weight truncation. We derive necessary and conditional sufficient bounds on low-body approximation accuracy using standard operator complexity measures and characterize possible dynamical failure mechanisms of the state-adapted method. Numerical benchmarks demonstrate substantial state-dependent accuracy gains, while identifying regimes of reduced accuracy or violations of Pauli spectral bounds. For a three-dimensional system of $80$ interacting spins, our method achieves strong body-order convergence, close agreement with independently converging tensor-network simulations, and substantially smaller sparse Pauli representations. These results establish state-adapted Pauli propagation as a promising approach to classical simulation of higher-dimensional coherent many-body dynamics.", "url": "https://arxiv.org/abs/2610.22069", "type": "理论+数值", "summary": "1. 该工作提出基于广义 m 体平均场投影的态自适应泡利权重传播方法，用于高维 Heisenberg 绘景动力学的经典模拟。\n2. 其卖点是以初态诱导的协方差几何将多体可观测量压缩为最优低体表示，配合自适应 Krylov 型受限 Heisenberg 动力学替代 Hilbert–Schmidt 截断。\n3. 三维 80 自旋基准中实现强体阶收敛、与独立张量网络结果吻合且泡利表示更稀疏，表明态自适应传播是高维相干多体动力学经典模拟的有前景途径。", "summary_source": "deepseek", "authors": [{"name": "Federico Tomás B. Pérez"}, {"name": "Gabriela Wójtowicz"}, {"name": "Matthias Kost"}, {"name": "Martin B. Plenio"}], "featured_authors": [{"name": "Federico Tomás B. Pérez"}, {"name": "Gabriela Wójtowicz"}, {"name": "Matthias Kost"}, {"name": "Martin B. Plenio"}], "author_count": 4}, {"id": "2610.22093", "category": "quant-ph", "title": "Bubble-Sort Exchange Networks: Symmetry Selection Rules and Language-Model Distillation on Exchange-Only Spin Chains", "abstract": "On a chain of exchange-coupled quantum dots a Heisenberg exchange pulse of area pi is a SWAP, so the parallel bubble-sort SWAP network of superconducting chains is native to exchange-only (EO) spin qubits, and any other pulse area fuses routing with an entangling interaction. We build a variational \"bubble-sort exchange network\" (odd-even transposition, one parameter per pulse) and study it as a Born machine read out by Pauli spin blockade. Exchange conserves total spin, so the reachable readout distributions are fixed by the total-spin content of the initial product state. For the two-spin singlet-triplet encoding we derive a selection rule -- outcomes with k triplet pairs are bounded by the initial weight in sectors S <= k (S = 0 excluded for k = 1) -- and prove by a transportation argument that it is also sufficient: the reachable distributions form the polytope cut out by the rule, and its total-variation floor is attained. Products of singlets and T0's forbid whole outcome classes; the Neel state forbids none; the three-spin EO code has no floor. We then distil, in noise-free simulation, next-token distributions of GPT-2 over restricted vocabularies into the network, with matrix-product-state (MPS) Born machines as classical control. At six logical qubits the three-spin chain reaches KL = 0.011 nat at depth N and 0.004 at 2N, below the bond-dimension-4 MPS; the two-spin chain from the Neel state reaches 0.014 at 2N and 0.004 at 3N, against 0.28-1.5 from singlet/triplet products for the first teacher. Final states lie largely outside the code space: leakage is a resource, not an error. No arrangement of disjoint pulses meets every pair in fewer than N-1 rounds, and at depth 2N the chain distils as well as a 2D array or non-local couplings. Sector-restricted simulation extends this to 10-14 logical qubits (up to 30 dots).", "url": "https://arxiv.org/abs/2610.22093", "type": "理论+数值", "summary": "1. 该工作构建了每脉冲一参数的奇偶转置冒泡排序交换网络，并用作Pauli自旋阻塞读出的变分Born机。\n2. 关键物理机制是总自旋守恒导出两自旋单-三重态编码的选择规则，并经输运论证证明可达分布恰为该规则切割的多胞体且下界可达。\n3. 这暗示泄漏可作资源，交换专用自旋链在深度2N即可蒸馏GPT-2词元分布并匹配二维或非局域耦合，且可扩展至10–14逻辑比特。", "summary_source": "deepseek", "authors": [{"name": "Yuichiro Minato"}], "featured_authors": [{"name": "Yuichiro Minato"}], "author_count": 1}, {"id": "2610.22097", "category": "quant-ph", "title": "Operational Limits of Gravity-Mediated Entanglement", "abstract": "Tests of gravity-mediated entanglement aim to determine whether two massive objects in spatial superposition can become entangled through their mutual gravitational interaction. In an ideal model, the two objects are often treated as pointlike branches, but real wave packets have a finite width and are also exposed to dephasing and residual non-gravitational forces. We study these effects in a two-branch gravitational cat-state model with Gaussian wave packets. The Newtonian interaction is averaged over the finite wave-packet width, and spatially correlated dephasing is included phenomenologically. We then ask a practical question: when does the generated state remain useful rather than merely entangled? To answer this, we examine Bell violation, teleportation fidelity, coherent information, Fisher information, and state distinguishability. We find finite parameter windows where the same state is Bell-nonlocal and teleportation-useful, but these windows shrink as the wave packets become broader or the dephasing becomes stronger. We also show that a residual electrostatic branch interaction can coherently cancel the gravitational nonlocal phase and strongly suppress the operational signal. The results identify finite-width and electrostatic tolerance boundaries that should be considered in future tests of gravity-mediated entanglement.", "url": "https://arxiv.org/abs/2610.22097", "type": "理论", "summary": "1. 该工作用高斯波包构建双分支引力猫态模型，在牛顿相互作用中计入有限波包宽度平均，并唯象引入空间关联退相干与残余非引力作用。\n2. 其关键在于以贝尔违背、隐形传态保真度、相干信息、费舍尔信息及态可区分性等操作指标，界定纠缠仍具可用性的参数窗口，并发现波包展宽或退相干增强会压缩该窗口，而残余静电分支相互作用可相干抵消引力非局域相位并强烈压制操作信号。\n3. 结果给出未来引力介导纠缠检验需考虑的有限宽度与静电容差边界，提示仅以“是否纠缠”判据不足以评估实验可行性。", "summary_source": "deepseek", "authors": [{"name": "Atta ur Rahman"}, {"name": "Muhammad Noman"}, {"name": "Ying-Jian Zhu"}, {"name": "Jia-Xin Peng"}, {"name": "Saeed Haddadi"}], "featured_authors": [{"name": "Atta ur Rahman"}, {"name": "Muhammad Noman"}, {"name": "Ying-Jian Zhu"}, {"name": "Jia-Xin Peng"}, {"name": "Saeed Haddadi"}], "author_count": 5}, {"id": "2610.22145", "category": "quant-ph", "title": "Gyrators for superconducting circuit design", "abstract": "Assuming only the solubility of Kirchhoff's laws, the conservation of energy, and the form of the constitutive relations, we present a flux-charge symmetric Hamiltonian formalism that always admits a symplectic reduction for nonsingular, well-posed circuits involving gyrators, inductors, and capacitors (LCG circuits) with arbitrary non-linearity. The formalism introduces a notion of circuit duality on non-linear non-reciprocal circuits and a family of point transformations that inserts, removes, and moves reciprocal elements across gyrators while preserving the Hamiltonian spectrum. With these transformations, we extend Tellegen's classic result that gyrators make reciprocal elements behave as their dual to non-linear reciprocal elements such as the Josephson junction and quantum phase slip. Furthermore, we present conditions under which non-reciprocal circuits can be transformed to dynamically equivalent reciprocal circuits.", "url": "https://arxiv.org/abs/2610.22145", "type": "理论", "summary": "1. 该工作基于基尔霍夫定律、能量守恒和本构关系，构建磁通-电荷对称的哈密顿形式，对含回转器、电感与电容且可任意非线性的良态电路实现辛约化。\n2. 其核心是引入非线性非互易电路的电路对偶性，以及保持哈密顿谱不变并跨回转器插入、移除和移动互易元件的点变换，并将特勒根关于回转器使互易元件呈对偶行为的经典结论推广到约瑟夫森结和量子相位滑移等非线性互易元件。\n3. 这些结果给出非互易电路动态等价于互易电路的条件，为超导电路设计中的对偶变换、谱保持化简与非互易元件等效提供了系统工具。", "summary_source": "deepseek", "authors": [{"name": "Ciro Salcedo"}, {"name": "Sasha Cocquyt"}, {"name": "Andrew Osborne"}, {"name": "Andrew A. Houck"}], "featured_authors": [{"name": "Ciro Salcedo"}, {"name": "Sasha Cocquyt"}, {"name": "Andrew Osborne"}, {"name": "Andrew A. Houck"}], "author_count": 4}, {"id": "2610.22199", "category": "quant-ph", "title": "Energetics of Fault-Tolerant Spin-Qubit Quantum Computation", "abstract": "Semiconductor spin qubits offer a promising route to compact and scalable quantum computers, combining long coherence times in isotopically purified silicon with compatibility with semiconductor manufacturing. Beyond computational speedup, their energy efficiency is an important consideration for future large-scale systems. We evaluate the power and energy requirements of a Loss-DiVincenzo spin-qubit quantum computer by analyzing the Quantum Fourier Transform (QFT) and benchmarking it against the classical Fast Fourier Transform (FFT). We develop a detailed energy budget, identifying cryogenic cooling as the dominant baseline contribution before quantum error correction (QEC). The comparison between the QFT and the classical FFT reveals that, for any quantum workload operating under a polynomially bounded sampling regime, the crossover in energy consumption occurs at smaller problem sizes than the crossover in execution time. Thus, quantum computing can become energetically competitive before achieving a speedup in execution time. We then incorporate surface-code QEC and analyze the energy costs of QEC cycles, gate synthesis, and decoding. At scale, instrumentation and decoding become dominant contributions, while cryogenic cooling imposes a constraint on scalability. We show that optimizing the control-signal demultiplexing ratio can reduce the overall energy cost by approximately two orders of magnitude. For a system with about one million physical qubits, we estimate a power consumption of approximately 100 kW, at least one order of magnitude below that of today's highest-performance classical computing systems.", "url": "https://arxiv.org/abs/2610.22199", "type": "理论+数值", "summary": "1. 该工作为半导体自旋量子比特构建了涵盖低温冷却、QFT与经典FFT对比及表面码纠错的能耗预算。\n2. 其核心结论是，在多项式有界采样下，能耗交叉发生在比执行时间交叉更小的问题规模上；纳入量子纠错后，大规模系统由仪器与解码主导，低温冷却制约扩展，而优化控制信号解复用比可降总能耗约两个数量级，百万物理比特系统功耗约100 kW，较当前顶级经典系统低至少一个数量级。\n3. 这提示能效可先于速度成为量子计算竞争力的判据，并强调需协同优化低温、控制复用与解码以推动容错自旋量子比特规模化。", "summary_source": "deepseek", "authors": [{"name": "João Santos"}, {"name": "Jayshankar Nath"}, {"name": "Marco Pezzutto"}, {"name": "Valentin Savin"}, {"name": "Tristan Meunier"}, {"name": "Yasser Omar"}], "featured_authors": [{"name": "João Santos"}, {"name": "Jayshankar Nath"}, {"name": "Marco Pezzutto"}, {"name": "Valentin Savin"}, {"name": "Tristan Meunier"}, {"name": "Yasser Omar"}], "author_count": 6}, {"id": "2610.22223", "category": "quant-ph", "title": "Constrained dissipation and the lifetime of quantum many-body scars", "abstract": "We investigate the fate of quantum many-body scars in the PXP model subject to Markovian dissipation. We show that when local jump operators respect the same symmetries of the Hamiltonian the full Liouvillian spectrum displays a tower of states with properties analogous to standard quantum scars: large overlaps with Néel states and equally spaced gaps in the imaginary part of the eigenvalues, set by a single frequency. Whether the long-time dynamics is dominated by scars is determined by the real parts of the eigenvalues, which are set by the ratio between the two relaxation rates $\\gamma_{\\pm}$ describing spin flips down-to-up or up-to-down respectively. For asymmetric dissipation ($\\gamma_+ > \\gamma_-$) the scarred eigenvalues have the smallest real parts: the resulting enhanced fidelity oscillations are further stabilized by staggered jump operators. In contrast, replacing the full projection operator in the dissipators with a partial one breaks the symmetries of the problem and is seen to destroy dissipative scars altogether.", "url": "https://arxiv.org/abs/2610.22223", "type": "理论", "summary": "1. 该工作研究PXP模型在马尔可夫耗散下量子多体疤痕的存续，揭示当跳跃算符保持原哈密顿量对称性时Liouvillian谱中出现疤痕态塔。\n2. 要点为疤痕塔与Néel态高重叠、虚部等间距且由单一频率决定，实部由γ+/γ−之比设定；非对称耗散下疤痕实部最小，交错跳跃算符进一步增强保真度振荡。\n3. 结果表明耗散疤痕依赖跳跃算符对称性与投影完备性：以部分投影替换完整投影会破坏对称性并彻底摧毁疤痕，为开放体系中疤痕的稳定与调控提供思路。", "summary_source": "deepseek", "authors": [{"name": "Weyner Ccuiro"}, {"name": "Rosario Fazio"}, {"name": "Alessandro Silva"}], "featured_authors": [{"name": "Weyner Ccuiro"}, {"name": "Rosario Fazio"}, {"name": "Alessandro Silva"}], "author_count": 3}, {"id": "2610.22275", "category": "quant-ph", "title": "SynDebug: A Framework to Debug Logic Bugs in Fault-Tolerant Quantum Computing Programs", "abstract": "Fault-tolerant quantum computing (FTQC) introduces substantial systems-level complexity through quantum error correction (QEC), making debugging FTQC programs challenging. Existing quantum debugging approaches primarily target logical-level circuits and do not naturally support debugging within realistic FTQC execution flows. We present SynDebug, the first systems-level debugging framework for FTQC programs. SynDebug introduces lightweight assertion-based debugging primitives that operate directly within encoded FTQC infrastructures while avoiding additional logical surface area and minimizing temporal overhead. We evaluate SynDebug across multiple QEC code families, code distances, and encoded workloads, including state preparation, entanglement validation, and Shor-style programs. Our results demonstrate that SynDebug enables practical FTQC debugging with an average 1.8% additional circuit depth overhead (0% in most cases) and no measurable increase in the logical error rate, showing that systems-level debugging for large-scale FTQC applications is both feasible and practical.", "url": "https://arxiv.org/abs/2610.22275", "type": "理论+数值", "summary": "1. 提出首个面向容错量子计算程序的系统级调试框架SynDebug，用于定位编码执行流中的逻辑错误。\n2. 其核心是可直接嵌入编码FTQC基础设施的轻量断言式调试原语，不增加逻辑表面积并尽量压低时间开销。\n3. 在多种QEC码族、码距与编码负载上验证，平均仅增1.8%电路深度且逻辑错误率无可测上升，表明大规模FTQC系统级调试可行。", "summary_source": "deepseek", "authors": [{"name": "Nicholas S. DiBrita"}, {"name": "Jack Lange"}, {"name": "Tirthak Patel"}], "featured_authors": [{"name": "Nicholas S. DiBrita"}, {"name": "Jack Lange"}, {"name": "Tirthak Patel"}], "author_count": 3}, {"id": "2610.22308", "category": "quant-ph", "title": "Classical Capacity of Single-Mode Bosonic Gaussian Channels", "abstract": "The classical capacity of a noisy optical channel is the maximum rate at which information can be transmitted reliably, given a constraint on the mean input energy. For the ubiquitous bosonic Gaussian channels, which include standard models of loss and noise in fibre and free-space optical links, determining this rate requires addressing whether entanglement between channel uses or non-Gaussian signals can outperform Gaussian encodings. More precisely, the question is whether the energy-constrained Holevo information is additive across arbitrarily many channel uses and coincides with its Gaussian counterpart. We answer these fundamental questions in the affirmative for every single-mode bosonic Gaussian channel at every input energy. Namely, we prove that independently prepared Gaussian states with Gaussian-distributed random displacements achieve the capacity, including in the low-energy regime where squeezing the signals competes with encoding information in their displacement. Our proof connects an entanglement inequality to a sharp, additive lower bound on output entropy. We then characterise communication above capacity: under a strict total photon-number cutoff, the probability of correct decoding decreases exponentially with the number of channel uses, and we derive explicit bounds on the decay exponent. When only the mean photon number is constrained, a simple energy-rescaling formula determines exactly the entire asymptotic rate--error trade-off: the capacity at mean photon number $N$ and allowed average decoding error $\\epsilon$ equals the vanishing-error capacity at mean photon number $N/(1-\\epsilon)$. Together, these results identify the ultimate limits of classical communication for some of the most fundamental models of optical communication.", "url": "https://arxiv.org/abs/2610.22308", "type": "理论", "summary": "1. 该工作证明，对每个单模玻色高斯信道及任意输入能量，经典容量均可由独立制备的高斯态与高斯随机位移编码达到，从而正面回答了能量约束下霍列沃信息可加且等于高斯容量的问题。\n2. 其核心是将纠缠不等式与输出熵的尖锐可加下界相联系，在低能量下严格处理压缩与位移编码的竞争，并给出严格总光子数截断时正确译码概率指数衰减的显式界。\n3. 当仅约束平均光子数时，容量在平均光子数N与允许平均译码错误ε下等于N/(1-ε)处的零误差容量，精确刻画渐近速率—错误折衷并界定基本光通信模型的经典通信极限。", "summary_source": "deepseek", "authors": [{"name": "Gerardo Adesso"}, {"name": "Ludovico Lami"}, {"name": "Vittorio Giovannetti"}], "featured_authors": [{"name": "Gerardo Adesso"}, {"name": "Ludovico Lami"}, {"name": "Vittorio Giovannetti"}], "author_count": 3}, {"id": "2610.22357", "category": "quant-ph", "title": "Stability of Quantum LDPC States under Local Pauli Noise", "abstract": "Quantum low-density parity-check (qLDPC) codes have a canonical mixed state---the normalized projector onto the code space---that lies at the intersection of quantum error correction and quantum many-body physics, yet the stability of its information-theoretic structure under local noise remains poorly understood. Recent progress on mixed-state phases of matter has identified the spatial decay of conditional mutual information (CMI) $I(A:C|B)$ as a key diagnostic of such stability, analogous to the role of the spectral gap for quantum ground states. We prove that, for the normalized code-projector state of a $\\mathbb{Z}_d$ qLDPC stabilizer code under local Pauli noise, the CMI across a buffer $B$ separating $A$ from $C$ decays exponentially with the width of $B$ in two complementary noise regimes independent of system size. At weak noise, this holds for full-system tripartitions, where correlations between the two sides require an error cluster to cross the buffer, an exponentially unlikely event. At strong noise, exponential decay holds whenever the buffer supports no logical operator, since correlations can persist only along rare chains of buffer qudits that remain informative. Under an additional space-uniformity assumption, we establish the robustness of Levin--Wen topological entropy. On finite-dimensional lattices of size $n$, the weak-noise bound further implies a constant-layer quasi-local Petz recovery channel of range $O(\\poly(\\log n)/\\varepsilon)$ that recovers the noiseless state within trace-distance error $\\varepsilon$. Both CMI bounds apply to general qLDPC interaction graphs, including geometries where such constant-depth quasi-local recovery need not exist. Thus, the exponential decay of the noise-induced CMI provides a general criterion for mixed-state phase stability.", "url": "https://arxiv.org/abs/2610.22357", "type": "理论", "summary": "1. 量子低密度奇偶校验（qLDPC）码具有规范的混合状态——码空间上的归一化投影——位于量子纠错和量子多体物理的交叉点，但其信息论结构在局部噪声下的稳定性仍然知之甚少。\n2. 在额外的空间均匀性假设下，我们建立了 Levin-Wen 拓扑熵的鲁棒性。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Tai-Hsuan Yang"}, {"name": "Andrew D. Kim"}, {"name": "Akash Vijay"}, {"name": "Jong Yeon Lee"}], "featured_authors": [{"name": "Tai-Hsuan Yang"}, {"name": "Andrew D. Kim"}, {"name": "Akash Vijay"}, {"name": "Jong Yeon Lee"}], "author_count": 4}, {"id": "2610.22367", "category": "quant-ph", "title": "Discovering state-of-the-art quantum circuits with large language models", "abstract": "Significant efforts are currently being directed toward the implementation of large-scale quantum information processors, but realizing useful quantum advantage also requires the development of efficient quantum algorithms. While for many practical problems the dominant resource costs are associated with a small set of computational primitives, optimizing them in the quantum setting presents unique challenges, including a reversibility constraint absent from ordinary classical computation. Here we introduce an evolutionary framework in which large language models (LLMs) propose circuit designs and an independent evaluator verifies and scores them. We apply this framework to tasks spanning numerical computation, chemistry, optimization, quantum simulation, and number theory. In seven of the eight tasks, the discovered circuits significantly reduce both Toffoli and qubit counts relative to the state of the art. In the eighth, the search discovers a new reversible architecture for prime-field modular inversion. By handling reversibility differently, the architecture makes divsteps -- a classical algorithm previously impractical for reversible integer arithmetic -- viable and substantially improves the Toffoli-qubit trade-off for modular inversion. These results open the door for evaluator-guided LLM co-design of new algorithmic structures for quantum computation.", "url": "https://arxiv.org/abs/2610.22367", "type": "理论+数值", "summary": "1. 该工作提出由大语言模型生成量子线路设计、独立评估器验证评分的进化框架，并在数值计算、化学、优化、量子模拟和数论等八项任务上自动搜索线路。\n2. 其核心卖点是七项任务同时显著降低托福利门和量子比特数，第八项为素数域模逆发现新可逆架构，通过不同处理可逆性使经典除法步算法可用于可逆整数算术并改善托福利-量子比特权衡。\n3. 这表明评估器引导的大语言模型协同设计可发现新算法结构，为量子算法优化和可逆算术提供可扩展路径，并启发后续面向资源受限量子处理器的自动线路综合研究。", "summary_source": "deepseek", "authors": [{"name": "Andi Gu"}, {"name": "Alek H. Kemeny"}, {"name": "Susanne F. Yelin"}, {"name": "Mikhail D. Lukin"}], "featured_authors": [{"name": "Andi Gu"}, {"name": "Alek H. Kemeny"}, {"name": "Susanne F. Yelin"}, {"name": "Mikhail D. Lukin"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
