<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-10-16 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

  <div class="shell">

      <h1>Daily ArXiv Selection</h1>
      <p>
        数据来自 arXiv 当天的 <code>cond-mat</code>、<code>hep-th</code>、<code>math-ph</code>、<code>quant-ph</code> 四个分类页，口径限定为 <code>New submissions</code>。
        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。

  <script>
    const papers = [{"id": "2610.20717", "category": "cond-mat", "title": "All-temperature superfluidity in two dimensions", "abstract": "In local theories with short-range interactions, continuous symmetries cannot be spontaneously broken in two spatial dimensions at nonzero temperature. $\\mathrm{U}(1)$-symmetric models instead admit a Berezinskii--Kosterlitz--Thouless (BKT) phase with quasi-long-range order and nonzero phase stiffness, which is normally destroyed at high temperatures by vortex proliferation. Here, we show that a BKT phase, and with it superfluidity, can persist to arbitrarily high temperatures. Using the large-$N$ expansion, we study a $(2+1)$-dimensional quantum field theory in which a complex scalar is coupled to the critical $\\mathrm{O}(N)$ model. At the biconical fixed point, where the inter-sector coupling is negative, the thermal effective potential has a circle of minima with nonzero $\\mathrm{U}(1)$ amplitude. Integrating out the gapped fluctuations yields an effective theory for the compact phase mode at distances large compared to $1/T$. Since temperature is the only scale at the fixed point, the phase stiffness grows linearly with temperature, with a proportionality factor that scales linearly with $N$ and is fixed entirely by the fixed point. This renders vortex operators irrelevant for sufficiently large $N$. We further show that the vortex fugacity is exponentially small in $N$.", "url": "https://arxiv.org/abs/2610.20717", "type": "理论", "summary": "1. 该工作用大N展开研究复标量与临界O(N)模型耦合的(2+1)维量子场论，表明二维BKT相及超流可延伸至任意高温。\n2. 其卖点是双锥固定点负耦合使热有效势出现U(1)振幅非零的极小圆，相位刚度∝T且系数∝N，涡旋逸度随N指数小、算符在大N下无关。\n3. 这暗示二维量子临界点中BKT准长程有序与超流可突破涡旋增殖的高温限制，但需检验有限N及具体实验平台上该机制的稳健性。", "summary_source": "deepseek", "authors": [{"name": "Bilal Hawashin"}, {"name": "Soumyadeep Chaudhuri"}, {"name": "Igor F. Herbut"}, {"name": "Michael M. Scherer"}], "featured_authors": [{"name": "Bilal Hawashin"}, {"name": "Soumyadeep Chaudhuri"}, {"name": "Igor F. Herbut"}, {"name": "Michael M. Scherer"}], "author_count": 4}, {"id": "2610.20723", "category": "cond-mat", "title": "Boundary-induced geometrical frustration in a square Rydberg-atom lattice", "abstract": "We study geometric defects in square-lattice Rydberg-atom arrays induced by lattice-size parity in the striated density-wave phase. While odd-sized lattices select a single striated domain, even-sized lattices seed incompatible domains at the four corners, resulting in a {\\pi}/2-rotation invariant state with a geometrical defect emanating from the lattice center. At larger detunings, we instead identify a {\\pi}-rotation-invariant state with two domains nucleated by opposite corners and separated by a one-dimensional diagonal defect. We probe the state-preparation protocol on the Aquila atomic quantum processor and benchmark it with equilibrium and real-time dynamics tensor-network simulations. Our results assess the role of boundaries and lattice size in determining the global ordering in programmable quantum matter.", "url": "https://arxiv.org/abs/2610.20723", "type": "理论+数值", "summary": "1. 该工作在方形里德堡原子阵列的条纹密度波相中，研究了晶格尺寸奇偶性导致的边界诱导几何阻挫与缺陷。\n2. 其核心卖点是奇数尺寸选单一条纹畴，偶数尺寸四角畴不相容，产生π/2旋转不变中心缺陷；较大失谐下出现π旋转不变的一维对角缺陷分隔态。\n3. 结合Aquila量子处理器态制备与张量网络平衡及实时动力学基准，该工作表明边界和晶格尺寸能决定可编程量子物质的全局有序。", "summary_source": "deepseek", "authors": [{"name": "Marco Rigobello"}, {"name": "Luka Pavešić"}, {"name": "Daniel Jaschke"}, {"name": "Pietro Silvi"}, {"name": "Marco Di Liberto"}, {"name": "Simone Montangero"}, {"name": "Simone Notarnicola"}], "featured_authors": [{"name": "Marco Rigobello"}, {"name": "Luka Pavešić"}, {"name": "Daniel Jaschke"}, {"name": "Marco Di Liberto"}, {"name": "Simone Montangero"}, {"name": "Simone Notarnicola"}], "author_count": 7}, {"id": "2610.20724", "category": "cond-mat", "title": "Long-lived local coherences at high temperature from frozen domain walls", "abstract": "Local coherences between distinct charge sectors--measured by the single-particle Green's function or the transverse spin autocorrelation function--do not overlap with hydrodynamic modes. At finite temperature, therefore, they decay faster than any power law in generic chaotic systems. We present a mechanism by which these coherences can persist anomalously long, for integrable and chaotic spin chains (including the XXZ and Fredkin spin chains) that obey a quantum group symmetry. We show--using a Mazur bound derived from the quantum-group symmetry, together with locality and a \"non-undershoot\" assumption--that the transverse spin autocorrelation function $C(t) \\equiv \\langle \\sigma^-_x(t) \\sigma^+_x(0)\\rangle$ can decay at most algebraically: $C(t) \\gtrsim 1/t^2$. This bound is not tight: in the large-anisotropy limit of the XXZ spin chain, at infinite temperature, we explicitly compute $C(t) \\sim \\sqrt{3}/(18 \\sqrt{t})$. We also compute this decay rate in the XXZ spin chain for general easy-axis anisotropy, and estimate it to scale as $C(t) \\sim t^{-2/z}$ (for transport exponent $z$) in the chaotic models.", "url": "https://arxiv.org/abs/2610.20724", "type": "理论", "summary": "1. 该工作提出由冻结畴壁在高温下产生长寿命局域相干的机制，聚焦不同电荷扇区间的横向自旋自关联。\n2. 核心卖点是对具量子群对称的可积与混沌自旋链，借马祖尔界、局域性及非下冲假设证明 C(t) 不会快于 1/t² 衰减，并在XXZ大各向异性无穷温下精确给出 C(t)∼√3/(18√t)。\n3. 这既说明此类相干可不重叠流体力学模式而代数慢衰，也预示混沌链中衰减指数由输运指数 z 控制，即 C(t)∼t^{-2/z}。", "summary_source": "deepseek", "authors": [{"name": "Sarang Gopalakrishnan"}, {"name": "Romain Vasseur"}], "featured_authors": [{"name": "Sarang Gopalakrishnan"}, {"name": "Romain Vasseur"}], "author_count": 2}, {"id": "2610.20734", "category": "cond-mat", "title": "Quantum oscillations in a solvable model of a Kondo insulator", "abstract": "We study the effects of interactions on the low-energy density of states (SdH) and magnetization (dHvA) quantum oscillations (QOs) in a Kondo insulator. Toward this end we introduce a generalization of the periodic Anderson model with Sachdev-Ye-Kitaev (SYK) interactions at each site that is exactly solvable in the large-$N$ limit, where $N$ is the number of flavors of the heavy $f$ electrons. We show analytically and numerically that the insulating state remains stable in terms of spectrum, thermodynamics, and transport at low temperatures even for interaction strengths much larger than non-interacting band gap of the hybridization-gap insulator. We analytically derive generalizations of Lifshitz-Kosevich (LK) formulae, distinct for the SdH and dHvA QOs, for the interacting insulator. We find that the SdH oscillation frequencies, $F_0\\pm \\delta F$, corresponding to the conduction and valence band edges, can be weakly renormalized by interaction relative to their non-interacting values. In contrast, dHvA QO frequency $F_0$ is not renormalized by interactions, and remains the same as that for the non-interacting unhybridized bands. The QO amplitudes show a remarkable difference: the dHvA amplitude is essentially unaffected by interactions, while the SdH amplitude is strongly enhanced due to gap renormalization.", "url": "https://arxiv.org/abs/2610.20734", "type": "理论+数值", "summary": "1. 该工作构造了每格点含SYK相互作用、大N极限精确可解的周期Anderson模型，并研究相互作用对Kondo绝缘体中SdH与dHvA量子振荡的影响。\n2. 解析与数值表明，即使相互作用远大于杂化带隙，绝缘态在谱、热力学和低温输运中仍稳定；推导的LK公式显示dHvA频率与非杂化能带相同且振幅几乎不变，而SdH频率仅弱重整、振幅因能隙重整化显著增强。\n3. 这为强关联Kondo绝缘体的量子振荡提供精确可解基准，并提示SdH与dHvA的差异化响应可作为探测相互作用与杂化能隙重整的判据。", "summary_source": "deepseek", "authors": [{"name": "Abhisek Samanta"}, {"name": "Mohit Randeria"}, {"name": "Sumilan Banerjee"}], "featured_authors": [{"name": "Abhisek Samanta"}, {"name": "Mohit Randeria"}, {"name": "Sumilan Banerjee"}], "author_count": 3}, {"id": "2610.20755", "category": "cond-mat", "title": "Resonant enhancement of Raman scattering in a MoS$_2$ nanotube", "abstract": "The whispering-gallery modes confined in the wall of a multiwall MoS$_2$ nanotube resonantly enhance the spontaneous Raman scattering by its own optical phonons. The enhancement is doubly resonant --- pump and Stokes waves hit two adjacent modes at one pump energy, and the signal scales as $(Q_{\\rm pump}Q_{\\rm sc})^2$ - whenever a phonon energy matches the free spectral range of the mode ladder. Near the A exciton the excitonic dispersion compresses the ladder and sweeps its spacing through all intralayer phonon energies of MoS$_2$, so the match, reached for $A_{1g}$ at $E_{\\rm pump}=1551$~meV, requires no geometric tuning. A missed match splits the excitation peak into a pump- and a scattered-resonant doublet whose splitting measures the residual detuning. Selection rules confine the double resonance to the TM$\\to$TM channel and exclude $E_{1g}$.", "url": "https://arxiv.org/abs/2610.20755", "type": "理论", "summary": "1. 该工作分析多壁MoS2纳米管壁中回音壁模式对其自身光学声子自发拉曼散射的共振增强。\n2. 双共振中泵浦与Stokes命中相邻回音壁模式，信号按(Q_pumpQ_sc)^2增强；近A激子压缩阶梯使A1g在1551 meV处无需几何调谐匹配。\n3. 失配时泵浦与散射共振峰分裂，其劈裂量度残余失谐；选择定则把双共振限制在TM→TM通道并排除E1g。", "summary_source": "deepseek", "authors": [{"name": "D.R. Kazanov"}, {"name": "A.V. Poshakinskiy"}], "featured_authors": [{"name": "D.R. Kazanov"}, {"name": "A.V. Poshakinskiy"}], "author_count": 2}, {"id": "2610.20886", "category": "cond-mat", "title": "Material dependence of direct light-induced charge injection from metallic nanoparticles into adsorbates", "abstract": "Direct injection of charge from metallic nanoparticles into adsorbed molecules via the chemical interface damping of localized surface plasmons has emerged as a promising avenue to avoid the rapid thermalization of hot carriers. In this paper, we develop an approach for predicting hot-electron and hot-hole injection rates from large spherical nanoparticles into adsorbed carbon monoxide (CO) molecules. The approach combines a detailed description of the adsorbate-metal interactions via ab initio density functional theory with a macroscopic electrodynamics treatment of the localized surface plasmon. We apply this approach to nine different metals including both traditional (Ag, Au, Cu) and emerging (Al) plasmonic metals as well as non-plasmonic metals (Ni, Rh, Pd, Ir, Pt). For all metals, hot-electron injection is larger than hot-hole injection. This is a consequence of the alignment of the CO frontier orbitals, with the CO lowest unoccupied molecular orbital (LUMO) being closer to the metal Fermi energy than the highest occupied molecular orbital (HOMO). The largest electron injection rates in the optical photon ranges are obtained for Al, Ag, Cu and Au, with Cu and Au showing significant plasmonic enhancement. The non-plasmonic metals show weak electron injection as a consequence of their high LUMO energies relative to the metal Fermi level. The results of our study pave the way towards a rational design of metallic nanoscale photocatalysts for specific chemical processes.", "url": "https://arxiv.org/abs/2610.20886", "type": "理论+数值", "summary": "1. 该工作发展了一套结合从头算密度泛函理论与宏观电动力学的框架，用于预测大尺寸球形金属纳米颗粒向吸附CO分子的热电子/热空穴直接注入速率。\n2. 其核心贡献在于对九种金属的系统计算表明，CO的LUMO比HOMO更靠近费米能级，使热电子注入普遍强于热空穴；光学波段中Al、Ag、Cu、Au注入率最高，其中Cu和Au具显著等离激元增强，非等离激元金属则因LUMO偏高而注入弱。\n3. 这为面向特定化学过程理性设计金属纳米光催化剂提供了明确的理论依据与启示。", "summary_source": "deepseek", "authors": [{"name": "Jordan Alan Edwards"}, {"name": "Johannes Lischner"}], "featured_authors": [{"name": "Jordan Alan Edwards"}, {"name": "Johannes Lischner"}], "author_count": 2}, {"id": "2610.20897", "category": "cond-mat", "title": "Casimir Sign Reversal from Finite-Range Bogoliubov Fluctuations", "abstract": "We study the zero-temperature Casimir effect of a three-dimensional Bose fluid with finite-range corrections to its Bogoliubov spectrum. Beyond the universal acoustic contribution scaling as $L^{-3}$, the long-distance expansion contains a nonuniversal $L^{-5}$ correction that can compete with the phononic term. We derive this crossover analytically within a minimal isotropic finite-range model and test the asymptotic result against the full dispersion. A regulator-independent Poisson-resummed calculation confirms that sign reversals of the Casimir energy are possible, while showing that the apparent low-coupling zero inferred by balancing only the $L^{-3}$ and $L^{-5}$ terms is not quantitatively controlled. Robust sign changes instead occur in the stable regime close to roton softening, where the Casimir energy acquires an oscillatory finite-momentum contribution. Strongly dipolar atomic gases provide a natural motivation for microscopic interaction lengths in the nanometric regime. We further discuss how the resulting nonlinear force law could be probed through the frequency response of a driven nanomechanical resonator.", "url": "https://arxiv.org/abs/2610.20897", "type": "理论+数值", "summary": "1. 该工作研究了有限程Bogoliubov谱修正下三维玻色流体的零温Casimir效应，并在最小各向同性有限程模型中解析给出长程展开的L^{-3}与L^{-5}项竞争及交叉。\n2. 其核心卖点是通过与正则化无关的Poisson重求和计算，证明Casimir能符号反转可在近转子软化稳定区稳健出现，且由有限动量振荡贡献主导，而非仅平衡L^{-3}与L^{-5}得到的低耦合零点。\n3. 这为强偶极原子气体中纳米尺度相互作用长度及通过驱动纳米机械谐振子频率响应探测非线性力律提供了可检验启示。", "summary_source": "deepseek", "authors": [{"name": "Fabrizio Canfora"}, {"name": "Pablo Pais"}, {"name": "Luigi Rosa"}], "featured_authors": [{"name": "Fabrizio Canfora"}, {"name": "Pablo Pais"}, {"name": "Luigi Rosa"}], "author_count": 3}, {"id": "2610.20953", "category": "cond-mat", "title": "Denser-than-crystalline disordered polydisperse ellipse packings", "abstract": "By employing SWAP Monte Carlo moves during slow Lubachevsky-Stillinger-like particle growth, we generate well-thermalized disordered jammed ellipse packings for a wide range of particle aspect ratios $\\alpha$ and maximum/minimum particle-diameter ratios $\\lambda$. For $\\lambda > \\lambda_{\\rm xtal}(\\alpha)$, the packings are denser than the perfect monodisperse ellipse crystal ($\\phi_{\\rm xtal}^{\\rm mono} = \\pi/2\\sqrt{3} \\simeq 0.9069$) despite lacking any obvious long-range structural order; we find that $\\lambda_{\\rm xtal}(\\alpha)$ remains below $2.88$ over the range $1 \\leq \\alpha \\leq 5$, and drops below $1.65$ for $\\alpha \\simeq 1.2$. These disordered $\\phi > \\phi_{\\rm xtal}^{\\rm mono}$ packings are the first of their kind reported for anisotropic particles. Multiscale analyses reveal that their characteristic structural motifs are strongly $\\alpha$- and $\\lambda$-dependent, but none of the examined metrics change sharply as the $\\lambda = \\lambda_{\\rm xtal}(\\alpha)$ boundary is crossed. For example, we find that packings with $\\alpha \\simeq 1.2$ and $\\lambda \\simeq \\lambda_{\\rm xtal}(\\alpha)$ exhibit a fractionated-hexatic-plastic-polycrystalline structure that (like that of the recently-reported ideal disk glasses) can be exactly-isostatic, triangulated, and effectively-hyperuniform with respect to packing-fraction fluctuations. In contrast, even-denser packings with larger $\\alpha$ and $\\lambda$ have none of these properties.", "url": "https://arxiv.org/abs/2610.20953", "type": "理论+数值", "summary": "1. 通过在类似 Lubachevsky-Stillinger 的颗粒缓慢生长过程中采用 SWAP 蒙特卡罗移动，我们生成了良好热化的无序堵塞椭圆填料，适用于各种颗粒长宽比 $\\alpha$ 和最大/最小颗粒直径比 $\\lambda$。\n2. 例如，我们发现具有 $\\alpha \\simeq 1.2$ 和 $\\lambda \\simeq \\lambda_{\\rm xtal}(\\alpha)$ 的填料表现出分级六方塑料多晶结构，该结构（如最近报道的理想圆盘玻璃的结构）可以是完全等静压的、三角化的，并且相对于填料分数波动而言是有效超均匀的。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Kinsley G. Trlak"}, {"name": "Dewni S. de Silva"}, {"name": "Salvatore Torquato"}, {"name": "Robert S. Hoy"}], "featured_authors": [{"name": "Kinsley G. Trlak"}, {"name": "Dewni S. de Silva"}, {"name": "Salvatore Torquato"}, {"name": "Robert S. Hoy"}], "author_count": 4}, {"id": "2610.20963", "category": "cond-mat", "title": "Fisher information analysis of a Langevin System with Thermal and Athermal Noise", "abstract": "Fisher Information (FI) has proven to be a useful tool for estimating the parameters of a system when only statistical data are available. We apply this method to a system of Langevin equations analogous to the Brownian Gyrator, in which the coupling parameter $b$ and the athermal noise strength $D$ are treated as unknown quantities. Using the FI, we discuss the estimation of the coupling parameter between the degrees of freedom and the quantity $D$ associated with the external noise effects. We find that the diagonal components of the FI exhibit nontrivial behavior, whereas the off-diagonal components display a monotonic dependence on the parameters of interest. This distinction may contribute to an accurate estimation of $b$ and $D$.", "url": "https://arxiv.org/abs/2610.20963", "type": "理论", "summary": "1. 该工作将Fisher信息方法用于一类同时含热噪声与非热噪声的Langevin系统，类比Brownian Gyrator，并把自由度间耦合参数b和非热噪声强度D视为待估未知量。\n2. 其要点在于Fisher信息矩阵对角元随参数呈现非平凡行为，而非对角元对b和D单调依赖，这一差异有助于更准确地联合估计耦合与外部噪声强度。\n3. 这为从统计涨落数据中反演非平衡系统参数提供了可操作判据，并可能启发后续实验与理论对Brownian Gyrator类平台的噪声与耦合测量。", "summary_source": "deepseek", "authors": [{"name": "Eduardo S. Nascimento"}, {"name": "Welles A. M. Morgado"}], "featured_authors": [{"name": "Eduardo S. Nascimento"}, {"name": "Welles A. M. Morgado"}], "author_count": 2}, {"id": "2610.20982", "category": "cond-mat", "title": "The Blume-Capel Model as a $ϕ^6$ Field Theory: A Monte Carlo and Flow Model Study", "abstract": "We report Monte Carlo simulations of a continuous spin variant of the Blume-Capel model. We compute the phase diagrams in the crystal-field-temperature plane, as a function of the softness of the spins. We show that normalizing flows, a class of generative models capable of direct sampling without autocorrelation, are effective samplers across the phase diagram, including in the first-order transition region and in the vicinity of the tricritical point. Finite-size scaling analyses of flow samples locate the first- and second-order transitions as well as the tricritical point with accuracy comparable to canonical and extended-ensemble Monte Carlo.", "url": "https://arxiv.org/abs/2610.20982", "type": "理论+数值", "summary": "1. 该工作将Blume-Capel模型视为φ^6场论，用连续自旋变体开展蒙特卡洛模拟，并在晶体场-温度平面计算随自旋软度变化的相图。\n2. 其技术卖点是利用归一化流实现无自相关直接采样，证明其在包括一级相变区和三临界点附近仍有效，且流样本的有限尺寸标度能以与经典及扩展系综蒙特卡洛相当的精度定位一级、二级相变和三临界点。\n3. 这为以生成模型高效探索含一级相变与三临界点的场论相图提供了可行方案，并可启发其他复杂相变体系的采样与有限尺寸分析。", "summary_source": "deepseek", "authors": [{"name": "Ejaaz Merali"}, {"name": "Ryan Larson"}, {"name": "Ehsan Khatami"}, {"name": "Richard T. Scalettar"}], "featured_authors": [{"name": "Ejaaz Merali"}, {"name": "Ryan Larson"}, {"name": "Ehsan Khatami"}, {"name": "Richard T. Scalettar"}], "author_count": 4}, {"id": "2610.21050", "category": "cond-mat", "title": "Large Language Model-Assisted Systematic Study of Anomalous Adsorption Phenomena", "abstract": "Soft porous crystals can undergo guest-induced structural transitions producing unconventional adsorption isotherms, which are valuable for gas separation and storage applications. However, the evidence for these transitions is scattered across the literature in narrative form and has not been aggregated. Here we use a large language model pipeline to mine the literature for anomalous adsorption, extracting phase-transition events together with material, adsorbate, temperature and pressure metadata and classifying each into an established behavioural class. Benchmarked against human annotation, the extraction stage attains an F1 score of 0.96. When applied at scale, the pipeline yields a curated corpus of 547 transitions across 240 distinct materials, drawn from 200 of 4,252 screened publications, which we further link to crystallographic structures. Analysis of this database shows that the principal behavioural classes, gate-opening and breathing, are distinguished by their functional response. Gate-opening frameworks transform at a significantly lower pressure than breathing frameworks (p = 3.8E-3). In contrast, no difference in pore size, void fraction, linker chemistry or metal identity was detected between the classes. Our findings argue for a functional rather than purely structural description of responsive porous materials. They also highlight the need for a community database that records the guest, temperature and pressure of every reported transition of these materials.", "url": "https://arxiv.org/abs/2610.21050", "type": "理论", "summary": "1. 该工作构建大语言模型辅助的文献挖掘流程，系统提取软孔晶体中由客体诱导的结构转变即异常吸附事件，并整合材料、吸附质、温度与压力等元数据，按既有行为类别分类。\n2. 其在人工标注基准上取得0.96的F1提取分数，并从4252篇文献中筛出200篇，汇编240种材料的547个转变并与晶体结构关联，发现门控与呼吸两类行为主要由压力响应函数区分：门控转变压力显著更低（p=3.8E-3），而孔径、空隙率、连接基化学和金属种类无差异。\n3. 这支持以功能而非纯结构描述响应性多孔材料，并呼吁建立记录每次转变的客体、温度和压力的社区数据库。", "summary_source": "deepseek", "authors": [{"name": "Fengxu Yang"}, {"name": "Matthew L. Schneider"}, {"name": "Weitong Chen"}, {"name": "Jack D. Evans"}], "featured_authors": [{"name": "Fengxu Yang"}, {"name": "Matthew L. Schneider"}, {"name": "Weitong Chen"}, {"name": "Jack D. Evans"}], "author_count": 4}, {"id": "2610.21155", "category": "cond-mat", "title": "Localized states of the non-Hermitian Schr{ö}dinger equation with a complex $1/r^{2}$ potential: from Efimov states to bipolarons", "abstract": "We study the non-Hermitian Schrödinger equation with a complex $1/r^{2}$ potential, which bridges Hermitian few-body and non-Hermitian many-body physics: a real attractive potential describes Efimov bound states, whereas a purely imaginary one describes the medium-induced interaction between two heavy polarons at large separations. We solve this equation analytically, obtaining both the localized and continuum states, and compare the solutions with numerical and WKB results. As the imaginary part of the potential is increased, the energies of the Efimov bound states acquire imaginary parts and rotate counterclockwise in the complex plane. On approaching the purely imaginary potential, the excited states disappear sequentially, while the Efimov ground state is smoothly connected to a bipolaron state localized at short distance. Such a bipolaron is localized solely by the medium-induced imaginary interaction, without any attractive real potential. Solving the equation by finite differences, we find that each bipolaron state is necessarily accompanied by another localized state that oscillates on the scale of the mesh size and hence has no counterpart in the continuum limit. Each such pair coalesces at an exceptional point as the strength of the purely imaginary potential is varied, whereas the coalescence is lifted once a finite real part is introduced. We show that this behavior originates from a symmetry of the discretized Schrödinger equation that holds for any purely imaginary potential.", "url": "https://arxiv.org/abs/2610.21155", "type": "理论+数值", "summary": "1. 我们研究了具有复杂 $1/r^{2}$ 势的非厄米薛定谔方程，该方程连接了厄米少体和非厄米多体物理：真正的吸引势描述了 Efimov 束缚态，而纯虚数则描述了大间距下两个重极化子之间的介质诱导相互作用。\n2. 当纯虚势的强度变化时，每个这样的对在一个特殊点处合并，而一旦引入有限实部，合并就会解除。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Kyoka Tsunoda"}, {"name": "Kazuki Yamamoto"}, {"name": "Shimpei Endo"}], "featured_authors": [{"name": "Kyoka Tsunoda"}, {"name": "Kazuki Yamamoto"}, {"name": "Shimpei Endo"}], "author_count": 3}, {"id": "2610.21288", "category": "cond-mat", "title": "Dynamical phase transition for a logarithm observable in chaotic systems", "abstract": "We consider the full distribution $P_N(A)$ of the dynamical observable $A = - \\sum_{i=1}^N \\ln x_i$ where $x_1, \\dots, x_N$ is a sequence generated by a chaotic map $f(x)$ via $x_{n+1} = f(x_n)$. We study the particular cases where $f(x)$ is the doubling, tent or logistic map, and focus on the limit $N \\gg 1$. Typical fluctuations of $A$ are Gaussian with mean $\\left\\langle A\\right\\rangle$ and variance which are both of order $\\sim N$. We find that the left tail of the distribution ($A < \\left\\langle A\\right\\rangle$) scales as $P_{N}(A) \\sim e^{-NI(A/N)}$, and calculate the rate function $I(a)$ which depends on the map $f(x)$. Interestingly, we find that the right tail of the distribution ($A > \\left\\langle A\\right\\rangle$) follows an anomalous scaling: $P_{N}(A) \\sim e^{-N^{1/3} F((A-\\left\\langle A\\right\\rangle) / N^{2/3})}$. The large-deviation function $F(y)$ has a universal form for the three maps, differing only in the scaling constants. At a critical value $y=y_c$, it exhibits a corner singularity which has the character of a condensation transition. The transition separates between a subcritical phase $0< y<y_c$ in which the fluctuations are Gaussian and arise homogeneously from all of the $x_i$'s, and a supercritical phase $y>y_c$ in which a small fraction of the $x_i$'s give a macroscopic contribution to the fluctuation. Despite this anomalous behavior of the right tail, we find that the cumulants of the distribution $P_N(A)$ grow linearly with $N$ at large $N$, and calculate the associated coefficients.", "url": "https://arxiv.org/abs/2610.21288", "type": "理论", "summary": "1. 该工作计算了倍增、帐篷和逻辑斯谛混沌映射下对数型观测量 A=-∑ln x_i 在大 N 时的全分布。\n2. 左尾为标准大偏差 e^{-N I(A/N)}，右尾则呈 e^{-N^{1/3}F((A-⟨A⟩)/N^{2/3})} 的异常标度，F 对三种映射普适且在 y_c 出现凝聚型角奇异。\n3. 该转变区分均匀高斯涨落与少数 x_i 主导的凝聚相，并表明异常右尾下累积量仍线性增长。", "summary_source": "deepseek", "authors": [{"name": "Lucianno Defaveri"}, {"name": "Naftali R. Smith"}], "featured_authors": [{"name": "Lucianno Defaveri"}, {"name": "Naftali R. Smith"}], "author_count": 2}, {"id": "2610.21317", "category": "cond-mat", "title": "Thermodynamic-limit bootstrap: Solving fractional quantum Hall ground states", "abstract": "Strongly interacting ground states are usually computed in finite systems and then extrapolated to the thermodynamic limit (TDL). Here we develop a quantum many-body bootstrap that solves fractional quantum Hall ground states directly in the TDL. The method gives rigorous and quantitatively tight lower bounds on the ground-state energy and identifies the ground-state structure and topological order. For Laughlin and Pfaffian parent Hamiltonians, it reproduces exact pair-correlation functions and low-lying orbital entanglement spectrum (OES) nearly level by level. For Coulomb interactions, the rigorous TDL energy bounds closely match thermodynamic estimates from exact diagonalization and density-matrix renormalization group (DMRG) extrapolations, and the local diagnostics recover established Laughlin and Moore--Read OES counting and Friedel oscillations of the composite Fermi liquid. Beyond these benchmarks, the bootstrap resolves the thermodynamic ground states at $\\nu=1/4$ and $\\nu=12/5$, identifying a composite Fermi liquid and $\\overline{\\mathrm{RR}}_3$ topological order, respectively. The same framework applies equally well to Abelian and non-Abelian, gapped and gapless quantum Hall states. The TDL bootstrap therefore provides a general ground-state solver that determines both the energy and the state directly in the TDL.", "url": "https://arxiv.org/abs/2610.21317", "type": "理论+数值", "summary": "1. 该工作发展了热力学极限下的量子多体 bootstrap 方法，直接在无穷大体系极限求解分数量子霍尔基态，并给出基态能量的严格下界以及基态结构与拓扑序的判定。\n2. 其技术核心在于把 bootstrap 约束推广到热力学极限，可近乎逐能级重现 Laughlin/Pfaffian 母哈密顿量的对关联函数与低能轨道纠缠谱，并对库仑相互作用给出与 ED、DMRG 外推一致的能量下界和局域诊断。\n3. 该方法进一步分辨了 ν=1/4 的复合费米液体与 ν=12/5 的 \\overline{RR}_3 拓扑序，且统一适用于阿贝尔/非阿贝尔、有能隙/无能隙量子霍尔态，为直接求解热力学极限基态提供了通用框架。", "summary_source": "deepseek", "authors": [{"name": "Qiang Gao"}, {"name": "Taige Wang"}], "featured_authors": [{"name": "Qiang Gao"}, {"name": "Taige Wang"}], "author_count": 2}, {"id": "2610.21369", "category": "cond-mat", "title": "Pairing-channel reconstruction by Ising spin-orbit coupling in a multiorbital triangular-lattice model", "abstract": "Ising spin-orbit coupling (SOC) is widely known for locking electronic spins and protecting superconductivity against in-plane paramagnetic pair breaking. Here we show that, in a correlated multiorbital system, Ising SOC can play a qualitatively different role: it reconstructs the hierarchy of spin-fluctuation-mediated pairing channels by reshaping the low-energy Fermi surfaces, orbital-spin coherence factors, and momentum-resolved scattering phase space. We study a noncentrosymmetric two-orbital triangular-lattice model with Rashba SOC, Ising SOC, and onsite SOC. We solve the pairing problem within a multiorbital random-phase-approximation framework. In the single-orbital limit, an $E$-representation state with a dominant $S_z=0$ component emerges only at relatively strong Ising SOC. Orbital degrees of freedom facilitate the stabilization of this pairing state at a smaller nominal Ising SOC strength and generate a broad competition between $E$ and $A_1$ pairing channels. The $E$ state can maintain the same $S_z=0$ triplet character, whereas the $A_1$ state becomes a fully gapped sign-changing $\\splusminus$ superconductor. The latter also realizes a topologically nontrivial phase in the time-reversal-invariant weak-pairing regime, with a nonzero $\\mathbb{Z}_2$ index, Wilson-loop spectral flow, and boundary modes. Its topology is not carried by a single orbital pairing component, but emerges cooperatively from the dominant intra- and inter-orbital pairing components. These results establish a microscopic route by which Ising SOC and orbital hybridization can reconstruct interaction-driven superconductivity, producing both Ising-triplet and topological singlet-dominated phases in correlated non-centrosymmetric systems.", "url": "https://arxiv.org/abs/2610.21369", "type": "理论+数值", "summary": "1. 伊辛自旋轨道耦合 (SOC) 因锁定电子自旋和保护超导免受面内顺磁对断裂而广为人知。\n2. 后者还实现了时间反转不变弱配对机制中的拓扑非平凡相，具有非零 $\\mathbb{Z}_2$ 索引、威尔逊环谱流和边界模式。\n3. $E$ 态可以保持相同的 $S_z=0$ 三元组字符，而 $A_1​​$ 态则成为完全带隙的变号 $\\splusminus$ 超导体。", "summary_source": "local-fallback", "authors": [{"name": "Lichuan Wang"}, {"name": "Yuhang Xiao"}, {"name": "Ran Wang"}, {"name": "Xinliang Huang"}, {"name": "Ning Hao"}], "featured_authors": [{"name": "Lichuan Wang"}, {"name": "Yuhang Xiao"}, {"name": "Ran Wang"}, {"name": "Xinliang Huang"}, {"name": "Ning Hao"}], "author_count": 5}, {"id": "2610.21416", "category": "cond-mat", "title": "Edge state reconstruction in proximitized graphene and its probe using RKKY interaction", "abstract": "Proximity induced spin-orbit coupling (SOC) in graphene emerges when it is placed on a substrate, breaking sublattice symmetry and giving rise to staggered intrinsic SOC together with Rashba spin-orbit coupling. In zigzag graphene nanoribbons, this staggered SOC produces pseudohelical edge states exhibiting sublattice-locked rather than spin-locked helicity. We investigate the effect of a finite on-site potential, restricted to the edges of the ribbon, on these edge states. We find the inter-valley edge states undergo reconstruction and become purely intra-valley, exhibiting both spin and valley polarization. The charge conductance calculations fail to capture this reconstruction, since the number of transmitted channels remains unchanged. We show that the Ruderman-Kittel-Kasuya-Yosida (RKKY) magnetic exchange interaction, between two magnetic impurities situated on the ribbon edge can be used to probe the shifted band dispersion, for both the uniform and staggered spin-orbit coupling. In the presence of strong intrinsic and Rashba SOC, the RKKY interaction becomes fully anisotropic. Both sublattice staggering and edge potential-induced reconstruction lead to distinct features in the RKKY interaction. We show that the RKKY interaction terms acquire faster oscillations as a function of the spatial separation between two magnetic impurities, in response to the edge state reconstruction, establishing it as an effective probe of the edge states. Additionally, the significant mismatch in the amplitudes of the DM term corresponding to the uniform and staggered SOC, can also act as a probe of the type of SOC.", "url": "https://arxiv.org/abs/2610.21416", "type": "理论+数值", "summary": "1. 该工作研究了近邻诱导自旋轨道耦合的石墨烯锯齿纳米带中，仅施加于边缘的有限在位势如何重构边缘态，并用边缘磁性杂质间的RKKY相互作用进行探测。\n2. 其核心物理在于边缘在位势使跨谷边缘态重构为纯谷内态并产生自旋与谷极化，而电荷电导因透射通道数不变无法捕获该重构；边缘RKKY交换相互作用对能带位移敏感，在强内禀与Rashba耦合下呈完全各向异性，并随杂质间距呈现更快振荡，DM项振幅失配还可区分SOC类型。\n3. 这为利用RKKY磁响应探测近邻石墨烯边缘态重构及自旋轨道耦合类型提供了可行途径，并凸显电导测量之外磁探针在低维拓扑/自旋电子学中的价值。", "summary_source": "deepseek", "authors": [{"name": "Seerat Khan"}, {"name": "SK Firoz Islam"}], "featured_authors": [{"name": "Seerat Khan"}, {"name": "SK Firoz Islam"}], "author_count": 2}, {"id": "2610.21580", "category": "cond-mat", "title": "Flat-band ferrimagnetism in the edge-centered honeycomb antiferromagnet: From harmonic flat magnon to broad continuum", "abstract": "One of the most striking aspects of a flat band is not merely its lack of dispersion, but that it reduces the single-particle kinetic energy to a very small scale, allowing interaction effects to become the dominant energy scale in the low-energy physics. This picture has underpinned concepts such as flat-band ferromagnetism, flat-band superconductivity, and localized magnons. A more fundamental question, however, remains. Flat bands belong to the language of single-particle or linear-spin-wave physics; whether they survive as protected sharp excitations in a genuine many-body quantum magnet, or merely provide a skeleton of spectral weight left by the noninteracting picture, remains unclear. We study the spin-1/2 Heisenberg antiferromagnet on the edge-centered honeycomb lattice to examine this question. In contrast to flat bands in geometrically frustrated magnets such as kagome, this lattice has a 2:3 sublattice imbalance that renders the intersublattice coupling matrix rectangular, whose null space gives rise to a flat band at the single-particle level. The same imbalance stabilizes a ferrimagnetic ground state through the Lieb--Mattis theorem and leads to an edge-site-localized flat magnon in linear spin-wave theory. Combining linear spin-wave theory, sign-problem-free stochastic series expansion quantum Monte Carlo, and stochastic analytic continuation, we find that quantum fluctuations transform this harmonic flat mode into a broad continuum whose centroid is about 1.55J and nearly dispersionless along the high-symmetry path. Sublattice imbalance thus offers an unfrustrated route that unifies flat bands and ferrimagnetism, and suggests that flat-band geometry organizes many-body spectral weight rather than giving rise to a protected quasiparticle.", "url": "https://arxiv.org/abs/2610.21580", "type": "理论+数值", "summary": "1. 平带最引人注目的方面之一不仅仅是它缺乏色散，而且它将单粒子动能降低到非常小的尺度，使相互作用效应成为低能物理中的主要能量尺度。\n2. 同样的不平衡通过利布-马蒂斯定理稳定了亚铁磁基态，并导致线性自旋波理论中的边缘位置局域平面磁振子。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Sicheng He"}, {"name": "Zhixuan Zhao"}, {"name": "Hanxiang Di"}, {"name": "Shuaihua Zhang"}, {"name": "Yanling Wu"}, {"name": "Jun Li"}], "featured_authors": [{"name": "Sicheng He"}, {"name": "Zhixuan Zhao"}, {"name": "Hanxiang Di"}, {"name": "Shuaihua Zhang"}, {"name": "Yanling Wu"}, {"name": "Jun Li"}], "author_count": 6}, {"id": "2610.21625", "category": "cond-mat", "title": "Universal Dynamic Scaling for Sub-Yield Aging and Over-Yield Rejuvenation in A Cyclically Driven Metallic Glass", "abstract": "Whether sub-yield aging and over-yield rejuvenation in cyclically deformed amorphous solids share a common physical origin or arise from distinct microscopic mechanisms remains a fundamental yet unresolved debate. Using molecular dynamics simulations of a metallic glass, we resolve this duality by uncovering a unified dynamic clock that dictates energy landscape navigation across both regimes. We show that the transition between regimes reflects a fundamental shift in energy injection pathways: (i) In the over-yield regime, rejuvenation is driven as a first-order response to macroscopic plastic shear work derived from Herschel-Bulkley non-linear rheological scaling. (ii) In contrast, this macroscopic work scaling fails in the sub-yield regime, where early-stage energy landscape elevation and subsequent cyclic aging are instead governed by second-order localized elastic stress fluctuations acting as a mechanical catalyst and noise source, respectively. Intense high-rate agitation increases the escape probability from deeper potential energy minima, thereby suppressing the retention efficiency of structural relaxation. By identifying these localized fluctuations as the primary origin of rate-attenuated sub-yield relaxation, we establish an exact scaling identity relating the relaxation attenuation exponent to the stress fluctuation exponent. This work directly bridges non-linear rheology with stress fluctuation dynamics, providing a unified framework to predict and manipulate structural evolution in amorphous solids.", "url": "https://arxiv.org/abs/2610.21625", "type": "理论+数值", "summary": "1. 该工作以分子动力学模拟循环驱动金属玻璃，提出一个统一动态时钟，用于描述亚屈服老化与过屈服再生如何共同遍历能量景观。\n2. 其核心物理卖点在于区分能量注入路径：过屈服再生由Herschel-Bulkley型宏观塑性剪切功的一阶响应主导，而亚屈服区该宏观标度失效，早期能量景观抬升与后续循环老化分别由局域弹性应力涨落的二阶机械催化与噪声效应控制。\n3. 通过建立弛豫衰减指数与应力涨落指数间的精确标度恒等式，该工作桥接了非线性流变与应力涨落动力学，为预测和操控非晶固体的结构演化提供统一框架。", "summary_source": "deepseek", "authors": [{"name": "Nannan Ren"}, {"name": "Hongfei Zhang"}, {"name": "Rui Wan"}, {"name": "Pengfei Guan"}, {"name": "Limin Wang"}, {"name": "Baoshuang Shang"}], "featured_authors": [{"name": "Nannan Ren"}, {"name": "Hongfei Zhang"}, {"name": "Rui Wan"}, {"name": "Pengfei Guan"}, {"name": "Limin Wang"}, {"name": "Baoshuang Shang"}], "author_count": 6}, {"id": "2610.21631", "category": "cond-mat", "title": "Finite-size geometric crossover toward fragmentation of the potential energy shell in the quantum random energy model", "abstract": "The quantum random energy model (QREM) is a paradigmatic model for studying delocalization-localization transitions at finite energy density in Fock space. In the computational basis, its diagonal energies are independent Gaussian random variables, in contrast to the correlated energies of local interacting models such as the disordered XXZ chain. In this work, we construct a potential energy shell associated with a basis state, defined through its energy variance, and investigate its connectivity on the Fock-space hypercube. As the transverse field is varied, this energy-selected subgraph undergoes a finite-size geometric crossover between fully connected and fragmented regimes. Furthermore, we observe a correlation between the shell connectivity and the finite-size fractal dimension of the eigenstates, as extracted from the participation entropy. For the QREM, the statistical independence of the diagonal energies allows the shell connectivity to be analyzed as an effective independent site percolation problem on the hypercube, with its crossover scale estimated within a one-hop approximation. At finite energy density, this estimate gives a nonmonotonic dependence of the crossover scale on system size $L$: increasing $L$ initially favors connectivity, while beyond an energy-dependent scale $L^*(\\varepsilon)$ the trend reverses towards fragmentation.", "url": "https://arxiv.org/abs/2610.21631", "type": "理论", "summary": "1. 该工作为量子随机能量模型构建了与某一基矢态关联的势能壳，并在Fock空间超立方体上研究其连通性随横场的变化。\n2. 其核心卖点是将壳层连通性视为超立方体上的有效独立格点渗流，并在单跳近似下估计转变尺度，且与由参与熵提取的本征态分形维数相关。\n3. 由此可预期，在有限能量密度下连通性随系统尺寸L先增后减，L*(ε)标定碎裂倾向，为有限尺寸局域化提供几何视角。", "summary_source": "deepseek", "authors": [{"name": "Ishita Modak"}, {"name": "Vatsana Tiwari"}, {"name": "Soumya Bera"}], "featured_authors": [{"name": "Ishita Modak"}, {"name": "Vatsana Tiwari"}, {"name": "Soumya Bera"}], "author_count": 3}, {"id": "2610.21637", "category": "cond-mat", "title": "Directed impulsive molecular dynamics reveal energy-routing pathways of bond cleavage in TATB", "abstract": "Responses of energetic materials to external stimuli involve more than uniform thermalization. Understanding directional energy redistribution is essential for structural and ignition design. Here, we use TATB as an example to construct a vibrationally faithful machine-learning potential from only 4,630 configurations. To resolve the elusive nonequilibrium energy flow, we develop directed impulsive molecular dynamics, a statistically controlled protocol that repeatedly deposits equal kinetic energy along selected vibrational modes. By amplifying mode-specific responses while tracking the ensuing nonequilibrium evolution, this approach turns energy redistribution into a directly traceable routing process. We find that initial bond cleavage depends strongly on the initially excited mode, rather than being determined by bond-cleavage barriers alone. Specifically, modes that readily trigger reaction efficiently channel energy towards a bond cleavage coordinate, whereas modes that are less effective at inducing break divert energy into soft-like modes or trap it in modes from which energy flow is inefficient.", "url": "https://arxiv.org/abs/2610.21637", "type": "数值", "summary": "1. 该工作以TATB为例，仅用4,630个构型构建振动保真的机器学习势，并提出定向脉冲分子动力学，以统计可控方式沿选定振动模式反复注入等量动能，追踪非平衡能量再分配。\n2. 其核心卖点在于将模式选择激发与非平衡演化追踪结合，把能量再分配转化为可追踪的路由过程，并揭示初始断键强烈取决于被激发模式而非仅由断键势垒决定。\n3. 有效模式将能量高效导向断键坐标，低效模式则将能量转入类软模式或陷于流动不畅的模式，这为含能材料的结构与点火设计提供了以定向能量路由为调控抓手的新启示。", "summary_source": "deepseek", "authors": [{"name": "Guanchen Dong"}, {"name": "Xiaona Huang"}, {"name": "Yuxuan Chen"}, {"name": "Linghua Tan"}, {"name": "Guangcheng Yang"}, {"name": "Rui Su"}, {"name": "Lin Wang"}, {"name": "Pengfei Guan"}], "featured_authors": [{"name": "Guanchen Dong"}, {"name": "Xiaona Huang"}, {"name": "Yuxuan Chen"}, {"name": "Rui Su"}, {"name": "Lin Wang"}, {"name": "Pengfei Guan"}], "author_count": 8}, {"id": "2610.21650", "category": "cond-mat", "title": "Distribution Functions and Moments of Harmonically Trapped Inertial Run-and-Tumble Particles in a Shear-Thickening Medium", "abstract": "We study the dynamics of an athermal inertial active particle confined in a harmonic potential and moving through shear-thickening media in one dimension. The activity is modeled using a symmetric dichotomous noise of strength $\\Sigma$ and flipping rate $\\lambda$, which mimics a run-and-tumble particle. The shear-thickening response of the medium is incorporated through a velocity-dependent viscous force of the form $g(v) \\sim \\tan(v)$. Starting from the Fokker-Planck equations corresponding to the particle's dynamics, we numerically compute the time-dependent joint probability density function $f(x,v,t)$ using a finite-volume upwind scheme. Next, we numerically solve the particle's equations of motion to obtain the steady-state position $P_s(x)$ and velocity $W_s(v)$ distributions and compare them with the marginal distributions obtained from $f(x,v,t)$ at sufficiently large $t$. The two approaches show excellent agreement. Both $P_s(x)$ and $W_s(v)$ exhibit several intriguing transitions as $\\lambda$ is varied, and they eventually approach Gaussian-like profiles at sufficiently large $\\lambda$. Our study of the time-dependent position-velocity correlation, $\\langle xv \\rangle(t)$, shows that larger values of $\\lambda$ lead to faster relaxation to the steady state when all other parameters are held constant.", "url": "https://arxiv.org/abs/2610.21650", "type": "理论+数值", "summary": "1. 我们研究了限制在谐波势中并在一维剪切增稠介质中移动的无热惯性活性粒子的动力学。\n2. 我们对时间依赖性位置速度相关性 $\\langle xv \\rangle(t)$ 的研究表明，当所有其他参数保持不变时，较大的 $\\lambda$ 值会导致更快地松弛到稳定状态。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Subhanker Howlader"}, {"name": "Prasenjit Das"}], "featured_authors": [{"name": "Subhanker Howlader"}, {"name": "Prasenjit Das"}], "author_count": 2}, {"id": "2610.21652", "category": "cond-mat", "title": "Theory of Dispersion and Exchange Interactions Subjected to Surface Roughness in Application to Signal Transmission through a Nanoswitch", "abstract": "We present the theoretical description of a resistive nanoswitch designated for a change-over between the two operation modes by calculating the electri elastic, dispersion (van der Waals and Casimir), and also exchange repulsive forces in its configuration with an account of surface roughness. The dispersion forces are described by means of the Lifshitz theory and, at the shortest separations between the interacting bodies, where this theory is inapplicable, by the method of additive summation of the interatomic potentials corrected for the role of the effects of nonadditivity. The exchange repulsion is also found by a summation of the interatomic potentials and using the proximity force approximation. It is shown that the nanoswitch possesses the equilibrium closest separation between a cantilever tip and a ground plate calculated as a function of the actuation voltage and operates in a cyclic manner with no pull-in when this voltage is switched on and off. We have found the tunnel current between a cantilever tip and a plate and investigated distortions appearing in the signal transmitted through a nanoswitch. According to our results, the amplitude distortions arising in the low-frequency information signal can be made sufficiently small by increasing a difference between the amplitudes of the carrier and information signals. Possible applications of the obtained results are discussed.", "url": "https://arxiv.org/abs/2610.21652", "type": "理论", "summary": "1. 该工作针对可在两种工作模式间切换的电阻式纳米开关，建立计入表面粗糙度的电弹性、范德瓦尔斯/卡西米尔色散力与交换排斥力理论描述。\n2. 其技术关键在于按间距适用 Lifshitz 理论、修正非可加性的原子间势加和法与邻近力近似，并据此给出平衡间距、无 pull-in 循环操作、隧穿电流及信号畸变。\n3. 结果表明，增大载波与信息信号的幅度差可把低频信息信号中的幅度畸变压得足够小，这为纳米开关信号传输的参数优化与实际应用提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Galina L. Klimchitskaya"}, {"name": "Alexander S. Korotkov"}, {"name": "Vera V. Loboda"}, {"name": "Vladimir M. Mostepanenko"}], "featured_authors": [{"name": "Galina L. Klimchitskaya"}, {"name": "Alexander S. Korotkov"}, {"name": "Vera V. Loboda"}, {"name": "Vladimir M. Mostepanenko"}], "author_count": 4}, {"id": "2610.21670", "category": "cond-mat", "title": "Defect Candidates for Single-Photon Emission in Monolayer GaS and GaSe", "abstract": "We investigate the spin-resolved electronic structure of native vacancies and substitutional defects in monolayer GaS and GaSe using an anisotropic screened-exchange functional developed for two-dimensional material systems. By combining an energy-based classification of defect-associated states with spatially resolved projections and partial charge densities, we examine how these defects modify the in-gap electronic structure and assess their relevance for defect-based single-photon emission. The results identify gallium vacancies, particularly in GaS, as candidates single-photon emitters.", "url": "https://arxiv.org/abs/2610.21670", "type": "理论+数值", "summary": "1. 该工作采用针对二维体系发展的各向异性屏蔽交换泛函，计算了单层GaS与GaSe中本征空位及替代缺陷的自旋分辨电子结构。\n2. 其技术要点在于将基于能量的缺陷态分类与空间分辨投影、部分电荷密度结合，厘清缺陷对带隙内电子结构的修饰，并据此评估其作为单光子发射源的可能性，指认镓空位尤其是GaS中的镓空位为候选者。\n3. 这为二维硫属化合物中缺陷基单光子源的筛选提供了具体候选与判据，并启发后续实验验证与缺陷工程调控。", "summary_source": "deepseek", "authors": [{"name": "Michael Lorke"}], "featured_authors": [{"name": "Michael Lorke"}], "author_count": 1}, {"id": "2610.21683", "category": "cond-mat", "title": "Novel high-pressure silicon allotrope with quartz topology from first principles", "abstract": "A novel silicon allotrope, qtz Si, with quartz topology is proposed and investigated alongside four known allotropes (dia Si-I, lon Si-IV, bsn Si-II, and gsi Si-III) using first-principles density functional theory. qtz Si is found to exhibit the smallest atom-averaged volume (18.06 A3), highest density (2.582 g/cm3), highest bulk modulus (98 GPa), and highest maximum phonon frequency (16 THz) among the five, while showing the lowest shear modulus (37 GPa). All five allotropes are confirmed to satisfy the Born stability criteria and to display positive phonon frequencies throughout the Brillouin zone, i.e., they are mechanically and dynamically stable. Electronic structure calculations show that qtz Si is a semimetal with a vanishing gap, whereas dia Si and lon Si are semiconductors, and bsn and gsi allotropes are weakly metallic. Energy-volume equations of state place gsi and qtz 0.11-0.15 eV/atom above dia, bsn, and lon, consistent with their identification as high-pressure or metastable phases.", "url": "https://arxiv.org/abs/2610.21683", "type": "理论+数值", "summary": "1. 该工作基于第一性原理DFT提出石英拓扑新硅同素异形体qtz Si，并与dia、lon、bsn、gsi四种已知相系统对比。\n2. 其卖点是qtz Si具五相中最小的原子平均体积、最高密度、体模量98 GPa与最高声子频率16 THz，却为带隙消失的半金属。\n3. 能量-体积状态方程显示gsi与qtz比dia、bsn、lon高0.11–0.15 eV/atom，表明二者属高压或亚稳相，可启发高压合成与截留研究。", "summary_source": "deepseek", "authors": [{"name": "Samir F. Matar"}, {"name": "Vladimir L. Solozhenko"}], "featured_authors": [{"name": "Samir F. Matar"}, {"name": "Vladimir L. Solozhenko"}], "author_count": 2}, {"id": "2610.21733", "category": "cond-mat", "title": "Low magnon damping of a EuSe film down to millikelvin temperatures", "abstract": "The rapid development of quantum magnonics over the past decade has created a demand for magnetic materials that keep their magnon losses low at millikelvin temperatures and add functionality beyond that of the established iron garnets and ferromagnetic metals. The europium chalcogenides are natural candidates $-$ they are magnetic semiconductors whose moment of $7\\,\\mu_{\\mathrm{B}}$ per Eu$^{2+}$ ion stems from a half-filled $4f$ shell with zero orbital momentum, so that spin-orbit coupling and intrinsic damping are expected to be weak. Here we characterize an epitaxial film of the metamagnet EuSe on diamagnetic BaF$_2$ by magnetometry and broadband ferromagnetic resonance from 10 K down to 30 mK. EuSe combines a saturation magnetization of 1100 kA/m with antiferromagnetic, ferrimagnetic and ferromagnetic phases that are reached with fields below 0.25 T. In contrast to a Gilbert-damped ferromagnet, the linewidth of the field-aligned film decreases with increasing frequency and field, and below 750 mK it no longer depends on temperature. At 30 mK, 68 GHz and 1.8 T, it reaches 5.5 mT, close to the values of bulk single crystals, which corresponds to a magnon lifetime of 2 ns and to an upper bound of $1.1\\times10^{-3}$ for the Gilbert damping parameter. These properties make EuSe and the europium chalcogenides promising materials for hybrid quantum systems and quantum magnonics.", "url": "https://arxiv.org/abs/2610.21733", "type": "理论", "summary": "1. 该工作用磁测量与宽带铁磁共振表征了生长在BaF₂上的EuSe外延薄膜，温度覆盖10 K至30 mK。\n2. 其线宽随频率与磁场升高而减小，750 mK以下与温度无关；在30 mK、68 GHz、1.8 T时为5.5 mT，对应2 ns磁振子寿命与1.1×10⁻³的Gilbert阻尼上限。\n3. 这使EuSe及铕硫族化合物成为混合量子系统与量子磁振子学中有前景的低损耗材料平台。", "summary_source": "deepseek", "authors": [{"name": "Rostyslav O. Serha"}, {"name": "Jan Hofer"}, {"name": "Khrystyna O. Levchenko"}, {"name": "Andreas Ney"}, {"name": "Sergej O. Demokritov"}, {"name": "Gunther Springholz"}, {"name": "Andrii V. Chumak"}], "featured_authors": [{"name": "Rostyslav O. Serha"}, {"name": "Jan Hofer"}, {"name": "Khrystyna O. Levchenko"}, {"name": "Sergej O. Demokritov"}, {"name": "Gunther Springholz"}, {"name": "Andrii V. Chumak"}], "author_count": 7}, {"id": "2610.21769", "category": "cond-mat", "title": "Spatiotemporally correlated activity regulation of random-organizing hyperuniform states", "abstract": "Center-of-mass (COM) conservation has been widely accepted as an important mechanism for generating nonequilibrium dynamic hyperuniform states with vanishing long-wavelength density fluctuations, but whether it is sufficient for hyperuniformity remains unclear. Here, using particle simulations and a linear fluctuating theory, we show that spatiotemporally correlated activity regulation can destroy hyperuniformity while preserving COM conservation. We construct a binary mixture in which the local density of independently evolving driver particles regulates the activity of regulated particles following COM-conserving biased random organization. This counterexample demonstrates that hyperuniformity depends on the spatial and temporal correlations of activity as well as the conservation laws governing particle displacements. Our findings clarify the limits of COM conservation as a route to hyperuniformity and highlight the importance of controlling activity correlations in the design of nonequilibrium multihyperuniform mixtures.", "url": "https://arxiv.org/abs/2610.21769", "type": "理论+数值", "summary": "1. 该工作结合粒子模拟与线性涨落理论，构建由独立驱动粒子局域密度调控被调控粒子活动的二元混合体系，其活动调控满足质心守恒的偏置随机组织规则，以检验质心守恒对超均匀性的充分性。\n2. 关键卖点在于证明即使质心守恒严格成立，时空相关的活动调控仍可破坏长波密度涨落消失的超均匀态，说明超均匀性还取决于活动涨落的空间与时间关联。\n3. 该反例澄清质心守恒作为超均匀性生成机制的局限，并启示在设计非平衡多重超均匀混合物时需主动调控活动关联。", "summary_source": "deepseek", "authors": [{"name": "Yuhan Peng"}, {"name": "Yusheng Lei"}, {"name": "Ran Ni"}], "featured_authors": [{"name": "Yuhan Peng"}, {"name": "Yusheng Lei"}, {"name": "Ran Ni"}], "author_count": 3}, {"id": "2610.21770", "category": "cond-mat", "title": "Coexistence of Altermagnetic and Compensated Ferrimagnetic Motifs in a Noncollinear Multiferroic", "abstract": "Collinear compensated magnets with nonrelativistic spin splitting comprise altermagnets (ALMs), whose rotation- or mirror-related opposite-spin sublattices produce momentum-selective splitting that vanishes at $\\Gamma$, and compensated ferrimagnets (CFIMs), whose symmetry-inequivalent sublattices allow splitting throughout the Brillouin zone, including at $\\Gamma$. Here, we show that the coplanar noncollinear magnetic state of multiferroic boracite Ni$_3$B$_7$O$_{13}$Cl hosts both motifs on distinct Ni sublattices in real space. The electronic structure and spin texture exhibit coexisting $d$-wave-like and $s$-wave-like spin-polarization components associated with the ALM and CFIM motifs, respectively. Opposite ferroelectric states exhibit reversed band-resolved spin polarizations, indicating magnetoelectric coupling, and sign reversals of linear shift and circular injection currents.", "url": "https://arxiv.org/abs/2610.21770", "type": "理论+数值", "summary": "1. 该工作表明多铁硼酸盐Ni3B7O13Cl的共面非共线磁态在实空间不同Ni子晶格上同时承载交替磁体（ALM）与补偿亚铁磁体（CFIM）两类补偿自旋劈裂模式。\n2. 其电子结构与自旋织构呈现共存的d波样和s波样自旋极化分量，分别对应ALM与CFIM；相反的铁电态可反转能带分辨自旋极化，并使线性位移电流和圆形注入电流符号反转，指示磁电耦合。\n3. 这为在单一非共线多铁中协同利用动量选择性与全布里渊区自旋劈裂，并通过铁电翻转调控自旋极化及电流响应提供了可行思路。", "summary_source": "deepseek", "authors": [{"name": "Vikrant Chaudhary"}, {"name": "Fu Li"}, {"name": "Hui Liu"}, {"name": "Mengli Hu"}, {"name": "Rajyavardhan Ray"}, {"name": "Chen Shen"}, {"name": "Jeroen van den Brink"}, {"name": "Hongbin Zhang"}, {"name": "Harish K. Singh"}], "featured_authors": [{"name": "Vikrant Chaudhary"}, {"name": "Fu Li"}, {"name": "Hui Liu"}, {"name": "Jeroen van den Brink"}, {"name": "Hongbin Zhang"}, {"name": "Harish K. Singh"}], "author_count": 9}, {"id": "2610.21777", "category": "cond-mat", "title": "Localization induced by Sinai disorder in mass-exchange models", "abstract": "We introduce a conservative continuous-mass-exchange model with quenched disorder in the splitting laws on the bonds of a finite segment. Although the dynamics is generically irreversible, its stationary mean mass profile remarkably turns out to be exactly solvable through an associated birth-and-death chain and has a Gibbs representation in terms of a simple random-walk potential. If $N$ is the number of bonds and $\\beta$ measures the strength of disorder, the parameter $\\beta\\sqrt N$ separates an asymptotically flat profile, a Brownian crossover, and a profile localized near the global minimum. We characterize the fluctuations of macroscopic masses and identify arcsine laws for the localization centre, the competition between left and right valleys, and the disorder-averaged mass measure. Furthermore, for the extremal masses, we discuss the emergent limiting random variable in terms of the literature linking finite RW paths seen from its minimum to infinite-horizon walks conditioned to stay positive. Finally, in proximity of the localization transition point $\\beta=0$, we show that the inverse participation ratio for the extremal masses give rises to a scaling with decay of order $k^{-3/2}$ consistent with the scaling limit of the latter conditioned walk. In the same limit, the inverse participation ratio shows a scaling form.", "url": "https://arxiv.org/abs/2610.21777", "type": "理论", "summary": "1. 该工作引入有限链上键分裂律含淬火无序的守恒连续质量交换模型，并精确求解其稳态平均质量剖面。\n2. 其卖点是不可逆动力学下稳态仍可映射为生灭链与随机游走势的Gibbs表示，且β√N区分平坦、Brownian交叉与局域化相。\n3. 该结果将局域化中心、左右谷竞争和极值质量IPR纳入条件随机游走框架，为无序质量交换相变提供定量基准。", "summary_source": "deepseek", "authors": [{"name": "Michele Giusfredi"}, {"name": "Luca Avena"}, {"name": "Paolo Politi"}], "featured_authors": [{"name": "Michele Giusfredi"}, {"name": "Luca Avena"}, {"name": "Paolo Politi"}], "author_count": 3}, {"id": "2610.21816", "category": "cond-mat", "title": "Drying-Induced Size Segregation and Stratification in Colloidal Droplets across Binary, Ternary, and Polydisperse Systems", "abstract": "We study evaporation-induced size segregation and stratification in binary, ternary, and polydisperse mixtures of colloidal particles within a drying droplet using Brownian dynamics (BD) simulations. We show that drying-induced stratification can occur in all three types of mixtures, with larger particles preferentially accumulating in the droplet interior and smaller particles near the droplet surface. In binary mixtures, size segregation becomes more pronounced as the Peclet number and the size difference between particles increase, and as the relative volume fraction of large particles and the initial particle concentration decrease. In ternary mixtures, three distinct layers form when the Peclet number is sufficiently high and the intermediate particle size is suitably selected. Under the conditions studied, increasing the fraction of intermediate-sized particles can also enhance separation between the small and large particles. These results are in qualitative agreement with previous studies of drying planar films. Extending the analysis to polydisperse systems, we find that the average particle size decreases with increasing radial distance under stratifying conditions. Furthermore, higher Peclet numbers and particle-size distributions with more particles at both size extremes lead to steeper radial gradients in particle size. Additionally, we use multi-particle collision dynamics (MPCD) simulations to assess the role of hydrodynamic interactions. BD simulations predict stronger stratification than MPCD simulations, although stratification persists in the MPCD simulations. Our results thus demonstrate that droplet-confined drying offers a simple and versatile strategy for engineering radial composition and size gradients in colloidal assemblies, thereby offering new opportunities for the controlled fabrication of hierarchically structured supraparticles.", "url": "https://arxiv.org/abs/2610.21816", "type": "数值", "summary": "1. 该工作用布朗动力学模拟研究了二元、三元及多分散胶体液滴干燥中的尺寸偏析与分层，并用多粒子碰撞动力学评估流体动力学相互作用。\n2. 其核心在于：三类混合物均出现分层，大颗粒向内、小颗粒向外；分层随佩克莱特数、粒径差和分布宽度增强，且流体动力学耦合使其减弱但仍存在。\n3. 这为利用液滴限域干燥按径向调控胶体组分与尺寸梯度、可控构筑分级结构超颗粒提供了思路与启示。", "summary_source": "deepseek", "authors": [{"name": "Zhoaxuan Liu"}, {"name": "Marjolein Dijkstra"}], "featured_authors": [{"name": "Zhoaxuan Liu"}, {"name": "Marjolein Dijkstra"}], "author_count": 2}, {"id": "2610.21835", "category": "cond-mat", "title": "From Action Principle to Stochastic Thermodynamics of Elastic and Viscous Active Matter", "abstract": "Motivated by the complex material properties of living matter, we derive a framework of stochastic thermo- and elastodynamics for active materials from the classical principle of least action and the Rayleighian formalism for external forces. Our approach couples the local barycentric collective coordinate and the streaming velocity as the canonical conjugate pair, which unifies various descriptions of elastic and viscous soft matter, including Helfrich theory for lipid membranes, linear and nonlinear elasticity of thin shells and deformable droplets, as well as hydrodynamics of active and passive fluids. The Lagrangian mechanics of collective field variables permits direct applications of the results and theorems from statistical mechanics to existing models of complex soft and living matter. To illustrate the potential applications of stochastic elastodynamics in biology, we derive and simulate a boundary-driven deformation model of an elastic cell nucleus in the presence of fluctuations.", "url": "https://arxiv.org/abs/2610.21835", "type": "理论", "summary": "1. 该工作从最小作用量原理与Rayleighian外力形式出发，为活性材料建立了随机热力学与弹性动力学框架，将局域质心集体坐标与流速取为共轭对，统一了Helfrich膜理论、薄壳与可变形液滴的线性和非线性弹性及主被动流体动力学。\n2. 其核心卖点在于以集体场变量的拉格朗日力学为桥梁，使统计力学的既有结果与定理可直接移植到复杂软物质与生命物质模型，并同时涵盖弹性与黏性描述。\n3. 作者据此推导并模拟了含涨落的弹性细胞核边界驱动变形模型，展示了该随机弹性动力学在生物物理中的实用性，并为后续理论构建与实验验证提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Valentina Barletta"}, {"name": "Michele Lupini"}, {"name": "Ian D. Estabrook"}, {"name": "Laeschkir Würthner"}, {"name": "Isabella R. Graf"}, {"name": "Caren Norden"}, {"name": "Lamberto Rondoni"}, {"name": "Anna Erzberger"}, {"name": "Roman Belousov"}], "featured_authors": [{"name": "Valentina Barletta"}, {"name": "Michele Lupini"}, {"name": "Ian D. Estabrook"}, {"name": "Lamberto Rondoni"}, {"name": "Anna Erzberger"}, {"name": "Roman Belousov"}], "author_count": 9}, {"id": "2610.21842", "category": "cond-mat", "title": "Synchronization induced by stochastic subsystem resetting in complex networks", "abstract": "We study synchronization in network-coupled oscillators subject to stochastic resetting of a subset of nodes. We show that resetting can induce collective coherence in oscillators that are never directly reset, through the interplay of network structure, frequency heterogeneity, and the organization of the reset subsystem. In the infinite-resetting-rate limit, the reset nodes become effectively pinned to a reference phase, and linearization near synchronization maps the dynamics of the remaining subsystem onto a grounded-Laplacian problem. This formulation yields an analytical relation between the synchronization level and the reset parameters, providing an estimate of the coupling strength required to achieve a prescribed degree of coherence. Beyond the linear regime, we develop a mean-field description in which the reset subsystem acts as an effective ordering field for the remaining oscillators. Numerical simulations across different network topologies confirm these predictions and show that synchronization is enhanced by increasing both the reset fraction and network connectivity. In heterogeneous networks, the placement of reset nodes can strongly influence the synchronization response. For frequency distributions with nonzero mean, resetting competes with the intrinsic collective rotation and can drive the system from a rotating synchronized state to a phase-locked state. These results establish subsystem resetting as a mechanism for inducing and controlling collective synchronization in complex networks.", "url": "https://arxiv.org/abs/2610.21842", "type": "理论+数值", "summary": "1. 该工作研究了复杂网络中耦合振子仅在部分节点受随机重置时的同步行为，表明重置可通过网络结构、频率异质性与重置子系统组织诱导未被直接重置振子的集体相干。\n2. 其核心在于无限重置率下重置节点被钉扎，线性化将剩余子系统映射为接地拉普拉斯问题，给出同步度与重置参数解析关系及所需耦合估计，并用平均场把重置子系统视作有效有序场。\n3. 该机制在多种拓扑上获数值验证，提升重置比例与连通性可增强同步，异质网络中重置位置关键；对非零均值频率，重置可与本征集体旋转竞争并驱动系统由旋转同步转入锁相，为诱导和控制复杂网络集体同步提供启示。", "summary_source": "deepseek", "authors": [{"name": "Kevin Paramero-Arias"}, {"name": "Alejandro P. Riascos"}], "featured_authors": [{"name": "Kevin Paramero-Arias"}, {"name": "Alejandro P. Riascos"}], "author_count": 2}, {"id": "2610.21856", "category": "cond-mat", "title": "Large in-plane optical anisotropy in epitaxial CrN(113) films", "abstract": "CrN, a transition-metal nitride crystallizing in the cubic rocksalt structure, exhibits a unique combination of mechanical robustness, semiconducting behavior, and thermoelectric functionality. To date, however, CrN has been synthesized primarily as polycrystalline material or as epitaxial films grown along high-symmetry orientations such as (001) and (111). Here, we prepare epitaxial CrN(113) films on AlN(11\\bar{2}2) templates by plasma-assisted molecular beam epitaxy. The low-symmetry interface and highly direction dependent lattice mismatch are expected to modify the physical properties of CrN relative to the bulk material. Indeed, variable-angle spectroscopic ellipsometry in the photon-energy range from 1.25 to 5 eV reveals a surprisingly strong polarization dependence of the optical response despite the nearly strain-free cubic crystal structure of the films. The pseudo-optical constants n and k differ by more than 10% for orthogonal in-plane polarizations throughout the investigated spectral range. We evaluate possible origins of this effect and conclude that it most likely arises from anisotropic surface morphology of CrN(113), which creates a metasurface acting as a subwavelength grating in the strongly absorbing regime.", "url": "https://arxiv.org/abs/2610.21856", "type": "理论+数值", "summary": "1. 该工作通过等离子体辅助分子束外延在AlN(11̄22)模板上制备了低对称取向的CrN(113)外延薄膜，并利用变角光谱椭偏仪表征其面内光学各向异性。\n2. 其核心卖点在于：在1.25–5 eV范围内，近乎无应变的立方CrN薄膜中，两个正交面内偏振的赝光学常数n与k相差逾10%，作者将其归因于CrN(113)各向异性表面形貌在强吸收区形成的亚波长光栅超表面。\n3. 这说明低对称取向外延与表面形貌工程可在无应变立方材料中诱导显著面内光学各向异性，为偏振光学、超表面及光电子集成提供可借鉴的设计思路。", "summary_source": "deepseek", "authors": [{"name": "Duc V. Dinh"}, {"name": "Frank Peiris"}, {"name": "Oliver Brandt"}], "featured_authors": [{"name": "Duc V. Dinh"}, {"name": "Frank Peiris"}, {"name": "Oliver Brandt"}], "author_count": 3}, {"id": "2610.21861", "category": "cond-mat", "title": "Diffusion-Induced Stabilization of Nonreciprocal Wealth Dynamics", "abstract": "We study the stability of equal wealth shares in a spatial model combining local sharing, global redistribution, and random nonreciprocal interactions. On a two-dimensional square lattice in the infinite-system limit, the effect of local sharing depends on whether the influence of one site on another tends to have the same or opposite sign as the reverse influence. When these influences are nonnegatively correlated, diffusion reduces the redistribution required for stability, but a positive rate remains necessary. Negative correlations instead allow stability without redistribution, with the largest stability margin at finite diffusion and a return toward marginal stability at strong diffusion. This nonmonotonicity reflects a competition between spatial smoothing and the weakening of the stabilizing contribution of reciprocal anticorrelations. Equal shares can even remain stable under wealth-concentrating transfers, but only within an intermediate range of diffusion strengths.", "url": "https://arxiv.org/abs/2610.21861", "type": "理论", "summary": "1. 该工作构建二维方格无限系统极限下的空间财富动力学模型，结合局域分享、全局再分配与随机非互易相互作用，研究均等财富份额的稳定性。\n2. 其核心在于揭示局域分享的稳定效应取决于相互影响的符号关联：非负关联时扩散降低所需再分配率但仍需正值，负关联时无需再分配即可稳定，并出现有限扩散下稳定裕度最大、强扩散趋于边缘稳定的非单调行为。\n3. 这表明空间平滑与互反负关联稳定贡献的竞争可调控均等态，甚至使财富集中转移在中等扩散区间内仍保持稳定，为非互易系统的扩散诱导稳定机制提供启发。", "summary_source": "deepseek", "authors": [{"name": "Pierre Bousseyroux"}, {"name": "Gilles Zérah"}, {"name": "Michael Benzaquen"}], "featured_authors": [{"name": "Pierre Bousseyroux"}, {"name": "Gilles Zérah"}, {"name": "Michael Benzaquen"}], "author_count": 3}, {"id": "2610.21911", "category": "cond-mat", "title": "VoroTypes: automated enumeration of Voronoi cell topologies for structural identification of complex crystals in atomistic simulations", "abstract": "VoroTypes enumerates, for an arbitrary crystal structure, the complete family of Voronoi cell topologies that can arise under small generic perturbations of atomic positions, and exports it as a topological filter for the VoroTop framework. This extends per-atom structural identification in molecular dynamics simulations, previously limited to a handful of simple reference structures, to complex crystals such as Frank--Kasper and Laves phases, with per-sublattice resolution. The package takes a standard crystallographic description (a CIF or POSCAR file) as input, applies exact symmetry reduction and validity pruning to accelerate the enumeration, and produces filters that load directly into the standalone VoroTop program or into OVITO. A library of pre-computed filters covers over a thousand structures from the Materials Project.", "url": "https://arxiv.org/abs/2610.21911", "type": "理论+数值", "summary": "1. 该工作开发VoroTypes，自动枚举任意晶体在小幅普适扰动下的全部Voronoi胞拓扑，并导出为VoroTop拓扑过滤器。\n2. 其技术卖点是以CIF/POSCAR为输入、经对称约化与有效性剪枝加速枚举，将逐原子结构识别拓展至Frank-Kasper、Laves等复杂相并具子晶格分辨。\n3. 过滤器可直接载入VoroTop/OVITO，超千种Materials Project预计算库有望推动复杂晶体模拟中的结构识别标准化。", "summary_source": "deepseek", "authors": [{"name": "Emanuel A. Lazar"}, {"name": "Chris H. Rycroft"}], "featured_authors": [{"name": "Emanuel A. Lazar"}, {"name": "Chris H. Rycroft"}], "author_count": 2}, {"id": "2610.21917", "category": "cond-mat", "title": "Phase coexistence and nucleation of aging condensates", "abstract": "Biomolecular condensates form by phase separation and often age over time by transitioning from liquid-like droplets to solid-like states. To capture the fundamental behavior of aging condensates, we connect the Flory-Huggins model of phase separation with the trap model of aging dynamics. This combined model yields a rich phase diagram, including a regime of metastable coexisting liquids. Interestingly, the dense metastable liquid serves as an intermediate state in the nucleation pathway of the glass, which thus nucleates in two steps. Our results are generic, since they follow from a basic free-energy structure, providing a unified foundation for describing the thermodynamics and kinetics of aging biomolecular condensates.", "url": "https://arxiv.org/abs/2610.21917", "type": "理论+数值", "summary": "1. 该工作将Flory-Huggins相分离模型与老化动力学的陷阱模型耦合，以刻画老化生物分子凝聚体的相行为与成核路径。\n2. 其核心卖点在于组合模型给出含亚稳共存液相的丰富相图，并表明致密亚稳液相可作为中间态导致玻璃态两步成核。\n3. 由于结果源于基本自由能结构而具普适性，该框架为统一描述老化生物分子凝聚体的热力学与动力学提供了基础。", "summary_source": "deepseek", "authors": [{"name": "Yicheng Qiang"}, {"name": "Chengjie Luo"}, {"name": "David Zwicker"}], "featured_authors": [{"name": "Yicheng Qiang"}, {"name": "Chengjie Luo"}, {"name": "David Zwicker"}], "author_count": 3}, {"id": "2610.21949", "category": "cond-mat", "title": "Twist-controlled thermodynamic anomalies in bilayer q-state clock models", "abstract": "Twist has emerged as a geometric means of controlling collective behavior across a wide range of physical systems. Whether it can qualitatively reorganize the thermodynamic anomalies of discrete spin models, and how such changes relate to microscopic spin configurations, remains less explored. Here we demonstrate twist-controlled thermodynamic anomalies in ferromagnetic bilayer q-state clock models using Monte Carlo simulations. With sufficiently strong interlayer coupling, twisting changes the number and structure of specific-heat peaks: a single peak can split into two, or two peaks can merge into one, depending on the number of allowed spin orientations. These changes are nonmonotonic in twist angle and occur over narrower parameter ranges, or are absent, for the larger q values examined. The accompanying spin textures and vortex distributions suggest a physical picture in which moire modulation of the interlayer coupling reorganizes local spin alignment and topological defects. In a representative case, peak splitting coincides with nearly uniform spin regions arranged on the moire scale and a reduced vortex population. These findings identify twist as a control parameter for the collective thermal response of discrete spin systems and raise the possibility of modified phase-transition behavior, including the emergence or suppression of an intermediate Berezinskii-Kosterlitz-Thouless phase.", "url": "https://arxiv.org/abs/2610.21949", "type": "理论+数值", "summary": "1. 该工作用蒙特卡罗模拟研究铁磁双层q态clock模型中由扭转调控的热力学反常。\n2. 其卖点在于强层间耦合下扭转可使比热峰分裂或合并，且随扭转角非单调、对q值敏感，并伴随莫尔尺度的自旋织构与涡旋重排。\n3. 这确立了扭转作为离散自旋系统集体热响应的控制参量，并提示可调控中间BKT相的出现或抑制。", "summary_source": "deepseek", "authors": [{"name": "Ze-Heng Yu"}, {"name": "Liang He"}], "featured_authors": [{"name": "Ze-Heng Yu"}, {"name": "Liang He"}], "author_count": 2}, {"id": "2610.21955", "category": "cond-mat", "title": "Spin-1/2 Heisenberg diamond-like decorated honeycomb lattice in a magnetic field from the perspective of localized magnons and exact diagonalization", "abstract": "The spin-$1/2$ quantum Heisenberg model on the diamond-decorated honeycomb lattice in a magnetic field is investigated using complementary analytical and numerical methods. The ground-state phase diagram comprises Lieb-Mattis ferrimagnetic, dimer-tetramer, monomer-dimer, spin-canted, and saturated paramagnetic phases, giving rise to characteristic magnetization plateaus, continuous and discontinuous field-induced transitions. In the highly frustrated regime, a localized-
