magnon approach based on an effective classical lattice-gas model provides an accurate description of the low-temperature magnetism and thermodynamics in agreement with numerical results. At intermediate frustration, finite-temperature calculations reveal characteristic specific-heat signatures of the field-induced transitions including the development of Ising critical behavior at the field-induced transition between the monomer-dimer and Lieb-Mattis ferrimagnetic phase.", "url": "https://arxiv.org/abs/2610.21955", "type": "理论+数值", "summary": "1. 该工作用局域磁振子方法与精确对角化等互补手段，研究磁场中金刚石修饰蜂窝晶格上的自旋1/2海森堡模型，并给出含Lieb-Mattis亚铁磁、二聚体-四聚体、单体-二聚体、自旋倾斜及饱和顺磁相的基态相图。\n2. 其核心卖点是高阻挫区有效经典格气模型对低温磁性与热力学的准确刻画，以及中等阻挫下对场诱导转变、磁化平台和单体-二聚体至Lieb-Mattis亚铁磁相变处Ising临界行为的识别。\n3. 该结果将局域磁振子图像、磁化平台和有限温临界性联系起来，为阻挫量子磁体的后续理论与实验研究提供了可检验基准。", "summary_source": "deepseek", "authors": [{"name": "Katarina Karlova"}, {"name": "Malo Rouxel"}, {"name": "Jozef Strecka"}, {"name": "Andreas Honecker"}], "featured_authors": [{"name": "Katarina Karlova"}, {"name": "Malo Rouxel"}, {"name": "Jozef Strecka"}, {"name": "Andreas Honecker"}], "author_count": 4}, {"id": "2610.21962", "category": "cond-mat", "title": "Sluggish random walks with resetting: nonequilibrium aspects", "abstract": "We derive exact analytical expressions for the fixed-time probability distribution and the Laplace transform of the distribution of the first-passage time to reach a target for a sluggish random walk in one dimension subject to two different types of stochastic resetting: stochastic resetting at random Poisson-distributed times, and resetting implemented whenever a position threshold is reached. The optimal resetting rate that minimises the mean first-passage time is obtained as a function of the sluggishness parameter, while under threshold resetting the mean first-passage time to the origin is found to increase monotonically with the threshold. We also characterise the occupation-time statistics, retrieving a Lamperti-type distribution under free dynamics and under Poissonian resetting at rate for short observation times, a Gaussian distribution centred at half for long observation times, and a distinct deterministic limit under threshold resetting. To further characterise nonequilibrium aspects of resetting, we evaluate the distribution and mean of the cost incurred per reset under Poissonian resetting, and the cost rate under threshold resetting, for different (linear, power-law, exponential) cost functions, and find the same critical behaviour of the cost rate in the limits of a vanishing resetting rate and an infinite threshold, respectively. Numerical simulations validate with excellent accuracy our analytical formulae.", "url": "https://arxiv.org/abs/2610.21962", "type": "理论+数值", "summary": "1. 该工作对一维惰性随机游走在泊松随机重置与阈值重置下的定时刻分布、首达时间分布拉普拉斯变换给出精确解析结果，并求得最优重置率、占据时间统计与重置代价。\n2. 其核心在于揭示惰性参数对最优重置率的调控，以及占据时间在自由动力学和短时泊松重置下呈Lamperti分布、长时趋于半位置高斯、阈值重置呈确定性极限。\n3. 三种代价函数下代价率在重置率趋零与阈值趋无穷时呈现相同临界行为，为搜索过程的能量—时间权衡提供了可检验的普适判据。", "summary_source": "deepseek", "authors": [{"name": "Theophilus Dwamena Frimpong"}, {"name": "Léa Bresque"}, {"name": "Edgar Roldán"}], "featured_authors": [{"name": "Theophilus Dwamena Frimpong"}, {"name": "Léa Bresque"}, {"name": "Edgar Roldán"}], "author_count": 3}, {"id": "2610.21996", "category": "cond-mat", "title": "PANDA-D: Interface-free determination of two dynamic contact angles", "abstract": "Contact angles are central descriptors of wetting and capillary behavior at solid--fluid interfaces. Dynamic contact angles in molecular simulations are commonly extracted from two-dimensional liquid--vapor contours and near-wall tangent fits. We introduce PANDA-D, an extension of Predicting Angle from Nanoscale Density Analysis (PANDA) that determines both contact angles of a driven liquid roll without extracting an interface. The density profile measures occupied layer width but does not identify which meniscus is advancing. The method resolves this ambiguity by jointly fitting density and the layerwise center-of-mass displacement relative to the roll. A circular-meniscus model maps these profiles to receding and advancing angles and an effective near-wall offset. On synthetic rolls with prescribed angles, the reconstruction error is $0.29^\\circ$ root-mean-square. We then analyze force-driven Lennard--Jones rolls between crystalline walls. Joint fits reproduce both measured profiles, whereas density-only fits can match density while assigning incorrect asymmetry. The resulting angles agree with independently determined circle-fit angles to $0.84^\\circ$ root-mean-square. Across four wall--fluid attractions, the receding angle decreases and the advancing angle increases with force, approximately linearly over the studied ranges. By eliminating contour thresholds and near-wall tangent extrapolation from the primary estimate, the two-profile approach enables reproducible, automated angle analysis across molecular trajectories.", "url": "https://arxiv.org/abs/2610.21996", "type": "理论+数值", "summary": "1. 接触角是固-液界面润湿和毛细管行为的核心描述因素。\n2. 穿过四个壁流体吸引力，后退角随着力的增加而减小，前进角随着力的增加而增加，在研究范围内近似线性。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Georgii K. Vandyshev"}, {"name": "Grigorii S. Gorkaev"}, {"name": "Nikolay D. Kondratyuk"}, {"name": "Kirill M. Gerke"}, {"name": "Ilia V. Kopanichuk"}], "featured_authors": [{"name": "Georgii K. Vandyshev"}, {"name": "Grigorii S. Gorkaev"}, {"name": "Nikolay D. Kondratyuk"}, {"name": "Kirill M. Gerke"}, {"name": "Ilia V. Kopanichuk"}], "author_count": 5}, {"id": "2610.22037", "category": "cond-mat", "title": "Exciton superfluidity in two-dimensional bilayers at zero and high magnetic fields", "abstract": "We study interlayer exciton superfluidity versus layer separation in two-dimensional electron-hole bilayers at zero magnetic field and quantum Hall bilayers at total filling $\\nu_T=1$. Unscreened Hartree-Fock theory predicts coherence at every finite separation, with an energy scale decaying inversely with separation at large distances. We examine how screening, correlations, and spatial instabilities modify this prediction. At zero field, we solve the linearized gap equation with the full momentum and frequency dependence of the interaction screened within the random-phase approximation, without an imposed cutoff. The apparent plasmon enhancement of pairing in the ladder approximation is largely cancelled by the second-order crossed-rung correction. Static screening determines the leading pairing exponent in the controlled high-density limit at fixed separation. At large separation, the pairing scale falls exponentially with squared separation while the instability persists. Extending this result to fixed density assumes Fermi-liquid layers and higher-order dynamical corrections subleading to the static pairing interaction. At high field, we obtain an analytic uniform Hartree-Fock saddle point in the lowest Landau level, coherent at every finite separation. Within Hartree-Fock theory, its finite-wave-vector collective-mode instability favors an excitonic supersolid, distinguishing loss of spatial uniformity from loss of coherence. We conjecture that the quantum Hall bilayer evolves continuously toward weak pairing of composite fermions, with a scale far below the mean-field prediction at large separation. This suppression could produce an apparent critical separation at finite temperature without a ground-state quantum phase transition. The comparison separates the existence, energy scale, and spatial stability of interlayer coherence.", "url": "https://arxiv.org/abs/2610.22037", "type": "理论+数值", "summary": "1. 我们研究了零磁场下二维电子空穴双层和总填充 $\\nu_T=1$ 下量子霍尔双层中的层间激子超流性与层分离的关系。\n2. 在高场下，我们在最低 Landau 能级中获得了一个解析均匀 Hartree-Fock 鞍点，在每个有限间隔处都是相干的。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Sankar Das Sarma"}, {"name": "Yang-Zhi Chou"}], "featured_authors": [{"name": "Sankar Das Sarma"}, {"name": "Yang-Zhi Chou"}], "author_count": 2}, {"id": "2610.22038", "category": "cond-mat", "title": "Partial Localization and Multifractality in Heterogeneous Population Growth with Resetting", "abstract": "We study a model of heterogeneous multiplicative growth with mean-field redistribution and independent local stochastic resetting. The model describes populations or wealth distributed over sites with quenched growth-rate heterogeneity, while resets represent random local extinction or bankruptcy events. At large redistribution or resetting rate, we find a delocalized phase and we compute the growth rate as well as the stationary distribution of the population of a given site. We show that reset-free growth episodes generate power-law stationary tails with site-dependent exponents. For weak resetting and redistribution, favorable sites can undergo long reset-free episodes and localize. This produces a partially localized phase, in which a finite fraction of the total population is carried by a small set of sites whose identity changes on an $O(1)$ time scale within a subextensive pool of $N^{u^\\star}$ favorable candidates, with $0<u^\\star<1$. We derive the corresponding growth rate from a saddle point analysis, and show that the averaged stationary fractions display multifractal behavior.", "url": "https://arxiv.org/abs/2610.22038", "type": "理论", "summary": "1. 该文研究具有淬火生长率异质性、平均场再分配和独立局部随机重置的异质乘性增长模型，用以描述局域灭绝或破产下的种群与财富分布，并刻画不同重置和再分配强度下的定态、增长率及局域化行为。\n2. 其核心发现是弱重置时出现部分局域相：少数位点承载有限比例总人口，其身份在N^{u^*}个有利候选池中以O(1)时间尺度更替；无重置增长产生位点依赖幂律尾，平均定态分数呈多重分形，并由鞍点分析导出增长率。\n3. 这为理解随机重置、再分配与淬火异质性共同驱动的局域-离域转变和多重分形统计提供框架，并提示在生态种群、财富分布及随机过程中可检验的普适特征。", "summary_source": "deepseek", "authors": [{"name": "Maximilien Bernard"}, {"name": "Giuseppe Del Vecchio Del Vecchio"}, {"name": "Jean-Philippe Bouchaud"}, {"name": "Pierre Le Doussal"}], "featured_authors": [{"name": "Maximilien Bernard"}, {"name": "Giuseppe Del Vecchio Del Vecchio"}, {"name": "Jean-Philippe Bouchaud"}, {"name": "Pierre Le Doussal"}], "author_count": 4}, {"id": "2610.22134", "category": "cond-mat", "title": "Putting a Temperature on Electron Correlation", "abstract": "It is common wisdom that a better understanding of how to quantify electron correlation should lead to more efficient treatments of the correlation problem. Here, we not only substantiate this view but turn it into a concrete, systematic framework for ground states. Since prominent correlation measures such as the nonfreeness depend only on the one-particle reduced density matrix, modeling the correlation energy as a function of such a measure naturally places the framework within reduced density matrix functional theory, while keeping the cost at mean-field level. Strikingly, the variable conjugate to the measure emerges as a ``correlation temperature'', thereby connecting correlation measures, functional theory, and effective temperatures. The framework rationalizes methods such as i-DMFT, and we illustrate its key concepts analytically for the Hubbard dimer and numerically for small molecular systems. This brings a fundamental question within reach: how much of the correlation problem can be solved at mean-field cost?", "url": "https://arxiv.org/abs/2610.22134", "type": "理论+数值", "summary": "1. 该工作将电子关联的定量描述转化为一个面向基态的系统性框架，通过在约化密度矩阵泛函理论中以关联度量构造关联能泛函，并保持平均场级计算成本。\n2. 其核心卖点是由该度量的共轭变量自然导出“关联温度”，从而把非自由数等关联度量、泛函理论和有效温度统一起来，并在哈伯德二聚体与小分子体系中进行了验证。\n3. 这一框架为i-DMFT等方法提供了合理解释，并将“关联问题能在多大程度上以平均场成本求解”这一根本问题推向可操作层面。", "summary_source": "deepseek", "authors": [{"name": "Paul G. Graf"}, {"name": "Florian Matz"}, {"name": "Markus Penz"}, {"name": "Christian Schilling"}], "featured_authors": [{"name": "Paul G. Graf"}, {"name": "Florian Matz"}, {"name": "Markus Penz"}, {"name": "Christian Schilling"}], "author_count": 4}, {"id": "2610.22140", "category": "cond-mat", "title": "A rigid commensurate host and a defect that switches: vacancies in the frustrated alternating spin-(1, 1/2) Heisenberg chain", "abstract": "The alternating spin-$(1,\\tfrac12)$ Heisenberg chain with a frustrating next-nearest-neighbor coupling $J_2$ loses its Lieb--Mattis moment through a discontinuous transition to a singlet whose nature was left open. Using an SU(2)-symmetric density-matrix renormalization group, in which the total spin is a quantum-number label, we identify that phase and follow a single vacancy through it. The total spin collapses directly from $S=L/4$ to $S=0$, with no partially polarized window. The singlet phase is critical: its singlet--triplet gap closes as $1/L$, its entanglement entropy grows logarithmically with a central charge $c\\simeq1.8$, and its modulation wavevector, extrapolated from $L=80$ to $200$, is commensurate at $3\\pi/4$ and independent of $J_2$ to $5\\times10^{-5}$. Removing the central $S=1$ site switches the ground state of the doped chain from a triplet to a singlet at $J_2^{\\ast}=0.3068(3)$, where the host shows no feature; the triplet is not bound to the vacancy but spread over one of the two segments it leaves. The transmission of correlations through the vacancy saturates at a finite value below $J_2^{\\ast}$, $T(\\infty)=0.102(15)$ and $0.036(9)$ at $J_2=0.28$ and $0.30$, and the cut-chain law $T\\propto L^{-1}$ is excluded on both sides. We also show that the longitudinal correlator is not an observable in a triplet sector.", "url": "https://arxiv.org/abs/2610.22140", "type": "理论", "summary": "1. 该工作用SU(2)对称DMRG研究阻挫交替自旋(1,1/2)海森堡链，确认Lieb-Mattis矩不连续消失后的单态相，并追踪单个空位。\n2. 其卖点是该相为临界单态：总自旋从S=L/4直接坍缩到0而无部分极化窗口，自旋能隙按1/L闭合，纠缠熵对数增长且中心荷c≈1.8，调制波矢公度于3π/4并对J2不敏感至5×10^-5。\n3. 移除中心S=1格点使掺杂基态在J2*=0.3068(3)处由三重态切换为单态，母体无此特征；三重态离域于空位一侧链段，关联透射饱和并排除T∝L^-1，纵向关联在三重态区不可观测，提示空位可作为探测与切换临界相的缺陷。", "summary_source": "deepseek", "authors": [{"name": "R. L. Silva"}, {"name": "R. C. Silva"}, {"name": "A. R. Pereira"}], "featured_authors": [{"name": "R. L. Silva"}, {"name": "R. C. Silva"}, {"name": "A. R. Pereira"}], "author_count": 3}, {"id": "2610.22191", "category": "cond-mat", "title": "Attention over noisy examples: generalization and memorization in the exponential Hopfield network", "abstract": "In Hebbian learning from examples a Hopfield network of $N$ neurons is not supplied with the $K$ archetypes it has to retrieve but with $M$ blurred examples of each, of quality $r$, and whether it can infer them depends on the load $\\alpha=K/N$ (interference among them) and on the dataset entropy $\\rho=(1-r^2)/(Mr^2)$ (how little the examples say about them). We transfer this protocol to the exponential Hopfield model, whose zero-temperature update is a step of softmax attention with the unlabelled examples as keys. A signal-to-noise analysis gives in closed form the overlap between the output and an unseen archetype, $m^{(1)}={\\rm erf}(1/\\sqrt{2\\rho_{\\rm eff}})$: the majority-rule law of the pairwise model at small load, with $\\rho$ replaced by an attention entropy $\\rho_{\\rm eff}$ built from the weight the softmax gives to the correct class and the number of examples it spreads it over. Two consequences follow. First, in a window of inverse temperatures $\\beta$ that widens as $\\sqrt N$ the interference between archetypes is exponentially small in $N\\beta$: the load drops out and the number of archetypes that can be learnt grows as $\\exp(c\\sqrt N)$. Second, learning fails differently: in the pairwise model through a spin-glass phase, in the exponential model through memorization: the softmax concentrates its weight on the training example closest to the input and returns it in place of the archetype. Seen from the input the softmax weights are those of the random energy model, and memorization is its freezing transition, at $\\beta\\sqrt{N(1-r^2)}\\simeq\\sqrt{2\\ln M}$; it is measurable on a head whose keys are examples as the number of examples carrying weight. On MNIST the diagnostic follows the random-energy prediction; on fashion-MNIST it detects sub-clusters in the classes, and the best accuracy lies beyond the memorization threshold, where the softmax reads out a local sub-prototype.", "url": "https://arxiv.org/abs/2610.22191", "type": "理论", "summary": "1. 该工作将带噪样本的Hebbian学习协议推广至指数Hopfield网络，以softmax注意力为更新步，解析泛化与记忆。\n2. 核心结果是输出-原型重叠的闭式erf(1/√(2ρ_eff))，并指出记忆为随机能量模型冻结，负载在β窗口消失、可学原型数~exp(c√N)。\n3. 该诊断在MNIST符合随机能量预测，在fashion-MNIST揭示类内子簇，最佳精度出现在记忆阈值之后。", "summary_source": "deepseek", "authors": [{"name": "Francesco Alemanno"}], "featured_authors": [{"name": "Francesco Alemanno"}], "author_count": 1}, {"id": "2610.22361", "category": "cond-mat", "title": "Band-Resolved Superconducting Gaps via the Thermal Hall Effect in CeRu2", "abstract": "Standard bulk probes of multiband superconductors cannot assign pairing gaps to specific electron or hole Fermi surfaces. Here we show that thermal Hall transport ($\\kappa_{xy}$), constrained by specific heat and normal-state magnetotransport, resolves this ambiguity in the compensated heavy-fermion superconductor CeRu$_2$. Fixing the gap magnitudes ($\\Delta_e/k_B\\approx 13$K, $\\Delta_h/k_B\\approx 8$K) and band mobilities completely determines the electronic degrees of freedom in $\\kappa_{xx}$ and $\\kappa_{xy}$. A low-field sign reversal in $\\kappa_{xy}$ places the larger gap on the heavy Ce $4f$ electron sheets and the smaller on the hole sheets.", "url": "https://arxiv.org/abs/2610.22361", "type": "数值", "summary": "1. 该工作通过热霍尔输运测量，并结合比热与正常态磁输运约束，在补偿型重费米子超导体CeRu₂中实现了对多带超导能隙的费米面分辨。\n2. 其关键在于：固定能隙幅值（Δe/kB≈13 K、Δh/kB≈8 K）与各带迁移率后，κxx和κxy的电子自由度被完全确定，而κxy在低场下的符号反转可将较大能隙归属于重的Ce 4f电子片、较小能隙归属于空穴片。\n3. 这为多带超导体中配对能隙的带分辨提供了一种体态输运判据，并可推广至其他补偿型重费米子与多带体系。", "summary_source": "deepseek", "authors": [{"name": "Darian Hall"}, {"name": "Luke Pritchard Cairns"}, {"name": "Nico Rowland"}, {"name": "Yuanqi Lyu"}, {"name": "Kohtaro Yamakawa"}, {"name": "Josue Rodriguez"}, {"name": "Kirin Chanteloup"}, {"name": "Didier Perrodin"}, {"name": "Joel E. Moore"}, {"name": "James G. Analytis"}], "featured_authors": [{"name": "Darian Hall"}, {"name": "Luke Pritchard Cairns"}, {"name": "Nico Rowland"}, {"name": "Didier Perrodin"}, {"name": "Joel E. Moore"}, {"name": "James G. Analytis"}], "author_count": 10}, {"id": "2610.20696", "category": "hep-th", "title": "Worldsheet string theory on $\\mathrm{AdS}_3 \\times \\mathbf{S}^3 \\times \\mathrm{K3}$", "abstract": "The RNS formalism describing string theory on $\\mathrm{AdS}_3 \\times \\mathbf{S}^3 \\times \\mathrm{K3}$ supported by pure NS-NS flux is in principle straightforward to write down. One can directly check that the worldsheet theory reproduces the correct chiral spectrum expected from supergravity by analyzing the BRST cohomology. However, when one attempts to construct the worldsheet partition function using the standard rules of the RNS formalism by appropriately summing over spin structures to ensure worldsheet modular invariance, one finds a result in tension with spacetime supersymmetry. We explain why this is the case and, more importantly, propose a resolution. Specifically, we fix the physical state projection for the partition function uniquely by requiring spacetime supersymmetry. Perhaps surprisingly, the projected worldsheet partition function does not factorize into a bosonic and a fermionic part and involves functions that are not modular covariant. As a consistency check, we show that our prescription for the worldsheet partition function reproduces the supergravity spectrum for both Type IIB and IIA theories. Furthermore, we compute the elliptic genus of the dual CFT from the worldsheet, which has both a holomorphic short string and a non-holomorphic long string contribution. The latter displays characteristics of a mock modular function, albeit with some key differences, while the former has the tantalizing structure of a symmetric orbifold. We also point out the worldsheet construction of a non-supersymmetric theory, whose spectrum is free of tachyons.", "url": "https://arxiv.org/abs/2610.20696", "type": "理论", "summary": "1. 该工作研究纯 NS-NS 流下 AdS3×S3×K3 的 RNS 世界面弦论，发现标准自旋结构求和给出的配分函数与时空超对称冲突，并提议以时空超对称唯一固定物理态投影。\n2. 其卖点是：所得投影配分函数不再分解为玻色与费米部分，含非模协变函数，却能重现 IIB/IIA 超引力谱；由世界面得到的对偶 CFT 椭圆亏格中，短弦全纯项呈对称 orbifold 结构，长弦非全纯项带 mock 模函数特征。\n3. 这说明纯 NS-NS AdS3 全息中物理态投影可由时空超对称确定，并为长弦的 mock 模性质、短弦的对称 orbifold 结构及无快子非超对称弦论构造提供线索。", "summary_source": "deepseek", "authors": [{"name": "Lorenz Eberhardt"}, {"name": "Matthias R. Gaberdiel"}, {"name": "Sameer Murthy"}, {"name": "Mukund Rangamani"}], "featured_authors": [{"name": "Lorenz Eberhardt"}, {"name": "Matthias R. Gaberdiel"}, {"name": "Sameer Murthy"}, {"name": "Mukund Rangamani"}], "author_count": 4}, {"id": "2610.20699", "category": "hep-th", "title": "An SYK wormhole under the microscope", "abstract": "We derive a large-N wormhole saddle in the Sachdev-Ye-Kitaev (SYK) model for the variance of the thermal one-point function of a heavy operator across realizations of the microscopic couplings. We propose that this saddle describes a double trumpet geometry. In the double-scaling limit, we express the wormhole as a transition amplitude in an emergent bulk Hilbert space of chords connecting the two boundaries. In the Schwarzian limit, the chords proliferate and the wormhole defines a quantum transition amplitude in the open-universe Hilbert space of Jackiw-Teitelboim (JT) gravity. Comparing the SYK wormhole amplitude with its counterpart in JT gravity coupled to matter provides a direct test of the heavy-operator randomness hypothesis in SYK. The microscopic SYK couplings specify the {\\alpha}-parameters of the wormhole. For a fixed realization of the couplings, we compute the observable in the corresponding {\\alpha}-state. We provide the bulk wavefunction of the associated half-wormhole, which exhibits erratic correlations in the length basis that do not self-average. We extend the bulk description to the Hilbert space of a closed universe. We point out that the correlation chords from which the wormhole geometry emerges structurally resemble local observer worldlines.", "url": "https://arxiv.org/abs/2610.20699", "type": "理论", "summary": "1. 我们在 Sachdev-Ye-Kitaev (SYK) 模型中推导了一个大 N 虫洞鞍，用于解决重算子在微观耦合实现中的热单点函数的方差。\n2. 我们指出，虫洞几何形状的相关弦在结构上类似于本地观察者的世界线。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Valérie Bettaque"}, {"name": "Martin Sasieta"}, {"name": "Brian Swingle"}, {"name": "Alejandro Vilar López"}], "featured_authors": [{"name": "Valérie Bettaque"}, {"name": "Martin Sasieta"}, {"name": "Brian Swingle"}, {"name": "Alejandro Vilar López"}], "author_count": 4}, {"id": "2610.20701", "category": "hep-th", "title": "Region bounds, error margins and certified positivity in the numerical conformal bootstrap; Or the first mathematically rigorous bounds on the 3d Ising CFT critical exponents", "abstract": "Numerical conformal bootstrap bounds are commonly called rigorous, yet as published they are not theorems: they hold at sampled points rather than on regions of parameter space, for truncated rational approximations of the conformal blocks, for a finite list of spins, and up to floating-point rounding. We close all four gaps. We show how to search efficiently for functionals positive on regions, including external-dimension space; how positivity on the large-spin crossing vectors can be imposed as such a region constraint; how new analytic bounds on the conformal-block recursion relations give functionals positive on the true, untruncated crossing vectors; and how to certify the positivity of these functionals in exact arithmetic. The certification rests on Bernstein-basis positivity certificates in up to three variables, exact arithmetic in $\\mathbb{Q}(\\sqrt2)$, a compactified treatment of the infinite spin tail, and an explicit bound on the difference between the true blocks and their truncations, so that infinitely many positivity conditions reduce to finitely many machine-checked sign conditions. As a flagship application we certify an exclusion region in the $(\\Delta_\\sigma,\\Delta_\\epsilon)$ plane: for $\\Delta_\\sigma\\in[0.505,0.5405]$ all of $\\Delta_\\epsilon\\in(1/2,3]$ is excluded except a small rectangle containing the 3d Ising island, giving rigorous two-sided bounds on the critical exponents $\\eta$ and $\\nu$ under explicitly stated spectrum assumptions. The analytic inputs for the mixed $\\sigma$-$\\epsilon$ system, which would remove the spin-2 gap assumption, are also proved. The same methods prevent common practical failure modes and can make bootstrap searches faster: region bounds turn the mapping of an island into a handful of one-dimensional bisections. The essential code to reproduce the search and the certification, and all machine-checkable certificates, are released.", "url": "https://arxiv.org/abs/2610.20701", "type": "理论", "summary": "1. 该工作消除数值共形自举中采样点、共形块截断、有限自旋与浮点舍入四类漏洞，在(Δσ,Δε)平面认证出排除区域，并据此在明确谱假设下给出三维Ising临界指数η、ν的严格双侧界。\n2. 其技术核心是把区域正性约束引入泛函搜索，用多变量Bernstein基正性证书、Q(√2)精确算术、无穷自旋尾部紧化及截断误差显式界，将无穷多条正性条件约化为有限条可机器检验的符号条件，并证明混合σ-ε系统所需解析输入。\n3. 这使自举界首次成为可机器验证的定理，区域界可将岛的定位化为少量一维二分搜索，并为去除spin-2间隙假设提供路径。", "summary_source": "deepseek", "authors": [{"name": "Marten Reehorst"}], "featured_authors": [{"name": "Marten Reehorst"}], "author_count": 1}, {"id": "2610.20703", "category": "hep-th", "title": "Finite-cutoff geometry from double-scaled SYK", "abstract": "We develop a finite-cutoff holographic description of the double-scaled SYK (DSSYK) model. We construct microscopic deformations of Kourkoulou-Maldacena and thermofield-double SYK states whose double-scaling limits reproduce a lower-dimensional analogue of $\\text{T}\\overline{\\text{T}}$ and $\\text{T}\\overline{\\text{T}}+\\Lambda_2$ deformations, which we denote $T^2$ and $T^2+\\Lambda_1$, respectively. The ensemble-averaged theory describes wormhole states in finite-cutoff sine dilaton gravity, and finite-cutoff anti-de Sitter and de Sitter geometries in the low- and high-energy regimes, respectively. The analysis includes both perturbative and non-perturbative solutions to the energy spectrum flow equation, and the regions behind and beyond the respective horizons. Only the perturbative branch admits physical quantum states. We study how to incorporate end-of-the-world (ETW) branes in the finite cutoff holographic dictionary. The ETW brane leads to an additional boundary theory deformation, which leads to black hole or eternal traversable wormhole geometries depending on the existence of normalizable bound states. We extend the finite cutoff length evaluations for constant mean curvature (CMC) slices, and interpret them as complexity in the boundary theory. We discuss possible extensions with matter. Our results provide a microscopic framework for studying the finite-cutoff boundaries, CMC slices and branes in the holographic dictionary of DSSYK.", "url": "https://arxiv.org/abs/2610.20703", "type": "理论", "summary": "1. 该工作构建双标度SYK有限截断全息描述，用KM与热场双态微观形变复现T^2和T^2+Λ1形变。\n2. 关键卖点是集合平均理论对应有限截断sine dilaton引力虫洞态，并在低/高能区给出有限截断AdS与dS几何。\n3. 结果为在DSSYK全息字典中纳入有限截断边界、CMC切片、ETW膜及物质扩展提供了微观框架。", "summary_source": "deepseek", "authors": [{"name": "Sergio E. Aguilar-Gutierrez"}], "featured_authors": [{"name": "Sergio E. Aguilar-Gutierrez"}], "author_count": 1}, {"id": "2610.20707", "category": "hep-th", "title": "Gluon Scattering in Expanding de Sitter Universe", "abstract": "We construct an observer-centric S-matrix in the expanding Poincaré patch of four-dimensional de Sitter space. The asymptotic states are defined along the worldline of a comoving, or eternal, observer, the only kind of geodesic observer that remains in the patch for all proper time, and the free Hamiltonian is the conserved charge generating translations in her proper time. The resulting S-matrix is independent of which eternal observer is chosen. We apply the construction to pure Yang--Mills theory in Coulomb gauge and compute the three- and four-gluon amplitudes at tree level. The amplitudes have a structure similar to the cosmological correlators of gauge currents and are constrained by the Ward identities of de Sitter isometries.", "url": "https://arxiv.org/abs/2610.20707", "type": "理论", "summary": "1. 该工作在四维膨胀德西特时空的庞加莱片中构建了以观测者为中心的散射矩阵，并将其应用于库仑规范下的纯杨-米尔斯理论，在树图层次计算了三胶子和四胶子振幅。\n2. 其核心卖点是以共动永恒观测者（唯一全程停留片内的测地观测者）世界线定义渐近态，以该观测者固有时平移的守恒荷作为自由哈密顿量，所得散射矩阵不依赖于所选永恒观测者；振幅结构类似规范流宇宙学关联函数，并受德西特等距沃德恒等式约束。\n3. 这为膨胀时空中规范理论散射与宇宙学关联函数之间建立了自洽联系，并暗示德西特对称性可有效约束胶子振幅，为后续研究提供了框架。", "summary_source": "deepseek", "authors": [{"name": "Audrey Lindsay"}, {"name": "Tomasz R. Taylor"}], "featured_authors": [{"name": "Audrey Lindsay"}, {"name": "Tomasz R. Taylor"}], "author_count": 2}, {"id": "2610.20721", "category": "hep-th", "title": "6d SCFTs and terminal singularities", "abstract": "The classification of 6d $\\mathcal{N}=(1,0)$ SCFTs has been carried out with great success, enumerating consistent elliptically fibered threefolds in F-theory. In this note, we observe that the E-string 6d SCFT can be decorated with extra matter sectors. This decoration exploits an opening allowed by the current classification, implementing terminal singularities nested on the curve of the base of the elliptic fibration that supplies the tensor branch. Additionally, via dimensional reduction on a circle, we identify versions of the 5d $E_n$ theories decorated by extra matter sectors. As a bonus, the end of the resulting RG flow cascade reproduces a 5d theory recently constructed in the literature, explaining its 6d origin. We remain agnostic as to whether the decorated 6d and 5d theories constitute novel SCFTs.", "url": "https://arxiv.org/abs/2610.20721", "type": "理论", "summary": "1. 该文在F理论分类框架内，用张量分支底曲线上的嵌套终端奇点装饰E-string 6d SCFT。\n2. 卖点在于用底曲线上嵌套终端奇点实现装饰，并经圆周紧致化得到5d E_n装饰理论，RG流末端再现近期5d构造并说明其6d起源。\n3. 这暗示现有分类中可能存在更多装饰自由度，但作者对装饰后的6d与5d理论是否为新SCFT保持开放。", "summary_source": "deepseek", "authors": [{"name": "Andrea Sangiovanni"}], "featured_authors": [{"name": "Andrea Sangiovanni"}], "author_count": 1}, {"id": "2610.20745", "category": "hep-th", "title": "Orientation-Dependent Casimir Energy and Generalized Torque in Lorentz-Violating Rectangular Compactifications", "abstract": "We derive the renormalized Casimir energy of a free massive real scalar field on the rectangular compactification \\(\\mathbb{R}^{1,r}\\times T^p\\) in the presence of a constant CPT-even aether-like Lorentz-violating background. Allowing the spatial part of the background vector to have an arbitrary orientation relative to the compactification lattice, we characterize the resulting orientation-dependent geometric response of the vacuum. Integrating out the noncompact momenta reduces the effective spatial kinetic matrix to its Schur complement, and Poisson resummation yields a closed, exponentially convergent Bessel-function lattice sum within the stability domain. The resulting expression separates an orientation-independent kinetic normalization, \\([1+\\lambda u_\\mu u^\\mu]^{-1/2}\\), from an orientation-dependent deformation of the image-lattice metric. Coordinate-aligned configurations are recovered as special cases, and the exact massless limit and the compact-direction pressures are obtained. For a two-dimensional compact subspace, we explicitly analyze the angular dependence of the vacuum energy and derive the associated generalized Casimir torque. These results establish how the relative orientation between a Lorentz-violating background and an anisotropic compactification lattice enters the renormalized vacuum energy and its directional response.", "url": "https://arxiv.org/abs/2610.20745", "type": "理论", "summary": "1. 该工作在恒定CPT偶aether型洛伦兹破坏背景下，计算了矩形紧化R^{1,r}×T^p上自由大质量实标量场的重整化卡西米尔能。\n2. 其卖点在于允许背景空间分量相对紧化格任意取向，用Schur补与Poisson重求和得到指数收敛的Bessel格点求和，并分离取向无关的动能归一化与取向相关的像格点度规形变。\n3. 该框架确立了洛伦兹破坏背景与各向异性紧化格的相对取向如何进入重整化真空能及其方向响应，并给出二维情形的角依赖与广义卡西米尔力矩。", "summary_source": "deepseek", "authors": [{"name": "Zohreh Ashkipoor Gofreh"}, {"name": "Reza Moazzemi"}], "featured_authors": [{"name": "Zohreh Ashkipoor Gofreh"}, {"name": "Reza Moazzemi"}], "author_count": 2}, {"id": "2610.20768", "category": "hep-th", "title": "The Magic Barrier: A Universal Feature of Quantum Thermalization", "abstract": "We show that the emergence of a ``magic barrier'', characterized by a transient maximum of nonstabilizerness during rapid entanglement growth, is a universal feature of thermalization within quantum ergodic theories, which is intimately connected to random matrix spectral properties. Starting from a pure product state, we analytically determine the time evolution of entanglement entropy, antiflatness, capacity of entanglement, and nonlocal trace distance magic under unitary dynamics generated by random matrix Hamiltonians drawn from all three Gaussian ensembles. We find that the transient maxima of antiflatness, capacity of entanglement, and nonlocal magic occur on the same characteristic timescale as the maximum rate of entanglement growth. These results establish that the magic barrier is a universal feature of RMT thermalization, suggesting universality across quantum chaotic systems. We conclude that quantitative simulations of thermalization in ergodic quantum theories inherently require quantum computation.", "url": "https://arxiv.org/abs/2610.20768", "type": "理论", "summary": "1. 该工作从纯直积态出发，对三类高斯随机矩阵哈密顿量解析求解纠缠熵、非平坦度、纠缠容量与非局域迹距离魔法度的幺正演化。\n2. 其核心在于证明快速纠缠增长期间非稳定化度出现暂态极大值的\"魔法壁垒\"是量子遍历理论热化的普适特征，并与随机矩阵谱性质紧密相关。\n3. 该结果暗示魔法壁垒在量子混沌系统中普遍存在，并意味着遍历量子理论热化的定量模拟本质上需要量子计算。", "summary_source": "deepseek", "authors": [{"name": "Jakob J. Minar"}, {"name": "Andreas Schäfer"}, {"name": "Leonhard Schmotzer"}, {"name": "Clemens Seidl"}], "featured_authors": [{"name": "Jakob J. Minar"}, {"name": "Andreas Schäfer"}, {"name": "Leonhard Schmotzer"}, {"name": "Clemens Seidl"}], "author_count": 4}, {"id": "2610.20770", "category": "hep-th", "title": "All Order Gravitational Wave Tails for Subleading Post-Newtonian Expansion", "abstract": "The low-frequency gravitational waveform emitted in a classical scattering process contains an infinite tower of late- and early-time tail terms of the form $u^{-r}(\\ln|u|)^{r-1}$, $r \\geq 1$. In the Newtonian limit, the coefficients of this entire tower have recently been shown to be universal, i.e. fixed by the asymptotic data of the scattering objects alone. At the retained order in the velocity expansion, these leading-logarithmic tails are determined to all orders in Newton's constant $G$. We extend this result to the first subleading order in the post-Newtonian expansion of the asymptotic states. We consider scattering of an arbitrary number of incoming and outgoing nonrelativistic objects interacting only through gravity at long range, and we derive the complete tower of tail terms at this order. The correction arises from the first subleading term in the retardation expansion and is determined by the asymptotic Newtonian trajectories of the massive particles. Its coefficients are again determined entirely by the asymptotic trajectories and are independent of the details of the interaction. For $2\\to2$ scattering, the leading-logarithmic series can be summed in closed form. Our results agree with a relativistic conjecture proposed in earlier work arXiv:2610.07134 .", "url": "https://arxiv.org/abs/2610.20770", "type": "理论", "summary": "1. 该工作将牛顿极限下引力波尾巴系数的普适性推广到后牛顿展开的首个次领头阶，并推导了任意数量入射与出射非相对论天体仅通过长程引力散射时的完整尾巴项塔。\n2. 其核心卖点在于该阶修正源自推迟展开的首个次领头项，完全由有质量粒子的渐近牛顿轨迹确定，系数不依赖相互作用细节，且两体散射的领头对数级数可闭式求和。\n3. 该结果与先前提出的相对论性猜想一致，表明渐近数据对尾巴结构的全阶确定可延伸至次领头后牛顿阶，并为相对论引力波波形的高阶尾巴计算提供检验与启发。", "summary_source": "deepseek", "authors": [{"name": "Debanjan Karan"}, {"name": "Babli Khatun"}], "featured_authors": [{"name": "Debanjan Karan"}, {"name": "Babli Khatun"}], "author_count": 2}, {"id": "2610.20839", "category": "hep-th", "title": "Exact AdS and pp-waves in multi-gravity beyond pairwise interactions", "abstract": "We construct exact anti-de Sitter (AdS) waves and pp-waves in ghost-free multi-gravity beyond pairwise interactions for an arbitrary number $\\mathcal{N}$ of vielbeins, in any spacetime dimension $D\\geq3$. Deforming proportional AdS and Minkowski solutions along a common null direction reduces the full nonlinear field equations to coupled linear differential equations for the wave profiles, without restricting their amplitudes. The system is diagonalised in the same eigenbasis as the perturbative Fierz-Pauli mass matrix, separating the solutions into one massless and $\\mathcal{N}-1$ massive eigenprofiles. We obtain explicit radial and transverse solutions and impose an AdS boundary falloff. This falloff admits the appropriate radial branch of every mode with non-negative squared mass and excludes profiles with negative squared masses, including logarithmic solutions at the Breitenlohner-Freedman threshold. We also relate the AdS waves to pp-waves through a local flat limit. Explicit examples exhibit wave configurations that cannot be reproduced by ghost-free pairwise theories, demonstrating that genuine multi-field interactions support new exact gravitational-wave solutions.", "url": "https://arxiv.org/abs/2610.20839", "type": "理论", "summary": "1. 该工作在无鬼多引力中构建了超越成对相互作用、任意数目vielbein与任意D≥3的精确AdS波和pp波。\n2. 其核心是沿公共零方向形变比例AdS/Minkowski解，将非线性方程化为波剖面的耦合线性方程而不限制振幅，并按Fierz-Pauli质量本征基对角化。\n3. 该边界衰减仅保留非负质量平方模的合适径向支，排除负质量平方及BF阈值对数解，并显式展示超越成对的多场相互作用可产生新的精确引力波解。", "summary_source": "deepseek", "authors": [{"name": "Joakim Flinckman"}], "featured_authors": [{"name": "Joakim Flinckman"}], "author_count": 1}, {"id": "2610.20853", "category": "hep-th", "title": "Beyond the polynomial ansatz: regular $AdS_3\\times M_8$ solutions of M-theory", "abstract": "We study regular compact solutions of the cohomogeneity-one $AdS_3\\times M_8$ system of Gauntlett, Mac Conamhna, Mateos and Waldram, where $M_8$ is an $S^2$ bundle over three constant-curvature Riemann surfaces. We find that an endpoint argument rules out every non-flat curvature-sign sector without a positive-curvature factor, while an analytic deformation gives regular families with four radial shape parameters in all remaining sectors, with the base geometry held fixed. The known polynomial solutions form a proper analytic locus in these families. Non-polynomiality is therefore generic in parameter space, although the deviation from an endpoint-matching polynomial can be very small. Apart from the completely flat exception, the curvature-sign criterion is necessary and sufficient within this ansatz. Four magnetic flux ratios give local coordinates near the reference solution and its small-curvature deformations, and a rational inverse reconstructs candidate endpoint data directly from finite flux ratios. In the fully positive sector we prove that one explicit four-dimensional finite-ratio neighbourhood lies inside the physical flux image. The magnetic periods and leading holographic central charge reduce to endpoint data, and, once the common Brown--Henneaux normalization is fixed, the nontrivial flux dependence of the equivariant localization formula agrees with the endpoint result as an exact algebraic identity. We also quantify the non-polynomial corrections and analyse finite degenerations under explicit convergence hypotheses.", "url": "https://arxiv.org/abs/2610.20853", "type": "理论", "summary": "1. 该工作在GMMW提出的余齐性一AdS3×M8 M理论系统中构造了超越多项式拟设的正规紧致解族。\n2. 其技术卖点在于除全平坦情形外曲率符号判据充要，并给出含四个径向形状参数、以已知多项式解为真解析子集的解族。\n3. 该框架使有限磁通比可直接反演端点数据并计算全息中心荷，为检验等变局域化及推广非多项式AdS3解提供可操作路径。", "summary_source": "deepseek", "authors": [{"name": "Carolina Matté Gregory"}], "featured_authors": [{"name": "Carolina Matté Gregory"}], "author_count": 1}, {"id": "2610.20931", "category": "hep-th", "title": "Local supersymmetry implies momentum map/Gauntlett-Pakis equations and vanishing generalized Komar forms", "abstract": "The first-order differential equations satisfied by Killing spinor bilinears (momentum map equations or Gauntlett--Pakis equations, Killing vector equations and the vanishing of the generalized Komar charge of the supersymmetric Killing vector) can be derived directly from the action of the local supersymmetry algebra on bosonic fields. We show how this comes about in several examples of increasing complexity, one of which is 11-dimensional supergravity.", "url": "https://arxiv.org/abs/2610.20931", "type": "理论", "summary": "1. 该工作从局域超对称代数对玻色场的作用出发，直接导出基灵旋量双线性所满足的一阶微分方程。\n2. 其卖点在于统一给出动量映射方程、基灵矢量方程及超对称基灵矢量广义科马尔荷的消失。\n3. 作者以复杂度递增的多个实例展示该机制，其中包括十一维超引力，为超引力解与守恒量研究提供系统启发。", "summary_source": "deepseek", "authors": [{"name": "Patrick Meessen"}, {"name": "Tomás Ortín"}], "featured_authors": [{"name": "Patrick Meessen"}, {"name": "Tomás Ortín"}], "author_count": 2}, {"id": "2610.21058", "category": "hep-th", "title": "Regge Dilaton Gravity from BF Theory", "abstract": "In this work we investigate the relation between gauge and geometric descriptions of two-dimensional dilaton gravity at the level of discrete path integrals. We develop a Regge discretization of Euclidean two-dimensional dilaton gravity using homogeneously curved simplices, as well as a ribbon refined discretization of two-dimensional BF theory adapted to homogeneously curved spacetimes. For Euclidean signature and vanishing or negative cosmological constant we show how the ribbon BF discretization, through appropriate gauge fixings, leads to the Regge dilaton gravity formulation. The resulting correspondence makes explicit how a geometric Regge path integral with its associated measure emerges from its gauge theoretic formulation.", "url": "https://arxiv.org/abs/2610.21058", "type": "理论", "summary": "1. 该工作研究了二维伸缩子引力的规范描述与几何描述在离散路径积分层面的对应关系，分别构造了基于均匀曲率单纯形的欧氏二维伸缩子引力Regge离散化，以及适配均匀曲率时空的二维BF理论ribbon精细离散化。\n2. 其主要技术卖点在于证明在欧氏号差、宇宙学常数为零或负时，ribbon BF离散化经适当规范固定可导出Regge伸缩子引力，从而使带测度的几何Regge路径积分如何从规范理论表述中涌现变得显式。\n3. 这为在离散层面理解引力路径积分测度的来源、以及将规范理论方法推广到其他低维引力模型提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Florian Girelli"}, {"name": "Christopher Pollack"}], "featured_authors": [{"name": "Florian Girelli"}, {"name": "Christopher Pollack"}], "author_count": 2}, {"id": "2610.21066", "category": "hep-th", "title": "Stability and dynamics of bumblebee models", "abstract": "In this work, we study vector field theories with spontaneous Lorentz violation induced by a nonderivative potential $V(X)$ (with $X = B_\\mu B^\\mu$), known as bumblebee models, with a Maxwell kinetic term in Minkowski spacetime. We confirm a recent result showing that a class of smooth potentials, including a purely cubic potential, leads to a Hamiltonian density that is bounded from below and assumes a global minimum for nonzero timelike expectation values of the vector field satisfying $X = b^2 > 0$, inducing spontaneous Lorentz-symmetry breaking. We show explicitly that the standard quadratic potential has a Hamiltonian that is unbounded from below and thus unstable. We analyze the Hamiltonian equations of motion for the timelike case and demonstrate that they are regular at the global minimum. Furthermore, we examine the linearized spectrum of small fluctuations around the minimum. We also study particular solutions with spherical symmetry analytically and numerically, without assuming linearization. We find that the time evolution of smooth initial configurations can develop shock-like singularities, and we explain why this behavior is expected in this model. We also identify a subset of the space of field configurations in which the field equations cease to be hyperbolic, leading to a breakdown of well-posedness of the Cauchy initial-value problem.", "url": "https://arxiv.org/abs/2610.21066", "type": "理论", "summary": "1. 该工作在闵可夫斯基时空中研究含麦克斯韦动能项与势 V(X) 的大黄蜂模型，考察洛伦兹自发破缺的稳定性与动力学。\n2. 其核心结果是：立方等光滑势使哈密顿量有下界且在 X=b^2>0 时取全局最小，二次势则无下界；线性谱与球对称解显示激波奇点与方程失去双曲性。\n3. 这表明大黄蜂模型需谨慎选取势函数以维持稳定真空与柯西问题适定性，并为洛伦兹破缺有效场论提供约束。", "summary_source": "deepseek", "authors": [{"name": "Quentin G. Bailey"}, {"name": "Robertus Potting"}, {"name": "Dario T. Walter-Cardona"}], "featured_authors": [{"name": "Quentin G. Bailey"}, {"name": "Robertus Potting"}, {"name": "Dario T. Walter-Cardona"}], "author_count": 3}, {"id": "2610.21478", "category": "hep-th", "title": "Difference between pair creation and anomaly matching: Nontrivial aspects of invertible symmetries and defects in $SU(N)$ models", "abstract": "We study the connection between the $SU(N)_{K}$ Wess-Zumino-Witten (WZW) model and $SU(N)_{K'}$ WZW models, enforcing the unbroken $\\mathbb{Z}_{N}$ symmetries. The fundamental underlying structures are the (half-)integer spin simple currents in the topological quantum field theories and anomaly matching conditions in conformal field theories. For the (half-)integer spin simple current condition of the folded models $SU(N)_{K}\\boxtimes_{\\mathbb{Z}_{N}} \\overline{SU(N)_{K'}}$ or $SU(N)_{K}\\boxtimes_{\\mathbb{Z}_{N}} SU(N)_{K'}$, we obtain the generalized pairing condition $K= \\pm R^{2}K' (\\text{mod}.N)$ with $\\text{gcd}(R,N)=1$. On the other hand, the anomaly matching condition results in the weaker condition $K= \\pm RUK' (\\text{mod}.N)$ with $\\text{gcd}(R,N)=\\text{gcd}(U,N)=1$. Surprisingly, the anomaly matching without the pairing condition results in the intrinsic mismatch of the preservation law of the $\\mathbb{Z}_{N}$ defects and symmetries. The pairing condition canonically relates symmetries and defects, as in category theory, whereas it is unclear whether it can be a guiding principle in prohibiting the massless renormalization group flows.", "url": "https://arxiv.org/abs/2610.21478", "type": "理论", "summary": "1. 该工作研究了在保持未破缺 Z_N 对称性下 SU(N)_K 与 SU(N)_{K'} WZW 模型间的配对条件与反常匹配条件。\n2. 其关键结果是简单流配对给出更强约束 K=±R^2K' mod N，而反常匹配仅给出 K=±RUK' mod N，并导致 Z_N 缺陷与对称性的守恒律内在失配。\n3. 配对条件在范畴意义上自然联系对称性与缺陷，但其能否作为禁止无质量重整化群流的指导原则仍不明确。", "summary_source": "deepseek", "authors": [{"name": "Yoshiki Fukusumi"}, {"name": "Shuma Nakashiba"}], "featured_authors": [{"name": "Yoshiki Fukusumi"}, {"name": "Shuma Nakashiba"}], "author_count": 2}, {"id": "2610.21574", "category": "hep-th", "title": "Krylov complexity and oscillatory quantum dynamics in two-field inflation", "abstract": "We investigate Krylov-space dynamics of primordial perturbations in two-field inflation. Starting from the quadratic action for coupled curvature and entropy perturbations, we solve the mode equations with Bunch-Davies initial conditions and construct the corresponding quadratic Hamiltonian. The Gaussian quantum state is described by a four-mode squeezed state with two squeezing channels. We derive the evolution of the squeezing strength and squeezing angle and use them to evaluate the Krylov complexity, Krylov entropy, and channel-resolved Lanczos coefficients. Our numerical results show that the two channels remain weakly squeezed inside the horizon but develop different squeezing histories after horizon exit. The two channels exhibit different onset times and distinct oscillatory Krylov dynamics. The second channel develops strong squeezing earlier and dominates the intermediate evolution, whereas the first channel shows a delayed enhancement. The corresponding Krylov complexities exhibit oscillatory structures across horizon crossing and pronounced fluctuations in the strongly squeezed superhorizon regime. These oscillations originate from the relative phases entering the squeezing equations and are amplified through the nonlinear relation between Krylov complexity of different channels.", "url": "https://arxiv.org/abs/2610.21574", "type": "理论", "summary": "1. 该工作研究了双场暴胀中原初扰动的 Krylov 空间动力学，基于曲率与熵扰动耦合的二次作用量求解模方程并计算复杂度。\n2. 卖点在于两压缩通道在视界退出后呈现不同起始时间与振荡的 Krylov 行为，且振荡源于压缩方程中的相对相位经通道间非线性关系放大。\n3. 这为用量子复杂度刻画暴胀扰动、区分多场通道动力学提供了新视角，并启发后续将复杂度与可观测谱联系的研究。", "summary_source": "deepseek", "authors": [{"name": "Tao Li"}, {"name": "Lei-Hua Liu"}, {"name": "Hai-Bing Fu"}], "featured_authors": [{"name": "Tao Li"}, {"name": "Lei-Hua Liu"}, {"name": "Hai-Bing Fu"}], "author_count": 3}, {"id": "2610.21592", "category": "hep-th", "title": "Fortuitous BMN Cohomology at Every $N$", "abstract": "Finite-$N$ trace relations can produce $Q$-cohomology classes with no stable large-$N$ ancestor. The brane-fused construction at $SU(3)$ suggests that such states can retain an $SU(2)$ nonabelian core accompanied by scalar hair. We develop this idea into a general construction for every $SU(N)$, $N\\geq3$. Starting from the $SU(2)$ threshold operator $O_{24}$, we select pairs of eigenvalues of one scalar and construct corrected two-colour letters whose $Q$-transformations obey the $SU(2)$ rules exactly. Substitution into $O_{24}$ gives a closed rational operator for each pair. Multiplying by eigenvalue-separation factors removes the denominators, and summing over all pairs produces a gauge-invariant polynomial. An exact block-restriction identity recovers a nonzero multiple of $O_{24}$. The restriction maps every stable class to a stable $SU(2)$ class, proving that the resulting operator is non-exact and fortuitous, even when non-Coulombic stable classes are included. This proves the existence of fortuitous BMN cohomology at every $N\\geq3$. The construction is an exact algebraic realization of a nonabelian core with scalar dressing.", "url": "https://arxiv.org/abs/2610.21592", "type": "理论", "summary": "1. 有限$N$迹关系可以产生没有稳定的大$N$祖先的$Q$上同调类。\n2. $SU(3)$ 处的膜融合结构表明，此类状态可以保留 $SU(2)$ 非阿贝尔核心并伴有标量毛。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Robert de Mello Koch"}, {"name": "Minkyoo Kim"}, {"name": "Sinong Liu"}], "featured_authors": [{"name": "Robert de Mello Koch"}, {"name": "Minkyoo Kim"}, {"name": "Sinong Liu"}], "author_count": 3}, {"id": "2610.21706", "category": "hep-th", "title": "Renormalization of Quantum Gravity with Lagrange Multiplier Fields", "abstract": "We study the renormalization of Einstein gravity coupled to a scalar field in the Lagrange multiplier (LM) formulation, where a pair of quantum LM fields, $(\\lambda'_{\\mu\\nu},\\sigma')$, is coupled to the gauge-fixed gravitational and scalar equations of motion. Using the fact that in this approach there are no higher loop corrections, we show that renormalizing the two quantum LM fields at one-loop order absorbs, off-shell, five out of the six independent divergent structures. The remaining off-shell counterterm, proportional to $ (\\partial_\\mu\\bar\\phi\\,\\partial^\\mu\\bar\\phi)^2, $ is nonzero on shell and cannot be absorbed by any LM field redefinition, since such redefinitions generate only counterterms that vanish on shell. In contrast, in pure gravity (no matter), the LM renormalization absorbs all one-loop divergences and no additional counterterms are required. The LM formulation therefore provides a sharp off-shell separation between equation-of-motion divergences, absorbed into LM field renormalizations, and the single irreducible structure.", "url": "https://arxiv.org/abs/2610.21706", "type": "理论", "summary": "1. 该文在拉格朗日乘子表述下研究爱因斯坦引力与标量场耦合的单圈重整化，将量子LM场耦合到规范固定后的引力与标量运动方程。\n2. 其卖点在于利用无高阶圈修正，使两个量子LM场的单圈重整化在离壳吸收六个独立发散中的五个，仅余(∂φ·∂φ)^2型在壳非零且不可吸收项。\n3. 该表述因此为区分运动方程发散与唯一不可约离壳结构提供判据，并显示纯引力无需额外反项。", "summary_source": "deepseek", "authors": [{"name": "F. T. Brandt"}, {"name": "J. Frenkel"}, {"name": "S. Martins-Filho"}, {"name": "D. G. C. McKeon"}], "featured_authors": [{"name": "F. T. Brandt"}, {"name": "J. Frenkel"}, {"name": "S. Martins-Filho"}, {"name": "D. G. C. McKeon"}], "author_count": 4}, {"id": "2610.21879", "category": "hep-th", "title": "One generation of the Standard Model as a quantum error-correcting code", "abstract": "Together with a right-handed neutrino, the fermions of one generation of the Standard Model are labelled by five bits, a combinatorial structure tied to anomaly cancellation. We make this precise. Anomaly cancellation is the vanishing of a cubic form, the defining property of triorthogonal codes, the quantum error-correcting codes behind magic state distillation. Removing the right-handed neutrino gives a $[[15,1,3]]_p$ code for every prime $p$, including the Bravyi-Kitaev code for $p = 2$. For qutrits it is the unique shortest distance-three triorthogonal code.", "url": "https://arxiv.org/abs/2610.21879", "type": "理论", "summary": "1. 该工作将标准模型一代费米子（含右手中微子）编码为五位比特标记的组合结构，并把反常抵消精确表述为三正交码定义性的立方形式消失。\n2. 其关键结果在于：去掉右手中微子后，对任意素数 p 得到 [[15,1,3]]_p 码；p=2 时即 Bravyi-Kitaev 码，三能级情形下它是唯一最短距离为三的三正交码。\n3. 这建立了标准模型费米子谱与魔态蒸馏所用量子纠错码的联系，并提示反常抵消条件可为构造受粒子物理启发的量子码提供原理性指导。", "summary_source": "deepseek", "authors": [{"name": "Shiroman Prakash"}, {"name": "K. L. Ramya"}], "featured_authors": [{"name": "Shiroman Prakash"}, {"name": "K. L. Ramya"}], "author_count": 2}, {"id": "2610.21930", "category": "hep-th", "title": "Vortex clusters and vortex-filled bubbles in a modified Abelian-Higgs model", "abstract": "We investigate a single-component Abelian-Higgs model with an eighth-order scalar potential whose vacuum manifold consists of two disconnected circles. The model supports two species of vortices and domain walls interpolating between the two vacuum components. We find type-1.5-like behavior characterized by nonmonotonic intervortex interactions and bound states of spatially separated vortices. Inner-vacuum vortices form clusters through short-range repulsion and long-range attraction, whereas outer-vacuum vortices form vortex-filled bubbles in which a closed domain wall confines multiple inner-vacuum-vortex cores. We construct the domain wall analytically, derive the asymptotic vortex-wall interactions, and analyze the fluctuation spectra of coincident multivortices to identify their splitting instabilities.", "url": "https://arxiv.org/abs/2610.21930", "type": "理论", "summary": "1. 该文研究真空流形由两个互不连通圆构成的单分量Abelian-Higgs模型，其八阶标量势支持两类涡旋以及连接两个真空分量的畴壁。\n2. 其核心卖点在于发现类type-1.5的非单调涡间相互作用与空间分离涡旋束缚态：内真空涡旋经短程排斥和长程吸引形成团簇，外真空涡旋则由闭合畴壁包裹多个内真空涡核形成涡旋填充泡；作者还解析构造畴壁、导出渐近涡-壁作用并分析重合多涡旋的涨落谱以识别分裂不稳定性。\n3. 这为利用多真空分量与拓扑缺陷耦合设计涡旋束缚态、复合缺陷及相变动力学提供了可检验的理论框架。", "summary_source": "deepseek", "authors": [{"name": "D. Miguélez-Caballero"}, {"name": "S. Navarro-Obregón"}, {"name": "Muneto Nitta"}, {"name": "Keisuke Ohashi"}], "featured_authors": [{"name": "D. Miguélez-Caballero"}, {"name": "S. Navarro-Obregón"}, {"name": "Muneto Nitta"}, {"name": "Keisuke Ohashi"}], "author_count": 4}, {"id": "2610.22054", "category": "hep-th", "title": "Monopole-deformed Kim-Park dualities from elementary dualities", "abstract": "We derive the ellipsoid partition function identities for the monopole-deformed Kim-Park dualities of 3d $\\mathcal{N}=2$ adjoint SQCD with unitary gauge groups. The derivation uses only Aharony and Benini-Benvenuti-Pasquetti dualities as building blocks. By deconfining the adjoint into a $C_p[U(N)]$ quiver tail, we construct explicit duality sequences. Confinement and a rank-reducing duality chain then yield the expected magnetic partition functions, including the singlet contributions. We also present an alternative partition-function derivation of the $C_p[U(N)]$ s-confinement and provide Quiver Lab, a standalone HTML application for implementing and visualizing duality moves on quiver diagrams.", "url": "https://arxiv.org/abs/2610.22054", "type": "理论", "summary": "1. 该工作以 Aharony 和 Benini-Benvenuti-Pasquetti 对偶为基本构件，推导了 3d N=2 伴随 SQCD 的单极子形变 Kim-Park 对偶椭球配分函数恒等式。\n2. 关键手法是把伴随场退禁闭为 C_p[U(N)] 箭图尾，并用禁闭与降秩对偶链得到含单态贡献的磁配分函数。\n3. 文章还给出 C_p[U(N)] s-禁闭的配分函数推导，并发布可视化对偶操作的 Quiver Lab，为后续对偶研究提供工具。", "summary_source": "deepseek", "authors": [{"name": "Sungjoon Kim"}, {"name": "Jehyun Lee"}], "featured_authors": [{"name": "Sungjoon Kim"}, {"name": "Jehyun Lee"}], "author_count": 2}, {"id": "2610.22101", "category": "hep-th", "title": "Aspects of Codimension two Holography in de Sitter Space", "abstract": "Following \\cite{Yadav:2024ray} we embark on a further study of the codimension two holography in de Sitter (dS) space. The $d$ dimensional bulk dS space is sliced by two end of the world $(d-1)$ dimensional branes which are bestowed with either Lorentzian dS or Euclidean AdS metric joining at a common $(d-2)$ dimensional space where the dual CFT lives. Through explicit computations of the holographic entanglement entropy, partition function, and Renyi entropy in both slicings for the bulk dS space emphasizing their similarities as well as differences we provide further evidence for this duality. We also make comments on further generalization of the codimension two holography.", "url": "https://arxiv.org/abs/2610.22101", "type": "理论", "summary": "1. 该工作延续dS空间余维二全息的研究，用两块端世界(d-1)维膜切分d维dS体空间，两膜分别取洛伦兹dS或欧几里得AdS度规，并在共同的(d-2)维空间上交汇，对偶CFT即生活于此。\n2. 其卖点是在两种切片下显式计算全息纠缠熵、配分函数与Rényi熵，通过比较其异同为该对偶提供了进一步证据。\n3. 这深化了对dS全息中余维二对偶结构的理解，并为其向更一般情形的推广提供了明确线索。", "summary_source": "deepseek", "authors": [{"name": "Kanhu Kishore Nanda"}, {"name": "Somnath Porey"}, {"name": "Masataka Watanabe"}, {"name": "Gopal Yadav"}], "featured_authors": [{"name": "Kanhu Kishore Nanda"}, {"name": "Somnath Porey"}, {"name": "Masataka Watanabe"}, {"name": "Gopal Yadav"}], "author_count": 4}, {"id": "2610.22332", "category": "hep-th", "title": "Non-Coulomb $Q$-Cohomology and Quantum Lifting", "abstract": "We study quantum lifting of classical BPS cohomology classes in four-dimensional $\\mathcal N=4$ super-Yang-Mills theory. Certain powers of the gaugino bilinear $\\mathcal S=\\text{Tr}(\\lambda_+\\lambda_-)$ in orthogonal theories provide non-Coulomb monotones: multi-graviton classes that vanish upon Cartan restriction. For $SO(7)$, we identify $\\mathcal S^4$ as a superconformal descendant of a known lifted monotone class, explaining the latter's non-Coulomb character, and explicitly construct a fortuitous lifting partner for $\\mathcal S^4$. This construction provides a strategy for finding analogous partners for higher powers at higher ranks. Our main result establishes restrictions on the quantum lifting of classical BPS cohomologies for general gauge groups. We show that the one-loop correction $Q_1$ to the supercharge annihilates every monotone class in classical cohomology, while every non-zero $Q_1$ image is of non-Coulomb type. Thus every non-zero one-loop pairing has a fortuitous source and a non-Coulomb target, so that Coulomb monotones survive at this order at finite rank. In the BMN sector, our results imply that non-Coulomb monotones survive at one loop order as well. A crucial step in the argument shows that every non-Coulomb class, fortuitous or monotone, is annihilated in classical cohomology by a sufficiently high power of a scalar discriminant, which we interpret as a partial no-hair property.", "url": "https://arxiv.org/abs/2610.22332", "type": "理论", "summary": "1. 我们研究四维 $\\mathcal N=4$ super-Yang-Mills 理论中经典 BPS 上同调类的量子提升。\n2. 论证中的关键一步表明，每个非库仑类，无论是偶然的还是单调的，在经典上同调中都会被足够高的标量判别式的幂所消除，我们将其解释为部分无毛性质。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Tanay Kibe"}, {"name": "Sam van Leuven"}, {"name": "Kayleigh Mathieson"}], "featured_authors": [{"name": "Tanay Kibe"}, {"name": "Sam van Leuven"}, {"name": "Kayleigh Mathieson"}], "author_count": 3}, {"id": "2610.20910", "category": "math-ph", "title": "Equality of the Jellium and the Uniform Electron Gas Energies", "abstract": "Jellium, a system of electrons in a uniform neutralizing background, and the uniform electron gas (UEG), a system of electrons with constant density and no background, are two standard models of the electron gas. We prove that the ground-state energy per unit volume of Jellium, as defined by Lieb and Narnhofer, coincides with the UEG energy defined by Lewin, Lieb and Seiringer, i.e. \\[ e^\\hbar_{\\rm Jel}(\\rho_0)=e^\\hbar_{\\rm UEG}(\\rho_0). \\] This equality was previously established in the classical case by Lewin, Lieb and Seiringer and independently by Cotar and Petrache.", "url": "https://arxiv.org/abs/2610.20910", "type": "理论", "summary": "1. 该文证明李布-纳恩霍费尔定义的凝胶模型与勒温-李布-赛林格定义的均匀电子气的基态能量密度相等。\n2. 其核心卖点是在量子情形下严格建立两者每单位体积基态能量的恒等式，表明均匀中和背景不改变该能量密度。\n3. 这一等式使两模型的结果可严格互译，并为电子气多体理论与近似方法的基准检验提供依据。", "summary_source": "deepseek", "authors": [{"name": "Mihály A. Csirik"}], "featured_authors": [{"name": "Mihály A. Csirik"}], "author_count": 1}, {"id": "2610.21172", "category": "math-ph", "title": "Free Fermion frustration-free models have zero Hall conductance", "abstract": "We give a new proof that translation-invariant free Fermion frustration-free models have zero Hall conductance. Our proof is analytic in nature and it uses the bulk-edge correspondence. The central argument, which holds beyond the translation-invariant situation, is that in frustration-free models, edge modes cannot merge into the ground state band. We give an example of a gapped frustration-free model that is nonetheless gapless on the half-plane.", "url": "https://arxiv.org/abs/2610.21172", "type": "理论", "summary": "1. 该工作以解析方法结合体-边对应，重新证明平移不变、无阻挫的自由费米子体系中霍尔电导消失，给出新的证明路径。\n2. 核心卖点是论证无阻挫模型中边缘模不能并入基态能带，该论据不依赖平移不变性，并构造出有能隙却在半平面上无能隙的无阻挫实例。\n3. 这暗示零霍尔电导与无阻挫约束下边缘态无法融入体态密切相关，为无序、相互作用或更一般的无阻挫拓扑体系中的体-边对应和边缘稳定性研究提供新判据。", "summary_source": "deepseek", "authors": [{"name": "Sven Bachmann"}, {"name": "Zhiqian Du"}, {"name": "Martin Fraas"}], "featured_authors": [{"name": "Sven Bachmann"}, {"name": "Zhiqian Du"}, {"name": "Martin Fraas"}], "author_count": 3}, {"id": "2610.21268", "category": "math-ph", "title": "Poisson statistics for one-dimensional Anderson--Bernoulli Schrödinger operators", "abstract": "We prove Poisson local eigenvalue statistics for one-dimensional Schrödinger operators with nondegenerate Bernoulli potentials at any fixed nonzero coupling. After unfolding by the integrated density of states (IDS), the local eigenvalue process converges to a Poisson point process of unit intensity at every energy in the interior of the almost-sure spectrum. The theorem also holds for bounded nonconstant iid potentials, provided the IDS is continuous and strictly increasing near the reference energy. If the IDS also has a finite positive derivative at that energy, the usual linear normalization gives the same limit. The proof uses a phase coordinate with exact IDS drift to obtain a uniform exponential crossing law and joint Poisson counts in disjoint energy windows.", "url": "https://arxiv.org/abs/2610.21268", "type": "理论", "summary": "1. 该工作证明了一维非退化伯努利势薛定谔算子在任意固定非零耦合下，经积分态密度展开后的局域本征值统计为强度一的泊松点过程，且在几乎必然谱内部各处成立。\n2. 其技术核心在于利用具精确积分态密度漂移的相位坐标建立一致指数穿越律，并证明不相交能量窗口中的联合泊松计数，从而将结论推广至有界非平凡独立同分布势，只要求积分态密度连续且严格递增；若其导数有限正，则线性归一化亦给同一极限。\n3. 这为无序一维系统中的局域化与能级关联提供了严格统计基础，并提示相位漂移方法可用于更一般随机势的局域本征值统计与归一化条件研究。", "summary_source": "deepseek", "authors": [{"name": "Yi Han"}], "featured_authors": [{"name": "Yi Han"}], "author_count": 1}, {"id": "2610.21462", "category": "math-ph", "title": "Semiclassical Band Splitting in the Infinite Chern Band Model", "abstract": "We study the two lowest Bloch bands of the infinite Chern band model in the semiclassical limit. When the Berry curvature parameter is an odd multiple of \\(\\pi\\), we derive an explicit asymptotic formula for their exponentially small splitting, uniformly over the Brillouin torus. The proof combines Agmon estimates and WKB approximations for a matrix Schrödinger operator whose lowest potential eigenvalue has two wells. Geometric properties of the Agmon distance allow us to compute the leading tunneling coefficients by the method of stationary phase. We provide numerical computations to illustrate the asymptotic formula and support the conjecture that the two bands remain separated for other values of the Berry curvature parameter.", "url": "https://arxiv.org/abs/2610.21462", "type": "理论", "summary": "1. 该工作在半经典极限下研究无限陈能带模型中最低两条布洛赫能带，并在贝里曲率参数为π的奇数倍时给出二者指数小劈裂的显式渐近公式，且在整个布里渊环面上一致成立。\n2. 其核心技巧是将问题化为最低势能本征值呈双阱结构的矩阵薛定谔算子，结合Agmon估计与WKB近似，并利用Agmon距离的几何性质以驻相法计算主导隧穿系数。\n3. 数值结果验证了该渐近公式，并支持贝里曲率参数取其他值时两条能带仍保持分离的猜想，为陈能带半经典谱分裂与隧穿分析提供可推广框架。", "summary_source": "deepseek", "authors": [{"name": "Tyler Guo"}], "featured_authors": [{"name": "Tyler Guo"}], "author_count": 1}, {"id": "2610.21475", "category": "math-ph", "title": "Approach to Equilibrium in Translation-Invariant Quantum Systems: Structural Results II", "abstract": "We continue the development, started in [AHP 25 (2023), 715-749], of a structural theory of approach to equilibrium in translation-invariant quantum spin systems. Dynamical Steady States (DSS) are defined as w*-limit points of the time-averaged evolution of an initial state. We show that if a DSS is an equilibrium state of a sufficiently regular interaction, then the specific energy of this interaction is necessarily a constant of the motion. Two distinct mechanisms lead to this conclusion, one based on dynamical surface energies and the other on conservation of specific relative entropy. We conjecture that these properties hold for a natural class of interactions. For a DSS admitting a physical equilibrium description, the associated equilibrium states are characterized by a dynamical Gibbs variational principle: they are precisely the minimizers of the specific relative entropy from the initial state over the physical equilibrium states. The achieved minimum equals the increase of specific entropy. The structural theory also yields characterizations of approach to thermal equilibrium, based on two model-dependent questions: restoration of a sufficiently local thermodynamic description at large times and classification of the corresponding local constants of motion. Once locality is restored, the constants of motion determine the possible asymptotic equilibrium states. In particular, if finite-range locality is restored and the energy is the only finite-range constant of the motion, then every DSS is a thermal equilibrium state at the temperature fixed by energy conservation. The finite-time dynamical input underlying this theory is established in a companion paper.", "url": "https://arxiv.org/abs/2610.21475", "type": "理论", "summary": "1. 我们继续开发从 [AHP 25 (2023), 715-749] 开始的平移不变量子自旋系统平衡方法的结构理论。\n2. 结构理论还基于两个与模型相关的问题得出热平衡方法的表征：在很大程度上恢复足够局部的热力学描述以及相应的局部运动常数的分类。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Vojkan Jakšić"}, {"name": "Claude-Alain Pillet"}, {"name": "Anna Szczepanek"}], "featured_authors": [{"name": "Vojkan Jakšić"}, {"name": "Claude-Alain Pillet"}, {"name": "Anna Szczepanek"}], "author_count": 3}, {"id": "2610.21489", "category": "math-ph", "title": "Dynamical Conservation Laws in Quantum Spin Systems", "abstract": "We study dynamical conservation laws and the propagation of thermodynamic structure in translation-invariant lattice quantum spin systems. Using Lieb-Robinson bounds [CMP 28 (1972), 251-257] in arbitrary dimension, and Araki's bounds [CMP 14 (1969), 120-157] in dimension one, we prove conservation of the specific entropy, specific energy, and specific relative entropy under suitable assumptions on the interactions. The transported local Hamiltonians admit surface energies that vanish per unit volume in the van Hove limit, and local observables remain a core for the transported generators at every finite time. Weak Gibbsianity is preserved for sufficiently small times in arbitrary dimension and for all times in dimension one. These results provide the analytical foundation for the structural theory of approach to equilibrium developed in a companion paper, and establish partial results toward the conjectures formulated there.", "url": "https://arxiv.org/abs/2610.21489", "type": "理论", "summary": "1. 该工作研究平移不变量子自旋格点系统中动力学守恒律与热力学结构的传播，借助任意维度的Lieb-Robinson界与一维的Araki界，证明在适当相互作用假设下比熵、比能量与比相对熵的守恒。\n2. 其技术卖点在于输运后的局域哈密顿量在van Hove极限下具有按体积消失的表面能，局域可观测量在每个有限时刻仍是输运生成元的核，弱Gibbs性在任意维度短时内、一维任意时刻下均保持。\n3. 这为伴随论文中趋近平衡的结构理论提供了严格解析基础，并朝其提出的猜想给出了部分结果。", "summary_source": "deepseek", "authors": [{"name": "Vojkan Jakšić"}, {"name": "Claude-Alain Pillet"}, {"name": "Anna Szczepanek"}], "featured_authors": [{"name": "Vojkan Jakšić"}, {"name": "Claude-Alain Pillet"}, {"name": "Anna Szczepanek"}], "author_count": 3}, {"id": "2610.21585", "category": "math-ph", "title": "Augmentation curve for torus knots", "abstract": "We prove a version of topological recursion for the correlation differentials of colored HOMFLY-PT polynomials of torus knots on the corresponding augmentation curves, following the proposal of Gu, Jockers, Klemm, and Soroush. To this end, we explicitly construct the spectral curve from the so-called auxiliary curve of Brini, Eynard, and Mariño and prove that it coincides with the augmentation curve for every torus knot with coprime $(r,s)$. Finally, our version of topological recursion proves the higher-genus closed-string prediction of the Aganagic--Vafa conjecture for all torus knot augmentation curves.", "url": "https://arxiv.org/abs/2610.21585", "type": "理论", "summary": "1. 我们遵循 Gu、Jockers、Klemm 和 Soroush 的建议，证明了相应增广曲线上环面结彩色 HOMFLY-PT 多项式相关微分的拓扑递归版本。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Alexander Hock"}, {"name": "Sergey Shadrin"}], "featured_authors": [{"name": "Alexander Hock"}, {"name": "Sergey Shadrin"}], "author_count": 2}, {"id": "2610.21927", "category": "math-ph", "title": "On the exact quantization of BCOV Theory on Calabi-Yau Manifolds", "abstract": "We announce the solution of constructing perturbative quantum BCOV invariants on arbitrary Calabi-Yau manifolds. In this note, we outline the construction and present an explicit solution. The quantization includes all descendant fields and all loop orders, and expresses the quantum BCOV interaction by an explicit integration over the moduli space of marked Riemann surfaces. This canonical solution provides a mathematical construction of all higher genus BCOV invariants on compact Calabi-Yau manifolds, which are conjecturally equivalent to all higher genus Gromov-Witten invariants on the mirror.", "url": "https://arxiv.org/abs/2610.21927", "type": "理论", "summary": "1. 该工作宣布在任意 Calabi-Yau 流形上构造微扰量子 BCOV 不变量，并给出显式解。\n2. 其核心是将量子 BCOV 相互作用表示为带标记黎曼面模空间上的显式积分，且涵盖所有后代场与所有圈阶。\n3. 该构造为紧致 Calabi-Yau 上所有高亏格 BCOV 不变量提供数学定义，并暗示其与镜像高亏格 Gromov-Witten 不变量的猜想等价。", "summary_source": "deepseek", "authors": [{"name": "Si Li"}, {"name": "Minghao Wang"}], "featured_authors": [{"name": "Si Li"}, {"name": "Minghao Wang"}], "author_count": 2}, {"id": "2610.22183", "category": "math-ph", "title": "Fixed-Point Abundances and the Onset of Extinctions in Multispecies Lotka-Volterra Ecosystems", "abstract": "I investigate the average and variance of species abundance distributions for fixed-point solutions to generalized Lotka-Volterra ecosystems. Two different analytical methods are constructed. First, I build up on the perturbative Random Matrix Theory approach developed in my earlier work [Phys. Rev. E. 113, L062202 (2026)], and formalize this method diagrammatically. The abundance average is given by a sum of planar diagrams with non-crossing vertex pairings which can be encoded as Dyck paths. This allows me to express the combinatorial factor multiplying perturbative terms at each order as Catalan and Narayana numbers, following which the abundance average is given by the latter's generating functions. In this way, the infinite perturbation expansion is exactly resummed in a closed-form formula. I have not been able to find a similar resummation for the abundance variance, however diagrammatic Feynman rules are expressed, following which the perturbative series can be calculated to any desirable order. Second, I do the same calculations using the cavity method, which gives closed-form formulas for both the abundance average and variance. For the average, the cavity formula gives the exact same result as the perturbative approach when the average interspecies interaction vanishes. When this is not the case, the two results are functionally different, however they are hardly distinguishable in their parametric range of validity. Comparison with numerical data indicate that the cavity result is more accurate over a larger parameter range.", "url": "https://arxiv.org/abs/2610.22183", "type": "理论", "summary": "1. 该工作研究广义Lotka-Volterra生态系统不动点解的物种丰度分布均值与方差，并建立微扰随机矩阵理论与空腔方法两套解析框架。\n2. 其卖点是将丰度均值表示为非交叉顶点配对的平面图（Dyck路径），用Catalan与Narayana数编码组合因子并精确重求和为闭式，空腔法则同时给出均值与方差的闭式。\n3. 当平均种间相互作用为零时两法均值完全一致，否则函数形式不同但在有效参数区间内几乎不可区分，且数值表明空腔结果在更宽参数范围内更准确。", "summary_source": "deepseek", "authors": [{"name": "Philippe Jacquod"}], "featured_authors": [{"name": "Philippe Jacquod"}], "author_count": 1}, {"id": "2610.20654", "category": "quant-ph", "title": "The noise cost of reservoir locality in broadband quantum amplifier chains", "abstract": "Directional quantum amplifiers enable weak-signal readout while protecting the source, but reservoir noise limits sensitivity. Finite-band suppression must reconcile frequency-dependent responses with fixed local couplings and finite rates. We construct adjacent-site loss channels attaining the known single-frequency minimum under local compatibility conditions, as an uncapped benchmark. For specified uniform and dimerized chains, we compare fixed reservoirs at matched drift, ports, high-gain band and complete gain/loss rate caps. At the representative cap $R=8$ and halfwidth $\\Omega=0.05$, nearest-neighbor arithmetic band average noise exceeds the unrestricted optimum by more than $1.01265$ quanta in the uniform chain for every finite $N\\ge64$. Boundary-response bounds give necessary rates and targets requiring range two. At $N=64$, finite-auxiliary calculations retain a noise advantage under matched total coupling budgets; response bounds quantify noise-resolution tolerances. These theoretical results guide reservoir design and noise calibration for a proposed cryogenic microwave array with a $100$ kHz design band.", "url": "https://arxiv.org/abs/2610.20654", "type": "理论+数值", "summary": "1. 该工作针对宽带定向量子放大器链，构造相邻格点损耗通道作为无上限基准，并在匹配漂移、端口、高增益带及总增益/损耗率上限下比较均匀与二聚链的固定储层。\n2. 其核心卖点是把单频最小噪声作为基准，在R=8、Ω=0.05时证明均匀链最近邻算术带平均噪声比无限制最优高出逾1.01265个量子且对任意有限N≥64成立，同时用边界响应界给出所需速率与距离二目标。\n3. 在N=64时有限辅助计算在匹配总耦合预算下仍保持噪声优势，响应界量化噪声分辨率容差，为拟议100 kHz低温微波阵列的储层设计与噪声标定提供指导。", "summary_source": "deepseek", "authors": [{"name": "Chengxi Li"}, {"name": "Hao Zhu"}, {"name": "Tie-Fu Zhang"}, {"name": "Lin Zhuang"}, {"name": "Wanzi Sun"}, {"name": "Wuming Liu"}], "featured_authors": [{"name": "Chengxi Li"}, {"name": "Hao Zhu"}, {"name": "Tie-Fu Zhang"}, {"name": "Lin Zhuang"}, {"name": "Wanzi Sun"}, {"name": "Wuming Liu"}], "author_count": 6}, {"id": "2610.20694", "category": "quant-ph", "title": "Quantum Partial Information Decompositions, an Operational Order on Ensembles, and Direct Quantifications of Objective Information", "abstract": "The partial information decomposition (PID) framework is an extension of classical information theory that enables a systematic analysis of the structure of information in multipartite systems. We advance a simple extension of this framework enabling the construction of multipartite quantum PIDs (QPIDs); generalizing recent, exclusively bipartite, extensions. We construct two QPIDs of the Holevo quantity. First a naive QPID based on the classical minimum mutual information. Second a sophisticated QPID enabled by our development of an operational partial order on quantum ensembles in terms of ensemble (inter-)convertability. Finally, as a concrete example of how QPIDs can be applied, we investigate objectivity scenarios; using our Holevo QPIDs to directly quantify objective information in extended graph states. These findings ultimately establish a foundation upon which generic multipartite QPIDs can be systematically constructed, introduce an operational partial order on ensembles, advance QPIDs as interesting objects of study in their own right, and demonstrate their immediate applicability to problems in quantum information.", "url": "https://arxiv.org/abs/2610.20694", "type": "理论", "summary": "1. 该工作将部分信息分解从两体量子扩展推广到多体情形，提出可系统构建多体量子部分信息分解（QPID）的框架。\n2. 其核心卖点是为Holevo量构造两种QPID：基于经典最小互信息的朴素方案，以及借助系综可相互转换性建立的操作型偏序而实现的精细方案。\n3. 该框架被用于客观性场景，直接量化扩展图态中的客观信息，并为一般多体QPID的构造及其量子信息应用奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Alexander Nico-Katz"}], "featured_authors": [{"name": "Alexander Nico-Katz"}], "author_count": 1}, {"id": "2610.20737", "category": "quant-ph", "title": "A constructive solution to the $n$-representability problem", "abstract": "We present a solution to the fermionic quantum marginal problem by constructing the complete family of two-body witnesses at each level of a weighted sum-of-squares hierarchy. Our construction combines positive-semidefinite Gram matrices with explicit linear nullspace constraints that exactly cancel all higher-body contributions, replacing the search for individual representability conditions with a systematic algebraic procedure. Beyond the completeness proof, we demonstrate the construction numerically by solving the associated semidefinite program and recovering the exact ground-state energy of a Richardson Hamiltonian in the three-fermion sector. We further prove that higher-degree particle-number multipliers are unnecessary when the full sum-of-squares generating algebra is used. These results establish a unified constructive framework for verifying the physicality of a candidate two-particle reduced density matrix through a complete characterization of all two-body witnesses.", "url": "https://arxiv.org/abs/2610.20737", "type": "理论+数值", "summary": "1. 该工作针对费米子量子边缘问题，构造了加权平方和层级各阶完备的两体见证族，从而给出 n-可表示性问题的建设性解。\n2. 其核心在于用半正定 Gram 矩阵与显式线性零空间约束精确消去高阶体贡献，把逐个可表示性条件的搜索转化为系统代数流程，并可数值求解 SDP 恢复三费米子 Richardson 哈密顿量的精确基态能量。\n3. 该框架表明使用完整平方和生成代数时无需高阶粒子数乘子，为完备验证候选两粒子约化密度矩阵的物理性提供统一构造性途径。", "summary_source": "deepseek", "authors": [{"name": "Nicholas C. Rubin"}, {"name": "A. Eugene DePrince III"}], "featured_authors": [{"name": "Nicholas C. Rubin"}, {"name": "A. Eugene DePrince III"}], "author_count": 2}, {"id": "2610.20775", "category": "quant-ph", "title": "The Lovász number is not alone: a continuum of Rényi points in the entanglement-assisted spectrum of graphs", "abstract": "Li and Zuiddam's entanglement-assisted asymptotic spectrum of graphs consists of the normalized graph parameters that are additive under disjoint unions, multiplicative under strong products and monotone under entanglement-assisted cohomomorphisms; the entanglement-assisted Shannon capacity is their pointwise minimum. To our knowledge, the Lovász number $\\vartheta$ was its only known element. We find a continuum of others. Three quantities of Duan and Winter, $\\log_2\\vartheta$, the minimal Holevo capacity $C_{\\min}$ and the logarithm of the no-signalling simulation cost $\\Sigma$, are the smallest information radii of classical-quantum channels compatible with a graph, measured with Petz-Rényi divergences of orders $0$, $1$ and $2$. At order zero this is due to Schrijver (as credited by Dalai) and to Duan and Winter; at order one it is the min-max formula for the Holevo capacity. Interpolating in the order gives a family $\\vartheta_\\alpha$, $0\\le\\alpha\\le2$, and we prove that every member lies in the spectrum. The main step, multiplicativity under strong products for channels that need not factor, follows from an exact nesting identity for compressions. Sandwiched Rényi radii of order $\\beta\\in[1/2,\\infty]$ give the same family, at $\\alpha=2-1/\\beta$. On the five-cycle the family takes every value in $[\\sqrt5,5/2]$. A Hilbert-Schmidt inequality for the pentagon gives $C_{\\min}(C_5)=\\log_2(5/2)$, proving a conjecture of Duan and Winter. We also settle the two open links of their inequality chain: the graph-level no-signalling simulation rate always equals its single-letter value $\\log_2\\Sigma(G)$, and a 32-vertex graph from the Mermin-Peres magic square has $C_{\\min}<\\log_2\\Sigma$, certified in exact rational arithmetic. Finally, $\\Sigma$ never exceeds the projective rank of the complement; a rank inequality for the same square makes this strict on a 1440-vertex graph.", "url": "https://arxiv.org/abs/2610.20775", "type": "理论+数值", "summary": "1. Li 和 Zuiddam 的纠缠辅助渐近图谱由归一化图参数组成，这些参数在不相交并集下是加法，在强积下是乘法，在纠缠辅助上同态下是单调的；纠缠辅助香农容量是它们的逐点最小值。\n2. Duan 和 Winter 的三个量 $\\log_2\\vartheta$、最小 Holevo 容量 $C_{\\min}$ 和无信令模拟成本的对数 $\\Sigma$ 是与图兼容的经典量子通道的最小信息半径，用 $0$、$1$ 和 $2$ 阶的 Petz-Rényi 散度来测量。\n3. $\\be
