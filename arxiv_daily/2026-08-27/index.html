of the material actually remains in form of connected clusters of such spherulites. We build on a recently published numeric method to predict the number, the connectivity, and the morphology of these clusters as an outcome of enzymatic degradation. When applied to PET waste, our method predicts that the resulting aggregates are loosely connected, \"fluffy\" structures with a high surface-to-volume ratio, accompanied by smaller clusters following a continuous size distribution. By providing a quantitative framework for understanding the microparticle production during the depolymerization, these findings should assist choosing a suitable downstream treatment, such as filtering or flocculation. This work could thus help to advance the enzymatic depolymerization technologies.", "url": "https://arxiv.org/abs/2608.25882", "type": "理论", "summary": "1. 该工作基于近期发展的数值方法，明确考虑废物流质量与处理历史的影响，系统预测酶解降解塑料过程中半结晶球晶聚集体的数目、连通性及形态，并用于PET废弃物降解。\n2. 其核心预测是PET酶解后残留物主要为松散连接的蓬松聚集体，具有高表面积体积比，并伴随尺寸连续分布的小团簇，从而定量刻画了酶解过程中微塑料颗粒的生成特征。\n3. 该框架为根据颗粒特性选择过滤或絮凝等下游处理方案提供了定量依据，有望改进酶解解聚回收技术，促进其在实际塑料废弃物处理中的应用。", "summary_source": "deepseek", "authors": [{"name": "Michael Schindler"}, {"name": "Ludwik Leibler"}], "featured_authors": [{"name": "Michael Schindler"}, {"name": "Ludwik Leibler"}], "author_count": 2}, {"id": "2608.25916", "category": "cond-mat", "title": "Current fluctuations in a gas of active Ornstein-Uhlenbeck particles", "abstract": "We investigate the statistics of the time-integrated current in an infinite one-dimensional gas of independent active Ornstein--Uhlenbeck particles, as a model system for studying an active generalisation of the corresponding passive (diffusive) phenomenology. Unlike the latter, where current fluctuations exhibit universal sub-diffusive scaling, active systems display diffusive, super-diffusive, and sub-diffusive regimes over different time scales. We fully characterise the distribution of current in terms of large-deviation asymptotics, showing that all of these scaling regimes are described by a single scaled cumulant generating function. Moreover, the statistics retain a dependence on the initial condition even at large times, revealing a persistent memory of the initial state. We further obtain the joint large-deviation statistics of currents measured at two distinct times, characterising temporal correlations. Our analytical predictions are verified using rare-event importance sampling, which resolves probabilities as small as $10^{-1000}$.", "url": "https://arxiv.org/abs/2608.25916", "type": "理论", "summary": "1. 该工作解析研究无穷一维独立活性奥恩斯坦-乌伦贝克粒子气体中时间积分电流的涨落统计，并用稀有事件重要性采样验证了概率小至10^{-1000}的大偏差预言。\n2. 其核心在于证明电流涨落可由单一标度累积生成函数完整刻画，从而统一涵盖扩散、超扩散和次扩散等不同时间尺度，并揭示长时间极限下统计对初始条件的持续记忆及两个时刻电流的联合大偏差时间关联。\n3. 这为活性物质非平衡输运中的异常标度行为、初始状态依赖和时间关联研究提供了可精确求解的基准，并可能推动相应涨落定理与稀有事件理论的推广。", "summary_source": "deepseek", "authors": [{"name": "Sandeep Jangid"}, {"name": "Aman Kumbhakar"}, {"name": "Juliane U. Klamser"}, {"name": "Tridib Sadhu"}], "featured_authors": [{"name": "Sandeep Jangid"}, {"name": "Aman Kumbhakar"}, {"name": "Juliane U. Klamser"}, {"name": "Tridib Sadhu"}], "author_count": 4}, {"id": "2608.25931", "category": "cond-mat", "title": "Size and Impurity Effects on Scattering of Valley Hall Modes in Gate-Defined Bilayer Graphene Superlattices", "abstract": "In the present paper we perform a tight-binding simulation of gate-defined islands in Bernal bilayer graphene (BLG). The inversion of the gap sign on the boundaries of the islands creates topologically-protected valley Hall modes. We focus on the specific questions of whether the valley Hall modes around such islands could serve as a host for quantum walks or simulate weakly coupled systems, and how their tunneling is affected by in-gap impurities. In addition, we discuss the effect of misalignment of top and bottom gate patterns on the tunneling properties between islands. Our main results show that resonant tunneling via an impurity enhances overlap between superlattice islands, while misalignment does not break topological protection over a wide parameter regime. In addition, we study the two-island geometry and show that it is possible to leverage suppressed scattering to place islands more densely on a single sample.", "url": "https://arxiv.org/abs/2608.25931", "type": "理论+数值", "summary": "1. 该工作通过紧束缚模拟研究了Bernal双层石墨烯栅极定义岛屿超晶格中谷霍尔模的散射，具体考察岛屿尺寸、带隙内杂质及上下栅极失准对隧穿的影响。\n2. 其核心发现是杂质共振隧穿能增强超晶格岛屿间的耦合重叠，而栅极图案失准在宽参数范围内不破坏谷霍尔模的拓扑保护。\n3. 这为利用受抑制的散射在单样品上更密集地排布岛屿提供依据，并有助于量子行走或弱耦合系统的模拟实现。", "summary_source": "deepseek", "authors": [{"name": "Marcus N. Kanestrøm"}, {"name": "Antonio L. R. Manesco"}, {"name": "D. O. Oriekhov"}], "featured_authors": [{"name": "Marcus N. Kanestrøm"}, {"name": "Antonio L. R. Manesco"}, {"name": "D. O. Oriekhov"}], "author_count": 3}, {"id": "2608.25943", "category": "cond-mat", "title": "Fluxtube Bouquets and Type-1.5 Clustering in Superfluid Neutron Star Cores", "abstract": "We study mesoscopic configurations of a neutron superfluid coupled to a proton superconductor in the outer core of a neutron star. The condensates are described by a two-component Ginzburg-Landau free energy with local couplings, neglecting genuine phase-gradient entrainment. In two spatial dimensions, we minimize the free energy using quasi-periodic boundary conditions and constrained phase-imprinting calculations to study vortex-fluxtube and fluxtube-fluxtube interactions. We find that, for locally attractive couplings in the free energy, vortex-fluxtube overlap is energetically favoured and several pre-existing proton fluxtubes can bind around a neutron vortex, forming finite vortex-centred aggregates that we call fluxtube bouquets. These bouquet configurations may become so dense that a vortex can effectively accommodate several quanta of magnetic flux. We also confirm the possible presence of a type-1.5-like regime and find that it survives in the zero-entrainment regime considered here. In this type-1.5 regime, the fluxtube-fluxtube interaction is repulsive at short distances and attractive at intermediate distances, leading to self-assembled clusters while the individual fluxtubes remain topologically distinct. Possible implications for dissipative coupling and transport in neutron stars are discussed.", "url": "https://arxiv.org/abs/2608.25943", "type": "理论+数值", "summary": "1. 该工作通过二维两分量金兹堡-朗道自由能，采用准周期边界条件与约束相位印记方法，研究中子星外核中子超流涡旋与质子超导磁通管之间的介观构型和相互作用。\n2. 核心发现是局域吸引耦合下涡旋-磁通管重叠在能量上有利，多个既有质子磁通管可束缚形成以中子涡旋为中心的“磁通管花束”，且零缠结情形下仍存在短程排斥、中程吸引的1.5类超导聚集机制。\n3. 该结果可为中子星磁场输运、涡旋-磁通管耗散耦合及脉冲星长期演化等天体物理观测研究提供具体微观物理图像与定量模型基础。", "summary_source": "deepseek", "authors": [{"name": "Adarsh Karekkat"}, {"name": "Gabriele Montefusco"}, {"name": "Marco Antonelli"}], "featured_authors": [{"name": "Adarsh Karekkat"}, {"name": "Gabriele Montefusco"}, {"name": "Marco Antonelli"}], "author_count": 3}, {"id": "2608.26055", "category": "cond-mat", "title": "Topology of Fluctuation Bands in Chiral Active Matter", "abstract": "While band topology is usually associated with the deterministic dynamics of a system, we show that it can instead reside in its fluctuations. Using a reciprocal lattice driven by nonequilibrium chiral active noise, we find that the displacement spectrum---which quantifies displacement fluctuations---admits bands with nonzero Chern numbers despite a Chern-trivial deterministic mechanics. A Haldane-like effective coupling in the correlation spectrum explains this topology and produces topological transitions controlled by both the stochastic driving and the observation frequency. Through the bulk--boundary correspondence, we find boundary-localized fluctuation modes that are distinct from the usual propagating mechanical edge states.", "url": "https://arxiv.org/abs/2608.26055", "type": "理论", "summary": "1. 该工作研究手性活性噪声驱动下倒格子晶格中的位移涨落谱，发现其能带可具有非零陈数，尽管确定性力学是拓扑平庸的。\n2. 其核心在于涨落谱中涌现出类Haldane有效耦合，使拓扑由随机驱动强度与观测频率调控，并以体边对应产生边界局域涨落模式。\n3. 这为在无拓扑确定性动力学的活性体系中实现涨落拓扑物态提供了新途径，也区别于通常的传播型机械边缘态。", "summary_source": "deepseek", "authors": [{"name": "Raphaël Maire"}], "featured_authors": [{"name": "Raphaël Maire"}], "author_count": 1}, {"id": "2608.24968", "category": "hep-th", "title": "CFT$_3$ Realizations and Celestial Representation Theory of the $\\mathcal{L}_Λw_{1+\\infty}$ Algebra", "abstract": "We study CFT$_3$ realizations and celestial representations of the $\\mathcal{L}_{\\Lambda}w_{1+\\infty}$ algebra. Free scalar and Dirac theories yield the same one-particle light-ray action. This action extends to the critical $O(N)$ model at $N=\\infty$, while regulated moments reproduce the pairwise algebra in the large-but-finite-$N$ correlators studied here. In the celestial hard-graviton module, the projected null conditions select $\\Delta=3$ uniquely, and a closed raising subalgebra annihilates $G^+_3$ exactly. The nonzero-$\\Lambda$ quadratic Casimir has eigenvalue three throughout the hard module, and the exact annihilators and low-spin Ward identities give compatible differential-difference equations for celestial correlators.", "url": "https://arxiv.org/abs/2608.24968", "type": "理论", "summary": "1. 本文研究了 $\\mathcal{L}_{\\Lambda}w_{1+\\infty}$ 代数的三维共形场论实现及其天球表示。\n2. 技术要点在于自由标量与狄拉克理论给出相同的单粒子光射线作用，并可延拓至 $N=\\infty$ 临界 $O(N)$ 模型；在硬引力子模中，投影零条件唯一选出 $\\Delta=3$，闭升子代数精确湮灭 $G_3^+$。\n3. 非零 $\\Lambda$ 的二次卡西米尔在硬模中恒为三，结合精确湮灭子与低自旋 Ward 恒等式给出天球关联函数的微分差分方程，为天球全息中的代数约束提供了可检验框架。", "summary_source": "deepseek", "authors": [{"name": "Bin Zhu"}], "featured_authors": [{"name": "Bin Zhu"}], "author_count": 1}, {"id": "2608.25000", "category": "hep-th", "title": "Equivariant Localization for N=2 Theories with Hypermultiplets", "abstract": "Equivariant localization in the $\\Omega$-background is a powerful technique for the evaluation of the partition function of $\\mathcal{N}=2$ supersymmetric field theory on a toric four-manifold. For the complex projective plane $\\mathbb{CP}^2$, we apply equivariant localization to supersymmetric Yang-Mills theories with gauge groups $SU(2)$ and $SO(3)$ with $N_f$ massive hypermultiplets in the fundamental representation, and the $\\mathcal{N}=2^*$ theory with the hypermultiplet in the adjoint representation. We evaluate equivariant correlation functions, which provide an equivariant extension of intersection numbers of moduli spaces of instantons on $\\mathbb{CP}^2$, such as Euler numbers and Segre invariants. In the non-equivariant limit, we compare our results with the evaluation using low energy field theory and integration over the $u$-plane. Using this comparison, we identify a specific overall factor, which captures the difference between a partition function for gauge group $U(2)$ and $SU(2)$ or $SO(3)$ on a compact four-manifold. We also discuss our results in the context of $S$-duality of the $N_f=4$ and $\\mathcal{N}=2^*$ theory, which includes the triality automorphism group of the flavor group for $N_f=4$.", "url": "https://arxiv.org/abs/2608.25000", "type": "理论", "summary": "1. 该工作将等变局域化应用于CP^2上的N=2超对称杨-米尔斯理论，涵盖规范群SU(2)与SO(3)、基本表示中的N_f个有质量超多重态以及伴随表示的N=2*超多重态，并计算其等变关联函数。\n2. 其技术要点在于这些关联函数给出CP^2上瞬子模空间相交数（如欧拉数与Segre不变量）的等变推广，且在非等变极限下与u平面上的低能有效场论积分比较，可分离出区分U(2)与SU(2)/SO(3)配分函数的整体因子。\n3. 该因子为紧四流形上不同规范群配分函数之间的联系提供了明确表述，并对N_f=4与N=2*理论的S-对偶及其味道群三重自同构给出了自洽的等变局域化检验。", "summary_source": "deepseek", "authors": [{"name": "Matthias Dennemann"}, {"name": "Jan Manschot"}], "featured_authors": [{"name": "Matthias Dennemann"}, {"name": "Jan Manschot"}], "author_count": 2}, {"id": "2608.25007", "category": "hep-th", "title": "Remarks on Vafa-Witten theory, or how to sit on a wall", "abstract": "We prove three results about refined $SU(N)$ VW invariants on Hirzebruch surfaces. First, we crucially simplify the modular anomaly equation satisfied by the generating series of these invariants by expressing it in terms of complementary generalized error functions, which requires extending these error functions to their singular loci. Second, we evaluate the variation of the modular completions of the generating series upon change of polarization. Finally, a representation of the generating functions in terms of indefinite theta series allows us to compute VW invariants at the walls of marginal stability, and to express them in terms of the invariants on the two sides of the wall and those of lower ranks. All the results exhibit a universal structure suggesting their wider applicability.", "url": "https://arxiv.org/abs/2608.25007", "type": "理论", "summary": "1. 该工作证明 Hirzebruch 曲面上 refined SU(N) Vafa-Witten 不变量的三个定理：简化模异常方程、刻画极化解变化、计算稳定墙上的不变量。\n2. 其技术核心是将互补广义误差函数延拓至奇异轨迹以简化模异常方程，并利用不定 theta 级数把墙上的 VW 不变量写成墙两侧不变量与低秩不变量的组合。\n3. 所有结果呈现的普适结构提示该方法可推广至更一般的曲面或四维理论，并为壁穿越与模形式的几何解释提供新途径。", "summary_source": "deepseek", "authors": [{"name": "Sergei Alexandrov"}, {"name": "Aradhita Chattopadhyaya"}], "featured_authors": [{"name": "Sergei Alexandrov"}, {"name": "Aradhita Chattopadhyaya"}], "author_count": 2}, {"id": "2608.25029", "category": "hep-th", "title": "Tropical Open Strings in a Kalb-Ramond Background", "abstract": "We study tropical open strings arising from the analytically continued action of tropological sigma models in the presence of a constant Kalb-Ramond background. We show that the background field separates the theory into a generic sector and a critical sector. In the generic sector, the canonical structure produces a kinematical nonlocal bracket between the transverse and leafwise target-space coordinates. At the critical value of the Kalb-Ramond field, the Legendre map degenerates and the theory develops a primary constraint, requiring quantization by the Dirac-Bergmann procedure. This critical sector has a finite reduced phase-space structure and differs from the naive limit of the generic theory.", "url": "https://arxiv.org/abs/2608.25029", "type": "理论", "summary": "1. 该文研究常值Kalb-Ramond背景下的热带开弦，其源于tropological sigma模型作用量的解析延拓，并分析背景场导致的扇区结构。\n2. 要点是背景场将理论分为普通与临界扇区：普通扇区出现横向与叶状靶空间坐标间的运动学非局域括号；临界场值处Legendre映射退化并产生初级约束，需用Dirac-Bergmann程序量子化，其约化相空间有限且不同于普通理论的朴素极限。\n3. 这为热带弦非局域括号与约束动力学的量子化提供了具体模型，并可能启发Kalb-Ramond背景中靶空间几何与非局域效应的后续研究。", "summary_source": "deepseek", "authors": [{"name": "Sarthak Duary"}, {"name": "Vi Hong"}, {"name": "Sourav Maji"}], "featured_authors": [{"name": "Sarthak Duary"}, {"name": "Vi Hong"}, {"name": "Sourav Maji"}], "author_count": 3}, {"id": "2608.25183", "category": "hep-th", "title": "Exact All-Level Positivity of the Bosonic Veneziano Amplitude", "abstract": "Tree-level partial-wave unitarity of the open bosonic Veneziano amplitude follows indirectly from the no-ghost theorem, but a direct proof from the beta function has been missing at the critical dimension. We prove nonnegativity at every mass level and spin throughout the sharp range 3 < D <= 26, using a Bessel recurrence that reduces the infinite sign problem to a manifestly positive bulk and a finite exact boundary.", "url": "https://arxiv.org/abs/2608.25183", "type": "理论", "summary": "1. 该工作针对开弦玻色子 Veneziano 振幅，在 3<D<=26 的临界窗口内逐质量层、逐自旋证明了部分波幺正性要求的非负性。\n2. 其技术核心是构造 Bessel 递推关系，将无限维符号判定化为显然为正的体贡献与有限项精确边界，绕开了原先依赖无鬼定理的间接论证。\n3. 这一直接证明填补了弦振幅幺正性的空白，所建立的递推策略有望推广至其他介子或高阶弦振幅的符号分析。", "summary_source": "deepseek", "authors": [{"name": "Qi Chen"}, {"name": "Yuan Yin"}], "featured_authors": [{"name": "Qi Chen"}, {"name": "Yuan Yin"}], "author_count": 2}, {"id": "2608.25187", "category": "hep-th", "title": "Chaos in Yang-Mills", "abstract": "We study the dynamics of pure-gauge SU(N) through the time evolution of a spatial Wilson loop. We compute its out-of-time-order correlator at weak 't Hooft coupling and large N, and propose a framework for the strong-coupling description. We find that operators in pure-gauge Yang-Mills grow only when the group is non-abelian and d>2, and conjecture that pure gauge theories are chaotic only when non-abelian at d>2. Even at weak coupling the correlator's exponent inherits the IR sensitivity of the gluon self-energy imaginary part, which rests on the non-perturbative magnetic scale. We then explore the possibility that the loop's own size supplies that scale, since the loop operator is blind to any momenta softer than 1/2R. With the cutoff imposed that way the exponent changes sign at a critical diameter: smaller loops scramble, larger ones do not, and the scrambling time diverges at the crossing. The transition follows from that cutoff. Further investigation, in particular a first-principles treatment of the thermal decay width, is required to establish whether it is physical.", "url": "https://arxiv.org/abs/2608.25187", "type": "理论", "summary": "1. 该工作通过空间威尔逊环的实时演化，在弱特霍夫特耦合和大N极限下计算了纯规范SU(N)理论的非时序关联子，并提出强耦合描述框架。\n2. 其主要物理卖点是：算符增长仅发生在非阿贝尔且d>2时，增长指数继承了胶子自能虚部的红外敏感性和非微扰磁标度；当以环大小为截断时，临界直径处指数变号并使扰乱时间发散。\n3. 该转变是否具有物理真实性仍需热衰变宽度的第一性原理研究加以判定，也为深入理解纯规范理论的混沌边界提供了明确的理论判据。", "summary_source": "deepseek", "authors": [{"name": "Barel Skuratovsky"}], "featured_authors": [{"name": "Barel Skuratovsky"}], "author_count": 1}, {"id": "2608.25239", "category": "hep-th", "title": "Single-Minus Graviton Amplitudes from Matrix Theory", "abstract": "The $n$-point single-minus graviton amplitudes are nonzero in a special kinematic region that preserves some supersymmetry when embedded in supergravity. We compute these amplitudes within the BFSS matrix theory by relating them to an index problem considered by A. Sen. More precisely, the single-minus amplitudes are obtained from an index that counts BPS states in the Coulomb branch of four-dimensional ${\\cal N}=4$ super Yang-Mills. We explicitly check this relation in a specific kinematic region by computing the index using BPS wall-crossing formulae and matching it to the gravity result. We further employ BPS wall-crossing to show that the index satisfies a tower of $w_{1+\\infty}$ soft theorems in any kinematic regime, again matching gravity. Finally, we show that for certain kinematics, the single-minus amplitudes can be realized by scattering a graviton off a plane wave.", "url": "https://arxiv.org/abs/2608.25239", "type": "理论", "summary": "1. 该工作在BFSS矩阵理论中计算了保持部分超对称的特殊运动学区域内非零的n点单负螺旋度引力子振幅，并将其等价归约为A. Sen提出的BPS指标问题。\n2. 其技术核心是利用BPS墙交叉公式计算四维N=4超杨-米尔斯理论库仑支上的BPS态指标，精确匹配超引力结果，并证明该指标在任意运动学区满足w_{1+∞}软定理塔。\n3. 这一对应表明单负螺旋度振幅可由引力子对平面波的散射实现，为从矩阵理论非微扰地导出引力子振幅与软定理提供了新的理论途径。", "summary_source": "deepseek", "authors": [{"name": "Alfredo Guevara"}, {"name": "Alexandru Lupsasca"}, {"name": "Juan Maldacena"}, {"name": "Andrew Strominger"}], "featured_authors": [{"name": "Alfredo Guevara"}, {"name": "Alexandru Lupsasca"}, {"name": "Juan Maldacena"}, {"name": "Andrew Strominger"}], "author_count": 4}, {"id": "2608.25287", "category": "hep-th", "title": "Beyond Strong Subadditivity: Holographic Entropy Inequalities Along Renormalization Group Flows", "abstract": "Strong subadditivity (SSA) on a common light cone gives the Casini-Huerta entropic proof of the three-dimensional $F$-theorem. We ask whether holographic entropy inequalities beyond SSA similarly constrain renormalization group flows for which every intermediate theory admits a semiclassical holographic description. For small, disjoint deformations of a common light-cone region, we show that the second-order response of a broad class of balanced holographic inequalities depends only on pairwise correlations already controlled by SSA. A six-party example shows that the full finite inequality nevertheless contains genuinely multipartite information, so its disappearance is a limitation of the second-order expansion rather than of the inequality itself. Two natural finite constructions do not recover the missing information. We nevertheless find two ways in which information beyond SSA survives. A five-party inequality bounds the rate at which a conditional correlation grows as one region is enlarged. Separately, a continuum limit of the odd-cyclic inequalities gives a constraint on the angular shape dependence of entanglement entropy, and Lorentz symmetry relates this constraint to radial evolution. Thus holographic entropy inequalities beyond SSA do constrain entanglement along RG flows, although we do not obtain a second universal analogue of the $F$-function.", "url": "https://arxiv.org/abs/2608.25287", "type": "理论", "summary": "1. 该文考察强次可加性之外的全息熵不等式是否约束可半经典全息描述的重整化群流。\n2. 技术上证明，小形变下平衡不等式的二阶响应仅含SSA已控制的配对关联，但六方有限不等式保留多体信息；五方不等式约束条件关联增长率，奇循环连续极限约束角向纠缠形状，并由洛伦兹对称性联系到径向演化。\n3. 这显示超出SSA的不等式确能沿RG流约束纠缠，但无第二个普适F函数，暗示需高阶或有限多体信息构造单调量。", "summary_source": "deepseek", "authors": [{"name": "Ning Bao"}, {"name": "Christian Ferko"}], "featured_authors": [{"name": "Ning Bao"}, {"name": "Christian Ferko"}], "author_count": 2}, {"id": "2608.25438", "category": "hep-th", "title": "Decoupling saddles of the gravitational index and the Farey tail", "abstract": "We first construct general saddles of the five-dimensional gravitational supersymmetric index with $S^1\\times\\mathbb{R}^4$ asymptotics, carrying an arbitrary number of electric charges and Gibbons-Hawking centers. We then uplift the three-charge configurations to type IIB supergravity, obtaining solutions asymptotic to $S^1\\times \\mathbb{R}^4\\times S^1\\times {\\rm K}3$, carrying D1-D5-P charges. Upon taking a decoupling limit, these solutions yield asymptotically Euclidean AdS$_3\\times S^3\\times {\\rm K}3$ candidate saddles of the dual CFT$_2$ elliptic genus. We focus on the two-center saddles, which involve three integers specifying an orbifold action. Depending on these integers, the saddles may or may not possess a Euclidean horizon, and may be smooth or exhibit orbifold singularities. We give the on-shell action of these two-center saddles in the appropriate ensemble and establish a precise match with the Farey-tail expansion of the elliptic genus. The horizonless saddles are the Euclidean version of fractional spectral-flow solutions previously discussed in the literature, corresponding to $({\\rm AdS}_3\\times S^3)/\\mathbb{Z}_k$ orbifolds. The black hole saddles are modular images of the horizonless ones. They generalize the well-known ${\\rm SL}(2,\\mathbb{Z})$ family of BTZ black holes by placing it in the background of the $\\mathbb{Z}_k$ orbifold. We also consider the asymptotically AdS$_3\\times S^3$ solutions arising as decoupling limit of five-dimensional black ring and black lens saddles, provide their on-shell action and confirm that they do not contribute to the D1-D5 elliptic genus.", "url": "https://arxiv.org/abs/2608.25438", "type": "理论", "summary": "1. 该文构造了具有 S^1×R^4 渐近形式的五维超对称引力指标的一般鞍点，并利用解耦极限得到 AdS3×S3×K3 中对应 CFT2 椭圆亏格的双中心候选鞍点。\n2. 其核心在于给出这些鞍点的在壳作用量，精确匹配椭圆亏格的 Farey-tail 展开，并明确无黑洞视界鞍点对应 (AdS3×S3)/Z_k 分数谱流解，时空调鞍点则是其模变换像。\n3. 该结果为引力指标鞍点与模形式展开的对应提供了可检验框架，同时确认五维黑环和黑透镜鞍点不贡献于 D1-D5 椭圆亏格，有助于更完整地理解超对称引力路径积分。", "summary_source": "deepseek", "authors": [{"name": "Davide Cassani"}, {"name": "Alejandro Ruipérez"}, {"name": "Enrico Turetta"}], "featured_authors": [{"name": "Davide Cassani"}, {"name": "Alejandro Ruipérez"}, {"name": "Enrico Turetta"}], "author_count": 3}, {"id": "2608.25782", "category": "hep-th", "title": "PEE threads and bit-threads in BTZ black brane and finite-cutoff AdS$_3$", "abstract": "We develop PEE thread flows for the planar BTZ black brane and finite-cutoff holography. Exact geodesic-distance kernels define source-resolved PEE thread currents whose superposition gives divergenceless bit-thread fields. In BTZ, boundary-boundary and boundary-horizon sectors reproduce the entanglement contour and thermal horizon flux. At finite cutoff, the two-point PEE kernels are smooth and select macroscopic flows that are generically non-geodesic despite being built from geodesic elementary threads. We compare these PEE-selected flows with independent normal-geodesic bit-thread flows and show that they saturate the same RT bottleneck while differing in boundary calibration, endpoint pairing and off-bottleneck structure. The resulting constructions make explicit both the endpoint organization of finite-cutoff entanglement and the nonuniqueness of holographic max flows.", "url": "https://arxiv.org/abs/2608.25782", "type": "理论", "summary": "1. 该工作为平面BTZ黑洞与有限截断AdS\\(_3\\)构建了PEE线流，并用精确测地距离核定义源分辨的PEE流电流。\n2. 其技术卖点是这些电流叠加得到无散的bit-thread场，在BTZ中重现纠缠轮廓与热视界通量，且有限截断下PEE选出的宏观流虽由测地线单元构成却一般非测地，仍与正规测地流饱和同一RT瓶颈。\n3. 这显式揭示了有限截断纠缠的端点组织方式，以及全息最大流在边界标定、端点配对与瓶颈外结构上的非唯一性。", "summary_source": "deepseek", "authors": [{"name": "Debarshi Basu"}, {"name": "Ashish Chandra"}, {"name": "Qiang Wen"}], "featured_authors": [{"name": "Debarshi Basu"}, {"name": "Ashish Chandra"}, {"name": "Qiang Wen"}], "author_count": 3}, {"id": "2608.25783", "category": "hep-th", "title": "PEE threads and bit threads in gravitational subregions of AdS", "abstract": "Motivated by the kinematic-space description of gravitational subregions \\cite{Basu:2026hbg}, we allow partial entanglement entropy (PEE) threads to be sourced not only from the asymptotic boundary, but also from boundaries of subregions. Based on this setup, we develop a framework to construct configurations for PEE threads and bit threads sourced from surfaces in the AdS bulk. The situations we have analyzed include the Poincaré AdS$_3$ and the planar BTZ black brane with an end-of-the-world (EOW) brane, and the entanglement wedges of boundary multi-intervals. We construct novel configurations of PEE threads and bit threads in these situations, which shed new light in our understanding of the AdS$_3$/BCFT$_2$ correspondence and the holography defined in the entanglement wedge motivated by surface/state correspondence. A notable feature we found is that, although the elementary PEE threads are geodesics, the integral curves of the coarse-grained bit-thread current are generically not geodesics. Across the explicit constructions, the integrated source currents reduce to endpoint distance-difference potentials, which make divergencelessness, the norm bound and bottleneck saturation geometrically transparent. Our results clarify how boundary, brane, horizon and RT-surface degrees of freedom participate in holographic entanglement and provide a concrete link between PEE, bit threads, subregion kinematic space and the surface/state correspondence.", "url": "https://arxiv.org/abs/2608.25783", "type": "理论", "summary": "1. 该工作将部分纠缠熵线的源从渐近边界推广到子区域边界，在AdS体内部发展了由曲面源构造PEE线与比特线位形的一般框架，并分析了Poincaré AdS3、带端世界膜的平面BTZ黑洞及多间隔纠缠楔等情形。\n2. 核心发现在于粗粒化比特流积分曲线一般不是测地线，且源流积分可化为端点距离差势，从而使无散条件、模界与瓶颈饱和的几何意义透明化。\n3. 这澄清了边界、膜、视界与RT面自由度在全息纠缠中的角色，为PEE、比特线、子区域运动学空间与表面/态对应之间的联系提供了具体桥梁。", "summary_source": "deepseek", "authors": [{"name": "Debarshi Basu"}, {"name": "Qiang Wen"}], "featured_authors": [{"name": "Debarshi Basu"}, {"name": "Qiang Wen"}], "author_count": 2}, {"id": "2608.26017", "category": "hep-th", "title": "Notes on Gepner Construction", "abstract": "In this note, we describe the Gepner construction purely as orbifold (rather than a beta-prescription or orbifold-like process). This is done by distinguishing orbifolding by a chiral symmetry from that by a left-right diagonal symmetry, and also by exploiting an extra degree of freedom available in orbifolds of Type 0 SCFTs. We also describe by using the Arf theory how the extra freedom in Type 0 SCFT orbifolds in general (not just in the Gepner construction) should be implemented in higher genus amplitudes. This note also determines when a combinatorial data set of a Gepner construction has a mirror Gepner construction, and also provides two thinking frameworks to determine the SCFT vertex operators of the Gepner model SCFTs with phase ambiguity and branch cuts under control.", "url": "https://arxiv.org/abs/2608.26017", "type": "理论", "summary": "1. 该工作将Gepner构造重新表述为纯orbifold过程，区分手征对称性与左右对角对称性，并利用Type 0 SCFT orbifold中的额外自由度。\n2. 技术要点是借助Arf理论将该额外自由度推广到高亏格振幅，并给出判定组合数据存在镜像Gepner构造的条件。\n3. 这为受相位歧义与支割线影响的Gepner模型SCFT顶点算符提供了两种可控分析框架，有助于相关弦紧化与镜像对称研究。", "summary_source": "deepseek", "authors": [{"name": "Kanade Nishikawa"}, {"name": "Taizan Watari"}], "featured_authors": [{"name": "Kanade Nishikawa"}, {"name": "Taizan Watari"}], "author_count": 2}, {"id": "2608.26085", "category": "hep-th", "title": "Massive Ghost Confinement, Dipole Equation and Multipole States in Quadratic Gravity", "abstract": "We investigate the problem of confinement of massive ghost, which violates the unitarity of the physical S-matrix, in quadratic gravity on the basis of a manifestly covariant and local canonical operator formalism. First, we reconsider the manifestly covariant quantization of quadratic gravity in the de Donder gauge (the harmonic gauge) from the viewpoint of dipole fields. Next, we also reconsider a possible mechanism of confinement of the massive ghost and derive an effective Lagrangian for asymptotic fields of a BRST quartet where the asymptotic field corresponding to the massive ghost is found to obey a dipole field equation as in the Froissart model, which is a characteristic feature in our formalism. To understand quantum aspects of our theory, we perform a manifestly covariant quantization of the effective Lagrangian in two different ways based on the three-dimensional Fourier transform and the four-dimensional Fourier transform, and derive the same result that the quantum Fock space is spanned by multipole states.", "url": "https://arxiv.org/abs/2608.26085", "type": "理论", "summary": "1. 该工作基于显协变且局域的典范算子形式体系，在de Donder规范下重新研究二次引力中破坏S矩阵幺正性的有质量鬼场的禁闭问题。\n2. 其核心在于导出BRST四重态渐近场的有效拉氏量，并发现与Froissart模型类似，有质量鬼场满足偶极子场方程；随后通过三维与四维傅里叶变换两种途径量子化，均得到由多极态张成的Fock空间。\n3. 这一结果给出了鬼场禁闭的协变局域描述，为最终理解二次引力的幺正性及量子性质提供了明确的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Ichiro Oda"}], "featured_authors": [{"name": "Ichiro Oda"}], "author_count": 1}, {"id": "2608.24897", "category": "math-ph", "title": "Exact topology of conservative multiplicative cascades: An ultrametric transfer-operator genus", "abstract": "The multiplicative cascade is a well-known method for generating random fields that are both genuinely non-Gaussian and scale invariant. Its one-point and scaling statistics, namely the multifractal spectra $\\tau(q)$, $D_q$, and $f(\\alpha)$, are known exactly; however, its geometric and topological measures are not. In this work, we show that the topological structures of a conservative (microcanonical) random permutation cascade can be precisely predicted. We compute the digital (cubical) Euler characteristic, or genus, of the level-$j$ excursion set of the two-dimensional cascade in closed form, using a transfer operator on the cascade's $b$-ary tree closed by its ultrametric structure and a conservative without-replacement sibling split. The result requires no Monte Carlo and matches simulated realizations with a maximum residual of $\\sim\\!10^{-4}$ in the Euler density, a controlled discretization artifact of the atomic measure. We tie the genus scaling analytically to the multifractal spectrum, and show that for a geometric ladder of weights the genus is exactly self-similar under the multifractal-width dial. The construction uses the tree-sum cumulant machinery of Greiner et al. (Phys. Rev. E 58, 554, 1998), specialized to topological functionals; the conservative split carries the microcanonical fingerprint $\\mathrm{Cov}(\\ln w_a,\\ln w_b)/\\mathrm{Var}(\\ln w)=-1/(n-1)$ that distinguishes it from canonical and lognormal cascades. The cascade is the multiplicative counterpart of the Rayleigh--Lévy flight and a controlled benchmark for the morphology of strongly non-Gaussian fields.", "url": "https://arxiv.org/abs/2608.24897", "type": "理论", "summary": "1. 该工作严格求解了保守（微正则）随机置换乘性级联的拓扑结构，得到二维级联水平集数字欧拉示性数即亏格的闭式表达式，且完全无需蒙特卡罗。\n2. 其技术卖点在于利用超度量树上的传递算子闭合无放回兄弟分裂，把亏格标度解析地联系到多重分形谱，同时体现微正则指纹协方差条件，数值残差约10^-4。\n3. 这为强非高斯随机场与瑞利-莱维飞行的乘性对应提供了精确基准，并可作为形态学研究中的受控参照与检验判据。", "summary_source": "deepseek", "authors": [{"name": "Cristiano G. Sabiu"}], "featured_authors": [{"name": "Cristiano G. Sabiu"}], "author_count": 1}, {"id": "2608.25506", "category": "math-ph", "title": "Free-Energy Asymptotics of the Two-Dimensional Quantum Heisenberg Ferromagnet", "abstract": "We prove the leading low-temperature free-energy asymptotics of the nearest-neighbour quantum Heisenberg ferromagnet on $\\mathbb Z^2$. For every fixed $S\\in\\{\\frac12,1,\\frac32,\\ldots\\}$, the free energy per site satisfies \\[ \\lim_{\\beta\\to\\infty}\\beta^2S f_2(\\beta,S)=-\\frac{\\pi}{24}. \\] This formula was predicted by Takahashi's modified spin-wave theory [15]. Napiórkowski and Seiringer proved the corresponding upper bound but left the matching lower bound in two dimensions open [13], a gap later highlighted again by Seiringer [14]. We prove this missing bound through a new comparison between the magnon exclusion dynamics and free bosons, based on extending wave functions to collision configurations with controlled kinetic cost.", "url": "https://arxiv.org/abs/2608.25506", "type": "理论", "summary": "1. 该工作证明了二维最近邻量子海森堡铁磁体对每个固定自旋 S，低温下每格点自由能首阶渐近为 -π/(24 β^{2S})，补齐了此前缺失的下界。\n2. 其技术关键是将波函数延拓至碰撞构型并控制动能代价，从而比较磁子排斥动力学与自由玻色子，得到匹配上界的下界。\n3. 该结果验证了高桥修正自旋波理论在二维的预言，为低维量子磁体的相互作用效应与严格分析提供了可借鉴的途径。", "summary_source": "deepseek", "authors": [{"name": "Andreas Klippel"}], "featured_authors": [{"name": "Andreas Klippel"}], "author_count": 1}, {"id": "2608.25582", "category": "math-ph", "title": "Threshold spectral transition for a fermion-boson pair on the one-dimensional lattice", "abstract": "We study a two-particle lattice Schrödinger operator describing a fermion-boson pair on the one-dimensional lattice $\\mathbb Z$ with zero-range on-site interaction of strength $\\mu\\in\\mathbb R$ and mass ratio $\\gamma>0$. Using relative coordinates and fiber decomposition with respect to the total quasi-momentum $k\\in\\mathbb T:=(-\\pi,\\pi]$, we obtain a real symmetric fiber Hamiltonian $H_{\\mu,\\gamma}(k)$ in $\\ell^2(\\mathbb Z)$ with essential spectrum $$ [\\,2(1+\\gamma)-2a_\\gamma(k),\\,2(1+\\gamma)+2a_\\gamma(k)\\,], \\qquad a_\\gamma(k)=\\sqrt{1+2\\gamma\\cos k+\\gamma^2}. $$ For $a_\\gamma(k)>0$ and $\\mu\\ne0$, the operator has a unique simple discrete eigenvalue $$ E_\\gamma(k,\\mu)=2(1+\\gamma)+\\operatorname{sgn}(\\mu)\\sqrt{\\mu^2+4a_\\gamma(k)^2}, $$ lying below the band for $\\mu<0$ and above it for $\\mu>0$, with an exponentially decaying eigenfunction. At the exceptional fiber $(\\gamma,k)=(1,\\pi)$, the band collapses to ${4}$ and the unique simple eigenvalue is $E_1(\\pi,\\mu)=4+\\mu$. At the critical coupling $\\mu=0$ and $a_\\gamma(k)>0$, both spectral edges are threshold resonances with bounded non-square-integrable solutions. As $\\mu\\to0^\\pm$, the discrete eigenvalue approaches the corresponding threshold with $$ |E_\\gamma(k,\\mu)-E_{\\mathrm{thr}}^\\pm(k)| =\\frac{\\mu^2}{4a_\\gamma(k)}+O(\\mu^4), $$ and the normalized eigenfunction converges to the resonant solution. For strong coupling, $E_\\gamma(k,\\mu)=\\mu+2(1+\\gamma)+O(|\\mu|^{-1})$, while the eigenfunction localizes at the interaction site. We also classify the joint limit $\\mu\\to0^\\pm$, $(\\gamma,k)\\to(1,\\pi)$ according to the relative scale of $|\\mu|$ and $a_\\gamma(k)$, revealing the nonuniformity of the weak-coupling threshold asymptotics.", "url": "https://arxiv.org/abs/2608.25582", "type": "理论", "summary": "1. 该工作通过坐标变换与总准动量纤维分解，严格分析一维格点上费米-玻色子对模型的二体薛定谔算子谱。\n2. 其核心在于刻画临界耦合处的阈值共振、弱耦合本征值趋近阈值的μ²/4aγ(k)标度，以及强耦合下波函数在相互作用位点的局域化行为。\n3. 这为统一理解格点多体系统中阈值模的共振结构与非均匀联合极限，并提供后续少体或连续模型研究的理论参照。", "summary_source": "deepseek", "authors": [{"name": "Sobir S.Ulashov"}, {"name": "Shakhobiddin I.Khamidov"}], "featured_authors": [{"name": "Sobir S.Ulashov"}, {"name": "Shakhobiddin I.Khamidov"}], "author_count": 2}, {"id": "2608.25719", "category": "math-ph", "title": "Lower bounds on the spatial decay of the ground state of the Pauli-Fierz model", "abstract": "Lower bounds on the pointwise spatial decay of the ground state of the Pauli-Fierz model in non-relativistic quantum electrodynamics are this http URL models are considered: the full Pauli-Fierz model and the Pauli-Fierz model under the dipole approximation. For the full model, a lower bound is derived by means of a probabilistic approach based on the Feynman-Kac formula. The application of the Agmon distance method to the full model encounters a serious difficulty arising from the path dependence of a double stochastic integral. In contrast, under the dipole approximation, the corresponding integrand becomes deterministic, which allows a lower bound to be obtained in terms of the Agmon distance.", "url": "https://arxiv.org/abs/2608.25719", "type": "理论", "summary": "1. 该工作针对非相对论量子电动力学中的完整Pauli-Fierz模型及其偶极近似模型，推导了基态波函数逐点空间衰减的下界。\n2. 其技术卖点在于完整模型使用基于Feynman-Kac公式的概率方法，克服了因双随机积分具有路径依赖性而使Agmon距离方法失效的根本困难；偶极近似下该积分退化为确定性量，从而可直接以Agmon距离给出下界。\n3. 该结果为理解光-物质相互作用系统中基态的空间局域化程度提供了严格定量估计，并为未来在更多QED模型上检验Agmon方法的适用边界提供了清晰参照。", "summary_source": "deepseek", "authors": [{"name": "Fumio Hiroshima"}, {"name": "Yuki Tsujimoto"}], "featured_authors": [{"name": "Fumio Hiroshima"}, {"name": "Yuki Tsujimoto"}], "author_count": 2}, {"id": "2608.25991", "category": "math-ph", "title": "Plasticity as Directional Stationarity: Yielding, Flow, and Hardening from One Functional", "abstract": "Traditional plasticity theory is commonly organized through an elastic law, a yield condition, a flow rule, hardening relations, and loading--unloading conditions. This paper formulates these relations through directional stationarity of one scalar functional evaluated over one-sided admissible plastic paths. The first variation determines stress, internal-variable forces, and activity resistance. Restriction to an admissible plastic tangent defines a reduced directional force for each mechanism; its sign and one-sided stationarity give the elastic inequality, complementarity, loading--unloading conditions, and active consistency. Associated response corresponds to alignment between the admissible tangent and the normal to the resulting yield boundary, whereas a nonparallel tangent represents non-associated flow. A self-similarity analysis identifies positively homogeneous stress gauges as a broad associated family and separates the roles of yield-surface shape, isotropic expansion, and kinematic translation. The storage and resistance terms cover isotropic, kinematic, coupled, and gradient hardening, while multiple activity variables describe independently activated mechanisms. A viscous potential extends the construction to rate-dependent evolution. Four closed-form solutions illustrate multi-activity regions, kinematic-hardening fields, pressure-sensitive limit states, and the distinct displacement fields associated with normal and non-normal flow. Time-discrete constitutive integration and dimensional checks are collected in the appendices.", "url": "https://arxiv.org/abs/2608.25991", "type": "理论", "summary": "1. 该工作提出将经典塑性理论中的弹性律、屈服条件、流动法则与硬化关系统一为一个标量泛函在单侧塑性路径上的方向平稳性表述。\n2. 其核心在于利用一阶变分与容许塑性切线定义约化方向力，通过其符号和单侧驻定条件导出加卸载与互补关系，并以切线是否平行于屈服边界法线统一刻画关联与非关联流动。\n3. 该框架涵盖各向同性、随动、耦合及梯度硬化，并借黏性势推广至率相关演化，为多机制塑性的建模与数值积分提供了统一视角。", "summary_source": "deepseek", "authors": [{"name": "Huilong Ren"}], "featured_authors": [{"name": "Huilong Ren"}], "author_count": 1}, {"id": "2608.24923", "category": "quant-ph", "title": "Comment on 'Supervised quantum machine learning models are kernel methods'", "abstract": "We identify a few small errors in the proof of Theorem 1 in M. Schuld, 'Supervised quantum machine learning models are kernel methods' ( arXiv:2101.11020v2 ), Appendix A. These do not affect the validity of the theorem, but do matter if one wants to use the appendix to explicitly compute the Fourier coefficients of a quantum kernel. We give the corrected derivation, and additionally show that the paper's worked cosine-kernel example contains a second, unrelated error that happens to cancel the first, thereby coincidentally yielding the correct result.", "url": "https://arxiv.org/abs/2608.24923", "type": "理论+数值", "summary": "1. 该工作评注了将监督量子机器学习模型视为核方法的一篇论文，指出其附录A证明中的若干小错误。\n2. 其技术卖点是给出修正的傅里叶系数推导，并揭示余弦核例子中两个错误恰好抵消而结果偶然正确。\n3. 这提醒研究者在使用该附录显式计算量子核傅里叶系数时需采用修正版本，定理本身依然成立。", "summary_source": "deepseek", "authors": [{"name": "Rajiv Krishnakumar"}], "featured_authors": [{"name": "Rajiv Krishnakumar"}], "author_count": 1}, {"id": "2608.25006", "category": "quant-ph", "title": "Fluctuation-dissipation structure of quantum geometry", "abstract": "The geometry of quantum states is a fundamental research area with applications ranging from band theory in condensed matter to variational algorithms in quantum information. Due to their relative simplicity, pure states are usually studied, while mixed ones are needed in general, for instance to allow for finite temperatures. The geometry of mixed states, however, is much more challenging, with important aspects yet to be explored. Here, we provide one missing piece by identifying the structure that relates distance measure and curvature for general (mixed or pure) quantum states. This structure is shown to carry the physical meaning of fluctuation-dissipation---by directly relating distance measure with fluctuations and curvature with linear response---and it turns into the corresponding well-known structure for pure states, where it is Kähler, and only then. We thus obtain a general, simple fluctuation-dissipation picture, which, among its consequences, implies that response functions inherently probe the mixed-state quantum geometric tensor. We end by using this picture to give geometric characterizations of generic transport behaviors.", "url": "https://arxiv.org/abs/2608.25006", "type": "理论+数值", "summary": "1. 该工作为一般混合或纯量子态建立了量子几何中距离度量与曲率张量之间统一的涨落–耗散结构，填补了混合态量子几何研究中的一项关键空白。\n2. 其物理卖点在于揭示该结构具有明确的涨落–耗散含义：度量直接联系量子涨落，曲率直接联系线性响应，并且仅当系统为纯态时才约化为已知的Kähler几何形式。\n3. 这一普适图像意味着响应函数本质上探测的是混合态量子几何张量，并进而为一般输运行为提供几何刻画，对有限温度物态和量子信息理论具有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Per Moosavi"}], "featured_authors": [{"name": "Per Moosavi"}], "author_count": 1}, {"id": "2608.25024", "category": "quant-ph", "title": "Hardware-Aware Fermion-to-Qubit Mappings for Simulating the 2D Hubbard Model on Heavy-Hexagon Quantum Processors", "abstract": "Quantum simulation of strongly correlated fermionic systems is among the most promising near- term applications of quantum computing, but its practical efficiency depends critically on the choice of fermion-to-qubit mapping and on the connectivity of the underlying hardware. In this work we address this problem in the context of the two-dimensional Hubbard model, simulated on IBM superconducting quantum processors with heavy-hexagon connectivity. We numerically benchmark the Jordan-Wigner, Bravyi-Kitaev, and Bonsai transformations, evaluating their Pauli weight and SWAP overhead across seven heavy-hexagon chips of increasing size. We show that, while the Bravyi-Kitaev mapping initially exhibits a lower Pauli weight, this advantage is eliminated once routing costs are taken into account, confirming the Bonsai mapping as the most hardware-efficient baseline transformation for this architecture. We then use the Bonsai mapping to construct the qubit Hamiltonian of the 2D spinful Fermi-Hubbard model, introducing a simulated annealing algorithm that optimizes the assignment of Majorana strings to lattice sites, reducing the cost function by nearly 50% percent. Finally, we simulate on quantum hardware the time evolution of fermionic states up to 6x6 lattices, confirming the viability of the Bonsai encoding for hardware-aware large-scale two-dimensional simulations.", "url": "https://arxiv.org/abs/2608.25024", "type": "理论+数值", "summary": "1. 该工作针对二维Hubbard模型在IBM重六边形量子处理器上的模拟，系统比较了Jordan-Wigner、Bravyi-Kitaev与Bonsai三种费米子-量子比特映射方案。\n2. 其核心在于计入SWAP路由开销后发现Bonsai映射最具硬件效率，并进一步用模拟退火优化马约拉纳弦到格点的分配，将成本函数降低近50%。\n3. 这为中型含噪量子处理器上可扩展的二维费米子系统实时演化提供了有效编码路线，并对硬件感知量子模拟算法设计具有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Alessio Esposito"}, {"name": "Andrea Giachero"}, {"name": "Zoltàn Zimboràs"}, {"name": "Leonardo Banchi"}], "featured_authors": [{"name": "Alessio Esposito"}, {"name": "Andrea Giachero"}, {"name": "Zoltàn Zimboràs"}, {"name": "Leonardo Banchi"}], "author_count": 4}, {"id": "2608.25151", "category": "quant-ph", "title": "No Free Compression in Quantum Relaxations for Optimization", "abstract": "Qubit-efficient quantum relaxations compress classical decision variables into expectation values on substantially fewer qubits. We ask what resource tradeoffs this compression entails for quantum optimization. For the complete quadratic-Majorana encoding on $n$ qubits, pairwise correlators can represent $m=\\Theta(n^2)$ binary variables. We define the universal margin as the smallest correlator magnitude that can be guaranteed with prescribed signs for every target sign assignment. We show that it is exactly $\\Delta_{\\rm Maj}(n)=\\tan\\!\\left(\\frac{\\pi}{4n}\\right)=\\Theta(1/n)$, whereas uniformly random sign assignments retain $\\Theta(1/\\sqrt n)$ target-specific margins. The stronger $1/n$ worst-case scaling is Majorana-specific. Moreover, arbitrary density operators and fermionic Gaussian states generate the same quadratic-Majorana covariance body, so non-Gaussian state resources cannot enlarge this two-point relaxation. Beyond Majoranas, standard quantum random access code bounds provide general information-theoretic baselines. For any fixed family of $m$ designated binary observables on $n$ qubits, the universal margin is at most $\\sqrt{(2\\ln2\\;n/m)}$, while arbitrary random access decoding from $N$ copies with constant success probability above $1/2$ requires $nN=\\Omega(m)$. For a fixed Pauli correlation encoding required to work uniformly over all targets, maintaining a fixed nonzero decoded magnitude under smooth sign decoding therefore requires a rescaling parameter that grows as the available margin shrinks. Thus, while providing substantial qubit savings, compression can shift cost into restricted expectation value geometry, smaller expectation value magnitudes, or more demanding information recovery rather than eliminate it.", "url": "https://arxiv.org/abs/2608.25151", "type": "理论+数值", "summary": "1. 该工作定量研究了量子松弛压缩中压缩经典决策变量所不可避免的资源权衡，指出不存在免费压缩。\n2. 其核心结果是完整二次马约拉纳编码下普适裕量精确为tan(π/(4n))=Θ(1/n)，而随机符号目标保留Θ(1/√n)，且任意密度算符与费米高斯态产生相同协方差体，非高斯态无法扩展两体松弛。\n3. 这为量子优化松弛划定了定量边界：压缩不会消除成本，只会转移到期望值几何限制、更小信号幅度或更苛刻的信息恢复过程。", "summary_source": "deepseek", "authors": [{"name": "Stuart Hadfield"}], "featured_authors": [{"name": "Stuart Hadfield"}], "author_count": 1}, {"id": "2608.25195", "category": "quant-ph", "title": "Separating Quantum Indistinguishability Obfuscation from Falsifiable Assumptions", "abstract": "Quantum indistinguishability obfuscation (qIO) aims to make a quantum circuit unintelligible while preserving its functionality. It serves as a foundational primitive for advanced applications, such as witness encryption (WE) for QMA, non-interactive zero-knowledge arguments for QMA, and attribute-based encryption for BQP. Despite its importance, constructing qIO from standard assumptions remains a major open problem. In this work, we prove that the security of WE for QMA cannot be based on any falsifiable cryptographic assumption via a restricted class of quantum black-box reductions. Because qIO for null quantum circuits implies WE for QMA, this also separates null-qIO from falsifiable assumptions. Since almost all standard cryptographic assumptions are falsifiable, our result presents a barrier to basing qIO on standard cryptographic assumptions. The reductions we rule out are restricted: the reduction must query the adversary classically, non-adaptively, at the same security parameter, and only on honestly generated ciphertexts. Moreover, our impossibility applies only to WE with classical ciphertexts, and therefore does not rule out qIO with obfuscators whose output is a quantum state. Ruling out more general reductions, as well as more general forms of WE and qIO, remains open. Our impossibility relies on the existence of a QMA-QCIP[2] gap problem, an average-case assumption postulating a QMA language that cannot be verified with two messages of classical communication.", "url": "https://arxiv.org/abs/2608.25195", "type": "理论", "summary": "1. 该工作证明，在受限的量子黑盒归约下，QMA见证加密无法建立在任何可证伪密码学假设之上，并由此将零量子电路qIO与可证伪假设分离。\n2. 其核心技巧是引入QMA-QCIP[2]间隙问题的平均情况困难性，并针对经典非自适应查询、同安全参数及诚实密文的归约建立不可能性。\n3. 这一障碍表明基于标准假设构造qIO不可行，但量子态输出的混淆器及更一般的归约仍开放，为后续研究划定了边界。", "summary_source": "deepseek", "authors": [{"name": "Mohammed Barhoush"}, {"name": "Tomoyuki Morimae"}, {"name": "Ramis Movassagh"}], "featured_authors": [{"name": "Mohammed Barhoush"}, {"name": "Tomoyuki Morimae"}, {"name": "Ramis Movassagh"}], "author_count": 3}, {"id": "2608.25414", "category": "quant-ph", "title": "Affine-Profile Stabilizer Thresholds for Magic in Codeword-Stabilized Quantum Codes", "abstract": "Codeword-stabilized quantum codes give a unified graph-state description of stabilizer and nonadditive quantum error-correcting codes. Although each individual CWS word state is stabilizer, coherent superpositions of different word states can be nonstabilizer. We develop a CWS-adapted magic-witness framework that isolates this codeword coherence and converts it into certified lower bounds on robustness of magic. The main result is an exact reduction of the stabilizer threshold of a natural CWS coherence witness to a finite-geometric problem over the classical CWS word set. For general weighted superpositions, the threshold is computed by enumerating affine intersections and affine-quadratic phases. For equal-weight superpositions, the phase optimization collapses, and the threshold is determined entirely by how many CWS words can lie in affine flats of each dimension. Thus a quantum optimization over stabilizer states becomes a classical affine-incidence problem. This reduction yields a fixed-parameter algorithm, an analytic lower bound for an infinite union-stabilizer family, and exact rational certificates for several standard nonadditive CWS examples. The framework also clarifies why exact enumeration fails for large structured families and identifies the remaining task as an affine-intersection problem. The result provides a geometric mechanism by which nonlinear CWS word sets generate certifiable magic.", "url": "https://arxiv.org/abs/2608.25414", "type": "理论+数值", "summary": "1. 该工作为码字稳定化（CWS）量子码发展了一套适配的魔法见证框架，将不同字态间的相干性分离出来并转化为鲁棒魔法的认证下界。\n2. 其技术核心是将自然相干见证的稳定子阈值精确归约为经典有限几何问题：一般权重叠加由仿射交集与仿射二次相位枚举决定，等权叠加则只需统计各维仿射平层中码字数目。\n3. 这一归约揭示了非线性CWS码字集合产生可证魔法的几何机制，并提供固定参数算法、无限并稳定子族的解析下界及非加性码的精确有理证书，为可扩展魔法量化指明仿射交集问题方向。", "summary_source": "deepseek", "authors": [{"name": "Li-Yi Hsu"}, {"name": "En-Jui Kuo"}], "featured_authors": [{"name": "Li-Yi Hsu"}, {"name": "En-Jui Kuo"}], "author_count": 2}, {"id": "2608.25437", "category": "quant-ph", "title": "The temperature-dependent non-Abelian gauge potential", "abstract": "This study shows that the usual time evolution operator can act as a U(1) gauge transformation on the initial wavefuntion. When considering the spin freedom in the system, the time evolution operator corresponds to a non-Abelian SU(2) gauge transformation for spin-1/2 particles and a SU(3) gauge transformation for spin-1 particles. If we adopt the adiabatic approximation in the magnetization dynamics of a ferromagnetic system driven by a spin-polarized current, a temperature-dependent non-Abelian thermal gauge potential will appear. We can employ a temperature-dependent Landau-Lifshitz-Gilbert (LLG) equation to describe the magnetization dynamics in the semi-classical limit, a linear approximated solution for this equation is given analytically.", "url": "https://arxiv.org/abs/2608.25437", "type": "理论", "summary": "1. 该工作把通常的含时演化算符视为对初始波函数的规范变换，并指出考虑自旋自由度后它给出SU(2)或SU(3)非阿贝尔规范势，进而用于铁磁磁化动力学研究。\n2. 其核心是在自旋极化电流驱动的绝热磁化动力学中导出温度依赖的非阿贝尔热规范势，并建立半经典极限下含温度的LLG方程及其线性近似解析解。\n3. 这为磁化动力学中引入热效应提供了规范场描述，也为自旋电子学中的温度相关输运与自旋动力学的进一步研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Zheng-Chuan Wang"}], "featured_authors": [{"name": "Zheng-Chuan Wang"}], "author_count": 1}, {"id": "2608.25475", "category": "quant-ph", "title": "Interpretable Activation-Selection Neural Networks for Symbolic Regression of Parameter-Dependent Hamiltonian Eigenvalues", "abstract": "Analytical approximations to eigenvalues of parameter-dependent Hamiltonians can provide physical insight that is not readily apparent from numerical diagonalization alone. Here, we introduce an activation-selection network (ASN), a differentiable symbolic-regression architecture in which each input node learns a sparse combination of predefined analytical functions, and the trained network can be converted directly into an explicit expression. Before regression, the Hamiltonian parameters and eigenvalues are expressed as dimensionless ratios. This normalization enforces dimensional homogeneity, reduces the number of independent variables, and ensures that the extracted expressions do not depend on the choice of energy units. Using the library {0, x, x^2}, compositions across successive hidden layers generate polynomial expansions of progressively higher degree; polynomial expansions of arbitrary finite degree can therefore be obtained in principle by increasing the network depth. We apply the ASN to effective three- and four-site spin-chain Hamiltonians relevant to zero-quantum nuclear magnetic resonance. Comparisons with degenerate perturbation theory show that the extracted expressions capture the expected constant, linear, and quadratic structure. Fixed-basis least-squares models match or slightly outperform the ASN when an appropriate quadratic basis is specified in advance, while inclusion of a radial feature improves the local approximation near the degeneracy. These results establish the ASN as a differentiable framework for selecting compact symbolic representations when several functional forms are plausible, while showing that adaptive activation selection does not provide an intrinsic accuracy advantage over a suitable predefined basis.", "url": "https://arxiv.org/abs/2608.25475", "type": "理论+数值", "summary": "1. 该工作提出激活选择网络，用于参数依赖哈密顿量本征值的可解释符号回归，并直接输出显式解析表达式。\n2. 其技术核心是将参数与本征值无量纲化以保证量纲齐次性，并利用逐层函数复合生成任意有限阶多项式展开。\n3. 在对零量子核磁共振自旋链模型的应用中，该框架可提取紧致的符号表示，但不具备相对于预设基组的本征精度优势。", "summary_source": "deepseek", "authors": [{"name": "Alexander Yu. Kharin"}, {"name": "Kirill F. Sheberstov"}], "featured_authors": [{"name": "Alexander Yu. Kharin"}, {"name": "Kirill F. Sheberstov"}], "author_count": 2}, {"id": "2608.25484", "category": "quant-ph", "title": "Low-leakage superconducting-qubit measurement with sub-100-ns total duration", "abstract": "Fast, accurate, and low-leakage qubit measurement is a key requirement for quantum error correction. Here, we demonstrate measurement of a superconducting transmon qubit with a total duration of 97(1) ns, defined as the time from the start of the measurement pulse until the measurement-induced error on a subsequent $\\pi$-pulse operation falls below $10^{-4}$. By combining a large state-averaged resonator decay rate of $\\kappa_\\mathrm{eff}/2\\pi$ = 30.8 MHz with a dispersive shift close to the optimal SNR-per-photon condition, we achieve an assignment error of 0.17(1)% using a 58-ns measurement pulse, with residual readout photons depleting passively in tens of nanoseconds without an active depletion pulse. Using a repeated-measurement sequence together with a leakage-sensitive measurement, we benchmark the measurement-induced state transitions, finding a per-measurement leakage rate of $2.7(2) \\times 10^{-5}$, only twice the background rate and two orders of magnitude below the measurement-induced relaxation rate, which dominates the assignment error. Floquet simulations indicate that the multiphoton resonances present at the operating point are weakly coupled and traversed diabatically, without causing leakage. These results demonstrate that a large resonator decay rate, combined with a dispersive shift close to the optimal SNR-per-photon condition, can enable fast, high-fidelity, low-leakage dispersive readout at small qubit-resonator detuning.", "url": "https://arxiv.org/abs/2608.25484", "type": "实验", "summary": "1. 该工作实验实现了总时长97(1) ns的超导transmon量子比特测量，并将后续π脉冲的测量诱导误差抑制在10^{-4}以下。\n2. 其技术关键在于联合30.8 MHz的大平均谐振器衰减率与接近最优每光子信噪比条件的色散位移，以58 ns脉冲获得0.17(1)%的分配误差，且每次测量的泄漏率仅为2.7(2)×10^{-5}。\n3. 结合Floquet模拟表明多光子共振弱耦合且被绝热穿越，为小失谐下的快速、高保真、低泄漏色散读出提供了现实可行的技术路径。", "summary_source": "deepseek", "authors": [{"name": "Peter A. Spring"}, {"name": "Adrian L. Hesse"}, {"name": "Shiyu Wang"}, {"name": "Shuhei Tamate"}, {"name": "Yasunobu Nakamura"}], "featured_authors": [{"name": "Peter A. Spring"}, {"name": "Adrian L. Hesse"}, {"name": "Shiyu Wang"}, {"name": "Shuhei Tamate"}, {"name": "Yasunobu Nakamura"}], "author_count": 5}, {"id": "2608.25511", "category": "quant-ph", "title": "Superextensive learning in quantum reservoirs at the onset of information scrambling", "abstract": "The idea that information processing is optimised near the boundary between order and chaos has emerged as a recurring principle across neuroscience, complex systems, and machine learning. Here we test this hypothesis in quantum many-body systems, numerically simulating two-dimensional Ising networks of up to $N=20$ spins, operated as quantum reservoirs for time-series forecasting. Using out-of-time-order correlators (OTOCs), we locate the onset of information scrambling as the input strength is swept, separating regimes where information is frozen and scrambled across the whole reservoir state. We show that prediction precision peaks at the onset of scrambling, along with the number of computational-basis states that the reservoir actively populates. We then show that prediction precision grows as a power law $\\sim N^{\\alpha}$ in the reservoir size, superextensively $(\\alpha>1)$ at the onset of scrambling and only sublinearly $(\\alpha<1)$ in either neighbouring regime. Finally, we show that scrambling enhances the nonlinear components of the reservoir memory while reducing its linear capacity. At the onset, the total memory capacity grows superextensively, provided that the necessary ``forgetting'' mechanism is supplied by a collective relaxation channel. These results consolidate the role of information scrambling in learning systems, turning it from an operating point into a scaling law for the performance of quantum reservoirs.", "url": "https://arxiv.org/abs/2608.25511", "type": "理论+数值", "summary": "1. 该工作数值模拟多达20个自旋的二维伊辛网络，将其作为量子储层，以OTOC扫描输入强度并定位信息扰乱起始点，研究时序预测表现。\n2. 其卖点是预测精度在扰乱起始点达到峰值，精度随储层大小呈超扩展幂律α>1增长，而相邻区域内仅亚线性增长，且起始点处非线性记忆增强而线性容量降低。\n3. 这提示信息扰乱不仅是量子储层工作的优选操作点，更可上升为系统尺度下的性能标度律，同时集体弛豫通道提供了必要的遗忘机制。", "summary_source": "deepseek", "authors": [{"name": "Jonas Freiheit"}, {"name": "Francesco Campaioli"}], "featured_authors": [{"name": "Jonas Freiheit"}, {"name": "Francesco Campaioli"}], "author_count": 2}, {"id": "2608.25788", "category": "quant-ph", "title": "Quantum sampling in hybrid light-matter systems with mixed statistics", "abstract": "Boson sampling is one of the most prominent methods to verify quantum advantage, harnessing the computational complexity of the permanent of a network matrix. Similar quantum sampling problems utilize other expressions for the output probabilities, such as the fermion-based analog applying determinants. In this work, we study sampling setups of interacting light-matter systems, combining fermion and boson sampling. The mixed network input consists of fermionic and bosonic excitations. Sampling the output probability of the modes then yields contributions that are neither purely determinant nor permanent but general immanants. Specifically, we prove that these immanant contributions are linearly independent from determinants and permanents, rendering our mixed sampling network an ideal candidate for light-matter quantum application beyond pure fermion and boson sampling. Furthermore, quantum sampling with statistics that are neither bosonic nor fermionic results in expressions which even exceed immanants, further extending the functionality of quantum samplers.", "url": "https://arxiv.org/abs/2608.25788", "type": "理论", "summary": "1. 该工作研究相互作用光-物质系统中由费米子与玻色子激发共同输入混合网络的量子采样，探讨混合统计下的输出概率结构。\n2. 其主要技术贡献在于证明此类输出概率包含广义行列式（immanant）贡献，并与纯费米采样的行列式及纯玻色采样的永久式线性无关；非玻色/费米统计更可导致超出广义行列式的表达式。\n3. 这使混合光-物质采样网络成为超越纯费米/玻色采样的量子优势验证与光-物质量子应用候选，同时拓展了量子采样器对一般统计的模拟能力。", "summary_source": "deepseek", "authors": [{"name": "Franziska Barkhausen"}, {"name": "Laura Ares"}, {"name": "Stefan Schumacher"}, {"name": "Jan Sperling"}], "featured_authors": [{"name": "Franziska Barkhausen"}, {"name": "Laura Ares"}, {"name": "Stefan Schumacher"}, {"name": "Jan Sperling"}], "author_count": 4}, {"id": "2608.25797", "category": "quant-ph", "title": "Fault-tolerant $|\\sqrt{ \\mathrm{T} }\\rangle$ state preparation and injection for more efficient fine-grained quantum circuit synthesis", "abstract": "Magic-state injection is a standard route to realize universal fault-tolerant quantum computation. Whereas the set of Clifford gates in combination with the non-Clifford T gate is a widely used universal gate set, extending the available set of non-Clifford primitives can reduce compilation overhead, provided that the additional primitives can be prepared fault-tolerantly with competitive resource costs and at sufficiently low logical noise rates. In this work, we introduce flag fault-tolerant protocols for preparing logical $|\\sqrt{\\mathrm{T}} \\rangle $ magic states on the 3D tetrahedral color code and its smaller morphed variant. Our simulations under circuit-level noise verify fault tolerance, quantify acceptance and logical error rates, and we reconstruct the effective logical channels of the corresponding circuits for gate injection via logical process tomography. We find that access to $\\sqrt{\\mathrm{T}}$ reduces the average space-time cost of synthesizing Haar-random single-qubit unitaries by approximately $20$-$30$% relative to the Clifford+T gate set across practically relevant approximation regimes. These results demonstrate how expanding the set of fault-tolerant non-Clifford primitives can improve computational efficiency and broaden the design space for universal quantum computation in the early fault-tolerant era.", "url": "https://arxiv.org/abs/2608.25797", "type": "理论+数值", "summary": "1. 该工作针对早期容错量子计算，提出在三维四面体色码及其变体上制备逻辑 |√T⟩ 魔态的旗标容错协议，并用于非克利福德门注入。\n2. 主要卖点是通过电路级噪声模拟与逻辑过程层析验证容错性，量化接受率与逻辑错误率，表明引入 √T 门使合成Haar随机单比特酉门的平均时空开销较 Clifford+T 降低约20–30%。\n3. 这一结果展示了扩充容错非克利福德原语集合可提升编译效率，为早期容错时代通用量子计算的资源优化与设计空间拓展提供可行思路。", "summary_source": "deepseek", "authors": [{"name": "Berat Yenilen"}, {"name": "Markus Müller"}, {"name": "Manuel Rispler"}], "featured_authors": [{"name": "Berat Yenilen"}, {"name": "Markus Müller"}, {"name": "Manuel Rispler"}], "author_count": 3}, {"id": "2608.25822", "category": "quant-ph", "title": "Fast-forwarding quantum algorithms for weakly nonlinear dissipative differential equations and beyond", "abstract": "We study a fast-forwarded quantum algorithm for solving weakly nonlinear dissipative ordinary differential equations. Our approach is a combination of the Carleman embedding technique and the linear combination of Hamiltonian simulation algorithm for linearized systems with fast-forwarded scaling. The complexity of our algorithm does not explicitly depend on the evolution time $T$, thus greatly improving the previous state-of-the-art $\\widetilde{\\mathcal{O}}(\\sqrt{T})$ to $\\mathcal{O}(1)$, and any remaining time dependence enters through the output norm and forcing parameters. We rigorously analyze the performance of this approach by convergence guarantees of the Carleman embedding for time-dependent coefficient matrices and detailed complexity estimates, and improve the realization of the Carleman-embedding-based algorithms by simplifying the post-selection step. In addition, we perform a numerical study on differential equations beyond the weakly nonlinear case, and identify possibility of achieving fast-forwarding scaling for systems with stronger nonlinearity or linear non-resonant effect.", "url": "https://arxiv.org/abs/2608.25822", "type": "理论+数值", "summary": "1. 该工作提出一种快速前进量子算法，用于求解弱非线性耗散常微分方程，结合Carleman嵌入与线性组合哈密顿模拟，使算法复杂度不再显式依赖演化时间T，由最优的~O(√T)改进至O(1)。\n2. 其技术卖点在于给出含时系数矩阵下Carleman嵌入的收敛性保证与复杂度估计，并简化后选择步骤，剩余时间依赖仅通过输出范数和驱动项参数体现。\n3. 数值研究还显示，在更强者非线性或线性非共振情形下系统可能同样获得快速前进标度，为量子微分方程求解器拓展到弱非线性之外提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Yixiang Li"}, {"name": "Dong An"}], "featured_authors": [{"name": "Yixiang Li"}, {"name": "Dong An"}], "author_count": 2}, {"id": "2608.25929", "category": "quant-ph", "title": "Magic of Kitaev spin liquids", "abstract": "Quantum spin liquids (QSLs) are long-range entangled phases of matter and a natural setting for exploring how quantum correlations generate quantum complexity. Motivated by the emergence of magic, or nonstabilizerness, as a diagnostic of many-body complexity beyond entanglement, we study magic of QSLs by computing the stabilizer Rényi entropy (SRE) of the Kitaev honeycomb model. We derive a correspondence between Pauli strings and products of itinerant Majorana operators in the model's free-fermion description; this enables the sampling of SRE using an optimized algorithm for Gaussian states in systems with thousands of spins. Our results show that magic is largest in the gapless phase, where subleading volume-law corrections indicate nonlocal contributions, while in the gapped phases, SRE decreases in quantitative agreement with a perturbative expansion that we develop in the anisotropic limit. At the topological phase transition, SRE exhibits universal scaling dictated by critical exponents.", "url": "https://arxiv.org/abs/2608.25929", "type": "理论+数值", "summary": "1. 该工作通过计算基塔耶夫蜂窝模型的稳定子Rényi熵，系统研究了量子自旋液体中的非稳定子复杂度。\n2. 其技术核心是建立泡利算符与巡游马约拉纳费米子算符的对应，并利用高斯态优化算法实现对数千自旋体系SRE的高效采样。\n3. 结果揭示无隙相中magic最强且含非局域体积律修正，而拓扑相变处SRE服从临界指数控制的普适标度，为量子复杂度诊断提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Eleonora Lamma"}, {"name": "Tim Bauer"}, {"name": "Marcello Dalmonte"}, {"name": "Mario Collura"}], "featured_authors": [{"name": "Eleonora Lamma"}, {"name": "Tim Bauer"}, {"name": "Marcello Dalmonte"}, {"name": "Mario Collura"}], "author_count": 4}, {"id": "2608.25953", "category": "quant-ph", "title": "Position- and Momentum-Space Quantum Information Measures of the Double-Morse Oscillator", "abstract": "We investigate the quantum-information properties of a particle confined by the double Morse potential in position and momentum spaces. The quasi-exact solvability of the model gives analytical expressions for the first two bound states, allowing the corresponding probability densities to be analyzed directly. Shannon entropy, Onicescu energy, Fisher information, statistical complexity, and Fisher-Shannon products are evaluated as functions of the parameter $A$, which controls the transition from a well-separated double well to a merged single-well profile. The position distribution is more delocalized and structurally complex when the double-well character is pronounced, whereas the momentum distribution exhibits the complementary trend. As the wells merge, the ground-state Fisher--Shannon product approaches its Gaussian reference value, whereas the excited state retains stronger non-Gaussian structure.", "url": "https://arxiv.org/abs/2608.25953", "type": "理论+数值", "summary": "1. 该工作利用双Morse势的准精确可解性，计算了位置与动量空间中前两个束缚态的多种量子信息量。\n2. 随参数A由双井过渡到单井，位置分布由离域复杂变为集中，动量分布相反；基态Fisher-Shannon积趋近高斯值。\n3. 为双井及非谐振子系统的量子信息度量与结构转变探测提供了解析参考和判据。", "summary_source": "deepseek", "authors": [{"name": "Firoz Chogle"}, {"name": "Ernesto Damiani"}, {"name": "Berihu Teklu"}], "featured_authors": [{"name": "Firoz Chogle"}, {"name": "Ernesto Damiani"}, {"name": "Berihu Teklu"}], "author_count": 3}, {"id": "2608.25961", "category": "quant-ph", "title": "Superadditivity of classical communication over quantum channels via random and deterministic permutations", "abstract": "Since Hastings' proof of superadditivity of classical communication over quantum channels, considerable effort has been devoted to finding a structural explanation of this phenomenon that was originally established by concentration of measure for Haar random unitaries. The main observation of this work is that Haar randomness can be replaced by random permutations without changing the limiting geometry responsible for nonadditivity. This replacement turns a continuous problem over unitary matrices into a discrete combinatorial problem over zero--one permutation matrices, and thereby opens a path toward derandomization. The theorem of Bordenave and Collins shows that random permutations have the required limiting behavior and the algorithm of O'Donnell and Wu then provides a deterministic asymptotic construction, running in polynomial time in the size when the channel parameters and accuracy are fixed. Thus the random construction can be derandomized in an asymptotic algorithmic sense, although finding a simple closed-form or practically computable counterexample remains open. Finally, a quantitative random permutation estimate by Chen, Garza-Vargas, Tropp and van Handel gives a fully numerical estimate: there exists a tuple of 57,836,025 permutations acting on a set of size \\[ N \\le 5.422\\times 10^{116216}\\] such that the associated finite dimensional channel exhibits nonadditivity. This enormous value remains an obstacle to a practical construction.", "url": "https://arxiv.org/abs/2608.25961", "type": "理论+数值", "summary": "1. 该工作证明量子信道的经典通信容量超可加性可仅由随机置换替代Haar随机幺正实现，且不改变导致非可加性的极限几何。\n2. 其技术卖点是把连续幺正矩阵问题转化为零一置换矩阵上的离散组合问题，由此可用Bordenave-Collins定理得到所需极限行为，并以O'Donnell-Wu算法在信道参数与精度固定时给出多项式时间的确定性渐近构造。\n3. 基于Chen-Garza-Vargas等的定量估计，可构造由57,836,025个置换作用于N≤5.422×10^116216的集合所对应的有限维通道并展示非可加性，然而该巨大规模仍构成实用显式反例的主要障碍。", "summary_source": "deepseek", "authors": [{"name": "Benjamin Lovitz"}, {"name": "Peixue Wu"}], "featured_authors": [{"name": "Benjamin Lovitz"}, {"name": "Peixue Wu"}], "author_count": 2}, {"id": "2608.26010", "category": "quant-ph", "title": "From Round-Trip State Echo to Error Recovery: Snapshot-Resolved Quantum-Hardware Diagnostics", "abstract": "End-to-end quantum-hardware scores need not transfer across workloads, compilations, or execution times. We specify a compilation-explicit screen-and-stress profile whose opening diagnostic is round-trip state echo (RTSE): prepare one of four tetrahedral qubit states at a route root, move it out and back by swaps, apply inverse preparation at the root, and record zero. An execution snapshot means a dated submitted task batch together with its captured capability document where available, not a certified calibration epoch. On sparse superconducting hardware, a byte-identical communication rerun changed route-level contrasts although the aggregate RTSE estimates differed by only 0.00125. In a separate prospectively frozen two-window length study, RTSE and the remote-inverse do-nothing predecessor's root marginal both fell from length 2 to length 10; the prespecified interaction did not support superior RTSE retention. The mean selected-output return probability across 64 deletion-recovery cells changed from 0.738 to 0.624 between IQM execution snapshots. On a trapped-ion service advertising all-to-all connectivity among five submitted virtual wires, recovery was 0.911 and 0.923 in two windows, exceeding the frozen two-thirds reference; recovery-minus-adjoint-control differences were 0.446 and 0.443. These are execution-workload diagnostics, not coding-gain, error-suppression, physical-loss, fault-tolerance, or architecture-ranking claims. The results support assessment indexed by workload, placement or virtual-wire contract, compilation, architecture, and execution snapshot.", "url": "https://arxiv.org/abs/2608.26010", "type": "理论+数值", "summary": "1. 该论文提出基于往返态回波（RTSE）的编译显式筛选与压力测试方案，用于量子硬件诊断。\n2. 核心是将诊断锚定在执行快照而非校准周期：RTSE仅改变汇总估计0.00125，却改写路由级对比；恢复率随快照从0.738降至0.624。\n3. 这为量子硬件评估转向工作负载、虚线契约与编译感知的按快照认证提供了依据，而非泛化基准声明。", "summary_source": "deepseek", "authors": [{"name": "Isaac Barouch Essayag"}, {"name": "Aryeh Lev Zabokritskiy"}], "featured_authors": [{"name": "Isaac Barouch Essayag"}, {"name": "Aryeh Lev Zabokritskiy"}], "author_count": 2}, {"id": "2608.26061", "category": "quant-ph", "title": "Asymptotically optimal purification of noisy unitary channels in any dimension", "abstract": "We consider the problem of noisy unitary purification. Given access to an unknown $d$-dimensional unitary channel followed by depolarizing noise of strength $p$, we aim to construct a superchannel that universally purifies the noisy unitary back to the original unknown unitary. We optimize over arbitrary adaptive sequential strategies and analytically derive the optimal fidelity to the leading order in the noise strength and number of channel uses, while also providing a concrete $\\mathrm{SU}(d)$-covariant parallel strategy that attains the optimum. Our result implies the query complexity $\\Theta(d^2p/\\epsilon)$ for achieving leading-order infidelity $\\epsilon$ in the low-noise regime, which scales better than the naive approach combining optimal state purification and storage-and-retrieval of quantum channels. We also consider the dual problem of noisy unitary conjugation, where the goal is to obtain the best approximation of the complex conjugate of the original unknown unitary from access to noisy queries. We show that the optimal fidelity for this task coincides with that of noisy unitary purification to the leading-order in the low-noise and large-query limit.", "url": "https://arxiv.org/abs/2608.26061", "type": "理论+数值", "summary": "1. 该工作针对任意维数d的未知酉信道叠加去极化噪声的纯化问题，提出了最优自适应序贯策略并解析求解了领先阶保真度。\n2. 其技术核心是构造达到最优的SU(d)协变并行方案，并证明低噪声下实现保真度ε所需查询复杂度为Θ(d^2p/ε)，优于朴素纯化结合存取信道的方法。\n3. 这一结果同时表明噪声酉共轭问题的最优保真度与纯化问题在低噪声大查询极限下一致，为量子信道处理与错误缓解提供了通用基准。", "summary_source": "deepseek", "authors": [{"name": "Ryotaro Niwa"}, {"name": "Satoshi Yoshida"}, {"name": "Mio Murao"}], "featured_authors": [{"name": "Ryotaro Niwa"}, {"name": "Satoshi Yoshida"}, {"name": "Mio Murao"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
