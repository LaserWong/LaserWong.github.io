<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-08-27 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

  <script>
    const papers = [{"id": "2608.24927", "category": "cond-mat", "title": "Reply to Comment on: Microscopic signatures of an imaginary charge density wave in a kagome metal", "abstract": "We address a recent Comment [I. Nikolov {\\it et al.}, arXiv:2608.13579 (2026)] proposing crystalline mosaicity as an alternative explanation for the asymmetric nuclear magnetic resonance (NMR) spectra reported in our study [S. Suetsugu {\\it et al.}, Nat. Phys. {\\bf 22}, 1251--1256 (2026)]. We show that this scenario requires substantial temperature- and site-dependent distributions of crystallographic orientations and additional site-dependent distributions of the electric field gradient (EFG) asymmetry parameter, none of which follow from ordinary crystalline mosaicity. We therefore conclude that crystalline mosaicity cannot account for the observed site-selective spectral asymmetry and does not provide an alternative explanation for the central spectroscopic observation underlying our interpretation.", "url": "https://arxiv.org/abs/2608.24927", "type": "理论", "summary": "1. 该工作在笼目金属中虚电荷密度波微观特征的研究基础上，回应了一则提出晶粒镶嵌解释非对称核磁共振谱的评论，并论证其不成立。\n2. 其核心论据是，镶嵌情景需要引入随温度和格点显著变化的晶格取向分布，以及额外的电场梯度不对称参数逐点分布，这超出普通镶嵌的合理范围。\n3. 因此，晶粒镶嵌无法解释位点选择性谱不对称这一核心观测量，反而强化了虚电荷密度波图像的成立，并为后续检验提供了明确约束。", "summary_source": "deepseek", "authors": [{"name": "S. Suetsugu"}, {"name": "S. Kitagawa"}, {"name": "K. Ishida"}, {"name": "T. Shibauchi"}, {"name": "Y. Matsuda"}], "featured_authors": [{"name": "S. Suetsugu"}, {"name": "S. Kitagawa"}, {"name": "K. Ishida"}, {"name": "T. Shibauchi"}, {"name": "Y. Matsuda"}], "author_count": 5}, {"id": "2608.24967", "category": "cond-mat", "title": "Heat Transfer and Torque in Enclosing Cylindrical Configurations with Nonreciprocal Materials", "abstract": "Electromagnetic fluctuations can transfer not only energy but also angular momentum, leading to forces, torques, heat currents, and friction in out-of-equilibrium setups. In enclosing configurations, we show that if at least one of two objects is rotationally symmetric, the torque is bounded by heat transfer, since both arise from photon transfers with angular momentum $\\hbar n$ and energy $\\hbar\\omega$. With only one object assumed to be rotationally symmetric, it may be possible to obtain a nonzero torque with reciprocal media, but nonreciprocal media are required to break the symmetry between $n$ and $-n$ and produce a nonzero torque if both objects are rotationally symmetric. We then specialize to concentric cylinders with a nonreciprocal dielectric response and use Rytov fluctuational electrodynamics to express heat transfer and torque in terms of an angular-momentum-resolved flux density, $\\Phi_n(\\omega)$. We also analyze the conditions for stable levitation of the inner cylinder using the proximity force approximation, in the process obtaining a new analytic formula for the normal Casimir force between dilute plates at different temperatures. Finally, to find the extracted work in a contactless engine setup, we compute the fluctuation-induced friction for a slowly rotating inner cylinder, and we find a bound between torque, friction, and heat transfer. Due to this bound, the efficiency of the heat engine remains bounded by the Carnot limit.", "url": "https://arxiv.org/abs/2608.24967", "type": "理论+数值", "summary": "1. 该工作研究非互易介质同心圆柱封闭结构中电磁涨落诱导的传热、力矩、摩擦及非接触热机功提取。\n2. 其核心是用角动量分辨流密度统一表达传热与力矩，证明双旋转对称构型需非互易介质打破 n 与 −n 对称，并给出力矩受传热限制及近程力近似下的新解析关系。\n3. 这为卡西米尔力矩与热机效率建立了普适约束，指出效率不超过卡诺极限，可为微尺度非接触引擎和稳定悬浮设计提供定量判据。", "summary_source": "deepseek", "authors": [{"name": "Dhruv Shah"}, {"name": "Kiryl Asheichyk"}, {"name": "David Gelbwaser-Klimovsky"}, {"name": "Noah Graham"}, {"name": "Mehran Kardar"}, {"name": "Matthias Krüger"}], "featured_authors": [{"name": "Dhruv Shah"}, {"name": "Kiryl Asheichyk"}, {"name": "David Gelbwaser-Klimovsky"}, {"name": "Noah Graham"}, {"name": "Mehran Kardar"}, {"name": "Matthias Krüger"}], "author_count": 6}, {"id": "2608.24980", "category": "cond-mat", "title": "Nonlocal thermal noise in electrically coupled conductors: A microscopic two-dimensional study", "abstract": "The Johnson-Nyquist theory is commonly implemented by representing a conductor as a collection of independent local thermal-noise sources whose strength is determined by the local temperature. Whether this local-noise representation remains valid for electrically coupled conductors maintained at different temperatures has received comparatively little attention. We investigate this question by means of microscopic two-dimensional simulations of interacting charge carriers in conducting wires capacitively coupled. The model reproduces Ohm's law, the equilibrium Johnson noise, and vanishing correlations between detached wire segments when both wires are at the same temperature. However, when the wires are held at different temperatures, finite correlations develop between the electromotive forces generated in distant segments, leading to systematic deviations of the Johnson temperature inferred from the local-noise picture. The effect persists although the microscopic particle interactions are short-ranged and the two wires interact only through the capacitive coupling. These results suggest that the independent-local-source representation of thermal noise may not remain valid in electrically coupled nonequilibrium conductors.", "url": "https://arxiv.org/abs/2608.24980", "type": "理论+数值", "summary": "1. 该工作利用二维微观带电载流子模拟，考察电容耦合导线在不同温度下局域热噪声源表示是否成立，并复现欧姆定律与平衡Johnson噪声。\n2. 其核心发现在于等温时线间关联消失，但温差下远端区段电动势之间出现有限关联，导致由局域噪声图像推断的Johnson温度产生系统性偏差。\n3. 该效应即使粒子相互作用为短程且仅靠电容耦合仍持续存在，说明独立局域源噪声模型在电耦合非平衡导体中失效，对介观输运与噪声测温研究具有重要启示。", "summary_source": "deepseek", "authors": [{"name": "Jorge Berger"}], "featured_authors": [{"name": "Jorge Berger"}], "author_count": 1}, {"id": "2608.24984", "category": "cond-mat", "title": "High-harmonic fingerprints of sharp spin twists in a chiral soliton lattice", "abstract": "A magnetic field applied perpendicular to the helical axis of a monoaxial chiral helimagnet compresses the spin helix into a coplanar chiral soliton lattice (CSL). We show that optically driven high-harmonic generation from itinerant electrons coupled to a frozen CSL resolves the lattice-scale structure of the localized twist, rather than the continuum soliton shape. High-order harmonics remain perturbative for the uniform helix. As the winding localizes at fixed magnetic period, they grow by many orders of magnitude and acquire a nonperturbative dependence on the drive amplitude. The growth originates from a spatially nonuniform effective hopping that turns each soliton into a localized dip in the hopping amplitude. When the degree of winding localization is held fixed, high-order intensities fall by many orders of magnitude as the magnetic period increases toward the continuum limit, where the hopping modulation is spatially smoothed. High-order harmonics thus resolve a real-space characteristic of the coplanar CSL, even in the absence of scalar chirality and an emergent magnetic field.", "url": "https://arxiv.org/abs/2608.24984", "type": "理论", "summary": "1. 该工作理论上研究了单轴手性螺旋磁体中巡游电子与冻结手性孤子晶格耦合时的光驱动高次谐波产生，指出高阶谐波可分辨局域自旋扭折的晶格尺度结构。\n2. 其核心机制是空间非均匀有效跃迁使每个孤子成为局域跃迁凹陷；缠绕局域化时谐波强度增长多个量级，并呈现对驱动幅度的非微扰依赖。\n3. 这为无标量手性与涌现磁场的体系提供了实空间自旋结构的光学探测途径，并预示连续极限下谐波强度骤降，可作为区分局域扭折与连续孤子的判据。", "summary_source": "deepseek", "authors": [{"name": "Atsushi Ono"}], "featured_authors": [{"name": "Atsushi Ono"}], "author_count": 1}, {"id": "2608.24989", "category": "cond-mat", "title": "Quantum spin Hall crystals at fractional filling of twisted MoTe$_2$", "abstract": "We predict and classify interaction-driven quantum spin Hall crystals (QSHCs), a class of states emerging at fractional filling through an interplay of topology and spontaneous translation-symmetry breaking. QSHCs form nearly degenerate manifolds whose members can realize distinct topological phases protected by time-reversal or valley $U(1)_v$ symmetry, with time-reversal acting nontrivially within the manifold. As a representative of this broad class of states we provide evidence for 9-fold quasi-degenerate $\\sqrt{3}\\times\\sqrt{3}$ charge ordered QSHCs at $\\nu = -8/3$ of twisted bilayer MoTe$_2$ near a $5^\\circ$ twist. Here a $\\mathbb{Z}_3$ index organizes states related by lattice translation into three time-reversal invariant states with nontrivial $\\mathbb{Z}_2$ topology and three time-reversal related doublets whose individual members spontaneously break time-reversal and carry a $U(1)_v$ protected spin-Chern number. Finally, we determine the conditions that favor QSHCs over closely competing intervalley-coherent crystals.", "url": "https://arxiv.org/abs/2608.24989", "type": "理论", "summary": "1. 该工作预言并分类了扭曲MoTe2分数填充下由相互作用驱动的量子自旋霍尔晶体态。\n2. 其核心是拓扑与自发平移对称破缺的结合：近简并流形内可存在受时间反演或谷U(1)_v保护的不同拓扑相，代表例为约5°转角、ν=-8/3处9重近简并√3×√3电荷有序态，并由Z3指标区分时间反演不变与非不变成员。\n3. 这一结果明确了量子自旋霍尔晶体与谷间相干晶体的竞争条件，为在莫尔平台上探测该拓扑破缺态提供了直接靶向。", "summary_source": "deepseek", "authors": [{"name": "Xiaoyang Shen"}, {"name": "Raul Perea-Causin"}, {"name": "Christopher Ekman"}, {"name": "Jiong-Hao Wang"}, {"name": "Hui Liu"}, {"name": "Emil J. Bergholtz"}], "featured_authors": [{"name": "Xiaoyang Shen"}, {"name": "Raul Perea-Causin"}, {"name": "Christopher Ekman"}, {"name": "Jiong-Hao Wang"}, {"name": "Hui Liu"}, {"name": "Emil J. Bergholtz"}], "author_count": 6}, {"id": "2608.25002", "category": "cond-mat", "title": "Photonic spin-Hall effect as a probe for time-reversal-symmetry broken band topological phases", "abstract": "When a plane polarized Gaussian beam of light is incident on a surface, upon reflection it splits into right and left circularly polarized beams that are spatially separated in the direction perpendicular to the plane of incidence. This is known as the photonic spin-Hall effect (PSHE). In this work, we show that the centroid shift, which is the intensity weighted average of the shifts of the right and the left circularly polarized beams directly probes the optical Hall conductivity, which carries the essential information about the topological properties of the system. We show that the centroid shift as a function of the frequency of light has a unique sign structure depending on whether the system is in a time-reversal symmetry broken band topological phase or a trivial phase. Thus, the PSHE may serve as an unambiguous and a non-invasive probe to detect time-reversal symmetry broken band topological phases.", "url": "https://arxiv.org/abs/2608.25002", "type": "理论", "summary": "1. 该工作提出将光子自旋霍尔效应的质心位移用作探测时间反演对称性破缺能带拓扑相的光学探针。\n2. 其核心卖点在于质心位移直接联系光学霍尔电导，且其随频率变化的符号结构可明确区分拓扑相与平庸相。\n3. 这为借助非侵入式光学测量诊断拓扑物态提供了可行途径，并可推广至相关候选材料与异质结构。", "summary_source": "deepseek", "authors": [{"name": "Deblina Samanta"}, {"name": "Darshan G. Joshi"}], "featured_authors": [{"name": "Deblina Samanta"}, {"name": "Darshan G. Joshi"}], "author_count": 2}, {"id": "2608.25030", "category": "cond-mat", "title": "Directed walks shape a universal square-root law of entropy production rate in nonreciprocal systems", "abstract": "The entropy production rate (EPR) quantifies irreversibility of a nonequilibrium steady state, yet standard formulas obscure how a complex interaction network generates it. For multivariate Ornstein-Uhlenbeck dynamics on such networks, we express the EPR as a quadratic form in antisymmetric matrices measuring the nonreciprocity of aggregate directed walks at every length, and, equivalently, as two weighted-walk quantities: pairs of directed walks sharing both endpoints, and directed closed walks. For diagonalizable interactions, an exact correspondence translates these walk quantities into eigenvalues and biorthogonal eigenvector overlaps. Across dense, sparse, and deep acyclic random interactions satisfying matched-walk conditions, the mean EPR per node universally follows the square-root law $\\phi_*(g)=1-\\sqrt{1-g^2}$, where $g \\in [0,1)$ parametrizes the interaction strength. Deep acyclic interaction matrices are nilpotent, with all eigenvalues fixed at zero for every $g$, yet, as their depth increases, their mean EPR per node approaches $\\phi_*(g)$. Thus, the square-root law arises from directed walk properties, rather than from a shared spectral density or specific network topology.", "url": "https://arxiv.org/abs/2608.25030", "type": "理论", "summary": "1. 该工作针对非互易网络上的多元Ornstein-Uhlenbeck过程，将熵产生率表示为各长度有向游走非互易性的反对称矩阵二次型，并等价化为两类加权游走量。\n2. 其核心在于给出可对角化相互作用下本征值与双正交本征向量重叠的精确映射，并证明在稠密、稀疏及深层无环随机系综中，每节点平均熵产生率普遍满足平方根律φ_*(g)=1−√(1−g²)。\n3. 这揭示平方根律源自定向游走统计而非谱密度或网络拓扑，为利用游走结构预测和调控非平衡稳态不可逆性提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Thiparat Chotibut"}, {"name": "Ewa Gudowska-Nowak"}, {"name": "Maciej A. Nowak"}], "featured_authors": [{"name": "Thiparat Chotibut"}, {"name": "Ewa Gudowska-Nowak"}, {"name": "Maciej A. Nowak"}], "author_count": 3}, {"id": "2608.25070", "category": "cond-mat", "title": "Delta-Function Kicks are Optimal for Rapidly Driven Inertial Stochastic Systems", "abstract": "Optimal control helps guide our understanding of stochastic thermodynamics, leading to universal properties and geometric formulations. Among the initially surprising properties of optimal control, not only discrete jumps but delta function kicks have been shown to be necessary to minimize dissipation in specific example systems. Using a short-time approximation, I show that delta-function kicks are universally optimal for minimizing dissipation in inertial stochastic systems, including active and quantum dynamics under general constraints. Fundamentally stemming from basic kinematics, delta-function kicks are required to achieve linear scaling of work with short protocol durations compared to the quadratic scaling without the kicks. This implies a diverging (infinite) ratio of saved work in the short-time limit.", "url": "https://arxiv.org/abs/2608.25070", "type": "理论", "summary": "1. 该工作利用短时近似证明，在包含活性与量子动力学的惯性随机系统中，最小化耗散的最优控制普遍需要狄拉克δ函数踢击。\n2. 其核心卖点在于揭示δ函数踢击源于基本运动学，能使碰撞功随协议时长线性标度，而无踢击时仅为二次标度，从而在短时极限下获得发散的功节省比值。\n3. 这一普适结论将推动随机热力学最优控制几何框架的扩展，为活性物质与量子系统的快速驱动协议设计及实验研究提供明确指导。", "summary_source": "deepseek", "authors": [{"name": "Steven Blaber"}], "featured_authors": [{"name": "Steven Blaber"}], "author_count": 1}, {"id": "2608.25103", "category": "cond-mat", "title": "Convergence of the conformal Ward identity in the derivative expansion approximation", "abstract": "Conformal invariance is expected to be an emergent property of many systems in their critical regime. However, approximation schemes generically spoil this property. This is in particular the case of the derivative expansion, a widely used approximation scheme in the framework of the functional renormalization group. In this article, we consider Ward identities associated with conformal invariance in the 3-d Ising universality class with truncations at order 4 (next-to-next-to-leading order) in the derivative expansion, with $Z_2$ invariant composite operators. Our results confirm that the regulating functions which yield a small breaking of conformal invariance also present a small sensitivity of the universal critical exponents with the choice of this regulating function. We also show that, in the vicinity of regulator-parameter values for which the conformal constraints are best satisfied, the breaking of conformal invariance reduces as the order of the derivative expansion is increased, providing a new indication of the convergence of this approximation scheme.", "url": "https://arxiv.org/abs/2608.25103", "type": "理论", "summary": "1. 该工作检验了三维伊辛普适类中四阶导数展开下共形 Ward 恒等式与泛函重整化群的相容性。\n2. 其要点是显示调节函数导致的共形对称性破缺越小，普适临界指数对其选择的敏感性也越低。\n3. 这一收敛性证据支持导数展开方案在临界现象中作为可控近似，并启发更高阶验证。", "summary_source": "deepseek", "authors": [{"name": "Jorge Ibañez"}, {"name": "Matthieu Tissier"}, {"name": "Gonzalo De Polsi"}], "featured_authors": [{"name": "Jorge Ibañez"}, {"name": "Matthieu Tissier"}, {"name": "Gonzalo De Polsi"}], "author_count": 3}, {"id": "2608.25121", "category": "cond-mat", "title": "Carrier-Resolved Attosecond Valley Polarimetry of Monolayer MoS$_2$", "abstract": "In recent years, all-optical writing and switching of valley polarization in two-dimensional semiconductors has been demonstrated on femtosecond timescales. Reading this polarization out on the same timescale, carrier by carrier, has so far remained out of reach. Employing semiconductor Bloch equation simulations of monolayer MoS$_2$, we show that attosecond transient absorption closes this gap by turning the Mo $4p$ semicore edge into a quantitative valley polarimeter. We find that pump-enabled core-to-valence absorption probes the holes while core-to-conduction bleaching probes the electrons, so that a single spectrum identifies each carrier by its photoabsorption energy. The hole channel, Pauli-blocked in equilibrium, emerges background-free. Its circular dichroism reverses sign with the pump helicity, and its normalized magnitude is proportional to the valley polarization. Finally, we show that scanning the probe delay clocks the few-femtosecond write in real time. Thus, attosecond core-level dichroism is a carrier-sensitive, quantitative probe of the creation and evolution of valley polarization.", "url": "https://arxiv.org/abs/2608.25121", "type": "理论+数值", "summary": "1. 该工作利用半导体布洛赫方程模拟单层MoS2，提出以阿秒瞬态吸收将Mo 4p半芯态能边转变为定量谷偏振计。\n2. 其核心在于芯态到价带吸收探测空穴、芯态到导带漂白探测电子，使同一光谱按光吸收能量分辨两类载流子，空穴通道无背景，圆二色符号随泵浦螺旋性反转且归一化幅度正比于谷极化。\n3. 这为在飞秒时间尺度逐载流子读取谷极化的写入与演化提供了定量时间分辨探针，可推广至其他二维半导体超快谷动力学研究。", "summary_source": "deepseek", "authors": [{"name": "Navdeep Rana"}, {"name": "Lun Yue"}, {"name": "Mette B. Gaarde"}], "featured_authors": [{"name": "Navdeep Rana"}, {"name": "Lun Yue"}, {"name": "Mette B. Gaarde"}], "author_count": 3}, {"id": "2608.25125", "category": "cond-mat", "title": "Micromechanical statistical model links induced nematic order to mechanical response in fiber networks", "abstract": "Contractile cells and external loads reorganize the fibrous extracellular matrix, aligning and compacting fibers over distances far exceeding a cell's size, strongly affecting bioprocesses such as wound healing, angiogenesis and tumor invasion. We develop a continuum micromechanical theory that links, at every material point, the load-induced orientational order to the mechanical response that the reoriented network then exhibits. The network is described statistically, by the probability density of fiber orientations, and deforms affinely, so that a single-fiber stress-strain law is carried into the network stress, with the deformation set self-consistently by mechanical equilibrium. Critical to realistic biological relevant conditions, this theory allows both geometrical and material nonlinearities. Applied to a two-dimensional network under uniaxial stretch, the theory collapses onto a single anisotropy parameter that governs the orientation distribution, the nematic order, the Poisson ratio, and the densification of fibers. Our theory reveals that induced order and densification are highly positively correlated, and in the case of uniaxial stretch they collapse onto a nearly universal curve, independent of the single-fiber stiffness behavior. For a contracting cell, we find that buckling controls how far nematic orientational order and densification propagate. We find an algebraic decay of deformations with distance and solve for the dependence of the power-law exponent on the buckled-reduced stiffness of a single fiber. We validate our theory by comparison with non-affine discrete fiber-network simulations.", "url": "https://arxiv.org/abs/2608.25125", "type": "理论+数值", "summary": "1. 该工作提出一个连续介质微力学统计理论，将纤维网络受载诱导的向列序与其后呈现的力学响应在每一点自洽关联。\n2. 其主要优势是允许几何与材料非线性，并借助单一各向异性参数统一描述取向分布、泊松比与纤维致密化，发现单轴拉伸下有序度与致密化落在近乎普适的关联曲线上。\n3. 该框架为定量预测细胞收缩驱动的长程基质重塑以及屈曲控制变形代数衰减与指数依赖提供了可检验的连续介质途径。", "summary_source": "deepseek", "authors": [{"name": "Ehud Haimov"}, {"name": "Yoni Koren"}, {"name": "Ayelet Lesman"}, {"name": "Jonathan Selinger"}, {"name": "Yair Shokef"}], "featured_authors": [{"name": "Ehud Haimov"}, {"name": "Yoni Koren"}, {"name": "Ayelet Lesman"}, {"name": "Jonathan Selinger"}, {"name": "Yair Shokef"}], "author_count": 5}, {"id": "2608.25132", "category": "cond-mat", "title": "The Effects of Inter-Valley Coupling of Dirac Fermions near Four Dimensions", "abstract": "We analyze the criticality of an Ising Gross-Neveu-Yukawa (GNY) theory of $N_\\psi$ Dirac fermion valleys with intra- and inter-valley interactions, using a renormalization-group analysis in $4-\\epsilon$ space-time dimensions to one-loop order. The conventional GNY fixed point of decoupled valleys is unstable against inter-valley fluctuations which are naturally present if the symmetry breaking is driven by short-ranged interactions. At the new fixed point, the critical exponents differ from the conventional GNY universality. Most importantly, Lorentz invariance is broken due to interference effects resulting from the relative rotation between valley coordinate frames. In the limit of large $N_\\psi$ the critical fixed point with finite inter-valley coupling remains stable but Lorentz invariance is asymptotically restored.", "url": "https://arxiv.org/abs/2608.25132", "type": "理论", "summary": "1. 在4−ε维空间对含谷内与谷间相互作用的Ising Gross-Neveu-Yukawa理论做单圈重整化群分析，研究N_ψ个狄拉克费米子谷的临界性。\n2. 其核心在于揭示常规解耦谷GNY不动点对短程相互作用引起的谷间涨落不稳定，新不动点临界指数不同，且谷坐标架相对旋转的干涉使洛伦兹对称性破缺。\n3. 该结果表明大N_ψ极限下有限谷间耦合的不动点稳定而洛伦兹不变性渐近恢复，为量子临界现象与相关场论及数值研究提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "S. Thiagarajan"}, {"name": "F. Krüger"}], "featured_authors": [{"name": "S. Thiagarajan"}, {"name": "F. Krüger"}], "author_count": 2}, {"id": "2608.25141", "category": "cond-mat", "title": "Thermalization packets and optimal ice cubes", "abstract": "Relaxation toward equilibrium is usually accelerated by modifying the environment or by cooling a system further from equilibrium. Here we introduce a distinct strategy: thermalization packets, auxiliary systems prepared in advance and later coupled to a target system to accelerate its relaxation toward a prescribed thermal state. Thus, thermalization packets trade preparation effort for reduced waiting time. When the objective is cooling, we colloquially refer to such packets as ice cubes. Unlike ordinary coolants, thermalization packets are characterized not only by their temperature or heat capacity, but also by their microscopic preparation. We define perfect and optimal packets by their ability to suppress the slowest relaxation mode of the coupled dynamics: perfect packets eliminate it entirely, while optimal packets minimize its amplitude. We show that, under generic conditions, perfect packets exist among thermal preparations near equilibrium. Surprisingly, for asymptotic relaxation, the optimum among thermal preparations is generally not the coldest packet: cooling the packet beyond the slow-mode-cancelling optimum restores a nonzero slow mode and can therefore slow relaxation, yielding a packet analog of the Mpemba effect. We demonstrate the concept in exactly solvable Metropolis dynamics, a minimal two-qubit model, and a boundary-coupled interacting Ising-spin system. We also extend the framework to packets optimized for finite readout times. Finally, we show that the perfect-packet contour can connect the trivial bath-equilibrium point to a nontrivial strong Mpemba or strong inverse-Mpemba point.", "url": "https://arxiv.org/abs/2608.25141", "type": "理论+数值", "summary": "1. 提出热化包策略：预先制备辅助系统并在后续耦合至目标系统，加速其向指定热态弛豫；冷却情景下称该辅助体为冰块。\n2. 核心是以抑制最慢弛豫模定义完美与最优热化包：完美包完全消除该模，最优包最小化其振幅；近平衡热制备存在完美包，且渐近最优通常不是最冷包，过度冷却会恢复慢模而减速弛豫，呈Mpemba式反转。\n3. 框架在Metropolis动力学、两比特与边界耦合Ising模型中得到验证并可延伸至有限读出时间；完美包轮廓可连接平庸浴平衡点与强Mpemba或逆Mpemba点，为设计预调控辅助热化方案提供新思路。", "summary_source": "deepseek", "authors": [{"name": "Israel Klich"}, {"name": "Marija Vucelja"}], "featured_authors": [{"name": "Israel Klich"}, {"name": "Marija Vucelja"}], "author_count": 2}, {"id": "2608.25209", "category": "cond-mat", "title": "Origin of High-Temperature Antiferromagnetic Order in a van der Waals Material", "abstract": "While Van der Waals (vdW) itinerant antiferromagnets with high Neel temperatures (TN) are highly desirable for spintronics, they remain relatively scarce. Here, we unravel the physical origin of the unusually high TN (= 250 K) in the newly identified vdW compound (Fe0.65Co0.35)4GeTe2. The substitution of Co in Fe4GeTe2 induces layer-selective Fe-Co ordering and stabilizes a robust antiferromagnetic (AFM) state primarily driven by Co moments. The AFM order is further strengthened by enhanced electronic correlations of quasi-localized Co 3d-states at the Fermi level, giving rise to an itinerant-localized duality of the 3d electrons. This interplay generates strong magnetic correlations well above TN and stabilizes low-temperature spin canting with a possible nontrivial Berry curvature. Our results establish (Fe0.65Co0.35)4GeTe2 as a rare material bridging fundamental magnetic interactions with potential applications in AFM spintronics.", "url": "https://arxiv.org/abs/2608.25209", "type": "理论", "summary": "1. 该工作揭示了新发现的范德瓦尔斯化合物(Fe0.65Co0.35)4GeTe2中高达250开尔文奈尔温度的微观起源。\n2. 其核心在于Co取代引发层选择性Fe-Co有序，由Co磁矩主导稳定反铁磁序，费米能级附近准局域Co 3d态的增强关联使电子呈现巡游-局域二象性，并在低温倾斜自旋中产生非平庸贝里曲率。\n3. 该结果确立了这一同时具备强磁关联与层状可剥离特性的材料，为反铁磁自旋电子学及高温磁性机理研究提供了少见平台。", "summary_source": "deepseek", "authors": [{"name": "Rabindra Basnet"}, {"name": "Hari Paudyal"}, {"name": "Gicela Saucedo Salas"}, {"name": "Nicholas P. Butch"}, {"name": "Durga Paudya"}, {"name": "Ramesh C. Budhani"}], "featured_authors": [{"name": "Rabindra Basnet"}, {"name": "Hari Paudyal"}, {"name": "Gicela Saucedo Salas"}, {"name": "Nicholas P. Butch"}, {"name": "Durga Paudya"}, {"name": "Ramesh C. Budhani"}], "author_count": 6}, {"id": "2608.25224", "category": "cond-mat", "title": "Dynamical splitting and a nodal Bose liquid in 2d chiral XYZ model", "abstract": "We study a class of Hamiltonians with a structure that we call \"dynamical splitting\": the Hamiltonian terms can be divided into two sets acting on the same degrees of freedom such that every term in one set commutes with every term in the other, although terms within either set do not all commute. This structure yields an algebraic duality to effective degrees of freedom on which the two parts of the Hamiltonian act disjointly, enabling exact diagonalization on lattices with approximately twice as many spins as usually accessible. We exploit it in the \"chiral XYZ model\", a geometrically frustrated spin-$1/2$ model on the triangular lattice which was previously introduced as a special limit of a Majorana-Hubbard model. This model also possesses anticommuting noncontractible line symmetries, which enforce an exact, topology-dependent degeneracy between locally indistinguishable states. We first study a $\\mathbb{Z}_N$ clock generalization and find, at large $N$, a gapless ground state with three subsystem-symmetry-protected nodal lines. Exploiting dynamical splitting and the subsystem symmetries, we carry out exact diagonalization of the $N=2$ model on lattices up to $9\\times9$ spins. The many-body gap and bipartite entanglement provide strong evidence for a gapless state consistent with the large-$N$ nodal structure: the entanglement scales as $L\\log L$ and exhibits $1+1$-dimensional CFT-like chord scaling on cylinders. Finally, we study instabilities and proximate phases. In particular, we find evidence that a subsystem-symmetry-preserving deformation drives a finite coupling transition to a gapped phase with $\\mathbb Z_2 \\times \\mathbb Z_2$ topological order.", "url": "https://arxiv.org/abs/2608.25224", "type": "理论+数值", "summary": "1. 该工作引入“动力学劈裂”哈密顿量结构，并据此对三角晶格手征XYZ模型进行精确对角化，研究其基态性质。\n2. 其卖点在于利用交叉对易却组内不对易带来的代数对偶，结合子系对称性将系统尺寸推进至9×9自旋，发现具有三条受子系对称性保护节线的无能隙玻色液体，且纠缠呈L log L标度和柱面上类CFT弦标度。\n3. 这一方法可作为受阻量子磁体精确求解的通用工具，且子系对称性保持的形变在有限耦合处驱动进入Z2×Z2拓扑有序相，为相关模型与实验平台提供了可检验的相变预言。", "summary_source": "deepseek", "authors": [{"name": "Tarun Grover"}], "featured_authors": [{"name": "Tarun Grover"}], "author_count": 1}, {"id": "2608.25242", "category": "cond-mat", "title": "Dynamical and conformational behavior of a polymer in a crowded solution", "abstract": "We investigate the structure and dynamics of a polymer in a fluid containing mobile spherical colloidal crowders of radius $R$. We compare and contrast the behavior with Langevin dynamics (LD) and lattice--Boltzmann molecular dynamics (LBMD), the latter incorporating long-range hydrodynamic interactions. Both the colloid size relative to the monomer radius $r$ and the volume fraction $\\phi$ are varied to determine how crowding modifies polymer behavior. Increasing volume fraction induces polymer compaction, with the mechanism strongly dependent on the size ratio $R/r$. Small colloids primarily modify the short-wavelength polymer conformation, causing self-avoiding-walk-like behavior to persist to shorter length scales, whereas large colloids reduce the effective long-wavelength Flory exponent, indicating degraded solvent quality consistent with a confinement-blob picture. Polymer diffusion exhibits distinct behavior in LD and LBMD. In LD, diffusion decreases rapidly and depends strongly on $R/r$; a phenomenological scaling involving $\\ln(1+R/r)$ captures this size dependence, and additional scaling with $R_g$ reduces scatter, indicating polymer-scale correlations induced by crowding. In contrast, LBMD diffusion follows an effective-medium-like exponential dependence on concentration, governed by hydrodynamic coupling. Rouse-mode analysis identifies three regimes: scaling breakdown at low volume fraction, Zimm-like behavior at intermediate density in both LD and LB, and at high density hydrodynamic screening in LB with confinement-dominated dynamics in LD.", "url": "https://arxiv.org/abs/2608.25242", "type": "理论+数值", "summary": "1. 该工作通过模拟研究含移动球形胶体拥挤剂的高分子溶液，系统比较朗之万动力学与纳入长程流体力学相互作用的格子玻尔兹曼分子动力学，考察尺寸比和体积分数对构象与动力学的影响。\n2. 其核心在于揭示拥挤机制：小胶体使自避走行为延伸至更短尺度，大胶体降低长波Flory指数并符合限制团簇图像；扩散分别表现为对ln(1+R/r)的标度关系与有效介质式指数衰减，且出现Zimm、流体力学屏蔽等三区行为。\n3. 这为理解胞内拥挤如何调控高分子输运与折叠提供了定量模拟框架，并对发展区分流体力学效应及拥挤剂尺寸的有效理论模型具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Setarehalsadat Changizrezaei"}, {"name": "Colin Denniston"}], "featured_authors": [{"name": "Setarehalsadat Changizrezaei"}, {"name": "Colin Denniston"}], "author_count": 2}, {"id": "2608.25257", "category": "cond-mat", "title": "Signatures of a ferro-Josephson effect in twisted graphene", "abstract": "When a spin-polarized current is driven across a magnetic domain wall, the resulting spin-transfer torque could, beyond a critical threshold, set the wall's moments into precession. This precession would modulate the Berry curvature experienced by electrons traversing the wall, producing an electromotive force that is topological in nature, proportional to the precession frequency, mapping precisely onto the DC Josephson effect and leading to the name ferro-Josephson effect. We report signatures consistent with this effect in a twisted graphene van der Waals heterostructure, where spin and valley textures are linked by exchange, Hund's coupling, and spin-orbit interactions. Tuned to fillings where the isospin degeneracy is spontaneously broken, the samples develop a sharp peak in the longitudinal resistance within a fraction of a millitesla of $B_\\parallel=0$---a peak that disappears as the current is reduced toward zero. In differential resistance the feature resolves into sharp resonances that disperse with $B_\\parallel$ on microtesla and picoampere scales. We argue that these arise from the current-driven precession of spin-domain-wall moments, in competition with the in-plane anisotropy set by a minuscule applied field, and that they establish nonlinear transport as a sensitive probe of isospin domain-wall dynamics at energy scales far below $k_BT$.", "url": "https://arxiv.org/abs/2608.25257", "type": "理论", "summary": "1. 该工作在扭转石墨烯范德华异质结中观测到与铁磁约瑟夫森效应一致的输运特征，源于自旋极化电流驱动磁畴壁进动。\n2. 其要点是纵向电阻在 B∥=0 附近出现亚毫特斯拉尖锐峰，微分电阻呈微特斯拉与皮安尺度的色散共振，反映畴壁进动与极弱面内各向异性的竞争。\n3. 这使非线性输运成为探测远低于热能标的自旋-谷畴壁动力学的灵敏探针，并为类似拓扑自旋电子系统提供新途径。", "summary_source": "deepseek", "authors": [{"name": "Ruiheng Su"}, {"name": "Zhenxiang Gao"}, {"name": "Christopher Coleman"}, {"name": "Manabendra Kuiri"}, {"name": "Dacen Waters"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Matthew Yankowitz"}, {"name": "Nemin Wei"}, {"name": "Chunli Huang"}, {"name": "Allan H. MacDonald"}, {"name": "Joshua Folk"}], "featured_authors": [{"name": "Ruiheng Su"}, {"name": "Zhenxiang Gao"}, {"name": "Christopher Coleman"}, {"name": "Chunli Huang"}, {"name": "Allan H. MacDonald"}, {"name": "Joshua Folk"}], "author_count": 12}, {"id": "2608.25263", "category": "cond-mat", "title": "Metastable magnetic domains and the anomalous $B_\\parallel=0$ resistance peak in twisted double bilayer graphene", "abstract": "In graphene moirés, valley polarization gives rise to orbital magnetism, manifested as an anomalous Hall effect and resulting in Barkhausen jumps in longitudinal resistance when changing domain configurations modify quasiparticle scattering. Beyond a simple picture of polarized domains, however, spin and valley textures within and between the domains are less well understood, as is the effect of these textures on transport. In the valley-polarized quarter-metal state of twisted double bilayer graphene, a sharp and metastable peak in longitudinal resistance often appears at zero in-plane magnetic field, whose microscopic origin has yet to be identified. Here, we show that this peak depends on the configuration of domains of orbital magnetism, which is itself set by the gate-voltage trajectory used to enter the ordered state and by the magnetic field --- particularly the in-plane component --- present during that trajectory. The sensitivity of the effect to in-plane magnetic field components points to spin, linked to valley polarization through spin-orbit coupling, as the key degree of freedom in both the domain formation and the resistance peak.", "url": "https://arxiv.org/abs/2608.25263", "type": "理论", "summary": "1. 该工作针对扭转双层石墨烯中谷极化四分之一金属态在零平行磁场下出现的尖锐亚稳电阻峰，结合输运测量与畴构型分析，系统地研究了其微观起源。\n2. 其核心发现是该电阻峰由轨道磁性的亚稳磁畴构型决定，而该构型又由进入有序态时的栅压轨迹及磁场（尤其面内分量）历史决定，表明与谷极化通过自旋轨道耦合关联的自旋是畴形成与电阻峰的关键自由度。\n3. 这一结果将畴织构、自旋轨道耦合与宏观输运直接关联，为理解莫尔体系中磁畴动力学及设计自旋-轨道调控器件提供了重要依据。", "summary_source": "deepseek", "authors": [{"name": "Zhenxiang Gao"}, {"name": "Christopher Coleman"}, {"name": "Silvia Folk"}, {"name": "Ruiheng Su"}, {"name": "Manabendra Kuiri"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Nemin Wei"}, {"name": "Chunli Huang"}, {"name": "Joshua Folk"}], "featured_authors": [{"name": "Zhenxiang Gao"}, {"name": "Christopher Coleman"}, {"name": "Silvia Folk"}, {"name": "Nemin Wei"}, {"name": "Chunli Huang"}, {"name": "Joshua Folk"}], "author_count": 10}, {"id": "2608.25265", "category": "cond-mat", "title": "Electric excitation of spin resonance in altermagnetic and antiferromagnetic conductors", "abstract": "We predict electric-dipole spin resonance (EDSR) in altermagnetic conductors: in a magnetic field ${\\mathbf H}_\\perp$, perpendicular to the magnetization axis, an AC electric field will induce a \\textit{spin} resonance peak above the lower threshold frequency $\\omega_- = 2H_\\perp$. In sufficiently clean samples, this peak shall be clearly visible on the background of ohmic absorption. EDSR can thus serve as a diagnostic of altermagnetism in conducting materials and as a means to distinguish it from higher-symmetry antiferromagnetic order.", "url": "https://arxiv.org/abs/2608.25265", "type": "理论", "summary": "1. 该工作预测铝磁导体中可实现电偶极自旋共振，外加垂直磁场下交流电场即可激发自旋共振峰。\n2. 其物理要点是共振频率下阈值为2H⊥，且清洁样品中该峰可在欧姆吸收背景上清晰分辨。\n3. 这为探测导电材料中的铝磁有序、并区别于高对称反铁磁序提供了电学诊断手段。", "summary_source": "deepseek", "authors": [{"name": "R. Ramazashvili"}, {"name": "V. Shablenko"}, {"name": "Ya. B. Bazaliy"}], "featured_authors": [{"name": "R. Ramazashvili"}, {"name": "V. Shablenko"}, {"name": "Ya. B. Bazaliy"}], "author_count": 3}, {"id": "2608.25270", "category": "cond-mat", "title": "High-throughput Discovery of Magnetic Rare Earth Transition Metal Alloys", "abstract": "We present an accelerated materials discovery framework that combines diffusion-based crystal structure generation with hierarchical screening to identify new rare-earth--transition-metal magnets simultaneously achieving high magnetization and thermodynamic stability. Using this workflow, we systematically explored over 3000 binary (R-T) and ternary (R-T-T$'$) compositions spanning R~$\\in \\{\\text{Y, Sm}\\}$, T~$\\in \\{\\text{Fe, Co, Ni}\\}$, and T$' \\in \\{\\text{Ti, V, Cr, Mn, Cu, Zn}\\}$, and filtered approximately 240{,}000 generated crystal structures through machine-learning interatomic potential prescreening and spin-polarized density functional theory validation. We identify 300+ low-energy magnetic candidates within 0.1~eV/atom above the convex hull at the DFT level, including 5 thermodynamically stable phases. The highest saturation magnetization reaches ${\\sim}1.8$~T in Fe-rich binary and ternary phases (SmFe$_{12}$, YFe$_{12}$, YFe$_{18}$Ti and Sm$_2$Fe$_{16}$Mn). Symmetry analysis reveals that the majority of ternary candidates are subgroup derivatives of known binary prototypes through Wyckoff site splitting that accommodates T$'$ substitution. Site-resolved magnetic moment analysis further shows that Mn aligns ferromagnetically with the Fe sublattice with minimal magnetization loss, whereas Cr couples antiferromagnetically, providing systematic guidance for dopant selection. These findings demonstrate a generalizable strategy for targeted magnetic materials discovery and suggest that extending generative searches to larger unit cells ($>$20 atoms) with higher Fe fractions is a promising route toward stable phases with saturation magnetization exceeding 1.8~T.", "url": "https://arxiv.org/abs/2608.25270", "type": "理论+数值", "summary": "1. 该工作提出一个将扩散模型晶体结构生成与分级筛选相结合的高通量框架，用于发现同时具备高饱和磁化强度和热力学稳定性的稀土-过渡金属磁性合金。\n2. 其主要技术特点是对约24万个生成结构进行机器学习原子间势预筛与自旋极化DFT验证，得到300余个低能候选相和5个稳定相，并借助对称性和位点分辨磁矩分析揭示Mn铁磁耦合、Cr反铁磁耦合及Wyckoff分裂机制。\n3. 这一可推广策略为掺杂元素选择和磁体设计提供系统依据，扩展至更大晶胞(>20原子)和高Fe含量有望实现饱和磁化超过1.8T的稳定新相。", "summary_source": "deepseek", "authors": [{"name": "Shuo Tao"}, {"name": "Osman Goni Ridwan"}, {"name": "Liqin Ke"}, {"name": "Qiang Zhu"}], "featured_authors": [{"name": "Shuo Tao"}, {"name": "Osman Goni Ridwan"}, {"name": "Liqin Ke"}, {"name": "Qiang Zhu"}], "author_count": 4}, {"id": "2608.25314", "category": "cond-mat", "title": "Beyond linear stability: Heterogeneity-induced fingering of crack fronts", "abstract": "We investigate the stability of elastic interfaces beyond the linear regime by considering penny-shaped crack fronts propagating through toughness heterogeneities. Using fracture mechanics simulations, we drive crack fronts through arrays of obstacles with tunable toughness contrast. At low contrast, the crack front stiffness remains finite and stabilizes front perturbations. Above a critical threshold, however, the stiffness vanishes and the front destabilizes into long fingers that evolve into daughter cracks propagating between obstacles while the original crack remains pinned. Near threshold, the crack front response displays the characteristic square-root scaling behavior of classical saddle-node bifurcations. Yet, our analysis reveals a fundamentally different mechanism: the stable energy-minimizing crack-front configuration disappears without colliding with an unstable counterpart. Instead, the instability originates from a global loss of Griffith-compatible equilibria governed by the nonlocal interactions along the crack front. Beyond fracture mechanics, these findings point toward a broader class of collective global bifurcations in nonlocal elastic interfaces and may help rationalize the brittle-to-quasibrittle transition in heterogeneous solids.", "url": "https://arxiv.org/abs/2608.25314", "type": "理论+数值", "summary": "1. 该工作通过断裂力学模拟，研究了含韧性非均匀障碍物阵列中硬币形裂纹前沿在超越线性区间的稳定性。\n2. 其核心发现在于韧性衬度超过临界值时，前沿因Griffith相容平衡的全局消失而失稳成指状裂纹，而非与不稳定解碰撞；近阈值响应呈平方根标度。\n3. 这为理解非局域弹性界面的集体全局分岔提供了范例，并可能为异质固体中脆性向准脆性转变的机制提供启示。", "summary_source": "deepseek", "authors": [{"name": "Manish Vasoya"}, {"name": "Laurent Ponson"}, {"name": "Veronique Lazarus"}], "featured_authors": [{"name": "Manish Vasoya"}, {"name": "Laurent Ponson"}, {"name": "Veronique Lazarus"}], "author_count": 3}, {"id": "2608.25324", "category": "cond-mat", "title": "Multiple pattern formation in quorum sensing of density enhanced motility", "abstract": "Using Langevin dynamics simulations, I investigate nonequilibrium systems of particles following a density-enhanced motility (DEM) rule: particles are passive below a critical local density and active above it. This mechanism represents an inverse of the conventional quorum-sensing rule. I explore specifically quorums much larger than particle size and at two levels of activity. Above critical values of the density, quorum size, and activity, the system undergoes phase separation into low- and high-energy regions. The passive particles organize into distinct spatial patterns, including holes, stripes, and labyrinthine structures, while the active particles form a gas. I characterize the resulting steady states and identify the qualitative mechanisms governing the selection of different morphological regimes. I further discuss the relevance of these results to biological systems governed by analogous quorum-sensing mechanisms and to biological systems exhibiting related forms of spatial organization. Finally, I present directions for future investigation.", "url": "https://arxiv.org/abs/2608.25324", "type": "理论+数值", "summary": "1. 该工作利用朗之万动力学模拟，系统研究了遵循密度增强运动性（DEM）规则的粒子体系，即粒子在局部密度低于临界值时被动、高于临界值时活跃。\n2. 核心结果表明，当密度、感应尺寸与活性超过临界值后，体系发生低能与高能区域间的相分离；被动粒子自组织为孔洞、条纹与迷宫状结构，活性粒子则形成气态，并揭示了控制不同形态区选择的定性机制。\n3. 该发现对受类似群体感应机制支配的生物系统及相关空间组织形态具有直接参考意义，并为后续关于形态选择与生物应用的模拟和实验研究提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Itay Azizi"}], "featured_authors": [{"name": "Itay Azizi"}], "author_count": 1}, {"id": "2608.25352", "category": "cond-mat", "title": "Quantum geometric signatures of Link-Unlink transitions and nonlinear Hall response in Hopf-link semimetals", "abstract": "Quantum geometry, comprising of quantum metric and Berry curvature, plays a significant role in the electronic transport properties of solids. In this work, we theoretically investigate the quantum geometric properties of a Hopf-link semimetal, a distinct topological class that is charecterized by a nodal link-unlink transition. We compute the interband optical conductivity of the Hopf link, which effectively distinguishes between linked and trivial phases. While recent studies establish quantum metric dipole-mediated scattering-free nonlinear Hall effect, this effect becomes even more fascinating in systems where the Berry-curvature-dipole contribution to nonlinear Hall conductivity vanishes. Owing to the underlying $PT$ symmetry of the Hopf-link semimetal, the Berry curvature and its corresponding contribution to the nonlinear Hall effect are entirely suppressed. Consequently, by introducing an appropriate perturbation, a finite nonlinear Hall conductivity emerges solely due to the quantum metric in the Hopf semimetal. Notably, this purely intrinsic, symmetry-driven nonlinear response remains entirely unmixed with extrinsic components.", "url": "https://arxiv.org/abs/2608.25352", "type": "理论", "summary": "1. 该工作理论研究了Hopf-link半金属的量子几何性质，通过计算带间光导率区分了节点链环与解链平凡相的特征响应。\n2. 其核心在于体系PT对称性完全压制Berry曲率及其非线性霍尔贡献，引入适当微扰后可由量子度量单独产生无外禀成分混合的纯粹内禀非线性霍尔电导。\n3. 这为在对称性禁戒Berry曲率响应的拓扑半金属中，利用量子度量作为普适探针探测节点几何转变及输运行为提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Kamalesh Bera"}, {"name": "Arijit Saha"}, {"name": "Debashree Chowdhury"}], "featured_authors": [{"name": "Kamalesh Bera"}, {"name": "Arijit Saha"}, {"name": "Debashree Chowdhury"}], "author_count": 3}, {"id": "2608.25411", "category": "cond-mat", "title": "Non-Hermitian topological Euler insulators", "abstract": "Topological Euler insulators emerge in multiband systems with real Bloch Hamiltonians and wavefunctions. Their fragile topologies are characterized by the Euler class of degenerate bands and protected by the $PT$ or $C_2T$ symmetry in two dimensions, which go beyond the tenfold $K$-theory classification of topological matter. In this work, we extend the conception of topological Euler insulators to non-Hermitian systems and propose a theoretical framework to unlock their nontrivial Euler topology. Focusing on two-dimensional, three-band non-Hermitian lattice models with symmetric Hamiltonians, we formulate a comprehensive description of their topological Euler bands, entanglement spectrum and bulk-boundary correspondence. Three typical models of non-Hermitian Euler insulators are constructed and investigated explicitly to illustrate our theory. Unique topological phase transitions and anomalous edge-band overlaps with non-Hermitian origins are further identified. Our study establishes the presence of topological Euler bands in non-Hermitian systems and unveils their intriguing physical characteristics, thereby broadening the existing territory of topological matter in non-Hermitian open systems.", "url": "https://arxiv.org/abs/2608.25411", "type": "理论", "summary": "1. 该工作将拓扑欧拉绝缘体推广至非厄米系统，针对满足对称性的二维三带非厄米晶格模型，提出刻画非平凡欧拉拓扑的理论框架。\n2. 其技术要点在于用实布洛赫哈密顿量的退化带欧拉类表征非厄米拓扑，并系统分析缠结谱与体边对应，揭示非厄米诱导的独特拓扑相变和反常边带重叠。\n3. 该研究确立非厄米开放系统中拓扑欧拉能带的存在，拓宽了超越十重分类的拓扑物态版图，为相关边界输运与调控实验提供指引。", "summary_source": "deepseek", "authors": [{"name": "Longwen Zhou"}], "featured_authors": [{"name": "Longwen Zhou"}], "author_count": 1}, {"id": "2608.25482", "category": "cond-mat", "title": "Parity-controlled electron-hole interference in exciton-phonon coupling", "abstract": "We demonstrate that exciton-phonon coupling in polar semiconductors is governed by a parity-controlled interference selection rule. By performing an exact multipole expansion of the excitonic form factor and validating it against numerical integration of hydrogenic envelope functions, we show that the long-range infrared divergence of the Fröhlich interaction is exactly canceled for elastic scattering between excitonic states of the same parity. The ground-state exciton is thereby protected from long-wavelength polar phonons by destructive electron-hole interference. In contrast, transitions between states of opposite parity exhibit constructive interference, preserving a finite, robust coupling to macroscopic polar fields independent of band-structure details. Mass asymmetry between the electron and hole activates higher-order multipole terms in the elastic channel but leaves the constructive inelastic channel essentially unaffected. The selection rule is dimensionally invariant, applying to bulk and two-dimensional systems alike, and naturally explains the anomalously weak phonon dressing observed in halide perovskites as well as the strong phonon sidebands in transition-metal dichalcogenides. Our framework provides a universal, analytically exact criterion for exciton-phonon coupling strength, offering a design principle for engineering excitonic materials with tailored phonon interactions.", "url": "https://arxiv.org/abs/2608.25482", "type": "理论+数值", "summary": "1. 该工作对激子形状因子进行精确多极展开，并同数值氢包络计算对照，确立了极性半导体激子-声子耦合的宇称控制干涉选择定则。\n2. 其核心在于：同宇称弹性散射中电子-空穴相消干涉精确消除长波弗洛赫红外发散，异宇称跃迁则相长干涉且不依赖能带细节；电子-空穴质量不对称只激活高阶多极项，不改变非弹性通道。\n3. 该定则在三维与二维体系同样成立，统一解释卤化物钙钛矿弱声子修饰及过渡金属硫族化合物强声子边带，为按宇称工程化激子-声子耦合给出解析设计判据。", "summary_source": "deepseek", "authors": [{"name": "Michael O. Atambo"}], "featured_authors": [{"name": "Michael O. Atambo"}], "author_count": 1}, {"id": "2608.25541", "category": "cond-mat", "title": "Defect states in three-dimensional diamond photonic band gap crystals", "abstract": "We perform a theoretical study of defect states within the photonic band gap of three-dimensional diamond crystals composed of point scatterers and doped with substitutional defects. The defects introduce localized states inside the photonic band gap, whose existence conditions and eigenfrequencies are expressed in terms of the on-site Green's function of the ideal defect-free crystal. Off-site Green's functions are also calculated as function of distance and are shown to vanish within approximately two unit cells. Finite-size effects are analyzed by comparing the results obtained in the infinite-crystal limit with numerical simulations based on the coupled-dipole method. The latter not only reproduce the eigenfrequencies of the defect states within the band gap, but also provide their lifetimes originating from the finite crystal size. The lifetimes of the defect states increase exponentially with crystal size, becoming very long for large crystals. In addition to defect states in the three-dimensional photonic band gap, the defects also give rise to strongly detuned states outside the gap, which decouple from the spectrum of the ideal defect-free crystal.", "url": "https://arxiv.org/abs/2608.25541", "type": "数值", "summary": "1. 该工作对由点散射体构成并掺入替位缺陷的三维金刚石光子晶体中的缺陷态进行了理论研究。\n2. 其核心在于用理想晶体的格点格林函数给出缺陷态存在条件与本征频率，并证明带隙外强失谐态与理想谱退耦。\n3. 这为设计有限尺寸三维光子带隙器件及调控缺陷局域光场与寿命提供了定量理论依据。", "summary_source": "deepseek", "authors": [{"name": "Julia Rocha"}, {"name": "Bart A. van Tiggelen"}, {"name": "Ad Lagendijk"}, {"name": "Willem L. Vos"}, {"name": "Sergey E. Skipetrov"}], "featured_authors": [{"name": "Julia Rocha"}, {"name": "Bart A. van Tiggelen"}, {"name": "Ad Lagendijk"}, {"name": "Willem L. Vos"}, {"name": "Sergey E. Skipetrov"}], "author_count": 5}, {"id": "2608.25584", "category": "cond-mat", "title": "Exchange splitting as a descriptor for giant anomalous Hall and Nernst effects in ferromagnets", "abstract": "The anomalous Hall effect (AHE) and anomalous Nernst effect (ANE), which describe transverse electrical and thermoelectric responses in magnetic materials, respectively, are promising for spintronic and energy-harvesting applications. Here, we employ high-throughput first-principles calculations to investigate 2251 chemically substituted tetragonal $L1_0$ alloys. Among ferromagnets, enhanced responses emerge preferentially in alloys derived from parent compounds with small exchange splitting: no alloy derived from FePt, the archetypal $L1_0$ ferromagnet, reaches the high-response regime, whereas NiPt- and CoIr-derived alloys occupy it in large numbers. Small exchange splitting keeps majority- and minority-spin bands near the Fermi level, giving chemical substitution more opportunity to modify near-Fermi-level band crossings and amplify the Berry curvature. We predict a giant anomalous Hall conductivity of $2809\\,\\mathrm{S\\,cm^{-1}}$ in (Co$_{0.8}$Fe$_{0.2}$)(Ir$_{0.7}$Pt$_{0.3}$) and a giant anomalous Nernst conductivity of $7.72\\,\\mathrm{A\\,m^{-1}\\,K^{-1}}$ in (Ni$_{0.8}$Co$_{0.2}$)(Pt$_{0.7}$Ir$_{0.3}$). Our results identify the exchange splitting of the parent compound as a descriptor for chemical tunability toward giant Berry-curvature-driven transport responses.", "url": "https://arxiv.org/abs/2608.25584", "type": "数值", "summary": "1. 该工作对2251种化学替代四方L1_0合金进行了高通量第一性原理计算，系统搜索巨反常霍尔与能斯特响应。\n2. 其核心发现是母体化合物的交换劈裂可作为描述符：小交换劈裂使自旋向上与向下能带均靠近费米面，增强化学替代对近费米能级能带交叉的调控并放大贝里曲率。\n3. 据此预测出具有巨反常霍尔电导率2809 S/cm及巨反常能斯特电导率7.72 A/m/K的合金，为铁磁体输运材料设计提供了可操作的化学筛选指引。", "summary_source": "deepseek", "authors": [{"name": "Ivan Kurniawan"}, {"name": "Guangzong Xing"}, {"name": "Yoshio Miura"}, {"name": "Keisuke Masuda"}], "featured_authors": [{"name": "Ivan Kurniawan"}, {"name": "Guangzong Xing"}, {"name": "Yoshio Miura"}, {"name": "Keisuke Masuda"}], "author_count": 4}, {"id": "2608.25606", "category": "cond-mat", "title": "Characterizing Full Nonequilibrium Dynamics of Simple Exclusion Processes", "abstract": "The simple exclusion process (SEP) is a paradigmatic model for nonequilibrium transport, yet the rich dynamics of its time-dependent joint distribution over an exponentially large configuration space remain notoriously intractable. Here, we leverage variational autoregressive networks to systematically characterize the nonequilibrium dynamics of symmetric (SSEP), asymmetric (ASEP), and totally asymmetric (TASEP) cases from one to three dimensions. We first validate the approach by reproducing the previous finite-time results for the 1D SSEP and long-time tensor-network results for the 2D SSEP, and then provide richer finite-time dynamics of the SSEP, ASEP, and TASEP in 1D and 2D, and a new finite-time analysis in 3D. Specifically, in 1D, we reveal that finite-time dynamical-activity maps directly correspond to the classical three-phase TASEP steady-state organization, and, in the long-time limit, boundary and bulk effects separately govern the dynamical susceptibility during the crossover from diffusive to ballistic transport. In 2D, we establish a mean-field directional-density criterion, supported by our neural-network calculations, and show that long-time boundary and bulk effects mirror their 1D counterparts. In 3D, we uncover new finite-time scaling relations for the active-inactive phase transition of the SSEP, and reveal a broadly consistent scaling exponent of the phase-transition point versus system size, implying that the phase-transition point is asymptotically controlled by the characteristic length scale ($s_c\\sim L^{-2}$) regardless of dimension. This work thus establishes a unified framework for characterizing the nonequilibrium dynamics of representative transport systems.", "url": "https://arxiv.org/abs/2608.25606", "type": "理论+数值", "summary": "1. 该工作利用变分自回归网络刻画了1至3维简单排斥过程（SSEP、ASEP、TASEP）的完整非平衡动力学。\n2. 其卖点在于揭示有限时间动力学活动图对应TASEP三相组织，并给出2维方向密度判据与3维相变点标度律。\n3. 这为多体非平衡输运的神经网络统一模拟及维数无关标度行为研究提供了新框架。", "summary_source": "deepseek", "authors": [{"name": "Zhimao Liu"}, {"name": "Jing Liu"}, {"name": "Pan Zhang"}, {"name": "Ying Tang"}], "featured_authors": [{"name": "Zhimao Liu"}, {"name": "Jing Liu"}, {"name": "Pan Zhang"}, {"name": "Ying Tang"}], "author_count": 4}, {"id": "2608.25616", "category": "cond-mat", "title": "Nearly Isotropic Quantum-Critical Transport in Single-Crystal CeNiC2", "abstract": "Pressure-induced superconductivity and $T$-linear resistivity have been reported in polycrystalline CeNiC$_2$, but orientational averaging has left the directional character of the critical scattering unresolved. We report pressure-dependent resistivity of high-quality single crystals for current along each crystallographic axis. These crystals have substantially lower residual resistivity and a slightly higher maximum onset $T_c$ than the polycrystalline sample, placing superconductivity in a cleaner transport regime. Near $P_c \\approx 9.5-10$ GPa, the normal-state resistivity becomes nearly $T$-linear along every axis, the fitted residual resistivity is strongly enhanced, and superconductivity forms a narrow dome. For $I \\parallel b$, the $T$-linear normal state remains nearly unchanged in magnetic fields up to 9 T applied along $a$ and $c$; the upper critical field is large and only moderately anisotropic. The common evolution along all three axes establishes a nearly isotropic quantum-critical transport regime, inconsistent with a simple low-dimensional spin-fluctuation picture and implicates valence fluctuations as the leading source of critical scattering associated with the superconducting dome.", "url": "https://arxiv.org/abs/2608.25616", "type": "理论+数值", "summary": "1. 该工作对高纯CeNiC2单晶沿各晶轴测量压力依赖电阻率，在较洁净输运区间获得略高最大超导转变温度，以厘清多晶中平均化的量子临界散射方向性。\n2. 核心结果显示，在约9.5–10吉帕临界压力附近，三个晶轴均出现近T线性正常态电阻率且拟合残余电阻率显著增强，超导形成窄穹顶；b轴线性电阻率在沿a和c方向高达9特斯拉的磁场下基本不变，上临界场较大且仅中等各向异性。\n3. 这一近各向同性量子临界输运行为排除简单低维自旋涨落图像，暗示价态涨落是主导临界散射并关联超导穹顶的机制，为后续理论和高压磁场实验提供明确方向。", "summary_source": "deepseek", "authors": [{"name": "Hanming Ma"}, {"name": "Jun Gouchi"}, {"name": "Dilip Bhoi"}, {"name": "Toru Shigeoka"}, {"name": "Bosen Wang"}, {"name": "J.-G. Cheng"}, {"name": "Yoshiya Uwatoko"}], "featured_authors": [{"name": "Hanming Ma"}, {"name": "Jun Gouchi"}, {"name": "Dilip Bhoi"}, {"name": "Bosen Wang"}, {"name": "J.-G. Cheng"}, {"name": "Yoshiya Uwatoko"}], "author_count": 7}, {"id": "2608.25628", "category": "cond-mat", "title": "Magnetic-configuration design for reliable Heisenberg exchange parameters", "abstract": "The determination of magnetic exchange interactions is essential for the quantitative description and predictive modeling of magnetic materials. In this work, we present a neighbor-shell-based screening method for selecting magnetic configurations suitable for extracting Heisenberg exchange parameters beyond nearest-neighbor from density functional theory (DFT) calculations. Using only the structure, the proposed approach identifies the linear independence of neighbor-shell contributions before any first-principles calculations instead of relying on trial-and-error generation of magnetic configurations. We apply the proposed approach to two representative classes of magnetic configurations: random spin states and spin spirals, and validate its predictions against direct DFT fitting for Fe and MnF$_2$. We show that only parameters obtained when all relevant neighbor-shell contributions are linearly independent remain transferable to other magnetic configurations. The proposed method provides practical guidance for selecting magnetic configurations for reliable exchange-parameter extraction and may also benefit other neighbor-shell-based models.", "url": "https://arxiv.org/abs/2608.25628", "type": "理论+数值", "summary": "1. 该工作提出一种基于近邻壳层线性无关性判据的磁构型筛选方法，用于从DFT计算中可靠提取超越最近邻的海森堡交换参数。\n2. 其技术核心在于仅依据晶体结构即可预先判定各近邻壳层贡献是否线性独立，从而避免试错式磁构型生成与重复拟合。\n3. 该方法在Fe和MnF₂上验证了参数可迁移性，可为随机自旋态、自旋螺旋及其他近邻壳层模型提供实用选构型指导。", "summary_source": "deepseek", "authors": [{"name": "Ben Li"}, {"name": "Stephan von Malottki"}, {"name": "Gian-Marco Rignanese"}], "featured_authors": [{"name": "Ben Li"}, {"name": "Stephan von Malottki"}, {"name": "Gian-Marco Rignanese"}], "author_count": 3}, {"id": "2608.25629", "category": "cond-mat", "title": "Closed-form hard-sphere thermodynamics under nanoscale confinement: from equations of state to unmixing forces", "abstract": "Equations of state accurately describe hard-sphere thermodynamics but are generally considered to fail under nanoscale confinement. We show that this failure is geometric rather than thermodynamic: a closed-form, parameter-free mapping from apparent to effective packing fraction restores the accuracy of the Carnahan-Starling equation of state and, with it, the entire analytical thermodynamic framework, including free energies, wall pressures, chemical potentials, and the large-cavity surface response. Applied to overlapping anchored hard-sphere droplets, a geometry inherent to biomolecular force generation, it yields unmixing free energies and full distance-dependent force profiles in quantitative agreement with simulations from the dilute regime to above the bulk freezing transition.", "url": "https://arxiv.org/abs/2608.25629", "type": "理论+数值", "summary": "1. 该工作提出在纳米限域下恢复硬球热力学描述精度的闭合解析方案。\n2. 其核心是将表观堆积分数映射为有效堆积分数的无参数几何变换，使Carnahan-Starling状态方程及自由能、壁压、化学势等框架继续适用。\n3. 该方案定量给出重叠锚定硬球液滴的去混自由能与全程作用力曲线，可为生物分子力产生的统计热力学建模提供直接工具。", "summary_source": "deepseek", "authors": [{"name": "Jose M. G. Vilar"}, {"name": "Leonor Saiz"}], "featured_authors": [{"name": "Jose M. G. Vilar"}, {"name": "Leonor Saiz"}], "author_count": 2}, {"id": "2608.25638", "category": "cond-mat", "title": "Exact chemo--thermal Metropolis Brownian engine: chemical leverage, temperature-neutral stall, power optimization, and multicyclic dissipation", "abstract": "We develop an exactly solvable chemo--thermal extension of the three-state Metropolis Brownian heat engine. The particle moves through the periodic energy sequence $0\\to E\\to 2E\\to0$, performs mechanical work against a load $f$ on every forward step, interacts with two cold links and one hot link, and consumes one fuel molecule of free-energy drop $\\muu$ on the hot transition. Local detailed balance gives an exact cycle affinity \\begin{equation*} \\mathcal A=E\\left(\\Tc^{-1}-\\Th^{-1}\\right)+\\muu/\\Th-f\\left(2/\\Tc+1/\\Th\\right), \\end{equation*} and the full stationary probabilities and current are obtained without linear-response, weak-driving, or high-barrier approximations. Several results follow. First, the exact stall force is \\begin{equation*} \\fs=\\frac{E(\\Th-\\Tc)+\\Tc\\muu}{2\\Th+\\Tc}. \\end{equation*} Second, there is a temperature-neutral chemical compensation point $\\muu_*=3E/2$ at which $\\fs=E/2$ for every $\\Th>\\Tc$ and the hot and cold heats both vanish at reversible stall. Third, in both Metropolis branches the stationary current is a strictly increasing function of $\\muu$ at fixed mechanical parameters, but approac", "url": "https://arxiv.org/abs/2608.25638", "type": "理论+数值", "summary": "1. 该工作构建了化学-热耦合的精确可解Metropolis布朗引擎模型，研究燃料自由能降与热梯度共同驱动的三态周期做功过程。\n2. 其核心在于由局域细致平衡导出精确环亲和势与失速力，发现温度无关化学补偿点μ*=3E/2，并严格证实固定力学参数下电流随μ单调递增。\n3. 这为多循环耗散、化学-热协同输运及纳米尺度热机优化提供了可解析检验的基准模型与构造性启发。", "summary_source": "deepseek", "authors": [{"name": "Mesfin Taye"}], "featured_authors": [{"name": "Mesfin Taye"}], "author_count": 1}, {"id": "2608.25726", "category": "cond-mat", "title": "Observation of thermal Hall effect in diamond", "abstract": "Numerous insulators, including non-magnetic ones, have been unexpectedly found to display a finite thermal Hall signal, which has stimulated debate about its origin. Here, we report on a study of the thermal Hall effect in two diamond single crystals. The transverse thermal conductivity (kappa_xy) was found to peak at a temperature close to that at which the longitudinal thermal conductivity (kappa_xx) reaches its maximum. The measured kappa_xy, with an amplitude of 340 W/(m K) at B = 10 T, is the largest ever observed, while the kappa_xy/kappa_xx ratio follows the phenomenological trend identified in other insulators. Our observation implies the existence of an intrinsic thermal Hall effect in a generic phonon gas. We argue that the rough amplitude of both the thermal Hall angle and the thermal Hall resistivity can be accounted for by simple arguments invoking fundamental constants and quantum-mechanical constraints on solid state cohesion.", "url": "https://arxiv.org/abs/2608.25726", "type": "理论", "summary": "1. 该工作在金刚石单晶中观测到热霍尔效应，10 T下横向热导率达340 W/(m K)，为迄今报道的最大值。\n2. 其核心在于kappa_xy在纵向热导率峰值温度附近达峰，且kappa_xy/kappa_xx遵循其他绝缘体的唯象趋势，表明声子气体具有内禀热霍尔效应。\n3. 作者以基本常数和固态凝聚的量子力学约束对热霍尔角及电阻率幅值给出简单估算，为理解非磁性绝缘体中的声子热霍尔机理提供了普遍启示。", "summary_source": "deepseek", "authors": [{"name": "Marcin Matusiak"}, {"name": "Andrzej Ptok"}, {"name": "Maria Szlawska"}, {"name": "Kamran Behnia"}], "featured_authors": [{"name": "Marcin Matusiak"}, {"name": "Andrzej Ptok"}, {"name": "Maria Szlawska"}, {"name": "Kamran Behnia"}], "author_count": 4}, {"id": "2608.25778", "category": "cond-mat", "title": "Quasi two dimensional magnetic structure of the triclinic double perovskite Ca$_2$CuWO$_6$", "abstract": "We present the antiferromagnetic ground state of the triclinic double perovskite Ca$_2$CuWO$_6$solved by neutron powder diffraction, and analyze it in direct comparison with tetragonal Sr$_2$CuWO$_6$. Below $T_\\mathrm{N} \\simeq 32$ K, the magnetic Bragg reflections of Ca$_2$CuWO$_6$ are indexed by the commensurate propagation vector $\\mathbf{k}=(\\tfrac{1}{2},\\tfrac{1}{2},0)$ in its native $P\\bar{1}$ cell. Rietveld refinement yields a collinear structure with equal-magnitude, antiparallel moments on the crystallographically inequivalent Cu1 and Cu2 sites and an ordered moment of $0.66(3)~\\mu_{\\mathrm B}$ per Cu at 1.5 K. A direct comparison with Sr$_2$CuWO$_6$ is obscured by different crystallographic settings and orientations of the cooperative Jahn-Teller elongation axes. Hence, we introduce a common crystallographic supercell through which effects of symmetry lowering from tetragonal to triclinic in the double perovskite are explored: Apparently different magnetic propagation vectors map onto the same supercell wave vector, revealing a common magnetic structure stabilized by tungsten-mediated, second-neighbor interactions. Mean field calculations further show that tetragonal symmetry preserves the degeneracy of four magnetic $\\mathbf{k}$-domains in Sr$_2$CuWO$_6$, whereas the triclinic splitting of symmetry-related exchange pathways in Ca$_2$CuWO$_6$, most strongly within the Cu2 network, selects a single $\\mathbf{k}$-domain. These results establish the magnetic ground state of Ca$_2$CuWO$_6$ and show how symmetry breaking selects a given ordered state without changing the underlying magnetic motif of the Sr analogue.", "url": "https://arxiv.org/abs/2608.25778", "type": "理论+数值", "summary": "1. 该工作利用中子粉末衍射解出三斜双钙钛矿Ca₂CuWO₆的反铁磁基态，并与四方相Sr₂CuWO₆直接对比分析。\n2. 其关键是通过公共晶体学超胞将表观不同的传播矢量映射至同一波矢，揭示钨介导次近邻相互作用下的共同磁结构，并证明三斜对称性劈裂Cu₂网络交换路径从而选择单一k域。\n3. 这确立了该材料的磁基态，显示对称性降低可在不改变Sr类似物磁基元的情况下选定特定有序态，为关联双钙钛矿磁性与晶格对称性研究提供了明确参考。", "summary_source": "deepseek", "authors": [{"name": "Bangye Qin"}, {"name": "Dmitry D. Khalyavin"}, {"name": "Xuan Liang"}, {"name": "Kazunari Yamaura"}, {"name": "Alexei A. Belik"}, {"name": "Roger D. Johnson"}], "featured_authors": [{"name": "Bangye Qin"}, {"name": "Dmitry D. Khalyavin"}, {"name": "Xuan Liang"}, {"name": "Kazunari Yamaura"}, {"name": "Alexei A. Belik"}, {"name": "Roger D. Johnson"}], "author_count": 6}, {"id": "2608.25806", "category": "cond-mat", "title": "Semi-localized ground state in a 1D system with long-range hopping", "abstract": "We study the localization of a quantum particle in a one-dimensional disordered system with long-range hopping amplitudes $t(r)\\propto r^{-a}$. In contrast to the standard one-dimensional Anderson model ($a\\to\\infty$), in which all states are localized and the localization length is minimal at the band edge, the long-range model with $1<a<3/2$ exhibits a disorder-driven transition at the band edge, while high-energy states remain localized at arbitrary disorder strength. We investigate this transition for the ground state in momentum space. In the weak-disorder regime, we derive perturbative expressions for the characteristic functions and moments of the momentum-space wave function, as well as for its fractal dimensions. Our results demonstrate that the ground state exhibits $\\it semilocalization$ rather than conventional localization, thereby extending the class of models displaying the unusual $\\it semifractality$ of wave functions.", "url": "https://arxiv.org/abs/2608.25806", "type": "理论", "summary": "1. 该论文研究一维具有长程跳跃振幅t(r)∝r^{-a}的无序体系中量子粒子的局域化，重点关注动量空间基态并刻画其无序驱动转变。\n2. 其核心在于揭示跳跃指数1<a<3/2时带边存在无序驱动的局域化转变，而高能态在任意无序下仍局域；同时导出弱无序下动量波函数特征函数、矩及分形维数的微扰表达式。\n3. 结果表明基态呈半局域化而非传统局域化，扩展了半分形波函数这一非寻常现象所属的模型类别，为后续无序长程跳跃体系的理论与数值研究提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Murod S. Bahovadinov"}, {"name": "Faridun N. Jalolov"}, {"name": "Vladimir E. Kravtsov"}, {"name": "Boris L. Altshuler"}, {"name": "Georgy V. Shlyapnikov"}], "featured_authors": [{"name": "Murod S. Bahovadinov"}, {"name": "Faridun N. Jalolov"}, {"name": "Vladimir E. Kravtsov"}, {"name": "Boris L. Altshuler"}, {"name": "Georgy V. Shlyapnikov"}], "author_count": 5}, {"id": "2608.25816", "category": "cond-mat", "title": "Fate of the non-Abelian Moore-Read manifold under the non-Hermitian skin effect", "abstract": "We study a non-Abelian Moore-Read fractional Chern insulator under a translation-preserving, nonreciprocal deformation that generates the non-Hermitian skin effect under open boundaries. The model combines the imaginary-gauge Hatano-Nelson deformation with a kagome-lattice three-body interaction designed to stabilize Moore-Read order at $\\nu=1/2$. Our primary diagnostic is the biorthogonal $(2,4)$-admissible particle-entanglement counting of the sixfold Moore-Read manifold, the standard Moore-Read fingerprint. Across three sizes ($N=16,20,24$), the counting locks to the clean references 1308, 3965, and 9282 over finite nonreciprocity windows through $\\gamma\\le0.55$, $0.65$, and $0.74$, respectively, with positive reference-rank entanglement gaps. Within every reported window the count is unchanged by the spectral readings tested; at $N=16$ it is also unchanged across three reduced density operators, with all 15 combinations returning 1308. The sixfold pattern for even $N_f$ and the adiabatically tracked Ising-odd doublet remain separated over the tested range $\\gamma\\le0.6$. Beyond a geometry-dependent threshold the instantaneous-lowest-six reference-rank gap drops sharply and its counting destabilizes. At $N=24$ a sector-0 branch pair becomes complex conjugate over a narrow interval inside the delocking bracket; both continuations through the interval are delocked at the tested PES points $\\gamma=0.76$, $0.77$, and $0.80$. A same-lattice Abelian $\\nu=1/3$ Laughlin realization retains its counting to $\\gamma=1.0$, so its counting is the more robust. On the torus the eigenstates remain extended; under open boundaries the right and left states skin-localize at opposite edges while the biorthogonal particle-entanglement spectrum is invariant under the imaginary-gauge similarity, so the torus and the open cylinder probe the same deformation under periodic and open boundaries.", "url": "https://arxiv.org/abs/2608.25816", "type": "理论", "summary": "1. 该工作数值研究平移不变非互易虚规范变形下，kagome格点ν=1/2 Moore-Read分数量子霍尔态的六重非阿贝尔流形在非厄米趋肤效应中的演化。\n2. 技术卖点是双正交(2,4)容许粒子纠缠计数：在N=16、20、24，γ≤0.55、0.65、0.74的有限窗口中计数分别锁定到无扰动参考值1308、3965、9282，且参考秩纠缠隙为正，计数对谱读取方式和约化密度算符均稳健。\n3. 同格点阿贝尔ν=1/3 Laughlin计数至γ=1.0仍稳健，而环面本征态保持扩展、双正交纠缠谱在虚规范相似变换下不变，说明Moore-Read指纹先失稳，为非厄米开放边界下的拓扑纠缠判据提供了对比标尺。", "summary_source": "deepseek", "authors": [{"name": "Jiaxuan Guo"}, {"name": "Simin Nie"}, {"name": "Xiting Zhang"}, {"name": "Fritz B. Prinz"}], "featured_authors": [{"name": "Jiaxuan Guo"}, {"name": "Simin Nie"}, {"name": "Xiting Zhang"}, {"name": "Fritz B. Prinz"}], "author_count": 4}, {"id": "2608.25875", "category": "cond-mat", "title": "Topological phases of a generalised tripartite Haldane model", "abstract": "We present a generalised tripartite Haldane model with a complex nearest neighbour hopping parameter. The total magnetic flux through the primitive unit cell, which consists of three hexagonal unit cells is zero, and thus the model has the structure of a loop-current model. We calculate topological phase diagrams of the Chern numbers as a function of the phases of the nearest and next-nearest neighbour hopping parameters for a fixed ratio of the magnitude of the hopping parameters. We show that, unlike the Haldane model, the topological phase diagram of this model is very complex, but some aspects can still be dealt with analytically. Furthermore, the Chern numbers of the topological phases are as large as $7$ in absolute value. The analysis is supported by explicit expressions for energy bands crossing at high symmetry points in the Brillouin zone, which show as linear phase boundaries in the phase diagram. We show that such lines explain many features in the topological phase diagrams. Finally, we analyse a few representative examples of the nature of level crossings away from high symmetry and their evolution with model parameters.", "url": "https://arxiv.org/abs/2608.25875", "type": "理论+数值", "summary": "1. 本文提出一个具有复最近邻跃迁参数的三分蜂巢广义Haldane模型，其原胞由三个六角单元组成且总磁通为零，呈环流模型结构，并计算了作为跃迁相位函数的Chern数拓扑相图。\n2. 与Haldane模型不同，该模型相图复杂但部分可解析处理，Chern数绝对值可达7；布里渊区高对称点处能带交叉的显式表达式对应线性相边界，解释了许多相图特征。\n3. 这为理解高Chern数拓扑相的能带机制提供了可解析的模型框架，并对搜索具有大陈数的晶格拓扑态及后续实验具有启发。", "summary_source": "deepseek", "authors": [{"name": "Ahmed Al-kharusi"}, {"name": "Alessandro Principi"}, {"name": "Niels R. Walet"}], "featured_authors": [{"name": "Ahmed Al-kharusi"}, {"name": "Alessandro Principi"}, {"name": "Niels R. Walet"}], "author_count": 3}, {"id": "2608.25882", "category": "cond-mat", "title": "Residual semi-crystalline particles released during enzymatic degradation of plastics", "abstract": "Enzymatic recycling of plastics is limited by the presence of semi-crystalline spherulites that are recalcitrant to enzymatic depolymerization. Depending on the quality of the waste stream and its treatment history, a large volume fraction
