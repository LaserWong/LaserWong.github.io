  <title>arXiv 2026-09-14 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2609.11984", "category": "cond-mat", "title": "Diagonal Pair Coulomb Density Matrix on a Sphere: a numerical study", "abstract": "We tabulate, on the diagonal, the $n$th power of the primitive approximation for the pair Coulomb density matrix on a sphere, with up to $n=5$, and we discuss its behavior at particles contact as $n$ grows. Our results show that even on a curved surface quantum statistical physics is fundamentally different from its classical counterpart. If in the latter one needs to artificially introduce a regularization of the divergent attractive Coulomb potential preventing particles contact, for example with a hard core, in the former this is not necessary.", "url": "https://arxiv.org/abs/2609.11984", "type": "数值", "summary": "1. 该工作对球面上两体库仑密度矩阵在原始近似下的对角元进行数值制表，计算其幂次直至五次，并分析粒子接触行为随幂次增大的变化。\n2. 其物理卖点在于揭示弯曲表面上的量子统计行为与经典统计存在根本差异：经典理论需借助硬核等人工正则化来消除吸引库仑势在接触点的发散，而量子情形则无需此类正则化。\n3. 这一结果意味着球面等弯曲流形上的量子多体计算可直接采用未正则化的库仑相互作用，并为比较量子与经典统计在几何约束下的差异提供了数值依据。", "summary_source": "deepseek", "authors": [{"name": "Riccardo Fantoni"}], "featured_authors": [{"name": "Riccardo Fantoni"}], "author_count": 1}, {"id": "2609.11988", "category": "cond-mat", "title": "Disordered hyperuniform modulated phases and the cosmic web from one free energy", "abstract": "Disordered hyperuniformity spans twenty-five orders of magnitude, from the microscopic world of soft and condensed matter to the distribution of matter in the universe. We introduce a free-energy functional with no adjustable coupling, a phase-field-crystal ordering term and a Newtonian tail, and show that its two kinetic limits generate two of these structures. Under conserved overdamped dynamics it arrests in a bicontinuous labyrinth of the kind found in confined fluids, block copolymers, active matter and vegetation patterns, which is a class III disordered hyperuniform state; under inertial dynamics in an expanding background it generates a cosmic web whose tidal skeleton matches that of gravity alone to within $0.03$ in every morphological class. In both limits the suppressed long-wavelength fluctuations are inherited from the initial condition rather than made by the dynamics: the large-scale exponent of the arrested state equals the primordial one, and gravity rescales the infrared spectrum by the linear growth factor to better than one per cent over a factor $1363$ of growth. The two sectors are continuously connected, and their distance is measurable: once the ordering modulation saturates, its mean-field back-reaction leaves the medium with a residual pressure proportional to $\\lambda_0^2$ that suppresses the growth of the largest scales by a smooth factor and vanishes in the cold-matter limit $\\lambda_0\\to0$.", "url": "https://arxiv.org/abs/2609.11988", "type": "理论", "summary": "1. 该工作提出一个无自由可调耦合的自由能泛函（相场晶体序项加牛顿尾项），并证明其两种动力学极限分别生成双连续迷宫态与宇宙网。\n2. 卖点在于长波抑制继承自初始条件：过阻尼极限给出III类无序超均匀迷宫相，膨胀背景的潮汐骨架与纯引力偏差小于0.03，红外谱重标度误差小于1%。\n3. 两部门连续相连且距离可测：序参量饱和后的平均场反作用留下正比于λ0²的剩余压强，平滑压低最大尺度增长并在冷物质极限λ0→0时消失。", "summary_source": "deepseek", "authors": [{"name": "Fausto Martelli"}], "featured_authors": [{"name": "Fausto Martelli"}], "author_count": 1}, {"id": "2609.12041", "category": "cond-mat", "title": "Catastrophes, Optical Multistabilities, and Chiral Photocurrent Hysteresis in Driven Weyl Semimetals", "abstract": "The unique band topology of Weyl semimetals provides them with a diverse array of strong photovoltaic response phenomena. Here we explore how plasma screening affects these phenomena. We find that the screening field is highly nonlinear, can contain topological contributions, and can amplify the photoresponse, with the self-consistent response exhibiting the hallmarks of bistability, including hysteresis and catastrophes. The bistability emerges from a crossover from linear to saturated polarization as a function of the field amplitude, because carriers in a Weyl cone have bounded group speed $v_F$. When time-reversal symmetry is broken, tilted Weyl nodes add a Berry-curvature contribution to the in-plane current, making the nonlinear screening response helicity selective.", "url": "https://arxiv.org/abs/2609.12041", "type": "理论", "summary": "1. 该工作研究等离子体屏蔽如何影响驱动Weyl半金属的光伏响应，通过自洽求解发现屏蔽场高度非线性、可含拓扑贡献并放大光响应，导致光学双稳、滞回与突变。\n2. 其关键机制是Weyl锥中载流子群速度受v_F上限约束，使极化随场幅由线性过渡至饱和，从而产生自洽双稳；当时间反演对称破缺时，倾斜Weyl节点的Berry曲率项还使面内电流和屏蔽响应具有螺旋性选择。\n3. 这为Weyl半金属中手性光电流滞回、光学多稳开关及相关非线性拓扑光电子学提供了可检验的自洽图像，并提示需在光伏测量中计入动态屏蔽与拓扑电流反馈。", "summary_source": "deepseek", "authors": [{"name": "Christopher Yang"}, {"name": "Gil Refael"}, {"name": "Frederik Nathan"}], "featured_authors": [{"name": "Christopher Yang"}, {"name": "Gil Refael"}, {"name": "Frederik Nathan"}], "author_count": 3}, {"id": "2609.12042", "category": "cond-mat", "title": "Remarks on invertible phases with non-onsite symmetry", "abstract": "We study invertible phases protected by non-onsite symmetries carrying nontrivial lattice anomaly indices. While lattice anomalies are usually viewed as obstructions to symmetric short-range-entangled (SRE) states, we show that anomalous lattice symmetries can nevertheless admit invertible phases that are not SRE, and can moreover shift the set of symmetry-compatible invertible phases. In particular, we consider a fermionic $\\mathbb Z_4^F$ symmetry in (2+1) dimensions. For an onsite $\\mathbb Z_4^F$ symmetry, symmetric invertible phases have integer chiral central charge $c_-\\in\\mathbb Z$, whereas a non-onsite symmetry with nontrivial lattice anomaly index obstructs all such phases despite having trivial continuum 't Hooft anomaly. We resolve this by constructing an exact exponentially quasi-local $\\mathbb Z_4^F$ symmetry of a $p+ip$ superconductor with $c_-=1/2$. We compute its lattice anomaly, and find that the symmetry indeed forbids $c_-\\in \\mathbb{Z}$ invertible states. The allowed invertible phases are consequently shifted to $c_-\\in\\mathbb Z+1/2$. By gauging the fermion parity of the $p+ip$ superconductor, one obtains an Ising topological order enriched by a $\\mathbb Z_4$ symmetry. We describe the corresponding symmetry structure in terms of a fusion 2-category. We further show that the $p+ip$ state admits an enlarged non-onsite $U(1)^f$ symmetry, providing an analogue of fractional quantum Hall response in an invertible phase. This non-onsite $U(1)^f$ symmetry again forbids Chern insulators carrying $c_-\\in\\mathbb{Z}$, while being compatible with invertible states with $c_-\\in\\mathbb{Z}+1/2$. This result motivates a systematic study of new classes of invertible phases and spin liquids enriched by non-onsite symmetries.", "url": "https://arxiv.org/abs/2609.12042", "type": "理论", "summary": "1. 该工作研究携带非平凡格点反常指数的非在位对称性所保护的可逆相，并以(2+1)维费米子Z4^F对称性为主要例子。\n2. 其核心卖点是构造p+ip超导体的指数准局域Z4^F对称性，计算格点反常并证明允许的可逆相从整数c_-移至c_-∈Z+1/2。\n3. 该结果启发系统研究非在位对称性富化的新型可逆相与自旋液体，并暗示可逆相可承载分数量子霍尔型响应。", "summary_source": "deepseek", "authors": [{"name": "Ryohei Kobayashi"}, {"name": "Kansei Inamura"}, {"name": "Ken Shiozaki"}], "featured_authors": [{"name": "Ryohei Kobayashi"}, {"name": "Kansei Inamura"}, {"name": "Ken Shiozaki"}], "author_count": 3}, {"id": "2609.12050", "category": "cond-mat", "title": "Staying positive: bounds for non-Gaussian noise in Schwinger-Keldysh effective field theory", "abstract": "Modern effective field theories of dissipative hydrodynamics, built on the Schwinger-Keldysh (SK) formalism, include thermal noise that is not Gaussian. The resultant higher-order noise vertices are constrained by symmetries, but otherwise treated as free parameters. We show explicitly that symmetry constraints alone do not guarantee these vertices yield a genuine probability distribution. Requiring a probability interpretation yields sharp bounds between cumulants that are invisible to the symmetry analysis. The bounds are optimal: their boundaries are attained by explicit positive distributions, and constructive completions are provided for both negative- and positive-kurtosis noise data. This gives closed-form nonlinear response and an exact sampling algorithm, whose Monte Carlo implementation reproduces the exact cumulants and nonlinear fluctuation-dissipation relations. Confronted with microscopic results, the framework places a sharp lower bound on the time step required for a positive stochastic completion of a quartic model of the Brownian particle used in the literature, while holographically computed $SU(2)$ noise vertices pass a nontrivial continuum fourth-order positivity test.", "url": "https://arxiv.org/abs/2609.12050", "type": "理论+数值", "summary": "1. 该工作在Schwinger-Keldysh有效场论中考察非高斯热噪声顶点的概率正性，证明仅对称性约束不足以确保高阶累积量来自真实概率分布。\n2. 其卖点是概率解释给出对称性分析不可见的累积量尖锐界限，界限最优且由显式正分布与正负峰度噪声数据的构造性完成达到，并提供闭式非线性响应和精确采样算法。\n3. 该框架对布朗粒子四阶模型的正随机完成给出时间步尖锐下界，并让全息计算的SU(2)噪声顶点通过连续第四阶正性检验，为SK噪声参数提供可检验的正性判据。", "summary_source": "deepseek", "authors": [{"name": "Andrea Amoretti"}, {"name": "Daniel K. Brattan"}], "featured_authors": [{"name": "Andrea Amoretti"}, {"name": "Daniel K. Brattan"}], "author_count": 2}, {"id": "2609.12063", "category": "cond-mat", "title": "Breakdown of Multipole Expansion in Emergent Electromagnetism", "abstract": "We find a striking departure from simple electrostatics in a family of two-dimensional lattice models whose effective description takes the form of an emergent electromagnetism: a high-order multipolar charge configuration can induce an electric field characteristic of a \\textit{lower-}order multipole. Studying the archetypical hardcore dimer and U(1) spin-1/2 link models, we trace this to a breakdown of the superposition principle: for dense charge configurations, there can be a nonlinear suppression, or even enhancement, of the far field compared to the linear expectation. Our work establishes that microscopic lattice-scale constraints in models for emergent electromagnetism can change the far-field behaviour to differ from often utilized long-wavelength descriptions in standard effective continuum models.", "url": "https://arxiv.org/abs/2609.12063", "type": "理论", "summary": "1. 该工作在一类二维格点模型中研究涌现电磁学，发现高阶多极电荷组态可产生具低阶多极特征的电场，从而破坏常规多极展开。\n2. 作者在硬核二聚体与U(1)自旋-1/2链模型中追踪其机制，将其归因于叠加原理失效：稠密电荷组态下远场相对线性预期可被非线性抑制甚至增强。\n3. 该结果确立微观格点尺度约束能改变涌现电磁学的远场行为，表明常用长波长连续有效描述并非普遍适用，并提示后续模型与实验需考虑此类微观约束。", "summary_source": "deepseek", "authors": [{"name": "Tom Ben-Ami"}, {"name": "Markus Heyl"}, {"name": "Roderich Moessner"}], "featured_authors": [{"name": "Tom Ben-Ami"}, {"name": "Markus Heyl"}, {"name": "Roderich Moessner"}], "author_count": 3}, {"id": "2609.12071", "category": "cond-mat", "title": "Unusual phase coexistence regime across the ferroelectric - paraelectric transition", "abstract": "A PbTiO3 epitaxial thin film grown on a DyScO3 substrate was studied by x-ray diffraction in the temperature range of 20-500 degrees Celsius. It is found that the ferroelectric to paraelectric phase transition proceeds through a peculiar transitional coexistence state extending between 402 degrees Celsius and 414 degrees Celsius. Within this temperature interval, at a temperature of 405 degrees Celsius, a domain structure transition occurs, at which the three-domain c/a1/a2 polytwin phase transforms into an ordinary c/a2 twinned phase. It is proposed that the coexistence of two independent twinned phases with the paraelectric phase is enabled by vertical strain gradients in the film.", "url": "https://arxiv.org/abs/2609.12071", "type": "理论", "summary": "1. 该工作用变温X射线衍射研究了DyScO3衬底上PbTiO3外延薄膜在20–500 °C的铁电—顺电相变行为。\n2. 其关键发现是相变并非直接完成，而是在402–414 °C形成过渡共存区；405 °C处c/a1/a2三畴多孪晶转为普通c/a2孪晶，并归因于垂直应变梯度使两个独立孪晶相与顺电相共存。\n3. 这为通过应变梯度调控外延氧化物相变路径与畴结构、设计多相共存态提供了启示。", "summary_source": "deepseek", "authors": [{"name": "M. Kopecký"}, {"name": "J. Kub"}, {"name": "E. de Prado"}, {"name": "J. Hlinka"}], "featured_authors": [{"name": "M. Kopecký"}, {"name": "J. Kub"}, {"name": "E. de Prado"}, {"name": "J. Hlinka"}], "author_count": 4}, {"id": "2609.12079", "category": "cond-mat", "title": "Hierarchical Prototype Emergence in Modern Hopfield Models", "abstract": "Hierarchical correlations are a universal feature of any realistic model of data, and the question of how associative memory models may learn these correlations and generalize beyond them to construct new sensible images is an important step towards understanding more complex modern architectures such as diffusion models. We consider a hierarchical model for memories which are sampled and stored in a dense Hopfield network with polynomial activation. We analytically derive conditions for each level of this hierarchy to be locally stable - that is they are local energy minima. We use prototype reconstruction as a minimal model of generalization and we find that it takes only a quasi-polynomial amount of information to generalize beyond particular memories and even particular groups in the hierarchy. We observe a qualitatively analogous phase diagram in the number of memories, sharpness of the activation function (polynomial degree) for data from Fashion-MNIST.", "url": "https://arxiv.org/abs/2609.12079", "type": "理论+数值", "summary": "1. 该工作在现代Hopfield框架中构造分层记忆模型，将记忆采样并存入多项式激活的稠密网络，并解析推导各层级作为局部能量极小值的稳定性条件。\n2. 其核心卖点是以原型重构作为泛化的最小模型，证明跨越单条记忆乃至同层记忆组仅需准多项式信息量，并在Fashion-MNIST上得到随记忆数和激活锐度（多项式阶数）变化的定性相似相图。\n3. 这为联想记忆学习并外推分层相关性、进而理解扩散模型等复杂架构提供了可解析的最小范式，并提示多项式激活的稠密Hopfield网络可作为分层泛化研究平台。", "summary_source": "deepseek", "authors": [{"name": "Aditya Cowsik"}, {"name": "Adithya Sriram"}], "featured_authors": [{"name": "Aditya Cowsik"}, {"name": "Adithya Sriram"}], "author_count": 2}, {"id": "2609.12160", "category": "cond-mat", "title": "Collective Behavior of Intelligent Active Brownian Particles in the Presence of a Static Obstacle", "abstract": "Using computer simulations, we investigate the collective behavior of two-dimensional active Brownian particles (ABPs) with excluded-volume interactions in the bulk and in the presence of a single static circular obstacle. Perception-mediated interactions are introduced through a vision-based steering mechanism that enables each particle to reorient its propulsion direction according to the instantaneous positions of neighboring particles within a prescribed vision cone. In the bulk, these intelligent active Brownian particles (iABPs) exhibit distinct collective states, including aggregated clusters, worm-like chains, worm-aggregate coexistence, and dilute gas phases. We characterize these states using a shape anisotropy parameter and construct the corresponding phase diagrams. The presence of a static obstacle, which interacts with the particles through purely repulsive forces, qualitatively alters their collective behavior. In contrast to conventional ABPs, whose isotropic accumulation around the obstacle increases with activity, iABPs exhibit the opposite trend, with boundary accumulation decreasing as the activity increases. We further identify empirical scaling relations that describe particle accumulation and cluster formation at the obstacle boundary. Consequently, the relative effective diffusion coefficient of iABPs displays a nonmonotonic dependence on self-propulsion speed, whereas that of conventional ABPs decreases monotonically with increasing activity. In addition, we show that the residence times of iABPs are orders of magnitude shorter than those of conventional ABPs, indicating that perception-mediated interactions can be useful for controlling the organization and transport of active particles in complex environments.", "url": "https://arxiv.org/abs/2609.12160", "type": "理论+数值", "summary": "1. 该工作用计算机模拟研究二维排除体积相互作用的智能主动布朗粒子在体相及单个静止圆形障碍物存在时的集体行为，粒子通过视锥感知近邻位置并重定向推进方向，并构建相应相图。\n2. 卖点在于：与常规主动布朗粒子不同，智能粒子在障碍物边界的积累随活性增强而减少，相对有效扩散系数随自驱动速度呈非单调变化，停留时间缩短数个数量级，并给出边界积累与团簇形成的标度关系。\n3. 这表明感知介导的相互作用可用于调控复杂环境中主动粒子的组织与输运。", "summary_source": "deepseek", "authors": [{"name": "Surya Narayan Sahoo"}, {"name": "Arabinda Bera"}, {"name": "Jiarul Midya"}], "featured_authors": [{"name": "Surya Narayan Sahoo"}, {"name": "Arabinda Bera"}, {"name": "Jiarul Midya"}], "author_count": 3}, {"id": "2609.12166", "category": "cond-mat", "title": "Functionalization-Driven Charge Redistribution Enabling Ultra-High-Capacity V2B MBene Anode for Li/Na ion batteries: A First-Principles study", "abstract": "Amid increasing global demand for clean, sustainable energy, the search for novel electrode materials has emerged as a crucial link to advancing future energy storage technologies. Here, we explored the potential of N-functionalized 2D MBene V2BN2 as anode materials for Li- and Na-ion batteries using first-principles calculations. Phonon dispersion and ab initio molecular dynamics calculations were employed to assess the dynamic and thermal stability of the material. The intrinsic metallic properties of V2BN2 were revealed through electronic band structures and density of states analyses. Importantly, Bader charge analysis demonstrates substantial charge redistribution upon Li/Na adsorption, leading to stronger ion-substrate interactions compared to the pristine counterpart. This redistribution plays a decisive role in enhancing Li/Na ion adsorption and stabilizing ion accommodation. Furthermore, owing to favorable multilayer adsorption of Li and Na ions, V2BN2 exhibited high theoretical specific capacities of 1524 and 762 mAh/g, as well as low open circuit voltages of 0.73 and 0.23 V for Li and Na, respectively. In addition, the energy barriers were calculated to be 0.49 and 0.29 eV for Li- and Na-ion transport, respectively, indicating rapid ion transport and excellent rate capability. These results indicate that V2BN2 holds significant potential as an anode material for next-generation rechargeable ion batteries.", "url": "https://arxiv.org/abs/2609.12166", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算研究N官能化二维MBene V2BN2作为Li/Na离子电池负极的可行性，并用声子谱和从头算分子动力学评估其稳定性。\n2. 其核心卖点是Bader电荷分析揭示Li/Na吸附诱导显著电荷再分布，增强离子-基底相互作用并稳定多层吸附，同时本征金属性、低迁移势垒（Li 0.49 eV、Na 0.29 eV）带来高理论比容量（1524/762 mAh/g）和低开路电压（0.73/0.23 V）。\n3. 这些结果支持V2BN2作为下一代高容量Li/Na离子电池负极候选，并提示N官能化调控电荷分布可用于优化MBene储能性能。", "summary_source": "deepseek", "authors": [{"name": "Shaiokh Bin Abi"}, {"name": "Ahmed Zubair"}], "featured_authors": [{"name": "Shaiokh Bin Abi"}, {"name": "Ahmed Zubair"}], "author_count": 2}, {"id": "2609.12198", "category": "cond-mat", "title": "Pseudo-hybrid density functional ACBN0 for Hubbard $U$ correction in a numeric atom-centered orbital basis", "abstract": "We present a formulation and implementation of the Agapito-Curtarolo-Buongiorno Nardelli (ACBN0) pseudo-hybrid density functional in a numeric atom-centered orbital basis. The method is realized in the all-electron, full-potential electronic-structure package FHI-aims. The implementation uses a Löwdin-orthogonalized projector, which improved the stability of the self-consistent ACBN0 iterations for the tested systems. For a benchmark set of materials including metal oxides and nitrides, ACBN0 with the fully localized limit (FLL) as the double-counting treatment reduces the aggregate band gap errors relative to the Perdew-Burke-Ernzerhof (PBE) and strongly constrained and appropriately normed (SCAN) functionals, reaching an accuracy comparable to the Heyd-Scuseria-Ernzerhof functional (HSE06). For six bulk transition metal oxides calculated with the same numerical settings, an HSE06 iteration is approximately 13-33 times as expensive as the corresponding ACBN0@PBE iteration with Petukhov mixing. The applicability of the localized-basis implementation to low-dimensional systems is demonstrated by calculations of adsorption and the oxygen evolution reaction (OER) overpotential on a $\\beta$-NiOOH(001) surface. On regularized SCAN (rSCAN) relaxed structures, single point ACBN0 based on rSCAN (ACBN0@rSCAN) with the ``tight'' numerical settings reduces the mean absolute deviation of the reaction-step energies from HSE06 and shifts the estimated overpotential toward the HSE06 and Perdew-Burke-Ernzerhof hybrid (PBE0) reference results.", "url": "https://arxiv.org/abs/2609.12198", "type": "理论+数值", "summary": "1. 我们提出了基于数值原子中心轨道的 Agapito-Curtarolo-Buongiorno Nardelli (ACBN0) 伪混合密度泛函的公式和实现。\n2. 通过计算 $\\beta$-NiOOH(001) 表面上的吸附和析氧反应 (OER) 超电势，证明了局部基础实现对低维系统的适用性。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Svetlana A. Artiukova"}, {"name": "Ilia M. Odud"}, {"name": "Sergey V. Levchenko"}], "featured_authors": [{"name": "Svetlana A. Artiukova"}, {"name": "Ilia M. Odud"}, {"name": "Sergey V. Levchenko"}], "author_count": 3}, {"id": "2609.12199", "category": "cond-mat", "title": "Selective coupling of coherent phonons to intertwined charge-orbital and magnetic orders in doped manganites", "abstract": "Strongly correlated materials feature technologically relevant functionalities such as high-temperature superconductivity and colossal magnetoresistance, which emerges from the competition and coexistence of electronic and magnetic phases. Uncovering the microscopic interactions underlying these phenomena remains challenging because spin, orbital, charge, and lattice degrees of freedom are inherently intertwined. Here, by combining time-resolved X-ray diffraction and polarization-resolved ultrafast optical reflectivity in La1/4Pr3/8Ca3/8MnO3, we reveal that coherent phonon modes can selectively track different ordered phases: the in-plane phonon response is predominantly sensitive to charge/orbital order, and the c-axis phonon response is sensitive to magnetic order. Moreover, a ferromagnetic-related hysteresis emerges even when solely probing the charge/orbital-ordered phase, indicating a strong microscopic coupling between the spatially separated charge/orbital-ordered and ferromagnetic-ordered phases. These results demonstrate that coherent phonons provide a direct time-domain route to disentangle intertwined electronic and magnetic dynamics in coupled phases.", "url": "https://arxiv.org/abs/2609.12199", "type": "数值", "summary": "1. 该工作结合时间分辨X射线衍射与偏振分辨超快光学反射率，在La1/4Pr3/8Ca3/8MnO3中研究相干声子与电荷/轨道序及磁序的耦合。\n2. 关键卖点是不同相干声子模式可选择性追踪有序相：面内声子主要敏感于电荷/轨道序，c轴声子主要敏感于磁序；即使仅探测电荷/轨道序，也出现铁磁相关磁滞，表明空间分离的电荷/轨道序与铁磁序之间存在强微观耦合。\n3. 这证明相干声子可提供直接时域路径，以解纠缠耦合相中相互交织的电子与磁动力学，并对多自由度强关联材料研究具有启发。", "summary_source": "deepseek", "authors": [{"name": "X. Liu"}, {"name": "M. Sander"}, {"name": "S.-W. Huang"}, {"name": "S. Zerdane"}, {"name": "A. Caviezel"}, {"name": "M. Rössle"}, {"name": "J. Lu"}, {"name": "D. Babich"}, {"name": "S. Shin"}, {"name": "E. Pomjakushina"}, {"name": "P. Marsik"}, {"name": "L. Wang"}, {"name": "S. W. Cheong"}, {"name": "C. Jia"}, {"name": "P. Beaud"}, {"name": "H.T. Lemke"}, {"name": "U. Staub"}, {"name": "R. Mankowsky"}], "featured_authors": [{"name": "X. Liu"}, {"name": "M. Sander"}, {"name": "S.-W. Huang"}, {"name": "H.T. Lemke"}, {"name": "U. Staub"}, {"name": "R. Mankowsky"}], "author_count": 18}, {"id": "2609.12294", "category": "cond-mat", "title": "Self-organisation in hard-soft granular mixtures", "abstract": "Self-organisation of granular systems is a key determinant of their macroscopic behaviour and has been studied extensively in assemblies of hard particles. We use numerical simulations to test this understanding in mixtures of hard and soft particles, focusing on cells, the smallest irreducible loops of the contact network, as structural descriptors. We show that, while the cell statistics display robust qualitative features under isotropic compaction, they depend on inter-particle friction, $\\mu$, and soft-particle fraction, $\\kappa$. Specifically, (i) the quadron area distributions retain a $\\Gamma$ form, albeit with parameters that vary systematically with $\\mu$ and $\\kappa$. (ii) Predictions of the cell order distribution (COD) by maximising the entropy, without taking mechanical stability into consideration, become increasingly inaccurate at large cell orders. (iii) Irrespective of $\\mu$, the normalised cell stress distributions collapse onto one master Weibull form, whose only shape parameter depends weakly on $\\kappa$. This suggests a quasi-universal form that may deteriorate slightly at very high fractions of soft particles. (iv) Cells align preferentially along the local major principal stress direction, showing the same coordinated stress--structure self-organisation as in hard particles. The relative robustness of cell statistics to the addition of soft particles suggests that hard and hard--soft granular mixtures can be described by one model.", "url": "https://arxiv.org/abs/2609.12294", "type": "理论+数值", "summary": "1. 该工作用数值模拟研究硬-软颗粒混合物中各向同性压实下的自组织，以接触网络最小不可约环（胞元）为结构描述量。\n2. 其卖点在于胞元统计随摩擦系数μ和软颗粒分数κ系统变化，但归一化胞元应力分布塌缩为单一韦布尔主曲线，且胞元沿局部主应力方向择优排列。\n3. 这表明硬颗粒与硬-软混合物或可由同一模型描述，并提示需在高软颗粒分数下检验该准普适应力-结构自组织。", "summary_source": "deepseek", "authors": [{"name": "Haoran Jiang"}, {"name": "Dominik Krengel"}, {"name": "Takashi Matsushima"}, {"name": "Raphael Blumenfeld"}], "featured_authors": [{"name": "Haoran Jiang"}, {"name": "Dominik Krengel"}, {"name": "Takashi Matsushima"}, {"name": "Raphael Blumenfeld"}], "author_count": 4}, {"id": "2609.12351", "category": "cond-mat", "title": "Emergent magnetism, heavy electrons and pressure-induced reentrant superconductivity in the iron substituted 4d transition-metal sulfides", "abstract": "Superconductivity emerging from or in the vicinity of magnetic states is generally considered to be mediated by spin fluctuations and thus lies beyond the scope of conventional electron-phonon coupled BCS framework. Here we report the emergence of novel ferromagnetism in the d-electron rhodium sulfide Rh17S15 superconductor, characterized by an enhanced Sommerfeld coefficient {\\gamma} arising from the flat topological band and many-body correlations. We further demonstrate that the ferromagnetism can be tuned via Fe substitution at the Rh sites, leading to a spin glass ground state induced by the competing ferromagnetic and antiferromagnetic exchange interactions. Fe doping results in a further enhancement of both the {\\gamma} and electron effective masses. At a doping level of x = 0.67 in Rh17-xFexS15, {\\gamma} reaches 312 mJ mol-1K-2, second only to the well-documented d-electron heavy-fermion material LiV2O4. Furthermore, upon applying pressure, superconductivity is first suppressed; under high pressures, however, we observe the reentrant superconductivity in both pristine and Fe-doped samples. Our results not only demonstrate the unusual magnetic states and possible heavy-fermion features in these frustration-free, d-based superconductors, but also suggest that the superconductivity in this system is likely mediated by the intrinsic spin fluctuations and may thus be unconventional.", "url": "https://arxiv.org/abs/2609.12351", "type": "理论", "summary": "1. 该工作以Fe替代Rh位，在4d硫化物Rh17-xFexS15中调控铁磁、自旋玻璃与超导，并加压观测重入超导。\n2. 其核心在于平带拓扑与多体关联增强γ，Fe掺杂增大有效质量，x=0.67时γ达312 mJ mol⁻¹K⁻²，仅次于LiV2O4。\n3. 这暗示该体系超导可能由内禀自旋涨落介导而非常规，并为无阻挫d电子重费米子与压力诱导重入超导提供启发。", "summary_source": "deepseek", "authors": [{"name": "Yalei Huang"}, {"name": "Lu Xin"}, {"name": "Na Zuo"}, {"name": "Bin Li"}, {"name": "Wei Zhou"}, {"name": "Dhanarajagopal Alltrin"}, {"name": "Boning Yu"}, {"name": "Haiyang Yang"}, {"name": "Bin Qian"}, {"name": "Wen-Chin Lin"}, {"name": "Raman Sankar"}, {"name": "Michael Smidman"}, {"name": "Xiangzhuo Xing"}, {"name": "Chunqiang Xu"}, {"name": "Xiaobing Liu"}, {"name": "Jianhui Dai"}, {"name": "Dong Qian"}, {"name": "Shiyan Li"}, {"name": "Xiaofeng Xu"}], "featured_authors": [{"name": "Yalei Huang"}, {"name": "Lu Xin"}, {"name": "Na Zuo"}, {"name": "Dong Qian"}, {"name": "Shiyan Li"}, {"name": "Xiaofeng Xu"}], "author_count": 19}, {"id": "2609.12520", "category": "cond-mat", "title": "Thermodynamic Speed Limits in Isolated Quantum Systems", "abstract": "We derive thermodynamic speed limits for isolated quantum systems undergoing finite-time unitary driving. The key ingredient is a set of generalized second-law inequalities: for the Gibbs entropy and for several thermodynamically motivated observational entropies, the entropy production is bounded from below by a function of the Vu--Saito quantum Wasserstein distance between the initial and final coarse-grained states. These inequalities yield lower bounds on the operation time in terms of the average entropy-production rate. We apply the framework to system--bath coarse-graining, local-energy coarse-graining, and diagonal entropy, and illustrate the resulting bounds with numerical and analytically solvable examples. Our results provide a thermodynamic characterization of finite-time state transformations in isolated quantum systems and clarify how coarse-grained entropy production constrains macroscopic reachability.", "url": "https://arxiv.org/abs/2609.12520", "type": "理论+数值", "summary": "1. 我们推导出经历有限时间酉驱动的孤立量子系统的热力学速度极限。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Rikuya Kobashi"}], "featured_authors": [{"name": "Rikuya Kobashi"}], "author_count": 1}, {"id": "2609.12538", "category": "cond-mat", "title": "Efficient kinetic Monte Carlo simulations with long-range electrostatic interactions", "abstract": "Charge transport in solid-state materials is often governed by charge carrier hopping processes in the presence of long-range electrostatic interactions. Kinetic Monte Carlo (kMC) simulations provide a framework for describing such rare-event dynamics over extended timescales. However, the efficient treatment of long-range interactions remains a major computational challenge, since each particle jump modifies the energy landscape globally and, in principle, requires updating all transition rates after every carrier motion. We present an efficient and generally applicable update process for these transition rates in the presence of long-range electrostatic interactions. To illustrate the method, we study charge diffusion on a simple cubic host lattice under an external electric field. The transport behavior is investigated in high states of charge (SOC), and the influence of temperature, electric field strength, and SOC is examined. Our simulations show strongly suppressed transport at 100\\,\\% SOC (50\\,\\% occupation) caused by a freezing of the charge carriers into a Coulomb superlattice. Slight deviations from this reference in terms of charge carrier concentration lead to a rapid increase in conductivity. A deeper analysis reveals that this behavior can be rationalized as transport of non-interacting defects in the Coulomb superlattice. These results demonstrate the capability of the proposed update procedure to efficiently capture non-equilibrium transport phenomena in interacting charged systems and provide a foundation for simulations of more complex charge diffusion problems.", "url": "https://arxiv.org/abs/2609.12538", "type": "数值", "summary": "1. 该工作提出长程静电相互作用下高效更新跃迁速率的动力学蒙特卡洛方法，并研究简单立方晶格中电场驱动的电荷扩散。\n2. 其卖点在于避免每次跳跃后全局重算所有速率，并揭示100%荷电态下库仑超晶格冻结载流子、微小浓度偏离即令电导骤增。\n3. 该框架能高效捕捉相互作用带电体系的非平衡输运，并为更复杂电荷扩散问题提供模拟基础。", "summary_source": "deepseek", "authors": [{"name": "Roya Ebrahimi Viand"}, {"name": "Bat-Amgalan Bat-Erdene"}, {"name": "Karsten Reuter"}, {"name": "Sebastian Matera"}], "featured_authors": [{"name": "Roya Ebrahimi Viand"}, {"name": "Bat-Amgalan Bat-Erdene"}, {"name": "Karsten Reuter"}, {"name": "Sebastian Matera"}], "author_count": 4}, {"id": "2609.12560", "category": "cond-mat", "title": "Persistence of BKT phase transition in the 2D nonanalytic XY model", "abstract": "We study the two-dimensional XY model with the nonanalytic pair potential $2[(1-\\cos\\delta)/2]^{p}$, whose small-angle law $\\propto|\\delta|^{2p}$ carries a cusp for $p<1$ and a flat bottom for $p>1$, invalidating the harmonic spin-wave expansion. Two questions arise: the nature of the low-temperature ($T$) phase and of the phase transition. A naive energetic argument would predict genuine long-range order and an enhanced transition temperature for $p<1$, and no transition at all for $p>1$. Large-scale Monte Carlo simulations contradict both: for every $p>0$ the \\dengrevxxi{low-$T$ phase} is quasi-long-range ordered, with anomalous dimension $\\eta(T)\\propto T^{1/p}$, and terminates at a Berezinskii--Kosterlitz--Thouless transition. Using a vortex-free noncompact lattice-field description and utilizing a duality transformation, we show that coarse-graining drives the height-difference distribution onto a single Gaussian fixed point, renormalizing the cusp and flatness into a finite harmonic stiffness that restores the spin-wave description and the BKT scenario for all $p>0$.", "url": "https://arxiv.org/abs/2609.12560", "type": "理论+数值", "summary": "1. 该工作用大规模蒙特卡洛与无涡旋非紧致格点场论研究非解析对势 2[(1−cosδ)/2]^p 的二维 XY 模型，考察低温相与相变性质。\n2. 其卖点是用对偶变换证明粗粒化把尖点与平底重整为有限谐振劲度、流向单一高斯不动点，恢复自旋波图像并给出 η(T)∝T^{1/p}。\n3. 这表明所有 p>0 的低温相均为准长程有序并以 BKT 相变终结，微观势的非解析性对普适临界行为并不相关。", "summary_source": "deepseek", "authors": [{"name": "Sihan Hu"}, {"name": "Xianzhi Pan"}, {"name": "Kun Chen"}, {"name": "Yi Jiang"}, {"name": "Youjin Deng"}], "featured_authors": [{"name": "Sihan Hu"}, {"name": "Xianzhi Pan"}, {"name": "Kun Chen"}, {"name": "Yi Jiang"}, {"name": "Youjin Deng"}], "author_count": 5}, {"id": "2609.12570", "category": "cond-mat", "title": "Nonequilibrium Quasiparticle Effects on Domain Wall Dynamics in Superconductors", "abstract": "We study the dynamics of a domain wall (DW) in a type-II superconductor connected to two heat reservoirs. We employ a generalized time-dependent Ginzburg--Landau framework in which the superconducting order parameter and the nonequilibrium quasiparticle distribution are treated as coupled dynamical variables. Within this framework, the effect of the thermal bias is imposed through boundary conditions on the quasiparticle distribution, which are set by the reservoir temperatures. We show, both numerically and within linear response, that the DW moves toward the hotter boundary. From the local momentum-balance relation implied by the model, we identify a viscous force and a force arising from the coupling between the order parameter and the nonequilibrium distribution function. The nonequilibrium distribution separates exactly into a boundary-driven part and a part generated by the motion of the DW itself. The former sets the sign of the DW velocity, whereas the latter renormalizes the relaxation of the order parameter. These results provide a microscopic basis for the phenomenological local-temperature description developed in our previous work.", "url": "https://arxiv.org/abs/2609.12570", "type": "理论+数值", "summary": "1. 该工作以广义含时Ginzburg-Landau框架耦合超导序参量和非平衡准粒子分布，研究双热库下II型超导体畴壁动力学。\n2. 数值与线性响应显示畴壁移向较热边界；动量平衡给出粘滞力及序参量-非平衡分布耦合力，非平衡分布可分解为边界驱动和畴壁运动诱导两部分。\n3. 边界驱动部分决定畴壁速度符号，运动诱导部分重整序参量弛豫，为此前局域温度唯象描述提供微观基础。", "summary_source": "deepseek", "authors": [{"name": "Takuma Kanakubo"}, {"name": "Taira Kawamura"}, {"name": "Yusuke Kato"}], "featured_authors": [{"name": "Takuma Kanakubo"}, {"name": "Taira Kawamura"}, {"name": "Yusuke Kato"}], "author_count": 3}, {"id": "2609.12645", "category": "cond-mat", "title": "Fluctuation-induced antiparallel spin polarization near the boundaries of chiral metals", "abstract": "The spin response of chiral conductors to nonequilibrium electrical fluctuations remains largely unexplored. We develop a low-frequency semiclassical Boltzmann theory coupled to Gauss's law for a chiral metal with spin-orbit coupling of hedgehog type, treating impurity scattering beyond the conventional relaxation-time approximation. We first determine the quadratic response to a local ac current and its frequency dependence, and then show that zero-mean stationary current fluctuation and electric-field fluctuation near boundaries generate finite time-averaged spin polarizations in the two boundary regions of the chiral metal. The polarizations are normal to the boundaries and antiparallel: for one chirality they point inward at both boundaries, and for the other they point outward. Within this model, the dominant contribution arises from the linear Edelstein effect driven by a quadratic effective electric field localized near each boundary. This picture may provide a qualitative explanation for CISS-related spin polarization reported in the absence of an applied bias. More broadly, we expect other externally maintained stochastic drives to induce spin polarization through the same mechanism.", "url": "https://arxiv.org/abs/2609.12645", "type": "理论", "summary": "1. 该工作建立低频半经典玻尔兹曼理论并与高斯定律耦合，在超越弛豫时间近似处理杂质散射下，研究刺猬型自旋轨道耦合手性金属的非平衡电涨落自旋响应。\n2. 其核心在于先求局域交流电流的二次响应及频率依赖，再证明边界附近零均值稳态电流与电场涨落会在两侧边界区产生有限时间平均自旋极化；该极化垂直于边界且反平行（一种手性两侧朝内、另一种朝外），并主要源于边界局域二次有效电场驱动的线性埃德尔斯坦效应。\n3. 这一图像可为无外加偏置时观测到的手性诱导自旋选择性相关自旋极化提供定性解释，并提示其他外部维持的随机驱动也可能通过同一机制诱导自旋极化。", "summary_source": "deepseek", "authors": [{"name": "Kosuke Yoshimi"}, {"name": "Yusuke Kato"}, {"name": "Yuta Suzuki"}, {"name": "Shuntaro Sumita"}, {"name": "Takuro Sato"}, {"name": "Hiroshi M. Yamamoto"}, {"name": "Yoshihiko Togawa"}], "featured_authors": [{"name": "Kosuke Yoshimi"}, {"name": "Yusuke Kato"}, {"name": "Yuta Suzuki"}, {"name": "Takuro Sato"}, {"name": "Hiroshi M. Yamamoto"}, {"name": "Yoshihiko Togawa"}], "author_count": 7}, {"id": "2609.12665", "category": "cond-mat", "title": "On non-phononic modes and glassy dynamics", "abstract": "The relationship between vibrational modes and glassy dynamics has been an important and controversial topic of study for many decades. We introduce a family of glass-forming model potentials that have identical molecular and swap dynamics but different low-frequency vibrational modes. In sufficiently small systems low frequency modes do not hybridize with phonons, and this enables us to study their statistical properties independently. We investigate i) the role of the optimization algorithm used to find a minimum; ii) that of the finite-size effects; iii) that of the truncation of the interaction potential; and, iv) that of the parent temperature. We find that models with identical supercooled liquid structure and dynamics can have dramatically different non-phononic vibrational modes at low frequency, based on how the potential is truncated. These findings challenge ideas relating the low-frequency non-phononic vibrational modes with the slow supercooled liquid relaxation.", "url": "https://arxiv.org/abs/2609.12665", "type": "理论+数值", "summary": "1. 该工作构建了一族玻璃形成模型势，使其分子与交换动力学相同但低频振动模式不同，并在小体系中避免低频模式与声子杂化，以独立研究非声子模式对极小化算法、有限尺寸、势截断和母液温度的依赖。\n2. 核心发现是，具有相同超冷液体结构与动力学的模型，仅因势截断不同，其低频非声子模式可显著不同；这表明这些模式对数值构造高度敏感，而非由液体结构唯一决定。\n3. 该结果质疑低频非声子振动模式与超冷液体慢弛豫的既有联系，提示二者未必存在普适因果关联，并强调比较模式与动力学时须严格控制势截断及有限尺寸效应。", "summary_source": "deepseek", "authors": [{"name": "Felix C. Mocanu"}, {"name": "Dmytro Khomenko"}, {"name": "Matteo Paoluzzi"}, {"name": "Giancarlo Ruocco"}, {"name": "Walter Schirmacher"}, {"name": "Grzegorz Szamel"}, {"name": "Francesco Zamponi"}], "featured_authors": [{"name": "Felix C. Mocanu"}, {"name": "Dmytro Khomenko"}, {"name": "Matteo Paoluzzi"}, {"name": "Walter Schirmacher"}, {"name": "Grzegorz Szamel"}, {"name": "Francesco Zamponi"}], "author_count": 7}, {"id": "2609.12680", "category": "cond-mat", "title": "Chirality enhances diffusion in disordered environments", "abstract": "Chirality, a systematic rotational bias in the motion of a particle, arises in a wide range of physical and biological systems, from charged colloids in magnetic fields to swimming bacteria near surfaces. While its effects in homogeneous environments are well understood, the interplay between chirality and structural disorder has remained largely unexplored. Here we investigate the chiral random walk on two-dimensional percolation clusters above the percolation threshold, combining numerical simulations with an analytically tractable annealed-disorder approximation. We find that the long-time diffusion coefficient depends non-monotonically on both the chirality parameter and the obstacle density: for every obstacle density above the percolation threshold, there exists an optimal chirality that enhances diffusion relative to the achiral walk. We show that the optimal chirality is set by an edge-adhering mechanism: maximum diffusion is achieved when the persistence length of the wall-adhering motion matches half the typical obstacle cluster perimeter. This yields a closed-form prediction for the optimal chirality in terms of geometric properties of the medium alone, which we verify across the full range of obstacle densities studied. The enhancement extends to first-passage statistics, where chirality shortens typical search times at strong disorder while lengthening them at weak disorder, with direct implications for biological navigation in disordered environments.", "url": "https://arxiv.org/abs/2609.12680", "type": "数值", "summary": "1. 该工作结合数值模拟与退火无序近似，研究二维逾渗阈值以上团簇上的手性随机行走，以揭示手性与结构无序的耦合。\n2. 其卖点是发现长时扩散系数对手性和障碍密度均非单调，且每个阈值以上密度均存在最优手性使扩散强于非手性行走；最优值由贴边机制决定，即壁面附着运动的持续长度等于典型障碍团簇周长的一半，并据此给出仅依赖介质几何的闭式预测。\n3. 该增强还延伸至首达统计：强无序下手性缩短搜索时间，弱无序下延长，提示无序环境中的生物导航可通过手性调控扩散与搜索。", "summary_source": "deepseek", "authors": [{"name": "Joshua Uhlig"}, {"name": "Jan Wójcik"}, {"name": "Ralf Metzler"}, {"name": "Erik Kalz"}], "featured_authors": [{"name": "Joshua Uhlig"}, {"name": "Jan Wójcik"}, {"name": "Ralf Metzler"}, {"name": "Erik Kalz"}], "author_count": 4}, {"id": "2609.12848", "category": "cond-mat", "title": "Diversifying time evolution of matrix product states using BUGs", "abstract": "Time evolution of tensor-network states is a central tool for studying nonequilibrium dynamics in strongly correlated quantum systems. In the past decade, using the time-dependent variational principle (TDVP) discretized by projector-splitting has become the gold standard for evolving matrix product states (MPS) with long-range Hamiltonians. More recently, a conceptually different class of discretizations of the TDVP, the class of Basis Update and Galerkin (BUG) integrators, has been developed within the framework of dynamical low-rank approximation, offering an alternative, more flexible approach. In this work, we formulate two BUG integrators explicitly for MPS. The BUG integrators result in \"single-site\" MPS integrators that are robust with respect to small singular values, avoid backward-in-time substeps, and naturally allow for the adaptive choice of bond dimensions. We consider the augmented BUG integrator of first order and the midpoint BUG integrator of second order and clarify their relation to the projector-splitting discretization of the TDVP. Using representative models of strongly correlated quantum systems, like the XY spin model with long-range interaction and two-dimensional lattice models of fermions and spins of various lengths, we perform a systematic numerical comparison between BUG and projector-splitting time discretizations of the continuous-time TDVP, focusing on scalability, numerical complexity, and accuracy. We find that BUG integrators, due to their reduced numerical cost and the flexibility of the concept, provide a competitive and, in certain regimes, advantageous alternative to the well-established time-stepping by projector-splitting in TDVP, especially in models with large local dimensions, and in cases where observables are extracted with high temporal resolution.", "url": "https://arxiv.org/abs/2609.12848", "type": "理论+数值", "summary": "1. 该工作把动力低秩近似中的基更新–伽辽金（BUG）积分器显式构造为矩阵乘积态（MPS）的两种时间演化格式，即一阶增广BUG与二阶中点BUG，并厘清其与TDVP投影分裂离散化的关系。\n2. 其卖点在于这些单站点MPS积分器对微小奇异值稳健、不含反向时间子步、可自适应选取键维，并在长程XY自旋链与二维费米子、自旋格点模型上以更低数值代价取得与投影分裂相当或更优的精度，在大局域维数与高时间分辨测量场景中优势明显。\n3. 这为强关联体系非平衡动力学的张量网络时间演化提供了更灵活、可扩展的替代方案，并启示可进一步探索更高阶BUG格式与自适应键维策略。", "summary_source": "deepseek", "authors": [{"name": "Kornél Kapás"}, {"name": "Dominik Sulz"}, {"name": "Charlotte Verhoeven"}, {"name": "Miklós Antal Werner"}, {"name": "Örs Legeza"}, {"name": "Christian Lubich"}], "featured_authors": [{"name": "Kornél Kapás"}, {"name": "Dominik Sulz"}, {"name": "Charlotte Verhoeven"}, {"name": "Miklós Antal Werner"}, {"name": "Örs Legeza"}, {"name": "Christian Lubich"}], "author_count": 6}, {"id": "2609.12856", "category": "cond-mat", "title": "Chiral Valence-Bond Solid and Chiral Triplons", "abstract": "We propose a chiral valence-bond solid (VBS) state that spontaneously breaks inversion and mirror symmetries. It is characterized by a finite electric toroidal (ET) monopole, whose sign distinguishes the two enantiomorphic states. Using a spin-lattice model with Dzyaloshinskii-Moriya interactions, we show that the chiral VBS produces spin-split triplon bands with enantiomer-dependent spin textures governed by its ET monopole. Under a temperature gradient, these spin textures generate a net spin response whose sign is tied to the handedness of the VBS. More importantly, we show that the imaginary off-diagonal components of the dynamical spin structure factor change sign between the two enantiomers, providing a direct neutron-scattering probe of the selected handedness. These results establish a route to spontaneous chirality in a valence-bond system and to its direct detection through magnetic excitations.", "url": "https://arxiv.org/abs/2609.12856", "type": "理论", "summary": "1. 提出一种自发破缺反演与镜像对称的手性价键固体态，并在含DM相互作用的自旋-晶格模型中研究其性质。\n2. 其电环形单极支配对映体依赖的自旋织构，并伴随自旋劈裂三重子能带；动态自旋结构因子虚非对角分量变号可供中子探测。\n3. 这为价键系统中自发手性的实现及其通过磁激发直接探测提供了途径。", "summary_source": "deepseek", "authors": [{"name": "Shinnosuke Koyama"}, {"name": "Kazumasa Hattori"}], "featured_authors": [{"name": "Shinnosuke Koyama"}, {"name": "Kazumasa Hattori"}], "author_count": 2}, {"id": "2609.12862", "category": "cond-mat", "title": "Slow activity decay in excitable models with discontinuous phase transitions", "abstract": "As a simple model of interacting systems of excitable degrees of freedom, we consider a threshold contact process on various lattices and networks, in which a successful activation event requires the presence of more than one active neighbors. We show by combining numerical simulations and a phenomenological theory that, in the two-phase coexistence region and for a sufficiently low initial activity, a slower-than-exponential temporal decay of the global density emerges, caused by the spontaneous formation of slowly vanishing and non-communicating clusters of activity. This slow-decay phenomenon is found to appear generally for regular lattices and also for finite-dimensional random lattices such as the Voronoi-Delaunay network. However, the slow-decay is impeded by small-world property, as demonstrated by simulations on random-regular networks. In the case of a power-law decay of the order parameter, which is valid among others on two-dimensional regular lattices, our phenomenological theory points out that the decaying state is stable against unbounded nucleation only if the decay exponent exceeds $1/2$. Besides the well-known Griffiths effects of quenched random systems, this slow-decay phenomenon rooted in the threshold condition provides an alternative mechanism of off-critical but scale-free dynamics, occurring also in the absence of disorder.", "url": "https://arxiv.org/abs/2609.12862", "type": "理论+数值", "summary": "1. 该工作以阈值接触过程为模型，结合数值模拟与唯象理论，研究规则格点与网络上激发活动的慢衰减。\n2. 两相共存区低初始活性下，全局密度慢于指数衰减，源于自发形成互不通信、缓慢消亡的活性团簇；规则格点及有限维随机网络常见，小世界性则抑制。\n3. 该阈值机制在无淬火无序时提供偏离临界却无标度的动力学替代解释，补充Griffiths效应；唯象理论并指出幂律衰减态仅在指数大于1/2时稳定抗无界成核。", "summary_source": "deepseek", "authors": [{"name": "Paulo H. Lorenzoni"}, {"name": "Géza Ódor"}, {"name": "Silvio C. Ferreira"}, {"name": "Róbert Juhász"}], "featured_authors": [{"name": "Paulo H. Lorenzoni"}, {"name": "Géza Ódor"}, {"name": "Silvio C. Ferreira"}, {"name": "Róbert Juhász"}], "author_count": 4}, {"id": "2609.12868", "category": "cond-mat", "title": "Decoupling support-dependent transport profiles from molecular water motion", "abstract": "Pressure and concentration profiles from non-equilibrium molecular dynamics (NEMD) simulations are often used to infer water transport mechanisms in dense and swollen polymer membranes. However, the mechanical restraints needed to stabilize simulated membranes can alter these profiles and their interpretation. Here, we test whether restraint-induced differences in pressure and water concentration profiles are accompanied by changes in molecular water dynamics. Crosslinked poly(ethylene glycol) diacrylate (PEGDA) membranes were simulated using three support strategies: a graphene support lattice, frozen membrane atoms near the permeate interface, and homogeneously distributed frozen membrane atoms. The restraints produced markedly different profiles, ranging from solution-diffusion-like to pore-flow-like, while overall water fluxes remained comparable. Molecular water dynamics, however, changed little. Interfacial exchange was strongly bidirectional and far exceeded the net permeation flux, membrane water diffusivities were similar, and complete crossings occurred in both directions. Local water associations were short-lived, and directional velocity correlations decayed rapidly with time and distance. Thus, substantially different pressure and concentration profiles can arise despite similar molecular water dynamics. Such profiles alone are therefore insufficient to identify transport mechanisms in mechanically restrained NEMD simulations. In PEGDA, water motion is dominated by stochastic diffusion with a small net directional bias.", "url": "https://arxiv.org/abs/2609.12868", "type": "数值", "summary": "1. 该工作通过非平衡分子动力学模拟交联PEGDA膜，在石墨烯支撑、渗透侧冻结原子和均匀冻结原子三种力学约束策略下，比较压力/浓度剖面与分子水动力学。\n2. 核心发现是约束虽使剖面从类溶解-扩散变为类孔流且通量相当，但水分子扩散率、双向界面交换和速度关联等动力学几乎不变，表明剖面差异并不源于分子水运动改变。\n3. 因此，仅凭受约束NEMD中的压力或浓度剖面不足以判定传输机制；在PEGDA中水输运由随机扩散主导并叠加微弱净定向偏置，这提示需用分子动力学量而非剖面来辨识致密膜中的传输机理。", "summary_source": "deepseek", "authors": [{"name": "Jannik Mehlis"}, {"name": "Matthias Wessling"}], "featured_authors": [{"name": "Jannik Mehlis"}, {"name": "Matthias Wessling"}], "author_count": 2}, {"id": "2609.12930", "category": "cond-mat", "title": "Intrinsic excitations and a proposed ground state in an Ammann-Beenker artificial spin ice", "abstract": "Artificial spin ices built on quasiperiodic geometries remain under-explored. Here we investigate an ASI based on the octagonal Ammann-Beenker tiling, whose six vertex types present local environments inaccessible in periodic lattices. Combining Monte Carlo simulations of dipolar-coupled macrospins with micromagnetic calculations of individual vertex energies, we find that vertex types freeze in an order set not by coordination number, but by quasi-degenerate levels at five-island vertices and their local environment. Excitations in the low energy state are correspondingly localised to specific, geometrically determined sites. Using twice-inflated substitution rules as an energetic backbone, we propose an analytical ground state combining a long-range ordered fixed spin network with a sparse set of degenerate regions.", "url": "https://arxiv.org/abs/2609.12930", "type": "理论+数值", "summary": "1. 该工作结合偶极耦合宏观自旋的蒙特卡罗模拟与单顶点微磁能量计算，研究了基于八重Ammann-Beenker准周期拼图的六类顶点人工自旋冰，并提出其解析基态。\n2. 关键结果为：顶点冻结顺序不由配位数决定，而受五岛顶点的准简并能级及局域环境支配，低能激发亦被限制在由几何确定的特定格点。\n3. 以二次膨胀替换规则为能量骨架构造的基态，将长程有序固定自旋网络与稀疏简并区结合，为在准周期人工自旋冰中设计受限激发和检验无序/准周期磁序提供启示。", "summary_source": "deepseek", "authors": [{"name": "E Weightman"}, {"name": "L O'Brien"}, {"name": "S Coates"}], "featured_authors": [{"name": "E Weightman"}, {"name": "L O'Brien"}, {"name": "S Coates"}], "author_count": 3}, {"id": "2609.12931", "category": "cond-mat", "title": "Spin splitting without symmetry: a nearly compensated ferrimagnet and the origin of altermagnetism", "abstract": "The spin splitting of collinear altermagnets is usually attributed to the crystal symmetry relating the opposite-spin sublattices --- a rotation or mirror in place of the translation or inversion of a conventional antiferromagnet. We show that this symmetry organizes the splitting but does not produce it; its origin is the anisotropic arrangement of the magnetic orbitals and their ligands, which also fixes the symmetry itself. Two results establish this. A triclinic ($P1$) \\ce{Mn} oxide, a fully compensated ferrimagnet whose two inequivalent sublattices are related by no symmetry, is spin split throughout the Brillouin zone; repositioning the same ligands, atom for atom, to restore an inversion centre relating the two metal sites collapses the splitting to a residual two orders of magnitude smaller, so the splitting follows from the arrangement rather than the symmetry. Symmetry, we show formally, can only ever reverse or forbid a splitting that already exists: it cannot create one between sublattices an arrangement has left electronically identical, nor where the underlying orbitals carry no anisotropy to arrange in the first place. Organizing the analysis through an operation-resolved symmetry hierarchy and reading the crystal classes as a single axis, the enforced nodal planes fall from two to one to zero across the orthorhombic, monoclinic, and triclinic classes while the arrangement-generated splitting persists to the base. The altermagnet and the fully compensated ferrimagnet are thus the two ends of one axis --- the same splitting, organized by symmetry at one end and unorganized at the other --- and the search for compensated spin-split magnets is a search over orbital arrangements rather than symmetry labels.", "url": "https://arxiv.org/abs/2609.12931", "type": "理论+数值", "summary": "1. 共线交替磁体的自旋分裂通常归因于与相反自旋子晶格相关的晶体对称性——旋转或镜像代替了传统反铁磁体的平移或反转。\n2. 通过运算解析的对称层次结构来组织分析，并将晶体类别作为单轴读取，正交晶系、单斜晶系和三斜晶系的强制节面从 2 下降到 1 到 0，而排列生成的分裂持续到底部。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Joo Yull Rhee"}], "featured_authors": [{"name": "Joo Yull Rhee"}], "author_count": 1}, {"id": "2609.12952", "category": "cond-mat", "title": "Geometric theory of elastic curves constrained on rigid curved surfaces", "abstract": "Slender elastic objects constrained to curved surfaces are ubiquitous in soft systems, with examples ranging from DNA wrapping around histones to actin filaments forming contractile rings on the cell membrane during cytokinesis. In the continuum limit, the conformation of these effectively one-dimensional (1D) objects is governed by both the geometry and mechanics of the embedding surface, and the elasticity of the object. Existing phenomenological typically describe such behavior through elastic energy minimization that incorporates bending and twisting, but neglect stretching that may be important for filaments with finite cross-section or are highly incompatible with the underlying surface. Here we present a coarse-grained geometric theory of 1D elastic curves constrained on rigid surfaces, derived from the first principles. For an isotropic material, our model emerges naturally in terms of the Young's modulus, Poisson's ratio, and area moments of inertia. The resulting effective energy functional explicitly includes stretching in addition to bending and twisting. We minimize it to determine the equilibrium curve conformations on different zero, positive, or negative Gaussian rigid surfaces. Our theory provides a general framework for analyzing the equilibrium configurations of surface-bound elastic curves in biologically and physically relevant settings.", "url": "https://arxiv.org/abs/2609.12952", "type": "理论", "summary": "1. 该工作从第一性原理建立受限于刚性曲面的一维弹性曲线粗粒化几何理论，并推导同时包含拉伸、弯曲与扭转的有效能量泛函。\n2. 其核心创新在于显式纳入以往唯象模型忽略的拉伸项，并针对各向同性材料用杨氏模量、泊松比与截面惯性矩自然表达，从而可描述有限截面或与基底高度不兼容的细丝。\n3. 该框架可用于求解零、正、负高斯曲率刚性曲面上弹性曲线的平衡构型，进而为生物物理与软物质等体系表面绑定细丝的力学分析提供一般性理论工具。", "summary_source": "deepseek", "authors": [{"name": "Fahim Bin Selim"}, {"name": "C. Nadir Kaplan"}], "featured_authors": [{"name": "Fahim Bin Selim"}, {"name": "C. Nadir Kaplan"}], "author_count": 2}, {"id": "2609.12956", "category": "cond-mat", "title": "Orbital Hall effect and orbital altermagnetism in even- and odd-parity-wave magnetic Lieb lattices", "abstract": "Altermagnets combine compensated antiferromagnetic order with ferromagnet-like signatures such as spin-polarized bands and, under appropriate conditions, an anomalous Hall response. Their characteristic momentum-dependent spin splitting originates from the interplay of magnetic order and crystal structure and therefore does not require spin-orbit coupling (SOC), whereas the anomalous Hall effect relies on SOC. This raises the question whether the ferromagnet-like transport character of altermagnets can manifest already in the nonrelativistic limit. Here, we investigate the transport of orbital angular momentum in magnetic Lieb lattices. We show that a collinear antiferromagnetic texture realizes a d-wave altermagnetic state and simultaneously generates an orbital Hall effect, both in the complete absence of SOC. In this nonrelativistic limit, the orbital Hall response closely resembles that of the corresponding ferromagnet. When SOC is included, the orbital Hall effect is accompanied by a spin Hall response, while the altermagnetic spin texture acquires a corresponding orbital texture, realizing orbital altermagnetism. In contrast, an anomalous, or crystal, Hall effect requires SOC and is additionally subject to crystal-symmetry constraints. We extend the analysis from d-wave altermagnetism to odd-parity p-wave magnetism, where the orbital Hall effect becomes anisotropic and the orbital conductivity tensor develops a symmetric transverse component analogous to the planar Hall response in charge transport. Our results establish the orbital Hall effect as a nonrelativistic transport manifestation of the close relation between altermagnets and ferromagnets and extend this connection to unconventional magnetic orders beyond altermagnetism.", "url": "https://arxiv.org/abs/2609.12956", "type": "理论", "summary": "1. 交变磁体将补偿反铁磁序与类铁磁体特征（例如自旋极化带）以及在适当条件下的反常霍尔响应相结合。\n2. 相比之下，反常霍尔效应或晶体霍尔效应需要 SOC，并且还受到晶体对称性约束。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Börge Göbel"}, {"name": "Ersoy Şaşıoğlu"}, {"name": "Samir Lounis"}], "featured_authors": [{"name": "Börge Göbel"}, {"name": "Ersoy Şaşıoğlu"}, {"name": "Samir Lounis"}], "author_count": 3}, {"id": "2609.13110", "category": "cond-mat", "title": "An on-lattice model for two-dimensional melting", "abstract": "We introduce an on-lattice minimal model of two-dimensional melting, a clock model with vacancies with control parameters temperature, chemical potential and external field. We study the full phase diagram using cluster Monte Carlo, Tensor Network Renormalisation Group and selfconsistent mean field methods. A non-universal ensemble of melting scenarios is observed including the KTHNY scenario of two Berezinskii-Kosterlitz-Thouless phase transitions delimiting a quasilong-range ordered phase. The upper transition evolves into first-order transition in analogy with simulations on hard and soft discs and at low chemical potential there is a single transition between ordered high density and disordered low density phases. The evolution is via a special tricritical point that is accessed in detail. This work therefore provides a framework for understanding the crossover between 2D melting scenarios and offers insights into the behavior of realistic systems.", "url": "https://arxiv.org/abs/2609.13110", "type": "理论+数值", "summary": "1. 我们引入了二维熔化的晶格上最小模型，这是一个带有空位的时钟模型，具有控制参数温度、化学势和外场。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Antonin Rogé"}, {"name": "Peter Holdsworth"}, {"name": "Alexis Poncet"}], "featured_authors": [{"name": "Antonin Rogé"}, {"name": "Peter Holdsworth"}, {"name": "Alexis Poncet"}], "author_count": 3}, {"id": "2609.13112", "category": "cond-mat", "title": "Laser-induced metastable (anti-)skyrmion states with higher-order topological charge", "abstract": "Ultrafast creation and manipulation of topologically non-trivial spin objects promises significant potential for spintronic applications. Here, we demonstrate laser-induced nucleation of skyrmions and antiskyrmions with topological charge up to $|Q|=3$ from the saturated magnetization state of a Co/Ni-multilayer which does not intrinsically host a skyrmionic ground state. The resulting configuration of spin objects thus constitutes a metastable, thermodynamically hidden magnetic state. We control the number and type of spin objects by the excitation fluence and the external out-of-plane magnetic field.", "url": "https://arxiv.org/abs/2609.13112", "type": "理论", "summary": "1. 该工作利用激光脉冲在Co/Ni多层膜中从饱和磁化态诱导出斯格明子和反斯格明子，其拓扑荷可达|Q|=3，并证明这些自旋构型属于亚稳、热力学隐藏态。\n2. 其技术卖点在于，该体系本征基态并不稳定承载斯格明子，却可通过超快激光成核高阶拓扑荷，并借助激发注量和垂直外磁场调控这些自旋对象的数目与类型。\n3. 这为在非本征斯格明子材料中实现超快、可调的拓扑自旋织构及其自旋电子学应用提供了可行路径，并提示需进一步考察其亚稳态寿命与热稳定性。", "summary_source": "deepseek", "authors": [{"name": "Tim Titze"}, {"name": "Marcel Möller"}, {"name": "Timo Schmidt"}, {"name": "Mariam Hassan"}, {"name": "Sabri Koraltan"}, {"name": "Stefan Mathias"}, {"name": "Manfred Albrecht"}, {"name": "Claus Ropers"}, {"name": "Daniel Steil"}], "featured_authors": [{"name": "Tim Titze"}, {"name": "Marcel Möller"}, {"name": "Timo Schmidt"}, {"name": "Manfred Albrecht"}, {"name": "Claus Ropers"}, {"name": "Daniel Steil"}], "author_count": 9}, {"id": "2609.13113", "category": "cond-mat", "title": "Modification of Surface Properties in Ruthenium Thin Films through Nitrogen Ion Irradiation", "abstract": "Surface modification is an important strategy for tailoring the physical and chemical properties of materials for advanced technological applications. In thin films, changes in surface structure, roughness, and composition can strongly influence their functional behavior. In this work, we studied the effect of N+-ion irradiation at 20 keV energy on Ru thin films of two different thicknesses, 100 Å and 1000 Å, over a fluence range of ~1014 to 1017 ions/cm2. The main objective of this study is to investigate the evolution of the structural and wettability properties of Ru thin films of different thicknesses under increasing ion fluence. Overall, the results reveal that increasing ion fluence promotes surface roughening in both film thicknesses, which is correlated with an increase in contact angle. This indicates a clear transition from hydrophilic to hydrophobic behaviour, with the highest contact angle of ~95.54° observed at a fluence of 1017 ions/cm2. TRIM simulations reveal that for the 100 Å film, the projected ion range exceeds the film thickness, allowing interaction with the bottom substrate, whereas in the 1000 Å film, ion penetration remains largely confined within the Ru layer. GIXRD confirms fluence-dependent structural modification, including peak broadening with preferred orientation changes from Ru (101) to (002). Overall, this study demonstrates that N+-ion irradiation serves as an effective route for tuning both the surface morphology and wettability of Ru thin films, enabling controlled enhancement of hydrophobicity.", "url": "https://arxiv.org/abs/2609.13113", "type": "数值", "summary": "1. 该工作采用20 keV氮离子在约10^14至10^17 ions/cm²注量范围内辐照100 Å与1000 Å钌薄膜，系统考察不同厚度下结构与润湿性的注量依赖演化。\n2. 其物理卖点在于：注量升高引起两种厚度薄膜表面粗化，并与接触角增大相关联，驱动亲水向疏水转变，最高接触角约95.54°；TRIM模拟指出100 Å膜中离子投影射程超过膜厚并可作用于底部衬底，而1000 Å膜中离子穿透主要局限于钌层；GIXRD证实峰宽化及择优取向由Ru(101)变为(002)。\n3. 这表明氮离子辐照可作为调控钌薄膜表面形貌与润湿性的有效手段，并为通过注量控制实现疏水性增强及薄膜表面改性提供启发。", "summary_source": "deepseek", "authors": [{"name": "Anmol Sharma"}, {"name": "Arnab Tripathy"}, {"name": "Rajeev Gupta"}, {"name": "Raj Kumar"}, {"name": "Harsh Vardhan"}, {"name": "Ratnesh Kumar Pandey"}, {"name": "Atul Thakur"}, {"name": "Shalendra Kumar"}, {"name": "Ranjeet Kumar Brajpuriya"}, {"name": "Vishakha Kaushik"}, {"name": "Sachin Pathak"}], "featured_authors": [{"name": "Anmol Sharma"}, {"name": "Arnab Tripathy"}, {"name": "Rajeev Gupta"}, {"name": "Ranjeet Kumar Brajpuriya"}, {"name": "Vishakha Kaushik"}, {"name": "Sachin Pathak"}], "author_count": 11}, {"id": "2609.13124", "category": "cond-mat", "title": "Magnon-induced hybridization brightens excitons in ferromagnetic semiconductors", "abstract": "Excitons in magnetic semiconductors have energies and spin structures that are sensitive to the underlying magnetic order. We study this coupling in a minimal one-dimensional lattice model of a conduction electron and a valence hole moving in a ferromagnetic background of localized quantum spins, treating the electron, the hole, and the magnon(s) as explicitly resolved degrees of freedom. At zero temperature, spin conservation closes the relevant Hilbert subspaces at the one- or two-magnon level, so the model can be solved essentially exactly with a real-space Green's function method. Comparison against a frozen-spin approximation in which the local moments are replaced by their ordered values identifies which effects are due to emission and absorption of quantum magnons. A frozen background already lifts the spin degeneracy of the exciton and, if the two carriers couple with different strengths to the local moments, it mixes the singlet with the spin-zero triplet exciton. The emission and absorption of quantum magnons goes qualitatively further: it splits and shifts the exciton energies nonlinearly in the exchange coupling even when all frozen-spin effects vanish; for carriers with unequal hopping integrals, it hybridizes the singlet and spin-zero triplet excitons, thereby brightening the dark triplet; and it increases the exciton radius, which in turn enhances the magnon dressing by removing an on-site cancellation. These quantum effects are therefore strongest for extended, Wannier-like excitons, which is precisely the regime that is commonly modeled assuming a static (frozen-spin) magnetic order.", "url": "https://arxiv.org/abs/2609.13124", "type": "理论+数值", "summary": "1. 磁性半导体中的激子具有对底层磁序敏感的能量和自旋结构。\n2. 量子磁振子的发射和吸收在质量上更进一步：即使所有冻结自旋效应消失，它也会在交换耦合中非线性地分裂和转移激子能量；对于跳跃积分不相等的载流子，它使单线态和自旋零三线态激子杂化，从而使暗三线态变亮；它增加了激子半径，从而通过消除现场抵消来增强磁振子修整。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Man-Yat Chu"}, {"name": "Mona Berciu"}], "featured_authors": [{"name": "Man-Yat Chu"}, {"name": "Mona Berciu"}], "author_count": 2}, {"id": "2609.13139", "category": "cond-mat", "title": "RS-CIDER: A non-local machine learning model for approximating screened hybrid functionals", "abstract": "Screened hybrid functionals such as HSE06 improve the description of band gaps, charge localization, and redox energetics relative to semilocal approximations, but their explicit Hartree-Fock exchange term is computationally costly for large, periodic systems, especially in plane-wave basis set calculations. Here we present RS-CIDER, a machine-learned non-local exchange functional that approximates the short-range Hartree-Fock exchange term in HSE06 by explicitly fitting both ground-state energies and single-particle energy levels. RS-CIDER combines scale-invariant semilocal and non-local density descriptors and can be evaluated self-consistently without explicitly applying the short-range Hartree-Fock exchange operator. RS-CIDER shows close agreement with HSE06 for molecular reaction energies and solid-state band gaps. Further tests across distinct materials show agreement between RS-CIDER and HSE06 for local magnetism, Cu-O phase competition, polaron localization, and neutral-defect energetics. For an Fe olivine, chemistry-specific fine-tuning recovers the HSE06 Li intercalation voltage. A timing benchmark shows that RS-CIDER reduces the measured per-SCF-step wall time by more than an order of magnitude relative to HSE06. Together, these molecular and solid-state results establish RS-CIDER as an efficient self-consistent machine-learned surrogate for HSE06.", "url": "https://arxiv.org/abs/2609.13139", "type": "理论+数值", "summary": "1. 该工作提出 RS-CIDER，一种非局域机器学习交换泛函，通过同时拟合基态能量和单粒子能级来近似 HSE06 的短程 Hartree-Fock 交换项。\n2. 其卖点是以尺度不变半局域与非局域密度描述符实现无需显式交换算符的自洽求解，在分子反应能、固体带隙、局域磁性、Cu-O相竞争、极化子局域及缺陷能量学上接近 HSE06，并使每步 SCF 墙钟时间降低一个数量级以上。\n3. 这为用数据驱动代理模型高效替代昂贵筛选杂化泛函、开展大尺度周期体系电子结构模拟提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Zhuotao Jin"}, {"name": "Mohamed S. Abdallah"}, {"name": "Boris Kozinsky"}, {"name": "Kyle Bystrom"}], "featured_authors": [{"name": "Zhuotao Jin"}, {"name": "Mohamed S. Abdallah"}, {"name": "Boris Kozinsky"}, {"name": "Kyle Bystrom"}], "author_count": 4}, {"id": "2609.12046", "category": "hep-th", "title": "$\\boldsymbol{{\\rm AdS}_3}$ Recursion Relations, Double Copy and $\\boldsymbol{{\\rm CFT}_2}$ Ward Identities", "abstract": "We consider correlation functions of massless fields in three-dimensional Anti-de Sitter spacetime. Using embedding-space spinors akin to spinor helicity variables, we show that masslessness implies holomorphicity. We perform a deformation of the spinors, analogous to the BCFW shift for flat-space amplitudes, to bootstrap correlation functions of Chern-Simons theory in the bulk. We show that the resulting recursion relations in the bulk ${\\rm AdS}_3$ are equivalent to the usual ${\\rm CFT}_2$ Ward identities for the boundary conserved currents. The double copy of those recursion relations is equivalent to the Ward identities for the stress-energy tensor. Our findings illustrate how modern amplitude techniques can shed new light on CFT correlators, and provide a novel interpretation of fundamental results in two-dimensional conformal field theory.", "url": "https://arxiv.org/abs/2609.12046", "type": "理论", "summary": "1. 该工作在三维反德西特时空中研究无质量场关联函数，利用嵌入空间旋量并引入类似BCFW的形变，构造体Chern-Simons理论关联函数的递推关系。\n2. 其核心是证明无质量性意味着全纯性，且AdS3递推关系等价于边界CFT2守恒流Ward恒等式，其双拷贝则给出能动张量Ward恒等式。\n3. 这显示现代振幅方法可重新诠释二维共形场论的基本结果，并为从体递推与双拷贝角度研究CFT关联函数提供新途径。", "summary_source": "deepseek", "authors": [{"name": "Grégoire Mathys"}, {"name": "Guilherme L. Pimentel"}, {"name": "Facundo Rost"}], "featured_authors": [{"name": "Grégoire Mathys"}, {"name": "Guilherme L. Pimentel"}, {"name": "Facundo Rost"}], "author_count": 3}, {"id": "2609.12047", "category": "hep-th", "title": "Mutual Information in spacetime", "abstract": "We compute mutual information for general spacetime regions using Sorkin's Gaussian field formalism. We show that this construction is naturally based on the reduced space of smearings that generate independent fields, making manifest that in QFTs with stress tensor the local algebras generated by regions sharing the same causal completion. We test the method for a Weyl fermion, the chiral current, and massless and massive real scalar fields across various spacetime regions in 1+1 Minkowski space. Across all cases, distinct spacelike-separated spacetime regions sharing the same causal completion yield identical mutual information. This formalism provides a setting in which to test the timelike tube theorem. Indeed, we observe that the mutual information of a timelike lens approaches that of its enveloping diamond as the cutoff is increased, offering a direct numerical verification of the theorem. In all the considered cases, our results agree with known continuum and spatial-lattice results. Finally, this work establishes a natural framework for studying entanglement measures in generalized free field theories, a task that is impractical within other existing prescriptions.", "url": "https://arxiv.org/abs/2609.12047", "type": "理论", "summary": "1. 该工作用Sorkin高斯场形式计算任意时空区域的互信息，并在1+1维Minkowski时空中对Weyl费米子、手征流及标量场加以检验。\n2. 其构造基于生成独立场的约化涂抹空间，表明共享同一因果完备的类空分离区域给出相同互信息，并可直接检验类时管定理。\n3. 截断增大时类时透镜的互信息趋近其包络菱形之值，为类时管定理提供数值验证，并为广义自由场论的纠缠度量提供可行框架。", "summary_source": "deepseek", "authors": [{"name": "Raúl E. Arias"}, {"name": "Marina Huerta"}, {"name": "Pedro J. Martinez"}], "featured_authors": [{"name": "Raúl E. Arias"}, {"name": "Marina Huerta"}, {"name": "Pedro J. Martinez"}], "author_count": 3}, {"id": "2609.12080", "category": "hep-th", "title": "Emergent Conformal Symmetry on Superfluid Vortices in Two-Color QCD and Pseudoreal Gauge Theories", "abstract": "Two-color QCD provides a unique first-principles laboratory for strongly interacting matter at finite baryon density, where a diquark condensate realizes a baryonic superfluid. We investigate the internal physics of its quantized superfluid vortices in the chiral limit. We find that a vortex localizes an exact and normalizable $S^3\\simeq SU
