ctive models can link influential parameters to surface roughness metrics prior to in situ operations. While this approach offers clear advantages, it faces challenges due to limited datasets and robustness issues in inverse design paradigms. To address these challenges, this paper proposes a machine learning (ML)-based framework for the inverse design of the surface milling process, with a focus on surface roughness as the design objective. The framework employs forward training of two ML models, a deep neural network (DNN) and a random forest (RF) ensemble, both developed using a high-fidelity synthetic dataset generated from a computational simulation framework. These trained models are integrated into a Bayesian optimization (BO) procedure to overcome the multiplicity problem arising from the many-to-one mapping inherent in the dataset. The approach identifies top-performing milling process configurations, considering both process and tool parameters, and presents them from the full solution space. The models achieve average relative errors below 5% when compared to reference results, thereby demonstrating the robustness and reliability of the proposed methodology.", "url": "https://arxiv.org/abs/2606.16032", "type": "理论+数值", "summary": "1. 该工作提出基于机器学习的铣削过程逆设计框架，以表面粗糙度为优化目标，利用高保真合成数据训练深度神经网络与随机森林模型。\n2. 其技术核心在于将前向模型集成至贝叶斯优化流程，有效解决了参数-粗糙度多对一映射导致的解多重性问题。\n3. 该框架为制造过程中鲁棒性逆设计提供了可迁移的范例，有望推广至其他复杂加工工艺。", "summary_source": "deepseek", "authors": [{"name": "Hadi Bakhshan"}, {"name": "Sima Farshbaf"}, {"name": "Fernando Rastellini"}, {"name": "Josep Maria Carbonell"}], "featured_authors": [{"name": "Hadi Bakhshan"}, {"name": "Sima Farshbaf"}, {"name": "Fernando Rastellini"}, {"name": "Josep Maria Carbonell"}], "author_count": 4}, {"id": "2606.16108", "category": "cond-mat", "title": "Optically Active Fractional Wannier-Center Displacement Drives Giant Second-Harmonic Generation", "abstract": "Electric polarization is a static ground-state Berry-phase property, whereas second-harmonic generation (SHG) and shift current are dynamical optical responses. Their connection is encoded in the shift vector, whose Brillouin-zone average is governed by the band-resolved Berry-phase polarization difference between the optically connected initial and final states. Here we exploit this geometric relation in quantized formal polarization (QFP) crystals, where symmetry-quantized formal-polarization branches correspond to fractional Wannier-center sectors. First-principles screening identifies noncentrosymmetric QFP materials with giant SHG responses, including $\\mathrm{InNbBr}_6$ and $\\mathrm{InPS}_3$. Band-resolved Berry-phase analysis shows that their dominant optical transitions connect occupied and low-lying unoccupied states whose Wannier centers lie at distinct fractional Wyckoff positions, producing a large transition-resolved Wannier-center displacement. This displacement gives rise to a large shift vector and a dominant shift-vector-related intraband contribution to the static SHG susceptibility. Our results show that symmetry-quantized formal polarization can become optically active through transitions between fractional Wannier-center sectors, providing a symmetry-guided route to giant SHG and shift-current responses.", "url": "https://arxiv.org/abs/2606.16108", "type": "理论+数值", "summary": "1. 该工作通过第一性原理筛选，在非中心对称量子化形式极化晶体中识别出具有巨大二次谐波响应的材料，并揭示了其光学跃迁机制。\n2. 其核心物理卖点在于，主导跃迁连接不同分数Wannier中心扇区的占据与未占据态，产生大跃迁分辨Wannier中心位移，驱动大shift矢量及静态SHG极化率中的带内贡献。\n3. 这为利用对称性量子化形式极化的光学活性设计巨SHG和shift电流响应材料提供了基于几何的物理途径，拓展了Berry相极化的动态应用。", "summary_source": "deepseek", "authors": [{"name": "Hongsheng Pang"}, {"name": "Lixin He"}], "featured_authors": [{"name": "Hongsheng Pang"}, {"name": "Lixin He"}], "author_count": 2}, {"id": "2606.16128", "category": "cond-mat", "title": "Luttinger liquid parameters in one-dimensional Rydberg arrays", "abstract": "We investigate Berezinskii-Kosterlitz-Thouless (BKT) transitions in one-dimensional Rydberg chains, where commensurate critical regimes associated with the melting of crystalline orders with period larger than five and incommensurate floating phases are both described by Luttinger liquid theory. The central quantity is the Luttinger liquid parameter $K$, which characterizes the universal low-energy theory and controls the relevance of perturbations driving BKT transitions. We extract $K$ using Friedel oscillations and the recently developed crosscap method introduced in Phys. Rev. Lett. 134, 076501 (2025). As benchmarks, we first apply the crosscap method to a $\\mathbb{Z}_3$ dual hard-core boson chain and a spin-1 XY chain with single-ion anisotropy, obtaining BKT transition points consistent with previous results after finite-size extrapolation. We then compute $K$ in the Rydberg chain along lines with fixed correlation-oscillation period near BKT transitions. Along the commensurate period-five line, the critical values of $K$ predicted by sine-Gordon theory reveal two BKT transitions separating the disordered phase, the critical phase, and the $\\mathbb{Z}_5$ crystalline phase. The results from Friedel oscillations and the crosscap method agree with each other and are further supported by energy-gap scaling and Binder-cumulant analysis. To obtain reliable values of $K$ from Friedel oscillations, we use a multi-harmonic fitting scheme throughout the analysis. Along incommensurate lines, the BKT points obtained from Friedel oscillations agree with those extracted from entanglement entropy. Finally, we show that the values of $K$ obtained from the two methods are mutually consistent inside the incommensurate floating phase.", "url": "https://arxiv.org/abs/2606.16128", "type": "理论", "summary": "1. 该工作通过Friedel振荡与crosscap方法提取一维里德伯链中的Luttinger液体参数K，并刻画共度与非共度BKT相变。\n2. 技术核心在于利用多谐波拟合方案克服Friedel振荡非谐性，并与crosscap方法交叉验证，精确获取K在周期五及非共度浮相中的临界值。\n3. 该参数提取框架可推广至其他长程相互作用一维系统，为定量研究Luttinger液体普适行为及BKT相变提供可靠数值与解析基准。", "summary_source": "deepseek", "authors": [{"name": "Shu-Ao Liao"}, {"name": "Li-Ping Yang"}, {"name": "Jin Zhang"}], "featured_authors": [{"name": "Shu-Ao Liao"}, {"name": "Li-Ping Yang"}, {"name": "Jin Zhang"}], "author_count": 3}, {"id": "2606.16129", "category": "cond-mat", "title": "Collective relaxation eigenmodes and anisotropic magnon thermal transport in $α$-MnTe", "abstract": "The intrinsic magnon thermal transport in the altermagnet $\\alpha$-MnTe is studied by solving the three-dimensional linearized Boltzmann transport equation with the four-magnon collision matrix. Diagonalizing the collision matrix gives direct access to the relaxation eigenmodes beyond the relaxation-time approximation. We show that Umklapp scattering lifts the momentum-related zero modes of the Normal-only collision operator and substantially modifies the low-lying relaxation spectrum. Using the same collision matrix, we compute the magnon thermal conductivity tensor. The full linearized Boltzmann transport equation result exceeds the relaxation-time approximation by more than an order of magnitude at low temperature and reveals a strong transport anisotropy, with the out-of-plane thermal conductivity remaining larger than the in-plane component over the studied temperature range. A mode-resolved analysis shows that the dominant heat-carrying modes retain momentum-like character inherited from the Normal-only zero modes, and that the larger out-of-plane conductivity mainly originates from the stronger out-of-plane group-velocity contribution, rather than from a large difference in relaxation lifetimes.", "url": "https://arxiv.org/abs/2606.16129", "type": "理论+数值", "summary": "1. 该工作通过求解含四磁振子碰撞矩阵的三维线性化玻尔兹曼输运方程，系统研究了交替磁体α-MnTe的本征磁振子热输运行为。\n2. 其核心在于对角化碰撞矩阵以获取弛豫本征模，发现Umklapp散射提升简并零模并重塑低能弛豫谱，且全线性化结果在低温下超出弛豫时间近似逾一个量级，揭示强面外热导各向异性。\n3. 这为超越弛豫时间近似解析交替磁体热输运机制提供了直接谱分解框架，并启示了源于群速度而非弛豫寿命各向异性的主导热载流子图像。", "summary_source": "deepseek", "authors": [{"name": "Rui-Jie Yao"}, {"name": "Lei Wang"}, {"name": "Bo-Ye Sun"}], "featured_authors": [{"name": "Rui-Jie Yao"}, {"name": "Lei Wang"}, {"name": "Bo-Ye Sun"}], "author_count": 3}, {"id": "2606.16133", "category": "cond-mat", "title": "InvDesMobility: a reliability-gated first-principles feedback framework for closed-loop materials discovery", "abstract": "Inverse materials design starts from target functionality and searches for structures that can realize it. Its value in closed-loop discovery depends not only on prediction performance, but also on whether expensive first-principles results are independently validated, provenance-recorded, and admitted as feedback only when evidence is sufficient. This is especially important for composite properties such as carrier mobility, where a final scalar value hides intermediate quantities, fit quality, convergence history, and workflow assumptions. Here we present InvDesMobility, a reliability-gated first-principles feedback framework that integrates multi-agent automated DFT, evidence stratification, generative structure proposal, acquisition ranking, and auditable release. Using 516 2DMatPedia-derived candidates, the workflow produced 280 QC-passed materials and 573 retained carrier-direction seed channels after channel-level reliability gating. These records were split into two feedback objects: relaxed structures updated the generative model, while retained mobility channels trained the acquisition model and set validation priority. Over multiple iterations, InvDesMobility screened 2.4 x 10^6 structures, submitted 102 candidates for DFT validation, and retained 86 reliability-gated generated channels across 41 formulas. Overall, the main contribution is not a fixed list of high-mobility materials, but a transferable feedback contract that makes closed-loop inverse design both useful and auditable when learning from expensive calculated properties. All source data, retained feedback records, and workflows are available at this https URL , with an accompanying evidence website at this https URL .", "url": "https://arxiv.org/abs/2606.16133", "type": "理论+数值", "summary": "1. 本文提出InvDesMobility，一个可靠性门控的第一性原理反馈框架，用于闭环材料逆向设计，尤其针对载流子迁移率等复合目标性质。\n2. 其核心卖点在于集成多智能体自动DFT、证据分层与通道级可靠性门控，确保昂贵第一性原理结果经独立验证后才作为可审计反馈纳入生成模型与采集模型。\n3. 该框架不提供固定高迁移率材料列表，而是建立一个可迁移的反馈契约，使闭环逆向设计在依赖计算性质时同时具备实用性和可审计性。", "summary_source": "deepseek", "authors": [{"name": "Wen-Kao Li"}, {"name": "Ze-Feng Gao"}, {"name": "Peng-Jie Guo"}, {"name": "Wei Ji"}, {"name": "Zhong-Yi Lu"}], "featured_authors": [{"name": "Wen-Kao Li"}, {"name": "Ze-Feng Gao"}, {"name": "Peng-Jie Guo"}, {"name": "Wei Ji"}, {"name": "Zhong-Yi Lu"}], "author_count": 5}, {"id": "2606.16169", "category": "cond-mat", "title": "A Geometrically Exact Treatment of Percolation Through Voids around Faceted Regular and Structurally Disordered Grains", "abstract": "Fluid and charge flow through interstitial volumes among impermeable randomly placed grains in porous materials ceases to occur at a critical concentration where networks of void volumes are disrupted at macroscopic scales. This critical density for void percolation can be difficult to calculate due to the irregular shape of the void regions. We develop and implement a geometrically exact method, scaling only linearly in the system volume, for identifying the shape and size of contiguous voids. In this manner, we calculate percolation thresholds for both grain cluster percolation (where system spanning networks of overlapping grains begin to appear with increasing density) and void percolation at much higher grain concentrations where networks of interstitial volumes no longer exist on macroscopic scales. For both the former and the latter, we calculate critical concentrations for inclusions in the shape of the Platonic solids (as well as truncated icosahedra) for both aligned and randomly oriented grains. In the case of critical densities for void percolation, the accuracy of our results is significantly improved relative to prior benchmarks. We also incorporate structural disorder of inclusions by considering impermeable grains in the form of cubes subject to a series of randomly placed and oriented fracture planes to mimic aggressively fractured inclusions found in nature. As the number of sustained slices becomes large, we find that the critical porosity for void percolation tends to 5%", "url": "https://arxiv.org/abs/2606.16169", "type": "理论", "summary": "1. 该工作发展了几何精确且计算复杂度线性于系统体积的方法，用于确定多孔介质中不可渗透不规则颗粒间连续空隙的形状与尺寸。\n2. 其技术核心在于精确计算柏拉图立体颗粒（含取向无序）及受随机断裂面切割立方体的团簇渗流与空隙渗流阈值，并发现随结构无序增强空隙渗流临界孔隙度趋于5%。\n3. 这为多孔材料中流体与电荷传输的精确预测提供了新途径，尤其对自然界复杂破碎颗粒系统的渗流行为研究具有直接启发意义。", "summary_source": "deepseek", "authors": [{"name": "D. J. Priour Jr"}], "featured_authors": [{"name": "D. J. Priour Jr"}], "author_count": 1}, {"id": "2606.16217", "category": "cond-mat", "title": "symveig: Verified eigenvalue enclosures for symmetry-decomposed Hermitian matrices", "abstract": "Exact diagonalization of quantum lattice Hamiltonians returns floating-point eigenvalues whose accuracy is not certified: rounding error, eigensolver behaviour, and ill-conditioning can corrupt a result without warning. We present \\texttt{symveig}, a pure NumPy/SciPy package that computes rigorous, machine-checkable enclosures of all eigenvalues of a Hermitian matrix, with an optional symmetry-sector decomposition. For a matrix that commutes with an abelian conserved quantity diagonal in the working basis (for example the total magnetization of a spin model), the package verifies each symmetry sector independently. Because each sector block is much smaller than the full matrix, this yields enclosures that are both tighter (by a factor of $3$-$9$ across system sizes $L = 4$-$12$) and dramatically faster (a wall-clock speedup of up to $130\\times$ at $L = 12$) than verifying the full matrix, while never forming or diagonalizing it. Every enclosure half-width is a guaranteed upper bound on the distance from a computed eigenvalue to the nearest true eigenvalue under IEEE~754 round-to-nearest arithmetic, obtained by explicit floating-point error analysis with no heuristic slack. The implementation requires neither INTLAB nor MATLAB, bringing rigorously verified eigenvalue enclosure into the standard scientific-Python stack used in computational physics. We validate the package on $1$D Heisenberg (open and periodic), $J_1$-$J_2$ Heisenberg, and $2$D Heisenberg lattices, confirming that every computed eigenvalue is contained in its enclosure across all tested configurations.", "url": "https://arxiv.org/abs/2606.16217", "type": "理论+数值", "summary": "1. 该工作提出一个纯NumPy/SciPy包symveig，对与对角阿贝尔守恒量对易的Hermitian矩阵计算所有特征值的严格包围。\n2. 其核心在于通过对称扇区分解避免形成全矩阵，结合显式浮点误差分析，获得IEEE 754算术下的保证上界，包围更紧且计算加速高达130倍。\n3. 这为量子晶格哈密顿量精确对角化的数值可靠性提供了机器可验证保障，可推广至标准科学Python计算栈中其他特征值问题。", "summary_source": "deepseek", "authors": [{"name": "Sarang Vehale"}, {"name": "Ritu Goel"}], "featured_authors": [{"name": "Sarang Vehale"}, {"name": "Ritu Goel"}], "author_count": 2}, {"id": "2606.16225", "category": "cond-mat", "title": "The free energy of the square lattice Ising model with interactions alternating in horizontal and vertical directions", "abstract": "The free energy of the Ising model on the square lattice with alternating interactions in both horizontal and vertical directions is exactly derived. This model is distinct from the checkerboard Ising model. The result includes Onsager's free energy as a special case, and also includes Lee-Yang's free energy with an imaginary field, and relates these two solutions via continuous parameters. It is also derived that each imaginary magnetic field $i\\pi/2$ applied to a lattice site corresponds to a single frustrated square in its dual lattice.", "url": "https://arxiv.org/abs/2606.16225", "type": "理论", "summary": "1. 该工作严格推导了正方晶格上水平与垂直方向交互作用交替变化的Ising模型的自由能。\n2. 其核心在于通过连续参数统一了Onsager解与含虚磁场iπ/2的Lee-Yang解，并揭示每个虚磁场对应其对偶晶格中的一个受挫方形。\n3. 这为研究更一般交错相互作用及虚磁场诱导受挫提供精确可解范例，可启发相关统计系统的新解析方法。", "summary_source": "deepseek", "authors": [{"name": "Kazuhiko Minami"}], "featured_authors": [{"name": "Kazuhiko Minami"}], "author_count": 1}, {"id": "2606.16233", "category": "cond-mat", "title": "Hidden chirality and half-vortex formation in exciton-polariton condensates", "abstract": "We show that a radially symmetric, nonresonantly pumped spinor exciton-polariton condensate can acquire chirality without a rotating drive, chiral geometry, or pump orbital angular momentum. Spin relaxation in a two-reservoir system shifts the reservoir-induced blueshift relative to the gain profile, creating an effective non-Hermitian chiral potential. A reduced angular-mode theory reveals tunable exceptional points and non-reciprocal coupling between counter-rotating modes. Full driven-dissipative Gross-Pitaevskii simulations show that this hidden chirality enables all-optical formation of spin-selective half-vortices.", "url": "https://arxiv.org/abs/2606.16233", "type": "理论+数值", "summary": "1. 该工作揭示非共振泵浦自旋激子极化激元凝聚体可在无旋转驱动、手性几何或轨道角动量条件下自发获得隐藏手性。\n2. 核心物理在于双储层自旋弛豫使储层诱导蓝移相对增益分布移动，形成非厄米手性势，导致反向旋转模式间出现可调异常点和非互易耦合。\n3. 这为在全光学条件下形成自旋选择性半涡旋提供新机制，有望推广至其他驱动耗散玻色子系统实现无外场手性操控。", "summary_source": "deepseek", "authors": [{"name": "A. N. Osipov"}, {"name": "I. Y. Chestnov"}, {"name": "P. G. Lagoudakis"}, {"name": "A. V. Yulin"}], "featured_authors": [{"name": "A. N. Osipov"}, {"name": "I. Y. Chestnov"}, {"name": "P. G. Lagoudakis"}, {"name": "A. V. Yulin"}], "author_count": 4}, {"id": "2606.16249", "category": "cond-mat", "title": "Multiband transport hierarchy and large Nernst effect in EuAuBi: Establishing a Nernst scaling for asymmetric multiband systems", "abstract": "In correlated materials, coexisting pockets of vastly different carrier densities raise two fundamental questions: which pocket governs the various transport coefficients, and does the conventional Nernst scaling $\\nu/T \\propto \\mu/E_F$, originally derived for single-band systems, still hold? We address both questions in the polar semimetal EuAuBi, where a dilute electron pocket ($n_e \\sim 10^{16}~\\mathrm{cm}^{-3}$) coexists with a dense hole pocket ($n_h \\sim 10^{21}~\\mathrm{cm}^{-3}$). We find a clear hierarchy: the hole pocket dominates the longitudinal resistivity; the Hall effect crosses from electron- to hole-dominance with increasing field; the Seebeck coefficient is dominated by the electron pocket at low temperature and by both pockets at high temperature. Remarkably, the Nernst effect is governed entirely by the ultrahigh-mobility electron pocket, yielding a large low-field signal of $\\sim 5~\\mu\\mathrm{V/K}$ near 1~T at 202~K, comparable to anomalous Nernst signals in magnetic Weyl semimetals. By analyzing the two-band thermoelectric conductivity, we show that the Nernst coefficient follows a scaling $\\nu/T \\propto \\mu_e/{E_{F, tot}}$. This scaling originates from a compensation between the electron-to-hole conductivity ratio and the Fermi-energy ratio, establishing that the large Nernst effect is a semiclassical multiband phenomenon rather than a topological Berry-curvature contribution. This understanding advances the thermoelectric transport physics of multiband electronic systems and offers a guiding principle for low-field transverse thermoelectric design.", "url": "https://arxiv.org/abs/2606.16249", "type": "理论", "summary": "1. 该工作系统研究了极性半金属EuAuBi中稀电子口袋与稠空穴口袋共存的输运层级，确定了各输运系数的主导能带。\n2. 核心发现是能斯特效应完全由超高迁移率电子口袋支配，并建立了标度关系ν/T ∝ μ_e/E_{F,tot}，其源于电子-空穴电导率比与费米能比的补偿机制。\n3. 这一纯半经典多能带起源的解释排除了拓扑贝里曲率贡献，为低场横向热电设计提供了基于载流子浓度不对称性的指导原则。", "summary_source": "deepseek", "authors": [{"name": "Weimin Quan"}, {"name": "Xiaodong Guo"}, {"name": "Lingxiao Zhao"}, {"name": "Shengwei Chi"}, {"name": "Gang Xu"}, {"name": "Zengwei Zhu"}, {"name": "Xiaokang Li"}], "featured_authors": [{"name": "Weimin Quan"}, {"name": "Xiaodong Guo"}, {"name": "Lingxiao Zhao"}, {"name": "Gang Xu"}, {"name": "Zengwei Zhu"}, {"name": "Xiaokang Li"}], "author_count": 7}, {"id": "2606.16260", "category": "cond-mat", "title": "Tuning superconductivity and charge density wave order by next-nearest-neighbor hopping integral in honeycomb Holstein model", "abstract": "By using unbiased determinant quantum Monte Carlo simulations, we investigate the interplay between superconductivity and charge density wave order in the Holstein model on a honeycomb lattice with next-nearest-neighbor hopping \\(t^{\\prime}\\). We find that a finite negative \\(t^{\\prime}\\) enhances \\(s\\)-wave superconducting pairing susceptibility near the van Hove fillings in the weak electron-phonon coupling regime, while it suppresses superconductivity and promotes charge density wave order at intermediate electron-phonon coupling strengths. The effect of \\(t^{\\prime}\\) on a charge density wave is filling-dependent: It suppresses the charge density wave at half filling but enhances it near the van Hove singularities. A spectral analysis reveals the opening of a gap at low temperatures, highlighting the competitive relationship between superconducting and charge density wave orders mediated by electron-phonon coupling and tuned by \\(t^{\\prime}\\).", "url": "https://arxiv.org/abs/2606.16260", "type": "理论+数值", "summary": "1. 该工作利用无偏行列式量子蒙特卡洛模拟，系统研究了蜂窝晶格Holstein模型中次近邻跳跃积分t′对超导与电荷密度波序的竞争调控。\n2. 其核心发现是：负t′在弱电子-声子耦合下增强范霍夫填充附近的s波超导配对，而在中等耦合下抑制超导并促进电荷密度波序，且该效应具有明显的填充依赖性。\n3. 这揭示了通过次近邻跳跃可有效调谐电子-声子耦合体系中的量子有序竞争，为理解相关晶格模型中的超导与电荷密度波共存与竞争提供了新的调控维度。", "summary_source": "deepseek", "authors": [{"name": "Hongxing Liu"}, {"name": "Lufeng Zhang"}, {"name": "Tianxing Ma"}], "featured_authors": [{"name": "Hongxing Liu"}, {"name": "Lufeng Zhang"}, {"name": "Tianxing Ma"}], "author_count": 3}, {"id": "2606.16314", "category": "cond-mat", "title": "Endoreversible Carnot machines with long-time reversible limit", "abstract": "The well-known Curzon-Ahlborn (CA) engine [Am. J. Phys. {\\bf 43}, 22 (1975)] runs in finite time and yields a finite power output. In order to recover the standard Carnot cycle from the CA model, the limit of quasi-static operation has to be concurrent with the reversible limit, a condition strangely missing from the CA model. We augment this model by specifying the duration of the isothermal process as a monotonic decreasing function of the temperature difference between the working substance and the reservoir. As an illustration, we analyze the machine's operation in the low-dissipation regime in which the entropy production in each isothermal branch is inversely proportional to the duration of the process. The modified model is able to determine the optimal durations of isothermal processes as well as heat and work per cycle, while retaining the optimal power conditions of the CA model.", "url": "https://arxiv.org/abs/2606.16314", "type": "理论", "summary": "1. 该工作改进Curzon-Ahlborn有限时间热机模型，通过规定等温过程持续时间随温差单调递减，使其在长时间极限下可恢复可逆卡诺循环。\n2. 关键技术在于低耗散区域内，新模型保留原最优功率条件，同时可确定最优过程持续时间和每循环的功与热。\n3. 这为统一描述不可逆到可逆极限的连续过渡提供了理论框架，并可指导实际有限时间热机的优化设计。", "summary_source": "deepseek", "authors": [{"name": "Ramandeep S. Johal"}, {"name": "Rajeshree Chakraborty"}], "featured_authors": [{"name": "Ramandeep S. Johal"}, {"name": "Rajeshree Chakraborty"}], "author_count": 2}, {"id": "2606.16320", "category": "cond-mat", "title": "Implementation of rotational invariance for first-principles phonons and application to low-dimensional materials", "abstract": "The acoustic flexural (phonon) modes of low-dimensional materials should show a quadratic dispersion close to the Brillouin zone center. Any departure from this behavior in Density Functional Theory calculations is typically associated with a breaking of the rotational invariance, with few methods available to correct it. In this work, we reexamine this issue based on a reciprocal-space imposition of this condition, with corrections on the zone-center IFCs and their first and second derivatives with respect to the phonon wavevector. We propose two correction schemes for the short-range part of the interatomic force constants, one based on the Moore-Penrose pseudoinverse, that we implement in the ABINIT software package, and one based on the straight modification of the on-site antisymmetric part of the first-order derivative of the dynamical matrix with respect to the wavevector. We investigate the impact of imposing rotational invariance for different system dimensionalities and pseudopotentials. Finally, we discuss rotational invariance in the context of long-range electrostatics contribution to the IFCs. We observe that the usual treatment of electrostatics is by construction not rotationally invariant. This is found especially critical when correcting the second derivatives of the IFCs.", "url": "https://arxiv.org/abs/2606.16320", "type": "理论+数值", "summary": "1. 该工作基于倒易空间条件修正低维材料第一性原理声子计算中转动不变性的破坏，提出两种短程力常数修正方案。\n2. 其技术要点在于通过Moore-Penrose伪逆或动力学矩阵一阶导数的原位反对称修正，确保区中心声子二次色散，并揭示长程静电贡献固有不满足转动不变性。\n3. 这为低维材料声子谱的精确计算提供了可靠修正框架，并提示重新审视静电相互作用对转动不变性的关键影响。", "summary_source": "deepseek", "authors": [{"name": "Benoit Van Troeye"}, {"name": "Xavier Gonze"}, {"name": "Geoffrey Pourtois"}], "featured_authors": [{"name": "Benoit Van Troeye"}, {"name": "Xavier Gonze"}, {"name": "Geoffrey Pourtois"}], "author_count": 3}, {"id": "2606.16338", "category": "cond-mat", "title": "Non-stationary longitudinal Josephson effect in electron-hole bilayers", "abstract": "The non-stationary longitudinal Josephson effect in bilayer systems with pairing of spatially separated electrons and holes is investigated. The tunneling current between two (right and left) weakly coupled electron-hole condensates is analyzed in the presence of an external voltage applied along the layers. Two limiting regimes are considered: the high-density regime, where pairing occurs in momentum space similarly to conventional superconductors, and the low-density regime corresponding to a Bose-Einstein condensate of spatially indirect excitons. Using the tunneling Hamiltonian approach, expressions for the quasiparticle, superconducting and interference contributions to the tunneling current are derived. It is shown that in the high-density limit the quasiparticle and interference currents vanish at zero temperature below a threshold voltage determined by the energy gap, so that only the supercurrent remains. In contrast, in the low-density regime the gapless spectrum of collective excitations leads to finite dissipative contributions even at zero temperature, resulting in damping of Josephson oscillations. For spatially separated tunneling barriers with distance exceeding the coherence length, phase jumps occur at each barrier, resulting in voltage oscillations across the electron and hole barriers and a non-sinusoidal current-phase relation governed by the critical currents of the two barriers.", "url": "https://arxiv.org/abs/2606.16338", "type": "理论", "summary": "1. 该工作利用隧穿哈密顿方法分析了电子-空穴双层系统中沿层施加电压时的非平稳纵向约瑟夫森效应，并考虑了高密度与低密度两种极限情形。\n2. 其核心在于揭示了高密度极限下准粒子和干涉电流在低于能隙阈值时完全消失仅剩超流，而低密度极限下无能隙集体激发导致零温耗散并使约瑟夫森振荡阻尼。\n3. 这为空间分离电子-空穴凝聚体的非平稳输运提供了理论框架，并对分离势垒间距超过相干长度时相位跳跃引发的非正弦电流-相位关系给出了预测。", "summary_source": "deepseek", "authors": [{"name": "O.M. Konstantynov"}, {"name": "S.I. Shevchenko"}], "featured_authors": [{"name": "O.M. Konstantynov"}, {"name": "S.I. Shevchenko"}], "author_count": 2}, {"id": "2606.16339", "category": "cond-mat", "title": "Thermodynamic Uncertainty Relation For a Multi-Phase Alternating Renewal Random Walk", "abstract": "Thermodynamic Uncertainty Relations (TURs) impose universal bounds linking current precision to entropy production in nonequilibrium systems. While general bounds like the Proesmans--Van den Broeck (PV) relation provide a broad framework, they often remain loose for processes characterized by renewal events. In this work, we derive a generalized entropic bound for current fluctuations in renewal-reward processes. By utilizing a rigorous variance decomposition within the framework of renewal-reward theory, we obtain a model-independent bound that is not only rigorous but tighter than the standard PV relation. Notably, in the linear-response regime, our bound correctly scales with the renewal rate and identifies a precision penalty arising from cycle-length fluctuations. These results provide a physically informative constraint on the precision of run-and-tumble-type dynamics and highlight the universal limits of transport in complex stochastic walkers.", "url": "https://arxiv.org/abs/2606.16339", "type": "理论", "summary": "1. 该工作推导了多相交替更新随机游走过程中电流涨落的热力学不确定关系，给出了一个广义熵界。\n2. 基于更新-奖励理论的严格方差分解，得到了模型无关且比Proesmans–Van den Broeck关系更紧的界，线性响应下正确标度于更新率，并识别出周期长度涨落导致的精度惩罚。\n3. 该结果为run-and-tumble类动力学及复杂随机游走的输运精度提供了物理可解释的通用约束，并指出周期涨落是限制精度的基本因素。", "summary_source": "deepseek", "authors": [{"name": "Fatemeh Karimi"}, {"name": "Farhad H. Jafarpour"}], "featured_authors": [{"name": "Fatemeh Karimi"}, {"name": "Farhad H. Jafarpour"}], "author_count": 2}, {"id": "2606.16399", "category": "cond-mat", "title": "Non-Equilibrium Model Selection via Finite-Time Thermodynamics", "abstract": "Information criteria such as WAIC and WBIC extend model selection to singular learning machines, but they are usually derived for equilibrium posteriors. We formulate a finite-time analogue of WBIC by replacing the equilibrium posterior with an effective ensemble generated by learning dynamics under a resource constraint. When this ensemble admits an analytic effective potential, singular learning theory yields a resource-dependent real log canonical threshold. The resulting estimator gives a computable thermodynamic contribution to time-bounded MDL and identifies the finite-time singular complexity relevant to the structural information measured by epiplexity.", "url": "https://arxiv.org/abs/2606.16399", "type": "理论", "summary": "1. 该工作将模型选择的信息准则推广至非平衡情景，利用有限时间热力学框架替代平衡后验。\n2. 其核心是通过学习动力学生成有效系综并导出资源依赖的实对数典型阈值，量化有限时间奇异复杂性。\n3. 这为理解资源约束下学习动力学的热力学解释提供了基础，并启示了时间有界MDL及结构信息测度的新发展。", "summary_source": "deepseek", "authors": [{"name": "Masayuki Ohzeki"}], "featured_authors": [{"name": "Masayuki Ohzeki"}], "author_count": 1}, {"id": "2606.16424", "category": "cond-mat", "title": "Real-space spectral functions of three-dimensional billion-size topological non-Hermitian matter with tensor networks", "abstract": "Non-Hermitian systems host a wide range of unconventional topological phenomena while large-scale simulations in finite three dimensional systems remain challenging because of the rapidly growing number of sites. In particular, higher-order topological corner modes are often studied only in small lattices, where strong finite-size effects can mask their intrinsic behavior. Here, we develop a tensor-network framework that combines quantics tensor cross interpolation with the kernel polynomial method, enabling compact representations of large non-Hermitian tight-binding Hamiltonians and direct calculations of real-space spectral functions for systems exceeding one billion lattice sites. Using this approach, we investigate three-dimensional non-Hermitian higher-order topological insulators with with structured real-space geometries. The unprecedented system size enables direct access to the macroscopic regime and allows corner-mode spectral responses to be resolved in genuinely three-dimensional this http URL tuning the loss strength, we identify distinct in-gap corner modes across weak- and strong-loss this http URL results establish tensor-network algorithms as a powerful strategy to perform real-space spectral calculations in exceptionally large non-Hermitian systems.", "url": "https://arxiv.org/abs/2606.16424", "type": "理论+数值", "summary": "1. 该工作发展了一种融合quantics张量交叉插值与核多项式方法的张量网络框架，实现了对超过十亿格点的三维非厄米高阶拓扑绝缘体实空间谱函数的直接计算。\n2. 其核心在于通过紧凑表示非厄米紧束缚哈密顿量，首次在宏观尺度下分辨出弱损耗与强损耗区中具有不同特征的带隙内角模谱响应。\n3. 这确立了张量网络算法作为超大非厄米系统实空间谱计算的有效策略，为深入理解三维非厄米拓扑物质在热力学极限下的行为提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Yitao Sun"}, {"name": "Jose L. Lado"}, {"name": "Guangze Chen"}], "featured_authors": [{"name": "Yitao Sun"}, {"name": "Jose L. Lado"}, {"name": "Guangze Chen"}], "author_count": 3}, {"id": "2606.16443", "category": "cond-mat", "title": "Persistence Properties of a Phase-ordering System with Competing Dynamics", "abstract": "We investigate the persistence properties during phase ordering in the two-dimensional ($d=2$) Ising model evolving under competing nonconserved spin-flip and conserved spin-exchange dynamics by means of Monte Carlo simulations at zero temperature. We examine three distinct persistence probabilities: (i) the total persistence probability, defined as the probability that a lattice site has never experienced a change in the sign of the spin residing there; (ii) the spin-flip persistence probability, which exclusively measures the fraction of sites that have never undergone a spin-flip event; and (iii) the composite persistence probability, defined as the fraction of sites that have experienced neither a spin-flip nor a spin-exchange event. In the asymptotic regime, both the total and spin-flip persistence probabilities exhibit identical power-law decay, irrespective of the relative occurrence probability of the spin-flip move $p_r$. The corresponding persistence exponent $\\theta_i \\approx 0.225$, is found to be consistent with the value reported for systems evolving purely under nonconserved dynamics. We further demonstrate that both persistence measures satisfy the scaling relation $d-d_f^i=\\theta_i/\\alpha_i$, where $d_f^i$ is the fractal dimension of the corresponding persistence lattice and $\\alpha_i\\approx 1/2$ characterizes the asymptotic power-law growth of spatially correlated regions of non-persistent spins. In contrast, although the composite persistence probability also exhibits asymptotic power-law decay, both the corresponding persistence exponent $\\theta_{\\rm c}$ and the fractal dimension $d_f^{\\rm c}$ of the persistence lattice show strong dependence on $p_r$. Combined with the presence of a universal growth exponent $\\alpha_{\\rm c}\\approx 1/2$, this leads to the breakdown of the scaling relation among the characteristic exponents for the composite persistence.", "url": "https://arxiv.org/abs/2606.16443", "type": "理论+数值", "summary": "1. 该工作通过二维伊辛模型的零温蒙特卡洛模拟，研究了非守恒自旋翻转与守恒自旋交换竞争动力学下相序过程中的三种持续概率。\n2. 技术要点在于发现总持续概率与自旋翻转持续概率的幂律衰减指数相同（θ≈0.225），且满足标度关系d−d_f^i=θ_i/α_i，而复合持续概率的指数则强烈依赖于自旋翻转概率。\n3. 这揭示了竞争动力学中不同持续测度的普适性与依赖性，为理解非平衡标度关系及相序系统的时间演化行为提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Shubham Thwal"}, {"name": "Suman Majumder"}], "featured_authors": [{"name": "Shubham Thwal"}, {"name": "Suman Majumder"}], "author_count": 2}, {"id": "2606.16459", "category": "cond-mat", "title": "Superconducting diode effect via Floquet topological Fulde-Ferrell phase in driven Rashba nanowire", "abstract": "Much has been studied on Floquet engineering in Rashba nanowire model regarding topological superconductivity hosting Majorana $0$- and anomalous $\\pi$-modes, here we theoretically investigate the possible emergence of finite momentum Fulde-Ferrell (FF) superconducting state in quasi-energy of the above model under the periodic modulation of in-plane and out-of-plane magnetic fields while the static limit does not host a FF ground state. We demonstrate controllable switching between Floquet Majorana $0$- and $\\pi$-modes via reversal of the supercurrent direction, revealing pronounced nonreciprocal supercurrent signatures which is a manifestation of the FF pairing. We validate the onset of FF pairing following a self-consistent mean-field analysis where externally applied supercurrent facilitates nonreciprocal signatures in quasi-energy spectra. The above findings directly indicates to the intriguing phenomenon of superconducting diode effect (SDE). The drive amplitude serves as a parameter to regulate the diode efficiency with chemical potential. Our study thus reveals a rich interplay between Floquet topological superconductivity and finite-momentum FF pairing, providing a tunable way to switch between different Floquet Majorana modes and realize the SDE with high efficiency.", "url": "https://arxiv.org/abs/2606.16459", "type": "理论", "summary": "1. 该工作理论研究了周期性驱动Rashba纳米线中准能谱的有限动量Fulde-Ferrell超导态，其静态极限下不存在该配对。\n2. 通过超流方向反转实现Floquet Majorana 0模与π模的可控切换，结合自洽平均场分析验证非互易超流谱特征，揭示超导二极管效应。\n3. 驱动幅度可调节二极管效率，为在Floquet拓扑超导体系中实现高效超导二极管及Majorana模切换提供了可调途径。", "summary_source": "deepseek", "authors": [{"name": "Sayak Bhowmik"}, {"name": "Arijit Saha"}, {"name": "Tanay Nag"}], "featured_authors": [{"name": "Sayak Bhowmik"}, {"name": "Arijit Saha"}, {"name": "Tanay Nag"}], "author_count": 3}, {"id": "2606.16483", "category": "cond-mat", "title": "Geometric decomposition of the $d$-dimensional hard-sphere partition function", "abstract": "We introduce a geometric decomposition of the hard-sphere partition function. Using a close-packing-inspired geometric bound on the available insertion volume, made rigorous when a corresponding local density certificate is available, we establish a reference upper bound $Q^\\ast$ on the configurational integral. Factoring this upper bound out of the statistical geometric partition function of Speedy yields a new form for the $d$-dimensional partition function, $Q(N,V,T)=Q^\\ast \\exp(-N \\mathcal{J})$, where $\\mathcal{J}$ depends strictly on the boundary-to-volume ratio of the voids and the close-packing density. Overall, this work deepens our statistical geometric understanding of the hard-sphere system.", "url": "https://arxiv.org/abs/2606.16483", "type": "理论", "summary": "1. 该工作引入了一个d维硬球系统配分函数的几何分解方案。\n2. 其核心在于利用密堆积启发的插入体积几何上界，将配分函数分解为参考上界Q*与仅依赖于空隙边界比和密堆积密度的指数因子之积。\n3. 这为从统计几何角度深入理解硬球系统提供了新框架，并可能推广至其他短程排斥相互作用系统。", "summary_source": "deepseek", "authors": [{"name": "Luke K. Davis"}], "featured_authors": [{"name": "Luke K. Davis"}], "author_count": 1}, {"id": "2606.16536", "category": "cond-mat", "title": "Vortex-core size and quantum geometry in flat-band superconductors", "abstract": "We investigate the real-space vortex structure of a flat-band superconductor described by the attractive Hubbard model on the Mielke checkerboard lattice. Using a momentum-space mean-field analysis, we derive a closed-form expression for the coherence length in terms of the quantum metric of the Bloch states and a particle-hole-symmetric pair density. Self-consistent Bogoliubov-de Gennes calculations on a finite disk confirm this prediction across a wide range of fillings and interaction strengths. The coherence length is minimized at half filling, diverges toward both band edges as the pair density vanishes, and depends only logarithmically on the interaction strength. These features differ qualitatively from the conventional BCS picture, which relies on a well-defined Fermi surface and a kinetic mechanism for pair transport. Instead, the vortex-core size is governed by a geometric pair mass arising from virtual interband processes encoded in the quantum metric. Our results establish the vortex core as a direct real-space manifestation of flat-band quantum geometry.", "url": "https://arxiv.org/abs/2606.16536", "type": "理论+数值", "summary": "1. 该工作通过动量空间平均场分析和自洽Bogoliubov-de Gennes计算，研究了Mielke棋盘格上吸引Hubbard模型平带超导体的实空间涡旋结构。\n2. 其核心卖点在于推导出相干长度与Bloch态量子度量及粒子-空穴对称对密度的闭式关系，揭示了涡旋核心尺寸由虚拟带间过程产生的几何对质量主导，偏离传统BCS图像。\n3. 这确立了涡旋核心作为平带量子几何直接实空间表现，为理解几何效应在超导涡旋物理中的角色提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "M. Özkurt"}, {"name": "M. Iskin"}], "featured_authors": [{"name": "M. Özkurt"}, {"name": "M. Iskin"}], "author_count": 2}, {"id": "2606.16550", "category": "cond-mat", "title": "Lattice Matching Dictates the Growth Mode and Quality of Deuterium Crystallization in Confined Spherical Shells", "abstract": "Cryogenic hydrogen isotope fuel layers with high structural integrity and atomic-scale smoothness are prerequisites for symmetric implosion and ignition in inertial confinement fusion (ICF). Using deuterium (D$_2$) as model fuel, we perform large-scale molecular dynamics simulations with a Feynman-Hibbs corrected Silvera-Goldman potential to describe nuclear quantum effects at low temperatures, systematically investigating D$_2$ crystallization inside spherical ablator capsules. By varying substrate lattice constant from 3.1 angstrom to 3.9 angstrom, we demonstrate that lattice matching dictates the transition from coherent epitaxial growth to polycrystalline formation, establishing it as the primary design principle for high-performance targets. When the substrate lattice closely matches the equilibrium hexagonal-close-packed (HCP) spacing of cryogenic D$_2$ (approximately 3.5 angstrom), D$_2$ forms coherent layer-by-layer epitaxial growth consistent with Ostwald's stepwise nucleation theory, yielding HCP-dominated near-single crystals with minimal dislocations and ultra-smooth inner surfaces. In contrast, large lattice mismatch destabilizes coherent growth and causes island-like growth, producing polycrystalline structures with mixed HCP/FCC phases, elevated defects, and greatly increased surface roughness. Radial stress analysis shows that interfacial stress from mismatch localizes within 2-3 molecular layers near the interface, triggering subsequent defect-mediated growth. These findings highlight substrate lattice matching in regulating confined solid growth and crystallization quality, establish it as a key principle for ablator inner-surface engineering in ICF cryogenic targets, and offer atomic guidance for growing high-quality single-crystal deuterium-tritium (DT) fuel layers with optimal smoothness.", "url": "https://arxiv.org/abs/2606.16550", "type": "理论+数值", "summary": "1. 该工作采用Feynman-Hibbs修正的Silvera-Goldman势进行大尺度分子动力学模拟，以氘为模型燃料，系统研究了球形烧蚀壳内衬底晶格常数变化对低温氘结晶生长模式与晶体质量的影响。\n2. 其核心发现是衬底晶格匹配度决定生长模式从共格外延（符合奥斯特瓦尔德逐级成核，生成六角密堆积主导近单晶，位错极少且内表面超光滑）到岛状多晶（混合六角/面心立方相、高缺陷密度、表面粗糙）的转变，且界面失配应力仅局域于2-3分子层内并触发缺陷介导生长。\n3. 这一工作确立了晶格匹配作为惯性约束聚变低温靶内表面工程的关键设计原理，为生长高完整性、原子级光滑的氘氚单晶燃料层提供了原子尺度指导，并对其他受限结晶体系具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Peng Bi"}, {"name": "Yu-Shen Wan"}, {"name": "Wei Zhang"}, {"name": "Jian Chen"}, {"name": "Yong Yi"}, {"name": "Qi-Feng Chen"}], "featured_authors": [{"name": "Peng Bi"}, {"name": "Yu-Shen Wan"}, {"name": "Wei Zhang"}, {"name": "Jian Chen"}, {"name": "Yong Yi"}, {"name": "Qi-Feng Chen"}], "author_count": 6}, {"id": "2606.16622", "category": "cond-mat", "title": "Intervalley coherence and flavor polarization in three-valley moiré systems", "abstract": "We investigate interaction-induced symmetry breaking in moiré superlattices created by twisting two identical materials where the electronic low-energy degrees of freedom reside in the vicinity of the $M$ points. Based on general symmetry arguments, we identify and classify the possible candidate instabilities that, besides flavor polarized states, also involve a variety of intervalley-coherent (IVC) orders. This complexity is related primarily to the presence of three valleys, instead of the well-studied scenario of two, e.g., in graphene: IVC states can couple all three valleys identically, with a non-trivial sign structure, or even with different magnitudes. We study the energetics using an analytical strong-coupling framework and unrestricted Hartree-Fock applied to the full continuum model, with very good agreement between the two approaches. Interestingly, depending on stacking, IVC instabilities not only appear due to superexchange at moderate bandwidths, but also deep in the strong-coupling regime as a result of deviations from the flat-metric condition. Our work demonstrates that twisted $M$-point materials provide a rich playground for complex correlated physics and highlights differences and similarities to twisted multilayer graphene.", "url": "https://arxiv.org/abs/2606.16622", "type": "理论+数值", "summary": "1. 该工作通过对称性分析和多方法计算，系统研究了扭曲M点莫尔系统中三谷相互作用诱导的对称性破缺，识别并分类了味道极化态与多种谷间相干（IVC）序。\n2. 其关键卖点在于揭示IVC序可均匀或不等幅耦合三个谷，且失稳不仅源于中等带宽下的超交换，更在强耦合区因偏离平带度条件而出现，解析与数值结果高度一致。\n3. 这为探索三谷莫尔系统的丰富关联物理提供了理论框架，并突出了与扭曲双层石墨烯在序类型和形成机制上的异同。", "summary_source": "deepseek", "authors": [{"name": "Jeyong Park"}, {"name": "Laura Classen"}, {"name": "Mathias S. Scheurer"}], "featured_authors": [{"name": "Jeyong Park"}, {"name": "Laura Classen"}, {"name": "Mathias S. Scheurer"}], "author_count": 3}, {"id": "2606.16674", "category": "cond-mat", "title": "Possible high temperature superconductivity induced by coupling to proximate hyperbolic photon modes", "abstract": "The hyperbolic mode (HM) refers to a polariton mode in a polar insulator where the dielectric function is negative in some direction of propagation. Within a frequency window the light occupies a greatly expanded region in momentum space. The HM in hexagonal Boron Nitride (hBN) has been under intense study and we consider placing a metal directly on top hBN and ask whether its physical properties can be strongly affected. While the problem resembles superficially the electron phonon coupling problem, there are important differences. Due to the longitudinal nature of the HM mode the coupling is driven by time dependent charge fluctuations which results in a coupling that strongly increases with the energy difference of the initial and final states. We find a significant modification of the wavefunction and velocity renormalization and we identify the dimensionless coupling constant $\\lambda_0$ that controls this effect. The virtual exchange of HM leads to a repulsive interaction. However, due to its strong energy dependence, pairing is possible by a process analogous to the Anderson-Morel mechanism, but in energy space instead of frequency space. We estimate the effective pairing interaction and find that very high $T_c$ is possible, even for small $\\lambda_0$ where the theory is controlled. We provide estimates using realistic parameters.", "url": "https://arxiv.org/abs/2606.16674", "type": "理论", "summary": "1. 该工作考虑将金属直接置于具有双曲模式（HM）的六方氮化硼（hBN）之上，研究通过耦合近邻HM诱导高温超导的可能性。\n2. 其核心在于HM的纵向特性导致耦合强度随初始与终态能量差显著增大，从而在能量空间实现类Anderson-Morel机制的排斥性配对，即使小耦合常数λ₀也能获得极高Tc。\n3. 这为利用极性绝缘体中的双曲声子极化激元模式设计高温超导器件提供了明确的理论依据与真实参数估计。", "summary_source": "deepseek", "authors": [{"name": "Zhiyu Dong"}, {"name": "Patrick A. Lee"}], "featured_authors": [{"name": "Zhiyu Dong"}, {"name": "Patrick A. Lee"}], "author_count": 2}, {"id": "2606.16676", "category": "cond-mat", "title": "Optical vortex probe of loop-current chirality in moiré materials", "abstract": "We propose a symmetry-resolved optical probe of intrinsic loop-current chirality in moiré materials, with twisted bilayer graphene as a representative realization. Interlayer interference generates chiral electronic circulation on triangular plaquettes, giving rise to an intrinsic geometric chirality that enters the second-order response through a $C_3$-selected angular harmonic of the Berry curvature and can be isolated by the orbital-angular-momentum difference $\\Delta\\ell$ of interfering optical vortex beams. When moiré $C_3$ symmetry is preserved, the intrinsic contribution appears in the $\\Delta\\ell=3$ channel of the helicity-dependent dc photocurrent, whereas $C_3$-breaking perturbations activate additional channels. These results establish angular-momentum-resolved nonlinear optics as a route to probing geometric chirality in moiré and other symmetry-engineered quantum materials.", "url": "https://arxiv.org/abs/2606.16676", "type": "理论+数值", "summary": "1. 该工作提出利用光学涡旋探针对moiré材料（以扭转双层石墨烯为例）中固有环流手性进行对称性分辨的探测方案。\n2. 其核心在于通过干涉光涡旋束的轨道角动量差Δℓ=3通道，隔离出由贝里曲率C₃选择角谐波决定的几何手性贡献，并在C₃对称保持时呈现于螺旋依赖直流光电流。\n3. 这为利用角动量分辨非线性光学探测moiré及其他对称工程量子材料中的几何手性开辟了实验途径。", "summary_source": "deepseek", "authors": [{"name": "Nobuhiko Yokoshi"}, {"name": "Akihito Kato"}], "featured_authors": [{"name": "Nobuhiko Yokoshi"}, {"name": "Akihito Kato"}], "author_count": 2}, {"id": "2606.16702", "category": "cond-mat", "title": "Activated Migration of Localized Ligand-Field Excitons in Atomically Thin CrCl3", "abstract": "Two-dimensional crystals with densely packed atoms exhibit a range of emerging properties, particularly a wide variety of excitonic behaviors. Thickness-variable layered chromium trihalides with finite surface recombination sites provide an ideal system for understanding how excitons confined in octahedral ligand fields migrate on nanometer length scales, a regime that defies conventional transport probes. In this work, we demonstrate that Cr3+-derived photoluminescence in CrCl3 is spectrally thickness-independent, but its relaxation dynamics are strongly sensitive to thickness and temperature, thereby indicating significant activated migration. A diffusion-coupled surface recombination model reveals an effective out-of-plane diffusivity of 4.5 x 10-6 cm2/s for the ligand-field excitons and a diffusion activation energy of 130 meV. The latter is comparable to the reorganization energy independently estimated from optical Stokes shifts, suggesting that exciton transport is coupled to local lattice relaxation. Furthermore, we show that the relaxation dynamics can be systematically tuned by either enhancing or suppressing surface recombination through controlled surface reactions or encapsulation. This work not only reveals the nanoscopic transport of localized ligand-field excitons but also establishes a spectroscopic transport probe applicable to various 2D materials.", "url": "https://arxiv.org/abs/2606.16702", "type": "理论", "summary": "1. 该工作通过测量CrCl3原子薄层中Cr3+离子光致发光的弛豫动力学，揭示了局域配体场激子的激活迁移行为。\n2. 其核心在于建立扩散耦合表面复合模型，定量提取出有效面外扩散率为4.5×10⁻⁶ cm²/s及130 meV的扩散激活能，该激活能与光学Stokes位移估算的重组能相当，表明激子输运与局域晶格弛豫耦合。\n3. 这为通过表面反应或封装调控激子弛豫动力学提供了途径，并建立了一种适用于多种二维材料局域激子纳米输运的光谱探测方法。", "summary_source": "deepseek", "authors": [{"name": "Hyesun Kim"}, {"name": "Renlong Liu"}, {"name": "Sangho Yoon"}, {"name": "Hyunjong Lim"}, {"name": "Takashi Taniguchi"}, {"name": "Kenji Watanabe"}, {"name": "Jonghwan Kim"}, {"name": "Changgu Lee"}, {"name": "Sunmin Ryu"}], "featured_authors": [{"name": "Hyesun Kim"}, {"name": "Renlong Liu"}, {"name": "Sangho Yoon"}, {"name": "Jonghwan Kim"}, {"name": "Changgu Lee"}, {"name": "Sunmin Ryu"}], "author_count": 9}, {"id": "2606.16704", "category": "cond-mat", "title": "Field-selected seven-site topological magnons in a classical frustrated triangular-lattice K-$Γ$-$Γ'$ magnet", "abstract": "Defining magnon topology in strongly frustrated magnets is often hindered by the absence of a simple harmonic magnon vacuum at zero field. Within a classical-spin ground-state search followed by linear spin-wave theory (LSWT), we demonstrate that a representative triangular-lattice K-Gamma-Gamma' model in a dominant-Gamma exchange regime has an in-plane-field-selected compact, noncoplanar seven-site order. This field-selected state provides a controlled classical reference state and hosts magnon bands with field-tunable Chern numbers. Increasing the field drives a Dirac-like band touching that transfers Berry curvature between the fifth and sixth bands, altering the Chern vector from (0, 1, 0, -2, 1, 0, 0) to (0, 1, 0, -2, -1, 2, 0). This topological transition reorganizes the band-resolved thermal Hall conductivity, driving the total $\\kappa_{xy}(T)$ through a near-zero crossing once the upper bands are thermally populated. The dynamical structure factor places roughly half of the coherent spectral weight on the Chern-active branches, offering a spectroscopic route to identify the topological branches. These results define a controlled semiclassical benchmark for magnon topology in this pure nearest-neighbor exchange model.", "url": "https://arxiv.org/abs/2606.16704", "type": "理论+数值", "summary": "1. 该工作通过经典自旋基态搜索结合线性自旋波理论，证明三角晶格K-Γ-Γ'模型在主导Γ交换区存在场选七位点紧凑非共面序，并以此作为可控经典参考态研究磁振子拓扑。\n2. 其卖点在于揭示磁场可调Chern数：随场增强发生狄拉克型能带接触使贝里曲率从(0,1,0,-2,1,0,0)转移至(0,1,0,-2,-1,2,0)，驱动带分辨热霍尔电导率在热占据上能带时出现近零穿越。\n3. 这为纯近邻交换模型中的磁振子拓扑提供了可控半经典基准，且动态结构因子中约半数谱权重集中于Chern活跃支，为光谱识别拓扑分支指明方向。", "summary_source": "deepseek", "authors": [{"name": "Bin Xi"}, {"name": "Jie Lu"}, {"name": "Shun-Li Yu"}, {"name": "Yafang Xu"}], "featured_authors": [{"name": "Bin Xi"}, {"name": "Jie Lu"}, {"name": "Shun-Li Yu"}, {"name": "Yafang Xu"}], "author_count": 4}, {"id": "2606.16752", "category": "cond-mat", "title": "Refining Unified Colored-Noise Approximation", "abstract": "Countless biological and physical systems experience fluctuations that exhibit non-trivial temporal correlations. The Unified Colored-Noise Approximation (UCNA) is a framework providing an approximate description of such stochastic dynamics with colored noise, valid in the limits of vanishing and infinite correlation time of the noise. We first pinpoint and address some criticalities in its original derivation, recasting the result through a time-scale separation procedure. By using our approach, we derive the next-to-leading order correction to the dynamics in both limiting regimes, and highlight the relevant physical scalings of these approximations. Our result helps frame the limits of validity of both the original and the refined formulas, especially in comparison with those derived through different approximation procedures. We show our findings in two paradigmatic examples, a quartic potential and a stochastic logistic growth with multiplicative noise.", "url": "https://arxiv.org/abs/2606.16752", "type": "理论", "summary": "1. 该工作重新审视并修正了统一色噪声近似（UCNA）的原始推导，通过时间尺度分离方法得到噪声相关时间趋于零和无穷两种极限下动力学的次主导修正项。\n2. 其核心在于揭示了原始近似的临界缺陷及修正项的物理标度行为，并在四次势和随机逻辑斯谛增长两个范例中验证了改进公式的适用范围。\n3. 这为精确评估色噪声驱动的随机系统提供了更可靠的解析框架，并有助于与其他近似方法进行系统比较和误差控制。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Corso"}, {"name": "Daniel M. Busiello"}], "featured_authors": [{"name": "Alessandro Corso"}, {"name": "Daniel M. Busiello"}], "author_count": 2}, {"id": "2606.16791", "category": "cond-mat", "title": "Riviera model with egoistical settlers", "abstract": "The Riviera model mimics a densifying settlement along the coastline. In the lattice version, houses are built sequentially in empty sites with the constraint that every newly built house has at least one empty neighboring site. The distribution of clusters of adjacent houses does not obey a closed set of evolutionary equations, but the void-cluster-void distribution does. We compute the latter and extract the cluster distribution from it. In the jammed state, when all voids have length one and the evolution ceases, the cluster distribution has a neat form and exhibits a factorial decay with the length of the cluster. To investigate finite systems, we employ a static approach directly treating jammed states. If the coastline is a finite segment, we determine the statistics of the number of empty sites in the jammed state (the average, variance, and higher cumulants). We also study a continuum version in which houses are built along the line so that each newly built house is sufficiently separated from at least one neighboring house.", "url": "https://arxiv.org/abs/2606.16791", "type": "理论", "summary": "1. 该工作提出并解析了Riviera格点模型，其中房屋依次占据空位且要求每栋新屋至少有一个空邻，重点求解了堵塞态中团簇与空位的统计性质。\n2. 其技术核心在于发现空位-团簇-空位分布满足封闭演化方程，由此导出团簇长度呈阶乘衰减的精确形式，并直接统计了有限线段上堵塞态的空位数累积量。\n3. 该分析框架可推广至其他受约束的逐次占据过程，为理解一维堵塞态的非平衡统计特征提供了可解范例。", "summary_source": "deepseek", "authors": [{"name": "P. L. Krapivsky"}], "featured_authors": [{"name": "P. L. Krapivsky"}], "author_count": 1}, {"id": "2606.16812", "category": "cond-mat", "title": "Data-Driven Micromechanical Characterization and Mapping of Shale Rocks Using High Speed Nanoindentation", "abstract": "This study investigates the potential of high-speed nanoindentation in collaboration with data analytics and phase volume fractions to achieve micromechanical characterization of heterogeneous rocks. While micromechanical characterization can be performed using mechanical testing alone, integrating chemical analysis-such as elemental mapping techniques-provides essential phase identification. This enables more accurate interpretation of phase-specific mechanical properties. However, incorporating chemical analysis increases the complexity of the process. Hence, this study proposes data-driven micromechanical characterization and mapping of heterogeneous rocks based primarily on mechanical data and limited dependence on chemical analysis. In this study, Mancos shale rock is analyzed using high-speed nanoindentation to determine the mechanical properties at the microscale. Subsequently, a suite of unsupervised statistical learning techniques, such as Uniform Manifold Approximation and Projection (UMAP) with k-means Clustering, Gaussian Mixture Model (GMM), Dirichlet Process Mixture Model (DPMM), and Density-Based Spatial Clustering of Applications with Noise (DBSCAN), are applied to the nanoindentation data. Additionally, an automated image processing and segmentation technique was developed and tested. The results from each technique have been systematically compared against the conventional chemo-mechanical approach using two metrics: weighted error and spatial error. Based on the results, UMAP with k-means clustering is the most appropriate technique, while DBSCAN, DPMM, and image segmentation techniques are more suitable as secondary approaches. This study demonstrates the capability of high-speed nanoindentation combined with machine learning techniques for micromechanical characterization with reduced analytical complexity and improved workflow efficiency.", "url": "https://arxiv.org/abs/2606.16812", "type": "理论+数值", "summary": "1. 该工作利用高速纳米压痕结合无监督统计学习技术，实现了页岩岩石微力学性能的数据驱动表征与空间映射。\n2. 其核心在于仅依赖力学数据即可识别不同矿物相及其本征力学性质，显著降低了对化学元素分析的传统依赖。\n3. 这为复杂非均质地质材料的快速、高效微力学测绘提供了新范式，可推广至其他多相材料的力学性能解析。", "summary_source": "deepseek", "authors": [{"name": "Shaziya Ahmed Banu"}, {"name": "Xukai Zhang"}, {"name": "Samah A. Mahgoub"}, {"name": "Christopher C. Walker"}, {"name": "George M. Pharr"}, {"name": "Arash Noshadravan"}, {"name": "Sara Abedi"}], "featured_authors": [{"name": "Shaziya Ahmed Banu"}, {"name": "Xukai Zhang"}, {"name": "Samah A. Mahgoub"}, {"name": "George M. Pharr"}, {"name": "Arash Noshadravan"}, {"name": "Sara Abedi"}], "author_count": 7}, {"id": "2606.16848", "category": "cond-mat", "title": "Exact solution of the Glauber-Ising model on the finite-length semi-open chain", "abstract": "The exact time-space correlation function of the $1D$ Glauber-Ising model, quenched to temperature $T=0$ and on a semi-open lattice of finite size $N$, is obtained. This also allows to deduce the exact empty-interval probability of the dual $1D$ coagulation-diffusion process on a periodic finite ring and to reproduce the long-time decay of the particle concentration. These results are consistent with the generic expectations of dynamical finite-size scaling theory.", "url": "https://arxiv.org/abs/2606.16848", "type": "理论+数值", "summary": "1. 该工作给出了有限长半开链上淬火至零温的一维Glauber-Ising模型的精确时空关联函数。\n2. 其卖点在于通过对偶关系导出有限环上凝聚-扩散过程的精确空区间概率，并验证了动力学有限尺寸标度行为。\n3. 这为严格检验有限尺寸量子淬火动力学及对偶过程理论提供了精确基准。", "summary_source": "deepseek", "authors": [{"name": "Malte Henkel"}], "featured_authors": [{"name": "Malte Henkel"}], "author_count": 1}, {"id": "2606.16884", "category": "cond-mat", "title": "Distinguishing between Direct and Parametric Driving in Nanomechanics Using a Vibrating Carbon Nanotube", "abstract": "Parametric driving is a powerful route to amplification and nonlinear control in nanomechanical resonators, but its signatures can be ambiguous because standard dc electrical readout does not directly reveal the frequency of motion. Here we resolve this ambiguity by measuring the motional frequency of a vibrating carbon nanotube independently of the drive frequency. We operate the nanotube as an electromechanical mixer and detect microwave sidebands using a low-noise superconducting amplifier. This frequency-resolved readout distinguishes direct motion of the first overtone from parametric motion of the fundamental, even when the corresponding drive frequencies nearly coincide. The two mechanisms are further separated by their drive-power dependence. Beyond conventional parametric resonance at $2f_0$, we observe responses to driving at $3f_0$ and $4f_0$, consistent with high-order parametric excitation associated with nonlinear stiffness terms.", "url": "https://arxiv.org/abs/2606.16884", "type": "数值", "summary": "1. 该工作利用振动碳纳米管作为机电混频器，结合超导放大器检测微波边带，独立于驱动频率测量运动频率，从而区分直驱与参数驱动。\n2. 其核心在于频率分辨读出与驱动功率依赖性，清晰分离第一泛音的直驱和基模的参量响应，并观测到源于非线性刚度的高阶参数共振。\n3. 这为纳米机械系统中参数驱动的辨识提供了明确判据，并启发在其他谐振结构中利用混频读出研究非线性动力学。", "summary_source": "deepseek", "authors": [{"name": "Sam Dicker"}, {"name": "Patrick Steger"}, {"name": "Deepanjan Das"}, {"name": "Saba M. Khan"}, {"name": "Edward A. Laird"}], "featured_authors": [{"name": "Sam Dicker"}, {"name": "Patrick Steger"}, {"name": "Deepanjan Das"}, {"name": "Saba M. Khan"}, {"name": "Edward A. Laird"}], "author_count": 5}, {"id": "2606.16968", "category": "cond-mat", "title": "Electronic Green's function across the pseudogap to stripe transition in the $t$-$t'$-$J$ model", "abstract": "Superconducting domes in strongly correlated electronic systems are often accompanied by charge density waves and peculiar features in the electronic structure. The appearance of a pseudogap, in particular, and its relation to charge density waves remains insufficiently understood. Here, we investigate the electronic Green's function of the underdoped $t$-$t'$-$J$ model of the cuprate superconductors using tensor network algorithms for finite temperature dynamics on cylinders of width $4$. We find the prominent momentum differentiation, the hallmark of the pseudogap, to be strongly dependent on $t'$, which develops into a momentum-dependent opening of a gap upon decreasing temperature, consistent with the formation of a Fermi arc at intermediate temperatures. The nodal gap around ${\\bf k}=(\\pi/2,\\pi/2)$ closes and fills with increasing temperature as coherent stripe order melts into a regime of fluctuating charge clusters.", "url": "https://arxiv.org/abs/2606.16968", "type": "理论+数值", "summary": "1. 运用张量网络算法研究了宽度4圆柱上t-t′-J模型在有限温度下的电子格林函数，揭示了从赝隙到条纹相的转变过程。\n2. 发现动量分化的赝隙特征强烈依赖于t′，随温度降低出现动量依赖的能隙打开并形成费米弧，而节点间隙随条纹序熔化为波动电荷团簇而闭合。\n3. 这为理解赝隙与电荷密度波的关系以及高温超导配对机理提供了关键微观图像。", "summary_source": "deepseek", "authors": [{"name": "Martin Ulaga"}, {"name": "Aritra Sinha"}, {"name": "Alexander Wietek"}], "featured_authors": [{"name": "Martin Ulaga"}, {"name": "Aritra Sinha"}, {"name": "Alexander Wietek"}], "author_count": 3}, {"id": "2606.16998", "category": "cond-mat", "title": "Progress toward a better BOCS: Systematic coarse-graining with local density potentials", "abstract": "We describe version 5.0 of the Bottom-up Open-source Coarse-graining Software (BOCS) package. BOCS employs the force-matching variational principle to parameterize potentials for coarse-grained (CG) models directly from atomically detailed simulations. BOCS version 5.0 significantly extends previous versions by treating potentials that depend upon the local density (LD) around each particle, as well as potentials that depend upon the square gradient (SG) of this local density. We also describe a new package, PKG-BOCS, for simulating these potentials in LAMMPS. This software treats complex molecular topologies and provides considerable flexibility for defining the local density, as well as the LD and SG potentials. We present numerical calculations that provide physical insight into these potentials and demonstrate the accuracy of our implementation. Finally, we demonstrate that LD potentials can significantly improve the structural fidelity, thermodynamic properties, and transferability of CG models for water.", "url": "https://arxiv.org/abs/2606.16998", "type": "理论+数值", "summary": "1. 该工作报道了BOCS软件5.0版，实现基于局部密度及其平方梯度的粗粒化势参数化。\n2. 其核心在于通过力匹配变分原理引入局部密度势，显著改善水模型的结构保真度与热力学性质。\n3. 这为复杂流体的高精度可转移粗粒化建模提供了系统且通用的计算框架。", "summary_source": "deepseek", "authors": [{"name": "Maria C. Lesniewski"}, {"name": "Michael R. DeLyser"}, {"name": "W. G. Noid"}], "featured_authors": [{"name": "Maria C. Lesniewski"}, {"name": "Michael R. DeLyser"}, {"name": "W. G. Noid"}], "author_count": 3}, {"id": "2606.17018", "category": "cond-mat", "title": "Distributed Acoustic Sensing for Urban Monitoring: Coverage Thresholds and Percolation", "abstract": "Distributed Acoustic Sensing (DAS) enables the repurposing of existing fiber-optic networks as ultra-dense, long-range seismic arrays for urban monitoring. However, constraints imposed by real-world fiber infrastructure topology and components limit its use for city-scale applications. Recent technological developments have paved the way for short-range, on-chip DAS. Assuming their availability, and based on a Graph Theory framework, we show that monitoring applications fall along a coverage spectrum with two critical thresholds that define three distinct regimes. Low coverage (<10%) can, with optimal design, resolve earthquake early warning, groundwater monitoring, geological mapping, and urban activity tracking. A percolation transition occurs at 51.6% coverage, beyond which the city effectively becomes fully covered and statistical traffic monitoring is possible. Only for effectively complete coverage, infrastructure monitoring, individual vehicle tracking, and pedestrian movement analysis become possible. Thus, privacy-related risks remain very low. We show and exemplify how, for metropolises around the world, an optimal sensing network can be designed for earthquake early warning, traffic monitoring, and urban activity tracking. This framework provides a near-future roadmap for deploying urban DAS networks as a backbone of smart city sensing.", "url": "https://arxiv.org/abs/2606.17018", "type": "理论", "summary": "1. 该工作基于图论框架，在短程片上分布式声波传感前提下，揭示了城市监测覆盖的两个临界阈值（10%与51.6%）及渗流转变所定义的三个监测区间。\n2. 其核心发现是：低于10%覆盖可优化实现地震预警、地下水监测与城市活动追踪；51.6%渗流后城市近全覆盖，可统计交通流量；仅完全覆盖才允许基础设施监测与个体追踪且隐私风险极低。\n3. 此框架为全球大都市利用现有光纤网络优化设计DAS传感部署，以支撑地震预警及交通监测等多功能智能城市应用提供了近期定量路线图。", "summary_source": "deepseek", "authors": [{"name": "Khen Cohen"}, {"name": "Ariel Lellouch"}], "featured_authors": [{"name": "Khen Cohen"}, {"name": "Ariel Lellouch"}], "author_count": 2}, {"id": "2606.17033", "category": "cond-mat", "title": "Milestoning Markov-jump dynamics: Stationary properties, thermodynamic consistency, kinetic hysteresis, and fluctuation symmetries", "abstract": "We derive an exact coarse graining of generic Markov-jump processes into observable semi-Markov dynamics. Exact results for waiting-time distributions for jumps between observable states are derived and proved that these decompose into conditionally independent dwell and transition times. Dwell times are proved to be a local property of mesostates - they depend on the initial but not final state. Conversely, transition-path times depend on both states, trigger kinetic hysteresis, and, under suitable conditions on the hidden sub-network, are shown to obey a reflection symmetry. We characterize the stationary properties of the milestoned dynamics, prove its thermodynamic consistency, and demonstrate robustness to milestone positioning. Surprisingly, even in the limit of a time-scale separation rendering the observed dynamics approximately Markovian, the effect of kinetic hysteresis on the dissipation persists. A minimal example shows how the results lay the foundation for inferring affinities of hidden dissipative cycles from observations of transition-path times.", "url": "https://arxiv.org/abs/2606.17033", "type": "理论", "summary": "1. 该工作推导了任意马尔可夫跳变过程到可观测半马尔可夫动力学的精确粗粒化方案，严格定义了可观测态间的等待时间分布。\n2. 核心发现在于驻留时间为仅依赖初态的局域性质，而转移时间因依赖初末态引发动力学滞后，并在隐藏子网条件下满足反射对称性，同时验证了热力学一致性及对里程碑位置的鲁棒性。\n3. 即使在时间尺度分离导致的近似马尔可夫极限下，动力学滞后仍持续影响耗散，为从转移时间观测推断隐藏耗散循环的亲和势提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Tassilo Schwarz"}, {"name": "David Hartich"}, {"name": "Aljaž Godec"}], "featured_authors": [{"name": "Tassilo Schwarz"}, {"name": "David Hartich"}, {"name": "Aljaž Godec"}], "author_count": 3}, {"id": "2606.17045", "category": "cond-mat", "title": "Compact Spin-Charge Separated Neural Quantum States for Valence-Bond States", "abstract": "Neural-network quantum states (NQS) provide a flexible nonlinear representation of quantum many-body wavefunctions, but their efficiency depends sensitively on whether the architecture reflects the sign structure and constrained Hilbert space of the target state. In this work, we propose a solvable-point-guided strategy: design the architecture at an exactly solvable point where the correct local rules can be read off, then refine to the non-exact regime by enlarging only the kernel size and hidden dimension. The strategy is built from four physics-motivated designs: a stride-matched local-rule convolution, geometric pooling, a sign-resolving $\\tanh(x^{2k+1})$ activation, and explicit spin-hole sector separation. We test this approach on quasi-one-dimensional valence-bond-solid (VBS) states and their doped soliton variants (sVBS), the exact ground states of a $t$-$J$-like model with a single mobile hole. In finite-size benchmarks, this architecture reaches high fidelity for the exact sVBS state with substantially fewer parameters than generic fully connected, convolutional, and transformer baselines tested under the same setup. For the spin sector, the learned local rule transfers from small to larger systems without retraining. Away from the solvable point, increasing kernel size and hidden dimension systematically improves accuracy, and the model shows approximately $L^2$ parameter scaling in the gapless regime for system size $L$, compared with approximately $L^4$ for matrix-product states in the same regime. Our work establishes a recipe for compact NQS in sign-structured, constrained Hilbert spaces and paves the pathway to physics-informed architectures for the broader $t$-$J$ and Hubbard families.", "url": "https://arxiv.org/abs/2606.17045", "type": "理论", "summary": "1. 该工作针对价键固态及其掺杂孤子变体，提出一种基于可解点引导的神经量子态架构，通过局域规则卷积与自旋-空穴分离设计实现紧凑表示。\n2. 核心在于利用步长匹配卷积、几何池化及符号解析激活函数显式嵌入约束希尔伯特空间结构，在有限尺寸基准中以远少于基线的参数达到高保真度。\n3. 该架构在无隙区参数标度逼近L²且局域规则可跨系统转移，为t-J及Hubbard模型族中物理信息神经量子态的设计提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Ang-Kun Wu"}, {"name": "Louis Primeau"}, {"name": "Yixin Zhang"}, {"name": "Jingtao Zhang"}, {"name": "Adrian Del Maestro"}, {"name": "Yang Zhang"}], "featured_authors": [{"name": "Ang-Kun Wu"}, {"name": "Louis Primeau"}, {"name": "Yixin Zhang"}, {"name": "Jingtao Zhang"}, {"name": "Adrian Del Maestro"}, {"name": "Yang Zhang"}], "author_count": 6}, {"id": "2606.14733", "category": "hep-th", "title": "O(N) BCFT: new data from conformal partial wave expansions", "abstract": "The $\\mathsf{O}(N)$ $\\mathsf{BCFT}$ is analyzed in the large $N$ expansion in a generic bulk dimension $2<d+1<4$. Focus is on boundary conditions corresponding to the ordinary transition, however techniques used can be generalized to special or extraordinary transitions. We study the system of bulk $2$-pt functions $\\langle \\phi\\phi\\rangle$, $\\langle \\phi^2 \\phi^2\\rangle$ and $\\langle \\sigma\\sigma \\rangle$, where $\\sigma$ is the Hubbard--Stratonovich field. They are expanded in bulk/boundary conformal partial waves. The coefficient functions of this expansion -- the spectral functions -- encode $\\mathsf{BCFT}$ data and determine bulk/boundary conformal block expansions. We prove conjectures about boundary spectral functions in Dujava et al. [ arXiv:2503.16345 ] and reproduce the bulk expansion of $\\langle \\phi\\phi \\rangle$ in Giombi et al. [ arXiv:2007.04955 ]. The bulk expansion of $\\langle\\sigma\\sigma\\rangle$ is new and allows to extract the leading large $N$ expression for an unknown OPE coefficient $C_{\\sigma\\sigma\\sigma^3}$ (the computation outputs as a byproduct also a mixing coefficient, which matches an existing result by Derkachov et al. [ arXiv:hep-th/9705020 ], providing further support for the main result). Besides these derived data infinitely many constraints are produced, though due to operator mixing growing in complexity as degeneracy increases, they cannot be disentangled without further input.", "url": "https://arxiv.org/abs/2606.14733", "type": "理论", "summary": "1. 该工作以共形偏波展开方法系统分析大N O(N)边界共形场论，针对普通过渡边界条件，从多点关联函数提取边界OPE系数。\n2. 关键技术在于将bulk两点函数展开为bulk/边界共形偏波，谱函数编码边界数据，并通过新推导的⟨σσ⟩展开首次给出未知系数C_{σσσ³}的领头大N表达式。\n3. 所得无穷多约束揭示了算子混合随简并增长而加剧的复杂性，为后续结合对称性或数值手段完全确定BCFT数据提供明确框架。", "summary_source": "deepseek", "authors": [{"name": "Jozef Csipes"}, {"name": "Petr Vaško"}], "featured_authors": [{"name": "Jozef Csipes"}, {"name": "Petr Vaško"}], "author_count": 2}, {"id": "2606.14834", "category": "hep-th", "title": "Entropy Quantization and Quasi-normal Modes of Dyonic Kerr-Sen Black Holes", "abstract": "We explore the properties of inner and outer horizon thermodynamics of dyonic Kerr-Sen black hole (DKSBH). It is observed that the entropy (or area) product is universal, depending only on the angular momentum of the BH. We then proceed to study the dual conformal field theory~(CFT) in the Kerr/CFT correspondence using thermodynamic relations and compute the central charges from 2D CFT. The central charges are found to be universal with only angular momentum dependence. By comparing to Kerr-Newman BH, it is found that the essential difference is in the right-moving sector of the CFT. Interestingly, we can then explicitly produce the non-vanishing central charges related to its static solution, the dyonic dilaton BH, using the thermodynamic method. Moreover, from the CFT relations to multi-horizon thermodynamics, we find the analytical expression of the quasi-normal modes~(QNM) spectra in terms of BH parameters.", "url": "https://arxiv.org/abs/2606.14834", "type": "理论", "summary": "1. 该工作系统地研究了带电磁荷的Kerr-Sen黑洞的内外视界热力学性质，并分析了其熵积和准正则模谱。\n2. 其核心发现是熵积与中心荷仅依赖于黑洞角动量，呈现出普适性，并且通过热力学方法从静态极限得到了非零中心荷。\n3. 这为通过CFT对偶理解多视界黑洞的微观熵起源以及准正则模的解析结构提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Muhammad Fitrah Alfian Rangga Sakti"}, {"name": "Piyabut Burikham"}], "featured_authors": [{"name": "Muhammad Fitrah Alfian Rangga Sakti"}, {"name": "Piyabut Burikham"}], "author_count": 2}, {"id": "2606.15119", "category": "hep-th", "title": "Stability analysis of de Sitter solution in the Einstein-Grisaru-Zanon gravity using the dynamical system method", "abstract": "In this paper, we would like to investigate the stability of de Sitter solution in the Einstein-Grisaru-Zanon gravity, which is a novel fourth-order gravity model considered recently in a paper [Phys. Lett. B {\\bf 855} (2024) 138811]. As a result, we are able to derive the corresponding field equations for the Einstein-Grisaru-Zanon gravity by using an effective method based on the Euler-Lagrange equations. Unfortunately, one of the obtained field equations does not coincide with that derived in the original paper of the Einstein-Grisaru-Zanon gravity due to a gap between higher-order derivative terms. However, our de Sitter solution is still identical to one solved in the original paper of the Einstein-Grisaru-Zanon gravity due to the vanishing of the gap. Furthermore, a stability analysis based on the dynamical system method is performed to indicate that the obtained de Sitter solution is always unstable, no matter it presents an inflationary phase or expanding phase of universe. This result confirms the validity of stability investigation carried out in the original paper of the Einstein-Grisaru-Zanon gravity.", "url": "https://arxiv.org/abs/2606.15119", "type": "理论", "summary": "1. 该工作利用动力系统方法分析了Einstein-Grisaru-Zanon四阶引力中de Sitter解的稳定性。\n2. 其关键在于通过Euler-Lagrange方程推导场方程时发现高阶导数项差异，但该差异在de Sitter解中消失，从而得到与原始论文一致的解并证明其总是不稳定。\n3. 该结果确认了原始论文的稳定性结论，并为高阶修正引力模型中de Sitter时空的动力学行为研究提供了分析范例。", "summary_source": "deepseek", "authors": [{"name": "Tuan Q. Do"}], "featured_authors": [{"name": "Tuan Q. Do"}], "author_count": 1}, {"id": "2606.15173", "category": "hep-th", "title": "The Holographic Multi-Entropy Cone", "abstract": "We generalize the holographic entropy cone (HEC) to the holographic multi-entropy cone (HMEC) by adjoining multi-entropy coordinates to the standard bipartition entropy coordinates. We show that holographic states, through their multi-entropy vectors, form a rational polyhedral cone in multi-entropy space, and multicontraction maps provide exact certificates for holographic multi-entropy inequalities (HMEIs). We determine all facets of the $n=3,4$ HMECs, where $n$ includes the purifier, and obtain seven fundamental HMEI orbits: two for $n=3$ and five for $n=4$. We further propose two structural conjectures: HEC facet inequalities are convex combinations of HMEC facet inequalities, and HMEC facets obey a balanced-but-not-too-balanced principle.", "url": "https://arxiv.org/abs/2606.15173", "type": "理论", "summary": "1. 该工作将全息熵锥推广至全息多熵锥，通过引入多熵坐标分析含纯化器的三体和四体系统。\n2. 技术核心在于证明多熵向量形成有理多面体锥，并利用多收缩映射精确刻画全部七条基本全息多熵不等式轨道。\n3. 这提示熵锥的面不等式可表达为多熵锥面不等式的凸组合，且多熵锥面遵循平衡但不超平衡原则。", "summary_source": "deepseek", "authors": [{"name": "Xin-Xiang Ju"}, {"name": "Yang Zhao"}], "featured_authors": [{"name": "Xin-Xiang Ju"}, {"name": "Yang Zhao"}], "author_count": 2}, {"id": "2606.15261", "category": "hep-th", "title": "On the Schubert calculus of the quantum K-theory for partial flag manifolds: a 3d A-model perspective", "abstract": "We further investigate the 3d gauged linear sigma model (GLSM)/quantum K-theory correspondence for partial flag manifolds $X \\equiv {\\rm Fl}(\\boldsymbol{k};n)$. This is a 3d uplift of the 2d GLSM/quantum cohomology correspondence with the 3d theory compactified on $\\mathbb{R}^2\\times S^1_\\beta$. Recently, a set of half-BPS line operators, called Schubert line defects, were constructed that correspond to the Schubert classes in the K-theory ring of $X$. Utilizing algebro-geometric algorithms, we compute $2$-point and $3$-point correlation functions of these line operators in the 3d A-model regime of the theory. These are interpreted as genus-$0$ K-theoretic Gromov--Witten invariants, and they produce the K-theoretic Littlewood--Richardson coefficients of the quantum K-theory ring of $X$. We show how this works explicitly in examples. Taking the small $\\beta$ limit, we apply these techniques to the resulting 2d GLSM. We explicitly compute the quantum cohomology ring relations of $X$ for some cases and match with existing results in the literature in examples.", "url": "https://arxiv.org/abs/2606.15261", "type": "理论", "summary": "1. 该工作从三维A-模型视角，利用部分旗流形的3d GLSM/量子K理论对应，计算了Schubert线算符的两点与三点关联函数。\n2. 其核心在于将这些关联函数解释为亏格零K理论Gromov-Witten不变量，从而导出量子K理论环的Littlewood-Richardson系数，并在小β极限下恢复量子上同调环关系。\n3. 这为三维/二维GLSM对偶及旗流形上K理论Gromov-Witten不变量的代数结构提供了明确的计算框架与验证途径。", "summary_source": "deepseek", "authors": [{"name": "Zhihao Duan"}, {"name": "Osama Khlaif"}, {"name": "Hao Zou"}], "featured_authors": [{"name": "Zhihao Duan"}, {"name": "Osama Khlaif"}, {"name": "Hao Zou"}], "author_count": 3}, {"id": "2606.15270", "category": "hep-th", "title": "Generalized Schwarzian Dynamics from a Bulk-First BF Perspective", "abstract": "We investigate the emergence of generalized Schwarzian dynamics from a bulk-first BF perspective. Starting from two-dimensional BF gravity, we analyze the associated boundary phase space and its Drinfeld-Sokolov reductions. For the sl(2,R) theory, we recover the ordinary Schwarzian action as the reduced boundary dynamics arising from a particular sector of the BF asymptotic phase space. We then extend this construction to sl(3,R), where the reduced dynamics is governed by the second and third Wilczynski invariants, providing a natural higher-rank generalization of the Schwarzian derivative. In this framework, generalized Schwarzian dynamics emerges directly from flat BF connections and their companion forms rather than being introduced as an independent boundary theory. We further relate the resulting projective invariants to Casimir charges, monodromy data, and generalized Schwarzian thermodynamics, including monodromy spectra and semiclassical thermodynamics. In particular, constant projective invariants determine the corresponding Casimir sectors and monodromy data, which in turn organize the thermodynamic structure of the theory. Our results provide a unified bulk-first description of Schwarzian and generalized Schwarzian dynamics and reveal a direct link between BF gravity, asymptotic symmetry reductions, projective geometry, and boundary
