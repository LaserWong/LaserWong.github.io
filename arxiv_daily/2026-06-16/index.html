<head>
  <meta charset="utf-8">

  <title>arXiv 2026-06-16 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2606.14751", "category": "cond-mat", "title": "Kinematic Inconsistencies and Initial-Value Boundary Paradoxes in Rate-Dependent Viscoelastic Yield Stress Models", "abstract": "We present a rigorous analysis of the mathematical boundaries and kinematic consistency of a recently proposed rate-dependent relaxation time framework intended to unify pre- and post-yield dynamics in yield-stress fluids. By evaluating the governing constitutive equations under an idealized transient creep protocol from a state of physical rest, we show that the model encounters an unavoidable boundary paradox. To avoid predicting perfectly rigid solid behavior or falling into a division-by-zero mathematical singularity under a constant applied stress below the yield threshold ($\\sigma \\le \\sigma_y$), the framework requires an unphysical, instantaneous velocity or strain-rate step at $t = 0^+$. We show that assuming a non-zero initial strain rate explicitly violates momentum conservation and fluid inertia. Consequently, the framework preserves the piecewise, discontinuous drawbacks of classic viscoplastic models.", "url": "https://arxiv.org/abs/2606.14751", "type": "理论", "summary": "1. 该工作对近期提出的速率依赖松弛时间框架进行严格数学分析，评估其在屈服应力流体统一前-后屈服动力学中的边界一致性问题。\n2. 其核心发现是在瞬态蠕变协议下模型面临不可避免的边界悖论：为避免刚性奇点需引入非物理瞬时速度阶跃，但此举明确违背动量守恒与流体惯性。\n3. 这揭示了该框架未能消除经典粘塑性模型的片段式不连续缺陷，为构建真正自洽的屈服应力模型提供了关键约束与数学警示。", "summary_source": "deepseek", "authors": [{"name": "Lalit Kumar"}], "featured_authors": [{"name": "Lalit Kumar"}], "author_count": 1}, {"id": "2606.14789", "category": "cond-mat", "title": "Plateau Gaps of Poisson Correctors Encode Metastable Reaction Rates", "abstract": "Metastable reaction rates are commonly inferred from transition-state fluxes, mean first-passage times, or fitted kinetic models. We show that they are directly encoded in the plateau gap of an occupation-time Poisson corrector. For a centered basin-occupation observable, the Poisson corrector develops metastable plateaus in the reactant and product basins, and their separation determines the forward and backward transition rates. This construction requires only the generator, stationary measure, and metastable partition, and therefore does not rely on a predefined transition-state surface. In overdamped and underdamped double-well dynamics, the plateau-gap rate recovers the Kramers, Grote-Hynes, and Pollak-Grabert-Hänggi hierarchy. The same corrector-martingale decomposition yields a reactive-noise density, revealing where stochastic forcing contributes to transitions in configuration or phase space. Thus, reaction rates and their fluctuation sources emerge from a single corrector field.", "url": "https://arxiv.org/abs/2606.14789", "type": "理论", "summary": "1. 该工作揭示了亚稳态反应速率可直接从占据时间泊松修正器的平台间隙中提取，无需预定义过渡态表面。\n2. 其核心在于仅需生成元、平稳测度和亚稳态划分即可构造该修正器，并在过阻尼与欠阻尼双阱动力学中恢复Kramers、Grote-Hynes及Pollak-Grabert-Hänggi速率层级。\n3. 这为从单一修正场统一获取反应速率及其涨落来源提供了框架，有望推广至复杂高维或非平衡系统。", "summary_source": "deepseek", "authors": [{"name": "Sang Yang"}, {"name": "Zhixin Peng"}], "featured_authors": [{"name": "Sang Yang"}, {"name": "Zhixin Peng"}], "author_count": 2}, {"id": "2606.14814", "category": "cond-mat", "title": "A Multi-Level Architecture for Reusable Materials Ontologies -- The OntoCrafter Ceramics Ontology (OCO) as Reference Implementation", "abstract": "The Materials Science and Engineering ontology landscape is fragmented along multiple axes simultaneously. Horizontally: a recent survey identified 94 ontologies of which over 40 are structurally incompatible; each new application domain -- ceramics, polymers, batteries, smart materials -- typically restarts ontology design from scratch. Vertically: EU regulation (CSRD, CSDDD, PPWR, CBAM, R2R, AI Act, ESPR) forces material, manufacturing, supply-chain, and lifecycle data into integrated digital product passports, leaving ontologies that only address horizontal fragmentation incomplete for any contemporary consumer. And mechanistically: a vocabulary that records that BNT-BT has $d_{33} \\approx 580$ pC/N stores a fact but cannot surface why -- Bi-6s$^2$ lone-pair stereo-activity, anomalous Born effective charges, soft modes, defect chemistry -- without a systematic explanation skeleton. We propose a multi-level modular architecture with two independent classification axes -- level of abstraction (L0 bridges, L1 material-agnostic laboratory-notebook, L2 material-class-specific, L3 categorical reasoning) and consumer audience (material vs. compliance) -- in which the material-specific level is internally organised by a seven-tier mechanistic-explanation skeleton (Symmetry, Energy/DFT, Thermo/CALPHAD, Kinetics, Microstructure, Defect chemistry, Bonding) applicable to any crystalline ionic oxide. The level-and-audience modularity dissolves the horizontal fragmentation, the compliance audience absorbs the vertical regulation pressure, and the seven-tier organisation of Level 2 delivers the mechanistic explanation depth. We instantiate the architecture as the OntoCrafter Ceramics Ontology (OCO v0.94): 5,196 classes across 44 modules; 167,348 OWL axioms (40,454 logical); 1,674 properties; 829 cross-ontology bridge mappings; 1,172 SHACL shapes; 163 published competency questions.", "url": "https://arxiv.org/abs/2606.14814", "type": "理论+数值", "summary": "1. 该工作提出了一种多级模块化本体架构，通过抽象层级和受众双轴分类解决材料科学本体的水平碎片化、垂直法规压力和机理解释缺失问题。\n2. 其核心在于采用七层机理解释骨架（对称性、能量/DFT、热力学/CALPHAD、动力学、微结构、缺陷化学、成键）组织材料专用层，并实例化为包含5196类、40,454逻辑公理的陶瓷本体OCO。\n3. 这为材料领域本体的可重用性、法规合规集成及深层机理建模提供了可复制的架构模板和参考实现。", "summary_source": "deepseek", "authors": [{"name": "Thomas Pannek"}, {"name": "Wolfgang Grond"}], "featured_authors": [{"name": "Thomas Pannek"}, {"name": "Wolfgang Grond"}], "author_count": 2}, {"id": "2606.14851", "category": "cond-mat", "title": "Jahn-Teller effect in $j = 3/2$ Mott insulators: Ground states and thermal fluctuations", "abstract": "The interplay of strong atomic spin-orbit coupling with Jahn-Teller (JT) lattice distortions is an important theme in quantum materials hosting heavy atoms. A prototypical example of such a system is a degenerate $j = 3/2$ multiplet coupled to local phonon modes. Here, we study the multipolar ground states of this system as realized in Mott insulators, explore its thermal phase diagram via an $SU(4)$ spin Monte Carlo approach coupled to JT phonons, and study the temperature dependent splittings of the $j = 3/2$ multiplet as relevant to spectroscopic probes. Our work sheds light on coexisting distinct multipolar orders engendered by phonon coupling, role of thermal JT fluctuations, and the entropy of the coupled multipole-phonon system. We discuss broad implications for double perovskites $\\rm Ba_2MgReO_6$, $\\rm Ba_2NaOsO_6$ and lacunar spinels such as $\\rm GaTa_4Se_8$ and $\\rm GaNb_4Se_8$.", "url": "https://arxiv.org/abs/2606.14851", "type": "数值", "summary": "1. 该工作采用SU(4)自旋蒙特卡洛方法，研究了耦合局域声子模的j=3/2 Mott绝缘体中多极基态与热相图。\n2. 其核心在于揭示Jahn-Teller声子耦合导致多极序共存、热涨落诱导的多重态分裂以及耦合系统的熵行为。\n3. 这为理解重原子量子材料中自旋-轨道耦合与晶格畸变的交织作用提供了框架，并直接关联双钙钛矿与空缺尖晶石体系。", "summary_source": "deepseek", "authors": [{"name": "Kathleen Hart"}, {"name": "Ruairidh Sutcliffe"}, {"name": "Arun Paramekanti"}], "featured_authors": [{"name": "Kathleen Hart"}, {"name": "Ruairidh Sutcliffe"}, {"name": "Arun Paramekanti"}], "author_count": 3}, {"id": "2606.14872", "category": "cond-mat", "title": "Dominant spin Hall torque and negligible orbital Hall torque in α-W/ferromagnet heterostructures with artifacts-free angular momentum detectors", "abstract": "{\\alpha}-phased W was theoretically predicted to have a negative spin Hall conductivity and a positive orbital Hall conductivity at the same time, leaving the physical origin of the current-induced torque a critical open question. Here, we develop two angular momentum detectors of Cu/Ni/Cu and Cu/FeCoB/Cu that are free of artifacts torques (e.g., self-induced torque and spin-vorticity torque) and clarify that the spin-orbit torque contributed by W remains negative and predominantly from the spin Hall effect in the entire thickness regime. With both detectors, the damping-like torque exhibits a monotonic decay as the W thickness increases above 5 nm, which results from the structural phase transition from \\b{eta}-W to {\\alpha}-W. The negative torque in the entire thickness regime suggests negligible orbital Hall torque and orbital current from the {\\alpha}-W. This result is consistent with the theory that the orbital Hall effect from simplified band structure calculations is not a non-local angular momentum source. These findings suggest poor generality or even universal absence of orbital current.", "url": "https://arxiv.org/abs/2606.14872", "type": "理论+数值", "summary": "1. 该工作开发了基于Cu/Ni/Cu和Cu/FeCoB/Cu的无伪影角动量探测器，明确了α-W/铁磁异质结构中自旋轨道转矩始终为负且源自自旋霍尔效应，轨道霍尔效应贡献可忽略。\n2. 其关键点在于通过排除自诱导转矩和自旋涡度转矩等伪影，并利用阻尼类转矩随W厚度增大（>5 nm）的单调衰减与β→α相变的关联，证实了轨道霍尔效应并非非局域角动量源。\n3. 这提示轨道电流可能缺乏普遍性乃至普遍不存在，为理解自旋轨道转矩的微观起源以及设计高效自旋电子学器件提供了重要约束。", "summary_source": "deepseek", "authors": [{"name": "Taiyang Zhang"}, {"name": "Lujun Zhu"}, {"name": "Qianbiao Liu"}, {"name": "Lijun Zhu"}], "featured_authors": [{"name": "Taiyang Zhang"}, {"name": "Lujun Zhu"}, {"name": "Qianbiao Liu"}, {"name": "Lijun Zhu"}], "author_count": 4}, {"id": "2606.14888", "category": "cond-mat", "title": "Atomistic insights into the structural, thermal, and mechanical evolution of $Zr_{47.5}Cu_{47.5}Ag_{5}$ bulk metallic glass", "abstract": "Bulk metallic glasses (BMGs) are distinguished by amorphous atomic structures that confer superior mechanical performance; however, the evolution of these properties in ternary bulk configurations remains insufficiently explored. In this study, we employed large-scale molecular dynamics simulations to investigate the structural, thermal, and mechanical properties of $Zr_{47.5}Cu_{47.5}Ag_{5}$ BMGs. Our thermodynamic and topological analyses, utilizing potential energy regression and the Modified Wendt-Abraham parameter, identified a glass transition temperature ($T_g$) of approximately $692\\text{ K}$. Structural characterization via Voronoi tessellation and partial radial distribution functions reveals that the amorphous matrix is stabilized by icosahedral clusters, with Ag atoms inducing significant chemical heterogeneity through localized nano-clustering. Thermal transport properties, computed via the Green-Kubo formalism, demonstrate a monotonic decrease in conductivity with temperature, consistent with structural scattering saturation in disordered lattices. Mechanical tensile testing reveals that the material exhibits robust rate- and temperature-dependent behavior, with yield strengths reaching $\\approx 2.3\\text{ GPa}$ at room temperature. We show that macroscopic strain-softening is intrinsically linked to the thermally induced collapse of rigid icosahedral motifs, which facilitates shear band percolation. These findings provide a structural rationale for the beneficial role of Ag dopants in enhancing the resilience of multicomponent metallic glasses.", "url": "https://arxiv.org/abs/2606.14888", "type": "理论+数值", "summary": "1. 该工作利用大规模分子动力学模拟，系统研究了三元块体金属玻璃Zr₄₇.₅Cu₄₇.₅Ag₅的结构、热学和力学演化过程。\n2. 其核心在于通过势能回归、修正Wendt-Abraham参数及格林-久保方法等分析，揭示了Ag掺杂诱导的化学异质性及二十面体团簇热致崩塌与剪切带扩展的关联。\n3. 这为理解多元非晶合金中掺杂元素的结构增韧机制提供了原子尺度依据，并指导高韧性金属玻璃的成分设计。", "summary_source": "deepseek", "authors": [{"name": "N. Mendez"}, {"name": "S. Jaroszewicz"}, {"name": "M. P. Beccar-Varela"}, {"name": "M. C. Mariani"}], "featured_authors": [{"name": "N. Mendez"}, {"name": "S. Jaroszewicz"}, {"name": "M. P. Beccar-Varela"}, {"name": "M. C. Mariani"}], "author_count": 4}, {"id": "2606.14928", "category": "cond-mat", "title": "Controlling Porosity in Supraparticles Composed of Colloidal Rods and Spheres", "abstract": "Supraparticles (SPs) are assemblies of colloidal particles whose properties can be tuned by modifying the chemistry, shape, and size of the colloidal particles as well as their arrangement in the SP. SPs with internal porosity are of particular interest for catalysis, photonics, and adsorption applications because of their high surface area and tunable pore size distribution. SPs are often fabricated by droplet drying, and the nonequilibrium nature of drying processes may provide an additional handle to control particle arrangement within the SP. Here, we use mesoscale particle-based simulations to explore the drying-induced assembly of SPs made from rod-shaped and spherical colloidal particles. We selectively remove one type of particle after drying and characterize the structure of the resulting porous SP. We find that the remaining particles form connected networks for most compositions, with rods percolating at lower volume fractions than spheres. Most of the resulting void volume forms a single contiguous space whose surface area closely follows the total surface area of the remaining component. The pore-size distribution, however, depends strongly on sphere size and on the removed component, reflecting differences in sphere-clustering and rod-bundling before removal. This work provides new insight into how particle size and shape, as well as processing conditions, might be used to manipulate porosity in SPs.", "url": "https://arxiv.org/abs/2606.14928", "type": "理论+数值", "summary": "1. 该工作通过介观粒子模拟研究了干燥诱导的棒状与球形胶体粒子超粒子组装，并选择性移除一种组分以调控最终孔隙结构。\n2. 其核心发现是剩余粒子的连通网络、单一连续空隙空间及强烈依赖球径与去除组分的孔径分布，分别由棒的低体积分数渗透和粒子成簇成束差异决定。\n3. 这为利用粒子形状、尺寸和干燥条件精确设计超粒子孔隙率提供了明确的物理机制和模拟指导。", "summary_source": "deepseek", "authors": [{"name": "Kritika Kritika"}, {"name": "Michael P. Howard"}, {"name": "Arash Nikoubashman"}], "featured_authors": [{"name": "Kritika Kritika"}, {"name": "Michael P. Howard"}, {"name": "Arash Nikoubashman"}], "author_count": 3}, {"id": "2606.14938", "category": "cond-mat", "title": "Fermi-Level-Dependent Defect Chemistry and Oxygen Evolution Reaction Activity of Fe-Doped and Oxygen-Deficient \\ce{SrTiO3}(001)", "abstract": "The oxygen evolution reaction (OER) on perovskite oxides is controlled by the interplay of dopant chemistry, defect charge states, and surface segregation, yet these factors are rarely treated on equal footing. Using first-principles density functional theory, we investigate how Fe dopants (\\FeTi{}) and oxygen vacancies (\\VO{}) in different charge states affect the OER on TiO$_2$-terminated \\ce{SrTiO3}(001). We combine charge-dependent defect formation energies, segregation energies, and charge transition levels with OER free-energy profiles obtained in the computational hydrogen electrode framework. Neutral \\FeTix{} preserves near-pristine activity, with overpotentials of $0.43$--$0.48$~V compared to $0.45$~V for the pristine surface, whereas the reduced states \\FeTip{} and \\FeTipp{} raise the overpotential to as much as $1.35$~V when intermediates bind to Ti sites adjacent to surface Fe. Oxygen vacancies segregate to the surface across the entire band gap ($\\Delta E_\\mathrm{seg} = -0.50$ to $-0.80$~eV) but do not improve the activity: \\VOx{} and \\VOp{} overstabilize oxygenated intermediates ($\\eta$ up to $2.13$~V), and only \\VOpp{} retains a balanced pathway ($\\eta = 0.45$~V in the bulk-like region). Because the stable charge state and the segregation tendency of each defect are set by the Fermi level, the OER overpotential itself becomes a Fermi-level-dependent quantity. These results establish Fermi-level engineering as a framework for assessing and tuning defect-mediated OER activity in perovskite oxides.", "url": "https://arxiv.org/abs/2606.14938", "type": "理论+数值", "summary": "1. 该工作利用第一性原理密度泛函理论，系统研究了Fe掺杂与氧空位在不同电荷态下对SrTiO₃(001)表面析氧反应活性的影响。\n2. 其核心发现是缺陷的稳定电荷态和表面偏析倾向均由费米能级决定，从而使析氧过电位成为费米能级依赖的可调物理量。\n3. 这为建立费米能级工程框架以评估和调控钙钛矿氧化物中缺陷介导的析氧反应活性提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Amit Sehrawat"}, {"name": "Jochen Rohrer"}], "featured_authors": [{"name": "Amit Sehrawat"}, {"name": "Jochen Rohrer"}], "author_count": 2}, {"id": "2606.14978", "category": "cond-mat", "title": "Complementary Thermodynamic Mechanisms of Boron and Carbon Segregation at Grain Boundaries in Nickel Alloys", "abstract": "Grain boundary stabilization by light interstitials is central to the performance of Ni-based superalloys, yet the thermodynamic mechanisms governing their interactions with substitutional chemistry remain poorly resolved. Here, we use hybrid Monte Carlo molecular dynamics simulations to quantify how boron and carbon modify the thermodynamic, structural, and chemical ordering of grain boundaries in Ni--Cr alloys. By analyzing interfacial state variables, site-resolved segregation spectra, local chemical ordering, and structural evolution, we show that boron and carbon stabilize grain boundaries through complementary pathways. Carbon drives saturation-controlled stabilization by recruiting Cr and conditioning boundary chemistry, while suppressing temperature-driven structural transformations of the boundary. In contrast, boron stabilizes grain boundaries through a selective mechanism that lowers the interfacial grand potential via localized ordering while permitting gradual structural evolution. These effects arise from coupled interactions between interstitial segregation and Cr redistribution, which together regulate site accessibility, chemical competition, and the range of accessible interfacial states. This work provides a thermodynamic framework for grain boundary engineering and suggests design principles for leveraging interstitial-substitutional interactions in alloys.", "url": "https://arxiv.org/abs/2606.14978", "type": "理论+数值", "summary": "1. 该工作采用混合蒙特卡罗分子动力学模拟，定量揭示了硼和碳在Ni—Cr合金晶界处偏析的互补热力学机制。\n2. 其核心在于碳通过饱和控制募集Cr并抑制界面结构转变，而硼则通过选择性局部有序降低巨势，两者均源于间隙原子与替代原子的耦合作用。\n3. 这为利用间隙-替代相互作用设计晶界工程提供了热力学框架与原理性启发。", "summary_source": "deepseek", "authors": [{"name": "Tyler D. Doležal"}, {"name": "Rodrigo Freitas"}, {"name": "Ju Li"}], "featured_authors": [{"name": "Tyler D. Doležal"}, {"name": "Rodrigo Freitas"}, {"name": "Ju Li"}], "author_count": 3}, {"id": "2606.15051", "category": "cond-mat", "title": "Ternary-composition tuning of the anomalous Nernst effect in amorphous-like Gd-Co-Pt films", "abstract": "We report composition tuning of the anomalous Nernst effect in amorphous-like Gd-Co-Pt ternary films. Pt incorporation into Gd-Co films modifies the anomalous Nernst coefficient and induces a sign reversal of S_ANE, whereas Gd incorporation into Co-Pt films suppresses S_ANE but reduces thermal conductivity. Owing to the balance between transverse thermoelectric response and thermal transport, the heat-flux sensitivity reaches approximately 0.24 {\\mu}m/A. Composition maps reveal that the magnitude and heat-flux sensitivity of the anomalous Nernst effect can be systematically tuned in the Gd-Co-Pt ternary composition space. This work extends ANE material design from binary-alloy optimization to ternary-composition engineering.", "url": "https://arxiv.org/abs/2606.15051", "type": "数值", "summary": "1. 该工作报道了非晶态Gd-Co-Pt三元薄膜中异常能斯特效应的组分调控，实现了反常能斯特系数符号反转与热流灵敏度优化。\n2. 其核心在于通过Pt掺入与Gd掺入分别调控反常能斯特系数和热导率，在热电响应与热输运的平衡下获得约0.24 μm/A的探测灵敏度。\n3. 这为异常能斯特材料的设计从二元合金优化扩展至三元组分工程提供了思路，可启发新型横向热电材料的组分空间探索。", "summary_source": "deepseek", "authors": [{"name": "Tomohiro Koizumi"}, {"name": "Mojtaba Mohammadi"}, {"name": "Hiroto Imaeda"}, {"name": "Hiroyuki Awano"}, {"name": "Kenji Tanabe"}], "featured_authors": [{"name": "Tomohiro Koizumi"}, {"name": "Mojtaba Mohammadi"}, {"name": "Hiroto Imaeda"}, {"name": "Hiroyuki Awano"}, {"name": "Kenji Tanabe"}], "author_count": 5}, {"id": "2606.15100", "category": "cond-mat", "title": "Universal scaling in the rheology of dense cellular systems", "abstract": "Biological tissues must dynamically transition between rigid and fluid-like states during processes like morphogenesis and collective migration, often while simultaneously resisting physiological shear stresses. It remains unclear whether these tissue dynamics are governed by the same non-equilibrium critical phenomena that control conventional disordered matter. Here we show that model cell monolayers under constant stress display a rich phase diagram of nonlinear rheology. In rigid regimes, small internal fluctuations maintain a solid-like state up to a finite yield stress, above which the tissue shear-thins; conversely, fluid-like regimes exhibit robust continuous and discontinuous shear thickening, culminating in structural arrest via shear jamming. This space-filling shear-jamming transition is accompanied by structural changes including the formation of system-spanning force chains and the emergence of orientational ordering. We demonstrate that the macroscopic viscosity across these disparate regimes is described by universal scaling behavior controlled by the same underlying physical parameters. These results establish confluent tissues as a distinct class of disordered matter, demonstrating that universal jamming phenomena can emerge entirely through shape-driven topological constraints to regulate biological mechanics.", "url": "https://arxiv.org/abs/2606.15100", "type": "理论+数值", "summary": "1. 该工作通过模拟细胞单层在恒定应力下的非线性流变学行为，揭示了刚性态与流体态间丰富的相图，包含屈服应力、剪切变稀及连续/非连续剪切增稠直至剪切堵塞的转变。\n2. 其核心发现是不同流变区域内的宏观粘度由同一组物理参数控制的通用标度行为描述，且剪切堵塞伴随系统级力链与取向序的涌现。\n3. 这确立了拥挤组织作为一类由形状驱动拓扑约束调控的无序物质，为理解生物组织的力学调控与非平衡临界现象提供了统一框架。", "summary_source": "deepseek", "authors": [{"name": "Helen S. Ansell"}, {"name": "Daniel M. Sussman"}], "featured_authors": [{"name": "Helen S. Ansell"}, {"name": "Daniel M. Sussman"}], "author_count": 2}, {"id": "2606.15131", "category": "cond-mat", "title": "Quasiparticle Diffusion for the Toda Fluid in Equilibrium", "abstract": "Many-body integrable systems can be understood as a gas of quasiparticles. They propagate ballistically and drive large-scale transport. However, with the exception of the hard rods system, no tools have been available to numerically track such quasiparticles. Focusing on the Toda fluid, whose integrability relies on the availability of a Lax pair, we present a numerical scheme to track quasiparticle trajectories as determined by the time-dependent eigenvectors of the Lax matrix. Simulating the Toda fluid in thermal equilibrium, this tracking scheme is used to numerical confirm Brownian motion of a quasiparticle. Simulated is also the motion of a tagged particle. Our numerical results for the diffusion constant matches with a novel TBA prediction. We believe our numerical scheme can be extended to other classical many-particle models possessing a Lax matrix.", "url": "https://arxiv.org/abs/2606.15131", "type": "理论+数值", "summary": "1. 该工作提出了一个基于Lax矩阵时变特征向量追踪准粒子轨迹的数值方案，并应用于平衡态Toda流体。\n2. 其核心在于首次在非硬杆可积系统中数值实现了准粒子的布朗运动观测，且扩散常数与热力学Bethe ansatz预测精确吻合。\n3. 这为推广至其他具有Lax对结构的经典多粒子可积模型的准粒子扩散研究提供了通用数值方法。", "summary_source": "deepseek", "authors": [{"name": "Seema Chahal"}, {"name": "Alberto Brollo"}, {"name": "Indranil Mukherjee"}, {"name": "Abhishek Dhar"}, {"name": "Anupam Kundu"}, {"name": "Herbert Spohn"}], "featured_authors": [{"name": "Seema Chahal"}, {"name": "Alberto Brollo"}, {"name": "Indranil Mukherjee"}, {"name": "Abhishek Dhar"}, {"name": "Anupam Kundu"}, {"name": "Herbert Spohn"}], "author_count": 6}, {"id": "2606.15212", "category": "cond-mat", "title": "Creation and motion of antiferromagnetic skyrmions by edge manipulation", "abstract": "Magnetic racetrack architectures that use topological magnetic particles to store information are one of the most promising concepts for future storage applications. Antiferromagnetic racetracks are particularly appealing as they are not susceptible to external magnetic fields. State-of-the-art racetracks use magnetic fields, spin-transfer and spin-orbit torques caused by electric currents to move the bits across the entire circuit. However, the application of currents in many antiferromagnetic racetracks is limited because many of them are insulating. Recently, however, a concept for ferromagnetic racetrack memories that are free of global driving forces has been proposed. It has been demonstrated that various topological entities can be generated and transported over long distances solely through local magnetization rotation at the sample boundaries, independent of global driving forces. Here, we demonstrate that the local rotation of magnetization at the boundary of an antiferromagnetic sample can be exploited in racetracks to efficiently generate and transmit antiferromagnetic skyrmions. Additionally, we demonstrate that local switching of staggered magnetization at the edge of an antiferromagnetic racetrack can be even more successful than the rotational procedure. A comparison of ferromagnetic and antiferromagnetic processing of skyrmionic bits, together with energy considerations, shows that this procedure is fairly efficient in antiferromagnets.", "url": "https://arxiv.org/abs/2606.15212", "type": "理论", "summary": "1. 该工作展示了通过反铁磁样品边界的局域磁化旋转或交错磁化切换，无需全局驱动力即可高效产生并传输反铁磁斯格明子。\n2. 技术关键在于边界操控即可生成和运动拓扑自旋结构，且局域切换比旋转过程更高效，反铁磁体系因抗外磁场干扰而更具优势。\n3. 这为绝缘反铁磁赛道存储提供了一种无电流驱动的拓扑比特操控方案，有望推动低功耗、高稳定性的存储技术发展。", "summary_source": "deepseek", "authors": [{"name": "Aleksey Berg"}, {"name": "Tim Matthies"}, {"name": "Roland Wiesendanger"}, {"name": "Elena Y. Vedmedenko"}], "featured_authors": [{"name": "Aleksey Berg"}, {"name": "Tim Matthies"}, {"name": "Roland Wiesendanger"}, {"name": "Elena Y. Vedmedenko"}], "author_count": 4}, {"id": "2606.15245", "category": "cond-mat", "title": "Interaction and non-Hermiticity controlled transmission in extended Su-Schrieffer-Heeger models", "abstract": "We study the transport characteristics of an extended version of the Su-Schrieffer-Heeger (SSH) model with next-nearest-neighbor (NNN) interactions and non-Hermitian onsite energies. We observed that transport in such a system is significantly modified by the NNN interaction and the non-Hermitian terms. The transmission coefficient exhibits oscillatory behavior as the strength of the NNN interaction varies in a fixed-length chain. Moreover, the transmission coefficient also shows oscillation with system size for a fixed strength of the NNN interaction. We find that novel oscillatory behavior of the transmission coefficient, arising form the NNN interaction, is a unique feature of such a model and has not been reported previously. The presence of the non-Hermitian terms also enhances/reduces the transmission coefficient depending on the values of the other system parameters like intra-, inter- and NNN hopping. It appears from our study that both the NNN interaction and the non-Hermiticity introduce significant changes in the transport properties of the extended SSH chain, which are not observed in the standard Hermitian nearest-neighbour variant of the SSH model.", "url": "https://arxiv.org/abs/2606.15245", "type": "理论", "summary": "1. 该工作研究了扩展Su-Schrieffer-Heeger模型中次近邻相互作用与非厄米格点势对输运特性的调控。\n2. 主要发现为传输系数随次近邻相互作用强度及系统尺寸呈现新颖振荡行为，且非厄米项可增强或抑制透射。\n3. 这揭示了非厄米性与长程耦合协同诱导的输运现象，为设计基于拓扑链的量子传输器件提供了新机制。", "summary_source": "deepseek", "authors": [{"name": "Syeda Rafisa Rahaman"}, {"name": "Shreekantha Sil"}, {"name": "Nilanjan Bondyopadhaya"}], "featured_authors": [{"name": "Syeda Rafisa Rahaman"}, {"name": "Shreekantha Sil"}, {"name": "Nilanjan Bondyopadhaya"}], "author_count": 3}, {"id": "2606.15279", "category": "cond-mat", "title": "On the flow of electrically charged particles in an elastic solid", "abstract": "This paper is a specialization of a broad and complicated continuum theory [ arXiv:2403.07582 ] to a relatively simple and useful case so that it is more reader friendly. A continuum theory of the flow of charged particles in an elastic solid is presented. It can describe the behavior of soft solid electrolytes and elastic semiconductors. It is nonlinear and is valid for large deformation and strong fields. The theory is derived from a three-continuum mixture model including a charged lattice continuum, a bound charge continuum for electric polarization, and an ideal fluid for the flow of mobile charges. The basic electromechanical laws are applied systematically to the model. The electric fields are quasistatic and are in SI units.", "url": "https://arxiv.org/abs/2606.15279", "type": "理论", "summary": "1. 本文将先前复杂连续介质理论[arXiv:2403.07582]特化为带电粒子在弹性固体中流动的理论，适用于软固体电解质与弹性半导体。\n2. 核心卖点在于采用含带电晶格、束缚电荷和理想流体可移动电荷的三连续介质混合模型，系统应用准静态机电定律，支持大变形与强场。\n3. 该非线性理论为理解及预测软物质与半导体中带电粒子的输运与电机械耦合行为提供了统一框架，可启发后续实验与数值研究。", "summary_source": "deepseek", "authors": [{"name": "Jiashi Yang"}], "featured_authors": [{"name": "Jiashi Yang"}], "author_count": 1}, {"id": "2606.15294", "category": "cond-mat", "title": "Identifying Mobility Edge from Finite Temperature Spectral Form Factor", "abstract": "The spectral form factor (SFF) is a measure of energy correlations and has been widely used to identify the transition from the ergodic to the localized phase in interacting many-body quantum systems. In this work, we show that in a disordered Heisenberg spin-$\\frac{1}{2}$ model, the finite temperature SFF can be used to generate a canonical phase diagram exhibiting a critical temperature $T_\\mathrm{MBL}$. Using simple ideas of statistical mechanics, we obtain the critical energy density $\\epsilon_\\mathrm{MBL}$ dual to $T_\\mathrm{MBL}$. We show that the mobility edge (ME), numerically estimated from the spread of local perturbations and the optical conductivity, indeed coincides with $\\epsilon_\\mathrm{MBL}$.", "url": "https://arxiv.org/abs/2606.15294", "type": "理论+数值", "summary": "1. 该工作通过有限温度光谱形状因子，在无序海森堡自旋-1/2模型中构造了包含临界温度的规范相图并提取了迁移率边。\n2. 其卖点在于利用统计力学由临界温度得到对应临界能量密度，并证明了该能量密度与基于局域扰动扩展及光导率数值估计的迁移率边精确一致。\n3. 这为多体局域化系统中迁移率边的有限温度谱统计诊断提供了严格且可操作的方案。", "summary_source": "deepseek", "authors": [{"name": "Basudha Roy"}, {"name": "Anandamohan Ghosh"}, {"name": "Adway Kumar Das"}], "featured_authors": [{"name": "Basudha Roy"}, {"name": "Anandamohan Ghosh"}, {"name": "Adway Kumar Das"}], "author_count": 3}, {"id": "2606.15312", "category": "cond-mat", "title": "Intrinsic decay length in elastic localization", "abstract": "Localization in finite elastic structures is often studied using infinite-domain solutions, which avoid the explicit treatment of boundaries and admit simpler analytical descriptions. Yet it remains poorly understood when finite-domain localized states can be accurately approximated by their infinite-domain counterparts. In this work, we show that the accuracy is controlled by an intrinsic decay length. Using a prototypical localization model, we show that finite-domain localized solutions converge exponentially to the corresponding infinite-domain localized solution once the structural length exceeds the intrinsic decay length. The intrinsic decay length also explains the markedly different validity regimes of finite- and infinite-domain weakly nonlinear approximations. It further has important implications for numerical computation, since once the structural length exceeds the intrinsic decay length, localized solutions corresponding to different domain lengths differ only by exponentially small quantities, making them increasingly difficult to distinguish numerically. The theoretical predictions are validated using two representative localization problems: bulging in membrane tubes and localized helical buckling in twisted rods. The present work provides a unified geometric framework for understanding localization transition, asymptotic validity, and numerical computation in elastic localization.", "url": "https://arxiv.org/abs/2606.15312", "type": "理论+数值", "summary": "1. 该工作通过弹性能量局域化的原型模型证明，有限结构局域态近似于无限域解的准确性由本征衰减长度控制。\n2. 其核心发现在于，一旦结构尺度超越此衰减长度，有限域解便指数收敛于无限域解，并由此统一解释了有限与无限域弱非线性近似有效性的显著差异及其对数值区分的困难。\n3. 这为理解弹性局域化转变、渐近有效性及数值计算建立了统一的几何框架，并通过膜管鼓胀和扭杆局域螺旋屈曲两个典型问题得到验证。", "summary_source": "deepseek", "authors": [{"name": "Xiang Yu"}], "featured_authors": [{"name": "Xiang Yu"}], "author_count": 1}, {"id": "2606.15321", "category": "cond-mat", "title": "Symmetry-aware generative design of flat-band materials beyond known crystal-net prototypes", "abstract": "Flat electronic bands underlie a range of strongly correlated and topological phenomena, whose design in real materials has so far relied on a small catalogue of named geometric motifs such as kagome, Lieb, and pyrochlore nets. This discrete catalogue is by no means to exhaust the geometries that support flat bands in real compounds, as band flatness is a property of network connectivity. Here we combine a continuous geometric representation of crystal sublattices, with a symmetry-constrained generative model, to access a broader design space for materials hosting flat bands. The key step is to choose sublattice motifs that are outside the known geometric clusters, ensuring the novelty of the generated structures. We then introduce SkeleGen, which pins these unconventional skeletons to symmetry-compatible Wyckoff positions while denoising the surrounding chemistry, resulting in 9,352 crystal candidates that survive stability and flatnessscreening. Band flatness is confirmed using high throughput full DFT calculations, which agree well also with the tight-binding spectra of the isolated skeletons, supporting a geometric origin of the band flatness. We demonstrate \"out-of-distribution\" motifs as a new design principle to dramatically expand geometric repertoire for materials discovery, potentially beyond flat bands.", "url": "https://arxiv.org/abs/2606.15321", "type": "理论+数值", "summary": "1. 本工作将连续几何表示与对称约束生成模型结合，提出一种超越已知晶体网络原型的平带材料生成设计方法。\n2. 其技术核心在于选择分布外的子格motif，并通过SkeleGen将其固定至对称兼容的Wyckoff位置，结合高通量DFT确认平带的几何起源。\n3. 这展示了“分布外”motif作为新设计原则，可大幅扩展平带及相关强关联拓扑物态的材料发现空间。", "summary_source": "deepseek", "authors": [{"name": "Yihao Wei"}, {"name": "Ivan Savochkin"}, {"name": "Artem Mishchenko"}, {"name": "Xiangwen Wang"}, {"name": "Qian Yang"}], "featured_authors": [{"name": "Yihao Wei"}, {"name": "Ivan Savochkin"}, {"name": "Artem Mishchenko"}, {"name": "Xiangwen Wang"}, {"name": "Qian Yang"}], "author_count": 5}, {"id": "2606.15336", "category": "cond-mat", "title": "Nonlocal Orbital-Free Kinetic Energy Functional from the Jellium-with-Gap Model for Finite Systems", "abstract": "The quasi-linear scaling of orbital-free density functional theory (OF-DFT) with system size makes it a computationally efficient alternative to conventional Kohn--Sham density functional theory for many condensed-matter applications. However, its applicability remains limited, particularly for finite systems such as molecular clusters, due to the lack of accurate kinetic energy density functionals. In this context, the development of nonlocal kinetic energy density functionals (NL-KEDFs) has significantly advanced the practical utility of OF-DFT. Here, following an alternative formulation based on the linear-response kernel derived from the jellium-with-gap model (JGM), we develop an NL-KEDF capable of accurately describing the diverse density regimes characteristic of finite systems, including molecular clusters. Benchmark calculations, together with an analysis of the corresponding Pauli potentials, demonstrate that the proposed functional achieves higher accuracy than state-of-the-art orbital-free approaches for finite systems. Furthermore, the optical properties computed using the present method show good agreement with reference results, highlighting its reliability. These results indicate that the proposed NL-KEDF provides a robust and efficient framework for extending OF-DFT to finite systems, with potential implications for nanomaterial design and a deeper understanding of nanoscale phenomena.", "url": "https://arxiv.org/abs/2606.15336", "type": "理论+数值", "summary": "1. 该工作基于凝胶-带隙模型的线性响应核，发展了一种适用于分子团簇等有限体系的非局域动能密度泛函。\n2. 其核心在于通过JGM推导的核函数精准描述有限体系的多密度区域，使得Pauli势与光学性质计算优于现有无轨道方法。\n3. 这为将无轨道密度泛函理论高效拓展至纳米材料设计及有限体系物性研究提供了可靠框架。", "summary_source": "deepseek", "authors": [{"name": "Abhishek Bhattacharjee"}, {"name": "Subrata Jana"}, {"name": "Szymon Smiga"}, {"name": "Prasanjit Samal"}], "featured_authors": [{"name": "Abhishek Bhattacharjee"}, {"name": "Subrata Jana"}, {"name": "Szymon Smiga"}, {"name": "Prasanjit Samal"}], "author_count": 4}, {"id": "2606.15337", "category": "cond-mat", "title": "A Unified Dielectric-Dependent Hybrid Functional for Accurate Band Gaps across Dimensions", "abstract": "Predicting fundamental band gaps across material classes and dimensionalities remains a central challenge in electronic-structure theory. Here, we show that intrinsic dielectric screening provides a unified control parameter for nonlocal exchange from bulk to low-dimensional and heterogeneous materials. We introduce a geometry-independent dielectric response and incorporate it self-consistently into a nonempirical screened-dielectric-dependent hybrid functional. Benchmarks for 100 materials spanning bulk, two-dimensional, one-dimensional, and mixed-dimensional systems show near-GW accuracy at the computational cost of generalized Kohn-Sham theory. These results reveal a screening-exchange-gap relation in which reduced dimensionality weakens intrinsic dielectric screening, strengthens nonlocal exchange, and drives the opening of fundamental gaps.", "url": "https://arxiv.org/abs/2606.15337", "type": "理论", "summary": "1. 该工作提出一种统一介电依赖杂化泛函方法，基于本征介电屏蔽作为非局域交换的统一控制参量。\n2. 其核心在于引入与几何结构无关的介电响应并自洽纳入非经验筛选介电依赖泛函，对100种体相、低维及混合维度材料实现近GW精度。\n3. 这一工作揭示了维度降低削弱本征介电屏蔽、增强非局域交换并驱动带隙打开的屏蔽-交换-带隙关系，为高效准确预测电子结构提供普适框架。", "summary_source": "deepseek", "authors": [{"name": "Subrata Jana"}, {"name": "Manoar Hossain"}, {"name": "Arghya Ghosh"}, {"name": "Gabriel Chirchir"}, {"name": "Prasanjit Samal"}, {"name": "Szymon Smiga"}], "featured_authors": [{"name": "Subrata Jana"}, {"name": "Manoar Hossain"}, {"name": "Arghya Ghosh"}, {"name": "Gabriel Chirchir"}, {"name": "Prasanjit Samal"}, {"name": "Szymon Smiga"}], "author_count": 6}, {"id": "2606.15403", "category": "cond-mat", "title": "Cobalt-Catalysed Chain Transfer Polymerisation Enables Soft Methacrylate Nematic Elastomers for Switchable Pressure-Sensitive Adhesion", "abstract": "Liquid crystal elastomers (LCEs) exhibit unique viscoelastic behavior arising from reversible liquid-crystalline ordering, making them attractive candidates for switchable pressure-sensitive adhesives (PSAs). However, methacrylate-based LCEs are typically highly crosslinked, leading to elevated glass-transition temperatures ($T_g$) and storage moduli ($E'$) that limit adhesive performance. Here, we demonstrate that catalytic chain-transfer polymerization provides an effective strategy for engineering soft methacrylate nematic elastomers through systematic control of network architecture. Incorporation of parts-per-million concentrations of bis(boron difluorodimethylglyoximate)cobalt(II) (CoBF) during photopolymerization reduced the effective crosslink density and increased the molecular weight between crosslinks, producing substantial decreases in $T_g$ and $E'$ while preserving nematic order. Dynamic mechanical analysis revealed that increasing CoBF concentration enhanced viscoelastic dissipation and broadened the accessible nematic temperature window. To further optimize rheological properties for pressure-sensitive adhesion, monofunctional methacrylates and flexible poly(ethylene glycol) dimethacrylate (PEGDMA) were incorporated into the network. The optimized formulation exhibited a $T_g$ near 0~$^\\circ$C, a room-temperature storage modulus of approximately 0.3 MPa, and high damping behavior, approaching the Dahlquist criterion for pressure-sensitive adhesion. As a result, the resulting nematic elastomers displayed strong tack, peel, and lap-shear adhesion in the nematic state, together with rapid, reversible, and residue-free debonding upon heating above the nematic-to-isotropic transition temperature.", "url": "https://arxiv.org/abs/2606.15403", "type": "理论+数值", "summary": "1. 该工作利用钴催化链转移聚合策略，在甲基丙烯酸酯向列弹性体光聚合中引入ppm级CoBF催化剂降低有效交联密度，使玻璃化转变温度降至约0°C、室温储能模量降至约0.3 MPa，同时保持向列有序。\n2. 其技术核心在于通过催化剂浓度系统调控网络拓扑以增大交联间分子量，并结合单官能单体与柔性双官能交联剂共聚优化流变性能，使材料满足Dahlquist压敏粘附准则并增强粘弹性耗散与拓宽向列温区。\n3. 所得材料在向列态呈现强粘附，加热至向列-各向同性转变温度以上可快速、可逆、无残留脱粘，为基于液晶弹性体相转变的智能可切换压敏胶提供了网络工程设计思路。", "summary_source": "deepseek", "authors": [{"name": "Noboru Koshimizu"}, {"name": "Mohand O. Saed"}], "featured_authors": [{"name": "Noboru Koshimizu"}, {"name": "Mohand O. Saed"}], "author_count": 2}, {"id": "2606.15414", "category": "cond-mat", "title": "Cluster-based Message-Passing (CluMP) Optimization for Complex QUBO Problems", "abstract": "Quadratic Unconstrained Boolean Optimization (QUBO) problems are widespread in both industrial applications and scientific studies. A QUBO problem corresponds to the optimization of a system of Ising spins defined on a generally sparse and heterogeneous graph. When the QUBO problem contains conflicting requests, the corresponding Ising system is frustrated, generating a complex energy landscape, which is hard to explore and optimize. Despite extensive algorithmic and hardware developments, finding low-energy configurations in these systems remains challenging (e.g., local-update heuristics typically become trapped in metastable states), especially when the (possibly frustrated) interactions generate extended correlated domains. We introduce CluMP (Cluster-based Message-Passing), an algorithm that performs collective updates on connected clusters of spins using information from Belief Propagation (BP). By controlling the amount of frustration within clusters, CluMP enables BP convergence on large subgraphs and proposes nonlocal rearrangements involving up to hundreds of spins in a single move. We benchmark CluMP against state-of-the-art local-update heuristics on spin-glass models defined on several graph topologies, including random regular graphs and lattice regular graphs in two and three dimensions. Cluster moves consistently bypass local trapping and reach lower energies with fewer effective operations than single-spin dynamics. These results demonstrate that frustration-tolerant cluster updates can be implemented efficiently on sparse graphs. The CluMP framework provides a scalable strategy for large-scale combinatorial optimization and inference problems, where exploiting medium- and long-range correlations is key to navigating complex energy landscapes.", "url": "https://arxiv.org/abs/2606.15414", "type": "理论+数值", "summary": "1. 该工作提出基于簇的消息传递（CluMP）算法，用于求解定义在稀疏异质图上的二次无约束布尔优化（QUBO）问题，即受挫伊辛自旋系统的能量最小化。\n2. 核心卖点在于通过信念传播控制簇内挫败度，实现对包含数百自旋的大子图进行可收敛的集体非局域更新，从而避免局部更新启发式算法的亚稳态陷阱。\n3. 这为大规模组合优化和推理问题提供了可扩展策略，尤其适用于需要利用中长程相关性来导航复杂能量景观的场景。", "summary_source": "deepseek", "authors": [{"name": "Paolo Rissone"}, {"name": "Stefan Boetcher"}, {"name": "Alfonso Amendola"}, {"name": "Simone Sala"}, {"name": "Federico Ricci-Tersenghi"}], "featured_authors": [{"name": "Paolo Rissone"}, {"name": "Stefan Boetcher"}, {"name": "Alfonso Amendola"}, {"name": "Simone Sala"}, {"name": "Federico Ricci-Tersenghi"}], "author_count": 5}, {"id": "2606.15492", "category": "cond-mat", "title": "Underscreening and related phenomena in strong electrolytes", "abstract": "We propose a heuristic model of underscreening phenomenon in high density Coulomb systems, such as strong electrolytes and electron hole conglomerates under ultra high dose rate (UHDR) radiation in biological tissues. It explains the data on screening length $L$ increasing with charge particle concentration and offers additional insights in understanding the conductivity and reduction potential of concentrated electrolytes. Also, it validates our current understanding of the FLASH radiation treatment of tumors (FLASH-RT) perceived as an analogous system. The underlying physics is that mutual binding creates diffusion barriers which suppress the concentration of mobile particles thus increasing the screening length. Also, they slow down the rates of chemical reactions responsible for generation of biologically active radicals which explains the sparing effect observed under UHDR.", "url": "https://arxiv.org/abs/2606.15492", "type": "理论", "summary": "1. 该工作提出了一个描述强电解质中欠屏蔽现象的经验模型，解释屏蔽长度随浓度增大的反直觉行为。\n2. 其物理核心在于离子相互结合形成扩散屏障，抑制自由载流子浓度，同时减缓活性自由基生成速率。\n3. 该模型为理解高密度库仑体系的输运与反应动力学提供了框架，并启发电解液与FLASH放疗中类比现象的研究。", "summary_source": "deepseek", "authors": [{"name": "Diana Shvydka"}, {"name": "Victor Karpov"}], "featured_authors": [{"name": "Diana Shvydka"}, {"name": "Victor Karpov"}], "author_count": 2}, {"id": "2606.15557", "category": "cond-mat", "title": "Entropic Necks, Dynamic Crossovers, and Fragility in Supercooled Liquids", "abstract": "The dramatic slowdown of dynamics in supercooled liquids is accompanied by a sequence of dynamical crossovers, most notably the transition from high-temperature collision-dominated transport to low-temperature activated structural relaxation. A particularly striking manifestation of this change is the crossover from Rosenfeld excess-entropy scaling to the Adam--Gibbs relation. In this work we develop a theoretical framework based on a configuration-space extension of Zwanzig's entropic-neck picture and combine it with a Mori--Zwanzig memory-function formalism to address anomalies of supercooled liquids. The central idea is that structural relaxation is controlled by the narrowing of configurational pathways connecting metastable basins of the inherent-structure landscape. Starting from coupled slow variables describing intrabasin motion and neck fluctuations, we derive a reduced generalized Langevin description in which elimination of the neck coordinate generates a long-lived memory kernel and naturally leads to entropy-controlled activated dynamics. At high temperatures the neck is broad and readily accessible, yielding Rosenfeld-type transport governed primarily by local structural entropy. Upon cooling, progressive neck constriction produces an increasing entropy deficit, leading to Adam--Gibbs behavior and activated relaxation. Within this picture, fragility acquires a simple geometric interpretation: fragile liquids are characterized by a rapid collapse of the effective configurational neck with decreasing temperature, whereas strong liquids exhibit a much slower evolution of accessible pathways. The framework does not by itself compute the configurational entropy, mismatch penalty, or cooperative length from microscopic interactions; its aim is to provide a dynamical and geometrical interpretation.", "url": "https://arxiv.org/abs/2606.15557", "type": "理论", "summary": "1. 该工作将Zwanzig熵瓶颈图扩展到位形空间，结合Mori–Zwanzig记忆函数，建立了描述过冷液体动态交叉与脆性的理论框架。\n2. 核心在于揭示结构弛豫受连接亚稳盆地的位形路径变窄控制，消除瓶颈坐标可产生熵激活记忆核，统一了Rosenfeld标度与Adam–Gibbs关系，并赋予脆性以几何解释。\n3. 该框架为过冷液体动力学提供了动力学-几何统一视角，启发未来基于微观相互作用直接计算位形瓶颈结构与合作长度的研究。", "summary_source": "deepseek", "authors": [{"name": "Biman Bagchi"}], "featured_authors": [{"name": "Biman Bagchi"}], "author_count": 1}, {"id": "2606.15588", "category": "cond-mat", "title": "Topological Tricritical Ising Universality Class in One Dimension", "abstract": "Recent advances have revealed that quantum critical universality can be enriched by nontrivial topology. Here we study the tricritical point of the one-dimensional cluster O Brien-Fendley model and show that it realizes a topologically nontrivial tricritical Ising ($\\text{TCI}^*$) universality class. The transition shares the local bulk conformal data of ordinary TCI criticality, while realizing a distinct symmetry-enriched topological sector, manifested through a protected twofold degeneracy under open boundary conditions. We further show that TCI criticality admits two spontaneously fixed boundary conditions, realized respectively through symmetry enrichment and boundary renormalization-group flow, which are distinguished by the $\\mathbb{Z}_2^T$ charge of the disorder field. Remarkably, we find that the topological twofold degeneracy at the $\\text{TCI}^*$ critical point exhibits an exponential energy splitting, in stark contrast to the algebraic splitting at the $\\text{Ising}^*$ critical point. These results reveal a symmetry-enriched form of TCI criticality and uncover topologically distinct boundary structures beyond those of the ordinary TCI theory.", "url": "https://arxiv.org/abs/2606.15588", "type": "理论", "summary": "1. 该工作研究一维簇O’Brien-Fendley模型的三临界点，证实其实现拓扑非平凡的三临界伊辛（TCI*）普适类。\n2. 卖点在于该临界点与普通TCI共享局域共形数据，但通过开边界下受保护二重简并与指数能量分裂区分对称性增强拓扑扇区。\n3. 这揭示了量子临界性中拓扑与对称性增强的新相互作用形式，并为探索超越普通共形场论的边界结构提供了方向。", "summary_source": "deepseek", "authors": [{"name": "Sheng Yang"}, {"name": "Hai-Qing Lin"}, {"name": "Xue-Jia Yu"}], "featured_authors": [{"name": "Sheng Yang"}, {"name": "Hai-Qing Lin"}, {"name": "Xue-Jia Yu"}], "author_count": 3}, {"id": "2606.15605", "category": "cond-mat", "title": "Dressed Floquet scars from protected zero modes in a Rydberg chain", "abstract": "In this Letter, we present an approximate analytic construction of two zero quasienergy quantum many-body scars in a periodically driven model of Rydberg atoms on a ring, which persist over a range of driving amplitudes and frequencies for finite sizes. An index theorem protects an exponentially large number (in system size) of exact zero energy modes of the Floquet Hamiltonian in this setting. Unlike most of these zero modes which continuously change with drive parameters, these two quantum many-body scars retain the memory of particular states. They can be expressed as {\\it dressed versions} of two contrasting states, the Rydberg vacuum and a unitarily rotated variant of a volume-law scar [Ivanov and Motrunich, Phys. Rev. Lett. {\\bf 134}, 050403 (2025)], respectively. We provide an analytic understanding of their existence using a Floquet perturbation theory and show their resilience beyond the perturbative regime using exact diagonalization in finite systems. Our study provides insight into the structure of protected zero modes in interacting Floquet settings.", "url": "https://arxiv.org/abs/2606.15605", "type": "理论+数值", "summary": "1. 该工作在周期性驱动的Rydberg原子环链中构造了两个持久的近似零准能量量子多体疤痕，其存在依赖于Floquet哈密顿量指数多（系统尺寸）的精确零模。\n2. 技术关键在于阐明这两个疤痕分别对应Rydberg真空和体积律疤痕的幺正旋转修正版本，受指数定理保护并可通过Floquet微扰理论解析理解。\n3. 这为理解相互作用Floquet系统中受保护零模的结构提供了清晰图景，并预示了其超越微扰区间的鲁棒性。", "summary_source": "deepseek", "authors": [{"name": "Saptadip Roy"}, {"name": "Bhaskar Mukherjee"}, {"name": "K. Sengupta"}, {"name": "Arnab Sen"}], "featured_authors": [{"name": "Saptadip Roy"}, {"name": "Bhaskar Mukherjee"}, {"name": "K. Sengupta"}, {"name": "Arnab Sen"}], "author_count": 4}, {"id": "2606.15613", "category": "cond-mat", "title": "Unveiling AlSb as a Promising Zincblende Semiconductor for Visible-Light Shift-Current Generation", "abstract": "We use density functional theory to investigate the shift-current response in zincblende III--V (AlP, AlAs, AlSb, GaP, GaAs, InP, InAs, and InSb) and II--VI (ZnS, ZnSe, ZnTe, CdS, CdSe, and CdTe) semiconductors. Our main goal is to identify which material generates the largest shift-current under illumination and to examine the factors influencing this response. We find that aluminum-containing semiconductors, particularly AlSb, exhibit the highest shift-current responses, while CdSe shows the lowest. We analyze the contributions of specific band-to-band transitions to the shift-current in AlSb by selectively summing valence and conduction bands. Additionally, we calculate delocalization indices to investigate the electron delocalization, which correlates with the shift current. Hydrostatic pressure does not enhance the shift current in these materials. These findings have potential applications in optoelectronics and identify the most promising zincblende semiconductors for efficient shift-current generation under visible-light illumination", "url": "https://arxiv.org/abs/2606.15613", "type": "理论+数值", "summary": "1. 该工作利用密度泛函理论系统研究了多种闪锌矿III-V和II-VI族半导体的移流响应，发现AlSb在可见光下具有最强的移流产生能力。\n2. 其核心在于通过能带投影分析识别出AlSb中特定价带到导带的跃迁贡献，并揭示移流大小与电子离域性的关联。\n3. 这为基于铝族闪锌矿半导体的高效可见光移流光电器件设计提供了明确材料候选与物理机制指导。", "summary_source": "deepseek", "authors": [{"name": "César Castillo-Quevedo"}, {"name": "Edgar Paredes-Sotelo"}, {"name": "Peter L. Rodríguez-Kessler"}, {"name": "Gerardo Martínez-Guajardo"}, {"name": "Jose Luis Cabellos"}], "featured_authors": [{"name": "César Castillo-Quevedo"}, {"name": "Edgar Paredes-Sotelo"}, {"name": "Peter L. Rodríguez-Kessler"}, {"name": "Gerardo Martínez-Guajardo"}, {"name": "Jose Luis Cabellos"}], "author_count": 5}, {"id": "2606.15620", "category": "cond-mat", "title": "Dimensional Crossover of Mass Anisotropy in Ta-doped WTe2", "abstract": "The observation of extremely large magnetoresistance in WTe2 has attracted considerable attention towards understanding its underlying origin. With its layered van der Waals structure, the question that remains largely unexplored is whether the three-dimensional anisotropic transport characteristics of WTe2 persists under chemical substitution. Here, we present a systematic angle-dependent magneto-transport study of single-crystalline TaxW1-xTe2 (x = 0, 0.05, 0.1). The results are analysed within a mass anisotropy scaling framework to extract the mass anisotropy parameter {\\gamma} as a function of temperature and doping. It is observed that Ta substitution leads to monotonic increase of {\\gamma} across all temperatures, indicating a progressive deepening of quasi-two-dimensional Fermi surface character. Ta doping also leads to a substantial improvement in crystalline quality, reflected in a pronounced increase in the residual resistivity ratio. Despite weakening electron-hole compensation, the magnetoresistance rises sharply to ~58,211% at x = 0.1, which is assigned to a substantial enhancement in carrier mobility. Rietveld refinement confirms a systematic c-axis contraction with Ta content, identifying the structural origin of the enhanced anisotropy. The mass anisotropy scaling that holds for x = 0 and x = 0.05 breaks down for x = 0.1, where the angular magneto-resistance anisotropy substantially exceeds single-ellipsoid predictions, pointing to a multi-pocket Fermi surface with distinct anisotropies. Nonlinear Hall resistivity provides independent evidence for the underlying multiband character of transport in this system. These findings demonstrate that Fermi surface anisotropy, carrier compensation, and mobility are independent parameters that can lead to tuneable control of large magnetoresistance in topological semimetal WTe2.", "url": "https://arxiv.org/abs/2606.15620", "type": "理论", "summary": "1. 该工作通过角度依赖磁输运测量，系统研究了Ta掺杂WTe₂中质量各向异性参数γ的温度与掺杂依赖，揭示了准二维费米面特征的深化。\n2. 核心发现是Ta掺杂引起c轴收缩和γ单调增大，且在x=0.1处质量各向异性标度失效，表明多口袋费米面与不同各向异性的出现。\n3. 这启示费米面各向异性、载流子补偿与迁移率可作为独立参数，实现拓扑半金属中大磁阻效应的可调谐控制。", "summary_source": "deepseek", "authors": [{"name": "P. Das"}, {"name": "D. Das"}, {"name": "P. Kumar"}, {"name": "Monika"}, {"name": "S. Patnaik"}], "featured_authors": [{"name": "P. Das"}, {"name": "D. Das"}, {"name": "P. Kumar"}, {"name": "Monika"}, {"name": "S. Patnaik"}], "author_count": 5}, {"id": "2606.15649", "category": "cond-mat", "title": "Carbon Layer Orientation and Closed-Pore Construction Achieving Ultra-Low Specific Surface Area Hard Carbon for High-Performance Na-ion Storage", "abstract": "Addressing the critical trade-off between initial Coulombic efficiency (ICE) and reversible capacity in hard carbon anodes for Na-ion batteries (NIBs), we introduce a novel coupling strategy that combines carbon layer orientation reconstruction with closed-pore construction to produce hard carbon with an ultra-low specific surface area. We demonstrate that the nanographite domains within the hard carbon precursor undergo entropy-driven orientation reconstruction through the synergistic regulation of heteroatom doping and medium-temperature carbonization. This process not only increases interlayer spacing and promotes structural disorder but also enables the formation of dense, closed pores and ultramicropores at domain boundaries via confined atomic migration, while simultaneously encapsulating surface open pores within internal closed ones. Due to this unique pore architecture, our hard carbon exhibits an ultra-low specific surface area of 1.89 m2 g-1 with a markedly higher proportion of closed pores. As a result, our hard carbon achieves a remarkable reversible capacity of 342.3 mAh g-1 at 20 mA g-1, with an exceptional ICE of 90.4% and a dominant plateau capacity of 262.3 mAh g-1 (76.6%) for NIBs. We believe this coupling strategy provides a new paradigm for the structural engineering of high-ICE anode materials in advanced NIBs.", "url": "https://arxiv.org/abs/2606.15649", "type": "理论", "summary": "1. 该工作提出碳层取向重建与闭孔构筑的协同耦合策略，制备出比表面积仅1.89 m² g⁻¹的超低比表面硬碳负极，突破钠离子电池首次库仑效率与可逆容量间的矛盾。\n2. 其核心物理机制在于杂原子掺杂与中温碳化协同驱动纳米石墨畴的熵导向取向重构，通过界面原子限域迁移形成高比例致密闭孔并包裹表面开孔。\n3. 该策略使材料在20 mA g⁻¹下同时达到90.4% ICE和342.3 mAh g⁻¹可逆容量（76.6%来自低压平台），为高首效碳负极的结构工程提供了可推广的新范式。", "summary_source": "deepseek", "authors": [{"name": "Bowen Wang"}, {"name": "Zihan Yang"}, {"name": "Minghui Zhao"}, {"name": "Wenjie Mai"}, {"name": "Qing Xu"}, {"name": "Huan Li"}, {"name": "Liang Zhang"}, {"name": "Chul Gyu Jhun"}, {"name": "Le Chen"}, {"name": "Wentao Zhang"}, {"name": "Jingtai Zhao"}, {"name": "Jinliang Li"}], "featured_authors": [{"name": "Bowen Wang"}, {"name": "Zihan Yang"}, {"name": "Minghui Zhao"}, {"name": "Wentao Zhang"}, {"name": "Jingtai Zhao"}, {"name": "Jinliang Li"}], "author_count": 12}, {"id": "2606.15711", "category": "cond-mat", "title": "Mapping the Stability of Spin Qubits in Superconducting Pseudogap Systems", "abstract": "Superconducting spin qubits, realized as Yu-Shiba-Rusinov spin-doublet states in quantum-dot-superconductor systems, represent a cornerstone of current research in quantum technologies. We analyze these ground states of quantum impurities in superconducting pseudogap systems, namely systems with a pseudogap tunneling density of states $\\rho(\\epsilon) \\sim |\\epsilon|^r$ for energies $|\\epsilon|\\gg \\Delta$ ($\\Delta$ being a $s$-wave pairing potential). For $r=1$, these hosts are realized as Dirac materials (graphene or 3D topological insulator surfaces) in proximity to conventional superconductors, or as $d+i s$ superconductors. Using effective field theory and numerical renormalization group, we map the phase diagram against the pseudogap exponent $r > 0$ and particle-hole symmetry-breaking perturbations. At particle-hole symmetry, increasing $r$ also increases the critical value, $J_c$, of the Kondo coupling that triggers the transition from spin doublet to singlet. Unlike the gapless pseudogap Kondo systems, numerical and analytical evidence suggest that Andreev reflection stabilizes a singlet ground state at $J$ for all $r > 0$. Breaking particle-hole symmetry -- by potential scattering or chemical potential -- eventually restores the transition at lower $J_c$. Our results indicate that coupling to superconducting hosts with large pseudogap exponents enhances the stability of spin qubits at large Kondo coupling.", "url": "https://arxiv.org/abs/2606.15711", "type": "理论+数值", "summary": "1. 该工作利用有效场论与数值重整化群，全面分析了超导赝隙系统中自旋量子比特（Yu-Shiba-Rusinov双态）的基态相图对赝隙指数r及粒子-空穴对称性破缺的依赖。\n2. 核心物理发现是，与无隙赝隙近藤系统不同，Andreev反射在所有r>0下都稳定了单重态基态；而粒子-空穴对称性破缺（势散射或化学势）会恢复相变，且增大r会提高临界Kondo耦合。\n3. 这揭示了耦合至大赝隙指数超导宿主能显著增强自旋量子比特在强Kondo耦合区域的稳定性，为设计容错量子比特平台提供了明确的指导原则。", "summary_source": "deepseek", "authors": [{"name": "Chen-How Huang"}, {"name": "Miguel A. Cazalilla"}], "featured_authors": [{"name": "Chen-How Huang"}, {"name": "Miguel A. Cazalilla"}], "author_count": 2}, {"id": "2606.15721", "category": "cond-mat", "title": "Ground States and Excitations of Magnetic Impurities in Pseudogap Superconducting Systems", "abstract": "Combining effective field theory and numerical renormalization-group (NRG), we study the ground-state phase diagram and single-particle excitations of a spin-$\\tfrac{1}{2}$ impurity in a superconducting system with a tunneling density of states behaving as $\\rho(\\epsilon) \\sim |\\epsilon|^{r}$, for $|\\epsilon|\\gg \\Delta$ ($\\Delta$ being the $s$-wave pairing potential). We focus on the properties of the doublet-singlet transition at large Kondo coupling. The effective field theory for the singlet phase is inferred from a strong coupling expansion in the Kondo coupling. For $\\Delta \\neq 0$, it contains a local pairing term which drives the system into a spin-singlet phase with enhanced paring correlations. We study how the singet-doublet phase boundary is affected by particle-hole symmetry breaking perturbations such as a scattering potential and/or the chemical potential. Results for the $T$-matrix spectral function are also reported near the transition both at particle-hole symmetry and away from it. It is shown that the singlet-doublet transition can be induced by the chemical potential rather than the Kondo coupling strength. At particle-hole symmetry, a resonance-like feature is observed for $r= 1$ and related to a two-quasiparticle excitation using a single-site model which is derived from effective field theory.", "url": "https://arxiv.org/abs/2606.15721", "type": "理论+数值", "summary": "1. 该工作结合有效场论与数值重整化群，系统研究了赝能隙超导体中自旋-1/2磁性杂质的基态相图与单粒子激发谱。\n2. 其核心发现是强耦合展开揭示单态相内存在局域配对项而增强配对关联，且化学势可独立于近藤耦合诱导单态-双态转变。\n3. 这为理解粒子-空穴对称性破缺对磁杂质相边界的影响以及谱函数共振特征提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Miguel A. Cazalilla"}, {"name": "Chen-How Huang"}], "featured_authors": [{"name": "Miguel A. Cazalilla"}, {"name": "Chen-How Huang"}], "author_count": 2}, {"id": "2606.15799", "category": "cond-mat", "title": "Machine Learning Topological Order from Defect Partition Functions", "abstract": "We introduce a machine learning framework for extracting Ising topological order from defect partition functions of the two-dimensional Ising model on a torus. Restricted Boltzmann Machines (RBMs) are trained on Ising model data sampled at criticality across topological sectors. We take a component-wise square-root map of the learned distributions which naturally produces candidate wavefunctions for the (2+1)-dimensional Ising TQFT. As a nontrivial consistency check, we extract the modular S-matrix from overlaps of the resulting states and recover the expected Ising modular data. Our results demonstrate that neural network representations can capture both critical fluctuations and emergent topological structure, providing a data-driven route from lattice statistical mechanics to topological quantum field theory.", "url": "https://arxiv.org/abs/2606.15799", "type": "理论+数值", "summary": "1. 该工作利用机器学习从二维伊辛模型在环面上的缺陷配分函数中提取伊辛拓扑序。\n2. 其技术核心在于使用受限玻尔兹曼机跨越拓扑扇区在临界点采样训练，通过逐分量平方根映射得到(2+1)维伊辛拓扑量子场论的候选波函数，并从态重叠中提取模S矩阵，验证其与预期拓扑模数据一致。\n3. 这证明神经网络表示能够同时刻画临界涨落与涌现拓扑结构，为从晶格统计力学数据驱动地构建拓扑量子场论提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Kazem Bitaghsir Fadafan"}, {"name": "Wei Cui"}, {"name": "Babak Haghighat"}, {"name": "Shailesh Lal"}], "featured_authors": [{"name": "Kazem Bitaghsir Fadafan"}, {"name": "Wei Cui"}, {"name": "Babak Haghighat"}, {"name": "Shailesh Lal"}], "author_count": 4}, {"id": "2606.15853", "category": "cond-mat", "title": "Surface-Sensitive Mapping of Anisotropic Phonon Cascades in T$_{d}$-WTe$_{2}$", "abstract": "Understanding how energy flows from photoexcited carriers into the lattice is essential for describing nonequilibrium phenomena in low-symmetry quantum materials. Here, we use ultrafast low-energy electron diffraction and diffuse scattering to probe momentum-resolved phonon dynamics at the surface of T$_{d}$-WTe$_{2}$, a strongly anisotropic semimetal. Following optical excitation, the Debye-Waller suppression of Bragg peaks reveals a biexponential increase of the mean-squared atomic displacement, indicating sequential lattice relaxation. Analysis of the diffuse background reveals a preferential intensity build-up parallel to the tungsten-chain axis in the material, attributed to anisotropic electron-phonon coupling during electronic cooling. Diffuse intensity subsequently redistributes across the surface Brillouin zone and finally accumulates near the zone centre, consistent with anharmonic phonon-phonon scattering and the gradual population of low-frequency acoustic modes on a 30--100 ps timescale. The results reveal a hierarchical relaxation pathway in which energy is first deposited into selected finite-momentum phonons before spreading through the broader lattice bath. Our work highlights the importance of momentum-resolved diffuse scattering for disentangling electron-phonon and phonon-phonon relaxation in anisotropic topological semimetals.", "url": "https://arxiv.org/abs/2606.15853", "type": "理论+数值", "summary": "1. 该工作利用超快低能电子衍射与漫散射技术，在强各向异性半金属Td-WTe2表面实现了动量分辨的声子动力学映射。\n2. 其核心卖点在于通过分析衍射斑衰减与漫散射强度各向异性积累，揭示了光激发后能量先注入特定有限动量声子、再经非谐散射向低频声学模级联扩散的层级弛豫路径。\n3. 这项工作凸显了动量分辨漫散射方法在解耦各向异性拓扑半金属中电子-声子与声子-声子弛豫过程的关键价值。", "summary_source": "deepseek", "authors": [{"name": "Alp Akbiyik"}, {"name": "Felix Kurtz"}, {"name": "Sergey V. Yalunin"}, {"name": "Claus Ropers"}, {"name": "Hannes Böckmann"}], "featured_authors": [{"name": "Alp Akbiyik"}, {"name": "Felix Kurtz"}, {"name": "Sergey V. Yalunin"}, {"name": "Claus Ropers"}, {"name": "Hannes Böckmann"}], "author_count": 5}, {"id": "2606.15929", "category": "cond-mat", "title": "Wavelet Localisation and Local Modulation Freezing in MRW Unwrapping", "abstract": "We develop a localised wavelet formulation of multifractal random walk unwrapping based on the local multiplicative modulation freezing. The framework is motivated by the observation that finite-support wavelet localisation may induce approximate local factorisation of multiplicatively modulated stochastic fields, allowing the modulation component to become effectively frozen within sufficiently localised probing domains. Within this regime, logarithmic wavelet amplitudes admit an approximate additive decomposition linking local wavelet statistics directly to the underlying modulation field. This viewpoint reformulates covariance-based MRW unwrapping as a localised multiscale operator problem in which wavelet coefficients act as finite-support probes of multiplicative organisation. The validity of the approximation depends explicitly on support geometry, scale-dependent overlap, and residual multiscale mixing generated by internal modulation variability. We show that these effects naturally produce finite-scale deviations from ideal logarithmic covariance scaling and lead to structured covariance distortions whose form depends on the interaction between the modulation field and the geometry of the wavelet representation. In the resulting framework, localisation itself becomes the operational mechanism enabling multiscale probing of local stochastic organisation. Numerical investigations using orthonormal wavelet decompositions support the proposed interpretation and demonstrate the emergence of scale-dependent freezing regimes, residual covariance mixing, and finite-support breakdown effects consistent with the theory. The proposed framework suggests a broader connection between wavelet localisation, local regularity organisation, and finite-support multiscale stochastic operators. Wavelet localisation becomes an operational mechanism for probing localised multiscale structure.", "url": "https://arxiv.org/abs/2606.15929", "type": "理论+数值", "summary": "1. 该工作发展了基于局域乘性调制冻结的多分形随机游走展开的小波局域化形式体系。\n2. 其核心在于利用有限支撑小波诱导调制场近似因子分解，将协方差展开重构为局域多尺度算子问题，并揭示支撑几何与尺度重叠产生的有限尺度协方差畸变。\n3. 这为通过小波局域化作为操作机制探测随机场的局域正则性组织与多尺度混合效应提供了理论框架与数值验证。", "summary_source": "deepseek", "authors": [{"name": "Mateusz Polakowski"}, {"name": "Zbigniew R. Struzik"}], "featured_authors": [{"name": "Mateusz Polakowski"}, {"name": "Zbigniew R. Struzik"}], "author_count": 2}, {"id": "2606.16013", "category": "cond-mat", "title": "The limits of interpretability in multiple linear regression", "abstract": "Interpreting machine-learning models has attracted increasing attention, particularly in the physical sciences, where one often seeks to understand the underlying mechanisms rather than merely make predictions. Multiple linear regression is often regarded as an interpretable alternative to more complex models, such as deep neural networks, because its predictions are expressed as explicit weighted sums of input features. However, when input features are strongly correlated, namely in the presence of multicollinearity, the learned weights can exhibit large dataset-to-dataset fluctuations and oscillatory behavior across physically similar features, making their interpretation difficult or even impossible. Although the instability of the weights under multicollinearity is well known in statistics, its consequences for physical interpretation, in particular its connection to oscillatory weights across physically similar features, have not been systematically clarified. Here, we theoretically discuss the mechanism behind this loss of interpretability by analyzing the eigenmodes of the feature correlation matrix. We show that small-eigenvalue modes associated with multicollinearity amplify fluctuations in the weights and generate oscillatory patterns that do not necessarily reflect meaningful contributions. We test this theoretical picture numerically on physics datasets and show that Ridge regularization suppresses these unstable modes, although the resulting weights must still be interpreted with caution. We further confirm the generality of our findings beyond physics by analyzing a diverse collection of publicly available datasets. Our results clarify why, in the presence of multicollinearity, physical interpretation can remain difficult even for linear regression models.", "url": "https://arxiv.org/abs/2606.16013", "type": "理论+数值", "summary": "1. 该工作从理论上分析了多重共线性导致多重线性回归权重振荡并丧失可解释性的机制，并通过数值和跨领域数据集验证。\n2. 其核心在于揭示特征相关矩阵的小本征值模式是权重涨落和振荡的根源，并指出岭回归虽可抑制这些模式但仍有局限。\n3. 这提醒物理学家在使用线性回归解释数据时需警惕多重共线性，即使简单模型也可能无法提供有意义的特征贡献。", "summary_source": "deepseek", "authors": [{"name": "Anand Sharma"}, {"name": "Chen Liu"}, {"name": "Daniele Coslovich"}, {"name": "Misaki Ozawa"}], "featured_authors": [{"name": "Anand Sharma"}, {"name": "Chen Liu"}, {"name": "Daniele Coslovich"}, {"name": "Misaki Ozawa"}], "author_count": 4}, {"id": "2606.16025", "category": "cond-mat", "title": "Universality in the target arrival statistics of non-conservative search processes", "abstract": "Stochastic search processes in which searchers are continuously introduced to and removed from a target search domain are fundamental to a wide class of physical and artificial systems. The theory of such non-conservative search processes is, however, much less developed than for search processes with a fixed number of particles. Here we exploit a natural mapping between non-conservative stochastic search and queueing theory to derive the full time-dependent distribution of target arrivals under minimal assumptions on the underlying search process. Remarkably, we find that the steady-state inter-arrival time distribution is exactly exponential, regardless of the details of the search process, showing a robust universality that emerges directly from the queueing framework. Thus, counterintuitively, the arrival statistics of a non-conservative search process are much simpler than sequential search-and-capture processes involving a fixed number of searchers. This has major implications for target resource accumulation, where the delivery of resources is counter-balanced by their downstream consumption.", "url": "https://arxiv.org/abs/2606.16025", "type": "理论+数值", "summary": "1. 该工作通过排队论映射，非微扰地推导了非保守随机搜索过程中目标到达的完整时间依赖分布，揭示了稳态到达间隔时间分布的严格指数形式。\n2. 关键卖点在于发现该指数行为对底层搜索细节完全不敏感，展现出从排队框架自然涌现的鲁棒普适性，且其统计复杂度反直觉地低于固定搜索者数量的序贯捕获过程。\n3. 这为理解资源积累等需平衡输送与消耗的系统中到达统计的简单普适行为提供了直接理论工具，并启发在更广泛非保守搜索场景中验证该普适类。", "summary_source": "deepseek", "authors": [{"name": "José Giral-Barajas"}, {"name": "Samantha Linn"}, {"name": "Paul C. Bressloff"}], "featured_authors": [{"name": "José Giral-Barajas"}, {"name": "Samantha Linn"}, {"name": "Paul C. Bressloff"}], "author_count": 3}, {"id": "2606.16032", "category": "cond-mat", "title": "Machine learning enables roughness-driven inverse design of milling processes", "abstract": "Interest in applying data-driven approaches in manufacturing has grown significantly, particularly for mapping complex, high-dimensional relationships. The milling process is one area where predi
