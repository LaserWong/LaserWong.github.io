ed Dirac oscillator $H^{\\mathrm{r}}$, where the potential becomes unbounded from below, the energy spectrum becomes continuous, and the eigenfunctions fail to be square-integrable, leading to normalization difficulties. We show that the Hamiltonian $H^{\\mathrm{r}}$ is a pseudo-$\\mathcal{PT}$-symmetric operator, and we introduce an unbounded, non-unitary transformation that establishes a connection between $H^{\\mathrm{r}}$ and $H^{\\mathrm{D}}$. The purpose of this work is to analyze this relativistic quantum system -- known as the Dirac inverted oscillator -- which, despite its various applications, admits an exact analytical solution", "url": "https://arxiv.org/abs/2606.15303", "type": "理论", "summary": "1. 该工作研究了通过厄米型动量替换导出的倒置狄拉克振荡器，并给出了其精确解析解。\n2. 其核心在于证明该非厄米哈密顿量具有伪\\(\\mathcal{PT}\\)对称性，并通过无界非酉变换与标准狄拉克振荡器关联。\n3. 这一精确可解模型为非厄米相对论量子系统的研究及相关应用提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Mustapha Maamache"}], "featured_authors": [{"name": "Mustapha Maamache"}], "author_count": 1}, {"id": "2606.15398", "category": "quant-ph", "title": "Watching a Superconducting Coplanar Waveguide Heat Up with a Single Color Center", "abstract": "Single color centers in diamond offer a local probe of their cryogenic environment, providing a direct way to quantify heating in spin-control hardware. Here, we establish a single spectrally stable tin-vacancy (SnV) center as an on-chip thermometer for a diamond membrane and use it to characterize microwave- and radio-frequency-induced heating in a superconducting coplanar waveguide patterned on the same chip. We first calibrate the temperature dependence of the optical C-transition frequency and linewidth from $20\\,\\mathrm{K}$ down to the few-kelvin regime. At lower temperatures, where the optical response becomes weakly temperature dependent, we use the spin-lattice relaxation time $T_1$ as a complementary thermometer and tune its sensitivity with the transverse magnetic-field component. Applying this local thermometer to a niobium coplanar waveguide, we observe magnetic-field-dependent superconducting breakdown under GHz drive, accompanied by abrupt heating of the diamond. In contrast, at $20\\,\\mathrm{MHz}$ and $400\\,\\mathrm{mT}$, relevant for nuclear-spin control, we detect no measurable heating up to the breakdown threshold of $9.4\\,\\mathrm{dBm}$, corresponding to $B_\\mathrm{ac}\\sim1.2\\,\\mathrm{mT}$. These results define a safe operating window for superconducting microwave and RF control structures in diamond-based quantum nodes.", "url": "https://arxiv.org/abs/2606.15398", "type": "理论", "summary": "1. 该工作利用单个光谱稳定的锡空位色心作为片上温度计，定量表征了同一芯片上超导共面波导在微波与射频驱动下的局部加热效应。\n2. 其技术卖点在于结合光学C跃迁频率与线宽的宽温区校准及自旋晶格弛豫时间T1的低温柔温互补测温，并通过横向磁场调控灵敏度，实现了对超导结构局部温度的精密测量。\n3. 实验发现GHz驱动下超导击穿伴随急剧加热且呈磁场依赖性，而20MHz/400mT射频条件下直至9.4dBm击穿阈值无加热，这为金刚石量子节点中的超导控制结构划定了安全运行窗口。", "summary_source": "deepseek", "authors": [{"name": "Ioannis Karapatzakis"}, {"name": "Jeremias Resch"}, {"name": "David Hunger"}, {"name": "Wolfgang Wernsdorfer"}], "featured_authors": [{"name": "Ioannis Karapatzakis"}, {"name": "Jeremias Resch"}, {"name": "David Hunger"}, {"name": "Wolfgang Wernsdorfer"}], "author_count": 4}, {"id": "2606.15421", "category": "quant-ph", "title": "Scheme for Transport-based Global Entanglement Distribution using Quantum Processors", "abstract": "We propose a scheme for distributing entanglement over global distances in a heralded manner by using satellites to physically transport entangled processor nodes with rare-earth-ion qubits. A full analysis of channel losses, errors and background light is performed to determine the fidelity and number of entangled pairs that can be distributed between two ground stations. We show that the scheme works already with a single satellite and can distribute close to the theoretical maximum number of entangled pairs that can be generated in a satellite overpass. In addition, we argue that in theory transportation-based schemes outperform other satellite-based schemes and can be scaled up to a constellation without additional channel losses. Daytime operation seems feasible as long as the sky is clear, with an EPR pair fidelity ranging from 99.3% at shorter network lengths to 93.9% with global coverage and can be further improved by active error correction or entanglement purification.", "url": "https://arxiv.org/abs/2606.15421", "type": "理论", "summary": "1. 本文提出一种利用卫星物理传输含稀土离子量子比特的纠缠处理器节点，以实现有预报的全球距离纠缠分发方案。\n2. 该方案基于完整信道损耗与背景光分析，证明单卫星即可在过顶期间分发接近理论最大纠缠对数，且运输式方法优于其他卫星方案并可无额外损耗扩展至星座。\n3. 日间操作可行，EPR对保真度在93.9%–99.3%范围，可通过主动纠错或纠缠提纯进一步提升，为未来星基量子网络提供可行路径。", "summary_source": "deepseek", "authors": [{"name": "Erik Lundblad"}, {"name": "Mira Abu Yahia"}, {"name": "Antonius Johannes Renders"}, {"name": "Andreas Walther"}, {"name": "Adam Kinos"}, {"name": "Lars Rippe"}], "featured_authors": [{"name": "Erik Lundblad"}, {"name": "Mira Abu Yahia"}, {"name": "Antonius Johannes Renders"}, {"name": "Andreas Walther"}, {"name": "Adam Kinos"}, {"name": "Lars Rippe"}], "author_count": 6}, {"id": "2606.15481", "category": "quant-ph", "title": "Connecting entanglement growth with local integrals of motion in the disordered Fermi-Hubbard model", "abstract": "Generically a quantum system initialized in an unentangled state will, under unitary dynamics, rapidly become entangled, a process closely related to information transport and to thermalization. Disorder can suppress the growth of entanglement and result in memory of initial conditions. In non-interacting systems this arises from localization of single-particle states, the occupancy of which is fixed by the initial condition. In interacting systems similar localized conserved quantities persist, but with the added feature that they are coupled, resulting in entanglement growth which is distinct from both non-interacting localized systems and from generic ergodic systems. The Fermi-Hubbard model has two degrees of freedom per site -- charge and spin -- and disorder may be present in both of these. We study the growth of entanglement in two scenarios -- disorder in charge equal and unequal to that in spin, and determine the distinct contributions of charge and spin degrees of freedom by expanding the Hamiltonian in terms of a set of optimally localized conserved quantities with separate charge and spin character. We find that coupling between charge and spin is significantly weaker than charge-charge and spin-spin coupling. While this decoupling is present in all our results, it is only apparent when the strength of the disorder in the two sectors is different such that there is a separation between the characteristic timescales of the contributions to entanglement made by charge and by spin.", "url": "https://arxiv.org/abs/2606.15481", "type": "理论", "summary": "1. 该工作通过局域守恒量展开，系统研究了无序Fermi-Hubbard模型中电荷与自旋自由度对纠缠增长各自的贡献。\n2. 其关键在于发现电荷-自旋耦合远弱于同种自由度之间的耦合，且当两通道无序强度不同时，这种退耦合导致纠缠增长出现特征时间尺度分离。\n3. 这为揭示相互作用局域化系统中不同运动积分对纠缠动力学的差异化影响提供了清晰理论框架与可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Ahad Nokhostin Helm"}, {"name": "Brandon Leipner-Johns"}, {"name": "Rachel Wortis"}], "featured_authors": [{"name": "Ahad Nokhostin Helm"}, {"name": "Brandon Leipner-Johns"}, {"name": "Rachel Wortis"}], "author_count": 3}, {"id": "2606.15484", "category": "quant-ph", "title": "Quantum Fisher Information and the Speed of Entanglement", "abstract": "We investigate the speed at which entanglement can be generated by an interaction parameter encoded in a two-qubit Hamiltonian, quantified by the derivative of concurrence with respect to the coupling parameter. For arbitrary pure two-qubit states evolving under a general nonlocal interaction, we derive a bound relating this entanglement speed to the quantum Fisher information (QFI). Specifically, we show that $|\\partial_g C| \\le \\sqrt{F_Q^{(g)}}$, where $F_Q^{(g)}$ is the QFI associated with estimation of the parameter. This establishes $\\sqrt{F_Q}$ as a an upper bound on the speed of entanglement generation in parameter space. We further derive the saturation conditions and identify the states and dynamical regimes for which equality is attained. At saturation, concurrence evolves at the maximum rate permitted by the distinguishability of the underlying quantum state. These results reveal a direct connection between quantum metrology and entanglement generation, showing that the same information-theoretic quantity that governs parameter-estimation precision also limits the speed at which entanglement resources can be created.", "url": "https://arxiv.org/abs/2606.15484", "type": "理论", "summary": "1. 该工作针对任意纯两比特态在一般非局域相互作用下的演化，推导了纠缠生成速度——concurrence对耦合参数的导数——与量子Fisher信息之间的普遍上界关系。\n2. 主要技术结果在于证明 $|\\partial_g C| \\le \\sqrt{F_Q^{(g)}}$ 并给出饱和条件，揭示了在参数空间中纠缠速率受量子态可区分性限制的物理机制。\n3. 这一结果直接建立了量子计量学与纠缠动力学之间的信息论联系，为通过参数估计优化纠缠资源生成提供了明确的上限启发。", "summary_source": "deepseek", "authors": [{"name": "Zain H. Saleem"}], "featured_authors": [{"name": "Zain H. Saleem"}], "author_count": 1}, {"id": "2606.15518", "category": "quant-ph", "title": "Suppressing Intrinsic Spin-Phonon Errors in Trapped-Ion Quantum Simulation", "abstract": "Trapped-ion quantum simulators realize programmable spin models through phonon-mediated interactions. For Hamiltonians with noncommuting terms, however, the same phonon bus generates intrinsic spin-phonon errors that strongly distort the target dynamics. Because these errors are governed by the full time history of the spin-dependent phonon motion, they survive standard loop-closing control and limit simulation accuracy. Using a sequence of frame transformations, we isolate the residual error dynamics and show that this intrinsic error can be strongly suppressed while preserving programmable Ising couplings. Full spin-boson simulations of multi-ion chains demonstrate orders-of-magnitude lower error than both constant-drive and conventional loop-closing protocols. These results remove a central precision barrier in trapped-ion analog quantum simulation and enable accurate programmable simulation of noncommuting many-body Hamiltonians and dynamical protocols.", "url": "https://arxiv.org/abs/2606.15518", "type": "理论+数值", "summary": "1. 该工作通过帧变换序列，在保持可编程伊辛耦合的同时，抑制了俘获离子量子模拟中非对易哈密顿量引发的内在自旋-声子误差。\n2. 其核心在于对自旋相关声子运动完整时间历史的误差动力学进行隔离与操控，实现了比恒定驱动和传统闭环方案低数个数量级的误差。\n3. 这消除了俘获离子模拟中一项关键精度障碍，为实现非对易多体哈密顿量的可编程精确模拟及动力学协议提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Dylan Sheils"}, {"name": "James Wang"}, {"name": "Or Katz"}], "featured_authors": [{"name": "Dylan Sheils"}, {"name": "James Wang"}, {"name": "Or Katz"}], "author_count": 3}, {"id": "2606.15558", "category": "quant-ph", "title": "Degeneracy Cannot Violate the Quantum Hamming Bound", "abstract": "The quantum Hamming bound is the standard finite-length sphere-packing bound for exact correction of arbitrary qubit errors. Whether degeneracy can evade this bound has remained unresolved in full generality for nearly three decades: distinct correctable errors may act identically on the code space, so the usual disjoint-sphere argument breaks down. We prove that every exact binary quantum subspace code with $K>1$ obeys the bound, without assuming either nondegeneracy or additivity. Our proof turns the Li--Xing linear-programming polynomial into an exact intersection count for quaternary Hamming balls. Monotonicity in block length and in ball-center separation then reduces the problem to a local node--edge charging inequality at the shortest admissible length. Thus degeneracy can merge correctable error sectors, but cannot enlarge the finite-length binary Hamming bound.", "url": "https://arxiv.org/abs/2606.15558", "type": "理论+数值", "summary": "1. 该工作严格证明了任意精确纠错二元量子子空间码（码空间维数大于一）均满足量子Hamming界，简并性无法导致该界被违反，从而解决了近三十年悬而未决的普遍性问题。\n2. 其技术核心是将Li-Xing线性规划多项式转化为四进制Hamming球的精确交集计数，并利用块长与球心分离的单调性，将全局界约化为最短允许长度下的局部节点-边充电不等式。\n3. 这一结果表明简并虽可合并可纠错错误扇区，但无法扩大标准的有限长二元Hamming界，为量子纠错码的容量极限提供了严格约束，并启发对更一般码界的类似分析。", "summary_source": "deepseek", "authors": [{"name": "Yu-Xuan Zhang"}, {"name": "Jing-Ling Chen"}], "featured_authors": [{"name": "Yu-Xuan Zhang"}, {"name": "Jing-Ling Chen"}], "author_count": 2}, {"id": "2606.15586", "category": "quant-ph", "title": "Quantum Illumination with Symmetry-Constrained Random Unitaries", "abstract": "Quantum illumination provides a quantum advantage in detecting weakly reflecting objects embedded in a noisy environment, even when environmental noise destroys most of the initial entanglement. We investigate this advantage using Haar-random probe states constrained to symmetry-resolved subspaces. Employing tools from quantum channel discrimination and asymptotic hypothesis testing, we derive the discrimination exponents associated with Haar-random probe ensembles and identify the role of symmetry in determining their performance. We show that typical states drawn from fixed-charge sectors achieve the same asymptotic quantum-illumination advantage as maximally entangled probes. In particular, we show that the effective thermal-noise suppression and the corresponding Chernoff exponent are governed by the dimension of the accessible symmetry sector. Our results reveal that the operational resource underlying quantum illumination can be generalized from fine-tuned structure of a specific probe state to the existence of a large symmetry-protected correlation subspace. These findings establish a direct connection between quantum illumination, symmetry-resolved typicality, and quantum channel discrimination, and demonstrate that near-optimal quantum hypothesis testing resources can emerge naturally from generic many-body quantum states constrained by conservation laws.", "url": "https://arxiv.org/abs/2606.15586", "type": "理论+数值", "summary": "1. 该工作利用对称约束的随机幺正算符构造探针态，研究其在量子照明中的信道分辨性能并推导了相应的Chernoff指数。\n2. 核心发现是固定电荷子空间中随机抽取的典型态与最大纠缠探针达到相同的渐近量子照明优势，其有效热噪声抑制由子空间维度决定。\n3. 这揭示了量子照明的操作资源可一般化为对称保护的大相关子空间，而非特定精细结构，并为量子信道鉴别的典型性机制提供洞见。", "summary_source": "deepseek", "authors": [{"name": "Sooryansh Asthana"}, {"name": "Sai Vinjanampathy"}], "featured_authors": [{"name": "Sooryansh Asthana"}, {"name": "Sai Vinjanampathy"}], "author_count": 2}, {"id": "2606.15607", "category": "quant-ph", "title": "A New Definition of Quantum Superposition", "abstract": "The usual description of the superposition of two (pure quantum) states is ambiguous, since the binary operation of summation in a Hilbert space does not pass down to the quotient projective space. Even though Dirac noted this as early as 1930, it is often asserted that the superposition is a binary operation acting on two states with a value that is a unique state. The goal for this note is to motivate a rigorous, geometrical definition of the superposition of states in the setting of complex projective space, which has been argued elsewhere to be the natural geometric phase space for quantum theory. The upshot is that the new definition of the superposition of two pure states, viewed as two distinct points in the projective space, is the unique (complex) line on which those two points lie. Finally, a comparison is given between superposition and expansion in an orthonormal basis.", "url": "https://arxiv.org/abs/2606.15607", "type": "理论", "summary": "1. 该工作针对量子叠加传统定义在射影空间中的歧义，提出了基于复射影几何的严格定义。\n2. 其核心是将两个纯态的叠加唯一地定义为它们在复射影空间中所张的复直线，从而消除了相位因子带来的模糊性。\n3. 这为量子理论中态叠加原理提供了自洽的几何基础，并可能推动对纠缠与测量问题的几何化理解。", "summary_source": "deepseek", "authors": [{"name": "Stephen Bruce Sontz"}], "featured_authors": [{"name": "Stephen Bruce Sontz"}], "author_count": 1}, {"id": "2606.15664", "category": "quant-ph", "title": "Synthesizing Arbitrary Non-Hermitian Hamiltonian with Stochastic Floquet Engineering", "abstract": "The conventional Floquet engineering scheme synthesizes a given target Hamiltonian with a deterministic temporal periodic driving field. In this work, we introduce the stochastic Floquet engineering scheme that can synthesize an arbitrary non-Hermitian target Hamiltonian using a time-periodic driving field with noisy amplitude. Our method is rooted in the Hermitian dynamics taking noise as a valuable quantum resource with no need for loss or gain in prior. We apply our method to engineer a cavity Hamiltonian with dissipative coupling between Fock states, and to prepare a given quantum state from a generally arbitrary quantum state. The stochastic Floqut engineering also provides a way to generate non-unitary quantum gates, which take advantage in certain tasks compared to unitary quantum computing, without the need for ancillae or state-dependent updating.", "url": "https://arxiv.org/abs/2606.15664", "type": "理论", "summary": "1. 该工作提出了随机Floquet工程方案，利用含振幅噪声的时间周期驱动场，在无需系统固有增益或损耗、无需后选择或辅助系统的条件下，合成任意非厄米目标哈密顿量，为一般非厄米系统提供了普适的工程方法。\n2. 其核心物理与技术卖点在于将噪声视为量子资源，基于纯厄米动力学实现非厄米哈密顿量的精确调控，数值验证了在腔系统中构造Fock态间耗散耦合哈密顿量以及从任意初始态高保真度地制备目标量子态的能力。\n3. 该方法还可用于无需辅助比特或态依赖更新的非酉量子门生成，在特定计算任务中对酉量子计算具有优势，为利用噪声辅助的量子模拟、非厄米量子计算及量子态工程提供了实用且可扩展的框架。", "summary_source": "deepseek", "authors": [{"name": "Lingzhen Guo"}, {"name": "Hui Jing"}], "featured_authors": [{"name": "Lingzhen Guo"}, {"name": "Hui Jing"}], "author_count": 2}, {"id": "2606.15744", "category": "quant-ph", "title": "Comparative Performance Analysis of NIST PQC Standards: From STM32 Software Limitations to FPGA-SoC Acceleration", "abstract": "The rapid advancement of quantum computing poses a significant threat to classical public-key cryptographic systems, necessitating the transition to Post-Quantum Cryptography (PQC). This study investigates the implementation challenges of NISTstandardized signature schemes on resource-constrained embedded hardware. We present a comparative analysis of SPHINCS+ and CRYSTALS-Dilithium on an ARM Cortex-M4 (STM32F407G) microcontroller. Our findings reveal that SPHINCS+ is practically unusable in this software-only environment, with impractical execution times. Furthermore, the reference Dilithium implementation failed to execute entirely on the MCU due to severe RAM and timing constraints. To overcome these hardware limitations, we integrated a hardware-accelerated Dilithium core onto a Xilinx Zynq-7000 ZedBoard SoC. By implementing a specialized Number Theoretic Transform (NTT) accelerator in the FPGA fabric, we achieved successful execution with performance rates for key generation and signature generation at millisecond levels. These results demonstrate that while pure software PQC is non-viable for standard microcontrollers, a hardware-software codesign approach provides the necessary efficiency for quantumresistant embedded systems.", "url": "https://arxiv.org/abs/2606.15744", "type": "理论", "summary": "1. 该工作对比分析了NIST标准后量子签名方案在ARM Cortex-M4微控制器上的软件实现瓶颈，并设计了基于FPGA-SoC的硬件加速方案。\n2. 其核心在于为CRYSTALS-Dilithium实现专用数论变换加速器，克服STM32的内存与时间限制，使密钥生成与签名达到毫秒级性能。\n3. 这揭示了纯软件后量子密码在嵌入式设备上不可行，而软硬件协同设计为构建量子安全嵌入式系统提供了有效路径。", "summary_source": "deepseek", "authors": [{"name": "Mustafa Akif Yıldırım"}, {"name": "Osman Tokluoglu"}], "featured_authors": [{"name": "Mustafa Akif Yıldırım"}, {"name": "Osman Tokluoglu"}], "author_count": 2}, {"id": "2606.15801", "category": "quant-ph", "title": "MAPS: A Novel Multi-Axial Projective Sphere for Geometrically Visualizing Higher d-Valued Quantum State-Space of Qudits", "abstract": "Visualizing the d-valued quantum state-space of quantum systems serves as a foundational pillar for the scientific research and practical applications in quantum computing and information science, where d >= 2. The 2-valued quantum states of a qubit are elegantly visualized on the three-dimensional Bloch sphere. In contrast, expanding this geometrical paradigm to visualize higher d-valued quantum states of a qudit (d >= 3), e.g., a qutrit (d=3), ququadit (d=4), and quintit (d=5), leads to severe structural and topological complexities. This paper introduces a new generalized three-dimensional framework to effectively visualize higher d-valued quantum states of a qudit, in the aspects of ease of illustration, structural simplicity, and natural representation for researchers and engineers. We called this new framework the \"multi-axial projective sphere (MAPS)\", which consists of n projectional intersecting spatial axes, where d-1 <= n <= 0. We also propose a group of novel d-valued phase axial-based gates, to swivel and shift d-valued quantum states of a qudit along these n axes. Our generalized framework could be used for visualizing high-dimensional data for practical applications, e.g., machine learning, quantum machine learning, and quantum chemistry, where every axis of the MAPS represents a single feature of such data with its corresponding distinct values.", "url": "https://arxiv.org/abs/2606.15801", "type": "理论+数值", "summary": "1. 该工作引入多轴投影球(MAPS)框架，用于几何可视化三维以上qudit量子态空间并推广操作。\n2. 其核心在于将高维态空间映射为n条相交投影轴，并定义d值相位轴向门以实现态沿轴旋转移。\n3. 这为高维数据可视化及量子机器学习、化学等应用提供了抽象几何化表征途径。", "summary_source": "deepseek", "authors": [{"name": "Ali Al-Bayaty"}], "featured_authors": [{"name": "Ali Al-Bayaty"}], "author_count": 1}, {"id": "2606.15808", "category": "quant-ph", "title": "Trainable Quantum Channels as Computational Primitives for Quantum Learning", "abstract": "Variational quantum learning is traditionally constrained to unitary dynamics, often treating quantum channels as detrimental noise. In this work, we reformulate the quantum channels as trainable computational primitives and establish a non-unitary quantum machine learning framework grounded in open-system dynamics. We demonstrate that the outputs of channel-enhanced quantum models form a structured superposition of multiple functional components. Each component is governed by an effective observable whose spectrum can be adaptively modulated during training, a significant departure from the spectral invariance in unitary transformations. Moreover, the proposed framework generalizes conventional unitary quantum models by retaining them as a special case while introducing additional non-unitary degrees of freedom. Furthermore, we reveal that trainable quantum channels enrich the optimization geometry through ensemble-averaged gradient and additional optimization directions induced by the Kraus operators. Empirical evaluations on classification tasks using trainable amplitude-damping and phase-damping channels confirm enhanced optimization dynamics and predictive performance. Our work provides a principled approach for leveraging quantum channels as trainable resources and advances the design of high-performance quantum learning architectures.", "url": "https://arxiv.org/abs/2606.15808", "type": "理论+数值", "summary": "1. 该工作将量子通道重新定义为可训练计算原语，建立基于开放系统动力学的非酉量子机器学习框架。\n2. 其核心创新在于输出态形成多个有效可观测量谱可自适应调制的功能组分结构化叠加，并揭示Kraus算符引入的系综平均梯度等额外优化方向。\n3. 这为超越酉量子模型限制、利用量子通道作为可训练资源设计高性能量子学习架构提供了原理性路径。", "summary_source": "deepseek", "authors": [{"name": "Jingwei Wen"}, {"name": "Ling Qian"}, {"name": "Shijie Wei"}, {"name": "Guilu Long"}], "featured_authors": [{"name": "Jingwei Wen"}, {"name": "Ling Qian"}, {"name": "Shijie Wei"}, {"name": "Guilu Long"}], "author_count": 4}, {"id": "2606.15873", "category": "quant-ph", "title": "Complete Relational Description of Spin in a Quantum Background", "abstract": "The standard description of the state of a spin in quantum mechanics presupposes externally fixed directions -- a classical background. Can a spin be fully described instead in relation to other quantum mechanical systems? Poulin suggested twenty years ago group averaging over rotations the joint state of a fundamental spin and a reference spin with large angular momentum which, however, yields a classical bit in a probabilistic mixture. We revisit this idea and show that when the quantum reference system is augmented to \\emph{two} large spins, the standard quantum mechanical description of a spin is recovered in the limit of large quantum numbers for the reference system.", "url": "https://arxiv.org/abs/2606.15873", "type": "理论", "summary": "1. 该工作通过引入两个大角动量量子参考系统，在量子背景下实现对自旋态的完全关系性描述。\n2. 其核心在于证明当参考系统量子数趋于无穷时，标准量子力学自旋描述得以恢复，克服了单个参考系统仅能产生经典比特的局限性。\n3. 这为建立完全量子化的参考系框架提供了可行途径，并启发后续对关系性量子力学中背景独立性问题的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Hannah Troger"}, {"name": "Ofek Bengyat"}, {"name": "Thomas D. Galley"}, {"name": "Marios Christodoulou"}], "featured_authors": [{"name": "Hannah Troger"}, {"name": "Ofek Bengyat"}, {"name": "Thomas D. Galley"}, {"name": "Marios Christodoulou"}], "author_count": 4}, {"id": "2606.15922", "category": "quant-ph", "title": "A Gauge-Covariant Geometric Framework for Non-Hermitian Quantum Systems", "abstract": "We develop a comprehensive, gauge-covariant geometric framework for non-Hermitian quantum systems in the quasi-Hermitian regime, that is, the region of parameter space where the non-Hermitian Hamiltonian admits a real spectrum and a positive-definite metric operator. We build this framework by elevating the Dyson map to a central geometric object. This map is the transformation that converts a non-Hermitian Hamiltonian into an equivalent Hermitian one. From it we construct the Dyson connection and decompose it into Hermitian and anti-Hermitian parts, identified respectively as {\\it stretching } and {\\it rotation } components. This decomposition cleanly separates the genuine physical metric deformations from the unitary gauge redundancies. Working with manifestly gauge-covariant states, we then derive the complex non-Hermitian Berry phase and the quantum geometric tensor (QGT), and show that the non-Hermitian geometric curvature originates from the non-commutativity of the stretching components at the operator level. We further analyse the geometric singularities near an exceptional point (EP) and uncover a distinct hierarchy of divergences. For a general two-level non-Hermitian model, the quantum metric tensor (QMT) exhibits a leading-order divergence $\\sim |\\epsilon_\\mu|^{-2}$, while the Berry curvature shows a weaker, subleading divergence $\\sim |\\epsilon_\\mu|^{-3/2}$, with $\\epsilon_\\mu$ denoting the parameter displacement from the EP along an individual parameter axis $\\mu$. Finally, we examine physical realizations of this model, including the non-Hermitian Su--Schrieffer--Heeger (SSH) and Hatano--Nelson (HN) models, where exact analytical results confirm the predicted critical scaling laws and illustrate the metric-deformation-driven non-Hermitian geometries.", "url": "https://arxiv.org/abs/2606.15922", "type": "理论", "summary": "1. 该工作为准厄密区域（实谱且正定度规）的非厄密量子系统建立了规范协变的几何框架。\n2. 其核心是将Dyson映射提升为几何对象并构造Dyson联络，分解为拉伸（物理度规形变）与旋转（幺正规范冗余）分量，揭示量子几何张量曲率源于拉伸非对易，并导出奇异点附近量子度规张量（~|ε|^{-2}）与Berry曲率（~|ε|^{-3/2}）的不同发散标度律。\n3. 该框架统一刻画了度规形变驱动的非厄密几何，并在SSH与Hatano-Nelson模型中精确验证临界标度，为奇异点物理与非厄密拓扑相的研究提供了理论工具。", "summary_source": "deepseek", "authors": [{"name": "Gargi Das"}, {"name": "Sudhanshu Shekhar"}, {"name": "Bhabani Prasad Mandal"}], "featured_authors": [{"name": "Gargi Das"}, {"name": "Sudhanshu Shekhar"}, {"name": "Bhabani Prasad Mandal"}], "author_count": 3}, {"id": "2606.15995", "category": "quant-ph", "title": "Influence of the Electron's Anomalous Magnetic Dipole Moment on High-Atomic-Number Atoms", "abstract": "Super-heavy atoms ($Z > 100$) are usually studied in the context of the so-called ``Quantum Electrodynamics of Strong Fields''. In this theory the problem of the singularity in the electron energy whenever $Z > 137$ is overcome. This is done by considering the finite size of the nucleus and leads to interesting phenomena, such as the spontaneous production of positrons. Here, we show that taking into account the contribution from the Anomalous Magnetic Dipole Moment of the electron (by means of an effective theory), within a point-nucleus model, is a sufficient condition to obtain regular wave functions and physically acceptable energy values for $Z > 137$.", "url": "https://arxiv.org/abs/2606.15995", "type": "理论", "summary": "1. 本文研究电子反常磁偶极矩对原子序数Z>137超重原子能级与波函数行为的影响。\n2. 关键在于指出，在点核模型中仅考虑反常磁矩修正，即可避免Z>137时电子能量的奇异性，获得正则波函数与物理可接受的能值。\n3. 该结果为强场量子电动力学中自发正电子产生等问题的理解，以及超重原子物理的理论方案提供了替代性视角与启发。", "summary_source": "deepseek", "authors": [{"name": "C. A. S. Almeida"}, {"name": "J. Auto-Neto"}], "featured_authors": [{"name": "C. A. S. Almeida"}, {"name": "J. Auto-Neto"}], "author_count": 2}, {"id": "2606.16037", "category": "quant-ph", "title": "Adiabatically-induced Kawaguchi geometry and jerk in quantum-classical systems", "abstract": "Adiabatically eliminating the quantum degrees of freedom in a mixed quantum-classical system produces an effective force in the classical equation of motion. The elimination can be made to any order in the adiabatic parameter, generating a series of higher order forces. By applying a sequence of near-identity unitary transformations to the quantum state, we derive a hierarchy of increasingly accurate effective actions for the classical variables. The third order Euler-Lagrange equation is non-Newtonian as the force depends on the jerk, the third order time derivative of position. We find that the third order terms induce a special kind of Kawaguchi geometry on the space of classical variables. This geometry is characterized by an almost symplectic structure and a differential line element that depends on the acceleration in addition to the velocity. Our results can be used to efficiently capture higher order nonadiabatic effects in molecular dynamics simulations.", "url": "https://arxiv.org/abs/2606.16037", "type": "理论+数值", "summary": "1. 该工作从混合量子经典体系的绝热消除出发，利用近恒等幺正变换推导了经典变量的高阶有效作用量，得到含三阶时间导数（jerk）的非牛顿欧拉-拉格朗日方程。\n2. 其核心在于揭示三阶项诱导出经典变量空间上的Kawaguchi几何，其特征为几乎辛结构以及依赖于速度与加速度的微分线元。\n3. 这为在分子动力学模拟中高效捕捉高阶非绝热效应提供了理论框架，并拓展了经典几何与量子退耦合方法的结合途径。", "summary_source": "deepseek", "authors": [{"name": "Athanasios Chatzistavrakidis"}, {"name": "Larisa Jonke"}, {"name": "Ryan Requist"}], "featured_authors": [{"name": "Athanasios Chatzistavrakidis"}, {"name": "Larisa Jonke"}, {"name": "Ryan Requist"}], "author_count": 3}, {"id": "2606.16090", "category": "quant-ph", "title": "Enhancing Quantum Machine Learning with Anyons", "abstract": "The power of quantum computing and quantum machine learning relies on harnessing uniquely quantum phenomena as computational resources. While superposition, coherence and entanglement have been central to this effort, the role of particle exchange statistics remains largely unexplored. Here, we introduce a quantum kernel framework that unifies bosonic, fermionic, and anyonic (fractional) exchange statistics within a single learning paradigm. We study this family of kernels from three perspectives. At the representation level, Haar-averaged effective-dimension analysis shows that fractional exchange phases access feature-space directions inaccessible to the purely symmetric or antisymmetric limits. At the level of kernel geometry, the corresponding Gram matrices show greater separation from the distinguishable-particle baseline and reduced label-dependent model complexity. Finally, on learning benchmarks, anyonic kernels consistently outperform their bosonic and fermionic counterparts, with stronger target alignment and more favorable class geometry. Together, these findings show that exchange statistics reshape the structure and geometry of quantum feature space, leading to enhanced learning performance. Our work identifies particle exchange statistics as an overlooked computational ingredient for quantum machine learning and provides the first systematic comparison of quantum learning models across exchange phases.", "url": "https://arxiv.org/abs/2606.16090", "type": "理论+数值", "summary": "1. 该工作提出了一个统一玻色子、费米子和任意子分数交换统计的量子核框架，并系统研究了其对量子机器学习性能的影响。\n2. 其核心卖点在于分数交换相位能访问对称与反对称极限无法触及的特征空间方向，且任意子核在核几何与学习基准上均优于玻色/费米对应物。\n3. 这首次揭示了粒子交换统计作为量子机器学习中未被充分利用的计算资源，为基于任意子的量子特征空间设计与学习模型优化提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Da Zhang"}, {"name": "Wen-Qiang Liu"}, {"name": "Zhaohui Wei"}, {"name": "Zhang-Qi Yin"}], "featured_authors": [{"name": "Da Zhang"}, {"name": "Wen-Qiang Liu"}, {"name": "Zhaohui Wei"}, {"name": "Zhang-Qi Yin"}], "author_count": 4}, {"id": "2606.16221", "category": "quant-ph", "title": "QALM: Escaping Local Minima via Interleaved Exploration and Exploitation in Quantum Circuit Optimization", "abstract": "Quantum circuit optimizers face a fundamental limitation in how they tolerate temporary cost increases. At one extreme, greedy rule-based optimizers immediately apply any cost-reducing transformation, achieving high efficiency but quickly becoming trapped in local minima. At the other extreme, search-based optimizers accept cost-increasing moves to explore the circuit space and escape such minima. However, because search-based optimizers cannot determine within a reasonable time budget whether a given point is promising, that is, whether its neighborhood contains a deeper local minimum, they must blindly explore higher-cost regions. As a result, escaping the current basin to reach a promising point takes exponentially many steps. In this work, we show that this limitation can be overcome with a hybrid framework that interleaves the exhaustive exploration capabilities of search algorithms with the efficiency of rule-based optimization. We implement this framework as QALM, a novel optimizer designed to escape local minima without incurring the runtime penalties of pure search. Crucially, our results demonstrate that QALM does not merely strike a balance; it outperforms existing rule-based and search-based optimizers in circuit reduction rates while operating with the computational efficiency of rule-based systems. In a comprehensive evaluation across 248 circuits, QALM matches or exceeds the fidelity of the strongest baseline on 83.9% of these circuits, given the same time budget.", "url": "https://arxiv.org/abs/2606.16221", "type": "数值", "summary": "1. 该工作提出了一个混合框架QALM，通过交织搜索算法的穷举探索与基于规则的优化来逃离量子电路优化中的局部最小值。\n2. 其核心卖点在于在避免搜索算法指数级步数开销的同时，实现了优于纯规则和纯搜索方法的电路缩减率与计算效率。\n3. 这启示我们，量子编译等复杂优化任务中，探索-利用交织策略可兼具高性能与高效率，为实用化优化器设计提供新思路。", "summary_source": "deepseek", "authors": [{"name": "Aidan Wagner"}, {"name": "Mingkuan Xu"}, {"name": "Pengyu Liu"}, {"name": "Zhihao Jia"}, {"name": "Umut A. Acar"}], "featured_authors": [{"name": "Aidan Wagner"}, {"name": "Mingkuan Xu"}, {"name": "Pengyu Liu"}, {"name": "Zhihao Jia"}, {"name": "Umut A. Acar"}], "author_count": 5}, {"id": "2606.16265", "category": "quant-ph", "title": "Bi-qutrit entangled edge states of positive partial transposes with largest ranks", "abstract": "Whenever $E$ is an eight dimensional subspace of the bi-qutrit quantum system whose orthogonal complement is spanned by a vector of Schmidt rank three, we show that there exist PPT entangled edge states with the range space $E$ whose partial transposes are of rank six, which is the largest possible rank. In this way, we exhibit a huge family of bi-qutrit PPT entangled edge states of type $(8,6)$. They make faces of the convex set of all PPT states, and we find bi-qutrit PPT entangled edge states of other types on the boundaries of such faces.", "url": "https://arxiv.org/abs/2606.16265", "type": "理论", "summary": "1. 该工作构造了双qutrit系统中一类具有最大部分转置秩的PPT纠缠边缘态，其值域空间为八维子空间且正交补由Schmidt秩为三的向量张成。\n2. 其技术核心在于证明此类(8,6)型态的部分转置秩可达最大值六，并表明它们构成所有PPT态凸集的边界面。\n3. 这为在高维量子系统中理解PPT纠缠态的边界结构及其面分类提供了明确的几何框架与构造途径。", "summary_source": "deepseek", "authors": [{"name": "Kyung Hoon Han"}, {"name": "Seung-Hyeok Kye"}], "featured_authors": [{"name": "Kyung Hoon Han"}, {"name": "Seung-Hyeok Kye"}], "author_count": 2}, {"id": "2606.16418", "category": "quant-ph", "title": "A short proof of the modified Kretschmann-Schlingemann-Werner conjecture", "abstract": "Let $\\Phi_1, \\Phi_2 : \\mathbb{M}_d(\\mathbb{C})\\to \\mathbb{M}_n(\\mathbb{C})$ be two quantum channels with respective Stinespring isometries $V_1, V_2 : \\mathbb{C}^{d}\\to \\mathbb{C}^{n} \\otimes \\mathbb{C}^{m}$ on any common dilation space $\\mathbb{C}^{m}$. We prove that there exists a unitary $U$ on $\\mathbb{C}^{m}$ such that $\\|V_1-({\\bf1}\\otimes U)V_2\\|_\\infty\\leq\\sqrt{2\\|\\Phi_1-\\Phi_2\\|_\\diamond},$ thus resolving vom Ende's modification of the Kretschmann-Schlingemann-Werner conjecture in the affirmative.", "url": "https://arxiv.org/abs/2606.16418", "type": "理论", "summary": "1. 该工作给出了修正的Kretschmann-Schlingemann-Werner猜想的简短证明，即两个量子信道之间的钻石距离平方根界定了其Stinespring等距在任意公共扩张空间上的酉对齐误差。\n2. 其核心在于证明了存在一个与等距维度无关的酉算子，使得等距差的算子范数不超过信道差钻石范数的根号二倍，从而严格量化了信道表示与等距表示之间的Lipschitz稳定性。\n3. 这为量子信道逼近、信道区分及容错量子计算等领域的误差分析提供了普适的几何解释与实用的上界工具。", "summary_source": "deepseek", "authors": [{"name": "Satvik Singh"}], "featured_authors": [{"name": "Satvik Singh"}], "author_count": 1}, {"id": "2606.16425", "category": "quant-ph", "title": "Worst-case depth hierarchy for shallow quantum circuits", "abstract": "Circuit depth is a central resource in complexity theory. While bounded-depth classical circuits admit well-understood hierarchy theorems, the internal structure of constant-depth quantum computation remains comparatively unexplored. We prove an explicit depth hierarchy theorem for $\\mathsf{QNC}^0$. For each $d\\ge 12$, we construct a family of two-round interactive problems on which no depth-$(d-1)$ quantum circuit can achieve near-perfect success, regardless of gate set, circuit size, or ancillary qubits. In contrast, we prove that our construction admits realizations by simple bounded fan-in quantum circuits of depth larger than $d$ by a small constant factor. Moreover, all bounded fan-in classical circuits of sublogarithmic depth (in the input size) fail to achieve perfect success on these tasks for every $d$, yielding a hierarchy of problems that show unconditional quantum advantage of $\\mathsf{QNC}^0$ over $\\mathsf{NC}^0$. A key obstacle is the scarcity of lower bound techniques for quantum circuits. To address this, we develop methods to analyze how depth affects a circuit's ability to realize nonlocal correlations amongst its output qubits in a fine-grained manner. Our approach exploits the correspondence between constraint systems and nonlocal games, translating group-theoretic constructions into rigid operator-valued constraint systems and then into non-local games. In particular, we construct constraint systems whose unique faithful operator-valued solutions require every perfect strategy, and every near-perfect strategy to a fixed precision, to implement multi-controlled phase operations. This reduces to a nonlocal unitary-synthesis problem, yielding depth lower bounds for both shallow quantum and classical circuits. These results show that increasing depth strictly increases computational power within $\\mathsf{QNC}^0$, establishing a genuinely quantum hierarchy.", "url": "https://arxiv.org/abs/2606.16425", "type": "理论", "summary": "1. 该工作为浅量子电路深度层次结构建立了严格定理，对每个d≥12构造了验证深度(d-1)与d量子电路能力差距的两轮交互问题族。\n2. 其关键在于将约束系统与非局域博弈对应，将群论构造转为刚性算子值约束系统，从而精细刻画深度对输出量子比特间非局域关联的影响。\n3. 这首次证明QNC⁰中深度严格递增计算能力，并给出QNC⁰无条件优于NC⁰的明确问题，为浅层量子优势研究提供了系统性框架。", "summary_source": "deepseek", "authors": [{"name": "Min-Hsiu Hsieh"}, {"name": "Michael de Oliveira"}, {"name": "Sathyawageeswar Subramanian"}, {"name": "Xingjian Zhang"}], "featured_authors": [{"name": "Min-Hsiu Hsieh"}, {"name": "Michael de Oliveira"}, {"name": "Sathyawageeswar Subramanian"}, {"name": "Xingjian Zhang"}], "author_count": 4}, {"id": "2606.16712", "category": "quant-ph", "title": "Complete entanglement detection using polynomial invariants", "abstract": "Existing methods for deciding whether a bipartite quantum state is separable or entangled typically fall into one of two categories: they are either complete but require access to an explicit density matrix followed by numerical optimization, or they can be evaluated directly by measuring the quantum system but are incomplete, in the sense that they cannot detect all forms of entanglement. In this work, we overcome both limitations in a unified framework. First, we bypass numerical optimization by deriving separability criteria in the form of universal bounds on tensor powers of separable states. We prove that these bounds are complete: every entangled state violates them for sufficiently large tensor powers. Second, we explicitly construct a corresponding complete family of nonlinear entanglement witnesses, which can detect all forms of entanglement without requiring an explicit density matrix. The witnesses we construct are moreover basis-independent, in the sense that they are invariant under conjugation by local unitaries. Altogether, our results expand the toolbox for entanglement detection in arbitrary local dimensions in a manifestly invariant way.", "url": "https://arxiv.org/abs/2606.16712", "type": "理论+数值", "summary": "1. 该工作利用多项式不变量建立可分离态张量幂的通用界限，实现完整纠缠探测。\n2. 其核心在于构造基于局域酉不变量且无需密度矩阵的完备非线性纠缠见证族。\n3. 这为任意局域维度下纠缠的基无关探测提供了系统性的理论工具。", "summary_source": "deepseek", "authors": [{"name": "Thomas C. Fraser"}, {"name": "Vjosa Blakaj"}, {"name": "Roberto Rubboli"}, {"name": "Felix Huber"}, {"name": "Marco Fanizza"}], "featured_authors": [{"name": "Thomas C. Fraser"}, {"name": "Vjosa Blakaj"}, {"name": "Roberto Rubboli"}, {"name": "Felix Huber"}, {"name": "Marco Fanizza"}], "author_count": 5}, {"id": "2606.16764", "category": "quant-ph", "title": "Charging Quantum Batteries with Chiral Squeezing", "abstract": "We propose a quantum-battery charger based on a driven bosonic Kitaev chain (BKC), where chiral squeezing converts passive input fluctuations into ordered, non-passive battery states. While a coherent input pulse exhibits phase-sensitive chiral transport, the charging dynamics is dominated by bidirectionally propagating fluctuations that are amplified and squeezed into orthogonal quadratures at opposite chain ends. In contrast to conventional phase-preserving amplifiers, our scheme stores largely extractable energy and achieves a work-like signal-to-noise ratio (SNR) near unity, even in the presence of thermal noise and moderate symmetry-preserving disorder.", "url": "https://arxiv.org/abs/2606.16764", "type": "理论", "summary": "1. 该工作提出基于驱动玻色子Kitaev链的手性压缩量子电池充电方案，将被动输入噪声转化为可提取的有序电池态。\n2. 其核心在于利用手性压缩对双向传播的涨落进行正交相位放大，在热噪声及中等对称性保持无序下仍能实现接近单位的工作信噪比。\n3. 这为量子电池的能量存储与提取提供了不同于相位保持放大器的物理机制，启发了噪声辅助充电与手性量子热力学的研究。", "summary_source": "deepseek", "authors": [{"name": "Borhan Ahmadi"}, {"name": "André H. A. Malavazi"}, {"name": "Janine Splettstoesser"}, {"name": "Paweł Horodecki"}, {"name": "Lei Du"}], "featured_authors": [{"name": "Borhan Ahmadi"}, {"name": "André H. A. Malavazi"}, {"name": "Janine Splettstoesser"}, {"name": "Paweł Horodecki"}, {"name": "Lei Du"}], "author_count": 5}, {"id": "2606.16823", "category": "quant-ph", "title": "Physically Motivated Ansatz for Open Fermionic Systems on Quantum Computer", "abstract": "Determining non-equilibrium steady states (NESS) of open fermionic systems is a fundamental problem akin to finding ground states of closed systems. To address this, variational quantum algorithms can be used to solve the Lindblad master equation, much like the Schrödinger equation, yet ansatz design for NESS remains challenging. Existing approaches rely mostly on hardware-efficient ansätze (HEA), which suffer from the barren plateau problem. Here, we introduce a physically motivated ansatz named NE-UCC. Numerical simulations demonstrate that NE-UCC reliably converges to the steady state even in strongly correlated regimes far from equilibrium, reducing the infidelity by up to ten orders of magnitude compared to HEA. Furthermore, NE-UCC facilitates the exploration of excited eigenmodes with specific symmetries.", "url": "https://arxiv.org/abs/2606.16823", "type": "理论+数值", "summary": "1. 本文针对开放费米子系统的非平衡稳态问题，提出了一个物理启发的变分拟设NE-UCC，用于在量子计算机上求解Lindblad主方程。\n2. 其技术核心在于该拟设在远离平衡的强关联区域仍能可靠收敛至稳态，与硬件高效拟设相比，保真度提升可达十个数量级，并能探索特定对称性的激发本征模。\n3. 这为在量子平台上高效模拟开放量子多体系统提供了更具物理原理性的变分方案，有望推动非平衡态计算的发展。", "summary_source": "deepseek", "authors": [{"name": "Yi Liu"}, {"name": "Xiaopeng Li"}, {"name": "Zhen Liu"}, {"name": "Zhenyu Li"}], "featured_authors": [{"name": "Yi Liu"}, {"name": "Xiaopeng Li"}, {"name": "Zhen Liu"}, {"name": "Zhenyu Li"}], "author_count": 4}, {"id": "2606.16854", "category": "quant-ph", "title": "3D Ising criticality with Platonic lattice superconducting qubits", "abstract": "The three-dimensional (3D) Ising model is a foundational model in statistical physics and critical phenomena, yet its analytical intractability has long impeded the precise determination of universal critical exponents. While high-precision estimates have been obtained through classical numerical methods and conformal bootstrap techniques, a direct quantum simulation of the 3D Ising criticality remains challenging, requiring nontrivial connectivity, sufficient system size, and high spectral resolution. In this work, assisted by the state-operator correspondence of conformal field theory, we perform a digital quantum simulation of the 3D Ising critical exponents using a multiply-connected 9-qubit superconducting quantum processor with a Platonic lattice geometry. Employing an extended variational quantum eigensolver equipped with a phase-based loss function, we variationally prepare the low-energy eigenstates of the transverse-field Ising model on a cubic Platonic lattice encoded in an 8-qubit register. The four lowest eigenenergies are extracted via Fourier-transform analysis and high-precision numerical fitting, agreeing with the exact diagonalization values up to +/- 0.001. The resulting scaling dimension Delta_epsilon = 1.5850 and critical exponent nu = 0.7067 match well with theory.", "url": "https://arxiv.org/abs/2606.16854", "type": "理论+数值", "summary": "1. 本工作利用柏拉图立体晶格几何的9量子比特超导处理器，通过数字量子模拟实现了三维伊辛模型临界指数的直接量子提取。\n2. 技术核心在于结合共形场论态-算符对应与基于相位的损失函数的扩展变分量子本征求解器，高精度制备了立方柏拉图晶格上横场伊辛模型的低能本征态。\n3. 所得标度维度Δε=1.5850和临界指数ν=0.7067与理论一致，为在噪声中等规模量子设备上精确模拟强关联统计模型临界现象建立了可行方案。", "summary_source": "deepseek", "authors": [{"name": "Liyang Sui"}, {"name": "Hong-Hao Song"}, {"name": "Sainan Huai"}, {"name": "Yufan Li"}, {"name": "Zhiwen Zong"}, {"name": "Kunliang Bu"}, {"name": "Xiaopei Yang"}, {"name": "Xingrui Liu"}, {"name": "Wenyan Jin"}, {"name": "Bowen Chen"}, {"name": "Xutao Zhang"}, {"name": "Jianlan Wu"}, {"name": "Yicong Zheng"}, {"name": "Shengyu Zhang"}, {"name": "Gang v. Chen"}, {"name": "Yi Yin"}], "featured_authors": [{"name": "Liyang Sui"}, {"name": "Hong-Hao Song"}, {"name": "Sainan Huai"}, {"name": "Shengyu Zhang"}, {"name": "Gang v. Chen"}, {"name": "Yi Yin"}], "author_count": 16}, {"id": "2606.16865", "category": "quant-ph", "title": "Morphology-resolved scrambling in a chaotic quantum billiard", "abstract": "Chaotic quantum systems can retain spatial memory through scarred eigenstates, but whether these static structures control scrambling remains unclear. This work establishes a morphology-resolved connection between scarred eigenstates and eigenstate-resolved OTOCs in a peanut-shaped quantum billiard. Scalar localisation diagnostics, including differential entropy and continuum participation ratios, detect anomalous concentration but discard spatial architecture. A scale-normalised density overlap, in contrast, directly compares probability density profiles, revealing families of orthogonal eigenstates with nearly identical spatial morphology. Comparing the complete OTOC time traces of these orthogonal eigenstates reveals that morphological recurrence has dynamical content: moderate density overlap yields no universal prediction, whereas strongly recurring morphologies exhibit nearly identical OTOC growth and saturation. Thus, scarred structures act as spatial templates for operator growth, not merely static violations of ergodicity. This morphology-resolved framework turns eigenstate shape into a quantitative predictor of scrambling and provides a scale-controlled diagnostic of weak ergodicity breaking in quantum chaos.", "url": "https://arxiv.org/abs/2606.16865", "type": "数值", "summary": "1. 该工作在花生形量子台球中建立了疤痕本征态与本征态分辨OTOC之间的形态学分辨联系。\n2. 其卖点在于采用尺度归一化密度重叠直接比较概率密度轮廓，揭示形态高度重复的本征态具有近乎一致的OTOC增长和饱和行为。\n3. 这为将本征态形状转化为算子演化的定量预测器，并提供弱遍历性破缺的尺度可控诊断提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Pranaya Pratik Das"}], "featured_authors": [{"name": "Pranaya Pratik Das"}], "author_count": 1}, {"id": "2606.16945", "category": "quant-ph", "title": "Counterdiabatic Raman Atom Optics for Compact High-Sensitivity Gravimetry", "abstract": "Large-momentum-transfer (LMT) atom interferometry provides a route toward enhanced inertial sensitivity in compact quantum sensors, but its scalability is limited by the accumulation of pulse-transfer errors across long Raman pulse sequences. We investigate theoretically the use of stimulated Raman shortcut-to-adiabatic passage (STIRSAP) for high-fidelity LMT atom optics in a Mach--Zehnder interferometer geometry. The counterdiabatic correction is encoded directly into the Raman pulse envelopes, eliminating the need for auxiliary microwave or radio-frequency control fields. Numerical simulations based on an effective Raman model show that $1~\\mu\\mathrm{s}$ STIRSAP pulses achieve single-pulse transfer fidelities of $F_\\pi = 0.99902$ while maintaining negligible pulse-time overhead even at high momentum order. We analyze the resulting tradeoff between interferometric phase enhancement and compound contrast decay and identify an unconstrained shot-noise optimum near $n\\approx270$. The analysis further shows that practical operation at extreme LMT order is constrained by wave-packet separation, vibration noise, Doppler detuning, and accumulated systematic effects rather than by pulse duration itself. These results establish superadiabatic Raman control as a promising approach for scalable high-fidelity atom optics and clarify the physical limitations governing compact high-order atom interferometers.", "url": "https://arxiv.org/abs/2606.16945", "type": "理论+数值", "summary": "1. 该工作从理论上研究了反绝热拉曼捷径通道（STIRSAP）在Mach-Zehnder干涉仪中实现高保真大动量转移原子光学的可行性。\n2. 其技术核心在于将反绝热校正直接编码于拉曼脉冲包络，无需辅助微波场，1微秒脉冲保真度达0.99902，并解析出散粒噪声最优动量阶数约270。\n3. 这确立了超绝热拉曼控制作为可扩展高保真原子光学的可行方案，并阐明了波包分离、振动噪声等物理因素对紧凑高次原子干涉仪的限制。", "summary_source": "deepseek", "authors": [{"name": "Asad Ali"}, {"name": "Hamid Arian Zad"}, {"name": "Saif Al-Kuwari"}, {"name": "Muhammad Irtiza Hussain"}, {"name": "Muhammad Talha Rahim"}, {"name": "Hashir Kuniyil"}, {"name": "Tim Byrnes"}, {"name": "James Q. Quach"}, {"name": "Saeed Haddadi"}], "featured_authors": [{"name": "Asad Ali"}, {"name": "Hamid Arian Zad"}, {"name": "Saif Al-Kuwari"}, {"name": "Tim Byrnes"}, {"name": "James Q. Quach"}, {"name": "Saeed Haddadi"}], "author_count": 9}, {"id": "2606.16959", "category": "quant-ph", "title": "Diagonal-Budgeted Trotterization for Efficient Quantum Hamiltonian Simulation", "abstract": "Efficient classical simulation of quantum Hamiltonian dynamics is often bottlenecked by exponential state growth and the overhead of generic sparse linear algebra. We introduce diagonal-budgeted Trotterization, a structure-aware strategy that decomposes Hamiltonians into factors preserving diagonal sparsity while tightly controlling fidelity loss. Our implementation, HamSim, utilizes a compact diagonal-sparse data layout and specialized C++/CUDA kernels to bypass the overheads of generic formats like CSR. By leveraging SIMD vectorization, multithreading, and GPU acceleration, HamSim achieves high performance across heterogeneous architectures. Benchmarks on the HamLib suite show that HamSim significantly outperforms Qiskit-Aer. On CPUs, HamSim attains speedups of $182$--$1,269\\times$ on optimization instances (TSP, MaxCut) and $4.8$--$841\\times$ on physical models (TFIM, Heisenberg). On GPUs, it achieves up to $178\\times$ speedup for $12$--$16$ qubit problems. Unlike traditional Trotterization, HamSim maintains near-perfect fidelity without requiring exponential steps. This demonstrates that diagonal-aware numerical kernels provide a scalable foundation for high-fidelity classical Hamiltonian simulation.", "url": "https://arxiv.org/abs/2606.16959", "type": "理论+数值", "summary": "1. 该工作提出了对角预算Trotter化策略，利用哈密顿量的对角稀疏结构实现高效经典模拟。\n2. 其核心在于设计紧凑的对角稀疏数据布局与专用C++/CUDA内核，通过SIMD和GPU并行加速，对12–16比特问题取得最高178倍速。\n3. 这示范了结构感知数值方法能在不增加Trotter步数下维持近完美保真度，为经典哈密顿模拟提供了可扩展的异架构求解路径。", "summary_source": "deepseek", "authors": [{"name": "Srikar Chundury"}, {"name": "Blake Burgstahler"}, {"name": "Jiajia Li"}, {"name": "In-Saeng Suh"}, {"name": "Frank Mueller"}], "featured_authors": [{"name": "Srikar Chundury"}, {"name": "Blake Burgstahler"}, {"name": "Jiajia Li"}, {"name": "In-Saeng Suh"}, {"name": "Frank Mueller"}], "author_count": 5}, {"id": "2606.17036", "category": "quant-ph", "title": "Grid-state deformation in a no-jump non-Hermitian bosonic dimer", "abstract": "We study the no-jump evolution of ideal grid states in a lossy bosonic dimer with differential decay. The effective non-Hermitian quadratic dynamics induces a complex symplectic flow in phase space that deforms both the primitive lattice vectors and the origin seed. The average decay rate controls common attenuation, while coherent hopping and differential decay control the reduced dimer deformation. The reduced sector contains elliptic, parabolic, and hyperbolic regimes with imaginary spectra, an exceptional point, and real spectra, producing oscillatory, linear, and exponential lattice deformations. Although projected lattice areas can change, the deformation comes from a determinant-one complex symplectic flow on the full four-dimensional phase space. For a Gaussian regularization of the origin seed, we derive the associated complex width matrix and identify the positivity conditions that preserve Gaussian form. For an initial two-mode qunaught product state, the lossless limit recovers the standard beam-splitter generation of a square GKP$+$ Bell pair, while the no-jump dynamics produces its non-Hermitian deformation with a postselection cost set by the no-jump probability.", "url": "https://arxiv.org/abs/2606.17036", "type": "理论", "summary": "1. 该工作研究了损耗玻色子二聚体中无跳变演化对理想网格态的形变效应。\n2. 其核心在于揭示非厄米二次动力学产生的四维相空间复辛流形，驱动晶格矢量与原点种子发生椭圆、抛物及双曲三种类型形变。\n3. 这为非厄米系统中网格态变形的解析描述，以及无损耗极限下GKP贝尔对生成的后选择代价提供了定量框架。", "summary_source": "deepseek", "authors": [{"name": "B. M. Rodriguez-Lara"}, {"name": "H. Ghaemi-Dizicheh"}, {"name": "S. Dehdashti"}, {"name": "A. Hanke"}, {"name": "A. Touhami"}, {"name": "J. Nötzel"}], "featured_authors": [{"name": "B. M. Rodriguez-Lara"}, {"name": "H. Ghaemi-Dizicheh"}, {"name": "S. Dehdashti"}, {"name": "A. Hanke"}, {"name": "A. Touhami"}, {"name": "J. Nötzel"}], "author_count": 6}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
