thermodynamics.", "url": "https://arxiv.org/abs/2606.15270", "type": "理论", "summary": "1. 该工作从体优先的BF观点出发，研究广义Schwarzian动力学如何从二维BF引力及其边界相空间的Drinfeld-Sokolov约化中涌现。\n2. 其主要技术卖点在于通过sl(3,R)理论中的第二和第三Wilczynski不变量自然推广Schwarzian导数，并将射影不变量直接关联至Casimir荷、单值性数据及广义Schwarzian热力学。\n3. 这为统一描述BF引力、渐近对称约化、射影几何与边界热力学提供了框架，并启示了高秩非微扰引力理论的热力学结构。", "summary_source": "deepseek", "authors": [{"name": "H. T. Özer"}, {"name": "Aytül Filiz"}], "featured_authors": [{"name": "H. T. Özer"}, {"name": "Aytül Filiz"}], "author_count": 2}, {"id": "2606.15562", "category": "hep-th", "title": "Quantum Corrections to Page Curve of Charged Near-AdS$_2$ Black Holes", "abstract": "We study the evaporation and Page curve of charged near-AdS$_2$ black holes coupled to a non-gravitating bath at fixed temperature and chemical potential. The low-energy dynamics is governed by the Schwarzian reparametrization mode together with a $U(1)$ phase mode. We average the boundary energy and the outgoing flux over these two soft modes and obtain corrected balance equations for the temperature and chemical potential. We then use the corrected background to calculate the no-island and island entropies and the Page time shifts. We find that the two soft sectors affect the Page transition in our low-temperature semiclassical regime. The $U(1)$ phase mode correction delays the Page transition, while the Schwarzian correction tends to move it earlier. The total Page time shift is therefore determined by the competition between the Schwarzian and $U(1)$ sectors.", "url": "https://arxiv.org/abs/2606.15562", "type": "理论", "summary": "1. 该工作研究了与非引力浴耦合的带电近AdS₂黑洞在固定温度和化学势下的蒸发过程及Page曲线，并纳入了Schwarzian重参数化模式和U(1)相位模式的量子修正。\n2. 其卖点在于通过对两种软模式平均边界能量与出射通量，获得修正的温度和化学势平衡方程，进而计算无岛与岛熵，揭示Page时间移动由Schwarzian与U(1)扇区的竞争决定。\n3. 这为理解低能量子引力中软模式如何修正黑洞信息悖论提供了具体机制，并启发在更一般背景下探索此类竞争对Page转变的影响。", "summary_source": "deepseek", "authors": [{"name": "Zi-Qing Xiao"}], "featured_authors": [{"name": "Zi-Qing Xiao"}], "author_count": 1}, {"id": "2606.15661", "category": "hep-th", "title": "Strong primordial inhomogeneities of axion-like field in Einstein-Gauss-Bonnet gravity", "abstract": "In this paper we consider complex scalar field with Mexican hat potential coupled with Gauss-Bonnet scalar resulting in restored U(1) symmetry at the stage of inflation, corresponding to the modern cosmological horizon. In our model, the phase transition takes place during inflation, avoiding large-scale axion isocurvature perturbations. Our model provides strong primordial inhomogeneities on small scales and ultra-light axion-like particle as either a fuzzy dark matter candidate or a candidate for inhomogeneous dark energy. We also study the possibility of black hole formation and gravitational wave background in this scenario. We find that in the case when the symmetry breaking field does not backreact on inflation, black hole production is not feasible. However, under specific conditions, gravitational waves fitting the NANOGrav band can be obtained.", "url": "https://arxiv.org/abs/2606.15661", "type": "理论", "summary": "1. 该工作在爱因斯坦-高斯-博内引力中引入具有墨西哥帽势的复标量场，实现了暴胀期间U(1)对称性的恢复。\n2. 其核心是相变发生于暴胀时期，避免了轴子等曲率扰动在大尺度上的出现，并产生小尺度强原初不均匀性。\n3. 这为超轻轴子作为模糊暗物质或非均匀暗能量提供了新机制，并在特定条件下引力波谱可拟合NANOGrav频段。", "summary_source": "deepseek", "authors": [{"name": "M.A. Krasnov"}, {"name": "D.Z. Berkimbayev"}, {"name": "A. Addazi"}, {"name": "Y. Aldabergenov"}, {"name": "M.Y. Khlopov"}], "featured_authors": [{"name": "M.A. Krasnov"}, {"name": "D.Z. Berkimbayev"}, {"name": "A. Addazi"}, {"name": "Y. Aldabergenov"}, {"name": "M.Y. Khlopov"}], "author_count": 5}, {"id": "2606.15732", "category": "hep-th", "title": "Flat Gauging of Continuous (Non-invertible) Symmetries and Non-compact BF SymTFT for Compact Boson", "abstract": "We study flat gauging of continuous symmetries by summing over flat gauge-field configurations. We focus on the two-dimensional compact boson and construct the torus partition function with general flat $U(1)_M\\times U(1)_W$ backgrounds. We show that flat gauging either $U(1)_M$ or $U(1)_W$ decompactifies the theory to the non-compact free boson, and that the dual $\\mathbb{Z}$ background combines with the remaining $U(1)$ background into a non-compact $\\mathbb{R}$ symmetry background due to the mixed anomaly. We also revisit the self-dual radius, where flat gauging the diagonal $SO(3)\\subset (SU(2)_L\\times SU(2)_R)/\\mathbb{Z}_2$, first pointed out by Gaberdiel and Suchanek, gives the continuous orbifold which lies outside the usual $c=1$ moduli space. On the orbifold branch, we study finite and continuous non-invertible flat gaugings and explain why the continuous case requires a prescription for zero-measure fixed loci on the moduli space. Finally, we formulate the SymTFT of torus sigma models as a non-compact BF theory, whose topological boundary states encode the Narain moduli space and the $O(D,D;\\mathbb{Z})$ T-duality action.", "url": "https://arxiv.org/abs/2606.15732", "type": "理论", "summary": "1. 该工作通过求和平坦规范场构型，系统研究了二维紧致玻色子模型中连续对称性的平坦规范，并构造了一般平坦U(1)背景下的环面配分函数。\n2. 其核心发现是平坦规范U(1)对称性使理论解紧化为非紧致自由玻色子，而对偶Z背景与剩余U(1)因混合反常合并为连续R对称背景，并在自对偶半径处通过规范SO(3)子群得到连续轨形。\n3. 这为理解连续非可逆平坦规范、模空间上的零测度固定轨迹提供了处方，并将环面西格玛模型的SymTFT统一表述为非紧致BF理论，其拓扑边界态自然编码Narain模空间及O(D,D;Z) T-对偶作用。", "summary_source": "deepseek", "authors": [{"name": "Qiang Jia"}, {"name": "Yi Zhang"}], "featured_authors": [{"name": "Qiang Jia"}, {"name": "Yi Zhang"}], "author_count": 2}, {"id": "2606.15792", "category": "hep-th", "title": "Entanglement islands of 2D charged scalar-hairy black holes on the brane", "abstract": "We investigate the entanglement dynamics and Page curve of a 2D brane Maxwell-Scalar (MS) black hole coupled to thermal baths in double holography. Computing the entanglement entropy via the island formula, we find that injecting electric charge and scalar source into the system produce opposite effects: the former increases the degrees of freedom (DOF) on the brane by enhancing the effective global tension, thereby raising the saturation entropy of the system; conversely, the latter reduces the DOF on the brane by lowering the effective local tension near the IR geometry, ultimately suppressing the entanglement. Despite the non-trivial backreaction from the matter fields, the pre-saturation entanglement dynamics remain robust. We identify an early-time quadratic growth corresponding to the pre-local-thermalization phase, which smoothly transitions into a late-time linear growth. Furthermore, the scale of the Page time is governed by a competition between thermal excitations and the brane DOF. Higher temperatures accelerate the onset of the Page time by exciting more Hawking modes, while abundant DOF delay it by increasing the saturated entropy.", "url": "https://arxiv.org/abs/2606.15792", "type": "理论", "summary": "1. 该工作通过全息对偶研究了与热浴耦合的二维膜上带电标量毛黑洞的纠缠岛动力学与Page曲线。\n2. 其核心发现是注入电荷与标量源分别通过增强有效全局张力和降低近红外有效局域张力，对膜上自由度产生相反调控，从而改变饱和熵。\n3. 这揭示了Page时间由热激发与膜自由度竞争决定的机制，为理解非平凡物质反作用下的全息纠缠演化提供了关键启示。", "summary_source": "deepseek", "authors": [{"name": "Qingsong Li"}, {"name": "Yuxuan Liu"}, {"name": "Wenjie Zhu"}], "featured_authors": [{"name": "Qingsong Li"}, {"name": "Yuxuan Liu"}, {"name": "Wenjie Zhu"}], "author_count": 3}, {"id": "2606.15794", "category": "hep-th", "title": "An integrable deformation of the sine(sinh)-Gordon model -- Malcev algebra", "abstract": "In this paper we present an integrable model in two dimensions. It is a deformation of the sine(sinh)-Gordon model. We give its Lax connection. We also obtain its (classical) $r$-matrix. It satisfies the classical Yang-Baxter equation. Thus, the model is a classical integrable field theory in two dimensions. The underlying algebra is a ${\\cal Z}$-graded non-Lie Malcev algebra. It is a direct sum of $sl(2, {\\rm I\\!R})$ Lie algebras with a shared common Cartan. A Malcev algebra is the tangent space at the identity of an analytic Moufang loop as a Lie algebra is the tangent space at the identity of a Lie group. We expect the model to be integrable at the quantum level. We also give a family of classically integrable models which are related to the Poisson-Boltzmann equation in two dimensions.", "url": "https://arxiv.org/abs/2606.15794", "type": "理论", "summary": "1. 该文提出了一个基于Z-分次非李Malcev代数的二维sine(sinh)-Gordon模型的可积形变。\n2. 其核心在于构建了满足经典Yang-Baxter方程的r矩阵与Lax联络，揭示了该形变的经典可积性源于sl(2,R)李代数直和结构的非李推广。\n3. 该工作预期量子可积性，并导出了与二维Poisson-Boltzmann方程相关的一族经典可积模型，为非线性物理提供了新的可积构造。", "summary_source": "deepseek", "authors": [{"name": "Meseret Asrat"}], "featured_authors": [{"name": "Meseret Asrat"}], "author_count": 1}, {"id": "2606.15988", "category": "hep-th", "title": "Dressed Fock Spaces in Gauge Theory and Gravity", "abstract": "Four-dimensional gauge and gravitational theories exhibit long-range interactions that require asymptotic particles to be dressed by clouds of soft photons and gravitons. Faddeev-Kulish dressings render scattering amplitudes infrared-finite, but the resulting multi-particle states do not factorise into tensor products of dressed one-particle states. We show that this loss of Fock-space factorisation is not fundamental, but reflects an inappropriate choice of infrared variables. The real soft divergence is reproduced by the Goldstone modes of asymptotic symmetries, while the Coulomb phase is reproduced by new zero modes of the radiative fields that we introduce here. In these variables, infrared-finite dressed multi-particle states admit the usual Fock-space factorisation into single-particle dressed states.", "url": "https://arxiv.org/abs/2606.15988", "type": "理论", "summary": "1. 该工作引入新零模变量，证明规范理论与引力中红外有限的多粒子态能恢复Fock空间张量积分解。\n2. 其核心在于将软发散归因于渐近对称性的Goldstone模，而Coulomb相则由新定义的辐射场零模再现。\n3. 这为统一处理红外发散与渐近对称性提供了自洽变量框架，并可能推动散射振幅与量子引力中dressing结构的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Sangmin Choi"}, {"name": "Prahar Mitra"}], "featured_authors": [{"name": "Sangmin Choi"}, {"name": "Prahar Mitra"}], "author_count": 2}, {"id": "2606.16024", "category": "hep-th", "title": "The O(4)-breaking bubble", "abstract": "False vacuum decay in field theory is thought to be dominated by Coleman's O(4)-symmetric bounce, the minimum action nontrivial solution of the imaginary time equations of motion. Beyond the bounce, non-constructive existence proofs of O(4)-breaking solutions are available in the mathematics literature, but the solutions themselves, and their physics, have remained unknown. Considering the simple, bounded-below, scalar field potential $V(\\phi)=\\frac{m^2}{2}\\phi^2-\\frac{\\lambda}{4}\\phi^4+\\frac{g}{6}\\phi^6$, we construct a nonradial solution explicitly: two bubble-tubes of opposite sign wrapping orthogonal rings, invariant under ${\\rm O}(2)\\times{\\rm O}(2)$ rotations combined with a parity that exchanges the rings. The solution admits valid Cauchy data for real time evolution from a $t=0$ slice, and supports an odd number of unstable deformation modes.", "url": "https://arxiv.org/abs/2606.16024", "type": "理论", "summary": "1. 该工作构造了标量场势能V(φ)=½m²φ²−¼λφ⁴+⅙gφ⁶中一个显式非径向的O(4)破缺假真空衰变泡解，由两个符号相反、缠绕正交环的泡管构成，具有O(2)×O(2)对称性和交换环宇称。\n2. 其技术核心是显式验证该解在t=0切片上可为实时演化提供有效柯西数据，并支持奇数个不稳定形变模，突破了Coleman传统O(4)对称反弹解的对称性假设。\n3. 这一发现为研究假真空衰变中的非球对称衰变通道及其量子隧穿与动力学演化提供了具体可解的实例，并对高能物理与凝聚态相变理论中的泡生成问题具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Guy Avraham"}, {"name": "Kfir Blum"}, {"name": "Omri Rosner"}, {"name": "Isaac G. Smith"}], "featured_authors": [{"name": "Guy Avraham"}, {"name": "Kfir Blum"}, {"name": "Omri Rosner"}, {"name": "Isaac G. Smith"}], "author_count": 4}, {"id": "2606.16406", "category": "hep-th", "title": "Effect of $ξRϕ^2$ non-minimal coupling on gravitational light bending", "abstract": "We investigate the bending of massless fields by a massive object in the presence of a curvature-scalar $\\sqrt{-g}\\xi R \\phi^2$ non-minimal coupling up to one loop, using the perturbative quantum gravity computations. It is well known that without such coupling a self interacting scalar field theory cannot be renormalised in the presence of gravity. The massive object is modelled by a massive scalar $\\phi$, and it is assumed to be non-relativistic, e.g., a star. We compute the 2-2 scattering of massless scalar and photons off this object via graviton exchanges. Assuming both $\\xi$ and the bending angle to be small, we use the eikonal approximation to compute the angle up to ${\\cal O}(\\xi G^2)$. At tree level $({\\cal O}(\\xi G))$ we find no bending, and hence the ${\\cal O}(\\xi G^2)$ result happens to be leading in this case. The non-minimal vertices are qualitatively different from that of the standard minimal ones, e.g. $ \\sqrt{G} h_{\\mu\\nu} T^{\\mu\\nu}$, as the former contains explicit momenta of the gravitons instead of the scalar, complementing the second. The bending angle is found to behave like $\\sim b^{-7}$, where $b$ is the impact parameter. We have emphasised the qualitative differences of our results from that of the well studied minimal case.", "url": "https://arxiv.org/abs/2606.16406", "type": "理论", "summary": "1. 该工作利用微扰量子引力计算，研究存在ξRφ²非最小耦合时大质量物体对标量场和光子的引力弯曲，至单圈阶。\n2. 主要发现是树图阶无弯曲，领头贡献来自O(ξG²)，且弯曲角按b⁻⁷衰减，与标准最小耦合情形定性不同。\n3. 这为在引力系统中探测非最小耦合效应及理解其与重整化问题的关联提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Ayan Kumar Naskar"}, {"name": "Avijit Sen Majumder"}, {"name": "Sourav Bhattacharya"}], "featured_authors": [{"name": "Ayan Kumar Naskar"}, {"name": "Avijit Sen Majumder"}, {"name": "Sourav Bhattacharya"}], "author_count": 3}, {"id": "2606.16444", "category": "hep-th", "title": "Complexified Virasoro Flow and the Logarithmic Graviton at the Chiral Point", "abstract": "At the chiral point of topologically massive gravity, the massive graviton becomes degenerate with the left-moving graviton, leading to the appearance of a logarithmic mode and a corresponding rank-two Jordan structure. This logarithmic graviton plays a central role in the conjectured AdS$_3$/LCFT$_2$ correspondence, where it has been widely interpreted as the bulk counterpart of a logarithmic partner in the putative boundary logarithmic conformal field theory. In this work, we develop a geometric interpretation of this Jordan structure based on complexified Virasoro evolution. Starting from the logarithmic graviton of Grumiller and Johansson, we show that its logarithmic coefficient \\[ y(\\tau,\\rho) = -i\\tau-\\ln\\cosh\\rho \\] admits, near the AdS$_3$ boundary, the asymptotic form \\[ y(\\tau,\\rho) = -s+\\ln2+\\mathcal O(e^{-2\\rho}), \\qquad s=\\rho+i\\tau. \\] The same complex parameter naturally appears in the exponentiation of the Virasoro generator $L_0$ acting on a rank-two Jordan cell, \\[ L_0=h\\mathbf1+N, \\qquad N^2=0, \\] for which \\[ e^{sL_0} = e^{sh}(1+sN). \\] We show that the resulting Jordan evolution reproduces the characteristic logarithmic mixing of the logarithmic sector, while analytic continuation $s\\rightarrow s+2\\pi i$ generates the corresponding logarithmic monodromy. From this perspective, radial evolution, temporal evolution, Jordan mixing, and logarithmic monodromy may be viewed as different manifestations of a single complexified Virasoro flow. The analysis suggests a geometric interpretation of the indecomposable structures characteristic of logarithmic conformal field theory and offers a new perspective on the logarithmic graviton within the conjectural AdS$_3$/LCFT$_2$ framework.", "url": "https://arxiv.org/abs/2606.16444", "type": "理论", "summary": "1. 该工作利用复化Virasoro流发展了对数引力子Jordan结构的几何解释。\n2. 其卖点在于揭示了对数系数渐近形式与Jordan单元指数演化的统一描述。\n3. 这为AdS₃/LCFT₂对偶中不可分解结构的几何起源提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Yannick Mvondo-She"}], "featured_authors": [{"name": "Yannick Mvondo-She"}], "author_count": 1}, {"id": "2606.16547", "category": "hep-th", "title": "Self-gravitating electromagnetic waves in the dark bubble model", "abstract": "We construct embeddings of gravitational and electromagnetic waves in the dark bubble scenario using pp-wave geometries in AdS5, motivated by the fact that pp-wave spacetimes often provide exact solutions to the equations of motion. The setup is realised by gluing two AdS5 pp-wave spacetimes across a three-brane. As an application, we analyse localised beams of light and their gravitational backreaction. Imposing suitable mixed boundary conditions in AdS5, we find gravitational corrections consistent with a weakening of 4d gravity at the 5d AdS scale.", "url": "https://arxiv.org/abs/2606.16547", "type": "理论", "summary": "1. 该工作利用AdS5中pp-wave几何的精确解，通过三膜胶合构造了暗气泡模型中自引力电磁波的非平庸嵌入。\n2. 其核心在于采用混合边界条件分析局域光束的引力反作用，自洽处理了引力与电磁波耦合并导出修正场方程。\n3. 所得引力修正表明4维引力在5维AdS尺度处弱化，为额外维引力在光传播中的可观测效应提供了量化预言。", "summary_source": "deepseek", "authors": [{"name": "Ulf Danielsson"}, {"name": "Daniel Panizo"}, {"name": "Vincent Van Hemelryck"}], "featured_authors": [{"name": "Ulf Danielsson"}, {"name": "Daniel Panizo"}, {"name": "Vincent Van Hemelryck"}], "author_count": 3}, {"id": "2606.16630", "category": "hep-th", "title": "The supergravity dual of a finite duality cascade", "abstract": "This proceedings contribution summarizes the main results of the original paper arXiv:2506.18988 . Cascading RG flows are characteristic of $\\mathcal{N}=1$ gauge theories realized by D3-branes probing singularities in the presence of fractional branes. A celebrated example is the Klebanov-Strassler model, which exhibits an infinite cascade that ends with confinement. In this work, we explore a related setup where the addition of an orientifold plane modifies the cascade structure: the RG flow now consists of a finite number of steps, originating from a UV fixed point with a finite number of degrees of freedom. We provide a supergravity solution dual to this flow, that reproduces all its salient features.", "url": "https://arxiv.org/abs/2606.16630", "type": "理论", "summary": "1. 该工作构建了有限对偶级联的超引力对偶解，描述了Orientifold平面修改下的RG流。\n2. 其核心在于RG流步数有限且源自有限自由度的紫外固定点，超引力解完整复现了级联特征。\n3. 这为探索具有自动终止机制的级联规范理论及其全息对偶提供了具体实现，并可能启发对有限级联现象的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Pietro Moroni"}], "featured_authors": [{"name": "Pietro Moroni"}], "author_count": 1}, {"id": "2606.16640", "category": "hep-th", "title": "Holographic study of heavy quark potential, free energy, and running coupling in backgrounds with broken translational symmetry", "abstract": "We study heavy-quark observables including static interquark potential, thermal free energy and running coupling via a five-dimensional asymptotically AdS spacetime with translational symmetry breaking (TSB). The Einstein-Maxwell-axion geometry involves two scales: chemical potential $\\mu$ for finite baryon density, and TSB parameter $\\beta$ for momentum relaxation. Numerical simulations at finite and zero temperature reveal that both $\\mu$ and $\\beta$ weaken color interactions and facilitate quarkonium dissociation in strongly coupled quark-gluon plasmas through different mechanisms. The chemical potential dominates color screening and modifies the heavy-quark potential and running coupling, while $\\beta$ mainly affects plasma entropy and corrects thermal free energy. At zero temperature, thermal contributions vanish, and the renormalized free energy becomes a medium-modified static potential with an approximate Coulombic form. Finite baryon density suppresses $Q\\bar{Q}$ binding much more strongly than momentum dissipation at all temperatures. We extract the color screening length and dissociation scale, and discuss phenomenological implications for quarkonium in heavy-ion collisions. This work clarifies medium correction mechanisms for color interactions and thermodynamics, and presents a consistent picture for heavy-quark probes in dense dissipative plasmas.", "url": "https://arxiv.org/abs/2606.16640", "type": "理论", "summary": "1. 该工作通过五维渐近AdS时空的全息模型，系统地研究了平移对称性破缺背景下重夸克势、热自由能与跑动耦合的介质修正。\n2. 其核心发现在于化学势主导屏蔽并抑制夸克偶素束缚，而动量弛豫参数主要修正等离子体熵和自由能，两者在重子稠密耗散等离子体中以不同机制削弱色相互作用。\n3. 这为重离子碰撞中夸克偶素解离的动力学校正提供了清晰理论图像，并为相关现象学模型和实验分析指明方向。", "summary_source": "deepseek", "authors": [{"name": "Wenxing Cheng"}, {"name": "Zi-qiang Zhang"}], "featured_authors": [{"name": "Wenxing Cheng"}, {"name": "Zi-qiang Zhang"}], "author_count": 2}, {"id": "2606.16714", "category": "hep-th", "title": "On the Representation Theory of Non-Admissible $W$-Algebras: Part I", "abstract": "Motivated by the mirror symmetry for circle compactified 4d $N=2$ theories, we propose a geometric framework for studying the representation theory of non-admissible $W$-algebras $W^{k}(\\mathfrak g,f)$ at levels $k=-h^\\vee+\\frac{1}{n}\\frac{m}{u}$, using the geometry of generalized affine Springer fibers $Sp_{\\nu}(\\tilde{g},f)$ with slope $\\nu=u/m$. The central proposal is that each non-empty $C^*$-fixed locus, labeled by a double coset $\\tilde w\\in W_\\nu\\backslash\\tilde{W}/W_f$, gives rise to simple modules whose highest weight is determined by the map $\\tilde w\\mapsto\\tilde w(k\\Lambda_0+\\tilde\\rho)-\\tilde\\rho$, while the dimension of the fixed variety encodes additional non-semisimple structure (logarithmic modules). We verify this correspondence in numerous examples, including $D_4$, $E_6$, $E_8$, and twisted theories of type $^3D_4$ and $^2A_3$, where our geometric counting reproduces known results for both admissible and non-admissible $W$-algebras.", "url": "https://arxiv.org/abs/2606.16714", "type": "理论", "summary": "1. 该工作受圆紧化4d N=2理论镜像对称启发，利用斜率为ν=u/m的广义仿射Springer纤维几何，为能级k=−h∨+m/(nu)的非允许W-代数构建了表示论框架。\n2. 核心在于将标定自双陪集W̃∈Wν\\W̃/Wf的每个非空C*不动点集与简单模对应，其最高权重由映射W̃→W̃(kΛ0+ρ̃)−ρ̃决定，且不动簇维度编码非半单对数模结构。\n3. 该对应在D4、E6、E8及扭理论3D4、2A3等大量例子中得以验证并复现已知结果，为非允许W-代数的几何表示论及其与镜像对称的深入衔接奠定了关键基础。", "summary_source": "deepseek", "authors": [{"name": "Dan Xie"}], "featured_authors": [{"name": "Dan Xie"}], "author_count": 1}, {"id": "2606.16716", "category": "hep-th", "title": "Effective Lifshitz-Born-Infeld black holes from general covariance breaking", "abstract": "In this work we present an effective Lifshitz black hole solution with Born-Infeld electrodynamics and explore some of its properties. We discuss the mechanism for capturing the solution, achieved through diffeomorphism invariance breaking, study the emergent causal structure, and analyze aspects of critical behavior and local stability in the associated thermodynamics.", "url": "https://arxiv.org/abs/2606.16716", "type": "理论", "summary": "1. 该工作通过破缺微分同胚不变性构建了含Born-Infeld电动力学的有效Lifshitz黑洞精确解。\n2. 其物理核心在于破缺机制导致的因果结构变化，以及热力学临界行为与局域稳定性的关联分析。\n3. 这一构造为研究协变性破缺框架下的修改引力理论及其全息对偶提供了可解析处理的模型。", "summary_source": "deepseek", "authors": [{"name": "D. C. Moreira"}, {"name": "A. S. Lemos"}, {"name": "F. A. Brito"}], "featured_authors": [{"name": "D. C. Moreira"}, {"name": "A. S. Lemos"}, {"name": "F. A. Brito"}], "author_count": 3}, {"id": "2606.16745", "category": "hep-th", "title": "Effective Goldstone dynamics on cosmological space-times", "abstract": "We derive the Lehmann-Symanzik-Zimmermann reduction formalism for a massive spin-2 particle on Minkowski spacetime and extend the formalism to cosmological spacetimes. The reduction formalism allows for a versatile proof that the Goldstone boson equivalence theorem holds in Friedmann-Lemaître-Robertson-Walker space-times. For the de Sitter and the radiation filled universe, we investigate the Goldstone dynamics and perform an analysis of the range of validity provided by the effective kinetic operator.", "url": "https://arxiv.org/abs/2606.16745", "type": "理论", "summary": "1. 该工作推导了闵可夫斯基时空中大质量自旋-2粒子的LSZ约化形式，并将其推广至一般宇宙学时空中。\n2. 其核心在于利用该形式严格证明Goldstone玻色子等价定理在FLRW时空成立，并分析了de Sitter和辐射主导宇宙中有效动力学算符的适用范围。\n3. 这为宇宙学背景下引力子与Goldstone模的等效动力学提供了形式化工具，并对早期宇宙及暴胀模型的微扰分析给出定性指导。", "summary_source": "deepseek", "authors": [{"name": "Marc Schneider"}], "featured_authors": [{"name": "Marc Schneider"}], "author_count": 1}, {"id": "2606.16857", "category": "hep-th", "title": "Flux Quantization on 10D Type IIA Superspace via Cyclification from 11D", "abstract": "We produce the dimensional reduction to 10D IIA supergravity (SuGra), via cyclification, of the remarkable result that full 11D SuGra is put on shell just by imposing the duality-symmetric Bianchi identities on C-field super-flux densities over supertorsion-free superspace. Generally, we highlight that when duality-symmetric superspace Bianchi identities are characterized by Whitehead bracket $L_\\infty$-algebras $\\mathfrak{l}\\mathcal{A}$ of a classifying space $\\mathcal{A}$, their dimensional reduction is characterized by the cyclic loop space $\\mathrm{Cyc}(\\mathcal{A})$. We promote this to a general mechanism of dimensional reduction on super-spacetime, compatible with the global (infrared) completion of supergravity theories by flux quantization in non-abelian cohomology with coefficients in $\\mathcal{A}$ and $\\mathrm{Cyc}(\\mathcal{A})$, respectively. In the case of 11D SuGra, the characteristic $L_\\infty$-algebra is $\\mathfrak{l}S^4$ and hence we obtain that full on-shell 10D IIA SuGra is equivalent to $\\mathfrak{l}\\mathrm{Cyc}(S^4)$-Bianchi imposed identities on NS/RR super-flux densities over supertorsion-free 10D super-spacetime. This implies that any space which is $\\mathbb{R}$-rationally equivalent to $\\mathrm{Cyc}(S^4)$ classifies an admissible flux quantization law, which provides a global completion of 10D IIA SuGra that admits oxidation to 11D.", "url": "https://arxiv.org/abs/2606.16857", "type": "理论", "summary": "1. 该工作通过循环化从11维超引力约化出10维IIA超引力全在壳条件，等价于超挠自由超空间上NS/RR超通量密度满足lCyc(S^4)-Bianchi恒等式。\n2. 核心卖点在于将维度约化刻画为分类空间循环环Cyc(A)的L∞代数结构，与基于非阿贝尔上同调的通量量子化全局完备化相容。\n3. 这暗示任何与Cyc(S^4)有理等价的拓扑空间均可定义可氧化到11维的10维IIA超引力通量量子化律，提供红外完备化机制。", "summary_source": "deepseek", "authors": [{"name": "Grigorios Giotopoulos"}, {"name": "Hisham Sati"}], "featured_authors": [{"name": "Grigorios Giotopoulos"}, {"name": "Hisham Sati"}], "author_count": 2}, {"id": "2606.16911", "category": "hep-th", "title": "Quantum gravity and spectral running cutoff", "abstract": "We have recently shown that a natural way to implement the Wilsonian paradigm in gauge theories is through the introduction of a ``spectral cutoff\", a cut on the eigenvalues of the covariant Laplacian, pointing out that this provides the route toward the renormalization group (RG) construction. Here we apply this idea to quantum gravity, resorting to two realizations of the spectral running cutoff: ``hard\" and ``smooth\". We derive the RG equations for the Newton and cosmological constant and find the RG pattern of the asymptotic safety scenario, with a non-Gaussian UV-attractive fixed point.", "url": "https://arxiv.org/abs/2606.16911", "type": "理论", "summary": "1. 本文将谱截断重整化群方法应用于量子引力，通过截断协变拉普拉斯算符本征值实现威尔逊范式。\n2. 其技术关键在于同时采用“硬”与“光滑”两种谱截断实现，推导出牛顿常数与宇宙学常数的RG方程，并再现了渐近安全场景的非高斯紫外吸引固定点。\n3. 这为量子引力的重整化群构造提供了具体实现路径，并可能推动对引力紫外完备性的进一步解析与数值研究。", "summary_source": "deepseek", "authors": [{"name": "Carlo Branchina"}, {"name": "Vincenzo Branchina"}, {"name": "Filippo Contino"}, {"name": "Riccardo Gandolfo"}, {"name": "Arcangelo Pernace"}], "featured_authors": [{"name": "Carlo Branchina"}, {"name": "Vincenzo Branchina"}, {"name": "Filippo Contino"}, {"name": "Riccardo Gandolfo"}, {"name": "Arcangelo Pernace"}], "author_count": 5}, {"id": "2606.16986", "category": "hep-th", "title": "The black hole at the end of the cone: localizing the anomaly polynomial on toric geometries", "abstract": "We consider five-dimensional supergravity coupled to vector multiplets, gauged or ungauged, and propose an efficient method to evaluate the on-shell action of supersymmetric black saddle solutions with toric ${\\rm U}(1)^3$ symmetry and general topology, explicitly known or just assumed to exist, including higher-derivative corrections. This is equivalent to equivariant integration of the anomaly polynomial six-form over simplicial cones obtained by decomposing the toric diagram of the solution. The on-shell action is then expressed as a sum over contributions localized at the tip of each cone. We obtain a simple derivation of recently calculated expressions as well as new predictions, both for the on-shell action of the black saddles and the Wald entropy of the related extremal solutions. These may be asymptotically AdS$_5$ or asymptotically flat. As examples, we discuss black holes, black rings and black lenses, including a black hole in the background of a topological soliton.", "url": "https://arxiv.org/abs/2606.16986", "type": "理论", "summary": "1. 本工作提出了一种高效方法，通过将异常多项式六形式在解环面图的单纯锥分解上进行等变积分，评估五维超引力中带环面对称性超对称黑鞍座的壳上作用。\n2. 其核心在于将对偶解壳上作用表达为每个锥形尖端局域贡献之和，从而简化近期计算并推导出黑鞍座作用及极值解沃尔德熵的新预测。\n3. 该方法可泛化到多种拓扑的黑洞、黑环及黑透镜解（包括拓扑孤子背景中的黑洞），并适用于渐近AdS₅或平直时空。", "summary_source": "deepseek", "authors": [{"name": "Davide Cassani"}, {"name": "Enrico Turetta"}], "featured_authors": [{"name": "Davide Cassani"}, {"name": "Enrico Turetta"}], "author_count": 2}, {"id": "2606.17025", "category": "hep-th", "title": "Solutions in Liouville theory on dS and AdS backgrounds", "abstract": "We find exact solutions of a Liouville-type scalar field theory on $D$-dimensional de Sitter and anti-de Sitter backgrounds, treating the geometry as nondynamical. Using the embedding-space formalism with an auxiliary null vector, we derive first-order (Bäcklund-like) equations whose integrability yields the solution of the Liouville equation for the scalar field. This method produces two classes of analytic solutions, whose physical properties are different for de Sitter and anti-de Sitter spacetimes.", "url": "https://arxiv.org/abs/2606.17025", "type": "理论", "summary": "1. 该工作将几何视为非动力学背景，在D维de Sitter和anti-de Sitter时空上找到了Liouville型标量场理论的精确解析解。\n2. 其技术卖点在于利用嵌入空间形式主义与辅助零矢量，导出了Bäcklund型一阶可积方程，从而获得两类物理性质随时空曲率符号不同的显式解。\n3. 这为弯曲时空中非线性场论的可解结构提供了新范例，并对全息对偶与早期宇宙中的相关模型具启发意义。", "summary_source": "deepseek", "authors": [{"name": "Damir Sadekov"}], "featured_authors": [{"name": "Damir Sadekov"}], "author_count": 1}, {"id": "2606.14903", "category": "math-ph", "title": "A Reverse Hard-Core Model in $\\mathbb{A}_2$: an Application of the Pirogov-Sinai Theory", "abstract": "In this paper we use the Pirogov--Sinai theory to analyze a class of particle models of Statistical Mechanics on the unit triangular lattice $\\mathbb{A}_2$. The models are specified by two parameters: the particle activity $u\\in(0,1)$ and a positive Löschian number $t$ interpreted as a maximal squared clearing radius. Admissible configurations are those in which every empty lattice site has an occupied site within squared distance at most $t$, thereby forbidding empty disks of radius exceeding or equal $t$. The Hamiltonian favors configurations with as few occupied sites as possible, while the admissibility condition enforces a positive density of particles. We prove that the periodic ground states of the model, i.e., the configurations achieving an optimal balance of two tendencies, are the ones whose occupied sites form triangular sublattices of explicitly determined squared side-length $d_*(t)$. Furthermore, for sufficiently small values of the activity parameter $u$, some (but not necessarily all) periodic ground states generate extreme Gibbs (DLR) measures. We describe the resulting phase structure and characterize the pure phases associated with stable ground states.", "url": "https://arxiv.org/abs/2606.14903", "type": "理论", "summary": "1. 该文运用Pirogov-Sinai理论分析三角晶格上的逆向硬核模型，约束每个空格点须在平方距离t内有占据点，哈密顿量偏好少占据但约束迫使正粒子密度。\n2. 主要技术贡献在于证明周期基态为占据点构成特定边长d*(t)的三角子格子，并在小活动参数下证明部分基态生成极值Gibbs测度，刻画了稳定基态对应的纯相。\n3. 这为理解几何约束下的低密度粒子系统相变提供了严格框架，展示了Pirogov-Sinai理论在非传统硬核模型中的有效应用。", "summary_source": "deepseek", "authors": [{"name": "A. Mazel"}, {"name": "I. Stuhl"}, {"name": "Y. Suhov"}], "featured_authors": [{"name": "A. Mazel"}, {"name": "I. Stuhl"}, {"name": "Y. Suhov"}], "author_count": 3}, {"id": "2606.14913", "category": "math-ph", "title": "Structure-Informed Neural Operators for Long-Time Prediction of Parametric Hamiltonian PDEs", "abstract": "Hamiltonian partial differential equations (PDEs) often exhibit long-time dynamics governed by conserved quantities such as mass, momentum, and Hamiltonian energy. Standard Fourier neural operators (FNOs) provide efficient data-driven approximations of solution operators, but may not preserve these invariants during autoregressive rollout, and can develop drift in conserved quantities, phase error, and loss of qualitative accuracy. We propose an energy-projection Fourier neural operator (EP-FNO), a structure-informed operator learning architecture that combines a residual FNO time-stepping update with an invariant projection for long-time prediction of parametric Hamiltonian PDEs. We also provide a theoretical analysis showing that EP-FNO can approximate operators associated with PDEs efficiently, we also suggest a stability estimate. We evaluate the approach on the Zakharov--Kuznetsov, Kadomtsev--Petviashvili, and sine--Gordon equations. Numerical experiments show that the projected model improves long-time stability, and gives more accurate propagation of soliton and coherent wave structures compared with a standard FNO baseline. Our results demonstrate that invariant projection improves the reliability of learned surrogates for long-time Hamiltonian PDE simulation.", "url": "https://arxiv.org/abs/2606.14913", "type": "理论", "summary": "1. 该工作提出能量投影傅里叶神经算子(EP-FNO)，用于参数化哈密顿偏微分方程的长时间预测。\n2. 其核心在于将残差FNO时间推进与守恒量投影相结合，在理论上保证了近似效率与稳定性，数值上消除了长时间自回归滚动中的守恒量漂移与相误差。\n3. 这为学习型代理模型在保结构长时间哈密顿模拟中的可靠应用提供了明确路径与理论支撑。", "summary_source": "deepseek", "authors": [{"name": "Victory C. Obieke"}, {"name": "Christopher Chukwuemeka"}, {"name": "Emmanuel E. Oguadimma"}], "featured_authors": [{"name": "Victory C. Obieke"}, {"name": "Christopher Chukwuemeka"}, {"name": "Emmanuel E. Oguadimma"}], "author_count": 3}, {"id": "2606.14952", "category": "math-ph", "title": "Dynamic Doppler Effects on Dirac Spinor Fields", "abstract": "We derive the dynamic Doppler effects of noninertial observer motion on Dirac spinor fields, characterizing how proper acceleration, proper jerk, observer path curvature, torsion, and hyper-torsion modify the inertial quantum description of free particles. We quantify the nonlinear behavior of the amplitude and phase of the Dirac spinor wave field and isolate the spin-induced signatures that have no counterpart in the scalar Klein-Gordon field. For worldlines with constant proper jerk the amplitude scales super-exponentially as $\\exp(j_0\\tau^2/4)$. The complex Frenet-Serret curvature invariants generate both an exponential amplitude factor and a spin-induced phase factor. Spinor structure therefore produces an observable dynamic Doppler signature distinct from any scalar prediction.", "url": "https://arxiv.org/abs/2606.14952", "type": "理论", "summary": "1. 该工作推导了非惯性观测者运动对狄拉克旋量场的动态多普勒效应，量化了固有加速度、急动度及路径曲率等对振幅与相位的非线性修正。\n2. 其核心卖点在于揭示复Frenet-Serret曲率不变量产生指数振幅因子与自旋诱导相位因子，该旋性特征在标量Klein-Gordon场中无对应。\n3. 这为在相对论性量子系统中区分旋量与标量场的动态多普勒信号提供了可观测的物理判据，并对量子引力与相对论量子信息具有启示。", "summary_source": "deepseek", "authors": [{"name": "Bryce M. Barclay"}, {"name": "Alex Mahalov"}], "featured_authors": [{"name": "Bryce M. Barclay"}, {"name": "Alex Mahalov"}], "author_count": 2}, {"id": "2606.15039", "category": "math-ph", "title": "On the Non-Commutative Geometry of the Electroweak Interaction", "abstract": "In differential geometry, the underlying mathematical structure behind the electroweak theory is a trivial principal $(SU(2)\\times U(1))$--bundle over $\\R^4$ with the Minkowski metric. The aim of this paper is to show that, using non--commutative geometry, the electroweak theory can be described using a trivial quantum principal $SU(2)$--bundle over $C^\\infty_\\C(\\R^4)$ with the Minkowski metric.", "url": "https://arxiv.org/abs/2606.15039", "type": "理论", "summary": "1. 该工作利用非交换几何将电弱相互作用重新表述为闵可夫斯基时空上平凡的量子主SU(2)丛。\n2. 其核心在于用非交换几何框架取代经典微分几何中的主(SU(2)×U(1))丛，实现了电弱理论的非交换几何统一描述。\n3. 这为将非交换几何方法推广至标准模型其他部分提供了严格的数学基础与概念启发。", "summary_source": "deepseek", "authors": [{"name": "Gustavo Amilcar Saldaña Moncada"}], "featured_authors": [{"name": "Gustavo Amilcar Saldaña Moncada"}], "author_count": 1}, {"id": "2606.15235", "category": "math-ph", "title": "The Standard Model Gauge Group from the Exceptional Jordan Algebra", "abstract": "We construct the Standard Model gauge group using the exceptional Jordan algebra $\\mathfrak{h}_3(\\mathbb{O})$ and its automorphism group $\\text{F}_4$. The group $\\text{F}_4$ acts on pairs of Jordan subalgebras $X \\subset B \\subset \\mathfrak{h}_3(\\mathbb{O})$ with $X \\cong \\mathfrak{h}_2(\\mathbb{C})$ and $B \\cong \\mathfrak{h}_3(\\mathbb{C})$, and for any such pair the stabilizer of $X$ intersected with the identity component of the stabilizer of $B$ is isomorphic to the Standard Model gauge group. Since $\\mathfrak{h}_2(\\mathbb{C})$ is the Jordan algebra of observables of a qubit and $\\mathfrak{h}_3(\\mathbb{C})$ is the Jordan algebra of observables of a qutrit, we could say $\\mathfrak{h}_3(\\mathbb{O})$ is the Jordan algebra of observables of an 'octonionic qutrit'. In this language our result says roughly that the Standard Model gauge group is the group of symmetries of an octonionic qutrit that restrict to act as unitary operators on an ordinary qutrit and, within that, a qubit.", "url": "https://arxiv.org/abs/2606.15235", "type": "理论", "summary": "1. 该工作运用例外Jordan代数h₃(O)及其自同构群F₄，通过子代数对的稳定子构造出标准模型规范群。\n2. 其核心在于将标准模型规范群视为八元数三能级系统的对称性限制到普通三能级与两能级子代数的结果。\n3. 这为理解规范群与例外结构的关系提供了代数新路径，并可能启发量子信息与高能物理的交叉探索。", "summary_source": "deepseek", "authors": [{"name": "John C. Baez"}, {"name": "Paul Schwahn"}], "featured_authors": [{"name": "John C. Baez"}, {"name": "Paul Schwahn"}], "author_count": 2}, {"id": "2606.15538", "category": "math-ph", "title": "Generalized symmetries, invariant solutions and conservation laws in the Jaynes-Cummings model", "abstract": "In this work, we investigate the Jaynes--Cummings model (JCM) using Lie symmetry analysis and conservation-law theory. The dynamics is formulated as a system of partial differential equations by projecting the von Neumann equation onto the atomic degrees of freedom and representing the field mode through its characteristic function. We determine the admitted point and generalized symmetries and construct invariant solutions satisfying the physical conditions imposed by quantum mechanics. The conventional dressed-state dynamics is recovered while a second class of solutions with radial dependence expressed through Heun polynomials is obtained for coupled atom--field configurations. We also apply the generating functions methodology to derive local conservation laws of the JCM differential system. Besides recovering the conservation of the total number of excitations, we obtain additional conserved currents involving atomic populations, coherence, reduced-state purity, and moments of the field characteristic function. In particular, we derive a balance equation for a combination of atomic purity and coherence whose evolution is controlled by the atom--field coupling and is linked to atom--field correlation and entanglement dynamics. The symmetry structure further generates generalized symmetries and an infinite hierarchy of conservation laws.", "url": "https://arxiv.org/abs/2606.15538", "type": "理论", "summary": "1. 该工作利用李对称分析与守恒律理论，将Jaynes-Cummings模型动力学表述为原子自由度与场特征函数的偏微分方程组。\n2. 其卖点在于获得第二类含Heun多项式的径向依赖解析解，并推导出涉及原子纯度和相干性平衡的额外守恒流，该流由原子-场耦合控制且关联纠缠动力学。\n3. 对称结构生成了广义对称性与无穷阶守恒律，为揭示光-物质相互作用模型中可积结构与纠缠动力学的深层联系提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Luis M. Piñuelas"}, {"name": "Pablo C. López Vázquez"}, {"name": "Alexander Yakhno"}], "featured_authors": [{"name": "Luis M. Piñuelas"}, {"name": "Pablo C. López Vázquez"}, {"name": "Alexander Yakhno"}], "author_count": 3}, {"id": "2606.15616", "category": "math-ph", "title": "A High-Order Nyström Method for Coupled Boundary Integral Equations in Oblique-Incidence Scattering by Impedance Cylinders", "abstract": "We study the numerical solution of electromagnetic scattering by an infinitely long impedance cylinder under oblique incidence. After separation of the axial phase factor, the axial electric and magnetic components satisfy a pair of coupled two-dimensional Helmholtz equations. The Leontovich impedance condition couples these components through tangential derivatives, and the associated boundary integral system contains both logarithmic kernels and principal-value tangential derivative terms. Building on existing coupled integral-equation formulations for oblique-incidence cylinder scattering, we construct a high-order Nystrom implementation based on Kress-type logarithmic kernel decomposition, periodic product quadrature, Fourier differentiation for the tangential derivative contribution, and a block diagonal preconditioner associated with the scalar impedance subproblem. Under uniqueness of the continuous scattering problem and a uniform discrete stability assumption, we formulate a high-order convergence framework for the boundary densities and far-field patterns. Numerical experiments include a manufactured Fourier-Bessel benchmark, a plane-wave circular-cylinder validation, a smooth non-circular boundary test, condition-number and GMRES comparisons, and a variable-impedance scattering-width reduction example in a prescribed backward angular sector. The results indicate that the method provides a stable high-accuracy forward solver for the coupled impedance system, rather than a new physical model.", "url": "https://arxiv.org/abs/2606.15616", "type": "理论", "summary": "1. 该工作针对斜入射无限长阻抗柱体的电磁散射问题，发展了基于耦合边界积分方程的高阶Nyström数值求解方法。\n2. 其技术核心在于采用Kress型对数核分解与傅里叶微分精确处理切向导数耦合项，并通过块对角预条件子保证离散系统的稳定性与收敛性。\n3. 该方法为阻抗边界条件下电磁散射提供高精度正向求解器，可拓展至更复杂几何与入射极化情形下的数值研究。", "summary_source": "deepseek", "authors": [{"name": "Haochen Liu"}, {"name": "Qinghao Yu"}], "featured_authors": [{"name": "Haochen Liu"}, {"name": "Qinghao Yu"}], "author_count": 2}, {"id": "2606.15791", "category": "math-ph", "title": "Flowing to Normality and the Fate of the Single Ring Theorem", "abstract": "Random non-hermitian matrix ensembles with double-sided rotation invariance obey, in the limit of large matrix size, the Single Ring Theorem, which states that the support of the mean eigenvalue distribution in the complex plane is either a disk or an annulus. In contrast, rotational-invariant random normal matrix ensembles can have mean eigenvalue densities supported over any number of concentric annuli in the complex plane. In this paper we introduce and investigate, both analytically and numerically, a non-hermitian matrix model which flows from a generic matrix distribution obeying the Single Ring Theorem to a distribution of normal matrices by tuning a parameter which penalizes non-normality. We observe numerically breakdown of the Single Ring Theorem as the model flows towards normality, and determine the critical value of the parameter at which the transition occurs. We also study in detail the behavior of the singular values of these matrices under the flow. These singular values form a Fermi gas confined to the positive half-line. In particular, we find that at small values of the flow parameter, the interparticle spacings in the gas exhibit Wigner-Dyson repulsion, whereas for asymptotically large values of the flow parameter, at the normal matrix endpoint of the flow, the spacing statistics is Poissonian. The flow interpolates continuously between these two types of statistics. However, this change in statistics is not related directly to breaking of the Single Ring Theorem, which occurs very early-on along the flow, in the regime of Wigner-Dyson statistics. Finally, we introduce a certain ensemble of random permutations associated with the gas, and make a conjecture on how to use it in order to reconstruct approximately the average density of complex eigenvalues from that of the singular values in the large-$N$ limit.", "url": "https://arxiv.org/abs/2606.15791", "type": "理论", "summary": "1. 该工作引入并研究了一个通过调节惩罚非正态性参数从满足单环定理的分布流向正态矩阵的非厄米随机矩阵模型。\n2. 其核心发现是单环定理在流参数很小、奇异值间距仍呈Wigner-Dyson排斥时即被破坏，而间距统计随后连续过渡到Poisson型。\n3. 这为利用关联的随机排列系综从奇异值密度近似重构大N极限下复特征值密度提供了可行猜想。", "summary_source": "deepseek", "authors": [{"name": "Joshua Feinberg"}, {"name": "Roman Riser"}, {"name": "Richard Scalettar"}, {"name": "Anthony Zee"}], "featured_authors": [{"name": "Joshua Feinberg"}, {"name": "Roman Riser"}, {"name": "Richard Scalettar"}, {"name": "Anthony Zee"}], "author_count": 4}, {"id": "2606.15895", "category": "math-ph", "title": "N-transform and factorization of the DN-map", "abstract": "Let $(\\Omega,g)$ be a smooth compact 3D Riemannian manifold with the smooth boundary $\\Gamma$, $\\tau(x):={\\rm dist\\,}(x,\\Gamma)$, $x\\in\\Omega$; $\\Omega^\\tau:=\\{x\\in\\Omega\\,|\\,\\,{\\rm dist\\,}(x,\\Gamma)<\\tau$\\}, $\\Gamma^\\tau:=\\{x\\in\\Omega\\,|\\,\\,{\\rm dist\\,}(x,\\Gamma)=\\tau$\\}, $\\tau\\geqslant 0$. For the sake of technical simplicity, we deal with $\\Omega$ diffeomorphic to a ball in $\\Bbb R^3$. Let $\\mathscr P:=\\{\\nabla p\\,|\\,\\,p\\in H^1(\\Omega)\\}$ be the space of the potential vector fields, and let $\\mathscr L_\\lambda:=\\{\\varkappa\\nabla\\tau\\,|\\,\\,\\varkappa\\in L_2(\\Omega)\\}$ be the space of the vector fields parallel to $\\nabla\\tau$. The N-transform is a map from $\\mathscr P$ to $\\mathscr L_\\lambda$ defined layer-wise (in accordance with $\\Omega=\\cup_{\\tau\\geqslant 0}\\Gamma^\\tau$) by $$ Nh\\,\\big|_{\\Gamma^\\tau}:=(P^\\tau h)\\big|_{\\Gamma^{\\tau-0}}, \\qquad\\tau>0, $$ where $P^\\tau$ are the projections in $\\mathscr P$ onto the subspaces $\\mathscr P^\\tau:=\\{h\\in\\mathscr P\\,|\\,\\,{\\rm supp\\,}h\\subset\\overline{\\Omega^\\tau}\\}$. We show that $N$ is a unitary operator. Let $p=p^f(x)$ be a solution to the Dirichlet problem: $\\Delta_g p=0$ in $\\Omega\\setminus\\Gamma$, $p=f$ on $\\Gamma$. The DN-map $\\Lambda$ is defined by $\\Lambda f:=-\\langle\\nabla p^f,\\nabla\\tau\\rangle$ on $\\Gamma$. We show that the N-transform provides a certain factorization $\\Lambda^{-1}=V^*V$ and discuss its possible usefulness for determination of $(\\Omega,g)$ from $\\Lambda$.", "url": "https://arxiv.org/abs/2606.15895", "type": "理论", "summary": "1. 该工作在光滑紧致且微分同胚于三维球的黎曼流形上，利用到边界的距离函数定义了将势向量场逐层投影至平行于距离梯度向量场空间的N-变换，并由此给出DN映射逆的分解。\n2. 其核心数学贡献是证明N-变换为酉算子，从而将DN映射逆因子化为Λ⁻¹=V*V，这一分解直接关联边界数据与内部度量结构。\n3. 该分解为从边界DN映射反演流形几何提供了新的代数框架，有望在几何反问题及地球物理成像等领域推动解析工具与数值方法的发展。", "summary_source": "deepseek", "authors": [{"name": "M.I.Belishev"}, {"name": "D.V.Korikov"}], "featured_authors": [{"name": "M.I.Belishev"}, {"name": "D.V.Korikov"}], "author_count": 2}, {"id": "2606.15916", "category": "math-ph", "title": "A generalized Stieltjes system with polynomial source", "abstract": "Let $Q$ be a monic polynomial of degree $M+1$. We study the algebraic system \\[ \\sum_{j\\ne i}\\frac{1}{x_i-x_j}=Q(x_i),\\qquad i=1,\\ldots,N, \\] for pairwise distinct complex numbers $x_1,\\ldots,x_N$, modulo permutations of these numbers. The case $M=0$ is, after a translation, the classical Stieltjes system for the zeros of a Hermite polynomial. We prove that, for arbitrary $Q$, the number of solutions is at most $\\binom{N+M}{N}$, and that the coefficient equations for the associated monic Stieltjes polynomial have total intersection multiplicity exactly $\\binom{N+M}{N}$. Consequently the bound is attained for all $Q$ in a non-empty Zariski open subset of the affine space of monic polynomials of degree $M+1$. We also describe the solutions when the coefficient of the linear term of $Q$ is large: the system splits into $M+1$ weakly coupled classical Stieltjes systems, one near each zero of $Q$.", "url": "https://arxiv.org/abs/2606.15916", "type": "理论", "summary": "1. 该工作研究了带首一多项式源的广义Stieltjes系统，证明了复数解数的组合上界并刻画了其可达性。\n2. 其核心技术在于将解数问题转化为伴随Stieltjes多项式系数方程的总交点重数计数，得到精确的binom(N+M, N)上界。\n3. 这为经典Stieltjes系统的高阶推广及大参数下的解耦行为提供了代数几何框架，启发可积系统与正交多项式理论的交叉研究。", "summary_source": "deepseek", "authors": [{"name": "D.Masoero"}, {"name": "B.Shapiro"}], "featured_authors": [{"name": "D.Masoero"}, {"name": "B.Shapiro"}], "author_count": 2}, {"id": "2606.16441", "category": "math-ph", "title": "$q$-Deformed Topological Recursion, Weight Vectors and Algebraic Structures", "abstract": "We investigate a $q$-deformation of the shifted topological recursion, extending the construction of Belliard-Bouchard-Kramer-Nelson to the context of quantum algebras. Through the study of highest weight vectors in $q$-deformed of $\\mathcal{W}$-algebra representations, we derive a $q$-analogue of the topological recursion and show it yields $q$-deformed quantum curves. This framework unifies various approaches to quantum integrability and provides new insights into the geometry of $q$-deformed moduli spaces.", "url": "https://arxiv.org/abs/2606.16441", "type": "理论", "summary": "1. 本文通过研究量子代数框架下q-形变移位拓扑递归，将Belliard-Bouchard-Kramer-Nelson构造推广至q-形变情形。\n2. 其核心在于利用q-形变W-代数表示中的最高权向量，导出拓扑递归的q-类似物，并由此构建q-形变量子曲线。\n3. 该工作统一了多种量子可积性途径，并为q-形变模空间的几何机制和代数结构提供了新的理解视角。", "summary_source": "deepseek", "authors": [{"name": "Fridolin Melong"}, {"name": "Raimar Wulkenhaar"}], "featured_authors": [{"name": "Fridolin Melong"}, {"name": "Raimar Wulkenhaar"}], "author_count": 2}, {"id": "2606.16660", "category": "math-ph", "title": "Boundary monopole bubbling and Macdonald kernels for non-minuscule 't Hooft lines in $\\mathcal N=4$ SYM", "abstract": "We study half-BPS boundary 't Hooft lines of non-minuscule magnetic charge in four-dimensional $\\mathcal N=4$ $U(N)$ super Yang--Mills theory with the regular Nahm-pole boundary condition. In contrast to minuscule charges, non-minuscule boundary 't Hooft lines receive monopole bubbling contributions. For all one-row charges $\\lambda=(r,0,\\ldots,0)$ we compute the bubbling-corrected defect half-index and identify the boundary 't Hooft operator with the spherical DAHA element $\\mathbf e h_r(Y)\\mathbf e$. Its difference-operator expansion gives the screened magnetic sectors, while the Macdonald kernel proves equality with the S-dual Neumann Wilson-line half-index. As a consequence we obtain the identity for all dominant magnetic charges of $U(2)$. The boundary fixed-point formula realizes the same coefficients and gives explicit non-minuscule examples in ranks two and three.", "url": "https://arxiv.org/abs/2606.16660", "type": "理论", "summary": "1. 该工作计算了四维\\(\\mathcal N=4\\) \\(U(N)\\)超杨-米尔斯理论中非微小磁荷边界't Hooft线的单极子冒泡修正半指标，采用规则Nahm-pole边界条件。\n2. 其卖点在于将边界't Hooft算子等同于球面DAHA元素\\(\\mathbf e h_r(Y)\\mathbf e\\)，借助Macdonald核证明其与S对偶的Neumann Wilson线半指标等同，并通过差分算子展开得到屏蔽磁扇区。\n3. 这一结果为所有\\(U(2)\\)主导磁荷建立了精确恒等式，边界不动点公式自然再现相同系数，并给出了秩二和三中的显式非微小例子，为推广到更高秩和更一般磁荷提供了路径。", "summary_source": "deepseek", "authors": [{"name": "Ruiliang Li"}], "featured_authors": [{"name": "Ruiliang Li"}], "author_count": 1}, {"id": "2606.16737", "category": "math-ph", "title": "The Algebra of Units: From Buckingham's Pi-grec Theorem to Latent-Variable Learning", "abstract": "Engineers often measure many quantities-speed, pressure, temperature, length-expressed in different physical units. The Buckingham Pi-grec theorem states that these variables can always be combined into a smaller set of dimensionless numbers whose values fully determine the system's behaviour. Identifying the appropriate dimensionless groups has traditionally required expert knowledge and physical insight. This paper shows that they can instead be discovered automatically from data, without prior knowledge of the governing physics. The key observation is that, after logarithmic transformation, measurements collected under different scalings of the same system lie on a low-dimensional manifold whose geometry is determined by the underlying dimensionless groups. Singular value decomposition (SVD) identifies this manifold directly from data. A subsequent search over integer-exponent combinations recovers candidate dimensionless quantities, while a repeating-variable filter retains only those constructed from the machine's characteristic scales. This procedure recovers familiar engineering groups, including the flow coefficient, head coefficient, and Mach number, while excluding equivalent but less interpretable alternatives. The method is demonstrated on a synthetic compressor dataset containing 16,000 measurements. Starting from raw dimensional variables and no physics input, it recovers the correct dimensionless groups to numerical precision and reproduces the compressor performance map with an error below 0.01%. More broadly, the work reveals a close connection between classical dimensional analysis and modern data-driven learning. Both rely on the same underlying algebraic structure, suggesting new approaches for building physical models that are simultaneously interpretable, scalable, and data-efficient.", "url": "https://arxiv.org/abs/2606.16737", "type": "理论", "summary": "1. 该工作通过将对数变换后的数据流形进行奇异值分解，提出了一种无需物理先验即可自动发现Buckingham Pi定理所预言的无量纲群的方法。\n2. 其核心技术在于结合重复变量过滤器筛选出由系统特征尺度构成的物理可解释无量纲量，并在合成压缩机数据集（16000样本）上实现性能图重建误差低于0.01%。\n3. 这揭示了经典量纲分析与潜在变量学习共享同一代数结构，为构建兼具可解释性、可扩展性与数据效率的物理模型提供了新范式。", "summary_source": "deepseek", "authors": [{"name": "Mauro Valorani"}], "featured_authors": [{"name": "Mauro Valorani"}], "author_count": 1}, {"id": "2606.16947", "category": "math-ph", "title": "Self-Adjointness of the Standard Model of Non-Relativistic QED", "abstract": "For systems of non-relativistic charged particles minimally coupled to the soft modes of the quantized radiation field, we prove self-adjointness on the domain of the free Hamiltonian. This result is not new, but the proof we give shortens previous arguments. It is based on a comparison of graph norms and Nelson's commutator theorem.", "url": "https://arxiv.org/abs/2606.16947", "type": "理论", "summary": "1. 该工作证明了非相对论性量子电动力学标准模型中，与量子化辐射场软模最小耦合的带电粒子系统在自由哈密顿量定义域上是自伴的。\n2. 其技术卖点在于利用图范数比较和Nelson交换子定理，大幅缩短了关于该自伴性的已有证明过程。\n3. 这一简化证明为量子电动力学数学基础的严谨分析提供了更高效的工具，并可能推广至其他含耦合场的量子系统。", "summary_source": "deepseek", "authors": [{"name": "Valentin Kußmaul"}], "featured_authors": [{"name": "Valentin Kußmaul"}], "author_count": 1}, {"id": "2606.14822", "category": "quant-ph", "title": "Quantum Machine Learning for Industrial Applications", "abstract": "Recent advances in Machine Learning have transformed numerous industrial sectors, yet classical paradigms face fundamental limitations: rapidly growing data volumes, rising computational costs, significant energy consumption, and the physical scaling limits of conventional hardware architectures. Quantum computing has emerged as a promising computational paradigm to address these challenges, giving rise to the field of Quantum Machine Learning (QML). In this thesis, the theoretical foundations of QML are investigated, with a focus on near-term and future practical applications. Three central challenges are addressed: the trainability of variational quantum circuits, their expressivity, and their resistance to efficient classical simulation. The trainability of Hamming-weight preserving variational quantum circuits is first studied, and theoretical guarantees are established that resolve an open conjecture on the absence of barren plateaus for this circuit family. Subspace-preserving QML algorithms are then introduced, including photonic circuits and quantum convolutional neural networks, and are designed to mimic classical ML subroutines while offering polynomial quantum advantage. Finally, variational quantum circuits are analyzed as quantum Fourier models, and a framework is derived to jointly characterize expressivity and trainability, from which conditions are obtained under which quantum models provably separate from their classical counterparts. These contributions are intended to advance the theoretical roadmap for harnessing near-term and future quantum technologies in real-world applications.", "url": "https://arxiv.org/abs/2606.14822", "type": "理论+数值", "summary": "1. 该工作系统研究了量子机器学习（QML）的理论基础，重点解决了变分量子电路的可训练性、表达性及抗经典模拟性三个核心挑战。\n2. 其关键创新包括：为汉明重量保持电路建立了无贫瘠高原的理论保证，引入子空间保持算法（光子电路与量子卷积神经网络）实现多项式量子优势，并借助量子傅里叶模型框架导出了量子模型与经典模型可证明分离的条件。\n3. 这为理解近期量子设备的计算能力边界、指导QML算法设计以及推动工业应用中的量子优势验证提供了理论路线图。", "summary_source": "deepseek", "authors": [{"name": "Léo Monbroussou"}], "featured_authors": [{"name": "Léo Monbroussou"}], "author_count": 1}, {"id": "2606.14847", "category": "quant-ph", "title": "High-fidelity two-qubit gates in a 7-qubit register for quantum networks", "abstract": "Quantum networks based on optically active solid-state spins may enable quantum technologies including long-range quantum communication and distributed quantum computing. Network nodes containing multiple high-fidelity qubits can facilitate large-scale fault-tolerant operation. However, the stringent error thresholds remain out of reach for multi-qubit registers. In this work, we demonstrate high-fidelity two-qubit gates in a 7-qubit register, based on nuclear spins coupled to a nitrogen-vacancy (NV) center in diamond. We analyze crosstalk in highly connected spin systems, develop an efficient optimization procedure, and characterize the gates using gate set tomography. The two-qubit gate fidelities (best: 99.61(5)%, average: 99.18(2)%) demonstrate a multi-qubit register at the threshold for distributed quantum computation. Finally, as an example application, we perform a variational quantum eigensolver (VQE) simulation of the ground-state energy of H2 and LiH molecules. These results demonstrate one of the key prerequisites for scalable quantum networks based on solid-state spins.", "url": "https://arxiv.org/abs/2606.14847", "type": "理论+数值", "summary": "1. 该工作在基于金刚石NV中心耦合核自旋的7量子比特寄存器中实现了高保真双量子比特门。\n2. 其核心在于通过串扰分析与高效优化程序，使门平均保真度达99.18%，达到分布式量子计算阈值。\n3. 这为固态自旋量子网络的可扩展容错操作及分子基态VQE模拟提供了关键前提。", "summary_source": "deepseek", "authors": [{"name": "Margriet van Riggelen"}, {"name": "Jiwon Yun"}, {"name": "H. Benjamin van Ommen"}, {"name": "Tim H. Taminiau"}], "featured_authors": [{"name": "Margriet van Riggelen"}, {"name": "Jiwon Yun"}, {"name": "H. Benjamin van Ommen"}, {"name": "Tim H. Taminiau"}], "author_count": 4}, {"id": "2606.14873", "category": "quant-ph", "title": "Finite-Element Matrix Product States for Continuum Models in One Dimension", "abstract": "We present a matrix product state framework for simulating one-dimensional quantum many-body systems in the continuum using non-orthogonal single-particle basis sets. By mapping the physical problem to an auxiliary computational space, we show that the resulting many-body overlap operator can be efficiently encoded as a matrix product operator for sufficiently localized orbitals, thereby generalizing a construction that first appeared in [ arXiv:2405.10285 ]. This construction recasts the variational ground-state search into a generalized eigenvalue problem, which can be solved using a generalized density matrix renormalization group algorithm. As a primary application, we employ a first-order finite-element expansion to study the ground state properties of the Lieb-Liniger gas in the presence of inhomogeneities. This approach also provides a natural setting for exactly refining the lattice, thereby enabling multigrid optimization strategies for matrix product states.", "url": "https://arxiv.org/abs/2606.14873", "type": "理论+数值", "summary": "1. 该工作发展了基于非正交单粒子基的矩阵乘积态框架，用于一维连续量子多体系统，通过映射至辅助计算空间将问题离散化。\n2. 其核心在于将多体重叠算符高效编码为局域轨道对应的矩阵乘积算符，从而将变分基态搜索转化为广义本征值问题，可借广义密度矩阵重正化群求解。\n3. 该框架以有限元展开实现非均匀Lieb-Liniger气体的基态计算，并支持精确格子细化，为多网格优化策略提供了自然平台。", "summary_source": "deepseek", "authors": [{"name": "Akshay Shankar"}, {"name": "Karel Van Acoleyen"}, {"name": "Jutho Haegeman"}], "featured_authors": [{"name": "Akshay Shankar"}, {"name": "Karel Van Acoleyen"}, {"name": "Jutho Haegeman"}], "author_count": 3}, {"id": "2606.14908", "category": "quant-ph", "title": "Optimising Entanglement Distillation Policies", "abstract": "Entanglement distillation is a fundamental operation in quantum information processing used to obtain higher-fidelity entangled pairs from a supply of less entangled quantum states using local operations aided by classical communication (LOCC). In a physically relevant setting, where states with an initial fidelity of $f_0$, probabilistically generated over multiple, $m$, memory pairs distributed between two parties, Alice and Bob, are pairwise distilled, the optimal policy identifies the system-configuration dependent sequence of entanglement generation and distillation operations that need to be performed in order to minimize the expected time to reach some target fidelity $f_T>f_0$. Here, we formulate and systematically analyze this task as a Markov decision problem and using a value iteration algorithm, obtain optimal deterministic policies that minimize the expected waiting time required to reach a target fidelity. Our results show that the expected waiting time under the optimal policy decreases with increasing generation probability $p$ and number of quantum memories $m$ - as expected. In contrast, it exhibits non-monotonic behavior with respect to $f_0$ for a fixed fidelity gap, $(\\Delta f = f_T-f_0)$. While the optimal policy consistently outperforms baseline policies such as the greedy, nested and entanglement pumping policies, its relative advantage is regime-dependent, being determined by the system parameters ($p,f_0,f_T,m$), and exhibits a nontrivial dependence on the fidelity gap $\\Delta f$. Our results highlight the value of formulating entanglement distillation as a Markov decision problem, enabling the systematic design of policies that achieve target fidelity thresholds for quantum information tasks in realistic resource-constrained settings.", "url": "https://arxiv.org/abs/2606.14908", "type": "理论+数值", "summary": "1. 该工作将纠缠蒸馏策略优化问题建模为马尔可夫决策过程，利用值迭代算法求解最小化达到目标保真度期望等待时间的最优确定性策略。\n2. 其核心发现是期望等待时间随初始保真度呈非单调行为，且最优策略的相对优势由系统参数与保真度间隙共同决定。\n3. 这为在资源受限场景下系统设计量子信息任务的目标保真度阈值达成策略提供了关键方法论启发。", "summary_source": "deepseek", "authors": [{"name": "Jigyen Bhavsar"}, {"name": "Rajni Bala"}, {"name": "Siddhartha Santra"}], "featured_authors": [{"name": "Jigyen Bhavsar"}, {"name": "Rajni Bala"}, {"name": "Siddhartha Santra"}], "author_count": 3}, {"id": "2606.14949", "category": "quant-ph", "title": "Initiation of Superradiance from Different Collective Spin States", "abstract": "Superradiance is an extensive cooperative spontaneous emission phenomenon. Some atomic collective spin states exhibit it. However, distinct initial states differ in their decay dynamics. Dicke states with different numbers of excitations have their peak emission intensity shifted in time depending on the number of excitations. Emission intensity in atomic coherent states depends on their polarization. Some specific states undergo a squeezing controlled crossover, making the emission character dependent on the amount of squeezing in the state. We present detailed results on the superradiant dynamics of a representative selection of Dicke states. For large N, we are able to predict fairly accurately the pulse profile in each case using the mean field approximation, an approach based on the Fokker Planck Equation. We also present results on the intensity correlation function of the emission.", "url": "https://arxiv.org/abs/2606.14949", "type": "理论", "summary": "1. 该工作系统研究了不同集体自旋态（如Dicke态与原子相干态）触发超辐射的起始动力学与脉冲轮廓。\n2. 其技术核心在于利用平均场近似与Fokker-Planck方程，在大N下精确预测各类初态的辐射脉冲轮廓及强度关联函数。\n3. 这为通过压缩态控制超辐射发射特性以及设计集体量子光源提供了定量理论依据。", "summary_source": "deepseek", "authors": [{"name": "Adnan Alabbar"}, {"name": "Zhenghao Zhang"}, {"name": "Girish S. Agarwal"}], "featured_authors": [{"name": "Adnan Alabbar"}, {"name": "Zhenghao Zhang"}, {"name": "Girish S. Agarwal"}], "author_count": 3}, {"id": "2606.15061", "category": "quant-ph", "title": "VQE as Initial State Preparation for QPE on Heisenberg Spin-Glass Hamiltonians", "abstract": "Quantum Phase Estimation (QPE) is the quantum algorithmic workhorse for computing ground state energies of quantum Hamiltonians with quantum computers. Ground state energy calculation of physical systems is perhaps the most promising use case for quantum computing in terms of scientific and commercial value with a plausible path to outperformance of classical alternatives. This path, however, hinges on the availability of initial states for QPE with significant overlap with the true ground state. Using extensive (classical) numerical computations, we study whether the NISQ-era algorithm VQE (Variational Quantum Eigensolver) could be used to efficiently prepare high-overlap states of disordered fully-connected anisotropic Heisenberg spin glass quantum Hamiltonians with up to $15$ qubits. We find that (i) -- consistent with widely held, but rarely numerically illustrated beliefs -- VQE is generally unable to efficiently converge to the ground state for our Hamiltonians, which is a well-known issue with VQE due to a variety of factors including vanishing gradients and local minima; (ii) low energy states do not necessarily have large ground-state overlap, but there is typically a correlation between the two measures; (iii) adding more than three layers to the VQE ansatz neither improves overlap nor the energies found; and (iv) the best-found overlap scaling as a function of the Hamiltonian system size is not strongly exponentially decreasing, suggesting potential for VQE to be a heuristic state preparation algorithm for QPE.", "url": "https://arxiv.org/abs/2606.15061", "type": "理论+数值", "summary": "1. 该工作通过数值计算研究了VQE作为量子相位估计初始态制备算法在无序全连接各向异性海森堡自旋玻璃哈密顿量上的可行性。\n2. 其核心发现在于VQE虽因梯度消失和局部极小难以收敛至基态，但最佳基态重叠随系统尺寸增长仅呈弱指数衰减，且超过三层的变分拟设不再改善性能。\n3. 这为使用NISQ时代的VQE启发式制备高重叠初始态以启动容错量子相位估计提供了依据，并启示了低能态与基态重叠间存在相关性的潜在利用。", "summary_source": "deepseek", "authors": [{"name": "Elijah Pelofske"}, {"name": "Stephan Eidenbenz"}], "featured_authors": [{"name": "Elijah Pelofske"}, {"name": "Stephan Eidenbenz"}], "author_count": 2}, {"id": "2606.15062", "category": "quant-ph", "title": "Discontinuous strong-to-weak symmetry breaking transition from thermal pure states", "abstract": "We investigate the nonequilibrium dynamics of strong-to-weak spontaneous symmetry breaking in many-body quantum systems undergoing decoherence from thermal pure states. For generic initial pure states with volume-law entanglement entropy, we show that the system undergoes a discontinuous dynamical phase transition at a critical time. This transition is accompanied by a singularity in the entropy of the system, which saturates to its maximum value at the same critical time. Through numerical simulations of the dephasing Ising and hard-core boson models, we establish the universality of this transition across different symmetries. Our results reveal that the dynamical emergence of a decohered mixed state from a highly entangled state is not a gradual asymptotic relaxation, but rather a sharp phase transition driven by a sudden collapse of global coherence.", "url": "https://arxiv.org/abs/2606.15062", "type": "理论+数值", "summary": "1. 该工作研究了多体量子系统从热纯态出发在退相干下的强到弱对称性自发破缺的非平衡动力学。\n2. 其关键发现在于体积律纠缠熵的初始纯态在临界时间处经历不连续动力学相变，伴随系统熵达到最大值的奇异性，且此相变在退相易辛模型与硬核玻色子模型中具有普适性。\n3. 这揭示了高度纠缠态向退相干混合态的演化并非渐近松弛，而是全局相干性突降驱动的尖锐相变，为量子退相干与对称性破缺动力学提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Taiki Haga"}, {"name": "Masaya Kunimi"}, {"name": "Masaya Nakagawa"}], "featured_authors": [{"name": "Taiki Haga"}, {"name": "Masaya Kunimi"}, {"name": "Masaya Nakagawa"}], "author_count": 3}, {"id": "2606.15071", "category": "quant-ph", "title": "Quantum learning with a single-atom sensor", "abstract": "The ability to gather information and to act upon it is at the core of every learning agent. But what is the impact of quantum mechanics on an agent's ability to sense external inputs and to translate them into actions? Here we address the question for a prototype task of learning agency at the quantum scale: rotating a single spin based on information gathered by a single atom. We determine the ultimate performance limit for this task, revealing a fundamental tradeoff between entanglement at the sensing stage and coherence at the action stage: if the single-atom sensor is not entangled with the quantum system serving as the agent's internal memory, then the best learning strategy requires a coherent transfer of quantum information from the sensor to the system that controls the agent's actions. In contrast, if the sensor is initially entangled with the agent's memory, then the transfer of quantum information is no longer necessary. Our results indicate that the quantum properties of the sensor radically affect the optimal way to convert external stimuli into actions, revealing a link between quantum sensing and the behavior of quantum agents.", "url": "https://arxiv.org/abs/2606.15071", "type": "理论", "summary": "1. 该工作以单原子传感器旋转单自旋为原型任务，界定量子学习代理的极限性能。\n2. 核心发现在于传感阶段纠缠与行动阶段相干性之间存在根本权衡：无纠缠时需相干传输量子信息，有纠缠则无需传输。\n3. 这揭示了传感器量子性质对从外部刺激到行动最优转换方式的根本影响，建立了量子传感与代理行为间的联系。", "summary_source": "deepseek", "authors": [{"name": "Yin Mo"}, {"name": "Emilio Bagan"}, {"name": "Giulio Chiribella"}], "featured_authors": [{"name": "Yin Mo"}, {"name": "Emilio Bagan"}, {"name": "Giulio Chiribella"}], "author_count": 3}, {"id": "2606.15083", "category": "quant-ph", "title": "REGRID-QAOA: A Resource-Efficient Graph-Reduced Hybrid QAOA Framework for Physics-Constrained Power System Islanding", "abstract": "Quantum computing has rapidly emerged as a powerful paradigm for tackling computationally demanding problems. In particular, quantum optimization shows strong promise for hard combinatorial problems in power systems, where increasing distributed energy penetration heightens the need for intentional islanding to maintain grid reliability and resilience. However, power system islanding is an NP-hard combinatorial optimization problem that becomes computationally prohibitive for classical solvers as network size grows, motivating the use of quantum computing as a promising alternative pipeline. This study develops a resource-efficient hybrid QAOA islanding framework that brings physics-constrained power-system partitioning into the quantum optimization workflow. The framework combines coherency-informed graph reduction, physics-aware constraint modeling, and structured post-processing to efficiently convert shallow-circuit QAOA samples into high-quality feasible islanding decisions without deep circuits or large shot budgets. The proposed framework is validated on the standard IEEE benchmark systems (9-, 14-, 24-, 30-, 39-, and 57-bus), demonstrating that the hybrid workflow achieves Gurobi-optimal solution quality with a clear quantum resource advantage over vanilla QAOA, while the resulting islanding solutions satisfy all physical feasibility requirements after network separation. This study establishes QAOA-based islanding as a viable quantum approach for critical infrastructure, with structured post-processing as the key enabler of quantum resource efficiency.", "url": "https://arxiv.org/abs/2606.15083", "type": "理论+数值", "summary": "1. 该工作提出一个资源高效混合QAOA框架，将物理约束电力系统分区问题纳入量子优化流程。\n2. 其核心在于结合相干性图缩减、物理约束建模与结构化后处理，将浅电路QAOA样本高效转化为满足所有物理可行性的高质量孤岛决策，无需深电路或大采样预算。\n3. 这确立了基于QAOA的孤岛方案作为关键基础设施的可行量子方法，且结构化后处理是实现量子资源效率的关键使能技术。", "summary_source": "deepseek", "authors": [{"name": "Yuqi Jiang"}, {"name": "Yuqi Zhang"}, {"name": "Zhiding Liang"}, {"name": "Qiang Guan"}, {"name": "Yan Li"}, {"name": "Ganesh Kumar Venayagamoorthy"}], "featured_authors": [{"name": "Yuqi Jiang"}, {"name": "Yuqi Zhang"}, {"name": "Zhiding Liang"}, {"name": "Qiang Guan"}, {"name": "Yan Li"}, {"name": "Ganesh Kumar Venayagamoorthy"}], "author_count": 6}, {"id": "2606.15108", "category": "quant-ph", "title": "Temporal modulation as a resource: enhanced frequency estimation in continuous variable systems", "abstract": "Frequency estimation, a cornerstone of quantum metrology, has been significantly enhanced by advanced quantum sensing strategies. However, most protocols rely either on static or time-independent encoding mechanisms, inherently limiting their achievable precision scaling, or on control strategies requiring changing the Hamiltonian and/or implementing feedback mechanisms. To overcome this, we investigate a simpler dynamical encoding protocol where the quantum oscillator is driven by a general continuous temporal frequency modulation $\\Omega(t) = \\omega_0 f(t)$. We analytically demonstrate that for a given modulation profile $f(t)$ and its corresponding time-integral $F(t)$, the quantum Fisher information (QFI) scales as $\\mathcal{O}(F(t)^2)$. This enhancement stems from the fact that temporal encoding fundamentally alters the mechanism of dynamical phase accumulation. Crucially, when evaluated under the energy and evolution-time constraints, this framework reveals a genuine precision enhancement over the conventional time-independent baseline. By analyzing explicit polynomial and exponential modulations, we establish that arbitrary precision scaling can be deterministically engineered, with ultimate bounds that are asymptotically saturable via optimal homodyne detection. Our framework provides a universal paradigm for exploiting time-dependent quantum control in next-generation sensors.", "url": "https://arxiv.org/abs/2606.15108", "type": "理论+数值", "summary": "1. 本文研究了连续时间频率调制驱动量子振荡器的动力学编码协议，在能量与演化时间约束下实现频率估计精度超越传统静态方案。\n2. 其核心在于时间编码改变动力学相位积累机制，使量子Fisher信息与调制时间积分平方成正比，并通过多项式或指数调制可确定性工程任意精度缩放。\n3. 该框架为无反馈或哈密顿量改变的量子传感提供了通用范式，且精度界限可通过最优零差检测渐近饱和，对下一代时变量子计量有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Ningxin Kong"}, {"name": "Qiongyi He"}, {"name": "Matteo G. A. Paris"}], "featured_authors": [{"name": "Ningxin Kong"}, {"name": "Qiongyi He"}, {"name": "Matteo G. A. Paris"}], "author_count": 3}, {"id": "2606.15113", "category": "quant-ph", "title": "Optimal Toffoli-Depth Multi-Controlled Toffoli Decomposition in 2D Qubit Layout", "abstract": "The multi-controlled Toffoli (MCT) gate is a key primitive in quantum arithmetic, oracle construction, and quantum cryptanalysis. Although recent work has established optimal Toffoli-depth MCT decompositions under all-to-all qubit connectivity, their realization on near-term quantum hardware with restricted qubit connectivity remains largely unexplored. While general-purpose quantum mappers can route arbitrary circuits, they do not explicitly exploit the repeated interaction patterns inherent in MCT decompositions. In our present paper, we study architecture-aware mappings of optimal Toffoli-depth MCT decompositions onto restricted two-dimensional qubit layouts. We begin with a structured geometric placements that preserve the parallelism of state-of-the-art Toffoli and MCT decompositions with no additional depth overhead. We further introduce a motif-based packing framework in which decomposition layers are represented by interaction motifs derived from basic Toffoli gates. By embedding these motifs vertex-disjointly into hardware graphs, we characterize the minimum-size topologies supporting the required qubit resources and derive explicit bounds on the resulting depth overhead under tight qubit budgets. Finally, we compare these bounds with routing-aware placement heuristics and empirically evaluate the effectiveness of embedding different motifs across a range of hardware topologies.", "url": "https://arxiv.org/abs/2606.15113", "type": "理论+数值", "summary": "1. 该工作研究了最优Toffoli深度的多控Toffoli门在受限二维量子比特布局上的架构感知分解。\n2. 其卖点在于提出结构化几何布局与基于motif的打包框架，在保持并行性无损的前提下，推导了紧致量子比特预算下的深度开销上界。\n3. 这为近期量子硬件上实现量子算术与量子密码分析中的多控门提供了架构级优化指导。", "summary_source": "deepseek", "authors": [{"name": "Anik Basu Bhaumik"}, {"name": "Suman Dutta"}, {"name": "Anupam Chattopadhyay"}], "featured_authors": [{"name": "Anik Basu Bhaumik"}, {"name": "Suman Dutta"}, {"name": "Anupam Chattopadhyay"}], "author_count": 3}, {"id": "2606.15190", "category": "quant-ph", "title": "Lattice surgery for near-term experimental logical qubit entanglement creation in planar architectures", "abstract": "In the era of early fault-tolerant quantum computing, basic demonstrations of entanglement operations between a few logical qubits are at the frontier of recent developments in quantum computing. In this work, we describe in detail, at both the logical and physical qubit levels, a logical teleportation protocol between two surface code logical qubits based on lattice surgery. We address several aspects of the teleportation protocol pertinent to superconducting qubit architectures. We explore the modularity constraints in the number and location of stabilizer readouts and compare variants of the teleportation protocol in this regard. Additionally, we investigate potential performance improvements related to in-sequence decision logic and the optimal size of the interface region between two surface code patches on a superconducting chip. Based on our simulations, we show possible near-term improvements in lattice surgery protocols that facilitate fault-tolerant quantum computing in superconducting circuit architectures.", "url": "https://arxiv.org/abs/2606.15190", "type": "实验", "summary": "1. 该工作针对超导量子比特架构，详细描述了基于格子手术的两个表面码逻辑量子比特间的逻辑传输协议，涵盖逻辑与物理量子比特层面。\n2. 其技术亮点在于系统探讨了稳定子读出模块化约束、协议变体对比、序列内决策逻辑及界面区域尺寸优化对性能的潜在提升。\n3. 这为近期的超导电路平面架构中实现容错逻辑量子比特纠缠操作提供了明确的性能改进方向。", "summary_source": "deepseek", "authors": [{"name": "Lukas Bödeker"}, {"name": "Áron Márton"}, {"name": "Luis Colmenarez"}, {"name": "Ilya Besedin"}, {"name": "Andreas Wallraff"}, {"name": "Markus Müller"}], "featured_authors": [{"name": "Lukas Bödeker"}, {"name": "Áron Márton"}, {"name": "Luis Colmenarez"}, {"name": "Ilya Besedin"}, {"name": "Andreas Wallraff"}, {"name": "Markus Müller"}], "author_count": 6}, {"id": "2606.15213", "category": "quant-ph", "title": "Quantum-classical hybrid models based on error correction for time series forecasting", "abstract": "Time series forecasting largely benefits from combining the strengths of different models, especially using a scheme where a model corrects another model by capturing supplementary patterns from forecasting errors. Concurrently, quantum models are providing a means to augment the classical capacity, including in time series forecasting, by acting alongside classical models in hybrid architectures. In this work, we propose the first forecasting system based on error correction that jointly uses quantum and classical models. Here, quantum models first extract patterns by exploring quantum phenomena, and classical models capture the remaining patterns from the quantum errors. Compared to classical single models and classical-classical hybrid models based on error correction, the complementary capacity that emerges from this quantum-classical system provided the best results in most of the addressed problems. Therefore, this work paves the way to introduce quantum models in established hybridization schemes for time series forecasting.", "url": "https://arxiv.org/abs/2606.15213", "type": "理论", "summary": "1. 该工作首次提出基于误差校正的量子-经典混合时间序列预测系统，量子模型先探索量子现象提取模式，经典模型再捕获量子误差中的剩余模式。\n2. 其卖点在于利用量子-经典互补能力，相较于纯经典模型及基于误差校正的经典-经典混合模型，在多数问题上取得了最佳预测效果。\n3. 这为将量子模型系统性地引入时间序列预测的既定混合框架开辟了道路，并提示了误差校正机制在量子-经典协同中的效用。", "summary_source": "deepseek", "authors": [{"name": "Jonathan H. A. de Carvalho"}, {"name": "Filipe C. de L. Duarte"}, {"name": "Fernando M. de Paula Neto"}, {"name": "Paulo S. G. de Mattos Neto"}], "featured_authors": [{"name": "Jonathan H. A. de Carvalho"}, {"name": "Filipe C. de L. Duarte"}, {"name": "Fernando M. de Paula Neto"}, {"name": "Paulo S. G. de Mattos Neto"}], "author_count": 4}, {"id": "2606.15303", "category": "quant-ph", "title": "Inverted Dirac oscillator", "abstract": "The Dirac oscillator is obtained from the Dirac Hamiltonian $H^{\\mathrm{D}} = \\left( c\\vec{\\alpha}\\cdot \\vec{p} + mc^{2}\\beta \\right)$ by modifying the momentum through a non-Hermitian substitution $\\overrightarrow{p} \\rightarrow \\overrightarrow{p} \\pm i\\omega \\beta \\overrightarrow{q}$. Despite the non-Hermitian nature of this momentum operator, the full Hamiltonian remains Hermitian due to the presence of the Dirac matrix $\\vec{\\alpha}$. However, if one instead introduces a Hermitian modification of the form $\\vec{p} \\rightarrow \\vec{p} \\pm \\omega \\beta \\overrightarrow{q}$, the resulting Hamiltonian is no longer Hermitian. In this case, the system corresponds to an invert
