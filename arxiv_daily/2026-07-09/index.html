}], "featured_authors": [{"name": "Marco Knipfer"}, {"name": "Alexander Roman"}, {"name": "Katia Matcheva"}, {"name": "Konstantin T. Matchev"}], "author_count": 4}, {"id": "2607.07223", "category": "quant-ph", "title": "Non-Abelian Thouless pumping based on the global adiabatic criterion in Rydberg synthetic lattices", "abstract": "We study a quantum implementation of non-Abelian Thouless pumping in Lieb lattices using Rydberg synthetic dimensions. The lattice is encoded in twelve selected microwave-coupled Rydberg levels, forming a three-cell structure with six degenerate zero-energy states. These zero-energy states define the working subspace for cyclic modulation of the microwave couplings, while the remaining bright states provide the dominant leakage channels at finite evolution time. To choose the relative timing of the Gaussian pulses, we introduce a global adiabatic criterion (GAC), which evaluates the mean value and temporal fluctuation of a nonadiabatic factor obtained from a representative $\\Lambda$-type transfer paradigm. With the resulting timing applied to the full twelve-level pumping dynamics, composing two elementary pumping cycles in opposite temporal orders produces distinct projected population maps. It is exactly consistent with noncommuting matrix-valued adiabatic operations in the zero-energy subspace. We numerically simulate the non-Abelian Thouless pumping using the Lindblad master equation with state-dependent Rydberg loss and representative perturbations. The results show that the GAC-selected timing within the same Gaussian pulse family gives higher target-state population than two literature-adapted Gaussian pulse schedules over the simulated parameter ranges. This quantum implementation of non-Abelian Thouless pumping, enabled by the GAC, marks a major milestone in finite-time geometric control and paves the way for transformative applications in holonomic quantum computing with Rydberg synthetic lattices.", "url": "https://arxiv.org/abs/2607.07223", "type": "理论+数值", "summary": "1. 该工作利用12个微波耦合里德堡能级编码三胞Lieb晶格，在六简并零能态子空间中通过循环耦合调制实现了非阿贝尔索末菲泵浦，并验证了时序交换的非交换投影布居。\n2. 其技术核心是提出全局绝热准则，基于Λ型转移范例的非绝热因子均值与时间涨落优化高斯脉冲相对时序，显著抑制了亮态泄漏通道对零能子空间绝热性的破坏。\n3. 在包含里德堡态依赖损耗的Lindblad主方程模拟中，该准则选定时序的靶态布居在参数范围内优于两种文献方案，为有限时间几何控制及全息量子计算提供了可实施的优化路径。", "summary_source": "deepseek", "authors": [{"name": "Jin-Kang Guo"}, {"name": "Jin-Lei Wu"}, {"name": "Chuan-Cun Shu"}], "featured_authors": [{"name": "Jin-Kang Guo"}, {"name": "Jin-Lei Wu"}, {"name": "Chuan-Cun Shu"}], "author_count": 3}, {"id": "2607.07225", "category": "quant-ph", "title": "Quantum Boomerang Effect in Time-Crystalline Structures", "abstract": "The quantum boomerang effect (QBE) is a unique dynamical signature of Anderson localization, characterized by a launched wavepacket that initially drifts but ultimately returns to its initial position due to fundamental quantum interference. In this work, we theoretically establish and quantitatively characterize the QBE in a time-crystalline structure using a periodically driven quantum particle in a one-dimensional potential well. By constructing maximally localized Floquet-Wannier states and introducing temporal disorder, we rigorously map the continuous Floquet dynamics onto a discrete disordered tight-binding lattice. By positioning a detector at a fixed spatial coordinate, we monitor the temporal evolution of the wavepacket, to extract the mean temporal center of mass of the probability density in a time-crystalline structure. This mean temporal center of mass exhibits an initial ballistic expansion, followed by a pronounced U-turn, and ultimately returns to its initial temporal position after long-time evolution. These results confirm the existence of the complete QBE in the time domain. They also demonstrate that non-trivial dynamics can be explored within time-crystalline systems, even though these structures already possess an inherent temporal periodicity.", "url": "https://arxiv.org/abs/2607.07225", "type": "理论", "summary": "1. 该工作理论建立并定量刻画了时间晶体结构中的量子回旋镖效应。\n2. 其技术要点在于构造最大局域Floquet-Wannier态并引入时间无序，将连续Floquet动力学映射为离散无序紧束缚晶格，通过固定探测器提取时间质心，观测到波包先弹道扩散、再U形转折、最终返回初始时间的完整回旋镖行为。\n3. 这证明了即使在固有周期性的时间晶体系统中也能探索非平凡量子动力学，为时域安德森局域化研究开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Qi-wen Peng"}, {"name": "Krzysztof Sacha"}, {"name": "Chu-hui Fan"}], "featured_authors": [{"name": "Qi-wen Peng"}, {"name": "Krzysztof Sacha"}, {"name": "Chu-hui Fan"}], "author_count": 3}, {"id": "2607.07332", "category": "quant-ph", "title": "Lecture notes on classical and quantum non-Markovianity", "abstract": "The study of non-Markovian quantum processes has attracted significant interest in recent decades, giving rise to several competing notions of quantum non-Markovianity. These notes serve as an introduction to the topic for graduate students familiar with quantum mechanics and probability theory. Owing to the vastness of the literature, we focus on two prominent characterizations of quantum Markovianity based on the divisibility of quantum channels and monotonically decreasing state distinguishability. The correspondence between classical concepts (stochastic matrices, Chapman-Kolmogorov equation) and their quantum analogs (dynamical maps, CP-divisibility) is emphasized throughout.", "url": "https://arxiv.org/abs/2607.07332", "type": "理论", "summary": "1. 该讲义面向具备量子力学和概率论基础的研究生，系统介绍了经典和量子非马尔可夫性的基本概念与核心表征。\n2. 重点基于量子通道的可分性判据和态可区分性的单调递减性这两种量子马尔可夫性刻画，并强调了经典随机矩阵与Chapman-Kolmogorov方程到量子动力学映射与CP-可分性之间的对应关系。\n3. 这为理解非马尔可夫量子过程的多种定义提供了清晰导引，对相关教学和后续理论发展具有基础性启发意义。", "summary_source": "deepseek", "authors": [{"name": "Graeme Pleasance"}], "featured_authors": [{"name": "Graeme Pleasance"}], "author_count": 1}, {"id": "2607.07336", "category": "quant-ph", "title": "Resource-Efficient Hybrid Quantum Neighborhood Selection for Large-Scale Molecular Diversity Optimization", "abstract": "Large-scale combinatorial optimization remains demanding for classical heuristics, particularly when dense Quadratic Unconstrained Binary Optimization (QUBO) formulations induce large memory footprints, high CPU utilization, and long execution times. While near-term quantum processors cannot yet deliver unconditional quantum advantage, hybrid architectures can provide practical value by reducing the resource burden. This paper presents a resource-efficiency study of Hybrid Quantum Neighborhood Selection (HQNS), a framework that decomposes large dense QUBO instances into bounded-width quantum subproblems via stochastic frontier selection. We evaluate HQNS on the Maximum Diversity Subset Selection Problem (MDSSP), focusing on the trade-off between solution quality retention and resource consumption. Benchmarks up to N=1000 candidates show that HQNS preserves 99.9908% of the mean diversity score of an 11-restart parallel Simulated Annealing baseline, while reducing wall-clock time by 94.91%, peak CPU utilization by 64.68%, and peak memory usage by 88.61%. The QPU execution time remains bounded within a 6-7 second envelope across scales, indicating that the quantum component is decoupled from the global QUBO dimension when the frontier size is fixed. These results suggest that HQNS provides a resource-aware pathway for deploying hybrid quantum optimization in practical large-scale settings, serving as an efficient architecture for incorporating near-term quantum processors into classical optimization pipelines.", "url": "https://arxiv.org/abs/2607.07336", "type": "理论+数值", "summary": "1. 该工作提出混合量子邻域选择框架，将大规模稠密QUBO实例分解为有界宽量子子问题，用于分子多样性优化。\n2. 其卖点在于通过随机边界选择解耦量子处理器与全局问题规模，在保持99.99%解质量同时降低约95%时间、65%CPU及89%内存。\n3. 这为在资源受限条件下将近期量子器件集成到经典优化管线提供了可扩展的实用路径。", "summary_source": "deepseek", "authors": [{"name": "Nicolas Mendes de Araujo"}, {"name": "Lester de Abreu Faria"}], "featured_authors": [{"name": "Nicolas Mendes de Araujo"}, {"name": "Lester de Abreu Faria"}], "author_count": 2}, {"id": "2607.07338", "category": "quant-ph", "title": "Quantum simulation of real-world nonlinear dynamics via Koopman method", "abstract": "Nonlinear dynamics is ubiquitous in nature, ranging from chemical pattern formation to ocean circulation, yet its simulation on quantum computers is fundamentally limited by the unitary nature of quantum evolution. We propose the quantum Koopman method, a data-driven framework that embeds nonlinear dynamics into a learned linear representation and implements the resulting evolution using shallow quantum circuits. This method learns Koopman observables from trajectory data, projects the lifted dynamics onto a finite-dimensional subspace, and decomposes the corresponding non-unitary propagator into parallel spectral channels. We utilize the Koopman method on a superconducting processor to simulate three distinct nonlinear systems, comprising reaction-diffusion dynamics, fluid motion on a sphere, and satellite-derived observations of Gulf Stream currents, employing up to 32 parallel circuits of 10 qubits. These quantum simulations capture the dominant multiscale patterns and statistical signatures of the underlying dynamics, and reveal a transition from performance limited by hardware noise in weakly nonlinear systems to performance limited by finite-dimensional Koopman representations as nonlinear scale interactions increase. This transition identifies a practical boundary for quantum-amenable nonlinear dynamics, establishing a hardware-validated route for simulating moderately nonlinear dynamics on near-term quantum hardware.", "url": "https://arxiv.org/abs/2607.07338", "type": "理论+数值", "summary": "1. 该工作提出量子Koopman方法，利用浅量子电路在超导处理器上模拟真实世界的非线性动力学系统，涵盖反应扩散、球面流体及卫星观测的湾流。\n2. 其核心在于从轨迹数据学习线性Koopman表示，将非酉传播子分解为并行谱通道，从而突破量子酉演化局限。\n3. 这揭示了从硬件噪声限制转向有限维表示限制的转变，为近中期量子硬件模拟中等非线性动力学确立了可验证的实用边界。", "summary_source": "deepseek", "authors": [{"name": "Baoyang Zhang"}, {"name": "Dong An"}, {"name": "Zhaoyuan Meng"}, {"name": "Yefei Yu"}, {"name": "Xiaoxiao Xiao"}, {"name": "Zhen Lu"}, {"name": "Yue Yang"}], "featured_authors": [{"name": "Baoyang Zhang"}, {"name": "Dong An"}, {"name": "Zhaoyuan Meng"}, {"name": "Xiaoxiao Xiao"}, {"name": "Zhen Lu"}, {"name": "Yue Yang"}], "author_count": 7}, {"id": "2607.07449", "category": "quant-ph", "title": "Turing mechanisms in a multimode open quantum system", "abstract": "We investigate pattern formation in a finite chain of bosonic modes whose dynamics is governed by a Gorini-Kossakowski-Sudarshan-Lindblad (GKSL) master equation. The model combines local parametric driving and nonlinear damping with nonlocal dissipative couplings between modes that work on different discrete spatial scales. In the classical limit, these mechanisms generate a reaction-diffusion-like dynamics, allowing the emergence of Turing-type instabilities. The key aspect of the analysis is the coexistence and competition of different unstable spatial modes. Depending on the range of parameters, the system may select different stationary nonuniform configurations, oscillatory wave-like states, or regimes in which multiple modes interact before a dominant pattern is established, thus providing a mechanism for pattern selection. We compare the deterministic bifurcation scenario, generated by a reaction-diffusion-like system derived from semiclassical drift dynamics, with the quantum dynamics, derived via the GKSL master equation, using phase-space methods and reduced Wigner functions. The results show how Turing instabilities, mode competition, and pattern selection can be extended to multimode open quantum systems, providing a bridge between nonlinear dynamical systems, dissipative quantum mechanics, and spatial self-organization.", "url": "https://arxiv.org/abs/2607.07449", "type": "理论", "summary": "1. 该工作基于GKSL主方程，在有限链玻色子模式中研究图灵不稳定性与空间模式形成。\n2. 其技术核心在于局域参数驱动和非线性阻尼结合非局域耗散耦合，实现多不稳定模式的共存、竞争与选择。\n3. 该工作将图灵型模式形成机制延伸至多模开放量子系统，为经典非线性动力学与耗散量子力学的交叉提供了桥梁。", "summary_source": "deepseek", "authors": [{"name": "Giorgia Comparato"}, {"name": "Francesco Gargano"}, {"name": "Rosario Lo Franco"}], "featured_authors": [{"name": "Giorgia Comparato"}, {"name": "Francesco Gargano"}, {"name": "Rosario Lo Franco"}], "author_count": 3}, {"id": "2607.07502", "category": "quant-ph", "title": "Spin Textures and Eigenstate Evolution of Isospectrally Patterned Lattices", "abstract": "Isospectrally patterned lattices exhibit a composite band structure with a tunable ratio of localized versus delocalized eigenstates that is controlled by the underlying phase gradient. We show that the lattice Hamiltonian can be interpreted as that of a single spin exposed to a rotating magnetic field which is allowed to hop with a spin-flip across the lattice. In the low- and high-energy part of the band the localized states show an envelope of oscillatory character separated by quasi-nodes. Spin peaks occur at the locations of these quasi-nodes and provide a unique spin texture to the eigenstates which becomes increasingly complex with increasing degree of excitation. The crossover from localization to delocalization and vice versa leaves its fingerprints in the Fourier spectrum of the eigenstates: the original bimodal frequency distribution widens with increasing degree of excitation, moves across the spectral window and finally culminates in an extremely narrow frequency peak. In the course of this evolution the spin texture undergoes a rearrangement transition involving different characteristic (ir)regular patterns which we quantify by considering the total variation of the local spin fluctuations. Our results demonstrate the variety of the spectral properties of isospectrally patterned lattices which holds great prospect in particular when considering higher lattice or cell dimensions.", "url": "https://arxiv.org/abs/2607.07502", "type": "理论", "summary": "1. 该工作研究了等谱图案化晶格中的自旋纹理与本征态演化，揭示了复合能带结构及局域–退局域转变机制。\n2. 其卖点是将晶格哈密顿量映射为自旋在旋转磁场中的跳跃模型，并发现局域态振荡包络的准节点处出现自旋峰值，形成随激发度增加而复杂化的自旋纹理。\n3. 这为更高维晶格或元胞结构下的谱特性调控及自旋纹理重排实验提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Peter Schmelcher"}], "featured_authors": [{"name": "Peter Schmelcher"}], "author_count": 1}, {"id": "2607.07530", "category": "quant-ph", "title": "The NISQ Trap: Eight Years of Demonstrations the Hardware Was Built to Lose", "abstract": "With a single contested exception, every NISQ-era flagship demonstration of \"quantum advantage\" has been classically reproduced, or closed by a simulability theorem, within eighteen months of its announcement. Six theoretical results from 2024 through April 2026 explain the pattern: the regions of circuit-space NISQ hardware can run with sufficient fidelity coincide with the regions classical algorithms compress efficiently, because the features that admit one (low effective depth, strong algebraic structure, geometric locality) are the features that admit the other. This reading dates the NISQ programme from its 2018 articulation as an interim retreat from the unmet conditions of the 1996 threshold theorems, characterises the eight years that followed as a closed loop in which the demonstrations the hardware could run were drawn from the only regions classical methods could already attack, and locates the exit from the loop where the threshold theorems originally located it: in fault tolerance. The empirical pattern could in principle break with a demonstration that escapes the current simulability results. After eight years and more than thirty advantage-class announcements, the burden of producing such a demonstration falls to the defenders of NISQ.", "url": "https://arxiv.org/abs/2607.07530", "type": "数值", "summary": "1. 该论文系统回顾了NISQ时代八年来所有宣称量子优势的旗舰实验演示，指出除一个争议事件外，均在公布后18个月内被经典方法复现或可模拟性定理覆盖。\n2. 核心论点在于NISQ硬件高保真可运行电路区域与经典算法高效可压缩区域重合，根源是低有效深度、强代数结构和几何局域性对两者同等有利。\n3. 这一闭环分析将NISQ定位为从1996年容错阈值定理条件的临时退却，并指明走出困境的唯一路径是回归容错量子计算的原始框架。", "summary_source": "deepseek", "authors": [{"name": "Amit Hagar"}], "featured_authors": [{"name": "Amit Hagar"}], "author_count": 1}, {"id": "2607.07539", "category": "quant-ph", "title": "A Dynamic Multiplexing Policy for a Quantum Repeater", "abstract": "We consider a multiplexed quantum repeater that distributes entanglement between two end nodes. Multiplexing is achieved through optical integration of many quantum chips. Each chip hosts an optically addressable communication qubit and a separate memory qubit. The communication qubit serves as an entanglement generation interface between different quantum chips, and the memory qubit can be used to store entanglement. The quantum chips on the repeater are interconnected using a reconfigurable router, which makes it possible to dynamically assign quantum chips for entanglement generation with either of the two end nodes in every end-to-end communication cycle. We propose a dynamic multiplexing policy in which after an entangled link has been established with one of the end nodes, all remaining quantum chips are assigned to the opposite end node. We compare this dynamic policy to a policy in which the assignment of quantum chips to end nodes is fixed. We consider a parameter regime where on average less than one entangled link is generated per end-to-end communication cycle, which is the relevant regime for near-term quantum networks. We show that in this regime, the dynamic multiplexing policy can lead to a significant improvement in fidelity over a fixed policy, while marginally improving the rate. Moreover, even though the dynamic multiplexing policy requires a deeper, and hence, more lossy, router than the fixed policy, it can still achieve higher secret key rates in the parameter regime studied. This makes dynamic multiplexing with a many-quantum-chip repeater especially relevant for the development of near-term quantum networks.", "url": "https://arxiv.org/abs/2607.07539", "type": "理论", "summary": "1. 该工作针对多量子芯片集成的复用量子中继器，提出一种动态分配芯片与两端节点生成纠缠的复用策略。\n2. 其核心在于，在每周期平均生成纠缠链路少于一条的参数区内，动态策略相比固定分配策略可显著提高保真度并小幅提升速率，即便所需可重构路由器更深且损耗更大。\n3. 这为近期量子网络在有限资源条件下实现更高质量纠缠分发提供了可行方案，尤其适用于多芯片中继器架构。", "summary_source": "deepseek", "authors": [{"name": "Jeroen Grimbergen"}, {"name": "Sounak Kar"}, {"name": "Michal van Hooft"}, {"name": "Conor Bradley"}, {"name": "Stephanie Wehner"}], "featured_authors": [{"name": "Jeroen Grimbergen"}, {"name": "Sounak Kar"}, {"name": "Michal van Hooft"}, {"name": "Conor Bradley"}, {"name": "Stephanie Wehner"}], "author_count": 5}, {"id": "2607.07540", "category": "quant-ph", "title": "Towards Minimax Estimation of High-Order Functionals by Quantum Arguments", "abstract": "We propose a novel approach to the minimax estimation of high-order functionals from the perspective of quantum computing. Specifically, for any real number $\\alpha \\gg 1$, we present two estimators, one for the classical functional $\\mathrm{F}_\\alpha(P) = \\sum_{i=1}^S p_i^\\alpha$ of a discrete distribution $P$ and the other for the quantum functional $\\mathrm{F}_\\alpha(\\rho) = \\operatorname{tr}(\\rho^\\alpha)$ of a mixed state $\\rho$. These functionals have close connections with the Rényi entropy and the Tsallis entropy. We show that both estimators achieve the minimax optimal $L_2$ rate $\\alpha \\mathsf{n}^{-1}$ in the range $\\alpha \\lesssim \\mathsf{n} \\lesssim \\alpha^{3-o(1)}$, where the support size $S$ of $P$ or the dimension of $\\rho$ can be much larger than the number of samples $\\mathsf{n}$. As a result, both estimators achieve the \\textit{optimal} sample complexity $\\mathsf{n} \\asymp \\alpha$, improving upon the prior best upper bounds $O(\\alpha^2)$ established by Jiao, Venkat, Han, and Weissman (IEEE Trans. Inf. Theory 2017) for classical functionals and Chen and Wang (COLT 2025) for quantum functionals. Our estimators are constructed under a unified framework using quantum primitives and run in linear time on a quantum computer. This work reveals an unexpected path from quantum computing to statistics, suggesting a conceptually new methodology for functional estimation. It adds to the growing list of quantum proofs for classical theorems.", "url": "https://arxiv.org/abs/2607.07540", "type": "理论", "summary": "1. 该工作从量子计算视角提出了离散分布Rényi熵型泛函与量子态α阶迹泛函的极小化极大估计方法，两种估计量均达到最优L2速率αn^{-1}。\n2. 其技术核心在于利用量子原语构造统一框架，在样本复杂度从O(α^2)突破至n≍α，且支持远大于样本数的支撑集或维度。\n3. 这揭示了量子计算可逆向服务于经典统计推断，为复杂高阶泛函估计提供了新的方法论范式。", "summary_source": "deepseek", "authors": [{"name": "Qisheng Wang"}], "featured_authors": [{"name": "Qisheng Wang"}], "author_count": 1}, {"id": "2607.07546", "category": "quant-ph", "title": "An analytical solution of a quantum system with non-Markovian behavior: The Bixon-Jortner system in time domain", "abstract": "Non-Markovian behavior in quantum systems is often studied in the context of bipartite systems consisting of a system of interest and an environment -- tracing over the environment results in non-Markovian behavior for the subsystem of interest. One may get a Markovian limit in certain regimes, which is studied using the Lindblad master equation, and corrections to this behavior can be obtained by techniques such as the Nakajima-Zwanzig formalism. In this paper, we obtain an exact non-Markovian equation for the dynamics of a simple model system that consists of a direct sum rather than a tensor product of two pieces, namely, a discrete state and an infinite ladder. This system, called the Bixon-Jortner model, was first developed in the quantum chemistry literature but has been utilized by the quantum optics community as a model system with interesting behavior, including a Wigner-Weisskopf limit of exponential decay. We attack the time evolution problem of this system directly in time-domain, and start with an integrodifferential equation describing the time evolution of the discrete state. Using tools from mathematical physics, we transform this equation to a delay differential equation, which makes the non-Markovianity completely transparent, and then we solve the delay equation using an intuitive ansatz. This allows us to obtain the analytic form of the dynamics directly in time domain, and demonstrate decay and revival behaviors coming from the aforementioned delay differential equation. We believe the explicit form of the time-domain non-Markovian equation we obtain and the accessibility the solution techniques we use make our results a useful case study of non-Markovianity in quantum systems.", "url": "https://arxiv.org/abs/2607.07546", "type": "理论", "summary": "1. 本文对Bixon-Jortner模型（由离散态与无限阶梯直和构成）在时域中导出精确非马尔可夫动力学方程并解析求解。\n2. 其核心技术在于将描述离散态演化的积分微分方程转化为延迟微分方程，通过直观ansatz揭示衰减与复兴行为。\n3. 该显式时域解及延迟方程方法为理解量子非马尔可夫性提供了可解析操作的典型范例。", "summary_source": "deepseek", "authors": [{"name": "Osman Cevheroğlu"}, {"name": "Arkadaş Özakın"}], "featured_authors": [{"name": "Osman Cevheroğlu"}, {"name": "Arkadaş Özakın"}], "author_count": 2}, {"id": "2607.07547", "category": "quant-ph", "title": "Variational Learning with Sparse Long-range Entangling Gates", "abstract": "The performance of variational quantum algorithms depends in general on the structure of the parametrized quantum circuit, but the most common ansätze are typically based on local couplings. Motivated by the extended connectivity available with neutral atoms and trapped ions, we examine when structured long-range connectivity provides a useful resource, focusing on sparse power-of-two (PWR2) coupling graphs. Using dynamical Lie-algebra analysis, approximate unitary-design diagnostics, and finite-depth measures of expressibility and entanglement, we examine how these geometries enlarge the accessible operator space. This enlarged space alone is not sufficient to ensure trainability of the parameterized circuit for given target problems, and we explore performance across example problems with and without long-range coupling, identifying where sparse coupling graphs are or are not likely to provide an advantage. We also introduce a variational scheme that maps hierarchical long-range Hamiltonians to geometrically local ones that can be optimized with short-range circuits. Together, these results identify circuit geometry and qubit reconfigurability as task-dependent resources for variational algorithms, relevant to ongoing developments in quantum hardware with long-range connectivity.", "url": "https://arxiv.org/abs/2607.07547", "type": "理论+数值", "summary": "1. 该工作系统研究了稀疏长程纠缠门（尤其是幂次为二的耦合图）在变分量子算法中的效能，揭示了长程连接对算子空间扩展的核心作用。\n2. 通过动力李代数、近似幺正设计诊断及有限深度可表达性分析，表明扩展算子空间并不保证可训练性，并引入将层级长程哈密顿量映射至局域电路的变分优化方案。\n3. 结果为电路几何结构与量子比特重构性作为任务依赖资源提供了理论依据，对具有长程连接能力的量子硬件发展具有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Helene M. Lösl"}, {"name": "Aydin Deger"}, {"name": "Andrew J. Daley"}], "featured_authors": [{"name": "Helene M. Lösl"}, {"name": "Aydin Deger"}, {"name": "Andrew J. Daley"}], "author_count": 3}, {"id": "2607.07554", "category": "quant-ph", "title": "RubriQ: Rubric-Guided Group Relative Policy Optimization for Constraint-Aware Quantum Circuit Synthesis", "abstract": "Designing fault-tolerant quantum circuits that are both algorithmically correct and hardware compatible remains a major bottleneck in the transition to scalable quantum computing. We introduce RubriQ, a scalable framework that formulates circuit synthesis as a large language model (LLM) code-generation task, optimized via group relative policy optimization (GRPO). Unlike conventional black-box neural critics, RubriQ employs a domain-grounded programmatic rubric as the reinforcement learning reward function, evaluating circuits for T-gate reduction, hardware topology compliance, and unitary fidelity. To support high-throughput training, RubriQ integrates GPU-accelerated CUDA-Q simulation directly into the reinforcement learning (RL) loop and is deployed on NERSC Perlmutter using DeepSpeed ZeRO2 across multinode NVIDIA A100 clusters. On benchmark tasks, RubriQ achieves a mean T-gate compression of 3.31x, significantly outperforming sparse-reward RL baselines (2.05x), converging 2-3x faster, and maintaining less than 1\\% hardware-constraint violations. Validated on IBM and IonQ quantum processors, RubriQ establishes an automated, high-performance computing (HPC)-driven pipeline for generating hardware-ready, fault-tolerant quantum circuits at scale.", "url": "https://arxiv.org/abs/2607.07554", "type": "理论+数值", "summary": "1. 该工作提出RubriQ框架，将约束感知量子电路综合表述为大语言模型代码生成任务，并采用群体相对策略优化进行训练。\n2. 其核心在于以领域程序化评分卡替代黑箱神经网络作为奖励函数，联合优化T门压缩、硬件拓扑合规与保真度，并集成GPU加速模拟与HPC分布式训练。\n3. 这为自动化生成硬件就绪的容错量子电路提供了可扩展的高性能计算管道，有望降低量子计算走向实用化的编译开销。", "summary_source": "deepseek", "authors": [{"name": "Ziqing Guo"}, {"name": "Ziwen Pan"}], "featured_authors": [{"name": "Ziqing Guo"}, {"name": "Ziwen Pan"}], "author_count": 2}, {"id": "2607.07572", "category": "quant-ph", "title": "Analysis of the sample complexity for PAC-learning functions defined over quantum states", "abstract": "A fundamental question in PAC learning is determining the number of labeled examples required to learn a concept class to a desired accuracy and confidence. In classical learning theory, this quantity is characterized by the VC-dimension, while several quantum generalizations have established analogous results when examples are provided in quantum superposition. In this work, we study a distinct quantum PAC-learning model in which concepts are functions acting on quantum states. We demonstrate that the VC-dimension, although still relevant, fails to fully capture the sample complexity of this model. To further characterize this setting, we develop a new lower bound on the required number of samples and establish an upper bound when the states in the domain are linearly independent. Remarkably, this upper bound has a form similar to the classical PAC-learning bound. We further examine a setting in which the learner receives more informative data and show that the limitations of the VC-dimension persist in this extended model.", "url": "https://arxiv.org/abs/2607.07572", "type": "理论", "summary": "1. 本文分析了定义在量子态上的函数在PAC学习模型中的样本复杂度，建立了新的下界及在域态线性无关时的上界。\n2. 核心发现是VC维虽仍具相关性，但无法完全刻画该模型的样本复杂度，此局限在信息更丰富的学习设置中依然存在。\n3. 该工作为量子学习理论中函数类复杂性的刻画提供了更精细的约束，并启发对更一般量子态分布场景的样本效率研究。", "summary_source": "deepseek", "authors": [{"name": "Jordi Pérez-Guijarro"}], "featured_authors": [{"name": "Jordi Pérez-Guijarro"}], "author_count": 1}, {"id": "2607.07586", "category": "quant-ph", "title": "Fidelity Analysis of Adiabatically Driven Donor Spins as Two-Qubit and Ququart Systems", "abstract": "Donor spin systems host a native Hilbert space whose dimension exceeds that of a qubit, meaning they can be used as qudits. Here we study a \\ce{Si{:}P} donor spin system through leakage-aware randomized benchmarking (RB) of native ququart $\\mathcal{C}_4$ and encoded two-qubit $\\mathcal{C}_2^{\\otimes 2}$ Clifford groups. We implement adiabatic ramps to operate electron dipole spin resonance (EDSR) pulses at the ionization point, where the electron is shared halfway between the donor and the interface, and to operate electron spin resonance (ESR) pulses near the interface, motivated by the sensitivity of the effective magnetic field to charge noise at the ionization point. By placing the electron near the ionization point only during EDSR control and using sufficiently long displacement ramp durations, leakage outside the computational basis is strongly suppressed, which is crucial for optimized qudit control. We find in our analysis based on leakage RB that $\\mathcal{C}_4$ consistently achieves $\\sim 40$--$50\\%$ lower (lower-bound) error rates $\\varepsilon^{\\mathrm{LB}}_\\mathrm{PT}$ with respect to $\\mathcal{C}_2^{\\otimes 2}$, due to its reduced circuit complexity. These results indicate that donor spin qudits benefit from genuine qudit operation as opposed to imposed encoded qubit operation.", "url": "https://arxiv.org/abs/2607.07586", "type": "理论+数值", "summary": "1. 本文通过泄漏感知随机基准测试，实验比较了Si:P施主自旋体系中原生四能级量子系统(C₄)与编码双量子比特系统(C₂⊗²)的保真度。\n2. 技术核心在于利用绝热斜坡实现电子在电离点与界面间的位移，在电偶极自旋共振控制中抑制计算基外泄漏，从而优化高维量子态操作。\n3. 结果表明C₄的下界错误率较C₂⊗²低40-50%，证明施主自旋原生qudit操作优于编码qubit操作，为高维量子信息处理提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Brian Michon"}, {"name": "James Keppens"}, {"name": "Ashutosh Kinikar"}, {"name": "George Simion"}, {"name": "Kristof Moors"}, {"name": "Bart Sorée"}], "featured_authors": [{"name": "Brian Michon"}, {"name": "James Keppens"}, {"name": "Ashutosh Kinikar"}, {"name": "George Simion"}, {"name": "Kristof Moors"}, {"name": "Bart Sorée"}], "author_count": 6}, {"id": "2607.07607", "category": "quant-ph", "title": "Covariant Approximate Quantum Codes for Protected Analog Computation", "abstract": "Quantum error correction compatible with continuous symmetries is a fundamental problem in quantum information and a possible route to robust analog quantum simulation. Because the Eastin-Knill theorem forbids exact codes with continuous transversal symmetries, we construct explicit $SU(d)$-covariant approximate codes that exploit permutation symmetry to spread logical information uniformly across all physical subsystems. For one-, two-, and three-qudit erasures at known locations, we prove worst-case purified-distance scaling $\\Theta(1/N)$, matching approximate Eastin-Knill lower bounds up to constants, and we extend the reduced-state analysis to general flagged local noise. For single-qudit erasure, we construct an explicit near-optimal decoder from the Petz recovery map. We then use these codes as building blocks for encoded analog dynamics. Symmetry-preserving Hamiltonians generate block-structured dynamical Lie algebras implementable transversally, while controlled symmetry-breaking terms serve as non-transversal resources for universal dynamics. These results provide explicit non-Abelian covariant codes and a framework for robust analog quantum simulation.", "url": "https://arxiv.org/abs/2607.07607", "type": "理论+数值", "summary": "1. 该工作构造了显式SU(d)协变近似量子纠错码，利用置换对称性将逻辑信息均匀散布于所有物理子系统，以绕过Eastin-Knill定理对连续横向对称性的禁止。\n2. 核心进展在于证明对已知位置的一至三量子比特擦除，最坏情况净化距离标度为Θ(1/N)，匹配近似Eastin-Knill下界；基于Petz恢复映射实现近最优单擦除译码，并揭示对称性保持哈密顿量生成横向块结构李代数、受控对称性破缺项提供非横向通用动力学资源。\n3. 这为非阿贝尔协变码的显式构造及鲁棒模拟量子模拟建立了框架，对保护连续对称性的模拟计算与编码动力学实验具有直接指导意义。", "summary_source": "deepseek", "authors": [{"name": "Mariia Elovenkova"}, {"name": "Hong-Ye Hu"}, {"name": "Susanne F. Yelin"}], "featured_authors": [{"name": "Mariia Elovenkova"}, {"name": "Hong-Ye Hu"}, {"name": "Susanne F. Yelin"}], "author_count": 3}, {"id": "2607.07614", "category": "quant-ph", "title": "Multi-stage Quantum Amplifier Readout Chain", "abstract": "Multi-stage cryogenic readout chains with a wide bandwidth and added noise within a few quanta of the quantum limit are frequently constructed using traveling-wave parametric amplifiers (TWPAs) as the first stage, and a semiconductor amplifier as the second stage. Unfortunately for highly-scaled superconducting detector arrays, or quantum information systems, and space-based observatories, the power dissipation of the semiconductor amplifier becomes problematic from the perspective of available cryogenic cooling power at \\mbox{3~K to 4~K}. Here we demonstrate a readout chain based on a two-stage kinetic inductance TWPA (KTWPA). This quantum-amplifier-based-readout-chain (QARC) provides sufficient gain that a cryogenic semiconductor follow-on amplifier can be eliminated without degradation of the system noise. In this way, the QARC dissipates approximately three orders of magnitude less power than readout chains containing semiconductor amplifiers while adding noise of less than 2~quanta over a 1~GHz bandwidth. In addition, by leveraging the high power handling of kinetic inductance technology, the QARC maintains an input compression point of -93~dBm, which exceeds that of many contemporary Josephson-junction-based parametric amplifiers.", "url": "https://arxiv.org/abs/2607.07614", "type": "理论", "summary": "1. 该工作演示了一种基于两级动力学电感行波参量放大器的量子放大器读出链（QARC），用于超导探测器阵列与量子信息系统。\n2. 其技术核心在于无需低温半导体第二级放大，功耗降低约三个数量级（至微瓦量级），同时在1 GHz带宽内附加噪声低于2个量子，输入压缩点达-93 dBm。\n3. 该方案为大规模超导量子比特读出、空间天文观测等对低温冷却功率严格受限的应用提供了低功耗、高保真度的读出路径。", "summary_source": "deepseek", "authors": [{"name": "Logan Howe"}, {"name": "Andrea Giachero"}, {"name": "Michael Vissers"}, {"name": "Corwin Shiu"}, {"name": "Shannon Duff"}, {"name": "Jason Austermann"}, {"name": "Johannes Hubmayr"}, {"name": "Joel Ullom"}], "featured_authors": [{"name": "Logan Howe"}, {"name": "Andrea Giachero"}, {"name": "Michael Vissers"}, {"name": "Jason Austermann"}, {"name": "Johannes Hubmayr"}, {"name": "Joel Ullom"}], "author_count": 8}, {"id": "2607.07691", "category": "quant-ph", "title": "Faster quantum linear system solver beyond the condition number", "abstract": "The spectral condition number is a widely adopted measure of worst-case cost for quantum linear system solvers. Yet it can significantly overestimate the actual runtime for a typical problem instance. We present two quantum algorithms that produce the normalized solution $|x\\rangle$ of linear system $Ax=| b \\rangle$ to accuracy $\\epsilon$ with complexity independent of the condition number $\\kappa=\\lVert A^{-1}\\rVert$. We focus on the standard input model where $A$ is accessed through a block encoding and $| b \\rangle$ is prepared by a unitary. But we also introduce an affine dilation model that encodes $A$ and $| b \\rangle$ jointly, allowing further refinements of the query complexity. Our truncation-based solver makes an optimal number of queries to $| b \\rangle$ and $\\operatorname{\\mathbf{O}}\\left(\\kappa_{\\mathrm{eff}}\\operatorname{polylog}\\left(\\frac{\\kappa_{\\mathrm{eff}}}{\\epsilon}\\right)\\right)$ queries to $A$. We prove a family of upper bounds on the effective condition number, including $\\kappa_{\\mathrm{eff}}\\leq\\frac{\\lVert(A^\\dagger A)^{-t/2}|x\\rangle\\rVert^{1/t}}{\\epsilon^{1/t}}$ for positive even integer $t$ and $\\kappa_{\\mathrm{eff}}\\leq\\frac{\\lVert A^{-1\\dagger}(A^\\dagger A)^{-(t-1)/2}|x\\rangle\\rVert^{1/t}}{\\epsilon^{1/t}}$ for positive odd $t$, overcoming the $\\kappa$-barrier. Our filtering-based solver is extremely simple with a favorable runtime prefactor. In particular, the solver has query complexity $6\\frac{\\lVert A^{-1\\dagger}|x\\rangle\\rVert}{\\epsilon}\\ln\\left(\\frac{1}{\\epsilon}\\right)$ to leading order when the solution norm is known. We then present a similarly simple solution norm estimator with the same asymptotic cost up to logarithmic factors. Our quantum linear system solvers thus substantially improve a recent algorithm of Li, enabling faster quantum linear system solving beyond the condition number.", "url": "https://arxiv.org/abs/2607.07691", "type": "理论+数值", "summary": "1. 该工作提出两种量子线性系统求解算法，其查询复杂度与谱条件数κ无关，可产生给定精度的归一化解。\n2. 通过引入有效条件数κ_eff的上界族及仿射膨胀模型，算法以截断或滤波方式使复杂度仅依赖于解相关量，克服传统κ障碍。\n3. 这为在典型实例中绕过最坏情况条件数瓶颈提供了系统化途径，并可能启发更高效的实用量子算法设计。", "summary_source": "deepseek", "authors": [{"name": "Alexander M. Dalzell"}, {"name": "Jianqiang Li"}, {"name": "Yuan Su"}], "featured_authors": [{"name": "Alexander M. Dalzell"}, {"name": "Jianqiang Li"}, {"name": "Yuan Su"}], "author_count": 3}, {"id": "2607.07701", "category": "quant-ph", "title": "Multi-channel collective dissipation via the symmetric irreducible representation of SU(4)", "abstract": "We specialize Agarwal's multi-level collective spontaneous-emission formalism to the four-level case by formulating it in the fully symmetric \\SU(4) representation of $N$ identical atoms. In the irreducible representation $(N,0,0)$, the occupation-number basis forms a tetrahedral weight lattice on which the six embedded $\\mathfrak{su}(2)$ transition subalgebras act as ladder operators. From these algebraic factors we obtain a compact Pauli-type population-rate equation and a closed-form expression for the total emitted intensity that apply to any combination of open dipole channels. The formalism is then specialized to the seven dipole-allowed four-level topologies -- tripod, inverted tripod, Y, inverted Y, double-$\\Lambda$, closed cascade, and diamond -- and the resulting rate equations are solved numerically for atom numbers up to $N=50$. In every case the emitted intensity develops a delayed cooperative burst whose peak height obeys a power law $I_{\\mathrm{peak}}=aN^{p}$ with topology-dependent parameters $(a,p)$; the fitted exponents lie in the range $1.81\\lesssim p\\lesssim 1.92$, indicating a superlinear. The \\SU(4) tetrahedral flow and the seven configuration-dependent transients together provide a unified geometric picture of multi-channel collective dissipation in four-level atomic ensembles.", "url": "https://arxiv.org/abs/2607.07701", "type": "理论+数值", "summary": "1. 该工作基于N个全同原子的完全对称SU(4)不可约表示(N,0,0)及其四面体重晶格结构，将多能级集体自发辐射形式专门推广至四能级情况。\n2. 其物理要点在于利用六个嵌入su(2)跃迁子代数作为阶梯算符，导出紧凑的Pauli型布居速率方程和总发射强度闭式表达式，并通过对七种偶极允许拓扑（tripod、Y、双Λ等）数值求解至N=50，揭示出延迟合作爆发峰强满足拓扑依赖幂律I_peak=aN^p，指数p介于1.81至1.92。\n3. 该基于SU(4)四面体流的统一几何图像为多通道集体耗散现象提供了清晰框架，并启发将此类对称可约化方法推广至更复杂能级结构的协同动力学研究。", "summary_source": "deepseek", "authors": [{"name": "M. Lutsukh"}, {"name": "M. Bazarsana"}, {"name": "T. Begzjav"}, {"name": "G. O. Ariunbold"}], "featured_authors": [{"name": "M. Lutsukh"}, {"name": "M. Bazarsana"}, {"name": "T. Begzjav"}, {"name": "G. O. Ariunbold"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
