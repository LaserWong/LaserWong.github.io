al: Inhomogeneous fluctuation-induced asymmetric escape", "abstract": "We present an inhomogeneous fluctuation-induced asymmetric escape event of a Feller diffusion confined to a finite interval with two competing absorbing boundaries. The dynamics correspond to an overdamped Brownian motion in a shifted harmonic potential with state-dependent diffusivity. We set two exit points (equal potential energies), equidistant from the potential minima: an extinction site near the origin and an outbreak point. The multiplicative fluctuations are suppressed near the extinction boundary, biasing trajectories toward the outbreak state. The mean exit time exhibits a non-monotonic dependence on the initial condition and the drift-to-noise strength ratio, attaining a maximum when the particle is initialized toward the extinction (low-noise) site. The outbreak possibility is more likely even if the process started with a small initial bias towards the low-noise boundary. The spatial location of the lowest coefficient of variation (CV) is nicely corroborated by the maximum exit time, which is the hallmark of a stochastic escape from an interval. The fluctuation in escape time is found to dominate its mean as a non-trivial function of the drift-to-noise strength and the initial spatial bias. The observed asymmetries in escape also shape the speed-accuracy trade-off in stochastic decision-making events.", "url": "https://arxiv.org/abs/2607.07649", "type": "理论", "summary": "1. 本工作研究了限定于有限区间内Feller扩散的非均匀涨落诱导非对称逃逸，系统两端为等势竞争吸收边界。\n2. 其物理核心在于乘性涨落因态依赖扩散系数而在近灭绝边界受抑制，导致平均逃逸时间随初始条件非单调变化，且变异系数极小点与最大逃逸时间对应。\n3. 该非对称逃逸机制为理解随机决策过程中的速度-准确度权衡提供了定量模型启示，并可能推广至涨落诱导的偏倚涌现问题。", "summary_source": "deepseek", "authors": [{"name": "Prashanta Bauri"}, {"name": "Debasish Mondal"}], "featured_authors": [{"name": "Prashanta Bauri"}, {"name": "Debasish Mondal"}], "author_count": 2}, {"id": "2607.07656", "category": "cond-mat", "title": "Ordering and Defect Dynamics in Passive and Active Nematopolars", "abstract": "The coexistence of polar and nematic interactions, observed in a broad range of biological and synthetic active systems, gives rise to a rich phenomenology that continues to challenge our theoretical understanding of non-equilibrium collective behaviour. In this paper, we numerically investigate phase ordering and defect dynamics in a newly introduced minimal single-field model for dry nematopolar systems, where competing polar and nematic contributions enter the free energy, and activity is implemented through a self-advection contribution. At optimal balance between the two alignments, the system develops depolarization strings connecting half-integer defects and separating domains with opposite polarization, together with closed depolarization loops. We first characterize the elementary relaxation mechanisms of defect pairs and loops, showing that the interplay between polar and nematic alignment gives rise to non-monotonic string-mediated interactions, finite equilibrium separations and distinct loop-collapse pathways. Large-scale simulations from disordered states instead show dynamic scaling with a characteristic length growing as $\\sim(t/\\ln t)^{1/2}$, consistent with coarsening in systems with non-conserved order parameters and point-like defects. Upon introducing self-advection, sufficiently strong activity leads to the coexistence of positive integer and negative half-integer defects, which we term motility-induced charge symmetry breaking, and to saturation of the characteristic length scales, ultimately resulting in arrested coarsening. Overall, our results provide a simple unified framework for understanding the ordering and defect dynamics in biological and synthetic nematopolar systems.", "url": "https://arxiv.org/abs/2607.07656", "type": "理论+数值", "summary": "1. 本文数值研究了干性向列-极性系统最小单场模型中的相有序与缺陷动力学，其中极性与向列排列在自由能中竞争，活性通过自对流失真引入。\n2. 卖点在于揭示去极化弦连接的半整数缺陷间非单调相互作用及不同环塌缩路径，无序初态粗化符合∼(t/ln t)^{1/2}标度律，强活性下迁移诱导的电荷对称性破缺导致特征长度饱和与粗化停滞。\n3. 这为理解生物与合成活性系统中极性与向列相互作用驱动的非平衡有序化及缺陷行为提供了统一的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Fabio Aprile"}, {"name": "Massimiliano Semeraro"}, {"name": "Giuseppe Gonnella"}], "featured_authors": [{"name": "Fabio Aprile"}, {"name": "Massimiliano Semeraro"}, {"name": "Giuseppe Gonnella"}], "author_count": 3}, {"id": "2607.06657", "category": "hep-th", "title": "Towards gauge independence in asymptotically safe quantum gravity", "abstract": "We study gauge dependence in proper-time renormalisation group flows for asymptotically safe quantum gravity. Working in an essential scheme, we use field redefinitions to separate redundant off-shell contributions from the on-shell running of physical couplings. We consider two approximations: in the first, we work on general backgrounds and project onto all terms with up to four derivatives, neglecting boundary terms; in the second, we work on a maximally symmetric background and retain all orders in the Ricci scalar. Although the flow equation depends on the gauge parameters, this dependence can be cancelled order by order once the redundant terms are absorbed by field redefinitions. In the four-derivative approximation, the dependence on the retained gauge parameter drops out of the beta function for Newton's constant to third order in the coupling. On the sphere, the flow becomes independent of both parameters of the general gauge to all curvature orders, and all orders in the coupling. Crucially, this cancellation depends on the choice of regulator. We verify the mechanism explicitly at one loop, where the gauge-dependent fluctuation contributions are cancelled by the ghost sector on shell. The resulting essential flow displays a gauge-independent non-Gaussian fixed point, supporting the interpretation that universal information in quantum gravity is encoded in the on-shell essential sector.", "url": "https://arxiv.org/abs/2607.06657", "type": "理论", "summary": "1. 该工作运用固有方案与场重定义，系统分析了渐近安全量子引力中规范参数对proper-time重整化群流的依赖关系。\n2. 其在四导数近似和球对称背景上，通过吸收冗余离壳贡献实现了牛顿常数beta函数对规范参数的高阶无关性，并揭示该消除机制依赖于调节函数选取。\n3. 所得规范无关的非高斯固定点支持了量子引力中普适信息完全编码于在壳本质部分的物理诠释。", "summary_source": "deepseek", "authors": [{"name": "Kevin Falls"}, {"name": "Renata Ferrero"}, {"name": "Giovanni Oglialoro"}], "featured_authors": [{"name": "Kevin Falls"}, {"name": "Renata Ferrero"}, {"name": "Giovanni Oglialoro"}], "author_count": 3}, {"id": "2607.06661", "category": "hep-th", "title": "Perturbiner methods in scattering amplitude", "abstract": "Berends--Giele currents have recently attracted renewed attention across the amplitude community, appearing in new contexts ranging from gravitational amplitudes to cosmological correlators and string theory. They can be derived from first principles using the perturbiner method, a thirty-year-old framework that organizes tree-level scattering data in the form of classical multi-particle solutions to field theory equations of motion. After its rediscovery about a decade ago, it has been systematically studied and applied in many different contexts. This review aims to provide a pedagogical introduction to the method, covering its basic formulation across a broad (but certainly not exhaustive) range of models and progressing to some of the most recent findings in the literature. This includes several unpublished results, many of which represent tacit knowledge of the community that has not previously appeared in print.", "url": "https://arxiv.org/abs/2607.06661", "type": "理论", "summary": "1. 该工作系统回顾了Perturbiner方法在散射振幅中的基本表述与应用，涵盖引力振幅、宇宙学关联函数及弦论等多个领域。\n2. 其技术核心在于将树图级散射数据组织为经典场论多粒子解，并首次整合了此前社区内未发表的隐性知识。\n3. 这为统一理解树图振幅结构及拓展至环图计算提供了清晰的教学框架与潜在研究路径。", "summary_source": "deepseek", "authors": [{"name": "Renann Lipinski Jusinskas"}], "featured_authors": [{"name": "Renann Lipinski Jusinskas"}], "author_count": 1}, {"id": "2607.06663", "category": "hep-th", "title": "Generalised global symmetries in 5d $\\mathcal{N}=1$ theories from the blow-up equations", "abstract": "Five-dimensional $\\mathcal{N}=1$ superconformal field theories admit a rich variety of generalised global symmetries, including higher-form symmetries, 2-group symmetries, and their 't$~$Hooft anomalies. We show that this data can be extracted directly from the blow-up equations that govern the instanton partition functions of such theories on the $\\Omega$-background. The central object is the classical prefactor $\\exp(-V_n)$ that weights each magnetic flux on the blown-up geometry: evaluated on a background for the electric 1-form symmetry, the fractional parts of its exponents encode the cubic self-anomaly of the 1-form symmetry, as well as its mixed anomalies with the instanton, flavour, gravitational, and $\\mathrm{SU}(2)_R$ symmetries. Combined with the faithful continuous global symmetry of the ultraviolet fixed point, which we determine from the superconformal index, the same data decides whether the theory possesses a 2-group symmetry or a mixed 't$~$Hooft anomaly. We illustrate the method in gauge theories, including $\\mathrm{SU}(4)$ and $\\mathrm{USp}(4)$ with antisymmetric hypermultiplets, and $\\mathrm{Spin}(7)$ and $\\mathrm{Spin}(8)$ with vector hypermultiplets, as well as in several families of non-Lagrangian theories, for which we obtain new results: notably, the effective prepotentials of the $B_N$ and $B_N^{(1,2,3)}$ families, the cubic 1-form anomalies of the rank-two theories $\\mathbb{P}^2\\cup\\mathbb{F}_3$ and $\\mathbb{P}^2\\cup\\mathbb{F}_6$, and several mixed anomalies involving the 1-form and flavour symmetries.", "url": "https://arxiv.org/abs/2607.06663", "type": "理论", "summary": "1. 该工作证明，从Ω背景上瞬子配分函数的blow-up方程可直接提取五维𝒩=1超共形场论中高形式对称性、2-群对称性及其’t Hooft异常的数据。\n2. 核心机制在于，加权磁通贡献的经典前因子exp(-V_n)的指数分数部分编码了1-形式对称性的三次自异常以及与瞬子、味道、引力和SU(2)_R对称性的混合异常。\n3. 这一途径结合超共形指数确定的忠实连续全局对称性，为判定2-群对称性存在与否提供了系统的代数判据，并能在非拉格朗日理论中计算新的有效预势能和混合异常。", "summary_source": "deepseek", "authors": [{"name": "William Harding"}, {"name": "Noppadol Mekareeya"}], "featured_authors": [{"name": "William Harding"}, {"name": "Noppadol Mekareeya"}], "author_count": 2}, {"id": "2607.06666", "category": "hep-th", "title": "Effective Field Theories for Material Media", "abstract": "We review recent progress in understanding certain aspects of condensed matter systems from a high energy theory perspective. We discuss effective field theories that describe collective bulk and localized excitations in a variety of solid and fluid systems. Particular emphasis is placed on the role played by spacetime symmetries and their spontaneous breaking. The resulting Goldstone dynamics can be seen as underlying a wide variety of phenomena. We attempt to bridge the language gap between subfields while underscoring the numerous conceptual similarities.", "url": "https://arxiv.org/abs/2607.06666", "type": "理论", "summary": "1. 该工作回顾了从高能理论视角理解凝聚态物质介质的最新进展，聚焦于描述固体和流体中集体与局域激发的有效场论框架。\n2. 其核心卖点在于系统阐述时空对称性及其自发破缺如何主导Goldstone动力学，并以此统一解释多种凝聚态现象。\n3. 这为弥合高能与凝聚态理论子领域之间的语言鸿沟提供了概念桥梁，并启发对物质介质中激发谱的普适性理解。", "summary_source": "deepseek", "authors": [{"name": "Angelo Esposito"}, {"name": "Alberto Nicolis"}, {"name": "Riccardo Penco"}], "featured_authors": [{"name": "Angelo Esposito"}, {"name": "Alberto Nicolis"}, {"name": "Riccardo Penco"}], "author_count": 3}, {"id": "2607.06669", "category": "hep-th", "title": "Monodromy defects in Chern-Simons theory and Holography", "abstract": "Wilson loop operators in Chern-Simons theory have revealed profound links between quantum field theory, the fractional quantum Hall effect, topology, conformal field theory, and string theory. In Chern-Simons theories with charge conjugation symmetry, we construct a new class of observables: codimension-two monodromy defects around which fields return to themselves up to charge conjugation. Whereas Wilson loops are labeled by integrable representations of an untwisted affine Lie algebra, monodromy defects are labeled by those of the corresponding twisted affine algebra. The modular and fusion data of these two algebras determine the exact correlation functions of Wilson lines and monodromy defects, which together furnish a $\\mathbb{Z}_2$-crossed braided tensor category. The spectrum of line defects in Chern-Simons theory thus gives a physical realization of every algebra in Kac's classification of affine Lie algebras: untwisted for Wilson loops, twisted for monodromy defects. We also determine the exact 't Hooft expansion of monodromy defects in $SU(N)_k$ Chern-Simons theory and identify their holographic duals in topological string theory. The insertion of the lightest monodromy defect has a striking effect: it replaces the resolved conifold background of the Gopakumar-Vafa duality by a specific orientifold of the resolved conifold, transmuting the dual theory of oriented strings into one of unoriented strings. Each excited monodromy defect is then realized as a collection of branes in the orientifold background, with the brane content determined by the representation of the twisted affine algebra that labels the defect.", "url": "https://arxiv.org/abs/2607.06669", "type": "理论", "summary": "1. 该工作在具有电荷共轭对称性的Chern-Simons理论中构造了余维二单值性缺陷，并研究其关联函数。\n2. 其核心卖点在于缺陷由扭仿射李代数标记，与Wilson环的未扭代数构成Z2交叉辫张量范畴，且最轻缺陷在全息对偶中将定向弦背景代换为非定向弦背景。\n3. 这为Chern-Simons理论中缺陷谱的分类及其与拓扑弦对偶和分数霍尔效应的深层联系提供了具体实现的范例。", "summary_source": "deepseek", "authors": [{"name": "Federico Ambrosino"}, {"name": "Jaume Gomis"}, {"name": "Suriyah Rajalingam Kannagi"}], "featured_authors": [{"name": "Federico Ambrosino"}, {"name": "Jaume Gomis"}, {"name": "Suriyah Rajalingam Kannagi"}], "author_count": 3}, {"id": "2607.06679", "category": "hep-th", "title": "Classical conformal invariance and superhorizon dynamics in de Sitter", "abstract": "Soft de Sitter Effective Theory is a well-motivated candidate for the correct effective late-time description of equal-time correlation functions in de Sitter space. In this work, we study its application to theories that enjoy classical conformal invariance, using the conformally-coupled $\\phi^4$-theory as a toy model. While quantum effects generate non-trivial late-time dynamics in such models, we argue that it is not described by the standard construction of the effective theory as discussed thus far in the literature. We show that the tree-level matching of the trispectrum onto the effective theory does not fit into the expected power-counting scheme, and we contrast it with the matching of the tree-level bispectrum in the conformally-coupled $\\phi^3$-theory, where it works consistently. We then propose a prescription to identify the leading superhorizon degrees of freedom in such theories, which should serve as the starting point for the construction of their late-time effective description. The interpretation of logarithms of the form $\\log(-k\\eta)$ in this context is briefly discussed.", "url": "https://arxiv.org/abs/2607.06679", "type": "理论", "summary": "1. 该工作以共形耦合φ^4理论为玩具模型，检验软de Sitter有效理论在经典共形不变体系中的适用性。\n2. 核心发现是树图级三谱匹配不符合预期幂次计数，与φ^3理论的双谱匹配形成对比，据此提出超视界主导自由度的辨识方案。\n3. 这一辨识方案为构建此类理论的晚期有效描述提供了出发点，并对形如log(-kη)的对数项在超视界动力学中的角色予以澄清。", "summary_source": "deepseek", "authors": [{"name": "Maria Cristina Fiore"}, {"name": "Andrea F. Sanfilippo"}], "featured_authors": [{"name": "Maria Cristina Fiore"}, {"name": "Andrea F. Sanfilippo"}], "author_count": 2}, {"id": "2607.06680", "category": "hep-th", "title": "Evidence for renormalized instantons in real-time simulations of vacuum decay", "abstract": "While vacuum decay is traditionally described by Euclidean instanton methods, lattice simulations enable real-time modeling of dynamical observables relevant to cosmology and upcoming cold-atom analog experiments. We investigate the relationship between these approaches by extracting ensemble-averaged bubble profiles from zero-temperature simulations of a relativistic scalar field. Our observed profiles differ markedly from the bare Coleman bounce and classical thermal predictions. However, we find that instanton solutions in an appropriately renormalized potential reproduce both the measured profiles and their dependence on the UV cutoff, and predict decay rates consistent with simulations across the parameter range considered. The fact that a single renormalized Euclidean object captures these independent observables provides strong evidence that renormalization accounts for the discrepancy between the two formalisms, and establishes a quantitative link between instanton predictions, lattice simulations, and forthcoming empirical tests of vacuum decay.", "url": "https://arxiv.org/abs/2607.06680", "type": "理论", "summary": "1. 该工作通过零温相对论标量场的实时格点模拟，提取了系综平均的真空衰变泡轮廓，并与重整化瞬子预言进行定量比较。\n2. 其核心发现在于，适当地重整化势中的瞬子解能同时重现泡轮廓及其对紫外截断的依赖，并正确预测衰变速率，从而弥合了欧几里得方法与实时模拟间的表观分歧。\n3. 这为建立瞬子预言、格点模拟与冷原子类比实验之间的定量联系提供了坚实依据，并对宇宙学真空衰变可观测效应的理论描述具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Emilie Hertig"}, {"name": "Alexander C. Jenkins"}, {"name": "Hiranya V. Peiris"}, {"name": "Andrew Pontzen"}, {"name": "Matthew C. Johnson"}], "featured_authors": [{"name": "Emilie Hertig"}, {"name": "Alexander C. Jenkins"}, {"name": "Hiranya V. Peiris"}, {"name": "Andrew Pontzen"}, {"name": "Matthew C. Johnson"}], "author_count": 5}, {"id": "2607.06695", "category": "hep-th", "title": "Geometry-induced Casimir response in a helicoidal spacetime", "abstract": "We investigate the Casimir response of a massive scalar field in a torsionless helicoidal spacetime with Levi-Civita connection. The background is ultrastatic and curved, with scalar curvature \\(R=-2\\Omega^2\\), and its off-diagonal metric component induces a geometric coupling between angular and axial quantum numbers. We show that individual modes exhibit a linear helicoidal splitting, whereas the linear contribution cancels in the nonchiral vacuum sum. The leading Casimir correction is therefore quadratic in the twist and defines a helicoidal vacuum susceptibility after local ultraviolet subtractions. For a cylindrical Dirichlet cavity, we compute this scheme-defined susceptibility and the associated correction to the radial Casimir force. The results identify torsionless helicoidal geometry as a controlled setting in which mode-level chirality produces a finite quadratic response of vacuum fluctuations.", "url": "https://arxiv.org/abs/2607.06695", "type": "理论", "summary": "1. 该工作计算了无扭转螺旋时空中大质量标量场的Casimir响应，背景为曲率标量R=-2Ω²的类超静态弯曲时空。\n2. 其核心在于发现非对角度规分量导致角动量与轴向量子数几何耦合，单模呈现线性螺旋分裂，但非手征求和抵消后主导项为二次扭转响应。\n3. 这为手征几何中真空涨落的可控二次效应提供了定量框架，并给出了圆柱Dirichlet腔中径向Casimir力的螺旋修正。", "summary_source": "deepseek", "authors": [{"name": "Edilberto O. Silva"}], "featured_authors": [{"name": "Edilberto O. Silva"}], "author_count": 1}, {"id": "2607.06738", "category": "hep-th", "title": "Integrable systems inspired by DAHA and DIM algebra: type $C^\\vee C$ versus type $A$", "abstract": "The Ding-Iohara-Miki (DIM) algebra (quantum toroidal algebra of $\\widehat{gl_1}$) is related to a wide class of quantum many-particle integrable systems, a typical one being the Ruijsenaars trigonometric system with eigenfunctions that are a triad formed by the Noumi-Shiraishi power series, the Macdonald polynomials, and the Baker-Akhiezer multivariable function. Other integrable systems of this type are obtained from the Ruijsenaars system by twisting. At the same time, the Ruijsenaars Hamiltonians are directly related to the Hamiltonians of another quantum integrable system, the Cherednik DAHA Hamiltonians of type $A$ (and their twisted versions in the twisted case), due to the correspondence between the DIM algebra and the spherical DAHA. The eigenfunctions of the DAHA Hamiltonians are non-symmetric Macdonald polynomials. Similarly, there is a class of integrable DAHA Hamiltonians of type $C^\\vee C$, the spherical version of which, in turn, allows one to generate integrable Koornwinder Hamiltonians. The eigenfunctions of these two integrable systems are, respectively, non-symmetric and symmetric Koornwinder polynomials, which are our main interest in this paper. Here we consider the cases of both type $A$ and type $C^\\vee C$ systems, since they are sufficiently similar, and point out important distinctions between them.", "url": "https://arxiv.org/abs/2607.06738", "type": "理论", "summary": "1. 该工作基于DAHA和DIM代数研究了A型和C^∨C型两类可积系统，并指出二者关键区别。\n2. 其核心在于通过球形DAHA与DIM代数的对应，将Ruijsenaars系统与DAHA哈密顿量联系，并推广至Koornwinder系统，本征函数分别为非对称和对称Koornwinder多项式。\n3. 这为统一理解这些可积系统及其在量子多体问题中的代数结构与本征函数关系提供了框架启发。", "summary_source": "deepseek", "authors": [{"name": "L. Bishler"}, {"name": "A. Mironov"}, {"name": "A. Popolitov"}], "featured_authors": [{"name": "L. Bishler"}, {"name": "A. Mironov"}, {"name": "A. Popolitov"}], "author_count": 3}, {"id": "2607.06826", "category": "hep-th", "title": "BMS$_3$ invariant field theories", "abstract": "We review existing and construct new two-dimensional field theories that exhibit BMS$_3$ symmetry, with and without central extensions. These include interacting electric, magnetic and canonical BMS$_3$ scalar theories, as well as couplings between the electric and magnetic sectors. We provide a careful analysis of boundary contributions at the corner points $u\\rightarrow\\pm\\infty$, determine the counterterms and boundary conditions required by BMS$_3$ invariance, and study the corresponding variational principles. Furthermore, we introduce external sources and derive the associated flux-balance laws. Within the framework of flat-space holography, we show that a simple free electric BMS$_3$ model with the appropriate central charge reproduces the monodromy classification of three-dimensional Einstein gravity. Finally, we investigate the flat-space limits of both AdS$_3$ and dS$_3$, whose boundary dynamics are described by Carrollian limits of Liouville and Euclidean Liouville theory, respectively. Although the resulting BMS$_3$ theories possess isomorphic spectra, they differ in the signs of the supertranslation charges and the central charge. This suggests that the flat-space limits of AdS$_3$ and dS$_3$ provide complementary realizations of flat-space holography.", "url": "https://arxiv.org/abs/2607.06826", "type": "理论", "summary": "1. 该工作构造并分析了一系列具有BMS₃对称性的二维场论，涵盖电、磁及规范型标量模型及其耦合。\n2. 其核心在于精确处理了边界贡献与反项，论证了自由电BMS₃模型通过正确中心荷重现三维爱因斯坦引力的单值性分类。\n3. 这暗示AdS₃与dS₃的平直极限为平面对偶提供了互补实现，二者谱同构但超平移荷与中心荷符号相反。", "summary_source": "deepseek", "authors": [{"name": "Diego Hidalgo"}, {"name": "Stefan Vandoren"}, {"name": "Huaxuan Zeng"}], "featured_authors": [{"name": "Diego Hidalgo"}, {"name": "Stefan Vandoren"}, {"name": "Huaxuan Zeng"}], "author_count": 3}, {"id": "2607.06851", "category": "hep-th", "title": "5d Higgs Branches: Stratifications from Geometry", "abstract": "Higgs Branches of 5d SCFTs are hyperkähler cones, symplectic varieties with interesting nested singularities governing the structure of possible Higgs branch RG flows. The main purpose of this note is to investigate 5d Higgs Branches via a geometric route: we study 5d SCFTs geometrically engineered from M-theory on non-compact Calabi-Yau threefolds, with non-isolated singularities. We match the (dynamical) complex structure deformations of the threefold with the symplectic leaves in the Higgs branch of the 5d SCFT, constructing its stratification purely relying on geometry. Consistency checks for our proposal are presented exploiting magnetic quivers.", "url": "https://arxiv.org/abs/2607.06851", "type": "理论", "summary": "1. 该工作利用M理论在含非孤立奇点的非紧Calabi-Yau三折叠上的几何工程，系统研究了5d超共形场论中Higgs分支的超凯勒锥结构及其嵌套奇点。\n2. 其核心卖点在于将三折叠的复结构形变与Higgs分支的辛叶分层精确对应，仅依赖几何构造出完整分层，并借助磁箭图完成一致性验证。\n3. 该纯几何方法为从几何数据直接推断5d Higgs分支的重整化群流结构提供了统一框架，并为理解量子场论红外相图开辟了新路径。", "summary_source": "deepseek", "authors": [{"name": "Mario De Marco"}, {"name": "Michele Del Zotto"}, {"name": "Julius Grimminger"}, {"name": "Andrea Sangiovanni"}], "featured_authors": [{"name": "Mario De Marco"}, {"name": "Michele Del Zotto"}, {"name": "Julius Grimminger"}, {"name": "Andrea Sangiovanni"}], "author_count": 4}, {"id": "2607.06867", "category": "hep-th", "title": "On Integrable Structures on Non-compact Boundaries in Three-Dimensional Gravity", "abstract": "We study three-dimensional Einstein gravity with negative cosmological constant on non-compact spatial boundaries within the Chern-Simons formulation. Using an exact fluid/gravity correspondence, we derive a closed radial flow equation for the quasi-local stress tensor and show that it realizes the holographic $T\\bar T$ deformation at finite cutoff. We further develop the inverse-scattering description of the boundary dynamics, identifying the gravitational interpretation of the associated spectral data and analyzing the finite-cutoff deformation of soliton solutions. Although the boundary evolution is governed by an integrable bi-Hamiltonian hierarchy, we show that the radial flow itself is not Hamiltonian with respect to the canonical Poisson structure. Our results establish a unified framework connecting integrability, quasi-local gravitational observables, inverse scattering, and finite-cutoff holography on non-compact boundaries.", "url": "https://arxiv.org/abs/2607.06867", "type": "理论", "summary": "1. 该工作基于陈-西蒙斯形式，推导出三维负宇宙常数引力中非紧致边界上准局部应力张量的径向流动方程。\n2. 其核心在于揭示该方程在有限截断处实现全息T\\barT变形，并发展了边界动力学的逆散射描述。\n3. 这为连接可积性、准局部引力可观测量与有限截断全息术建立了统一框架，启发进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Hamed Adami"}, {"name": "Kristiansen Lara"}, {"name": "Anouchah Latifi"}, {"name": "René Meyer"}], "featured_authors": [{"name": "Hamed Adami"}, {"name": "Kristiansen Lara"}, {"name": "Anouchah Latifi"}, {"name": "René Meyer"}], "author_count": 4}, {"id": "2607.06870", "category": "hep-th", "title": "Phase transitions and uberholography of holographic pure-state geometries", "abstract": "We study the error-correcting properties of pure-state holographic geometries, in which mixed boundary subregions are replaced, via the surface/state correspondence, by the Ryu--Takayanagi (RT) geodesic bounding their entanglement wedges. In AdS$_3$/CFT$_2$ we derive a cross-ratio threshold relation $\\eta'/\\eta = e^{\\Delta H/2}$ for the connected/disconnected transition of the entanglement wedge when two holes are punched in such a geometry. The quantity $\\Delta H$ is sourced entirely by geodesics ending on RT boundaries. It shifts the standard two-interval threshold $\\eta = 1/2$, and we classify when its sign is fixed by the pattern of hole endpoints. Turning to code properties, we show that the recursive hole-punching underlying uberholography cannot start within an RT-boundary, while an untouched asymptotic boundary can still fractalize, and we find numerically that in the configurations we study it does so with the universal fractal dimension $\\alpha \\approx 0.786$. The resulting upper bounds on price and distance are nevertheless procedure dependent. In the configurations we study, punching holes on the asymptotic boundary while retaining the RT-boundary yields strictly tighter bounds than first tracing out the RT-boundary and then fractalizing.", "url": "https://arxiv.org/abs/2607.06870", "type": "理论", "summary": "1. 该工作研究了全息纯态几何中纠缠楔的连通/断开相变与纠错性质，推导了AdS₃/CFT₂中交叉比阈值关系η'/η=e^{ΔH/2}。\n2. 其主要技术亮点在于ΔH完全由终结于RT边界的测地线贡献，并发现递归打孔超全息术的分形维数约0.786，且RT边界内部无法启动递归过程。\n3. 这为全息纠错码的price与distance上界的程序依赖性以及边界几何分形化机制提供了定量约束与结构理解。", "summary_source": "deepseek", "authors": [{"name": "Ning Bao"}, {"name": "Keiichiro Furuya"}, {"name": "Jacob March"}], "featured_authors": [{"name": "Ning Bao"}, {"name": "Keiichiro Furuya"}, {"name": "Jacob March"}], "author_count": 3}, {"id": "2607.07172", "category": "hep-th", "title": "Formation of holographic vortex in a rotating shell-shaped superfluid", "abstract": "We investigate the holographic superfluid dynamics subjected to external rotation on a spherical geometry. Through a linear perturbation analysis, we identify several dynamically unstable phases in the phase diagram, each characterized by distinct unstable modes. Employing fully nonlinear numerical simulations, we further demonstrate that these unstable modes generically drive the system into vortex-antivortex configurations with definite winding numbers, determined by the symmetry of the corresponding unstable modes.", "url": "https://arxiv.org/abs/2607.07172", "type": "理论", "summary": "1. 该工作利用全息对偶方法，数值模拟了旋转球壳超流体中涡旋结构的形成过程。\n2. 其核心在于通过线性扰动分析识别多种动力学不稳定模式，并由非线性演化直接给出由模式对称性决定的涡旋-反涡旋缠绕数。\n3. 这为理解旋转曲面超流体中拓扑缺陷的涌现机制提供了全息框架，可推广至有限温度与量子湍流研究。", "summary_source": "deepseek", "authors": [{"name": "Chang-Xu Yan"}, {"name": "Hao-Ran Chang"}, {"name": "Meng Gao"}, {"name": "Yu Tian"}, {"name": "Hongbao Zhang"}], "featured_authors": [{"name": "Chang-Xu Yan"}, {"name": "Hao-Ran Chang"}, {"name": "Meng Gao"}, {"name": "Yu Tian"}, {"name": "Hongbao Zhang"}], "author_count": 5}, {"id": "2607.07234", "category": "hep-th", "title": "Thermodynamics of Deformed AdS-Schwarzschild Black Holes Beyond the Bekenstein Paradigm", "abstract": "This work investigates the thermodynamic behavior of deformed AdS-Schwarzschild black holes by incorporating higher-order corrections within non-interacting spacetime models and extended entropy frameworks. To address the inadequacies of classical statistical mechanics in describing gravitational systems with non-local and long-range interactions, we employ non-extensive entropy formalisms, specifically Tsallis and Barrow entropies, which capture quantum-scale deviations and extended correlations. The resulting thermodynamic analysis reveals significant departures from conventional black hole behavior under strong entropy deformations. Notably, as the degree of non-extensivity decreases, the system asymptotically recovers classical features, indicating an emergent universality across statistical regimes. Furthermore, the Joule-Thomson (JT) expansion is examined to analyze the temperature-pressure response during adiabatic processes. Key thermodynamic quantities, including mass, temperature, heat capacity, Gibbs free energy, enthalpy, internal energy, and the JT coefficient, are computed under the influence of non-extensive entropy corrections. These results provide deeper insight into black hole thermodynamics in quantum-corrected spacetimes and offer new avenues for exploring gravitational systems beyond the traditional Bekenstein-Hawking (BH) framework.", "url": "https://arxiv.org/abs/2607.07234", "type": "理论", "summary": "1. 该工作采用Tsallis和Barrow非广延熵框架，研究了变形AdS-Schwarzschild黑洞在强熵修正下的热力学行为。\n2. 其关键卖点在于揭示非广延性减弱时系统渐近恢复经典特征，并系统计算了焦耳-汤姆孙膨胀及相应热力学量。\n3. 这为超越传统Bekenstein-Hawking熵的黑洞热力学提供了量子修正时空下的新视角。", "summary_source": "deepseek", "authors": [{"name": "Jafar Sadeghi"}, {"name": "Fatemeh Khosravani"}, {"name": "Alireza Amani"}], "featured_authors": [{"name": "Jafar Sadeghi"}, {"name": "Fatemeh Khosravani"}, {"name": "Alireza Amani"}], "author_count": 3}, {"id": "2607.07255", "category": "hep-th", "title": "Airy functions from quantum M-theory", "abstract": "We show that Airy function partition functions for M2-brane theories may be derived from relative equivariant localization of quantum M-theory. The eleven-dimensional Chern--Simons coupling gives the cubic term in the grand potential, while the $X_8$ correction gives the charge shift. Fixing the M2-brane charge turns the localized M-theory path integral into an Airy integral. In this way we derive the ABJM result, its toric Calabi--Yau generalizations, and gravitational blocks for black holes and other spacetimes, up to the prefactor and non-perturbative corrections.", "url": "https://arxiv.org/abs/2607.07255", "type": "理论", "summary": "1. 该工作从量子M理论的相对等变局域化推导出M2-膜理论的Airy函数配分函数。\n2. 其卖点在于十一维Chern-Simons耦合提供巨势立方项，而X_8修正给出电荷移位。\n3. 这为统一理解ABJM理论、环面Calabi-Yau推广及黑洞引力块提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Pietro Benetti Genolini"}, {"name": "Florian Gaar"}, {"name": "Jerome P. Gauntlett"}, {"name": "Jaeha Park"}, {"name": "James Sparks"}], "featured_authors": [{"name": "Pietro Benetti Genolini"}, {"name": "Florian Gaar"}, {"name": "Jerome P. Gauntlett"}, {"name": "Jaeha Park"}, {"name": "James Sparks"}], "author_count": 5}, {"id": "2607.07295", "category": "hep-th", "title": "Massive Graviton Dark Matter from a Gapped Continuum", "abstract": "We consider the possibility of dark matter in a warped extra-dimensional theory in presence of a linear dilaton background, with a gapped continuum spectrum, in a brane-world cosmological scenario. Firstly, triggered by self-energy radiative corrections, we study the existence of an isolated resonance of massive gravitons, and its realization as a long-lived feebly interacting dark matter candidate, produced by the freeze-in mechanism. This massive graviton is proved to satisfy all theoretical and experimental constraints, in the sub-MeV mass range. We further consider the close relationship between the existence of this component of dark matter and the presence of an inflaton localized on the brane, with a mass around $10^{11}$ GeV and a sub-TeV reheating temperature, in a brane inflationary scenario that allows to reproduce the most recent cosmological observables. Secondly, the gapped continuum of gravitons, a particular five dimensional realization of the physics of unparticles, is identified as a holographic fluid which can play the role of holographic dark matter. The production of the holographic fluid goes by an ultra-violet freeze-in mechanism, with an abundance mainly depending on the reheating temperature. Depending on the values of the mass gap and the reheating temperature, one or both components of dark matter can be present.", "url": "https://arxiv.org/abs/2607.07295", "type": "理论", "summary": "1. 该工作在线性膨胀子背景的卷曲额外维理论中，研究了具有能隙连续谱的大质量引力子作为暗物质的双组分模型。\n2. 其核心在于自能辐射修正诱导出亚MeV质量范围的孤立共振态，通过紫外冻入机制产生，并满足所有理论及实验约束，同时能隙连续谱被识别为全息暗物质流体。\n3. 这为源于额外维或非粒子物理的暗物质模型提供了明确构造，并展示了其与膜暴胀场景中暴胀子和重加热温度的内在关联。", "summary_source": "deepseek", "authors": [{"name": "Eugenio Megias"}, {"name": "Miguel Prieto"}, {"name": "Mariano Quiros"}], "featured_authors": [{"name": "Eugenio Megias"}, {"name": "Miguel Prieto"}, {"name": "Mariano Quiros"}], "author_count": 3}, {"id": "2607.07342", "category": "hep-th", "title": "Horizon-Restricted Leading Soft QED as Open Quantum System", "abstract": "I formulate black-hole-horizon-induced decoherence of charged branch codes as the leading-soft QED restricted to an exterior algebra, formulated as an open quantum system. The fixed-history Feynman--Vernon identity ${\\cal F}[J,J]=1$ remains exact. Decoherence enters through the unequal-history influence factor that survives exterior monitoring and belongs to the complementary horizon output. In the coherent eikonal regime, I derive the completely positive Schur channel $({\\cal E}_H^{(0)}\\rho)_{ab}=\\langle\\Phi_b^{H,(0)}|\\Phi_a^{H,(0)}\\rangle \\, \\rho_{ab}$. The leading soft input is the eikonal factor, projected onto the horizon radiative algebra. The channel yields Gram-positivity constraints, an exterior quantum-eraser bound, finite-time non-Markovianity tests, soft/hard scaling criteria, and a charged-qutrit interferometer measuring a leading-soft Bargmann holonomy. The holonomy phase is the rephasing-invariant symplectic area of a triangle in horizon soft phase space. I show that its orientation, common-mode, triangulation, and completely positive determinant identities render falsifiable tests beyond pairwise two-path visibility.", "url": "https://arxiv.org/abs/2607.07342", "type": "理论", "summary": "1. 本文构建了黑洞视界限制的前导软QED开放量子系统形式，用于描述带电分支在外部监测下的退相干过程。\n2. 其核心在于固定历史Feynman-Vernon恒等式保持精确，并通过不等历史影响因子导出完全正Schur通道，进而衍生Gram正定性约束与量子擦除界等可检验判据。\n3. 这为通过带电qutrit干涉仪测量前导软Bargmann和乐提供了理论框架，其相位的重相不变辛面积可实现超越成对路径可见度的可证伪检验。", "summary_source": "deepseek", "authors": [{"name": "Soo-Jong Rey"}], "featured_authors": [{"name": "Soo-Jong Rey"}], "author_count": 1}, {"id": "2607.07347", "category": "hep-th", "title": "Thermodynamic limit for SO(2N) gauge theories with spinors/conjugate spinors", "abstract": "In this paper, we investigate five-dimensional $\\mathcal{N} = 1$ supersymmetric $SO(2N)$ gauge theories coupled to hypermultiplets in spinor/conjugate spinor representation based on 5-brane web constructions with O5-planes. Based on the topological vertex formalism with O5-plane, we find new expressions for the partition functions for these theories, emphasizing the difference between the case with two spinors and that with one spinor and one conjugate spinor. Through the thermodynamic limit of these partition functions, we derive the Cameral and Seiberg-Witten curves. We show that the difference between the spinor and the conjugate spinor appears as a difference in the boundary conditions of the Seiberg-Witten curves at the orientifold planes.", "url": "https://arxiv.org/abs/2607.07347", "type": "理论", "summary": "1. 该工作通过O5-平面拓扑顶点形式，研究了五维N=1超对称SO(2N)规范理论中旋量/共轭旋量超多重态配分函数的热力学极限。\n2. 其核心技术在于揭示了配分函数中两个旋量与一个旋量加一个共轭旋量情形的新表达式差异，并由此导出Cameral与Seiberg-Witten曲线，表明差异体现为定向折叠面处边界条件的变化。\n3. 这为理解旋量表示在规范理论热力学极限下的物理效应提供了明确框架，并启发对更一般orientifold构造中量子行为的系统研究。", "summary_source": "deepseek", "authors": [{"name": "Xiaobin Li"}, {"name": "Futoshi Yagi"}], "featured_authors": [{"name": "Xiaobin Li"}, {"name": "Futoshi Yagi"}], "author_count": 2}, {"id": "2607.07364", "category": "hep-th", "title": "Topological changes and response singularities in black hole thermodynamic branch structure", "abstract": "Different diagnostics of black hole thermodynamic branch structure do not always identify the same local event. We examine this issue in charged AdS black hole examples where a thermodynamic topological phase transition is known to occur. In these examples, previously reported in [JHEP 06 (2024) 213}], the inverse temperature $\\tau_a$ at which the total topological number changes is separated from the inverse temperature $\\tau_b$ at which the fixed charge parameter branch response considered here becomes singular. Reanalyzing the same zero point branch geometry, we find that the two diagnostics track different local structures. The change at $\\tau_a$ is a boundary membership and index flow event of the positive radius physical branch set: a zero point with nonzero winding enters or leaves the counted domain. The singularity at $\\tau_b$ is instead caused by a turning point at finite radius, where a pair of branches annihilates. Since the two branches carry opposite windings, this event changes the branch count but preserves the total topological number. Thus, in the analyzed examples, the thermodynamic topological phase transition and the branch response singularity are distinct diagnostics of the same zero point branch geometry, with different local origins.", "url": "https://arxiv.org/abs/2607.07364", "type": "理论", "summary": "1. 该工作分析了带电AdS黑洞热力学分支结构中拓扑相变温度与响应奇异性温度的不同起源。\n2. 其关键发现在于拓扑数变化源于边界零点的缠绕数流入，而响应奇异点源于有限半径分支对的湮灭。\n3. 这提示了黑洞热力学相变诊断需区分全局拓扑数与局部响应奇点，为相关理论分析提供了明确区分标准。", "summary_source": "deepseek", "authors": [{"name": "Di Wu"}], "featured_authors": [{"name": "Di Wu"}], "author_count": 1}, {"id": "2607.07495", "category": "hep-th", "title": "Phenomena in the kink-antikink Collisions of $ϕ^8$ Theory", "abstract": "We investigated kink-antikink collisions in a $(1+1)$-dimensional $\\phi^8$ scalar field theory with multiple degenerate vacua. We presented explicit soliton solutions for different vacuum structures characterized by the ratio $n = p_2/p_1$. We focused on the cases $n=2$ and $n=3$ with four distinct vacua, and performed systematic numerical simulations across all topological sectors. We revealed that there is a complete annihilation regime in the $(1/2,\\,1)$ sector, where kink-antikink pairs annihilate for all initial velocities. Up to our knowledge, such phenomenon is first reported in the kink antikink collisions. We revealed a comprehensive fractal cartography of multi-bounce resonance windows across sectors $(-1,\\,-1/2)$, $(-1,\\,-1/3)$, and $(-1/3,\\,1/3)$. Given the kink antikink ($K\\bar{K}$, or $\\bar{K}K$) ordering, the effective potential and the spectrum of the Schrödinger like equation were presented. By collecting all the effective potential and collision phenomena, we proposed that the effective potential classification scheme provides a predictive framework for collision outcomes including escape, bion formation, sector change, and annihilation. Especially, it is identified that, when soliton pairs pass through each other, the abrupt changes of the potential type could explain both the sector-change and annihilation phenomena. Our work highlight novel dynamical features of the $\\phi^8$ model absent in lower-order field theories, and establish connections between topological structure, vibrational modes, and effective potentials.", "url": "https://arxiv.org/abs/2607.07495", "type": "理论", "summary": "1. 本文系统研究了(1+1)维ϕ⁸标量场论中多重简并真空下扭结-反扭结碰撞，针对n=2和n=3情形构造了孤子解并对各拓扑扇区进行了数值模拟。\n2. 核心发现包括在(1/2,1)扇区首次观察到完全湮灭现象，以及在(-1,-1/2)、(-1,-1/3)和(-1/3,1/3)扇区揭示多弹跳共振窗的完整分形图，并基于有效势类型分类建立了预测碰撞结果（逃逸、双子形成、扇区转换、湮灭）的框架。\n3. 该框架指出扭结对穿过时有效势类型的突变可解释扇区转换与湮灭机制，凸显ϕ⁸模型相对于低阶场论的新颖动力学特征，为连接拓扑结构、振动模与有效势的统一描述提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Yun Feng"}, {"name": "Yunguo Jiang"}], "featured_authors": [{"name": "Yun Feng"}, {"name": "Yunguo Jiang"}], "author_count": 2}, {"id": "2607.07621", "category": "hep-th", "title": "Odd-Dimensional Localization in Supergravity", "abstract": "We establish a localization principle for odd-dimensional supergravity theories containing Chern--Simons interactions. Our construction relies on combining an equivariant extension of the gauge-invariant part of the action with an equivariant completion of the Chern--Simons anomaly form ${\\Phi}^{(\\text{anom})}$ to form a relative equivariant cohomology class. This leads to a universal fixed point formula for the on-shell action of supersymmetric solutions that is expressed in terms of ${\\Phi}^{(\\text{anom})}$ and an equivariant Euler class. We illustrate the formalism in $D=11$ and $D=5$ supergravity, with applications including the supersymmetric Casimir energy and superconformal index of M5-branes, as well as black ring and black lens solutions.", "url": "https://arxiv.org/abs/2607.07621", "type": "理论", "summary": "1. 本工作在包含Chern–Simons相互作用的奇维超引力中建立了局域化原理，将规范不变作用量的等变扩展与反常形式的等变完备化结合为相对等变上同调类。\n2. 其技术核心是通过这一上同调构造导出普适的不动点公式，将超对称解的壳作用表达为等变Euler类与反常形式的积分。\n3. 该框架在D=11及D=5超引力中得以实现，可用于计算M5膜超对称Casimir能量与超共形指标，并分析黑环及黑透镜解的配分函数。", "summary_source": "deepseek", "authors": [{"name": "Pietro Benetti Genolini"}, {"name": "Florian Gaar"}, {"name": "Jerome P. Gauntlett"}, {"name": "Jaeha Park"}, {"name": "James Sparks"}], "featured_authors": [{"name": "Pietro Benetti Genolini"}, {"name": "Florian Gaar"}, {"name": "Jerome P. Gauntlett"}, {"name": "Jaeha Park"}, {"name": "James Sparks"}], "author_count": 5}, {"id": "2607.07684", "category": "hep-th", "title": "Unification of polynomial and exponential cosmological attractors", "abstract": "We introduce a family of simple $\\alpha$-attractor models that can interpolate between exponential and polynomial cosmological attractors. By varying the interpolation parameter $\\mu$ in these models, one can scan a wide range of values of the spectral index $n_{s}$ matching any combination of CMB and DESI data.", "url": "https://arxiv.org/abs/2607.07684", "type": "理论", "summary": "1. 该工作引入一族简单α-吸引子模型，实现了多项式与指数型宇宙学吸引子之间的连续插值统一。\n2. 通过单个插值参数μ调控谱指数ns，可扫描覆盖CMB与DESI数据所容许的广泛范围。\n3. 这一模型族为联合约束早期宇宙与暗能量提供了统一参数化框架，并可能启发更广泛的吸引子行为研究。", "summary_source": "deepseek", "authors": [{"name": "Renata Kallosh"}, {"name": "Andrei Linde"}], "featured_authors": [{"name": "Renata Kallosh"}, {"name": "Andrei Linde"}], "author_count": 2}, {"id": "2607.06800", "category": "math-ph", "title": "On the Geometrical and Kinematical Foundations of the Symmetric Relativity Model: Lorentz Transformation and Time Dilation", "abstract": "We examine the kinematic foundations of relativity by considering two inertial frames, $S$ and $S'$, in a standard configuration, where $S'$ moves along the common spatial $x$-axis at a constant velocity $v$. By relaxing Einstein's second postulate regarding the universal invariance of the one-way speed of light, we adopt an operational framework grounded strictly on the directly observable two-way (round-trip) speed of light, evaluated alongside the principles of spacetime homogeneity, linearity, and reciprocity. Within this setting, we demonstrate that: (i) the classical Lorentz transformation is recovered exactly along the coordinate axes under a generalized two-way synchronization scheme without requiring Einstein's second postulate; (ii) Langevin's light-clock argument fundamentally implies that the longitudinal scale factor $b$ matches the standard Lorentz factor $\\gamma$; and (iii) transverse lengths remain strictly invariant ($b_z = 1$). Crucially, to resolve the ontic paradox of multiple co-existing wavefront centers, we introduce a kinematically symmetric model relative to an absolute cosmological rest frame (or geometric anchor) $K$, wherein $S$ and $S'$ move with equal and opposite velocities ($u$ and $-u$, respectively). Within this generalized framework, allowing for anisotropic one-way light propagation via Reichenbach-type parameters ($\\varepsilon$ or $\\kappa$) yields a consistent, linear velocity-addition law, a generalized Doppler effect, and a flat but oblique spacetime metric. Finally, we prove that all round-trip observables remain strictly invariant under synchronization gauge transformations (reflecting the Tangherlini-Edwards perspective) and demonstrate that the resulting non-diagonal metric structure is fully consistent withthe Sagnac effect over closed spatial loops.", "url": "https://arxiv.org/abs/2607.06800", "type": "理论", "summary": "1. 该文放弃光速不变性假设，仅基于往返光速可观测性与时空均匀性，在操作框架下重新推导了经典洛伦兹变换。\n2. 其核心在于引入绝对宇宙学参考系K，通过对称化运动学（S与S'速度等值反向）与Reichenbach各向异性参数，得到非对角平坦时空度规并解释萨格纳克效应。\n3. 这为统一同步规范变换下的观测不变性提供了几何基础，并启发对绝对参考系与洛伦兹协变性关系的深入探索。", "summary_source": "deepseek", "authors": [{"name": "Miodrag Mateljević"}], "featured_authors": [{"name": "Miodrag Mateljević"}], "author_count": 1}, {"id": "2607.06836", "category": "math-ph", "title": "Global time-analytic strong solutions for a class of 3-wave kinetic equations", "abstract": "We study a class of 3-wave kinetic equations arising in wave turbulence theory, with regularized kernels. For radial, nonnegative initial data, we construct an exact global-in-time strong solution which remains nonnegative and is analytic with respect to time. The proof combines a careful analysis of the resonant interaction surfaces with a time power-series construction and a continuation argument based on the conservation of the energy moment.", "url": "https://arxiv.org/abs/2607.06836", "type": "理论", "summary": "1. 该工作针对一类带正则化核的三波湍流动力学方程，构造了径向非负初始条件下的全局时间强解，并证明解具有时间解析性。\n2. 主要技术手段包括共振相互作用面分析、时间幂级数构造，以及基于能量矩守恒的延拓论证，确保了解的存在性与正则性。\n3. 这一严格构造为波湍流理论中非线性方程的解性质提供了新范例，并可能推广至更一般的核函数与波相互作用系统。", "summary_source": "deepseek", "authors": [{"name": "Nguyen Gia Hien"}, {"name": "Gigliola Staffilani"}, {"name": "Minh-Binh Tran"}], "featured_authors": [{"name": "Nguyen Gia Hien"}, {"name": "Gigliola Staffilani"}, {"name": "Minh-Binh Tran"}], "author_count": 3}, {"id": "2607.06942", "category": "math-ph", "title": "Invariant Measures for Soliton Systems Generated by Mealy Automata", "abstract": "We study invariant measures for soliton systems described by Mealy automata. Motivated by recently introduced soliton models associated with 2-letter, 3-state Mealy automata, we formulate the time evolution induced by Mealy automata on bi-infinite configuration spaces. We provide sufficient conditions for the invariance of Bernoulli product measures and derive a criterion for the invariance of two-sided space-homogeneous Markov distributions. We then apply these general results to three soliton models, which can be interpreted as variants of the box-ball system (BBS). For two of these models, BBS-S(2) and BBS-V(2), we prove that Bernoulli product measures are invariant. For the remaining model, BBS-C(2), we establish a more general result: the invariance of two-sided space-homogeneous Markov distributions, which include Bernoulli product measures as a special case. Furthermore, for all three models, we compute the phase shift associated with the interaction of two solitons, as well as the velocity of an isolated soliton. Although the latter has already been studied previously, both quantities constitute fundamental characteristics for understanding the generalized hydrodynamics of these systems. These results provide a foundation for the study of invariant measures, generalized Gibbs ensembles, and generalized hydrodynamic behavior in Mealy-automaton soliton systems.", "url": "https://arxiv.org/abs/2607.06942", "type": "理论", "summary": "1. 该工作针对由2字母、3状态Mealy自动机导出的孤子系统，在双无限构型空间上系统研究了其不变测度，包括伯努利乘积测度和两侧空间齐次马尔可夫分布。\n2. 主要技术贡献在于推导了这两类测度不变性的充分条件与判据，并将其应用于三个盒箱系统变种模型BBS-S(2)、BBS-V(2)和BBS-C(2)，分别证明了伯努利测度或更一般齐次马尔可夫分布的不变性，同时计算了孤子相互作用的相移和孤立孤子速度。\n3. 这些结果为该孤子系统建立广义吉布斯系综和探讨广义流体力学行为提供了核心基础，并启发了Mealy自动机在统计物理与可积系统中更广泛的应用。", "summary_source": "deepseek", "authors": [{"name": "Takahiro Kanazawa"}, {"name": "Yutaro Nakabayashi"}], "featured_authors": [{"name": "Takahiro Kanazawa"}, {"name": "Yutaro Nakabayashi"}], "author_count": 2}, {"id": "2607.07057", "category": "math-ph", "title": "Hamiltonian reduction from particular integrals", "abstract": "We develop a geometric reduction mechanism generated by particular integrals. A family of functions whose time derivatives close linearly on the same family defines an invariant zero-level submanifold. In the Hamiltonian case, if this family is in involution, the restricted dynamics is presymplectic, and its characteristic quotient carries a reduced Hamiltonian flow. This yields a direct bridge between particular integrals, presymplectic reduction, and lower-dimensional Hamiltonian dynamics, and leads to a Liouville-type notion of particular integrability. We illustrate the framework through mechanical examples and lift constructions, including variants of the Eisenhart lift.", "url": "https://arxiv.org/abs/2607.07057", "type": "理论", "summary": "1. 该工作建立了由特定积分生成的几何约化机制，通过函数族时间微分线性闭合定义不变零水平子流形。\n2. 核心在于给出对合函数族下受限动力学为预辛形式，其特征商空间承载约化哈密顿流。\n3. 这提供了特定可积性的刘维尔型概念，直接衔接特定积分与低维哈密顿动力学，并通过机械实例与Eisenhart提升等构造加以验证。", "summary_source": "deepseek", "authors": [{"name": "R. Azuaje"}, {"name": "A. M. Escobar-Ruiz"}, {"name": "I. Gutierrez-Sagredo"}], "featured_authors": [{"name": "R. Azuaje"}, {"name": "A. M. Escobar-Ruiz"}, {"name": "I. Gutierrez-Sagredo"}], "author_count": 3}, {"id": "2607.07692", "category": "math-ph", "title": "Error bounds for the truncated Baker--Campbell--Hausdorff and Zassenhaus formulas in unitary problems", "abstract": "The Baker--Campbell--Hausdorff (BCH) formula plays a critical role in many branches of mathematics and physics. It expresses the logarithm of the product of exponentials of non-commuting operators as an infinite series of nested commutators of the operators involved. The Zassenhaus formula is the dual of the BCH formula: the exponential of a sum of operators is written as an infinite product of exponentials involving the operators and their commutators. In practical computations, however, one typically has to truncate the expansions, and so understanding the error committed by the resulting approximations and eventually providing suitable bounds for this error is of paramount interest. In this work we present a general strategy to derive rigorous error bounds and explicit error constants for the BCH and Zassenhaus formulas when the operators involved are skew-adjoint, as is the case for quantum evolution problems.", "url": "https://arxiv.org/abs/2607.07692", "type": "理论", "summary": "1. 针对斜厄米算子情形下的截断Baker–Campbell–Hausdorff与Zassenhaus展开，该工作建立了一套严格推导误差界与显式误差常数的通用策略。\n2. 其核心在于利用算子范数估计与代数递推关系，在保持幺正性的条件下给出截断误差的量化上界，适用于量子演化问题。\n3. 该误差界为量子模拟与数值计算中截断近似提供了可验证的可靠性保证，并有望推广至更一般的非交换算子代数。", "summary_source": "deepseek", "authors": [{"name": "A. Arnal"}, {"name": "F. Casas"}, {"name": "J.L. Ruiz-Benito"}], "featured_authors": [{"name": "A. Arnal"}, {"name": "F. Casas"}, {"name": "J.L. Ruiz-Benito"}], "author_count": 3}, {"id": "2607.06672", "category": "quant-ph", "title": "Spin singlets are useful", "abstract": "We evaluate the utility of the spin-zero manifold of an exchange-coupled array of $N$ spins for tasks in quantum computation and quantum simulation. Since pairs of electrons can be readily initialized into a product state of singlets in semiconducting quantum dot arrays, the full spin-zero manifold is available with exchange-only control, providing a Hilbert space of approximate dimension $2^N/(N/2)^{3/2}$, asymptotically close to the $2^N$ dimension of the full spin Hilbert space. Leveraging the spin-zero manifold enables larger computational space in a given array compared to traditional exchange-only control, in which spin arrays are organized into modular units of $n$ spins comprising $N/n$ encoded qubits, limiting to the exponentially smaller Hilbert dimension $2^{N/n}$. Here we focus on benchmarking metrics for this resource utilization by generalizing cross-entropy benchmarking, mirror benchmarking, and out-of-time-ordered correlators to this system. We show that operating in the spin-zero manifold can accelerate the realization of computational quantum advantage applications in semiconductor-based spin qubits.", "url": "https://arxiv.org/abs/2607.06672", "type": "数值", "summary": "1. 该工作评估了交换耦合自旋阵列中自旋零流形在量子计算与量子模拟中的效用，并推广了交叉熵基准测试等度量方法。\n2. 其技术卖点在于自旋零流形使阵列计算空间维数接近全自旋空间的2^N，远大于传统交换-only控制受限的指数缩小空间。\n3. 这为在半导体自旋量子比特中利用单态流形加速实现计算量子优势提供了量化基准和明确路径。", "summary_source": "deepseek", "authors": [{"name": "Silas Hoffman"}, {"name": "Edward H. Chen"}, {"name": "Matthew Brooks"}, {"name": "Stephen Carr"}, {"name": "Daniel Volya"}, {"name": "Alan Tran"}, {"name": "Tyler Keating"}, {"name": "Thaddeus D. Ladd"}, {"name": "Charles Tahan"}], "featured_authors": [{"name": "Silas Hoffman"}, {"name": "Edward H. Chen"}, {"name": "Matthew Brooks"}, {"name": "Tyler Keating"}, {"name": "Thaddeus D. Ladd"}, {"name": "Charles Tahan"}], "author_count": 9}, {"id": "2607.06683", "category": "quant-ph", "title": "Universal purification dynamics of monitored Clifford circuits", "abstract": "Quantum circuits under sufficiently weak monitoring purify on a timescale $T_P$ exponentially long in the system size. This slowness underlies a universal purification dynamics, whose quantitative description has so far required the replica trick, with a delicate analytic continuation. We show that monitored Clifford circuits on $L$ qudits of prime dimension $q$ bypass this construction entirely: in the scaling limit at fixed $x = t/T_P(L)$, purification reduces to the Markovian decay of the density-matrix rank, an exactly solvable death process descending from infinity. We compute the full scaling functions in compact form: all Rényi entropies collapse onto a universal curve $\\langle S(x) \\rangle$. Exact stabilizer simulations at $q=2,3,5$ confirm the predictions, with no fitting parameter for the global model and $T_P$ as the only fitted scale for local brick-wall circuits. Also, the replica problem amounts to a tilted version of the same Markov process, in agreement with exact computations from the Clifford commutant. Finally, the quantization of the rank leaves two hallmarks that distinguish Clifford dynamics from generic monitored circuits: the entropy fluctuations saturate at short scaled times $x\\to0$ to an $O(1)$ variance, instead of vanishing, and observables develop a temporal modulation periodic in $\\log_q x$, which cannot be captured by the replica approach.", "url": "https://arxiv.org/abs/2607.06683", "type": "理论+数值", "summary": "1. 该工作证明监测Clifford电路的通用净化动力学在标度极限下等价于密度矩阵秩的马尔可夫死亡过程，并给出所有Rényi熵的完全标度函数。\n2. 其核心在于绕过复制技巧与解析延拓，通过秩的量子化揭示熵波动在短时间饱和为O(1)方差及log_q周期调制的独特标志。\n3. 这为区分Clifford与通用监测动力学提供了精确基准，并对量子纠错与测量诱导相变的理论研究具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Beatrice Magni"}, {"name": "Federico Gerbino"}, {"name": "Xhek Turkeshi"}, {"name": "Andrea De Luca"}], "featured_authors": [{"name": "Beatrice Magni"}, {"name": "Federico Gerbino"}, {"name": "Xhek Turkeshi"}, {"name": "Andrea De Luca"}], "author_count": 4}, {"id": "2607.06718", "category": "quant-ph", "title": "Quantum error correction of a grid-state qubit with state preparation and measurement errors below $10^{-3}$", "abstract": "Grid state qubits offer a hardware-efficient approach to large-scale fault-tolerant quantum computing. They access the information redundancy required for quantum error correction by exploiting the large Hilbert space naturally available in harmonic oscillators. Superconducting architectures are particularly suitable to implement grid state qubits due to their fast and high-fidelity operations. Grid states in superconducting circuits enable quantum error correction (QEC) with performance beyond break-even. However, the state preparation and measurements (SPAM) errors of grid states has been a significant limitation to computational performances. In this work, we leverage high-performance QEC to enable repeat-until-success state preparation of both cardinal and magic states of the single-mode grid-state qubit. We combine this with an improved measurement protocol that corrects for both finite-energy envelope and auxiliary qubit readout errors, and increases robustness to photon loss. Our experiments, using both techniques, achieve a combined state-preparation and measurement error below $10^{-3}$. This represents two orders-of-magnitude improvement over the state of the art, bringing this platform on par with standard SPAM error levels measured in transmon qubits.", "url": "https://arxiv.org/abs/2607.06718", "type": "实验", "summary": "1. 该工作利用高性能量子纠错与重复直至成功策略，在超导电路中实现了单模栅格态量子比特的卡当态与魔术态制备及改进测量。\n2. 其技术核心在于同时校正有限能量包络和辅助量子比特读出误差的测量协议，将态制备与测量总误差降至10⁻³以下，较此前最优结果提升两个数量级。\n3. 这使栅格态量子比特的SPAM误差与transmon量子比特持平，为容错量子计算架构中该平台的实际应用消除了关键性能瓶颈。", "summary_source": "deepseek", "authors": [{"name": "Sara Turcotte"}, {"name": "Lucas St-Jean"}, {"name": "Amélie L. Pessonneaux"}, {"name": "Ross Shillito"}, {"name": "Bohdan Kulchytskyy"}, {"name": "Eliott Ouellet"}, {"name": "Jean Olivier Simoneau"}, {"name": "Florian Hopfmueller"}, {"name": "Matthew Hamer"}, {"name": "Pascal Lemieux"}, {"name": "Dany Lachance-Quirion"}, {"name": "Baptiste Royer"}, {"name": "Nicholas E. Frattini"}], "featured_authors": [{"name": "Sara Turcotte"}, {"name": "Lucas St-Jean"}, {"name": "Amélie L. Pessonneaux"}, {"name": "Dany Lachance-Quirion"}, {"name": "Baptiste Royer"}, {"name": "Nicholas E. Frattini"}], "author_count": 13}, {"id": "2607.06752", "category": "quant-ph", "title": "Feynman's clock and hierarchy-informed sampling for quantum error mitigation", "abstract": "Near-term physical implementations of quantum algorithms require efficient quantum error mitigation schemes to reduce quantum noise. In this letter we propose a new mitigation technique, by extending the applicability of our BBGKY-ISM scheme from quantum simulations of spin chains to arbitrary quantum circuits. We map executions of quantum circuits using Feynman's clock Hamiltonian to the Hamiltonian dynamics of a corresponding quantum system, whose time evolution obeys a BBGKY-like hierarchy of equations informing the BBGKY-ISM mitigation. We show that the method's classical and quantum overheads are polynomial in the circuit size and in the number of qubits. We apply our method to numerical simulations of tunable Bell state preparation circuits under state-of-the-art quantum noise, and numerically demonstrate its systematic and controllable quantum error reduction capability.", "url": "https://arxiv.org/abs/2607.06752", "type": "理论+数值", "summary": "1. 该工作提出了一种基于费曼时钟哈密顿量映射与BBGKY层次方程采样的量子误差缓解方案，将原有BBGKY-ISM方法从自旋链模拟扩展至任意量子线路。\n2. 其技术核心在于利用时钟哈密顿量将电路执行转化为动力学演化，借助可信息采样的BBGKY层次方程实现经典与量子开销均为线路大小的多项式函数。\n3. 这为近期含噪量子处理器上的算法运行提供了一种系统可控、且开销适中的实用误差抑制途径，并可启发后续基于动力学映射的误差缓解策略。", "summary_source": "deepseek", "authors": [{"name": "Theo Saporiti"}], "featured_authors": [{"name": "Theo Saporiti"}], "author_count": 1}, {"id": "2607.06783", "category": "quant-ph", "title": "Secret Key Rate Analysis of Distribution Matching Algorithms for Discrete-Modulated CV-QKD", "abstract": "Continuous variable quantum key distribution protocols (CV-QKD) with discrete modulation have been intensively investigated to bridge the gap between ideal Gaussian modulation and modern coherent optical communication systems. To mitigate the penalty of discrete modulation, probabilistic constellation shaping (PCS) is applied to the modulation format and is typically performed by distribution matching (DM) algorithms. In this paper, we address the application of DM algorithms to perform PCS in CV-QKD protocols. We investigate the impact of approximating optimized Maxwell-Boltzman distributions with DM algorithms based on Huffman (HDM) and constant composition (CCDM) codes on the protocol's secret key rate (SKR) and tolerance to excess noise. Our results show that specifically symbol-by-symbol HDM degrades the SKR by at least 30\\%, whereas CCDM matches the optimal SKR with code length of $10^3$ or more symbols. Furthermore, we also provide a statistical analysis of symbol dependence for both approaches, showing that CCDM must operate with blocks of at least $10^5$ symbols for the correlations become negligible. Finally, we propose an algorithm to generate independent symbols following near-optimal distributions.", "url": "https://arxiv.org/abs/2607.06783", "type": "数值", "summary": "1. 该工作分析了基于霍夫曼（HDM）和恒定组成（CCDM）编码的分布匹配算法对离散调制连续变量量子密钥分发密钥率及过量噪声容限的影响。\n2. 其技术要点在于揭示HDM使密钥率至少下降30%，而CCDM在码长超千符号时匹配最优密钥率，且需达到十万符号量级才能使符号相关性可忽略。\n3. 所提出的生成近似最优分布独立符号的算法为离散调制CV-QKD的实用化提供了一种低相关、高效率的星座成形方案。", "summary_source": "deepseek", "authors": [{"name": "Micael Dias"}, {"name": "Caroline Alves"}, {"name": "Gabrielly Roman"}, {"name": "Søren Forchhammer"}], "featured_authors": [{"name": "Micael Dias"}, {"name": "Caroline Alves"}, {"name": "Gabrielly Roman"}, {"name": "Søren Forchhammer"}], "author_count": 4}, {"id": "2607.06850", "category": "quant-ph", "title": "A \"squeezed polaron\" variational wavefunction for the spin boson model", "abstract": "The localization transition of the sub-Ohmic spin-boson model generates boson bath correlations that are, at low frequencies, analytically inaccessible to standard coherent-state-polaron variational ansatzes. In this paper, we introduce a ``squeezed polaron'' wavefunction incorporating generic Gaussian boson-boson correlations induced by the spin impurity. This gives the correct critical power-law scaling of bath observables near the localization transition together with a systematically improved ground state energy and a more accurate determination of the critical coupling. Our wavefunction captures the correct mean-field nature of the transition in the deep sub-Ohmic region. It also displays non-mean-field critical exponents in the shallow sub-Ohmic regime. Using the squeezed polaron as a starting point, we derive scattering phase shifts for bosons, and show how they encode the emergent energy scale that vanishes at the localization transition.", "url": "https://arxiv.org/abs/2607.06850", "type": "理论+数值", "summary": "1. 该工作针对亚欧姆自旋玻色子模型，提出了包含玻色子压缩关联的“压缩极化子”变分波函数。\n2. 其核心在于通过引入高斯型玻色-玻色关联，精确捕获局域化转变附近的临界幂律标度及非平均场临界指数。\n3. 这为从压缩极化子出发导出玻色子散射相移并揭示局域化转变中湮灭的能量标度提供了出发点和理论工具。", "summary_source": "deepseek", "authors": [{"name": "Diego Barberena"}, {"name": "Nigel Cooper"}], "featured_authors": [{"name": "Diego Barberena"}, {"name": "Nigel Cooper"}], "author_count": 2}, {"id": "2607.06876", "category": "quant-ph", "title": "XOR Games at Full Tilt: The Hardness of Binary Nonlocal Games", "abstract": "It is well known that the quantum value of an XOR nonlocal game, where the winning condition depends only on the XOR of the two players' output bits, may be approximated in polynomial time. We study a variant of the XOR game model, which we call tilted XOR games, where the winning condition can additionally depend on only one of the output bits. We show that this dramatically increases the expressive power: the computational complexity of the problem of approximating the quantum value of tilted XOR games to constant precision is RE-complete. Also, our result extends to succinct versions of tilted XOR games, where the questions can be polynomial-length binary strings, generated by a polynomial-time verifier. For classical strategies, the distinction between XOR games and tilted XOR games is inconsequential. Håstad (J. ACM, 2001) shows that they are both NP-complete to approximate, by using a reduction from linear systems to XOR games. Our approach is to show that this is also quantum-sound, but as a reduction from linear system games to tilted XOR games. Since titled XOR games are a special case of binary games (where each party outputs a single bit), our result implies that binary games are RE-hard to approximate.", "url": "https://arxiv.org/abs/2607.06876", "type": "理论", "summary": "1. 该工作研究了倾斜XOR非局部游戏，证明了将其量子值近似到常数精度的计算复杂度为RE完全。\n2. 主要技术突破在于构建了从线性系统游戏到倾斜XOR游戏的量子可靠归约，从而揭示二进制非局部游戏的量子硬度。\n3. 这一结果为量子非局域性的计算复杂度分类确立了新边界，并暗示倾斜XOR游戏是研究量子优势与可近似性之间张力的理想理论工具。", "summary_source": "deepseek", "authors": [{"name": "Richard Cleve"}, {"name": "Eric Culf"}, {"name": "Aviv Taller"}], "featured_authors": [{"name": "Richard Cleve"}, {"name": "Eric Culf"}, {"name": "Aviv Taller"}], "author_count": 3}, {"id": "2607.06888", "category": "quant-ph", "title": "Correlation Localization in Waveguide QED with Delayed Interactions", "abstract": "We study the atom-atom correlation length in an atomic array coupled to a waveguide under the Bragg condition with delayed non-Markovian interactions caused by a finite photon propagation time. Starting from a single excited atom, the excitation partially spreads among all atoms, reaching a steady state. The remaining excitation localizes near the initially excited atom, and the atom-atom correlation length decreases as a power law with the interaction delay. This localization phenomenon reveals how the delay-induced non-Markovian behavior affects the correlation transport in waveguide QED systems.", "url": "https://arxiv.org/abs/2607.06888", "type": "理论", "summary": "1. 该工作研究了布拉格条件下波导QED原子阵列中由有限光子传播时间导致的延迟非马尔可夫相互作用所引发的关联局域化现象。\n2. 其技术核心在于发现原子间关联长度随相互作用延迟时间的增加呈幂律衰减，揭示了延迟诱导的非马尔可夫行为对关联输运的抑制作用。\n3. 这为通过调控延迟时间在波导QED系统中实现可操控的量子态局域化及非马尔可夫量子信息处理提供了理论启发。", "summary_source": "deepseek", "authors": [{"name": "N. Vera"}, {"name": "F. M. Quinteros"}, {"name": "P. Barberis-Blostein"}, {"name": "P. Solano"}], "featured_authors": [{"name": "N. Vera"}, {"name": "F. M. Quinteros"}, {"name": "P. Barberis-Blostein"}, {"name": "P. Solano"}], "author_count": 4}, {"id": "2607.06932", "category": "quant-ph", "title": "Enhanced two-photon sources in a cavity-coupled two-atom system", "abstract": "We propose a component-selective scheme for improving two-photon sources in a cavity-coupled two-atom system, where a single cavity mode interacts with two two-level atoms driven by phase-controlled classical fields of the same frequency. By controlling the atomic detunings and driving phase, the system can be tailored toward optimized cavity-field two-photon blockade or strongly correlated fluorescence photon-pair emission. When the two-cavity-photon component is enhanced, the cavity field exhibits optimized two-photon blockade with simultaneous suppression of unwanted one- and three-photon components at a comparable two-photon population. In another parameter regime, strongly correlated fluorescence photon pairs can also be generated from the two atoms by selecting the double-atomic-excitation component in the same two-excitation manifold. This approach provides a route toward high-quality and versatile two-photon sources, with potential applications in few-photon quantum optics and quantum information processing.", "url": "https://arxiv.org/abs/2607.06932", "type": "数值", "summary": "1. 该工作提出了在腔耦合双原子系统中通过相位控制经典场增强双光子源的方案。\n2. 其技术核心在于调节原子失谐与驱动相位，选择性增强双光子分量，同时抑制单光子与三光子分量，实现优化的双光子阻塞或强关联荧光光子对发射。\n3. 这为在少光子量子光学和量子信息处理中实现高质量、可调双光子源提供了明确的物理路径。", "summary_source": "deepseek", "authors": [{"name": "Zhicai Chen"}, {"name": "Jun Xu"}, {"name": "Deyi Kong"}, {"name": "Xiangming Hu"}, {"name": "Fei Wang"}], "featured_authors": [{"name": "Zhicai Chen"}, {"name": "Jun Xu"}, {"name": "Deyi Kong"}, {"name": "Xiangming Hu"}, {"name": "Fei Wang"}], "author_count": 5}, {"id": "2607.06953", "category": "quant-ph", "title": "A quantum model for synchronizing finite state transition systems", "abstract": "We propose a quantum model for finding a resetting input sequence (RS) which can take a finite state transition system (FA), to particular state independent of its current state. The complexity of finding such sequences for various types of FA can be NP-Hard or even PSPACE-Complete. To this end, we represent the FA states, inputs, and transition function in quantum space. Accordingly, we propose a model to represent the execution of an input sequence of a particular length $l$ starting form an initial FA state. The model is extended considering the application in superposition of all input sequences of length $l$ to an initial state of the FA. The model is further extended considering the application of all input sequences to all initial states of the FA capturing for every input sequence the collection (ordered list) of states reached by applying the sequence to all states of the FA. The amplitude amplification algorithm is then used as it combines similar collections of reached states while preserving all input sequences that reach these collections. A Grover search for a reached collection where its elements correspond to the same FA state provides a RS for the FA. Our approach offers a quadratic gain over the exponential complexity of traditional brute-force method, which is the only method that can be applied to a general FA class. As a proof of concept we provide results of several simulated FAs on a quantum simulator.", "url": "https://arxiv.org/abs/2607.06953", "type": "理论+数值", "summary": "1. 该工作提出一个量子模型，将有限状态自动机的状态、输入和转移函数编码为量子态，用于搜索可将自动机同步至单一状态的重置序列。\n2. 技术核心在于通过振幅放大算法合并不同输入序列产生的状态集合，同时保留所有有效序列，最终由Grover搜索定位使所有初始状态到达同一终态的集合，实现相对于经典暴力法的二次加速。\n3. 该框架为NP难或PSPACE完全的自动机同步问题提供了量子加速的通用策略，有望推广至更复杂的自动机类别，并在量子模拟器或量子处理器上验证其可扩展性。", "summary_source": "deepseek", "authors": [{"name": "Martin Lukac"}, {"name": "Khaled El-Fakih"}, {"name": "Uraz Turker"}], "featured_authors": [{"name": "Martin Lukac"}, {"name": "Khaled El-Fakih"}, {"name": "Uraz Turker"}], "author_count": 3}, {"id": "2607.06994", "category": "quant-ph", "title": "Operator-frame geometry of non-compact quantum systems with frame-vacuum phase transitions", "abstract": "We formulate the geometric structure of non-compact bosonic quantum systems in regimes where vacuum instability renders the relevant quantum states non-normalizable, causing conventional state-space quantum geometry -- described by the Berry connection, curvature, and quantum metric -- to become ill-defined. To overcome this breakdown, we develop a formulation of quantum geometry at the level of canonical operator frames, allowing for complexified Bogoliubov-Valatin transformations that lift the requirement that creation operators be Hermitian conjugates of annihilation operators. Canonical operator frames are defined as choices of bosonic creation and annihilation operators realizing the canonical commutation relations. A natural equivalence relation among such frames generalizes the phase ambiguity of quantum states and determines a parameter space that analytically extends the stable-regime parameter space. The space of canonical operator frames forms a principal bundle over parameter space -- the operator-frame bundle -- equipped with a natural Ehresmann connection that defines parallel transport while preserving the canonical commutation relations. In the stable regime, this construction reduces to the Berry connection, while more generally it yields a well-defined operator-space quantum geometric tensor (QGT) that remains valid across vacuum instabilities. Using the framework of rigged Hilbert spaces, we define a notion of quantum frame vacuum and obtain a consistent state-space QGT. Focusing on a single bosonic mode, we demonstrate analyticity of the QGT across the quantum frame-vacuum phase transition and present the corresponding phase diagram on the complexified squeezing-parameter plane. We further introduce a realistic physical setting that allows continuous paths connecting stable and unstable regimes, along which the QGT evolves smoothly across Stokes lines.", "url": "https://arxiv.org/abs/2607.06994", "type": "理论+数值", "summary": "1. 该工作为具有真空不稳定性的非紧致玻色子系统建立了规范算符框架几何，克服了传统态空间量子几何因态不可归一化而失效的问题。\n2. 其核心在于利用复化Bogoliubov-Valatin变换定义规范算符框架，并构造算符框架主丛及其上的Ehresmann联络，使得量子几何张量在真空相变点仍解析有效。\n3. 这为连接稳定与不稳定区域的量子几何演化提供了连续路径，并可通过压缩参数复平面上的相图指导实验观测框架真空相变。", "summary_source": "deepseek", "authors": [{"name": "Satoshi Tanaka"}, {"name": "Gonzalo Ordonez"}, {"name": "Masatoshi Kubota"}, {"name": "Hiroto Nakano"}, {"name": "Kazuki Kanki"}], "featured_authors": [{"name": "Satoshi Tanaka"}, {"name": "Gonzalo Ordonez"}, {"name": "Masatoshi Kubota"}, {"name": "Hiroto Nakano"}, {"name": "Kazuki Kanki"}], "author_count": 5}, {"id": "2607.07056", "category": "quant-ph", "title": "Quantum Recurrence Plot Algorithm Based on Quantum Principal Component Analysis", "abstract": "Recurrence Plot (RP) is a method employed to analyze the periodicity, chaoticity, and nonlinear characteristics of complex systems. Quantum Principal Component Analysis (QPCA), on the other hand, achieves dimensionality reduction of sample data using density matrices based on quantum circuits. We improve the distance threshold function of the recurrence plot algorithm using a density operator conceptually equivalent to the covariance matrix, integrate it with quantum circuits, and thereby develop a Quantum Recurrence Plot (QRP) algorithm. This algorithm achieves ultra-high efficiency in parallel computing, reduces computational costs, and simultaneously upgrades the traditional grayscale recurrence plot to colored heatmaps, enabling a better revelation of the system's dynamical characteristics.", "url": "https://arxiv.org/abs/2607.07056", "type": "数值", "summary": "1. 该工作利用密度算子改进了递归图算法的距离阈值函数，并集成量子电路，提出了基于量子主成分分析的量子递归图算法。\n2. 其技术卖点在于通过等效于协方差矩阵的密度算子实现灰度递归图到彩色热图的升级，同时在量子并行计算中达到超高效率、显著降低计算成本。\n3. 这为量子计算平台上高效分析复杂系统周期性与混沌动力学特性，以及实现加速诊断提供了明确的技术路径与理论启发。", "summary_source": "deepseek", "authors": [{"name": "Hanhuai Zhu"}, {"name": "Jingjing Huang"}, {"name": "Zhi-Xi Wang"}, {"name": "Shao-Ming Fei"}], "featured_authors": [{"name": "Hanhuai Zhu"}, {"name": "Jingjing Huang"}, {"name": "Zhi-Xi Wang"}, {"name": "Shao-Ming Fei"}], "author_count": 4}, {"id": "2607.07081", "category": "quant-ph", "title": "Spectral Chaos Does Not Determine Quantum Mpemba Crossings", "abstract": "In a symmetry-restoration quantum Mpemba effect, an initial state with stronger local symmetry breaking can lose that memory faster than a state that starts closer to the symmetric manifold. We test whether this local ordering reversal is organized by chaotic thermalization in a clean U(1)-conserving spin chain, comparing spectral level statistics with crossings of the entanglement asymmetry for the same Hamiltonians. We find that Gaussian orthogonal ensemble (GOE)-like level statistics alone do not determine whether Mpemba crossings occur. Across field textures, GOE-like spectra can occur with or without entanglement-asymmetry crossings, and crossings can also appear away from the GOE reference. A near-staggered detuned control further shows that even an inversion of the total charge-sector coherence need not produce an entanglement-asymmetry crossing. Thus the crossing response is controlled not by spectral chaos alone, but by how local charge-sector coherence enters the reduced density matrix.", "url": "https://arxiv.org/abs/2607.07081", "type": "理论", "summary": "1. 该工作通过数值模拟U(1)守恒自旋链，检验了能谱混沌与量子Mpemba效应中纠缠不对称性交叉的关联。\n2. 关键发现是，高斯正交系综能谱统计本身既不保证也不排除Mpemba交叉，交叉的出现取决于局域电荷扇区相干性在约化密度矩阵中的具体表现。\n3. 这表明量子Mpemba效应的机制不能用谱混沌单一描述，必须考虑非平衡态局域量子相干性的细致结构。", "summary_source": "deepseek", "authors": [{"name": "Ri-Hua Zheng"}, {"name": "Yang Xiao"}, {"name": "Yu Wang"}, {"name": "Ye-Hong Chen"}, {"name": "Yan Xia"}], "featured_authors": [{"name": "Ri-Hua Zheng"}, {"name": "Yang Xiao"}, {"name": "Yu Wang"}, {"name": "Ye-Hong Chen"}, {"name": "Yan Xia"}], "author_count": 5}, {"id": "2607.07167", "category": "quant-ph", "title": "Macroscopic position-position entanglement by photon recoil in Rydberg atoms", "abstract": "Entanglement between two spatially separate matter particles can be generated via many means and often resides in the internal states of particles. Here, via Rydberg blockade in two spatially separate neutral atoms, we find that the photon recoil in Rydberg excitation can push one atom microns away provided the other atom exerts a state-dependent Rydberg-mediated blockade. When the atoms are recaptured by optical traps, a position-position entangled state between two spatially separate atoms can emerge. This realizes a Bell state of two atoms, where the entanglement exists in the position of each atom and the distance between the two possible locations of each atom can be in the hundred-micron regime.", "url": "https://arxiv.org/abs/2607.07167", "type": "理论", "summary": "1. 该工作通过里德伯阻塞和光子反冲效应，在两个空间分离的中性原子间实现了宏观位置-位置纠缠，并制备出贝尔态。\n2. 其核心在于利用原子间态依赖的里德伯阻塞使激发原子发生微米级位移，从而将纠缠从内部态转移至外部空间自由度。\n3. 这为构建百微米尺度可寻址的量子网络节点以及探索基于空间纠缠的量子信息协议提供了新路径。", "summary_source": "deepseek", "authors": [{"name": "Xiao-Feng Shi"}], "featured_authors": [{"name": "Xiao-Feng Shi"}], "author_count": 1}, {"id": "2607.07197", "category": "quant-ph", "title": "Analytical Landscape of Maximal Magic for Two-Qutrit States and Beyond", "abstract": "Achieving a genuine quantum advantage relies on two distinct non-classical resources that restrict efficient classical simulation: entanglement and magic (nonstabilizerness). We investigate the interplay between these resources by characterizing the Pareto frontiers of extreme magic at fixed entanglement for systems of two qutrits ($d=3$) and two ququints ($d=5$). Unlike the case of two qubits, the Schmidt spectrum for two qutrits features two independent entanglement parameters, resulting in two-dimensional Pareto surfaces. For the lower frontier, we recast the minimal magic as a compact function of concurrence and negativity, with a maximal value of $\\ln 2$. For the upper frontier, we determine the maximal stabilizer Rényi entropy to be $M_2 = \\ln(81/17) \\approx 1.561$, which tightens the previous theoretical bound of $\\ln 5\\approx 1.609$ and improves on earlier numerical estimates. The maximum magic is achieved at eighteen distinct maxima categorized into three families of six permutation-equivalent spectra. We provide analytical expressions for the maximal magic in the neighborhood of each maximum and for the corresponding maximally magical states which turn out to be Weyl-Heisenberg-covariant fiducial states for mutually unbiased bases. Finally, numerical analysis of two ququints ($d=5$) reveals six permutation-inequivalent maxima with a peak magic value of $M_2 = \\ln(625/49) \\approx 2.546$. Based on these findings, we conjecture that the maximal magic for a bipartite system of two qudits with prime dimension $d$ is given by $\\ln [ d^4 / (2d^2 - 1) ]$, which reproduces the previously known value for qubits, as well as the values derived here for qutrits and ququints.", "url": "https://arxiv.org/abs/2607.07197", "type": "理论+数值", "summary": "1. 该工作解析刻画了两qutrit和两ququint系统在固定纠缠下极端魔法的Pareto前沿，确定最大稳定Rényi熵分别为ln(81/17)≈1.561和ln(625/49)≈2.546，并给出下前沿最小魔法为concurrence和negativity的函数，最大为ln2。\n2. 其核心在于揭示了两qutrit系统因Schmidt谱含两个独立纠缠参数导致二维Pareto面，上前沿最大魔法由十八个极大值点分属三个置换等价族达到，对应互偏基的Weyl-Heisenberg协变fiducial态。\n3. 这为素数维度d两qudit系统的最大魔法提出解析公式ln[d⁴/(2d²-1)]，统一了qubit、qutrit和ququint的结果，为量子优势资源理论提供了精确基准。", "summary_source": "deepseek", "authors": [{"name": "Marco Knipfer"}, {"name": "Alexander Roman"}, {"name": "Katia Matcheva"}, {"name": "Konstantin T. Matchev"
