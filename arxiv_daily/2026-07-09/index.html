  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);

      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);

      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }

    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }

    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2607.06711", "category": "cond-mat", "title": "Moiré Phonon Condensation in Magic-Angle Twisted Bilayer Graphene", "abstract": "Twisted bilayer graphene reconstructs from weak breathing corrugation to large common bending near the magic angle, but the origin of this collective crossover has remained unclear. Here we show that the crossover is a soft-mode condensation of layer-symmetric $A_1$ moiré flexural phonons: these modes soften on the breathing branch, lose stiffness near the magic angle, and freeze into the bending morphology. We call this mechanism Moiré Phonon Condensation (MPC). At $\\theta=1.08^\\circ$, it is extremely surprising that displacements of all 11164 atoms in the moiré supercell, with a maximum atomic position shift of 2.30 Angstrom, is captured by only two $A_1$ phonon modes at more than $99.5\\%$ spectral weight. A first-harmonic continuum theory identifies a dimensionless control parameter of the phenomenon, showing that as the twist approaches the magic angle, the growing moiré length scale amplifies a smooth stress-bending competition until the flexural stiffness changes sign. Mode-resolved tight-binding calculations further show that the condensed phonon coordinates are electronically active. This work identifies MPC as a twist-controlled structural order parameter for moiré reconstruction.", "url": "https://arxiv.org/abs/2607.06711", "type": "理论+数值", "summary": "1. 该工作揭示了魔角扭曲双层石墨烯中从弱呼吸皱褶到大范围弯曲形貌的集体转变起源于层对称A1摩尔柔性声子的软模凝聚。\n2. 其核心发现是在1.08°扭角下，超胞中11164个原子的最大位移达2.30埃，仅由两个A1声子模式以超过99.5%的谱权重捕获，并由一次谐波连续统理论提炼出无量纲控制参数。\n3. 这为将摩尔声子凝聚作为扭转控制的结构序参数提供了坚实依据，并提示其作为电子活性坐标在摩尔重构及相关量子物态中的调控潜力。", "summary_source": "deepseek", "authors": [{"name": "Zhanghao Zhouyin"}, {"name": "Jyun-jie Jiang"}, {"name": "Xianghua Kong"}, {"name": "Hong Guo"}], "featured_authors": [{"name": "Zhanghao Zhouyin"}, {"name": "Jyun-jie Jiang"}, {"name": "Xianghua Kong"}, {"name": "Hong Guo"}], "author_count": 4}, {"id": "2607.06729", "category": "cond-mat", "title": "Physical exact conditions as regularizers for exchange-correlation in solids and surface chemistry", "abstract": "Density functional theory (DFT) often is the method of choice for simulating the electronic properties of extended solids and surfaces from first principles due to a favorable compromise between accuracy and computational cost. In the field of heterogeneous catalysis, DFT is indispensable for deriving mechanistic insights and understanding trends in surface reactivity. The accuracy of DFT for surface reaction energetics depends strongly on the exchange-correlation (XC) approximation. We show here that optimization of such XC functionals for surface binding energies can lead to a worse description of surface reaction barriers, unless important physical exact conditions are fulfilled.", "url": "https://arxiv.org/abs/2607.06729", "type": "理论+数值", "summary": "1. 该工作表明，针对固体与表面化学优化交换关联泛函的表面结合能时，若不满足物理精确条件，反应势垒描述会显著恶化。\n2. 其核心在于揭示这些精确条件可作为正则化约束，在不牺牲结合能精度的前提下保持势垒的可靠预测。\n3. 这为设计在多相催化中同时兼顾吸附能与反应能垒的泛函提供了必要准则与清晰方向。", "summary_source": "deepseek", "authors": [{"name": "Johannes Voss"}], "featured_authors": [{"name": "Johannes Voss"}], "author_count": 1}, {"id": "2607.06730", "category": "cond-mat", "title": "Spin-orbit magnetism in altermagnets", "abstract": "The mechanism enabling antiferromagnets, including altermagnets, to exhibit a prominent anomalous Hall effect despite a vanishingly small net magnetization has long remained elusive. Here, by employing oriented spin group theory and spin-orbit-coupling tensor expansion, we systematically disentangle the perturbative behaviors of orbital and spin magnetizations with respect to spin-orbit coupling. Remarkably, we find that only if the opposite-spin sublattices are connected through a fourfold rotation, the orbital and spin magnetizations exhibit distinct perturbative orders. In these altermagnets, we further discover a coaxial Hall effect characterized by the induced spin and orbital magnetizations aligning parallel to the Néel vector, which we further demonstrate by first-principles calculations in the altermagnet KV$_{2}$Se$_{2}$O. This effect holds great promise for achieving deterministic switching of the Néel order under weak external fields. Our work provides a systematic symmetry approach to identify potential altermagnetic candidates combining a large anomalous Hall effect with minimal net magnetization, paving the way for high-performance, stray-field-free spintronic applications.", "url": "https://arxiv.org/abs/2607.06730", "type": "理论+数值", "summary": "1. 该工作运用取向自旋群理论与自旋轨道耦合张量展开，系统分类了交变磁体中轨道与自旋磁化强度对自旋轨道耦合的微扰行为，阐明了其在极低净磁化下贡献显著反常霍尔效应的机制。\n2. 核心发现是仅当相反自旋子晶格通过四重旋转相连时，轨道与自旋磁化强度呈现不同微扰阶，从而预言并利用第一性原理在KV2Se2O中验证了同轴霍尔效应——诱导磁化平行于Néel矢量。\n3. 这为弱外场下实现Néel序确定性翻转提供了物理方案，并为系统筛选兼具大反常霍尔效应与极小净磁化的交变磁体材料建立了对称性方法，助力无杂散场自旋电子学器件开发。", "summary_source": "deepseek", "authors": [{"name": "Ruojia Wang"}, {"name": "Yuntian Liu"}, {"name": "Renzheng Xiong"}, {"name": "Xiaobing Chen"}, {"name": "Qihang Liu"}], "featured_authors": [{"name": "Ruojia Wang"}, {"name": "Yuntian Liu"}, {"name": "Renzheng Xiong"}, {"name": "Xiaobing Chen"}, {"name": "Qihang Liu"}], "author_count": 5}, {"id": "2607.06741", "category": "cond-mat", "title": "First-Principles Investigation of the Al-V Phase Diagram", "abstract": "The Al-V alloy system contains a number of phases including several with complex structures and at least two exhibiting sites of partial occupation. Through electronic density functional theory-based total energy calculations combined with methods of statistical mechanics, we examine the relative stability of phases at finite temperatures. We construct composition-continuous free energy models for the V-rich solid solution and for one of the complex intermetallic phases. In the V-rich region, we identify three ground states that transform to the solid solution at elevated temperatures. We also suggest that \\phase{Al}{V_3} takes the Al15 structure as an intermediate-temperature phase stabilized by anharmonic vibrational free energy.", "url": "https://arxiv.org/abs/2607.06741", "type": "理论+数值", "summary": "1. 该工作采用第一性原理计算结合统计力学方法，系统构建了Al-V合金相图，尤其关注V-rich区固溶体与复杂金属间化合物的有限温度相稳定性。\n2. 核心卖点在于识别出V-rich区域三种基态随温度升高转化为固溶体，并揭示AlV3相的Al15结构作为中温相由非简谐振动自由能稳定。\n3. 这为通过第一性原理与统计力学结合预测复杂合金相图，以及理解振动熵在稳定高熵或亚稳相中的作用提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "AKM Sadman Mahmud"}, {"name": "Hassan Albuhairan"}, {"name": "Marek Mihalkovic"}, {"name": "Michael Widom"}], "featured_authors": [{"name": "AKM Sadman Mahmud"}, {"name": "Hassan Albuhairan"}, {"name": "Marek Mihalkovic"}, {"name": "Michael Widom"}], "author_count": 4}, {"id": "2607.06756", "category": "cond-mat", "title": "Topological charge, helicity and vorticity conservation and the reverse spin-current model in the II-nd type multifferoics", "abstract": "The topological charge and its density are related to the spin vorticity, while the spin vorticity is a part of full vorticity of the medium. The full vorticity is related to an integral of motion called the hydrodynamic helicity. Relation between two integrals of motion (the topological charge and the hydrodynamic helicity) is traced. The role of the spin-current model of the electric polarization formation due to the specific spin distribution in the helicity conservation is demonstrated. The reverse spin-current model is suggested to demonstrate the contribution of the polarization in the spin evolution equation, its importance for the helicity conservation is shown as well. Spin-field model of the electric polarization is the second model for the electric polarization (the deformation, firstly) formation due to the specific spin distribution, which appears from the same principles, but it has nonstationary origin. Moreover, the reverse spin-current model gives a mechanism for the spin structure formation due to the electric polarization in the system. It also appears as the requirement for the conservation of the helicity and the topological charge.", "url": "https://arxiv.org/abs/2607.06756", "type": "理论", "summary": "1. 该工作研究了第二类多铁性材料中拓扑电荷、螺旋度和涡量守恒，并提出了逆自旋流模型。\n2. 其核心在于通过螺旋度守恒关联拓扑电荷与流体力学螺旋度，并论证逆自旋流模型对自旋演化方程中极化贡献的守恒作用。\n3. 这为理解电极化驱动自旋结构形成的机制提供了新视角，并揭示了拓扑荷与螺旋度守恒的内在约束。", "summary_source": "deepseek", "authors": [{"name": "Pavel A. Andreev"}], "featured_authors": [{"name": "Pavel A. Andreev"}], "author_count": 1}, {"id": "2607.06787", "category": "cond-mat", "title": "Microscopic Dynamical Entropy I: Quantifying Hamiltonian Irreversibility in Large and Small Systems", "abstract": "We introduce a Microscopic Dynamical Entropy (MDE) for Hamiltonian systems, defined with respect to a chosen partition of degrees of freedom into a system X and its environment Y. The construction is based on the conditional phase-space volume (CPV), or conditional Boltzmann entropy, associated with the unmonitored degrees of freedom Y. The MDE is a microscopically defined entropy functional of the marginal distribution $\\rho_X(t)$, obtained by discarding conditional microscopic information associated with Y from the Gibbs entropy of the joint XY system, while retaining exact Hamiltonian dynamics. This construction clarifies the microscopic origin of thermal entropy. The dependence of MDE solely on $\\rho_X(t)$ is consistent with the thermodynamic assumption that the entropy increment of a heat bath Y depends on its heat content and temperature, not on details of its probability distribution. Indeed, the MDE recovers dS = dQ/T connecting entropy increments to heat flow between system and environment. More generally, it provides a consistent description of irreversible relaxation under exact Hamiltonian dynamics, while permitting transient entropy decreases in small systems and in spin-echo type protocols. Under time-scale separation between X and Y, the MDE becomes strictly monotonic in time, recovering the familiar structure of irreversible thermodynamics. The MDE can foreshadow thermodynamics even in a small isolated Hamiltonian system, if X is a well chosen subset of its degrees of freedom. An example is the centre of mass of interacting particles confined to a box. Even for as few as N=10 particles, the MDE increases during relaxation towards a maximum at equilibrium, with increasing monotonicity at larger N. Taken together, our results show that the MDE offers a microscopic interpretation of nonequilibrium thermal entropy and its time dependence within exact Hamiltonian dynamics.", "url": "https://arxiv.org/abs/2607.06787", "type": "理论", "summary": "1. 该工作引入基于系统-环境划分与条件相空间体积的微观动力学熵（MDE），用以量化哈密顿动力学的不可逆性。\n2. 其关键在于从精确哈密顿动力学中恢复熵增量与热量流动的关系 dS=dQ/T，并在时间尺度分离下实现严格单调性。\n3. 这为小系统及自旋回波过程中熵的瞬态减小提供一致描述，并可预示孤立哈密顿系统的平衡弛豫。", "summary_source": "deepseek", "authors": [{"name": "Mingnan Ding"}, {"name": "Michael E. Cates"}], "featured_authors": [{"name": "Mingnan Ding"}, {"name": "Michael E. Cates"}], "author_count": 2}, {"id": "2607.06792", "category": "cond-mat", "title": "Symmetry-Enforced Chiral Phonons in Altermagnets via Magnon-Phonon Coupling", "abstract": "Chiral phonons are attractive for spintronics applications, however, their zero-field generation in conventional antiferromagnets is forbidden by combined parity and time-reversal ($\\mathcal{PT}$) symmetry. Here we demonstrate the emergence of chiral phonons in $\\mathcal{PT}$-breaking altermagnetic systems at zero field arising from relativistic magnon-phonon coupling. Focusing on the prototypical altermagnet CrSb, we utilize first-principles methods to calculate the hybridized magnon-polarons across the complete Brillouin zone. We show that this coupling imprints an altermagnetic $g$-wave symmetry directly onto the phonon angular momentum. Furthermore, we demonstrate anomalous spin and phonon angular momentum Nernst responses arising from finite Berry curvatures. These findings establish that chiral lattice dynamics can arise in compensated magnetic ground states without requiring external fields, positioning bulk altermagnets as material candidates for zero-field spin caloritronics and chiral phononics.", "url": "https://arxiv.org/abs/2607.06792", "type": "理论", "summary": "1. 该工作基于第一性原理计算，证明在PT对称性破缺的交变磁体CrSb中，通过相对论性磁子-声子耦合可在零场下产生手性声子。\n2. 核心创新在于揭示该耦合将交变磁体的g波对称性直接印记到声子角动量上，并导致由非零贝里曲率驱动的反常自旋与声子角动量能斯特响应。\n3. 这一发现确立了块体交变磁体作为零场自旋热电子学和手性声子学候选材料的重要地位，拓展了补偿磁基态中手性晶格动力学的实现途径。", "summary_source": "deepseek", "authors": [{"name": "Philipp Rieger"}, {"name": "Markus Weißenhofer"}, {"name": "Sergiy Mankovsky"}, {"name": "Peter M. Oppeneer"}], "featured_authors": [{"name": "Philipp Rieger"}, {"name": "Markus Weißenhofer"}, {"name": "Sergiy Mankovsky"}, {"name": "Peter M. Oppeneer"}], "author_count": 4}, {"id": "2607.06812", "category": "cond-mat", "title": "Driven square lattice of quantum dots in a magnetic field coupled to a cylindrical FIR-photon cavity", "abstract": "We present a comprehensive computational study of driven quantum dot arrays in a square lattice configuration, subject to an external magnetic field and coupled to a cylindrical far-infrared photon cavity. The driving is introduced through a harmonic modulation of the full electron-photon interaction, therefore including both paramagnetic and diamagnetic contributions. The electron-electron Coulomb interactions are treated within density functional theory, while the electron-photon coupling is modeled using a many-body configuration interaction approach at each iteration of the density functional. By exploiting the unique properties of the cylindrical TE$_{011}$ cavity mode, we demonstrate selective enhancement of diamagnetic two-photon transitions. Our results reveal that the effectiveness of harmonic modulation of the electron-photon interaction is strongly dependent on both the driving frequency and the electron occupation number per dot. When the driving frequency approaches twice the cavity photon frequency, the system exhibits resonant behavior characterized by efficient photon pumping, occupation of higher-order photon replicas, and activation of collective radial Coulomb breathing modes. These findings establish a controllable mechanism for manipulating photon states in coupled quantum dot-cavity systems and provide insights into the interplay among harmonic modulation, photonic excitations, magnetic confinement, and many-body electron correlations in dimensionally reduced nanostructures.", "url": "https://arxiv.org/abs/2607.06812", "type": "理论+数值", "summary": "1. 该工作通过密度泛函结合组态相互作用方法，全面计算研究了方晶格量子点阵列在外磁场与圆柱远红外光子腔耦合下的谐波调制驱动电子-光子多体动力学，包含顺磁与抗磁贡献。\n2. 其核心进展在于利用圆柱TE011腔模独特性质选择性增强抗磁双光子跃迁，并揭示驱动频率接近两倍腔频时系统呈现高效光子泵浦、高阶光子复制及集体径向库仑呼吸模式共振激活，且有效性强烈依赖驱动频率与电子占据数。\n3. 这为通过频率调控谐波调制实现量子点-腔系统中光子态的可控操纵提供了明确路径，并深化了对谐波驱动、光激发、磁约束与低维多体电子关联耦合机制的理解。", "summary_source": "deepseek", "authors": [{"name": "Vidar Gudmundsson"}, {"name": "Vram Mughnetsyan"}, {"name": "Hsi-Sheng Goan"}, {"name": "Jeng-Da Chai"}, {"name": "Nzar Rauf Abdullah"}, {"name": "Chi-Shung Tang"}, {"name": "Wen-Hsuan Kuan"}, {"name": "Valeriu Moldoveanu"}, {"name": "Andrei Manolescu"}], "featured_authors": [{"name": "Vidar Gudmundsson"}, {"name": "Vram Mughnetsyan"}, {"name": "Hsi-Sheng Goan"}, {"name": "Wen-Hsuan Kuan"}, {"name": "Valeriu Moldoveanu"}, {"name": "Andrei Manolescu"}], "author_count": 9}, {"id": "2607.06814", "category": "cond-mat", "title": "Microscopic Dynamical Entropy II: Statistical and Stochastic Thermodynamics of Hamiltonian Systems", "abstract": "The Microscopic Dynamical Entropy (MDE) introduced in Ref. [1] describes irreversible relaxation of selected variables x within a finite closed Hamiltonian system of fixed total energy E. Here we extend the framework to arbitrary total-energy distributions and time-dependent Hamiltonians. This allows work interactions with external agents or protocols, crucial in stochastic and classical thermodynamics, and driven systems more generally, to be addressed directly. The central step is to reduce the full microscopic description in terms of selected variables x and unmonitored variables y to one in terms of the selected variables and the instantaneous total energy (x,E). The unmonitored degrees of freedom y in Y enter through their conditional phase-space volume (CPV) $\\Omega_Y(x,E,t)$. This construction allows work and heat to be defined directly for finite Hamiltonian composites, including cases where Y is so small that its temperature is not well defined. We demonstrate monotonic MDE growth, corresponding to the macroscopic second law, under mixing and time-scale separation even for driven systems with arbitrary energy distributions. At trajectory level, we derive detailed and integral fluctuation relations for the MDE, generalising standard large-bath results. We verify these numerically in a driven few-particle Hamiltonian system, showing the emergence of stochastic thermodynamics for collective coordinates, such as the centre-of-mass position, even in closed systems with only ten or twenty degrees of freedom. Physically, these fluctuation relations connect irreversibility to the change in the number of unmonitored microstates compatible with initial and final data for the observed coordinates. Together, our results provide a finite-system Hamiltonian foundation for the emergence of classical and stochastic thermodynamics and extend their applicability to surprisingly small heat baths.", "url": "https://arxiv.org/abs/2607.06814", "type": "理论+数值", "summary": "1. 该工作将微观动力学熵（MDE）框架推广至任意总能量分布和含时哈密顿量，直接处理驱动有限封闭哈密顿系统中选定量与未监测自由度的不可逆弛豫。\n2. 核心在于通过选定量与瞬时总能量(x,E)的约化描述，利用未监测自由度的条件相空间体积Ω_Y(x,E,t)在温度不明确情形下直接定义功与热，并验证了驱动系统中MDE的单调增长及轨迹级涨落关系。\n3. 这为经典与随机热力学提供了有限哈密顿系统基础，将涨落关系与不可逆性推广至仅含十到二十个自由度的极小热库，启发了极端小系统中热力学现象的微观描述。", "summary_source": "deepseek", "authors": [{"name": "Mingnan Ding"}, {"name": "Michael E. Cates"}], "featured_authors": [{"name": "Mingnan Ding"}, {"name": "Michael E. Cates"}], "author_count": 2}, {"id": "2607.06822", "category": "cond-mat", "title": "A neural-network Maxwell's demon learns cold damping for work extraction", "abstract": "We train a neural-network Maxwell's demon to extract work from a model of an underdamped micromechanical cantilever subject to thermal noise. The demon, which periodically adjusts the position of a harmonic trap, is trained to maximize the power extracted under steady-state operation. When the demon is given the cantilever position and trap position as inputs it learns a refined version of an existing hand-designed protocol, yielding a substantial improvement in performance. When the demon receives the oscillator velocity as input it discovers a qualitatively different strategy that extracts substantially more work, close to the theoretical power bound. Analysis of the protocol shows that it implements {\\em cold damping}: the trap position is displaced approximately linearly with velocity, producing an effective increase of the oscillator's damping coefficient and a reduction of its effective temperature. Thus a neural-network Maxwell's demon rediscovers a well-known cooling strategy from optomechanics, revealing a simple physical mechanism underlying near-optimal work extraction from thermal fluctuations in an underdamped system.", "url": "https://arxiv.org/abs/2607.06822", "type": "理论", "summary": "1. 该工作训练神经网络麦克斯韦妖，从欠阻尼微机械悬臂梁热噪声模型中通过调整谐振陷阱位置提取功。\n2. 其卖点在于网络自主发现了冷阻尼策略，即陷阱位移与速度近似线性关联，有效增加阻尼系数并降低系统有效温度，输出功率接近理论上限。\n3. 这揭示了神经网络可重新发现光力学中成熟的冷却方案，为理解欠阻尼热涨落下近最优功提取的物理机制提供了简洁框架。", "summary_source": "deepseek", "authors": [{"name": "Stephen Whitelam"}, {"name": "Sergio Ciliberto"}, {"name": "Ludovic Bellon"}], "featured_authors": [{"name": "Stephen Whitelam"}, {"name": "Sergio Ciliberto"}, {"name": "Ludovic Bellon"}], "author_count": 3}, {"id": "2607.06848", "category": "cond-mat", "title": "Large-scale pseudopotential density functional theory calculations using orthogonalized enriched finite element basis", "abstract": "We present an efficient and scalable computational framework for pseudopotential Kohn-Sham density functional theory (KS-DFT) calculations using an enriched finite element (EFE) basis. The EFE basis is formed by augmenting the classical finite element (CFE) basis with compact atom-centered functions, which we term enrichment functions. The key idea is to combine the completeness of a finite element basis with the efficiency of an atom-centered basis. We orthogonalize the enrichment functions with respect to the underlying CFE basis to simultaneously improve the conditioning of the EFE basis and the efficiency of evaluating the inverse of the overlap matrix. To efficiently solve the Kohn-Sham eigenvalue problem, we employ a residual-based Chebyshev subspace iteration approach that is tolerant to approximations in the evaluation of the inverse of the overlap matrix. We demonstrate the accuracy of the framework as compared to the widely available DFT packages. For benchmark non-periodic calculations, ranging up to 39,083 electrons, the EFE basis offers a $5-7\\times$ reduction in degrees of freedom over the CFE basis. As a result of this, EFE achieves a $5-9\\times$ reduction in computational cost over the CFE basis. The EFE basis also provides a $4-5\\times$ reduction in the required memory compared to the CFE basis, thus allowing for optimal utilization of computational resources. Finally, we demonstrate that the EFE basis affords good parallel scalability. Overall, the EFE basis offers a systematically convergent, fast, scalable, resource-efficient basis for pseudopotential DFT calculations.", "url": "https://arxiv.org/abs/2607.06848", "type": "理论+数值", "summary": "1. 该工作提出了一类基于正交化富集有限元基的赝势Kohn-Sham密度泛函理论计算框架。\n2. 通过将原子中心富集函数正交化于经典有限元基，同时改善了基组条件数与重叠矩阵逆的评估效率，结合残差型切比雪夫子空间迭代，实现了5–9倍的计算成本降低。\n3. 该框架为大规模非周期电子结构计算提供了一种系统收敛、资源高效且并行可扩展的方案，适用于高性能计算环境下的资源优化利用。", "summary_source": "deepseek", "authors": [{"name": "Avirup Sircar"}, {"name": "Bikash Kanungo"}, {"name": "Sambit Das"}, {"name": "Vikram Gavini"}], "featured_authors": [{"name": "Avirup Sircar"}, {"name": "Bikash Kanungo"}, {"name": "Sambit Das"}, {"name": "Vikram Gavini"}], "author_count": 4}, {"id": "2607.06866", "category": "cond-mat", "title": "Disorder signatures in coherent electronic waveguides", "abstract": "Microscopic disorder in a coherent conductor is encoded in the magnitude of the transmitted current and in the energy- and channel-resolved structure of the scattering response. We develop a conductance-balanced learning framework for identifying microscopic disorder mechanisms from coherent quantum-transport spectra. Using armchair graphene nanoribbons as controlled multichannel tight-binding waveguides, we generate ensembles in which distinct disorder classes occupy the same intervals of integrated transmission, removing the dominant shortcut associated with average conductance. Within this constrained setting, we compare scalar transmission spectra with transmission-eigenvalue spectra, and use supervised classification, scale-normalizing controls, plateau-resolved tests, and principal-component analysis to identify the spectral structures that remain informative. The learned distinctions persist after normalization of the conductance envelope and are strongest in multichannel energy windows, where mode mixing and channel redistribution shape the scattering response. Principal components provide interpretable transport coordinates whose loadings identify the energy and eigenchannel sectors responsible for the dominant spectral deformations. The results establish a controlled AI-assisted protocol for learning disorder signatures from nonlinear quantum-scattering data.", "url": "https://arxiv.org/abs/2607.06866", "type": "理论+数值", "summary": "1. 该工作提出一种电导平衡学习框架，从相干量子输运谱中识别微观无序机制。\n2. 通过约束扶手椅型石墨烯纳米带多通道系综的集成传输区间，揭示了多通道能窗中模式混合与通道重排主导的无序谱结构信息。\n3. 这为从非线性量子散射数据中建立受控且可解释的无序特征AI识别协议提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Alejandro Lopez-Bezanilla"}], "featured_authors": [{"name": "Alejandro Lopez-Bezanilla"}], "author_count": 1}, {"id": "2607.06878", "category": "cond-mat", "title": "Thermoelectric and Magnetic Properties in Doped Fe$_2$VAl within a Bipolar Random Anderson Model", "abstract": "We investigate the thermoelectric and magnetic properties of Si-substituted $n$-type and Ti-substituted $p$-type Heusler alloy Fe$_2$VAl using the bipolar random Anderson model, which has been introduced recently to study antisite-defect effects associated with the sign change of the Seebeck coefficient in thermally quenched Fe$_2$VAl. Based on the electronic states of both $n$-type and $p$-type compounds, with the rigid-band shift of the Fermi energy and a temperature-dependent scattering rate taken into account, we elucidate how antisite defects simultaneously influence thermoelectric transport and local magnetic moments. We find that the magnetic moments are enhanced in $n$-type Fe$_2$VAl, whereas they are suppressed in $p$-type Fe$_2$VAl compared with the undoped compound. These contrasting magnetic responses highlight the impact of antisite spin polarization on thermoelectric properties and demonstrate the crucial role of antisite defects in realizing magneto-thermoelectric functionalities in Heusler-type alloys.", "url": "https://arxiv.org/abs/2607.06878", "type": "理论", "summary": "1. 该工作利用双极型随机安德森模型系统研究了n型与p型掺杂Fe₂VAl的热电和磁性质。\n2. 其核心在于通过刚性带移动和温度依赖散射率，阐明了反位缺陷同时调控热电输运与局域磁矩的机制。\n3. 这揭示了反位自旋极化导致的差异磁响应，为Heusler合金中的磁热电功能设计提供了关键物理依据。", "summary_source": "deepseek", "authors": [{"name": "Takami Tohyama"}, {"name": "Hidetoshi Fukuyama"}], "featured_authors": [{"name": "Takami Tohyama"}, {"name": "Hidetoshi Fukuyama"}], "author_count": 2}, {"id": "2607.06904", "category": "cond-mat", "title": "Negative and Zero Linear Compressibility in MCN (M = Ag, Au, Cu): A First-Principles Study", "abstract": "Negative linear compressibility (NLC) is the counterintuitive phenomenon in which a crystallographic axis expands under hydrostatic pressure. A related phenomenon, zero linear compressibility (ZLC), occurs when an axis shows no length change under pressure. Both responses are rare and arise in materials with highly anisotropic mechanical properties. Motivated by recent reports of anomalous behavior in metal cyanides - including negative thermal expansion and NLC - we use first-principles calculations to investigate the potential of the MCN family (M = Ag, Au, Cu) to exhibit ZLC or NLC. Our simulations reveal three main findings. First, we predict the existence of previously unreported phases: the P6mm phase for AgCN and CuCN, and the R3m phase for AuCN. Second, all six members of the MCN family studied exhibit extreme elastic anisotropy, which indeed leads to ZLC or NLC in each case. Third, we identify a mechanism for these responses distinct from previously reported ones. The mechanism arises from the unique \"bamboo forest\" geometry of the material: weakly interacting rigid rods whose sparse packing allows pressure to be accommodated through changes in packing density rather than rod compression. This mechanism enables the anomalous response to persist over a wide pressure range, contrasting favorably with other materials that exhibit similar behavior. Our findings expand the relatively small family of materials known to exhibit ZLC or NLC and provide deeper insight into the microscopic origin of these unusual mechanical responses.", "url": "https://arxiv.org/abs/2607.06904", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算，预测了MCN（M=Ag, Au, Cu）家族中新相的存在，并证实其全体成员均呈现负线性压缩或零线性压缩行为。\n2. 核心物理机制源于独特的“竹林”几何结构：弱相互作用的刚性杆在压力下通过改变堆积密度而非杆自身压缩来响应，导致反常压缩在宽压力范围内持续。\n3. 这一发现不仅拓展了极少的已知NLC/ZLC材料家族，还为设计基于几何拓扑的各向异性力学响应材料提供了微观物理图像和理论指导。", "summary_source": "deepseek", "authors": [{"name": "Arlies Valdespino"}, {"name": "Abduljelili Popoola"}, {"name": "Sergey Lisenkov"}, {"name": "Inna Ponomareva"}], "featured_authors": [{"name": "Arlies Valdespino"}, {"name": "Abduljelili Popoola"}, {"name": "Sergey Lisenkov"}, {"name": "Inna Ponomareva"}], "author_count": 4}, {"id": "2607.06966", "category": "cond-mat", "title": "Anomalous Hall and Nernst effects driven by static and fluctuating spin chiralities on Kagome lattice", "abstract": "We theoretically investigate the anomalous Hall and Nernst effects (AHE and ANE) in a two dimensional Kagome lattice to uncover the distinct roles of static and fluctuating scalar spin chi ralities. Employing Monte Carlo simulations incorporating with a tight binding Hamiltonian via the s-d exchange interaction, we explicitly evaluate the anomalous transport coefficients. A key finding is the systematic disentanglement of the macroscopic responses into an intrinsic contribu tion, governed by momentum space Berry curvature induced by static chirality, and an extrinsic skew scattering contribution driven by real space dynamical spin fluctuations. We demonstrate a pronounced mechanistic crossover: deep in magnetically ordered phases like the skyrmion crystal, the intrinsic Berry curvature dictates the transport behavior. However, approaching the magnetic order-disorder critical regime, strong thermal fluctuations disrupt static noncoplanar spin configu rations, drastically suppressing intrinsic responses. Here, dynamical chiral fluctuations emerge as the dominant driving force. By delineating the phase regimes governed by static versus fluctuating chiralities, this work elucidates the distinct microscopic mechanisms dictating anomalous transport in frustrated magnetic systems.", "url": "https://arxiv.org/abs/2607.06966", "type": "理论+数值", "summary": "1. 该工作利用蒙特卡洛模拟与紧束缚s-d交换模型，理论分析了二维Kagome晶格中静态和涨落标量自旋手性对反常霍尔与能斯特效应的不同贡献。\n2. 其物理卖点是将反常输运系数系统性分离为静态手性诱导的贝里曲率内禀部分和动力学自旋涨落驱动的外禀斜散射部分，并表明在斯格明子晶格相中内禀机制主导，而在磁性有序-无序临界区涨落手性成为主要驱动力。\n3. 这为在受挫磁体中区分静态与动态手性主导的反常输运机制提供了明确理论预言，并为实验探测手性涨落、设计基于手性效应的自旋热电器件开辟了途径。", "summary_source": "deepseek", "authors": [{"name": "He-Lin Li"}, {"name": "Zhen-Gang Zhu"}, {"name": "Gang Su"}], "featured_authors": [{"name": "He-Lin Li"}, {"name": "Zhen-Gang Zhu"}, {"name": "Gang Su"}], "author_count": 3}, {"id": "2607.06969", "category": "cond-mat", "title": "AI2Pot: A scalable and unified framework for machine-learning interatomic potential development and large-scale molecular dynamic simulations", "abstract": "Machine-learning interatomic potentials (MLIPs) bridge the accuracy of first-principles calculations and the efficiency required for large-scale molecular dynamics (MD) simulations. However, existing MLIP software remains fragmented across different model architectures, making it difficult to establish unified workflows that support flexible model development, efficient training, and scalable MD deployment. Here, we present AI2Pot, a scalable and unified MLIP framework that seamlessly integrates model training, evaluation, and large-scale MD simulations with PyTorch-compatible ecosystem. Instead of relying on generic automatic differentiation for expensive atomistic operators, AI2Pot re-engineers the core computations of Moment tensor potential (MTP) and Neuroevolution potential (NEP) for both training and inference using hand-crafted C++/CUDA code. These specialized operators constitute a unified computational backend shared by training and inference, improving training-inference consistency and reducing memory usage by avoiding large intermediate caches. As a result, AI2Pot enables fast inference for large-scale atomic systems containing millions of atoms on a single GPU, while retaining the flexibility of PyTorch for model construction, training, and evaluation. Trained models can be deployed in ASE and LAMMPS for MD simulations. Furthermore, AI2Pot provides a companion command-line toolkit (AI2Pot-cli) and Python APIs to facilitate practical MLIP workflows. By unifying high-performance atomistic computing with modern machine-learning ecosystems, AI2Pot offers an user-friendly end-to-end framework for the developing, training, and deploying MLIPs for large scale MD.", "url": "https://arxiv.org/abs/2607.06969", "type": "理论+数值", "summary": "1. 该工作提出了一个统一且可扩展的机器学习原子间势框架AI2Pot，整合了模型训练、评估与大规模分子动力学模拟。\n2. 其技术卖点在于通过手写C++/CUDA算子重新实现MTP和NEP核心计算，构建训练与推理共享的统一后端，提升训练-推理一致性并降低内存占用。\n3. 这为在大规模原子系统中高效开发与部署机器学习势能模型提供了用户友好的端到端解决方案。", "summary_source": "deepseek", "authors": [{"name": "Hanyu Liu"}, {"name": "Linggang Zhu"}, {"name": "Xuanguang Zhang"}, {"name": "Ning Yang"}, {"name": "Jian Zhou"}, {"name": "Zhimei Sun"}], "featured_authors": [{"name": "Hanyu Liu"}, {"name": "Linggang Zhu"}, {"name": "Xuanguang Zhang"}, {"name": "Ning Yang"}, {"name": "Jian Zhou"}, {"name": "Zhimei Sun"}], "author_count": 6}, {"id": "2607.07002", "category": "cond-mat", "title": "Size focusing in core-shell precipitates: A phase-field study", "abstract": "Due to their enhanced resistance to coarsening and/or creep, aluminium alloys with precipitates of two distinct phases in a core-shell morphology are of great contemporary interest. In this paper, we focus on the curious observation in two recent studies on Al-Sc-Li and Al-Yb-Li alloys that growth of the shell phase leads to a narrowing of the size distribution. We have studied this phenomenon, known as size focusing, using a theoretical framework (which extends Zener's theory of diffusional growth to a core-shell precipitate) and multi-precipitate simulations based on a phase field model. Our results yield key theoretical insights as well as conclusions with practical significance. (a) On the theoretical front, we show clearly that size focusing is a growth phenomenon: it ends when shell growth ends, and coarsening begins. (b) On the practical front, our results offer guidelines for designing alloys with narrower size distributions: size focusing is promoted in alloys with greater shell volume fractions and greater inter-precipitate spacing.", "url": "https://arxiv.org/abs/2607.07002", "type": "理论+数值", "summary": "1. 该工作通过相场模型及扩展的Zener扩散生长理论，系统研究了Al-Sc-Li和Al-Yb-Li合金中核壳析出相的尺寸聚焦现象。\n2. 其核心在于明确尺寸聚焦为生长过程伴随效应，随壳层生长终止而结束，并受壳层体积分数与析出相间距调控。\n3. 这为通过调控合金成分与析出相空间分布以优化窄尺寸分布性能提供了理论指导。", "summary_source": "deepseek", "authors": [{"name": "Soumya Mishra"}, {"name": "T. A. Abinandanan"}], "featured_authors": [{"name": "Soumya Mishra"}, {"name": "T. A. Abinandanan"}], "author_count": 2}, {"id": "2607.07037", "category": "cond-mat", "title": "Minimizing propagated density errors of atomic core-electron for simultaneously accurate bandgaps and lattice constants in closed-shell Copper semiconductors", "abstract": "Density functional theory struggles to accurately determine electron density of atoms, whose error is inevitably encoded into the pseudopotential and propagated into solid-state calculations. However, little is known about how this affects accuracy nor how to remedy it. In this work, through a systematic study of the effect of Cu atomic density on bandgap and lattice constants of over 50 Cu-containing simple closed-shell semiconductors, we find that core-electron density can drastically affect nuclear attraction to valence electrons and subsequent charge distribution and energy position of Cu 3$d$ electrons. The error can be eliminated at its source by employing modified Hartree-Fock pseudopotentials for Cu core while retaining (semi-)local functionals for valence electrons. This real-space partitioning approach leads to simultaneous high-accuracy in bandgap and lattice constants across the entire material class.", "url": "https://arxiv.org/abs/2607.07037", "type": "理论+数值", "summary": "1. 该工作系统研究了Cu原子核心电子密度误差对超50种闭壳铜半导体带隙和晶格常数的影响。\n2. 其卖点在于通过改用修正的Hartree-Fock赝势处理Cu核心电子而保留价电子半局域泛函，在实空间分区消除误差源头。\n3. 这为在密度泛函理论中同时高精度计算带隙和晶格常数提供了可推广的核心电子修正方案。", "summary_source": "deepseek", "authors": [{"name": "Kuiyu Ye"}, {"name": "Haitao Liu"}, {"name": "Yuanchang Li"}, {"name": "Shengbai Zhang"}], "featured_authors": [{"name": "Kuiyu Ye"}, {"name": "Haitao Liu"}, {"name": "Yuanchang Li"}, {"name": "Shengbai Zhang"}], "author_count": 4}, {"id": "2607.07041", "category": "cond-mat", "title": "A low-energy effective Hamiltonian for Landau quasiparticles: II Application to the contact Fermi gas", "abstract": "This article follows up on arXiv:2511.15938 , in which we developed a new renormalization scheme to construct a quantized theory of Fermi liquids. Here, we apply this formalism to a low-temperature atomic Fermi gas where the short-range interactions are fully parametrized by the s-wave scattering length $a$. We benchmark our renormalized theory by recovering known perturbative results on the static properties of the Fermi gas, such as the Lee-Huang-Yang expansion of the equation of state, the Galitskii expansion of the momentum distribution, and the Gor'kov- Melik Barkhudarov preexponential correction to the critical temperature. We then turn to the transport dynamics and demonstrate the presence of a preexponential correction to the speed of zero sound when including corrections of second order in $a$. Finally, we develop an efficient numerical method to solve the transport equation exactly, and we apply to study the crossover from the collisionless to the hydrodynamic regime in the density and polarisation response functions.", "url": "https://arxiv.org/abs/2607.07041", "type": "理论+数值", "summary": "1. 该工作将新发展的重正化方案应用于接触费米气体，构建了描述朗道准粒子的低能有效哈密顿量。\n2. 其技术卖点在于恢复Lee-Huang-Yang展开、Galitskii展开与临界温度预指数修正等已知微扰结果，并发现零声速存在二阶预指数修正。\n3. 这为精确求解输运方程、研究密度与极化响应从无碰撞到流体动力学区域的跨接提供了有效数值途径。", "summary_source": "deepseek", "authors": [{"name": "Pierre-Louis Taillat"}, {"name": "Hadrien Kurkjian"}], "featured_authors": [{"name": "Pierre-Louis Taillat"}, {"name": "Hadrien Kurkjian"}], "author_count": 2}, {"id": "2607.07086", "category": "cond-mat", "title": "A modified Moss rule highlights underexplored classes of high refractive index materials", "abstract": "High refractive index dielectrics are central to photonic applications, yet the empirical Moss rule imposes a fundamental trade-off between refractive index and optical transparency. We introduce a modified Moss rule anchored to the optical absorption edge rather than the fundamental bandgap, capturing materials where various physical mechanisms suppress absorption well above the electronic gap. Screening the Materials Project database with this metric reveals recurring chemical compositions and structural prototypes in the materials with the most promising refractive index/transparency trade-offs. These materials include chalcopyrites, Zintl pnictides, and early transition metal multi-anion chalconitrides and oxychalcogenides compounds. Hybrid density functional theory calculations reveal that the chalconitride (Hf,Zr)2(S,Se)N2 family can achieve a combination of ultra-high refractive indices, low effective masses and transparency windows extending deep into the UV, surpassing state-of-the-art TiO2 and SiC. Our results establish (Hf,Zr)2(S,Se)N2 compounds as a unique and largely unexplored material family for next-generation photonic applications.", "url": "https://arxiv.org/abs/2607.07086", "type": "理论+数值", "summary": "1. 该工作提出一项基于光学吸收边而非带隙的修正Moss规则，用于筛选高折射率电介质。\n2. 其核心卖点在于揭示了吸收抑制机制可在带隙以上扩展，并识别出(Hf,Zr)2(S,Se)N2等化合物兼具超高折射率、低有效质量和深紫外透明性。\n3. 这为挖掘光电子应用中尚未充分探索的材料家族提供了化学组分与结构原型的系统化指导。", "summary_source": "deepseek", "authors": [{"name": "Eugène Bertin"}, {"name": "Finja Tadge"}, {"name": "Andrea Crovetto"}], "featured_authors": [{"name": "Eugène Bertin"}, {"name": "Finja Tadge"}, {"name": "Andrea Crovetto"}], "author_count": 3}, {"id": "2607.07090", "category": "cond-mat", "title": "Ethaline deep eutectic solvent under nanoconfinement: Unveiling structural and dynamical changes", "abstract": "Hybrid nanomaterials incorporating deep eutectic solvents (DES) in porous hosts or at solid interfaces are gaining increasing attention for their potential interest across a wide range of applications. Under these conditions, the performances of DESs may be influenced by interfacial effects and spatial restrictions. In this study, we examined the effects of nanoconfinement on both the structure and molecular dynamics of the prototypical DES ethaline (a mixture of choline chloride and ethylene glycol) when confined within the cylindrical mesopores of SBA-15 (Dp $\\approx$ 8.1 nm) and MCM-41 (Dp $\\approx$ 3.5 nm) silicas, using neutron diffraction and quasielastic neutron scattering. It demonstrates that ethaline remains structurally homogeneous under confinement, showing no evidence of core-shell segregation within the pore cross-section. The molecular dynamics of the confined ethaline preserve the key characteristics observed in its bulk state. Translational diffusion follows a jump-diffusion mechanism, with diffusion coefficients that remain remarkably close to the bulk values, showing only a modest reduction in MCM-41. A more pronounced increase in the residence time t0 between translational molecular jumps is observed. It corresponds to roughly a factor of 3-8 under confinement in SBA-15, and reaches up to a tenfold enhancement in MCM-41 relative to bulk. Similarly, the characteristic relaxation time, tL, associated with the localized in-cage motion of ethaline, increases by approximately 20% in SBA-15 and up to 50% in MCM-41. However, the molecular trajectories, modeled from the elastic incoherent structure factor, remain largely preserved under confinement, showing only a marginal reduction in intra-basin motional amplitudes.", "url": "https://arxiv.org/abs/2607.07090", "type": "理论+数值", "summary": "1. 采用中子衍射与准弹性中子散射，研究了原型低共熔溶剂乙二醇氯化胆碱在SBA-15与MCM-41硅胶介孔中的结构与动力学变化。\n2. 发现限域下溶剂保持结构均匀，无核壳分离；扩散系数接近体相，但分子跳跃间停留时间增至3-10倍，局域弛豫时间增加20%-50%。\n3. 这为理解纳米限域对低共熔溶剂微观动力学的调控机制及其在杂化纳米材料中的应用提供了定量基准与设计依据。", "summary_source": "deepseek", "authors": [{"name": "Kamar Mohammad Nadim"}, {"name": "Mozhdehei Armin"}, {"name": "Lefort Ronan"}, {"name": "Moréac Alain"}, {"name": "Ollivier Jacques"}, {"name": "Appel Markus"}, {"name": "Viviana Cristiglio"}, {"name": "Denis Morineau"}], "featured_authors": [{"name": "Kamar Mohammad Nadim"}, {"name": "Mozhdehei Armin"}, {"name": "Lefort Ronan"}, {"name": "Appel Markus"}, {"name": "Viviana Cristiglio"}, {"name": "Denis Morineau"}], "author_count": 8}, {"id": "2607.07092", "category": "cond-mat", "title": "Unveiling Nanoscale Surface Damage Dynamics in Swift Heavy Ion Irradiated Gallium Nitride", "abstract": "This work systematically unveils the nanoscale surface damage dynamics in gallium nitride by investigating the atomistic mechanisms of hillock formation. The results identify two distinct hillock morphologies dependent on electronic energy loss (Se) values. Bell-shaped hillocks form under 18.2 keV/nm Kr irradiation, whereas crater-rim hillocks with central holes emerge under 40.2 keV/nm Ta irradiation. Microstructural analysis reveals that Ga-rich hillocks are accompanied by the generation of metastable zincblende nanodomains. These nanodomains preferentially aggregate around the periphery or sidewalls of the hillocks and exhibit a high spatial correlation with screw dislocations. Further temperature-dependent studies indicate that elevated temperatures significantly enlarge the overall dimensions of the hillock structures without altering their fundamental morphologies. Notably, under Ta irradiation above 1200 K, the high temperatures drastically reduce the viscosity and surface tension of liquid gallium. This enhanced fluidity of the transient molten phase promotes the formation of penetrating nanochannels.", "url": "https://arxiv.org/abs/2607.07092", "type": "理论", "summary": "1. 该工作系统揭示了快重离子辐照氮化镓中纳米尺度表面损伤动力学，识别出依赖于电子能量损失的两种小山丘形态及其原子机制。\n2. 关键发现是富镓小山丘伴随亚稳态闪锌矿纳米域，且高温下液态镓粘度和表面张力骤降导致的穿透纳米通道形成。\n3. 这为理解重离子辐照下半导体表面瞬态熔融相动力学提供了微观视角，并启发对缺陷工程及极端条件下材料响应机制的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Jiayu Liang"}, {"name": "Shaowei He"}, {"name": "Wenlong Liao"}, {"name": "Tan Shi"}, {"name": "Hang Zang"}, {"name": "Yonghong Li"}, {"name": "Wenbo Liu"}, {"name": "Xiaojun Fu"}, {"name": "Chuanjian Yao"}, {"name": "Huan He"}, {"name": "Jianan Wei"}, {"name": "Chaohui He"}], "featured_authors": [{"name": "Jiayu Liang"}, {"name": "Shaowei He"}, {"name": "Wenlong Liao"}, {"name": "Huan He"}, {"name": "Jianan Wei"}, {"name": "Chaohui He"}], "author_count": 12}, {"id": "2607.07113", "category": "cond-mat", "title": "Density-Induced Reentrant Coarsening in a Two-Temperature System", "abstract": "Understanding how nonequilibrium driving modifies phase-separation kinetics remains a fundamental challenge. Here we show that phase separation in a two-temperature system exhibits a striking density-induced reentrant coarsening behavior. Using Brownian dynamics simulations and a coarse-grained field-theoretic model, we find that the characteristic domain size grows as $L(t)\\sim t^{1/z}$, displaying a reentrant sequence $(t^{1/3} \\rightarrow t^{1/4}\\rightarrow t^{1/3})$ with increasing density. While the low- and high-density regimes are governed by classical curvature-driven bulk diffusion, the intermediate-density regime exhibits anomalously slow growth. We show that this slowdown originates from a transport bottleneck arising from the interplay of particle diffusivity, particle availability, and attachment kinetics, which suppresses the effective mass flux between domains. Unlike equilibrium phase separation, where density primarily affects morphology and crossover scales, the two-temperature drive renders density a key control parameter for coarsening pathways. Our results uncover a nonequilibrium mechanism for anomalous domain growth in two-temperature systems.", "url": "https://arxiv.org/abs/2607.07113", "type": "理论+数值", "summary": "1. 该工作通过布朗动力学模拟与粗粒化场论，揭示了双温度系统相分离中由密度驱动的重入粗化现象。\n2. 其核心发现是中间密度区间出现反常慢速畴生长（指数由1/3降至1/4），源于扩散率、粒子可用性与附着动力学耦合形成的输运瓶颈。\n3. 这确立了非平衡驱动下密度作为粗化路径关键控制参数的新机制，为调控非平衡相变动力学提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Partha Sarathi Mondal"}, {"name": "Anish Kumar"}, {"name": "Nayana Venkatareddy"}, {"name": "Prabal K. Maiti"}, {"name": "Shradha Mishra"}], "featured_authors": [{"name": "Partha Sarathi Mondal"}, {"name": "Anish Kumar"}, {"name": "Nayana Venkatareddy"}, {"name": "Prabal K. Maiti"}, {"name": "Shradha Mishra"}], "author_count": 5}, {"id": "2607.07163", "category": "cond-mat", "title": "Emergent superconductivity upon disordering a topological insulator", "abstract": "We study the emergence of superconductivity in a quantum spin Hall insulator and identify a disorder-driven enhancement of pairing arising from quantum geometry. Using sign-problem-free quantum Monte Carlo simulations of the attractive Bernevig-Hughes-Zhang (BHZ) Hubbard model, we obtain a quantum phase transition as a function of interaction strength for different impurity densities. In the clean limit, the system develops bulk superconductivity for Hubbard interaction $\\vert U \\vert$ above a finite critical strength. Interestingly, strong impurities significantly reduce such $\\vert U \\vert$ required for the onset of superconductivity. Our calculations indicate that Cooper pairing first nucleates in subgap ring states surrounding the impurities and then evolves into a globally coherent superconducting phase. Our results demonstrate that impurity-generated bound states can promote superconductivity in systems with strong quantum geometry. This mechanism is expected to be relevant in nearly flat-band systems like moiré materials where quantum geometry plays a dominant role.", "url": "https://arxiv.org/abs/2607.07163", "type": "理论+数值", "summary": "1. 该工作通过无符号量子蒙特卡洛模拟，研究了量子自旋霍尔绝缘体中杂质无序诱导的超导电性，发现强杂质可显著降低超导所需的临界相互作用强度。\n2. 其核心发现是杂质周围亚能隙环态中的库珀对成核，以及量子几何效应如何增强配对，从而驱动超导相变。\n3. 这一无序促进超导的机制预计在莫尔材料等近乎平坦能带体系中具有普适性，为设计几何增强的超导态提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Carlos Eduardo S. P. Corsino"}, {"name": "Hermann Freire"}, {"name": "Anurag Banerjee"}], "featured_authors": [{"name": "Carlos Eduardo S. P. Corsino"}, {"name": "Hermann Freire"}, {"name": "Anurag Banerjee"}], "author_count": 3}, {"id": "2607.07248", "category": "cond-mat", "title": "Critical SO(5) scaling of entanglement entropy at honeycomb lattice deconfined criticality", "abstract": "The deconfined quantum critical point (DQCP) in square lattice S=1/2 quantum antiferromagnets has been extensively studied with a large body of evidence pointing to a weakly first-order transition scenario. Recent studies, which focused on entanglement at this nearly continuous DQCP in square lattice J-Q models, have observed conflicting bipartite entanglement entropy (EE) scaling behavior. One bipartition choice gave scaling coefficients in remarkable agreement with predictions from the unitary CFT corresponding to the putative DQCP. While another equally natural choice gave scaling coefficients in complete violation of unitary CFT that may be attributed to lack of scale invariance at the known weakly first-order behavior of the model. This motivates the exploration of DQCP behavior via entanglement measures in lattice models with distinct crystalline symmetries. Here we study a S=1/2 honeycomb model that hosts a nearly continuous transition between Néel and valence-bond-solid ground states relevant to probing DQCP. Using large-scale quantum Monte Carlo simulations, we compute the Rényi EE for a variety of bipartitions and test the CFT based description of the DQCP on the honeycomb lattice. For smooth bipartitions, we find no evidence of logarithmic corrections, in accordance with CFT, thereby essentially ruling out contributions from Goldstone modes. For subsystems with corners, CFT predicts universal logarithmic contributions, which we extract for corners with 60 and 120 degree angles and find close agreement with an emergent SO(5) CFT. While we observe scaling consistent with a critical system in the majority of cases, we also demonstrate an intriguing counterexample of the hexagon subsystem that exhibits a subtle period three oscillation. This results in three separate finite-size series, where the sign of the logarithmic term apparently changes depending on the series.", "url": "https://arxiv.org/abs/2607.07248", "type": "理论+数值", "summary": "1. 本文通过大规模量子蒙特卡洛模拟，研究了蜂窝晶格Néel-Valence-Bond-Solid去禁闭量子临界点处的Rényi纠缠熵标度行为。\n2. 其技术核心在于提取了60°与120°角的子区域通用对数修正项，并与SO(5)共形场论预测精确吻合，同时揭示了六边形分区出现的周期三振荡异常。\n3. 这为理解不同晶格对称性下去禁闭临界点的量子纠缠结构提供了关键证据，并暗示分区几何对临界标度的微妙调制作用。", "summary_source": "deepseek", "authors": [{"name": "Sankalp Kumar"}, {"name": "Jonathan D'Emidio"}, {"name": "Sumiran Pujari"}], "featured_authors": [{"name": "Sankalp Kumar"}, {"name": "Jonathan D'Emidio"}, {"name": "Sumiran Pujari"}], "author_count": 3}, {"id": "2607.07299", "category": "cond-mat", "title": "Electrical manipulation and detection of perpendicular altermagnetic order via proximitized Dirac semimetal", "abstract": "Altermagnets, which combine antiferromagnetic-like magnetic compensation with ferromagnetic-like broken time-reversal symmetry, hold great promise for high-density and ultrafast spintronic applications. However, the detection and switching of perpendicular altermagnetic order are fundamentally constrained by magnetic symmetry, restricting both fundamental studies and practical implementation. We realize robust electrical reading and deterministic switching of perpendicular altermagnetic order by designing a Dirac semimetal/altermagnet heterostructure of PtTe2/CrSb. This engineered interface enables anomalous Hall readout via altermagnetic proximity effect and delivers efficient spin-orbit torque for manipulating the epitaxial perpendicular Neel vector in CrSb. These findings significantly broaden the functional scope of altermagnetic heterostructures and pave the way for highly scalable altermagnetic memory.", "url": "https://arxiv.org/abs/2607.07299", "type": "理论", "summary": "1. 该工作设计了PtTe₂/CrSb狄拉克半金属/交替磁体异质结构，实现了垂直交替磁序的电学读取与确定性翻转。\n2. 其卖点在于利用交替磁近邻效应产生反常霍尔信号读取，并依靠自旋轨道转矩操控外延垂直奈尔矢量方向。\n3. 这为突破交替磁序的磁对称性限制，推动高扩展性交替磁存储器件提供了实验原型与操控路径。", "summary_source": "deepseek", "authors": [{"name": "Zhaohui Li"}, {"name": "Wenqing He"}, {"name": "Hua Bai"}, {"name": "Yang Wang"}, {"name": "Alexander J. Grutter"}, {"name": "Guoyi Shi"}, {"name": "Xiwen Zhang"}, {"name": "Christy Kinane"}, {"name": "Andrew Caruana"}, {"name": "Hui Ru Tan"}, {"name": "Yuchen Pu"}, {"name": "Chenhui Zhang"}, {"name": "Yongxi Wang"}, {"name": "Hanbum Park"}, {"name": "Anjan Soumyanarayanan"}, {"name": "Lei Shen"}, {"name": "Hyunsoo Yang"}], "featured_authors": [{"name": "Zhaohui Li"}, {"name": "Wenqing He"}, {"name": "Hua Bai"}, {"name": "Anjan Soumyanarayanan"}, {"name": "Lei Shen"}, {"name": "Hyunsoo Yang"}], "author_count": 17}, {"id": "2607.07307", "category": "cond-mat", "title": "Magnetocaloric properties of centered molecular quantum spin systems", "abstract": "We investigate the magnetocaloric properties of a class of centered magnetic molecules that are very similar in their magnetic properties. In particular, we study the magnetocaloric response of these molecules in the space of two exchange parameters and as function of the spin quantum numbers. Major figures of merit such as adiabatic temperature change and isothermal entropy change as well as theoretically achievable low temperatures show that overall ferromagnetic interactions are preferential as long as this does not lead to dipolar ordering.", "url": "https://arxiv.org/abs/2607.07307", "type": "理论", "summary": "1. 该工作研究了中心分子量子自旋系统的磁热性质，通过变分参数空间分析交换耦合与自旋量子数对磁热响应的影响。\n2. 技术核心在于揭示铁磁相互作用在避免偶极有序前提下能最大化绝热温变与等温熵变，并实现更低理论极限温度。\n3. 这为设计基于分子磁体的高效低温柔冷体系提供了明确的物理准则与交换参数调控方向。", "summary_source": "deepseek", "authors": [{"name": "H. Meel"}, {"name": "J. Schnack"}], "featured_authors": [{"name": "H. Meel"}, {"name": "J. Schnack"}], "author_count": 2}, {"id": "2607.07325", "category": "cond-mat", "title": "Taming nonlinear energy diffusion: The case of time-crystal energy condensates", "abstract": "We study a bulk-driven nonlinear variant of the Kipnis-Marchioro-Presutti model of stochastic energy diffusion in which local collisions are biased to induce a net energy flow, resembling the effect of an external field. Starting from the microscopic master equation, we derive the hydrodynamic description of the driven system via a local equilibrium approximation, obtaining explicit expressions for the energy current and the associated diffusivity and mobility transport coefficients, which are nonlinear functions of the local energy density. We test our findings in kinetic Monte Carlo simulations of the model and, as a proof of concept, we demonstrate the versatility of this driving mechanism to control nonlinear energy transport by inducing time-crystalline phases. In particular, we show that appropriately designed packing fields induce the spontaneous formation of traveling energy condensates, exhibiting robust long-range temporal order reminiscent of continuous time crystals. Our results provide a simple yet powerful framework to study bulk-driven nonlinear energy diffusion in stochastic many-body systems, offering a bridge between microscopic dynamics, macroscopic transport, and controlled spatiotemporal order.", "url": "https://arxiv.org/abs/2607.07325", "type": "理论+数值", "summary": "1. 该工作研究了一类体驱动非线性Kipnis-Marchioro-Presutti随机能量扩散模型，从微观主方程出发通过局域平衡近似导出其流体力学描述。\n2. 核心卖点在于获得了能量流密度、扩散率与迁移率等非线性输运系数的显式表达式，并证明适当设计的堆积场可诱导自发形成行波能量凝聚体，表现出稳健的长程时间序即连续时间晶体相。\n3. 这为连接微观动力学、宏观输运与可控时空序提供了简洁而强大的理论框架，有助于在随机多体系统中实现非线性能量扩散的定向调控。", "summary_source": "deepseek", "authors": [{"name": "P.I. Hurtado"}, {"name": "G. Cortés-Guillén"}], "featured_authors": [{"name": "P.I. Hurtado"}, {"name": "G. Cortés-Guillén"}], "author_count": 2}, {"id": "2607.07384", "category": "cond-mat", "title": "Optimizing high-temperature electron mobility in single-crystal Bi$_2$O$_2$Se based on its unconventional dependence on concentration", "abstract": "Quasi-2D Bi$_2$O$_2$Se is part of an intensive materials research effort aimed at finding new semiconductors that outperform silicon-based electronics in terms of speed and power consumption. This material exhibits exceptionally high carrier mobility at low temperatures but mediocre mobility at 300 K. Its high mobility is generally associated with its high permittivity ($\\varepsilon_r$~500), which is also associated with metallicity persisting down to very low carrier concentrations. This material exhibits a counterintuitive increase in carrier mobility as the concentration increases. The connection between low both carrier concentration and mobility in Se-rich conditions, and both high carrier concentration and mobility in Se-poor conditions suggests that the increase is related to native defects. We demonstrate that these defects can alter the effective mass of charge carriers. Specifically, substitutional Se(Bi) defects, which appear under Se-rich conditions, destroy the Bi$_2$O$_2$ channel and compromise charge transport properties. These defects increase the effective mass of charge carriers transforming the original semiconductor into a semimetal and introducing holes into charge transport. Additionally, we show that single crystals are generally inhomogeneous, particularly those grown under Se-rich conditions. Unlike Se-poor conditions, Se-rich conditions induce a higher concentration of dislocations and extraneous phases. These findings suggest that the perfection of the Bi$_2$O$_2$ channel is crucial for mobility, particularly at room temperature.", "url": "https://arxiv.org/abs/2607.07384", "type": "数值", "summary": "1. 该工作通过实验与理论分析，揭示了单晶Bi₂O₂Se中电子迁移率随载流子浓度反常增大的机制，并提出了优化室温迁移率的策略。\n2. 其核心发现是Se-rich条件下形成的替位Se(Bi)缺陷破坏了Bi₂O₂导电通道，增大有效质量并引入空穴，导致迁移率下降，而Se-poor条件则保持通道完整性。\n3. 这为通过控制本征缺陷与生长条件来提升高介电常数半导体室温电输运性能提供了明确的材料设计思路。", "summary_source": "deepseek", "authors": [{"name": "Antonín Sojka"}, {"name": "Petr Knotek"}, {"name": "Jan Zich"}, {"name": "Martin Míšek"}, {"name": "Roman Tesař"}, {"name": "Kyo-Hoon Ahn"}, {"name": "Petr Levinský"}, {"name": "Jiří Navrátil"}, {"name": "Pavlína Ruleová"}, {"name": "Jiří Hejtmánek"}, {"name": "Karel Knížek"}, {"name": "Václav Holý"}, {"name": "Čestmír Drašar"}], "featured_authors": [{"name": "Antonín Sojka"}, {"name": "Petr Knotek"}, {"name": "Jan Zich"}, {"name": "Karel Knížek"}, {"name": "Václav Holý"}, {"name": "Čestmír Drašar"}], "author_count": 13}, {"id": "2607.07411", "category": "cond-mat", "title": "Hyperuniform systems are maximally irreversible", "abstract": "Hyperuniform systems, defined by the anomalous suppression of large-scale density fluctuations, are a paradigm of non-equilibrium self-assembly. While mechanisms underlying the self-assembly of hyperuniform states have been widely studied, the energetics of this process remain unexplored. This raises a fundamental question: what is the energetic cost of self-assembling a hyperuniform system? Here, we address this question across several noisy particle systems drawn from soft matter and machine learning, in which hyperuniformity can be induced by tuning noise correlations. Despite their distinct microscopic dynamics, we uncover a universal behavior across all systems: hyperuniform states are maximally irreversible, as quantified by the entropy production rate. Further, we develop a path integral formulation of the entropy production rate directly from the microscopic dynamics, which explains our observations. Our work establishes a direct link between emergent long-range structure and time irreversibility and opens a new avenue of probing the energetic cost of hyperuniform self-assembly, ubiquitous across physics, biology, and materials science.", "url": "https://arxiv.org/abs/2607.07411", "type": "数值", "summary": "1. 该工作研究软物质与机器学习中多种噪声粒子系统，发现超均匀态具有最大不可逆性，由熵产生率量化。\n2. 其卖点在于建立从微观动力学到熵产生率的路径积分表述，揭示噪声相关性诱导超均匀性的普适热力学代价。\n3. 这为探索物理、生物及材料中超均匀自组装的能量耗散机制提供了直接理论与实验启发。", "summary_source": "deepseek", "authors": [{"name": "Mathias Casiulis"}, {"name": "Satyam Anand"}, {"name": "Stefano Martiniani"}], "featured_authors": [{"name": "Mathias Casiulis"}, {"name": "Satyam Anand"}, {"name": "Stefano Martiniani"}], "author_count": 3}, {"id": "2607.07472", "category": "cond-mat", "title": "Stress calculation in linear scaling DFT: convergence and dynamics", "abstract": "We present the approach needed to calculate stress within density functional theory (DFT) using a localised orbital basis, both for exact diagonalisation and linear scaling approaches, and demonstrate our implementation within the large scale DFT code Conquest. For the linear scaling approach, we test the rate of convergence of stress with density matrix range, and compare it to the convergence of energy and forces for different materials with a range of band gaps. We show that excellent convergence is found for modest cutoffs, and show that large-scale isothermal-isobaric molecular dynamics is stable and accurate.", "url": "https://arxiv.org/abs/2607.07472", "type": "理论+数值", "summary": "1. 该工作提出了在局域轨道基下实现密度泛函理论应力计算的方法，并在线性标度框架内完成Conquest代码的实现。\n2. 关键卖点在于揭示了应力随密度矩阵范围收敛性优于能量和力，适度截断即获优良收敛，确保大尺度等温等压分子动力学稳定准确。\n3. 这为线性标度DFT在高压和动态模拟中的应用提供了可靠应力评估基础，拓展了大规模计算的实际可行性。", "summary_source": "deepseek", "authors": [{"name": "Shereif Y. Mujahed"}, {"name": "Tsuyoshi Miyazaki"}, {"name": "David R. Bowler"}], "featured_authors": [{"name": "Shereif Y. Mujahed"}, {"name": "Tsuyoshi Miyazaki"}, {"name": "David R. Bowler"}], "author_count": 3}, {"id": "2607.07488", "category": "cond-mat", "title": "Non-Hermitian control of helicity-selective antiferromagnetic resonance", "abstract": "We study non-Hermitian antiferromagnetic resonance in an antiferromagnetic insulator/nonmagnetic metal junction with sublattice-dependent damping and spin-orbit torque. By formulating the linearized Landau-Lifshitz-Gilbert (LLG) equation as a 2x2 non-Hermitian eigenvalue problem, we derive the complex resonance frequencies, the exceptional-point condition, and the stability-threshold condition. We show that the largest absorption response is maximized by approaching the stability threshold from the stable side. Near the threshold on the stable side, the absorption spectrum exhibits strong enhancement and linewidth narrowing, together with pronounced helicity dependence in the sub-THz regime that can be switched by reversing the spin-orbit torque. We also confirm by solving the full LLG dynamics that crossing the threshold leads to gain and self-oscillation. These results identify the stability threshold as the key control principle for enhancing absorption and achieving polarization selectivity in the sub-THz/THz regime.", "url": "https://arxiv.org/abs/2607.07488", "type": "理论", "summary": "1. 该工作通过线性化LLG方程构建2×2非厄米本征值问题，解析了反铁磁绝缘体/非磁性金属结中具有子格依赖阻尼和自旋轨道扭矩的非厄米反铁磁共振。\n2. 核心卖点在于揭示稳定阈值作为关键控制原理，从稳定侧接近可同时实现吸收增强、线宽窄化及亚THz螺旋度选择性，且螺旋度反向可通过自旋轨道扭矩符号切换。\n3. 这为非厄米机制在亚THz/THz波段实现高效偏振选择性吸收与自振荡器件提供了定量设计原理。", "summary_source": "deepseek", "authors": [{"name": "Masato Todani"}, {"name": "Satoshi Iihama"}, {"name": "Yuto Moritake"}, {"name": "Takeo Kato"}], "featured_authors": [{"name": "Masato Todani"}, {"name": "Satoshi Iihama"}, {"name": "Yuto Moritake"}, {"name": "Takeo Kato"}], "author_count": 4}, {"id": "2607.07499", "category": "cond-mat", "title": "Nonlinear Dynamics of Hopfion for Frequency Multiplication", "abstract": "Hopfions, associated with higher-dimensional topology through the Hopf fibration, exhibit {exotic} features like {complex knot} and improved stability compared to skyrmions, enhancing their appeal for innovative applications. In this paper, we study the nonlinear response of magnetic Hopfion to microwave fields. {We observe the emergence of higher-order harmonics of the driving microwave field as it interacts with the Hopfion}. By carefully selecting the {driving frequency, the corresponding harmonic can efficiently excite localized magnon state of a Hopfion. Our results demonstrate the promising potential of hopfions in nonlinear magnonics.", "url": "https://arxiv.org/abs/2607.07499", "type": "理论", "summary": "1. 该工作研究了磁霍普夫子（hopfion）在微波场驱动下的非线性动力学响应，并观察到高阶谐波的产生。\n2. 其技术卖点在于通过选择特定驱动频率，可使对应谐波高效激发霍普夫子的局域磁子本征模式。\n3. 这为基于拓扑磁结构的频率倍增机制及非线性磁子学器件的设计提供了明确物理思路。", "summary_source": "deepseek", "authors": [{"name": "Waleed I. Waseer"}, {"name": "Yunshan Cao"}, {"name": "Peng Yan"}], "featured_authors": [{"name": "Waleed I. Waseer"}, {"name": "Yunshan Cao"}, {"name": "Peng Yan"}], "author_count": 3}, {"id": "2607.07544", "category": "cond-mat", "title": "Strain-tunable charge localization coupled to complex magnetic orders in EuAl$_4$", "abstract": "Charge localization is particularly interesting when coupled to antiferromagnetic spin structures. Coupled spin-charge orders are well established in elemental chromium and correlated oxide superconductors, yet the interplay between charge order and more complex magnetic textures -- such as skyrmion lattices and chiral spin structures -- remains largely unexplored. Here we report a comprehensive study of how charge localization couples to the unusually rich sequence of magnetic phases in EuAl$_4$. Using x-ray diffraction under applied magnetic field and uniaxial pressure, we demonstrate a direct coupling between the charge and spin order parameters. In the absence of external stimuli, charge localization is markedly enhanced upon entering the magnetically ordered phases. Strikingly, this effect is highly susceptible to strain: uniaxial pressure applied along the charge-order propagation direction further enhances localization, whereas pressure applied perpendicular to it weakens it. Application of magnetic field reveals both competitive and possible collaborative interactions between spin and charge this http URL flexible coupling between spin and charge ordering opens a new route to designing symmetry-breaking states. Chiral charge order may for example be patterned from spin structures with that symmetry.", "url": "https://arxiv.org/abs/2607.07544", "type": "理论", "summary": "1. 该工作利用X射线衍射并结合外加磁场与单轴压力，系统研究了EuAl$_4$中电荷局域化与复杂磁序的耦合。\n2. 其关键发现是电荷局域化在磁有序相中显著增强，且对应变具有高度各向异性：沿电荷有序传播方向施加压力增强局域化，垂直方向则削弱。\n3. 这种灵活的自旋-电荷耦合为通过应变或磁场设计手性电荷序等对称性破缺态提供了全新途径。", "summary_source": "deepseek", "authors": [{"name": "M. Baumgartner"}, {"name": "Xunyang Hong"}, {"name": "Tianren Wang"}, {"name": "Fazhi Yang"}, {"name": "Yuetong Wu"}, {"name": "Junzhang Ma"}, {"name": "Tian Shang"}, {"name": "J. Oppliger"}, {"name": "J. Küspert"}, {"name": "M. Hücker"}, {"name": "O. Ivashko"}, {"name": "F. Igoa Saldaña"}, {"name": "M. v. Zimmermann"}, {"name": "S. Pyon"}, {"name": "K. Kudo"}, {"name": "M. Nohara"}, {"name": "P. Sačer"}, {"name": "A. Akrap"}, {"name": "N. Barišić"}, {"name": "M. Novak"}, {"name": "Qisi Wang"}, {"name": "J. Chang"}], "featured_authors": [{"name": "M. Baumgartner"}, {"name": "Xunyang Hong"}, {"name": "Tianren Wang"}, {"name": "M. Novak"}, {"name": "Qisi Wang"}, {"name": "J. Chang"}], "author_count": 22}, {"id": "2607.07556", "category": "cond-mat", "title": "Entanglement Asymmetry in Random Quantum Automata", "abstract": "We investigate the subsystem entanglement asymmetry in random quantum automaton ensembles, which are generated by permuting the basis states in the Hilbert space and applying global phase shifts. We compute the ensemble average of the $U(1)$ subsystem asymmetry in different connectivity geometries, showing that the late-time limit of the ensemble associated to a 2-local circuit geometry coincides with the all-to-all ensemble average. By focusing on different subsystem sizes, we demonstrate that, similarly to Haar-random circuits, the system locally symmetrizes. However, in sharp contrast to the Haar-random setting, the scale at which symmetrization happens depends on the initial state, a phenomenon we associate with the interplay of conservation of the participation entropy and the uniform exploration of charge sectors. Additionally, we connect the growth of the subsystem asymmetry to the subsystem coherence and show that their growth is characterized by the same symmetrization scale.", "url": "https://arxiv.org/abs/2607.07556", "type": "理论", "summary": "1. 该工作计算了随机量子自动机系综中不同连通几何下的U(1)子系统纠缠不对称性系综平均。\n2. 揭示对称化尺度依赖初始状态，区别于Haar随机电路，源于参与熵守恒与电荷扇区均匀探索的竞争。\n3. 为理解量子动力学中初始态依赖的对称化与相干性增长的内在关联提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Olalla A. Castro-Alvaredo"}, {"name": "Dávid Szász-Schagrin"}, {"name": "Michele Mazzoni"}], "featured_authors": [{"name": "Olalla A. Castro-Alvaredo"}, {"name": "Dávid Szász-Schagrin"}, {"name": "Michele Mazzoni"}], "author_count": 3}, {"id": "2607.07590", "category": "cond-mat", "title": "Unveiling the Spin-Valley Structure of Dipolar Exciton Ladders in R-stacked WSe$_2$/WS$_2$ Moiré Heterobilayers", "abstract": "Localized interlayer excitons in moiré heterobilayers can form dipolar exciton ladders, yet their internal spin-valley structure remains unresolved. Here, we use helicity-resolved magneto-photoluminescence to identify the microscopic origin of the ladder in R-stacked WSe$_2$/WS$_2$ at charge neutrality and one-electron filling of the moiré lattice. At charge neutrality, the first two emission peaks correspond to a spin-triplet interlayer exciton and a triplet-triplet two-exciton state separated by 38 meV, reflecting the on-site dipolar interaction. The opposite Zeeman response of the apparent third rung of the ladder rules out its assignment as a spin-conserving three-exciton state and instead identifies it as a triplet-singlet two-exciton configuration with a 22 meV offset set by the WS$_2$ conduction-band spin splitting. At one-electron filling, the correlated electronic background gives rise to charged one- and two-exciton states and intervalley/intravalley two-exciton configurations, while reducing the effective exciton-exciton interaction. Our results establish a spin-valley-resolved picture of dipolar exciton ladders beyond simple occupation-number physics in moiré heterobilayers.", "url": "https://arxiv.org/abs/2607.07590", "type": "数值", "summary": "1. 该工作利用螺旋分辨磁光致发光谱，解析了R堆叠WSe2/WS2莫尔异质双层中偶极激子梯度的自旋谷结构，涵盖电荷中性与单电子填充两种情形。\n2. 其核心发现是梯度中第三级并非自旋守恒三激子，而是由WS2导带自旋分裂导致22 meV能移的三重-单重双激子，且关联背景降低了有效激子相互作用。\n3. 这建立了超越简单占据数图像的激子梯度自旋谷分辨图景，为莫尔体系中多激子的自旋与谷自由度调控提供了明确基础。", "summary_source": "deepseek", "authors": [{"name": "Byeong Wook Cho"}, {"name": "Tatyana V. Ivanova"}, {"name": "Zhe Li"}, {"name": "Takashi Taniguchi"}, {"name": "Kenji Watanabe"}, {"name": "Brian D. Gerardot"}, {"name": "Mauro Brotons-Gisbert"}], "featured_authors": [{"name": "Byeong Wook Cho"}, {"name": "Tatyana V. Ivanova"}, {"name": "Zhe Li"}, {"name": "Kenji Watanabe"}, {"name": "Brian D. Gerardot"}, {"name": "Mauro Brotons-Gisbert"}], "author_count": 7}, {"id": "2607.07647", "category": "cond-mat", "title": "Are Machine Learning Interatomic Potentials Truly Practical? A Benchmark of 23 Mainstream Models", "abstract": "Most MLIP benchmarks reward static accuracy while ignoring inference efficiency and hardware scalability -- driving model bloat with unclear real-world value. We benchmark 23 mainstream open-source MLIPs on a low-cost NVIDIA DGX Spark (128 GB native memory, capped at 80 GB to mimic ordinary lab hardware), using a fixed 192-atom system under a unified ASE-based pipeline. We evaluate three dimensions: predictive accuracy, MD simulation throughput, and atomic scalability. Our results expose a sharp accuracy-efficiency trade-off: large SOTA models deliver only 3-5 meV/atom more accuracy than lightweight ones, but lose orders of magnitude in throughput -- in the worst case, becoming only marginally faster than DFT itself. Lightweight MLIPs, by contrast, sit on the Pareto frontier and run on modest hardware. The lesson is that single-dimensional benchmarks mislead the field, and that future MLIP development should value efficiency and scalability alongside accuracy.", "url": "https://arxiv.org/abs/2607.07647", "type": "理论+数值", "summary": "1. 该工作基于统一ASE流水线，在低成本硬件上对23种主流开源机器学习原子间势进行基准测试，评估预测精度、MD吞吐量与原子可扩展性三个维度。\n2. 其核心发现是精度-效率尖锐权衡：前沿大模型精度仅优于轻量模型3-5 meV/atom，但吞吐量损失数个数量级，最差时仅略快于DFT，而轻量模型处于帕累托前沿且适配普通实验室硬件。\n3. 这警示单维度精度基准误导领域发展，未来势函数开发应同等重视推理效率与硬件可扩展性，以追求真实场景下的实用性。", "summary_source": "deepseek", "authors": [{"name": "Hanwen Kang"}, {"name": "Tenglong Lu"}, {"name": "Sheng Meng"}, {"name": "Miao Liu"}], "featured_authors": [{"name": "Hanwen Kang"}, {"name": "Tenglong Lu"}, {"name": "Sheng Meng"}, {"name": "Miao Liu"}], "author_count": 4}, {"id": "2607.07649", "category": "cond-mat", "title": "Feller diffusion in an interv
