  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);

      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);

      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }

    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2604.19876", "category": "cond-mat", "title": "Scaling at Chiral Clock Criticality via Entanglement Renormalization", "abstract": "We employ the Multiscale Entanglement Renormalization Ansatz (MERA) tensor network to investigate a critical line of continuous quantum phase transitions of the $\\mathbb{Z}_3$ chiral clock model. This critical line is believed to be described by a slow renormalization group flow from the 3-state Potts fixed point to another fixed point that features anisotropic scaling of space and time. We use the variational principle to construct a MERA representation of the model's ground state, from which we obtain the ground state energy and the set of scaling operators and their scaling dimensions. These scaling dimensions determine the critical exponents of the model, and we study these critical exponents and other scaling data as a function of the model's chiral parameter. We find a set of effective scaling data that smoothly varies starting from the Potts data as the chiral parameter is increased. Within the context of our approach, we discuss how this result may nevertheless be consistent with the two fixed point hypothesis provided the renormalization group flow is sufficiently slow. Our findings demonstrate MERA's effectiveness in capturing the complex low-energy physics of the chiral clock model and in extracting field theory data for an anisotropic continuum theory.", "url": "https://arxiv.org/abs/2604.19876", "type": "理论+数值", "summary": "1. 该工作利用多尺度纠缠重整化拟设（MERA）张量网络，研究了Z3手性钟模型连续量子相变临界线的低能物理。\n2. 通过变分方法提取了标度算符及其标度维数，发现这些有效标度数据随手性参数平滑变化，而非突变。\n3. 此结果在重整化群流动足够慢的前提下，可与双固定点假设自洽，并展示了MERA在提取各向异性连续场论数据方面的能力。", "summary_source": "deepseek", "authors": [{"name": "Shiyong Guo"}, {"name": "Brian Swingle"}], "featured_authors": [{"name": "Shiyong Guo"}, {"name": "Brian Swingle"}], "author_count": 2}, {"id": "2604.19929", "category": "cond-mat", "title": "Topological Edge States Emerging from Twisted Moiré Bands", "abstract": "We study twisted bilayer WSe$_2$ within a continuum moiré model and introduce a method for treating finite geometries directly in the continuum framework, overcoming limitations associated with momentum-space formulations and Wannier obstructions. By projecting a confinement potential onto bulk moiré eigenstates, we obtain a real-space description of edge physics without lattice models. Applying this approach to nanoribbons, we demonstrate chiral edge modes consistent with bulk Chern numbers and reveal their moiré-scale character. In the magic-angle regime, these states are strongly localized, exhibit layer-polarized counter-propagating modes, and are electrically tunable via a displacement field, enabling control of localization, hybridization, and topological transitions. Our results establish a general framework for boundary physics in topological moiré materials.", "url": "https://arxiv.org/abs/2604.19929", "type": "理论", "summary": "1. 该工作基于连续模型莫尔模型，研究了扭曲双层WSe₂的有限几何结构，通过将限制势投影到体态本征态上，实现了无需晶格模型的边界物理实空间描述。\n2. 其技术核心在于克服了动量空间表述和万尼尔函数构造的局限性，在魔角区域揭示了具有层极化反向传播特性、且可通过位移电场调控局域化与拓扑转变的手性边缘态。\n3. 这为拓扑莫尔材料的边界物理研究建立了普适框架，并为通过电场调控边缘态输运及拓扑相变提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Yasser Saleem"}, {"name": "Paweł Potasz"}, {"name": "Anna Dyrdał"}, {"name": "Björn Trauzettel"}, {"name": "Ewelina M. Hankiewicz"}], "featured_authors": [{"name": "Yasser Saleem"}, {"name": "Paweł Potasz"}, {"name": "Anna Dyrdał"}, {"name": "Björn Trauzettel"}, {"name": "Ewelina M. Hankiewicz"}], "author_count": 5}, {"id": "2604.19964", "category": "cond-mat", "title": "Nudged Elastic Membranes for Constructing Reduced Two-Dimensional Potential Energy Surfaces", "abstract": "Path optimization methods have been widely used and highly successful for the analysis of chemical reactions. Yet, they can fail to capture intrinsically multidimensional features of potential energy surfaces (PES). We introduce the nudged elastic membrane method, a framework for constructing two-dimensional reduced potential-energy surfaces in chemically relevant regions of a PES using only energies and forces without requiring more costly Hessian information. The method is demonstrated for a three-dimensional prototype model and for the triplet formaldehyde molecular system. In both cases, the resulting membrane captures one-dimensional reaction-path features as well as genuinely two-dimensional structures such as a yet unreported reported second-order saddle point in the PES of triplet formaldehyde. The method further provides direct access to structures that can serve as starting points for subsequent refinement. Our results show that the method offers a practical route to exploring multidimensional PES topography beyond the single-path picture.", "url": "https://arxiv.org/abs/2604.19964", "type": "理论+数值", "summary": "1. 该工作提出了“微推弹性膜”方法，用于在势能面的化学相关区域构建二维约化势能面。\n2. 该方法仅需能量和梯度信息，无需昂贵Hessian计算，即可捕获如三线态甲醛中二阶鞍点等多维特征。\n3. 这为超越单一路径图像、探索势能面多维形貌并获取后续精修起点提供了实用途径。", "summary_source": "deepseek", "authors": [{"name": "Uday Sankar Manoj"}, {"name": "Nicole Drew"}, {"name": "Ismaila Dabo"}, {"name": "Lukas Muechler"}], "featured_authors": [{"name": "Uday Sankar Manoj"}, {"name": "Nicole Drew"}, {"name": "Ismaila Dabo"}, {"name": "Lukas Muechler"}], "author_count": 4}, {"id": "2604.20002", "category": "cond-mat", "title": "multisphere: a Python implementation of the Multi Sphere Shape generator (MSS) for DEM simulations", "abstract": "multisphere is an open-source Python package for generating multi-sphere representations of complex particles for use in DEM simulations. It reconstructs triangulated surface meshes and voxelized volumes as sets of intersecting spheres and provides tools for evaluation, visualization, and export.", "url": "https://arxiv.org/abs/2604.20002", "type": "数值", "summary": "1. 该工作开发了用于离散元模拟的开源Python工具包multisphere，以生成复杂颗粒的多球体几何表示。\n2. 其技术核心在于能够从三角面片网格或体素化体积自动重建为相交球体集合，并集成评估、可视化与导出功能。\n3. 这为复杂形状颗粒在离散元模拟中的标准化建模提供了实用工具，有望推动相关颗粒体系数值研究的精度与效率。", "summary_source": "deepseek", "authors": [{"name": "Felix Buchele"}, {"name": "Patric Müller"}, {"name": "Thorsten Pöschel"}], "featured_authors": [{"name": "Felix Buchele"}, {"name": "Patric Müller"}, {"name": "Thorsten Pöschel"}], "author_count": 3}, {"id": "2604.20064", "category": "cond-mat", "title": "Symmetry-dictated switching of antiferromagnetic magnon transport in 2D multiferroics", "abstract": "While antiferromagnetic magnons in two-dimensional (2D) materials hold immense promise for high-frequency spintronics, achieving their efficient active control remains a critical challenge. Here, we propose a universal mechanism for the nonvolatile ferroelectric (FE) switching of antiferromagnetic magnon transport in 2D multiferroic lattices. Our mechanism relies on coupling the magnon geometric phase to the FE-induced sublattice asymmetry in exchange and Dzyaloshinskii-Moriya interactions. This explicitly breaks the exact compensation of opposite-chirality magnons inherent to collinear antiferromagnets, lifting their spin degeneracy and inducing a highly tunable net Berry curvature. Crucially, reversing the FE polarization deterministically swaps these magnetic asymmetries, which completely inverts the net magnon Berry curvature and the resulting anomalous thermal Hall conductivity. Using first-principles and linear spin-wave theory, we rigorously validate this geometric-phase-driven mechanism in single-layer CuCr2Se4. Our findings establish a robust paradigm for coupling multiferroicity with the magnon geometric phase, paving the way for nonvolatile and electrically switchable antiferromagnetic magnonics.", "url": "https://arxiv.org/abs/2604.20064", "type": "理论", "summary": "1. 该研究提出了一种二维多铁性材料中反铁磁磁振子输运的非易失性铁电调控普适机制。\n2. 其核心在于通过铁电极化诱导的交换与Dzyaloshinskii-Moriya相互作用子晶格不对称性，耦合磁振子几何相位，从而打破本征自旋简并并产生可调净贝里曲率。\n3. 这为基于几何相位的非易失性电控反铁磁磁振子学建立了明确范式，为高频自旋电子器件设计提供了新原理。", "summary_source": "deepseek", "authors": [{"name": "Yibo Liu"}, {"name": "Jiale Wang"}, {"name": "Jiexiang Wang"}, {"name": "Ying Dai"}, {"name": "Baibiao Huang"}, {"name": "Xinru Li"}, {"name": "Yandong Ma"}], "featured_authors": [{"name": "Yibo Liu"}, {"name": "Jiale Wang"}, {"name": "Jiexiang Wang"}, {"name": "Baibiao Huang"}, {"name": "Xinru Li"}, {"name": "Yandong Ma"}], "author_count": 7}, {"id": "2604.20089", "category": "cond-mat", "title": "Critical Activation Voltage for Phonon-Mediated Field-Driven Phenomena", "abstract": "Field-driven phenomena, from flash sintering to electromigration, exhibit threshold fields spanning six orders of magnitude. We show their product with the onset activation coherence length is a universal critical activation voltage, Vc =0.1-2.7 V. Vc represents the threshold electrical work required to resonantly couple to the universal phonon damping peak where lattice softening is maximized. This invariant unifies macroscopic thermal instabilities with the nanoscale Blech limit, establishing a universal phenomenological law for field-lattice coupling across 17 crystal families", "url": "https://arxiv.org/abs/2604.20089", "type": "理论", "summary": "1. 该工作通过分析跨越六个数量级的阈值电场现象，确立了场驱动晶格耦合的唯象普适定律，揭示临界激活电压Vc=0.1-2.7 V的统一性。\n2. 其核心在于证明Vc对应共振耦合至晶格软化最大化的普适声子阻尼峰所需阈值电功，从而将宏观热失稳与纳米尺度Blech极限相统一。\n3. 这为预测不同晶体体系中电场驱动相变、烧结及电迁移等过程的阈值行为提供了定量框架，并暗示声子态密度峰在非平衡场致现象中的关键作用。", "summary_source": "deepseek", "authors": [{"name": "Ric Fulop"}, {"name": "Neil Gershenfeld"}], "featured_authors": [{"name": "Ric Fulop"}, {"name": "Neil Gershenfeld"}], "author_count": 2}, {"id": "2604.20102", "category": "cond-mat", "title": "Unjamming in a 3D Granular System: The Micromechanical Role of Friction in Force Distributions and Rheological Properties", "abstract": "In this work, we investigate the unjamming transition in a three-dimensional granular system composed of frictional spheres, in which the packing fraction is systematically reduced by random particle extractions. Using Discrete Element Method (DEM) simulations, we analyze the evolution of key micro-mechanical quantities, such as the interparticle forces, the coordination number and the overall packing density as a function of the interparticle friction coefficient. Our results reveal friction-dependent relationships on structural as well as mechanical observables, and exhibit trends that are qualitatively consistent with observations reported in dense granular systems. These trends persist despite the very different driving mechanism considered here. This paper is part of the thematic issue \\emph{``Sand, silos and asteroids: clustering challenges in granular materials research''}.", "url": "https://arxiv.org/abs/2604.20102", "type": "数值", "summary": "1. 该工作通过离散元模拟，研究了三维摩擦球体颗粒体系在随机抽取粒子降低堆积分数过程中的解阻塞转变。\n2. 其核心发现是，颗粒间摩擦系数显著影响接触力分布、配位数等微观力学量，且所观测趋势与密实颗粒体系的报道定性一致。\n3. 这为理解不同驱动机制下阻塞转变的普适性与特异性提供了微观力学基础，并激励对更广泛软物质与无序体系流变学的研究。", "summary_source": "deepseek", "authors": [{"name": "Vicente Salinas"}, {"name": "Héctor Alarcón"}, {"name": "Eduardo Rojas"}, {"name": "Pablo Gutiérrez"}, {"name": "Gustavo Castillo"}], "featured_authors": [{"name": "Vicente Salinas"}, {"name": "Héctor Alarcón"}, {"name": "Eduardo Rojas"}, {"name": "Pablo Gutiérrez"}, {"name": "Gustavo Castillo"}], "author_count": 5}, {"id": "2604.20164", "category": "cond-mat", "title": "Light-Induced Topological Phase Transitions and Anomalous Thermal Transport in d-Wave Altermagnets", "abstract": "We study intrinsic thermal transport and Floquet-engineered topology in a two-dimensional d wave altermagnetic topological insulator powered by linearly polarized light. We analyze the anomalous Hall, Nernst, and thermal Hall conductivities, as well as their spin-resolved equivalents, and develop closed-form formulas for the Berry curvature using an analytically calculated high-frequency effective Hamiltonian. We demonstrate that linearly polarized light, in contrast to conventional antiferromagnets, breaks the symmetry connecting spin sectors in altermagnets, allowing a series of spin-selective topological phase transitions from a quantum spin Hall state to a spin-polarized Chern insulator and finally to a trivial phase. The Nernst response shows substantial thermal activation and significant sensitivity to the gap size in the Chern domain, but both the electrical and thermal Hall responses become quantized and meet the anomalous Wiedemann Franz law. Every anomalous transport coefficient exhibits a distinctive d wave dependence on the polarization angle, reversing sign under orthogonal rotation and vanishing at symmetry-restoring directions. Our findings show a path to all-optical regulation of topological and caloritronic responses beyond traditional magnetic systems and establish thermal transport as a sensitive probe of altermagnetic order.", "url": "https://arxiv.org/abs/2604.20164", "type": "理论+数值", "summary": "1. 该工作研究了二维d波交变磁体拓扑绝缘体在线性偏振光驱动下的本征热输运与Floquet拓扑调控，通过解析计算高频有效哈密顿量推导了贝里曲率与反常霍尔、能斯特及热霍尔电导的闭合表达式。\n2. 研究揭示了线性偏振光能打破交变磁体自旋通道间的对称性，实现从量子自旋霍尔态到自旋极化陈绝缘体直至平庸相的系列自旋选择性拓扑相变，且所有反常输运系数均呈现独特的d波偏振角依赖关系。\n3. 这为超越传统磁体系的全光学拓扑与热输运调控提供了途径，并确立了热输运测量作为探测交变磁序的灵敏手段。", "summary_source": "deepseek", "authors": [{"name": "Ayesha Maryam"}, {"name": "Muzamil Shah"}, {"name": "Kashif Sabeeh"}, {"name": "Reza Asgari"}], "featured_authors": [{"name": "Ayesha Maryam"}, {"name": "Muzamil Shah"}, {"name": "Kashif Sabeeh"}, {"name": "Reza Asgari"}], "author_count": 4}, {"id": "2604.20201", "category": "cond-mat", "title": "Symmetry breaking phases and transitions in an Ising fusion category lattice model", "abstract": "An anyon-chain-like lattice model with symmetry described by the Ising fusion category is studied. Combining numerical and analytical studies, we uncover a rich phase diagram that contains three phases: a symmetric critical phase and two categorical symmetry breaking phases. The symmetric phase lies in the same universality class as the usual critical Ising model. The first symmetry-breaking phase, dubbed the \\emph{categorical ferromagnetic} phase, has the Ising fusion category fully broken and exhibits a threefold ground-state degeneracy, as expected from the generalized Landau paradigm. The other symmetry-breaking phase is analogous to a conventional antiferromagnet: it breaks lattice translation and part of the Ising fusion category, and therefore is termed the \\emph{categorical antiferromagnetic} phase. Unlike ordinary antiferromagnetic states associated with finite invertible symmetry breaking, this phase itself is critical, being described by a fourfold degenerate Ising conformal field theory. We argue more generally that antiferromagnetic states associated with broken non-invertible symmetries have a large low-energy manifold that grows exponentially in system size, due to the greater-than-one quantum dimension of domain walls. We also numerically study the transitions between the three phases. The transition between the symmetric and categorical ferromagnetic phase is described by the $c=7/10$ tricritical Ising CFT, while the transition between the symmetric and categorical antiferromagnetic phases is less understood. Our numerical data suggest that the latter transition is continuous and described by a conformal field theory with central charge $c=3/2$.", "url": "https://arxiv.org/abs/2604.20201", "type": "理论+数值", "summary": "1. 该工作通过数值与解析方法研究了具有Ising融合范畴对称性的任意子链格点模型，揭示了包含对称临界相、范畴铁磁相和范畴反铁磁相的丰富相图。\n2. 其核心物理发现在于范畴铁磁相呈现全对称破缺与三简并基态，而范畴反铁磁相则部分破缺对称并具有临界性，由四重简并的Ising共形场论描述。\n3. 这为理解非可逆对称性破缺反铁磁态的低能流形指数增长提供了普遍框架，并数值表征了相变，如对称相与范畴铁磁相间过渡由c=7/10三临界Ising CFT描述，而与范畴反铁磁相间过渡可能由c=3/2 CFT描述。", "summary_source": "deepseek", "authors": [{"name": "Soumil Roychowdhury"}, {"name": "Chenjie Wang"}], "featured_authors": [{"name": "Soumil Roychowdhury"}, {"name": "Chenjie Wang"}], "author_count": 2}, {"id": "2604.20249", "category": "cond-mat", "title": "Intrinsic Magnetoelectric Hall Effect from Layer-Orbital Quantum Geometry", "abstract": "Intrinsic Hall effects, such as the anomalous Hall effect, originate from the orbital quantum geometry of Bloch states. However, in layered materials, the combined action of out-of-plane electric and magnetic fields couples to layer polarization and orbital moment, generating a mixed layer-orbital quantum geometry in field-dressed Bloch states. We show that this geometry produces an intrinsic magnetoelectric Hall effect that is bilinear in the electric and magnetic fields. The response is scattering-time independent and can arise in nonmagnetic systems without spin-orbit coupling. Its origin lies in interband coherence involving layer polarization and orbital moment, leading to a finite, non-quantized Hall response that persists in the band gap. The Hall coefficient is odd under gate reversal and tracks layer polarization. A symmetry analysis identifies the classes of layered materials that host this effect. As a representative realization, we demonstrate the effect in rhombohedral pentalayer graphene, where the conductivity reaches values of order $0.05\\,e^2/h$. These results establish mixed layer-orbital quantum geometry as a mechanism for intrinsic magnetoelectric Hall transport and a direct probe of layer-resolved quantum geometry in Bloch bands.", "url": "https://arxiv.org/abs/2604.20249", "type": "理论+数值", "summary": "1. 该工作揭示了层状材料中电场与磁场耦合诱导的混合层轨道量子几何可产生本征磁电霍尔效应。\n2. 其物理机制源于层极化与轨道矩参与的带间相干性，导致带隙内存在与散射时间无关的非量子化霍尔电导。\n3. 这为在非磁性、无自旋轨道耦合的层状材料中探测层分辨量子几何提供了新途径与直接实验探针。", "summary_source": "deepseek", "authors": [{"name": "Sunit Das"}, {"name": "Amit Agarwal"}], "featured_authors": [{"name": "Sunit Das"}, {"name": "Amit Agarwal"}], "author_count": 2}, {"id": "2604.20251", "category": "cond-mat", "title": "Mesoscopic theory of flocking with alignment and anti-alignment copying", "abstract": "We study a stochastic model of collective motion in which individuals update their orientation through pairwise aligning or anti-aligning copying interactions. We analyze both annealed dynamics, where interaction types are chosen probabilistically at each update, and quenched dynamics, where individuals are permanently assigned to aligning or anti-aligning subpopulations. Starting from the microscopic master equation on the circle, we derive an exact mesoscopic description via a Fourier-mode expansion and a systematic large $N$ expansion, obtaining closed Fokker-Planck equations and effective stochastic differential equations for the polarization. We show that competing alignment and anti-alignment suppress long-range polar order in the thermodynamic limit in both cases, while finite systems display nontrivial fluctuation-induced structure controlled by the interaction composition. Our results, validated by Gillespie simulations, establish an analytically tractable framework for collective dynamics characterized by competing copying rules and intrinsic noise.", "url": "https://arxiv.org/abs/2604.20251", "type": "理论+数值", "summary": "1. 该工作从微观主方程出发，推导了包含对齐与反对齐复制相互作用的群体运动随机模型的精确介观描述。\n2. 通过傅里叶模态展开和大N展开，获得了极化序参量的封闭福克-普朗克方程，揭示了竞争相互作用在热力学极限下压制长程序、而在有限系统中产生涨落诱导结构的物理机制。\n3. 这一解析可处理的框架为研究具有竞争规则和内在噪声的集体动力学系统提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Chunming Zheng"}], "featured_authors": [{"name": "Chunming Zheng"}], "author_count": 1}, {"id": "2604.20277", "category": "cond-mat", "title": "Domain-Wall-Mediated Ultralow-Barrier Sliding and Pinning in Ferroelectric Moiré Superlattices Revealed by Machine Learning", "abstract": "Sliding ferroelectrics built from stacked nonpolar monolayers enable out-of-plane polarization and unconventional switching via interlayer sliding, yet the microscopic sliding dynamics remain unclear. Using machine-learning molecular dynamics, we reveal spontaneous thermally driven interlayer sliding in ferroelectric MoS2 moiré superlattices, with relative velocities on the order of 1 m/s at 300 K. Instead of rigid translation of the entire bilayer, the motion appears as a global drift of the moiré pattern. Such thermally driven sliding is inconsistent with the meV/atom-scale rigid-sliding barrier. In contrast, when constrained relaxation is allowed, the sliding proceeds along an almost barrierless pathway that directly reproduces the global drift of the moiré pattern. Furthermore, sulfur vacancies trigger a sliding-to-pinning transition, with about 0.1% S vacancies already sufficient to convert the long-range sliding into localized oscillations. Notably, these phenomena are not restricted to small twist angles, but arise generically in twisting-induced multidomain structures. These results reveal that the sliding process is governed by a domain-wall-mediated collective reconstruction pathway with an ultralow barrier, rather than rigid layer translation, deepening the understanding of microscopic dynamics in moiré superlattices and sliding ferroelectrics.", "url": "https://arxiv.org/abs/2604.20277", "type": "数值", "summary": "1. 该工作通过机器学习分子动力学，揭示了铁电MoS₂莫尔超晶格中自发热驱动层间滑动的微观动力学，并研究了硫空位对滑动行为的钉扎效应。\n2. 其核心发现在于，滑动过程由畴壁介导的集体重构路径主导，该路径具有超低势垒，而非整个双层的刚性平移，且微量硫空位即可引发滑动至钉扎的转变。\n3. 这为理解莫尔超晶格及滑动铁电体中微观动力学的普适机制提供了新视角，并表明缺陷工程可用于有效调控此类体系的动态响应与功能特性。", "summary_source": "deepseek", "authors": [{"name": "Jia-Wen Li"}, {"name": "Sheng Meng"}, {"name": "Xinghua Shi"}, {"name": "Jin Zhang"}, {"name": "Wei-Hai Fang"}], "featured_authors": [{"name": "Jia-Wen Li"}, {"name": "Sheng Meng"}, {"name": "Xinghua Shi"}, {"name": "Jin Zhang"}, {"name": "Wei-Hai Fang"}], "author_count": 5}, {"id": "2604.20299", "category": "cond-mat", "title": "Polymeric Solvents Control Swelling-Induced Surface Creasing", "abstract": "Surface creasing in swelling polymer gels is commonly attributed to compressive strain or interlayer mismatch, yet its general control remains unclear. Here we show that solvent polymerization degree $N_{\\rm s}$ provides an independent control parameter for crease onset in surface-bound polydimethylsiloxane gels swollen by silicone oils. Despite nearly identical swelling kinetics and through-thickness solvent concentration profiles, we observe a transition from creased to stable surfaces with increasing $N_{\\rm s}$. A theory coupling swelling thermodynamics and mechanical stability reveals that polymeric solvents reduce the mixing entropy and thereby modify the osmotic pressure, allowing $N_{\\rm s}$ to tune separately the equilibrium swelling and the crease threshold. This framework captures the stability boundary across solvent polymerization degree and network elasticity. These results identify polymeric solvents as active thermodynamic-mechanical regulators of swelling-induced surface.", "url": "https://arxiv.org/abs/2604.20299", "type": "理论", "summary": "1. 该工作通过实验与理论研究了聚二甲基硅氧烷凝胶在硅油溶胀中表面起皱的调控，发现溶剂聚合度可作为独立的控制参数。\n2. 其核心在于揭示了聚合溶剂通过降低混合熵来改变渗透压，从而能独立调节平衡溶胀与起皱阈值，突破了传统压缩应变或层间失配的解释框架。\n3. 这为理解溶胀诱导表面失稳提供了热力学-力学耦合框架，并为通过溶剂设计调控软材料表面稳定性指明了新途径。", "summary_source": "deepseek", "authors": [{"name": "Zechao Jiang"}, {"name": "Zhaoyu Ding"}, {"name": "Shaohua Yang"}, {"name": "Ye Xu"}, {"name": "Dongshi Guan"}, {"name": "Abdelhamid Maali"}, {"name": "Joshua D Mcgraw"}, {"name": "Thomas Salez"}, {"name": "Zaicheng Zhang"}, {"name": "Xingkun Man"}], "featured_authors": [{"name": "Zechao Jiang"}, {"name": "Zhaoyu Ding"}, {"name": "Shaohua Yang"}, {"name": "Thomas Salez"}, {"name": "Zaicheng Zhang"}, {"name": "Xingkun Man"}], "author_count": 10}, {"id": "2604.20355", "category": "cond-mat", "title": "Fluctuation-driven multi-step charge density wave transition in monolayer TiSe$_2$", "abstract": "The exact microscopic origin, symmetry, and thermal melting mechanism of the charge density wave (CDW) phase in TiSe$_{2}$ remain a subject of intense debate, particularly regarding the presence of chiral structural order and a multi-step phase transition. Here, we resolve the finite-temperature structural dynamics of the monolayer TiSe$_{2}$ using large-scale molecular dynamics simulations driven by an accurate, first-principles-trained machine-learning interatomic potential. We demonstrate that the CDW melting deviates from a conventional second-order phase transition, while it undergoes a two-step melting process characterised by an extended fluctuation regime between $T^{\\ast}\\approx200$ K and $T_{\\mathrm{CDW}}\\approx250$ K, with proliferation of topological defects and domain walls, and accompanied by a completely overdamped soft optical phonon. Furthermore, we reveal that anisotropic long-wavelength thermal fluctuations spontaneously stabilise an asymmetric $3Q$ chiral CDW order with $C2$ symmetry. These findings provide a unified microscopic framework for understanding complex fluctuation-driven phase transitions in 2D quantum materials, demonstrating that the intricate CDW physics of TiSe$_{2}$ can be largely captured without invoking excitonic correlations.", "url": "https://arxiv.org/abs/2604.20355", "type": "理论+数值", "summary": "1. 该工作通过基于第一性原理机器学习势函数的大规模分子动力学模拟，阐明了单层TiSe₂电荷密度波（CDW）相变的有限温度结构动力学。\n2. 研究揭示了CDW熔化并非传统的二阶相变，而是在200 K至250 K间存在一个以拓扑缺陷、畴壁增殖及软光学声子完全过阻尼为特征的扩展涨落区，并发现各向异性长波长热涨落自发稳定了具有C2对称性的不对称3Q手性CDW序。\n3. 这些结果构建了一个理解二维量子材料中复杂涨落驱动相变的统一微观框架，表明无需引入激子关联即可在很大程度上捕捉TiSe₂的 intricate CDW物理。", "summary_source": "deepseek", "authors": [{"name": "Luka Benić"}, {"name": "Dino Novko"}, {"name": "Ivor Lončarić"}], "featured_authors": [{"name": "Luka Benić"}, {"name": "Dino Novko"}, {"name": "Ivor Lončarić"}], "author_count": 3}, {"id": "2604.20407", "category": "cond-mat", "title": "Vortex dipoles in expanding shell-shaped Bose-Einstein condensates", "abstract": "Releasing shell-shaped Bose-Einstein condensates from their confinement produces a spherically symmetric density distribution characterized by concentric ripples surrounding a central peak. Here we investigate how a vortex-antivortex dipole affects this dynamics, finding that increasing dipole separation progressively breaks the spherical symmetry and, correspondingly, the interplay of vortex physics and curvature produces a non-monotonic behavior of the cloud aspect ratio. These features can be used for preparing and detecting vortex dipoles in shell-shaped superfluids, as well as for analyzing their signatures in other thin superfluids with more general curved geometries.", "url": "https://arxiv.org/abs/2604.20407", "type": "理论", "summary": "1. 该工作研究了涡旋-反涡旋偶极子对膨胀壳层玻色-爱因斯坦凝聚体动力学的影响。\n2. 其核心发现是偶极子间距增大会破坏膨胀云的球对称性，且涡旋物理与曲率相互作用导致云纵横比呈现非单调行为。\n3. 这为在壳层超流体及其他弯曲几何薄层超流体中制备、探测涡旋偶极子及其特征分析提供了途径。", "summary_source": "deepseek", "authors": [{"name": "A. Tononi"}], "featured_authors": [{"name": "A. Tononi"}], "author_count": 1}, {"id": "2604.20419", "category": "cond-mat", "title": "Quantum many-body scars leading to time-translation symmetry breaking in kicked interacting spin models", "abstract": "We study an Ising model with long-range interactions undergoing a time-periodic kicking. For different initial states we observe persistent period doubling. When there is period doubling we find that the initial state has relevant overlap with Floquet states showing time-translation symmetry breaking, organized in doublets displaying $\\pi$-spectral pairing (as highlighted by the $\\pi$-spectral gap) and long-range order (as shown by the eigenvalues of the magnetization in the doublet). We observe period doubling for initial states with domain walls and tilted spins, and for the latter ones a finite-size scaling of the relevant $\\pi$-shifted gap and magnetization eigenvalues suggests period-doubling oscillations persisting for larger system sizes and lasting a time exponential in the system size. We find that just a minority of Floquet states displays time-translation symmetry breaking while the rest is thermal, a weak-ergodicity breaking situation typical of systems with quantum scars. Although the time-translation symmetry breaking eigenstates are the minority, their number is exponential in the system size and this motivates the period doubling observed for many different initial states.", "url": "https://arxiv.org/abs/2604.20419", "type": "理论+数值", "summary": "1. 该工作研究了长程相互作用伊辛模型在周期驱动下，不同初态中出现的持续倍周期动力学。\n2. 其核心发现是倍周期与具有时间平移对称性破缺的弗洛凯本征态相关，这些态呈π谱配对并具有长程序，表现出量子疤痕的弱遍历性破缺特征。\n3. 尽管对称性破缺本征态占比少，但其数量随系统尺寸指数增长，这为在多种初态中观测到持续倍周期振荡提供了机制解释。", "summary_source": "deepseek", "authors": [{"name": "Ángel L. Corps"}, {"name": "Armando Relaño"}, {"name": "Angelo Russomanno"}], "featured_authors": [{"name": "Ángel L. Corps"}, {"name": "Armando Relaño"}, {"name": "Angelo Russomanno"}], "author_count": 3}, {"id": "2604.20424", "category": "cond-mat", "title": "Phonon driven non-equilibrium triggers for thermal runaway in battery electrodes", "abstract": "Thermal runaway in lithium-ion batteries is governed by the poorly-understood initiation phase, where localised heating introduces instability. Here we identify the three key components that trigger thermal runaway, decreases in local conductivity, heat capacity changes, and intercalation heating, which significantly increase temperature gradients that accelerate battery degradation. Using a multiscale framework that links atomistic phonon calculations with grain-resolved thermal modelling, we identify large thermal gradients across grain boundaries arising from external heating events and intercalation-dependent thermal properties of Li$_x$ZrS$_2$. The observed changes in thermal conductivity are due to charge redistribution and bond-strength modulation of the host, in contrast to the existing theory of lithium rattler mechanics. Internal heating events driven by intercalation gives rise to local thermal gradients, finite-speed thermal wave interference, and internal thermal fluctuations that generate mechanical strain and sub-grain thermal breakdown. These results show that the trigger for thermal runaway is controlled by internal grain architecture and composition, as well as the external environment. Our findings establish materials and electrode design rules for suppressing hotspot formation and improving battery safety during fast charging.", "url": "https://arxiv.org/abs/2604.20424", "type": "理论+数值", "summary": "1. 该工作通过结合原子尺度声子计算与晶粒分辨热模型的多尺度框架，揭示了锂离子电池热失控触发阶段中局域电导率下降、热容变化及插层加热三种关键机制。\n2. 其核心发现在于，插层引起的电荷重分布与宿主材料键强调制主导了热导率变化，这不同于现有的锂离子振子理论，并导致晶界处产生巨大热梯度与有限速度热波干涉。\n3. 这为通过调控电极材料的晶粒结构与成分来抑制热点形成、提升快充安全性提供了明确的设计准则。", "summary_source": "deepseek", "authors": [{"name": "Harry Mclean"}, {"name": "Francis Huw Davies"}, {"name": "Ned Thaddeus Taylor"}, {"name": "David W. Horsell"}, {"name": "Steven P. Hepplestone"}], "featured_authors": [{"name": "Harry Mclean"}, {"name": "Francis Huw Davies"}, {"name": "Ned Thaddeus Taylor"}, {"name": "David W. Horsell"}, {"name": "Steven P. Hepplestone"}], "author_count": 5}, {"id": "2604.20437", "category": "cond-mat", "title": "Programming strain-stiffening in soft composites via structural memory near jamming", "abstract": "Soft composite solids, comprising discrete inclusions embedded within a compliant matrix, are emerging candidates for engineering synthetic tissues and soft robotic materials. Current strategies for controlling their nonlinear mechanics, such as strain-stiffening, have primarily relied on the nonlinear elasticity of polymer matrices. Although direct contacts between inclusions may enhance stiffening responses at high densities, the role of the non-equilibrium and history-dependent nature of disordered contact networks in composite mechanics remains unexplored. In this work, by applying a mechanical training protocol near a shear-jamming phase boundary, we demonstrate that the structural memory encoded in contact networks drives a crossover from granular-like to biopolymer-like strain stiffening. Simulations of a coarse-grained composite model reveal that this biopolymer-like mechanical response emerges from enhanced non-affine reconfigurations of nearly-jammed contact networks. Without relying on matrix nonlinearity, we establish a design strategy that leverages non-equilibrium memory effects intrinsic to granular systems to achieve highly programmable strain-stiffening in soft composites.", "url": "https://arxiv.org/abs/2604.20437", "type": "理论+数值", "summary": "1. 本研究通过近剪切堵塞相边界施加机械训练协议，揭示了软复合材料中接触网络的结构记忆可驱动应变硬化行为从类颗粒态向类生物聚合物态转变。\n2. 其核心物理机制在于，粗粒化模拟表明类生物聚合物的力学响应源于近堵塞接触网络增强的非仿射重排，而非基体非线性。\n3. 这为不依赖基质非线性、利用颗粒体系固有的非平衡记忆效应来实现高度可编程应变硬化提供了明确的设计策略。", "summary_source": "deepseek", "authors": [{"name": "Yiqiu Zhao"}, {"name": "Deng Pan"}, {"name": "Yiming Pang"}, {"name": "Jonathan Barés"}, {"name": "Chang Xu"}, {"name": "Che Liu"}, {"name": "Haitao Hu"}, {"name": "Yuliang Jin"}, {"name": "Qin Xu"}], "featured_authors": [{"name": "Yiqiu Zhao"}, {"name": "Deng Pan"}, {"name": "Yiming Pang"}, {"name": "Haitao Hu"}, {"name": "Yuliang Jin"}, {"name": "Qin Xu"}], "author_count": 9}, {"id": "2604.20450", "category": "cond-mat", "title": "Including nanoparticle shape into macrospin models", "abstract": "We investigate the feasibility of the macrospin approximation to account for the actual shape of soft magnetic nanoparticles (MNPs) with realistic geometries. Specifically focusing on magnetite, we use the superellipsoidal parametrisation to account for a variety of shapes, with a continuous interpolation from spherical to cubic morphologies, as well as different elongations. Our procedure consists of the direct comparison between angular-dependent hysteresis loops obtained by full micromagnetic simulations, with those produced by an extended Stoner-Wohlfarth (SW) model that incorporates both the intrinsic cubic magnetocrystalline anisotropy, and an effective uniaxial contribution arising from the particle elongation. The limits of validity of the macrospin description are approximately 10-60 nm for axial ratios r>1.5, and 20-60 nm for 1.0<r<1.5. These results establish a direct connection between nanoparticle morphology and effective macrospin parameters, demonstrating the suitability of the generalized SW model for describing the magnetic response of realistically shaped MNPs.", "url": "https://arxiv.org/abs/2604.20450", "type": "理论+数值", "summary": "1. 该工作通过超椭球参数化将实际形状纳入软磁纳米颗粒的宏自旋模型，并系统比较了微磁模拟与扩展Stoner-Wohlfarth模型的结果。\n2. 研究明确了宏自旋近似有效的尺寸范围（10-60纳米），并揭示了颗粒形变通过有效单轴各向异性影响磁响应的物理机制。\n3. 这为现实形状磁性纳米颗粒的建模提供了量化依据，并建立了形貌参数与有效宏自旋参数之间的直接对应关系。", "summary_source": "deepseek", "authors": [{"name": "Iago López-Vázquez"}, {"name": "Òscar Iglesias"}, {"name": "David Serantes"}], "featured_authors": [{"name": "Iago López-Vázquez"}, {"name": "Òscar Iglesias"}, {"name": "David Serantes"}], "author_count": 3}, {"id": "2604.20515", "category": "cond-mat", "title": "Accurate and Efficient Interatomic Potentials for Dislocations in InP", "abstract": "We present Atomic Cluster Expansion (ACE) and MACE models trained on a new dataset of Density Functional Theory (DFT) calculations, constructed for the task of studying the mobility of dislocations in Indium Phosphide (InP). The models are validated in a suite of tests against RSCAN DFT, and compared with previously published potentials from literature. Our new models act as much better surrogates for DFT than the literature models: errors on partial dislocation formation energies are at most 4% for both ACE and MACE, compared with 18% for the MACE-MPA foundation model and 42-50% for earlier bespoke potentials. The bespoke MACE model achieves this accuracy while being around five times faster to evaluate than the MP0 and MPA foundation models.", "url": "https://arxiv.org/abs/2604.20515", "type": "理论+数值", "summary": "1. 该工作基于新构建的密度泛函理论计算数据集，训练了原子簇展开和机器学习原子簇势模型，专门用于精确研究磷化铟中位错的迁移行为。\n2. 其技术优势在于，新模型作为密度泛函理论的替代，在部分位错形成能预测误差上最大仅4%，远低于文献中已有势函数的18-50%，且定制MACE模型的计算速度比MP0和MPA基础模型快约五倍。\n3. 这为III-V族半导体材料中位错动力学的多尺度模拟提供了高精度且高效的势函数工具，有望推动材料缺陷工程及相关计算材料学方法的进一步发展。", "summary_source": "deepseek", "authors": [{"name": "Thomas Rocke"}, {"name": "Thomas Hudson"}, {"name": "Richard Beanland"}, {"name": "James Kermode"}], "featured_authors": [{"name": "Thomas Rocke"}, {"name": "Thomas Hudson"}, {"name": "Richard Beanland"}, {"name": "James Kermode"}], "author_count": 4}, {"id": "2604.20561", "category": "cond-mat", "title": "Exact analytical edge states in the extended Su-Schrieffer-Heeger model", "abstract": "We investigate the topology of the different phases of the extended Su-Schrieffer-Heeger (eSSH) model, which includes hopping processes between translationally inequivalent atoms beyond nearest neighbors. Exact analytical expressions for the edge states of a semi-infinite eSSH chain are derived, with wave functions that decay exponentially from the boundary with a unit-cell decay factor z. From the winding number of the bulk Hamiltonian under periodic boundary conditions, we determine the topological phase diagram and establish the bulk-boundary correspondence: changes in the winding number coincide with bulk gap closings and with the condition |z|=1 for the edge-state solutions. For finite chains, we further obtain analytical, approximate expressions for the low-energy edge states, which are shown to be highly accurate.", "url": "https://arxiv.org/abs/2604.20561", "type": "理论+数值", "summary": "1. 该工作针对包含次近邻跃迁的扩展Su-Schrieffer-Heeger模型，推导了半无限长链边缘态的精确解析解。\n2. 通过计算体哈密顿量的绕数并关联边缘态波函数的胞间衰减因子z，严格建立了该模型的体边对应关系。\n3. 所获得的有限长链低能边缘态高精度近似解，为在相关拓扑系统中进一步解析研究边缘态性质提供了有效途径。", "summary_source": "deepseek", "authors": [{"name": "P. A. Grizzi"}, {"name": "A. A. Aligia"}, {"name": "P. Roura-Bas"}], "featured_authors": [{"name": "P. A. Grizzi"}, {"name": "A. A. Aligia"}, {"name": "P. Roura-Bas"}], "author_count": 3}, {"id": "2604.20624", "category": "cond-mat", "title": "Topological Word for Non-Abelian Topological Insulators", "abstract": "We propose a unified framework, dubbed topological word, for the complete non-Abelian bulk-boundary correspondence in multigap non-Abelian topological insulators. Composed by an ordered sequence of letters, each a non-Abelian charge depicting the gap-resolved topology, the topological word captures both the global non-Abelian topology corresponding to the homotopy classification, and the band-adjacency information. The latter, though crucial for the edge-state pattern across multiple gaps, is often overlooked in previous studies. We confirm our framework using both static models and periodically driven Floquet systems, and discuss its connection and distinction with existing descriptions, such as the phase-band singularities and braiding representations. Intriguingly, topological word continues to provide insight regarding topology and edge states, even as the global non-Abelian topology becomes ill-defined under broken parity-time symmetry.", "url": "https://arxiv.org/abs/2604.20624", "type": "理论+数值", "summary": "1. 本研究提出了名为“拓扑词”的统一框架，以完整描述多能隙非阿贝尔拓扑绝缘体中的非阿贝尔体边对应关系。\n2. 该框架通过有序序列的非阿贝尔电荷字母刻画能隙分辨拓扑，同时捕捉全局非阿贝尔拓扑和关键但常被忽略的能带邻接信息，后者直接决定多能隙边缘态图案。\n3. 在静态模型和周期驱动Floquet系统中验证后，拓扑词即使在宇称时间对称性破缺导致全局拓扑无定义时仍能提供拓扑与边缘态见解，并与相位带奇异性、辫子表示等现有描述形成对比与联系。", "summary_source": "deepseek", "authors": [{"name": "Zhenming Zhang"}, {"name": "Tianyu Li"}, {"name": "Wei Yi"}], "featured_authors": [{"name": "Zhenming Zhang"}, {"name": "Tianyu Li"}, {"name": "Wei Yi"}], "author_count": 3}, {"id": "2604.20697", "category": "cond-mat", "title": "Interaction-induced asymmetry in infinite-temperature dynamical correlations of hard-core anyons", "abstract": "We study dynamical correlations of interacting hard-core anyons on a one-dimensional lattice at infinite temperature. This is a setting in which the many-body spectrum is independent of the statistical phase $\\theta$, while dynamical correlators remain sensitive to $\\theta$ through nonlocal Jordan-Wigner strings. We compute single-particle Green's functions, spectral functions, and density-density correlators, thereby separating the effects of fractional statistics on one-body coherence from those on density transport in a maximally mixed ensemble. In the noninteracting case $V=0$, high-temperature averaging leads to inversion-symmetric Green's functions for all $\\theta$ despite the presence of anyonic strings. Finite nearest-neighbor interactions $V$ generate, however, a pronounced left-right asymmetry in the Green's functions for $0<\\theta<\\pi$, with the strongest chirality appearing at intermediate couplings $V\\sim J$ where interactions and hopping compete most effectively. In this regime, the Green's function decays exponentially in time with a statistical-angle-dependent decay rate. At strong coupling, the dynamics crosses over to an atomic-limit regime in which the dependence on $\\theta$ is reduced. Here the Green's function decays universally as $t^{-1}$ and the corresponding spectral function displays a three-band structure. In contrast, density-density correlations are insensitive to statistics and recover the known infinite-temperature transport regimes of the XXZ chain, including ballistic, superdiffusive and diffusive behaviours. These results identify dynamical correlation functions as direct probes of fractional statistics in high-entropy quantum systems.", "url": "https://arxiv.org/abs/2604.20697", "type": "理论", "summary": "1. 该工作计算了一维无限温度下相互作用硬核任意子的动力学关联函数，包括单粒子格林函数、谱函数和密度-密度关联子。\n2. 研究发现有限近邻相互作用会破坏格林函数的左右对称性，产生依赖于统计角θ的指数衰减，而密度关联则恢复XXZ链的已知输运行为且与统计无关。\n3. 这为在高熵量子系统中通过动力学关联函数直接探测分数统计提供了明确途径，并揭示了相互作用与跳跃竞争对统计敏感动力学的调控作用。", "summary_source": "deepseek", "authors": [{"name": "Doru Sticlet"}, {"name": "Ovidiu I. Pâţu"}, {"name": "Balázs Dóra"}, {"name": "Cătălin Paşcu Moca"}], "featured_authors": [{"name": "Doru Sticlet"}, {"name": "Ovidiu I. Pâţu"}, {"name": "Balázs Dóra"}, {"name": "Cătălin Paşcu Moca"}], "author_count": 4}, {"id": "2604.20709", "category": "cond-mat", "title": "Anisotropic multiband magnetotransport in LaAg$_2$Ge$_2$ thin films", "abstract": "ThCr$_2$Si$_2$-type intermetallics are layered conductors in which crystallographic anisotropy and multiband electronic states often give rise to characteristic magnetotransport phenomena. Here, we report the molecular-beam epitaxy growth of LaAg$_2$Ge$_2$ thin films on MgO(001) and their magnetotransport properties. The Hall effect and magnetoresistance are captured by an effective two-carrier description with a high-mobility electron band, yielding a positive magnetoresistance of 22.5% at 9 T. Angle-dependent magnetoresistance exhibits a dominant twofold anisotropy and additional reproducible dip/peak features at characteristic tilt angles that are nearly independent of field and temperature. These results extend our understanding of the anisotropic electronic transport in thin-film germanides within the ThCr$_2$Si$_2$ family.", "url": "https://arxiv.org/abs/2604.20709", "type": "理论", "summary": "1. 该工作利用分子束外延在MgO(001)衬底上生长了LaAg₂Ge₂薄膜，并系统表征了其磁输运性质。\n2. 研究通过有效双载流子模型揭示了高迁移率电子能带主导的输运机制，并观测到与场强温度无关、具有可重复峰谷特征的二重各向异性磁电阻。\n3. 这为ThCr₂Si₂结构家族中锗化物薄膜的各向异性电子输运研究提供了新的材料平台与物理见解。", "summary_source": "deepseek", "authors": [{"name": "Mizuki Ohno"}, {"name": "Reiley Dorrian"}, {"name": "Veronica Show"}, {"name": "Joseph Falson"}], "featured_authors": [{"name": "Mizuki Ohno"}, {"name": "Reiley Dorrian"}, {"name": "Veronica Show"}, {"name": "Joseph Falson"}], "author_count": 4}, {"id": "2604.20716", "category": "cond-mat", "title": "Stabilization of a non-superconducting, orthorhombic phase by over-hydrogenating LaFeSiH", "abstract": "Chemical composition provides a powerful route to tune the electronic ground state of iron-based superconductors and other quantum materials, yet access to highly doped phases remains limited. Here we demonstrate that high-pressure thermal decomposition of hydrogen-rich precursors enables over-hydrogenation of LaFeSi. Using anthracene, we synthesize tetragonal superconducting LaFeSiH, including a single hydrogen site, while ammonia borane yields a structurally distorted over-hydrogenated phase, LaFeSiH1+x, with an orthorhombic structure. Chemical analysis reveal excess hydrogen (x ~ 0.6), implying a second H site in LaFeSiH1.6 whose localization and occupancy are determined by neutron diffraction. In contrast to metallic LaFeSi and superconducting LaFeSiH, orthorhombic LaFeSiH1.6 exhibits semiconductor-like behavior. Upon hydrogen release near 100 °C, it transforms into tetragonal superconducting LaFeSiH1+{\\delta} ({\\delta} << 0.6). These results establish the chemical flexibility of the layered LaFeSiX (X = H, O, F) family and provide access to a high hydrogen-doping regime, creating new opportunities to investigate superconductivity in Fe-based silicides.", "url": "https://arxiv.org/abs/2604.20716", "type": "理论", "summary": "1. 本研究通过高压热分解两种富氢前驱体，成功合成并表征了LaFeSiH的过氢化正交相LaFeSiH1.6。\n2. 关键发现在于过氢化诱导了结构畸变与新的氢占位，使材料从金属性或超导性转变为半导体行为，且该相在约100°C释放氢后可逆地转变为超导四方相。\n3. 这一结果为在铁基硅化物中通过极端氢掺杂探索超导性与电子相变开辟了新途径，并揭示了LaFeSiX体系丰富的化学调控灵活性。", "summary_source": "deepseek", "authors": [{"name": "M. F. Hansen"}, {"name": "C. Lepoittevin"}, {"name": "J.-B. Vaney"}, {"name": "P. Boullay"}, {"name": "V. Nassif"}, {"name": "A. Sulpice"}, {"name": "H. Mayaffre"}, {"name": "M.-H. Julien"}, {"name": "S. Tencé"}, {"name": "P. Toulemonde"}], "featured_authors": [{"name": "M. F. Hansen"}, {"name": "C. Lepoittevin"}, {"name": "J.-B. Vaney"}, {"name": "M.-H. Julien"}, {"name": "S. Tencé"}, {"name": "P. Toulemonde"}], "author_count": 10}, {"id": "2604.20770", "category": "cond-mat", "title": "Encounter times of random walkers with simultaneous resetting on networks", "abstract": "In this work, we study the dynamics of multiple random walkers on networks subject to a simultaneous resetting protocol, whereby all walkers are synchronously returned to their respective initial nodes. For this collective Markovian process, we derive exact analytical expressions for the mean first-encounter time, defined as the average time required for all walkers to meet for the first time at a given node. These results are formulated in terms of the eigenvalues and eigenvectors of the transition matrices governing the dynamics without resetting, providing a clear spectral interpretation of the impact of resetting on encounter processes. We further establish a general criterion for finite networks that determines when the introduction of a nonzero resetting probability reduces the mean first-encounter time and leads to an optimal resetting strategy. The theoretical predictions are illustrated through numerical results on regular and heterogeneous networks, for encounters involving two or more walkers, and for combinations of local and nonlocal dynamics. Our findings demonstrate that simultaneous resetting can significantly reduce encounter times for specific target nodes and initial conditions, while becoming ineffective for highly exploratory dynamics or distant targets. A comparison with independent resetting shows that simultaneous resetting is more efficient in homogeneous networks, whereas independent resetting can outperform it in heterogeneous structures, thereby revealing a trade-off between synchronization and exploration. The framework provides a unified approach to collective search and encounter problems on networks with resetting.", "url": "https://arxiv.org/abs/2604.20770", "type": "理论+数值", "summary": "1. 该工作研究了网络上多个随机行走者在同步重置协议下的首次相遇时间问题。\n2. 通过谱方法解析得到了平均首次相遇时间，并建立了重置概率优化相遇效率的普适判据。\n3. 此框架为网络上的集体搜索问题提供了统一方法，并揭示了同步与独立重置策略的效率权衡。", "summary_source": "deepseek", "authors": [{"name": "Cristian D. Suarez-Jimenez"}, {"name": "Alejandro P. Riascos"}, {"name": "Denis Boyer"}], "featured_authors": [{"name": "Cristian D. Suarez-Jimenez"}, {"name": "Alejandro P. Riascos"}, {"name": "Denis Boyer"}], "author_count": 3}, {"id": "2604.20797", "category": "cond-mat", "title": "Gauge-Equivariant Graph Neural Networks for Lattice Gauge Theories", "abstract": "Local gauge symmetry underlies fundamental interactions and strongly correlated quantum matter, yet existing machine-learning approaches lack a general, principled framework for learning under site-dependent symmetries, particularly for intrinsically nonlocal observables. Here we introduce a gauge-equivariant graph neural network that embeds non-Abelian symmetry directly into message passing via matrix-valued, gauge-covariant features and symmetry-compatible updates, extending equivariant learning from global to fully local symmetries. In this formulation, message passing implements gauge-covariant transport across the lattice, allowing nonlocal correlations and loop-like structures to emerge naturally from local operations. We validate the approach across pure gauge, gauge-matter, and dynamical regimes, establishing gauge-equivariant message passing as a general paradigm for learning in systems governed by local symmetry.", "url": "https://arxiv.org/abs/2604.20797", "type": "理论+数值", "summary": "1. 该论文提出了一种用于晶格规范理论的规范等变图神经网络，旨在克服现有机器学习方法在处理站点依赖对称性及非定域观测量时缺乏普适框架的局限。\n2. 其技术卖点是通过矩阵值规范协变特征与对称兼容更新，将消息传递机制扩展为规范协变传输，从而实现了从全局到局部对称性的等变学习，并自然生成非定域关联与环结构。\n3. 这为受局部规范对称性支配的各类系统（包括纯规范、规范-物质和动力学体系）的机器学习研究确立了一个通用范式，并启发了未来在强关联量子物质等领域的应用。", "summary_source": "deepseek", "authors": [{"name": "Ali Rayat"}, {"name": "Yaohang Li"}, {"name": "Gia-Wei Chern"}], "featured_authors": [{"name": "Ali Rayat"}, {"name": "Yaohang Li"}, {"name": "Gia-Wei Chern"}], "author_count": 3}, {"id": "2604.20831", "category": "cond-mat", "title": "Unconventional Quantum Criticality in Long-Range Spin-1 Chains: Insights from Entanglement Entropy and Bipartite Fluctuations", "abstract": "We study the ground-state phase diagram of a spin-1 Heisenberg chain with staggered long-range (LR) interactions decaying as $\\propto r^{-\\alpha}$ using a quantum Monte Carlo approach based on the split-spin representation. This formulation enables efficient large-scale simulations by mapping the spin-1 model onto spin-$1/2$ degrees of freedom with local projection constraints. We resolve the continuous quantum phase transition between the gapped Haldane phase at large $\\alpha$ (short-range regime) and a gapless antiferromagnetically ordered Néel phase at small $\\alpha$ (LR regime), where the continuous SU(2) symmetry is broken. From finite-size scaling and crossing point analyses, we determine the critical point to be at $\\alpha_c = 2.48(2)$ and extract the associated critical exponents, which indicate unconventional criticality. In particular, the transition is found to be nonconformal, characterized by a dynamic exponent $z \\neq 1$. We further analyze the scaling of entanglement entropy and bipartite fluctuations across the transition, and determine the corresponding universal scalings in both phases and at criticality.", "url": "https://arxiv.org/abs/2604.20831", "type": "理论+数值", "summary": "1. 该工作采用基于劈裂自旋表示的量子蒙特卡罗方法，研究了具有交错长程相互作用的 spin-1 海森堡链的基态相图。\n2. 其核心发现是确定了α_c=2.48(2)处非常规的量子临界点，该非共形相变以动态指数 z≠1 为特征。\n3. 这为理解长程相互作用系统中的普适性类别及超越共形场论的临界行为提供了新的基准。", "summary_source": "deepseek", "authors": [{"name": "Justin Tim-Lok Chau"}, {"name": "Jiarui Zhao"}, {"name": "Nicolas Laflorencie"}, {"name": "Zi Yang Meng"}], "featured_authors": [{"name": "Justin Tim-Lok Chau"}, {"name": "Jiarui Zhao"}, {"name": "Nicolas Laflorencie"}, {"name": "Zi Yang Meng"}], "author_count": 4}, {"id": "2604.19817", "category": "hep-th", "title": "Supersymmetry, Supergravity and Non--Perturbative Dynamics of Gauge Theories", "abstract": "We present a review of supersymmetry, supergravity, and the non-perturbative dynamics of gauge theories, tracing a path from the supersymmetry algebra to moduli stabilisation and de~Sitter vacua in string theory. Representations of the supersymmetry algebra, the superspace formalism, and basic models including the Wess--Zumino model and $\\mathcal{N}=1$ supersymmetric Yang--Mills theory are discussed. The non-perturbative dynamics of $\\mathcal{N}=2$ gauge theories is analysed through the Seiberg--Witten solution: the curve, prepotential, Picard--Fuchs system, BPS spectrum, and confinement via monopole condensation. The transition to $\\mathcal{N}=1$ supergravity is carried out in three steps, showing how the Kähler potential $K$ and superpotential $W$ determine all five Lagrangian sectors and how the scalar potential acquires its exponential prefactor and gravitationally induced negative contribution. String theory applications include D-brane gauge theories, the AdS/CFT correspondence, geometric engineering of the Seiberg--Witten solution, and reduction of $\\mathcal{N}=4$ to $\\mathcal{N}=1$ supersymmetry. The KKLT moduli stabilisation mechanism is analysed in detail, including $\\alpha'^3$ corrections to the Kähler potential. Three regimes of the scalar potential are identified -- classical KKLT, corrected KKLT with a shifted AdS minimum, and a runaway regime -- and the critical parameter $\\hat{\\xi}_c$ separating controlled de~Sitter vacua from decompactification is determined. The tension with the de~Sitter swampland conjecture is discussed.", "url": "https://arxiv.org/abs/2604.19817", "type": "理论", "summary": "1. 本文系统评述了超对称、超引力与规范理论非微扰动力学，从超对称代数出发贯通至弦论中的模稳定化与德西特真空。\n2. 核心进展在于通过塞伯格-维腾解揭示N=2规范理论非微扰动力学，并阐明Kähler势与超势如何决定超引力拉氏量及标量势结构，进而解析KKLT模稳定机制中三类势能区间及其临界参数。\n3. 该研究为弦论中可控德西特真空的构造提供了具体范式，同时其与德西特沼泽猜想间的张力为量子引力有效场论界限提出了明确检验方向。", "summary_source": "deepseek", "authors": [{"name": "Tetiana Obikhod"}], "featured_authors": [{"name": "Tetiana Obikhod"}], "author_count": 1}, {"id": "2604.19836", "category": "hep-th", "title": "The emergence of (3+1)-dimensional expanding spacetime from complex Langevin simulations of the Lorentzian type IIB matrix model with deformations", "abstract": "The Lorentzian type IIB matrix model is a promising candidate for a nonperturbative formulation of superstring theory. In this model, the eigenvalue distribution of the $N\\times N$ bosonic matrices $A_\\mu$ $(\\mu = 0 , \\ldots , 9)$ represents an emergent spacetime, which is determined by the dynamics of the model in the large-$N$ limit. Here we perform numerical simulations of the model overcoming the sign problem by the complex Langevin method with the matrix size $N$ up to $128$. In order to avoid the singular drift problem due to the Pfaffian, which appears after integrating out the fermionic matrices, we deform the model in a manner inspired by the supersymmetric deformation, which is used to define the ``polarized type IIB matrix model'' in the Euclidean case. We find that the deformed model exhibits a phase in which (3+1)-dimensional expanding spacetime emerges with both space and time being smooth and real.", "url": "https://arxiv.org/abs/2604.19836", "type": "理论", "summary": "1. 该工作通过复朗之万方法数值模拟了带变形的洛伦兹型IIB矩阵模型，并观测到(3+1)维膨胀时空的涌现。\n2. 其技术关键在于引入受超对称变形启发的模型变形以规避Pfaffian导致的奇异漂移问题，从而在N=128的规模下克服符号问题。\n3. 这一结果为非微扰超弦理论中现实时空的动力学起源提供了数值证据，并为探索早期宇宙膨胀机制开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Konstantinos N. Anagnostopoulos"}, {"name": "Takehiro Azuma"}, {"name": "Mitsuaki Hirasawa"}, {"name": "Jun Nishimura"}, {"name": "Stratos Papadoudis"}, {"name": "Asato Tsuchiya"}], "featured_authors": [{"name": "Konstantinos N. Anagnostopoulos"}, {"name": "Takehiro Azuma"}, {"name": "Mitsuaki Hirasawa"}, {"name": "Jun Nishimura"}, {"name": "Stratos Papadoudis"}, {"name": "Asato Tsuchiya"}], "author_count": 6}, {"id": "2604.19860", "category": "hep-th", "title": "Mutual Information from Modular Flow in General CFTs", "abstract": "The vacuum mutual information (MI) of subregion algebras provides a universal window into the data of general conformal field theories (CFTs). Exploiting the geometric nature of the modular flow associated to ball-shaped regions and the operator product expansion of twist operators implementing the replica symmetry in an $n$-fold version of a CFT, it is possible to construct a hierarchy of increasingly refined approximations to the full MI. In this letter, we use the two-point functions of primaries of arbitrary spin in the replicated theory to constrain the twist operators, and find their contribution to the MI of arbitrarily boosted balls in any $d$-dimensional CFT. When the two-point functions involve the primary with the lowest scaling dimension, our result provides the most precise approximation for the long-distance behavior of the MI, superseding all previous expansions. Building upon this result and certain universal properties of the short- and long-distance regimes, we put forward a new high-precision analytic approximation to the MI for arbitrary separations. The accuracy of our approach is validated against exact $d=2$ and lattice $d=3$ results. We further apply it to characterize the MI of a $d=4$ Maxwell field, a case for which no prior results are available.", "url": "https://arxiv.org/abs/2604.19860", "type": "理论", "summary": "1. 该工作利用任意维度共形场论中球状区域的模流几何性质与复制理论中 twist 算符的算子乘积展开，构建了真空互信息的多层次精确逼近方案。\n2. 其核心在于通过复制理论中任意自旋原初算子的两点函数约束 twist 算符，从而确定了任意 boost 球区域互信息中各类原初算子的贡献。\n3. 该方法为高维共形场论（如四维 Maxwell 场）互信息的长程与短程行为提供了首个高精度解析描述，并建立了统一框架。", "summary_source": "deepseek", "authors": [{"name": "César A. Agón"}, {"name": "Pablo Bueno"}, {"name": "Adem Deniz Piskin"}, {"name": "Guido van der Velde"}], "featured_authors": [{"name": "César A. Agón"}, {"name": "Pablo Bueno"}, {"name": "Adem Deniz Piskin"}, {"name": "Guido van der Velde"}], "author_count": 4}, {"id": "2604.19861", "category": "hep-th", "title": "Excitability in quantum field theory", "abstract": "In quantum field theory, it is not always possible to excite one state out of another using only local operators. This paper establishes abstract algebraic criteria for (local) excitability in general quantum theories, and computes these criteria explicitly for zero-mean Gaussian states in (generalized) free field theories. We find that in this context, due to the special nature of Gaussian states, one-way excitability always implies two-way excitability, and our results generalize the \"quasiequivalence theorems\" of Powers, Stormer, van Daele, Araki, and Yamagami. A key role in our proof is played by the information-theoretic tool of canonical purification. In appendices, we provide a pedagogical introduction to the algebraic formulation of (generalized) free field theory.", "url": "https://arxiv.org/abs/2604.19861", "type": "理论", "summary": "1. 该工作建立了广义量子理论中（局域）可激发性的抽象代数判据，并针对（广义）自由场论中的零均值高斯态进行了显式计算。\n2. 其核心发现是，在高斯态的特殊背景下，单向可激发性总是蕴含双向可激发性，证明中关键运用了信息论的正则纯化工具。\n3. 这推广了 Powers、Stormer 等人的“拟等价定理”，并为代数场论框架下的可激发性研究提供了系统的理论基础与教学参考。", "summary_source": "deepseek", "authors": [{"name": "Jacqueline Caminiti"}, {"name": "Federico Capeccia"}, {"name": "Jonathan Sorce"}], "featured_authors": [{"name": "Jacqueline Caminiti"}, {"name": "Federico Capeccia"}, {"name": "Jonathan Sorce"}], "author_count": 3}, {"id": "2604.19866", "category": "hep-th", "title": "Asymptotic charges as detectors and the memory effect in massive QED and perturbative quantum gravity", "abstract": "It has been shown that there are an infinite set of asymptotic symmetries in quantum gravity and QED, and this has been extended to dressed states in some cases. Here we rederive these statements in terms of detectors in order to clarify, confirm, and generalize these results to include external hard gravitons. Using detectors and including the full t dependence in Faddeev-Kulish dressings allows us to correct discrepancies in the literature and make new statements. We show that Faddeev-Kulish dressings correctly encode the memory effect in the 'in' and 'out' scattering Fock spaces. We find a physical contribution to the memory eigenvalues arising from the dressings in both cases.", "url": "https://arxiv.org/abs/2604.19866", "type": "理论", "summary": "1. 该工作通过探测器方法重述了量子引力与QED中的渐近对称性，并将其推广至包含外场硬引力子的情形。\n2. 其技术关键在于利用Faddeev-Kulish缀饰的完整时间依赖性，修正了文献中的不一致并证明了缀饰态对记忆效应的编码。\n3. 这为理解散射空间中记忆算符的本征值物理来源提供了自洽框架，并确立了缀饰态在渐近测量中的基础地位。", "summary_source": "deepseek", "authors": [{"name": "Brett Oertel"}, {"name": "Ian Moult"}, {"name": "Sabrina Pasterski"}], "featured_authors": [{"name": "Brett Oertel"}, {"name": "Ian Moult"}, {"name": "Sabrina Pasterski"}], "author_count": 3}, {"id": "2604.19868", "category": "hep-th", "title": "Crosscap Defects", "abstract": "We introduce a novel class of defects, termed {\\it crosscap defects}, in conformal field theory (CFT) in general dimensions. These arise from quotienting the spacetime by a $\\mathbb{Z}_2$ automorphism, and provide higher-codimension generalisations of CFT on real projective space ($\\mathbb{RP}^{d}$). Crosscap defects extend along a $p$-dimensional fixed locus of the $\\mathbb{Z}_2$ action and preserve an $SO(p+1,1)\\times PO(d-p)$ subgroup of the conformal group. The two-point functions of operators in this setup exhibit three operator product expansion channels: bulk, image, and defect. These lead to several {\\it crosscap crossing equations}, which we present. We analyse conformal block decompositions and show that the blocks are identical to defect CFT blocks up to a redefinition of cross ratios. As concrete examples, we study crosscap defects in the $O(N)$ model at the Gaussian and Wilson--Fisher fixed points in the $\\varepsilon$-expansion. We compute explicitly the associated CFT data as a function of $p$ and find that, unlike standard defects, displacement and tilt operators are absent for generic $p$. They provide examples of defect conformal manifolds without exactly marginal operators.", "url": "https://arxiv.org/abs/2604.19868", "type": "理论", "summary": "1. 该工作引入并系统研究了共形场论中一般维度的交叉帽缺陷，具体分析了O(N)模型在高斯与Wilson-Fisher不动点处的实现。\n2. 其核心在于揭示了此类缺陷普遍缺失位移与倾斜算符，从而提供了无精确边际算符的缺陷共形流形实例。\n3. 这为超越传统缺陷分类的共形边界条件研究开辟了新方向，并深化了对实射影空间上共形场论高余维推广的理解。", "summary_source": "deepseek", "authors": [{"name": "Nadav Drukker"}, {"name": "Shota Komatsu"}, {"name": "Anders Wallberg"}], "featured_authors": [{"name": "Nadav Drukker"}, {"name": "Shota Komatsu"}, {"name": "Anders Wallberg"}], "author_count": 3}, {"id": "2604.19881", "category": "hep-th", "title": "Weyl Anomaly Coefficients of Holographic Defect CFTs at Weak and Strong Coupling", "abstract": "We determine the type-A Weyl anomaly coefficient $b$, associated with the intrinsic scalar curvature of the defect, for the class of holographically realised co-dimension two defect CFTs (dCFTs) introduced in arXiv: 2506.14505 and arXiv: 2512.14853 . At strong coupling, we employ the dual D5-brane solutions in Euclidean signature, where the defect is supported on an $S^2$ submanifold of the Euclidean $AdS_3\\times S^1$ boundary. At weak coupling, we use the classical solutions of the ${\\cal N}=4$ SYM equations of motion, previously conjectured to describe the defects dual to the D5-brane configurations. Notably, the coefficient $b$ is found to be negative in a finite region of parameter space. To our knowledge, this constitutes the first explicit example of an {\\it interacting} unitary dCFT with $b<0$. We also compute the type-B Weyl anomaly coefficients associated with the extrinsic curvature of the defects, first at strong coupling and subsequently at weak coupling. In a certain limit, we find agreement between the weak- and strong-coupling results for both the type-A and type-B anomaly coefficients.", "url": "https://arxiv.org/abs/2604.19881", "type": "理论", "summary": "1. 该工作计算了全息实现的余维二缺陷共形场论中与缺陷内禀曲率相关的A型外尔反常系数b。\n2. 关键发现在于首次在相互作用幺正dCFT中明确得到了负值的b系数，并揭示了弱强耦合下A/B型反常系数的一致性极限。\n3. 这为全息对偶方法在缺陷场论反常结构研究中的普适性提供了有力证据，并揭示了参数空间中外尔反常符号变化的非平庸物理。", "summary_source": "deepseek", "authors": [{"name": "George Georgiou"}], "featured_authors": [{"name": "George Georgiou"}], "author_count": 1}, {"id": "2604.19885", "category": "hep-th", "title": "On non-relativistic integrable models and 4d SCFTs", "abstract": "We elaborate on the relation between the generalized Schur index of $N=2$ SCFTs in four dimensions and the non-relativistic limit of the elliptic Ruijsenaars-Schneider model. In particular we discuss explicitly how to express generalized Schur indices of theories of class $S$ in terms of elliptic Jack functions. For example, in the $A_1$ case the indices are given naturally in terms of eigenfunctions of the Lamé equation. We use the expression in terms of eigenfunctions to further check the recent observation that the generalized Schur indices of different theories in the Deligne-Cvitanović series can be mapped onto each other. This mapping implies non trivial identities on unrefined sums of eigenfunctions of non-relativistic elliptic Calogero-Moser models associated to different root systems. We claim then that the non-relativistic limits of various integrable models give rise naturally to generalized Schur-like limits of classes of $N=1$ SCFTs. As an example we discuss the relation of the Inozemtsev model, the non relativistic limit of the van Diejen model, and compactifications of the rank $Q$ E-string theory. We argue that in general the ``Schur index'' of $N=1$ $4d$ SCFTs can be understood as being related to the free fermionic limit of a non-relativistic integrable model.", "url": "https://arxiv.org/abs/2604.19885", "type": "理论", "summary": "1. 该工作系统阐述了四维N=2超共形场论的广义Schur指标与椭圆Ruijsenaars-Schneider模型非相对论极限之间的对应关系。\n2. 通过将S类理论的广义Schur指标表达为椭圆Jack函数，揭示了Lamé方程本征函数与A1型理论指标的天然联系，并验证了不同Deligne-Cvitanović系列理论指标间的映射关系。\n3. 这为理解更广泛的N=1超共形场论Schur指标提供了新视角，即其可视为非相对论可积模型自由费米子极限的自然产物。", "summary_source": "deepseek", "authors": [{"name": "Rotem Ben Zeev"}, {"name": "Anirudh Deb"}, {"name": "Hee-Cheol Kim"}, {"name": "Shlomo S. Razamat"}], "featured_authors": [{"name": "Rotem Ben Zeev"}, {"name": "Anirudh Deb"}, {"name": "Hee-Cheol Kim"}, {"name": "Shlomo S. Razamat"}], "author_count": 4}, {"id": "2604.19920", "category": "hep-th", "title": "Black Hole Interiors as a Laboratory for Time-Dependent Classical Double Copy", "abstract": "The classical double copy provides a powerful bridge between gravity and gauge theory, but its most explicit realizations remain concentrated in stationary or highly symmetric settings. We show that trapped regions of black-hole geometries furnish an exact setting for time-dependent classical double copy. In the static, spherically symmetric case, each trapped interval admits a local single-copy description on the associated Kantowski--Sachs patch that is intrinsically time dependent, although it can be derived from static Kerr--Schild data and does not require knowledge of any exterior black-hole completion. We prove that this class is characterized intrinsically by a distinguished relation between the Kantowski--Sachs scale factors, equivalently by the longitudinal relation \\(p_{\\parallel}=-\\rho\\), and that the Kerr--Schild scalar and single-copy field are uniquely reconstructible from interior cosmological data. Schwarzschild provides the singular benchmark, for which the single-copy electric field diverges along the interior evolution, while the regular Bardeen solution yields a finite single-copy field throughout the trapped region and a smooth extension into a regular static core. The Bardeen core violates the strong energy condition in a compact region, whereas the corresponding single-copy Maxwell field remains regular and satisfies the standard classical energy conditions. We further show that the Bardeen horizon phase structure is encoded in the single-copy scalar. These results identify trapped Kerr--Schild interiors as an exact local laboratory for time-dependent classical double copy.", "url": "https://arxiv.org/abs/2604.19920", "type": "理论", "summary": "1. 该工作证明了黑洞几何的囚禁区域为时间依赖的经典双重拷贝提供了精确的局域实现场景。\n2. 其核心在于从内禀的Kantowski–Sachs宇宙学数据出发，唯一重构了Kerr–Schild标量与单拷贝场，并以Schwarzschild和Bardeen解为例揭示了单拷贝场在奇性与正则核心中的不同行为。\n3. 这为在强引力时空的非稳态区域中精确研究引力与规范理论的对应关系，以及探索相关能量条件违反的物理含义提供了新的理论实验室。", "summary_source": "deepseek", "authors": [{"name": "Damien A. Easson"}, {"name": "Tucker Manton"}], "featured_authors": [{"name": "Damien A. Easson"}, {"name": "Tucker Manton"}], "author_count": 2}, {"id": "2604.20099", "category": "hep-th", "title": "Geometric Amplitudes: A Covariant Functional Approach for Massless Scalar Theories", "abstract": "Functional geometry is a framework using concepts from geometry to understand the invariance of amplitudes in quantum field theory under a large class of field redefinitions, including those involving derivatives. It is inspired by recursion relations among correlation functions, where higher-point functions depend iteratively upon smaller correlators. Previous work has shown that, with suitable modifications, these correlation functions become covariant under field redefinitions, provided they are evaluated at the physical ``on-shell\" point. In this paper, we show how to further modify correlation functions in massless scalar field theories to achieve ``off-shell\" covariance. We investigate the conditions required for the framework to work and discuss the geometric interpretation of this construction -- which prioritizes the covariant transformation of observables under field redefinitions over the role of a metric tensor and its derivatives. While analogous modifications may exist for massive theories, we show that framework developed here does not extend straightforwardly to that case.", "url": "https://arxiv.org/abs/2604.20099", "type": "理论", "summary": "1. 该工作通过修改无质量标量场论中的关联函数，实现了在场重定义下“离壳”协变性的理论框架。\n2. 其核心在于构建了优先保证可观测量协变变换的几何诠释，而非依赖于度规张量及其导数的传统方式。\n3. 这为理解量子场论中离壳结构的几何性质提供了新视角，同时明确指出了该框架向有质量理论推广的非平凡性。", "summary_source": "deepseek", "authors": [{"name": "Antonio Delgado"}, {"name": "Adam Martin"}, {"name": "Runqing Wang"}], "featured_authors": [{"name": "Antonio Delgado"}, {"name": "Adam Martin"}, {"name": "Runqing Wang"}], "author_count": 3}, {"id": "2604.20165", "category": "hep-th", "title": "Entropy bound and the non-universality of entanglement islands", "abstract": "Entanglement islands resolve the AMPS firewall paradox in a region-dependent manner by modifying the entanglement wedge of Hawking radiation. We investigate whether this resolution can be made universal, in the sense that a single compact island serves as a common interior support for all AMPS-relevant radiation regions. We show that such a construction is obstructed under reasonable assumptions. Universality forces an accumulation of interior partner entropy within a fixed compact region, which at late times exceeds the Bekenstein--Hawking bound set by its boundary area. However, a valid island realization for at least one radiation region requires compatibility with semiclassical entropy bounds. This leads to a contradiction, yielding a conditional no-go result for universal compact islands. Our result implies that interior reconstruction in the island framework must remain intrinsically region-dependent.", "url": "https://arxiv.org/abs/2604.20165", "type": "理论", "summary": "1. 该工作研究了能否通过单一紧致岛状区域普适性地解决AMPS防火墙悖论，并证明在合理假设下此构造存在障碍。\n2. 其核心在于指出普适性要求会导致固定紧致区域内伙伴熵的累积，最终超越由其边界面积设定的贝肯斯坦-霍金熵界，与半经典熵界要求相矛盾。\n3. 这一条件性不可行结果表明，在岛状框架下的内部重构本质上必须保持对辐射区域的依赖性，从而明确了该理论框架的适用范围与内在限制。", "summary_source": "deepseek", "authors": [{"name": "Naman Kumar"}], "featured_authors": [{"name": "Naman Kumar"}], "author_count": 1}, {"id": "2604.20170", "category": "hep-th", "title": "Computational Cosmic Censorship", "abstract": "We propose a computational formulation of weak cosmic censorship in AdS/CFT. Using the complexity=action proposal, we evaluate the Wheeler-DeWitt action for overcharged Reissner- Nordström-AdS spacetimes containing naked timelike singularities. We show that the bulk, null, and joint contributions remain finite, while the Gibbons-Hawking-York term at the singularity diverges. More generally, for any static and spherically symmetric geometry with near-origin scaling $f(r)\\sim a r^{-p}$, the singularity term diverges whenever $p>D-3$. This implies divergent holographic complexity and, even relative to the logarithmically divergent extremal charged sector, leaves an infinite complexity gap. This suggests an operational form of censorship: naked singularities are excluded not by geometry alone, but by an infinite computational cost arising from their local near-singularity structure.", "url": "https://arxiv.org/abs/2604.20170", "type": "理论", "summary": "1. 该工作通过复杂度=作用量方案，在AdS/CFT框架下为弱宇宙监督猜想提出了计算表述，并分析了含裸奇点的超带电Reissner-Nordström-AdS时空。\n2. 研究揭示，对于满足近原点标度律f(r)∼a r^{-p}的静态球对称几何，当p>D-3时奇点处的Gibbons-Hawking-York项发散，导致全息复杂度发散并与极端带电情形产生无限复杂度间隙。\n3. 这暗示了一种操作性的宇宙监督形式：裸奇点因其局域奇点结构产生的无限计算代价而被排除，而非仅由几何条件决定。", "summary_source": "deepseek", "authors": [{"name": "Fuat Berkin Altunkaynak"}], "featured_authors": [{"name": "Fuat Berkin Altunkaynak"}], "author_count": 1}, {"id": "2604.20377", "category": "hep-th", "title": "Off-shell recursion
