stence of critical and supercritical states, bound states, confinement and scattering resonances for some particular interactions of special interest.", "url": "https://arxiv.org/abs/2605.02733", "type": "理论", "summary": "1. 该工作采用分布方法，系统研究了宇称对称两点上最一般相对论接触相互作用的狄拉克方程束缚态与共振。\n2. 其卖点在于每个作用点由四个具明确物理意义的参数刻画，通过区分宇称偶奇性，分析了临界态、超临界态及散射共振的涌现条件。\n3. 这为理解一维相对论量子力学中可调谐束缚与共振机制提供了精确框架，并可推广至更复杂点相互作用模型的低维物理系统。", "summary_source": "deepseek", "authors": [{"name": "Carlos A. Bonin"}, {"name": "Manuel Gadella"}, {"name": "José T. Lunardi"}, {"name": "Luiz A. Manzoni"}], "featured_authors": [{"name": "Carlos A. Bonin"}, {"name": "Manuel Gadella"}, {"name": "José T. Lunardi"}, {"name": "Luiz A. Manzoni"}], "author_count": 4}, {"id": "2605.02774", "category": "quant-ph", "title": "Operator spreading and recoverability of local quantum Fisher information in a $U(1)$-broken spin chain", "abstract": "While out-of-time-order correlators establish a causal light cone for operator spreading, they do not guarantee that the parameter sensitivity carried by the operator remains locally recoverable. We examine the distinction between operator spreading and metrological recoverability for a parameter encoded in a single site of an XX spin chain subjected to a $U(1)$-breaking transverse field. We evaluate three levels of local metrological accessibility: the bare single-site quantum Fisher information (QFI), the QFI recovered by a variational sweep decoder acting on a finite spatial block, and the exact block QFI. In the integrable limit, the sensitivity propagates as a one-magnon wave packet, and a single-qubit decoder recovers the full block QFI. Breaking magnon-number conservation couples the parameter tangent state to multi-magnon sectors. We analytically demonstrate that the local QFI has no first-order correction in field strength; the leading depletion enters at $\\mathcal{O}(h^2)$ through two-magnon scattering. As the field strength increases, the decoded QFI falls below the exact block QFI -- a gap reflecting a generic finite-dimensional compression limitation, as a single output qubit generically cannot capture the full QFI of a block state whose parameter dependence spans more than an effective two-dimensional subspace. The block QFI itself falls below the conserved global value, confirming that the sensitivity has spread beyond the block into non-local correlations. This operational hierarchy provides a precise quantitative distinction between the arrival of operator support and the local accessibility of metrological information.", "url": "https://arxiv.org/abs/2605.02774", "type": "理论+数值", "summary": "1. 该工作在一个U(1)破缺的XX自旋链中，区分了单格点编码参数的算子传播与计量可恢复性。\n2. 其卖点在于解析揭示局部量子Fisher信息的一阶修正为零，领先耗散来自O(h²)的双磁子散射，且单比特译码器因有限维压缩无法捕获块态的完整Fisher信息。\n3. 这为区分算子支持到达与局部计量信息可访问性提供了精确的定量层级，并启发对更普适量子计量场景中非局域关联影响的理解。", "summary_source": "deepseek", "authors": [{"name": "Marcin Płodzień"}, {"name": "Jan Chwedeńczuk"}], "featured_authors": [{"name": "Marcin Płodzień"}, {"name": "Jan Chwedeńczuk"}], "author_count": 2}, {"id": "2605.02864", "category": "quant-ph", "title": "Structures of Identical Particle Systems : Efficient Computation of Many-Body Density of States", "abstract": "We present a method for approximating the many-body density of states of a system of quantum identical particles, with a reduction of the computational cost by a combinatorial factor compared to the full calculation. This is carried out by considering an isolated quantum system of identical particles, and studying its non-interacting many-body spectrum through the use of a new approach based on a separation of universal combinatorial properties from the system-specific quantities. In this paper we focus on a practical computation method that leverages our formalism of many-body combinatorics, in order to perform an efficient numerical computation of the many-body density of states. In addition, this method provides further computational improvements by allowing most of the results to be cached in persistent storage and computed incrementally, making way for efficient use of parallelization and dynamic programming techniques. We give an extensive description of the method and provide several detailed examples of approximations of bosonic many-body density of states with tunable accuracy requirements. Lastly, we demonstrate how one such approximation can be used to recover Bose-Einstein-like distributions without any particle statistics assumptions.", "url": "https://arxiv.org/abs/2605.02864", "type": "数值", "summary": "1. 本工作针对全同量子粒子系统，提出一种分离通用组合性质与系统特定量的方法，以高效近似计算其多体态密度。\n2. 其核心优势在于利用多体组合学形式化将计算复杂度降低一个组合因子，并支持结果缓存与增量计算，从而实现高效并行化与动态规划，提供可调精度的玻色子近似示例。\n3. 该方法无需粒子统计假设即可恢复类玻色-爱因斯坦分布，为量子多体问题中组合与统计效应的分离及后续高效数值计算提供了清晰方向。", "summary_source": "deepseek", "authors": [{"name": "Hovan Lee"}, {"name": "Rémi Lefèvre"}, {"name": "Grégoire Ithier"}], "featured_authors": [{"name": "Hovan Lee"}, {"name": "Rémi Lefèvre"}, {"name": "Grégoire Ithier"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
