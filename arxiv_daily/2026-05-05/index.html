ize Lie group fiber bundle connections and generalized principal connections in terms of horizontal lifts and of local conditions. Finally, we recover in our setting some already known results, including that generalized principal connections are associated only to Lie group fiber bundle connections and that they reduce to usual principal connections on standard principal bundles. Our results are needed in order to understand how generalized principal connections might fit in the fiber bundle treatment of classical field theories, aiming towards a notion of generalized gauge theory.", "url": "https://arxiv.org/abs/2605.01983", "type": "理论", "summary": "1. 该工作通过局部坐标变换律刻画广义主丛与广义主联络的全局几何性质，并引入广义主丛坐标及其变换法则。\n2. 其核心贡献在于证明任一李群纤维丛均为广义主丛（从而向量丛特例成立），且连通典型纤维的李群纤维丛必为某主丛的伴随丛。\n3. 这为经典场论的纤维丛框架向广义规范理论拓展提供了直接的联络构造基础与局部化条件验证路径。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo Fatibene"}, {"name": "Hartwig Winterroth"}], "featured_authors": [{"name": "Lorenzo Fatibene"}, {"name": "Hartwig Winterroth"}], "author_count": 2}, {"id": "2605.02349", "category": "math-ph", "title": "On the Ultraviolet Problem for the Ground State Energy of the Translation-Invariant Pauli--Fierz Model at Zero Total Momentum", "abstract": "We study the ground state energy of the Pauli--Fierz model in the absence of external potentials. We consider the fiber decomposition of the Pauli--Fierz operator with respect to the spectral values, $p$, of the total momentum operator and focus on the case $p = 0$. The corresponding variational problem is analyzed to estimate the dependence of the ground state energy on the ultraviolet cutoff $\\Lambda$. We employ a Bogoliubov--Hartree--Fock approximation using pure, quasifree states generated by Bogolubov transformations (parametrized by a positive Hilbert--Schmidt operator $z$) and Weyl transformations (parametrized by a vector $\\eta$) applied to the vacuum. We prove that the resulting energy functional is not a convex function of $\\eta$ and $z$. We identify the non-convex term and remove it from the energy functional. The modified functional retains the full interaction term and is shown to be strictly convex. We study the ground state of the modified functional and prove the existence of a unique minimizer. Furthermore, we construct an explicit partial minimizer (with respect to $\\eta$, for fixed $z$), which allows us to eliminate $z$ and reduce the minimization problem to a single variable, $\\eta$. Finally, we estimate the minimum of the modified energy functional in terms of the ultraviolet cutoff $\\Lambda$ and demonstrate that, up to a constant factor, it grows asymptotically as $\\Lambda^{3/2}$, as $\\Lambda \\to \\infty$.", "url": "https://arxiv.org/abs/2605.02349", "type": "理论", "summary": "1. 该工作研究平移不变Pauli-Fierz模型在零总动量下基态能量对紫外截断Λ的依赖，通过Bogoliubov-Hartree-Fock近似分析变分问题。\n2. 其技术核心在于识别并移除导致非凸性的项，使得修改后的能量泛函严格凸，证明唯一极小元存在，并构造部分极小元将问题简化为单变量优化。\n3. 这为处理量子电动力学中紫外截断的渐近行为提供了严格框架，表明基态能量下界随Λ^{3/2}增长，并启发对非凸场论模型变分法的推广。", "summary_source": "deepseek", "authors": [{"name": "Volker Bach"}, {"name": "Miguel Ballesteros"}, {"name": "Merten Mlinarzik"}], "featured_authors": [{"name": "Volker Bach"}, {"name": "Miguel Ballesteros"}, {"name": "Merten Mlinarzik"}], "author_count": 3}, {"id": "2605.02473", "category": "math-ph", "title": "Low-Order Conservation Law Multipliers for a Generalized Fifth-Order KP Family", "abstract": "We study local conservation law multipliers for a generalized fifth-order Kadomtsev--Petviashvili family whose one-dimensional reductions include the Lax, Sawada--Kotera, and Kaup--Kupershmidt equations. Using the direct multiplier method, we classify zeroth-order multipliers that are independent of the dependent variable within a natural polynomial subclass and construct representative conserved vectors. We then prove that every multiplier of differential order at most two is necessarily of differential order at most one. An unrestricted first-order classification is obtained when the coefficient of the cubic derivative nonlinearity is nonzero, and the same reduction is established on a generic algebraic sub-branch of the complementary case. In these regimes, all first-order multipliers reduce to the zeroth-order family. A finite list of exceptional branches remains open. The results identify the structural sources responsible for the low-order rigidity of the multiplier problem in the generic regimes treated here.", "url": "https://arxiv.org/abs/2605.02473", "type": "理论", "summary": "1. 该工作对广义五阶Kadomtsev–Petviashvili族中自然多项式子类的零阶守恒律乘子进行分类，并证明微分阶数至多为二的乘子必约化至一阶。\n2. 通过直接乘子法，在三次导数非线性项系数非零及互补情形下建立了所有一阶乘子回归零阶族的刚性结构。\n3. 结果揭示了该族通用情形下守恒律低阶刚性的结构来源，为可积系统的乘子分析提供了约束性框架。", "summary_source": "deepseek", "authors": [{"name": "Nitin Serwa"}], "featured_authors": [{"name": "Nitin Serwa"}], "author_count": 1}, {"id": "2605.02643", "category": "math-ph", "title": "Generalized Kontsevich model, topological recursion, and $r$-spin theory", "abstract": "By employing polynomial-reduced KP integrability, combined with the string equation, this work establishes explicit relationships between the generalized Kontsevich model, the topological recursion of the spectral curve, and the geometry of moduli spaces of $r$-spin curves. For the generalized Kontsevich model with a polynomial potential, we derive an explicit formulation and provide a proof of these widely expected correspondences. Furthermore, the method is extended to the cases with admissible deformed potentials, where the corresponding geometric theory is a deformed version of $r$-spin theory.", "url": "https://arxiv.org/abs/2605.02643", "type": "理论", "summary": "1. 该工作利用多项式约化的KP可积性与弦方程，建立了广义Kontsevich模型、拓扑递归与r-spin曲线模空间几何的显式对应。\n2. 其技术核心在于为多项式势情形导出了这些对应关系的显式公式并给出严格证明。\n3. 该对应方法进一步推广至可容许变形势，从而得到变形r-spin几何理论，为相关可积系统与模空间研究提供了新路径。", "summary_source": "deepseek", "authors": [{"name": "Shuai Guo"}, {"name": "Ce Ji"}, {"name": "Chenglang Yang"}, {"name": "Qingsheng Zhang"}], "featured_authors": [{"name": "Shuai Guo"}, {"name": "Ce Ji"}, {"name": "Chenglang Yang"}, {"name": "Qingsheng Zhang"}], "author_count": 4}, {"id": "2605.02816", "category": "math-ph", "title": "On Algebras of Functions over Infinite Dimensions", "abstract": "We introduce a family of reproducing kernel Hilbert spaces $\\mathcal A_\\Lambda$ of holomorphic functions defined on an infinite--dimensional domain in a separable Hilbert space, $\\mathbb{H}$. The reproducing kernel of $\\mathcal A_\\Lambda$ is constructed using the covariance operator associated with a Gaussian measure on $\\mathbb{H}$, along with a holomorphic function $\\Lambda$ on the unit disk. Under certain conditions on the kernel, $\\mathcal A_\\Lambda$ is closed under pointwise multiplication, giving it the structure of a reproducing kernel Hilbert algebra (RKHA). We also study twisted canonical commutation relations on these RKHAs, where the creation and annihilation operators are both bounded.", "url": "https://arxiv.org/abs/2605.02816", "type": "理论", "summary": "1. 该工作利用高斯测度的协方差算子和单位圆盘上的全纯函数构造了一类定义在可分希尔伯特空间无限维域上的再生核希尔伯特空间族。\n2. 其技术核心在于通过核函数条件使得该空间对逐点乘法封闭，从而构成再生核希尔伯特代数，并在此代数上引入有界产生湮灭算符满足的扭正则对易关系。\n3. 这为无限维函数空间上的代数结构研究提供了新框架，并对量子场论中算符代数的构造具有潜在启发。", "summary_source": "deepseek", "authors": [{"name": "Dimitrios Giannakis"}, {"name": "Mohammad Javad Latifi Jebelli"}, {"name": "Michael Montgomery"}], "featured_authors": [{"name": "Dimitrios Giannakis"}, {"name": "Mohammad Javad Latifi Jebelli"}, {"name": "Michael Montgomery"}], "author_count": 3}, {"id": "2605.00952", "category": "quant-ph", "title": "Which Coherence Decoheres? Basis-Dependent Decoherence Rates in Symmetry-Broken Collective Spin Systems", "abstract": "In the ordered phase of a $\\mathbb{Z}_2$-symmetric collective spin system, two natural bases -- localised pointer states $\\{|P\\rangle,|R\\rangle\\}$ and energy eigenstates $\\{|E_0\\rangle,|E_1\\rangle\\}$ -- yield Lindblad dephasing rates that differ by a factor approaching $2$ as $N\\to\\infty$ and reaching $2.42$ near the quantum-critical crossover. The discrepancy has a single algebraic origin: parity forces $\\langle E_i|\\hat{J}_z|E_i\\rangle=0$ exactly, eliminating the cross-term that doubles the localised-state rate. Two distinct protection factors are identified: $\\eta_{\\rm MF}=(Nm_*)^2/(2G_{01})\\approx2.42$, where $m_*$ is the order parameter and $G_{01}=\\frac{1}{2}(\\langle E_0|\\hat{J}_z^2|E_0\\rangle+\\langle E_1|\\hat{J}_z^2|E_1\\rangle)$ (advantage over the classical mean-field estimate), and $\\eta_{\\rm exact}=(G_{01}+J_{01}^2)/G_{01}\\approx1.86$, where $J_{01}=\\langle E_0|\\hat{J}_z|E_1\\rangle$ (exact physical ratio of pointer-state to eigenstate decay rate). In the thermodynamic limit the secular approximation fails, the doublet degenerates, and both rates converge. The three-regime structure is demonstrated in the Lipkin-Meshkov-Glick model via exact diagonalisation, and the algebraic origin of the discrepancy is established via the $\\mathbb{Z}_2$ parity of the Lindblad jump operator.", "url": "https://arxiv.org/abs/2605.00952", "type": "理论", "summary": "1. 该工作发现在Z₂对称集体自旋系统有序相中，局域指针基与能量本征基的Lindblad退相干速率相差可达2.42倍，并由宇称约束导致的交叉项缺失给出代数解释。\n2. 其技术核心在于宇称迫使⟨E_i|Ĵ_z|E_i⟩=0，从而消除指针态中倍增速率的交叉项，并引入两种保护因子η_MF≈2.42和η_exact≈1.86定量刻画抑制程度。\n3. 该结果揭示退相干速率的基依赖性在热力学极限下消失且双态简并，为理解对称性破缺多体系统中的量子相干保护及量子临界区退相干行为提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Stavros Mouslopoulos"}], "featured_authors": [{"name": "Stavros Mouslopoulos"}], "author_count": 1}, {"id": "2605.00954", "category": "quant-ph", "title": "Multiple Bulk-Boundary Correspondences and Anomalous Modes in a Non-Hermitian Creutz Ladder", "abstract": "The synergy of non-Hermitian and topology renders the bulk-boundary correspondence (BBC) even more elusive. Here we study a non-Hermitian Creutz ladder that incorporates both gain-loss and nonreciprocity, and construct multiple BBCs involving scale-free, normal and anomalous skin modes, as well as topological zero-energy modes. In the presence of spatial inversion (P) symmetry, the parity-time (PT) phase transition is characterizedbyanaveragewindingnumber,whereasahiddenchiralsymmetryguaranteesthattopologicalphase transitions can be detected via a Z 2 invariant. The gain-loss breaks the P symmetry but preserves the combined PT symmetry, and then the previous BBC version only requires minor modifications. Intriguingly, sublattice symmetry enables the precise calculation of non-Bloch spectra, based on which a hybrid spectral winding can encode the localization (or delocalization) information of two counterintuitive bulk modes that coexist with normal skin modes. One type exhibits exponential boundary accumulation in the opposite direction to nonreciprocity. The other exemplifies a surge of Bloch-wave states in nonreciprocal lattices. These results reveal a series of unexpected phenomena governed by symmetry, thereby expanding our fundamental understanding of the BBC mechanism in non-Hermitian topological systems.", "url": "https://arxiv.org/abs/2605.00954", "type": "理论+数值", "summary": "1. 该工作研究了一个包含增益损耗与非互易性的非厄米Creutz梯子，构建了涉及标度无关、正常、反常皮肤模及拓扑零能模的多种体-边界对应。\n2. 其技术要点在于利用子晶格对称性精确计算非布洛赫谱，并通过混合谱缠绕数编码两类同时存在的反常体模的局域化信息。\n3. 这为理解对称性驱动的非厄米拓扑系统中体-边界对应机制提供了新视角，并揭示了反向指数积累与非互易晶格中布洛赫波激增等意外现象。", "summary_source": "deepseek", "authors": [{"name": "Xin Li"}, {"name": "TongYi Li"}, {"name": "JingYu Peng"}, {"name": "Yu Wang"}], "featured_authors": [{"name": "Xin Li"}, {"name": "TongYi Li"}, {"name": "JingYu Peng"}, {"name": "Yu Wang"}], "author_count": 4}, {"id": "2605.00979", "category": "quant-ph", "title": "Universality of Quantum Gates in Particle and Symmetry Constrained Subspaces", "abstract": "Simulating physical systems on near-term quantum computers often requires preparing states within constrained subspaces, like those with fixed particle number or spin. We use Lie algebraic techniques to prove that hardware-efficient gates are universal for state preparation in these subspaces. The key mechanism is Pauli $Z$ dressing: commutators of overlapping gates produce Pauli $Z$ operators on shared qubits, acting as spectator projectors that decompose multi-plane rotations into single-plane generators spanning the full $\\mathfrak{so}(w)$ algebra, where $w$ is the dimension of the constrained subspace, thereby guaranteeing universality for real state preparation. Adding independent complex phases extends this to $\\mathfrak{su}(w)$, enabling arbitrary complex state preparation. We provide a computationally efficient Jacobian criterion for verifying that a circuit can explore any direction on the target manifold from almost any parameter configuration. Our findings are applicable to many problem areas, including Fermi-Hubbard models, Bose-Hubbard models, and molecular electronic structure. We apply our framework to two physical settings: we prove the completeness of the binary encoded multi-level particles ansatz on the conserved-particle-number subspace, and we construct symmetry-preserving circuits for the fuzzy sphere regularisation of the 3D Ising conformal field theory (CFT). For the latter, we variationally prepare the ground and excited states to extract CFT scaling dimensions.", "url": "https://arxiv.org/abs/2605.00979", "type": "理论+数值", "summary": "1. 该工作利用李代数方法证明了粒子数或对称性约束子空间中硬件高效量子门具有通用性。\n2. 其技术核心是Pauli Z修饰机制：交叠门的对易子生成共享量子比特上的Pauli Z算符，将多平面旋转分解为单平面生成元，张满so(w)或su(w)代数。\n3. 该框架为费米-哈伯德、玻色-哈伯德和分子电子结构等问题的变分量子模拟提供了通用性保障，并已用于模糊球正规化3D伊辛CFT的基态与激发态制备。", "summary_source": "deepseek", "authors": [{"name": "Andreas Stergiou"}, {"name": "Nicolas PD Sawaya"}], "featured_authors": [{"name": "Andreas Stergiou"}, {"name": "Nicolas PD Sawaya"}], "author_count": 2}, {"id": "2605.01052", "category": "quant-ph", "title": "Entropic Reciprocity in Time-Reversed Young Interferometry", "abstract": "We show that time-reversed Young interferometry reorganizes, rather than reverses, optical entropy. A fixed detector conditions the reciprocal source--detector Green function and produces a source-label probability distribution. Marginal entropies in the standard and time-reversed geometries are generally unequal; the reciprocal invariant is instead the mutual information between source and detector coordinates. Near a destructive response, the conditioned source-label entropy can decrease while Fisher information for small phase, tilt, or defocus perturbations increases. The result identifies time-reversed Young interferometry as a source-space information processor with no analogue in ordinary detector-plane fringe readout.", "url": "https://arxiv.org/abs/2605.01052", "type": "理论", "summary": "1. 该工作证明时间反演杨氏干涉仪重新组织而非逆转光熵，并由固定探测器条件化互易格林函数导出源标签概率分布。\n2. 其核心发现在于标准与时间反演几何中的边缘熵不相等，而互易不变量为源与探测器坐标间的互信息，且在破坏性响应附近条件源标签熵降低伴随相位等扰动的Fisher信息增大。\n3. 这明确将时间反演杨氏干涉仪识别为一种源空间信息处理器，其信息处理特性在普通探测器平面条纹读出中不存在对应物。", "summary_source": "deepseek", "authors": [{"name": "Jianming Wen"}], "featured_authors": [{"name": "Jianming Wen"}], "author_count": 1}, {"id": "2605.01103", "category": "quant-ph", "title": "On Quantum Indeterminacy", "abstract": "We introduce a geometric formulation of quantum indeterminacy from which the standard uncertainty inequalities emerge as necessary consequences. Our approach is based on convex geometry in phase space and on methods from symplectic topology, and does not rely on statistical descriptors such as variances or covariances. Instead, we associate to empirical position and momentum data with convex bodies whose mutual relations encode the fundamental constraints of quantum mechanics. The central tools are h-polar duality and symplectic capacities, which provide intrinsic, coordinate-free bounds on admissible phase-space configurations. Within this framework, the Robertson-Schrodinger inequalities arise naturally as manifestations of deeper geometric and topological principles. This perspective suggests that quantum indeterminacy is not primarily a statistical phenomenon, but rather a structural property of phase space governed by symplectic covariance. The results thus provide a unified and conceptually transparent foundation for the uncertainty principle.", "url": "https://arxiv.org/abs/2605.01103", "type": "理论", "summary": "1. 该工作基于相空间凸几何与辛拓扑方法，将量子不确定性原理重新表述为无需统计描述的几何约束体系。\n2. 核心创新在于利用h-极对偶与辛容量为可容许相空间构型提供内禀无坐标边界，使Robertson-Schrödinger不等式作为几何拓扑结论自然涌现。\n3. 这表明量子不确定性本质上是相空间受辛协变性支配的结构性质，为统一理解不确定性原理提供了概念基础，并可能启发新的坐标无关量子理论形式。", "summary_source": "deepseek", "authors": [{"name": "Maurice de Gosson"}], "featured_authors": [{"name": "Maurice de Gosson"}], "author_count": 1}, {"id": "2605.01149", "category": "quant-ph", "title": "ADaPT: Adaptive-window Decoding for Practical fault-Tolerance", "abstract": "Window decoding, first proposed to reduce decoding complexity for real-time decoding, is an essential component to realize scalable, universal-fault tolerant computation. Prior work has focused on improving throughput through parallelization and reducing reaction time via speculation on window boundaries. However, these methods use a fixed window size d, paying a fixed decoding time overhead for each window. In practice, we find this overhead of a fixed window size unnecessary in many cases due to the sparsity of average-case errors in QEC. Leveraging this insight, in this paper we propose an adaptive window decoding technique based on decoder confidence. This technique reduces the overhead in decoding time thus reducing reaction time without compromising on logical error rates. We benchmark adaptive window decoding across different codes and hardware inspired noise models. Our results show that this adaptive technique reaches the target error rate while maintaining a low decoding time overhead across different codes, and under different noise models.", "url": "https://arxiv.org/abs/2605.01149", "type": "理论", "summary": "1. 该工作提出了一种基于解码器置信度的自适应窗口解码技术，以降低容错量子计算中实时解码的时间开销。\n2. 其卖点在于利用量子纠错中平均错误稀疏性，动态调整窗口大小，在不牺牲逻辑错误率前提下缩短反应时间。\n3. 这为在不同码与噪声模型下实现低延迟、可扩展的实时解码提供了实用化路径。", "summary_source": "deepseek", "authors": [{"name": "Tina Oberoi"}, {"name": "Joshua Viszlai"}, {"name": "Frederic T. Chong"}], "featured_authors": [{"name": "Tina Oberoi"}, {"name": "Joshua Viszlai"}, {"name": "Frederic T. Chong"}], "author_count": 3}, {"id": "2605.01253", "category": "quant-ph", "title": "Evaluating quantum circuits in the reservoir computing paradigm", "abstract": "Reservoir computing is a framework which is primarily used for temporal information processing, using the intrinsic dynamics of an underlying physical system. The framework, in a quantum setup, is implemented using ergodic dynamics associated with Hamiltonian models. The computational power of the reservoir is closely tied to this underlying dynamical nature, and to probe this further, we study the effectiveness of a reservoir that is made using structured brickwall circuits built from two-qubit gates. Here, the global ergodic nature of the circuit model results from the said arrangement, which has an important role in extracting useful performance with a minimal setup that is independent of an associated Hamiltonian. We focus on the nature of the gates used in this setup and evaluate the resulting reservoir performance, correlating the same with known results on the dynamical nature of the circuit in question. As a baseline, we analyse brickwall circuits composed of Haar-random two-qubit gates, before moving on to dual-unitaries, where tunable ergodic properties allow us to systematically investigate its relationship with reservoir performance. We further consider a class of non-random two-qubit gates obeying a specific solvability condition, wherein the associated dynamics surpasses the equivalent circuit made up of two qubit Haar random unitaries in terms of randomness. Finally, we consider examples of Krylov space analytics, which allow for a reliable prediction of effective circuit reservoirs for sufficient task performance. Using the introduced metrics we validate the reservoir for time-series prediction using standard synthetic data sets to evaluate the fading memory capacity and accuracy for prediction tasks. Our results indicate that structured quantum circuits would serve as effective models that yield better and efficient task performance in reservoir computing applications.", "url": "https://arxiv.org/abs/2605.01253", "type": "理论+数值", "summary": "1. 该工作系统评估了由两比特门构建的结构化砖墙电路在量子储层计算框架中的性能。\n2. 其核心卖点在于利用双幺正门等可调遍历性质，定量关联电路动力学与储层计算能力，并引入Krylov空间分析实现有效储层的可靠预测。\n3. 这为设计超越Haar随机门的高效量子储层模型提供了明确指导，并在时间序列预测中验证了结构化电路的优越性。", "summary_source": "deepseek", "authors": [{"name": "Gaurav Rudra Malik"}, {"name": "Amit Kumar Jaiswal"}, {"name": "S. Aravinda"}, {"name": "Sunil Kumar Mishra"}], "featured_authors": [{"name": "Gaurav Rudra Malik"}, {"name": "Amit Kumar Jaiswal"}, {"name": "S. Aravinda"}, {"name": "Sunil Kumar Mishra"}], "author_count": 4}, {"id": "2605.01319", "category": "quant-ph", "title": "Barren Plateaus as Destructive Interference: A Diagnostic Framework and Implications for Structured Ansatzes", "abstract": "Barren plateaus (BPs) are usually described by the exponential suppression of gradient variance, but the mechanism by which gradient signal disappears remains unclear. We show that this phenomenon can be understood as destructive interference among termwise gradient contributions. To make this perspective operational, we introduce a diagnostic framework based on the cancellation ratio $R_k$, the effective term count $N_{\\mathrm{eff},k}$, and the interference-quality measure $B_{\\mathrm{eff},k}=R_k\\sqrt{N_{\\mathrm{eff},k}}$. Under a random-sign model, $B_{\\mathrm{eff},k}$ remains near a stable baseline, defining a random-sign cancellation regime. For the transverse-field Ising model (TFIM), we find that the hardware-efficient ansatz (HEA) remains close to this regime across system sizes and depths, whereas the Hamiltonian variational ansatz (HVA) systematically escapes it. In particular, HVA exhibits larger $B_{\\mathrm{eff},k}$ not merely because $N_{\\mathrm{eff},k}$ is larger, but because $R_k$ also remains systematically larger despite the broader term participation. This pattern indicates improved sign organization rather than simple term suppression. We further establish an exact identity that connects the proposed interference diagnostics directly to the standard variance-based theory of BPs. These results position destructive interference as a mechanistic interpretation of BP-like behavior in the regimes studied here, but they do not imply that BPs and destructive interference are universally interchangeable across all architectures and settings.", "url": "https://arxiv.org/abs/2605.01319", "type": "理论+数值", "summary": "1. 该工作将变分量子算法中的贫瘠高原现象归因为梯度项间的破坏性干涉，并基于抵消比、有效项数和干涉质量参量构建了诊断框架。\n2. 在横场伊辛模型上，其核心卖点是揭示哈密顿变分拟设通过维持较大抵消比和有效项数实现符号有序化，从而系统逃离随机抵消区域，而硬件高效拟设始终受困于此。\n3. 该干涉诊断与标准方差理论间的精确恒等式为贫瘠高原的机制性理解提供了解析纽带，并对设计结构化拟设以缓解梯度消失具有直接指导意义。", "summary_source": "deepseek", "authors": [{"name": "Pilsung Kang"}], "featured_authors": [{"name": "Pilsung Kang"}], "author_count": 1}, {"id": "2605.01411", "category": "quant-ph", "title": "Quantum jump trajectories, hybrid systems, non-Hermitian evolutions, quantum/classical walks", "abstract": "Quantum stochastic master equations of jump type are formulated in a general way and connections with quantum/classical hybrid systems and quantum filtering theory are discussed. By introducing the notion of ``typical trajectory\", we show how to recursively construct the solution of the non-linear stochastic master equation (the conditional state). Moreover, by the notion of ``exclusive probability densities\" we can describe all the probabilities related to the jumps, in particular, the waiting times of the jumps and their probability distributions. This general formulation and the idea of hybrid system allow to unify and generalize different fields: evolutions under non-Hermitian Hamiltonians, unitary dynamics interspersed by quantum channels at random times, quantum renewal processes, continuous time open quantum walks, Lindblad rate equation, ...", "url": "https://arxiv.org/abs/2605.01411", "type": "理论", "summary": "1. 该工作建立了跳跃型量子随机主方程的一般框架，并讨论了其与量子/经典混合系统及量子滤波理论的联系。\n2. 其技术卖点在于引入“典型轨迹”概念递归构造条件态的解，以及用“独占概率密度”全面描述跳跃等待时间等概率分布。\n3. 这为统一和推广非厄米哈密顿量演化、随机量子信道、量子更新过程及连续时间开放量子行走等多个领域提供了通用框架与启发。", "summary_source": "deepseek", "authors": [{"name": "Alberto Barchielli"}], "featured_authors": [{"name": "Alberto Barchielli"}], "author_count": 1}, {"id": "2605.01433", "category": "quant-ph", "title": "Online Estimation of Partial Transpose Moments via Fast Classical Updates", "abstract": "Partial-transpose (PT) moments are among the most practically relevant nonlinear quantities accessible from local Pauli classical shadows, because they directly underpin mixed-state entanglement certification and recent PT-moment-based phase diagnostics. The online framework of Marso \\emph{et al.} rewrote the exact PT-moment statistic into a fixed-memory recurrence that updates a small collection of accumulated matrices after each new shadow snapshot. Its update cost is independent of the shot number, but each step treats the incoming partially transposed snapshot as a generic dense matrix. Therefore, the arithmetic cost scales cubically with the dimension of the Hilbert space. We show that the same estimator can be updated exactly in subcubic time per shot while retaining the same memory. The key point is that the accumulated matrices become dense, but the fresh partially transposed snapshot still factorizes into local factors. Right-multiplication by that factorized snapshot can therefore be executed by exact column-pair sweeps. For the second PT moment, we further optimize the process by utilizing a Pauli basis update.", "url": "https://arxiv.org/abs/2605.01433", "type": "理论+数值", "summary": "1. 该工作提出了一种在线估计部分转置矩的方法，通过快速经典更新实现每个阴影快照的子立方时间精确更新。\n2. 其技术核心在于利用部分转置快照的局域因子化结构，通过精确列对扫描执行右乘，并针对第二矩进一步采用泡利基优化。\n3. 这为大规模量子态纠缠认证及基于部分转置矩的相诊断提供了可扩展的在线计算方案。", "summary_source": "deepseek", "authors": [{"name": "Hyunho Cha"}, {"name": "Jungwoo Lee"}], "featured_authors": [{"name": "Hyunho Cha"}, {"name": "Jungwoo Lee"}], "author_count": 2}, {"id": "2605.01551", "category": "quant-ph", "title": "Cavity-mediated localization and collective electron correlation phases", "abstract": "Collective strong coupling of molecular ensembles to optical cavities opens a route to modifying matter through genuinely collective electronic correlations. Yet even in the absence of a cavity, Coulomb correlations are notoriously difficult to describe, and cavity coupling adds transverse correlation channels extending over the entire molecular ensemble. Here we show that this seemingly intractable problem admits a controlled description by mapping the collective intermolecular electronic correlations to the analytically solvable spherical Sherrington-Kirkpatrick model. The resulting theory predicts two collective correlation phases, a paracorrelated phase and a spin-glass correlation phase, beyond the conventional uncorrelated molecular regime. These phases reveal an entropy-driven localization-delocalization mechanism that transfers molecular electronic states into collectively correlated cavity-dressed states. Our work establishes cavity-mediated electron correlations as a microscopic mechanism for emergent phases in strongly coupled molecular ensembles.", "url": "https://arxiv.org/abs/2605.01551", "type": "理论", "summary": "1. 该工作将分子系综集体强耦合到光学腔的电子关联问题映射为可解析求解的球形Sherrington-Kirkpatrick模型，预言了副关联相和自旋玻璃关联相两种集体关联相。\n2. 其核心物理在于揭示了熵驱动的局域化-去局域化机制，使分子电子态转变为集体关联的腔修饰态，从而超越传统无关联分子图像。\n3. 这为理解强耦合分子系综中腔介导电子关联导致的涌现相提供了微观理论框架，并启发了对腔控量子多体相的研究。", "summary_source": "deepseek", "authors": [{"name": "Dominik Sidler"}, {"name": "Michael Ruggenthaler"}, {"name": "Angel Rubio"}], "featured_authors": [{"name": "Dominik Sidler"}, {"name": "Michael Ruggenthaler"}, {"name": "Angel Rubio"}], "author_count": 3}, {"id": "2605.01585", "category": "quant-ph", "title": "From Qubit to Qubit: A Graduate Course in Quantum Mechanics", "abstract": "This textbook is drawn from notes for a two-semester graduate course in quantum mechanics. It begins with the most constrained quantum system, and recovers the rest of the subject by relaxing those constraints one at a time. The starting point is a single qubit, the smallest nontrivial Hilbert space with the strongest possible restriction on its dynamics, made concrete by a Bloch cube whose six faces are the cardinal states of a spin-1/2 system. Tensor products admit many qubits; lattices give them a place to live; time evolution sets them in motion; the continuum limit produces wavefunctions; three-dimensional angular momentum, the hydrogen atom, and perturbation theory follow; Lorentz invariance promotes the lattice of spinors to the Dirac equation; and the renormalization group asks how theories at different scales relate. Each chapter loosens one feature of the qubit while keeping the others fixed, so that the standard apparatus of graduate quantum mechanics arrives as a sequence of controlled generalizations rather than as separate topics. Discrete-to-continuous transitions recur at four scales: in Hilbert-space dimension, in real space, in time, and in coupling. The book closes by reimposing one of the original constraints, returning to a two-level system that is now a logical qubit protected by quantum error correction, with the fault-tolerance threshold appearing as an unstable RG fixed point and supplying the reason a logical qubit, independent of its underlying hardware, can exist at all.", "url": "https://arxiv.org/abs/2605.01585", "type": "理论", "summary": "1. 该工作将量子力学研究生课程重新组织为从单量子比特出发、通过逐步放松约束系统恢复标准内容的统一框架。\n2. 其技术核心在于揭示离散-连续过渡在希尔伯特空间维数、实空间、时间与耦合四个尺度上的重现，并以容错阈值作为不稳定重整化群不动点。\n3. 这为量子力学教学提供了逻辑自洽的演绎路线，并启发逻辑量子比特独立于硬件平台存在的深层物理根源。", "summary_source": "deepseek", "authors": [{"name": "Jeremy Levy"}], "featured_authors": [{"name": "Jeremy Levy"}], "author_count": 1}, {"id": "2605.01723", "category": "quant-ph", "title": "Mpemba Effect in Parametrically Driven Coupled Oscillators under White and Colored Noise", "abstract": "We study the Mpemba effect in a pair of linearly coupled harmonic oscillators, one of which is parametrically driven and coupled to an independent thermal bath. Using the covariance-matrix formalism, we derive the relaxation dynamics under both Gaussian white noise and Lorentzian colored noise, including single-channel and dual-channel noise embedding. We characterize relaxation through the Frobenius distance to the steady state and through the projection onto the slowest mode of the dynamical generator. Our results show that parametric driving provides the primary control knob for anomalous relaxation: as the drive approaches the stability boundary, the Mpemba crossing time decreases systematically. Colored noise further enhances the effect, with dual-oscillator Lorentzian noise producing a stronger reduction in the crossing time than single-oscillator noise and enlarging the parameter region where the Mpemba effect occurs. Nevertheless, the slow-mode structure of the drift matrix remains the dominant mechanism, while the influence of colored noise is secondary and mainly quantitative. We show that the Mpemba crossing time decreases as the system approaches the parametric stability boundary and that Lorentzian colored noise enlarges the region in the parametric and coupling strength plane where the Mpemba effect is observed.", "url": "https://arxiv.org/abs/2605.01723", "type": "理论", "summary": "1. 该工作研究一对线性耦合谐波振荡器中一个受参量驱动并与独立热浴耦合时，在白噪声和洛伦兹色噪声下的Mpemba效应。\n2. 其技术卖点在于揭示参量驱动接近稳定性边界是缩短Mpemba交叉时间的主控旋钮，而双振子洛伦兹色噪声可进一步增强效应并扩大参数区域。\n3. 这为在非平衡系统中通过调节驱动和噪声着色来操控反常弛豫提供了明确途径，启发在复杂多体平台中实验验证该机制。", "summary_source": "deepseek", "authors": [{"name": "Aref Pahlevani"}, {"name": "Morteza Rafiee"}, {"name": "Mehdi Ansari-rad"}], "featured_authors": [{"name": "Aref Pahlevani"}, {"name": "Morteza Rafiee"}, {"name": "Mehdi Ansari-rad"}], "author_count": 3}, {"id": "2605.01728", "category": "quant-ph", "title": "Statistics of Marginal Wavefunctions as a Real-Space Diagnostic of Quantum Entanglement", "abstract": "We present a statistical framework for extracting spatially resolved entanglement directly from an ensemble of marginal (one-body) wavefunctions in Time-Dependent Quantum Monte Carlo (TDQMC). Treating the guide waves as a statistical mixture in Hilbert space, we show that the Gram matrix acts as a covariance operator whose spectrum coincides with the Schmidt spectrum. The associated functional standard deviation closely tracks the von Neumann entanglement entropy both globally and locally via walker partitioning, providing a physically transparent real-space diagnostic of quantum correlations without requiring construction of the full many-body wavefunction. Applications to one-dimensional two-electron bosonic and fermionic systems (helium atom and hydrogen-like molecule) demonstrate excellent agreement with strict conditional-wave results for opposite-spin electrons. For same-spin fermions, TDQMC statistical treatment of exchange symmetry yields positive, physically consistent local entropies. The method establishes a direct bridge between classical ensemble statistics and quantum entanglement measures, offering a computationally efficient real-space diagnostic tool for mapping the spatial distribution of correlations.", "url": "https://arxiv.org/abs/2605.01728", "type": "理论+数值", "summary": "1. 该工作提出从时间依赖量子蒙特卡洛(TDQMC)的边际波函数系综中提取空间分辨纠缠的统计框架。\n2. 其核心在于证明Gram矩阵作为协方差算子，其谱与Schmidt谱一致，且函数标准差可全局和局域地追踪von Neumann熵，无需构造完整多体波函数。\n3. 这建立了经典系综统计与量子纠缠测量的直接桥梁，为玻色子和费米子体系提供了高效实空间诊断以映射相关性的空间分布。", "summary_source": "deepseek", "authors": [{"name": "Ivan P. Christov"}], "featured_authors": [{"name": "Ivan P. Christov"}], "author_count": 1}, {"id": "2605.01832", "category": "quant-ph", "title": "Tight Entropic Uncertainty Relations", "abstract": "Entropic uncertainty relations $H(A)+H(B)\\geqslant \\gamma$ give a nonzero lower bound $\\gamma$ to the sum of the Shannon entropies $H$ of the outcome probabilities of incompatible observables $A$ and $B$. They are better than the variance-based uncertainty relations because they only depend on the Born statistics of the outcomes and not on the outcomes themselves, and because bounds $\\gamma$ typically are state independent. Here we provide a state-independent lower bound $\\gamma_s$ that is better than the textbook Maassen-Uffink bound and, in the limit of the parameter $s\\to 2$, becomes asymptotically tight for all $A,B$. The bound can be extended to Renyi entropies.", "url": "https://arxiv.org/abs/2605.01832", "type": "理论", "summary": "1. 该工作导出了一个改进的态无关熵不确定关系下界γ_s，优于经典Maassen-Uffink界。\n2. 其关键优势在于下界在s→2参数极限下对任意非对易观测量A、B渐近紧致，且可推广至Rényi熵。\n3. 这为量子信息中不确定关系的紧致性研究提供了普适工具，并可能推动纠缠检测等应用。", "summary_source": "deepseek", "authors": [{"name": "Alberto Riccardi"}, {"name": "Lorenzo Maccone"}], "featured_authors": [{"name": "Alberto Riccardi"}, {"name": "Lorenzo Maccone"}], "author_count": 2}, {"id": "2605.01912", "category": "quant-ph", "title": "Quantum-enhanced sensing from the interplay of long-range interactions and non-Hermiticity", "abstract": "Long-range (LR) quantum spin systems offer promising advantages for quantum information processing and sensing. Here, we investigate parameter estimation in an long-range XX spin model coupled to a reservoir, which gives rise to an effective long-range RT-symmetric non-Hermitian iXY Hamiltonian. The interactions extend up to a tunable coordination range and decay algebraically with distance, enabling a direct comparison between long-range and short-range (SR) regimes. Focusing on the estimation of the transverse magnetic field and anisotropy parameter, we initialize the system in a fully polarized state and analyze the resulting dynamical quantum Fisher information (QFI). We show that, with suitable tuning of the system parameters, both the time and system-size scaling of the QFI are enhanced in the LR regime relative to their SR counterparts. Moreover, the non-Hermitian LR model can exhibit superior dynamical QFI compared with the corresponding Hermitian model, demonstrating a genuine metrological advantage induced by the interplay of long-range interactions and non-Hermitian effects. In contrast, we establish a no-go result at the critical magnetic field: when the probe is prepared in the lowest-energy eigenstate, the QFI scaling remains identical for the Hermitian and non-Hermitian cases.", "url": "https://arxiv.org/abs/2605.01912", "type": "理论", "summary": "1. 该工作研究了长程XX自旋模型与库耦合产生的有效长程PT对称非厄米iXY哈密顿量下的参数估计问题。\n2. 其核心在于揭示长程相互作用与非厄米性协同可增强动态量子Fisher信息在时间和系统尺寸上的标度，超越短程及对应厄米模型。\n3. 这为利用长程非厄米量子系统实现实际计量优势提供了明确方向，并在临界磁场处建立了厄米与非厄米情况下量子Fisher信息标度相同的no-go结果。", "summary_source": "deepseek", "authors": [{"name": "Keshav Das Agarwal"}, {"name": "Tanoy Kanti Konar"}, {"name": "Leela Ganesh Chandra Lakkaraju"}, {"name": "Aditi Sen De"}], "featured_authors": [{"name": "Keshav Das Agarwal"}, {"name": "Tanoy Kanti Konar"}, {"name": "Leela Ganesh Chandra Lakkaraju"}, {"name": "Aditi Sen De"}], "author_count": 4}, {"id": "2605.01932", "category": "quant-ph", "title": "Expectation Pauli-Lubanski vector and intrinsic angular momentum of relativistic wavepackets", "abstract": "In non-relativistic mechanics, the total (orbital) angular momentum (AM) of a spatially-distributed system can be decomposed into intrinsic and extrinsic contributions. In relativistic quantum mechanics, intrinsic AM is typically associated with spin, which can be described using the Pauli-Lubanski four-vector. Here, we develop a unified formalism that combines the main features of both approaches and describes the intrinsic AM of a relativistic wavepacket, including both spin and orbital contributions. Our approach is based on the \"expectation Pauli-Lubanski vector\" constructed from the expectation values of the wavepacket's momentum and AM. Equivalently, it defines the intrinsic AM relative to the wavepacket's energy centroid. In contrast to the conventional Pauli-Lubanski formalism, the zero-mass singularity does not occur for the expectation Pauli-Lubanski vector. Consequently, the intrinsic AM of a wavepacket may have an arbitrary orientation with respect to its momentum, even for massless particles. We illustrate the general theory with a number of examples of relativistic wave beams and packets carrying spin and orbital AM.", "url": "https://arxiv.org/abs/2605.01932", "type": "理论", "summary": "1. 该工作基于期望Pauli-Lubanski矢量构建了一个统一形式，用于描述相对论波包的内禀角动量，涵盖自旋与轨道贡献。\n2. 其技术核心在于该形式避免了传统Pauli-Lubanski形式中的零质量奇异性，使得无质量波包的内禀角动量方向可与动量任意取向。\n3. 这为统一描述有质量及无质量粒子内禀角动量的相对论波束与波包提供了自洽理论框架。", "summary_source": "deepseek", "authors": [{"name": "Konstantin Y. Bliokh"}], "featured_authors": [{"name": "Konstantin Y. Bliokh"}], "author_count": 1}, {"id": "2605.01953", "category": "quant-ph", "title": "Schur States, Average Mixing, and Counting Trees on Line Graphs' CTQW", "abstract": "We introduce a family of complex-valued edge weights on a finite simple graph $\\G$ arising from a continuous-time quantum walk on the line graph $\\ell\\G$, packaged as the \\emph{Schur state}: an $n \\times n$ Hermitian matrix encoding the amplitudes of an edge-state walk. The entrywise modulus square induces a real-weighted adjacency matrix $A(e)$ and Laplacian $L(e)$, and time-averaging yields a weighted graph whose spanning-tree count we relate to that of $\\G$. Our main result is \\[ tn\\!\\left(\\G, \\tfrac{1}{m}\\right) = \\frac{1}{m^{n-1}}\\, tn(\\G), \\] valid whenever the initial edge state is \\emph{uniform commutative}, where $n=|V\\G|$, $m=|E\\G|$, and $tn(\\G, w)$ denotes the weighted spanning-tree count. We further identify a structural mechanism -- the $-2$ eigenspace of $\\ell\\G$ -- providing uniform commutative states beyond the regular case, in particular for line graphs of Eulerian graphs with an even number of edges. As a side result, we establish that commutative states are precisely the states whose von Neumann entropy is preserved under average mixing.", "url": "https://arxiv.org/abs/2605.01953", "type": "理论", "summary": "1. 该工作在线图上引入连续时间量子行走的Schur态，其模平方诱导加权邻接矩阵与拉普拉斯，并导出均匀交换初始边态下时间平均加权图生成树计数与原图成m^{1-n}比例的主要结果。\n2. 技术关键是揭示线图的-2特征空间提供超越正则情形的均匀交换态，并证明交换态恰为von Neumann熵在平均混合下保持不变的充要条件。\n3. 这为连续时间量子行走中平均混合与图拓扑关联提供代数刻画，有望启发对一般图类上量子态混合行为与结构对称性的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Musung Kang"}], "featured_authors": [{"name": "Musung Kang"}], "author_count": 1}, {"id": "2605.01974", "category": "quant-ph", "title": "On the Distortion of Partitioning Performance by Random Quantum Circuits", "abstract": "Hypergraph partitioning is a central component of distributed quantum computing (DQC) compilers. However, due to the limited size of available quantum benchmark suites, many partitioning studies rely on random quantum circuits as evaluation workloads. In this work, we investigate whether such benchmarking practices provide a faithful assessment of partitioner performance. We evaluate a diverse set of state-of-the-art hypergraph partitioning strategies across three circuit origins: real algorithmic circuits, structured generated circuits, and fully random circuits. Our results show that random circuits significantly distort partitioning evaluation. They inflate cut costs, alter scaling trends across QPU counts and circuit sizes, and change the relative ranking of partitioning strategies. In contrast, structured generated circuits exhibit substantially lower distortion, more closely approximating real workload behaviour in cost, scaling, and strategy rankings. These findings demonstrate that benchmark selection directly influences methodological conclusions in DQC research and that random circuits may provide misleading guidance for compiler design.", "url": "https://arxiv.org/abs/2605.01974", "type": "理论+数值", "summary": "1. 该工作围绕分布式量子计算编译器中超图划分基准依赖随机电路的问题，系统对比了真实算法电路、结构化生成电路与完全随机电路上多种代表性超图划分策略在切割成本、跨量子处理单元数目与电路规模的性能缩放以及策略相对排名三方面的表现，以评估随机基准的保真度。\n2. 其关键贡献在于通过大量对比实验揭示出随机电路在切割成本、缩放行为和策略排名三个维度均引入系统性显著扭曲，而结构化生成电路能以接近真实工作负载的保真度产生评估结果，为划分性能测试提供了更为可靠的替代基准。\n3. 这一发现明确表明基准选择对分布式量子计算编译器方法论结论具有决定性影响，依赖随机电路可能误导编译器设计方向，为可扩展量子计算系统的编译优化与资源分配策略提供了必须采用结构化或真实电路基准的重要实证基础。", "summary_source": "deepseek", "authors": [{"name": "Maria Gragera Garces"}], "featured_authors": [{"name": "Maria Gragera Garces"}], "author_count": 1}, {"id": "2605.02051", "category": "quant-ph", "title": "Sub-Cubic Quantum Gate Synthesis via Stochastic Commutator Decomposition", "abstract": "We present Stochastic Commutator Synthesis, a hybrid quantum gate compilation framework that integrates Kuperberg's sub-cubic Solovay-Kitaev exponent c near 1.44042 with the error-tailoring machinery of randomized compilation. Classical Solovay-Kitaev implementations produce known word lengths and accumulate coherent approximation errors that degrade fault-tolerant threshold estimates. Kuperberg's 2023-2025 result reduces this via doubly exponential convergence and higher-order commutator decompositions. SCS augments this geometric backbone with a Gibbs-sampled stochastic choice of commutator factors at each recursion level, converting coherent synthesis residuals into incoherent, Pauli-twirl-compatible noise -- a property exploited by RC. Combined with RL-guided pre-synthesis, SCS achieves consistent T-count reductions of 10-25 percent and demonstrates fidelity gains of up to 35 percent on multi-fold Forrelation circuits on trapped-ion hardware such as Sandia QSCOUT. We situate SCS within the complexity-theoretic landscape established by the Raz-Tal oracle separation, arguing that low-error, noise-robust compilation of Forrelation-type circuits constitutes a practical pathway toward demonstrating this separation on physical hardware.", "url": "https://arxiv.org/abs/2605.02051", "type": "理论", "summary": "1. 该工作提出了随机交换子合成框架，融合Kuperberg次立方Solovay-Kitaev指数与随机编译，实现次立方量子门编译。\n2. 其卖点在于通过吉布斯采样的随机交换子因子选择，将相干合成残差转化为泡利扭转兼容的非相干噪声，结合强化学习预合成可减少10–25% T门数并提升保真度达35%。\n3. 这为利用低误差、噪声鲁棒的Forrelation电路编译在物理硬件上展示Raz-Tal oracle分离提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Yevgen Kotukh"}], "featured_authors": [{"name": "Yevgen Kotukh"}], "author_count": 1}, {"id": "2605.02066", "category": "quant-ph", "title": "Accelerating Noisy Variational Quantum Algorithms with Physics-Informed Denoising Networks", "abstract": "Variational quantum algorithms are promising for near-term quantum computing, but are severely limited by hardware noise and the substantial circuit overhead required for error mitigation methods such as Zero-Noise Extrapolation (ZNE). We propose a Physics-Informed Denoising Network (PIDN) that reduces the cost of ZNE by learning a surrogate model of its optimization dynamics. By viewing the variational update as a trajectory in the parameter space, PIDN is trained to reproduce ZNE-mitigated expectation values and gradient directions while incorporating a physics-informed loss that preserves the gradient descent dynamics. Once trained, PIDN replaces repeated multi-noise evaluations with denoised expectation and gradient estimation directly from the current noisy observation and the historical trajectory, significantly reducing circuit executions. We benchmark the approach on the quantum approximate optimization algorithm for 3-regular graphs, Sherrington-Kirkpatrick, and transverse-field Ising models, as well as the variational quantum eigensolver for LiH, BeH$_2$ and H$_2$O. Across all tasks, PIDN attains performance comparable to ZNE, while reducing the number of circuit executions by a factor of approximately 4 to 6. Gradient cosine similarity with ZNE remains above 0.95 throughout training. Robustness analysis shows that PIDN fails only when ZNE itself becomes unreliable, and ablation studies confirm the necessity of the physics-informed loss for maintaining directional consistency. We further find that PIDN tracks optimization dynamics most accurately when the effective loss landscape retains strong low-frequency structure. These results establish PIDN as a scalable, resource-efficient strategy for noise-resilient variational optimization in the noisy intermediate-scale quantum regime.", "url": "https://arxiv.org/abs/2605.02066", "type": "理论+数值", "summary": "1. 该工作提出物理信息去噪网络(PIDN)，通过学习零噪声外推的优化动力学替代多噪声评估，以降低变分量子算法的电路开销。\n2. 其核心在于引入物理信息损失函数保持梯度下降动力学，使网络能直接从当前噪声观测和历史轨迹估计去噪期望值与梯度方向。\n3. 这为噪声中等规模量子计算中变分优化提供了一种可扩展的资源高效策略，尤其当有效损失景观保持强低频结构时效果最佳。", "summary_source": "deepseek", "authors": [{"name": "Jie Liu"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "Jie Liu"}, {"name": "Xin Wang"}], "author_count": 2}, {"id": "2605.02097", "category": "quant-ph", "title": "Separability from Multipartite Measures", "abstract": "We show that the third-order negativity provides a necessary and sufficient criterion for full separability of tripartite pure states, and extend this to mixed states beyond bipartite diagnostics such as negativity. As a minimal nontrivial example, a four-qubit pure state has three-qubit mixed reductions; its complete characterization requires six bipartite, eight tripartite, and four quadripartite measures, with the third-order negativity serving as a key separability criterion. We further generalize these separability criteria to multipartite qudit systems and discuss an application to conformal field theory.", "url": "https://arxiv.org/abs/2605.02097", "type": "理论", "summary": "1. 该工作证明三阶负性为三体纯态全可分性的充要判据，并扩展至混合态及多部分量子系统。\n2. 其技术要点在于：对四比特纯态的三比特约化态，需六组二分、八组三分及四组四分度量协同表征，而三阶负性充当关键判据。\n3. 这为多体纠缠分类及共形场论中非局域关联的刻画提供了可推广的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Chen-Te Ma"}, {"name": "Ma-Ke Yuan"}], "featured_authors": [{"name": "Chen-Te Ma"}, {"name": "Ma-Ke Yuan"}], "author_count": 2}, {"id": "2605.02203", "category": "quant-ph", "title": "Operational interpretation of the reverse sandwiched Renyi divergences in composite quantum hypothesis testing", "abstract": "We study the Hoeffding regime of composite quantum hypothesis testing, in which each hypothesis is specified by a sequence of sets of quantum states. We establish quantum Hoeffding bounds under a set of structural assumptions, orthogonal to those of our previous framework. A notable consequence is the direct operational interpretation of the reverse sandwiched Renyi divergence for $\\alpha \\in (0,1)$: for the task of discriminating a thermal equilibrium state from a probe state subject to unknown dephasing in the energy eigenbasis, with free Hamiltonian evolution as a special case, the optimal Hoeffding exponent is given exactly by this divergence evaluated on a single copy of the system. The same task in the Stein regime is governed by the reverse quantum relative entropy, providing its operational interpretation as well. This behavior contrasts both with the simple independent and identically distributed (i.i.d.) setting, where the Petz Renyi divergence and the Umegaki relative entropy govern the Hoeffding and Stein exponents, respectively, and with many composite settings, where only regularized many-copy formulas are available. This finding reveals that passing from simple to composite hypotheses can fundamentally change which quantum divergence determines the operational limits of discrimination, and suggests a new avenue for seeking operational interpretations of quantum divergences by lifting simple hypotheses to richer composite scenarios.", "url": "https://arxiv.org/abs/2605.02203", "type": "理论+数值", "summary": "1. 该工作研究了复合量子假设检验的Hoeffding regime，在结构假设下建立了量子Hoeffding界。\n2. 其卖点在于为α∈(0,1)的反向夹心Renyi散度给出了直接操作解释：区分热平衡态与能量本征基中未知退相干的探针态时，最优Hoeffding指数由单副本该散度精确给出，且Stein regime下的反向相对熵也获得类似解释。\n3. 这揭示了从简单到复合假设的转变可根本上改变决定鉴别极限的量子散度，为通过构建更丰富的复合场景寻求量子散度的操作解释开辟了新方向。", "summary_source": "deepseek", "authors": [{"name": "Masahito Hayashi"}, {"name": "Kun Fang"}], "featured_authors": [{"name": "Masahito Hayashi"}, {"name": "Kun Fang"}], "author_count": 2}, {"id": "2605.02211", "category": "quant-ph", "title": "Many Hamiltonians Are Sparsifiable", "abstract": "We study the problem of Hamiltonian sparsification: given a parameter $\\varepsilon \\in (0,1)$ and an $n$-qubit Hamiltonian $H$ which is the sum of $r$-local positive semi-definite (PSD) terms $H_1, \\dots H_m$, our goal is to compute a sparse set $L \\subseteq [m]$, along with weights $w: L \\rightarrow \\mathbb{R}_{\\geq 0}$ such that for every state $|\\psi\\rangle\\in \\mathbb{C}^{2^n}$, $$ \\sum_{i \\in L} w(i) \\langle \\psi | H_i | \\psi \\rangle \\in (1 \\pm \\epsilon) \\sum_{i = 1}^m \\langle \\psi | H_i | \\psi \\rangle $$. When the set $L$ is significantly smaller than $m$, this reduces the number of terms in the underlying system, while still ensuring that the behavior of the system is essentially unchanged. We show that many Hamiltonians indeed are sparsifiable to a number of terms much smaller than $n^r$, including: (a) Hamiltonians where each term is an $r$-local Pauli string, (b) Hamiltonians where each term is an $r$-local random operator of rank $R$, for $R \\geq 2^{r-1}+1$, and (c) Hamiltonians where each term is an arbitrary $r$-local operator of rank $\\geq 2^r -1$ (a.k.a. Quantum SAT). Taken together, our results show that the sparsifiability of Hamiltonians is a robust phenomenon, contrary to prevailing belief (see for instance, Aharonov-Zhou ITCS 2019, QIP 2019). Our results find applications, for instance, to better (semi-)streaming algorithms for quantum Max-Cut, answering a question left open by Kallaugher and Parekh (FOCS 2022). In fact, our results even codify that quantum systems are often easier to sparsify than their classical counterparts.", "url": "https://arxiv.org/abs/2605.02211", "type": "理论+数值", "summary": "1. 该工作证明，对于任意由r-局域正半定项构成的n-量子比特哈密顿量，均可在保持所有量子态期望值的(1±ε)近似下稀疏化为远小于n^r个项。\n2. 其核心卖点在于利用项的正半定性与秩条件（如R≥2^{r-1}+1或2^r-1），通过加权子集选取实现保范逼近，涵盖了Pauli串、随机局域算符及量子SAT等广泛情形，驳斥了量子系统不易稀疏化的既有认知。\n3. 这为量子Max-Cut等问题的改进半流算法提供了直接工具，并揭示了量子系统在稀疏化上优于经典系统的内在特性，启发了高效量子算法设计的新思路。", "summary_source": "deepseek", "authors": [{"name": "Arpon Basu"}, {"name": "Joshua Brakensiek"}, {"name": "Aaron Putterman"}], "featured_authors": [{"name": "Arpon Basu"}, {"name": "Joshua Brakensiek"}, {"name": "Aaron Putterman"}], "author_count": 3}, {"id": "2605.02293", "category": "quant-ph", "title": "Description and error analysis of quantum alghorithms in the projection evolution model -- the Deutsch algorithm case", "abstract": "This work demonstrates that the Deutsch algorithm can be effectively modelled using a two-level harmonic oscillator within the second quantization formalism. By adopting this framework, evolution operators are derived. We present a projection evolution model that accurately characterizes the physical state transformation within quantum gates. This approach provides a systematic method for finding evolution operators, enabling the complete description and prediction of state evolution - including projection errors - in quantum algorithms.", "url": "https://arxiv.org/abs/2605.02293", "type": "理论+数值", "summary": "1. 该工作采用二次量子化框架中的两能级谐振子对Deutsch算法建模，并基于投影演化模型推导了量子门中的演化算符。\n2. 其技术卖点在于投影演化模型能够系统描述和预测包括投影误差在内的物理态演化全过程。\n3. 这为量子算法中演化算符的完整描述与误差分析提供了系统方法，可推广至其他算法案例。", "summary_source": "deepseek", "authors": [{"name": "Krzysztof Lider"}, {"name": "Marek Góźdź"}], "featured_authors": [{"name": "Krzysztof Lider"}, {"name": "Marek Góźdź"}], "author_count": 2}, {"id": "2605.02352", "category": "quant-ph", "title": "Geometric Quantum Physics Informed Neural Network", "abstract": "Quantum physics-informed neural networks (QPINNs) have recently emerged as a promising framework for the solution of partial differential equations (PDEs), with several studies reporting improved convergence and accuracy relative to classical physics-informed neural networks (PINNs) at reduced training cost. Motivated by these advances, we introduce geometric quantum physics-informed neural networks (GQPINNs), a symmetry-aware extension of QPINNs in which the geometric structure of the underlying PDE is incorporated directly into the quantum-circuit ansatz. Building on the framework of geometric quantum machine learning, we construct parametrized circuits that encode finite-group and compact Lie-group symmetries as inductive biases through problem-specific equivariant generator sets . Using a twirling-based construction, we derive symmetry-preserving gates that ensure that the model predictions respect the symmetries of the governing equation whenever the boundary and initial data are symmetry compatible. We benchmark GQPINNs against standard QPINNs and symmetry-adapted classical PINN baselines under matched training protocols across a representative set of linear and nonlinear PDEs. Across these benchmarks, GQPINNs achieve improved solution accuracy, as quantified by lower mean absolute error, while requiring substantially fewer trainable parameters. These results identify symmetry-aware quantum-circuit design as an effective route toward improved efficiency and generalization in quantum PDE solvers and provide a systematic framework for incorporating geometric inductive biases into quantum-enhanced scientific machine learning.", "url": "https://arxiv.org/abs/2605.02352", "type": "理论+数值", "summary": "1. 该工作提出了几何量子物理信息神经网络（GQPINNs），将偏微分方程的有限群与紧李群对称性作为归纳偏置直接嵌入量子电路拟设。\n2. 其技术核心在于利用twirling构造对称性保持门，使模型在对称相容边界条件下严格尊重控制方程的几何结构，从而以更少可训练参数实现更高求解精度。\n3. 这为量子增强科学机器学习中系统性融入几何归纳偏置提供了框架，并表明对称感知量子电路设计是提升量子PDE求解器效率与泛化能力的有前景路径。", "summary_source": "deepseek", "authors": [{"name": "Wai-Hong Tam"}, {"name": "Reza Safari"}, {"name": "Hiromichi Matsuyama"}], "featured_authors": [{"name": "Wai-Hong Tam"}, {"name": "Reza Safari"}, {"name": "Hiromichi Matsuyama"}], "author_count": 3}, {"id": "2605.02367", "category": "quant-ph", "title": "Quantum State Engineering Under Multiple Expectation-Value Constraints", "abstract": "This work introduces a formulation of quantum state engineering termed expectation-value targeting: the task of preparing a pure state whose expectation values with respect to a prescribed set of observables attain specified targets. This formulation subsumes standard ground-state preparation problems in quantum chemistry and many-body physics, while extending beyond variational energy minimization to multi-constraint state synthesis. The problem amounts to solving a system of nonlinear constraints on an exponentially large state space, for which no general efficient classical approaches are known. Variational quantum algorithms tackle this problem by restricting the search to a low-dimensional parameter space, and relying on classical optimization techniques for solutions. However, these approaches can become extremely ineffective for the present problem, where competing constraints can induce rugged landscapes and vanishing gradients (barren plateaus). Adaptive variational methods, in which the ansatz is constructed iteratively from a pool of candidate operators rather than fixed in advance, have been developed primarily for ground-state preparation. However, we show that the present problem also admits a similar construction. We introduce QUEST (Quantum Unitary Engineering of States to Target), a framework purpose-built for expectation-value targeting, in which the engineered state is constructed as a depth-adaptive sequence of Pauli rotations, with each rotation chosen to descend a sum-of-squared-residuals cost. QUEST provides a constructive route to expectation-value targeting, building the engineered state one Pauli rotation at a time, and establishes adaptive synthesis as a primitive for state preparation under multiple, potentially inconsistent target constraints.", "url": "https://arxiv.org/abs/2605.02367", "type": "理论+数值", "summary": "1. 该工作提出了期望值靶向量子态工程的形式化框架，旨在制备纯态使其在一组可观测量上达到指定期望值，涵盖基态制备与多约束态合成问题。\n2. 其技术核心是QUEST框架，通过自适应深度序列的Pauli旋转逐次构建量子态，并最小化残差平方和代价函数，从而规避变分方法中的贫瘠高原与崎岖势能面。\n3. 该工作为多约束态制备提供了可构造的迭代路径，将自适应合成确立为针对潜在不一致约束的通用原语，有望推广至量子化学与多体系统的态工程。", "summary_source": "deepseek", "authors": [{"name": "Anjali Mahapatra"}, {"name": "Gururaj Kadiri"}], "featured_authors": [{"name": "Anjali Mahapatra"}, {"name": "Gururaj Kadiri"}], "author_count": 2}, {"id": "2605.02385", "category": "quant-ph", "title": "Entanglement is Half the Story: Post-Selection vs. Partial Traces", "abstract": "While tensor networks have their traditional application in simulating quantum systems, in the recent decade they have gathered interest as machine learning models. We combine the experience from both fields and derive how quantum constraints placed on a tensor network manifest a change in capabilities. To this end, we employ a method of inference of classical tensor networks on a quantum computer to define a hybrid architecture. This hybrid tensor network is a practical unified framework for it's classical and quantum tensor network edge cases. We identify post-selection as the important property on which this interpolation hinges. The amount of post-selection corresponds to the level to which quantum constraints are enforced on the tensor network. On this basis, we propose a new hyperparameter which controls the transition between the hybrid and the quantum tensor network. In the comparison of classical and quantum tensor networks it complements the bond dimension. Quantum machine learning is improved by using the hyperparameter to allocate the practically limited post-selection to the quantum model in a trainable manner.", "url": "https://arxiv.org/abs/2605.02385", "type": "理论+数值", "summary": "1. 该工作将张量网络从量子模拟拓展至机器学习，通过量子计算机上的经典张量网络推断建立混合架构，并指出后选择是实现经典–量子插值的关键属性。\n2. 其核心在于提出与键维互补的新超参数，通过控制后选择程度调控量子约束的施加水平，从而统一经典与量子张量网络并实现两者间的平滑过渡。\n3. 这为量子机器学习提供了在训练中可分配有限后选择资源的实用框架，启发后续在混合模型中平衡纠缠与迹操作以优化性能。", "summary_source": "deepseek", "authors": [{"name": "Gustav J L Jäger"}, {"name": "Krzysztof Bieniasz"}, {"name": "Martin B Plenio"}, {"name": "Hans-Martin Rieser"}], "featured_authors": [{"name": "Gustav J L Jäger"}, {"name": "Krzysztof Bieniasz"}, {"name": "Martin B Plenio"}, {"name": "Hans-Martin Rieser"}], "author_count": 4}, {"id": "2605.02389", "category": "quant-ph", "title": "Rethinking How to Act: Action-Space Engineering for Reinforcement Learning-Based Circuit Routing in Distributed Quantum Systems", "abstract": "As it becomes increasingly difficult to monolithically scale a quantum processor, distributed quantum computing (DQC) offers an alternative by distributing qubits across multiple smaller interconnected quantum processor modules. In such an architecture, the challenge of quantum circuit compilation shifts from placing and routing qubits within one module to placing, routing and using the qubits efficiently across modules. In order to optimize circuit execution time, the right state-dependent networking decisions must be found, such as when and where to generate shared remote quantum states to support remote operations. Reinforcement learning (RL) provides a natural framework for this problem, generating a compilation policy that can generalize across different circuits. Building on the framework of Promponas et al. (2024), we introduce an agent that combines a novel action-space formulation with effective action-masking strategies. A comprehensive numerical comparison of the two approaches under different coupling constraints shows that our agent achieves improved training and inference performance with a relative reduction in the modeled execution time of up to 35\\%.", "url": "https://arxiv.org/abs/2605.02389", "type": "理论+数值", "summary": "1. 该工作针对分布式量子系统中的线路路由问题，基于强化学习框架提出了一种创新的动作空间设计方法。\n2. 其核心卖点在于通过动作遮蔽策略与动作空间工程，显著提升了训练与推理效率，并在多种耦合约束下实现最高35%的执行时间缩减。\n3. 这为分布式量子编译中动态网络决策的优化提供了可扩展的范式，有望推动大规模量子处理器互连的实用化进程。", "summary_source": "deepseek", "authors": [{"name": "Joost Van Veen"}, {"name": "Luise Prielinger"}, {"name": "Sebastian Feld"}], "featured_authors": [{"name": "Joost Van Veen"}, {"name": "Luise Prielinger"}, {"name": "Sebastian Feld"}], "author_count": 3}, {"id": "2605.02412", "category": "quant-ph", "title": "Perturbative Analysis of Dark State Dynamics in Weakly Anharmonic Photon-Emitter Pairs", "abstract": "Dark states are excited quantum states that decouple from their environment in such a way that they do not emit or absorb external photons. These states are found in a variety of different open quantum systems and can be derived from the collective interactions of individual quantum emitters interacting with one another. One of the simplest model where these states exist is in a pair of dissipatively coupled harmonic oscillators described under the Bose-Hubbard model. When on-site interactions are included, these states can no longer be classified as genuine dark states since dissipation is induced in them. In this paper we study the origin of this dissipation in dark states by using weak anharmonicity as a perturbing factor. In our analysis, we find the first and second order corrections to the wavefunction and apply these corrections to the master equation in order to track the dynamics.", "url": "https://arxiv.org/abs/2605.02412", "type": "理论", "summary": "1. 该工作对弱非谐性光子-发射体对中的暗态动力学进行微扰分析，研究了非谐性作为扰动因子如何诱导暗态耗散。\n2. 其核心在于通过计算波函数的一阶和二阶修正并应用于主方程，定量刻画了弱非谐性对暗态退耦合性质的破坏机制。\n3. 这为理解非谐性在开放量子系统中对暗态鲁棒性的影响提供了微扰框架，并可能启发相关量子信息存储与操控方案。", "summary_source": "deepseek", "authors": [{"name": "Christopher Campbell"}, {"name": "Matti Silveri"}], "featured_authors": [{"name": "Christopher Campbell"}, {"name": "Matti Silveri"}], "author_count": 2}, {"id": "2605.02465", "category": "quant-ph", "title": "Constraint Preserving XY-Mixers under Trotterized Adiabatic Evolution", "abstract": "Constraint handling is a central challenge for quantum algorithms applied to combinatorial optimization. Standard penalty-based approaches increase problem size, distort energy landscapes, and often degrade performance. Constraint-preserving mixers, such as XY-mixers, restrict quantum evolution to feasible subspaces, but their implementation on gate-based hardware requires Trotterization, which introduces approximation errors. In this work, we systematically investigate the interplay between constraint-preserving XY-mixers and Trotterized Adiabatic Evolution (TAE). We present a theoretical analyses of the origin and scaling of Trotter errors in XY-mixers and show that the dominant contribution depends on the size and structure of individual constraints rather than on the total problem size. Our findings are validated through extensive numerical simulations on three representative problems: Portfolio Optimization, the Multi-Car Paint Shop problem, and a Multi-Commodity Flow problem. For problems with a single global equality constraint spanning all variables, Trotter errors significantly impair XY-mixer performance, making standard Pauli-X mixers more robust under realistic implementations. In contrast, for problems whose constraints decompose into multiple disjoint local blocks, XY-mixers outperform X-mixers by several orders of magnitude even under Trotterized evolution. These results identify constraint locality as the key criterion for the effective use of XY-mixers and demonstrate that TAE combined with structure-aware mixer design provides a robust and theoretically grounded alternative to variational quantum optimization methods. We further present a dedicated mixer Hamiltonian for TSP-like 2-way-1-hot constraints.", "url": "https://arxiv.org/abs/2605.02465", "type": "理论+数值", "summary": "1. 本文系统研究了约束保持XY混合器在Trotter化绝热演化中的表现，通过理论分析与数值模拟揭示了Trotter误差的标度规律。\n2. 其核心发现是Trotter误差主导项取决于单个约束的尺寸与结构而非总问题规模，并基于约束局域性确立了XY混合器较Pauli-X混合器优势的关键判据。\n3. 这为面向组合优化的结构感知混合器设计提供了理论基石，并指明结合Trotter化绝热演化与局域约束分解可构建稳健的量子优化方案。", "summary_source": "deepseek", "authors": [{"name": "Abhishek Awasthi"}, {"name": "Maximilian Hess"}, {"name": "Salome Lomadze"}, {"name": "Francesco Bär"}, {"name": "Christian Biefel"}], "featured_authors": [{"name": "Abhishek Awasthi"}, {"name": "Maximilian Hess"}, {"name": "Salome Lomadze"}, {"name": "Francesco Bär"}, {"name": "Christian Biefel"}], "author_count": 5}, {"id": "2605.02498", "category": "quant-ph", "title": "Permutation Routing on Ramanujan Hypergraphs with Applications to Neutral Atom Quantum Architectures", "abstract": "We consider the routing of neutral atoms on a reconfigurable lattice in terms of hypergraph transformations. We prove the routing number of a Ramanujan $(d,r)$-regular hypergraph on $N$ vertices satisfies $\\mathrm{rt}(H) = \\Theta(\\log N)$, where routing is via matchings in the clique expansion graph $G_{\\mathrm{cl}}(H)$. Hypergraphs reframe the qubit routing problem by replacing Nenadov's two-sided spectral gap hypothesis with a one-sided condition based on eigenvalue centering. Song--Fan--Miao (SFM) coverings scale for Ramanujan families of every uniformity. A virtual overlay theorem establishes a capacity--depth tradeoff for 3D acousto-optic lens (AOL) architectures, with multi-layer stacking achieving $\\Theta(\\log N)$ routing with $L = O(\\log N)$ independent overlay layers. An abelian Alon--Boppana barrier shows that fixed-degree Cayley graphs on $\\mathbb{Z}_n^2$ cannot be Ramanujan and affine derandomization on such graphs achieves 15--30% congestion reduction. Towers of $k$-fold Ramanujan coverings yield $\\mathrm(H_L) = O(\\log N)$ by recursive routing lift. Entanglement-assisted routing by pre-distributed Bell pairs achieves $O(\\log N)$ teleportation depth with a stable crossover at $\\sim\\!4$ routing rounds. Displacement energy analyzes greedy adaptive routing, identifying stalling and a hybrid greedy--Valiant protocol achieving $\\sim\\!3\\times$ speedup at practical scales. Hierarchical multi-scale routing achieves $O(\\log^2 N / \\log b)$ depth with boundary-only transfers at capacity $k = O(\\sqrt{N} \\log N)$, and $O(\\log N)$ depth with optimal block size $b = \\Theta(\\sqrt{n})$.", "url": "https://arxiv.org/abs/2605.02498", "type": "理论", "summary": "1. 该工作通过超图变换将中性原子可重构晶格上的排列路由问题转化为谱图论分析，证明了Ramanujan (d,r)-正则超图在团展开图匹配下的路由数为Θ(log N)。\n2. 其核心卖点在于以单边谱条件取代传统双边谱假设，建立虚拟覆盖定理实现三维声光透镜架构的容量-深度最优权衡，并结合纠缠辅助路由与分层多尺度协议达到对数路由深度。\n3. 这为中大规模中性原子量子处理器提供了理论最优的路由框架，其谱方法可推广至其他可重构阵列架构，指导高效互联与量子网络设计。", "summary_source": "deepseek", "authors": [{"name": "Joshua M. Courtney"}], "featured_authors": [{"name": "Joshua M. Courtney"}], "author_count": 1}, {"id": "2605.02565", "category": "quant-ph", "title": "Sample-Based Quantum Diagonalization with Amplitude Amplification", "abstract": "Recently, sample-based quantum diagonalization (SQD) has emerged as a promising approach to compute ground and excited states of problem this http URL method classically diagonalizes a Hamiltonian in a subspace that is spanned by samples obtained from a quantum computer. However, by its nature, SQD suffers from a fundamental sampling problem, as some basis states that are required for a targeted accuracy may only be sampled extremely rarely. To alleviate this limitation, we introduce the SQD-AA algorithm that combines SQD with amplitude amplification (AA). SQD-AA uses AA to sequentially reduce probabilities of already measured bitstrings, thus making the observation of new ones more likely. We observe a reduction in the total query complexity of more than a factor 100 for algebraically and exponentially decaying model distributions, and analytically show a quadratic advantage for the latter. Moreover, we evaluate real molecules in an early fault-tolerant scenario and compare SQD-AA to SQD and iterative quantum phase estimation (iQPE). For all considered examples, we observe the lowest total number of T-gates for SQD-AA while only requiring circuits that are 3-4 orders of magnitude shallower than those needed for iQPE. Given this substantial reduction in circuit depth compared to iQPE while saving 2 orders of magnitude in total runtime compared to SQD, we expect a significant regime in early fault-tolerance where SQD-AA runs feasibly, but iQPE circuits are too deep to execute confidently.", "url": "https://arxiv.org/abs/2605.02565", "type": "理论+数值", "summary": "1. 该工作提出了SQD-AA算法，将基于样本的量子对角化与振幅放大相结合，以缓解稀有基态采样困难的问题。\n2. 其技术核心在于利用振幅放大顺序压制已观测比特串概率，对指数衰减模型实现二次查询复杂度优势，并在实际分子计算中较iQPE节省2–4个数量级的电路深度。\n3. 这为早期容错量子计算中平衡电路深度与总运行时间提供了可行方案，有望在iQPE电路过深而无法可靠执行的场景中率先实现实用化。", "summary_source": "deepseek", "authors": [{"name": "Nina Stockinger"}, {"name": "Ludwig Nützel"}, {"name": "Michael J. Hartmann"}], "featured_authors": [{"name": "Nina Stockinger"}, {"name": "Ludwig Nützel"}, {"name": "Michael J. Hartmann"}], "author_count": 3}, {"id": "2605.02571", "category": "quant-ph", "title": "Construction of Quantum Rank-Metric Codes Using Hermitian Orthogonality", "abstract": "Stacked quantum memory is an architecture in which multiple layers of qubits are stacked. Quantum rank-metric codes are effective for error correction in stacked quantum memories. However, the previously proposed quantum Gabidulin codes based on the CSS construction had a problem: due to algebraic constraints, the applicable memory layouts were strictly limited to square shapes of odd length. In this paper, we first propose a framework for constructing quantum rank-metric codes from classical linear codes with symplectic self-orthogonality. Building upon this, we propose a new construction method for quantum Gabidulin codes by combining the Hermitian self-orthogonality of classical Gabidulin codes--utilizing the self-dual basis that exists when the extension degree of the finite field is even--with the quantum code construction method using Hermitian orthogonality by Matsumoto and Uyematsu. The proposed method succeeds in approximately doubling the ratio of the minimum rank distance to the number of physical qubits while maintaining the code rate. Furthermore, it eliminates the restriction of the conventional method that requires the number of cells and layers of the stacked memory to be odd, realizing the construction of quantum rank-metric codes applicable to memories with an even number of cells and layers. This construction improves the relative error correction capability of the stacked quantum memory architecture and increases the degree of freedom in design while preserving the code rate.", "url": "https://arxiv.org/abs/2605.02571", "type": "理论", "summary": "1. 本文提出了基于经典Gabidulin码的Hermitian自正交性与自对偶基构造量子秩度量码的新方法，并解决了传统CSS构造仅适用于奇数尺寸方形存储器的限制。\n2. 其技术核心在于利用有限域扩展度为偶数时的自对偶基实现量子码的Hermitian正交构造，使最小秩距离与物理量子比特数的比值在保持码率下大约翻倍。\n3. 该工作为堆叠量子存储器提供了更灵活的设计维度与更强的相对纠错能力，并可推广至偶数量单元与层数的存储器架构。", "summary_source": "deepseek", "authors": [{"name": "Ryota Nizuka"}, {"name": "Ryutaroh Matsumoto"}], "featured_authors": [{"name": "Ryota Nizuka"}, {"name": "Ryutaroh Matsumoto"}], "author_count": 2}, {"id": "2605.02588", "category": "quant-ph", "title": "S-CAD: Selective Classical Advantage Distillation for Quantum Conference Key Agreement", "abstract": "Quantum conference key agreement (QCKA) protocols utilize GHZ states to establish shared group keys between multiple parties. While previous work has shown that standard Classical Advantage Distillation (CAD) protocols can sometimes benefit QCKA performance, it was unknown if past results were asymptotically tight. In this work, we design a new CAD protocol, \"Selective Classical Advantage Distillation (S-CAD)\", for QCKA, which generalizes prior QCKA+CAD work and allows the parties to selectively enable or disable CAD. We derive an asymptotic proof of security against general coherent attacks, which outperforms prior work. Finally, we evaluate in a variety of simulated star network topologies, showing when S-CAD can help, and when it is best to disable CAD entirely.", "url": "https://arxiv.org/abs/2605.02588", "type": "理论+数值", "summary": "1. 该工作提出选择性经典优势蒸馏(S-CAD)协议，用于量子会议密钥协商，允许各方灵活启用或禁用CAD。\n2. 其卖点在于针对一般相干攻击给出了渐近严格的安全证明，并揭示了在星型网络拓扑中CAD有效性的边界条件。\n3. 这为多用户量子密钥分发网络的协议优化与性能-安全性权衡分析提供了可操作的判据。", "summary_source": "deepseek", "authors": [{"name": "Trevor Thomas"}, {"name": "Walter O. Krawec"}, {"name": "Bing Wang"}], "featured_authors": [{"name": "Trevor Thomas"}, {"name": "Walter O. Krawec"}, {"name": "Bing Wang"}], "author_count": 3}, {"id": "2605.02621", "category": "quant-ph", "title": "Comment on `On computing quantum waves exactly from classical action'", "abstract": "A recent article by Lohmiller \\& Slotine (Proc.\\ R.\\ Soc.\\ A \\textbf{482}: 20250413) claims that the Schrödinger equation can be solved exactly using only classical least action and classical fluid density, asserting that this formulation avoids semiclassical approximations. We show that their mathematical derivation contains a foundational error. By neglecting the spatial derivatives of the probability density amplitude, the authors inadvertently omit the quantum potential -- the term originally identified by Madelung and later emphasised by Bohm. Consequently, their proposed equivalence is not exact but rather constitutes the standard semiclassical approximation. We further demonstrate that each of the paper's illustrative examples either belongs to a class where the quantum potential vanishes identically due to the geometry of the problem, or recovers the correct quantum result by importing quantum eigenfunctions through the initial conditions, thereby concealing the error.", "url": "https://arxiv.org/abs/2605.02621", "type": "理论+数值", "summary": "1. 该评论指出Lohmiller与Slotine声称仅用经典最小作用量和流体密度精确求解薛定谔方程的推导存在根本性错误。\n2. 其核心错误在于忽略了概率密度振幅的空间导数，从而实质上去除了Madelung量子势，导致所谓精确解退化为标准半经典近似。\n3. 此发现澄清了经典-量子对应中量子势不可或缺的角色，并警示后续理论构建需严格验证数学自洽性以避免类似混淆。", "summary_source": "deepseek", "authors": [{"name": "Gabor Vattay"}], "featured_authors": [{"name": "Gabor Vattay"}], "author_count": 1}, {"id": "2605.02656", "category": "quant-ph", "title": "Learning Temporal Patterns in Financial Time Series: A Comparative Study of Quantum LSTM and Quantum Reservoir Computing", "abstract": "This study explores quantum and classical hybrid architectures for financial time-series fore casting, focusing on Quantum Long Short-Term Memory (QLSTM) networks and Quantum Reservoir Computing (QRC), using univariate and multivariate lag structures on real financial data. We assess how lag embeddings affect predictive accuracy and robustness. Data are en coded into quantum states via amplitude encoding, enabling efficient representation of normalized lagged observations under realistic qubit constraints. The recurrent dynamics of QLSTM and the reservoir of QRC are implemented as parameterized quantum circuits, while classical optimizers train the readout and, where applicable, variational circuit parameters. We benchmark quantum models against classical LSTM and reservoir computing using common error like metrics. Our results show that, with suitable lag selection and amplitude encoding, quantum-enhanced archi tectures match classical baselines in univariate settings and can modestly outperform them in multivariate regimes with correlated inputs, where expressive encodings are most beneficial.", "url": "https://arxiv.org/abs/2605.02656", "type": "理论+数值", "summary": "1. 该工作系统比较了量子长短期记忆网络与量子储层计算在金融时间序列预测中的性能，采用振幅编码和参数化量子电路推动循环动力学。\n2. 其核心卖点在于发现振幅编码下的量子增强架构在多元相关输入情景中可适度超越经典基线，得益于高表达性编码对输入关联的有效利用。\n3. 这为量子混合方法在金融时序建模中实现实用优势提供了明确启发，尤其适用于高维关联数据场景。", "summary_source": "deepseek", "authors": [{"name": "Danyal Maheshwari"}, {"name": "Gerhard Hellstern"}, {"name": "Martin Zaefferer"}, {"name": "Martin Braun"}, {"name": "Tanja Döhler"}], "featured_authors": [{"name": "Danyal Maheshwari"}, {"name": "Gerhard Hellstern"}, {"name": "Martin Zaefferer"}, {"name": "Martin Braun"}, {"name": "Tanja Döhler"}], "author_count": 5}, {"id": "2605.02727", "category": "quant-ph", "title": "Distributed Quantum Circuit Optimisation: Evaluating Global and Local encodings", "abstract": "As distributed quantum architectures begin to emerge, understanding the interaction between quantum circuit optimisation and circuit partitioning becomes increasingly important. In this work, we study how circuit optimisation influences distributed quantum workloads under system-level trade-offs. We compare three compilation strategies (global optimisation, local optimisation, and a hybrid approach) across a large benchmark suite of quantum algorithms. Using telegate-based partitioning, we evaluate the resulting distributed circuits in terms of gate counts, circuit depth, the number of induced non-local gates, and compilation overhead, thereby approximating computational, communication, and classical preprocessing costs. Our results show that circuit optimisation does not uniformly benefit distributed execution. Global optimisation minimises computational resources and achieves the lowest compilation overhead. Local optimisation can reduce communication cost even though it is not explicitly communication-aware. The hybrid strategy can simultaneously reduce both computational and communication overhead, but at the expense of significantly increased compilation time.", "url": "https://arxiv.org/abs/2605.02727", "type": "理论+数值", "summary": "1. 该工作系统比较了全局优化、局部优化及混合策略三种编译方法在分布式量子电路中的性能，评估其对计算、通信及预处理成本的影响。\n2. 关键发现是电路优化并不均匀地有利于分布式执行：全局优化最小化计算开销，局部优化意外地降低通信成本，而混合策略虽同时削减两者却显著增加编译时间。\n3. 这为分布式量子架构下编译策略的设计提供了明确权衡依据，指导在实际系统中根据计算与通信资源选择最优优化路径。", "summary_source": "deepseek", "authors": [{"name": "Maria Gragera Garces"}, {"name": "Majid Haghparast"}], "featured_authors": [{"name": "Maria Gragera Garces"}, {"name": "Majid Haghparast"}], "author_count": 2}, {"id": "2605.02733", "category": "quant-ph", "title": "Bound States and Resonance Analysis of One-Dimensional Relativistic Parity-Symmetric Two Point Interactions", "abstract": "We consider the one-dimensional Dirac equation with the most general relativistic contact interaction supported on two points symmetrically located with respect to the origin. In order to determine the shape of the interaction, we use a distributional method, which in the present case is equivalent to the standard method of defining contact interactions by self-adjoint extensions of symmetric operators. The interaction on each of these two points depends on four parameters, each one having a clear physical meaning. We are interested in the scattering and confining properties of this model. We focus our attention on even or odd interactions under parity transformations and investigate the exi
