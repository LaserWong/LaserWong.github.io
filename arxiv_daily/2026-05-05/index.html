{"name": "Youjin Deng"}, {"name": "Kun Chen"}], "author_count": 9}, {"id": "2605.02315", "category": "cond-mat", "title": "Voltage-Tunable Nonequilibrium Dispersion Interactions", "abstract": "We develop a nonequilibrium Green's function theory for dispersion interactions between two nanostructures, each an open quantum system driven into a nonequilibrium steady state by an applied bias voltage. Starting from the two-particle nonequilibrium Green's function, we derive a general expression for the interaction energy in terms of the polarisation propagators of the individual systems. The interaction energy admits a physically transparent decomposition into charge noise and charge dissipation contributions, providing a fluctuation-dissipation interpretation that generalises the equilibrium London picture. Model calculations for coupled molecular junctions demonstrate that the applied voltage can enhance the attractive dispersion interaction by nearly an order of magnitude relative to equilibrium. In thermal equilibrium, the dispersion interaction is universally attractive, irrespective of the specific form of the nanostructure Hamiltonians or their coupling to reservoirs. Out of equilibrium, we introduce a generalised Kubo-Martin-Schwinger ratio that parametrises the departure from detailed balance. We show that, in contrast to equilibrium, nonequilibrium conditions can lead to a repulsive dispersion interaction. Finally, we discuss the conditions under which population inversion in the electronic leads can drive a sign reversal of the dispersion interaction.", "url": "https://arxiv.org/abs/2605.02315", "type": "理论+数值", "summary": "1. 该工作发展了一个非平衡格林函数理论，用于计算两个纳米结构之间由偏置电压驱动至非平衡稳态的色散相互作用。\n2. 其关键卖点在于将相互作用能分解为电荷噪声与电荷耗散贡献，推广了平衡London物理图像，且模型计算表明电压可增强吸引力近一个数量级。\n3. 这揭示了非平衡条件可导致排斥性色散相互作用，并指出电子引线中的布居反转能驱动符号反转，为调控纳米尺度卡西米尔力提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Christine M. E. Little"}, {"name": "Daniel S. Kosov"}], "featured_authors": [{"name": "Christine M. E. Little"}, {"name": "Daniel S. Kosov"}], "author_count": 2}, {"id": "2605.02322", "category": "cond-mat", "title": "Generation of heat pulses in mesoscopic conductors using light fields", "abstract": "We propose to generate heat pulses in mesoscopic conductors using light fields. In contrast to single-electron excitations such as levitons, which are created by accurate voltage drives, our approach relies on modulating the temperature of an electronic reservoir. To this end, we show that the interactions with a light field can induce a controllable time-dependent temperature in an electrode. The temperature modulations generate charge-neutral heat pulses that can be emitted into a mesoscopic conductor and detected in the outputs. We illustrate our approach by evaluating the time-dependent currents and their fluctuations using a tight-binding model of two electronic reservoirs connected by a quantum point contact. Our work establishes a route towards on-demand caloritronics, where energy rather than charge carries quantum information, and it paves the way for probing time-resolved heat transport and quantum coherence in thermally driven conductors.", "url": "https://arxiv.org/abs/2605.02322", "type": "理论+数值", "summary": "1. 该工作提出利用光场调制电子库温度，在介观导体中产生可控热脉冲。\n2. 其核心在于通过光与物质相互作用实现时变温度驱动，发射电中性热脉冲并检测其电流涨落。\n3. 这为发展按需热量学以及探测热驱动导体中的时间分辨热输运与量子相干性开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Pedro Portugal"}, {"name": "Riku Tuovinen"}, {"name": "Christian Flindt"}], "featured_authors": [{"name": "Pedro Portugal"}, {"name": "Riku Tuovinen"}, {"name": "Christian Flindt"}], "author_count": 3}, {"id": "2605.02336", "category": "cond-mat", "title": "Exchange-frustrated quadrupoles on the honeycomb lattice: Flavor-wave spectra, classical degeneracies and parton constructions", "abstract": "We study the quadrupolar Kitaev model, an $S=1$ honeycomb-lattice model with frustrated bond-dependent quadrupolar interactions. Using complementary methods and expanding around controlled limits, we uncover several intertwined structures. First, a semiclassical variational analysis based on $\\mathrm{SU}(3)$ flavor theory reveals an extensively degenerate manifold of classical mean-field ground states, suggesting that quantum fluctuations may stabilize a quantum-disordered phase. Second, in the bond-anisotropic limit, perturbation theory is used to derive effective low-energy Hamiltonians, which crucially depend on the presence (or absence) of a residual symmetry $\\mathcal{M}$ of combined lattice reflection and discrete spin rotation. A Majorana parton construction uncovers an exact $\\mathbb Z_2$ gauge structure and motivates possible confined and deconfined phases driven by gauge-charge condensation, consistent with the effective theories obtained in anisotropic limit. Further, within the same parton formalism, different Majorana mean-field ansätze produce both gapless and gapped candidate quantum-disordered states, distinguished by linear versus projective implementations of $\\mathcal M$. Our results highlight frustrated quadrupolar interactions as a route to quantum-disordered phases, relevant to $S \\geq 1$ Kitaev materials and Rydberg-array quantum simulators.", "url": "https://arxiv.org/abs/2605.02336", "type": "理论+数值", "summary": "1. 该工作利用互补方法系统研究了蜂窝晶格上具有受挫键依赖四极相互作用的四极Kitaev模型。\n2. 其核心在于通过SU(3)半经典变分揭示经典基态简并流形，并借助Majorana部分子构造发现由残余对称性M的线性或射影实现区分的Z2规范结构及候选量子无序相。\n3. 这为理解S≥1 Kitaev材料及Rydberg阵列量子模拟器中受挫四极相互作用驱动的量子无序相提供了理论框架与明确指引。", "summary_source": "deepseek", "authors": [{"name": "Partha Sarker"}, {"name": "Han Ma"}, {"name": "Urban F. P. Seifert"}], "featured_authors": [{"name": "Partha Sarker"}, {"name": "Han Ma"}, {"name": "Urban F. P. Seifert"}], "author_count": 3}, {"id": "2605.02423", "category": "cond-mat", "title": "Revisiting the surface density of states of midgap Andreev edge states", "abstract": "We revisit the effect of surface roughness on midgap Andreev edge states (MAES) in p- and d- wave superconductors. For a perfectly specular surface, MAES form a flat band at the Fermi energy, which manifests as a sharp midgap peak in the surface density of states (SDOS). Previous theoretical studies have shown that MAES in p- and d-wave superconductors respond markedly differently to surface roughness. In the d-wave state, diffuse surface scattering significantly broadens the midgap peak in the SDOS, accompanied by the emergence of a V-shaped structure centered at the Fermi energy. In contrast, the midgap peak in the p-wave state remains robust against diffuse scattering. In this work, we clarify the physical origin of this contrasting behavior. A key aspect of our analysis is that the flat band in the d-wave state consists of two distinct types of MAES modes. We show that inter-mode diffuse scattering leads to substantial broadening of the midgap peak and to the formation of the V-shaped structure. By contrast, the robustness of MAES in the p-wave state arises from the presence of a single MAES mode in the flat band. These results provide new insight into the response of MAES to surface roughness.", "url": "https://arxiv.org/abs/2605.02423", "type": "理论", "summary": "1. 该工作重新审视了p波和d波超导体表面粗糙度对中间隙安德烈夫边缘态(MAES)的态密度影响。\n2. 核心发现是d波平坦带包含两类MAES模式，其模式间漫散射导致表面态密度中间隙峰展宽并形成V形结构，而p波单模平坦带使峰保持鲁棒。\n3. 这为利用表面粗糙度响应区分超导配对对称性，以及设计对无序不敏感的边缘态器件提供了物理依据。", "summary_source": "deepseek", "authors": [{"name": "Gota Sato"}, {"name": "Yasushi Nagato"}, {"name": "Seiji Higashitani"}], "featured_authors": [{"name": "Gota Sato"}, {"name": "Yasushi Nagato"}, {"name": "Seiji Higashitani"}], "author_count": 3}, {"id": "2605.02433", "category": "cond-mat", "title": "Aging Record Statistics in Saturating Self-Interacting Random Walks", "abstract": "The record age tau_k, defined as the time between the k-th and k+1-st record-breaking events, is a central observable of extreme-value statistics. In Markovian processes, the absence of memory makes tau_k independent of k. How memory breaks this invariance and induces aging, meaning a dependence of tau_k on k, remains a fundamental question, closely connected to widely observed aging phenomena in non-Markovian dynamics. In this Letter, we derive the exact asymptotic distribution of tau_k for saturating self-interacting random walks, a broad class of non-Markovian processes. We uncover two asymptotic regimes, in agreement with recent scaling predictions: at short times (tau much smaller than k squared), record statistics are governed by the geometry of the explored region, while at long times (tau much larger than k squared), memory effects become subdominant and reduce to nontrivial prefactor corrections. Our exact result provides a rare analytic window beyond scaling theory and extends to a framework that fully quantifies aging dynamics in the presence of saturating self-interaction.", "url": "https://arxiv.org/abs/2605.02433", "type": "理论", "summary": "1. 该工作推导了饱和自相互作用随机行走过程中记录年龄τ_k的精确渐近分布，揭示了非马尔可夫记忆如何破坏记录年龄的k无关性并诱导老化现象。\n2. 其技术核心在于发现两个渐近标度区域：短时间（τ ≪ k²）由探索区域几何支配，长时间（τ ≫ k²）记忆效应退化为非平凡前因子修正，从而首次在饱和自相互作用体系中实现了对标度理论的精确解析超越。\n3. 这一结果为量化非马尔可夫随机过程中老化动力学的统计特性提供了严格框架，并可作为研究自排斥或自吸引行走中极端事件行为的一般理论工具。", "summary_source": "deepseek", "authors": [{"name": "J. Brémont"}, {"name": "R. Voituriez"}, {"name": "O. Bénichou"}], "featured_authors": [{"name": "J. Brémont"}, {"name": "R. Voituriez"}, {"name": "O. Bénichou"}], "author_count": 3}, {"id": "2605.02478", "category": "cond-mat", "title": "Stochastic first-passage modeling of single-event burnout in SiC power MOSFETs", "abstract": "Single-event burnout (SEB) in silicon carbide (SiC) power MOSFETs is often characterized by deterministic threshold quantities. Near the boundary between recovery and runaway, stochastic variability can make this threshold description probabilistic rather than sharp. This work introduces a first-passage perspective for stochastic threshold broadening in burnout. The process is described by a reduced electrothermal feedback-relaxation model with an absorbing boundary. The model combines carrier multiplication, avalanche feedback, localized heating, carrier loss, and thermal relaxation. Stochastic carrier and thermal terms represent unresolved event-level variability. The main finding is that finite fluctuations broaden the deterministic burnout threshold into a probabilistic transition band. Noise-induced subthreshold runaway also emerges, where nominally recoverable conditions can still fail through rare stochastic excursions. First-passage-time distributions resolve the time scale of burnout and survival probabilities further distinguish rapid feedback-dominated runaway from delayed stochastic failure. A feedback-relaxation phase diagram organizes recoverable, probabilistic, and rapidly unstable regimes. This framework provides a statistical-physics interpretation of threshold dispersion in single-event burnout of SiC power MOSFETs by linking coarse-grained electrothermal dynamics to probabilistic and time-resolved failure observables.", "url": "https://arxiv.org/abs/2605.02478", "type": "理论+数值", "summary": "1. 该工作引入随机首通模型描述SiC功率MOSFET单粒子烧毁中确定性阈值向概率性转变的过程。\n2. 其核心在于耦合载流子倍增、热弛豫与随机涨落，揭示噪声诱导的亚阈值失控及反馈-弛豫相图。\n3. 这为功率器件单粒子失效的统计物理解释与概率性可靠性评估提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Feiyi Liu"}, {"name": "Min Guo"}, {"name": "Shiyang Chen"}, {"name": "Yuhan Jiang"}, {"name": "Mingyang Liu"}, {"name": "Yang Wang"}], "featured_authors": [{"name": "Feiyi Liu"}, {"name": "Min Guo"}, {"name": "Shiyang Chen"}, {"name": "Yuhan Jiang"}, {"name": "Mingyang Liu"}, {"name": "Yang Wang"}], "author_count": 6}, {"id": "2605.02482", "category": "cond-mat", "title": "Topological defects in out-of-equilibrium systems", "abstract": "In this PhD thesis, we study topological defects in two-dimensional non-equilibrium systems, focusing on active extensions of the XY model, including activity, mobility and non-reciprocity. In a noisy Kuramoto lattice with short-range coupling, intrinsic frequency heterogeneity destroys quasi-long-range order and fragments the system into finite domains. Defects unbind at all temperatures and exhibit superdiffusive random walks, advected by evolving domain boundaries. By contrast, when oscillators are allowed to move in space, the system undergoes a Berezinskii-Kosterlitz-Thouless transition and regains quasi-long-range order, revealing the fundamental role of motility in sustaining coherence. We also analyse a non-reciprocal O(2) model with vision-cone couplings and derive a continuum theory that captures the same large-scale physics. Non-reciprocity selects defect shapes, enriches the annihilation process, and reshapes patterns through advection. Together, these results elucidate the fundamental role of activity and non-reciprocity in shaping topological defects and ordering in non-equilibrium systems. Keywords: Topological defects, XY model, Steep XY model, Kuramoto model, Non-reciprocal interactions, Active matter, Phase transitions, Berezinskii-Kosterlitz-Thouless transition, Non-equilibrium statistical mechanics", "url": "https://arxiv.org/abs/2605.02482", "type": "理论", "summary": "1. 该工作系统研究二维非平衡系统中拓扑缺陷的行为，扩展活性XY模型以包含频率非均匀性、粒子迁移率及非互易耦合。\n2. 其卖点在于揭示频率非均匀性破坏准长程有序并导致缺陷超扩散，而迁移使系统恢复BKT转变，非互易性则选择缺陷形状并重塑耗散图案。\n3. 这为理解活性物质与非互易系统中拓扑缺陷调控及非平衡相变提供了关键机制和可检验的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Ylann Rouzaire"}], "featured_authors": [{"name": "Ylann Rouzaire"}], "author_count": 1}, {"id": "2605.02483", "category": "cond-mat", "title": "A unified equation for saturation magnetization and spin transport in weakly disordered ferromagnets", "abstract": "In this report, a unified description of the loss of saturation magnetization in the presence of a distribution of finite-size effects is provided for weakly disordered spin-1/2 ferromagnets. This description allows us to derive a unified form of the Bloch equation for these systems. We further extend this approach to obtain a unified expression for spin transport in such systems.", "url": "https://arxiv.org/abs/2605.02483", "type": "理论", "summary": "1. 该工作针对弱无序自旋1/2铁磁体，提出了饱和磁化强度损失与自旋输运的统一方程描述。\n2. 其核心在于将有限尺寸效应分布纳入Bloch方程框架，导出统一的磁化弛豫与输运表达式。\n3. 这为无序铁磁体系中自旋动力学与输运现象的定量理论预测提供了直接可用的解析工具。", "summary_source": "deepseek", "authors": [{"name": "Sumanta Mukherjee"}], "featured_authors": [{"name": "Sumanta Mukherjee"}], "author_count": 1}, {"id": "2605.02492", "category": "cond-mat", "title": "Designing explicit functionals for the charge density in terms of a potential", "abstract": "One of the most powerful strategies to address properties of real many-body systems is to incorporate data obtained for models, for example, to use data of the homogeneous electron gas in order to build the Local Density Approximation for the Kohn-Sham exchange-correlation potential. In the present work, we examine to what extent we can use model data to design functionals directly for observables of materials. In particular, we study different approximations for the charge density of real inhomogeneous materials expressed as a simple, explicit functional of a given Kohn-Sham potential, using as central building block the Lindhard density-density response function of the homogeneous electron gas. Our increasingly realistic set of approximations includes a fully nearsighted expression equivalent to the Thomas-Fermi approximation, functional Taylor expansions, and different approximations to the Connector Theory developed in [Aouina \\textit{et al.}, npj Computational Materials {\\bf 11}, 242 (2025)]. In all cases, the charge density is obtained without ever solving the Kohn-Sham Schrödinger equation. Results for cubic helium, a prototypical strongly inhomogeneous material, systematically improve with higher levels of approximation, indicating that this is a promising route to obtain expressions that are relatively simple to calculate and to analyze.", "url": "https://arxiv.org/abs/2605.02492", "type": "理论", "summary": "1. 该工作利用均匀电子气Lindhard响应函数构建显式泛函，直接由Kohn-Sham势计算非均匀材料电荷密度。\n2. 其核心在于发展了一系列无需求解Kohn-Sham方程的近似方案，涵盖近邻性递推、泰勒展开及Connector理论，系统提升了强非均匀立方氦的描述性。\n3. 这为从模型数据直接设计材料可观测量简化、可解析分析的泛函开辟了明确路径，并有望拓展至更广泛复杂体系。", "summary_source": "deepseek", "authors": [{"name": "Muhammed Hüseyin Güneş"}, {"name": "Ayoub Aouina"}, {"name": "Vitaly Gorelov"}, {"name": "Matteo Gatti"}, {"name": "Lucia Reining"}], "featured_authors": [{"name": "Muhammed Hüseyin Güneş"}, {"name": "Ayoub Aouina"}, {"name": "Vitaly Gorelov"}, {"name": "Matteo Gatti"}, {"name": "Lucia Reining"}], "author_count": 5}, {"id": "2605.02531", "category": "cond-mat", "title": "Preliminary Structural Study of Chromium Coatings for Nuclear Applications", "abstract": "Following the Fukushima Daiichi disaster, an increasing number of studies concentrate on the development of Accident Tolerant Fuel (ATF) cladding materials for nuclear fuel, aiming to prevent the oxidation of zirconium during incidents such as Loss of Coolant Accident (LOCA) and to effectively lower the amount of heat and hydrogen released during emergency core cooling (ECC). Zirconium alloy cladding with a protective chromium (Cr) coating is considered one of the promising candidates, largely due to its relatively short timeline for deployment in nuclear power plants. In this study, Cr-coated and uncoated Zircaloy-4 claddings were evaluated using high temperature X-ray diffraction (HT-XRD) in vacuum over a temperature range from RT to 1100oC. The temperatures corresponding to the formation of oxide phases are >200oC and >600oC for the uncoated and Cr-coated samples, respectively. SEM and TEM characterisation of the sub-surface in Cr-coated specimen after HT-XRD revealed Fe segregation, formation of Zr(Fe,Cr)2 Laves phase and nano-bubbles at the former Cr / Z4 interface.", "url": "https://arxiv.org/abs/2605.02531", "type": "数值", "summary": "1. 该工作采用高温X射线衍射技术，在室温至1100°C真空条件下对比研究了铬涂层与未涂层锆-4包壳的结构演化过程。\n2. 其核心发现是未涂层与铬涂层样品氧化物形成温度分别高于200°C和600°C，并在铬涂层界面观测到Fe偏析、Zr(Fe,Cr)₂ Laves相及纳米气泡的形成。\n3. 这为事故容错燃料包壳材料的开发提供了关键氧化抑制温度窗口与界面微观结构演变依据。", "summary_source": "deepseek", "authors": [{"name": "Michał A. Stróżyk"}, {"name": "Jong-Dae Hong"}, {"name": "JaeYong Kim"}, {"name": "Iwona Jóźwik"}, {"name": "Ryszard Diduszko"}, {"name": "Jerzy Zagórski"}, {"name": "Witold Chromiński"}, {"name": "Kinga Suchorab"}, {"name": "Katarzyna Ciporska"}, {"name": "Marcin Brykała"}, {"name": "Jacek Jagielski"}], "featured_authors": [{"name": "Michał A. Stróżyk"}, {"name": "Jong-Dae Hong"}, {"name": "JaeYong Kim"}, {"name": "Katarzyna Ciporska"}, {"name": "Marcin Brykała"}, {"name": "Jacek Jagielski"}], "author_count": 11}, {"id": "2605.02576", "category": "cond-mat", "title": "Analyticity and symmetry of band extrema in gapped solids: when does the effective mass approximation hold?", "abstract": "The effective mass approximation is widely used across models of carrier transport, optical response, and excitons in semiconductors and insulators, but its validity hinges on the assumption that the band dispersion $E_n(\\mathbf{k})$ at the relevant extremum is analytic. We prove that analyticity holds at any non-degenerate extremum for the standard ab initio Hamiltonians, including density functional theory with local or hybrid exchange-correlation functionals and for band-edge $G_0W_0$ quasiparticle energies in gapped systems. Band non-analyticity (or warping) in these settings is therefore intrinsically tied to degeneracy. We then use group theory to determine the symmetry-allowed form of the effective mass tensor for each of the 32 crystallographic point groups, providing a stringent consistency check on first-principles calculations. As a representative application, we show that the electron and hole effective masses at the $K$ point of monolayer MoS$_2$ must be strictly isotropic at the DFT and $G_0W_0$ levels.", "url": "https://arxiv.org/abs/2605.02576", "type": "理论+数值", "summary": "1. 该工作证明在标准第一性原理哈密顿量（含DFT与G₀W₀）下，非简并能带极值处色散必为解析，有效质量近似成立。\n2. 其卖点在于将能带非解析性归因于简并且通过群论给出全部32个晶体点群中有效质量张量的对称性允许形式。\n3. 这为第一性原理计算提供了严格的一致性检验，并预言单层MoS₂在K点有效质量必须严格各向同性。", "summary_source": "deepseek", "authors": [{"name": "Jakob Kjærulff Svaneborg"}, {"name": "Kristian Sommer Thygesen"}], "featured_authors": [{"name": "Jakob Kjærulff Svaneborg"}, {"name": "Kristian Sommer Thygesen"}], "author_count": 2}, {"id": "2605.02579", "category": "cond-mat", "title": "A general thermodynamic approach for diffusion on a lattice", "abstract": "This work presents a general thermodynamic approach to describe particle diffusion on a lattice, a model used to study transport processes in solids and on surfaces. By treating each lattice site as an open thermodynamic system, the effects of microscopic particle interactions are represented through the chemical potential. A fundamental relationship between the Onsager matrix ($L$) and its ideal-system counterpart ($L_\\text{id}$, where interactions are neglected) using the determinant of the covariance matrix is demonstrated. This framework allows for the calculation of transport coefficients using the combination of their ideal values and thermodynamic properties. The general result is successfully applied to reproduce the Darken equation for substitutional diffusion in solids and to derive the non-diagonal diffusion matrix of the Zhdanov model for surface diffusion of Langmuir particles. In the last case, analytical predictions are further validated through numerical simulations across various interaction potentials.", "url": "https://arxiv.org/abs/2605.02579", "type": "理论+数值", "summary": "1. 该工作提出将每个晶格位点视为开放热力学系统的一般热力学方法，用于描述晶格上的粒子扩散过程。\n2. 核心创新在于通过协方差矩阵行列式建立了相互作用系统的Onsager矩阵与其理想系统对偶之间的基本关系，使输运系数可由理想值与热力学性质联合计算。\n3. 该方法成功再现了固体替位扩散的Darken方程，推导了Langmuir粒子表面扩散Zhdanov模型的非对角扩散矩阵，并经数值模拟验证了不同相互作用势下的分析预测。", "summary_source": "deepseek", "authors": [{"name": "Matías A. Di Muro"}, {"name": "Miguel Hoyuelos"}], "featured_authors": [{"name": "Matías A. Di Muro"}, {"name": "Miguel Hoyuelos"}], "author_count": 2}, {"id": "2605.02581", "category": "cond-mat", "title": "Entanglement signature of fully and partially dimerized phases in frustrated spin chains", "abstract": "The von Neumann entanglement entropy of exact valence-bond ground states is studied in two frustrated one-dimensional spin chains: the spin-1/2 Majumdar-Ghosh (MG) model and the spin-3/2 J1-J2-J3 chain in its fully dimerized (FD) and partially dimerized (PD) phases. Using matrix-product-state representations, the entropy is computed as a function of system size for three complementary bipartitions - half-chain, single-site, and pairwise - under both open and periodic boundary conditions. In all cases, the entropy saturates to a finite constant in the thermodynamic limit, confirming area-law behavior. The saturation values, extracted via finite-size scaling, are directly related to the underlying virtual-spin bond structure. The MG model and FD phase exhibit similar entanglement behavior, differing primarily in saturation magnitude determined by spin value and bond multiplicity, and both display even-odd oscillations and exponential convergence with system size. In contrast, the PD phase shows qualitatively distinct signatures, including multiple half-chain saturation values depending on the bond type at the cut, asymmetric edge contributions in the single-site entropy, and a multi-band structure in the pairwise entropy reflecting the coexistence of single- and double-singlet bonds. These results establish entanglement entropy as a robust signature of frustrated bond architecture, enabling clear distinction among dimerized phases with different spin magnitude, bond multiplicity, and dimerization patterns.", "url": "https://arxiv.org/abs/2605.02581", "type": "理论+数值", "summary": "1. 该工作通过计算精确价键基态的von Neumann纠缠熵，研究了阻挫自旋链中完全与部分二聚化相的纠缠特征。\n2. 其关键在于揭示了纠缠熵饱和值由虚自旋键结构决定，部分二聚化相呈现多饱和值、不对称边缘贡献及配对熵多带结构等独特特征。\n3. 这为利用纠缠熵区分不同自旋大小、键多重性及二聚化模式的阻挫系统提供了鲁棒诊断工具。", "summary_source": "deepseek", "authors": [{"name": "Wuttichai Pankeaw"}, {"name": "Teparksorn Pengpan"}, {"name": "Pruet Kalasuwan"}], "featured_authors": [{"name": "Wuttichai Pankeaw"}, {"name": "Teparksorn Pengpan"}, {"name": "Pruet Kalasuwan"}], "author_count": 3}, {"id": "2605.02625", "category": "cond-mat", "title": "The flow of local quantum fluids: Conservation laws and vertex corrections from many-body linear-response theory with local self-energy", "abstract": "In non-diffusive conduction regimes of strongly correlated quantum electron systems, electromagnetic perturbations simultaneously probe the electronic dynamics in time and space: the exchanged energy $\\hbar \\omega$ excites retarded, i.e., frequency-dependent, many-body interactions, while the probing spatial modulation renders the response spatially nonlocal, i.e., dependent on the external wave vector $\\vec{q}$. This work determines the exact nonlocal electrodynamic response of such dynamical quantum fluids under the assumptions of local, frequency-dependent interactions and charge/mass conservation. The latter is ensured by Bethe-Salpeter equations for renormalized interaction vertices, entering the Kubo formalism for two-particle correlation functions (e.g., for density, currents, momentum, stress). Within such framework, it is shown that vertex corrections generally vanish at $q=0$ for single-particle dispersions with inversion symmetry and for bare interaction vertices that are odd with respect to specific point group transformations in momentum space, including inversion for vector vertices, and mirror reflections or two- or higher-fold rotations for tensor vertices. In addition, for quadratic dispersion vertex corrections identically vanish from the current-current correlation function, at any momentum $\\vec{q}$ and frequency $\\omega$. The robustness of these criteria against further symmetry breaking, multiband effects, and additionally imposing momentum conservation, is discussed, with application to the Hall viscosity of Landau levels. Explicit expressions for generic nonlocal correlation functions are derived for Fermi liquids (with well-defined quasiparticle peaks) and non-Fermi liquids (devoid of quasiparticles), for arbitrary local self-energies.", "url": "https://arxiv.org/abs/2605.02625", "type": "理论", "summary": "1. 该工作基于局域自能的量子多体线性响应理论，推导出局域量子流体在电荷和质量守恒约束下的精确非局域电动力学响应。\n2. 其技术核心是从Bethe-Salpeter方程导出顶点修正消失的对称性判据：反演对称色散下矢量顶点在q=0处消失，二次色散下流-流顶点对任意q和ω恒为零。\n3. 这些结果为费米液体和非费米液体的非局域关联函数给出显式表达式，为分析朗道能级霍尔粘度等拓扑输运及对称性破缺效应提供了统一理论框架。", "summary_source": "deepseek", "authors": [{"name": "Davide Valentinis"}], "featured_authors": [{"name": "Davide Valentinis"}], "author_count": 1}, {"id": "2605.02642", "category": "cond-mat", "title": "Floquet-Multiple Andreev Reflections", "abstract": "Floquet theory describes quantum systems governed by time-periodic Hamiltonians, much as Bloch theory describes spatially periodic solids. In voltage-biased multiterminal Josephson junctions, the Josephson relation causes superconducting phase differences to evolve periodically in time, thereby providing an intrinsic Floquet drive. In this Letter, we consider three-terminal Josephson junctions formed on a ballistic two-dimensional normal conductor with a continuum of electronic states. We show that the quartet and higher-order multipair processes yield characteristic Floquet-multiple Andreev reflection (Floquet-MAR) finite-bias conductance and noise resonances that are parameterized by the bias voltage and electrochemical potential. This microscopic picture opens a route toward implementing and probing Floquet-MAR physics in ballistic multiterminal Josephson junctions.", "url": "https://arxiv.org/abs/2605.02642", "type": "理论", "summary": "1. 该工作理论研究了弹道二维电子气中三端电压偏置约瑟夫森结的Floquet-多重安德烈夫反射效应。\n2. 其核心物理在于揭示quartet及高阶多对过程驱动的有限偏压电导与噪声共振，并由偏压和电化学势参数化。\n3. 这为在弹道多端约瑟夫森结中实现内禀Floquet驱动下多重安德烈夫反射的探测提供了微观理论框架。", "summary_source": "deepseek", "authors": [{"name": "Régis Mélin"}, {"name": "Romain Danneau"}, {"name": "Morteza Kayyalha"}], "featured_authors": [{"name": "Régis Mélin"}, {"name": "Romain Danneau"}, {"name": "Morteza Kayyalha"}], "author_count": 3}, {"id": "2605.02644", "category": "cond-mat", "title": "Polymer Knots in Thin Films: Thickness Dependence, Local Effects, and Stiffness", "abstract": "We study how confinement affects topology and conformations in polymer films of varying thickness $h$. The knotting probability exhibits a maximum at intermediate thicknesses near the bulk radius of gyration $h \\approx R_\\mathrm{g,bulk}$, vanishes at small $h$ and approaches bulk values for large $h$. Close to walls, the entanglement length increases monotonically and conformations become flatter. A layer-resolved analysis of structural and topological properties allows us to reconstruct the explicit thickness dependencies by integrating layer-resolved properties of a thick film.", "url": "https://arxiv.org/abs/2605.02644", "type": "理论+数值", "summary": "1. 该工作通过分子模拟研究了薄膜厚度对聚合物链扭结概率与纠缠长度的影响。\n2. 其核心发现是扭结概率在厚度接近体回转半径时出现峰值，且壁面处纠缠长度增大。\n3. 这为通过层分辨方法预测受限体系中拓扑性质提供了可推广的分析框架。", "summary_source": "deepseek", "authors": [{"name": "Maurice P. Schmitt"}, {"name": "Hendrik Meyer"}, {"name": "Peter Virnau"}], "featured_authors": [{"name": "Maurice P. Schmitt"}, {"name": "Hendrik Meyer"}, {"name": "Peter Virnau"}], "author_count": 3}, {"id": "2605.02688", "category": "cond-mat", "title": "Unified Mapping of Multi-Site Electrocatalytic Activity Using a Single Descriptor", "abstract": "We present a precise and general method to map the activity of electrocatalysts across multiple sites. Starting from a mean-field statistical mechanics model, we introduce an effective adsorption free energy descriptor that explicitly incorporates lateral adsorbate-adsorbate interactions, enabling the construction of coverage-consistent volcano relationships. Extending this approach, we show that adsorption energetics and interaction strength define a two-dimensional activity landscape that gives rise to a \"volcano ridge\" that captures the coupled influence of binding and interactions on catalytic performance. For multi-site systems, we demonstrate that the inherently nonlinear coupling between distinct adsorption environments leads to multi-peaked activity trends that cannot be represented by conventional single-site descriptors. To address this, we introduce a reduced descriptor mapping that projects the multidimensional activity landscape onto a single effective coordinate while preserving the underlying physics of site heterogeneity and lateral interactions. The resulting framework generalizes Sabatier-type analysis to complex alloy catalysts and provides a physically interpretable route for screening electrocatalytic materials of arbitrary compositional complexity.", "url": "https://arxiv.org/abs/2605.02688", "type": "理论", "summary": "1. 该工作从平均场统计力学模型引入有效吸附自由能描述符，显式计入横向相互作用，构建覆盖一致的火山关系，将多站点电催化活性统一映射至单一有效坐标。\n2. 其核心物理在于揭示吸附能与相互作用定义的二维活动景观中的“火山脊”，并通过约化描述符投影在保留位点异质性与非线性耦合下准确表征多峰活性趋势，克服传统单描述符局限。\n3. 该框架将Sabatier分析推广至任意成分复杂合金催化剂，为电催化材料的高通量筛选提供了物理可解释且普适的指导原则与实现路径。", "summary_source": "deepseek", "authors": [{"name": "A. Dana"}, {"name": "D. Terrones"}, {"name": "S. Gelin"}, {"name": "I. Dabo"}], "featured_authors": [{"name": "A. Dana"}, {"name": "D. Terrones"}, {"name": "S. Gelin"}, {"name": "I. Dabo"}], "author_count": 4}, {"id": "2605.02717", "category": "cond-mat", "title": "Benchmarking the Dual Fermion approach on the Falicov-Kimball model", "abstract": "Strong electronic correlations generally require non-perturbative treatment. Local correlations are captured by dynamical mean-field theory while nonlocal correlations can be treated with diagrammatic extensions such as the Dual Fermion approach. Dual Fermion is built on physically motivated, but in principle uncontrolled approximations, so careful benchmarking is needed to understand the strengths and limitations of the method. In this work, we benchmark ladder Dual Fermion and dynamical mean-field theory for the Falicov-Kimball model with the exact classical Monte Carlo solution. We focus on the thermodynamics, electronic structure and susceptibility, especially at the combined frequency and momentum structure, and find that Dual Fermion clearly outperforms dynamical mean-field theory. Somewhat surprisingly, Dual Fermion is not as accurate for the relation between orbital density versus chemical potential in the doped system. These results demonstrate the need for rigorous benchmarking of diagrammatic extensions of dynamical mean-field theory for models with inequivalent orbitals, which is essential for modelling materials.", "url": "https://arxiv.org/abs/2605.02717", "type": "理论+数值", "summary": "1. 该工作基于Falicov-Kimball模型的精确经典蒙特卡洛解，系统基准测试了梯图Dual Fermion方法与动力学平均场理论在热力学、电子结构及磁化率上的表现。\n2. 其核心卖点在于发现Dual Fermion在频率-动量联合结构上显著优于DMFT，但在掺杂体系下轨道密度与化学势的关系上反而不准确，揭示了该方法的适用范围与局限。\n3. 这强调了必须对含不等价轨道的模型进行严格基准测试，为发展更可靠的DMFT图论扩展及材料强关联建模提供了关键启示。", "summary_source": "deepseek", "authors": [{"name": "Akshat Mishra"}, {"name": "Hugo U. R. Strand"}, {"name": "Erik G. C. P. van Loon"}], "featured_authors": [{"name": "Akshat Mishra"}, {"name": "Hugo U. R. Strand"}, {"name": "Erik G. C. P. van Loon"}], "author_count": 3}, {"id": "2605.02732", "category": "cond-mat", "title": "Geometric Formulation of Power-Efficiency Bounds in Carnot-like Engines", "abstract": "We formulate the power-efficiency constraint of Carnot-like heat engines as a geometric optimization problem in the plane of normalized branch dissipations. Efficiency contours are straight lines in this plane, so maximizing efficiency at fixed power reduces to bounding the slope of an admissible line. We apply this framework to branch-resolved power-law dissipation, where the irreversible loss on each isothermal branch decays with the branch duration with a common exponent rather than following the standard inverse-time law. After optimizing over the dissipation-asymmetry parameter, the fixed-power attainable set becomes a two-dimensional region, and the resulting slope-bound problem reduces to linear programming. The framework yields the exact power-efficiency frontier within this model and gives closed-form constraints for representative dissipation exponents, including the maximum-power limit.", "url": "https://arxiv.org/abs/2605.02732", "type": "理论+数值", "summary": "1. 该工作将卡诺类热机的功率-效率约束表述为耗散平面上的几何优化问题，效率等高线化为直线。\n2. 其技术核心在于通过耗散不对称参数优化，将固定功率可达集化为二维区域，使斜率边界问题简化为线性规划。\n3. 该几何框架精确给出了幂律耗散模型的功率-效率前沿闭式解，为有限时间热力学普遍约束提供了直观解析工具。", "summary_source": "deepseek", "authors": [{"name": "R. X. Zhai"}], "featured_authors": [{"name": "R. X. Zhai"}], "author_count": 1}, {"id": "2605.02736", "category": "cond-mat", "title": "Exact Microcanonical Formulation and Thermodynamics of Equispaced Finite-Level Systems", "abstract": "We present an exact microcanonical formulation, in the thermodynamic limit, for a system of $N$ noninteracting particles with $p$ equally spaced energy levels $\\{0,\\epsilon,2\\epsilon,\\ldots,(p-1)\\epsilon\\}$. Writing the microcanonical multiplicity $\\Omega_p(E,N)$ as the coefficient of a generating function and evaluating the resulting representation by saddle-point analysis, we derive analytical expressions for the entropy per particle $s(u,p)$ and inverse temperature $\\beta(u,p)$, with $u=E/(N\\epsilon)$ in the interval $[0,p-1]$. The formulation applies to arbitrary $p$ and recovers the known cases $p=2$, $p=3$, and $p\\to\\infty$. For finite $p$, the bounded spectrum implies an entropy maximum at $u_c=(p-1)/2$, where $\\beta$ vanishes and changes sign. In the limit $p\\to\\infty$, the upper spectral bound is lost, the finite-energy entropy maximum disappears, and no negative-temperature branch remains. To our knowledge, this is the first general thermodynamic-limit microcanonical solution for arbitrary $p$. It therefore provides a unified framework for the thermodynamics of equispaced finite-level systems and their bounded-spectrum crossover with increasing $p$.", "url": "https://arxiv.org/abs/2605.02736", "type": "理论", "summary": "1. 该工作针对具有p个等间距能级的无相互作用粒子系统，在热力学极限下建立了精确的微正则表述。\n2. 通过鞍点分析从生成函数系数导出熵和逆温度的闭式解析表达式，统一处理任意p并涵盖已知情形，揭示有界谱导致的熵极大与负温度分支。\n3. 这一解析框架为理解有限能级系统的热力学行为及其随p增大向无界谱的交叉提供了完整基础。", "summary_source": "deepseek", "authors": [{"name": "J. Ricardo de Sousa"}], "featured_authors": [{"name": "J. Ricardo de Sousa"}], "author_count": 1}, {"id": "2605.02750", "category": "cond-mat", "title": "Absence of Quantum-Metric-Induced Intrinsic Longitudinal Response", "abstract": "Nonlinear charge transport in solids has emerged as a powerful probe of the quantum geometric properties of Bloch electrons. While the Berry curvature underlies the intrinsic anomalous Hall effect, recent studies have suggested that the quantum metric may generate both \\emph{intrinsic} nonlinear Hall and longitudinal transport. Here, using standard quantum-mechanical perturbation theory, we demonstrate that the quantum-metric-induced intrinsic longitudinal response identically vanishes, even though the corresponding intrinsic Hall response is allowed. This conclusion follows from the dissipationless nature of intrinsic currents and holds independently of band structure details and to all orders in the nonlinear response. Our work resolves existing inconsistencies in the theoretical formulation of quantum-metric-induced nonlinear transport and suggests a reexamination of recently reported intrinsic longitudinal responses attributed to the quantum metric.", "url": "https://arxiv.org/abs/2605.02750", "type": "理论", "summary": "1. 本工作通过标准量子力学微扰论证明，量子度量诱导的固有纵向非线性响应恒为零。\n2. 其技术核心在于利用固有电流的无耗散特性，论证该结论独立于能带结构细节且成立至所有阶。\n3. 这解决了量子度量非线性输运理论中的矛盾，并需重新审视近期归因于量子度量的固有纵向响应的实验结果。", "summary_source": "deepseek", "authors": [{"name": "Ping Tang"}], "featured_authors": [{"name": "Ping Tang"}], "author_count": 1}, {"id": "2605.02768", "category": "cond-mat", "title": "The free energy limit of the SYK model at high temperature", "abstract": "The Sachdev-Ye-Kitaev (SYK) model is a disordered quantum mean-field model studied in condensed matter physics and the holographic theory of black holes. Its structural properties can be derived heuristically using a combination of the replica method and path integration techniques. Analyzing it mathematically rigorously, however, turned out to be notoriously difficult, even for basic questions such as computing the annealed free energy. In this paper we rigorously compute the free energy limit (annealed and quenched) for this model at high enough but constant temperature. Our results are in numerical agreement with the results derived by physics methods. Remarkably, though, our method of proof is novel and is different from the physics approach. It is based on (a) the theory of the component structure of sparse random graphs and (b) a variant of the cavity method, used widely in prior rigorous and heuristic treatments of classical spin glasses.", "url": "https://arxiv.org/abs/2605.02768", "type": "理论+数值", "summary": "1. 该工作严格计算了Sachdev-Ye-Kitaev模型在足够高但恒定温度下退火与淬火自由能的极限。\n2. 其技术卖点在于采用基于稀疏随机图组件结构和空穴方法的全新证明途径，与传统的复制子路径积分方法截然不同。\n3. 这为高温下量子混沌模型的严格分析与物理启发式结果的一致性提供了数学支撑，并可能推广至其他无序量子多体系统。", "summary_source": "deepseek", "authors": [{"name": "David Gamarnik"}, {"name": "Francisco Pernice"}, {"name": "Alexander Schmidhuber"}, {"name": "Alexander Zlokapa"}], "featured_authors": [{"name": "David Gamarnik"}, {"name": "Francisco Pernice"}, {"name": "Alexander Schmidhuber"}, {"name": "Alexander Zlokapa"}], "author_count": 4}, {"id": "2605.02785", "category": "cond-mat", "title": "Triplet-assisted leakage during singlet-triplet qubit readout with a quantum point contact", "abstract": "Quantum point contact readout theory for singlet-triplet qubits in a lateral double quantum dot is extended by including tunneling of triplet configurations into a higher-energy level of the neighboring dot. This additional channel creates energetically allowed leakage pathways that modify the branch-dependent charge and current-noise signatures, even when the Pauli blockade remains effective within the ground-state manifold. The model contains two single-particle levels in each dot. The resulting singlet and triplet block structure is derived together with a Lindblad master equation. Quantum-jump simulations are then used to resolve the dynamics of individual readout events. A complementary Liouvillian steady-state analysis identifies the regime in which tunneling to the excited level qualitatively changes the readout signatures, with the crossover determined by the level spacing.", "url": "https://arxiv.org/abs/2605.02785", "type": "理论+数值", "summary": "1. 该工作将量子点接触读取理论扩展至包含三重态隧穿到相邻量子点高能级的情形，从而在自旋阻塞仍然有效的基态流形中引入能量允许的泄漏通道。\n2. 卖点在于导入了含两个单粒子能级的点模型，通过Lindblad主方程和量子跳跃模拟揭示了分支依赖的电荷与电流噪声特征如何被该泄漏通道定性改变。\n3. 这为理解单重态-三重态量子比特读取过程中的泄漏物理提供了定量框架，并指出了通过调控能级间距来优化读取信噪比的方向。", "summary_source": "deepseek", "authors": [{"name": "Karol Kawa"}], "featured_authors": [{"name": "Karol Kawa"}], "author_count": 1}, {"id": "2605.02854", "category": "cond-mat", "title": "Emergent flocking dynamics in chemorepulsive active colloids: interplay of disorder and noise", "abstract": "Recent studies of active colloidal matter have revealed that a global polar order can arise from chemorepulsive interactions among particles without any explicit alignment interaction between them. In this work, we investigate such chemically interacting active colloids in the presence of quenched disorder, where a fraction of particles are randomly pinned in space. These pinned particles are restricted to rotational motion while remaining chemically coupled to the mobile population. In addition, angular noise is incorporated into the rotational dynamics to capture stochastic effects. To elucidate the interplay of quenched disorder and noise, we construct phase diagrams based on polar order and its fluctuations, and systematically analyze the associated disorder- and noise-driven phase transitions. Surprisingly, we find that the phase transition driven by the noise is significantly dependent on the density of the particles, whereas such a density-dependence is not present when the control parameter is the pinning fraction. The finite-size effects on these transitions are also examined. An effective interaction range, governed by the coefficient related to screening of the chemorepulsive interaction, plays a crucial role in collective behavior. When the effective interaction range is much smaller than the system size, the system exhibits density band formation, a feature absent in the long-range interaction regime. Moreover, near the transition point, the order parameter distribution becomes bimodal for the case of short-range interaction.", "url": "https://arxiv.org/abs/2605.02854", "type": "理论+数值", "summary": "1. 该工作实验研究了化学排斥活性胶体在淬火无序（随机钉扎粒子）和旋转噪声共同作用下的涌现群集动力学。\n2. 其核心发现是噪声驱动的极性序相变显著依赖于粒子密度，而钉扎分数驱动的相变无此依赖，且短程有效相互作用可导致密度带形成及序参量双峰分布。\n3. 这揭示了无序与噪声在活性物质中竞争对集体行为的关键调控作用，为设计可编程活性材料提供了相图指导。", "summary_source": "deepseek", "authors": [{"name": "Sagarika Adhikary"}, {"name": "Rajesh Singh"}], "featured_authors": [{"name": "Sagarika Adhikary"}, {"name": "Rajesh Singh"}], "author_count": 2}, {"id": "2605.00987", "category": "hep-th", "title": "A gravity interpretation for the complex Euclidean saddles of the ABJM index", "abstract": "The superconformal index is a grand-canonical partition function that counts the 1/16-BPS states in the theory, and its Legendre transform with respect to reduced chemical potentials accounts for the Bekenstein-Hawking entropy of electrically charged rotating black holes in anti-de Sitter spacetime. However, the superconformal index of $\\mathcal{N}=4$ super Yang-Mills theory appears to allow shifts in chemical potentials, and the contributions of the shifted terms diverge exponentially. This puzzle was resolved by showing the instability of wrapped D3-branes corresponding to the shifts in the gravitational on-shell action. Analogously, we study the ABJM index and the M5-brane instability criterion.", "url": "https://arxiv.org/abs/2605.00987", "type": "理论", "summary": "1. 该工作通过引力对偶解释了ABJM超共形指标中复欧几里得鞍点的物理意义。\n2. 其核心在于建立M5膜不稳定性判据，阐明化学势偏移导致指标指数发散的原因。\n3. 这为AdS/CFT对应中复鞍点贡献的物理解释提供了可推广的框架。", "summary_source": "deepseek", "authors": [{"name": "Minwoo Suh"}], "featured_authors": [{"name": "Minwoo Suh"}], "author_count": 1}, {"id": "2605.01072", "category": "hep-th", "title": "Reconstructing conformal field theoretical compositions with Transformers", "abstract": "We study the use of transformers to reconstruct the compositions of tensor products of two-dimensional rational conformal field theories (RCFTs) based on their low-energy spectra. The task is challenging due to its combinatorial nature. The constituent theories are characterized by their central charges and affine Lie algebra labels. We achieve 98% accuracy in recovering the constituents of tensor products theories constructed from Wess-Zumino-Witten models. We further demonstrate that our method generalizes to CFTs with larger central charge and unseen classes of RCFTs by adding a small number of out-of-domain examples. Our results show that transformers are effective at this task and point towards a new tool for bulk reconstruction in AdS/CFT.", "url": "https://arxiv.org/abs/2605.01072", "type": "理论", "summary": "1. 该工作利用Transformer从低能谱中重构二维有理共形场论张量积的组成成分，涉及中心荷和仿射李代数标签的组合分类难题。\n2. 其关键结果是在Wess-Zumino-Witten模型张量积上达到98%重构准确率，并通过少量域外样本泛化至更大中心荷及未见类有理共形场论。\n3. 这为AdS/CFT中的整体重建提供了基于机器学习的新工具，暗示Transformer可有效捕获共形场论结构的组合特征。", "summary_source": "deepseek", "authors": [{"name": "Haotian Cao"}, {"name": "Garrett Merz"}, {"name": "Kyle Cranmer"}, {"name": "Gary Shiu"}], "featured_authors": [{"name": "Haotian Cao"}, {"name": "Garrett Merz"}, {"name": "Kyle Cranmer"}, {"name": "Gary Shiu"}], "author_count": 4}, {"id": "2605.01150", "category": "hep-th", "title": "Twist Operator BOPE and Entanglement Entropy in 2D Interface CFT", "abstract": "We address several aspects of entanglement entropy of 2D interface CFT using the replica method. Unlike the case of boundary CFT, we consider the boundary OPE (BOPE) of the Rényi twist operator and find a boundary twist operator anchored on the interface. This approach gives the $O(1)$ contribution to the entanglement entropy in terms of the BOPE coefficients of the twist operator. We further analyze entanglement entropy of different intervals and compare our findings with previous holographic results.", "url": "https://arxiv.org/abs/2605.01150", "type": "理论", "summary": "1. 该工作采用复制方法，通过扭转算符的边界算子乘积展开，解析研究了二维界面共形场论中纠缠熵的若干核心特征。\n2. 其卖点在于揭示锚定在界面上的边界扭转算符主导了纠缠熵的O(1)贡献，该贡献由BOPE系数严格确定。\n3. 这为阐明界面CFT中纠缠熵的边界普适结构以及与之对应的全息引力描述提供了清晰的理论路径。", "summary_source": "deepseek", "authors": [{"name": "Mianqi Wang"}], "featured_authors": [{"name": "Mianqi Wang"}], "author_count": 1}, {"id": "2605.01321", "category": "hep-th", "title": "Exact WKB and Quantum Periods for Extremal Black Hole Quasinormal Modes", "abstract": "We apply exact WKB analysis to the spectral problem arising in black hole perturbation theory. The boundary conditions for quasinormal modes lead to exact quantization conditions for the complex frequencies. To solve these conditions, one needs to evaluate the so-called quantum periods, or Voros symbols. For scalar perturbations of extremal Reissner--Nordström and Kerr black holes, we compute these quantities up to very high orders in the WKB expansion and perform Borel--Padé resummation. The resulting resummed quantization conditions successfully reproduce the correct quasinormal mode frequencies with high precision.", "url": "https://arxiv.org/abs/2605.01321", "type": "理论", "summary": "1. 本文将精确WKB分析应用于黑洞扰动理论，求解极值Reissner–Nordström与Kerr黑洞标量扰动准正规模式的量子周期（Voros符号）。\n2. 其核心在于通过高阶WKB展开并实施Borel–Padé求和，得到精确的量化条件，从而高精度复现准正规模式复频率。\n3. 该工作为黑洞准正规模式及其他引力谱问题提供了一种解析可控、可系统改进的高精度计算方法。", "summary_source": "deepseek", "authors": [{"name": "Yasuyuki Hatsuda"}, {"name": "Tomohito Shiga"}], "featured_authors": [{"name": "Yasuyuki Hatsuda"}, {"name": "Tomohito Shiga"}], "author_count": 2}, {"id": "2605.01453", "category": "hep-th", "title": "Hidden gauge invariance", "abstract": "The role of gauge invariance is reconsidered by \"deriving it without assuming it\" within an autonomous approach to interactions of Standard Model particles. In this approach, the renormalizable interactions are purely constrained by quantum principles, notably the representation on a Hilbert space. It is shown that - surprisingly - most interactions fulfilling the constraints enjoy a \"hidden\" gauge invariance (uncovered via redefinitions of quantum fields). The hidden gauge invariance is exact and unbroken even in the presence of massive vector bosons. While the Hilbert space formulation requires the use of \"string-localized interactions\", its role is to secure that S-matrices are string-independent, and in fact coincide with S-matrices with local interactions from the gauge theory approach on indefinite state spaces. Thus, particle physics with massless and massive vector bosons can be understood without neither indefinite state spaces nor ghosts.", "url": "https://arxiv.org/abs/2605.01453", "type": "理论", "summary": "1. 该工作通过不预设规范对称性的自主方法，从量子原理和希尔伯特空间表示出发重新约束标准模型粒子的可重整化相互作用。\n2. 其技术要点在于发现大多数满足约束的相互作用仅通过场重定义即可揭示出精确且不破缺的隐藏规范对称性，即便存在有质量矢量玻色子。\n3. 这为理解无质量与有质量矢量玻色子的粒子物理提供了无需不定度规空间或鬼场的替代路径，并凸显弦局域相互作用在保证S矩阵弦独立性中的核心作用。", "summary_source": "deepseek", "authors": [{"name": "Karl-Henning Rehren"}], "featured_authors": [{"name": "Karl-Henning Rehren"}], "author_count": 1}, {"id": "2605.01584", "category": "hep-th", "title": "Reductions in Khovanov-Rozansky operator formalism", "abstract": "Sophisticated Khovanov-Rozansky (KhR) description of knot invariants in the fundamental representation can be reformulated in terms of bicomplex with a simple physical meaning. Namely, the counterintuitive matrix factorization is substituted by simple operators $D$, locally constructed for every MOY resolution of a link diagram, which becomes nilpotent when the diagram has no external lines. Operators for different resolutions are related by equally simple conjugations $\\chi^{(\\pm)}$. The KhR procedure then splits in two steps - defining ``vertical'' cohomologies of $D$, which are associated with particular resolutions and will be put at vertices of the hypercube, and conjugations $\\chi^{(\\pm)}$, that define morphisms along its edges. As usual, standard combinations of morphisms are nilpotent, and one can define ``horizontal'' cohomologies - which are then combined into Poincaré polynomial, called KhR polynomial in application to links. This construction remains global in the sense that resulting cohomologies depend on the entire link diagram, but all its building blocks, including the operators and morphisms are local in the sense that they are defined for its particular vertices. Sometimes, this allows simple local reductions, allowing to eliminate or change particular vertices or sets of those. Along with the obvious case of Reidemeister equivalencies this happens also for antiparallel-lock tangles, what is responsible for simplification of bipartite calculus. In the $N=2$ and arbitrary $N$ bipartite cases, one can also provide global reductions transferring the local construction of the KhR double-complex to the global construction of the Khovanov(-like) single-complex.", "url": "https://arxiv.org/abs/2605.01584", "type": "理论", "summary": "1. 该工作将基本表示中纽结不变量的Khovanov-Rozansky形式体系重构为具有清晰物理意义的双复形，用局部算符D和共轭χ取代矩阵分解。\n2. 其技术核心在于算符和态射的局部构造使反平行锁扣等结构可局部简化，并在二色图情形下实现从局部双复形到全局单复形的全局约化。\n3. 这为纽结不变量的代数计算提供了可约化的局部框架，有望推广至更高秩表示并关联更广泛的拓扑量子场论。", "summary_source": "deepseek", "authors": [{"name": "D. Galakhov"}, {"name": "E. Lanina"}, {"name": "A. Morozov"}], "featured_authors": [{"name": "D. Galakhov"}, {"name": "E. Lanina"}, {"name": "A. Morozov"}], "author_count": 3}, {"id": "2605.01661", "category": "hep-th", "title": "Higher-derivative $\\mathcal{N}=1$ and $\\mathcal{N}=2$ supersymmetric Maxwell-Chern-Simons theories at one loop in superspace", "abstract": "We define a higher-derivative generalization of Maxwell-Chern-Simons theory in $\\mathcal{N}=1$ and $\\mathcal{N}=2$ superspaces. In particular, the chosen higher-derivative operator is a polynomial function of the d'Alembertian of arbitrary degree, and it is introduced exclusively in the gauge sector. The main goal is to explicitly compute the one-loop quantum corrections to the superfield effective potential for these theories. This is carried out by means of background field quantization in a higher-derivative $R_\\xi$ gauge. The effective potential is obtained in closed form and expressed in terms of the roots of polynomial functions.", "url": "https://arxiv.org/abs/2605.01661", "type": "理论", "summary": "1. 该工作在一圈阶计算了N=1和N=2超对称高阶导数Maxwell-Chern-Simons理论的超场有效势。\n2. 其技术卖点在于采用背景场量子化和高阶导数R_ξ规范，将有效势闭式表达为达朗贝尔算子多项式根的泛函。\n3. 这一结果非微扰地揭示了高阶导数规范理论在超对称框架下的量子结构，为相关红外行为的分析提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "F. S. Gama"}], "featured_authors": [{"name": "F. S. Gama"}], "author_count": 1}, {"id": "2605.01784", "category": "hep-th", "title": "A Non-local \"Boundary'' Term for Two-Point Amplitudes in String Field Theory", "abstract": "We propose a new ``boundary'' term in free bosonic string field theory. Here, the term ``boundary'' refers to a contribution introduced to restore the cyclicity broken by the insertion of a stringy step-function operator, although it is not strictly localized as it involves an operator that selects positive-energy modes. We construct this term as a bilinear form involving the commutator of the BRST operator with the step-function operator. The resulting action has a well-defined variational principle. When evaluated on on-shell string fields, the proposed term reproduces the correct tree-level two-point amplitude for both open and closed strings. We verify this explicitly in the tachyon and massless sectors.", "url": "https://arxiv.org/abs/2605.01784", "type": "理论", "summary": "1. 该工作为自由玻色子弦场论提出一个新的非局域“边界”项，以修复由弦性阶跃函数算子插入所破坏的循环性。\n2. 其技术核心在于利用BRST算子与阶跃函数算子的对易子构造双线性形式，使作用量具有良定义的变分原理。\n3. 该项在壳弦场上准确再现开弦与闭弦的树级两点振幅（含快子与无质量扇区），为弦场论边界项的一致处理提供启发。", "summary_source": "deepseek", "authors": [{"name": "Yasu Gen"}, {"name": "Hiroaki Matsunaga"}, {"name": "Jojiro Totsuka"}], "featured_authors": [{"name": "Yasu Gen"}, {"name": "Hiroaki Matsunaga"}, {"name": "Jojiro Totsuka"}], "author_count": 3}, {"id": "2605.01966", "category": "hep-th", "title": "Confinement of Massive Ghost in Quadratic Gravity", "abstract": "In the framework of the covariant canonical formalism of quadratic gravity, we consider the problem of confinement of massive ghost which violates the unitarity of the physical S-matrix. It is shown that if there is a bound state between the massive ghost and Faddeev-Popov ghost the massive ghost is confined in the zero-norm states through the BRST quartet mechanism, thereby the unitarity being restored. Based on the superfield formulation by Bonora and Tonin, we show that the asymptotic field of the massive ghost must be a massive dipole whereas that of the bound state obeys a massive Klein-Gordon equation. This situation may be of some similarity to color confinement in quantum chromodynamics (QCD) where it is conjectured that not a massless but a massive gluon is in fact confined.", "url": "https://arxiv.org/abs/2605.01966", "type": "理论", "summary": "1. 该工作运用二次引力的协变正则形式，研究违背幺正性的有质量鬼禁闭问题。\n2. 其核心在于通过BRST四重态机制将有质量鬼束缚于零范数态中，使渐近场变为有质量偶极子从而恢复幺正性。\n3. 这种禁闭机制暗示可能存在与量子色动力学中质量不为零的胶子禁闭相类似的结构。", "summary_source": "deepseek", "authors": [{"name": "Ichiro Oda"}], "featured_authors": [{"name": "Ichiro Oda"}], "author_count": 1}, {"id": "2605.02013", "category": "hep-th", "title": "All DDF/lightcone two-particle decay widths up to level $8$ in open bosonic string in critical dimension", "abstract": "We carry out an ``experimental analysis'' in which we explicitly compute all possible Abelian two-particle decay channels (excluding the tachyon) of open bosonic massive states up to level (8), amounting to approximately 2,000,000 cases. The aim is to develop intuition about which states are the most stable and to identify the dominant decay channels. Our results show that, for all levels considered, the ratio of decay widths between the slowest- and fastest-decaying states is of order one. In most cases, the dominant polarized decay channel accounts for at least $10\\%$ of the total decay width, while the first five channels together contribute roughly 60%. Even when we sum about $10000$ polarized channels. Dominant polarized channels always involve at least one photon and all strings ultimately decay into a photon carrying energy at the string scale. The most stable states are made using the DDF/lightcone oscillators $A_{-1}$ and some $A_{-2}$ and are close relatives of the states on the leading Regge trajectory. Finally, we discuss how the computation on the lightcone differs from the equal-time computation due to ``surges'', i.e., decays into a tachyon and a higher-mass state, and we hypothesize that, in bosonic string theory, decays into tachyons constitute the dominant decay channels.", "url": "https://arxiv.org/abs/2605.02013", "type": "理论", "summary": "1. 该工作显式计算了临界维开放玻色弦中从第1至第8能级所有阿贝尔两粒子衰变道（约200万种情形），排除了快子态。\n2. 其物理发现是慢速与快速衰变态的宽度比始终为量级1，主导极化道总包含一个携带弦尺度能量的光子，且该道贡献至少占总宽度的10%。\n3. 这揭示了光锥与等时计算因“激增”效应（衰变到快子及更高质量态）的差异，并推测衰变到快子是玻色弦理论的主导衰变道。", "summary_source": "deepseek", "authors": [{"name": "Samuele Critelli"}, {"name": "Igor Pesando"}], "featured_authors": [{"name": "Samuele Critelli"}, {"name": "Igor Pesando"}], "author_count": 2}, {"id": "2605.02373", "category": "hep-th", "title": "Geometric QCD III: Exact transition amplitudes and the glueball spectrum", "abstract": "We complete the analysis of planar Makeenko--Migdal loop equations in the continuum limit. Using the confining twistor-string representation, we compute the quantum fluctuation determinant. In Minkowski space, this reduces to a discrete product of finite-dimensional matrix quadratures. The $\\zeta$-regularized weight is independent of winding number $w$. Near the mass shell, the pole singularity is generated by $w \\to \\infty$, suppressing fluctuation variance as $1/w$. The path integral localizes on the classical trajectory, rendering the pole spectrum and transition residues parametrically exact in the large-$w$ WKB this http URL the open-string meson sector, we fit 40 states across five topological sectors ($h=0, \\pm 1, \\pm 2$). The holonomy shift $h$ dictates exact geometric degeneracies between parity families, reproducing mass splittings without phenomenological spin-orbit parameters. Evaluated one-loop residues yield relative transition cross-sections, demonstrating nontrivial topology- and flavor-dependent scaling that captures heavy-mass quenching and phase-space enhancement for high-spin light this http URL the pure Yang--Mills closed string, we demonstrate dynamical stability of the pure-gauge minimal surface in the planar limit: the conformal Liouville anomaly drives the string strictly to the trigonometric minimum ($q=0$). The complex elliptic geometry analytically collapses, yielding linear Regge trajectories. The translation zero-mode measure dynamically nullifies the transition amplitude of the massless scalar ghost, providing an explicit analytic mechanism for a purely gluonic mass gap. Anchoring parameter-free glueball trajectories to the string tension natively recovers the L\"uscher intercept $\\alpha(0)=1/12$, yielding a macroscopic spectrum that provides a suggestive baseline for established PDG unassigned isoscalar candidates.", "url": "https://arxiv.org/abs/2605.02373", "type": "理论", "summary": "1. 该工作完成了平面Makeenko–Migdal圈方程在连续极限下的完整分析，利用约束扭弦表示计算量子涨落行列式，得到精确跃迁振幅与胶球谱。\n2. 其主要卖点在于：闵氏空间中涨落权重经ζ正则化与绕数w无关，近质壳极点由w→∞生成且方差受1/w抑制；开弦扇区holonomy位移h决定奇偶族间精确几何简并；闭弦扇区共形Liouville反常驱动弦至三角极小值，零模测度动态湮灭无质量标量鬼，从而解析给出纯杨-米尔斯质量隙机制。\n3. 所得无参数胶球轨迹天然恢复Lüscher截距α(0)=1/12，为PDG未分配同位旋标量候选者提供可检验基线，并开拓了非微扰QCD几何动力学的精确解析路径。", "summary_source": "deepseek", "authors": [{"name": "Alexander Migdal"}], "featured_authors": [{"name": "Alexander Migdal"}], "author_count": 1}, {"id": "2605.02422", "category": "hep-th", "title": "Functional Renormalization Group for a Rank-4 Renormalizable Tensorial Group Field Theory with Derivative Necklace Couplings", "abstract": "We apply the functional renormalization group to an Abelian Group Field Theory extended beyond the branched-polymer (melonic) sector by including interactions that are subdominant from a power-counting perspective but enhanced by derivative couplings. Focusing on a rank-4 model, we consider a class of non-melonic interactions with a necklace structure. Due to their index contraction pattern, their leading-order behavior is analogous to that of large-N random matrix models and is associated with a planar graph structure. Within this setting, we identify the emergence of a nontrivial ultraviolet fixed point, reminiscent of mechanisms previously observed in matrix models, and discuss its reliability within the present truncation. The robustness of this fixed point will be further investigated through modified Ward identities, following strategies previously developed in the melonic sector.", "url": "https://arxiv.org/abs/2605.02422", "type": "理论", "summary": "1. 该工作对包含导数项链耦合的可重整化秩四张量群场论应用泛函重整化群，将分析扩展至非melon相互作用扇区。\n2. 其卖点在于揭示项链型指标收缩导致平面图结构主导非melon相互作用的领头阶，从而在该截断下识别出类似大N随机矩阵的非平凡紫外固定点。\n3. 该固定点的鲁棒性将通过修正Ward恒等式进一步检验，这为探索张量群场论中紫外完备性及非melon扇区重整化流提供了新路径。", "summary_source": "deepseek", "authors": [{"name": "Seke Fawaaz Zime Yerima"}, {"name": "Vincent Lahoche"}, {"name": "Dine Ousmane Samary"}], "featured_authors": [{"name": "Seke Fawaaz Zime Yerima"}, {"name": "Vincent Lahoche"}, {"name": "Dine Ousmane Samary"}], "author_count": 3}, {"id": "2605.02446", "category": "hep-th", "title": "Quantum scars from holographic boson stars", "abstract": "Quantum many-body scars are atypical nonthermal states embedded in the chaotic spectrum that evade conventional ergodicity. We show that asymptotically AdS mini-boson stars provide a holographic realization of scar-like states. Their spectrum exhibits random-matrix signatures of chaos while supporting embedded integrable spectral branches. The full holographic system, including black holes, is generically chaotic with most eigenstates satisfying the eigenstate thermalization hypothesis; in contrast, the boson star macrostate probes an approximately integrable subsector within this chaotic spectrum, signaling scarred spectral structures. Boson stars further display anomalously low entanglement relative to black holes at the same energy density, and also robust revivals in Krylov complexity, revealing nonergodic dynamics. These spectral, entanglement, and dynamical diagnostics provide unified evidence for holographic quantum scars in a self-gravitating system. Our work suggests a new connection between many-body scar physics, quantum chaos, and horizonless gravitational dynamics.", "url": "https://arxiv.org/abs/2605.02446", "type": "理论", "summary": "1. 该工作在全息对偶框架下，利用渐近AdS mini-玻色子星构造了量子多体疤痕态的非热谱实现。\n2. 其核心在于揭示该宏观态在混沌随机矩阵谱中嵌入可积分支，且展现出异常低的纠缠熵与Krylov复杂度周期复苏等非遍历动力学特征。\n3. 这为理解无视界引力系统中疤痕物理、量子混沌与非遍历行为之间的深层联系提供了统一理论图景。", "summary_source": "deepseek", "authors": [{"name": "Yan Liu"}, {"name": "Ya-Wen Sun"}, {"name": "Yuan-Tai Wang"}], "featured_authors": [{"name": "Yan Liu"}, {"name": "Ya-Wen Sun"}, {"name": "Yuan-Tai Wang"}], "author_count": 3}, {"id": "2605.02523", "category": "hep-th", "title": "Kerr-de Sitter Black Holes: Quantum Aspects and Cosmic Censorship Conjecture", "abstract": "In this article, we test the validity of the weak cosmic censorship conjecture (wCCC) in the background of a quantum Kerr-de Sitter (qKdS) black hole, incorporating exact backreaction from quantum matter fields. Using a test particle approach, we analyze whether an extremal qKdS black hole can be over-extremized to expose a naked singularity. Our results indicate that the black hole remains stable against horizon-destroying processes induced by infalling matter. Quantum corrections enhance the horizon's robustness rather than destabilize it, offering further evidence that wCCC remains preserved in the presence of quantum effects.", "url": "https://arxiv.org/abs/2605.02523", "type": "理论", "summary": "1. 该工作采用测试粒子方法，检验了量子Kerr-de Sitter黑洞中弱宇宙监督猜想的有效性。\n2. 其核心在于纳入量子物质场的精确反作用，发现量子修正增强了事件视界稳定性，阻止极端黑洞过度极端化而暴露裸奇点。\n3. 这为宇宙监督猜想在包含宇宙学常数和量子效应的旋转黑洞背景下仍然成立提供了新证据，启发对黑洞热力学与量子引力的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Ankit Anand"}, {"name": "Ankur Dey"}], "featured_authors": [{"name": "Ankit Anand"}, {"name": "Ankur Dey"}], "author_count": 2}, {"id": "2605.02570", "category": "hep-th", "title": "Revisiting semiclassical scalar QED in 1+1 dimensions", "abstract": "We study the backreaction of a charged scalar quantum field in the presence of two opposite charges placed at the boundaries of a finite one-dimensional region, with attention to boundary effects. We review, correct, and extend previous corresponding work of Ambjørn \\& Wolfram \\cite{ambjorn_properties_1983}. Despite notable differences, our analysis confirms the mechanism, discussed by Ambjørn \\& Wolfram, by which the incorporation of backreaction avoids certain instabilities. We also observe the interesting phenomenon of ``over-screening'', by which for high external charges an increase of the external charges leads to a decrease of the electric field between the two charges.", "url": "https://arxiv.org/abs/2605.02570", "type": "理论", "summary": "1. 该工作重新审视了1+1维半经典标量量子电动力学中带电标量场对边界上两个相反电荷的反作用，并纠正和扩展了早期文献。\n2. 其核心发现在于证实反作用可避免特定不稳定性，并揭示了“过屏蔽”现象：高外部电荷时，电场强度随电荷增加反而下降。\n3. 这为深入理解低维量子场论中的边界效应和非线性屏蔽机制提供了关键启发，并可推广至半经典QED框架。", "summary_source": "deepseek", "authors": [{"name": "Santiago Sanz-Wuhl"}, {"name": "Jochen Zahn"}], "featured_authors": [{"name": "Santiago Sanz-Wuhl"}, {"name": "Jochen Zahn"}], "author_count": 2}, {"id": "2605.02792", "category": "hep-th", "title": "Albertian Channel Memory in Black-Hole Evaporation", "abstract": "The AMPS paradox assumes a globally associative tensor-product stage for the early radiation, the exterior Hawking mode, and the interior partner. We study a retained attractor sector of octonionic magical supergravity whose horizon symbols form the Albert algebra J3(O). This induces an Albertian algebraic-quantum description: states are positive normalized functionals, events are Jordan idempotents, reversible motions are algebra automorphisms, and ordinary quantum mechanics is recovered on associative readout blocks. Peirce theory then splits the horizon data into a hidden exceptional complement, an interface relay, and a two-helicity exterior detector. Eliminating the relay gives a source-fixed Volterra memory law on a neutral-source fixed-charge Reissner--Nordstrom evaporation trajectory. In real time, the leading one-time occupation follows the sourced evaporation clock, while the retained-memory imprint appears as a spectral-overlap connected two-time coherence of windowed helicity/Stokes observables in the emitted history. In Euclidean time, the Peirce--Volterra kernel becomes a transfer kernel with two branchwise superstatistical limits: a regular-opening Tsallis/Lomax onset and a near-extremal shifted-Levy residence branch. The lower admissible envelope of the endpoint actions then reconstructs the Page-curve envelope. The result is an ordinary emitted readout with exceptional memory, not a restored AMPS tensor factorization.", "url": "https://arxiv.org/abs/2605.02792", "type": "理论", "summary": "1. 该工作利用Albert代数与Peirce分解构建黑洞蒸发的代数量子描述，在八元数超引力框架下研究辐射记忆效应。\n2. 其技术核心在于通过Peirce理论将视界数据拆解为隐藏例外补集、界面中继与双螺旋外部探测器，并导出源固定Volterra记忆律，在实时与欧几里得时间下分别得到单次占据谱与双支超统计极限。\n3. 这一框架以非张量积的例外记忆形式重构Page曲线，为超越AMPS佯谬的因子化假设提供了基于代数量子理论的替代方案。", "summary_source": "deepseek", "authors": [{"name": "Rafael B. Frigori"}], "featured_authors": [{"name": "Rafael B. Frigori"}], "author_count": 1}, {"id": "2605.02847", "category": "hep-th", "title": "Landau levels via Jordan superalgebras", "abstract": "The goal of this note is to show that Jordan algebras and superalgebras provide an elegant and concise language for formulating quantum mechanical problems with inherent (super)conformal symmetry. The superconformal symmetries of the quantum MICZ-Kepler model and its dual oscillator realization in ${\\mathbb R}^2$ are reviewed through the lens of the Tits-Kantor-Koecher correspondence: Kaplansky ${\\mathfrak J} {\\mathbb R}^{1|2}$ and Exceptional ${\\mathfrak J} F^{6|4}$ Jordan superalgebras provide a natural framework for reconstructing (variously extended) superconformal algebras hidden in the Landau levels of an electron in an external magnetic field.", "url": "https://arxiv.org/abs/2605.02847", "type": "理论", "summary": "1. 该工作基于Tits-Kantor-Koecher对应，利用Kaplansky 𝔍ℝ^(1|2)与Exceptional 𝔍F^(6|4) Jordan超代数，构造了描述电子在外部磁场中朗道能级所隐藏的扩展超共形代数，并统一重构了量子MICZ-Kepler模型及其对偶谐振子实现的超共形对称性。\n2. 其核心卖点在于通过Jordan超代数的代数结构自然捕捉了朗道能级系统的超共形对称性，从而揭示了MICZ-Kepler问题、对偶谐振子与电子朗道能级之间的深层代数联系。\n3. 这一数学框架为研究其他具有超共形对称性的量子系统提供了严格代数工具，并对探索几何量子霍尔效应等凝聚态现象中对称性结构具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Alessio Marrani"}, {"name": "Todor Popov"}], "featured_authors": [{"name": "Alessio Marrani"}, {"name": "Todor Popov"}], "author_count": 2}, {"id": "2605.02878", "category": "hep-th", "title": "Finite-temperature operator basis on $\\mathbb{R}^3 \\times S^1$ for SMEFT", "abstract": "We present the first complete non-redundant operator basis for the Standard Model Effective Field Theory (SMEFT) at finite temperature, using the imaginary-time formalism. By employing the Hilbert series method on the space-time manifold $\\mathbb{R}^3 \\times S^1$, we classify all effective operators up to dimension-six. In constructing the basis, we consistently impose integration-by-parts and equations-of-motion constraints along spatial directions. We further analyze the impact of additional constraints, including the vanishing of the curl of the electric and magnetic fields and gauge choices for the temporal components on an operator basis. We also express them in terms of static three-dimensional spatial and zero-temperature SMEFT operators. At dimension five and six, we identify intrinsically thermal operators that vanish in zero temperature. Our framework is fully general and extends to arbitrary mass dimension and compact connected internal symmetry groups.", "url": "https://arxiv.org/abs/2605.02878", "type": "理论", "summary": "1. 该工作首次在有限温度下对标准模型有效场论(SMEFT)建立完整非冗余算符基，利用虚时形式在流形ℝ³×S¹上通过希尔伯特级数方法分类至维度六。\n2. 其技术要点是沿空间方向一致施加分部积分与运动方程约束，并额外分析电场磁场旋度为零及时分量规范选择的影响，将算符表达为静态三维和零温SMEFT形式。\n3. 此框架完全通用，可推广至任意质量维度与紧致连通内对称群，为热场论及早期宇宙有效场论研究提供系统基础。", "summary_source": "deepseek", "authors": [{"name": "Joydeep Chakrabortty"}, {"name": "Bruno Siqueira Eduardo"}, {"name": "Siddhartha Karmakar"}, {"name": "Philipp Schicho"}], "featured_authors": [{"name": "Joydeep Chakrabortty"}, {"name": "Bruno Siqueira Eduardo"}, {"name": "Siddhartha Karmakar"}, {"name": "Philipp Schicho"}], "author_count": 4}, {"id": "2605.02883", "category": "hep-th", "title": "de Sitter Vacua & pUniverses", "abstract": "We analyze a simple extension of the Schwinger model, which we refer to as the $p$-Schwinger model, on a de Sitter background. In this theory, the charged massless fermions carry non-unit integer charge $p$. In Minkowski space, the $p$-Schwinger model has discrete zero- and one-form global symmetries that are spontaneously broken, yielding $p$ degenerate ground states. We demonstrate that these features persist upon placing the $p$-Schwinger model on a global de Sitter background, establishing that such discrete global symmetries can be spontaneously broken for quantum field theories in de Sitter space. In particular, the theory is endowed with $p$ distinct, but locally-indistinguishable, de Sitter invariant states, the de Sitter vacua, satisfying the Hadamard property. We couple a variant of the $p$-Schwinger model with ${\\rm N}_{\\rm f}$ flavors to quantum gravity with $\\Lambda>0$, and demonstrate the existence of a semiclassical de Sitter saddle at large ${\\rm N}_{\\rm f}$. In the gravitational theory, the $p$ de Sitter invariant vacua are speculatively interpreted as microstates of the de Sitter horizon in the low-energy effective field theory.", "url": "https://arxiv.org/abs/2605.02883", "type": "理论", "summary": "1. 该工作分析了de Sitter背景上带整数电荷p的p-Schwinger模型，证明了离散零形式和单形式全局对称性在该时空中可自发破缺。\n2. 其核心卖点在于揭示了p个满足Hadamard性质且局域不可区分的de Sitter不变真空态，并在将多味版本耦合到正宇宙常数量子引力后于大N_f极限下找到半经典de Sitter鞍点。\n3. 这为将de Sitter真空态视作de Sitter视界低能微观态提供了理论启发，有助于理解量子引力中离散对称性破缺与真空简并的关联。", "summary_source": "deepseek", "authors": [{"name": "Jeremias Aguilera-Damia"}, {"name": "Dionysios Anninos"}, {"name": "Tarek Anous"}, {"name": "Johnny Gleeson"}, {"name": "Alan Rios Fukelman"}], "featured_authors": [{"name": "Jeremias Aguilera-Damia"}, {"name": "Dionysios Anninos"}, {"name": "Tarek Anous"}, {"name": "Johnny Gleeson"}, {"name": "Alan Rios Fukelman"}], "author_count": 5}, {"id": "2605.02885", "category": "hep-th", "title": "Open-Closed-Open Triality Beyond Matrix Models", "abstract": "We explore the ideas of open-closed-open triality within twisted holography. Starting from two transverse stacks of branes in the B-model on the resolved conifold, we obtain two equivalent open string descriptions. Both are full-fledged field theories. In the appropriate limit, they simplify to gauged $\\beta\\gamma$-systems with determinant insertions, as expected from open string field theory. The $\\rho$-matrix models that have appeared previously in the literature appear from an on-shell analysis of the field-theory actions. Most importantly, we show that the effective potential generated by integrating out the open strings on the other stack of branes exactly captures their backreaction on the geometry. In particular, we match the action of the probe branes to that of giant gravitons in the $\\textit{deformed}$ conifold. The second open string description of the triality thus directly diagnoses the emergent bulk spacetime.", "url": "https://arxiv.org/abs/2605.02885", "type": "理论", "summary": "1. 该工作通过扭结全息对偶，在B模型解析锥形上从两支横向膜堆出发，构建了开-闭-开三重性的两个等价开弦场论描述。\n2. 其核心在于证明积分掉一侧膜堆开弦产生的有效势精确捕获了对几何的反反应，并将探针膜作用匹配到变形锥形中的巨引力子。\n3. 这为超越矩阵模型的三重性框架提供了体时空涌现的直接诊断，启发从开弦场论出发构造非微扰全息对偶。", "summary_source": "deepseek", "authors": [{"name": "Edward A. Mazenc"}, {"name": "Debmalya Sarkar"}], "featured_authors": [{"name": "Edward A. Mazenc"}, {"name": "Debmalya Sarkar"}], "author_count": 2}, {"id": "2605.01385", "category": "math-ph", "title": "The Haar measure of the $p$-adic rotation group $\\textrm{SO}(3)_p$ via nautical angles", "abstract": "We study the explicit construction of the Haar measure on the compact $p$-adic rotation group $\\textrm{SO}(3)_p$ by nautical (Cardano) parametrization. Exploiting its topological group isomorphism with $\\mathbb{H}_p^\\times/\\mathbb{Q}_p^\\times$ of $p$-adic quaternions modulo scalars, we derive the corresponding change of variables formulas and compute the associated Jacobian in the $p$-adic setting, which we combine with the known Haar measure on the multiplicative group of $p$-adic quaternions $\\mathbb{H}_p^\\times$. This yields an explicit formula for the normalized Haar measure on $\\textrm{SO}(3)_p$ in nautical coordinates, with a factorized density in the three angles. Our construction provides a concrete tool suited for applications of non-Archimedean models where an explicit angular description of invariant integration is required.", "url": "https://arxiv.org/abs/2605.01385", "type": "理论", "summary": "1. 该工作利用航海（Cardano）参数化显式构造了p进旋转群SO(3)_p上的Haar测度。\n2. 其关键在于通过p进四元数乘法群模标量群的拓扑群同构，推导变量替换公式并计算p进Jacobian，得到三个角度因子化密度的归一化测度。\n3. 这为需要显式角度积分的非阿基米德模型（如p进弦论或数论物理）中的不变积分提供了具体分析工具。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo Guglielmi"}, {"name": "Stefano Mancini"}, {"name": "Vincenzo Parisi"}, {"name": "Ilaria Svampa"}], "featured_authors": [{"name": "Lorenzo Guglielmi"}, {"name": "Stefano Mancini"}, {"name": "Vincenzo Parisi"}, {"name": "Ilaria Svampa"}], "author_count": 4}, {"id": "2605.01443", "category": "math-ph", "title": "A position dependent mass Hamiltonian and abstract ladder operators", "abstract": "We consider the Hamiltonian $H$ of a particle in one dimension with a position dependent mass for which we apply the recent strategy of the so-called {\\em abstract ladder operators}, in the attempt to find its eigenvalues and eigenvectors. We don't assume that $H$ is self-adjoint, while we focus on the case of a factorizable operator. We show then that pseudo-bosonic operators play a relevant role in this analysis, and we construct bi-coherent states attached to these operators. Explicit examples are discussed.", "url": "https://arxiv.org/abs/2605.01443", "type": "理论", "summary": "1. 该工作针对一维位置依赖质量哈密顿量，应用抽象阶梯算子方法求解其本征谱与本征态。\n2. 技术卖点在于放弃自伴性假设，借助伪玻色子算子和算子可因子化性质，构造对应的双相干态。\n3. 这为非自伴量子力学中的可解模型提供了新途径，并可能推广至其他位置依赖质量系统。", "summary_source": "deepseek", "authors": [{"name": "Fabio Bagarello"}, {"name": "Emanuele Balistreri"}, {"name": "Antonino Faddetta"}], "featured_authors": [{"name": "Fabio Bagarello"}, {"name": "Emanuele Balistreri"}, {"name": "Antonino Faddetta"}], "author_count": 3}, {"id": "2605.01887", "category": "math-ph", "title": "Properties of tensorial free cumulants", "abstract": "In the past two years, several points of view have been proposed to address the question of the generalization of the theory of free probability to random tensors with different invariances, and it is unclear at this point whether they lead to the same notions of tensorial free cumulants and freeness. One way to approach this problem, developed by Collins, Gurau and the second named author for local unitary invariant random tensors, relies on finite size quantities involving averages over the invariance group, and whose asymptotics naturally possess the properties expected for tensorial generalizations of free cumulants of arbitrary orders. At this point, this approach has only been carried out for certain distributions, and for a subset of the moments that define such theories, and a more systematic and exhaustive study is lacking. This is the program initiated in this paper: we link this approach to the one proposed by Nechita and Park; extend a number of their results as well as those of the aforementioned paper to arbitrary orders of fluctuations, thereby generalizing higher order free cumulants; push further the study of distributions with larger invariance groups; detail the link with the asymptotics of the free-energies of the tensor HCIZ and BGW integrals; and provide formulae for tensorial free cumulants of products of tensors. Another important question is that of the definition of concrete distributions whose tensorial free-cumulants take non-trivial values. We compute the tensorial free cumulants for Gaussian random tensors with non-trivial covariances, and show that they provide such examples.", "url": "https://arxiv.org/abs/2605.01887", "type": "理论", "summary": "1. 本文系统研究张量自由累积量的性质，连接了不同不变性下随机张量自由概率论的多种推广方案。\n2. 通过将有限群平均方法与渐近分析相结合，将高阶自由累积量推广至任意涨落阶数，并阐明了与张量HCIZ和BGW积分自由能的联系。\n3. 非平凡协方差高斯随机张量的自由累积量显式计算为具体分布提供了示例，有望推动张量自由概率论的进一步理论发展。", "summary_source": "deepseek", "authors": [{"name": "Thomas Buc-d'Alché"}, {"name": "Luca Lionni"}], "featured_authors": [{"name": "Thomas Buc-d'Alché"}, {"name": "Luca Lionni"}], "author_count": 2}, {"id": "2605.01983", "category": "math-ph", "title": "A constructive approach to generalized principal connections", "abstract": "We address the recently introduced notions of generalized principal bundle and generalized principal connection by keeping track of global geometric properties through local coordinate transformation laws. This approach leads us to introduce generalized principal bundle coordinates and to find their transformation laws. Besides, we show that any Lie group fiber bundle (and hence, in particular, any vector bundle) is a generalized principal bundle and we give a proof of the fact that any Lie group fiber bundle with connected typical fiber is an associated bundle to a suitable principal bundle. Moreover, we present a direct way to character
