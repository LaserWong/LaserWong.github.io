<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-05-05 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="eyebrow">arXiv Daily Digest · 2026-05-05</div>
      <h1>Daily ArXiv Selection</h1>
      <p>
        数据来自 arXiv 当天的 <code>cond-mat</code>、<code>hep-th</code>、<code>math-ph</code>、<code>quant-ph</code> 四个分类页，口径限定为 <code>New submissions</code>。
        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。
      </p>
      <div class="stats" id="stats"></div>

          <div class="chip-row" id="category-filters"></div>

        <div class="field">

        <div><a href="../index.html">返回归档</a></div>
      </div>
    </section>
    <section class="paper-grid" id="paper-grid"></section>
    <section class="empty" id="empty-state">没有匹配到结果，试试清空搜索词或恢复筛选。</section>

  <script>
    const papers = [{"id": "2605.00919", "category": "cond-mat", "title": "Scattering matrix elements and energy spectrum of one-dimensional hybrid PT-symmetric finite systems", "abstract": "In this work, we provide a complete description of the scattering matrix elements and electron energy spectrum in one dimensional PT-symmetric hybrid finite systems, using the characteristic determinant approach. We present an analytical formulation of the problem and obtain a closed-form expression for the energy spectrum of the system, consisting of a region of real potential (passive region) surrounded by regions of gain and loss on the left and right, respectively. It has been shown that under certain conditions and a specific ratio between the real and imaginary parts of the complex potentials, it is possible to find analytical expressions for the spectral singularities at which the scattering matrix elements of the hybrid structure tend to infinity at a specific real energy. Within the framework of the same approach, we present a compact analytical expression for the quantization condition that determines the energy spectrum of a model corresponding to the placement of a rigid lattice within a finite-sized box.", "url": "https://arxiv.org/abs/2605.00919", "type": "理论", "summary": "1. 该工作利用特征行列式方法，完整描述了一维PT对称混合有限系统的散射矩阵元与电子能谱。\n2. 核心在于给出能谱闭式表达式，并揭示在特定复势实虚部比值下谱奇点散射矩阵元发散的解析条件。\n3. 这为解析处理PT对称非厄米系统及刚性晶格有限盒模型的量子化条件提供了统一框架。", "summary_source": "deepseek", "authors": [{"name": "Vladimir Gasparian"}, {"name": "Esther Jódar"}, {"name": "Antonio Pérez-Garrido"}], "featured_authors": [{"name": "Vladimir Gasparian"}, {"name": "Esther Jódar"}, {"name": "Antonio Pérez-Garrido"}], "author_count": 3}, {"id": "2605.00958", "category": "cond-mat", "title": "The Mesoscopic Partition Function:A Combined Spatial and Phase-Space Cell Structure", "abstract": "We introduce a mesoscopic partition function for classical many-body systems based on a combined spatial and phase-space coarse-graining, replacing the canonical phase-space integral with a discrete sum over occupation numbers. The construction recovers the standard canonical partition function in the fine-graining limit. Our main result shows that factorisation of the mesoscopic partition function across spatial cells is equivalent to extensivity of the coarse-grained free energy, with deviations governed by inter-cell correlations quantifiable via mutual information. We derive a generalised Euler relation with a subextensive correction encoding boundary and correlation effects. Together, these results provide a unified framework linking coarse-graining, factorisation, and extensivity in mesoscopic thermodynamics.", "url": "https://arxiv.org/abs/2605.00958", "type": "理论", "summary": "1. 该工作引入基于空间与相空间联合粗粒化的经典多体系统介观配分函数，以离散占据数求和替代正则相空间积分。\n2. 其核心在于证明介观配分函数在空间元胞上的因子化等价于粗粒自由能的广延性，且偏离由互信息量化，并导出含亚广延修正的广义欧拉关系。\n3. 这为粗粒化热力学中关联效应、边界效应与广延性之间的统一量化提供了理论框架，可启发介观尺度上波动与系数修正的系统研究。", "summary_source": "deepseek", "authors": [{"name": "Bob Osano"}], "featured_authors": [{"name": "Bob Osano"}], "author_count": 1}, {"id": "2605.01033", "category": "cond-mat", "title": "Manipulation of electromagnetic wave propagation in quantum-spin-chain medium", "abstract": "We consider a simple model of one-dimensional magnetic crystal and examine the propagation of an electromagnetic wave through such a medium. Calculating the dispersion relation ${\\bf k}(\\omega)$ allows us to illustrate how the spread of the electromagnetic wave can be controlled by an external magnetic field. Our rigorous calculations should be useful for more realistic (and less tractable mathematically) models of magnetic media.", "url": "https://arxiv.org/abs/2605.01033", "type": "理论+数值", "summary": "1. 该工作提出一维量子自旋链介质模型，研究其电磁波传播并导出色散关系。\n2. 核心卖点在于揭示外磁场能可控调节电磁波传播特性，且解析结果具有严格性。\n3. 这为数学上更复杂的磁性介质建模及后续相关实验与理论研究提供了可靠基准。", "summary_source": "deepseek", "authors": [{"name": "Taras Krokhmalskii"}, {"name": "Taras Verkholyak"}, {"name": "Ostap Baran"}, {"name": "Dmytro Yaremchuk"}, {"name": "Taras Hutak"}, {"name": "Oleg Derzhko"}], "featured_authors": [{"name": "Taras Krokhmalskii"}, {"name": "Taras Verkholyak"}, {"name": "Ostap Baran"}, {"name": "Dmytro Yaremchuk"}, {"name": "Taras Hutak"}, {"name": "Oleg Derzhko"}], "author_count": 6}, {"id": "2605.01045", "category": "cond-mat", "title": "Understanding the lifetime of water with dynamic network analysis: the case of CsOH.H2O", "abstract": "We describe the atomic-level motions in caesium hydroxide monohydrate (CsOH$\\cdot$H$_2$O), which is a chemical compound containing layers of water and hydroxide ions. At this composition, each oxygen is involved in three hydrogen bonds which, in the hexagonal structure, form a quasi-2D honeycomb lattice. While oxygen and caesium atoms form a typical crystal lattice, the dynamics of the hydrogen atoms are more complex. Here we show that the covalent and hydrogen bonds are continually interconverting, meaning that the water and hydroxyl are interconverting by proton exchange. The order-disorder transition of the water and hydroxyl proceeds by chemical reaction rather than rotation or diffusion of the molecules. A hydrogen can rotate out of the layer, leaving a vacant site in the 2D layer. Such a hydrogen vacancy can diffuse rapidly by single molecule rotation, leading to fast-ionic conduction. The proton exchange leads to a novel type of Raman activity combining stretch and exchange processes, for which we develop a theoretical model. This would manifest in a broad single peak associated with both H$_2$O and OH stretches and a low frequency peak appearing at elevated temperature.", "url": "https://arxiv.org/abs/2605.01045", "type": "理论", "summary": "1. 该工作通过动态网络分析揭示了CsOH·H2O中水与氢氧根在准二维蜂窝晶格上的质子交换动力学，阐明水的寿命由共价与氢键的持续互变主导。\n2. 技术核心在于发现水-羟基序-无序转变经由化学反应而非分子旋转或扩散，且氢空位的单分子旋转扩散驱动快离子传导，并建立了耦合拉伸与交换过程的拉曼理论模型解释高温宽峰与低频峰。\n3. 这为理解层状氢键体系中质子跳跃与晶格振动的耦合机制提供了微观基础，对设计快离子导体及解析其光谱特征具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Graeme J. Ackland"}, {"name": "Ciprian G. Pruteanu"}, {"name": "John S. Loveday"}, {"name": "Keishiro Yamashita"}], "featured_authors": [{"name": "Graeme J. Ackland"}, {"name": "Ciprian G. Pruteanu"}, {"name": "John S. Loveday"}, {"name": "Keishiro Yamashita"}], "author_count": 4}, {"id": "2605.01115", "category": "cond-mat", "title": "Topological flat bands emerging at the inversion of stacking order in rhombohedral graphite", "abstract": "Motivated by the indications of high-Tc superconductivity in natural graphite enriched in the rhombohedral phase, we study the band structure of several stacking configurations that combine two of the three graphite structures as well as modifications of the rhombohedral sequence (from ABCABC... to CBACBA...), using first-principles calculations. We focus in particular on the possible emergence of flat bands near the Fermi level. When the two different rhombohedral orderings are combined, flat bands of topological origin emerge at the interface between the two domains, near the K and K' points of the Brillouin zone. Mapping a simple tight-binding model of a rhombohedral slab along the direction perpendicular to the graphene layers onto a Su-Schrieffer-Heeger chain provides a transparent understanding of the underlying physics.", "url": "https://arxiv.org/abs/2605.01115", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算，研究了菱方石墨中堆叠序反转界面处费米能级附近拓扑平带的形成机制。\n2. 其关键在于将垂直于石墨烯层的菱方板紧束缚模型映射到Su-Schrieffer-Heeger链，揭示了平带的拓扑起源。\n3. 该结果为菱方石墨中关联电子态与潜在高温超导机制的理解提供了理论依据，并启发在其他层状材料中探索类似拓扑平带。", "summary_source": "deepseek", "authors": [{"name": "R. Weht"}, {"name": "A. A. Aligia"}, {"name": "M. Nunez-Regueiro"}], "featured_authors": [{"name": "R. Weht"}, {"name": "A. A. Aligia"}, {"name": "M. Nunez-Regueiro"}], "author_count": 3}, {"id": "2605.01119", "category": "cond-mat", "title": "Berry-phase effect in single molecule magnets: analytical and numerical results", "abstract": "In this paper we theoretically and numerically investigate transport signatures of quantum interference on the current through a single molecule magnet transistor tunnel coupled to oppositely polarized leads in the presence of a local transverse and longitudinal magnetic field. Our calculations are based in a density matrix approach where we treat the ground state energy splitting induced by tunneling of the spin between different paths with the aid of perturbation theory. Using this approach we show that it is possible to use an effective Hamiltonian which describes the Berry phase interference as a function of the transverse magnetic field which completely blocks the current flow when we place the single molecule magnet between oppositely polarized leads. Finally, we use this effective Hamiltonian in an open source Python software (QmeQ) that allows us to calculate the current through the single molecule magnet with oppositely polarized leads tunnel coupled to the single molecule magnet. The analytical results are well reproduced by our numerical simulations.", "url": "https://arxiv.org/abs/2605.01119", "type": "理论+数值", "summary": "1. 本工作基于密度矩阵与微扰方法，理论并数值研究了置于反向极化电极间的单分子磁体晶体管中量子干涉导致的输运特征。\n2. 其核心在于通过有效哈密顿描述横向磁场诱导的Berry相位干涉，实现了对隧穿电流的完全阻塞。\n3. 该解析与数值模拟自洽的结果，为利用量子干涉效应调控单分子磁体自旋输运提供了明确理论依据。", "summary_source": "deepseek", "authors": [{"name": "Fco. Javier Anaya Garcia"}, {"name": "Daniel Salgado-Blanco"}, {"name": "Gabriel Gonzalez"}], "featured_authors": [{"name": "Fco. Javier Anaya Garcia"}, {"name": "Daniel Salgado-Blanco"}, {"name": "Gabriel Gonzalez"}], "author_count": 3}, {"id": "2605.01145", "category": "cond-mat", "title": "When Independent Gaussian Models Break Down: Characterizing Regime-Dependent Modeling Failures in $ϕ^4$ Theory", "abstract": "In practical physical systems, modeling assumptions of Gaussianity and basis independence break down due to self-interactions. We study a specific instance of one-dimensional $\\phi^4$ theory on a lattice, analyzing how the interaction strength and system size jointly affect the marginal and joint distributions of frequency-based representation of the field (i.e., Fourier modes). We find that models relying on Gaussian and independent Fourier modes fail primarily from structured dependencies rather than marginal non-Gaussianity, since individual modes become approximately Gaussian despite mode coupling growing with size. Based on this, we identify three distinct regimes that delineate where traditional methods remain effective and where more expressive models are needed. Our results provide a computationally simple diagnostic to establish when Gaussian models are insufficient, and establish a concrete design criterion that future nonlinear models must satisfy.", "url": "https://arxiv.org/abs/2605.01145", "type": "理论", "summary": "1. 该工作以一维格点φ⁴理论中场的傅里叶频域表示为对象，系统分析自相互作用强度与体系尺寸如何联合影响单个模式的边缘分布及模式间的联合分布，定量刻画了高斯且独立模式假设的失效规律。\n2. 其关键发现是：模式耦合随尺寸增强所产生的结构化依赖（而非单个模式的边际非高斯性）是高斯模型失败的主因；尽管耦合增强，单个模式仍保持近似高斯，据此将参数空间划分为传统方法有效、需修正与完全失效三个不同区域。\n3. 该结果为实际系统提供了计算简便的诊断判据以判定高斯建模是否充分，并明确了未来非线性模型必须满足的设计准则，即需全面捕获模式依赖结构，这为复杂统计建模指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Anish Bhat"}, {"name": "Ryo Ide"}, {"name": "Zihan Zhao"}], "featured_authors": [{"name": "Anish Bhat"}, {"name": "Ryo Ide"}, {"name": "Zihan Zhao"}], "author_count": 3}, {"id": "2605.01151", "category": "cond-mat", "title": "Threshold-Controlled Geometric Reorganization in 2D Bootstrap Percolation", "abstract": "Two-dimensional bootstrap percolation is usually characterized by bulk observables, but whether increasing the activation threshold qualitatively reorganizes the geometry of the absorbing state has remained unclear. Here we show that the response undergoes a threshold-controlled geometric crossover. At low thresholds, the extrema of bulk and boundary-sensitive observables remain confined to a single collective low-$p$ window. At high thresholds, they split into distinct branches, revealing multiple geometric response scales. Over the accessible system sizes, the dominant finite-size signatures shift from fluctuations of the final active density to non-singleton boundary observables, while the fluctuation peak itself decreases. Time-resolved mechanism traces show that this crossover is accompanied by a progression from extended collective propagation to frontier exhaustion and, at the highest threshold, to quasi-one-step stabilization. Our results identify boundary organization as the dominant structural signature of high-threshold bootstrap percolation and show that conventional bulk observables alone do not capture the full reorganization of the absorbing state.", "url": "https://arxiv.org/abs/2605.01151", "type": "理论+数值", "summary": "1. 该工作通过数值模拟揭示了二维自举逾渗中激活阈值升高导致吸收态几何结构发生定性重组，表现为响应从单一集体低p窗口分裂为多个几何尺度分支。\n2. 其核心技术卖点在于识别出主导有限尺寸特征从最终活性密度涨落转移到边界观测量，并伴随扩展集体传播到前沿耗尽乃至准单步稳定化的机制演变。\n3. 这指示边界组织是高阈值自举逾渗的核心结构签名，表明仅依靠体观测量无法完整描述吸收态重组，为逾渗理论中几何与响应尺度的关联研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Fangfang Wang"}, {"name": "Wei Liu"}, {"name": "Kai Qi"}, {"name": "Ying Tang"}, {"name": "Zengru Di"}], "featured_authors": [{"name": "Fangfang Wang"}, {"name": "Wei Liu"}, {"name": "Kai Qi"}, {"name": "Ying Tang"}, {"name": "Zengru Di"}], "author_count": 5}, {"id": "2605.01156", "category": "cond-mat", "title": "Rational Mechanics of Material Strength in Brittle Solids", "abstract": "Material strength is a classical concept with renewed importance in fracture mechanics, particularly in crack nucleation in brittle solids. We formulate material strength in finite elasticity and examine its geometric, constitutive, and symmetry-theoretic foundations. Spatial covariance requires a strength function to depend on both stress and the corresponding strain measure, so that strength is governed by the pair (stress,strain), not stress alone, and only then can representations based on different stress measures be consistently related, with classical stress-based criteria recovered as a special case. We analyze covariance under spatial diffeomorphisms and relate formulations based on the first Piola--Kirchhoff, second Piola--Kirchhoff, and Cauchy stresses. For stress-based criteria, we define the strength hypersurface as a subset of the constitutively admissible stress manifold and study the associated safe domain. Under standard regularity assumptions and the requirement that sufficiently large stresses are inadmissible, the strength surface is a smooth compact hypersurface of this manifold. For isotropic solids, we show that the safe domain is star-shaped under a proportional-reduction hypothesis. We extend the formulation to anelastic brittle solids, showing that residual stresses and eigenstrains modify the strength surface through the material metric, and discuss anisotropic strength via material symmetry. Finally, in the small-strain limit, the theory reduces to classical stress-based criteria.", "url": "https://arxiv.org/abs/2605.01156", "type": "理论", "summary": "1. 该工作将脆性固体的材料强度置于有限弹性框架下，系统建立其几何、本构与对称性基础。\n2. 其核心在于揭示空间协变性要求强度必须由应力与应变共同决定，不同应力表征的准则据此自洽关联，经典应力判据作为特例出现。\n3. 这为脆性断裂成核理论提供了协变性的统一描述，并可直接推广至各向异性、非弹性及有限应变情形。", "summary_source": "deepseek", "authors": [{"name": "Arash Yavari"}, {"name": "Aditya Kumar"}], "featured_authors": [{"name": "Arash Yavari"}, {"name": "Aditya Kumar"}], "author_count": 2}, {"id": "2605.01206", "category": "cond-mat", "title": "Phase-shift instanton approach to tunneling duality in Read--Rezayi state", "abstract": "We study the duality between quasi-particle and electron tunneling in point-contact geometries of fractional quantum Hall states. To treat non-Abelian edge operators, we introduce a \"phase-shift instanton\" that incorporates phase factors from primary fields into the instanton gas framework. Using this method, we reformulate the Moore--Read duality and obtain an explicit dual description for the $k=3$ Read-Rezayi state. Our results clarify how quasi-particle tunneling produces characteristic phase shifts in instantons and how these shifts map strong quasi-particle tunneling to weak electron tunneling. Based on this dual description, we analytically evaluate the non-linear differential conductance in the strong-coupling regime. We reveal that, due to the physical requirement that the tunneling particle across the vacuum gap must be a true fermion, the transport behavior universally converges to a $G \\propto V^4$ scaling for both the Moore--Read and Read--Rezayi states. This universal transport signature highlights a fundamental topological constraint underlying non-Abelian fractional quantum Hall edges.", "url": "https://arxiv.org/abs/2605.01206", "type": "理论+数值", "summary": "1. 该工作针对Read-Rezayi态中点接触几何的准粒子与电子隧穿对偶性，引入包含初级场相位因子的相移瞬子方法，以处理非阿贝尔边缘算符。\n2. 其卖点在于通过瞬子气体框架重构Moore-Read对偶并给出k=3 Read-Rezayi态的显式对偶描述，揭示隧穿粒子必须为真实费米子导致非线性微分电导普适收敛于G ∝ V^4标度。\n3. 这一普适输运特征源自非阿贝尔分数量子霍尔边缘的拓扑约束，为实验探测Read-Rezayi态及其对偶性质提供了可检验的理论预测。", "summary_source": "deepseek", "authors": [{"name": "Ryoi Ohashi"}, {"name": "Hiroki Isobe"}, {"name": "Ryota Nakai"}, {"name": "Kentaro Nomura"}], "featured_authors": [{"name": "Ryoi Ohashi"}, {"name": "Hiroki Isobe"}, {"name": "Ryota Nakai"}, {"name": "Kentaro Nomura"}], "author_count": 4}, {"id": "2605.01261", "category": "cond-mat", "title": "Loop expansion in polymer field theory: application to phase separation", "abstract": "Liquid-liquid phase separation underlies phenomena ranging from protein condensate formation to the phase coexistence of synthetic polymers. Although the random phase approximation (RPA) is widely used to predict such phase behavior, its quantitative accuracy for binodals of polymer solutions, particularly outside the high-density regime, remains incompletely characterized. Here, we develop a field theoretic loop expansion in homopolymer systems by identifying the inverse polymer density $\\rho^{-1}$ as the Planck constant $\\hbar$ in quantum field theory. We calculate the leading-order and next-to-leading-order corrections to the RPA free energy, denoted as RPA+ and RPA++, respectively. Testing the binodal predicted by the RPA+ against molecular dynamics simulations of bead-spring chains with Gaussian pair interactions, we find that the RPA+ qualitatively improves the dilute-phase coexistence density over the RPA, while the critical point error remains comparable to that of the RPA. Our results establish the loop expansion as a systematic route for refining the RPA-based binodal predictions for polymer phase separation.", "url": "https://arxiv.org/abs/2605.01261", "type": "理论+数值", "summary": "1. 该工作将环展开方法应用于聚合物场论，以密度倒数作为小参数，计算了RPA自由能的领头阶和次领头阶修正。\n2. 其技术亮点在于识别聚合物密度倒数与量子场论中普朗克常数的类比关系，从而对RPA进行系统化修正。\n3. 这为聚合物液液相分离中双节线的定量预测提供了可系统改进的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Kiyoharu Kawana"}, {"name": "Kyosuke Adachi"}], "featured_authors": [{"name": "Kiyoharu Kawana"}, {"name": "Kyosuke Adachi"}], "author_count": 2}, {"id": "2605.01286", "category": "cond-mat", "title": "Inverse Materials Design via Joint Generation of Crystal Structures and Local Electronic Descriptors", "abstract": "Inverse design of inorganic crystals, in which structures are generated to satisfy a target property while preserving diversity and physical plausibility, remains more demanding than ab initio generation, as property conditioning can degrade the structural quality that current generative models otherwise achieve. We propose a diffusion framework that jointly denoises crystal-structure variables and site-resolved local electronic descriptors through a shared score network. As representative descriptors, we adopt Bader charge and atomic density of states (atomic DOS). Under both band-gap and formation energy conditioned generation, the joint models achieved higher success rates than the structure-only baseline in most target conditions, while simultaneously increasing the fraction of generated structures that satisfy uniqueness, novelty, thermodynamic stability, and physical validity (VSUN criteria). A dummy-variable control confirms that these gains originate from the electronic content of the descriptors rather than from auxiliary site-wise variables. The generated Bader charges agree with DFT references with an MAE of 5.5e-2 e on stable structures, and the generated atomic DOS captures the coarse spectral profile of the DFT reference around the modal accuracy range, although finer details and accuracy vary with elemental species. These results establish local electronic descriptors as effective generative variables that serve two complementary roles: broadening the explored materials space through increased structural diversity, and mitigating the trade-off between property targeting and structural quality by guiding the structural trajectory toward electronically plausible configurations during joint denoising.", "url": "https://arxiv.org/abs/2605.01286", "type": "理论+数值", "summary": "1. 该工作提出一个扩散联合去噪框架，同步生成晶体结构变量与位点分辨局域电子描述符，实现目标性质约束下的无机晶体逆向设计。\n2. 关键卖点是利用Bader电荷与原子态密度作为生成变量，在带隙和形成能条件下，相比纯结构基线，显著提升符合VSUN标准结构的比例，且Bader电荷MAE仅5.5e-2 e。\n3. 这确立了局域电子描述符作为有效生成变量的角色，既能扩展材料空间，又能通过引导结构向电子合理构型演化，缓解性质调控与结构质量间的固有矛盾。", "summary_source": "deepseek", "authors": [{"name": "Ibuki Okuda"}, {"name": "Izumi Takahara"}, {"name": "Teruyasu Mizoguchi"}], "featured_authors": [{"name": "Ibuki Okuda"}, {"name": "Izumi Takahara"}, {"name": "Teruyasu Mizoguchi"}], "author_count": 3}, {"id": "2605.01360", "category": "cond-mat", "title": "Reservoir computing by thin film embedded with magnetic impurities", "abstract": "The reservoir computing based on the thin film embedded with magnetic impurities in the presence of the long-range (the dipole-dipole) interaction is numerically investigated. We simulated the magnetization dynamics by taking into account the dipole-dipole interaction and performed the handwritten-digit recognition task. Although the training data is prepared by taking spatial average in the sample, the high classification accuracy is achieved. Our result demonstrates that the long range interaction effectively encodes the complex spatial input pattern into the time domain, even when only a spatially averaged output is accessible. The proposed system paves the way for easily realizable magnetic reservoir computing.", "url": "https://arxiv.org/abs/2605.01360", "type": "理论+数值", "summary": "1. 该工作数值研究了嵌入磁性杂质的薄膜中长程偶极相互作用下的储层计算。\n2. 其卖点在于长程相互作用将空间输入模式编码到时域，仅用空间平均输出即实现高精度分类。\n3. 这为构建实验上易于实现的磁性储层计算系统提供了可行方案。", "summary_source": "deepseek", "authors": [{"name": "Shuto Kamakura"}, {"name": "Tomi Ohtsuki"}, {"name": "Jun-ichiro Ohe"}], "featured_authors": [{"name": "Shuto Kamakura"}, {"name": "Tomi Ohtsuki"}, {"name": "Jun-ichiro Ohe"}], "author_count": 3}, {"id": "2605.01366", "category": "cond-mat", "title": "Emergent Kinetic Constraints and Subspace Fragmentation in Rydberg Arrays", "abstract": "In a strongly interacting Rydberg atom array, the dynamics are often constrained to the decoupled Hilbert subspaces, representing an intriguing paradigm for nonergodicity. By considering a variable detuning of the global Rydberg coupling, we show that, not only is the existence of these Hilbert subspaces dependent on the interplay of detuning and interaction, but they are also strongly fragmented, with the fragment dimensions exhibiting various scaling behaviors with increasing system size. The resulting constrained dynamics of the system are thus governed by the dimension and connectivity of these fragments. We then adopt an auxiliary fermion description to reveal the underlying emergent kinetic constraints for the subspace fragmentation and fragment-confined dynamics. Our results provide a systematic understanding of Hilbert-space fragmentation in Rydberg arrays, and shed light on engineering nonergodic many-body dynamics beyond the PXP model.", "url": "https://arxiv.org/abs/2605.01366", "type": "理论", "summary": "1. 本研究通过调节全局里德伯耦合的失谐，揭示了强相互作用里德伯原子阵列中希尔伯特空间碎片化的涌现动力学约束及其标度行为。\n2. 采用辅助费米子描述，阐明了失谐与相互作用竞争导致的碎片维度标度律以及碎片内约束动力学机制。\n3. 该工作为理解非遍历多体动力学提供了系统框架，并启发在里德伯阵列中设计超越PXP模型的约束动力学。", "summary_source": "deepseek", "authors": [{"name": "Wen-Jie Geng"}, {"name": "Zhenming Zhang"}, {"name": "Wei Yi"}], "featured_authors": [{"name": "Wen-Jie Geng"}, {"name": "Zhenming Zhang"}, {"name": "Wei Yi"}], "author_count": 3}, {"id": "2605.01421", "category": "cond-mat", "title": "Effective attraction by repulsion", "abstract": "Repulsive self-propelled particles tend to cluster, leading to Motility-Induced Phase Separation (MIPS). By analogy with equilibrium phase separation, the onset of MIPS has been associated with a transition to effective attraction between particles. Using an exact microscopic theory, we quantify the emergence of effective attraction in a minimal model: two soft run-and-tumble particles in a periodic domain. We show that, as repulsion increases, the leading-order behaviour is that of effective repulsion, while effective attraction emerges as a higher-order contribution to the renormalisation of the pair potential.", "url": "https://arxiv.org/abs/2605.01421", "type": "理论", "summary": "1. 该工作基于精确微观理论，针对二维周期域中两个软run-and-tumble粒子的最小模型，首次定量揭示了排斥性自驱动粒子间有效吸引的涌现过程。\n2. 其核心技术贡献在于严格解析计算表明，随排斥作用增强，对势重整化中的主导行为仍为有效排斥，而有效吸引仅以高阶贡献形式出现，修正了运动诱导相分离的简单类比，颠覆了直观预期。\n3. 这一结果为活性物质相分离提供了更准确的微观理论基础，并启发从有效势的全阶展开研究非平衡相变，为实验检验提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Rosalba Garcia-Millan"}, {"name": "Luca Cocconi"}, {"name": "Ziluo Zhang"}, {"name": "Marius Bothe"}, {"name": "Letian Chen"}, {"name": "Zigan Zhen"}, {"name": "Gunnar Pruessner"}], "featured_authors": [{"name": "Rosalba Garcia-Millan"}, {"name": "Luca Cocconi"}, {"name": "Ziluo Zhang"}, {"name": "Letian Chen"}, {"name": "Zigan Zhen"}, {"name": "Gunnar Pruessner"}], "author_count": 7}, {"id": "2605.01422", "category": "cond-mat", "title": "Microscopic theory of soft run-and-tumble particles", "abstract": "Soft, repulsive run-and-tumble particles display emergent effective interactions as they appear to stick to each other in spite of the absence of attractive forces. This effective attraction emerges at strong enough repulsion and large self-propulsion. Complementing a companion paper that characterises effective attraction between two soft run-and-tumble particles [Garcia-Millan et al., Effective attraction by repulsion (2026)], here we provide a thorough derivation of our microscopic theory, which is an exact representation of the particle dynamics. We report the systematic calculation of the effective interaction vertices iteratively, in a perturbation expansion about the interaction couplings, by adding, order by order, loop corrections. We use the effective interaction vertices to calculate the two-point correlation function, fully characterising the stationary state. Other observables, such as the structure factor, overlap probability and entropy production rate are calculated as well.", "url": "https://arxiv.org/abs/2605.01422", "type": "理论+数值", "summary": "1. 该工作推导了软斥力跑-翻滚粒子的微观理论，精确刻画了无吸引势下的有效吸引力涌现机制。\n2. 其技术核心在于通过相互作用耦合的微扰展开，迭代计算包含圈修正的有效相互作用顶点，并以此完全表征稳态。\n3. 这为从微观第一性原理理解活性物质中有效吸引现象提供了可解析计算的框架，并可直接推广至结构因子、熵产率等可观测量的分析。", "summary_source": "deepseek", "authors": [{"name": "Rosalba Garcia-Millan"}, {"name": "Ziluo Zhang"}, {"name": "Luca Cocconi"}, {"name": "Marius Bothe"}, {"name": "Letian Chen"}, {"name": "Zigan Zhen"}, {"name": "Gunnar Pruessner"}], "featured_authors": [{"name": "Rosalba Garcia-Millan"}, {"name": "Ziluo Zhang"}, {"name": "Luca Cocconi"}, {"name": "Letian Chen"}, {"name": "Zigan Zhen"}, {"name": "Gunnar Pruessner"}], "author_count": 7}, {"id": "2605.01470", "category": "cond-mat", "title": "Colloidal layer deposition with a controllable number of layers and compositional order", "abstract": "We design a system with a binary suspension of colloids and a surface that triggers the self-assembly of crystallites with a finite thickness. The proposed design allows controlling the number of layers forming the aggregate and constrains the two types of particles to lie on different planes. These functionalities are achieved by decorating the colloids and the surface with multiple DNA oligomers featuring specific interactions. The surface triggers a chain of reactions between DNA oligomers, leading to localized self-assembly. Equilibrium principles control the thickness of the aggregates. Instead, compositional order is achieved by engineering the reaction kinetics between DNA oligomers in a way that limits interactions between colloids of the same type. We validate our design using theory and reaction-diffusion simulation algorithms, which capture the multibody nature of the interactions. This work demonstrates how engineering the kinetics provides a new avenue for controlling the morphology of aggregates assembled by DNA.", "url": "https://arxiv.org/abs/2605.01470", "type": "理论+数值", "summary": "1. 该工作设计了一种二元胶体悬浮液与表面系统，通过DNA寡核苷酸特异性相互作用实现了层数和组成顺序可控的胶体层沉积。\n2. 其技术核心在于利用平衡原理控制聚集体厚度，并通过调控DNA反应动力学来限制同种胶体间的相互作用以实现组成有序。\n3. 这展示了动力学工程作为控制DNA组装形态的新途径，为可编程胶体材料的制备提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Akshaya Kumar Jena"}, {"name": "Aashima Aashima"}, {"name": "Pritam Kumar Jana"}, {"name": "Bortolo Matteo Mognetti"}], "featured_authors": [{"name": "Akshaya Kumar Jena"}, {"name": "Aashima Aashima"}, {"name": "Pritam Kumar Jana"}, {"name": "Bortolo Matteo Mognetti"}], "author_count": 4}, {"id": "2605.01595", "category": "cond-mat", "title": "Entanglement dynamics after quenches with inhomogeneous Hamiltonians", "abstract": "We investigate entanglement dynamics in bipartite systems governed by inhomogeneous Hamiltonians of the form $H = H_L + H_R$, where $H_{L/R}$ acts only on the left or right region and is homogeneous within each region. Focusing on the XX chain and the transverse-field Ising chain, we derive analytical formulas for the entanglement entropy between the two regions in the hydrodynamic limit of long times. In this regime, fermions incident on the interface undergo scattering, generating entanglement between reflected and transmitted modes. The resulting quasiparticle picture is controlled by the transmission coefficient, which we obtain analytically by solving the stationary lattice Schrödinger equation. Due to the bounded dispersion, strong inhomogeneity suppresses both transport and entanglement growth. We benchmark our analytical predictions against numerical simulations in paradigmatic setups. Finally, we extend the analysis to the interacting XXZ chain using tDMRG. The numerical data show qualitative agreement with the quadratic case: entanglement growth remains suppressed in the strongly inhomogeneous limit. Notably, however, entanglement continues to increase even when transport is suppressed, at least at intermediate times.", "url": "https://arxiv.org/abs/2605.01595", "type": "理论+数值", "summary": "1. 该工作研究了由左右均匀区域组成的非均匀哈密顿量下的激冷纠缠动力学，并求得了XX链与横场Ising链在流体极限下的纠缠熵解析公式。\n2. 其核心卖点在于通过求解晶格薛定谔方程获得透射系数，建立了由散射支配的准粒子图像；强非均匀性抑制输运与纠缠增长，但对XXZ链的tDMRG显示，输运被抑制时纠缠在中间时间仍可增长。\n3. 这为非均匀系统中输运与纠缠解耦的动力学机制提供了明确启示，可推广至其他可积与不可积模型。", "summary_source": "deepseek", "authors": [{"name": "Andrea Di Pasquale"}, {"name": "Federico Rottoli"}, {"name": "Vincenzo Alba"}], "featured_authors": [{"name": "Andrea Di Pasquale"}, {"name": "Federico Rottoli"}, {"name": "Vincenzo Alba"}], "author_count": 3}, {"id": "2605.01612", "category": "cond-mat", "title": "Decoherence due to the sudden coupling of an impurity to a metal", "abstract": "We investigate the nonequilibrium dynamics and loss of coherence in a quantum impurity system using the spinless resonant level model subject to sudden quenches of the hybridization between the impurity and the metal. The survival probability (fidelity) and impurity occupation are analyzed as probes of the dephasing induced by particle-hole excitations. For finite systems, the loss of coherence loss is only apparent, as discrete spectra lead to quasi-periodic dynamics and revivals when phases realign. We show that a mixed linear-logarithmic discretization suppresses these finite-size artifacts by rendering excitation energies incommensurate, thereby reducing revivals. Starting from the exactly solvable two-level limit exhibiting coherent Rabi oscillations, we extend the analysis to large lattices, where damping and relaxation emerge. Combining analytical and numerical results, we provide a unified picture of the crossover from coherent oscillations to effectively irreversible decoherence.", "url": "https://arxiv.org/abs/2605.01612", "type": "理论+数值", "summary": "1. 该工作利用无自旋共振能级模型中的突然杂化淬火，研究了杂质与金属耦合引发的非平衡退相干动力学，并以生存概率和杂质占据数作为探针量化粒子-空穴激发导致的相干丧失。\n2. 其主要物理与技术卖点在于提出混合线性-对数离散化方案，通过使激发能谱不可公度来消除有限尺寸准周期复兴，从而在有限尺度下有效模拟出从相干Rabi振荡到不可逆退相干的连续转变。\n3. 该统一图像结合了精确可解两能级极限与大型格点数值结果，为理解金属环境中杂质退相干的不可逆性如何涌现、以及如何在有限尺寸模拟中抑制伪相干复兴提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Felipe D. Picoli"}, {"name": "Gustavo Diniz"}, {"name": "Luiz N. Oliveira"}], "featured_authors": [{"name": "Felipe D. Picoli"}, {"name": "Gustavo Diniz"}, {"name": "Luiz N. Oliveira"}], "author_count": 3}, {"id": "2605.01629", "category": "cond-mat", "title": "Brain criticality through nonadditive entropic analysis of electroencephalograms", "abstract": "On the grounds of nonadditive entropies -- appropriate for complex systems -- we investigate the electroencephalogram amplitudes of typical and ADHD children. The corresponding probability distributions are $q$-Gaussians, i.e., $\\rho(x) \\propto e_q^{-\\beta x^2} \\equiv [1+(q-1) \\beta x^2]^{1/(1-q)}$, where $(q,\\beta)$ are, respectively, the entropic index characterizing complexity and the inverse width. We show that $q$ tends to monotonically vary with $\\beta$ for both typical and ADHD subjects, thus revealing critical behavior of the brain. Moreover, we verify that ADHD subjects have a higher complexity than the typical ones. Consistently, biomarkers for objective phychyatric diagnosis could emerge along this path. We show that $q$ tends to monotonically vary with $\\beta$ for both typical and ADHD subjects, thus revealing critical behavior of the brain. Moreover, we verify that ADHD subjects have a higher complexity than the typical ones. Consistently, biomarkers for objective phychyatric diagnosis could emerge along this path.", "url": "https://arxiv.org/abs/2605.01629", "type": "理论", "summary": "1. 该工作利用非广延熵分析典型与ADHD儿童脑电图振幅，研究大脑临界性行为。\n2. 其卖点在于发现信号分布呈q-高斯形式，且熵指数q与宽度β单调关联，揭示出ADHD具有更高复杂度。\n3. 这为基于非广延统计的脑临界性客观诊断标志物发展提供了定量途径。", "summary_source": "deepseek", "authors": [{"name": "Henrique Santos Lima"}, {"name": "Constantino Tsallis"}, {"name": "Dimitri M. Abramov"}], "featured_authors": [{"name": "Henrique Santos Lima"}, {"name": "Constantino Tsallis"}, {"name": "Dimitri M. Abramov"}], "author_count": 3}, {"id": "2605.01645", "category": "cond-mat", "title": "Long-range correlation and the spin conductivity in the XXZ chain from ballistic macroscopic fluctuation theory", "abstract": "Based on the ballistic macroscopic fluctuation theory, the integration of the spin correlation function (spin conductivity) is analyzed for the spin-1/2 XXZ chain in the critical regime. In the time when the magnetization of an infinite spin chain fluctuates from an initial state with a wavelength as long as the infinite length $N$, the equal-time two-point spin correlation function is scaled up to $O(1/N)$. In the state where the ballistic spin transport decays at high temperature $T$, the diffusive transport remains on a large scale. We show that the spin conductivity is proportional to $1/T$ in the limit $T\\to\\infty$ and its high temperature proportionality constant diverges in the case where one-quasiparticle magnetization is infinitely large. This analysis informs that the superdiffusive spin transport is driven by the $1/N$-scaled long-range spin correlation and sheds a light on the dynamic scaling in spin transport at the isotropic point.", "url": "https://arxiv.org/abs/2605.01645", "type": "理论", "summary": "1. 基于弹道宏观涨落理论，该工作解析了临界XXZ链自旋电导率与长程关联的关系。\n2. 其核心发现是自旋电导率在高温极限下正比于1/T，且比例常数在单准粒子磁化发散时发散，表明1/N标度的长程关联驱动超扩散输运。\n3. 这为各向同性点自旋输运的动态标度行为提供了关键理论支撑与定量描述。", "summary_source": "deepseek", "authors": [{"name": "Shinya Ae"}], "featured_authors": [{"name": "Shinya Ae"}], "author_count": 1}, {"id": "2605.01678", "category": "cond-mat", "title": "Generalized continuum theory of phonon angular momentum in crystals", "abstract": "We formulate a generalized continuum theory of phonon angular momentum in crystals by introducing a local SO(3) material frame in addition to the macroscopic displacement field. The local frame represents rotational optical degrees of freedom of the unit cell and brings acoustic displacement modes and optical rotational modes into a common long-wavelength continuum description. In the linearized limit, the co-rotated deformation gradient and the rotational gradient associated with the local material frame recover the Eringen microdeformation and wryness tensors; isotropic micropolar elasticity then appears as a special case. Rotational symmetry and Noether's theorem determine the continuum phonon angular-momentum density, including both the displacement-polarization contribution and the intrinsic microrotation contribution. The theory further identifies the locking limit in which microrotation reduces to lattice vorticity and the improper-symmetry-breaking terms responsible for chiral phonon splitting.", "url": "https://arxiv.org/abs/2605.01678", "type": "理论", "summary": "1. 该工作通过引入局部SO(3)物质框架，建立了晶体中声子角动量的广义连续统理论，统一描述声学位移与晶胞旋转光学模式。\n2. 技术核心在于线性化极限下共旋转变形梯度和旋转梯度恢复Eringen微变形与Wryness张量，并由Noether定理导出含位移极化和固有微旋转贡献的角动量密度。\n3. 该理论进一步明确了微旋转简化为晶格涡度的锁定极限以及由不适当对称性破缺项导致的手性声子分裂，为微极弹性与手性动力学提供了连续统基础。", "summary_source": "deepseek", "authors": [{"name": "Mamoru Matsuo"}, {"name": "Naoki Nishimura"}, {"name": "Ai Yamakage"}, {"name": "Takeo Kato"}], "featured_authors": [{"name": "Mamoru Matsuo"}, {"name": "Naoki Nishimura"}, {"name": "Ai Yamakage"}, {"name": "Takeo Kato"}], "author_count": 4}, {"id": "2605.01686", "category": "cond-mat", "title": "Topological Ising superconductivity in two-dimensional p-wave magnet", "abstract": "Fermi-surface spin splitting generated by non-relativistic exchange fields provides a new route to topological superconductivity without relying on strong spin-orbit coupling. Here, we study superconducting instabilities of a square-lattice $p$-wave magnet with onsite and nearest-neighbour attractive interactions. The odd-parity exchange field removes inversion symmetry in the spin-split electronic structure, allowing singlet and triplet order parameters to mix within a single $A_1$ symmetry channel. The leading instability is a coupled $s+p_x$ Ising state, whose singlet-triplet balance is continuously tunable by the relative strength of the nearest-neighbour attraction. When the triplet gap amplitude exceeds the singlet one, this Ising state undergoes a transition into a nodal topological superconducting phase with Majorana edge modes protected by momentum-resolved winding numbers. These modes extend over finite momentum intervals bounded by the surface projections of bulk point nodes. We further show that a Zeeman field perpendicular to the exchange field can induce a $Z_2$ topological superconducting phase, even in the regime where a single gap dominates.", "url": "https://arxiv.org/abs/2605.01686", "type": "理论+数值", "summary": "1. 该工作研究了二维p波磁体在格点和最近邻吸引相互作用下的超导不稳定性，发现了耦合的s+p_x伊辛超导态及其拓扑相变。\n2. 其核心在于奇宇称交换场移除自旋劈裂结构的反演对称性，使单重态与三重态在A1对称性通道混合，通过调节三重态能隙幅度可进入具有马约拉纳边缘模的nodal拓扑超导相。\n3. 这为在不依赖强自旋轨道耦合的体系中实现拓扑超导提供了新平台，并提出了利用垂直塞曼场诱导Z2拓扑超导相的可能性。", "summary_source": "deepseek", "authors": [{"name": "Kyoung-Min Kim"}, {"name": "Gibaik Sim"}, {"name": "Moon Jip Park"}], "featured_authors": [{"name": "Kyoung-Min Kim"}, {"name": "Gibaik Sim"}, {"name": "Moon Jip Park"}], "author_count": 3}, {"id": "2605.01780", "category": "cond-mat", "title": "Spin-orbit coupling effects in altermagnets: Interplay of weak spin and orbital ferromagnetism with relativistic splitting of electron states", "abstract": "The aim of the paper is to contribute to reaching a deeper understanding of the formation of relativistic effects in altermagnets. The focus of the paper is on the phenomena of weak ferromagnetism (WFM) and relativistic DFT calculations combined with the symmetry analysis on the basis of spin space groups. The consideration is performed on two different levels. On the first level, the atomistic magnetic structure of weak ferromagnetic state is calculated. Both spin and orbital atomic moments are taken into account. We study the dependence of the WFM moment on the strength of the SOC and obtain a peculiar nonmonotonous type of dependence. An interesting result is obtained in quasisymmetry (QS) calculation where only the component of the SOC collinear to the Néel vector is taken into account. In QS calculation the spin WFM is absent while the orbital WFM is present. This reveals a principal difference in the formation of the spin and orbital magnetic moments. On the second level, the study is focused on the properties of individual electron states. We introduce the notion of the magnetic structure of the electron state (MSES). It is shown how the collinear spin-MSESs of both metal and ligand atoms and compensated orbital-MSES of the ligand obtained in the nonrelativiatic calculation transform into complex noncollinear 3D MSESs of both spin and orbital nature. An important role in the formation of MSESs is played by the relativistic splitting of the accidental spin degeneracies at general {\\bf k} points filling the volume of the Brillouin zone. The formation of the regions of avoided crossings in the relativistic band structure is related to the nonmonotonous behavior of the WFM moment. The importance of the metal-ligand hybridization in the formation of the AM properties is discussed. Most of the calculations are performed for MnTe.", "url": "https://arxiv.org/abs/2605.01780", "type": "理论+数值", "summary": "1. 该工作结合相对论性密度泛函计算与自旋空间群对称性分析，系统研究了交变磁体中自旋轨道耦合效应导致的弱铁磁性现象与电子态相对论劈裂。\n2. 核心发现在于准对称计算中自旋弱铁磁矩消失而轨道弱铁磁矩仍存，揭示了自旋与轨道磁矩形成机制的本质差异，并阐明了布里渊区一般k点偶然自旋简并的相对论劈裂与弱铁磁矩非单调行为之间的关联。\n3. 这一研究为理解交变磁体中自旋轨道耦合与金属-配体杂化协同作用下的复杂自旋与轨道磁性结构提供了关键理论框架，并启发相关材料中磁电输运性质的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "L. M. Sandratskii"}, {"name": "K. Carva"}, {"name": "V. M. Silkin"}], "featured_authors": [{"name": "L. M. Sandratskii"}, {"name": "K. Carva"}, {"name": "V. M. Silkin"}], "author_count": 3}, {"id": "2605.01781", "category": "cond-mat", "title": "A Fully Ab-Initio Spin-Lattice Dynamics Framework for Magnetic Materials", "abstract": "Coupled spin-lattice dynamics (SLD) underlie a wide range of magnetic phenomena, yet a unified first-principles framework that propagates both degrees of freedom without empirical parameterization has remained elusive. We present a fully ab initio SLD approach integrated into VASP, in which interatomic forces and effective magnetic fields are obtained at each time step from self-consistent constrained-moment density-functional calculations. The method is validated on four materials spanning ferromagnetic, non-collinear, and geometrically frustrated orders, recovering the correct magnetic ground state in every case from random initial conditions. SLD trajectories also provide physically correlated training data for magnetic machine-learning potentials, as demonstrated for BiFeO$_3$ by a reduction of up to approximately one order of magnitude in energy MAE over training on randomized spin configurations. This framework opens a practical first-principles route to finite-temperature spin-lattice coupled phenomena in magnetic materials.", "url": "https://arxiv.org/abs/2605.01781", "type": "数值", "summary": "1. 该工作提出了一个完全基于第一性原理的自旋-晶格动力学框架，集成于VASP中，从随机初始构型出发即可正确重现铁磁、非共线及几何阻挫等多种磁性基态。\n2. 其核心在于每时间步通过自洽约束矩密度泛函计算同时更新原子间力与有效磁场，无需经验参数化，实现了自旋与晶格自由度的同步第一性原理演化。\n3. 该框架为有限温度下磁性材料中自旋-晶格耦合现象开辟了实用的第一性原理模拟路径，并能为机器学习势提供物理关联的训练数据，显著提升了能量预测精度。", "summary_source": "deepseek", "authors": [{"name": "Xianxi Zhang"}, {"name": "Hongyu Yu"}, {"name": "Liangliang Hong"}, {"name": "Hongjun Xiang"}], "featured_authors": [{"name": "Xianxi Zhang"}, {"name": "Hongyu Yu"}, {"name": "Liangliang Hong"}, {"name": "Hongjun Xiang"}], "author_count": 4}, {"id": "2605.01788", "category": "cond-mat", "title": "Directed percolation in nuclear safety", "abstract": "Neutron behavior in a nuclear reactor is described using a directed percolation model. The preferred direction is created by generations of neutrons oriented in time. Using the example of the time it takes for a dangerous neutron flux or reactor power limit to be reached, it is shown that in certain situations, the proposed approach can identify events hazardous to reactor safety that are undetectable by traditional reactor safety systems.", "url": "https://arxiv.org/abs/2605.01788", "type": "理论", "summary": "1. 该工作将定向渗流模型引入核反应堆中子行为描述，用于识别传统安全系统无法检测的危险事件。\n2. 其卖点在于利用中子代在时间上的定向传播，揭示了危险中子通量或功率极限到达时间的新预警机制。\n3. 这为核反应堆安全监测提供了基于非平衡统计物理的补充检测手段，具有潜在应用价值。", "summary_source": "deepseek", "authors": [{"name": "V. V. Ryazanov"}], "featured_authors": [{"name": "V. V. Ryazanov"}], "author_count": 1}, {"id": "2605.01801", "category": "cond-mat", "title": "Coherent exciton spin dynamics and three-dimensional quantum state tomography in a single InAlAs quantum dot", "abstract": "We investigate the coherent exciton spin dynamics in a single InAlAs/AlGaAs quantum dot using time-resolved quantum state tomography. Under two-LO-phonon quasi-resonant excitation of neutral exciton, we observe pronounced quantum beats in the circular and diagonal polarization components, reflecting the fine-structure splitting ($\\Delta \\approx 19.6 \\ \\mu\\text{eV}$). By employing a global fitting procedure across three orthogonal polarization bases, we demonstrate that the spin evolution is consistently described by a unified Hamiltonian dominated by the anisotropic exchange interaction. While the initial degree of circular polarization is limited to $\\approx 0.28$ due to fast relaxation processes during carrier cooling, the subsequent dynamics reveal a long-lived spin coherence ($1.1 \\pm 0.2$ ns) that exceeds the exciton lifetime ($\\sim 767$ ps). Our analysis reveals that the spin-formation time is significantly shorter than the instrument response function, and the absence of a discernible Overhauser shift confirms a negligible influence from the local nuclear environment under the present conditions. These results provide a quantitative benchmark for the three-dimensional reconstruction of spin trajectories using differential polarization signals, demonstrating the feasibility of using quasi-resonant excitation for stable spin initialization in semiconductor nanostructures.", "url": "https://arxiv.org/abs/2605.01801", "type": "理论+数值", "summary": "1. 该工作利用时间分辨量子态层析技术，研究了单个InAlAs/AlGaAs量子点中中性激子自旋的相干动力学。\n2. 通过在三个正交偏振基上实施全局拟合，证实自旋演化由各向异性交换相互作用统一描述，并观测到自旋相干寿命（1.1 ns）超过激子寿命。\n3. 这为准共振激发下半导体纳米结构中稳定自旋初始化和三维自旋轨迹重建提供了定量基准。", "summary_source": "deepseek", "authors": [{"name": "J. Njala"}, {"name": "Y. Yamamoto"}, {"name": "R. Kaji"}, {"name": "S. Adachi"}, {"name": "H. Sasakura"}], "featured_authors": [{"name": "J. Njala"}, {"name": "Y. Yamamoto"}, {"name": "R. Kaji"}, {"name": "S. Adachi"}, {"name": "H. Sasakura"}], "author_count": 5}, {"id": "2605.01812", "category": "cond-mat", "title": "Orbital-Splitter Current in Altermagnets", "abstract": "In collinear altermagnets, the real-space rotational symmetry of opposite spin sublattices generates a large nonrelativistic spin-splitter current. Orbital transport in this setting has remained largely unexplored. Here, we introduce the orbital-splitter current (OSC), an orbital analogue of the spin-splitter current, and derive its Drude and orbital Berry curvature contributions using a density-matrix framework. We show that the $d$-wave altermagnet $\\mathrm{FeSb}_2$ realizes a purely intrinsic OSC because mirror symmetries suppress the Drude channel by forcing the orbital magnetic moment to vanish. The OSC response is strongly anisotropic and, for selected field orientations, exceeds the spin-splitter current by nearly a factor of four. We further show that the OSC generates a damping-like torque in an altermagnet-ferromagnet heterostructure and, when combined with the spin-splitter current, significantly reduces the magnetization switching time.", "url": "https://arxiv.org/abs/2605.01812", "type": "理论", "summary": "1. 该工作提出共线交替磁体中的轨道分裂电流概念，并基于密度矩阵框架推导其Drude与轨道贝里曲率贡献。\n2. 其核心发现是d波交替磁体FeSb₂中镜面对称性迫使轨道磁矩消失，完全压制耗散通道，实现纯内禀轨道分裂电流，且响应强各向异性，特定取向强度超过自旋分裂电流近四倍。\n3. 该电流在交替磁体-铁磁异质结中产生阻尼类扭矩，并与自旋分裂电流协同显著降低磁化翻转时间，为超快自旋轨道器件提供新机制。", "summary_source": "deepseek", "authors": [{"name": "Koushik Ghorai"}, {"name": "Sayan Sarkar"}, {"name": "Amit Agarwal"}], "featured_authors": [{"name": "Koushik Ghorai"}, {"name": "Sayan Sarkar"}, {"name": "Amit Agarwal"}], "author_count": 3}, {"id": "2605.01820", "category": "cond-mat", "title": "Hindered transport of spherical particles in cylindrical pores: The role of structural heterogeneity in rejection-permeability trade-offs", "abstract": "Membrane separations rely on balancing rejection and permeability. Extensive work has clarified how pore structure and operating conditions control each quantity in idealized or weakly heterogeneous systems. However, it remains unclear how this trade-off emerges in strongly heterogeneous media, where coupled distributions of pore and particle sizes shape the local balance between advection and diffusion and generate substantial variability in performance among distribution realizations. Here we present a steric hindered-transport framework for spherical particles in cylindrical pores that explicitly resolves both single and coupled dual heterogeneity in size distributions. We show that the ensemble-averaged rejection increases with the particle-pore aspect ratio $\\lambda$ and with the Péclet number $Pe$, while advection enhances steric exclusion by up to $\\sim$20\\% at intermediate $\\lambda$. Dual heterogeneity broadens the distribution of effective $Pe$, increases the variability and incidence of anomalous rejection trends, while systematically shifting the rejection-permeability trade-off toward higher permeability at fixed rejection. These results suggest that controlled heterogeneity can serve as a design lever to expand the attainable operating space for simultaneous high selectivity and high throughput.", "url": "https://arxiv.org/abs/2605.01820", "type": "理论", "summary": "1. 该工作提出一个针对圆柱孔中球形颗粒的空间阻碍传输框架，显式解析孔径与颗粒尺寸分布的单重及耦合双重异质性。\n2. 揭示异质性通过展宽有效Péclet数分布、增加反常拒绝变异，并将拒绝-渗透权衡系统地向更高渗透率偏移。\n3. 这为利用受控结构异质性作为设计杠杆，扩展高选择性与高渗透性兼得的操作空间提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Debanik Bhattacharjee"}, {"name": "Yaniv Edery"}, {"name": "Guy Z. Ramon"}], "featured_authors": [{"name": "Debanik Bhattacharjee"}, {"name": "Yaniv Edery"}, {"name": "Guy Z. Ramon"}], "author_count": 3}, {"id": "2605.01863", "category": "cond-mat", "title": "Surface segregation of liquid metal plasma-facing component alloys: A ReaxFF investigation", "abstract": "Engineering liquid metal alloys offers a transformative pathway for plasma-facing components (PFC) by enabling chemically tailored surfaces that can simultaneously optimize plasma-material interactions, reduce divertor heat flux, and enhance core plasma confinement, thereby advancing the commercial viability of nuclear fusion power plants. This study, employing an atomistic simulation framework, provides direct evidence that incorporating non-metal surface-active agents (such as O and H, or their combination) enables strong surface segregation. This capability makes tin-aluminum (Sn-Al) and tin-lithium (Sn-Li) alloys, with suitable compositions, good candidates for PFC applications. Specifically, the presence of low-Z solutes (Li, Al) leads to preferential surface enrichment, which imparts low-Z sputtering characteristics, while the Sn solvent maintains thermophysical stability. To systematically examine this behavior, we first optimized ReaxFF parameter sets for Sn-Al, Sn-Al-O, Sn-Li, Sn-Li-O, Sn-Li-H, and Sn-Li-O-H systems. We validated them using formation energies and elastic constants. We then employed reactive molecular dynamics simulations to resolve the coupled effects of surface segregation and impurity-driven chemistry at fusion-relevant temperatures. We also introduced an overlap-based segregation index that captures interfacial compositional separation directly from atomistic density distributions. This metric reveals a clear hierarchy of segregation regimes across all systems and presents a unified view of segregation across all observations reported herein. Together, these findings establish a mechanistic link between non-metal chemistry and interfacial structure, providing a predictive framework for designing self-adaptive, low-sputtering liquid metal alloys for fusion applications.", "url": "https://arxiv.org/abs/2605.01863", "type": "理论+数值", "summary": "1. 该工作采用ReaxFF反应力场分子动力学模拟，系统研究了锡铝与锡锂液基金属合金中非金属表面活性剂（氧、氢）诱导的表面偏析行为。\n2. 其核心技术在于通过优化多组元ReaxFF参数并引入基于原子密度重叠的偏析指数，揭示了低原子序数溶质（Li, Al）优先富集表面从而赋予低碳溅射特性，同时锡溶剂维持热物理稳定性的机制。\n3. 这为利用非金属化学调控界面结构、设计具有自适应低溅射能力的液基金属等离子体面壁组件提供了可预测的原子级设计框架。", "summary_source": "deepseek", "authors": [{"name": "Md Adnan Mahathir Munshi"}, {"name": "Abdul Aziz Shuvo"}, {"name": "Mike Kotschenreuther"}, {"name": "Adri C.T. van Duin"}, {"name": "Bladimir Ramos-Alvarado"}], "featured_authors": [{"name": "Md Adnan Mahathir Munshi"}, {"name": "Abdul Aziz Shuvo"}, {"name": "Mike Kotschenreuther"}, {"name": "Adri C.T. van Duin"}, {"name": "Bladimir Ramos-Alvarado"}], "author_count": 5}, {"id": "2605.01881", "category": "cond-mat", "title": "Polymorphic crystallites model for monolayer amorphous materials", "abstract": "Modeling the atomic structure of amorphous materials has long been a critical challenge in materials science. Recent advances in monolayer amorphous materials enable direct observation of their atomic structures, paving the way for a better understanding of their atomic-scale models. Here, we investigate amorphous multielement monolayers using machine learning potential from first-principles total energies via energy-driven kinetic Monte Carlo based active-learning framework. A polymorphic crystallite model is proposed to describe the atomic configuration of monolayer amorphous boron nitride, as it consists of coexisting crystallite of $o-B_2N_2$ and $o-B_4N_4$ structural motifs. Generality of the polymorphic crystallite model is further validated in two other multielement monolayer amorphous systems. Monolayer amorphous LiCl shows coexisting hexagonal and tetragonal crystallites, while monolayer amorphous BCN contains a combination of graphene-like, h-BN-like, and borophene-like crystallites. These findings expand the classical picture of amorphous structure models and offer new insight into the microscopic structure of amorphous materials.", "url": "https://arxiv.org/abs/2605.01881", "type": "理论+数值", "summary": "1. 该工作提出多晶型晶粒模型，描述单层非晶氮化硼、氯化锂与BCN中多种晶粒共存的原子构型。\n2. 通过第一性原理机器学习势与能量驱动动力学蒙特卡洛主动学习框架，验证了三种多元素单层非晶体系中多晶型结构的一般性。\n3. 该模型超越了经典非晶结构理论，为理解单层非晶材料的微观组织提供了新视角与建模基础。", "summary_source": "deepseek", "authors": [{"name": "Le-Ye Zhu"}, {"name": "Xi Zhang"}, {"name": "Yun-Peng Wang"}, {"name": "Jieheng Shi"}, {"name": "Junwei Zhang"}, {"name": "Shixuan Du"}, {"name": "Yu-Yang Zhang"}], "featured_authors": [{"name": "Le-Ye Zhu"}, {"name": "Xi Zhang"}, {"name": "Yun-Peng Wang"}, {"name": "Junwei Zhang"}, {"name": "Shixuan Du"}, {"name": "Yu-Yang Zhang"}], "author_count": 7}, {"id": "2605.01893", "category": "cond-mat", "title": "Two distinct superconducting regimes in Ti4Co2O under pressures", "abstract": "We report on the pressure dependence of superconducting transition temperature Tc and upper critical field Bc2(0) through electrical transport of the Ti4Co2O superconductor (eg.,the superconducting transition temperature Tc = 2.5 K and the Bc2(0)=7.2T=2.9Tc). We find that the Tc exhibits non-monotonic pressure dependence:it rises monotonically at first with a pressure coefficient of dTc/dP=0.034 K/GPa, but rapidly decreases around 10-20 GPa, and then increases with the dTc/dP = 0.023 K/GPa, up to= 4.31 K at 69.7 GPa. Concurrently, the Bc2(0)exhibits a dome shaped pressure dependence, with its maximum at 5 GPa of almost twice the value at ambient pressure, exceeding the weak-coupling Pauli paramagnetic limit Bp throughout the whole pressure range. By comparing the normal-state and superconducting properties, we identify two distinct superconducting regimes, with a low-pressure superconducting phase characterized by an enhanced Bc2(0)values and Fermi-liquid normal-state electrical transport (the exponent n = 2), and a high-pressure superconducting phase with a monotonically increased Tc and an enhancement in phonon scatterings (the exponent n = 4). Room-temperature synchrotron X-ray diffraction indicates that there is no structural transition up to 55.8 GPa, which gives a relatively large bulk modulus of 192 GPa in comparison with other alloy superconductors. First-principles calculations suggest that the nonmonotonic Tc maybe closely related to the evolution of the density of states of Ti4Co2O upon compression, which is different from those of isostructural superconductors Ti4Ir2O and Nb4Rh2C. Our results show that even in the Ti4Co2O with weak spin-orbit coupling, superconductivity remains highly sensitive to the external stimuli such as pressure.", "url": "https://arxiv.org/abs/2605.01893", "type": "理论+数值", "summary": "1. 通过高压电输运测量，揭示了Ti4Co2O超导体中Tc非单调压力依赖及Bc2(0)穹顶形变化。\n2. 识别出两个超导态：低压区费米液体输运伴随增强上临界场（超过泡利极限），高压区声子散射增强且Tc单调上升，全程无结构相变。\n3. 该工作表明弱自旋轨道耦合超导体对压力高度敏感，其非单调Tc归因于压缩下态密度演化，不同于等结构化合物。", "summary_source": "deepseek", "authors": [{"name": "Lifen Shi"}, {"name": "Keyuan Ma"}, {"name": "Binbin Ruan"}, {"name": "Zhen Wang"}, {"name": "Pengtao Yang"}, {"name": "Zhian Ren"}, {"name": "Jianping Sun"}, {"name": "Gang Li"}, {"name": "Fabian O. von Rohr"}, {"name": "Bosen Wang"}, {"name": "Jinguang Cheng"}], "featured_authors": [{"name": "Lifen Shi"}, {"name": "Keyuan Ma"}, {"name": "Binbin Ruan"}, {"name": "Fabian O. von Rohr"}, {"name": "Bosen Wang"}, {"name": "Jinguang Cheng"}], "author_count": 11}, {"id": "2605.01900", "category": "cond-mat", "title": "System driven out-of equilibrium by weak contacts with reservoirs", "abstract": "The non-equilibrium behavior of particle systems driven by reservoirs has been extensively studied in recent years. In one dimension, various regimes have been explored depending on the coupling strength to the reservoirs. In this paper, we investigate the role of the dimension and of the geometry of the contacts with the reservoirs. For the symmetric simple exclusion process with point contact reservoirs, we show that in dimension 2, as in one dimension, three different regimes occur depending on the coupling strength. On the other hand in dimensions 3 and higher, there exists only a weak coupling regime which is very sensitive to the microscopic structure of the contacts. We then argue that for reservoirs with mesoscopic size contacts the macroscopic fluctuation theory remains in force and we propose an extension of the additivity principle for multiple mesoscopic reservoirs.", "url": "https://arxiv.org/abs/2605.01900", "type": "理论", "summary": "1. 本文研究储库弱接触驱动的粒子系统非平衡行为，揭示维度与接触几何对耦合强度区域结构的关键影响。\n2. 发现在二维对称简单排斥过程中存在三种耦合区，而三维及以上仅存弱耦合区且对接触微观结构高度敏感，并论证介观接触下宏观涨落理论适用。\n3. 该工作推广了多重介观储库的可加性原理，为高维非平衡系统与复杂接触几何的理论建模提供了扩展框架。", "summary_source": "deepseek", "authors": [{"name": "Thierry Bodineau"}, {"name": "Bernard Derrida"}], "featured_authors": [{"name": "Thierry Bodineau"}, {"name": "Bernard Derrida"}], "author_count": 2}, {"id": "2605.01969", "category": "cond-mat", "title": "Ergodic and Discrete Time Crystal Phases in Periodically Kicked Many-Body Quantum Systems: An Analytical Study", "abstract": "We analytically study the time evolution of the expectation values of observables in periodically kicked many-body quantum systems. Starting from an initial state, we compute both the transient and the long-time properties of the observables. Our derivation explains the criteria and the mechanism that lead to the infinite-temperature statistical average of observables at long times, irrespective of the initial state. When the criteria are violated, the observables oscillate with time. These oscillations are subharmonic and robust to small perturbations, suggesting the emergence of a discrete time crystal phase. We demonstrate these features explicitly in periodically kicked nonintegrable spin chains. For a spin chain with two kicks per cycle, we show that the kicked chain can exhibit an ergodic or a discrete-time crystal phase for the same kicking strengths, depending on the initial state preparation. We complement our time-evolution study of observables with the spectral form factor of these kicked models.", "url": "https://arxiv.org/abs/2605.01969", "type": "理论", "summary": "1. 该工作解析研究了周期性脉冲驱动多体量子系统中可观测量的瞬态与长时间演化，导出了趋于无穷温度统计平均的精确判据。\n2. 其核心在于揭示了相同驱动强度下仅因初始态不同即可诱发遍历相与离散时间晶体相之间的转变，并证明次谐波振荡具有鲁棒性。\n3. 这为理解周期性驱动系统中遍历性破缺与时间晶体的稳定存在提供了明确的解析机制和判据框架。", "summary_source": "deepseek", "authors": [{"name": "Vijay Kumar"}, {"name": "Dibyendu Roy"}], "featured_authors": [{"name": "Vijay Kumar"}, {"name": "Dibyendu Roy"}], "author_count": 2}, {"id": "2605.02039", "category": "cond-mat", "title": "Lattice Realization of Twist Defects in a $\\mathbb{Z}_2\\times \\mathbb{Z}_2$ Topological Order", "abstract": "In this work, we explore a microscopic realization of three types of anyonic symmetries in a $\\mathbb{Z}_2\\times\\mathbb{Z}_2$ topological order, corresponding to a double toric code. These symmetries act as nontrivial permutations on the anyon labels of the parent state. We consider a setup consisting of two decoupled Wen plaquette models stacked on top of each other and introduce dislocations that modify the Hamiltonian, giving rise to localized twist defects, eventually inducing interactions between the layers. In this context, branch cuts act as sources of anyon permutations when they cross it. We characterize the defects by calculating their quantum dimensions, and we also consider double loop operators around them that allow us to determine the non-Abelian fusion rules between the defects, including when they carry different anyon permutations.", "url": "https://arxiv.org/abs/2605.02039", "type": "理论", "summary": "1. 该工作基于两个解耦的Wen plaquette模型叠加，通过引入位错实现晶格层次的扭错缺陷，构造了Z2×Z2拓扑序中任意子对称性的微观模型。\n2. 其核心在于利用分支切割诱导任意子标签的非平凡置换，并精确计算了缺陷的量子维数及携带不同置换时的非阿贝尔融合规则。\n3. 这为在晶格系统中实现及刻画拓扑序中的任意子对称缺陷提供了具体范例，并启发了对层间耦合拓扑态的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Gustavo M. Yoshitome"}], "featured_authors": [{"name": "Gustavo M. Yoshitome"}], "author_count": 1}, {"id": "2605.02095", "category": "cond-mat", "title": "Synthetic Flat Bands, Hierarchical Topology, and Phase-Fluctuation-Insensitive Quantized Transconductance in Josephson Junctions", "abstract": "We uncover hierarchy of topological phases within the synthetic Brillouin zone of a three-terminal Josephson junction's (3-TJJ's) Bogoliubov-de Gennes spectrum. We demonstrate that the above-gap continuum realizes a Chern insulator phase with quantized monopole charges (\\pm 1), while the subgap Andreev bound states (ABS) are characterized by a quantized dipolar invariant. By breaking time-reversal symmetry at the junction, we induce synthetic flat bands that suppress DC Josephson currents across the entire phase-bias space. Furthermore, under voltage bias, the junction exhibits a robust quantization of the time-averaged transconductance that is reminiscent of a quantized Hall conductance plateau owing to the flat band limit and its dipole phase. As a byproduct, the flat band produces a global \"sweet plateau\" of phase insensitivity, surpassing localized sweet spots of conventional superconducting qubits and enabling a robust architecture for symmetry-protected Andreev qubits.", "url": "https://arxiv.org/abs/2605.02095", "type": "理论", "summary": "1. 该工作在三端约瑟夫森结的Bogoliubov-de Gennes谱中，揭示了合成布里渊区内的层级拓扑相：连续谱陈绝缘体相携带量子化单极子电荷±1，而次能隙Andreev束缚态则由量子化偶极不变量表征。\n2. 核心技术是通过时间反演对称性破缺诱导合成平带，该平带在全相位空间中抑制直流约瑟夫森电流，并使电压偏置下的时间平均跨导呈现对相位波动不敏感的鲁棒量子化，其行为类似霍尔电导平台，源于平带极限与偶极相位的协同作用。\n3. 该平带导致全局相位不敏感“甜区”而非局域优化，克服了传统超导量子比特的局限性，为利用对称保护机制构建高性能Andreev量子比特及拓扑量子计算架构提供了坚实平台。", "summary_source": "deepseek", "authors": [{"name": "Subhadeep Chakraborty"}, {"name": "Aabir Mukhopadhyay"}, {"name": "Udit Khanna"}, {"name": "Sourin Das"}], "featured_authors": [{"name": "Subhadeep Chakraborty"}, {"name": "Aabir Mukhopadhyay"}, {"name": "Udit Khanna"}, {"name": "Sourin Das"}], "author_count": 4}, {"id": "2605.02148", "category": "cond-mat", "title": "Mobility Anisotropy Reshapes Self-Propelled Motion", "abstract": "We exactly solve the nonequilibrium dynamics of a harmonically trapped self-propelled particle with anisotropic translational mobility in two dimensions, relevant to rodlike microswimmers and wheeled robots. The mean displacement and MSD reveal a quasi-steady plateau with vanishing fluctuations in the high-persistence regime. An exact calculation of steady-state fourth moment yields a negative excess kurtosis that varies non-monotonically with the ratio of mechanical to rotational relaxation timescales. This gives rise to a strictly sub-Gaussian steady-state position distribution, in which the particle with anisotropic mobility, in high persistence regime, is displaced into the high-potential region lying outside the stationary contour set by the activity and harmonic confinement. This is further corroborated by the relaxation of the MSD from the quasi-steady plateau to the steady-state regime.", "url": "https://arxiv.org/abs/2605.02148", "type": "数值", "summary": "1. 该工作精确求解了二维简谐势阱中具有各向异性迁移率的自推进粒子的非平衡动力学。\n2. 其关键在于揭示了高持久性下准稳态平台的涌现，以及稳态四阶矩为负且非单调变化的亚高斯分布，并指出粒子位移进入高势能区。\n3. 这为理解各向异性活性体系（如杆状微游泳器）的非平衡统计提供了精确解析框架，并启发对活性自推进约束系统的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Amir Shee"}, {"name": "P. S. Pal"}], "featured_authors": [{"name": "Amir Shee"}, {"name": "P. S. Pal"}], "author_count": 2}, {"id": "2605.02228", "category": "cond-mat", "title": "Validity and Limits of Low Order Hybridization Expansion Approaches for Multi-Orbital Systems", "abstract": "Low-order hybridization expansion methods such as the non-crossing approximation (NCA) and the one-crossing approximation (OCA) are widely used impurity solvers in the study of strongly correlated systems, yet their accuracy in genuine multi-orbital settings remains poorly understood. Using the decoupled orbital limit as a controlled reference point, we derive analytic results connecting multi-orbital restricted propagators and Green's functions to their single-orbital counterparts, identify the diagrammatic mechanisms responsible for the breakdown of low-order methods in multi-orbital settings, and determine their regimes of applicability. Our central finding is that the accuracy of these methods is governed by the least correlated orbital: i.e., the orbital with the most rapidly decaying retarded Green's function. That orbital's properties are transferred to all other orbitals through a spurious coupling generated by the truncated expansion, thereby suppressing correlation-induced features such as the Kondo resonance. This occurs even in orbitals that are themselves strongly correlated within single-orbital calculations using the same approximation scheme. We confirm this numerically across representative two-orbital model systems in the steady-state, systematically identifying the parameter regimes in which low-order methods succeed or fail. Our results provide a practical guide for assessing when insights from single-orbital calculations carry over to multi-orbital settings, and serve as a benchmark for the development and validation of higher-order multi-orbital impurity solvers.", "url": "https://arxiv.org/abs/2605.02228", "type": "理论+数值", "summary": "1. 该工作通过解耦轨道极限解析推导与数值验证，系统评估了低阶杂化展开方法（NCA/OCA）在多轨道体系中的有效性与失效机制。\n2. 核心发现是准确性由最弱关联轨道控制，其快速衰减的推迟格林函数经由截断展开产生的虚假耦合抑制其他轨道的关联特征如近藤共振。\n3. 这为判定低阶方法在多轨道计算中的适用参数区间提供了实用准则，并为发展高阶杂质求解器设立了基准。", "summary_source": "deepseek", "authors": [{"name": "Dolev Goldberger"}, {"name": "Ido Zemach"}, {"name": "Lei Zhang"}, {"name": "Yang Yu"}, {"name": "Emanuel Gull"}, {"name": "Guy Cohen"}, {"name": "André Erpenbeck"}], "featured_authors": [{"name": "Dolev Goldberger"}, {"name": "Ido Zemach"}, {"name": "Lei Zhang"}, {"name": "Emanuel Gull"}, {"name": "Guy Cohen"}, {"name": "André Erpenbeck"}], "author_count": 7}, {"id": "2605.02267", "category": "cond-mat", "title": "Composition-Weighted Symbolic Regression for General-Purpose Property Prediction", "abstract": "We introduce a composition-weighted symbolic regression framework for interpretable prediction of materials properties directly from chemical composition. The method jointly learns analytical functional forms and task-dependent elemental weightings without predefined descriptors. By incorporating max/min operators, it naturally enforces constraints such as non-negative band gaps and bounded classification probabilities, unifying regression and classification tasks. Efficient search is achieved through a hybrid Monte Carlo tree search--genetic programming algorithm with gradient-based refinement and parallel computation. Benchmarks on MatBench tasks show competitive accuracy relative to state-of-the-art black-box models while yielding explicit analytical expressions. Applied to III--V semiconductor alloys, the model produces smooth composition-dependent trends and learned elemental weights with chemically meaningful periodic behavior. This framework provides a scalable and interpretable route for materials discovery and property screening.", "url": "https://arxiv.org/abs/2605.02267", "type": "理论+数值", "summary": "1. 该工作提出了一种成分加权符号回归框架，直接基于化学组成实现材料性质的可解释预测。\n2. 其技术核心在于联合学习解析函数形式与任务依赖的元素权重，并通过max/min算子自然施加非负带隙等物理约束，统一回归与分类任务。\n3. 该框架在保持与黑箱模型相当精度的同时产出显式表达式，为材料筛选和性质设计提供了一条可扩展且可解释的路径。", "summary_source": "deepseek", "authors": [{"name": "Yang Huang"}, {"name": "Jingrun Chen"}], "featured_authors": [{"name": "Yang Huang"}, {"name": "Jingrun Chen"}], "author_count": 2}, {"id": "2605.02294", "category": "cond-mat", "title": "First-Principles Effective Mass in the Three-Dimensional Uniform Electron Gas", "abstract": "The quasiparticle effective mass $m^*$ of the three-dimensional uniform electron gas (UEG) is a fundamental Fermi-liquid parameter whose value and density dependence have remained controversial for decades. Using renormalized perturbation theory with explicit counterterms, we determine $m^*$ in the metallic regime ($r_s \\le 6$) from first principles by two complementary routes -- the self-energy and the forward-scattering four-point vertex via the $p$-wave spin-symmetric Landau parameter $F_1^s$ -- that agree within uncertainties at each density through sixth renormalized order. The resulting $m^*/m$ remains close to unity throughout the metallic regime, with a shallow non-monotonic density dependence -- a minimum near $r_s\\approx 1$ followed by a gentle upturn -- reflecting the interplay of exchange and dynamical screening in the self-energy, and disfavoring strong monotonic suppression. This finding supports a physical picture for the metallic UEG in which dominant charge correlations are concentrated in nearly forward scattering and generate only a weak $F_1^s$ component.", "url": "https://arxiv.org/abs/2605.02294", "type": "理论", "summary": "1. 该工作通过包含显式抵消项的第六阶重整化微扰论，从第一性原理计算了三维均匀电子气在金属区域(r_s≤6)的准粒子有效质量，并经自能与前向散射四点顶点两种路径确认结果一致。\n2. 其技术核心在于利用p波自旋对称朗道参数F_1^s作为桥梁，揭示有效质量m*/m在整个金属区域接近1且呈浅的非单调密度依赖性，反映交换与动力学屏蔽的精细竞争。\n3. 这一发现支持电荷关联集中于近前向散射的物理图像，为澄清该费米液体基本参数的长久争议提供了第一性原理基准。", "summary_source": "deepseek", "authors": [{"name": "Pengcheng Hou"}, {"name": "Daniel Cerkoney"}, {"name": "Zhiyi Li"}, {"name": "Tao Wang"}, {"name": "Xiansheng Cai"}, {"name": "Lei Wang"}, {"name": "Gabriel Kotliar"}, {"name": "Youjin Deng"}, {"name": "Kun Chen"}], "featured_authors": [{"name": "Pengcheng Hou"}, {"name": "Daniel Cerkoney"}, {"name": "Zhiyi Li"}, {"name": "Gabriel Kotliar"},
