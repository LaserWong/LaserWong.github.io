ate. Independently, for a specified all-even reduced two-state drift with $\\rho<4$, the drift-only lower bound is $\\sigma \\ge \\tau_x^{-1}(4/\\rho-1)$. Published \\textit{E.~coli} and \\textit{C.~elegans} responses provide biological examples of these limits. The distinction established here between transfer-function invariants, reduction-dependent properties, and hidden-state quantities provides a concrete framework for evaluating the limitations of low-dimensional models of adaptive biological dynamics.", "url": "https://arxiv.org/abs/2609.01329", "type": "理论", "summary": "1. 该工作以感觉适应为例，证明单个由实一阶弛豫模式组成的高阶系统可约化到二阶极点边界两侧，使约化模型的实复极点分类依赖拟合方案而非约化不变量。\n2. 其核心在于借助一般二态谱揭示：隐藏态无自弛豫时交叉扩散从标量谱消失，此条件恰是精确适应的积分记忆极限，而漏记忆恢复谱敏感性，且不可逆率仍依赖隐藏交叉扩散通道。\n3. 这为评估低维自适应生物动力学的可辨识性极限提供了区分转移函数不变量、约化依赖量与隐藏态量的框架，并可由大肠杆菌和线虫响应加以约束。", "summary_source": "deepseek", "authors": [{"name": "Gunn Kim"}], "featured_authors": [{"name": "Gunn Kim"}], "author_count": 1}, {"id": "2609.01363", "category": "cond-mat", "title": "Antiresonances of Wannier-Stark ladders in Su-Schrieffer-Heeger lattices", "abstract": "We demonstrate that Wannier-Stark ladders (WSLs) in one-dimensional Su-Schrieffer-Heeger (SSH) chains manifest as antiresonance signatures in the electron transmission. We study the quantum transport in the SSH chain in the presence of a periodic potential profile plus a uniform electric field. By employing the global matrix method with non-trivial matching conditions, we find that these WSL antiresonances correspond to states that are exponentially localized at the potential's incident boundary. These findings provide a robust, unified framework for identifying WSLs across diverse scales, ranging from electronic transport in trans-polyacetylene to classical-wave analogs in phononic crystals and surface water waves.", "url": "https://arxiv.org/abs/2609.01363", "type": "理论", "summary": "1. 本文针对叠加均匀电场和周期势的一维Su-Schrieffer-Heeger链，计算并分析了其电子输运中的Wannier-Stark梯级（WSL）反共振谱。\n2. 利用含非平凡匹配条件的全局矩阵法，作者发现此类反共振源于势入射边界处呈指数局域的WSL态，建立起能谱局域化与输运反共振之间的直接联系。\n3. 该识别框架具有跨尺度普适性，可推广至反式聚乙炔的电子输运及声子晶体、表面水波等经典波系统中的WSL探测。", "summary_source": "deepseek", "authors": [{"name": "Yonatan Betancur-Ocampo"}, {"name": "Guillermo Monsivais"}], "featured_authors": [{"name": "Yonatan Betancur-Ocampo"}, {"name": "Guillermo Monsivais"}], "author_count": 2}, {"id": "2609.01492", "category": "cond-mat", "title": "Accelerating dynamic simulations of photoexcited materials and their evolution by electron-informed machine learning", "abstract": "Nonadiabatic coupled electron-nuclear dynamics upon electronic excitation underpin the microscopic mechanism and rational modulation of diverse photoinduced functional phenomena in materials, yet their direct first-principles simulations remain computationally demanding. Here we develop a framework for nonadiabatic excited-state machine-learning molecular dynamics (EMLMD) simulations, where the nonequilibrium electronic information upon photoexcitation such as electron temperature is rigorously calibrated from high-precision real-time time-dependent density functional theory (rt-TDDFT) benchmark simulations, enabling accurate reconstruction of excited-state potential energy surfaces (PES). This framework natively incorporates the excited-state electron-phonon couplings and intrinsically captures photoinduced phonon anharmonicity, both of which are missing in standard machine learning molecular dynamics, thus delivering first-principles-level accuracy for excited-state atomic evolutions. Large-scale EMLMD simulations resolve time- and momentum-resolved phonon dynamics in photoexcited materials, directly uncovering the competition between photogenerated coherent phonons and thermal phonons during photoinduced phase transition of bismuth. It also simultaneously resolves elusive atomic-scale microscopic dynamics and global structural rearrangement for selenium photoamorphization. Balancing high accuracy and efficiency, EMLMD offers a versatile paradigm to tackle key challenges in the study of complex excited-state molecular dynamics.", "url": "https://arxiv.org/abs/2609.01492", "type": "理论+数值", "summary": "1. 该工作开发了机器学习激发态分子动力学模拟框架，以加速光激发材料中电子-核非绝热耦合演化的第一性原理级模拟。\n2. 其核心是将实时含时密度泛函理论基准中的电子温度等非平衡电子信息严格标定到激发态势能面重构，从而天然包含激发态电子-声子耦合及光致声子非简谐性。\n3. 大规模模拟揭示了铋光致相变中光生相干声子与热声子的竞争，并同时解析硒光非晶化过程中原子尺度微观与全局结构重排，为复杂激发态量子动力学研究提供了高效范式。", "summary_source": "deepseek", "authors": [{"name": "Yunzhe Jia"}, {"name": "Fankai Xie"}, {"name": "Yunfei Bai"}, {"name": "Miao Liu"}, {"name": "Cui Zhang"}, {"name": "Sheng Meng"}], "featured_authors": [{"name": "Yunzhe Jia"}, {"name": "Fankai Xie"}, {"name": "Yunfei Bai"}, {"name": "Miao Liu"}, {"name": "Cui Zhang"}, {"name": "Sheng Meng"}], "author_count": 6}, {"id": "2609.01602", "category": "cond-mat", "title": "Singular Weak-Field Thermodynamics of 2D Superconductors", "abstract": "In a bulk 3D type-II superconductor, the lower critical field at which an isolated vortex becomes thermodynamically favorable is a size-independent material property. We show that the situation is different in 2D superconductors: the larger the superconductor, the weaker the field needed to create its first vortex. The lower critical field in 2D is always size-dependent. For a disk of area $\\mathcal A$, the lower critical field $B_v(\\mathcal A)$ scales as $\\mathcal A^{-1}\\ln(\\mathcal A/\\mathcal A_0)$ in the weak-screening regime and as $\\mathcal A^{-1/2}$ in the strong-screening regime. We derive these results from an analytically tractable microscopic model that admits many-body wavefunctions for both the uniform and singly quantized vortex states in a magnetic field, and incorporate screening by coupling their long-distance 2D supercurrents to 3D Maxwell equations. These results motivate organizing the weak-field ground-state of a 2D superconductor in the $(1/\\mathcal A,B)$ plane. The origin represents the zero-field thermodynamic limit and it is singular. Approaching the origin along the $B$ axis leads to an increasingly dilute vortex lattice, whereas approaching along the $1/\\mathcal A$ axis yields the uniform vortex-free state. Our theory shows that every trajectory carrying fixed finite flux ultimately approaches the vortex-free state in the thermodynamic limit and provides a firm microscopic foundation for the weak-field thermodynamics of 2D superconductors.", "url": "https://arxiv.org/abs/2609.01602", "type": "理论", "summary": "1. 该工作研究了二维超导体弱场热力学中下临界场对系统面积的依赖，发现首个孤立涡旋出现的磁场随超导体尺寸增大而降低。\n2. 其要点是利用可解析微观模型同时构造均匀态和单量子涡旋态的多体波函数，并通过与三维麦克斯韦方程耦合处理长程超流响应，得到弱屏蔽与强屏蔽下分别按\\(\\mathcal A^{-1}\\ln(\\mathcal A/\\mathcal A_0)\\)与\\(\\mathcal A^{-1/2}\\)标度的下临界场。\n3. 这为在\\((1/\\mathcal A,B)\\)平面理解二维超导体弱场基态提供了微观基础，并表明携带有限磁通的任一轨迹在热力学极限下趋于均匀无涡态。", "summary_source": "deepseek", "authors": [{"name": "Guopeng Xu"}, {"name": "Chunli Huang"}], "featured_authors": [{"name": "Guopeng Xu"}, {"name": "Chunli Huang"}], "author_count": 2}, {"id": "2609.00096", "category": "hep-th", "title": "Quantum corrections to the black hole entropy using the brick wall model", "abstract": "It was suggested by 't Hooft that to avoid the divergence of the free energy or entropy of the probe fields, one has to introduce an infrared (IR) cutoff. This introduction of the IR cutoff, namely, the brick wall model, has been studied for the Schwarzschild black hole and has been shown by 't Hooft that to have the entropy of the order of Bekenstein-Hawking entropy, the cutoff must be of the order of Planck length. In this study, we investigated the brick wall model in the context of a Reissner-Nordstróm, quantum corrected Schwarzschild and quantum corrected Reissner-Nordström black holes. In particular, we have shown that the brick wall model can give logarithmic correction to the black hole entropy in the subleading order. The important aspect of our analysis is that we have not considered the near horizon approximation of the lapse function and get more accurate correction to the entropy. This corrected entropy has an important feature that it is larger than the usual Bekenstein-Hawking entropy which aligns with the result of Barrow entropy.", "url": "https://arxiv.org/abs/2609.00096", "type": "理论", "summary": "1. 该工作将砖墙模型推广至Reissner-Nordström、量子修正Schwarzschild以及量子修正Reissner-Nordström黑洞，研究探测场熵的量子修正。\n2. 其技术要点在于放弃近似的lapse函数近视界展开，从而在次领头阶得到黑洞熵的对数修正，且结果高于通常的Bekenstein-Hawking熵。\n3. 这一修正与Barrow熵的性质一致，为理解量子引力背景下的黑洞微观态统计以及截断方案的物理意义提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Gopinath Guin"}, {"name": "Arpita Jana"}, {"name": "Sunandan Gangopadhyay"}], "featured_authors": [{"name": "Gopinath Guin"}, {"name": "Arpita Jana"}, {"name": "Sunandan Gangopadhyay"}], "author_count": 3}, {"id": "2609.00119", "category": "hep-th", "title": "Black Hole-Tower Correspondence: Species backreaction in minimal black hole limits", "abstract": "The Black Hole-String Correspondence identifies the microstates of a minimal black hole with those of a highly excited string. In decompactification limits, where the light states are Kaluza--Klein modes, its proposed counterpart is the Black Hole-Tower Correspondence at the species scale. We extend it in three directions. First, we expand the free thermodynamic analysis to include towers with string-oscillators and Kaluza--Klein modes, and clarify whether the ensemble connects to a $d$-dimensional black hole or a wrapped black string. Second, we include gravitational backreaction in the pure Kaluza--Klein tower transition. With no winding-tachyon analogue, the interpolating configuration is the one-loop Kaluza--Klein gas, which reorganizes into higher-dimensional radiation and yields self-gravitating solutions whose instability points to the black string and whose thermodynamics match it at the correspondence point, $S\\sim N_{\\rm sp}$, where the size approaches the species length. This shows that the matching is robust under self-interactions. Third, we ask whether the two phases are continuously connected, revisiting and extending the worldsheet and topological analyses of the Black Hole-String case to include also Kaluza--Klein towers. Linear sigma model families interpolate smoothly in the heterotic string, while in type II the transition is obstructed. The cobordism classes of the two saddles agree in every structure we check, but their brane-charge lattices, given by bordism groups, differ, which is the source of the type II obstruction. This obstruction is thus perturbative, showing that the transition can only proceed through the non-perturbative, charge-violating processes of the kind predicted by the Cobordism Conjecture.", "url": "https://arxiv.org/abs/2609.00119", "type": "理论", "summary": "1. 该工作将黑洞-塔对应推广到含弦振子与KK塔的极限，在自由热力学之外引入引力反作用和完整的拓扑插值分析。\n2. 关键进展是证明纯KK塔转变可由单圈气体自引力重构为高维辐射，当熵S~N_sp时与黑弦热力学匹配，且杂化弦理论中两相连续过渡而II型受扰动阻碍。\n3. 由此推断该跃迁只能依靠协边猜想预言的电荷破坏非微扰过程完成，为极小黑洞与高激发弦的对应提供了谱和拓扑上的自洽判据。", "summary_source": "deepseek", "authors": [{"name": "Miquel Aparici"}, {"name": "Alvaro Herráez"}, {"name": "Joaquin Masias"}], "featured_authors": [{"name": "Miquel Aparici"}, {"name": "Alvaro Herráez"}, {"name": "Joaquin Masias"}], "author_count": 3}, {"id": "2609.00120", "category": "hep-th", "title": "Subleading Collinear Limits of Yang--Mills Amplitudes from Recursions", "abstract": "We study the subleading adjacent-collinear limit of tree-level color-ordered Yang--Mills amplitudes. In general dimensions, a Lorentz null rotation transports the polarizations of collinear legs along the collinear path while preserving transversality and gauge equivalence. The finite coefficient then separates into a pole-free hard contribution, computed by a channel-deleted Berends--Giele recursion, and an explicit contribution from the adjacent factorization channel. In four dimensions, we construct the same coefficient directly from a collinear-aware Britto-Cachazo-Feng-Witten recursion whose terminal data are closed MHV and $\\overline{\\rm MHV}$ formulas. Both constructions apply at arbitrary momentum fraction and extend to collinear gluons with distinct polarizations; at the symmetric split, the auxiliary-vector dependence cancels for equal polarizations and for the polarization-symmetrized mixed limit. Open--closed disk relations then give a direct construction of one-graviton Einstein--Yang--Mills amplitudes and their higher-derivative string corrections from the recursively generated coefficients. A self-contained \\textsc{Mathematica} implementation accompanies the paper.", "url": "https://arxiv.org/abs/2609.00120", "type": "理论", "summary": "1. 该工作利用递推方法系统构造了树级色序杨-米尔斯振幅的次领头共线极限系数，适用于一般维度与任意动量分数。\n2. 技术上通过零旋转保持极化横向性并保持规范等价，将系数分解为无极点硬贡献与相邻因子化贡献；四维下改用共线感知的BCFW递推，并以闭式MHV与反MHV公式作为递推终态。\n3. 借助开闭弦盘关系，该系数可直接构造单引力子Einstein-Yang-Mills振幅及其高导弦修正，为共线极限与引力振幅的联系提供了统一递归框架。", "summary_source": "deepseek", "authors": [{"name": "Jin Dong"}, {"name": "Stephan Stieberger"}], "featured_authors": [{"name": "Jin Dong"}, {"name": "Stephan Stieberger"}], "author_count": 2}, {"id": "2609.00122", "category": "hep-th", "title": "Classification of Rational $c=1$ Vertex Operator Algebras and Vertex Operator Superalgebras", "abstract": "For mathematicians: In this first in a series of two papers, we give a mathematically rigorous classification of (sufficiently nice) $c=1$ vertex operator algebras (VOAs) and vertex operator superalgebras (VOSAs). We confirm the lore that any such VO(S)A is either a lattice VO(S)A $V_L$ associated to a rank-1 integral lattice $L$, or can be obtained as an orbifold thereof, i.e. a $G$-invariant subalgebra $V_L^G$ for some finite group $G$ of automorphisms. All such $G$ are known, allowing for an explicit enumeration of nice $c=1$ VO(S)As. A key ingredient in our approach is to establish a general criterion for nice VOAs, requiring knowledge only of the vacuum character, for testing when the simple modules with integer conformal dimension span a symmetric fusion subcategory which is braided tensor equivalent to $Rep(G)$. In our companion paper, we calculate the ribbon auto-equivalences of the representation categories of the nice $c=1$ VOAs, and leverage this to obtain the classification of nice bosonic and fermionic $c=1$ full conformal field theories. For physicists: We rigorously classify the chiral algebras that can arise in the holomorphic sector of a bosonic or fermionic rational $c=1$ conformal field theory (CFT) whose non-identity primaries all have positive conformal dimension. Thinking of chiral algebras as gapless boundary conditions of 3D topological quantum field theories (TQFTs), our result says that any such chiral algebra is either a holomorphic boundary of $U(1)_k$ Chern-Simons theory, or can be obtained by passing to the $G$-invariant states thereof for some finite group $G$ of symmetries. We explicitly enumerate these chiral algebras and also discuss their non-invertible symmetries. In a companion paper, we build on these results using techniques from the study of 3D TQFTs to classify full bosonic and fermionic rational $c=1$ CFTs.", "url": "https://arxiv.org/abs/2609.00122", "type": "理论", "summary": "1. 该工作对非恒等初级场共形维数为正的c=1有理顶点算子(超)代数给出严格分类，证明其只能是秩一整格V_L或其有限自同构群的G-不变子代数。\n2. 技术关键在于仅用真空特征标即可判定整数共形维数单模是否张成与Rep(G)辫张量等价的对称融合子范畴，从而显式枚举这些手征代数并联系U(1)_k陈-西蒙斯理论的边界解释。\n3. 这为在3D TQFT框架下完备分类玻色与费米c=1有理共形场论奠定基础，也为理解此类系统非可逆对称性提供了严格起点。", "summary_source": "deepseek", "authors": [{"name": "Terry Gannon"}, {"name": "Brandon C. Rayhaun"}], "featured_authors": [{"name": "Terry Gannon"}, {"name": "Brandon C. Rayhaun"}], "author_count": 2}, {"id": "2609.00126", "category": "hep-th", "title": "Quantum Complexity Dynamics for Disjoint Subsystems", "abstract": "Quantum complexity has emerged as a natural probe of chaos, thermalization, and the black hole interior on timescales long after local observables have equilibrated. However, its time evolution has been studied almost exclusively in subsystems confined to a single connected region. We show, using complementary tools from holography and random quantum circuits, that noncontiguous subsystems composed of multiple disjoint regions give rise to qualitatively new physics compared to the contiguous case. First, at finite temperature, a subsystem occupying less than half of the total system can carry high complexity at late times, even as the complexity of its larger complement remains low. This inversion of the usual hierarchy is intrinsically thermal: it vanishes in the infinite-temperature limit, which is the regime modeled by random quantum circuits. Second, if a subsystem's complexity equilibrates at an early time, then fragmenting it into $m$ disjoint components can further reduce this timescale by a factor of $m$, a phenomenon we exhibit in both holography and random quantum circuits. These results not only sharpen the correspondence between geometric and computational notions of complexity, but also motivate the search for novel complexity phenomena in quantum dynamics.", "url": "https://arxiv.org/abs/2609.00126", "type": "理论", "summary": "1. 该工作利用全息对偶与随机量子电路，研究由多个不相连区块组成的非连通子系统量子复杂度在混沌与热化动力学中的演化。\n2. 其主要物理结果有二：有限温度下，小于总系统一半的子系统可在晚时保持高复杂度而其更大的补集复杂度很低；当复杂度早期平衡时，将子系统分割为m块可把该平衡时标缩短m倍。\n3. 这些发现从几何与计算两个层面揭示了复杂度层次的反转与碎片加速效应，并激励在更一般量子动力学中寻找新的复杂度现象。", "summary_source": "deepseek", "authors": [{"name": "Yale Fan"}, {"name": "Nicholas Hunter-Jones"}, {"name": "Andreas Karch"}, {"name": "Minju Kum"}, {"name": "Shivan Mittal"}], "featured_authors": [{"name": "Yale Fan"}, {"name": "Nicholas Hunter-Jones"}, {"name": "Andreas Karch"}, {"name": "Minju Kum"}, {"name": "Shivan Mittal"}], "author_count": 5}, {"id": "2609.00131", "category": "hep-th", "title": "A 1/4-BPS chiral algebra in D1D5: from charge concentration to BPS chaos", "abstract": "The D1D5 CFT exhibits a charge concentration puzzle for BPS states, similar to, but simpler than, that of $\\mathcal{N}=4$ SYM. We consider the chiral algebra of 1/4-BPS operators in the D1D5 CFT arising from a supercharge cohomology, and the resulting rational correlators. Using crossing symmetry and this chiral algebra, we establish a non-perturbative proof of the existence of a family of 1/4-BPS states away from the charge concentration locus for general coupling and finite central charge. We further discuss possible implications for BPS chaos in the D1D5 CFT and compute a late-time BPS plateau at the orbifold point.", "url": "https://arxiv.org/abs/2609.00131", "type": "理论", "summary": "1. 该工作在D1D5 CFT中构造1/4-BPS算符的手性代数并研究其有理关联函数。\n2. 利用交叉对称和该代数，非微扰地证明一般耦合及有限中心荷下电荷集中点外存在1/4-BPS态族。\n3. 这为D1D5中的BPS混沌提供代数基础，并支持在轨道点计算后期BPS平台及其推广。", "summary_source": "deepseek", "authors": [{"name": "Alexandre Belin"}, {"name": "Suzanne Bintanja"}, {"name": "Alessandra Gnecchi"}, {"name": "Damian R. Musk"}, {"name": "Kyriakos Papadodimas"}], "featured_authors": [{"name": "Alexandre Belin"}, {"name": "Suzanne Bintanja"}, {"name": "Alessandra Gnecchi"}, {"name": "Damian R. Musk"}, {"name": "Kyriakos Papadodimas"}], "author_count": 5}, {"id": "2609.00148", "category": "hep-th", "title": "Regulating Free-scalar and Yang--Lee 5d CFTs on the Fuzzy Four Sphere", "abstract": "Non-commutative sphere regularization of CFT has become a powerful tool for computing conformal data of 3d CFTs and was recently extended to 4d CFTs. In this work we further construct 5d free-scalar CFT and Yang-Lee CFT on a fuzzy 4-sphere. We observe a continuous phase transition and conformal towers in these examples. We obtain the first three scalar primaries of the 5d free-scalar CFT, furthermore, we compute the 5d Yang-Lee $\\Delta_\\phi,\\Delta_{\\phi^3}$ with $N_e=10$ fermions using exact diagonalization (ED) and $N_e=20$ fermions using density matrix renormalization group (DMRG), obtaining relatively good agreement with both $\\epsilon$-expansion and the Gliozzi truncated bootstrap result.", "url": "https://arxiv.org/abs/2609.00148", "type": "理论", "summary": "1. 该工作将模糊球面非对易正则化方案推广至五维，在模糊四球上构造了自由标量CFT与Yang-Lee CFT。\n2. 其要点是观察到连续相变与共形塔，并用精确对角化和DMRG求得五维自由标量的前三个标量初级及Yang-Lee的Δφ、Δφ^3，结果与ε展开及截断bootstrap一致。\n3. 这为借助非对易几何和张量网络方法研究更高维或非幺正CFT的精确共形数据提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Jiangyuan Qian"}], "featured_authors": [{"name": "Jiangyuan Qian"}], "author_count": 1}, {"id": "2609.00150", "category": "hep-th", "title": "On the mass spectrum of Viel-dreibein gravity", "abstract": "We study the AdS-wave configurations of Viel-dreibein gravity, a three-dimensional theory of $N$ interacting spin-2 fields, as a pretext to characterize the mass spectrum of this multigravity theory. We manage to implement the known strategy of rewriting the system as a higher-derivative theory for a single dreibein, thereby deriving the precise $2N$th-order equation governing the dynamics of the AdS-wave profile in question. The second novelty we introduce is a factorization of such an equation as the product of $N$ Klein-Gordon operators, exploiting the recent representation of the roots of any $N$th-degree polynomial in terms of the increasingly celebrated $\\mathscr{A}$-hypergeometric functions. Remarkably, this allows us to determine the mass spectrum of the full theory independently of the number of involved gravities, which is essential for an explicit construction of the AdS-wave solutions. This enables us to explore the parameter space of the theory and find all its critical points (not only the Breitenlohner-Freedman bounds) where a much wider range of degeneracies in the squared masses arises. At those points, the solutions allow a zoo of new logarithmic modes leading to several $\\log^{\\chi-1}$ asymptotic behaviors, with $\\chi\\le N$, a signature of the existence of allegedly dual logarithmic conformal field theories.", "url": "https://arxiv.org/abs/2609.00150", "type": "理论", "summary": "1. 该工作以三维 Viel-dreibein 多重引力理论中的 AdS 波构型为探针，刻画 N 个相互作用自旋-2 场体系的质量谱。\n2. 其技术核心是将系统改写为单一 dreibein 的高阶导数理论，导出的 2N 阶方程借助 A-超几何函数因式分解为 N 个 Klein-Gordon 因子，从而与 N 无关地给出完整质量谱并定位全部临界点。\n3. 在临界点处出现一系列对数模与 log^{χ−1} 渐近行为，为理论对应的对数共形场论对偶提供了明确的谱学迹象。", "summary_source": "deepseek", "authors": [{"name": "Eloy Ayón-Beato"}, {"name": "Elizabeth Rodr\\'ıguez Querts"}], "featured_authors": [{"name": "Eloy Ayón-Beato"}, {"name": "Elizabeth Rodr\\'ıguez Querts"}], "author_count": 2}, {"id": "2609.00153", "category": "hep-th", "title": "Subleading Collinear Limits of Yang-Mills Amplitudes from Gravity", "abstract": "We show that the subleading collinear sector of Yang-Mills (YM) amplitudes is controlled by ordinary Einstein-Yang-Mills (EYM) amplitudes and their higher-derivative corrections. The complete set of strict subleading collinear limits associated with an equal-helicity collinear pair can be extracted from open-closed string disk amplitudes. The latter generate $\\frac12 (n-3)!$ BCJ-like relations with non-linear kinematic coefficients, reducing the $(n-3)!$ collinear data to a basis of dimension $\\frac12 (n-3)!$. This reduced basis can be represented by gravitational amplitudes in EYM theories and by their higher-derivative open-string corrections. At multiplicity $n$ this gravitational basis consists of the $(n-4)!$ independent EYM subamplitudes together with $\\frac12 (n-5)(n-4)!$ higher-order corrections involving one graviton and $n-2$ gluons. The resulting decomposition is governed by unsigned Stirling numbers of the first kind: the ordinary EYM amplitudes correspond to the sector $\\left[{n-3\\atop 1}\\right]$, the higher-order BCJ-like relations to even sectors $\\left[{n-3\\atop 2j}\\right]$, and the higher-derivative EYM corrections to odd sectors $\\left[{n-3\\atop 2j+1}\\right]$ with $j\\geq 1$.", "url": "https://arxiv.org/abs/2609.00153", "type": "理论", "summary": "1. 该工作从开闭弦盘振幅出发，证明杨-米尔斯振幅的严格次领头等螺旋共线极限可由普通爱因斯坦-杨-米尔斯振幅及其高导修正控制。\n2. 其核心卖点是导出 \\(\\frac12(n-3)!\\) 个带非线性运动学系数的类BCJ关系，将共线数据约化到由 \\((n-4)!\\) 个EYM子振幅与 \\(\\frac12(n-5)(n-4)!\\) 个单引力高导修正构成的基，并按第一类无符号Stirling数奇偶扇区分解。\n3. 这为用引力与弦论结构组织杨-米尔斯振幅的共线极限提供了明确框架，也启发高重数过程中新的振幅关系与有效场论约束。", "summary_source": "deepseek", "authors": [{"name": "Jin Dong"}, {"name": "Stephan Stieberger"}], "featured_authors": [{"name": "Jin Dong"}, {"name": "Stephan Stieberger"}], "author_count": 2}, {"id": "2609.00160", "category": "hep-th", "title": "Exploring thermal order in conformal theories with multiple scalars coupled to an $O(N)$ vector field", "abstract": "We study thermal order in conformal field theories (CFTs) in $d=4-\\epsilon$ and $d=3$ dimensions where several scalars are coupled to an $O(N)$ vector field. In $(4-\\epsilon)$ dimensions, we consider models coupling a cubic model of $M$ scalars with $\\mathbb{Z}_2^M\\rtimes S_M$ symmetry (corresponding to sign flips and permutations of the scalars) to an $O(N)$ vector model. For any $M$, we find a window of $N$ in which two Wilson-Fisher-like fixed points exist. We show that the $\\mathbb{Z}_2^M\\rtimes S_M$ symmetry is spontaneously broken at arbitrary nonzero temperatures for $M=2$ and sufficiently large $N$ within this window, but it remains unbroken for $M>2$. Using the functional renormalisation group to continue these fixed points towards three dimensions, we find that they collide and move into the complex plane well before reaching $d=3$, suggesting that their continuation to $d=3$ does not yield unitary CFTs. We then work directly in three dimensions at large but finite $N$, with $M\\ll N$, initially without assuming any permutation symmetry among the $M$ scalars. By studying the RG flow, we show that these models possess a conformal manifold up to the leading nontrivial order in the $1/N$ expansion of the beta functions (which is $\\mathcal{O}(1/N)$). At each point on this manifold, the scalars split into two classes that are distinguished by how they couple to the $O(N)$ vector field. We then restrict to a subspace of the conformal manifold where there is an additional symmetry under permutations of the scalars within each class. We prove that in a domain of this subspace, all $M$ scalars acquire thermal expectation values such that the symmetry under sign flips of the scalars is spontaneously broken at all nonzero temperatures. This provides a novel class of large $N$ CFTs that exhibit a rich pattern of persistent symmetry breaking at nonzero temperatures.", "url": "https://arxiv.org/abs/2609.00160", "type": "理论", "summary": "1. 该文研究多个标量场与O(N)矢量场耦合的共形场论在d=4−ε与d=3中的热序行为。\n2. 其技术要点是：ε展开显示任意M均存在一个N窗口，其中两个类Wilson-Fisher不动点共存，且M=2时符号翻转对称性在足够大N下于任意非零温度自发破缺，而M>2保持不破缺；功能重整化群显示这些不动点在抵达三维前即碰撞进入复平面。\n3. 直接三维大N计算证实β函数至1/N首阶存在共形流形，标量按与O(N)场耦合方式分成两类，并在子流形区域中所有M个标量均获得非零热期望值，从而在所有非零温度持续破坏符号翻转对称性，给出了一类新颖的大N共形场论。", "summary_source": "deepseek", "authors": [{"name": "Soumyadeep Chaudhuri"}, {"name": "Bilal Hawashin"}, {"name": "Eliezer Rabinovici"}, {"name": "Michael M. Scherer"}], "featured_authors": [{"name": "Soumyadeep Chaudhuri"}, {"name": "Bilal Hawashin"}, {"name": "Eliezer Rabinovici"}, {"name": "Michael M. Scherer"}], "author_count": 4}, {"id": "2609.00170", "category": "hep-th", "title": "Higher anomalies, compressing SPTs and cohomology operations", "abstract": "We explicitly compute and tabulate the suspension map for cohomology operations, applying it to the dimensional reduction of anomalies and higher group structures of generalised symmetries in quantum field theories and lattice systems. In a quantum system with a discrete $p$-form symmetry, we can restrict the symmetry defects to a codimension-$q$ subspace of spacetime, or equivalently confine the gauge field to a slab whose thickness approaches zero. This results in a $(p-q)$-form symmetry on the subspace. We determine the fate of two important properties of symmetries under this process. First, we compute the anomaly of the reduced symmetry, or the higher anomaly of the original symmetry, which acts as an obstruction to higher gauging and onsiteability. Second, for two symmetries forming a higher-group structure, encoded as a Postnikov class, we compute the reduced higher-group structure, which may or may not be trivial. Both cases are captured by the $q$-fold iteration of the cohomology suspension $\\Omega$, also known as the loop functor or transgression, in the cohomology of Eilenberg--MacLane spaces. Classical results state that $\\Omega$ is an isomorphism in a stable range and annihilates mixed anomalies. To calculate $\\Omega$ over a base ring which is not a field, we make use of small models for the chain DGAs of Eilenberg--MacLane spaces, pioneered by Cartan and Moore, whose results we review and extend. The critical added step is the improvement of a mod $p$ chain contraction to the $p$-local integers, obtained via a $p$-adic series. We automate the computations in a software package \\texttt{emcm}, and provide extensive tables of the results. Finally, to make contact with explicit cochain formulations of cohomology operations, we demonstrate how to calculate cup products and certain cup-$i$ products in this framework.", "url": "https://arxiv.org/abs/2609.00170", "type": "理论", "summary": "1. 该工作系统计算并汇整上同调运算的 q 重悬挂映射，用于确定量子场论与格点系统中 p 形式对称缺陷在余维为 q 的子空间上压缩后，约化(p−q)形式对称性的高反常与约化更高群结构。\n2. 技术核心是利用 Eilenberg–MacLane 空间链微分分次代数的小模型，并把 mod p 链收缩提升到 p-局部整数环，使得非域基环上的悬挂计算能由软件包 emcm 自动完成并提供系统表格。\n3. 这为理解高反常作为更高规范化和原位实现障碍的普遍机制给出精确判据，也为压缩对称保护拓扑相及后续一般上同调构造提供了可检验的计算框架。", "summary_source": "deepseek", "authors": [{"name": "Shani Nadir Meynet"}, {"name": "Elias Riedel Gårding"}], "featured_authors": [{"name": "Shani Nadir Meynet"}, {"name": "Elias Riedel Gårding"}], "author_count": 2}, {"id": "2609.00214", "category": "hep-th", "title": "Anomaly Matching between Topological Superconductors and $\\mathcal{N}=8$ Supergravity", "abstract": "The boundary of a $3{+}1$-dimensional topological superconductor carries a $\\mathbb{Z}_{16}$-valued global (Dai-Freed) anomaly, famously matched by the $16$ fermions of a Standard Model generation once a certain $\\mathbb{Z}_4$ symmetry is gauged. In a supergravity completion, though, a gravitino contributes $-7/16$ rather than $\\pm1/16$, obstructing this $\\mathbb{Z}_4$ in the Minimal Supersymmetric Standard Model. We observe that four-dimensional $\\mathcal{N}=8$ supergravity evades this fate. Its fermions, eight gravitini in the $\\mathbf 8$ and fifty-six spin-$\\tfrac12$ states in the $\\mathbf{56}=\\Lambda^3\\mathbf 8$ of the $SU(8)$ R-symmetry, saturate the anomaly. The cancellation holds for every admissible $\\mathbb{Z}_4$ structure, is consistent with the vanishing of the continuous $SU(8)$ anomaly, and follows from a Smith homomorphism identifying the supergravity anomaly with that of the topological superconductor. In maximal supergravity this $\\mathbb{Z}_4$ stays anomaly-free and gaugeable despite its eight gravitini. All numbers are reproduced by an open-source library described in the Supplemental Material.", "url": "https://arxiv.org/abs/2609.00214", "type": "理论", "summary": "1. 该工作证明四维N=8超引力中的八个引力微子（8表示）与五十六个自旋-1/2费米子（56表示）精确饱和3+1维拓扑超导体的Z16值Dai-Freed反常。\n2. 其核心在于用Smith同态将超引力反常等同于拓扑超导体反常，并说明该Z4对称性在所有允许结构下无反常、可规范，且与SU(8)连续反常相容，尽管每个引力微子贡献-7/16。\n3. 这为最大超引力中Z4对称性的规范一致性提供了具体依据，并与MSSM因引力微子而受阻形成对照，可能启发高能边界的反常匹配研究。", "summary_source": "deepseek", "authors": [{"name": "Christopher W. Murphy"}], "featured_authors": [{"name": "Christopher W. Murphy"}], "author_count": 1}, {"id": "2609.00328", "category": "hep-th", "title": "Accretion, mergers, and metastability of fuzzy spheres in a three-matrix model", "abstract": "A three-matrix model that contains a plethora of fuzzy sphere solutions was defined twenty years ago. It has been shown that in a certain regime of the model, combinations of fuzzy spheres become classical solutions of the model. In the original paper and subsequent works, the stability of specific states has been discussed, showing that only a single largest fuzzy-sphere configuration is stable. Here, we focus on a complementary question: starting from some initial configuration, is the thermodynamically preferred state approached rapidly, or are there other long-lived, metastable configurations which may support interesting physics? We find that the answer in the large-matrix limit depends on the dispersion of the initial configuration. We identify the elementary transition as an accretion, in which one sphere absorbs a single unit from another, and show that it is driven by fluctuations of the sphere centers. By measuring these fluctuations in long simulations, we find quantitative agreement with the one-loop effective action, with no free parameters. For multi-sphere states, we find that the stiffness of an inner sphere grows logarithmically with the number of surrounding layers, so that concentric onion-like configurations -- describing an emergent three-dimensional quantum space -- become increasingly long-lived.", "url": "https://arxiv.org/abs/2609.00328", "type": "理论", "summary": "1. 本文数值研究三矩阵模型中模糊球多重态向热力学稳定态的弛豫，发现大矩阵极限行为取决于初始构型的分散度。\n2. 其基本跃迁为一球吸收另一球单个单元的吸积，受球心涨落驱动，并与无自由参数的单圈有效作用量定量相符。\n3. 内层球刚度随包裹层数对数增长，使同心洋葱状的亚稳构型可作为三维量子空间越发长寿地存在。", "summary_source": "deepseek", "authors": [{"name": "M. Hrmo"}, {"name": "S. Kováčik"}, {"name": "K. Magdolenová"}, {"name": "A. Manta"}, {"name": "K. Nedeľková"}, {"name": "P. Rusnák"}, {"name": "H. C. Steinacker"}, {"name": "J. Tekel"}], "featured_authors": [{"name": "M. Hrmo"}, {"name": "S. Kováčik"}, {"name": "K. Magdolenová"}, {"name": "P. Rusnák"}, {"name": "H. C. Steinacker"}, {"name": "J. Tekel"}], "author_count": 8}, {"id": "2609.00353", "category": "hep-th", "title": "Topologically induced deformations of differential forms", "abstract": "Motivated by deformations of spin structures and their geometric implications, we study a deformed exterior derivative, which is a third-order nilpotent operator. This higher-order differential structure induces an anholonomic rescaling of the local frame and leads to a bifurcation of the associated cohomological structure, with two distinct notions of closedness and exactness. We prove that the Poincaré Lemma fails in both sectors, so that closed deformed forms need not be exact even locally. We then apply the resulting framework to a four-dimensional effective field theory and show that a constant saturation of the deformation parameter can generate a hierarchy between the electroweak and fundamental Planck scales through a purely geometric mechanism, without introducing extra spatial dimensions.", "url": "https://arxiv.org/abs/2609.00353", "type": "理论", "summary": "1. 该论文以自旋结构形变及其几何后果为动机，提出并研究一种满足三次幂零条件的变形外微分算子，并考察其引起的局域标架非完整重标与上同调结构变化。\n2. 其关键结果在于证明该高阶微分结构使闭性与恰当性这对概念在两个扇区中分叉，且庞加莱引理在这两个扇区均不成立，因此闭的形变形式即使局域地也未必恰当。\n3. 将该框架应用于四维有效场论后，该文展示了当变形参数达到常数饱和时，仅靠这种纯几何机制即可产生电弱标度与基本普朗克标度之间的能标等级，无需任何额外空间维度。", "summary_source": "deepseek", "authors": [{"name": "J. M. Hoff da Silva"}, {"name": "J. M. B. Matzenbacher"}, {"name": "R. da Rocha"}], "featured_authors": [{"name": "J. M. Hoff da Silva"}, {"name": "J. M. B. Matzenbacher"}, {"name": "R. da Rocha"}], "author_count": 3}, {"id": "2609.00558", "category": "hep-th", "title": "Iso-$μ/T$ holographic entropy and its attractor for a strongly coupled quantum fluid", "abstract": "Numerical evidence has shown that a period of vanishing entropy production during far-from-equilibrium stages induces subsequent violations of the dominant energy condition in strongly coupled plasmas. This behavior also appears to hold for a Bjorken-expanding, hot and dense strongly coupled quantum fluid. In this context, it has been established that the chemical potential-to-temperature ratio ($\\mu/T$) in the medium increases with higher initial charge density, $\\rho_0$, and/or lower initial energy density, $\\varepsilon_0$. Here, we present a numerical method to evolve Bjorken R-charged plasmas by varying $(\\varepsilon_0,\\rho_0)$ in order to generate a curve that preserves a constant $\\mu/T$. This allows us to address the case in which all Bekenstein-Hawking entropy densities evolve towards configurations with the same $\\mu/T$. This approach enables a more direct comparison with the $\\mathcal{N}=4$ SYM plasma case ($\\mu/T=0$) and, consequently, provides clearer evidence of the correlation between entropy production and violations of the dominant energy condition. Moreover, this procedure offers a characterization (albeit numerical and partial) of the iso$-\\mu/T$ entropy density hydrodynamic attractor for hot and dense strongly coupled quantum fluids.", "url": "https://arxiv.org/abs/2609.00558", "type": "理论", "summary": "1. 该工作提出一种数值方法，通过改变初始能量密度与电荷密度演化Bjorken R荷等离子体，生成保持化学势温度比μ/T恒定的轨迹。\n2. 其关键在于追踪不同初始条件下所有Bekenstein-Hawking熵密度趋向同一μ/T的过程，从而与μ/T=0的N=4 SYM等离子体直接对照，更清晰地展示熵产生与主能量条件破坏的关联。\n3. 这为强耦合热密量子流体给出了iso-μ/T熵密度流体动力学吸引子的数值表征，有助于理解重离子碰撞中的远离平衡动力学及全息对应。", "summary_source": "deepseek", "authors": [{"name": "W. Barreto"}], "featured_authors": [{"name": "W. Barreto"}], "author_count": 1}, {"id": "2609.00797", "category": "hep-th", "title": "Carroll Limit of $\\mathcal{O}(F^2)$ $\\text{D}_p$-branes from Kaluza--Klein-like Null reduction in the Polyakov Formulation", "abstract": "We construct the electric and magnetic Carroll limits of the $\\mathcal{O}(F^2)$-truncated $\\text{D}_p$-brane via the Polyakov--KK route, which combines a single-mode Kaluza--Klein-like reduction at fixed light-cone momentum with a Dirac classification that keeps the auxiliary worldvolume frame. Unlike the $U(1)$-free ILST string, for $p\\geq2$ the Carrollian D$_{p}$-brane cannot be treated as a consistent fixed-frame constrained system after the Dirac classification. In the electric family the obstruction is directly produced by the worldvolume $U(1)$ matter sector, while in the magnetic family the frame retention is forced by the scalar kinetic's density-weight structure rather than by the $U(1)$ currents. The frame must therefore be retained through the classification and eliminated afterwards by Dirac brackets. Freezing it beforehand is not a legitimate step in the Dirac procedure. The embedding scalar sector inherits the Carroll--Weyl $\\chi$ structure at the level of the ILST kinetic density, which is $\\chi$-invariant, whereas the full scalar action is only $\\chi$-covariant. The local extension of $\\chi$ to the full matter sector is obstructed by the $U(1)$ sector through the Gauss, circle and $A_-$-gradient brackets. The electric family keeps the global rescaling as a weak symmetry, while the magnetic family fails even for a global parameter. For $P_{-}\\neq0$ the electric and magnetic families have $d-2$ and $d-3$ degrees of freedom, and the restored local circle at $P_{-}=0$ removes one further degree of freedom in each family. These features identify the resulting theories as constrained systems distinct from both the null string and the parent $\\mathcal{O}(F^2)$ DBI theory, and we also discuss their on-shell interpretation and relation to tensionless/null strings.", "url": "https://arxiv.org/abs/2609.00797", "type": "理论", "summary": "1. 该工作经由Polyakov形式的单模Kaluza–Klein类光锥约化与保留辅助世界体积框架的Dirac分类，构造了O(F^2)截断Dp膜的电型和磁型Carroll极限。\n2. 核心发现是对于p≥2，该Carroll膜不能作为先冻结框架的一致约束系统：电型族障碍来自世界体积U(1)物质扇区，磁型族则由标量动能密度权重导致，框架须保留到Dirac分类后再以Dirac括号消去，且嵌入标量继承了Carroll–Weyl的χ结构。\n3. 该系统在P_-≠0时分别含d−2与d−3个自由度，P_-=0移除一个自由度，使之区别于零弦与母O(F^2) DBI理论，为张力趋于零的约束动力学及类光约化研究提供明确参照。", "summary_source": "deepseek", "authors": [{"name": "Limin Zeng"}], "featured_authors": [{"name": "Limin Zeng"}], "author_count": 1}, {"id": "2609.00942", "category": "hep-th", "title": "Fuchsian Resonance and a Horizon-to-Boundary Dictionary for Pole-Skipping", "abstract": "Pole-skipping occurs at special complex frequencies and momenta where the retarded Green function of a black-hole or black-brane background is not uniquely defined. The local near-horizon mechanism is well known: at resonance, a Frobenius recurrence matrix loses rank and the space of smooth horizon solutions enlarges. We address the global question of how two boundary-normalized solutions enter this resonant horizon solution space. For a general second-order scalar radial equation on a nonextremal background analytic near the horizon, the Frobenius recurrence at the resonant order yields a solvability condition. We prove that its vanishing is equivalent to singularity of the horizon recurrence matrix, absence of the logarithmic Frobenius term, and existence of two independent smooth horizon solutions. Away from resonance, the source zero is equivalent to horizon smoothness of the response-normalized solution, while the response zero is equivalent to horizon smoothness of the source-normalized solution. We then analyze the parameter-dependent simple pole of the nonresonant ingoing solution as resonance is approached. After removing this singularity, its resonant limit is proportional to the larger-root Frobenius solution, with proportionality factor given by the same solvability function. Continuing to the boundary shows that the same condition is equivalent to simultaneous vanishing of the two regularized boundary connection coefficients. This establishes a horizon-to-boundary dictionary between local Fuchsian resonance and the boundary source-response 0/0 structure of pole-skipping. Finally, different directions of approach can select different resonant solutions, with the selection governed by the first parameter variation of the same solvability function.", "url": "https://arxiv.org/abs/2609.00942", "type": "理论", "summary": "1. 该工作针对非极值黑洞背景上的二阶标量径向方程，建立了局域Fuchsian共振与边界极点跳跃0/0结构之间的“水平-边界”词典。\n2. 其核心是证明共振阶可解条件的零点同时等价于水平递推矩阵奇异、对数项缺失、两个独立光滑水平解存在，并使去除极点后的非共振入射解趋于更大根Frobenius解。\n3. 这为一般背景下极点跳跃的存在给出全局判定，并揭示趋近共振的不同方向可经可解函数的一阶变分选择不同的共振解。", "summary_source": "deepseek", "authors": [{"name": "Yoon-Seok Choun"}], "featured_authors": [{"name": "Yoon-Seok Choun"}], "author_count": 1}, {"id": "2609.01039", "category": "hep-th", "title": "Logarithmic corrections to the entropy for near-extremal rotating black holes", "abstract": "An interesting feature of quantum corrections to the Bekenstein--Hawking entropy is the appearance of logarithmic area terms, whose coefficients are governed by the spectrum of massless fields. For near-extremal black holes, the entropy also receives a logarithmic temperature corrections, whose coefficient is determined by the zero modes of the corresponding extremal black holes. In this paper, we study near-extremal rotating black holes in three, four, and five dimensions with an important focus on rotational zero modes. For three-dimensional BTZ black holes, our results are in agreement with the microscopic description. Furthermore, by treating the cosmological constant scale \\(\\ell\\) as an independent parameter, we find an additional \\(\\log \\ell\\) correction to the entropy at extremality. For the five-dimensional BMPV black hole, we explicitly construct all the extremal zero modes and use them to evaluate the log temperature corrections to the entropy.", "url": "https://arxiv.org/abs/2609.01039", "type": "理论", "summary": "1. 该工作推导了三维、四维和五维近极端转动黑洞熵的对数温度修正，并重点分析转动零模的贡献。\n2. 其技术要点是显式构造出五维BMPV黑洞的全部极端零模以确定温度对数项系数，同时发现将宇宙学尺度ℓ视为独立参数会产生额外的log ℓ极端熵修正，且三维BTZ结果与微观描述一致。\n3. 这为零模控制近极端热力学对数修正的普适图像提供了具体证据，并可为高维转动黑洞的微观与全息描述提供可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Nabamita Banerjee"}, {"name": "Koustubh Guha"}, {"name": "Muktajyoti Saha"}], "featured_authors": [{"name": "Nabamita Banerjee"}, {"name": "Koustubh Guha"}, {"name": "Muktajyoti Saha"}], "author_count": 3}, {"id": "2609.01097", "category": "hep-th", "title": "Galilean Kalb-Ramond Field", "abstract": "In this paper, we build the Galilean limit of the free Kalb-Ramond two-form and also study the symmetries. Two different methods are discussed. The first is an Inönü-Wigner contraction. In this method, we take the scaling of space-time coordinates and the two-form field. The relativistic equations boil down to two inequivalent limits, electric and magnetic. In both, the equations of motion come out to be invariant under the full infinite-dimensional Galilean conformal algebra precisely in D=6. The second method is the null-reduction. In this, we start from a theory in D+1 dimensions and end up with a theory in D dimensions. This method yields a local Galilean Lagrangian. Here, the action is invariant under the global generators (boosts, rotations, translations and scale transformations) but not under higher Witt modes of the Galilean conformal algebra. We also calculate the two-point functions in both constructions from the boost, scale and rotation Ward identities, and by exhibiting the truncation that maps the null-reduction correlators onto those of the magnetic limit.", "url": "https://arxiv.org/abs/2609.01097", "type": "理论", "summary": "1. 该工作构造了自由Kalb-Ramond二形式场的伽利略极限，并用I-W收缩与零约化两种途径研究其对称性质。\n2. 核心结果是：I-W收缩给出电、磁两类不等价极限，场方程恰在D=6时满足完整无穷维伽利略共形代数；零约化则得到局域伽利略拉氏量，但仅保留整体生成元对称性。\n3. 两种构造的两点函数均由Ward恒等式导出，并存在把零约化关联函数映射到磁极限的截断，为非相对论高阶张量场论提供了可借鉴的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Aditya Mehra"}], "featured_authors": [{"name": "Aditya Mehra"}], "author_count": 1}, {"id": "2609.01332", "category": "hep-th", "title": "Perturbative Double-Scalar Hair on Planar Black Holes in AdS$_{4}$ Einstein-Scalar Gravity", "abstract": "We construct a two-scalar hairy planar black hole in four-dimensional Einstein gravity coupled to two scalars whose potential descends from the ABJM consistent truncation of eleven-dimensional supergravity. Starting from the known single-scalar hairy black brane, we switch on the second scalar $\\phim$ perturbatively in its amplitude $\\eps$ and solve the coupled Einstein-scalar system to order $\\eps^{2}$. The linearized $\\phim$ profile is an exact hypergeometric function, independent of the $\\pp$ hair, whose horizon-regular branch always carries a source, so there is no spontaneous $\\phim$ hair. Because the dual operator $\\mathcal{O}_{-}$ is irrelevant ($\\Delta=4$), the second-order response develops a logarithmically running condensate with a closed-form, scheme-independent slope $\\tfrac{\\sqrt{21}}{70}C_{s}^{2}$. The renormalized free energy is scheme dependent, but the geometric temperature shift $\\delta T/T_{0}\\approx-0.345\\,\\eps^{2}$ at fixed entropy is not. The full metric and $\\pp$ back-reaction is obtained in closed form, diagonalizing into two Pöschl-Teller problems with $\\delta\\pp=\\tfrac{6}{\\sqrt7}\\,\\delta H$. Three transport coefficients of the dual fluid remain exactly conformal to this order, while the sound speed, like the free energy, is scheme dependent.", "url": "https://arxiv.org/abs/2609.01332", "type": "理论", "summary": "1. 该工作基于ABJM一致截断的双标量势，在AdS4爱因斯坦-标量引力中从单标量毛黑膜构造出至ε²阶的双标量毛平面黑洞。\n2. 技术上，第二标量的线性解是带源的精确超几何函数，未产生自发毛；其无关对偶算符导致对数跑动凝聚，斜率与固定熵温度移动δT/T0=-0.345ε²等为方案无关闭式结果，完整反作用可化为两个Pöschl-Teller问题。\n3. 该结果可作为不相关标量微扰的全息范例：此阶三个输运系数仍共形，而声速与自由能依赖于重整化方案，提示应更多利用几何不变量描述毛黑膜。", "summary_source": "deepseek", "authors": [{"name": "Sangheon Yun"}], "featured_authors": [{"name": "Sangheon Yun"}], "author_count": 1}, {"id": "2609.01454", "category": "hep-th", "title": "Lagrangian varieties from $q$-matrix models", "abstract": "We consider three specific $q$-deformed matrix models (the Chern-Simons, $q$-Laguerre, and $q$-Gaussian matrix models) which can be solved explicitly using the property of superintegrability. We show that one- and two-point functions of inverse characteristic polynomials can be interpreted as quantizations of Lagrangian subvarieties in $(\\mathbb{C}^*)^2$ and $(\\mathbb{C}^*)^4$, respectively. While such a geometric picture is expected for the Chern-Simons matrix model, our results for the $q$-Laguerre and $q$-Gaussian models are new and exhibit additional features. In particular, specific anti-symplectic birational involutions play an essential role in the construction. This reformulation provides a geometric framework for analyzing the semiclassical, large-$N$ expansion of matrix-model correlators. This picture is suggestive of the geometry underlying open topological strings, although the two constructions are not identical and the precise relation between them remains to be understood.", "url": "https://arxiv.org/abs/2609.01454", "type": "理论", "summary": "1. 该工作选取 Chern-Simons、q-Laguerre 与 q-Gaussian 三种 q-形变矩阵模型，利用超可积性严格求解，并研究其逆特征多项式相关函数。\n2. 技术重点是证明这些函数可解释为 (C*)^2 与 (C*)^4 上拉格朗日子簇的量子化，尤其新结果中反辛双有理对合对后两种模型构造不可或缺。\n3. 该表述为矩阵模型相关函数的大 N 半经典展开提供拉格朗日几何框架，其与开拓扑弦构造的差异提示一条值得深入探讨的几何对应关系。", "summary_source": "deepseek", "authors": [{"name": "Victor Mishnyakov"}, {"name": "Maxim Zabzine"}], "featured_authors": [{"name": "Victor Mishnyakov"}, {"name": "Maxim Zabzine"}], "author_count": 2}, {"id": "2609.01517", "category": "hep-th", "title": "Non-symmetric triads and Baker-Akhiezer functions", "abstract": "The symmetric Macdonald polynomial at peculiar values of parameter $t=q^{-m}$, $m\\in\\mathbb{Z}_{\\ge 0}$ is naturally split into non-symmetric parts, which are the (quasi)polynomial Baker-Akhiezer (BA) functions. One may think this is due to symmetricity, and one just picks up this way non-symmetric parts already containing all the information. However, we demonstrate that, in the case of {\\bf non-symmetric} Macdonald polynomials, it still works, though each single BA function splits into $N!$ distinct (quasi)polynomial BA functions. The sum of these functions gives rise to the universal solution of the eigenstate problem for the Cherednik Hamiltonians. Extending to arbitrary values of $t$ is also immediate giving rise to counterparts of the Noumi-Shiraishi power series. Altogether, this power series and its reductions to non-symmetric Macdonald polynomials and to BA functions form a non-symmetric triad. There are $N!$ different branches of the non-symmetric triad, each branch being split into $N!$ distinct triads, and of these $(N!)^2$ triads $N!(N-1)!$ are independent. We describe in detail the simplest $N=2$ case.", "url": "https://arxiv.org/abs/2609.01517", "type": "理论", "summary": "1. 该工作研究非对称Macdonald多项式分裂为Baker-Akhiezer函数的过程，并构造了由Noumi-Shiraishi级数及其两类约化组成的非对称三元组。\n2. 其技术核心是发现每个单一BA函数仍会分裂为N!个不同的拟多项式BA函数，其和给出Cherednik哈密顿量的普适本征态解；三元组族共有(N!)^2个分支，其中N!(N-1)!个独立。\n3. 这为理解Macdonald理论中隐藏的分支结构提供了新视角，并对更一般参数与高秩情形下本征态问题的组合构造具有直接启发。", "summary_source": "deepseek", "authors": [{"name": "A. Mironov"}, {"name": "A. Morozov"}, {"name": "A. Popolitov"}], "featured_authors": [{"name": "A. Mironov"}, {"name": "A. Morozov"}, {"name": "A. Popolitov"}], "author_count": 3}, {"id": "2609.00020", "category": "math-ph", "title": "Chern--Simons Fluctuations and Information Geometry in Discrete Electromagnetism", "abstract": "We construct helicity-conditioned statistical states for a Whitney-discretized electromagnetic field on a closed oriented three-manifold. The simplicial de Rham complex provides exact discrete gauge symmetry, while the Whitney inner product separates exact, harmonic, and coexact sectors. The spatial Abelian Chern--Simons functional is gauge invariant and depends only on the coexact potential. After fixing harmonic modes, we introduce a helicity-biased Gaussian ensemble on the reduced electromagnetic phase space and derive explicit formulas for its admissible parameters, partition function, mean helicity, relative entropy, and Fisher information. The distribution uniquely minimizes relative entropy under a prescribed mean-helicity constraint. Its helicity susceptibility equals the variance of the discrete Chern--Simons functional and controls the local distinguishability of neighboring statistical states. Because magnetic helicity is generally not conserved under unconstrained Maxwell dynamics, these states represent conditioned inference rather than dynamical equilibrium.", "url": "https://arxiv.org/abs/2609.00020", "type": "理论", "summary": "1. 该工作对闭定向三维流形上Whitney离散化的Maxwell场构造了螺旋度条件化统计态，并在固定调和模式后导出约化电磁相空间上高斯系综的显式配分函数、平均螺旋度、相对熵与Fisher信息。\n2. 核心在于利用单纯de Rham复形与Whitney内积严格分离恰当、调和与余恰当扇区，使空间Abel Chern-Simons泛函仅依赖余恰当势；该分布唯一极小化相对熵，且其螺旋度响应等于该泛函方差并控制相邻态的可区分性。\n3. 由于磁螺旋度在无约束Maxwell动力学中一般不守恒，这些态应理解为条件化推断而非动力学平衡，为离散规范场论的统计推断与信息几何研究提供了可推广框架。", "summary_source": "deepseek", "authors": [{"name": "Jean-Pierre Magnot"}], "featured_authors": [{"name": "Jean-Pierre Magnot"}], "author_count": 1}, {"id": "2609.00034", "category": "math-ph", "title": "Alternative-mean trace divergences: geometry, data processing, and barycenters", "abstract": "Let $f:(0,\\infty)\\to(0,\\infty)$ be a nontrivial normalized operator monotone function and set $s=f'(1)$. We introduce the alternative-mean trace functional $$ \\altPhi_f(A,B) :=\\Tr(A\\nabla_s B) -\\Tr\\!\\left( f(A^{-1}\\sharp B)\\,A\\,f(A^{-1}\\sharp B) \\right). $$ on the positive definite cone. We prove that $\\altPhi_f$ is a quantum divergence in the sense of Bhatia--Gaubert--Jain whose diagonal Hessian induces a positive multiple of the Bures--Wasserstein Riemannian metric. We also establish the sharp comparison $$ s(1-s)d_{\\rm BW}(A,B)^2 \\le \\altPhi_f(A,B) \\le (1-s+s^2)d_{\\rm BW}(A,B)^2. $$", "url": "https://arxiv.org/abs/2609.00034", "type": "理论", "summary": "1. 该工作在正定锥上基于非平凡规范化算子单调函数引入备选均值迹泛函 altPhi_f，并将其论证为 Bhatia–Gaubert–Jain 意义下的量子散度。\n2. 其技术核心是证明该泛函的对角 Hessian 给出 Bures–Wasserstein 黎曼度量的正倍数，并推导出与 BW 距离平方间的最优双侧比较不等式。\n3. 这为将该类备选均值散度用于量子信息几何中的数据加工不等式和重心问题的后续研究提供了统一框架。", "summary_source": "deepseek", "authors": [{"name": "Trung Dung Vuong"}, {"name": "Hiroki Shudo"}, {"name": "Hiroyuki Osaka"}], "featured_authors": [{"name": "Trung Dung Vuong"}, {"name": "Hiroki Shudo"}, {"name": "Hiroyuki Osaka"}], "author_count": 3}, {"id": "2609.00040", "category": "math-ph", "title": "Fock-Space Formulation of the Boltzmann Collision Operator for Maxwell Molecules", "abstract": "We develop a representation-independent symmetric-Fock formulation of the nonlinear Boltzmann collision operator for Maxwell molecules. Starting from the standard velocity-space operator, we give a short derivation of Bobylev's Fourier identity and isolate its characteristic structure: two linearly related Fourier arguments followed by multiplication. We then prove, independently of collision geometry and of any coordinate realization, a canonical lift--fusion intertwining theorem: one-particle linear maps lift to the two incoming Fock legs and symmetric-algebra multiplication fuses them into a single outgoing state. Bargmann coordinates make this intrinsic construction especially transparent, but do not define it; Bobylev's collision maps subsequently select the Maxwell vertex from the already graded lift--fusion class. The resulting bilinear map obeys the exact grading \\[ \\widehat{\\mathcal Q}(\\mathscr H_p,\\mathscr H_q)\\subseteq\\mathscr H_{p+q}, \\] which gives an intrinsic origin for the triangular structures of Maxwell kinetics. Its one-vacuum restriction yields the complete Wang Chang--Uhlenbeck spectrum, while moment adaptation makes the nonequilibrium hierarchy strictly triangular and every finite compatible Fock jet an exact autonomous factor with global exponential relaxation. For the inhomogeneous problem, we extend realization covariance to the nonlinear two-leg vertex and evaluate the moving-frame connection independently through Hermite-function and Fourier realizations. The two routes give the same abstract Fock propagation and the same first Chapman--Enskog source; its traceless level-$2$ and vector level-$3$ sectors are relaxed by the exact Maxwell rates, giving $\\Pr=2/3$. This provides an explicit computational demonstration that coordinate realizations may be chosen for economy without entering the structural Fock formulation.", "url": "https://arxiv.org/abs/2609.00040", "type": "理论", "summary": "1. 该工作针对麦克斯韦分子气体，在对称Fock空间上以表示无关方式重构非线性玻尔兹曼碰撞算子，并从速度空间算子出发导出Bobylev傅里叶恒等式。\n2. 其技术核心是证明提升-融合交织定理，将单粒子线性映射提升为双入Fock腿并由对称代数乘法融合为单出态，使碰撞映射满足精确分次关系，从而内禀解释麦克斯韦动力学的三角结构。\n3. 该结构给出Wang Chang-Uhlenbeck谱并令非平衡矩层次严格三角化，有限相容Fock射流呈全局指数弛豫，同时以普朗特数2/3展示坐标实现可只求计算经济而不进入结构Fock表述。", "summary_source": "deepseek", "authors": [{"name": "Ilya Karlin"}], "featured_authors": [{"name": "Ilya Karlin"}], "author_count": 1}, {"id": "2609.00255", "category": "math-ph", "title": "Szegő-type determinant asymptotics for generalized Hilbert matrices with edge eigenvalues", "abstract": "We compute the large-$N$ asymptotics of the determinant of the identity plus or minus a generalized Hilbert matrix. For $N \\in \\mathbb{N}$ and $\\delta \\in \\mathbb{R} \\setminus \\{-1, -2, \\ldots\\}$, let \\[ H_N^\\delta := \\left( \\frac{\\sin((1+\\delta)\\pi)}{\\pi(j+k+1+\\delta)} \\right)_{j,k=0}^{N-1} \\] be the generalized Hilbert matrix. For $\\delta$ not a half-integer, we prove the large-$N$ power-law asymptotics of the determinant \\[ \\log \\text{det}(I_N \\pm H_N^\\delta) = -\\frac{\\theta_\\delta^2 \\pm \\theta_\\delta}{2} \\log N + O(1) \\] where $\\theta_\\delta := \\delta$ if $\\delta < -1/2$, and $\\theta_\\delta := \\frac 1 \\pi \\arcsin(\\sin(\\delta\\pi))$ if $\\delta \\ge -1/2$ and $\\arcsin \\colon [-1,1] \\to [-\\frac{\\pi}{2}, \\frac{\\pi}{2}]$ denotes the principal branch of $\\arcsin$. For $\\delta \\geq -\\frac 12$ the asymptotics is known. The novelty of the present paper is the regime $\\delta < - \\frac 12$ and understanding the dichotomy in the decay exponent. This stems from the $\\pm 1$ edge eigenvalues of the limiting operator appearing for $\\delta < - \\frac 12$. Most notably, we obtain for $\\delta < -\\frac12$ \\[ \\log \\det\\bigl(I_N - (H_N^\\delta)^2\\bigr) = -\\delta^2 \\log N + O(1). \\] Such determinants arise in the study of Anderson's orthogonality catastrophe.", "url": "https://arxiv.org/abs/2609.00255", "type": "理论", "summary": "1. 该工作推导了广义希尔伯特矩阵的 I_N±H_N^δ 在维数趋于无穷时行列式对数的幂律渐近并给出 O(1) 余项。\n2. 其核心发现是 δ<−1/2 区域由极限算子边缘本征值 λ=±1 导致的指数二分，特别是证明了 log det(I_N−(H_N^δ)^2)=−δ² log N+O(1)。\n3. 该结果将此类 Szegő 型行列式渐近与 Anderson 正交灾难中的物理量联系起来，为相关严格分析提供了可行框架。", "summary_source": "deepseek", "authors": [{"name": "Martin Gebert"}, {"name": "Heinrich Küttler"}], "featured_authors": [{"name": "Martin Gebert"}, {"name": "Heinrich Küttler"}], "author_count": 2}, {"id": "2609.00315", "category": "math-ph", "title": "Robin Laplacians with point interactions on unbounded domains: discrete spectrum and coupling asymptotics", "abstract": "We investigate the discrete spectrum of finitely many point interactions for Neumann and Robin Laplacians on special unbounded and exterior $C^{1,1}$ domains in dimensions two and three. The operators are realized as self-adjoint extensions through an ordinary boundary triple whose gamma field and Weyl matrix are constructed from the Robin Green kernel. Eigenvalues below the background spectrum are characterized by the Weyl matrix, yielding an exact finite-dimensional counting formula. If the background operator is non-negative, this also gives the number of negative eigenvalues without assuming a finite zero-energy limit of the Weyl matrix. In the one-centre case we identify the critical coupling and prove that the unique eigenvalue branch is real analytic, strictly increasing, and strictly concave. For scalar multicentre couplings $\\Theta=\\alpha I_N$, sufficiently strong attraction produces exactly $N$ eigenvalues below the background spectrum, and all of them have universal leading asymptotics coinciding with the whole-space laws. If the bottom of the background spectrum is an isolated eigenvalue, the branch exists for every finite coupling and we determine its leading decoupling asymptotics as the coupling tends to $+\\infty$. Explicit exterior-sphere and exterior-disk models illustrate the critical couplings and their threshold behaviour.", "url": "https://arxiv.org/abs/2609.00315", "type": "理论", "summary": "1. 该论文研究二维与三维无界及外部 C^{1,1} 域上带有限点相互作用的 Neumann/Robin Laplacian，刻画离散谱并分析耦合渐近。\n2. 其技术核心是以 Robin Green 核构造边界三元组和 Weyl 矩阵，导出背景谱下特征值精确的有限维计数公式，并证明单中心分支解析、严格递增且凹，多中心强吸引渐近服从全空间普适律。\n3. 该结果对点相互作用在外域几何中的临界耦合与阈值行为提供了明确刻画，可作为后续谱理论及耦合极限问题的新起点。", "summary_source": "deepseek", "authors": [{"name": "Diego Noja"}, {"name": "Francesco Raso Stoia"}], "featured_authors": [{"name": "Diego Noja"}, {"name": "Francesco Raso Stoia"}], "author_count": 2}, {"id": "2609.00517", "category": "math-ph", "title": "Topological Recursion on Spectral Curves with Infinite Ramification Loci", "abstract": "Recently in the physics literature there have been a small, but growing, number of papers that have applied the Eynard-Orantin topological recursion procedure to spectral curves with ramification loci of infinite cardinality. However, there is a corresponding gap in the mathematics literature; indeed, it has not been checked rigorously whether the resulting infinite sums converge, or whether the resulting correlators have all the desired properties of the topological recursion. The present work aims to bridge this gap by defining topological recursion on a suitably broad class of spectral curves to cover the aforementioned physics applications and to rigorously prove that this definition has the properties one would intuitively expect. As a by-product, some interesting coincidences involving quantum curves are discovered, where two different spectral curves yield the same quantum curve, a situation that has, hitherto, not appeared in the literature.", "url": "https://arxiv.org/abs/2609.00517", "type": "理论", "summary": "1. 该工作针对带有无限基数分歧轨迹的一类合适谱曲线，推广并严格定义了Eynard-Orantin拓扑递归，证明由此生成的相关函数收敛且具备预期性质。\n2. 其核心是把物理文献中仅形式使用的无穷求和纳入严格数学框架，并作为副产品发现两条不同谱曲线可对应同一量子曲线这一前所未有的现象。\n3. 这为相关物理应用提供了可信的数学基础，也揭示量子曲线对应并不唯一，为探讨其几何来源与物理解释指明了新问题。", "summary_source": "deepseek", "authors": [{"name": "Quinten Weller"}], "featured_authors": [{"name": "Quinten Weller"}], "author_count": 1}, {"id": "2609.00750", "category": "math-ph", "title": "Two-photon quantum Rabi models - Spectral degeneracy and symmetries", "abstract": "The quantum Rabi model occupies a distinguished role in the study of quantum light and matter, describing the most fundamental interactions. Elucidation of its spectral properties, along with those of its generalizations, is necessary for quantum optics and applications in areas such as quantum information technologies. In this paper, we explore a precise description of energy degeneracy of the two-photon asymmetric quantum Rabi model and the nature of the system's symmetries; as a result, we demonstrate that these have significant relationships with the structure of certain algebraic curves (hyperelliptic curves) and number theory. Concretely, we first prove the existence of degenerate eigenvalues using the monodromy data of the Fuchsian ODE, which draws the eigenvalue problem of the system, and the existence of associated symmetry operators, previously discovered and studied heuristically in physics. Subsequently, we give a complete characterization of spectral degeneracies and present a series of conjectures showing that the degeneracy may determine the entire energy spectral structure. More precisely, for sufficiently strong interaction, we obtain an excellent approximation of the energy curves by the zero locus of a two-variable polynomial associated to degenerate eigenstates. In addition, we postulate an explicit description of the relation between the missing symmetry at the Hamiltonian level (hidden symmetry) and the degeneracy of the two-photon quantum Rabi model.", "url": "https://arxiv.org/abs/2609.00750", "type": "理论", "summary": "1. 该工作精确研究了双光子非对称量子拉比模型能谱简并的结构，并揭示其与超椭圆曲线和数论的深层关联。\n2. 其技术要点在于用 Fuchs 型常微分方程的单值性数据证明简并本征值及相关对称算子的存在，并在强耦合区以退化本征态联系的双变量多项式零点逼近能谱曲线。\n3. 文中提出的简并决定整个能谱结构的猜想及隐对称性与简并关系的显式表述，为后续严格证明和相关量子信息技术应用提供明确方向。", "summary_source": "deepseek", "authors": [{"name": "Cid Reyes-Bustos"}, {"name": "Masato Wakayama"}], "featured_authors": [{"name": "Cid Reyes-Bustos"}, {"name": "Masato Wakayama"}], "author_count": 2}, {"id": "2609.00793", "category": "math-ph", "title": "Blow-Up, Asymptotics, and Improbability of Collision Singularities in the n-Body Problem", "abstract": "We study finite-time singularities in $n$-body systems with pair potentials that are homogeneous of degree $-\\alpha$, where $0<\\alpha<2$, that are not necessarily attractive and with bounded time-dependent external forces. We develop a systematic method to analyse a colliding subsystem in the presence of simultaneous collision or non-collision singularities elsewhere in the system. We extend classical results of von Zeipel and Painlevé to such subsystems, establish bounds on their internal energy near total collision, and implement a McGehee blow-up that remains effective without conservation of energy. The blow-up yields the asymptotics of the cluster size, and in the case of attractive potentials, the convergence towards the set of central configurations and asymptotics of relative position, relative velocities, and internal angular momentum. As an application of the asymptotic results, we construct a simplified proof that the initial conditions leading to collision form a set of measure zero.", "url": "https://arxiv.org/abs/2609.00793", "type": "理论", "summary": "1. 该文在势能齐次度为负且可含非吸引相互作用及有界含时外力的n体系统中，系统分析同时存在碰撞与非碰撞奇点的碰撞子系统的有限时间奇点行为。\n2. 其核心是不依赖能量守恒的McGehee爆破，并推广von Zeipel与Painlevé定理至奇异子系统，从而获得团簇尺度、近全碰撞内能界，以及吸引情形下趋于中心构型并给出相对速度与角动量渐近行为。\n3. 由此可将碰撞初值集合测度为零的经典结论化为渐近分析的直接推论，也为更一般含时外力下的奇异动力学提供了可迁移的研究工具。", "summary_source": "deepseek", "authors": [{"name": "Nathan Duignan"}, {"name": "Manuel Quaschner"}], "featured_authors": [{"name": "Nathan Duignan"}, {"name": "Manuel Quaschner"}], "author_count": 2}, {"id": "2609.00876", "category": "math-ph", "title": "A general improbability result for non-collision singularities as subsystems with at most four particles", "abstract": "Non-collision singularities of the $n$-body problem are initial conditions for which no global solution exists and which, however, do not lead to a collision in the limit; i.e., the moment of inertia of the system diverges. The question of whether the set of initial conditions leading to non-collision singularities in the $n$-body problem is improbable is open and is the first on Barry Simon's list of fifteen problems in mathematical physics from the year 1984. So far, this question has only been answered positively in the case $n=4$. Using a final cluster decomposition into subsystems whose particles interact strongly with each other and exert only small forces on particles from different subsystems, we can prove the improbability of the set of all singular orbits with the following conditions: -There may be arbitrarily many subsystems undergoing total collision at their center of mass. - There may be subsystems exhibiting a non-collision singularity, i.e. the respective moment of inertia of the subsystem diverges. These subsystems consist of exactly four particles each and the asymptotic directions of these subsystems have to differ (which is only a mild condition). This result includes all known statements and indicates a way how the general problem could be solved.", "url": "https://arxiv.org/abs/2609.00876", "type": "理论", "summary": "1. 该论文证明，对允许任意多个子系统在质心处发生整体碰撞、每个非碰撞奇点子系统恰含四粒子且彼此渐近方向互异的n体轨道，相应奇点初值集合在测度意义下具有不可能性。\n2. 技术关键是利用末态团簇分解，将粒子按强相互作用分组并使不同子系统间作用力很小，从而将一般非碰撞奇点归约为至多四粒子子系统的分析。\n3. 该结论涵盖此前所有已知结果，并为解决巴里·西蒙1984年问题列表中关于n体非碰撞奇点初值是否罕见的开放问题指出了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Manuel Quaschner"}], "featured_authors": [{"name": "Manuel Quaschner"}], "author_count": 1}, {"id": "2609.01443", "category": "math-ph", "title": "$A_1$ - Coulomb branches over finite fields and Selberg Character sums", "abstract": "Motivated by mirror symmetry, we study exponential sums over the $\\mathbb{F}_q$-points of the $A_1$ Coulomb branch. We show that their fiberwise structure is governed by polynomial Gauss sums, providing a geometric realization of Selberg character sums studied by Evans. Using Evans's evaluation, we obtain explicit formulas for the Coulomb-branch exponential sums as products of classical Gauss sums.", "url": "https://arxiv.org/abs/2609.01443", "type": "理论", "summary": "1. 该工作受镜像对称启发，对有限域上 A1 型 Coulomb 分支的有理点指数和进行了研究，并刻画了其逐纤维的分解结构。\n2. 其核心结果证明这类指数和的纤维结构由多项式高斯和支配，由此将 Evans 研究的 Selberg 特征和实现为该 Coulomb 分支上的几何对象，并利用 Evans 的求值公式将原指数和化简为经典高斯和的乘积。\n3. 这种几何对象与数论特征和的对应为 Coulomb 分支提供了显式求和的新途径，也为继续利用镜像对称研究其他分支或特征和给出了可推广范例。", "summary_source": "deepseek", "authors": [{"name": "Junzhe Lyu"}, {"name": "Andrey Smirnov"}], "featured_authors": [{"name": "Junzhe Lyu"}, {"name": "Andrey Smirnov"}], "author_count": 2}, {"id": "2609.00056", "category": "quant-ph", "title": "Isospectral potentials with Dirac delta interaction: Constrained Spectra", "abstract": "We study quantum potentials containing Dirac delta function (DDF) within its supersymmetric (isospectral) construction via a discontinuous superpotential, instead of being simply an added part. This construction comprises of two independently solvable sectors joined at the singular point by matching conditions imposed by the corresponding self-adjoint extension. Needing careful regularization, these boundary conditions impose independent algebraic constraints on each of the eigenstates, that restrict and truncate the spectrum. The number of surviving bound states, which are required to be parity-even, is thus fixed by the available system parameters rather than by the usual quantization rule. The specific cases of the Harmonic oscillator and the Rosen-Morse potential isospectrally infused with the DDF demonstrate such highly restrictive spectra, while the similar combination of the DDF with a Calogero-type singularity turns out to be largely incompatible as the regularization breaks down. Therefore, localized singularities are capable of controlling and engineering the discrete spectrum of quantum systems, with possible use in myriads of physical systems with very localized interactions.", "url": "https://arxiv.org/abs/2609.00056", "type": "理论", "summary": "1. 本文研究通过间断超势实现的含狄拉克δ函数相互作用势的超对称等谱构造，而非将δ项简单附加于势中。\n2. 其要点是由自伴延展确定奇点处匹配条件，对各本征态施加独立代数约束，使能谱受限截断，存留束缚态为偶宇称且数目取决于系统参数而非通常量子化规则。\n3. 该机制在谐振子与Rosen-Morse势中显现高度限制谱，而Calogero型奇点因其正则化失效而几乎不相容，提示局域奇点可用于调控量子离散谱并服务于局域相互作用体系。", "summary_source": "deepseek", "authors": [{"name": "Kumar Abhinav"}, {"name": "Biswanath Rath"}, {"name": "Prasanta K. Panigrahi"}], "featured_authors": [{"name": "Kumar Abhinav"}, {"name": "Biswanath Rath"}, {"name": "Prasanta K. Panigrahi"}], "author_count": 3}, {"id": "2609.00168", "category": "quant-ph", "title": "Entangling capability of coherently controlled quantum processes", "abstract": "We analytically characterize entanglement generation by two paradigmatic coherently controlled quantum processes, the quantum switch and time-flip. Retaining rather than measuring or discarding the control, we treat the control and target as the bipartite system and assume pure product inputs, so that any output entanglement reflects the entangling capability of the process. For the switch of qubit unitaries, we derive exact expressions for entanglement, together with a geometric characterization and a coherence-entanglement conservation relation. We then extend our analysis to binary random unitary, Pauli, amplitude damping, and generalized amplitude damping channels. We prove that switch of channels commuting under composition cannot entangle a separable input. Yet maximal entanglement is possible even with dissipation, e.g., an entanglement-breaking damping channel switched with a bit-flip can transform a product input into a maximally entangled state. For two generalized amplitude damping channels, a common stationary state prevents entanglement, while different stationary populations can enable it. We present an analogous study for the time-flip of unitary and binary random unitary channels. Our findings provide a systematic analysis of how much entanglement can be generated by coherent control of channel order or input-output direction.", "url": "https://arxiv.org/abs/2609.00168", "type": "理论", "summary": "1. 该工作以控制端与目标端组成双粒子系统且输入为纯积态为前提，解析刻画了量子开关与时间翻转两类相干受控过程的纠缠生成能力。\n2. 技术卖点是导出qubit酉信道开关纠缠的精确表达式、几何表征及相干-纠缠守恒关系，并推广到随机酉、Pauli与耗散信道，证明复合可交换信道无法使可分输入纠缠化，而耗散信道与比特翻转的开关仍可产生最大纠缠。\n3. 这为理解相干控制信道序或输入输出方向所能实现的纠缠界限提供了系统框架，也启示了非幺正过程在纠缠资源制备中的应用前景。", "summary_source": "deepseek", "authors": [{"name": "Beyza Aslanbaş"}, {"name": "Bedirhan Alkan"}, {"name": "Göktuğ Karpat"}], "featured_authors": [{"name": "Beyza Aslanbaş"}, {"name": "Bedirhan Alkan"}, {"name": "Göktuğ Karpat"}], "author_count": 3}, {"id": "2609.00220", "category": "quant-ph", "title": "Quantum Secret Sharing with a Helper and Programmable Access Structures", "abstract": "Quantum secret sharing (QSS) is a process in which the state of a quantum system is partitioned into multiple shares, allowing only specific subsets of shareholders to reconstruct the state, while others gain no information about its identity. In this work, we propose a variant of QSS, called ``helper QSS,'' which designates a special shareholder whose participation with any other group of parties is sufficient for recovering the state. We present different families of helper codes that function for an arbitrary number of parties and system sizes. As an application, we introduce the idea of a programmable access structure in QSS, which allows for a third-party programmer to independently choose the access structure of the code even after the shares are delivered to all the shareholders. This choice is made blindly, meaning that the programmer has no information about the secret being encoded, and it is implemented using the nonlocal process of quantum steering.", "url": "https://arxiv.org/abs/2609.00220", "type": "理论", "summary": "1. 该论文提出“辅助者量子秘密共享”变体，指定一名特殊共享者与任意其他参与方组合即可恢复被编码的量子态。\n2. 其技术核心是构造适用于任意参与方数和系统尺寸的辅助者编码族，并借助量子导引的非局域过程实现共享分发后的可编程访问结构。\n3. 该工作为秘密共享协议引入第三方盲态授权能力，对分布式量子信息中的动态访问控制与安全协作模式具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Eric Chitambar"}, {"name": "Sarah Hagen"}, {"name": "David W. Kribs"}, {"name": "Mike I. Nelson"}, {"name": "Andrew Nemec"}], "featured_authors": [{"name": "Eric Chitambar"}, {"name": "Sarah Hagen"}, {"name": "David W. Kribs"}, {"name": "Mike I. Nelson"}, {"name": "Andrew Nemec"}], "author_count": 5}, {"id": "2609.00234", "category": "quant-ph", "title": "Codes for Quantum Secret Sharing with a Helper", "abstract": "Helper quantum secret sharing is a form of secret sharing defined by its unique access structure. One special fixed party, called the helper, can work together with any other party to fully decode the secret. A blind helper is one who can provide this assistance while not holding any local information about the encoded secret. In this work, we analyze the general structure of QSS helper codes and present new code constructions. We fully characterize the structure of blind helper stabilizer codes and show that for the encoding of a single qubit, recovery is always possible using one-way local operations and classical communication (LOCC) from the helper to the targeted party. Furthermore, we demonstrate how such codes also allow for the helper to target larger subsets of parties by one-way LOCC, enabling them to be authorized to recover the secret. Finally, when each party only holds a qubit, we identify the general form of all helper codes (including non-stabilizer codes) and find that LOCC recovery is only possible in special cases.", "url": "https://arxiv.org/abs/2609.00234", "type": "理论", "summary": "1. 该工作研究带辅助者的量子秘密共享码的一般结构，并给出新码构造。\n2. 它对盲辅助者稳定子码作出完整刻画，证明单比特编码可沿辅助者到目标方的单向LOCC恢复，并能扩展至更大授权子集。\n3. 当每方仅持一个量子比特时，一般辅助者码（含非稳定子码）仅在特殊情况下可LOCC恢复，这提示需放宽编码或操作限制。", "summary_source": "deepseek", "authors": [{"name": "Eric Chitambar"}, {"name": "Sarah Hagen"}, {"name": "David W. Kribs"}, {"name": "Zhao Ma"}, {"name": "Mike I. Nelson"}, {"name": "Andrew Nemec"}], "featured_authors": [{"name": "Eric Chitambar"}, {"name": "Sarah Hagen"}, {"name": "David W. Kribs"}, {"name": "Zhao Ma"}, {"name": "Mike I. Nelson"}, {"name": "Andrew Nemec"}], "author_count": 6}, {"id": "2609.00235", "category": "quant-ph", "title": "Optimization Landscape Geometry in VQE for Frustrated Quantum Spin Models", "abstract": "We benchmark eight classical optimizers for exact-statevector VQE calculations on a controlled hierarchy of frustrated spin models, ranging from a diagonal Ising glass to transverse-field Ising and anisotropic Heisenberg models. The benchmark includes local, stochastic-gradient, evolutionary, covariance-adaptation, and swarm-based optimization methods under matched function-evaluation budgets. To understand their performance beyond final energies, we characterize the underlying Hamiltonian--ansatz landscapes in terms of local minima, gradients, curvature, and ground-state reachability. We use simple variational circuits, from an $R_y$ product-state ansatz for the diagonal model to shallow $R_y$--CNOT hardware-efficient circuits for the noncommuting models, and study how increasing circuit depth changes their expressivity, reachability, and optimization geometry. We find that optimizer performance changes substantially across the model hierarchy and is closely connected to landscape structure, while the variational gap represents a separate source of error. These results show how classical optimization, variational expressivity, and landscape geometry jointly determine VQE performance for frustrated spin models.", "url": "https://arxiv.org/abs/2609.00235", "type": "理论+数值", "summary": "1. 该工作对从对角Ising玻璃到横场Ising与各向异性Heisenberg模型的受控阻挫自旋系综，用八种经典优化器系统进行了精确态矢量VQE基准测试。\n2. 其技术卖点在于匹配函数评估预算下比较局部、随机梯度、进化与群智能等优化器，并刻画哈密顿量-拟设景观的局域极小、梯度、曲率与基态可达性随电路深度的变化。\n3. 结果表明优化性能与景观几何密切相关，而变分间隙是独立误差来源，提示阻挫自旋VQE需从经典优化、拟设表达力与景观几何三者共同理解。", "summary_source": "deepseek", "authors": [{"name": "Vojtěch Novák"}, {"name": "Ivan Zelinka"}, {"name": "Swagatam Das"}, {"name": "Martin Beseda"}], "featured_authors": [{"name": "Vojtěch Novák"}, {"name": "Ivan Zelinka"}, {"name": "Swagatam Das"}, {"name": "Martin Beseda"}], "author_count": 4}, {"id": "2609.00321", "category": "quant-ph", "title": "Which Otto Engine Is the Fastest?", "abstract": "A general thermal machine is characterized by distinct time or energy scales: temperature, coupling to the heat baths, internal free dynamics and interactions, and external driving. We address the question: what parameters determine the speed of a given engine, and how can they be used to reliably compare different types of engine? Specifically, we consider four realizations of the Otto engine, each operating with the same Otto efficiency, and aim to characterize and compare their power outputs. The main insight of this paper is that, irrespective of their very different dynamical implementations, the power of each engine can be factorized into a common characteristic work and an implementation-specific characteristic time. The characteristic work depends only on the internal frequencies of the machine and the temperatures, whereas the characteristic time depends on the coupling strength to the baths and on the implementation-specific driving. This observation allows us to compare the power of different engines through their characteristic times and thereby reduce the relevant parameter space to parameters that capture the dynamical aspects of engine performance. Despite different dynamical implementations, this framework reveals simple common features. In all cases, the maximum operating speed is limited by a common timescale given by the sum of the characteristic thermalization times of the hot and cold baths. Moreover, the four engines fall into two distinct asymptotic classes: implementations in which driving and thermalization occur simultaneously exhibit quadratic scaling, whereas those in which work extraction and thermalization alternate exhibit linear scaling. These results expose general dynamical features that determine the operational speed of quantum Otto engines.", "url": "https://arxiv.org/abs/2609.00321", "type": "理论", "summary": "1. 该论文通过将四种具有相同奥托效率的奥托机实现纳入统一比较框架，考察决定其运行速度的共同参数。\n2. 其核心发现是功率可分解为公共特征功与实现相关的特征时间，且最大速率受热冷浴热化时间之和限制，并区分出驱动与热化同时进行的二次标度和交替进行的线性标度两类渐近行为。\n3. 这一框架为识别量子热机动态性能的关键时间尺度、进行跨实现功率排序以及优化快速奥托循环提供了可操作依据。", "summary_source": "deepseek", "authors": [{"name": "Idriss Hank Nkouatchoua Ngueya"}, {"name": "Marcin Łobejko"}], "featured_authors": [{"name": "Idriss Hank Nkouatchoua Ngueya"}, {"name": "Marcin Łobejko"}], "author_count": 2}, {"id": "2609.00348", "category": "quant-ph", "title": "Spatial correlations of photons interacting via transverse Rydberg blockade", "abstract": "We develop a theory of the trans
