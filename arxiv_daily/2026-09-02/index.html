  <title>arXiv 2026-09-02 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2609.00083", "category": "cond-mat", "title": "Fermi-Level Metal-d Character of Group-6 Bis-Hexahapto Bilayer Graphene", "abstract": "Superconductivity in graphite intercalation compounds requires occupancy of a carbon-derived interlayer band filled by charge from an electropositive intercalant. Bis-hexahapto (eta6-eta6) coordination binds transition metals covalently to two graphene sheets with little charge transfer -- the mechanism that defines this chemistry removes the donation on which intercalated-graphite superconductivity rests. We ask, for group-6 Cr, Mo and W in bilayer graphene, whether Fermi-level states retain the interstitial, carbon-p character of ionic references, with bulk CaC6 and same-cell C12Ca/C12Li controls. Electron-phonon coupling is not computed. At one metal per gallery (C12M), the ionic controls retain 68 and 45 per cent, respectively, of gallery spectral weight in atom-masked interstitial regions at EF; the group-6 systems retain 15, 22 and 23 per cent. The contrast is compositional: group-6 galleries carry more absolute interstitial weight than C12Li, but projected density of states within +/-0.15 eV of EF is carbon p dominated in the ionic references and metal d dominated (~73 per cent) in all three group-6 bilayers. Every system studied is metallic; they differ in what carries the Fermi surface. Geometrically, eta6-eta6 coordination requires AA stacking and reverses the intrinsic Bernal preference by 400-600 meV wherever metal is present. Ordered phases are metastable against bulk metal (+2.9-5.0 eV per atom) but bound against isolated atoms (-1.6-4.1 eV); instability ordering (Cr least, W most) matches Cr > Mo > W reactivity. C12Cr is metallic; tungsten alone carries 0.65 muB. Bis-hexahapto intercalation delivers strong interlayer bonding and a definite AA registry, but not the interlayer-band character associated with superconducting graphite intercalation compounds.", "url": "https://arxiv.org/abs/2609.00083", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算研究了第六族金属Cr、Mo、W在双层石墨烯中的双η6配位插层，考察费米能级态是否仍保留离子型插层参照中碳p型层间带的特征。\n2. 结果显示三种体系在EF±0.15 eV内投影态密度约73%为金属d成分，与CaC6及C12Ca/C12Li参照的碳p主导截然不同，且η6-η6配位将堆垛固定为AA并逆转Bernal偏好400–600 meV。\n3. 该成键模式虽能提供强层间键合并确立AA排列，却不具备石墨插层化合物超导所依赖的碳层间带占据，提示此类插层不适用于以层间带载流子为机制的碳基超导设计。", "summary_source": "deepseek", "authors": [{"name": "Mingguang Chen"}], "featured_authors": [{"name": "Mingguang Chen"}], "author_count": 1}, {"id": "2609.00124", "category": "cond-mat", "title": "Green-function Zeros Encode Competing Mott and Charge-ordering Scales", "abstract": "While correlated insulators are devoid of low-energy quasiparticle poles, their Green functions retain clean momentum structure through zeros. However, precisely what zeros imply is not clear. By studying the extended Hubbard model both analytically and numerically, we establish a new paradigm for strongly correlated matter: the dispersion of Green function zeros is determined by both microscopic spin-spin correlations and defect kinematics. In fact, we find that the dispersion changes discontinuously across the transition between the Mott and the checkerboard charge-density wave phases as is expected for a first-order transition. This physics is robust to the inclusion of further neighbor hopping which simply fine tunes the spin-correlation or charge-defect kinematics. We conclude that it is the {\\it dispersion} of the Green-function zeros that encode the physics of ordering resultant from the strong correlations.", "url": "https://arxiv.org/abs/2609.00124", "type": "理论+数值", "summary": "1. 该工作通过解析与数值手段研究扩展Hubbard模型，提出强关联绝缘体中格林函数零点的色散是编码Mott与电荷序竞争的新范式。\n2. 其主要卖点在于阐明零点色散由微观自旋关联和缺陷运动学共同决定，且系统在Mott相与棋盘电荷密度波相间发生一级相变时零点色散呈不连续跳变，并对近邻以外跳变的微扰保持稳健。\n3. 这一结果支持把零点色散视为无需准粒子极点即可刻画强关联量子相变的普适诊断量，为后续模型计算、量子模拟和光谱实验提供了可行的检验方向。", "summary_source": "deepseek", "authors": [{"name": "Peizhi Mai"}, {"name": "Philip W. Phillips"}], "featured_authors": [{"name": "Peizhi Mai"}, {"name": "Philip W. Phillips"}], "author_count": 2}, {"id": "2609.00139", "category": "cond-mat", "title": "Higher-Winding Fractionalization", "abstract": "Higher-winding skyrmion textures can generate emergent magnetic fields with multiple flux quanta per unit cell. This opens an intriguing route toward fractionalization, allowing fractionalized quantum anomalous Hall states to arise even at integer filling of the microscopic unit cell. We show that, in this setting, increasing lattice-scale inhomogeneity of the emergent magnetic field drives a Berezinskii--Kosterlitz--Thouless (BKT) transition between a fractionalized liquid and a crystalline dielectric state. This transition carries a topological signature: under flux insertion, the many-body polarization defines a quantized winding number that is nonzero in the fractionalized phase and vanishes in the dielectric crystal.", "url": "https://arxiv.org/abs/2609.00139", "type": "理论", "summary": "1. 该工作研究高绕数斯格明子晶格产生的每晶胞多磁通量子涌现磁场，并考察此类体系在微观晶胞整数填充下出现的分数化物态。\n2. 其核心在于发现增大涌现磁场的晶格尺度不均匀性会驱动分数化液体到介电晶体的BKT相变，且磁通插入下多体极化的量子化绕数在两相中分别非零与为零。\n3. 这为在整数填充霍尔系统中利用高阶拓扑纹理实现和调控分数化物态提供了明确的理论途径与可测量拓扑判据。", "summary_source": "deepseek", "authors": [{"name": "Kishore Iyer"}, {"name": "Christophe Mora"}, {"name": "Daniele Guerci"}], "featured_authors": [{"name": "Kishore Iyer"}, {"name": "Christophe Mora"}, {"name": "Daniele Guerci"}], "author_count": 3}, {"id": "2609.00141", "category": "cond-mat", "title": "Magnetic frustration and non-collinear textures in layered Gd magnets", "abstract": "Using scale-bridging simulations based on electronic structure theory and atomistic spin dynamics, we investigate the magnetic properties of skyrmionic GdRu$_2$Si$_2$ and GdRu$_2$Ge$_2$ layered rare-earth magnets and similar Gd-based compounds (GdAu$_2$Si$_2$, GdAu$_2$Ge$_2$, GdAg$_2$Si$_2$ and GdAg$_2$Ge$_2$). By studying the trends across this structural family, we confirm the importance of magnetic frustration and dipolar interactions for the stability of non-collinear and skyrmion phases. Furthermore, our calculations predict promising opportunities for chemical tuning of these magnets in terms of the balance between various exchange interactions and the character of the magnetic anisotropy. These changes lead to the formation of new types of skyrmions that are stable in a wide range of applied external magnetic field. In particular, we propose partial alkali-metal substitution of Gd in GdRu$_2$Si$_2$ leading to GdKRu$_4$Si$_4$, GdRbRu$_4$Si$_4$, GdCsRu$_4$Si$_4$ as well as GdYRu$_4$Si$_4$ compounds, and suggest that it is likely to result in an ordered layered structure, similarly to previously reported iron pnictides like CaKFe$_4$As$_4$.", "url": "https://arxiv.org/abs/2609.00141", "type": "理论+数值", "summary": "1. 该工作采用电子结构理论与原子自旋动力学模拟，考察了GdRu2Si2等层状Gd基磁体的磁性行为。\n2. 其要点是确认磁阻挫和偶极相互作用共同稳定非共线与斯格明子相，并揭示化学取代可调控交换平衡和磁各向异性。\n3. 该结果启发人们通过碱金属部分取代Gd获得有序层状结构，实现宽磁场范围内稳定的新型斯格明子材料。", "summary_source": "deepseek", "authors": [{"name": "Vladislav Borisov"}, {"name": "Rohit Pathak"}, {"name": "Sagar Sarkar"}, {"name": "Anna Delin"}, {"name": "Olle Eriksson"}], "featured_authors": [{"name": "Vladislav Borisov"}, {"name": "Rohit Pathak"}, {"name": "Sagar Sarkar"}, {"name": "Anna Delin"}, {"name": "Olle Eriksson"}], "author_count": 5}, {"id": "2609.00142", "category": "cond-mat", "title": "Subgap Bound States from Dynamical Impurities", "abstract": "We find that a single non-magnetic dynamical impurity (e.g., a low-frequency localized \"vibron\" mode) induces a subgap bound state in an s-wave superconductor. A closed-form solution for the bound state energy is found as a function of the vibron frequency in the elastic scattering limit, with the salient features of the bound state energies unaffected by inelastic scattering processes in the sub-THz regime. In addition to subgap features in the low-frequency local density of states, such impurities result in real space regions of reduced spectroscopic weight outside the gap peak.", "url": "https://arxiv.org/abs/2609.00142", "type": "理论", "summary": "1. 该工作研究单个非磁性动态杂质（如低频局域振动模）在s波超导体中诱导出亚隙束缚态的物理机制与关键特征。\n2. 其核心亮点是在弹性散射极限下得到束缚态能量随振动模频率变化的闭式解，并证明亚太赫兹能区的非弹性散射对该束缚态能量的主要特征几乎没有影响。\n3. 该结果同时预言了超导能隙峰外低能局域态密度和实空间谱权重减弱等可观测效应，为动态杂质诱导的超导亚隙谱学提供了理论判断依据。", "summary_source": "deepseek", "authors": [{"name": "Joshuah T. Heath"}], "featured_authors": [{"name": "Joshuah T. Heath"}], "author_count": 1}, {"id": "2609.00144", "category": "cond-mat", "title": "Bayesian Tracking of a Diffusing Target in Two and Three Dimensions", "abstract": "We study Bayesian tracking of a diffusing target monitored by a noisy distributed sensor array. Building on an earlier mapping to KPZ growth with a moving defect (or an equivalent directed polymer pinning problem) we determine the phase structure, beyond the previously-studied one-dimensional case, for both Bayes-optimal and suboptimal inference. In $d=2$, theoretical analysis and numerical simulations both give a depinning transition between a successful tracking phase and a failure phase. Weak-coupling RG shows that Bayes-optimal tracking is always successful in $d=2$, but failure can arise from overconfident (suboptimal) inference. In $d=3$, tracking can succeed, or can fail in two distinct ways: the posterior probability distribution may delocalize (no detection), or may become sharply localized, but at the wrong position (a false detection). The two possibilities correspond to Edwards-Wilkinson or Kardar-Parisi-Zhang statistics for the log-posterior. The three phases meet at a Nishimori-like multicritical point on a Bayes-optimal line in a two-parameter phase diagram. (Model misspecification alone can drive depinning into either unpinned phase: underconfidence gives diffuse failure, while overconfidence gives localized-but-wrong failure.) We analyze the transitions between the various phases numerically and with renormalization group arguments. We show that some of these have unusual critical behavior, which the conventional $\\epsilon$ expansion fails to describe. Recent rigorous results for directed polymers indicate an alternative scenario. Many of our results, including a scaling relation for exponents at pinning transitions and results for RG flows, are relevant to other phase transitions that involve surface growth or directed polymers in 2+1D or 3+1D.", "url": "https://arxiv.org/abs/2609.00144", "type": "理论+数值", "summary": "1. 该工作利用KPZ生长与定向聚合物钉扎的映射，研究二维和三维扩散目标的贝叶斯跟踪相图。\n2. 主要发现是：d=2中仅过置信亚优推断导致失效；d=3中两种失效对应log后验的EW或KPZ统计，三相遇于Nishimori类多临界点。\n3. 这些相变具非常规临界行为，常规ε展开失效，结论可推广至2+1D或3+1D的表面生长与定向聚合物系统。", "summary_source": "deepseek", "authors": [{"name": "Ewan McCulloch"}, {"name": "Adam Nahum"}], "featured_authors": [{"name": "Ewan McCulloch"}, {"name": "Adam Nahum"}], "author_count": 2}, {"id": "2609.00145", "category": "cond-mat", "title": "Size-Dependent Growth Rates Amplify Infinitesimal Asymmetry in Nanocrystals", "abstract": "The kinetic Wulff construction predicts symmetric nonequilibrium shapes when crystallographically equivalent facets share a fixed growth rate. However, nanocrystals grow through finite facets whose nucleation barriers and ligand coverages depend on facet size. Here we develop a size-dependent kinetic construction and show that as a consequence infinitesimal seed asymmetries can be amplified into strongly asymmetric nanocrystal morphologies even when all symmetry-related facets obey the same microscopic growth law. Spatially heterogeneous nucleation rates and boundary limited growth generate facet growth velocities that depend on size, and deterministic shape evolution translates these local rates into global shape symmetry breaking. We illustrate the mechanism of persistent anisotropic growth on square and triangular lattices in two dimensions and on FCC seeds in three dimensions, where cuboctahedra can evolve toward rods or tetrahedra depending on which facet-area perturbations are amplified.", "url": "https://arxiv.org/abs/2609.00145", "type": "理论", "summary": "1. 该工作提出随尺寸变化的动力学Wulff构型，研究纳米晶体等晶面即使遵循同一微观生长律也可放大无穷小种子不对称性。\n2. 其核心在于空间非均匀成核与边界受限生长使晶面速度依赖面积，确定性形貌演化将局部速率转为整体对称性破缺，并在二维与FCC种子上演示立方八面体向棒状或四面体演变。\n3. 这为理解并利用微小扰动驱动纳米晶各向异性生长提供了可检验的动力学机制与形貌调控启示。", "summary_source": "deepseek", "authors": [{"name": "Sam Oaks-Leaf"}, {"name": "David T. Limmer"}], "featured_authors": [{"name": "Sam Oaks-Leaf"}, {"name": "David T. Limmer"}], "author_count": 2}, {"id": "2609.00159", "category": "cond-mat", "title": "Nonlinear Fluctuating Hydrodynamics from Interacting Noisy Quantum Matter", "abstract": "A universal characterization of non-equilibrium steady states in interacting quantum many-body systems remains one of the central challenges of statistical physics. Here, we address this problem for a paradigmatic model of diffusive interacting quantum matter---the boundary-driven XXZ spin chain with bulk dephasing---and derive, directly from its microscopic Lindblad dynamics, an emergent classical Macroscopic Fluctuation Theory (MFT) governing its large-scale fluctuations. Crucially, the resulting hydrodynamics carries a density-dependent diffusivity and mobility as the fingerprint of interactions. This effective description enables the exact computation of the stationary density profile, long-range correlations, and the full counting statistics of the current, in excellent agreement with tensor-network simulations. Our work demonstrates that noisy quantum many-body systems can realize the universality class of genuinely interacting diffusive matter, beyond the constant-diffusivity class of the symmetric simple exclusion process, and establishes MFT as a powerful universal framework for interacting diffusive quantum systems.", "url": "https://arxiv.org/abs/2609.00159", "type": "理论+数值", "summary": "1. 该工作以带体退相干的边界驱动XXZ自旋链为范例，从微观林德布拉德动力学直接导出控制其大尺度涨落的经典宏观涨落理论。\n2. 其核心在于所得非平衡流体力学含密度依赖的扩散系数与迁移率，从而把相互作用效应纳入普适类描述，超越对称简单排斥过程的常扩散率类。\n3. 这使稳态密度、长程关联与电流全计数统计可精确求得并与张量网络一致，也确立宏观涨落理论用于相互作用扩散量子系统的普适框架。", "summary_source": "deepseek", "authors": [{"name": "Alexios Christopoulos"}, {"name": "João Costa"}, {"name": "Stefano Scopa"}, {"name": "Jacopo De Nardis"}, {"name": "Zala Lenarčič"}, {"name": "Denis Bernard"}, {"name": "Tony Jin"}], "featured_authors": [{"name": "Alexios Christopoulos"}, {"name": "João Costa"}, {"name": "Stefano Scopa"}, {"name": "Zala Lenarčič"}, {"name": "Denis Bernard"}, {"name": "Tony Jin"}], "author_count": 7}, {"id": "2609.00162", "category": "cond-mat", "title": "Duality between the level statistics of Hermitian and non-Hermitian random matrices", "abstract": "Random matrix theory describes complex quantum systems statistically, with symmetry as its organizing principle. We uncover an exact duality between the level statistics of Hermitian and non-Hermitian random matrices in the large-$N$ (matrix size) limit. It acts class by class: the two replica partition functions, given by fermionic nonlinear $\\sigma$ models, are related by analytic continuation. Applied to the three Wigner--Dyson classes, the duality yields the universal bulk eigenvalue pair-correlation functions of non-Hermitian random matrices. This establishes a non-Hermitian counterpart of Dyson's threefold way, organized by transposition symmetry: generic complex, complex symmetric, and complex self-dual matrices. The dissipative spectral form factors of these classes follow in closed form as well. Applied to the seven nonstandard Altland--Zirnbauer classes, the duality yields the exact spectral densities near the origin, the non-Hermitian hard-edge statistics. Most of these statistics were previously known only numerically. Exact diagonalization confirms the analytical predictions, and physical models demonstrate their universality. We expect these results to be the tip of a deeper correspondence between Hermitian and non-Hermitian random matrix theory.", "url": "https://arxiv.org/abs/2609.00162", "type": "理论+数值", "summary": "1. 该工作发现大N极限下厄米与非厄米随机矩阵能级统计间存在逐类精确对偶。\n2. 其核心是利用费米型非线性σ模型的解析延拓，导出非厄米体关联与硬边谱密度等普适精确结果。\n3. 这为厄米—非厄米随机矩阵理论的深层对应提供了新起点，并可由精确对角化及物理模型验证。", "summary_source": "deepseek", "authors": [{"name": "Ze Chen"}, {"name": "Zhenyu Xiao"}, {"name": "Yifei Liu"}, {"name": "Shinsei Ryu"}], "featured_authors": [{"name": "Ze Chen"}, {"name": "Zhenyu Xiao"}, {"name": "Yifei Liu"}, {"name": "Shinsei Ryu"}], "author_count": 4}, {"id": "2609.00164", "category": "cond-mat", "title": "Exact joint eigenvalue densities of non-Hermitian random matrices are Calogero scattering states", "abstract": "Determining exact joint eigenvalue densities is central to random matrix theory. We solve this long-standing problem for non-Hermitian matrices with transposition symmetry (complex symmetric and complex self-dual) at arbitrary matrix size. Up to a Vandermonde factor, they are scattering-state wave functions of the Calogero model, a line of particles interacting through an inverse-square potential, with the coupling strength set by the symmetry. In contrast to many previously known joint densities, the densities cannot be written as a gas of eigenvalues with pairwise interactions. We further compute the complex level spacing distributions and two-point spectral correlation functions, which carry power-law tails, absent in a Coulomb gas. Our results shed light on the interplay among random matrices, integrability, and symmetry.", "url": "https://arxiv.org/abs/2609.00164", "type": "理论", "summary": "1. 该工作求解了具有转置对称性（复对称与复自对偶）的非厄米随机矩阵在任意阶数下的精确联合本征值密度。\n2. 其核心在于证明该密度除去Vandermonde因子后恰为Calogero模型的散射态波函数，而非成对相互作用的气体。\n3. 由此得到的复能级间距与两点关联呈幂律尾，为随机矩阵、可积性与对称性的交织提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Zhenyu Xiao"}, {"name": "Ze Chen"}, {"name": "Yifei Liu"}, {"name": "Shinsei Ryu"}], "featured_authors": [{"name": "Zhenyu Xiao"}, {"name": "Ze Chen"}, {"name": "Yifei Liu"}, {"name": "Shinsei Ryu"}], "author_count": 4}, {"id": "2609.00338", "category": "cond-mat", "title": "Impurity-dependent quantum geometry in 2D flat band superconductors", "abstract": "In flat band superconductors, quantum geometry, rather than kinetic energy, governs pairing and transport. However, how this geometry manifests in the response to a local, individually addressable impurity remains largely unexplored. Here, we study the Yu-Shiba-Rusinov (YSR) bound state induced by a magnetic adatom that hybridizes with every orbital of a two-dimensional flat band superconductor, and characterize its spatial profile using two quantities: the quadratic spread $Q_S$ and the localization length $\\xi$. We show that $Q_S$ is not set by the quantum metric alone, as geometric corrections arising from inter-orbital interference and, more importantly, from the anisotropy of the adatom-lattice hybridization contribute on equal footing, making $Q_S$ strongly impurity dependent and tunable. On the other hand, $\\xi$ emerges from the projection onto the flat band alone and is a universal property set by the overlap of compact localized states. All impurity dependence is instead isolated in the prefactor of the wavefunction whose magnitude correlates directly with $Q_S$. We, therefore, report a clean separation between universal and impurity-tunable physics from the induced YSR bound state in these systems, and confirm our results numerically via exact diagonalization.", "url": "https://arxiv.org/abs/2609.00338", "type": "理论+数值", "summary": "1. 该工作研究二维平带超导体中磁性杂质原子诱导的Yu-Shiba-Rusinov束缚态，并通过二次展宽Q_S与局域长度ξ刻画其空间分布。\n2. 其核心在于Q_S不仅由量子度规决定，还受轨道间干涉和吸附原子-晶格杂化各向异性的同等修正，因而强烈依赖且可调；而ξ仅由平带投影决定，是紧致局域态重叠给出的普适物理量。\n3. 该结果实现YSR响应中普适几何效应与杂质可调贡献的干净分离，为利用原子级杂质探针探测平带超导的量子几何提供了明确的理论判据。", "summary_source": "deepseek", "authors": [{"name": "Simão S. Cardoso"}, {"name": "A. Mesaros"}, {"name": "P. Simon"}], "featured_authors": [{"name": "Simão S. Cardoso"}, {"name": "A. Mesaros"}, {"name": "P. Simon"}], "author_count": 3}, {"id": "2609.00368", "category": "cond-mat", "title": "Chiral phonons driven by chiral cavities", "abstract": "Lattice vibrations carrying angular momentum give rise to fundamental phenomena such as the phonon Hall effect and the Einstein-de Haas effect, offering new opportunities for manipulating angular momentum in condensed-matter systems. Generating such circularly polarized phonons requires either the use of an external magnetic field, or of polarized light pulses. The latter approach does not require the use of any magnetic response of the material, but it has limitations, in particular regarding the duration of the pulse. Consequently, any effect stemming from phonons generated by light pulses is transient. In this paper, we propose the use of a driven electromagnetic cavity as a route to generate a steady-state population of chiral phonons. We derive a general description of cavity-chiral phonon interaction, with a particular focus on modes of chiral cavities. We show that, under optimized conditions, a significant effective phonon-induced magnetic field can be generated by means of an external drive with realistic power. Our approach is specially tailored for Gamma point phonons with THz frequencies, and opens a new route for investigating chiral phonons with electromagnetic cavities.", "url": "https://arxiv.org/abs/2609.00368", "type": "数值", "summary": "1. 该工作提出用受驱动的电磁腔替代偏振光脉冲，以稳态方式产生携带角动量的手性声子，并导出了腔场与手性声子耦合的一般理论框架。\n2. 其技术要点是聚焦手性腔模，给出腔-声子相互作用的一般表达式；在优化条件下，现实功率的驱动即可诱导出显著的有效声子感生磁场，且方案针对太赫兹伽马点声子。\n3. 该方案避免了光脉冲激励的瞬态性，无需材料磁响应即可持续产生手性声子，为探索声子手性与角动量输运、及声子磁效应的腔调控提供了新的理论途径。", "summary_source": "deepseek", "authors": [{"name": "V. A. S. V. Bittencourt"}, {"name": "N. Shabala"}, {"name": "R. M. Geilhufe"}, {"name": "A. Metelmann"}], "featured_authors": [{"name": "V. A. S. V. Bittencourt"}, {"name": "N. Shabala"}, {"name": "R. M. Geilhufe"}, {"name": "A. Metelmann"}], "author_count": 4}, {"id": "2609.00433", "category": "cond-mat", "title": "Bound states, resonances, and their thermodynamic properties in pseudospin-1 systems with short-range impurities", "abstract": "Bound states and resonances induced by short-range impurities modeled by circular potential wells are analyzed in the vicinity of flat and dispersive bands in gapped and gapless pseudospin-1 systems. We find that the bound and resonant states derived from the flat band show unusual characteristics originating from the multicomponent structure of pseudospin-1 fermions, which are distinct from those for pseudospin-$\\tfrac{1}{2}$ fermions. Contrary to gapped Dirac systems and unlike bound states in the vicinity of the upper dispersive band, the bound states derived from the flat band occur for any value of the total angular momentum. The energies of these bound states with higher angular momentum $j$ tend to decrease with $|j|$. In addition, it is found that their wave functions are localized at the potential well edge and the localization increases with $|j|$. The signatures of the impurity states in the local density of states are determined. Using the Anderson model for independent electrons in the disorder potential, the thermodynamic potential, entropy density, and heat capacity are obtained. In the regime dominated by bound states derived from the flat band, the entropy density monotonically increases with temperature and saturates, whereas the heat capacity exhibits a single maximum.", "url": "https://arxiv.org/abs/2609.00433", "type": "理论", "summary": "1. 该文针对有隙与无隙赝自旋-1系统中的短程圆势阱杂质，分析了平带与色散带附近的束缚态与共振态。\n2. 其核心发现在于平带诱导的束缚态可出现在任意总角动量下，且高角动量态能量更低、波函数更局域于势阱边缘，与赝自旋-1/2情形明显不同。\n3. 结合Anderson模型给出的热力学量表明，平带束缚态主导时熵密度随温度单调饱和而热容呈单峰，为杂质谱的探测与量子材料热力学辨识提供了依据。", "summary_source": "deepseek", "authors": [{"name": "E. V. Gorbar"}, {"name": "Pavlo Sukhachov"}], "featured_authors": [{"name": "E. V. Gorbar"}, {"name": "Pavlo Sukhachov"}], "author_count": 2}, {"id": "2609.00545", "category": "cond-mat", "title": "Parafermions in plain sight", "abstract": "We show that for any potential with a discrete energy spectrum, the well-known interpolation between ideal boson and fermion partition functions at discrete values of $\\xi=-1/m$ yielded zero temperature ground state energies corresponding to $m$ fermions occupying a single quantum state. The grand canonical partition function in this case can be a result from genuine parastatistics.", "url": "https://arxiv.org/abs/2609.00545", "type": "理论", "summary": "1. 该工作针对任意具有离散能量谱的势，指出理想玻色与费米配分函数在 ξ=-1/m 处插值得到的零温基态能量，可对应为 m 个费米子占据同一单粒子态。\n2. 其核心在于此插值在该离散参数处并非形式近似：相应巨正则配分函数可由真正的赝统计（parastatistics）导出，从而使常规统计结果中的“parafermion”结构显现出来。\n3. 这为在普通离散谱量子系统中识别非通常的占据规则提供了清晰的理论判据，也可能启发冷原子或人工量子平台上的后续验证。", "summary_source": "deepseek", "authors": [{"name": "Siu A. Chin"}, {"name": "A. Chaudhary"}], "featured_authors": [{"name": "Siu A. Chin"}, {"name": "A. Chaudhary"}], "author_count": 2}, {"id": "2609.00594", "category": "cond-mat", "title": "GW and Bethe-Salpeter Theory for Molecular Polaritons, Quasiparticles, and Excitons", "abstract": "The electron self-energy is central to quasiparticle theory, yet how an optical cavity enters it remains unclear. We address this question for a molecule in a single-mode cavity using the dipole-gauge Pauli-Fierz Hamiltonian and a coherent-state QED Hartree-Fock reference. The cavity enters through three channels: the static dipole self-energy (DSE) shift of reference orbital energies, direct DSE augmentation of the screened interaction, and the polariton pole carrying the bilinear electron-photon coupling. We benchmark QED-$GW$ ionization potentials (IPs) and electron affinities (EAs) against a cavity $\\Delta$-method ladder from QED-HF to correlated wave-function methods, whose cavity-induced shifts agree within 1 meV where directly comparable. For closed-shell molecules with unbound anions, $GW$ systematically overestimates cavity-induced IP redshifts, whereas EA shifts are reproduced nearly quantitatively, although this does not imply comparable accuracy for absolute EAs. For ionic molecules with bound anions, this ordering reverses, consistent with published QED coupled-cluster results. Coupling and detuning scans show that the error is predominantly quadratic in $\\lambda$ and DSE-driven rather than resonant. The spectral function develops a polariton-replica photoemission sideband with weight scaling as $\\lambda^2$. In the static screened interaction used in the Bethe-Salpeter equation, bare-photon exchange cancels the matching DSE contribution to the direct interaction, while exchange and polariton-screening corrections remain. Their net effect on the lowest excitation is appreciable only for ammonia in the molecules studied. Exciton-binding energies involving unbound anions are strongly basis-dependent and should therefore be viewed as diagnostics of electron-hole interactions rather than basis-converged molecular quantities.", "url": "https://arxiv.org/abs/2609.00594", "type": "理论+数值", "summary": "1. 该工作将GW与Bethe-Salpeter理论推广到单模腔中的分子极化子体系，基于相干态QED-HF参考处理偶极规范Pauli-Fierz哈密顿量。\n2. 其核心在于厘清腔通过静态偶极自能移动、屏蔽相互作用增强和极化子极点三条通道进入电子自能，并揭示腔致IP红移与EA移动的精度差异及其随耦合强度的近二次标度。\n3. 对含未束缚阴离子的体系，激子结合能具有强基组依赖性，应作为电子-空穴相互作用的诊断量，而非基组收敛的分子性质，为后续QED多体理论提供借鉴。", "summary_source": "deepseek", "authors": [{"name": "Soohaeng Yoo Willow"}, {"name": "Gi Beom Sim"}, {"name": "Tae Hyeon Park"}, {"name": "Tae In Kim"}, {"name": "D. ChangMo Yang"}, {"name": "Mikuláš Matoušek"}, {"name": "Jiří Brabec"}, {"name": "Libor Veis"}, {"name": "Chang Woo Myung"}], "featured_authors": [{"name": "Soohaeng Yoo Willow"}, {"name": "Gi Beom Sim"}, {"name": "Tae Hyeon Park"}, {"name": "Jiří Brabec"}, {"name": "Libor Veis"}, {"name": "Chang Woo Myung"}], "author_count": 9}, {"id": "2609.00631", "category": "cond-mat", "title": "Floquet scattering and Fano resonances in nodal-ring and multi-Weyl semimetals: Role of propagating and evanescent modes", "abstract": "We develop a comprehensive Floquet scattering theory for quantum transport in periodically driven nodal-ring semimetals (NRSs) and multi-Weyl semimetals (mWSMs), extending our earlier study reported in Annalen der Physik 535, 2200460 (2023), in which evanescent modes were neglected, to a complete formalism that includes both propagating and evanescent channels. By solving the full boundary-value problem, we obtain the complete set of scattering states and show that, although evanescent modes are indispensable for satisfying the matching conditions at the potential interfaces, they carry zero net probability current and do not contribute to any observable transport quantity. We identify a previously unexplored transport regime in NRSs in which two propagating channels coexist and participate in coherent scattering, producing multi-channel quantum interference and Floquet-induced Fano resonances. The transmission, reflection, pumped shot noise, and the associated Fano resonance features are determined entirely by the propagating channels, and the resonance energies coincide with those of the corresponding quasi-bound states of the static potential well. Our results establish a unified framework for Floquet transport in anisotropic topological semimetals, and confirm that the approximation of neglecting evanescent modes in our earlier work is justified for all measurable transport properties.", "url": "https://arxiv.org/abs/2609.00631", "type": "理论", "summary": "1. 该工作为节线环与多外尔半金属建立了包含传播模与倏逝模的完整Floquet散射理论。\n2. 其要点是求解全边值问题并证明倏逝模虽为匹配势界面所必需却不携带净概率流，同时揭示双传播通道共存区中多通道干涉与Floquet诱导Fano共振。\n3. 这为各向异性拓扑半金属的Floquet输运提供统一框架，并证实此前忽略倏逝模的近似对所有可观测输运性质成立。", "summary_source": "deepseek", "authors": [{"name": "Sandip Bera"}, {"name": "Ipsita Mandal"}], "featured_authors": [{"name": "Sandip Bera"}, {"name": "Ipsita Mandal"}], "author_count": 2}, {"id": "2609.00639", "category": "cond-mat", "title": "Strengthened second law for periodic processes", "abstract": "Many physical systems evolve under periodic driving: the same control protocol is applied again and again, even though the state of the system itself need not return to where it started after each cycle. We derive a physics-independent lower bound on the entropy production of \\emph{any} periodic process modeled by the evolution of an initial distribution $p_0$ by a repeated application of the same map $G$. This is a strict strengthening of the second law of thermodynamics for periodic processes. It does not require that the single-period dynamics arise from a CTMC, satisfy (local) detailed balance, or be subject to other typical restrictions. We discuss its application to spins in the Curie-Weiss model and Deterministic Finite Automata, with possible extensions to other uniform computers.", "url": "https://arxiv.org/abs/2609.00639", "type": "理论", "summary": "1. 作者研究周期性驱动系统在每周期施加相同控制映射G的情形，针对初始分布p0经G反复迭代所描述的任意周期过程，导出一个不依赖具体物理机制的熵产生下界。\n2. 该结果对周期过程的第二定律作出严格强化；其优势在于单周期动力学无需源自连续时间马尔可夫链，也无需满足细致平衡或局域细致平衡等常见限制。\n3. 文中将该下界应用于居里-外斯模型的自旋和确定型有限自动机，并指出此框架可能推广至其他均匀计算的物理实现，为热力学与信息处理交叉方向提供新约束。", "summary_source": "deepseek", "authors": [{"name": "Jake Schaefer"}, {"name": "Ben Ansbacher"}, {"name": "Jan Korbel"}, {"name": "David H. Wolpert"}], "featured_authors": [{"name": "Jake Schaefer"}, {"name": "Ben Ansbacher"}, {"name": "Jan Korbel"}, {"name": "David H. Wolpert"}], "author_count": 4}, {"id": "2609.00697", "category": "cond-mat", "title": "Correlation-Driven Nonlinear Magnetoelectric Response in an Altermagnet: A Dynamical Mean-Field Study", "abstract": "We investigate the optical nonlinear magnetoelectric effect (NMEE) in a strongly correlated altermagnet using dynamical mean-field theory. Unlike effective band descriptions with an imposed spin splitting, our approach determines the altermagnetic order, electronic spectrum, and optical nonlinear response self-consistently. We find that the NMEE is finite in the altermagnetic phase and vanishes in the paramagnetic phase. Its frequency dependence reflects the spin-resolved spectral structure and provides an estimate of the characteristic altermagnetic spin-splitting scale. Interaction and temperature tuning produce qualitatively different behavior: at low temperature, reducing the interaction strength toward the interaction-driven magnetic phase boundary enhances the response, whereas increasing the temperature suppresses it and drives it to zero above the critical temperature. These results establish the optical NMEE as a probe of correlated altermagnetic order and suggest that tuning parameters such as pressure, strain, or chemical substitution toward an interaction-driven phase boundary may provide a promising route to maximizing the response.", "url": "https://arxiv.org/abs/2609.00697", "type": "理论+数值", "summary": "1. 该工作采用动力学平均场理论，自洽地研究了强关联交错磁体中的关联驱动光学非线性磁电响应。\n2. 其要点是不预设自旋劈裂，而是同时确定磁序、谱函数与非线性光响应，发现该响应在交错磁相中有限、顺磁相消失，其频率结构可反映特征自旋劈裂尺度。\n3. 这确立了光学非线性磁电效应作为关联交错磁序的探针，并表明通过压力、应变或化学掺杂向关联驱动相边界调谐是增强该响应的可行途径。", "summary_source": "deepseek", "authors": [{"name": "Robert Peters"}, {"name": "Jun Ōiké"}], "featured_authors": [{"name": "Robert Peters"}, {"name": "Jun Ōiké"}], "author_count": 2}, {"id": "2609.00721", "category": "cond-mat", "title": "BKT-like Correlation Scaling and Twist Responses in a One-Dimensional Fractional $U(1)$ Ginzburg--Landau Model", "abstract": "We study a one-dimensional fractional $U(1)$ Ginzburg--Landau model whose quadratic part has Fourier multiplier $|k|^\\sigma$, focusing on the marginal case $\\sigma=1$. This dispersion yields logarithmic spin-wave fluctuations, suggesting BKT-like behavior despite the one-dimensional setting. We sample the equilibrium Gibbs measure using stochastic Gross--Pitaevskii dynamics and analyze correlation functions, dimensionless ratios, effective exponents, and twist responses. The correlation function shows a low-temperature algebraic branch with a temperature-dependent exponent, while the high-temperature regime exhibits a nonlocal-kernel-induced tail consistent with $C(r)\\sim r^{-2}$. The correlation and Binder ratios are nearly size independent at low temperature and collapse with the BKT-type variable $(T-T_{\\rm BKT})(\\log L)^2$; finite-size effects set in around $T\\simeq0.35\\text{--}0.4$, consistent with $T_{\\rm BKT}\\simeq0.35$. Unlike the two-dimensional XY model, twist responses do not yield a finite helicity modulus: the ordinary linear-response quantity grows with system size, whereas the cusp twist response scales as $L^{-\\eta(T)}$, like the squared zero-mode order parameter. Thus, the transition is BKT-like in correlation scaling, but lacks a universal helicity-modulus jump.", "url": "https://arxiv.org/abs/2609.00721", "type": "理论", "summary": "1. 该工作利用随机Gross-Pitaevskii动力学对一维分数化U(1)金兹堡-朗道模型σ=1边缘情形进行平衡Gibbs系综抽样，刻画其关联与扭转响应。\n2. 其核心结果是低温区存在指数随温度变化的代数关联，并随BKT变量(T-T_BKT)(ln L)^2发生标度塌缩，给出T_BKT≈0.35；同时扭转线性响应随体系增大而无有限螺旋模量，尖点扭转响应则按L^{-η(T)}衰减。\n3. 该结果为理解一维非局域临界现象提供了新视角，表明其关联标度呈BKT型，但缺少二维XY模型中普适螺旋模量跳变这一关键特征。", "summary_source": "deepseek", "authors": [{"name": "Hitomi Endo"}, {"name": "Michikazu Kobayashi"}], "featured_authors": [{"name": "Hitomi Endo"}, {"name": "Michikazu Kobayashi"}], "author_count": 2}, {"id": "2609.00780", "category": "cond-mat", "title": "Anti-higher-order topological insulators", "abstract": "Duality is a fundamental concept in physics that connects complementary opposites like particles and holes. Similarly, while topological states in topological insulators localize at boundaries, the existence and nature of their dual counterparts remain unexplored. Here, we introduce anti-topological states as the dual of topological states, exemplified by anti-higher-order topological insulators. Unlike higher-order topological insulators, where states localize at corners, anti-higher-order topological insulators host states along edges but absent at corners, realizing an inverted distribution of states. We demonstrate this phenomenon in a bilayer Chern insulator with opposite Chern numbers, where the band inversion surfaces enclose distinct high-symmetry points. The topological invariant distinguishing these phases is given by the topological charges enclosed by band inversion surfaces. This work establishes anti-topology as a new paradigm, opening a chapter in topological research.", "url": "https://arxiv.org/abs/2609.00780", "type": "理论", "summary": "1. 该工作提出“反拓扑态”概念并以反高阶拓扑绝缘体为例，在具有相反陈数的双层Chern绝缘体中实现边缘有态而角上无态的倒置分布。\n2. 其核心在于利用环绕不同高对称点的能带反转面所包围的拓扑荷作为拓扑不变量，以区分这类反高阶拓扑相。\n3. 这为拓扑与反拓扑的对偶关系及边界态分布研究确立了新范式，可启发在其他对称性或维度下的推广与实验验证。", "summary_source": "deepseek", "authors": [{"name": "Cheng-Ming Miao"}, {"name": "Yu-Hao Wan"}, {"name": "Ying-Tao Zhang"}, {"name": "Qing-Feng Sun"}], "featured_authors": [{"name": "Cheng-Ming Miao"}, {"name": "Yu-Hao Wan"}, {"name": "Ying-Tao Zhang"}, {"name": "Qing-Feng Sun"}], "author_count": 4}, {"id": "2609.00784", "category": "cond-mat", "title": "Anti-higher-order Weyl semimetal", "abstract": "Higher-order topology extends the bulk-boundary correspondence by enabling corner or hinge localized states. Here we identify an anti-higher-order Weyl semimetal, a three dimensional topological phase in which the conventional boundary hierarchy is reversed. Unlike conventional higher-order Weyl semimetals where bulk topology enforces hinge Fermi arcs, this phase hosts anti-hinge states, meaning the bulk topology forces states to vanish at specific hinge orientations. Using a minimal two-band model, we show how Weyl points separate the Brillouin zone into quantum anomalous Hall and anti-higher-order topological insulating regions, with the latter characterized by a band-inversion surface enclosing two distinct high-symmetry points carrying opposite topological charges. Analytical solutions for Weyl points, Berry curvature monopoles, and slice Chern numbers are derived, with numerical simulations confirming the resulting anti-hinge behavior. Our work establishes anti-higher-order topology as a dual counterpart to conventional higher-order phenomena, further extending the exploration of topological phases.", "url": "https://arxiv.org/abs/2609.00784", "type": "理论+数值", "summary": "1. 该工作从理论上识别出一类反高阶外尔半金属，其中体拓扑强制特定棱线上的态消失，使通常的体-边界对应层级发生反转。\n2. 其核心在于利用最小双带模型证明外尔点将布里渊区划分为量子反常霍尔区与反高阶拓扑绝缘区，并用带翻转面包围携带相反拓扑荷的两个高对称点，解析求得外尔点与贝里曲率磁单极。\n3. 这一发现确立了反高阶拓扑作为常规高阶拓扑对偶对应物的地位，为三维拓扑相的分类与材料实现提供了新方向。", "summary_source": "deepseek", "authors": [{"name": "Cheng-Ming Miao"}, {"name": "Yu-Hao Wan"}, {"name": "Qing-Feng Sun"}], "featured_authors": [{"name": "Cheng-Ming Miao"}, {"name": "Yu-Hao Wan"}, {"name": "Qing-Feng Sun"}], "author_count": 3}, {"id": "2609.00900", "category": "cond-mat", "title": "Fourier Neural Operators for Composition-Driven Crystal Structure Discovery", "abstract": "Crystalline materials discovery is essential for energy, electronics, and catalysis, but the vast chemical and structural space makes exhaustive screening infeasible. Existing voxel-based methods are limited by the local receptive fields of three-dimensional convolutional neural networks and the posterior collapse of high-dimensional variational autoencoders. Here, we develop a Fourier Neural Operator (FNO)-based crystal-field solver that maps a prescribed chemical formula and lattice parameters to periodic number-density and electron-density fields. By operating on global Fourier modes, the solver captures long-range correlations in periodic crystal fields beyond conventional local convolutions. Building on this solver, we construct a coupled generation-solving framework in which a conditional variational autoencoder generates diverse candidate lattice parameters in a low-dimensional basis-coefficient space, followed by density-field prediction and atomic reconstruction through peak detection, position optimization, and weight optimization. The reconstructed structures are further screened using voxel-level filtering, machine-learning interatomic-potential relaxation, and first-principle calculations. The framework generates novel structures across 104 chemical formulas with competitive reconstruction accuracy, demonstrating high generative diversity and structural validity. By extending Fourier neural operators to periodic crystal fields and coupling them with composition-conditioned lattice generation, our approach provides a scalable route to crystal structure discovery from prescribed chemical compositions.", "url": "https://arxiv.org/abs/2609.00900", "type": "数值", "summary": "1. 本文发展了一种基于傅里叶神经算子(FNO)的晶体场求解器，将给定化学式与晶格参数映射为周期性的数密度和电子密度场。\n2. 其核心优势是在全局傅里叶模态上捕捉周期晶体场中的长程关联，并以低维基系数空间中条件变分自编码器生成晶格参数，经密度预测、原子重构和多级筛选完成结构生成。\n3. 该方法在104种化学式上实现了较高重建精度、生成多样性与结构有效性，为从指定成分出发的晶体结构发现提供了可扩展的生成-求解-筛选路线。", "summary_source": "deepseek", "authors": [{"name": "Zhijie Yu"}, {"name": "Jingyu Li"}, {"name": "Yang Huang"}, {"name": "Jingrun Chen"}], "featured_authors": [{"name": "Zhijie Yu"}, {"name": "Jingyu Li"}, {"name": "Yang Huang"}, {"name": "Jingrun Chen"}], "author_count": 4}, {"id": "2609.00915", "category": "cond-mat", "title": "Element priors and target support shape chemical transfer in materials graph networks", "abstract": "Materials graph neural networks must often transfer to chemical regions weakly represented in training data. Such transfer can rely on predefined relations among elements or supervised evidence from target-containing structures, but these pathways are usually entangled. Here, held-out-element splits and incremental target support separate their roles. Without target-containing training structures, formation-energy errors depend strongly on the element representation, particularly for H, O and F. Matched perturbations show that representation-induced sharing matters beyond input dimension or numerical form, while a label-free similarity-graph prior reduces selected zero-shot errors. Adding a few target-containing structures sharply lowers errors and contracts differences among one-hot, k-hot and continuous inputs across ALIGNN and CGCNN. Calibration explains only part of this recovery, and freezing the initial element projection preserves most gains in five of six ALIGNN splits. Target support therefore shifts chemical transfer from reliance on static element relations toward learning from target-containing environments.", "url": "https://arxiv.org/abs/2609.00915", "type": "数值", "summary": "1. 该工作利用留出元素划分和增量式目标支撑，系统区分了材料图神经网络中元素先验与含目标训练结构对化学迁移的各自贡献。\n2. 在无目标结构时，形成能误差主要由元素表示决定（H、O、F尤甚），配对的表示扰动与无标签相似图先验表明，表征引发的要素共享效应可独立于输入维度和数值形式。\n3. 加入少量目标结构后误差大幅下降并使ALIGNN/CGCNN中one-hot、k-hot和连续输入间的差异收窄，而仅冻结初始元素投影即可保留大部分增益，提示目标支持的作用是将迁移重心从静态元素关系转向从目标环境中学习。", "summary_source": "deepseek", "authors": [{"name": "Ran Zhao"}, {"name": "Kangming Li"}], "featured_authors": [{"name": "Ran Zhao"}, {"name": "Kangming Li"}], "author_count": 2}, {"id": "2609.00931", "category": "cond-mat", "title": "Beyond Panchromatic Absorption: Deciphering the Excited-State Maze from Light Absorption to Photocatalysis in Dye-Sensitized MOFs", "abstract": "Metal--organic frameworks (MOFs) are promising photocatalysts whose visible-light absorption can be extended through linker functionalization; however, a red-shifted absorption edge does not guarantee enhanced efficiency. Here, we establish a multi-spectroscopic framework to decipher the photophysical fate of photoexcited states in diazo-sensitized UiO-66 using 2D photoluminescence (PL/PLE) mapping and wavelength-resolved continuous-wave X-band photo-EPR. By correlating visible absorption with photo-EPR and PLE action spectra, we distinguish a \\textit{productive red shift} from a \\textit{non-productive emissive red shift}. In highly active UiO-66-Anisole (97\\% activity relative to \\ch{TiO2}), photo-EPR tracks the new absorption band, confirming that excitation populates a charge-transfer pathway yielding persistent, spin-separated states. Conversely, poorly active UiO-66-$\\beta$-naphthol (4\\%) exhibits an extended visible absorption tracked by PLE but not photo-EPR. This reflects excitation trapping in a localized state caused by an \\textit{ortho}-$\\mathrm{OH}$ group forming a rigid intramolecular hydrogen bond, which locks the keto-hydrazone tautomer and disrupts the conjugated azo bridge. A new optical overlap descriptor ($S_{\\mathrm{Exc}}$) quantitatively captures this trade-off across the series. We demonstrate that photosensitizer design must suppress rigid tautomeric traps and target specific charge-transfer manifolds ($\\lambda \\le 500$~nm) rather than merely maximizing apparent panchromatic absorption breadth.", "url": "https://arxiv.org/abs/2609.00931", "type": "数值", "summary": "1. 该工作利用二维荧光/激发光谱与波长分辨光电子顺磁共振，建立多光谱框架，解析重氮敏化UiO-66中激发态从光吸收到光催化的完整命运。\n2. 其关键在于区分有效与无效红移：高效样品的光EPR信号追踪新吸收带，表明激发进入电荷转移通道并形成持久自旋分离态；而低效样品的激发因邻位羟基形成刚性分子内氢键、锁定酮腙互变异构并破坏偶氮桥而局域化，并提出S_Exc重叠描述符定量刻画该权衡。\n3. 这启示染料敏化剂设计应抑制刚性互变异构陷阱并靶向λ≤500 nm的特定电荷转移通道，而非单纯追求宽泛的全色吸收范围。", "summary_source": "deepseek", "authors": [{"name": "Manuela L. Kim"}, {"name": "Mauricio E. Calvo"}, {"name": "Katsuya Teshima"}, {"name": "Fabio La Mattina"}, {"name": "Eugenio H. Otal"}], "featured_authors": [{"name": "Manuela L. Kim"}, {"name": "Mauricio E. Calvo"}, {"name": "Katsuya Teshima"}, {"name": "Fabio La Mattina"}, {"name": "Eugenio H. Otal"}], "author_count": 5}, {"id": "2609.00953", "category": "cond-mat", "title": "Weisfeiler-Lehman subtree encoding for Bayesian optimization of atomic configurations", "abstract": "The efficiency of Bayesian optimization (BO) of atomic configurations depends strongly on how configurations are encoded. We introduce the Weisfeiler-Lehman (WL) subtree kernel, which views configurations as element-labeled graphs and measures their similarity by how many local structural patterns they share, into Bayesian-optimization-based configuration search. Because this kernel is reproduced as the plain inner product of explicit features (L$^2$-normalized histograms of local topological patterns), introducing it reduces to introducing the corresponding features: the encoding enters existing BO frameworks as an ordinary descriptor. In a benchmark ground-state configuration search of cubic BC$_2$N evaluated with a universal machine-learning interatomic potential, the WL encoding reached the ground state almost immediately after a shared random initialization of 100 samples in every one of five independent rounds (108$\\pm$5 evaluations on average), whereas the one-hot baseline required 280$\\pm$122 evaluations; the WL-driven sampler first exhausted the degenerate ground-state group and then discovered the metastable degenerate groups from the bottom up, in order of increasing energy.", "url": "https://arxiv.org/abs/2609.00953", "type": "理论+数值", "summary": "1. 该工作提出在原子构型的贝叶斯优化中使用Weisfeiler-Lehman子树核，将构型表示为元素标记图，以其共享局部结构模式的数量作为相似性度量。\n2. 主要技术特点是该核可写成L2归一化局部拓扑模式直方图的内积，因此能以普通描述符形式直接嵌入现有贝叶斯优化流程，无需改动框架。\n3. 在立方BC2N基态搜索基准中，WL描述在五个独立回合均于100个随机初始点后几乎立即找到基态（平均108±5次），而one-hot基线需280±122次，展示了替代手工编码、提高构型搜索效率的前景。", "summary_source": "deepseek", "authors": [{"name": "Akira Kusaba"}, {"name": "Tatoshi Yonemori"}, {"name": "Tetsuji Kuboyama"}, {"name": "Yoshihiro Kangawa"}], "featured_authors": [{"name": "Akira Kusaba"}, {"name": "Tatoshi Yonemori"}, {"name": "Tetsuji Kuboyama"}, {"name": "Yoshihiro Kangawa"}], "author_count": 4}, {"id": "2609.00971", "category": "cond-mat", "title": "Kibble--Zurek Mechanism and Defect Freezing in Imbalanced-Pairing Kitaev Models", "abstract": "We investigate driven dynamics across critical and exceptional points in the one- and two-dimensional imbalanced-pairing Kitaev models using both the wave-function normalization approach and the biorthogonal framework. For a positive pairing imbalance parameter, the quasiparticle spectrum remains real, and a pairing imbalance neither shifts the equilibrium phase boundaries nor generates imaginary eigenenergies. In this regime, the defect density follows the conventional Kibble--Zurek scaling in one dimension and the extended Kibble--Zurek scaling, arising from a gapless manifold, in two dimensions within both frameworks. The corresponding scaling exponents are therefore governed by those of the Hermitian transition. For a negative pairing imbalance parameter, time-reversal symmetry is broken, the quasiparticle spectrum develops complex eigenvalues, and the gap closes at exceptional points. For ramps ending at an exceptional point, the defect density follows the modified Kibble--Zurek scaling in the wave-function normalization approach, whereas it obeys the conventional Kibble--Zurek scaling in the biorthogonal framework. When the ramp traverses the time-reversal-symmetry-broken region, a finite density of defects remains even in the adiabatic limit, leading to defect freezing in both frameworks. Although this frozen background indicates a breakdown of adiabaticity, the excess defects generated on top of this background continue to obey the conventional Kibble--Zurek scaling in one dimension and the extended Kibble--Zurek scaling in two dimensions.", "url": "https://arxiv.org/abs/2609.00971", "type": "理论", "summary": "1. 该工作在一维与二维配对失配Kitaev模型中，用波函数归一化和双正交框架研究了扫描穿越临界点与例外点的Kibble–Zurek动力学。\n2. 它的核心在于区分两种失配情形：正失配保持实能谱、不移动平衡相边界并给出常规或扩展Kibble–Zurek标度；负失配经由例外点破坏时间反演对称，导致绝热极限下缺陷冻结和依赖框架的标度修正。\n3. 这意味着若以冻结缺陷为背景，生成于其上的额外缺陷仍按常规/扩展Kibble–Zurek幂律演化，为非厄米多体系统中绝热性和普适标度的框架选择提供启示。", "summary_source": "deepseek", "authors": [{"name": "R. Jafari"}, {"name": "Alireza Akbari"}, {"name": "Shukhrat Mardonov"}, {"name": "A. Langari"}], "featured_authors": [{"name": "R. Jafari"}, {"name": "Alireza Akbari"}, {"name": "Shukhrat Mardonov"}, {"name": "A. Langari"}], "author_count": 4}, {"id": "2609.00975", "category": "cond-mat", "title": "Topological charges and parity selection at Floquet quasienergy degeneracies", "abstract": "The quasienergy spectrum of a strongly driven two-level system as a function of the driving parameters exhibits conical intersections, which are enabled by hidden time-nonlocal symmetries. We show that each such crossing carries a quantized topological charge: the Floquet--Berry phase acquired along an adiabatic loop around a cone is equal to a $\\mathbb{Z}_2$-valued charge. We further identify a second family of degeneracies that occurs at vanishing driving amplitude, when the level splitting matches $m$ energy quanta of the field. Along the Stark-shifted resonance line, the minimum quasienergy gap opens as $|A|^m$, and the charge is nontrivial only for odd $m$. We analytically derive both results from a perturbative reduction to a spin-$1/2$ in an effective two-dimensional magnetic field and confirm them numerically through the Bargmann invariant. Moreover, we propose a chirality-based protocol that cancels the dynamical phase to isolate the geometric one, and an ancilla-based Ramsey readout that renders the topological charge directly observable.", "url": "https://arxiv.org/abs/2609.00975", "type": "理论+数值", "summary": "1. 该工作研究强驱动二能级系统的准能量简并，揭示由隐藏时间非局域对称性产生的锥形交叉及其拓扑荷性质。\n2. 其核心在于证明每类简并均携带Z2值Floquet-Berry拓扑荷，且驱动振幅趋零时沿共振线的能隙按|A|^m打开、仅奇数m电荷非平庸；解析上归结为自旋-1/2在有效二维磁场中的约化问题，并用Bargmann不变量数值验证。\n3. 文中提出的手征协议消除动力学相位及基于辅助比特的Ramsey读取方案，使该拓扑荷可直接观测，为实验探测Floquet拓扑性质提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Sigmund Kohler"}, {"name": "David Guéry-Odelin"}], "featured_authors": [{"name": "Sigmund Kohler"}, {"name": "David Guéry-Odelin"}], "author_count": 2}, {"id": "2609.01044", "category": "cond-mat", "title": "Mass-conserving growth percolation in polymer gelation", "abstract": "Polymer gelation involves the emergence of a system-spanning network from growing polymer-rich domains, yet conventional percolation models typically prescribe particle size independently of material consumption. We formulate gelation as a locally mass-conserving growth-percolation process in which Voronoi capture zones define finite material reservoirs for individual nuclei. Local depletion determines the evolving supersaturation and limiting particle size, while particle contacts generate a dynamic network whose first spanning cluster defines the gel point. Three mechanisms, namely, interface-, diffusion-, and polymer-blob-controlled growth produce distinct gelation kinetics while sharing the same accessible final state. Spatial fluctuations in nucleation further generate a distribution of gelation times. The framework separates gelation from saturation and naturally captures post-gel aging as continued growth and topological maturation.", "url": "https://arxiv.org/abs/2609.01044", "type": "理论", "summary": "1. 该工作将聚合物凝胶化建模为局域质量守恒的增长逾渗过程，用Voronoi捕获区定义有限物质储库，并以首个跨体系簇确定凝胶点。\n2. 其核心在于局域耗尽动态调控过饱和与极限粒径，且界面、扩散和聚合物团块控制三种生长机制共享同一终态却产生不同凝胶动力学。\n3. 该框架将凝胶化与饱和分离，并自然捕捉成核空间涨落所致的凝胶时间分布及凝胶后老化，为相关材料熟化研究提供统一图像。", "summary_source": "deepseek", "authors": [{"name": "Ameya Rege"}, {"name": "Lorenz Ratke"}], "featured_authors": [{"name": "Ameya Rege"}, {"name": "Lorenz Ratke"}], "author_count": 2}, {"id": "2609.01076", "category": "cond-mat", "title": "Text-guided flow matching enables sample-efficient crystal structure generation", "abstract": "Crystal generators can now propose periodic structures, but their control interfaces remain poorly matched to the mixed descriptors used in materials design. Text provides a compact way to combine composition, symmetry, prototype and property cues, yet it has not been clear whether such information can steer flow-based crystal generation. Here we introduce TFMat, a text-conditioned flow-matching framework that uses structured materials language as a semantic prior for a CrystalFlow generator. Across Perov-5, Carbon-24 and MP-20 crystal structure prediction benchmarks, TFMat improves one-candidate match rates over CrystalFlow and reaches a 92.04% MP-20 match rate with 20 candidates; in de novo generation, it improves element-count and density distribution alignment while retaining coarse property consistency in composition-selected outputs. These results position structured text as an inspectable control layer for translating human-readable materials intent into candidate crystals for downstream simulation and validation.", "url": "https://arxiv.org/abs/2609.01076", "type": "理论+数值", "summary": "1. 该工作提出文本引导的流匹配框架TFMat，以结构化材料语言作为语义先验，用于条件化晶体结构生成。\n2. 其技术卖点在于在Perov-5、Carbon-24与MP-20基准上提升单候选匹配率，并以20个候选达到92.04%的MP-20匹配率，同时改善新结构生成的元素计数与密度分布对齐。\n3. 该结果表明文本可作为可检视的控制层，将材料设计意图转译为候选晶体，为后续模拟验证及多模态生成研究提供启发。", "summary_source": "deepseek", "authors": [{"name": "Wentao Li"}], "featured_authors": [{"name": "Wentao Li"}], "author_count": 1}, {"id": "2609.01078", "category": "cond-mat", "title": "Statistical Language Competition Model with Dynamic Edge Weighting on a Random Network", "abstract": "This paper presents a computational study of language competition dynamics on Erdős--Rényi random networks, extending the foundational Abrams--Strogatz model through two novel contributions: (i) a dynamic edge-weighting mechanism that reinforces social ties between co-minority speakers by an additive increment $\\Delta$, and (ii) a probabilistic agent-based framework governing language switching via a weighted majority rule. Phase boundaries separating the dominance and coexistence regimes are identified across a two-dimensional parameter space $(p, \\Delta)$, where $p$ denotes the network connectivity probability. We further characterise anomalous persistence zones within predicted dominance regions, attributing them to the formation of isolated minority speaker clusters. Scaling study across network sizes $N \\in \\{50, 100, 250, 500, 1000\\}$ reveal that average cluster size decreases with $N$ and that phase boundaries diffuse with increasing stochastic noise. Finally, we discuss extensions to a tripartite bilingual model and heterogeneous prestige/volatility to more faithfully capture real sociolinguistic contact scenarios.", "url": "https://arxiv.org/abs/2609.01078", "type": "理论", "summary": "1. 该工作对 Erdős–Rényi 随机网络上的语言竞争动力学进行数值研究，将 Abrams–Strogatz 模型推广为含动态边权增量 Δ 与加权多数规则的概率性智能体模型。\n2. 其在二维参数空间 (p, Δ) 中标定支配区与共存区的相界，并将支配区内的反常持续带归因于少数语言使用者的孤立团簇，同时发现团簇平均尺寸随 N 增大而减小、噪声使相界弥散。\n3. 该框架为面向三语双语共存及声望/易变性异质等真实语言接触场景的推广提供了出发点，也有助于理解随机网络上社会强化效应的有限尺寸行为。", "summary_source": "deepseek", "authors": [{"name": "Somyaranjan Chakra"}, {"name": "Mohit Anand Madhesia"}, {"name": "Shradha Mishra"}], "featured_authors": [{"name": "Somyaranjan Chakra"}, {"name": "Mohit Anand Madhesia"}, {"name": "Shradha Mishra"}], "author_count": 3}, {"id": "2609.01088", "category": "cond-mat", "title": "Pressure-regulated mechanochemistry at lithium metal-sulfide electrolyte interfaces", "abstract": "Stack pressure is commonly treated as a means of maintaining physical contact in all-solid-state lithium-metal batteries, but it can also alter the chemistry of reactive solid-solid interfaces. Here, using pressure-aware, charge-resolved machine-learning molecular dynamics validated against DFT, we determine how pressure magnitude and loading geometry regulate interphase formation at Li||Li6PS5Cl interfaces. The response is nonmonotonic: compression at 1 kbar accelerates PS4 decomposition and Li2S-like ordering, whereas 10-100 kbar compression restricts structural rearrangement and long-range crystallization. Charge-resolved dynamics further identify sulfur-centered, lithium-rich early-interphase environments associated with subsequent Li2S-like ordering. Uniaxial loading accelerates interfacial reaction relative to isostatic loading at the same nominal pressure. Pressure also changes void closure and dead-lithium spreading in a defect-location-dependent manner. These results establish applied pressure as a mechanochemical process variable coupling interphase chemistry, ion transport and defect evolution, providing a mechanistic framework for interpreting pressure effects in sulfide solid-state batteries.", "url": "https://arxiv.org/abs/2609.01088", "type": "理论+数值", "summary": "1. 该工作利用压力感知的电荷分辨机器学习分子动力学并结合DFT验证，系统研究了堆叠压力对Li||Li6PS5Cl界面中间相形成的影响。\n2. 核心发现在于压力响应非单调：约1 kbar压缩加速PS4分解及Li2S类有序化，而10–100 kbar抑制结构重排与长程晶化，且单轴加载比等静压更促进界面反应。\n3. 这确立了压力作为调控硫化物固态电池界面化学、离子输运与缺陷演化的机械化学过程变量，为理解并设计压力条件提供了机理框架。", "summary_source": "deepseek", "authors": [{"name": "Kunik Jang"}, {"name": "Jaehwan Choi"}, {"name": "Jang Wook Choi"}, {"name": "Yousung Jung"}], "featured_authors": [{"name": "Kunik Jang"}, {"name": "Jaehwan Choi"}, {"name": "Jang Wook Choi"}, {"name": "Yousung Jung"}], "author_count": 4}, {"id": "2609.01137", "category": "cond-mat", "title": "Quantum antidipolar systems in two-dimensional geometries", "abstract": "Particles with magnetic moment can be polarized, and rapidly rotated, employing a magnetic field such that the dipolar interaction among them changes sign, becoming antidipolar and thus isotropically attractive in a plane. Polar molecules can also be manipulated using microwave dressing fields to invert the sign of the dipole-dipole interaction. In this work, we study a two-dimensional system of antidipolar particles by calculating its equation of state and structural properties. The system behaves as a liquid even for scattering lengths significantly greater than the dipolar length. For large enough densities, the system transitions to a solid with one particle per lattice site via a first-order phase transition at a significantly smaller density than its dipolar counterpart. Moreover, motivated by the recent realization of a strongly axially trapped, bilayer geometry [Science 384, 546-551 (2024)], we study the properties of the bilayer liquid phase as the inter-layer distance is tuned, and provide the range of parameters where one layer can influence the properties of the other.", "url": "https://arxiv.org/abs/2609.01137", "type": "理论", "summary": "1. 该工作研究二维反偶极粒子的物态方程与结构性质，并分析双层层内液体随层间距的演化。\n2. 核心在于反偶极吸引使系统在散射长度远大于偶极长度时仍呈液态，且在更低密度以一级相变进入单粒子格点固相。\n3. 这为极性分子或磁原子经微波或旋转场实现反偶极作用，并提供双层调控参数窗口的实验研究提供参考。", "summary_source": "deepseek", "authors": [{"name": "Juan Sánchez-Baena"}, {"name": "Jordi Boronat"}], "featured_authors": [{"name": "Juan Sánchez-Baena"}, {"name": "Jordi Boronat"}], "author_count": 2}, {"id": "2609.01160", "category": "cond-mat", "title": "Layer-selective and magnetic-field-enhanced transport of topological kink states in rhombohedral multilayer graphene", "abstract": "Topological valley kink states (VKSs), which are quantum valley Hall states emerging at the interfaces between adjacent domains with opposite valley Chern numbers, have attracted considerable interest in graphene-based systems. In this work, we investigate the quantum transport of VKSs in ABC-stacked rhombohedral multilayer graphene in the presence of Anderson disorder and a perpendicular magnetic field. Two prominent transport characteristics are revealed. First, in the absence of a magnetic field, the kink states exhibit strong layer polarization, with their wave functions predominantly localized and equally distributed on the outermost top and bottom layers. As a result, their transport properties are highly sensitive to the layer-selective disorder distribution. Second, under a perpendicular magnetic field, the layer-symmetric spatial distribution of VKSs is broken, leading to a significant reduction in the wave-function overlap between counter-propagating VKSs from opposite valleys. Consequently, intervalley scattering is suppressed, and the transmission of VKSs through disordered regions is substantially enhanced. Our results provide new insights into multichannel topological valley transport in rhombohedral multilayer graphene and demonstrates disorder-engineering and magnetic fields as effective approaches for manipulating the propagation of VKSs.", "url": "https://arxiv.org/abs/2609.01160", "type": "理论", "summary": "1. 该工作通过量子输运计算研究了ABC堆垛菱面体多层石墨烯中拓扑谷陈数畴壁谷扭结态在安德森无序和垂直磁场下的传播特性。\n2. 其核心发现是零场下扭结态波函数强局域并等权分布于最外层，导致输运对层选择无序敏感；垂直磁场则打破层对称分布、减小反向谷间态波函数重叠，抑制谷间散射并显著增强无序区透射。\n3. 这为利用层分辨无序与磁场调控多通道拓扑谷输运提供了新途径，并启示在菱面体多层石墨烯及其他谷电子平台中实现可调拓扑波导。", "summary_source": "deepseek", "authors": [{"name": "Chengyu Shen"}, {"name": "Zhe Hou"}], "featured_authors": [{"name": "Chengyu Shen"}, {"name": "Zhe Hou"}], "author_count": 2}, {"id": "2609.01197", "category": "cond-mat", "title": "Dynamical phase transitions for single particles in the semiclassical and weak noise limits", "abstract": "We present a unifying description of dynamical phase transitions in the unitary evolution of an isolated quantum particle and the dissipative relaxation of a classical Brownian particle, based on a dynamical generat- ing function. In the semiclassical and weak-noise limits, Fisher zeros of this function condense in the complex- time plane and reach the corresponding physical axes, producing dynamical phase transitions through a competition between return trajectories. This establishes a direct connection between quantum and classical (finite-time) dynamical phase transitions, where the semiclassical limit plays the role of the thermodynamic limit. In particular, the established link naturally provides a classical version of the Loschmidt amplitude and shows how dynamical quantum phase transitions, typically associated with isolated many-body systems, can arise in a single-particle quantum system. The dynamical phases are distinguished by a unifying, trajectory- based order parameter, realized as a classical correlation function and a sequential quantum weak value.", "url": "https://arxiv.org/abs/2609.01197", "type": "理论", "summary": "1. 该文借助动力学生成函数，统一描述了单粒子量子幺正演化与经典布朗耗散弛豫中的动力学相变。\n2. 核心在于半经典与弱噪声极限下Fisher零点在复时间平面凝聚并到达物理轴，使半经典极限充当热力学极限，从而建立量子与经典有限时间动力学相变的直接对应。\n3. 这自然给出类Loschmidt振幅及基于轨迹的序参量（经典关联函数与顺序量子弱值），表明单粒子系统亦可呈现通常属于孤立多体系统的动力学量子相变。", "summary_source": "deepseek", "authors": [{"name": "Norayr Asriyan"}, {"name": "Jan Meibohm"}, {"name": "Vasco Cavina"}, {"name": "Massimiliano Esposito"}], "featured_authors": [{"name": "Norayr Asriyan"}, {"name": "Jan Meibohm"}, {"name": "Vasco Cavina"}, {"name": "Massimiliano Esposito"}], "author_count": 4}, {"id": "2609.01213", "category": "cond-mat", "title": "Robust thermodynamics constrain disorder and pairing in far-overdoped Tl$_2$Ba$_2$CuO$_6$", "abstract": "The physical origin of the suppression of superconductivity with hole doping in overdoped cuprates remains unclear. We measure the electronic specific heat of microgram-scale Tl$_2$Ba$_2$CuO$_6$ crystals and find sharp superconducting anomalies persisting far into the overdoped regime, with $\\Delta\\gamma(T_{\\rm c})/\\gamma_n\\approx0.6$ for $T_{\\rm c}=14$-$25$K. A weak-coupling BCS-like framework incorporating the known Fermi surface and cation disorder quantitatively reproduces the observed anomaly and its weak doping dependence. We conclude that the observed $T_{\\rm c}(p)$ cannot be driven predominantly by increasing disorder and is instead consistent with a smoothly decreasing pairing strength.", "url": "https://arxiv.org/abs/2609.01213", "type": "理论", "summary": "1. 该工作测量了微克级Tl2Ba2CuO6晶体的电子比热，在远过掺杂区发现尖锐超导异常，Tc=14–25K时Δγ(Tc)/γn约为0.6。\n2. 其要点是利用包含已知费米面与阳离子无序的弱耦合BCS类框架定量重现该异常及其弱掺杂依赖，表明无序增加并非Tc(p)下降的主导原因。\n3. 这为过掺杂铜氧化物配对强度随掺杂平滑减弱的图像提供热力学约束，并为理论模型筛选和明确下一轮实验提供了基准。", "summary_source": "deepseek", "authors": [{"name": "Ayanesh Maiti"}, {"name": "David M. Broun"}, {"name": "Seunghyun Khim"}, {"name": "Michal Moravec"}, {"name": "Antony Carrington"}, {"name": "Carsten Putzke"}, {"name": "Vivek Mishra"}, {"name": "Peter Hirschfeld"}, {"name": "Andrew P. Mackenzie"}, {"name": "Andreas W. Rost"}], "featured_authors": [{"name": "Ayanesh Maiti"}, {"name": "David M. Broun"}, {"name": "Seunghyun Khim"}, {"name": "Peter Hirschfeld"}, {"name": "Andrew P. Mackenzie"}, {"name": "Andreas W. Rost"}], "author_count": 10}, {"id": "2609.01278", "category": "cond-mat", "title": "An exact and fast solution of the inverse Regularized Optimal Transport problem", "abstract": "Optimal transport describes the most efficient way to move mass between two distributions, given a cost matrix for moving mass between each pair of locations. Entropic optimal transport, solved via the Sinkhorn algorithm, is a widely used regularized version of this problem. Its inverse problem asks the opposite question: given an observed transport plan, what cost matrix produced it? This is difficult because the cost is identifiable only up to an additive gauge freedom. Here we show that this freedom can be fixed exactly by a single double-centering operation applied to the observed plan, yielding the true cost matrix in closed form, with no iterative optimization required. When a modest number of true cost entries are known, the same approach lets us jointly estimate the temperature parameter controlling the entropic regularization, together with a diagnostic for the reliability of this estimate. We further show that the method is not specific to the entropic optimal transport, but extends to a broader class of transport models defined by an invertible relation between cost and plan.", "url": "https://arxiv.org/abs/2609.01278", "type": "理论+数值", "summary": "1. 该工作为逆正则化最优输运问题给出了精确且快速的闭式解。\n2. 其核心在于对观测输运计划施加一次双中心化即可固定规范自由度，并在少量成本元已知时联合估计熵正则温度及其可靠性诊断，且推广至可逆输运模型类。\n3. 这一结果使从观测输运计划恢复真实成本的统计推断不再依赖迭代优化，为相关应用领域的实证研究提供了便利且可检验的途径。", "summary_source": "deepseek", "authors": [{"name": "Dario Mazzilli"}, {"name": "Riccardo Piombo"}, {"name": "Lorenzo Buffa"}, {"name": "Aurelio Patelli"}], "featured_authors": [{"name": "Dario Mazzilli"}, {"name": "Riccardo Piombo"}, {"name": "Lorenzo Buffa"}, {"name": "Aurelio Patelli"}], "author_count": 4}, {"id": "2609.01301", "category": "cond-mat", "title": "Self-Healing Diffusion Monte Carlo applied to a simple fermionic model: A critical assessment of the method", "abstract": "We investigate the Self-Healing Diffusion Monte Carlo (SHDMC) method using a one-dimensional model with periodic boundary conditions. An inversion symmetry is introduced to mimic the antisymmetry property of fermionic wavefunctions, with the bosonic and fermionic sectors being modeled by the even and odd eigenstates, respectively. As in realistic fermionic systems, the nodal structure is only partially constrained by symmetry, making this model a non-trivial testbed for nodal optimization algorithms such as SHDMC. We show that the nodal evolution under SHDMC iterations can be cast into a dynamical system exhibiting both attractive and repulsive fixed points. In the standard formulation of SHDMC applied to this model, the fixed-node energy is found to increase upon iteration, and the node converges to a wrong value, indicating that SHDMC does not always converge to the correct solution. We further show that this problem is partially cured by modifying the nodal update criterion to give more importance to the nodal region. Achieving convergence in the general case very likely requires the use of a localized basis set, as is the case for this model.", "url": "https://arxiv.org/abs/2609.01301", "type": "理论+数值", "summary": "1. 该工作将自修复扩散蒙特卡洛方法应用于一维周期边界模型，以反演对称性模拟费米子波函数反对称特征，对节点优化算法进行关键评估。\n2. 其核心发现是节点演化可表述为兼具吸引与排斥不动点的动力学过程，标准格式下迭代能导致固定节点能升高并收敛到错误节点，而修改节点更新判据可部分修复该问题。\n3. 这警示该类方法并非总能收敛到真实解，提示一般情形需借助局域基组及更稳健的节点判据来实现可靠收敛。", "summary_source": "deepseek", "authors": [{"name": "Michel Caffarel"}, {"name": "Manon Pinar"}, {"name": "Anthony Scemama"}], "featured_authors": [{"name": "Michel Caffarel"}, {"name": "Manon Pinar"}, {"name": "Anthony Scemama"}], "author_count": 3}, {"id": "2609.01312", "category": "cond-mat", "title": "Inversion-symmetric topological insulators in cut-and-project binary chains", "abstract": "We investigate the electronic properties of binary tight-binding chains generated by the cut-and-project method for rational slopes $\\alpha=p/q$, leading to periodic and inversion symmetric chains with $n=p+q$ sites. The binary structure is encoded in two hopping amplitudes $t_a$ and $t_b$. For fixed $t_a \\neq t_b$, the support of the energy spectrum as a function of $p/n$ gives rise to a \"Cut-and-Project butterfly\". We concentrate on insulators with $M$ filled bands among a total of $n$ bands and vary $t_a/t_b$. Inversion symmetry constrains the electric polarization $P$ to $0$ or $P_q/2$ modulo a polarization quantum $P_q = \\gcd(M,n)/n$. A topological transition, between two insulators that differ by their quantized polarization, occurs if and only if $n/\\gcd(M,n)$ is odd. When $n/\\gcd(M,n)$ is even, the two insulating regimes have a vanishing polarization and no topological transition occurs, despite the gap closing at $t_a=t_b$. When $n$ is even and $M$ odd, we find an adiabatic path between $t_a>t_b$ and $t_a<t_b$ that maintains inversion symmetry and a gap.", "url": "https://arxiv.org/abs/2609.01312", "type": "理论", "summary": "1. 该工作研究由cut-and-project方法生成的有理斜率二元紧束缚链，聚焦具有反转对称的周期绝缘体随跳迁比变化的电子结构与极化行为。\n2. 其核心发现是极化量子化拓扑转变当且仅当n/gcd(M,n)为奇数时发生；为偶数时即便ta=tb处能隙闭合也不发生转变，且n偶M奇时存在保持反转对称与能隙的绝热路径。\n3. 这为反转对称二元链中拓扑绝缘相的判据与绝热连接提供了精确图景，并可能启发Cut-and-Project蝴蝶谱在其他准周期平台上的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Zhipeng Zeng"}, {"name": "Yuge Chen"}, {"name": "Jean-Noël Fuchs"}, {"name": "Jianxin Zhong"}, {"name": "Rémy Mosseri"}], "featured_authors": [{"name": "Zhipeng Zeng"}, {"name": "Yuge Chen"}, {"name": "Jean-Noël Fuchs"}, {"name": "Jianxin Zhong"}, {"name": "Rémy Mosseri"}], "author_count": 5}, {"id": "2609.01329", "category": "cond-mat", "title": "Pole-Zero Geometry, Model Reduction, and Identifiability in Sensory Adaptation", "abstract": "Sensory adaptation provides a concrete setting in which low-order system identification can fail qualitatively. We show that one fixed higher-order adaptive system composed entirely of real first-order relaxation modes can be reduced to opposite sides of the second-order pole boundary: low-frequency moment matching gives $\\rho_{\\rm moment}=4.50$, whereas finite-window fitting gives $\\rho_{\\rm window}=3.31$, and the inferred pole class changes further with sampling protocol. Thus the real-versus-complex classification of a reduced model is not itself reduction invariant. We then use the general two-state spectrum to connect stochastic identifiability to adaptation: for nontrivial coupling and one-state observation, cross diffusion drops out of the scalar spectrum when the hidden state has no self-relaxation. In the adaptive model, this condition is precisely the integral-memory limit that produces exact adaptation, while leaky memory restores spectral sensitivity. For the exact-adaptation model, the Gaussian path-space irreversibility nevertheless depends on the hidden cross-diffusion channel. Hence $\\{H,S_x\\}$ does not determine the irreversibility r
