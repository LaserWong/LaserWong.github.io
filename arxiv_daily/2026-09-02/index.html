verse spatial dynamics of two interacting photons in a Rydberg nonlinear medium. Extending the well-studied one-dimensional case, we explore both longitudinal and transverse correlations of photons propagating as Rydberg polaritons. We identify distinct behaviors and scaling laws for these correlations, arising from fundamentally different mechanisms in the two directions: diffraction for transverse correlations and diffusion for longitudinal correlations. We develop a model incorporating a Gaussian optical beam and an inhomogeneous atomic density distribution, from which we derive quantitative predictions for correlation functions in both directions. We further show that the propagation equations can be reduced to a single Schrödinger-like equation, allowing approximate solutions that are supported by full numerical results. Our findings indicate that the transverse correlation length is determined primarily by the blockade radius, whereas the longitudinal correlation length is limited by bandwidth. These results establish transverse Rydberg blockade as a distinct and measurable correlation mechanism and show that spatial photon correlations provide a direct means of measuring the blockade radius.", "url": "https://arxiv.org/abs/2609.00348", "type": "理论+数值", "summary": "1. 该工作发展了里德伯非线性介质中两个相互作用光子横向空间动力学的理论，将熟知的纵向一维研究推广至包含横向维度的传播图像。\n2. 其核心在于揭示横向关联受衍射主导、纵向关联受扩散主导，并证明横向关联长度主要由阻塞半径决定，而纵向关联长度受带宽限制。\n3. 这项工作将横向里德伯阻塞确立为一种可测的关联机制，同时表明空间光子关联可作为直接测量阻塞半径的有效途径。", "summary_source": "deepseek", "authors": [{"name": "Bankim Chandra Das"}, {"name": "Daniil Svirskiy"}, {"name": "Matthias Metternich"}, {"name": "Wolfgang Alt"}, {"name": "Sebastian Hofferberth"}, {"name": "Ofer Firstenberg"}], "featured_authors": [{"name": "Bankim Chandra Das"}, {"name": "Daniil Svirskiy"}, {"name": "Matthias Metternich"}, {"name": "Wolfgang Alt"}, {"name": "Sebastian Hofferberth"}, {"name": "Ofer Firstenberg"}], "author_count": 6}, {"id": "2609.00475", "category": "quant-ph", "title": "Fractal dimension predicts quantum kernel collapse in angle-encoded data", "abstract": "Angle-encoded quantum kernels on tabular data collapse when the feature map is wider than the intrinsic dimension of the data. We propose the correlation fractal dimension D2 as an a priori qubit budget: encode D2 coordinates chosen by FD-ASE instead of the PCA-95% width or all E attributes. On nine data sets and a statevector simulator (n= 32), a one-layer ZZ fidelity kernel at q=D2 stays geometrically alive while the same kernel at the PCA-95% width has already collapsed. The budget is map-dependent: product-state and IQP maps overshoot it; a second ZZ layer undershoots it. Packed dense-angle and re-uploading encodings still live at the fractal q, but not when PCA-95% features are stacked onto those qubits. Shrinking the angle bandwidth moves the ZZ knee later; stretching it kills the kernel earlier. On IBM Quantum (ibm_fez, 256 shots, n=8) the one-layer ZZ kernel at the fractal width matches the exact kernel (MAE 0.021); past that width both hardware and simulator have collapsed. The ceiling is a property of the map-data pair at a stated bandwidth, not of the classical table alone.", "url": "https://arxiv.org/abs/2609.00475", "type": "理论", "summary": "1. 该工作针对角度编码量子核在特征映射维数超过数据内在维数时发生塌缩的问题，提出以关联分形维数D2作为先验量子比特预算。\n2. 其卖点在于用FD-ASE选取D2个坐标替代PCA-95%宽度或全部特征；在九组数据与n=32模拟中，单层ZZ保真度核在q=D2时仍几何有效而PCA宽度已塌缩，且该预算法则依赖于映射与角度带宽。\n3. 这为量子核塌缩上界归因于映射-数据-带宽组合提供了定量判据，并为量子机器学习中编码宽度选择及近期硬件实验设计提供了可操作的启发。", "summary_source": "deepseek", "authors": [{"name": "Ana Paula Appel"}], "featured_authors": [{"name": "Ana Paula Appel"}], "author_count": 1}, {"id": "2609.00671", "category": "quant-ph", "title": "Parametric amplification of continuous-variable entangled state for loss-tolerant quantum distributed sensing", "abstract": "Quantum metrology exploits quantum states to achieve an estimation sensitivity beyond classical limits. In the continuous-variable (CV) regime, the squeezed state has been used to implement deterministic quantum sensing, but the quantum metrology sensitivity of this state is significantly affected by losses or detection inefficiencies, which restrict its applications. In this work, quantum distributed sensing is proposed using optical parametric amplified multimode entanglement generated from squeezed states. It is found that the sensitivity is robust to loss or detection inefficiency when large-gain optical parametric amplification (OPA) is introduced, where a two-mode Einstein--Podolsky--Rosen-entangled state and a four-mode cluster state are exploited for analysis. The quantum sensitivity is greatly improved compared to that without OPA in almost all loss scenarios. The quantum Fisher matrix is calculated for both states to obtain the optimal bound in comparison with our scheme, and it is found that even with a small or moderate OPA gain, quantum sensing can be improved compared with the traditional scheme. The states are also compared with corresponding single-mode squeezed states, finding the parameter ranges where entangled states perform better. This study provides a method for realizing large-scale quantum metrology in real-world applications despite losses or detection inefficiencies.", "url": "https://arxiv.org/abs/2609.00671", "type": "理论", "summary": "1. 该工作提出利用光学参量放大增强的多模压缩态纠缠实现损耗容忍的连续变量量子分布式传感。\n2. 其核心技术在于大增益光参量放大使双模EPR态及四模簇态的量子费希尔信息在近全部损耗情形下显著优于无放大方案，并给出小或中等增益下的优势参数区间。\n3. 这为面向实际有损信道的大尺度量子计量提供了一条可行路线，并启发其他多模纠缠编码与放大补偿策略的设计。", "summary_source": "deepseek", "authors": [{"name": "Sijin Li"}, {"name": "Wei Wang"}], "featured_authors": [{"name": "Sijin Li"}, {"name": "Wei Wang"}], "author_count": 2}, {"id": "2609.00694", "category": "quant-ph", "title": "The Fermionic Cohomology Problem on the Full Fock Space Is $\\mathrm{QMA}_1$-Complete", "abstract": "Fermionic cohomology characterizes the zero-energy states of the supersymmetric Hamiltonian associated with a fermionic differential. Previous work showed that the problem restricted to a particle-number sector specified with the input is $\\mathrm{QMA}_1$-hard and belongs to $\\mathrm{QMA}$. We study the global problem, in which no sector is specified and cohomology may occur anywhere in the full Fock space. This formulation directly matches the whole-space ground-state question: a specified-degree NO instance may still have zero-energy states in another sector, whereas the global NO promise excludes them across all sectors and their superpositions. We prove that this full-Fock problem is $\\mathrm{QMA}_1$-complete for differentials given as exact lists of local monomials, even when each monomial acts on at most $41$ modes. As a companion result, we prove $\\mathrm{QMA}_1$-completeness for the specified-degree problem with $30$-mode terms whose hard instances admit a one-dimensional block-chain realization.", "url": "https://arxiv.org/abs/2609.00694", "type": "理论", "summary": "1. 该工作研究完整Fock空间中费米型上同调问题的判定复杂性，证明其全局版本对判定全域是否存在零能态是QMA_1完全的。\n2. 其主要贡献在于舍弃按输入指定粒子数扇区的限制，改而要求所有扇区及其叠加均无零能态方可接受反例，并证明即使微分以精确局域单项式列表给出、每个单项式至多作用41个模，问题仍保持QMA_1完全。\n3. 附属结果的30模指定扇区困难实例具有一维块链实现，为量子复杂性下界归约与超对称哈密顿量基态结构研究提供了可用于构造和验证的具体模板。", "summary_source": "deepseek", "authors": [{"name": "Yibin Wang"}], "featured_authors": [{"name": "Yibin Wang"}], "author_count": 1}, {"id": "2609.00778", "category": "quant-ph", "title": "High-Rank Encoding Can Improve Approximate Quantum Error Correction", "abstract": "Conventional quantum-code constructions encode pure logical states as pure code states, but this restriction can sacrifice performance. We show that intrinsic encoding randomness can improve optimal entanglement fidelity. We bound the loss from imposing a rank-one encoder and prove it is at most quadratic near perfect recovery after joint optimization. The optimized advantage survives small noise perturbations. An explicit noise family requires higher-rank encoders arbitrarily close to perfect recovery, with every optimal encoder mapping pure inputs to mixed code states.", "url": "https://arxiv.org/abs/2609.00778", "type": "理论+数值", "summary": "1. 该工作研究了高秩（非纯态）编码如何改善近似量子纠错的性能，指出编码随机性可提升最优纠缠保真度。\n2. 技术上，其核心是证明秩一编码造成的最优纠缠保真度损失在完美恢复附近至多二次，并给出一个噪声族，其最优编码必须将纯输入映射到混合码态，且高秩编码可任意接近完美恢复。\n3. 这表明高秩编码可作为近似纠错中的资源，为突破纯态编码限制和设计可适应噪声扰动的纠错协议提供了更一般的最优性判据。", "summary_source": "deepseek", "authors": [{"name": "Bikun Li"}, {"name": "Liang Jiang"}], "featured_authors": [{"name": "Bikun Li"}, {"name": "Liang Jiang"}], "author_count": 2}, {"id": "2609.00848", "category": "quant-ph", "title": "Ontic and epistemic states in the theory of spacetime-local beables", "abstract": "Bell's theorem rules out developing a locally causal theory to describe quantum phenomena. Many take this to imply that any model of quantum entanglement must employ variables (called beables by Bell) which follow nonlocal rules, even though signaling is local. The alternative is to adopt an all-at-once (block universe) approach, with beables which may depend on both past and future inputs, even though signaling is causal. Within this lenient-causality approach (a.k.a. retrocausal), simple cases of entanglement have been successfully described by locally mediated stochastic toy models, i.e.,~toy models which are local in a sense which generalizes Bell's local causality. Developing a widely applicable reformulation of quantum mechanics along these lines is a grand challenge. This work presents a general framework for such models and theories, and identifies the corresponding ontic and epistemic states. The epistemic state is closely analogous to the quantum state, yielding an explanation for the collapse of the wavefunction. In the case of the models of the framework, it is clear what the information is about. The expression for the empirically verifiable predictions of the models in terms of the ontic and epistemic states displays remarkable parallels to the Born rule. A toy-model example is discussed.", "url": "https://arxiv.org/abs/2609.00848", "type": "理论", "summary": "1. 该工作为时空局域存在量理论建立一般性框架，涵盖 Bell 定理指向的 all-at-once、可依赖过去与未来输入的逆因果模型，并定义相应的本体态与认识态。\n2. 其核心在于认识态与量子态高度类似，从而为波函数坍缩给出信息论解释，且经验预言以本体态和认识态表达后呈现出与玻恩规则的显著平行。\n3. 这为将量子关联改写为不依赖非局域变量、仅由时空局域机制中介的随机模型提供了统一基础，也启示波函数应被理解为关于底层局域实在的信息状态。", "summary_source": "deepseek", "authors": [{"name": "Nathan Argaman"}], "featured_authors": [{"name": "Nathan Argaman"}], "author_count": 1}, {"id": "2609.00852", "category": "quant-ph", "title": "Structure-Aware Placement and Routing of Multi-Controlled Toffoli on Bivariate Bicycle Code Architectures", "abstract": "The multi-controlled Toffoli (MCT) gate is a fundamental primitive in quantum circuit design, with applications in quantum arithmetic, cryptanalysis, and algorithmic implementations. Being a high-level logical operation, the efficient decomposition of MCT gates into lower-level netlists has remained a major optimization challenge for decades. While emerging quantum error-correcting codes such as bivariate bicycle (BB) codes drastically reduce fault-tolerance overhead, realizing non-Clifford circuits on modular BB-code architectures introduces complex compilation bottlenecks governed by inter-module routing, factory density, and layout. Consequently, the mapping of MCT gates onto BB-code architectures remains relatively unexplored. In this paper, we overcome these challenges by mapping optimal-Toffoli-depth MCT decompositions (Dutta et al., PRA, 2025) onto BB-code-based fault-tolerant architectures via direct $\\lvert \\mathrm{CCZ} \\rangle$ state injection from an external magic state factory. We introduce a targeted placement strategy that exploits the binary-tree structure of MCT decompositions to co-locate interacting subtrees. This approach reduces inter-module instruction counts by up to $\\mathbf{16.02}\\%$ compared to a naive sequential first-fit placement. We also evaluate the impact of factory placement across different topologies, demonstrating that grid-based layouts yield up to a $\\mathbf{23.7}\\%$ reduction in inter-module instructions relative to linear architectures (Yoder et al., arXiv, 2025). Finally, we validate the practical viability of our compiled circuits by analyzing aggregate execution errors and logical failure probabilities using the bicycle-ISA error estimator bicycle_numerics provided by the Qiskit community, this https URL .", "url": "https://arxiv.org/abs/2609.00852", "type": "理论+数值", "summary": "1. 本文面向双变量循环码上的多控Toffoli门编译，利用外部魔法态工厂直接注入 |CCZ⟩ 态，将最优Toffoli深度分解映射到模块化容错架构。\n2. 核心在于利用分解的二叉树结构将交互子树共置，使模块间指令数比朴素顺序放置降低16.02%，且网格布局相对线性布局还可进一步减少至多23.7%。\n3. 借助bicycle-ISA误差估计器对聚合执行误差与逻辑故障概率的分析，证实该编译流程在双变量循环码容错系统中具有实际可行性。", "summary_source": "deepseek", "authors": [{"name": "Anik Basu Bhaumik"}, {"name": "Suman Dutta"}, {"name": "Siyi Wang"}, {"name": "Anupam Chattopadhyay"}], "featured_authors": [{"name": "Anik Basu Bhaumik"}, {"name": "Suman Dutta"}, {"name": "Siyi Wang"}, {"name": "Anupam Chattopadhyay"}], "author_count": 4}, {"id": "2609.00939", "category": "quant-ph", "title": "Robust CZ gate against flux line memory", "abstract": "High-fidelity CZ gates are central to superconducting quantum processors, but implementations based on flux tuning are still sensitive to pulse distortion. Conventional predistortion, typically used for an isolated gate, can recover the desired flux at the chip but it fails if the flux line memory exists, causing the fidelity of repeated CZ gates to drop rapidly. To address this issue, we model the flux line distortion as the dynamics of a stateful classical actuator coupled to a quantum system. Using a first-order Dyson expansion, we derive the error generators induced by variations in the initial flux-line state. We then design a robust CZ gate by optimizing the flux pulse to suppress these generators and minimize the residual flux line state at the gate exit. A one-pole flux line model shows the expected first-order robustness plateau. For a more practical three-pole model, the optimized CZ pulse achieves $F_{\\mathrm{avg}}=99.998\\%$, suppresses all first-order error generators, and brings the residual flux line state close to zero. With no additional waiting time between gates, our robust pulse achieves $F_{\\mathrm{avg}}=99.97\\%$ for the complete ten-gate sequence and reduces the sequence infidelity by a factor of about $2.3\\times10^{3}$ relative to the baseline under the same predistortion protocol. These results show that explicitly accounting for flux line memory maintains high-fidelity CZ operation across repeated gate sequences and addresses a key limitation of conventional predistortion.", "url": "https://arxiv.org/abs/2609.00939", "type": "理论+数值", "summary": "1. 该工作针对超导量子处理器中重复CZ门因磁通线记忆导致保真度快速下降的问题，提出将磁通线畸变建模为有状态经典驱动器与量子系统的耦合，并据此优化磁通脉冲。\n2. 技术上利用一阶Dyson展开导出初态磁通线状态变化引起的误差生成元，通过压制全部一阶误差生成元并减小门末残余磁通线状态设计鲁棒脉冲；三极点模型下平均保真度达99.998%，十门序列为99.97%，序列错误率较传统预畸变方案降低约2.3×10^3倍。\n3. 该结果表明显式考虑磁通线记忆可在连续门操作中维持高保真CZ门性能，为受控经典执行器记忆影响的量子脉冲整形提供了可推广的设计路径。", "summary_source": "deepseek", "authors": [{"name": "Yao Song"}, {"name": "Xiu-Hao Deng"}], "featured_authors": [{"name": "Yao Song"}, {"name": "Xiu-Hao Deng"}], "author_count": 2}, {"id": "2609.00977", "category": "quant-ph", "title": "Information geometry of non-equilibrium quantum states: Mixed metric structures on an extended information manifold", "abstract": "We discuss an information-geometric framework for characterizing quantum states in non-equilibrium dynamics. Using the transverse-field Ising chain model as a laboratory, we investigate the quantum Fisher information metric with particular emphasis on the mixed metric component $g_{ht}$ and related geometric observables, where $h$ is a controllable post-quench Hamiltonian parameter and $t$ is real time. The framework treats $h$ and $t$ as coordinates of an extended information manifold $(h,t)$. The geometric observables characterize the speed of evolution on the manifold and the alignment between the temporal and parameter-deformation directions. Correlations between these geometric quantities and two widely used measures of non-equilibrium dynamics, the entanglement entropy and the Loschmidt echo, are analyzed.", "url": "https://arxiv.org/abs/2609.00977", "type": "理论", "summary": "1. 该工作针对非平衡量子态提出信息几何框架，并以横场伊辛链为平台，将淬火后哈密顿参数h与时间t视为扩展信息流形坐标，计算量子Fisher信息混合度规分量g_ht。\n2. 技术卖点在于g_ht及相关几何可观测量刻画流形上演化速度以及时间演化与参数变形方向的相对对准，并与纠缠熵和Loschmidt回声建立关联。\n3. 这一几何描述为量子淬火动力学提供不依赖具体测量方案的统一表征，有望推广至更广泛的可积与非可积多体模型。", "summary_source": "deepseek", "authors": [{"name": "Kouji Kashiwa"}, {"name": "Hidefumi Matsuda"}], "featured_authors": [{"name": "Kouji Kashiwa"}, {"name": "Hidefumi Matsuda"}], "author_count": 2}, {"id": "2609.01008", "category": "quant-ph", "title": "Uniform Hiding of Haar Block Transpose Gram Matrices", "abstract": "Gaussian boson sampling with equally squeezed active inputs assigns collision free probabilities through a complex symmetric transpose Gram matrix formed from a rectangular block of a Haar interferometer. We prove a finite total variation comparison with the corresponding complex Gaussian transpose Gram law. The error bound is explicit, quadratic in the number of selected output modes, inversely proportional to the interferometer size, and uniform in the number of squeezed active inputs. The proof combines a centered circular orthogonal ensemble score analysis in the dense regime with a rectangular relative entropy bound. This result supplies a random matrix replacement component of Gaussian boson sampling hardness arguments.", "url": "https://arxiv.org/abs/2609.01008", "type": "理论", "summary": "1. 该文证明等压缩活动输入高斯玻色采样中，Haar干涉仪矩形块的转置Gram矩阵与复高斯转置Gram律间有显式全变差误差界。\n2. 其技术关键是误差随输出模式数平方增长、随干涉仪尺寸反比衰减且对活动压缩输入数一致成立；证明融合稠密区中心COE计分分析与矩形相对熵界。\n3. 这为高斯玻色采样经典不可模拟性论证提供了严格随机矩阵替换组件，并可作为后续计算复杂性下界的工具。", "summary_source": "deepseek", "authors": [{"name": "Hongru Zhao"}], "featured_authors": [{"name": "Hongru Zhao"}], "author_count": 1}, {"id": "2609.01029", "category": "quant-ph", "title": "Tangent fermions can restore vacuum stability of discrete-time Dirac models", "abstract": "The Dirac quantum walk (a 1+1 dimensional space-time discretization of the Dirac equation) has a $2\\mu$ mass gap both at the center and at the corner of the quasi-energy-momentum Brillouin zone. Gupta and Short recently noted [Quantum 9, 1845 (2025)] that the Dirac vacuum can create a particle-hole pair at the zone corner with the release of an energy $2\\mu$ to the environment. They removed this vacuum instability at the expense of fermion doubling, the appearance of a second low-energy Dirac cone. Here we show that an alternative discretization scheme, with a tangent rather than a sine dispersion relation, offers stability while retaining a single Dirac cone. The key step is the Cayley transformation from the unit circle of Floquet eigenvalues $e^{-i\\varepsilon}$ to the real line of unbounded energies $E=2\\tan(\\varepsilon/2)$. We compute the Schwinger effect (particle-hole pair creation in a uniform electric field) for tangent fermions and show that the pair-production rate agrees with the continuum result for a single Dirac cone. The zone corner is exactly decoupled if the scalar potential is coupled through the Hermitian generator of the quantum map. If it is coupled as a split operator, in order to preserve exact gauge invariance on the lattice, the corner does contribute - with a weight that vanishes quadratically with the lattice constants, in contrast to the Dirac quantum walk where the zone-corner instability survives the continuum limit.", "url": "https://arxiv.org/abs/2609.01029", "type": "理论", "summary": "1. 该工作针对离散时间狄拉克模型在准能量布里渊区角点处的真空不稳定，提出用正切色散取代正弦色散的新离散化，实现了无费米子加倍且稳定的单狄拉克锥真空。\n2. 其技术核心是经 Cayley 变换把 Floquet 本征值单位圆映射到无界能量 E=2tan(ε/2)，并证明均匀电场下正切费米子的 Schwinger 对产生率与单锥连续结果一致。\n3. 这为理解晶格规范不变性与紫外稳定性提供了启示：若以劈裂算符耦合保持规范不变，角点贡献随格距平方消失，而 Dirac 量子行走的角点不稳定性会在连续极限中存留。", "summary_source": "deepseek", "authors": [{"name": "C.W.J. Beenakker"}], "featured_authors": [{"name": "C.W.J. Beenakker"}], "author_count": 1}, {"id": "2609.01066", "category": "quant-ph", "title": "Scattering and Tunneling in Real Quantum Mechanics", "abstract": "We establish the general form of the evolution equation and study scattering and tunneling in real quantum mechanics. We prove an analogue of Stone's theorem for a real Kahler space and derive the corresponding general evolution equation, whose evolution operator is both orthogonal and symplectic. We formulate scattering theory in terms of real wave operators and the associated S-matrix. For the class of potentials considered, we show that the differential scattering cross section is equivalent to that obtained in standard complex quantum mechanics. We also show that the tunneling probability in real quantum mechanics is identical to that in complex quantum mechanics.", "url": "https://arxiv.org/abs/2609.01066", "type": "理论", "summary": "1. 该工作系统研究实量子力学中的散射与隧穿，证明实凯勒空间上的斯通定理类比，推导出一般演化方程，并使演化算子同时具备正交与辛结构。\n2. 技术关键在于利用实波算子与散射矩阵构建散射理论，在给定势类下严格证明微分散射截面及隧穿几率均与标准复量子力学完全一致。\n3. 这一结果将复量子力学的可检验散射与隧穿结论延伸至实凯勒几何框架，为不借助复数结构的量子模拟或场论模型提供了严格的判定基准。", "summary_source": "deepseek", "authors": [{"name": "Firdevs Karakus"}, {"name": "Daniil Stepanenko"}, {"name": "Igor Volovich"}], "featured_authors": [{"name": "Firdevs Karakus"}, {"name": "Daniil Stepanenko"}, {"name": "Igor Volovich"}], "author_count": 3}, {"id": "2609.01157", "category": "quant-ph", "title": "A continuous-mode quantum-optical representation of finite strong-field laser pulses in free space", "abstract": "We formulate an energy-consistent quantum-optical representation of finite paraxial laser pulses in free space. The formulation is based on a continuous-mode description and provides a step toward a unified treatment of coherent and nonclassical strong-field drivers. Starting from plane-wave quantization, we construct a transverse vector-mode reduction in which the selected mode can reproduce an arbitrary normalized spatial--polarization profile. For a coherent pulse, the measured pulse energy and full laboratory analytic signal determine the frequency-dependent coherent-state displacement $(\\alpha(\\omega))$, without introducing a physical quantization volume. For nonclassical pulses, the same first-order field data and total energy do not uniquely specify the quantum state. Additional correlation information or model assumptions are required. We incorporate this information through normal and anomalous covariance kernels and discuss $g^{(2)}$-based diagnostics of squeezed pulses. We also derive a phase-sensitive convergence criterion for numerical frequency-bin discretizations. An exactly solvable continuum-mode free-electron application shows that the coherent displacement reproduces the semiclassical mean trajectory, whereas the field covariances determine the electron wave packet width. The framework offers a convenient, energy-consistent interface between measured free-space pulses and quantum-optical calculations.", "url": "https://arxiv.org/abs/2609.01157", "type": "理论+数值", "summary": "1. 该工作提出了自由空间有限近轴强场激光脉冲的连续模量子光学表示，能量自洽且不引入物理量子化体积。\n2. 主要技术点是从平面波量子化出发构造横向矢量模约化，以任意空间-偏振剖面重建相干态位移，并通过正常/异常协方差核及g^(2)诊断描述非经典压缩脉冲。\n3. 这为统一处理相干与非经典强场驱动源提供了接口，其对频箱离散的相位敏感收敛判据与可解自由电子模型也给出了明确的后续理论与实验启发。", "summary_source": "deepseek", "authors": [{"name": "Szabolcs Hack"}, {"name": "Attila Czirják"}, {"name": "Péter Földi"}], "featured_authors": [{"name": "Szabolcs Hack"}, {"name": "Attila Czirják"}, {"name": "Péter Földi"}], "author_count": 3}, {"id": "2609.01204", "category": "quant-ph", "title": "Unbiased sampling from Boltzmann distributions with noisy energies", "abstract": "Sampling from the Boltzmann distribution is central to computational physics, yet hard when the energy is known only through a stochastic estimate, such as with machine-learned molecular potentials, in variational Monte Carlo, or on quantum computers, because a noisy energy biases the sampled distribution. The penalty method of Ceperley and Dewing corrects this but requires the noise variance and becomes intractable when it is large. We introduce the Poisson product estimator, an unbiased, non-negative estimator of the Boltzmann weight that only needs an upper bound on the energy estimator and remains efficient at high noise. Using it to optimize a variational quantum circuit gradient-free, we recover the $H_3^+$ ground-state energy in a minimal basis and, by sampling rather than following a single trajectory, also map the variational energy landscape.", "url": "https://arxiv.org/abs/2609.01204", "type": "理论+数值", "summary": "1. 针对能量只得通过随机估计时采样玻尔兹曼分布的瓶颈——常见于机器学习分子势、变分蒙特卡洛和量子计算——本文提出泊松乘积估计器。\n2. 它无偏且非负地估计玻尔兹曼权重，仅需能量估计的上界而不依赖噪声方差，因而即使噪声很强仍保持高效；作者以此无梯度优化变分量子电路。\n3. 通过采样而非单轨迹演化，该方法在最小基组下恢复H3+基态能量并绘出变分能量景观，为含噪能量环境下的有限温度采样和势能面探索提供了可扩展方案。", "summary_source": "deepseek", "authors": [{"name": "Iwo Sanderski"}, {"name": "Gian Gentinetta"}, {"name": "Giuseppe Carleo"}], "featured_authors": [{"name": "Iwo Sanderski"}, {"name": "Gian Gentinetta"}, {"name": "Giuseppe Carleo"}], "author_count": 3}, {"id": "2609.01241", "category": "quant-ph", "title": "Anticoncentration and entanglement in Gaussian boson sampling", "abstract": "Anticoncentration and entanglement are two properties used to study classical hardness or easiness of Gaussian boson sampling in varying regimes. In this paper, we consider three directions concerning anticoncentration and entanglement in Gaussian boson sampling: (1) We derive closed-form expressions for the second moment of hafnians of symmetric Gaussian products, and use this to precisely locate the anticoncentration transition as a function of the number of squeezed input modes. (2) We derive closed-form expressions for the Rényi-$\\alpha$ Page curves for Gaussian boson sampling. (3) We study unequal input squeezing parameters $(s_i)_i$, and prove estimates as well as monotonicity of the average-case Rényi-2 entropy Page curve in terms of the magnitudes $|s_i|$, which allow for extending equal squeezing results to unequal squeezing.", "url": "https://arxiv.org/abs/2609.01241", "type": "理论", "summary": "1. 该工作从反集中性与纠缠两方面，系统刻画高斯玻色采样在不同压缩模式数等条件下的经典可模拟性与计算复杂性。\n2. 主要技术贡献包括推导对称高斯积hafnian二阶矩的闭式表达式以精确定位反集中转变，并给出Rényi-α Page曲线的闭式结果及非均匀压缩下平均Rényi-2熵Page曲线的单调性估计。\n3. 这些结果将均匀压缩结论推广到非均匀压缩，为判定高斯玻色采样中间态的经典模拟难度提供了可操作的定量依据与理论参考。", "summary_source": "deepseek", "authors": [{"name": "Laura Shou"}, {"name": "Adam Ehrenberg"}, {"name": "Yu-Xin Wang"}, {"name": "Joseph T. Iosue"}, {"name": "Alexey V. Gorshkov"}], "featured_authors": [{"name": "Laura Shou"}, {"name": "Adam Ehrenberg"}, {"name": "Yu-Xin Wang"}, {"name": "Joseph T. Iosue"}, {"name": "Alexey V. Gorshkov"}], "author_count": 5}, {"id": "2609.01248", "category": "quant-ph", "title": "A Backend-Agnostic MWIS Kernel for Stochastic Unit Commitment with Neutral-Atom Hardware Validation", "abstract": "Quantum hardware is beginning to address structured combinatorial optimisation, but two steps still block practical use: mapping real operational models onto hardware-compatible instances, and converting noisy hardware output back into feasible decisions. Here we introduce a backend-agnostic computational interface that compiles the discrete decision layer of stochastic unit commitment into a move-based maximum-weight independent set (MWIS) problem, while retaining continuous dispatch and feasibility recovery in the classical computational layer. We validate the approach in a green hydrogen scheduling setting and deploy it on the QuEra Aquila neutral-atom quantum processor. This is the first end-to-end industrial scheduling workflow that connects real operational decisions to programmable neutral-atom hardware through a solver-agnostic MWIS representation. Across a 15-day hardware campaign on 50-node instances, hardware-generated solutions after classical refinement match or exceed the dispatch margins obtained from exact MWIS on every day. When scaling to 144 nodes, encoding quality remains stable, while the probability that the full atom array survives, rather than graph embedding, emerges as the dominant bottleneck to further scaling. Together, these results establish a hardware-compatible computational pathway toward larger problem scales, and lay the groundwork for exploring regimes in which exact classical optimisation may no longer scale efficiently.", "url": "https://arxiv.org/abs/2609.01248", "type": "理论+数值", "summary": "1. 该工作提出一种后端无关的最大权独立集（MWIS）计算内核，将随机机组组合的离散决策层编译为基于移动的MWIS问题，并在中性原子硬件上完成验证。\n2. 其主要技术价值在于首次建立从实际调度决策到可编程中性原子处理器的端到端工作流；在50节点绿氢调度的15天硬件实验中，经经典精修的硬件解在每一天均不劣于精确MWIS的调度裕度。\n3. 向144节点扩展时编码质量保持稳定，而原子阵列存活概率成为主要扩展瓶颈；这为探索经典精确优化可能不再高效的新尺度问题提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Jiying Chen"}, {"name": "Min Lin"}, {"name": "Jingwei Wen"}, {"name": "Zhihong Zhang"}, {"name": "Chuixiong Wu"}], "featured_authors": [{"name": "Jiying Chen"}, {"name": "Min Lin"}, {"name": "Jingwei Wen"}, {"name": "Zhihong Zhang"}, {"name": "Chuixiong Wu"}], "author_count": 5}, {"id": "2609.01267", "category": "quant-ph", "title": "A nonabelian anyon violates Haag duality", "abstract": "We show that a superselction sector describing a single nonabelian anyon violates Haag duality, which is equivalent to the fundamental quantum-information theoretic principle of uniqueness of purifications. We provide a simple physics argument as well as a rigorous proof using sector theory, and instantiate our result concretely in Levin-Wen models. We also show that the associated ground state does not allow for quantum steering despite being a pure state. Finally, we show that this ground state violates approximate Haag duality, disproving the conjecture that all gapped ground states satisfy this condition. Our result implies that there are gapped phases of matter where Haag duality fails at every point in the phase.", "url": "https://arxiv.org/abs/2609.01267", "type": "理论", "summary": "1. 该工作证明描述单个非阿贝尔任意子的超选择扇区破坏Haag对偶性，并利用Levin-Wen模型给出物理论证与严格证明。\n2. 其核心在于将Haag对偶性等价于纯化唯一性这一量子信息原理，进而展示相应基态虽为纯态却不支持量子转向，且破坏近似Haag对偶性。\n3. 这一结果否定了所有能隙基态满足近似Haag对偶性的猜想，意味着某些拓扑有序相中Haag对偶性在相内每一点均失效。", "summary_source": "deepseek", "authors": [{"name": "Daniel Wallick"}, {"name": "Henrik Wilming"}], "featured_authors": [{"name": "Daniel Wallick"}, {"name": "Henrik Wilming"}], "author_count": 2}, {"id": "2609.01280", "category": "quant-ph", "title": "Dynamical regimes of QAOA gradient response", "abstract": "Characterizing the trainability of the Quantum Approximate Optimization Algorithm (QAOA) requires understanding how its gradient landscape changes across circuit parameters and problem size. Yet these gradients are usually described in terms of the native QAOA angles, making it difficult to distinguish parameter specific features from broader changes in the underlying circuit dynamics. Here we introduce a dynamical representation of the QAOA parameter space based on a norm-weighted layer strength and a cost--mixer imbalance, separating the overall scale of the evolution from the relative contribution of the two generators. Using exact-state simulations of MaxCut, we find that the gradient landscape exhibits a coarse organization in these dynamical variables that persists across changes in circuit depth and schedule structure, while the finer interference pattern remains schedule dependent. Near-optimal solutions do not simply coincide with the largest local gradients, but instead occupy a distinct intermediate dynamical regime. Uniform schedules recover the broad location of this regime, whereas nonuniform schedules mainly reorganize its fine structure. Across the system sizes studied, near-optimal solution regions remain extended in the dynamical representation while their preimages in the native QAOA angles become substantially compressed at larger sizes. These results separate the persistence of useful QAOA dynamics from their accessibility in the native parameterization, and provide a dynamical framework for interpreting QAOA trainability across circuit and problem scales.", "url": "https://arxiv.org/abs/2609.01280", "type": "数值", "summary": "1. 该工作为QAOA参数空间引入动力学表示，用范数加权层强度和代价-混合不平衡量分离演化整体标度与两类生成元的相对贡献。\n2. 基于MaxCut精确态模拟发现，梯度景观在动力学变量下呈粗粒化分区且不随电路深度与调度结构改变，近优解落在最大局部梯度之外的中间动力学区域。\n3. 均匀调度可恢复该区域的宽泛位置，非均匀调度仅重塑其精细结构；近优区域在动力学表示中保持延展，而其在原生角度参数化中的原像随规模增大明显压缩。", "summary_source": "deepseek", "authors": [{"name": "Zarin Shakibaei"}, {"name": "Alexander Schnell"}], "featured_authors": [{"name": "Zarin Shakibaei"}, {"name": "Alexander Schnell"}], "author_count": 2}, {"id": "2609.01299", "category": "quant-ph", "title": "Emerging Personas and Tools for Hybrid Quantum-HPC Systems", "abstract": "Quantum computing is entering an era where quantum processing units (QPUs) with tens to hundreds of qubits are increasingly integrated with high-performance computing (HPC) systems to support hybrid quantum-classical workloads. This paradigm, often referred to as Quantum-Centric SuperComputing (QCSC), introduces new operational, software, and infrastructure challenges. In this paper, we identify and characterize six distinct personas involved in QCSC environments. Particular attention is given to emerging roles that arise at the interface between quantum and HPC systems. We analyze the responsibilities and tools associated with each persona and examine their differing requirements for operational data. Consistent data representations and analytics frameworks will be required to support diverse users across the quantum-HPC ecosystem. By defining personas and their data needs, we provide a foundation for future discussions in this critical area.", "url": "https://arxiv.org/abs/2609.01299", "type": "理论", "summary": "1. 该文针对量子中心超算这一混合量子-HPC范式，识别并刻画了六类不同的用户角色及其职责与工具。\n2. 其核心贡献在于系统分析量子与HPC交界处新兴角色对运行数据的不同需求，并指出统一数据表示和分析框架的必要性。\n3. 该角色框架为后续混合系统的数据治理、工具互操作及标准化研究提供了基础性讨论起点。", "summary_source": "deepseek", "authors": [{"name": "Eun-Kyung Lee"}, {"name": "Jessie Yu"}, {"name": "Claudio Carvalho"}, {"name": "Yoonho Park"}, {"name": "Marcelo Amaral"}, {"name": "Tim Osborne"}, {"name": "Woong Shin"}], "featured_authors": [{"name": "Eun-Kyung Lee"}, {"name": "Jessie Yu"}, {"name": "Claudio Carvalho"}, {"name": "Marcelo Amaral"}, {"name": "Tim Osborne"}, {"name": "Woong Shin"}], "author_count": 7}, {"id": "2609.01334", "category": "quant-ph", "title": "Fast Microwave-free State Preparation and Measurement of Superconducting Qubits", "abstract": "Fast, high-fidelity, scalable state preparation and measurement is critical to the realization of a quantum computing system. The state-of-the-art methods for preparation and readout of superconducting qubits require finely tuned microwave signals and ~100 ns of measurement time, which are major obstacles to the scalability and performance of superconducting quantum computers. Here, we have demonstrated novel, microwave-free methods for both preparation and readout of superconducting qubits with >99% fidelity in only 10 ns for either operation while maintaining qubit coherence. This technology is compatible with scalable superconducting digital control systems, and using quantum flux parametrons for amplification, we demonstrated full quantum-to-digital conversion in only 15 ns, which is an order of magnitude faster than state-of-the-art microwave-based techniques.", "url": "https://arxiv.org/abs/2609.01334", "type": "实验", "summary": "1. 该工作实验演示了无需微波的超导量子比特态制备与读出方法，两种操作均可在10 ns内以高于99%的保真度完成并保持量子相干性。\n2. 其技术核心是利用快速通量控制结合量子磁通参变放大器实现全量子—数字转换，全程仅需15 ns，比现有微波技术快一个数量级，且兼容可扩展的数字控制系统。\n3. 这一结果为超导量子计算摆脱微波控制瓶颈、走向全数字可扩展架构提供了直接的实验基础与技术启发。", "summary_source": "deepseek", "authors": [{"name": "R. Abraham"}, {"name": "F. Amet"}, {"name": "P. Anderson"}, {"name": "M. Arrigo"}, {"name": "J. Arteaga"}, {"name": "C. J. Ballard"}, {"name": "C. Barker"}, {"name": "T. Barnes"}, {"name": "P. Bechman"}, {"name": "R. Bhatt"}, {"name": "K. Blaine"}, {"name": "T. M. Borman"}, {"name": "J. Botimer"}, {"name": "G. R. Boyd"}, {"name": "P. Bradley"}, {"name": "A. D. Brandon"}, {"name": "T. K. Bristol"}, {"name": "A. Bulkos"}, {"name": "R. M. Burnett"}, {"name": "D. Burrowes"}, {"name": "D. N. Cakan"}, {"name": "N. Carniero"}, {"name": "T. Chamberlin"} Tralshawala"}, {"name": "D. Tran"}, {"name": "S. Tyler"}, {"name": "L. Upton"}, {"name": "G. Van Dyke"}, {"name": "J. Vannucci"}, {"name": "K. Vempati"}, {"name": "J. S. Vogel"}, {"name": "R. Vyas"}, {"name": "M. Wagner"}, {"name": "P. Warner"}, {"name": "N. Washington"}, {"name": "B. Way"}, {"name": "M. A. Wayne"}, {"name": "D. Wehella-Gamage"}, {"name": "M. E. Weippert"}, {"name": "T. Weitzel"}, {"name": "J. Wenner"}, {"name": "L. White"}, {"name": "S. Whitsitt"}, {"name": "A. Wilkinson"}, {"name": "R. Willey"}, {"name": "I. Yandow"}, {"name": "J. Yang"}, {"name": "L. Yu"}, {"name": "F. Yumiceva"}, {"name": "V. Zheng"}, {"name": "R. Zimmerman"}, {"name": "C. Zinn"}, {"name": "J. Ziskind"}, {"name": "et al. (114 additional authors not shown)"}], "featured_authors": [{"name": "R. Abraham"}, {"name": "F. Amet"}, {"name": "P. Anderson"}, {"name": "C. Zinn"}, {"name": "J. Ziskind"}, {"name": "et al. (114 additional authors not shown)"}], "author_count": 215}, {"id": "2609.01340", "category": "quant-ph", "title": "Quantum phase transitions of the Cavity Heisenberg spin-chain", "abstract": "The interplay between quantum criticality and ergodicity breaking constitutes a central challenge in complex quantum many-body systems. Here, we investigate ground-state quantum phase transitions (QPTs) and excited-state quantum phase transitions (ESQPTs), as well as ergodic-nonergodic transition in the cavity Heisenberg spin-chain (CHS) model. By combining quantum information measures with semiclassical fixed-point analysis, we identify a deformed phase that interpolates between the normal and superradiant phases, featuring a logarithmic nonanalyticity in the density of states (DoS) and two additional jump discontinuities. We further elucidate the spectral-structure mechanism underlying the connection between ESQPTs and the ergodic--nonergodic transition (ENET) via level statistics, participation ratios, and multifractal analysis. Our results provide a general framework for characterizing phase structures and spectral features in light--matter quantum many-body systems.", "url": "https://arxiv.org/abs/2609.01340", "type": "理论", "summary": "1. 该工作研究腔海森堡自旋链模型中基态与激发态量子相变以及遍历-非遍历转变。\n2. 其核心发现是结合量子信息度量与半经典不动点分析，识别出一个介于正常相和超辐射相之间的形变相，其态密度呈对数非解析并附有两个跳变不连续。\n3. 通过能级统计、参与率与多重分形分析阐明激发态相变与遍历性破缺关联的谱结构机制，为光-物质量子多体系统相结构提供了普适框架。", "summary_source": "deepseek", "authors": [{"name": "Lv-Ting Gong"}, {"name": "Shao-Fan He"}, {"name": "Fu-Quan Dou"}], "featured_authors": [{"name": "Lv-Ting Gong"}, {"name": "Shao-Fan He"}, {"name": "Fu-Quan Dou"}], "author_count": 3}, {"id": "2609.01524", "category": "quant-ph", "title": "Quantum Weighted Moving Average for Predicting Limit Order Book Trends", "abstract": "Can quantum computers be useful for forecasting multivariate financial time series? In this work, we consider the problem of predicting price trends from limit order book (LOB) data. After identifying key components of classical models, we introduce the quantum weighted moving average (QWMA) model. The two main building blocks are, first, classically preprocessing via normalization of both feature and temporal dimensions and, second, a linear combination of unitaries-based layer for unitarily-embedded classical data. The models are evaluated on the FI-2010 benchmark dataset and a second dataset of China A-share stocks. While we do not present evidence of quantum advantage, the combined classical-quantum model demonstrates performances close to the best classical models. The quantum part of the model is expressive enough to focus on the most predictive parts of the time series. Several specializations of the QWMA model are considered, in particular a variant related to the widely-used exponential moving average (EMA). We give consideration to the limitations of the methods and the datasets.", "url": "https://arxiv.org/abs/2609.01524", "type": "理论+数值", "summary": "1. 该工作针对限价订单簿价格趋势预测问题，提出了量子加权移动平均（QWMA）模型，并在FI-2010和中国A股数据集上进行了评估。\n2. 其技术核心在于通过特征与时间维度的经典归一化预处理，将经典数据酉嵌入后施加基于线性组合酉的量子层，使模型能够聚焦时间序列中最具预测性的部分。\n3. 研究虽未展示量子优势但与最优经典模型性能接近，这为评估近期量子模型在多元金融时间序列中的应用潜力及局限提供了参考框架。", "summary_source": "deepseek", "authors": [{"name": "Matthias Kamm"}, {"name": "Dinh-Long Vu"}, {"name": "Patrick Rebentrost"}], "featured_authors": [{"name": "Matthias Kamm"}, {"name": "Dinh-Long Vu"}, {"name": "Patrick Rebentrost"}], "author_count": 3}, {"id": "2609.01547", "category": "quant-ph", "title": "Irreducibility and regularisation properties of Gaussian quantum Markov semigroups", "abstract": "We study regularisation and irreducibility properties of Gaussian quantum Markov semigroups (GQMSs) acting on continuous-variable quantum systems. We first identify a natural notion of regularity for operators in this setting, which allows us to formulate and characterise the smoothing effects of GQMSs in terms of algebraic conditions involving the drift and quantum diffusion matrices. These conditions establish a connection with the controllability theory of quantum linear systems and with the structure of decoherence-free subsystems. We then characterise irreducibility through several equivalent algebraic criteria: one formulated in terms of the drift and quantum diffusion matrices, one in terms of the operators appearing in the generalised GKLS representation of the generator, and a third given by a quantum analogue of Hörmander's condition. A central and somewhat surprising consequence is that, in contrast with the classical case, irreducibility is strictly stronger than conditions ensuring regularisation. Our results provide an algebraic framework for analysing these properties and lay the groundwork for a broader study of reducible Gaussian quantum Markov semigroups and, more generally, more general relevant quantum Markov semigroups on continuous-variable systems.", "url": "https://arxiv.org/abs/2609.01547", "type": "理论", "summary": "1. 该工作针对作用于连续变量系统的高斯量子马尔可夫半群，系统研究了其正则化与不可约性。\n2. 其核心在于用漂移与量子扩散矩阵的代数条件刻画平滑效应，并以广义GKLS算子及量子Hörmander条件给出不可约性的等价判据，揭示不可约性严格强于正则化条件这一反直觉结论。\n3. 这为分析可约高斯量子马尔可夫半群乃至更广的连续变量量子马尔可夫半群提供了统一代数框架和后续研究基础。", "summary_source": "deepseek", "authors": [{"name": "Franco Fagnola"}, {"name": "Federico Girotti"}], "featured_authors": [{"name": "Franco Fagnola"}, {"name": "Federico Girotti"}], "author_count": 2}, {"id": "2609.01605", "category": "quant-ph", "title": "Depth-1 expanders on the unitary group and applications", "abstract": "We construct a constant-degree and constant-gap quantum expander on $n$ qubits where each unitary can be implemented by a depth-$1$ and 1D circuit of Pauli or CNOT gates. We provide two applications of this expander. First, we use it to construct a family of frustration-free 1D Hamiltonians whose ground states obey the entanglement-gap relation $S = \\Theta(\\Delta^{-1/2})$; this is believed to be optimal, but achieving it had been open. Second, we use it to provide a streaming protocol that tests for closeness to a class of 1D volume-law entangled states. Moreover, we extend our quantum expander to a constant-degree and constant-gap expander on the unitary group where each unitary is a single $T$ gate, a single $T^{\\dagger}$ gate, or a depth-$1$ Clifford circuit. This implies that a random sequence of unitaries from the expander yields a gapped walk on a dense subgroup of the unitary group. This improves upon previous work by Bourgain and Gamburd which did not control the dependence of the gap on the dimension.", "url": "https://arxiv.org/abs/2609.01605", "type": "理论", "summary": "1. 该工作构造了 n 比特上常度且常隙的量子扩展器，其中每个幺正元可由深度为 1 的一维 Pauli/CNOT 线路实现，并据此给出两个应用。\n2. 其物理卖点在于构造无阻挫一维哈密顿量，使基态纠缠熵满足 S=Θ(Δ^{-1/2})，同时设计出用于判定一维体积律纠缠态的流式协议。\n3. 推广到 T/T† 与深度-1 Clifford 门后，扩展器在酉群稠密子群上诱导出谱隙不依赖 n 的随机行走，为量子扩展器应用及维度无关谱隙研究提供了方向。", "summary_source": "deepseek", "authors": [{"name": "Anurag Anshu"}, {"name": "Shankar Balasubramanian"}, {"name": "Jonas Haferkamp"}, {"name": "Aram W. Harrow"}, {"name": "Xinyu Tan"}], "featured_authors": [{"name": "Anurag Anshu"}, {"name": "Shankar Balasubramanian"}, {"name": "Jonas Haferkamp"}, {"name": "Aram W. Harrow"}, {"name": "Xinyu Tan"}], "author_count": 5}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
