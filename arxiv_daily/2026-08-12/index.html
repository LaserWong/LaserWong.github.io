authors": [{"name": "ChunJun Cao"}, {"name": "Gong Cheng"}, {"name": "Alexander Jahn"}, {"name": "Thomas Koutsikos"}], "featured_authors": [{"name": "ChunJun Cao"}, {"name": "Gong Cheng"}, {"name": "Alexander Jahn"}, {"name": "Thomas Koutsikos"}], "author_count": 4}, {"id": "2608.10133", "category": "hep-th", "title": "Towards a Proof of Mass Gap in 3d Yang-Mills Theory", "abstract": "We give the outlines of a proof for the existence of a mass gap for the 3d Yang-Mills theory in terms of an inequality on the eigenvalues of the Laplacian on the gauge-invariant configuration space.", "url": "https://arxiv.org/abs/2608.10133", "type": "理论", "summary": "1. 该工作给出了三维杨-米尔斯理论存在质量间隙的证明纲要，将其归结为规范不变构型空间上拉普拉斯算子特征值的不等式。\n2. 其主要技术卖点是建立该特征值不等式与物理质量间隙之间的严格联系，从而绕开路径积分中久未解决的数学困难。\n3. 该思路为三维杨-米尔斯质量间隙问题的严格化提供了可能路径，并有望启发四维情形及一般规范理论的后续研究。", "summary_source": "deepseek", "authors": [{"name": "V.P. Nair"}], "featured_authors": [{"name": "V.P. Nair"}], "author_count": 1}, {"id": "2608.10348", "category": "hep-th", "title": "Holographic Complexity as a Probe of Boundary Entropy in AdS/BCFT", "abstract": "This work establishes a formal bridge between the organizational principles of TQFTs and the AdS/BCFT correspondence, interpreting end of the world EOW branes as physical interfaces carrying boundary-state data. By developing a dictionary that maps cobordism composition to holographic sewing, we show that the Euclidean action and the Ryu and Takayanagi prescription consistently isolate the universal boundary entropy (log g). Applying the Complexity-Action proposal, we demonstrate that a relative renormalization prescription extracts this same universal contribution from the Wheeler and DeWitt action. Finally, we extend the analysis to BTZ black holes, where the late-time complexity growth is shown to encode both the thermal interior dynamics and the universal information of the boundary conditions via the brane tension.", "url": "https://arxiv.org/abs/2608.10348", "type": "理论", "summary": "1. 该工作在 AdS/BCFT 框架下建立 TQFT 组合原则与全息缝合的对应词典，将 EOW 膜解释为携带边界态数据的物理界面，并用复杂度作为边界熵的探针。\n2. 其核心在于提出相对重正化方案，使 Complexity-Action 提议从 Wheeler-DeWitt 作用中提取与 Euclidean 作用和 Ryu-Takayanagi 公式一致的普适边界熵 log g，并推广至 BTZ 黑洞。\n3. 这为通过全息复杂度读取边界条件与热内部动力学的普适信息提供了可行途径，也启发对量子纠缠与时空几何联系的新探索。", "summary_source": "deepseek", "authors": [{"name": "Fabiano F. Santos"}], "featured_authors": [{"name": "Fabiano F. Santos"}], "author_count": 1}, {"id": "2608.10667", "category": "hep-th", "title": "Tachyon couplings from S-matrix elements in bosonic string theory", "abstract": "We introduce a systematic framework for constructing spacetime and D-brane effective actions in bosonic string theory, encompassing both tachyon and massless modes. The actions are required to be gauge invariant and compatible with the expansion of sphere- and disk-level S-matrix elements. Our central proposal stipulates that, for each closed- or open-string channel, S-matrix poles involving an odd number of tachyons must be reproduced via an expansion in the effective action, whereas those with an even number of tachyons must be matched exactly. This criterion imposes strong selection rules: the bulk action contains only even powers of closed-string tachyon fields, and the D-brane action only even powers of open-string tachyon fields. In contrast, couplings of closed-string tachyons to D-branes are less constrained and allow both even and odd field multiplicities. As a concrete application, we analyze the disk-level amplitude involving two closed-string tachyons and demonstrate that the resulting linear and quadratic tachyon-D-brane interactions coincide precisely with those of type 0 theory. This is consistent with the duality between the orbifold of type 0 theory and the compactification of bosonic string theory on \\(T^{16}\\).", "url": "https://arxiv.org/abs/2608.10667", "type": "理论", "summary": "1. 该工作提出了从球面和圆盘级S矩阵元系统构造玻色弦理论含快子与无质量模的规范不变有效作用量框架。\n2. 其核心判据要求奇数个快子的极点由作用量展开复现、偶数个快子精确匹配，从而强制体作用量仅含闭弦快子偶次幂、D膜作用量仅含开弦快子偶次幂。\n3. 对两个闭弦快子的圆盘振幅计算得到与0型理论一致的一次和二次快子-D膜耦合，支持0型orbifold与T^16紧化玻色弦的对偶，并为后续弦对偶研究提供启示。", "summary_source": "deepseek", "authors": [{"name": "Mohammad R. Garousi"}], "featured_authors": [{"name": "Mohammad R. Garousi"}], "author_count": 1}, {"id": "2608.10833", "category": "hep-th", "title": "False vacuum decay around black holes: calculation from first principles in the (3+1)-dimensional case", "abstract": "In $(3+1)$ spacetime dimensions, we numerically calculate the suppression exponent of the false vacuum decay probability in the presence of a thermal bath and a black hole.", "url": "https://arxiv.org/abs/2608.10833", "type": "理论", "summary": "1. 该工作针对(3+1)维时空中存在热浴和黑洞的情形，从第一性原理出发，通过数值求解完整反弹解得到假真空衰变概率的抑制指数。\n2. 其核心卖点在于不再依赖薄壁近似或降维简化，而是直接计算包含黑洞背景与有限温度效应的完整作用量，从而得到自洽的衰变抑制指数。\n3. 这为理解早期宇宙中黑洞周围的真空不稳定性来源，以及引力与热涨落对真空衰变过程的增强或抑制机制提供了可检验的定量参考依据。", "summary_source": "deepseek", "authors": [{"name": "Ratmir Gazizov"}, {"name": "Dmitry Gorbunov"}, {"name": "Dmitry Levkov"}], "featured_authors": [{"name": "Ratmir Gazizov"}, {"name": "Dmitry Gorbunov"}, {"name": "Dmitry Levkov"}], "author_count": 3}, {"id": "2608.10840", "category": "hep-th", "title": "Monodromy defects in ABJM theory and integrability", "abstract": "We establish that supersymmetric monodromy defects in ABJM theory, also known as vortex loops, define integrable boundary states of the underlying alternating SU(4) spin chain. Exploiting the KT relation within the framework of the algebraic Bethe ansatz, we derive a closed-form expression for the leading-order one-point functions of non- protected operators in the presence of these defects. As a special case, our result reproduces the spin-chain overlap governing the three-point functions of two maximal giant gravitons and a single tiny graviton. We furthermore investigate the quantization of the theory in the defect background and compute the first quantum correction to the one-point functions in the simplest setting. Finally, we discuss possible extensions of our overlap formula.", "url": "https://arxiv.org/abs/2608.10840", "type": "理论", "summary": "1. 该论文研究ABJM理论中的超对称单值缺陷（涡旋圈），证明它们定义了交替SU(4)自旋链的可积边界态。\n2. 其核心技术是利用代数Bethe ansatz中的KT关系，推导出缺陷背景下非保护算子领头阶单点函数的闭式表达式，并证明特例可复现两个最大巨引力子与一个微小引力子三点函数的自旋链交叠。\n3. 文中还给出最简单设置下首阶量子修正的计算，并讨论交叠公式的可能推广，为缺陷背景量子化及可积边界态的应用提供了进一步基础。", "summary_source": "deepseek", "authors": [{"name": "Charlotte Kristjansen"}, {"name": "Andrey Shusharin"}], "featured_authors": [{"name": "Charlotte Kristjansen"}, {"name": "Andrey Shusharin"}], "author_count": 2}, {"id": "2608.10861", "category": "hep-th", "title": "Anomalous symmetries in Kähler geometry", "abstract": "We initiate a study of centrally extended ($\\textit{anomalous}$) symmetries in Kähler geometry, focusing on the simplest, and most ubiquitous, Abelian case. In particular, we provide a local description of the geometry admitting such isometries. A long-standing no-go theorem asserts that there is an obstruction to gauging such symmetries in the purely Kähler framework. Utilizing the language of sypersymmetry, we then show that these symmetries may be gauged within the setup of generalized Kähler geometry. Our results may be applied to quotients, T-dualities, etc.", "url": "https://arxiv.org/abs/2608.10861", "type": "理论", "summary": "1. 该工作系统研究了Kähler几何中由中心扩张产生的反常阿贝尔等度规对称性，并给出了其局域几何描述。\n2. 其要点是利用超对称语言证明，纯Kähler框架中阻碍此类对称性规范化的no-go定理可在广义Kähler几何中被绕过，从而实现可规范化。\n3. 这为商空间构造、T-对偶等几何操作提供了直接应用，并为反常对称性的几何研究开辟了新的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Dmitri Bykov"}, {"name": "Andrew Kuzovchikov"}], "featured_authors": [{"name": "Dmitri Bykov"}, {"name": "Andrew Kuzovchikov"}], "author_count": 2}, {"id": "2608.10871", "category": "hep-th", "title": "Gravitational Faraday rotation, gravitational spin Hall effect, and spin-refined causality analysis from Magnusian matrix in effective field theories of gravity", "abstract": "The effects of black hole's spin in effective field theories (EFTs) of gravity are explored through observables of wave scattering on black hole backgrounds in the geometric optics approximation. The considered observables are polarisation rotation angle, wavenumber kick (or deflection angle), and (Shapiro/Wigner--Smith) time delay, each of which are related to gravitational Faraday rotation, gravitational spin Hall effect, and infrared causality. The observables are computed from scattering amplitudes through the Magnusian formalism, where the Magnusian is promoted to a matrix to account for helicity information. It is found that (1) the gravitational spin Hall effect in EFTs of gravity are qualitatively different from that of general relativity due to \"noncommutative\" wavenumber kicks, and (2) black hole's spin slightly enhances the causality constraints on EFT coefficients.", "url": "https://arxiv.org/abs/2608.10871", "type": "理论", "summary": "1. 该工作利用 Magnusian 矩阵与几何光学近似，从引力有效场论中的黑洞背景散射振幅计算了偏振旋转、波数偏折及 Shapiro/Wigner-Smith 时间延迟等可观测量。\n2. 其技术要点在于将 Magnusian 提升为含螺旋度信息的矩阵，发现有效场论中的引力自旋霍尔效应因“非对易”波数踢而与广义相对论定性不同。\n3. 这表明黑洞自旋会略微增强对有效场论系数的红外因果约束，为引力 EFT 的自旋相关一致性检验提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Kibok Jeong"}, {"name": "Jung-Wook Kim"}, {"name": "Soochang Lee"}], "featured_authors": [{"name": "Kibok Jeong"}, {"name": "Jung-Wook Kim"}, {"name": "Soochang Lee"}], "author_count": 3}, {"id": "2608.10925", "category": "hep-th", "title": "A fermion primer", "abstract": "This is a review paper intended to illustrate a few critical issues concerning Dirac, Weyl and Majorana fermions and their differences. The first part consists in basic introductions to fermions, and more in detail to fermions in 4d, focusing in particular in what differentiate the three type of fermions: chirality, helicity, mass, field equations, properties under discrete symmetry transformations, Actions, Observables. On this basis we tackle a series of challenging and sometime controversial problems: the non-existence of Weyl fermion propagators, and the ways to circumvent it; the regularizations for Weyl fermion amplitudes, in particular the appropriateness of using the PV regularization; the definition of a functional integral for Weyl fermion, the difference between Weyl and massless Majorana fermions and the difference between the Dirac and Majorana mass terms. Most notably we come to the conclusion that the trick of replacing the non-existing Weyl fermion propagator with a massless Dirac one, although it may yield in some cases correct results, is flawed at the very origin by a logical loophole. We then show which is the correct way to proceed in this case. We consider also the topic of applying the Wick rotation at the classical Action level for Weyl fermions and conclude that this procedure leads to a nonequivalent theory. Finally, although anomalies are not the central focus here, we have deemed it useful to summarily review the relation, and its cohomological basis, that exists between the lack of a Weyl fermion propagator (non-invertibility of the Weyl-Dirac operator) and the appearance of dangerous anomalies in the theory.", "url": "https://arxiv.org/abs/2608.10925", "type": "理论", "summary": "1. 该综述系统梳理狄拉克、外尔与马约拉纳费米子在手性、螺旋度、质量项、分立对称性及作用量与可观测量上的本质区别，并据此剖析若干争议问题。\n2. 其核心论点在于指出用无质量狄拉克传播子替代不存在的Weyl费米子传播子的常见做法存在逻辑漏洞，并给出正确处理途径，同时论证Weyl经典作用量的Wick转动会导致不等价理论。\n3. 这一澄清对Weyl费米子泛函积分、正规化以及反常与Weyl-狄拉克算子不可逆性之间关系的后续研究具有直接指导意义。", "summary_source": "deepseek", "authors": [{"name": "Loriano Bonora"}, {"name": "Roberto Soldati"}], "featured_authors": [{"name": "Loriano Bonora"}, {"name": "Roberto Soldati"}], "author_count": 2}, {"id": "2608.10982", "category": "hep-th", "title": "Vortices of the Hitchin Equations", "abstract": "The vortices that appear in Hitchin's pioneering study of Higgs bundles are interpreted as a new version of the abelian Higgs vortices more familiar to theoretical physicists. Their conformal covariance is made explicit.", "url": "https://arxiv.org/abs/2608.10982", "type": "理论", "summary": "1. 该工作将希钦在希格斯丛研究中出现的涡旋解重新诠释为理论物理中熟悉的阿贝尔希格斯涡旋的新版本，建立了希格斯丛几何与规范场论涡旋方程之间的直接对应。\n2. 其技术卖点在于显式证明这些涡旋满足共形协变性，即不同共形标度或度规下的解可相互联系，且涡旋方程在共形变换下保持不变。\n3. 这为运用物理涡旋方法研究希格斯丛模空间的几何与拓扑、以及相关可积系统的结构提供了新的直觉和可行途径，有望促进两领域的交叉。", "summary_source": "deepseek", "authors": [{"name": "Nicholas S. Manton"}], "featured_authors": [{"name": "Nicholas S. Manton"}], "author_count": 1}, {"id": "2608.11086", "category": "hep-th", "title": "Distance-Higuchi Bounds on Inflationary Field Ranges and Lifetimes", "abstract": "We show that quasi-de Sitter inflation driven by a nearly flat scalar potential has a finite polynomial lifespan dictated by the interplay between the swampland Distance Conjecture and the generalized Higuchi bound. By analyzing classical scalar rolling and quantum stochastic diffusion, we demonstrate that for any arbitrarily high but fixed statistical confidence, a universe cannot live longer than $\\sim \\min\\left\\{\\ln(\\frac{1}{H})\\frac{\\sqrt V}{V'},V^{-\\frac{d-1}{2}}\\ln^2(\\frac{1}{H})\\right\\}$ in reduced Planck units while remaining Higuchi-consistent, where $H$ is the Hubble parameter, $V$ is the scalar potential, $d$ is the number of spacetime dimensions, and prime denotes derivative with respect to the scalar field. This bound despite being weaker than the Trans-Planckian Censorship Conjecture, which has been argued for classical cosmologies that flow to the asymptotic of the field space without tunneling, is powerful given its minimal quantum gravity input and applicability to all points in the moduli space.", "url": "https://arxiv.org/abs/2608.11086", "type": "理论", "summary": "1. 该工作从距离猜想与推广Higuchi约束的相互作用出发，导出准德西特暴涨在近平坦标量势下具有有限多项式寿命的普适上界。\n2. 技术上结合经典慢滚与量子随机扩散，证明对任意固定置信度，满足Higuchi一致性的宇宙寿命不超过min{ln(1/H)√V/V', V^{-(d-1)/2}ln²(1/H)}（约化普朗克单位）。\n3. 该界限虽弱于穿越普朗克审查猜想，但其最小量子引力输入及对模空间全域的适用性，为暴涨场程与寿命约束提供了更具稳健性的沼泽地判据。", "summary_source": "deepseek", "authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Ignatios Antoniadis"}, {"name": "Alek Bedroya"}], "featured_authors": [{"name": "Luis A. Anchordoqui"}, {"name": "Ignatios Antoniadis"}, {"name": "Alek Bedroya"}], "author_count": 3}, {"id": "2608.11129", "category": "hep-th", "title": "Moment of Inertia of an Interacting Bose Gas", "abstract": "The response of many-body quantum systems to rotation can be characterized by the moment of inertia. For a classical gas, the moment of inertia can be expressed as the integral of the enthalpy density multiplied by the squared radial distance from the rotation axis. In quantum field theory, the finite rotation in the grand canonical ensemble demands the causality bound. This constraint imposes technical challenges in treating transverse momenta discretized with the Bessel function zeros. However, we define the moment of inertia in the limit of zero angular velocity, in which the causality constraint is irrelevant and ordinary quantum field theoretical techniques can be applied. We evaluate the moment of inertia in the $\\phi^4$ theory and find that, surprisingly, the interacting effects including the ring-diagram resummation are consistent with the classical expectation and the moment of inertia density remains proportional to the enthalpy density.", "url": "https://arxiv.org/abs/2608.11129", "type": "理论", "summary": "1. 该工作针对相互作用玻色气体，在零角速度极限下定义转动惯量，从而避开有限转动巨正则系综中因果性界对贝塞尔函数零点离散横向动量的技术困难，并在此框架内计算其量子场论值。\n2. 技术卖点在于采用普通量子场论技术处理phi^4理论并包含环图重求和，发现相互作用效应不改变转动惯量密度与焓密度之间的正比关系，与经典流体图像定量一致。\n3. 这为在因果性约束下研究旋转量子多体系统提供了一种可行的零角速度替代途径，并提示转动惯量的普适热力学关系可能超越弱耦合微扰论成立。", "summary_source": "deepseek", "authors": [{"name": "Aleksandar Gecic"}, {"name": "Victor E. Ambrus"}, {"name": "Kenji Fukushima"}], "featured_authors": [{"name": "Aleksandar Gecic"}, {"name": "Victor E. Ambrus"}, {"name": "Kenji Fukushima"}], "author_count": 3}, {"id": "2608.10685", "category": "math-ph", "title": "Reflection Positivity in Free Fermionic Theories", "abstract": "Reflection positivity is one of the Osterwalder--Schrader axioms for Euclidean quantum field theory, ensuring that the reconstructed relativistic Hilbert space carries a positive-definite inner product. For free fermionic theories whose covariance is a real rational function of the Dirac operator, we prove that reflection positivity holds if and only if all poles are real, simple, and carry non-negative residues. We also explicitly show the failure of reflection positivity for covariances with exponential regulators.", "url": "https://arxiv.org/abs/2608.10685", "type": "理论", "summary": "1. 该工作考虑以狄拉克算子实有理函数为协方差的自由费米子欧几里得理论，系统刻画反射正性成立的条件。\n2. 核心结论是反射正性等价于协方差的所有极点均为实数、单重且具有非负留数；指数型正规化协方差则不满足反射正性，说明其无法定义正定内积的物理希尔伯特空间。\n3. 这一判据将反射正性归结为费米子协方差在复平面上的解析性质，为构造满足Osterwalder–Schrader公理的自由费米子模型及筛选合法正规化方案提供了直接依据。", "summary_source": "deepseek", "authors": [{"name": "Carl Handrack"}, {"name": "Manfred Salmhofer"}], "featured_authors": [{"name": "Carl Handrack"}, {"name": "Manfred Salmhofer"}], "author_count": 2}, {"id": "2608.10797", "category": "math-ph", "title": "Emergence of fractal structures from breather interactions in the $(2+1)$-dimensional Konopelchenko--Dubrovsky equation", "abstract": "Fractal structures generated through nonlinear breather interactions are investigated for the $(2+1)$-dimensional Konopelchenko--Dubrovsky (KD) equation by means of the Hirota bilinear method. The bilinear form of the system is first derived, after which breather interaction solutions are constructed analytically through suitable auxiliary functions. It is shown that the interaction of breather waves in the coupled nonlinear environment gives rise to highly intricate multiscale patterns exhibiting self-similar behaviour under successive magnification. To characterize the geometric complexity of the obtained structures, a three-dimensional voxel-based box-counting method is employed. The computed dimensions are found to be non-integer, confirming the fractal nature of the generated patterns. In addition, relative error analysis, standard error estimation, bootstrap standard deviation and convergence analysis are performed to examine the robustness and reproducibility of the estimated dimensions. The present work suggests that nonlinear breather interactions in coupled dispersive systems may provide a natural mechanism for the emergence of fractal geometries and complex multiscale structures. The combined analytical and quantitative framework developed here may provide further insight into nonlinear energy localization and scale-dependent structures arising in fluid dynamics, plasma physics and nonlinear wave propagation.", "url": "https://arxiv.org/abs/2608.10797", "type": "理论", "summary": "1. 该工作借助Hirota双线性方法构造(2+1)维Konopelchenko-Dubrovsky方程的呼吸子相互作用解，并用三维体素盒计数法考察其生成的分形结构。\n2. 其核心在于结合解析呼吸子解与三维盒计数维数估计，用非整数维数确认自相似多尺度图案的分形本质，并借助相对误差、标准误差、bootstrap与收敛性分析验证其稳健性。\n3. 该结果提示耦合色散体系中的呼吸子相互作用可作为分形几何涌现的自然机制，并为流体动力学、等离子体物理及非线性波传播中的能量局域化和尺度相关结构研究提供借鉴。", "summary_source": "deepseek", "authors": [{"name": "Snehalata Nasipuri"}, {"name": "Prasanta Chatterjee"}, {"name": "Saugata Dutta"}], "featured_authors": [{"name": "Snehalata Nasipuri"}, {"name": "Prasanta Chatterjee"}, {"name": "Saugata Dutta"}], "author_count": 3}, {"id": "2608.11106", "category": "math-ph", "title": "The Renormalization Group as a Stochastic Exploration Process", "abstract": "The Renormalization Group (RG) is a powerful and versatile framework for analyzing complex physical systems. Here, we reinterpret it as a stochastic process that explores physical phase spaces, scale by scale, progressively revealing finer details of small-scale structures. This perspective establishes a natural connection to other random exploration processes, such as the Schramm-Loewner evolution, and is more suited for a probabilist audience. It links RG concepts such as RG transformations, effective actions, etc, to usual probabilistic tools such as conditional expectation values, martingales, etc, but also makes contact with stochastic quantization.", "url": "https://arxiv.org/abs/2608.11106", "type": "理论", "summary": "1. 该工作将重正化群重新诠释为一种随机探索过程：系统在相空间中随着尺度由大到小的变换逐级演化，并不断揭示更精细的小尺度结构。\n2. 其核心卖点在于把重正化群变换、有效作用等标准概念对应到条件期望、鞅等概率论工具，并由此与Schramm-Loewner演化及随机量子化建立联系。\n3. 这一概率论化表述为吸引更广泛的数学物理听众提供了自然入口，也为借助随机几何和随机量子化方法重新处理尺度演化问题带来了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Denis Bernard"}], "featured_authors": [{"name": "Denis Bernard"}], "author_count": 1}, {"id": "2608.11128", "category": "math-ph", "title": "Nonlinear systems of PDEs admitting infinite-dimensional Lie algebras and their connection with Ricci flows. II: The two-dimensional space case", "abstract": "The work is a natural continuation of that published in Stud Appl Math. 2024; 153:e12737. All possible two-components evolutions systems of (1+2)-dimensional second-order PDEs admitting an infinite-dimensional Lie algebra are constructed. It is shown that a natural generalisation of this Lie algebra to the higher-dimensional case does not lead to a more general result because the infinite-dimensional symmetry is broken. The recently derived system, which is related to Ricci flows, is identified as a very particular case among the evolution systems obtained. All possible stationary solutions of this system in the radially symmetric case are constructed using the surprisingly rich Lie algebra of the reduced system of ODEs. Moreover, it is proved that this Lie algebra is reducible to the fifteen-dimensional algebra of the simplest system of two second-order ODEs. Several time-dependent exact solutions in the radially symmetric case are constructed as well. It is shown that the solutions obtained are bounded and smooth provided arbitrary parameters are correctly specified.", "url": "https://arxiv.org/abs/2608.11128", "type": "理论", "summary": "1. 该文延续前期工作，完整构造了所有允许无限维李代数的(1+2)维二阶双分量发展方程组，并指出其向高维推广时无限维对称性会发生破缺。\n2. 其核心在于证明与Ricci流相关的方程组仅是所得分类中的特例，并借助约化常微分方程组异常丰富的李代数（可约化为十五维代数）构造了径向对称稳态与含时精确解。\n3. 这为非线性PDE的对称分类、高维推广局限以及几何流背景下有界光滑解的构造提供了明确的示范与后续研究基础。", "summary_source": "deepseek", "authors": [{"name": "Roman Cherniha"}, {"name": "John R. King"}], "featured_authors": [{"name": "Roman Cherniha"}, {"name": "John R. King"}], "author_count": 2}, {"id": "2608.10013", "category": "quant-ph", "title": "RF-Budgeted Frame Compilation for Frequency-Multiplexed Superconducting-Qubit Control Using Qubit-Control Identity Records and a Circuit-Informed RFSoC Model", "abstract": "Frequency-multiplexed superconducting-qubit control requires more than carrier assignment: the RF budget of a shared source can perturb multi-qubit rotations through finite bandwidth, crest factor, clipping, quantization, jitter, spurs, compression, crosstalk, and leakage. We present an RF-budgeted frame-compilation and validation workflow that combines qubit-control identity (QID) records, a MATLAB/Simulink-based circuit-informed RFSoC source-chain model, QuTiP qutrit dynamics, and Qiskit-derived algorithm workloads. QID records encode qubit-specific computational and leakage transition frequencies, pulse parameters, and drive-scale calibration, while the RF-chain profile and effective crosstalk-coupling matrix are provided as separate compiler inputs. Candidate multitone RF frames are scheduled under RF-budget constraints, propagated through the RFSoC model, decoded into computational and leakage transition frames, and evaluated in QuTiP for rotation error, leakage-aware fidelity, computational-subspace survival, and transient leakage. The studies progress from single-qutrit pulse closure to pairwise coexistence, multitone RF-frame capacity, and Bernstein-Vazirani (BV) and QAOA microwave layers extracted from Qiskit circuits. The simulations show that longer pulses improve per-frame aggregation but do not necessarily minimize time-normalized layer cost; clustered frequency maps, larger rotations, and multitone leakage stacking tighten closure. Under the nominal RF budget, a Qiskit-derived 12-qubit BV -Y90 layer closes in three validated four-tone frames at 240 ns, while QAOA mixer partitions vary with rotation angle and pulse duration. All reported results are model-based, decoherence-free simulation diagnostics rather than measured hardware fidelities or wiring-reduction claims.", "url": "https://arxiv.org/abs/2608.10013", "type": "理论+数值", "summary": "1. 该工作提出射频预算约束的帧编译与验证工作流，用于频分复用超导量子比特控制，联合了QID记录、电路级RFSoC源链模型、QuTiP qutrit动力学和Qiskit算法负载。\n2. 其核心在于将共享源链路的有限带宽、削波、量化、抖动、压缩与串扰等效应纳入多音帧调度，逐帧核算旋转误差、漏能保真度和暂态漏能以驱动候选帧生成。\n3. 全部结果为无退相干、基于模型的仿真诊断，可为帧聚合时长的权衡与频点聚类策略提供定量参考，但向硬件推广仍需实测校准佐证。", "summary_source": "deepseek", "authors": [{"name": "Mingqi Ge"}, {"name": "Anne-Marie Valente-Feliciano"}], "featured_authors": [{"name": "Mingqi Ge"}, {"name": "Anne-Marie Valente-Feliciano"}], "author_count": 2}, {"id": "2608.10019", "category": "quant-ph", "title": "Local Complex Dependence and Separability in Madelung Hydrodynamics", "abstract": "For a many-particle pure state in a fixed position representation, we consider the mixed cross-particle derivatives of the logarithm of the wave function. Their real part is one half of the Holland-Wang local dependence function of the configuration density, while their imaginary part is the cross-Jacobian of the Madelung velocity field. On a node-free product region, vanishing of all cross blocks throughout the region is equivalent to local multiplicative separability. Under Schrodinger evolution with a real scalar potential, the initial growth of a cross block from a separable state is sourced by the corresponding mixed Hessian of the potential and is purely imaginary to first order in time. The construction is a local separability and dependence diagnostic, rather than a basis-independent entanglement measure.", "url": "https://arxiv.org/abs/2608.10019", "type": "理论", "summary": "1. 该工作针对固定位置表象下的多粒子纯态，研究波函数对数的粒子间混合交叉导数，指出其实部为Holland-Wang局域依赖函数的一半，虚部为Madelung速度场的交叉雅可比。\n2. 作者证明在无节点乘积区域上全部交叉块为零等价于局域乘法可分离性，并发现薛定谔演化下可分离态交叉块的首阶增长由势场的混合Hessian决定，且为纯虚数。\n3. 该局域可分离性与依赖性诊断虽然不构成基无关的纠缠度量，但可为量子流体动力学中势能梯度诱导的局域关联建立可检验的动力学判据。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo Pirovano"}], "featured_authors": [{"name": "Lorenzo Pirovano"}], "author_count": 1}, {"id": "2608.10069", "category": "quant-ph", "title": "Coupled-Layer Codes: Beyond Quantum Product Constructions", "abstract": "Product codes are an important class of quantum error-correcting codes constructed from multiple input codes, which can give rise to asymptotically good quantum low-density parity check codes. In previous work, we showed how the product between two codes can be physically implemented by coupling layers of the first code using checks of the second code. In this work, we further unify product code constructions with coupled-layer constructions of phases of matter by introducing coupled-layer codes. The essential strategy is to condense general excitations created by Pauli operators among multiple decoupled layers of the first code. The condensation is specified by an excitation algebra, which encodes the excitations, along with an algebra-preserving map. This coupling between layers generalizes the notion of gauging in physics as well as the mapping cone in homological algebra, and can be used to produce non-CSS codes. As examples, we show how coupled-layer codes reproduce the X-cube and Chamon models. We further generalize the balanced product code by allowing a unitary transformation in addition to a group action by free permutation and describe its corresponding coupled-layer construction. In particular, we show how balancing by a ZX-duality can reproduce non-CSS codes such as the fermionic toric code and the 3-fermion Walker-Wang model in 3D.", "url": "https://arxiv.org/abs/2608.10069", "type": "理论", "summary": "1. 该工作提出耦合层码构造，将量子乘积码与层状物态统一起来，通过多个解耦第一码层中Pauli激发的凝聚实现非CSS码。\n2. 核心手段是用激发代数及其保代数映射刻画层间耦合，推广了物理中的规范化与同调代数中的映射锥，并引入含酉变换的平衡乘积码。\n3. 该框架不仅能复现X立方与Chamon模型，还可借ZX对偶平衡导出费米子环面码及三维三费米子Walker-Wang模型，为量子纠错与拓扑相提供统一设计。", "summary_source": "deepseek", "authors": [{"name": "Shuyu Zhang"}, {"name": "Tzu-Chieh Wei"}, {"name": "Nathanan Tantivasadakarn"}], "featured_authors": [{"name": "Shuyu Zhang"}, {"name": "Tzu-Chieh Wei"}, {"name": "Nathanan Tantivasadakarn"}], "author_count": 3}, {"id": "2608.10075", "category": "quant-ph", "title": "Phase diagram of lasing under correlated pump from GPU-accelerated Truncated Wigner dynamics", "abstract": "Superradiant (SR) lasers store optical coherence in the atomic medium rather than the cavity field, but the incoherent drive that sustains inversion imposes a trade-off: local pumping yields coherent light at a rate that grows linearly with the atom number $N$, heating the medium through photon recoil, whereas fully collective pumping removes this scaling but limits the emission to partial coherence. We interpolate between these limits employing a spatially correlated pump on a chain of $N$ two-level atoms, with rates decaying with distance between atoms as a power law of exponent $\\alpha$. To study systems beyond the reach of exact solutions, we employ the Truncated Wigner Approximation (TWA), whose independent trajectories are ideally suited to GPU parallelism. Harnessing this, we perform a full scan of the steady-state observables for up to $10^4$ atoms at a computational cost that is practical. Our findings indicate that ultra-narrow emission persists for all $\\alpha$, while the coherence improves as the pump becomes shorter ranged, with $g^{(2)} \\to 1$ surviving at least down to $\\alpha \\approx 1$, indicating that fully coherent light thus does not require local pumping. The drive strength needed for lasing is reduced by a factor $N^{1-\\alpha}$ for $\\alpha < 1$, and by $\\log N$ as $\\alpha \\to 1$, parametrically suppressing recoil heating; notably, $\\alpha = 1$ matches the far-field envelope of dissipative couplings in free space. The correlation range of the pump thus acts as a knob trading drive intensity, and the heating it causes, against optical coherence.", "url": "https://arxiv.org/abs/2608.10075", "type": "理论+数值", "summary": "1. 该工作采用GPU加速的截断维格纳近似，研究一维N个两能级原子在幂律空间关联泵浦下的激光稳态，并对N达10^4的体系进行了完整相图扫描。\n2. 主要技术卖点在于揭示泵浦短程化能同时维持超窄线宽与相干性：g^(2)→1至少保持到α≈1，且激光阈值驱动强度对α<1按N^(1-α)减弱、对α→1按logN减弱，从而参数性地抑制反冲加热。\n3. 特别的，α=1与自由空间耗散耦合的远场包络一致，表明泵浦关联长度可作为调节驱动强度、加热与光学相干性权衡的物理旋钮，为超辐射激光设计提供新方向。", "summary_source": "deepseek", "authors": [{"name": "Oksana Chelpanova"}, {"name": "Martino Stefanini"}, {"name": "Michael O'Keeffe"}, {"name": "Jamir Marino"}], "featured_authors": [{"name": "Oksana Chelpanova"}, {"name": "Martino Stefanini"}, {"name": "Michael O'Keeffe"}, {"name": "Jamir Marino"}], "author_count": 4}, {"id": "2608.10078", "category": "quant-ph", "title": "Eliminating photon transport in long-baseline optical interferometry using quantum memories", "abstract": "In this paper, we describe the fundamental operating mechanisms of optical interferometry using quantum memory and entanglement. We show how these remove the optical delay line bottleneck. Quantum memory is not without its own set of challenges, some of which include very small bandwidths as well as limitations in storage time. We examine the influence of timing artifacts on memory photon capture probability and interferometric complex visibility. We highlight keystone areas of technology that require further development and are essential to realizing these opportunities, as well as ongoing work to overcome these challenges.", "url": "https://arxiv.org/abs/2608.10078", "type": "理论", "summary": "1. 该工作从物理原理层面系统阐述了利用量子存储与纠缠实现长基线光学干涉测量的机制，表明通过将光子暂时存储并关联可完全替代传统光程补偿，从而消除光学延迟线这一核心瓶颈。\n2. 其主要进展在于仔细分析定时误差对量子存储器捕获光子概率及干涉复可见度的影响，同时指出当前器件带宽极窄和存储时间不足等限制，并确定这些因素如何决定干涉信号的统计质量。\n3. 这一框架为评估和引导高带宽、长寿命量子存储等关键技术的研发提供了量化判据，也为后续在更长基线和更宽波段开展实际天文观测奠定了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Yousef K. Chahine"}, {"name": "Chaohan Cui"}, {"name": "William DeRocco"}, {"name": "Daniel Gottesman"}, {"name": "Saikat Guha"}, {"name": "Emil T. Khabiboulline"}, {"name": "Zhenning Liu"}, {"name": "Brittany McClinton"}, {"name": "Jayadev Rajagopal"}, {"name": "Fredrik Rantakyro"}, {"name": "J. Gabriel Richardson"}, {"name": "Stephen Ridgway"}, {"name": "Aqil Sajjad"}, {"name": "Joohyung Song"}], "featured_authors": [{"name": "Yousef K. Chahine"}, {"name": "Chaohan Cui"}, {"name": "William DeRocco"}, {"name": "Stephen Ridgway"}, {"name": "Aqil Sajjad"}, {"name": "Joohyung Song"}], "author_count": 14}, {"id": "2608.10087", "category": "quant-ph", "title": "Long-lived memory effects in the defect bath of superconducting qubits", "abstract": "We reveal long-lived memory effects in the defect bath of a superconducting transmon qubit through electric-field tuning of two-level system (TLS) defects coupled to the qubit. Using a fast TLS mapping method we observe several hysteretic effects in the TLS environment with memory timescales of the order of seconds, far beyond the lifetimes of individual TLS defects. The observations can be explained by TLS coupling to electric field-polarised charge fluctuators in the defect bath. Our method enables detailed mapping of the dynamics of the bath's coupled microscopic degrees of freedom and the associated memory effects which can introduce temporally correlated noise. This information may be used to improve qubit-stabilisation and quantum error correction protocols.", "url": "https://arxiv.org/abs/2608.10087", "type": "理论", "summary": "1. 该工作通过电场调谐超导transmon量子比特内的两级系统缺陷，揭示其缺陷浴中的长时记忆效应。\n2. 其技术卖点是快速TLS映射方法测得秒量级滞后记忆，远超单缺陷寿命，并归因于电荷涨落子耦合。\n3. 这为表征缺陷浴微观耦合动力学与时间关联噪声提供手段，可推动量子比特稳定化及量子纠错协议改进。", "summary_source": "deepseek", "authors": [{"name": "Abhishek Agarwal"}, {"name": "Masum Uddin"}, {"name": "Shroya Vaidya"}, {"name": "Lachlan P. Lindoy"}, {"name": "Ehsaneh Daghigh Ahmadi"}, {"name": "Tobias Lindström"}, {"name": "Sebastian E. de Graaf"}, {"name": "Ivan Rungger"}], "featured_authors": [{"name": "Abhishek Agarwal"}, {"name": "Masum Uddin"}, {"name": "Shroya Vaidya"}, {"name": "Tobias Lindström"}, {"name": "Sebastian E. de Graaf"}, {"name": "Ivan Rungger"}], "author_count": 8}, {"id": "2608.10118", "category": "quant-ph", "title": "Bounds for Apparent Second-Law Violations in Quantum Trajectories", "abstract": "Negative stochastic entropy production is commonly called an apparent violation of the second law. In general quantum-trajectory dynamics, however, the physical entropy production $\\sigma$ need not obey a forward detailed fluctuation theorem. A general arbitrary-coupling formulation identifies a dynamical-asymmetry term $\\sigma^\\ast$ that completes it into $\\Omega=\\sigma+\\sigma^\\ast$, whose mean is $\\langle\\Omega\\rangle=\\Sigma+\\Sigma^\\ast$. We prove that the likelihood-ratio sign is optimal among reversal-odd trajectory observables and use this fact to transfer an established sharp fluctuation-theorem floor to the tie-corrected physical sign statistic $\\Pi_\\sigma=\\Pr(\\sigma<0)+\\Pr(\\sigma=0)/2$. When $\\Pr(\\sigma=0)=0$, the result reads $\\Pr(\\sigma<0)\\ge[1-\\langle\\Omega\\rangle/g(\\langle\\Omega\\rangle)]/2$, where $g$ is the inverse of $a\\mapsto a\\tanh(a/2)$. The physical integral fluctuation theorem simultaneously suppresses large negative events, producing a quantitative ``frequent but mild'' law, while the sign imbalance lower-bounds the hidden mean $\\Sigma^\\ast$. We formulate the measured-record protocol explicitly and illustrate and numerically audit the tie-corrected theorem in random finite-coupling collision models and a coherently driven qubit interacting with thermal ancillas.", "url": "https://arxiv.org/abs/2608.10118", "type": "理论+数值", "summary": "1. 该工作针对量子轨迹中负随机熵产生这一表观第二定律违背，证明了任意耦合与一般轨迹动力学下似然比符号的最优性，并建立了绑结修正的符号统计不等式。\n2. 其核心是利用动力学不对称项σ*将物理熵产生补全为Ω，借助最优似然比将sharp涨落定理下限传递到Pr(σ<0)，给出“频繁但温和”违背律并约束隐藏平均Σ*。\n3. 结果在有限耦合碰撞模型和相干驱动量子比特中得到数值验证，为量子热力学中表观第二定律违背的定量刻画与实验检验提供了一般框架。", "summary_source": "deepseek", "authors": [{"name": "Domingos S. P. Salazar"}], "featured_authors": [{"name": "Domingos S. P. Salazar"}], "author_count": 1}, {"id": "2608.10202", "category": "quant-ph", "title": "Unextendible stabiliser bases", "abstract": "We study incomplete sets of orthogonal stabiliser states that cannot be extended by a further stabiliser state orthogonal to all of its members. Such sets are the stabiliser analogue of unextendible product bases (UPBs), and we thus call them unextendible stabiliser bases (USBs). Leveraging the symplectic geometry underlying the $n$-qudit Pauli group in prime local dimension, we explicitly construct USBs for systems of four qubits and three qudits of odd prime local dimension. Moreover, we show that these are the respective minimal qubit, respectively qudit numbers for which such bases exist, and that USBs exist for all $n\\geq4$ qubit and for all $n\\geq3$ odd-prime-dimensional qudit systems. Finally, we compare the resource-theoretic aspects of USBs with those of UPBs. We establish that, analogous to the case of UPBs, the orthogonal complement of every unextendible stabiliser set is a stabiliser-free subspace, and its normalised projector is necessarily magic; moreover, it is bound magic in odd prime dimension, yet need not be for qubits. We also show that USB unextendibility alone imposes no uniform quantitative obstruction to discrimination by stabiliser operations.", "url": "https://arxiv.org/abs/2608.10202", "type": "理论", "summary": "1. 该工作提出不可扩展稳定子基（USB）概念，并借助素数局域维下n-qudit Pauli群的辛几何，显式构造了四量子比特与三个奇数素维qudit系统的USB。\n2. 其核心结果在于证明这些系统分别是存在USB的最小量子比特数与最小qudit数，且所有更大系统亦均存在此类基。\n3. 该工作进一步表明USB的正交补为非稳定子子空间，归一化投影子必然具有魔术性，且在奇数素维下为束缚魔术，这对稳定子资源理论有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Markus Frembs"}], "featured_authors": [{"name": "Markus Frembs"}], "author_count": 1}, {"id": "2608.10334", "category": "quant-ph", "title": "Wave-particle-mixedness redistribution in Schwarzschild spacetime", "abstract": "The redistribution of the wave feature, particle feature, and mixedness is investigated for two-qubit isotropic states in Schwarzschild spacetime under Hawking radiation and environmental decoherence. It is shown that Hawking radiation changes their relative weights among different horizon regions rather than simply suppressing them. The analysis is further extended to phase damping, phase flip, and bit flip channels. Phase damping monotonically suppresses the wave feature and enhances mixedness, phase flip produces a symmetric death-and-revival behavior of the wave feature, and bit flip mainly reshapes the particle feature and mixedness through diagonal population redistribution. However, although Hawking radiation and channel noise affect the distribution of wave feature, particle feature, and mixedness in the subsystems, the triality relation among them still holds and remains unaffected by thermal and environmental noises.", "url": "https://arxiv.org/abs/2608.10334", "type": "理论", "summary": "1. 该工作针对史瓦西时空中的两比特各向同性态，在霍金辐射与三类环境退相干通道共同作用下，考察了波性、粒性与混合度在三体子系统间的再分布规律。\n2. 核心机制在于霍金辐射并非单纯抑制波粒性，而是重新分配不同视界区域间的相对权重；相位阻尼单调压制波性并增强混合度，相位翻转引发波性的对称死亡—复兴，比特翻转则经对角布居重排调整粒性与混合度。\n3. 尽管热与环境的噪声会调制各子系统的特征分布，波—粒—混合度的三元关系始终成立，为弯曲时空量子信息处理及开放系统研究提供稳健的守恒约束与理论参照。", "summary_source": "deepseek", "authors": [{"name": "Sumeng Wang"}, {"name": "Xiaofen Huang"}], "featured_authors": [{"name": "Sumeng Wang"}, {"name": "Xiaofen Huang"}], "author_count": 2}, {"id": "2608.10365", "category": "quant-ph", "title": "Symmetrized Block-Product Periodic Marginals in Infinite Translation-Invariant Quantum Chains", "abstract": "We study local marginals in one-dimensional translation-invariant quantum systems that may hide finite-period structure. Given an $n$-site reduced density matrix, we ask whether it can be obtained by repeating a finite $p$-site block state along the chain and averaging over the $p$ lattice translations. This defines a symmetrized block-product periodic marginal problem, which provides a route both to diagnosing hidden periodic order from local data and to upper bounding ground-state energy densities of infinite translation-invariant local Hamiltonians. We develop two complementary methods. The first is a semidefinite-programming relaxation based on block permutation symmetry and positive partial transpose constraints, which outer-approximates the convex hull of such marginals and yields certified infeasibility tests. The second is a symmetrized matrix product state ansatz, which constructs explicit block-product periodic states and gives variational upper bounds. We benchmark the framework on the Majumdar-Ghosh model, transverse-field Ising, XX, XXZ, and contextuality-related spin models. The results show that the method captures the expected finite-period structure in exactly solvable cases and gives systematically improving variational energies as the period and bond dimension increase. We also formulate a periodic-NPA relaxation for translation-invariant contextuality witnesses and recover the known quantum limits in the tested examples.", "url": "https://arxiv.org/abs/2608.10365", "type": "理论+数值", "summary": "1. 该工作针对无限平移不变一维量子链，提出对称化块乘积周期边际问题，从局域约化密度矩阵判定隐藏的有限周期结构，并上界基态能量密度。\n2. 其技术要点是结合块置换对称与正偏转置约束的半定松弛来外逼近可行凸包并提供不可行性检验，同时用对称化矩阵乘积态给出变分上界，两法互补。\n3. 在Majumdar-Ghosh、横场Ising、XX、XXZ及文脉性自旋模型上的基准显示周期与键维增大时能量系统性改进，并给出文脉性证人的周期NPA限制，为周期序诊断与量子关联优化提供通用框架。", "summary_source": "deepseek", "authors": [{"name": "Xiao Zeng"}, {"name": "Kaiyan Yang"}, {"name": "Lingxia Zhang"}, {"name": "Zizhu Wang"}], "featured_authors": [{"name": "Xiao Zeng"}, {"name": "Kaiyan Yang"}, {"name": "Lingxia Zhang"}, {"name": "Zizhu Wang"}], "author_count": 4}, {"id": "2608.10540", "category": "quant-ph", "title": "State-Dependent Visibility of Non-Commutative Ordering in Quantum Dynamics", "abstract": "A nonzero commutator proves that two orderings differ as operators, but it does not ensure that a physical state can reveal the difference. We ask when non-Abelian ordering information becomes dynamically invisible. For Hermitian operators $B$ and $C$, we compare the evolutions generated by the opposite-order products $M=(B+iC)(B-iC)$ and $\\widetilde M=(B-iC)(B+iC)$, and define their operational visibility from the minimum overlap of the output states over a normalized time window. This visibility bounds the difference produced by the two orderings in every observable on the chosen state. An exact one-qubit solution shows that the same fixed pair can be perfectly invisible in one state and visible in another. We then keep the ordered generators fixed and vary only the many-body ground state across a quantum phase transition. The same ordering difference is nearly invisible in one regime and clearly visible in the other. Moreover, states with identical leading quadratic decay can develop sharply different finite-time visibility because their first distinction appears at higher order. The effect persists across distinct operator pairs and coefficient perturbations. Thus dynamical Abelianization is a property of the state-dependent process, i.e., non-Abelian ordering information can become operationally inaccessible even though the underlying operators remain non-commuting.", "url": "https://arxiv.org/abs/2608.10540", "type": "理论", "summary": "1. 该工作研究量子动力学中由相反次序乘积生成的时间演化，考察非阿贝尔排序信息在具体量子态下何时变得操作上不可见。\n2. 核心卖点是以归一化时间窗口内输出态最小重叠定义操作可见度，用单比特精确解和跨量子相变的多体基态证明同一算符对可在一种状态下完全不可见而在另一种状态下清晰可见。\n3. 这表明动力学阿贝尔化是态依赖过程；即便底层算符保持非对易，排序信息也能在操作上不可达，为多体量子动力学和量子信息处理中的可观测量界限提供启发。", "summary_source": "deepseek", "authors": [{"name": "Ji-Chong Yang"}, {"name": "Gui-Qi Hu"}], "featured_authors": [{"name": "Ji-Chong Yang"}, {"name": "Gui-Qi Hu"}], "author_count": 2}, {"id": "2608.10576", "category": "quant-ph", "title": "Stream Decoding with Confidence Scores at Room and Cryogenic Temperatures", "abstract": "In fault-tolerant quantum computing, fast and accurate decoding is crucial. Snowflake is a decoder for the surface code that runs in a streaming fashion. In this paper, we implement Snowflake on commercial FPGAs and validate them at room and cryogenic temperatures. Our results demonstrate high decoding throughput for small code distances that, when extrapolated, remains within acceptable limits for larger distances. Further, we incorporate the calculation of certain decoder confidence scores with negligible overhead both in terms of latency and physical resource utilisation. We note that implementing a large-scale system would require either a large FPGA beyond today's technology or clusters of FPGAs connected via a high-speed bus. Thus, we discuss an alternative architecture that exploits the locality of Snowflake by processing 2D slices of the 3D decoding window and offloading segments of the 3D structure to a high-speed memory.", "url": "https://arxiv.org/abs/2608.10576", "type": "数值", "summary": "1. 该工作将流式表面码解码器Snowflake实现于商用FPGA平台，并在室温和低温条件下验证了其解码功能与置信度分数的计算。\n2. 其技术卖点在于实现高吞吐解码，且实测数据外推至更大距离仍保持可接受性能，同时置信度计算的延迟与资源开销趋于零，并提出一种利用局部性将三维解码窗口切片并卸载至高速内存的可扩展架构。\n3. 这为面向大规模容错量子计算的低温低延迟解码提供了硬件实现依据，并为后续FPGA集群或专用集成电路方案提供了设计启发。", "summary_source": "deepseek", "authors": [{"name": "Maries Tahaab"}, {"name": "Tim Chan"}, {"name": "James Kirkman"}, {"name": "Simon C. Benjamin"}], "featured_authors": [{"name": "Maries Tahaab"}, {"name": "Tim Chan"}, {"name": "James Kirkman"}, {"name": "Simon C. Benjamin"}], "author_count": 4}, {"id": "2608.10643", "category": "quant-ph", "title": "Zero transfer on mixed graphs", "abstract": "In this paper, we investigate zero transfer on mixed graphs. Zero transfer is a quantum walk phenomenon in which the transition amplitude between two vertices is identically zero for all times, so that no quantum state transfer occurs between them. Using the Hermitian adjacency matrix, we derive necessary and sufficient conditions for zero transfer in mixed graphs. We then specialize these criteria to oriented circulant graphs, obtaining nonexistence results for prime order, structural restrictions for even order, and exhaustive computational classifications for small orders.", "url": "https://arxiv.org/abs/2608.10643", "type": "理论", "summary": "1. 该工作利用Hermitian邻接矩阵刻画混合图上量子游走中的零转移现象，给出两顶点间转移振幅恒为零的充要条件。\n2. 其技术核心是将零转移判据化为可检验的代数条件，并据此对定向循环图证明素数阶不存在性、得到偶数阶结构限制及小阶穷尽分类。\n3. 这为量子通信中禁止态转移的图论设计及更一般图族上的零转移研究提供了直接判据与分类基础。", "summary_source": "deepseek", "authors": [{"name": "Xingkun Song"}, {"name": "Huiqiu Lin"}], "featured_authors": [{"name": "Xingkun Song"}, {"name": "Huiqiu Lin"}], "author_count": 2}, {"id": "2608.10671", "category": "quant-ph", "title": "Quantum Computing for Industrial Electromagnetics: Applicability and Case Studies in Solving Maxwell's Equations", "abstract": "Computational electromagnetics plays a central role in many industrial applications but often requires substantial computational resources, particularly when fine spatial discretizations are needed. While classical approaches remain the standard, quantum computing offers the potential to accelerate large-scale simulations by encoding them with a limited number of qubits. Here, we investigate the performance and resource scaling of the Harrow-Hassidim-Lloyd (HHL) and Quantum Singular Value Transformation (QSVT) algorithms for solving linear systems generated by the finite-difference time-domain (FDTD) method, a widely adopted numerical scheme for discretizing Maxwell's equations. We benchmark their performance across representative industrial use cases, including radar propagation, lens simulations, and beamforming processes. Our results demonstrate the validity of the approaches, achieving state infidelities smaller than $2\\cdot 10^{-3}$ with success probabilities greater than $10^{-3}$, compatible with practical quantum state sampling. Overall, we observe that the QSVT method consistently delivers higher accuracy. We further observe that the condition number of the linear matrix, a key factor governing the performance of quantum solvers, saturates as the number of spatial lattice points increases. This implies that the spatial grid can be scaled to realistic industrial dimensions without increasing the HHL or QSVT circuit depth due to ill-conditioned matrices.", "url": "https://arxiv.org/abs/2608.10671", "type": "理论+数值", "summary": "1. 该文面向工业计算电磁学，将HHL与QSVT算法应用于FDTD离散麦克斯韦方程组所生成的线性系统，并在雷达传播、透镜模拟与波束成形等用例中基准测试其性能。\n2. 研究表明态不保真度低于2×10^-3、成功概率高于10^-3，且QSVT精度更高；关键在于线性矩阵条件数随空间格点数增加趋于饱和。\n3. 该饱和意味着空间网格可扩展至实际工业尺寸而不增加HHL或QSVT因病态矩阵导致的电路深度，为大规模电磁仿真量子加速提供了前景。", "summary_source": "deepseek", "authors": [{"name": "Francesco Turro"}, {"name": "Marco Maronese"}, {"name": "Daniele Dragoni"}], "featured_authors": [{"name": "Francesco Turro"}, {"name": "Marco Maronese"}, {"name": "Daniele Dragoni"}], "author_count": 3}, {"id": "2608.10674", "category": "quant-ph", "title": "Optimal fidelity estimation when one state is pure via algorithmic Uhlmann transform", "abstract": "The Uhlmann fidelity ${\\rm F}(\\rho_0,\\rho_1) = {\\rm tr}|\\sqrt{\\rho_0}\\sqrt{\\rho_1}|$ is one of the most fundamental quantities in quantum information theory for quantifying the closeness between two quantum states. Estimating the Uhlmann fidelity to within additive error $\\varepsilon$ requires a number of copies of the states, or queries to their state-preparation circuits, that depends at least linearly on the smaller of the ranks of $\\rho_0$ and $\\rho_1$. Consequently, this rank dependence disappears when either state is pure, in which case the query and sample complexities depend only polynomially on $1/\\varepsilon$. However, the known optimal estimator for ${\\rm F}(\\rho,|\\psi\\rangle\\!\\langle\\psi|)$ due to Fang and Wang (ESA 2025) requires prior knowledge of which state is pure. In this work, we remove this mathematically unnecessary prior-knowledge requirement and establish an optimal estimator for ${\\rm F}(\\rho, |\\psi\\rangle\\!\\langle\\psi|)$ under the sole promise that one of the two states is pure, without knowing which one. Our estimator is obtained by specializing the refined algorithmic Uhlmann transform of Utsumi, Nakata, Wang, and Takagi (2025) to the case where one state is pure. In this setting, the Uhlmann fidelity can be recovered as follows: apply a unitary dilation of ${\\rm tr}_{\\sf A}(|\\psi_0\\rangle\\!\\langle\\psi_1|)$ (or its inverse) to the reference register $\\sf R$ of the purification $|\\psi_1\\rangle$ (or $|\\psi_0\\rangle$) on the registers $\\sf A$ and $\\sf R$, estimate the corresponding square-root amplitude in each case, and take the maximum of the resulting two estimates.", "url": "https://arxiv.org/abs/2608.10674", "type": "理论+数值", "summary": "1. 该工作给出最优Uhlmann保真度估计协议，在仅承诺两个量子态之一为纯态但未知哪一个的条件下估计F(ρ,|ψ⟩⟨ψ|)。\n2. 其技术卖点在于将算法化Uhlmann变换特化至纯态情形，通过执行两个酉膨胀并估取对应平方根振幅的最大值，消除了已知最优估计器对纯态身份先验知识的要求。\n3. 这一结果使最优保真度估计在混合态与纯态不可区分时不需额外信息，对量子态认证与量子信息处理的算法设计具有直接参考意义。", "summary_source": "deepseek", "authors": [{"name": "Yupan Liu"}, {"name": "Qisheng Wang"}], "featured_authors": [{"name": "Yupan Liu"}, {"name": "Qisheng Wang"}], "author_count": 2}, {"id": "2608.10695", "category": "quant-ph", "title": "Helium-like ions $(Z,e,e)$ in Lagrange Mesh method, interpolating the highly-accurate energy spectra vs. Z", "abstract": "Two alternative approaches for studying Helium-like atomic ions in non-relativistic quantum mechanics are proposed: (I) a numerical approach, based on the Lagrange-mesh method which can easily reach up to 14-15 significant digits in the energy spectrum for any nuclear charge $Z$ with modest CPU time in single processor mode and (II) a highly-accurate, few-parametric interpolation formula for the energies {\\it vs.} $Z$. The interpolation formula of general nature is proposed, it can be applied to the energies of any excited state of the helium-like sequence. It is based on matching the $1/Z$-expansion at large $Z$ and the Puiseux expansion with integer and half-integer powers around the so-called second critical charge $Z_B$, introduced by F and D Stillinger (1969, 1974), confirmed by the present authors in 2019 for the ground state $1^1 S$, then revisited here, and extended to the excited states in the present work. For example for the first two spin-singlet $1^1 S$, $2^1 S$ and the first two spin-triplet $2^3 S$, $3^3 S$ states this interpolation formula with nine free parameters can reach an accuracy of 10-14 significant digits (s.d.) in the energies for any physically-relevant nuclear charge $Z$, giving absolute accuracy at large $Z$. Many results are obtained for the first time.", "url": "https://arxiv.org/abs/2608.10695", "type": "理论+数值", "summary": "1. 该工作针对非相对论类氦离子提出两种互补方案：基于Lagrange网格的数值方法，以及将大Z区1/Z展开与第二临界电荷Z_B附近Puiseux展开相匹配的少参数插值公式。\n2. 数值方法在单处理器上即可对任意核电荷数Z获得14–15位有效数字的能谱；九参数插值公式适用于任意激发态，对最低的四个自旋单/三重态在物理相关Z范围达到10–14位精度，且在大Z处呈绝对精确。\n3. 该工作将Z_B确立为连接大Z与临界区行为的解析节点，并扩展至激发态，为类氦等电子序列的高精度能谱与临界电荷附近物理提供了可推广的解析-数值研究途径。", "summary_source": "deepseek", "authors": [{"name": "H Olivares-Pilon"}, {"name": "JC Lopez-Vieyra"}, {"name": "AV Turbiner"}], "featured_authors": [{"name": "H Olivares-Pilon"}, {"name": "JC Lopez-Vieyra"}, {"name": "AV Turbiner"}], "author_count": 3}, {"id": "2608.10789", "category": "quant-ph", "title": "Resource-bounded controllability benchmarking of open quantum systems", "abstract": "This paper develops a resource-bounded framework for evaluating practical controllability in open quantum systems using a trained graybox response model. Rather than treating controllability as a binary property of an idealised Hamiltonian model, the proposed approach evaluates the best-achievable process fidelity over a finite, hardware-realisable pulse family under explicit control constraints. The graybox model retains the known coherent dynamics while learning control-dependent open-system distortions from pulse-response data. The resulting surrogate predictions are used to reconstruct the implemented processes and compare them with Haar-random target gates. Practical controllability is then characterised through the distribution of best-achievable infidelities and an area-based summary metric. The framework is demonstrated for a driven qubit under closed-system, classical-noise, and combined quantum-plus-classical-noise dynamics, with pulse amplitude and inverse Gaussian width used as the control-resource coordinates. The results show how finite control resources and open-system noise jointly constrain the gate performance attainable by the chosen pulse family.", "url": "https://arxiv.org/abs/2608.10789", "type": "理论+数值", "summary": "1. 该工作提出一种资源受限的开放量子系统可控制性基准方法，基于训练的灰箱响应模型评估有限硬件可实现脉冲族下的最优过程保真度。\n2. 其核心在于灰箱模型在保留已知相干动力学的同时从脉冲响应数据学习控制相关的开放系统畸变，从而重构实际实现过程并与Haar随机目标门比较，以不可达保真度分布和面积指标刻画实际可控制性。\n3. 对驱动量子比特在闭系统、经典噪声及量子加经典噪声下的演示表明，有限控制资源与噪声共同约束门性能，这为实用化量子控制的定量基准与脉冲族设计提供了可推广的评估工具。", "summary_source": "deepseek", "authors": [{"name": "Yule Mayevsky"}, {"name": "Akram Youssry"}, {"name": "Alberto Peruzzo"}], "featured_authors": [{"name": "Yule Mayevsky"}, {"name": "Akram Youssry"}, {"name": "Alberto Peruzzo"}], "author_count": 3}, {"id": "2608.10809", "category": "quant-ph", "title": "A Quantum Algorithm for Solving the Poisson Equation for Free Field Conditions via the Hockney Method", "abstract": "For the often encountered problem of the Poisson equation, this work presents a quantum algorithm solving it based on the quantum Fourier transform (QFT) for periodic boundary conditions as well as free field conditions, where the latter is realized via the Hockney method. Besides the QFT and an initialization procedure for amplitude encoding, the algorithm just uses a procedure for multiplying the state vector by a diagonal matrix w.r.t. amplitude encoding. For the latter, two alternative implementations are considered here. The first variant is a version of the LCU method and the second is a sequence of multi-controlled rotation gates that represents a factoring of the multiplied values into absolute values and complex phase factors. The functionality of the algorithm is verified via comparing the results obtained from state vector simulations for one- and two-dimensional test examples with their analytical solutions. For the considered test examples, it is found that the success probability for obtaining the desired ancilla qubit subspace in the LCU version is a factor of around two higher than that for the sequence of multi-controlled rotation gates. However, the LCU version requires a number of ancilla qubits up to the number of qubits that is set to store the discretized source term of the Poisson equation in amplitude encoding, whereas the sequence of multi-controlled rotation gates demands only one ancilla qubit. Computations of the success probabilities for both variants furthermore indicate that the success probability converges for a specific problem with increasing resolution. Concerning the required computational resources for the quantum algorithm, the conclusion is drawn that while the QFT is a more efficient procedure than its classical counterpart, the current implementations of the other necessary steps in the algorithm diminish the efficiency w.r.t. the runtime.", "url": "https://arxiv.org/abs/2608.10809", "type": "理论+数值", "summary": "1. 该工作提出一种基于量子傅里叶变换与振幅编码的泊松方程量子算法，并借助霍克尼方法处理自由场边界条件。\n2. 其技术要点在于将方程求解归约为对角矩阵乘法；两种实现分别为线性组合酉方法与多受控旋转门，前者成功概率约高一倍但需额外辅助比特，后者仅需单辅助比特。\n3. 一维与二维态矢量模拟验证了正确性并显示成功概率随分辨率收敛，但当前实现中除量子傅里叶变换外其余步骤仍削弱整体运行时效率。", "summary_source": "deepseek", "authors": [{"name": "Hans A. Kösel"}, {"name": "Roland Ewert"}, {"name": "Jan W. Delfs"}], "featured_authors": [{"name": "Hans A. Kösel"}, {"name": "Roland Ewert"}, {"name": "Jan W. Delfs"}], "author_count": 3}, {"id": "2608.11000", "category": "quant-ph", "title": "The entanglement-assisted transmission capacity is a strong converse bound for identification", "abstract": "Classical identification via a noisy channel is a communication task in which the receiver is not required to reconstruct the full transmitted message, but only to decide whether it coincides with a message of interest. This relaxation allows the number of identifiable messages to grow doubly exponentially with the blocklength. For quantum channels, the resulting (doubly exponential) identification capacity $C_{\\mathrm{ID}}$ can strictly exceed the ordinary (exponential) transmission capacity $C$. In this paper, we prove that the entanglement-assisted transmission capacity $C_E$ is a strong converse bound for this task: $C_{\\mathrm{ID}}\\leq C_E$. For sufficiently low-noise channels, this bound can also be achieved via the Hayden-Winter (quantum) identification + fingerprinting codes. This yields an exact characterization $C_{\\mathrm{ID}}=C_E$ of identification capacity for such channels. However, for general channels, we prove that this upper bound can be strict. We exhibit an explicit family of transpose-depolarizing channels for which $C_{\\mathrm{ID}}<C_E$. As a consequence, we also obtain the first example of strict superadditivity of the identification capacity $C_{\\mathrm{ID}}$.", "url": "https://arxiv.org/abs/2608.11000", "type": "理论", "summary": "1. 该论文研究量子信道上的经典识别任务，证明纠缠辅助传输容量 C_E 是识别容量 C_ID 的强逆上界，即 C_ID <= C_E。\n2. 其技术核心是结合强逆界与Hayden-Winter量子识别及指纹编码，在低噪声信道下实现该界并给出精确刻画 C_ID=C_E，且通过转置去极化信道族证明一般信道中该上界为严格不等式，并首次得到识别容量的严格超可加性。\n3. 这一结果揭示识别容量与纠缠辅助传输容量之间的深层联系，为一般量子信道识别容量的最终刻画提供了新约束，也为量子通信复杂性研究带来启发。", "summary_source": "deepseek", "authors": [{"name": "Satvik Singh"}], "featured_authors": [{"name": "Satvik Singh"}], "author_count": 1}, {"id": "2608.11042", "category": "quant-ph", "title": "Entanglement depth and ancilla efficiency in quantum channel estimation", "abstract": "We study the role of ancillary entanglement in quantum channel parameter estimation and investigate the minimal ancilla dimension required to achieve the maximum Fisher information. We introduce the $k$-ancilla Fisher information, which quantifies the optimal estimation precision achievable with input states of rank at most $k$, and derive a variational characterization in terms of a rank-constrained optimization problem. This formulation leads to a simple characterization of the minimum ancilla dimension $k^*$ required for optimal estimation, given by the minimum rank among the maximizers of the associated variational problem. We further identify sufficient conditions under which ancillary entanglement provides no advantage, including channel families admitting a fixed measure-and-prepare representation and channels satisfying a natural horizontality condition. In addition, we derive a bound on the incremental gain in Fisher information obtained by increasing the ancilla dimension under suitable structural assumptions on the optimal input states. The general results are illustrated through explicit examples, including unitary channels, qubit depolarizing and amplitude damping channels. These results provide a systematic framework for understanding and quantifying the entanglement resources required for optimal quantum channel estimation.", "url": "https://arxiv.org/abs/2608.11042", "type": "理论+数值", "summary": "1. 该工作研究量子信道参数估计中辅助纠缠的作用，引入k-辅助Fisher信息刻画秩不超过k的输入态能达到的最优精度。\n2. 通过秩约束变分优化，将最优估计所需的最小辅助维数k*等价为该变分问题最大值的极小秩，并给出辅助纠缠无增益的充分条件及增量上界。\n3. 这为量化信道估计所需纠缠资源、识别无需辅助纠缠的信道族以及设计最优探测方案提供了系统框架。", "summary_source": "deepseek", "authors": [{"name": "Javid Naikoo"}], "featured_authors": [{"name": "Javid Naikoo"}], "author_count": 1}, {"id": "2608.11066", "category": "quant-ph", "title": "Quantum Coordination Advantages in AI State-Tracking Tasks: Semantic Compilation and Latent Memory", "abstract": "We prove inference-time quantum coordination advantages for specified AI state-tracking tasks. A solver compresses semantic history into a future-accessible boundary state and later answers a query. We count communication $B$, persistent instance-dependent memory $M$, and local work $D$; classical recurrence, caches, tools, and recomputation are allowed and charged. The central result is a boundary-preserving semantic-compilation theorem. It maps a finite one-way, streaming, or adaptive causal task into a semantic AI interface while preserving event order and access to past input. Classical boundary-state lower bounds and quantum-memory upper bounds transfer up to explicit compiler overhead, independently of the finite-precision recurrent architecture. Two applications have classical semantics. Matched-entity synopsis QA inherits the hidden-matching separation between $O(\\log N)$ qubits and $\\Omega(\\sqrt{N})$ classical boundary bits. Continual requirements auditing inherits a Max-$k$SAT streaming separation: a recurrent solver uses $O(\\log^5 n\\log(1/\\delta))$ qubits and polylogarithmic classical workspace to obtain a $0.7172$-approximation, whereas every classical one-pass finite-information solver attaining that ratio requires $\\Omega(\\sqrt{n})$ coordination width. As a quantum-native compiler test, a stabilizer latent-state dialogue uses $n$ qubits, while every exact finite-state classical causal online realization satisfies $B+M \\ge \\frac{1}{2}n^2+(\\frac{3}{2}-\\log_2 3)n+O(1)$. The source protocols, streaming algorithms, and stabilizer witness are imported; the new result is their architecture-independent semantic transfer. These are memory and coordination separations, not runtime or empirical advantages for present-day language models. The stabilizer result assumes exact simulation and ideal noiseless quantum memory.", "url": "https://arxiv.org/abs/2608.11066", "type": "理论+数值", "summary": "1. 该工作证明了若干指定AI状态追踪任务中存在推理时的量子协调优势，并将有限单向流、流式或自适应因果任务编译为语义AI接口。\n2. 其核心是保边界的语义编译定理，可将经典边界态下界与量子存储上界迁移至任意有限精度循环架构，并导出O(log N)量子比特对Ω(√N)经典边界位等分离及稳定子对话的二次下界。\n3. 这些是记忆与协调复杂度的分离而非现有语言模型的运行时优势，为量子原生编译器与因果任务复杂度迁移提供了框架性启发。", "summary_source": "deepseek", "authors": [{"name": "Ming Yang"}], "featured_authors": [{"name": "Ming Yang"}], "author_count": 1}, {"id": "2608.11139", "category": "quant-ph", "title": "A Sharp Local-Question Threshold for GHZ-Equatorial Completeness in Four-Player XOR Games", "abstract": "We determine the smallest number of active questions per player at which a four-player binary exclusive-or (XOR) game of commuting-operator value one need not admit a Greenberger--Horne--Zeilinger (GHZ) equatorial realization. Such a realization uses the four-qubit GHZ state and equatorial qubit observables, reducing perfect play to additive phase equations. We prove that every four-player XOR game with commuting-operator value one and at most three active questions per player has a perfect GHZ-equatorial strategy. Conversely, we construct a uniform eight-clause game with four active questions per player whose commuting-operator value is one but whose phase equations are inconsistent. Thus four is the sharp local-question threshold. The positive result follows by lifting every integral incidence obstruction to an ordered noncommutative refutation, using primitive circuits, forest matchings, and ternary Hamming geometry. For the separating game, a Klein four-group incidence relation obstructs the phase system, while an even-subgroup normal form and degree-one and degree-two Magnus coefficients exclude refutations of arbitrary length.", "url": "https://arxiv.org/abs/2608.11139", "type": "理论", "summary": "1. 该工作证明四玩家二元异或博弈中，具有交换算子值一且每玩家至多三个活跃问题者必存在四量子比特GHZ赤道完美策略。\n2. 其技术核心在于用原始回路、森林匹配和三进制汉明几何把积分关联障碍提升为有序非交换反驳，并构造四活跃问题的均匀八子句反例。\n3. 这一尖锐局部问题阈值刻画了GHZ赤道可实现性的边界，为量子博弈与算子理论中更广的完美策略分类提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Ziao Tang"}, {"name": "Chengkai Zhu"}, {"name": "Ge Bai"}, {"name": "Xin Wang"}, {"name": "Ranyiliu Chen"}], "featured_authors": [{"name": "Ziao Tang"}, {"name": "Chengkai Zhu"}, {"name": "Ge Bai"}, {"name": "Xin Wang"}, {"name": "Ranyiliu Chen"}], "author_count": 5}, {"id": "2608.11151", "category": "quant-ph", "title": "Breaking the Quadratic Barrier for von Neumann Entropy Estimation", "abstract": "We study the sample complexity of estimating the von Neumann entropy of an unknown $d$-dimensional quantum state. All previously known estimators require $\\Omega(d^2)$ samples, and plug-in estimators are known to face a quadratic barrier. We give the first subquadratic-sample estimator: for additive error $\\varepsilon$, our estimator uses \\[ O\\!\\left(\\frac{d^2 \\log^2(\\log(d)) \\log(1/\\varepsilon)}{\\varepsilon^2 \\log^2(d)} + \\frac{\\log^2(d/\\varepsilon)}{\\varepsilon^2}\\right) \\] samples. In particular, for constant $\\varepsilon$, the complexity is $O_\\varepsilon(d^2\\log^2(\\log(d))/\\log^2(d))=o(d^2)$. Our analysis introduces a new pinching inequality that bounds the entropy loss under a space direct-sum decomposition, together with a bias-corrected estimator for large eigenvalues and a new bounded-coefficient polynomial estimator for small eigenvalues.", "url": "https://arxiv.org/abs/2608.11151", "type": "理论", "summary": "1. 本文研究未知 d 维量子态 von Neumann 熵的样本复杂度，构建了首个打破 d^2 二次障碍的次二次样本估计器。\n2. 其技术核心是建立新的 pinching 不等式来控制空间直和分解的熵损失，结合大特征值的偏差校正估计和小特征值的有界系数多项式估计，将常数误差下样本数降至 O(d^2 log^2 log d / log^2 d)。\n3. 该结果首次表明量子熵估计可突破插件估计的二次瓶颈，对量子态泛函估计与量子信息理论有直接启示。", "summary_source": "deepseek", "authors": [{"name": "Minbo Gao"}, {"name": "Qisheng Wang"}], "featured_authors": [{"name": "Minbo Gao"}, {"name": "Qisheng Wang"}], "author_count": 2}, {"id": "2608.11160", "category": "quant-ph", "title": "Quantum Codes with Arbitrary Z-Rotation logical Gates and Applications to Fault-Tolerant Code Switching", "abstract": "A technique for realizing a universal set of fault-tolerant quantum operations is the code switching method, which leverages two quantum codes with complementary sets of transversal gates. To date, the application of this technique has been largely limited to families of color codes supporting a logical $T$ gate. No analogous code switching protocols exist for many other prominent families, such as rotated surface codes, or for finer $Z$-rotation gates. In this work, we first utilize the doubling technique as a unified framework to construct a class of quantum color codes encoding a single logical qubit with an arbitrarily large minimum distance, enabling the transversal realization of arbitrary small logical $Z$-rotation gates. We investigate the structural properties of this code family, demonstrating that they improve upon the parameters of state-of-the-art triorthogonal codes, achieve lower qubit overhead compared to certain known color codes, and admit single-shot decoding of $Z$-syndromes via meta-checks. Furthermore, we show that this framework extends beyond color codes; specifically, it enables the generation of $r$-orthogonal quantum codes, $r \\ge 2$, that inherit the local geometry of rotated surface codes. We then provide an overhead optimization protocol alongside several candidate codes tailored for realizing logical $Z$-rotation gates within rotated surface codes. Finally, we extend the fault-tolerant code switching protocol based on transversal CNOT gates to incorporate fault-tolerant realization of $Z$-rotation gates at any level of the Clifford hierarchy for geometries compatible with rotated surface codes. We present the first demonstration of fault-tolerant magic state preparation by means of code switching within a distance-three rotated surface code using a total footprint of only 45 physical qubits, and evaluate its performance through a simulation.", "url": "https://arxiv.org/abs/2608.11160", "type": "理论+数值", "summary": "1. 该工作利用加倍技术构造一类编码单逻辑比特、距离可任意大的量子色码，实现任意小逻辑Z旋转门，并将框架推广至旋转表面码等码族。\n2. 其技术卖点在于这类码参数优于现有三正交码，降低量子比特开销，并借由meta-checks支持Z综合征的单发解码，同时生成继承旋转表面码局域几何的r正交码。\n3. 该协议将基于横向CNOT的容错码切换扩展到Clifford层级任意Z旋转门，并以仅45个物理比特在距离三旋转表面码中演示容错魔法态制备。", "summary_source": "deepseek", "authors": [{"name": "Reza Dastbasteh"}, {"name": "Ruben M. Otxoa"}, {"name": "Pedro M. Crespo"}, {"name": "Josu Etxezarreta Martinez"}], "featured_authors": [{"name": "Reza Dastbasteh"}, {"name": "Ruben M. Otxoa"}, {"name": "Pedro M. Crespo"}, {"name": "Josu Etxezarreta Martinez"}], "author_count": 4}, {"id": "2608.11187", "category": "quant-ph", "title": "Statistically-Secure Bit Commitment and Coin Flipping Protocols Based on Quantum Hardware Assumptions", "abstract": "Bit commitment is impossible to achieve with unconditional security, even in quantum cryptogra- phy. We show that statistically secure bit commitment, satisfying both hiding and binding, can be constructed from hybrid locked physical unclonable functions (HLPUFs), a hardware primitive that combines classical hardware tokens and quantum communication. Our protocol uses these hardware assumptions in a novel and non-trivial way to achieve the first mistrustful two-party cryptographic protocol based on hybrid hardware modules. We prove statistical hiding and binding under natu- ral assumptions on the HLPUF and using a carefully designed challenge generation algorithm as a subroutine of our bit-commitment protocol. The construction also yields the first hardware-based coin-flipping protocol. Our results suggest a new paradigm for secure two-party cryptography in quantum networks, combining rigorous security guarantees with a concrete route toward practical implementation.", "url": "https://arxiv.org/abs/2608.11187", "type": "数值", "summary": "1. 该工作基于混合锁定物理不可克隆函数（HLPUF）构造了统计安全的比特承诺协议，并由此给出首个基于硬件假设的掷币协议。\n2. 其核心卖点在于利用经典硬件令牌与量子通信混合的硬件原语，配合精心设计的挑战生成算法，证明协议同时满足统计隐藏与统计绑定。\n3. 这为量子网络中不信任双方的安全密码学提供了兼顾严格安全证明与可行实现的新范式，并可能推动基于硬件假设的实用化两方密码协议发展。", "summary_source": "deepseek", "authors": [{"name": "Roo Dunnill"}, {"name": "Mina Doosti"}], "featured_authors": [{"name": "Roo Dunnill"}, {"name": "Mina Doosti"}], "author_count": 2}, {"id": "2608.11196", "category": "quant-ph", "title": "Work distribution for strongly coupled many-body open quantum systems", "abstract": "The non-equilibrium quantum thermodynamics of many-body open systems is notoriously rich, especially in the strong-coupling regime where strong system-bath correlations develop and interactions produce non-perturbative effects. Such systems can be described by `quantum impurity models' where the system and bath are treated on an equal footing as a single composite. Paradigmatic examples are the spin-boson and Anderson impurity models, in which system degrees of freedom interact with either bosonic or fermionic gapless baths. Here we study the quantum work distribution function (WDF) of such systems following a quench. Capturing the full continuum of many-body excitations in the WDF requires a non-perturbative solution of the underlying non-equilibrium quantum impurity problem. For this purpose, we extend the time-dependent numerical renormalization group (TDNRG) approach to the calculation of the WDF, which applies directly in the thermodynamic limit, can be used for arbitrary quench amplitudes at zero or finite temperature, and provides exponentially fine low-energy resolution. Our numerically-exact solution reveals power-law threshold behavior due to the Anderson orthogonality catastrophe when the work approaches its minimum value, with universal scaling collapse of the distribution below an emergent low-energy scale induced by system-bath correlations.", "url": "https://arxiv.org/abs/2608.11196", "type": "理论+数值", "summary": "1. 该工作研究强耦合多体开放系统在淬火后的量子功分布，以自旋-玻色子模型和安德森杂质模型为例，探索关联与耗散共同作用的非平衡量子热力学。\n2. 主要技术进展是将含时数值重整化群推广到功分布计算，使其在热力学极限下直接适用，支持零温或有限温度、任意淬火强度，并具有指数式低能分辨能力。\n3. 数值精确解揭示功接近最低值时由安德森正交灾难驱动的幂律阈值行为，且分布在系统-热库关联所产生的低能标下呈现普适标度坍塌，为实验与理论提供了明确可检验的预测。", "summary_source": "deepseek", "authors": [{"name": "H. T. M. Nghiem"}, {"name": "T. A. Costi"}, {"name": "S. Campbell"}, {"name": "A. K. Mitchell"}], "featured_authors": [{"name": "H. T. M. Nghiem"}, {"name": "T. A. Costi"}, {"name": "S. Campbell"}, {"name": "A. K. Mitchell"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
