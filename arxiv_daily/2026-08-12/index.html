<head>

  <title>arXiv 2026-08-12 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

  <script>
    const papers = [{"id": "2608.10041", "category": "cond-mat", "title": "Analytic Boundary Terms for Arbitrary Crystal Geometries and Direct-Sum Evaluation of Madelung Constants in Triclinic Lattices", "abstract": "The direct-sum evaluation of Madelung constants is complicated by the conditional convergence of lattice sums, which gives rise to a shape-dependent boundary term. In this work, we present, for the first time, a closed-form analytic expression for this boundary term that is valid for arbitrary crystal geometries. For general triclinic lattices, this boundary term maps exactly onto the electrostatic potential generated by a set of uniformly charged parallelograms. In addition, we demonstrate that the residual finite-size correction for a crystal of characteristic size $p$ decays as $(2p+1)^{-2}$. Building on these results, we develop a robust direct-sum method for the accurate computation of Madelung constants in arbitrary triclinic lattices and validate its effectiveness through explicit calculations on representative Bravais lattices.", "url": "https://arxiv.org/abs/2608.10041", "type": "理论+数值", "summary": "1. 该工作针对晶格求和条件收敛带来的形状相关边界项，首次推导了适用任意晶体几何的闭式解析表达式，并据此建立了直接求和计算马德隆常数的方法。\n2. 其物理要点在于，对一般三斜晶格该边界项精确映射为均匀带电平行四边形的静电势，同时证明了特征尺寸为p的晶体的有限尺寸修正按(2p+1)^-2快速衰减。\n3. 这使任意三斜布拉伐晶格上的马德隆常数能够在无需Ewald求和或收敛加速的情况下被严格高效地直接计算，并为其他条件收敛格点求和问题提供了可借鉴的解析边界项处理方法。", "summary_source": "deepseek", "authors": [{"name": "Yang He"}, {"name": "Zhonghan Hu"}], "featured_authors": [{"name": "Yang He"}, {"name": "Zhonghan Hu"}], "author_count": 2}, {"id": "2608.10048", "category": "cond-mat", "title": "Numerical modeling of microstructure evolution in nanocrystalline alloys - grain boundary segregation, solute drag and mechanics", "abstract": "Nanocrystalline (NC) alloys hold much promise as structural alloys due to their superior mechanical properties over traditional coarser grained microcrystalline alloys. Strength of metallic alloys is related to the underlying grain size - as represented by the classical Hall-Petch relation. Generally, a metals strength increases with decreasing mean grain size from the micrometer scale to the nanometer scale, until about a mean size of 20 nm. Any further decrease of grain size results in decreasing strength. Thus, there is an optimal range of mean grain size for most metals about which maximum material strength can be obtained. In the context of NC alloys, stabilization of the grain size in this optimal range is one of the primary synthesis challenges. Since nm-scale mean grain sizes are desired, phenomena like GB solute segregation and solute precipitation are utilized during alloy synthesis to mitigate grain growth. Numerical modeling the phenomena of GB-solute interactions and the evolution of these stabilized GBs under mechanical load are of immense interest to the NC alloy community. To enrich the numerical modeling formulations available in this space, we present here a phase-field method based numerical framework to model GB segregation, solute precipitation and effect of external loading on NC alloys. While some of these effects have been modeled in isolation, a unified treatment of the solute and GB segregation with mechanics interactions has not be considered in the literature. We present a 3D FEM finite-strain phase-field formulation for modeling grain evolution and microstructure stabilization. Beyond the formulation, various case studies demonstrate the applicability of this framework. Further, thermodynamic and kinetic arguments are provided based on the evolution of GB energy to explain the effects of solute drag, GB pinning and mechanical deformation.", "url": "https://arxiv.org/abs/2608.10048", "type": "理论+数值", "summary": "1. 该工作提出一个三维有限应变相场数值框架，用于模拟纳米晶合金在晶界偏析、溶质析出及外载作用下的晶粒演化与微观组织稳定化。\n2. 其核心在于统一的有限元公式中同时处理溶质-晶界-力学相互作用，并基于晶界能演化从热力学和动力学角度解释溶质拖曳、晶界钉扎及变形机制，弥补了以往孤立建模的不足。\n3. 这为定量设计最优晶粒尺寸稳定化策略、预测稳定晶界在受力下的响应，以及拓展多场耦合的介观合金模拟提供了可行方向。", "summary_source": "deepseek", "authors": [{"name": "Prakarsh Pandey"}, {"name": "Shiva Rudraraju"}], "featured_authors": [{"name": "Prakarsh Pandey"}, {"name": "Shiva Rudraraju"}], "author_count": 2}, {"id": "2608.10059", "category": "cond-mat", "title": "Cell Natural Orbitals in Quantum Materials", "abstract": "Understanding correlated quantum matter starts with an accurate model of the single-particle states that interact at low energies: their dispersion, band geometry, orbital content and charge density. In many cases, notably the topological bands of moire materials, it is not straightforward to find a real-space description with a few local orbitals that accomplishes this task. Here we provide a systematic way to identify the local degrees of freedom that best capture the band geometry and charge density of any chosen set of bands. We use the unit-cell one-particle reduced density matrix (UC-1pRDM), obtained by restricting the projector onto the target bands to a single unit cell. Its eigenstates, which we call cell natural orbitals (CNOs), form a local, symmetric basis uniquely determined by the Bloch wavefunctions and the choice of real-space partition. Their eigenvalues measure the occupation of each CNO in the target bands, quantifying entanglement across unit-cell boundaries and the importance of multi-orbital character. A set of CNOs that maximizes total spectral weight and reproduces the target band symmetries provides optimal trial states for Wannierization. We exemplify this by constructing a lattice model for twisted bilayer WSe$_2$ that tracks the orbital content across twist angles.", "url": "https://arxiv.org/abs/2608.10059", "type": "理论", "summary": "1. 该工作提出基于单胞单粒子约化密度矩阵的系统方案，从目标能带构造局域对称基——胞自然轨道。\n2. 其卖点在于本征值可量化跨胞纠缠与多轨道权重，同时保持带几何与电荷密度，并为瓦涅尔化提供最优试探态。\n3. 作者以扭转双层WSe2晶格模型展示轨道含量随转角演化，为拓扑平带局域基建模提供了通用工具。", "summary_source": "deepseek", "authors": [{"name": "Harshitra Mahalingam"}, {"name": "Nishchhal Verma"}, {"name": "Daniel Muñoz-Segovia"}, {"name": "Raquel Queiroz"}], "featured_authors": [{"name": "Harshitra Mahalingam"}, {"name": "Nishchhal Verma"}, {"name": "Daniel Muñoz-Segovia"}, {"name": "Raquel Queiroz"}], "author_count": 4}, {"id": "2608.10340", "category": "cond-mat", "title": "Giant mode splitting of azimuthal spin waves in radial vortices", "abstract": "Radial vortex is a topological spin texture stabilized by the interfacial Dzyaloshinskii-Moriya interaction (DMI) in ferromagnetic disks. Previous investigations have shown that the doublet splitting of azimuthal modes in traditional circular vortices arises from the coupling between azimuthal spin waves and vortex core (VC), an effect occurs only for azimuthal indices $m=\\pm1$ and is absent for higher-order modes. Here, we present a giant mode splitting of azimuthal spin waves in radial vortices, even in the absence of the VC. This mode splitting arises from the DMI, which can be an order of magnitude larger than that induced by the VC. Moreover, the DMI-induced frequency splitting increases with both the DMI constant and mode index, reaching tens of GHz for higher-order azimuthal modes. Our results reveal a robust mechanism for mode splitting in chiral magnetic textures and deepen the fundamental understanding of the DMI effect on the spin-wave dynamics in confined magnets.", "url": "https://arxiv.org/abs/2608.10340", "type": "理论", "summary": "1. 该工作研究了铁磁圆盘中径向涡旋的方位角自旋波模式劈裂，并证明即使不存在涡旋核心，界面DMI也能诱导巨大且可扩展的劈裂。\n2. 物理卖点在于将劈裂来源从传统涡旋核心耦合切换为界面DMI，其强度随DMI常数与方位角模式指标增大，较核心诱导劈裂高一个量级，高阶模式可达数十GHz。\n3. 这一机制为手性磁织构中自旋波模式劈裂提供了稳健普适的来源，并为受限磁性结构中DMI调控自旋波动力学及器件应用提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Zhenyu Wang"}, {"name": "Liangrui Li"}, {"name": "Xuejuan Liu"}, {"name": "Xiansi Wang"}, {"name": "Ruifang Wang"}, {"name": "H. Y. Yuan"}], "featured_authors": [{"name": "Zhenyu Wang"}, {"name": "Liangrui Li"}, {"name": "Xuejuan Liu"}, {"name": "Xiansi Wang"}, {"name": "Ruifang Wang"}, {"name": "H. Y. Yuan"}], "author_count": 6}, {"id": "2608.10352", "category": "cond-mat", "title": "Equilibrium Distributions for Strongly Nonlinear Many-Body Systems", "abstract": "Obtaining equilibrium distributions of nonlinear systems is essential for accurately computing macroscopic observables. Conventional theoretical corrections are typically limited to weak nonlinearities, where interaction terms can be treated as effectively uncorrelated perturbations and the random phase approximation applies. In this Letter, we develop a framework to determine equilibrium distributions based on the generalized energy equipartition principle. Our approach recovers existing corrections in the weakly nonlinear regime and, crucially, remains valid for strong nonlinearities, where perturbative contributions become correlated and conventional approaches break down. Numerical simulations of the nonlinear Schrödinger equation, the Majda-McLaughlin-Tabak model, and the Fermi-Pasta-Ulam-Tsingou model demonstrate accurate corrections for nonlinearities more than an order of magnitude stronger than those accessible to conventional theories.", "url": "https://arxiv.org/abs/2608.10352", "type": "理论+数值", "summary": "1. 该工作为强非线性多体系统提出基于广义能量均分原理的平衡分布理论框架，用于精确计算宏观可观测量。\n2. 其核心在于将强非线性下关联的微扰贡献纳入自洽处理，既恢复弱非线性极限的已有修正，又能描述常规方法失效的强非线性区。\n3. 在非线性薛定谔方程、Majda-McLaughlin-Tabak及Fermi-Pasta-Ulam-Tsingou模型中的数值模拟证明，该方法对强于常规理论适用范围一个数量级以上的非线性仍给出准确修正。", "summary_source": "deepseek", "authors": [{"name": "Jialin Zhang"}, {"name": "Yong Zhang"}, {"name": "Hong Zhao"}], "featured_authors": [{"name": "Jialin Zhang"}, {"name": "Yong Zhang"}, {"name": "Hong Zhao"}], "author_count": 3}, {"id": "2608.10353", "category": "cond-mat", "title": "Metallic Bonding-Driven Elastic Softness and Optical Response in the Mg-Rich Laves-Phase LaMg2", "abstract": "A systematic first-principles investigation of the structural, electronic, mechanical, and optical properties of the cubic C15 Laves-phase intermetallic compound LaMg2 is performed within density functional theory. The calculated elastic constants satisfy the mechanical stability criteria for cubic crystals, confirming the intrinsic stability of the C15 phase. LaMg2 exhibits relatively low bulk, shear, and Young's moduli, indicating enhanced compressibility and elastic softness compared with transition-metal-based Laves phases. Direction-dependent elastic analysis reveals moderate anisotropy in Young's modulus, shear modulus, and Poisson's ratio, whereas linear compressibility remains nearly isotropic, consistent with the high crystallographic symmetry. The ductile nature of LaMg2 is supported by Pugh's ratio and Poisson's ratio, suggesting resistance to brittle failure and the dominance of metallic bonding. Electronic structure calculations confirm metallic behavior with a finite density of states at the Fermi level, primarily originating from La-5d states, accompanied by delocalized charge density characteristic of metallic interactions. The optical response further reflects the metallic nature through high reflectivity, strong optical conductivity at low photon energies, and pronounced absorption in the ultraviolet region. The combination of mechanical compliance, ductility, and metallic optical response highlights LaMg2 as a promising lightweight intermetallic material for applications requiring structural stability, damage tolerance, and efficient electromagnetic shielding or reflective components.", "url": "https://arxiv.org/abs/2608.10353", "type": "理论+数值", "summary": "1. 该工作利用密度泛函理论系统研究了C15型Laves相金属间化合物LaMg2的电子结构、力学与光学性质。\n2. 其核心在于揭示金属键主导的弹性软化、延展性以及低能光子区强反射和紫外吸收的关联机制。\n3. 这为设计兼具结构稳定、抗脆断与电磁屏蔽/反射功能的轻质金属间化合物提供了明确依据。", "summary_source": "deepseek", "authors": [{"name": "Farjana Mou"}, {"name": "S. M. Nazmus Shakib Pias"}, {"name": "M A Islam"}, {"name": "Md Zahidur Rahaman"}], "featured_authors": [{"name": "Farjana Mou"}, {"name": "S. M. Nazmus Shakib Pias"}, {"name": "M A Islam"}, {"name": "Md Zahidur Rahaman"}], "author_count": 4}, {"id": "2608.10428", "category": "cond-mat", "title": "Quadrupolar phase transition in superconducting lanthanum hydride", "abstract": "Lanthanum hydride (LaH$_{10}$) has been widely studied for its high superconducting critical temperature of 250 K at about 170 GPa pressure. Although the structural ${R\\bar{3}m}$-to-${Fm\\bar{3}m}$ transition under pressure connected to the emergence of the superconducting phase in this material is broadly understood, the detailed characterization of its nature and its order parameter are still missing. By applying the cluster multipole moment analysis to the hydrogen sublattice, we reveal that this transition is triggered by a quadrupolar $T_{2g}$ order parameter, and we provide evidence for its weak first-order nature. By performing path integral molecular dynamics coupled to a message-passing atomic cluster expansion (MACE) neural network potential, trained on Perdew-Burke-Ernzerhof (PBE) density functional theory configurations, we show that the collapse of the order parameter at the transition is simultaneously associated with the discontinuous softening of the optical $T_{2g}$ phonons. Their symmetry lets them carry a non-negligible electron-phonon coupling in LaH$_{10}$, while the weak first-order nature of the transition makes them soft. The presence of structural instabilities with low-frequency quadrupolar distortions can be a key ingredient to enhance superconductivity in superhydrides and provides guidance for the discovery of new high-$T_c$ superconductors in hydrogen-rich compounds.", "url": "https://arxiv.org/abs/2608.10428", "type": "理论+数值", "summary": "1. 该工作通过团簇多极矩分析氢亚晶格序，揭示超氢化镧LaH10中R-3m到Fm-3m结构相变由四极T2g序参量触发，并给出其弱一级相变的证据。\n2. 采用基于PBE密度泛函训练的消息传递原子簇展开神经网络势，结合路径积分分子动力学，证明序参量塌缩与光学T2g声子不连续软化同步发生，该声子具有不可忽略的电声耦合。\n3. 低频四极畸变带来的结构不稳定性可能是增强超氢化物超导电性的关键因素，为在富氢化合物中寻找新型高温超导体提供了微观判据与设计思路。", "summary_source": "deepseek", "authors": [{"name": "Abhishek Raghav"}, {"name": "Kousuke Nakano"}, {"name": "Marco Cherubini"}, {"name": "Ryotaro Arita"}, {"name": "Michele Casula"}], "featured_authors": [{"name": "Abhishek Raghav"}, {"name": "Kousuke Nakano"}, {"name": "Marco Cherubini"}, {"name": "Ryotaro Arita"}, {"name": "Michele Casula"}], "author_count": 5}, {"id": "2608.10432", "category": "cond-mat", "title": "Universal Density Control of Surface Reconstruction in Two-Dimensional Metals", "abstract": "We identify a unified thickness criterion for surface reconstruction in ultrathin metal sheets. The critical thickness is governed by the change in surface atomic density upon reconstruction: thinning always favors structural changes that increase this density. Thus, thinning suppresses the (1x2) reconstruction of 5d noble metal (110) sheets but promotes the quasi-hexagonal reconstruction of 4d noble metal (001) sheets. Density functional calculations validate these trends and show only minor corrections from surface stress and quantum-oscillation effects.", "url": "https://arxiv.org/abs/2608.10432", "type": "理论+数值", "summary": "1. 该工作针对超薄金属薄膜，提出了表面重构的统一厚度判据。\n2. 核心在于以重构前后表面原子密度变化控制临界厚度：减薄总偏好增加密度的结构变化，从而解释5d(110)与4d(001)重构的相反趋势，且密度泛函计算显示应力与量子振荡修正很小。\n3. 这一密度主导的普适图像为调控二维金属表面结构及理解有限尺寸效应提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Jinyuan Yang"}, {"name": "Xiaoliang Zhong"}], "featured_authors": [{"name": "Jinyuan Yang"}, {"name": "Xiaoliang Zhong"}], "author_count": 2}, {"id": "2608.10465", "category": "cond-mat", "title": "Machine-learning approach for the phase stability and mechanical properties of disordered alloys at finite temperature", "abstract": "The prediction of stable alloys forming solid-state solutions across large portions of the composition space is a serious theoretical challenge, since one has to evaluate the Gibbs free energy, including both configurational and vibrational contributions. This requires an energy theory capable of extremely high throughput. By taking the Ni-Pd system as prototype, we construct an efficient Jacobi-Legendre machine-learning potential based on density-functional-theory data, which provides accurate energies and forces across the entire composition space. Based on a cluster expansion up to three-body terms and only 873 trainable parameters, this allows us to compute the partition function by directly integrating all accessible microstates, differing for composition, atomic configuration and thermal agitation. We confirm that Ni and Pd are fully miscible, forming an $fcc$ solid-state solution. This is only metastable at room temperature, while becomes thermodynamically stable at around 600~K, with the stability achieved first at the Pd-rich end of the composition range. Interestingly, entropy and heat capacity analysis reveal a competition between the solid-state solution and two intermetallic phases with long-period L1$_0$ structure for NiPd and NiPd$_3$. All in all, our approach offers a powerful and high-throughput workflow for the study of disordered alloys, an approach that can be extended to multi-component systems such as high-entropy alloys.", "url": "https://arxiv.org/abs/2608.10465", "type": "理论+数值", "summary": "1. 该工作构建了基于密度泛函数据的雅可比-勒让德机器学习势，实现无序合金有限温度相稳定性与力学性质的高通量预测。\n2. 其核心技术在于以三体簇展开和873个参数直接积分所有组态与振动微观状态，精确获得Ni-Pd体系吉布斯自由能，揭示fcc固溶体室温亚稳、约600K转稳且富Pd端先稳定的行为。\n3. 该工作同时指出固溶体与长周期L1_0结构金属间化合物的熵-热容竞争，为多主元及高熵合金的有限温度相变研究提供了可扩展的高通量计算框架。", "summary_source": "deepseek", "authors": [{"name": "Rutchapon Hunkao"}, {"name": "Urvesh Patil"}, {"name": "Stefano Sanvito"}], "featured_authors": [{"name": "Rutchapon Hunkao"}, {"name": "Urvesh Patil"}, {"name": "Stefano Sanvito"}], "author_count": 3}, {"id": "2608.10520", "category": "cond-mat", "title": "Higher-Order Topological States with Cleavage-Dependent Dirac Mass", "abstract": "Topological quantum chemistry based on local charge profiles lacks predictive power for the crystalline cleavage of higher-order topological insulators (HOTIs). By cleaving an obstructed atomic insulator, we discover a topological phase characterized by e/2 fractional charges localized at precisely half of the corners, while the remaining empty corners host complementary vacancies of interstice charge. These zero-energy charge-vacancies and topological corners form a spatially balanced geometry, confined separately by C2 rotation symmetry. Crucially, we demonstrate that the emergence of corner zero modes dictates that specific dangling bonds-acting as the mass of a Dirac fermion-must explicitly expose in, and subtly slope toward, the corner regions. This strict directionality is verified by the anisotropic evolution of the mass term within a (2+1)-dimensional parameter space. Moreover, we find that the topological corners acquire lower entanglement entropy compared to the bulk, a behavior opposite to that of the real-space energy distribution.", "url": "https://arxiv.org/abs/2608.10520", "type": "理论", "summary": "1. 该工作通过解理受阻原子绝缘体，发现一种高阶拓扑相，其半数角上局域化e/2分数电荷，其余角对应空隙电荷空位。\n2. 其核心机制是角零模要求悬键作为狄拉克费米子的质量项显式暴露并倾向角区，且该质量在(2+1)维参数空间各向异性演化。\n3. 该结果为用解理方向与局域电荷分布预言高阶拓扑态提供依据，因拓扑角熵低于体态，与能量分布呈相反趋势。", "summary_source": "deepseek", "authors": [{"name": "Hongyu Chen"}, {"name": "Min Long"}, {"name": "Chuang Chen"}, {"name": "Zi Yang Meng"}], "featured_authors": [{"name": "Hongyu Chen"}, {"name": "Min Long"}, {"name": "Chuang Chen"}, {"name": "Zi Yang Meng"}], "author_count": 4}, {"id": "2608.10536", "category": "cond-mat", "title": "Anomalous current fluctuations in the stochastic XNOR hopping model", "abstract": "We consider fluctuations of the spin current in the stochastic XNOR process, a kinetically constrained hopping model in one spatial dimension. We formulate three conjectures with explicit amplitudes for the long-time current distributions: a Gaussian limit on the $t^{1/4}$ scale for homogeneous initial states with nonzero magnetization, a half-normal limit on the $t^{1/4}$ scale for domain-wall states with opposite magnetizations, and an M-Wright limit on the $t^{1/8}$ scale for homogeneous initial states at zero magnetization. Earlier work identified the tracer mechanism and anticipated the scaling exponents and limiting shapes in the domain-wall and zero-magnetization settings. Starting from the microscopic XNOR dynamics, we predict the missing amplitudes for the continuous-time process and extend the picture to homogeneous biased initial data. Simulations provide numerical support for all three conjectures without fitted parameters. A separate mathematical companion paper presents an extensively AI-generated candidate proof. Generative-AI tools were used in the research and writing workflow.", "url": "https://arxiv.org/abs/2608.10536", "type": "理论+数值", "summary": "1. 该工作研究了随机XNOR跳跃这一一维动力学约束模型中自旋电流的长时涨落，并提出三个显式振幅的极限分布猜想。\n2. 其技术核心是从微观XNOR动力学出发，在无拟合参数下预言均匀非零磁化、畴壁和零磁化初始态分别对应t^{1/4}高斯、t^{1/4}半正态及t^{1/8}M-Wright标度的电流分布，并获得数值支持。\n3. 这补全了迹机制对振幅的预言，也为该模型的严格数学证明及更广泛非平衡电流涨落研究提供了清晰方向。", "summary_source": "deepseek", "authors": [{"name": "Balázs Pozsgay"}], "featured_authors": [{"name": "Balázs Pozsgay"}], "author_count": 1}, {"id": "2608.10556", "category": "cond-mat", "title": "Topological states of generalized dissipative Majorana wires", "abstract": "We study the generalized one-dimensional (1D) quantum dissipative models corresponding to a Majorana wire which can possess more than one Majorana bound state at each end. The system consists of a 1D fermionic open quantum system whose dynamics is governed by a quadratic Lindblad equation. Using the adjoint Lindblad equation for the fermionic two-point correlations, we find the gaps in the damping and purity spectra of a generic 1D model. Then, using the symmetry-based classification, we show that a winding number as the topological invariant can be defined which distinguishes different steady states of the system in the presence of damping and purity gaps. Then we focus on certain models with different Lindblad quantum jump terms and explore their phase diagrams by calculating the damping and the purity gaps as well as the winding number. In particular, we show that by inclusion of quantum jumps between next-nearest-neighbor sites, higher winding numbers and, equivalently, more Majorana bound states can be achieved. Also, by introducing imbalanced couplings, we can switch between states with negative and positive winding numbers. Finally, we should mention that since our formulation is based on the fermionic correlations rather than the Majorana operators, it can be easily extended to the dissipative topological phases belonging to other symmetry classes.", "url": "https://arxiv.org/abs/2608.10556", "type": "理论+数值", "summary": "1. 该工作研究了一维广义耗散马约拉纳导线的开放量子系统，通过二次林德布拉德方程及费米子双点关联的伴随方程，分析了端点可存在多个马约拉纳束缚态的模型。\n2. 其技术卖点在于由阻尼谱和纯度谱能隙定义基于对称性分类的绕数不变量，并证明引入次近邻量子跳变可提升绕数、获得更多马约拉纳束缚态，而耦合失衡能翻转绕数符号。\n3. 由于该表述依托费米子关联而非马约拉纳算符，可自然推广至其他对称性类的耗散拓扑相，为耗散拓扑态的分类与调控提供了通用框架。", "summary_source": "deepseek", "authors": [{"name": "Farokhnaz Hosseinifar"}, {"name": "Ali G. Moghaddam"}], "featured_authors": [{"name": "Farokhnaz Hosseinifar"}, {"name": "Ali G. Moghaddam"}], "author_count": 2}, {"id": "2608.10639", "category": "cond-mat", "title": "Dynamical Crossover in Landau$-$Zener Tunneling in Dissipative Rydberg Lattices", "abstract": "In this work, we investigate the excitation dynamics of a Rabi-coupled dissipative Rydberg lattice with a time-dependent detuning. The system is analyzed using (i) a Lindblad master equation within a mean-field approximation and (ii) an effective non-Hermitian Hamiltonian framework. While the mean-field approach captures the emergence of an antiferromagnetic order in the Rydberg excitation profile, the non-Hermitian description provides direct insight into the complex energy spectrum and its avoided crossings, which govern the Landau$-$Zener dynamics. We identify a regime in which the sublattice population imbalance vanishes near the avoided crossing, resulting in identical Landau$-$Zener probabilities on the two sublattices. Beyond a critical effective blockade strength there is a dynamical crossover to another regime in which the sublattice population imbalance persists through the avoided crossing, giving rise to sublattice-dependent Landau$-$Zener probabilities. Furthermore, Rydberg interactions prolong the lifetime of Landau$-$Zener-induced excitations in the presence of weak dissipation and strong Rabi coupling. In contrast, for weak Rabi coupling, the Rydberg blockade inhibits excitation and suppresses the Landau$-$Zener transition probability.", "url": "https://arxiv.org/abs/2608.10639", "type": "理论+数值", "summary": "1. 该工作利用平均场Lindblad主方程与非厄米有效哈密顿量，研究含时失谐的Rabi耦合耗散里德伯晶格的激发动力学。\n2. 主要结果是在Landau-Zener隧穿中识别出动力学交叉：未超过临界有效阻塞强度时，子格布居差在避交附近消失，两个子格隧穿概率相同；超过后布居差保持，出现子格依赖的隧穿概率。\n3. 此外，弱耗散强耦合下相互作用延长激发寿命，而弱耦合下里德伯阻塞抑制隧穿，这为耗散量子模拟中调控非厄米跃迁动力学提供了思路。", "summary_source": "deepseek", "authors": [{"name": "Suvechha Indu"}, {"name": "Raka Dasgupta"}], "featured_authors": [{"name": "Suvechha Indu"}, {"name": "Raka Dasgupta"}], "author_count": 2}, {"id": "2608.10722", "category": "cond-mat", "title": "Two-component ultracold Bose gases with spin-orbit coupling", "abstract": "These lecture notes provide an introduction to Bose-Einstein condensates with Raman-induced spin-orbit coupling. Owing to the interplay between the peculiar single-particle dispersion, featuring a double-minimum structure, and the two-body interaction, these systems possess a complex phase diagram. Three different quantum phases can be observed, i.e., a stripe, a plane-wave, and a single-minimum phase, each characterized by different broken symmetries. The condensate dynamics is also significantly affected by the spin-orbit coupling, as revealed by the behavior of the Bogoliubov spectrum in infinite systems and the behavior of the discretized collective mode frequencies in trapped configurations, especially close to the phase transitions. In turn, the superfluid and rotational properties are also deeply modified by the coupling between the motional and spin degree of freedom. Finally, a special attention is devoted to the stripe phase and its supersolid character, which can be clearly revealed by the study of its dynamic features.", "url": "https://arxiv.org/abs/2608.10722", "type": "理论+数值", "summary": "1. 该工作以讲义形式系统介绍拉曼诱导自旋轨道耦合的双组分超冷玻色气体的理论框架、单粒子双阱结构及多体相图。\n2. 其核心卖点在于阐明双极小色散与两体相互作用如何生成条纹相、平面波相和单极小相等三种对称性破缺相，并借助 Bogoliubov 谱及囚禁集体模频率揭示相变附近和自旋-运动耦合对动力学的影响。\n3. 这为通过动态响应识别条纹相的超固体特性，并系统理解自旋-轨道耦合对超流以及转动性质的深层修正提供了明确理论指引。", "summary_source": "deepseek", "authors": [{"name": "G. I. Martone"}, {"name": "S. Stringari"}], "featured_authors": [{"name": "G. I. Martone"}, {"name": "S. Stringari"}], "author_count": 2}, {"id": "2608.10735", "category": "cond-mat", "title": "Quantum Mechanism of Piezomagnetism in Higher-Spin Altermagnets", "abstract": "We investigate piezomagnetism in higher-spin altermagnets with easy-plane single-ion anisotropy using a flavor-wave approach. We show that quantum fluctuations of higher-spin collective modes provide a microscopic origin of the piezomagnetic response. For integer spins, the relevant branch softens and evolves into a Higgs-like amplitude mode on approaching the large-$D$ transition, endowing the excitation with a sizable dipolar component and producing a pronounced enhancement of piezomagnetism. By contrast, in half-integer systems the higher-spin branches are progressively separated from the low-energy dipolar sector as the anisotropy increases, which suppresses their contribution to the response. This integer-half-integer contrast directly links macroscopic piezomagnetism to the low-energy fate of multipolar excitations. Our results establish piezomagnetism as a probe of higher-spin quantum dynamics and identify higher-spin altermagnets as a promising setting for quantum magnetoelastic responses.", "url": "https://arxiv.org/abs/2608.10735", "type": "理论", "summary": "1. 该工作采用flavor-wave方法研究具有易平面单离子各向异性的高自旋交错磁体中的压磁效应，证明高自旋集体模的量子涨落是压磁响应的微观起源。\n2. 其核心在于发现整数自旋时相关支模在接近大D跃迁处软化并演化为类Higgs幅度模，获得可观偶极分量从而显著增强压磁；半整数则因高自旋支模与低能偶极扇区分离而抑制响应，形成清晰对照。\n3. 这使宏观压磁成为探测高自旋多极激发低能行为的探针，并指明高自旋交错磁体是量子磁弹性响应的有前景平台。", "summary_source": "deepseek", "authors": [{"name": "Daisuke Yamamoto"}, {"name": "Makoto Naka"}], "featured_authors": [{"name": "Daisuke Yamamoto"}, {"name": "Makoto Naka"}], "author_count": 2}, {"id": "2608.10747", "category": "cond-mat", "title": "Composite-Boson Ansatz for Fractional Quantum Hall Manifolds of Lattice Bosons at Generic Fillings $ν<1/2$", "abstract": "Hofstadter systems provide a lattice route to fractional quantum Hall physics, but their low-energy manifolds often lack simple wave-function descriptions. Here we present a composite-boson ansatz for a broad family of finite-size lattice-split Laughlin-quasihole manifolds in the low-flux Hofstadter--Bose--Hubbard model on a torus at generic fillings \\(\\nu<1/2\\). Attaching two vortices to each boson yields reduced-flux orbitals from which we construct a many-body trial basis. Its translation-resolved rank reproduces the expected low-energy-manifold dimension and provides a composite-boson interpretation of the established quasihole counting previously inferred from generalized exclusion rules and thin-torus arguments. For smaller systems, diagonalization within the lowest-band-projected ansatz span closely reproduces the exact projected spectrum, while variational Monte Carlo extends the rank and energetic analysis to larger systems for which explicit subspace construction becomes costly. To probe the fractional quantum Hall character of these manifolds, we calculate their many-body Chern-numbers and show that localized added-flux excitations exhibit quasihole-like behavior, with fractional density depletion and an Aharonov--Bohm-free braiding phase that both track the effective filling. Together, these results establish a microscopic composite-boson framework for organizing a broad family of sub-half-filled fractional quantum Hall manifolds of lattice bosons.", "url": "https://arxiv.org/abs/2608.10747", "type": "理论+数值", "summary": "1. 该工作针对环面低通量Hofstadter-Bose-Hubbard模型在通用填充ν<1/2下的有限尺寸Laughlin准空穴流形，提出了复合玻色子拟设。\n2. 其技术核心是给每个玻色子绑定两个涡旋构成约化磁通轨道，所得多体试探基的平移分辨维度与低能流形一致，小系统投影对角化复现精确谱，大系统用变分蒙特卡洛推进秩与能量分析。\n3. 多体陈数及准空穴的分数密度亏损和无Aharonov-Bohm效应的编织相位均随有效填充变化，确立了组织亚半填充格点玻色子分数量子霍尔流形的微观框架。", "summary_source": "deepseek", "authors": [{"name": "Umut Can Turhan"}, {"name": "A. Levent Subaşı"}, {"name": "Rifat Onur Umucal\\ilar"}], "featured_authors": [{"name": "Umut Can Turhan"}, {"name": "A. Levent Subaşı"}, {"name": "Rifat Onur Umucal\\ilar"}], "author_count": 3}, {"id": "2608.10759", "category": "cond-mat", "title": "Scalable Size- and Shape-Selective Purification of Colloidal Building Blocks via Excluded Volume Interactions", "abstract": "Excluded-volume interactions, arising solely from steric constraints, play a crucial role in determining the structure, dynamics, and phase behaviour of colloidal suspensions. This is particularly important for non-spherical particles, where orientation-dependent effects also become significant. In this study, we employ depletion-driven phase separation to develop a scalable, size-selective method for purifying spherical and non-spherical colloidal clusters that exhibit an interplay of concave and convex surface areas. Phase diagrams of charge-stabilised polystyrene spheres ranging in size from 267 to 1008 nm demonstrate that the mixing-demixing transition occurs across a range of surfactant concentrations rather than at a single threshold. Taking advantage of this transition width enables the purification of a single component from binary mixtures at size ratios as low as 1.6 in a single step. When the same approach is applied to tetrameric colloidal clusters, these are enriched fifteenfold relative to uncoordinated spheres. Importantly, the efficiency of sorting depends not only on the effective size but also on the geometry of the aggregate. For instance, anisotropic, weakly fused clusters separate more efficiently than spherical aggregates because their concave surface curvature is reduced compared to unfused clusters. These findings establish excluded-volume-driven sorting as a practical and scalable route for purifying colloidal building blocks for hierarchical assembly.", "url": "https://arxiv.org/abs/2608.10759", "type": "理论+数值", "summary": "1. 该工作利用仅由空间位阻产生的耗尽体积相互作用驱动相分离，提出并验证了一种可扩展的胶体构筑基元的尺寸与形状选择性纯化方法。\n2. 其核心在于利用电荷稳定聚苯乙烯球体系混合-去混合转变在表面活性剂浓度上的转变宽度，而非单一阈值，从而在尺寸比低至1.6的二元混合物中一步提纯单一组分，并使四聚体簇相对未配位球体富集十五倍。\n3. 工作进一步揭示分选效率不仅取决于有效尺寸，还与聚集体几何相关，弱融合各向异性簇因凹曲率减小而分离更高效，这为层级组装的各向异性构筑基元规模化提纯提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Thomas Kainz"}, {"name": "Isobel McSweeney"}, {"name": "Andrei-Micea Top"}, {"name": "Nicolas Bruder"}, {"name": "David J. Pine"}, {"name": "Andrea Dodero"}, {"name": "Ullrich Steiner"}], "featured_authors": [{"name": "Thomas Kainz"}, {"name": "Isobel McSweeney"}, {"name": "Andrei-Micea Top"}, {"name": "David J. Pine"}, {"name": "Andrea Dodero"}, {"name": "Ullrich Steiner"}], "author_count": 7}, {"id": "2608.10768", "category": "cond-mat", "title": "High-pressure electride superconductor Li5N for multifunctional applications: A theoretical insight into the physical properties", "abstract": "This study aims to unveil the physical properties of multifunctional Li5N electride under high pressure in the range of 150-350 GPa through first principles analysis within the density functional theory.", "url": "https://arxiv.org/abs/2608.10768", "type": "理论+数值", "summary": "1. 该工作通过基于密度泛函理论的第一性原理计算，在150至350 GPa高压范围内系统考察了多功能电子化合物Li5N的晶体结构、电子结构与超导电性等物理性质。\n2. 其核心发现是Li5N在高压下以电子化合物形态稳定存在，且呈现超导转变，揭示了压力调控电子局域化与电声耦合对超导电性的关键作用。\n3. 这一理论图像为高压合成Li5N及其在极端条件下多功能应用（如超导与能量相关器件）的后续实验提供了明确方向与物性依据。", "summary_source": "deepseek", "authors": [{"name": "M. Abdul Hadi Shah"}, {"name": "S.H. Naqib"}], "featured_authors": [{"name": "M. Abdul Hadi Shah"}, {"name": "S.H. Naqib"}], "author_count": 2}, {"id": "2608.10862", "category": "cond-mat", "title": "Noise-Induced Localized Patterns in Excitable Media: Amplitude versus Persistence", "abstract": "Transient spatially localized activity underlies a broad range of biological processes, yet the statistical property of fluctuations that controls its nucleation remains unclear. We systematically investigate noise-induced dynamics in a spatially extended FitzHugh-Nagumo excitable system and identify three regimes: a quiescent phase, a spatially extended alternating phase, and a pattern-forming phase characterized by transient localized excitation patches. Surprisingly, we find that temporal noise correlations are not required for patch formation: Gaussian white noise produces localized patches when its amplitude is sufficiently large, whereas weaker fluctuations can achieve the same effect when temporal correlations allow them to persist. Our results identify the instantaneous amplitude and the persistence as joint stochastic control parameters for transient pattern formation in excitable media. These distinct quantities are linked through the integrated noise strength, which quantifies the accumulated stochastic forcing available to nucleate an excitation. In addition, the inhibitor response time subsequently determines whether the excitation remains localized or spreads throughout the system.", "url": "https://arxiv.org/abs/2608.10862", "type": "理论", "summary": "1. 该工作系统研究了空间扩展FitzHugh-Nagumo可激系统中噪声诱导的瞬态局域斑图，划分出静息、交替和图案形成三种动力学区间。\n2. 其核心发现是确立噪声瞬时幅度与时间持续性为联合随机控制参数：白噪声仅需足够幅度即可成斑，弱关联噪声则依赖持续累积，二者由积分噪声强度统一刻画，且抑制剂响应时间决定激发局域还是扩散。\n3. 这为可激介质中瞬态局部活动的成核统计提供了随机控制框架，并为调控生物激发斑图的产生与空间范围指明了明确的参数途径。", "summary_source": "deepseek", "authors": [{"name": "Chau Dao"}, {"name": "Jr-Ming Yang"}, {"name": "Chuan-Hsiang Huang"}, {"name": "Gia-Wei Chern"}], "featured_authors": [{"name": "Chau Dao"}, {"name": "Jr-Ming Yang"}, {"name": "Chuan-Hsiang Huang"}, {"name": "Gia-Wei Chern"}], "author_count": 4}, {"id": "2608.10868", "category": "cond-mat", "title": "Analytical Theory for Anomalous Diffusion in the Anderson Model with Heavy Tails", "abstract": "We develop an analytical theory of anomalous transport in a noninteracting Anderson model with heavy-tailed hopping amplitudes. The broad distribution of hopping amplitudes gives rise to an extended intermediate-time regime with a subdiffusive effective exponent, despite the absence of interactions or genuine many-body effects. By solving the transport equations analytically, we derive the time dependence of the mean-square displacement and identify a continuous crossover from an intermediate anomalous regime to asymptotically diffusive transport. As the localization transition is approached, the spatial extent of the subdiffusive window diverges parametrically, while the crossover to conventional diffusion remains finite in units of $\\Gamma_0^{-1}$. This produces an increasingly broad anomalous transport regime in space that can closely resemble Griffiths-type transport observed near the many-body localization transition. Our results demonstrate that rare hopping processes alone provide a microscopic single-particle mechanism for robust transport anomalies, establishing an analytical benchmark for distinguishing interaction-induced effects from disorder-driven dynamics.", "url": "https://arxiv.org/abs/2608.10868", "type": "理论", "summary": "1. 该工作针对具有重尾跳跃振幅的无相互作用安德森模型，解析建立了反常输运理论。\n2. 其核心在于严格求解输运方程，得到均方位移的时间依赖并使中间亚扩散区连续过渡到渐近正常扩散；趋近局域化转变时，亚扩散窗口在空间上参数性发散。\n3. 这证明稀有跳跃过程本身即可产生类似多体局域化附近Griffiths型的输运异常，为甄别相互作用效应与纯无序驱动力学提供了单粒子解析基准。", "summary_source": "deepseek", "authors": [{"name": "Elizaveta Safonova"}, {"name": "Aleksey Lunkin"}, {"name": "Mikhail Feigel'man"}], "featured_authors": [{"name": "Elizaveta Safonova"}, {"name": "Aleksey Lunkin"}, {"name": "Mikhail Feigel'man"}], "author_count": 3}, {"id": "2608.10902", "category": "cond-mat", "title": "Oscillation modes of skyrmion strings in a ferromagnetic film", "abstract": "It is shown that a skyrmion string in a ferromagnetic film consisting of $N$ atomic layers exhibits flexural oscillations at eigenfrequencies $|\\omega_{m}|=(4J'S/\\hbar)\\sin^{2}[\\pi m/(2N)]$, where $J'$ is the interlayer exchange coupling, $S$ is the length of the atomic spin, and $m=1,...,N-1$. This result is confirmed numerically for individual skyrmion strings in a discrete microscopic spin-lattice model of up to ten atomic layers, as well as for skyrmion-string lattices at finite temperature.", "url": "https://arxiv.org/abs/2608.10902", "type": "理论+数值", "summary": "1. 该工作研究铁磁薄膜中由N个原子层构成的skyrmion弦的弯曲振荡模式，导出了其本征频率的严格离散谱。\n2. 主要技术点在于给出解析本征频率|ω_m|=(4J'S/ℏ)sin²(πm/2N)，并利用最多十层的自旋晶格模型及有限温度弦晶格数值验证。\n3. 该结果揭示了层间交换耦合对拓扑孤子弦动力学的影响，为层状磁性材料中自旋波调控与磁孤子器件应用提供了直接启发。", "summary_source": "deepseek", "authors": [{"name": "Eugene M. Chudnovsky"}, {"name": "Dmitry A. Garanin"}], "featured_authors": [{"name": "Eugene M. Chudnovsky"}, {"name": "Dmitry A. Garanin"}], "author_count": 2}, {"id": "2608.10948", "category": "cond-mat", "title": "Steady-state phase transition in one-dimensional hybrid contact process", "abstract": "We investigate the steady-state phase transition in a one-dimensional hybrid contact process. We implement the single-site and cluster mean-field approximations based on the effective fields and present all the possible steady states of the system. We show the existence of the stable absorbing and active phases, and the bistable region in the long-time limit. The saddle-node bifurcation is observed at the boundary between the absorbing phase and the bistable region, suggesting a discontinuous phase transition. While the absorbing to active phase transition is continuous. To characterize the nonclassical scaling behavior of the continuous phase transition, we extract the true critical points and exponents by means of the coherent anomaly method.", "url": "https://arxiv.org/abs/2608.10948", "type": "理论", "summary": "1. 该文研究一维混合接触过程的稳态相变，基于有效场实现单点和团簇平均场近似，给出系统全部可能稳态。\n2. 其要点是在长时极限中发现稳定吸收相、活性相及双稳区，吸收相与双稳区边界出现鞍结分岔，表明不连续相变，而吸收-活性相变为连续相变。\n3. 借助相干反常方法提取连续相变的真实临界点与临界指数，为非经典标度行为的精确刻画和后续非平衡相变普适性研究提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Lin Shang"}, {"name": "Shuai Geng"}, {"name": "Xingli Li"}, {"name": "Jiasen Jin"}], "featured_authors": [{"name": "Lin Shang"}, {"name": "Shuai Geng"}, {"name": "Xingli Li"}, {"name": "Jiasen Jin"}], "author_count": 4}, {"id": "2608.10958", "category": "cond-mat", "title": "Spin Splitter without Spin-Split Bands: A Reconfigurable Altermagnetic Texture", "abstract": "The altermagnetic spin-splitter effect converts an electric field into a transverse pure spin current, with no net magnetization and no charge-Hall counterpart. In established materials this function is tied to crystal-fixed spin-split bands that lock the polarization axis to the lattice. We show that the noncoplanar counter-spiral ground state of a frustrated honeycomb magnet instead carries the altermagnetic operation through a $\\mathbf Q$-locked helicity mirror $g$. The mirror selects the spin-current polarization and forbids the perpendicular one, while an antitranslation $\\Theta$ forbids even-parity spin splitting. Band splitting and spin-splitter response therefore rest on different symmetry elements. Either element alone enforces the charge-Hall zero---a redundancy absent from other spin--orbit-free noncollinear routes---and a charge Hall appears only when both elements are removed. Hole doping then realizes a \\emph{spin splitter without spin-split bands}---the symmetry-allowed odd-parity residual below $2\\times10^{-7}$ of the hopping $t$ at the Fermi level---with $\\sigma_H^{(s_y)}=0.082\\,e^2/h$ without spin--orbit coupling and with zero charge Hall response. Selecting among the three degenerate $\\mathbf{Q}$ orientations rotates the polarization axis in exact $120^\\circ$ steps at fixed magnitude and charge-Hall zero; the selection rules persist in a $32$-site cell accessible to programmable photonic and circuit lattices.", "url": "https://arxiv.org/abs/2608.10958", "type": "理论", "summary": "1. 该工作证明，阻挫蜂窝磁体的非共面反向螺旋基态可通过Q锁定的螺旋镜像g实现交变磁自旋分离，在无自旋劈裂能带下将电场转为横向纯自旋流。\n2. 其核心在于自旋流极化由镜像对称性决定，而反平移禁止偶宇称劈裂，能带劈裂与自旋分离由不同对称元素控制，残余奇宇称分量低于2×10⁻⁷t，自旋霍尔电导达0.082 e²/h且无电荷霍尔响应。\n3. 选择三个简并Q取向可在固定幅度下以精确120°步长旋转极化轴，该选择规则在32位点可编程光子与电路晶格中持续存在，为可重构自旋电子学器件提供平台。", "summary_source": "deepseek", "authors": [{"name": "Bin Xi"}, {"name": "Jie Lu"}, {"name": "Qiang Luo"}, {"name": "Ken Chen"}, {"name": "Jia-Wei Mei"}, {"name": "Hong-Gang Luo"}, {"name": "Jize Zhao"}], "featured_authors": [{"name": "Bin Xi"}, {"name": "Jie Lu"}, {"name": "Qiang Luo"}, {"name": "Jia-Wei Mei"}, {"name": "Hong-Gang Luo"}, {"name": "Jize Zhao"}], "author_count": 7}, {"id": "2608.11004", "category": "cond-mat", "title": "Influence of interactions on the chiral effect in $1D$ Dirac semimetal", "abstract": "We consider the 1D Su-Schrieffer-Heeger (SSH) model. It was recently shown that, for the noninteracting model in its Dirac semimetal phase, the linear response of the axial charge density to an external electric field is proportional to the electrical conductivity in the presence of finite dissipation, with the proportionality factor determined by the coupling constants. This relation may be viewed as a manifestation of the chiral effect, which is a dimensional reduction of the 3D chiral magnetic effect. In the present work, we investigate the same model in the presence of two versions of local Hubbard-type interactions using numerical Quantum Monte Carlo simulations. We find, within the numerical resolution and for the parameters studied, that, even in the regime where sufficiently strong interactions drive the system into a Mott insulating phase, the proportionality between the induced axial charge density and the electrical conductivity remains unchanged. This result indicates that the chiral effect is not renormalized by local Hubbard interactions.", "url": "https://arxiv.org/abs/2608.11004", "type": "理论+数值", "summary": "1. 该工作通过量子蒙特卡洛模拟研究一维SSH狄拉克半金属中两类局域Hubbard型相互作用对轴向荷密度-电导率线性响应比例关系（三维手征磁效应降维得到的手征效应）的影响。\n2. 主要结果是，在数值精度及所取参数范围内，即便足够强的相互作用将系统驱动至Mott绝缘相，该比例关系以及由耦合常数决定的比例因子仍保持不变。\n3. 这表明局域Hubbard相互作用不会对手征效应产生重整化修正，为强关联体系中手征输运的稳定性与适用范围提供了明确约束。", "summary_source": "deepseek", "authors": [{"name": "Maksim Ulybyshev"}, {"name": "M.A.Zubkov"}], "featured_authors": [{"name": "Maksim Ulybyshev"}, {"name": "M.A.Zubkov"}], "author_count": 2}, {"id": "2608.11021", "category": "cond-mat", "title": "Universal scaling of spatially extended zero modes in inhomogeneous SSH chains", "abstract": "Protected zero modes are a hallmark of topological phases of matter and are exponentially localized at sharp interfaces between distinct gapped phases. We investigate how this picture changes for smooth interfaces in a broad class of inhomogeneous Su-Schrieffer-Heeger (SSH) models. Combining an exact lattice solution with an inhomogeneous Dirac description, we show that the associated Jackiw-Rebbi zero mode becomes spatially extended. For arbitrary smooth hopping profiles, its lattice extension universally scales as the square root of the system size, independently of the microscopic details of the interface. This emergent length defines a mesoscopic critical region separating two gapped phases, within which correlations decay algebraically before crossing over to exponential decay. In addition, the entanglement entropy scales as the logarithm of the emergent length near the interface, confirming the interpretation of a mesoscopic critical region. Our results establish a universal critical length governing the low-energy physics of smooth topological interfaces.", "url": "https://arxiv.org/abs/2608.11021", "type": "理论", "summary": "1. 该工作通过精确晶格解与非均匀狄拉克描述，研究了广类非均匀Su-Schrieffer-Heeger模型中光滑界面处的Jackiw-Rebbi零模，发现其从指数局域变为空间延展。\n2. 核心卖点是：任意光滑跳跃轮廓下零模的晶格延展长度普适地随系统尺寸的平方根标度，与界面微观细节无关；该长度定义介观临界区，其中关联先代数衰减后指数衰减，纠缠熵按该长度对数增长。\n3. 这建立了控制光滑拓扑界面低能物理的普适临界长度，为调控拓扑界面态、理解体边对应在平滑结中的推广提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Gilles Parez"}, {"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Luc Vinet"}], "featured_authors": [{"name": "Gilles Parez"}, {"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Luc Vinet"}], "author_count": 5}, {"id": "2608.11039", "category": "cond-mat", "title": "Boundary-layer analysis of the partial engulfment of a small particle by a lipid membrane", "abstract": "We study the axisymmetric partial engulfment of a small rigid sphere by a fluid Helfrich membrane. When the size ratio $\\eps$ between the particle and the membrane is small, the neck that joins the wrapped cap to the surrounding membrane is an elastic boundary layer, and we analyse it by matched asymptotic expansions. The leading inner surface is a catenoid, a minimal surface that stores no Helfrich energy, so that the energy of partial engulfment is carried by the first correction and appears only at order $\\eps^{2}\\ln(1/\\eps)$. We obtain it by solving the inhomogeneous Jacobi equation of the catenoid, forced by the spontaneous curvature and by the ambient mean curvature that the neck must match, and we give its coefficient in closed form. The boundary layer can then be integrated out, and the neck replaced by a scalar self-energy carried at the pole, so that the outer field can be closed independently of the inner one. For a membrane coupled to a tension reservoir we derive the binding threshold, which turns out to be independent of both the tension and the spontaneous curvature, the complete-wrapping threshold, and the hysteresis of the envelopment transition. The neck self-energy law is confirmed against the full nonlinear shape equations.", "url": "https://arxiv.org/abs/2608.11039", "type": "理论", "summary": "1. 该工作用匹配渐近展开分析了小刚性球被流体Helfrich膜轴对称部分吞没的颈部弹性边界层。\n2. 技术要点在于前导颈部为不储Helfrich能量的悬链面极小面，吞没能由非齐次Jacobi方程解出的一阶修正携带，呈ε²ln(1/ε)量级，并可将边界层积分为极点标量自能而闭合外部解。\n3. 由此得到与张力和自发曲率无关的结合阈值、完全包裹阈值及包吞滞回，且自能律经完整非线性形状方程验证，为膜吞没转变提供可移植的有效描述。", "summary_source": "deepseek", "authors": [{"name": "Gaetano Napoli"}], "featured_authors": [{"name": "Gaetano Napoli"}], "author_count": 1}, {"id": "2608.11041", "category": "cond-mat", "title": "Jamming transition in an active exclusion process", "abstract": "Multiple studies on active matter have shown that activity can induce or suppress a phase transition, or modify the critical behavior of a passive system. Here we investigate how activity affects the jamming transition which is a paradigmatic example of nonequilibrium phase transitions in passive systems. We consider a one-dimensional system of active particles with hardcore interactions and a direction of self-propulsion which can be reversed at a given switching rate. For a class of particle hop rates and infinite switching rate, our model reduces to a passive system which is known to exhibit a transition between a high-density fluid phase and a low-density jammed phase in the stationary state. Using Monte Carlo simulations and a mean field theory, we study how the mean mobility of the particle and the hole cluster distribution vary with density and finite switching rate. Our main result is that activity hinders the formation of jam and can even inhibit it; more precisely, we find that the jamming transition occurs at a critical density that decreases with decreasing switching rate, and at sufficiently small switching rate, the system exists only in the fluid phase.", "url": "https://arxiv.org/abs/2608.11041", "type": "理论+数值", "summary": "1. 该工作通过Monte Carlo模拟和平均场理论，研究了一维硬核主动排斥过程中由方向翻转率调控的堵塞相变。\n2. 其核心发现是有限活性阻碍堵塞形成：临界堵塞密度随翻转率降低而减小，足够小的翻转率下系统仅存在流体相。\n3. 这为理解活性如何调控非平衡相变提供了具体机制，并启发在主动粒子系统中设计或抑制堵塞态。", "summary_source": "deepseek", "authors": [{"name": "Kavita Jain"}, {"name": "Sakuntala Chatterjee"}], "featured_authors": [{"name": "Kavita Jain"}, {"name": "Sakuntala Chatterjee"}], "author_count": 2}, {"id": "2608.11073", "category": "cond-mat", "title": "A Dynamical Mechanism for Irreversibility in Cyclically Driven Amorphous Solids", "abstract": "Amorphous solids subjected to athermal quasistatic oscillatory shear undergo a transition from periodic reversible dynamics to irreversible diffusive dynamics at yielding. How irreversibility arises in such deterministic, dissipative dynamics remains unclear. Here we show that trajectories remain locally stable, with perturbations decaying rather than growing even in the irreversible regime, ruling out the sustained exponential sensitivity to initial conditions associated with chaotic dynamics. Rather than diverging continuously, nearby trajectories initially remain close before eventually separating through rare branching events, after which their separation grows diffusively. A mean-field soft-spot model reproduces the same branching statistics and reveals their microscopic origin. We find that branching originates from competition between nearly-degenerate plastic instabilities, in which a small perturbation changes which instability activates first and thereby alters the subsequent sequence of plastic events. These results identify instability-selection-induced branching as a dynamical mechanism for irreversibility in cyclically driven amorphous solids.", "url": "https://arxiv.org/abs/2608.11073", "type": "理论", "summary": "1. 该工作研究非晶固体在循环剪切中的可逆—不可逆转变，提出由塑性失稳选择导致的分支作为不可逆性的动力学机制。\n2. 其核心在于证明不可逆区轨迹仍局部稳定、扰动衰减而非混沌增长，分离由罕见分支事件触发后呈扩散增长，并以平均场软点模型揭示近简并非晶塑性失稳的竞争是关键。\n3. 这为循环载荷下非晶固体的可逆性丧失及屈服等临界现象提供了微观起源，可启发后续从失稳选择角度理解玻璃态动力学。", "summary_source": "deepseek", "authors": [{"name": "Sauvik Chatterjee"}, {"name": "Asaf Szulc"}, {"name": "Ido Regev"}], "featured_authors": [{"name": "Sauvik Chatterjee"}, {"name": "Asaf Szulc"}, {"name": "Ido Regev"}], "author_count": 3}, {"id": "2608.11104", "category": "cond-mat", "title": "Exact Expressions of Entropy for Classical Non-interacting Many-body Systems", "abstract": "In the thermodynamic limit, the equilibrium state of a many-body system can be characterized by three pairs of conjugate thermodynamic variables: $E/T,V/P,N/\\mu$. In this limit, the thermodynamic properties in all ensembles are equivalent up to the leading order of $E,V,N$. However, for systems of finite size, this ensemble equivalence is no longer exact, and the thermodynamic properties may differ substantially among ensembles. To quantify these finite-size effects rigorously, it is desirable to develop a universal ensemble theory applicable to systems of arbitrary size, providing exact expressions for entropy and, thereby, giving rise to the precise value of all equilibrium thermodynamic quantities. In this work, we propose a theory that determines the exact entropy expressions for classical non-interacting many-body systems of arbitrary size across all statistical ensembles, based on only two postulates: \\textbf{stationarity}, requiring that the physical laws be invariant under time translation, and \\textbf{unbiasedness}, requiring that the equilibrium mixed state maximize the entropy subject to the prescribed constraints. Moreover, we show that the entropy expressions obtained in different ensembles converge to the common asymptotic form $S \\asymp \\ln\\!\\left( \\left( \\frac{4\\pi m e E}{3N} \\right)^{3N/2} \\cdot \\left(\\frac{V}{N}\\right)^N \\right)+N$, consistent with the predictions of the large deviation theory.", "url": "https://arxiv.org/abs/2608.11104", "type": "理论", "summary": "1. 该工作提出基于平稳性与无偏性公设的普适系综理论，推导出任意尺寸经典非相互作用多体系统在各系综的精确熵表达式。\n2. 其卖点在于严格界定有限尺寸导致的系综不等价性，所得熵在各系综收敛至与大道偏差理论一致的普适渐近形式。\n3. 这为任意尺寸平衡系统的热力学量精确计算及有限尺寸效应统一描述提供了新框架，可望推广至量子或相互作用体系。", "summary_source": "deepseek", "authors": [{"name": "Yuheng Wu"}, {"name": "Henrik Heelweg"}, {"name": "Rigel Galgana"}], "featured_authors": [{"name": "Yuheng Wu"}, {"name": "Henrik Heelweg"}, {"name": "Rigel Galgana"}], "author_count": 3}, {"id": "2608.11184", "category": "cond-mat", "title": "Microscopic derivation of a field equation for active Brownian particles", "abstract": "To understand the phenomena displayed in active phase separation, general top-down theories like Active Model B+ (AMB+) add fluxes that break time reversal symmetry. Starting from an Enskog-like kinetic theory of hard-core active Brownian particles in the high persistence regime, we derive AMB+ from first principles. For the effective free energy to have two minima, we propose an effective parametrization of the pair correlation function. Explicit expressions for all coefficients in the model are given as a function of the microscopic parameters to leading order in the Péclet number.", "url": "https://arxiv.org/abs/2608.11184", "type": "理论", "summary": "1. 该工作从硬芯活性布朗粒子的Enskog型动理学理论出发，在高持续性极限下首次微观推导出主动相分离的唯象场方程Active Model B+。\n2. 其核心在于通过对对关联函数引入有效参数化使自由能呈双阱形式，并给出所有系数关于微观参数的首阶Péclet数显式表达式。\n3. 这为连接主动粒子微观相互作用与宏观相分离动力学提供了第一性原理桥梁，并可作为检验或推广AM B+类连续场理论的基准。", "summary_source": "deepseek", "authors": [{"name": "Martín Pinto-Goldberg"}, {"name": "Rodrigo Soto"}], "featured_authors": [{"name": "Martín Pinto-Goldberg"}, {"name": "Rodrigo Soto"}], "author_count": 2}, {"id": "2608.11186", "category": "cond-mat", "title": "Skin-Anderson Localization Transition in Strongly Coupled Disordered Non-Hermitian Chains", "abstract": "The interplay between disorder and non-Hermitian effects gives rise to a variety of intriguing localization phenomena. While disorder tends to localize the eigenstates through Anderson localization, non-Hermitian non-reciprocity promotes the formation of skin modes by driving the eigenstates toward the system boundaries giving rise to non-Hermitian skin effect (NHSE). In this work, we investigate the interplay between these competing mechanisms in a two-leg ladder consisting of a Hatano-Nelson chain coupled to a Hermitian chain via asymmetric inter-chain hopping, with strong disorder present in both chains. We show that tuning the asymmetry of the inter-chain coupling induces successive transitions in the nature of the eigenstates, from skin localization to Anderson localization and subsequently back to skin localization. Remarkably, the non-Hermitian skin effect re-emerges even though the energy spectrum exhibits a line-gap topology, demonstrating that robust skin localization can persist beyond the conventional point-gap regime.", "url": "https://arxiv.org/abs/2608.11186", "type": "理论", "summary": "1. 该工作研究强无序非厄米梯子中局域化与趋肤效应的竞争，具体分析了Hatano-Nelson链经非对称链间耦合与厄米链构成的复合系统。\n2. 其主要卖点是揭示调节链间耦合非对称性可使本征态依次经历趋肤局域化、安德森局域化再回到趋肤局域化，且线隙拓扑下趋肤效应仍能复活。\n3. 这一结果表明稳健的趋肤局域化可超越传统点隙拓扑框架，为重新审视非厄米体边对应及无序系统中的拓扑分类提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "S Rahul"}], "featured_authors": [{"name": "S Rahul"}], "author_count": 1}, {"id": "2608.11189", "category": "cond-mat", "title": "Floquet Green's functions for lattice electrons driven by Gaussian quantum light", "abstract": "We formulate Floquet Green's functions for noninteracting single-band lattice electrons driven by a reservoir-stabilized single-mode Gaussian quantum light source. The source is prescribed externally and is not updated by the many-electron polarization, while an active electronic probe still conditions the source evolution through the Peierls coupling. The two time arguments of a Green's function share one source history: the lesser and greater components are obtained by convolving a shared-history four-endpoint kernel with the continuous bath kernels before the final source trace, while the bath canonical anticommutation relation yields an equal-time covariance that seeds the retarded and advanced one-leg propagations. The Peierls coupling is treated nonperturbatively within the prescribed-source model, and classical Floquet theory is recovered in the appropriate limit. Numerical calculations on a minimal one-dimensional model show finite-coupling quantum-source corrections beyond a prescribed classical drive, together with spectral reconstruction and occupancy redistribution for squeezed vacuum and squeezed coherent sources. The squeezing parameter and phase provide additional control knobs, beyond classical amplitude modulation, for both sideband structure and occupied weight. This work provides a theoretical framework for quantum Floquet engineering of condensed matter with an externally prescribed quantum light source.", "url": "https://arxiv.org/abs/2608.11189", "type": "理论+数值", "summary": "1. 该工作提出了由储层稳定单模高斯量子光源驱动的无相互作用单带晶格电子的Floquet格林函数理论框架。\n2. 其核心在于让格林函数双时间参数共享同一源历史，经共享历史四端点核与连续浴核卷积后作源迹，非微扰处理Peierls耦合并恢复经典Floquet极限。\n3. 一维模型数值展示了量子源修正对谱重构与占据重排的作用，表明压缩参数与相位可作为量子Floquet工程的额外调控旋钮。", "summary_source": "deepseek", "authors": [{"name": "Atsushi Ono"}], "featured_authors": [{"name": "Atsushi Ono"}], "author_count": 1}, {"id": "2608.11192", "category": "cond-mat", "title": "Floquet Engineering of Topological Phases and Magneto-Optical Response in a Driven $d$-wave Altermagnet", "abstract": "We study how Floquet driving with linearly polarized light controls the topology and magneto-optical response of a two-dimensional (2D) $d$-wave altermagnet. In the absence of linearly polarized optical field and under spin conservation, we find that the system hosts a spin-Chern (a quantum-spin-Hall analog) phase with Chern numbers of opposite sign in the two spin sectors. The irradiated optical field breaks the $C_{4z}\\mathcal{T}$ crystalline antiunitary symmetry between the spin sectors. Symmetry breaking originates from polarization-dependent Peierls phases, which renormalize hopping anisotropically along the two axes. The resulting spin-selective gap closures produce intermediate Chern-insulating phases with $C=\\pm1$. The drive amplitude $A_0$ determines the inversion thresholds, while rotating the polarization by $\\pi/2$ swaps the spin sectors and reverses the Chern number. Using the Kubo formalism, we compute the frequency-dependent longitudinal and Hall conductivities and derive the corresponding Faraday and Kerr rotations for a free-standing conducting sheet. The longitudinal response tracks the Floquet-renormalized interband thresholds, whereas the optical Hall response, together with the sign of the magneto-optical rotations, distinguishes the two opposite Berry-curvature chiralities. Sizable Kerr angles occur only within narrow resonant windows and should be interpreted together with the reflected intensity and Kerr ellipticity. These results identify linearly polarized light as a symmetry-selective handle for spin-resolved band inversion, Chern-number switching, and contact-free optical detection in $d$-wave altermagnets.", "url": "https://arxiv.org/abs/2608.11192", "type": "理论+数值", "summary": "1. 该工作研究线偏振光Floquet驱动下二维d波交变磁体的拓扑相与磁光响应，发现无光时系统呈现自旋陈数相反的自旋陈绝缘体相。\n2. 主要卖点：偏振相关的Peierls相位打破自旋扇区间的C4zT反幺正对称性，各向异性重整跃迁诱发自旋选择性带隙闭合，形成陈数C=±1的中间陈绝缘体；Kubo方法计算的霍尔电导与Faraday/Kerr旋转可区分相反Berry曲率手性。\n3. 这表明线偏振光可作为对称性选择手柄，用于自旋分辨能带反转、陈数切换及无接触光学探测，为交变磁体光调控提供具体方向。", "summary_source": "deepseek", "authors": [{"name": "Muzamil Shah"}], "featured_authors": [{"name": "Muzamil Shah"}], "author_count": 1}, {"id": "2608.11202", "category": "cond-mat", "title": "Exact First-Passage Time Response Theory from Steady-State Response", "abstract": "The mean first-passage time (MFPT) provides a universal temporal measure of transport, reaction, search, and switching processes in physical, chemical, and biological systems. Understanding how MFPTs respond to perturbations is therefore crucial for prediction and control, yet a systematic theory has been lacking. We establish a compact theoretical framework for linear and nonlinear MFPT response in continuous-time Markov processes. The key tool is an exact correspondence that maps the intrinsically transient response of MFPTs onto the steady-state response of an auxiliary system. This correspondence yields exact and universal response relations for MFPTs between arbitrary state pairs, expressed entirely in terms of unperturbed MFPTs and steady-state probabilities. We then obtain a factorized physical decomposition of the MFPT response into linear upstream, linear downstream, and nonlinear contributions. Further corollaries include response-curve inference rules, fundamental bounds on MFPT responses, analytical expressions for higher-order responses of MFPTs and steady-state probabilities, and multi-rate response formulas. Additionally, our result offers computational advantages in calculating both MFPTs and steady-state distributions. Finally, a biologically motivated folding network is analyzed, and a recently reported paradox on MFPT is clarified.", "url": "https://arxiv.org/abs/2608.11202", "type": "理论", "summary": "1. 该工作建立了连续时间马尔可夫过程中平均首达时间（MFPT）对扰动的线性与非线性响应理论。\n2. 其核心在于将首达时间的瞬态响应严格映射为辅助系统的稳态响应，从而用未扰动的MFPT与稳态概率给出任意态对间响应的精确普适关系及分解。\n3. 这为高效计算与推断MFPT响应、建立响应界限以及澄清生物折叠网络中的响应悖论提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Ruicheng Bao"}, {"name": "Shiling Liang"}], "featured_authors": [{"name": "Ruicheng Bao"}, {"name": "Shiling Liang"}], "author_count": 2}, {"id": "2608.10009", "category": "hep-th", "title": "Casimir Force in Spacetimes with Torsion", "abstract": "We compute the Casimir force between perfectly conducting parallel plates in a spacetime endowed with constant axial torsion. Working within an effective field theory framework where torsion couples to the electromagnetic sector via a gauge-invariant Chern--Simons-type interaction, we derive the modified photon dispersion relation and mode spectrum. Using zeta-function regularization, we obtain the vacuum energy and the resulting Casimir pressure to second order in the torsion parameter. Our calculation yields a correction scaling as $\\Delta P/P_0 = -\\frac{5\\xi^2 S_z^2 a^2}{4\\pi^2} + \\order(S_z^4)$, which corresponds to a slight weakening of the attractive Casimir force. We acknowledge a known subtlety in the literature: because the Chern-Simons interaction is a total derivative, some analyses conclude that it should not contribute to the Casimir energy for standard boundary conditions, implying the leading correction is of higher order, $\\order(S_z^4)$. For experimentally accessible plate separations ($a \\sim \\qty{1}{\\micro\\meter}$), the effect remains well below current detection thresholds ($|\\Delta P/P_0| \\lesssim 10^{-30}$) due to stringent bounds on macroscopic torsion from spin-torsion coupling experiments. Nevertheless, the calculation establishes a consistent, gauge-invariant bridge between quantum vacuum phenomena and non-Riemannian geometry. We discuss finite-temperature effects and geometric asymmetries as potential pathways for enhancing sensitivity, while placing the results in the broader context of dynamical torsion, condensed matter analogs, and quantum information protocols. Our results are consistent with the CPT-odd photon sector of the Standard-Model Extension and provide a geometric interpretation of Lorentz-violating coefficients in terms of spacetime torsion.", "url": "https://arxiv.org/abs/2608.10009", "type": "理论", "summary": "1. 该工作在具有常轴向挠率的时空中计算了理想平行导体板间的卡西米尔力，其中挠率通过规范不变的Chern-Simons型耦合进入电磁扇区。\n2. 其技术要点是导出修正的光子色散关系与模式谱，利用zeta函数正则化得到挠率参数二阶的真空能修正，卡西米尔压强的相对修正为ΔP/P0=-5ξ²S_z²a²/(4π²)，表现为对吸引力的轻微减弱，并指出总导数性质可能导致首阶修正移至更高阶。\n3. 该效应在可测板距下远低于当前探测阈值，但为量子真空现象与非黎曼几何建立了自洽的规范不变桥梁，并为有限温度、几何不对称增强探测及SME洛伦兹破坏系数提供了几何解释。", "summary_source": "deepseek", "authors": [{"name": "M.W. AlMasri"}], "featured_authors": [{"name": "M.W. AlMasri"}], "author_count": 1}, {"id": "2608.10060", "category": "hep-th", "title": "Complexity measures in holographic cascading theories with multiscale dynamics", "abstract": "Using the gravitational duals, we perform a systematic study of two notions of complexity in a family of three-dimensional gauge theories with rich infrared structure. For thermofield double states, we employ the complexity=volume prescription, which relates computational complexity to the volume of the dual Einstein-Rosen bridge. For one particle states created by the insertion of a local operator on the vacuum, we study their spreading in Krylov space, encoded holographically by the radial momentum of bulk excitations. We investigate these two notions of complexity across the parameter space of the theories, focusing on the two limiting values of a tunable parameter. Near the limit where the theories flow close to an intermediate conformal fixed point, both notions reveal distinct manifestations of ``walking'' dynamics. Near the opposite limit, computational complexity is largely insensitive to the confining nature of the ground state, whereas the frequency of oscillations in the Krylov spread complexity -- set by the emerging infrared scale -- is sensitive to the presence of confinement.", "url": "https://arxiv.org/abs/2608.10060", "type": "理论", "summary": "1. 该工作利用引力对偶，系统研究了具有丰富红外结构的三维级联规范理论中两种复杂度：热场双态的复杂度=体积及局域算符激发单粒子态的Krylov展宽。\n2. 其技术要点在于扫描参数空间的两个极限：近中间共形不动点极限下两种复杂度均呈现“行走”动力学特征；近相反极限下计算复杂度几乎不感知基态禁闭，而Krylov展宽复杂度振荡频率由红外能标决定并对禁闭敏感。\n3. 这为在全息框架中用复杂度区分行走与禁闭等多尺度动力学提供了可检验的诊断。", "summary_source": "deepseek", "authors": [{"name": "Carlos Nunez"}, {"name": "Juan F. Pedraza"}, {"name": "Javier G. Subils"}], "featured_authors": [{"name": "Carlos Nunez"}, {"name": "Juan F. Pedraza"}, {"name": "Javier G. Subils"}], "author_count": 3}, {"id": "2608.10072", "category": "hep-th", "title": "Recursion Coefficients and Krylov Dynamics in Polynomial Random Matrix Models", "abstract": "We study the recursion coefficients of orthogonal polynomials and their associated Krylov dynamics in random matrix models with high-degree and possibly asymmetric polynomial potentials. We develop a moment recursion method that, when combined with the recursive algorithm, provides an efficient construction of the recursion coefficients. We also obtain their large-$n$ asymptotic behavior for general asymmetric potentials; for $Nw_d=1$, the leading asymptotic form of $R_n$ reproduces Freud's conjecture. We apply this framework to an asymmetric quartic potential and to the double-scaled Sachdev-Ye-Kitaev (DSSYK) model. In both models, the recursion functions capture the overall qualitative behavior of the recursion coefficients, and the gradient catastrophes of the recursion functions are associated with ``chaotic'' transition regions in the recursion coefficients. For the quartic potential, such regions can occur in both $R_n$ and $S_n$, whereas the DSSYK model can exhibit multiple transition regions in $R_n$, with the recursion function remaining accurate in the smooth intervals between them. Finally, we compute the corresponding spread complexity and find that transition regions do not qualitatively modify its behavior, while a two branch structure produces early time oscillations followed by monotonic growth.", "url": "https://arxiv.org/abs/2608.10072", "type": "理论", "summary": "1. 本文发展一套矩递推方法，研究高次且可不对称多项式随机矩阵模型中正交多项式递推系数及其Krylov动力学，并给出大n渐近行为。\n2. 其核心在于将矩递推与递归算法结合以高效构造递推系数；当Nw_d=1时渐近形式重现Freud猜想，且梯度灾变与递推系数中的混沌过渡区相联系，在非对称四次势和DSSYK模型中均成立。\n3. 对展宽复杂度的计算表明，过渡区不改变其定性演化，而二支结构会造成早期振荡后转单调增长，为量子混沌与Krylov复杂性研究提供有效诊断工具。", "summary_source": "deepseek", "authors": [{"name": "Juan F. Pedraza"}, {"name": "Le-Chen Qu"}], "featured_authors": [{"name": "Juan F. Pedraza"}, {"name": "Le-Chen Qu"}], "author_count": 2}, {"id": "2608.10082", "category": "hep-th", "title": "Tetra-quadric CY Threefold and Assisted Fibre Inflation", "abstract": "In the context of type IIB superstring compactification, we demonstrate the assisted fibre inflation proposal for a four-field model realized using the orientifold of a tetra-quadric Calabi-Yau (CY) threefold. This CY threefold has an underlying permutation symmetry $S_4$ and belongs to both the list of CY threefolds, namely the Kreuzer-Skarke (KS) database as well as the Complete Intersection Calabi-Yau (CICY) database. After fixing the overall volume modulus of the CY threefold using the framework of perturbative large volume scenario, there are three Kähler moduli which remain flat and assist in driving fibre inflation via sub-leading corrections. In a particular benchmark model, we show that the effective inflaton shift of around $5.7$ M$_p$, as needed for driving fibre inflation, can be successfully shared by three inflaton moduli which need to be individually shifted by nearly $2.2$ M$_p$ only ! The main motivation for the work is to show that the effective large field excursions of the inflaton field is possible without the need of pushing the individual volume moduli towards a large super-Planckian excursion or close to the boundary of the Kähler cone which may create various subsequent challenges for the effective field theory and supergravity approximations, especially in Swiss-Cheese based models of fibre inflation.", "url": "https://arxiv.org/abs/2608.10082", "type": "理论", "summary": "1. 该工作在一个四二次卡拉比-丘三维流形的定向折叠紧化中，实现了IIB型超弦框架下的四场辅助纤维暴胀模型。\n2. 其核心在于利用微扰大体积方案固定整体模量后，三个Kähler模量各仅需约2.2 M_p位移，即可共享约5.7 M_p有效暴胀子位移，避开超大普朗克位移及Kähler锥边界。\n3. 这为多场弦紧化中实现大场暴胀提供了具体范例，并有助于缓解Swiss-Cheese型纤维暴胀中有效场论与超引力近似的压力。", "summary_source": "deepseek", "authors": [{"name": "Swagata Bhattacharyya"}, {"name": "George K. Leontaris"}, {"name": "Pramod Shukla"}], "featured_authors": [{"name": "Swagata Bhattacharyya"}, {"name": "George K. Leontaris"}, {"name": "Pramod Shukla"}], "author_count": 3}, {"id": "2608.10085", "category": "hep-th", "title": "Approximate locality, black hole complementarity and overlapping qubits", "abstract": "We construct a toy model of an evaporating black hole using approximately local degrees of freedom acting on ``overlapping\" qubits in which a version of black hole complementarity arises naturally. The operators corresponding to the radiation and the interior are identified as two distinct representations of the same fundamental algebra, thereby preventing the exact factorization of the Hilbert space into interior and exterior and avoiding the conventional no-cloning violations. We show how this toy model captures several qualitative and quantitative features of black hole evaporation and how the ability to account for this ``overlap\" in the entropy calculation leads to the recovery of a Page curve.", "url": "https://arxiv.org/abs/2608.10085", "type": "理论", "summary": "1. 该工作以重叠量子比特上的近似局域自由度构造了一个蒸发黑洞的玩具模型，并从中导出了黑洞互补性的自然实现。\n2. 其核心在于将辐射与内部算子视为同一基本代数的两个不同表示，既避免希尔伯特空间内外精确分解并规避传统无克隆佯谬，又能通过熵计算计入重叠效应恢复佩奇曲线，再现蒸发过程的定性与定量特征。\n3. 这为在更真实引力背景下检验互补性方案、重新审视信息丢失问题，以及刻画近似局域性在量子引力中的角色提供了可推演的概念框架和模型启发。", "summary_source": "deepseek", "
