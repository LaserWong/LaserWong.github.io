rojective Geometry", "abstract": "In a recent paper it was shown that all the Hilbert space formulas for quantum probabilities can be realized as functions of geometric properties of the associated projective space, but those functions were expressed using the structures of the associated Hilbert space. In this paper a direct description of all these probabilities is given as formulas involving only the geometric properties of the projective space itself without referring to the associated Hilbert space theory. In large part this depends on a projection theorem for complex projective space which is analogous to the projection theorem for Hilbert spaces. The importance of this is that this exhibits quantum probability in terms of the geometry of a Riemannian metric in a non-linear Kähler manifold without any reference to a linear Hilbert space. As such this is a part of a larger program of the geometrization of physics. This opens the possibility of generalizations of quantum theory in other similar geometric settings. The theory presented includes projective spaces of both finite and infinite dimension. Some comments explain how quantum theory based on a von Neumann algebra is compatible with this approach.", "url": "https://arxiv.org/abs/2605.17578", "type": "理论", "summary": "1. 本文直接使用复射影空间自身的几何性质（而非希尔伯特空间结构）给出所有量子概率的纯几何描述。\n2. 技术核心在于证明了复射影空间的投影定理，从而将量子概率表达为非线性Kähler流形上黎曼度量的几何量。\n3. 这为量子理论在更一般几何背景中的推广铺平了道路，且该几何化框架与von Neumann代数量子理论兼容。", "summary_source": "deepseek", "authors": [{"name": "Stephen Bruce Sontz"}], "featured_authors": [{"name": "Stephen Bruce Sontz"}], "author_count": 1}, {"id": "2605.17623", "category": "quant-ph", "title": "Where the Quantum Lives in D-Wave Hybrid Portfolio Optimization", "abstract": "We audit how much of D-Wave's hybrid quantum-classical portfolio-optimization service is actually quantum. On cardinality-constrained mean-variance-turnover instances spanning N equal to 10 to 640 with a Gurobi MIQP optimality anchor, the constraint-native LeapHybridCQM service matches Gurobi's proven optimum on all 54 instances where Gurobi proves optimality, but the mean QPU access time is only 0.034 seconds out of a 5-second wall-clock budget, roughly 0.7 percent of the run. The remaining roughly 99 percent is the service's classical decomposition, sub-problem assembly, and feasibility-aware reassembly, so the reported D-Wave hybrid win on this problem class is a constraint-native classical pipeline with a small QPU contribution rather than a quantum-sampling win. Two structural results sharpen this audit. First, the cardinality penalty contributes a dense rank-one term that makes the penalty-encoded logical graph fully connected regardless of the original covariance density, collapsing the intended density benchmark axis for all penalty-encoded paths while leaving the constraint-native sparsity intact. Second, the constraint-native service returns identical solutions at every tested wall-clock budget from 5 to 300 seconds and across 10 repeated calls, a determinism property of the service on this problem class. Together with two classical baselines, namely Gurobi MIQP and simulated annealing, and a comparison against the penalty-encoded hybrid interface, these results extend the prior constraint-native versus penalty-encoded observation of Sakuler et al. from the statement that the constraint-native interface handles constraints natively to the operational decomposition of where the win actually originates, a finding that reframes how D-Wave hybrid performance should be reported in quantum-finance benchmarks.", "url": "https://arxiv.org/abs/2605.17623", "type": "数值", "summary": "1. 该工作审计了D-Wave混合量子经典投资组合优化服务中实际量子成分的比例，在54个Gurobi可证明最优实例上实现最优匹配。\n2. 核心技术发现：平均QPU访问时间仅占5秒壁钟预算的0.034秒（约0.7%），约束原生接口的胜出源于经典分解管道而非量子采样优势。\n3. 该结果揭示基数惩罚导致稠密秩一关联矩阵破坏密度基准，并表明服务具确定性，为量子金融混合性能基准测试的报告框架提供重构依据。", "summary_source": "deepseek", "authors": [{"name": "Luis Lozano"}], "featured_authors": [{"name": "Luis Lozano"}], "author_count": 1}, {"id": "2605.17713", "category": "quant-ph", "title": "Quantum Expectation Identities for the Three-State Model of a Molecular Domain", "abstract": "The electronic distribution of a molecular domain is examined in this study. A theoretical formulation of quantum molecular properties is presented using the Quantum Expectation Identity theorem (QEI), with a focus on the three-state model of the density matrix for the quantum state of a molecular domain as an open system. The report examines the relationship between ab initio statistical fluctuation-correlation theorems for quantum observables and their derivatives. We focus on three main quantities of a domain: the electronic population, its chemical potential, and its maximum capacity for accepting or donating charge with the neighbors. The analytical expressions for the quantities are presented and discussed in detail. At the end, we explore the concept of quantum purity and its proper application in the molecular domain.", "url": "https://arxiv.org/abs/2605.17713", "type": "理论+数值", "summary": "1. 该工作利用量子期望恒等式(QEI)对分子域的三态密度矩阵模型进行理论表述，并分析了电子布居、化学势及最大电荷容量等关键量。\n2. 其技术核心在于将量子观测量的涨落-关联定理与其导数联系起来，并给出了这些量的解析表达式。\n3. 这为分子域中量子纯度概念的恰当应用以及相关开放量子系统的理论分析提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Boris Maulén"}, {"name": "Roberto C. Bochicchio"}], "featured_authors": [{"name": "Boris Maulén"}, {"name": "Roberto C. Bochicchio"}], "author_count": 2}, {"id": "2605.17796", "category": "quant-ph", "title": "LEAD: A Local Ensemble-Assisted Parallel Decoding Framework for Quantum Tanner Codes", "abstract": "Quantum Tanner codes are a recently developed family of quantum error-correcting codes characterized by favorable asymptotic performance characteristics. Despite their theoretical potential, practical decoding algorithms that effectively leverage their structural properties remain limited. This work introduces LEAD (Local Ensemble-Assisted Decoder), a structure-aware decoding framework tailored for quantum Tanner codes. The proposed scheme leverages the decomposable structure of Cayley complexes to project the global code onto overlapping local subcodes defined by vertex neighborhoods, where error probabilities are estimated in parallel. To ensure global consistency, LEAD utilizes the inherent topological symmetry of the complex and introduces a soft-information regularization mechanism to mitigate local overconfidence during information aggregation. This framework enables highly parallelized, low-complexity decoding that is intrinsically compatible with various local search heuristics. Simulation results demonstrate that LEAD achieves significantly lower logical error rates than standard decoding framework while substantially reducing the average decoding latency and iteration count.", "url": "https://arxiv.org/abs/2605.17796", "type": "理论+数值", "summary": "1. 该工作提出了一个针对量子Tanner码的局部集成辅助并行解码框架LEAD。\n2. 其核心在于利用Cayley复形可分解结构将全局码投影到顶点邻域重叠子码上并行估计错误概率，并通过拓扑对称性与软信息正则化机制确保全局一致性。\n3. 这为实现低复杂度、高并行度的量子Tanner码实际解码提供了有效途径，有望降低逻辑错误率与解码延迟。", "summary_source": "deepseek", "authors": [{"name": "Zhuo-Yan Xiao"}, {"name": "Sha Shi"}, {"name": "Chen-Peng Huang"}, {"name": "Dong-Sheng Wang"}, {"name": "Yun-Jiang Wang"}], "featured_authors": [{"name": "Zhuo-Yan Xiao"}, {"name": "Sha Shi"}, {"name": "Chen-Peng Huang"}, {"name": "Dong-Sheng Wang"}, {"name": "Yun-Jiang Wang"}], "author_count": 5}, {"id": "2605.17802", "category": "quant-ph", "title": "Heralded Generation of Multipartite Free-Electron W-State Entanglement", "abstract": "We propose a heralded protocol for generating multipartite free-electron entanglement from atomic $W_N$ resources in a sideband-resolved interaction regime. The scheme consists of $N$ independent electron--atom interaction arms, where each free electron couples locally to one two-level system. For uniform couplings and common detuning, the dynamics is solved analytically within the rotating-wave approximation. Projecting the atoms onto the all-ground state maps the initial atomic excitation manifold onto the electronic upper-sideband manifold and prepares an exact $N$-electron $W_N$-type state. The heralding probability is obtained in closed form for resonant and detuned regimes. At resonance, the optimal success probability obeys the large-$N$ scaling $P_{G_N}^{\\max}\\sim e^{-1}/N$. The heralded state retains the multipartite entanglement structure of the atomic resource, as shown for arbitrary $N$ and illustrated explicitly for $N=3$. Detuning, weak symmetry breaking, beyond-rotating-wave corrections, and Gaussian coupling envelopes are discussed. The protocol provides a scalable route toward multipartite free-electron entanglement generation from localized atomic resources within quantum electron optics.", "url": "https://arxiv.org/abs/2605.17802", "type": "理论+数值", "summary": "1. 该工作提出一种基于边带分辨相互作用的预示性协议，从原子W_N资源生成多部分自由电子纠缠态。\n2. 通过将原子投影到全基态将初始原子激发映射到电子上边带流形，解析求解了均匀耦合与共同失谐下的动力学，共振时最优成功概率满足大N标度P_G_N^{max}∼e^{-1}/N。\n3. 该协议展示了从局域原子资源可扩展地产生多部分自由电子纠缠的可行路径，为量子电子光学中电子态的多体纠缠制备提供了可操作的方案。", "summary_source": "deepseek", "authors": [{"name": "Du Ran"}, {"name": "Jing-Yi Liu"}, {"name": "Dan Jin"}, {"name": "Shuai Liu"}, {"name": "Reuven Ianconescu"}, {"name": "Ze-Long He"}, {"name": "Ji-Yuan Bai"}, {"name": "Ya-dong Li"}, {"name": "Avraham Gover"}], "featured_authors": [{"name": "Du Ran"}, {"name": "Jing-Yi Liu"}, {"name": "Dan Jin"}, {"name": "Ji-Yuan Bai"}, {"name": "Ya-dong Li"}, {"name": "Avraham Gover"}], "author_count": 9}, {"id": "2605.17878", "category": "quant-ph", "title": "Bound state in the continuum and dynamics via phase modulation in giant-atom waveguide setups", "abstract": "Giant atoms, which couple to a waveguide through multiple spatially separated connection points beyond the dipole approximation, provide a versatile route for quantum information processing based on interference-induced bound states in the continuum (BICs). While multi-giant-atom architectures are being developed toward giant-atom quantum networks, the role of direct coupling between the giant atoms, in particular the associated coupling phase, in atomic dynamics remains insufficiently understood. Here we take a first step toward addressing this issue by studying a two-giant-atom waveguide-QED model. We show that the coupling phase can be used to control both the number of BICs and their profiles for both of photon and atoms. More interestingly, the presence of BICs gives rise to a variety of dynamical behaviors, providing an effective mechanism for tailoring quantum-state evolution in giant-atom waveguide-QED systems. Our results highlight coupling-phase engineering as a useful tool for controlling interference, bound states, and quantum dynamics in nonlocal light--matter interfaces.", "url": "https://arxiv.org/abs/2605.17878", "type": "理论", "summary": "1. 该工作研究了双巨原子波导量子电动力学模型中耦合相位对连续谱束缚态及其动力学的影响。\n2. 其卖点在于揭示了耦合相位可精确调控光子与原子束缚态的数量与轮廓，并由此诱导丰富的动力学行为。\n3. 这为在非局域光-物质界面中利用耦合相位工程控制量子态演化和构建巨原子量子网络提供了关键机制。", "summary_source": "deepseek", "authors": [{"name": "Ji Qi"}, {"name": "Xiaojun Zhang"}, {"name": "Honngwei Yu"}, {"name": "Zhihai Wang"}], "featured_authors": [{"name": "Ji Qi"}, {"name": "Xiaojun Zhang"}, {"name": "Honngwei Yu"}, {"name": "Zhihai Wang"}], "author_count": 4}, {"id": "2605.17895", "category": "quant-ph", "title": "Geometric Prototype Learning in Quantum Hilbert Space with Matrix Product States", "abstract": "Quantum probability provides a novel framework for formulating machine-learning (ML) problems in Hilbert space. We introduce a prototype-based learning scheme where class representatives are encoded as generative matrix product states (MPS). Because these prototypes reside in the same Hilbert space as quantum-encoded data samples, various ML tasks such as classification and clustering can be performed through geometric measures of quantum states. This approach lifts prototype learning from classical feature space to quantum Hilbert space. Benchmarks on Fashion-MNIST and a real-world electrocardiogram dataset demonstrate that our method outperforms classical prototype approaches while remaining competitive with standard black-box neural networks. We also identify an ``attraction'' effect induced by the quantum-probabilistic prototypes and introduce a dimensionality-reduction scheme based on prototype distances. Our results establish quantum states as an explainable framework for prototype learning, opening new directions for designing ML algorithms in quantum Hilbert space.", "url": "https://arxiv.org/abs/2605.17895", "type": "理论+数值", "summary": "1. 该工作将原型学习从经典特征空间提升至量子希尔伯特空间，采用矩阵乘积态作为类原型的生成式表示。\n2. 其技术核心是借助量子态几何度量执行分类与聚类，并识别出量子概率原型诱发的“吸引”效应及基于原型距离的降维方案。\n3. 这为在量子希尔伯特空间中构建可解释的机器学习算法提供了新框架，并指明了设计量子机器学习模型的具体方向。", "summary_source": "deepseek", "authors": [{"name": "Kun Zhang"}, {"name": "Lei Ding"}, {"name": "Sheng-Chen Bai"}, {"name": "Jing Sun"}, {"name": "An-Qi Jing"}, {"name": "Min Tang"}, {"name": "Shi-Ju Ran"}], "featured_authors": [{"name": "Kun Zhang"}, {"name": "Lei Ding"}, {"name": "Sheng-Chen Bai"}, {"name": "An-Qi Jing"}, {"name": "Min Tang"}, {"name": "Shi-Ju Ran"}], "author_count": 7}, {"id": "2605.17977", "category": "quant-ph", "title": "Probing Tensor Singularities and Their Euler-Class Descendants via Non-Abelian Quantum Geometry Measurement", "abstract": "We report the theoretical prediction and experimental observation of a new class of four-dimensional (4D) tensor singularities and their three-dimensional (3D) Euler-class descendants, protected by chiral and spacetime inversion symmetries on a superconducting circuit platform. The 4D point-like singularity/monopole, characterized by the Dixmier-Douady class of a real bundle gerbe associated with tensor gauge fields, is observed to evolve into a nodal ring carrying an additional first Euler class charge under symmetry-preserving perturbations. Dimensional reduction reveals 3D Euler and Euler curvature dipoles, exhibiting nontrivial Euler topology and a topological sum rule that ensures zero-energy flat bands inherit nontrivial topology even without interactions. Crucially, these high-dimensional degenerate systems are mapped and reconstructed using a hybrid analog-digital protocol designed for non-Abelian quantum geometry measurement within a superconducting qubit array. Our work not only expands the family of topological monopoles but also establishes a robust experimental framework for exploring high-order gauge theory and real-bundle topology across diverse quantum platforms.", "url": "https://arxiv.org/abs/2605.17977", "type": "实验", "summary": "1. 本工作在超导电路平台上理论预言并实验观测了由手性与时空反演对称性保护的四维张量奇点及其降维产生的三维Euler类节环与偶极子。\n2. 其核心在于利用混合模数非阿贝尔量子几何测量协议，揭示了Dixmier-Douady类与第一Euler类荷的拓扑关联，并验证了零能平带的拓扑继承求和规则。\n3. 这为在量子器件中探索高阶实丛拓扑与张量规范场理论提供了可扩展的实验框架，并有望推广至冷原子与光子等量子平台。", "summary_source": "deepseek", "authors": [{"name": "Zhe Wang"}, {"name": "Yan-Qing Zhu"}, {"name": "Xinsheng Tan"}, {"name": "Giandomenico Palumbo"}, {"name": "Lichang Ji"}, {"name": "Wei Xin"}, {"name": "Shi-Liang Zhu"}, {"name": "Yang Yu"}], "featured_authors": [{"name": "Zhe Wang"}, {"name": "Yan-Qing Zhu"}, {"name": "Xinsheng Tan"}, {"name": "Wei Xin"}, {"name": "Shi-Liang Zhu"}, {"name": "Yang Yu"}], "author_count": 8}, {"id": "2605.18031", "category": "quant-ph", "title": "Quantum Sidecar Architectures for Hybrid AI Training and Inference: Stateful Protected Registers, Stateless Reset-and-Reprepare Circuits and Quantum Weight-State Outlook", "abstract": "We propose a quantum sidecar architecture family for future hybrid AI training and inference. The central idea is not to store an entire Transformer in a small quantum memory, nor to claim one-shot collapse into a fully trained model or an optimal answer. Instead, we identify two physically distinct operating modes for quantum co-processors attached to classical large-model pipelines. The first is a stateful protected-register mode, in which a protected register stores a reusable quantum resource while an ancilla or temporary register performs QND-style readout. The second is a stateless reset-and-reprepare mode, in which each query prepares a task-conditioned quantum circuit, evolves over bounded training or inference control variables, measures candidate signals, resets the qubits, and repeats. We simulate the stateful mode using 2/4/6/8 protected-qubit density-matrix QND-style parity readout with one ancilla and a Qiskit cross-check. For the stateless mode, we include both an abstract candidate-update sampler and a circuit-level QAOA-style statevector sampler over structured candidate landscapes, followed by reset-overhead sensitivity analysis. The resulting framework positions quantum sidecars as bounded signal generators for optimizer-side sampling, adapter or expert selection, retrieval, routing, and reasoning-path proposal. As a speculative outlook, we introduce quantum weight-state sidecars: restricted quantum representations over model-control variables, not direct encodings of complete classical weight tensors.", "url": "https://arxiv.org/abs/2605.18031", "type": "理论+数值", "summary": "1. 该工作提出用于混合AI训练与推理的量子侧板架构家族，识别出状态保护寄存器与无状态重置-重制备两种物理操作模式。\n2. 技术核心在于状态模式利用QND式奇偶读出保持可复用量子资源，无状态模式通过每次任务条件化电路和测量后重置生成有界信号供优化器采样。\n3. 展望引入量子权重状态侧板概念，将量子表示限制于模型控制变量而非完整经典权重张量，为适配器选择与推理路径提议提供新方向。", "summary_source": "deepseek", "authors": [{"name": "Y.Mo"}, {"name": "G.D.Su"}], "featured_authors": [{"name": "Y.Mo"}, {"name": "G.D.Su"}], "author_count": 2}, {"id": "2605.18051", "category": "quant-ph", "title": "Structural $f$-divergence: Tight universal bounds for cost function moments and gradients in parameterized quantum circuits", "abstract": "The barren plateau phenomenon, in which cost-function gradients of variational quantum algorithms vanish exponentially, remains a central obstacle for near-term quantum computing. Existing analyses typically depend on t-design or Haar-random assumptions and bound quantities at the level of unitary distributions, offering limited insight for designing probability measures on the parameter space of parameterized quantum circuits. In this paper, we introduce the structural $f$-divergence, a symmetric $f$-divergence-based measure between probability distributions on the parameter space. We establish analytically trade-off inequalities that bound the discrepancies in the expected gradient magnitude and in the cost-function moments between a distribution on PQC and a reference distribution; equality is attained by a minimal one-qubit, one-layer ansatz. As applications, we derive necessary conditions on probability measures for avoiding BPs and cost concentration, and sufficient conditions that suppress noise-induced deviations.", "url": "https://arxiv.org/abs/2605.18051", "type": "理论+数值", "summary": "1. 该工作引入结构f-散度这一对称f-散度度量，量化参数化量子电路参数空间上任意分布与参考分布间的差异，并导出成本函数矩与梯度幅值的紧致普适界限。\n2. 其核心在于建立严格约束期望梯度幅度和成本矩分布偏差的权衡不等式，该不等式由单量子比特单层变分回路精确饱和，从而揭示贫瘠高原与成本集中的度量本质。\n3. 该框架给出避免贫瘠高原和抑制噪声偏差的测度必要条件与充分条件，为面向近期量子硬件的变分算法参数空间测度设计提供了定量准则。", "summary_source": "deepseek", "authors": [{"name": "Tomohiro Nishiyama"}, {"name": "Yoshihiko Hasegawa"}], "featured_authors": [{"name": "Tomohiro Nishiyama"}, {"name": "Yoshihiko Hasegawa"}], "author_count": 2}, {"id": "2605.18108", "category": "quant-ph", "title": "Quantum-Battery-Powered Geometric Landau-Zener Interferometry", "abstract": "Classical microwave drives are usually treated as ideal phase-coherent work sources for superconducting-qubit control. What if such a drive is replaced by a finite quantum battery. As a demanding benchmark, we consider echo-refocused geometric Landau--Zener interferometry powered by a single quantized bosonic mode. The qubit--battery dynamics are described by a Jaynes--Cummings Hamiltonian, while the echo pulse is retained as a qubit-only refocusing operation that cancels the dynamical phase. In the macroscopic coherent-state limit, the usual classical geometric interferometer is recovered. At finite mean photon number, however, the Jaynes--Cummings coupling generates photon-number-resolved avoided crossings with gaps $\\Omega_n=2g\\sqrt{n}$. The qubit-only echo redistributes amplitudes between neighboring excitation sectors, so the finite-battery protocol is not a single classical interferometer but a coherent sector-resolved quantum evolution. This produces contrast loss, interferogram distortions, and measurable battery back-action. We further show that reducing photon-number fluctuations alone is not sufficient: geometric control requires a first-order phase reference. Geometric Landau--Zener interferometry therefore provides a practical benchmark for certifying phase-coherent quantum-battery energy.", "url": "https://arxiv.org/abs/2605.18108", "type": "理论+数值", "summary": "1. 该工作将经典微波驱动替换为有限量子电池，研究了由单个量子化玻色模式驱动的回波重聚焦几何朗道-齐纳干涉测量。\n2. 揭示了有限平均光子数下Jaynes-Cummings耦合产生光子数分辨避免交叉，与仅作用于量子比特的回波共同导致扇区分辨量子演化，而非经典干涉仪，并带来对比度损失与电池反作用。\n3. 这种干涉测量为认证相位相干量子电池能量提供了实用基准，同时表明几何控制需要一阶相位参考而非仅减少光子数涨落。", "summary_source": "deepseek", "authors": [{"name": "Borhan Ahmadi"}], "featured_authors": [{"name": "Borhan Ahmadi"}], "author_count": 1}, {"id": "2605.18208", "category": "quant-ph", "title": "Phonon-bottlenecked spin relaxation of Er$^{3+}$:CaWO$_4$ at milliKelvin temperatures", "abstract": "We study spin-lattice relaxation times of electron spins in Er$^{3+}$:CaWO$_4$ at millikelvin temperature, detected via their coupling to a low-mode volume superconducting resonator. At large magnetic field supporting strong phonon-emission rates, we observe a noticeable increase in relaxation times with increasing spin-excitations, which exhibit a unique $[\\tanh (\\hbar \\omega_0/k_\\text{B} T)]^2$ temperature dependence. These observations are typical of a phonon-bottlenecked spin relaxation, and have implications for quantum technologies that exploit rare-earth spin ensembles as coherent resources.", "url": "https://arxiv.org/abs/2605.18208", "type": "理论", "summary": "1. 本工作测量了Er³⁺:CaWO₄在毫开温度下的自旋-晶格弛豫时间，利用低模体积超导谐振器进行探测。\n2. 在大磁场下观察到弛豫时间随自旋激发数增加而显著增长，并呈现[tanh(ħω₀/k_BT)]²温度依赖性，揭示声子瓶颈主导的自旋弛豫机制。\n3. 这一发现为稀土自旋系综在量子技术中作为相干资源时优化操作条件提供了关键物性约束。", "summary_source": "deepseek", "authors": [{"name": "S. Rajendran"}, {"name": "B. Mistri"}, {"name": "P. K. Sharma"}, {"name": "S. E. Kubatkin"}, {"name": "A. V. Danilov"}, {"name": "S. Dhomkar"}, {"name": "S. E. de Graaf"}, {"name": "V. Ranjan"}], "featured_authors": [{"name": "S. Rajendran"}, {"name": "B. Mistri"}, {"name": "P. K. Sharma"}, {"name": "S. Dhomkar"}, {"name": "S. E. de Graaf"}, {"name": "V. Ranjan"}], "author_count": 8}, {"id": "2605.18241", "category": "quant-ph", "title": "An Entropy-Governed Speedup for Quantum Algorithms on Local Hamiltonians", "abstract": "Low-energy estimation and state preparation for general $k$-local Hamiltonians are fundamental challenges in quantum complexity theory. For constant relative accuracy, Buhrman et al. (PRL 2025) recently broke the natural Grover bound $O(2^{n/2})$, where $n$ denotes the number of qubits, for both problems. In this paper, for any sufficiently small parameter $d\\ge 0$, we present an even faster quantum algorithm that outputs a quantum state with energy bounded by the minimum energy over all depth-$d$ states (i.e., states obtained by applying a depth-$d$ circuit to the all-zero state), together with an estimate of this energy. For the class of Hamiltonians with depth-$d$ ground states, our algorithm furthermore achieves exactly the same energy guarantees as Buhrman et al. Our results also provide insight into the distinction between strongly entangled states and those admitting efficient classical descriptions.", "url": "https://arxiv.org/abs/2605.18241", "type": "理论+数值", "summary": "1. 本工作针对k-局域哈密顿量，提出一种利用熵调控加速的量子算法，能输出深度d电路态的最小能量及其估计。\n2. 该算法的核心卖点是通过限制态深度将复杂度从Grover界限O(2^{n/2})进一步降低，且对深度d基态哈密顿量保持相同能量精度。\n3. 这为区分强纠缠态与具高效经典描述态提供了新视角，并激励低深度量子电路在哈密顿量问题中的更广泛应用。", "summary_source": "deepseek", "authors": [{"name": "Ranitha Mataraarachchi"}, {"name": "François Le Gall"}, {"name": "Suguru Tamaki"}], "featured_authors": [{"name": "Ranitha Mataraarachchi"}, {"name": "François Le Gall"}, {"name": "Suguru Tamaki"}], "author_count": 3}, {"id": "2605.18243", "category": "quant-ph", "title": "One pure steered state implies Einstein-Podolsky-Rosen steering", "abstract": "In this work, we show that a two-qubit entangled state admitting at least one pure steered state is Einstein-Podolsky-Rosen (EPR) steerable from Alice to Bob. Pure steered states signifies that the quantum steering ellipsoid of Bob is tangent to his Bloch sphere at least at a single point. Furthermore, we prove that for a two-qubit entangled state, Bob's quantum steering ellipsoid is tangent to his Bloch sphere at exactly $N$ points, for $N\\in \\{ 0,1,2,\\infty\\}$, if and only if Alice's quantum steering ellipsoid is tangent to her Bloch sphere at exactly $N$ points. For any two-qubit entangled state, therefore, if one party can steer the other to at least one pure state, the state is two-way EPR steerable. We also present several illuminating instances of two-qubit entangled states such that the EPR steering can be verified in terms of pure steered states. Our result addresses the Gisin theorem in a EPR steering scenario: at least a single pure steered state implies two-way steering.", "url": "https://arxiv.org/abs/2605.18243", "type": "理论", "summary": "1. 该工作证明，两量子比特纠缠态若存在至少一个纯被导状态，则必为EPR导引态。\n2. 其关键点在于利用量子导引椭球与布洛赫球的切点刻画纯被导状态，并揭示双向导引的对称性。\n3. 这提供了从被导状态纯性直接判定EPR导引的简洁判据，并扩展了Gisin定理在导引场景下的适用性。", "summary_source": "deepseek", "authors": [{"name": "Qiu-Cheng Song"}, {"name": "Joonwoo Bae"}], "featured_authors": [{"name": "Qiu-Cheng Song"}, {"name": "Joonwoo Bae"}], "author_count": 2}, {"id": "2605.18247", "category": "quant-ph", "title": "Quantum--Fluid Correspondence for Systems of Nonrelativistic Spin-$\\frac{1}{2}$ Particles", "abstract": "We show that a charged fluid endowed with an internal spin degree of freedom naturally satisfies the Pauli equation for a nonrelativistic spin-1/2 particle, and that a collection of n such interacting fluids can be reformulated as an Euler flow in 3n dimensions, thereby providing a natural representation of a system of n Pauli particles. These results provide a fluid-mechanical derivation of the Pauli equation and extend the Madelung, or quantum-hydrodynamic, picture to many-particle quantum systems. In particular, they imply that an n-qubit quantum computer can, at least in principle, be realized as a suitable combination of n fluids, or equivalently as a 3n-dimensional Euler flow.", "url": "https://arxiv.org/abs/2605.18247", "type": "理论", "summary": "1. 该工作展示了带内部自旋自由度的荷电流体自然满足非相对论自旋-1/2粒子的泡利方程，并将n个相互作用流体重构为3n维欧拉流。\n2. 其核心在于为泡利方程提供了流体力学推导，并将Madelung量子流体动力学图像拓展至多粒子量子系统。\n3. 这暗示n量子比特量子计算机原则上可借助n个流体的恰当组合或等效的3n维欧拉流实现。", "summary_source": "deepseek", "authors": [{"name": "Naoki Sato"}, {"name": "Michio Yamada"}], "featured_authors": [{"name": "Naoki Sato"}, {"name": "Michio Yamada"}], "author_count": 2}, {"id": "2605.18333", "category": "quant-ph", "title": "QLIF-CAST: Quantum Leaky-Integrate-and-Fire for Time-Series Weather Forecasting", "abstract": "Accurate and efficient time-series forecasting remains a challenging problem for both classical and quantum neural architectures, particularly in multivariate environmental settings. This work adapts the Quantum Leaky Integrate-and-Fire (QLIF) spiking neural network for time-series regression tasks, specifically short-term multivariate weather forecasting. We extend QLIF beyond classification and demonstrate its applicability to continuous-valued prediction problems. The QLIF-CAST model encodes neuron excitation states as single-qubit quantum superpositions, driven by Rx rotation gates and T1 relaxation decay, and is embedded within a hybrid quantum-classical recurrent architecture. We conduct two distinct evaluations. First, a controlled comparison against a parameter-matched classical LIF baseline on a multivariate weather dataset shows that QLIF-CAST achieves 15.4% lower MSE and 4.4% lower MAE, demonstrating that quantum neuronal dynamics reduce prediction error over classical equivalents. Second, a cross-domain comparative analysis with state-of-the-art quantum LSTM (QLSTM) and quantum neural network (QNN) models on air quality and wind speed benchmarks reveals that QLIF-CAST converges in up to 94% less training time, occupying a distinct position in the speed-error trade-off space. Hardware verification on IBM Marrakesh (156-qubit QPU) confirms reliable circuit execution with only 1.2% average deviation from simulation.", "url": "https://arxiv.org/abs/2605.18333", "type": "理论+数值", "summary": "1. 该工作将量子泄露整合发放（QLIF）脉冲神经网络拓展至时间序列回归任务，实现了短期多变量天气预测。\n2. 其技术核心在于利用单量子比特叠加态编码神经元激发态，结合Rx旋转门与T1弛豫驱动量子神经动力学，在混合量子-经典循环架构中实现比经典LIF低15.4%的MSE，且训练时间较量子LSTM减少达94%。\n3. 这为量子脉冲神经网络在连续值预测任务中提供了硬件可执行的实证，并揭示了其在速度-误差权衡空间中占据独特位置，启发后续资源受限场景下的混合量子时序建模。", "summary_source": "deepseek", "authors": [{"name": "Alberto Marchisio"}, {"name": "Aayan Ebrahim"}, {"name": "Nouhaila Innan"}, {"name": "Muhammad Kashif"}, {"name": "Muhammad Shafique"}], "featured_authors": [{"name": "Alberto Marchisio"}, {"name": "Aayan Ebrahim"}, {"name": "Nouhaila Innan"}, {"name": "Muhammad Kashif"}, {"name": "Muhammad Shafique"}], "author_count": 5}, {"id": "2605.18377", "category": "quant-ph", "title": "Dissipation-assisted preparation of Floquet-Laughlin states in superconducting circuits", "abstract": "Fractional Chern insulators (FCIs) are lattice analogs of fractional quantum Hall systems, where the interplay of strong interactions with a frustrated tunnelling kinetics leads to the emergence of a gapped ground state with long-range entanglement and anyonic excitations. The highly correlated nature of such systems makes their adiabatic preparation challenging already beyond the minimal system size of two particles. Considering Floquet implementations of the bosonic Harper-Hofstadter-Hubbard model of few photons in superconducting circuits, we design protocols for the driven-dissipative stabilization of its FCI ground state at half filling via quantum bath engineering. Dissipation control is achieved through the coupling to driven leaky cavity modes, which realize a tuneable artificial environment having the Floquet-FCI as its approximate fixed point. For systems of two, three and six particles, we show numerically how the flexibility of the control scheme further allows for the detection of fractional quantum Hall signatures in the stabilized steady states, including bulk incompressibility, Hall response and the trapping of fractional charges. Our results provide a concrete pathway to dissipation-assisted preparation of strongly correlated states in quantum simulators.", "url": "https://arxiv.org/abs/2605.18377", "type": "理论+数值", "summary": "1. 该工作通过量子浴工程技术，在超导电路中实现了驱动-耗散稳定化Floquet分数陈绝缘体基态的制备方案。\n2. 其核心在于将可调泄漏腔模式设计为人工环境，使Flouquet-FCI成为近似不动点，并展示了在二、三及六粒子系统中体不可压缩性、霍尔响应与分数电荷俘获的探测。\n3. 这为在量子模拟器中耗散辅助制备长程纠缠强关联态提供了可实现的实验途径。", "summary_source": "deepseek", "authors": [{"name": "Luis C. Steinfadt"}, {"name": "André Eckardt"}, {"name": "Francesco Petiziol"}], "featured_authors": [{"name": "Luis C. Steinfadt"}, {"name": "André Eckardt"}, {"name": "Francesco Petiziol"}], "author_count": 3}, {"id": "2605.18391", "category": "quant-ph", "title": "Reduced-State Stabilizer Rényi Entropy as a Probe of Quantum Criticality in the Transverse ANNNI Model and the Quantum Compass Model", "abstract": "We investigate the effectiveness of the stabilizer Rényi entropy (SRE), a quantifier associated with non-stabilizer resources (quantum magic), as an indicator of quantum phase transitions. Specifically, we analyze the behavior of the purity-corrected SRE of reduced density matrices in the ground states of two one-dimensional spin models: the transverse axial next-nearest-neighbor Ising (TANNNI) model and the quantum compass model (QCM). The ground state of the TANNNI model is obtained using exact diagonalization techniques, while the QCM is analyzed using the Jordan--Wigner (JW) transformation followed by Bogoliubov diagonalization of the resulting quadratic fermionic Hamiltonian. For the TANNNI model, the purity-corrected SRE successfully detects the antiphase--floating phase transition in the high-frustration regime, while in the low-frustration regime the raw (purity-uncorrected) SRE reproduces the known ferromagnetic--paramagnetic phase boundaries more accurately. For the QCM, the purity-corrected SRE exhibits a clear signature near the isotropic point \\(J_x/J_z=1\\), where the system undergoes a first-order quantum phase transition. Our results establish SRE of reduced states as a complementary probe of quantum criticality and provide further insight into the role of non-stabilizer resources in many-body quantum phase transitions.", "url": "https://arxiv.org/abs/2605.18391", "type": "理论+数值", "summary": "1. 该工作研究约化态稳定化Rényi熵（SRE）在横向轴向次近邻伊辛模型与量子罗盘模型基态中探测量子相变的有效性。\n2. 核心技术在于区分纯度修正SRE与原始SRE的适用性，前者成功识别高阻挫区反相-浮动相转变及各向同性点一级相变，后者准确重现低阻挫区铁磁-顺磁边界。\n3. 这建立了约化态SRE作为量子临界性互补探针的地位，并揭示了非稳定化资源在多体量子相变中的物理作用。", "summary_source": "deepseek", "authors": [{"name": "Santanu Sarkar"}, {"name": "George Biswas"}, {"name": "Jun-Yi Wu"}, {"name": "Anindya Biswas"}], "featured_authors": [{"name": "Santanu Sarkar"}, {"name": "George Biswas"}, {"name": "Jun-Yi Wu"}, {"name": "Anindya Biswas"}], "author_count": 4}, {"id": "2605.18392", "category": "quant-ph", "title": "Precision limits for time-dependent quantum metrology under Markovian noise", "abstract": "We derive ultimate precision bounds for estimating parameters encoded in \\emph{time-dependent} Hamiltonians in the presence of general Markovian noise, allowing for arbitrary adaptive protocols with fast controls and noiseless ancillas. Extending the minimization-over-purifications framework to time-varying continuous channels, we obtain a differential upper bound on the achievable quantum Fisher information (QFI) that can be evaluated at all times via semidefinite programming. For parameter-independent noise, we prove a universal long-time scaling law: if the coherent (noiseless) dynamics yields $Q_{\\mathrm{coh}}(T)\\sim T^{2k}$, then under Markovian noise the QFI scales at most as $Q(T)\\sim T^{2k}$ in the DHNLS regime, whereas in the DHLS regime it is fundamentally limited to $Q(T)\\sim T^{2k-1}$. We illustrate these behaviors on paradigmatic driven-qubit sensors, exhibiting $T^{4}$ and $T^{3}$ scalings under dephasing and spontaneous emission, respectively. Finally, we provide explicit continuous exact and approximate quantum error correction constructions -- supplemented by spin-squeezed probes -- that asymptotically saturate the bounds, establishing their tightness.", "url": "https://arxiv.org/abs/2605.18392", "type": "理论+数值", "summary": "1. 该工作推导了在一般马尔可夫噪声下估计含时哈密顿量参数的终极精度极限，允许任意自适应协议与快速控制及无噪声辅助。\n2. 技术核心在于将最小化纯化框架扩展至含时连续信道，获得可通过半定规划实时评估的量子Fisher信息微分上界，并证明无参数依赖噪声下QFI的普适长时标度律。\n3. 通过提供渐近饱和这些边界的连续精确与近似量子纠错构造及自旋压缩探针，确立了理论边界的紧致性，为含时量子计量实验设计提供了明确基准。", "summary_source": "deepseek", "authors": [{"name": "Luca Previdi"}, {"name": "Francesco Albarelli"}], "featured_authors": [{"name": "Luca Previdi"}, {"name": "Francesco Albarelli"}], "author_count": 2}, {"id": "2605.18399", "category": "quant-ph", "title": "Bounds on quantum conference key agreement in pair-entangled networks", "abstract": "We investigate the task of conference key agreement in near-term quantum networks, where the nodes are connected by sources of bipartite entangled states, under the class of local operations not requiring quantum memory. We derive upper bounds on the distillable conference key depending on the network topology and degree of entanglement of the sources, and prove tightness of these bounds for some particular cases. In these cases, we show that pairwise bipartite key distillation followed by merging the bipartite keys into the conference key is optimal.", "url": "https://arxiv.org/abs/2605.18399", "type": "理论", "summary": "1. 该工作针对由二分纠缠源连接的近程量子网络，在无需量子存储的局域操作下，推导了可蒸馏会议密钥的上界。\n2. 核心卖点在于上界显式依赖网络拓扑与源纠缠度，且在特定情形下证明紧致性，并发现先蒸馏二分密钥再合并为会议密钥的策略最优。\n3. 这为无存储约束量子网络中会议密钥协商的协议设计提供了理论最优边界，并启发网络结构与纠缠资源分配的最优化路线。", "summary_source": "deepseek", "authors": [{"name": "Justus Neumann"}, {"name": "Hermann Kampermann"}, {"name": "Dagmar Bruß"}, {"name": "Anton Trushechkin"}], "featured_authors": [{"name": "Justus Neumann"}, {"name": "Hermann Kampermann"}, {"name": "Dagmar Bruß"}, {"name": "Anton Trushechkin"}], "author_count": 4}, {"id": "2605.18440", "category": "quant-ph", "title": "Geometrical derivation of Wigner's angle for arbitrary Lorentz transformations of massless particles", "abstract": "This note summarizes the physics and mathematics of Lorentz transformations for massless particles, specifically for photons. We provide a complete analytical derivation of Wigner's little group matrix and a closed formula for the calculation of Wigner's angle for arbitrary Lorentz transformations. Our derivation highlights the geometrical content of the sequence of little group transformations leading to Wigner's matrix and links it to classical theorems in spherical trigonometry.", "url": "https://arxiv.org/abs/2605.18440", "type": "数值", "summary": "1. 该工作给出了无质量粒子在任意洛伦兹变换下Wigner角的完整解析推导和闭合公式。\n2. 其核心在于揭示Wigner小群变换序列的几何内涵，并将其与球面三角学经典定理建立联系。\n3. 这为理解无质量粒子洛伦兹变换的几何结构及后续量子场论应用提供了严谨的理论基础。", "summary_source": "deepseek", "authors": [{"name": "Isabella Cerutti"}, {"name": "Petra F. Scudo"}], "featured_authors": [{"name": "Isabella Cerutti"}, {"name": "Petra F. Scudo"}], "author_count": 2}, {"id": "2605.18485", "category": "quant-ph", "title": "A geometric Fano--Procrustes framework for purification-based distances and quantum channels analysis", "abstract": "In this work we reformulate the Uhlmann purification-overlap optimization and develop a purification-based geometric framework for the analysis of mixed qubit states and qubit channels. Using the Fano representation of two-qubit pure states, a purification is described in terms of the Bloch vector of the system, the ancilla Bloch vector, and a real correlation matrix. For a fixed one-qubit mixed state, the freedom in the choice of purification can be parametrized by proper rotations acting on the ancillary degrees of freedom. As a result, the optimization over purifications entering the definition of the metric \\(D_N\\) introduced in Ref.~\\cite{Lamberti2009} is reduced to an orthogonal Procrustes problem on the Lie group \\(SO(3)\\). This reduction yields not only the maximal purification overlap, but also the optimal rotation relating the purification frames. From this rotation we define a purification misalignment angle \\(\\Theta\\), which provides geometric information not contained in scalar fidelity-based distinguishability measures. The formalism is applied to representative qubit channels, including depolarizing, bit-flip, phase-flip, amplitude-damping channels, and an imperfect quantum NOT gate. For symmetry-adapted evolutions preserving the Bloch-vector direction, the optimal rotation is trivial and \\(\\Theta=0\\), whereas noncollinear channel actions generate a nonzero misalignment. The pair \\((D_N,\\Theta)\\) therefore separates the magnitude of the maximal purification overlap from the geometric reorientation of the optimal purification frames. Since the optimal Procrustes rotation can be lifted to a local unitary acting on the ancilla, the construction also provides an operational interpretation of the optimal purification in terms of an ancilla-side transformation.", "url": "https://arxiv.org/abs/2605.18485", "type": "理论+数值", "summary": "1. 该工作将混合量子比特态的Uhlmann净化重叠优化重新表述为SO(3)上的正交Procrustes问题，并基于Fano表示建立了分析量子信道的几何框架。\n2. 其核心在于通过最优旋转定义净化失配角Θ，将度量D_N的幅度与辅助帧的几何重定向分离，从而揭示非共线信道作用下的几何信息。\n3. 该框架为量子信道的特征提取和操作解释提供了直观几何工具，可能推动基于净化距离的信道区分与量子误差表征研究。", "summary_source": "deepseek", "authors": [{"name": "Tristán M. Osán"}], "featured_authors": [{"name": "Tristán M. Osán"}], "author_count": 1}, {"id": "2605.18494", "category": "quant-ph", "title": "Quantum magic of strongly correlated fermions $-$ the Hubbard dimer", "abstract": "We study the non-stabilizerness (quantum magic) content of the Hubbard dimer, an analytically solvable, yet completely non-trivial, model of strongly correlated fermions. We can access zero- and finite-temperature properties as well as the time evolution in a quantum quench protocol. We evaluate local and nonlocal non-stabilizerness using both the robustness of magic and the stabilizer Renyi entropy, demonstrating how the latter often fails in detecting the mixed stabilizer states that are typically found in this kind of systems. Finally, we compare the non-stabilizerness with other genuine resources of quantum-state complexity, i.e., the fermionic non-Gaussianity and the superselected two-site entanglement. Our findings corroborate the notion of non-stabilizerness as a fundamentally different quantum resource, able to give profound insights that are missed by more traditional information-theoretic quantities.", "url": "https://arxiv.org/abs/2605.18494", "type": "理论+数值", "summary": "1. 该工作解析求解了Hubbard二聚体中的非稳定化子性（量子魔性），涵盖零温、有限温及量子淬火动力学。\n2. 卖点在于揭示稳定化子Renyi熵在检测混合稳定化子态时的失效，并将魔性与费米子非高斯性及超选择两体位点纠缠进行资源对比。\n3. 这为理解强关联体系中魔性作为独立量子资源提供了新视角，拓展了量子复杂度度量的应用边界。", "summary_source": "deepseek", "authors": [{"name": "Edoardo Zavatti"}, {"name": "Gabriele Bellomia"}, {"name": "Massimo Capone"}], "featured_authors": [{"name": "Edoardo Zavatti"}, {"name": "Gabriele Bellomia"}, {"name": "Massimo Capone"}], "author_count": 3}, {"id": "2605.18569", "category": "quant-ph", "title": "Reinforcement Learning Assisted Quantum Simulation of Many-Body Excited States and Real-Time Dynamics", "abstract": "The computation of electronic excited states and real-time quantum dynamics of many-fermion systems is among the most promising applications of near-term quantum computing. In this work, we generalize the reinforcement learning contracted quantum eigensolver (RL-CQE), previously developed for ground-state problems, to electronic excited states and real-time quantum dynamics, in which a deep Q-network agent adaptively selects the two-body operators at each iteration, yielding more compact ansätze and improved robustness with respect to critical hyperparameters. A key feature of the algorithm is a scalable state representation based on the ACSE residuals, whose dimension grows with the one-particle basis but remains independent of the number of targeted excited states. We also verify the equivalence of sign-free qubit operators in the excited-state setting, extending a result previously established for ground-state problems. Our RL-CQE for time evolution derives from a constant-scaling ansatz that represents the wave function with a fixed number of unitary transformations independent of simulation time $t$, enabled by the shared unitary structure of the purified ensemble treatment of excited states. Benchmarks on chemical systems demonstrate chemical accuracy with minimal operator counts across a range of bond lengths.", "url": "https://arxiv.org/abs/2605.18569", "type": "理论+数值", "summary": "1. 该工作将强化学习压缩量子特征求解器从基态推广至电子激发态和实时量子动力学，利用深度Q网络自适应选择双体算符以生成更紧凑的ansatz并提升对超参数的鲁棒性。\n2. 技术核心在于基于ACSE残差的可扩展态表示（维度随单粒子基增长而不依赖激发态数目）以及用于时间演化的恒定缩放幺正变换ansatz，后者通过激发态纯化系综的共享幺正结构摆脱对模拟时间的依赖。\n3. 该算法在化学基准测试中于宽键长范围内以最少算符数达到化学精度，为近期量子计算在多费米子体系激发态及动力学模拟中的实用化提供了可扩展方案。", "summary_source": "deepseek", "authors": [{"name": "Jiaji Zhang"}, {"name": "Lipeng Chen"}, {"name": "Carlos L. Benavides-Riveros"}], "featured_authors": [{"name": "Jiaji Zhang"}, {"name": "Lipeng Chen"}, {"name": "Carlos L. Benavides-Riveros"}], "author_count": 3}, {"id": "2605.18594", "category": "quant-ph", "title": "Krylov complexity and fidelity susceptibility in two-band Hamiltonians", "abstract": "We investigate Krylov spread complexity for the ground state of two-band Hamiltonians, where the reference state is a generic state on the Bloch sphere. The spread complexity is obtained by using a purely geometric formulation in terms of Bloch sphere data without constructing the circuit Hamiltonian. For generic reference states, the derivative of the spread complexity is logarithmically divergent at the topological phase transition in the Su-Schrieffer-Heeger (SSH) model. We demonstrate that the derivative of the spread complexity is bounded by fidelity susceptibility for general two-band models, indicating the sensitivity of the spread complexity to any gap closing (topological or trivial). This is illustrated in the massive Dirac Hamiltonian with a trivial gap closing. Finally, we introduce a non-unitary duality in the SSH model between the topological and trivial phases, which manifests itself in the spread complexity and fidelity susceptibility.", "url": "https://arxiv.org/abs/2605.18594", "type": "理论", "summary": "1. 该工作利用Bloch球几何公式，研究了任意参考态下两带哈密顿量基态的Krylov展开复杂度，无需构造电路哈密顿量。\n2. 其核心发现在于SSH模型拓扑相变处复杂度导数呈对数发散，且对一般两带模型，该导数被保真度敏感度所界，揭示复杂度对任意能隙闭合的敏感性。\n3. 这为通过复杂度信息几何探测拓扑相变及非酉对偶性提供了明确理论工具，可推广至更广泛的多带或相互作用系统。", "summary_source": "deepseek", "authors": [{"name": "Rishav Chaudhuri"}, {"name": "Ayush Raj"}, {"name": "Soham Ray"}, {"name": "Sai Satyam Samal"}], "featured_authors": [{"name": "Rishav Chaudhuri"}, {"name": "Ayush Raj"}, {"name": "Soham Ray"}, {"name": "Sai Satyam Samal"}], "author_count": 4}, {"id": "2605.18622", "category": "quant-ph", "title": "Fibonacci many-body scars in a decorated Rule-54 quantum cellular automaton", "abstract": "Quantum many-body scars provide a controlled form of weak ergodicity breaking, in which structured nonthermal eigenstates coexist with a thermalizing many-body spectrum. We introduce a qubit-level route to exact scars based on the intrinsic soliton structure of the Rule-54 quantum cellular automaton. A hard-core dimer sector of Rule 54 supplies an exactly translatable protected skeleton, while local projector-controlled decorations are invisible on this skeleton and nontrivial outside it. The protected dynamics is therefore reducible to finite translation orbits, whose Fourier modes form exact Floquet eigenstates with sub-volume-law entanglement. The number of exact scars grows with Fibonacci combinatorics, whereas their fraction in the full qubit Hilbert space remains exponentially small. Finite-size simulations show Page-like eigenstate entanglement, rapid entanglement growth, fidelity decay, and circular unitary ensemble quasienergy statistics in the decorated complement. This construction demonstrates that exact many-body scars can be engineered from native finite-orbit structures of an interacting reversible automaton, and provides a direct starting point for digital quantum simulation of scarred cellular-automaton dynamics.", "url": "https://arxiv.org/abs/2605.18622", "type": "理论+数值", "summary": "1. 该工作基于Rule-54量子细胞自动机的内在孤子结构，在量子比特层次上构造了精确的多体疤痕态。\n2. 其关键机制在于利用硬核二聚体骨架提供可精确平移的保护轨道，通过局域投影算符装饰实现了子体积律纠缠的Floquet本征态，且疤痕数量服从斐波那契组合增长。\n3. 这为数字量子模拟中工程化可积自动机的疤痕动力学提供了直接起点，并启示了利用有限轨道结构可控实现弱遍历性破缺的新途径。", "summary_source": "deepseek", "authors": [{"name": "Han-Ze Li"}, {"name": "Jian-Xin Zhong"}], "featured_authors": [{"name": "Han-Ze Li"}, {"name": "Jian-Xin Zhong"}], "author_count": 2}, {"id": "2605.18639", "category": "quant-ph", "title": "Open quantum dynamics without Complete Positivity: a criticism", "abstract": "The requirement of complete positivity is very often regarded as a fundamental consistency condition for the description of open quantum dynamics. We critically examine this requirement and discuss both its physical motivations and its limitations. We analyze proposals based on restricting the domain of non-completely positive maps to subsets of compatible initial states. Using isotropic states as a concrete example, we show that such domain restrictions become increasingly severe with growing system dimension, revealing an intrinsic weakness of the compatibility-based approach.", "url": "https://arxiv.org/abs/2605.18639", "type": "理论", "summary": "1. 该工作批判性地审视了开放量子动力学中完全正性要求的必要性及其物理依据。\n2. 通过各向同性态示例，揭示了基于相容初态子集限制非完全正映射的方法随系统维度增大而失效的固有问题。\n3. 这为重新评估开放系统理论的基础假设提供了警示，并推动了更普适动力学框架的探索。", "summary_source": "deepseek", "authors": [{"name": "Fabio Benatti"}, {"name": "Dariusz Chruściński"}, {"name": "Saverio Pascazio"}], "featured_authors": [{"name": "Fabio Benatti"}, {"name": "Dariusz Chruściński"}, {"name": "Saverio Pascazio"}], "author_count": 3}, {"id": "2605.18677", "category": "quant-ph", "title": "Strategy optimization for quantum conference key agreement in asymmetric star networks", "abstract": "The distribution of entangled states is a core task for quantum networks facilitating quantum communication, and the use of multipartite entangled states comes with its own set of considerations. In this work, we analyze a quantum conference agreement protocol based on GHZ states in a network with a central station to which multiple clients are connected. Using comprehensive numerical simulations, we investigate how minor variations in the scenario-such as the number of parties, the number of memories, and asymmetric distances from the central station-can drastically influence the performance of the protocol. In particular, we demonstrate that it is crucial to adjust the strategy by optimizing cutoff times. From a broader perspective, we argue that numerical simulations are an indispensable tool for protocol design for devising realistic schemes for quantum communication.", "url": "https://arxiv.org/abs/2605.18677", "type": "数值", "summary": "1. 该工作通过数值模拟分析了基于GHZ态的量子会议密钥协议在非对称星形网络中的性能，研究用户数量、存储器数目以及不对称距离对协议效率的影响。\n2. 核心卖点在于揭示优化截止时间策略对于提升协议性能的关键作用，并证明数值模拟是设计实际量子通信方案不可或缺的工具。\n3. 这为在多参数非对称量子网络中针对具体场景进行协议参数自适应调整提供了明确指导，并启发未来利用模拟方法优化复杂量子网络协议。", "summary_source": "deepseek", "authors": [{"name": "Janka Memmen"}, {"name": "Julia Kunzelmann"}, {"name": "Nathan Walk"}, {"name": "Jens Eisert"}, {"name": "Julius Wallnöfer"}], "featured_authors": [{"name": "Janka Memmen"}, {"name": "Julia Kunzelmann"}, {"name": "Nathan Walk"}, {"name": "Jens Eisert"}, {"name": "Julius Wallnöfer"}], "author_count": 5}, {"id": "2605.18726", "category": "quant-ph", "title": "Quantum Shannon theory made robust: a tale of three protocols for almost i.i.d. sources", "abstract": "The asymptotic rates of information-theoretic protocols - including error exponents, compression rates, and channel capacities - are traditionally defined under the idealised assumption that the underlying resource (state or channel) is independent and identically distributed (i.i.d.). Somewhat surprisingly, even slight departures from the exact i.i.d. structure can lead to a drastic breakdown of these protocols. The asymptotic rates of information theoretic protocols - error exponents, compression rates, capacities - were originally evaluated taking for granted that the underlying source (state or channel) is i.i.d. Differently from what we might expect at first glance, it is not hard to exhibit instances of protocols that may drastically fail when the i.i.d. assumption holds only approximately rather than exactly. If the precise nature of the perturbation from the i.i.d. regime is known (e.g. a pointwise defect), we could design a bespoke protocol that compensates for the defect (for example, by discarding the corrupted subsystem). However, in any realistic setting, neither can the i.i.d. behaviour of the system be precisely guaranteed, nor can the deviations from the ideal regime be determined exactly. In this paper we answer the following question: are there protocols that can still achieve the optimal asymptotic rates when the i.i.d. resource is replaced by any arbitrary almost i.i.d. resource along it? What is the nature of the unknown perturbation under which protocols like these are possible? We focus, in particular, on hypothesis testing, data compression, and channel coding. As a by-product of our analysis, we introduce the notion of club distance, as a variant of the well-known diamond distance, and of an almost i.i.d. process, which may be of independent interest.", "url": "https://arxiv.org/abs/2605.18726", "type": "理论+数值", "summary": "1. 该工作研究了假设检验、数据压缩和信道编码三种量子信息协议在任意近乎独立同分布（i.i.d.）源下的鲁棒性，并证明了仍能实现最优渐近速率的存在条件。\n2. 其核心卖点是引入俱乐部距离与近乎i.i.d.过程概念，刻画了未知扰动下协议不失效的边界，揭示了扰动维数等关键几何约束。\n3. 这为实际量子系统中偏离理想i.i.d.假设时设计容错协议提供了理论框架，并启发对更广资源鲁棒性的量化研究。", "summary_source": "deepseek", "authors": [{"name": "Filippo Girardi"}, {"name": "Nilanjana Datta"}, {"name": "Giacomo De Palma"}, {"name": "Ludovico Lami"}], "featured_authors": [{"name": "Filippo Girardi"}, {"name": "Nilanjana Datta"}, {"name": "Giacomo De Palma"}, {"name": "Ludovico Lami"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
