dary state, a conjecture established exactly for the BTZ black hole in AdS$_{3}$ at the semiclassical level. We examine possible extensions of the correspondence by considering boundary higher Krylov complexities and Krylov correlators encoding fluctuations and temporal correlations of the spreading quantum state. To this end, we derive exact results for Krylov correlators in quantum systems with $\\mathfrak{sl}(2,\\mathbb{R})$ or Heisenberg-Weyl symmetry and apply them to the complexity--momentum correspondence. We show that certain out-of-time-ordered correlators of two or more Krylov speed operators at different times are proportional to combinations of the proper radial momenta of a particle falling into the BTZ black hole in AdS$_{3}$, evaluated at those times. This represents a first step in the generalization of the original complexity--momentum relation.", "url": "https://arxiv.org/abs/2605.17550", "type": "理论", "summary": "1. 该工作推导了具有\\(\\mathfrak{sl}(2,\\mathbb{R})\\)或海森堡-外尔对称性系统中Krylov关联函数的精确结果，并应用于全息复杂性-动量对应关系的推广。\n2. 其卖点在于证明多个Krylov速度算符的时序错乱关联函数与AdS\\(_3\\)中BTZ黑洞内下落粒子的本征径向动量组合成比例，连接了边界高阶Krylov复杂性涨落与体时空动力学。\n3. 这为将全息复杂性对应关系从原始形式扩展至更高阶Krylov复杂性及量子涨落提供了可精确计算的理论框架，并启发对非时序关联函数与体几何关联的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Eleonora Alfinito"}, {"name": "Matteo Beccaria"}], "featured_authors": [{"name": "Eleonora Alfinito"}, {"name": "Matteo Beccaria"}], "author_count": 2}, {"id": "2605.17586", "category": "hep-th", "title": "Semi-classical Imprint of Horizon Induced Instability", "abstract": "We consider an inverted harmonic oscillator in the space $L^{2} (\\mathbb{S})$ of square-integrable functions on the circle $\\mathbb{S}$ and compute its density of states employing the stationary phase approximation. Our computation is based on an oscillatory integral representation of the Schwartz kernel of the time-evolution operator. This demonstrates thermalisation as a semi-classical manifestation of the classical Lyapunov instability -- reported earlier in [Phys. Rev. D 102, 044006; Phys. Rev. D 102, 124047] using heuristic analytic continuation. Our spectral analysis of the Hamiltonian points out and closes the conceptual and mathematical gaps in the preceding literature.", "url": "https://arxiv.org/abs/2605.17586", "type": "理论", "summary": "1. 该工作通过稳相近似计算圆上倒谐振子的态密度，基于时间演化算子的振荡积分表示。\n2. 其卖点在于将热化证明为经典Lyapunov不稳定性的半经典表现，并填补了先前文献中谱分析的概念与数学空白。\n3. 这为理解视界诱导不稳定性与热化的半经典印记提供了严格的数学基础，启发相关量子引力模型研究。", "summary_source": "deepseek", "authors": [{"name": "Arnab Chakraborty"}, {"name": "Onirban Islam"}, {"name": "Arshad Momen"}], "featured_authors": [{"name": "Arnab Chakraborty"}, {"name": "Onirban Islam"}, {"name": "Arshad Momen"}], "author_count": 3}, {"id": "2605.17643", "category": "hep-th", "title": "Anomaly-Free Spectra, Unimodular Lattices and 6D R-Symmetry Gauged Supergravity", "abstract": "We study the classification problem for anomaly-free 6D $\\mathcal N=(1,0)$ supergravities with a gauged abelian R-symmetry and one tensor multiplet. We present eleven new models with gauge group $G_{\\mathrm{non-Abelian}}\\times U(1)_R$ that satisfy the local Green--Schwarz factorization condition, together with several recently proposed global consistency conditions. In particular, the low-rank models we found are precisely where some of the recent enumeration literature is least directly applicable. These examples suggest that the landscape of anomaly-free gauged $U(1)_R$ supergravities may be richer than previously recognized while still remaining highly constrained. We analyze the arithmetic structure of the anomaly coefficients, including their integral pairings, embeddability into rank-two unimodular charge lattices, the characteristic-vector condition and ghost-free gauge-field conditions. We show that $n_V \\equiv 8 \\pmod{12}$ is necessary and sufficient for the unimodular embeddability in the rank-two case. For the characteristic-vector condition we verify sufficiency for the branches realized by our examples and identify a remaining branch requiring additional exclusion. We also present a detailed discussion of the contribution to the anomaly polynomial when the $D_4$ Lie algebra is present. These results sharpen the boundary between anomaly-free 6D spectra, global-consistency constraints, and possible UV realization in string theory or F-theory.", "url": "https://arxiv.org/abs/2605.17643", "type": "理论", "summary": "1. 该工作针对具有规范化的U(1)_R对称性及一个张量多重态的6维N=(1,0)超引力，提出了11个满足局域Green-Schwarz因子化与多项全局一致性条件的新无异常模型，并分析了低秩情形下先前枚举方法的不足。\n2. 其技术核心在于对异常系数进行了算术结构分析，包括积分配对与秩2幺模格嵌入，证明了规范玻色子数n_V ≡ 8 (mod 12)是幺模可嵌入的充要条件，并验证了特征向量条件在大部分分支上的有效性。\n3. 这些结果严格划定了无异常6D谱与全局一致性约束之间的边界，为弦/F理论中的UV实现提供了新的算术约束，并表明该理论景观虽高度受限但可能比此前认知更为丰富。", "summary_source": "deepseek", "authors": [{"name": "Katrin Becker"}, {"name": "Qi You"}], "featured_authors": [{"name": "Katrin Becker"}, {"name": "Qi You"}], "author_count": 2}, {"id": "2605.17751", "category": "hep-th", "title": "An Alternative Viewpoint on Kinematic Flow from Tubing Splitting", "abstract": "The differential equations satisfied by the wavefunction coefficients of conformally coupled scalars in a power-law cosmology can be recast into an iterative differential system of basis functions. These functions can be encoded within graph tubings, and are governed by a set of rules describing how they flow in kinematic space. In this paper we propose a new viewpoint on the kinematic flow by reformulating the relations among these basis functions through reversing the evolution direction of the tubings. The differential equations can then be derived by constructing appropriate splitting rules equivalent to the kinematic flow (at tree level). While the implementation of these rules can be somewhat complicated, they reveal richer physical structures underlying the differential equations, such as singularities and local evolution. Under an alternative basis based on time ordering, these rules offer important implications for how time emerges from kinematic space. This conclusion is even not restricted to individual Feynman diagrams, and can be generalized to the tr $\\phi^3$ theory. This suggests that the tubings, as well as the kinematic flow, might be more fundamental objects than the differential equations, and have a life of their own.", "url": "https://arxiv.org/abs/2605.17751", "type": "理论", "summary": "1. 该工作通过逆转图管演化方向，将共形耦合标量波函数系数所满足的微分方程重构为管分裂规则，提出了运动学流的新视角。\n2. 其卖点在于分裂规则揭示了微分方程背后奇异性与局域演化等丰富物理结构，并在时间排序基矢下暗示时间从运动学空间涌现。\n3. 这一结论可推广至tr φ^3理论，表明管与运动学流可能比微分方程更为基本，具有独立物理生命力。", "summary_source": "deepseek", "authors": [{"name": "Ji-Yuan Ke"}, {"name": "Ping He"}], "featured_authors": [{"name": "Ji-Yuan Ke"}, {"name": "Ping He"}], "author_count": 2}, {"id": "2605.17817", "category": "hep-th", "title": "A Renormalizable and Unitary Approach to Quantum Gravity", "abstract": "A Lagrange multiplier field restricts the quantum corrections to the Einstein-Hilbert action at one-loop order, yielding a model that is renormalizable and unitary while reproducing the Einstein field equations in the classical limit.", "url": "https://arxiv.org/abs/2605.17817", "type": "理论", "summary": "1. 该工作提出一种通过引入拉格朗日乘子场来限制单圈阶量子修正的量子引力模型。\n2. 其物理卖点在于该模型同时满足可重整性与幺正性，并在经典极限下精确还原爱因斯坦场方程。\n3. 这为在保持幺正性的前提下构建可重整的量子引力理论提供了新的技术路线。", "summary_source": "deepseek", "authors": [{"name": "D. G. C. McKeon"}, {"name": "F. T. Brandt"}, {"name": "J. Frenkel"}, {"name": "S. Martins-Filho"}], "featured_authors": [{"name": "D. G. C. McKeon"}, {"name": "F. T. Brandt"}, {"name": "J. Frenkel"}, {"name": "S. Martins-Filho"}], "author_count": 4}, {"id": "2605.17919", "category": "hep-th", "title": "Superform Approach to Equivariant Localization in Supergravity", "abstract": "We identify a superspace mechanism behind equivariant localization in supergravity. We show that closed superforms generate, on supersymmetric backgrounds, equivariantly closed polyforms. After presenting the general mechanism, we construct such polyforms for vector and linear multiplets, and for chiral and BF action principles, in off-shell $4d$ $\\mathcal{N}=2$ conformal supergravity, reproducing and extending recent results. Our construction provides a geometric first step toward equivariant localization of BPS observables in supergravity, including higher-derivative theories, and holography.", "url": "https://arxiv.org/abs/2605.17919", "type": "理论", "summary": "1. 该工作识别了超引力中等变局域化背后的超空间机制，即闭超形式在超对称背景上生成等变闭多形式，并为此构造了具体例子。\n2. 主要卖点是在离壳4d N=2共形超引力中，为矢量、线性多重态及手性和BF作用量原理系统构造了此类等变闭多形式，再现并推广了近期结果。\n3. 这为超引力中BPS可观测量（包括高阶导数理论与全息对偶）的等变局域化提供了几何化第一步，奠定了后续计算的基础。", "summary_source": "deepseek", "authors": [{"name": "Michele Galli"}, {"name": "Christian Kennedy"}, {"name": "Parth Raina"}, {"name": "Gabriele Tartaglino-Mazzucchelli"}], "featured_authors": [{"name": "Michele Galli"}, {"name": "Christian Kennedy"}, {"name": "Parth Raina"}, {"name": "Gabriele Tartaglino-Mazzucchelli"}], "author_count": 4}, {"id": "2605.18213", "category": "hep-th", "title": "The classical Yangian symmetry of Auxiliary Field Sigma Models", "abstract": "Integrable field theories exhibit infinitely many symmetries which underlie their solvability, but the structure of these symmetries can become obscured after performing an integrable deformation such as $\\TT$ or an auxiliary field deformation. In this paper, we present a systematic organizing principle for understanding deformed charges and their Yangian structure in a broad class of integrable sigma models and their auxiliary field deformations. We generalize the recursive procedure of Brezin, Itzykson, Zinn-Justin, and Zuber (BIZZ) for generating non-local charges, and give sufficient conditions under which the resulting charges obey a Yangian algebra. We apply these results to many examples of integrable sigma models and their auxiliary field deformations, finding a Yangian algebra and Maillet bracket structure in all cases. This offers a unified explanation for the persistence of Hamiltonian integrability and Yangian symmetry across a wide landscape of deformed sigma models.", "url": "https://arxiv.org/abs/2605.18213", "type": "理论", "summary": "1. 该工作提出系统化组织原则，推广BIZZ递归过程以生成辅助场西格玛模型中的非局域电荷。\n2. 其卖点在于给出电荷满足Yangian代数的充分条件，揭示形变后Maillet括号结构与可积性的统一机制。\n3. 这为理解T形变及辅助场形变下可积模型对称性保持提供了统一理论框架。", "summary_source": "deepseek", "authors": [{"name": "Daniele Bielli"}, {"name": "Christian Ferko"}, {"name": "Michele Galli"}, {"name": "Gabriele Tartaglino-Mazzucchelli"}], "featured_authors": [{"name": "Daniele Bielli"}, {"name": "Christian Ferko"}, {"name": "Michele Galli"}, {"name": "Gabriele Tartaglino-Mazzucchelli"}], "author_count": 4}, {"id": "2605.18220", "category": "hep-th", "title": "Properties of the quantum vacuum in non-abelian gauge theories", "abstract": "In this thesis we analyze the quantum vacuum properties of non-abelian gauge theories. We calculate the energy of the quantum vacuum by non-perturbative methods using Monte Carlo simulations, focusing on the contribution of boundary effects to the Casimir energy. In particular, we analyze the dependence of the vacuum energy on the types of boundary conditions. The main goal is to clarify the behaviour of this energy for large separation L between the boundaries of the domain where the fields are confined. Usually this Casimir energy decreases polynomially with L for massless theories and exponentially for massive theories. Since gauge theories interpolate between these two regimes, being massless in the ultraviolet regime and massive in the infrared regime, one expects a very special change of behaviour from the perturbative to the non-perturbative approaches. In pure gauge theories there is evidence of the existence of glueball states in the low energy spectrum with a non-vanishing mass, the second goal will be testing if the mass of the lightest glueball is responsible for the exponential decay of the Casimir energy of gauge theories.", "url": "https://arxiv.org/abs/2605.18220", "type": "理论", "summary": "1. 该工作通过非微扰格点蒙特卡洛模拟，计算了SU(N)非阿贝尔规范场论在平行板边界约束下的Casimir真空能，系统考察了Dirichlet与Neumann等边界条件对真空能随板间距L行为的依赖。\n2. 其核心进展在于定量揭示了Casimir能量从紫外无质量极限下的幂律衰减向红外有质量极限下指数衰减的非微扰过渡，并直接论证最轻胶球质量为控制该指数衰减的特征能标。\n3. 这为从非微扰角度理解规范真空在限制几何下的色介质性质及其与色禁闭的关联提供了关键数值证据，并对未来胶球谱、边界态及Casimir效应的理论与实验研究具有重要启发。", "summary_source": "deepseek", "authors": [{"name": "Fernando Ezquerro"}], "featured_authors": [{"name": "Fernando Ezquerro"}], "author_count": 1}, {"id": "2605.18341", "category": "hep-th", "title": "Renormalisation Group Invariants from Scaling and Non-overlapping Symmetries", "abstract": "We show how the synergy of scaling and non-overlapping global symmetries can lead to Renormalisation Group Invariants (RGIs) among the parameters of potentials with multiple scalars. The instrumental role of scale-invariant field directions in the identification and construction of RGIs for bilinear field operators to all loops is demonstrated. We present a few illustrative examples to showcase our constructive spurion-field approach, which is applied to simple non-supersymmetric models as well as to scenarios reported recently in the literature that include the two-Higgs doublet model. The implications of our spurion-field formalism to address the gauge-hierarchy problem are discussed.", "url": "https://arxiv.org/abs/2605.18341", "type": "理论", "summary": "1. 该工作展示了标度对称性与非重叠全局对称性的协同作用如何导致多标量势参数中的重正化群不变量。\n2. 技术要点在于揭示了标度不变场方向在双线性场算子全阶RGIs构造中的关键作用，并提出了spurion场方法。\n3. 这一形式为规范等级问题提供了新视角，并可推广至双希格斯二重态模型等非超对称体系。", "summary_source": "deepseek", "authors": [{"name": "Apostolos Pilaftsis"}], "featured_authors": [{"name": "Apostolos Pilaftsis"}], "author_count": 1}, {"id": "2605.18403", "category": "hep-th", "title": "Tachyonic (In)stability in Randall-Sundrum Braneworld Scenarios", "abstract": "Low-energy effective theories provide a natural description of four-dimensional physics in higher-dimensional geometries, where the imprint of the bulk geometry appears as parameters of the lower-dimensional theory. Inspired by the Damour-Esposito-Farése (DEF) model of spontaneous scalarization in first generation Scalar-Tensor theories of gravity, we investigate the possibility of tachyonic instability and spontaneous scalarization in braneworld scenarios. We consider the two-brane Randall-Sundrum model where the low-energy effective theory on either brane is of scalar-tensor nature with the extra-dimensional radion playing the role of the scalar. We have determined the possibilities for tachyonic (in)stability of the radion field on either branes in three scenarios: the Randall-Sundrum (RS) model with fine-tuning conditions in which the potential of the radion field vanishes identically, the RS model without fine-tunings where the radion potential arises purely from the gravity sector, and the RS model with a bulk stabilizing field that generates a radion potential with a minimum. With the bulk stabilizing field, we have found that on-brane matter with $T>0$ changes the VEV of the radion, destroying the resolution of the gauge hierarchy problem, whereas on-brane matter with $T<0$ does not alter the stability and VEV of the radion. We further determined the exact condition of tachyonic (in)stability of radion field on Planck brane with the FLRW background geometry on the brane. Finally, we have extended the same formalism to study the tachyonic (in)stability conditions of $f(R)$ theories of gravity with the motivation that the 4D effective theory on RS branes can be casted into a $f(R)$ theory on the branes at the inflationary epoch of cosmology.", "url": "https://arxiv.org/abs/2605.18403", "type": "理论", "summary": "1. 该工作研究了Randall-Sundrum双膜世界模型中radion场的快子不稳定性与自发标量化现象。\n2. 关键在于揭示了膜上物质能量动量迹T的正负对radion真空期望值的影响，并确定了FLRW背景下快子不稳定性的精确条件。\n3. 这启发将分析推广至暴涨时期的f(R)引力，为探索高维时空标量化不稳定性与层级问题可解性提供新途径。", "summary_source": "deepseek", "authors": [{"name": "Abhirup Karmakar"}, {"name": "Soumitra SenGupta"}], "featured_authors": [{"name": "Abhirup Karmakar"}, {"name": "Soumitra SenGupta"}], "author_count": 2}, {"id": "2605.18514", "category": "hep-th", "title": "Monodromy of Calabi-Yau threefold flops via grade restriction rule and their quantum Kahler moduli", "abstract": "We present exact expressions, based on the grade restriction rule and window categories, for monodromies associated to certain Calabi-Yau threefold flops. We show a general formula for the monodromy action on the lattice of B-brane charges, based on the hemisphere partition function for abelian and nonabelian gauged linear sigma models. We exploit the explicit form of the discriminant in the quantum Kähler moduli to further refine the form of the monodromies, in several examples, using their relation to the fundamental group of nested torus links.", "url": "https://arxiv.org/abs/2605.18514", "type": "理论", "summary": "1. 该工作基于级数限制规则与窗口范畴，给出了Calabi-Yau三折叠翻折单值性的精确表达式。\n2. 其核心卖点是利用阿贝尔与非阿贝尔规范线性sigma模型的半球配分函数，推导出B-brane电荷格上单值性的一般公式。\n3. 这通过量子Kähler模空间判别式与嵌套环面链环基本群的关联，为拓扑弦论单值性结构的解析理解提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Ban Lin"}, {"name": "Mauricio Romo"}], "featured_authors": [{"name": "Ban Lin"}, {"name": "Mauricio Romo"}], "author_count": 2}, {"id": "2605.18536", "category": "hep-th", "title": "The Large Vector Multiplet and Gauging $(2,2)$ $σ$-models", "abstract": "The Large Vector Multiple (LVM) is the relevant gauge multiplet for gauging isometries acting on both the chiral and the twisted chiral fields in a $(2, 2)$ sigma model. Here we show that a recently proposed new gauge multiplet is a constrained or partially dualized version of the LVM. Gauging using this multiplet results in a $(2, 2)$ $\\beta\\gamma$ system interacting with a sigma model.", "url": "https://arxiv.org/abs/2605.18536", "type": "理论", "summary": "1. 该工作证明(2,2) sigma模型中规范作用在手征与扭曲手征场等距的大矢量多重态，约束或部分对偶后等价于新近建议的规范多重态。\n2. 核心在于利用该约束多重态进行规范，导出(2,2) βγ系统与sigma模型相互作用的明确构造。\n3. 这为统一描述手征和扭曲手征场耦合的规范理论提供了对偶框架，可启发更多超对称sigma模型的研究。", "summary_source": "deepseek", "authors": [{"name": "Dmitri Bykov"}, {"name": "Ulf Lindström"}, {"name": "Martin Roček"}], "featured_authors": [{"name": "Dmitri Bykov"}, {"name": "Ulf Lindström"}, {"name": "Martin Roček"}], "author_count": 3}, {"id": "2605.18544", "category": "hep-th", "title": "The Classical Gravitational Impulse at High Energies", "abstract": "We compute the gravitational impulse for two classical massive scalars in the ultrarelativistic limit to all orders in Newton's constant $G_N$ at fixed $G_N s/m b$ to $O(m^4/s^2)$. By computing the 4 and 5-point scattering amplitudes in the small-mass regime of $-t\\sim m^2$, we are able to resum all large $G_N s$ corrections. Applying the KMOC formula for the impulse and taking the large mass limit, we recover the classical result at high energies. This resummation is in complete agreement with known results in the post-Minkowski expansion, and in the massless limit we recover previous results for the radiated energy. We use this resummed amplitude to predict the leading high-energy behavior of the PM expansion to eleventh post-Minkowski order.", "url": "https://arxiv.org/abs/2605.18544", "type": "理论", "summary": "1. 该工作在超相对论极限下对牛顿常数所有阶计算了经典引力冲量，固定G_N s/m b至O(m^4/s^2)精度。\n2. 其技术核心在于利用小质量区4点和5点散射振幅重求和所有大G_N s修正，通过KMOC公式恢复经典高能极限。\n3. 所得重求和振幅可预测后闵可夫斯基展开至十一阶的领先高能行为，为经典引力散射的完全性检验提供基准。", "summary_source": "deepseek", "authors": [{"name": "Michael Saavedra"}], "featured_authors": [{"name": "Michael Saavedra"}], "author_count": 1}, {"id": "2605.18628", "category": "hep-th", "title": "Field Theory Models for a Holographic Superconductor in Two Dimensions", "abstract": "We investigate field theory models of holographic superconductors in which the condensation of the order parameter is induced by a Robin boundary condition. Assuming large-$c$ factorization, we study the phase diagram of a two-dimensional CFT deformed by a relevant double-trace perturbation. Using modular invariance, we relate the high- and low-temperature phases, reproducing analytically the results for the zero-winding sector of the holographic model. Moreover, we match the near-critical behaviour of the condensate with an effective Ginzburg--Landau field theory description. Another important feature of the holographic superconductor is the presence of vortices that carry fractional magnetic flux. We investigate a field theory toy model with similar properties and interpret it as a fractional Little--Parks effect.", "url": "https://arxiv.org/abs/2605.18628", "type": "理论", "summary": "1. 该工作构建了由Robin边界条件诱导序参量凝聚的二维全息超导体场论模型，并利用大c因子化假设研究受双迹形变扰动的CFT相图。\n2. 其核心在于借助模不变性解析关联高温与低温相，重现全息模型零缠绕扇区结果，并将近临界凝聚行为有效匹配至Ginzburg-Landau描述。\n3. 这为理解全息超导体中携带分数磁通涡旋的场论本质提供了玩具模型，并启发对分数Little-Parks效应的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Salvatore Santoro"}, {"name": "Roberto Auzzi"}, {"name": "Stefano Bolognesi"}], "featured_authors": [{"name": "Salvatore Santoro"}, {"name": "Roberto Auzzi"}, {"name": "Stefano Bolognesi"}], "author_count": 3}, {"id": "2605.18631", "category": "hep-th", "title": "$J\\bar{J}$-deformation as a Riemann bilinear dressing", "abstract": "We propose a reformulation of the conformal perturbation theory of the correlation functions in $J\\bar{J}$-deformed CFTs as a dressing on the deformed operators, that matches both bare and renormalized perturbation theory. The key is to use the Riemann bilinear identity to convert the deformation into a dressing and a large-cycle integral for higher genus. Based on the proposal, we calculate the deformation of partition functions on the torus and higher genus Riemann surfaces, which can be written as kernel integrals that preserve modular invariance or covariance. We also calculate the flow of the conformal weights and conserved charges along the deformation. Based on this flow and the modular $S$-transformation, we propose a criterion for constructing dressed operators. We test our formalism and results by studying the $O(2, 2)$ theories and strings on the TsT background.", "url": "https://arxiv.org/abs/2605.18631", "type": "理论", "summary": "1. 该工作将$J\\bar{J}$-变形共形场论中关联函数的微扰理论重新表述为一种基于Riemann双线性恒等式的算符dressing形式，并计算了环面及高亏格Riemann面上配分函数的变形。\n2. 其核心卖点在于通过大圈积分将变形转化为保持模不变性或协变性的核积分，并基于此和模S变换导出共形权与守恒荷的流动，从而构造dressed算符的判据。\n3. 这一dressing形式为建立模协变的变形算符框架提供了明确路径，并可通过O(2,2)理论和TsT背景上的弦理论进一步检验其普适性与微扰匹配性。", "summary_source": "deepseek", "authors": [{"name": "Kangning Liu"}], "featured_authors": [{"name": "Kangning Liu"}], "author_count": 1}, {"id": "2605.18640", "category": "hep-th", "title": "Modular Lower Bounds on Reeh-Schlieder State Preparation", "abstract": "The Reeh-Schlieder theorem says that every target vector can be approximated from the vacuum by an operator localized in an arbitrarily small spacetime region, but it gives no quantitative cost for doing so. This note isolates a standard Tomita-Takesaki estimate as a model-independent preparation bound. Targets with deeply negative modular energy require large local operators. After rescaling such an operator to a physical contraction, the same estimate becomes a lower bound on postselection overhead. In geometries where the modular Hamiltonian is known, the bound becomes explicit. Bisognano-Wichmann turns it into a boost energy statement for wedges, and the Casini-Huerta-Myers formula gives a stress-tensor version for bounded regions of conformal field theories. Local unitaries can only reach states of nonnegative modular energy. Negative modular sectors require nonunitary or postselected outcomes, giving a preparation cost bound that complements vacuum embezzlement in type III local algebras.", "url": "https://arxiv.org/abs/2605.18640", "type": "理论", "summary": "1. 该工作从Tomita-Takesaki理论中提取标准模估计，建立了从真空态制备任意目标态的模型无关下界，其大小由目标态的模能量负值决定。\n2. 其技术核心是将局域算符范数与后选择概率关联：负模能量态需指数级大的局域算符，缩放为物理收缩后下界转化为后选择开销的指数下界，并借助Bisognano-Wichmann和Casini-Huerta-Myers公式在楔形区域及共形场论有界区域中化为关于Boost能量或应力张量的显式不等式。\n3. 该结果证明局域幺正演化仅能制备非负模能量态，因此为非幺正或后选择方案提供了基本代价，补充了类型Ⅲ局域代数中真空盗用定理关于态制备复杂度的定量理解。", "summary_source": "deepseek", "authors": [{"name": "Javier Blanco-Romero"}, {"name": "Florina Almenares Mendoza"}], "featured_authors": [{"name": "Javier Blanco-Romero"}, {"name": "Florina Almenares Mendoza"}], "author_count": 2}, {"id": "2605.18695", "category": "hep-th", "title": "From classical Lax ODEs to quantum integrable theories: the moduli", "abstract": "The general idea of this paper is to start from a classical integrable (partial differential) equation which arises as a compatibility condition for a matrix linear differential problem. For definitiveness' sake, a generalised sinh-Gordon equation depending on $2N-1$ complex coefficients or moduli is considered. Then, the connexion coefficients (Wronskians) of different solutions to this problem satisfy, in the spirit of the Ordinary Differential Equation/Integrable Model correspondence, functional relations, which can be considered, -- if supplemented by suitable asymptotic behaviours --, as identifying a specific state of a quantum integrable model: in fact they are the eigenvalues of extensions of Baxter operators $Q$ and $T$, the transfer matrix. Moreover, Y-system and (implementing the asymptotic conditions) thermodynamic Bethe Ansatz equations originate from them, without any passage through the scattering theory, and providing an invariant parametrisation of the monodromy space. The crucial novelty is the modification of all the relations because of their dependence on the moduli. For zero momentum, they fully describe physically the quantum homogeneous sine-Gordon model, {\\it i.e.} scattering amplitudes of gauge fields in $\\mathcal{N} = 4$ SYM at strong coupling or their dual null polygonal light-like Wilson loops in $AdS_3$. As a direct consequence of the correspondence, two Zamolodchikov's conjectures, based on previous results, are also proven.", "url": "https://arxiv.org/abs/2605.18695", "type": "理论", "summary": "1. 该工作从经典Lax ODE的可积性条件出发，通过ODE/IM对应建立了依赖模量的广义sinh-Gordon方程与量子可积模型的关联。\n2. 其技术核心在于模量引入后，Wronskian函数关系直接导出修改后的Y系统和TBA方程，无需散射理论即参数化单值性空间。\n3. 这为量子齐次sinh-Gordon模型（即N=4 SYM强耦合散射振幅）提供完整描述，并证明了两条Zamolodchikov猜想。", "summary_source": "deepseek", "authors": [{"name": "Davide Fioravanti"}, {"name": "Marco Rossi"}], "featured_authors": [{"name": "Davide Fioravanti"}, {"name": "Marco Rossi"}], "author_count": 2}, {"id": "2605.18725", "category": "hep-th", "title": "Signatures of Quantum Chaos in the D1D5 System", "abstract": "We investigate the emergence of random-matrix statistics in the D1D5 CFT by studying second-order lifting matrices in low-energy near-BPS sectors. We compare the $N=3$ finite-$N$ lifting problems with the planar large-$N$ limit at fixed orbifold conformal weight and R charges. In the planar large-$N$ limit at fixed orbifold energy, mixing between single-cycle and multi-cycle states is suppressed, and the symmetry-resolved lifting spectra display Poisson-like level statistics. At finite $N$, non-planar terms restore this mixing between different cycle structures. Within the resulting symmetry-resolved sectors, this finite-$N$ mixing is accompanied by level repulsion consistent with random-matrix behavior. These results suggest that, in the low-energy near-BPS sectors accessible to our analysis, non-planar cycle-structure mixing at finite $N$ is associated with the onset of level repulsion and random-matrix-like spacing statistics.", "url": "https://arxiv.org/abs/2605.18725", "type": "理论", "summary": "1. 该工作通过在D1D5 CFT的低能近BPS扇区中求解二阶提升矩阵，系统比较了N=3有限N与固定orbifold权重和R电荷的平面大N极限下对称分辨扇区的能级统计，并对比了随机矩阵理论预测。\n2. 其核心物理机制在于：平面大N极限下循环结构间混合受抑制导致泊松谱，而有限N时非平面项恢复混合，进而在对称分辨扇区内产生能级排斥与随机矩阵类间距分布。\n3. 这一结果直接表明非平面循环结构混合是低能近BPS区域量子混沌涌现的微观起源，为AdS/CFT全息混沌提供了具体实例，并对理解弦理论非平面效应具有普遍启示意义。", "summary_source": "deepseek", "authors": [{"name": "Haoyu Zhang"}], "featured_authors": [{"name": "Haoyu Zhang"}], "author_count": 1}, {"id": "2605.16558", "category": "math-ph", "title": "Notes on obstructions in the hyperbolic Clifford algebra bundle structure", "abstract": "Starting from a general analysis of obstruction classes, we develop the investigation of obstructions associated with the bundle structure of the hyperbolic Clifford algebra. By taking into account particularities arising from the Whitney sum, it is shown that, unlike classical tangent bundle cases, the hyperbolic frame bundle admits lifting without any topological obstruction. This leads to the possibility of always defining spinor structures in hyperbolic Clifford bundles.", "url": "https://arxiv.org/abs/2605.16558", "type": "理论", "summary": "1. 本文系统分析了双曲Clifford代数丛结构中的障碍类，并考察了与经典切丛情形的关键差异。\n2. 其核心物理卖点在于揭示：由于Whitney和的特殊性质，双曲标架丛的丛提升不存在拓扑障碍，从而允许在此类丛上始终定义旋量结构。\n3. 这为双曲流形上的旋量几何及相关量子场论模型提供了无障碍的构造基础，并启发了对更一般丛结构拓扑障碍的再审视。", "summary_source": "deepseek", "authors": [{"name": "J. M. Hoff da Silva"}, {"name": "E. Notte-Cuello"}], "featured_authors": [{"name": "J. M. Hoff da Silva"}, {"name": "E. Notte-Cuello"}], "author_count": 2}, {"id": "2605.16624", "category": "math-ph", "title": "Long-time stability for nonlinear Maryland models", "abstract": "For the $d-$dimensional nonlinear Maryland model \\begin{equation}\\label{eq-abs} \\ri\\partial_t q_n=\\tan\\pi(n\\cdot\\varpi+x)q_n+\\epsilon(\\Delta q)_n+|q_n|^2q_n,\\quad n\\in{\\Z^d}, \\end{equation} with $d\\in\\N^*$, $\\epsilon\\in \\R$ and $\\varpi\\in\\R^d$ satisfying a suitable Diophantine condition, we establish polynomial long-time stability of polynomially weighted $\\ell^2$-norm $$\\|q(t)\\|_s:=\\left(\\sum_{n\\in{\\Z^d}}|q_n|^2 (1+|n|^2)^{s}\\right)^{\\frac{1}{2}},\\quad s>0. $$ More precisely, given any $M_*\\in\\N^*$, for phase parameters $x$ belonging to an almost full-measure subset of $\\R/\\Z$, if $|\\epsilon|$ is sufficiently small, then solutions $q(t)$ of Eq. (\\ref{eq-abs}) with high-order weighted $\\ell^2$-norm $\\|q(0)\\|_s$ of sufficiently small size $\\varepsilon$ satisfy $$\\|q(t)\\|_s=\\CO(\\varepsilon),\\quad \\forall \\ |t|\\leq \\epsilon^{-1}\\varepsilon^{-M_*}. $$ The proof relies on a Birkhoff normal form procedure.", "url": "https://arxiv.org/abs/2605.16624", "type": "理论", "summary": "1. 该工作针对d维非线性马里兰模型，在频率满足丢番图条件下，建立了加权ℓ²-范数的多项式长时间稳定性定理。\n2. 其核心卖点在于通过Birkhoff规范型分析，证明了对几乎满测度的相位参数，当耦合强度足够小且初始高阶加权范数为ε时，解的范数在时间区间|t|≤ε^{-1}ε^{-M_*}内保持O(ε)有界，其中M_*为任意给定正整数。\n3. 这一结果将准周期线性系统的局域化理论扩展至弱非线性情形，为研究非线性离散薛定谔型系统中的能量输运与长时间行为提供了严格的数学框架。", "summary_source": "deepseek", "authors": [{"name": "Ruijie Cui"}, {"name": "Zhiyan Zhao"}], "featured_authors": [{"name": "Ruijie Cui"}, {"name": "Zhiyan Zhao"}], "author_count": 2}, {"id": "2605.16983", "category": "math-ph", "title": "Nonlocal thermal Willis coupling in laminated conductors", "abstract": "Building on Willis' homogenization framework, recent work has revealed that heterogeneous conductors exhibit macroscopic thermal bianisotropy, in which the macroscopic heat flux and entropy are nonlocally coupled to both temperature and temperature gradient. Existing numerical examples, however, are limited to the subwavelength regime. Here, we provide the first explicit demonstration of this spatial nonlocality by computing the effective kernels of a periodic laminate using three independent homogenization methods. The three approaches yield consistent nonlocal cross-coupling terms, clarifying the roles of spatial asymmetry and averaging choice. We also calculate the corresponding thermal impedance and show that it is direction-dependent, highlighting a physical signature of thermal bianisotropy relevant to thermal metamaterials.", "url": "https://arxiv.org/abs/2605.16983", "type": "理论", "summary": "1. 该工作通过三种独立均匀化方法计算周期层状导体的有效核，首次明确展示了异质导体中宏观热流与熵对温度及其梯度的非局域耦合。\n2. 三种方法一致揭示非局域交叉耦合项，阐明了空间不对称性与平均选取对热双各向异性响应的调控作用。\n3. 所发现的热阻抗方向依赖性为热超材料中实现非对称热输运提供了可观测的物理信号与设计依据。", "summary_source": "deepseek", "authors": [{"name": "Chunlin Wu"}, {"name": "Gal Shmuel"}, {"name": "Huiming Yin"}], "featured_authors": [{"name": "Chunlin Wu"}, {"name": "Gal Shmuel"}, {"name": "Huiming Yin"}], "author_count": 3}, {"id": "2605.17502", "category": "math-ph", "title": "Resolving the viscosity operator ambiguity on Riemannian manifolds via a kinematic selection principle", "abstract": "On a general Riemannian manifold the Navier-Stokes equations admit several inequivalent formulations, differing in the choice of viscous operator: the Hodge Laplacian, the Bochner Laplacian, or the deformation Laplacian. We show that a Lagrangian kinematic construction, in which the strain rate is built from the rate of change of inner products of Lie-dragged connecting vectors, uniquely selects the deformation Laplacian for fluids whose configuration space is intrinsically the manifold. The Hodge Laplacian is excluded at the kinematic step (before introducing constitutive assumptions) because the strain rate constructed from inner-product geometry is symmetric and has no antisymmetric part. We further show that when the fluid arises as a thin-shell limit of an ambient three-dimensional flow, the operator that emerges depends on the boundary condition imposed in the normal direction: stress-free (Navier slip) conditions recover the deformation Laplacian, while Hodge boundary conditions recover the Hodge Laplacian, via an explicit decomposition of the ambient Bochner Laplacian into intrinsic and extrinsic pieces. The intrinsic piece is the deformation Laplacian regardless of the boundary condition. As an analytical confirmation, we show that the kinematic selection is consistent with the known failure of the energy inequality for the Hodge Laplacian on the hyperbolic plane $\\HH^2$: the deformation Laplacian is coercive on $\\HH^2$ while the Hodge Laplacian is not, because the Ricci term has the opposite sign in the two operators. We further prove that on any complete two-dimensional manifold with Gaussian curvature bounded above by a negative constant, the incompressible Navier-Stokes equation with the deformation Laplacian admits a unique global weak solution with exponential energy decay, resolving the analytical obstruction preventing the corresponding result for the Hodge Laplacian.", "url": "https://arxiv.org/abs/2605.17502", "type": "理论", "summary": "1. 该工作通过构建基于连接向量内积变化率的运动学选择原理，解决了黎曼流形上Navier-Stokes方程粘性算子的歧义性，唯一确定了变形拉普拉斯算子。\n2. 其关键之处在于应变率从内积几何对称性出发，在运动学步骤即排除霍奇拉普拉斯；并证明薄壳极限下边界条件影响算子形式，但流形内在部分始终为变形拉普拉斯。\n3. 该原理与双曲平面上变形拉普拉斯的强制性一致，确保了不可压缩Navier-Stokes方程全局弱解的存在性与指数能量衰减，为弯曲几何中的流体动力学分析提供了自洽框架。", "summary_source": "deepseek", "authors": [{"name": "Zhi-Wei Wang"}, {"name": "Samuel L. Braunstein"}], "featured_authors": [{"name": "Zhi-Wei Wang"}, {"name": "Samuel L. Braunstein"}], "author_count": 2}, {"id": "2605.18093", "category": "math-ph", "title": "Where solitons are in a KdV soliton gas", "abstract": "The Korteweg-De Vries (KdV) equation is a paradigmatic model of integrable classical fields, admitting solitoning solutions. When many solitons are near to each other, their shapes are modified, and it is not manifest, from the KdV field, where they are. This is a key problem in the analysis of a soliton gas, as its main object, the density of states, is a number of solitons per unit length. How to define solitons' positions at finite densities in the macroscopic limit? A sensible criterium is that, projecting out solitons lying outside a mesoscopic region, the KdV field is unchanged in this region, and the result is a multi-soliton field supported there. In the context of emergent hydrodynamics, this is referred to as a fluid-cell projection. In this paper we solve this problem. We define solitons' positions and a fluid-cell projection, and show that it has these properties, without introducing radiative corrections. We show that the weak limit of conserved densities can be evaluated using the density of states. On large scales the solitons' positions satisfy the semi-classical Bethe equations introduced in the context Generalised Hydrodynamics, that accounts for the two-body scattering shift and encodes factorised scattering. A non-rigorous derivation reproduces the kinetic equation of the KdV soliton gas, first proposed by Gennady El in 2003 using Witham modulation theory from finite-gap solutions. The results hold under simple conditions on spectral parameters, and certain physically natural conditions on impact parameters. No randomness is required. Our proof is based on a novel tau function for the multi-soliton KdV field, which also allows us to obtain new bounds on the growth of the multi-soliton support and on the supremum of the field and its derivatives. We believe the methods are generalisable to other solitonic models.", "url": "https://arxiv.org/abs/2605.18093", "type": "理论", "summary": "1. 该工作严格定义了KdV孤子气体中孤子的位置与流体元投影，并证明其在不引入辐射修正下保持多孤子场形貌。\n2. 基于多孤子KdV场的新tau函数，推导出弱极限下守恒密度可用态密度评估，且孤子位置满足半经典Bethe方程。\n3. 这为可积系统广义流体力学与大尺度孤子气体动力学方程提供了严格数学基础，方法有望推广至其他孤子模型。", "summary_source": "deepseek", "authors": [{"name": "Benjamin Doyon"}], "featured_authors": [{"name": "Benjamin Doyon"}], "author_count": 1}, {"id": "2605.18651", "category": "math-ph", "title": "Arbitrary-genus dark soliton gases in the defocusing nonlinear Schrödinger hydrodynamics", "abstract": "The defocusing nonlinear Schrödinger hydrodynamics supports exact dark solitons under finite density boundary conditions. However, the dark soliton gas, an interacting ensemble of dark solitons, has not yet been studied. In this work, we introduce an arbitrary-genus potential of dark soliton gases by considering the limit of the $\\mathcal{N}$-dark soliton as $\\mathcal{N}\\to \\infty$. The large-space asymptotics and long-time evolution of this dark soliton gas potential are analytically investigated through Deift-Zhou nonlinear steepest descent approach. The genus-$N$ dark soliton gas potential approaches the genus-$N$ finite-gap solution as $x \\to -\\infty$ and the background $1$ as $x \\to +\\infty$. In the long-time evolution, as the self-similar variable $\\xi=x/t$ increases, the gas configuration exhibits a cascade of behaviours, passing from unmodulated and modulated genus-$N$ regions and progressively reducing the genus down to the planar region (unmodulated genus-$0$ region). Notably, the evolution of lower-genus soliton gases can be embedded within that of higher-genus gases, exhibiting identical dynamics within specific regimes. This phenomenon is encoded by the underlying spectra. We also include numerical validations, in perfect agreement with the theoretical predictions.", "url": "https://arxiv.org/abs/2605.18651", "type": "理论", "summary": "1. 该工作通过N-暗孤子无穷极限构造了任意亏格暗孤子气体势，并解析研究了其大空间渐近与长时间动力学。\n2. 技术核心是利用Deift-Zhou非线性最速下降法，揭示气体势从负无穷处的亏格N有限间隙解过渡到正无穷处的背景1，且长时间演化中随自相似变量ξ=x/t增大呈现亏格逐级降低的级联行为。\n3. 低亏格孤子气体的演化可嵌入高亏格气体中并共享动力学，此现象由谱结构控制，为可积流体多孤子统计提供了精确解析框架。", "summary_source": "deepseek", "authors": [{"name": "Marco Bertola"}, {"name": "Deng-Shan Wang"}, {"name": "Peng Yan"}, {"name": "Dinghao Zhu"}], "featured_authors": [{"name": "Marco Bertola"}, {"name": "Deng-Shan Wang"}, {"name": "Peng Yan"}, {"name": "Dinghao Zhu"}], "author_count": 4}, {"id": "2605.18717", "category": "math-ph", "title": "Traveling Waves and Bumps in $p$-adic NNs]{Pseudo-Traveling Waves and Bumps in Quantum and Classical Hierarchical Cellular Neural Networks", "abstract": "We study the existence of pseudo-traveling waves and bump solutions for two classes of hierarchical cellular neural networks (CNNs) defined over the ring of $p$-adic integers $\\mathbb{Z}_{p}$. The first type is a $p$-adic CNN described by a reaction-diffusion equation, while the second type is its quantum analog obtained via Wick rotation. The $p$-adic CNNs are hierarchical versions of the classical Chua-Yang CNNs; these networks have a tree-like hierarchical architecture with infinitely many cells and hidden layers. The states are governed by integro-differential equations on $% \\mathbb{Z}_{p}$. The $p$-adic traveling waves behave fundamentally differently from their Archimedean counterparts. A traveling wave restricted to a $p$-adic sphere yields a countably infinite collection of independent patterns. We introduce the notion of pseudo-traveling waves as finite truncations of this structure and prove their existence for both the classical and quantum networks. We further establish the existence of time-independent solutions (bumps) for both models. Our theoretical results are complemented by numerical simulations that approximate pseudo-traveling-wave solutions for quantum CNNs.", "url": "https://arxiv.org/abs/2605.18717", "type": "理论", "summary": "1. 该工作研究了定义在p-adic整数环上的两类层次化细胞神经网络中伪行波与凸起解的存在性，涵盖经典反应扩散方程及其Wick旋转量子类比。\n2. 其核心发现为p-adic行波局限于球面时产生可数无穷独立模式，通过引入伪行波作为该结构的有限截断并严格证明其存在，揭示了p-adic非阿基米德动力学与阿基米德情形的本质差异。\n3. 这为层次化网络中的信息处理与量子模拟提供了新理解，基于p-adic层次结构的伪行波概念可推广至树状拓扑系统的非线性波动力学研究。", "summary_source": "deepseek", "authors": [{"name": "W. A. Zúñiga-Galindo; B. A. Zambrano-Luna"}, {"name": "Chayapuntika Indoung"}], "featured_authors": [{"name": "W. A. Zúñiga-Galindo; B. A. Zambrano-Luna"}, {"name": "Chayapuntika Indoung"}], "author_count": 2}, {"id": "2605.16467", "category": "quant-ph", "title": "Beyond Bell Teleportation: Machine-Learned Adaptive Protocols", "abstract": "Quantum teleportation have a central role in quantum information science and allows transferring of an unknown quantum state through entanglement and classical communication. Unfortunately, the interaction with external and internal noise severely affects the quality of teleportation and poses limitations on practical applications of quantum communication networks. In this work, instead of conventional Bell teleportation, we introduce a Machine Learned adaptive protocol for optimizing multiple components of Quantum Teleportation in order to achieve higher fidelity in various noise environments. In order to demonstrate the performance of the proposed scheme, we study three different noise models, including bit-flip, amplitude damping, and depolarizing noise, both in case of single-qubit and two-qubit channels. As a result, we observe substantial improvement in the teleportation fidelity in comparison to the classical Bell-state teleportation protocol in certain noise conditions. Furthermore, the machine-learned protocol reveals a nontrivial strategy for compensation of decoherence and information losses. In addition, obtained results indicate the flexibility and reliability of the proposed framework for implementing various adaptive quantum communications while shedding light on possibilities of discovery of optimal quantum algorithms by means of automated approache", "url": "https://arxiv.org/abs/2605.16467", "type": "理论+数值", "summary": "1. 该工作引入机器学习自适应协议，在多种噪声环境下（比特翻转、振幅阻尼与去极化）优化量子隐形传态的多组件操作。\n2. 其核心优势在于相较于标准贝尔态传态，显著提升保真度，并揭示了一种补偿退相干与信息丢失的非平凡策略。\n3. 这为构建灵活可靠的自适应量子通信框架及通过自动化方法发现最优量子算法提供了重要启示。", "summary_source": "deepseek", "authors": [{"name": "Krishnajith C Vinod"}, {"name": "N C Randeep"}], "featured_authors": [{"name": "Krishnajith C Vinod"}, {"name": "N C Randeep"}], "author_count": 2}, {"id": "2605.16500", "category": "quant-ph", "title": "Robust generalized quantum Stein's lemma", "abstract": "The generalized quantum Stein's lemma provides an explicit expression for the optimal error exponent when distinguishing many independent and identically distributed (iid) copies of a given bipartite state from the set of separable bipartite states. Here we prove that this result is robust, in the sense that the iid assumption can be relaxed to almost-iid. In particular, our result shows that the original argument of Brandão and Plenio, which contains a logical gap, can be made rigorous. Our proof relies on a novel continuity bound for the relative entropy of entanglement with respect to the quantum Wasserstein distance. Combined with a recent insight that almost-iid states and their exact iid counterparts are asymptotically close in this distance, the bound implies that their relative entropies of entanglement coincide asymptotically.", "url": "https://arxiv.org/abs/2605.16500", "type": "理论", "summary": "1. 该工作证明广义量子Stein引理对几乎独立同分布态仍成立，放宽了原有独立同分布假设。\n2. 其技术核心是建立相对熵纠缠关于量子Wasserstein距离的连续性界限，使Brandão和Plenio的论证严格化。\n3. 这为纠缠判据的鲁棒性提供了理论基础，并启发了非渐近场景下量子态区分问题的新分析。", "summary_source": "deepseek", "authors": [{"name": "Giulia Mazzola"}, {"name": "David Sutter"}, {"name": "Renato Renner"}], "featured_authors": [{"name": "Giulia Mazzola"}, {"name": "David Sutter"}, {"name": "Renato Renner"}], "author_count": 3}, {"id": "2605.16509", "category": "quant-ph", "title": "Quokka#: Quantum Computing with #SAT", "abstract": "We present Quokka#, a versatile, open-source Python library for quantum circuit analysis. Quokka# reduces various simulation, verification, and synthesis tasks to weighted model counting (#SAT). It supports universal quantum circuits and a wide variety of gates. Quokka# provides multiple encodings based on different algebraic bases and equivalence-checking methods, enabling key performance trade-offs. Moreover, the new version of Quokka# adds approximate equivalence checking, which is crucial in its synthesis algorithms, since it enables translation between arbitrary gate sets. Its synthesis engine is depth-optimal, making it well-suited to real-world quantum computing. This paper demonstrates the design, extensibility, and use of Quokka#.", "url": "https://arxiv.org/abs/2605.16509", "type": "理论+数值", "summary": "1. 该工作开发了开源Python库Quokka#，将量子电路模拟、验证与综合任务归约为加权模型计数（#SAT）。\n2. 其核心技术在于提供基于不同代数基的多种编码与等价性检查方法，并引入近似等价性检查以实现任意门集间的深度最优综合。\n3. 这为量子电路分析与综合提供了可扩展的求解框架，有望推动实际量子计算中门集无关的自动化设计。", "summary_source": "deepseek", "authors": [{"name": "Jingyi Mei"}, {"name": "Dekel Zak"}, {"name": "Muhammad Osama"}, {"name": "Tim Coopmans"}, {"name": "Alfons Laarman"}], "featured_authors": [{"name": "Jingyi Mei"}, {"name": "Dekel Zak"}, {"name": "Muhammad Osama"}, {"name": "Tim Coopmans"}, {"name": "Alfons Laarman"}], "author_count": 5}, {"id": "2605.16518", "category": "quant-ph", "title": "Exact classical emergence from high-energy quantum superpositions", "abstract": "We examine the correspondence principle for an equiprobable superposition of high-energy eigenstates of the infinite square well using a fully analytical Fourier-based approach. We derive a closed-form asymptotic expression for the interference terms $\\rho_{\\alpha}^{\\text{a}}(x)$ by expanding them into a geometric series of quantum Fourier coefficients. We show these terms act as functional envelopes that do not vanish individually but become asymptotically equivalent in the large-$n$ limit. Furthermore, we prove the total probability density for a superposition of $2\\Delta+1$ states converges exactly to the uniform classical distribution as $\\Delta \\to \\infty$. Dynamically, the expectation value of position reproduces the classical triangular trajectory asymptotically. Residual quantum deviations remain confined to boundary layers whose relative width vanishes under macroscopic resolution. These results establish a rigorous asymptotic realization of the classical limit for isolated bound systems in both static and dynamical contexts.", "url": "https://arxiv.org/abs/2605.16518", "type": "理论", "summary": "1. 该工作通过全解析傅里叶方法，严格证明了无限深方势阱高能本征态等概率叠加的概率密度在大量子数极限下精确收敛至经典均匀分布。\n2. 其技术核心在于将干涉项展开为量子傅里叶系数的几何级数，并揭示其作为功能包络在渐进极限下的渐近等价性。\n3. 这一结果建立了孤立束缚系统经典极限的严格渐近实现，为宏观经典涌现的量子根源提供了精确数学框架。", "summary_source": "deepseek", "authors": [{"name": "Juan A. Cañas"}, {"name": "Daniel A. Bonilla"}, {"name": "J. Bernal"}, {"name": "A. Martín-Ruiz"}], "featured_authors": [{"name": "Juan A. Cañas"}, {"name": "Daniel A. Bonilla"}, {"name": "J. Bernal"}, {"name": "A. Martín-Ruiz"}], "author_count": 4}, {"id": "2605.16523", "category": "quant-ph", "title": "End-to-End Formalization of Quantum Error Correction", "abstract": "Quantum error-correcting codes (QECCs) sit between noisy quantum hardware and reliable computation, so the code parameters used in practice must be trustworthy. The single number that summarizes a code's strength is its distance, yet certifying a distance lower bound is NP-hard in general, placing it beyond the reach of pen-and-paper proofs as well as direct proof-assistant scripting. As a result, distance values in the literature come either from non-scaling hand proofs, or from unverified solvers that leave a trust gap exactly where the code is supposed to provide a guarantee. We present Lean-QEC, the first Lean 4 formalization of stabilizer-code theory that delivers end-to-end, machine-checked distance certificates at industrial code sizes. Lean-QEC formalizes the linear algebra of qubit states, the Pauli group, stabilizer codes, the binary symplectic representation, classical coding theory, and the CSS and Bivariate Bicycle families. To break the combinatorial barrier, Lean-QEC translates the distance condition into a Boolean satisfiability formula through a verified reduction. The pipeline scales through a BitVec-flattened encoding that replaces Lean's Matrix representation, and an error-location encoding that reduces the variable count from $n$ to $k\\lceil \\log_2 n\\rceil$. With these, we obtain automatically-generated Lean-checked distance proofs for a large range of industrially viable qLDPC codes within the Bivariate Bicycle and Generalized Bicycle families, including [[90, 8, 10]] and [[70, 6, 9]] BB codes, with the formulation scaling up to 144 qubits when performed outside the Lean kernel. The resulting library is reusable and is designed to plug into broader Lean-based efforts toward end-to-end verification of fault-tolerant quantum computation.", "url": "https://arxiv.org/abs/2605.16523", "type": "理论+数值", "summary": "1. 该工作提出了Lean-QEC，首次在Lean 4中形式化稳定子码理论，为工业规模量子纠错码提供端到端、机器检查的距离证书。\n2. 其技术核心是通过可验证约简将距离条件转化为布尔可满足性公式，并采用BitVec扁平化编码和误差位置编码将变量数从n降至k⌈log₂ n⌉，从而自动生成包括[[90,8,10]]等码在内的双变量篮子码族距离证明，规模可达144量子比特。\n3. 这为基于证明助手的容错量子计算全程验证提供了可重用形式化库，有望弥合纠错码参数信任缺口并促进规模化验证。", "summary_source": "deepseek", "authors": [{"name": "Mattias Ehatamm"}, {"name": "Yi Lee"}, {"name": "Xiaodi Wu"}, {"name": "Runzhou Tao"}], "featured_authors": [{"name": "Mattias Ehatamm"}, {"name": "Yi Lee"}, {"name": "Xiaodi Wu"}, {"name": "Runzhou Tao"}], "author_count": 4}, {"id": "2605.16543", "category": "quant-ph", "title": "Demonstration of transport in an ion trap design for two-dimensional lattices", "abstract": "Microfabricated ion trap chips are at the core of some of the most advanced quantum computers. How a large number of ions is arranged and controlled on an ion trap chip depends on the chosen trap architecture. One such architecture is the quantum spring array (QSA). In the QSA architecture, ion chains are arranged in a two-dimensional lattice and interact with ion chains in neighboring sites in the radial and axial directions of the respective chain. This interaction, or coupling, is mediated by the Coulomb force while keeping ions in separate trapping sites, and scales inversely with the third power of the separation. The capability to control the distance between ions in the lattice is thus essential. In previous works, the radial separation between ions was tuned by controlling the rf pseudo-potential, which revealed to be experimentally challenging to realize while maintaining low heating rates. In this work, we present an ion trap chip design that allows tuning of the radial distance between ions using only dc voltages. The radial transport is executed between different interaction zones, designated for quantum operations, through specifically designed transition zones. A prototype of this type of ion trap chip was microfabricated on fused silica substrate. Its functionality is characterized by demonstrating dc-controlled radial transport of a single ion through a transition zone and measuring stray fields and ion heating rates in the center of the trap. Moreover, the fabrication of a multi-metal layer version of such a trap is presented as a scaling path for the presented chip design.", "url": "https://arxiv.org/abs/2605.16543", "type": "实验", "summary": "1. 该工作实验演示了一种采用直流电压调控离子径向间距的二维晶格离子阱芯片设计，并验证了单离子通过过渡区的径向输运。\n2. 其核心卖点在于仅用直流电压实现径向位置控制，避免了射频势调谐带来的加热问题，且原型在熔融石英基底上微加工并表征了杂散场与加热率。\n3. 这为构建大规模二维离子晶格量子计算架构提供了可行的缩放路径，特别是多层金属版本的设计有望提升集成度。", "summary_source": "deepseek", "authors": [{"name": "Michael Pfeifer"}, {"name": "Marco Valentini"}, {"name": "Matthias Dietl"}, {"name": "Fabian Anmasser"}, {"name": "Simon Schey"}, {"name": "Jakob Wahl"}, {"name": "Philip C. Holz"}, {"name": "Clemens Rössler"}, {"name": "Yves Colombe"}, {"name": "Philipp Schindler"}], "featured_authors": [{"name": "Michael Pfeifer"}, {"name": "Marco Valentini"}, {"name": "Matthias Dietl"}, {"name": "Clemens Rössler"}, {"name": "Yves Colombe"}, {"name": "Philipp Schindler"}], "author_count": 10}, {"id": "2605.16559", "category": "quant-ph", "title": "Measurement and Control of the Complex Berry Phase in a Quantum System", "abstract": "The Berry phase is a geometric phase acquired during adiabatic evolution over a closed loop in parameter space. It plays an essential role in geometric quantum gates and other phase-based protocols. In non-Hermitian systems, the Berry phase is complex, introducing fundamentally new geometric effects, including state amplification. In this work, we report experimental measurement of both the real and imaginary components of a Berry phase in a fully quantum system using a superconducting transmon circuit with engineered dissipation. We also demonstrate the path-dependent effects of the imaginary part on the dissipation and its utility in the implementation of non-unitary quantum control. These findings establish a clear geometric distinction between the real and imaginary components of the Berry phase and experimentally confirm the unique adiabatic behavior of non-Hermitian quantum systems.", "url": "https://arxiv.org/abs/2605.16559", "type": "实验", "summary": "1. 该工作利用超导transmon电路引入工程耗散，实验测量了非厄米系统中复Berry相位的实部与虚部，并验证其路径依赖特性。\n2. 核心卖点在于揭示了复Berry相位虚部对耗散的非幺正控制作用，将几何相位从幺正拓展至非厄米领域。\n3. 这为基于非厄米几何效应的量子控制与新型量子门设计提供了实验基础和物理洞察。", "summary_source": "deepseek", "authors": [{"name": "Pratik J. Barge"}, {"name": "Qian Cao"}, {"name": "Niklas Hörnedal"}, {"name": "Aurélia Chenu"}, {"name": "Kater W. Murch"}], "featured_authors": [{"name": "Pratik J. Barge"}, {"name": "Qian Cao"}, {"name": "Niklas Hörnedal"}, {"name": "Aurélia Chenu"}, {"name": "Kater W. Murch"}], "author_count": 5}, {"id": "2605.16596", "category": "quant-ph", "title": "Optimization of circular cavities via guided-mode expansion method based inverse design", "abstract": "Spin-photon interfaces, realized by coupling optically active spin systems to photonic cavities, are essential for quantum networking and quantum information processing. Implementing such an interface for polarization-encoded photons requires a cavity that supports arbitrary polarization, provides efficient optical access through its far-field mode, and maintains sufficiently high quality factors to enable high cooperativity with the system's optical transitions. However, inherent trade-offs between the Q-factor and far-field emission mode make the simultaneous optimization of these parameters toward the realization of spin-photon interfaces challenging. In this work, we implement a gradient-based inverse-design framework using guided-mode expansion with automatic differentiation to obtain the geometrical features of a circular ring cavity that supports arbitrary polarization while simultaneously optimizing the cavity quality factor and far-field mode profile. The resulting optimized non-periodic cavity achieves a quality factor of approximately $9,000$, about an order-of-magnitude higher than that of a periodic (\"bullseye\") cavity while preserving a Gaussian-like far-field emission pattern. Furthermore, by varying the cavity geometry within a $\\pm 6$ nm fabrication tolerance, we demonstrate the robustness of the design against fabrication errors and identify the innermost ring width and central disk radius as the parameters with the greatest impact on the quality factor and far-field mode. These results establish guided mode expansion-based inverse design as a powerful and computationally efficient approach for developing high-cooperativity spin-photon interfaces for quantum photonic applications.", "url": "https://arxiv.org/abs/2605.16596", "type": "理论+数值", "summary": "1. 该工作基于自动微分导模展开法，实现了非周期环形光学微腔的梯度逆设计，以同时优化品质因子与远场发射模式，支持任意偏振的自旋-光子界面。\n2. 其核心在于突破传统周期腔中Q因子与远场模式的固有折中：优化腔达Q≈9000（较牛眼腔高约一个量级），并保持类高斯远场分布，还通过±6 nm容差分析识别出最内环宽度与中心盘半径为关键几何参数。\n3. 这为高协同自旋-光子界面提供了一种计算高效且可扩展的反向设计途径，尤其适用于需要高品质因子与任意偏振的固态量子比特光子接口。", "summary_source": "deepseek", "authors": [{"name": "Abhishek Das"}, {"name": "Neelesh Kumar Vij"}, {"name": "Demitry Farfurnik"}], "featured_authors": [{"name": "Abhishek Das"}, {"name": "Neelesh Kumar Vij"}, {"name": "Demitry Farfurnik"}], "author_count": 3}, {"id": "2605.16678", "category": "quant-ph", "title": "Spatially Adaptive Detection for Satellite-based QKD under Atmospheric Turbulence Channel", "abstract": "Quantum key distribution (QKD) provides information-theoretic security and satellite-based quantum key distribution (SatQKD) has demonstrated the potential to extend this communication security to intercontinental scales. However, atmospheric turbulence induces significant distortion in the spatial distribution of received optical beams, while background noise remains approximately uniform across the detector plane. As a result, single-element qubit (quantum bit) detection can be frequently dominated by noise due to the random spatial pattern of the imaged wavefront, thereby degrading the system performance. To address this limitation, we propose to exploit the spatial degrees of freedom of single-photon detector arrays to reject the excessive noise while adapting to channel variations induced by turbulence. We develop a threshold-based selection method that only activates detector elements that have higher probability of registering qubits. We evaluate the performance of the proposed noise-rejection QKD schemes using Monte Carlo simulations considering the impact of diffraction and atmospheric turbulence on the transmitted optical beam in the presence of background and dark noise. The results show that, compared to conventional schemes, the proposed noise-rejection strategy effectively reduces the quantum bit error rate (QBER) and improves the secret key rate (SKR) performance, while the performance gains depend on the turbulence condition. These findings demonstrate the potential of adaptive array receiver design to enhance the robustness of the SatQKD system under realistic atmospheric conditions.", "url": "https://arxiv.org/abs/2605.16678", "type": "数值", "summary": "1. 该工作针对大气湍流导致的星载量子密钥分发性能退化，提出一种基于单光子探测器阵列空间自适应检测的噪声抑制方案。\n2. 其核心在于通过阈值选择方法，仅激活具有更高量子比特接收概率的探测器单元，以动态适配湍流引起的波前畸变和空间分布随机性。\n3. 这为利用探测器阵列空间自由度提升星载QKD系统在实际大气条件下的鲁棒性及密钥生成率提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Yaoxuan Yang"}, {"name": "Ivi Afxenti"}, {"name": "Majid Safari"}], "featured_authors": [{"name": "Yaoxuan Yang"}, {"name": "Ivi Afxenti"}, {"name": "Majid Safari"}], "author_count": 3}, {"id": "2605.16749", "category": "quant-ph", "title": "Boundary-Aware QFT Block-Encoding of Fractional Laplacians", "abstract": "We study the quantum Fourier transform (QFT) block-encoding of the semi-discrete fractional Laplacian on bounded domains with open, zero-extension boundary conditions. In the notation of the main construction, the target operator is the finite Toeplitz truncation \\(A^{(N)}_{\\alpha,h}\\) obtained from the full-lattice semi-discrete operator with symbol \\(|\\xi|^\\alpha\\). A finite QFT register, however, diagonalizes circulant matrices rather than Toeplitz truncations. The native QFT circuit therefore implements a periodic surrogate \\(\\widetilde A^{(N)}_{\\alpha,h}\\), not the open-boundary operator. We identify this mismatch through an exact Toeplitz-to-circulant aliasing identity. To recover the open-boundary action, we zero-pad the state into a larger \\(M\\)-point QFT register, apply the same Fourier-symbol block-encoding, and compress back to the physical subspace. The resulting compressed block satisfies \\(P_{N\\to M}^{\\dagger}\\widetilde A^{(M)}_{\\alpha,h}P_{N\\to M} = A^{(N)}_{\\alpha,h}+E^{(M)}\\), where \\(E^{(M)}\\) is controlled by the tail of the semi-discrete convolution kernel. Thus, the QFT layer implements the fractional symbol, while zero-padding supplies the open-boundary geometry. The construction is an operator-compilation primitive for boundary-aware quantum simulation rather than a complete PDE solver.", "url": "https://arxiv.org/abs/2605.16749", "type": "理论+数值", "summary": "1. 该工作通过零填充QFT块编码，实现了有界域上具有开放零延拓边界条件的半离散分数阶拉普拉斯算子的量子编译。\n2. 其技术核心在于利用严格的Toeplitz-循环混叠恒等式，识别有限QFT寄存器对开放边界算子的周期性替代偏差，并通过大寄存器零填充压缩恢复精确作用。\n3. 这为量子模拟中非周期边界条件的嵌入提供了算子编译原语，可推广至其他非局部算子的边界感知量子算法设计。", "summary_source": "deepseek", "authors": [{"name": "Younes Javanmard"}, {"name": "Sina Kazemian"}], "featured_authors": [{"name": "Younes Javanmard"}, {"name": "Sina Kazemian"}], "author_count": 2}, {"id": "2605.16782", "category": "quant-ph", "title": "Central Limit Theorem for Bosonic Quantum Channels", "abstract": "In this paper, we develop an extension of the Central Limit Theorem (CLT) to the setting of bosonic quantum channels. This extension provides a deeper understanding of Gaussian bosonic channels as extremal objects. Using our CLT for bosonic quantum channels, we recover both the classical CLT and the CLT for bosonic quantum states, thereby offering a unified perspective that connects classical probability theory with continuous-variable quantum systems. Moreover, using our result, we can provide necessary uncertainty relations that every physical (possibly non-Gaussian) bosonic quantum channel must satisfy. As another application of our limit theorems, we derive tight lower bounds on the energy-constrained quantum capacity of linear bosonic channels by relating it to the capacity of their associated Gaussian bosonic channels, further reinforcing the role of Gaussian channels as extremal.", "url": "https://arxiv.org/abs/2605.16782", "type": "理论", "summary": "1. 该工作将中心极限定理推广至玻色量子通道，建立了统一经典概率与连续变量量子系统的理论框架。\n2. 核心在于揭示高斯玻色通道作为极值对象的物理与信息论地位，并导出所有物理玻色通道必需的不确定关系。\n3. 这为非高斯通道容量下界提供紧束缚，并为量子信息理论中高斯极值性假设奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Hami Mehrabi"}, {"name": "Ludovico Lami"}, {"name": "Mark M. Wilde"}], "featured_authors": [{"name": "Hami Mehrabi"}, {"name": "Ludovico Lami"}, {"name": "Mark M. Wilde"}], "author_count": 3}, {"id": "2605.16935", "category": "quant-ph", "title": "Exact Entanglement-Depth Speed Frontier for Complete Quantum Charging", "abstract": "Complete quantum charging provides a sharp setting in which to ask how much multipartite entanglement is forced by speed itself. For a closed \\(N\\)-qubit battery evolving from \\(\\ket{\\downarrow}^{\\otimes N}\\) to \\(\\ket{\\uparrow}^{\\otimes N}\\) under a time-independent Hamiltonian, we exactly solve the pure-state depth-constrained speed problem. If the realized trajectory has entanglement depth at most \\(k\\), then the largest possible QSL-normalized rate \\(\\eta=\\tau_{\\rm QSL}/T\\) is \\(\\eta_{\\max}(k)=\\lceil N/k\\rceil^{-1/2}\\). Conversely, an observed rate \\(\\eta\\) certifies trajectory entanglement depth at least \\(\\bigl\\lceil N/\\lfloor \\eta^{-2}\\rfloor\\bigr\\rceil\\). The mechanism is block orthogonalization: under a fixed product partition, complete charging forces all blocks to orthogonalize simultaneously, and the quantum speed limit converts this counting constraint into the speed bound. Balanced cluster-flip evolutions saturate the bound, establishing an exact integer staircase frontier. Thus fast complete charging cannot be explained by many small independently charging blocks; in particular, crossing the threshold \\(\\eta>1/\\sqrt2\\) certifies, for \\(N>1\\), the generation of genuine \\(N\\)-partite entanglement.", "url": "https://arxiv.org/abs/2605.16935", "type": "理论", "summary": "1. 该工作精确求解了N量子比特电池从全自旋向下到全自旋向上完全充电过程中，纠缠深度与量子速度极限归一化速率之间的严格函数关系，建立了整数阶梯形式的速率上限。\n2. 其核心机制是块正交化：在固定乘积划分下，完全充电迫使所有子块同时正交化，量子速度极限将块计数约束转化为速率上限η_max(k)=⌈N/k⌉^{-1/2}，且平衡簇翻转演化可饱和该界限。\n3. 这一结果意味着快速完全充电必然要求大规模纠缠，当归一化速率超过1/√2时认证了N体纠缠的产生，为量子电池的纠缠资源需求提供了可实验检验的精确判据。", "summary_source": "deepseek", "authors": [{"name": "Wenlong Sun"}, {"name": "Gang Lu"}, {"name": "Yuanfeng Jin"}], "featured_authors": [{"name": "Wenlong Sun"}, {"name": "Gang Lu"}, {"name": "Yuanfeng Jin"}], "author_count": 3}, {"id": "2605.16944", "category": "quant-ph", "title": "Efficient Hamiltonian Engineering for Adiabatic MIS Algorithms", "abstract": "We present a hybrid adiabatic algorithm for maximum independent set (MIS) using Rydberg atom arrays. We engineer local controls that preferentially excite atoms with few neighbors, which represent graph nodes with small degrees. Numerical simulations show that the designed pulses accelerate convergence to the MIS state and suppress population in trap states. We obtain higher success probabilities than traditional global controls and a $25\\%$ reduction in fidelity decay rate as problem hardness increases.", "url": "https://arxiv.org/abs/2605.16944", "type": "理论+数值", "summary": "1. 该工作提出一种基于里德伯原子阵列的混合绝热算法，通过哈密顿量工程实现最大独立集问题的高效求解。\n2. 其技术核心在于工程化局部控制场，优先激发图中小度数节点，从而加速收敛至最大独立态并抑制陷阱态，相比全局控制将保真度衰减率降低25%。\n3. 这为组合优化问题的量子绝热求解提供了可行的哈密顿量设计方案，并可推广至更大规模图结构或关联物态模拟。", "summary_source": "deepseek", "authors": [{"name": "Guy Karni"}, {"name": "Noam Cohen"}, {"name": "Adi Pick"}], "featured_authors": [{"name": "Guy Karni"}, {"name": "Noam Cohen"}, {"name": "Adi Pick"}], "author_count": 3}, {"id": "2605.16955", "category": "quant-ph", "title": "From Constraint to Code: DQI-Kit -- A Software Framework for Decoded Quantum Interferometry", "abstract": "Trying to solve hard optimisation problems with quantum techniques requires transformations of domain objectives and constraints into formats compatible with a chosen quantum algorithm. This often introduces inefficiencies and overheads that limit or even endanger potential quantum advantage for current and future approaches. To understand and mitigate these inefficiencies, software toolchains are essential for implementing transformations, analysing overheads and eventually selecting optimal transformation paths. Decoded Quantum Interferometry (DQI) is a novel approach that achieves apparent quantum advantage for certain algebraic optimisation problems. It natively operates on Max-LINSAT, which is unusual for combinatorial optimisation, and creates the need for software solutions that alleviate the burden of manually transforming problems of interest into this format. We present DQI-Kit, a software framework that provides a unified, extensible interface for automatically encoding constrained optimisation problems into Max-LINSAT. Users can describe the various types of objectives and constraints that are common in industrial optimisation problems. Our framework converts these into Max-LINSAT instances via a series of problem transformations and computes an estimate of the expected performance of DQI on these instances. We provide an initial analysis of the implemented transformations, discussing inefficiencies and ways to mitigate them. DQI-Kit is the basis for our ultimate goal of establishing a standardised framework that will enable further investigations to identify practical use cases for which quantum advantage with DQI can be achieved.", "url": "https://arxiv.org/abs/2605.16955", "type": "理论+数值", "summary": "1. 本文提出DQI-Kit软件框架，用于将约束优化问题自动编码为Max-LINSAT格式，以支持解码量子干涉测量（DQI）算法。\n2. 其技术核心在于提供统一可扩展接口，通过系列问题转换生成Max-LINSAT实例，并预估DQI在此类实例上的预期性能。\n3. 该框架为系统分析编码低效及探索DQI实现量子优势的实际用例奠定了标准化工具基础。", "summary_source": "deepseek", "authors": [{"name": "Simon Thelen"}, {"name": "Wolfgang Mauerer"}], "featured_authors": [{"name": "Simon Thelen"}, {"name": "Wolfgang Mauerer"}], "author_count": 2}, {"id": "2605.17025", "category": "quant-ph", "title": "Quantum Optical Soliton Dynamics Beyond Linearization: An Open-System Approach", "abstract": "We introduce two approaches to modeling the quantum dynamics of optical $\\chi^{(3)}$ solitons. Taking an open-system viewpoint, we project the underlying quantum field into system (soliton) and residual reservoir components. The reservoir is treated as either (i) a discrete ``Lanczos supermode'' (LSM) expansion which localizes dynamics to a few-supermode basis, or (ii) a non-local environment which can be traced out by deriving a Markovian master equation (ME). Using these methods, we analyze and identify the quantum structure of both the soliton's stability and its hierarchy of perturbations. Through numerical simulations, we confirm both methods effectively capture quantum-induced soliton phase shifts in a concise few-mode (single-mode for ME) basis, and the LSM approach also captures photon loss which arises from non-Markovian dispersive couplings. As neither method is limited to the linearized regime, our approaches provide powerful computational tools to analyze complex non-Gaussian quantum dynamics of solitons where other commonly-used methods fail, providing insight into such non-perturbative regimes. We also investigate radiation that occurs in the presence of higher-order dispersion with ultrashort pulses, deriving a ME that predicts photon loss consistent with classical theory, but find that both classical and ME theory dramatically underestimate the actual amount of dissipation, which we explain in terms of dispersive coupling-induced soliton broadening.", "url": "https://arxiv.org/abs/2605.17025", "type": "理论+数值", "summary": "1. 该工作基于开放系统视角，提出了Lanczos超模展开与马尔可夫主方程两种方法，用于描述光学χ⁽³⁾孤子的量子动力学。\n2. 其核心突破在于两种方法均未受限于线性化近似，能以极简模式基精确捕获孤子的非高斯量子相移与光子耗散。\n3. 这为探索高阶色散下超短脉冲的辐射及非马尔可夫耦合引起的孤子展宽等非微扰效应提供了有效计算框架。", "summary_source": "deepseek", "authors": [{"name": "Chris Gustin"}, {"name": "Ryotatsu Yangimoto"}, {"name": "Edwin Ng"}, {"name": "Hideo Mabuchi"}], "featured_authors": [{"name": "Chris Gustin"}, {"name": "Ryotatsu Yangimoto"}, {"name": "Edwin Ng"}, {"name": "Hideo Mabuchi"}], "author_count": 4}, {"id": "2605.17067", "category": "quant-ph", "title": "Near-Optimal Quantum Time Evolution Circuits via Provably Convergent Compression", "abstract": "Variational compression can significantly lower implementation overheads for encoding the time evolution of Hamiltonians into quantum circuits. However, they usually lack global convergence guarantees and well-established scaling behavior. In this work, we provide a recipe for choosing the initial point of such variational optimizations that guarantees convergence to a quantum circuit with near-optimal gate complexity $\\mathcal{O}\\left( N \\, t \\, \\text{polylog}(N \\, t/\\epsilon) \\right)$ for all local and translationally invariant Hamiltonians. We demonstrate our method by encoding the globally controlled time evolution of a Heisenberg antiferromagnet on a Kagome lattice. For $N = 48$ sites, evolution time $t=0.1$ and infidelity $\\epsilon\\approx1\\%$, the controlled time-evolution circuit requires 960 two-qubit B gates, for which we propose a straightforward implementation scheme for ion-trap setups. Thereby, our recipe extends digital quantum simulators toward system sizes and geometries that are challenging for classical computation.", "url": "https://arxiv.org/abs/2605.17067", "type": "理论+数值", "summary": "1. 该工作提出了通过可证明收敛的变分压缩方法，为局域平移不变哈密顿量构造近最优门复杂度的量子时间演化电路。\n2. 其核心在于给出了变分优化的初始点选择方案，确保收敛至O(N t polylog(N t/ε))门复杂度，并在Kagome晶格反铁磁体上演示了960个两比特B门的具体实现。\n3. 这一方法使数字量子模拟器能够扩展到经典计算难以处理的系统尺寸与几何构型，为离子阱等平台提供了明确的实现路径。", "summary_source": "deepseek", "authors": [{"name": "Erenay Karacan"}, {"name": "Isabel Nha Minh Le"}, {"name": "Matteo D'Anna"}, {"name": "Juan Carasquilla"}, {"name": "Christian B. Mendl"}, {"name": "Ivan Rojkov"}], "featured_authors": [{"name": "Erenay Karacan"}, {"name": "Isabel Nha Minh Le"}, {"name": "Matteo D'Anna"}, {"name": "Juan Carasquilla"}, {"name": "Christian B. Mendl"}, {"name": "Ivan Rojkov"}], "author_count": 6}, {"id": "2605.17143", "category": "quant-ph", "title": "Truncated-Binary Encoding: Spectral Degree Reduction of Combinatorial Optimization Problems for Quantum Hardware", "abstract": "Exact-binary encoding compiles a discrete cost function network (CFN) into a higher-order unconstrained binary optimization (HUBO) problem whose maximum monomial degree grows with the cardinalities of the underlying CFN variables. Given that quantum optimization hardware generally favours quadratic unconstrained binary optimization or low-degree HUBO Hamiltonians, high-cardinality CFNs therefore incur substantial overhead in the form of circuit depth, or ancilla qubits when degree-reduction techniques are employed. To ameliorate these issues, we propose \\textit{truncated-binary encoding} (TBE): a modification of exact-binary encoding in which Ising-basis monomials exceeding a chosen cutoff $k_\\text{max}$ are dropped from the encoded cost. We establish a tight $L^\\infty$ bound on the truncation error in terms of the omitted couplings, derive sufficient conditions on the energy gap and on the single bit-flip basin barrier under which TBE preserves the global minimum and its local-minimum structure, and characterize a noise floor condition on the spectral profile under which the truncation residual acts as a perturbative correction to the underlying landscape. We then express the encoded coefficients directly as Walsh transforms of the underlying CFN cost tables, and prove a bound under which smoothness of each cost table implies rapid decay of its high-degree Walsh mass. Together these results yield a principled \\textit{a priori} criterion for selecting $k_\\text{max}$ and for judging whether a given CFN admits a small-$k_\\text{max}$ TBE.", "url": "https://arxiv.org/abs/2605.17143", "type": "理论+数值", "summary": "1. 该工作提出截断二进制编码（TBE）以降低组合优化问题映射至量子硬件时的哈密顿量最高单式度。\n2. 其关键技术在于推导截断误差的紧致L∞上界、全局最小值保持条件及噪声谱轮廓判据，并利用Walsh变换建立成本表光滑性与高阶谱质量衰减的关联。\n3. 这为选择截止阶数k_max及判定是否适用低阶TBE提供了先验准则，有望减少量子优化中的电路深度或辅助量子比特开销。", "summary_source": "deepseek", "authors": [{"name": "Tristan Zaborniak"}], "featured_authors": [{"name": "Tristan Zaborniak"}], "author_count": 1}, {"id": "2605.17145", "category": "quant-ph", "title": "Scaling Quantum Optimization for Unit Commitment via Pauli Correlation Encoding", "abstract": "Unit commitment is an important optimization problem in power system operations, classified as NP-hard. This paper presents a hybrid quantum-classical method for the unit commitment problem with time-dependent constraints, where decisions must be made about which generators to turn on/off and how much power they should produce over a planning horizon. We use a hybrid quantum-classical optimization procedure to determine the on/off schedules of the generating units and the corresponding power dispatch that satisfies operational constraints such as load balance, generator limits, ramping, and reserve requirements. We frame the optimization loop as a leader-follower structure, where the quantum optimizer leads to give the on/off decisions, and the classical optimizer follows to produce the power level schedule. Leveraging Pauli-Correlation Encoding, our method scales to horizon-wide unit commitment schedules by encoding the binary variables with far fewer qubits. By combining these components, the method can handle multi-period settings while using far fewer qubits than straightforward quantum encodings that allocate one qubit per decision variable as in prior approaches. We evaluate the approach on both small- and large-scale instances, up to 312 binary variables, and show that it reliably produces feasible schedules with competitive operating costs.", "url": "https://arxiv.org/abs/2605.17145", "type": "理论+数值", "summary": "1. 本文提出一种混合量子-经典方法，用于求解带时间依赖约束的机组组合这一NP难优化问题。\n2. 其关键技术在于利用泡利关联编码将二进制变量编码至更少量子比特，并采用领导者-追随者结构分离开关决策与功率分配。\n3. 这为在大规模电力系统调度中应用量子优化提供了可扩展路径，且有望推广至其他多周期二进制优化问题。", "summary_source": "deepseek", "authors": [{"name": "Kien X. Nguyen"}, {"name": "Ilya Safro"}, {"name": "Xiaoyuan Liu"}], "featured_authors": [{"name": "Kien X. Nguyen"}, {"name": "Ilya Safro"}, {"name": "Xiaoyuan Liu"}], "author_count": 3}, {"id": "2605.17412", "category": "quant-ph", "title": "Module Lattice Security (Part IV): Probabilistic Polynomial Quantum Attack on Module-LWE over 2-Power Cyclotomics", "abstract": "We present a quantum attack on ML-KEM and related 2-power cyclotomic lattice schemes. Combining with Parts I-III, we provide an algorithm and verify the resulting approximation factor satisfies $\\gamma \\le 21 < q/2=1665$ for ML-KEM-1024, with a success probability $\\ge 0.99$. We apply a tower decomposition of the Principal Ideal Problem (PIP) through the chain $\\Q \\subset \\Q(\\zeta_8) \\subset \\cdots \\subset \\Q(\\zeta_{2^k})$ which yields a polynomial-time quantum algorithm costing $O(n^3 \\log^2 n)$ gates, $O(n^2 \\log n)$ qubits, and $\\mathrm{poly}(n)$ classical bit operations. We extend the analysis to Falcon, Hawk, and NTRU over 2-power cyclotomic rings. This means that ML-KEM, Falcon, Hawk, NTRU-HPS, and NTRU-HRSS with all standardized parameter sets are broken under quantum attack.", "url": "https://arxiv.org/abs/2605.17412", "type": "数值", "summary": "1. 该工作提出一种针对2-幂分圆环上Module-LWE及相关密码方案的概率多项式时间量子攻击，结合前三部分算法验证了ML-KEM-1024的近似因子满足γ≤21且成功概率≥0.99。\n2. 核心技术是通过主理想问题在Q⊂Q(ζ_8)⊂…⊂Q(ζ_{2^k})链上的塔分解，实现O(n³log²n)门、O(n²logn)量子比特的多项式时间量子算法。\n3. 这意味着ML-KEM、Falcon、Hawk、NTRU-HPS及NTRU-HRSS所有标准化参数集均被量子彻底破解，对后量子密码学安全性基础构成根本性挑战。", "summary_source": "deepseek", "authors": [{"name": "Ming-Xing Luo"}], "featured_authors": [{"name": "Ming-Xing Luo"}], "author_count": 1}, {"id": "2605.17507", "category": "quant-ph", "title": "Emergent supersymmetry in a time-space inverted quantum mechanics", "abstract": "This Letter shows that a supersymmetric structure is inherent to the time space inverted (TSI) quantum mechanics (QM) framework, where the spatial evolution of states is generated by the operator $\\hat{\\mathcal{P}}^{\\pm}(\\hat{\\mathcal{H}},\\hat t;q)=\\pm\\sqrt{2m[\\hat{\\mathcal{H}}-\\mathcal{\\hat V}(q)]}$ [\\href{ this https URL }{Phys. Rev. A. {\\bf 95}, 032133 (2017)}], named here Momentunian, whose square-root structure that can be factorized. Such factorization leads directly to a supersymmetric algebra with supercharges and partner Hamiltonians. For the relativistic Momentunian the zero mode states are shown to be evanescent states, \\textit{independent} of the physical potential. Furthermore, the existence of non-relativistic and relativistic Momentunian \\textit{partners} is demonstrated, whose zero-mode states are no longer necessarily zero energies, but vanishing momenta states. The natural emergence of the $1/2$-fractional time derivatives in the TSI QM, leads to supercharges which incorporate memory effects into the supersymmetric wave functions. Results indicate that supersymmetry emerges as a structural property of the TSI QM rather than being imposed phenomenologically.", "url": "https://arxiv.org/abs/2605.17507", "type": "理论", "summary": "1. 本文揭示时间空间反转量子力学框架内禀的超对称结构，该结构源于动力学算符“Momentunian”的平方根因子化。\n2. 其核心在于因子化直接导出超对称代数，并证明相对论Momentunian的零模态为不依赖物理势的消失态，同时1/2阶分数时间导数使超荷携带记忆效应。\n3. 该工作表明超对称是TSI量子力学的结构性质而非外加对称性，为理解非经典时间演化中的超对称性提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Marcus W Beims"}, {"name": "Arlans JS de Lara"}], "featured_authors": [{"name": "Marcus W Beims"}, {"name": "Arlans JS de Lara"}], "author_count": 2}, {"id": "2605.17532", "category": "quant-ph", "title": "From Fundamental Dynamics to Applied Cryptography: Studies on the Quantum Speed Limit and Fully Passive Quantum Key Distribution", "abstract": "This thesis studies two distinct frontiers of quantum information processing: the fundamental physical limits of dynamical evolution and the practical realization of secure quantum communication networks.", "url": "https://arxiv.org/abs/2605.17532", "type": "理论", "summary": "1. 该工作研究了量子信息处理的两个前沿：动力学演化的基本物理极限与实用化量子安全通信网络。\n2. 其卖点在于同时覆盖量子速度极限的理论刻画与全被动量子密钥分发的具体实现，架设基础物理与应用密码学的桥梁。\n3. 这为深入理解量子动力学基本限制以及推进免主动调制模块的实用化量子密钥分发提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Jinjie Li"}], "featured_authors": [{"name": "Jinjie Li"}], "author_count": 1}, {"id": "2605.17578", "category": "quant-ph", "title": "All Quantum Probability viewed in Complex P
