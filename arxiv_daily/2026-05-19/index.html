  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;

      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2605.16367", "category": "cond-mat", "title": "Nonlinear Ohmic electromagnetic response", "abstract": "We systematically investigate nonlinear Ohmic responses in second-harmonic generation and bilinear magnetoelectric effects within the Matsubara Green's function formalism. The optical nonlinear Ohmic conductivity is shown to consist of a nonlinear Drude-like part and an intrinsic term determined by the fully symmetrized normalized quantum metric dipole. Notably, we predict a previously unrecognized intrinsic Ohmic conductivity arising from band geometry in the bilinear magnetoelectric response, which exhibits transverse behavior similar to its optical counterpart. Using a two-dimensional Dirac model, we demonstrate that this geometrically induced nonlinear Ohmic response is observable in materials with high Fermi velocity and narrow band gaps. Our work provides a systematic quantum field-theoretic framework for describing nonlinear Ohmic transport in condensed matter systems.", "url": "https://arxiv.org/abs/2605.16367", "type": "理论", "summary": "1. 该工作基于松原格林函数形式，系统研究了二次谐波产生与双线性磁电效应中的非线性欧姆响应。\n2. 其核心在于发现双线性磁电响应中存在由完全对称归一化量子度量偶极子决定的内在欧姆电导率，并表现出横向光学类行为。\n3. 这为在高费米速度、窄带隙材料中观测能带几何诱导的非线性欧姆输运提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Anwei Zhang"}, {"name": "Zheng Cai"}, {"name": "C. M. Wang"}], "featured_authors": [{"name": "Anwei Zhang"}, {"name": "Zheng Cai"}, {"name": "C. M. Wang"}], "author_count": 3}, {"id": "2605.16368", "category": "cond-mat", "title": "A Unified Critical Scaling Theory for Macroscopic Lightning and Quantum Avalanches: From Three-Dimensional Directed Percolation to Testable Predictions", "abstract": "Lightning, the most colossal discharge in nature, and flux avalanches in quantum superconductors--phenomena separated by twenty orders of magnitude in scale--display striking fractal similarity. We demonstrate that this is no mere analogy but reveals a deep physical unity. Here, we establish a universal theoretical framework that connects them. By mapping both onto the same three-dimensional reaction-diffusion-advection equation grounded in non-equilibrium statistical physics, we show they belong to the same critical universality class. We demonstrate that both systems belong to the three-dimensional Directed Percolation (3D-DP) universality class near their critical point, sharing a unified set of universal critical exponents (e.g., avalanche size distribution exponent $\\tau \\approx 1.41$ , fractal dimension $D_f \\approx 2.5$). Furthermore, by incorporating the anisotropy and turbulence coupling intrinsic to real thunderstorm environments, we predict novel effects such as anisotropic fractality of lightning channels and the systematic shift of critical exponents by turbulence. The core theoretical breakthrough lies in proposing a geometric correspondence of quantum phase information: through a rigorous mapping, the microscopic quantum phase coherence of superconductors is translated into the curvature and torsion distributions of macroscopic lightning channels, revealing a quantum statistical fingerprint emergent in classical geometry. This framework not only provides a unified paradigm for understanding dissipative structures across scales but also, via seven testable predictions, opens avenues for simulating natural lightning with laboratory quantum systems and developing novel physical early-warning methods.", "url": "https://arxiv.org/abs/2605.16368", "type": "理论", "summary": "1. 该工作建立了宏观闪电与超导体量子雪崩的统一临界标度理论，证明二者同属三维有向逾渗普适类。\n2. 其突破在于通过反应-扩散-平流映射将量子相位相干性转化为闪电通道的曲率与挠率分布，并预言了各向异性分形及湍流对临界指数的系统性偏移。\n3. 该框架为跨尺度耗散结构提供了统一范式，基于七项可检验预测，开启了利用实验室量子系统模拟自然闪电与发展物理预警方法的新途径。", "summary_source": "deepseek", "authors": [{"name": "Zhe Li"}], "featured_authors": [{"name": "Zhe Li"}], "author_count": 1}, {"id": "2605.16394", "category": "cond-mat", "title": "Long Spin Relaxation Times in CVD-Grown Nanodiamonds", "abstract": "Currently, the primary applications of fluorescent nanodiamonds (FNDs) are in the area of biosensing, by using photoluminescence or spin properties of colour centres, mainly represented by the Nitrogen Vacancy (NV) point defect. The sensitivity of NV-FNDs to external fields is, however, limited by crystallographic defects, which influence their key quantum state characteristics - the spin longitudinal (\\textit{T$_1$}) and spin transversal (\\textit{T$_2$}) relaxation and coherence times, respectively. We report on utilising an advanced FND growth technique consisting of heterogeneous nucleation on pre-engineered sites to create FNDs averaging around 60 nm in size, with mean longitudinal coherence times of 800 $\\mu$s and a maximum over 1.8 ms, close to bulk theoretical values. This is a major, nearly ten-fold improvement over commercially available nanodiamonds for the same size range of 50 to 150 nm. Heavy-N doped nanodiamond shells, important for sensing events in nm proximity to the diamond surface, are fabricated and discussed in terms of re-nucleation and twinning on \\{111\\} crystal facets. We also discuss scalability issues in order to enable the production of FND volumes matching the needs of sensing applications.", "url": "https://arxiv.org/abs/2605.16394", "type": "理论", "summary": "1. 该工作利用CVD异质成核技术制备平均约60 nm的荧光纳米金刚石，测得纵向自旋弛豫时间（T1）平均800 μs、最高超1.8 ms。\n2. 核心卖点在于T1相比商用产品提升近十倍且接近体材料理论值，并制备了重氮掺杂壳层，讨论了{111}晶面再成核与孪晶机制。\n3. 这为纳米金刚石自旋传感器在近表面生物传感等应用中实现高灵敏度提供了可扩展制备路径。", "summary_source": "deepseek", "authors": [{"name": "Jeroen Prooth"}, {"name": "Michael Petrov"}, {"name": "Alevtina Shmakova"}, {"name": "Michal Gulka"}, {"name": "Petr Cigler"}, {"name": "Jan D'Haen"}, {"name": "Hans-Gerd Boyen"}, {"name": "Milos Nesladek"}], "featured_authors": [{"name": "Jeroen Prooth"}, {"name": "Michael Petrov"}, {"name": "Alevtina Shmakova"}, {"name": "Jan D'Haen"}, {"name": "Hans-Gerd Boyen"}, {"name": "Milos Nesladek"}], "author_count": 8}, {"id": "2605.16400", "category": "cond-mat", "title": "Irreversibility from Self-Reference: Gradient Flow and an H-Theorem for a Self-Referential Statistical Operator Framework", "abstract": "This paper is a direct companion to arXiv:2605.06705 , where the self-referential operator Omega was introduced and the Tsallis index q = alpha + beta was derived as a fixed-point condition within the local kernel approximation (LKA). Here we address four aspects deferred from the previous work. First, we carry out the first-order perturbative expansion of Omega beyond the LKA and demonstrate structural stability of q = alpha + beta at leading order in (xi/L)^2. Second, we define the iterative dynamical scheme Psi_(n+1) = Omega[Psi_n] and analyze convergence via Frechet spectral radius. Third, and centrally, we establish an H-theorem rigorously within the LKA for both the discrete iteration and the continuous gradient flow: we compute dF/dtau explicitly along the flow, identify the negative semi-definite dissipation term, establish the result rigorously in the LKA using strict convexity of F proved in the companion paper, and provide numerical evidence showing monotone decrease of F[Psi_n] across 53 iterations on an N = 80 discrete system. Fourth, we characterize the non-perturbative role of the self-coupling parameter kappa, identifying a re-entrant disordered phase at kappa > kappa* approximately 0.50 +/- 0.05. The paper is explicit about what is proved, what is established numerically, and what open problems remain for a complete analytical proof beyond the LKA.", "url": "https://arxiv.org/abs/2605.16400", "type": "理论+数值", "summary": "1. 本文在局域核近似(LKA)以外对自参照算符Omega进行一阶微扰展开，定义迭代动力学并分析收敛性，同时建立离散迭代和连续梯度流的H定理。\n2. 核心卖点在于利用F的严格凸性在LKA内严格推导了耗散项的负定性，证明了熵沿梯度流单调递减，并识别出自耦合参数kappa>0.5时出现重入无序相。\n3. 这为自参照统计力学框架提供了不可逆性的坚实基础，并为超越LKA的完全解析证明及复杂相行为研究指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Lucio Marassi"}], "featured_authors": [{"name": "Lucio Marassi"}], "author_count": 1}, {"id": "2605.16417", "category": "cond-mat", "title": "The problem of relaxation to equilibrium", "abstract": "When a thermodynamic system is released from any constraint, after some time its evolution will render it into an equilibrium state. Although the description of this relaxation to thermodynamic equilibrium has been attempted through both classical (Hamilton's equations) or quantum (Schrödinger equation) approaches, no success has been achieved without recurring to additional hypotheses. The present work demonstrates the possibility of reaching equilibrium states in a simple classical gaseous system, by imposing non-strict boundary conditions, in the sense that all interactions with the container walls must occur according to Heisenberg's uncertainty principle.", "url": "https://arxiv.org/abs/2605.16417", "type": "理论", "summary": "1. 该工作通过引入非严格边界条件（即容器壁相互作用遵循海森堡不确定原理），在简单经典气体系统中演示了从约束释放后弛豫到平衡态的可能性。\n2. 其关键在于无需额外假设，仅凭基于不确定性原理的边界相互作用即可驱动系统趋向热力学平衡。\n3. 这为理解经典系统弛豫的微观机制提供了新路径，并可能桥接经典与量子体系中平衡态建立的统一描述。", "summary_source": "deepseek", "authors": [{"name": "Silvina Limandri"}, {"name": "Silvina Segui"}, {"name": "Bruno Castellano"}, {"name": "Ignacio Belitzky"}, {"name": "Gustavo Castellano"}], "featured_authors": [{"name": "Silvina Limandri"}, {"name": "Silvina Segui"}, {"name": "Bruno Castellano"}, {"name": "Ignacio Belitzky"}, {"name": "Gustavo Castellano"}], "author_count": 5}, {"id": "2605.16424", "category": "cond-mat", "title": "Thermodynamic and statistical properties of a multifractional modified dispersion relation via the grand-canonical ensemble", "abstract": "We study the thermodynamic and statistical properties of a gas governed by a multifractional modified dispersion relation of the form $\\omega^{2}=k^{2}+4E_{*}^{-1/2}k^{5/2}$, where $E_{*}$ sets the characteristic scale of the multifractional correction. Working within the grand-canonical ensemble, we derive the modified density of states, the grand potential, the partition function, and the main thermodynamic quantities for both bosonic and fermionic sectors. The deformation changes the available phase-space distribution and produces nonstandard thermal scalings controlled by the ratio $T/E_{*}$. In the infrared regime, the usual relativistic gas behavior is recovered with leading corrections proportional to powers of $(T/E_{*})^{1/2}$. In the ultraviolet regime, the density of states scales as $\\varrho(\\omega)\\propto \\omega^{7/5}$, corresponding to an effective density-of-states dimension $d_{\\mathrm{eff}}=12/5$. As a consequence, the Stefan-Boltzmann law is deformed from $u\\propto T^{4}$ to $u\\propto E_{*}^{3/5}T^{17/5}$, while the equation-of-state parameter approaches $w=5/12$ instead of the standard radiation value $w=1/3$. We also analyze thermal stability, particle number and energy fluctuations, Bose-Einstein condensation, and the degenerate Fermi gas limit. The multifractional correction increases the critical temperature of a conserved bosonic gas and modifies the Fermi energy, pressure, sound speed, and low-temperature heat capacity of degenerate fermions.", "url": "https://arxiv.org/abs/2605.16424", "type": "理论", "summary": "1. 该工作利用巨正则系综系统研究了由多分形修正色散关系ω²=k²+4E_*^{-1/2}k^{5/2}描述的气体的热力学与统计性质，推导了玻色子和费米子体系的态密度、巨势及主要热力学量。\n2. 其核心在于揭示了紫外区态密度标度律ϱ(ω)∝ω^{7/5}，对应有效维度d_eff=12/5，并导致Stefan-Boltzmann定律变形为u∝E_*^{3/5}T^{17/5}及状态方程参数从1/3变为5/12。\n3. 该工作为研究量子引力或极端环境下修正色散关系的统计力学效应提供了明确框架，并预言了玻色-爱因斯坦凝聚临界温度升高及简并费米气体热容等可观测修正。", "summary_source": "deepseek", "authors": [{"name": "A. A. Araújo Filho"}], "featured_authors": [{"name": "A. A. Araújo Filho"}], "author_count": 1}, {"id": "2605.16494", "category": "cond-mat", "title": "Universal dynamics from a single-particle dark state", "abstract": "Open quantum systems can host dark or subradiant states whose decay is highly suppressed. While these states have been extensively studied in the few-excitation regime, their impact on the many-body dynamics remains largely unexplored. Here, we study a spin chain subject to correlated dissipation on neighboring sites, which admits a single-particle dark state at zero momentum. We show that the single-particle dark state qualitatively alters the many-body dynamics at long times, and identify its distinct universal behavior. While the zero-momentum mode is dark at the single-particle level, it decays slowly as $1/\\log t$ as it becomes dressed by other modes through a dissipation-induced nonlinearity. We demonstrate that the momentum distribution takes a universal scaling form in $k\\sqrt{t}$, and the total density decays as $1/\\sqrt{t}\\log t$. Our results further elucidate the origin of the conflicting results in recent works. Finally, we corroborate the analytics with matrix product state simulations and show that the same universal behavior persists for soft-core interactions, underscoring the universality of the emergent dynamics.", "url": "https://arxiv.org/abs/2605.16494", "type": "数值", "summary": "1. 该工作研究了关联耗散自旋链中单粒子暗态对多体长时动力学的调控作用。\n2. 其卖点在于揭示了零动量暗态经耗散诱导非线性修饰后，动量分布遵循k√t普适标度，总密度按1/√t log t衰减。\n3. 这为理解开放量子系统中暗态驱动非平衡普遍动力学提供了理论框架，并统一了近期矛盾结果。", "summary_source": "deepseek", "authors": [{"name": "Ruben Daraban"}, {"name": "Arghavan Safavi-Naini"}, {"name": "Johannes Schachenmayer"}, {"name": "Mohammad Maghrebi"}], "featured_authors": [{"name": "Ruben Daraban"}, {"name": "Arghavan Safavi-Naini"}, {"name": "Johannes Schachenmayer"}, {"name": "Mohammad Maghrebi"}], "author_count": 4}, {"id": "2605.16503", "category": "cond-mat", "title": "From bulk to interface dynamics, in and out of equilibrium", "abstract": "We study the dynamics of weakly deformed interfaces separating two stable phases, starting from the fluctuating hydrodynamics of the phase-separating fields. Using a well-chosen definition for the interface and the dynamical-action formalism to represent path probabilities, we derive the linear relaxation of the interface and the fluctuations around it for a large class of models. Our method applies to equilibrium dynamics, where it recovers and complements existing results, but also extends to their non-equilibrium counterparts. We explain how non-linear terms can be systematically computed and illustrate their derivations in the case of (active) model A. We highlight the danger of a popular ansatz used to derive interface dynamics, which was rigorously established in equilibrium but is uncontrolled for active field theories.", "url": "https://arxiv.org/abs/2605.16503", "type": "理论+数值", "summary": "1. 该工作从相分离场论的涨落流体力学出发，系统推导了弱变形界面在平衡与非平衡条件下的线性弛豫动力学及其涨落。\n2. 核心卖点在于利用动力学作用量形式化路径概率，严格获得了界面运动的线性弛豫与涨落，并指出平衡场论中建立的流行假设在活性场论中不受控。\n3. 这为从微观场论出发系统构建界面有效动力学提供了严格框架，尤其为非平衡活性体系界面行为的理论分析开辟了可靠途径。", "summary_source": "deepseek", "authors": [{"name": "Lila Sarfati"}, {"name": "Julien Tailleur"}, {"name": "Frédéric van Wijland"}], "featured_authors": [{"name": "Lila Sarfati"}, {"name": "Julien Tailleur"}, {"name": "Frédéric van Wijland"}], "author_count": 3}, {"id": "2605.16541", "category": "cond-mat", "title": "Correlation-Driven Spin Reorientation via Competing Anisotropy Channels in CrPS4", "abstract": "We identify a correlation-driven mechanism for the temperature-induced spin reorientation in the quasi-one-dimensional van der Waals antiferromagnet CrPS4. Magnetic pair distribution function (mPDF) analysis resolves the local spin direction and shows that ferromagnetic intrachain correlations persist far above TN. Combining these correlations with a DFT-derived spin Hamiltonian reveals competing single-ion and exchange-anisotropy channels, with single-ion anisotropy remaining local while exchange anisotropy is renormalized as intersite correlations decay. This differential renormalization rotates the effective easy axis and captures the ordered-state canting. Above TN, the continued rotation beyond the model prediction delineates the limits of the dominant-chain approximation. These results establish mPDF-derived correlations as direct inputs to microscopic Hamiltonians and show how low-dimensional correlations can control magnetic anisotropy.", "url": "https://arxiv.org/abs/2605.16541", "type": "理论+数值", "summary": "1. 该工作通过磁对分布函数解析局域自旋结构，识别了准一维范德华反铁磁体中由关联驱动的自旋重取向机制。\n2. 其核心在于结合实验关联函数与DFT自旋哈密顿量，揭示单离子各向异性保持局域而交换各向异性因链间关联衰减被重正化，导致有效易轴转动。\n3. 这建立了mPDF导出关联作为微观哈密顿量直接输入的范式，并为低维关联差异重正化控制磁各向异性提供了普适启发。", "summary_source": "deepseek", "authors": [{"name": "Raju Baral"}, {"name": "Harald O. Jeschke"}, {"name": "Igor I. Mazin"}, {"name": "Jue Liu"}, {"name": "David Mandrus"}, {"name": "Stuart Calder"}], "featured_authors": [{"name": "Raju Baral"}, {"name": "Harald O. Jeschke"}, {"name": "Igor I. Mazin"}, {"name": "Jue Liu"}, {"name": "David Mandrus"}, {"name": "Stuart Calder"}], "author_count": 6}, {"id": "2605.16574", "category": "cond-mat", "title": "Data-driven analysis of metastability in a stochastic bistable system", "abstract": "We study the metastability properties of a simple prototypical bistable system using the formalism of the Koopman operator. Instead of studying noise-induced transitions by following the trajectories of the system, we track them by studying the time evolution and the decay rate of the subdominant mode of the Koopman operator, thus in a geometry-agnostic framework. We find agreement with the predictions - both the exponential and subexponential ones - of large deviation theory in the weak-noise limit for the statistics of escape time, both in equilibrium and nonequilibrium conditions. The subdominant Koopman mode also allows for an accurate reconstruction of the competing basins of attraction. Going deeper in the Koopman spectrum, we are able to recognise modes that are associated with intrawell variability as well as with the escape of trajectories from the saddle towards the attractor, both in the equilibrium and nonequilibrium case. Our methodology, being grounded in purely data-driven techniques, could be helpful for studying high-dimensional metastable systems.", "url": "https://arxiv.org/abs/2605.16574", "type": "理论", "summary": "1. 本文利用Koopman算子形式，从数据驱动角度研究双稳随机系统的亚稳态性质。\n2. 通过追踪次主导Koopman模的衰减率与时空演化，以几何无关方式获得弱噪声极限下逃逸时间统计的指数与次指数行为。\n3. 该纯数据驱动方法不依赖系统轨迹，可推广至高维亚稳态系统的吸引域重建与逃逸动力学分析。", "summary_source": "deepseek", "authors": [{"name": "Ankan Banerjee"}, {"name": "Manuel Santos Gutierrez"}, {"name": "John Moroney"}, {"name": "Valerio Lucarini"}], "featured_authors": [{"name": "Ankan Banerjee"}, {"name": "Manuel Santos Gutierrez"}, {"name": "John Moroney"}, {"name": "Valerio Lucarini"}], "author_count": 4}, {"id": "2605.16635", "category": "cond-mat", "title": "Berry-phase in a periodically driven single molecule magnet transistor", "abstract": "We consider the electron transport through a single molecule magnet transistor in the presence of a local transverse magnetic field and ac-driven gate voltage. We calculate the conductance as a function of the electron energy and transverse magnetic field by using the Floquet and Landauer formalism. We show that the time periodic potential causes zero transmission resonances that oscillate as a function of the transverse magnetic field due to the Berry phase interference associated with two quantum tunneling paths. We find that these Berry phase oscillations can be detected in the conductance as a function of the transverse magnetic field for an incoming electron with a specific energy.", "url": "https://arxiv.org/abs/2605.16635", "type": "理论", "summary": "1. 该工作利用Floquet和Landauer形式计算了单分子磁体晶体管在横向磁场和交流门电压驱动下的电导。\n2. 其核心发现在于时间周期势诱导的零透射共振随横向磁场振荡，该振荡源自两条量子隧穿路径间的Berry相位干涉。\n3. 这为在分子磁体器件中通过电导测量直接探测Berry相位干涉提供了明确的理论方案。", "summary_source": "deepseek", "authors": [{"name": "Gabriel Gonzalez"}], "featured_authors": [{"name": "Gabriel Gonzalez"}], "author_count": 1}, {"id": "2605.16659", "category": "cond-mat", "title": "Non-linear diffusion and inhomogeneity of the magnetic field in single-turn coils: Insights from 3D multiphysics modeling", "abstract": "The single-turn coil method is a destructive pulsed magnet for generating over 100 T with a few $\\mu$-second pulse duration, and it inevitably causes the coil to explode. The temporal and spatial distributions of the electric current and magnetic field are highly inhomogeneous, arising from the skin effect, rapid temperature rise, and coil deformation. To grasp the dynamic phenomena in the single-turn coil, we conducted a finite element analysis using multiphysics simulation. We employed finite element method calculations using a fully 3D model of the single-turn coil with broken cylindrical symmetry. The calculated result revealed highly nonlinear diffusion of electric current, temperature, and magnetic fields, which are the sources of the inhomogeneous magnetic fields inside the single-turn coil in time and space.", "url": "https://arxiv.org/abs/2605.16659", "type": "理论+数值", "summary": "1. 该工作利用全三维有限元方法构建了单匝线圈的多物理场耦合模型，通过联立求解麦克斯韦方程组、热传导方程与结构力学方程，系统模拟了百特斯拉级微秒脉冲磁场产生过程中电流密度、温度与磁场的非线性扩散及其时空不均匀分布特征。\n2. 其核心突破在于模型完整保留了圆柱对称性破缺，定量揭示了趋肤效应导致的电流表层聚集、快速温升引起的电导率变化以及线圈塑性形变三者耦合作用下磁场扩散前沿的局部加速、扭曲与增强机制。\n3. 这为深入理解破坏性脉冲磁体内部磁场不均匀性的物理起源、优化单匝线圈几何参数以扩大有效均匀区域，以及验证极端条件下多物理场耦合数值方法的可靠性提供了重要的模拟依据与物理洞见。", "summary_source": "deepseek", "authors": [{"name": "Hideaki Kobayashi"}, {"name": "Yugaku Goyo"}, {"name": "Yuto Ishii"}, {"name": "Yasuhiro H. Matsuda"}, {"name": "Kunio Takekoshi"}, {"name": "Akihiko Ikeda"}], "featured_authors": [{"name": "Hideaki Kobayashi"}, {"name": "Yugaku Goyo"}, {"name": "Yuto Ishii"}, {"name": "Yasuhiro H. Matsuda"}, {"name": "Kunio Takekoshi"}, {"name": "Akihiko Ikeda"}], "author_count": 6}, {"id": "2605.16662", "category": "cond-mat", "title": "Euler-Maruyama method for non-Wiener processes", "abstract": "Descriptions of complex physical or biological systems often include stochastic contributions, and these are commonly simulated using Wiener processes. In many cases however, non-Gaussian fluctuations may originate from non-Wiener processes which remain less explored. The Euler-Maruyama method of discretising stochastic differential equations to non-Wiener processes is generalised. Non-Gaussian noise generated from a subset of Lévy processes can be used simply and often with more physical justification, for both additive and multiplicative noise. An example of this is provided that gives superior physical results compared to using geometric Brownian motion. Finally the results of the additive noise are shown to be equivalent to a derived master equation via the Kramers-Moyal expansion.", "url": "https://arxiv.org/abs/2605.16662", "type": "理论", "summary": "1. 该工作将Euler-Maruyama离散化方法推广至非Wiener过程，用于模拟由Lévy过程子集生成的非高斯噪声。\n2. 核心卖点在于非高斯噪声在加性和乘性情况下均更具物理合理性，且加性噪声情形下与Kramers-Moyal展开导出的主方程严格等价。\n3. 这为复杂物理与生物系统中非高斯随机动力学的数值模拟提供了更准确、物理动机更明确的通用框架。", "summary_source": "deepseek", "authors": [{"name": "Richard D.J.G. Ho"}], "featured_authors": [{"name": "Richard D.J.G. Ho"}], "author_count": 1}, {"id": "2605.16830", "category": "cond-mat", "title": "Relativistic theory for coupled orbital and spin angular momentum dynamics in magnetic systems", "abstract": "We develop a complete relativistic theory to describe the dynamics of electronic angular momentum including both spin (S) and orbital (L) contributions in magnetic systems. We start with the relativistic Dirac-Kohn-Sham Hamiltonian under the influence of an electromagnetic field and apply a unitary transformation to formulate the extended Pauli Hamiltonian. Using the transformed semirelativistic Hamiltonian, we derive the angular momentum dynamics for the orbital and spin angular momenta. Thereby, we formulate the coupled dynamics of orbital and spin moments consistent with the relativistic Dirac framework. Considering especially the conservation of the total angular momentum, J = S +L, we show first that J is conserved in the absence of a spin-polarized Kohn-Sham exchange field, but is no longer conserved under the application of an electromagnetic field, e.g., laser pulse, THz field, etc. Second, considering magnetic systems with atomic spin and orbital momenta, we derive the coupled equations of motion of angular momenta dynamics whilst making the atomistic Heisenberg approximation for the exchange interaction. Our results suggest that, under these assumptions, the total angular momentum remains conserved, even with electromagnetic field, but atomic spin and orbital angular momenta individually are not conserved.", "url": "https://arxiv.org/abs/2605.16830", "type": "理论", "summary": "1. 该工作从相对论Dirac-Kohn-Sham哈密顿量出发，经幺正变换导出扩展Pauli哈密顿量，推导了磁性系统中自旋与轨道角动量的耦合动力学方程。\n2. 其核心物理在于揭示总角动量在无交换场时守恒、电磁场下不守恒，但在原子Heisenberg近似下仍守恒，而自旋和轨道角动量各自不守恒。\n3. 这为超快自旋动力学及轨道矩调控提供了严格相对论框架，并对激光或太赫兹场驱动下角动量输运的理论模拟具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Subhadip Santra"}, {"name": "Ritwik Mondal"}, {"name": "Marco Berritta"}, {"name": "Peter M. Oppeneer"}], "featured_authors": [{"name": "Subhadip Santra"}, {"name": "Ritwik Mondal"}, {"name": "Marco Berritta"}, {"name": "Peter M. Oppeneer"}], "author_count": 4}, {"id": "2605.16888", "category": "cond-mat", "title": "Finite-Temperature Spin Exchange-Correlation Kernel of the Uniform Electron Gas", "abstract": "The finite-temperature spin response of the uniform electron gas (UEG) is a fundamental reference for spin-polarized and magnetized electron liquids, including warm dense matter (WDM), yet it remains far less constrained than charge response. Using variational diagrammatic Monte Carlo, we compute the static spin exchange--correlation (XC) kernel $K_{xc}(q;T)$ of the unpolarized UEG at metallic densities across the quantum-degenerate, warm-dense, and classical regimes. The kernel connects smoothly to zero-temperature spin-response parametrizations at low temperature, while heating suppresses the Fermi-surface-scale spin-correlation structure and weakens the XC-driven Stoner enhancement. Its long-wavelength limit provides a direct response test of the spin stiffness implied by thermal local-spin-density-approximation (LSDA) parametrizations, showing low-temperature consistency while exposing a resolved warm-dense residual in current LSDA parametrizations. In the classical regime, the spin XC kernel becomes nearly local on the Fermi-momentum scale, in sharp contrast to the corresponding charge XC kernel. These results provide a first-principles basis for finite-temperature spin-response theory and magnetized WDM modeling.", "url": "https://arxiv.org/abs/2605.16888", "type": "理论+数值", "summary": "1. 该工作利用变分图表蒙特卡洛方法计算了均匀电子气在金属密度下跨越量子简并、温稠密到经典温区的有限温度静态自旋交换相关核。\n2. 其物理核心在于揭示升温平滑连接零温响应并抑制费米面尺度自旋关联结构、弱化Stoner增强，且长波极限检验表明当前局域自旋密度近似在温稠密区存在可分辨残差，而经典区自旋核近乎局域，与电荷核行为迥异。\n3. 这为有限温度自旋响应理论及磁化温稠密物质建模提供了第一性原理基准，并对改进相关交换关联泛函具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Pengcheng Hou"}, {"name": "Zhiyi Li"}, {"name": "Youjin Deng"}, {"name": "Kun Chen"}], "featured_authors": [{"name": "Pengcheng Hou"}, {"name": "Zhiyi Li"}, {"name": "Youjin Deng"}, {"name": "Kun Chen"}], "author_count": 4}, {"id": "2605.16957", "category": "cond-mat", "title": "An Efficient Approach for Calculating Free Energy in Molecular Dynamics: Demineralization of Hydroxyapatite as a Case Study", "abstract": "Despite the strength of Molecular Dynamics simulations in providing insights into the microscopic details of phenomenon in many fields in materials science, physics and biology, the biggest barrier is its limited timescale which is several orders of magnitude lower than the timescale of the real-world processes and phenomena being modeled. Free energy calculations are designed as a remedy to this problem that in theory can overcome this barrier. This is particularly relevant for biomineralisation processes such as tooth mineral formation and dissolution, while reflecting a broader challenge in accurately modelling rare events and long-timescale phenomena across complex molecular systems. However, due to the novelty of the field, a number of questions remain outstanding pertaining to the best practice of applying this method. The non-equilibrium work approach based on the Jarzynski equation is one of the most promising free energy calculation methods. However, the biggest challenge for the broader use of this method is the question of how many simulations are required for an accurate free energy estimation. Comparing the free energy results with very long reversible pulling simulations of atom clusters from the surface, each taking 75 days on the 48-core Intel Xeon Platinum 8268 CPUs, in this study we showed that this question is irrelevant and higher quality and better equilibrated initial structures is the proper approach than simply based on the number of simulations. We designed a new adaptive free energy calculation methodology which combines high quality, high computational cost free energy values with lower quality, lower cost values to build up the entire free energy profile. In the best case scenario this method lowers manifold the computational cost required for the non-equilibrium work free energy calculations compared to both the regular method and the reversible simulation.", "url": "https://arxiv.org/abs/2605.16957", "type": "理论+数值", "summary": "1. 该工作提出了一种高效的自由能计算方法，用于解决分子动力学模拟中长时间尺度难题，并以羟基磷灰石脱矿过程为案例验证。\n2. 其技术核心在于揭示初始结构的平衡质量比模拟次数更关键，并设计自适应策略融合高、低质量计算以大幅降低非平衡功方法的计算成本。\n3. 这为生物矿化及复杂分子体系罕见事件的自由能计算提供了可操作的实践指引，显著提升模拟效率与可靠性。", "summary_source": "deepseek", "authors": [{"name": "Mahdi Tavakol"}, {"name": "Jin-Chong Tan"}, {"name": "Alexander M. Korsunsky"}], "featured_authors": [{"name": "Mahdi Tavakol"}, {"name": "Jin-Chong Tan"}, {"name": "Alexander M. Korsunsky"}], "author_count": 3}, {"id": "2605.16987", "category": "cond-mat", "title": "Percolation transition of strongly connected clusters in finite dimensions and on complete graphs", "abstract": "We study the percolation of strongly connected clusters (SCCs), in which sites are mutually reachable through directed paths, in systems with randomly oriented bonds by extensive simulations on hypercubic lattices from dimension $d=2$ to $7$ and complete graphs. Below the upper critical dimension $d_u=6$, the critical SCCs exhibit nontrivial fractal dimension $d_{\\rm SCC}$, and the size distribution scales as $\\sim s^{-\\tau_{\\rm SCC}}$ with the hyperscaling relation $\\tau_{\\rm SCC}=1+d/d_{\\rm SCC}$. For $d \\ge d_u$, mean-field behavior is recovered with $d_{\\rm SCC}/d=1/3$, consistent with complete-graph results. However, in contrast to hypercubic lattices, complete graphs exhibit a double-scaling structure in the SCC size distribution: large SCCs are governed by mean-field value $\\tau_{\\rm SCC}=4$, while small SCCs follow a distinct power law with exponent $\\tau'=1$. At criticality, the giant in- and out-clusters are also fractal, sharing the same dimension as standard percolation clusters. These results show that critical SCCs remain well-defined fractal objects across dimensions, while their approach to the mean-field limit involves nontrivial changes in cluster statistics.", "url": "https://arxiv.org/abs/2605.16987", "type": "理论+数值", "summary": "1. 该工作通过大规模模拟，系统研究了从二维至七维超立方晶格及完全图上随机定向键系统中强连通团簇的逾渗转变。\n2. 其核心发现是：低于上临界维度d_u=6时临界强连通团簇具有非平凡分形维数并满足超尺度关系τ_SCC=1+d/d_SCC；完全图上的尺寸分布则显示双标度结构，大团簇由平均场指数τ_SCC=4控制，小团簇遵循幂律指数τ'=1。\n3. 这些结果表明临界强连通团簇在不同维度保持分形对象特征，其向平均场极限的过渡涉及团簇统计的维度依赖非平凡变化，为理解有向逾渗临界行为提供了统一框架。", "summary_source": "deepseek", "authors": [{"name": "Qi Wang"}, {"name": "Ming Li"}], "featured_authors": [{"name": "Qi Wang"}, {"name": "Ming Li"}], "author_count": 2}, {"id": "2605.17004", "category": "cond-mat", "title": "Model of Simplicial Complexes with dimension-wise preferential attachment", "abstract": "Network science is a powerful framework allowing to model complex systems, it is capable to describe and take into account the intricate web of connections existing among the constituting basic element of the system. Recently scholars have brought to the fore the relevance of higher-order networks, namely structures allowing to encode for many-body interaction, differently from the pairwise case handled by networks. This novel research field opens new avenues of research with applications ranging from neurosciences to social sciences; there is thus a need for generative models of higher-order network capable to reproduce features present in empirical data. In this work we present a model for growing simplicial complex rooted on a preferential attachment process acting dimension-wise, i.e., returning a power law distribution for the generalized degree of simplexes of different dimension.", "url": "https://arxiv.org/abs/2605.17004", "type": "理论", "summary": "1. 该工作提出了一个基于维度依赖优先连接机制的单纯复形生长模型。\n2. 其核心在于该机制使不同维度单纯形的广义度均呈现幂律分布，复现高阶网络实证特征。\n3. 这为生成具有多体交互结构的复杂系统模型提供了可扩展框架，可应用于神经科学或社会科学等领域。", "summary_source": "deepseek", "authors": [{"name": "Diego Febbe"}, {"name": "Duccio Fanelli"}, {"name": "Timoteo Carletti"}], "featured_authors": [{"name": "Diego Febbe"}, {"name": "Duccio Fanelli"}, {"name": "Timoteo Carletti"}], "author_count": 3}, {"id": "2605.17066", "category": "cond-mat", "title": "Supercurrent spin Hall effect enabled nanopillar Josephson diodes", "abstract": "In the recent years it has been possible to achieve diode-like, non-reciprocal current-voltage response in Josephson junctions, despite the intrinsic symmetry of the Josephson effect itself. This is typically achieved by incorporating Rashba spin-orbit coupling into the Josephson junction as a strong inversion symmetry breaking component, and external magnetic field as a tuneable time-reversal symmetry breaking component. However, the efficiencies of the external field tuneable Josephson-diodes have remained limited to less than 10 \\%, often measured below 100 mK temperature. In this work we take a new approach where non-reciprocity is induced by intrinsic SOC in a heavy metal Josephson barrier via the predicted supercurrent spin-Hall effect. By measuring a series of Nb-Pt-Nb nanopillar junctions we demonstrated field tuneable Josephson diode efficiencies as high as 17\\%, measured above liquid Helium temperature. This was possible by the realization of a net non-equilibrium spin segregation in the Pt barrier, due to the supercurrent spin-Hall effect in the Pt barrier, analogous to the normal spin-Hall effect. As the direction of the induced spin moment is determined by the bias current, an external magnetic field causes the associated phases to add with opposite signs for opposite current directions, resulting in a nonreciprocal supercurrent across the junction.", "url": "https://arxiv.org/abs/2605.17066", "type": "理论", "summary": "1. 该工作通过重金屬鉑勢壘中的超流自旋霍爾效應，在Nb-Pt-Nb納米柱約瑟夫森結中實現非互易超流，構建了場可調約瑟夫森二極管。\n2. 其核心物理賣點在於超流自旋霍爾效應在Pt層誘導非平衡自旋分離，自旋方向由偏置電流決定，使外磁場對正反電流產生相反相位疊加，從而實現高達17%的二極管效率且工作溫度高於液氦。\n3. 這一機制無需Rashba自旋軌道耦合和極低溫，為推動高效率、高溫可工作的超導二極管器件提供了自旋電子學新途徑。", "summary_source": "deepseek", "authors": [{"name": "Debashree Nayak"}, {"name": "Dimple Rani"}, {"name": "Prasanjit Samal"}, {"name": "Kartik Senapati"}], "featured_authors": [{"name": "Debashree Nayak"}, {"name": "Dimple Rani"}, {"name": "Prasanjit Samal"}, {"name": "Kartik Senapati"}], "author_count": 4}, {"id": "2605.17074", "category": "cond-mat", "title": "Path-Extrema Upper Bounds on Mean Entropy Production", "abstract": "Fluctuation relations imply the second-law inequality $\\langle\\Sigma_T\\rangle\\ge0$, but path extrema can also constrain how large the mean entropy production can be. For steady-state processes with entropy-production martingale $M_t=e^{-\\Sigma_t}$, we show that knowing only the positive running maximum of $\\Sigma_t$ gives no improvement over the trivial endpoint bound: rare negative entropy-production excursions can still carry the exponential weight required by the fluctuation relation. Using the running extrema $L_T=\\inf M_t$ and $H_T=\\sup M_t$, we derive a path-extrema upper envelope $\\mathcal{U}_{\\rm ext}$. The relaxed envelope problem ranks realized intervals by the entropy gain per martingale cost, $\\ln(H_T/L_T)/(H_T-L_T)$, giving a continuous knapsack problem. The actual mean satisfies the exact identity $\\langle\\Sigma_T\\rangle=\\mathcal{U}_{\\rm ext}-\\mathcal{A}-\\mathcal{C}$, where $\\mathcal{A}$ is an allocation gap across realized envelopes and $\\mathcal{C}$ is a curvature gap within each envelope. Thus path extrema set the upper envelope, while the two gaps quantify how actual dynamics allocate terminal outcomes across envelope classes and place terminal values within each realized envelope. This turns path-extrema information into a quantitative upper-bound theory for entropy production, complementary to the usual lower-bound role of fluctuation relations.", "url": "https://arxiv.org/abs/2605.17074", "type": "理论", "summary": "1. 该工作基于稳态过程的熵产生鞅，利用路径极值推导了平均熵产生的上界，建立了与涨落关系的下界作用互补的定量上界理论。\n2. 其核心是导出路径极值上包络线 \\(\\mathcal{U}_{\\rm ext}\\)，并将平均熵产生精确分解为包络线减去分配间隙与曲率间隙，揭示了终端结果在包络类间及类内的分配机制。\n3. 这为仅依赖路径极值信息约束熵产生提供了严格框架，启发在非平衡统计物理中同时利用路径极值与涨落关系进行完整界定的研究方向。", "summary_source": "deepseek", "authors": [{"name": "Surachate Limkumnerd"}], "featured_authors": [{"name": "Surachate Limkumnerd"}], "author_count": 1}, {"id": "2605.17227", "category": "cond-mat", "title": "Disorder effect on the superfluid density and the origin of the pseudogap end point in the cuprate superconductors", "abstract": "A major puzzle in the study of the cuprate superconductivity is the origin of the pseudogap end point. Intriguingly, such a critical doping is also where the superfluid density of the system reaches its maximum. A non-monotonic doping dependence of the superfluid density is rather unusual since the Drude weight of the cuprate system is found to increase monotonically with the doping concentration. It is generally believed that such a peculiar behavior should be attributed to both the strongly correlated nature of the cuprate system and the disorder effect. In this work, we develop a variational theory for the zero temperature superfluid density of the disordered $t-J$ model. This is achieved in two steps. First, we perform an unrestricted variational optimization of an RVB variational ground state for the disordered $t-J$ model. Second, we construct the variational state that describes the paramagnetic current response on such an RVB state. The zero temperature superfluid density $\\rho_{s}(0)$ is then extracted from the curvature of the variational ground state energy of the system as a function of the external electromagnetic field. We find that $\\rho_{s}(0)$ computed in this way is remarkably robust against the disorder effect. More specifically, we find that $\\rho_{s}(0)$ is a monotonically increasing function of doping concentration $x$ and scales linearly with the total optical weight. This is consistent with the observation in the underdoped cuprates but is strongly at odd with the behavior in the overdoped cuprates. The strong contrast between the disorder effect in the underdoped and the overdoped regime lends strong support to our previous proposal that there exist a Mott transition between a doped-Mott-insulating metal in the underdoped regime and a fermi-liquid-like metal in the overdoped regime around the pseudogap end point.", "url": "https://arxiv.org/abs/2605.17227", "type": "理论+数值", "summary": "1. 该工作发展了无序t-J模型零温超流密度的变分理论，通过两步无约束变分优化实现。\n2. 其核心在于从基态能量对外加电磁场曲率提取超流密度，发现其对无序效应高度稳健，且随掺杂单调增大并与总光学权重线性相关。\n3. 这揭示了欠掺杂与过掺杂区无序效应的显著对比，支持了赝能隙终点处由掺杂莫特绝缘体金属向费米液体金属转变的Mott转变机制。", "summary_source": "deepseek", "authors": [{"name": "Rong Cheng"}, {"name": "Tao Li"}, {"name": "Jianhua Yang"}], "featured_authors": [{"name": "Rong Cheng"}, {"name": "Tao Li"}, {"name": "Jianhua Yang"}], "author_count": 3}, {"id": "2605.17241", "category": "cond-mat", "title": "Frequency renormalization and its effects in nonlinear phononics with $Q_RQ_{IR}^{2}$-type coupling", "abstract": "A two-phonon system with lowest-order coupling of form $Q_RQ_{IR}^2$ is studied by perturbation method, and analytic results for both phonon displacements and frequencies are obtained. The frequency renormalization of infrared (IR) active mode brings the rectification of Raman mode to saturate at high pump field. For degenerate IR mode with coupling of form $Q_R(Q_{IR,x}^2-Q_{IR,y}^2)$, the frequency of IR mode will split when resonantly pumped by elliptically or linearly polarized ultrashort mid-IR pulse, realizing Raman rectification and magnetization simultaneously. Our results reveal a dynamical effect of nonlinear phononics not captured by first-principles calculation, extend the dynamical multiferroicity to systems with coupling $Q_R(Q_{IR,x}^2-Q_{IR,y}^2)$, and the method can be readily applied to higher-order couplings. The amplitude saturation under strong pump field stimulates future researches to overcome this nonlinear effect.", "url": "https://arxiv.org/abs/2605.17241", "type": "理论+数值", "summary": "1. 该工作通过微扰方法解析研究了具有Q_R Q_IR^2型最低阶耦合的双声子系统，获得了声子位移和频率重整化的精确解析表达式。\n2. 其核心物理卖点是发现红外活性模的频率重整化导致拉曼模整流在高泵浦场下饱和，而简并红外模在椭圆或线偏振超短中红外脉冲共振泵浦下发生频率分裂，同时实现拉曼整流与磁化，揭示出第一性原理计算未能捕捉的非线性声子学动力学效应。\n3. 该工作将动力学多铁性推进至Q_R(Q_IR,x^2-Q_IR,y^2)耦合体系，其微扰方法可直接推广至更高阶耦合情形，并指出强场下振幅饱和问题是对未来实验与理论研究的明确挑战和启示。", "summary_source": "deepseek", "authors": [{"name": "Yijie Zeng"}], "featured_authors": [{"name": "Yijie Zeng"}], "author_count": 1}, {"id": "2605.17338", "category": "cond-mat", "title": "At Most Two Infinite Blue Clusters in the CMR Representation of the Edwards-Anderson Spin Glass", "abstract": "The two-replica Chayes-Machta-Redner (CMR) representation is one of the main proposed geometric signatures of spin-glass order in the short-range Edwards-Anderson model. Mean-field arguments and recent numerics suggest that the low-temperature phase should exhibit two macroscopic blue clusters carrying opposite overlap signs. We prove a rigorous structural constraint in this direction. For any translation-invariant joint Gibbs measure on disorder, two spin replicas, and CMR bond variables on Z^d, the blue subgraph contains at most two infinite connected components; if two exist, then they lie in a common infinite grey cluster and belong to opposite overlap-parity classes. The main obstacle is that the blue-bond process is neither insertion-tolerant nor positively associated, so the usual Burton-Keane and random-cluster arguments do not apply. We circumvent this by working in the full joint measure and using a finite-box merge operation together with the mass-transport bound on ends of translation-invariant subgraphs. As auxiliary input, we establish finite energy and a percolation transition for the grey subgraph via Bayesian resampling of couplings and a parity-based Peierls estimate. These results do not prove the existence of infinite blue clusters or a spin-glass phase transition, but they give a rigorous upper bound compatible with the two-cluster picture for short-range spin glasses.", "url": "https://arxiv.org/abs/2605.17338", "type": "理论", "summary": "1. 该工作证明了短程Edwards-Anderson自旋玻璃的CMR表示中，蓝色子图最多含有两个无限连通分支，且若存在两个则必属相反重叠奇偶类并同处一个无限灰色团簇。\n2. 技术突破在于通过引入有限盒合并操作和质量传输边界，克服了蓝色键过程缺乏插入容忍性和正关联性带来的论证困难，并利用贝叶斯重采样和奇偶性Peierls估计确立了灰色子图的有限能量与渗流转变。\n3. 这一严格上界为自旋玻璃有序相的若干几何表征提供了约束，并为后续验证两团簇图像或探索更高维行为指明了理论方向。", "summary_source": "deepseek", "authors": [{"name": "Yan Ru Pei"}], "featured_authors": [{"name": "Yan Ru Pei"}], "author_count": 1}, {"id": "2605.17420", "category": "cond-mat", "title": "Specific heat and susceptibility of S=1/2 antiferromagnets on square, triangular, and kagome lattices", "abstract": "We study the temperature dependence of the thermodynamic properties of spin-1/2 antiferromagnets on two-dimensional lattices. Our analysis employs the sine-square deformation (SSD), in which a real-space envelope function is applied to the Hamiltonian so that the local energy scale is smoothly reduced to zero at the system boundaries. The quantum eigenstates of the SSD Hamiltonian exhibit bulk-like behavior near the system center, effectively mimicking the thermodynamic limit even in small finite-size calculations. Using these fictitious bulk states, we compute the energy density, specific heat, and magnetic susceptibility as functions of temperature. We find that both the triangular- and kagome-lattice antiferromagnets show either a shoulder or a pronounced double-peak structure in the low-temperature specific heat, whereas the kagome case particularly shows a strong enhancement of magnetic susceptibility down to the lowest temperature range. These direct comparisons, together with the square-lattice and one-dimensional cases, reveal that although both frustrated systems retain a substantial amount of entropy, the low-energy excitations below ~ 0.5J of the kagome lattice are predominantly governed by the magnetic excited states, whereas not much for the triangular lattice.", "url": "https://arxiv.org/abs/2605.17420", "type": "理论+数值", "summary": "1. 该工作采用正弦平方变形(SSD)方法，计算了平方、三角和kagome晶格上自旋1/2反铁磁体系的比热与磁化率随温度变化的关系。\n2. 其技术卖点在于SSD通过实空间包络函数平滑缩减边界能量尺度，使有限尺寸计算有效逼近热力学极限，并发现kagome晶格低温比热具显著双峰结构且磁化率持续增强，而三角晶格仅呈肩峰。\n3. 这为系统研究几何阻挫体系中低能磁激发与熵竞争提供了SSD这一有效工具，并启示可将该方法推广至其他强关联量子自旋系统的热力学性质计算。", "summary_source": "deepseek", "authors": [{"name": "Chisa Hotta"}], "featured_authors": [{"name": "Chisa Hotta"}], "author_count": 1}, {"id": "2605.17469", "category": "cond-mat", "title": "Partial Kondo Screening Solves the Mystery of Rare Earth Tetraborides", "abstract": "We invoke a new mechanism to account for multiple magnetization plateaus observed in rare-earth tetraborides. Using a combination of hybrid and semiclassical Monte Carlo simulations of the Kondo lattice model (KLM) on the Shastry-Sutherland lattice (SSL), we find robust magnetization plateaus at fractions 1/6, 2/9, 1/4, 1/3, 1/2, 2/3 and 3/4 of the saturation magnetization. We find that most of the plateau states are partially Kondo screened and emerge from the field-tuning of a complex three-way competition between the kinetic energy, the Kondo coupling, and the magnetic frustration. Most remarkably, the unusual magneto-transport reported in ErB$_4$ and TmB$_4$ admits an unexpectedly simple explanation within our mechanism. This work not only provides an elegant and simple solution to the long-standing puzzle of metamagnetism and anomalous magnetotransport in RB$_4$, but also introduces a novel mechanism to predict and discover new correlated phases in frustrated Kondo lattices.", "url": "https://arxiv.org/abs/2605.17469", "type": "理论+数值", "summary": "1. 该工作提出部分近藤屏蔽机制，通过混合与半经典蒙特卡洛模拟解释稀土四硼化物中多个分数磁化平台及反常磁输运现象。\n2. 技术关键在于在Shastry-Sutherland晶格的近藤晶格模型中，揭示动能、近藤耦合与磁阻挫三方竞争调控下部分近藤屏蔽态的产生。\n3. 这为理解阻挫近藤晶格中长存超磁性与反常磁输运谜题提供了简洁方案，并预言新的关联量子相。", "summary_source": "deepseek", "authors": [{"name": "Soumyaranjan Dash"}, {"name": "Sanjeev Kumar"}], "featured_authors": [{"name": "Soumyaranjan Dash"}, {"name": "Sanjeev Kumar"}], "author_count": 2}, {"id": "2605.17523", "category": "cond-mat", "title": "Structure of the twist-bend nematic phase with respect to the orientational molecular order of the thioether-linked dimers", "abstract": "An analysis of the IR absorbance for the segmented functional groups of liquid crystal dimers: mesogen and linker, enabled the orientation order to be determined and information about the dipole interactions in the nematic and twist-bend nematic phases to be obtained. The long axis orientational order increases as the temperature decreases in the nematic phase, although much more slowly than for the classical nematics, and then reverses this trend in the twist-bend nematic phase due to the tilt of the molecules. In the nematic phase, the short axis of the molecule performs an isotropic uniform rotation and has a uniaxial alignment. In the twist-bend nematic phase, however, biaxial ordering occurs and grows significantly in accordance with the helical deformation of the director. Changes in the mean absorbance in the twist-bend nematic phase were observed: a decrease for the longitudinal dipole at the nematic-twist-bend nematic phase transition, thus emphasizing the antiparallel axial interaction of the dipoles, while the absorbance of the transverse dipoles remains unchanged up to 340 K, and then the latter become parallelly correlated.", "url": "https://arxiv.org/abs/2605.17523", "type": "理论", "summary": "1. 该工作通过分析硫醚连接二聚体中介晶基元与连接基的红外吸收，确定了分子长轴与短轴在向列相和扭曲-弯曲向列相中的取向序，并获得了偶极相互作用信息。\n2. 主要发现包括：长轴取向序在向列相随降温缓慢增加，但在扭曲-弯曲向列相因分子倾斜而反向下降；短轴在向列相呈各向同性均匀旋转和单轴排列，而在扭曲-弯曲相出现显著双轴有序并与指向矢螺旋形变一致。\n3. 纵向偶极在向列-扭曲-弯曲向列相变处吸收下降，表明反平行轴向偶极相互作用增强，而横向偶极在340 K以上转为平行关联，这为理解该相中分子定向有序与偶极耦合机制提供了关键实验依据。", "summary_source": "deepseek", "authors": [{"name": "Antoni Kocot"}, {"name": "Barbara Loska"}, {"name": "Yuki Arakawa"}, {"name": "Katarzyna Merkel"}], "featured_authors": [{"name": "Antoni Kocot"}, {"name": "Barbara Loska"}, {"name": "Yuki Arakawa"}, {"name": "Katarzyna Merkel"}], "author_count": 4}, {"id": "2605.17579", "category": "cond-mat", "title": "Getting rid of the ghosts: a toy-model of membrane melting", "abstract": "The theory of thermal fluctuations in crystalline membranes is put under scrutiny. In particular, the two critical regimes of the renormalisation group diagram, which are often left out of the discussion because of their instability in one direction, are examined in details. After studying the proper Goldstone mode counting around each of them, the properties of the fluctuations dominating the large scale spectrum are analysed. This shows that the fixed point P2 is a good candidate to describe the melting of a crystalline membrane. The properties of the melted membrane are then compared to the known properties of fluid membranes. As a byproduct of this analysis, we show that the generation of a fluid membrane by melting a bidimensional crystal allows to formulate its correlation functions without being plagued by the ghosts that inevitably show up in the usual Canham-Helfrich action relying on the Monge parametrisation.", "url": "https://arxiv.org/abs/2605.17579", "type": "理论", "summary": "1. 该工作重新审视晶体膜热涨落理论，详细研究重正化群图中两个通常因方向不稳定性而被忽略的临界区域，并论证P2不动点可作为描述晶体膜融化的候选。\n2. 其卖点在于通过正确计数各区域戈德斯通模并分析主导大尺度谱的涨落性质，指出由二维晶体融化生成流体膜可避免标准Canham-Helfrich作用中Monge参数化固有的幽灵涨落。\n3. 这为关联函数的规范表述提供了明确路径，同时揭示了融化膜与流体膜性质的关联，启发了对膜融化临界行为的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Olivier Coquand"}], "featured_authors": [{"name": "Olivier Coquand"}], "author_count": 1}, {"id": "2605.17600", "category": "cond-mat", "title": "Exact solution and pair correlation functions for a generalized three-chain Ising tube with multispin interactions", "abstract": "We obtain an exact solution for a generalized three-chain Ising tube (TCGIT) of length $L$ with toroidal boundary conditions and the most general $C_3$-invariant Hamiltonian on an elementary prism, containing 20 independent coupling constants, including an external magnetic field. Using an $8\\times 8$ transfer matrix, we derive the exact partition function of the finite system and obtain the free energy, internal energy, specific heat, magnetization, magnetic susceptibility, and entropy in the thermodynamic limit $L\\to\\infty$. In the general case, $\\lambda_{\\max}$ is determined by a quartic equation, whereas in the principal special case with even-spin interactions (PSC) the spectrum simplifies substantially: the characteristic polynomial factorizes, and $\\lambda_{\\max}$ is given by the root of a quadratic equation. For mirror-symmetric subfamilies, we derive explicit formulas for the pair correlation functions and express the magnetization in terms of the components of the eigenvector associated with $\\lambda_{\\max}$; in the even-spin case with $h=0$, the magnetization vanishes. Important special cases include the width-three planar model with nearest-neighbor, next-nearest-neighbor, and plaquette interactions, including the entropy limit $S(T\\to0^+)=(\\ln 2)/3$ for $k\\ge 0$ and $S(T\\to0^+)=0$ for $k<0$, as well as the width-three planar triangular model with distinct nearest-neighbor couplings, three-spin interactions involving neighboring triangles, and an external field.", "url": "https://arxiv.org/abs/2605.17600", "type": "理论", "summary": "1. 该工作精确求解了具有20个独立耦合常数的最一般C₃对称三链伊辛管模型，在环面边界条件下通过8×8转移矩阵获得热力学极限下的自由能、比热、磁化率等热力学函数。\n2. 主要卖点在于偶数自旋相互作用情形下特征多项式因式分解，使最大本征值由二次方程根给出，并基于本征向量分量推导了对关联函数与磁化强度的闭式表达式。\n3. 这一精确解框架为低维伊辛系统中多自旋相互作用及关联函数的解析研究提供了可推广的范例，特别适用于平面梯子模型与三角晶格模型的进一步分析。", "summary_source": "deepseek", "authors": [{"name": "Pavel Khrapov"}, {"name": "Nikita Volkov"}], "featured_authors": [{"name": "Pavel Khrapov"}, {"name": "Nikita Volkov"}], "author_count": 2}, {"id": "2605.17616", "category": "cond-mat", "title": "A comparative first-principles investigation of bilayer NbOX2 (X=Cl, Br, I) for Photocatalytic water splitting applications", "abstract": "Motivated by our previous work on bulk NbOX2 , where we have reported its high 1dielectric polarisation and finite piezoelectric response, this work extends to its 2D homo bilayer system to explore its potential for photocatalytic water splitting. Herein, density functional theory (DFT) were employed in probing the structural, electronic, optical, and photocatalytic properties of 2D homo bilayer NbOX2 (X = Cl, Br, and I). Our results show that structurally, NbOCl2 and NbOBr2 prefer AC bilayer stacking,while AB stacking was preferred by NbOI2 . All the considered bilayers are dynamically, thermally, and mechanically stable. From the analysis of electronic structure we have found a decreasing trend in the energy band gap as X goes down the group from Cl to I, with the position of the valence band maximum shifting upward along the high symmetry points. In terms of carrier mobility, all 2D bilayer systems possess high carrier mobility comparable to known 2D materials. It also exhibits an anisotropic carrier transfer property by which charge carriers are separated efficiently. These materials show similar trends to BiOI and PtSe2 , in which photocatalytic efficiency was increased by forming the multiple layers. The materials under investigation are suitable for photocatalytic water splitting under visible and ultraviolet regions with absorption coefficients of 105 cm-1.", "url": "https://arxiv.org/abs/2605.17616", "type": "理论+数值", "summary": "1. 该工作采用第一性原理计算，系统研究了二维同质双层NbOX₂ (X=Cl, Br, I)的结构、电子、光学和光催化水分解性能。\n2. 关键点在于发现Cl和Br偏好AC堆叠而I偏好AB堆叠，带隙随卤素原子序数增大而减小，体系具有高各向异性载流子迁移率以促进电荷分离。\n3. 这为类似BiOI和PtSe₂的多层光催化材料设计提供依据，表明NbOX₂双层在可见-紫外光区吸收系数达10⁵ cm⁻¹，具备高效水分解潜力。", "summary_source": "deepseek", "authors": [{"name": "Laku Dorjee Tamang"}, {"name": "Shivraj Gurung"}, {"name": "Bhanu Chettri"}, {"name": "Nguyen Thanh Tien"}, {"name": "Le Huu Nghia"}, {"name": "Darwin Barayang Putungan"}, {"name": "Ranjit Thapa"}, {"name": "Kailash Chandra Bhamu"}, {"name": "Dibya Prakash Rai"}], "featured_authors": [{"name": "Laku Dorjee Tamang"}, {"name": "Shivraj Gurung"}, {"name": "Bhanu Chettri"}, {"name": "Ranjit Thapa"}, {"name": "Kailash Chandra Bhamu"}, {"name": "Dibya Prakash Rai"}], "author_count": 9}, {"id": "2605.17621", "category": "cond-mat", "title": "Variational Boundary Fluctuations as a First-Principles Origin of Langevin Noise", "abstract": "Stochastic forces are usually postulated or obtained by eliminating environmental degrees of freedom. Here we identify a variational origin: fluctuating endpoint data in Hamilton's principle induce fluctuations of the on-shell action. Hamilton--Jacobi propagation transports this boundary imprint, whose gradient generates an effective Langevin force inherited from boundary-action fluctuations. The resulting force is not freely specifiable: its amplitude is filtered by the Hessian of Hamilton's principal function, yielding multiplicative and state-dependent noise. Homogeneous additive Langevin forcing is recovered only as a Markovian coarse-grained limit.", "url": "https://arxiv.org/abs/2605.17621", "type": "理论+数值", "summary": "1. 该工作揭示哈密顿原理中端点数据的变分涨落可通过在壳作用量的哈密顿-雅可比传播传递至动力学，为朗之万噪声提供第一性原理的变分起源，无需引入环境自由度。\n2. 其技术卖点在于：边界涨落印记的梯度直接产生有效随机力，且该力的振幅被哈密顿主函数Hessian过滤，从而自然形成乘性和状态依赖噪声，突破传统加性噪声假设。\n3. 该结果将随机力提升为作用量原理的内禀要素，表明均匀加性朗之万力仅作为马尔可夫粗粒化极限近似，对随机动力学、热力学和量子-经典过渡等方向具有基础性启示。", "summary_source": "deepseek", "authors": [{"name": "Francisco Monroy"}], "featured_authors": [{"name": "Francisco Monroy"}], "author_count": 1}, {"id": "2605.17622", "category": "cond-mat", "title": "Iterative maps emerging from cohomological structure of primes", "abstract": "Prime numbers appeared in contexts spanning statistical mechanics, quantum mechanics and dynamical systems. However, the mechanisms governing the irregularities observed in their sequence and linking them to physical systems remained unclear. Here, it is shown that prime gaps at different separation distances follow a function depending on that distance and can be described by an iterative map which predicts the primary growth of successive primes. On the other hand, the analysis of remaining fluctuations reveals the existence of a well-defined cohomological structure, where the deterministic functional relation holds for primes up to small decaying fluctuations. In consequence, the long-range correlations as well as local jumps in primes encode the underlying cohomological structure where prime numbers are states of a given system that becomes deterministic asymptotically. Remarkably, the solution to this cohomological equation turns out to be the logarithmic integral function.", "url": "https://arxiv.org/abs/2605.17622", "type": "理论", "summary": "1. 该工作通过素数间隔的迭代映射及其背后上同调结构的揭示，阐明了素数序列中不规则性的机制，并将素数视为渐近确定性系统的状态。\n2. 其核心在于发现素数间隔随距离的确定性函数关系可由迭代映射描述，而长程关联与局部跳跃编码的上同调结构恰好以对数积分函数为解。\n3. 这为连接素数理论到统计力学、量子力学及动力系统中的物理行为提供了明确框架，有望启发相关系统的可预测性研究。", "summary_source": "deepseek", "authors": [{"name": "Marzena Ciszak"}], "featured_authors": [{"name": "Marzena Ciszak"}], "author_count": 1}, {"id": "2605.17627", "category": "cond-mat", "title": "Collective dynamics of active matter with orientation-weighted alignment", "abstract": "We study an agent-based model of self-propelled particles with a velocity-dependent alignment rule. This interaction is orientation weighted and acts along the line connecting neighboring particles. Tuning the alignment strength produces several distinct collective regimes, including disordered gas-like motion, coherent flocking, jammed high-density states, and densely ordered moving clusters with active-crystal-like behavior. These results show that a simple local alignment rule can generate a broad range of nonequilibrium collective dynamics within a single microscopic model.", "url": "https://arxiv.org/abs/2605.17627", "type": "理论", "summary": "1. 该工作构建了具有方向加权对齐规则的活性粒子模型，系统研究了其集体动力学行为。\n2. 其核心在于单一局部相互作用强度调控即可实现从气态无序、相干群聚到高密度阻塞及活性晶体状有序团簇的多种非平衡态。\n3. 这证明了简单局部对齐规则足以在统一微观框架内涌现丰富的集体运动，为活性物质相行为的理解提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Bohdan Dobosh"}, {"name": "Alexander Yakimenko"}], "featured_authors": [{"name": "Bohdan Dobosh"}, {"name": "Alexander Yakimenko"}], "author_count": 2}, {"id": "2605.17649", "category": "cond-mat", "title": "Competition and coexistence of superconducting symmetries in $p$-wave magnets", "abstract": "We investigate the interplay between unconventional magnetism and superconductivity in a model of a $p$-wave magnet on a square lattice. Using a self-consistent Bogoliubov-de-Gennes approach, we analyze the pairing amplitudes, competition, and coexistence of spin-singlet $s$-wave and spin-triplet $p$-wave pairings in the presence of a magnetic texture with a helical structure along the $x$ direction that is repeated in the $y$ direction. We find that the magnetic helix selectively stabilizes different pairing symmetries depending on its orientation and strength. In particular, mixed-spin $p_x$-wave pairing is enhanced at intermediate magnetic couplings and equal-spin $p_y$-wave pairing is robust and insensitive to all coupling intensities. When the multiple order parameters are simultaneously considered, we find regimes of coexistence and competition. Increasing the magnetic coupling drives two quantum phase transitions. The first from dominant spin-singlet $s$-wave to mixed-spin triplet $p_x$-wave pairings in a regime of coexistence. The second from spin-singlet $s$-wave and mixed-spin triplet $p$-wave pairings with total spin projection $S_z=0$ to dominant equal-spin triplet $p_y$-wave pairings with $S_z=\\pm1$ in a regime of mutually exclusive superconducting phases. Our results demonstrate that $p$-wave magnetic order does not merely diminish spin-singlet $s$-wave superconductivity but can actively promote and stabilize spin-triplet $p$-wave pairing, both intrinsically and in proximity to spin-singlet $s$-wave superconductors. These findings highlight unconventional magnets as promising materials for realizing robust triplet superconductivity.", "url": "https://arxiv.org/abs/2605.17649", "type": "理论", "summary": "1. 该工作利用自洽 Bogoliubov-de-Gennes 方法，在方晶格 p 波磁体模型中研究了自旋单态 s 波与自旋三重态 p 波配对的竞争与共存。\n2. 其核心发现是磁螺旋纹理的取向与强度可选择性地稳定不同配对对称性，中间耦合增强混合自旋 p_x 波，等自旋 p_y 波则对所有耦合强度不敏感，并驱动了两步量子相变。\n3. 这表明 p 波磁序并非仅抑制 s 波超导，还能主动促进并稳定 p 波三重态配对，为在非常规磁体中实现稳健的三重态超导提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "J. E. C. Carmelo"}, {"name": "I. R. Pimentel"}, {"name": "P. D. Sacramento"}], "featured_authors": [{"name": "J. E. C. Carmelo"}, {"name": "I. R. Pimentel"}, {"name": "P. D. Sacramento"}], "author_count": 3}, {"id": "2605.17667", "category": "cond-mat", "title": "I-V characteristics of SNS junctions with a multivalley normal region", "abstract": "In multivalley conductors the inter-valley relaxation time $\\tau_v$ and the inelastic relaxation time $\\tau_{in}$ may be significantly longer than the intra-valley momentum relaxation time $\\tau$. We show that this separation of time scales has dramatic effects on the I-V characteristics of SNS junctions with a multivalley normal region. We generalize the Larkin-Ovchinnikov equations describing superconducting kinetics to the case of multivalley superconductors. We use this generalization to obtain a kinetic description of multivalley SNS junctions. We find that at constant voltage bias $V$, the current $I(V)$ is nonmonotonic; it exhibits two peaks of similar magnitude $I_\\text{max,1} \\sim I_\\text{max,2}$ at $V_1 \\sim \\hbar(e\\tau_{in})^{-1}$ and $V_2\\sim \\hbar(e\\tau_v)^{-1}$, which may greatly exceed the critical current $I_c(T)$. At constant current bias $I$ we find that in a wide interval, $I_c(T) < I \\lesssim I_{\\text{jump}}$, the nonlinear resistance of the junction is controlled by the long relaxation times and may be several orders of magnitude smaller than the normal state resistance.", "url": "https://arxiv.org/abs/2605.17667", "type": "理论", "summary": "1. 该工作将Larkin-Ovchinnikov方程推广至多谷超导体，并据此理论研究了多谷正常区SNS结的I-V特性。\n2. 其核心发现是谷间弛豫时间τ_v与非弹性弛豫时间τ_in远大于动量弛豫时间τ的时间尺度分离导致恒压偏置下电流在V1≈ħ/(eτ_in)和V2≈ħ/(eτ_v)处出现幅度相近的双峰结构，峰值可远超临界电流；恒流偏置下从临界电流到跳变电流的宽区间内非线性电阻由长弛豫时间控制，可比正常态电阻低数个量级。\n3. 该工作为多谷超导系统非平衡输运提供了定量动力学框架，并对利用谷自由度调控超导结非线性响应具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Liam Bonds"}, {"name": "Shiang-Bin Chiu"}, {"name": "Anton Andreev"}, {"name": "Boris Spivak"}], "featured_authors": [{"name": "Liam Bonds"}, {"name": "Shiang-Bin Chiu"}, {"name": "Anton Andreev"}, {"name": "Boris Spivak"}], "author_count": 4}, {"id": "2605.17722", "category": "cond-mat", "title": "Ferroelectric polarization controlled orbital Hall conductivity in a higher-order topological insulator: \\textit{d1T}-phase monolayer MoS$_2$", "abstract": "The higher-order topological insulator is an extended concept of the conventional topological insulator, which obeys the generalization of the standard bulk-boundary correspondence. In our paper, we predict the monolayer \\textit{d1T}-phase transition metal dichalcogenide MoS$_2$ to be a higher-order topological insulator, while also possessing intriguing ferroelectric characteristics. We explicitly demonstrate the nontrivial topological index and reveal the hallmark corner states with quantized fractional charge within the bulk band gap. Second, we show the existence of a nonzero orbital Hall conductivity plateau within the energy gap which is a signature to identify higher-order topology system. Additionally, we investigate the relationship between the ferroelectricity and the orbital Hall conductivity of \\textit{d1T} MoS$_2$ and find that the direction of ferroelectric polarization can modulate the positive and negative values of the orbital Hall conductivity $\\sigma_{\\rm{OH}}^x$. Our findings provide the theory and material candidate for ferroelectricity tunable orbital Hall effect which is promising to realize the external electric field controllable orbitronics.", "url": "https://arxiv.org/abs/2605.17722", "type": "理论", "summary": "1. 本文预测单层d1T相MoS₂为高阶拓扑绝缘体，展示体带隙内量化分数电荷角态与非零轨道霍尔电导率平台。\n2. 核心在于发现铁电极化方向可调控轨道霍尔电导率σ_OH^x的正负符号，实现铁电性与轨道电子学的耦合。\n3. 这为外电场可控的轨道电子学器件提供了明确材料候选与理论依据，拓展了高阶拓扑绝缘体的功能化应用。", "summary_source": "deepseek", "authors": [{"name": "Yingjie Hu"}, {"name": "Heng Gao"}, {"name": "Wei Ren"}], "featured_authors": [{"name": "Yingjie Hu"}, {"name": "Heng Gao"}, {"name": "Wei Ren"}], "author_count": 3}, {"id": "2605.17781", "category": "cond-mat", "title": "Universal interface fluctuations in absorbing-state phase transitions", "abstract": "Despite similarities between models exhibiting absorbing phase transitions (APTs) and those showing Kardar-Parisi-Zhang (KPZ) growth, the relationship between these universal fluctuations has remained elusive. We numerically study (1+1)-dimensional interfaces of (2+1)-dimensional models showing APTs of directed percolation (DP) and compact directed percolation (CDP) classes with an active boundary, finding a universal crossover from short-time APT-governed fluctuations to long-time KPZ fluctuations. Upon rescaling time and length by the APT correlation time and length, the cumulants of the interface height distributions collapse onto a single scaling function. The fluctuation properties of the discrete Domany-Kinzel model and the continuum stochastic Fisher-Kolmogorov-Petrovsky-Piskunov (sFKPP) equation coincide, indicating that the KPZ growth parameters are determined solely by fundamental properties of the APT. For the CDP sFKPP equation, a dimensionless parameter tunes both the critical interface distribution and the KPZ parameters, with the interface properties of the biased voter model recovered in a limiting case. These results uncover a universal crossover in which KPZ fluctuations emerge from APT fluctuations at long times, linking paradigmatic universality classes of nonequilibrium scale-invariant phenomena.", "url": "https://arxiv.org/abs/2605.17781", "type": "理论+数值", "summary": "1. 该工作通过数值研究(2+1)维有活性边界的DP和CDP类吸收相变模型中的(1+1)维界面，发现了从短时吸收相变涨落到长时KPZ涨落的普适交叉。\n2. 其卖点在于揭示了重标度时间与长度后界面高度分布累积量塌缩至单一标度函数，且KD及sFKPP方程涨落性质一致表明KPZ参数完全由吸收相变决定。\n3. 这为建立吸收相变与KPZ两类非平衡标度普适类之间的深层联系提供了明确启发，并在CDP情形下参数化调控界面分布及KPZ参数。", "summary_source": "deepseek", "authors": [{"name": "Yohsuke T. Fukai"}, {"name": "Keiichi Tamai"}, {"name": "Tetsuya Hiraiwa"}], "featured_authors": [{"name": "Yohsuke T. Fukai"}, {"name": "Keiichi Tamai"}, {"name": "Tetsuya Hiraiwa"}], "author_count": 3}, {"id": "2605.17838", "category": "cond-mat", "title": "Network analysis for steady-state current fluctuations under finite affinity: Application to Brownian computation", "abstract": "A graph-theoretic analysis of the steady-state current noise in master equations under a finite thermodynamic force (affinity) is presented. The incidence matrix twisted by a finite affinity is not orthogonal to the standard cycle space, motivating the introduction of twisted circuit matrices to restore the orthogonality. The resulting twisted-cycle matrix yields an interference-like effect, enabling us to express the signal-to-noise ratio as a quadratic optimization problem in terms of twisted-cycle currents. We apply this framework to a Brownian computation model on a tree-like state-transition diagram with exponential backward branching, finite affinity at each step, and a single reset cycle. In the limit of an infinitely long intended computation path $\\ell$, the Fano factor of the reset current undergoes a transition from noiseless to Poissonian behavior at an affinity equal to the logarithm of the number of immediate predecessors $\\alpha$. This corresponds to an easy-hard transition in the computational time complexity [K. Okajima, K. Hukushima, arXiv:2512.24728 ], which is not captured by the thermodynamic uncertainty relation. This transition point precisely characterizes the thermodynamic costs of logically irreversible computation: in the absence of affinity, the reset cost scales as $\\ln \\ell$, whereas reaching the transition point requires a thermodynamic force of order $\\ln \\alpha$ per step to counteract backward branching.", "url": "https://arxiv.org/abs/2605.17838", "type": "理论+数值", "summary": "1. 该工作对有限亲和力下主方程稳态电流噪声进行图论分析，并应用于树状布朗计算模型，刻画了复位电流Fano因子的无噪声—泊松跃迁。\n2. 通过引入扭曲回路矩阵恢复非正交性，将信噪比表达为扭曲回路电流的二次优化，揭示跃迁点在亲和力等于前驱数对数时出现，且不归热力学不确定关系描述。\n3. 该跃迁精确刻画逻辑不可逆计算的热力学代价：无亲和力时复位成本随路径长度对数增长，跃迁点则需每步以α对数量级的亲和力抵消后向分支。", "summary_source": "deepseek", "authors": [{"name": "Yasuhiro Utsumi"}], "featured_authors": [{"name": "Yasuhiro Utsumi"}], "author_count": 1}, {"id": "2605.17881", "category": "cond-mat", "title": "Mpemba effect in a sheared granular gas with velocity-dependent restitution", "abstract": "We investigate the Mpemba effect in a dilute sheared granular gas with a velocity-dependent restitution coefficient. Using kinetic theory based on Grad's moment method, we analyze the relaxation dynamics following a sudden change in the shear rate. We show that, despite having a higher initial temperature, a system starting from an isotropic state can relax faster than a system prepared in a sheared steady state, demonstrating a clear Mpemba effect in the temperature evolution. We further demonstrate the emergence of a viscosity Mpemba effect, characterized by crossings in the relaxation curves of the shear viscosity. Remarkably, multiple crossings arise due to an additional intrinsic timescale introduced by the velocity dependence of the restitution coefficient, providing a minimal kinetic mechanism for multiple Mpemba effects in driven granular gases.", "url": "https://arxiv.org/abs/2605.17881", "type": "理论", "summary": "1. 该工作通过Grad矩方法动理论，研究速度依赖恢复系数下剪切颗粒气体中温度与黏度的Mpemba效应。\n2. 卖点在于发现各向同性初始态比剪切稳态弛豫更快，且恢复系数速度依赖引入额外时间尺度导致黏度弛豫曲线出现多重交叉。\n3. 这为驱动颗粒气体中多重Mpemba效应提供了最小动理机制，启示其他非平衡系统中类似弛豫反常的普适性。", "summary_source": "deepseek", "authors": [{"name": "Makoto R. Kikuchi"}, {"name": "Yuria Kobayashi"}, {"name": "Satoshi Takada"}], "featured_authors": [{"name": "Makoto R. Kikuchi"}, {"name": "Yuria Kobayashi"}, {"name": "Satoshi Takada"}], "author_count": 3}, {"id": "2605.17906", "category": "cond-mat", "title": "Global resetting and emergent correlations: exit statistics in an interval", "abstract": "There is considerable current interest in the emergence of statistical correlations within a population of otherwise non-interacting Brownian particles subject to a common fluctuating environment or drive. Examples include global stochastic resetting, switching confining potentials, fluctuating diffusivities, and stochastically gated boundaries. Most studies have focused on the analytical structure of the stationary joint probability density (assuming it exists). In this paper, we extend previous work on the exit statistics of multiple particles in stochastically gated domains to the case of global resetting in an interval with absorbing boundaries at both ends. First, we use a generalised Itô's lemma to derive a hierarchy of boundary value problems (BVPs) for the joint splitting probability that all particles exit from the same end of the interval. The BVPs form a nested sequence with respect to the initial number of particles $M$. We explicitly solve the BVP for a pair of particles ($M=2$) and use this to illustrate the emergence of pairwise correlations. Second, we show how the BVP for the splitting probability of $M$ Brownian particles can be mapped onto the $M$th order moment equation of a stochastic diffusion equation with resetting. We thus establish a general mathematical framework to study exit problems for globally-driven particle systems.", "url": "https://arxiv.org/abs/2605.17906", "type": "理论", "summary": "1. 该工作研究了全局随机重置下区间内多
