个无相互作用布朗粒子的逃逸统计，并推导了联合分裂概率的边界值问题层次结构。\n2. 其核心在于通过广义伊藤引理获得配对粒子分裂概率的精确解，并揭示出全局重置诱导的粒子间统计相关性。\n3. 这一数学框架将多粒子逃逸问题映射为随机扩散方程的高阶矩方程，为分析全局驱动系统中的涌现关联提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Paul C Bressloff"}], "featured_authors": [{"name": "Paul C Bressloff"}], "author_count": 1}, {"id": "2605.17908", "category": "cond-mat", "title": "Quantum Mpemba effect for operators in open systems", "abstract": "The quantum Mpemba effect concerns with anomalous relaxation of quantum states that evolves either under unitary or non-unitary dynamics. In the context of open quantum systems, while most studies focus on quantum states evolving under completely positive trace-presing dynamics described by the Gorini-Kossakowski-Sudarshan-Lindblad (GKSL) master equation, we demonstrate that an analogous effect can arise at the level of operators. In particular, we show that operators that evolves under the adjoint Liouvillian -- despite not being a trace-preserving map -- can still exhibit a genuine Mpemba effect. We derive general conditions under which this phenomenon can occur and validate our predictions for three different open quantum setups. Our results broaden the scope of the Mpemba effect in quantum systems and provide a framework for controlling the relaxation of physically relevant observables.", "url": "https://arxiv.org/abs/2605.17908", "type": "理论", "summary": "1. 该工作揭示了开放量子系统中算符演化的量子Mpemba效应，即伴随Liouvillian作用下的非保迹算符也可呈现反常弛豫。\n2. 其核心在于推导了该效应发生的一般条件，并在三种具体开放量子设置中验证了理论预言。\n3. 这拓宽了量子Mpemba效应的范畴，并为调控物理可观测量弛豫动力学提供了通用理论框架。", "summary_source": "deepseek", "authors": [{"name": "Pitambar Bagui"}, {"name": "Bijay Kumar Agarwalla"}], "featured_authors": [{"name": "Pitambar Bagui"}, {"name": "Bijay Kumar Agarwalla"}], "author_count": 2}, {"id": "2605.17940", "category": "cond-mat", "title": "Shapiro steps of superfluid Fermi gases in a ring trap across the BCS--BEC crossover", "abstract": "We investigate the transport properties of a superfluid Fermi gas confined in a ring trap with a moving potential barrier across the Bardeen-Cooper-Schrieffer (BCS) to Bose-Einstein condensate (BEC) crossover. Employing time-dependent Bogoliubov--de Gennes (BdG) equations, we simulate the dynamics of a Josephson junction biased by both DC and AC currents. Over a wide range of interaction strengths, we observe clear low-order Shapiro-step plateaus in the barrier-velocity--chemical-potential-diffenrence, within the phase-coherent regime, where the time-averaged chemical potential difference is quantized in units of $\\hbar\\omega/2$. This factor of $1/2$ reflects our convention of defining the chemical potential per single fermion in the BdG framework. Microscopic analysis reveals that these fundamental steps originate from synchronized phase slips mediated by periodic soliton generation at the barrier. Our findings clarify the role of interaction regimes in the nonequilibrium phase dynamics of ring-trapped fermionic superfluids and provide microscopic insights relevant to future studies of atomtronic systems with nontrivial topology.", "url": "https://arxiv.org/abs/2605.17940", "type": "理论+数值", "summary": "1. 该工作利用含时Bogoliubov–de Gennes方程模拟了环阱中移动势垒驱动的超流费米气体约瑟夫森结在BCS–BEC交叉区间的输运动力学。\n2. 其技术要点在于发现相位相干区内势垒速度-化学势差出现低阶Shapiro台阶，时间平均化学势差以ħω/2量子化，并证明该台阶源于势垒处周期性孤子产生引发的同步相位滑移。\n3. 这一发现揭示了相互作用区间对非平衡相位动力学的调控作用，为环状原子电子学系统及拓扑态相关的实验与理论提供了微观见解。", "summary_source": "deepseek", "authors": [{"name": "Hikaru Kuriki"}, {"name": "Masaya Kunimi"}, {"name": "Tetsuro Nikuni"}], "featured_authors": [{"name": "Hikaru Kuriki"}, {"name": "Masaya Kunimi"}, {"name": "Tetsuro Nikuni"}], "author_count": 3}, {"id": "2605.17951", "category": "cond-mat", "title": "Graph-Theoretic Detection of Hilbert Space Fragmentation", "abstract": "Hilbert-space fragmentation provides a mechanism for ergodicity breaking in quantum many-body systems even in the absence of disorder, leading to dynamically disconnected sectors and strong memory of initial conditions. However, identifying such structures is often challenging and typically relies on prior knowledge of conservation laws or model-specific analytical insight. Here we introduce an unbiased approach based on spectral graph theory and, within this framework, formulate the concept of nearly fragmented systems, in which perturbative processes couple otherwise fragmented sectors while preserving their dynamical imprint. By representing basis states as vertices and Hamiltonian matrix elements as edges, we map the connectivity structure of the many-body Hilbert space onto a graph and analyze it using tools such as the Laplacian spectrum, Fiedler vectors, and modularity. Exact fragmentation corresponds to disconnected graph components, while nearly fragmented systems manifest as weakly connected communities whose structure can still be resolved spectrally. Applying this framework to the one-dimensional $t$-$J$ model and its perturbations, we demonstrate that graph-theoretic diagnostics reliably identify both fragmented and nearly fragmented Hilbert-space structures and capture the hierarchy of dynamical time scales that governs the system's evolution. We further show that the method extends beyond kinetically constrained models by applying it directly to the Hubbard chain, where it reveals the emergence of nearly decoupled subspaces associated with doublon dynamics and spin configurations. Our results establish the spectral graph analysis as a general and scalable tool for diagnosing fragmentation and approximate dynamical constraints in complex quantum many-body systems.", "url": "https://arxiv.org/abs/2605.17951", "type": "理论+数值", "summary": "1. 本文基于谱图理论提出一种无偏方法，通过将多体希尔伯特空间映射为图并分析其拉普拉斯谱与模块性，实现精确与近似碎片化结构的自动检测。\n2. 核心卖点在于该方法无需先验守恒律或模型具体知识，即可识别近乎碎片化系统中由弱耦合社群导致的动力学时间尺度层次。\n3. 该图谱诊断框架已成功应用于一维t-J模型及哈伯德链，表明其可作为复杂量子多体系统中碎片化与近似动力学约束的通用可扩展工具。", "summary_source": "deepseek", "authors": [{"name": "A. Rutkowski"}, {"name": "M. Mierzejewski"}, {"name": "J. Herbrych"}], "featured_authors": [{"name": "A. Rutkowski"}, {"name": "M. Mierzejewski"}, {"name": "J. Herbrych"}], "author_count": 3}, {"id": "2605.18002", "category": "cond-mat", "title": "Exact Organization of Density Matrices and Entanglement Structure in the Kitaev Spin Liquid", "abstract": "We give an exact form of the density matrix of the spin-1/2 Kitaev spin liquid represented in terms of spin operators and study the entanglement structures of the Kitaev honeycomb model within the spin framework. We show that the density matrix is naturally organized by equivalence classes of string operators associated with the underlying gauge structure of the model. With the explicit form of the density matrix, plus the exact Gauss law of the emergent gauge theory and the exact 1-form Wilson symmetry in the Kitaev model, we demonstrate the existence of the underlying symmetry-resolved block-diagonal structure of the reduced density matrix, which gives rise to the extensive degeneracy in the entanglement spectrum. The block-diagonal structure is then proven to be responsible for the separability of the entanglement entropy into the gauge and matter parts. Furthermore, we extend the formalism to subsystems with an odd number of lattice sites, revealing a relation between the entanglement spectrum and the fermion parity that is seldom mentioned in the literature.", "url": "https://arxiv.org/abs/2605.18002", "type": "理论+数值", "summary": "1. 该工作给出了自旋1/2 Kitaev自旋液体密度矩阵在自旋算符基下的精确形式，并系统刻画了Kitaev蜂窝模型的纠缠结构。\n2. 其核心在于利用弦算符等价类、精确高斯定律与1-形式Wilson对称性，证明了约化密度矩阵具有对称性分辨的块对角结构，从而解释了纠缠谱的广泛简并及纠缠熵的规范-物质分离。\n3. 这为理解拓扑自旋液体中纠缠的规范对称性起源提供了精确框架，并启示了纠缠谱与费米子宇称的关联可推广至奇数格点子系统。", "summary_source": "deepseek", "authors": [{"name": "Chen-Chih Wang"}, {"name": "Yi-Ping Huang"}, {"name": "Sungkit Yip"}], "featured_authors": [{"name": "Chen-Chih Wang"}, {"name": "Yi-Ping Huang"}, {"name": "Sungkit Yip"}], "author_count": 3}, {"id": "2605.18064", "category": "cond-mat", "title": "Localization Transitions in a Half-Filled Helical Aubry-André Model", "abstract": "We study localization in a one-dimensional quasiperiodic lattice obtained by extending the Aubry-André model with an additional $N$th-neighbor hopping term of strength $J_{N}$. This long-range tunneling couples successive windings of an effective helical chain and introduces a second control parameter beyond the quasiperiodic potential strength $\\Delta$. Working with noninteracting fermions (typically at half filling), we diagnose the delocalization-localization transition using extensions of the modern theory of polarization. Specifically, we compute the polarization amplitudes of the many-body Slater-determinant ground state and construct a geometric Binder cumulant from polarization amplitudes. The critical potential where the localization transition happens is extracted from the sign change (zero crossing) of the geometric Binder cumulant. We map critical potential as a function of $J_N$ and the helical range $N$, finding that stronger helical hopping generally stabilizes the extended phase (shifting critical potential upward), while the $N$-dependence can display pronounced commensurability-induced spikes. We further compare the geometric Binder cumulant with the Fermi gap, which remains near zero at small values of potential and opens in the same parameter regime where the geometric Binder cumulant departs from extended phase. Finally, to take a controlled thermodynamic limit along Fibonacci system sizes, we employ a Zeckendorf-shift construction that fixes the many-body sector consistently as system size goes to infinity.", "url": "https://arxiv.org/abs/2605.18064", "type": "理论", "summary": "1. 该工作通过引入N近邻跳跃项扩展Aubry-André模型，研究半填充非相互作用费米子在螺旋准周期晶格中的去局域化-局域化转变。\n2. 核心创新在于利用现代极化理论构造多体Slater行列式基态的极化振幅，进而定义几何Binder累积量，从符号变化精确提取临界势，并揭示螺旋跳跃强度与作用范围N对扩展相的稳定作用及N依赖的奇偶性尖峰。\n3. 这为准周期系统中长程跳跃调控局域化行为的几何诊断提供了新方法，特别是通过Zeckendorf位移构造在斐波那契尺寸下一致取热力学极限的处理。", "summary_source": "deepseek", "authors": [{"name": "Taylan Yildiz"}, {"name": "B. Tanatar"}, {"name": "Balázs Hetényi"}], "featured_authors": [{"name": "Taylan Yildiz"}, {"name": "B. Tanatar"}, {"name": "Balázs Hetényi"}], "author_count": 3}, {"id": "2605.18121", "category": "cond-mat", "title": "Perturbation Theory of the Free Energy via the Mesoscopic Combined Partition Function", "abstract": "We develop a systematic perturbation theory for the Helmholtz free energy of a classical $N$-body system within the mesoscopic framework of~\\cite{OsanoMeso,OsanoExtensivity}. The combined coarse-graining operator $\\mathcal{C}=\\mathcal{C}_x\\circ\\mathcal{C}_p$ acting on single-particle phase space partitions it into product cells $C_{i,\\alpha}=V_i\\times\\Pi_\\alpha$ and generates a mesoscopic partition function $\\mathcal{Z}_{\\rm meso}(\\lambda)$ whose reference level factorises by the multinomial theorem: $\\mathcal{Z}_{\\rm meso}^{(0)}=(Z_1^{(0)})^N$. Perturbation theory for $\\mathcal{F}_{\\rm meso}(\\lambda)=-k_BT\\ln\\mathcal{Z}_{\\rm meso}(\\lambda)$ in the inter-cell perturbation $\\mathcal{V}_{\\rm meso}$ yields the mesoscopic Gibbs--Bogoliubov inequality and an exact coupling-parameter integration formula. The full free energy satisfies \\begin{equation*} F(\\lambda)=\\mathcal{F}_{\\rm meso}(\\lambda)-k_BT\\!\\sum_{i<j}I(i,j;\\lambda)+O\\!\\left(|\\Lambda|\\ell^{-d}e^{-2\\ell/\\xi}\\right), \\end{equation*} where the inter-cell mutual informations $I(i,j;\\lambda)$ are the corrections identified in the extensivity analysis. The first-order theory recovers the van der Waals equation and the Barker--Henderson result; the second-order term converges to the structure-factor formula in the fine-cell limit. For long-range interactions, factorisation fails, and the mutual-information corrections quantify the resulting non-extensivity.", "url": "https://arxiv.org/abs/2605.18121", "type": "理论", "summary": "1. 该工作基于介观组合配分函数框架，针对经典N体系统建立了亥姆霍兹自由能的系统微扰理论，涵盖全阶修正。\n2. 其技术核心在于用粗粒化算符分割单粒子相空间，借多重定理实现参考态乘积因子化，并以互信息修正精确刻画长程相互作用导致的非广延效应。\n3. 该形式为自由能微扰展开的收敛性分析、结构因子公式的导出及范德瓦尔斯方程的微观基础提供了统一框架，可推广至量子系统。", "summary_source": "deepseek", "authors": [{"name": "Bob Osano"}], "featured_authors": [{"name": "Bob Osano"}], "author_count": 1}, {"id": "2605.18148", "category": "cond-mat", "title": "Taming the 3D Wilson-Fisher Fixed Point via Nonlocal Effective Action", "abstract": "We present a novel Renormalization Group (RG) framework based on a nonlocal effective action ansatz to tame the strong coupling dynamics of the three-dimensional relativistic $\\phi^{4}$ theory. By implementing a Hubbard-Stratonovich transformation, we decouple the quartic interaction into a system of the primary field $\\phi$ and an auxiliary field $\\varphi \\sim \\phi^2$. Rather than freezing the intermediate scaling dimensions, the nonlocality of our effective action allows both exponents $\\Delta_{\\phi}$ and $\\Delta_{\\varphi}$ to act as fully independent, unconstrained dynamical this http URL nonlocal propagator framework plays a critical role in the RG flow: evaluating self-energies and vertex fluctuations up to the three-loop order, the nonlocality drives precise structural cross-cancellations among multi-loop fluctuations near the Gaussian limit. Solving the resulting closed two-variable master equations isolates a robust, non-trivial physical fixed point at $\\Delta_{\\phi}^{*} \\approx 0.981$ and $\\Delta_{\\varphi}^{*} \\approx 0.415$. These dynamic exponents yield a kinematic anomalous dimension $\\eta_{\\phi} \\approx 0.038$, an energy operator dimension $\\Delta_{\\phi^2} \\approx 1.417$, and-via mass deformation-a thermal correlation length exponent $\\nu \\approx 0.6317$, demonstrating exceptional quantitative agreement with high-precision Quantum Monte Carlo (QMC) and conformal bootstrap benchmarks. Our results rigorously confirm that unfreezing the nonlocal degrees of freedom successfully eliminates the systematic truncation errors inherent to conventional local ansatz treatments, simultaneously resolving both the static scaling and thermodynamic flows of the Wilson-Fisher universality class.", "url": "https://arxiv.org/abs/2605.18148", "type": "理论+数值", "summary": "1. 本文提出基于非局域有效作用量的重整化群框架，处理三维相对论性φ⁴理论中Wilson-Fisher不动点的强耦合动力学。\n2. 技术关键在于通过Hubbard-Stratonovich变换引入辅助场并允许两场标度维数自由演化，非局域传播子在三圈阶驱动多圈涨落间的结构交叉抵消，从而消除局域方法截断误差。\n3. 所得固定点指数与量子蒙特卡洛及共形自举高精度吻合，验证了非局域自由度解冻对静态标度和热力学流的统一描述能力，为强关联临界现象研究提供新途径。", "summary_source": "deepseek", "authors": [{"name": "Hyeon Jung Kim"}, {"name": "Seung-Jong Yoo"}, {"name": "Jinmo Bok"}, {"name": "Lemuel John Sese"}, {"name": "Semin Park"}, {"name": "Ki-Seok Kim"}], "featured_authors": [{"name": "Hyeon Jung Kim"}, {"name": "Seung-Jong Yoo"}, {"name": "Jinmo Bok"}, {"name": "Lemuel John Sese"}, {"name": "Semin Park"}, {"name": "Ki-Seok Kim"}], "author_count": 6}, {"id": "2605.18183", "category": "cond-mat", "title": "Characterisation of fire-damaged batteries,implications for recycling", "abstract": "As lithium-ion battery demand grows, so do fire safety challenges. Despite this, research on fire-damaged batteries remains limited. This study explores the distribution of valuable metals (such as Ni, Mn, Co, Cu) in two types of waste derived from lithium-ion nickel-manganese-cobalt oxide batteries (NMC811), black mass (BM) and fire-damaged waste (FD). It emphasizes that cobalt, manganese, and nickel-rich NMC811 particles are predominantly found in smaller particle size fractions (<125 microns), where they can account for up to 85 percent of total metal content. Fire-damaged (FD) batteries show a similar, though less pronounced, trend. Evidence of structural degradation suggests that fire temperatures exceeded 500°C; however, the presence of residual organic binders indicates that heat was unevenly distributed during the fire. FD batteries become friable and easily fragment into fine particles, which can hinder the effective separation of copper and aluminium current collectors, increasing their presence in processed material. The inclusion of FD batteries in standard BM processing introduces variability in output composition, potentially lowering the concentration of high-value NMC811 materials present. To maintain product quality and recycling output values, it is recommended that FD batteries are processed separately. Alternatively, particle size separation may allow for tailored outputs aligned with specific customer requirements.", "url": "https://arxiv.org/abs/2605.18183", "type": "理论", "summary": "1. 该工作系统表征了火灾损坏锂离子电池中镍、锰、钴等有价金属在破碎产物中的分布规律及其结构退化特征。\n2. 其核心发现是火灾导致的不均匀加热（局部超500°C）使电池变脆易碎，细颗粒中NMC811占比可达85%，但阻碍铜铝集流体有效分离。\n3. 这警示需将火灾损坏电池与常规黑粉分开处理，或通过粒径分级实现定制化回收，以维持高价值材料回收率与输出品质。", "summary_source": "deepseek", "authors": [{"name": "Wafaa AlShatty"}, {"name": "Tom Dunlop"}, {"name": "Rhys Charles"}, {"name": "Davide Deganello"}, {"name": "Jenny Baker"}], "featured_authors": [{"name": "Wafaa AlShatty"}, {"name": "Tom Dunlop"}, {"name": "Rhys Charles"}, {"name": "Davide Deganello"}, {"name": "Jenny Baker"}], "author_count": 5}, {"id": "2605.18195", "category": "cond-mat", "title": "High-Density Horizontal Arrays of Single-Chirality Carbon Nanotubes", "abstract": "Highly ordered high-density arrays of single-chirality single-walled carbon nanotubes (SWCNTs) are greatly desired for exploring the intrinsic anisotropic properties and collective performance of such 1-dimensional (1D) nanomaterials. Here we present a Marangoni flow-induced self-assembly (MISA) strategy to fabricate monolayered SWCNT arrays achieving a packing density of ~200 ${\\mu m}^{-1}$ and a 2-dimensional order parameter ($S_{2\\mathrm{D}}$) of ~0.95. Relying on its general compatibility with both organic and aqueous dispersions, we prepare single-chirality and enantiomer-pure SWCNT arrays from organic and aqueous dispersions resulting from the sorting processes. The anisotropic optical and electrical properties of the arrays are demonstrated by the polarization-dependent Rabi splitting as well as polarized near-infrared light emission and detection. With the great tolerance to solutions, substrates, and materials, as well as the feasibility and controllability, MISA shows great potential in the assembly of 1D nanomaterials.", "url": "https://arxiv.org/abs/2605.18195", "type": "理论", "summary": "1. 该工作提出马兰戈尼流诱导自组装策略，实现了堆积密度约200 μm⁻¹、二维有序参数约0.95的单层单壁碳纳米管水平阵列。\n2. 其技术核心在于该策略普适兼容有机与水相分散液，可从分选产物制备单一手性及对映体纯碳纳米管阵列。\n3. 这为利用偏振依赖拉比分裂与近红外光发射/检测探索一维纳米材料本征各向异性与集体性能提供了可控平台。", "summary_source": "deepseek", "authors": [{"name": "Yanzhao Liu"}, {"name": "Zilong Qiu"}, {"name": "Yuguang Chen"}, {"name": "Nie Zhang"}, {"name": "Bing Han"}, {"name": "Huimin Yin"}, {"name": "Bojun Liu"}, {"name": "Min Lyu"}, {"name": "Zhihong Li"}, {"name": "Yiran Ma"}, {"name": "Jian Sheng"}, {"name": "Jiahui Shao"}, {"name": "Zeyao Zhang"}, {"name": "Li Ding"}, {"name": "Hao Hong"}, {"name": "Chuanhong Jin"}, {"name": "Sheng Wang"}, {"name": "Kaihui Liu"}, {"name": "Xiaowei He"}, {"name": "Lian-Mao Peng"}, {"name": "Yan Li"}], "featured_authors": [{"name": "Yanzhao Liu"}, {"name": "Zilong Qiu"}, {"name": "Yuguang Chen"}, {"name": "Xiaowei He"}, {"name": "Lian-Mao Peng"}, {"name": "Yan Li"}], "author_count": 21}, {"id": "2605.18196", "category": "cond-mat", "title": "Localization of a quantum particle in a classical one-component plasma. II. Dynamic Disorder and Temporal Decorrelation", "abstract": "We extend the static theory of disorder-induced exponential decay of the averaged Green function of a quantum charged particle in a classical one-component plasma to the dynamic regime by incorporating the temporal evolution of the ionic density fluctuations within the random phase approximation. The dynamic potential correlator is derived from the fluctuation-dissipation theorem and the Kramers--Kronig relations. Within the eikonal (straight-line) approximation, the effective disorder strength is expressed through the dielectric function of the ion plasma. For particles moving faster than the ion thermal speed, the static Coulomb logarithm is recovered, with the large-distance cutoff replaced by the dynamic scale $v/\\omega_{pi}$. For slow particles, the Coulomb logarithm disappears completely and the disorder strength becomes proportional to the velocity, leading to a fundamentally different scaling of the localization length. In particular, the strong-disorder length diverges as $k^{-1/3}$ for $v\\ll v_{\\mathrm{th}}$, whereas it saturates in the static limit, indicating that ultra-slow particles are not exponentially localized in a dynamic plasma. A crossover between the quasi-static and dynamic regimes occurs when the particle speed becomes comparable to the ion thermal speed.", "url": "https://arxiv.org/abs/2605.18196", "type": "理论", "summary": "1. 该工作将量子粒子在经典单组分等离子体中的无序诱导局域化理论扩展到动态领域，通过随机相位近似计入离子密度涨落的时间演化。\n2. 其核心在于利用涨落-耗散定理与Kramers-Kronig关系导出动态势关联函数，并揭示出慢粒子（速度远小于离子热速度）的局域长度标度由静态饱和转变为k^{-1/3}发散，表明指数局域化在动态等离子体中完全消失。\n3. 这为理解动态等离子体中超慢粒子的输运行为提供了新机制，并提示准静态与动态机制交叉的临界速度（约等于离子热速度）是调控局域化效应的关键。", "summary_source": "deepseek", "authors": [{"name": "Yury A. Budkov"}], "featured_authors": [{"name": "Yury A. Budkov"}], "author_count": 1}, {"id": "2605.18200", "category": "cond-mat", "title": "First-principles investigation of small polarons in rhombohedral NaNbO$_{3}$", "abstract": "Sodium niobate (NaNbO$_{3}$) is a perovskite oxide and a key component of emerging lead-free antiferroelectric capacitors for high-energy-density applications. However, its performance can be hindered by irreversible phase transitions and leakage currents associated with low electrical resistivity. Defect and doping engineering offers a potential way to overcome these problems, but its use requires a detailed understanding of electronic, ionic, and polaron charge-compensation mechanisms, where the role of polarons remains largely unexplored. Here, we investigate the stability of small hole and electron polarons in rhombohedral NaNbO$_{3}$, which is a structurally well-defined model system that avoids lattice-dynamical instabilities. Trapping energies are calculated using density-functional theory corrected by a Hubbard $U$, using the enforced-piecewise-linearity approach including finite-size scaling. For the small hole-polaron centered on O-2$p$ orbital, we find a trapping energy of $-$0.65 (eV) and an adiabatic migration barrier of 0.32 (eV) determined by nudged-elastic-band calculations. In contrast, we show that excess electrons do not self-trap on Nb-4$d$ orbitals, reflecting weak electron-phonon coupling in the conduction band manifold. These results identify oxygen as an intrinsic hole trap in NaNbO$_{3}$ and highlight the importance of including hole polarons in defect models of NaNbO$_{3}$-based electroceramics.", "url": "https://arxiv.org/abs/2605.18200", "type": "理论+数值", "summary": "1. 该工作采用DFT+U及强制分段线性方法，系统计算了菱方相NaNbO₃中小空穴与电子极化子的稳定性。\n2. 其核心在于揭示空穴极化子定域于O-2p轨道（捕获能−0.65 eV、迁移势垒0.32 eV），而额外电子因弱电声耦合不自陷于Nb-4d轨道。\n3. 这表明氧作为本征空穴陷阱需纳入缺陷模型，为理解NaNbO₃基电陶瓷中极化子补偿机制及优化无铅电容器性能提供关键依据。", "summary_source": "deepseek", "authors": [{"name": "Mohammad Amirabbasi"}, {"name": "Lorenzo Villa"}, {"name": "Elaheh Ghorbani"}, {"name": "Jochen Rohrer"}, {"name": "Karsten Albe"}], "featured_authors": [{"name": "Mohammad Amirabbasi"}, {"name": "Lorenzo Villa"}, {"name": "Elaheh Ghorbani"}, {"name": "Jochen Rohrer"}, {"name": "Karsten Albe"}], "author_count": 5}, {"id": "2605.18230", "category": "cond-mat", "title": "Pressure Effects on CeMnSi: Evolution of Ce 4f and Mn 3d Electronic States and Negative Thermal Expansion", "abstract": "We investigated pressure effects on the nontrivial heavy-fermion antiferromagnet CeMnSi by means of electrical resistivity and powder X-ray diffraction. With increasing pressure, the antiferromagnetic order of Mn (T_N ~ 240 K at ambient pressure) is rapidly suppressed and disappears at P_c ~ 1.3 GPa. Instead, a pressure-induced anomaly appears at T_M ~ 97 K and shifts to higher temperatures with increasing pressure. The switching of the Mn magnetic state may reflect a modification of the magnetic symmetry of the system, which could influence the stability of the heavy-fermion state. In the low-pressure region, non-Fermi-liquid-like behavior characterized by nearly T-linear resistivity is observed around 0.7 GPa. In addition, the resistivity shows a marked reduction below T_M and a qualitative change toward more metallic behavior above the structural transition pressure P_s ~ 5.7 GPa. At ambient pressure, CeMnSi exhibits negative thermal expansion below ~40 K, which is absent in LaMnSi, supporting the formation of a heavy-fermion ground state.", "url": "https://arxiv.org/abs/2605.18230", "type": "理论", "summary": "1. 该工作通过高压电阻率和粉末X射线衍射实验，系统研究了CeMnSi中Ce 4f与Mn 3d电子态在压力下的演化及负热膨胀行为。\n2. 其核心物理发现是：Mn反铁磁序在约1.3 GPa被抑制并出现约97 K的新磁异常；约0.7 GPa处呈现电阻率近线性依赖的非费米液体行为；超过约5.7 GPa电阻率骤降并向金属性转变；且常压负热膨胀在LaMnSi中缺失，支持重费米子基态的形成。\n3. 该结果表明Mn磁态切换可调制重费米子基态稳定性，为理解局域磁矩与巡游电子的竞争机制提供了关键实验依据，并启发在压力下探索锰基重费米子体系中的量子相变与有序态竞争。", "summary_source": "deepseek", "authors": [{"name": "Sae Nishiyama"}, {"name": "Haruka Mima"}, {"name": "Jun-ichi Hayashi"}, {"name": "Keiki Takeda"}, {"name": "Chihiro Sekine"}, {"name": "Yoshiya Uwatoko"}, {"name": "Hiroki Takahashi"}, {"name": "Hiroshi Tanida"}, {"name": "Yukihiro Kawamura"}], "featured_authors": [{"name": "Sae Nishiyama"}, {"name": "Haruka Mima"}, {"name": "Jun-ichi Hayashi"}, {"name": "Hiroki Takahashi"}, {"name": "Hiroshi Tanida"}, {"name": "Yukihiro Kawamura"}], "author_count": 9}, {"id": "2605.18242", "category": "cond-mat", "title": "Modulating hydrodynamic flow by modifying the active patch of a colloid", "abstract": "We have developed a simulation model to study the hydrodynamic flow fields around Brownian colloidal particles with an active surface patch. Hydrodynamics is introduced by modeling low-Reynolds-number fluid flows around a colloid using multi-particle collision (MPC) dynamics and allowing momentum exchange between the MPC fluid and the colloid. This approach provides good estimates of both near- and far-field flows around the colloid. The size of the active patch is varied to generate different fluid flow fields around the colloid. In this framework, the fluid in the vicinity of the active patch is driven radially away from (or toward) the surface, and an equal and opposite momentum is imparted to the colloid to ensure momentum conservation. The resulting surface-driven flow generates self-propulsion of the particle, thereby converting an otherwise Brownian colloid into an active Brownian particle. Interestingly, as we systematically vary the surface area of the active patch on the colloid, the nature of the generated flow field changes from that of a pusher to a puller. To model such surface activity-driven flows, we developed a hybrid boundary condition that ensures a no-slip condition while incorporating momentum exchange between the flowing fluid and the colloid surface. This scheme integrates the advantages of bounce-back and stochastic boundary conditions while mitigating their respective limitations. Thus, in future studies, the effective hydrodynamic interactions between an active and a passive colloid, or between two active colloids, can be modulated by adjusting the size of the active patch.", "url": "https://arxiv.org/abs/2605.18242", "type": "理论+数值", "summary": "1. 该工作通过多粒子碰撞动力学模拟，研究了带活性表面斑块的布朗胶体产生的流体动力流场。\n2. 其卖点在于发现活性斑块尺寸的系统变化可使胶体流场从推流体型转变为拉流体型，并开发了整合反弹与随机边界条件的混合边界条件。\n3. 这为通过调节活性斑块尺寸调控活性与被动胶体间的流体动力相互作用，进而设计活性胶体系统提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Om Vandra"}, {"name": "Suhal Siva Ratan T. N."}, {"name": "Hemant Giri"}, {"name": "Manish Modani"}, {"name": "Vijay Chikkadi"}, {"name": "Raghunath Chelakkot"}, {"name": "Apratim Chatterji"}], "featured_authors": [{"name": "Om Vandra"}, {"name": "Suhal Siva Ratan T. N."}, {"name": "Hemant Giri"}, {"name": "Vijay Chikkadi"}, {"name": "Raghunath Chelakkot"}, {"name": "Apratim Chatterji"}], "author_count": 7}, {"id": "2605.18279", "category": "cond-mat", "title": "Coalescence of Polymer Droplets Moving on a Surface with Stiffness Gradient", "abstract": "Here, we study the coalescence of two droplets that are moving in the same direction on a soft surface; the motion of the droplets is caused by a gradient in the surface stiffness. As reference, stationary coalescence of the same droplets is also studied on the corresponding uniform surfaces for different stiffness values. To describe the coalescence phenomenon on a surface with stiffness gradient, a relevant range of velocity ratios of the leading and the trailing droplet was considered to elucidate the effect of this parameter on coalescence. Moreover, to analyze the dynamics of the process, the temporal growth of the bridge height $(h)$ was investigated, which follows a power law $(h \\sim t^{\\alpha})$, before eventually attaining a constant value. The obtained values of $\\alpha$ show a transition from a higher to a lower value as a function of time, pointing to the presence of two distinct power-law growth regimes, where the transition signifies the crossover from the capillarity-dominated regime to the viscoelasticty-dominated regime of coalescence. In addition, varying attractive strengths for droplet--droplet and intra-droplet interactions were considered. The results indicate that both the dynamics and the degree of the coalescence strongly depend on these interaction parameters. Thus, we anticipate that our results will shed more light on the durotaxis-driven coalescence of polymeric droplets for various relevant system parameters, which will have practical implications for applications ranging from microfluidics to ink-jet printing, where substrate properties may vary. In addition, results may add to the fundamental understanding of the interactions among multicellular aggregates moving on biological surfaces.", "url": "https://arxiv.org/abs/2605.18279", "type": "理论", "summary": "1. 该工作实验与理论结合，研究了表面刚度梯度驱动同向运动聚合物液滴的聚结过程，分析了速度比及液滴间/液滴内相互作用强度对动力学的影响。\n2. 核心发现是桥高度增长呈现从毛细管主导到粘弹性主导的两个幂律标度区间，其过渡点及标度指数显著依赖于液滴间与液滴内吸引强度。\n3. 这为可控基质刚度梯度下液滴聚结提供了定量框架，对微流控、喷墨打印中基底非均匀性效应及生物表面多细胞聚集体运动的理解具有启示。", "summary_source": "deepseek", "authors": [{"name": "Divyansh Tripathi"}, {"name": "Vimal Kishore"}, {"name": "Panagiotis E. Theodorakis"}, {"name": "Swarn Lata Singh"}], "featured_authors": [{"name": "Divyansh Tripathi"}, {"name": "Vimal Kishore"}, {"name": "Panagiotis E. Theodorakis"}, {"name": "Swarn Lata Singh"}], "author_count": 4}, {"id": "2605.18297", "category": "cond-mat", "title": "Jones-Roberts solitary waves and the onset of rotation in a spherical surface condensate", "abstract": "The nonlinear excitations underlying the onset of rotation in a dilute Bose-Einstein condensate confined to a thin spherical shell are studied. These excitations correspond to solitary waves rotating about the sphere at constant angular speed: at low speeds they appear as dipoles of singly quantized vortices with opposite circulation, while at higher speeds they evolve into vortex-free Jones-Roberts solitons. With further increase of the angular speed, these excitations hybridize with equatorially confined modes whose azimuthal wave number is set by the sphere radius measured in units of the healing length. The propagation speed of these modes is shown to play the role of a Landau critical velocity, thereby setting the upper limiting angular speed of the entire Jones-Roberts family.", "url": "https://arxiv.org/abs/2605.18297", "type": "理论", "summary": "1. 该工作研究了薄球壳玻色-爱因斯坦凝聚体中与旋转起始相关的非线性激发，分析了Jones-Roberts孤立波从涡旋偶极子到无涡旋孤子的演变。\n2. 核心在于揭示了赤道约束模式的传播速度充当朗道临界速度，从而限定了整个Jones-Roberts族的上限角速度。\n3. 这为理解弯曲几何超流体中旋转动力学与临界现象提供了新视角，并启发相关环形或球面凝聚态系统的理论研究。", "summary_source": "deepseek", "authors": [{"name": "Noel Cuadra"}, {"name": "Thomas Gasenzer"}, {"name": "Davide Proment"}, {"name": "Alberto Villois"}], "featured_authors": [{"name": "Noel Cuadra"}, {"name": "Thomas Gasenzer"}, {"name": "Davide Proment"}, {"name": "Alberto Villois"}], "author_count": 4}, {"id": "2605.18312", "category": "cond-mat", "title": "Energy-Weighted Site Percolation in Two Dimensions", "abstract": "We study a generalization of two-dimensional site percolation by assigning an energy cost $\\varepsilon$ to bonds between nearest-neighbor occupied sites. This leads to a competition between entropy-driven cluster growth and energetic suppression (or enhancement) of connectivity. Varying $\\varepsilon$ continuously interpolates between dense ferromagnetic-like clusters, ordinary classical percolation, and a dilute regime of minimally connected isolated clusters. Using Monte Carlo simulations and real-space renormalization-group (RG) methods, we show that bond energy shifts the percolation threshold smoothly. We define an energy-weighted correlation length that remains finite at the classical site occupation threshold ($p_c(\\varepsilon=0)$) and shrinks with increasing $\\varepsilon$, capturing the energetic suppression of large-scale connectivity. The cluster size distribution exhibits an energy-dependent cutoff that drives the transition from percolation-like clusters to isolated clusters. A real-space RG with Kadanoff block recursions reveals a systematic evolution of the correlation-length exponent $\\nu$ from $\\nu=1/2$ (dense clusters) to $\\nu=4/3$ (classical percolation), approaching $\\nu=1$ (minimally connected isolated clusters), in agreement with Coulomb-gas predictions for loop models where bond energy renormalizes loop fugacity. For large values of \\(\\varepsilon\\) (isotropic case), the suppression of nearest-neighbor bonds results in the emergence of antiferromagnetic sub-lattice ordering at high densities. Additionally, anisotropic bond energies lead to directionally selective cluster growth. Finally, we also discuss a lattice gas RG approach and scenarios where bond energy is renormalized across different scales.", "url": "https://arxiv.org/abs/2605.18312", "type": "理论+数值", "summary": "1. 该工作推广二维格点渗流，为最近邻占据位间键赋能量ε，通过蒙特卡洛与实空间重整化群方法研究熵-能竞争驱动的相变。\n2. 核心在于定义能量加权关联长度，揭示键能连续调节渗流阈值并改变关联长度指数ν从1/2经4/3向1演化，与环模型库仑气体预言一致。\n3. 这为理解各向同性反铁磁子晶格序及各向异性方向选择性团簇生长提供统一框架，启发对竞争作用下临界现象的重整化描述。", "summary_source": "deepseek", "authors": [{"name": "Sayan Sircar"}, {"name": "Kabir Ramola"}], "featured_authors": [{"name": "Sayan Sircar"}, {"name": "Kabir Ramola"}], "author_count": 2}, {"id": "2605.18355", "category": "cond-mat", "title": "Coherent modeling of double-folded ring polymers and their underlying random tree structure", "abstract": "Topologically constrained genome-like polymers often double-fold into tree-like configurations, which can be modelled on the level of folded (ring) polymers or on the level of the underlying random trees. For both descriptions, we have recently obtained expressions for the configurational entropy in ensembles with controlled branching activity. Here we demonstrate that they are equivalent up to a contribution originating from the number of distinct wrappings of a single tree. This allows us to develop a coherent framework for freely switching between the two representations. Importantly, the equivalence extends to interacting systems provided the interactions are treated consistently on the tree and on the ring level. To demonstrate the utility of the scheme, we introduce a generalization of the Amoeba Monte Carlo algorithm capable of generating the required ensembles of trees with fluctuating sizes. While the tree algorithm reproduces results obtained by dynamic simulations of the corresponding ring model, it is $O(N)$ faster for the purpose of sampling static properties and leverages the utility of the ring model for the study of dynamical properties, when used for the preparation of equilibrated starting states.", "url": "https://arxiv.org/abs/2605.18355", "type": "理论+数值", "summary": "1. 该工作建立了双折叠环状聚合物与其底层随机树结构之间的统一描述框架，并证明两者在计入单树缠绕贡献后等价。\n2. 其卖点在于等价性可延伸至相互作用系统，以及推广了能生成大小波动树系综的Amoeba Monte Carlo算法，其静态采样比动态模拟快O(N)倍。\n3. 这为静态与动力学性质的高效研究提供了桥梁，树算法通过快速生成平衡起始态可促进环模型动力学模拟的初始条件制备。", "summary_source": "deepseek", "authors": [{"name": "Pieter H. W. van der Hoek"}, {"name": "Angelo Rosa"}, {"name": "Elham Ghobadpour"}, {"name": "Ralf Everaers"}], "featured_authors": [{"name": "Pieter H. W. van der Hoek"}, {"name": "Angelo Rosa"}, {"name": "Elham Ghobadpour"}, {"name": "Ralf Everaers"}], "author_count": 4}, {"id": "2605.18405", "category": "cond-mat", "title": "A study of the dimer-trimer crossover in a driven three-component Fermi gas", "abstract": "We develop an Effective Field Theory (EFT) for a system with three distinguishable atomic species and present a variational calculation of the two and three-body binding energies in vacuum and in the presence of a single Fermi sea. Specifically, we consider the case where the interaction between first two atomic species is externally driven so as to produce a (non-universal) closed-channel dimer whose coupling can be controlled independently of all other interactions. We then model the remaining interactions as a contact interaction between the dimer and a third atomic species which forms the medium. We derive analytical expressions for the dimer and trimer binding energies in vacuum and in medium, and in the latter case we predict a crossing between the dimer and trimer branches as a function of the atom-dimer scattering length, analogous to the usual polaron and molecule problem. Furthermore, we show that the position of this crossing can be controlled by varying the atom-atom coupling that results from the external drive and we discuss the implications of these findings.", "url": "https://arxiv.org/abs/2605.18405", "type": "理论+数值", "summary": "1. 该工作针对驱动三组分费米气体，发展有效场论并变分计算了真空中及存在单一费米海时二聚体与三聚体的束缚能，预测了分支交叉。\n2. 其核心在于通过外部驱动独立调控闭合通道二聚体耦合，结合原子-二聚体接触相互作用，实现了类似极化子-分子问题的交叉位置可控调节。\n3. 这为在可调少体关联系统中研究量子多体效应提供了理论框架，并启发利用驱动实现交叉行为的实验探索。", "summary_source": "deepseek", "authors": [{"name": "Ronnie Slowinski"}, {"name": "Gaël Servignat"}, {"name": "Frédéric Chevy"}, {"name": "Carlos Lobo"}], "featured_authors": [{"name": "Ronnie Slowinski"}, {"name": "Gaël Servignat"}, {"name": "Frédéric Chevy"}, {"name": "Carlos Lobo"}], "author_count": 4}, {"id": "2605.18411", "category": "cond-mat", "title": "Spin and orbital mixing of edge states in a quantum Hall system proximitized by a superconductor", "abstract": "We investigate the formation and transport properties of chiral Andreev edge states in a two-dimensional quantum Hall system proximitized by a superconductor. By numerically modeling the system using the Bogoliubov-de Gennes equations, we analyze the non-local conductance and transmission probabilities of multimode and spinful systems. We demonstrate that the Andreev reflection process induces a mixing of the quantum Hall edge modes at higher filling factors, a phenomenon strictly prohibited in clean, purely electronic systems. When incorporating the Zeeman interaction, we show that the Andreev edge states split into uncoupled spin species, maintaining spin orthogonality that prevents mixing between opposite spin sectors. Furthermore, we explore the impact of Rashba spin-orbit coupling. While the spin-orbit interaction alone causes slight spin depolarization, its combination with an in-plane magnetic field drives complex spin mixing among all chiral Andreev bands, fundamentally altering the conductance oscillations. Finally, we reveal that the electron transmission probabilities exhibit robust degeneracies, which emerge as a direct consequence of the unitarity constraints and the particle-hole symmetry of the system's scattering matrix in a magnetic field and the presence of spin-orbit interaction.", "url": "https://arxiv.org/abs/2605.18411", "type": "理论+数值", "summary": "1. 该工作通过数值求解Bogoliubov-de Gennes方程，研究了超导体邻近化量子霍尔系统中手性Andreev边缘态的形成及其非局域输运性质。\n2. 其核心在于证明Andreev反射过程可在高填充因子下诱导本禁止的边缘模混合，而Zeeman分裂维持自旋正交性，结合Rashba自旋轨道耦合与面内磁场则驱动复杂自旋混合并改变电导振荡。\n3. 这为理解超导-量子霍尔混合体系中自旋与轨道的协同效应提供了机制性见解，并对基于边缘态的拓扑量子计算器件设计具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "S. Maji"}, {"name": "M. P. Nowak"}], "featured_authors": [{"name": "S. Maji"}, {"name": "M. P. Nowak"}], "author_count": 2}, {"id": "2605.18429", "category": "cond-mat", "title": "Direction-selective triplet pairing and spin-edge locking in altermagnetic metals", "abstract": "We investigate self-consistent unconventional superconductivity in a two-dimensional $d$-wave altermagnetic metal. We find that momentum-dependent altermagnetic spin splitting suppresses opposite-spin singlet pairing and stabilizes highly anisotropic equal-spin triplet order. In the spin-conserving limit, this directional triplet pairing gives rise to nearly dispersionless Majorana boundary states associated with effective one-dimensional topological channels. Rashba spin-orbit coupling mixes spin sectors, activates additional pairing components, and drives the system into a mixed-parity superconducting state with dispersive Majorana boundary states. The spin-resolved boundary spectra further reveal a characteristic locking between boundary orientation and spin polarization, reflecting the underlying altermagnetic symmetry. These results identify altermagnetic spin splitting as an intrinsic mechanism for selecting unconventional pairing and generating spin-resolved Majorana boundary states without external magnetic fields.", "url": "https://arxiv.org/abs/2605.18429", "type": "理论+数值", "summary": "1. 该工作自洽研究了二维d波交变磁金属中的非常规超导，发现动量依赖的自旋分裂显著抑制自旋单态并稳定各向异性等自旋三重态。\n2. 其核心在于交变磁自旋分裂无需外磁场即可产生几乎无色散的Majorana边界态（自旋守恒极限）或经Rashba耦合激活混合宇称后的色散边界态，且边界自旋极化与取向呈特征性锁定。\n3. 这揭示了交变磁体系作为内在配对选择机制和自旋分辨拓扑边界态源的普适性，为无外场驱动的拓扑超导与自旋电子学器件提供了具体实现路径。", "summary_source": "deepseek", "authors": [{"name": "Lie Yuan"}, {"name": "Junkang Huang"}, {"name": "Yu-Xuan Li"}, {"name": "Tao Zhou"}], "featured_authors": [{"name": "Lie Yuan"}, {"name": "Junkang Huang"}, {"name": "Yu-Xuan Li"}, {"name": "Tao Zhou"}], "author_count": 4}, {"id": "2605.18453", "category": "cond-mat", "title": "Frustration from Localized Zhang-Rice States: A Unified Theory of Doping-Driven Magnetic Transitions in Cuprates", "abstract": "The microscopic mechanism by which doped holes disrupt the antiferromagnetic order is one of the fundamental questions in cuprates. In this work, we propose a unified microscopic theory in which doped holes form spatially localized Zhang-Rice singlets which actively mediate emergent spin exchange. Rather than acting as simple non-magnetic vacancies, these localized states introduce emergent next-nearest $J_2$ and third-nearest $J_3$ neighbor superexchanges. This dopant-induced exchange pathway generates significant magnetic frustration, naturally explaining the rapid collapse of the Néel AFM order and the emergence of a spin-glass phase on the hole-doped side. Our findings provide a comprehensive framework for understanding the complex doping-driven magnetic phase transitions and magnetic electron-hole asymmetry in lightly doped cuprates.", "url": "https://arxiv.org/abs/2605.18453", "type": "理论", "summary": "1. 本文提出一个统一微观理论，将掺杂空穴描述为局域化Zhang-Rice单态，该单态主动调控自旋交换作用。\n2. 该理论的核心在于揭示掺杂单态引入次近邻J₂与第三近邻J₃超交换通道，通过产生显著磁阻挫定量解释空穴掺杂侧尼尔反铁磁序的快速塌缩及自旋玻璃相的出现。\n3. 该框架为理解轻掺杂铜氧化物中掺杂驱动的磁相变与磁电子-空穴不对称性提供了自洽的物理图像，并对关联电子体系中阻挫机制的普适性给出启发。", "summary_source": "deepseek", "authors": [{"name": "Xiaodong Wang"}, {"name": "Ping Xu"}, {"name": "Jiong Mei"}, {"name": "Shao-Hang Shi"}, {"name": "Zi-Xiang Li"}, {"name": "Mingpu Qin"}, {"name": "Kun Jiang"}, {"name": "Hui-Ke Jin"}], "featured_authors": [{"name": "Xiaodong Wang"}, {"name": "Ping Xu"}, {"name": "Jiong Mei"}, {"name": "Mingpu Qin"}, {"name": "Kun Jiang"}, {"name": "Hui-Ke Jin"}], "author_count": 8}, {"id": "2605.18575", "category": "cond-mat", "title": "Charge order on a triangular lattice with Mott physics and arbitrary charge density", "abstract": "Triangular-lattice systems attract a lot of attention due to various frustration-induced and strongly correlated effects. Here, we focus on the charge-ordering phenomenon by means of investigation of the extended Hubbard model with dynamical mean-field theory (DMFT). By considering the intersite nearest-neighbor interaction we have found a very rich phase diagram that contains large number of features, phases, and phase transitions. Among them are pinball-liquid (PL) phases where we distinguish charge-transfer-driven and Mott-localization-driven PLs; phase transitions that change their order as model parameters evolve (from discontinuous to continuous); very strong particle-hole asymmetry. Various features of the phase diagram are found to be better understood by means of the simple mean-field approximation (MFA). Moreover, besides helping with interpretation of the phase diagram, the MFA results together with results for the atomic-limit model are found to be able to set rather good expectations on how the DMFT phase diagram should look like. Nevertheless, a few features were not expected and are found within the DMFT, such as a small-region intermediate metallic phase on an electron-doped side of the phase diagram.", "url": "https://arxiv.org/abs/2605.18575", "type": "理论+数值", "summary": "1. 该工作利用动态平均场理论系统研究了三角晶格扩展Hubbard模型中任意电荷密度下的电荷序相图。\n2. 其关键在于区分了电荷转移驱动和Mott局域驱动两类弹球液相，并揭示了相变阶数演化及显著的粒子-空穴不对称性。\n3. 简单平均场近似与原子极限结果可有效预测DMFT相图基本结构，为理解强关联阻挫系统的电荷序提供了简便理论框架。", "summary_source": "deepseek", "authors": [{"name": "Aleksey Alekseev"}, {"name": "Agnieszka Cichy"}, {"name": "Konrad Jerzy Kapcia"}], "featured_authors": [{"name": "Aleksey Alekseev"}, {"name": "Agnieszka Cichy"}, {"name": "Konrad Jerzy Kapcia"}], "author_count": 3}, {"id": "2605.18578", "category": "cond-mat", "title": "A geometry-first tutorial for time-resolved morphological analysis with PyPETANA", "abstract": "We present a step-by-step, reproducible tutorial for PyPETANA, an open-source Python framework for geometry-first, time-resolved quantification of evolving morphology from image data. Starting from time-lapse video input, the tutorial demonstrates how to extract binary masks, compute time-resolved geometric observables including area, perimeter, circularity, and effective fractal dimensions, and analyze their temporal evolution. The workflow emphasizes direct reconstruction of morphology from images without assuming microscopic growth mechanisms. In addition to compactness-sensitive geometric descriptors, the framework supports multiscale boundary analysis through supersampled box-counting methods applied to filled morphologies and finite-width boundary bands. The benchmark suite further demonstrates applicability to invasive tumor morphologies and multiscale boundary evolution in time-resolved cancer-growth interfaces. This tutorial accompanies the computational workflow underlying arXiv:2602.05958 and provides a reproducible foundation for geometry-based analysis of evolving non-equilibrium morphologies.", "url": "https://arxiv.org/abs/2605.18578", "type": "理论+数值", "summary": "1. 该工作提供了一个基于几何优先方法的时间分辨形态分析教程，并开源了PyPETANA框架，用于从图像数据量化演化形态。\n2. 其主要技术卖点在于不依赖微观生长机制假设，直接提取二值掩膜并计算面积、周长、圆度及有效分形维数等可观测量，支持多尺度边界分析。\n3. 这为肿瘤侵袭等非平衡形态的演化研究提供了可重复的几何分析基础，启发了无模型形态动力学的定量框架。", "summary_source": "deepseek", "authors": [{"name": "Benjamin Evert Himberg"}, {"name": "Sanghita Sengupta"}], "featured_authors": [{"name": "Benjamin Evert Himberg"}, {"name": "Sanghita Sengupta"}], "author_count": 2}, {"id": "2605.18689", "category": "cond-mat", "title": "Can machine learning for quantum-gas experiments be explainable?", "abstract": "Virtually all aspects of many-body atomic physics are challenging: experiments are technically demanding, datasets have become enormous, and the memory and CPU requirements for classical simulation of generic quantum systems often scale exponentially with system size. Machine learning (ML) methods are already assisting in each of these areas and are poised to become transformative. Here, we focus on two specific applications of ML to cold-atom-based quantum simulators. These devices generally generate data in the form of images; we first showcase denoising of raw images and then identify solitonic waves in Bose-Einstein condensates. In both of these examples, we comment on the interplay between performance, model complexity, and interpretability.", "url": "https://arxiv.org/abs/2605.18689", "type": "实验", "summary": "1. 该工作针对量子气体实验中的机器学习应用，探讨了图像去噪与玻色-爱因斯坦凝聚体中孤子识别的可解释性问题。\n2. 其核心在于揭示了性能、模型复杂度与可解释性之间的权衡关系，并论证了可解释性对物理洞察的关键作用。\n3. 这为冷原子量子模拟器中机器学习模型的设计指明了方向，促使后续研究在保证性能的同时优先追求可解释性。", "summary_source": "deepseek", "authors": [{"name": "I. B. Spielman amd J. P. Zwolak"}], "featured_authors": [{"name": "I. B. Spielman amd J. P. Zwolak"}], "author_count": 1}, {"id": "2605.16459", "category": "hep-th", "title": "Covariant Holographic Entanglement Entropy Inversion to Reconstruct Bulk Geometry", "abstract": "We present an analytic inversion of covariant holographic entanglement entropy beyond the usual one-function equal-time radial inverse problem, in which one effective radial coefficient remains after the radial gauge and transverse density are fixed. The formula reconstructs the stationary radial block seen by the HRT family, including a nontrivial spatial warp factor and the shift responsible for frame dragging. On a smooth HRT branch, the interval entropy \\(S(\\Delta t,\\Delta x)\\) is an on-shell Hamilton--Jacobi functional: its endpoint derivatives give conserved HRT charges \\(E\\) and \\(J\\), and the ratio \\(\\kappa=E/J\\) labels characteristic leaves. For each fixed \\(\\kappa\\), the entropy defines an Abel reconstruction of a candidate radial block. A single classical radial geometry exists only when the candidates obtained at different \\(\\kappa\\)'s agree as functions of the same radial coordinate. This cross-leaf agreement is the hidden integrability condition of the covariant problem. When it holds, the same data determine the projected bulk light cone, making the frame-dragging profile, cone opening, horizon generator, and ergosurface visible from entanglement. Failure of the condition is not a failure of holography; it means that the HEE cannot be interpreted within the assumed radial HRT reduction without further input, such as branch resolution, transverse-density separation, additional region data, or genuinely time-dependent information. We illustrate the construction with pure AdS, rotating BTZ, a static warped metric, a boosted Einstein--scalar black brane, a higher-dimensional strip degeneracy, and a thin-shell obstruction. The analysis uses the classical HRT area term.", "url": "https://arxiv.org/abs/2605.16459", "type": "理论", "summary": "1. 该工作提出了一种超越等时径向反演的协变全息纠缠熵解析反演方法，用于重建稳态体几何中的径向块结构。\n2. 其核心在于将区间熵视为壳上哈密顿-雅可比泛函，通过守恒电荷比κ标记的不同特征叶的径向块一致性检验，确立协变问题的隐可积性条件。\n3. 跨叶一致性成立时可直接由纠缠数据确定投影体光锥及框架拖拽轮廓；反之则揭示需引入分支分辨或时变信息等额外输入，而非否定全息对偶。", "summary_source": "deepseek", "authors": [{"name": "Ji-Seong Chae"}], "featured_authors": [{"name": "Ji-Seong Chae"}], "author_count": 1}, {"id": "2605.16482", "category": "hep-th", "title": "When Symmetries Twist: Anomaly Inflow on Monodromy Defects", "abstract": "Monodromy defects describe a dynamical termination of topological symmetry operators, and are sourced by a localized background magnetic flux. We study their properties in gapped SPT phases and, by inflow, in gapless theories with an anomalous symmetry. The background flux acts as a source for the anomaly, impacting the definition of the monodromy defect, which can only be defined as a domain wall between the symmetry generator and a topological order induced by the anomaly. The topological dressing has several consequences, such as the presence of protected chiral edge modes on the defect's worldvolume, and the adiabatic pumping of gapless degrees of freedom bound to the localized flux. We verify our predictions in several examples, focusing on monodromy defects for anomalous chiral symmetries, both in the continuum and on the lattice.", "url": "https://arxiv.org/abs/2605.16482", "type": "理论", "summary": "1. 该工作研究了由局域背景磁通驱动的monodromy缺陷在能隙SPT相与反常对称性无能隙理论中的性质。\n2. 其卖点在于揭示了背景通量作为反常源，迫使monodromy缺陷定义为对称生成元与反常诱导拓扑序之间的畴壁，从而产生手征边缘模与绝热泵浦。\n3. 这为拓扑缺陷与手征反常对称性的耦合提供了统一框架，并为连续与格点模型中的反常实现给出明确指导。", "summary_source": "deepseek", "authors": [{"name": "Christian Copetti"}], "featured_authors": [{"name": "Christian Copetti"}], "author_count": 1}, {"id": "2605.16484", "category": "hep-th", "title": "Isolated Critical Points for Scherk-Schwarz Compactifications of M-theory", "abstract": "We consider Scherk-Schwarz compactifications of M-theory (toroidal compactifications with a non-trivial spin structure) in various dimensions and find isolated critical points of the potential on the moduli space. We demonstrate this by identifying the unbroken duality group and finding isolated points on the moduli spaces which are fixed by elements of the unbroken duality group. We work out concrete examples involving compactifications down to $d=8,6, 5$ and $4$ spacetime dimensions. We also conjecture a duality covariant anomaly cancellation condition for M-theory on $T^n$ orbifolded by discrete $\\mathbb Z_N$ symmetries acting as phases on the charge lattice. This anomaly cancellation condition generalizes the level matching requirement for perturbative string orbifolds.", "url": "https://arxiv.org/abs/2605.16484", "type": "理论", "summary": "1. 该工作考察了M理论的Scherk-Schwarz紧化，在不同维度下揭示了模空间势的孤立临界点。\n2. 其核心在于通过识别未破缺对偶群以及在模空间中寻找其固定点来定位这些临界点，并推测了对偶协变的反常抵消条件。\n3. 该条件推广了微扰弦轨形中的level matching要求，为M理论在离散对称性下的紧化提供了关键对偶协变约束。", "summary_source": "deepseek", "authors": [{"name": "Zihni Kaan Baykara"}, {"name": "Shi Chen"}, {"name": "Cumrun Vafa"}], "featured_authors": [{"name": "Zihni Kaan Baykara"}, {"name": "Shi Chen"}, {"name": "Cumrun Vafa"}], "author_count": 3}, {"id": "2605.16497", "category": "hep-th", "title": "5d Trinions and Tetraons", "abstract": "Recently, an atomic classification scheme of 5d SCFTs has been proposed, relying on the identification of indecomposable building blocks that can be fused together to produce large classes of 5d SCFTs. These novel SCFTs are known as bifundamental 5d conformal matter theories, and their fusion produces linear generalized quivers. We generalize such picture employing M-theory geometric engineering to construct trinions and tetraon 5d SCFTs with flavor symmetry of type D. They correspond to non-linear generalized quivers displaying novel patterns of instantonic symmetry enhancement, and their fusion produces singular geometries that often are non-toric non-complete intersections. Finally, within our setup, we rule out trinions and tetraons of type E.", "url": "https://arxiv.org/abs/2605.16497", "type": "理论", "summary": "1. 通过M理论几何工程，该工作构造了具有D型味对称性的trinion与tetraon五维超共形场论。\n2. 其核心在于揭示了非线性广义quiver中新型瞬子对称性增强模式，并排除了E型结构的存在。\n3. 这为五维SCFT分类与融合提供了非环非完全交集奇异性几何的新机制，启发后续全息对偶构造。", "summary_source": "deepseek", "authors": [{"name": "Mario De Marco"}, {"name": "Michele Del Zotto"}, {"name": "Michele Graffeo"}, {"name": "Andrea Sangiovanni"}], "featured_authors": [{"name": "Mario De Marco"}, {"name": "Michele Del Zotto"}, {"name": "Michele Graffeo"}, {"name": "Andrea Sangiovanni"}], "author_count": 4}, {"id": "2605.16507", "category": "hep-th", "title": "Krylov complexity from a simple quantum mechanical model for a radiating black hole", "abstract": "We investigate Krylov complexity in a simple quantum mechanical model describing a black hole coupled to its radiation. The model is constructed as a simplified ``mini-BMN\" matrix system inspired by a recent proposal of Maldacena. Our aim is not to reproduce the full dynamics of the BMN matrix model, but rather to isolate a tractable setting in which the information-theoretic behaviour of a radiating black hole can be studied explicitly. We analyze both the early- and late-time behaviour of Krylov complexity and the associated Krylov entropy. At early times, perturbative and numerical analyses reveal the expected growth characteristic of chaotic quantum dynamics. At late times, however, the dynamics saturates to a plateau, consistent with equilibration between the black hole and its radiation and with general expectations from finite-entropy quantum systems. We argue that this plateau behaviour admits a semiclassical interpretation in terms of Euclidean instanton contributions in an effective path-integral. The toy model studied here offers a controlled framework in which these features can be investigated analytically and numerically.", "url": "https://arxiv.org/abs/2605.16507", "type": "理论", "summary": "1. 该工作在一个描述黑洞与其辐射耦合的简单量子力学模型中，研究了Krylov复杂度及其熵的动力学行为。\n2. 其核心在于揭示了早期混沌增长与晚期平台饱和的完整行为，并将平台机制归因于有效路径积分中的欧几里得瞬子贡献。\n3. 这为在半经典与信息论框架下解析研究辐射黑洞的量子复杂度和熵平衡提供了可控的玩具模型。", "summary_source": "deepseek", "authors": [{"name": "Eric L Graef"}, {"name": "Jeff Murugan"}, {"name": "Horatiu Nastase"}, {"name": "Hendrik J.R. van Zyl"}], "featured_authors": [{"name": "Eric L Graef"}, {"name": "Jeff Murugan"}, {"name": "Horatiu Nastase"}, {"name": "Hendrik J.R. van Zyl"}], "author_count": 4}, {"id": "2605.16521", "category": "hep-th", "title": "Strong-coupling results in (non-)conformal $\\mathcal{N}=2$ theories with fundamental flavors", "abstract": "We study a class of four-dimensional $\\mathcal{N}=2$ SU($N$) gauge theories with two massless hypermultiplets in the rank-two antisymmetric representation and $0\\leq N_f\\leq 4$ fundamental flavors. These theories are superconformal for $N_f=4$ and asymptotically free otherwise. Supersymmetric localization on the four-sphere applies in both cases and leads to matrix-model representations for a broad class of protected observables. Within this framework, we compute the free energy and the expectation value of the $\\frac{1}{2}$-BPS circular Wilson loop in the large-$N$ limit. For any $N_f$, we show that the infinite series of non-planar corrections at large 't Hooft coupling $\\lambda$ can be resummed in terms of an effective coupling $\\widetilde{\\lambda}$. In the non-conformal window ($0\\leq N_f<4$), this provides a first example in which localization leads to explicit results in the planar limit at strong 't Hooft coupling. In the superconformal case ($N_f=4$), the large-$N$ expansion in $\\widetilde{\\lambda}$ suggests a refined AdS/CFT dictionary in which $\\widetilde{\\lambda}$, rather than $\\lambda$, plays the role of the bulk string coupling.", "url": "https://arxiv.org/abs/2605.16521", "type": "理论", "summary": "1. 该工作利用超对称局域化，计算了四维𝒩=2 SU(N)规范理论（含两个反对称超多重态及0≤N_f≤4个基本味）在large-N极限下的自由能与½-BPS圆形Wilson圈期望值。\n2. 其核心在于发现大't Hooft耦合λ下无穷级数非平面修正可重求和为有效耦合λ̃，从而在非共形窗口中首次获得强耦合平面极限的显式局域化解。\n3. 这建议在超共形情形下λ̃而非λ应充当AdS/CFT对偶中的体弦耦合，为完善精确对应提供了关键线索。", "summary_source": "deepseek", "authors": [{"name": "M. Billo"}, {"name": "A. Lerda"}, {"name": "A. Testa"}], "featured_authors": [{"name": "M. Billo"}, {"name": "A. Lerda"}, {"name": "A. Testa"}], "author_count": 3}, {"id": "2605.16587", "category": "hep-th", "title": "3d QFT IR divergences as UV divergences in 4d Holographic Cosmology", "abstract": "In this paper we consider IR divergences in a 3d toy model field theory for 4d holographic cosmology, and we analyze them by introducing a mass term in a way that preserves a certain form of the generalized conformal structure. This allows us to compute 2- and 3-point functions at 2-loops and study their IR structure below the mass scale, from which we argue for a possible IR finiteness beyond perturbation theory, consistent with lattice results. In the holographically dual 4d cosmology, this corresponds to UV finiteness, i.e., the absence of cosmological singularities. The 3d IR field theory methods could be extended beyond this specific application.", "url": "https://arxiv.org/abs/2605.16587", "type": "理论", "summary": "1. 该工作通过引入保持广义共形结构的质量项，系统分析了用于4d全息宇宙学的3d玩具模型场论中的红外发散。\n2. 其技术要点在于计算了二圈二点和三点函数，揭示了质量标度以下的红外结构，并论证了超越微扰论的红外有限性，与格点结果一致。\n3. 这一结果在全息对偶中对应4d宇宙学的紫外有限性（即无宇宙奇点），且所发展的3d红外场论分析方法可推广至其他量子场论体系。", "summary_source": "deepseek", "authors": [{"name": "Matheus Cravo"}, {"name": "Horatiu Nastase"}], "featured_authors": [{"name": "Matheus Cravo"}, {"name": "Horatiu Nastase"}], "author_count": 2}, {"id": "2605.16619", "category": "hep-th", "title": "Evaporating Black Hole Interior and Complexity Evolution", "abstract": "We study the evolution of the interior of an evaporating black hole in a simple model of Jackiw-Teitelboim (JT) gravity with an end-of-the-world (EoW) brane, where evaporation is modeled by entangling the brane's internal states with an auxiliary radiation system. To probe the black hole interior, we consider a geodesic length extracted from a boundary-to-brane two-point function and interpret its renormalised value as a measure of subsystem complexity. Our computation, based on quenched disorder averaging, includes non-perturbative gravitational effects from both spacetime wormholes and replica wormholes, encoding ensemble averaging over the dual random Hamiltonian and brane-state couplings. Unlike non-evaporating black holes where complexity first grows linearly and then plateaus at late times $\\sim{\\cal O}(e^{S_{\\rm BH}})$, we find that complexity evolution of the black hole subsystem in the evaporating case differs drastically, depending nontrivially on the dimension of the emitted radiation Hilbert space. It grows linearly at early times, reaches a maximum at Page time $\\sim{\\cal O}({S_{\\rm BH}})$, and then decays exponentially. We further show that the relative fluctuations of the interior length remain small before the Page time but become of order one and eventually large at later times: this signals a loss of self-averaging, with the ensemble-averaged complexity dominated by rare configurations rather than by typical realisations.", "url": "https://arxiv.org/abs/2605.16619", "type": "理论", "summary": "1. 该工作利用含端世界膜的Jackiw-Teitelboim引力模型研究蒸发黑洞内部复杂度演化，通过边界-膜两点函数中的重正化测地线长度作为子系统复杂性的度量。\n2. 其核心在于发现蒸发黑洞子系统的复杂度在早期线性增长、Page时间达到最大值（量级为黑洞熵）后指数衰减，且涨落增长导致自平均性丧失、系综平均由稀有构型主导。\n3. 这揭示了蒸发过程从根本上改变了黑洞内部复杂度从饱和到衰减的行为，并警示在蒸发后期使用系综平均时需谨慎对待罕见样本的主导作用。", "summary_source": "deepseek", "authors": [{"name": "Nicolò Bragagnolo"}, {"name": "S. Prem Kumar"}], "featured_authors": [{"name": "Nicolò Bragagnolo"}, {"name": "S. Prem Kumar"}], "author_count": 2}, {"id": "2605.16641", "category": "hep-th", "title": "On bulk reconstruction in Lorentzian AdS and its flat space limit", "abstract": "We revisit the reconstruction of a free quantum field in 4-dimensional Lorentzian Anti-de-Sitter (AdS$_4$) spacetime in terms of primary operators in the boundary 3d CFT (CFT$_3$). We show that the positive and negative energy subspaces of solutions to the Klein-Gordon equation in AdS can be spanned with bulk-to-boundary propagators with appropriate time orderings. As a result, free scalar fields on a codimension-1 bulk hypersurface $\\Sigma_{\\tau}$ can be expressed in terms of operators integrated over boundary regions in the past or future of $\\Sigma_{\\tau}$ with kernels given by time-ordered or anti-time-ordered propagators. We present various equivalent representations for the bulk field in terms of either CFT primaries or their shadows. We show from both a representation theoretic perspective and by direct computation of various flat space limits that our construction is the AdS analog of the canonical quantization of a free scalar in flat space. Depending on the choice of $\\Delta$ and the location of the boundary insertions one obtains a decomposition of the scalar in either a plane wave basis ($\\Delta \\rightarrow \\infty$) or a Carrollian basis (fixed $\\Delta$). Finally, we show that the free scalar in AdS$_4$ can be alternatively decomposed in terms of wavefunctions associated with principal series representations of dimension $\\delta = 1 + i\\lambda$ of an $\\mathfrak{so}(3,1)$ subalgebra of the AdS$_4$ isometry algebra. We demonstrate that the latter become, in the limit of large AdS radius and for fixed $\\delta$, scalar conformal primary wavefunctions in flat space.", "url": "https://arxiv.org/abs/2605.16641", "type": "理论", "summary": "1. 该工作重新考察了四维洛伦兹AdS时空中自由标量场基于边界三维CFT初级算符的体重建。\n2. 其技术核心是利用时序与反时序体-边界传播子张成Klein-Gordon方程正负能子空间，从而将体超曲面上场表达为边界区域积分，并明确建立了与平直空间正则量子化的类比。\n3. 该构造随Δ选择分别退化为平面波基（Δ→∞）或Carrollian基（固定Δ），且体场还可通过so(3,1)子代数主序列表示波函数分解，在大AdS半径极限下成为平直空间共形初级波函数。", "summary_source": "deepseek", "authors": [{"name": "Núria Navarro"}, {"name": "Ana-Maria Raclariu"}], "featured_authors": [{"name": "Núria Navarro"}, {"name": "Ana-Maria Raclariu"}], "author_count": 2}, {"id": "2605.16792", "category": "hep-th", "title": "Static electromagnetic Love tensors of 5-dimensional Myers-Perry black holes", "abstract": "We study the separable master equations for the electromagnetic and gravitational perturbations in five-dimensional Myers-Perry black holes. In the static limit, while the master equation for the electric polarization of the Maxwell field reduces to that of a massless scalar field, the magnetic polarization and gravitational perturbation yield Heun equations for both its angular and radial components. Remarkably, these Heun equations fall into a special class that admits exact analytic solutions in terms of hypergeometric functions. We reconstruct the gauge field using master fields and study its asymptotic behavior. When expanding the result in the basis of modified spherical harmonics, we find modes with higher angular momentum arise in response to the excitation of sources with lower angular momentum. The static tidal Love tensor that characterizes such mixing structure of the response can be computed iteratively. We also discuss the possible near zone approximation of the master equations for the magnetic polarization.", "url": "https://arxiv.org/abs/2605.16792", "type": "理论", "summary": "1. 该工作解析求解了五维Myers-Perry黑洞的静态电磁潮汐Love张量，基于电磁与引力微扰的可分离主方程。\n2. 其卖点在于磁极化微扰的Heun方程可精确化为超几何函数，且高阶角动量响应源于低阶源激发，Love张量可迭代计算。\n3. 这为高维黑洞潮汐形变与引力波拟正则模的精确计算提供了直接框架，并可推广至近区近似。", "summary_source": "deepseek", "authors": [{"name": "Boyang Yu"}], "featured_authors": [{"name": "Boyang Yu"}], "author_count": 1}, {"id": "2605.16931", "category": "hep-th", "title": "Nonlinear response of the chiral magnetic effect in the D3/D7 holographic model", "abstract": "We investigate the nonlinear response of the chiral magnetic current to an external magnetic field in a holographic setup. Using the D3/D7 brane system, where the chiral magnetic effect (CME) can be realized by considering rotating probe D7-branes, corresponding to introducing an axial chemical potential, we analyze the current-magnetic field relation beyond the linear regime. Focusing on the vicinity of the phase boundary between the insulating phase and the CME phase, we find that the chiral magnetic current exhibits a multi-valued dependence on the magnetic field, indicating a highly nonlinear response characteristic of this model. We further study the dynamical stability of the insulating phase near the transition point, and show that the presence of both an axial chemical potential and an external magnetic field cooperatively stabilize the system. Our results clarify the interplay between the axial chemical potential and the magnetic field in determining the phase structure and stability of the system, and reveal new nonlinear aspects of chiral transport in holographic gauge theories.", "url": "https://arxiv.org/abs/2605.16931", "type": "理论", "summary": "1. 该工作利用D3/D7全息模型，系统研究了手征磁效应中手征电流对外磁场的非线性响应，聚焦于绝缘相与CME相边界附近的输运行为。\n2. 其核心技术发现是手征电流随磁场呈现多值依赖关系，揭示了体系在强场下的高度非线性响应特征，并表明轴化学势与外磁场共同稳定了绝缘相。\n3. 这为理解全息规范理论中手征反常输运的非线性动力学提供了新视角，并启发对强耦合体系中轴性荷与磁场协同效应的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Masataka Matsumoto"}, {"name": "Mirmani Mirjalali"}, {"name": "Ali Vahedi"}], "featured_authors": [{"name": "Masataka Matsumoto"}, {"name": "Mirmani Mirjalali"}, {"name": "Ali Vahedi"}], "author_count": 3}, {"id": "2605.16942", "category": "hep-th", "title": "Examples of Invertible Gauging via Orbifold Data, Zesting, and Equivariantisation", "abstract": "We study the gauging of invertible symmetries, particularly in 3 dimensions, using equivariantisation, $G$-crossed braided zesting, and the generalised orbifold construction. We discuss how these methods are related and illustrate them in various examples. We cover all $\\mathbb{Z}_2$-symmetries in Dijkgraaf--Witten $\\mathbb{Z}_2$-gauge theory $\\mathcal{D}(\\mathbb{Z}_2)$, the $\\mathbb{Z}_2$-symmetries described by Tambara--Yamagami categories, and obstructions to gauging the central symmetry in Chern--Simons $\\mathrm{SU}(2)_k$-gauge theory. We introduce zested orbifold data for symmetries related by zesting and show that the two associated orbifold data are Morita-equivalent, i.e.\\ they have the same underlying surface defect.", "url": "https://arxiv.org/abs/2605.16942", "type": "理论", "summary": "1. 本文系统研究了三维可逆对称性的规范化方法，阐述了等变化化、G-交叉辫子zesting与广义orbifold构造之间的联系，并在多个模型中予以例证。\n2. 其技术核心在于引入zested orbifold data，证明经zesting关联的两组orbifold data通过Morita等价共享同一表面缺陷，从而统一描述对称性规范化中的障碍结构。\n3. 该工作为拓扑序中对称性操作的分类与构造提供了清晰对偶图景，对理解规范理论中缺陷的等价类及障碍问题具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Benjamin Haake"}], "featured_authors": [{"name": "Benjamin Haake"}], "author_count": 1}, {"id": "2605.17056", "category": "hep-th", "title": "Five legs @ three loops: N=4 sYM amplitude near mass-shell", "abstract": "We present a three-loop analysis of the scattering amplitude of five nearly massless W-bosons in planar maximally supersymmetric Yang-Mills theory. The basis of the master integrals is established, making use of the unitarity-cut sewing technique in six-dimensional N=(1,1) super-Yang-Mills theory. Its dimensional reduction down to four allows us to generate masses for internal and external states. We descend on the special Coulomb branch of maximally supersymmetric Yang-Mills theory by setting all propagator masses to zero. Employing explicit expressions for all integrals that we calculated in a companion paper, we find a concise representation for this infrared-sensitive observable. We confirm its exponentiation, both for infrared and finite terms. The infrared double logarithm manifests the anticipated universality through the octagon anomalous dimension as its governing coefficient. Unlike our previous two-loop result, this consideration reveals that each of the three independent kinematic structures furnishing the amplitude possesses its own function of 't Hooft coupling.", "url": "https://arxiv.org/abs/2605.17056", "type": "理论", "summary": "1. 本文计算了平面N=4超对称杨-米尔斯理论中五近零质量W玻色子散射振幅的三圈修正。\n2. 利用六维N=(1,1)超杨-米尔斯理论幺正割缝技术建立主积分基，通过降维生成内外线质量，并解析计算所有积分，获得红外敏感可观测量之简洁指数化表示。\n3. 结果显示红外双对数由八角反常维度控制其普适性，且三个独立运动学结构各自具有独立‘t Hooft耦合函数，为理解高圈红外结构提供关键启示。", "summary_source": "deepseek", "authors": [{"name": "Andrei V. Belitsky"}, {"name": "Leonid V. Bork"}, {"name": "Roman N. Lee"}, {"name": "Vladimir A. Smirnov"}], "featured_authors": [{"name": "Andrei V. Belitsky"}, {"name": "Leonid V. Bork"}, {"name": "Roman N. Lee"}, {"name": "Vladimir A. Smirnov"}], "author_count": 4}, {"id": "2605.17057", "category": "hep-th", "title": "Five legs @ three loops: slightly off-shell dual conformal integrals", "abstract": "We calculate the three-loop master integrals contributing to the three-loop five-point amplitude on the special Coulomb branch of $\\mathcal{N}=4$ SYM theory. For the genuine pentagon integrals, we follow the approach of Ref. [JHEP 12 (2025) 107], which includes a regularization preserving dual conformal invariance (DCI). As a new ingredient, we introduce a simple method, allowing to factor out the dependence on the DCI cross ratios from the contribution of each region. The remaining integrals are then essentially simplified by taking successive limits of vanishing external invariants. For 3 out of 82 regions contributing to the most complicated integral $\\mathcal{I}_5^{(3)}$ we were not able to perform the integration even after these simplifications. For these three regions, we perform the integration-by-parts (IBP) reduction in parametric representation and evaluate the resulting locally finite integrals using HyperInt.", "url": "https://arxiv.org/abs/2605.17057", "type": "理论", "summary": "1. 该工作计算了N=4 SYM理论特殊Coulomb分支上三圈五点振幅的主积分，其中五边形积分采用保持双共形不变性的正则化处理。\n2. 其卖点在于引入分解双共形交叉比依赖的简单方法，并通过取消失外部不变量极限简化积分，仅三个区域需借助参数表示IBP约化与HyperInt做局域有限积分。\n3. 这为双共形对称理论中高圈散射振幅的解析计算提供了有效方案，尤其适用于复杂五边形积分区域的系统处理。", "summary_source": "deepseek", "authors": [{"name": "Andrei V. Belitsky"}, {"name": "Leonid V. Bork"}, {"name": "Roman N. Lee"}, {"name": "Andrei I. Onishchenko"}, {"name": "Vladimir A. Smirnov"}], "featured_authors": [{"name": "Andrei V. Belitsky"}, {"name": "Leonid V. Bork"}, {"name": "Roman N. Lee"}, {"name": "Andrei I. Onishchenko"}, {"name": "Vladimir A. Smirnov"}], "author_count": 5}, {"id": "2605.17124", "category": "hep-th", "title": "Covariant extrinsic curvature expansion of the nonlocal effective action for a massless scalar field on a manifold with boundary", "abstract": "We study the nonlocal effective action of a massless scalar field defined on a flat manifold with a curved boundary. Using a heat-kernel approach, we derive a covariant expansion of the nonlocal contribution to quadratic order in the extrinsic curvature tensor. Our construction provides a geometric framework that both reproduces earlier results obtained for Monge-patch embeddings and extends them to more general surfaces that need not admit a global Monge-patch description. The expansion is valid in the regime where gradients of the extrinsic curvature dominate over nonlinear curvature effects. As an application, we compute the particle-creation rate for an oscillating deformed ring in $2+1$ dimensions and an oscillating deformed sphere in $3+1$ dimensions.", "url": "https://arxiv.org/abs/2605.17124", "type": "理论", "summary": "1. 该工作利用热核方法推导了平直带边流形上无质量标量场非局域有效作用量在外曲率张量二次阶的协变展开。\n2. 其核心在于建立了一个几何框架，将此前基于Monge-patch嵌入的结果推广至更一般曲面，且展开在外曲率梯度主导非线性曲率效应的区域成立。\n3. 这为计算2+1维振荡变形环与3+1维振荡变形球上的粒子产生率提供了具体应用，并启发更广边界几何下的有效场论研究。", "summary_source": "deepseek", "authors": [{"name": "A. Boasso"}, {"name": "C. D. Fosco"}, {"name": "B. C. Guntsche"}, {"name": "F. D. Mazzitelli"}], "featured_authors": [{"name": "A. Boasso"}, {"name": "C. D. Fosco"}, {"name": "B. C. Guntsche"}, {"name": "F. D. Mazzitelli"}], "author_count": 4}, {"id": "2605.17209", "category": "hep-th", "title": "Emergent AdS Geometry and Black Hole Thermodynamics from Functional Renormalization Group", "abstract": "We present a non-perturbative holographic dual description for the \\(O(N)\\) vector model in \\(d\\)-dimensional Euclidean space within the functional renormalization group (FRG) framework. By continuously iterating Wilsonian RG transformations, the extra-dimensional scale coordinate is identified as the radial direction of an emergent \\((d+1)\\)-dimensional bulk spacetime. We construct a bidirectional holographic dictionary that maps non-perturbative fluctuations directly into the emergent bulk metric warping factors. Under the massless critical configuration, the emergent gravitational vacuum spontaneously organizes into a stable, regular Anti-de Sitter (\\(\\text{AdS}_{d+1}\\)) geometry without coordinate singularities, satisfying all foundational local energy conditions. Near the thermal horizon, by systematically eliminating the conical deficit singularity, we rigorously prove that the semiclassical Hawking temperature identically matches the boundary field theory temperature (\\(T_H \\equiv T\\)). Finally, we show that the near-horizon thermodynamic potentials exactly satisfy the First Law of Black Hole Thermodynamics, spontaneously generating the Bekenstein-Hawking area law (\\(S_{\\text{horizon}} = \\frac{N}{4}\\mathcal{A}\\)) from a first-principles, bottom-up derivation.", "url": "https://arxiv.org/abs/2605.17209", "type": "理论", "summary": "1. 该工作在功能重整化群框架下，为d维欧氏空间O(N)矢量模型构建了非微扰全息对偶描述。\n2. 通过将额外维度标度坐标识别为涌现(d+1)维体时空径向方向，在无质量临界构型下自发生成无坐标奇点的正则AdS_{d+1}几何，并满足所有局域能量条件。\n3. 通过消除热视界处的锥形奇点严格证明半经典霍金温度与边界场论温度一致，并由热力学势自发导出贝肯斯坦-霍金面积律，首次实现从第一原理出发的底向构造。", "summary_source": "deepseek", "authors": [{"name": "Ki-Seok Kim"}], "featured_authors": [{"name": "Ki-Seok Kim"}], "author_count": 1}, {"id": "2605.17215", "category": "hep-th", "title": "Functional Renormalization Group as a Ricci Flow: An $\\mathcal{F}$-Entropy Perspective on Information Metric Dynamics", "abstract": "We establish an equivalence between the Functional Renormalization Group (FRG) and the Ricci flow modified by a diffeomorphism. By reformulating the Polchinski exact renormalization group equation into an infinite-dimensional Fokker-Planck framework, we show that the evolution of the Fisher information metric on the coupling constant space is a geometric optimization process. Central to this mapping is our construction of a field-theoretic $\\mathcal{F}$-entropy functional - an infinite-dimensional analogue of Perelman's $\\mathcal{F}$-entropy functional - which acts as a Lyapunov potential for the theory. We prove that the continuous scale evolution of the field distribution constitutes a Riemannian gradient flow of this $\\mathcal{F}$-entropy, which in turn deforms the information metric on the coupling constant space via the parametric Hessian of the entropic landscape. Crucially, the log of the effective action serves as a scalar potential $\\Phi$ that generates the diffeomorphisms required to ensure the tensorial consistency of the flow. Our framework demonstrates that successive integration of high-energy degrees of freedom effectively smooths out the curvature of the information manifold, driving the system toward a Ricci soliton equilibrium. These results provide a novel foundation for characterizing the stability of RG fixed points and offer a first-principles bridge connecting quantum field theory, information geometry, and Perelman's theory of geometric evolution.", "url": "https://arxiv.org/abs/2605.17215", "type": "理论", "summary": "1. 该工作通过Polchinski精确重整化群方程与无穷维Fokker-Planck框架，建立了泛函重整化群与微分同胚修正Ricci流之间的等价性。\n2. 核心在于构造场论的\\(\\mathcal{F}\\)-熵泛函作为Lyapunov势，证明耦合常数空间上Fisher信息度量的演化构成该熵的黎曼梯度流，其中有效作用量的对数生成确保张量一致性的微分同胚。\n3. 这揭示高能自由度积分平滑信息流形曲率并驱动系统趋向Ricci孤子平衡，为RG不动点稳定性及量子场论、信息几何与Perelman几何演化理论的统一提供第一性原理基础。", "summary_source": "deepseek", "authors": [{"name": "Ki-Seok Kim"}], "featured_authors": [{"name": "Ki-Seok Kim"}], "author_count": 1}, {"id": "2605.17438", "category": "hep-th", "title": "Holographic entanglement entropy in the QCD phase diagram under external magnetic field", "abstract": "In this work, we explore holographic entanglement entropy in the QCD phase diagram under an external magnetic field using an Einstein-Maxwell-dilaton model. We consider both the specious-confinement and deconfined phases. In the perpendicular magnetic field orientation, the strip length shows three distinct branches, and the entanglement entropy develops a swallow-tail structure, indicating a transition between connected and disconnected entanglement surfaces. For the parallel orientation, the behavior is monotonic and no transition occurs. In addition, the difference in entanglement entropy changes smoothly with temperature at small chemical potential, but becomes multivalued at large chemical potential. Increasing the magnetic field restores single-valued behavior. These results are consistent with the black hole thermodynamics and the QCD phase diagram. Our findings show that entanglement entropy can serve as an effective probe of the QCD phase transition.", "url": "https://arxiv.org/abs/2605.17438", "type": "理论", "summary": "1. 该工作利用爱因斯坦-麦克斯韦- dilaton全息模型，计算了外磁场下QCD相图中的纠缠熵，覆盖假禁闭与退禁闭相。\n2. 垂直磁场下条带长度出现三支，纠缠熵呈燕尾结构，标志着连接与断开纠缠面间的转变；平行磁场下行为单调；小化学势时纠缠熵差随温度光滑，大化学势时多值，增大磁场恢复单值。\n3. 结果表明纠缠熵可有效探测QCD相变，其多值行为与黑洞热力学及QCD相图一致，为强相互作用物质的全息诊断提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Man-Man Sun"}, {"name": "Man-Li Tian"}, {"name": "Zhou-Run Zhu"}], "featured_authors": [{"name": "Man-Man Sun"}, {"name": "Man-Li Tian"}, {"name": "Zhou-Run Zhu"}], "author_count": 3}, {"id": "2605.17550", "category": "hep-th", "title": "Krylov Correlators in $\\mathfrak{sl}(2,\\mathbb R)$ Models: Exact Results and Holographic Complexity", "abstract": "In holography, the complexity--momentum correspondence relates the increasing momentum of a point particle falling into an eternal black hole to the rate of growth of the Krylov complexity of the dual boun
