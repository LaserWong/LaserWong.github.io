  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);

    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));

    .eyebrow {

    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }

    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }

    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }

    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2605.30421", "category": "cond-mat", "title": "Topological Phenomena Protected by Diabolical Textures", "abstract": "We present a new class of topological phenomena in inhomogeneous systems arising from the adiabatic spatial embedding of parametrized families of quantum states such as charge pumps and their generalizations. We demonstrate that each topologically distinct class of these \"diabolical textures\" gives rise to distinct gapped states that are separated by \"trap-scaling\" critical points. When the texture varies sufficiently rapidly in space, the critical line terminates abruptly, producing an \"unnecessary critical\" surface. We demonstrate our results using a microscopic model of non-interacting fermions with a spatially embedded Thouless pump. We study its phase diagram comprehensively and establish its stability to arbitrary perturbations, including interactions, in the vicinity of the critical regions. For systems in arbitrary spatial dimensions and global symmetries, we present a framework to systematically classify diabolical textures using Kitaev's $\\Omega$ spectrum conjecture.", "url": "https://arxiv.org/abs/2605.30421", "type": "理论+数值", "summary": "1. 该工作提出了一类由绝热空间嵌入参数化量子态族（如电荷泵）所产生的非均匀系统拓扑现象，即“diabolical textures”保护的新拓扑态。\n2. 其核心在于揭示了拓扑类与“trap-scaling”临界点之间的对应，并发现了高空间梯度下临界线终止形成的“不必要的临界”表面及其对任意扰动的稳定性。\n3. 这为利用Kitaev Ω谱猜想系统分类任意空间维度和全局对称性下的此类拓扑纹理态提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Sayantan Mandal"}, {"name": "Neelima Pulletikurty"}, {"name": "Abhishodh Prakash"}], "featured_authors": [{"name": "Sayantan Mandal"}, {"name": "Neelima Pulletikurty"}, {"name": "Abhishodh Prakash"}], "author_count": 3}, {"id": "2605.30540", "category": "cond-mat", "title": "Entanglement entropy of an acoustic black hole", "abstract": "We introduce a method to numerically compute the entanglement entropy of an acoustic black hole. It is shown that the entanglement entropy of sufficiently large subregions scales linearly with size and thus shows a volume law instead of an area law. The origin of this scaling can be traced back to the non-separable long-distance correlations due to the production of phonon pairs at the horizon. The system is shown to be locally thermal, such that the part of the entanglement entropy scaling with volume is well approximated by the thermal entropy of the outgoing Hawking radiation.", "url": "https://arxiv.org/abs/2605.30540", "type": "理论+数值", "summary": "1. 该工作引入数值方法计算声学黑洞的纠缠熵，发现大子区域的纠缠熵随大小线性增长，呈现体积律而非面积律。\n2. 其物理机制在于视界处声子对产生导致不可分离长程关联，且局域热平衡下体积律部分可近似为出射Hawking辐射的热熵。\n3. 这为理解类比黑洞中纠缠熵与热熵的等价性提供了直接数值证据，并启发对声学黑洞纠缠结构的进一步实验与理论研究。", "summary_source": "deepseek", "authors": [{"name": "P.C. van de Graaf"}, {"name": "H.T.C. Stoof"}], "featured_authors": [{"name": "P.C. van de Graaf"}, {"name": "H.T.C. Stoof"}], "author_count": 2}, {"id": "2605.30682", "category": "cond-mat", "title": "Simulations of dislocation dynamics on an atomic lattice: the effect of collision rules", "abstract": "The stochastic dynamics of dislocations on a one-dimensional periodic lattice domain are considered. Two models are studied: one without a collision rule, and one which annihilates colliding dislocations if they have opposite orientation. The behaviour of both models is investigated by means of a series of numerical simulations exploring the asymptotic behaviour of these models as the number of dislocations increases. From these simulations, evidence is obtained that the discrete model with annihilation tends to a PDE for the dislocation density that accounts for annihilation. However, the discrete model without a collision rule does not appear to exhibit consistent convergence behaviour; instead, it appears that the expected PDE with conserved dislocation density appears in the limit for some parameters, but that for other parameters the density appears to follow to the evolution of the PDE with annihilation. These findings provide evidence that a careful treatment of dislocation collisions is important in discrete dislocation dynamics models.", "url": "https://arxiv.org/abs/2605.30682", "type": "理论+数值", "summary": "1. 该工作通过数值模拟研究了周期性一维原子晶格上两种位错随机动力学模型，对比了有无碰撞湮灭规则对宏观行为的影响。\n2. 其关键发现是：包含湮灭规则的离散模型一致收敛于含湮灭项的密度PDE，而无碰撞规则的模型则不收敛，其密度演化在某些参数下趋向守恒PDE、其他参数下却趋向湮灭PDE，揭示碰撞规则决定了长期动力学定性行为。\n3. 这一结果警示，在构建离散位错动力学模型时必须谨慎处理碰撞规则，否则可能导致连续极限描述的根本性错误，对多尺度位错模拟方法的设计有直接启发意义。", "summary_source": "deepseek", "authors": [{"name": "Tom Hudson"}, {"name": "Akaraphon Jantaraphum"}, {"name": "Patrick van Meurs"}], "featured_authors": [{"name": "Tom Hudson"}, {"name": "Akaraphon Jantaraphum"}, {"name": "Patrick van Meurs"}], "author_count": 3}, {"id": "2605.30704", "category": "cond-mat", "title": "Nonlinear Schrodinger Equations for Dense Bose Fluid and He4 Film at Low Temperatures", "abstract": "We have derived the nonlinear Schrodinger equation generalizing the Gross-Pitaevskii (GP) equa tion for dilute Bose gas. The derivation is based on the Hartree-Fock time-dependent mean-field theory with an arbitrary intermolecular interaction potential. It is shown that obtained nonlinear Schrodinger equation with appropriate redefinition of coefficients can be used for description of dense Bose fluid at low temperatures. We also present the Schrodinger type equation describing the superfluid component of helium in two fluid hydrodynamics. This approach leads to quantum correction for superfluid component of velocity in two fluid hydrodynamics. We also have derived the nonlinear Schrodinger equation for superfluid He4 film at low temperatures. It is shown that this Schrodinger type equation for superfluid He4 film leads to phonon-roton dispersion relation for elementary excitation at low temperatures.", "url": "https://arxiv.org/abs/2605.30704", "type": "理论+数值", "summary": "1. 该工作基于哈特里-福克含时平均场理论，将稀薄玻色气体的Gross-Pitaevskii方程推广至稠密玻色流体和低温超流氦薄膜体系。\n2. 技术关键在于导出含任意分子间相互作用的非线性薛定谔方程，揭示超流二流体模型中速度的量子修正，并预言薄膜元激发的声子-旋子色散关系。\n3. 这为强关联玻色体系及低维超流薄膜的唯象理论提供了统一框架，有望指导超流氦量子效应的实验观测。", "summary_source": "deepseek", "authors": [{"name": "Vladimir I. Kruglov"}], "featured_authors": [{"name": "Vladimir I. Kruglov"}], "author_count": 1}, {"id": "2605.30715", "category": "cond-mat", "title": "Non-Perturbative Renormalization Group for Ising-Nematic Criticality: A Closed-Form Nonlocal Ansatz", "abstract": "The two-dimensional metallic quantum critical problem is a long-standing puzzle that is widely believed to hold the key to resolving ubiquitous non-Fermi liquid behavior in strongly correlated electronic systems. In this study, we present a non-perturbative renormalization group (RG) analysis of the metallic Ising-nematic quantum critical point in two dimensions, formulated directly around an intrinsically nonlocal infrared (IR) boson propagator. Rather than treating the anomalous dynamical critical exponent $a$ as a fixed phenomenological parameter, we regard it as an intrinsic component of the fixed-point data to be determined from the internal consistency of the low-energy patch field theory under highly anisotropic scaling dimensions ($[k_0]=a+1$, $[k_x]=2$, $[k_y]=1$). While the leading two-loop diagrammatics vanish identically due to kinematic pole configurations, our three-loop evaluation reveals a profound structural asymmetry between the sectors: the fermion self-energy and Yukawa vertex receive non-vanishing logarithmic corrections, whereas the corresponding bosonic counter-term remains strictly zero. Consequently, we find that no self-consistent, intersecting fixed-point solution for the exponent $a$ exists within the three-loop truncation, failing to reproduce the physical value of $a \\approx 1.85$ observed in quantum Monte Carlo simulations. We conjecture that the cross-linked topology of the four-loop boson self-energy diagrams is exactly marginal and yields the minimal, mandatory bosonic counter-term required to restore multi-sector self-consistency. Our framework establishes a rigid multi-loop matching scheme necessary to uniquely pin down the critical exponent, and uncovers a stable phase space for field anomalous dimensions.", "url": "https://arxiv.org/abs/2605.30715", "type": "理论+数值", "summary": "1. 该工作对二维金属伊辛向列量子临界点实施非微扰重整化群分析，基于封闭形式非局域红外玻色子传播子，将反常动力学临界指数a作为固定点内禀参量在高度各向异性标度下自洽确定。\n2. 其核心发现是两圈费曼图因运动学极点对消为零，三圈计算揭示费米子自能和顶点获非零对数修正而玻色子抵消项严格为零，导致三圈截断下无法复现蒙特卡洛模拟值a≈1.85，并推测四圈玻色子自能图呈精确边缘性以提供最小必要抵消。\n3. 该框架建立了刚性多圈匹配方案以唯一确定临界指数，并揭示了场反常维度的稳定相空间，为解析解析非费米液体行为与高阶图算自洽性提供了必要理论约束。", "summary_source": "deepseek", "authors": [{"name": "Hyeon Jung Kim"}, {"name": "Kyoung-Min Kim"}, {"name": "Ki-Seok Kim"}], "featured_authors": [{"name": "Hyeon Jung Kim"}, {"name": "Kyoung-Min Kim"}, {"name": "Ki-Seok Kim"}], "author_count": 3}, {"id": "2605.30735", "category": "cond-mat", "title": "Tensor gradient flow for rod-like liquid crystals from molecular model with closure approximation by quasi-entropy", "abstract": "In tensor dynamics for liquid crystals derived from molecular models, a common problem is closure approximation. For rod-like molecules, the Bingham closure has proved to outperform other methods because it inherits the gradient flow structure of the molecular model, but is difficult to achieve efficient computations maintaining the gradient flow structure. We propose a closure approximation by the quasi-entropy that has been successfully applied to the free energy, based on which we construct the tensor gradient flow. The quasi-entropy closure has the same symmetry properties as the Bingham closure. The resulting tensor gradient flow is able to constrain the eigenvalues of the tensor within the physical range, guaranteeing the positive definiteness of the dissipation operator given by the higher-order tensors. The quasi-entropy closure is easy to implement since it can be reduced to minimizing an elementary function of three variables. As a result, we construct a numerical scheme preserving the eigenvalue constraints and energy dissipation, with the closure approximation decoupled from solving the scheme. Numerical simulations are carried out for the interface between the isotropic and the uniaxial nematic phase, as well as the defect evolutions, where the higher-order tensors indeed make a difference.", "url": "https://arxiv.org/abs/2605.30735", "type": "理论+数值", "summary": "1. 该工作针对棒状液晶分子模型中的闭包问题，提出了基于准熵的闭包近似并构建了相应的张量梯度流。\n2. 技术关键在于准熵闭包继承了Bingham闭包的对称性，能约束张量特征值处于物理范围并保证耗散算子正定性，且简化为一三元函数极小化问题。\n3. 这实现了闭包近似与数值求解的解耦，为模拟各向同性-向列相界面及缺陷演化等高阶张量效应显著的液晶动力学提供了有效途径。", "summary_source": "deepseek", "authors": [{"name": "Yongyong Cai"}, {"name": "Jie Xu"}, {"name": "Haixin Zhang"}], "featured_authors": [{"name": "Yongyong Cai"}, {"name": "Jie Xu"}, {"name": "Haixin Zhang"}], "author_count": 3}, {"id": "2605.30743", "category": "cond-mat", "title": "A Padding Method for Enhanced Encoding of Inorganic Structures with Varying Chemical Compositions", "abstract": "Designing novel inorganic materials through generative models remains an important challenge for material science, driven by the complexity and diversity of inorganic structures across expansive chemical compositions and structural landscape. The vast combinatorial space of inorganic compounds demands innovative, AI-driven approaches to overcome limitations in generative accuracy and efficiency. To address this, we introduce a novel method that redefines the encoding and generation of inorganic materials by utilizing domain-specific symmetry-aware representation. Our approach not only refines the representation of intricate inorganic structures but also contributes to the field of material discovery by enhancing the precision and stability of generated candidates. Central to our methodology is a novel padding technique that exploits crystal symmetry information to enhance the encoding process. By integrating Wyckoff position length-aware padding into an encoder architecture, we achieve a more robust informed representation of inorganic materials. This symmetry-driven enhancement improves deep learning models to generate stable, previously unexplored inorganic structures with superior accuracy and computational efficiency. Furthermore, we introduce an end-to-end system that leverages the machine learning potential models to seamlessly generate novel, even those unseen in the training data, and stable inorganic materials from initial data to validated output. This pipeline integrates advanced generative models with stability analysis, marking a significant leap forward in the automated exploration and design of next-generation inorganic materials. Our method improved reconstruction accuracy 5.3% in proton conductor data, and generated 63.5% more novel stable inorganic material to baseline model on the perov-5 dataset.", "url": "https://arxiv.org/abs/2605.30743", "type": "理论+数值", "summary": "1. 该工作提出一种利用Wychoff位置长度感知填充的编码方法，通过引入晶体对称性信息增强对复杂无机结构的表示能力。\n2. 其技术核心在于将对称性驱动的填充技术融入编码器架构，在质子导体数据集上提升重建精度5.3%，在perov-5数据集上生成63.5%更多新颖稳定无机材料。\n3. 这为深度学习模型实现对化学组分与结构空间的可控生成提供了新路径，有望推动无机材料的高通量自动化发现与设计。", "summary_source": "deepseek", "authors": [{"name": "Thang Dang"}, {"name": "Haderbache Amir"}, {"name": "Tzanakakis Alexandros"}, {"name": "Yoshimoto Yuta"}], "featured_authors": [{"name": "Thang Dang"}, {"name": "Haderbache Amir"}, {"name": "Tzanakakis Alexandros"}, {"name": "Yoshimoto Yuta"}], "author_count": 4}, {"id": "2605.30746", "category": "cond-mat", "title": "Superconductor-\"Metal\" Transition of One-dimensional Interacting Bosons with Ohmic Quantum Dissipation", "abstract": "The phase diagram of a system of interacting bosons (Cooper pairs) hoping on a one-dimensional (1D) lattice with onsite phase dissipation describing the Josephson tunneling to a nearby diffusive normal-metal electrode is studied. Starting from the system at commensurate lattice filling, it is shown by a combination of analytical techniques that the phase diagram contains two quantum phases: A dissipative Bose-Einstein condensate (D-BEC) or superconductor with long-range phase coherence, and a dissipative Mott insulator (D-Mott) or \"metal\" with exponentially decaying phase correlations in space and local imaginary-time correlations decaying as the local pairing correlations of the electrode. The D-Mott/metal phase can be described as a 1D array of dissipative boson puddles, weakly coupled by Josephson tunneling. The puddle size roughly corresponds to the length scale beyond which phase slips suppress phase coherence. The dissipative time-dependent Ginsburg-Landau theory phenomenologically used by Sachdev, Werner, and Troyer [Phys. Rev. Lett. {\\bf 92} 237003 (2004)] for the superconductor-metal transition in quasi-1D wires is derived from this microscopic puddle picture. Thus, the criticality of the D-Mott/D-BEC transition is shown to belong to the Wilson-Fisher universality class with dynamical exponent $z\\approx 2$. At small doping, the D-Mott/metal phase remains stable due to its finite compressibility, which is computed to leading order in a perturbation expansion of the dissipation strength and the inter-puddle Josephson coupling. At larger doping, using a mapping to a pseudospin chain combined with bosonization, the D-BEC/superconductor phase is the ground state for non-vanishing but arbitrarily small dissipation. Similarities and differences with deconfinement transition of an array 1D bosonic Mott insulators in anisotropic optical lattices are also discussed.", "url": "https://arxiv.org/abs/2605.30746", "type": "理论+数值", "summary": "1. 该工作通过解析分析研究了一维晶格上相互作用玻色子与欧姆耗散耦合的相图，揭示了耗散超导相与耗散莫特绝缘体/“金属”相之间的量子相变。\n2. 其核心在于从耗散玻色子液滴图景出发，推导出唯象耗散含时金兹堡-朗道理论，并证明该相变属于Wilson-Fisher普适类且动力学指数z≈2。\n3. 这为准一维超导-金属转变的临界行为提供了微观基础，并启发了与光晶格中一维玻色子阵列去禁闭相变的类比。", "summary_source": "deepseek", "authors": [{"name": "Miguel A. Cazalilla"}], "featured_authors": [{"name": "Miguel A. Cazalilla"}], "author_count": 1}, {"id": "2605.30751", "category": "cond-mat", "title": "Defect-engineered scaling of lead-free ferroelectrics with ultralow-voltage switching", "abstract": "Scaling ferroelectrics to nanometer thicknesses remains a central challenge for low-power, nonvolatile electronics, as leakage currents increasingly dominate with reduced dimensions. Alkali-based, lead-free ferroelectrics offer an environmentally sustainable alternative to lead-based systems, yet their scaling is severely limited by leakage arising from volatile alkali constituents. Here, we show that this intrinsic limitation can be transformed into an advantageous degree of freedom through defect engineering. By precisely modulating alkali deficiency during thin-film synthesis, we engineer clustered defect complexes that function as deep trap states, strongly suppressing leakage and enabling robust ferroelectric operation in ultrathin films down to the sub-10 nm regime at voltages below 100 mV. Our results establish defect-enabled scaling as a viable pathway for advancing environmentally benign ferroelectrics toward ultra-low-power, non-volatile electronic technologies.", "url": "https://arxiv.org/abs/2605.30751", "type": "理论", "summary": "1. 该工作通过缺陷工程调控碱金属缺失，在无铅铁电薄膜中实现亚10纳米厚度下的亚100毫伏超低电压开关。\n2. 其核心在于利用碱金属缺失诱导的深陷阱缺陷复合体抑制漏电流，将本征材料局限转化为可调自由度。\n3. 这为环境友好型铁电体在超低功耗非易失性电子器件中的可扩展应用提供了缺陷使能的物理路径。", "summary_source": "deepseek", "authors": [{"name": "Reza Ghanbari"}, {"name": "Jiayue Wang"}, {"name": "Harikrishnan KP"}, {"name": "Zixiao Shi"}, {"name": "Aarushi Khandelwal"}, {"name": "Konnor Koons"}, {"name": "Eli Rodrigues"}, {"name": "Tao Zhou"}, {"name": "Martin Holt"}, {"name": "David A. Muller"}, {"name": "Harold Y. Hwang"}, {"name": "Ruijuan Xu"}], "featured_authors": [{"name": "Reza Ghanbari"}, {"name": "Jiayue Wang"}, {"name": "Harikrishnan KP"}, {"name": "David A. Muller"}, {"name": "Harold Y. Hwang"}, {"name": "Ruijuan Xu"}], "author_count": 12}, {"id": "2605.30764", "category": "cond-mat", "title": "Crystal Dislocations as Atomic Scale Ratchets", "abstract": "The symmetry of a system's response to external stimuli is a fundamental concept in physics and materials science. At the microscopic scale, breaking this symmetry to achieve a rectified response is exceptionally difficult to engineer and remains rare in nature. Conventional micromechanics models of crystalline solids assume a symmetric response to applied stress, where reversing the load simply inverts the direction of defect velocity without altering its magnitude. In this work, we report an atomic-scale, geometry-rooted mechanism that breaks this symmetry. Molecular dynamics simulations of face-centered cubic nickel reveal that dislocations containing atomic-scale jogs exhibit asymmetric mobility under opposite applied stresses, reversing the loading direction triggers significantly higher drag. This asymmetry arises from an unconventional coupling between an atomic displacement vector and the second-order tensorial eigenstrain of the jog motion mechanism. Because jogs are ubiquitous structures in plastic deformation, this discovery challenges classical descriptions of plastic deformation mechanisms, with direct implications to cyclic creep, and opens new pathways for defect engineering to enhance fatigue resistance.", "url": "https://arxiv.org/abs/2605.30764", "type": "理论+数值", "summary": "1. 该工作通过分子动力学模拟，报告了面心立方镍中原子尺度割阶导致位错在反向应力下呈现非对称迁移率的棘轮效应。\n2. 其物理核心在于揭示了原子位移矢量与割阶运动二阶张量本征应变的非常规耦合，从而打破了经典微力学模型的对称响应假设。\n3. 这一发现挑战了传统塑性变形理论，对循环蠕变机制提供了新理解，并为通过缺陷工程提升材料疲劳抗力开辟了路径。", "summary_source": "deepseek", "authors": [{"name": "Wu-Rong Jian"}, {"name": "Yifan Wang"}, {"name": "Wei Cai"}], "featured_authors": [{"name": "Wu-Rong Jian"}, {"name": "Yifan Wang"}, {"name": "Wei Cai"}], "author_count": 3}, {"id": "2605.30773", "category": "cond-mat", "title": "Saturated and Anisotropic Magnetostriction in an Altermagnet", "abstract": "Magnetostriction, a fundamental phenomenon bridging magnetism and mechanics, has enabled a broad spectrum of applications. For almost two centuries, it has been mainly investigated for ferromagnets. Regarding the magnetostriction of antiferromagnets (AFMs), limitedly known examples for both conventional collinear AFMs and noncollinear AFMs predominantly exhibit non-saturating magnetic-field dependence. Herein, we report an easily saturated magnetostriction effect in a prototypical altermagnet - MnTe, which is an emerging class of collinear AFMs with special crystal symmetries. For high-quality MnTe single crystals, the magnetostriction saturates under a moderate field of ~0.7 T with an intriguing two-fold-symmetry anisotropy. First-principles calculations reveal that the saturated and anisotropic magnetostriction originates from symmetry-allowed coupling between elastic strain and its Néel order parameter. These findings break the traditional wisdom on antiferromagnetic magnetostriction.", "url": "https://arxiv.org/abs/2605.30773", "type": "理论+数值", "summary": "1. 该工作报道了在交替磁体MnTe单晶中观测到易饱和且各向异性的磁致伸缩效应。\n2. 其关键发现在于约0.7特斯拉的低场下即可饱和，且呈现独特的二重对称性各向异性，打破了反铁磁磁致伸缩通常不饱和的传统认知。\n3. 这为理解交替磁体中弹性应变与Néel序参量的对称性允许耦合提供了直接证据，并启发了相关磁-力耦合器件的研究。", "summary_source": "deepseek", "authors": [{"name": "Zhiyuan Duan"}, {"name": "Qiyun Xu"}, {"name": "Peixin Qin"}, {"name": "Li Liu"}, {"name": "Guojian Zhao"}, {"name": "Yuzhou He"}, {"name": "Xiaoyang Tan"}, {"name": "Sixu Jiang"}, {"name": "Jingyu Li"}, {"name": "Xiaoning Wang"}, {"name": "Qinghua Zhang"}, {"name": "Wenhui Duan"}, {"name": "Yong Xu"}, {"name": "Ziang Meng"}, {"name": "Peizhe Tang"}, {"name": "Chengbao Jiang"}, {"name": "Zhiqi Liu"}], "featured_authors": [{"name": "Zhiyuan Duan"}, {"name": "Qiyun Xu"}, {"name": "Peixin Qin"}, {"name": "Peizhe Tang"}, {"name": "Chengbao Jiang"}, {"name": "Zhiqi Liu"}], "author_count": 17}, {"id": "2605.30868", "category": "cond-mat", "title": "Living Helices in Fluctuating Polymer Chains: Cooperative Nucleation, Dynamics, and Lifetime", "abstract": "Helical segments in polymer chains are often transient, finite, and dynamically evolving, yet their origin and stability remain incompletely understood. Here we develop a minimal coarse-grained statistical-mechanical theory that explains how such living helices emerge in fluctuating polymer systems. Using a three-state model with cooperative interactions, we show that helix formation proceeds through a multistep nucleation mechanism. An initial constrained pre-nucleus forms first, followed by cooperative stabilization that promotes the growth of finite helical segments. The resulting free-energy landscape naturally favors marginally stable helices whose size is determined by a competition between cooperative gains and nonlinear penalties arising from stiffness, torsional strain, and solvent fluctuations. By formulating the dynamics as a stochastic process in segment size, we derive analytical expressions for both formation times and lifetimes within a mean first-passage framework. For representative parameters relevant to flexible polymers and peptide segments, the theory predicts characteristic timescales in the nanosecond to sub-microsecond range. The present analysis supports a view of living helices as finite, mobile excitations whose stability is controlled by cooperativity, boundary motion, and solvent-induced fluctuations.", "url": "https://arxiv.org/abs/2605.30868", "type": "理论", "summary": "1. 该工作建立了描述柔性聚合物链中瞬态螺旋片段的粗粒化统计力学理论，基于三态模型与协同相互作用揭示了其成核、动力学与寿命。\n2. 核心卖点在于阐明了螺旋形成经历约束预成核与协同稳定化的多步机制，并通过平均首通时间框架解析给出了形成时间与寿命的标度律。\n3. 这一理论将可调螺旋视为受协同增益、刚度与溶剂涨落共同控制的有限移动激发，为理解生物大分子中瞬态有序结构的稳定与演化提供了定量框架。", "summary_source": "deepseek", "authors": [{"name": "Biman Bagchi"}], "featured_authors": [{"name": "Biman Bagchi"}], "author_count": 1}, {"id": "2605.30881", "category": "cond-mat", "title": "Spin Hall effect in two-dimensional materials with inverted bands and Mexican-hat dispersion", "abstract": "We study the spin Hall effect in two-dimensional topological insulators with \"Mexican hat\" dispersion and a ring-shaped Fermi surface which are formed due to the band inversion. Electron transitions between different isoenergetic contours and the quantum metric of band states play an important role in the transport properties of such materials, since they largely determine the spatial distribution of the electron charges screening the impurity potential and the scattering probability [Phys.B, 719, 417942 (2025)]. Here we study a spin-dependent skew scattering, which is enabled by the second-order scattering processes, and show that the extrinsic spin-Hall current (SHC) can significantly exceed the intrinsic SHC arising from the Berry curvature. Furthermore, due to Mexican-hat dispersion, the SHC exhibits a very unusual dependence on the Fermi energy ($E_F$). The extrinsic SHC reaches a maximum at some $E_F$, then decreases with increasing $E_F$ and can even change a sign. This complicated behavior reflects an interplay of energy dependencies of such important factors as probabilities of inter- and intra-contour transitions, as well as different electron velocities in two contours.", "url": "https://arxiv.org/abs/2605.30881", "type": "理论", "summary": "1. 该工作理论研究了具有倒带形成的墨西哥帽色散和环形费米面的二维拓扑绝缘体中的自旋霍尔效应，重点分析了自旋依赖二阶斜散射对外禀自旋霍尔电流的贡献。\n2. 其核心发现在于外禀自旋霍尔电流可显著超过由贝里曲率产生的内禀贡献，且因墨西哥帽色散导致电流随费米能量呈非单调变化，包括极大值和符号反转，反映轮廓间跃迁概率与电子速度的竞争。\n3. 这揭示了量子度量与带拓扑在输运中的耦合效应，为通过能带工程调控自旋霍尔效应的幅度与符号提供了新机制，并启发对类似色散系统中外禀输运行为的深入探索。", "summary_source": "deepseek", "authors": [{"name": "Bagun S. Shchamkhalova"}, {"name": "Vladimir A. Sablikov"}], "featured_authors": [{"name": "Bagun S. Shchamkhalova"}, {"name": "Vladimir A. Sablikov"}], "author_count": 2}, {"id": "2605.30887", "category": "cond-mat", "title": "Activity-Enhanced Ordering in Fluctuation-Induced First-Order Transitions", "abstract": "Fluctuations can drive otherwise continuous phase transitions to first order through the Brazovskii mechanism. We study how these fluctuation-induced transitions are modified in active systems by introducing nonequilibrium spatiotemporally correlated noise. We show that, while the transition remains fluctuation-induced first order, activity systematically suppresses these fluctuation effects, shifting the transition to higher temperatures and rendering it increasingly weakly first order. As a result, ordering is enhanced without inducing a spinodal instability of the isotropic phase, as confirmed by direct numerical simulations. In the strong-activity limit, fluctuation effects disappear and mean-field behavior is recovered. Our results identify activity as a generic control parameter for tuning the strength of fluctuation-induced first-order transitions.", "url": "https://arxiv.org/abs/2605.30887", "type": "理论+数值", "summary": "1. 该工作研究活性系统中非平衡时空关联噪声对涨落诱导一级相变的调控作用。\n2. 其核心发现是活性抑制涨落效应，使转变温度提高、一级相变减弱，强活性下恢复平均场行为，且不引发各向同性相失稳。\n3. 这揭示活性可作为调控涨落诱导一级相变强度的通用物理参数，为理解非平衡有序相变提供新机制。", "summary_source": "deepseek", "authors": [{"name": "Suvendra K. Sahoo"}], "featured_authors": [{"name": "Suvendra K. Sahoo"}], "author_count": 1}, {"id": "2605.30948", "category": "cond-mat", "title": "Competing heterogeneities shape ordering via higher-order interactions", "abstract": "Higher-order interactions admit richer structural heterogeneity than pairwise networks. To understand how heterogeneity impacts collective phenomena we develop a framework based on the cavity method and apply it to the simplicial Ising model on heterogeneous hypergraphs. Unlike in homogeneous structures, group size and node degree play fundamentally different roles: size heterogeneity sharpens the transition via large-group unanimity, while degree heterogeneity softens it as hubs cooperatively seed ordering with non-hubs. Under either type of heterogeneity, continuous--discontinuous double transitions can arise, where the symmetry-breaking continuous transition is driven by pairs or by hubs, respectively. When both heterogeneities coexist, cross-order degree correlations further modulate the phase diagram, with anticorrelation delaying the group-driven discontinuous jump and broadening the hysteretic region. Our results reveal the intricate interplay between size and degree heterogeneities in collective phenomena beyond pairwise interactions.", "url": "https://arxiv.org/abs/2605.30948", "type": "理论+数值", "summary": "1. 该工作基于空腔方法建立了异质超图上单纯Ising模型的理论框架，用以分析高阶相互作用中结构异质性对有序化的影响。\n2. 核心发现是群体大小异质性通过大群体一致锐化连续转变，而度异质性经由枢纽与非枢纽协同软化转变，两者均可诱发连续-不连续双转变，且共存时跨阶度反相关延迟群体驱动的不连续跳变并扩大滞后区。\n3. 该框架为揭示超越成对网络的多体集体现象中不同异质性竞争机制提供了理论基础，并可推广至更复杂超图与实验系统。", "summary_source": "deepseek", "authors": [{"name": "Gangmin Son"}, {"name": "Federico Battiston"}, {"name": "Deok-Sun Lee"}, {"name": "K.-I. Goh"}], "featured_authors": [{"name": "Gangmin Son"}, {"name": "Federico Battiston"}, {"name": "Deok-Sun Lee"}, {"name": "K.-I. Goh"}], "author_count": 4}, {"id": "2605.30978", "category": "cond-mat", "title": "Parity-induced generalized Brillouin zone without non-Hermitian skin effect", "abstract": "Acute spectral sensitivity to boundary conditions and the formation of a generalized Brillouin zone associated with complex quasimomenta are features frequently attributed to systems with non-trivial non-Hermitian topology, showcasing the non-Hermitian skin effect. We show that, away from the thermodynamic limit, these features themselves are not uniquely tied to this phenomenon; they can similarly arise as parity-induced even-odd effects in non-Hermitian systems without skin effect. Despite an underlying generalized Brillouin zone description, wavefunctions remain delocalized. In addition, the effect can arise in skin-effect models as entirely separate distinguishable feature", "url": "https://arxiv.org/abs/2605.30978", "type": "理论", "summary": "1. 该工作证明，在远离热力学极限时，宇称诱导的奇偶效应可在无非厄米趋肤效应的系统中产生广义布里渊区及边界条件敏感谱。\n2. 其关键卖点在于，尽管系统存在广义布里渊区描述，波函数仍保持退局域化，且该效应可与趋肤效应完全独立地共存于同一模型中。\n3. 这揭示了广义布里渊区的形成并非非厄米趋肤效应的必然结果，为区分此类系统不同拓扑现象的物理起源提供了新准则。", "summary_source": "deepseek", "authors": [{"name": "Alexander Felski"}], "featured_authors": [{"name": "Alexander Felski"}], "author_count": 1}, {"id": "2605.30986", "category": "cond-mat", "title": "Dimensionality of a strongly interacting 2D-3D Fermi-Fermi mixture from the perspective of superfluid instability and excitation properties", "abstract": "We theoretically investigate strong-coupling properties of an attractively interacting Fermi atomic gas, where the Cooper-pair formation occurs between atoms belonging to different dimensional bands. Including pairing fluctuations within the framework of the self-consistent $T$-matrix approximation (SCTMA), we examine how the BCS-type superfluid phase transition temperature $T_\\mathrm{c}$ varies as one moves from the 3D-3D to the 2D-3D system, in the wide parameter region with respect to the strength of the pairing interaction. In the 2D-3D limit, we find that, while the mean-field BCS theory predicts $T_\\mathrm{c}>0$ in the strong-coupling regime, $T_\\mathrm{c}$ is remarkably suppressed down to zero by pairing fluctuations that are strongly enhanced by the mixed-dimensionality of the system. As the origin of this, we clarify that the lower-dimensional (2D) component dominates the superfluid instability, so that the vanishing $T_\\mathrm{c}$ is the same phenomenon as that in the 2D-2D case. We also point out that this can already be seen in the mean-field level, when one examines the propagation of the Goldstone mode. On the other hand, we find that the pseudogap phenomenon, which is known as a precursor of Cooper-pair formation, exhibits a 3D character of the 2D-3D system. These results indicate that the dimensionality of a strongly interacting Fermi gas depends on what we observe.", "url": "https://arxiv.org/abs/2605.30986", "type": "理论", "summary": "1. 该工作理论研究了吸引相互作用的二维-三维费米原子气体，通过自洽T矩阵近似分析超流转变温度从三维-三维到二维-三维体系的变化。\n2. 核心发现在于二维组分主导超流不稳定性，其增强的配对涨落使强耦合区的Tc被压制至零，而赝能隙则呈现三维特征。\n3. 这揭示了强相互作用费米气体的维度取决于观测性质，为混合维度超流系统的理论描述与实验探测提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Haruka Takeda"}, {"name": "Saki Hirai"}, {"name": "Shumpei Iwasaki"}, {"name": "Yoji Ohashi"}], "featured_authors": [{"name": "Haruka Takeda"}, {"name": "Saki Hirai"}, {"name": "Shumpei Iwasaki"}, {"name": "Yoji Ohashi"}], "author_count": 4}, {"id": "2605.31037", "category": "cond-mat", "title": "Spin-Spiral Enhancement of Ultrafast Light-Polarization-Robust Magnetization", "abstract": "Ultrafast light-driven magnetization, a frontier in quantum magneto-optics, has traditionally relied on circularly polarized lasers to provide external angular momentum. While increasing efforts have aimed to achieve light-polarization-robust (LPR) magnetization that is insensitive to the form of external light excitation, the underlying mechanism remains largely unclear. Here, we establish the symmetry-constrained rule for LPR magnetization in antiferromagnetic systems. Through real-time time-dependent density functional theory calculations, we observe the strong LPR magnetization in spin-spiral magnets and its suppression in collinear antiferromagnets, confirming our theory. Strikingly, laser excitation induces real-space demagnetization, rotation, and oscillation of atomic spins in spin-spiral monolayer NiI$_2$, whereas rotation is largely suppressed in conventional collinear antiferromagnets. Our work reveals a novel microscopic pathway for ultrafast magnetization that is independent of light polarization, paving the way for advanced femtosecond spin control.", "url": "https://arxiv.org/abs/2605.31037", "type": "理论+数值", "summary": "1. 该工作通过对称性约束规则和实时含时密度泛函理论计算，阐明了反铁磁系统中光偏振鲁棒超快磁化的机制。\n2. 其技术卖点在于发现自旋螺旋磁体（如单层NiI\\(_2\\)）中激光可诱导实空间原子自旋的退磁、旋转和振荡，而共线反铁磁体中旋转被抑制。\n3. 这为不依赖光偏振的飞秒自旋控制路径提供了明确启发，有望推动超快磁光器件的发展。", "summary_source": "deepseek", "authors": [{"name": "Yirui Lu"}, {"name": "Zeyu Jiang"}, {"name": "Bing Huang"}], "featured_authors": [{"name": "Yirui Lu"}, {"name": "Zeyu Jiang"}, {"name": "Bing Huang"}], "author_count": 3}, {"id": "2605.31078", "category": "cond-mat", "title": "Finite-inertia effects in Langevin dynamics of a lopsided elastic dumbbell using exponential-time differencing schemes", "abstract": "Inertia effects in the Langevin dynamics of a lopsided elastic dumbbell are investigated using exponential-time-differencing (ETD) integrators for the corresponding stiff stochastic equations at small mass limit. Starting from the bead-level underdamped Langevin model, we formulate the dynamics in modal coordinates, highlighting two distinct friction scales: an additive friction $\\zeta_{\\rm trans}=\\zeta_1+\\zeta_2$ controlling translation ($\\zeta_i, i=1,2$ are the friction factor on bead $i$), and an effective internal friction $1/\\zeta_{\\rm eff}=1/\\zeta_1+1/\\zeta_2$ controlling configurational relaxation, with relaxation time $\\tau_R=\\zeta_{\\rm eff}/H$ for a Hookean spring of stiffness $H$. We benchmark ETD against Euler--Maruyama and overdamped Brownian dynamics using equilibrium statistics, time-domain autocorrelations, and frequency-domain power spectra of the end-to-end vector. When time is rescaled by $\\tau_R$, configurational and orientational relaxation curves collapse across asymmetry ratios, showing that the dominant long-time structural dynamics remains close to the overdamped description. Inertial signatures are instead confined to short-time transients, high-frequency modifications of the configurational spectrum, and a transient coupling between translational and internal modes. This study provides a practical and accurate route for lopsided dumbbells across overdamped and weakly underdamped regimes, and clarify how mass and friction asymmetry affect the translational and internal dynamics.", "url": "https://arxiv.org/abs/2605.31078", "type": "理论", "summary": "1. 该工作采用指数时间差分（ETD）积分器，从珠子级欠阻尼Langevin模型出发，系统研究了非对称弹性哑铃在小质量极限下的有限惯性效应及其动力学特征。\n2. 其核心物理在于通过模态坐标揭示平移摩擦与有效内摩擦两种尺度分别控制平动与构型弛豫，且证明时间尺度化后长时结构动力学趋近过阻尼描述，惯性仅贡献短时瞬态、高频修正及平动-内模瞬态耦合。\n3. 这为跨过阻尼与弱欠阻尼区域模拟复杂非对称软物质系统提供了高效精确的数值路径，并阐明摩擦与质量不对称如何分别影响平移与内部动力学。", "summary_source": "deepseek", "authors": [{"name": "Lei Song"}, {"name": "Dingyi Pan"}, {"name": "Nhan Phan-Thien"}], "featured_authors": [{"name": "Lei Song"}, {"name": "Dingyi Pan"}, {"name": "Nhan Phan-Thien"}], "author_count": 3}, {"id": "2605.31107", "category": "cond-mat", "title": "Clustering in atom probe tomography data: coordination number metric, percolation-based parameter scaling, and size effects", "abstract": "The ability to identify nanometer-scale nuclei of new phases in atom probe tomography (APT) is often limited by the sensitivity of clustering algorithms to user-defined control parameters. Conventional approaches typically rely on the Euclidean distance metric and consider only solute atoms, thereby discarding the solvent atoms that contain most of the spatial information. Here, we introduce a coordination-number metric based on the composition and apply it to higher-order clustering. Using various metrics, we investigate percolation in typical APT structures. By scaling clustering properties to the corresponding percolation thresholds, we define a self-similar variable that is almost invariant with respect to metrics, clustering parameters, and structural disorder. This variable provides a relevant description of clustering and enables the formal transfer of optimal parameters between clustering methods. We also study the characteristic clustering behavior in small precipitates and quantify how the precipitate-matrix interface alters the composition spectrum and broadens the clustering curve. Finally, using simulations that incorporate finite spatial resolution, detection efficiency, and other APT reconstruction artifacts, we show that the approach based on coordination numbers effectively compensates for heterogeneous dilations and outperforms solute-density-based methods in all tested scenarios.", "url": "https://arxiv.org/abs/2605.31107", "type": "理论+数值", "summary": "1. 该工作引入基于成分的配位数度量，并将其应用于原子探针层析术数据的高阶团簇分析。\n2. 通过将团簇属性缩放至相应逾渗阈值，定义了一几乎关于度量与结构无序不变的相似变量，实现了团簇参数的形式化转移。\n3. 该方法有效补偿了有限空间分辨与探测效率等重建伪影导致的非均匀膨胀，在团簇识别性能上优于传统溶质密度方法。", "summary_source": "deepseek", "authors": [{"name": "Mykola Lazarev"}, {"name": "John Banhart"}], "featured_authors": [{"name": "Mykola Lazarev"}, {"name": "John Banhart"}], "author_count": 2}, {"id": "2605.31112", "category": "cond-mat", "title": "Functional methods for quantum thermodynamics", "abstract": "The functional renormalization group provides a nonperturbative and systematically improvable route to constructing density functionals for quantum many-body systems from microscopic Hamiltonians. Here we advance this program by benchmarking functional-renormalization-group density functional theory (FRG-DFT) against the exact thermodynamics of the single-site Bose-Hubbard model. This model provides an ideal testing ground because it is analytically solvable, yet remains subtle in the imaginary-time coherent-state path integral, where a naive continuum treatment generates a spurious self-interaction. We show that a careful Hubbard-Stratonovich derivation identifies the self-interaction correction term that must be included in the FRG-DFT flow to recover the exact thermodynamics. We then systematically compare several closures of the resulting hierarchy of flow equations for the free energy, chemical potential, and connected density correlators over broad ranges of density, temperature, and interaction strength. The benchmark shows that the free energy is comparatively robust, whereas the chemical potential and fluctuation observables provide much sharper diagnostics of the hierarchy closure. A maximum-entropy closure gives the most accurate overall description and reproduces even the low-temperature oscillatory structure of the connected two-density correlator. These results identify two general requirements for functional approaches to quantum thermodynamics: the renormalization group flow equation must retain the equal-time contact subtraction to avoid spurious self-interactions, and any closure of the hierarchy must preserve the statistical consistency of density correlators. This work provides a controlled foundation for deriving ab initio density functionals for quantum many-body systems across condensed-matter, ultracold-atom, and nuclear physics, as well as quantum chemistry.", "url": "https://arxiv.org/abs/2605.31112", "type": "理论+数值", "summary": "1. 该工作将泛函重整化群密度泛函理论（FRG-DFT）应用于单格点Bose-Hubbard模型，通过对比精确热力学解，系统检验了非微扰泛函方法的可靠性。\n2. 核心进展在于揭示必须保留等时接触减除项以消除Hubbard-Stratonovich变换引入的虚假自相互作用，并比较多种闭合方案后确认最大熵闭合能准确再现低温下关联密度振子结构。\n3. 这为凝聚态、超冷原子、核物理及量子化学中从头构建密度泛函建立了受控基础，并明确了泛函热力学方法需满足流方程减法与统计自洽性两个普遍要求。", "summary_source": "deepseek", "authors": [{"name": "Sibo Wang"}, {"name": "Samuel Degen"}, {"name": "Haozhao Liang"}], "featured_authors": [{"name": "Sibo Wang"}, {"name": "Samuel Degen"}, {"name": "Haozhao Liang"}], "author_count": 3}, {"id": "2605.31118", "category": "cond-mat", "title": "Complex Magnetic Behavior of the Ce sawtooth chains in CeRhSn$_2$", "abstract": "Conflicting reports exist on the ground state of the intermetallic compound CeRhSn$_2$. This can be rooted in the sawtooth-like arrangement of two inequivalent Ce sites in the unit cell, which suggests potential geometric magnetic frustration. To resolve, we conducted a comprehensive study on high-quality single crystals of CeRhSn$_2$ by means of magnetization ($M$), specific heat ($C_p/T$), and resistivity ($\\rho$). The system exhibits strong magnetic anisotropy, confirming the $b$-axis as the easy magnetic axis. We establish three successive transitions, an AFM order at $T_{N} = 3.65$K, a first-order FM order at $T_{C} = 1.7$K and final transition, at $T = 1.5$K. The transition temperatures are highly field-directional dependent: in a magnetic field, the lowest transition is immediately suppressed while $\\mathbf{H} \\parallel b$ rapidly merges $T_{C}$ and $T_{N}$ into a single second-order transition. Conversely, $\\mathbf{H}\\parallel c$ suppresses the FM order and reduces $T_{N}$. Additional ab initio calculations affirm the FM ground state of CeRhSn$_2$. The observation of an enhancement of the Sommerfeld coefficient ($\\gamma = 76.5$mJ/mol$\\cdot$K$^2$) may arise from geometric frustration, but it is most consistently attributed to weak Kondo hybridization as frustration cannot be conclusively established through our data.", "url": "https://arxiv.org/abs/2605.31118", "type": "数值", "summary": "1. 该工作通过高质量单晶的磁性、比热和电阻率测量及第一性原理计算，系统澄清了CeRhSn₂中锯齿状Ce链引发的复杂磁有序争议。\n2. 其核心在于揭示了三个连续磁相变（反铁磁、一级铁磁及低温转变）并确认强磁场方向依赖性，且将增强的Sommerfeld系数归因于弱Kondo杂化而非几何磁阻挫。\n3. 这为理解具有几何阻挫潜力的锯齿链稀土化合物的基态磁性和重费米子行为提供了明确实验约束。", "summary_source": "deepseek", "authors": [{"name": "P. Opletal"}, {"name": "J. Fikáček"}, {"name": "E. Duverger-Nédellec"}, {"name": "A. Thamizhavel"}, {"name": "Z. Hossain"}, {"name": "R. Tarasenko"}, {"name": "V. Tkáč"}, {"name": "D. Legut"}, {"name": "Bin Shen"}, {"name": "P. Gegenwart"}, {"name": "J. Custers"}], "featured_authors": [{"name": "P. Opletal"}, {"name": "J. Fikáček"}, {"name": "E. Duverger-Nédellec"}, {"name": "Bin Shen"}, {"name": "P. Gegenwart"}, {"name": "J. Custers"}], "author_count": 11}, {"id": "2605.31207", "category": "cond-mat", "title": "Cover time statistics of one-dimensional Brownian motion under stochastic resetting", "abstract": "We investigate the effect of stochastic resetting on the statistics of the cover time of a one-dimensional Brownian motion with a diffusion constant $D$, confined to a finite interval of length $L$. The cover time $t_c$, defined as the minimum time required for the particle to visit every point of the interval at least once, exhibits a non-monotonic dependence on the scaled reset rate $\\rho = rL^2/4D$. The scaled mean cover time $4D\\langle t_c\\rangle/L^2$ initially decreases with increasing $\\rho$, attains a minimum at an optimal value $\\rho^*$, and then increases with $\\rho$, indicating an optimal resetting rate that minimizes the search duration. Furthermore, we derive an exact analytical expression for the cover time distribution, including its asymptotic limits, which agree well with numerical simulations. These results demonstrate that stochastic resetting serves as an efficient mechanism for optimizing cover-time processes in confined geometries.", "url": "https://arxiv.org/abs/2605.31207", "type": "数值", "summary": "1. 该工作研究了一维有限区间内布朗运动在随机重置下的覆盖时间统计，定义了覆盖时间为粒子首次访问区间内每一点所需的最短时间。\n2. 核心发现在于覆盖时间的平均随重置速率非单调变化，存在一个最优重置速率使平均覆盖时间最小化，并给出了覆盖时间分布及其渐近行为的精确解析表达式。\n3. 这为随机重置作为受限几何中最小化搜索时长的高效机制提供了理论依据，并对相关搜索与优化问题具有启发性。", "summary_source": "deepseek", "authors": [{"name": "Anirban Ghosh"}, {"name": "Sanjib Sabhapandit"}], "featured_authors": [{"name": "Anirban Ghosh"}, {"name": "Sanjib Sabhapandit"}], "author_count": 2}, {"id": "2605.31258", "category": "cond-mat", "title": "Droplets sitting on thin elastic sheets: A study with the boundary element method", "abstract": "Elasto-capillarity of a droplet wetting an elastic sheet provides an interesting system, both for fundamental and applied research. The droplet sinks into the sheet and assumes the shape of a lens. To determine the equilibrium shape in simulations, we formulate a boundary element method (BEM) extending our earlier approaches, and apply the BEM to three specific protocols for the boundary conditions of the sheet. For a clamped elastic sheet, we use various morphological metrics to demonstrate that the lens shape crucially depends on the sheet thickness. Stretching the sheet isotropically, allows for an additional control parameter to influence the droplet shape and the tension in the sheet, which we quantify by radial profiles of the azimuthal and radial elastic stresses. We further demonstrate how the focal length of a liquid lens can be tuned by varying the applied tension. Finally, stretching the sheet along one direction, elongates the droplet, and the sheet shows folds and dimples.", "url": "https://arxiv.org/abs/2605.31258", "type": "理论+数值", "summary": "1. 本文运用边界元方法系统研究了液滴在弹性薄片上的弹-毛细平衡形貌，针对夹紧、各向同性拉伸与单向拉伸三种边界条件进行数值模拟。\n2. 主要亮点在于揭示了薄片厚度与各向同性拉伸张力作为调控参数，可定量控制液滴透镜的形貌、应力分布及可调焦距，且单向拉伸导致液滴伸长并诱发褶皱和凹坑。\n3. 该工作为设计基于弹性薄片的可调谐液体微透镜提供了物理机制与数值工具，并拓展了弹-毛细耦合在软物质变形控制中的应用前景。", "summary_source": "deepseek", "authors": [{"name": "Salik Sultan"}, {"name": "Josua Grawitter"}, {"name": "Gonçalo C. Antunes"}, {"name": "Holger Stark"}], "featured_authors": [{"name": "Salik Sultan"}, {"name": "Josua Grawitter"}, {"name": "Gonçalo C. Antunes"}, {"name": "Holger Stark"}], "author_count": 4}, {"id": "2605.31263", "category": "cond-mat", "title": "Valley-polarized Orbital and Spin Magnetism Induced by Femtosecond Optical Pulses in Two-Dimensional Semiconductors", "abstract": "We theoretically investigate the ultrafast generation of spin and orbital magnetism in a two-dimensional gapped Dirac system with spin-orbit coupling. This system is representative of two-dimensional hexagonal semiconductors, such as transition-metal dichalcogenides that exhibit valley-selective optical selection rules arising from the valley-contrasting magnetic texture of their band structure. Using a time-dependent density-matrix formalism, we demonstrate that circularly polarized laser pulses generate nonequilibrium magnetization under both resonant and multiphoton resonant conditions. We show that the induced spin and orbital magnetic moments can be distinctly controlled via the photon energy and polarization of the driving field. Furthermore, spin and orbital dynamics originate from fundamentally different light-matter coupling mechanisms, leading to qualitatively dissimilar temporal behaviors. The orbital magnetic moment couples directly to the external electric field, resulting in faster dynamics and pronounced Rabi-like oscillations, whereas the spin response develops gradually through spin-orbit coupling. Consequently, orbital dynamics is significantly more sensitive to electron-hole dephasing than the spin response. Our results highlight the importance of properly accounting for orbital contributions in future technologies that utilize femtosecond control of magnetism.", "url": "https://arxiv.org/abs/2605.31263", "type": "理论+数值", "summary": "1. 该工作理论研究了具有自旋轨道耦合的二维带隙狄拉克体系中飞秒圆偏振光脉冲诱导的谷极化自旋与轨道磁性。\n2. 其物理卖点在于揭示了轨道磁矩直接耦合外电场导致快速动力学与拉比振荡，而自旋响应经自旋轨道耦合缓慢发展，二者定性不同。\n3. 这强调了在超快光控磁性应用中必须正确计入轨道贡献，为谷电子学与自旋电子学器设计提供了关键启发。", "summary_source": "deepseek", "authors": [{"name": "M. S. Mrudul"}, {"name": "Peter M. Oppeneer"}], "featured_authors": [{"name": "M. S. Mrudul"}, {"name": "Peter M. Oppeneer"}], "author_count": 2}, {"id": "2605.31297", "category": "cond-mat", "title": "Limits of the Non-Linear Generalized Langevin Equation: Cross-Correlations, Irreversibility and Desynchronization", "abstract": "The generalized Langevin equation (GLE) is widely used to model complex soft-matter systems, including biomolecular dynamics, by incorporating memory effects and colored noise into coarse-grained descriptions. However, recent results suggest that combining memory with non-linear forces, ubiquitous in soft matter, introduces fundamental analytical inconsistencies. Here, using a simplified model, we investigate the practical numerical consequences of these analytical results. We show that non-linear forces generate cross-correlations with the noise, modifying the fluctuation-dissipation theorem and rendering the noise position-dependent and irreversible. This implies that the commonly assumed reversible Gaussian noise in GLE simulations fails to capture essential features of the microscopic fluctuations. For weak non-linearities, these issues can be partially resolved either by using an iterative optimization of memory or by using microscopically consistent noise, which unexpectedly synchronizes GLE trajectories with the underlying microscopic dynamics. For stronger non-linearities like high barriers or shoulders in the external potential, however, iterative reconstruction fails and we observe desynchronization, indicating that the non-linear GLE no longer correctly reproduces the microscopic dynamics. Our results show in which situations non-linear GLEs can be accurately applied and when they fail, thus providing practical guidance for their application to coarse-grain soft-matter systems.", "url": "https://arxiv.org/abs/2605.31297", "type": "理论+数值", "summary": "1. 该工作通过简化模型数值研究了非线性广义朗之万方程中非线性力带来的分析不一致性及其实际后果。\n2. 发现非线性力使噪声与动力学产生交叉关联和位置依赖性，破坏标准涨落耗散定理及可逆性，且弱非线性下微观一致噪声可意外同步轨迹，强非线性下则去同步化导致失效。\n3. 这为非线性GLE在粗粒化软物质系统中的适用性划定了明确边界，并提示需发展修正方案以正确捕捉微观涨落特征。", "summary_source": "deepseek", "authors": [{"name": "Bernd Jung"}, {"name": "Gerhard Jung"}], "featured_authors": [{"name": "Bernd Jung"}, {"name": "Gerhard Jung"}], "author_count": 2}, {"id": "2605.31303", "category": "cond-mat", "title": "A Practical Guide for Diagnosing Imaginary Phonon Modes in Metal--Organic Frameworks: The Case of MOF-5", "abstract": "Assessing the dynamical stability of computationally predicted metal--organic frameworks (MOFs) is essential to distinguish synthetically feasible structures from dynamically unstable ones. However, reliable first-principles phonon calculations on these systems remain challenging: their large, flexible unit cells and soft collective modes make the vibrational spectrum highly sensitive to the numerical settings. Using MOF-5 as a representative case study, we establish a finite-displacement workflow to identify and isolate the origins of imaginary phonon modes. We demonstrate how numerical force convergence thresholds, real-space grid resolutions, symmetry-standardization protocols, and alternative unit-cell representations can qualitatively and spuriously alter the predicted lattice stability. Once numerical noise is confidently excluded, the remaining imaginary modes can be analyzed through mode mapping or stochastic Monte Carlo symmetry-breaking distortions to locate lower-energy local minima. This protocol provides a robust, transferable strategy for the reliable assessment of dynamical stability and lattice vibrations in flexible porous frameworks.", "url": "https://arxiv.org/abs/2605.31303", "type": "理论+数值", "summary": "1. 该工作以MOF-5为例，建立了有限位移法工作流以诊断金属有机框架中虚声子模的起源。\n2. 其技术核心在于系统论证了数值设定（力收敛阈值、实空间网格分辨率等）如何定性地改变晶格稳定性判断，并给出排除数值噪音的标准协议。\n3. 这为柔性多孔框架的动力学稳定性评估提供了可迁移的实用策略，并启发对计算预测结构进行可靠的声子谱分析。", "summary_source": "deepseek", "authors": [{"name": "Julia Santana-Andreo"}, {"name": "Caterina Cocchi"}], "featured_authors": [{"name": "Julia Santana-Andreo"}, {"name": "Caterina Cocchi"}], "author_count": 2}, {"id": "2605.31355", "category": "cond-mat", "title": "Spontaneous flows and interfacial instabilities in oxygen-sensitive living active matter", "abstract": "Active fluids generate motion and stress internally, but in living systems this activity is often regulated by environmental fields that the organisms consume or produce. Here we show that oxygen gradients organise and destabilise dense suspensions of the flagellated microswimmer \\textit{Euglena gracilis}. In circular chambers open to air at the periphery, oxygen exchange and cellular consumption generate a radial chemical gradient. An initially homogeneous suspension spontaneously forms a dense cellular ring through oxygen-dependent motility and bidirectional oxytaxis. The ring then develops collective rotation and destabilises into a long-lived corona of protrusions. We reproduce this sequence with an oxygen-coupled polar active-fluid model in which oxygen controls both the direction and speed of cell motion, while dipolar active stresses drive the instability of the dense interface. The simulations show that oxygen taxis creates the annular active interface, but the subsequent corona is an activity-driven interfacial instability. Our results reveal how a self-generated chemical gradient can position and activate a living fluid, providing a route to environmental control of active-matter flows and interfaces.", "url": "https://arxiv.org/abs/2605.31355", "type": "理论+数值", "summary": "1. 该工作实验和理论研究了耗氧微藻Euglena gracilis悬液在径向氧梯度驱动下的自组织流动与界面失稳。\n2. 其核心机制在于氧调控细胞运动方向和速率并产生双极性活性应力，导致稠密环形成、集体旋转及长寿命冠冕状突出物的动力学序列。\n3. 这揭示了自生化学梯度定位和激活活性流体的途径，为利用环境场控制活性物质的界面与流动提供了模型平台。", "summary_source": "deepseek", "authors": [{"name": "Azam Gholami"}, {"name": "Sangram Gore"}, {"name": "Sai V.R.Ambadipudi"}, {"name": "Iraj Gholami"}, {"name": "Albert J. Bae"}], "featured_authors": [{"name": "Azam Gholami"}, {"name": "Sangram Gore"}, {"name": "Sai V.R.Ambadipudi"}, {"name": "Iraj Gholami"}, {"name": "Albert J. Bae"}], "author_count": 5}, {"id": "2605.31418", "category": "cond-mat", "title": "Optimization of multisite reactions in complex compartmentalized media", "abstract": "In complex media, transport and geometric properties deeply influence the kinetics of random encounters between reactants. Here, we consider the situation where a random walker, moving in a regularly diffusing medium, has to reach and activate a target located inside a compartment characterized by fractal (obstructed) sub-diffusion. We focus on dual-site reactions, which end when two activation events occur within a given time window. Each activation event happens with a finite probability whenever the random walker visits the target. For weakly reactive targets, we demonstrate that the reaction time can be minimized for an optimal compartment size and can even be accelerated when compared to the same system without compartment. Our analytical predictions are validated through simulations of a random walker on a cubic lattice, where some sites inside the compartment are obstructed at the critical percolation threshold. Our theory illustrates the fact that adding a crowded compartment around a target, even if it slows down the motion in its vicinity, can accelerate the kinetics of complex reactions, especially for weakly reactive targets.", "url": "https://arxiv.org/abs/2605.31418", "type": "理论+数值", "summary": "1. 该工作研究了复杂分区介质中随机游走者激活分形次扩散分区内双位点反应的优化问题。\n2. 其核心发现在于弱反应目标下反应时间可通过调节分区大小达到最小化，且相比无分区体系可加速反应。\n3. 这揭示了增加局部拥挤环境反而能增强弱反应体系多位置反应动力学的普适机制。", "summary_source": "deepseek", "authors": [{"name": "T. V. Mendes"}, {"name": "T. Guérin"}], "featured_authors": [{"name": "T. V. Mendes"}, {"name": "T. Guérin"}], "author_count": 2}, {"id": "2605.31453", "category": "cond-mat", "title": "Solving models with generalized free fermions II: Path-product expansion and conserved charges", "abstract": "Free-fermion solvability in quantum spin systems is increasingly understood to be governed by a graph Clifford algebra defined from the frustration graph of the Hamiltonian. When the frustration graph belongs to certain classes, such as the even-hole-free and claw-free (ECF) class, the Hamiltonian is solvable by hidden free fermions: it admits a free-fermion solution although it does not reduce to a Majorana bilinear under the Jordan-Wigner transformation. However, unlike in the Jordan-Wigner case, where each mode is a linear combination of single Majorana fermions, the explicit operator structure of the hidden free-fermion modes -- and that of the local conserved charges -- has remained obscure. In this work, we derive a path-product expansion that expresses each free-fermion mode as a linear combination of path products along induced paths in the extended frustration graph. The expansion is obtained from the generating function of the Krylov basis and yields the modes directly, without using the transfer matrix or the nonlocal conserved charges as input. As an application, the mode decomposition computes infinite-temperature dynamical correlation functions for arbitrary ECF frustration graphs. We further obtain explicit expressions for local conserved charges as linear combinations of path products along induced paths; these charges apply beyond the free-fermion (ECF) class to more general claw-free frustration graphs. We also identify a unified family of generalized conserved charges that contains both the previously known nonlocal conserved charges and these local conserved charges as special cases. For Fendley's original FFD chain with homogeneous couplings and periodic boundary conditions, in a suitable basis, the structure of these local conserved charges exhibits the same Catalan-tree pattern as in the spin-$1/2$ XXX chain.", "url": "https://arxiv.org/abs/2605.31453", "type": "理论", "summary": "1. 该工作针对ECF类挫折图对应的广义自由费米子模型，推导了路径乘积展开，以沿扩展挫折图诱导路径的线性组合显式构造隐藏自由费米子模式与局域守恒荷的算子结构。\n2. 其关键卖点在于模式与荷的展开由Krylov基生成函数直接得到，无需转移矩阵或非局域荷作为输入，且所得局域荷超越ECF类适用于一般claw-free图，在均匀周期Fendley链中呈现出与自旋1/2 XXX链一致的Catalan树格式。\n3. 基于该展开，可计算任意ECF图无限温度动力学关联函数，并统一已知非局域荷与局域荷为广义守恒荷族，为广义自由费米子可解性以及关联函数计算提供了系统框架与明确物理图像。", "summary_source": "deepseek", "authors": [{"name": "Kohei Fukai"}, {"name": "Balázs Pozsgay"}, {"name": "István Vona"}], "featured_authors": [{"name": "Kohei Fukai"}, {"name": "Balázs Pozsgay"}, {"name": "István Vona"}], "author_count": 3}, {"id": "2605.31467", "category": "cond-mat", "title": "Ab Initio Spinor Kadanoff-Baym Approach to Nonequilibrium Electron, Phonon and Magnon Dynamics in Itinerant Ferromagnets", "abstract": "This work introduces a theoretical framework based on the Kadanoff-Baym equations in spinor space to study ultrafast magnetization dynamics in itinerant ferromagnetic systems from first principles. By incorporating spin-orbit coupling into the ab initio Hamiltonian and generalizing the self-energies to include terms beyond the charge sector, I derive scattering integrals within the Markov approximation and quasiparticle renormalizations for electrons and phonons in the presence of spin-dependent effective interactions within a many-body perturbation theory approach. I explicitly discuss how magnons emerge in this framework, and derive, through suitable approximations, a close and tractable set of equations for coupled electron,phonon and magnon dynamics that can be solved from first principles. This approach allows to treat coherent and incoherent magnetic dynamics on an equal footing, paving the way for a first principles understanding of ultrafast magnetic dynamics and demagnetization, and opening to a truly predictive theory of femtomagnetism in periodic systems.", "url": "https://arxiv.org/abs/2605.31467", "type": "理论+数值", "summary": "1. 该工作基于旋量空间的Kadanoff-Baym方程，从第一性原理建立了巡游铁磁体中非平衡电子、声子和磁振子动力学的理论框架。\n2. 其核心在于将自旋轨道耦合纳入初始哈密顿量，并推广自能至电荷区以外，在马尔可夫近似下导出包含自旋依赖相互作用的散射积分，进而获得可解的三者耦合动力学方程。\n3. 该方法统一处理相干与非相干磁动力学，为超快退磁和周期性体系中飞秒磁学的第一性原理预测提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Giovanni Marini"}], "featured_authors": [{"name": "Giovanni Marini"}], "author_count": 1}, {"id": "2605.31479", "category": "cond-mat", "title": "Nonequilibrium scaling of drag forces in counterdriven fluid mixtures", "abstract": "We address the effective nonequilibrium drag force field that emerges from the microscopic interparticle interactions in steady states of counterdriven binary fluid mixtures. Using power functional scaling arguments for adaptive Brownian dynamics computer simulation results, we establish quantitatively the crossover between near-equilibrium linear response and far-nonequilibrium square root asymptotics. An algebraic expression captures both limiting cases and remains applicable in the crossover regime. Using simulation results as benchmarks, we verify that a local power functional approximation based on the scaling law reproduces the spatial nonequilibrium structure formation in inhomogenously driven systems. The crossover scenario transcends dynamical density functional theory and it sheds light on general nonequilibrium scaling of driven fluids.", "url": "https://arxiv.org/abs/2605.31479", "type": "理论+数值", "summary": "1. 该工作基于动力泛函标度论证与自适应布朗动力学模拟，定量研究了反驱动二元流体混合物稳态中非平衡拖曳力场。\n2. 其核心是建立了从近平衡线性响应到远非平衡平方根渐近的普适交叉标度律，并验证了局域动力泛函近似能重现非均匀驱动下的空间结构形成。\n3. 该交叉情景超越了动态密度泛函理论，为理解驱动流体的一般非平衡标度行为提供了统一框架与实验指导。", "summary_source": "deepseek", "authors": [{"name": "Jonas Köglmayr"}, {"name": "Florian Sammüller"}, {"name": "Matthias Schmidt"}], "featured_authors": [{"name": "Jonas Köglmayr"}, {"name": "Florian Sammüller"}, {"name": "Matthias Schmidt"}], "author_count": 3}, {"id": "2605.31495", "category": "cond-mat", "title": "General-purpose LLMs as Constrained Crystal Composition Generators", "abstract": "The targeted discovery of inorganic materials remains challenging due to the vastness of compositional design spaces and the high cost of exhaustive screening. Task-specific generative artificial intelligence represents a particularly efficient alternative to screening, yet demands tedious collection of training data before providing real benefit. General-purpose large language models (LLMs) have recently shown tremendous potential for the targeted generation of single, optimal materials compositions without the need for task-specific fine-tuning. However, it is unclear whether LLMs generally pose an advantage compared to specialized generative models, in particular in large design spaces. Here, we demonstrate that such models are capable of covering entire regions of the targeted property space effectively and systematically. Using Elpasolite materials as an established benchmark for generative tasks in large chemical spaces, we find that an iterative prompt-and-response framework is able to recover on average 96% of all low-energy Elpasolites in the target region. This performance, driven mainly by iterative in-context learning, surpasses the generative abilities of previous, task-specific models. Our results establish general-purpose LLMs as flexible and accessible components for inverse materials design workflows.", "url": "https://arxiv.org/abs/2605.31495", "type": "理论", "summary": "1. 该工作展示了通用大语言模型无需任务特定微调，即可通过迭代提示框架高效生成覆盖目标性质空间的受约束晶体成分。\n2. 其卖点在于迭代上下文学习使模型在Elpasolite基准测试中平均恢复96%的低能结构，超越了此前任务专用生成模型。\n3. 这为逆向材料设计提供了灵活、易接入的通用工具，有望拓展至更大化学空间与更多约束条件的成分优化任务。", "summary_source": "deepseek", "authors": [{"name": "Hedda Oschinski"}, {"name": "Maximilian L. Ach"}, {"name": "Konstantin S. Jakob"}, {"name": "Christian Carbogno"}, {"name": "Karsten Reuter"}], "featured_authors": [{"name": "Hedda Oschinski"}, {"name": "Maximilian L. Ach"}, {"name": "Konstantin S. Jakob"}, {"name": "Christian Carbogno"}, {"name": "Karsten Reuter"}], "author_count": 5}, {"id": "2605.31531", "category": "cond-mat", "title": "Multiplet-Selective Photoelectron Diffraction from an Altermagnet", "abstract": "Direct real-space probes of altermagnetic order remain scarce. Here we introduce multiplet-selective photoelectron diffraction (PED), a methodology in which different regions of a transition-metal core-level multiplet act as distinct photoemission source waves. Using multiple-scattering calculations for the metallic altermagnet candidate CrSb, we show that selected Cr $3p$ multiplet features with predominantly $Y_1^{+1}$ and $Y_1^{-1}$ character generate robust diffraction asymmetries sensitive to altermagnetic domains. We demonstrate that both circularly and linearly polarized light provide access to the effect, while suitable combinations of domains, light polarizations, and multiplet-energy windows suppress nonmagnetic diffraction backgrounds. The proposed approach can be implemented using standard momentum-resolved photoemission instrumentation and establishes core-level PED as a practical route toward domain-resolved studies of altermagnets.", "url": "https://arxiv.org/abs/2605.31531", "type": "数值", "summary": "1. 该工作提出多重态选择光电子衍射方法，用于直接探测交错磁体的实空间磁畴序。\n2. 其技术核心在于利用过渡金属芯能级多重态中不同区域作为独立光电子发射源，通过CrSb的多次散射计算展示对交错磁畴敏感的衍射不对称性。\n3. 该方法基于标准动量分辨光电子谱仪即可实现，为芯能级光电子衍射应用于交错磁体的畴分辨研究开辟了实用途径。", "summary_source": "deepseek", "authors": [{"name": "L. Plucinski"}], "featured_authors": [{"name": "L. Plucinski"}], "author_count": 1}, {"id": "2605.31537", "category": "cond-mat", "title": "Nonperturbative renormalization of Haldane pseudopotentials from the exact two-electron spectrum", "abstract": "Haldane pseudopotentials $V_{|m|}$ provide the effective interaction parameters governing correlated states in the fractional quantum Hall regime. In conventional formulations, these quantities are obtained by projecting the Coulomb interaction onto relative-angular-momentum states within the lowest Landau level, thereby neglecting virtual transitions to higher Landau levels. Here, we formulate a nonperturbative description of effective interactions directly from the exact two-electron spectrum in a magnetic field. By solving the relative-motion problem beyond the lowest-Landau-level approximation, we define renormalized pseudopotentials $V^*_{|m|}$ from the exact eigenenergies and introduce dynamical corrections $\\Delta_{|m|}=V^*_{|m|}-V_{|m|}$. The corrections remain systematically negative and depend strongly on both interaction strength and relative angular momentum, reflecting dynamical correlation effects associated with higher-state virtual admixture. The exact results reproduce the perturbative Landau-level-mixing limit at weak coupling while exhibiting substantial deviations in the strong-mixing regime, signaling the breakdown of low-order perturbative expansions. In particular, the short-range interaction channels relevant to Laughlin-type correlations undergo strong renormalization, leading to substantial modification of the effective interaction hierarchy in strongly interacting systems such as ZnO/MgZnO heterostructures. The present formulation establishes a microscopic framework for incorporating nonperturbative Landau-level-mixing effects into effective interaction theories of quantum Hall systems.", "url": "https://arxiv.org/abs/2605.31537", "type": "理论", "summary": "1. 该工作通过求解超越最低朗道能级近似的两电子相对运动精确能谱，定义了非微扰重整化的Haldane赝势V*及其动力学修正Δ。\n2. 其核心在于发现Δ始终为负且强烈依赖于相互作用强度与相对角动量，弱耦合时再现微扰极限，强耦合时显著偏离，尤其短程Laughlin关联通道发生强重整化。\n3. 这一微观框架将非微扰朗道能级混合效应自洽纳入有效相互作用理论，为ZnO/MgZnO等强关联分数量子霍尔系统提供了关键理论基础。", "summary_source": "deepseek", "authors": [{"name": "G.-Q. Hai"}, {"name": "M. T. Matsubara"}, {"name": "L. Cândido"}, {"name": "B. G. A. Brito"}], "featured_authors": [{"name": "G.-Q. Hai"}, {"name": "M. T. Matsubara"}, {"name": "L. Cândido"}, {"name": "B. G. A. Brito"}], "author_count": 4}, {"id": "2605.31540", "category": "cond-mat", "title": "Migdal-Eliashberg and SUS-$Y^2$-SYK", "abstract": "This note addresses a number of subtle issues pertaining to the long-standing problem of strong phonon-like fermion-boson coupling. Among the central topics are the customary Migdal-Eliashberg approximation in the pertinent Schwinger-Dyson gap equation and its solutions. The previously gained insight is assessed by contrasting it against the various (non-)supersymmetric variants of the Yukawa-Sachdev-Ye-Kitaev model. Also, some previously discussed (pseudo-)holographic aspects of fermion pairing in such models are commented upon.", "url": "https://arxiv.org/abs/2605.31540", "type": "理论", "summary": "1. 该工作系统梳理了强声子-费米子耦合问题中的Migdal-Eliashberg近似及其Schwinger-Dinger方程解的若干微妙之处。\n2. 核心在于通过与(非)超对称Yukawa-SYK模型的对比，严格评估该近似的适用范围及先前认识的有效性。\n3. 这为澄清强耦合配对中的全息对应关系及发展超越Migdal-Eliashberg的理论提供了关键约束。", "summary_source": "deepseek", "authors": [{"name": "D. V. Khveshchenko"}], "featured_authors": [{"name": "D. V. Khveshchenko"}], "author_count": 1}, {"id": "2605.31542", "category": "cond-mat", "title": "Recovering the Shape of a Contact Line", "abstract": "We study the conditions for a three-phase contact line to return to a previous position. We drive a water-air-glass contact line between two horizontal plates, by slowly adding and removing water with a constant volume amplitude. For the first several cycles, the contact line ends each cycle with a different shape, in contrast with previously published work. Eventually the shapes begin to repeat, and the system has memory: a cycle with a smaller amplitude ends in a different shape, but even one cycle at the original amplitude recovers the steady-state shape. After a cycle at a larger amplitude, the steady-state shape is erased. We find that our tight control of the enclosed volume creates a global interaction, wherein only the least stable part of the contact line can move. Using theory and minimal models, we show that this interaction gives rise to the transient behaviors. Our study sheds light on the origins of reversibility and memory in a system where neither is guaranteed, and shows that the physics of contact line motion changes in a confined environment.", "url": "https://arxiv.org/abs/2605.31542", "type": "理论", "summary": "1. 该工作通过在两水平板间缓慢加减水驱动气-液-固接触线，实验研究了接触线恢复先前形状的条件。\n2. 其核心发现是精确控制封闭体积产生的全局相互作用仅允许接触线最不稳定部分运动，从而引发瞬态行为并最终形成稳态记忆。\n3. 这揭示了受限环境中接触线运动可逆性与记忆性的物理起源，表明其动力学行为与开放体系存在本质差异。", "summary_source": "deepseek", "authors": [{"name": "Ashbell Abraham"}, {"name": "Audrey Profeta"}, {"name": "Jeanette Smit"}, {"name": "Esmeralda Orozco"}, {"name": "Charity Lizardo"}, {"name": "Dani Medina"}, {"name": "Aidan McGuckin"}, {"name": "Bri Kroger"}, {"name": "Shae Cole"}, {"name": "Nathan C.Keim"}], "featured_authors": [{"name": "Ashbell Abraham"}, {"name": "Audrey Profeta"}, {"name": "Jeanette Smit"}, {"name": "Bri Kroger"}, {"name": "Shae Cole"}, {"name": "Nathan C.Keim"}], "author_count": 10}, {"id": "2605.31601", "category": "cond-mat", "title": "Twin Phases: Phase Transitions Without Hidden Symmetry Breaking", "abstract": "We introduce the concept of twin phases for a symmetry $\\mathcal{S}$, defined as inequivalent phases, whose order parameters are part of the same generalized charge under $\\mathcal{S}$. Stable, direct transitions between such twin phases are never spontaneous-symmetry-breaking transitions, even after (partially) gauging the initial symmetry $\\mathcal{S}$: they are phase transitions without hidden symmetry breaking. We illustrate this with an (anomalous) finite group symmetry in 1+1d, which exhibits such intrinsically beyond Landau transitions.", "url": "https://arxiv.org/abs/2605.31601", "type": "理论", "summary": "1. 该工作引入“孪生相”概念——在给定对称性下不等价但序参量属于同一广义荷的相，并证明其稳定直接相变并非自发对称破缺过程。\n2. 核心卖点在于揭示：即使对初始对称性进行部分规范，此类相变仍不伴随隐藏对称性破缺，从而展示了一种内在的超越朗道相变类型。\n3. 这为理解反常有限群对称性驱动的1+1维系统提供明确范式，并启发对更广泛物理场景中非对称破缺相变机制的研究。", "summary_source": "deepseek", "authors": [{"name": "Alison Warman"}, {"name": "Yuhan Gai"}, {"name": "Sakura Schafer-Nameki"}], "featured_authors": [{"name": "Alison Warman"}, {"name": "Yuhan Gai"}, {"name": "Sakura Schafer-Nameki"}], "author_count": 3}, {"id": "2605.31602", "category": "cond-mat", "title": "Twin Algebras: Condensable Algebras beyond Anyons", "abstract": "Condensable algebras in 2+1d non-chiral topological orders characterize gapped boundary conditions and interfaces. Applied to the Symmetry Topological Field Theory, they allow classification of symmetric gapped phases and impose sharp constraints on possible phase transitions. A condensable algebra is specified not only by its underlying set of anyons, which end on the boundary or interface, but also by its algebra structure. We introduce the concept of twin condensable algebras, which have the same anyon decomposition, but inequivalent algebra structure. We revisit the classification of condensable algebras in $\\mathcal{Z}(\\text{Vec}_G^\\omega)$, i.e. in group-theoretical topological orders for finite groups $G$ with anomaly $\\omega$. In this context we are able to identify twin algebras that arise from different mechanisms, such as subgroup data, SPT cocycles, and symmetry actions. In particular, we construct infinite families of examples of twins from so-called Gassmann triples, and exhibit cases in which the reduced topological orders are inequivalent despite having identical anyon content. Physically, twin algebras describe distinct symmetric phases that have isomorphic spaces of ground states, but inequivalent order parameters. Such twin phases never exhibit relative spontaneous symmetry breaking, and can be used to construct phase transitions without hidden symmetry breaking, which are intrinsically beyond Landau transitions.", "url": "https://arxiv.org/abs/2605.31602", "type": "理论", "summary": "1. 该工作引入孪生凝聚代数概念，指代2+1维非手征拓扑序中具有相同任意子分解但代数结构不等价的凝聚代数，并基于群论拓扑序 $\\mathcal{Z}(\\text{Vec}_G^\\omega)$ 系统研究其分类与不同机制下的构造。\n2. 技术核心在于揭示子群数据、SPT上循环及对称作用等多种机制均可产生孪生代数，并利用Gassmann三元组构造无限族例子，展示任意子内容相同下约化拓扑序的不等价性。\n3. 这些孪生代数刻画具有相同基态空间但不等价序参量的有隙对称相，为构造超越朗道相变的无隐藏对称性破缺相变提供新途径，对对称拓扑场论中相分类与相变约束有重要启发。", "summary_source": "deepseek", "authors": [{"name": "Yuhan Gai"}, {"name": "Sakura Schafer-Nameki"}, {"name": "Alison Warman"}], "featured_authors": [{"name": "Yuhan Gai"}, {"name": "Sakura Schafer-Nameki"}, {"name": "Alison Warman"}], "author_count": 3}, {"id": "2605.30403", "category": "hep-th", "title": "Non-Abelian Dirac oscillator in a uniform Yang--Mills background: spin--isospin mixing and singlet--triplet splitting", "abstract": "We investigate a planar Dirac oscillator coupled to a spatially uniform \\(\\utwo=\\uone\\times\\su\\) Yang--Mills background. The gauge configuration, adapted from the Dossa--Avossevou construction, contains an Abelian magnetic field \\(B\\), a non-Abelian spatial amplitude \\(\\beta\\), and a non-Abelian scalar amplitude \\(\\rho\\). Within the Pauli-reduced formulation, the non-Abelian field strength produces a constant operator on \\(\\mathbb{C}^{2}_{\\mathrm{spin}}\\otimes\\mathbb{C}^{2}_{\\mathrm{iso}}\\). This operator contains a diagonal internal-Zeeman contribution proportional to \\(\\sigma^{3}T^{3}\\) and an off-diagonal spin--isospin term proportional to \\(\\sigma^{1}T^{1}+\\sigma^{2}T^{2}\\). Its diagonalization gives a doubly degenerate aligned branch and two mixed branches with eigenvalues \\[ \\lambda_{\\mathrm{FM}}=\\frac{g^{2}\\beta^{2}}{4m},\\qquad \\lambda_{S}=-\\frac{g^{2}\\beta(\\beta-2\\rho)}{4m},\\qquad \\lambda_{T}=-\\frac{g^{2}\\beta(\\beta+2\\rho)}{4m}. \\] Consequently, the aligned internal-Zeeman scale is quadratic in \\(\\beta\\), whereas the singlet--triplet separation is linear in \\(\\beta\\rho\\). The revised formulation makes the sign conventions explicit, verifies the main limiting cases, distinguishes the Pauli-reduced spectrum from a full first-order Dirac diagonalization, and clarifies the physical meaning of the numerical illustrations.", "url": "https://arxiv.org/abs/2605.30403", "type": "理论", "summary": "1. 该工作研究了平面狄拉克振荡器与均匀\\(\\mathfrak{su}(2)\\)杨-米尔斯背景的耦合，通过泡利约化形式导出非阿贝尔场强常算符。\n2. 其技术要点在于算符对角化揭示了内部塞曼项\\(\\propto\\sigma^3T^3\\)与自旋-同位旋混合项\\(\\propto\\sigma^1T^1+\\sigma^2T^2\\)的竞争，得到对齐分支和两个混合分支的解析能谱，其中单态-三重态分裂线性依赖于标量振幅与空间振幅的乘积。\n3. 这为探索非阿贝尔规范背景中自旋-同位旋纠缠、谱分裂机制及推广至一般狄拉克-杨-米尔斯系统
