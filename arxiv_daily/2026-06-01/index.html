提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Abdelmalek Boumali"}], "featured_authors": [{"name": "Abdelmalek Boumali"}], "author_count": 1}, {"id": "2605.30411", "category": "hep-th", "title": "Axions Create Singularities on Extremal Horizons", "abstract": "We show that axions cause extremal black holes to have singular horizons. This is true for almost all values of the axion mass and coupling provided the black hole is rotating and has some arbitrarily small nonzero charge. When the axion mass becomes large, these singularities are related to the recently discovered singularities induced by higher-derivative corrections to the Einstein-Maxwell equations. Away from extremality, this effect produces anomalously large tidal forces in the vicinity of near-extremal horizons, causing breakdown of the effective theory.", "url": "https://arxiv.org/abs/2605.30411", "type": "理论", "summary": "1. 该工作证明轴子场在几乎所有质量和耦合参数下都会使旋转带电极端黑洞的视界产生奇点。\n2. 其物理核心在于揭示轴子诱导的奇点与大质量极限下Einstein-Maxwell方程高阶导数修正所引发的奇点相联系。\n3. 这指出近极端情形下有效理论因异常潮汐力而失效，对极小黑洞的量子引力行为具有启示意义。", "summary_source": "deepseek", "authors": [{"name": "Gary T. Horowitz"}, {"name": "Maciej Kolanowski"}, {"name": "Grant N. Remmen"}, {"name": "Jorge E. Santos"}], "featured_authors": [{"name": "Gary T. Horowitz"}, {"name": "Maciej Kolanowski"}, {"name": "Grant N. Remmen"}, {"name": "Jorge E. Santos"}], "author_count": 4}, {"id": "2605.30417", "category": "hep-th", "title": "Logarithm of charge ratio in black hole entropy", "abstract": "Logarithmic correction to BPS black hole entropy, computed from microscopic description, often contains terms involving large ratios of charges, besides the logarithmic terms involving the overall scale of the charges. If the electric charges are much larger than the magnetic charges, then the attractor value of the string coupling is small and one might hope to use weakly coupled string theory to compute logarithmic corrections involving ratios of charges from the macroscopic side. We compute these for black holes in flat space-time, preserving four supercharges, in $\\mathcal{N} = 2$, $\\mathcal{N}=4$ and $\\mathcal{N}=8$ supersymmetric string compactifications in four dimensions. We find perfect agreement with the microscopic results in $\\mathcal{N}=4$ and $\\mathcal{N}=8$ theories, for which the microscopic results are known. Various stringy and statistical mechanical effects become important in this analysis, including 1) use of the correct ultra-violet cut-off (string scale instead of Planck scale), 2) correct path integral measure (ultra-local measure with appropriate dilaton dependent metric), 3) use of the correct path integral variable (Kalb-Ramond 2-form instead of the dual axion) and 4) change of ensemble (from grand canonical to microcanonical). We also verify that the measure we use is consistent with what follows from the BV formalism of string field theory.", "url": "https://arxiv.org/abs/2605.30417", "type": "理论", "summary": "1. 该工作计算了四维超弦紧化中BPS黑洞熵涉及大电荷比的对数修正，并与微观结果进行了对比。\n2. 其技术关键在于采用弦尺度截断、超局部测度、Kalb-Ramond 2-形式变量及微正则系综，使宏微观在N=4和N=8理论中完美一致。\n3. 这一结果验证了路径积分测度与弦场论BV形式的自洽性，为理解黑洞熵量子修正及弱耦合弦论计算的有效性提供了重要基准。", "summary_source": "deepseek", "authors": [{"name": "Muktajyoti Saha"}, {"name": "Ashoke Sen"}, {"name": "P. Shanmugapriya"}], "featured_authors": [{"name": "Muktajyoti Saha"}, {"name": "Ashoke Sen"}, {"name": "P. Shanmugapriya"}], "author_count": 3}, {"id": "2605.30418", "category": "hep-th", "title": "Hodge Loci and Complex Multiplication via Generalized Symmetries in Calabi-Yau sigma models", "abstract": "We propose a sigma-model analogue of Hodge loci in the moduli space of geometric Calabi-Yau compactifications, characterized by the emergence of non-trivial rational Hodge endomorphisms, using generalized symmetries. In the CFT description, the complex cohomology is spanned by Ramond-Ramond ground states, the Hodge decomposition is determined by the $U(1)\\times U(1)$ R-charges, and the rational structure is provided by BPS boundary states, with polarization induced by the open string Witten index. Hodge loci are identified by the existence of a non-trivial category $TDL$ of topological defects preserving the $N=(2,2)$ superconformal algebra and acting invertibly on the spectral-flow generators. At special points on these loci, the category $TDL$ exhibits additional arithmetic structure and admits embeddings of finite products of number fields with Complex Multiplication, leading to stronger constraints on the boundary states of the theory. Although the construction is general, we analyze in detail the cases of elliptic curves and $K3$ surfaces.", "url": "https://arxiv.org/abs/2605.30418", "type": "理论", "summary": "1. 该工作利用广义对称性，在Calabi-Yau sigma模型的模空间中提出了几何紧化Hodge轨迹的弦论类比，以表征非平凡有理Hodge自同态的出现。\n2. 其核心在于通过拓扑缺陷范畴和边界态的有理结构，将Hodge分解与拓扑缺陷对谱流生成元的可逆作用关联，并在特殊点揭示复乘算术结构的嵌入。\n3. 这为弦论紧化中算术与对称性约束的研究提供了新框架，尤其适用于椭圆曲线与K3曲面情形，并可推广至更高维Calabi-Yau背景。", "summary_source": "deepseek", "authors": [{"name": "Roberta Angius"}, {"name": "Roberto Volpato"}], "featured_authors": [{"name": "Roberta Angius"}, {"name": "Roberto Volpato"}], "author_count": 2}, {"id": "2605.30423", "category": "hep-th", "title": "Spectral Admissibility of Real Observers in Euclidean de Sitter Gravity", "abstract": "The Euclidean de Sitter path integral contains the familiar phase associated with conformal negative modes. Maldacena's construction shows that a suitably included real observer can reorganize the refined state-counting problem. This paper does not rederive that cancellation. It addresses the prior semiclassical admissibility question: which observer sectors couple to the de Sitter saddle as genuine metric observers without becoming spectators or producing infrared-singular backreaction? On $S^D$, after gauge fixing and zero-mode projection, the observer's quadratic influence is governed by a Schur complement. We formulate a form-domain criterion: if the observer kernel is positive and the mixed metric-observer source is bounded after applying $\\Delta_{\\Phi\\Phi}^{-1/2}$, the induced metric correction is a bounded quadratic-form perturbation on the chosen channel. In the gapped case, $\\Delta_{\\Phi\\Phi}\\geq m_*^2\\mathbf{1}$ gives $\\|K^\\dagger \\Delta_{\\Phi\\Phi}^{-1} K\\|_{\\rm op} \\leq \\|K\\|_{\\rm op}^2/m_*^2$; metric-coupled soft modes produce corrections growing as $1/\\varepsilon$. We prove a sufficiency theorem: on any stable channel with coercive form $Q_{gg}^P \\geq \\delta_P \\|h\\|^2$, the Gaussian saddle remains controlled whenever $\\|\\Delta_{\\Phi\\Phi}^{-1/2} \\mathfrak{j}_P\\|_{\\rm op}^2 < \\delta_P$. We construct a localized gapped clock-detector with internal oscillators on a smeared worldline that satisfies the criterion with a computable bound and gives explicit $S^4$ benchmark versus the round-sphere TT scale. The conformal channel is treated only as an indefinite or contour-defined sector; boundedness does not imply positivity. The criterion identifies the semiclassically admissible observer class. Phase cancellation follows only when this class overlaps the relevant conformal or negative-mode sector and is combined with an independent contour or state-counting prescription.", "url": "https://arxiv.org/abs/2605.30423", "type": "理论", "summary": "1. 该工作针对欧几里得德西特引力中真实观测者的半经典可容许性问题，提出了基于Schur补和形式域判据的谱分析框架。\n2. 其核心是证明当观测者核正定且混合源经Δ_{ΦΦ}^{-1/2}有界时，诱导度规修正为有界二次型扰动，并构造了满足该条件的局域化带隙钟探测器。\n3. 该判据识别了与德西特鞍点耦合的真实观测者类，为后续相消与态计数方案提供了明确的半经典前提。", "summary_source": "deepseek", "authors": [{"name": "Ricardo Espíndola"}, {"name": "Ahmed Farag Ali"}], "featured_authors": [{"name": "Ricardo Espíndola"}, {"name": "Ahmed Farag Ali"}], "author_count": 2}, {"id": "2605.30475", "category": "hep-th", "title": "Cosmological Weight-Shifting Matrices", "abstract": "We construct matrices that shift the scaling dimension of scalar fields for arbitrary de Sitter Feynman diagrams. Acting on a set of master integrals, these weight-shifting matrices shift the scaling dimensions of individual edges of a given diagram by an integer. They can thus be applied to a broader range of problems and are simpler to implement than earlier derivative-based approaches. By introducing a Kronecker product representation of our matrix formulation, we generalise weight-shifting operators beyond four-point functions to arbitrary tree-level diagrams. As an application, we obtain explicit expressions for several massless wavefunction coefficients in four-dimensional de Sitter space, starting from conformally coupled seed functions. Our construction provides a systematic and graph-local approach to generating cosmologically relevant correlators from simpler master integrals.", "url": "https://arxiv.org/abs/2605.30475", "type": "理论", "summary": "1. 该工作构造了权重移动矩阵，用于任意de Sitter费曼图中标量场标度维度的整数平移，并借助Kronecker积推广至任意树图。\n2. 其核心在于引入图局域的矩阵操作，替代了复杂的导数方法，可从共形耦合种子函数系统生成无质量波函数系数。\n3. 这为简化宇宙学相关函数的计算、从主积分得到高阶相关子提供了自洽的代数框架。", "summary_source": "deepseek", "authors": [{"name": "Claire de Korte"}, {"name": "Harry Goodhew"}, {"name": "Kamran Salehi Vaziri"}, {"name": "Nicolas Weiss"}], "featured_authors": [{"name": "Claire de Korte"}, {"name": "Harry Goodhew"}, {"name": "Kamran Salehi Vaziri"}, {"name": "Nicolas Weiss"}], "author_count": 4}, {"id": "2605.30536", "category": "hep-th", "title": "Ambiguity problem of the Bootstrap Method in Quantum Mechanics", "abstract": "The bootstrap method for quantum mechanics is a powerful tool for computing the energy eigenvalues of a Hamiltonian. However, we point out that this method suffers from an ambiguity problem: it fails to yield the correct spectrum when the potential contains different types of functions, such as polynomial and exponential terms. Similarly, the bootstrap method may break down when evaluating the expectation values of operators of different types. This issue can arise in a wide range of systems, including statistical models and matrix models. We propose three possible resolutions to this problem.", "url": "https://arxiv.org/abs/2605.30536", "type": "理论", "summary": "1. 该工作指出量子力学bootstrap方法在势场包含多项式与指数等不同类型函数时，无法正确给出能谱和算符期望值，揭示了其固有的歧义性问题。\n2. 主要卖点是系统性地分析了该方法失效的物理条件，并指出这一缺陷广泛存在于统计模型、矩阵模型等系统，为理解其适用范围提供了关键判据。\n3. 作者提出的三种可能解方案为后续改进bootstrap方法、扩展其应用范围至更复杂势场和算符体系提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Takeshi Morita"}, {"name": "Worapat Piensuk"}, {"name": "Pushkar Soni"}], "featured_authors": [{"name": "Takeshi Morita"}, {"name": "Worapat Piensuk"}, {"name": "Pushkar Soni"}], "author_count": 3}, {"id": "2605.30759", "category": "hep-th", "title": "Vertex Operators in Superstring Theory from Integral Forms and Descent Equations", "abstract": "We develop a geometric formulation of vertex operators in superstring theory based on integral forms on super Riemann surfaces. Starting from the integrated NS-NS vertex operator, we derive descent equations that relate operators with different ghost and picture numbers. A key result is a correspondence between supergeometric objects and ghost superfields, in which the one-form $dz-\\theta d\\theta$ and the even differential $d\\theta$ are identified with the ghost superfield and its superderivative. This provides a geometric realization of the superghost structure. We further extend the construction by incorporating inverse picture-changing operators, which generate new descent sequences across different picture sectors. We also introduce a superfield construction of higher-ghost-number operators, for which additional terms are required compared to the bosonic case. All operators are organized into a universal descent structure and are well-defined in BRST cohomology.", "url": "https://arxiv.org/abs/2605.30759", "type": "理论", "summary": "1. 该工作基于超Riemann面上的积分形式，为超弦理论中的顶点算子建立了系统的几何表述。\n2. 核心在于通过下降方程实现了超几何对象（如单形dz-θdθ）与鬼超场及其超导数的对应，并引入逆图像改变算符连接不同图像扇区。\n3. 这为BRST上同调中顶点算子的统一构造提供了几何框架，有望推广至更高亏格或更多超对称的情形。", "summary_source": "deepseek", "authors": [{"name": "Isao Kishimoto"}, {"name": "Shigenori Seki"}, {"name": "Haruka Shimogaki"}, {"name": "Tomohiko Takahashi"}], "featured_authors": [{"name": "Isao Kishimoto"}, {"name": "Shigenori Seki"}, {"name": "Haruka Shimogaki"}, {"name": "Tomohiko Takahashi"}], "author_count": 4}, {"id": "2605.30797", "category": "hep-th", "title": "A Boolean-Lattice Perspective for All-Loop Two-Site Cosmological Wavefunction", "abstract": "We revisit the shifted-tree decomposition formula proposed in our previous work arXiv:2410.17192 for two-site cosmological wavefunction coefficients. For the two-site bubble-like family at arbitrary loop order, we show that the nontrivial central part of the decomposition reduces to an alternating subset sum over shifted diagonal divisors. This subset sum is naturally organized by the Boolean lattice associated with the internal energies, and can be rewritten as a product of commuting finite-difference operators acting on a seed divisor. The finite-difference form first gives a vertex expansion on the Boolean lattice and then leads to an equivalent maximal-chain expansion over complete filtrations from the empty subset to the full set of internal energies. We prove this maximal-chain formula in two complementary ways. Algebraically, the identity follows from a telescoping relation for products of shifted divisors. Geometrically, the finite-difference expression is represented by a cubical integral over the Boolean cube, while the maximal-chain expansion gives its simplex decomposition. After restoring the common two-site prefactor, this maximal-chain expansion reproduces the tubing representation of the loop-level wavefunction coefficient. Thus the shifted-tree decomposition and the tubing construction are two realizations of the same Boolean-lattice identity, providing a concrete geometric interpretation of the all-loop two-site formula.", "url": "https://arxiv.org/abs/2605.30797", "type": "理论", "summary": "1. 该工作从布尔格视角出发，重新审视并统一了全圈两site宇宙学波函数系数的移位树分解与tubing构造。\n2. 其核心在于将波函数系数约化为移位对角除数的交替子集和，并证明其等价于交换有限差分算子乘积驱动的最大链展开。\n3. 代数上的伸缩关系与几何上的立方积分—单纯形分解两种互补证明，为圈级波函数系数提供了统一且几何直观的解析框架。", "summary_source": "deepseek", "authors": [{"name": "Yanfeng Hang"}, {"name": "Cong Shen"}], "featured_authors": [{"name": "Yanfeng Hang"}, {"name": "Cong Shen"}], "author_count": 2}, {"id": "2605.30970", "category": "hep-th", "title": "Towards Bulk Locality: A Systematic Construction of Contact Interactions from Chord Diagrams", "abstract": "Chord diagrams encode boundary correlators in the double-scaled holographic Sachdev-Ye-Kitaev model, but currently capture only a limited class of bulk interactions that yield pure power-law correlators. In this article, we investigate a general construction based on Fock-space flux models with arbitrary periodic lattice size, clarifies how lattice dimensions control probe configurations and bulk contact vertices. Developing a systematic matching scheme and using the chord path integral formalism, we compute three- to six-point contact correlators and reproduce a broad class of AdS$_2$ scalar contact Witten diagrams, including those with logarithmic singularities. The results demonstrate that chord diagrams, in full generality, provide a microscopic description of bulk contact interactions and thereby establish a principled framework for reconstructing bulk locality from boundary data.", "url": "https://arxiv.org/abs/2605.30970", "type": "理论", "summary": "1. 该工作基于弦图路径积分形式，系统构造了双标度全息SYK模型中从边界关联子到体接触相互作用的对应关系。\n2. 其核心在于利用Fock空间通量模型和任意周期格点尺寸，计算三至六点接触关联子，再现了包含对数奇点的AdS₂标量接触Witten图。\n3. 这为从边界数据出发微观重建体局域性提供了统一框架，有望将全息体-边界对偶推广至更一般的接触相互作用。", "summary_source": "deepseek", "authors": [{"name": "Hao Dai"}, {"name": "Yi-Li Wang"}, {"name": "Yu-Ge Chen"}, {"name": "Li-Guo Qin"}, {"name": "Li-Jun Tian"}], "featured_authors": [{"name": "Hao Dai"}, {"name": "Yi-Li Wang"}, {"name": "Yu-Ge Chen"}, {"name": "Li-Guo Qin"}, {"name": "Li-Jun Tian"}], "author_count": 5}, {"id": "2605.31181", "category": "hep-th", "title": "Brane flows", "abstract": "Based on effective D-brane actions, we present a generalisation of the Ricci flow that includes the flow of a theory with a $n$-form field strength for $n\\geq 0$. This is a generalisation of both the Ricci flows and the generalised Ricci flows. Following Perelman, we show that flows that keep a suitable field-dependent volume fixed are monotonic. We also show that all steady brane flow solitons are gradient solitons and use this to demonstrate that on some occasions this implies the existence of a Killing vector field that leaves all the other fields invariant. Particular cases of gradient solitons are NS5 and D5 branes, and the volume which is kept fixed in these cases is the T-duality invariant volume (NS5 brane) or its S-dual (D5 brane). We also generalise the above analysis to gravitational actions coupled to form gauge potentials that also exhibit a Chern-Simons type term. We find an alteration is required in the adaptation of Perelman's modification to this case, which yields a new functional that also exhibits a Chern-Simons term. Under suitable assumptions, we proceed to prove the monotonicity of the flow and that all steady flow solitons are gradient solitons. We also explore the consequences of the last statement on the geometry of solitons.", "url": "https://arxiv.org/abs/2605.31181", "type": "理论", "summary": "1. 基于有效D膜作用量，提出了包含n-形式场强流的广义Ricci流框架。\n2. 主要技术点在于证明了保持场依赖体积固定的流具有单调性，且稳态孤子均为梯度孤子，并揭示了其与Killing矢量场及T-对偶不变体积的联系。\n3. 该工作为膜世界中的几何流、孤子分类及与Chern-Simons项耦合的引力理论提供了新的研究方向。", "summary_source": "deepseek", "authors": [{"name": "Georgios Papadopoulos"}, {"name": "Kostas Skenderis"}], "featured_authors": [{"name": "Georgios Papadopoulos"}, {"name": "Kostas Skenderis"}], "author_count": 2}, {"id": "2605.31331", "category": "hep-th", "title": "Higher-Derivative Corrections to Reissner--Nordström Black Holes from Worldline QFT", "abstract": "In this paper we derived the corrections to the Reissner-Nordström black hole when higher-derivative $RF^2$ terms (contractions of the Riemann tensor with the Maxwell field strength squared) are added to the Einstein-Maxwell action. Such terms arise naturally in the context of effective field theories. We used wordline QFT methods to obtain the leading order post-Minkowskian corrections. We verified these results by solving the modified Einstein-Maxwell field equations in closed form, to all orders in Newton's constant $G$. We discussed the first law and computed the entropy of the perturbed black holes. The extremal black hole temperature is non-negative precisely when the weak gravity conjecture is satisfied. This condition on the extremal black hole temperature rules out Drummond-Hathrell theory.", "url": "https://arxiv.org/abs/2605.31331", "type": "理论", "summary": "1. 利用worldline QFT方法导出Reissner-Nordström黑洞在RF²高阶导数项下的领头阶后闵氏修正，并通过闭式场方程解验证至所有阶。\n2. 核心发现是极端黑洞温度的非负性条件精确等价于弱引力猜想，并以此排除了Drummond-Hathrell理论。\n3. 该工作为有效场论中黑洞修正与弱引力猜想的自洽性提供了可检验的定量判据。", "summary_source": "deepseek", "authors": [{"name": "Siddarth Ajith"}, {"name": "Ravisankar Rajagopal"}, {"name": "Nur Rifat"}, {"name": "Diana Vaman"}, {"name": "Kent Yagi"}], "featured_authors": [{"name": "Siddarth Ajith"}, {"name": "Ravisankar Rajagopal"}, {"name": "Nur Rifat"}, {"name": "Diana Vaman"}, {"name": "Kent Yagi"}], "author_count": 5}, {"id": "2605.31588", "category": "hep-th", "title": "Two roles of Alexander in two Kashaev phases", "abstract": "The crucial feature of resurgence theory is the ambiguity of non-perturbative behavior, reflected either in the different choices of integration contours or in the existence of several solutions to Ward identities. This is well illustrated by considering exactly solvable models, of which the prominent example is Chern-Simons theory. Its important chapter, which should have a direct generalization to arbitrary Yang-Mills, is the consideration of Wilson averages in the double-scaling limit of large representation and small coupling. For historical reasons, we call it a Kashaev limit. It possesses a natural interpretation in terms of quasiclassical/WKB approximation, which is, however, somewhat peculiar and thus sheds new light on the old story. The crucial point is the appearance of Alexander polynomials $\\Delta$ in two seemingly opposite roles: the classical $A$-polynomials have common roots with $\\Delta$, while Jones polynomials tend to $\\Delta^{-1}$ in the perturbative expansion. The consistency is provided by the peculiar form of the quantum $A$-polynomial, and the resolution of the puzzle is the co-existence of two different branches (phases) in the quasiclassical limit -- with non-trivial and with vanishing classical actions. The first leads to classical $A$-polynomials and hyperbolic volumes, the second -- to inverse Alexanders.", "url": "https://arxiv.org/abs/2605.31588", "type": "理论", "summary": "1. 该工作通过Chern-Simons理论中大表示与小耦合的双缩放极限（Kashaev极限），展示了Alexander多项式在准经典近似中的双重角色，以阐明复兴理论中非微扰行为的不明确性。\n2. 其核心在于发现准经典极限共存两个相位分支：一个具有非零经典作用并导出经典A-多项式与双曲体积，另一个具有零经典作用并导出逆Alexander，且由量子A-多项式的特殊结构提供一致。\n3. 这为将Kashaev极限框架推广至任意Yang-Mills理论提供了路径，并启示了双曲体积与量子拓扑不变量之间的深层关联。", "summary_source": "deepseek", "authors": [{"name": "Dmitry Galakhov"}, {"name": "Alexei Morozov"}], "featured_authors": [{"name": "Dmitry Galakhov"}, {"name": "Alexei Morozov"}], "author_count": 2}, {"id": "2605.30390", "category": "math-ph", "title": "A Boundary--Residue Incidence Coalgebra for Associahedral Scattering Forms", "abstract": "We introduce a boundary--residue incidence coalgebra associated with the face poset of a positive geometry and apply it to associahedral scattering forms. The construction is motivated by the analogy between the Connes--Kreimer coproduct on Feynman graphs and the recursive residue structure of canonical forms. For the Stasheff associahedron \\(K_n\\), whose faces are indexed by non-crossing dissections of an \\((n+1)\\)-gon, we prove that the incidence coproduct records all intermediate nested planar factorisation channels of the corresponding tree-level scalar amplitude. The residue of the canonical form on a face labelled by a dissection factorises as the exterior product of canonical forms on the lower associahedra associated with the resulting subpolygons. We illustrate the construction explicitly for the pentagon associahedron \\(K_4\\), corresponding to the five-point planar scalar amplitude. We then formulate a loop-level extension: whenever a planar loop integrand is represented by a positive geometry, the associahedral face poset is replaced by the boundary poset of the corresponding loop geometry. The one-loop halohedron gives a concrete scalar example, while in the non-planar case we define the associated incidence coalgebra at the level of logarithmic singularity strata. Finally, we compare the boundary--residue coalgebra with the cellular incidence coalgebra of a triangulated or regular CW spacetime. The face poset of a finite regular CW complex reconstructs its barycentric subdivision, and hence its underlying polyhedron, while in positive geometry the same incidence mechanism organises canonical-form residues. This yields an incidence-first bridge between cellular spacetime topology and positive-geometric amplitude factorisation, without assuming that metric or causal data are determined by topology.", "url": "https://arxiv.org/abs/2605.30390", "type": "理论", "summary": "1. 该工作为关联面偏序集引入边界—留数入射余代数，并应用于associahedral散射形式，证明其记录树级标量振幅的所有中间嵌套平面因子化通道。\n2. 核心卖点在于面上典范形式的留数因子化为子多边形上典范形式的外积，从而系统组织正几何中的留数结构。\n3. 该构造为无度量或因果数据的细胞时空拓扑与正几何振幅因子化之间建立了以入射结构为桥梁的联系，可推广至圈级与非平面情形。", "summary_source": "deepseek", "authors": [{"name": "Ioannis P. Zois"}], "featured_authors": [{"name": "Ioannis P. Zois"}], "author_count": 1}, {"id": "2605.30558", "category": "math-ph", "title": "BV pushforward as a quasi-isomorphism", "abstract": "Given a BV theory on a space of fields split into two subspaces (\"infrared\" and \"ultraviolet\"), one has the BV pushforward map $P_*$, sending observables to observables of the effective theory on the infrared space. This note proves that $P_*$ is a quasi-isomorphism of BV complexes, by realizing it as a part of a strong deformation retraction constructed using the homological perturbation lemma. Two proofs are given: (i) comparing Feynman diagrams for $P_*$ with \"cable diagrams\" arising from homological perturbation theory and (ii) using topological quantum mechanics. This construction gives a formula for the quasi-inverse $i_\\mathrm{int}$ of $P_*$ - the map lifting observables of the effective theory to the full theory. The topological quantum mechanics perspective - and its realization as an AKSZ theory - allows one to write $i_\\mathrm{int}$ as a path integral (realizing cable diagrams for $i_\\mathrm{int}$ as Feynman diagrams) and to study its classical limit.", "url": "https://arxiv.org/abs/2605.30558", "type": "理论", "summary": "1. 该工作证明了BV理论中，将场空间分割为红外与紫外部分时，BV pushforward映射P_*是BV复形间的拟同构，并构造了其拟逆映射i_int的显式形式。\n2. 技术核心是通过同调扰动引理构建强形变收缩，并采用费曼图与电缆图比较以及拓扑量子力学（AKSZ理论）两种途径完成了证明，揭示了i_int的电缆图与费曼图之间的对应。\n3. i_int的路径积分表达式给出了有效理论可观测量提升至完整理论的显式公式，可分析其经典极限，为有效场论的代数结构与重整化提供了新启发。", "summary_source": "deepseek", "authors": [{"name": "Alberto S. Cattaneo"}, {"name": "Pavel Mnev"}], "featured_authors": [{"name": "Alberto S. Cattaneo"}, {"name": "Pavel Mnev"}], "author_count": 2}, {"id": "2605.30586", "category": "math-ph", "title": "A sharp three-particle fractional Hardy inequality and an angular Selberg-type identity", "abstract": "We establish a sharp three-particle fractional Hardy inequality for the Laplacian of order $s\\in(0,1)$ in dimension $d\\geq 4-2s$ (Theorem 1.1), involving an explicit intrinsically three-body interaction potential $V_{s,3}$. The inequality holds with the optimal two-particle fractional Hardy constant $C_{fH}(d,s)$, which is shown to be sharp relative to the fixed potential $V_{s,3}$. This potential $V_{s,3}$ strictly dominates the standard pairwise Coulomb-type interaction and captures genuine three-body effects. As a consequence, we derive a nontrivial many-particle fractional Hardy inequality for $N\\geq 3$, and, in the regime $N>d+1$, obtain an improved Coulomb-type inequality with a strictly larger constant, agreeing in spirit with the results of Hoffmann-Ostenhof et al. [M. Hoffmann-Ostenhof, T. Hoffmann-Ostenhof, A. Laptev, and J. Tidblom, \"Many-particle Hardy inequalities\", J. Lond. Math. Soc. 77 (2008), no. 2, 99-115] and Lundholm [D. Lundholm, \"Geometric extensions of many-particle Hardy inequalities\", J. Phys. A: Math. Theor. 48 (2015), no. 17, 175203]. The proof relies on a fractional ground-state representation method adapted to three-particle interactions, combined with an explicit evaluation of the resulting nonlocal interaction term. This evaluation is achieved through a new singular integral identity of Selberg-type (Theorem 1.2), extending the three-fold formula of Grafakos-Morpurgo [L. Grafakos and C. Morpurgo, \"A Selberg integral formula and applications\", Pacific J. Math. 191 (1999), no. 1, 85-94] beyond the radial setting. This identity provides the analytic mechanism underlying the emergence of the three-body potential and may be of independent interest in harmonic analysis.", "url": "https://arxiv.org/abs/2605.30586", "type": "理论", "summary": "1. 该工作建立了分数阶Laplacian在维数d≥4-2s时含显式三体势V_{s,3}的尖锐三粒子分数阶Hardy不等式。\n2. 主要技术在于通过分数阶基态表示适应三体相互作用，并利用新导出的非径向Selberg型角向奇异积分恒等式精确评估非定域项。\n3. 这推广至多粒子系统并改进Coulomb型不等式常数，且该Selberg型恒等式对调和分析可能具有独立价值。", "summary_source": "deepseek", "authors": [{"name": "Rajesh Mahadevan"}, {"name": "Franco Olivares"}, {"name": "Andres Zuniga"}], "featured_authors": [{"name": "Rajesh Mahadevan"}, {"name": "Franco Olivares"}, {"name": "Andres Zuniga"}], "author_count": 3}, {"id": "2605.30663", "category": "math-ph", "title": "Hubbard--Heisenberg Thermodynamic Comparison at Half Filling in a Fixed Staggered Field", "abstract": "We study the repulsive Hubbard model at half filling in the strong-coupling regime, with a staggered magnetic field of strength \\(h\\). The analysis is carried out in the canonical half-filled ensemble, with temperature measured on the Heisenberg scale \\(J_0(U)=4t^2/U\\). Uniformly for \\(|h|\\le h_0\\) and \\(\\beta J_0(U)\\ge \\ell_0\\), we prove finite-volume Hubbard--Heisenberg pressure estimates with errors uniform in the system size. These estimates pass to thermodynamic limits whenever the limiting pressures exist. The proof uses a strong-coupling unitary transformation which separates the singly occupied spin sector from sectors containing empty or doubly occupied sites. On the singly occupied sector, the effective Hamiltonian is compared with the Heisenberg reference Hamiltonian; the remaining sectors are controlled through a decomposition of the transformed partition function according to the set of empty or doubly occupied sites. For fixed positive staggered-field windows \\(I\\Subset(0,h_0]\\), the magnetisation comparison is then derived from the pressure comparison by convexity of finite-volume pressures. We also prove charge-sector suppression estimates, uniformly for \\(|h|\\le h_0\\): in the large positive-\\(U\\) Heisenberg-scale regime, the density of empty or doubly occupied sites and the double-occupancy density are small, and the squared staggered charge divided by \\(|\\Lambda|^2\\) is small. Thus the results give a quantitative Gibbs-state formulation of the strong-coupling picture in which the half-filled repulsive Hubbard model is described, at the Heisenberg scale, by effective antiferromagnetic spin degrees of freedom, while charge fluctuations are suppressed.", "url": "https://arxiv.org/abs/2605.30663", "type": "理论", "summary": "1. 该工作通过强耦合幺正变换，严格证明了半填充Hubbard模型在固定交错场下的压力与Heisenberg模型一致，误差均匀于系统尺寸。\n2. 技术关键在于将变换后的配分函数按空位或双占据位点分解，从而有效分离自旋与电荷涨落，并利用凸性推导磁化比较。\n3. 这为强耦合Hubbard模型在Heisenberg能标下退化为反铁磁自旋自由度提供了严格的吉布斯态表述，并为定量研究电荷抑制效应奠定了基础。", "summary_source": "deepseek", "authors": [{"name": "Tadahiro Miyao"}], "featured_authors": [{"name": "Tadahiro Miyao"}], "author_count": 1}, {"id": "2605.30806", "category": "math-ph", "title": "Novel energy preserving bijections between affine crystals for $U_q(\\widehat{\\mathfrak{sl}}_2)$ and integer partitions", "abstract": "Let $B(\\Lambda_a) \\, (a=0,1)$ be the crystal of the level 1 integrable irreducible highest weight representation of the affine quantum group $U_q(\\widehat{\\mathfrak{sl}}_2)$. We consider the crystal graphs of degree $n$ associated with the irreducible $(2r+1)$-dimensional (resp. $(2r+2)$-dimensional) $U_q(\\mathfrak{sl}_2)$ module in $B(\\Lambda_0)$ (resp. $B(\\Lambda_1)$). In this paper, we construct an explicit combinatorial procedure providing a bijection between the set of highest weight paths in these graphs with respect to the action of the Kashiwara operator $\\tilde{f}_{1}$, and the set of integer partitions of $n$ with sqrank (resp. rerank) $r$, which is a recently introduced partition statistic. As a byproduct, we also obtain a precise interpretation of the motif description of spinons suggested by Bernard-Pasquier-Serban in the spinon picture for Wess-Zumino-Witten conformal field theory models.", "url": "https://arxiv.org/abs/2605.30806", "type": "理论", "summary": "1. 该论文为仿射量子群U_q(sl_2 hat)的级1晶体B(Λ_0)和B(Λ_1)中与有限维sl_2模相关的度n晶体图，构造了与具sqrank或rerank统计量的n分拆集合间的一个显式组合双射。\n2. 其核心在于通过Kashiwara算子f̃_1下最高权路径与分拆统计量的精准对应，并由此精确解释了WZW共形场论中自旋子图像的motif描述，揭示了整数分拆与仿射晶体结构的深层联系。\n3. 该双射为可积模型和共形场论中的自旋子激发谱提供了组合基础，并启发在更一般的仿射量子群与分拆统计量间建立类似的精确对应关系。", "summary_source": "deepseek", "authors": [{"name": "Sota Miyazawa"}, {"name": "Taichiro Takagi"}], "featured_authors": [{"name": "Sota Miyazawa"}, {"name": "Taichiro Takagi"}], "author_count": 2}, {"id": "2605.31456", "category": "math-ph", "title": "Geometric Analysis of the Damped Harmonic Oscillator via the Lambert W Function", "abstract": "The underdamped harmonic oscillator is analyzed through the complex mapping $\\zeta = e^{-i\\varphi}we^{-w}$ with $w = \\beta t + i\\Omega t$, which transforms the dynamics into a logarithmic spiral. Within this framework, the displacement extrema correspond to crossings of the imaginary axis by $\\zeta(t)$, yielding the explicit times $t_n = (\\theta - \\varphi - \\pi/2 + n\\pi)/\\Omega$, where $\\theta = \\arctan(\\Omega/\\beta)$. The Lambert $W$ function provides closed-form solutions $t = -\\beta^{-1}W_k(-\\beta A/\\omega_0)$ for the times at which the spiral radius attains a given threshold $A$, covering both the rising and decaying branches. The quality factor $Q = \\omega_0/(2\\beta) = \\tfrac{1}{2}\\sec\\theta$ is directly encoded in the ray angle $\\theta$ of the $(u,v)$-plane. Key geometric invariants are derived: the winding number $N_\\varepsilon \\approx (Q/\\pi)\\ln(2Q/\\varepsilon)$ for large $Q$, the enclosed area $A = \\omega_0^2\\Omega/(8\\beta^3) \\approx Q^3$ in the lightly damped limit, and the energy decay $E(t) = E_0 e^{-\\omega_0 t/Q}$. Three methods for determining $Q$ from experimental data are compared: logarithmic decrement, ray-angle measurement, and spiral turn counting. The turn-counting method proves particularly robust for high-$Q$ systems, where successive amplitude peaks differ by tiny fractions. The framework unifies classical damped oscillations with complex analysis and special functions.", "url": "https://arxiv.org/abs/2605.31456", "type": "理论", "summary": "1. 该工作对欠阻尼谐振子进行几何分析，通过复映射ζ=e^{-iφ}we^{-w}将动力学转化为对数螺旋，并利用Lambert W函数导出振幅阈值时间、极值时刻等闭合解析解。\n2. 其技术核心在于将位移极值与螺旋穿越虚轴对应，赋予品质因子Q以射线角θ的几何意义，并推导了大Q极限下缠绕数、包围面积和能量衰减的标度律。\n3. 该框架统一了经典阻尼振荡与复分析和特殊函数，提出的螺旋圈数计数法在高Q系统中比传统对数减缩法更鲁棒，为实验Q值测量提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Arpan Sharma"}, {"name": "Bhargava Jogi"}, {"name": "Ken Roberts"}, {"name": "Muralikrishna Molli"}, {"name": "S.R. Valluri"}], "featured_authors": [{"name": "Arpan Sharma"}, {"name": "Bhargava Jogi"}, {"name": "Ken Roberts"}, {"name": "Muralikrishna Molli"}, {"name": "S.R. Valluri"}], "author_count": 5}, {"id": "2605.31553", "category": "math-ph", "title": "Numerical analytical continuation of multivariate hypergeometric functions", "abstract": "We present a general framework for the high-precision numerical evaluation of multivariate hypergeometric functions defined as solutions of holonomic systems of partial differential equations. Our approach adapts and extends methods originally developed for multi-loop Feynman integrals to the setting of hypergeometric functions of many variables. In particular, we construct Pfaffian systems for arbitrary multivariate hypergeometric functions by applying the Laporta reduction algorithm to suitable systems of differential relations. Next, we construct a numerical scheme based on the Frobenius method, which allows us to compute local power-series solutions with controlled precision and to transport them along prescribed paths in the space of variables. A central part of the paper is devoted to a systematic analysis of multivaluedness and branch structure: we show how the Frobenius method can be used to access different Riemann sheets in a controlled way and to track changes of the solution under analytic continuation around singular loci.", "url": "https://arxiv.org/abs/2605.31553", "type": "理论", "summary": "1. 该工作建立了一个高精度数值评估多元超几何函数的通用框架，基于全纯偏微分方程系统的解。\n2. 其核心卖点在于将多圈费曼积分的Laporta约化算法与Frobenius方法结合，构建Pfaffian系统并沿指定路径传输可控精度的局部幂级数解。\n3. 这为系统性处理多元超几何函数的多值性与分支结构提供了数值解析延拓手段，可推动相关参数化散射振幅与特殊函数计算。", "summary_source": "deepseek", "authors": [{"name": "M.A. Bezuglov"}, {"name": "B.A. Kniehl"}, {"name": "A.I. Onishchenko"}, {"name": "O.L. Veretin"}], "featured_authors": [{"name": "M.A. Bezuglov"}, {"name": "B.A. Kniehl"}, {"name": "A.I. Onishchenko"}, {"name": "O.L. Veretin"}], "author_count": 4}, {"id": "2605.31570", "category": "math-ph", "title": "Variational theory of Cosserat arches and affine tensors", "abstract": "Our purpose is to revisit the screw theory in light of the affine tensor formalism, introducing the co-momentum and momentum tensors. Our target-applications of the Euler-Poincaré equation are problems of mechanics such as the motion of the rigid body or the statics and the dynamics of Cosserat arches, in relation to the concept of momentum tensor. Using the framework of Ehresmann connections on the principal bundle of affine frames, we show that the Euler-Poincaré equation means that the momentum tensor is parallel-transported.", "url": "https://arxiv.org/abs/2605.31570", "type": "理论", "summary": "1. 该工作基于仿射张量形式重新审视螺旋理论，并引入共动量与动量张量，旨在将欧拉-庞加莱方程应用于Cosserat拱的静力学与动力学及刚体运动问题。\n2. 其核心在于利用仿射标架主丛上的Ehresmann联络，将欧拉-庞加莱方程诠释为动量张量的平行输运条件，从而统一描述弹性拱与刚体的变分结构。\n3. 这为连续介质力学与几何力学提供了联结仿射张量理论与动量传输的框架，可推广至更一般的广义连续统模型的变分分析。", "summary_source": "deepseek", "authors": [{"name": "Géry de Saxcé"}], "featured_authors": [{"name": "Géry de Saxcé"}], "author_count": 1}, {"id": "2605.30426", "category": "quant-ph", "title": "Detecting bipartite entanglement with PnCP maps and non-negative polynomials", "abstract": "Positive non-Completely Positive (PnCP) maps are an essential tool to detect entanglement since their characterization is a dual aspect of the separability problem. A recent algorithm proposed by Kelp et al. explains how to generate PnCP maps based on the construction of certain positive non-Sum-of-Squares polynomials. We implement this algorithm in a numerically robust way and propose a working version on GitHub. We theoretically demonstrate that the maps produced by the algorithm are indecomposable, localized on the boundary of the positive cone and show that they are inequivalent with most other known PnCP maps. We numerically investigate their entanglement power, demonstrating notably that they are capable of detecting PPT entangled states that most criteria fail to detect.", "url": "https://arxiv.org/abs/2605.30426", "type": "理论+数值", "summary": "1. 该工作实现了一种基于正非平方和多项式生成正非完全正映射的数值稳健算法，并发布了开源代码。\n2. 其技术核心在于证明生成的映射具有不可分解性、位于正锥边界，且能检测大多数准则失效的PPT纠缠态。\n3. 这为纠缠检测，特别是弱纠缠态的识别，提供了新的解析与数值工具，并启发更高效映射的构造。", "summary_source": "deepseek", "authors": [{"name": "Gaël Massé"}, {"name": "Mounir Rezig"}, {"name": "Paul Catala"}, {"name": "Santiago Scheiner"}, {"name": "Laia Serradesanferm Córdoba"}, {"name": "Enky Oudot"}, {"name": "Damian Markham"}], "featured_authors": [{"name": "Gaël Massé"}, {"name": "Mounir Rezig"}, {"name": "Paul Catala"}, {"name": "Laia Serradesanferm Córdoba"}, {"name": "Enky Oudot"}, {"name": "Damian Markham"}], "author_count": 7}, {"id": "2605.30428", "category": "quant-ph", "title": "Graph automorphisms to obtain Clifford symmetries in open and closed qudit models", "abstract": "In the recent article [ arXiv:2605.18966 ], we demonstrated that finding Clifford symmetries can be mapped to a Graph Automorphism (GA) problem. Here, we provide an algorithm to obtain such symmetries on general qudit systems, that works on the principle of encoding Clifford invariants of a Hamiltonian onto properties of a graph. Labelling Hamiltonian terms as vertices, a permutation of such vertices that respects the Clifford invariants (a GA) is both a valid Clifford, and a symmetry up to phase correction checks. We test this on multiple physical models and discuss the scaling with respect to the number of qudits and Pauli strings, as well as various strategies for optimisation in different regimes. We further show that the graph automorphism representation of Clifford symmetries can be expanded to open quantum systems.", "url": "https://arxiv.org/abs/2605.30428", "type": "理论+数值", "summary": "1. 该工作提出将一般qudit系统的Clifford对称性寻找映射为图自同构问题的算法。\n2. 其卖点在于将哈密顿量的Clifford不变量编码为图顶点标签，使有效对称性对应于保持这些标签的置换。\n3. 该图表示可扩展至开放量子系统，为多体量子模型对称性分析和优化提供了可规模化方案。", "summary_source": "deepseek", "authors": [{"name": "Charlie Nation"}, {"name": "Rick P. A. Simon"}, {"name": "Shreya Banerjee"}, {"name": "Francesco Martini"}, {"name": "Alessandro Ricottone"}, {"name": "Federico Cerisola"}, {"name": "Luca Dellantonio"}], "featured_authors": [{"name": "Charlie Nation"}, {"name": "Rick P. A. Simon"}, {"name": "Shreya Banerjee"}, {"name": "Alessandro Ricottone"}, {"name": "Federico Cerisola"}, {"name": "Luca Dellantonio"}], "author_count": 7}, {"id": "2605.30429", "category": "quant-ph", "title": "Attention-based optimizer for symmetry finding", "abstract": "Finding symmetries is crucial for understanding physical models. In this work, we present an optimization framework that searches Pauli symmetries of Hamiltonians, merging the fields of machine learning with automated symmetry finding. Built on a Set-Transformer architecture, our framework uses self-attention to encode the pairwise and higher-order correlations among the Pauli-Strings. The relations are then decoded as a candidate, which is further optimized with a custom commutation-based objective, and mapped to a symmetry of the input Hamiltonian. We apply our method to random Pauli Hamiltonians, periodic one and two dimensional transverse-field Ising model and the Toric code. We show that for physical Hamiltonians (Ising and Toric), our framework succeeds with near-deterministic probability while providing substantial advantage compared to state-of-the-art strategies. For random Pauli Hamiltonians, we estimate the required computational resources, specifically the number of parallel starts and the number of GPUs, to find a symmetry with high success probability under fixed design specifications.", "url": "https://arxiv.org/abs/2605.30429", "type": "理论+数值", "summary": "1. 该工作提出了一个基于注意力机制的优化框架，用于自动搜索哈密顿量的泡利对称性。\n2. 其核心在于利用Set-Transformer自注意力编码泡利字符串的高阶关联，并以对易关系为目标优化候选对称性。\n3. 该方法在物理哈密顿量上实现了近确定性成功，并为随机系统中对称性发现的计算资源需求提供了估计。", "summary_source": "deepseek", "authors": [{"name": "Shreya Banerjee"}, {"name": "Vinodh Raj Rajagopal Muthu"}, {"name": "Charlie Nation"}, {"name": "Rick P.A. Simon"}, {"name": "Francesco Martini"}, {"name": "Alessandro Ricottone"}, {"name": "Federico Cerisola"}, {"name": "Luca Dellantonio"}], "featured_authors": [{"name": "Shreya Banerjee"}, {"name": "Vinodh Raj Rajagopal Muthu"}, {"name": "Charlie Nation"}, {"name": "Alessandro Ricottone"}, {"name": "Federico Cerisola"}, {"name": "Luca Dellantonio"}], "author_count": 8}, {"id": "2605.30572", "category": "quant-ph", "title": "Mitigating Noise-Induced Barren Plateaus Using a Non-Unitary Ansatz: Application to Molecular Electronic Transport", "abstract": "Variational quantum algorithms (VQAs) offer a promising route toward simulating many-body quantum systems on noisy intermediate-scale quantum (NISQ) hardware. However, their scalability is severely limited by noise-induced barren plateaus (NIBPs), where hardware noise causes the gradients of the cost function to vanish exponentially with circuit depth, rendering optimization impossible. In this work, we demonstrate that introducing nonunitary elements into the variational ansatz can mitigate NIBPs in open-quantum systems. Using an analytically tractable infinite-range dissipative Ising model, we show that a nonunitary ansatz restores finite gradients in the presence of depolarizing noise, enabling convergence to the correct symmetry-broken steady state. We also develop a Floquet-type variational ansatz in which each layer repeats the same parameters, reducing the deep variational circuit to an effective quantum channel whose fixed points can be analyzed directly. We then extend these ideas to a realistic quantum-chemistry system by simulating electron transport through Oligophenylethynylene-sulfurmethyl (OPE-SMe) using Hamiltonians and jump operators of the model derived from first-principles polarizable QM/MM calculations. Our results show that nonunitary variational ansätze provide a scalable and physically grounded route for simulating open-system steady states on NISQ hardware, offering a pathway to overcoming one of the limitations of current quantum hardware.", "url": "https://arxiv.org/abs/2605.30572", "type": "理论+数值", "summary": "1. 该工作提出通过引入非酉变分子来缓解噪声诱导的贫瘠高原，并应用于OPE-SMe分子电子输运的量子模拟。\n2. 其核心在于非酉元素在耗散开放系统中恢复有限梯度，使变分优化收敛至正确的对称破缺稳态，并通过Floquet型变分子将深层电路约化为有效量子信道。\n3. 这为NISQ硬件上可扩展的开系统稳态仿真提供了物理驱动的可行途径，有望突破当前量子硬件在变分算法中的优化瓶颈。", "summary_source": "deepseek", "authors": [{"name": "Sasanka Dowarah"}, {"name": "Abeda Sultana Shamma"}, {"name": "Yazdan Maghsoud"}, {"name": "G. Andrés Cisneros"}, {"name": "Michael Kolodrubetz"}], "featured_authors": [{"name": "Sasanka Dowarah"}, {"name": "Abeda Sultana Shamma"}, {"name": "Yazdan Maghsoud"}, {"name": "G. Andrés Cisneros"}, {"name": "Michael Kolodrubetz"}], "author_count": 5}, {"id": "2605.30724", "category": "quant-ph", "title": "Research progress on quantum neural networks and quantum machine learning", "abstract": "Machine learning holds fundamental computational significance due to the increasing demand for efficient solutions to complex tasks in data analysis, pattern recognition, and optimization, which are essential for addressing the multifaceted challenges of modern society. As the volume of data proliferates at an unprecedented rate, the need for more powerful machine learning strategies becomes increasingly evident. Quantum neural networks (QNNs) represent an emerging and transformative research field that seeks to harness the unique principles of quantum mechanics to enhance the capabilities of machine learning algorithms. This survey examines various QNN approaches, including fully connected QNNs, quantum convolutional neural networks, equivariant QNNs, quantum Hopfield networks, quantum Boltzmann machines, quantum reservoir computing, and composite networks for quantum reinforcement learning, quantum generative learning, and quantum transfer learning. We summarize the relevant investigations on their performance, including learning accuracy, training time, and resource requirements, etc. Each QNN type has unique strengths and weaknesses, offering diverse solutions for different applications.", "url": "https://arxiv.org/abs/2605.30724", "type": "数值", "summary": "1. 该工作系统综述了全连接、卷积、等变、Hopfield等各类量子神经网络及量子强化、生成与迁移学习复合网络。\n2. 其核心在于对比分析各类量子神经网络在学习精度、训练时间与资源需求等方面的性能权衡。\n3. 这为针对具体数据与任务需求选择最优量子机器学习架构提供了系统性参考。", "summary_source": "deepseek", "authors": [{"name": "Yifan Sun"}, {"name": "Boyuan Sun"}, {"name": "Jiameng Tian"}, {"name": "Xiangdong Zhang"}], "featured_authors": [{"name": "Yifan Sun"}, {"name": "Boyuan Sun"}, {"name": "Jiameng Tian"}, {"name": "Xiangdong Zhang"}], "author_count": 4}, {"id": "2605.30732", "category": "quant-ph", "title": "How To Track Qubits Through Space and Time (Or: Sailing in a Quantum Boat)", "abstract": "While quantum position verification aims to certify a prover's location using quantum information, existing security definitions only guarantee that part of the successful adversarial party is in the claimed location. This leaves open the possibility that a distributed team of adversaries can jointly simulate a prover in a way that defeats the intended meaning of ``being at a location'' in position-based cryptography. We introduce stronger notions of position verification that we call quantum localization, which requires that there is a specified, unclonable state at the verified spacetime point -- and that this state can be found nowhere else. We show that quantum localization leads naturally to a meaningful notion of trajectory verification, in which quantum information is verifiably tracked through space and time. We construct quantum localization and trajectory verification protocols using quantum anchor states, which generalize coset states from unclonable cryptography. The security of our schemes is proven in the classical oracle (i.e. ideal obfuscation) model, which can be heuristically instantiated in the plain model using post-quantum indistinguishability obfuscation. We also introduce and instantiate the concept of functionality localization, which guarantees that the adversary has the ability to compute a secret function at the verified spacetime point, and this function cannot be computed anywhere else. This raises the intriguing possibility of localizing computational capabilities in space and time. More broadly, we believe our notions of quantum localization and our feasibility results provide stronger foundations for position-based cryptography.", "url": "https://arxiv.org/abs/2605.30732", "type": "理论+数值", "summary": "1. 该工作提出量子定位与轨迹验证的新安全概念，要求被验证时空点存在不可克隆的指定量子态，并构建了基于量子锚定态的协议。\n2. 其核心卖点是将陪集态推广为锚定态，在经典预言机模型（可启发式例化于后量子不可区分混淆）下证明安全性，并引入功能定位概念。\n3. 这为位置密码学提供了更严格的基础，并开辟了时空计算能力局域化的可能性，推动不可克隆资源在量子网络中的应用。", "summary_source": "deepseek", "authors": [{"name": "James Bartusek"}, {"name": "Zikuan Huang"}, {"name": "Leo Orshansky"}, {"name": "Henry Yuen"}], "featured_authors": [{"name": "James Bartusek"}, {"name": "Zikuan Huang"}, {"name": "Leo Orshansky"}, {"name": "Henry Yuen"}], "author_count": 4}, {"id": "2605.30765", "category": "quant-ph", "title": "Real-Time Quantum Error Correction System Stack: Architecture, Algorithms, and Engineering Practice", "abstract": "Quantum error correction (QEC) is transitioning from physical feasibility demonstrations to systems engineering challenges. Google has achieved below-threshold performance on distance-5/7 surface codes, while Riverlane and Rigetti have demonstrated hardware-integrated low-latency feedback loops. These milestones indicate that the core challenge of real-time decoding has shifted from algorithmic capability to system-level engineering. However, a substantial engineering gap remains between laboratory demonstrations and scalable fault-tolerant quantum computing (FTQC). This white paper addresses three questions: (1) Where are the real bottlenecks in real-time QEC: beyond average decoder speed, the constraints lie in QEC round time, tail latency, and end-to-end data path coordination; (2) How mature are mainstream decoder algorithms: we benchmark the major decoders for both surface codes and quantum low-density parity-check (qLDPC) codes, evaluating their real-time readiness; (3) What system stack do we propose: a six-layer reference architecture from syndrome acquisition to logical operations, with interface definitions and latency budget models. Our results quantify the gap between current decoder performance and real-time requirements, and identify the architectural choices needed to close it.", "url": "https://arxiv.org/abs/2605.30765", "type": "理论+数值", "summary": "1. 该工作系统分析了实时量子纠错的系统工程瓶颈，并提出了从症候获取到逻辑操作的六层参考架构.。\n2. 核心卖点在于量化了主流解码器在表面码与qLDPC码上的实时就绪差距，识别出QEC轮次时间、尾部延迟及端到端数据路径协调为关键约束.。\n3. 这为从实验室演示向可扩展容错量子计算的工程跃迁提供了严格的延迟预算框架与架构选择依据.。", "summary_source": "deepseek", "authors": [{"name": "Yaojian Chen"}, {"name": "Chun-Yang Luan"}, {"name": "Peilin Zheng"}, {"name": "Xianghong Zeng"}, {"name": "Jia-Yi Hou"}, {"name": "Zhuo Fu"}, {"name": "Yirong Jin"}, {"name": "Fei Wang"}, {"name": "Guangwen Yang"}, {"name": "Dingshun Lv"}], "featured_authors": [{"name": "Yaojian Chen"}, {"name": "Chun-Yang Luan"}, {"name": "Peilin Zheng"}, {"name": "Fei Wang"}, {"name": "Guangwen Yang"}, {"name": "Dingshun Lv"}], "author_count": 10}, {"id": "2605.30768", "category": "quant-ph", "title": "Geometric dependence of critical-current variation in Al/AlO${\\rm _x}$/Al Josephson junctions: a model-based analysis", "abstract": "Achieving uniform critical current across Josephson junctions is essential for the large-scale integration of superconducting quantum circuits. In this work, we statistically analyzed the variation of the critical current of Al/AlO${\\rm _x}$/Al junctions using room-temperature tunnel resistance statistics, and identified the dominant contribution among the modeled sources of the variation based on their dependence on geometry and deposition conditions of junctions. Our model-based analysis reveals that fluctuations in the Al film thickness play the dominant role among the modeled contributing factors. Based on this analysis, we found that, in Dolan-bridge double-angle deposition, adopting a deposition angle of 30-degree for bilayer junctions significantly improves uniformity, yielding a relative standard deviation of 1.2% (0.5%) across a 9.75 mm (1.5 mm) square region.", "url": "https://arxiv.org/abs/2605.30768", "type": "理论", "summary": "1. 该工作通过室温隧道电阻统计分析了Al/AlOx/Al约瑟夫森结临界电流涨落的几何依赖性，并基于模型识别出主导来源。\n2. 其核心发现是铝膜厚度波动为临界电流非均匀性的主因，并通过Dolan桥双角度沉积采用30度角将9.75 mm方形区域内相对标准差降至1.2%。\n3. 这为超导量子电路大规模集成中关键结均匀性优化提供了明确的工艺参数指导，并启发了其他金属异质结的研究。", "summary_source": "deepseek", "authors": [{"name": "K. Kakuyanagi"}, {"name": "N. Teran"}, {"name": "H. Toida"}, {"name": "S. Saito"}], "featured_authors": [{"name": "K. Kakuyanagi"}, {"name": "N. Teran"}, {"name": "H. Toida"}, {"name": "S. Saito"}], "author_count": 4}, {"id": "2605.30798", "category": "quant-ph", "title": "Eigenstate chaos in the presence of non-Abelian symmetries", "abstract": "The eigenstate thermalization hypothesis (ETH) posits that energy eigenstates encode local properties of the microcanonical ensemble. Motivated by recent interest in the physics of non-commuting conserved charges and the non-Abelian ETH, we study chaotic eigenstates in the presence of symmetries described by general compact Lie groups, such as SU(2). By applying non-Abelian symmetry resolution, we develop a non-Abelian microcanonical entropy and relate this entropy to the entanglement entropy of chaotic eigenstates. We find that microcanonical entropy is closely related to the symmetry-resolved entanglement entropy, which differs from conventional entanglement entropy by a universal logarithmic correction. Our results depend on the global Casimir charge, e.g. total spin. At finite charge density, we find a logarithmic enhancement to conventional entanglement entropy. At zero density, we find no such correction to entanglement entropy, but a logarithmic reduction to microcanonical entropy and symmetry-resolved entanglement entropy. We discuss the implications of our approach for non-Abelian eigenstate thermalization.", "url": "https://arxiv.org/abs/2605.30798", "type": "理论+数值", "summary": "1. 该工作将本征态热化假说扩展至具有非阿贝尔紧致李群对称性的混沌系统，通过非阿贝尔对称性分辨方法研究本征态纠缠结构。\n2. 其核心是建立非阿贝尔微正则熵与对称性分辨纠缠熵间的严格关系，发现全局卡西米尔荷导致普通纠缠熵的对数增强或微正则熵的对数缩减。\n3. 这为非交换守恒荷系统的本征态热化提供了统一理论框架，并启示对称性分辨纠缠可作为诊断非阿贝尔混沌的新工具。", "summary_source": "deepseek", "authors": [{"name": "Siddharth Jindal"}, {"name": "Pavan Hosur"}], "featured_authors": [{"name": "Siddharth Jindal"}, {"name": "Pavan Hosur"}], "author_count": 2}, {"id": "2605.30866", "category": "quant-ph", "title": "Generative Quantum Data Embeddings for Supervised Learning", "abstract": "Many practically relevant applications of quantum machine learning involve classical data, for which performance depends critically on how inputs are embedded into quantum states. Yet the use of a fixed embedding circuit ansatz remains standard practice. We propose an energy-based generative learning framework that synthesizes gate sequences to optimize embedding structures and refine data-tailored parameters, using a fidelity-based surrogate objective to guide the search toward improved class distinguishability. Empirically, the method improves classification performance across diverse settings, while also revealing datasets where architecture search within the present embedding family yields only limited additional gains. We explain this saturation by deriving bounds on the achievable empirical risk in terms of the Wasserstein distance in the input space, showing that classical data geometry provides an \\emph{a priori} diagnostic for regimes in which substantial gains from embedding optimization are unlikely. The results establish a practically useful and theoretically motivated framework for searching effective quantum data embeddings through generative optimization, with the attainable gains diagnosed through the geometry of the underlying classical data.", "url": "https://arxiv.org/abs/2605.30866", "type": "理论+数值", "summary": "1. 该工作提出了一种基于能量的生成学习框架，通过合成门序列优化量子数据嵌入的电路结构与参数，以提升监督学习分类性能。\n2. 其核心在于利用保真度代理目标指导嵌入优化，并借助输入空间Wasserstein距离导出经验风险上界，从而理论预判优化收益的饱和区间。\n3. 该框架为量子机器学习中数据嵌入的生成式优化提供了理论诊断工具，启发基于经典数据几何先验设计高效嵌入策略。", "summary_source": "deepseek", "authors": [{"name": "Jaewoong Heo"}, {"name": "Daniel K. Park"}], "featured_authors": [{"name": "Jaewoong Heo"}, {"name": "Daniel K. Park"}], "author_count": 2}, {"id": "2605.30967", "category": "quant-ph", "title": "Evaluating higher-order product formulae for molecular ground-state energy estimation", "abstract": "We evaluate deterministic higher-order product formulae for molecular ground-state energy estimation. Motivated by recent fault-tolerant architectures in which non-Clifford operations may be generated more locally and cheaply than in conventional assumptions, we re-examine such formulae as practical candidates for quantum chemistry. Using one-dimensional hydrogen chains from $\\mathrm{H}_2$ to $\\mathrm{H}_{15}$ as benchmarks, we estimate both the total gate count and the depth of $R_Z$-rotation layers required to reach a target energy error. To make this comparison feasible at larger system sizes, we use a perturbative method to estimate the eigenvalue error induced by each product formula and thereby evaluate the cost of the corresponding phase-estimation procedure. Among the previously considered formulae, the eighth-order construction introduced by Morales et al. [M. E. S. Morales et al., \"Greatly improved higher-order product formulae for quantum simulation,\" arXiv:2210.15817v2 (2024)] minimizes both cost metrics in the benchmark at a chemically relevant target error. We also find that increasing the formal order does not automatically reduce the total cost: near chemical accuracy, the tenth-order formula introduced in the same work can be less efficient than the eighth-order one. Motivated by this observation, we construct a new fourth-order formula; it achieves the lowest total gate count among the formulae considered for all H-chain instances near chemical accuracy and over much of the 0.1-10 mHa target-error window for most instances, while also reducing the $R_Z$-layer depth. These results clarify how deterministic higher-order product formulae should be selected for molecular ground-state energy estimation.", "url": "https://arxiv.org/abs/2605.30967", "type": "数值", "summary": "1. 该工作以从H₂到H₁₅的一维氢链为基准，利用微扰法估计特征值误差，系统评估了确定性高阶乘积公式在分子基态能量估计中的总门数和R_Z旋转层深度成本。\n2. 其技术卖点在于发现非Clifford操作更便宜的新架构下，Morales等人的八阶公式在化学相关目标误差下同时最小化两种成本，而十阶公式效率不升反降；据此构造的新四阶公式在接近化学精度时实现了所有实例中最低总门数，并减少了R_Z层深度。\n3. 这一结果启示在高阶乘积公式选择中，形式阶次与成本并非单调关系，应基于目标误差和系统大小实际评估，为实用量子化学模拟的算法优化提供了明确依据。", "summary_source": "deepseek", "authors": [{"name": "Hiromu Abe"}, {"name": "Keita Kanno"}, {"name": "Ryosuke Kimura"}, {"name": "Masahiko Kamoshita"}, {"name": "Kosuke Mitarai"}], "featured_authors": [{"name": "Hiromu Abe"}, {"name": "Keita Kanno"}, {"name": "Ryosuke Kimura"}, {"name": "Masahiko Kamoshita"}, {"name": "Kosuke Mitarai"}], "author_count": 5}, {"id": "2605.31006", "category": "quant-ph", "title": "Quantum State Preparation via Neural Network Encoding in Quantum Machine Learning", "abstract": "A central challenge in quantum machine learning is the state preparation bottleneck that describes the prohibitive computational cost of loading high-dimensional classical data into a quantum state. Although amplitude encoding can represent $2^n$-dimensional data using only $n$ qubits in principle, preparing arbitrary states remains computationally expensive, typically requiring variational optimization of a parameterized quantum circuit for each individual data instance. In this work, we propose a method that avoids iterative optimization by training a classical neural network to map input data directly to the continuous parameters of a fixed quantum circuit. We demonstrate the generation of quantum image states with high fidelity on data not seen during training. Since all optimization is performed once during training, the resulting model encodes new inputs in a single inference step, providing a scalable pathway for data loading in near-term quantum algorithms. We validate our method on the MNIST and Fashion-MNIST datasets, achieving fidelities up to 0.992 on unseen images and reducing the per-data-instance runtime by more than 5000-fold.", "url": "https://arxiv.org/abs/2605.31006", "type": "理论+数值", "summary": "1. 该工作提出利用经典神经网络将输入数据直接映射到固定量子电路的连续参数，避免了对每个数据实例进行变分优化。\n2. 其核心优势在于训练后对新数据只需单次推理即可完成量子态制备，在MNIST和Fashion-MNIST上实现高达0.992的保真度，并将每实例运行时降低5000倍以上。\n3. 这为近期量子算法中的数据加载瓶颈提供了一条可扩展的路径，有望应用于更广泛的高维经典数据量子编码任务。", "summary_source": "deepseek", "authors": [{"name": "Kevin W. Aoun"}, {"name": "Florian J. Kiwit"}, {"name": "Carlos A. Riofrío"}, {"name": "Samer Saab Jr."}, {"name": "Charbel Al Bateh"}, {"name": "Joe Tekli"}, {"name": "Andre Luckow"}], "featured_authors": [{"name": "Kevin W. Aoun"}, {"name": "Florian J. Kiwit"}, {"name": "Carlos A. Riofrío"}, {"name": "Charbel Al Bateh"}, {"name": "Joe Tekli"}, {"name": "Andre Luckow"}], "author_count": 7}, {"id": "2605.31347", "category": "quant-ph", "title": "Entanglement distribution protocols under imperfect fidelity and quantum memory conditions", "abstract": "The rapid development of quantum computers and sensors urges for the development of a quantum Internet capable of transmitting quantum bits over long distances. Photons used for quantum data transfer are fragile over time and sensitive to their environment, so that they cannot be directly used over long distances. To remedy this problem, long distance paths are segmented into shorter links and entangled pairs of photons are distributed over these links and swapped to create end-to-end entangled pairs over long distances, eventually used for teleportation. In this paper, we develop an existing protocol taking account of fidelity and imperfect memories. We shorten the execution time and thus increase its link success probability creating the so-called Locally Heralded Distribution (LHD). It turns out that the proposed protocol outperforms some previous protocols. We benchmark through simulation the performances of protocols considered in this paper by using a blind entanglement protocol as a baseline.", "url": "https://arxiv.org/abs/2605.31347", "type": "理论+数值", "summary": "1. 该工作考虑量子存储器和保真度不完美条件，发展了纠缠分发协议，提出本地宣告分发（LHD）方案。\n2. 其核心在于通过缩短协议执行时间来提升链路成功概率，并在仿真中优于先前协议。\n3. 这为构建实用量子互联网中中继节点的高效纠缠分发提供了可行途径和性能基准。", "summary_source": "deepseek", "authors": [{"name": "Claire Mesny"}, {"name": "Fabrice Guillemin"}, {"name": "Claire Goursaud"}], "featured_authors": [{"name": "Claire Mesny"}, {"name": "Fabrice Guillemin"}, {"name": "Claire Goursaud"}], "author_count": 3}, {"id": "2605.31379", "category": "quant-ph", "title": "Rényi divergences and binary state discrimination error exponents for fermionic quasi-free states", "abstract": "The trade-off relations between the two types of error probabilities in binary i.i.d. quantum state discrimination can be expressed by single-copy formulas in terms of the Petz-type and the sandwiched Rényi divergences of the two states representing the two hypotheses. In the non-i.i.d. setting, the error exponents can usually be expressed in terms of regularized Rényi divergences, which do not admit explicit formulas in general. Here, we consider a class of states, translation-invariant and gauge-invariant quasifree states on doubly infinite fermionic chains, and give explicit formulas for a wide range of regularized Rényi divergences between such states, including $(\\alpha,z)$, log-Euclidean, maximal, measured, and the recently introduced integral Rényi divergences. We show that the case where there is a single mode at each lattice site becomes asymptotically classical, with all the different types of regularized Rényi divergences being equal, while in the case of multiple modes per site, non-commutativity persists under regularization, and for any fixed $\\alpha$, the regularized Rényi $(\\alpha,z)$-divergences give different regularized values for different $z$ parameters in general. We also generalize a previous construction from [Bunth, Maróti, Mosonyi, Zimborás, Lett.~Math.~Phys.~113:(7), 2023] to the case of multiple modes per lattice site to obtain a large class of states exhibiting super-exponential decay of the discrimination error probabilities.", "url": "https://arxiv.org/abs/2605.31379", "type": "理论", "summary": "1. 该工作推导了双无穷费米子链上平移与规范不变的准自由态间多种正则化Rényi散度的显式公式，并揭示了其在二元独立同分布与非独立同分布量子态判别错误指数中的刻画作用。\n2. 其技术卖点在于单模时所有正则化Rényi散度趋于一致、表现出经典渐近行为，而多模时非对易性导致不同参数化散度取值分化，且正则化保持一般情形下的不等价性。\n3. 这为费米子准自由态的非渐近量子判别提供了精确解析刻画，并推广了具有超指数错误概率衰减的态族构造，启发对更广泛量子态族中正则化散度与错误指数关系的定量理解。", "summary_source": "deepseek", "authors": [{"name": "Milán Mosonyi"}, {"name": "Gábor Maróti-Zareczky"}], "featured_authors": [{"name": "Milán Mosonyi"}, {"name": "Gábor Maróti-Zareczky"}], "author_count": 2}, {"id": "2605.31441", "category": "quant-ph", "title": "Intrinsic locality dimension of quantum codes", "abstract": "Quantum error-correcting codes are a cornerstone of quantum computing, with broad and profound connections to physics and mathematics. In this work, we introduce the notion of intrinsic locality dimension of stabilizer codes that is independent of any background geometry and naturally incorporates flexible architectures and accommodates noninteger values, drawing on mathematical machinery from fractal geometry and geometric measure theory. Important scenarios include topological codes and algebraic codes such as bivariate-bicycle-type codes. We show how the intrinsic dimension serves as a fundamental organizing parameter that unifies code properties. In particular, we prove general limitations on code parameters and compatible fault-tolerant logical gates induced by the intrinsic dimension, generalizing the Bravyi--Poulin--Terhal and Bravyi--König bounds for regular topological codes, respectively. Furthermore, we discuss implications on thermal properties, presenting a conditional no-go result for self-correcting quantum memories in dimension $3-\\epsilon$ for any $\\epsilon>0$. Our theory lays a versatile and unifying mathematical foundation for studying the fundamental capabilities and geometric implementations of quantum error correction and fault tolerance.", "url": "https://arxiv.org/abs/2605.31441", "type": "理论", "summary": "1. 该工作引入稳定子码的内在局域维度概念，独立于背景几何且可非整数，基于分形几何与几何测度论定义。\n2. 内在维度作为统一组织参数约束码参数与相容容错逻辑门，推广了拓扑码的Bravyi–Poulin–Terhal与Bravyi–König界限。\n3. 该理论为量子纠错与容错的基本限制及几何实现提供统一数学基础，并给出3ε维度自纠正量子存储的条件性否定结论。", "summary_source": "deepseek", "authors": [{"name": "Yimin Lu"}, {"name": "Esther Xiaozhen Fu"}, {"name": "Zi-Wen Liu"}], "featured_authors": [{"name": "Yimin Lu"}, {"name": "Esther Xiaozhen Fu"}, {"name": "Zi-Wen Liu"}], "author_count": 3}, {"id": "2605.31448", "category": "quant-ph", "title": "Pseudoentanglement in constant depth: How trivial states can have non-trivial entanglement structure", "abstract": "We construct a family of 2D-local constant-depth quantum circuits that output states whose entanglement entropy across a specified cut cannot be estimated in quantum polynomial time. As constant-depth quantum circuits can be learned from polynomially many quantum samples, our resulting pseudoentangled states are implicitly public-key and not pseudorandom. This separates pseudoentanglement from pseudorandomness in the shallow-circuit regime: the former is possible, while the latter is not. The construction is based on the quantum intractability of the Dense-Sparse Learning Parity with Noise problem introduced in [DJ25] and uses a bounded-fan-in, bounded-fan-out classical randomized encoding for linear maps $\\mathbf{x} \\mapsto \\mathbf{Mx},$ which could be of independent interest. As applications, we obtain quantum hardness for the problem of learning the entanglement structure (across a fixed cut) of the ground-state of 1D and 2D local Hamiltonians. The 1D Hamiltonian has an inverse polynomial gap, whereas the 2D one has a constant gap. This complements the result of [BZZ24] that showed only factoring-based hardness for the 1D case, though achieving a volume versus area entanglement difference.", "url": "https://arxiv.org/abs/2605.31448", "type": "理论", "summary": "1. 该工作构造了一族二维局域常深度量子电路，其输出态在指定切割下的纠缠熵无法被量子多项式时间算法估计，且因电路可被学习而具有隐式公钥性质，区别于伪随机态。\n2. 技术核心是利用稠密-稀疏带噪学习奇偶性问题的量子难解性，并采用有界扇入扇出经典随机化编码实现线性映射，从而在浅层电路体制中实现伪纠缠与伪随机性的分离。\n3. 应用上，该结果证明学习一维及二维局域哈密顿量基态纠缠结构是量子困难的，前者能隙为逆多项式，后者为常数，补全了此前仅基于因子分解的一维情形证明，且相关编码方法可能具有独立价值。", "summary_source": "deepseek", "authors": [{"name": "Alexandru Gheorghiu"}], "featured_authors": [{"name": "Alexandru Gheorghiu"}], "author_count": 1}, {"id": "2605.31472", "category": "quant-ph", "title": "(Non-)Traversable Quantum Phase Transitions", "abstract": "Quantum phase transitions manifest as an abrupt change in the ground state of a many-body system; yet it is an open question whether this sudden change necessarily precludes a continuous dynamical connection between the two phases. We introduce a classification of quantum phase transitions based on this geometric aspect of the ground-state manifold, that differs from known classifications. By leveraging the framework of counterdiabatic driving, we explicitly construct schedules that dynamically connect one phase to another. This strategy allows us to uncover a large class of quantum phase transitions, where the states on both sides are separated only by a finite geometric distance in the thermodynamic limit. We term such transitions traversable, since exact counterdiabatic driving links the two phases via a finite dynamical protocol in the thermodynamic limit. We show that multiple known transitions fall into this class -- e.g., symmetry-breaking transitions obeying hyperscaling and discontinuous transitions with an enhanced continuous symmetry. We further show the existence of quantum phase transitions that cannot be crossed dynamically even with the help of nonlocal counterdiabatic driving, as they would require divergent amplitudes and frequencies. Geometrically, these nontraversable transitions correspond to an infinite distance separating the two phases of matter; we show that the class comprises continuous transitions exhibiting mean-field universality, and discontinuous transitions arising from the competition between metastable minima. Our geometric classification goes beyond the known taxonomy, is independent of local order parameters and renormalization group fixed points, and has direct implications for the complexity of state preparation and adiabatic quantum computation.", "url": "https://arxiv.org/abs/2605.31472", "type": "理论", "summary": "1. 该工作基于基态流形的几何距离引入量子相变新分类，并通过逆绝热驱动显式构造动态连接两相的方案。\n2. 其核心在于揭示可穿越相变在热力学极限下仅需有限几何距离，而不可穿越相变需发散振幅与频率，且分类独立于局域序参量和重正化群不动点。\n3. 这为量子态制备复杂度与绝热量子计算提供了几何判据，并拓展了相变动力学连接的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Federico Balducci"}, {"name": "Paul M. Schindler"}, {"name": "Andrea Solfanelli"}, {"name": "Marin Bukov"}], "featured_authors": [{"name": "Federico Balducci"}, {"name": "Paul M. Schindler"}, {"name": "Andrea Solfanelli"}, {"name": "Marin Bukov"}], "author_count": 4}, {"id": "2605.31544", "category": "quant-ph", "title": "More efficient Clifford+T synthesis for small-angle rotations and application to Trotterization", "abstract": "Clifford+T synthesis of rotation gates is an important routine in fault-tolerant quantum compilation. While Clifford+T synthesis is scalable, it has a high overhead of tens of T gates per rotation in practice, translating to high resource estimates for many fault-tolerant algorithms. However, these well-known results, including those using probabilistic mixtures [Quantum 7, 1208 (2023)], are independent of the rotation angle $\\theta$, requiring $O(\\log 1/\\delta)$ T gates. We show that it is possible to do much better for small angles, reducing the T cost to $\\tilde O(\\theta^2/\\delta)$, and returning to existing $O(\\log1/\\delta)$ results in the worst case. This is particularly important since many algorithms, such as Trotterization, are dominated by small-angle rotations. Further, we perform a detailed theoretical and numerical study of quasi-probabilities, which can further reduce the total T cost of large circuits by orders of magnitude with only a small overhead in sample complexity. We also develop a scheme based on quasi-probability mixtures of Clifford+T fallback channels. We derive new $\\theta$-dependent formulas that can be used for resource estimation of fault-tolerant quantum algorithms. As an application of our results, we show that the gate cost of Trotterization circuits compiled to a Clifford+T gate set is constant in the small Trotter step size limit, and can be reduced by orders of magnitude even for large step sizes. The cost of fault-tolerant Trotterization for a variety of applications should be re-examined in light of these results. Our work dispels the widely-stated claim that Clifford+T rotation synthesis has a high cost independent of $\\theta$, and further develops a scalable quasi-probability method for rotation synthesis. We also expect our results to bring forward useful early fault-tolerant quantum computing by reducing required magic state resources.", "url": "https://arxiv.org/abs/2605.31544", "type": "理论+数值", "summary": "1. 该工作提出针对小角度旋转的Clifford+T合成优化方案，将T门成本从普遍的O(log 1/δ)降至O(θ²/δ)，并应用于Trotterization编译。\n2. 其技术核心在于利用角度依赖的缩放关系和拟概率混合方法，在保持采样复杂度低开销下将总T门成本降低数量级，推翻旋转合成成本与角度无关的流行论断。\n3. 这为早期容错量子计算中魔法态资源需求削减提供了可行途径，并迫使重新审视Trotterization类算法在Clifford+T门集下的实际容错资源估算。", "summary_source": "deepseek", "authors": [{"name": "Marius Bothe"}, {"name": "Christoph Sünderhauf"}, {"name": "Michael J. Witham"}, {"name": "Earl T. Campbell"}, {"name": "Nick S. Blunt"}], "featured_authors": [{"name": "Marius Bothe"}, {"name": "Christoph Sünderhauf"}, {"name": "Michael J. Witham"}, {"name": "Earl T. Campbell"}, {"name": "Nick S. Blunt"}], "author_count": 5}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
