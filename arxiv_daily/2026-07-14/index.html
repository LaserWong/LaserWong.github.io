": "Guo-qing Zheng"}], "featured_authors": [{"name": "Yusuke Takeuchi"}, {"name": "Akito Kobayashi"}, {"name": "Saki Uchida"}, {"name": "Hao Ni"}, {"name": "Yong Zhao"}, {"name": "Guo-qing Zheng"}], "author_count": 11}, {"id": "2607.11135", "category": "cond-mat", "title": "Molecular Dynamics-Derived Coloured Noise Mediates Anderson Localisation and Environment-Assisted Transport of Tryptophan Excitons in Tubulin", "abstract": "The tryptophan residues in tubulin $\\alpha\\beta$-dimers form an ordered aromatic network that has been proposed to support quantum exciton transport even under physiological environmental noise. Existing studies of this system mostly assume white-noise dephasing, but the statistical properties of the protein-solvent bath coupled to tryptophan sites remain uncharacterised under physiological conditions. Here we characterise this fluctuation bath via all-atom molecular dynamics simulations of a solvated tubulin dimer at 310~K, combining high-frequency and long-time trajectories with 10~fs and 10~ps sampling intervals. The resulting autocorrelation of the site-energy fluctuations is tri-exponential, with three well-separated decay modes: sub-100-fs and picosecond fluctuations driven by water dynamics, and a nanosecond mode originating from protein conformational rearrangements. All three modes fall deep within the non-Markovian regime. We further demonstrate that the slow protein mode introduces strong quasi-static disorder, which results in Anderson localisation, while the two fast water modes frequently tune chromophore pairs through resonance, enabling environment-assisted quantum transport (ENAQT). On the full eight-site network, the coloured-noise bath confines excitons predominantly to strongly coupled proximal tryptophan pairs, in marked contrast to the more uniform delocalisation predicted by the standard white-noise Haken--Strobl model. Our workflow generalises to other pigment--protein systems with solvent-exposed chromophores.", "url": "https://arxiv.org/abs/2607.11135", "type": "理论+数值", "summary": "1. 该工作通过全原子分子动力学模拟，表征了310 K下微管蛋白二聚体色氨酸残基的位能涨落噪声谱，发现其为三指数衰减的彩色噪声。\n2. 其核心在于揭示了三个非马尔可夫衰减模的不同作用：慢蛋白模引入准静态无序导致安德森局域化，而快水模通过共振调谐实现环境辅助量子输运，与标准白噪声Haken-Strobl模型形成鲜明对比。\n3. 这为溶剂暴露色素-蛋白系统中彩色噪声驱动的局域化与输运机制提供了通用化方法，并启发生物量子激子输运需超越马尔可夫近似。", "summary_source": "deepseek", "authors": [{"name": "Chen Xin"}], "featured_authors": [{"name": "Chen Xin"}], "author_count": 1}, {"id": "2607.11176", "category": "cond-mat", "title": "A Generalized Frank-Bilby Equation for Interfaces in Crystalline Materials", "abstract": "The classical Frank-Bilby equation (FBE) is commonly used to predict the structure of interfaces in crystalline materials in terms of interfacial dislocation networks. However, in general, the line defects in interfaces are disconnections, possessing both dislocation and step character, which are not captured by the classical FBE. As a result, the FBE cannot fully describe the structure of most interfaces of practical interest. To address this issue, we derive a generalized Frank-Bilby equation (GFBE) that explicitly incorporates both dislocation and step components of interfacial defects. We demonstrate its application to several representative interface systems.", "url": "https://arxiv.org/abs/2607.11176", "type": "理论", "summary": "1. 该工作推导了广义Frank-Bilby方程，将界面缺陷的位错与台阶特性统一纳入理论框架。\n2. 其核心改进在于显式处理了界面位错与台阶的耦合，突破经典方程仅适用于纯位错界面的局限。\n3. 这为复杂界面结构的预测与设计提供了更完备的理论工具，有望推广至多种实际材料体系。", "summary_source": "deepseek", "authors": [{"name": "Dongsong Tao"}, {"name": "Luchan Zhang"}, {"name": "David J. Srolovitz"}, {"name": "Yang Xiang"}, {"name": "Jian Han"}], "featured_authors": [{"name": "Dongsong Tao"}, {"name": "Luchan Zhang"}, {"name": "David J. Srolovitz"}, {"name": "Yang Xiang"}, {"name": "Jian Han"}], "author_count": 5}, {"id": "2607.11253", "category": "cond-mat", "title": "Impact of Electronic Energy Dissipation on Primary Radiation Damage Formation in Silicon", "abstract": "In this work, we investigate the role of ion-electron coupling in simulations of radiation damage formation in silicon using molecular dynamics simulations within a two-temperature model. We explore predictions of a threshold-free approach to the coupling that accounts for both the electronic stopping and electron-phonon coupling using a local electron density-based formalism. We compare two different coupling functions across a range of primary knock-on atom energies using two interatomic potentials. Our results demonstrate that the functional form of the ion-electron coupling plays a critical role in determining defect production efficiency, clustering, and recombination, and must therefore be carefully considered for accurate modeling of radiation damage formation. Furthermore, we find that the impact of the coupling in particular on the recombination of defects during the cooling phase of the cascade depends on the choice of interatomic potential, emphasizing the importance of physically grounded descriptions for both electronic effects and atom-atom interactions for reliable radiation damage predictions.", "url": "https://arxiv.org/abs/2607.11253", "type": "理论+数值", "summary": "1. 本文采用双温模型分子动力学模拟，系统研究了硅中离子-电子耦合对初级辐射损伤形成的影响。\n2. 其核心在于基于局域电子密度的无阈值耦合模型，揭示了耦合函数形式对缺陷产额、聚集及冷却阶段复合动力学的关键调控作用。\n3. 这为精确描述电子能量耗散与原子间相互作用在辐射损伤模拟中的协同效应建立了必要基准。", "summary_source": "deepseek", "authors": [{"name": "Nadezda Korepanova"}, {"name": "Rafael Nuñez-Palacio"}, {"name": "Andrea E. Sand"}], "featured_authors": [{"name": "Nadezda Korepanova"}, {"name": "Rafael Nuñez-Palacio"}, {"name": "Andrea E. Sand"}], "author_count": 3}, {"id": "2607.11278", "category": "cond-mat", "title": "Mode-locking instability and multiple soliton formation in GaN polariton waveguide cavities", "abstract": "We study the emergence of multi-soliton regimes in 1D ridge polariton waveguides of two different lengths. We show that by varying the position of the gain, which in out-of-equilibrium polariton systems is provided by the pumping laser and its associated excitonic reservoir, it is possible to tune the regime of soliton formation between single and multiple solitons. This soliton dynamics can be quantitatively reproduced by solving the Gross-Pitaevskii equations of the coupled exciton-photon system, which show that the soliton splitting mechanism is governed by the exciton reservoir dynamics.", "url": "https://arxiv.org/abs/2607.11278", "type": "理论", "summary": "1. 该工作研究了两种不同长度的一维脊状极化子波导中多孤子态的出现，并通过改变增益位置调控单/多孤子形成。\n2. 其核心在于揭示孤子分裂由激子储层动力学主导，且耦合Gross-Pitaevskii方程可定量复现该过程。\n3. 这为极化子波导中孤子锁模不稳定性的控制以及多孤子频率梳的生成提供了明确机理。", "summary_source": "deepseek", "authors": [{"name": "O. Bahrova"}, {"name": "V. Develay"}, {"name": "H. Souissi"}, {"name": "C. Brimont"}, {"name": "L. Doyennette"}, {"name": "B. Alloing"}, {"name": "E. Cambril"}, {"name": "S. Bouchoule"}, {"name": "T. Ackemann"}, {"name": "J. Zuniga-Perez"}, {"name": "D. Solnyshkov"}, {"name": "G. Malpuech"}, {"name": "T. Guillet"}], "featured_authors": [{"name": "O. Bahrova"}, {"name": "V. Develay"}, {"name": "H. Souissi"}, {"name": "D. Solnyshkov"}, {"name": "G. Malpuech"}, {"name": "T. Guillet"}], "author_count": 13}, {"id": "2607.11371", "category": "cond-mat", "title": "Conformal Nature of Quantum Phase Transitions via Fuzzy Three-Sphere Regularization", "abstract": "Conformal field theory (CFT) offers a modern viewpoint for understanding phase transitions. However, directly accessing the conformal algebra and microscopically uncovering the emergent conformal symmetry, especially in higher dimensions, remains a significant challenge. Motivated by recent advances in revealing CFT features via the fuzzy two-sphere, here we generalize this approach to higher dimensions and aim to expose the conformality at the (3+1)-D quantum critical point. We demonstrate this framework by investigating quantum phase transitions belonging to the Ising and Yang-Lee universality classes in a (3+1)-D quantum model (equivalent to a classical four-dimensional system), realized via Landau level projection on the fuzzy three-sphere. By computing the energy spectra at criticality, we explicitly verify the state-operator correspondence, a hallmark of conformal invariance. Together with prior advances, this work establishes a new pathway for the microscopic study of emergent conformality in higher-dimensional phase transitions.", "url": "https://arxiv.org/abs/2607.11371", "type": "理论", "summary": "1. 该工作将模糊二球正则化方法推广至模糊三球，用于揭示(3+1)维量子临界点处Ising与Yang-Lee普适类的共形场论本质。\n2. 其核心在于通过朗道能级投影在模糊三球上实现四维经典模型对应的量子系统，并精确计算临界能谱直接验证态-算符对应关系。\n3. 这为微观层面探究高维相变中涌现共形对称性提供了可操作的理论框架与数值路径。", "summary_source": "deepseek", "authors": [{"name": "Xue Meng"}, {"name": "Liangdong Hu"}, {"name": "Wei Zhu"}], "featured_authors": [{"name": "Xue Meng"}, {"name": "Liangdong Hu"}, {"name": "Wei Zhu"}], "author_count": 3}, {"id": "2607.11384", "category": "cond-mat", "title": "Amorphous materials as a frontier challenge for universal interatomic potentials", "abstract": "Pre-trained or 'foundational' machine-learned interatomic potentials (MLIPs) are now widely used in materials modelling. However, early pre-trained models and benchmarks have largely focused on ordered, crystalline structures, and their transferability to non-crystalline solids remains unclear. Here, we show that the amorphous state is indeed a central challenge for future universal MLIPs, based on a systematic evaluation of current mainstream models in this domain. We introduce a benchmarking framework built on a curated reference dataset of canonical amorphous systems, as well as validation for structures and properties. Our study identifies limitations in the transferability of many current pre-trained models and investigates fine-tuning strategies tailored to disordered phases. Together, our results can facilitate future applications of MLIPs in the fast-growing field of amorphous functional materials, and they provide guidance for designing next-generation training datasets and transferable atomistic models.", "url": "https://arxiv.org/abs/2607.11384", "type": "理论", "summary": "1. 该工作系统评估了主流机器学习原子间势在非晶材料中的表现，并构建了基准框架。\n2. 其卖点在于揭示非晶态对通用势转移性的核心挑战，针对无序相提出微调策略。\n3. 这为设计下一代可转移原子模型及推动非晶功能材料应用提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Natascia L. Fragapane"}, {"name": "Volker L. Deringer"}], "featured_authors": [{"name": "Natascia L. Fragapane"}, {"name": "Volker L. Deringer"}], "author_count": 2}, {"id": "2607.11395", "category": "cond-mat", "title": "A method for measuring the dispersion of elastic waves in disordered computer-solids", "abstract": "The dispersion of elastic waves in disordered solids plays a key role in determining the vibrational density of states and harmonic wave attenuation rates. As such, the availability of robust computational approaches to the precise extraction of the dispersion is of key importance. Here we present a simple method -- the imposed wave method (IWM) -- , which provides direct access to the dispersion of elastic waves in computer models of solids, without any fitting involved. We directly benchmark the method against the `ground-truth' obtained from direct diagonalization of solids' hessian matrices, to find good agreement. We discuss limitations of and finite-size effects in the method, and show that exploiting the method's finite-size scaling provides access to a fundamental quantifier of mechanical disorder that determines wave attenuation rates and spectral widths.", "url": "https://arxiv.org/abs/2607.11395", "type": "理论+数值", "summary": "1. 该工作提出“强制波法”(IWM)直接测量无序计算机固体中弹性波的色散关系，无需拟合。\n2. 通过有限尺寸标度，该方法直接提取决定波衰减率与谱宽的机械无序基本量，与黑塞矩阵对角化结果吻合。\n3. 这为无序固体中弹性波传播与无序量化研究提供了可靠的数值工具与标度思路。", "summary_source": "deepseek", "authors": [{"name": "Edan Lerner"}], "featured_authors": [{"name": "Edan Lerner"}], "author_count": 1}, {"id": "2607.11406", "category": "cond-mat", "title": "Ab initio path integral Monte Carlo study of the 2D uniform electron liquid at finite temperatures", "abstract": "We present extensive \\emph{ab initio} path integral Monte Carlo (PIMC) simulations of the two-dimensional uniform electron gas (2DEG), covering a broad range of density parameters $r_s=0.1,\\dots,50$ and temperatures $\\Theta=k_\\textnormal{B}T/E_\\textnormal{Fermi}=0.5,\\dots,16$. This allows us to analyze various structural, linear density response and spectral properties. We find clear evidence of a \\emph{roton-type} feature in the dynamic structure factor at strong coupling and intermediate wavenumbers. We also benchmark novel dielectric theory implementations for the 2DEG~[Kalkavouras \\emph{et al.}~ arXiv:2601.14989 ] for structural and spectral properties across the liquid phase diagram. The PIMC results can be used to benchmark existing theories and approximations, and guide the development of new methodologies.", "url": "https://arxiv.org/abs/2607.11406", "type": "理论+数值", "summary": "1. 该工作利用从头算路径积分蒙特卡洛方法，系统模拟了二维均匀电子气在广泛密度和温度参数下的结构与谱性质。\n2. 其核心发现在于强耦合与中等波数下动态结构因子呈现清晰的旋子特征，并系统基准了新型介电理论的性能。\n3. 这些高精度参考数据可严格检验现有近似理论，并为发展面向二维电子液体的计算方法提供可靠基准。", "summary_source": "deepseek", "authors": [{"name": "Tobias Dornheim"}, {"name": "Fotios Kalkavouras"}, {"name": "Paul Hamann"}, {"name": "Zhandos A. Moldabekov"}, {"name": "Jan Vorberger"}, {"name": "Panagiotis Tolias"}], "featured_authors": [{"name": "Tobias Dornheim"}, {"name": "Fotios Kalkavouras"}, {"name": "Paul Hamann"}, {"name": "Zhandos A. Moldabekov"}, {"name": "Jan Vorberger"}, {"name": "Panagiotis Tolias"}], "author_count": 6}, {"id": "2607.11420", "category": "cond-mat", "title": "Extended Landau--Lifshitz equation for nanomagnets: a path-integral derivation of surface-induced magnetization nutation", "abstract": "An effective dynamical equation for the magnetization of a nanomagnet with surface anisotropy is derived from an atomistic spin Hamiltonian using the spin coherent-state path integral formalism. The derivation proceeds in two steps. First, the continuum Euclidean action for the many-spin nanomagnet is obtained, including the Wess--Zumino--Witten (Berry phase) term, as well as exchange, Zeeman, and core/surface anisotropy contributions. Second, the local magnetization density is decomposed into a slowly varying macrospin component and transverse spin-misalignment fluctuations driven by surface effects. A systematic expansion of the action is then performed up to quadratic order in the transverse-fluctuation variables. Under the adiabatic approximation, in which transverse modes relax much faster than the macrospin, these modes are eliminated by using their static Green's function solution. This results in a closed, extended Landau--Lifshitz equation for the macrospin, featuring an effective field with nontrivial corrections from spin misalignment. These corrections renormalize both the Zeeman and anisotropy fields and introduce additional terms that act as nutation- and damping-like contributions. ... Together, these results establish a microscopic foundation for surface-induced magnetization nutation in nanomagnets and provide a framework to estimate corrections to the precession frequency and effective damping. The corresponding shift in the ferromagnetic-resonance frequency and linewidth is measurable with standard GHz spectrometers, and the underlying adiabatic-elimination mechanism is expected to generalize to any slow magnetic variable coupled to a bath of fast-fluctuating modes.", "url": "https://arxiv.org/abs/2607.11420", "type": "理论", "summary": "1. 该工作从原子自旋哈密顿量出发，利用自旋相干态路径积分方法推导了具有表面各向异性的纳米磁体的扩展Landau-Lifshitz方程。\n2. 其核心在于通过绝热近似消除快速弛豫的横向自旋涨落，得到包含表面诱导的章动项和阻尼项修正的闭合宏观自旋运动方程，并揭示了有效场的重整化机制。\n3. 该绝热消去框架预期可推广至任意与快涨落模式耦合的慢磁变量系统，且所预测的铁磁共振频率与线宽移动可通过标准GHz谱仪实验检验。", "summary_source": "deepseek", "authors": [{"name": "H. Kachkachi"}, {"name": "P. Thibaudeau"}], "featured_authors": [{"name": "H. Kachkachi"}, {"name": "P. Thibaudeau"}], "author_count": 2}, {"id": "2607.11474", "category": "cond-mat", "title": "Colloid recovery from porous structures under ambient flow: enhanced extraction via phoretic and osmotic mechanisms", "abstract": "Chemical gradients are widely employed to enhance particle transport in porous media, such as laundry detergency and enhanced oil recovery. Diffusiophoresis and diffusioosmosis refer to the movement of colloid and movement of near-surface fluid in response to electrolyte gradients, respectively. These mechanisms play a crucial role in colloid and drug transport in constricted regions where bulk transport is infeasible. Our earlier work [Tiwari et al., Langmuir 41, 18583 (2025)] has shown that phoretic and osmotic transport in dead-end micro-pores can be controlled by orienting salt gradients into or out of the pores; however, the extent to which this orientation influences large-scale spatiotemporal patterns and colloid extraction is not thoroughly explored. In this work, we study the phoretic and osmotic colloidal extraction from porous structure exposed to an ambient flow. We characterize the impact of solute gradient orientation, such as solute-out (i.e., solute-emitting porous media) and solute-in (i.e., solute-consuming media) modes. The two-dimensional porous structure is made of a number of pillars/fibers arranged in a lattice ordered hexagonal packing with equal spacing. The results from finite-element simulations show that phoretic colloidal extraction exhibits a qualitatively distinct behavior in the two modes: in the solute-out mode, colloids are extracted from the peripheral region of the porous structure, whereas in the solute-in mode, extraction predominantly occurs from the stagnant core. Diffusioosmotic slip on the internal surface of pillars/fibres further amplifies extraction in both modes, with a relatively larger enhancement in the solute-in mode due to internal spatiotemporal flow patterns. Beyond demonstrating the sensitivity of osmotic transport in porous media, these insights can guide enhanced membrane filtration, laundry detergency, and enhanced oil recovery.", "url": "https://arxiv.org/abs/2607.11474", "type": "数值", "summary": "1. 该工作通过有限元模拟研究了环境流作用下多孔结构中胶体颗粒的扩散泳与扩散渗流协同提取，系统表征了溶质梯度取向（外排与内吸模式）对提取空间模式的调控。\n2. 其核心发现是两种模式下提取行为呈定性差异：溶质外排时提取集中于多孔结构外围，而溶质内吸时从停滞核心区发生，且纤维内表面扩散渗流滑移显著增强提取，以内吸模式增幅更大。\n3. 这揭示了多孔介质中渗透输运对梯度取向的高度敏感性，可为膜过滤、洗衣去污和石油采收等过程中的胶体回收与调控提供机理指导。", "summary_source": "deepseek", "authors": [{"name": "Jitendra Dhakar"}, {"name": "Kapil Upadhyaya"}, {"name": "Akash Choudhary"}], "featured_authors": [{"name": "Jitendra Dhakar"}, {"name": "Kapil Upadhyaya"}, {"name": "Akash Choudhary"}], "author_count": 3}, {"id": "2607.11518", "category": "cond-mat", "title": "Microscopic equivalence of the vortex-entry current and the depairing current in a superconducting thin-film strip", "abstract": "The current at which vortices enter a superconducting strip is usually identified in Pearl--London theory with the disappearance of an edge barrier. This work reformulates the same question microscopically as the loss of local stability of the vortex-free current-carrying state, using the fixed-current Gibbs functional of dirty-limit Usadel theory, which is valid at arbitrary temperatures. For an ideal homogeneous thin-film strip at zero applied field, with self-field effects neglected, the stability of the vortex-free state is examined against both spatially uniform and nonuniform perturbations. The barrier-disappearance current is shown to be set by the uniform perturbation and to coincide exactly with the depairing current.", "url": "https://arxiv.org/abs/2607.11518", "type": "理论", "summary": "1. 该工作利用脏极限Usadel理论的固定电流Gibbs泛函，从微观上重新定义了超导薄膜带中涡旋进入电流与解对电流的等价性。\n2. 其卖点在于证明无涡旋载流态对均匀扰动的失稳决定了势垒消失电流，且该电流精确等于解对电流，适用于任意温度。\n3. 这为统一理解超导薄膜中涡旋动力学和临界电流的微观起源提供了理论依据，并可指导相关实验与器件设计。", "summary_source": "deepseek", "authors": [{"name": "Takayuki Kubo"}], "featured_authors": [{"name": "Takayuki Kubo"}], "author_count": 1}, {"id": "2607.11524", "category": "cond-mat", "title": "Harnessing finite-size effects to gauge aging in the $2D$ Ising model", "abstract": "The relaxation behavior towards equilibrium of the $2D$ Ising model with nearest-neighbor interactions has been studied with focus on the two-time autocorrelator $C(t,s)$. Finite-size effects affecting the growing magnetic domains lead to the saturation of $C(t,s)$ with a distinct plateau of height $C_{\\infty}^{(2)}(s,L)$ scaling algebraically with waiting time $s$ and lattice size $L$. These scaling relations are used to produce precise estimates for the autocorrelation exponent $\\lambda$ and dynamical exponent $z$ with deliberately small lattices. Treating smooth domain walls in a similar manner to the lattice boundaries, their effect on $C(t,s)$ can be understood as premature finite-size phenomenon, extending our ansatz to systems not yet in equilibrium.", "url": "https://arxiv.org/abs/2607.11524", "type": "理论", "summary": "1. 该工作利用二维Ising模型双时自关联函数的有限尺寸标度关系，通过小晶格精确估计了自关联指数和动力学指数。\n2. 其卖点在于揭示饱和平台高度与等待时间和晶格尺寸的代数标度律，并将光滑畴壁视为等效边界处理，从而将有限尺寸效应转化为测量非平衡老化的工具。\n3. 这为在非平衡系统中利用可控有限尺寸效应提取动力学普适类指数提供了可推广的框架，并启发了对边界效应与畴壁动力学的统一理解。", "summary_source": "deepseek", "authors": [{"name": "Dustin Warkotsch"}, {"name": "Malte Henkel"}, {"name": "Wolfhard Janke"}], "featured_authors": [{"name": "Dustin Warkotsch"}, {"name": "Malte Henkel"}, {"name": "Wolfhard Janke"}], "author_count": 3}, {"id": "2607.11532", "category": "cond-mat", "title": "Stripe-Ordered Altermagnetism Emerging from Correlation-Driven Spin-Density-Wave Instability", "abstract": "Altermagnetism is conventionally identified within the paradigm of collinear antiferromagnets. Its potential realization within other spin instabilities, such as a spin-density wave (SDW), remains a fundamentally compelling open question. Here, we combine Hartree-Fock mean-field and unbiased determinant quantum Monte Carlo methods to investigate a minimal Hubbard model relevant to iron pnictides. We reveal a novel $d_{xy}$-wave stripe-ordered altermagnetic (SOAM) insulating phase driven fundamentally by the correlation-induced $(\\pi,0)$ SDW instability. Within this phase, an introduced uniaxial staggered electric potential alters the underlying symmetry: it breaks the original combined time-reversal and spatial translation symmetry ($T_{d}\\mathcal{T}$) and retains a combined time-reversal and mirror invariance ($M\\mathcal{T}$), thereby unlocking the pronounced nonrelativistic spin splitting. Crucially, the exact finite-size scaling from our determinant quantum Monte Carlo simulations confirms that this correlation-driven SOAM phase stably survives at accessible finite temperatures. Our study pushes the frontier of altermagnetism beyond the conventional antiferromagnetic paradigm into the realm of SDW instability, advancing the fundamental understanding of altermagnetism in strongly correlated electron systems.", "url": "https://arxiv.org/abs/2607.11532", "type": "理论+数值", "summary": "1. 该工作运用Hartree-Fock平均场与无偏行列式量子蒙特卡洛方法，针对铁基超导体相关最小Hubbard模型，探究了自旋密度波不稳定性驱动的交错磁序。\n2. 其核心发现是关联诱导的(π,0)自旋密度波不稳定性导致dxy波条纹序交错磁绝缘相，单轴交错电势破缺TdT对称性而保留MT对称性，从而产生显著的非相对论自旋劈裂。\n3. 无偏量子蒙特卡洛有限尺寸标度证实该相在有限温度下稳定存在，将交错磁概念从传统反铁磁范式推广至自旋密度波不稳定性，为强关联电子系统中交错磁态的研究开辟了新方向。", "summary_source": "deepseek", "authors": [{"name": "Zenghui Fan"}, {"name": "Jingyao Meng"}, {"name": "Tianxing Ma"}], "featured_authors": [{"name": "Zenghui Fan"}, {"name": "Jingyao Meng"}, {"name": "Tianxing Ma"}], "author_count": 3}, {"id": "2607.11554", "category": "cond-mat", "title": "Robust Spin Qubit Coupler via Minimal Kitaev Chain", "abstract": "While a minimal Kitaev chain is promised to host unprotected Majorana zero modes, its role for spin qubits is relatively underappreciated. Following recent breakthroughs in the fine control of transport behaviors, we propose to use minimal Kitaev chain as a robust coupling module between spin qubits. Long-distance, anisotropic exchange coupling can be mediated by the Andreev bound states (ABSs) in the hybrid segment. The chemical potential of ABS gives a simple way to selectively control the coupling strength and its response to local perturbations. Moreover, this additional control degree of freedom creates a unique sweet spot, allowing both strong coupling and first-order immunity against charge noise. The protected qubit encoded on the minimal Kitaev chain at the sweet spot is shown to boast over 200 fold improvement in decoherence time.", "url": "https://arxiv.org/abs/2607.11554", "type": "理论", "summary": "1. 该工作提出利用最小Kitaev链作为自旋量子比特间的稳健耦合模块，通过混合段中的安德烈夫束缚态实现长程各向异性交换耦合。\n2. 其技术核心在于化学势可独立调控耦合强度，并在一个特殊工作点同时实现强耦合与对电荷噪声的一阶免疫。\n3. 这一甜点处编码的保护性量子比特退相干时间提升逾200倍，为可扩展量子计算架构中的长程可控耦合提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Jiaan Qi"}, {"name": "Hongqi Xu"}], "featured_authors": [{"name": "Jiaan Qi"}, {"name": "Hongqi Xu"}], "author_count": 2}, {"id": "2607.11647", "category": "cond-mat", "title": "Anomalous Dissipation in Current Biased Josephson Systems", "abstract": "A new phase diffusive regime in a current biased Josephson junction is theoretically explored which originates from embedding the junction in a circuit environment with anomalous dissipation. This is realized by placing parallel to the junction a resistor in series with a capacitor such that electromagnetic fluctuations effectively couple also to the charge of the junction. This leads to rich Josephson dynamics, in particular for the switching of the junction out of a zero voltage state. Modelled as the escape process of a fictitious phase-particle out of a metastable well, a detailed study reveals that anomalous dissipation has a strong impact at low temperatures when quantum tunneling dominates against thermal activation. As a manifestation, a regime is found, where for realistic circuit parameters the quantum escape process is substantially enhanced, followed by a short voltage pulse and re-trapping with high probability. This class of circuits may be leveraged for detecting microwave photons or dissipative quantum annealing processes. In addition, the analysis provides a general framework for engineering dissipative dynamics in nonlinear systems using anomalous environments.", "url": "https://arxiv.org/abs/2607.11647", "type": "理论", "summary": "1. 该工作理论上探索了电流偏置约瑟夫森结中由反常耗散电路环境诱导的一种新相扩散区域。\n2. 其核心在于通过并联电阻-电容支路使电磁涨落耦合至结电荷，在低温量子隧穿主导区显著增强逃逸过程，并伴随短电压脉冲与高概率重新俘获。\n3. 这为微波光子探测及耗散量子退火提供了可行方案，也为非线性系统中耗散动力学工程建立了普适框架。", "summary_source": "deepseek", "authors": [{"name": "Johannes Hauff"}, {"name": "Niklas Gaiser"}, {"name": "Joachim Ankerhold"}, {"name": "Dominik Maile"}], "featured_authors": [{"name": "Johannes Hauff"}, {"name": "Niklas Gaiser"}, {"name": "Joachim Ankerhold"}, {"name": "Dominik Maile"}], "author_count": 4}, {"id": "2607.11650", "category": "cond-mat", "title": "How do 3M Command strips work? A fracture mechanics approach", "abstract": "Removable adhesive systems such as 3M Command strips are designed to support substantial loads while allowing clean, damage-free removal from the substrate. These systems rely on a highly extensible adhesive strip that bonds strongly during use but releases when stretched, causing the adhesive layer to elongate and progressively debond from the surfaces. A central challenge in the design of stretch-release adhesives is therefore to maximize load-bearing capacity while minimizing the force required for removal. This study investigates the finite-deformation mechanics governing both load support and tape release in a hyperelastic stretch-release adhesive system, with particular focus on the 3M Command tape geometry. Explicit analytical expressions are derived for the energy release rate of interfacial cracks under both load-bearing and release conditions and are validated against $J$-integral evaluations from finite element simulations. The results show that the ratio of maximum supported load to release force scales linearly with the ratio of bonded length to adhesive thickness, which is typically very large. We also investigate geometry-driven alternating crack propagation between the backing and substrate interfaces, governing tape removal, by analytical solutions and simulations. Parametric studies of competing interfacial fracture toughnesses produce failure envelopes that provide a predictive framework for estimating release forces and unstable crack propagation in multilayer stretch-release adhesive systems.", "url": "https://arxiv.org/abs/2607.11650", "type": "理论+数值", "summary": "1. 该工作采用有限变形断裂力学方法，系统研究了3M Command可剥离胶带在承载与剥离过程中的力学机制。\n2. 核心在于推导了承载与释放条件下界面裂纹能量释放率的显式解析表达式，揭示了最大承载与剥离力之比正比于粘接长度与胶层厚度之比这一关键标度律。\n3. 这为多层可拉伸剥离粘合剂的承载-剥离性能权衡设计提供了基于断裂韧性的预测框架与失效包络线。", "summary_source": "deepseek", "authors": [{"name": "Xue-Ling Luo"}, {"name": "Nikolaos Bouklas"}, {"name": "Chung-Yuen Hui"}], "featured_authors": [{"name": "Xue-Ling Luo"}, {"name": "Nikolaos Bouklas"}, {"name": "Chung-Yuen Hui"}], "author_count": 3}, {"id": "2607.11661", "category": "cond-mat", "title": "Thermal phase transitions in a mixed-spin Ising model on the Lieb lattice: Exact results beyond zero magnetic field", "abstract": "We investigate the ground-state and finite-temperature properties of a mixed spin-1/2 and spin-1 Ising model on a decorated square (Lieb) lattice incorporating a uniaxial single-ion anisotropy and magnetic field. By employing the generalized decoration-iteration transformation, the model is mapped exactly onto an effective spin-1/2 Ising model on the square lattice characterized by an effective nearest-neighbor interaction and an effective field. The studied model consequently becomes exactly solvable even for finite values of the applied magnetic field whenever the effective field vanishes. The ground-state analysis reveals three distinct phases: ferrimagnetic phase (FRI), disordered phase (DP), and ferromagnetic (FM) phase. The ground-state boundary between FRI and DP phases gives rise to a dome-shaped surface of discontinuous thermal phase transitions, which is terminated by a line of Ising-type critical points associated with continuous thermal phase transitions. Both continuous and discontinuous thermal phase transitions belong to the exactly solvable parameter regime defined by a vanishing effective field in spite of the fact that the applied magnetic field is finite. Two consecutive discontinuous thermally-induced reentrant phase transitions DP-FRI-DP are identified in a narrow parameter region. The exact analytical predictions including reentrance, field- and thermally-driven phase transitions are independently verified by classical Monte Carlo simulations.", "url": "https://arxiv.org/abs/2607.11661", "type": "理论+数值", "summary": "1. 该工作通过广义装饰-迭代变换将Lieb晶格上混合自旋1/2与自旋1伊辛模型精确映射为有效自旋1/2伊辛模型，在有限外加磁场下实现零有效场区域的精确可解。\n2. 其核心在于发现基态亚铁磁-无序相边界构成圆顶状不连续热相变曲面，并终止于连续伊辛型临界点线，同时在窄参数区间内预言了两次连续热诱导重入相变。\n3. 这为混合自旋系统在有限磁场下的热相变提供了严格的解析基准，其重入与场/热驱动相变的精确预测已被经典蒙特卡罗模拟独立验证。", "summary_source": "deepseek", "authors": [{"name": "Jozef Strecka"}, {"name": "Katarina Karlova"}], "featured_authors": [{"name": "Jozef Strecka"}, {"name": "Katarina Karlova"}], "author_count": 2}, {"id": "2607.11662", "category": "cond-mat", "title": "Emergent quantum chaos from correlations on a random graph", "abstract": "This work demonstrates that sparse long-range random bonds on a one-dimensional lattice alone can generate quantum-chaotic spectral correlations and also drive a localization transition in a noninteracting single-particle Hamiltonian. The model is a one-dimensional ring in which each pair of sites is connected independently with a probability $p_{ij}= d_{ij}^{-(1+\\sigma)}$. Each bond carries identical unit hopping and on-site disorder is absent. Despite the absence of on-site disorder and interaction, the model displays quantum chaotic spectra with Gaussian orthogonal ensemble (GOE) level statistics at small $\\sigma$ and localized eigenstates with Poisson statistics at larger $\\sigma$. The transition occurs in the range $ 0.80 \\lesssim \\sigma_c \\lesssim 0.85$, far above the summability threshold of the mean hopping profile ($\\sigma=0$). A Gaussian field theory retaining only the mean and variance of the Bernoulli bonds instead predicts a threshold at $\\sigma=1$, suggesting that higher cumulants are infrared-relevant. Our findings hint towards a universality class that is distinct from both the power-law random banded matrix model and the standard Anderson transition.", "url": "https://arxiv.org/abs/2607.11662", "type": "理论", "summary": "1. 该工作证明一维晶格上稀疏长程随机键能独立于相互作用与位点无序，在单粒子哈密顿量中同时产生量子混沌谱（GOE统计）与局域化转变（泊松统计）。\n2. 其核心在于转变发生在平均跳跃可和阈值（σ=0）之上约σ_c≈0.80-0.85处，而仅含键均值与方差的高斯理论预测σ=1阈值，揭示高阶累积量的红外相关性。\n3. 这暗示该模型所属的普适类区别于幂律随机带矩阵模型与标准安德森转变，为长程随机系统中量子混沌与局域化的关联研究提供了新框架。", "summary_source": "deepseek", "authors": [{"name": "Mrinal Sarkar"}, {"name": "Valerio Pagni"}, {"name": "Tilman Enss"}, {"name": "Nicolò Defenu"}], "featured_authors": [{"name": "Mrinal Sarkar"}, {"name": "Valerio Pagni"}, {"name": "Tilman Enss"}, {"name": "Nicolò Defenu"}], "author_count": 4}, {"id": "2607.11669", "category": "cond-mat", "title": "Still life in a classic Blume-Capel model: pseudo-transitions in a spin-1 diamond chain", "abstract": "We exactly investigate the ground-state, magnetic, and thermodynamic properties of a spin-1 Blume-Capel diamond chain in a magnetic field by means of the transfer-matrix method. After establishing the complete ground-state phase diagram and characterizing each ground-state spin configuration, we examine the finite-temperature behavior in the vicinity of selected phase boundaries and triple points. It is demonstrated that an extremely small energy gap between a nondegenerate ground state and competing macroscopically degenerate low-lying excited states gives rise to entropically-driven pseudo-transitions. These pseudo-transitions manifest themselves through abrupt but continuous changes in the magnetization and entropy resembling discontinuous jumps, while the magnetic susceptibility and specific heat exhibit exceptionally sharp yet finite peaks resembling divergences. Our results provide the exact evidence that pseudo-transitions can also emerge in the classical spin-1 Blume-Capel model and thereby extend the class of one-dimensional spin systems known to display pseudo-transitions.", "url": "https://arxiv.org/abs/2607.11669", "type": "理论+数值", "summary": "1. 该工作利用转移矩阵方法精确求解了磁场中自旋-1 Blume-Capel钻石链的基态与热力学性质，并系统分析了温度驱动下的伪相变行为。\n2. 其核心物理机制在于非简并基态与宏观简并低能激发态间极小的能隙，导致熵驱动的磁化强度与熵突变，同时磁化率与比热呈现尖锐有限峰。\n3. 这为一维经典自旋系统出现伪相变提供了确切证据，拓展了此类现象在Ising类模型中的适用范围，为相关热力学反常行为研究开辟了路径。", "summary_source": "deepseek", "authors": [{"name": "Elham Shahhosseini Shahrabadi"}, {"name": "Majid Moradi"}, {"name": "Jozef Strecka"}], "featured_authors": [{"name": "Elham Shahhosseini Shahrabadi"}, {"name": "Majid Moradi"}, {"name": "Jozef Strecka"}], "author_count": 3}, {"id": "2607.11704", "category": "cond-mat", "title": "Thermodynamic bound on the Fano factor of a coherent thermoelectric heat engine", "abstract": "We show that for fermionic coherent thermoelectric transport, selecting heat-engine operation yields a thermodynamic uncertainty relation for the charge current that imposes a universal lower limit of $F > 1/2$ on the corresponding Fano factor. We find that violations of the thermodynamic uncertainty relation for classical Markov processes, typically associated with a quantum advantage, are far more restricted for heat engines than what is allowed by a generic thermodynamic process. For bosonic and classical carriers, the minimum Fano factor increases to $F > 1$, and the thermodynamic uncertainty relation for classical Markov processes is never violated. We provide numerical evidence that all the obtained bounds are tight and can be saturated by properly designed transmissions.", "url": "https://arxiv.org/abs/2607.11704", "type": "理论+数值", "summary": "1. 该工作针对相干热电热机中的电荷流，证明了热力学不确定关系导致费米子体系Fano因子下界为1/2，玻色子及经典载流子下界为1。\n2. 其核心在于揭示热机操作对Fano因子的约束强于一般热力学过程，且经典马尔可夫过程的热力学不确定关系在玻色子和经典情形下永不违反。\n3. 这为微纳热电热机的性能极限提供了可饱和的紧致界限，并明确了量子相干性对热机输运热力学约束的影响。", "summary_source": "deepseek", "authors": [{"name": "Nahual Sobrino"}, {"name": "Rosario Fazio"}, {"name": "Matteo Acciai"}], "featured_authors": [{"name": "Nahual Sobrino"}, {"name": "Rosario Fazio"}, {"name": "Matteo Acciai"}], "author_count": 3}, {"id": "2607.11729", "category": "cond-mat", "title": "Exchange topology and criticality in ferrite and chromium spinels: a unified Monte Carlo analysis", "abstract": "We report a unified analysis of Metropolis Monte Carlo results for two families of magnetic spinels: inverse ferrites Fe$^{3+}_{A}$[M$^{2+}$Fe$^{3+}$]$_{B}$O$_4$ (M = Co, Cu, Fe, Ni), where superexchange couples two chemically distinct sublattices, and chromium spinels $A$Cr$_2X_4$ ($A$ = Zn, Cd, Hg, $X$ = S, Se) together with the breathing-lattice chromates Li$M$Cr$_4$O$_8$ ($M$ = Ga, In), where a single Cr$^{3+}$ species occupies a corner-sharing tetrahedral network. Placing the exchange constants, transition temperatures, critical exponents, hysteresis, and magnetocaloric responses of these systems on a common footing, we introduce two reduced quantities not previously reported: the ratio $\\theta_{\\mathrm{CW}}/T_C$ for the ferrites and the normalized ordering scale $t^{*}=k_BT_C/[J_1S(S+1)]$ for the chromium compounds. The ferrites cluster in the range $\\theta_{\\mathrm{CW}}/T_C = 0.94$-$1.19$, close to the mean-field expectation of unity and the signature of dominant, unfrustrated A-B superexchange, and their exponents ($\\beta = 0.20$-$0.26$, $\\gamma = 1.23$-$1.27$, $\\delta = 4.76$-$4.78$) follow the three-dimensional Ising class. The chromium systems split into three regimes: $t^{*} \\approx 1.4$-$1.9$ for Ising-treated sulfides, $t^{*} \\approx 0.99$ for Heisenberg-treated selenides, and $t^{*} \\approx 0.24$-$0.25$ for the antiferromagnetic breathing chromates, quantifying the combined suppression of $T_C$ by continuous spin symmetry and by geometric frustration. Finite-thickness simulations of Fe$_3$O$_4$ resolve a dimensionality crossover between two and four unit cells. We identify the Ising-versus-Heisenberg dependence of the predicted universality class in frustrated chromites as the principal open problem.", "url": "https://arxiv.org/abs/2607.11729", "type": "理论+数值", "summary": "1. 该工作对铁氧体和铬尖晶石两类磁性尖晶石家族进行了统一的Metropolis蒙特卡洛分析，将其交换常数、临界指数和磁热响应置于共同框架下。\n2. 引入两个此前未报道的约化量——铁氧体的θ_CW/TC和铬化合物的归一化有序标度t*，揭示了铁氧体中无阻挫A-B超交换主导的三维伊辛临界行为，以及铬体系中连续自旋对称性与几何阻挫对TC的协同抑制作用。\n3. 这项工作为统一理解不同尖晶石家族中交换拓扑与临界性提供定量标尺，并明确提出了阻挫铬铁矿中伊辛型与海森堡型普适类依赖这一待解核心问题。", "summary_source": "deepseek", "authors": [{"name": "Keltoum Khallouq"}, {"name": "Ayoub El Maazouzi"}, {"name": "Kamal Boumhara"}, {"name": "Rachid Masrour"}], "featured_authors": [{"name": "Keltoum Khallouq"}, {"name": "Ayoub El Maazouzi"}, {"name": "Kamal Boumhara"}, {"name": "Rachid Masrour"}], "author_count": 4}, {"id": "2607.11755", "category": "cond-mat", "title": "A Fokker-Planck approach to a stochastic multiplicative wealth model with taxation and redistribution", "abstract": "We develop a Fokker-Planck description of the dynamics of wealth distribution in a stochastic multiplicative economic growth model with taxation and redistribution, as introduced by P.M.C. de Oliveira. Extending the original formulation, our theoretical framework includes general redistribution protocols, encompassing a broad class of state-dependent transfer mechanisms. As a particular case, we investigate a two-state protocol designed to emulate conditional cash transfer programs. Analytical expressions for the stationary wealth distributions are derived, revealing how the interplay between multiplicative noise, taxation, and redistribution shapes the emergence of inequality. The theoretical results are corroborated by agent-based simulations. To quantify and compare the impact of the different protocols, we employ the Gini index as a measure of inequality. Our analysis highlights how specific nonuniform redistribution schemes can significantly mitigate wealth disparities.", "url": "https://arxiv.org/abs/2607.11755", "type": "理论+数值", "summary": "1. 该工作将Fokker-Planck框架扩展至含税收与再分配的随机乘法财富模型，解析推导出稳态财富分布。\n2. 其核心在于揭示乘性噪声、税收与再分配三者耦合如何塑造不平等，并通过基尼系数量化非均匀再分配方案对贫富差距的缓解效果。\n3. 这为设计针对性的有条件现金转移等再分配政策提供了可解析检验的理论工具，并启发后续多主体随机经济模型研究。", "summary_source": "deepseek", "authors": [{"name": "Iago Nascimento Barros"}, {"name": "Marcelo Lobato Martins"}, {"name": "Celia Anteneodo"}], "featured_authors": [{"name": "Iago Nascimento Barros"}, {"name": "Marcelo Lobato Martins"}, {"name": "Celia Anteneodo"}], "author_count": 3}, {"id": "2607.11786", "category": "cond-mat", "title": "Correlation-renormalized spin-fluctuation pairing and the stabilization of $s_{\\pm}$ superconductivity in pressurized La$_3$Ni$_2$O$_7$", "abstract": "The superconducting gap symmetry of pressurized La$_3$Ni$_2$O$_7$ remains unsettled because conventional weak-coupling calculations often place the system close to competing sign-changing $s$- and $d$-wave instabilities. Using the four-orbital Wannier Hamiltonian of Xia et al., we combine single-site two-orbital dynamical mean-field theory (DMFT) with a self-energy-renormalized random-phase approximation (RPA). The central step is to replace the bare particle-hole bubble $G_0G_0$ of ordinary RPA by a $G_{\\rm DMFT}G_{\\rm DMFT}$ bubble, while keeping the same residual Slater--Kanamori interaction vertices. In the bare RPA benchmark, the leading pairing eigenvalue belongs to the $B_{2g}$ $d_{xy}$ channel. Once the DMFT self-energy is included, the hierarchy is reversed: the $A_{1g}$ sign-changing $s_{\\pm}$ state becomes dominant, the $B_{1g}$ $d_{x^2-y^2}$ channel is subleading, and the original $B_{2g}$ instability is strongly suppressed. Pocket-pair decomposition and orbital-resolved susceptibilities show that the reversal originates from orbital-selective renormalization of the $d_{3z^2-r^2}$ sector, which filters the $\\gamma$-pocket scattering processes that stabilize $d_{xy}$ pairing in bare RPA while preserving distributed inter-pocket processes favorable to $s_{\\pm}$ pairing. As an independent two-particle validation, we further compute the static spin susceptibility using the dual Bethe--Salpeter equation with the local DMFT vertex. The resulting susceptibility retains a broad finite-momentum magnetic response and is weak near $\\Gamma$, strengthening the spin-fluctuation background for the correlation-stabilized $s_{\\pm}$ state. Our results demonstrate that strong correlations are not a secondary correction in La$_3$Ni$_2$O$_7$: an appropriate treatment of correlation-renormalized quasiparticles is essential for predicting the superconducting pairing symmetry.", "url": "https://arxiv.org/abs/2607.11786", "type": "理论+数值", "summary": "1. 该工作结合单点双轨道动力学平均场理论与自能重整化随机相位近似，研究高压La₃Ni₂O₇的超导配对对称性。\n2. 其核心是将裸粒子-空穴气泡替换为DMFT重整化气泡，发现轨道选择性地重整d_{3z²-r²}散射过程，使裸RPA中占优的d_{xy}配对被压制，s₊态成为主导。\n3. 这揭示了强关联效应并非次要修正，而是决定配对对称性的关键因素，为类似镍基超导体的多轨道理论处理提供了范例。", "summary_source": "deepseek", "authors": [{"name": "Shuhong Tang"}, {"name": "Liang-Jian Zou"}], "featured_authors": [{"name": "Shuhong Tang"}, {"name": "Liang-Jian Zou"}], "author_count": 2}, {"id": "2607.11799", "category": "cond-mat", "title": "Universal scalings and switching entropy in yield-stress fluids", "abstract": "Yield-stress fluids undergo a singular solid-to-liquid transition at a critical stress threshold. While conventionally investigated under steady shear, large-amplitude oscillatory tests force these materials to cyclically navigate between arrested and fluidized states. Here, we uncover a hidden universality in their non-linear oscillatory response: at sufficiently low frequencies their first-harmonic viscoelastic moduli collapse onto master curves against strain amplitude. This collapse reflects an invariant intra-cycle stress plateau, showing that the material rearranges almost instantaneously to maintain a constant stress state governed by a unique temporal trajectory of its relaxation time. We capture this phenomenology using a new fluidity model derived from a Lyapunov function exhibiting symmetry breaking. Our framework reveals that recoverable elastic energy, fragility, and the entropy produced during stress inversion are fundamentally intertwined, defining a single viscoplastic parameter that governs yielding abruptness and provides a novel thermomechanical foundation for the dynamic yield stress.", "url": "https://arxiv.org/abs/2607.11799", "type": "理论", "summary": "1. 该工作揭示了屈服应力流体在大振幅振荡剪切下第一谐波粘弹模量随应变幅度的主曲线塌缩普适标度行为。\n2. 其核心在于发现模量塌缩源于循环内不变的应力平台，该平台由弛豫时间的唯一次轨线维持，并基于Lyapunov函数建立了新的流体率模型。\n3. 这确立了可恢复弹性能、系统脆性与应力反转熵之间的热力学关联，定义了单一粘塑参数以统一描述屈服突变性与动态屈服应力。", "summary_source": "deepseek", "authors": [{"name": "Rajam Elancheliyan"}, {"name": "Jean Marc Fromental"}, {"name": "Edouard Chauveau"}, {"name": "Domenico Truzzolillo"}], "featured_authors": [{"name": "Rajam Elancheliyan"}, {"name": "Jean Marc Fromental"}, {"name": "Edouard Chauveau"}, {"name": "Domenico Truzzolillo"}], "author_count": 4}, {"id": "2607.11877", "category": "cond-mat", "title": "Slow is fast: raising barriers to accelerate thermal relaxation", "abstract": "For a reversible system relaxing to equilibrium, the obvious fastest strategy is to lower all kinetic barriers (open all gates). We find that such intuition holds at three levels: the all-open-gate strategy achieves the highest local conductance, it maximizes the instantaneous speed of approach in every $f$-divergence, and it simultaneously maximizes all relaxation eigenvalues. Nevertheless, we show that a counter-intuitive finite-time optimum lies beyond this intuition and operates at a fourth level, invisible to all three: eigenvector rotation. Noncommutativity enables timed schedules to reproject residual amplitudes across relaxation modes, thereby achieving faster relaxation. Optimal schedules are bang--bang. In our illustrative example, the best-found schedule also employs counter-gating, transiently raising selected barriers, and reduces the terminal residual by a factor of $130$ relative to all-open, and by $7$ relative to the best static landscape. A no-go theorem shows that noncommutativity is necessary: commuting generators collapse every schedule to a static time-averaged landscape, worse than the intuitive static control. In the reverse problem, the dual schedule preserves nonequilibrium free energy far more effectively than intuitively keeping all barriers at maximum heights. Whether accelerating or delaying relaxation, barrier control performs no work on the reduced Markov system; it only re-times a fixed total dissipation budget.", "url": "https://arxiv.org/abs/2607.11877", "type": "理论", "summary": "1. 该工作通过分析可逆马尔可夫系统热弛豫的有限时间最优控制，发现临时提高某些势垒（反门控）比全部降低势垒更快达到平衡。\n2. 其核心卖点是揭示了非对易性导致特征向量旋转，使得bang-bang控制方案能在固定总耗散预算内重新分配弛豫模振幅，将终端残差降低130倍。\n3. 这为理解非平衡热力学中的时间-能量权衡提供了新机制，表明非对易性是超越静态最优控制的必要条件，且势垒控制仅重排耗散时序而不做功。", "summary_source": "deepseek", "authors": [{"name": "Yubo Wang"}, {"name": "Zhiyue Lu"}], "featured_authors": [{"name": "Yubo Wang"}, {"name": "Zhiyue Lu"}], "author_count": 2}, {"id": "2607.09847", "category": "hep-th", "title": "Carrollian limit of NS-NS and Heterotic Supergravity", "abstract": "We construct the Carrollian limit of NS--NS and heterotic supergravity through an ultra-relativistic expansion of the fields. An appropriate scaling of the dilaton renders the measure finite and compensates the divergences arising from the NS-NS supergravity Lagrangian, giving a finite action as $w\\rightarrow\\infty$. We then extend the construction to heterotic supergravity (neglecting fermions) by incorporating the non-Abelian gauge field together with the Green--Schwarz (GS) mechanism. The resulting theory contains a finite gauge sector consistently coupled to gravity, and the GS mechanism for the Carrollian 1-form field can be trivialized imposing field redefinitions. Then, we investigate the Carrollian equations of motion by both expanding the relativistic equations and deriving them from a variational principle. We also show that the leading $\\alpha'$-corrected $\\hat{\\rm Riem}^2$ contribution remains finite under a rescaling of the string parameter $\\alpha'\\rightarrow \\frac{\\alpha'_c}{w^2}$, opening further research towards the full four-derivative effective action. Finally, we discuss the potential connection with the worldsheet formalism of the Carrollian string theory.", "url": "https://arxiv.org/abs/2607.09847", "type": "理论", "summary": "1. 该工作通过对场进行超相对论展开，在w→∞极限下构建了NS-NS和异质超引力的Carrollian理论，并分别通过扩展相对论方程和变分原理推导了Carrollian运动方程。\n2. 其核心卖点在于通过膨胀子的适当标度消除超引力拉格朗日量的发散使作用量有限，将非阿贝尔规范场与Green-Schwarz机制自洽纳入该极限，并通过场重定义平凡化Carrollian 1-形式的GS机制；同时前导α'修正的Riem^2贡献在α'→α'_c/w^2重标度下保持有限。\n3. 该工作为联系Carrollian弦理论的世界面形式以及后续构建包含四导数项的完整有效作用量提供了清晰的理论基础和关键切入点。", "summary_source": "deepseek", "authors": [{"name": "Romina Ballesteros"}, {"name": "Eric Lescano"}, {"name": "Sergio Patiño-López"}], "featured_authors": [{"name": "Romina Ballesteros"}, {"name": "Eric Lescano"}, {"name": "Sergio Patiño-López"}], "author_count": 3}, {"id": "2607.09879", "category": "hep-th", "title": "Anomaly cancellation for two $U(1)$ factors", "abstract": "We show that solving the abelian part of the local anomaly cancellation conditions for a 4-d gauge theory whose gauge Lie algebra has an abelian summand with rank $K \\geq 1$ is equivalent to the problem in algebraic/arithmetic geometry of finding $(K-1)$-dimensional projective linear subspaces of a cubic hypersurface over the rational numbers, where the cubic is determined by the data of the semisimple summand and the representation thereof carried by the Weyl fermions. We then use this reformulation to solve a variety of examples with rank 2. The simplest non-trivial example from physics, namely gauge Lie group $U(1)^2$ and six fermions, nevertheless has a rich (and well-studied) geometry: it corresponds to the Fano variety of lines in the Segre cubic primal threefold. This is a surface with 15 irreducible components that are planes (which correspond to lines lying in the 15 planes in the Segre cubic primal and which give rise to non-chiral fermions) and 6 components that are split del Pezzo surfaces of degree 5 (which give rise to chiral fermions). These components are all rational varieties, enabling all solutions to the anomaly cancellation conditions to be parametrized and their collective properties (e.g. their topology and asymptotic distribution) to be described.", "url": "https://arxiv.org/abs/2607.09879", "type": "理论", "summary": "1. 该工作将四维规范理论中阿贝尔反常抵消条件等价为有理数上三次超曲面的射影线性子空间问题，并求解了秩2情形。\n2. 其核心在于揭示U(1)²六费米子模型对应Segre三次原流形的Fano簇，该簇含15个平面不可约分量与6个分裂del Pezzo五度曲面，分别对应非手征与手征费米子。\n3. 该几何重构使得反常抵消解集完全参数化，并描述了其拓扑性质与渐近分布，为高秩阿贝尔反常分析提供了代数几何路径。", "summary_source": "deepseek", "authors": [{"name": "Ben Gripaios"}, {"name": "Khoi Le Nguyen Nguyen"}], "featured_authors": [{"name": "Ben Gripaios"}, {"name": "Khoi Le Nguyen Nguyen"}], "author_count": 2}, {"id": "2607.09935", "category": "hep-th", "title": "Bosonization versus the Nielsen-Ninomiya theorem", "abstract": "Thanks to bosonization, bosonic lattice models can offer a lattice regularization of chiral fermions. We construct chiral lattice fermion operators in the 2D modified Villain scalar model and evaluate their correlation functions. This microscopic bosonic model has an ultra-local action and an ultra-local symmetry that realizes the fermionic chiral symmetry under bosonization. The reconstructed lattice Dirac operator has no doublers, but is consistent with the Nielsen-Ninomiya theorem because it turns out to be non-local. The non-locality of this derived quantity at finite lattice spacing does not pose any obstructions to gauging the non-anomalous symmetries of the model, which is itself ultra-local.", "url": "https://arxiv.org/abs/2607.09935", "type": "理论", "summary": "1. 该工作在二维修正Villain标量模型中，通过玻色化构造手征晶格费米子算符并计算其关联函数。\n2. 其卖点在于超局域玻色模型经玻色化实现费米子手征对称性，所得无doubler的Dirac算符虽非局域但仍与Nielsen-Ninomiya定理自洽。\n3. 这揭示了此类超局域模型中无反常对称性的规范可行性，非局域性不会阻碍规范耦合的引入。", "summary_source": "deepseek", "authors": [{"name": "Saif Ullah Baig"}, {"name": "Shi Chen"}, {"name": "Aleksey Cherman"}, {"name": "Maria Neuzil"}], "featured_authors": [{"name": "Saif Ullah Baig"}, {"name": "Shi Chen"}, {"name": "Aleksey Cherman"}, {"name": "Maria Neuzil"}], "author_count": 4}, {"id": "2607.10006", "category": "hep-th", "title": "Color-factor symmetry using perturbiner methods for tree-level amplitudes of Yang-Mills theory coupled to matter", "abstract": "Bern-Carrasco-Johansson relations are helicity-independent constraints among the partial amplitudes of tree-level processes containing gluons and possibly also matter fields. They are a consequence of color-kinematic duality, but alternatively can be derived using the color-factor symmetry of tree-level amplitudes. We use recursive perturbiner methods to present a general, streamlined proof of the color-factor symmetry of all tree-level amplitudes containing an arbitrary number of fundamental spin-zero or spin-one-half matter fields and at least one gluon.", "url": "https://arxiv.org/abs/2607.10006", "type": "理论", "summary": "1. 该工作利用递归perturbiner方法，给出了包含任意数量自旋零或自旋半物质场及至少一个胶子的所有树图振幅颜色因子对称性的一般性证明。\n2. 其技术卖点在于证明了颜色因子对称性独立于螺旋度，为BCJ关系提供了简洁统一的推导，且不依赖颜色-运动对偶性的显式构造。\n3. 这为树图振幅中颜色-运动对偶性的起源提供了更基本理解，有望推广至圈图或含更多物质类型的振幅系统。", "summary_source": "deepseek", "authors": [{"name": "Abigail R. Chriss"}, {"name": "Mia Karlsson"}, {"name": "Stephen G. Naculich"}], "featured_authors": [{"name": "Abigail R. Chriss"}, {"name": "Mia Karlsson"}, {"name": "Stephen G. Naculich"}], "author_count": 3}, {"id": "2607.10133", "category": "hep-th", "title": "Superspace invariants and 3-point correlators in 3d $\\mathcal{N}=3,4$ SCFTs", "abstract": "We use the auxiliary polarization spinor formalism together with superspace techniques to construct a complete and minimal list of 3-point invariant structures in three-dimensional superconformal field theories (SCFTs) with $\\mathcal{N}=3$ and $\\mathcal{N}=4$ superconformal symmetry. The existence of non-abelian $R$-symmetry for $\\mathcal{N}=3,4$ gives rise to novel invariant structures built from the antisymmetric invariant tensor. These invariants are used to enumerate the structural form of spinning 3-point correlators of general as well as conserved spinning superfield operators in 3d SCFTs. For conserved operators, we find that the $\\mathcal{N}=3$ correlators are fixed upto one parity-even and one parity-odd structure, while $\\mathcal{N}=4$ conserved correlators admit two parity-even structures and one parity-odd structure, with the second parity-even structure associated with mirror symmetry breaking.", "url": "https://arxiv.org/abs/2607.10133", "type": "理论", "summary": "1. 该工作借助辅助极化旋量形式与超空间技术，系统构造了三维N=3和N=4超共形场论中三点函数的不变结构完整最小列表。\n2. 其关键卖点在于利用非阿贝尔R对称性引入基于反对称不变张量的新结构，并精确确定了守恒自旋超场算子的宇称分类：N=3固定至一偶一奇，N=4允许两偶一奇，其中第二偶结构与镜对称破缺直接相关。\n3. 这为三维超共形场论中一般与守恒算子相关函数的完整分类提供了严格框架，并开辟了从宇称结构诊断镜对称性破缺的理论途径。", "summary_source": "deepseek", "authors": [{"name": "Aditya Jain"}, {"name": "Amin A. Nizami"}], "featured_authors": [{"name": "Aditya Jain"}, {"name": "Amin A. Nizami"}], "author_count": 2}, {"id": "2607.10448", "category": "hep-th", "title": "D-branes in $AdS_2 \\times H^2 \\times H^2$ under the non-Abelian T-duality", "abstract": "We proceed to construct a non-Abelian dual pair for the $AdS_2 \\times H^2 \\times H^2$ background by applying the non-Abelian T-duality (here as Poisson-Lie T-duality on a semi-Abelian double). By using a certain parameterization of the $6$-dimensional Lie group ${A}_2 \\otimes {A}_2 \\otimes A_2$ we construct the original $\\sigma$-model including the $AdS_2 \\times H^2 \\times H^2$ metric in the absence of $B$-field. It is shown that the dual background constructed by means of the Poisson-Lie T-duality is supported by a $B$-field and a metric whose contains a physical singularity. By studying the behavior of the dual spacetime at small $(r , y, u)$ coordinates, we show that the dual metric with a zero field strength and a non-trivial dilaton field make up a solution for the vanishing of the one-loop beta-function equations. Furthermore, at large $(r , y, u)$, it is shown that the $AdS_2 \\times H^2 \\times H^2$ solution is preserved under the non-Abelian T-duality. Finally, using the duality map obtained from the canonical transformation description of the Poisson-Lie T-duality for the gluing matrix which locally defines the properties of the D-brane, we find seven different cases of the gluing matrices for the $AdS_2 \\times H^2 \\times H^2$ $\\sigma$-model and its dual pair. In this way, it is found a symmetric duality action on the branes linking together in a duality chain.", "url": "https://arxiv.org/abs/2607.10448", "type": "理论", "summary": "1. 该工作通过参数化六维李群A2⊗A2⊗A2，对AdS2×H^2×H^2背景实施泊松-李T对偶，构造了原σ模型及其非阿贝尔T对偶背景，并系统推导了七类D膜胶合矩阵。\n2. 关键结果包括：对偶背景度规被B场支撑并含物理奇点，在坐标小时由零场强与非平凡膨胀场满足β函数方程，在坐标大时恢复原背景，且规范变换描述揭示了D膜胶合矩阵的多种选择。\n3. 这为非阿贝尔T对偶下非几何背景的膜结构与对偶链的对称性提供了具体构造，并启发了对偶性在更广泛背景中的应用。", "summary_source": "deepseek", "authors": [{"name": "Ali Eghbali"}], "featured_authors": [{"name": "Ali Eghbali"}], "author_count": 1}, {"id": "2607.10454", "category": "hep-th", "title": "Krylov Complexity for Time-Dependent Hamiltonians", "abstract": "We investigate Krylov spread complexity for states evolving under time-dependent Hamiltonians. For periodically driven systems, we formulate the problem within Floquet theory and show how the Magnus expansion provides a systematic approximation when the Floquet Hamiltonian is not available in closed form. We then extend this framework beyond periodic driving and demonstrate that, in addition to the globally truncated Magnus expansion, a piecewise Magnus expansion provides a reliable method when the global expansion loses convergence or accuracy. Our results provide practical tools for analyzing complexity growth in a broad class of time-dependent quantum systems.", "url": "https://arxiv.org/abs/2607.10454", "type": "理论", "summary": "1. 该工作研究了时间依赖哈密顿量下Krylov复杂度，针对周期驱动系统采用Floquet理论框架，并通过Magnus展开近似不可闭式表达的Floquet哈密顿量。\n2. 其核心在于引入全局与分段Magnus展开，分别处理周期驱动及全局展开失效时的复杂度演化，解决了非周期驱动下收敛性与精度的关键问题。\n3. 这为分析含时量子系统（如驱动量子多体模型）的复杂度增长提供了系统方法，可深入理解量子混沌与信息动力学。", "summary_source": "deepseek", "authors": [{"name": "Amin Faraji Astaneh"}, {"name": "Parsa Kafashi"}], "featured_authors": [{"name": "Amin Faraji Astaneh"}, {"name": "Parsa Kafashi"}], "author_count": 2}, {"id": "2607.10561", "category": "hep-th", "title": "Quantum Horizon and Quantum Membrane Paradigm from Black Hole Quantum Mechanics", "abstract": "We develop a microscopic quantum membrane paradigm from the matrix quantum mechanics of black holes [1]. It was proposed that a quantum black hole is described by a fuzzy sphere together with a half-filled Fermi sea of horizon partons. We show that the topology of the fuzzy sphere induces a Berry monopole, providing a microscopic origin for the monopole appearing in the tunneling description of the decay of quantum black hole. Because the partons couple to the fuzzy sphere as fundamental degrees of freedom, they are sensitive to this monopole and form Lowest-Landau-Level (LLL) states rather than ordinary propagating two-dimensional fermions. Their guiding-center dynamics generates Ohmic, Hall, and polarization currents on the horizon. To couple these currents to an external electromagnetic field, we introduce a two-block matrix configuration comprising black-hole, environmental, and bifundamental link sectors. Off-diagonal link modes become tachyonic near the fuzzy sphere and condense, dynamically locking the horizon gauge field to the boundary value of the external Maxwell field. The parton current thereby becomes a physical boundary source for the exterior field. Our construction replaces the fictitious membrane of the classical paradigm with a dynamical quantum membrane populated by microscopic LLL degrees of freedom. The resulting boundary condition generalizes the classical ingoing membrane condition and yields explicit quantum, frequency-dependent, and helicity-dependent corrections, offering a possible probe of the microscopic quantum structure of the horizon.", "url": "https://arxiv.org/abs/2607.10561", "type": "理论", "summary": "1. 该工作从黑洞矩阵量子力学出发，建立了一个由模糊球与半填充费米海构成的微观量子膜范式。\n2. 其核心卖点在于模糊球拓扑诱导的贝里单极使部分子形成最低朗道能级态，其引导中心动力学产生视界电流，并通过离域链接模式凝聚将视界规范场锁定至外场边界。\n3. 这给出了频率与螺旋度依赖的量子修正边界条件，为探测视界微观量子结构提供了可检验的理论途径。", "summary_source": "deepseek", "authors": [{"name": "Chong-Sun Chu"}], "featured_authors": [{"name": "Chong-Sun Chu"}], "author_count": 1}, {"id": "2607.10663", "category": "hep-th", "title": "Certified boundary-magic witness for state-dependent proto-area in a holographic code", "abstract": "We study a four-qubit product-EPR holographic code whose reconstructing region contains matter and one leg of a geometry bond. Seven deformations compare local, bipartite, bond-stabilizing, and bond-moving operators. Exact spectra show that only matter-controlled bond motion produces a leading quadratic logical-state dependence of the boundary entropy. We select one state-independent physical recovery by optimizing coherent information of the channel Choi state. A separate semidefinite program maximizes entanglement fidelity over all channels. At fixed coupling the physical recovery attains that optimum to numerical precision, while recovered-entropy subtraction leaves a nonzero variational proto-area response. Total stabilizer Renyi magic is also nonzero for deformations with no boundary response, so it does not characterize the effect. Projecting the exact stabilizer-Renyi quadratic form away from pairwise Pauli tangents defines a leading-order boundary witness. Its global convex minimum is positive for the bond-moving deformation and zero for the six comparisons. For the reference-matter-geometry resource partition, however, pairwise tangents span the full projective tangent space at the product-EPR base, so the witness vanishes for every Hermitian deformation. A two-bound extension retains this degeneracy but exhibits a split-geometry structural residual and a logical-state-dependent cut switch. These results establish a finite-code witness, not a universal magic law or continuum gravitational dynamics.", "url": "https://arxiv.org/abs/2607.10663", "type": "理论", "summary": "1. 该工作研究四比特乘积-EPR全息码，通过七种变形比较发现只有物质控制的键移动产生边界熵的二次逻辑态依赖，并建立有限码态相关原面积的边界魔法见证。\n2. 其卖点在于经相干信息与纠缠保真度优化后，仅键移动变形给出稳定的非零见证最小值，且该见证在投影稳定子-Renyi二次形式中通过排除成对Pauli切线定义，与物质-几何资源划分下的退化简并形成对比。\n3. 这为全息对应中态依赖几何的有限码诊断提供了精确计算方法，但明确排除通用魔法律或连续引力动力学，并揭示双边界扩展下的分裂几何残差和逻辑态切换结构。", "summary_source": "deepseek", "authors": [{"name": "Luis Lozano"}], "featured_authors": [{"name": "Luis Lozano"}], "author_count": 1}, {"id": "2607.10906", "category": "hep-th", "title": "The Euler-Heisenberg action for a $U(1)\\times U(1)$ dyon quantum electrodynamics", "abstract": "The one-loop effective Lagrangian of quantum electrodynamics for dyons (dQED) with a $U(1) \\times U(1)$ gauge symmetry is derived using the Schwinger proper-time method. We identify the analog of the Schwinger pair-production limit and compute the corresponding nonlinear equations of motion. The electromagnetic response of the model is analyzed by linearizing the equations of motion around a purely magnetic background. From the resulting plane-wave solutions, we obtain the effective permittivity and permeability tensors, along with the associated dispersion relations and refractive indices for parallel and perpendicular polarization modes. The refractive indices involve hybrid superpositions of both gauge sectors, as illustrated in the symmetric case $q_{(1)} = q_{(2)}$. In this background, the model exhibits vacuum birefringence, indicating that the quantum vacuum behaves as an anisotropic medium. All results consistently reduce to the standard Euler-Heisenberg predictions of QED when the magnetic charge vanishes.", "url": "https://arxiv.org/abs/2607.10906", "type": "理论", "summary": "1. 该工作利用Schwinger本征时间方法，推导了具有U(1)×U(1)规范对称性的双荷量子电动力学的一圈有效拉格朗日量。\n2. 通过分析纯磁背景下的线性化运动方程，得到有效介电张量、折射率及偏振模式的色散关系，揭示出真空双折射特性与两个规范扇区的混合叠加。\n3. 当磁荷消失时，所有结果一致约化为标准Euler-Heisenberg预言，为双荷体系中的粒子对产生及量子真空各向异性研究提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "D.O.R. Azevedo"}, {"name": "T.S. Dias"}, {"name": "E.D. Pereira"}], "featured_authors": [{"name": "D.O.R. Azevedo"}, {"name": "T.S. Dias"}, {"name": "E.D. Pereira"}], "author_count": 3}, {"id": "2607.10921", "category": "hep-th", "title": "Krylov Complexity from Loschmidt Amplitude", "abstract": "Krylov complexity is a powerful diagnostic of quantum dynamics, with clear connections to other measures of quantum chaos and operator growth. One such measure is the Loschmidt amplitude, defined as the overlap of initially identical states evolved under two slightly different Hamiltonians. Its decay in certain systems is controlled by the classical Lyapunov exponent. Using the algebraic properties of the Krylov complexity operator, we express Krylov complexity as the derivative of a Loschmidt amplitude whose perturbation is parameterized by an angular variable $\\phi$. This formulation allows us to define a spectral propagator that encodes the entire complexity distribution, which we characterize for specific types of systems. We study the two-dimensional quantum geometry spanned by time and $\\phi$ where the original and deformed trajectories reside, demonstrating that Krylov complexity is upper-bounded by its volume. We also express the time derivative of Krylov complexity in terms of a distinct Loschmidt amplitude. Depending on the growth of the Lanczos coefficients, the perturbation term in this amplitude can be truncated. We propose that the strength of this perturbation provides a classification scheme for Krylov complexity dynamics and relate it to the $\\phi$-derivative of the spectral propagator. Using this analytical framework, we derive general relations between the time-dependence of the survival amplitude and Krylov space measures.", "url": "https://arxiv.org/abs/2607.10921", "type": "理论", "summary": "1. 该工作通过角变量φ参数化扰动，将Krylov复杂度表示为Loschmidt振幅的导数，并构建了编码复杂度分布的谱传播子。\n2. 其核心在于揭示了Krylov复杂度由时间-φ二维几何体积所上界，并基于扰动强度提出了复杂度动力学的分类方案。\n3. 这为量子混沌、算子增长及存活振幅时间依赖性与Krylov空间测度间的关系提供了统一分析框架。", "summary_source": "deepseek", "authors": [{"name": "Debarghya Chakraborty"}], "featured_authors": [{"name": "Debarghya Chakraborty"}], "author_count": 1}, {"id": "2607.10981", "category": "hep-th", "title": "Revisiting wormhole-induced global symmetry breaking", "abstract": "It is widely believed that global symmetries cannot exist in a consistent theory of quantum gravity. A prominent mechanism underlying this expectation is provided by gravitational instantons or Euclidean wormholes, whose contributions to the Euclidean path integral generates local symmetry-breaking operators in the effective action with couplings parametrized by the $\\alpha$-parameters $\\overrightarrow{\\alpha}=(\\alpha_1^{},\\alpha_2^{},\\cdots)$. The appearance of these $\\alpha$-parameters is often taken as evidence that wormholes explicitly break global symmetries. In this paper, we argue that this conclusion is premature. The fate of the symmetry is determined by the ensemble average over these $\\alpha$-parameters. We show that, under broad situations, this average can be sharply dominated by the symmetric point $\\overrightarrow{\\alpha}=0$, while contributions from other symmetry-breaking critical points $\\overrightarrow{\\alpha}\\neq 0$ are typically suppressed by a doubly exponential factor $\\exp(-e^{2S_{\\rm ins}})$, where $S_{\\rm ins}$ is the instanton action. In particular, standard $\\mathrm{U}(1)^{}$ Peccei--Quinn models fall into this class, implying that the conventional axion quality problem does not arise in the wormhole-induced effective theory. Our analysis is formulated for general $\\mathrm{U}(1)^{}$ $p$-form global symmetries.", "url": "https://arxiv.org/abs/2607.10981", "type": "理论", "summary": "1. 该工作重新审视虫洞诱导的整体对称性破缺，指出对称性的最终命运由α参数的系综平均决定。\n2. 其核心发现在于平均常被对称点α=0主导，对称破缺贡献受双指数因子exp(-e^{2S_ins})压制，从而避免标准U(1) Peccei-Quinn模型中的轴子质量问题。\n3. 这一分析可推广至一般U(1) p-形式整体对称性，为理解量子引力中整体对称性的存续机制提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Kiyoharu Kawana"}], "featured_authors": [{"name": "Kiyoharu Kawana"}], "author_count": 1}, {"id": "2607.11108", "category": "hep-th", "title": "A TQFT perspective on satellite constructions and toral decompositions", "abstract": "We consider the classical satellite and splice constructions of knot theory from the perspective of link-complement states in three-dimensional topological quantum field theory (TQFT). These states are prepared by a TQFT on a link-complement manifold, namely a manifold with multiple disjoint torus boundaries, obtained by removing a thickened link from a closed ambient three-manifold. In this setting, satellite and splice constructions are realized by gluing manifolds along torus boundaries, and the TQFT assigns to these building blocks multilinear operators acting on the corresponding torus Hilbert spaces. We give explicit prescriptions for these operators and show how they can be used to build link-complement states. This construction is closely related to the JSJ decomposition of link-complement manifolds. While splicing builds manifolds by gluing along tori, the JSJ decomposition cuts a manifold along essential tori into canonical pieces. From the TQFT point of view, this expresses a link-complement state as a network of elementary operators associated with the JSJ pieces. We illustrate this framework by studying the entanglement entropy of Seifert-fibered link complements, Hopf-chain complements, and complements of Whitehead-doubled Hopf chains, showing how their different JSJ structures lead to distinct entanglement patterns.", "url": "https://arxiv.org/abs/2607.11108", "type": "理论", "summary": "1. 该工作从三维拓扑量子场论视角，将纽结理论的卫星与拼接构造重新表述为沿环面边界的粘合操作，并构造了相应的多线性算子。\n2. 其核心在于将链接补空间状态分解为与JSJ分解基本块对应的算子网络，揭示了Seifert纤维化等不同结构如何导致不同的纠缠熵模式。\n3. 这为利用TQFT工具系统研究三维流形拓扑与其边界量子纠缠之间的对应关系提供了形式化框架，并可望推广至更一般的拼接与分解构造。", "summary_source": "deepseek", "authors": [{"name": "Nikolaos Angelinos"}], "featured_authors": [{"name": "Nikolaos Angelinos"}], "author_count": 1}, {"id": "2607.11125", "category": "hep-th", "title": "Evading Cosmological Strong Coupling in Non-minimally Coupled Vector Gravity", "abstract": "Recent analyses of Proca theories with non-minimal curvature couplings have uncovered an additional scalar degree of freedom with an identically vanishing propagation speed, $c_s^2=0$, signaling a scale-dependent strong-coupling problem. In this {\\it Letter}, we show that an additional derivative interaction can lift this zero-speed degeneracy and restore a non-degenerate quadratic dynamics for the scalar perturbations. In an open region of parameter space, the scalar kinetic matrix is positive definite and the high-frequency propagation speeds are real and positive. At quadratic order, this removes the specific signature of strong coupling associated with the $c_s^2=0$ mode. We also uncover a non-uniform limit as the temporal vector condensate approaches zero: at fixed nonzero $A_0$, the formal extreme-ultraviolet regime develops a ghost, while the kinetic structure of the exactly vanishing-condensate branch is different. The momentum scale at which this ghost appears is pushed toward increasingly high values as $A_0\\to0$. Whether the ghost scale ultimately lies above the EFT cutoff depends on an independent determination of the EFT cutoff. Finally, we identify a stable de Sitter fixed point with $A_0\\neq0$, surrounded by a finite region in which the scalar no-ghost and high-frequency stability conditions remain satisfied.", "url": "https://arxiv.org/abs/2607.11125", "type": "理论", "summary": "1. 该工作通过引入额外导数相互作用，规避了非最小耦合矢量引力中因标量模式声速为零导致的宇宙学强耦合问题。\n2. 其技术核心在于恢复了标量扰动的非退化二次动力学，并在参数空间开区域内实现了动能矩阵正定性与高频传播速度实正。\n3. 这一进展为高能标矢量引力有效场论的稳定性分析提供了新框架，并阐明了de Sitter背景中稳定解的存在条件。", "summary_source": "deepseek", "authors": [{"name": "Antonio De Felice"}, {"name": "Seishi Enomoto"}, {"name": "Nagisa Hiroshima"}, {"name": "Atsushi Naruko"}], "featured_authors": [{"name": "Antonio De Felice"}, {"name": "Seishi Enomoto"}, {"name": "Nagisa Hiroshima"}, {"name": "Atsushi Naruko"}], "author_count": 4}, {"id": "2607.11150", "category": "hep-th", "title": "Conjugate Boundary Conditions, Kaluza-Klein Fermions, and an Extended Seesaw Model", "abstract": "In this paper, we discuss the conjugate boundary condition (CBC), which has recently been studied as a way of realizing a Majorana fermion within a compactified five-dimensional theory ($\\mathcal M^4\\otimes S^1/Z_2$). The Majorana fermion which plays a crucial role in the seesaw scenario arises as a zero mode (lowest mode) by imposing the CBC. Although each nonzero Kaluza-Klein (KK) mode is also naively expected to be described by two Majorana fermions, we show by direct calculation that they can be combined into a Dirac spinor in the free theory or up to the level of the quadratic term in the Lagrangian. This difference comes from the fact that an accidental U(1) symmetry exists in the KK mode sector, though such a symmetry does not appear in the zero mode sector. We also point out that the compatibility between the CBC and the axial U(1) transformation plays a crucial role in the diagonalization of the KK mode. We also investigate interactions compatible with both the CBC and the chiral orbifold projection. We find that a nontrivial bulk interaction between a CBC fermion and a chiral-orbifold fermion is allowed. As an application, we construct an extended seesaw scenario by utilizing both boundary conditions and such nontrivial bulk interactions. The resulting seesaw scenario has a different property in contrast with the conventional extended seesaw scenario; namely, the above new non-trivial interactions cause lepton number violation (LNV), while the Majorana mass term in our model does not violate lepton number.", "url": "https://arxiv.org/abs/2607.11150", "type": "理论", "summary": "1. 该工作研究了共轭边界条件在五维紧致化理论中实现马约拉纳费米子，并分析了零模与Kaluza-Klein模的费米子性质，进而构造了扩展跷跷板模型。\n2. 其卖点在于揭示非零KK模扇区因意外U(1)对称性可组合为狄拉克旋量，且相容体相互作用导致轻子数破坏而马约拉纳质量项不违反该对称性。\n3. 这为构建具有新颖轻子数破坏机制的跷跷板模型提供了理论框架，并启发了对五维边界条件与高维相互作用物理后果的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Yugo Abe"}, {"name": "Yuki Adachi"}, {"name": "Yukihiro Fujimoto"}], "featured_authors": [{"name": "Yugo Abe"}, {"name": "Yuki Adachi"}, {"name": "Yukihiro Fujimoto"}], "author_count": 3}, {"id": "2607.11322", "category": "hep-th", "title": "Belinfante Symmetrization from Metric-Affine Conservation Laws: Hypermomentum as the Improvement Term -- The Cases of QED and QCD", "abstract": "We derive the Belinfante--Rosenfeld symmetrization procedure from the metric-affine conservation law by means of an affine lift of flat-spacetime field theories. Following minimal coupling to an independent affine connection, variation of the action with respect to the connection defines the hypermomentum current. Taking the flat-spacetime limit of the resulting conservation law, we recover the Belinfante--Rosenfeld relation, with the divergence of the hypermomentum current reproducing the Belinfante improvement term. We thoroughly study the form of the couplings with this property and their physical significance. The construction is illustrated for Quantum Electrodynamics and Quantum Chromodynamics.", "url": "https://arxiv.org/abs/2607.11322", "type": "理论", "summary": "1. 该工作通过平时空场论的仿射提升，从度规-仿射守恒律导出Belinfante-Rosenfeld对称化过程。\n2. 其核心技术在于将超动量流散度作为改进项，在平时空极限下恢复Belinfante对称化所需修正。\n3. 这为几何化理解量子场论中自旋与角动量张量的对称性提供了统一框架，并可推广至更一般的规范理论。", "summary_source": "deepseek", "authors": [{"name": "Damianos Iosifidis"}], "featured_authors": [{"name": "Damianos Iosifidis"}], "author_count": 1}, {"id": "2607.11332", "category": "hep-th", "title": "Large $N$ conformal bootstrap and chirality", "abstract": "We use the large $N$ critical point formalism to examine the interplay of supersymmetry and chiral symmetry on the location or otherwise of multiple zetas in the renormalization group functions of several related field theories. In particular we determine that the anomalous dimension of the matter field of the Lagrangian corresponding to the bosonic sector of the $O(N)$ Wess-Zumino is free of multiple zetas to $O(1/N^3)$.", "url": "https://arxiv.org/abs/2607.11332", "type": "理论", "summary": "1. 该工作运用大N临界点形式化方法，检验了超对称与手征对称性对多重zeta在若干相关场论重整化群函数中出现与否的影响。\n2. 其核心发现是，对应O(N) Wess-Zumino模型玻色子部分的拉格朗日量中，物质场反常维度至O(1/N^3)阶不包含多重zeta。\n3. 这为在特定超对称框架下探讨大N展开中多重zeta结构的简化提供了线索，并启示了手征约束在重整化群分析中的作用。", "summary_source": "deepseek", "authors": [{"name": "J.A. Gracey"}], "featured_authors": [{"name": "J.A. Gracey"}], "author_count": 1}, {"id": "2607.11394", "category": "hep-th", "title": "Brouwer Degree of Thermodynamic Multicritical Points in Black Holes", "abstract": "In this manuscript, we propose a novel topological framework based on the heat capacity of black holes to investigate the topology of thermodynamic multicritical points. We construct a two-dimensional thermodynamic vector field whose isolated zeros correspond to the critical points of the system. The local topology of each critical point is characterized by its Brouwer degree, which serves as a locally conserved topological quantity. Applying this formalism to several AdS black hole solutions, we demonstrate that each system possesses a globally conserved topological charge. Although the number of thermodynamic critical points changes as the thermodynamic parameters are varied, the total topological charge remains invariant throughout the evolution. We show that these topological transitions are governed by the creation or annihilation of topologically neutral defect pairs carrying opposite Brouwer degrees. Our results provide a unified topological framework for understanding the emergence, evolution, and classification of thermodynamic multicritical points in black hole systems.", "url": "https://arxiv.org/abs/2607.11394", "type": "理论", "summary": "1. 该工作基于黑洞热容构造二维热力学矢量场，利用其孤立零点对应临界点，以Brouwer度刻画各临界点的局部拓扑性质。\n2. 其核心发现是全局拓扑荷守恒，且态变过程中临界点数目变化由携带相反Brouwer度的缺陷对产生或湮灭所主导。\n3. 这为热力学多临界点的涌现、演化和分类提供了统一拓扑框架，可推广至其他引力或凝聚态系统。", "summary_source": "deepseek", "authors": [{"name": "Bidyut Hazarika"}, {"name": "Prabwal Phukon"}], "featured_authors": [{"name": "Bidyut Hazarika"}, {"name": "Prabwal Phukon"}], "author_count": 2}, {"id": "2607.11468", "category": "hep-th", "title": "Superconformal mechanics from N-extended Euler-Calogero-Moser and Calogero models", "abstract": "In this paper, we considered two-particle variants of the N-extended Euler-Calogero-Moser and Calogero models. Due the translation invariance, the center of mass can be decoupled (together with the corresponding fermions), leaving us with specific superconformal mechanics. Additional bosonic variables (spin variables) can easily be incorporated into the supercharges and the Hamiltonian. In the case of the Euler-Calogero-Moser model, the supersymmetry in the two-particle cases admits an unexpected extension from Osp(N|2) to SU(1,1|N) superconformal symmetry. The case of the Calogero model leads to purely Osp(N|2) superconformal mechanics. The way to get rid of the well-known problems along this path is to have a higher number of fermions present in the system.", "url": "https://arxiv.org/abs/2607.11468", "type": "理论", "summary": "1. 该工作从N扩展Euler-Calogero-Moser和Calogero模型的两粒子变体出发，通过解耦质心得到特定超共形力学。\n2. 技术核心在于揭示Euler-Calogero-Moser模型中超对称性从Osp(N|2)意外扩展至SU(1,1|N)，而Calogero模型保留Osp(N|2)对称性。\n3. 引入更多费米子可规避路径中的经典问题，为构建更高阶超共形对称性系统提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "S.Krivonos"}, {"name": "A.Sutulin"}], "featured_authors": [{"name": "S.Krivonos"}, {"name": "A.Sutulin"}], "author_count": 2}, {"id": "2607.11609", "category": "hep-th", "title": "Multi-rotating black holes with non-aligned angular momenta in 5D Kaluza-Klein theory", "abstract": "We present an exact solution describing multi-rotating black holes in 4D Einstein-Maxwell-dilaton theory, which can be obtained from 5D Kaluza--Klein theory via dimensional reduction. The solution represents a multi-centered configuration of rotating black holes carrying both electric and magnetic charges, with each black hole possessing a
