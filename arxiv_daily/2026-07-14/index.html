 non-aligned angular momentum. This work generalizes our previous solution for black holes with aligned angular momenta to the more general case of non-aligned angular momenta. It includes, as special cases, the Majumdar--Papapetrou solution, the recent multi-centered rotating black hole solutions of Teo and Wan, and our previous solution with unequal electric and magnetic charges. The resulting spacetimes are free of curvature singularities and closed timelike curves, both on and outside the horizons, provided that the magnitude of the spin angular momentum of each black hole remains below a certain upper bound.", "url": "https://arxiv.org/abs/2607.11609", "type": "理论", "summary": "1. 该工作构造了五维Kaluza-Klein理论降维所得四维爱因斯坦-麦克斯韦-标量理论中，具有非对齐角动量的多旋转黑洞精确解。\n2. 其关键推广在于允许每个黑洞携带独立的非对齐自旋角动量，且当角动量低于特定上界时，时空在视界内外无曲率奇点与闭合类时曲线。\n3. 这为研究多中心旋转黑洞的非平凡角动量结构及额外维理论中的引力相互作用提供了精确解析框架。", "summary_source": "deepseek", "authors": [{"name": "Shinya Tomizawa"}, {"name": "Hideo Furugori"}, {"name": "Jun-ichi Sakamoto"}, {"name": "Ryotaku Suzuki"}], "featured_authors": [{"name": "Shinya Tomizawa"}, {"name": "Hideo Furugori"}, {"name": "Jun-ichi Sakamoto"}, {"name": "Ryotaku Suzuki"}], "author_count": 4}, {"id": "2607.11617", "category": "hep-th", "title": "Bethe Ansatz without Nesting", "abstract": "We develop a non-nested Bethe ansatz description of rational $\\mathfrak{gl}_\\ell$ spin chains in the vector representation. Starting from the quantum spectral curve and the separation-of-variables framework, we derive closed systems of Bethe equations involving only the momentum-carrying Bethe roots. The construction is worked out explicitly for the $\\mathfrak{gl}_3$ and $\\mathfrak{gl}_4$ spin chains and then generalized to arbitrary rank. A central result of this work is the identification of a recursive hierarchy associated with the fundamental transfer matrices. The hierarchy is generated by regularity conditions of the lower transfer matrices and closes through a universal rank-$\\ell$ equation $\\mathcal{R}_{\\ell}=0$. This equation replaces the final level of the conventional nested Bethe ansatz and eliminates all auxiliary Bethe roots. Consequently, the complete spectral data of an eigenstate are encoded solely in the first Baxter polynomial $Q_{1}(u)$. We further obtain explicit expressions for the eigenvalues of all fundamental transfer matrices in terms of the momentum-carrying roots alone. The resulting formulation provides a compact characterization of the spectrum of rational $\\mathfrak{gl}_\\ell$ spin chains and reveals a direct connection between the quantum spectral curve, transfer-matrix fusion relations, and a truncated $Q$-system underlying the non-nested description. Finally, we investigate the quasi-classical (Gaudin) limit of the non-nested Bethe equations. For the $\\mathfrak{gl}_3$ spin chain, we show that the leading non-trivial contribution gives rise to Gaudin equations whose pole-free form naturally defines a scalar third-order $\\mathfrak{gl}_3$ oper.", "url": "https://arxiv.org/abs/2607.11617", "type": "理论", "summary": "1. 该工作发展了一种非嵌套Bethe ansatz描述有理gl_ℓ自旋链矢量表示，基于量子谱曲线与分离变量框架导出仅含动量携带根的封闭Bethe方程。\n2. 其核心卖点是识别了由低阶转移矩阵正则性生成的递归层级，并引入通用方程R_ℓ=0消除所有辅助根，使本征态谱完全由首Baxter多项式编码。\n3. 该紧凑谱表征揭示了量子谱曲线、转移矩阵融合关系与截断Q系统间的直接联系，且准经典极限给出标量三阶gl_3 oper的无极点Gaudin方程。", "summary_source": "deepseek", "authors": [{"name": "Gleb Arutyunov"}, {"name": "Hrachya Babujian"}, {"name": "Minghao Gao"}], "featured_authors": [{"name": "Gleb Arutyunov"}, {"name": "Hrachya Babujian"}, {"name": "Minghao Gao"}], "author_count": 3}, {"id": "2607.11641", "category": "hep-th", "title": "Holographic Timelike Entanglement and Subregion Complexity in Localized AdS3*S3*T4 Black Holes", "abstract": "We study timelike entanglement entropy and timelike subregion complexity in localized black holes with asymptotic AdS3*S3*T4 geometry, focusing on the black-pole solution. Unlike the BTZ solution, the black pole exhibits a nontrivial dependence on the internal sphere through the functions $K_y(r,\\theta)$ and $G(r,\\theta)$. Both observables are constructed from spacelike and timelike Lorentzian branches, but they probe the geometry in different ways: timelike entanglement yields a complex lifted area, while timelike complexity gives a real, finite renormalized volume. We employ a localized timelike prescription in which the branch profile is built at an angular label $\\theta_0$ and subsequently lifted over the physical internal angle $\\theta$. In the large-$r$ regime, the leading angular dependence drops out, recovering the expected short-interval behaviour. In the exact black-pole geometry, the temporal families become non-monotonic, making a fixed-boundary-interval selection essential. As the boundary interval increases, the selected branches move inward and become sensitive to the localized cap-horizon transition region. These results demonstrate that timelike Lorentzian observables probe localized-geometry effects that are absent in BTZ and in the leading large-$r$ description.", "url": "https://arxiv.org/abs/2607.11641", "type": "理论", "summary": "1. 该工作研究了局域化AdS₃×S³×T⁴黑洞中的类时纠缠熵和类时子区域复杂度，聚焦于black-pole解。\n2. 其技术核心在于通过内部球面函数K_y(r,θ)和G(r,θ)引入非平凡角度依赖，并采用局域化类时方案以得到实有限重整化体积。\n3. 这表明类时Lorentzian观测量能够探测cap-horizon过渡区域等局域化几何效应，超越了BTZ大r描述。", "summary_source": "deepseek", "authors": [{"name": "Jitendra Pal"}, {"name": "Yu Shi"}], "featured_authors": [{"name": "Jitendra Pal"}, {"name": "Yu Shi"}], "author_count": 2}, {"id": "2607.11645", "category": "hep-th", "title": "Notes on the bootstrap of four-point conformal integrals", "abstract": "We set up a bootstrap workflow to study four-point conformal integrals in position space, using leading singularities, single-valued multiple polylogarithmic ansätze and boundary data from expansion by regions. These four-point conformal integrals are general in the sense that they are generated by the four-point projections of all possible $f$-graphs, including all non-planar $f$-graph sectors. For three-loop cases, fourteen of the fifteen inequivalent integrand basis can be directly calculated by \\texttt{HyperlogProcedures} and the last one is fixed by Gram identity. Then we concentrate on how far the bootstrap workflow can go for four-loop cases, though it works for three-loop cases as well. We show that integrals with several leading singularities can be made tractable by decomposing them into pieces with simpler cut structure. Some four-loop integrals which can not be calculated or very hard to be calculated by other methods for now are obtained in this way. We also provide a package with skill files which is suitable to be read and used by current AI models.", "url": "https://arxiv.org/abs/2607.11645", "type": "理论", "summary": "1. 该工作建立了一个基于领先奇点、单值多对数ansatz与区域展开边界数据的bootstrap工作流，用于计算位置空间中一般四点共形积分，涵盖所有非平面f-图扇区。\n2. 其技术关键在于将具有多个领先奇点的积分分解为割结构更简单的子块，从而实现了目前其他方法难以处理的四圈情况下的系统计算。\n3. 该bootstrap框架为更高圈阶共形积分计算提供了可行路径，且所开发的技能文件包便于AI模型直接读取与集成应用。", "summary_source": "deepseek", "authors": [{"name": "Xuhang Jiang"}], "featured_authors": [{"name": "Xuhang Jiang"}], "author_count": 1}, {"id": "2607.11828", "category": "hep-th", "title": "Modular structures in the DSSYK partition function", "abstract": "We study the low-temperature expansion of the disk partition function $Z(\\beta)$ of the double-scaled SYK model (DSSYK) at fixed coupling $\\lambda=2p^{2}/N$, where $N$ is the number of Majorana fermions and $p$ is the number of fermions in each interaction term, both taken to infinity. We show that the exact Bessel-function representation of $Z(\\beta)$, expanded at large argument (corresponding to low temperature), can be organized in terms of the classical ring of quasi-modular Eisenstein series $E_{2},E_{4},E_{6}$ and their differential identities. Exploiting the modular $S$-duality properties of this ring, we derive the semiclassical (small $\\lambda$) low-temperature expansion of $Z(\\beta)$, splitting it into a perturbative tower and a non-perturbative sector controlled by $\\widetilde q=e^{-4\\pi^{2}/\\lambda}$. At each order in $\\widetilde q$, we determine the non-perturbative correction in closed form up to second order in $\\lambda$; the resulting series resums into a compact expression in the same Eisenstein series, extending previous semiclassical results beyond their strict $\\beta\\to\\infty$ limit. We further show that this entire structure follows from a single, exact differential equation coupling a modular derivative to derivatives with respect to temperature. Finally, we prove that the non-perturbative sector of $Z(\\beta)$ is exactly supported, to all orders in $\\lambda$, on the same exponents as the on-shell actions of known bilocal-Liouville saddles of the DSSYK Schwarzian limit, pointing to a well-defined bulk origin for these non-perturbative corrections.", "url": "https://arxiv.org/abs/2607.11828", "type": "理论", "summary": "1. 该工作揭示了双标度SYK模型圆盘配分函数的低温展开可由拟模Eisenstein级数环及其模S对偶性完全组织。\n2. 其核心在于将精确Bessel函数展开映射至模微分方程，从而以闭式统一半经典微扰与非微扰修正至λ二阶。\n3. 这证实了非微扰扇区指数与Schwarzian极限下双局域刘维尔鞍点作用量精确匹配，为体对偶提供了坚实证据。", "summary_source": "deepseek", "authors": [{"name": "Matteo Beccaria"}, {"name": "Eleonora Alfinito"}], "featured_authors": [{"name": "Matteo Beccaria"}, {"name": "Eleonora Alfinito"}], "author_count": 2}, {"id": "2607.11848", "category": "hep-th", "title": "Effective dynamics and quantum information in de Sitter wedge holography", "abstract": "In this paper, we study codimension-two holography in a de Sitter (dS) wedge setup, based on the idea of wedge holography. We consider a $d+1$-dimensional Anti-de Sitter (AdS) bulk spacetime bounded by two end-of-the-world branes with $d$-dimensional de Sitter geometry. We propose that this configuration is holographically dual to a conformal field theory (CFT) living on a $d-1$-dimensional sphere. Our computations of the partition function and holographic entanglement entropy support this duality and indicate that the dual CFT is non-unitary. We also analyze the mass spectrum in dS wedge holography. We verify the first law of entanglement entropy within this framework. Finally, we make use of the island prescription to study the Page curve in a simplified model within our dS wedge holography framework.", "url": "https://arxiv.org/abs/2607.11848", "type": "理论", "summary": "1. 该工作基于wedge全息框架，构造AdS体由两个dS端世界膜界定的构型，提出其对偶为球面上非幺正CFT，并通过配分函数与全息纠缠熵验证该对偶。\n2. 主要物理贡献在于确认对偶CFT的非幺正性，验证纠缠熵第一定律，并利用岛处方在简化模型中推导出Page曲线，展示纠缠熵演化。\n3. 这为dS量子引力中的信息悖论提供了具体模型，并揭示了岛机制在宇宙学视界中的应用，启发后续全息纠缠结构研究。", "summary_source": "deepseek", "authors": [{"name": "Sabyasachi Maulik"}, {"name": "Soumen Pari"}], "featured_authors": [{"name": "Sabyasachi Maulik"}, {"name": "Soumen Pari"}], "author_count": 2}, {"id": "2607.09703", "category": "math-ph", "title": "The Dirac equation in (split-)octonions: origins, variants, and modern context", "abstract": "Octonions and split-octonions have been used to express the Dirac equation in physics in several conceptually distinct ways. This review sorts them into four groups: the 2-factor (direct-product), 3-factor, and projection representations, which use (split-)octonion basis elements natively to model a spacetime basis; and the conventional use of octonions to carry Dirac algebra acting on spinors. Pointers to their modern use, and to recent methods for native split-octonionic analysis, are given throughout. Within the 2-factor approach, we document its origin (J. Köplinger, Appl. Math. Computation 182 (2006) 443, following a conjecture of C. Musès). As a side aspect, we examine the \"split octonionic Dirac equation\" of M. Gogberashvili and A. Gurchumelia (Int. J. Geom. Meth. Mod. Phys. 21 (2024) 2450214). An explicit structure-preserving rotation shows it to be this same direct-product representation, up to relabeling: an independent verification rather than \"the novel forms\" [the opening words of the authors' abstract]. Its genuine contributions are credited.", "url": "https://arxiv.org/abs/2607.09703", "type": "理论", "summary": "1. 该工作将八元数与分裂八元数表述狄拉克方程的多种方式系统分为四类，并追溯了2-因子表示的历史起源。\n2. 核心卖点在于通过保结构旋转理论，明确证实了所谓“新型分裂八元数狄拉克方程”等价于已有直接积表示，从而厘清其真实贡献。\n3. 这为后续运用分裂八元数本征基底进行类时空代数的物理分析提供了分类框架与验证范例。", "summary_source": "deepseek", "authors": [{"name": "J. Köplinger"}], "featured_authors": [{"name": "J. Köplinger"}], "author_count": 1}, {"id": "2607.10097", "category": "math-ph", "title": "PBW bases and centralisers for the $q$-Onsager algebra", "abstract": "We settle five conjectures concerning PBW bases and centralisers for the $q$-Onsager algebra. We first prove that the Baseilhac--Kolb root vectors give a PBW basis in every linear order whenever $q$ is not a root of unity, removing the previous transcendence hypothesis. We next establish twelve PBW bases in the alternating generators and show that they persist under arbitrary scalar central specialisation of the alternating central extension. This proves conjectures of Terwilliger and of Baseilhac and Belliard. Finally, we determine the centralisers of the negative and imaginary alternating subalgebras and show that all four single-family alternating polynomial subalgebras are maximal commutative. The proofs combine explicit straightening for Damiani root vectors, the degeneration $\\mathrm{gr} O_q \\simeq U_q^+(\\widehat{\\mathfrak{sl}}_2)$, and large-index triangular crossing arguments.", "url": "https://arxiv.org/abs/2607.10097", "type": "理论", "summary": "1. 该工作解决了q-Onsager代数的五个猜想，建立了PBW基在非单位根q下的普遍存在性及12个交替生成元基。\n2. 技术核心是结合Damiani根向量直化、退化同构gr O_q ≃ U_q^+(widehat{sl}_2)和大指标三角交叉论证，消除超越假设并证明标量特化下基的保持性。\n3. 这为量子可积系统中Onsager代数表示论提供了严格代数框架，并启示了更高秩q-仿射代数PBW基与中心化的类似结构。", "summary_source": "deepseek", "authors": [{"name": "Haoran Zhu"}], "featured_authors": [{"name": "Haoran Zhu"}], "author_count": 1}, {"id": "2607.10259", "category": "math-ph", "title": "The existence of full dimensional KAM tori for infinite dimensional Hamiltonian systems with long range interactions", "abstract": "We prove the existence of full dimensional KAM tori for infinite dimensional mechanical systems exhibiting long range interactions, under a Diophantine condition of Bourgain type [Bourgain2005JFA], in which the radius of the invariant tori satisfies a slower decay.", "url": "https://arxiv.org/abs/2607.10259", "type": "理论", "summary": "1. 本文严格证明了在Bourgain型Diophantine条件下，具有长程相互作用的无穷维哈密顿力学系统存在全维不变KAM环面，且环面半径可按较慢的幂律衰减。\n2. 技术核心在于将KAM迭代方案推广至非局部系统，通过引入适配的解析性权函数处理长程相互作用的特定衰减轮廓，克服了无穷维频率带来的小除数困难。\n3. 该结果为研究长程耦合经典系统（如非局域场论与等离子体物理）中的拟周期运动提供了数学基础，并可能推广至更一般的无穷维系统稳定性分析。", "summary_source": "deepseek", "authors": [{"name": "Hongzi Cong"}, {"name": "Wanran Ding"}, {"name": "Zhihan Zhang"}, {"name": "Juan Zhao"}], "featured_authors": [{"name": "Hongzi Cong"}, {"name": "Wanran Ding"}, {"name": "Zhihan Zhang"}, {"name": "Juan Zhao"}], "author_count": 4}, {"id": "2607.10493", "category": "math-ph", "title": "Path-Dependent Entropic Lagrangian for Probability Flows: Balance--Entropy Routing and Composable Information Potentials", "abstract": "Probability distributions are central to information theory, statistical inference, and modern probabilistic learning. Maximum entropy selects a probability state under prescribed constraints, but it does not specify how that state is reached, how probability is transported, or how dissipation and external information exchange are accounted for along the path. We develop a path-dependent entropic Lagrangian calculus that extends static state selection to probability-path evolution through restricted generators, upper-limit history terms, and explicit balance--entropy port routing. The construction yields the thermal state relation, conservative probability balance, and nonnegative production under standard mobility closure. Its KL/Shannon sector recovers maximum-entropy and Bayesian laws as stationary no-flux states, while time-dependent information potentials separate internal dissipation from supplied information power. Composable information and structural potentials control tails, sparsity, robustness, regularization, and nonlocal multimodality without changing the accounting architecture. Two numerical examples verify mass conservation, energy decomposition, and the total free-energy ledger.", "url": "https://arxiv.org/abs/2607.10493", "type": "理论", "summary": "1. 该工作发展了路径依赖的熵拉格朗日微积分，将最大熵的静态状态选择拓展至概率流演化，引入受限生成器和上极限历史项。\n2. 其核心在于通过显式平衡–熵端口路由，在标准迁移率封闭下恢复热状态关系、概率守恒与非负产生，并以时间依赖信息势分离内耗与供给功率。\n3. 这为可组合的信息势与结构势调控分布尾重、稀疏性、鲁棒性与非局部多模性提供了不改变核算架构的统一框架。", "summary_source": "deepseek", "authors": [{"name": "Huilong Ren"}], "featured_authors": [{"name": "Huilong Ren"}], "author_count": 1}, {"id": "2607.10510", "category": "math-ph", "title": "Rigorous bound on the aspect ratio for the formation of a nematic phase in hard rod and hard rectangle systems on $\\mathbb{Z}^2$", "abstract": "We prove the existence of a nematic phase in a model of $l\\times w$ hard rectangles on the square lattice with two allowed orientations and a large aspect ratio $k:=l/w$. The proof is based on a two-scale cluster expansion method developed previously by Disertori--Giuliani for hard rods in 2D and Disertori--Giuliani--Jauslin for hard plates in 3D. Our main contributions lie in explicitly tracking the constants and parameters and completing the arguments left implicit in these works. Hence, the proof produces a sufficient set of quantitative conditions from which estimates for the required aspect ratio can be extracted. A non-optimized evaluation of these conditions yields the bound $k\\ge 10^{72}$. Although it vastly overshoots the numerical prediction, $k_{\\min}=7$, our result appears to be the first rigorous estimate of the aspect ratio required for the formation of a nematic phase in hard rectangle systems.", "url": "https://arxiv.org/abs/2607.10510", "type": "理论", "summary": "1. 该工作严格证明了二维方格上具有两种取向的硬矩形模型存在向列相，并导出所需纵横比的下界k≥10⁷²。\n2. 其技术卖点在于应用双尺度簇展开方法，通过显式追踪常数与参数完善先前论证，首次给出向列相形成的严格定量估计。\n3. 所得下界虽远超数值预测的k_min=7，但为硬核液晶模型的有序相存在性分析提供了可优化的判据框架。", "summary_source": "deepseek", "authors": [{"name": "Qidong He"}], "featured_authors": [{"name": "Qidong He"}], "author_count": 1}, {"id": "2607.10833", "category": "math-ph", "title": "Jordan Pair Quantum Theory and the Standard Model", "abstract": "Jordan pairs and hermitian Jordan triples were discovered by mathematicians studying Jordan algebras, which describe the possible algebras of observables in quantum mechanics. We point out a striking correspondence between the doubly exceptional hermitian Jordan triple (the so-called ``bi-Cayley'' triple) and the structure of the Standard Model of particle physics. We also point out how ordinary quantum mechanics may be reformulated, and generalized, using hermitian Jordan triples.", "url": "https://arxiv.org/abs/2607.10833", "type": "理论", "summary": "1. 该工作揭示了双重例外厄米Jordan三元组（双Cayley三元组）与粒子物理标准模型结构之间的显著对应，并展示了用厄米Jordan三元组重新表述并推广量子力学的途径。\n2. 其核心在于利用Jordan对与厄米Jordan三元组的代数结构，将标准模型的基本粒子与相互作用编码进一个统一的非结合代数框架中。\n3. 这为从量子力学代数根源理解标准模型的起源提供了新视角，并可能推广至非结合量子理论和统合引力的研究。", "summary_source": "deepseek", "authors": [{"name": "John C. Baez"}, {"name": "Endre Bokor"}, {"name": "Latham Boyle"}], "featured_authors": [{"name": "John C. Baez"}, {"name": "Endre Bokor"}, {"name": "Latham Boyle"}], "author_count": 3}, {"id": "2607.11350", "category": "math-ph", "title": "Beyond Critical Slowing Down: Slow Modes, Extreme Tails, and Field Decoherence in Tipping Transitions", "abstract": "We study early-warning signals of climate tipping in the metastable stochastic Ghil--Sellers energy balance model. Rather than relying on a single scalar indicator, we analyze the transition through three complementary lenses: reduced Ruelle--Pollicott (RP) resonances, extreme value statistics, and full-field data-adaptive harmonic modes. This distinguishes bulk relaxation, tail excursions, and spatial phase organization as interacting aspects of tipping. First, using a reduced transfer-operator construction for global mean temperature and meridional thermal contrast, we estimate reduced RP resonances and Kolmogorov modes. Near tipping, several dominant decay rates drop and their modes harmonize along a common slow direction. Consequently, Green's functions aligned with this direction acquire coherent delayed-recovery tails and enhanced low-frequency susceptibility. The warning is thus carried by a bundle of slow modes rather than a single spectral gap. Second, Extreme Value Theory reveals that the cold tail of the global mean temperature anomaly becomes less sharply bounded and more persistent near the transition. The shape and extremal indices show an asymmetric organization: cold excursions probing the escape direction become more accessible and clustered. Third, Data-Adaptive Harmonic Mode (DAHM) analysis of the full temperature field shows that near tipping, leading modes still capture the large-scale trend, but fixed-rank reconstruction degrades and the DAHM phase distribution broadens. We interpret this as multivariate phase decoherence: the field retains a coherent transition component while losing sharp latitudinal phase organization. Ultimately, metastable tipping is marked by a joint reorganization of reduced spectral response, extreme-event statistics, and full-field phase coherence.", "url": "https://arxiv.org/abs/2607.11350", "type": "理论", "summary": "1. 该工作通过约化Ruelle-Pollicott共振、极值统计和全场数据自适应谐波模式三个互补视角，分析了随机Ghiel-Sellers能量平衡模型中亚稳态倾覆转变的早期预警。\n2. 其核心发现是临近倾覆时多个主导衰减率下降并沿共同慢方向谐波化，格林函数产生延迟恢复尾和低频敏感性增强，同时冷尾极值变得持久聚类，全场相位分布展宽表明退化中的纬向相干性丧失。\n3. 这为气候系统及其他多稳态系统的预警提供了超越单个标量指标的联合重组框架，强调慢模束、尾部分布与全场退相干的三方面协同识别。", "summary_source": "deepseek", "authors": [{"name": "Mickaël D. Chekroun"}, {"name": "Valerio Lucarini"}], "featured_authors": [{"name": "Mickaël D. Chekroun"}, {"name": "Valerio Lucarini"}], "author_count": 2}, {"id": "2607.11376", "category": "math-ph", "title": "Correlated and uncorrelated long--time asymptotics of type D ASEP", "abstract": "The type D ASEP is an asymmetric two--species interacting particle system on $\\Z$, in which two separately conserved species hop, bind into a composite ``bound pair'', and split. The model, along with its reversible measures and orthogonal polynomial duality, was constructed using the representation theory of $U_q(\\so_{2n})$. The reversible measures and orthogonal polynomial duality are each a product of two copies of the single-species ASEP reversible measures and orthogonal polynomial duality. In this paper, we study the long-time asymptotics of the type D ASEP. In the fixed--$q$ regime, using an exact current--decoupling identity, we prove that the asymptotic hydrodynamic limit and Tracy--Widom fluctuations decouple, as predicted from the duality. In the weak--asymmetry (Edwards--Wilkinson) regime, when $q=1-c/N^2$, we prove that the two density fluctuation fields \\underline{decouple}: each converges to a linear stochastic heat equation, with no cross--coupling in either the drift or the noise, the limiting noises having vanishing cross--correlation. More surprisingly, we then prove that the two limiting normal random variables are \\underline{correlated} with a seemingly new correlation function. The correlation is exactly equal to $(1-e^{-4c})/(4c)$, with the positive parts of the normal random variables having correlations expressed by the Bessel--Struve function. This paper, with the exception of the abstract and introduction, was written entirely by Claude Opus 4.8 and Fable 5. The proofs were then formalized in Lean, using Aristotle by Harmonic AI. The human author of this paper verified the proofs manually.", "url": "https://arxiv.org/abs/2607.11376", "type": "理论", "summary": "1. 该工作研究了D型ASEP在固定q与弱不对称两种长时极限下两物种密度涨落场的解耦与相关性。\n2. 核心技术是借助精确流–退耦恒等式与正交多项式对偶，证明弱不对称区虽密度场单独满足线性随机热方程，但极限正态变量却呈现关联函数为(1−e^{-4c})/(4c)的新互相关。\n3. 这一发现揭示了多物种相互作用粒子系统中涨落退耦合与残余非平凡关联共存的机制，为可积系统普适类研究提供了新范例。", "summary_source": "deepseek", "authors": [{"name": "Jeffrey Kuan"}], "featured_authors": [{"name": "Jeffrey Kuan"}], "author_count": 1}, {"id": "2607.11547", "category": "math-ph", "title": "On The Eigenvalue Rigidity of the Laguerre Unitary Ensemble", "abstract": "In this paper, we establish an optimal global rigidity estimate for the eigenvalues of the Laguerre unitary ensemble. Using the central limit theorem, we first construct a random measure via the eigenvalue counting function and then prove its convergence to a Gaussian multiplicative chaos measure, which yields the desired rigidity result. To prove this convergence, we apply a sufficient condition due to Claeys et al. [7] and carry out an asymptotic analysis of the corresponding exponential moments.", "url": "https://arxiv.org/abs/2607.11547", "type": "理论", "summary": "1. 该工作建立了Laguerre酉系综特征值的最优全局刚性估计。\n2. 其核心在于利用中心极限定理构造特征值计数函数驱动的随机测度，并通过指数矩渐近分析证明其收敛到高斯乘性混沌测度。\n3. 这一结果为随机矩阵特征值刚性理论提供了基于随机测度收敛的严格技术框架，有望推广至其他经典系综。", "summary_source": "deepseek", "authors": [{"name": "Chenhao Lu"}, {"name": "Xiaolu Yue"}], "featured_authors": [{"name": "Chenhao Lu"}, {"name": "Xiaolu Yue"}], "author_count": 2}, {"id": "2607.09855", "category": "quant-ph", "title": "Ergotropic and passive contributions on the phase-space information geometry of Gaussian states", "abstract": "We establish a direct connection between quantum thermodynamics and information geometry by introducing an ergotropic decomposition of the Wigner-Fisher information for Gaussian quantum states. We derive an analytical expression for the Wigner-Fisher information in terms of the phase-space covariance matrix and mean vector, and show that it naturally separates into passive and ergotropic contributions. The passive term is shown to be entirely determined by the Wigner entropy rate of the associated passive state. The ergotropic contribution, in turn, quantifies how displacement and squeezing resources modify the statistical velocity and length of the system trajectory in phase space. As an application, we analyze the recently proposed ergotropic Mpemba effect and demonstrate that it can be traced to the anomalous geometric evolution of the passive state associated with squeezed thermal states. Our results reveal how the extractable work stored in a quantum state constrains its information-geometric structure, establishing a framework that links ergotropy, entropy production rate, and statistical geometry in continuous-variable quantum systems.", "url": "https://arxiv.org/abs/2607.09855", "type": "理论", "summary": "1. 该工作通过引入高斯量子态Wigner-Fisher信息的工质分解，建立了量子热力学与信息几何之间的直接联系。\n2. 其核心在于利用相空间协方差矩阵给出解析形式，证明信息量自然分离为被动熵率项和量化位移与压缩资源的工质项。\n3. 这为可提取功约束系统信息几何结构提供了连续变量框架，并揭示了工质Mpemba效应源于被动态的反常几何演化。", "summary_source": "deepseek", "authors": [{"name": "Ivan Medina"}, {"name": "Camila Raupp"}, {"name": "Pedro B. Melo"}, {"name": "Diogo O. Soares-Pinto"}], "featured_authors": [{"name": "Ivan Medina"}, {"name": "Camila Raupp"}, {"name": "Pedro B. Melo"}, {"name": "Diogo O. Soares-Pinto"}], "author_count": 4}, {"id": "2607.09857", "category": "quant-ph", "title": "Gauge-invariant thermodynamics of a finite-time quantum Otto engine", "abstract": "We investigate a finite-time quantum Otto engine within the framework of gauge-invariant quantum thermodynamics, using the Lipkin-Meshkov-Glick model as the working medium. In this formulation, thermodynamic quantities are defined on equivalence classes of thermodynamically indistinguishable states, leading naturally to gauge-invariant notions of work, heat, entropy, and efficiency. We derive explicit expressions for these quantities and show that the usual work performed during the unitary strokes decomposes into an invariant contribution, associated with changes in the instantaneous energy spectrum and populations, and a coherent contribution arising from finite-time quantum coherences. This decomposition induces the corresponding splittings of engine efficiency and entropy production, providing a geometric interpretation of finite-time irreversibility and clarifying the role of coherence in work extraction. By analyzing the cycle's dependence on driving speed and system size, we identify the engine's operating region and investigate the influence of criticality. We show that crossing the critical region substantially reduces the parameter space in which the cycle operates as a heat engine. At the same time, whenever the engine condition remains satisfied, the discrepancy between the conventional and gauge-invariant descriptions becomes strongly suppressed, indicating that the gauge-invariant sector predominantly carries the extracted work. These results establish a direct connection between gauge-invariant thermodynamics, finite-time irreversibility, and work extraction in many-body quantum thermal machines.", "url": "https://arxiv.org/abs/2607.09857", "type": "理论", "summary": "1. 该工作以Lipkin-Meshkov-Glick模型为工作介质，在规范不变量子热力学框架下研究有限时间量子奥托发动机。\n2. 其核心是通过将功分解为能谱-布居不变贡献与有限时间量子相干贡献，为效率和熵产提供几何解释，阐明相干在功提取中的角色。\n3. 这建立了规范不变热力学、有限时间不可逆性与多体量子热机功提取间的直接联系，启发对临界区附近热机行为的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Midana Baial Sambú"}, {"name": "Thiago R. de Oliveira"}, {"name": "Lucas C. Céleri"}], "featured_authors": [{"name": "Midana Baial Sambú"}, {"name": "Thiago R. de Oliveira"}, {"name": "Lucas C. Céleri"}], "author_count": 3}, {"id": "2607.09875", "category": "quant-ph", "title": "Revealing Entanglement-Growth Mechanisms through the Magic Barrier", "abstract": "Quantum entanglement and magic are complementary resources underlying quantum computational advantage, yet their dynamical relation in many-body systems remains poorly understood. In this Letter, we show that the mechanism of bipartite entanglement growth is encoded in the relative timescale between the entropy-growth-rate peak and the magic barrier, defined as the transient peak of the anti-flatness of the entanglement spectrum. When entanglement is locally built, the same microscopic process increases the entropy and reshapes the Schmidt spectrum, so the magic-barrier peak occurs in the time window of maximal entropy growth. When entanglement is mainly transported or redistributed, entropy can grow before appreciable spectral non-flatness is generated, naturally separating the two peak times. We demonstrate this distinction in the random-field XXZ chain: the two peaks remain strongly correlated in the thermal regime, while their separation grows systematically across the thermal--MBL crossover. We further validate this theoretical framework by employing Bell-pair initial states alongside a tunable SWAP--Haar random circuit. Our results reveal an intrinsic dynamical connection between entanglement and magic, establishing the magic barrier as a powerful spectral diagnostic of how quantum information is generated, transported, and reshaped.", "url": "https://arxiv.org/abs/2607.09875", "type": "理论", "summary": "1. 该工作通过魔术势垒（magic barrier）峰值与熵增率峰值的相对时序，揭示了双粒子纠缠的不同增长机制。\n2. 核心卖点是发现局域生成纠缠时两峰同时出现，而纠缠输运或再分布时两者时间分离，并可区分热化与多体局域化行为。\n3. 该光谱诊断方法为从纠缠谱非平坦性角度理解量子信息在多体系统中的产生、迁移与重构提供了定量框架。", "summary_source": "deepseek", "authors": [{"name": "Lv Zhang"}, {"name": "Shi-Xin Zhang"}, {"name": "Heng Fan"}, {"name": "Shuo Liu"}], "featured_authors": [{"name": "Lv Zhang"}, {"name": "Shi-Xin Zhang"}, {"name": "Heng Fan"}, {"name": "Shuo Liu"}], "author_count": 4}, {"id": "2607.09882", "category": "quant-ph", "title": "Benchmarking Zero-Setup Quantum Circuit Simulators", "abstract": "Practitioners increasingly rely on hosted simulation environments, but their performance characteristics remain poorly documented. We present a systematic benchmarking study of GPU-accelerated approximate quantum simulation across two widely used methods: matrix product states (MPS) and Pauli path simulation (PPS), comparing BlueQubit (a hosted tool that handles hardware provisioning, simulator configuration, and job orchestration) against AWS Braket, Quantum Rings, PPS-Qiskit, and this http URL . For MPS, we find that GPU runtime yields sub-quadratic scaling with bond dimension, with a growing advantage over CPU at increasing scale. For Pauli path simulation on IBM's 127-qubit kicked Ising benchmark, GPUs deliver up to $1{,}400\\times$ speedup at fine truncation thresholds ($\\delta = 2.5 \\times 10^{-5}$, 27.6M Pauli terms), and are the only backends that reach accuracy regimes below $\\delta = 10^{-5}$, which remained inaccessible to the commodity CPU-based implementations and self-contained SDKs evaluated here. We also provide a reproducible characterization of these simulators across regimes, including tradeoffs that isolated evaluations do not show. To support transparency and reuse, we provide a public GitHub repository containing all benchmarking code and configurations.", "url": "https://arxiv.org/abs/2607.09882", "type": "数值", "summary": "1. 该工作系统基准测试了BlueQubit等零设置量子电路托管模拟器，对比了矩阵乘积态与Pauli路径两种GPU加速近似方法。\n2. 关键技术发现是MPS中GPU运行时间随键维度呈亚二次标度，且PPS在127量子比特交叉验证中实现高达1400倍加速，并首次突破10^{-5}截断精度。\n3. 可重复的基准测试框架与公开代码为评估模拟器性能及精度-速度权衡提供了标准化参考。", "summary_source": "deepseek", "authors": [{"name": "Arul Rhik Mazumder"}, {"name": "Mohammed Zuhair Mullath"}, {"name": "Hayk Tepanyan"}], "featured_authors": [{"name": "Arul Rhik Mazumder"}, {"name": "Mohammed Zuhair Mullath"}, {"name": "Hayk Tepanyan"}], "author_count": 3}, {"id": "2607.09893", "category": "quant-ph", "title": "An End-to-End Hybrid Quantum--Classical Sampling Workflow for Discrete Markov Random Fields: A Reproducible Case Study", "abstract": "Sampling from discrete Markov random fields (MRFs) is a hard problem. We study amplitude-encoded i.i.d. sampling for small MRFs where $2^n$ target probabilities are precomputed classically. This removes quantum exponential speedup but allows a clean comparison against classical MCMC based on independent circuit samples ($\\tau \\approx 1$). Across 60 instances spanning five graph families (1k-step burn-in, 3k retained samples), the mean ESS ratios of Quantum to Single-Site Gibbs, Block Gibbs, Tuned-Block, and Parallel Tempering are $16.35$, $7.29$, $1.82$, and $1.79$, showing modern classical samplers substantially close this gap. Amortizing $O(2^n)$ preprocessing into wall-clock time, exact inverse-CDF sampling yields $17.7\\text{M}$ ESS/s versus $488\\text{K}$ ESS/s for the quantum sampler ($36\\times$ mean rate, $153\\times$ per-instance), confirming no wall-clock advantage. We characterize MCMC autocorrelation costs and benchmark amplitude-encoded state preparation at $n \\in \\{8,10,12\\}$. An MPS scaling study ($n \\le 40$) shows bond dimension $\\chi=32$ achieves $F=0.721\\pm0.059$ at $n=40$. Finally, a matched-budget VQC vs. MPS comparison at $n \\in \\{8,10,12\\}$ shows VQC fidelities fall far below MPS: $(F_{\\mathrm{VQC}}, F_{\\mathrm{MPS}}) = (0.31, 0.99), (0.21, 0.96), (0.17, 0.88)$ at compressions $10.7\\times$, $34.1\\times$, and $113.8\\times$.", "url": "https://arxiv.org/abs/2607.09893", "type": "理论+数值", "summary": "1. 该工作通过经典预计算所有振幅编码概率，构建端到端混合量子-经典采样流程，并在五类图结构的离散马尔可夫随机场上进行可重现基准测试。\n2. 其核心在于系统对比揭示：量子振幅编码采样的有效样本量比率已与现代经典MCMC方法相当，但墙钟时间因指数级预处理而毫无优势，且变分量子电路保真度远低于张量网络。\n3. 这为评估近期量子采样优势必须纳入经典基线优化与预处理成本，以及矩阵乘积态在中小规模概率建模中的显著竞争力提供了确切技术依据。", "summary_source": "deepseek", "authors": [{"name": "Arul Rhik Mazumder"}], "featured_authors": [{"name": "Arul Rhik Mazumder"}], "author_count": 1}, {"id": "2607.09906", "category": "quant-ph", "title": "Depth-Efficient Quantum Topological Data Analysis for Regime-Specific Detection of Financial Stress", "abstract": "We present, to our knowledge, the first adaptation of Pauli Correlation Encoding (PCE) to quantum topological data analysis, reformulating Betti number estimation as a depth-efficient variational optimization over a compressed qubit register. From a Takens embedding and Vietoris--Rips filtration of S&P~500 returns, we extract combinatorial Laplacians and recast null-space counting as a continuous-PCE Rayleigh-quotient minimization with variational deflation, encoding $n_k$ simplex indices into $O(n_k^{1/\\kappa})$ qubits with shallow, ancilla-free circuits. Because the resulting loss is rational rather than bilinear in the correlators, the barren-plateau bound of~\\cite{Sciorilli25} does not transfer; empirically the gradient variance decays only polynomially, with no exponential barren plateau, over $n=4$--$12$ qubits. The classical stage matches ripser~\\cite{bauer2021ripser} on all 190 sliding windows (2007-2009). On the real market Laplacians ($\\beta_1=1$--$22$), warm-starting from a classical null-space surrogate allows PCE-VQE to recover $\\beta_1$ exactly at every scale, placing the obstacle in the optimisation landscape rather than the encoding. Chronologically split classification gives in-regime ROC AUC $0.818$, but out-of-distribution evaluation on the 2020 COVID shock and 2022 rate cycle (AUC $0.009$, $0.515$) shows the calibration does not generalize across crisis regimes.", "url": "https://arxiv.org/abs/2607.09906", "type": "理论+数值", "summary": "1. 该工作首次将Pauli关联编码应用于量子拓扑数据分析，通过深度有效的变分优化在压缩量子比特寄存器上估计Betti数。\n2. 技术核心在于将零空间计数转化为有理损失函数的瑞利商最小化，避免了指数级贫瘠高原，梯度方差仅多项式衰减，并采用浅层无辅助电路。\n3. 这揭示了量子拓扑数据分析在金融应力检测中的潜力，但跨危机状态的泛化失败表明校准高度依赖于特定状态，需要进一步改进。", "summary_source": "deepseek", "authors": [{"name": "Arul Rhik Mazumder"}, {"name": "Shreyan Ronit Mazumder"}], "featured_authors": [{"name": "Arul Rhik Mazumder"}, {"name": "Shreyan Ronit Mazumder"}], "author_count": 2}, {"id": "2607.10057", "category": "quant-ph", "title": "Quantum Circuit Vision: Cost-Aware Evaluation of Visual AI Agents for Quantum Code Generation", "abstract": "Can AI agents visually comprehend quantum circuit diagrams and generate verified executable code--and at what cost? We present Quantum Circuit Vision, a cost-aware evaluation framework for multimodal AI agents on quantum circuit visual understanding. We construct a 132-circuit benchmark spanning 13 categories ($1$--$10$ qubits) with executable Amazon Braket code and unitary-fidelity verification. Evaluating three frontier Claude-family models at different capability-cost tiers with $n=5$ repeated trials, we find that the mid-tier model (Sonnet 4.6, $1.30\\times$ credits) offers the most favorable balance on the cost-accuracy frontier: 91% pass rate on the core subset at 18% of the per-call cost of the strongest model (Opus 4.6), whose accuracy advantage is not statistically significant (paired $t$: $p=0.083$). Logistic regression confirms that circuit depth--not qubit count--is the primary predictor of failure ($p<0.001$). Chain-of-thought prompting shows no statistically significant effect (all $p>0.18$, $n=5$), suggesting that visual pattern recognition outweighs explicit reasoning strategy for structurally coupled diagrams. We propose a cascade routing strategy (cheap $\\rightarrow$ expensive models) that achieves 84% accuracy at 38% of single-model cost, demonstrating that model routing dominates prompt engineering as a cost lever. We release QCV-Dataset (132 circuits, 5 modalities, 1,931 files) on Hugging Face Hub as an open evaluation infrastructure with structured metadata for discoverability, interoperability, and responsible AI documentation, and all evaluation code, cost logs, and verification scripts on GitHub for full reproducibility.", "url": "https://arxiv.org/abs/2607.10057", "type": "理论", "summary": "1. 该工作提出量子电路视觉框架，基于132个可执行电路基准和幺正保真度验证，系统评估多模态AI代理从电路图生成量子代码的性能与成本。\n2. 其卖点在于揭示中档模型（Sonnet 4.6）在成本-精度前沿上达到91%核心子集通过率，仅消耗最强模型18%的单次调用成本，且电路深度（而非量子比特数）是失败的主要预测因子（p<0.001）。\n3. 这为构建低成本高精度的模型级联路由策略提供了实证基础，表明视觉模式识别主导电路理解，而显式推理策略（如思维链）无统计显著效果。", "summary_source": "deepseek", "authors": [{"name": "Dongping Liu"}, {"name": "Aoyu Zhang"}, {"name": "Luyao Zhang"}], "featured_authors": [{"name": "Dongping Liu"}, {"name": "Aoyu Zhang"}, {"name": "Luyao Zhang"}], "author_count": 3}, {"id": "2607.10227", "category": "quant-ph", "title": "Code-space recovery for sample-based quantum diagonalization beyond native symmetry constraints", "abstract": "Sample-based quantum diagonalization (SQD) diagonalizes a Hamiltonian in a compact subspace built from quantum samples, and its performance often relies on recovery procedures that exploit native constraints such as particle-number symmetry. For a broad class of eigenvalue problems, however, no analogous constraint is guaranteed, limiting the applicability of SQD-type recovery. Here, we introduce code-space recovery, which engineers recoverable structure through encoding rather than assuming it in the target problem. Using a dual-rail representation, each logical qubit is mapped to a physical pair, $|0\\rangle \\to |01\\rangle$ and $|1\\rangle \\to |10\\rangle$, making code-space violations in noisy samples detectable and repairable. We combine this encoding with self-consistent recovery and benchmark it on transverse- and mixed-field Ising models with up to 36 spin sites. Despite increased circuit overhead, code-space recovery yields lower projected Ritz energies than unencoded sample-support diagonalization even at smaller projected-basis dimensions, suggesting that engineered recoverable structure can extend SQD beyond native constraints.", "url": "https://arxiv.org/abs/2607.10227", "type": "理论+数值", "summary": "1. 该工作提出码空间恢复方法，通过编码而非假设原生约束，将样本量子对角化扩展至无对称性的特征值问题。\n2. 其核心在于双轨表示将逻辑量子比特映射为物理对，使噪声样本中的码空间违规可检测和修复，实现自洽恢复。\n3. 在横场与混合场伊辛模型上，码空间恢复在更小投影基下获得更低Ritz能量，表明可恢复编码可推广SQD适用范围。", "summary_source": "deepseek", "authors": [{"name": "Byeongyong Park"}, {"name": "Sanha Kang"}, {"name": "Doyeol Ahn"}, {"name": "Keunhong Jeong"}], "featured_authors": [{"name": "Byeongyong Park"}, {"name": "Sanha Kang"}, {"name": "Doyeol Ahn"}, {"name": "Keunhong Jeong"}], "author_count": 4}, {"id": "2607.10262", "category": "quant-ph", "title": "HSF-S: Speed-Optimized Compilation and Acceleration for Hybrid Schrodinger-Feynman Quantum Circuit Emulation", "abstract": "Hybrid Schrodinger-Feynman (HSF) simulation offers an attractive memory-path tradeoff for exact quantum-circuit emulation, but its practical runtime is often dominated by exponential path growth from cross-boundary two-qubit gates. Existing GPU and FPGA quantum simulators are largely optimized for full-state Schrodinger execution and therefore do not align well with HSF's path-centric workflow. This paper presents HSF-S, a compiler-accelerator co-designed framework for exact HSF-based quantum circuit emulation. HSF-S lowers input circuits to an HSF-compatible basis, formulates a rank-aware effective path-cost model, and applies dependency-preserving reordering together with discounted-gain SWAP insertion to suppress recurring cross-boundary interactions while preserving exact circuit semantics. A regression-free selector guarantees that the compiled circuit never increases effective path cost relative to the naive lowered baseline. We further design a dedicated HSF-S accelerator and execution flow, and integrate them into a stand-alone processor for efficient per-path dual-slice evaluation and final accumulation without materializing the full state vector. Across 56 benchmark circuits, HSF-S matches reference amplitudes to within floating-point precision, reduces effective path cost by up to 90.0%, and substantially improves practical tractability, including representative timeout-to-sub-second reductions under a 1-hour budget. On the resulting compiled workloads, the HSF-S processor prototype delivers up to 4.34x additional speedup.", "url": "https://arxiv.org/abs/2607.10262", "type": "理论+数值", "summary": "1. 该工作提出了一个面向混合薛定谔-费曼量子电路精确仿真的编译与加速协同框架HSF-S，通过路径成本优化与专用处理器设计实现高效执行。\n2. 其核心卖点在于利用秩感知有效路径成本模型、依赖保持重排序及折扣增益SWAP插入抑制交叉边界相互作用，并设计无需全状态向量实例化的双片评估与累加加速器。\n3. 该方法将有效路径成本降低高达90%，在1小时预算内实现超时到亚秒级缩减，为大规模量子电路精确仿真提供了可扩展的编译-硬件协同优化路径。", "summary_source": "deepseek", "authors": [{"name": "Sechan Park"}, {"name": "Kyeongwon Lee"}, {"name": "Mundo Jeong"}, {"name": "Chaebin Jung"}, {"name": "Woojoo Lee"}], "featured_authors": [{"name": "Sechan Park"}, {"name": "Kyeongwon Lee"}, {"name": "Mundo Jeong"}, {"name": "Chaebin Jung"}, {"name": "Woojoo Lee"}], "author_count": 5}, {"id": "2607.10280", "category": "quant-ph", "title": "Scaling Adaptive Non-Local Observable Quantum Super-Resolution via Matrix Product States", "abstract": "This work presents a matrix product state (MPS) simulation framework for adaptive non-local observable variational quantum circuits (ANO-VQCs) in image super-resolution (SR) beyond the practical limits of statevector simulation. Runtime benchmarks on a single NVIDIA RTX 4070 GPU show that, under the tested shallow-circuit setting, MPS completes ANO-VQC forward feature extraction for individual inputs up to 16 x 16 pixels (256 qubits), whereas statevector simulation encounters a memory bottleneck at 6 x 6 inputs (36 qubits) and exact tensor-network (Exact TN) contraction becomes computationally impractical beyond 12 x 12 inputs (144 qubits). For a fixed 7 x 7 input (49 qubits), a bond-dimension sweep over depths L = 1 to L = 4 shows that the required MPS bond dimension increases with circuit depth. Using Exact TN contraction as the reference, the bond dimension required for near-exact agreement increases from chi = 2 at L = 1 to chi = 16 at L = 4. Finally, 7 x 7 to 28 x 28 Fashion-MNIST SR training with chi = 16 shows that the shallow L = 1 model achieves the lowest loss and best LPIPS, PSNR, and SSIM among the tested depths. These results highlight MPS as a scalable and controllable simulation backend for ANO-VQC image SR and as a practical tool for studying large-scale quantum algorithms.", "url": "https://arxiv.org/abs/2607.10280", "type": "理论+数值", "summary": "1. 该工作提出了基于矩阵乘积态的模拟框架，用于自适应非局域可观测量变分量子线路在图像超分辨率中的前向特征提取。\n2. 其技术卖点在于单GPU上实现256量子比特浅层线路模拟，突破态矢量36量子比特瓶颈，且通过键维度控制近似精度。\n3. 这为大规模量子变分算法的可扩展模拟提供了实用后端，并推动了量子机器学习在超分辨率领域的实际应用。", "summary_source": "deepseek", "authors": [{"name": "Shih-Lung Yu"}, {"name": "Ming-Kang Ho"}, {"name": "Tai-Yue Li"}, {"name": "Sheng Yun Wu"}], "featured_authors": [{"name": "Shih-Lung Yu"}, {"name": "Ming-Kang Ho"}, {"name": "Tai-Yue Li"}, {"name": "Sheng Yun Wu"}], "author_count": 4}, {"id": "2607.10283", "category": "quant-ph", "title": "Resolvent algebras and limit states of interacting canonical ensembles", "abstract": "The limit states of canonical ensembles of a large number of interacting bosons at a given temperature, which are confined by harmonic forces, are studied in the framework of the resolvent algebra. It is shown that the limits satisfy the KMS condition or are ground states, regardless of the type of interaction. In case of attractive forces, where the ensembles collapse, observables that become meaningless in the limit disappear from the limit representations. For repulsive forces, this can also happen if condensates with an infinite number of particles in the same state (proper condensates) appear in the limit. The resulting structures and their interpretation are illustrated by a simple model. The study of vanishing harmonic forces (thermodynamic limit) involves changes of the dynamics. It is conveniently based on derivations acting on the algebra. They are given by the commutator of the Hamiltonians with the elements of the algebra. To ensure that the images remain in the algebra, the interaction must be regularized. This is accomplished in a manner that has only a minor impact on the dynamics and may be of broader interest. With this input a relation between the strength of the confining harmonic forces and the number of particles in the ensembles is derived from the condition that the limit states are to be stationary (invariant) under the adjoint action of the unconfined, spatially homogeneous limit dynamics. This relation encompasses the conditions that are frequently used in studies of Bose-Einstein condensates.", "url": "https://arxiv.org/abs/2607.10283", "type": "理论", "summary": "1. 该工作在解代数框架内系统研究了受简谐约束的大数量相互作用玻色子正则系综的热极限态。\n2. 其核心在于证明极限态无条件满足KMS条件或为基态，并揭示吸引坍缩与排斥凝聚中可观测量消失的代数机制，通过正则化相互作用实现了热力学极限下的动力学一致处理。\n3. 由此导出的约束强度与粒子数关系涵盖了Bose-Einstein凝聚研究的常用条件，所发展的正则化方法对更广泛的非平衡量子多体问题亦具参考价值。", "summary_source": "deepseek", "authors": [{"name": "Detlev Buchholz"}], "featured_authors": [{"name": "Detlev Buchholz"}], "author_count": 1}, {"id": "2607.10334", "category": "quant-ph", "title": "Static entanglement structure and adiabatic Bell-state preparation in the tripartite quantum Rabi model", "abstract": "The tripartite quantum Rabi model couples two qubits to a bosonic mode through a collective spin-oscillator interaction, providing a simple setting for studying two-qubit entanglement. In the zero-detuning limit, the triplet part of the spectrum splits into branches with zero and maximal entanglement, while the antisymmetric singlet ladder remains exactly decoupled. Within the triplet sector, finite detuning turns the crossings between these branches into avoided crossings and redistributes this entanglement. We identify an eigenbranch whose entanglement grows from nearly zero to a nearly maximal value through such avoided-crossing mixing. The weak-coupling level ordering yields a simple analytic criterion for whether this eigenbranch has a separable weak-coupling endpoint. A three-state effective model explains how the Bell-state component becomes dominant as the coupling increases. We further use a finite-time linear ramp of the collective coupling to benchmark the final coupling and ramp time required for high Bell-state fidelity. These results show how collective spin-oscillator coupling reorganizes spectral entanglement and connects static branch structure to finite-time Bell-state preparation.", "url": "https://arxiv.org/abs/2607.10334", "type": "理论", "summary": "1. 该工作研究了三部分量子Rabi模型中两量子比特的静态纠缠谱结构，并采用耦合强度的绝热线性斜坡，系统标定了高保真度贝尔态制备所需的最终耦合与斜坡时间。\n2. 其核心技术在于识别了零失谐时谱分支的零纠缠与最大纠缠分裂，并通过有限失谐下的避免交叉使本征分支纠缠从近零增至近最大，给出弱耦合可分离端点的简单解析判据以及三态有效模型。\n3. 该结果为理解集体自旋-振荡相互作用重整纠缠谱提供了清晰的理论图像，并建立了静态分支结构与有限时间绝热纠缠制备之间的定量联系，对基于光机械或电路QED系统的纠缠操控具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Li-Li Gao"}, {"name": "Zi-Xuan Chen"}, {"name": "Long-Jie Li"}, {"name": "Zi-Cheng Liu"}, {"name": "A-Long Zhou"}, {"name": "Chuan-Cun Shu"}, {"name": "Zi-Min Li"}], "featured_authors": [{"name": "Li-Li Gao"}, {"name": "Zi-Xuan Chen"}, {"name": "Long-Jie Li"}, {"name": "A-Long Zhou"}, {"name": "Chuan-Cun Shu"}, {"name": "Zi-Min Li"}], "author_count": 7}, {"id": "2607.10360", "category": "quant-ph", "title": "Gram-Certified Resource Continuation for Structured Quantum Representation Audits", "abstract": "Dense representation of an $n$-qubit pure state requires $2^n$ complex amplitudes, precluding dense classical materialization at large $n$. We develop Gram-certified resource continuation for structured quantum-representation workloads and ask when a solution obtained under a lower-cost resource model remains a justified initialization for a richer one. For coarse and fine state ensembles connected by a declared isometry, fine, coarse, and cross complex amplitude overlaps form a positive-semidefinite block Gram matrix. A signed operator of dimension at most twice the sample count has the nonzero signed spectrum of the fine density minus the lifted coarse density, yielding trace- and operator-norm diagnostics without constructing either density operator. We prove that a coarse weighted spectral flag with objective suboptimality $\\delta_c$ has fine-level suboptimality at most $\\delta_c+2\\varepsilon$, where $\\varepsilon$ is the empirical trace distance; the factor two is attainable. We distinguish encoder change from exact feasible-family prolongation, give a gap-dependent subspace-stability test, and show that continuation cannot overcome a final Schmidt-rank ceiling. In deterministic synthetic controls over an 8-to-40-qubit ladder, exact ancilla lifts agree to numerical precision. Transferred initialization reduces final-rung block updates from 30 to 20, but the complete cascade costs $4.80$--$5.43$ times a direct final-rung solve, without material objective improvement. Reordering eight Bell pairs reduces the maximum matrix-product-state bond from 256 to 2. Thus continuation is justified only when cross-rung mismatch, feasible-family inclusion, topology, and total work jointly satisfy prespecified audits. These noise-free classical results neither establish generic 40-qubit simulability nor claim hardware performance or quantum advantage.", "url": "https://arxiv.org/abs/2607.10360", "type": "理论+数值", "summary": "1. 该工作提出Gram认证资源延续方法，用于结构化量子表示审计中判断低成本资源模型解能否作为高成本模型初始化的依据。\n2. 核心技术是构建粗、细态系综间的正半定块Gram矩阵，通过签名算子提取细密度减去抬升粗密度的非零谱，给出无需显式构造密度算子的迹范数与算子范数诊断，并证明粗态加权谱标志的次优性δc在细态下至多增大2ε。\n3. 该工作明确了延续需同时满足跨阶梯失配、可行族包含性、拓扑与总工作量预设审计条件，为结构化量子表示的可验证资源优化提供了严格框架。", "summary_source": "deepseek", "authors": [{"name": "Azadeh Alavi"}, {"name": "Fatemeh Kouchmeshki"}, {"name": "Hossein Akhoundi"}, {"name": "Abdolrahman Alavi"}], "featured_authors": [{"name": "Azadeh Alavi"}, {"name": "Fatemeh Kouchmeshki"}, {"name": "Hossein Akhoundi"}, {"name": "Abdolrahman Alavi"}], "author_count": 4}, {"id": "2607.10473", "category": "quant-ph", "title": "Quantum algorithm for Clifford multiplication", "abstract": "Given two dense multivectors of the Clifford algebra $C\\ell(V, Q)$ with $N=2^{p+q}$ coefficients, the fastest known classical algorithms compute their geometric product in $O(N^{\\omega/2})$ arithmetic operations, where $\\omega$ denotes the matrix multiplication exponent. I show that, under amplitude encoding, a quantum computer executes the geometric product in $O(\\operatorname{polylog} N)$ time, using logarithmic space with sublogarithmic circuit depth. This exponential speedup establishes Clifford multiplication as a quantum primitive, providing an efficient computational foundation for quantum geometric algorithms and relativistic simulations.", "url": "https://arxiv.org/abs/2607.10473", "type": "数值", "summary": "1. 本工作提出一种量子算法，在振幅编码下将Clifford代数中两个多向量几何乘积的时间复杂度从经典的O(N^{ω/2})指数加速至O(polylog N)。\n2. 该算法仅需对数空间及亚对数电路深度，将Clifford乘法确立为量子原语，为量子几何计算与相对论模拟提供了高效底层运算。\n3. 这一指数加速揭示时空代数核心运算的量子可有效实现性，有望推动高维量子模拟与引力理论的计算验证。", "summary_source": "deepseek", "authors": [{"name": "Kagwe A. Muchane"}], "featured_authors": [{"name": "Kagwe A. Muchane"}], "author_count": 1}, {"id": "2607.10550", "category": "quant-ph", "title": "Coherent Quantum Schrodinger Bridge: Two-Boundary Optimal Control for Quantum Algorithm Design", "abstract": "Quantum algorithms are intrinsically two-boundary processes: an input state is prepared, and an output state or subspace is selected as the computational answer. We formulate this observation as a coherent Quantum Schrödinger Bridge (QSB), a pure-state Hamiltonian counterpart of Schrödinger bridge theory in which the endpoint constraint is imposed on state vectors and the transport cost is the quadratic control action. In this setting Aharonov's two-state vector becomes the natural optimal-control pair: a forward state from the input and a backward state from the target. Pontryagin's principle then yields a universal optimal Hamiltonian whose weak value is purely imaginary in the geodesic gauge. Thus weak values are not an auxiliary interpretation; they are the local response functions that quantify the drift of the pre-selected state toward the post-selected boundary. Applying this framework to unstructured search, periodicity finding, and matrix arithmetic, we reconstruct Grover's algorithm, the quantum Fourier transform underlying Shor's algorithm, and quantum singular value transformation (QSVT). The usual circuit components -- oracles, diffusion reflections, controlled phases, and signal-processing rotations -- emerge as Lie-algebraic syntheses of the optimal weak-value drift. This perspective unifies distinct algorithmic paradigms into a single geometric principle: algorithm design is the problem of choosing computational boundary conditions and realizing the corresponding optimal flow.", "url": "https://arxiv.org/abs/2607.10550", "type": "理论+数值", "summary": "1. 该工作提出相干量子薛定谔桥框架，将量子算法设计重新表述为双边界最优控制问题。\n2. 其核心在于以阿哈罗诺夫双态向量为最优控制对，导出弱值纯虚数的普适最优哈密顿量，并重构了Grover算法、量子傅里叶变换及量子奇异值变换。\n3. 这揭示了量子算法统一的几何原理：算法设计即为选择计算边界条件并实现相应的最优流。", "summary_source": "deepseek", "authors": [{"name": "Masayuki Ohzeki"}], "featured_authors": [{"name": "Masayuki Ohzeki"}], "author_count": 1}, {"id": "2607.10707", "category": "quant-ph", "title": "MDQEC-QAS: Meta-Decoding for Quantum Error Correction with Hardware-Aware VQC Search and Confidence-Gated Recovery", "abstract": "We propose a unified meta-decoding framework for quantum error correction that learns syndrome-to-recovery mappings across multiple stabilizer codes and noise settings, without requiring separate decoders for each configuration. The benchmark includes FiveQubit, Steane, Planar3x3, and Planar5x5 codes, four noise families, and five evaluation regimes: interpolation, unseen-p transfer, unseen-noise transfer, few-shot unseen-code adaptation, and few-shot held-out-size adaptation. We compare a classical Meta-MLP teacher-trained baseline with variational quantum circuit (VQC) meta-decoders selected through hardware-aware quantum architecture search over qubit count, circuit depth, and entangling topology. The Meta-MLP achieves teacher-label accuracies of 0.9993, 0.9118, 0.9342, 0.6304, and 0.7548 across the five regimes, while the hardware-aware VQC achieves 0.9400, 0.8495, 0.8415, 0.5678, and 0.7143. However, logical-level evaluation shows that high teacher-label accuracy alone is insufficient in the most challenging Planar5x5 setting. During interpolation, the raw logical-failure ratios relative to the teacher are 12.08 and 25.91 for the Meta-MLP and VQC, respectively, whereas confidence-gated fallback reduces them to 1.71 and 1.11. These results support confidence-aware selective recovery rather than unconditional teacher replacement.", "url": "https://arxiv.org/abs/2607.10707", "type": "数值", "summary": "1. 该工作提出了一个统一元解码框架，跨多个稳定子码和噪声设置学习综合征到恢复的映射，无需为每种配置单独训练解码器。\n2. 其技术特色在于结合硬件感知量子架构搜索优化的变分量子电路与置信门控恢复机制，在Planar5x5挑战情景中将逻辑失败率从25.91降至1.11。\n3. 研究揭示教师标签准确率不足以保障逻辑级性能，置信感知选择性恢复更优，为实用量子纠错解码策略提供新启发。", "summary_source": "deepseek", "authors": [{"name": "Prashant Kumar Choudhary"}, {"name": "Nouhaila Innan"}, {"name": "Muhammad Shafique"}, {"name": "Rajeev Singh"}], "featured_authors": [{"name": "Prashant Kumar Choudhary"}, {"name": "Nouhaila Innan"}, {"name": "Muhammad Shafique"}, {"name": "Rajeev Singh"}], "author_count": 4}, {"id": "2607.10714", "category": "quant-ph", "title": "Nonlocal nonstabilizerness for slightly entangled quantum many-body states", "abstract": "Nonlocal nonstabilizerness quantifies the irreducible magic resource encoded in bipartite entanglement, but its evaluation is generally hindered by a highly nonconvex optimization over local unitary transformations. Here we propose a Schmidt-reference-state framework that replaces this optimization by a direct construction from the sorted Schmidt spectrum. We conjecture that the nonlocal stabilizer Rényi entropy (SRE) is given by the SRE of the corresponding reference state, and support this conjecture through analytical and numerical evidences. Our framework makes nonlocal nonstabilizerness efficiently accessible for weakly entangled many-body states whenever the entanglement spectrum is available. Applying it to Haar-random states, critical spin chains, and PXP dynamics, we show that nonlocal SRE captures nonstabilizer structures in the entanglement spectrum that are invisible to conventional entanglement measures. Our results establish entanglement spectra as a powerful window into irreducible nonstabilizer correlations, opening a broadly applicable route to studying nonlocal magic resources of quantum many-body systems in and out of equilibrium.", "url": "https://arxiv.org/abs/2607.10714", "type": "理论+数值", "summary": "1. 该工作提出了一个施密特参考态框架，将非局域非稳定化子量的计算转化为从施密特谱直接构造参考态。\n2. 其核心在于通过猜想非局域稳定化子Rényi熵等于参考态熵，绕开高度非凸的局域酉优化，并提供了解析与数值证据。\n3. 这使弱纠缠多体系统的非局域magic资源变得高效可计算，揭示了纠缠谱中不可约非稳定化关联的新窗口。", "summary_source": "deepseek", "authors": [{"name": "Lei-Yi-Nan Liu"}, {"name": "Jian Cui"}], "featured_authors": [{"name": "Lei-Yi-Nan Liu"}, {"name": "Jian Cui"}], "author_count": 2}, {"id": "2607.10743", "category": "quant-ph", "title": "Connectivity-induced surface-loss penalty in superconducting qubit-coupler lattices", "abstract": "Recent advances in design and fabrication have increased the energy-relaxation times of isolated superconducting transmon qubits to the hundreds-of-microseconds regime, with reported values exceeding 500 $\\mu$s. However, the same progress has not automatically translated to multiqubit processors, where qubits are embedded in connected qubit-coupler lattices and often exhibit much shorter lifetimes than isolated qubits. To identify possible sources of this discrepancy, here we use finite-element simulation to investigate how surface participation ratios and the resulting surface dielectric loss change when a qubit is embedded in a flip-chip qubit-coupler lattice. Controlled comparisons show that higher connectivity can indeed lead to larger surface loss: in the simulated lattice, connecting a qubit to two and four couplers increases the surface loss by factors of 1.3 and 1.8, respectively. We attribute this change to the combined effects of added edge fields from coupling claws, field redistribution over the larger connected metal network, and hybridization with coupler modes. We further examine how this connectivity-induced surface-loss penalty depends on the geometric design parameters of both the qubit electrodes and the coupling claws, and derive guidelines for designing low-loss multiqubit processors.", "url": "https://arxiv.org/abs/2607.10743", "type": "数值", "summary": "1. 该工作通过有限元模拟研究了超导transmon量子比特嵌入倒装芯片量子比特-耦合器晶格时，连接性增加导致的表面介电损耗惩罚。\n2. 其核心发现在于连接两个和四个耦合器使表面损耗分别增大1.3和1.8倍，机制涉及耦合爪边缘场、金属网络场重分布及与耦合器模式杂化的协同效应。\n3. 这为通过优化量子比特电极与耦合爪几何参数来抑制多量子比特处理器中表面损耗提供了定量设计准则。", "summary_source": "deepseek", "authors": [{"name": "Xu-Yang Gu"}, {"name": "Gui-Han Liang"}, {"name": "Ming-Chuan Wang"}, {"name": "Yongxi Xiao"}, {"name": "Cheng-Lin Deng"}, {"name": "Zheng-He Liu"}, {"name": "Tian-Ming Li"}, {"name": "Kai Xu"}, {"name": "Zhongcheng Xiang"}, {"name": "Heng Fan"}], "featured_authors": [{"name": "Xu-Yang Gu"}, {"name": "Gui-Han Liang"}, {"name": "Ming-Chuan Wang"}, {"name": "Kai Xu"}, {"name": "Zhongcheng Xiang"}, {"name": "Heng Fan"}], "author_count": 10}, {"id": "2607.10765", "category": "quant-ph", "title": "Spectral gap of Lee-Yang Hamiltonians", "abstract": "The Lee-Yang theorem and its quantum extensions state that, for a broad class of Hamiltonians on any graph, the partition function's zeros in the complex magnetic field plane lie only on the imaginary axis. For these Hamiltonians, we prove that under a uniform Z-field of any strength h, the ground state has a spectral gap of at least h/4, independent of the system size and of the coupling strengths. The proof uses the zero-freeness of the partition function as given by Asano and Suzuki-Fisher to show exponential decay of the imaginary-time correlations for any product of Z-operators. Our result gives a polynomial-time quantum algorithm for computing the ground state energy of any Lee-Yang Hamiltonian.", "url": "https://arxiv.org/abs/2607.10765", "type": "理论+数值", "summary": "1. 该工作证明，对任意图上的Lee-Yang Hamiltonians，在均匀Z场h下，基态谱隙至少为h/4，且不依赖于系统尺寸与耦合强度。\n2. 其核心在于利用Asano和Suzuki-Fisher给出的配分函数零点自由性，严格证明任意Z算符乘积的虚时关联呈指数衰减。\n3. 这为计算任何Lee-Yang Hamiltonian基态能量提供了多项式时间的量子算法，并启示了零点自由性在谱隙证明中的普遍威力。", "summary_source": "deepseek", "authors": [{"name": "Chaithanya Rayudu"}, {"name": "Jun Takahashi"}], "featured_authors": [{"name": "Chaithanya Rayudu"}, {"name": "Jun Takahashi"}], "author_count": 2}, {"id": "2607.10772", "category": "quant-ph", "title": "Demonstrating Quadratic Monte Carlo Speedup via Quantum Amplitude Estimation: Nuclear Engineering Examples", "abstract": "We demonstrate quantum amplitude estimation (QAE) as a route to quadratic speedup for Monte Carlo-type expectation values in nuclear engineering. Using QPE-based QAE, we study two examples: a discrete fission-neutron-yield expectation and a U-238 resonance integral under a $1/E$ slowing-down spectrum. The toy problem is implemented as a gate-level Qiskit circuit, while the resonance-integral example is simulated through an exact eigendecomposition of the Grover operator to avoid state-preparation decomposition bottlenecks. In both cases, the squared error scales as $O(1/T^2)$ with the number of oracle calls $T$, compared with the classical Monte Carlo scaling $O(1/N)$. For the U-238 example, QAE recovers the resonance integral to approximately $0.03%$ relative error with $m=14$ phase-estimation qubits.", "url": "https://arxiv.org/abs/2607.10772", "type": "数值", "summary": "1. 该工作通过量子振幅估计实现核工程蒙特卡洛期望值计算的二次加速，以离散裂变中子产额和U-238共振积分为例进行验证。\n2. 技术核心在于量子相位估计使误差随Oracle调用次数T的标度从经典O(1/N)降至O(1/T^2)，且在U-238算例中用14位相估计达到约0.03%相对误差精度。\n3. 这为核工程及其他领域的高精度随机模拟提供了明确的量子加速路径，避免了态制备分解瓶颈，推动实用化量子算法发展。", "summary_source": "deepseek", "authors": [{"name": "Jilang Miao"}, {"name": "Miaomiao Jin"}, {"name": "Akira Sone"}], "featured_authors": [{"name": "Jilang Miao"}, {"name": "Miaomiao Jin"}, {"name": "Akira Sone"}], "author_count": 3}, {"id": "2607.10799", "category": "quant-ph", "title": "Quantum-enhanced physical-layer threat detection in metropolitan-scale fiber networks", "abstract": "Network security is widely recognized as a key application of quantum technology. However, its large-scale deployment is hindered by the need for tight coordination between fundamentally different quantum and classical processing steps in conventional protocols. This requirement introduces strong cross-layer interdependencies that conflict with the modular, layered architectures enabling scalability in modern communication networks. Here, we present an alternative strategy that confines all quantum interventions to the physical layer and remains transparently compatible with existing network abstractions. This is achieved by directly embedding quantum features and classical information within the same optical field using bright squeezed light. Physical-layer signals are analyzed using a cumulative sum (CUSUM) method to enable quantum-enhanced threat detection. We validate the practicality of this approach through field deployment over a metropolitan-scale fiber network and further demonstrate network-level security functionalities enabled by physical-layer quantum-enhanced thread detection. These results establish a practical, scalable framework for seamlessly integrating quantum-enhanced security into large-scale communication infrastructure.", "url": "https://arxiv.org/abs/2607.10799", "type": "理论", "summary": "1. 该工作提出一种将量子增强威胁检测完全限制在物理层的方案，并在城域光纤网络中进行了现场部署验证。\n2. 其技术核心在于利用明亮压缩光将量子特征与经典信息共载于同一光场，并通过累积和方法实现物理层量子增强信号分析。\n3. 这为量子安全技术无缝集成到现有大规模通信基础设施中提供了可扩展的实用框架，并展示了物理层量子检测支持的网络安全功能。", "summary_source": "deepseek", "authors": [{"name": "Yung-Cheng Kao"}, {"name": "Siddharth Pal"}, {"name": "Alex Forencich"}, {"name": "Dylan Cirimelli-Low"}, {"name": "Chaohan Cui"}, {"name": "Jack Postlewaite"}, {"name": "Pao-Kang Chen"}, {"name": "Nicola Alic"}, {"name": "Saikat Guha"}, {"name": "Prithwish Basu"}, {"name": "Linran Fan"}], "featured_authors": [{"name": "Yung-Cheng Kao"}, {"name": "Siddharth Pal"}, {"name": "Alex Forencich"}, {"name": "Saikat Guha"}, {"name": "Prithwish Basu"}, {"name": "Linran Fan"}], "author_count": 11}, {"id": "2607.10867", "category": "quant-ph", "title": "GroupFunctions.jl: computing individual entries of the irreducible representations of the unitary group U(d)", "abstract": "this http URL is a Julia library for computing individual matrix elements of irreducible representations of U(d). These matrix elements, called group functions, can be evaluated symbolically or numerically. For SU(2), they reduce to the Wigner D-functions. The library computes these matrix elements in a carrier-space basis enumerated by Gelfand-Tsetlin patterns. It can also compute entire representation operators, construct input unitaries from parameterisations common in quantum optics, translate Gelfand-Tsetlin patterns into occupation-number kets, and compute the associated Schur functions. Results can be exported in a form compatible with Mathematica.", "url": "https://arxiv.org/abs/2607.10867", "type": "理论+数值", "summary": "1. 该工作开发了 Julia 库 GroupFunctions.jl，用于计算 U(d) 群不可约表示的单个矩阵元，即群函数。\n2. 其技术核心在于利用 Gelfand-Tsetlin 模式枚举载空间基矢，同时支持符号与数值计算，并兼容量子光学参数化输入与 Mathematica 导出。\n3. 这为高维幺正群表示理论在量子光学、量子信息处理及多体物理中的精确计算与基矢构造提供了实用工具。", "summary_source": "deepseek", "authors": [{"name": "David Amaro-Alcalá"}, {"name": "Konrad Szymański"}], "featured_authors": [{"name": "David Amaro-Alcalá"}, {"name": "Konrad Szymański"}], "author_count": 2}, {"id": "2607.10899", "category": "quant-ph", "title": "Driven Quantum Stars as Controlled Primitives for Real-Time Spin Dynamics", "abstract": "Quantum advantage in real-time spin dynamics should be assessed against the strongest relevant classical substitutes, not merely against the qubit nature of the microscopic system. We develop a physics-based diagnostic for this boundary by reducing a qubit spin model to a spin-Landau--Lifshitz (LL) classical sector and organizing the residual quantum sector as controlled corrections. The control parameter is graph coordination: we study a spin star with \\(d\\) leaves and \\(O(1/d)\\) hub--leaf couplings. In its homogeneous form the star benchmarks the transition from LL-substitutable dynamics to genuinely quantum, discrete-sector interference; in its fully driven form, with time-dependent fields and bilinear couplings, it is the basic message-passing primitive for tree and loopy spin structures. For coherent-state return amplitudes we prove exact leaf elimination and derive a continuous-time \\(1/d\\) hierarchy. L0 is a driven one-spin weak-mean-field theory, while G1 is a Gaussian nonlocal-in-time influence correction coupling leaf two-time kernels to the hub weak two-point function. On bounded finite-time windows away from zeros of the boundary amplitudes, the hierarchy gives \\(\\log\\mathcal A-\\log\\mathcal A_{\\rm L0}=O(1/d)\\) and \\(\\log\\mathcal A-\\log\\mathcal A_{\\rm L0}-\\Delta_{\\rm G1}=O(1/d^2)\\); numerical tests on fully driven anisotropic ensembles give slopes \\(-1.05\\) and \\(-2.03\\). Static, inhomogeneous, aligned, and fully driven stars provide validation rungs, and comparison with a temporal matrix-product influence-matrix baseline delineates complementary regimes. Unlike rank compression on a Trotter grid, the hierarchy is ordered by a physical parameter, formulated in continuous time, and each truncation level is itself a physical theory, with the LL sector as the high-coordination limit.", "url": "https://arxiv.org/abs/2607.10899", "type": "理论+数值", "summary": "1. 该工作通过将量子比特自旋模型简化为经典自旋-朗道-利夫希茨扇区与受控量子修正，构建了实时自旋动力学量子优势的物理诊断框架，并以完全驱动自旋星作为可控制原语。\n2. 其技术核心是基于图协调数控制的连续时间1/d层级展开，实现了精确叶子消除，将动力学化为L0弱平均场与G1非局部核修正，数值验证斜率接近-1.05与-2.03。\n3. 该层级每个截断水平自身即为完备物理理论，为量子与经典动力学的边界界定提供了受控基准，其连续时间消息传递结构可拓展至树图与环状自旋网络。", "summary_source": "deepseek", "authors": [{"name": "Michael Chertkov"}], "featured_authors": [{"name": "Michael Chertkov"}], "author_count": 1}, {"id": "2607.10946", "category": "quant-ph", "title": "Randomized Quantum Optimal Control", "abstract": "Quantum optimal control (QOC) aims to find control functions that optimally steer a quantum system toward a target operation. We introduce a \\emph{randomized} QOC framework where optimization is carried over an ensemble of control functions and their probabilities, instead of a single set of functions. Using this framework, we prove that randomized QOC can reach a target accuracy faster than any deterministic protocol under the same resource constraints. We also develop general symmetry-based constructions that convert a given control into an ensemble of controls that can systematically reduce the error. We benchmark these constructions for CNOT implementation and find that the resulting randomized protocol quadratically suppresses the error of the optimized deterministic solution. In addition, we introduce randomized GRAPE, which generalizes GRAPE to directly optimize control ensembles and their associated probabilities. Finally, as a related application, we discuss randomized boundary-pulse constructions {that enhance} robustness against coherent noise.", "url": "https://arxiv.org/abs/2607.10946", "type": "理论+数值", "summary": "1. 该工作提出随机化量子最优控制框架，通过优化控制函数及其概率的系综而非单一函数集来实现量子操作。\n2. 理论上证明在相同资源约束下，随机化协议可比任何确定性协议更快达到目标精度，并通过对称性构造将误差二次压低。\n3. 这为在受控量子系统中系统性抑制误差提供了通用策略，并为随机化GRAPE算法及边界脉冲抗噪设计开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Leeseok Kim"}, {"name": "Francisco Riberi"}, {"name": "Kevin Baca"}, {"name": "Milad Marvian"}], "featured_authors": [{"name": "Leeseok Kim"}, {"name": "Francisco Riberi"}, {"name": "Kevin Baca"}, {"name": "Milad Marvian"}], "author_count": 4}, {"id": "2607.10950", "category": "quant-ph", "title": "$p$-Form Gauge Dynamics and Digital Quantum Simulation -- Flux and Cosmological Constant Neutralization", "abstract": "I develop a Hamiltonian framework for ${\\mathbb Z}_k$ $p$-form gauge fields on arbitrary oriented cell complexes in arbitrary dimensions. Gauge qudits are defined by $p$-cells, charged boundary qudits by $(p-1)$-cells, Gauss-law generators by boundary map $\\partial_p$, and magnetic checks by $\\partial_{p+1}$. The same cellular structure produces local dressed Wilson operators, and at $k=2$ a Calderbank-Shor-Steane check complex relevant to quantum error correction. I then specialize to $p=2, k=2$, where the magnetic 3-cell term is absent and the one-form Gauss-law can be solved exactly. The physical Hilbert space is parameterized by plaquette electric-flux variables, while the link configuration is reconstructed as the dynamical boundary of the evolving flux domains. The reduced Hamiltonian is an Ising-type plaquette model, where its local transverse-field term is the physical image of the boundary-dressed Wilson operator $\\sigma_p^z\\prod_{\\ell\\in\\partial p}\\tau_\\ell^z$. A tube-cap quench compares two initial flux fillings with the same initial boundary loops. Exact diagonalization on $4\\times4$, $6\\times4$, and $5\\times5$ tori finds that the cap loses $20$-$37\\%$ of its occupied-flux area, while the tube remains nearly pinned. A finite-size scaling locates a dynamical crossover of tension-to-density ratio near $(m/\\varepsilon_E)_c\\simeq1.89$. The unreduced plaquette-plus-link encoding provides local Gauss-law checks and a direct digital implementation, while the reduced plaquette-only Hamiltonian supplies the exact benchmark. The result places the specific top-form discharge and the cosmological constant neutralization calculation inside a general higher-form Hamiltonian and coding framework.", "url": "https://arxiv.org/abs/2607.10950", "type": "理论+数值", "summary": "1. 该工作为任意维定向胞复形上的Z_k p-形式规范场建立了哈密顿框架，并针对p=2,k=2系统实现了从规范理论到Ising型plaquette模型的精确约化与数值研究。\n2. 其核心卖点在于通过精确求解一形式高斯定律将物理希尔伯特空间用电通量变量参数化，从而将规范约束动力学映射为局域横场Ising模型，并利用tube-cap淬火标度出张力-密度比动力学交叉点(m/ε_E)_c≈1.89。\n3. 这为顶形式放电与宇宙学常数中和计算提供了统一的高形式规范描述，同时为数字量子模拟中规范约束的实现及量子纠错中CSS复形的构造给出了精确基准与可扩展框架。", "summary_source": "deepseek", "authors": [{"name": "Soo-Jong Rey"}], "featured_authors": [{"name": "Soo-Jong Rey"}], "author_count": 1}, {"id": "2607.10958", "category": "quant-ph", "title": "The quantum coherence as a phase property of the wave function", "abstract": "The quantum coherence as a phase property of the most fundamental quantum mechanical entity, the wave function, is explained for the first time. Phase-sensitive nonadiabatic dressed states, arising from the interaction of a quantum system and a coherent external electromagnetic field, are used in these considerations. Two types of phase correlations in the multilevel phase-sensitive nonadiabatic dressed states are found: a rapidly changing phase correlation between the real and the virtual components and a stationary phase correlation between different virtual components of these states.", "url": "https://arxiv.org/abs/2607.10958", "type": "理论", "summary": "1. 该工作首次将量子相干解释为波函数固有的相位性质，并借助相位敏感非绝热缀饰态加以阐述。\n2. 核心发现在于多能级相位敏感非绝热缀饰态中存在两类相位关联：实部与虚部间的快速变化关联，以及不同虚部分量间的静态关联。\n3. 这为从波函数相位视角理解量子相干提供了新框架，可望推广至强场物理与量子调控中的相干过程分析。", "summary_source": "deepseek", "authors": [{"name": "Ivan Georgiev Koprinkov"}], "featured_authors": [{"name": "Ivan Georgiev Koprinkov"}], "author_count": 1}, {"id": "2607.11201", "category": "quant-ph", "title": "Dynamics of two interacting dipolar two-level systems in a multi-mode electromagnetic cavity: sudden death and revival of the concurrence within the Born-Markov approximation", "abstract": "Interacting dipolar two-level systems form a special class of qubits that interact with a cavity in a particular way. We first prove that the Markovian dynamics of one 1/2-spin in interaction with a quantised magnetic field from a multi-mode cavity at thermal equilibrium is equivalent to a two-level atom interacting in the dipole approximation with the electric field of the cavity. We then use the Born-Markov approximation to study the dynamics of two spins interacting through the antiferromagnetic Heisenberg coupling in the same environment. We find the exact expression of the density matrix of the system, with the off-diagonal coherence decay time and spin relaxation time. The concurrence for the stationary state is explicitly derived for any kind of initial state and the role of the singlet state is brought to light. The temporal evolution of the concurrence is numerically computed for different initial states, the phenomenon of sudden death and revival is observed even within the Born-Markov approximation, and an analysis of its behaviour is conducted for Werner states. We finally derive the equations and the stationary concurrence for the XXZ coupling.", "url": "https://arxiv.org/abs/2607.11201", "type": "理论+数值", "summary": "1. 该工作利用Born-Markov近似研究了两个反铁磁海森堡耦合的自旋1/2系统在多模电磁腔中的马尔可夫动力学，导出了密度矩阵及稳态并发度的精确表达式。\n2. 其核心在于证明了单自旋与多模腔热浴的马尔可夫动力学等价于偶极近似下二能级原子与腔电场的相互作用，并发现在此框架内并发度仍可出现突然死亡与复活现象，且单态在稳态中起关键作用。\n3. 这为理解腔QED中纠缠动力学提供了可解析处理的模型，并为推广至XXZ耦合及实验中观测此类非马尔可夫特征提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Loann Quien"}, {"name": "Naomichi Hatano"}], "featured_authors": [{"name": "Loann Quien"}, {"name": "Naomichi Hatano"}], "author_count": 2}, {"id": "2607.11206", "category": "quant-ph", "title": "Unique temporal scaling dimension for quantum criticality in open systems weakly coupled to environment", "abstract": "Probing, understanding, predicting, and controlling the real-time dynamics of quantum phase transitions in open systems are of pivotal importance to modern condensed matter physics, statistical physics, and quantum computing, among others. Here it is argued that a distinct temporal renormalization-group eigenvalue is needed for quantum criticality in open systems weakly coupled to their finite-temperature environment. This new physics enables the formulation of a general scaling theory that can accurately account for the critical properties including the specific Kibble-Zurek scaling in such open quantum systems. Remarkably, the critical exponents of time-related quantities are altered nonperturbatively regardless of how weak the coupling is, except for an Ohmic bath. Perspectives for future study are also discussed.", "url": "https://arxiv.org/abs/2607.11206", "type": "理论", "summary": "1. 该文论证弱耦合有限温度环境的开放系统量子临界性需引入独立的时间重整化群本征值，并构建了涵盖Kibble-Zurek标度的一般标度理论。\n2. 核心发现是时间相关临界指数对耦合强度呈非微扰改变（除欧姆浴外），即便耦合极弱时亦成立。\n3. 这为开放系统量子相变实时动力学和量子计算中的普适标度行为提供了可检验的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Fan Zhong"}], "featured_authors": [{"name": "Fan Zhong"}], "author_count": 1}, {"id": "2607.11216", "category": "quant-ph", "title": "Distributed Semantics for Distributed Quantum Computing", "abstract": "We present a quantum process calculus that can split the system state along process boundaries and follow the evolution of each process in isolation, without losing information about the joint state-a property we call spatial compositionality. Compositionality is the key to reasoning about any complex system, yet quantum process calculi have struggled to provide its spatial kind, which would enable analyzing a system one process at a time. Many a qua
