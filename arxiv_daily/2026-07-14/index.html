ntum process calculi have been proposed, but they invariably rely on a global state representation based on state vectors or density matrices, with no known way to split them without losing information about entanglement. We propose to model quantum states with Deutsch-Hayden descriptors instead, which provide a modular representation of qubit states and their evolution. We adapt these descriptors to allow arbitrary splitting and merging of the store of qubits, leading to an unusual process calculus in which qubit transfer messages carry the actual state of the qubit, where existing calculi transfer only a reference. The calculus gives localized views of system state visible to each process, which can be assembled back together into the joint state. We define a notion of process equivalence with extensive justification grounded in physics and show a bisimulation whose soundness proof is simplified by spatial compositionality. The calculus can model open systems entangled with external processes, and we demonstrate this capability on a fragment of the BB84 key distribution protocol. This exercise shows that Deutsch-Hayden descriptors can successfully track qubit movements across process and system boundaries, though it needs help from density matrices to reason about information flow.", "url": "https://arxiv.org/abs/2607.11216", "type": "理论+数值", "summary": "1. 该工作提出一种基于Deutsch-Hayden描述符的量子过程演算，实现空间组合性，使系统状态沿进程边界分割后仍可保留纠缠信息并独立演化。\n2. 其核心卖点在于以描述符替代全局态向量或密度矩阵，使量子比特传输携带实际状态而非引用，从而支持任意分割合并与局域化视图。\n3. 这为分布式量子计算的形式化推理提供新框架，空间组合性简化了复杂系统等价性验证，但处理信息流仍需密度矩阵辅助。", "summary_source": "deepseek", "authors": [{"name": "Jun Inoue"}], "featured_authors": [{"name": "Jun Inoue"}], "author_count": 1}, {"id": "2607.11217", "category": "quant-ph", "title": "Quantum Multiscale Modeling: A Hierarchy of Algorithms for Complex Chemical Systems", "abstract": "Multiscale modeling of complex chemical systems requires algorithms that operate coherently across electronic, atomistic, mesoscopic, and continuum scales. While quantum algorithms have been proposed for each regime, no systematic framework exists to compose them across scale boundaries. Here, we identify the conditions under which fault-tolerant quantum algorithms might preserve scale-specific quantum advantages. We map quantum phase estimation, Hamiltonian simulation with Gibbs state preparation, quantum random walks, and quantum partial differential equation solvers onto electronic structure, molecular dynamics, mesoscopic kinetics, and continuum reactor physics, respectively. Crucially, these correspondences do not imply unconditional end-to-end quantum advantage; speedups depend heavily on state preparation, memory architectures, matrix conditioning, and classical readout costs. Six unresolved questions define this composition problem, illustrated via a quantum hierarchy for \\ce{CO} oxidation over \\ce{Pt(111)}. We propose viewing inter-scale transfer as a quantum channel composition problem at the interface of algorithm design and non-equilibrium statistical mechanics, and ask whether information loss at scale boundaries is intrinsic to multiscale modeling or merely a consequence of lossy classical transduction between algorithmic layers. The resulting roadmap suggests that multiscale quantum advantage is governed primarily by the structure of information transfer between algorithmic layers, rather than by performance at individual scales alone.", "url": "https://arxiv.org/abs/2607.11217", "type": "理论+数值", "summary": "1. 该论文针对复杂化学系统，将量子相位估计、哈密顿模拟与吉布斯态制备、量子随机行走及量子PDE求解器分别映射至电子结构、分子动力学、介观动力学和连续反应器物理，构建了多尺度量子算法层级，并识别了各尺度量子优势的保持条件及端到端优势的非无条件性。\n2. 其核心贡献在于将跨尺度信息传递建模为量子信道组合问题，通过CO在Pt(111)上氧化实例，论证了多尺度量子优势主要受算法层间信息传输结构支配，而非由单尺度性能决定，并揭示信息损失在尺度边界具有内在性。\n3. 该工作列出了六项未解决的开放问题，将多尺度量子优势的研究引导至跨层信息流的信息论基础，为设计具有尺度特异性和全局连贯性的量子模拟协议提供了清晰的路线图与实验启示。", "summary_source": "deepseek", "authors": [{"name": "Seenivasan Hariharan"}, {"name": "Kareljan Schoutens"}, {"name": "Sachin Kinge"}, {"name": "Lucas Visscher"}], "featured_authors": [{"name": "Seenivasan Hariharan"}, {"name": "Kareljan Schoutens"}, {"name": "Sachin Kinge"}, {"name": "Lucas Visscher"}], "author_count": 4}, {"id": "2607.11252", "category": "quant-ph", "title": "Deployment of Entanglement-Based QKD in Financial Infrastructure", "abstract": "We demonstrate the feasibility of entanglement-based quantum key distribution (eQKD) in high-security financial infrastructure over a 22 km fiber link with 8 dB loss between two data centers using polarization entanglement. The fully automated system continuously generated secure keys for four months at an average rate of 63.8 kb/s, which were stored into a key management system and consumed to establish a VPN tunnel. The setup achieved 93.7% total up-time, with no downtime caused by the quantum optical components. Active polarization control kept the quantum bit error rate below 2% for 97.4% of the time and timing synchronization based on the entangled photon pairs' intrinsic temporal correlations achieved sub-300 ps precision. Our standalone system requires neither polarized guide lasers nor external high-precision time references. These results show practical integration of eQKD into operational financial infrastructure.", "url": "https://arxiv.org/abs/2607.11252", "type": "理论", "summary": "1. 该工作在22公里光纤链路上演示了基于偏振纠缠的量子密钥分发系统在金融数据中心间的全自动连续运行，四个月平均密钥率63.8 kb/s，并用于建立VPN隧道。\n2. 其技术核心在于主动偏振控制将量子误码率稳定在2%以下（97.4%时间），同时利用纠缠光子对的内在时间关联实现亚300皮秒定时同步，无需导引激光或外部时钟。\n3. 结果表明纠缠基QKD可在实际金融基础设施中无间断集成，为高安全密钥分发在运营环境中的大规模部署提供了可行范本。", "summary_source": "deepseek", "authors": [{"name": "Mirela Selimović"}, {"name": "Roman Solar"}, {"name": "Jonathan Gruner"}, {"name": "Sebastian Mair"}, {"name": "Mario Wenzl"}, {"name": "Thomas Heine"}, {"name": "Matej Pivoluska"}, {"name": "Rupert Ursin"}, {"name": "Sebastian Philipp Neumann"}], "featured_authors": [{"name": "Mirela Selimović"}, {"name": "Roman Solar"}, {"name": "Jonathan Gruner"}, {"name": "Matej Pivoluska"}, {"name": "Rupert Ursin"}, {"name": "Sebastian Philipp Neumann"}], "author_count": 9}, {"id": "2607.11282", "category": "quant-ph", "title": "Barium-based Rydberg atom quantum technologies with long Rydberg coherence", "abstract": "The short Doppler-limited coherence time of the laser-excited Rydberg state, usually orders of magnitude shorter than the lifetime of the Rydberg state, hinders the Rydberg-mediated quantum technologies. Here, we show that a 649~nm~$-$~658~nm two-photon excitation of the $6sng~^1G_4$ Rydberg state from a long-lived d-orbital clock state of barium can be achieved with a two-photon wavevector that is tiny, which effectively removes the Doppler-limited decoherence. Moreover, the $6sng~^1G_4$ Rydberg state has strong dipole-dipole interaction due to small Förster defect with nearby Rydberg states and possesses long radiative lifetime. These can benefit quantum computing based on individually trapped neutral atoms, and can enable long-lived Rydberg polaritons in atomic media, which brings fresh opportunities in all-optical quantum information.", "url": "https://arxiv.org/abs/2607.11282", "type": "理论", "summary": "1. 该工作展示了从钡原子长寿命d轨道钟态到6sng \\(^1\\)G\\(_4\\)里德伯态的649 nm–658 nm双光子激发方案。\n2. 其核心在于通过极小双光子波矢有效消除多普勒极限退相干，且该里德伯态兼具强偶极相互作用与长辐射寿命。\n3. 这为囚禁中性原子量子计算及原子介质中长寿命里德伯极化激元的全光量子信息处理提供了技术途径。", "summary_source": "deepseek", "authors": [{"name": "Xiao-Feng Shi"}], "featured_authors": [{"name": "Xiao-Feng Shi"}], "author_count": 1}, {"id": "2607.11380", "category": "quant-ph", "title": "Toward Quantum Utility in Correlated Topological Matter: Variational Preparation of Fractional Quantum Hall Manifolds", "abstract": "We investigate the use of variational quantum algorithms to prepare and characterize fractional quantum Hall states on near-term quantum processors. Focusing on the $\\nu=1/3$ Laughlin phase described by the $V_1$ Haldane pseudopotential, we formulate the lowest-Landau-level problem in second quantization, and implement particle-number-preserving variational circuits combined with the variational quantum eigensolver (VQE) and variational quantum deflation (VQD). We benchmark the approach in two complementary geometries: Haldane sphere and torus shape. On the Haldane sphere, the target state is a unique zero-energy Laughlin ground state, providing a controlled test of the variational workflow and of excited-state reconstruction. On the torus, the problem retains the genuinely two-dimensional periodic character of the quantum Hall liquid and exhibits the threefold topological ground-state degeneracy expected for the $\\nu=1/3$ fractional filling factor. This feature makes the torus a more demanding benchmark than the quasi-one-dimensional cylinder or thin-torus limits commonly exploited in state-preparation quantum protocols. We benchmark the hardware-optimized variational states against exact diagonalization using energy estimates, error-mitigated observables, and subspace-containment diagnostics. Our results show that hybrid quantum algorithms can approximately reconstruct the low-energy structure of small fractional quantum Hall systems, including the topological ground-state manifold on the torus. Beyond serving as a benchmark for quantum hardware, this geometry-resolved approach provides a route toward quantum simulations of fractional Chern insulators and strongly correlated topological phases in realistic two-dimensional materials.", "url": "https://arxiv.org/abs/2607.11380", "type": "理论+数值", "summary": "1. 该工作以Haldane球面和环面为几何平台，采用粒子数守恒变分电路结合变分量子本征求解器（VQE）与变分量子退定域（VQD），制备并验证了ν=1/3 Laughlin分数量子霍尔态及其拓扑基态流形。\n2. 其核心进展在于超越准一维近似，在保留二维周期性的环面上成功重构三重拓扑简并低能结构，并通过能量估计、误差减轻可观测量和子空间包含诊断证实了混合量子算法对强关联体系的模拟能力。\n3. 这一几何分辨的变分准备策略为在近期量子处理器上实现分数量子反常霍尔绝缘体及真实二维强关联拓扑材料的量子效用提供了可扩展的基准测试路径。", "summary_source": "deepseek", "authors": [{"name": "Sergio F. Expósito"}, {"name": "Unai Aseginolaza"}, {"name": "Raúl Guerrero-Avilés"}, {"name": "Joaquim Jornet-Somoza"}, {"name": "Francisco Guinea"}, {"name": "Juan Borge"}], "featured_authors": [{"name": "Sergio F. Expósito"}, {"name": "Unai Aseginolaza"}, {"name": "Raúl Guerrero-Avilés"}, {"name": "Joaquim Jornet-Somoza"}, {"name": "Francisco Guinea"}, {"name": "Juan Borge"}], "author_count": 6}, {"id": "2607.11401", "category": "quant-ph", "title": "From Leaves to Clusters: Depth-Efficient SAT-Oracle Synthesis Based on the HRSE Model", "abstract": "Quantum oracles are a common building block of many quantum algorithms, where circuit depth is a primary cost that directly affects overall performance. Synthesizing oracles for SAT (CNF) formulas under a limited ancilla budget, however, tends to yield deep circuits, as existing methods underexploit clause-level parallelism. In this work, we present the Clustered Synthesis Tree (CST), a depth-oriented framework whose core idea is to group the individual clause leaves of a hierarchical synthesis tree into clusters, exposing instance-dependent clause-level parallelism under ancilla constraints. CST comprises three parts: the clause-grouping problem it induces, which we formulate as an ancilla-constrained scheduling problem and prove NP-complete in general, is addressed by SeedGrow, a polynomial-time $O(m^2 k)$ heuristic; ClausePack, a reversible oracle that evaluates a cluster's clauses in parallel at only a logarithmic-depth overhead; and CST-Map, which compiles the clustered tree into an executable SAT-oracle. On random $4$-CNF under the same ancilla budgets, CST reduces the oracle's circuit depth over the state-of-the-art (SOTA) baseline by $68\\%$--$94\\%$. On the standard SATLIB benchmarks, CST achieves about a $2.6\\times$--$43.2\\times$ reduction over the SOTA baseline, with the largest gains under dense variable sharing, and matches the baseline's maximum-budget depth using only $3.7\\%$--$20\\%$ of its ancilla qubits. A Grover-search resource estimate shows the advantage carries over to the full algorithm, reducing total circuit depth by $70\\%$--$89\\%$.", "url": "https://arxiv.org/abs/2607.11401", "type": "理论+数值", "summary": "1. 该工作提出基于HRSE模型的簇合成树（CST）框架，通过将层次化合成树中的子句叶子分组为簇，实现深度高效的SAT量子oracle合成。\n2. 技术亮点包括：将子句分组问题建模为辅助量子比特约束调度并证明NPC，开发多项式时间O(m²k)启发式SeedGrow和可逆并行簇评估模块ClausePack，在随机4-CNF和SATLIB基准上分别获得68%–94%和2.6–43.2倍的电路深度降低。\n3. 该工作表明，挖掘子句级并行性可在有限辅助量子比特下大幅压缩oracle深度；Grover搜索资源估计证实全算法深度降低70%–89%，且仅需现有方法3.7%–20%的辅助量子比特即可达到同等深度，为量子算法中的电路优化提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Zhihang Li"}, {"name": "Wei Zi"}, {"name": "Shuai Yang"}, {"name": "Bei Zhou"}, {"name": "Zongjiang Yi"}, {"name": "Woji He"}, {"name": "Yingjie Lin"}, {"name": "Kaixiang Ji"}, {"name": "Heru Du"}, {"name": "Jinchen Xu"}], "featured_authors": [{"name": "Zhihang Li"}, {"name": "Wei Zi"}, {"name": "Shuai Yang"}, {"name": "Kaixiang Ji"}, {"name": "Heru Du"}, {"name": "Jinchen Xu"}], "author_count": 10}, {"id": "2607.11410", "category": "quant-ph", "title": "Quantum algorithms for second-order boundary value problems", "abstract": "Second-order boundary value problems are central to computational science, yet standard matrix-based numerical formulations can obscure the local geometric structure that quantum circuits may exploit. Here we introduce a framework for explicitly constructing finite-dimensional counterparts of continuous differential operators in a form compatible with quantum computation. Starting from the exterior derivative, its adjoint, and the Hodge operator, we derive discrete realizations of second-order operators on primal--dual cell complexes and reformulate them as star-local update rules expressed through explicit functions that return the relevant bounding chains rather than through matrix representations. This yields simple, uniform, and scalable quantum circuits. We demonstrate the construction for div--grad and curl--curl operators, showing that the same star-local compilation principle extends across different operators, cell complexes, and manifold dimensions within a common framework. More generally, the framework provides a systematic route to quantum algorithms for partial differential equations.", "url": "https://arxiv.org/abs/2607.11410", "type": "理论+数值", "summary": "1. 本文提出一个框架，从外导数、余微分与Hodge算子出发，在原始-对偶复形上为二阶边值问题构造离散微分算子的量子电路实现。\n2. 其技术核心在于将二阶算子重构为星型局部更新规则，通过显式函数返回边界链而非矩阵表示，从而生成简单统一且可扩展的量子线路。\n3. 该框架为div-grad和curl-curl算子的量子求解提供统一编译原理，并系统推广至多种微分方程与流形维数，启发了偏微分方程的通用量子算法设计。", "summary_source": "deepseek", "authors": [{"name": "Lauri Kettunen"}, {"name": "Tejas Shinde"}], "featured_authors": [{"name": "Lauri Kettunen"}, {"name": "Tejas Shinde"}], "author_count": 2}, {"id": "2607.11454", "category": "quant-ph", "title": "Tunable non-Hermitian skin effect and topological phases in ladders with staggered nonreciprocal inter-leg hopping", "abstract": "We investigate the non-Hermitian skin effect (NHSE) and topological phases in a ladder model with staggered nonreciprocal inter-leg hopping, consisting of an Su-Schrieffer-Heeger (SSH) chain coupled to a normal tight-binding chain. By tuning the system parameters, we show that the direction of the NHSE under open boundary conditions can be reversed and can even become energy dependent. The NHSE is further characterized by the spectral winding number under periodic boundary conditions. We further demonstrate that the inter-leg coupling significantly enlarges the topologically nontrivial parameter regime. Remarkably, the zero-energy topological edge modes reside on different legs of the ladder and are characterized by real-space winding numbers $W=\\pm1$. Furthermore, increasing the nonreciprocity of the inter-leg hopping modifies the topological phase boundaries and eventually drives the system into a topologically trivial phase. Our results establish staggered nonreciprocal inter-leg hopping as an effective mechanism for engineering both the non-Hermitian skin effect and topological phases in ladder systems.", "url": "https://arxiv.org/abs/2607.11454", "type": "理论", "summary": "1. 该工作研究了由SSH链与正常紧束缚链耦合构成的梯子模型中交错非互惠跨腿跳跃导致的非厄米趋肤效应与拓扑相。\n2. 其核心卖点在于证明了跨腿跳跃的非互惠性可使趋肤效应方向反转并具有能量依赖，同时通过增大跨腿耦合显著扩展拓扑非平庸参数区域，且零能边缘模位于不同腿上并由实空间绕数刻画。\n3. 这为利用交错非互惠跳跃工程化非厄米趋肤效应和拓扑相提供了明确机制，并推动了相关梯子系统中的调控与实验研究。", "summary_source": "deepseek", "authors": [{"name": "Pu-Xuan Li"}, {"name": "Qi-Bo Zeng"}], "featured_authors": [{"name": "Pu-Xuan Li"}, {"name": "Qi-Bo Zeng"}], "author_count": 2}, {"id": "2607.11483", "category": "quant-ph", "title": "Strong Zero Modes in Supersymmetry-Inspired Quantum Circuits", "abstract": "We investigate discrete dynamics in quantum circuits with gates corresponding to the S-matrix of a supersymmetric 1+1D quantum field theory. We show that for a brick-wall configuration such circuits support both localized and delocalized dynamically conserved operators known as strong zero modes (SZM), the number of which depends on the parameter regime. We demonstrate that, while some of the SZM remain localized at boundaries, other SZM propagate ballistically, guided by a choice of circuit parameters. Such propagation can be explained by a strong Dzyaloshinskii Moriya term appearing in the dynamics. We describe how to exploit propagating SZM for quantum information transport and discuss the robustness to various types of noise.", "url": "https://arxiv.org/abs/2607.11483", "type": "理论", "summary": "1. 该工作研究了超对称1+1D量子场论S矩阵启发的砖墙型量子线路，发现系统中存在局域与弹道传播两种强零模守恒算子。\n2. 其物理卖点在于揭示弹道传播的强零模由动态产生的强Dzyaloshinskii-Moriya项驱动，且数目随参数区域变化。\n3. 这为利用可传播强零模实现量子信息传输提供了新途径，并展示了其对多种噪声的鲁棒性。", "summary_source": "deepseek", "authors": [{"name": "Alberto Zorzato"}, {"name": "Pietro Richelli"}, {"name": "Jiri Minář"}, {"name": "Kareljan Schoutens"}], "featured_authors": [{"name": "Alberto Zorzato"}, {"name": "Pietro Richelli"}, {"name": "Jiri Minář"}, {"name": "Kareljan Schoutens"}], "author_count": 4}, {"id": "2607.11596", "category": "quant-ph", "title": "Moment-Structured Block Encodings of Periodic Finite-Difference Operators", "abstract": "Block encoding is the standard technique for accessing matrix data in quantum linear-algebra algorithms. Its implementation directly affects its subnormalization, which in turn controls the algorithm's success probability, simulation time, and downstream costs. Explicit construction of block encodings with provably optimal subnormalization exists for only a handful of operators, with bespoke calculations used in its design. In this work, we develop a framework to block encode translation-invariant finite-difference operators on a periodic grid. These operators are the finite-difference discretizations of the constant-coefficient partial differential equations that sit at the core of scientific computing. We show that the moment order of these stencils can be used to simultaneously determine the continuum operator approximated, the vanishing order of the Fourier symbol, and the cost of the block encoding. From there, we derive a closed-form optimality criterion as a function of the stencil coefficients, which certifies whether the construction attains the optimal subnormalization for an entire operator family, uniformly in grid size, and quantifies the gap when it does not. The framework subsumes optimal constructions for the Laplacian operator in the literature and can be used to certify new instances at higher even orders, including the biharmonic operator. Furthermore, we derive success-probability floors parameterized by spectral properties of the operator's symbol and find explicit constants for the block encoding of the advection-diffusion family for which no prior explicit spatial block encoding exists.", "url": "https://arxiv.org/abs/2607.11596", "type": "理论+数值", "summary": "1. 该工作提出了一个基于模板矩阶的框架，用于周期网格上平移不变有限差分算子的块编码，可同时确定所近似的连续算子、傅里叶符号消失阶与编码成本。\n2. 其技术卖点在于推导出以模板系数封闭表达的最优性准则，能判定整个算子族是否实现网格尺寸均匀的最优次归一化，并量化非最优时的差距。\n3. 这一框架为构造更高偶数阶算子（如双调和算子）及平流扩散族的显式空间块编码提供了系统路径，并可推广至其他平移不变算子的优化设计。", "summary_source": "deepseek", "authors": [{"name": "Jishnu Mahmud"}, {"name": "Rebekah Herrman"}], "featured_authors": [{"name": "Jishnu Mahmud"}, {"name": "Rebekah Herrman"}], "author_count": 2}, {"id": "2607.11637", "category": "quant-ph", "title": "From Circuits to Hardware: Benchmarking Standard and Qubit-Efficient Quantum Optimization on Real Hardware", "abstract": "Despite rapid progress in quantum optimization, broad real-hardware benchmarks comparing multiple algorithmic families across diverse combinatorial problems under a common protocol remain limited. We benchmark gate-based quantum optimization on four NP-hard problems: multi-dimensional knapsack (MDKP), maximum independent set (MIS), quadratic assignment (QAP), and market-share (MSP). We study VQE, CVaR-VQE, standard, multi-angle, and warm-start QAOA, together with qubit-efficient PCE and QRAO, on IBM Heron r1/r2 processors using resilience-level-2 mitigation. To our knowledge, this includes the first real-hardware QRAO results and the first multi-problem PCE hardware benchmark. Across 247 method-instance combinations, we report transpiled circuit size, hardware outcomes, and an independent-error gate-count fidelity proxy, $F_{\\mathrm{est}}$. For MDKP and MIS, an empirical operating point near $F_{\\mathrm{est}}\\approx 0.1$, corresponding to about 770 two-qubit gates at the median Heron-r2 CZ error rate, marks the onset of noise-dominated execution. QAP exposes a separate bottleneck: dense one-hot encodings and an exponentially sparse feasible manifold, with feasible fraction $10!/2^{100}$ at $n=10$; no tested hardware method produces a feasible assignment. Compiled QAOA-family circuits are generally noise dominated, and a matched uniform-random control shows that most feasible low-fidelity outcomes fall within the random range, apart from one finite-sample MIS warm-start exception. A SWAP-aware, fractional-gate, Nighthawk-topology compilation counterfactual reduces two-qubit counts but leaves all circuits below $F_{\\mathrm{est}}=10^{-3}$. These conclusions apply to the tested implementations rather than QAOA in general. Qubit-efficient methods extend runnable instance sizes, but only within the empirical fidelity budget.", "url": "https://arxiv.org/abs/2607.11637", "type": "数值", "summary": "1. 该工作在IBM Heron量子处理器上，针对四种NP难题系统基准测试了VQE、QAOA变体及量子节俭方法PCE和QRAO，包含首次真实硬件的QRAO和多问题PCE结果。\n2. 其关键发现是识别了噪声主导执行的保真度阈值（F_est≈0.1，对应约770个两比特门），并揭示QAP问题因稠密独热编码与指数稀疏可行流形而致所有硬件测试均无法产生可行解。\n3. 这表明量子节俭方法可扩展运行实例尺寸，但受限于经验保真度预算，且除个别有限样本暖启动外，噪声主导的低保真结果与均匀随机对照组无显著差异。", "summary_source": "deepseek", "authors": [{"name": "Monit Sharma"}, {"name": "Hoong Chuin Lau"}], "featured_authors": [{"name": "Monit Sharma"}, {"name": "Hoong Chuin Lau"}], "author_count": 2}, {"id": "2607.11668", "category": "quant-ph", "title": "Multi-Stage Mamba-Based Architecture for Fast and Scalable Superconducting Qubit Readout", "abstract": "Reliable qubit readout is a critical bottleneck toward fault-tolerant quantum computing (FTQC). In superconducting quantum processors, readout operations are both error-prone and high-latency. These challenges become more severe in frequency-multiplexed architectures, where signal crosstalk among neighboring qubits significantly degrades readout fidelity. Existing machine learning (ML)-based approaches rely on feed-forward neural networks (FNNs) that suffer from large parameter sizes and lack an end-to-end network that jointly addresses relaxation errors and discriminates qubit states. In this work, we present a multi-stage qubit state discriminator based on the Mamba model, which enables efficient sequence modeling with linear complexity. The first stage performs initial state discrimination, followed by a refinement stage that identifies and mitigates relaxation-induced errors. Our lightweight model achieves a geometric mean readout fidelity of 0.906, outperforming the best-reported state-of-the-art method while reducing parameter size by 49.6%; our optimal model further reaches 0.911. Both models remain robust across varying input trace lengths, maintaining a high fidelity of 0.893 at readout durations as short as 500 $ns$, achieving up to a 26% reduction in logical error rate over prior work in quantum error correction (QEC).", "url": "https://arxiv.org/abs/2607.11668", "type": "理论+数值", "summary": "1. 该工作提出基于Mamba模型的多级架构，用于超导量子比特的快速可扩展读取。\n2. 其卖点在于利用线性复杂度序列建模实现两阶段判别与弛豫误差修正，参数减少49.6%。\n3. 这为频分复用系统中低延迟高保真读取及量子纠错性能提升提供了有效方案。", "summary_source": "deepseek", "authors": [{"name": "Luca Otting"}, {"name": "Xiaorang Guo"}, {"name": "Emmanouil Giortamis"}, {"name": "Benjamin Lienhard"}, {"name": "Pramod Bhatotia"}, {"name": "Martin Schulz"}], "featured_authors": [{"name": "Luca Otting"}, {"name": "Xiaorang Guo"}, {"name": "Emmanouil Giortamis"}, {"name": "Benjamin Lienhard"}, {"name": "Pramod Bhatotia"}, {"name": "Martin Schulz"}], "author_count": 6}, {"id": "2607.11793", "category": "quant-ph", "title": "Private Capacity of Quantum Channels Induced by Non-stabilizer Environmental States", "abstract": "We investigate the private capacity of quantum channels using the recently proposed quantum convolution theory for discrete-variable quantum systems. We focus on the role of the magic resource played in this framework. Firstly, for a large class of convolutional channels, we find that the private capacity is zero if the fixed environmental state is a stabilizer state. Moreover, we show that the private capacity can be nonzero for some magic environmental states. Furthermore, we show that the private capacity of a discrete beam splitter unitary is upper-bounded by the amount of magic of the environmental state. In addition, if the environmental state exhibits a certain symmetric structure, even if it is magic, the corresponding private capacity will also vanish for a class of convolution. These results emphasize the role of magic resources in quantum communication", "url": "https://arxiv.org/abs/2607.11793", "type": "理论", "summary": "1. 该工作利用离散变量量子卷积理论，研究了由非稳定子环境态诱导的量子信道私有容量。\n2. 关键发现是：当环境态为稳定子态时私有容量为零，而魔幻环境态可产生非零私有容量，且私有容量受环境态魔幻量的上界约束。\n3. 这表明魔幻资源在量子通信中起核心作用，为理解量子密钥分发的资源基础提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Chunhe Xiong"}, {"name": "Sunho Kim"}, {"name": "Long Long"}, {"name": "Junde Wu"}], "featured_authors": [{"name": "Chunhe Xiong"}, {"name": "Sunho Kim"}, {"name": "Long Long"}, {"name": "Junde Wu"}], "author_count": 4}, {"id": "2607.11823", "category": "quant-ph", "title": "Multiparameter Quantum Estimation in a Raman-Coupled Two-Qubit System", "abstract": "We investigate multiparameter quantum estimation in a Raman-coupled two-qubit system at thermal equilibrium. Analytical expressions for the quantum Fisher information matrix are derived to characterize the simultaneous estimation of the temperature and Raman coupling strength. The corresponding quantum Cramér--Rao bounds are obtained and compared with those of individual estimation strategies. Our results reveal optimal operating regimes determined by the interplay between thermal fluctuations and coherent interactions. In particular, quantum thermometry exhibits a well-defined optimal temperature window, whereas the estimation of the Raman coupling strength is significantly enhanced in the low-temperature and weak-coupling regime. We further show that simultaneous estimation can outperform independent estimation within appropriate parameter regions, highlighting the advantages of multiparameter quantum metrology. These results provide analytical insights into the ultimate precision limits of Raman-coupled two-qubit systems and identify promising operating regimes for quantum sensing and quantum thermometry.", "url": "https://arxiv.org/abs/2607.11823", "type": "理论", "summary": "1. 该工作针对热平衡下拉曼耦合两量子比特系统，推导了量子Fisher信息矩阵的解析表达式，理论分析了同时估计温度与拉曼耦合强度的量子Cramér—Rao界。\n2. 其核心在于揭示热涨落与相干相互作用竞争决定最优工作区间，在低温弱耦合区耦合强度估计显著增强，且同时估计可在合适参数区间优于独立估计。\n3. 这为热平衡两量子比特体系多参数量子计量的极限精度提供了解析框架，并明确了量子测温与量子传感的有利运行参数区间。", "summary_source": "deepseek", "authors": [{"name": "Omar Bachain"}, {"name": "Mohamed Amazioug"}, {"name": "Rachid Ahl Laamara"}], "featured_authors": [{"name": "Omar Bachain"}, {"name": "Mohamed Amazioug"}, {"name": "Rachid Ahl Laamara"}], "author_count": 3}, {"id": "2607.11847", "category": "quant-ph", "title": "Optimal tomography of bosonic and fermionic Gaussian states", "abstract": "The sample complexity is the minimum number of copies required to learn an accurate classical description of a quantum state. Bosonic and fermionic Gaussian quantum states are families of quantum states that play a key role in quantum science and technology, from quantum optics and many-body physics to quantum chemistry, quantum computing, and quantum information theory. Despite their importance, their sample complexity had not been fully determined. We settle this open problem and show that both bosonic and fermionic Gaussian states can be learned using a number of copies that scales quadratically in the number of modes, regardless of whether the state is pure or mixed, and independently of any energy bound on the state. We derive these results by using the representation theory of Gaussian unitaries and by putting forth a generalization of the random purification channel to this setting and beyond.", "url": "https://arxiv.org/abs/2607.11847", "type": "理论", "summary": "1. 该工作解决了玻色子和费米子高斯量子态层析的样本复杂度问题，证明学习任意纯态或混合态所需副本数仅随模数二次增长，且不依赖能量边界。\n2. 其技术核心在于利用高斯酉的表示论并引入随机纯化信道的推广，从而严格推导出与态纯度无关的最优标度。\n3. 这一结果为量子光学、多体物理及量子信息中高斯态的经典描述提供了明确的理论极限与高效协议启发。", "summary_source": "deepseek", "authors": [{"name": "Senrui Chen"}, {"name": "Marco Fanizza"}, {"name": "Filippo Girardi"}, {"name": "Ludovico Lami"}, {"name": "Francesco Anna Mele"}, {"name": "Michael Walter"}, {"name": "Freek Witteveen"}], "featured_authors": [{"name": "Senrui Chen"}, {"name": "Marco Fanizza"}, {"name": "Filippo Girardi"}, {"name": "Francesco Anna Mele"}, {"name": "Michael Walter"}, {"name": "Freek Witteveen"}], "author_count": 7}, {"id": "2607.11856", "category": "quant-ph", "title": "Trotter error compensation with polylogarithmic precision and nested-commutator scaling without ancillas", "abstract": "Product formulas are among the most practical approaches to Hamiltonian simulation, requiring no ancillary qubits and exhibiting error bounds governed by nested commutators rather than only by Hamiltonian norms. Their circuit size, however, scales polynomially with the inverse precision. We develop a high-order nested-commutator compensation (HNCC) algorithm that preserves the main advantages of product formulas while achieving polylogarithmic precision dependence in the circuit size and the standard $\\mathcal{O}(\\varepsilon^{-2})$ sampling cost. HNCC uses a truncated Baker--Campbell--Hausdorff expansion to represent high-order Trotter errors by products of nested commutators and compensates these errors at the superoperator level through randomly sampled Pauli-rotation channels, avoiding Hadamard tests and ancillary qubits. For a fixed $K$-th order product formula applied to a $k$-local Hamiltonian on $N$ qubits with $\\Gamma$ Pauli terms and local interaction strength $g_0$, HNCC estimates $\\operatorname{tr}[Oe^{-\\mathrm{i} tH}\\rho e^{\\mathrm{i} tH}]$ to additive precision $\\varepsilon\\|O\\|$ using $\\mathcal{O}(\\varepsilon^{-2})$ repetitions and a maximum gate count per circuit of $\\mathcal{O}(N^{\\frac{2}{2K+1}} (k g_0 t \\log(1/\\varepsilon))^{1+\\frac{1}{2K+1}} k(\\Gamma+\\log(1/\\varepsilon)))$. The resulting time dependence matches that of a product formula of order $2K+1$. Finite-size resource estimates for the periodic Heisenberg chain indicate that HNCC achieves the lowest CNOT and $T$-gate counts per circuit among the product-formula-based methods considered.", "url": "https://arxiv.org/abs/2607.11856", "type": "理论+数值", "summary": "1. 该工作提出了一种无需辅助比特的高阶级嵌套交换子补偿算法，使电路尺寸对精度的依赖由多项式降至多对数水平。\n2. 其技术核心是利用截断Baker–Campbell–Hausdorff展开将高阶Trotter误差表示为嵌套交换子乘积，并通过随机泡利旋转通道在超算子层面进行补偿，从而避免Hadamard测试和辅助量子比特。\n3. 对于周期海森堡链的有限尺寸资源估计表明，该算法在基于乘积公式的方法中实现了最低的每电路CNOT和T门计数，为大规模哈密顿量模拟提供了高效路径。", "summary_source": "deepseek", "authors": [{"name": "Xinzhao Wang"}, {"name": "Shuo Zhou"}, {"name": "Ziruo Wang"}, {"name": "Pei Zeng"}, {"name": "Jinzhao Sun"}, {"name": "Qi Zhao"}, {"name": "Tom Gur"}, {"name": "Tongyang Li"}], "featured_authors": [{"name": "Xinzhao Wang"}, {"name": "Shuo Zhou"}, {"name": "Ziruo Wang"}, {"name": "Qi Zhao"}, {"name": "Tom Gur"}, {"name": "Tongyang Li"}], "author_count": 8}, {"id": "2607.11857", "category": "quant-ph", "title": "Noise Resilience of Quantum Key Distribution Protocols Secured Against Independent Attacks With One-Way Communication", "abstract": "We investigate the resilience to noise of single-qubit quantum key distribution (QKD) protocols in the scenario of security against independent eavesdropping attacks and key distillation based on one-way classical communication. To this end, we introduce a noise-based metric that quantifies the efficiency of QKD protocols. Within this framework, we analyze the maximal noise levels that allow Alice and Bob to asymptotically establish a secure secret key. Using this assumption, we compare the noise tolerance of general single-qubit QKD protocols, in particular the BB84, B92, E91, and six-state protocols. Our main result determines the noise level threshold for QKD allowing one to distill an asymptotically secure secret key. Additionally, we demonstrate that the six-state protocol achieves the greatest resistance to noise while simultaneously yielding a higher post-selection efficiency than the other analyzed single-qubit protocols, confirming its robustness within the considered security model. Finally, we perform an analysis of the proposed noise-based metric and the conventional quantum bit error rate (QBER) metric.", "url": "https://arxiv.org/abs/2607.11857", "type": "理论", "summary": "1. 该工作是在独立窃听攻击与单向经典通信的框架下，对单量子比特量子密钥分发协议的噪声容限进行了系统性研究，比较了BB84、B92、E91及六态协议的性能指标。\n2. 其核心贡献是设计了一种基于噪声的度量来量化协议效率，并利用该度量推导出各协议能渐近建立安全密钥的最大噪声阈值，其中六态协议不仅具有最高的抗噪性，而且后选择效率也明显优于其他协议。\n3. 该度量与量子比特误码率分析具有互补性，为在实际噪声环境中评估QKD协议的安全性提供了新工具，并证实了六态协议在独立攻击与单向通信模型下的鲁棒性优势。", "summary_source": "deepseek", "authors": [{"name": "Adam Bílek"}, {"name": "Ryszard Kukulski"}, {"name": "Paulina Lewandowska"}, {"name": "Łukasz Pawela"}, {"name": "Zbigniew Puchała"}], "featured_authors": [{"name": "Adam Bílek"}, {"name": "Ryszard Kukulski"}, {"name": "Paulina Lewandowska"}, {"name": "Łukasz Pawela"}, {"name": "Zbigniew Puchała"}], "author_count": 5}, {"id": "2607.11867", "category": "quant-ph", "title": "Paraparticles intrinsically exhibit Hardy-space breakdown", "abstract": "The memory kernel of an open quantum system obeys Kramers--Kronig (KK) relations if and only if its Laplace transform is analytic in the upper half-plane -- a property known as Hardy-space analyticity. Here we show that non-unitary exchange statistics, the defining property of paraparticles, intrinsically breaks Hardy-space analyticity. The metric $\\eta$ that guarantees a real closed-system spectrum for these particles necessarily differs from the physical Born inner product ($\\|\\eta - I\\|_F / \\|I\\|_F = 0.51$) -- a mathematical consequence of the R-matrix's non-unitarity, not a parameter choice. This metric is a \"shadow metric\": Schur's lemma forces it to commute with every bilinear observable, making the distortion physically invisible in the closed system. But when the paraparticle is coupled to a bath, any coupling operator that lies outside the symmetry algebra -- that is, any interaction that sees the internal flavour structure -- exposes the distortion. The memory kernel then develops upper-half-plane poles at coupling $g_c \\approx 0.1$, breaking standard dispersion relations before the closed-system spectrum complexifies. Fermions and bosons, whose exchange is unitary ($\\eta = I$ as an analytic fact of the canonical anticommutation algebra), are immune at any coupling, because there is no distortion to expose. The violation is intrinsic: it distinguishes non-unitary exchange statistics from ordinary particle statistics at the level of the memory kernel's analytic structure.", "url": "https://arxiv.org/abs/2607.11867", "type": "理论", "summary": "1. 该工作证明了非幺正交换统计粒子（paraparticles）的记忆核在Laplace变换下必然丧失上半平面解析性，即Hardy空间崩溃。\n2. 其核心物理机制在于：为保证闭合系统实谱而引入的度规η与物理Born内积显著偏离（Frobenius范数相对差异0.51），且Schur引理迫使该度规成为“影子度规”而不可观，但任何触及内部味结构的耦合都会暴露这一畸变，从而在耦合强度g_c≈0.1处产生上半平面极点。\n3. 这一发现将非幺正统计与费米子/玻色子的根本区别提升至记忆核解析结构层面，为开放量子系统中非标准色散关系的失效提供了必然判据。", "summary_source": "deepseek", "authors": [{"name": "Kejun Liu"}], "featured_authors": [{"name": "Kejun Liu"}], "author_count": 1}, {"id": "2607.11882", "category": "quant-ph", "title": "An efficient algorithm for approximate shadow Hamiltonian simulation", "abstract": "We propose an efficient algorithm based on shadow Hamiltonian simulation to approximately simulate the real-time dynamics of observables under time-independent Hamiltonians. Shadow Hamiltonian simulation works at the level of the operator algebra generated by the observables through commutators with the Hamiltonian. Exactly encoding the quantum state in this picture is generally inefficient for interacting systems due to the exponential growth of the operator algebra. Our algorithm overcomes this bottleneck by systematically identifying the elements of the algebra most relevant to the target observables. This targeted approach is a controlled approximation that yields a highly efficient quantum state encoding that substantially reduces the size of the qubit register required to perform the time evolution using the shadow Hamiltonian. We propose two main pruning schemes, one based on a predefined operator basis and another on a constructed Krylov basis. We also present a hybrid scheme that builds a Krylov basis within a pruned algebra in the predefined basis. We benchmark our algorithm using lattice spin systems in one and two dimensions, for both one- and higher-point correlators as observables.", "url": "https://arxiv.org/abs/2607.11882", "type": "理论+数值", "summary": "1. 该工作提出一种基于影子哈密顿量的高效近似算法，用于模拟时间无关哈密顿量下可观测量的实时动力学。\n2. 其技术核心在于通过预定义基或Krylov基系统剪除算子代数中不相关元素，实现可控近似并大幅缩减量子比特寄存器规模。\n3. 这为在近期量子设备上高效模拟强关联格点系统动力学提供了明确且可扩展的途径。", "summary_source": "deepseek", "authors": [{"name": "Abhijit Chakraborty"}, {"name": "Bharath Sambasivam"}, {"name": "Karunya Shirali"}, {"name": "Hunter Nelson"}, {"name": "Mafalda Ramôa"}, {"name": "Sophia E. Economou"}, {"name": "Edwin Barnes"}], "featured_authors": [{"name": "Abhijit Chakraborty"}, {"name": "Bharath Sambasivam"}, {"name": "Karunya Shirali"}, {"name": "Mafalda Ramôa"}, {"name": "Sophia E. Economou"}, {"name": "Edwin Barnes"}], "author_count": 7}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
