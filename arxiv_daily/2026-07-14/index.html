  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);

      --muted: #6d5d50;

      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;

    * { box-sizing: border-box; }

      margin: 0;

      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }

    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }

    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }

    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }

    .paper h2 a:hover { color: var(--accent); }

    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }

    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2607.09761", "category": "cond-mat", "title": "SlaKoNet-VQD: A universal Slater-Koster tight-binding Hamiltonian for variational quantum band-structure calculations on near-term hardware", "abstract": "Variational quantum algorithms such as VQE and VQD are promising for near-term electronic structure calculations, but for periodic solids their reach is limited by the cost of building a faithful second-quantized Hamiltonian, typically via DFT plus Wannierization or hand-fit tight-binding parameters. SlaKoNet addresses this by combining deep learning with the Slater-Koster tight-binding formalism to fit hopping and overlap parameters across 65 elements, enabling deterministic Hamiltonian construction for any crystal built from these elements. Here we couple a SlaKoNet model trained on JARVIS-TBmBJ with a Qiskit-based VQD algorithm, replacing costly Hamiltonian construction with a universal neural Hamiltonian generator. The resulting SlaKoNet-VQD workflow is structure-agnostic, differentiable, and suited to high-throughput bandstructure screening. We benchmark on silicon, recovering the full eight-band structure along the standard k-path with mean absolute deviation of 1.78 meV from exact diagonalization on a 3-qubit simulator, and extend to five conventional superconductors (Al, Ta, Nb, V, ZrN) with similar accuracy. We demonstrate execution on IBM Quantum hardware for a k-point ground-state calculation on aluminum (MAE ~0.37 eV). We further promote the Hamiltonian to a correlated Hubbard model solved via dynamical mean-field theory, recovering weakening correlations across group-5 metals and strong quasiparticle renormalization in La2CuO4, identifying the impurity problem as a natural quantum solver target. This pipeline enables high-throughput VQA benchmarking across the periodic table and gradient-based ansatz-Hamiltonian co-optimization for materials discovery. Web app: this https URL .", "url": "https://arxiv.org/abs/2607.09761", "type": "理论+数值", "summary": "1. 该工作构建了SlaKoNet-VQD流程，将深度学习拟合的Slater-Koster紧束缚哈密顿生成器与VQD算法结合，实现近周期表任意晶体的确定性哈密顿构建与高通量能带计算。\n2. 其核心是经65种元素JARVIS-TBmBJ数据训练的神经网络，结构无关地输出跃迁与重叠参数，使硅八能带k路径计算平均绝对偏差1.78 meV，并在IBM量子硬件上演示铝的基态求解。\n3. 该流程可推广至Hubbard模型并借助DMFT识别杂质问题，为高通量变分量子算法基准测试与哈密顿-拟设协同优化提供周期表尺度的自动化平台。", "summary_source": "deepseek", "authors": [{"name": "Akshaya Ajith"}, {"name": "Jaehyung Lee"}, {"name": "Charles Rhys Campbell"}, {"name": "Kamal Choudhary"}], "featured_authors": [{"name": "Akshaya Ajith"}, {"name": "Jaehyung Lee"}, {"name": "Charles Rhys Campbell"}, {"name": "Kamal Choudhary"}], "author_count": 4}, {"id": "2607.09859", "category": "cond-mat", "title": "Landau-Zener tunneling and quantum interference of Andreev states", "abstract": "With the aid of a microscopic theory we derive an effective Hamiltonian that controls quantum dynamics of Andreev states in superconducting nanojunctions out of equilibrium. Resolving the corresponding Schrödinger-like equation we obtain the \"wave functions\" for Andreev levels and evaluate electric current across the junction in the presence of an external voltage bias. We demonstrate that quantum interference of Andreev states may yield pronounced coherent oscillations of the supercurrent as a function of the Josephson phase in junctions with barrier transmissions slightly below unity. Further implications of this novel effect are expected for junctions with diffusive barriers.", "url": "https://arxiv.org/abs/2607.09859", "type": "理论+数值", "summary": "1. 该工作从微观理论导出了控制非平衡超导纳米结中Andreev态量子动力学的有效哈密顿量。\n2. 通过求解薛定谔型方程获得Andreev能级波函数，揭示了势垒透射略低于1时超流随约瑟夫森相位的相干振荡。\n3. 这一Andreev态量子干涉新效应对扩散势垒结的输运行为提供了可验证的预测。", "summary_source": "deepseek", "authors": [{"name": "Mikhail S. Kalenkov"}, {"name": "Andrei D. Zaikin"}], "featured_authors": [{"name": "Mikhail S. Kalenkov"}, {"name": "Andrei D. Zaikin"}], "author_count": 2}, {"id": "2607.09881", "category": "cond-mat", "title": "Approximate explicit formulas for Stoner-Wohlfarth hysteresis loops", "abstract": "Approximate explicit formulas for the hysteresis loops in the Stoner-Wohlfarth model are derived. We consider the hysteresis loops both for a single particle with a fixed easy-axis direction and for an ensemble of particles with randomly oriented anisotropy axes. The physical assumption used to derive the formulas is that the particle magnetic moment lies in the vicinity of the easy axis or the external field direction, at low and high fields, respectively. Surprisingly, the low-field formula is approximately valid even near the Stoner-Wohlfarth astroid, where the reduced magnetic field h0 is not very small. The general piecewise formula is obtained by an appropriate matching of the functions defined on different intervals of the magnetic field, which are chosen to maximize the formula accuracy. For the averaged hysteresis loop, the maximal, but reasonably small, deviation of our formula from numerically calculated magnetization occurs at h0 = 0.5, which corresponds to the sharp change in magnetization slope.", "url": "https://arxiv.org/abs/2607.09881", "type": "理论+数值", "summary": "1. 该工作推导了Stoner-Wohlfarth模型中单颗粒与随机取向颗粒系综磁滞回线的近似显式解析公式。\n2. 基于低场下磁矩靠近易轴、高场下靠近外场方向的物理假设，通过分段匹配函数最大化精度，且低场公式在近小行星区域仍意外有效。\n3. 所得公式为快速解析计算磁滞回线提供了准确工具，并可用于理解系综平均中磁化斜率突变处的行为。", "summary_source": "deepseek", "authors": [{"name": "Savin Vladimir P."}, {"name": "Koksharov Yury A"}], "featured_authors": [{"name": "Savin Vladimir P."}, {"name": "Koksharov Yury A"}], "author_count": 2}, {"id": "2607.09910", "category": "cond-mat", "title": "Auditing Machine-Learning Models and Their Training Data with Explainability and First-Principles Verification: Application to Spin Hall Conductivity", "abstract": "Machine-learning models for materials properties rest on two assumptions that standard validation never tests: that a model's features reflect the physics of the property rather than accidents of the training distribution, and that the training labels are themselves correct. We introduce a model-agnostic audit protocol for both, combining SHAP attribution, counterfactual partial dependence analysis, and Rashomon-style cross-model verification, with every finding adjudicated by targeted density functional theory (DFT). Demonstrated on intrinsic spin Hall conductivity using a composition-only Random Forest, the model needs no relaxed crystal structure, reaching accuracy competitive with structure-aware graph networks while remaining applicable to the far larger space of compositions for which no structure has been computed. The model audit reveals that the average p-valence descriptor becomes statistically entangled with Pt content - a property of the learned representation rather than the physics; DFT confirms the consequence, a Pt-free compound (HgOsPb$_2$) whose true SHC is nearly four times the prediction. The data audit exposes a thirtyfold error in the HfC training label, inherited undetectably by every black-box model trained on the same data. The protocol audits a model and its training data for the cost of a few DFT calculations, wherever one element dominates the high-property regime.", "url": "https://arxiv.org/abs/2607.09910", "type": "理论+数值", "summary": "1. 该工作提出一种模型无关的审计协议，结合SHAP归因、反事实偏依赖分析和Rashomon风格交叉验证，以第一性原理DFT为裁定标准，检验自旋霍尔电导率机器学习模型及其训练数据的物理可靠性。\n2. 技术核心在于揭示平均p价电子描述符在随机森林中与Pt含量的统计纠缠是表示学习的假象而非物理本质，DFT证实其后果——无Pt化合物HgOsPb₂真实SHC接近预测值四倍，同时数据审计暴露HfC标签三十倍误差可被黑箱模型无察觉继承。\n3. 此协议仅需少量DFT计算即可在任一元素主导高属性区间时审计模型与训练数据，为材料预测中物理一致性和数据完整性验证提供了高效低成本方案，对机器学习在凝聚态物理中的可靠应用具有明确启示。", "summary_source": "deepseek", "authors": [{"name": "Mohammed Mahshook"}, {"name": "Rudra Banerjee"}], "featured_authors": [{"name": "Mohammed Mahshook"}, {"name": "Rudra Banerjee"}], "author_count": 2}, {"id": "2607.09928", "category": "cond-mat", "title": "Odd Polycatenanes Tank-Tread in Strong Shear Flow", "abstract": "Polycatenanes are mechanically interlocked polymers composed of ring molecules linked through mechanical bonds. Here, we investigate the single-molecule dynamics of linear polycatenanes under strong steady shear flow using coarse-grained Brownian dynamics simulations with hydrodynamic interactions. We identify a stable tank-treading state in which individual rings rotate continuously while the overall polymer remains highly extended and aligned with the flow direction, adopting conformations typically associated with extensional flow. Remarkably, tank-treading is observed almost exclusively in odd polycatenanes, polycatenanes with an odd number of rings. We attribute this odd-even effect to the orientation of the terminal rings within the flow-gradient plane, where they act as anchors that stabilize polymer extension, a configuration accessible only to odd polycatenanes. Furthermore, our simulations and a Markov state model demonstrate that this dynamic behavior remains stable over long timescales. Finally, we show that tank treading polycatenanes can be used to fully extend other molecules in strong shear flow, hinting at applications of this behavior to manipulate molecules in rotational flows.", "url": "https://arxiv.org/abs/2607.09928", "type": "理论+数值", "summary": "1. 该工作通过粗粒化布朗动力学模拟，研究了线性聚链烯在强剪切流中的单链动力学。\n2. 关键发现是仅奇数聚链烯稳定存在坦克履带运动，归因于端环在流-梯度平面内的锚定取向。\n3. 该动态行为可借以在强剪切流中完全伸展其他分子，为旋转流中的分子操控提供新途径。", "summary_source": "deepseek", "authors": [{"name": "Ali Seyedi"}, {"name": "Charles W. Manke"}, {"name": "Alex Albaugh"}], "featured_authors": [{"name": "Ali Seyedi"}, {"name": "Charles W. Manke"}, {"name": "Alex Albaugh"}], "author_count": 3}, {"id": "2607.09977", "category": "cond-mat", "title": "Thermodynamics of hydride formation: Anisotropic size-dependent coupled chemo-thermo-mechanical effects at Ni/NiH interfaces", "abstract": "Ni nanoparticles are frequently used as catalysts for hydrogenation reactions as well as in hydrogen storage applications. Recently, we have shown that small Ni nanoparticles can absorb hydrogen at < 10 bar pressure to form Ni hydride. During this process, the hydride growth is anisotropic, and a coherent Ni/NiH interface is formed. In order to explain the anisotropy and to comprehensively account for the coupling chemical, mechanical and thermal effects, we develop in this study a simplified chemo-thermo-mechanical enthalpy model for Ni/NiH interfaces in thin films. This model captures the combined influence of extent of hydride formation x, temperature T, pressure P, size effect ($l$), and the ${\\alpha}$/${\\beta}$ interface energy ${\\lambda}$. Two different ${\\alpha}$/${\\beta}$ interface orientations, namely (100) and (111), are investigated. The model is shown to correctly predict the enthalpy and volume changes over a wide range of length scales, from atomically thin layers (~1 nm) to micron scale and larger. This work provides the basis for the development of similar enthalpy models for other solid-state hydrogen storage nanostructured materials where anisotropic growth of hydride phases is also observed.", "url": "https://arxiv.org/abs/2607.09977", "type": "理论", "summary": "1. 该工作针对Ni纳米颗粒中氢化物各向异性生长问题，构建了Ni/NiH界面的简化化学-热-机械焓模型。\n2. 模型整合了氢化物形成程度、温度、压力、尺寸效应及α/β界面能与取向，准确预测从原子层到微米尺度的焓与体积变化。\n3. 这为其他存在各向异性氢化物生长的固态储氢纳米材料，开发类似焓模型提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Sourabh Singha"}, {"name": "Abhijit Chatterjee"}], "featured_authors": [{"name": "Sourabh Singha"}, {"name": "Abhijit Chatterjee"}], "author_count": 2}, {"id": "2607.10002", "category": "cond-mat", "title": "Anisotropic representations for E(3)-equivariant machine learning coarse-grained potentials", "abstract": "Coarse-graining (CG) lowers the computational cost of atomistic simulations by representing groups of atoms as effective interaction sites, reducing the degrees of freedom of the system but often compromising structural fidelity or requiring system-specific parameterization. Here, we introduce a novel anisotropic machine learning CG potential that extends the point particle representation of atomic nuclei to massive ellipsoidal beads with orientation-dependent features, enabling the learning of energies, forces, and torques directly from atomistic data. The anisotropic representation is physically motivated for polar and asymmetric molecules, where directional interactions and shape anisotropy play important roles in determining structure and dynamics. Using an equivariant message-passing neural network, the model accurately reproduces radial and angular distribution functions as well as relative orientation correlations in liquid water, demonstrating that both translational and rotational dynamics are well captured. Comparison with an isotropic baseline reveals that the lack of orientation information leads to systematic errors in short and long range order and degradation of angular correlations, proving orientation features are essential for accurate coarse-graining. The anisotropic model also exposes rotational structural observables fundamentally inaccessible to isotropic representations, with minimal computational overhead. Even for coarse-graining just three degrees of freedom, CG simulations achieve 7-27$\\times$ speedups while preserving structural fidelity, highlighting the efficiency gains of this systemic reduction. This framework establishes the feasibility and necessity of learned equivariant representations for anisotropic CG modeling and provides a path towards accurate and efficient mesoscopic simulations of complex molecular liquids, polymers, and biomolecular systems.", "url": "https://arxiv.org/abs/2607.10002", "type": "理论+数值", "summary": "1. 该工作提出一个各向异性机器学习粗粒化势，将原子核表示为具有方向特征的椭球珠模型。\n2. 利用E(3)等变图神经网络学习能量、力和扭矩，揭示方向信息对准确复现液态水结构序和角关联至关重要。\n3. 该各向异性表示为复杂分子液体、聚合物和生物分子体系的高效介观模拟提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Varun Shankar"}, {"name": "Emil Annevelink"}], "featured_authors": [{"name": "Varun Shankar"}, {"name": "Emil Annevelink"}], "author_count": 2}, {"id": "2607.10045", "category": "cond-mat", "title": "Flux Jamming and Bimodal Dynamics in Bounded Spin Networks", "abstract": "We present a quantitative framework for predicting how kinetic barriers governing temperature dependent relaxation arise in finite square magnetic networks. By formulating a series of non homogeneous transfer matrices from the adjacency spectrum of the underlying graph, we show how local coordination shapes the energy landscape and identifies geometric regions that act as bottlenecks for flux transport. Our approach predicts bimodal kinetic behavior, in which long intervals of trapping within charge compensated manifolds are interrupted by sudden, avalanche like relaxation episodes. Representing finite systems with a Husimi tree, we find that low temperature data from forty generations collapse onto a single curve consistent with a power law scaling form, implying that boundary truncation alone can give rise to scale invariant flux arrest, analogous to athermal granular jamming. By employing transition probabilities constructed from local Boltzmann factors, this framework connects equilibrium energy landscape concepts to non equilibrium phenomena, including kinetic arrest and telegraph noise, thereby enabling the prediction and design of intermittent transport in finite, frustrated networks.", "url": "https://arxiv.org/abs/2607.10045", "type": "理论", "summary": "1. 该工作提出了一个定量框架，通过非齐次转移矩阵与图邻接谱分析有限方磁网络中温度依赖弛豫的动力学势垒。\n2. 其核心在于揭示局域配位塑造能量景观并识别输运瓶颈，发现边界截断在Husimi树上产生标度不变通量阻塞，类比无热颗粒堵塞。\n3. 这为利用平衡能量景观概念预测和设计有限受挫网络中的间歇输运及电报噪声等非平衡现象提供了方法启示。", "summary_source": "deepseek", "authors": [{"name": "Paula Mellado"}, {"name": "Hanu Arava"}], "featured_authors": [{"name": "Paula Mellado"}, {"name": "Hanu Arava"}], "author_count": 2}, {"id": "2607.10076", "category": "cond-mat", "title": "Geometric Universality and Thermodynamic Microstructure of Real Fluids in a Unified Entropic Framework", "abstract": "We introduce a unified entropic framework for real fluids that encompasses the van der Waals, Berthelot, Redlich Kwong, and Peng Robinson equations of state within a common thermodynamic description. The corresponding microscopic interactions are then explored using Geometrothermodynamics, GTD, through the scalar curvature $mathcal{R}$ of the equilibrium manifold. We show that curvature singularities accurately reproduce macroscopic critical phenomena, while vanishing curvature $\\mathcal{R}=0$ identifies specific thermodynamic states where attractive and repulsive intermolecular forces effectively balance. Furthermore, we introduce a set of dimensionless critical-amplitude ratios $Q^i_{j}$, which reveal universal geometric features of the critical regime. Although individual critical amplitudes exhibit a logarithmic dependence on the system size, these invariant ratios organize different molecular species according to the strength of criticality and encode universal scaling features, suggesting their potential as robust classification parameters. Finally, employing Bayesian inference and Markov Chain Monte Carlo, MCMC methods, we statistically reconstruct the zero-curvature curves. The posterior distributions support the consistency of the geometric scaling behavior, demonstrating that the GTD manifold encodes non-trivial information about the underlying thermodynamical models.", "url": "https://arxiv.org/abs/2607.10076", "type": "理论+数值", "summary": "1. 该工作提出了一个统一熵框架，将范德瓦耳斯、Berthelot、Redlich-Kwong等真实流体状态方程纳入共同热力学描述，并借助几何热力学通过平衡流形的标量曲率研究其微观相互作用。\n2. 其卖点在于曲率奇点精确复现宏观临界现象，零曲率标识吸引与排斥分子力的平衡态，引入的无量纲临界振幅比揭示了临界区的普适几何特征，可用于按临界强度对分子种类分类。\n3. 这为利用几何不变量作为鲁棒的分类参数提供了启发，贝叶斯推断与MCMC统计重构支持曲率标度行为的一致性，表明几何热力学流形编码了潜在热力学模型的非平庸信息。", "summary_source": "deepseek", "authors": [{"name": "Carlos E. Romero-Figueroa"}, {"name": "Jose Miguel Ladino"}, {"name": "Sasha A. Zaldivar"}, {"name": "Hernando Quevedo"}], "featured_authors": [{"name": "Carlos E. Romero-Figueroa"}, {"name": "Jose Miguel Ladino"}, {"name": "Sasha A. Zaldivar"}, {"name": "Hernando Quevedo"}], "author_count": 4}, {"id": "2607.10091", "category": "cond-mat", "title": "Dynamical Nonrelativistic Spin Splitting via THz Nonlinear Phononics", "abstract": "Nonrelativistic spin splitting (NRSS) in collinear antiferromagnets offers a route to high-frequency spintronics immune to stray fields, but its dynamic control has remained elusive. We demonstrate, using density functional theory (DFT) and nonlinear phononics, that THz laser pulses can achieve ultrafast, reversible control of NRSS on picosecond timescales in antiferromagnets. We derive two symmetry criteria, accounting for phonon and magnetic wavevector compatibility and order-parameter parity, to identify which Raman-active phonon modes can activate or amplify NRSS. Applying these rules to NiO and LaFeO$_3$, we show that resonant driving of an infrared-active mode at 11.08 THz transiently converts spin-degenerate NiO into an NRSS state via biquadratic anharmonic coupling, generating a time-averaged spin splitting of $\\sim$40 meV. In LaFeO$_3$, selective excitation amplifies the existing NRSS by about 100%. In both cases, the induced spin splitting is accompanied by a transient SOC-induced net moment detectable via the magneto-optical Kerr effect. This framework establishes nonlinear phononics as a general route for ultrafast manipulation of spin-split antiferromagnetic phases well beyond the reach of static strain.", "url": "https://arxiv.org/abs/2607.10091", "type": "理论+数值", "summary": "1. 该工作通过第一性原理和非线性声子学，证明太赫兹激光脉冲可在共线反铁磁中实现非相对论自旋分裂的超快可逆调控。\n2. 其核心在于推导出声子与磁波矢兼容性及序参量宇称的对称性判据，识别出共振驱动红外活性模式经双二次非谐耦合可诱导或放大自旋分裂（NiO达约40 meV，LaFeO₃提升约100%），并伴随瞬态自旋-轨道耦合诱导净磁矩。\n3. 这建立了非线性声子学作为超越静态应变限度的通用框架，为高速反铁磁自旋电子学中的超快相位操控提供可行途径。", "summary_source": "deepseek", "authors": [{"name": "Linding Yuan"}, {"name": "ChanJu You"}, {"name": "Ankit Disa"}, {"name": "James M. Rondinelli"}], "featured_authors": [{"name": "Linding Yuan"}, {"name": "ChanJu You"}, {"name": "Ankit Disa"}, {"name": "James M. Rondinelli"}], "author_count": 4}, {"id": "2607.10122", "category": "cond-mat", "title": "Correlated Plasmonic Excitation in Twisted Nematic Plasmonic Superlattices", "abstract": "Superlattices with twisted configurations, such as moire lattices, have recently been extensively exploited for their unique electronic, magnetic, and optical properties. One remarkable feature of nanoscale twisted superlattices is the distinct lattice symmetries and the continuous phase transitions between periodic or aperiodic phases, representing a unique opportunity to study many emerging physical phenomena. Here, we report a correlated light and matter interaction between the collective polarization effect of nematic plasmonic superstructures and the plasmonic excitation of individual constituent nanorods in reconfigurable twisted plasmonic superlattices. Using hybrid Fe3O4 and Au nanorods as building blocks, we assembled plasmonic nematic liquid crystals with unidirectionally aligned nanorods, which could be further assembled into moire plasmonic lattices through a vertical stacking assembly method. A twist angle dependent plasmonic excitation is recognized in the twisted bilayer of two plasmonic superlattices, featuring enhanced transverse and longitudinal plasmonic excitation at a twisting angle of 0 degree and 90 degree, respectively. Such correlated plasmonic excitation in twisted plasmonic superstructures is induced by the correlation between the collective polarization effect of the liquid crystal phases and the anisotropic plasmonic excitation of individual nanorods. The magnetic orientation control allows for precise alignment of hybrid Fe3O4 and Au nanorods in polymer substrates and enables the coding of nematic domains and plasmonic patterns in each sublattice. The correlated plasmonic excitation and light polarization create reconfigurable photonic moire superlattices with well-defined domain colors, feature sizes, periodicities, symmetries, and dimensions determined by twist angles and displacements in the twisted plasmonic lattices.", "url": "https://arxiv.org/abs/2607.10122", "type": "理论", "summary": "1. 该工作利用Fe3O4和Au纳米棒组装向列等离子体液晶，通过垂直堆叠构建扭转双层超晶格，并观测到依赖扭转角的关联等离子体激发。\n2. 其核心卖点在于揭示液晶集体极化与单纳米棒各向异性等离子体激发的关联，在0°和90°扭转角下分别增强横向和纵向等离子体模式，且可通过磁场精确调控。\n3. 这为可重构光子莫尔超晶格提供了动态调控手段，通过扭转角和位移定义域颜色、特征尺寸、周期性和对称性，有望用于主动等离激元器件。", "summary_source": "deepseek", "authors": [{"name": "Rui Huang"}, {"name": "Jordan Austin-Frank Wilson"}, {"name": "Anders Dollard"}, {"name": "Nicholas C Fisher"}, {"name": "Zixian Fang"}, {"name": "John T. Fourkas"}, {"name": "Zhiwei Li"}], "featured_authors": [{"name": "Rui Huang"}, {"name": "Jordan Austin-Frank Wilson"}, {"name": "Anders Dollard"}, {"name": "Zixian Fang"}, {"name": "John T. Fourkas"}, {"name": "Zhiwei Li"}], "author_count": 7}, {"id": "2607.10181", "category": "cond-mat", "title": "Anyons and Inherently Complex F-symbols", "abstract": "Anyons in $2+1$ dimensions are not only characterized by exotic braiding statistics but also by intricate fusion properties. Two anyons may fuse into multiple topological charge sectors, and associativity of fusing three anyons to produce a fixed charge sector is governed by $F$-symbols. While braiding invariants, such as the modular data, are typically complex valued, a complete description of general anyon models requires understanding the arithmetic properties of its fusion associativity data as well. The $F$-symbols for many of the most common $2+1$d topological orders, including all Abelian anyon models as well as Fibonacci and Ising anyons, can be made real valued. We show this phenomenon is not universal by exhibiting braided fusion categories whose $F$-symbols cannot be made real. We call such $F$-symbols \\lq\\lq inherently complex.\" The examples we study lack a charge-conjugation symmetry and our results are therefore consistent with the converse of a statement proved in a companion work linking real $F$-symbols in braided fusion categories with the existence of a suitable charge-conjugation symmetry. We analyse the smallest-rank braided fusion categories we know of with inherently complex $F$-symbols: ${\\rm Rep}(\\mathbb{Z}_7\\rtimes\\mathbb{Z}_3)$ and ${\\rm Rep}(\\mathbb{Z}_5\\rtimes\\mathbb{Z}_4)$. Consequently, the corresponding $\\mathcal Z({\\rm Rep}(\\mathbb{Z}_7\\rtimes\\mathbb{Z}_3))$ and $\\mathcal Z({\\rm Rep}(\\mathbb{Z}_5\\rtimes\\mathbb{Z}_4))$ anyon models also have inherently complex $F$-symbols. Our presentation connects these examples with recent results on classifying anyons beyond modular data.", "url": "https://arxiv.org/abs/2607.10181", "type": "理论", "summary": "1. 该工作证明了存在F-符号无法被实化的辫子融合范畴，即固有复F-符号，并以Rep(Z₇⋊Z₃)与Rep(Z₅⋊Z₄)的任意子模型为例。\n2. 其核心发现揭示了F-符号的固有复性源于系统缺失电荷共轭对称性，从而在理论上反证了该对称性与实F-符号存在性的等价关系。\n3. 这为超越模数据分类任意子模型提供了新判据，未来可用于约束拓扑序的完整关联性数据及判别非阿贝尔相位。", "summary_source": "deepseek", "authors": [{"name": "Matthew Buican"}, {"name": "Peter Huston"}, {"name": "Jiannis K. Pachos"}], "featured_authors": [{"name": "Matthew Buican"}, {"name": "Peter Huston"}, {"name": "Jiannis K. Pachos"}], "author_count": 3}, {"id": "2607.10234", "category": "cond-mat", "title": "Topological delocalisation of confined 3D active nematics", "abstract": "Defect lines in 3D active nematic systems are intriguing topological singularities whose out-of-equilibrium dynamics remain elusive in confined settings. Here, we numerically study 3D active nematics confined within closed cylinders to elucidate the roles of geometry and activity. We reveal a competition between passive elasticity, which causes localisation of defects near edges, and activity, which endows defects with motility and gives rise to disorderly, delocalised dynamics. Varying boundary curvature, activity strength, and cylinder radius reveals a state space of static and dynamic localisation states, including handle-like configurations and chaotic motion bounded within the cylinder endcap. As activity is tuned to induce delocalisation, we identify phase transition signatures, including pronounced fluctuations and an emergent power law scaling of defect number and average defect length. We find that these scaling properties are strongly altered by confinement: unlike in bulk systems where activity governs length distributions, confinement tunes an activity-independent characteristic length, with an exponent reminiscent of self-avoiding confined polymers. These results establish confinement of inhomogeneous curvature as a versatile mechanism for controlling active topological dynamics.", "url": "https://arxiv.org/abs/2607.10234", "type": "理论+数值", "summary": "1. 该工作通过数值模拟研究了三维主动向列相在圆柱受限下的缺陷线动力学，揭示了被动弹性导致的边界局域化与活性引起的无序去局域化之间的竞争。\n2. 其技术卖点在于发现活性驱动的去局域化过渡具有相变特征，包括缺陷数目与平均长度的幂律标度，且受限引入了一个活性独立、类似自避免受限聚合物的特征长度。\n3. 这启示了非均匀曲率受限可作为调控主动拓扑动力学行为的通用机制，为设计活性材料中的缺陷运动提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Louise C. Head"}, {"name": "Pasquale Digregorio"}, {"name": "Davide Marenduzzo"}, {"name": "Ignacio Pagonabarraga"}, {"name": "Daniel A. Beller"}, {"name": "Giuseppe Negro"}], "featured_authors": [{"name": "Louise C. Head"}, {"name": "Pasquale Digregorio"}, {"name": "Davide Marenduzzo"}, {"name": "Ignacio Pagonabarraga"}, {"name": "Daniel A. Beller"}, {"name": "Giuseppe Negro"}], "author_count": 6}, {"id": "2607.10328", "category": "cond-mat", "title": "Lifshitz-Kosevich Theory of Anomalous Landau Levels in Topological Flat Bands", "abstract": "In conventional metals, quantum oscillations arise from Landau quantization of Fermi-surface cyclotron orbits, whose dynamics are governed by the Fermi velocity and cyclotron effective mass within Lifshitz-Kosevich (LK) theory. A perfectly flat band, by contrast, has vanishing group velocity, which would naively imply an infinite cyclotron mass and complete thermal suppression of quantum oscillations. Yet topological flat bands can support anomalous Landau levels (LLs) whose finite-field spacing is generated by quantum geometry rather than band curvature, allowing quantum oscillations to persist. This work addresses how such anomalous flat-band LLs behave within the LK framework and whether their thermal damping can reveal quantum geometric information. Using a minimal model with exactly flat topological bands, we derive an LK theory for these anomalous LLs and analyze fixed-density magnetization oscillations. The resulting oscillations exhibit a finite LK effective mass that is substantially larger than the normal-band value and possesses a strong magnetic-field dependence. In the weak-field limit, this anomalous mass reflects the quantum geometric origin of the LL spacing and scales inversely with both the magnetic field and the trace of the quantum metric. Thus, thermal damping of flat-band quantum oscillations directly measures the quantum metric, establishing quantum oscillations as a probe to flat-band quantum geometry.", "url": "https://arxiv.org/abs/2607.10328", "type": "理论", "summary": "1. 该工作为拓扑平带中由量子几何生成的反常朗道能级建立了Lifshitz-Kosevich理论，并解析计算了固定密度下的磁化振荡行为。\n2. 其核心在于发现反常朗道能级的LK有效质量远大于普通带且强依赖于磁场，在弱场极限下与磁场及量子度量迹成反比，直接体现量子几何起源。\n3. 这使量子振荡的热阻尼成为探测平带量子几何张量的可行探针，为关联拓扑平带体系及其他量子几何主导系统提供了新的研究思路。", "summary_source": "deepseek", "authors": [{"name": "Chao-Xing Liu"}], "featured_authors": [{"name": "Chao-Xing Liu"}], "author_count": 1}, {"id": "2607.10337", "category": "cond-mat", "title": "Interwoven long-range order induced by random fields", "abstract": "We propose a distinct type of long-range ordered phase that can occur in classical and quantum many-particle systems. It is induced by impurities and defects that locally break a subset of the order-parameter symmetries, i.e., by random-field disorder that couples to a composite vestigial order parameter. The proposed ``implectic'' phase is characterized by spontaneous symmetry breaking on the background of the spatially interwoven domain structure created by the random fields. We explicitly demonstrate the existence of this phase in a layered $J_1-J_2$ Ising magnet by means of large-scale Monte Carlo simulations. We then discuss numerous potential applications in systems featuring charge and spin density wave order including frustrated magnets, cuprate and iron-based superconductors, and ultracold atoms.", "url": "https://arxiv.org/abs/2607.10337", "type": "理论+数值", "summary": "1. 该工作提出了一类由随机场诱导的新型长程有序相——implectic相，存在于经典与量子多粒子系统中。\n2. 其核心物理机制在于随机场缺陷局域破缺复合遗迹序参量的对称性，在空间交织畴结构背景上实现自发对称破缺。\n3. 该相为阻挫磁体、铜氧化物及铁基超导体、超冷原子等系统中电荷与自旋密度波序的研究提供了新方向。", "summary_source": "deepseek", "authors": [{"name": "Jeremiah Bender"}, {"name": "Thomas Vojta"}], "featured_authors": [{"name": "Jeremiah Bender"}, {"name": "Thomas Vojta"}], "author_count": 2}, {"id": "2607.10355", "category": "cond-mat", "title": "Staggered orbital magnetization from itinerant electrons: orbital antiferro- and ferrimagnetic phases", "abstract": "Because electronic orbital angular momentum in solids is inherently non-local, its contribution to magnetism is usually cast in terms of a net orbital magnetization. Here, we show that itinerant electrons can generate orbital magnetic phases with ferromagnetic, antiferromagnetic, or ferrimagnetic orders. We demonstrate this possibility in a honeycomb lattice, using both the standard and a modified Haldane model. Employing real-space formulations, we decompose the itinerant orbital magnetization into sublattice contributions, $M_A$ and $M_B$. Their net ($M_z=M_A+M_B$) and staggered ($M_z^s=M_A-M_B$) combinations are then used to identify the orbital order. By varying the sublattice potential and the Fermi energy, we find distinct regimes: a (PT)-symmetric orbital antiferromagnet in the modified Haldane model, an orbital ferromagnet in the standard Haldane model, ferrimagnetic metallic states where net and staggered orbital magnetizations coexist, and insulating regimes in which the ferro- and antiferromagnetic orbital characters can be this http URL findings are explained by a low-energy theory in terms of two distinct valley mechanisms: valley-dependent Dirac masses in the standard Haldane model and valley-dependent energy shifts in its modified version.", "url": "https://arxiv.org/abs/2607.10355", "type": "理论", "summary": "1. 本文在蜂窝晶格Haldane模型中展示巡游电子可产生铁磁、反铁磁及亚铁磁轨道磁相，并通过实空间分解定义子格净与交错轨道磁化来表征这些相。\n2. 其核心在于利用两种不同谷机制（标准模型中的谷依赖狄拉克质量与修正模型中的谷依赖能量偏移）解释轨道序的涌现与调控。\n3. 该工作为理解非局域轨道角动量在磁性材料中的角色提供了新视角，并启发在更复杂晶格中探索轨道多铁性与拓扑轨道磁相。", "summary_source": "deepseek", "authors": [{"name": "Lucas L. Lage"}, {"name": "Kevin J. U. Vidarte"}, {"name": "Tarik P. Cysne"}, {"name": "Tatiana G. Rappoport"}, {"name": "A. Latgé"}, {"name": "R. B. Muniz"}], "featured_authors": [{"name": "Lucas L. Lage"}, {"name": "Kevin J. U. Vidarte"}, {"name": "Tarik P. Cysne"}, {"name": "Tatiana G. Rappoport"}, {"name": "A. Latgé"}, {"name": "R. B. Muniz"}], "author_count": 6}, {"id": "2607.10361", "category": "cond-mat", "title": "Anomalous Compressibility and Electronic Robustness of Metallic Delafossite PdCoO$_2$ under Pressure", "abstract": "The layered delafossite PdCoO$_2$ is an exceptional oxide metal whose ultrahigh conductivity arises from a Pd-derived nearly-free-electron band. Here, high-pressure single-crystal X-ray diffraction combined with first-principles calculations is used to investigate its structural, bonding, and electronic evolution up to 10 GPa. PdCoO$_2$ retains the rhombohedral R-3m structure throughout the investigated pressure range, with no structural phase transition. The lattice exhibits an unusual anisotropic compression, with the in-plane a-axis contracting more strongly than the stacking c-axis, opposite to the behavior of most layered materials. Despite this anomalous compressibility, only minor changes are observed in the local Pd-O and Co-O coordination environments, indicating a remarkably rigid bonding framework. Crystal orbital Hamilton population analysis reveals only subtle strengthening of the existing bonding interactions, without the emergence of destabilizing Pd-related antibonding states. Consistent with these findings, the Pd-derived metallic band and quasi-two-dimensional Fermi surface remain essentially unchanged under compression. Boltzmann transport calculations further show that the in-plane conductivity is nearly pressure-independent, whereas the out-of-plane conductivity decreases modestly, resulting in a slight increase in transport anisotropy. These results demonstrate that the anomalous compressibility of PdCoO$_2$ originates from its robust chemical bonding network, which preserves both the crystal structure and the highly conductive Pd-derived metallic state under pressure.", "url": "https://arxiv.org/abs/2607.10361", "type": "理论+数值", "summary": "1. 该工作通过高压单晶X射线衍射与第一性原理计算，系统研究了层状氧化物金属PdCoO₂在10 GPa内的结构、键合及电子演化。\n2. 其核心发现是反常压缩性（面内轴压缩强于面外轴）源于刚性键合网络，Pd衍生近自由电子带和准二维费米面在压力下几乎不变。\n3. 这揭示了化学键稳定框架如何抑制压力驱动结构相变并保持超导电性，为设计压力鲁棒性高导电氧化物提供了键合调控思路。", "summary_source": "deepseek", "authors": [{"name": "Cheng Peng"}, {"name": "Pahuni Jain"}, {"name": "Tyler Harper"}, {"name": "Chris Leighton"}, {"name": "Weiwei Xie"}], "featured_authors": [{"name": "Cheng Peng"}, {"name": "Pahuni Jain"}, {"name": "Tyler Harper"}, {"name": "Chris Leighton"}, {"name": "Weiwei Xie"}], "author_count": 5}, {"id": "2607.10381", "category": "cond-mat", "title": "Revisiting the non-equilibrium phase transitions of the continuous-trait Axelrod model", "abstract": "We investigate the non-equilibrium phase transitions of the continuous-trait Axelrod model, an agent-based framework where individual culture is represented by a vector of $F$ continuous features confined to the interval $(0,1)$. Local interactions are governed by a metric similarity threshold $d$, which acts as a continuous control parameter of social tolerance. The dynamics inevitably freeze into one of two absorbing configuration classes: an ordered, homogeneous monocultural state at high tolerance, or a highly fragmented, disordered state at low tolerance. While previous studies characterized the transition as hybrid based on the continuous behavior of the domain density $\\mu$ alongside a discontinuous jump in the largest domain fraction $\\rho$, we show that this apparent continuity is an artifact of severe finite-size masking effects. By shifting the methodological focus to the scaling of the median $\\tilde{\\mu}$ and analyzing the full probability distributions $P(\\mu)$, we unveil a clear bimodal structure with disjoint maxima across independent simulation runs. Our results reveal that for $F=2$, the system undergoes a genuinely hybrid transition in the contemporary sense, featuring a tiny but finite latent jump ($\\mu_c \\approx 0.089$) at the critical threshold $d_c \\approx 0.0784$ while scaling toward it from below via a non-analytical power law with a mean-field exponent $\\beta \\approx 1/2$. Conversely, for $F=3$, the higher trait-space dimensionality suppresses local fluctuations, yielding a traditional, non-hybrid first-order transition. We apply this framework to the alternative discrete Poisson variant of the model, successfully confirming its known continuous transition for $F=2$ and discontinuous, non-hybrid transition for $F=3$, thereby establishing a unified characterization of phase transitions in Axelrod-like systems.", "url": "https://arxiv.org/abs/2607.10381", "type": "理论+数值", "summary": "1. 该工作重新考察连续特征Axelrod模型的非平衡相变，通过中位数标度和满概率分布分析发现：F=2时在临界阈值d_c≈0.0784处存在有限潜跳μ_c≈0.089的混合相变，而F=3时因高维特征空间抑制局部涨落呈现传统一阶相变。\n2. 其核心贡献在于揭示先前被视为连续相变的表象实为有限尺寸掩蔽效应，并提取出域密度中位数从下方趋近临界点时的平均场幂律指数β≈1/2；同时该统一框架成功描述了Poisson变体模型已知的连续与不连续相变类型。\n3. 该工作为非平衡混合相变的精确识别提供了超越常规有限尺寸分析的可靠方法论，并强调特征空间维度在决定相变阶数中的关键作用，对Axelrod类系统具有普适指导意义。", "summary_source": "deepseek", "authors": [{"name": "Sandro M. Reia"}, {"name": "Paulo R. A. Campos"}, {"name": "José F. Fontanari"}], "featured_authors": [{"name": "Sandro M. Reia"}, {"name": "Paulo R. A. Campos"}, {"name": "José F. Fontanari"}], "author_count": 3}, {"id": "2607.10468", "category": "cond-mat", "title": "Nonperturbative magnetotransport from band geometry in Weyl semimetals", "abstract": "We develop a nonperturbative semiclassical theory of magnetotransport in Weyl semimetals, retaining the full magnetic-field dependence of the Fermi-surface conductivity in the presence of Berry curvature and orbital magnetic moment effects. We obtain closed-form expressions valid to all orders in the magnetic field within the semiclassical regime. We show that the exact continuum formulation exhibits an intrinsic infrared sensitivity associated with the singular behavior of the orbital magnetic moment, requiring a physically motivated regularization. While the full conductivity tensor reduces to the standard quadratic magnetoconductivity, we demonstrate that magnetic-field expansion and momentum integration do not commute, leading to nonanalytic contributions at the level of scalar transport coefficients. Our results identify a regime, relevant for low carrier densities or moderate magnetic fields, where magnetotransport becomes intrinsically nonperturbative and cannot be captured by conventional weak-field expansions.", "url": "https://arxiv.org/abs/2607.10468", "type": "理论", "summary": "1. 该工作发展了Weyl半金属中磁输运的非微扰半经典理论，保留了贝里曲率和轨道磁矩对费米面电导率的完整磁场依赖。\n2. 其核心在于导出闭合解析表达式并揭示轨道磁矩的奇异行为导致磁场展开与动量积分不可交换，从而产生非解析标量输运系数。\n3. 这识别了低载流子密度或中等磁场下磁输运内在非微扰的区域，为超越传统弱场展开的输运研究提供了明确理论框架。", "summary_source": "deepseek", "authors": [{"name": "L. Medel Onofre"}, {"name": "A. Martín-Ruiz"}], "featured_authors": [{"name": "L. Medel Onofre"}, {"name": "A. Martín-Ruiz"}], "author_count": 2}, {"id": "2607.10503", "category": "cond-mat", "title": "A Cascade of Volterra-Operator BBP Transitions in a Correlated Wigner Matrix", "abstract": "We study a Wigner-type random matrix in which the off-diagonal correlation between entries is generated by a random factor shared among all entries in a given row and column, with the coupling strength held fixed as the matrix size grows. Although the bulk spectral moments remain those of the pure semicircle law, we show that the underlying correlation matrix decomposes into a vanishing bulk together with a countable family of outlier eigenvalues that, at fixed rank $k$, converge to the singular values of a compact Volterra (cumulative-sum) integral operator -- obtained in closed form via the classical Karhunen--Loève expansion of Brownian motion and confirmed numerically to better than one percent across the top twenty such values. Each singular value drives an independent Baik--Ben Arous--Péché (BBP) transition as the coupling strength increases, producing an evenly spaced, discrete hierarchy of critical points -- rather than a single transition -- at each of which one further eigenvalue detaches from the semicircle edge, in close agreement with direct diagonalization. We show that this mechanism generalizes to a broader family of correlation structures, with the critical hierarchy in every case set by the spectrum of an associated compact integral operator.", "url": "https://arxiv.org/abs/2607.10503", "type": "理论+数值", "summary": "1. 该工作研究了一类相关Wigner矩阵，发现当行-列共享随机因子耦合强度固定时，离群特征值收敛于Volterra积分算子的奇异值。\n2. 其核心卖点是每个奇异值独立触发Baik-Ben Arous-Péché相变，产生等间距离散临界层次，与直接对角化数值吻合误差小于百分之一。\n3. 这揭示了相关矩阵的离群谱由紧积分算子谱决定的一般机制，为构造新型随机矩阵临界层次提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Masato Hisakado"}], "featured_authors": [{"name": "Masato Hisakado"}], "author_count": 1}, {"id": "2607.10509", "category": "cond-mat", "title": "Surface Variables Description of Axion Topological Materials", "abstract": "We study the response of axion topological materials under the presence of external static electric and magnetic fields. We focus on the macroscopic quasi-static magnetoelectric response of topological insulators. We use techniques based on surface variables that have been previously employed in soft condensed matter problems for the description of heterogeneous systems composed of multiple homogeneous materials. A complete description of the whole system is written in terms of surface degrees of freedom, which in this case correspond to effective surface charge and surface current densities. We obtain a set of integral equations satisfied by these variables. We present exact analytic solutions for axial-symmetric cases. We develop a numerical method for the solution of the integral equations by means of a boundary finite element method. We apply the numerical method to topological insulators with different geometries such as spheres, hollow spheres and toroidal surfaces. We show that that a variational principle can be used to recover the surface variables equations.", "url": "https://arxiv.org/abs/2607.10509", "type": "理论+数值", "summary": "1. 该工作采用表面变量方法描述轴子拓扑材料在外加静电磁场下的准静态磁电响应，将体响应简化为表面自由度。\n2. 其核心在于将异质系统归结为表面电荷与表面电流的积分方程组，对球体、空心球及环面等轴对称几何获得解析解，并发展边界有限元数值方法。\n3. 该框架为任意几何拓扑绝缘体的电磁响应计算提供统一方案，变分原理的恢复夯实了其在多材料异质系统中的应用理论基础。", "summary_source": "deepseek", "authors": [{"name": "Francisco J. Solis"}, {"name": "Hugo García-Compeán"}], "featured_authors": [{"name": "Francisco J. Solis"}, {"name": "Hugo García-Compeán"}], "author_count": 2}, {"id": "2607.10513", "category": "cond-mat", "title": "Spectral Signatures of Replica Symmetry Breaking in Optimization-Induced Random Matrices", "abstract": "We study optimization-induced matrix ensembles generated by Gibbs measures. The same quenched disorder that weights configurations also supplies the matrix entries observed on them. For glassy Gibbs measures this raises a natural question: does the induced spectrum inherit the underlying glassy Gibbs geometry? In a dense tensor optimization model we find a selective answer. A single induced matrix has a universal leading bulk that washes out the glassy organization. The difference of two matrices built from independent thermal samples in the same disorder does not: its spectrum gives an explicit image of the glassy Gibbs geometry, encoded by the distribution of mutual overlaps between samples. Parisi theory and Monte Carlo confirm this mechanism across simple and glassy phases.", "url": "https://arxiv.org/abs/2607.10513", "type": "理论+数值", "summary": "1. 该工作通过研究优化诱导随机矩阵系综，揭示了玻璃态吉布斯相中副本对称性破缺在谱上的选择性特征。\n2. 其核心发现是两个独立热样本的矩阵差谱直接编码了样本间互重叠分布，从而将玻璃态几何结构映射为谱形状。\n3. 这为利用谱分析检测无序系统中的副本对称性破缺提供了明确的理论与数值判据，并拓展至相关统计物理模型。", "summary_source": "deepseek", "authors": [{"name": "Isaac Pérez Castillo"}], "featured_authors": [{"name": "Isaac Pérez Castillo"}], "author_count": 1}, {"id": "2607.10570", "category": "cond-mat", "title": "Spectral-Domain Deep Learning of Intrinsic Scattering Operators for Arbitrarily Shaped Compact 3D Particles", "abstract": "Rapid prediction of optical scattering from arbitrarily shaped three-dimensional particles is important for particle optics and photonic characterization, but remains challenging because of the large variability of complex morphologies and the strong angular dependence of their scattering responses. To address both issues, a dual spectral-domain neural scattering model is introduced in which morphology and scattering are represented in physically ordered bases: particle geometry is compressed into only 256 spherical-harmonic coefficients, and the optical response is encoded by the complex T-matrix in a spherical-vector-wave basis. The morphology spectrum replaces high-dimensional Euclidean geometry representations, such as voxel grids, point clouds, or meshes, with a compact ordered descriptor, while the T-matrix represents a geometry-determined scattering operator that can be queried for different incidence directions, polarizations, and observation angles. A spectral-token Transformer trained on 50{,}000 irregular particles at 1064~nm maps the morphology spectrum directly to the T-matrix. The predicted operators recover modal structure and reproduce full-angle differential scattering maps and incidence-angle scans. Generalization to out-of-distribution synthetic shapes and natural sand-particle morphologies shows that the dual spectral architecture learns an intrinsic relation from the geometry spectrum to multipolar scattering. This establishes spectral-domain operator learning as a compact route for reusable, angle- and polarization-resolved optical scattering prediction of complex 3D particles.", "url": "https://arxiv.org/abs/2607.10570", "type": "理论+数值", "summary": "1. 该工作提出双光谱域神经散射模型，将任意形状三维粒子的几何压缩为256个球谐系数，在球矢量波基中用复T矩阵编码散射，并于5万个1064nm不规则粒子上训练光谱令牌Transformer。\n2. 其核心卖点在于从形态谱到多极散射算子的直接映射学习，可查询任意入射方向、偏振与观测角，精确恢复模态结构并重现全角度微分散射图与入射角扫描。\n3. 该光谱域算子学习为复杂3D粒子建立了紧凑、可复用的角度与偏振分辨散射预测框架，且泛化至分布外合成与天然沙粒形态，有望推动粒子光学表征与光子学逆向设计。", "summary_source": "deepseek", "authors": [{"name": "Daize Li"}, {"name": "Jiafu Shen"}, {"name": "Yifei Liu"}, {"name": "Bonan Zhang"}, {"name": "Heping Xie"}], "featured_authors": [{"name": "Daize Li"}, {"name": "Jiafu Shen"}, {"name": "Yifei Liu"}, {"name": "Bonan Zhang"}, {"name": "Heping Xie"}], "author_count": 5}, {"id": "2607.10584", "category": "cond-mat", "title": "Nonlinear Tellegen limit", "abstract": "The Tellegen limit is the fundamental electromagnetic stability bound on magnetoelectric media. We show that nonlinear magnetoelectric coupling gives rise to a new Tellegen limit, which we term the nonlinear Tellegen limit. Unlike the linear Tellegen limit, which is fixed by material parameters, the nonlinear Tellegen limit is field-tunable -- a static electric or magnetic field drives the system toward electromagnetic instability at a material-specific critical field determined by the magnetic point group symmetry. The approach to this limit is accompanied by a field-tunable Faraday rotation that grows linearly with the applied field and is bounded from above by a universal maximum set by the nonlinear Tellegen limit -- beyond which the medium becomes electromagnetically unstable. We demonstrate the nonlinear Tellegen limit and the field-space stability phase diagram in two magnetically ordered material systems -- a d-wave altermagnet and an M-type hexagonal ferrite -- showing that the symmetry of the magnetic point group governs both the structure of the nonlinear magnetoelectric tensor and the resulting electromagnetic instability.", "url": "https://arxiv.org/abs/2607.10584", "type": "理论+数值", "summary": "1. 该工作发现了非线性Tellegen极限，即磁电介质中由非线性磁电耦合决定的新的电磁稳定性边界。\n2. 其核心在于该极限场可调，通过静态电场或磁场驱动系统趋近电磁不稳定性，并伴随受其约束的线性法拉第旋转。\n3. 这揭示了磁点群对称性对非线性磁电张量结构与电磁不稳定性的调控作用，为相关材料体系提供了设计路径。", "summary_source": "deepseek", "authors": [{"name": "Abhinava Chatterjee"}, {"name": "Nikhil Kalyanapuram"}], "featured_authors": [{"name": "Abhinava Chatterjee"}, {"name": "Nikhil Kalyanapuram"}], "author_count": 2}, {"id": "2607.10770", "category": "cond-mat", "title": "Learning as a Geometric Phase Transition: Renormalization Group Flow and Anisotropic Symmetry Breaking in Deep Networks", "abstract": "We formulate feature learning as a geometric critical phenomenon of the lifted tensor-product learning metric. The central object is not a scalar overlap, but the target-active geometry of \\[ \\mathcal N_{0,L}=\\frac1N\\sum_{r=1}^{L}\\Sigma_{r\\to L}\\otimes T_{0\\to r-1}, \\] which entangles forward pullback survival with backward push-forward visibility. The neutral phase is target-isotropic: after restriction to endpoint target-active states and trace normalization, the lifted metric is proportional to the identity. Learning corresponds to an instability of this target-isotropic fixed point and to the emergence of traceless target-aligned eigentensors. We derive discrete Dyson expansions for local anisotropic insertions and their continuous Callan--Symanzik flow. Crucially, before constructing the full temporal mean-field theory, we identify the local spatial source of the $\\beta$-functions directly from microscopic kinematics: asynchronous gradient updates generate synchronous metric strains, whose target-active symmetric traceless components act as curvature-like defects. The Wilsonian depth RG flow is then governed by the transport, balance, and coarse-grained irrelevance of these defects. Heavy-tailed spectra arise, under a scale-free counting hypothesis, as the spectrum of the target-active lifted geometry, with exponent addition in the matched pullback--push-forward sector. Finally, we relate this depth RG picture to temporal stochastic training dynamics and to the kinematic imprint of the learned channel on empirical weight Gram matrices.", "url": "https://arxiv.org/abs/2607.10770", "type": "理论", "summary": "1. 该工作将深度网络特征学习建模为提升张量积学习度规下的几何相变，以目标各向同性固定点的失稳及无迹目标对准本征张量的涌现描述学习触发机制。\n2. 关键卖点在于从异步梯度更新直接导出β-函数的局域空间源——同步度规应变的无迹对称分量充当曲率类缺陷，并据此建立Wilsonian深度重正化群流与Callan-Symanzik方程。\n3. 这为解析训练动力学的重尾谱生成、学习通道在经验权重Gram矩阵上的运动印记，以及深度学习的场论理解提供了自洽框架。", "summary_source": "deepseek", "authors": [{"name": "G. Le Pera"}, {"name": "C. Nordio"}], "featured_authors": [{"name": "G. Le Pera"}, {"name": "C. Nordio"}], "author_count": 2}, {"id": "2607.10835", "category": "cond-mat", "title": "Evolution from an acoustic-plasmon-mediated superconductivity to an acoustic-phonon-mediated superconductivity in bilayers", "abstract": "Motivated by recent developments in van der Waals heterostructures, we revisit the acoustic plasmon mechanism of superconductivity in bilayer systems composed of a light layer (LL) and heavy layer (HL) by employing Eliashberg theory. The exchange of virtual plasmons in the HL can lead to a retarded in time attractive interaction between electrons of LL that we model through the screened interaction in the bilayer system within the random phase approximation. We explore the evolution from acoustic plasmon mediated superconductivity to phonon mediated superconductivity by studying the evolution of $T_c$ as the HL mass is increased by a few orders of magnitude compared with the electronic mass in LL. The lower HL mass corresponds to the bilayer acoustic plasmon, while the latter regime is closer to the Born-Oppenheimer regime of acoustic phonon mediated strongly retarded pairing. The heavy HL mass limit is known to obey Migdal's theorem by virtue of the small ratio of the two individual layer masses. We study the nonadiabatic effects for the arbitrary mass ratio with no small parameter systematically by using a frequency cut off in the Eliashberg theory, providing $T_c$ as a function of this cut off.", "url": "https://arxiv.org/abs/2607.10835", "type": "理论", "summary": "1. 该工作利用Eliashberg理论重新审视双层系统中轻层与重层之间的声学等离激元超导机制，并研究随重层质量增加从等离激元到声子超导的演化。\n2. 通过改变重层与轻层质量比跨越数个数量级，系统分析了非绝热效应，并引入频率截止参数刻画任意质量比下的超导转变温度。\n3. 这为理解范德华异质结中由声学等离激元向声子介导超导的连续过渡提供了明确的理论框架与调控线索。", "summary_source": "deepseek", "authors": [{"name": "Shuyang Wang"}, {"name": "Sankar Das Sarma"}, {"name": "Jay D. Sau"}], "featured_authors": [{"name": "Shuyang Wang"}, {"name": "Sankar Das Sarma"}, {"name": "Jay D. Sau"}], "author_count": 3}, {"id": "2607.10857", "category": "cond-mat", "title": "Catalog of Altermagnetism in Magnetic Wallpaper/Space Groups and Nonsymmorphic Altermagnets", "abstract": "Conventional altermagnetism, characterized by compensated collinear spin alignment and spin splitting, exhibits identical spin states at opposite momenta. In this work, we employ a non-spatial global symmetry $S$, the spinless time-reversal symmetry, which effectively replaces inversion symmetry in preserving the spin-state equivalence; hence, we systematically extend the classification of altermagnetism to all possible non-centrosymmetric crystals. By analyzing the necessary symmetry conditions, we provide a complete catalog of altermagnetic orders for all 2D magnetic wallpaper groups and all 3D magnetic space groups, identifying 17 altermagnetic wallpaper groups (12 centrosymmetric and 5 non-centrosymmetric) and 422 altermagnetic space groups (160 centrosymmetric and 262 non-centrosymmetric). This catalog assigns each altermagnetic wallpaper and space group to one of the six altermagnetic wave types established in the literature and presents its distinct spin distribution in the Brillouin zone (BZ); notably, the low-energy wave-type description does not necessarily extend throughout the full BZ, since the spin-degenerate nodal lines and planes can be unpinned from the high-symmetry planes. Beyond the catalog, nonsymmorphic symmetries further bring new patterns of the altermagnetic BZs through the emergence of hourglass dispersions, which arise from the compatibility relations between two symmetry-protected degenerate manifolds: same-spin and opposite-spin degeneracies. In both the non-centrosymmetric altermagnetism and the emergence of the hourglass dispersion, the spinless time-reversal symmetry plays the key role. Our work extends the symmetry catalog of altermagnetism and reveals that nonsymmorphic symmetries are essential for realizing altermagnetic band structures beyond the six established wave types, such as an $i$-wave-like spin winding in a tetragonal BZ.", "url": "https://arxiv.org/abs/2607.10857", "type": "理论", "summary": "1. 该工作引入非空间全局对称性S（自旋-less时间反演对称性），将交变磁性分类系统扩展至所有非中心对称晶体，并编制了二维磁性壁纸群和三维磁性空间群的完整目录。\n2. 其核心发现是非对称性对称性可通过相容关系产生hourglass色散主导的新BZ模式，且自旋简并节点线/面可脱离高对称面，使低能波型描述不完全适用于全BZ。\n3. 该目录系统关联各空间群与六种交变磁波型及自旋分布，为在非中心对称材料中设计超越传统波型的复杂交变磁能带结构提供了对称性指引。", "summary_source": "deepseek", "authors": [{"name": "Congcong Le"}, {"name": "Fan Cui"}, {"name": "Iao-Fai Io"}, {"name": "Moritz Hirschmann"}, {"name": "Xianxin Wu"}, {"name": "Ching-Kai Chiu"}], "featured_authors": [{"name": "Congcong Le"}, {"name": "Fan Cui"}, {"name": "Iao-Fai Io"}, {"name": "Moritz Hirschmann"}, {"name": "Xianxin Wu"}, {"name": "Ching-Kai Chiu"}], "author_count": 6}, {"id": "2607.10865", "category": "cond-mat", "title": "Dimensional and Spin Interpolation for the O$(n)$ Model: From Exact Anchors to RG-Improved Critical Exponents", "abstract": "We develop a two-axis interpolation framework for the O$(n)$ universality family, treating the spatial dimension $D$ and the spin-component number $n$ as independent continuous parameters connecting exact limiting solutions. On the spatial axis, anchoring between the Onsager solution at $D=2$ and mean-field theory at $D\\to\\infty$ yields a closed-form prediction for the 3D Ising critical coupling that agrees well with Monte Carlo benchmarks $K_c = 0.2204$ (benchmark: $0.22165$) with no adjustable parameters. Wilson--Fisher-constrained polynomial interpolation gives $\\nu=2/3$, $\\beta=31/96$, and $\\eta=35/864$ at $D=3$ (benchmarks: $0.6299$, $0.3265$, $0.0362$), and reproduces conformal-bootstrap results across $3 \\le D < 4$. On the spin axis, we establish a necessary compatibility criterion: two-anchor interpolation succeeds only for observables that vary monotonically between the anchor values. The critical coupling $K_c(n)$ violates this criterion because the Heisenberg value falls below the spherical limit, whereas the correlation-length exponent $\\nu(n)$ satisfies it. A perturbative $1/n^2$ expansion yields $\\nu(3) = 0.7493$ (benchmark: $0.7112$), and propagation through exact scaling relations gives $\\beta(3) = 0.3797$ (benchmark: $0.3689$) and $\\gamma(3) = 1.489$ (benchmark: $1.396$), without introducing additional parameters. The framework naturally extends to non-integer spin, producing the prediction $\\nu(2.5) = 0.7143$ for the O$(2.5)$ universality class. These results establish dimensional and spin interpolation as a unified and predictive approach to critical phenomena, while clarifying the structural conditions under which interpolation succeeds.", "url": "https://arxiv.org/abs/2607.10865", "type": "理论+数值", "summary": "1. 该工作发展了一个以空间维数D和自旋分量数n为连续参数的双轴插值框架，锚定于Onsager解、平均场极限及球面极限等精确解。\n2. 其技术核心在于：无需可调参数，仅凭D=2与D→∞锚点即预测三维Ising临界耦合K_c=0.2204；结合Wilson-Fisher约束多项式插值得出D=3指数ν=2/3等，并建立双锚插值成功的可观测量单调性判据，区分K_c(n)失败与ν(n)成功。\n3. 该框架为临界指数提供了统一、可扩展的预测方案，可自然推广至非整数自旋（如O(2.5)类ν=0.7143），并明确了插值方法的结构条件，为普适类理论研究提供了新范式。", "summary_source": "deepseek", "authors": [{"name": "Kumar Ghosh"}], "featured_authors": [{"name": "Kumar Ghosh"}], "author_count": 1}, {"id": "2607.10877", "category": "cond-mat", "title": "Pinwheel-shaped bound triplet pairs in the magnetization plateaus of SrCu$_2$(BO$_3$)$_2$", "abstract": "The sequence of magnetization plateaus at 1/8, 2/15, 1/6, 1/4, 1/3, 2/5, and 1/2 of the saturation observed in SrCu$_2$(BO$_3$)$_2$ remained a puzzle until tensor-networks-based numerical simulations suggested that the low-magnetization plateaus are stabilized as Wigner crystals of spin-2 bound states, and not as one of the standard configurations (semiclassical up-down, or crystals of triplets). We report on $^{63,65}$Cu nuclear magnetic resonance spectra up to 41.9 T: Based on constraints deduced from the 1/3 plateau, we show that the spectra in the 1/8 and 2/15 plateaus indeed agree with the prediction for the spin-2 bound states, while being incompatible with a crystal of triplets. This adds the formation of Wigner crystals of bound states as an alternative fundamental paradigm in the theory of magnetization plateaus.", "url": "https://arxiv.org/abs/2607.10877", "type": "理论+数值", "summary": "1. 该工作通过高场核磁共振实验，验证了SrCu₂(BO₃)₂中低磁化平台来自自旋-2束缚态形成的Wigner晶体，而非标准的三重态晶体模型。\n2. 其关键证据在于：基于1/3磁化平台的约束条件，1/8和2/15平台的⁶³,⁶⁵Cu NMR谱与自旋-2束缚态预言定量一致，而与三重态晶体模型完全不相容。\n3. 这确立了束缚态Wigner晶体作为磁化平台理论中超越经典构型与三重态晶体的全新基本范式。", "summary_source": "deepseek", "authors": [{"name": "Igor Vinograd"}, {"name": "Philippe Corboz"}, {"name": "Steffen Krämer"}, {"name": "Yanan Li"}, {"name": "Frédéric Mila"}, {"name": "Hiroshi Kageyama"}, {"name": "Masashi Takigawa"}, {"name": "Mladen Horvatić"}], "featured_authors": [{"name": "Igor Vinograd"}, {"name": "Philippe Corboz"}, {"name": "Steffen Krämer"}, {"name": "Hiroshi Kageyama"}, {"name": "Masashi Takigawa"}, {"name": "Mladen Horvatić"}], "author_count": 8}, {"id": "2607.10937", "category": "cond-mat", "title": "A minimal model for the Weyl nodes and Fermi arcs of PtBi$_2$", "abstract": "Weyl semimetals host topologically protected Fermi arcs on their surfaces, originating from the Chern number of the bulk Weyl nodes. In trigonal PtBi$_2$, superconducting signatures have been associated with the Fermi arcs. Theoretical descriptions of this surface superconductivity have so far relied on effective models that are not directly tied to the microscopic electronic structure of the material. In this work we develop a minimal description of the low-energy bands guided by density functional theory calculations and fully constrained by the relevant crystalline and time-reversal symmetries. The model captures the evolution of the Weyl nodes with spin-orbit coupling, including node annihilations, and is able to describe the spin-momentum locking of the surface Fermi arcs. It reproduces the orbital content and the band topology of PtBi$_2$ and provides a starting point for further studies.", "url": "https://arxiv.org/abs/2607.10937", "type": "理论+数值", "summary": "1. 该工作基于密度泛函理论计算结果并严格受晶体与时间反演对称性约束，为三角晶系PtBi₂构建了描述低能Weyl节点与表面费米弧的最小低能模型。\n2. 其物理卖点在于模型自然捕捉了Weyl节点随自旋轨道耦合强度的演化与湮灭过程，并精确复现了表面费米弧的自旋-动量锁定特征及轨道成分。\n3. 这一受微观电子结构约束的最小模型为后续研究表面费米弧上的超导配对机制及相关拓扑量子现象提供了可靠的理论出发点和拓展框架。", "summary_source": "deepseek", "authors": [{"name": "Tobias Cristófoli"}, {"name": "Manuel Alonso Lemos"}, {"name": "Jorge I. Facio"}, {"name": "Pablo S. Cornaglia"}], "featured_authors": [{"name": "Tobias Cristófoli"}, {"name": "Manuel Alonso Lemos"}, {"name": "Jorge I. Facio"}, {"name": "Pablo S. Cornaglia"}], "author_count": 4}, {"id": "2607.11009", "category": "cond-mat", "title": "Layer-Resolved Topological Metals in the Bilayer Lieb Lattice", "abstract": "We identify a two-dimensional time-reversal-invariant topological metallic phase on a bilayer Lieb lattice, characterized by a quantized layer--resolved pseudo-spin Chern number. Without the orbital-angular-momentum-dependent (OAM-dependent) coupling, the system gives rise to a time-reversal-invariant topological semimetal with a zero indirect gap and quantized pseudo-spin Chern number. Opposite-sign intralayer OAM-dependent coupling immediately converts the zero-indirect-gap semimetal into a metal, in which the global spectrum is metallic while the layer--resolved pseudo-spin Chern number remains well defined as long as the direct gap at each crystal momentum and the pseudo-spin gap remain open. The model also exhibits asymmetric boundary states: in the semimetallic regime, one edge hosts perfectly flat bands, whereas the opposite edge supports gapless counter-propagating modes forming a one-dimensional Dirac cone. An edge-localized interlayer coupling gaps only the counter-propagating edge states, leaving the flat-band edge essentially intact, while intralayer OAM-dependent coupling bends the exact flat band into a dispersive boundary mode without affecting the gapped Dirac edge. These results open a route toward the controlled engineering of layer--resolved topological gapless phases in synthetic and quantum materials.", "url": "https://arxiv.org/abs/2607.11009", "type": "理论+数值", "summary": "1. 该工作在双层 Lieb 晶格中识别出一种时间反演不变的二维拓扑金属相，其特征为量子化的层分辨赝自旋陈数。\n2. 其核心在于当层内轨道角动量依赖耦合将零间接带隙拓扑半金属转变为金属时，只要直接带隙与赝自旋带隙保持开放，该层分辨拓扑数依然良定义。\n3. 这一非对称边界态特性为在合成与量子材料中可控工程化层分辨拓扑无隙相提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Mengjie Yang"}, {"name": "S Rahul"}, {"name": "Giandomenico Palumbo"}], "featured_authors": [{"name": "Mengjie Yang"}, {"name": "S Rahul"}, {"name": "Giandomenico Palumbo"}], "author_count": 3}, {"id": "2607.11055", "category": "cond-mat", "title": "Generalized Keldysh formalism for nonequilibrium correlation functions and its application to fluctuation dynamics", "abstract": "Recent advances in time-resolved spectroscopies provide increasing access to collective dynamics in correlated quantum materials. However, computing the corresponding nonequilibrium two-particle correlation functions remains a major challenge. Here, by introducing a contour-dependent virtual probe field within the generalized Keldysh formalism, we propose an approach that computes such correlation functions with the vertex corrections essential for describing collective dynamics. In particular, we introduce a linear integral equation that computes the correlation functions without explicitly constructing the four-time vertex kernel, and develop its matrix-free Krylov solver based on quantics tensor trains. Combining our method with nonequilibrium dynamical mean-field theory, we show that the fluctuation dynamics of the order parameter in a nonequilibrium symmetry-broken state depends significantly on whether vertex corrections are included, and that the fluctuation and its decay time grow near the nonthermal critical point. Our approach thus provides a practical route for evaluating nonequilibrium correlation functions, which are emerging as key observables for characterizing states far from equilibrium.", "url": "https://arxiv.org/abs/2607.11055", "type": "理论+数值", "summary": "1. 该工作提出在广义Keldysh形式中引入轮廓依赖的虚拟探针场，计算包含顶点修正的非平衡两粒子关联函数。\n2. 其技术核心在于通过线性积分方程避免显式构造四时间顶点核，并发展基于量子张量列的无矩阵Krylov求解器。\n3. 这为研究非平衡对称破缺态中的序参量涨落动力学及靠近非热临界点的行为提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Ken Inayoshi"}, {"name": "Hiroshi Shinaoka"}, {"name": "Yuta Murakami"}], "featured_authors": [{"name": "Ken Inayoshi"}, {"name": "Hiroshi Shinaoka"}, {"name": "Yuta Murakami"}], "author_count": 3}, {"id": "2607.11058", "category": "cond-mat", "title": "Neural-network-based reconstruction of spin and orbital angular momentum from X-ray magnetic circular dichroism spectra", "abstract": "X-ray magnetic circular dichroism (XMCD) is a powerful probe of element-specific spin and orbital angular momentum. Conventional analyses based on sum rules, however, rely on integrated spectral intensities and can become insufficient when multiple parameters influence the spectral line shape. Here, we formulate XMCD analysis as an inverse problem and develop a neural-network (NN) based approach to reconstruct spin and orbital angular momentum directly from full spectral line shapes. Using many-body multiplet calculations of Fe, Co, and Ni $L_{2,3}$-edge X-ray absorption spectra (XAS) and XMCD spectra as a physically well-defined training dataset, we systematically vary key parameters including crystal-field splitting, spin--orbit coupling, and exchange field. The NN is trained to map spectral line shapes onto the expectation values of spin and orbital angular momentm $\\langle S_z \\rangle$ and $\\langle L_z \\rangle$, and validated using strictly test-only data. The results demonstrate accurate and unbiased reconstruction, establishing a proof of concept for data-driven inverse reconstruction from XAS and XMCD spectra. These findings show that exploiting the full XAS and XMCD line shapes provide access to information beyond conventional sum-rule analyses while remaining consistent with established theoretical frameworks.", "url": "https://arxiv.org/abs/2607.11058", "type": "理论+数值", "summary": "1. 该工作将X射线磁圆二色光谱分析重新表述为逆问题，并开发神经网络方法直接从完整的L2,3边谱线形状定量重建自旋与轨道角动量期望值。\n2. 其核心在于利用多体多重态计算生成包含Fe、Co、Ni且系统变化晶场劈裂、自旋轨道耦合和交换场的数据库，训练网络实现谱形至角动量的高保真无偏映射。\n3. 这证明了利用全谱形信息可突破传统求和规则分析的信息限制，为磁性材料元素特异性磁矩的数据驱动反演提供了与理论自洽的新范式。", "summary_source": "deepseek", "authors": [{"name": "Tetsuro Ueno"}], "featured_authors": [{"name": "Tetsuro Ueno"}], "author_count": 1}, {"id": "2607.11066", "category": "cond-mat", "title": "Finite-time Scaling of the surface special transition in a 3D classical Heisenberg model", "abstract": "We investigate nonequilibrium driven dynamics across the special surface phase transition in the three-dimensional classical Heisenberg model with open boundaries, where tuning the surface coupling gives access to an extraordinary-log boundary critical state characterized by logarithmic, rather than power-law, decay of correlations. Using Monte Carlo simulations, we realize four driving protocols: temperature heating and cooling across the special transition, and surface-coupling ramps from the ordinary and extraordinary-log critical states into the special point. For temperature-driven protocols, the surface order parameter obeys a generalization of the finite-time scaling (FTS) and the Kibble-Zurek mechanism. The central finding emerges when the system is driven from the extraordinary-log critical state: the large-rate scaling relation acquires a logarithmic correction and takes the novel form $M^{2}_{s}\\propto R^{(1+\\eta_{s})/r_{s}}[\\log(LR^{1/\\eta_{s}})]^{-q}$ , where $R$ is the driving rate, $L$ the system size, $\\eta_{s}$ the surface anomalous dimension, $r_{s}$ the scaling dimension of $R$, and $q$ the exponent governing the logarithmic boundary criticality. We demonstrate that this form follows from the general FTS framework by incorporating the logarithmic initial-state memory, and we achieve excellent data collapse over a wide range of system sizes and driving rates. Our results establish that extraordinary-log initial states alter nonequilibrium critical scaling, extending boundary FTS beyond conventional power-law initial conditions.", "url": "https://arxiv.org/abs/2607.11066", "type": "理论+数值", "summary": "1. 该工作通过蒙特卡洛模拟研究三维经典海森堡模型表面特殊相变的有限时间标度，涉及温度与表面耦合的多种驱动协议。\n2. 核心发现是当从extraordinary-log边界临界态驱动时，大速率标度关系出现对数修正，形式为$M^{2}_{s}\\propto R^{(1+\\eta_{s})/r_{s}}[\\log(LR^{1/\\eta_{s}})]^{-q}$，并通过纳入初始态对数记忆实现广义标度。\n3. 这确立了超越传统幂律初始条件的边界有限时间标度框架，为理解非平衡临界动力学中的对数边界临界性提供了普适理论工具。", "summary_source": "deepseek", "authors": [{"name": "Dongxu Liu"}, {"name": "Zhe Wang"}, {"name": "Shuai Yin"}, {"name": "Zheng Yan"}], "featured_authors": [{"name": "Dongxu Liu"}, {"name": "Zhe Wang"}, {"name": "Shuai Yin"}, {"name": "Zheng Yan"}], "author_count": 4}, {"id": "2607.11077", "category": "cond-mat", "title": "Effect of annealing temperature on the structure and properties of co-sputtered Fe-Mn-Sn films near 2:1:1 ratio", "abstract": "Research in recent years has focused on the thin-film synthesis of high-quality ternary alloys, identified for their tunable properties and potential in spintronics (e.g., Heusler alloys, Kagome magnets). In a previous study, we identified the conditions for stabilizing Fe$_2$MnSn, a Kagome magnet with a high Curie temperature and magnetic anisotropy. However, ternary phases such as Fe$_2$MnSn are challenging to synthesize and stabilize within a narrow temperature window, as binary and elemental phases can also form during the growth process. To highlight these observations, we investigated the thin film phases in the Fe-Mn-Sn system near the 2:1:1 ratio as a function of annealing temperature, ranging from 400 to 700\\degree C. The elemental Fe, Mn, and Sn targets were pre-calibrated to a close to 2:1:1 ratio and co-sputtered at room temperature, followed by annealing. Two binary hexagonal structures, Fe$_3$Sn$_2$ and Fe$_5$Sn$_3$, along with the elemental Fe phase, are stabilized between 400-550\\degree C, but disappear at 580\\degree C, where Fe$_2$MnSn is the only stable phase. Elemental Mn phase starts to appear starting from 600\\degree C, and becomes dominant by 750\\degree C. Electrical, magnetic and magneto-optical properties are observed to correlate with the structural findings and the best properties are observed in the temperature range where Fe$_2$MnSn is the dominant phase. In general, our study highlights the difficulty in growing phase-pure ternary alloys such as Fe$_2$MnSn, which is very strongly based on precise temperature conditions. We also observed significant disordered growth below 100 nm for Fe$_2$MnSn, implying poor thickness scaling behavior.", "url": "https://arxiv.org/abs/2607.11077", "type": "理论", "summary": "1. 该工作系统研究了退火温度（400–700°C）对共溅射Fe-Mn-Sn薄膜在近2:1:1比例下的相结构、电学、磁学和磁光性质的影响。\n2. 其核心发现是Fe₂MnSn仅在580°C狭窄窗口内稳定，低于此温区出现Fe₃Sn₂、Fe₅Sn₃等二元相，高于则析出Mn元素相，且物性最优对应于Fe₂MnSn主导的温区。\n3. 这揭示了合成纯相三元合金（如Fe₂MnSn）对温度控制的极端敏感性，并指出<100 nm厚度的无序生长限制了其厚度缩放行为，为Kagome磁体薄膜器件设计提供了关键约束。", "summary_source": "deepseek", "authors": [{"name": "Lance Griswold"}, {"name": "Dipanjan Mazumdar"}], "featured_authors": [{"name": "Lance Griswold"}, {"name": "Dipanjan Mazumdar"}], "author_count": 2}, {"id": "2607.11105", "category": "cond-mat", "title": "Tiling decomposition multiplicity predicts stability of GaN(0001) surface reconstructions", "abstract": "The stable adatom configurations of a semiconductor surface have traditionally been sought by sampling: density functional theory (DFT) energies steer a heuristic or Bayesian search through a configuration space far too large to cover. Here we show that, for the GaN(0001)-$(6\\times6)$ surface under the electron counting (EC) rule, the search can instead be posed as a discrete tiling problem and solved exhaustively. Enumerating all rhombus tilings of the surface lattice, together with all EC-compatible adatom arrangements built on them, yields the complete catalog of 416,683 configurations at fixed stoichiometry (3 Ga adatoms and 18 H atoms), organized by symmetry into 14 Ga placement classes. The number of tilings compatible with a given configuration, its tiling decomposition multiplicity $n_\\mathrm{til}$, predicts stability. Within each class, the configuration maximizing $n_\\mathrm{til}$ is the most stable. The rule holds strictly in 13 of the 14 classes; in the remaining class the minimum is itself among the highest-multiplicity configurations, with the $n_\\mathrm{til}$-max configuration only 8.5 meV above it; this ordering is reproduced by independent DFT calculations, and the difference is negligible at growth temperature. Stability screening uses a machine-learning interatomic potential validated against 710 DFT-computed structures. The rule reduces the candidate set for first-principles evaluation from 416,683 to 24 configurations, all of which have been evaluated with DFT. Analysis of the rule identifies the local mechanism, the avoidance of adjacent bare surface sites, while the existence of a compatible tiling remains a separate requirement with an energy cost of its own. Enumeration thus provides what sampling cannot: a coverage guarantee, and a route to stable-structure prediction in which first-principles input enters only at the final ranking step.", "url": "https://arxiv.org/abs/2607.11105", "type": "理论+数值", "summary": "1. 该工作将GaN(0001)-(6×6)表面稳定重构的寻找转化为离散铺砌问题，完全枚举了电子计数规则下所有416683种吸附原子构型。\n2. 核心发现是铺砌分解多重度n_til可预测构型稳定性，该规则将第一性原理评估候选集从数十万压缩至24个。\n3. 枚举方法提供了覆盖保证，并揭示了避免相邻裸露表面位点的局部稳定性机制，为类似表面重构预测提供了可推广途径。", "summary_source": "deepseek", "authors": [{"name": "Tetsuji Kuboyama"}, {"name": "Akira Kusaba"}, {"name": "Karol Kawka"}, {"name": "Pawel Kempisty"}], "featured_authors": [{"name": "Tetsuji Kuboyama"}, {"name": "Akira Kusaba"}, {"name": "Karol Kawka"}, {"name": "Pawel Kempisty"}], "author_count": 4}, {"id": "2607.11115", "category": "cond-mat", "title": "Strain-Tuned Nodal Superconductivity in the Charge-Ordered Kagome Metal CsV$_3$Sb$_5$", "abstract": "The nature of the superconducting pairing symmetry in the kagome metal CsV$_3$Sb$_5$ and its relationship with the charge density wave (CDW) order are central unresolved issues. Here, we investigate the evolution of superconductivity in CsV$_3$Sb$_5$ under in-situ uniaxial pressure using $^{121}$Sb nuclear quadrupole resonance (NQR). We find that tensile strain significantly enhances the superconducting transition temperature, $T_{\\rm c}$, while the CDW remains unchanged, demonstrating that superconductivity can be tuned independently of the bulk charge order. At a tensile strain of $\\varepsilon$ = +0.90%, the nuclear spin-lattice relaxation rate reveals a remarkable double transition: an upper transition at $T_{\\rm c1}$ = 3.6 K to a nodal gap state, and a lower one at $T_{\\rm c2}$ = 3.0 K characterized by a nodeless gap. These results evidence degenerate superconducting states with different gap symmetry in the kagome metal at ambient pressure which split under strain. Our work demonstrates a high tunability of superconductivity by uniaxial pressure.", "url": "https://arxiv.org/abs/2607.11115", "type": "理论+数值", "summary": "1. 该工作利用原位单轴应变下的锑核四极共振实验，研究电荷有序笼目金属CsV₃Sb₅中超导能隙结构的演化。\n2. 核心发现在于拉伸应变可独立于电荷密度波显著提高超导转变温度，并在0.90%应变下观测到从节状能隙到无节能隙的双重超导转变。\n3. 这揭示了环境压强下超导态的简并性及其应变劈裂，为理解笼目体系中竞争配对对称性提供了关键实验约束。", "summary_source": "deepseek", "authors": [{"name": "Yusuke Takeuchi"}, {"name": "Akito Kobayashi"}, {"name": "Saki Uchida"}, {"name": "Takumi Nagao"}, {"name": "Seigo Ogawa"}, {"name": "Rui Zhou"}, {"name": "Shinji Kawasaki"}, {"name": "Fei Song"}, {"name": "Hao Ni"}, {"name": "Yong Zhao"}, {"name
