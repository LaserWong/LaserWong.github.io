  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;

      --accent: #8f3d2e;
      --accent-2: #1d5f6b;

    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);

      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }

    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }

    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }

    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }

    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2606.23729", "category": "cond-mat", "title": "Interpretable Material Spatial Intelligence for Discovery of Governing Microstructural Features", "abstract": "Many material systems exhibit complex spatial and temporal interactions across multiple length scales and modalities that govern macroscopic behavior. Although Machine Learning (ML) is widely used in materials science to predict this behavior, most approaches still rely on handcrafted descriptors or aggregated representations that overlook spatial organization, limiting insight into governing mechanisms. We introduce Materials Spatial Intelligence (MSI), a framework inspired by spatial intelligence that learns directly from multimodal spatial observations of material systems. MSI encodes high-resolution microstructural and deformation data into shared latent representations that preserve spatial relationships while supporting property prediction, interpretation, and optimization. By combining multimodal representation learning, MSI identifies the key features governing mechanical behavior and property trade-offs in structural alloys. Beyond prediction, MSI enables feature-driven microstructure optimization and mechanism discovery. More broadly, MSI establishes a foundation for applying spatial intelligence to materials science, leveraging interpretable ML systems to accelerate scientific discovery and materiel design", "url": "https://arxiv.org/abs/2606.23729", "type": "数值", "summary": "1. 该工作提出材料空间智能(MSI)框架，直接从多模态空间观测中学习，用于发现控制力学行为的微观结构关键特征。\n2. 其核心在于联合多模态表示学习，在保留空间关系的共享隐空间中编码高分辨微观结构与变形数据，实现可解释预测与特征驱动优化。\n3. 这为材料科学中空间智能的应用建立了基础，通过可解释机器学习加速机制发现与材料设计。", "summary_source": "deepseek", "authors": [{"name": "Mathieu Calvat"}, {"name": "Gregory Sparks"}, {"name": "Dhruv Anjaria"}, {"name": "Chris Bean"}, {"name": "Haoren Wang"}, {"name": "Paul Gradl"}, {"name": "Timothy M. Smith"}, {"name": "Allison M. Beese"}, {"name": "Gabriel Demeneghi"}, {"name": "Kenneth Vecchio"}, {"name": "Morad Behandish"}, {"name": "J.C. Stinville"}], "featured_authors": [{"name": "Mathieu Calvat"}, {"name": "Gregory Sparks"}, {"name": "Dhruv Anjaria"}, {"name": "Kenneth Vecchio"}, {"name": "Morad Behandish"}, {"name": "J.C. Stinville"}], "author_count": 12}, {"id": "2606.23799", "category": "cond-mat", "title": "Fermi surface change and $d$-wave superconductivity in the square lattice Kondo-Heisenberg model", "abstract": "We study the two-dimensional Kondo-Heisenberg model on a square lattice, with the conduction electrons away from half-filling, using neural network quantum states. Mapping the ground-state phase diagram as a function of the Kondo and Heisenberg couplings, we identify (i) at weak Kondo coupling, antiferromagnetic Néel order with a Fermi surface whose enclosed area counts only the conduction electrons and is insensitive to the Néel order, and (ii) at strong coupling, a heavy Fermi liquid with a Fermi surface whose enclosed area counts both the conduction electrons and the spins. In the crossover between these regimes, we find $d_{x^2-y^2}$ superconductivity, evidenced by off-diagonal long-range order in the pair-pair correlations and a pairing-amplitude dome that coexists with the underlying magnetic phase. Our results establish Fermi volume change and unconventional superconductivity as intrinsic features of the two-dimensional Kondo-Heisenberg model.", "url": "https://arxiv.org/abs/2606.23799", "type": "理论+数值", "summary": "1. 该工作利用神经网络量子态求解平方晶格Kondo-Heisenberg模型，绘出从弱耦合反铁磁Neel序到强耦合重费米液体的基态相图。\n2. 核心发现是费米面体积经历由仅有导带电子到同时计入局域自旋的突变，并在此交叉区域出现具有d_{x^2-y^2}配对对称性的超导序。\n3. 这确立了二维Kondo-Heisenberg模型中费米体积变化与非常规超导的内在关联，为理解重费米子体系的量子临界性及配对机制提供了明确理论范例。", "summary_source": "deepseek", "authors": [{"name": "Alexander Nikolaenko"}, {"name": "Riccardo Rende"}, {"name": "Luciano Loris Viteritti"}, {"name": "Subir Sachdev"}, {"name": "Ya-Hui Zhang"}], "featured_authors": [{"name": "Alexander Nikolaenko"}, {"name": "Riccardo Rende"}, {"name": "Luciano Loris Viteritti"}, {"name": "Subir Sachdev"}, {"name": "Ya-Hui Zhang"}], "author_count": 5}, {"id": "2606.23810", "category": "cond-mat", "title": "Universal Dynamical Response to Slow Driving in Chaotic Systems", "abstract": "We propose a unified perspective on classical and quantum chaos based on the stability of a system's stationary states under slow driving. We probe this sensitivity via the system's susceptibility to the average protocol speed, which we call the ``speed-Fisher information,\" and relate it to irreversible entropy production in the system. We show that chaotic dynamics manifests as a divergence of the speed-Fisher information with the protocol time, and that this response is controlled by the perturbation's low-frequency spectral weight. This approach to chaos applies to both classical and quantum Hamiltonian systems, and naturally extends to non-Hamiltonian classical flows. We illustrate this framework with simple classical and quantum examples, along with a non-Hamiltonian flow that qualitatively exhibits analogous low-frequency spectral behavior.", "url": "https://arxiv.org/abs/2606.23810", "type": "理论", "summary": "1. 该工作基于慢驱动下稳态稳定性，提出了统一理解经典与量子混沌的动力学响应框架。\n2. 其核心在于定义“速度Fisher信息”并建立其与不可逆熵产生的联系，揭示混沌表现为该信息随协议时间发散，且受扰动低频谱权重主导。\n3. 该框架自然适用于非哈密顿经典流，为混沌系统的普适低频响应机制及跨体系比较提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Nachiket Karve"}, {"name": "Nathan Rose"}, {"name": "David Campbell"}, {"name": "Anatoli Polkovnikov"}], "featured_authors": [{"name": "Nachiket Karve"}, {"name": "Nathan Rose"}, {"name": "David Campbell"}, {"name": "Anatoli Polkovnikov"}], "author_count": 4}, {"id": "2606.23831", "category": "cond-mat", "title": "Domain-wall drift in a ferrimagnet induced by a linearly oscillating in-plane magnetic field", "abstract": "We investigate ferrimagnetic domain-wall dynamics under linearly oscillating in-plane magnetic fields. Starting from a ferrimagnetic Lagrangian that retains the field-dependent contribution to the kinetic energy, we derive collective-coordinate equations for the domain-wall position and azimuthal angle. This formulation makes explicit the field-induced inertial terms, including Coriolis-, Euler-, and centrifugal-like contributions, and clarifies how they couple translational and azimuthal dynamics. For an oscillating in-plane field supplemented by a weak static out-of-plane bias field, we show that periodic switching of the wall angle can be rectified into a finite average domain-wall velocity. At low drive frequencies, where the wall angle follows the oscillating field, the induced drift is proportional to the drive frequency rather than the field amplitude, while above a cutoff frequency the wall angle can no longer follow the drive and the average motion is suppressed. Micromagnetic simulations confirm the analytical predictions and demonstrate that the magnitude and direction of the drift can be tuned by the net spin density. These results identify linearly oscillating fields as a mechanism for frequency-controlled domain-wall motion in ferrimagnets and highlight the role of inertial spin dynamics near magnetic compensation.", "url": "https://arxiv.org/abs/2606.23831", "type": "理论+数值", "summary": "1. 该工作研究了线性振荡面内磁场驱动下亚铁磁畴壁的漂移动力学。\n2. 其核心在于从包含场依赖动能项的亚铁磁拉格朗日量出发，导出集体坐标方程并揭示科里奥利、欧拉及离心惯性项对平移-方位角动力学的耦合。\n3. 这为基于频率而非场幅控制畴壁运动提供了机制，并凸显了磁补偿点附近惯性自旋动力学的关键作用。", "summary_source": "deepseek", "authors": [{"name": "Murod Mirzhalilov"}, {"name": "Jacob Freyermuth"}], "featured_authors": [{"name": "Murod Mirzhalilov"}, {"name": "Jacob Freyermuth"}], "author_count": 2}, {"id": "2606.23914", "category": "cond-mat", "title": "Yielding versus random organization: convex absorbing transitions in soft matter", "abstract": "We compare two different soft matter models, a generalized Random Organization Model (ROM) describing the stroboscopic dynamics of cyclically sheared suspensions, and an elastoplastic model describing the mesoscale dynamics of a yield-stress fluid under imposed stress. Both show absorbing phase transitions, sharing a peculiar mechanism: activity induces an internal noise which is transmitted over large distances by long-ranged mediated interactions, either hydrodynamic or elastic, which results in non-local creation of activity. They also both show convex transitions (i.e., the exponent $\\beta >1$), in stark contrast with usual absorbing phase transitions, like (Conserved) Directed Percolation, which are concave ($\\beta <1$). We further compare the dependence of the critical properties (activity mean value and fluctuations, avalanche statistics, low-wavenumber structure factor) on the decay exponent $\\alpha$ of long-range interactions in both models, finding a qualitatively similar scenario. A smooth crossover is observed as a function of $\\alpha$ between a concave transition regime for short-range interactions, with diverging fluctuations and compact avalanches, and a convex transition regime, with vanishing fluctuations and non-compact avalanches, for longer-range interactions. Although for a given range exponent $\\alpha$, the values of critical exponents for both models differ, a good agreement between the models is found by parametrically plotting the different critical exponents as a function of the exponent $\\beta$ of the mean activity. In this parametric representation, the concave regime is consistent with the behavior of the Long-Range Conserved Directed Percolation class, while the convex regime can be accounted for by a mean-field-type scenario with anomalous diffusion close to an absorbing boundary, inspired by the Hébraud-Lequeux model for the yielding transition.", "url": "https://arxiv.org/abs/2606.23914", "type": "理论", "summary": "1. 该工作比较了广义随机组织模型和弹塑性模型，分别对应剪切悬浮液与屈服应力流体的吸收相变，发现二者均呈现凸相变（序参量临界指数β>1），而非通常的凹相变。\n2. 其核心在于长程流体力学或弹性相互作用导致非局域活性产生，通过调控衰减指数α实现从短程相互作用的凹相变（涨落发散、紧凑雪崩）到长程相互作用的凸相变（涨落消失、非紧凑雪崩）的平滑交叉。\n3. 参数化临界指数β后，凹区符合长程守恒定向渗透类，凸区可由含反常扩散的Hébraud-Lequeux平均场模型描述，为软物质非平衡临界现象提供了统一理解框架。", "summary_source": "deepseek", "authors": [{"name": "Tristan Jocteur"}, {"name": "Kirsten Martens"}, {"name": "Eric Bertin"}, {"name": "Romain Mari"}], "featured_authors": [{"name": "Tristan Jocteur"}, {"name": "Kirsten Martens"}, {"name": "Eric Bertin"}, {"name": "Romain Mari"}], "author_count": 4}, {"id": "2606.23921", "category": "cond-mat", "title": "Flexibility Controls Active-Filament Transport in Crowded Landscapes", "abstract": "Active filaments, ranging from motor-driven biopolymers to elongated bacteria and worms, are paradigmatic examples of deformable active matter. How filament flexibility interacts with environmental heterogeneity to control their transport in crowded environments, however, remains poorly understood. Here, we perform large-scale Brownian dynamics simulations of tangentially driven active polymers moving through ordered and disordered obstacle arrays to map the long-time diffusion as a function of obstacle density and filament flexibility. We find that flexibility can either enhance or hinder transport depending on the structure of the medium. In disordered environments, transport is optimized at intermediate filament flexibility, whereas both highly flexible and semiflexible filaments diffuse more slowly. In contrast, dense ordered arrays enhance the mobility of semiflexible filaments by promoting directed motion along periodic channels. We identify three distinct transport regimes: (i) tortuosity-controlled diffusion of highly flexible filaments, characterized by trapping-and-hopping dynamics; (ii) confinement-assisted transport of moderately flexible filaments, which enhances diffusion in dense media; and (iii) persistence-controlled transport of semiflexible filaments, which facilitates diffusion in dense ordered media, but suppresses it in disordered media. Combining theory and simulations, we show that long-time diffusion is governed by confinement-induced changes in filament conformation and reorientation dynamics. Our work uncovers general transport principles for deformable active agents in heterogeneous environments and provides a predictive framework for active-filament navigation in complex porous landscapes.", "url": "https://arxiv.org/abs/2606.23921", "type": "理论+数值", "summary": "1. 该工作通过大规模布朗动力学模拟，系统研究了切向驱动活性聚合物在有序与无序障碍阵列中的长时扩散，揭示了柔性如何调控其在拥挤环境中的运输行为。\n2. 其物理卖点在于识别出三种输运态——高柔性丝的曲折控制扩散、中等柔性丝的约束辅助增强及半柔性丝的持久性控制，并阐明了柔性通过构象与重取向动力学决定扩散增强或抑制的机制。\n3. 这为可变形活性物质在复杂异质环境中的导航提供了通用输运原理，并为设计生物或人工活性丝状体在天然多孔介质中的高效迁移策略奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Qingyi Di"}, {"name": "Mohammad Fazelzadeh"}, {"name": "Sara Jabbari-Farouji"}], "featured_authors": [{"name": "Qingyi Di"}, {"name": "Mohammad Fazelzadeh"}, {"name": "Sara Jabbari-Farouji"}], "author_count": 3}, {"id": "2606.23923", "category": "cond-mat", "title": "Stress-Boundary-Memory Feedback Drives Vortical-Polar Transitions in Softly Confined Active Matter", "abstract": "We computationally investigate how environmental sensitivity of active matter interacts with soft confinement to shape collective dynamics. In our model, the active constituents are represented as self-propelled particles (SPPs), implemented as nematic, disjoint ring polymers whose direction of motion can reverse without tumbling. Coarse-grained molecular dynamics simulations reveal that collective dynamics arise from a three-way feedback between active stresses, boundary elasticity, and particle-level memory. With increasing driving force, FD, this feedback generates a sequence of collective dynamical regimes. At low FD, SPP motion is dominated by thermal fluctuations. At intermediate FD, coherent vortical motion emerges with intermittent, noise-driven reversals. With further increase in FD, reversals are suppressed, yielding sustained unidirectional vortical motion. At sufficiently high FD, the system transitions to a polar state characterized by strong nematic ordering of the SPPs, symmetry breaking of the enclosure shape, and persistent polar collective motion. In this regime, the SPPs accumulate at the leading edge of the enclosure, driving sustained ballistic propulsion. These results demonstrate how environmental sensitivity and soft confinement jointly regulate emergent collective states and identify boundary elasticity as a control parameter governing the balance between vortical and ballistic dynamics.", "url": "https://arxiv.org/abs/2606.23923", "type": "理论+数值", "summary": "1. 该研究通过粗粒化分子动力学模拟，以自推进向列环聚合物为活性单元，系统阐释了软约束下活性应力、边界弹性与粒子定向记忆三重反馈驱动的集体动力学转变。\n2. 核心物理机制在于：随驱动力增大，系统依次经历热涨落主导、间歇反转相干涡旋、持续单向涡旋，最终在强向列序与包络形状对称破缺下进入持久极化弹道运动。\n3. 边界弹性被确认为调控涡旋-极化转变的关键控制参数，为通过调节环境刚度切换软约束活性物质集体运动模式提供了理论指导和实验启发。", "summary_source": "deepseek", "authors": [{"name": "Haosheng Wen"}, {"name": "P.B. Sunil Kumar"}, {"name": "Mohamed Laradji"}], "featured_authors": [{"name": "Haosheng Wen"}, {"name": "P.B. Sunil Kumar"}, {"name": "Mohamed Laradji"}], "author_count": 3}, {"id": "2606.24097", "category": "cond-mat", "title": "Reversible non-equilibrium phase transformation in amorphous germanium", "abstract": "First principles molecular dynamics simulations of germanium reveal a reversible liquid-glass transition below the equilibrium melting point with a wide hysteresis loop. Direct calculation of the liquid and amorphous state free energies, enabled by absolute entropy calculations, verify that the transition is first order in character between two metastable phases. These results lend credence to models of explosive recrystallization from amorphous Ge thin films, through a metastable liquid state and finally reaching the low temperature crystalline structure.", "url": "https://arxiv.org/abs/2606.24097", "type": "理论+数值", "summary": "1. 该工作通过第一性原理分子动力学模拟，揭示了非晶锗在平衡熔点以下呈现具有宽滞后回线的可逆液态-玻璃态相变。\n2. 其关键在于利用绝对熵计算直接获得液态与非晶态自由能，验证了该相变在亚稳态间具有一级相变特征。\n3. 这为解释非晶锗薄膜经由亚稳态液态实现低温爆炸再结晶的机理提供了直接热力学支持。", "summary_source": "deepseek", "authors": [{"name": "Yang Huang"}, {"name": "Marek Mihalkovič"}, {"name": "Michael Widom"}], "featured_authors": [{"name": "Yang Huang"}, {"name": "Marek Mihalkovič"}, {"name": "Michael Widom"}], "author_count": 3}, {"id": "2606.24126", "category": "cond-mat", "title": "Fluctuation exchange study on the electron-hole asymmetry of the superconductivity across 1/3 filling in the trilayer Hubbard model", "abstract": "We study within the fluctuation exchange approximation the trilayer Hubbard model where three layers of the Hubbard model are coupled by large interlayer hoppings so that the overlap of the bonding, nonbonding, and antibonding bands is relatively small. We pay special attention to the band fillings close to 1/3, for which the bonding and nonbonding bands as a whole are close to half filling. For relatively small values of the onsite $U$, superconductivity roughly exhibits electron-hole symmetric behavior, as expected for a nearly half-filled two-band system. By contrast, an asymmetry appears when $U$ becomes large, where superconductivity is more favored in the hole-doped regime, i.e., in the regime where electrons are removed from 1/3 filling. We attribute this asymmetry to the asymmetric renormalization of the bonding, nonbonding, and antibonding bands when $U$ is large.", "url": "https://arxiv.org/abs/2606.24126", "type": "理论", "summary": "1. 该工作利用涨落交换近似研究了三层Hubbard模型在接近1/3填充时的超导电性，并重点分析了电子-空穴掺杂不对称性。\n2. 其技术核心在于揭示了大层间跳跃耦合下成键、非键和反键能带的部分占据效应，发现强库仑作用U下空穴掺杂侧超导占优源自能带重整化的不对称。\n3. 这为理解多层强关联超导体系中掺杂依赖的电子-空穴不对称性提供了明确的机制启发。", "summary_source": "deepseek", "authors": [{"name": "Yushi Yamada"}, {"name": "Masataka Kakoi"}, {"name": "Masayuki Ochi"}, {"name": "Kazuhiko Kuroki"}], "featured_authors": [{"name": "Yushi Yamada"}, {"name": "Masataka Kakoi"}, {"name": "Masayuki Ochi"}, {"name": "Kazuhiko Kuroki"}], "author_count": 4}, {"id": "2606.24150", "category": "cond-mat", "title": "Gate-Controlled Spin Qubits in Confined Altermagnets", "abstract": "We propose gate-defined spin qubits in electrostatically confined altermagnetic quantum dots. Elliptical confinement of the $d$-wave altermagnetic structure produces a low-energy doublet with opposite spin polarization. For the range of parameters used here, the qubit states energy gap lies in the microwave range while the leakage gap remains in the meV range. Even without spin-orbit coupling, time-dependent simulations show that a phase-controlled quadrupolar gate drive about a fixed bias point implements $X_{\\pi/2}$ and $X_\\pi$ rotations by resonantly modulating the confinement anisotropy. We extend the study to two-qubits using a double quantum dot. We show that the double quantum dot spectrum can be cleanly projected onto isolated quantum dot product states with a nonzero nonlocal Pauli block in the effective logical two-qubit Hamiltonian. Resonant central-barrier modulation then drives the logical two-qubit component close to a maximally entangled state. These calculations show anisotropic altermagnetic quantum dots as a route to locally gate-controlled spin qubits without requiring spin-orbit coupling.", "url": "https://arxiv.org/abs/2606.24150", "type": "理论+数值", "summary": "1. 该工作提出在静电限定的交变磁量子点中，通过椭圆限制d波交变磁结构产生低能自旋极化双重态，实现门控自旋量子比特。\n2. 其核心在于无需自旋轨道耦合，利用相位控制四极门驱动共振调制限制各向异性，实现单比特Xπ/2和Xπ旋转，并在双量子点中通过共振中央势垒调制驱动两比特接近最大纠缠态。\n3. 这为在无自旋轨道耦合体系中构建全电控自旋量子比特及可扩展量子计算提供了可行路线。", "summary_source": "deepseek", "authors": [{"name": "Hamed Vakili"}], "featured_authors": [{"name": "Hamed Vakili"}], "author_count": 1}, {"id": "2606.24241", "category": "cond-mat", "title": "Evaluating the solution performance of the augmented Lagrangian function on Ising machines", "abstract": "We apply the augmented Lagrangian function (ALF) as a formulation for Ising machines and evaluate its performance by time-to-epsilon (\\mathrm{TT\\varepsilon}). The ALF has been well studied in continuous optimization for its numerical stability and convergence, and its advantage over the penalty function formulation is demonstrated here through the following results. Using the quadratic knapsack problem as a benchmark, we examine the dependence of \\mathrm{TT\\varepsilon} on the hyperparameters \\mu and \\lambda. The augmented Lagrangian formulation reduces \\mathrm{TT\\varepsilon} by roughly an order of magnitude compared with the penalty function formulation, keeping \\mu small while obtaining feasible solutions and, for representative parameter settings, reaching high-precision solutions earlier in the search. These findings indicate that the augmented Lagrangian function is a promising formulation for improving the solution performance of Ising machines.", "url": "https://arxiv.org/abs/2606.24241", "type": "数值", "summary": "1. 该工作将增广拉格朗日函数（ALF）应用于伊辛机，并采用时间-精度指标系统评估其求解性能。\n2. 其核心卖点在于ALF相比罚函数形式可将时间-精度指标降低约一个数量级，在小超参数μ下即可获得可行解，且在高精度解搜索中具有早期收敛优势。\n3. 这为伊辛机在组合优化问题中采用增广拉格朗日形式提升求解效率与精度提供了明确依据。", "summary_source": "deepseek", "authors": [{"name": "Shunsuke Awai"}, {"name": "Takuro Itoh"}, {"name": "Keita Takahashi"}, {"name": "Kotaro Tanahashi"}, {"name": "Shu Tanaka"}], "featured_authors": [{"name": "Shunsuke Awai"}, {"name": "Takuro Itoh"}, {"name": "Keita Takahashi"}, {"name": "Kotaro Tanahashi"}, {"name": "Shu Tanaka"}], "author_count": 5}, {"id": "2606.24291", "category": "cond-mat", "title": "Broadband molecular dynamics simulation of fluid inertial effects in confined Brownian motion", "abstract": "Hydrodynamic memory governs Brownian motion over a broad range of timescales, from acoustic wave propagation at short times to diffusive relaxation at long times. While confinement-induced corrections to Brownian diffusion are well established, how confinement modifies the full hydrodynamic response remains less explored. In this Letter, we use molecular-dynamics simulations of a neutrally buoyant colloidal particle in an explicit solvent to resolve the velocity autocorrelation function across a broad hydrodynamic spectrum. In the bulk, the simulations recover compressibility, added mass, the hydrodynamic long-time tail, and Stokes-Einstein diffusion without adjustable parameters. Near a rigid wall, the velocity correlations become anisotropic, their algebraic tails are modified, and the diffusion coefficients are reduced. Most importantly, the short-time dynamics reveals a pronounced enhancement of the effective added mass as the wall is approached. As such, the velocity autocorrelation function appears as a central quantity to bridge the zero-frequency mobility and the high-frequency inertial behaviour of a confined Brownian particle.", "url": "https://arxiv.org/abs/2606.24291", "type": "数值", "summary": "1. 该工作利用显式溶剂分子动力学模拟，解析了中性浮力胶体粒子在受限布朗运动中从声波传播到扩散弛豫的全频谱速度自相关函数。\n2. 其主要物理卖点在于无调节参数地恢复体相可压缩性、附加质量与长时尾标，并发现靠近刚性壁时有效附加质量显著增强及速度关联的各向异性修正。\n3. 这为通过速度自相关函数统一描述受限布朗粒子从零频迁移率到高频惯性行为提供了关键桥梁与可检验的微观图像。", "summary_source": "deepseek", "authors": [{"name": "Quentin Thomas"}, {"name": "Clara Mefo Sop"}, {"name": "Maxime Lavaud"}, {"name": "Yacine Amarouchene"}, {"name": "Thomas Salez"}, {"name": "Pascal Damman"}], "featured_authors": [{"name": "Quentin Thomas"}, {"name": "Clara Mefo Sop"}, {"name": "Maxime Lavaud"}, {"name": "Yacine Amarouchene"}, {"name": "Thomas Salez"}, {"name": "Pascal Damman"}], "author_count": 6}, {"id": "2606.24305", "category": "cond-mat", "title": "Proximity-Induced Spin Reorientation in Monolayer CrI$_3$ on Hexagonal WTe$_2$", "abstract": "Magnetic anisotropy controls the orientation and thermal stability of two-dimensional magnetic order. Predicting proximity-induced changes in anisotropy requires linking the electronic structure to microscopic magnetic interactions and finite-temperature behavior. Here we study monolayer CrI$_3$ on hexagonal WTe$_2$ using a first-principles-to-finite-temperature workflow centered on relativistic spin-Hamiltonian mapping. We find that WTe$_2$ reorients the CrI$_3$ magnetization from out-of-plane to in-plane and substantially enhances the magnetic ordering scale within the extracted spin models. Analysis of the extracted spin Hamiltonians shows that the reorientation is driven by a substrate-induced change in the balance between symmetric anisotropic exchange and onsite anisotropy. We establish a transferable workflow for proximity-controlled magnetism in two-dimensional van der Waals heterostructures.", "url": "https://arxiv.org/abs/2606.24305", "type": "理论", "summary": "1. 该工作通过第一性原理到有限温度的自旋哈密顿映射流程，研究单层CrI₃在六方WTe₂上的邻近效应，发现磁化从面外重取向至面内。\n2. 其核心在于揭示重取向由衬底调制对称各向异性交换与局域各向异性间的平衡驱动，并显著提升磁有序尺度。\n3. 这为二维范德华异质结中邻近可控磁性提供可转移的理论框架，有望指导自旋电子学器件设计。", "summary_source": "deepseek", "authors": [{"name": "Dániel Tibor Pozsár"}, {"name": "Marcell Balázs Sípos"}, {"name": "Amador García-Fuente"}, {"name": "Péter Nemes-Incze"}, {"name": "Viktor Ivády"}, {"name": "Efrén Navarro-Moratalla"}, {"name": "Jaime Ferrer"}, {"name": "László Szunyogh"}, {"name": "László Oroszlány"}, {"name": "Zoltán Tajkov"}], "featured_authors": [{"name": "Dániel Tibor Pozsár"}, {"name": "Marcell Balázs Sípos"}, {"name": "Amador García-Fuente"}, {"name": "László Szunyogh"}, {"name": "László Oroszlány"}, {"name": "Zoltán Tajkov"}], "author_count": 10}, {"id": "2606.24312", "category": "cond-mat", "title": "Universal Extraction of Quantum Critical Exponents and Phase Transitions via Tailored Hilbert Space", "abstract": "Finite-size scaling and the renormalization group form the central toolkit for analyzing quantum phase transitions (QPTs). In this Letter, we introduce a novel Hilbert-space tailoring scheme to probe quantum critical phenomena. Applied to the second-order QPT of the one-dimensional (1D) XY model, our method yields precise critical points and exponents on lattices containing merely 50 unit cells. We further establish the universal applicability of this framework via investigations of the Berezinskii-Kosterlitz-Thouless transition in the 1D XXZ chain: critical parameters are recovered with as few as 12 lattice sites. This technique may open an alternative, efficient route to universally characterize QPT across many-body lattice systems.", "url": "https://arxiv.org/abs/2606.24312", "type": "理论+数值", "summary": "1. 该工作提出了一种通过定制希尔伯特空间来普适提取量子临界指数和相变点的方案。\n2. 其核心在于在极小晶格尺寸（XY模型50个单元，XXZ链仅12个格点）下即可精确恢复临界参数，验证了普适性。\n3. 这为在多体晶格系统中开辟高效普适的量子相变表征途径提供了明确前景。", "summary_source": "deepseek", "authors": [{"name": "Ye Xiong"}], "featured_authors": [{"name": "Ye Xiong"}], "author_count": 1}, {"id": "2606.24395", "category": "cond-mat", "title": "Out-of-equilibrium scaling of the particle density in quantum fermionic wires after a critical quenching of the chemical potential", "abstract": "We study the out-of-equilibrium scaling behavior of the particle density in quantum fermionic Kitaev wires, after instantaneous quantum quenches (QQs) of the chemical potential within their quantum critical region. The critical scaling of the ground-state particle density is known to be subleading at its Ising-like quantum transition, hidden by regular and logarithmic terms arising from peculiar mixings with the identity operator. This situation changes along the out-of-equilibrium dynamics arising from QQs of the chemical potential to the critical point, starting from the ground state for Hamiltonian parameters within the critical region. We analytically show that the difference between the post-QQ particle density and its critical value develops an out-of-equilibrium scaling behavior, in terms of the dynamic scaling variable $\\theta\\sim t/\\xi^z$ (where $t>0$ is the post-QQ time, $\\xi$ is the length scale of the initial state, and $z$ is the dynamic critical exponent) associated with the post-QQ time evolution. The scaling function turns out to have a peculiar singular behavior in the $\\theta\\to 0$ limit, apparently related to the anomalous equilibrium scaling behavior of the particle density at the starting point of the QQ protocol. This provides analytical evidence of earlier conjectures on the general emergence of post-QQ dynamic scaling behaviors of the subtracted particle density (supported by numerical finite-size scaling analyses), unlike their equilibrium counterpart which turns out to be dominated by nonuniversal contributions.", "url": "https://arxiv.org/abs/2606.24395", "type": "理论+数值", "summary": "1. 该工作解析研究了量子Kitaev费米子线在化学势临界瞬间淬火后粒子密度的非平衡标度行为。\n2. 其核心在于揭示淬火后粒子密度与临界值之差随动态标度变量θ~t/ξ^z演化，且在θ→0时标度函数呈现奇异行为，与平衡态的非普适贡献形成对比。\n3. 这一结果为早期关于后淬火动态标度普遍性的猜想提供了严格解析证据，启发了量子临界动力学中可观测量的标度理论延伸。", "summary_source": "deepseek", "authors": [{"name": "H. Panagopoulos"}, {"name": "E. Vicari"}], "featured_authors": [{"name": "H. Panagopoulos"}, {"name": "E. Vicari"}], "author_count": 2}, {"id": "2606.24409", "category": "cond-mat", "title": "Quintic-Anharmonicity-Assisted Three-Phonon Scattering: A Previously Overlooked Same-Order Channel to Four-Phonon Scattering", "abstract": "Four-phonon scattering is widely regarded as the leading higher-order anharmonic correction to conventional three-phonon description of anharmonic scattering and lattice thermal transport. Here we show that diagrammatic perturbation theory contains another phonon linewidth contribution of the same perturbation order, arising from the coupling between cubic and quintic anharmonic vertices. We derive and implement this contribution from first principles and identify it as a quintic-anharmonicity-assisted three-phonon scattering channel. Although this process shares energy-conservation structure of the conventional three-phonon process, its perturbative order and temperature dependence resemble those of the conventional four-phonon process. For Si, we find that phonon scattering from this additional channel is comparable to four-phonon scattering over a broad frequency and temperature range, leading to a similar accelerated reduction of lattice thermal conductivity at high temperatures. We further show that in strongly anharmonic AgCl, this channel can become comparable to the ordinary three-phonon scattering even at room temperature. These results demonstrate that the commonly observed high-temperature enhanced scattering and suppression of lattice thermal conductivity might not be attributed uniquely to four-phonon process, and establish quintic-anharmonicity-assisted three-phonon scattering as a previously overlooked same-order channel in anharmonic lattice dynamics, which may be leveraged to uncover hidden microscopic thermal transport mechanisms.", "url": "https://arxiv.org/abs/2606.24409", "type": "理论", "summary": "1. 该工作从第一性原理发现并实现了五阶非简谐性辅助的三声子散射通道，作为与四声子散射同阶的微扰贡献。\n2. 其核心在于揭示了该通道源于三次与五次非简谐顶点的耦合，具有与四声子过程相同的微扰阶数和温度依赖，但能量守恒结构与三声子散射相似。\n3. 这为高温下晶格热导率降低的机制提供了新解释，表明不可唯一归因于四声子过程，并明确了在强非简谐体系中隐藏的声子散射通道的重要性。", "summary_source": "deepseek", "authors": [{"name": "Yi Xia"}], "featured_authors": [{"name": "Yi Xia"}], "author_count": 1}, {"id": "2606.24411", "category": "cond-mat", "title": "The impact of population heterogeneity on the redundancy principle", "abstract": "Biological signaling is often governed by extreme value statistics, where a rapid response relies on the fastest few out of a large redundant group of searchers. While extreme first passage time (FPT) theory is well established for homogeneous ensembles, its sensitivity to population heterogeneity remains open. We show that averaging over a heterogeneous population of memoryless random walkers gives rise to ensemble self-reinforcement. This heterogeneity drastically changes both the FPT and minimum FPT densities relative to a homogeneous ensemble with identical mean rates. The modal and minimum FPTs are an order of magnitude smaller for heterogeneous populations relative to homogeneous ones. Our exact analytical predictions establish that population heterogeneity is a parameter that biology can exploit and not merely noise to be averaged away.", "url": "https://arxiv.org/abs/2606.24411", "type": "理论", "summary": "1. 该工作通过精确解析方法，研究了群体异质性对极端首次通过时间统计的调控作用，揭示了异质性如何修正冗余原则。\n2. 核心发现在于异质性导致群体自我强化，使模态和最小首次通过时间较同质群体降低一个数量级，并给出了严格的解析预测。\n3. 这指明异质性可作为生物学主动利用的设计参数，而非仅需平均掉的噪声，为解释快速信号响应机制提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Sergei Fedotov"}, {"name": "Daniel Fears"}, {"name": "Daniel Han"}], "featured_authors": [{"name": "Sergei Fedotov"}, {"name": "Daniel Fears"}, {"name": "Daniel Han"}], "author_count": 3}, {"id": "2606.24451", "category": "cond-mat", "title": "From Continuous-Time Random Walks to Laplace Tails", "abstract": "During Brownian motion, the displacement is normally distributed, a classical fact aligned with the central limit theorem. However, single particle tracking in complex media such as glasses, living cells, and colloidal suspensions often reveals pronounced exponential decay of the displacement distribution, known as Laplace tails. In a short letter, two of us presented the emergence of Laplace tails in the continuous time random walk (CTRW) framework. Here, a detailed complementary study is presented. By exploring the behavior of $Q_t(n)$, the probability that exactly $n$ renewals occur during time $t$, we develop a rate function-like framework for this quantity, valid for finite $t$. We show that $Q_t(n)$ exhibits exponential tails, which in turn give rise to exponential tails of the positional probability density function $P(x,t)$. Favorable comparison to finite-time numerical simulations and asymptotic large deviation rate functions establishes the validity of our results over a wide temporal range.", "url": "https://arxiv.org/abs/2606.24451", "type": "数值", "summary": "1. 该工作对连续时间随机游走中位移分布拉普拉斯尾的出现进行了详细补充研究，基于更新数概率$Q_t(n)$发展了有限时间的率函数框架。\n2. 其核心在于揭示$Q_t(n)$本身呈现指数衰减尾，并严格证明了该指数尾直接诱导位置概率密度函数$P(x,t)$的拉普拉斯尾，且形式可精确推导。\n3. 这为理解玻璃、活细胞等复杂介质中单粒子追踪的异常扩散统计提供了有限时间范围的系统理论工具，并与数值模拟及渐近大偏差率函数高度吻合。", "summary_source": "deepseek", "authors": [{"name": "Omer Hamdi"}, {"name": "Stanislav Burov"}, {"name": "Eli Barkai"}], "featured_authors": [{"name": "Omer Hamdi"}, {"name": "Stanislav Burov"}, {"name": "Eli Barkai"}], "author_count": 3}, {"id": "2606.24478", "category": "cond-mat", "title": "Dimensional Confinement Driven Scattering Inversion in NaCrTe$_2$", "abstract": "Dimensionality reduction provides a powerful route to tune the electronic and magnetic properties of van der Waals materials, yet its influence on electronic transport remains complex due to competing effects from quantum confinement and modified scattering mechanisms. Here, we investigate this interplay in an antiferromagnetic semiconductor $\\text{NaCrTe}_2$ using first-principles calculations combined with the Boltzmann transport equation beyond the constant relaxation time approximation. Our results show that the monolayer limit induces a coupled magnetostructural reconstruction, reducing the band gap from $0.44$ eV (bulk) to $0.15$ eV (monolayer) and significantly enhancing the static dielectric constant. This evolution triggers a fundamental scattering inversion: whereas bulk transport is limited by polar optical phonon (POP) scattering, the monolayer becomes dominated by acoustic deformation potential (ADP) scattering. We show that this crossover originates from the simultaneous suppression of the Fröhlich interaction through enhanced dielectric screening and the amplification of acoustic scattering due to pronounced lattice softening. These results clarify how the interplay between dielectric screening, lattice stiffness, and band topology governs transport in low-dimensional magnetic semiconductors, providing a framework to optimize their electronic performance.", "url": "https://arxiv.org/abs/2606.24478", "type": "理论+数值", "summary": "1. 本文通过第一性原理计算结合玻尔兹曼输运方程，研究了反铁磁半导体NaCrTe₂从块体到单层极限时载流子散射机制的维度驱动反转。\n2. 其核心物理在于单层极限下磁结构重构使带隙从0.44 eV降至0.15 eV并显著增强静态介电常数，从而同时抑制Fröhlich相互作用并放大声学形变势散射。\n3. 该工作揭示了介电屏蔽、晶格刚度与能带拓扑共同调控低维磁性半导体输运的机制，为优化其电子性能提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Himanshu Sharma"}, {"name": "Bhawna Sahni"}, {"name": "Tanusri Saha-Dasgupta"}, {"name": "Aftab Alam"}], "featured_authors": [{"name": "Himanshu Sharma"}, {"name": "Bhawna Sahni"}, {"name": "Tanusri Saha-Dasgupta"}, {"name": "Aftab Alam"}], "author_count": 4}, {"id": "2606.24494", "category": "cond-mat", "title": "Magnetoelectric flat band induced by a $\\sqrt{3}\\times\\sqrt{3}$ charge density wave in monolayer CrSe$_2$", "abstract": "We investigate the electronic and magnetic properties of the polar $\\sqrt{3}\\times\\sqrt{3}$ charge-density-wave (CDW) phase of CrSe$_2$ using ab initio calculations. The CDW introduces a polar distortion out of the van der Waals plane that couples to the spin-polarized Cr d states resulting in a remarkably flat electronic band exactly at the Fermi level. We provide a microscopic understanding of the origin of the flat band by analyzing in detail the structural reconstruction, the effects of orbital hybridization, crystal-field splittings, spin-orbit coupling and electronic correlations. Our calculations show that due to the polar nature of the CDW distortion, an electric field can act as an external switch to induce the CDW phase, providing a way to manipulate strong correlations in the system.", "url": "https://arxiv.org/abs/2606.24494", "type": "数值", "summary": "1. 基于第一性原理计算，研究了单层CrSe2中极性√3×√3电荷密度波相的电子与磁性性质。\n2. 该相的面外极化畸变与自旋极化Cr d态耦合，结合轨道杂化、晶体场劈裂及自旋轨道耦合，在费米能级处产生了一条极平电子带。\n3. 该磁电平带的出现使得电场可作为外部开关诱导电荷密度波相，为操控该体系中的强关联效应提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Pablo Savino"}, {"name": "M. del Carmen Fuente Santiago"}, {"name": "Jan Phillips"}, {"name": "Javier Corral Sertal"}, {"name": "Adolfo O. Fumega"}, {"name": "Santiago Blanco-Canosa"}, {"name": "Victor Pardo"}], "featured_authors": [{"name": "Pablo Savino"}, {"name": "M. del Carmen Fuente Santiago"}, {"name": "Jan Phillips"}, {"name": "Adolfo O. Fumega"}, {"name": "Santiago Blanco-Canosa"}, {"name": "Victor Pardo"}], "author_count": 7}, {"id": "2606.24534", "category": "cond-mat", "title": "Multicomponent Grain Boundary Segregation Dilute-Limit Model and Its Effect on Nanocrystalline Stability", "abstract": "Grain boundary segregation of solutes is a powerful tool for stabilizing nanocrystalline materials. However, previous studies developed an approach to calculate stabilization only in binary systems. In this work, we derive a spectral segregation model for an arbitrary number of solutes in the dilute limit (neglecting solute--solute interactions) and demonstrate that multicomponent segregation substantially expands the range of nanocrystalline alloys thermodynamically stable against both grain growth and phase separation.", "url": "https://arxiv.org/abs/2606.24534", "type": "理论", "summary": "1. 本文推导了稀极限下适用于任意数量溶质的光谱晶界偏析模型，并分析其对纳米晶热力学稳定性的影响。\n2. 该模型通过忽略溶质间相互作用大幅简化了多组分体系，定量揭示了多组分偏析可同时抑制晶粒长大与相分离的稳定机制。\n3. 这为设计热力学稳定的多主元纳米晶合金提供了理论框架，并可能拓展至非稀极限或复杂界面偏析行为的研究。", "summary_source": "deepseek", "authors": [{"name": "Georgiy Marchiy"}, {"name": "Feodor Kuznetsov"}, {"name": "Dmitry Samsonov"}, {"name": "Eugene Mukhin"}], "featured_authors": [{"name": "Georgiy Marchiy"}, {"name": "Feodor Kuznetsov"}, {"name": "Dmitry Samsonov"}, {"name": "Eugene Mukhin"}], "author_count": 4}, {"id": "2606.24541", "category": "cond-mat", "title": "Anomalous Floquet Heating from Sparse Long-Range Interactions", "abstract": "Regular lattices of interacting particles under a periodic drive typically heat with rate $\\gamma \\sim e^{-\\mathcal{O}(\\omega)}$ which is exponentially suppressed in drive frequency $\\omega$. Here, we show that sparse infinite-range interactions, which have recently become accessible in quantum simulators, can lead to anomalous heating with rate $\\gamma \\sim e^{-\\mathcal{O}(\\sqrt{\\omega})}$. This anomaly originates from the broad distribution of coordination numbers across the network: as the driving frequency increases, heating becomes dominated by sites with larger coordination numbers, making the characteristic local energy scale relevant for heating grow with frequency. For small-world networks, we develop an analytic theory that thoroughly matches our large scale numerics. Finally, we discuss how network topology can serve as a control knob for engineering non-equilibrium phases of matter. Our results uncover a new mechanism for Floquet heating and suggest new routes toward stabilizing nonequilibrium phases in driven systems with programmable interaction networks.", "url": "https://arxiv.org/abs/2606.24541", "type": "理论", "summary": "1. 该工作揭示稀疏长程相互作用下周期驱动量子系统的反常加热率∼e^{-O(√ω)}，区别于常规晶格中的指数抑制。\n2. 核心机制在于网络配位数分布的广度：随驱动频率升高，加热由高配位位点主导，使局部相关能量尺度随频率增长。\n3. 这为利用可编程网络拓扑作为控制参量、设计稳定非平衡物质相提供了新路径，并建立了小世界网络下的解析理论。", "summary_source": "deepseek", "authors": [{"name": "Chenyue Guo"}, {"name": "Andrea Pizzi"}, {"name": "Hongzheng Zhao"}], "featured_authors": [{"name": "Chenyue Guo"}, {"name": "Andrea Pizzi"}, {"name": "Hongzheng Zhao"}], "author_count": 3}, {"id": "2606.24614", "category": "cond-mat", "title": "Dynamics and stability of inertial flexible chains under follower activity", "abstract": "The dynamics of flexible polymers and chains under follower activity is known to produce diverse nonequilibrium states. A prominent feature of such systems is the emergence of periodic motion arising from the coupling between internal activity and chain conformation. Recently, it has been shown that flexible and extensible chains of active particles exhibit rich dynamical patterns in the overdamped limit, where inertia is negligible. Here, we study the complex dynamics of a flexible and extensible chain of active particles under follower activity when inertia is significant. Using numerical simulations, we quantify the chain dynamics as a function of chain length ($N$), segment mass, and activity. To rationalize the numerical results, we develop theoretical descriptions in the limit of short chains ($N=3$) and long chains ($N \\gg 1$). In both these limits, we derive approximate expressions for the bond lengths and bond angles along the contour, which show excellent agreement with the numerical results. In addition, for short chains, we derive the stability conditions for a periodic motion as a function of segment mass and activity. For long chains ($N\\gg1$) we identify parameter regime in which the circular, periodic solution becomes structurally unstable. Our theoretical and numerical analysis provides insights into the emergence of ordered and periodic behaviour in active chains.", "url": "https://arxiv.org/abs/2606.24614", "type": "数值", "summary": "1. 该工作数值模拟并理论上分析了惯性力下随动活性柔性可伸长链的复杂动力学与结构稳定性。\n2. 其核心在于分别推导了短链（N=3）与长链（N>>1）极限下键长和键角的解析表达式，并确定了周期运动失稳的质量与活性参数边界。\n3. 这为理解惯性对活性聚合物有序周期行为涌现与结构不稳定性演化的作用提供了定量框架。", "summary_source": "deepseek", "authors": [{"name": "Sattwik Sadhu"}, {"name": "Nitin Kriplani"}, {"name": "Raghunath Chelakkot"}], "featured_authors": [{"name": "Sattwik Sadhu"}, {"name": "Nitin Kriplani"}, {"name": "Raghunath Chelakkot"}], "author_count": 3}, {"id": "2606.24755", "category": "cond-mat", "title": "On Degeneracies of Density, Magnetic, and Pairing Responses: How Competing Orders Echo Underlying Symmetries in the Hubbard Model", "abstract": "Strongly correlated electron systems often display competing or even intertwined ordering tendencies, hinting to extremely close or degenerate many-electron energies. While degeneracies are directly rooted in the underlying symmetries of the problem under investigation, their multifaceted effects on different response functions and their mutual relations often remain elusive. Here we put this subject on a rigorous basis by investigating the degeneracies of charge, spin, and pairing susceptibilities for the unfrustrated, bipartite Hubbard model. Exploiting its pseudospin symmetry, we analytically derive the mutual relations between these response functions for generic spatial modulations, highly relevant, e.g., for the competition of stripe and superconducting orders. By means of two-particle numerical simulations we demonstrate the occurrence of a simultaneous $d$-wave pairing/$d$-density wave (loop current) instability in the vicinity of the metal-insulator transition, driven by short-ranged spin fluctuations for the two-dimensional case. We show how this degeneracy is gradually lifted by geometrical frustration, which favors superconductivity. Our study provides a general tool for revealing symmetry relations in correlated electron systems and establishes a unifying perspective on the nature of their intermingled charge/loop current, pairing, and spin orders.", "url": "https://arxiv.org/abs/2606.24755", "type": "理论+数值", "summary": "1. 该工作基于无阻挫二部Hubbard模型的赝自旋对称性，严格推导了电荷、自旋及配对响应函数在任意空间调幅下的简并关系。\n2. 核心卖点在于通过双粒子数值模拟揭示了金属-绝缘体转变附近由短程自旋涨落驱动的d波配对与d-密度波（环流）不稳定性同时发生，并展示了几何阻挫如何逐步解除该简并进而 favoring 超导。\n3. 这为理解强关联电子系统中电荷/环流、配对与自旋序的竞争与交织提供了统一视角，并建立了揭示对称性关系的一般性理论工具。", "summary_source": "deepseek", "authors": [{"name": "Michael Meixner"}, {"name": "Herbert Eßl"}, {"name": "Matthias Reitner"}, {"name": "Alessandro Toschi"}, {"name": "Thomas Schäfer"}], "featured_authors": [{"name": "Michael Meixner"}, {"name": "Herbert Eßl"}, {"name": "Matthias Reitner"}, {"name": "Alessandro Toschi"}, {"name": "Thomas Schäfer"}], "author_count": 5}, {"id": "2606.24803", "category": "cond-mat", "title": "Introduction to matrix-product states and tensor networks", "abstract": "These notes provide an introduction to tensor-network methods in quantum many-body physics, with an emphasis on matrix-product states (MPS). They develop the basic tensor-network language, including graphical notation, virtual indices, bond dimensions, gauge freedom, canonical forms, QR and singular-value decompositions, and the role of entanglement in controlling the efficiency of the representation. The main MPS algorithms are then introduced, including contractions, correlation functions, matrix-product operators, DMRG, and time-evolution methods. The notes also briefly discuss projected entangled-pair states (PEPS) as a higher-dimensional generalization of MPS, together with the basic ideas behind approximate PEPS contraction. Finally, tensor-network representations of mixed states, quantum channels, and Lindblad dynamics are presented, with applications to thermal states and open quantum systems. The presentation is accompanied by short Julia code examples based on ITensor, ITensorMPS, and TensorMixedStates. These notes were written for the 9th Les Houches Summer School on Computational Physics: Open Quantum Systems, held in June 2026.", "url": "https://arxiv.org/abs/2606.24803", "type": "理论+数值", "summary": "1. 该工作从基本语言和核心算法出发，系统介绍了以矩阵乘积态为代表的张量网络方法及其在量子多体物理中的应用。\n2. 其技术特色在于完整涵盖张量网络的图形表示、规范自由度、分解技术、DMRG与时演算法，并延伸至投影纠缠对态、混合态及开放量子系统的张量网络表述。\n3. 附带的Julia代码示例降低了入门门槛，为大规模量子多体模拟、有限温度性质和耗散动力学的精确数值研究提供了直接工具。", "summary_source": "deepseek", "authors": [{"name": "Grégoire Misguich"}], "featured_authors": [{"name": "Grégoire Misguich"}], "author_count": 1}, {"id": "2606.24804", "category": "cond-mat", "title": "THz-induced phonon mode mixing and collective dynamics in a polar nanolattice", "abstract": "Manipulating phonons through symmetry is a fundamental approach to alter the dynamic responses of materials. Most often new phases are sought through control of the unit-cell (e.g. via strain, doping, light, etc.). By comparison, there is vast potential to look beyond the unit-cell into higher-order architectures to control wave scattering and interference effects that remains less explored. We describe the THz-induced dynamics of an SrTiO$_{3}$ thin film with a nanoscale ordered interfacial dislocation network probed with 2- and 3-dimensional time-resolved x-ray diffraction and classical molecular dynamics simulations. We find that symmetry breaking at all scales is an effective approach to create a dynamical electric polarization and to control phonon mixing that generates previously unreported collective modes in the THz regime with circular vortex-like displacements. This work opens a new pathway to explore dynamical functional properties that can be extended to magnetic, electric, and ferroelectric systems by controlling the real-space topology via epitaxy.", "url": "https://arxiv.org/abs/2606.24804", "type": "理论+数值", "summary": "1. 该工作结合时间分辨X射线衍射与经典分子动力学模拟，研究了THz激发下具有纳米有序界面位错网络的SrTiO₃薄膜动力学。\n2. 其核心在于利用从晶胞到纳米结构的多尺度对称性破缺，引发声子模式混合并产生环形涡旋位移的THz集体模式。\n3. 这为通过外延调控实空间拓扑结构，进而探索磁性、电性和铁电系统中的动态功能性质提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Elizabeth Skoropata"}, {"name": "Peter M. Derlet"}, {"name": "Hiroki Ueda"}, {"name": "Roman Mankowsky"}, {"name": "Mathias Sander"}, {"name": "Henrik T. Lemke"}, {"name": "Rafael T. Winkler"}, {"name": "Yunpei Deng"}, {"name": "Milan Radovic"}, {"name": "Matteo Savoini"}, {"name": "Biaolong Liu"}, {"name": "Martina Basini"}, {"name": "Vladimir Ovuka"}, {"name": "Steven L. Johnson"}, {"name": "Marta D. Rossell"}, {"name": "Urs Staub"}], "featured_authors": [{"name": "Elizabeth Skoropata"}, {"name": "Peter M. Derlet"}, {"name": "Hiroki Ueda"}, {"name": "Steven L. Johnson"}, {"name": "Marta D. Rossell"}, {"name": "Urs Staub"}], "author_count": 16}, {"id": "2606.24818", "category": "cond-mat", "title": "Exact log-odds representation and mean-field criticality of a growing social group model", "abstract": "We present an exact analytical reformulation of a growing social group model -- a Hamiltonian-free nonequilibrium process in which a group grows by noisy, consensus-driven admission. Cast as a gradient flow on logarithmic time, the fixed-point structure collapses to a single self-consistent equation: $\\arctanh(\\phi^*) = m \\cdot \\arctanh(\\alpha\\phi^*)$, where $\\phi$ is the polarization, $\\alpha=1-2\\eta$ the evaluation reliability, and $m$ the number of evaluators. The equation has a direct log-odds interpretation: each verdict contributes log-likelihood ratio $2\\arctanh(\\alpha\\phi)$; unanimity accumulates $m$ independent evidence pieces. The dynamics thus constitutes an exact mean-field theory of self-consistent inference, ordering when the collective gain $m\\alpha$ overcomes the dilution of growth. We develop a systematic three-layer framework: core theory (Landau-like effective potential, comparison with the mean-field Ising model, and features without equilibrium counterpart), mathematical foundations (criticality from correlated verdicts, Pólya-urn martingale convergence, and an RG-like flow with group size as scale), and complementary perspectives on irreversibility and information geometry. A frozen-$N$ Freidlin--Wentzell quasipotential yields Kramers-type escape estimates for metastable states, while Monte Carlo simulations collapse onto a parameter-free deterministic master curve on logarithmic time. Systematic comparison with the mean-field Ising model reveals shared critical exponents but a nested arctanh structure unique to growth. These results provide a detailed analytical characterization of a minimal model of growth-driven collective behavior and map which elements of the equilibrium critical toolbox -- suitably reinterpreted -- survive without a Hamiltonian.", "url": "https://arxiv.org/abs/2606.24818", "type": "理论+数值", "summary": "1. 该工作精确解析重构了一个增长社会群体模型，将其刻画为对数时间上的梯度流，并导出单自洽方程，揭示了极化序参量的平均场临界行为。\n2. 主要卖点在于将模型动力学等价于自洽推断的平均场理论，展现了嵌套arctanh结构、无哈密顿量的Landau有效势，以及与平均场伊辛模型共享临界指数但具有生长独有特征。\n3. 这为无哈密顿量的非平衡系统中临界现象的可解析处理提供了范例，并启发将平衡临界工具箱经适当重新诠释后推广至增长驱动集体行为。", "summary_source": "deepseek", "authors": [{"name": "Xingfu Ke"}, {"name": "Fanyuan Meng"}], "featured_authors": [{"name": "Xingfu Ke"}, {"name": "Fanyuan Meng"}], "author_count": 2}, {"id": "2606.24831", "category": "cond-mat", "title": "Anyon Exchange Phase from Antidot Interferometry", "abstract": "Quasiparticles in fractional quantum Hall systems are anyons, carrying a fraction of the electron charge. Exchanging two of them gives rise to a fractional exchange phase. While the fractional charge and the braiding phase -- twice the exchange phase -- have been measured, the exchange phase itself has remained inaccessible. We study a quantum antidot embedded in a Fabry-Perot interferometer. Within a systematic non-equilibrium Keldysh treatment that consistently includes the occupation and level broadening of the antidot, we find that the transmission phase evolves non-monotonically when a gate voltage tunes the antidot through a resonance, in contrast to the monotonic evolution for electrons. The bare exchange phase can be extracted from the difference between the phase plateaus.", "url": "https://arxiv.org/abs/2606.24831", "type": "理论", "summary": "1. 该工作通过嵌入法布里-珀罗干涉仪的量子反点，结合非平衡Keldysh理论一致处理反点占据和能级展宽，提出直接提取任意子裸交换相位的方法。\n2. 物理核心在于发现门电压调谐反点共振时透射相位呈非单调阶梯演化，与电子单调π相移迥异，且相邻相位平台差值等于交换相位。\n3. 该结果为在分数量子霍尔系统中直接测量任意子交换相位提供了明确的理论方案，对验证非阿贝尔统计和推动拓扑量子计算具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Matthias Thamm"}, {"name": "Felix Puster"}, {"name": "Bernd Rosenow"}], "featured_authors": [{"name": "Matthias Thamm"}, {"name": "Felix Puster"}, {"name": "Bernd Rosenow"}], "author_count": 3}, {"id": "2606.24860", "category": "cond-mat", "title": "Mechanism of Band Gap Formation in Beam Networks", "abstract": "Band gaps are commonly attributed to Bragg scattering or local resonance, yet it remains unclear whether these mechanisms govern band gap formation in beam networks. In this work, we explain band gap formation in beam networks in terms of a new mechanism, geometry-induced coupling between deformation modes. Specifically, band gap onset arises from axial-bending coupling at lattice nodes and scales with the axial cutoff frequency of a one-dimensional periodic beam, whereas band gap termination is primarily governed by high-frequency rotational branches associated with beam geometry. This mechanism holds for both periodic and disordered beam networks. In periodic lattices, it manifests through beam orientations at lattice nodes, whereas in disordered networks it manifests through short-beam statistics arising from variations in beam length. Together, these results establish a unified mechanism for band gap formation across both periodic and disordered beam networks, providing new insight into the physical origin of band gaps in beam-network materials.", "url": "https://arxiv.org/abs/2606.24860", "type": "理论", "summary": "1. 该工作提出梁网络中带隙形成的新机制，即几何诱导的变形模式耦合，统一解释了周期与无序网络中的带隙起源。\n2. 其卖点在于揭示带隙起始由轴向-弯曲耦合及一维周期梁的轴向截止频率标度，终止则由梁几何的高频旋转分支主导。\n3. 这为梁网络材料的带隙物理起源提供了统一框架，启发超材料与声子晶体中基于几何的设计思路。", "summary_source": "deepseek", "authors": [{"name": "Kwangmin Lee"}, {"name": "Charles Emmett Maher"}, {"name": "Katherine A. Newhall"}, {"name": "Ryan C. Hurley"}], "featured_authors": [{"name": "Kwangmin Lee"}, {"name": "Charles Emmett Maher"}, {"name": "Katherine A. Newhall"}, {"name": "Ryan C. Hurley"}], "author_count": 4}, {"id": "2606.24861", "category": "cond-mat", "title": "First-Order Recoverability Collapse in Self-Referential Information Decoders", "abstract": "We study adaptive systems coupling inference to irreversible action under sustained nonequilibrium driving. Treating information processing as a thermodynamic load, we model them as finite-capacity decoders whose irreversible commitments eliminate counterfactual options, and characterize recoverable operation by a feasibility margin and a stability diagnostic fixing when irreversible action is admissible. Under sustained overload -- induced flux exceeding effective integrative capacity -- loss of recoverability and divergence of the diagnostic arise as structural consequences of capacity saturation, independent of optimization objective, control policy, or substrate. Added capacity alone does not restore recoverability: absent certification or gating, higher throughput accelerates non-recoverable loss, with high-throughput AI a concrete application. Making the feedback explicit -- each uncertified commitment spawning on average alpha new candidates -- turns the continuous transition first-order: lucid and collapsed states coexist in a cusp-organized bistable region with closed-form spinodals, collapse pre-empts the continuous divergence at finite stability ratio, recovery is hysteretic, and for alpha >= 1 load reduction alone cannot restore operation. Cascade sizes are bounded by the grounded fraction of input: a genealogy-times-congestion factorization sets a cutoff that grows as grounding shrinks, with the mean-field exponent tau = 3/2 recovered away from the boundary and each cascade carrying a Landauer-priced burst of synthetic entropy; event-driven simulations confirm the cutoff law and phase structure. This supplies the statistical mechanics of the metastable failures seen in distributed systems. The analysis is constraint-based and substrate-agnostic, establishing recoverable dissipation as a necessary criterion for decoder stability in high-flux regimes.", "url": "https://arxiv.org/abs/2606.24861", "type": "理论+数值", "summary": "1. 该工作研究了自指信息解码器在持续非平衡驱动下可恢复性的一级相变崩溃，揭示了容量饱和导致的结构性不可恢复性独立于优化目标和具体基底。\n2. 技术关键在于将反馈明确化后，未认证承诺平均产生α个新候选者，使连续转变变为一级，系统呈现明态与坍缩态共存的尖点组织双稳区，并给出闭式旋节线。\n3. 这一约束基、基底无关的分析为分布式系统中亚稳态失效提供了统计力学基础，并指出高吞吐量AI应用中可恢复耗散是解码器稳定性的必要条件。", "summary_source": "deepseek", "authors": [{"name": "Pieter van Rooyen"}], "featured_authors": [{"name": "Pieter van Rooyen"}], "author_count": 1}, {"id": "2606.24864", "category": "cond-mat", "title": "Universality beyond the Kibble-Zurek mechanism in the condensation of coherently coupled Bose gases", "abstract": "We study the universal spatial statistics of point-like topological defects formed during the nonequilibrium condensation of a coherently coupled Bose gas using the stochastic projected Gross-Pitaevskii equation. The symmetry-breaking transition is driven by a linear quench of the chemical potential, leading to stochastic vortex nucleation in the individual condensate components. When the two components are considered together, these elementary defects may combine across components to emerge as composite topological defects known as full quantum vortices. Beyond the mean defect density predicted by the Kibble-Zurek mechanism (KZM), we investigate the spatial organization of both the elementary and composite defects and show that their positions are well described by a Poisson point process, revealing a universal stochastic geometry. This universality is further described through Voronoi tessellation, whose cell-area statistics follow Poisson-Voronoi predictions. We also introduce the spatial form factor for characterizing the vortex configurations and demonstrate the emergence of a characteristic dip-ramp-plateau structure. Our results establish universal stochastic geometry of topological defects beyond conventional Kibble-Zurek scaling and identify it as a fundamental feature of nonequilibrium condensation in coherently coupled Bose gases.", "url": "https://arxiv.org/abs/2606.24864", "type": "理论", "summary": "1. 该工作利用随机投影Gross-Pitaevskii方程，研究了相干耦合玻色气体在化学势线性淬火驱动下非平衡凝聚过程中点状拓扑缺陷的普适空间统计规律。\n2. 其卖点在于发现基本涡旋与复合全量子涡旋的位置服从泊松点过程，且Voronoi元胞面积统计和空间形状因子均揭示出超越Kibble-Zurek机制的普适随机几何特征。\n3. 这确立了缺陷随机几何作为非平衡凝聚基本属性的普适性，为量子模拟中复合拓扑缺陷的统计物理及后续实验提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Subhadeep Patra"}, {"name": "Paolo Comaron"}, {"name": "Arko Roy"}], "featured_authors": [{"name": "Subhadeep Patra"}, {"name": "Paolo Comaron"}, {"name": "Arko Roy"}], "author_count": 3}, {"id": "2606.23776", "category": "hep-th", "title": "On the amplitude expansion of gluon correlators in $\\textrm{AdS}_4$", "abstract": "We show that tree-level gluon correlators in $\\textrm{AdS}_4$ admit a natural expansion in terms of flat-space scattering amplitudes at all multiplicities. In particular, every $n$-point correlator can be decomposed into a sum over energy poles whose residues are flat-space amplitudes. The $n$-point amplitude encodes the flat-space limit while curvature corrections are captured by lower-point amplitudes with merged external data. The merging of external polarizations is recursively defined via an AdS analogue of the Berends-Giele currents, giving rise to all-multiplicity formulae which we verify against Feynman diagram computations up to five points. Crucially, our approach works at the level of full correlators rather than individual diagrams, providing an elegant and transparent alternative to conventional approaches for computing correlators in anti-de Sitter space.", "url": "https://arxiv.org/abs/2606.23776", "type": "理论", "summary": "1. 该工作建立了AdS4中树级胶子关联函数按平空间散射振幅展开的通用分解，每n点关联函数表示为能量极点留数之和。\n2. 其核心在于引入AdS版本的Berends-Giele电流递归定义外部极化合并，从而以完整关联函数而非逐个图方式获得全多重性公式，并验证至五点。\n3. 这为反德西特空间关联函数的计算提供了透明且高效的替代方案，有望推广至圈图及更一般的AdS背景。", "summary_source": "deepseek", "authors": [{"name": "Humberto Gomez"}, {"name": "Renann Lipinski Jusinskas"}, {"name": "Arthur Lipstein"}, {"name": "Cristhiam Lopez-Arcos"}], "featured_authors": [{"name": "Humberto Gomez"}, {"name": "Renann Lipinski Jusinskas"}, {"name": "Arthur Lipstein"}, {"name": "Cristhiam Lopez-Arcos"}], "author_count": 4}, {"id": "2606.23779", "category": "hep-th", "title": "Excitability of Gaussian states with VEVs", "abstract": "In arXiv:2604.19861 , we gave general criteria for when one zero-mean Gaussian state can be excited out of another in a (generalized) free field theory. Here we extend this analysis to the case of nonzero mean, i.e., to Gaussian states with vacuum expectation values (VEVs). We prove that excitability is possible exactly when (i) the connected two-point functions satisfy criteria like those in arXiv:2604.19861 , and (ii) the difference of the VEVs is bounded relative to the two-point functions. As an application, we give an explicit computation showing that in anti-de Sitter spacetime, a VEV shift can be excited from the Klein-Gordon vacuum if and only if its boundary extrapolation can be excited from the vacuum of the dual conformal field theory.", "url": "https://arxiv.org/abs/2606.23779", "type": "理论", "summary": "1. 该工作将高斯态可激发性理论从零均值推广至具有非零真空期望值的广义自由场高斯态情形。\n2. 核心卖点在于严格证明可激发性等价于两点关联函数满足已知判据，且真空期望值之差受限于两点函数范数。\n3. 这一结果为AdS/CFT对偶中体态与边界态的可激发性对应提供了精确计算检验，启发量子场论真空结构研究。", "summary_source": "deepseek", "authors": [{"name": "Jacqueline Caminiti"}, {"name": "Federico Capeccia"}, {"name": "Jonathan Sorce"}], "featured_authors": [{"name": "Jacqueline Caminiti"}, {"name": "Federico Capeccia"}, {"name": "Jonathan Sorce"}], "author_count": 3}, {"id": "2606.23785", "category": "hep-th", "title": "Controlled Chaos in 4D SCFTs", "abstract": "Chaotic dynamics play an important role in a number of physical systems. One of the qualitative hallmarks of this behavior is the appearance of a sufficiently \"complex\" spectrum of energy levels. This also makes it challenging to directly verify the onset of chaos in interacting quantum field theories. We present a class of 4D superconformal field theories (SCFTs) given by orbifolds of 4D $\\mathcal{N} = 4$ Super Yang--Mills theory in which operator mixing in a controlled subsector is described by an effective spin chain in one spatial dimension with nearest neighbor interactions tuned by the marginal couplings of the SCFT. Tuning the marginal couplings results in a chaotic spectrum, while generically the spin chain exhibits Anderson localization. We diagnose the onset of chaos by analyzing the statistical distribution of eigenvalues of the dilatation operator, in particular properties such as eigenvalue level repulsion, spectral rigidity, and the spectral form factor. We also show that other diagnostics such as Krylov complexity sometimes do not faithfully capture this information. This structure defines a chaotic billiard in the target space of the stringy realization. We also comment on the large $N$ holographic dual description, where the controlled single spin chain approximation must be supplemented by multi-trace dynamics, i.e., the splitting and joining of multiple spin chains.", "url": "https://arxiv.org/abs/2606.23785", "type": "理论", "summary": "1. 该工作通过轨道折叠四维𝒩=4超杨-米尔斯理论构造了一类超共形场论，其中受控子区间的算符混合由一维自旋链描述，并可通过调节边际耦合驱动谱从安德森局域化过渡到混沌。\n2. 其核心诊断方法基于扩张算符本征值统计（能级排斥、谱刚度及谱形状因子），并证明Krylov复杂性有时无法准确刻画混沌行为，从而确立了更可靠的混沌判据。\n3. 该结构定义了弦论靶空间中的混沌台球，并为全息对偶中多迹动力学（自旋链的分裂与合并）提供了可控近似，启发了对强关联量子场论混沌的进一步理解。", "summary_source": "deepseek", "authors": [{"name": "Florent Baume"}, {"name": "Atakan Çavuşoğlu"}, {"name": "Vivek Chakrabhavi"}, {"name": "Jonathan J. Heckman"}], "featured_authors": [{"name": "Florent Baume"}, {"name": "Atakan Çavuşoğlu"}, {"name": "Vivek Chakrabhavi"}, {"name": "Jonathan J. Heckman"}], "author_count": 4}, {"id": "2606.23893", "category": "hep-th", "title": "Towards OSV in AdS", "abstract": "We use supersymmetric localization for 3d $\\mathcal{N}=2$ SCFTs to establish a relation of the form $Z_{S^1\\times S^2} \\sim |Z_{S^3_b}|^2$ between the superconformal index and the squashed three-sphere partition function. This applies to general 3d $\\mathcal{N}=2$ SCFTs and is derived using a saddle point approximation in the Cardy-like limit of small $S^1$ radius and large squashing parameter. We also show a similar relation between the topologically twisted index and the squashed sphere partition function. In the context of holography our results lead to a relation between the partition function of supersymmetric asymptotically AdS$_4$ black holes and the large $N$ limit of $Z_{S^3_b}$ of the dual SCFT. Since the latter encodes the gauged supergravity prepotential, this result is akin to the OSV conjecture for asymptotically flat black holes. We confirm this relation in detail for SCFTs arising from M2-branes using recent large $N$ results from supersymmetric localization. We also briefly discuss a similar relation for 5d SCFTs and its implications for asymptotically AdS$_6$ black holes.", "url": "https://arxiv.org/abs/2606.23893", "type": "理论", "summary": "1. 该工作利用三维超对称局域化，建立了超共形指标与压缩三球面配分函数在Cardy-like极限下的鞍点近似关系。\n2. 核心卖点在于通过小S¹半径和大压缩参数的极限，揭示了该关系与OSV猜想在AdS₄黑洞配分函数和SCFT大N极限之间的类比。\n3. 这一结果启示类似关系可能推广至五维SCFT及AdS₆黑洞，为基于超对称局域化研究反德西特引力与共形场论对偶提供新路径。", "summary_source": "deepseek", "authors": [{"name": "Nikolay Bobev"}, {"name": "Sunjin Choi"}, {"name": "Junho Hong"}, {"name": "Valentin Reys"}], "featured_authors": [{"name": "Nikolay Bobev"}, {"name": "Sunjin Choi"}, {"name": "Junho Hong"}, {"name": "Valentin Reys"}], "author_count": 4}, {"id": "2606.24008", "category": "hep-th", "title": "General Lagrangian formulations for mixed-antisymmetric tensor fields on flat backgrounds", "abstract": "Lagrangian formulations for (ir)reducible integer higher-spin massless and massive Poincare group representations subject to Young tableau with $k$ columns $Y[\\hat{s}_1,\\hat{s}_2,...,\\hat{s}_k]$ in $d$-dimensional Minkowski space-time are firstly presented. The particles are described in a metric-like formulation by tensor fields with $k$ groups of antisymmetric Lorentz indices $\\Phi_{\\mu^1[{\\hat{s}_1}],\\mu^2[{\\hat{s}_2}],..., \\mu^k[{\\hat{s}_k}]}$ by means of the BRST procedure with complete, $Q$, and incomplete, $Q_c$, BRST operators. Starting from a description of bosonic mixed-antisymmetric higher-spin fields in terms of an auxiliary Fock space associated with a special Poincare module, we realize a conversion of the initial operator constraint system into a system of first-class operator constraints. To this aim, we find, in first time, by means of Verma module the auxiliary representations of the constraint subalgebra, to be isomorphic due to Howe duality to $so(k,k)$ algebra, and containing the subsystem of second-class operators in terms of new oscillator variables forming the Fock module. An unconstrained (with $Q$) and constrained (with $Q_c$ and BRST invariant algebraic constraints) gauge Lagrangian formulations with equivalent dynamics, but different configuration spaces are found. Concept of consistent interactions are suggested.", "url": "https://arxiv.org/abs/2606.24008", "type": "理论", "summary": "1. 该工作首次在d维平坦闵可夫斯基时空中给出了由多列杨图标记的混合反对称高自旋张量场的无质量与有质量拉格朗日公式，覆盖可约与不可约庞加莱群表示。\n2. 其技术核心在于利用BRST程序，通过Verma模与Howe对偶构造与so(k,k)代数同构的约束子代数辅助表示，将第二类约束转化为第一类约束，从而导出分别由完整BRST算符和不完整BRST算符支配的动力学等价但位形空间不同的无约束与有约束规范拉格朗日形式。\n3. 这为高自旋场论中相容相互作用的系统构造以及相关弦论对应提供了明确的拉格朗日层面理论框架与实现路径。", "summary_source": "deepseek", "authors": [{"name": "Alexander A. Reshetnyak"}], "featured_authors": [{"name": "Alexander A. Reshetnyak"}], "author_count": 1}, {"id": "2606.24018", "category": "hep-th", "title": "Null limit of large-charge correlators in planar $\\mathcal{N}=4$ Super-Yang-Mills theory", "abstract": "We present a conjecture for the double-logarithmic behavior of the logarithm of large-charge correlators in the null limit in planar $\\mathcal{N} = 4$ Super-Yang-Mills theory. Generalizing earlier results for four- and five-point functions, our proposal predicts this behavior for $n$-point functions to all loops in terms of the tilted cusp anomalous dimension. In the dual amplitude description, it reproduces the expected small-mass behavior of massive amplitudes in the equal-mass limit.", "url": "https://arxiv.org/abs/2606.24018", "type": "理论", "summary": "1. 该工作提出了平面𝒩=4超杨-米尔斯理论中大电荷关联函数在零极限下双对数行为的统一猜想。\n2. 其核心在于将n点函数所有圈阶的此类行为归结于倾斜尖点反常维度，推广了四点与五点函数结果。\n3. 这在对偶振幅描述中等质量极限下的小质量行为得到重现，为精确求解强耦合关联函数提供了可检验路径。", "summary_source": "deepseek", "authors": [{"name": "Benjamin Basso"}, {"name": "Thiago Fleury"}, {"name": "Erkan Kaluç"}, {"name": "Didina Serban"}], "featured_authors": [{"name": "Benjamin Basso"}, {"name": "Thiago Fleury"}, {"name": "Erkan Kaluç"}, {"name": "Didina Serban"}], "author_count": 4}, {"id": "2606.24272", "category": "hep-th", "title": "Equivariant Interpolations in Topological Holography", "abstract": "We revisit equivariant Gromov-Witten theories on P1 and on P1 x C2. One can introduce three equivariant parameters associated to rotations of the sphere as well as the two planes. A number of points in the parameter space have known holographic duals. These include the symmetric orbifold point dual to the AdS3 x S3 x C2 string theory at string scale radius of curvature, the grand canonical Hurwitz theory and the product of two Kontsevich models. Within this framework, we discuss interpolations in the equivariant parameters. Firstly, we move between the small and large equivariant parameter regimes in Gromov-Witten theory on P1. At large equivariant parameter, the model is dominated by the pure topological gravity theories at the two fixed points while at small equivariant parameter the theory is equivalent to the grand canonical Hurwitz theory. The deformation is a solvable analogue for the interpolation in the transposition coupling in the moduli space of the AdS3/CFT2 duality. Moreover, we propose that the full equivariant correspondence between the Gromov-Witten theory on P1 x C2 and the symmetric orbifold of the equivariant plane can be embedded in string theory. On the boundary side of that correspondence, we analyze the scaling limit from the equivariant to the ordinary cohomology ring for the Hilbert scheme of points on the plane in terms of Jack symmetric polynomials. We explicitly compute several structure constants of the equivariant cohomology ring and point out their intriguing positivity and integrality properties.", "url": "https://arxiv.org/abs/2606.24272", "type": "理论", "summary": "1. 该工作重新审视P1及P1×C2上的等变Gromov-Witten理论，系统探讨等变参数空间中的插值及其已知全息对偶。\n2. 其技术要点在于揭示大等变参数区域由纯拓扑引力主导至小等变参数等价于巨正则Hurwitz理论的可解变形，并提议将全等变对应嵌入弦论。\n3. 这为AdS3/CFT2对偶模空间中换位子耦合的插值提供可解类比，并启发等变上同调环结构常数的正整性研究。", "summary_source": "deepseek", "authors": [{"name": "Jan Troost"}], "featured_authors": [{"name": "Jan Troost"}], "author_count": 1}, {"id": "2606.24285", "category": "hep-th", "title": "Topics in Celestial holography: A bottom-up perspective", "abstract": "We review some selected topics in celestial holography on the search for a celestial dual to quantum gravity in flat spacetimes. We focus on the bottom-up approach, emphasizing symmetries, key elements in celestial CFT, interplay with twistor theory, and connection to AdS/CFT.", "url": "https://arxiv.org/abs/2606.24285", "type": "理论", "summary": "1. 该工作自下而上综述了天体全息中对称性、天体共形场论关键要素、与扭量理论的相互作用及与AdS/CFT的联系。\n2. 其核心在于系统阐明这些元素如何构成构建平直时空量子引力全息对偶的理论基础。\n3. 这为后续天体全息研究提供了明确的方向指引和概念工具。", "summary_source": "deepseek", "authors": [{"name": "Bin Zhu"}], "featured_authors": [{"name": "Bin Zhu"}], "author_count": 1}, {"id": "2606.24328", "category": "hep-th", "title": "Dark-Sector Deformations of Holographic Anisotropic Superfluids in Asymptotically Hyperscaling Violation Geometry", "abstract": "We study dark-sector deformations of holographic anisotropic \\(p\\)-wave superfluids in hyperscaling-violating black-brane backgrounds. In the visible \\(SU(2)\\) sector, \\(b(u)\\) fixes the chemical potential and charge density, while \\(\\omega(u)\\) condenses and selects a boundary direction, producing anisotropic strip entanglement. The visible critical chemical potential, radial profiles, condensate branch, and strip-entanglement difference vary with dimension and hyperscaling-violating exponents. We then add hidden gauge sectors and hidden dark-scalar portals. Hidden-current mixing gives a solvable example, whereas isotropic dark sources cancel in the strip difference. For the kinetic dark-scalar portal, \\(Z_{\\rm dm}(\\Phi)\\) deforms the Yang--Mills operator; hence \\(b_0(u)\\), \\(\\omega_1(u)\\), and the order-\\(\\epsilon^2\\) anisotropic stress are computed in the same deformed problem. The critical shift depends on the hyperscaling-violating background and can change sign. The main result is a strip susceptibility at vanishing portal strength. It is negative in the \\(D=4\\) and \\(D=5\\) backgrounds, so the portal weakly suppresses visible strip anisotropy. This has a holographic RG interpretation: the normalizable dark scalar is weighted toward the IR horizon, while narrow strips probe the UV near-boundary RT region. Thus, the portal decouples in the UV and the susceptibility vanishes quadratically with strip width; wider strips reach deeper into the bulk and recover the IR dark-sector effects.", "url": "https://arxiv.org/abs/2606.24328", "type": "理论", "summary": "1. 该工作研究了超标度违规几何中暗扇区形变对全息各向异性p波超流体的影响，在可见SU(2)扇区与隐藏规范及暗标量门户耦合下分析条带纠缠与凝聚行为。\n2. 技术要点在于通过动力学暗标量门户形变杨-米尔斯算子，计算临界化学势偏移和零门控强度下负的条带磁化率，揭示其对可见条带各向异性的弱抑制。\n3. 这一现象具有全息重整化群解释：窄条带探测UV近边界区域导致门户解耦、磁化率随宽度二次消失，而宽条带深入体恢复IR暗扇区效应，为暗物质与强关联系统关联提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Ji-Seong Chae"}], "featured_authors": [{"name": "Ji-Seong Chae"}], "author_count": 1}, {"id": "2606.24382", "category": "hep-th", "titl
