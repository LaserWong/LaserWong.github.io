ar memory scaling in the compilation phase, eliminates intermediate expression swell in exact arithmetic, and substantially extends the range of reliable double-precision computation by reducing cancellation-induced error amplification. Beyond its computational advantages, the DCR provides a unified perspective on $q$-deformed amplitudes. Structural properties like admissibility at roots of unity, and the classical limit all emerge as intrinsic properties of a single underlying combinatorial object.", "url": "https://arxiv.org/abs/2604.13196", "type": "理论", "summary": "1. 该工作为有限q-超几何级数与q变形振幅的稳定精确求值，引入了一种分离代数结构与求值的分圆表示方法。\n2. 其技术核心在于采用不可约分圆多项式的稀疏指数基表示求和项，将量子阶乘的乘除运算转化为精确的整数向量算术，从而在求值前完全消除分子分母的相消。\n3. 这不仅显著扩展了可靠双精度计算的范围并抑制了表达式膨胀，而且为理解q变形振幅在单位根处的可容许性等结构性质提供了统一的组合对象视角。", "summary_source": "deepseek", "authors": [{"name": "Seth K. Asante"}], "featured_authors": [{"name": "Seth K. Asante"}], "author_count": 1}, {"id": "2604.13250", "category": "math-ph", "title": "Continuation of Hamiltonian dynamics from the plane to constant-curvature surfaces", "abstract": "We investigate the deformation of symmetry on cotangent bundles from the Euclidean plane to two-dimensional constant-curvature surfaces and the continuation of local dynamics aspects in Hamiltonian systems. For a fixed curvature sign $\\sigma\\in\\{+1,-1\\}$, the curved problem is set up either on the sphere $(\\sigma=+1)$ or on the hyperbolic plane $(\\sigma=-1)$, both with radius $R=1/\\varepsilon$, recovering flat space in the limit $\\varepsilon\\to 0$. The symmetry of these spaces is taken into account by using the Inönü--Wigner contraction of Lie algebras from $\\mathfrak{so}(3)$ or $\\mathfrak{so}(2,1)$ to $\\mathfrak{se}(2)$. We use Riemannian exponential coordinates centred at the North pole together with the pull-back the associated momentum map and the symplectic form. Within this geometric setting we use a local slice construction and prove the persistence from flat to curved spaces of non-degenerate relative equilibria and relative periodic orbits of general cotangent bundle Hamiltonian systems. We apply the resulting framework to the Newtonian $n$-body problem.", "url": "https://arxiv.org/abs/2604.13250", "type": "理论", "summary": "1. 该工作建立了一个从平面到常曲率曲面的余切丛哈密顿动力学的几何延续框架，并将其应用于牛顿n体问题。\n2. 其核心在于结合了李代数的Inönü-Wigner收缩与局部切片构造，严格证明了非退化相对平衡与相对周期轨道在曲率变化下的持久性。\n3. 这为在球面与双曲空间等弯曲背景中系统研究经典多体动力学及对称性破缺现象提供了普适的理论工具与几何视角。", "summary_source": "deepseek", "authors": [{"name": "Cristina Stoica"}], "featured_authors": [{"name": "Cristina Stoica"}], "author_count": 1}, {"id": "2604.13582", "category": "math-ph", "title": "A note on spinor fields in spherical symmetry", "abstract": "By employing the polar re-formulation, we show that there are no solutions of the Dirac equations in spherical symmetry when the spinor is required to satisfy the same symmetries as the space-time via the Lie derivative.", "url": "https://arxiv.org/abs/2604.13582", "type": "理论", "summary": "1. 该工作通过极坐标重构方法，证明了当旋量场通过李导数被要求满足与球对称时空相同的对称性时，狄拉克方程不存在解。\n2. 其技术关键在于利用极坐标形式，严格推导了旋量场对称性条件与动力学方程的互斥性。\n3. 这一结果对在强对称性约束下构造经典旋量场解的理论尝试提出了根本性质疑，并可能启发对更广义对称性框架的探索。", "summary_source": "deepseek", "authors": [{"name": "Stefano Vignolo"}, {"name": "Luca Fabbri"}], "featured_authors": [{"name": "Stefano Vignolo"}, {"name": "Luca Fabbri"}], "author_count": 2}, {"id": "2604.13781", "category": "math-ph", "title": "On Exponentially Long Prethermalization Timescales in Isolated Quantum Systems", "abstract": "We study prethermalization in time-independent quantum many-body systems on a $d$-dimensional lattice with an extensive local Hamiltonian $H=N+\\varepsilon P$, in the regime where $\\varepsilon \\ll 1$. We show that the prethermalization time is exponentially large in $\\varepsilon_0/\\varepsilon$, where $\\varepsilon_0$ is the ratio between an effective spectral gap width and the local norm of $P$. We prove also that for exponentially long times, there exist two quasi-conserved quantities up to exponentially small errors.", "url": "https://arxiv.org/abs/2604.13781", "type": "理论", "summary": "1. 该工作研究了具有广延局域哈密顿量 $H=N+\\varepsilon P$ 的孤立量子多体系统的预热化过程，并严格证明了在 $\\varepsilon \\ll 1$ 条件下预热化时间的指数增长行为。\n2. 其核心成果在于严格证明了预热化时间按 $\\exp(\\varepsilon_0/\\varepsilon)$ 标度指数延长，并确立了在该时间尺度内存在两个准守恒量。\n3. 这为在冷原子等实验平台上观测并利用指数级延长的非平衡稳态提供了可靠的理论基础。", "summary_source": "deepseek", "authors": [{"name": "Matteo Gallone"}], "featured_authors": [{"name": "Matteo Gallone"}], "author_count": 1}, {"id": "2604.13838", "category": "math-ph", "title": "On hyperbolic and rational solutions of the cubically nonlinear Schrödinger equation", "abstract": "In a previous article we have proved non-existence of certain \"solutions\" of the cubically nonlinear Schrödinger equation in the general case, and presented solutions in the non-generic case. -- In the present article we describe a further family of solutions enlarging the set of non-generic solutions.", "url": "https://arxiv.org/abs/2604.13838", "type": "理论", "summary": "1. 该工作进一步扩展了三次非线性薛定谔方程的非一般解族。\n2. 其卖点在于构造并描述了一个新的精确解族，从而系统性地丰富了特殊参数情况下的已知解析解集合。\n3. 这为深入探索此类可积方程的解结构、奇异性及可能的应用联系提供了更完备的解析基础。", "summary_source": "deepseek", "authors": [{"name": "Hans Werner Schürmann"}, {"name": "Valery Serov"}], "featured_authors": [{"name": "Hans Werner Schürmann"}, {"name": "Valery Serov"}], "author_count": 2}, {"id": "2604.14077", "category": "math-ph", "title": "Open WDVV equations and $\\bigvee$-systems", "abstract": "The idea of a $\\bigvee$-system was introduced by Veselov in the study of rational solutions of the WDVV equations of associativity. These are algebraic/geometric conditions on the set of covectors that appear in rational solutions to the WDVV equations. Here, this idea is generalized to open WDVV equations, which are an additional set of PDEs originating from open Gromow-Witten Theory. We develop -- for rank-one extensions -- algebraic/geometric conditions on the covectors that supplement the $\\bigvee$-system to give rational solutions to the open WDVV equations. Examples, and the relation to superpotentials and to Dubrovin almost-duality, are given.", "url": "https://arxiv.org/abs/2604.14077", "type": "理论", "summary": "1. 该工作将Veselov为研究WDVV方程有理解而引入的∨-系统概念，推广至源于开弦Gromov-Witten理论的开WDVV方程组。\n2. 其核心贡献在于，针对秩一扩张情形，发展了一套补充原始∨-系统的余向量代数/几何条件，该条件是获得开WDVV方程有理解的关键。\n3. 此项研究建立的框架，为探讨其与超势及Dubrovin近对偶性等已知结构的联系提供了明确基础。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Proserpio"}, {"name": "Ian A. B. Strachan"}], "featured_authors": [{"name": "Alessandro Proserpio"}, {"name": "Ian A. B. Strachan"}], "author_count": 2}, {"id": "2604.13135", "category": "quant-ph", "title": "Comment on arXiv:2604.09826: Discovery of the Solution to the \"Einstein--Podolsky--Rosen Paradox\"", "abstract": "Roman Schnabel's article argues that the Einstein-Podolsky-Rosen (EPR) paradox can be resolved by identifying a flaw in what the author calls the \"EPR implication\" and by using radioactive alpha decay as an example showing that predictability does not exclude genuine randomness. The paper is clearly written and addresses an important foundational question. In our view, however, its main conclusion does not follow. The article narrows the original EPR argument, attributes too much to Bell-inequality violations, and replaces the central EPR structure - which involves incompatible observables and locality-based reasoning - with a simpler case of correlated random events. The result is an interesting interpretive remark, but not, we think, a satisfactory scientific resolution of the EPR problem.", "url": "https://arxiv.org/abs/2604.13135", "type": "数值", "summary": "1. 该评论文章批判性地分析了Roman Schnabel基于识别“EPR蕴含”缺陷和使用α衰变示例以解决爱因斯坦-波多尔斯基-罗森悖论的方案，并论证其主结论不成立。\n2. 其核心批评在于揭示原论文不恰当地窄化了EPR原始论证、过度归因于贝尔不等式违规的意涵，并将涉及不相容可观测量和局域性推理的核心结构替换为简单的相关随机事件案例。\n3. 这强调了解决EPR悖论时必须严格保持原始问题框架，避免不当简化，从而为未来量子基础研究中探索不相容可观测量与局域性之间的根本张力提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Mikołaj Sienicki"}, {"name": "Krzysztof Sienicki"}], "featured_authors": [{"name": "Mikołaj Sienicki"}, {"name": "Krzysztof Sienicki"}], "author_count": 2}, {"id": "2604.13144", "category": "quant-ph", "title": "Quantum-inspired classical simulation through randomized time evolution", "abstract": "Tensor-network simulations of quantum many-body dynamics are fundamentally limited by entanglement build-up, which leads to exponentially growing computational costs. Furthermore, these classical simulation algorithms are inherently sequential as typically a tensor network representation of the quantum state is updated incrementally at each time step. We build on recently introduced randomized quantum algorithms for time evolution (TE-PAI), and adapt them to the classical simulation context with the purpose of enabling massive parallelisation. Our MPS TE-PAI approach achieves exact time evolution on average (unbiased estimator) and proceeds by representing an ensemble of randomized shallow Trotter-variant circuits as tensor networks. As each circuit instance yields a deterministic quantum state (or observable expecation value), the only source of randomness is the sampling of circuit variants; the absence of shot noise therefore yields a reduced estimator variance relative to quantum hardware implementations of TE-PAI. We simulate representative disordered one-dimensional spin-ring Hamiltonians, and numerically observe reductions in the per-sample gate-count by a factor of up to $10^3$ relative to Trotterized MPS evolution, yielding orders of magnitude reduction in the time-to-solution under realistic levels of parallelisation. Finally, we numerically observe that MPS TE-PAI is substantially more robust against severe bond-dimension truncation than product formulas, potentially making it useful for the simulation of strongly correlated systems where truncation is necessary in practice. We also demonstrate that the approach can be used naturally in combination with existing time evolution algorithms, effectively extending their time depth via parallelisation.", "url": "https://arxiv.org/abs/2604.13144", "type": "理论+数值", "summary": "1. 本研究将随机化时间演化量子算法（TE-PAI）引入经典张量网络模拟，提出了基于矩阵乘积态的随机时间演化方法（MPS TE-PAI）。\n2. 该方法通过对随机浅层电路变体进行张量网络表示，在保持估计量无偏的同时，实现了比传统Trotter演化高三个数量级的门操作缩减，并显著降低截断误差敏感性。\n3. 这一框架为强关联体系的长时程模拟提供了可并行化扩展的新路径，并能与现有时间演化算法结合以突破其模拟深度限制。", "summary_source": "deepseek", "authors": [{"name": "Fredrik Hasselgren"}, {"name": "Bálint Koczor"}], "featured_authors": [{"name": "Fredrik Hasselgren"}, {"name": "Bálint Koczor"}], "author_count": 2}, {"id": "2604.13158", "category": "quant-ph", "title": "Fast measurement of neutral atoms with a multi-atom gate", "abstract": "Measurement time represents a critical bottleneck limiting the operational speed of neutral atom quantum computers, as it cannot be accelerated through parallelization like other quantum operations. We present a protocol for fast measurement of neutral atoms based on a new, fast multi-atom Rydberg gate that significantly reduces the measurement integration time and improves the measurement fidelity. Our approach employs a multi-qubit register of $N$ ancilla atoms within a single Rydberg blockade region to measure a single data qubit. This enables an $N$-fold enhancement in photon emission collections, while reducing the measurement's sensitivity to loss. The scheme requires spectral separation between the data qubit and the ancillae, achievable through either a dual-species architecture or a targeted light shift. Beyond this, the scheme is straightforward to implement: it relies only on global pulses, global photon collection, and avoids both atom shuttling and numerically optimized pulses. Simulations of a Cs--Rb platform demonstrate that with only five ancillae ($N=5$), measurement infidelity below $10^{-3}$ within $6\\ \\mu\\text{s}$ is achievable.", "url": "https://arxiv.org/abs/2604.13158", "type": "实验", "summary": "1. 该工作提出了一种基于快速多原子里德堡门的中性原子量子比特快速测量方案。\n2. 其核心是利用单个里德堡阻塞区域内N个辅助原子构成的多量子比特寄存器对数据量子比特进行测量，实现了光子收集效率的N倍提升并降低了测量对原子损失的敏感性。\n3. 该方案仅需全局操控与光子收集，易于实现，为提升中性原子量子计算的整体运行速度提供了切实可行的技术路径。", "summary_source": "deepseek", "authors": [{"name": "Yotam Vaknin"}, {"name": "Ran Finkelstein"}, {"name": "Ofer Firstenberg"}, {"name": "Alex Retzker"}], "featured_authors": [{"name": "Yotam Vaknin"}, {"name": "Ran Finkelstein"}, {"name": "Ofer Firstenberg"}, {"name": "Alex Retzker"}], "author_count": 4}, {"id": "2604.13169", "category": "quant-ph", "title": "Threshold entanglement sharing: quantum states with absolutely separable marginals", "abstract": "Motivated to understand how entanglement resources can be distributed in quantum networks, we introduce threshold entanglement (TE) states. These are multipartite quantum states whose entanglement across bipartitions forces all marginals of half or less local systems to be (absolutely) separable. First, in contrast to states used for quantum secret sharing, we demonstrate that TE states exist for four and seven qubits. Second, between four and nine qubits, we delimit the average entanglement that TE states must have by combining two semidefinite programming relaxations: (i) lower bounds on the minimal purity of pure state marginals, and (ii) upper bounds on the maximal purity of mixed absolutely separable states. Besides delimiting the existence regions of TE states, our approach independently improves the best known bounds on both of the above problems. Moreover, these improved bounds show that TE states of eight qubits cannot exist. Numerical evidence suggests that TE states accommodate significant amounts of entanglement and magic, which are resources needed for quantum advantage in quantum computing.", "url": "https://arxiv.org/abs/2604.13169", "type": "理论+数值", "summary": "1. 该论文针对量子网络中纠缠资源分配问题，引入了阈值纠缠态这一多体量子态概念，并证明了其在四与七量子比特系统中的存在性。\n2. 核心方法在于结合两种半定规划松弛：纯态边际的最小纯度下界与混合绝对可分态的最大纯度上界，从而划定了四至九量子比特系统中阈值纠缠态的平均纠缠边界。\n3. 所得改进边界不仅否定了八量子比特阈值纠缠态的存在，其数值证据更暗示这类态可能承载大量纠缠与魔法资源，为量子计算优势的实现提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Albert Rico"}, {"name": "Jofre Abellanet-Vidal"}, {"name": "Naga Bhavya Teja Kothakonda"}, {"name": "Anna Sanpera"}, {"name": "Gerard Anglès Munné"}], "featured_authors": [{"name": "Albert Rico"}, {"name": "Jofre Abellanet-Vidal"}, {"name": "Naga Bhavya Teja Kothakonda"}, {"name": "Anna Sanpera"}, {"name": "Gerard Anglès Munné"}], "author_count": 5}, {"id": "2604.13172", "category": "quant-ph", "title": "Simple slow operators and quantum thermalization", "abstract": "We establish a rigorous relation between the thermalization of typical initial states and the dynamics of local operators. We introduce a concept of simple slow operators (SSOs), defined as operators that have a small commutator with the Hamiltonian and have significant small-sized components. We show that if typical initial states (drawn from a low-complexity state ensemble) do not thermalize on timescale $t$, then SSOs must exist that are approximately conserved up to timescale $t$. Equivalently, the absence of SSOs implies that typical initial states thermalize. We establish these results by introducing the concept of an ensemble variance norm of an operator, defined as the typical magnitude of the expectation value of that operator with respect to states in the ensemble. For low-entanglement ensembles, the norm is related to operator sizes, allowing us to establish a direct link between operator growth and thermalization.", "url": "https://arxiv.org/abs/2604.13172", "type": "理论", "summary": "1. 该研究通过定义简单慢算子（SSOs）——即与哈密顿量对易子小且具有显著小尺寸分量的算子，建立了典型低复杂度初态热化与局部算子动力学之间的严格对应关系。\n2. 核心发现证明：对于低纠缠系综，典型初态在时间尺度t上的非热化等价于存在在t尺度上近似守恒的SSOs，并通过引入系综方差范数将算子增长直接关联到热化行为。\n3. 这为从算子动力学角度理解量子多体系统热化提供了普适框架，对探索非平衡量子弛豫及设计相关实验具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Tian-Hua Yang"}, {"name": "Sarang Gopalakrishnan"}, {"name": "Dmitry A. Abanin"}], "featured_authors": [{"name": "Tian-Hua Yang"}, {"name": "Sarang Gopalakrishnan"}, {"name": "Dmitry A. Abanin"}], "author_count": 3}, {"id": "2604.13435", "category": "quant-ph", "title": "SiGe/Si(111)/SiGe heterostructure for Si spin qubits with electrons confined in L valley of conduction band", "abstract": "In Si(111) crystals, a strong biaxial tensile strain applied within the (111) plane is considered to shift the lowest energy point of the conduction band from the $\\Delta$ valley to the L valley. Electrons confined in this L valley experience a splitting of their quadruply degenerate energy levels into an undegenerate single-level ground state (L1) and a triply degenerate excited state (L3). The energy of the single-level ground state is sufficiently low relative to the energies of the L3 valley and the $\\Delta$ valley, making it optimal as a two-level system for a qubit. Using deformation potential theory and incorporating quantum effects from electron confinement in the SiGe/Si(111)/SiGe structure, we determine the value of the biaxial tensile strain causing the shift of the conduction band energy minimum from the $\\Delta$ valley to the L valley, along with the corresponding Ge concentration. We also calculate the critical thickness for the plastic relaxation of the Si quantum well under this large biaxial tensile strain and examine the feasibility of realizing it as a SiGe/Si(111)/SiGe heterostructure.", "url": "https://arxiv.org/abs/2604.13435", "type": "理论", "summary": "1. 该工作利用形变势理论并结合电子限域量子效应，确定了在SiGe/Si(111)/SiGe异质结构中实现导带能谷从Δ谷向L谷转移所需双轴张应变值及对应Ge浓度，计算了相应Si量子阱的塑性弛豫临界厚度，并评估了该异质结构的可实现性。\n2. 其卖点在于，(111)面双轴张应变下L谷电子能级分裂为非简并单态基态L1和三重简并激发态L3，且L1能级显著低于L3和Δ谷，成为量子比特的理想两能级系统。\n3. 这为基于应变工程实现硅自旋量子比特提供了具体设计参数，并启发了异质结构制备与谷电子学器件的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Takafumi Tokunaga"}, {"name": "Hiromichi Nakazato"}], "featured_authors": [{"name": "Takafumi Tokunaga"}, {"name": "Hiromichi Nakazato"}], "author_count": 2}, {"id": "2604.13436", "category": "quant-ph", "title": "Coherent Rydberg excitation of single atoms using a pulsed fiber amplifier", "abstract": "In recent years, the growing scale of programmable neutral-atom arrays has led to an increasing demand for higher-power Rydberg excitation light. Although pulsed amplifiers deliver higher peak power than continuous-wave lasers, their use for efficient coherent Rydberg excitation of single atoms in arrays has been limited by challenges such as pulse distortion, synchronization with excitation sequences, and spectral linewidth broadening. Here, we address these issues using a fiber-based master-oscillator power-amplifier system. We demonstrate efficient coherent Rydberg excitation of single atoms in a rubidium atom array, achieving performance comparable to continuous-wave methods. This study provides a potentially new technical pathway toward future large-scale quantum simulation and computation with Rydberg atom arrays.", "url": "https://arxiv.org/abs/2604.13436", "type": "数值", "summary": "1. 该工作利用基于光纤的主振荡器功率放大器系统，在铷原子阵列中实现了对单原子的高效相干里德堡激发。\n2. 其技术关键在于解决了脉冲畸变、时序同步及谱线展宽等挑战，使脉冲放大性能媲美连续激光方案。\n3. 这为未来大规模里德堡原子阵列的量子模拟与计算提供了一条可行的强光激发技术路径。", "summary_source": "deepseek", "authors": [{"name": "Ying-Wen Zhang"}, {"name": "Yang Wang"}, {"name": "Chen-Long Xu"}, {"name": "Yi-Bo Wang"}, {"name": "Peng Xu"}], "featured_authors": [{"name": "Ying-Wen Zhang"}, {"name": "Yang Wang"}, {"name": "Chen-Long Xu"}, {"name": "Yi-Bo Wang"}, {"name": "Peng Xu"}], "author_count": 5}, {"id": "2604.13485", "category": "quant-ph", "title": "Attosecond Access to the Quantum Noise of Light", "abstract": "Characterizing the quantum state of intense light fields on sub-cycle timescales remains beyond the reach of existing methods. Here, we show that attosecond streaking provides direct, phase-sensitive access to the quantum properties of the driving field through delay-resolved photoelectron spectra. Using a Feynman--Vernon treatment, we decompose the influence of the quantized driving field on the photoelectron into coherent and fluctuation contributions. This yields a simple, moment-based characterization of the light state: the first moment of the photoelectron momentum distribution reveals the coherent displacement, while the second central moment captures the fluctuation contribution and, for squeezed states, exhibits a clear modulation at twice the driving frequency, directly signaling phase-sensitive quantum noise. Time-dependent Schrödinger equation simulations confirm these relations and enable retrieval of the coherent phase, the squeezing phase, and the relative strengths of the coherent and fluctuation contributions from delay-resolved spectra. Taken together, these results establish attosecond streaking as a route to sub-cycle quantum-optical metrology in the strong-field regime.", "url": "https://arxiv.org/abs/2604.13485", "type": "理论+数值", "summary": "1. 本文证明阿秒条纹技术可通过延迟分辨光电子谱直接、相位敏感地探测强驱动光场的量子特性。\n2. 采用Feynman-Vernon处理方法，将量子化光场对光电子的影响分解为相干分量与涨落分量，其二阶中心矩能直接反映压缩态特有的倍频调制特征。\n3. 这为在强场区域实现亚周期量子光学计量学提供了可行路径，并支持从实验数据中重构相干相位、压缩相位及涨落相对强度等量子光场参数。", "summary_source": "deepseek", "authors": [{"name": "En-Rui Zhou"}, {"name": "Yi-Jia Mao"}, {"name": "Pei-Lun He"}, {"name": "Feng He"}], "featured_authors": [{"name": "En-Rui Zhou"}, {"name": "Yi-Jia Mao"}, {"name": "Pei-Lun He"}, {"name": "Feng He"}], "author_count": 4}, {"id": "2604.13486", "category": "quant-ph", "title": "Taming Trotter Errors with Quantum Resources", "abstract": "Quantum simulation is a cornerstone application of quantum computing, yet how fundamental quantum resources--entanglement and non-stabilizerness (``magic\")--shape simulation fidelity remains an open question. In this work, we establish a rigorous connection between these resources and the statistical behavior of algorithmic errors arising in Hamiltonian simulation based on the Trotter-Suzuki formula. By analyzing ensembles of states with fixed entanglement entropy or magic, we make two key discoveries: First, the variance of the Trotter error decreases with increasing entanglement entropy, indicating a stronger concentration of error for entangled states. Moreover, we find that the kurtosis of the error exhibits a negative linear dependence on magic, implying that states with high magic possess lighter-tailed error distributions and thus a reduced probability of large deviations. These findings reveal a subtle phenomenon: quantum resources that obstruct classical emulation may, paradoxically, enhance the intrinsic robustness of quantum simulation, highlighting a constructive interplay between complexity and stability in quantum computation.", "url": "https://arxiv.org/abs/2604.13486", "type": "理论+数值", "summary": "1. 该工作建立了哈密顿量模拟中Trotter-Suzuki公式算法误差的统计行为与量子资源（纠缠熵与非稳定子性）之间的严格联系。\n2. 核心发现是纠缠熵增大会减小误差方差，而非稳定子性（魔法）与误差峰度的负线性关系表明高魔法态具有更轻的误差尾部。\n3. 这揭示了阻碍经典模拟的量子资源反而能增强量子模拟的内在鲁棒性，为理解量子计算中复杂度与稳定性的相互作用提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Xiangran Zhang"}, {"name": "Jue Xu"}, {"name": "Qi Zhao"}, {"name": "You Zhou"}], "featured_authors": [{"name": "Xiangran Zhang"}, {"name": "Jue Xu"}, {"name": "Qi Zhao"}, {"name": "You Zhou"}], "author_count": 4}, {"id": "2604.13541", "category": "quant-ph", "title": "Beyond the Quantum Regression Theorem in Variational Polaron Master Equations with Low-Dimensional Baths", "abstract": "While the quantum regression theorem (QRT) is the standard tool for computing multi-time correlation functions in open quantum systems, it relies on system-bath separability and an environment that remains in equilibrium, assumptions that are violated once dynamical correlations develop. Using the projection operator formalism, we derive an extension to the QRT that explicitly incorporates these correlation-induced corrections. We apply this framework to the variational polaron master equation for the spin-boson model in ohmic and super-ohmic regimes, where the polaron transformation mixes system-bath degrees of freedom to produce a non-thermal effective environment. Benchmarking against numerically exact tensor-network simulations demonstrates quantitative agreement for single- and two-time observables, including linear-response spectra, even at strong coupling. Our approach broadens the reach of analytic master equations to strong-coupling regimes, enabling treatment of multi-time observables where environmental memory effects and system-bath correlations are crucial.", "url": "https://arxiv.org/abs/2604.13541", "type": "理论+数值", "summary": "1. 本研究通过投影算子形式体系，推导了量子回归定理的扩展形式，明确纳入系统-环境关联诱导的修正，并应用于自旋-玻色子模型的变分极化子主方程。\n2. 其技术核心在于：即使系统与低维浴发生强耦合且极化子变换产生非热有效环境时，该方法计算的多时间关联函数仍与张量网络精确数值模拟定量吻合。\n3. 这为在强耦合条件下解析处理多时间观测量（如线性响应谱）提供了新途径，尤其适用于环境记忆效应和系统-浴关联至关重要的非平衡物理研究。", "summary_source": "deepseek", "authors": [{"name": "Matias Bundgaard-Nielsen"}, {"name": "Jake Iles-Smith"}], "featured_authors": [{"name": "Matias Bundgaard-Nielsen"}, {"name": "Jake Iles-Smith"}], "author_count": 2}, {"id": "2604.13632", "category": "quant-ph", "title": "A $\\boldsymbol{2d \\times d \\times d}$ Spacetime Volume Implementation of a Logical S Gate in the Surface Code", "abstract": "The logical S gate implemented via twist defect braiding in the surface code is one of the major sources of overhead in fault-tolerant quantum computing, since an S-gate correction is required in every logical T-gate teleportation. Existing logical S-gate implementations require spacetime volumes of \\(2d \\times 2d \\times d\\) or \\(2d \\times 1.5d \\times d\\), where $d$ is the code distance of the surface code. To the best of our knowledge, their circuit-level implementations have not yet been shown, hindering quantitative comparisons of fault distances and logical error rates. In this work, we provide these missing circuit-level implementations. Additionally, we propose a novel twist defect braiding protocol that reduces the spacetime volume to \\(2d \\times d \\times d\\). First, we construct an implementation of the proposed method using constant-length non-local gates, and then refine it to utilize only nearest-neighbor two-qubit gates on a square grid, without requiring additional two-qubit gate depth beyond that of standard syndrome extraction circuits. Through numerical simulations, we evaluate the fault distances and logical error rates for both existing and proposed methods. Our results show that, although the proposed method reduces the fault distance by one or three, its logical error rates remain comparable to those of existing methods at large code distances (\\(d \\ge 5\\)) and at physical error rates near \\(p = 10^{-3}\\). This demonstrates that the proposed method is promising for near-term fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2604.13632", "type": "数值", "summary": "1. 本工作在表面码中为逻辑S门提供了缺失的电路级实现，并提出了一个新的twist defect braiding协议，旨在降低容错量子计算的开销。\n2. 该协议将实现逻辑S门所需的时空体积从现有方案的 \\(2d \\times 2d \\times d\\) 或 \\(2d \\times 1.5d \\times d\\) 优化为 \\(2d \\times d \\times d\\)，并仅需在方形网格上使用最近邻两量子比特门，无需额外电路深度。\n3. 数值模拟显示，尽管新方法的错误距离略有减小，但在大代码距离和物理错误率接近 \\(p = 10^{-3}\\) 时，其逻辑错误率与现有方法相当，这表明它在近容错量子计算中具有应用潜力。", "summary_source": "deepseek", "authors": [{"name": "Yuga Hirai"}, {"name": "Shota Ikari"}, {"name": "Yosuke Ueno"}, {"name": "Yasunari Suzuki"}], "featured_authors": [{"name": "Yuga Hirai"}, {"name": "Shota Ikari"}, {"name": "Yosuke Ueno"}, {"name": "Yasunari Suzuki"}], "author_count": 4}, {"id": "2604.13704", "category": "quant-ph", "title": "Scalable framework for quantum transport across large physical networks", "abstract": "Accurately modelling many-body quantum transport systems poses a challenge both conceptually and computationally due to the growth of the Hilbert space and the multi-scale nature of the geometries and couplings present in most naturally occurring networks. A compounding complexity of such systems is that the environment typically plays a key role in the transport dynamics. Utilising variational unitary transformations that displace environmental degrees of freedom allows for the deployment of a second-order master equation capable of capturing the dynamics of intermediate and strongly coupled systems, which are ubiquitous in microscopic energy transport systems. However, direct implementations of this approach suffer from fundamental scalability issues due to the complexity of the self-consistent equations required to solve for the variational parameters. Here, we present an efficient partitioning scheme that leverages the inherent multi-scale nature of natural energy transport networks. This enables scaling of the variational polaron framework to quantum energy transport systems, constituting hundreds to thousands of sites. Our work unlocks the physically motivated exploration of large transport networks, for example, those present within light-harvesting complexes and exciton transport in disordered semiconductors.", "url": "https://arxiv.org/abs/2604.13704", "type": "理论+数值", "summary": "1. 该工作通过引入高效的分区方案，将变极化子框架扩展至包含数百至数千个位点的大型量子能量输运系统。\n2. 其核心创新在于利用天然能量输运网络固有的多尺度特性，克服了传统方法中求解自洽变分参数方程的可扩展性瓶颈。\n3. 这使得对光合作用复合体及无序半导体中激子输运等真实大型输运网络的物理探索成为可能。", "summary_source": "deepseek", "authors": [{"name": "Adam Burgess"}, {"name": "Nicholas Werren"}, {"name": "Erik M. Gauger"}], "featured_authors": [{"name": "Adam Burgess"}, {"name": "Nicholas Werren"}, {"name": "Erik M. Gauger"}], "author_count": 3}, {"id": "2604.13724", "category": "quant-ph", "title": "Manipulation of Superposed Vortex States of $γ$ Photon via Nonlinear Compton Scattering", "abstract": "Vortex $\\gamma$ photons in superposition states have important applications in photonuclear, high-energy, and strong-field physics. However, their controlled generation in the $\\gamma$-ray regime remains a great challenge. Here, we put forward a novel method for the generation of vortex $\\gamma$ photon in superposition states, with controllable orbital angular momentum (OAM) separation $\\Delta\\ell^\\prime$ and modal weights, via nonlinear Compton scattering driven by multifrequency circularly polarized laser fields. We develop a strong-field quantum electrodynamics (QED) framework to reveal the underlying mechanism and calculate the radiation probabilities. In our method, the superposition arises from interference between energy-degenerate multiphoton pathways carrying distinct OAM. For two-frequency fields, the OAM separation follows $\\Delta\\ell'=\\nu\\mp1$ (upper/lower sign for equal/opposite helicities), and modal weights are tunable by laser intensities, with $\\nu$ the frequency ratio. Vortex $\\gamma$ photons in controllable superposition states from our method have significant applications in strong-field QED and nuclear photonics.", "url": "https://arxiv.org/abs/2604.13724", "type": "理论", "summary": "1. 本文提出了一种利用多频圆偏振激光场驱动非线性康普顿散射来产生轨道角动量分离与模态权重可控的叠加态涡旋γ光子的新方法。\n2. 该方法的关键在于揭示了叠加态来源于携带不同轨道角动量的能量简并多光子路径之间的量子干涉，其中双频场可产生Δℓ'=ν∓1的轨道角动量分离。\n3. 通过调节激光频率比与强度即可精确调控叠加态的轨道角动量分离与模态权重，这为强场量子电动力学与核光子学中的精密操控提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Jun-Lin Zhou"}, {"name": "Mamutjan Ababekri"}, {"name": "Yong-Zheng Ren"}, {"name": "Yu Wang"}, {"name": "Ren-Tong Guo"}, {"name": "Zhao-Hui Chen"}, {"name": "Yu-Han Kou"}, {"name": "Zhong-Peng Li"}, {"name": "Jian-Xing Li"}], "featured_authors": [{"name": "Jun-Lin Zhou"}, {"name": "Mamutjan Ababekri"}, {"name": "Yong-Zheng Ren"}, {"name": "Yu-Han Kou"}, {"name": "Zhong-Peng Li"}, {"name": "Jian-Xing Li"}], "author_count": 9}, {"id": "2604.13735", "category": "quant-ph", "title": "Reachability Constraints in Variational Quantum Circuits: Optimization within Polynomial Group Module", "abstract": "This work identifies a necessary condition for any variational quantum approach to reach the exact ground state. Briefly, the norms of the projections of the input and the ground state onto each group module must match, implying that module weights of the solution state have to be known in advance in order to reach the exact ground state. An exemplary case is provided by matchgate circuits applied to problems whose solutions are classical bit strings, since all computational basis states share the same module-wise weights. Combined with the known classical simulability of quantum circuits for which observables lie in a small linear subspace, this implies that certain problems admit a classical surrogate for exact solution with each step taking $O(n^5)$ time. The Maximum Cut problem serves as an illustrative example.", "url": "https://arxiv.org/abs/2604.13735", "type": "理论+数值", "summary": "1. 该工作确定了变分量子电路在多项式群模中达到精确基态的必要条件。\n2. 其核心在于提出投影范数必须匹配的条件，从而为特定问题导出了时间复杂度O(n^5)的经典精确解法。\n3. 以最大割问题为例，这为理解变分量子算法在经典可解问题中的局限性提供了明确依据。", "summary_source": "deepseek", "authors": [{"name": "Yun-Tak Oh"}, {"name": "Dongsoo Lee"}, {"name": "Jungyoul Park"}, {"name": "Kyung Chul Jeong"}, {"name": "Panjin Kim"}], "featured_authors": [{"name": "Yun-Tak Oh"}, {"name": "Dongsoo Lee"}, {"name": "Jungyoul Park"}, {"name": "Kyung Chul Jeong"}, {"name": "Panjin Kim"}], "author_count": 5}, {"id": "2604.13834", "category": "quant-ph", "title": "Quantum Routing Beyond Pathfinding: Multipartite Entanglement Complementation", "abstract": "Conventional quantum routing operates under the entrenched assumption that pathfinding is a prerequisite for routing. This classical-inspired routing model imposes a restricting design option, which prevents scaling the quantumness to the network functioning. In this paper, we proposed a novel entanglement-driven routing framework that exploits multipartite entanglement complementation for enabling simultaneous 1-hop connectivity among all non-adjacent source-destination pairs. This changes the notion of ``remoteness'' in the entanglement graph, activated by entanglement. We extend this framework to inter-domain quantum networks and design a polynomial-time algorithm. Such an algorithm allows to select and parallelize multiple requests, bypassing NP-complete path discovery. Performance analysis shows the proposed routing strategy achieves up to $60\\%$ hop reduction, with the algorithm enabling efficient parallelism and strong scalability in inter-domain quantum networks.", "url": "https://arxiv.org/abs/2604.13834", "type": "理论+数值", "summary": "1. 该工作提出了一种基于多体纠缠互补的新型量子路由框架，并将其扩展至域间量子网络，设计了多项式时间算法。\n2. 其核心在于利用多体纠缠互补实现所有非相邻源-目的对间的同步单跳连接，从而绕过传统的NP完全路径发现过程。\n3. 该框架展示的显著跳数缩减与强可扩展性，为未来大规模量子网络重新定义路由范式提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Si-Yi Chen"}, {"name": "Angela Sara Cacciapuoti"}, {"name": "Marcello Caleffi"}], "featured_authors": [{"name": "Si-Yi Chen"}, {"name": "Angela Sara Cacciapuoti"}, {"name": "Marcello Caleffi"}], "author_count": 3}, {"id": "2604.13869", "category": "quant-ph", "title": "Bipartite entanglement harvesting with multiple detectors", "abstract": "We study bipartite entanglement harvesting from the quantum vacuum of a massless scalar field between two subsystems, each composed of a finite number of Unruh-DeWitt detectors. Using perturbation theory, we show that the leading-order negativity is fully determined by a submatrix of the reduced density matrix, with the submatrix dimension scaling only linearly with the number of detectors. Within this framework, we analyze how the detectors' spatial arrangement influences harvesting. For all three-detector configurations and several symmetric four-detector configurations, we derive analytic expressions for the negativity and identify the configurations that maximize it. For a linear chain, we find that the harvested entanglement scales linearly with the number of detectors. These results clarify how to arrange multiple detectors to optimize harvesting and show that increasing their number broadens the ranges of energy gaps and separations over which entanglement can be extracted from the field.", "url": "https://arxiv.org/abs/2604.13869", "type": "理论+数值", "summary": "1. 本文研究了由多个Unruh-DeWitt探测器构成的复合系统从量子真空态中提取纠缠的问题。\n2. 其核心在于利用微扰论证明，主导阶的负性仅由约化密度矩阵的一个子矩阵决定，且该子矩阵维度仅随探测器数量线性增长。\n3. 该结果为通过优化多探测器空间构型来最大化纠缠提取提供了明确指导，并揭示了增加探测器数量可拓宽从场中提取纠缠的能量间隔与空间分离参数范围。", "summary_source": "deepseek", "authors": [{"name": "Santeri Salomaa"}, {"name": "Esko Keski-Vakkuri"}, {"name": "Sergi Nadal-Gisbert"}], "featured_authors": [{"name": "Santeri Salomaa"}, {"name": "Esko Keski-Vakkuri"}, {"name": "Sergi Nadal-Gisbert"}], "author_count": 3}, {"id": "2604.13872", "category": "quant-ph", "title": "Experimental realisation of topological spin textures in a Penning trap", "abstract": "Quantum simulation with controllable many-body platforms offers a powerful route to exploring complex phases and dynamics that are difficult to access in natural materials. Among these, topological spin textures such as skyrmions are central to modern condensed-matter physics and play a key role in chiral quantum many-body systems. Their controlled realisation in large, programmable quantum platforms, however, remains an outstanding challenge. Here, we report deterministic generation and site-resolved reconstruction of topological spin textures in a two-dimensional crystal of more than 150 trapped ions. Using globally applied spin-dependent forces, we generate skyrmion configurations and reconstruct the full vector spin field with single-ion resolution, obtaining a winding number of 0.99$\\pm$0.02 and a mean local fidelity of 0.87$\\pm$0.04. In addition, we implement single-ion-resolved control to deterministically prepare domain-wall states, extending our approach to a broader class of non-uniform spin textures. These results establish trapped-ion crystals as a platform for engineering complex spin textures and open the door to exploring topology-dependent nonequilibrium dynamics in long-range interacting quantum systems.", "url": "https://arxiv.org/abs/2604.13872", "type": "实验", "summary": "1. 该工作实验实现了在Penning trap中超过150个囚禁离子组成的二维晶体内拓扑自旋纹理（如skyrmion）的确定性生成与站点分辨重建。\n2. 其技术核心在于通过全局自旋相关力产生skyrmion构型，并以单离子分辨率重构全矢量自旋场，获得高精度缠绕数（0.99±0.02）与保真度（0.87±0.04），并扩展至单离子控制制备畴壁等非均匀纹理。\n3. 这确立了囚禁离子晶体作为可编程平台用于工程复杂自旋纹理，为研究长程相互作用量子系统中拓扑依赖的非平衡动力学提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Julian Y. Z. Jee"}, {"name": "Nihar Makadia"}, {"name": "Joseph H. Pham"}, {"name": "Gustavo Café de Miranda"}, {"name": "Michael J. Biercuk"}, {"name": "Athreya Shankar"}, {"name": "Robert N. Wolf"}], "featured_authors": [{"name": "Julian Y. Z. Jee"}, {"name": "Nihar Makadia"}, {"name": "Joseph H. Pham"}, {"name": "Michael J. Biercuk"}, {"name": "Athreya Shankar"}, {"name": "Robert N. Wolf"}], "author_count": 7}, {"id": "2604.13876", "category": "quant-ph", "title": "Transient entanglement generation in driven chiral networks beyond the secular approximation", "abstract": "We study transient entanglement generation between two quantum nodes coupled through a chiral one-dimensional channel. In an emitter-only Born-Markov description, we show that continuous driving and an initial ground state can raise the maximum transient concurrence above the undriven $2/e$ benchmark associated with the effectively single-excitation model. We then consider a more microscopic XX spin-chain channel with triangular plaquette couplings and compare a nonsecular time-convolutionless master equation (TCL-ME) with matrix-product-state (MPS) simulations. In the optimal driven regime, the nonsecular TCL-2 treatment reproduces the concurrence envelope and first transient peak qualitatively, while the remaining discrepancy is mainly attributable to beyond-Born system-bath correlations. The enhancement is traced to the failure of the secular approximation under strong driving, where nearby dressed transitions are not well separated on the dissipative timescale and nonsecular terms mix dressed-state coherences. Finally, we examine within TCL-2 the sensitivity of the protocol to positional disorder, imperfect chirality, and loss into nonguided modes. These results clarify when the familiar $2/e$ limitation ceases to apply and separate the roles of secular breakdown, Born-factorization error, and reduced-state memory in driven chiral entanglement generation; we believe that our study contributes to one of the first studies where the breakdown of the secular approximation is useful rather than detrimental.", "url": "https://arxiv.org/abs/2604.13876", "type": "理论+数值", "summary": "1. 该工作研究了两个量子节点通过手性一维通道耦合的瞬态纠缠生成，对比了非旋波时间卷积less主方程与矩阵乘积态模拟。\n2. 核心发现表明强驱动下旋波近似失效导致邻近缀饰态跃迁混合，从而使瞬态共现度突破无驱动时的2/e基准，非旋波TCL-2处理能定性重现纠缠演化特征。\n3. 这明确了手性纠缠协议中旋波近似破坏、玻恩分解误差及约化态记忆效应的各自作用，为强驱动下非平衡量子网络的精确描述提供了方法论启示。", "summary_source": "deepseek", "authors": [{"name": "Yan Xi Foo"}, {"name": "Kian Hwee Lim"}, {"name": "Jia-Bin You"}, {"name": "Leong Chuan Kwek"}, {"name": "Davit Aghamalyan"}], "featured_authors": [{"name": "Yan Xi Foo"}, {"name": "Kian Hwee Lim"}, {"name": "Jia-Bin You"}, {"name": "Leong Chuan Kwek"}, {"name": "Davit Aghamalyan"}], "author_count": 5}, {"id": "2604.13894", "category": "quant-ph", "title": "Wandering range of robust quantum symmetries", "abstract": "This paper introduces the concept of the wandering range of a robust symmetry $S$ of a Hamiltonian $H$. This quantity measures how the perturbed time evolution $\\mathrm{e}^{\\mathrm{i}t(H+\\varepsilon V)} S \\mathrm{e}^{-\\mathrm{i} t(H+\\varepsilon V)}$ deviates from its unperturbed counterpart $\\mathrm{e}^{\\mathrm{i} tH} S\\mathrm{e}^{-\\mathrm{i} tH} = S$. Although the wandering range does not necessarily scale linearly with the perturbation strength $\\varepsilon$, we identify conditions under which this linear behavior is recovered and we obtain explicit nonperturbative bounds.", "url": "https://arxiv.org/abs/2604.13894", "type": "理论", "summary": "1. 该工作针对哈密顿量的鲁棒对称性，引入了“游走范围”这一新概念，以量化其在微扰下时间演化偏离未微扰情形的程度。\n2. 核心突破在于揭示了游走范围与微扰强度并非总呈线性关系，但明确给出了线性标度行为恢复的条件，并建立了显式的非微扰上界。\n3. 这一框架为精确分析对称性在动力学中的稳定性提供了普适工具，对理解对称保护拓扑相及量子信息中的耗散抑制具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Daniel Burgarth"}, {"name": "Paolo Facchi"}, {"name": "Marilena Ligabò"}, {"name": "Vito Viesti"}, {"name": "Kazuya Yuasa"}], "featured_authors": [{"name": "Daniel Burgarth"}, {"name": "Paolo Facchi"}, {"name": "Marilena Ligabò"}, {"name": "Vito Viesti"}, {"name": "Kazuya Yuasa"}], "author_count": 5}, {"id": "2604.13904", "category": "quant-ph", "title": "Optimally Controlled Storage of a Qubit in an Inhomogeneous Spin Ensemble", "abstract": "The storage of quantum information in spin-ensembles is limited by practically unavoidable inhomogeneous broadening, and the macroscopic number of spins in such an ensemble makes the design of control solutions to increase the coherence time a challenging task. Together with a concurrently developed Krylov theory that allows us to treat the control problem efficiently, we design optimal cavity modulation for such spin ensembles that achieve an order of magnitude enhancement in qubit lifetime compared to the losses due to inhomogeneity and cavity decay.", "url": "https://arxiv.org/abs/2604.13904", "type": "理论", "summary": "1. 本工作针对非均匀展宽自旋系综中的量子比特存储问题，结合高效的Krylov控制理论，设计了一种最优腔场调制方案。\n2. 其核心在于利用该理论高效处理宏观自旋系综的控制难题，使量子比特寿命相比非均匀展宽与腔损耗导致的衰减提升了一个数量级。\n3. 这一方法为克服固态自旋量子存储器中普遍存在的非均匀展宽限制提供了切实可行的控制策略，并可能推广至其他需处理大量自由度的高维量子控制场景。", "summary_source": "deepseek", "authors": [{"name": "Rahul Gupta"}, {"name": "Florian Mintert"}, {"name": "Himadri Shekhar Dhar"}], "featured_authors": [{"name": "Rahul Gupta"}, {"name": "Florian Mintert"}, {"name": "Himadri Shekhar Dhar"}], "author_count": 3}, {"id": "2604.13910", "category": "quant-ph", "title": "Tsallis relative $α$ entropy of coherence dynamics in Grover's search algorithm", "abstract": "Quantum coherence plays a central role in Grover's search algorithm. We study the Tsallis relative $\\alpha$ entropy of coherence dynamics of the evolved state in Grover's search algorithm. We prove that the Tsallis relative $\\alpha$ entropy of coherence decreases with the increase of the success probability, and derive the complementarity relations between the coherence and the success probability. We show that the operator coherence of the first $H^{\\otimes n}$ relies on the size of the database $N$, the success probability and the target states. Moreover, we illustrate the relationships between coherence and entanglement of the superposition state of targets, as well as the production and deletion of coherence in Grover iterations.", "url": "https://arxiv.org/abs/2604.13910", "type": "理论+数值", "summary": "1. 该工作研究了Grover量子搜索算法演化过程中态的Tsallis相对α熵相干性动力学。\n2. 核心发现是证明相干性随成功概率增加而减小，并推导出相干性与成功概率之间的互补关系。\n3. 这为理解量子算法中相干性与纠缠等资源间的转化机制，以及相干性的产生与擦除过程提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Linlin Ye"}, {"name": "Zhaoqi Wu"}, {"name": "Shao-Ming Fe"}], "featured_authors": [{"name": "Linlin Ye"}, {"name": "Zhaoqi Wu"}, {"name": "Shao-Ming Fe"}], "author_count": 3}, {"id": "2604.13923", "category": "quant-ph", "title": "Quantum information spreading in inhomogeneous spin ensembles", "abstract": "We present a Krylov space based theoretical framework for modeling inhomogeneous spin ensembles with arbitrary distributions of spin frequencies and couplings. The framework is then used to asymptotically large spin ensemble. In the single-excitation subspace, the Krylov construction allows for to derive exact expressions for the Lieb-Robinson velocity and quantum speed limit, and figure of merit such as Krylov complexity. Our work reveals a strong dependence of the speed of information flow on the statistical distribution of resonance frequencies in the spin ensemble with immediate implications for the design of components for quantum technologies, realized for example with nitrogen vacancy centers, nuclear spins or ultracold atoms.", "url": "https://arxiv.org/abs/2604.13923", "type": "理论", "summary": "1. 该工作提出了基于Krylov空间的理论框架，用于模拟任意频率与耦合分布的非均匀自旋系综，并在单激发子空间中推导了信息传播的精确表达式。\n2. 其技术优势在于通过Krylov构造精确给出了Lieb-Robinson速度、量子速度极限及Krylov复杂度，揭示了信息流速度对共振频率统计分布的强依赖关系。\n3. 这为利用氮空位中心、核自旋或超冷原子等平台实现量子技术组件的设计提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Rahul Gupta"}, {"name": "Florian Mintert"}, {"name": "Himadri Shekhar Dhar"}], "featured_authors": [{"name": "Rahul Gupta"}, {"name": "Florian Mintert"}, {"name": "Himadri Shekhar Dhar"}], "author_count": 3}, {"id": "2604.13943", "category": "quant-ph", "title": "A Modular and T-Gate Efficient Architecture for Quantum Leading-Zero/One Counter", "abstract": "The Quantum Leading-Zero/One Counter (QLZOC) is a fundamental component in quantum arithmetic, playing a critical role in normalization, floating-point units, dynamic range scaling, and logarithmic approximations. Conventional designs primarily rely on direct Boolean-to-quantum mapping, which results in inefficient resource utilization such as irregular gate growth and width-dependent resource overhead. In this work, we propose a scalable, modular, and resource efficient architecture for QLZOC by reformulating the counting process into a sequence of systematic conditional bit-flip operations. Moreover, our design achieves functional polymorphism so that the same design can be easily toggled between zero and one detection, while ensuring seamless scalability to any bit-width without manual re-tuning. We further introduce a Parallel QLZOC (PQLZOC) variant and a Fan-Out optimized (FO-PQLZOC) design. In this work, we evaluate resource efficiency based on the classic criteria about T gates, including the number of total T gates being used (T-count) and the number of sequential T gate layers (T-depth). By exploiting the properties of all-zero/one qubit blocks and a hierarchical merge strategy, the proposed FO-PQLZOC reduces the T-depth from O(m) to O(log m), where m is the input size. Comparative analysis demonstrates that our optimized architecture achieves a 40% reduction in T-count and a 60% reduction in T-depth over state-of-the-art designs, providing a high-performance, T-gate efficient solution for general-purpose quantum arithmetic processors.", "url": "https://arxiv.org/abs/2604.13943", "type": "理论+数值", "summary": "1. 本文提出了一种模块化、可扩展且资源高效的量子前导零/一计数器架构，通过重构计数过程为系统性条件比特翻转操作序列，并引入了并行化与扇出优化设计变体。\n2. 该架构的关键优势在于实现了功能多态性（零/一检测可切换）与无需手动调整的无缝可扩展性，并利用全零/一块特性和分层合并策略，将 T 门深度从 O(m) 降至 O(log m)。\n3. 这为通用量子算术处理器提供了高性能、低资源开销的解决方案，显著提升了浮点运算、动态范围缩放及对数近似等量子计算核心功能的效率。", "summary_source": "deepseek", "authors": [{"name": "Lei-Han Yao"}, {"name": "Shang-Wei Lin"}, {"name": "Yu-Chung Chen"}, {"name": "Yean-Ru Chen"}], "featured_authors": [{"name": "Lei-Han Yao"}, {"name": "Shang-Wei Lin"}, {"name": "Yu-Chung Chen"}, {"name": "Yean-Ru Chen"}], "author_count": 4}, {"id": "2604.13964", "category": "quant-ph", "title": "Dimensioning of Quantum Memories for Distilled Quantum EPR Packets", "abstract": "The quantum Internet envisions a network where information is transmitted through entanglement, with Einstein-Podolsky-Rosen (EPR) pairs serving as one of the fundamental carriers. In this work, we propose a framework for dimensioning quantum memories capable of storing distilled EPR pairs useful to transmitting and manage quantum error correcting codes. Using a Markov chain model, we capture the stochastic evolution of stored entangled states in quantum memories, linking memory performance to system parameters such as technology characteristics and initial entanglement fidelity. Building on this framework, we provide analytical tools and design principles for optimizing memory architectures that preserve high-fidelity entanglement over time, ensuring the availability of encoded quantum resources necessary for several operations in future quantum Internet infrastructures transmitting EPR packets.", "url": "https://arxiv.org/abs/2604.13964", "type": "理论+数值", "summary": "1. 该研究提出了一个用于确定量子存储器尺寸的理论框架，以存储蒸馏后的爱因斯坦-波多尔斯基-罗森纠缠对，支持量子纠错码的传输与管理，为未来量子互联网基础设施设计奠定基础。\n2. 其核心卖点在于采用马尔可夫链模型精确描述纠缠态在存储器中的随机演化过程，从而将存储性能与技术特性及初始纠缠保真度等系统参数定量关联，为性能优化提供机制性见解。\n3. 这为优化量子存储器架构以长期维持高保真度纠缠提供了分析工具与设计原则，确保未来基于EPR包传输的量子互联网中编码量子资源的可靠供应，推动了相关硬件与协议的发展。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo Valentini"}, {"name": "Diego Forlivesi"}, {"name": "Andrea Talarico"}, {"name": "Marco Chiani"}], "featured_authors": [{"name": "Lorenzo Valentini"}, {"name": "Diego Forlivesi"}, {"name": "Andrea Talarico"}, {"name": "Marco Chiani"}], "author_count": 4}, {"id": "2604.14015", "category": "quant-ph", "title": "The role of classical periodic orbits in quantum many-body systems", "abstract": "Semiclassical methods have been applied very successfully to describe the nontrivial transition from the quantum to the classical regime in $\\textit{single}$-particle or at least $\\textit{few}$-particle systems. Challenges on the way to an extension to $\\textit{many}$-body systems result from the exponential proliferation of the number of classical orbits in chaotic systems and the exponential growth of the quantum Hilbert-space dimension with the particle number. To circumvent these problems, we apply here our recently developed duality relation. Considering the kicked spin chain as example for a many-body system, we show how the duality relation can be used to extract the classical orbits from the quantum spectrum. For coupled cat maps, we analyze the spectral statistics of chaotic many-body systems and discuss the double limit of large semiclassical parameter and large particle number.", "url": "https://arxiv.org/abs/2604.14015", "type": "理论", "summary": "1. 该工作将半经典方法扩展至量子多体系统，通过运用对偶关系从量子谱中提取经典轨道，并以受击自旋链和耦合猫映射为例进行了分析。\n2. 其核心在于利用对偶关系规避了混沌系统中经典轨道数指数增长和希尔伯特空间维度随粒子数指数膨胀的双重挑战。\n3. 这为在大的半经典参数和大粒子数双重极限下，分析混沌多体系统的谱统计特性提供了新的理论途径。", "summary_source": "deepseek", "authors": [{"name": "Daniel Waltner"}, {"name": "Boris Gutkin"}], "featured_authors": [{"name": "Daniel Waltner"}, {"name": "Boris Gutkin"}], "author_count": 2}, {"id": "2604.14052", "category": "quant-ph", "title": "From coupled $\\mathbb{Z}_3$ Rabi models to the $\\mathbb{Z}_3$ Potts model", "abstract": "We study $\\mathbb{Z}_3$-symmetric Rabi model that describes a three-level system coupled to two bosonic modes. We derive a mapping of the two-mode $\\mathbb{Z}_3$ Rabi model onto a qubit-boson ring. This mapping allows us to formulate a realistic implementation of the $\\mathbb{Z}_3$ Rabi model based on superconducting qubits. It also provides context for the previously proposed optomechanical implementation of the $\\mathbb{Z}_3$ Rabi model. In addition, we propose a physical implementation of the $\\mathbb{Z}_3$ Potts model via a coupled chain of $\\mathbb{Z}_3$ Rabi models.", "url": "https://arxiv.org/abs/2604.14052", "type": "理论", "summary": "1. 本工作研究了描述三能级系统与双玻色模耦合的Z3对称拉比模型，并推导出其到量子比特-玻色子环的精确映射，进而提出了基于超导量子比特的实际实现方案。\n2. 该映射的核心优势在于为双模Z3拉比模型提供了可实现的量子模拟框架，不仅支撑了超导电路方案，也为此前提出的光力学实现奠定了清晰的理论背景。\n3. 通过进一步构建耦合的Z3拉比模型链，该研究为实现Z3 Potts模型这一经典统计模型开辟了可行的量子模拟路径，为探索其临界行为提供了新平台。", "summary_source": "deepseek", "authors": [{"name": "Anatoliy I. Lotkov"}, {"name": "Valerii K. Kozin"}, {"name": "Denis V. Kurlov"}, {"name": "Jelena Klinovaja"}, {"name": "Daniel Loss"}], "featured_authors": [{"name": "Anatoliy I. Lotkov"}, {"name": "Valerii K. Kozin"}, {"name": "Denis V. Kurlov"}, {"name": "Jelena Klinovaja"}, {"name": "Daniel Loss"}], "author_count": 5}, {"id": "2604.14055", "category": "quant-ph", "title": "Two-Indexed Schatten Quasi-Norms with Applications to Quantum Information Theory", "abstract": "We define 2-indexed $(q,p)$-Schatten quasi-norms for any $q,p > 0$ on operators on a tensor product of Hilbert spaces, naturally extending the norms defined by Pisier's theory of operator-valued Schatten spaces. We establish several desirable properties of these quasi-norms, such as relational consistency and the behavior on block diagonal operators, assuming that $|\\frac{1}{q} - \\frac{1}{p}| \\leq 1$. In fact, we show that this condition is essentially necessary for natural properties to hold. Furthermore, for linear maps between spaces of such quasi-norms, we introduce completely bounded quasi-norms and co-quasi-norms. We prove that the $q \\to p$ completely bounded co-quasi-norm is super-multiplicative for tensor products of quantum channels for $q \\geq p>0$, extending an influential result of [Devetak, Junge, King, Ruskai, 2006]. Our proofs rely on elementary matrix analysis and operator convexity tools and do not require operator space theory. On the applications side, we demonstrate that these quasi-norms can be used to express relevant quantum information measures such as Rényi conditional entropies for $\\alpha \\geq \\frac{1}{2}$ or the Sandwiched Rényi Umlaut information for $\\alpha < 1$. Our multiplicativity results imply a tensorizing notion of reverse hypercontractivity, additivity of the completely bounded minimum output Rényi-$\\alpha$-entropy for $\\alpha\\geq\\frac{1}{2}$ extending another important result of [Devetak, Junge, King, Ruskai, 2006], and additivity of the maximum output Rényi-$\\alpha$ entropy for $\\alpha \\geq \\frac{1}{2}$.", "url": "https://arxiv.org/abs/2604.14055", "type": "理论", "summary": "1. 该工作为希尔伯特空间张量积上的算子定义了一族双指标(q,p)-Schatten拟范数，并系统建立了其在满足|1/q-1/p|≤1条件下的基本性质，同时引入了完全有界拟范数与余拟范数。\n2. 其核心贡献在于证明了该条件对于拟范数具备自然性质近乎必要，并成功将Devetak等人关于量子信道张量积超乘性的重要结果推广至q≥p>0情形。\n3. 这为量子信息领域提供了新工具，可直接表述多种量子熵度量，并导出了反向超压缩性的张量化形式及最小输出Rényi熵在α≥1/2时的可加性。", "summary_source": "deepseek", "authors": [{"name": "Jan Kochanowski"}, {"name": "Omar Fawzi"}, {"name": "Cambyse Rouzé"}], "featured_authors": [{"name": "Jan Kochanowski"}, {"name": "Omar Fawzi"}, {"name": "Cambyse Rouzé"}], "author_count": 3}, {"id": "2604.14057", "category": "quant-ph", "title": "Distributed quantum-classical hybrid algorithm for solving K-SAT problem", "abstract": "Recently, Dunjko et al.(PRL, 2018) proposed an algorithm for accelerating the solution of 3-satisfiability problems using a small-scale quantum computer. In this paper, we design a distributed quantum-classical hybrid algorithm for solving K-satisfiability problems. Under resource-constrained conditions, our algorithm achieves a significant acceleration in the core term of the exponential time complexity. The proposed algorithm is a generalization of the algorithm by Dunjko et al. Compared with their algorithm, our algorithm requires a smaller number of qubits. More importantly, the proposed algorithm does not rely on any quantum communication.", "url": "https://arxiv.org/abs/2604.14057", "type": "数值", "summary": "1. 本文为K-可满足性问题设计了一种分布式量子-经典混合算法，在资源受限条件下显著降低了指数时间复杂度中的核心项。\n2. 该算法作为Dunjko等人工作的推广，在减少所需量子比特数目的同时，完全避免了量子通信过程。\n3. 这一进展为在近期中等规模量子设备上实现分布式组合优化问题求解提供了可行的技术路径。", "summary_source": "deepseek", "authors": [{"name": "Huaijing Huang"}, {"name": "Daowen Qiu"}, {"name": "Le Luo"}, {"name": "Paulo Mateus"}], "featured_authors": [{"name": "Huaijing Huang"}, {"name": "Daowen Qiu"}, {"name": "Le Luo"}, {"name": "Paulo Mateus"}], "author_count": 4}, {"id": "2604.14079", "category": "quant-ph", "title": "Hybrid quantum-classical algorithms for complex nonlinear partial differential equations with Ginzburg-Landau potential and vortex motion laws", "abstract": "We propose quantum algorithms for complex-valued nonlinear partial differential equations in the strongly nonlinear regime, where the dynamics is governed by vortex cores, phase singularities, and nonlinear vortex interactions. Examples include the complex-valued nonlinear Schrödinger equation, as well as nonlinear heat and wave equations with Ginzburg--Landau-type nonlinearity. In the strongly nonlinear regime, the solutions to these equations are asymptotically governed by, in leading order, linear elliptic equations, coupled with low-dimensional vortex dynamics, where the vortex cores correspond to topological defects in superconductors. Our hybrid quantum-classical algorithms utilize this asymptotic property, in which the vortex dynamic is advanced classically while the boundary-value problem of linear elliptic equation is handled by quantum algorithms. For the two-dimensional nonlinear Schrödinger equation, we also combine quantum BPX preconditioning with Schrödingerization to estimate physically relevant observables in the small-output regime. This yields, already in two dimensions, an {\\it exponential} improvement in the dependence on the spatial problem size, while the dependence on the target accuracy remains essentially linear up to polylogarithmic factors. We further show that the same principle extends to dissipative Ginzburg--Landau vortex dynamics and to vortex filaments in three-dimensional superconductivity. Numerical results support the validity of this PDE reduction and the effectiveness of the proposed approach.", "url": "https://arxiv.org/abs/2604.14079", "type": "理论+数值", "summary": "1. 该工作针对具有金兹堡-朗道势的复值非线性偏微分方程强非线性区，提出了处理涡旋核心与相奇异点动力学的混合量子-经典算法。\n2. 其核心在于利用渐近性质，将涡旋低维动力学与线性椭圆型方程的边值问题解耦，后者由量子算法高效求解，前者由经典计算推进。\n3. 这不仅为二维非线性薛定谔方程提供了对空间问题尺寸依赖关系呈指数级加速的方案，其原理亦可拓展至耗散涡旋动力学及三维超导涡丝问题。", "summary_source": "deepseek", "authors": [{"name": "Shi Jin"}, {"name": "Nana Liu"}, {"name": "Chuwen Ma"}], "featured_authors": [{"name": "Shi Jin"}, {"name": "Nana Liu"}, {"name": "Chuwen Ma"}], "author_count": 3}, {"id": "2604.14094", "category": "quant-ph", "title": "Simulating the dynamics of an SU(2) matrix model on a trapped-ion quantum computer", "abstract": "Matrix models are an important class of systems in string theory and theoretical physics, with applications to random matrix theory, quantum chaos, and black holes. Hamiltonian Monte Carlo simulations and gauge/gravity duality have been used to study these systems at thermal equilibrium, and the bootstrap program has been used to efficiently determine operator expectation values by imposing positivity constraints. However, simulating real-time, non-equilibrium dynamics remains a fundamental challenge. In this work, we present the first digital quantum simulation of a bosonic matrix model, executed on the Quantinuum System Model H2 trapped-ion quantum computer. We focus on an $\\mathrm{SU}(2)$ gauge theory with a quartic potential as it is simple enough to validate against exact classical solutions and yet complex enough to reflect the non-local structure of larger theories. Using the Loschmidt echo as our primary dynamical observable, we systematically decompose simulation errors into three distinct sources: Hilbert space truncation, Trotterization, and hardware noise. We demonstrate a new post-selection scheme that detects and discards gauge-symmetry violations in the Fock basis and show that at small scales it, along with zero-noise extrapolation, can give modest improvements in fidelity. These approaches struggle to scale to larger system sizes in their current implementations, emphasizing the need to move beyond them and to focus on depth reduction through improved compilation and unitary synthesis, and run-time error handling such as additional error suppression, error detection, as well as error correction approaches. This work establishes a foundation for extending digital quantum simulation to more complex matrix models -- revealing that fundamental challenges in qubit resources and circuit depth remain formidable obstacles for scaling to holographically interesting regimes.", "url": "https://arxiv.org/abs/2604.14094", "type": "理论+数值", "summary": "1. 该工作首次在Quantinuum H2离子阱量子计算机上实现了玻色矩阵模型的数字量子模拟，重点关注具有四次势的SU(2)规范理论，并以Loschmidt回声为主要动力学观测量。\n2. 其技术核心在于系统地将模拟误差分解为希尔伯特空间截断、Trotter化和硬件噪声三类，并提出了一种在福克基中检测并舍弃规范对称性破坏的新后选择方案。\n3. 这为扩展至更复杂矩阵模型的量子模拟奠定了基础，同时表明当前方法的可扩展性受限，要实现全息对偶有意义的尺度，必须聚焦于通过改进编译与酉合成来减少电路深度，并发展运行时错误处理技术。", "summary_source": "deepseek", "authors": [{"name": "Gavin S. Hartnett"}, {"name": "Haoran Liao"}, {"name": "Enrico Rinaldi"}], "featured_authors": [{"name": "Gavin S. Hartnett"}, {"name": "Haoran Liao"}, {"name": "Enrico Rinaldi"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
