  <title>arXiv 2026-04-16 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2604.13104", "category": "cond-mat", "title": "Nonequilibrium crossover in the supercritical region from quench dynamics", "abstract": "Distinguishing different subphases in the supercritical region is a fundamental issue in statistical physics and condensed matter physics. Traditional approaches mainly rely on static thermodynamic response functions or equilibrium correlation functions, which are inherently confined to quasi-static processes. In this work, we adopt a nonequilibrium dynamical perspective to investigate the evolution of a holographic superfluid model following a rapid quench across the critical point. We find that the invasion phenomenon induced by topological defects persists in the supercritical region, and the invasion velocity exhibits a clear turning point as a function of the quench endpoint $\\rho_f$. This turning point defines a new nonequilibrium supercritical crossover line. In contrast to the classical Widom line or Frenkel line, this new crossover line encodes both thermodynamic information and kinetic information, reflecting the dynamical nature of the supercritical region under nonequilibrium conditions. This study provides a novel nonequilibrium dynamical approach for characterizing supercritical subphases.", "url": "https://arxiv.org/abs/2604.13104", "type": "理论", "summary": "1. 该工作利用全息超流体模型，通过快速淬火动力学研究了超临界区域的非平衡演化。\n2. 其卖点在于基于拓扑缺陷入侵速度的转折点，定义了一条融合热力学与动力学信息的非平衡超临界交叉线。\n3. 这为表征超临界子相提供了一种新颖的非平衡动力学方法，对后续研究具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Zi-Qiang Zhao"}, {"name": "Zhang-Yu Nie"}, {"name": "Jing-Fei Zhang"}, {"name": "Xin Zhang"}], "featured_authors": [{"name": "Zi-Qiang Zhao"}, {"name": "Zhang-Yu Nie"}, {"name": "Jing-Fei Zhang"}, {"name": "Xin Zhang"}], "author_count": 4}, {"id": "2604.13110", "category": "cond-mat", "title": "Thermodynamic conditions ensure the stability of third-order extended heat conduction", "abstract": "In a recent work, Somogyfoki et al. (J. Non-Equilib. Thermodyn. 50, 59-76, 2025) analysed the linear stability of homogeneous equilibrium in third-order non-Fourier heat conduction within the framework of non-equilibrium thermodynamics with internal variables. They identified a stability condition, their equation (49), which could not be derived from the standard thermodynamic inequalities for the 2X2 conductivity blocks, and concluded that the Second Law does not guarantee stability in the most general case. Here we show that this conclusion was due to an overly conservative proof strategy: the standard thermodynamic conditions (concave entropy and non-negative entropy production, as expressed by the $2\\times2$ block positive-definiteness inequalities (19)-(20) of the original paper) do suffice for linear stability. The key observation is that all coefficients of the dispersion polynomial remain positive for all physical wave numbers because their structure prevents positive real roots. This result confirms that thermodynamics, understood as a stability theory, ensures fundamental dynamic stability in all thermodynamically consistent third-order extended heat conduction theories. A comparison with the rate-equation approach of Giorgi, Morro and Zullo (Meccanica 59, 1757-1776, 2024) is also presented.", "url": "https://arxiv.org/abs/2604.13110", "type": "理论", "summary": "1. 本工作在非平衡热力学内变量框架下重新分析了三阶扩展热传导中均匀平衡态的线性稳定性，证明标准热力学条件（熵凹性与熵产生非负所表达的2×2块正定不等式）足以确保稳定性，从而驳斥了先前认为第二定律不能保证最一般情况稳定性的结论。\n2. 其核心物理卖点在于揭示了色散多项式的系数结构特性：由于该结构阻止正实根的出现，所有系数对所有物理波数均保持正值，从而动态稳定性直接由热力学条件内在保证，无需额外假设。\n3. 此结果确认了热力学作为动态稳定性理论在扩展热传导中的根本性作用，为所有热力学一致的三阶理论提供了稳定性基石，并促进了与速率方程等方法的比较研究。", "summary_source": "deepseek", "authors": [{"name": "Peter Ván"}, {"name": "Réka Somogyfoki"}], "featured_authors": [{"name": "Peter Ván"}, {"name": "Réka Somogyfoki"}], "author_count": 2}, {"id": "2604.13161", "category": "cond-mat", "title": "Superconductivity near two-dimensional Van Hove singularities: a determinant quantum Monte Carlo study", "abstract": "The superconducting transition temperature $T_c$ of the two-dimensional attractive Hubbard model is computed in the vicinity of both ordinary (logarithmic) and higher-order (power-law) Van Hove singularities using determinant quantum Monte Carlo simulations. For interaction strengths $|U| \\lesssim W/3$, where $W$ is the electronic bandwidth, $T_c$ is enhanced in the neighborhood of the Van Hove point, albeit more weakly than expected from weak-coupling BCS theory. Enhancing the Van Hove singularity from logarithmic to power-law yields only a minor additional enhancement of $T_c$. For $|U| \\gtrsim W/3$, the maximum $T_c$ shifts away from the Van Hove point and instead occurs at a density unrelated to any features in the non-interacting density of states, consistent with a strong-coupling interpretation. We find that the maximal $T_c$ in the model is achieved at intermediate $U$ and at a density away from the Van Hove point.", "url": "https://arxiv.org/abs/2604.13161", "type": "理论+数值", "summary": "1. 该工作利用行列式量子蒙特卡洛模拟，计算了二维吸引哈伯德模型在普通对数型与高阶幂律型范霍夫奇点附近的超导转变温度。\n2. 核心发现是：在中等相互作用下，Tc在范霍夫点附近仅被弱增强，且增强程度弱于弱耦合BCS理论预期；在强耦合区域，最大Tc则偏离范霍夫点，与非相互作用态密度特征无关。\n3. 这一结果表明，在强关联体系中最大化Tc需在中等耦合强度并远离范霍夫填充处进行调控，为探索关联超导体的最佳性能提供了关键思路。", "summary_source": "deepseek", "authors": [{"name": "Gustav Romare"}, {"name": "Daniel Shaffer"}, {"name": "Alex Levchenko"}, {"name": "Edwin Huang"}, {"name": "Ilya Esterlis"}], "featured_authors": [{"name": "Gustav Romare"}, {"name": "Daniel Shaffer"}, {"name": "Alex Levchenko"}, {"name": "Edwin Huang"}, {"name": "Ilya Esterlis"}], "author_count": 5}, {"id": "2604.13222", "category": "cond-mat", "title": "Global Oscillations in Depinning Models with Aging", "abstract": "We propose a model that extends the standard depinning paradigm by incorporating an aging mechanism into the local pinning force. This favors oscillations between a stuck state of large pinning, and a slipping state of smaller pinning. We show that for mean field interactions between sites this mechanism can lead to the appearance of ``king avalanches\" and global instabilities, producing a global oscillatory stick-slip stress regime. We construct the phase diagram for this mean field case and identify regions of smooth dynamics, pure stick-slip, and bistability. Crucially, when considering two-dimensional systems with short-range interactions we find that states of global stress oscillation persist, but in contrast to the mean field case, no system-size avalanches appear. Instead, we observe alternating temporal intervals of larger and lower avalanche activity that correlate with the stress oscillations.", "url": "https://arxiv.org/abs/2604.13222", "type": "理论+数值", "summary": "1. 该工作通过将老化机制引入局域钉扎力，扩展了标准脱钉扎范式，并分析了该模型在平均场及二维短程相互作用下的动力学行为。\n2. 其核心发现是平均场情形下会出现\"王雪崩\"和全局振荡的粘滑应力态，而二维短程相互作用下虽维持全局应力振荡，却不再出现系统尺度雪崩。\n3. 这阐明了相互作用范围对老化脱钉扎系统集体动力学的关键调控作用，为研究无序材料中老化效应的时空演化提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "F. V. Pereyra Aponte"}, {"name": "E. A. Jagla"}], "featured_authors": [{"name": "F. V. Pereyra Aponte"}, {"name": "E. A. Jagla"}], "author_count": 2}, {"id": "2604.13266", "category": "cond-mat", "title": "Geometric Spin Degeneracy in Spin-Orbit-Free Compensated Magnets", "abstract": "Compensated magnets with vanishing net magnetization can exhibit both pronounced spin splitting and unconventional band degeneracies. In altermagnets, such degeneracies are enforced by crystal and magnetic symmetries. In compensated ferrimagnets, however, they may arise even in the absence of the corresponding symmetry protection, raising a fundamental question about the origin of spin degeneracy in spin-orbit-free magnetic systems. Here, we develop a theoretical framework for spin-orbit-free compensated magnets in which spin degeneracies are protected by geometric constraints rather than by spin symmetry. We show that zero net magnetization imposes a strong condition for the emergence of nodes formed by formally spin-degenerate bands, even when no conventional spin symmetry is present. Our analysis, applicable in the weak-interaction regime, identifies a general mechanism for spin degeneracy beyond group-theoretical protection. The framework accounts for the unconventional spin degeneracies recently reported in compensated ferrimagnets and provides a unified description of band degeneracies across a broad class of magnetic phases with negligible spin-orbit coupling.", "url": "https://arxiv.org/abs/2604.13266", "type": "理论", "summary": "1. 该研究为自旋轨道耦合可忽略的补偿磁体建立了一个理论框架，揭示了其中自旋简并由几何约束而非自旋对称性保护的新机制。\n2. 核心发现表明，净磁化强度为零的条件能强制形成形式上自旋简并的能带节点，即使体系不存在传统的自旋对称性保护。\n3. 这一几何机制超越了群论保护的范式，为统一理解包括补偿亚铁磁体在内的多种弱自旋轨道耦合磁相中的非常规能带简并提供了普适基础。", "summary_source": "deepseek", "authors": [{"name": "Seung Hun Lee"}, {"name": "Yuting Qian"}, {"name": "Xi Dai"}, {"name": "Bohm-Jung Yang"}], "featured_authors": [{"name": "Seung Hun Lee"}, {"name": "Yuting Qian"}, {"name": "Xi Dai"}, {"name": "Bohm-Jung Yang"}], "author_count": 4}, {"id": "2604.13339", "category": "cond-mat", "title": "Uncovering the role of ionic doping in hydroxyapatite: The building blocks of tooth enamel and bones", "abstract": "Hydroxyapatite (HAp) is the primary mineral component of various mineralized tissues in the human body, including bone and teeth, where it performs critical roles of structural support and load transmission. In the context of dental health, the two most crucial properties of HAp are mechanical stability, which ensures resistance to forces, and chemical stability, which preserves surface integrity in acidic environments. During early stages of human evolution, e.g. when teeth were used to crush uncooked food, mechanical stability was of paramount importance. However, with changes in diet and lifestyle, the principal origins of tooth damage and loss shifted towards bacterially mediated chemical attack, known as tooth decay, or caries. To enhance the chemical stability, ion doping has emerged as a particularly significant approach, and it lies at the focus of the present study. A Molecular Dynamics (MD) framework was developed to investigate the effects of ion doping on the chemical and mechanical stability of HAp and to identify optimal doping candidates. The framework combines conventional MD with Steered Molecular Dynamics (SMD), Thermodynamic Integration (TI) and uniaxial compression test simulations to provide comprehensive insights into the doping process. The findings revealed surface atoms as the most viable candidates for doping, as demonstrated by SMD and conventional MD simulations. Notably, TI calculations have identified magnesium ions as a better candidate among the ions considered here for enhancing the chemical stability of HAp. The results presented in this study offer valuable guidelines for synthesizing HAp-based substituent materials with properties tailored to meet the demands of modern dental applications such as implant coatings, enamel remineralization agents and restorative materials.", "url": "https://arxiv.org/abs/2604.13339", "type": "理论+数值", "summary": "1. 该工作建立了一个结合常规分子动力学、牵引分子动力学、热力学积分与单轴压缩测试的分子动力学框架，系统研究离子掺杂对羟基磷灰石化学与机械稳定性的影响。\n2. 研究通过热力学积分计算明确指出，在所考察的离子中，镁离子是增强羟基磷灰石化学稳定性的更优掺杂候选者。\n3. 这为设计化学稳定性增强的羟基磷灰石基替代材料（如种植体涂层、牙釉质再矿化剂）提供了关键的原子尺度指导。", "summary_source": "deepseek", "authors": [{"name": "Mahdi Tavakol"}, {"name": "Jinke Chang"}, {"name": "Cyril Besnard"}, {"name": "Gabriel Landini"}, {"name": "Richard M. Shelton"}, {"name": "Jin-Chong Tan"}, {"name": "Alexander M. Korsunsky"}], "featured_authors": [{"name": "Mahdi Tavakol"}, {"name": "Jinke Chang"}, {"name": "Cyril Besnard"}, {"name": "Richard M. Shelton"}, {"name": "Jin-Chong Tan"}, {"name": "Alexander M. Korsunsky"}], "author_count": 7}, {"id": "2604.13370", "category": "cond-mat", "title": "Attractive Multidimensional Condensates--Experiments", "abstract": "Experiments on attractive Bose-Einstein condensates (BECs) have unlocked many intriguing out-of-equilibrium dynamics through the interplay between matter-wave dispersion and nonlinear attractive interaction. Competition between these effects leads to fascinating phenomena such as wave collapse, modulational instability, and formation of multidimensional bright solitons. This chapter reviews experimental studies on attractive condensates, with a primary focus on alkali atoms featuring two-body contact interactions. We review recent experimental advances in optical trapping and interaction control techniques, which have enabled new studies on attractive condensates in three and also in lower dimensions. Specifically, we discuss pioneering and recent experimental observations on the dynamics and stability of attractive BECs, including the formation of bright solitons, their collisions, and excitations in quasi-one-dimensional traps. Recent observations of the elusive two-dimensional Townes solitons and vortex solitons are also discussed in this Chapter. We then highlight an experimental technique revealing the nonclassical signatures of modulational instability in an attractive condensate.", "url": "https://arxiv.org/abs/2604.13370", "type": "实验", "summary": "1. 该章系统综述了吸引性玻色-爱因斯坦凝聚体的实验研究，重点关注具有两体接触相互作用的碱原子系统中波塌缩、调制不稳定性及多维亮孤子形成等非平衡动力学。\n2. 其核心进展在于光学囚禁与相互作用调控技术的最新发展，使得在三维及低维系统中观测难以捉摸的二维Townes孤子、涡旋孤子以及调制不稳定性的非经典特征成为可能。\n3. 这为在受控冷原子平台中进一步探索多维度下的非线性动力学、孤子稳定性及其碰撞行为提供了明确的实验方法与研究方向。", "summary_source": "deepseek", "authors": [{"name": "Hikaru Tamura"}, {"name": "Chen-Lung Hung"}], "featured_authors": [{"name": "Hikaru Tamura"}, {"name": "Chen-Lung Hung"}], "author_count": 2}, {"id": "2604.13391", "category": "cond-mat", "title": "Dynamical Theory of Elastic Synchronization of Cardiomyocytes", "abstract": "We study synchronization of two cardiomyocytes mediated by elastic interactions through the substrate. Modeling each cell as an oscillating force dipole governed by a Rayleigh-type equation, we derive an effective mechanical coupling from the elastic response of the surrounding medium. Using phase reduction theory, supported by direct numerical simulations, we obtain a dynamical phase description for two cardiomyocytes that predicts geometry-dependent selection of synchronized states. Depending on the mutual orientation, the cells robustly converge to either in-phase or anti-phase beating, yielding an orientation-dependent state map with a nontrivial state boundary. The synchronization time also depends strongly on the distance and mutual orientation of the cells. These results bridge earlier energetic two-body theory and dynamical single-cell theory, and provide a dynamical framework for elastic synchronization of cardiomyocytes.", "url": "https://arxiv.org/abs/2604.13391", "type": "理论+数值", "summary": "1. 该工作发展了由基底弹性相互作用介导的两个心肌细胞同步化的动力学理论。\n2. 理论预测并证实了同步化状态的几何依赖性选择，即根据相对取向稳定收敛于同相或反相搏动，并给出了非平庸的态边界。\n3. 这为理解心肌细胞的集体动力学提供了统一的动力学框架，并可能启发对更广泛生物物理系统中弹性同步现象的研究。", "summary_source": "deepseek", "authors": [{"name": "Akinari Tomiie"}, {"name": "Nariya Uchida"}], "featured_authors": [{"name": "Akinari Tomiie"}, {"name": "Nariya Uchida"}], "author_count": 2}, {"id": "2604.13420", "category": "cond-mat", "title": "Universal Scaling of Freezing Morphodynamics in Polymer Solution Droplets", "abstract": "Freezing of complex fluids is central to a wide range of natural and technological processes, where the interplay between heat transport, solute redistribution, and interfacial deformation gives rise to complex morphologies. Unlike simple liquids, polymer solutions exhibit strongly coupled transport and rheological properties that evolve dynamically during solidification, making their freezing behavior difficult to predict. Here, we examine the freezing of polymer solution droplets spanning dilute to entangled regimes. We find that droplet morphology and freezing dynamics in viscous solutions are governed by a single dimensionless parameter, the Capillary--Lewis number, which captures the competition between viscous stresses, capillarity, and solute transport. Circularity, radial deformation, and freezing time collapse onto a master curve spanning nine orders of magnitude, revealing a transition near unity corresponding to the point at which solute diffusion can no longer relax concentration gradients ahead of the freezing interface. This collapse holds across distinct polymer chemistries within the viscous fluid regime, while deviations emerge when the material exhibits elastic-dominated response ($G' > G''$), indicating the breakdown of purely transport--capillary control. These results establish a minimal transport--mechanics framework linking solute redistribution to interfacial deformation during freezing polymer solutions.", "url": "https://arxiv.org/abs/2604.13420", "type": "理论", "summary": "1. 该工作系统研究了从稀溶液到缠结区域的聚合物溶液液滴冻结过程。\n2. 研究发现形态与动力学由毛细管-路易斯数统一描述，该参数捕捉了黏性应力、毛细效应与溶质传输的竞争。\n3. 该标度律在黏性区普适成立，而在弹性主导响应区发生偏离，为建立更完整的传输-力学耦合框架指明方向。", "summary_source": "deepseek", "authors": [{"name": "Nicolas G. Ulrich"}, {"name": "Pravin P. Aravindhan"}, {"name": "Olivia Berger"}, {"name": "Bryan S. Beckingham"}, {"name": "Jean-François Louf"}], "featured_authors": [{"name": "Nicolas G. Ulrich"}, {"name": "Pravin P. Aravindhan"}, {"name": "Olivia Berger"}, {"name": "Bryan S. Beckingham"}, {"name": "Jean-François Louf"}], "author_count": 5}, {"id": "2604.13575", "category": "cond-mat", "title": "Various phases of active matter emerging from bacteria and their implications", "abstract": "In this perspective article, we discuss bacterial populations as a model system of active matter. It allows for the exploration and characterization of various phases of active matter and brings rich implications for both physics and biology. Specifically, we focus on active gas, active liquid, active glass and active liquid crystal states observed in bacterial populations and describe how these differ from their thermal counterparts. A few future directions are also discussed that will deepen the physical interest in active matter as a new type of material, with its implications for several life phenomena observed in bacterial populations and other biological systems.", "url": "https://arxiv.org/abs/2604.13575", "type": "理论", "summary": "1. 该视角文章以细菌群体为活性物质模型系统，系统综述了其中观测到的活性气体、液体、玻璃和液晶等多种相态的表征。\n2. 其核心物理贡献在于阐明了这些活性相态与热平衡对应相之间的本质差异，突显了活性驱动导致的非平衡集体行为。\n3. 这为深入探索活性物质作为新型材料的物理特性，以及理解其与细菌群体等生物系统中生命现象的关联提供了明确研究方向。", "summary_source": "deepseek", "authors": [{"name": "Kazumasa A. Takeuchi"}, {"name": "Daiki Nishiguchi"}], "featured_authors": [{"name": "Kazumasa A. Takeuchi"}, {"name": "Daiki Nishiguchi"}], "author_count": 2}, {"id": "2604.13661", "category": "cond-mat", "title": "Exciton screening in C$_{60}$ and PTCDA complexes. TDDFT calculations with GGA and hybrid functionals", "abstract": "Photoabsorption in the low-energy region for C$_{60}$ and PTCDA molecular complexes is studied within linear response TDDFT. For the PBE, B3LYP and HSE exchange-correlation (xc) functionals the dependence of the accuracy of the exciton energy on the electron-hole separation is analyzed. Particular attention is paid to the charge-transfer (CT) excitons. The inclusion of non-local exchange using hybrid functionals increases the accuracy of calculations for short-range excitons, however, the accuracy of hybrid functionals decreases significantly for long-range excitons. Moreover, as the exciton radius approaches the \"screening length\"\\ , the simpler PBE functional gives more accurate excitonic energies than the mentioned hybrid functionals.", "url": "https://arxiv.org/abs/2604.13661", "type": "数值", "summary": "1. 该工作在线性响应含时密度泛函理论框架下，研究了C60和PTCDA分子复合物在低能区的光吸收，并分析了不同交换关联泛函对激子能级计算精度的影响。\n2. 研究揭示，对于短程激子，包含非局域交换的杂化泛函精度更高，但对长程激子特别是电荷转移激子，其精度显著下降，而简单的PBE泛函在激子半径接近“屏蔽长度”时反而更准确。\n3. 这一结果为针对不同空间尺度激子的计算泛函选择提供了明确依据，对精确模拟复杂分子体系中的电荷转移过程具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "N.L. Matsko"}, {"name": "Mahmoud A. Salem"}], "featured_authors": [{"name": "N.L. Matsko"}, {"name": "Mahmoud A. Salem"}], "author_count": 2}, {"id": "2604.13682", "category": "cond-mat", "title": "Charge waves and dynamical signatures of topological phases in Su-Schrieffer-Heeger chains", "abstract": "We investigate the emergence of charge waves and their temporal dynamics in one-dimensional Su-Schrieffer-Heeger (SSH) topological chains. Contrary to the conventional view that charge oscillations are suppressed in gapped topological systems with preserved chiral symmetry, we show that such oscillations can indeed occur. The general condition for an arbitrary oscillation period is analysed, and we find that the charge waves propagating along the chain do not depend on its topology, except at the edges, where both topological phases exhibit essential differences. In chains with inequivalent atoms within the SSH unit cell, we observe regular long-period sublattice oscillations that appear simultaneously with even-odd charge oscillations. Furthermore, we study the nonequilibrium dynamics in SSH chains. After a quench, the time evolution of the local density of states and charge occupancies exhibits clear dynamical fingerprints that distinguish topologically trivial and nontrivial phases. Our results establish that transient charge dynamics can distinguish topologically trivial and nontrivial phases in real time by detecting the presence of topologically-protected edge states.", "url": "https://arxiv.org/abs/2604.13682", "type": "理论", "summary": "1. 该工作研究了一维Su-Schrieffer-Heeger拓扑链中电荷波的出现及其时间动力学，并分析了非平衡淬火后的演化。\n2. 研究揭示了在保持手征对称性的拓扑系统中，电荷振荡仍可发生，其沿链传播不依赖体拓扑性，但边缘行为呈现拓扑相间的本质差异，且淬火后局域态密度与占据数演化提供清晰的动力学指纹。\n3. 这些结果表明，通过探测瞬态电荷动力学，尤其是受拓扑保护的边缘态响应，可在实时中区分拓扑平庸与非平庸相，为拓扑物态的动力学表征提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Tomasz Kwapinski"}, {"name": "Marcin Kurzyna"}, {"name": "Luis E. F. Foa Torres"}], "featured_authors": [{"name": "Tomasz Kwapinski"}, {"name": "Marcin Kurzyna"}, {"name": "Luis E. F. Foa Torres"}], "author_count": 3}, {"id": "2604.13790", "category": "cond-mat", "title": "Spatial deformation of a ferromagnetic elastic rod", "abstract": "Ferromagnetic elastic slender structures offer the potential for large actuation displacements under modest external magnetic fields, due to the magneto-mechanical coupling. This paper investigates the phase portraits of the Hamiltonian governing the three-dimensional deformation of inextensible ferromagnetic elastic rods subjected to combined terminal tension and twisting moment in the presence of a longitudinal magnetic field. The total energy functional is formulated by combining the Kirchhoff elastic strain energy with micromagnetic energy contributions appropriate to soft and hard ferromagnetic materials: magnetostatic (demagnetization) energy for the former, and exchange and Zeeman energies for the latter. Exploiting the circular cross-sectional symmetry and the integrable structure of the governing equations, conserved Casimir invariants are identified and the Hamiltonian is reduced to a single-degree-of-freedom system in the Euler polar angle. Analysis of the resulting phase portraits reveals that purely elastic and hard ferromagnetic rods undergo a supercritical Hamiltonian Hopf pitchfork bifurcation, whereas soft ferromagnetic rods exhibit this bifurcation only within a restricted range of the magnetoelastic parameter, $0<\\tilde{K}_{dM}<1/8$. Both helical and localized post-buckling configurations are analyzed, and the corresponding load-deformation relationships are systematically characterized across a range of loading scenarios. Localized buckling modes, corresponding to homoclinic orbits in the Hamiltonian phase space, are constructed numerically. In contrast to the purely elastic case, the localized configurations of soft ferromagnetic rods exhibit non-collinear extended straight segments, a geometrically distinctive feature arising directly from the magnetoelastic coupling.", "url": "https://arxiv.org/abs/2604.13790", "type": "理论+数值", "summary": "1. 本文研究了不可伸长铁磁弹性细杆在纵向磁场及端部拉-扭复合载荷下的三维变形，通过分析哈密顿量的相图揭示了系统的分岔行为。\n2. 关键发现在于软、硬铁磁材料表现出不同的分岔特性：纯弹性与硬磁杆均发生超临界哈密顿霍普夫叉形分岔，而软磁杆仅当磁弹性参数满足0<Ķ_dM<1/8时出现该分岔。\n3. 研究首次通过同宿轨道构造出具有非共线伸直特征段的局部屈曲模态，这一几何构型直接源于磁弹性耦合，为可编程磁控软体结构的定向设计提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "G. R. Krishna Chand Avatar"}, {"name": "Vivekanand Dabade"}], "featured_authors": [{"name": "G. R. Krishna Chand Avatar"}, {"name": "Vivekanand Dabade"}], "author_count": 2}, {"id": "2604.13811", "category": "cond-mat", "title": "Phonon drag as a mechanism of delayed terahertz response of metals", "abstract": "We show that electron drag by nonequilibrium phonons describes the actual waveform and spectrum of terahertz pulses generated during femtosecond laser irradiation of metals. In contrast to previous models, there is a picosecond delay in the drag force development due to the relatively slow lattice heating and finite phonon lifetime. We also predict that, at high pump fluences, a macroscopic deformation wave enhances nonlinearly the drag force and terahertz response. Our results establish the terahertz pulse waveform as a direct probe of ultrafast lattice dynamics in metals.", "url": "https://arxiv.org/abs/2604.13811", "type": "理论", "summary": "1. 该工作通过非平衡声子对电子的拖曳效应，解释了飞秒激光辐照金属产生太赫兹脉冲的实际波形与频谱。\n2. 研究揭示了皮秒量级的拖曳力延迟源于晶格加热较慢与有限声子寿命，并预测高泵浦通量下宏观形变波会非线性增强太赫兹响应。\n3. 这将太赫兹脉冲波形确立为探测金属中超快晶格动力学的直接手段，为相关超快过程研究提供了新范式。", "summary_source": "deepseek", "authors": [{"name": "Ivan Oladyshkin"}], "featured_authors": [{"name": "Ivan Oladyshkin"}], "author_count": 1}, {"id": "2604.13843", "category": "cond-mat", "title": "On phase separation and crystallization of Ge-rich GeSbTe alloys from atomistic simulations with a machine learning interatomic potential", "abstract": "We developed a machine learning interatomic potential (MLIP) for Ge-rich GeSbTe alloys of interest for applications in phase change memories embedded in microcontrollers. The MLIP was generated by fitting with a neural network method a large database of energies and forces computed within density functional theory of elemental, binary, stoichiometric and non-stoichiometric ternary alloys in the Ge-Sb-Te phase diagram. The MLIP is demonstrated to be highly transferable to large regions of the phase diagram around the compositions included in the dataset. The MLIP is then exploited to simulate the crystallization with phase separation of three Ge-rich alloys on the Ge-Sb$_2$Te$_3$ and Ge- Ge$_2$Sb$_2$Te$_5$ tie-lines that correspond to the set process of the memory cell. The transformation on the ns time scale and at 600 K, comparable to the operation conditions of the memory, yields crystalline cubic GeTe slightly Sb-doped and amorphous GeSb and Ge. These metastable phases differ from the thermodynamically stable products and form due to kinetics effects on the short time span of the set operation in phase change memories.", "url": "https://arxiv.org/abs/2604.13843", "type": "理论+数值", "summary": "1. 本研究针对微控制器嵌入式相变存储器应用，开发了富锗锗锑碲合金的机器学习原子间势，并模拟了其相分离与结晶过程。\n2. 该势函数通过拟合密度泛函理论计算的大规模数据库获得，在相图宽广范围内具有高迁移性，首次在纳秒级操作条件下揭示了动力学主导的亚稳态相形成机制。\n3. 这项工作为相变存储器材料的多尺度模拟提供了可靠工具，并表明非平衡动力学效应在器件操作中起关键作用，有助于指导后续材料设计与性能优化。", "summary_source": "deepseek", "authors": [{"name": "Omar Abou El Kheir"}, {"name": "Dario Baratella"}, {"name": "Marco Bernasconi"}], "featured_authors": [{"name": "Omar Abou El Kheir"}, {"name": "Dario Baratella"}, {"name": "Marco Bernasconi"}], "author_count": 3}, {"id": "2604.13885", "category": "cond-mat", "title": "Role of volatility mixing in wealth condensation transition", "abstract": "We study the role of heterogeneous volatility in a networked wealth dynamics model and its impact on the wealth condensation transition. Extending the Bouchaud--M{é}zard framework, we introduce binary volatility in networks and investigate how its configuration affects the effective power-law tail exponent of the wealth distribution. Using a stochastic block model, we control the mixing between volatility groups and show that the effective exponent is governed not only by the global parameter $\\Lambda=2J/\\beta^2$ but also by the volatility configuration in the network. We find that local interactions between nodes with different volatility induce a neutralization of group-wise exponents, which lowers the aggregate tail exponent and can drive a condensation transition across $\\gamma_{\\rm c}=2$. Our results identify volatility mixing as another control mechanism for wealth condensation and highlight the importance of noise heterogeneity in nonequilibrium systems on networks.", "url": "https://arxiv.org/abs/2604.13885", "type": "理论", "summary": "1. 该工作通过在网络化财富动力学模型中引入二元波动率异质性，研究了其对财富凝聚转变的影响。\n2. 核心发现是，不同波动率节点间的局部相互作用会导致群组间幂律指数的中和效应，从而降低总体尾指数并可能驱动凝聚转变。\n3. 这确立了波动率混合作为财富凝聚的又一控制机制，为网络非平衡系统中噪声异质性的研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Jaeseok Hur"}, {"name": "Meesoon Ha"}, {"name": "Hawoong Jeong"}], "featured_authors": [{"name": "Jaeseok Hur"}, {"name": "Meesoon Ha"}, {"name": "Hawoong Jeong"}], "author_count": 3}, {"id": "2604.13936", "category": "cond-mat", "title": "Topological markers for a one-dimensional fermionic chain coupled to a single-mode cavity", "abstract": "We study a Su-Schrieffer-Heeger chain coupled to a single mode photonic cavity. Considering an off-resonant regime we use the high-frequency expansion in order to obtain an effective fermionic Hamiltonian with cavity-mediated interactions. We characterize the effects of the cavity on topology in a finite size chain by studying three different markers adapted for interacting systems: correlation functions between edges in a chain with open boundary conditions, and a winding number based on the single-particle Green's function and bulk electric polarization via the many-body formula by Resta for a chain with periodic boundary conditions. There is excellent agreement between the winding number and polarization approaches to compute the phase diagram, with the presence of the edge states being confirmed through the calculations of the two-point correlation function. Our approach provides an alternative perspective on cavity-modified topological phases through a study of an effective interacting electronic Hamiltonian and complements methods that treat the full light-matter Hamiltonian directly.", "url": "https://arxiv.org/abs/2604.13936", "type": "理论+数值", "summary": "1. 本文研究了与单模光腔耦合的Su-Schrieffer-Heeger链，通过高频展开获得非共振区下的有效电子相互作用哈密顿量，并采用多种拓扑标记表征有限尺寸系统中腔对拓扑相的影响。\n2. 技术核心在于同时运用了适用于相互作用体系的三种拓扑诊断：开边界下的边缘关联函数、基于单粒子格林函数的绕数以及利用Resta公式计算的多体电极化，且绕数与极化方法在相图判定上高度一致。\n3. 这一通过有效模型进行的研究，为理解光腔修饰的拓扑物相提供了一个替代性理论视角，是对直接处理全光-物质哈密顿量方法的有力补充。", "summary_source": "deepseek", "authors": [{"name": "Anna Ritz-Zwilling"}, {"name": "Olesia Dmytruk"}], "featured_authors": [{"name": "Anna Ritz-Zwilling"}, {"name": "Olesia Dmytruk"}], "author_count": 2}, {"id": "2604.13958", "category": "cond-mat", "title": "Continuous correlated states and dual-flatness in a moiré heterostructure", "abstract": "Many-body effects in condensed matter yield novel quantum states when the electronic density of states is enhanced. A vivid example is flat bands, which suppress kinetic energy and let interactions dominate, when they are filled with an integer number of electrons in moire systems. Yet flat bands and commensurate fillings are not the only conditions for correlated phenomena. Situations may occur where the band structure develops locally enhanced density of states, leading to strong correlations even at non-integer fillings, although such cases often yield pseudogaps that make detection elusive. Here we demonstrate that small-angle twisted monolayer-bilayer graphene combines moire-induced global flat band and additional local band flattening. Their coexistence allows direct comparison of correlated effects. The global route stabilizes commensurate states, while the local mechanism produces nearly flat bands, lifting degeneracy and generating symmetry breaking at non-integer fillings, yet without opening a global gap. Because there is no global gapped signature, the system remains metallic, but the effect reveals itself in anomalous Hall responses, signaling time-reversal symmetry breaking and valley polarization. Our results demonstrate dual-flatness as a guiding principle, extending moire physics beyond commensurate fillings and identifying topological transport as a probe of gapless correlated metals.", "url": "https://arxiv.org/abs/2604.13958", "type": "理论", "summary": "1. 该工作通过实验在小角度扭曲单层-双层石墨烯中实现了全局平带与局域平带并存的\"双平带\"结构，并直接对比了二者产生的关联效应。\n2. 核心发现在于局域平带机制能在非整数填充下引发简并解除和对称性破缺，但无需打开全局能隙，系统保持金属性并通过反常霍尔效应等拓扑输运特征显现。\n3. 这为超越整数填充的摩尔体系研究提供了新范式，并确立拓扑输运作为探测无能隙关联金属的有效探针。", "summary_source": "deepseek", "authors": [{"name": "Mohammed M. Al Ezzi"}, {"name": "Na Xin"}, {"name": "Yanmeng Shi"}, {"name": "Shuigang Xu"}, {"name": "Julien Barrier"}, {"name": "Alexey Berdyugin"}, {"name": "Shubhadeep Bhattacharjee"}, {"name": "Angelika Knothe"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Vladimir Falko"}, {"name": "Giovanni Vignale"}, {"name": "Andre K. Geim"}, {"name": "Shaffique Adam"}, {"name": "Kostya S. Novoselov"}, {"name": "Minsoo Kim"}], "featured_authors": [{"name": "Mohammed M. Al Ezzi"}, {"name": "Na Xin"}, {"name": "Yanmeng Shi"}, {"name": "Shaffique Adam"}, {"name": "Kostya S. Novoselov"}, {"name": "Minsoo Kim"}], "author_count": 16}, {"id": "2604.14045", "category": "cond-mat", "title": "Strong Correlation Drives Zero-Field Josephson Diode Effect", "abstract": "The supercurrent diode effect (SDE), characterized by unequal critical currents in opposite directions, has been observed with or without magnetic fields, yet mechanisms enabling zero-field SDE without explicit symmetry breaking remain underexplored. Here we investigate a Josephson junction with strong electron-electron interaction modeled by a Hubbard $U$ term and an odd number of electrons. We find that strong correlations induce spontaneous breaking of time-reversal and mirror symmetries, forming a $\\varphi$-junction with degenerate energy minima at $\\pm\\varphi$, resulting in zero-field Josephson diode effect (JDE) without magnetic order. Spin-orbit coupling breaks SU(2) symmetry but does not determine diode polarity, contrasting with magneto-chiral mechanisms. We further show that applying a tiny Zeeman field enables controllable JDE with sizable efficiency due to the enhancement by the strong magnetic correlation, and the JDE strength peaks when the field induces a level-crossing transition. These findings establish strong electron correlation as a distinct mechanism for nonreciprocal superconducting transport, broadening the understanding of SDE origins.", "url": "https://arxiv.org/abs/2604.14045", "type": "理论", "summary": "1. 该工作研究了具有强电子关联与奇数电子的约瑟夫森结，发现其可在零磁场下实现非互易超导输运。\n2. 其核心在于强关联诱导了时间反演与镜面对称的自发破缺，形成具有±φ简并基态的φ结，从而产生零场二极管效应。\n3. 这确立了强关联作为一种独立于磁有序的新机制，为探索非互易超导现象及其调控开辟了新的理论路径。", "summary_source": "deepseek", "authors": [{"name": "Yiheng Sun"}, {"name": "Zhenyu Zhang"}, {"name": "James Jun He"}], "featured_authors": [{"name": "Yiheng Sun"}, {"name": "Zhenyu Zhang"}, {"name": "James Jun He"}], "author_count": 3}, {"id": "2604.14056", "category": "cond-mat", "title": "Specific heat of thermally driven chains", "abstract": "We investigate the thermal responses of a harmonic oscillator chain coupled at its boundaries to heat baths held at different temperatures. This setup sustains a steady energy flux, continuously dissipating heat into both reservoirs. By introducing slow variations in the bath temperatures, we quantify the resulting excess heat currents and thereby obtain the nonequilibrium heat capacity matrix at fixed but arbitrary temperature differences. We demonstrate the existence of a well-defined thermodynamic limit for long chains. The specific heat associated with energy exchanges with a single bath depends on the difference in friction coefficients governing the system-bath couplings. That thermokinetic effect is typical for nonequilibrium response. When the couplings with the thermal baths acquire temperature dependence, the specific heat correspondingly inherits a nontrivial temperature dependence, in sharp contrast with equilibrium. Our results provide the first explicit determination of specific heat(s) in a locally interacting, spatially extended driven system. Beyond its exact solvability, the model may offer a natural nonequilibrium extension of the Dulong-Petit law, capturing the high-temperature behavior of driven molecules.", "url": "https://arxiv.org/abs/2604.14056", "type": "理论", "summary": "1. 该工作通过研究边界耦合于不同温度热浴的谐振子链，首次明确给出了局域相互作用、空间延展的驱动系统中比热的显式表达式。\n2. 核心发现表明，非平衡比热依赖于系统-热浴耦合的摩擦系数差异，并在温度依赖耦合下获得非平庸的温度依赖性，与平衡态形成鲜明对比。\n3. 该模型为杜隆-珀蒂定律提供了自然的非平衡推广，有望用于理解高温下受驱分子的热响应行为。", "summary_source": "deepseek", "authors": [{"name": "Michiel Gautama"}, {"name": "Faezeh Khodabandehlou"}, {"name": "Christian Maes"}, {"name": "Ion Santra"}], "featured_authors": [{"name": "Michiel Gautama"}, {"name": "Faezeh Khodabandehlou"}, {"name": "Christian Maes"}, {"name": "Ion Santra"}], "author_count": 4}, {"id": "2604.14078", "category": "cond-mat", "title": "Natural Language Embeddings of Synthesis and Testing conditions Enhance Glass Dissolution Prediction", "abstract": "Long-term chemical durability of glass, crucial for immobilizing nuclear waste, is governed by glass properties such as composition, surface geometry, as well as external factors like thermodynamic conditions and surrounding medium. Despite decades of research, there are no models that account for these intrinsic and extrinsic factors to predict the dissolution rates of glass compositions. To address this challenge, we evaluate the role of natural language embeddings capturing the synthesis and testing conditions in enhancing the predictability of glass dissolution. Evaluating the approach on hand-curated ~700 datapoints extracted from the literature, we reveal that the machine learning (ML) model including natural language embeddings (NLP-ML) outperforms classical ML model in predicting glass dissolution rate. Furthermore, we developed a generalizable ML model by transforming the compositional features to structural descriptors of glass alongside NLP-derived features, enabling extrapolation capability to glass compositions with completely new elements absent in the training data. Evaluating this model on a completely new dataset of glass compositions 34 chemical components in contrast to the training dataset that had only 28 components, we demonstrate that the model indeed exhibits generalizability to glass compositions that are out-of-distribution. Altogether, this integrated approach offers a pathway towards high-fidelity glass dissolution prediction and accelerate the discovery of novel glass compositions with tailored durability for sustainable nuclear waste management.", "url": "https://arxiv.org/abs/2604.14078", "type": "理论+数值", "summary": "1. 本研究开发了一个融合自然语言嵌入与结构描述符的机器学习模型，用于预测复杂玻璃体系在多变合成与测试条件下的溶解速率。\n2. 其核心进展在于将描述实验条件的文本转化为特征向量，并结合玻璃成分的结构化描述，使模型能够泛化至训练数据中未出现过的新化学元素组成。\n3. 这为核废料固化玻璃的高通量设计与耐久性精准预测提供了可扩展的计算框架，有望加速面向可持续核能管理的新材料发现。", "summary_source": "deepseek", "authors": [{"name": "Sajid Mannan"}, {"name": "K. Sidharth Nambudiripad"}, {"name": "Indrajeet Mandal"}, {"name": "Nitya Nand Gosvami"}, {"name": "N. M. Anoop Krishnan"}], "featured_authors": [{"name": "Sajid Mannan"}, {"name": "K. Sidharth Nambudiripad"}, {"name": "Indrajeet Mandal"}, {"name": "Nitya Nand Gosvami"}, {"name": "N. M. Anoop Krishnan"}], "author_count": 5}, {"id": "2604.14109", "category": "cond-mat", "title": "A Unified Glassy Rheology for Granular Matter", "abstract": "Granular flows are ubiquitous in nature and industrial applications, yet a complete continuum theory remains a long-standing challenge. The leading empirical approach, {\\mu}(I) rheology, lacks microscopic foundations and becomes multivalued in dense, slowly sheared flows where nonlocal corrections are required. Exploiting state-of-the-art high-speed X-ray tomography to investigate microscopic dynamics of dense granular flows in a Couette geometry, we establish a new, universal constitutive law spanning quasi-static to inertial regimes based on structural relaxation, resolving the fundamental difficulty in the original {\\mu}(I) framework. By further establishing a non-equilibrium statistical framework for granular flows, we demonstrate an intrinsic analogy between driven granular matter and hard-sphere liquids owing to their identical Carnahan-Starling equation of state, naturally explaining our rheological approach and the emergence of glassy behaviors. Our framework unifies granular rheology with the broader physics of disordered systems and provides a complete, microscopically-based theoretical framework for dense granular flow.", "url": "https://arxiv.org/abs/2604.14109", "type": "理论", "summary": "1. 该工作利用前沿高速X射线层析技术，在Couette几何中系统研究致密颗粒流的微观动力学，建立了一个基于结构弛豫、统一描述准静态至惯性区流变行为的本构定律。\n2. 其核心创新在于构建了颗粒流的非平衡统计框架，揭示因共享Carnahan-Starling状态方程，驱动颗粒物质与硬球液体存在本质类比，这自然导出了玻璃态流变学并解决了μ(I)框架的根本缺陷。\n3. 这一框架将颗粒流变学无缝整合到无序系统物理中，提供了从微观机制出发的完整理论体系，为未来致密颗粒流动及相关软物质研究开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Zhikun Zeng"}, {"name": "Jiazhao Xu"}, {"name": "Hanyu Li"}, {"name": "Shiang Zhang"}, {"name": "Houfei Yuan"}, {"name": "Chijin Zhou"}, {"name": "Xueliang Dai"}, {"name": "Haiyang Lu"}, {"name": "Xin Wang"}, {"name": "Jun Zhao"}, {"name": "Yonglun Jiang"}, {"name": "Zhuan Ge"}, {"name": "Gang Huang"}, {"name": "Chengjie Xia"}, {"name": "Jianqi Sun"}, {"name": "Yan Xi"}, {"name": "Yujie Wang"}], "featured_authors": [{"name": "Zhikun Zeng"}, {"name": "Jiazhao Xu"}, {"name": "Hanyu Li"}, {"name": "Jianqi Sun"}, {"name": "Yan Xi"}, {"name": "Yujie Wang"}], "author_count": 17}, {"id": "2604.14143", "category": "cond-mat", "title": "Quantum matter is weakly entangled at low energies", "abstract": "We construct upper bounds on entanglement entropies of many-body quantum states that have fixed energy expectation values with respect to geometrically local Hamiltonians. Our focus is on entanglement entropies of subsystems that make up approximately half of the full system. The upper bound on the von Neumann entanglement entropy is half the sum of the thermal entropies of two fictitious systems at the same temperature as one another, with an additional area-law contribution in some systems. The effective temperature is chosen such that the sum of the thermal energies of the two fictitious systems matches the constraint on the energy of the state in the original problem; at subextensive energies, this temperature decreases with increasing system size. Our upper bounds on Rényi entanglement entropies take an analogous form. As a first application we show that ground-state Schmidt ranks in frustration-free (FF) systems are upper bounded by the ground-state degeneracies of Hamiltonians acting on subsystems. Ground-state von Neumann and Rényi entanglement entropies therefore follow an area law when the zero-temperature thermal entropies of subsystems scale with surface areas, rather than with subsystem volumes. This result holds independently of the spectral gap. For physical models of quantum matter, which have well-defined specific heat capacities (and are not necessarily FF), our bounds provide a way to convert this thermodynamic data into constraints on pure-state entanglement at both subextensive and extensive energies. We also show that our upper bounds on half-system entanglement entropies are optimal, up to subleading corrections, in wide varieties of systems. Our results relate physical thermodynamic properties to the structure of many-body Hilbert space at low energies.", "url": "https://arxiv.org/abs/2604.14143", "type": "理论", "summary": "1. 该工作构建了局域哈密顿量下固定能量期望值的多体量子态的纠缠熵上界。\n2. 其上界形式将纠缠熵与两个虚构热系统的熵相联系，从而将比热等热力学数据转化为对纯态纠缠的约束。\n3. 这揭示了低能下多体希尔伯特空间结构与系统宏观热力学性质之间的深刻关联。", "summary_source": "deepseek", "authors": [{"name": "Samuel J. Garratt"}, {"name": "Dmitry A. Abanin"}], "featured_authors": [{"name": "Samuel J. Garratt"}, {"name": "Dmitry A. Abanin"}], "author_count": 2}, {"id": "2604.14146", "category": "cond-mat", "title": "Topological anisotropic non-Fermi liquid from a Berry-dipole semimetal", "abstract": "Investigating the interplay among topology and electron-electron interactions is an intriguing research quest which has recently gathered steam across the community of condensed-matter physics. In the present work, we study the fate of a three-dimensional Berry-dipole semimetal, lying at the topological quantum critical point separating a Hopf insulator from a trivial insulator, in the presence of long-range Coulomb interactions. Utilizing large-$N_f$ analysis at three spatial dimensions and an $\\epsilon$-expansion within the renormalization-group scheme, we uncover the emergence of a spatially \\textit{anisotropic} non-Fermi liquid with enhanced Berry-dipole moment. We further derive the corresponding scaling relations of certain physical observables as functions of the probed energy and temperature scale, and we provide a simple observational criterion for distinguishing the onset of the topological anisotropic non-Fermi liquid from a Berry-dipole semimetal.", "url": "https://arxiv.org/abs/2604.14146", "type": "理论", "summary": "1. 该工作研究了三维Berry偶极半金属在长程库仑相互作用下的演化，揭示了其演化为一种新型非费米液体的过程。\n2. 通过大Nf分析与重整化群ε展开，发现体系涌现出具有空间各向异性且Berry偶极矩增强的非费米液体态。\n3. 所推导的物理观测量标度关系及区分判据，为在拓扑量子临界体系中探测此类各向异性非费米液体提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Konstantinos Ladovrechis"}], "featured_authors": [{"name": "Konstantinos Ladovrechis"}], "author_count": 1}, {"id": "2604.13163", "category": "hep-th", "title": "Covariant phase space approach to noncommutativity in tensile and tensionless open strings", "abstract": "We study noncommutativity in open strings using the covariant phase space formalism. For tensile open strings in a constant Kalb-Ramond background, we show that the (pre)-symplectic current splits into a bulk kinetic term plus an exact boundary term, recovering the Seiberg-Witten noncommutativity parameter. We then extend the analysis to intrinsically tensionless strings. In the absence of background fields, the reduced phase space is degenerate and carries no intrinsic Poisson structure. In the presence of a constant Kalb-Ramond field, the symplectic current localises entirely on the boundary, so that the physical phase space becomes purely boundary-supported and the endpoint coordinates acquire a noncommutative Poisson algebra. Including a boundary gauge-field coupling similarly leads to a boundary symplectic form governed by the effective Born-Infeld combination on the D-brane. Our results provide a unified description of noncommutativity in both tensile and tensionless open strings.", "url": "https://arxiv.org/abs/2604.13163", "type": "理论", "summary": "1. 该工作将协变相空间形式应用于张性及无张力开弦，系统研究了背景Kalb-Ramond场下的非对易性。\n2. 其核心发现是：张性弦的（预）辛流形分解为体项加边界项，而无张力弦的辛结构完全局域于边界，导致端点坐标呈现非对易泊松代数。\n3. 这为统一理解不同张力弦的非对易几何起源及D膜有效理论提供了相空间几何视角的理论基础。", "summary_source": "deepseek", "authors": [{"name": "Pratik K. Das"}, {"name": "Sarthak Duary"}, {"name": "Sourav Maji"}], "featured_authors": [{"name": "Pratik K. Das"}, {"name": "Sarthak Duary"}, {"name": "Sourav Maji"}], "author_count": 3}, {"id": "2604.13237", "category": "hep-th", "title": "Dynamical Casimir effect in the worldline formulation", "abstract": "We evaluate the effective action for the Dynamical Casimir Effect (DCE) for a real scalar field in d+1 dimensions within the worldline formulation of quantum field theory. The scalar field is coupled to a spacetime-dependent mass term, which here plays the role of the moving medium and imposes imperfect boundary conditions on time-dependent surfaces. Expanding in powers of the departure of the geometry from a planar configuration, the worldline path integral factorizes into simpler, lower-dimensional ones. In the limit of a strong coupling to the surface, we recover the Dirichlet result and derive the systematic corrections in inverse powers of the coupling. Finally, we also apply the method to a two-surface configuration.", "url": "https://arxiv.org/abs/2604.13237", "type": "理论", "summary": "1. 该研究采用世界线形式论计算了(d+1)维实标量场的动态卡西米尔效应有效作用量，其中时空依赖的质量项扮演了运动介质角色。\n2. 通过将几何构型偏离平面展开，世界线路径积分可分解为更简单的低维积分，并在强耦合极限下恢复了狄利克雷结果及系统的耦合常数幂次修正。\n3. 该方法可推广至双曲面构型，为研究更复杂的时变边界量子场论问题提供了系统微扰框架。", "summary_source": "deepseek", "authors": [{"name": "C.D. Fosco"}, {"name": "B.C. Guntsche"}], "featured_authors": [{"name": "C.D. Fosco"}, {"name": "B.C. Guntsche"}], "author_count": 2}, {"id": "2604.13261", "category": "hep-th", "title": "Structural Obstruction to Replica Symmetry Breaking for Multi-Entropy in Random Tensor Networks", "abstract": "We study replica symmetry breaking (RSB) for multi-entropy in the random-tensor-network (RTN) domain-wall spin model. Our main result is that, within this framework, multi-entropy does not exhibit RSB for any Rényi index~$n$ and any multipartite number~$\\mathtt{q}$. The origin of this no-RSB property is structural: the boundary permutations relevant to multi-entropy are organized along mutually incompatible coordinate directions of the replica hypercube, and therefore do not admit a nontrivial common geodesic intermediate permutation~$\\tau$ in the Cayley graph of~$S_N$. This is in sharp contrast to entanglement negativity, which does admit such a $\\tau$-mediated saddle and exhibits RSB in the same framework. As a robustness check, we also consider a toy $\\mathbb{Z}_2$ gauge extension of the spin model with a minimal bulk gauge constraint. Numerical evidence in this gauged model indicates that multi-entropy continues to show no sign of RSB at $n=2$ and $n=3$, while negativity continues to exhibit RSB. Our results show that, within the RTN spin-model description, multi-entropy is not ``RSB-friendly'': its boundary data are structurally incompatible with a nontrivial common geodesic intermediate permutation, unlike negativity.", "url": "https://arxiv.org/abs/2604.13261", "type": "理论", "summary": "1. 本工作研究了随机张量网络畴壁自旋模型中多熵的副本对称破缺性质，证明在该框架下多熵对任意Rényi指数n和任意多部分数q均不出现副本对称破缺。\n2. 其核心物理机制在于：多熵对应的边界置换排列在副本超立方体的坐标方向上互斥，导致其在S_N的Cayley图中不存在非平凡的公共测地线中间置换τ，这与纠缠负性形成鲜明对比。\n3. 这一结构性的不兼容性表明，在随机张量网络自旋模型描述中，多熵本质上不具备“副本对称破缺友好”特性，为理解不同纠缠度量在无序系统中的相变行为提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Sriram Akella"}, {"name": "Norihiro Iizuka"}], "featured_authors": [{"name": "Sriram Akella"}, {"name": "Norihiro Iizuka"}], "author_count": 2}, {"id": "2604.13358", "category": "hep-th", "title": "Atiyah--Singer Index Theorem for Non-Hermitian Dirac Operators", "abstract": "If an operator $H$ anticommutes with a chirality operator $\\Gamma_*$ such that $\\Gamma_*^2=1$, the null space of $H$ can be decomposed in a direct sum of two spaces having positive and negative chiralities, respectively. When both spaces are finite dimensional, one can define an index, $\\mathrm{Ind}(\\Gamma_*,H)$, as the difference of dimensions of these two spaces. The key issue is whether $\\mathrm{Ind}(\\Gamma_*,H)$ is topologically protected, i.e., whether it remains constant under smooth variations of the parameters and background fields entering $H$. For Hermitian Dirac operators, topological protection of the index is guaranteed by the Atiyah--Singer theorem. In this paper, by using the heat kernel methods, we show that $\\mathrm{Ind}(\\Gamma_*,H)$ is topologically protected also for non-hermitian operators $H$ as long as they are diagonalizable and satisfy some ellipticity conditions.", "url": "https://arxiv.org/abs/2604.13358", "type": "理论", "summary": "1. 该工作将Atiyah-Singer指数定理推广至满足可对角化与椭圆性条件的非厄米狄拉克算子，证明了其手征指数的拓扑不变性。\n2. 核心在于运用热核方法，严谨论证了在非厄米情形下，指数在参数与背景场的连续形变中依然保持恒定。\n3. 这一结果为非厄米拓扑物态的理论刻画及相应数学结构的进一步研究奠定了坚实基础。", "summary_source": "deepseek", "authors": [{"name": "João Pedro Breveglieri da Silva"}, {"name": "Dmitri Vassilevich"}], "featured_authors": [{"name": "João Pedro Breveglieri da Silva"}, {"name": "Dmitri Vassilevich"}], "author_count": 2}, {"id": "2604.13362", "category": "hep-th", "title": "Quasi-Local Celestial Charges and Multipoles", "abstract": "We extend Penrose's quasi-local mass definition to include higher-spin charges associated with the celestial $Lw_{1+\\infty}$ symmetries and relate them to traditional definitions of multipoles. The resulting formulae provide explicit expressions that can be computed on finite 2-surfaces, given a choice of null hypersurface. They yield a geometric definition of celestial symmetries and multipoles in generic spacetimes in terms of higher-valence solutions to the twistor equations. This, in turn, gives rise to natural flux-balance laws along the null hypersurface. We also present a first-principles phase-space derivation of these charges, starting from a twistor space action for self-dual gravity that can be identified with the standard gravitational asymptotic phase space at null infinity, performing a large gauge transformation analysis and using the Penrose transform to connect with the corresponding spacetime expressions. Finally, we formulate the spacetime analysis in the Plebanski gauge and relate the celestial symmetries to the integrability of self-dual gravity in the case of a self-dual background.", "url": "https://arxiv.org/abs/2604.13362", "type": "理论", "summary": "1. 该工作将彭罗斯的准局部质量定义推广至高自旋的天球 $Lw_{1+\\infty}$ 对称性相关荷，并将其与传统多极矩定义相联系。\n2. 关键创新在于利用扭量方程的高价解，在一般时空中为天球对称性与多极矩提供几何定义，并导出零超曲面上的自然通量平衡律。\n3. 这为从扭量空间作用量出发的第一性原理相空间推导提供了基础，并将天球对称性与自对偶引力背景的可积性联系起来。", "summary_source": "deepseek", "authors": [{"name": "Adam Kmec"}, {"name": "Lionel Mason"}, {"name": "Romain Ruzziconi"}], "featured_authors": [{"name": "Adam Kmec"}, {"name": "Lionel Mason"}, {"name": "Romain Ruzziconi"}], "author_count": 3}, {"id": "2604.13464", "category": "hep-th", "title": "Four-loop Anomalous Dimensions of Scalar-QED Theory from Operator Product Expansion", "abstract": "We apply the Operator Product Expansion (OPE) algorithm to the renormalization of scalar-QED theory, with a specific focus on the fixed-charge operator $\\phi^Q$. Within the OPE framework, the anomalous dimension of the $\\phi^Q$ operator is perturbatively computed to four-loop order in the modified minimal subtraction scheme, extending beyond the previously available three-loop result. The beta functions, as well as the mass and field anomalous dimensions, are also computed at this order. An alternative loop-integrand construction method is proposed, based on graph decomposition and skeleton expansion techniques, for deriving the integrands of one-Particle-Irreducible correlation functions. This work represents the first non-trivial validation of the OPE algorithm for higher-loop renormalization beyond pure scalar theories. The present successful computations further confirm the efficiency and versatility of the OPE algorithm in renormalization analysis.", "url": "https://arxiv.org/abs/2604.13464", "type": "理论", "summary": "1. 该工作将算符乘积展开算法应用于标量QED理论的重整化，重点计算了固定电荷算符φ^Q在四圈图阶的反常量纲，并一并给出了同阶的β函数、质量与场反常量纲。\n2. 其技术核心在于提出了一种基于图分解与骨架展开的单粒子不可约关联函数被积式构造方法，从而系统性地实现了超越此前三圈结果的微扰计算。\n3. 此研究首次在非纯标量理论中完成了OPE算法应用于高阶圈图重整化的非平凡验证，为该算法在更广泛量子场论模型中的推广和应用奠定了可靠基础。", "summary_source": "deepseek", "authors": [{"name": "Rijun Huang"}, {"name": "Qingjun Jin"}, {"name": "Yi Li"}], "featured_authors": [{"name": "Rijun Huang"}, {"name": "Qingjun Jin"}, {"name": "Yi Li"}], "author_count": 3}, {"id": "2604.13636", "category": "hep-th", "title": "Euler-Heisenberg actions in higher dimensions", "abstract": "We extend Schwinger's proper-time formalism to provide a method for computing the one-loop effective action for both spinor and scalar quantum electrodynamics in $d=2n>4$ dimensions. The closed form expression for the six-dimensional Euler-Heisenberg action is given, along with a subsequent analysis of pair production in $d$ dimensions. In the $d=6$ case, we present a composite conformal primary field of dimension $+6$ which determines the contribution of the electromagnetic field to the Weyl anomaly in curved space.", "url": "https://arxiv.org/abs/2604.13636", "type": "理论", "summary": "1. 该工作将 Schwinger 原时形式拓展至更高维时空，计算了 d=2n>4 维旋量与标量量子电动力学的一圈有效作用量，并给出了六维欧拉-海森堡作用量的闭式表达式。\n2. 其核心进展在于导出了六维情形的具体结果，并构造了一个维度为+6的复合共形主场，该场决定了弯曲时空中电磁场对共形反常的贡献。\n3. 这为研究更高维度下的对产生机制、共形反常结构以及弯曲时空中的非微扰量子电动力学现象提供了新的理论框架与计算基础。", "summary_source": "deepseek", "authors": [{"name": "Terry Hatzis"}, {"name": "Sergei M. Kuzenko"}], "featured_authors": [{"name": "Terry Hatzis"}, {"name": "Sergei M. Kuzenko"}], "author_count": 2}, {"id": "2604.13646", "category": "hep-th", "title": "Self-dual classical higher-spin multicopy", "abstract": "We show that the self-dual classical double copy can be straightforwardly extended to the higher-spin case when formulated in terms of light-cone gauge prepotentials. This allows us to construct a higher-spin extension for any self-dual spacetime that admits Kerr-Schild form. We also discuss the counterpart of this procedure at the level of Weyl tensors. We find that depending on the class of the original gravitational background higher-spin Weyl tensors may follow various multicopy patterns.", "url": "https://arxiv.org/abs/2604.13646", "type": "理论", "summary": "1. 该工作将基于光锥规范预势的自对偶经典双重复制方法拓展至高自旋情形。\n2. 这一拓展使得能够从任何具有Kerr-Schild形式的自对偶时空构造出相应的高自旋扩展解。\n3. 该研究进一步揭示了高自旋外尔张量可能呈现的多重复制模式，为研究高自旋引力与规范理论的对应关系提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Nikita Misuna"}, {"name": "Dmitry Ponomarev"}, {"name": "Alexander Solomin"}], "featured_authors": [{"name": "Nikita Misuna"}, {"name": "Dmitry Ponomarev"}, {"name": "Alexander Solomin"}], "author_count": 3}, {"id": "2604.13810", "category": "hep-th", "title": "Towards New Hidden Zero and $2$-Split of Loop-Level Feynman Integrands in ${\\rm Tr}(ϕ^3)$ Model", "abstract": "We extend the hidden zeros and $2$-split of tree-level ${\\rm Tr}(\\phi^3)$ amplitudes to loop-level Feynman integrands, apart from some physically irrelevant scaleless integrals. Our method is based on a certain factorization mechanism that occurs in Feynman diagrams when summing over shuffle permutations. The loop-level hidden zeros and $2$-split identified in this work differ from those in the literature. In our result, the kinematic conditions for loop-level hidden zeros and $2$-split are remarkably simple. Their connection is as tight as at tree-level, with the same procedure for obtaining the $2$-split condition from the zero condition. The resulting $2$-split formula at loop-level represents a generalization of that at tree-level: the $L$-loop integrand is expressed as a sum over $L+1$ terms, each of which exhibits a $2$-split structure.", "url": "https://arxiv.org/abs/2604.13810", "type": "理论", "summary": "1. 该工作将树层级Tr(φ^3)振幅的隐藏零点与2-分割结构推广至环层级的费曼积分，排除了无物理意义的无标度积分。\n2. 其核心在于基于费曼图中对洗牌置换求和的特定因子化机制，发现了与文献不同的、运动学条件极其简单的环层级隐藏零点与2-分割，且两者关系与树层级同样紧密。\n3. 由此得到的环层级2-分割公式——将L圈被积表达为具有2-分割结构的L+1项之和——为研究更广泛量子场论中的类似递归与因子化结构提供了新的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Kang Zhou"}], "featured_authors": [{"name": "Kang Zhou"}], "author_count": 1}, {"id": "2604.13975", "category": "hep-th", "title": "Universal analytic dependence of the stress-energy tensor at thermodynamic equilibrium in curved space-time", "abstract": "The mean value of the stress-energy tensor of a given quantum field theory at global thermodynamic equilibrium in a curved space-time can be expressed in terms of the derivatives of the Killing four-temperature field and the derivatives of the metric tensor. Its asymptotic expansion about zero includes an analytic part made of integer powers of these derivatives - corresponding to the so-called gradient expansion - as well as non-perturbative corrections. By using available exact solutions for the free real massless scalar field, we show that in the case of Minkowski, de Sitter, anti-de Sitter, and closed Einstein universe, the analytic part - obtained through the procedure of analytic distillation - has a finite number of terms and it is the same once expressed in a covariant form. On the other hand, non-universal terms are non-analytic in these derivatives and correspond to boundary conditions or to specific global properties of the space-time. We argue that the universality of the analytic part extends to any quantum field theory on a curved background.", "url": "https://arxiv.org/abs/2604.13975", "type": "理论", "summary": "1. 本研究通过自由无质量标量场的精确解，分析了弯曲时空全局热平衡下应力-能量张量均值展开中的解析部分。\n2. 核心发现在于，闵氏、德西特、反德西特及闭合爱因斯坦宇宙中的解析部分具有有限项协变形式，且展现跨背景的普适性。\n3. 这一普适性有望推广至任意弯曲背景上的量子场论，为局域热平衡态的非平衡输运研究提供了新的理论工具。", "summary_source": "deepseek", "authors": [{"name": "F. Becattini"}, {"name": "F. Palli"}], "featured_authors": [{"name": "F. Becattini"}, {"name": "F. Palli"}], "author_count": 2}, {"id": "2604.14011", "category": "hep-th", "title": "Properties of black holes in non-linear electrodynamics", "abstract": "We investigate the properties of charged black hole geometries in nonlinear electrodynamics. We focus on the recently reported analytic charged black hole solutions to illustrate the consequences of a non-monotonic lapse function that exists for a wide range of black hole solutions. The spacetime admits stable light-rings, static near-horizon observers, and trapped near horizon photon orbits. We also show that although these modifications near the horizon are screened from afar, they nonetheless lead to additional branches of quasinormal modes for the black hole that are longer lived than the canonical Einstein branches.", "url": "https://arxiv.org/abs/2604.14011", "type": "理论", "summary": "1. 该研究系统考察了非线性电动力学框架下的带电黑洞几何性质，聚焦于具有非单调拉普函数的新解析解。\n2. 核心发现在于，此类解普遍允许稳定的光环、静态近视界观测者以及被困的近视界光子轨道，并由此激发出一支比标准爱因斯坦分支寿命更长的准正模新分支。\n3. 这些虽在远观中被屏蔽的近视界修正，为通过引力波天文学探测黑洞微观结构及检验强场引力理论提供了新的理论途径。", "summary_source": "deepseek", "authors": [{"name": "Lewis Croney"}, {"name": "Ruth Gregory"}, {"name": "Ansh Gupta"}, {"name": "Carlos J. Ramírez-Valdez"}], "featured_authors": [{"name": "Lewis Croney"}, {"name": "Ruth Gregory"}, {"name": "Ansh Gupta"}, {"name": "Carlos J. Ramírez-Valdez"}], "author_count": 4}, {"id": "2604.14046", "category": "hep-th", "title": "Universality of merons in non-Abelian gauge theories", "abstract": "Within the wide variety of topological solitons supported by Yang--Mills theory, merons occupy a particularly distinguished role. Despite their simplicity, they represent genuinely non-Abelian configurations that can be regarded as the fundamental building blocks of instantons, and they provide a qualitatively accurate picture of confinement. In this work, we show that such configurations are, in fact, supported by a broad class of non-Abelian gauge theories beyond Yang--Mills, provided that suitable physical conditions are satisfied, thereby rendering them universal. Taking into account their gravitational backreaction, we further demonstrate that both black holes and Euclidean wormholes sourced by merons admit natural extensions within this generalized framework, which regularizes the singular behavior they exhibit in constant--curvature backgrounds. As a byproduct, we construct a regular black hole solution supported by genuinely non-Abelian gauge fields, based on a non-Abelian generalization of the Ayón--Beato--García nonlinear electrodynamics. As a consequence of this universality, physical effects intrinsic to merons are likewise expected to be universal. A notable example is the spin from isospin effect, whereby bosonic excitations charged under the gauge group can effectively behave as fermionic degrees of freedom.", "url": "https://arxiv.org/abs/2604.14046", "type": "理论", "summary": "1. 该工作证明了半子解在一大类满足特定物理条件的非阿贝尔规范理论中普遍存在，并研究了其引力背反应下的黑洞与欧几里得虫洞解。\n2. 核心在于揭示了半子在广义框架中的普遍性，并基于非线性电动力学的非阿贝尔推广，构建了由真非阿贝尔规范场支撑的正则黑洞解。\n3. 这预示着半子固有的物理效应（如同位旋产生的自旋效应）可能具有普适性，为拓扑孤子及相关引力现象的研究提供了新方向。", "summary_source": "deepseek", "authors": [{"name": "Borja Diez"}, {"name": "Luis Guajardo"}], "featured_authors": [{"name": "Borja Diez"}, {"name": "Luis Guajardo"}], "author_count": 2}, {"id": "2604.14103", "category": "hep-th", "title": "Chiral Fermion Localization in Two-Kink Scalar Backgrounds: Tunable Brane Positioning and Universal Divergence at the Single-Kink Limit", "abstract": "The localization of chiral fermionic zero modes in scalar field backgrounds with domain wall structure is a central mechanism in brane-world scenarios. We investigate this mechanism in a system that provides an effective realization of the $(1+1)$-dimensional Jackiw--Rebbi model, using a two-kink scalar background generated by the deformation method applied to the $\\varphi^4$ model. The two-kink profile introduces two physically distinct parameters: an asymmetry parameter $a_2$ controlling the left-right symmetry of the scalar background, and an inter-kink separation parameter $b$ controlling the distance between the constituent domain walls. We establish two independent scaling laws. First, the collective center-of-mass position of the chiral zero modes responds linearly to $a_2$, providing a mechanism for continuously tuning the effective brane position in the extra dimension. Second, the differential spatial separation between the two chiral modes diverges as the two-kink background collapses into a simple kink, following a power law in $(b-1)$ with exponent statistically consistent with $-1$. These two results are physically independent and each admits a precise interpretation in the language of brane-world scenarios. The mechanism is realized concretely in bilayer graphene under an asymmetric two-kink electrostatic potential, providing a tunable platform for probing extra-dimensional localization physics.", "url": "https://arxiv.org/abs/2604.14103", "type": "理论", "summary": "1. 本文研究了在变形φ⁴模型生成的双扭结标量背景中手征费米子零模的局域化机制，建立了两个独立的标度律。\n2. 通过调节不对称参数a₂，手征零模的集体质心位置呈线性响应，实现了额外维中膜位置的可调谐；同时双模空间分离度在单扭结极限下依(b-1)⁻¹幂律发散。\n3. 双层石墨烯中非对称双扭结静电势的具体实现，为探索额外维局域化物理提供了可调谐实验平台。", "summary_source": "deepseek", "authors": [{"name": "H. P. Pinheiro"}, {"name": "C. A. S. Almeida"}], "featured_authors": [{"name": "H. P. Pinheiro"}, {"name": "C. A. S. Almeida"}], "author_count": 2}, {"id": "2604.14112", "category": "hep-th", "title": "Gravitational Sommerfeld Effects: Formalism, Renormalization, and Perturbation to $O(G^{10})$", "abstract": "In the effective field theory (EFT) description of binary inspirals, the radiated gravitational waveform receives universal corrections from the curved background, the ``tail effects'', that resum into the so-called ``Sommerfeld factor''. We develop a systematic framework for computing this gravitational Sommerfeld factor for scalar perturbations with the presence of tidal effects on the system. Using the worldline EFT, we recast the diagrammatic resummation as a solution to the $d$-dimensional wave equation with a localized source, and derive a closed-form expression for the Sommerfeld factor in terms of the EFT connection matrix. We prove that the phase of the Sommerfeld factor is exactly the same as elastic Compton scattering phase shift when there is no tidal dissipation. By combining the renormalization techniques in EFT with the Mano--Suzuki--Takasugi method in black hole perturbation theory, we analytically solve the Sommerfeld factor for both the magnitude and phase to $O(G^{10})$ for the $\\ell = 0, 1, 2$ partial waves. We further establish a new renormalization group equation for the radiative multipole moments, whose exact solution yields an improved resummation of the waveform beyond the universal tail logarithms. These high-precision data and exact relations pave the way for future resummation models of the waveform.", "url": "https://arxiv.org/abs/2604.14112", "type": "理论", "summary": "1. 本文在描述双星旋进的有效场论框架内，为包含潮汐效应的标量扰动建立了计算引力索末菲因子的系统框架。\n2. 通过结合世界线有效场论中的重整化技术与黑洞微扰理论中的MST方法，该工作解析求解了至$O(G^{10})$阶的索末菲因子幅度与相位，并建立了辐射多极矩的新重整化群方程。\n3. 所获得的高阶精度数据与精确关系，为发展超越普适尾部对数项的波形重求和模型奠定了关键基础。", "summary_source": "deepseek", "authors": [{"name": "Chih-Hao Chang"}, {"name": "Chia-Hsien Shen"}, {"name": "Zihan Zhou"}], "featured_authors": [{"name": "Chih-Hao Chang"}, {"name": "Chia-Hsien Shen"}, {"name": "Zihan Zhou"}], "author_count": 3}, {"id": "2604.14131", "category": "hep-th", "title": "Emergence of Time Semicrystals in Holographic Driven-Dissipative Systems", "abstract": "Understanding how temporal order degrades in quantum systems remains a central issue in nonequilibrium physics. Here we study the melting of discrete time crystals in a periodically driven holographic system, where a distinct (discrete) time semicrystal phase emerges with persistent temporal order in disorder, bridging discrete time crystals and fully disordered regimes. This phase exhibits a periodic skeleton, with discrete subharmonic peaks persisting atop a continuous spectrum. We extract a critical scaling behavior across the discrete time crystal to time semicrystal transition. Furthermore, even dynamical transitions between distinct periodic skeletons can be clearly identified with systematic log-periodic corrections to power-law scaling, revealing discrete scale invariance. These findings in holography significantly enrich the platforms for studying nonequilibrium phases of matter.", "url": "https://arxiv.org/abs/2604.14131", "type": "理论", "summary": "1. 该工作通过全息对偶研究了周期驱动耗散系统中离散时间晶体的融化过程，并发现了一种具有残留时间序的离散时间半晶体相。\n2. 其核心在于揭示了该相具有周期性骨架结构，即在连续谱上保留离散次谐波峰，并观测到时间晶体至时间半晶体转变的临界标度行为及幂律标度中的对数周期修正。\n3. 这为在强耦合耗散量子系统中探索非平衡物态及其动态相变提供了新的理论框架和可观测特征。", "summary_source": "deepseek", "authors": [{"name": "Yu-Qi Lei"}, {"name": "Xian-Hui Ge"}, {"name": "Yu Tian"}, {"name": "Shao-Feng Wu"}], "featured_authors": [{"name": "Yu-Qi Lei"}, {"name": "Xian-Hui Ge"}, {"name": "Yu Tian"}, {"name": "Shao-Feng Wu"}], "author_count": 4}, {"id": "2604.14134", "category": "hep-th", "title": "All-order structure of static gravitational interactions and the seventh post-Newtonian potential", "abstract": "We present a closed formula for the computation of static post-Newtonian corrections to the two-body gravitational dynamics at any odd order, assuming the lower-order results are known. The formula is derived within a correlation function framework and exploits the $\\mathbb{Z}_2$ symmetry of the static sector, leading to a novel theoretical interpretation of the factorization theorem. As an application, we compute the gravitational interaction of two compact coalescing objects at the seventh post-Newtonian order in the static limit, which receives contributions from seven-loop graphs at order $\\mathcal{O}(G_N^8 v^0)$, and find complete agreement with the results obtained using the diagrammatic approach of the factorization theorem.", "url": "https://arxiv.org/abs/2604.14134", "type": "理论", "summary": "1. 该工作提出了一个计算任意奇数阶静态后牛顿修正的闭合公式，并以此计算了两致密天体并合在七阶后牛顿近似下的静态引力势。\n2. 其理论框架基于关联函数并利用了静态扇区的 $\\mathbb{Z}_2$ 对称性，从而对因子化定理给出了新的理论诠释，且在七阶($\\mathcal{O}(G_N^8 v^0)$)与费曼图方法结果完全一致。\n3. 这一系统性方法为高阶后牛顿计算提供了高效框架，并可能推动对引力动力学因子化性质更深入的理解。", "summary_source": "deepseek", "authors": [{"name": "Giacomo Brunello"}, {"name": "Manoj K. Mandal"}, {"name": "Pierpaolo Mastrolia"}, {"name": "Raj Patil"}, {"name": "Matteo Pegorin"}, {"name": "Sid Smith"}, {"name": "Jan Steinhoff"}], "featured_authors": [{"name": "Giacomo Brunello"}, {"name": "Manoj K. Mandal"}, {"name": "Pierpaolo Mastrolia"}, {"name": "Matteo Pegorin"}, {"name": "Sid Smith"}, {"name": "Jan Steinhoff"}], "author_count": 7}, {"id": "2604.13196", "category": "math-ph", "title": "Deferred Cyclotomic Representation for Stable and Exact Evaluation of q-Hypergeometric Series", "abstract": "We introduce a cyclotomic representation for finite $q$-hypergeometric series and $q$-deformed amplitudes that separates algebraic structure from evaluation. By expressing each summand in a sparse exponent basis over irreducible cyclotomic polynomials, all products and ratios of quantum factorials reduce to integer vector arithmetic. This ensures that cancellations between numerator and denominator are resolved exactly prior to any evaluation. This formulation yields the deferred cyclotomic representation (DCR), a parameter-independent combinatorial object of the series, from which evaluation in any target field is realized as a ring homomorphism. For quantum recoupling coefficients, we demonstrate that this framework achieves line
