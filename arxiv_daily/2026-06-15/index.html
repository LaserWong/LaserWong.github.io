<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-06-15 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

  <script>
    const papers = [{"id": "2606.13721", "category": "cond-mat", "title": "Controlling Defects and Probing Dynamics in Active Nematics with Deep Reinforcement Learning", "abstract": "Topological defects govern much of the flow behavior and orientational order in active nematics, making their control relevant for active matter physics, smart materials, and microfluidics. Applied activity patterns can induce self-propulsion of active nematic defects, but general-purpose methods for exploiting this effect to control defects remain largely unexplored. Here we use deep reinforcement learning (RL) to perform minimum-time position control of +1/2 defects in hybrid lattice Boltzmann simulations of active nematodynamics. Spatiotemporally patterned activity, implemented as a control field in the active stress, steers defects through microchannel geometries and reveals finite-time reachable regions of defect position space. Reachability is shaped by director anisotropy, homeotropic wall anchoring, and the allowed activity patterns: local patterns steer defects in free domains but fail in junctions, whereas global patterns open otherwise inaccessible channels. In constrained geometries, the original defect may be unable to reach some goals intact, but controlled pair creation enlarges the effective reachable set by transferring control to a newly created +1/2 defect. The trained RL controllers outperform static and rule-based baselines, and controllers trained only on simple junctions can be combined without fine-tuning into a meta-controller that successfully steers defects through a larger test maze. Free energy visualizations show that guided defects write persistent, history-dependent distortions into the director field that can later be partially erased by -1/2 defects. Thus, RL-based control uncovers how confinement, anchoring, actuation geometry, and defect creation determine reachable motion in active nematics, providing a framework for other control tasks in soft and active matter.", "url": "https://arxiv.org/abs/2606.13721", "type": "理论+数值", "summary": "1. 该工作利用深度强化学习在混合格子玻尔兹曼模拟中实现活性向列相+1/2拓扑缺陷的最短时间位置控制。\n2. 其核心在于通过时空图案化活性应力场驱动缺陷，并揭示约束几何、各向异性锚定及全局/局部驱动模式对缺陷可达运动空间的塑造作用。\n3. 这为软物质与活性物质中依赖缺陷操控的功能性场致重构与路径规划提供了可迁移的强化学习控制框架。", "summary_source": "deepseek", "authors": [{"name": "Russ Islam"}, {"name": "Kyogo Kawaguchi"}, {"name": "Yuto Ashida"}], "featured_authors": [{"name": "Russ Islam"}, {"name": "Kyogo Kawaguchi"}, {"name": "Yuto Ashida"}], "author_count": 3}, {"id": "2606.13830", "category": "cond-mat", "title": "A Collective-Spin Derivation of the Uniform Magnon Hamiltonian in Cavity Magnonics", "abstract": "We present a direct collective-spin derivation of the effective uniform-mode Hamiltonian used in cavity magnonics. Starting from a nearest-neighbor Heisenberg ferromagnet coupled to long-wavelength magnetic fields, we show that the relevant dynamics can be restricted to the fully symmetric spin sector, where the exchange interaction contributes only a constant energy shift and the ferromagnet behaves as a macrospin of length $Ns$. Applying the Holstein--Primakoff transformation directly to this total spin yields the usual uniform magnon mode and its leading nonlinear corrections without first introducing site-resolved bosonic operators. This collective formulation makes explicit the interpretation of the ferromagnet as a synthetic large-spin atom and provides a compact route to the effective Hamiltonians used in driven and Floquet cavity magnonics. As a physical consequence, the leading nonlinear correction produces an occupation-dependent reduction of the effective magnon--photon coupling, providing a simple signature of finite-spin saturation under strong uniform-mode driving.", "url": "https://arxiv.org/abs/2606.13830", "type": "理论+数值", "summary": "1. 该工作从最近邻海森堡铁磁体与长波磁场耦合出发，通过限制在全对称自旋扇区并直接对总自旋应用Holstein-Primakoff变换，推导了腔磁子学中均匀磁振子有效哈密顿量及其领头非线性修正。\n2. 其卖点在于无需引入位点分辨玻色子算符，直接基于集体自旋框架揭示铁磁体作为合成大自旋原子的物理图像，并为驱动和Floquet腔磁子学提供了紧凑的有效哈密顿量推导路径。\n3. 该工作预言占据数依赖的有效磁振子-光子耦合降低效应，为强均匀模式驱动下有限自旋饱和的探测提供了明确可观测特征，并有望启发非平衡腔磁子系统非线性动力学的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Tomas Aguiar"}, {"name": "Marcos Cesar de Oliveira"}], "featured_authors": [{"name": "Tomas Aguiar"}, {"name": "Marcos Cesar de Oliveira"}], "author_count": 2}, {"id": "2606.13833", "category": "cond-mat", "title": "Machine-learned dynamics of surface polarons at reduced oxide surfaces", "abstract": "Reducible oxides exhibit a rich interplay of electronic, structural, and chemical properties that underpins applications in catalysis, photovoltaics, batteries, and energy storage. This interplay is strongly shaped by excess electrons, often introduced by oxygen vacancies, that localize as small polarons and influence charge transport and surface chemistry. At surfaces, these polarons play a central role in charge localization, mobility, and reactivity, yet their finite-temperature dynamics remain difficult to access from first principles. Ab initio molecular dynamics is typically limited to picosecond time scales, precluding statistically meaningful sampling of polaron hopping dynamics. To overcome this limitation, we extend machine-learning-assisted polaron dynamics [V. Birschitzky et al., Phys. Rev. Lett. 134, 216301 (2025)] to redox-active oxide surfaces, using oxygen-deficient rutile TiO2(110) as a paradigmatic case. By accessing several nanoseconds of dynamics over a range of temperatures, we show that small-polaron mobility at the reduced rutile TiO2(110) surface is suppressed by several orders of magnitude relative to the corresponding bulk material, providing a microscopic interpretation of the lower electron mobilities observed in porous rutile TiO2 compared with single-crystal samples. This suppressed mobility arises from the loss of favorable hopping pathways: surface polaron motion is largely confined to planar inter-row trajectories within the second topmost layers, with only rare interlayer hopping events. Oxygen vacancies further reshape the polaron free-energy landscape by acting as attractive centers for excess electrons, biasing the polaron distribution toward nearby Ti sites and promoting occasional charge transfer to the outermost surface layer. These results establish a transferable machine-learning strategy for investigating polaron dynamics in reducible oxides.", "url": "https://arxiv.org/abs/2606.13833", "type": "理论+数值", "summary": "1. 该工作将机器学习辅助极化子动力学方法拓展至可还原氧化物表面，以缺氧金红石TiO₂(110)为模型体系，实现了纳秒级有限温度动力学采样。\n2. 其核心发现是表面小极化子迁移率相较体相被抑制数个数量级，源于有利跳跃路径缺失致运动被限制在次顶层平面内，且氧空位作为电子吸引中心重塑自由能景观。\n3. 该策略为研究可还原氧化物中极化子有限温度迁移与表面反应性提供了可迁移的机器学习框架，可推广至其他相关体系。", "summary_source": "deepseek", "authors": [{"name": "Luca Leoni"}, {"name": "Cesare Franchini"}], "featured_authors": [{"name": "Luca Leoni"}, {"name": "Cesare Franchini"}], "author_count": 2}, {"id": "2606.13869", "category": "cond-mat", "title": "DFTB coupled with NEGF study of the structural, electronic and transport properties of goldene 2D material", "abstract": "We report the structural, electronic, and transport properties of the goldene 2D material using the density functional tight-binding (DFTB) method. Electronic transport calculations were conducted in conjunction with the non-equilibrium Green's functions (NEGF) technique. Our study reveals that the Au 2D material is dynamically and thermally stable, and it possesses good elastic properties. On the other hand, goldene has a linear relationship between current and voltage at low potentials, indicating its metallic character. The calculated current-potential curve correlates well with transmission functions and the electronic density of states around the Fermi level. We also investigated the electronic structure and magnetic properties of silicon (Si)-doped Au 2D material. Our results show that the Si atom can induce a local magnetic state in the goldene monolayer. The resulting magnetic moment is 0.63 $\\mu_B$.", "url": "https://arxiv.org/abs/2606.13869", "type": "数值", "summary": "1. 该工作运用密度泛函紧束缚方法结合非平衡格林函数技术，系统研究了二维金材料的几何、电子及输运性质。\n2. 主要发现包括：Au单层动态与热稳定且具良好弹性，低偏压下显示欧姆金属行为，Si掺杂可在费米能级附近引入0.63 μB局域磁矩。\n3. 这为二维单质贵金属中自旋极化调控及量子输运提供了可行载体，并启发后续掺杂工程与自旋电子器件设计。", "summary_source": "deepseek", "authors": [{"name": "Taoufik Sakhraoui"}, {"name": "František Karlický"}], "featured_authors": [{"name": "Taoufik Sakhraoui"}, {"name": "František Karlický"}], "author_count": 2}, {"id": "2606.13874", "category": "cond-mat", "title": "Dynamical multiferroicity in framework materials", "abstract": "Dynamical multiferroicity, which describes the magnetic fields generated by circularly polarized phonons in materials, is an established mechanism for optical control of magnetism. Here we perform ab initio calculations of dynamical multiferroicity in inorganic and organic framework materials, with the goal of identifying materials which enable the generation of large magnetic fields by light. We find the metal--organic framework material Zn(NH$_4$)(formate)$_3$ to have modes with magnetic moments almost twice that of SrTiO$_3$; these modes involve circular motions of NH$_4^+$ hydrogen ions with high gyromagnetic ratios. The complex structure and flexibility of framework materials can allow such angular momentum localization, and also increase the maximum light-induced magnetization permitted by the Lindemann melting criterion.", "url": "https://arxiv.org/abs/2606.13874", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算，系统研究了无机和有机框架材料中的动态多铁性，旨在识别能通过圆极化声子产生大磁场的材料。\n2. 核心在于发现金属有机框架Zn(NH₄)(甲酸)₃中NH₄⁺氢离子的圆周运动模式具有近两倍于SrTiO₃的磁矩，归因于高旋磁比及框架结构对角动量的局域化。\n3. 这揭示了框架材料的复杂性与柔性可增强光致磁化上限（受Lindemann熔化判据约束），为设计光控磁性材料提供了基于角动量局域化的新策略。", "summary_source": "deepseek", "authors": [{"name": "Marek Matas"}, {"name": "Carl P. Romao"}], "featured_authors": [{"name": "Marek Matas"}, {"name": "Carl P. Romao"}], "author_count": 2}, {"id": "2606.13906", "category": "cond-mat", "title": "Molecular Beam Epitaxy of Mn2In2Se5 van der Waals Layers Using Mn Intercalation", "abstract": "The weak van der Waals (vdW) force in layered chalcogenide materials has enabled the growth of ternary chalcogenide layers using unconventional approaches. Here, we report the molecular beam epitaxy (MBE) growth of Mn2In2Se5, a spin glass material with high level of magnetic frustration, through the heterointegration of MnSe on In2Se3. Directly depositing {\\alpha}-MnSe on the vdW In2Se3 layers results in Mn intercalation, transforming the In2Se3 layer into Mn2In2Se5. Large growth windows, including substrate temperatures from 250-450 °C and Se:Mn flux ratio of 1.1-3.1, have been identified for the intercalation process. With an optimized MnSe deposition time, smooth, single-crystalline, and (0001)-oriented Mn2In2Se5 layers with a root-mean-square (RMS) roughness of 1.5 nm can be synthesized. Further extending the MnSe deposition time results in the growth of uniform rock-salt structured {\\alpha}-MnSe (111) layers with a thickness of up to 8 nm and a narrow full-width-at-half-maximum (FWHM) of 0.35° in MnSe (222) XRD rocking curves. This report presents a unique approach for the growths of uniform and single-crystalline Mn2In2Se5 vdW layers using MBE, and potentially opens a pathway for synthesis of ternary vdW chalcogenides by intercalation of new atomic species in binary vdW chalcogenides.", "url": "https://arxiv.org/abs/2606.13906", "type": "数值", "summary": "1. 该工作报道了利用分子束外延在In₂Se₃上沉积α-MnSe，通过Mn插层成功生长出高磁阻挫自旋玻璃三元硫族化物Mn₂In₂Se₅范德瓦尔斯层。\n2. 其技术关键在于Mn插层驱动从二元到三元的层状转化，在250-450°C宽温区和Se:Mn比1.1-3.1条件下获得(0001)取向单晶薄膜（RMS粗糙度1.5 nm），延长沉积还可外延高质量岩盐α-MnSe(111)层。\n3. 该插层合成策略为向二元范德瓦尔斯硫族化物中引入新原子以构筑三元体系提供了通用途径，有望推广至其他磁性插层材料。", "summary_source": "deepseek", "authors": [{"name": "Qihua Zhang"}, {"name": "Ke Wang"}, {"name": "Wesley Auker"}, {"name": "Maria Hilse"}, {"name": "Stephanie Law"}], "featured_authors": [{"name": "Qihua Zhang"}, {"name": "Ke Wang"}, {"name": "Wesley Auker"}, {"name": "Maria Hilse"}, {"name": "Stephanie Law"}], "author_count": 5}, {"id": "2606.13912", "category": "cond-mat", "title": "Direct/adaptive-mixture phase-gradient learning for neural-network quantum states with complex phase structure", "abstract": "Neural-network quantum states (NQS) are a leading variational tool for quantum many-body physics, yet their optimization is fragile whenever the ground state carries a non-trivial sign or complex phase structure, a situation generic to gauge fields, broken time-reversal symmetry, and fermionic statistics. We trace this fragility to the stochastic estimator of the phase gradient rather than to network expressiveness. The phase sector of the Monte Carlo energy gradient is a noisy score-function estimator; differentiating the local energy instead yields a direct estimator that is unbiased for the same phase force, has far lower variance, and requires only a separated amplitude--phase ansatz. Demonstrated on a 100-site flux ladder, a small network trained this way reaches $0.89\\%$ median error, where tuned standard baselines plateau at $1.8\\%$ and wider or deeper standard-gradient networks degrade from $8.4\\%$ to $24.6\\%$. The advantage carries over to chiral XXX chains: the direct estimator again converges to a markedly lower error than the standard one, across $\\alpha$ and size; it grows with flux and vanishes in zero-flux controls. An adaptive-mixture of the two estimators is provably never worse in variance than the better endpoint at the optimal mixing coefficient, with seed-resolved diagnostics tracing much of the gain to eliminating failed runs. Estimator design thus emerges as a first-class lever for complex-valued neural quantum states.", "url": "https://arxiv.org/abs/2606.13912", "type": "理论+数值", "summary": "1. 本工作针对神经网络量子态优化中由复杂相位结构导致的收敛脆弱性，提出了直接与自适应混合相位梯度估计方法。\n2. 其核心在于利用分离幅值-相位Ansatz的直接梯度估计器显著降低方差，在通量梯子和手性自旋链上获得超越标准方法的精度。\n3. 这确立了估计器设计作为复值神经量子态优化的关键杠杆，为处理规范场和费米子符号问题提供了可靠路径。", "summary_source": "deepseek", "authors": [{"name": "Yi-Ran Xue"}, {"name": "Rui Wang"}, {"name": "Baigeng Wang"}, {"name": "Chenan Wei"}], "featured_authors": [{"name": "Yi-Ran Xue"}, {"name": "Rui Wang"}, {"name": "Baigeng Wang"}, {"name": "Chenan Wei"}], "author_count": 4}, {"id": "2606.13972", "category": "cond-mat", "title": "Mean-field theory of myopic self-avoiding fractional Brownian motion", "abstract": "Myopic self-avoiding fractional Brownian motion (FBM) is a stochastic process in which an ensemble of particles is driven by fractional Gaussian noise while being repelled by the gradient of the time-integrated ensemble density [J. House, R. Bakhshizada, S. Janušonis, R. Metzler, and T. Vojta, Phys. Rev. E 112, 034119 (2025)]. Depending on the anomalous diffusion exponent $\\alpha$ characterizing the noise, the process features two dynamical regimes: an interaction-dominated regime ($\\alpha < \\alpha_c=4/(d+2)$) where the mean-density interaction governs long-time dynamics, and a noise-dominated regime ($\\alpha > \\alpha_c$) where FBM correlations prevail. In the interaction-dominated regime, the mean-squared displacement grows as $\\langle r^2(t) \\rangle \\sim t^{4/(d+2)}$ regardless of $\\alpha$, while for $\\alpha > \\alpha_c$ the standard FBM scaling $\\langle r^2(t) \\rangle \\sim t^{\\alpha}$ is recovered. Here, we develop an analytical mean-field theory of myopic self-avoiding FBM, based on a Fokker-Planck approach to the interaction-dominated regime. This allows us to derive closed-form polynomial solutions for the probability density. To compare with computer simulations, we develop an efficient radial binning algorithm that significantly reduces the computational complexity, making large-scale three-dimensional simulations feasible. Extensive simulations in one, two, and three dimensions confirm the analytical predictions. We also discuss the application of the process to the self-organization of serotonergic axons (fibers) in vertebrate brains, where FBM paths with self-avoidance provide a natural framework for understanding spatial heterogeneities of fiber densities.", "url": "https://arxiv.org/abs/2606.13972", "type": "理论+数值", "summary": "1. 该工作发展了一种近视自回避分数布朗运动的平均场理论，基于Fokker-Planck方法解析描述了相互作用主导区域的动力学行为。\n2. 其核心在于推导出概率密度的闭式多项式解，并设计径向分箱算法大幅降低计算复杂度，实现三维大尺度模拟验证。\n3. 这为理解脊椎动物脑中血清素能轴突纤维密度的空间异质性提供了理论框架，并揭示了非平衡自组织机制的普适标度。", "summary_source": "deepseek", "authors": [{"name": "Rashad Bakhshizada"}, {"name": "Skirmantas Janušonis"}, {"name": "Ralf Metzler"}, {"name": "Thomas Vojta"}], "featured_authors": [{"name": "Rashad Bakhshizada"}, {"name": "Skirmantas Janušonis"}, {"name": "Ralf Metzler"}, {"name": "Thomas Vojta"}], "author_count": 4}, {"id": "2606.14101", "category": "cond-mat", "title": "Altermagnetism and bond-nematicity in the spin-$1/2$ square lattice $J_1-J_2-δ$ model", "abstract": "We study appearance of bond-nematicity in insulating altermagnetic materials induced by increased frustration and quantum-fluctuations driven melting of the altermagnetic order. Using novel machine learning approach that combines symmetry enhanced neural network architectures and variational Monte Carlo we consider the spin-$1/2$ square lattice $J_1-J_2-\\delta$ model known to have altermagnetic ordering in the regime of small geometric frustration and a gapless spin liquid phase in the regime of strong frustration and small exchange interaction modulation parameter $\\delta$. In the regime where exchange modulation is relatively large, resulting in the significant splitting of the magnon modes with different chiralities in the altermagnetic regime, we find that melting of the altermagnetic order by increased frustration leads to an intriguing phase that hosts coexisting symmetry protected topological valence bond solid and bond-nematic orders. The phase is characterized by condensation of magnon pairs that results in bond-nematicity, breaking of U(1) spin rotation and $\\mathbb{Z}_2$ spin inversion symmetries and chiral splitting of the triplon-like energy levels in the excitation spectrum. Whilst numerous recent studies address non-trivial impact of altermagnetic moments on various properties in altermagnetic materials, like electronic band structure and superconductivity, influence of strong quantum fluctuations and phases that can result from melting of the altermagnetic order are much less explored. Our study therefore presents an important step in identifying exotic phases of matter that can emerge in vicinity of the altermagnetic order.", "url": "https://arxiv.org/abs/2606.14101", "type": "理论+数值", "summary": "1. 该工作利用对称增强神经网络与变分蒙特卡洛方法，系统研究了自旋1/2正方晶格J1-J2-δ模型中交错磁性与键向列性的出现及竞争。\n2. 其关键发现是：在交换调制较大区域，增大阻挫导致交错磁序通过磁振子对凝聚而熔化，从而形成对称保护拓扑价键固体与键向列序共存的新奇相，并伴随U(1)自旋旋转和ℤ₂自旋反演对称性破缺以及手征性三重子能级分裂。\n3. 这为探索交错磁体附近由强量子涨落诱导的奇特量子相提供了重要范例，并启发对阻挫磁性系统中磁振子凝聚与对称性破缺机制的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Tanja Đurić"}, {"name": "Shenlong Yu"}, {"name": "Pinaki Sengupta"}], "featured_authors": [{"name": "Tanja Đurić"}, {"name": "Shenlong Yu"}, {"name": "Pinaki Sengupta"}], "author_count": 3}, {"id": "2606.14133", "category": "cond-mat", "title": "Diffusion-driven autocatalytic dynamics on a sphere", "abstract": "We study the collective dynamics of independent particles that diffuse outside a spherical surface, on which they are replicated with a prescribed catalytic rate. In spatial dimensions three and higher, the transient nature of diffusion creates the competition between autocatalytic and escape events, thus leading to a rich phase diagram between subcritical (extinction), critical (steady-state), and supercritical (growth) regimes at long times. The rotational symmetry of the domain and an explicit form of the single-particle diffusion propagator allow us to obtain the statistics of the population size (i.e., the number of particles). In this way, we analyze the mean population size, its variance and higher-order moments, as well as the full distribution. In particular, we obtain a fully explicit form of the distribution at long times and describe a slow, power-law approach to this steady-state limit.", "url": "https://arxiv.org/abs/2606.14133", "type": "理论+数值", "summary": "1. 该工作研究了在球面外扩散的独立粒子受球面催化复制驱动的集体动力学，揭示了亚临界、临界与超临界长时相图。\n2. 其核心在于利用球对称性与单粒子扩散传播子显式形式，解析得出种群大小均值、方差、高阶矩及长时间极限下完整分布的幂律趋近行为。\n3. 这为理解三维及以上空间中扩散与自催化竞争的暂态机制提供了精确理论框架，可启发相关反应扩散系统的建模与分析。", "summary_source": "deepseek", "authors": [{"name": "Denis S. Grebenkov"}], "featured_authors": [{"name": "Denis S. Grebenkov"}], "author_count": 1}, {"id": "2606.14183", "category": "cond-mat", "title": "The Structure-tuning Magnetism in the Co(NbxTa1-x)2O6 Series", "abstract": "Low dimensional quantum materials have been extensively studied within the physics community, among which Co2+ is one of the most popular magnetic ions to be embedded into the structural motif. CoNb2O6 and CoTa2O6 both have adopted an effective spin-1/2 state, with the former attracting enduring interest while the latter being rarely investigated. This difference can be attributed to their distinct crystal structures, not only in crystal systems, but more important, how the CoO6 octahedra are connected. We successfully merge these two compounds together and map out the doping limits. We find out Ta and Nb dopants modify the properties of the parent compounds in subtle but different ways and construct a magnetic phase diagram of the Co(NbxTa1-x)2O6 (0 < x < 1) series. In addition, our results suggest that Ta-doping may pave a way to strengthen the lower-dimensional quantum phenomena in CoNb2O6 before its crystal structure starts to melt down.", "url": "https://arxiv.org/abs/2606.14183", "type": "数值", "summary": "1. 本研究通过合成Co(NbxTa1-x)2O6全组分系列，绘制了掺杂极限与磁相图，揭示了由CoO6八面体连接方式改变引起的结构调控磁性。\n2. 其关键发现是Ta掺杂可在维持有效自旋-1/2态的前提下，通过保持正交晶系的同时增强低维量子涨落，直至结构开始失稳。\n3. 这为在准一维量子磁体中利用化学压力诱导增强的低维量子现象提供了明确的实验路径。", "summary_source": "deepseek", "authors": [{"name": "Sirui Huang"}, {"name": "Lun Jin"}, {"name": "Yuchen Liu"}, {"name": "Xiyu Chen"}, {"name": "Leili Tan"}], "featured_authors": [{"name": "Sirui Huang"}, {"name": "Lun Jin"}, {"name": "Yuchen Liu"}, {"name": "Xiyu Chen"}, {"name": "Leili Tan"}], "author_count": 5}, {"id": "2606.14186", "category": "cond-mat", "title": "Stochastic Thermodynamics on Time-Evolving Curved Spaces", "abstract": "We construct stochastic thermodynamics of overdamped Langevin systems on nonrelaticvistic curved spaces with time-dependent metrics. The time dependence of the metric contributes to the energy balance by performing work on the kinetic energy, which is instantaneously dissipated as heat in the overdamped regime. This contribution makes our framework thermodynamically consistent so that entropy production satisfies the second law of thermodynamics. As a special case, when the metric evolves according to backward Ricci flow, the entropy balance exhibits a structure similar to Perelman's entropy functional. Our framework provides a way to quantify thermodynamic costs in dynamics on time-evolving spaces such as diffusion on membranes.", "url": "https://arxiv.org/abs/2606.14186", "type": "理论+数值", "summary": "1. 该工作构建了时变弯曲空间上过阻尼朗之万系统的随机热力学理论。\n2. 其核心在于时变度规通过贡献动能做功并即时耗散为热，确保熵产生满足第二定律，且与逆向Ricci流耦合时熵平衡呈现类似Perelman泛函的结构。\n3. 这为量化膜扩散等时变几何系统中动力学的热力学代价提供了自洽框架。", "summary_source": "deepseek", "authors": [{"name": "Rihito Nagase"}, {"name": "Shoki Sugimoto"}, {"name": "Asuka Takatsu"}, {"name": "Takahiro Sagawa"}], "featured_authors": [{"name": "Rihito Nagase"}, {"name": "Shoki Sugimoto"}, {"name": "Asuka Takatsu"}, {"name": "Takahiro Sagawa"}], "author_count": 4}, {"id": "2606.14231", "category": "cond-mat", "title": "Spin mixing induced dynamics of spinor solitons in $F=1$ Bose Einstein condensates", "abstract": "We explore soliton interactions in a homogeneous spinor $F=1$ Bose Einstein Condensate (BEC) in the presence of a magnetic field, focusing on dark bright dark and bright dark bright configurations. We investigate how these interactions depend on the phase differences among bright solitons and their influence during the dynamics. Our findings align with prior non spinor results, i.e., repulsion among in phase bright solitons and attraction among out of phase pairs in self repulsive atomic BECs. The potential bright soliton attraction, added to the short range repulsion of dark dark soliton interactions, can lead to bound states. However, we find that these bound states break in the presence of spinor interactions due to the particle exchange dynamics between the hyperfine states of the components. Additonally, we develop an effective classical model to describe the soliton dynamics, using a Lagrangian approach. The accuracy of the model is tested by comparing it against numerical simulations. Our results suggest that the proposed model captures the essential features of soliton behavior in the presence of spin interactions, and provides congruent soliton trajectories and interspecies particle exchange dynamics in most of the cases.", "url": "https://arxiv.org/abs/2606.14231", "type": "理论+数值", "summary": "1. 该工作研究了均匀自旋1玻色-爱因斯坦凝聚中暗-亮-暗和亮-暗-亮孤子构型的动力学，重点关注亮孤子相位差对相互作用及自旋混合过程的影响。\n2. 其核心发现是自旋相互作用通过超精细态间的粒子交换动力学破坏了非自旋情形下的孤子束缚态，并建立了一个基于拉格朗日方法有效描述自旋孤子轨迹与粒子交换的经典模型。\n3. 该模型为自旋量子气体中多组分孤子的操控与非线性波动力学研究提供了可靠的理论框架，可推广至更复杂的自旋系统。", "summary_source": "deepseek", "authors": [{"name": "T. Panagos"}, {"name": "A. Romero-Ros"}, {"name": "G.C. Katsimiga"}, {"name": "P. Schmelcher"}, {"name": "P.G. Kevrekidis"}], "featured_authors": [{"name": "T. Panagos"}, {"name": "A. Romero-Ros"}, {"name": "G.C. Katsimiga"}, {"name": "P. Schmelcher"}, {"name": "P.G. Kevrekidis"}], "author_count": 5}, {"id": "2606.14285", "category": "cond-mat", "title": "Thermodynamic Framework for $q$-Affinity", "abstract": "We develop a thermodynamic framework for non-equilibrium affinities based on generalized entropies. In particular, we extend the classical concept of De Donder by introducing $q$-affinities associated with Rényi and Tsallis entropies. This in turn allows us to generalize thermodynamic driving forces to systems with long-range interactions and/or strong correlations. For Rényi entropy, we build on a thermodynamic interpretation due to Baez, where the entropy is expressed through finite differences of the Helmholtz free energy at two temperatures. This leads to a generalized thermodynamic potential whose derivative with respect to a reaction coordinate defines the Rényi $q$-affinity. The resulting expression admits a representation in terms of exponential work averages, establishing a connection to Jarzynski-type fluctuation relations. For Tsallis entropy, we consider Markov jump processes using a master-equation-based approach. We derive a $q$-deformed entropy balance law and obtain an explicit expression for the Tsallis entropy production rate, proving its non-negativity and thus recovering a generalized second-law structure. This allows to identify a local stochastic $q$-affinity with the generalized thermodynamic force entering the entropy production rate.", "url": "https://arxiv.org/abs/2606.14285", "type": "理论", "summary": "1. 该工作基于Rényi与Tsallis广义熵，将经典De Donder亲和力推广至长程相互作用与强关联非平衡系统，建立了q-亲和力的热力学框架。\n2. 其核心是通过双温自由能有限差商定义Rényi广义势，导出以指数功平均表示的q-亲和力并衔接Jarzynski涨落定理；对Tsallis熵则从主方程导出q-变形熵平衡律，证明熵产生率非负以恢复广义第二定律。\n3. 该框架为处理强关联与长程相互作用体系的非平衡热力学驱动力提供了统一理论工具，有望推动相关复杂系统的实验与理论研究。", "summary_source": "deepseek", "authors": [{"name": "Dani Rodríguez-Castellanos"}, {"name": "Petr Jizba"}], "featured_authors": [{"name": "Dani Rodríguez-Castellanos"}, {"name": "Petr Jizba"}], "author_count": 2}, {"id": "2606.14311", "category": "cond-mat", "title": "Thinning-by-spinning: shear rheology of dense chiral fluids", "abstract": "We investigate the linear and nonlinear rheology of dense chiral fluids composed of self-spinning particles under external shear. Using particle-based simulations of a two-dimensional Lennard-Jones model with transverse interactions, we show that chirality acts as an intrinsic source of fluctuations and shear. In the solid regime, spinning fluidizes the system, weakening hexatic order. In the liquid regime, the viscosity is quantitatively described by a Green-Kubo relation upon replacing the temperature by a chirality-dependent effective temperature. Beyond linear response, flow curves collapse when expressed in terms of the ratio between imposed shear and spinning rates, revealing a thinning-by-spinning mechanism. At large forcing, this correspondence breaks down and a pronounced handedness asymmetry emerges: when transverse interactions oppose the imposed shear, stresses relax through the formation of string-like flow channels. Our results identify chirality as a generic mechanism for fluidization and provide a unified framework for understanding the rheology of dense chiral suspensions.", "url": "https://arxiv.org/abs/2606.14311", "type": "理论+数值", "summary": "1. 该工作通过二维Lennard-Jones模型与横向相互作用的粒子模拟，系统研究了由自旋粒子构成的稠密手性流体在外加剪切下的线性和非线性流变行为。\n2. 其核心发现是手性作为内源剪切与波动来源，通过有效温度替代实现Green-Kubo关系定量描述粘度，并揭示流动曲线在剪切与自旋速率之比下塌缩的自旋致稀机制及手性非对称流道形成。\n3. 这为将手性视为通用的流化机制提供了统一理论框架，启发稠密手性悬浮液流变学中有效温度与结构弛豫的进一步实验与理论研究。", "summary_source": "deepseek", "authors": [{"name": "Lucio Mauro Carenza"}, {"name": "Giuseppe Gonnella"}, {"name": "Demian Levis"}, {"name": "Giuseppe Negro"}], "featured_authors": [{"name": "Lucio Mauro Carenza"}, {"name": "Giuseppe Gonnella"}, {"name": "Demian Levis"}, {"name": "Giuseppe Negro"}], "author_count": 4}, {"id": "2606.14352", "category": "cond-mat", "title": "Modeling light-matter coupled systems with neural quantum states", "abstract": "Recent advances in cold atom manipulation enable the study of many-body systems where short-range interactions between neighboring atoms coexist with long-range interactions mediated by photons. Such a combination of interactions makes a theoretical approach challenging beyond mean-field methods. In this work, we develop a neural quantum state based approach to study these systems numerically. We introduce a neural-network architecture capable of handling hybrid Hilbert spaces with large local bosonic dimensions in strongly interacting spin-photon systems. We benchmark this approach on a model of a two-dimensional lattice of Rydberg atoms coupled to a photon mode. The superradiant ground states found in the large spin-photon coupling regime allow us to demonstrate the efficiency of the method in the presence of high photon occupation. Furthermore, the ability to capture spin-spin and spin-photon correlations leads us to observe quantitative deviations in the ground state phase boundaries with respect to mean-field theory. The method extends to other systems with a similar hybrid Hilbert space structure, such as spin-phonon systems, and provides a scalable framework for investigating their ground state properties.", "url": "https://arxiv.org/abs/2606.14352", "type": "理论+数值", "summary": "1. 该工作开发了基于神经量子态的方法，数值研究同时具有短程相互作用与光子介导长程相互作用的多体光-物质耦合系统。\n2. 其技术核心是能够处理大局域玻色子维度的混合希尔伯特空间的神经网络架构，有效捕获自旋-光子关联，揭示与平均场理论在基态相边界上的定量偏差。\n3. 该方法可推广至自旋-声子等具有相似混合希尔伯特空间的系统，为研究其基态性质提供了可扩展的数值框架。", "summary_source": "deepseek", "authors": [{"name": "Noe Salmeron"}, {"name": "Marin Bukov"}, {"name": "Markus Schmitt"}], "featured_authors": [{"name": "Noe Salmeron"}, {"name": "Marin Bukov"}, {"name": "Markus Schmitt"}], "author_count": 3}, {"id": "2606.14370", "category": "cond-mat", "title": "Spherical metadensity functional learning for inhomogeneous classical fluids", "abstract": "We develop classical density functional learning to address fluids with truncated pairwise interparticle interactions in three-dimensional spherical geometry. Simulation data for systems with randomized repulsive pair potentials provide the basis for supervised training of a neural metadensity functional, thereby making efficient use of results for radial distribution functions in the bulk fluid via the test particle route. Specifically, we develop spherical local learning in order to represent the one-body direct correlation functional in terms of a neural network, which captures spatial curvature effects as well as the metadensity functional dependence on the thermally scaled pair potential. The framework yields efficient access to inhomogeneous structuring and related physical phenomena that occur in fluids and general solvents when adsorbed against curved solutes and confined inside of spherical and planar cavities. Test particle setups facilitate accurate prediction of the bulk fluid pair structure and verification of thermodynamic test particle sum rules via functional line integration. Applying the metadensity functional for Henderson inversion allows one to infer accurately the pair potential from the bulk radial distribution function. We address implications of the geometrical setup for two-body quantities and obtain the two-body direct correlation functional from automatic differentiation. For the hard sphere fluid, we confirm metadensity functional predictions against results from a standard neural density functional with fixed pair potential as well as to an analytic functional as given by fundamental measure theory. Simulation results provide further reference and corroborate reliable results of the spherical neural metadensity functional across a broad range of applications.", "url": "https://arxiv.org/abs/2606.14370", "type": "理论+数值", "summary": "1. 该工作开发了针对三维球形几何中截断对相互作用非均匀流体的经典密度泛函学习框架。\n2. 其技术核心在于通过球形局部学习以神经网络表示单体直接相关泛函，同时捕获空间曲率效应与热标度势依赖。\n3. 该框架实现了对弯曲溶质及腔体内流体结构的准确预测，并借助Henderson反演与自动微分获得对势及两体相关泛函。", "summary_source": "deepseek", "authors": [{"name": "Stefanie M. Kampa"}, {"name": "Matthias Schmidt"}, {"name": "Florian Sammüller"}], "featured_authors": [{"name": "Stefanie M. Kampa"}, {"name": "Matthias Schmidt"}, {"name": "Florian Sammüller"}], "author_count": 3}, {"id": "2606.14374", "category": "cond-mat", "title": "Bond-operator analytical approach for the $t$-$J$ model", "abstract": "We present a bond-operator theory (BOT) for analytical consideration of the $t$-$J$ model and its extensions with longer-rage hopping terms. This technique is based on previously suggested representation of electron operators via localized spins 1/2 and spinless Fermi-operators of mobile holons which requires no constraint between them. We introduce a representation of operators of spins, holons, and electrons in (extended) unit cell containing several lattice sites via a zoo of Bose- and Fermi-operators acting in the Hilbert space of all quantum states of the whole unit cell. BOT provides a regular expansion of physical quantities in powers of $1/n$ using conventional diagrammatic technique, where $n\\ge1$ is the maximum number of introduced quasiparticles (bosons and fermions) which can occupy a unit cell. The suggested representation reproduces commutation algebra of all operators at any $n>0$ and allows to consider both magnetically ordered and disordered phases. Some elementary excitations described in the BOT by separate bosons or fermions appear in common approaches as bound states of conventional quasiparticles. In particular, there are two-hole bound states (Cooper pairs of two holes) which are described within the BOT by separate bosons. We discuss in detail properties of the $t$-$J$ model on the square lattice with no more than two holes (polarons). Although the expansion parameter $1/n$ is not small in the physically meaningful case of $n=1$, we obtain a good quantitative agreement with previous numerical findings at $n=1$ even in the first order in $1/n$ after taking into account a few simple diagrams. Self-consistent calculations in the first order in $1/n$ bring our results to a very good quantitative agreement with previous numerical findings of the ground state energy, staggered magnetization, and spectra of magnons, polarons, and lowest-energy two-hole bound states.", "url": "https://arxiv.org/abs/2606.14374", "type": "理论+数值", "summary": "1. 该工作为t-J模型及其长程跳跃扩展提出了基于键算符的解析理论（BOT），通过引入单元胞内玻色子和费米子算符实现系统化展开。\n2. 其技术优势在于构造了无约束的电子算符表示，可正规进行1/n展开，并在n=1时经少量自洽图计算即与基态能量、磁化及准粒子谱的数值结果定量一致。\n3. 这为同时处理磁有序与无序相、以及将两孔束缚态（库珀对）描述为独立玻色子提供了统一的解析框架，对关联电子系统研究具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "A. V. Syromyatnikov"}], "featured_authors": [{"name": "A. V. Syromyatnikov"}], "author_count": 1}, {"id": "2606.14390", "category": "cond-mat", "title": "Local Coverage Governs Memorization in Diffusion Models", "abstract": "Memorization in diffusion models is often treated as a global property of the model or dataset. In practice, however, a single diffusion model can simultaneously generate both memorized and novel samples. Which training samples are most likely to be memorized? In this work, we show that memorization is governed by \\emph{local data coverage}. Leveraging the connection between diffusion models and kernel density estimation (KDE), we derive a theoretical criterion that predicts whether a point is memorized based on the density of training data in its neighborhood and the size of the training dataset. In the high-dimensional limit, this leads to a sharp, local transition: regions of low coverage are dominated by isolated training samples, which are memorized, while dense regions support interpolation and generalization. We validate these predictions empirically, showing that memorization increases with local sparsity and that diffusion models exhibit a coexistence of memorized and novel samples within the same model. Extending this framework to multi-class settings, we further show that classes with higher intra-class sparsity (and thus lower local coverage) are more strongly memorized. Our results provide a local view of memorization in diffusion models, explaining when and where memorization occurs in terms of data geometry.", "url": "https://arxiv.org/abs/2606.14390", "type": "理论", "summary": "1. 该工作揭示了扩散模型中的记忆化行为由局部数据覆盖度主导，而非全局模型或数据集属性。\n2. 其技术核心在于利用扩散模型与核密度估计的理论关联，推导出基于邻域训练数据密度和数据集大小的精确记忆化判据，并在高维极限下呈现尖锐的局部相变。\n3. 这一局部视角为理解数据几何如何决定记忆化与泛化的共存提供了理论框架，并拓展至多类情境，解释类内稀疏性如何加剧记忆化。", "summary_source": "deepseek", "authors": [{"name": "Claudia Merger"}, {"name": "Sebastian Goldt"}], "featured_authors": [{"name": "Claudia Merger"}, {"name": "Sebastian Goldt"}], "author_count": 2}, {"id": "2606.14425", "category": "cond-mat", "title": "SmoQyElPhQMC.jl: An open-source Julia package for efficient and scalable quantum Monte Carlo simulations of electron-phonon coupled models", "abstract": "We introduce version 1.0 of the SmoQyElPhQMC package, an open-source Julia code for performing scalable quantum Monte Carlo simulations of electron-phonon coupled model Hamiltonians. SmoQyElPhQMC is built upon the SmoQyDQMC codebase and implements improved versions of the algorithms presented in [B. Cohen-Stead \\textit{et al}., Phys. Rev. E {\\bf 105}, 065302 (2022)] to enable linear-scaling simulations of a broad class of uncorrelated $e$-ph models both in system size and inverse temperature. By extending the functionality of the flexible scripting interface introduced in SmoQyDQMC, the SmoQyElPhQMC package continues to allow users to adapt it to different workflows and interface with other software packages in the Julia ecosystem. The code for this package can be downloaded from our GitHub repository at this https URL or installed using the Julia package manager. The online documentation, including examples, can be obtained from our documentation page at this https URL .", "url": "https://arxiv.org/abs/2606.14425", "type": "理论+数值", "summary": "1. 该工作发布了开源Julia软件包SmoQyElPhQMC 1.0版本，用于电子-声子耦合模型的量子蒙特卡洛模拟。\n2. 其核心卖点在于实现了系统尺寸和逆温度双重线性标度的改进算法，可高效处理宽泛非关联e-ph模型。\n3. 这为凝聚态体系中电子-声子耦合问题的可扩展模拟和Julia生态集成提供了实用计算工具。", "summary_source": "deepseek", "authors": [{"name": "Benjamin Cohen-Stead"}, {"name": "James Neuhaus"}, {"name": "Kipton Barros"}, {"name": "Thomas A. Maier"}, {"name": "Steven Johnston"}], "featured_authors": [{"name": "Benjamin Cohen-Stead"}, {"name": "James Neuhaus"}, {"name": "Kipton Barros"}, {"name": "Thomas A. Maier"}, {"name": "Steven Johnston"}], "author_count": 5}, {"id": "2606.14483", "category": "cond-mat", "title": "Generic nonlocal statistics of the stationary measure in conserved active systems", "abstract": "The stationary measure of equilibrium systems with detailed balance follows a Boltzmann distribution, so that for short-ranged interactions the measure is local, meaning that distant spatial domains are statistically independent. In contrast, active systems break detailed balance, and can have nonlocal stationary measure even for fully local dynamics. Here, by expanding in nonlinearity about a Gaussian-model limit, we construct the measure perturbatively deep in the disordered phase for a class of models that includes Active Model A, Active Model B+, Model AB, the Nonreciprocal Cahn--Hilliard model, and the Toner--Tu model. In this regime, nonlocality is linked to a dynamical conservation law. Our results generically preclude construction of a Landau--Ginzburg expansion of the stationary measure (as opposed to the dynamical equations) for conserved active field theories.", "url": "https://arxiv.org/abs/2606.14483", "type": "理论", "summary": "1. 该工作通过非线性展开构造了守恒活性系统在无序相深处稳态测度的微扰表达式，涵盖活动模型A、B+、AB、非互易Cahn-Hilliard模型及Toner-Tu模型。\n2. 其核心物理卖点在于揭示非局域性与动力学守恒律的关联，并证明此类系统普遍无法对稳态测度进行朗道-金兹堡展开。\n3. 这为活性物质非平衡稳态统计提供了根本性约束，启发后续理论需直接处理非局域测度而非依赖自由能泛函类比。", "summary_source": "deepseek", "authors": [{"name": "Filippo De Luca"}, {"name": "Michael E. Cates"}, {"name": "Cesare Nardini"}], "featured_authors": [{"name": "Filippo De Luca"}, {"name": "Michael E. Cates"}, {"name": "Cesare Nardini"}], "author_count": 3}, {"id": "2606.14519", "category": "cond-mat", "title": "Extending Covariant Fluctuation Theorems into Quantum Regime through Quasiprobability Approach", "abstract": "The covariant formulation of stochastic thermodynamics requires treating the stochastic work as a 4-vector, posing significant challenges for quantum systems due to the non-commutativity. We introduce a new quasiprobability distribution for the work 4-vector, which combines the Wigner and Margenau-Hill quasiprobabilities. This extends the covariant fluctuation theorems from classical to quantum regime. We illustrate our findings with a scalar field driven by classical particles with a generalized version of trace formula. Our work establishes a quasiprobability approach to studying relativistic quantum thermodynamics in a covariant way.", "url": "https://arxiv.org/abs/2606.14519", "type": "理论", "summary": "1. 该工作通过结合维格纳与马格诺-希尔准概率，引入了一种新的功四矢量准概率分布。\n2. 其技术关键在于利用准概率方法处理非对易性，从而将协变涨落定理从经典系统推广到量子领域。\n3. 这为在协变框架下系统研究相对论量子热力学中的涨落与熵产生提供了可靠的理论工具。", "summary_source": "deepseek", "authors": [{"name": "Ji-Hui Pei"}, {"name": "Tingzhang Shi"}, {"name": "Jin-Fu Chen"}, {"name": "H. T. Quan"}], "featured_authors": [{"name": "Ji-Hui Pei"}, {"name": "Tingzhang Shi"}, {"name": "Jin-Fu Chen"}, {"name": "H. T. Quan"}], "author_count": 4}, {"id": "2606.14543", "category": "cond-mat", "title": "Bacterial adhesion to curved surfaces in fluid flow", "abstract": "Minimising bacterial surface adhesion and subsequent biofilm formation in industrial and medical settings requires understanding how bacteria are transported and adhere to complex surface geometries in the presence of non-uniform flow. In this paper, we consider the transport of a dilute suspension of motile bacteria through a corrugated two-dimensional channel with perfectly adhesive walls. We asymptotically analyse the diffusive boundary layer that forms in high velocity flows using a curvilinear coordinate system based on the fluid streamfunction, presenting a similarity solution to the diffusivity-varying diffusion-type equation that arises. From this solution, we derive an analytical expression for the bacterial adhesion rate as a function of surface arclength and the spatially varying wall shear rate. Our model predicts that bacterial adhesion becomes localised on curved surfaces, with bacteria showing preferential adhesion to wall `peaks' at lower shear rates and preferential adhesion to wall `valleys' at higher shear rates. More broadly, our results highlight how spatially varying flows generated by complex geometries can lead to localised bacterial adhesion, with potential implications for both enhancing and minimising biofilm formation.", "url": "https://arxiv.org/abs/2606.14543", "type": "理论", "summary": "1. 该工作通过相似解分析了高流速下弯曲壁面细菌黏附的扩散边界层，推导出黏附率沿表面弧长的解析表达式。\n2. 其技术卖点在于采用基于流函数的曲线坐标系，将变扩散系数扩散方程化为常微分方程，揭示了壁面剪切率空间变化导致黏附在波峰与波谷间的局域化规律。\n3. 这一结果凸显了复杂几何诱导的流场非均匀性对细菌沉积的关键调控作用，为医疗与工业中促进或抑制生物膜形成提供了设计启示。", "summary_source": "deepseek", "authors": [{"name": "Edwina F. Yeo"}, {"name": "Benjamin J. Walker"}, {"name": "Philip Pearce"}, {"name": "Mohit P. Dalwadi"}], "featured_authors": [{"name": "Edwina F. Yeo"}, {"name": "Benjamin J. Walker"}, {"name": "Philip Pearce"}, {"name": "Mohit P. Dalwadi"}], "author_count": 4}, {"id": "2606.14590", "category": "cond-mat", "title": "Lattice dynamics and the spectroscopic signatures of H-bond disorder in $δ$-AlOOH", "abstract": "Raman and infrared anomalies associated with H-bond symmetrization in $\\delta$-AlOOH, including mode softening and linewidth broadening at 5-10 GPa, occur at significantly lower pressures than predicted by static harmonic theory. To resolve this discrepancy, we combine harmonic phonon calculations with strongly constrained and appropriately normed (SCAN)-based deep-potential molecular dynamics and phonon quasiparticle analysis at 300 K. This framework extracts temperature- and pressure-dependent frequencies and lifetimes from long-time trajectories, capturing the branch reorganization and rapid linewidth growth characteristic of the disordering regime. Incorporating quasiparticle renormalization and directional longitudinal-optical-transverse-optical (LO-TO) splitting further yields near-quantitative agreement with the ambient-pressure OH-stretching Raman multiplet. These results identify finite-temperature dynamical effects and the progressive loss of spectral coherence as the origin of the spectroscopic signatures of H-bond symmetrization.", "url": "https://arxiv.org/abs/2606.14590", "type": "理论+数值", "summary": "1. 该工作融合谐波声子计算、SCAN深势分子动力学与声子准粒子分析，研究δ-AlOOH中氢键无序引起的晶格动力学和光谱异常。\n2. 其核心在于从长时轨迹提取温度-压力依赖的声子频率和寿命，并结合准粒子重整化与定向LO-TO分裂，定量复现环境压力下OH伸缩拉曼多重峰。\n3. 这论证了有限温度动力学效应与光谱相干性渐进丧失是氢键对称化特征在远低于静态谐波理论预测压力下出现的关键机制。", "summary_source": "deepseek", "authors": [{"name": "Chenxing Luo"}, {"name": "Sangjoon Lee"}, {"name": "Hongjin Wang"}, {"name": "Zhen Zhang"}, {"name": "Renata Wentzcovitch"}], "featured_authors": [{"name": "Chenxing Luo"}, {"name": "Sangjoon Lee"}, {"name": "Hongjin Wang"}, {"name": "Zhen Zhang"}, {"name": "Renata Wentzcovitch"}], "author_count": 5}, {"id": "2606.14635", "category": "cond-mat", "title": "Open Wilson chain numerical renormalization group approach to steady-state non-equilibrium quantum transport", "abstract": "The numerical renormalization group (NRG) approach was developed to identify and quantify different equilibrium regimes of quantum impurity systems (QISs) with unprecedented accuracy by a tailored finite size representation. Out of equilibrium, the steady-state density operator is not of the Boltzmannian form but one that is determined by the imposed boundary conditions. We extend the NRG to the nonequilibrium setting by augmenting each Wilson site with a reservoir, whose coupling functions are calculated via a continuous fraction expansion in order to recover the continuum limit exactly. The nonequilibrium parameters such as a finite bias as well as a finite temperature gradient enters through the Bloch-Redfield tensor (BRT), whose zero eigenvector gives the steady-state density operator. We used the resulting open chain full density matrix (OC-FDM) approach with an effective single lead description to investigate the charge and spin transport through a quantum dot (QD) under finite bias and temperature gradient. The influence of lead asymmetry and an external magnetic field on the transport properties are also studied. For completeness, we have also investigated local properties of the QD, such as charge fluctuations and find excellent agreement with real-time quantum Monte Carlo (RT-QMC) data. The OC-FDM approach was able to explore Kondo energy scales as low as $T_K/D \\approx 10^{-8}$ in the non-equilibrium regime, as well as show convergence with the established equilibrium benchmarks, such as a quantitative agreement with full density matrix numerical renormalization group (FDM-NRG) and Fermi-liquid scaling at small bias and temperature. Owing to the effective single lead description, a single OC-FDM data point takes orders of magnitude less time on a standard laptop, compared to other state-of-the-art numerical methods.", "url": "https://arxiv.org/abs/2606.14635", "type": "理论+数值", "summary": "1. 该工作将开放Wilson链数值重整化群扩展到非平衡稳态量子输运。\n2. 其卖点是通过连分式展开在每个Wilson位点耦合储库，精确恢复连续极限。\n3. 这为探索极低Kondo能标（TK/D≈10⁻⁸）下的非平衡输运提供了高效方法。", "summary_source": "deepseek", "authors": [{"name": "Anand Manaparambil"}, {"name": "Frithjof B. Anders"}], "featured_authors": [{"name": "Anand Manaparambil"}, {"name": "Frithjof B. Anders"}], "author_count": 2}, {"id": "2606.14651", "category": "cond-mat", "title": "Generic long-range correlations in nonequilibrium mixtures", "abstract": "We study correlation functions in generic non-equilibrium mixtures, including multi-temperature systems and non-reciprocal field theories. The corresponding linear theory is short-ranged, and nonlinearities are irrelevant in the renormalization-group sense. Nonetheless, we find that these nonlinearities generate long-ranged three-point correlations in the isotropic disordered phase. Our analytical predictions, which are based on a phenomenological theory, are confirmed by numerical simulations of Brownian colloids in contact with thermal baths at different temperatures. Dangerously irrelevant nonlinearities in non-equilibrium mixtures thus offer a new route to long-range correlations, supporting the hypothesis that such correlations are not the exception but the rule out of equilibrium.", "url": "https://arxiv.org/abs/2606.14651", "type": "理论+数值", "summary": "1. 本文研究非平衡混合物（含多温度系统与非互易场论）的关联函数，发现危险无关非线性在各向同性无序相中产生长程三点关联。\n2. 技术关键基于现象学理论分析，揭示线性理论的短程性因危险无关非线性被突破，且预言获不同温度布朗胶体数值模拟验证。\n3. 该工作显示非平衡系统中长程关联普遍存在，为利用危险无关非线性调控宏观关联提供了新物理途径。", "summary_source": "deepseek", "authors": [{"name": "Jessica Metzger"}, {"name": "Yariv Kafri"}, {"name": "Mehran Kardar"}, {"name": "Julien Tailleur"}], "featured_authors": [{"name": "Jessica Metzger"}, {"name": "Yariv Kafri"}, {"name": "Mehran Kardar"}, {"name": "Julien Tailleur"}], "author_count": 4}, {"id": "2606.14661", "category": "cond-mat", "title": "Percolation of a rod-like particle in a static bed of spheres: trapping and passing", "abstract": "We numerically investigate percolation of independent frictionless glued-sphere rod-like particles under gravity through a disordered static bed of larger spheres. We identify two distinct regimes: a \\emph{trapping} regime, where rods stop after percolating a limited distance in the bed and a \\emph{passing} regime, where rods percolate continuously with constant mean velocity. The transition between these regimes is governed by the length of the rod and the geometrical trapping threshold for spherical particles based on the rod diameter and the minimum pore throat diameter defined by three touching large spheres. The percolation velocity for all rod geometries, including the single sphere limit, collapses onto a single curve when scaled with the gravitational acceleration and the bed sphere diameter. The results also demonstrate that short rods percolate nearly twice as fast as long rods due to the geometric constraints associated with the disordered pore structure of the static bed. Consequently, long rods are more susceptible to trapping via specific contact configurations with the bed spheres, which differ from those for short rods. These results reveal how shape anisotropy introduces dynamical constraints and thresholds in granular percolation, with implications for predicting segregation in mixtures of non-spherical particles.", "url": "https://arxiv.org/abs/2606.14661", "type": "理论+数值", "summary": "1. 该工作通过数值模拟研究了重力下无摩擦棒状颗粒在静态球床中的渗透，明确了捕获与通过两种不同渗透状态。\n2. 其核心发现在于渗透速度按重力加速度和床球直径缩放后对所有棒几何形状统一塌缩，且短棒因孔隙几何约束比长棒快近两倍。\n3. 这揭示了形状各向异性引入的动力学阈值与接触构型差异，为预测非球形颗粒混合物中的渗透分离提供了定量启发。", "summary_source": "deepseek", "authors": [{"name": "Juan C. Petit"}, {"name": "Julio M. Ottino"}, {"name": "Richard M. Lueptow"}, {"name": "Paul B. Umbanhowar"}], "featured_authors": [{"name": "Juan C. Petit"}, {"name": "Julio M. Ottino"}, {"name": "Richard M. Lueptow"}, {"name": "Paul B. Umbanhowar"}], "author_count": 4}, {"id": "2606.13770", "category": "hep-th", "title": "4d CFT Correlators from Ambitwistors", "abstract": "We develop an ambitwistor-space formulation of conserved spinning correlators in four-dimensional CFTs. We show that conformal symmetry and conservation are trivialised by the ambitwistor Penrose transform, and construct the two- and three-point ambitwistor correlators explicitly. We further propose a simple formula for projecting onto parity-even and parity-odd sectors, and verify it in several non-trivial examples. The resulting correlators furnish a natural basis compatible with a boundary double copy for arbitrary spin. At three points, we show that they localise on degree-three curves in a two-twistor representation. We also explain how the formalism incorporates boundary propagators for unitary operators of integer conformal dimension, and extend it to conformally coupled scalars.", "url": "https://arxiv.org/abs/2606.13770", "type": "理论", "summary": "1. 该工作利用ambitwistor空间发展了四维共形场论中守恒自旋关联函数的表述，并通过ambitwistor Penrose变换将共形对称性与守恒律平凡化。\n2. 其技术核心在于显式构造了两点及三点ambitwistor关联函数，并提出了投影至奇偶宇称扇区的简洁公式，所得关联函数为任意自旋的边界双拷贝提供了自然基。\n3. 这为理解三点函数在双twistor表示中定位于三次曲线以及推广至共形耦合标量场提供了明确框架，有望启发高自旋全息对偶的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Mariana Carrillo González"}, {"name": "Théo Keseman"}], "featured_authors": [{"name": "Mariana Carrillo González"}, {"name": "Théo Keseman"}], "author_count": 2}, {"id": "2606.13771", "category": "hep-th", "title": "Bootstrapping Euclidean Lattices", "abstract": "We derive spectral identities involving the Laplace spectrum and the integrals of products of eigenfunctions on flat tori and orbifolds. Using semidefinite programming, we derive upper bounds on sums of squares of triple products from these spectral identities, following the approach of the conformal bootstrap. Physically, these upper bounds give constraints on sums of squares of cubic coupling constants in toroidal compactifications of higher-dimensional field theories. For Euclidean lattices, one of the bootstrap bounds leads to an upper bound on the mean square number of minimal vectors that are minimal distance from each minimal vector, divided by the kissing number of the lattice. By finding exact functionals for the semidefinite programming problems, we prove that this bound is saturated in 2, 4, 8, and 24 dimensions by the hexagonal lattice, the $D_4$ lattice, the $E_8$ lattice, and the Leech lattice, respectively.", "url": "https://arxiv.org/abs/2606.13771", "type": "理论", "summary": "1. 该工作从平坦环面与轨形上的拉普拉斯谱及本征函数积分谱恒等式出发，采用半正定规划推导出三重积平方和的上界。\n2. 其技术核心在于通过构造精确泛函，证明这些自举上界在2、4、8、24维分别由六角格、D4格、E8格及Leech格饱和。\n3. 这揭示了格点极值性质与高维场论紧化中立方耦合常数约束间的深刻联系，并为自举方法应用于几何优化问题提供了范例。", "summary_source": "deepseek", "authors": [{"name": "Francesco Bertucci"}, {"name": "James Bonifacio"}], "featured_authors": [{"name": "Francesco Bertucci"}, {"name": "James Bonifacio"}], "author_count": 2}, {"id": "2606.13774", "category": "hep-th", "title": "A note on the quantization of angular momentum for black holes", "abstract": "We argue that the gravitational path integral for rotating black holes is periodic in the angular velocity, implying the quantization of angular momentum in arbitrary dimensions for either asymptotically flat or AdS boundary conditions. In AdS$_3$, this periodicity is a consequence of the boundary mapping class group. In higher dimensions, the periodicity arises from an infinite family of saddles labeled by integer shifts of the angular velocity unrelated to the boundary mapping class group; summing over these saddles enforces quantization independently of any large boundary diffeomorphism. We construct these saddles explicitly for Kerr-Newman black holes in both asymptotically flat space and AdS$_4$, and observe that even the path integral for the 4D Schwarzschild black hole, typically the simplest case, receives contributions from an infinite set of rotating saddles.", "url": "https://arxiv.org/abs/2606.13774", "type": "理论", "summary": "1. 该工作通过引力路径积分的角速度周期性，论证了任意维度渐近平坦或AdS边界条件下黑洞角动量的普遍量子化。\n2. 其核心在于发现更高维度的周期性源于无限簇由角速度整数偏移标记的鞍点，求和后强制量子化，且与边界微分同胚无关。\n3. 这为理解黑洞微观态和量子引力中的角动量起源提供了基于鞍点求和的新视角。", "summary_source": "deepseek", "authors": [{"name": "Jon Goker"}, {"name": "Luca V. Iliesiu"}, {"name": "Elisa Tabor"}], "featured_authors": [{"name": "Jon Goker"}, {"name": "Luca V. Iliesiu"}, {"name": "Elisa Tabor"}], "author_count": 3}, {"id": "2606.13775", "category": "hep-th", "title": "Mirror symmetry on a circle", "abstract": "We investigate the small circle, or high temperature, limit of the supersymmetric index identities for the three-dimensional abelian mirror symmetry of SQED. There exist two possible limits, depending on how the parameters of the theory are scaled with the radius of the circle. In both cases the result is qualitatively similar. One side always reduces to the sphere partition function of a two-dimensional $\\mathcal{N}=(2,2)$ gauged linear sigma model (GLSM). The opposite side has a two-fold interpretation, either as the sphere partition function of the Landau--Ginzburg (LG) model that is Hori--Vafa dual to the GLSM, or as a Coulomb gas integral for a correlation function of Liouville or Toda CFT. This approach thus provides a systematic way to generate integral identities between partition functions of GLSMs on the one hand, and partition functions of LG models or CFT Coulomb gas integrals on the other. The latter perspective finds useful applications in the recently proposed 2d/2d correspondence, which relates sphere partition functions of unitary 2d $\\mathcal{N}=(2,2)$ theories and correlation functions of non-unitary 2d CFTs that both descend from compactifications of a unitary 4d $\\mathcal{N}=2$ SCFT. We present an example based on the $(A_{k-1},A_{N-1})$ Argyres--Douglas theories, where the CFT is a non-unitary minimal model. We also give a purely two-dimensional derivation of the identities obtained in the small circle limit which is inspired by the Kapustin--Strassler piecewise derivation of 3d abelian mirror symmetry.", "url": "https://arxiv.org/abs/2606.13775", "type": "理论", "summary": "1. 该工作研究了三维阿贝尔镜像对称的超对称指标在小圆极限下的两种标度行为，并建立了其与二维GLSM和LG模型及CFT库仑气体积分恒等式之间的系统联系。\n2. 技术核心在于揭示了恒等式两侧分别简化为二维GLSM和LG模型（或Liouville/Toda CFT库仑积分）的球面配分函数，并基于Kapustin-Strassler分段推导给出了纯二维证明。\n3. 这为2d/2d对应（四维超对称场论压缩导出二维理论与非酉CFT关联函数之间的对应）提供了系统生成恒等式的框架，并可用于Argyres-Douglas理论中非酉极小模型例子的验证。", "summary_source": "deepseek", "authors": [{"name": "Siqi Chen"}, {"name": "Shehab Hossam Fadda"}, {"name": "Matteo Sacchi"}], "featured_authors": [{"name": "Siqi Chen"}, {"name": "Shehab Hossam Fadda"}, {"name": "Matteo Sacchi"}], "author_count": 3}, {"id": "2606.13778", "category": "hep-th", "title": "Resurgence of the Thermal Transition between Bounce and Sphaleron", "abstract": "We study the thermal transition between the bounce and the sphaleron in quantum mechanics with a metastable vacuum from the viewpoint of Borel resurgence. For two models representing a second-order and a first-order transition, we compute the perturbative expansion of the thermal free energy to high orders and extract the leading Borel singularity data $(A,b,S)$ as functions of temperature. The Borel singularity location $A$ reproduces the on-shell action of the dominant saddle on both sides of the transition, joining smoothly in the second-order case and developing a kink in the first-order case. The characteristic exponent $b$ jumps between $0$ and $1/2$ across the transition, counting the zero modes of the corresponding saddle. The Stokes constant $S$ matches the one-loop determinant around the saddle. The perturbative expansion around the false vacuum thus determines the transition temperature, the order of the transition, and the decay rate including the one-loop prefactor without relying on semiclassical inputs.", "url": "https://arxiv.org/abs/2606.13778", "type": "理论", "summary": "1. 该工作从Borel重和视角研究了量子力学中从反弹到瞬子的热转变，通过高阶微扰计算提取了随温度变化的Borel奇点数据。\n2. 其核心在于奇点位置A再现了主导鞍点的在壳作用量，特征指数b在0与1/2间跳跃对应零模计数，Stokes常数S匹配单圈行列式，且无需半经典输入。\n3. 这为仅依赖微扰数据确定衰变率中的转变温度、转变阶数及单圈因子提供了自洽框架，有望推广至量子场论中的热相变过程。", "summary_source": "deepseek", "authors": [{"name": "Shaun D. Hampton"}, {"name": "Kyungsun Lee"}, {"name": "Sungjay Lee"}], "featured_authors": [{"name": "Shaun D. Hampton"}, {"name": "Kyungsun Lee"}, {"name": "Sungjay Lee"}], "author_count": 3}, {"id": "2606.13792", "category": "hep-th", "title": "RG Dynamics of Irrelevant Fermion Operators and the Drag Coupling Mechanism", "abstract": "We study the renormalization-group flow of higher-dimensional fermionic interactions $(\\psi^\\dagger \\psi)^{2n}$ in the presence of a Fermi surface. We show that the growth of the BCS four-fermion coupling induces a drag mechanism whereby higher-order fermionic couplings are driven to strong coupling in the infrared. We derive the corresponding beta functions and show that the drag effect applies generically to the whole tower of fermionic operators. Remarkably, although all couplings are driven toward the same strong-coupling scale, the renormalization-group flow preserves a hierarchy in which higher-dimensional operators remain parametrically suppressed relative to the BCS interaction. We then investigate this mechanism in a $2+1$-dimensional non-Fermi liquid coupled to a critical boson. While higher-order fermionic interactions are similarly enhanced along the flow, we show that they do not destabilize the IR stable non-Fermi-liquid fixed point, present for sufficiently large $N$. We briefly discuss possible implications for multicomponent superconductors and other strongly correlated metallic systems.", "url": "https://arxiv.org/abs/2606.13792", "type": "理论", "summary": "1. 本文研究存在费米面时高阶费米子相互作用的重整化群流，发现BCS四费米子耦合通过拖曳机制驱动高阶耦合在红外趋于强耦合。\n2. 其卖点在于推导了整座费米子算子塔的β函数，揭示出尽管所有耦合流向同一强耦合标度，RG流仍维持高维算子相对于BCS相互作用的参数压低层次。\n3. 在2+1维非费米液体中，该机制不破坏红外稳定固定点，为多组分超导体等强关联金属系统的理论描述提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Jeremias Aguilera-Damia"}, {"name": "Diego Rodriguez-Gomez"}, {"name": "Jorge Russo"}], "featured_authors": [{"name": "Jeremias Aguilera-Damia"}, {"name": "Diego Rodriguez-Gomez"}, {"name": "Jorge Russo"}], "author_count": 3}, {"id": "2606.13820", "category": "hep-th", "title": "Unifying Gravities with Internal Interactions based on $SO(10)$ GUT", "abstract": "Building on two key ingredients, namely the well established gauge-theoretic formulation of gravity and the observation that the tangent space of a curved manifold need not have the same dimension as the manifold, we discuss how all known fundamental interactions can be accommodated within a single unified framework. The unification is realised by enlarging the tangent group of the four-dimensional spacetime manifold to $SO(2,16)$, a choice that simultaneously encompasses both the gauge group underlying the gravitational sector and the $SO(10)$ Grand Unified Theory for the internal interactions. The gravitational theories entering this construction are Conformal Gravity and Fuzzy (Noncommutative) Gravity, each formulated in gauge-theoretic terms.", "url": "https://arxiv.org/abs/2606.13820", "type": "理论", "summary": "1. 该工作基于重力的规范理论表述与流形切空间维度可独立于流形维度的思想，将四维时空的切群扩展为SO(2,16)，从而在单一几何框架内统一引力与SO(10)大统一内部相互作用。\n2. 其核心是同时将共形引力和模糊(非交换)引力这两种规范理论型引力纳入该构造，使引力与内部分支的规范群自然合并于扩大的切群中。\n3. 这一统一方案为探索时空切空间的结构自由度与基本力深度整合提供了新的几何路径，并为后续无重力奇异性的理论发展提供启示。", "summary_source": "deepseek", "authors": [{"name": "Stelios Stefas"}, {"name": "George Zoupanos"}], "featured_authors": [{"name": "Stelios Stefas"}, {"name": "George Zoupanos"}], "author_count": 2}, {"id": "2606.13889", "category": "hep-th", "title": "Flat Space Entanglement: A Coulomb Branch Perspective", "abstract": "We study holographic entanglement entropy in Coulomb-branch solutions describing spherical shells of D$p$-branes. The corresponding throat geometries contain a flat-space bubble in the infrared region, providing a concrete top-down framework for exploring holographic entanglement of flat space. We find that the flat-space region is associated with a reduction of entanglement and of the effective infrared degrees of freedom in the dual boundary state relative to the standard vacuum. We also examine internal RT surfaces and holographic complexity, and show that they exhibit similar qualitative behavior. Finally, we comment on the broader implications of our results for flat space holography.", "url": "https://arxiv.org/abs/2606.13889", "type": "理论", "summary": "1. 该工作通过Dp-膜球壳的库仑分支解研究全息纠缠熵，其红外区域包含平直空间气泡。\n2. 核心发现是平直空间区域导致边界态纠缠与有效红外自由度相对标准真空降低，且内禀RT面与复杂度呈现类似行为。\n3. 这为平直空间全息对偶的纠缠结构与红外微观自由度提供具体框架与定量启示。", "summary_source": "deepseek", "authors": [{"name": "Eivind Jørstad"}, {"name": "Robert C. Myers"}, {"name": "Sabrina Pasterski"}], "featured_authors": [{"name": "Eivind Jørstad"}, {"name": "Robert C. Myers"}, {"name": "Sabrina Pasterski"}], "author_count": 3}, {"id": "2606.14016", "category": "hep-th", "title": "Black hole thermodynamics and KK photon quantum corrections in 2D effective dilaton gravity", "abstract": "We study black hole thermodynamics using a two-dimensional effective theory obtained by dimensional reduction of four-dimensional Einstein--Maxwell theory. For spherically symmetric charged black holes, the resulting dilaton gravity has a nonlinear potential that reproduces the semiclassical phase structure of four-dimensional AdS black holes, including the Hawking--Page transition and the small/large Reissner--Nordström--AdS black hole transition. This shows that the two-dimensional theory before taking the near-horizon and near-extremal limits captures non-extremal thermodynamics beyond the Jackiw--Teitelboim gravity regime. We also include electromagnetic Kaluza--Klein modes on the internal sphere and integrate them out to derive the one-loop effective dilaton gravity. At leading order in the derivative expansion, these corrections appear as constant shifts in the black hole entropy and in the effective charge parameter of the dilaton potential. Therefore, the semiclassical phase structure is not qualitatively modified within this leading local approximation.", "url": "https://arxiv.org/abs/2606.14016", "type": "理论", "summary": "1. 该工作从四维爱因斯坦–麦克斯韦理论维度约化导出二维膨胀引力，利用其非线性势研究带电AdS黑洞的半经典热力学相结构，并计算电磁Kaluza–Klein光子的一圈量子修正。\n2. 核心在于二维理论在未取近极端极限时即精确复现四维的Hawking–Page转变与小大RN-AdS黑洞转变，而KK光子修正以常数平移熵与有效电荷，在领头导数近似下不改变相结构定性特征。\n3. 这为在简化二维框架内分析非极端黑洞热力学的量子修正提供了可靠平台，并启示此类有效引力可超越Jackiw–Teitelboim范围，推广至更一般的黑洞量子效应研究。", "summary_source": "deepseek", "authors": [{"name": "Yoshihiko Abe"}, {"name": "Tetsutaro Higaki"}, {"name": "Yu Miyauchi"}], "featured_authors": [{"name": "Yoshihiko Abe"}, {"name": "Tetsutaro Higaki"}, {"name": "Yu Miyauchi"}], "author_count": 3}, {"id": "2606.14115", "category": "hep-th", "title": "Hydrodynamics of Nonminimal $F^{(a)αβ} F^{(a)γλ} R_{αγ} R_{βλ}$ AdS Black Brane", "abstract": "We investigate the hydrodynamic properties of a strongly coupled non-Abelian plasma dual to a four-dimensional AdS black brane with a nonminimal coupling of the form $q_2 F^{(a)\\alpha\\beta}F^{(a)\\gamma\\lambda}R_{\\alpha\\gamma}R_{\\beta\\lambda}$ in the bulk action. This higher-derivative term introduces a direct interaction between the Yang-Mills field strength and the Ricci tensor, leading to corrections beyond the minimal Einstein-Yang-Mills theory. Using a perturbative expansion in the small coupling $q_2$, we construct the black brane solution up to first order and employ the fluid-gravity correspondence to compute two key transport coefficients: the DC color conductivity $\\sigma$ and the shear viscosity to entropy density ratio $\\eta/s$. In holography, $\\eta/s$ is inversely proportional to the square of the coupling constant of the boundary theory, while $\\sigma$ in Einstein-Maxwell theory satisfies a universal lower bound $\\sigma \\ge 1$ (in units where $\\hbar=1$), saturated for uncharged black holes and characterizing a perfect quantum critical fluid. Our results reveal that the nonminimal coupling significantly alters these transport quantities. For the DC conductivity, we find $\\sigma = 1 - q_2 \\bigl(9\\kappa Q^2/(L^2 r_h^4) + 7\\kappa^2 Q^4/(4 r_h^8)\\bigr)$, indicating a violation of the conductivity bound for $q_2>0$ while the bound is preserved for $q_2<0$. For the shear viscosity, we obtain $\\eta/s = (1/(4\\pi))\\bigl(1 + q_2\\, 7\\kappa^2 Q^4/(2 r_h^8)\\bigr)$, showing that the KSS bound is modified by a term linear in $q_2$. The sign of $q_2$ determines whether the ratio increases above or decreases below the universal value $1/(4\\pi)$. These findings highlight the sensitivity of holographic transport to curvature-coupled gauge interactions and provide a controlled example of how higher-derivative corrections influence the hydrodynamic regime of strongly coupled plasmas.", "url": "https://arxiv.org/abs/2606.14115", "type": "理论", "summary": "1. 该工作通过流体-引力对偶，研究了含非最小耦合项 \\(q_2 F^{(a)\\alpha\\beta}F^{(a)\\gamma\\lambda}R_{\\alpha\\gamma}R_{\\beta\\lambda}\\) 的四维AdS黑洞膜边界强耦合非阿贝尔等离子体的流体力学性质。\n2. 其物理卖点在于发现DC色电导率 \\(\\sigma\\) 和黏熵比 \\(\\eta/s\\) 均受耦合常数 \\(q_2\\) 的线性修正，且正负 \\(q_2\\) 分别导致电导率下界的违反或保持、黏熵比偏离KSS界限。\n3. 这为理解曲率-规范耦合如何调控全息输运系数提供了受控范例，并启示在一般高阶导数引力中输运界限可能被显著修改。", "summary_source": "deepseek", "authors": [{"name": "Mehdi Sadeghi"}], "featured_authors": [{"name": "Mehdi Sadeghi"}], "author_count": 1}, {"id": "2606.14140", "category": "hep-th", "title": "Quantum Entanglement of Bethe States", "abstract": "We investigate the quantum entanglement of Bethe states across a family of integrable spin chains, including the XXX$_{\\frac{1}{2}}$ model, its higher-spin generalizations (XXX$_s$), and the non-compact $SL(2,\\mathbb{R})$ chain. For on-shell eigenstates, we perform a comprehensive scan of the bipartite entanglement entropy across the entire spectrum of finite chains with periodic boundary conditions, and identify the Bethe solutions that minimize and maximize the entanglement. These extremal solutions follow systematic, spin-dependent patterns in the Bethe quantum numbers. In the XXX$_{\\frac{1}{2}}$ spin chain, for the antiferromagnetic chain, the state with minimal entropy always coincides with the lowest-energy state (the ground state) within a given fixed-magnon sector. For the higher-spin XXX$_s$ model, however, the lowest-entropy state is not always identical to the ground state, and can even be the state of highest energy. By contrast, the Bethe roots that maximize entropy exhibit considerably more intricate structure. Our analysis further reveals how special Bethe root configurations, such as singular and strange solutions, affect entanglement, and it uncovers characteristic entanglement features in the non-compact $SL(2,\\mathbb{R})$ chain that are absent from compact spin chains. For off-shell Bethe states, we develop an optimization algorithm that extremizes the entanglement entropy over rapidity distributions, enabling us to explore the maximum entanglement achievable by a Bethe state without imposing the Bethe ansatz equations.", "url": "https://arxiv.org/abs/2606.14140", "type": "理论", "summary": "1. 该工作系统扫描了XXX₁/₂、XXXₛ与SL(2,R)可积自旋链在周期边界条件全谱中Bethe态的二部纠缠熵，识别出极值Bethe解并分析其Bethe量子数模式。\n2. 核心发现是：低自旋反铁磁链中最小纠缠态恒为固定磁子数扇区的基态，而高自旋XXXₛ最小纠缠态可能对应最高能态；奇异根和奇怪解显著影响纠缠，非紧致链展现出紧致链缺失的特征纠缠行为。\n3. 这为理解可积模型中纠缠结构的系统性规律提供了明确框架，所发展的非壳Bethe态纠缠优化算法可推广至其他量子可积系统极值纠缠的探索。", "summary_source": "deepseek", "authors": [{"name": "Yu Hao"}, {"name": "Yunfeng Jiang"}, {"name": "Bi-Quan Yang"}, {"name": "De-liang Zhong"}], "featured_authors": [{"name": "Yu Hao"}, {"name": "Yunfeng Jiang"}, {"name":
