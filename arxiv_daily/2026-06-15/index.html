 "Bi-Quan Yang"}, {"name": "De-liang Zhong"}], "author_count": 4}, {"id": "2606.14208", "category": "hep-th", "title": "Real-time pseudo entropy and modular-Hamiltonian correlations", "abstract": "Pseudo entropy is a complex-valued generalization of entanglement entropy defined from a reduced transition matrix. We study the pseudo entropy associated with a real-time transition matrix between an initial pure state and its unitary time evolution. For a subsystem $A$, we show that the short-time behavior of real-time pseudo entropy is governed by the correlation between the physical Hamiltonian $H$ and the modular Hamiltonian $K_A=-\\log\\rho_A$ of the initial reduced state, $ S_A(t,0)=S_A(0)-it \\langle K_A(H-\\langle H\\rangle)\\rangle + \\mathcal{O}(t^2)$. For Hermitian dynamics, the initial imaginary response is controlled by the symmetrized covariance of $H$ and $K_A$ with an overall minus sign, while the initial real response is governed by their commutator. Thus the imaginary part of real-time pseudo entropy is not merely a branch artifact: it is a time-oriented modular response generated by the correlation between microscopic time evolution and subsystem coarse graining. We clarify the relation of this result to the known first law of pseudo entropy, derive an all-order expression in a Schmidt-diagonal model, recover thermal pseudo entropy as a special case, illustrate the covariance/commutator decomposition in a two-qubit model, and confirm the covariance response in transverse-field Ising-chain quenches, including a finite-size study of a modular susceptibility near the Ising critical region. We discuss how this amplitude-level oriented response can be related to ordinary entropy production, and also give a concrete $\\mathcal{PT}$-symmetric toy-model illustration of the non-Hermitian extension.", "url": "https://arxiv.org/abs/2606.14208", "type": "理论", "summary": "1. 该论文研究初始纯态经实时演化后子系统赝熵的短时行为。\n2. 卖点在于揭示赝熵虚部由物理哈密顿量与模哈密顿量的对称化协方差主导，实部由其对易子决定。\n3. 这为理解时间演化与粗粒化导致的定向模响应及其与熵产生的关联提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Tatsuhiro Misumi"}], "featured_authors": [{"name": "Tatsuhiro Misumi"}], "author_count": 1}, {"id": "2606.14469", "category": "hep-th", "title": "On the branes behind scale-separated AdS$_{3}$ flux vacua", "abstract": "We investigate the brane origin of supersymmetric and scale-separated AdS$_3$ flux vacua arising in a class of type IIB orientifold reductions with G$_2$-structure. First, using the effective three-dimensional supergravity together with explicit uplift formulae, we trace back the $F_{(7)}$ and $F_{(3)}$ fluxes responsible for scale separation and identify the type IIB background that is probed by the corresponding D1- and D5-branes. Second, by restoring such D1- and D5-branes, we obtain a type IIB solution that interpolates between the previous background in the asymptotic region and the scale-separated AdS$_3$ flux vacua in the near-horizon region. Third, by working directly in ten dimensions, we construct a codimension-one D1-D5-KK5 intersection whose near-horizon region realises the scale-separated AdS$_3$ flux vacua. Our results provide a higher-dimensional interpretation of these flux vacua in terms of (smeared) brane configurations.", "url": "https://arxiv.org/abs/2606.14469", "type": "理论", "summary": "1. 该工作通过IIB型弦论中G₂结构orientifold约化的三维超引力分析，系统研究了超对称且尺度分离的AdS₃通量真空的膜起源。\n2. 主要技术卖点在于：利用有效超引力与显式提升公式追溯F₇和F₃通量，并在十维中构造D1-D5-KK5膜交截，其近心区域精确对应尺度分离AdS₃真空。\n3. 这为理解通量紧化中的尺度分离现象提供了基于膜构型的统一框架，并启示了尺度分离AdS真空可视为膜交截近心区几何的观点。", "summary_source": "deepseek", "authors": [{"name": "Álvaro Arboleya"}, {"name": "Adolfo Guarino"}, {"name": "Clara Roldán-Domínguez"}, {"name": "Giuseppe Sudano"}], "featured_authors": [{"name": "Álvaro Arboleya"}, {"name": "Adolfo Guarino"}, {"name": "Clara Roldán-Domínguez"}, {"name": "Giuseppe Sudano"}], "author_count": 4}, {"id": "2606.14541", "category": "hep-th", "title": "Yang-Baxter symmetries of Type II supergravity", "abstract": "We provide a complete proof that Yang--Baxter bi-vector deformations are solution generating transformations in Type II supergravity. The proof does not rely on the assumption that the vielbein is invariant under Lie derivative along all Killing vectors entering the bi-vector. We analyse transformation of boundary terms and derive a simple expression for the case, when the boundary does not change its geometrical locus.", "url": "https://arxiv.org/abs/2606.14541", "type": "理论", "summary": "1. 该工作给出了Yang–Baxter双矢量形变是II型超引力中解生成变换的完整证明。\n2. 其卖点在于证明不依赖vielbein在沿所有Killing矢量的李导数下不变的假设，并导出了边界不变时的简单变换表达式。\n3. 这为超引力中可积σ模型的形变构造及边界效应的系统处理提供了更一般的理论基础。", "summary_source": "deepseek", "authors": [{"name": "Igor Bogatyrev"}, {"name": "Edvard T. Musaev"}, {"name": "Timophey Petrov"}], "featured_authors": [{"name": "Igor Bogatyrev"}, {"name": "Edvard T. Musaev"}, {"name": "Timophey Petrov"}], "author_count": 3}, {"id": "2606.14572", "category": "hep-th", "title": "Heavenly equations in de Sitter space", "abstract": "We demonstrate that all anti-self-dual Einstein metrics with non--zero cosmological constant $\\Lambda$ locally arise from solutions of a single second order PDE introduced by Lipstein and Nagy. We show how this equation fits into the hyper--heavenly formalism of Plebański, and establish a Lax pair. Finally we show how Plebański's second heavenly equation arises in the limit as $\\Lambda\\rightarrow 0$.", "url": "https://arxiv.org/abs/2606.14572", "type": "理论", "summary": "1. 该工作证明了所有具有非零宇宙常数的反自对偶爱因斯坦度量局部地由Lipstein-Nagy二阶偏微分方程的解给出。\n2. 其关键进展是将该方程嵌入Plebański超天形式体系，并建立了相应的Lax对，同时揭示了宇宙常数趋于零时退化为第二天方程的极限行为。\n3. 这为de Sitter空间中引力可积结构的分类以及反自对偶方程与超天形式论的统一理解提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Maciej Dunajski"}, {"name": "Timothy Moy"}], "featured_authors": [{"name": "Maciej Dunajski"}, {"name": "Timothy Moy"}], "author_count": 2}, {"id": "2606.14575", "category": "hep-th", "title": "A Supernova Constraint on F-theory", "abstract": "We study constraints on the quantum chromodynamics (QCD) axion in F-theory, a strongly coupled limit of string theory. We build models of QCD from compactifications to four dimensions on elliptic fibrations over toric threefolds $B_3$, characterized by an integer $N=h^{1,1}(B_3)$. The QCD axion mass increases with $N$, and we find that models with sufficiently high $N$ are inconsistent with observations of the neutrino burst from supernova 1987A, disfavoring large regions of the moduli space. Specifically, at least $95\\%$ of models with $N \\ge 8,791$ -- a regime that arguably contains the vast majority of known F-theory topologies -- have a QCD axion mass $m_{QCD}>15~meV$ and are thus constrained. This limit is independent of cosmology. We only consider weakly-curved threefolds, where $\\alpha'$ corrections are plausibly negligible.", "url": "https://arxiv.org/abs/2606.14575", "type": "理论", "summary": "1. 该工作利用超新星1987A中微子暴观测，对F理论紧致化中由整数N=h^{1,1}(B_3)表征的QCD轴子质量施加了约束。\n2. 其核心在于发现轴子质量随N单调递增，且当N≥8791时至少95%模型的轴子质量超过15 meV，从而被排除，该约束独立于宇宙学假设。\n3. 此结果在仅考虑α'修正可忽略的弱曲率三维流形前提下，为弦论景观中轴子参数空间提供了强有力筛选，指导未来模型构建与实验搜寻。", "summary_source": "deepseek", "authors": [{"name": "Sebastian Vander Ploeg Fallon"}, {"name": "James Halverson"}, {"name": "Liam McAllister"}, {"name": "David J. E. Marsh"}], "featured_authors": [{"name": "Sebastian Vander Ploeg Fallon"}, {"name": "James Halverson"}, {"name": "Liam McAllister"}, {"name": "David J. E. Marsh"}], "author_count": 4}, {"id": "2606.14641", "category": "hep-th", "title": "On the gauge-invariant dynamical charges and densities of the 1-instanton solution", "abstract": "We study the gauge invariant dynamically conserved charges, and their corresponding densities, for instanton solutions of Yang-Mills theories in four dimensional Euclidean space, for the gauge group SU(2). Those charges were constructed in [1,2] through the integral equations of Yang-Mills theory, using techniques on generalized loop spaces. We use the integral non-Abelian Gauss law to evaluate the gauge-invariant flux of the magnetic and electric non-abelian fields through spherical surfaces centered at origin of the instanton solution. From such a flux, we define gauge-invariant charge densities by considering the charge within an infinitesimal spherical shell of radius $r$. We discuss the issue of the reparameterization invariance of the charges and densities, and show that the magnetic and electric fluxes for the instanton and anti-instanton, at the Euclidean time $x^4 = 0$ and radius $r=1$, which here corresponds to the size $\\lambda$ of those solutions, are non-zero and observable. Our results give an interesting picture of the internal structure of the instanton, and may be important for the properties of the Yang-Mills $\\theta$-vacuum.", "url": "https://arxiv.org/abs/2606.14641", "type": "理论", "summary": "1. 该工作利用非阿贝尔高斯定律的积分形式，评估以SU(2)杨-米尔斯1-瞬子解原点为中心球面上的规范不变磁电通量，进而定义动力学守恒荷及其径向密度。\n2. 其关键是从无穷小球壳通量导出规范不变电荷密度，证明瞬子与反瞬子在欧几里得时间切片x^4=0且半径等于解尺寸λ时磁电通量非零可观测，并论证密度定义满足重参数化不变性。\n3. 该规范不变内部结构图像为理解杨-米尔斯θ真空的拓扑电荷分布及瞬子物质相的可观测量提供了重要理论视角。", "summary_source": "deepseek", "authors": [{"name": "C. A. da Silva"}, {"name": "L. A. Ferreira"}], "featured_authors": [{"name": "C. A. da Silva"}, {"name": "L. A. Ferreira"}], "author_count": 2}, {"id": "2606.14676", "category": "hep-th", "title": "Primal Bootstrap for Pion Scattering at Large-N", "abstract": "We introduce a basis for tree-level meromorphic scattering amplitudes suitable for describing pion scattering in the large-N limit. The basis is constructed as linear combinations of Lovelace-Shapiro-like amplitudes with varying Regge slopes and intercepts. The resulting amplitudes satisfy by construction the fundamental requirements of analyticity, crossing symmetry, and Regge behavior. We analyze their behavior in specific kinematical regimes, including the high-energy fixed-angle limit. We also show that finite linear combinations of our basis elements need not violate unitarity. Nonetheless, because unitarity is not imposed by construction, we enforce it a posteriori by requiring positivity of the partial-wave decomposition. This condition can be formulated as an optimization problem and solved numerically. The solutions to this primal bootstrap problem yield meromorphic amplitudes that satisfy all the aforementioned constraints. We compare several observables with the bounds obtained from the dual positivity conditions and show that our family of amplitudes spans the full allowed parameter space. With appropriate modifications, this method can be extended to construct amplitude families for broader applications.", "url": "https://arxiv.org/abs/2606.14676", "type": "理论", "summary": "1. 该工作为Large-N极限下的π介子散射引入了树级亚纯振幅的基函数，由不同Regge斜率和截距的Lovelace-Shapiro型振幅线性组合而成。\n2. 其卖点在于通过构造满足解析性、交叉对称性与Regge行为后，利用部分波分解的正定性作为优化约束实现幺正性，从而数值求解原初自举问题。\n3. 这为构建更广泛散射振幅族提供了可扩展的方法，有望推广至其他涉及亚纯振幅的自举应用。", "summary_source": "deepseek", "authors": [{"name": "Sebastiano Bocchia"}, {"name": "Alessandro Vichi"}], "featured_authors": [{"name": "Sebastiano Bocchia"}, {"name": "Alessandro Vichi"}], "author_count": 2}, {"id": "2606.13881", "category": "math-ph", "title": "A Betchov-Type Hydrodynamic Formulation of the Ivancevic Option-Pricing Equation", "abstract": "We show that, under constant-coefficient assumptions, the Ivancevic option-pricing nonlinear Schrödinger equation admits a Betchov-type hydrodynamic formulation analogous to the one appearing in the context of the vortex filament equation. We identify the corresponding continuity equation and momentum-type conservation law satisfied by the density--velocity pair and illustrate the formulation on known Ivancevic-type soliton solutions. The resulting interpretation is structural and model-dependent, and is intended as a bridge between nonlinear wave formulations in mathematical finance and geometric fluid mechanics.", "url": "https://arxiv.org/abs/2606.13881", "type": "理论", "summary": "1. 该工作证明，在常系数假设下，Ivancevic期权定价非线性薛定谔方程可化为与涡旋丝方程类似的Betchov型流体动力学表述。\n2. 其核心在于识别出密度‑速度对满足的连续性方程及动量型守恒律，并在已知孤子解上验证了该表述的几何结构一致性。\n3. 这为数学金融中的非线性波模型与几何流体力学之间建立形式桥梁，启发跨学科守恒律结构的研究。", "summary_source": "deepseek", "authors": [{"name": "Sandeep Kumar"}], "featured_authors": [{"name": "Sandeep Kumar"}], "author_count": 1}, {"id": "2606.13932", "category": "math-ph", "title": "Krein Space Quantization and a Spectral Interpretation of the Riemann $ξ$-Function", "abstract": "The invariant two-point function of a scalar field in de Sitter spacetime can be expressed in terms of Legendre functions via Lorentzian harmonic analysis. Using this structure together with the Mehler--Fock transform, we obtain an integral representation of the completed Riemann $\\xi$-function in which the Legendre kernel appears naturally. Motivated by this correspondence, we introduce a retarded propagator whose spectral weight is given by the $\\xi$-function and analyze it within the framework of Krein space quantization, where sign-indefinite spectral measures are admissible. This construction yields a geometric and spectral interpretation of the $\\xi$-function restricted to the critical line and relates the asymptotic spacing of its zeros to a mass--time scaling in de Sitter geometry. The results provide a novel interpretive framework linking de Sitter quantum field theory, harmonic analysis, and analytic number theory.", "url": "https://arxiv.org/abs/2606.13932", "type": "理论", "summary": "1. 该工作通过de Sitter时空中标量场的不变两点函数与Mehler-Fock变换，获得完整Riemann ξ函数的积分表示，并引入以ξ函数为谱权重的延迟传播子。\n2. 其卖点在于利用Krein空间量子化处理符号不定谱测度，将临界线上ξ函数赋予几何与谱解释，并关联零点渐近间距与de Sitter几何中的质量-时间标度。\n3. 这为量子场论、调和分析与解析数论之间提供了新的交叉框架，启发了通过时空几何结构研究ζ函数零点分布的可能途径。", "summary_source": "deepseek", "authors": [{"name": "M.V. Takook"}], "featured_authors": [{"name": "M.V. Takook"}], "author_count": 1}, {"id": "2606.14559", "category": "math-ph", "title": "Coherent structures and bifurcation analysis in a toxin-driven plant-herbivore model", "abstract": "This work investigates how toxin-mediated interactions and directed movements shape the emergence of coherent structures in plant-herbivore systems. The analysis focuses on a two-compartment model enclosing a toxin-dependent functional response and a cross-diffusion term that represents ecologically plausible herbivores' movement towards, or away from, vegetation. Two distinct dynamical regimes arise depending on toxicity strength. Under weak toxicity, the system admits at most one biologically feasible coexistence equilibrium, which may lose stability through a Hopf bifurcation generating small-amplitude temporal oscillations. Under strong toxicity, the nonlinear functional response becomes non-monotonic, allowing for multiple coexistence equilibria and abrupt regime shifts. The influence of cross-diffusion on stability is also examined, identifying the conditions under which Turing instabilities and mixed spatiotemporal patterns occur. Near the corresponding bifurcation thresholds, Stuart-Landau amplitude equations are derived via weakly nonlinear analysis, providing a unified framework for the modulation of oscillatory, stationary, and combined Turing-Hopf modes. Numerical simulations corroborate the theoretical predictions, illustrating transitions from spatially uniform states to oscillations, spatial patterns, and mixed behaviour. Overall, this manuscript highlights how chemical defences, nonlinear feedbacks, and movement strategies jointly determine the emergence, selection, and robustness of coherent structures in plant-herbivore systems.", "url": "https://arxiv.org/abs/2606.14559", "type": "理论", "summary": "1. 该工作基于带毒素依赖Holling型功能响应与符号依赖交叉扩散的两室模型，系统分析了植物-食草动物系统由毒性强度与定向运动诱导的分岔及相干结构。\n2. 其核心在于揭示了弱毒性下单定态经Hopf分岔产生振荡，强毒性下非单调响应导致多定态与突变，并通过弱非线性分析导出Stuart-Landau方程，统一刻画了Turing失稳与Hopf模式耦合的时空振幅调制。\n3. 数值模拟验证了理论预测，表明该框架为理解化学防御、非线性反馈与运动策略协同决定生态系统空间复杂性的涌现与稳健性提供了普适工具，可推广至同类交叉扩散反应-扩散系统。", "summary_source": "deepseek", "authors": [{"name": "Grifo Gabriele"}, {"name": "Valenti Giovanna"}], "featured_authors": [{"name": "Grifo Gabriele"}, {"name": "Valenti Giovanna"}], "author_count": 2}, {"id": "2606.14613", "category": "math-ph", "title": "Tensor network manifolds and Riemannian fundamental theorem for tensor networks", "abstract": "Tensor networks provide a powerful framework for efficiently representing high-dimensional data and many-body quantum states. Endowing tensor networks with a Riemannian manifold structure provides a natural setting for numerical optimization and analysis. A central feature of tensor networks is their gauge freedom, whose characterisation (captured by so-called fundamental theorems) underlies both their intrinsic structure and the design of numerical algorithms. In this work, we study the interaction between the Riemannian manifold structure and the gauge freedom for several families of tensor networks. Using group actions and Riemannian submersions, we establish a Riemannian fundamental theorem for the tensor network families studied.", "url": "https://arxiv.org/abs/2606.14613", "type": "理论", "summary": "1. 本文利用群作用和黎曼淹没方法，为多个张量网络族建立了黎曼基本定理。\n2. 其核心在于系统揭示了规范自由度与张量网络黎曼流形结构之间的相互作用机制。\n3. 这为张量网络的几何优化算法和内在结构分析提供了严格的数学基础。", "summary_source": "deepseek", "authors": [{"name": "Pablo Páez-Velasco"}], "featured_authors": [{"name": "Pablo Páez-Velasco"}], "author_count": 1}, {"id": "2606.13779", "category": "quant-ph", "title": "Computational regimes in matrix-product-state-based quantum trajectory simulations", "abstract": "Efficient simulation of open quantum systems is central to modeling noisy quantum hardware and many-body dynamics. In trajectory-based tensor network methods, cost is often associated with trajectory-level quantities such as entanglement growth or bond dimension. However, the total cost of a fixed-accuracy simulation also depends on statistical sampling, and the interplay between per-trajectory complexity and sampling effort remains poorly understood. Here we introduce a cost-resolved framework for matrix product state (MPS)-based quantum trajectory simulations that decomposes total cost into memory per trajectory, runtime per trajectory, and sampling effort. We show that physically equivalent stochastic unravelings of the same Lindblad dynamics do not necessarily reduce total cost, but instead redistribute cost between trajectory complexity and statistical convergence. This trade-off is quantified by two dimensionless inflation factors: a bond dimension inflation $\\alpha$ and a sampling inflation $\\kappa$, which together determine the preferred unraveling under hardware-dependent memory and parallelism constraints. We provide a practical protocol for extracting $(\\alpha,\\kappa)$ from modest pilot simulations and demonstrate it using benchmarks across multiple noise channels. The resulting decision maps show that the computationally favorable unraveling can change with noise strength, time-step resolution, system size, and available parallelism. These results establish unraveling choice as a hardware-aware simulation design problem rather than an intrinsic optimization of trajectory entanglement alone.", "url": "https://arxiv.org/abs/2606.13779", "type": "理论+数值", "summary": "1. 该工作针对基于矩阵乘积态的量子轨迹模拟，提出了一个将总成本分解为每轨迹内存、每轨迹运行时间和采样开销的解析框架。\n2. 其核心在于揭示物理等价的随机退耦方式并不必然降低总成本，而是通过键维膨胀因子α与采样膨胀因子κ量化轨迹复杂度与统计收敛之间的权衡。\n3. 这为在噪声强度、时间步长、系统规模和并行度等硬件约束下选择最优退耦方案提供了决策图，将退耦选择重塑为硬件感知的模拟设计问题。", "summary_source": "deepseek", "authors": [{"name": "Aaron Sander"}, {"name": "Simon Cichy"}, {"name": "Martin Eigel"}, {"name": "Jens Eisert"}, {"name": "Maximilian Fröhlich"}, {"name": "Tom Peham"}, {"name": "Robert Wille"}], "featured_authors": [{"name": "Aaron Sander"}, {"name": "Simon Cichy"}, {"name": "Martin Eigel"}, {"name": "Maximilian Fröhlich"}, {"name": "Tom Peham"}, {"name": "Robert Wille"}], "author_count": 7}, {"id": "2606.13810", "category": "quant-ph", "title": "Universal Crossovers of Stabilizer Entropy Beyond Criticality", "abstract": "Stabilizer Rényi entropy has emerged as a probe of nonstabilizerness in quantum many-body systems, but its scaling structure beyond critical points remains poorly understood compared with entanglement entropy. Recent field-theory approaches indicate that stabilizer entropy contains universal critical data and boundary-sensitive terms, raising the question of how these structures extend into massive and crossover regimes. We address this problem for a broad class of finite-range spin chains at Rényi index one-half. We derive exact finite-size formulas for both full periodic chains and finite intervals of the infinite chain, making the universal crossover from critical to noncritical behavior analytically accessible. In periodic geometry, the entropy obeys a volume law away from criticality and exhibits a universal finite-size crossover controlled by the competition between system size and correlation length. We also show that the large-scale SRE density develops a cusp across the field-tuned critical line, while the XX endpoint is governed by a distinct scaling regime associated with the saturation point. In the subsystem geometry, the interval entropy separates bulk critical behavior from boundary contributions generated by the way the finite region cuts the infinite chain. The crossover from critical to massive behavior is then encoded in boundary constants and universal functions controlled by the correlation length. Through exact stabilizer-entropy correspondences, the scaling theory extends to internal XY reductions, Finite-range spin chains, and Cluster--Ising representatives. Our results provide an exact lattice benchmark for the emerging QFT description of stabilizer entropy beyond isolated conformal points.", "url": "https://arxiv.org/abs/2606.13810", "type": "理论", "summary": "1. 该工作在Rényi指数二分之一下，对有限范围自旋链导出精确有限尺寸公式，解析刻画了稳定子熵从临界到非临界行为的普适交叉。\n2. 其卖点在于揭示了周期几何中熵的体积律及系统尺寸与关联长度竞争所致的普适交叉，以及子系统几何中体临界行为与边界贡献的分离。\n3. 这为稳定子熵超越孤立共形点的量子场论描述提供了精确晶格基准，并可通过精确对应扩展到XY约化、Cluster-Ising等模型。", "summary_source": "deepseek", "authors": [{"name": "Reyhaneh Khasseh"}, {"name": "E. A. Ramirez Trino"}, {"name": "M. A. Rajabpour"}], "featured_authors": [{"name": "Reyhaneh Khasseh"}, {"name": "E. A. Ramirez Trino"}, {"name": "M. A. Rajabpour"}], "author_count": 3}, {"id": "2606.13811", "category": "quant-ph", "title": "Aligning Quantum Operators with Large Language Models", "abstract": "Can Large Language Models (LLMs) understand and reason about quantum operators? Despite their remarkable capabilities in mathematics and symbolic reasoning, LLMs remain inherently blind to quantum representations such as unitary matrices. In this work, we take a step toward bridging this gap by introducing an approach that maps unitary operators into the latent space of an LLM, enabling unified modeling over quantum and linguistic inputs. We instantiate this idea on Clifford+T circuit synthesis over a Pauli rotation gate set, where our model achieves results competitive with state-of-the-art methods and scales consistently with training data, with no signs of saturation. Our approach further enables language-conditioned synthesis, allowing gate constraints unseen during training to be specified directly in natural language. This work suggests a path toward quantum--aware foundation models that can natively interpret and reason about quantum operations, which could have broader implications reaching across quantum compilation and algorithm discovery.", "url": "https://arxiv.org/abs/2606.13811", "type": "理论+数值", "summary": "1. 该工作提出将酉算子映射到大语言模型潜在空间的方法，实现量子与语言输入的统一建模。\n2. 其技术卖点在于在Clifford+T电路综合任务上达到竞争性能，并支持以自然语言指定训练未见的门约束。\n3. 这为构建原生理解量子操作的量子感知基础模型开辟了路径，有望推动量子编译与算法发现。", "summary_source": "deepseek", "authors": [{"name": "Rogerio Feris"}, {"name": "Yunchao Liu"}, {"name": "Pengyuan Li"}, {"name": "Hang Hua"}, {"name": "David Kremer"}], "featured_authors": [{"name": "Rogerio Feris"}, {"name": "Yunchao Liu"}, {"name": "Pengyuan Li"}, {"name": "Hang Hua"}, {"name": "David Kremer"}], "author_count": 5}, {"id": "2606.13824", "category": "quant-ph", "title": "Calibrated Helstrom geometry on the Bloch ball via Connes spectral distance", "abstract": "We show that the equal-prior Helstrom trace-distance geometry of qubit states is recovered from Connes spectral distance in a finite scalar-qubit-scalar model. The two scalar reference sectors couple isotropically to the qubit block through identity Dirac links, so that the full Bloch ball, including mixed states, inherits its standard chordal trace-distance geometry from the finite spectral metric. The scalar-sector distances serve a distinct calibration role: they determine the individual link lengths, satisfy a Pythagorean consistency relation, and reconstruct the middle-sector scale.", "url": "https://arxiv.org/abs/2606.13824", "type": "理论", "summary": "1. 本文在有限标量-量子比特-标量模型中证明，等先验Helstrom迹距离几何可从Connes谱距离恢复。\n2. 其技术核心在于两个标量参考扇区通过单位Dirac链接各向同性耦合，使完整Bloch球继承标准弦迹距离几何，且标量扇区距离起校准作用。\n3. 这一几何重建为量子态区分度量的谱几何理解提供新框架，并启示标量参考扇区的勾股关系可推广至其他有限系统。", "summary_source": "deepseek", "authors": [{"name": "Kaushlendra Kumar"}], "featured_authors": [{"name": "Kaushlendra Kumar"}], "author_count": 1}, {"id": "2606.13857", "category": "quant-ph", "title": "Local correlations in long-range dual-unitary kicked Hamiltonian chains", "abstract": "Many-body Floquet models with exact space--time symmetry, such as the kicked Ising spin chain (KIC), provide natural examples of systems with dual-unitary dynamics. The requirement of exact space--time symmetry is, however, highly restrictive, as it permits only nearest-neighbor interactions. Based on a pair of Hadamard matrices, we construct a wide family of dual-unitary kicked spin chains with long-range interactions. We show that local two-point correlations in such models propagate along the light-cone edges \\( |n| = r|t| \\), where \\(r\\) is the interaction range, and can be derived analytically for operators with local support. This approach is illustrated using the example of a kicked Ising spin chain with next-to-next-neighbor interactions.", "url": "https://arxiv.org/abs/2606.13857", "type": "理论", "summary": "1. 该工作基于一对Hadamard矩阵，构造了一类具有长程相互作用的双幺正kicked自旋链，突破了精确时空对称性仅允许最近邻相互作用的限制。\n2. 其核心在于揭示局域两点关联函数沿光锥边缘|n|=r|t|传播且可解析求解，其中r为相互作用范围，并通过次近邻相互作用链示例验证。\n3. 这为理解长程相互作用量子系统中关联传播与可解模型的构造提供了理论框架，有望推广至更一般的非局域双幺正动力学研究。", "summary_source": "deepseek", "authors": [{"name": "Vladimir Al. Osipov"}, {"name": "Marc Cedric Spyra"}, {"name": "Jana Carolina Schumann"}, {"name": "Thomas Guhr"}, {"name": "Boris Gutkin"}], "featured_authors": [{"name": "Vladimir Al. Osipov"}, {"name": "Marc Cedric Spyra"}, {"name": "Jana Carolina Schumann"}, {"name": "Thomas Guhr"}, {"name": "Boris Gutkin"}], "author_count": 5}, {"id": "2606.13928", "category": "quant-ph", "title": "Compact graphs and quantum automorphisms", "abstract": "Compact graphs are graphs for which the fractional automorphism polytope has no genuinely fractional vertices. This paper proposes a quantum analogue of this idea by evaluating the fundamental magic unitary of the quantum automorphism group on states, which we show to produce a closed convex set of doubly stochastic matrices sitting between the classical automorphism polytope and the full fractional automorphism polytope. Our main result is that the natural quantum analogue of compactness is classical, that is, a quantum compact graph is classically compact. We also relate this set to the quantum orbital algebra and obtain a hierarchy of classical and quantum compactness pseudo notions. The framework recovers familiar consequences of compactness through commutants and suggests quantum analogues of generous transitivity and distance-transitivity. We also isolate examples and open problems indicating where quantum symmetries may strictly refine the classical compactness theory.", "url": "https://arxiv.org/abs/2606.13928", "type": "理论", "summary": "1. 该工作通过评估量子自动同构群上的基本魔法酉矩阵，引入图的紧致性的量子类比，定义了一个介于经典和分数自动同构多面体之间的双随机矩阵闭凸集。\n2. 主要结果证明自然量子类比退化为经典情形，即量子紧致图等价于经典紧致图，并通过量子轨道代数建立了经典与量子紧致伪概念的层次结构。\n3. 该框架通过交换子恢复了经典紧致性的推论，为量子类似的距离传递性与慷慨传递性提供了启示，并揭示了量子对称性可能精细刻画经典紧致理论的开放问题。", "summary_source": "deepseek", "authors": [{"name": "Pedro Baptista"}, {"name": "Gabriel Coutinho"}, {"name": "Chris Godsil"}, {"name": "Simon Schmidt"}], "featured_authors": [{"name": "Pedro Baptista"}, {"name": "Gabriel Coutinho"}, {"name": "Chris Godsil"}, {"name": "Simon Schmidt"}], "author_count": 4}, {"id": "2606.13975", "category": "quant-ph", "title": "Implementation of two-qubit Rydberg operations on neutral Rb-87 atoms in systems with different intermediate states", "abstract": "This work presents an experimental setup for implementing two-qubit operations on neutral atoms ($^{87}$Rb) with the possibility of using two different Rydberg excitation schemes. One of them uses 5P$_{1/2}$ as the intermediate level and applies the second-stage beam locally to the addressed atoms. The second scheme uses the 6P$_{3/2}$ level; in this scheme, the particles to be entangled are moved to a separate zone through which both Rydberg beams pass. The advantages and limitations of both schemes are analyzed. Based on numerical modeling performed with a Julia package developed by the authors, it is demonstrated that the spatial configuration has a greater effect on quantum-operation fidelity than the choice of intermediate level. An experimental implementation of the scheme using the 6P$_{3/2}$ level is demonstrated, making it possible to achieve a two-qubit operation fidelity of 94%.", "url": "https://arxiv.org/abs/2606.13975", "type": "实验", "summary": "1. 该工作实验实现了基于铷-87中性原子的两量子比特里德伯操作，并比较了采用5P₁/₂和6P₃/₂两种不同中间态的激发方案。\n2. 其技术卖点在于通过数值模拟和实验表明，粒子空间构型对操作保真度的影响超过中间态选择，并采用6P₃/₂方案达到了94%的两量子比特门保真度。\n3. 这为优化中性原子量子计算方案提供了明确依据，即应优先关注原子空间布局而非仅关注中间态能级选择。", "summary_source": "deepseek", "authors": [{"name": "I. V. Iukhnovets"}, {"name": "O. V. Bychkova"}, {"name": "I. B. Bobrov"}, {"name": "A. P. Gordeev"}, {"name": "M. Y. Goloshchapov"}, {"name": "G. I. Struchalin"}, {"name": "S. S. Straupe"}], "featured_authors": [{"name": "I. V. Iukhnovets"}, {"name": "O. V. Bychkova"}, {"name": "I. B. Bobrov"}, {"name": "M. Y. Goloshchapov"}, {"name": "G. I. Struchalin"}, {"name": "S. S. Straupe"}], "author_count": 7}, {"id": "2606.14034", "category": "quant-ph", "title": "All about quantum error correction: distillation, mitigation, self-correction and beyond", "abstract": "In this work, it is shown that many quantum error-manipulating techniques, such as distillation, error mitigation, and dynamical decoupling, are special cases of the most general framework for quantum error correction. This unifying perspective is achieved by extending quantum error correction to include state-adaptive and channel-adaptive settings, as well as multi-stage coding scenarios. Based on this insight, a model of self-correcting quantum memory is also proposed. This work clarifies the relationship among these techniques and illustrates, through explicit constructions, how the unified perspective can guide the design of reliable quantum information systems.", "url": "https://arxiv.org/abs/2606.14034", "type": "理论", "summary": "1. 该工作将蒸馏、误差缓解与动态解耦等技术统一纳入推广的量子纠错框架，并证明它们均为该框架的特例。\n2. 其核心在于将纠错扩展至状态自适应、信道自适应及多级编码场景，并基于此提出自纠正量子存储器模型。\n3. 这明确了各容错技术间的内在关联，为设计高可靠量子信息系统提供了指导性框架和构造范例。", "summary_source": "deepseek", "authors": [{"name": "D.-S. Wang"}], "featured_authors": [{"name": "D.-S. Wang"}], "author_count": 1}, {"id": "2606.14163", "category": "quant-ph", "title": "Collision models for open quantum systems coupled to finite environments", "abstract": "We study a system qubit repeatedly interacting with the same environmental qubit, with a reservoir acting on the environment between collisions via a completely positive, trace-preserving map. We show that complete suppression of system--environment correlations uniquely requires a full environmental reset, recovering a semi group dynamics with a time-independent Gorini--Kossakowski--Sudarshan--Lindblad generator, whereas a partial reset yields a continuous transition between Markovian and non-Markovian regimes governed by a single dimensionless relaxation parameter. For a resonant excitation-exchange interaction, we obtain exact closed-form expressions for the Bloch-vector dynamics for both a generalized depolarizing channel and a generalized amplitude-damping channel acting as the reservoir-induced map. Using the Breuer--Laine--Piilo measure and a Choi-matrix CP-divisibility witness, we identify three distinct dynamical regimes across the parameter space: CP-divisible Markovian dynamics, CP-indivisible but P-divisible dynamics, and non-P-divisible non-Markovian dynamics. The boundaries between these regimes, and the structural differences between uniform and anisotropic environmental relaxation, are characterized numerically.", "url": "https://arxiv.org/abs/2606.14163", "type": "理论+数值", "summary": "1. 该工作采用碰撞模型研究系统量子比特与同一有限环境量子比特重复相互作用、环境在碰撞间受完全正保迹映射的开放系统动力学。\n2. 核心卖点在于揭示完全抑制系统-环境关联需完全环境重置以恢复半群动力学，而部分重置由单一无量纲弛豫参数连续调控马尔可夫性，并给出共振激发交换下广义退极化与振幅阻尼通道Bloch矢量的精确闭式解。\n3. 利用CP可分性与P可分性判据及数值表征，明确区分CP可分、CP不可分但P可分、非P可分三个动力学区域及其对均匀与各向异性环境弛豫的结构依赖，为有限环境非马尔可夫动力学的定量刻画与操控提供理论框架。", "summary_source": "deepseek", "authors": [{"name": "Gyaneswar Bhoi"}, {"name": "Anil Shaji"}], "featured_authors": [{"name": "Gyaneswar Bhoi"}, {"name": "Anil Shaji"}], "author_count": 2}, {"id": "2606.14177", "category": "quant-ph", "title": "Dynamically frozen long-distance entanglement via non-Hermitian PT-symmetric systems", "abstract": "In distributed quantum networks, interacting spin systems can mediate the generation of highly entangled links between distant nodes. We investigate the role of effective parity-time (PT)-symmetric non-Hermitian spin-1/2 bulks weakly coupled to two quantum links, obtained due to the environmental interactions affecting both the bulk and the links. Focusing on effective non-Hermitian nearest-neighbor (NN) Su-Schrieffer-Heeger (SSH) models, we analyze how non-Hermiticity influences the dynamical formation of long-distance entanglement (LDE). For a paradigmatic model consisting of a quantum XX bulk subjected to imaginary staggered magnetic fields, we analytically determine the exceptional points arising from the resulting bulk-mediated interactions between the links. Combining analytical and numerical methods, we demonstrate that an initially fully separable state can dynamically evolve into highly entangled link states near these exceptional points in the broken regime. Further, after optimizing over time and system parameters, near-unit time-averaged entanglement between the links emerges under weak imaginary magnetic fields and bulk-link couplings, which cannot be attained in the corresponding Hermitian systems. Moreover, the non-Hermitian dynamics exhibit a freezing of high entanglement in the vicinity of exceptional points, a feature absent in Hermitian counterparts. We also identify regimes of long-range interaction strengths that yield a higher time-averaged entanglement than the corresponding NN models. Furthermore, we establish that LDE persists in the stationary regime, highlighting the promise of engineered non-Hermitian dynamics for realizing robust and frozen entangled links in quantum networks.", "url": "https://arxiv.org/abs/2606.14177", "type": "理论+数值", "summary": "1. 该工作将两个量子链接弱耦合至受虚交错磁场作用的非厄米PT对称XX自旋链，针对有效SSH模型解析和数值研究了长距离纠缠的动态形成。\n2. 其技术核心在于解析确定了体诱导的异常点，并证明在其破缺区经优化参数后，弱虚磁场下初始可分离态可演化出近单位时间平均纠缠，且出现厄米系统不具备的纠缠冻结。\n3. 这为分布式量子网络中通过工程非厄米动力学实现鲁棒且冻结的远程纠缠链接提供了新机制，并表明长程相互作用可进一步提升时间平均纠缠性能。", "summary_source": "deepseek", "authors": [{"name": "Sejal Ahuja"}, {"name": "Keshav Das Agarwal"}, {"name": "Aditi Sen De"}], "featured_authors": [{"name": "Sejal Ahuja"}, {"name": "Keshav Das Agarwal"}, {"name": "Aditi Sen De"}], "author_count": 3}, {"id": "2606.14204", "category": "quant-ph", "title": "Simultaneous Estimation of Partial-Transpose Moments with Active Memory Independent of the Moment Order", "abstract": "We study the simultaneous estimation of partial-transpose moments $p_j(\\rho_{AB})=\\mathrm{Tr}[(\\rho_{AB}^{T_B})^j]$, $j=2,\\ldots,K$, of an unknown bipartite $n$-qubit state from independent copies under an explicit active-memory constraint. We give a sequential qubit-reuse realization of the partial-transpose permutation that uses at most $2n+1$ active qubits, independent of $K$, and estimates all moments $p_2,\\ldots,p_K$ to uniform additive error $\\epsilon$ with total copy complexity $O(K\\log K/\\epsilon^2)$. We also prove two converse bounds. First, any uniformly accurate simultaneous estimator requires $\\Omega(K/\\epsilon^2)$ copies in the worst case. Second, the same scaling holds on an explicit isospectral two-qubit negative-partial-transpose (NPT) family whose ordinary moments are constant while the partial-transpose moments vary. These results characterize the copy complexity of the partial-transpose moment hierarchy up to a logarithmic factor and extend simultaneous nonlinear-functional estimation from ordinary state powers to partial-transpose spectral data under active quantum memory independent of the target moment order.", "url": "https://arxiv.org/abs/2606.14204", "type": "理论", "summary": "1. 该工作研究了在主动内存约束下同时估计未知两体n量子比特态的部分转置矩p_j（j=2,…,K）的副本复杂度问题。\n2. 其核心在于给出一种与矩阶数K无关的顺序量子比特重用实现，仅需最多2n+1个活动量子比特即可将全体矩估计至均匀误差ε，副本复杂度为O(K log K/ε²)。\n3. 两个逆界证明表明该复杂度在等谱负部分转置族上最优（差于对数因子），将同时非线性泛函估计从普通状态幂推广至部分转置谱数据，且主动内存不随目标矩阶数增长。", "summary_source": "deepseek", "authors": [{"name": "Junxiang Huang"}, {"name": "Xiaoyang Wang"}, {"name": "Xiao Yuan"}, {"name": "Yukun Zhang"}], "featured_authors": [{"name": "Junxiang Huang"}, {"name": "Xiaoyang Wang"}, {"name": "Xiao Yuan"}, {"name": "Yukun Zhang"}], "author_count": 4}, {"id": "2606.14226", "category": "quant-ph", "title": "Efficient Simulation of Szegedy Quantum Walk Formulations and Algorithms", "abstract": "Quantum walks provide a versatile framework for quantum algorithms across a wide range of applications. We develop efficient classical simulation methods for Szegedy quantum walks that avoid explicit construction of the full unitary evolution operator. Unlike previous approaches restricted to a particular walk formulation, our framework is built from fundamental update and reflection operators, enabling the simulation of a broader class of Szegedy walk formulations. We further extend these methods to phase-estimation-based algorithms coupled to the walk, including implementations suitable for large sparse graphs. The resulting methods achieve optimal $O(N^2)$ complexity for dense graphs with $N$ nodes. For sparse graphs, the computational cost scales linearly with the number of edges, which is $O(N)$ in many cases. We implement the framework in the Python package SQWLib and illustrate its capabilities through simulations of representative algorithms, including quantum simulated annealing and quantum search on graphs. These results provide a practical tool for studying Szegedy-walk-based algorithms numerically beyond purely analytical treatments.", "url": "https://arxiv.org/abs/2606.14226", "type": "数值", "summary": "1. 该工作开发了Szegedy量子行走的高效经典模拟方法，避免构造完整酉演化算子。\n2. 其核心卖点是基于基本更新与反射算子的统一框架，针对稠密图达到最优O(N²)复杂度，稀疏图复杂度随边数线性增长。\n3. 这一方法为量子模拟退火与图搜索等Szegedy行走算法的数值研究提供了实用工具，扩展了纯解析分析的边界。", "summary_source": "deepseek", "authors": [{"name": "Sergio A. Ortega"}, {"name": "Daniel K. Park"}], "featured_authors": [{"name": "Sergio A. Ortega"}, {"name": "Daniel K. Park"}], "author_count": 2}, {"id": "2606.14253", "category": "quant-ph", "title": "Quantum codes and optimal pure quantum $(r,δ)$-LRCs via the MP construction", "abstract": "In this paper, we employ MP codes whose defining matrices are $\\tau$-optimal defining ($\\tau$-OD) matrices to construct new quantum codes and quantum $(r,\\delta)$-LRCs. Specifically, we report the following results: We establish a unified $\\tau$-monomial decomposition theorem for invertible self-adjoint matrices over finite fields of arbitrary characteristic, which generalizes the result in \"Quantum codes using the $\\tau$-OD MP construction\" where the characteristic was required to be odd. Based on this theorem, we prove the existence of $\\tau$-OD matrices over $\\mathbb{F}_{q^2}$ for any characteristic and demonstrate that there exist several new infinite families of $\\tau$-OD matrices over $\\mathbb{F}_{q^2}$ of characteristic $2$. As an application of MP codes involving $\\tau$-OD matrices, we construct several infinite families of quantum codes with flexible parameters. Within this framework, we present $222$ record-breaking quantum codes that surpass the best-known records maintained in Grassl's database. We propose two effective schemes for constructing optimal pure quantum $(r,\\delta)$-LRCs via MP codes. Accordingly, we construct four new infinite families of optimal pure quantum $(r,\\delta)$-LRCs with flexible parameters. Notably, we report an interesting phenomenon by exhibiting $30$ optimal pure quantum $(r,\\delta)$-LRCs derived from our framework; that is, there exist quantum codes that are not only optimal pure quantum $(r,\\delta)$-LRCs but also, according to Grassl's database, best-known, optimal, or record-breaking quantum codes. To the best of our knowledge, the new discovery that quantum codes are simultaneously optimal pure quantum $(r,\\delta)$-LRCs and record-breaking quantum codes has not been previously reported in the literature.", "url": "https://arxiv.org/abs/2606.14253", "type": "理论", "summary": "1. 该工作利用τ-最优定义矩阵的MP码，在任意特征有限域上构造了新型量子码与最优纯量子(r,δ)-局部可修复码（LRCs）。\n2. 技术核心是建立统一τ-单项分解定理，证明任意特征下τ-OD矩阵的存在性，并构造特征2的无穷新族，由此生成222个破纪录量子码与30个同时最优纯量子LRCs的例证。\n3. 这揭示了MP码框架可系统生成兼具最优局部可修复性与最佳已知性能的量子码，为量子纠错码的灵活设计与性能突破提供了新路径。", "summary_source": "deepseek", "authors": [{"name": "Meng Cao"}, {"name": "Kun Zhou"}], "featured_authors": [{"name": "Meng Cao"}, {"name": "Kun Zhou"}], "author_count": 2}, {"id": "2606.14256", "category": "quant-ph", "title": "A new class of degenerate solutions to the massless Dirac equation and their potential applications in optical memories", "abstract": "In this article, we present a novel class of degenerate solutions to the massless Dirac equation, corresponding to a wide variety of electromagnetic 4-potentials and fields, including both zero field and circularly polarized electromagnetic waves. An interesting property of these solutions is that the spin of the particles rotates in synchronization with the electric and magnetic fields of the electromagnetic waves. These results could be utilized for the development of optical memories based on materials supporting massless Dirac fermions, such as graphene.", "url": "https://arxiv.org/abs/2606.14256", "type": "理论", "summary": "1. 该工作提出了无质量Dirac方程的一类新简并解，涵盖零场及圆极化电磁波等多种电磁4势与场。\n2. 其物理卖点在于粒子自旋与电磁波的电场和磁场同步旋转，揭示了解与经典场的精确对应关系。\n3. 这为基于石墨烯等狄拉克材料的光学存储器设计提供了理论依据和可控自旋-场耦合机制。", "summary_source": "deepseek", "authors": [{"name": "Georgios N. Tsigaridas"}, {"name": "Aristides I. Kechriniotis"}, {"name": "Christos A. Tsonos"}, {"name": "Konstantinos K. Delibasis"}], "featured_authors": [{"name": "Georgios N. Tsigaridas"}, {"name": "Aristides I. Kechriniotis"}, {"name": "Christos A. Tsonos"}, {"name": "Konstantinos K. Delibasis"}], "author_count": 4}, {"id": "2606.14363", "category": "quant-ph", "title": "Quantum-Classical Hierarchical Equations of Motion", "abstract": "We develop a quantum-classical hierarchical equations of motion (QC-HEOM) approach for simulating non-Markovian open quantum systems. The method combines the ensemble-averaged classical path reference of the quantum-classical path integral formalism with a hierarchy of auxiliary quantum influence functionals. By incorporating thermal fluctuations through an ensemble average over reference trajectories, the hierarchy is required to represent only the residual quantum memory associated with the imaginary part of the bath response function. Consequently, unlike conventional hierarchical equations of motion, QC-HEOM does not require Matsubara or Padé expansions of the thermal kernel and exhibits only weak temperature dependence of the hierarchy size. Furthermore, because thermal fluctuations are supplied through reference classical trajectories, the framework naturally extends beyond harmonic baths and enables the incorporation of anharmonic and molecular environments through externally generated trajectories. We derive the formalism and demonstrate its exactness for a harmonic bath. Applications to an asymmetric spin-boson model and the seven-site Fenna--Matthews--Olson complex illustrate the accuracy of QC-HEOM. It reproduces benchmark quasi-adiabatic path integral and hierarchical equations of motion results while requiring substantially fewer auxiliary objects, particularly at low temperatures. These results establish QC-HEOM as an efficient framework for treating residual quantum memory in quantum-classical descriptions of open-system dynamics. The separation of thermal fluctuations from residual quantum memory through the use of Wigner trajectories provides an approximate route toward hierarchical treatments of complex anharmonic environments that are inaccessible to conventional HEOM approaches.", "url": "https://arxiv.org/abs/2606.14363", "type": "理论", "summary": "1. 该工作发展了量子-经典分级运动方程方法，用于模拟非马尔可夫开放量子系统的动力学。\n2. 其技术核心在于将经典路径系综平均与辅助量子影响泛函分级相结合，从而分离热涨落与残余量子记忆，避免热核的Matsubara或Padé展开，并使分级大小对温度依赖显著减弱。\n3. 该方法自然超越谐振子浴模型，借助外部生成轨迹可处理非简谐和分子环境，为传统分级运动方程难以企及的复杂环境量子-经典描述提供了高效途径。", "summary_source": "deepseek", "authors": [{"name": "Amartya Bose"}], "featured_authors": [{"name": "Amartya Bose"}], "author_count": 1}, {"id": "2606.14447", "category": "quant-ph", "title": "Dealing with locality in QAOA", "abstract": "Shallow-depth QAOA on sparse, high-diameter MaxCut instances faces a locality bottleneck: at depth \\(p\\), local observables can depend only on a bounded neighborhood of the circuit interaction graph. We propose a transport-augmented QAOA that keeps the MaxCut cost Hamiltonian unchanged but enriches the mixer with optimized, unweighted shortcut couplings (scheduled \\(XX+YY\\)) to collapse the effective interaction-graph diameter. Using exact finite-depth support recursions, we relate optimal shortcut placement to bounded-diameter graph augmentation, and show in benchmarks that (unlike ma-QAOA) performance becomes effectively size-invariant once the diameter is reduced. For bipartite families (base diameter 4), reducing the interaction path to \\(d=1\\) raises the ensemble-averaged approximation ratio from 0.7378 (ma-QAOA) to 0.9767 at \\(p=1\\) (\\(\\sigma=0.0251\\), nine system sizes); on random trees (base diameter 10), at \\(p=2\\) it improves from 0.9226 to 0.9997 (\\(\\sigma=0.0001\\)).", "url": "https://arxiv.org/abs/2606.14447", "type": "理论+数值", "summary": "1. 该工作针对稀疏高直径MaxCut实例上浅层QAOA的局域性瓶颈，提出一种添加优化非加权捷径耦合的输运增强QAOA方案。\n2. 其核心在于利用精确有限深度支持递推关系，将最优捷径放置等效为有界直径图增广，使有效相互作用图直径坍缩。\n3. 这为QAOA在有限深度下实现尺寸无关的近似性能提供了明确路径，尤其在二分图和随机树上显著优于ma-QAOA。", "summary_source": "deepseek", "authors": [{"name": "Mithilesh Kumar"}, {"name": "Yusuf Tahir"}], "featured_authors": [{"name": "Mithilesh Kumar"}, {"name": "Yusuf Tahir"}], "author_count": 2}, {"id": "2606.14484", "category": "quant-ph", "title": "Quantum Horizon: An evaluation of quantum computing as a threat to Bitcoin and Ethereum", "abstract": "Quantum computing poses a real, broad-based, but bounded and substantially mitigable threat to Bitcoin and Ethereum. We separate the two quantum algorithms that public discussion routinely conflates: Shor's algorithm breaks the elliptic-curve signatures (ECDSA over secp256k1, BLS over BLS12-381) that authorize spending, whereas Grover's algorithm does not meaningfully threaten proof-of-work mining, which is protected by a merely quadratic speedup, fault-tolerant per-operation costs, a square-root parallelization wall, and difficulty adjustment. Folding hardware scaling, the falling resource requirement, a fault-tolerance readiness lag, and expert surveys into a single Monte-Carlo forecast yields a wide, bimodal arrival distribution for a cryptographically relevant quantum computer: about a one-in-six chance by 2035, near 30% by 2040, and about 60% by 2050. Exposure is concentrated and mostly migratable: of Bitcoin's roughly six million quantum-exposed coins only about 2.3 million are irreducibly at risk, while 50 to 65% of Ether sits at key-revealed accounts that can adopt post-quantum signatures. A timely migration beats even an optimistic 2035 machine, so the binding constraint is governance, not technology. A survey of the top twenty cryptocurrencies finds none fully post-quantum. Reproducible models accompany every quantitative claim.", "url": "https://arxiv.org/abs/2606.14484", "type": "理论+数值", "summary": "1. 该工作通过分离Shor与Grover算法、结合硬件扩展与容错时滞的蒙特卡洛预测，评估了量子计算对比特币和以太坊的威胁程度与时间分布。\n2. 其核心论点为量子威胁有界且主要可迁移——仅约230万比特币与部分以太坊账户不可逆暴露，而迁移在时间上足以对抗乐观的2035年量子计算机。\n3. 这指出当前所有主要加密货币均未就绪，制约因素为治理共识而非技术方案，为密码学界与区块链社区提供了明确的行动启发。", "summary_source": "deepseek", "authors": [{"name": "Iosif M. Gershteyn"}, {"name": "Jacob A. Alber"}], "featured_authors": [{"name": "Iosif M. Gershteyn"}, {"name": "Jacob A. Alber"}], "author_count": 2}, {"id": "2606.14489", "category": "quant-ph", "title": "Physics-Informed Variational Quantum Classifier for Phase Detection in Strongly Correlated Matter", "abstract": "The characterisation of quantum phases in strongly correlated systems is a crucial milestone for the deployment of quantum sensors. In this work, we present a Physics-Informed Variational Quantum Classifier (VQC) designed to detect the topological phase transition between the Fermi polaron quasiparticle and the molecular bound state. Unlike conventional Machine Learning approaches, our quantum architecture is constructed via the Trotterised time-evolution of an effective Hamiltonian, ensuring that the learnable parameters correspond to interpretable physical quantities. We show that the VQC efficiently discovers the optimal interferometric protocol, specifically the evolution time and effective bath interactions required to maximise the visibility of Ramsey fringes, thereby clearly distinguishing the Bose-Einstein Condensate (BEC) and Bardeen-Cooper-Schrieffer (BCS) regimes. Furthermore, we report the validation of this classifier on the QRed superconducting quantum processor (BSC-CNS). Despite the intrinsic hardware noise and decoherence, the VQC preserves the relative ordering of the topological phases. We demonstrate that the physics-informed architecture achieves a linear gate complexity $\\mathcal{O}(N)$, bypassing the exponential memory wall of classical simulation and ensuring scalability to many-body regimes.", "url": "https://arxiv.org/abs/2606.14489", "type": "理论+数值", "summary": "1. 本工作提出一种物理启发的变分量子分类器，用于检测强关联费米系统中费米极化子准粒子与分子束缚态间的拓扑相变。\n2. 其核心在于通过Trotterized有效哈密顿量时间演化构建量子架构，使可学习参数对应可观测量（如演化时间与有效浴相互作用），并以线性门复杂度O(N)绕过经典模拟的指数内存瓶颈。\n3. 该方案在超导量子处理器上验证了噪声下拓扑相序的保持性，为可扩展量子传感器中的相识别与最优干涉测量协议设计提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Hugo Catalá"}, {"name": "Ezequiel Valero"}, {"name": "Germán Rodrigo"}], "featured_authors": [{"name": "Hugo Catalá"}, {"name": "Ezequiel Valero"}, {"name": "Germán Rodrigo"}], "author_count": 3}, {"id": "2606.14632", "category": "quant-ph", "title": "No classical particle limit for massless quanta", "abstract": "We investigate whether relativistic massless classical particles may emerge as the classical limit of massless quanta. To address this question independently of any specific dynamics, environment, or pointer basis, we develop an axiomatic and purely kinematical framework for the coarse-graining approach. In this formulation, a candidate classical phase space is taken as the outcome space of a POVM subject only to minimal classicality and covariance under the relevant spacetime symmetry group. Applying this framework to the Poincaré group, we prove a no-go theorem for massless particles: the covariance requirement is incompatible with the operational conditions for classicality. The theorem leaves open field-like limits of massless quanta, for example the emergence of electromagnetic or gravitational fields, while ruling out classical massless particles, such as classical photons or gravitons.", "url": "https://arxiv.org/abs/2606.14632", "type": "理论", "summary": "1. 该工作通过建立基于粗粒化方法的公理运动学框架，考察了无质量量子是否存在经典粒子极限。\n2. 其核心在于仅利用最小经典条件与庞加莱协变性要求，证明了无质量粒子的不可行定理。\n3. 这排除了经典光子或引力子等无质量粒子极限的存在，但保留了电磁场或引力场等类场极限的可能性。", "summary_source": "deepseek", "authors": [{"name": "Riccardo Falcone"}, {"name": "Simon Fuchs"}], "featured_authors": [{"name": "Riccardo Falcone"}, {"name": "Simon Fuchs"}], "author_count": 2}, {"id": "2606.14677", "category": "quant-ph", "title": "Quasilinear Equivalence Checking for Detector Error Models", "abstract": "A Detector Error Model (DEM) is a structured representation of error mechanisms in quantum circuits, which has gained popularity in quantum compilation pipelines for its ability to capture fault-tolerance at a circuit level. It lists error mechanisms as instructions targeting detectors and observables, specifying for each physical fault channel the probability that the fault fires, the detectors it triggers, and the observables it flips. In this paper, we develop an equational theory for DEMs, with its associated categorical semantics. We present a sound, terminating, confluent rewriting system for DEM terms, formulating it as a symmetric monoidal theory (a PROP) over the Giry monad. We prove that every DEM term has a unique normal form, which can be computed efficiently in quasilinear time $O(k|E|\\log|E|)$, where $|E|$ is the number of instructions and $k$ bounds the size of a target set. This provides a complete set of invariants (via Tanner graphs) for structural DEM equivalence. We provide the first static decision procedure for DEM equivalence, with rigorous correctness guarantees. It is complete (decides full decoder-equivalence exactly) for non-adaptive quantum error correction (QEC) pipelines, and scales to a sound and applicable decision procedure for partially-adaptive circuits (lattice surgery, distributed QEC, ...) without suffering exponential overhead. We discuss its application to the verification and optimisation of quantum compilers.", "url": "https://arxiv.org/abs/2606.14677", "type": "理论+数值", "summary": "1. 本工作建立了检测器错误模型的等式理论及其范畴语义，给出了基于Giry单子的对称幺半理论重写系统。\n2. 其核心证明了每个DEM项在拟线性时间$O(k|E|\\log|E|)$内可归约至唯一范式，首次实现了非自适应量子纠错管线的完备静态等价判定。\n3. 该方法可推广至部分自适应电路（如晶格手术）而无指数开销，为量子编译器验证与优化提供了可扩展的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Mathys Rennela"}], "featured_authors": [{"name": "Mathys Rennela"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
