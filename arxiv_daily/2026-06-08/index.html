e": "deepseek", "authors": [{"name": "Dean Carmi"}, {"name": "Riccardo Ciccone"}, {"name": "Shimon Sukholuski"}], "featured_authors": [{"name": "Dean Carmi"}, {"name": "Riccardo Ciccone"}, {"name": "Shimon Sukholuski"}], "author_count": 3}, {"id": "2606.06596", "category": "hep-th", "title": "Instanton-Induced Closed-String Amplitudes in Minimal Superstring Theory at Subleading Order", "abstract": "We compute the disk one-point function, the disk two-point function, and the annulus one-point function of the cosmological constant operator in the type 0A and type 0B minimal superstring theories with (1,1) ZZ instanton boundary conditions. The moduli-space integrals appearing in the disk two-point function and the annulus one-point function have divergences associated with open-string-channel degenerations, which must be regulated using open-closed string field theory. The definition of the string field theory interaction vertices requires a choice of locations for the picture-changing operators, which we specify in detail. After carefully taking into account all contributions, including those from vertical integration, we find that the results precisely match the expectations from DDK-KPZ scaling. Our technical results on the detailed construction of interaction vertices are a first step toward understanding the analogous quantities in the ten-dimensional type IIB superstring, where one also needs to understand how to treat the bosonic and fermionic collective coordinates at subleading order.", "url": "https://arxiv.org/abs/2606.06596", "type": "理论", "summary": "1. 该工作计算了0A/0B最小超弦理论中(1,1)ZZ瞬子边界条件下的圆盘和环面关联函数。\n2. 其卖点在于系统处理了开弦通道退化导致的模空间积分发散，并指定了图像改变算符位置。\n3. 这为理解十维IIB超弦理论中亚领头阶瞬子效应及集体坐标处理提供了关键技术基础。", "summary_source": "deepseek", "authors": [{"name": "Jyotirmoy Barman"}, {"name": "Rishabh Kaushik"}, {"name": "Raghu Mahajan"}, {"name": "Chitraang Murdia"}, {"name": "Ashoke Sen"}], "featured_authors": [{"name": "Jyotirmoy Barman"}, {"name": "Rishabh Kaushik"}, {"name": "Raghu Mahajan"}, {"name": "Chitraang Murdia"}, {"name": "Ashoke Sen"}], "author_count": 5}, {"id": "2606.06602", "category": "hep-th", "title": "Boundary Layers and One-point Functions in the Presence of Monodromy Defects", "abstract": "We study one-point functions of composites of charge $e$ operators in the presence of a monodromy defect for a $U(1)$ global symmetry with monodromy $\\beta$. We first compute these in free massless and massive theories, recovering in the former case the known $\\sin(e\\pi\\beta)$ dependence and obtaining in the latter a $\\sin^2(e\\pi\\beta)$ dependence. We then turn to holography and compute 1-point functions for operators $O$ of charge $J=\\Delta$ in $\\mathfrak{su}(N)$ $\\mathcal{N}=4$ SYM in the presence of a monodromy defect for a $U(1)\\in SO(6)_R$. From a WKB analysis in large $\\Delta$ we recover the structure of standard and anchored saddles previously found in the literature, finding that, to subleading order in $1/\\Delta$, the anchored regime is resolved by a boundary layer effect. Finally, using heat kernel methods, we determine the monodromy dependence of the induced 1-point function for the composite $O^{\\dagger}O$, finding a smooth $\\sin^2(J\\pi\\beta)$ behavior.", "url": "https://arxiv.org/abs/2606.06602", "type": "理论", "summary": "1. 该工作计算了存在U(1)全局对称性单值缺陷时电荷e算符复合体的一点函数，覆盖自由无质量/有质量理论、全息su(N) N=4 SYM及大Δ极限。\n2. 技术关键包括发现自由理论中无质量与有质量情形分别呈现sin(eπβ)和sin^2(eπβ)依赖；通过大Δ WKB分析揭示锚定鞍点区域的亚领头阶边界层效应；利用热核方法导出复合算符诱导一点函数的平滑sin^2(Jπβ)行为。\n3. 这为缺陷共形场论中边界层效应的解析框架及全息对偶中单值缺陷对非局部关联的调控提供了精确示例，其方法可推广至其他全局对称性缺陷系统。", "summary_source": "deepseek", "authors": [{"name": "Hugo Calvo Castro"}, {"name": "Ignacio Carreño Bolla"}, {"name": "Diego Rodriguez-Gomez"}], "featured_authors": [{"name": "Hugo Calvo Castro"}, {"name": "Ignacio Carreño Bolla"}, {"name": "Diego Rodriguez-Gomez"}], "author_count": 3}, {"id": "2606.06613", "category": "hep-th", "title": "Finite N Black Holes through the Brick Wall", "abstract": "In AdS/CFT at finite N, black holes are described by ordinary quantum systems with finite entropy and discrete spectra, while semiclassical bulk effective field theory treats the near-horizon region as an ideal continuum. We reconsider the brick-wall model as a simple effective description of the finite N departure from the semiclassical near-horizon continuum in AdS/CFT. A Dirichlet wall is reflecting; however, once the regulated near-wall modes are replaced by interacting stretched-horizon degrees of freedom, the exterior simple sector can look absorptive and black-hole-like. If these degrees of freedom are thermally populated while the exterior incoming modes are in their vacuum, they radiate as an ordinary hot object, and this gives Hawking radiation. Furthermore, we show that finite N prevents the near-horizon sector from being an ideal continuum absorber; the brick-wall model is a simple effective representation of this limitation, where the failure of perfect absorption appears as residual reflection or echoes. Such return effects will not be suppressed as $e^{-S_{\\rm BH}}$, although their detailed amplitude is model-dependent. We also discuss brick-wall-like models in which the effective inner boundary arises dynamically from a regular matter core rather than from an imposed boundary condition.", "url": "https://arxiv.org/abs/2606.06613", "type": "理论", "summary": "1. 该工作重新审视砖墙模型，作为AdS/CFT对偶中有限N下黑洞近视界区域偏离半经典连续谱的有效描述。\n2. 其核心在于利用相互作用的拉伸视界自由度替代规整墙模，使外部扇区呈现吸收性与霍金辐射，并揭示有限N导致反射效应不被e^{-S_BH}指数压制。\n3. 这为理解有限N黑洞的量子非连续特性以及内边界从物质核心动力学涌现提供了直接启发。", "summary_source": "deepseek", "authors": [{"name": "Seiji Terashima"}], "featured_authors": [{"name": "Seiji Terashima"}], "author_count": 1}, {"id": "2606.07056", "category": "hep-th", "title": "On Quantum Aspects of 1-Form Symmetries II: Bordism, Invertible Phases, and Anomalies", "abstract": "We study quantum anomalies associated with $U(1)$ 1-form symmetries from the perspective of invertible phases and bordism. We compute the oriented and spin bordism groups of the Eilenberg-Mac Lane space $K(\\mathbb{Z},3)$ up to degree 8 using the Atiyah-Hirzebruch spectral sequence, resolving the relevant extension problems by geometric arguments and identifying both bordism invariants and geometric generators. We then relate these invariants to perturbative and global anomalies, and discuss physical examples and top-down constructions of the corresponding anomaly terms. For 5-dimensional theories, we find a new mixed perturbative anomaly between the $U(1)$ 1-form symmetry and spacetime diffeomorphisms, while for 7-dimensional theories we find a new $\\mathbb{Z}_2$-valued discrete anomaly intrinsic to the $U(1)$ 1-form symmetry. We also discuss their boundary realizations and give new physical interpretations of these anomalies.", "url": "https://arxiv.org/abs/2606.07056", "type": "理论", "summary": "1. 该工作从可逆相与配边理论出发，计算了Eilenberg-Mac Lane空间K(Z,3)的定向与自旋配边群至度8，并识别出配边不变量与几何生成元。\n2. 技术核心在于利用Atiyah-Hirzebruch谱序列结合几何论证解决扩展问题，进而将不变量关联至U(1)1-形式对称性的微扰与整体反常。\n3. 这为五维理论中U(1)1-形式对称性与微分同胚的混合微扰反常、七维理论中内在Z2离散反常提供了边界实现与物理诠释。", "summary_source": "deepseek", "authors": [{"name": "Weizhen Jia"}, {"name": "Yi-Nan Wang"}, {"name": "Yi Zhang"}], "featured_authors": [{"name": "Weizhen Jia"}, {"name": "Yi-Nan Wang"}, {"name": "Yi Zhang"}], "author_count": 3}, {"id": "2606.07243", "category": "hep-th", "title": "Wick-connected theories and Lorentz violation", "abstract": "We consider double Wick rotation in field theories, which analytically continues the time coordinate, and then reinterprets one of the spatial directions as the new Lorentzian time. We show that if Lorentz-invariance is absent, Wick-connected theories are no longer necessarily equivalent. Focusing on flat spacetime, we study the propagating modes, unitarity and renormalizability of such Wick-connected theories, and provide criteria for when such notions fail to translate.", "url": "https://arxiv.org/abs/2606.07243", "type": "理论", "summary": "1. 该工作研究了在洛伦兹破缺情形下，通过双重Wick旋转连接的场论之间的不等效性。\n2. 其核心在于分析了平坦时空中传播模式、幺正性及可重整化性在不同Wick连接理论间失效的判据。\n3. 这为评估洛伦兹破缺场论在Wick旋转下的有效性提供了系统性的理论准则。", "summary_source": "deepseek", "authors": [{"name": "Niklas Götzberger"}, {"name": "Anamaria Hell"}], "featured_authors": [{"name": "Niklas Götzberger"}, {"name": "Anamaria Hell"}], "author_count": 2}, {"id": "2606.07504", "category": "hep-th", "title": "On the large N convergence of matrix models", "abstract": "In this paper, the large N behavior of a supersymmetric matrix model is compared with its exact continuum description. We concentrate on the large N limit of a supersymmetric matrix model describing a supermembrane with central charge on a toroidally compactified target space. We analyze, on the one hand, the supermembrane model formulated on a differentiable compact torus without boundary, with structure group given by the area-preserving diffeomorphisms, and, on the other hand, the associated regularized $SU(N)$ model. We emphasize in our analysis the structure of the constraints of the regularized model, which generate the $SU(N)$ algebra and reproduce the area-preserving diffeomorphism algebra in the large N limit, together with the topological information associated with the central charge of the model. We explain the role of the central charge in the compactified supermembrane and how it allows a top-down $SU(N)$ regularization. It is known that the regularized model has discrete spectrum. We prove, in the semiclassical approximation of the models, that in the large N limit the eigenvalues of the Hamiltonian of the supersymmetric matrix model are in one to one correspondence with, and converge exactly to, the eigenvalues of the Hamiltonian of the supermembrane (M2-brane) with central charge. Finally, we discuss some physical consequences of this result.", "url": "https://arxiv.org/abs/2606.07504", "type": "理论", "summary": "1. 该工作系统比较了带有中心荷的超膜连续模型与SU(N)矩阵正则化模型的大N极限行为。\n2. 其核心技术贡献在于证明半经典近似下矩阵模型哈密顿量的特征值一—对应且精确收敛到超膜模型的特征值，并阐明了中心荷在拓扑正则化中的关键作用。\n3. 这为超膜非微扰量子性质及其与M2-膜的对应关系提供了严格的半经典证据，也为后续全非微扰分析确立了可靠的基准。", "summary_source": "deepseek", "authors": [{"name": "M.P. Garcia del Moral"}, {"name": "P. León"}, {"name": "A. Restuccia"}], "featured_authors": [{"name": "M.P. Garcia del Moral"}, {"name": "P. León"}, {"name": "A. Restuccia"}], "author_count": 3}, {"id": "2606.07510", "category": "hep-th", "title": "Boundary criticality in the Gross-Neveu-Yukawa model at higher orders", "abstract": "We extend the study of boundary criticality in the Gross-Neveu-Yukawa universality class beyond leading order. Using the hyperbolic space formulation of boundary conformal field theories, we compute the first subleading corrections at large $N$ to the free energies of the ``normal\", ``ordinary\" and ``special\" boundary universality classes. We also determine the order $1/N$ correction to the dimension of the boundary fermion at the normal fixed point. In the Gross-Neveu-Yukawa theory in $d=4-\\epsilon$, we perform a higher-order analysis of the boundary free energy, and use it to extract estimates for the boundary central charge in $d=3$. The large $N$ and $\\epsilon$-expansion results are shown to be precisely consistent in overlapping regimes, providing nontrivial consistency checks for the identification of the boundary universality classes. Our calculations rely on a combination of AdS harmonic analysis and boundary conformal field theory techniques.", "url": "https://arxiv.org/abs/2606.07510", "type": "理论", "summary": "1. 该工作将Gross-Neveu-Yukawa模型中边界临界性的研究推进至更高阶，利用双曲空间表述与AdS调和分析计算了大N和ε展开下边界自由能与边界费米子维数的次主导修正。\n2. 其技术核心在于对“正常”、“普通”和“特殊”三类边界普适类给出大N次主导贡献，并通过重叠区域精确自洽验证了大N与ε展开的一致性。\n3. 这为d=3边界中心荷提供了高阶估计，并建立了边界普适类分类的严格一致性检验，为相关临界现象与全息对偶研究奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Oleksandr Diatlyk"}, {"name": "Simone Giombi"}, {"name": "Zimo Sun"}], "featured_authors": [{"name": "Oleksandr Diatlyk"}, {"name": "Simone Giombi"}, {"name": "Zimo Sun"}], "author_count": 3}, {"id": "2606.06657", "category": "math-ph", "title": "The massless sine-Gordon model with logarithmic correlations in arbitrary dimension", "abstract": "In this article, we study the sine-Gordon model with logarithmic correlations in arbitrary dimension $d \\ge 1$. The model is defined as a Euclidean field theory whose interaction term in the classical action is \\[ S_{\\mathrm{int}}(\\varphi) := 2z \\int_{\\Lambda} \\cos(\\sqrt{\\beta}\\,\\varphi)\\,\\dx, \\] where $\\varphi$ is a logarithmically correlated Gaussian field on a compact domain $\\Lambda \\subset \\mathbb{R}^d$ that coincides with the Gaussian free field when $d=2$, and where $z \\in \\mathbb{R}$ and $\\beta>0$. We treat both the massive and massless cases, with the main emphasis on the massless regime. We construct the field without imposing boundary conditions, together with its charge and gradient correlation functions, and we show that the partition function is renormalizable. The results are non-perturbative, holding for all $z \\in \\mathbb{R}$. If $d=1$, our results are valid for the full subcritical range $\\beta\\in (0,4\\pi)$ and if $d\\geq 2$, the results are valid for $\\beta\\in (0,(d+1)2\\pi)$. Our analysis is carried out directly in the continuum: we perform renormalization via a scale decomposition and control the partition function by controlling the renormalized potential that arises in this procedure, using the iterated Mayer expansion of Brydges and Kennedy~\\cite{BrKe87a}.", "url": "https://arxiv.org/abs/2606.06657", "type": "理论", "summary": "1. 该工作严格构造了任意维度d≥1中具有对数关联的无质量正弦-戈登模型，并证明了配分函数的可重整化性及关联函数的非微扰存在性。\n2. 其技术核心在于直接对连续场进行尺度分解，并通过Brydges-Kennedy迭代Mayer展开系统控制重整化势，从而无需边界条件即可处理无质量情形。\n3. 这为非微扰处理对数关联场理论提供了通用框架，并指出了超越二维情形下临界参数范围β∈(0,(d+1)2π)的物理有效描述。", "summary_source": "deepseek", "authors": [{"name": "Sami Vihko"}], "featured_authors": [{"name": "Sami Vihko"}], "author_count": 1}, {"id": "2606.06676", "category": "math-ph", "title": "Unified Framework for Functional Theories of Quantum Systems", "abstract": "We introduce and study a unified framework for density-functional theory and its variants for quantum systems on finite-dimensional Hilbert spaces. These theories seek to reduce the complexity inherent in the many-body quantum problem by describing ground states through reduced variables. The central ingredients of our unified framework are a generalized choice of basic observables, whose expectation values define precisely those reduced variables, and a fixed part of the Hamiltonian characterizing the class of quantum systems under consideration. It is this minimal structure, which we call the scope of a functional theory, that is necessary and sufficient for the formulation of a functional theory. In particular, it allows one to define the universal functionals, establish their convexity and differentiability properties, address representability questions, and prove a Hohenberg-Kohn-type uniqueness result. A purification construction also relates ensemble and weighted-ensemble functionals to the pure-state variant. Particular emphasis is placed on functional theories with Lie-algebra observable structures, connecting the variational framework to symplectic geometry. The result of this work is a systematic mathematical formulation in which structural results can be proved once and applied across a broad class of finite-dimensional functional theories.", "url": "https://arxiv.org/abs/2606.06676", "type": "理论", "summary": "1. 该工作为有限维希尔伯特空间量子系统引入了统一泛函理论框架，将密度泛函及其变体纳入广义观测量与固定哈密顿量部分所定义的范畴之中。\n2. 其核心在于通过“scope”概念刻画泛函理论的最小必要结构，并在此结构上统一证明泛函凸性、可微性、Hohenberg-Kohn型唯一性及纯化构造等数学性质。\n3. 这为有限维量子多体系统的降维描述提供了系统数学基础，并可通过李代数可观测量结构进一步关联变分框架与辛几何。", "summary_source": "deepseek", "authors": [{"name": "Chih-Chun Wang"}, {"name": "Julia Liebert"}, {"name": "Markus Penz"}, {"name": "Christian Schilling"}], "featured_authors": [{"name": "Chih-Chun Wang"}, {"name": "Julia Liebert"}, {"name": "Markus Penz"}, {"name": "Christian Schilling"}], "author_count": 4}, {"id": "2606.06863", "category": "math-ph", "title": "Rational Heun operators on $q$-linear grids", "abstract": "Rational Heun operators on the $q-$linear grid are presented. They are second-order $q-$difference operators $W_q$ constructively defined from the requirement that they have a raising action on rational functions of type $[n/n]$, namely $W_q: [n/n] \\rightarrow [n+1/n+1]$, with poles on $q-$linear grids. It will be observed that these operators are related to one family of the Ruijsenaars-van Diejen-Takemura Hamiltonians. A distinguished subclass of $W_q$ called classical which shifts the pole structure while preserving the rational function type and a prescribed basis is also characterized.", "url": "https://arxiv.org/abs/2606.06863", "type": "理论", "summary": "1. 该工作构造性地提出了定义于q-线性网格上的有理Heun算子W_q，其为基于对具有q-线性网格极点的[n/n]型有理函数施加提升至[n+1/n+1]型作用的要求而定义的第二类q-差分算子。\n2. 其核心技术贡献在于揭示W_q与Ruijsenaars-van Diejen-Takemura Hamiltonians族的一个分支相关，并刻画了保持有理函数类型与给定基的经典子类，该子类可移动极点结构而不改变函数类型。\n3. 该结果为q-差分可积系统与特殊函数代数之间建立了直接联系，对于理解椭圆可积模型、q-正交多项式以及量子可积系统的代数结构与对称性具有明确的理论启发意义。", "summary_source": "deepseek", "authors": [{"name": "Satoshi Tsujimoto"}, {"name": "Luc Vinet"}, {"name": "Alexei Zhedanov"}], "featured_authors": [{"name": "Satoshi Tsujimoto"}, {"name": "Luc Vinet"}, {"name": "Alexei Zhedanov"}], "author_count": 3}, {"id": "2606.07018", "category": "math-ph", "title": "A survey on rigorous results for the dynamics of periodic FPU chains", "abstract": "In this paper we review some analytic results on the dynamics of the FPU system. In the first part of the paper, having in mind that the FPU Hamiltonian and the Toda Hamiltonian are close each other, we present some results on the action angle variables of the Toda system and deduce some stability properties for the dynamics of the FPU system. We first focus on the case of finitely many particles and then we study the limit $N\\to\\infty$. We present also some results on the continous limit of the Toda chain showing that it is well described by a couple of KdV equations. Then we study directly the dynamics of the function interpolating the FPU system and show that the dynamics is Hamiltonian and that the Hamiltonian is very close to a function of the first three Hamiltonians of the KdV hierarchy. In the second part of the paper we present some results valid in the thermodynamic limit, according to which the time autocorrelation functions of some suitably constructed observables decay slowly implying lower bounds on the thermalization times of the system.", "url": "https://arxiv.org/abs/2606.07018", "type": "理论", "summary": "1. 该综述严格分析了周期FPU链动力学，基于其与Toda可积系统的接近性建立稳定性结果。\n2. 通过揭示FPU链连续极限由一对KdV方程描述，并证明其哈密顿量接近KdV层次前三哈密顿量的函数。\n3. 这为近可积系统热化时间下界及关联函数慢衰减提供了严格框架，启发长时动力学研究。", "summary_source": "deepseek", "authors": [{"name": "Dario Bambusi"}, {"name": "Andrea Carati"}, {"name": "Alberto Maiocchi"}], "featured_authors": [{"name": "Dario Bambusi"}, {"name": "Andrea Carati"}, {"name": "Alberto Maiocchi"}], "author_count": 3}, {"id": "2606.07121", "category": "math-ph", "title": "Einstein-Kropina Metrics and Their Application in Finsler Gravity", "abstract": "We generalize the Einstein condition for Kropina metrics obtained in the positive definite setting by Zhang, Shen and others to all signatures. As examples of Einstein-Kropina metrics $L=L_{a,b}$, we construct new explicit positive definite ones and the first ones with Lorentzian signature. Next, we classify all Einstein-Kropina solutions to the vacuum equation of Finsler gravity by Pfeifer and Wohlfarth, in arbitrary dimension and including a possible cosmological constant $\\Lambda$. For the Lorentzian and positive definite cases, the local picture is as follows. In dimension 4 or lower, only the trivial solution exists: a Minkowski or Euclidean space, essentially. In dimension 5 and higher, the solutions are those $L_{a,b}$ for which the metric $a$ is a product of the real line with a Ricci-flat metric (Lorentzian or Riemannian) and the vector field $b$ is the unique unit vector on the first factor. As a very surprising rigidity phenomenon, all Einstein-Kropina solutions to the $\\Lambda$-vacuum equation are Berwald and Ricci-flat, and the cosmological constant necessarily vanishes.", "url": "https://arxiv.org/abs/2606.07121", "type": "理论", "summary": "1. 将Kropina度量的爱因斯坦条件推广至任意符号，构造了新的正定与首个洛伦兹号型显式解。\n2. 核心卖点是完整分类了任意维Finsler引力真空方程的所有Einstein-Kropina解。\n3. 揭示出所有此类解均为Berwald且Ricci平坦，宇宙常数必然消失的刚性特征。", "summary_source": "deepseek", "authors": [{"name": "Sjors Heefer"}, {"name": "Fidel F. Villaseñor"}, {"name": "Andrea Fuster"}], "featured_authors": [{"name": "Sjors Heefer"}, {"name": "Fidel F. Villaseñor"}, {"name": "Andrea Fuster"}], "author_count": 3}, {"id": "2606.07228", "category": "math-ph", "title": "Information theoretic measures of isotropic Dunkl oscillator in spherical coordinates", "abstract": "An information theoretic analysis is done for the isotropic harmonic oscillator potential within the Dunkl-Schrödinger framework in spherical coordinates. Starting from the exact analytical eigensolution, various quantum information measures such as Shannon entropy, Rényi information, Tsallis entropy are derived. Besides, their relative measures like relative Shannon, relative Rényi, relative Tsallis as well as corresponding divergences (Jensen-Shannon, Jensen-Rényi, Jensen-Tsallis) are also obtained. In order to get Shannon entropy, a novel factorization method is introduced. This is facilitated through the use of well-known weighted Lebesgue measure. The results from the Dunkl case agree exactly with the non-Dunkl scenario, when Dunkl parameters vanish. The reflection operators and Dunkl parameters considerably influence the above measures. These are portrayed in graphical forms.", "url": "https://arxiv.org/abs/2606.07228", "type": "理论", "summary": "1. 该工作解析求解了球坐标下Dunkl-Schrödinger各向同性谐振子，并推导其Shannon熵、Rényi熵、Tsallis熵及相对熵与散度。\n2. 技术关键在于引入加权Lebesgue测度实现Shannon熵的新因子分解方法，使Dunkl参数对信息度量的影响得以显式表达。\n3. 所得结果在Dunkl参数为零时精确回归标准谐振子情形，为带反射对称性量子系统的信息论研究提供了可解析处理的基准模型。", "summary_source": "deepseek", "authors": [{"name": "Akash Halder"}, {"name": "Amlan K. Roy"}, {"name": "Debraj Nath"}], "featured_authors": [{"name": "Akash Halder"}, {"name": "Amlan K. Roy"}, {"name": "Debraj Nath"}], "author_count": 3}, {"id": "2606.06552", "category": "quant-ph", "title": "Beyond the Canonical Protocol: Quantum Encrypted Cloning from Secret-Sharing Access Structures", "abstract": "Quantum encrypted cloning shows that an unknown quantum state can be distributed into multiple encrypted copies without contradicting the no-cloning theorem: each copy is unusable on its own, but can be redeemed together with a suitable quantum key. Recent work has related canonical encrypted-cloning protocols to particular forms of quantum secret sharing. Here we take the converse perspective: instead of mapping a given encrypted-cloning protocol into QSS, we use QSS access structures as a design library from which encrypted-cloning schemes can be extracted. The criterion is access-structural. A QSS scheme supports a quantum encrypted-cloning structure whenever it contains a family of qualified sets with a non-qualified common intersection. The common subsystem is interpreted as the key, while the non-common parts are interpreted as encrypted clones relative to that key. Thus quantum encrypted cloning does not require a new notion of recoverability beyond QSS; what changes is the operational reading of QSS constituents as a mechanism for delayed and alternative redemption opportunities. This viewpoint separates redemption from perfect secrecy. Perfect QSS yields encrypted-cloning schemes with forbidden non-qualified subsystems, whereas ramp QSS naturally allows intermediate, partially informative non-redeeming subsystems. The resulting framework broadens quantum encrypted cloning from a specific protocol to a general access-structure primitive. We illustrate the extraction principle with threshold-like, ramp, hierarchical, and compartmented architectures, showing how encrypted clones may be symmetric or asymmetric, individual or composite, perfectly hidden or leaky. Equivalently, these constructions can be viewed as overlapping erasure-recovery regions of an isometric quantum code. This establishes secret sharing as a systematic design language for encrypted quantum redundancy.", "url": "https://arxiv.org/abs/2606.06552", "type": "理论", "summary": "1. 该工作提出从量子秘密共享的接入结构库中提取量子加密克隆方案的反向设计视角。\n2. 技术判据是接入结构含一个非认证共同交集，其共同子系统视为密钥，非共同部分视为相对于该密钥的加密克隆。\n3. 这建立了秘密共享作为加密量子冗余系统化设计语言的框架，并可通过等距量子码的重叠擦除恢复区域等价理解。", "summary_source": "deepseek", "authors": [{"name": "Gabriele Gianini"}, {"name": "Stelvio Cimato"}, {"name": "Jianyi Lin"}, {"name": "Omar Hasan"}, {"name": "Corrado Mio"}, {"name": "Ernesto Damiani"}], "featured_authors": [{"name": "Gabriele Gianini"}, {"name": "Stelvio Cimato"}, {"name": "Jianyi Lin"}, {"name": "Omar Hasan"}, {"name": "Corrado Mio"}, {"name": "Ernesto Damiani"}], "author_count": 6}, {"id": "2606.06561", "category": "quant-ph", "title": "Amplitude-dependent quantum hydrodynamics from a \\(\\coth\\)-Madelung ansatz", "abstract": "We investigate a nonlinear extension of the Madelung transformation based on a hyperbolic phase--amplitude coupling of the form \\[ \\Psi = R e^{\\imath\\theta \\coth R}, \\] where \\(R\\) is a real amplitude field and \\(\\theta\\) is an auxiliary phase coordinate governed by Schrödinger's equation. In contrast to the conventional polar decomposition, this construction imposes a singular hyperbolic relation between amplitude and phase, thereby endowing the Bohmian or hydrodynamic description with an intrinsically geometric structure. We show that the associated velocity field acquires a density-gradient contribution, producing generalized continuity equations and modified quantum force terms. When interpreted as a complex macroscopic order parameter, this generalized phase structure leads to modified superconducting electrodynamics; in particular, the London equations acquire additional contributions that render the Meissner response sensitive to spatial density gradients. The proposed framework is motivated by broader developments involving complex group velocities, dissipative wave propagation, and amplitude-sensitive transport in quantum systems.", "url": "https://arxiv.org/abs/2606.06561", "type": "理论", "summary": "1. 该工作通过双曲相位-振幅耦合形式提出了Madelung变换的非线性推广，构建了振幅依赖的量子流体动力学描述。\n2. 其核心在于速度场获得密度梯度贡献，导致广义连续性方程与修正量子力项，并引入伦敦方程的额外项使超导Meissner响应依赖于空间密度梯度。\n3. 这为量子系统中耗散波传播与振幅敏感输运的几何结构建模提供了新途径，可启发复杂序参量下的修正电动力学研究。", "summary_source": "deepseek", "authors": [{"name": "C. Dedes"}], "featured_authors": [{"name": "C. Dedes"}], "author_count": 1}, {"id": "2606.06588", "category": "quant-ph", "title": "Demystifying Objectivity with Operator Algebra Quantum Error Correction", "abstract": "Quantum Darwinism extends the decoherence formalism to explain how classicality and objectivity emerge from quantum mechanics. However, existing approaches often capture only partial aspects of objectivity, leading to its mischaracterization and making it difficult to pin down precisely. By connecting quantum Darwinism to operator algebra quantum error correction, we show that the emergence of objectivity can be identified with the algebraic local recoverability of quantum codes. Applying this algebraic framework to stabilizer codes, we show that it yields a far more precise characterization of classicality and redundancy, unifies the traditional measures of objectivity, enables efficient classification via coding-theoretic tools, and supports large-scale Clifford simulations of decoherence dynamics.", "url": "https://arxiv.org/abs/2606.06588", "type": "理论+数值", "summary": "1. 该工作将量子达尔文主义与算子代数量子纠错相联系，指出客观性的涌现对应于量子码的代数局域可恢复性。\n2. 核心卖点在于通过稳定子码框架实现了客观性度量统一、经典性精确刻画与高效编码分类，并支持大规模Clifford退相干模拟。\n3. 这为从代数局部可恢复性视角理解量子-经典过渡提供了严格框架，并启发了基于码理论对客观性进行量化研究的新方向。", "summary_source": "deepseek", "authors": [{"name": "Marin Girard"}, {"name": "Gong Cheng"}, {"name": "ChunJun Cao"}], "featured_authors": [{"name": "Marin Girard"}, {"name": "Gong Cheng"}, {"name": "ChunJun Cao"}], "author_count": 3}, {"id": "2606.06597", "category": "quant-ph", "title": "Quantum-stabilized patterns in a vector Hopfield network", "abstract": "We introduce the quantum vector Hopfield network, in which patterns are formed by orientations of quantum vector spins; quantum dynamics arise intrinsically from the non-commutativity of the spin operators. We derive the equations of state and the phase diagrams for this network as well as its classical counterpart. We find that quantum fluctuations, surprisingly, stabilize the stored patterns. Both the critical retrieval temperature and the target pattern overlap are enhanced relative to the classical network. Additionally, we find that this enhancement grows with pattern loading up to network capacity. We interpret this effect as an analog of quantum order-by-disorder, a mechanism by which quantum fluctuations promote the formation of ordered phases. These findings offer a new route to quantum-enhanced associative memory.", "url": "https://arxiv.org/abs/2606.06597", "type": "理论+数值", "summary": "1. 本文引入量子矢量Hopfield网络，图案由量子矢量自旋取向构成，量子动力学源于自旋算符的非对易性。\n2. 发现量子涨落意外地稳定了存储图案，其临界检索温度与靶图案重叠均高于经典网络，且随图案加载至容量上限而增强。\n3. 该效应可视为量子序-by-无序机制的类比，为量子增强联想记忆提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Richard D. Barney"}, {"name": "Sharba Bhattacharjee"}, {"name": "Victor Galitski"}, {"name": "Kartiek Agarwal"}, {"name": "Ivar Martin"}], "featured_authors": [{"name": "Richard D. Barney"}, {"name": "Sharba Bhattacharjee"}, {"name": "Victor Galitski"}, {"name": "Kartiek Agarwal"}, {"name": "Ivar Martin"}], "author_count": 5}, {"id": "2606.06611", "category": "quant-ph", "title": "Sensing ac fields with quantum many-body scars", "abstract": "Quantum many-body scars (MBS) exhibit weak ergodicity breaking and long-lived coherent dynamics within an otherwise thermal spectrum. We investigate their metrological properties using the quantum Fisher information (QFI), focusing on estimating the amplitude of a weak AC field in the PXP model. We show that the approximately uniform energy spacing of the scar tower enables collective resonant processes when the driving frequency matches integer multiples of the scar gap, resulting in a quadratic-in-time growth of the QFI over an extended time window. We analyze how the connectivity induced by different probe operators shapes sensing performance and demonstrate that staggered magnetization leads to a more favorable growth of the QFI with system size than homogeneous magnetization. Through frequency scanning and finite-size analysis, we characterize the scaling of the QFI with the number of particles. Finally, we develop a single-tower approximation under resonant driving, deriving a compact analytical expression that captures the time dependence and system-size scaling of the QFI. Our results establish how to leverage structured non-ergodic dynamics in quantum sensing protocols.", "url": "https://arxiv.org/abs/2606.06611", "type": "理论", "summary": "1. 该工作利用PXP模型中的量子多体疤痕，研究了通过量子Fisher信息估计弱交流场振幅的计量特性。\n2. 其卖点在于疤痕塔的近似均匀能级间距在驱动频率匹配共振时驱动量子Fisher信息随时间二次增长，且交错磁化比均匀磁化更有利于随系统尺寸的标度。\n3. 这为设计基于非遍历多体动力学的量子传感协议提供了明确的共振机制和单塔解析框架。", "summary_source": "deepseek", "authors": [{"name": "Matheus Fibger"}, {"name": "Andrei Tsypilnikov"}, {"name": "Thiago R. de Oliveira"}, {"name": "Fernando Iemini"}], "featured_authors": [{"name": "Matheus Fibger"}, {"name": "Andrei Tsypilnikov"}, {"name": "Thiago R. de Oliveira"}, {"name": "Fernando Iemini"}], "author_count": 4}, {"id": "2606.06653", "category": "quant-ph", "title": "Higher-order Symmetric Quantum Mpemba Effect in Fragmented Systems", "abstract": "A quantum system can restore a broken symmetry faster the more strongly it initially breaks it, an anomaly known as the quantum Mpemba effect. Whether this effect survives once conservation laws fragment the Hilbert space into exponentially many disconnected Krylov sectors has remained open. We address this question for circuits and Hamiltonians with simultaneous charge and dipole conservation, the paradigmatic setting for strong Hilbert-space fragmentation. Combining a replica tensor-network formulation for charge and dipole-conserving gates, which reaches the annealed Rényi-2 entanglement asymmetry up to $L=128$, with Hamiltonian simulations and an exactly solvable dissipative model, we uncover a higher-order symmetric quantum Mpemba effect: the charge and dipole asymmetries each display Mpemba-like crossings on parametrically distinct timescales. Resolving the state into frozen and active Krylov sectors reveals the mechanism: frozen fragments retain a finite asymmetry that obstructs full restoration, while active fragments host the relaxation responsible for the crossings. Fragmentation thus does not preclude the quantum Mpemba effect but reshapes it into frozen memory and active-fragment relaxation, providing a framework for the Mpemba phenomenology of higher-moment symmetries.", "url": "https://arxiv.org/abs/2606.06653", "type": "理论+数值", "summary": "1. 该工作通过复制张量网络、哈密顿模拟与可解耗散模型，研究了同时具有电荷和偶极守恒的碎片化系统中高阶对称量子Mpemba效应。\n2. 核心发现是电荷与偶极不对称性在参数化不同的时间尺度上各自呈现Mpemba-like交叉，源于冻结碎片保留有限不对称性而活性碎片主导弛豫的机制。\n3. 这表明希尔伯特空间碎片化并不消除量子Mpemba效应，而是将其重塑为冻结记忆与活性弛豫的共存形态，为高阶矩对称性的Mpemba现象提供了统一框架。", "summary_source": "deepseek", "authors": [{"name": "Sreemayee Aditya"}, {"name": "Sara Murciano"}, {"name": "Xhek Turkeshi"}], "featured_authors": [{"name": "Sreemayee Aditya"}, {"name": "Sara Murciano"}, {"name": "Xhek Turkeshi"}], "author_count": 3}, {"id": "2606.06759", "category": "quant-ph", "title": "Bures geodesics for non-faithful states and quantum speed limit", "abstract": "The quantum speed limit establishes a bound on the minimal time required for a quantum system to evolve from a given initial state to a final state. When the mean energy variance is fixed this limitation is captured by the Mandelstam--Tamm bound. The fastest quantum evolution saturating this bound follows a geodesic arc connecting the two states. Such geodesics in the manifold of quantum states are explicitly known when the states are pure (Fubini-Study geodesics) and when they are mixed and given by faithful density matrices (Bures geodesics). In this article we obtain the explicit form of the Bures geodesic arcs joining two non-faithful density matrices, which may have different ranks. For pure states one recovers the Fubini-Study geodesics. A necessary and sufficient condition for the uniqueness of the shortest geodesic arc is given. When the condition is not fulfilled there are infinitely many such arcs, all having length equal to the arccos Bures distance between the two states, in analogy with the arcs of great circles connecting the two poles of a sphere. We discuss the implications of our results for the quantum speed limit.", "url": "https://arxiv.org/abs/2606.06759", "type": "理论", "summary": "1. 本文给出了连接任意两个非忠实密度矩阵（可能具有不同秩）的Bures测地线弧的显式解析表达式，并将纯态视为其自然极限恢复出Fubini-Study测地线。\n2. 关键进展是确立了最短测地线弧唯一性的充要条件：当该条件被违反时，存在无穷多条测地线弧，其长度均精确等于两态间的反余弦Bures距离，该简并性在几何上类比于球面两极间的所有大圆弧。\n3. 此工作完备了量子态流形上Bures测地线的几何理论，直接揭示非忠实态演化可通过这些测地线弧饱和Mandelstam-Tamm量子速度极限，且当简并发生时存在多条等时演化路径，为量子动力学极限问题的研究提供了完整框架。", "summary_source": "deepseek", "authors": [{"name": "Sergio Carrasco"}, {"name": "Dominique Spehner"}], "featured_authors": [{"name": "Sergio Carrasco"}, {"name": "Dominique Spehner"}], "author_count": 2}, {"id": "2606.06810", "category": "quant-ph", "title": "Cyclic ladder operators and hidden Weyl-Heisenberg structure in a Floquet system", "abstract": "Ladder operators, found in the quantum harmonic oscillator and other quantized systems, provide an elegant approach to solving or understanding otherwise intricate physics problems. In this Letter, we discuss cyclic ladder operators in both Hermitian and non-Hermitian systems with a finite Hilbert space, with the highest (lowest) level directly descending (ascending) to the lowest (highest) level via a single raising (lowering) operation. We show that an equally spaced energy ladder emerges when these systems have an underlying Weyl-Heisenberg commutation relation, with the cyclic ladder operators and the temporal evolution operator behaving as the generators of the Weyl-Heisenberg group. We further illustrate such a system using a one-dimensional Floquet lattice, where the cyclic ladder operators become diagonal and the temporal evolution simplifies to a permutation matrix after a Floquet period. Our findings reveal a hidden relation between non-trivial dynamics and algebraic principles in Floquet systems, which may exist for other quantum numbers as well besides the energy levels.", "url": "https://arxiv.org/abs/2606.06810", "type": "理论", "summary": "1. 该工作研究了有限希尔伯特空间中厄米与非厄米系统的循环阶梯算子，揭示了能级等间距梯度的出现条件。\n2. 其卖点在于证明循环阶梯算子及时间演化算子生成Weyl-Heisenberg群，并在Floquet晶格中实现为对角化与周期置换矩阵。\n3. 这揭示了Floquet系统中非平庸动力学与代数结构之间的隐藏关联，为其他量子数的类似规律提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Tianao Wu"}, {"name": "Li Ge"}], "featured_authors": [{"name": "Tianao Wu"}, {"name": "Li Ge"}], "author_count": 2}, {"id": "2606.06997", "category": "quant-ph", "title": "Regular and chaotic dynamics of nonlinear optomechanical systems controlled by modulated light", "abstract": "The nonlinear dynamics of a mechanical resonator in an optomechanical system with linear, quadratic and cubic photon-vibration interactions (with respect to mechanical displacements) in a modulated driving field under conditions of adiabatic elimination of the optical field is studied. Based on the constructed bifurcation diagrams of the mechanical coordinate and the largest Lyapunov exponent as a function of the modulation amplitude, as well as power spectra, phase portraits and Poincare sections, regions of regular and chaotic dynamics of the optomechanical system are identified. It is also shown that for a certain modulation amplitude in the presence of all three types of interactions, chaotic dynamics of the mechanical resonator (oscillator) is realized, which is replaced by quasi-periodic oscillations in the absence of cubic interaction, and the system returns to chaotic behavior if only linear interaction remains. This non-monotonic dependence of chaotic dynamics on the order of nonlinearity originates from the interplay between parametric driving and effective potential reshaping and manifests that nonlinearity does not always enhance chaos. For an optomechanical system in a membrane-in-the-middle configuration, where only quadratic photon-vibration interaction is present, it is demonstrated that at small modulation amplitudes the mechanical oscillator exhibits quasi-periodic motion in each of the wells of a symmetric two-minimum potential, whereas large modulation amplitudes lead to chaotic motion, involving interwell transitions.", "url": "https://arxiv.org/abs/2606.06997", "type": "理论", "summary": "1. 该工作研究了由调制光驱动的含线性、二次及三次光子-振动耦合的光力学系统中力学振子的规则与混沌动力学。\n2. 其核心物理发现是混沌动力学随非线性阶次呈非单调变化，源于参量驱动与有效势重塑的竞争，表明非线性并不总是增强混沌。\n3. 这为通过调控非线性耦合阶次与调制幅度主动控制光力学系统中的混沌行为提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "A.P. Saiko"}, {"name": "G.A. Rusetsky"}, {"name": "S.A. Markevich"}, {"name": "R. Fedaruk"}], "featured_authors": [{"name": "A.P. Saiko"}, {"name": "G.A. Rusetsky"}, {"name": "S.A. Markevich"}, {"name": "R. Fedaruk"}], "author_count": 4}, {"id": "2606.07011", "category": "quant-ph", "title": "Frequency Detuning and Interference-Induced Bohmian Chaos in a Two-Dimensional Anisotropic Harmonic Oscillator", "abstract": "We investigate the emergence of chaotic Bohmian trajectories in a three-mode superposition of the ground and first excited states of a two-dimensional anisotropic harmonic oscillator. The analysis focuses on the interference-induced phase structure of the wavefunction, which determines the Bohmian velocity field through its phase gradient. We show that the spatial extent of chaotic motion is controlled by the temporal coherence of the interference pattern, set by the detuning between oscillator modes. Near resonance, slow beating generates long-lived phase-gradient structures that repeatedly stretch and fold nearby trajectories, leading to more spatially extended chaotic regions. In contrast, strong detuning produces rapid temporal decorrelation of the phase field and confines chaotic dynamics to localized regions of configuration space. To quantify this behavior, we use a dimensionless coherence parameter comparing the beating time scale with a characteristic transport time. The results identify temporal coherence of the interference-induced phase field as a useful diagnostic for chaotic transport in low-dimensional Bohmian systems.", "url": "https://arxiv.org/abs/2606.07011", "type": "理论", "summary": "1. 该工作研究了二维各向异性谐振子中基态与第一激发态三模叠加下的玻姆轨迹混沌，揭示了干涉诱导相位结构通过梯度决定速度场并调控动力学。\n2. 其卖点在于发现频率失谐通过控制干涉图样的时间相干性（以拍频与输运时间比的无量纲参数表征）决定混沌空间范围：近共振慢拍展延长寿命相位梯度结构，拉伸折叠轨迹扩展混沌区；强失谐快速退相限制混沌于局域。\n3. 这为低维玻姆系统中混沌输运提供了基于时间相干性的有效诊断工具，启发类似干涉-相干性机制在其他量子混沌系统中的应用。", "summary_source": "deepseek", "authors": [{"name": "Umair Abdul Halim"}, {"name": "Nurisya Mohd Shah"}, {"name": "Chan Kar Tim"}, {"name": "Ahmad Hazazi Ahmad Sumadi"}], "featured_authors": [{"name": "Umair Abdul Halim"}, {"name": "Nurisya Mohd Shah"}, {"name": "Chan Kar Tim"}, {"name": "Ahmad Hazazi Ahmad Sumadi"}], "author_count": 4}, {"id": "2606.07043", "category": "quant-ph", "title": "Exact noise characterization of entanglement distribution in star networks", "abstract": "Multipartite entanglement forms the core of many networking applications. In the near-term future, it is expected that multipartite distribution will be achieved first through star topologies, making it important to understand the noise incurred during the distribution process. In such networks, elementary links are created stochastically and successful links must be stored while waiting for the remaining links, causing memory decoherence that depends on the random waiting times. We derive analytical expressions for both the average noise and its distribution, when distributing GHZ states under memory dephasing in star networks. We study and compare two distribution protocols: the factory and piecemaker protocol. Furthermore, we find expressions for the case of a global cut-off (allowing fast optimization of the cut-off without requiring Monte Carlo simulations) and extend the analysis for the factory protocol to depolarizing noise for arbitrary states.", "url": "https://arxiv.org/abs/2606.07043", "type": "理论+数值", "summary": "1. 该工作解析推导了星型网络中分发GHZ态时，由随机等待时间导致记忆退相干的平均噪声及其分布。\n2. 卖点在于给出工厂与碎片匠两种协议的精确噪声表达式，并展示全局截止参数可快速优化而无需蒙特卡洛模拟。\n3. 这为近期限星型拓扑的多体纠缠分发噪声表征与协议选择提供了定量分析工具。", "summary_source": "deepseek", "authors": [{"name": "Kenneth Goodenough"}, {"name": "Xiaonan Chen"}, {"name": "Patrick Emonts"}], "featured_authors": [{"name": "Kenneth Goodenough"}, {"name": "Xiaonan Chen"}, {"name": "Patrick Emonts"}], "author_count": 3}, {"id": "2606.07051", "category": "quant-ph", "title": "Quantum correlations and coherence in a two-qubit anisotropic $XY$ under magnetic field", "abstract": "We study thermal quantum correlations and coherence in Heisenberg $XY$ model with anisotropic interactions under a uniform magnetic field $ B $. Using concurrence $C$, local quantum uncertainty (LQU), Bell-Clauser-Horne-Shimony-Holt (CHSH) nonlocality $ \\mathbb{B}$, and coherence $C_l$ as quantifiers, we analyze how magnetic anisotropy $ \\delta_m $, coupling anisotropy $ \\delta_c $, Dzyaloshinskii-Moriya (DM) interaction $ D $, temperature $ T $, and magnetic field $ B $ modulate quantum resources. At low temperatures and relevant magnetic fields, the entanglement is maximized, but exhibits sudden death for $ \\delta_m = 0 $, which turns into a smooth decay as $ \\delta_m $ increases, highlighting its stabilizing role. LQU shows that stronger anisotropy suppresses quantum correlations, while $ \\mathbb{B} $ induces a non-monotonic response peaking at a critical field $ B_c $. Bell-CHSH nonlocality violations ($ \\mathbb{B} > 2 $) persist below $ B_c $, but thermal noise ($ T \\geq 1 $) suppresses them. Coherence $ C_l $ is most robust to thermal fluctuations, especially for high \\( \\delta_m \\), which also dampens abrupt quantum phase transitions. The DM interaction is essential for entanglement generation, with $ D $ and anisotropy synergistically enhancing correlation resilience. We identify a hierarchy of thermal degradation: nonlocality ($ \\mathbb{B} $) vanishes first, followed by entanglement ($ C $), then general quantum correlations (LQU), while coherence $ C_l $ persists the longest. These results demonstrate tunable control of quantum resources via anisotropy and external parameters, providing insights for the design of robust spin-based quantum technologies.", "url": "https://arxiv.org/abs/2606.07051", "type": "理论", "summary": "1. 该工作系统研究了外加均匀磁场下各向异性Heisenberg XY模型中两量子比特的热量子关联与相干性，利用concurrence、局部量子不确定性、Bell-CHSH非局域性和相干性等量度全面表征。\n2. 其核心卖点在于揭示磁各向异性δ_m能抑制纠缠突然死亡并平滑量子相变，且Dzyaloshinskii-Moriya相互作用是纠缠产生的必要条件，与各向异性协同提升关联鲁棒性。\n3. 文中确立的非局域性、纠缠、一般量子关联及相干性的热退化层次，为通过各向异性和外场参数可调控制量子资源、设计鲁棒自旋基量子技术提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Ahmed Jellal"}, {"name": "Pablo Díaz"}, {"name": "David Laroze"}], "featured_authors": [{"name": "Ahmed Jellal"}, {"name": "Pablo Díaz"}, {"name": "David Laroze"}], "author_count": 3}, {"id": "2606.07168", "category": "quant-ph", "title": "Continuous-time quantum control across an exponentially small bottleneck in a frustrated Ising ring model", "abstract": "Continuous-time Quantum Annealing (QA) is a strategy for preparing the ground state of nontrivial many-body systems. In its standard form, the dynamics is generated by a time-dependent interpolation between a simple driving Hamiltonian and the target problem Hamiltonian, usually implemented through a linear schedule. This approach faces the crucial bottleneck of small spectral gaps, which may require exponentially long annealing times to ensure adiabaticity. Here, we show how to implement quantum control over the annealing schedule in a frustrated Ising ring, one of the simplest models exhibiting an exponentially small bottleneck gap. By optimizing smooth continuous-time annealing schedules with a dressed-CRAB approach, and using a digitized representation of the dynamics to efficiently evaluate gradients, we construct protocols that strongly outperform standard fixed schedules. The optimized dynamics bypasses the bottleneck through a strongly nonadiabatic mechanism, leading to efficient ground-state preparation despite the exponentially small minimum gap. In particular, the annealing time required to reach a fixed residual-energy threshold is found to grow linearly with system size rather than exponentially. We further examine a lowest-order variational counter-diabatic correction and find that, once schedule optimization is allowed, it does not lead to any improvement.", "url": "https://arxiv.org/abs/2606.07168", "type": "理论+数值", "summary": "1. 该工作展示了在受挫伊辛环模型中，通过优化连续时间退火调度，克服指数小能隙瓶颈实现基态高效制备。\n2. 其核心在于采用dressed-CRAB方法结合数字化动力学梯度求解，诱导强非绝热机制，使所需退火时间随系统尺寸线性增长而非指数。\n3. 这启示量子退火中调度优化可完全绕过绝热限制，且在此类优化方案下最低阶变分逆绝热修正不产生额外增益。", "summary_source": "deepseek", "authors": [{"name": "Vincenzo Roberto Arezzo"}, {"name": "Kiran Thengil"}, {"name": "Giuseppe Santoro"}], "featured_authors": [{"name": "Vincenzo Roberto Arezzo"}, {"name": "Kiran Thengil"}, {"name": "Giuseppe Santoro"}], "author_count": 3}, {"id": "2606.07320", "category": "quant-ph", "title": "Proof that the Klein-Gordon type equation with alpha attractor potential has no Liouvillian solution or as a composition of special functions", "abstract": "This study investigates the analytical solvability of the Klein-Gordon and Duffin-Kemmer-Petiau (DKP) equations for a scalar particle interacting with a transcendental $\\alpha$-attractor-type potential, $V(x) = V_0 e^{a \\tanh(bx)}$. We first address the problem of integrability within the framework of Picard-Vessiot theory. By analyzing the differential field extensions associated with the system, we demonstrated that the differential Galois group is the full special linear group $SL(2, \\mathbb{C})$. Given that this group is not solvable, we provide rigorous proof for the non-existence of Liouvillian solutions, effectively ruling out any expression in terms of primitives and elementary functions. Building upon this result, we further establish that wavefunctions cannot be represented as finite compositions or transformations of classical special functions, such as those of the Bessel, Whittaker, or Heun families. This second conclusion is supported by the ``double-transcendence'' of the potential; we prove via the Hermite-Lindemann theorem that no rational coordinate transformation $z(x)$ exists that could map the physical equation into an ordinary differential equations(ODE) with rational coefficients. Consequently, the $\\alpha$-attractor potential is strictly non-integrable and lies entirely outside the landscape of solvable relativistic quantum systems.", "url": "https://arxiv.org/abs/2606.07320", "type": "理论", "summary": "1. 该工作严格证明了含α吸引子型超越势的Klein-Gordon与Duffin-Kemmer-Petiau方程无Liouville解，亦无法表示为经典特殊函数的有限组合。\n2. 其技术核心在于运用Picard-Vessiot理论判定微分Galois群为SL(2,C)，并结合Hermite-Lindemann定理排除有理坐标变换将方程化为有理系数常微分方程的可能性。\n3. 这为识别相对论量子可积系统划定了清晰边界，指出该势完全属于不可积范畴，为相关超越势系统的严格分析提供了判据。", "summary_source": "deepseek", "authors": [{"name": "Benjamin de Zayas"}, {"name": "Clara Rojas"}], "featured_authors": [{"name": "Benjamin de Zayas"}, {"name": "Clara Rojas"}], "author_count": 2}, {"id": "2606.07322", "category": "quant-ph", "title": "Towards Implementable Quantum Divide and Conquer: A TSP Solver with Improved Exponential Base over Held-Karp", "abstract": "The traveling salesman problem (TSP) is a significant classical NP-hard combinatorial optimization problem. In this work, we demonstrate that combining classical dynamic programming with quantum search can yield an achievable quantum advantage for TSP on the basis of excellent work by the authors of~\\cite{ambainis2019quantum}. We design the quantum divide and conquer strategy to provide a parameterized spectrum for this combination. The hybrid algorithm proposed in~\\cite{ambainis2019quantum} corresponds to a specific case in this spectrum, while the two extremes of the spectrum represent the purely classical Held-Karp and the purely quantum search algorithm, respectively. Within our parameterized spectrum, we prove that the optimal query complexity is $O^*(1.865666\\ldots^n)$, achieved with the 4-subset scheme, while the counting in~\\cite{ambainis2019quantum} overlooked half of the recursive branches. The correct query complexity of their algorithm is $O^*(2.225880\\ldots^n)$ at their chosen parameter ($\\alpha\\approx0.055362$), and cannot fall below $O^*(2^n)$ for any $\\alpha$ - meaning their $8$-subset scheme, correctly analyzed, never surpasses the classical Held-Karp bound. Furthermore, in previous studies on quantum advantages for NP-hard combinatorial optimization problems, researchers focused only on improvements in query complexity. Our work, however, points out that the quantum advantage stems not only from the quadratic speedup of quantum search but also from the structured quantum state preparation. We argue that structured state preparation is indispensable for realizing the oracle operator while maintaining the total time complexity of $O^*(1.865666\\ldots^n)$. Therefore, we design an elegant method for preparing the set partition state, which makes our TSP solver practically executable.", "url": "https://arxiv.org/abs/2606.07322", "type": "理论+数值", "summary": "1. 该工作结合经典动态规划与量子搜索，为旅行商问题设计了可参数化的量子分治策略，并证明了最优查询复杂度为O^*(1.865666…^n)。\n2. 其核心卖点在于揭示了量子优势不仅源于搜索的二次加速，更依赖于结构化量子态制备这一不可或缺的环节，并为此设计了可实际执行的集合划分态制备方法。\n3. 这为NP-hard组合优化问题的量子算法提供了超越纯查询复杂度的分析框架，并指明了在近期量子设备上实现具体优势的可行路径。", "summary_source": "deepseek", "authors": [{"name": "Xujun Bai"}, {"name": "Yun Shang"}, {"name": "Honghong Lin"}], "featured_authors": [{"name": "Xujun Bai"}, {"name": "Yun Shang"}, {"name": "Honghong Lin"}], "author_count": 3}, {"id": "2606.07331", "category": "quant-ph", "title": "Performance analysis of classical adiabatic annealing on Ising machines", "abstract": "Ising machines are a promising approach to solve combinatorial optimization problems. They map these problems onto the Ising model and search for low-energy configurations. However, navigating the rugged energy landscapes of these systems remains difficult. To improve this navigation, classical adiabatic annealing has been proposed in the literature as a heuristic optimization method for classical Ising machines. Using this technique, the Hamiltonian of the Ising machine is gradually transformed from an easily solvable Hamiltonian to the target Hamiltonian. However, its purported effectiveness is primarily motivated by an analogy to quantum adiabatic annealing, and systematic benchmarking has remained limited. In this work, we analyze the classical adiabatic annealing technique using continuation methods. Motivated by insights from this analysis, we propose an optimized annealing strategy we refer to as hybrid classical adiabatic annealing. We benchmark our proposed strategy using MaxCut instances with up to 800 spins and problems with external fields, for which it achieves a marginal improvement for a limited set of problems. We conclude that, although theoretically motivated and occasionally beneficial, the hybrid strategy does not offer a sufficient practical advantage over simpler, existing techniques.", "url": "https://arxiv.org/abs/2606.07331", "type": "理论+数值", "summary": "1. 本文运用延拓方法分析了经典绝热退火在Ising机上的表现，并据此提出了一种混合退火策略。\n2. 其核心在于揭示了经典绝热退火类比量子绝热退火的启发式本质，但经系统基准测试发现仅有边际改进。\n3. 该工作表明，尽管混合策略在有限问题集上偶尔有效，但实际优势不足以替代更简单的现有技术。", "summary_source": "deepseek", "authors": [{"name": "Jacob Lamers"}, {"name": "Guy Verschaffelt"}, {"name": "Guy Van der Sande"}], "featured_authors": [{"name": "Jacob Lamers"}, {"name": "Guy Verschaffelt"}, {"name": "Guy Van der Sande"}], "author_count": 3}, {"id": "2606.07339", "category": "quant-ph", "title": "Suppression of Quasiparticle Poisoning to $10^{-11}$ Levels in Superconducting Qubits via Infrared Shielding", "abstract": "Quasiparticle poisoning bottlenecks superconducting qubits, limiting coherence and the scalability of quantum processors. In this work, we systematically investigate quasiparticle poisoning in superconducting qubits under three infrared (IR) shielding configurations, ranging from a dedicated multi-layer design to a simplified implementation. By measuring quasiparticle-induced parity switching, we demonstrate a suppression of the switching rate by over four orders of magnitude via the implementation of improved shielding. In the best configuration, the rate decreases over time following cooldown and reaches 0.069$\\,$Hz on day 34, corresponding to an anticipated quasiparticle density per Cooper pair of $1.88\\times10^{-11}$. To our knowledge, this represents the lowest quasiparticle density reported in the literature to date. The remaining quasiparticle population is likely dominated by sporadic phonon bursts stemming from mechanical stress release in the on-chip films, as well as from the surrounding environment. The effective qubit temperature follows the phonon bath down to 17$\\,$mK, enabling initialization errors of $\\sim 0.01\\%$ for 3$\\,$GHz qubits. These results demonstrate that proper IR shielding and thermalization are essential for suppressing quasiparticle poisoning and enabling high-coherence, scalable superconducting qubit systems.", "url": "https://arxiv.org/abs/2606.07339", "type": "理论", "summary": "1. 该工作通过系统测量三种红外屏蔽配置下的宇称切换率，展示了超导量子比特中准粒子中毒的抑制效果。\n2. 其卖点在于将准粒子诱导的宇称切换率抑制超过四个数量级，达到0.069 Hz，对应准粒子密度低至每库珀对1.88×10^{-11}，创文献最低纪录。\n3. 这为通过红外屏蔽与热化实现高相干可扩展超导量子比特系统提供了关键指导，剩余准粒子主要源于机械应力释放的声子爆发。", "summary_source": "deepseek", "authors": [{"name": "Wei-En Lin"}, {"name": "Chen-Hsun Ma"}, {"name": "Erh-Hsiang Yeh"}, {"name": "Wei-Lun Peng"}, {"name": "Yu-Sen Wei"}, {"name": "Hsi-Sheng Goan"}, {"name": "Cen-Shawn Wu"}, {"name": "Chung-Ting Ke"}, {"name": "Yung-Fu Chen"}, {"name": "Chii-Dong Chen"}], "featured_authors": [{"name": "Wei-En Lin"}, {"name": "Chen-Hsun Ma"}, {"name": "Erh-Hsiang Yeh"}, {"name": "Chung-Ting Ke"}, {"name": "Yung-Fu Chen"}, {"name": "Chii-Dong Chen"}], "author_count": 10}, {"id": "2606.07425", "category": "quant-ph", "title": "Tomography of quantum states with bounded extent", "abstract": "We give a general framework for tomography of states that have bounded-extent with respect to a structured class of states. Let $\\textsf{C}$ be a family of $n$-qubit states such that: $(i)$ $\\textsf{C}$ is succinctly representable and $(ii)$ there is a weak agnostic learner of $\\textsf{C}$. We give a tomography protocol for an unknown state $|\\psi\\rangle$ that is promised to admit a decomposition of the form $|\\psi\\rangle = \\sum_i c_i |\\phi_i\\rangle$, where $|\\phi_i\\rangle \\in \\textsf{C}$ with bounded $\\ell_1$-norm of the coefficients (which we call extent). Our main contribution is to show that a weak agnostic learner for $\\textsf{C}$ can be boosted into a tomography algorithm for states with bounded extent with respect to $\\textsf{C}$. Our reduction is black-box and applies broadly across model classes. As an application, when $\\textsf{C}$ is the class of stabilizer states, we obtain tomography algorithms for states with stabilizer extent $\\xi$ up to trace distance $\\varepsilon$, in time $\\textsf{poly}(n,(\\xi/\\varepsilon)^{\\log(\\xi/\\varepsilon)})$, which is improvable to $ \\textsf{poly}(n,\\xi,1/\\varepsilon)$ assuming the algorithmic polynomial Freiman-Ruzsa conjecture in the high-doubling regime. When the unknown state $|\\psi\\rangle$ is arbitrary, we give an algorithmic decomposition result in the spirit of a weak regularity lemma for quantum states with respect to $\\textsf{C}$ and show that the structure in $|\\psi\\rangle$ that is explainable by $\\textsf{C}$ can be efficiently learned. Our main conceptual message is that agnostic learning of a structured base class automatically yields learnability of its low-complexity linear span.", "url": "https://arxiv.org/abs/2606.07425", "type": "理论+数值", "summary": "1. 该工作提出了一个通用框架，用于对相对于结构化态类具有有界幅度的量子态进行层析。\n2. 其核心在于将弱agnostic学习器黑盒提升为层析算法，并以稳定子态为例实现了多项式时间复杂度。\n3. 这揭示了弱学习能力自动赋予低复杂度线性张成可学习性，为量子态结构学习提供了普遍途径。", "summary_source": "deepseek", "authors": [{"name": "Srinivasan Arunachalam"}, {"name": "Arkopal Dutt"}], "featured_authors": [{"name": "Srinivasan Arunachalam"}, {"name": "Arkopal Dutt"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
