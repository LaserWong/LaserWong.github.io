across a vacancy approaches a $J_2$-dependent plateau $T_\\infty(J_2)$ that grows from $0.11$ to $0.33$ over the same range, and the Affleck-Ludwig boundary entropy is small and approximately constant, $\\log g_\\infty \\approx -0.073$, well above the Ising fixed-BC value $-\\ln\\sqrt{2}$ and close to the free-boundary value. The three observables vary smoothly and monotonically with $J_2$, consistent with a one-parameter family of partially transmissive conformal defects controlled by $J_2$. Throughout, the critical line is located using the bulk spin-correlator exponent $\\eta=1/4$, the order-parameter exponent of the Ising universality class, which provides a robust criterion in this open geometry.", "url": "https://arxiv.org/abs/2607.06511", "type": "理论+数值", "summary": "1. 该工作利用DMRG重新计算了临界J1-J2横场伊辛链中两个静态非磁空位的相互作用与关联。\n2. 核心发现在于空位-空位相互作用沿临界线呈代数衰减，指数α弱依赖于J2/J1（约1.07至1.16），且空位表现为一族受J2控制的透射性共形缺陷。\n3. 这为在伊辛普适类临界系统中通过次近邻耦合连续调控局部缺陷的共形边界条件提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "R. L. Silva"}, {"name": "R. C. Silva"}, {"name": "R. J. C. Lopes"}, {"name": "A. R. Pereira"}], "featured_authors": [{"name": "R. L. Silva"}, {"name": "R. C. Silva"}, {"name": "R. J. C. Lopes"}, {"name": "A. R. Pereira"}], "author_count": 4}, {"id": "2607.05485", "category": "hep-th", "title": "An inquiry on the Absence of Fermion Doubling and why the Nielsen-Ninomiya Theorem Does Not Apply to Nonlocal Quantum Field Theory", "abstract": "In this paper we will examine if nonlocal quantum field theory will suffer from the fermion doubling pathology. We find that for a nonlocal Dirac theory, that no additional fermion species are introduced. This is provided that the form factor is nonvanishing at every point. The proof follows from the invertibility of the entire-function operator, which implies that the nonlocal Dirac operator has exactly the same kernel and finite-momentum zero set as the original local Dirac operator. We will distinguish this result from the standard Nielsen-Ninomiya theorem, which applies local lattice Fermions on a compact Brillouin zone. We provide a general criterion for fermion doubling, a test for Genuine and false doubling, and then a test procedure for mathematical and physical fermion doubling. We then will go on to distinguish this result from finite derivative truncations, which can introduce spurious polynomial zeros. We then conclude that fermion doubling is absent in the full continuum nonlocal theory.", "url": "https://arxiv.org/abs/2607.05485", "type": "理论", "summary": "1. 该工作考察非局域量子场论中的费米子加倍问题，证明在非局域狄拉克理论中，只要形状因子处处非零，则不会引入额外费米子种类。\n2. 其卖点在于利用整体函数算符的可逆性，证明非局域狄拉克算符与局域算符具有相同的核与有限动量零集，并给出区分真假加倍的一般判据。\n3. 这揭示了Nielsen-Ninomiya定理对非局域理论不适用，并警示有限导数截断可能引入虚假零点，为连续非局域理论的无加倍性提供了严谨依据。", "summary_source": "deepseek", "authors": [{"name": "J. W. Moffat"}, {"name": "Arvin Kouroshnia"}], "featured_authors": [{"name": "J. W. Moffat"}, {"name": "Arvin Kouroshnia"}], "author_count": 2}, {"id": "2607.05487", "category": "hep-th", "title": "$α'$-Bootstrap", "abstract": "Due to the exponential growth in the number of terms, computing $\\alpha'$-corrections to string theory's low-energy effective actions is a challenging matter. In order to fix all the couplings, one has usually to deal with a large number of string scattering amplitudes. This difficulty can be overcome by exploiting T-duality, which severely constrains the allowed structure of the effective action. It is then convenient to work in a formulation where T-duality is a manifest symmetry. Building on a series of previous works by some of the authors, we present a refined version of an elegant and effective procedure that allows to obtain all the higher-derivative corrections of the NS-NS sector of sting theories at order $\\alpha'$ and $\\alpha'^2$, up to an overall coefficient. We dub this approach $\\alpha'$-bootstrap, since it is based only on consistency conditions and avoids the direct computation of scattering amplitudes. The procedure relies on an infinite dimensional algebraic structure that we present in full detail, and it is conjectured to work at all orders. Although, at the moment, it still misses the $\\zeta$-like corrections starting at order $\\alpha'^3$, the ease with which it can be generalized is promising for future developments in this direction.", "url": "https://arxiv.org/abs/2607.05487", "type": "理论", "summary": "1. 该工作提出基于T对偶性作为显式对称性的α'-自举方法，利用无穷维代数结构由一致性条件确定弦论NS-NS扇区低能有效作用量在α'与α'^2阶的所有高阶导数修正，仅剩一个整体系数未定。\n2. 其核心卖点在于完全规避直接计算大量散射振幅，通过T对偶约束与代数自洽性高效固定所有耦合，并明确呈现了该无穷维代数结构的具体形式。\n3. 该方法虽目前无法处理α'^3阶起出现的ζ类修正，但其代数框架的简洁性与可推广性暗示了向任意阶以及R-R扇区扩展的可行道路。", "summary_source": "deepseek", "authors": [{"name": "Achilleas Gitsis"}, {"name": "Falk Hassler"}, {"name": "Luca Scala"}], "featured_authors": [{"name": "Achilleas Gitsis"}, {"name": "Falk Hassler"}, {"name": "Luca Scala"}], "author_count": 3}, {"id": "2607.05488", "category": "hep-th", "title": "The Fate of Black Hole-Induced Moduli Excursions in the Presence of Scalar Potentials", "abstract": "Large charged black holes can create macroscopic, locally weakly curved regions in which moduli take values different from their asymptotic values. We study how robust this mechanism is once the scalar has a nontrivial potential. In four-dimensional Einstein-Maxwell-dilaton theory, the massless GHS solution provides a finite exterior throat in which the scalar and the gauge coupling vary logarithmically. We develop fixed-throat diagnostics for the competition between the black hole gauge source and a scalar potential, and compare them with back-reacted exterior evolutions when needed. The relevant criterion is not the mere presence of a potential, but how its force behaves along the scalar trajectory traced by the black hole throat. Quadratic stabilizing potentials erase the throat when the Compton wavelength becomes comparable to the horizon scale. Runaway, periodic, and barrier-type potentials instead exhibit distinct failure modes controlled by their slope, sign, oscillations, or barrier distance along the GHS trajectory. A quintessence-like scalar remains effectively massless on astrophysical black hole scales, leaving the throat essentially unobstructed. If the charge belongs to a hidden sector, and if the scalar also controls visible couplings or bulk propagation, such surviving altered-modulus regions could leave phenomenological imprints in near-horizon accretion or emission.", "url": "https://arxiv.org/abs/2607.05488", "type": "理论", "summary": "1. 该工作研究带电黑洞在非平庸标量势存在下诱导模场宏观偏移的鲁棒性，基于四维Einstein-Maxwell-dilaton理论中的GHS解。\n2. 其核心在于发展固定喉诊断方法，揭示竞争判据是势的力沿GHS轨迹的行为而非势的简单存在，并分类了二次型、跑动型、周期型及势垒型势的失效模式。\n3. 若电荷来自暗区且标量控制可见扇区耦合，幸存模偏移区域可在近地平线吸积或发射过程中产生可探测的唯象印记。", "summary_source": "deepseek", "authors": [{"name": "Karim Benakli"}, {"name": "Anna Chrysostomou"}], "featured_authors": [{"name": "Karim Benakli"}, {"name": "Anna Chrysostomou"}], "author_count": 2}, {"id": "2607.05490", "category": "hep-th", "title": "A Novel Matrix Model for the M5-brane?", "abstract": "We provide a new formal extension of the BFSS matrix model by an additional 5-bracket. Maximal supersymmetry leads us to promote the BFSS 2-bracket structure constants to a dynamical field governed by a Chern-Simons-like kinetic term, as well as a novel potential self-duality relation with respect to the 5-bracket. We show that the full action is invariant under maximal supersymmetry and that the associated supersymmetry algebra closes. This result hinges on a conspiracy of properties of the $SO(9)$ gamma matrices and the 2- and 5-brackets. Compellingly, the resulting model seems to realize some features expected of a theory containing M5-branes and opens up the possibility of further including higher brackets for the M6- and M9-branes.", "url": "https://arxiv.org/abs/2607.05490", "type": "理论", "summary": "1. 该工作对BFSS矩阵模型进行了形式扩展，引入5-括号并提升2-括号结构常数为动力学场。\n2. 其核心在于通过Chern-Simons-like动能项与势能自对偶关系实现最大超对称性并保证代数闭合。\n3. 该模型实现了M5-膜的若干预期特征，为纳入M6-及M9-膜的高阶括号拓展提供了框架。", "summary_source": "deepseek", "authors": [{"name": "Manuel Artime"}, {"name": "Ralph Blumenhagen"}, {"name": "Thomas Raml"}], "featured_authors": [{"name": "Manuel Artime"}, {"name": "Ralph Blumenhagen"}, {"name": "Thomas Raml"}], "author_count": 3}, {"id": "2607.05496", "category": "hep-th", "title": "6d Supergravity Blocks", "abstract": "We propose a systematic framework for constructing six-dimensional supergravity theories with eight supercharges that respect all known consistency constraints, including anomaly cancellation and the non-perturbative ${\\it H}$-string constraints recently discovered by Kim, Vafa, and Xu. The basic objects in this framework are ${\\it supergravity\\,blocks}$, which are minimal collections of tensor multiplets consisting of a single little string theory sharing the ${\\it H}$-string charge together with additional tensors whose string charges intersect it positively. A characteristic feature of each supergravity block is that its Gram matrix has exactly one positive eigenvalue, and therefore it necessarily contains gravitational BPS strings that cannot become tensionless anywhere in tensor moduli space. Any consistent 6d $(1,0)$ supergravity theory can then be obtained by gluing compatible blocks and subsequently enhancing the gauge algebras and matter content. As a first step toward establishing this framework concretely, we provide a complete classification of the ${\\it non\\text{-}Higgsable\\,supergravity\\,blocks}$, (or ${\\it non\\text{-}Higgsable\\,gravity\\,blocks}$ for short) namely those built from tensor multiplets that support only non-Higgsable gauge algebras.", "url": "https://arxiv.org/abs/2607.05496", "type": "理论", "summary": "1. 该工作提出了一个系统框架，用于构造满足反常消除与非微扰H-弦约束的六维(1,0)超引力理论。\n2. 核心技术是超引力块概念：每个块由共享H-弦荷的小弦理论及正相交的额外张量多重态构成，其Gram矩阵唯一正特征值导致引力BPS弦在张量模空间中永不丧失张力；任意一致理论可通过胶合兼容块并增强规范代数实现。\n3. 对非Higgsable块的完整分类作为第一步，为六维超引力理论的模块化构造与一致性约束提供了明确构建单元，并奠定了理解规范对称性增强的基础。", "summary_source": "deepseek", "authors": [{"name": "Yuta Hamada"}, {"name": "Seongmin Jeon"}, {"name": "Hee-Cheol Kim"}], "featured_authors": [{"name": "Yuta Hamada"}, {"name": "Seongmin Jeon"}, {"name": "Hee-Cheol Kim"}], "author_count": 3}, {"id": "2607.05503", "category": "hep-th", "title": "Bootstrapping black holes at low impact parameter", "abstract": "We study the low-impact-parameter bootstrap for gravitational effective field theories (EFTs) using the stringy dispersion relation (SDR). After incorporating eikonal spectral support, we ask where the residual spectrum is supported in partial-wave space. On finite grids, the extremal spectra are far from featureless: a cap-saturated low-impact band tracking an order-one Giddings-Porto rotating black-hole scale appears across a substantial part of the allowed EFT boundary being examined, accompanied by a separate Regge-like high-spin ridge. A broad region between this black-hole-band and the eikonal input layer is available to the optimizer but remains largely empty. The gap is available but expensive; the black-hole-scale band is capped and useful. Thus the pole-subtracted bootstrap acts as a microscope for the small-impact-parameter completion of gravity: it resolves organized black-hole-scale and Regge-like structures rather than a featureless residual continuum.", "url": "https://arxiv.org/abs/2607.05503", "type": "理论", "summary": "1. 该工作利用弦论色散关系，研究了引力有效场论在低冲击参数下的引导，并结合eikonal谱支持分析了部分波空间中的极端谱结构。\n2. 其关键发现是极端谱中出现了饱和的低冲击黑洞尺度带和独立的Regge状高自旋脊，其间存在一个昂贵但可用的优化空隙。\n3. 这表明极点减除引导充当了小冲击参数引力完成的显微镜，能够解析出有序的黑洞尺度和Regge结构而非无特征连续谱。", "summary_source": "deepseek", "authors": [{"name": "Diptarka Das"}, {"name": "Aninda Sinha"}], "featured_authors": [{"name": "Diptarka Das"}, {"name": "Aninda Sinha"}], "author_count": 2}, {"id": "2607.05512", "category": "hep-th", "title": "Higher-dimensional chaotic features and random matrix signatures following a local quench", "abstract": "We study the multidimensional erratic structure of correlation functions produced by local operator quenches in finite-volume free massive scalar field theory in dimensions 2 and 3. The basic observable is the subtracted equal-time two-point function in the locally excited state and its spatiotemporal patterns of extrema. We analyze these extrema by the multidimensional diagnostics recently introduced for chaotic scattering amplitudes and related problems: all-pair distance distributions, nearest-neighbor spacings, greedy-path spacing ratios, and the extrema form factor. For the $1+1$-dimensional local quench we find that, in the regime of small Euclidean smearing, the fitted extremum statistics move close to the $\\beta=1$ random-matrix benchmark, while increasing the smearing scale softens the effective repulsion and moves the distributions away from the GOE-like value. For the $2+1$-dimensional local quench we find that the nearest-neighbor statistics of the refined extrema are close to, or above, the $\\beta=1$ benchmark, and the greedy-path ratio statistics are described by even larger effective $\\beta$ values. Finally we studied the all-pair extrema spatial form factor and found that, in the one-, two-, and three-dimensional cases, its main structure is controlled by the corresponding uniform interval, rectangle, or cuboid geometry of the extrema cloud and found the dip-ram-plateau structure in the last two cases. Thus the form factor provides a complementary global diagnostic of how the extrema fill their effective metric support, while the genuinely nontrivial local and mesoscopic organization is carried by the nearest-neighbor and greedy-path statistics.", "url": "https://arxiv.org/abs/2607.05512", "type": "理论", "summary": "1. 该工作通过多维度极值统计诊断，研究了有限体积自由标量场论中局域淬火后关联函数极值的高维混沌特征与随机矩阵签名。\n2. 其核心在于发现1+1维小涂抹时极值统计接近β=1 GOE标度，2+1维最近邻与贪心路径比统计达到或超越该基准，且形式因子呈现受极值云几何控制的dip-ram-plateau结构。\n3. 这为局域激发后量子系统混沌性的高维刻画提供了全局与局域诊断框架，并启示在相互作用系统中的推广性。", "summary_source": "deepseek", "authors": [{"name": "Dmitry S. Ageev"}, {"name": "Jacob Sonnenschein"}], "featured_authors": [{"name": "Dmitry S. Ageev"}, {"name": "Jacob Sonnenschein"}], "author_count": 2}, {"id": "2607.05515", "category": "hep-th", "title": "Spacetime Duality Beyond Conformality", "abstract": "We extend the spacetime duality programme of Burgess \\textit{ this http URL .} to massive theories in 1+1 dimensions. For the massive scalar, a heat-kernel computation tracking three contributions to the conformal-mode effective action reveals that the naive leading correction $\\sim m^2(e^{\\phi} -1)$ to the Liouville action cancels exactly, with the genuine leading deformation being $-\\frac{m^2}{16\\pi}(e^{\\phi}-1)^{2}$. This breaks self-duality and renders the dual theory for the Lagrange multiplier field $\\Lambda$ non-local. For the massive Dirac fermion, two independent derivations establish that the fermion mass dresses under conformal scaling as $m \\to m\\, e^{\\phi/2}$, reflecting the Weyl weight $\\frac{1}{2}$ of the two-dimensional spinor. Via the Coleman-Mandelstam bosonisation, this transfers to the mass bilinear as $\\mu\\cos(\\beta\\vartheta) \\to \\mu e^{\\phi/2}\\cos(\\beta\\vartheta)$, producing a coupled Liouville-sine-Gordon system as the natural starting point for the fermionic construction. Both results are interpreted in terms of the determinant line bundle over Met($\\Sigma$)/Diff($\\Sigma$).", "url": "https://arxiv.org/abs/2607.05515", "type": "理论", "summary": "1. 该工作将有质量标量场与狄拉克费米子纳入1+1维时空对偶性框架，超越共形对称性限制。\n2. 通过热核计算和Coleman-Mandelstam玻色化，揭示了标量场中表观质量修正的精确抵消，真正主导项为-m²(e^φ-1)²/16π，破坏自对偶性并使对偶理论非局域；而费米子质量在共形标度下变换为m e^{φ/2}，玻色化后生成耦合的Liouville-sine-Gordon系统。\n3. 这些结果由Met(Σ)/Diff(Σ)上行列式线丛的结构给出统一几何解释，为有质量理论中时空对偶性的非共形变形及非局域性来源提供了关键例证。", "summary_source": "deepseek", "authors": [{"name": "Jeff Murugan"}, {"name": "Horatiu Nastase"}], "featured_authors": [{"name": "Jeff Murugan"}, {"name": "Horatiu Nastase"}], "author_count": 2}, {"id": "2607.05529", "category": "hep-th", "title": "Ten-dimensional localization", "abstract": "We construct equivariantly closed polyforms for the fluxes and the action of (massive) type IIA and type IIB supergravity directly in ten dimensions. We illustrate applications of our formalism to two distinct classes of solutions in massive type IIA. Our analysis straightforwardly reproduces and vastly generalizes all known results for on-shell actions in these classes, with no need for a consistent truncation. Where known, we match the corresponding field theory partition functions at leading order, and our results extend easily to other solutions of type II supergravity.", "url": "https://arxiv.org/abs/2607.05529", "type": "理论", "summary": "1. 该工作直接在十维中构造了适用于通量及（有质量）IIA/IIB型超引力作用的等变闭多形式。\n2. 其技术核心在于无需一致截断即可重现并大幅推广已知壳层作用，且与前导阶场论配分函数精确匹配。\n3. 该形式可自然推广至其他II型超引力解，为全维度局域化计算及对偶性验证提供统一框架。", "summary_source": "deepseek", "authors": [{"name": "Christopher Couzens"}, {"name": "Alice Lüscher"}, {"name": "James Sparks"}], "featured_authors": [{"name": "Christopher Couzens"}, {"name": "Alice Lüscher"}, {"name": "James Sparks"}], "author_count": 3}, {"id": "2607.05530", "category": "hep-th", "title": "Localized zero modes enhance massive Casimir interactions", "abstract": "Massive quantum fields usually mediate Casimir interactions that are exponentially screened beyond their Compton wavelength. We show that an isolated normalizable zero mode in a classical background opens a low-frequency collective channel that bypasses this screening. The effective interaction is universal, controlled only by the zero-mode profile. Kinks and planar domain walls provide robust realizations, with the sine-Gordon/Pöschl--Teller kink as an exactly solvable example. Localized zero modes thus define a generic infrared mechanism for modifying massive vacuum forces.", "url": "https://arxiv.org/abs/2607.05530", "type": "理论", "summary": "1. 该工作证明了经典背景中的孤立可归一化零模可以打开低频集体通道，从而增强本应被指数屏蔽的大质量卡西米尔相互作用。\n2. 其关键物理在于零模轮廓唯一地决定了有效相互作用的普适形式，并通过正弦-戈登/珀施尔-特勒扭结实现了精确可解验证。\n3. 这一发现揭示了大质量真空力中局域化零模作为通用红外机制的启发性，为调控相关体系真空涨落提供了明确思路。", "summary_source": "deepseek", "authors": [{"name": "Jose M. Muñoz-Castañeda"}, {"name": "Inés Cavero-Peláez"}, {"name": "Gonzalo Sancho-Garrido"}], "featured_authors": [{"name": "Jose M. Muñoz-Castañeda"}, {"name": "Inés Cavero-Peláez"}, {"name": "Gonzalo Sancho-Garrido"}], "author_count": 3}, {"id": "2607.05551", "category": "hep-th", "title": "Domain Walls in Large-$N$ QCD$_3$", "abstract": "Large-$N$ three dimensional QCD with a level $k$ Chern-Simons term and $N_f$ massless flavours admits $N_f+1$ degenerate vacua. We discuss various aspects of the domain walls that interpolate between those vacua. Using a bosonic dual for the case $k \\ge N_f/2$ we write down the profile of the composite wall. By fluctuating the profile, we find the 2d field theory that lives on the wall, a level-$N$ gauged WZW model, and compare it with a theory that was previously obtained by using anomaly inflow considerations. We also discuss the case $k < N_f/2$. Finally, we remark on the realisation of the wall as a D-brane in a holographic dual.", "url": "https://arxiv.org/abs/2607.05551", "type": "理论", "summary": "1. 该工作研究了大$N$三维QCD中连接$N_f+1$个简并真空的畴壁，并利用玻色子对偶推导了$k\\ge N_f/2$情形下的复合壁轮廓。\n2. 其卖点在于通过涨落轮廓得到壁上二维场论为level-$N$规范WZW模型，验证了与反常流入分析的一致性，并在全息对偶中实现为D-膜。\n3. 这为揭示大$N$ QCD畴壁低能动力学及全息物理解释提供了精确框架，并可推广至$k<N_f/2$区域的非平凡行为。", "summary_source": "deepseek", "authors": [{"name": "Adi Armoni"}, {"name": "Jonathan Whittle"}], "featured_authors": [{"name": "Adi Armoni"}, {"name": "Jonathan Whittle"}], "author_count": 2}, {"id": "2607.05588", "category": "hep-th", "title": "M-theory geometries from five-brane webs, seven-branes, and T-branes", "abstract": "We track the chain of dualities relating five-brane webs in Type IIB to M-theory on noncompact Calabi-Yau threefolds, and follow the effect of adding $(p,q)$ seven-branes. T-dualizing along the seven-brane, a junction of D5-branes ending on a D7-brane becomes a single smooth D6-brane wrapping a smooth holomorphic curve, which uplifts directly to an M-theory geometry. Treating the branes as coherent sheaves (tachyon condensation), we obtain a spectral-curve dictionary that maps non-Abelian (T-brane) partition data to explicit complex-structure deformations of the threefold. As applications we (i) give a physical derivation of these deformations, (ii) exhibit a simple geometric prototype of an s-rule violation, and (iii) link T-brane data to geometry.", "url": "https://arxiv.org/abs/2607.05588", "type": "理论", "summary": "1. 该工作通过对偶链将IIB型五膜网、七膜及T膜与M理论非紧Calabi-Yau三流形的几何对应完整建立。\n2. 技术核心在于以相干层快子凝聚导出谱曲线映射，将非阿贝尔T膜分割数据直接转化为三流形的显式复结构形变，并给出s-规则违反的简单几何原型。\n3. 这为从弦论膜构型物理推导几何形变提供了明确字典，并建立了T膜数据与Calabi-Yau形变之间的直接联系。", "summary_source": "deepseek", "authors": [{"name": "Andrés Collinucci"}], "featured_authors": [{"name": "Andrés Collinucci"}], "author_count": 1}, {"id": "2607.05656", "category": "hep-th", "title": "Degenerations of flat connections on Riemann surfaces", "abstract": "The integration kernels for polylogarithm functions on a compact Riemann surface of arbitrary genus $h$ are shown to close as the surface undergoes a non-separating degeneration to one of genus $h{-}1$. Explicit formulas are obtained for the non-separating degeneration of the multivariable Enriquez connection for genus $h$ with an arbitrary number of variables to the Enriquez connection for genus $h{-}1$ with two additional punctures whose Lie algebra generators are related to the original ones by the characteristic Bernoulli generating functions known from the degeneration at $h=1$. Analogous degeneration formulas are obtained for the single-valued DHS kernels at the leading order in the real degeneration parameter that is adapted to relating modular tensors at genus $h$ and $h{-}1$.", "url": "https://arxiv.org/abs/2607.05656", "type": "理论", "summary": "1. 该工作证明了任意亏格h紧黎曼面上多对数函数积分核在非分离退化至亏格h-1时闭合，并推导了多变量Enriquez连接退化至带额外两刺点情形时的显式公式。\n2. 其技术核心是利用特征伯努利生成函数将退化前后李代数生成元关联，并推广至单值DHS核在实退化参数下的首阶行为，建立模张量的亏格间对应。\n3. 这为高亏格黎曼面上多对数函数与代数结构的退化理论提供了系统框架，启发后续研究其与模空间几何的深层联系。", "summary_source": "deepseek", "authors": [{"name": "Mattia Biancotto"}, {"name": "Eric D'Hoker"}, {"name": "Axel Kleinschmidt"}, {"name": "Michele Santagata"}, {"name": "Oliver Schlotterer"}], "featured_authors": [{"name": "Mattia Biancotto"}, {"name": "Eric D'Hoker"}, {"name": "Axel Kleinschmidt"}, {"name": "Michele Santagata"}, {"name": "Oliver Schlotterer"}], "author_count": 5}, {"id": "2607.05678", "category": "hep-th", "title": "Holograms and Standard Models", "abstract": "Despite riddles, mysteries, and enigmas the theory of elementary particles has not changed for 50 years. We argue that the current paradigm -- Wilsonian quantum field theory -- is inadequate for resolving the puzzles, and should be replaced by a new paradigm based on the Holographic Principle. We show how a simplified but still very rich standard model emerges from de Sitter holography in the flat-space limit and explain why the puzzle of huge quantum corrections to the cosmological constant simply does not occur in the holographic paradigm.", "url": "https://arxiv.org/abs/2607.05678", "type": "理论", "summary": "1. 该工作主张用全息原理取代威尔逊量子场论作为新的基本范式，以解决当前粒子物理标准模型面临的深层谜题。\n2. 其核心在于从德西特全息术在平坦空间极限下涌现出简化的标准模型，并论证宇宙常数巨大量子修正问题在全息框架中根本不会出现。\n3. 这为重新理解基本粒子的起源、宇宙常数的自然性以及全息对偶在现实物理中的应用提供了根本性的范式转变启发。", "summary_source": "deepseek", "authors": [{"name": "Shoichiro Miyashita"}, {"name": "Yasuhiro Sekino"}, {"name": "Leonard Susskind"}], "featured_authors": [{"name": "Shoichiro Miyashita"}, {"name": "Yasuhiro Sekino"}, {"name": "Leonard Susskind"}], "author_count": 3}, {"id": "2607.05788", "category": "hep-th", "title": "Dipole ghosts and spontaneous symmetry breaking in higher-order Chern-Simons theory", "abstract": "In this work, we investigate the emergence of dipole ghost structures in gauge theories at both the classical and quantum levels. Traditionally, dipole ghosts are introduced through an auxiliary field $\\chi$ satisfying $\\Box^2\\chi=0$, whose presence is reflected in the appearance of double poles in the propagator. We show that such dipole ghost sectors can instead be understood as a consequence of the multiplicity of solutions of the classical equations of motion. To establish this connection, we develop a constructive method and first apply it to covariant Maxwell theory in $(2+1)$ dimensions, where the essential ingredients can be identified in a transparent manner. We then extend the analysis to the constrained higher-order Chern-Simons theory, demonstrating that the same mechanism gives rise to dipole ghost sectors and associated double poles in the propagator. Our results provide a unified perspective on the origin of dipole ghosts, relating them directly to the degeneracy structure of the underlying classical dynamics. As a physical application, we investigate spontaneous symmetry breaking and compute the one-loop effective potential. We show that symmetry breaking removes the degeneracy underlying the dipole ghost sector, leading to a spectrum of ordinary massive gauge excitations that determine the quantum vacuum structure of the theory.", "url": "https://arxiv.org/abs/2607.05788", "type": "理论", "summary": "1. 该工作研究了高阶陈-西蒙斯理论中偶极子鬼结构的经典与量子起源，并探讨其与自发对称性破缺的关联。\n2. 通过构造性方法证明偶极子鬼扇区源自经典运动方程解的多重简并性，表现为传播子中的双极点结构。\n3. 自发对称性破缺消除简并后，理论产生普通有质量规范激发，为理解量子真空结构提供了统一视角。", "summary_source": "deepseek", "authors": [{"name": "Carlos M. Reyes"}, {"name": "César Riquelme"}, {"name": "Angel Sanchez"}], "featured_authors": [{"name": "Carlos M. Reyes"}, {"name": "César Riquelme"}, {"name": "Angel Sanchez"}], "author_count": 3}, {"id": "2607.05884", "category": "hep-th", "title": "A Crash Course in Supersymmetric Field Theory Across Dimensions", "abstract": "These notes give a cross-dimensional crash course in supersymmetric field theory. The goal is to provide enough common language to recognize the basic setups used in talks and papers, while also working through representative computations that make the terminology concrete. We begin with supersymmetry algebras, multiplets, protected quantities, moduli spaces, deformations, and anomalies, then follow these ideas through examples in two to ten spacetime dimensions. The emphasis is on recurring structures, such as holomorphy, supersymmetric vacua, dualities, extremization principles, indices, BPS data, and anomaly constraints, rather than on a classification of theories in any one dimension.", "url": "https://arxiv.org/abs/2607.05884", "type": "理论", "summary": "1. 该工作以跨维度视角系统梳理了超对称场论的核心概念，涵盖代数、多重态、受保护量、模空间与反常，并通过2至10维示例阐明统一结构。\n2. 其卖点在于聚焦全纯性、超对称真空、对偶性、极值原理、指标及BPS数据等重复出现的主题，而非逐维分类，从而提炼出跨维度通用框架。\n3. 这为研究者提供了一套连贯的概念语言与计算范例，可启发对超对称理论中基本约束与构造的深入理解和跨维推广。", "summary_source": "deepseek", "authors": [{"name": "Xingyang Yu"}], "featured_authors": [{"name": "Xingyang Yu"}], "author_count": 1}, {"id": "2607.06042", "category": "hep-th", "title": "Background-independent one-loop renormalization of tensor and scalar primordial spectra", "abstract": "We present a background-independent renormalization framework for one-loop primordial spectra. We apply it to two observables: the scalar-induced tensor spectrum sourced by a minimally coupled spectator field, and the scalar spectrum generated by potential self-interactions. In both cases, the UV part of the loops is isolated and, using the universal WKB behavior of the internal modes, the UV poles are extracted analytically and absorbed into local counterterms without having to specify either the background evolution or the full dynamics of the field running in the loop. This yields finite model-independent expressions for the renormalized spectra amenable to numerical analysis.", "url": "https://arxiv.org/abs/2607.06042", "type": "理论", "summary": "1. 该工作提出了一个背景无关的单圈重整化框架，应用于标量诱导张量谱与自相互作用标量谱的原初功率谱计算。\n2. 其技术优势在于利用内部模的普适WKB行为，无需指定背景演化或完整动力学即可解析提取紫外极点并吸收为局域对消项。\n3. 这为获得有限且模型无关的再正规化原初谱表达式提供了数值可算的明确途径，适用于一般宇宙学背景。", "summary_source": "deepseek", "authors": [{"name": "Guillermo Ballesteros"}, {"name": "Jesús Gambín Egea"}, {"name": "Flavio Riccardi"}], "featured_authors": [{"name": "Guillermo Ballesteros"}, {"name": "Jesús Gambín Egea"}, {"name": "Flavio Riccardi"}], "author_count": 3}, {"id": "2607.06050", "category": "hep-th", "title": "Genuine Multi-Entropy in the Toric Code", "abstract": "We study genuine multi-entropy as a diagnostic of multipartite entanglement in the toric code, which provides a controlled setting for probing multipartite structures in topologically ordered states. Our main question is whether genuine multi-entropy captures information that is not reducible to conventional lower-party entropic data, such as topological entanglement entropy. We first analyze toric-code ground states that admit a stabilizer-state description, where the relevant quantities can be evaluated exactly. In this sector, genuine multi-entropy reflects the topological structure and symmetries of the toric code, while exhibiting highly constrained relations to lower-party multi-entropies. We conjecture that, for stabilizer states and ${q}\\ge4$, the ${q}$-partite genuine multi-entropy at replica index $n<{q}$ collapses to a linear combination of multi-entropies involving at most ${q}-2$ parties. We establish this pattern explicitly for ${q}=4$ in the toric code stabilizer sector: for $n=2,3$, the genuine multi-entropy is proportional to the tripartite information $I_3$ and, for the Kitaev--Preskill partition, contains no independent genuine four-partite information beyond that captured by the topological entanglement entropy. At $n=4$, however, this reduction breaks down: the genuine multi-entropy is no longer proportional to $I_3$, but remains a topological invariant of the toric-code stabilizer ground states. For generic non-stabilizer superpositions within the ground-state manifold and for coherent superpositions of local excitations, the low-$n$ reduction also fails. These results show that genuine multi-entropy probes multipartite entanglement structure beyond the tripartite information, and hence beyond the topological entanglement entropy in the Kitaev--Preskill partition, whereas for stabilizer states at low replica index it reduces to lower-partite entropic data.", "url": "https://arxiv.org/abs/2607.06050", "type": "理论", "summary": "1. 该工作通过分析环面码稳定子基态与一般叠加态，系统研究了真实多熵作为多体纠缠诊断的效力与局限。\n2. 核心发现是：在低副本指数下稳定子态的真实多熵可约化为至多q−2体熵的线性组合，但在非稳定子态或高副本指数下此约化失效，揭示其蕴含超越三体信息与拓扑纠缠熵的纠缠结构。\n3. 这为拓扑序中高阶多体纠缠的探测提供了新方案，并启发在更一般拓扑有序态与纠缠度量中的应用与检验。", "summary_source": "deepseek", "authors": [{"name": "Sriram Akella"}, {"name": "Norihiro Iizuka"}, {"name": "Akihiro Miyata"}], "featured_authors": [{"name": "Sriram Akella"}, {"name": "Norihiro Iizuka"}, {"name": "Akihiro Miyata"}], "author_count": 3}, {"id": "2607.06236", "category": "hep-th", "title": "Schwarzschild black holes from twistor space", "abstract": "Twistor theory forms the basis for many surprising advances in areas ranging from dynamical systems to quantum field theory. Yet for almost fifty years, one of the main drawbacks of twistor theory has been its inability to give non-perturbative descriptions of non-chiral (or non-self-dual) field configurations. This difficulty is known as 'the googly problem.' In this paper, we provide a resolution of the googly problem for a particular solution of the vacuum Einstein equations: the Schwarzschild metric. We start with the twistor space of the self-dual Taub-NUT Euclidean gravitational instanton, expressed in Kerr-Schild form. Within this twistor space, we then consider a quadric which corresponds to the anti-self-dual Taub-NUT metric. While the full quadric is not holomorphic with respect to the complex structure of the self-dual Taub-NUT twistor space, its holomorphic locus still has complex dimension two. This 'coincidence locus' -- points in twistor space on the holomorphic portion of the quadric -- inherits a complex structure from the twistor space and a Kähler form from the quadric itself. Remarkably, these structures are compatible, giving rise to a non-self-dual, four-dimensional Kähler metric which is conformal to Schwarzschild (in Lorentzian or Euclidean signature). This is the first instance of a non-self-dual Einstein metric constructed entirely from holomorphic data in a twistor space.", "url": "https://arxiv.org/abs/2607.06236", "type": "理论", "summary": "1. 该工作利用自对偶Taub-NUT扭量空间中的二次曲面的全纯轨迹，构造出非自对偶的四维Kähler度量，共形于Schwarzschild时空。\n2. 其技术核心在于将反自对偶Taub-NUT度量的二次曲面置于自对偶扭量空间中，通过提取“重合轨迹”继承复结构与Kähler形式，实现从全纯数据构建非自对偶Einstein解。\n3. 这首次为扭量理论中“googly问题”提供了时空尺度上的具体解，启示了通过全纯几何构造其他非自对偶引力解的路径。", "summary_source": "deepseek", "authors": [{"name": "Tim Adamo"}, {"name": "Bernardo Araneda"}, {"name": "Sean Seet"}, {"name": "Atul Sharma"}], "featured_authors": [{"name": "Tim Adamo"}, {"name": "Bernardo Araneda"}, {"name": "Sean Seet"}, {"name": "Atul Sharma"}], "author_count": 4}, {"id": "2607.06286", "category": "hep-th", "title": "Determination of thermodynamics from entanglement entropy in the finite-density O(N) model", "abstract": "We nonperturbatively compute Rényi entropies for strip-shaped subregions in the three-dimensional O(4) model at finite density on the lattice. By using a dual variable representation and a tailored worm algorithm, we circumvent the sign problem when sampling the grand canonical ensemble. In the limit of large subregions, we also establish a direct, quantitative relationship between the derivative of entanglement entropy with respect to the size of the entangling region and the thermal entropy density for general quantum field theories, providing a new way to study their thermodynamics. We corroborate this argument with our lattice results by demonstrating that, in the appropriate limit, the derivative of entanglement entropy satisfies the same Maxwell relation as the thermal entropy density.", "url": "https://arxiv.org/abs/2607.06286", "type": "理论", "summary": "1. 该工作通过晶格非微扰模拟，利用双变量表示和蠕虫算法计算了有限密度O(4)模型中带状子区域的Rényi熵，规避了符号问题。\n2. 其技术卖点在于建立了纠缠熵对子区域尺寸的导数与热熵密度在大区域极限下的直接定量关系，并利用晶格结果验证了麦克斯韦关系的成立。\n3. 这为从纠缠熵出发研究一般量子场论的热力学性质提供了新方案，特别适用于存在符号问题的有限密度系统。", "summary_source": "deepseek", "authors": [{"name": "Niko Jokela"}, {"name": "Aatu Rajala"}, {"name": "Tobias Rindlisbacher"}], "featured_authors": [{"name": "Niko Jokela"}, {"name": "Aatu Rajala"}, {"name": "Tobias Rindlisbacher"}], "author_count": 3}, {"id": "2607.06365", "category": "hep-th", "title": "Compact Syzygies for Feynman Integrals from Landau Singularities", "abstract": "We discuss a recent proposal for constructing ``syzygy solutions'', which play a crucial role in integration-by-parts reductions for multi-loop scattering amplitudes. We highlight a relationship between syzygies and the leading Landau singularities of Feynman diagrams and discuss how this implies that integral relations are controlled by infrared singularities. We use this insight to systematically construct highly compact, determinantal syzygy solutions, providing an explicit, simple example at one loop. We demonstrate the power of this approach by applying it to a two-loop pentabox family relevant for the NNLO corrections to $pp \\rightarrow t\\overline{t}H$ at the LHC.", "url": "https://arxiv.org/abs/2607.06365", "type": "理论", "summary": "1. 该工作基于领头朗道奇点与syzygy解之间的关联，提出了一种系统构造费曼积分积分-by-部分约化中紧凑行列式形式解的方法。\n2. 其核心卖点在于揭示了积分关系由红外奇点控制的内在机制，从而在单圈层次显式构建高度紧凑的syzygy解，并推广至两圈五盒族实例。\n3. 这为高圈多粒子散射振幅的高效约化提供了新范式，有望直接推动LHC上如pp→tt̄H过程NNLO修正的精确理论计算。", "summary_source": "deepseek", "authors": [{"name": "Federico Coro"}, {"name": "Pavel P. Novichkov"}, {"name": "Ben Page"}, {"name": "Qian Song"}], "featured_authors": [{"name": "Federico Coro"}, {"name": "Pavel P. Novichkov"}, {"name": "Ben Page"}, {"name": "Qian Song"}], "author_count": 4}, {"id": "2607.06375", "category": "hep-th", "title": "An Intermediate Scale R-axion \\& the QCD Axion", "abstract": "An intermediate scale R-axion faces an immediate obstruction from the Dine-Festuccia-Komargodski (DFK) bound on the superpotential, $2|\\langle W\\rangle|\\leq f_R F$, since for a nearly Minkowski vacuum it typically follows that $f_R\\gtrsim M_{\\rm Pl}$. We show that this lower bound on $f_R$ can be relaxed in an effective construction with the scalar potential tuned near zero via a mixed $F$- and $D$-term uplift, leading to a metastable vacuum in which the usual Planckian-$f_R$ inference from the DFK argument is avoided locally. Validity of the effective field theory and metastability of the small $f_R$ vacuum generically both imply a relaxed bound: $ f_R \\gtrsim \\sqrt{m_{3/2}M_{\\rm Pl}} $. We also highlight that if the R-symmetry has a QCD anomaly, this potentially permits the R-axion to play the role of the QCD axion. TeV-scale supersymmetry permits $f_R\\sim10^{11}$ GeV, this not only evades certain astrophysical and cosmological axion constraints, but notably lies in the window for which the observed dark matter abundance can be reproduced by the R-axion via the misalignment mechanism.", "url": "https://arxiv.org/abs/2607.06375", "type": "理论", "summary": "1. 该工作指出中间尺度R-轴子受Dine-Festuccia-Komargodski超势约束通常要求f_R≥M_Pl，但通过混合F项和D项抬升构造近零真空能的亚稳真空，可在有效理论中局部规避此下界，允许f_R降至中间尺度。\n2. 其物理卖点在于有效场论自洽性与亚稳性联合导出松弛下界f_R≳√(m_{3/2}M_Pl)，且当R对称性具有QCD反常时R-轴子可充当QCD轴子，在TeV超对称下f_R~10^11 GeV落入可行窗口。\n3. 该参数窗口不仅避开恒星冷却与超新星等天体物理及宇宙学轴子约束，还通过错位机制使R-轴子贡献观测暗物质丰度，为超对称轴子暗物质模型提供了参数明确且可检验的实现方案。", "summary_source": "deepseek", "authors": [{"name": "James Unwin"}], "featured_authors": [{"name": "James Unwin"}], "author_count": 1}, {"id": "2607.06379", "category": "hep-th", "title": "Axioms for physical reasoning: codifying the Seiberg--Witten solution in Lean", "abstract": "Mathematicians have embraced interactive theorem provers with growing enthusiasm -- building large shared libraries and machine-checking a string of landmark results. Theoretical physics is different: most of its results are not theorems but justified by arguments the community trusts without a rigorous proof. For many -- the one we treat here among them -- no rigorous proof is within reach. For 4d Yang--Mills theory, deriving exact rigorous results from first principles would first require constructing the interacting theory nonperturbatively, which is a sizable piece of one of the Clay Millennium prize problems. We argue here that an interactive theorem prover can be used to verify some non-rigorous physics arguments. The method is to postulate a short list of explicit, named physical postulates, which imply the physical results by virtue of a machine-checkable proof. The trust that remains then rests on that short, inspectable list, and the prover can report, for any downstream result, exactly which assumptions it used. We carry this out for the Seiberg--Witten solution of ${N}=2$ $SU(2)$ super-Yang--Mills -- the genus-one case -- formalized in Lean 4; the higher-genus $SU(N)$ generalization is developed in the same repository as an axiomatized skeleton and left to future work. We describe what is proved, what is assumed, how the assumptions are checked -- external review and an independent numerical oracle -- and why this discipline is a sound standard for validating AI-generated results in theoretical physics. What we offer is a discipline, reviewable on its own terms: a reader may take the Seiberg--Witten mathematics on trust and still assess the formalization method.", "url": "https://arxiv.org/abs/2607.06379", "type": "理论", "summary": "1. 该工作将四维N=2 SU(2)超杨-米尔斯理论的Seiberg-Witten解（亏格一情形）在Lean 4中形式化，通过明确列出的物理公理实现机器可验证证明。\n2. 其核心在于将非严格物理论证的信任转移至一组简短、可审查的公理列表，并由定理证明器报告每个下游结果所依赖的精确假设集合。\n3. 这一形式化规范为验证理论物理中AI生成结果提供了可靠标准，并可通过更高亏格推广到SU(N)情形，展现了公理化方法在非严格推理中的适用性。", "summary_source": "deepseek", "authors": [{"name": "Michael R. Douglas"}], "featured_authors": [{"name": "Michael R. Douglas"}], "author_count": 1}, {"id": "2607.06384", "category": "hep-th", "title": "Unitary matrix models, quantized symmetric functions and spin chain", "abstract": "We construct a correspondence between a broad class of unitary matrix models and vacuum correlation functions in quantum spin-chain Hilbert spaces. The key step is to lift symmetric functions to operators acting on the $N$-magnon sector in a way that preserves the relevant ring structure. For any unitary matrix model whose integrand admits a factorized expansion in symmetric functions, the Schur orthogonality of the unitary group integral is then translated into the inner product of quantized Schur states. We illustrate the construction for the Gross--Witten--Wadia model, superconformal indices of $\\mathcal{N}=4$ super Yang--Mills theory with classical gauge groups, and Toda tau functions. The resulting operator formulation provides a unified algebraic bridge between unitary matrix integrals, quantum integrable systems and symmetric function theory.", "url": "https://arxiv.org/abs/2607.06384", "type": "理论", "summary": "1. 该工作建立了酉矩阵模型与量子自旋链真空关联函数之间的精确对应关系。\n2. 其核心在于通过保持环结构的对称函数算符化，将酉群积分Schur正交性转化为量子化Schur态内积。\n3. 这一算子形式为矩阵积分、量子可积系统与对称函数理论提供了统一的代数桥梁。", "summary_source": "deepseek", "authors": [{"name": "Gao-fu Ren"}], "featured_authors": [{"name": "Gao-fu Ren"}], "author_count": 1}, {"id": "2607.06486", "category": "hep-th", "title": "Abelian 2-Form Gauge Theory: Basic Canonical Brackets and Nilpotency Property of Noether (Anti-)BRST Charges", "abstract": "Within the framework of Becchi-Rouet-Stora-Tyutin (BRST) formalism, we invoke the beauty of the basic canonical (anti)commutators to prove the nilpotency property of the Noether (anti-)BRST charges for the D-dimensional BRST-quantized version of the free Abelian 2-form gauge theory which is endowed with a non-trivial Curci-Ferrari (CF) type restriction. In this proof, we use only the theoretical strength of the Gauss divergence theorem. We demonstrate that, under the off-shell nilpotent (anti-)BRST symmetry transformations, the Noether conserved (anti-)BRST charges are not invariant and they are also found to be not off-shell nilpotent (if we exploit the standard relationship between the continuous symmetry transformations and their generators as the Noether conserved charges). However, these charges become (anti-)BRST invariant and nilpotent if we use (i) the appropriate equations of motion at suitable places, and (ii) the Gauss divergence theorem. We derive the consistently modified versions of the Noether (anti-)BRST charges which are invariant under the off-shell nilpotent (anti-)BRST transformations. We prove the (anti-)BRST invariance of these modified versions of charges by using the basic canonical (anti)commutators, too. We discuss the physicality criteria w.r.t. (i) the conserved Noether (anti-)BRST charges, and (ii) the modified (anti-)BRST invariant versions of the Noether (anti-)BRST charges. We prove the superiority of the latter over the former (in view of the consistency with the Dirac quantization conditions for the gauge theories).", "url": "https://arxiv.org/abs/2607.06486", "type": "理论", "summary": "1. 该工作在BRST形式下自由阿贝尔2-形式规范理论中，利用基本正反对易关系证明了诺特（反）BRST荷的幂零性质并给出其修正版本。\n2. 其技术要点在于发现标准诺特荷在离壳幂零变换下不幂零，需结合运动方程与高斯散度定理方可实现荷的幂零性与不变性。\n3. 这为规范场论中荷的物理性判据以及狄拉克量子化条件的一致实施提供了更优的理论参考。", "summary_source": "deepseek", "authors": [{"name": "R. P. Malik"}], "featured_authors": [{"name": "R. P. Malik"}], "author_count": 1}, {"id": "2607.06493", "category": "hep-th", "title": "Holographic Tests of the $μ$ Ensemble", "abstract": "We study in detail a recent proposal stating that M-theory observables arising from the quantisation of M2-branes are naturally computed in a fixed $A_3$ ensemble. In a holographic setting this implies that in a semiclassical approximation 11d bulk observables in an asymptotically AdS$_4$ background are computed in a grand canonical ensemble of fixed chemical potential $\\mu$ conjugate to the integer $N$ determining the rank of the gauge group in the dual CFT. We provide detailed precision tests of holography in the fixed $\\mu$ ensemble by focusing on the two leading terms in the derivative expansion of the 11d theory. In addition, we study one-loop logarithmic corrections which we compute in detail. For asymptotically AdS$_4\\times S^7/\\mathbf{Z}_k$ 11d backgrounds our results are in agreement with supersymmetric localisation calculations in the dual ABJM SCFT. Moreover, we employ the logarithmic corrections in the $\\mu$ ensemble to determine the measure of the integral Laplace transform and use this to compute dual SCFT supersymmetric partition functions, like the superconformal index and the squashed $S^3$ partition function, to all orders in the perturbative $1/N$ expansion in terms of Airy functions in harmony with results and conjectures in the dual SCFT.", "url": "https://arxiv.org/abs/2607.06493", "type": "理论", "summary": "1. 该文以M2膜量子化产生的固定化学势系综为基础，对渐近AdS4×S7/Zk背景下的11维超引力理论导数展开前两项及单圈对数修正进行了精确全息检验。\n2. 其核心进展在于利用μ系综中单圈对数修正确定积分拉普拉斯变换测度，进而将ABJM超共形场论的超共形指标及挤压S3配分函数等所有扰动阶1/N展开统一表达为Airy函数形式。\n3. 这一工作为在M理论框架下系统地建立固定化学势系综与超对称局域化计算结果的全息对应关系提供了关键技术支持。", "summary_source": "deepseek", "authors": [{"name": "Nikolay Bobev"}, {"name": "Fridrik Freyr Gautason"}, {"name": "Jesse van Muiden"}], "featured_authors": [{"name": "Nikolay Bobev"}, {"name": "Fridrik Freyr Gautason"}, {"name": "Jesse van Muiden"}], "author_count": 3}, {"id": "2607.06498", "category": "hep-th", "title": "Effective Lagrangian of a fermion field in a nontrivial topology under magnetic effects", "abstract": "We have investigated a fermionic system from the perspective of an effective quantum field theory defined on a nontrivial topology in the presence of an external magnetic field. Using the proper-time representation, we obtained one-loop expressions for the corresponding effective Lagrangian, taking into account all Landau levels in the propagator. We also computed the significant boundary-induced contributions to the system's magnetization. To verify the reliability of our results, we examined the limit of zero temperature and infinite spatial extent, which correctly reproduces the celebrated Schwinger result.", "url": "https://arxiv.org/abs/2607.06498", "type": "理论", "summary": "1. 该工作采用固有时表示，在非平凡拓扑背景下计算了外磁场中费米子有效拉格朗日量的单圈表达式，并完整计入所有朗道能级。\n2. 其技术核心在于系统导出了边界诱导的磁化贡献，并在零温无穷空间极限下精确复现施温格结果，验证了方法的可靠性。\n3. 这为拓扑介质与磁场耦合系统中的真空极化、手征磁效应等量子场论效应研究提供了可解析求解的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Emerson B. S. Corrêa"}, {"name": "Michelli S. R. Sarges"}, {"name": "Airton H. G. Rodrigues"}, {"name": "Carlos A. Bahia"}], "featured_authors": [{"name": "Emerson B. S. Corrêa"}, {"name": "Michelli S. R. Sarges"}, {"name": "Airton H. G. Rodrigues"}, {"name": "Carlos A. Bahia"}], "author_count": 4}, {"id": "2607.06566", "category": "hep-th", "title": "The Chiral Random-Matrix Ensemble of the Type-IIB Axion--Dilaton Wormhole Partition Function", "abstract": "I construct a microscopic ADHM/chiral-Wishart representative of the reduced charge-sector coefficient $W_\\nu[b]$ that enters the Type-IIB axion--dilaton wormhole partition function $Z_{\\rm wh}(\\theta;b)$. I fix the axion-charge sector, equivalently the form-field-flux sector, which plays the exact same structural role as a fixed-topology sector in QCD: it supplies the domain where I compute the microscopic coefficient before forming the final theta sum. At $E=0$, the axion--dilaton radial family reaches its BPS instanton endpoint. After I impose the Hamiltonian constraint, gauge quotient, charge-sector boundary condition, and collective zero-mode quotient, the physical quadratic fluctuation operator at that endpoint becomes a positive adjoint square. Its non-zero spectrum is therefore a squared singular-value spectrum, and its microscopic endpoint is a Laguerre/chiral hard edge. The D(-1)/D3 super-ADHM collective-coordinate integral supplies the Type-IIB microscopic representative of this same coefficient. In the large$N$ result of Dorey et al., this super-ADHM measure becomes the $k$-D-instanton measure on $AdS_5\\times S^5$, multiplied by a centered zero-dimensional supersymmetric matrix-model factor. The chiral/Wishart ensemble forms the hard-edge limit of the rectangular block inside this super-ADHM integral. Fermionic ADHM variables and supergravity fermions remain part of the coefficient: in protected sectors they cancel paired non-zero modes, impose zero-mode saturation, and determine which reduction data \\(b\\) give a non-vanishing $W_\\nu[b]$.", "url": "https://arxiv.org/abs/2607.06566", "type": "理论", "summary": "1. 该工作为IIB型轴子-膨胀子虫洞配分函数中约化电荷扇区系数构建了微观ADHM/手征Wishart系综表示。\n2. 其卖点在于：在BPS瞬子端点处，经约束与商化后的二次涨落算子成为正伴随平方，非零谱化为平方奇异值谱并对应手征硬边极限，该极限源于超ADHM积分在大型N下的零维超对称矩阵模型因子。\n3. 这揭示了虫洞瞬子求和与随机矩阵理论的深层关联，为弦理论中非微扰结构与QCD固定拓扑扇区的类比提供了新框架。", "summary_source": "deepseek", "authors": [{"name": "Soo-Jong Rey"}], "featured_authors": [{"name": "Soo-Jong Rey"}], "author_count": 1}, {"id": "2607.05433", "category": "math-ph", "title": "Attractor Flow Versus Hesse Flow in Wall-Crossing Structures", "abstract": "We recast the physics discussions in the paper of Dieter Van den Bleeken \\cite{svan2012bps} within the context of wall-crossing structure à la Kontsevich and Soibelman \\cite{kontsevich2014wall}. In particular, we compare the Hesse flow given in \\cite{svan2012bps} and the attractor flow on the base of the complex integrable system, and show that both can be used in the formalism of wall-crossing structure. We also propose the notions of dual Hesse flow and dual attractor flow, and show that under the rotation of the $\\mathbb{Z}$-affine structure, the Hesse flow can be transformed into the dual attractor flow, while the attractor flow into the dual Hesse flow. This suggests its possible use in Mirror Symmetry.", "url": "https://arxiv.org/abs/2607.05433", "type": "理论", "summary": "1. 该工作将Van den Bleeken论文中的物理讨论重新表述于Kontsevich与Soibelman的墙穿越结构框架下。\n2. 其技术核心在于比较Hesse流与吸引子流，并引入对偶Hesse流与对偶吸引子流，证明在$\\mathbb{Z}$-仿射结构旋转下两者可相互转化。\n3. 这为墙穿越结构与镜像对称之间的深层联系提供了新洞见，可能启发弦理论与超对称规范理论的后续研究。", "summary_source": "deepseek", "authors": [{"name": "Qiang Wang"}], "featured_authors": [{"name": "Qiang Wang"}], "author_count": 1}, {"id": "2607.05696", "category": "math-ph", "title": "Measurement-Access Risk Frontiers for Autonomous Scientific Control", "abstract": "Rapidly scaling autonomous science is limited not only by algorithms, compute or data volume, but by which physical records a platform exposes before action. We formulate physically accessible decision-making (PADM) and a measurement-access risk frontier: the Bayes-optimal target risk minimized over records realizable under cost, bandwidth, latency, disturbance, memory and actuation constraints. The frontier gives a no-free-autonomy limit: automation cannot collapse decision uncertainty by computation alone; an optimal controller cannot remove target components absent from its record, and closing that gap requires expanded access, auditing, tolerated disturbance, slower operation or restricted deployment. In monitored feedback, displacement-only control remains exposed to a hidden switching force, whereas a finite-bandwidth cue recovers part of the missing projection before action. A chemistry-aware candidate-ranking audit with a 1000-target stress panel, Gaussian sensing, hidden-regime decisions and cost-aware/thermodynamic channel selection provide reproducible checks. PADM identifies target-specific audit value and residual oracle gaps before deployment.", "url": "https://arxiv.org/abs/2607.05696", "type": "理论", "summary": "1. 该工作提出物理可及决策框架与测量访问风险前沿，量化自主科学控制中记录与行动间的基本权衡。\n2. 其核心在于揭示无免费自主性极限：最优控制器无法通过计算消除记录中缺失的目标成分，弥补需扩展访问或容忍干扰。\n3. 这为预部署审计提供了目标特异性价值评估与残余差距识别，指导自主系统在有限测量下的优化设计。", "summary_source": "deepseek", "authors": [{"name": "Bo Peng"}], "featured_authors": [{"name": "Bo Peng"}], "author_count": 1}, {"id": "2607.06361", "category": "math-ph", "title": "Complete hierarchical structure of the spectral bands in the Kohmoto model", "abstract": "We study the Kohmoto model, a family of discrete Schrödinger operators with Sturmian potentials depending on a frequency and a coupling constant. We prove that, for all non-vanishing coupling constants, all spectral bands admit a hierarchical structure. This structure offers a variety of applications, including a detailed description of the Kohmoto butterfly and a central step towards the resolution of the dry ten Martini problem for Sturmian Hamiltonians, which we carry out in a subsequent work.", "url": "https://arxiv.org/abs/2607.06361", "type": "理论", "summary": "1. 该工作严格证明了Kohmoto模型中所有谱带在非零耦合常数下具有完整层次结构。\n2. 其核心在于精确刻画了Sturmian势作用下谱带的自相似层级，并直接为Kohmoto蝴蝶的细致描述奠定基础。\n3. 这为最终解决Sturmian哈密顿量的干十马提尼问题提供了关键步骤，并启发了对准周期系统谱结构的深入理解。", "summary_source": "deepseek", "authors": [{"name": "Ram Band"}, {"name": "Siegfried Beckus"}, {"name": "Raphael Loewy"}], "featured_authors": [{"name": "Ram Band"}, {"name": "Siegfried Beckus"}, {"name": "Raphael Loewy"}], "author_count": 3}, {"id": "2607.05447", "category": "quant-ph", "title": "The Hermitian inner product selects the time axis, the Born rule measures it", "abstract": "The correspondence between $2\\times 2$ Hermitian matrices and Minkowski $4$-vectors recovers Lorentzian symmetries from the internal degrees of freedom of a qubit, with no reference to an external spacetime. Recent work characterises the resulting Lorentz invariants and leaves the \\emph{mechanism} of emergence -- what singles out a time direction -- as an explicit open question. We give an elementary answer and, in doing so, correct a natural misattribution. The bare spin space $(\\mathbb{C}^2,\\varepsilon)$ is $SL(2,\\mathbb{C})$-symmetric and singles out no axis; so is the null cone it generates. What selects a future-timelike axis is the choice of a Hermitian inner product, equivalently a positive reference form $\\sigma^0$: this choice -- made in passing from a normed space to a Hilbert space, \\emph{before} any probability is assigned -- reduces $SL(2,\\mathbb{C})$ to its maximal compact $SU(2)$, the stabiliser of $\\sigma^0$. The Born rule enters one level later: $\\langle \\xi \\vert \\xi \\rangle = \\text{tr}(\\sigma^0 \\, \\xi\\xi^\\dagger)$ is the projection of the state's null vector onto $\\sigma^0$, i.e. its energy in that frame, and under a boost it rescales as a Doppler shift. Thus the Hilbert structure selects the axis; the Born rule is where that axis becomes a measurable energy and where the frame-dependence of $\\lvert\\psi\\rvert^2$ becomes empirical. The ingredients are classical; what we add is their identification as the mechanism the recent programme leaves open, with the symmetry-breaking step located precisely. This is a kinematic identification of that step, not a dynamical account of why a particular axis is selected. We close by handing back the many-qubit case, where the datum is a tuple of such choices.", "url": "https://arxiv.org/abs/2607.05447", "type": "理论", "summary": "1. 该论文通过分析自旋空间\\(\\mathbb{C}^2\\)的SL(2,C)对称性，指出选择类时时间轴的机制是厄米内积的引入，该选取将对称性约化为SU(2)并定义了希尔伯特结构。\n2. 其技术核心在于修正了自然误解，明确玻恩规则是态矢零矢量在正定参考型\\(\\sigma^0\\)上的能量投影（表现为多普勒频移），而非时间轴选择本身。\n3. 这一对对称性破缺步骤的运动学识别，为量子力学中参考系涌现的层次、时空几何的内禀起源以及多量子比特系统中多个时间轴选择的协调提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Sebastian Zając"}], "featured_authors": [{"name": "Sebastian Zając"}], "author_count": 1}, {"id": "2607.05459", "category": "quant-ph", "title": "Against Totalitarianism -- Introduction to Tractatus Quanticum", "abstract": "Tractatus Quanticum ( arXiv:2512.06034 [quant-ph]) is described by its authors as 'a re-editing, which takes quantum mechanics into account, of Wittgenstein's famous Tractatus.' The original Tractatus appeared with an introduction by Bertrand Russell. For Tractatus Quanticum, that role fell to us. This is the result.", "url": "https://arxiv.org/abs/2607.05459", "type": "理论", "summary": "1. 该论文为《量子论》一书撰写了引言，该书是对维特根斯坦《逻辑哲学论》的量子力学化重编。\n2. 其卖点在于将量子力学的概念与结构系统性地融入经典语言哲学框架，试图重新审视逻辑与实在的关系。\n3. 这为量子基础研究与语言哲学之间的交叉探索提供了非标准但具有思辨启发的文本范例。", "summary_source": "deepseek", "authors": [{"name": "Jenann Ismael"}, {"name": "Huw Price"}], "featured_authors": [{"name": "Jenann Ismael"}, {"name": "Huw Price"}], "author_count": 2}, {"id": "2607.05492", "category": "quant-ph", "title": "Lean-Quantum: Toward AI-Assisted Formalization of Quantum Information", "abstract": "Quantum information theory is built on entropic quantities; among them, the sandwiched Rényi relative entropy is a fundamental divergence with various applications, and its data processing inequality (DPI) under quantum channels is a cornerstone result. In this work, we present a Lean 4 library for quantum information, designed as a reusable formal infrastructure for theoretical analysis. As a central demonstration of the library, we formalize the DPI for the sandwiched Rényi relative entropy for positive semidefinite operators on finite-dimensional quantum systems. The library provides a basis-independent operator-theoretic framework for finite-dimensional quantum mechanics compatible with the standard mathematical library Mathlib, including reusable interfaces for finite-dimensional systems, states, channels, tensor products, partial traces, Choi operators, Kraus representations, and Stinespring representations. It also builds infrastructure for noncommutative trace inequalities, including operator monotonicity and convexity via the real continuous functional calculus, block-operator positivity, Hilbert-Schmidt operator spaces, Jensen's operator inequality, generalized perspectives, operator power means, and Lieb-Ando trace inequalities. On top of this framework, we formalize entropy-specific ingredients for the DPI: variational formulas for the sandwiched quasi-entropy via Young and reverse-Young inequalities, tensor-product compatibility of real powers, and Haar measures on unitary groups. Together, these components yield a Lean formalization of the DPI, give strong subadditivity as a corollary, and provide the last missing component needed to complete the Lean formalization of the generalized quantum Stein's lemma. More broadly, the development provides machine-checkable foundations for future formalized and AI-assisted research in quantum information theory.", "url": "https://arxiv.org/abs/2607.05492", "type": "理论+数值", "summary": "1. 该工作构建了Lean 4量子信息形式化库，核心贡献是完成了有限维系统上夹层Rényi相对熵数据处理不等式的机器可验证证明。\n2. 其技术优势在于提供了基无关的算子理论框架及非交换迹不等式基础设施，涵盖态、信道、张量积与各类算子表示。\n3. 这为量子信息理论中形式化与AI辅助研究提供了可重用模块，并补齐了广义量子Stein引理形式化的关键缺失环节。", "summary_source": "deepseek", "authors": [{"name": "Kazumi Kasaura"}, {"name": "Kei Tsukamoto"}, {"name": "Kento Mori"}, {"name": "Risa Mizuno"}, {"name": "Takahiro Namatame"}, {"name": "Yuta Oriike"}, {"name": "Masaya Taniguchi"}, {"name": "Sho Sonoda"}, {"name": "Hayata Yamasaki"}], "featured_authors": [{"name": "Kazumi Kasaura"}, {"name": "Kei Tsukamoto"}, {"name": "Kento Mori"}, {"name": "Masaya Taniguchi"}, {"name": "Sho Sonoda"}, {"name": "Hayata Yamasaki"}], "author_count": 9}, {"id": "2607.05501", "category": "quant-ph", "title": "Towards Lattice Surgery Compilation for the Color Code Using Pipe Diagrams", "abstract": "Pipe diagrams have emerged as a powerful framework for flexible lattice surgery compilation and spacetime optimization for the surface code. In contrast, analogous compilation techniques for color code architectures remain largely unexplored, despite the color code's favorable properties, including reduced qubit overhead and transversal single-qubit Clifford gates. In this work, we develop a pipe diagram representation for the triangular color code on the 6.6.6 lattice and establish its correspondence to ZX-diagrammatic descriptions of computation. We present distance-independent constructions of color code pipe diagrams together with explicit realizations of correlation surfaces, stabilizers, and syndrome extraction circuits. This framework enables both macroscopic optimization of logical computations in spacetime and microscopic compilation to executable syndrome extraction circuits. We demonstrate the potential for compact spacetime embeddings with the color code's geometry. These results provide a foundation for automated lattice surgery compilation and diagrammatic optimization in color code architectures.", "url": "https://arxiv.org/abs/2607.05501", "type": "理论+数值", "summary": "1. 该工作为6.6.6晶格上的三角颜色码建立了管道图表示，并揭示了其与ZX图计算描述的严格对应关系。\n2. 其技术核心在于提出了距离无关的管道图构造，实现了关联面、稳定子及症候提取电路的显式实现，从而同时支持时空层面的宏观逻辑运算优化与微观电路编译。\n3. 这为颜色码架构下自动化格子手术编译与图论优化奠定了基础，有望利用颜色码的几何特性实现更紧凑的量子计算时空嵌入。", "summary_source": "deepseek", "authors": [{"name": "Laura S. Herzog"}, {"name": "Gilad Kishony"}, {"name": "Robert Wille"}, {"name": "Austin Fowler"}], "featured_authors": [{"name": "Laura S. Herzog"}, {"name": "Gilad Kishony"}, {"name": "Robert Wille"}, {"name": "Austin Fowler"}], "author_count": 4}, {"id": "2607.05519", "category": "quant-ph", "title": "Low-depth simulation of non-Markovianity under quantum hardware noise", "abstract": "Simulating open quantum systems on digital quantum computers typically relies on the use of auxiliary qubits, resulting in overheads of noisy multi-qubit gates, that severely limit execution on near-term hardware. In this work, we explore the simulation of non-Markovian dynamics as well as memory channels leveraging the method of trajectory mixing, valid for mixed unitary channels. This allows to drastically reduce circuit depth, trading entangling gates for a statistical mixture of independent, pure state trajectories. Using a realistic noise model calibrated to modern quantum processors, we show the benefits of this approach, yielding higher state fidelity and better preservation of quantum correlations. This shows the possibility of simulating long-time non-Markovian evolutions with low noise and limited resources.", "url": "https://arxiv.org/abs/2607.05519", "type": "理论+数值", "summary": "1. 该工作采用轨迹混合方法在数字量子计算机上模拟混合酉通道下的非马尔可夫动力学与记忆信道，以单次量子比特门和经典统计混合替代多量子比特纠缠门，从而大幅降低电路深度。\n2. 其核心技术卖点在于将纠缠门开销转化为独立纯态轨迹的统计混合，并采用现代量子处理器校准噪声模型验证，证实该方法能实现更高态保真度和更优的量子关联保持。\n3. 这验证了在有限量子资源下以低噪声模拟长时间非马尔可夫演化的可能性，为近噪声硬件上开放系统量子仿真提供了实用化路径。", "summary_source": "deepseek", "authors": [{"name": "Diana A. Chisholm"}], "featured_authors": [{"name": "Diana A. Chisholm"}], "author_count": 1}, {"id": "2607.05578", "category": "quant-ph", "title": "Reduced Quantum-Reference-Frame Channels for Open Quantum Systems", "abstract": "When reference frames are treated quantum mechanically, the subsystem structure of quantum systems is no longer absolute, but depends on the choice of the quantum reference frame (QRF). This raises a basic question: which dynamical properties are preserved across QRFs, and which depend on the physical reference used to define the system? We study this question in the general setting of open quantum systems. At the operational level, after a QRF transformation, the old reference frame and environmental degrees of freedom may be inaccessible and must therefore be traced out. This motivates the definition of reduced quantum-reference-frame channels: maps that connect the joint description in one frame to the accessible subsystem in another. We characterize their symmetry-constrained structure and define a regime in which a reduced entropy-coherence conservation law holds. We also identify when the induced reduced action on the open system admits a classical interpretation as random frame misalignment, and when it instead reflects quantum reduced-frame effects. We then apply the framework to pure-dephasing dynamics and derive a necessary and sufficient compatibility condition for population preservation. When the frame symmetry commutes with the open system's free Hamiltonian, coherences acquire a multiplicative frame factor, so that locally inferred decoherence rates split into environmental and reference-induced contributions. Ramsey interferometry gives this split a direct operational meaning. Finally, a gravity-motivated dephasing model illustrates how degradation of a phase reference can mimic signatures usually attributed to intrinsic decoherence mechanisms.", "url": "https://arxiv.org/abs/2607.05578", "type": "理论", "summary": "1. 该工作定义约化量子参考系通道，研究开放量子系统在量子参考系变换下的动力学性质保持问题。\n2. 其卖点在于刻画通道的对称约束结构，揭示约化熵-相干性守恒律的条件，并导出退相速率分解为环境与参考诱导贡献。\n3. 这为区分参考系退化与内在退相机制提供了操作判据，并在引力退相模型中得到验证。", "summary_source": "deepseek", "authors": [{"name": "Paolo Luppi"}, {"name": "Viktoria Kabel"}, {"name": "Flaminia Giacomini"}, {"name": "Andrea Smirne"}], "featured_authors": [{"name": "Paolo Luppi"}, {"name": "Viktoria Kabel"}, {"name": "Flaminia Giacomini"}, {"name": "Andrea Smirne"}], "author_count": 4}, {"id": "2607.05591", "category": "quant-ph", "title": "Wilczek-Zee Realization of Uhlmann Parallel Transport", "abstract": "The Uhlmann phase extends geometric phases to mixed quantum states via a parallel-transport condition on purification amplitudes, yet its direct implementation under standard Hamiltonian dynamics is obstructed by the non-Hermitian nature of the purification. We establish that for any smooth one-dimensional closed loop of full-rank qubit density matrices, there exists a four-level Hermitian parent Hamiltonian whose doubly degenerate ground-state subspace carries a Wilczek--Zee connection exactly equal to the Uhlmann connection. Consequently, the Uhlmann holonomy is faithfully reproduced by adiabatic evolution in the enlarged system. We further prove that this auxiliary-field construction is obstructed in generic two-dimensional parameter spaces by a Frobenius integrability condition, which we derive explicitly. The one-dimensional Uhlmann phase is thus placed on the same footing as the non-Abelian Berry phase, offering a purely Hermitian, Hamiltonian-based route to simulating mixed-state geometric phases. Numerical integration of the adiabatic dynamics confirms the exact correspondence and validates the convergence to the Uhlmann holonomy in the large-gap limit.", "url": "https://arxiv.org/abs/2607.05591", "type": "理论+数值", "summary": "1. 该工作通过构造四能级厄米父哈密顿量，实现了全秩量子比特混态密度矩阵沿一维闭合回路的Uhlmann平行输运的Wilczek-Zee表示。\n2. 其核心在于利用简并基态子空间中的Wilczek-Zee联络精确再现Uhlmann联络，从而将混态几何相置于与纯态非阿贝尔Berry相相同的绝热演化框架内。\n3. 这一构造受Frobenius可积性条件约束于二维参数空间，但为一维混态几何相的模拟提供了直接的厄米哈密顿量路径，并确认了大能隙极限下绝热动力学对Uhlmann和乐的收敛性。", "summary_source": "deepseek", "authors": [{"name": "Yu-Huan Huang"}, {"name": "Xu-Yang Hou"}, {"name": "Jia-Chen Tang"}, {"name": "Hao Guo"}], "featured_authors": [{"name": "Yu-Huan Huang"}, {"name": "Xu-Yang Hou"}, {"name": "Jia-Chen Tang"}, {"name": "Hao Guo"}], "author_count": 4}, {"id": "2607.05611", "category": "quant-ph", "title": "Entanglement Entropy of Free Fermions on Random Fractal Lattices", "abstract": "Random fractal lattices provide a geometrically disordered setting in which quantum correlations can be shaped by noninteger dimensionality rather than onsite randomness. We investigate the entanglement properties of noninteracting fermions on random fractal lattices generated by a stochastic growth algorithm. By varying the growth parameter and adding missing links with probability $p$, we tune the Hausdorff and spectral dimensions while keeping the system free of onsite disorder. For ground states at different fillings, we compute the bipartite entanglement entropy of subregions defined by graph distance and analyze its scaling with subsystem size. Over a broad parameter range, we find robust power-law behavior governed primarily by the Hausdorff dimension, consistent with a generalized area law and without the logarithmic enhancement familiar from Euclidean free fermions. We also study entanglement growth following a global quench from an uncorrelated checkerboard state and uncover an asymptotic scaling collapse in which the subsystem-size dependence is governed by the Hausdorff dimension, while the temporal evolution is governed by the spectral dimension. The resulting dynamics are logarithmically slow over an extended intermediate-time window. These results show that geometric randomness alone can generate both nontrivial ground-state entanglement structure and slow quantum-information spreading in free-fermion systems.", "url": "https://arxiv.org/abs/2607.05611", "type": "理论+数值", "summary": "1. 该工作利用随机分形晶格中无在位无序的几何随机性，系统研究了自由费米子基态与全局淬火后纠缠熵随子系统尺寸与时间的标度行为。\n2. 其核心发现是基态纠缠熵严格遵从由Hausdorff维数主导的幂律面积律而无对数增强，且淬火纠缠增长在中间时间段由谱维数支配，呈现缓慢对数演化。\n3. 这表明纯几何维度效应即可在费米子系统中产生非平庸纠缠结构与慢速量子信息传播，为探索非整数维系统中的量子关联动力学提供了可控理论框架。", "summary_source": "deepseek", "authors": [{"name": "Arkadiusz Kosior"}, {"name": "Jia Wang"}], "featured_authors": [{"name": "Arkadiusz Kosior"}, {"name": "Jia Wang"}], "author_count": 2}, {"id": "2607.05619", "category": "quant-ph", "title": "Contractivity of the Hilbert--Schmidt Speed in Unital Quantum Channels: Foundation for Witnessing Non-Markovianity and Discriminating Unital from Non-Unital Markovian Dynamics", "abstract": "We investigate the Hilbert--Schmidt speed (HSS), a geometric indicator defined through the Hilbert--Schmidt norm of the tangent vector to a parametrized family of quantum states, under general open-system dynamics. Working in the framework of finite-dimensional, parameter-independent completely positive trace-preserving (CPTP) evolution where the parameter is encoded solely in the initial state, we prove that the HSS is contractive under every unital CPTP map. Consequently, for any CP-divisible evolution whose intermediate propagators are unital, the HSS is monotonically non-increasing in time. We then establish the generator-level counterpart for Markovian dynamics governed by a Gorini--Kossakowski--Sudarshan--Lindblad (GKSL) master equation with Hermitian Lindblad operators, deriving an explicit non-positive expression for the time derivative of the squared HSS. These results provide a rigorous foundation for using HSS backflow as a sufficient witness of non-Markovianity in physical settings where the relevant CP-divisible Markovian dynamics is known \\emph{a priori} to be unital. Conversely, we show by an explicit qutrit counterexample that HSS can increase even in perfectly Markovian but non-unital dynamics, demonstrating that HSS non-monotonicity is not, in general, a faithful indicator of memory effects unless unitality is guaranteed. Our findings clarify the exact scope of HSS-based diagnostics and identify unitality as the crucial structural ingredient underlying their validity.", "url": "https://arxiv.org/abs/2607.05619", "type": "理论", "summary": "1. 该工作证明了Hilbert–Schmidt速度在任意单数完全正保迹映射下具有收缩性，进而建立了其在CP可分解演化下的单调递减性质。\n2. 通过导出GKSL主方程中平方HSS时间导数的显式非正表达式，严格奠定了利用HSS回流作为非马尔可夫性充分判据的基础，并指出该判据仅在单数动力学下有效。\n3. 研究通过非常数马尔可夫动力学的反例澄清了HSS诊断的适用范围，强调单数性是保障其有效性的核心结构要素，为区分有记忆与无记忆量子过程提供了明确准则。", "summary_source": "deepseek", "authors": [{"name": "Hossein Rangani Jahromi"}], "featured_authors": [{"name": "Hossein Rangani Jahromi"}], "author_count": 1}, {"id": "2607.05643", "category": "quant-ph", "title": "Coherent Control of Channel Dilations Activate Temporal Bell Nonclassicality", "abstract": "The temporal Clauser-Horne-Shimony-Holt (CHSH) inequality witnesses the nonclassicality of temporal correlations, but its violation is generally degraded by environmental noise. Here, we show that violation of the temporal CHSH inequality can be revived through coherent control of noisy quantum evolutions. We compare two physically distinct implementations: coherent control of noisy evolutions induced by interaction of the system with independent environments, and coherent control of two physically distinct, unitarily equivalent Stinespring dilations of the same noisy channel. Although these constructions generate identical deterministic system dynamics, they induce distinctly different post-selected evolutions. With a focus on the amplitude damping channel (ADC), we show that coherent control of equivalent dilations extend the range of temporal CHSH inequality violation well beyond both the incoherently controlled, or deterministic, scenario and what is achievable with independent environments. Under setting-independent post-selection of the coherent control implementation, the resulting violation further certifies that the channel is not strongly CHSH nonlocality-breaking. Our results identify the choice of Stinespring dilation as an operationally relevant resource in coherently controlled tests of temporal quantum correlations.", "url": "https://arxiv.org/abs/2607.05643", "type": "理论", "summary": "1. 该工作通过相干控制噪声量子演化中的信道膨胀，恢复了时间CHSH不等式的违反并扩展其适用范围。\n2. 核心在于比较了独立环境与同一噪声信道不同Stinespring膨胀的相干控制，发现后者在振幅阻尼信道下后选择演化不同，将违反范围拓展至超越非相干控制情形。\n3. 这揭示了Stinespring膨胀的选择作为操作资源在时间量子关联测试中的关键作用，并通过后选择认证信道非强CHSH非局域性破坏。", "summary_source": "deepseek", "authors": [{"name": "H S Karthik"}, {"name": "Akshata Shenoy H"}, {"name": "A R Usha Devi"}, {"name": "Marcin Pawłowski"}], "featured_authors": [{"name": "H S Karthik"}, {"name": "Akshata Shenoy H"}, {"name": "A R Usha Devi"}, {"name": "Marcin Pawłowski"}], "author_count": 4}, {"id": "2607.05661", "category": "quant-ph", "title": "Interplay Between Quantum Coherence and Multiparameter Quantum Estimation in Graphene", "abstract": "In this work, we investigate the relationship between quantum coherence and multiparameter quantum estimation in a graphene-based system. We focus on the estimation of two relevant physical parameters, namely the temperature $T$ and the wave vector $k_x$, and analyze how their variations affect both quantum coherence and the achievable metrological precision. The minimum variances associated with the estimation process are evaluated through the quantum Cramér--Rao bound within both simultaneous and independent estimation schemes. Our results show that quantum coherence is enhanced in the low-temperature regime and around $k_x=0$, while it decreases progressively as either the temperature or the wave vector increases. However, the regions where coherence is maximal do not necessarily coincide with those of optimal estimation precision. In particular, the variance associated with temperature estimation exhibits a divergent behavior near $T=0$, indicating that the system becomes weakly sensitive to small temperature variations in this regime. By contrast, the estimation of the wave vector $k_x$ is more directly related to the coherence properties of the system, with improved precision obtained near $k_x=0$. Furthermore, we introduce the ratio $\\Gamma$ to compare the total variances obtained from the independent and simultaneous estimation schemes. This quantity provides a useful measure of the relative difference between the two strategies when the parameters are estimated separately or jointly.", "url": "https://arxiv.org/abs/2607.05661", "type": "理论+数值", "summary": "1. 该工作探究了石墨烯系统中量子相干性与多参数量子估计之间的关联，聚焦于温度与波矢两参数的估计精度分析。\n2. 通过计算量子Cramér–Rao界并引入独立与同时估计方案的方差比Γ，揭示了相干性增强区域与最优估计精度区域的不一致性。\n3. 这为在低维量子材料中利用相干性调控多参数计量策略提供了定量判据，并为区分参数联合与分离估计的效能差异指明方向。", "summary_source": "deepseek", "authors": [{"name": "Younes Moqine"}, {"name": "Brahim Adnane"}, {"name": "Abdelilah El Rhazali"}, {"name": "and Rachid Houça"}], "featured_authors": [{"name": "Younes Moqine"}, {"name": "Brahim Adnane"}, {"name": "Abdelilah El Rhazali"}, {"name": "and Rachid Houça"}], "author_count": 4}, {"id": "2607.05779", "category": "quant-ph", "title": "Separating transient leakage exposure from endpoint cancellation in fast transmon single-qubit gates", "abstract": "Fast single-qubit gates on weakly anharmonic transmons are limited by leakage to noncomputational states, and standard mitigations such as DRAG (derivative removal by adiabatic gate) act on the leakage amplitude at the end of the gate. We show that this endpoint amplitude and the transient leakage exposure accumulated during the gate are two distinct control objectives that can be assigned to separate modules. The endpoint is a single sample of the drive spectrum, $|\\tilde\\Lambda(\\eta)|^2$; the exposure is a band integral about $\\eta$ and governs leakage under dephasing, and the spectral-null condition $\\tilde\\Lambda(\\eta)=0$ constrains only the former. We realize this split in a path--endpoint separation pulse (PESP): a path-shaping pulse suppresses the exposure, and a two-tone endpoint-cancellation pulse cancels the residual amplitude. For a $10$ ns $R_{X}(\\pi/2)$ gate at $\\eta/2\\pi=0.2$ GHz, in numerical simulations the path-shaping pulse reduces the dephasing exposure by ${\\sim}21\\%$ relative to cosine DRAG and the independently simulated Lindblad excess leakage by ${\\sim}20\\%$, consistent with $P_{\\mathrm{excess}}^{\\phi}\\simeq\\gamma_\\phi T\\bar{P}_{A}^{\\mathrm{deph}}$, whereas matched-budget endpoint-only and spectral-null controls leave it essentially unchanged. The residual endpoint floor splits exactly into a $|2\\rangle$ back-action and a $|3\\rangle$ cascade, which the two tones cancel one-to-one, driving the floor at the path-exposure knee from ${\\sim}7\\times10^{-7}$ to ${\\sim}3\\times10^{-8}$ without perturbing the path. By separating transient exposure from endpoint leakage, PESP turns leakage suppression in fast weakly anharmonic gates into a modular, interpretable control problem: dephasing-induced leakage and the coherent residual error are reduced by separate, individually verifiable modules.", "url": "https://arxiv.org/abs/2607.05779", "type": "理论+数值", "summary": "1. 该工作通过路径-端点分离脉冲（PESP）将超导transmon快速单量子比特门中的瞬态泄漏暴露与端点残余振幅分离为独立控制目标。\n2. 其核心在于揭示端点振幅仅受驱动谱单个采样点约束，而退相泄漏由频带积分决定，并通过路径整形抑制暴露、双音抵消端点底板，实现模块化解耦。\n3. 这为弱非谐振量子门中的泄漏抑制提供了可分别验证的模块化框架，使退相与相干残余误差可独立优化，启发更高速、高保真度门操控策略。", "summary_source": "deepseek", "authors": [{"name": "Haoran Yang"}, {"name": "Fudong Liu"}, {"name": "Weilong Wang"}, {"name": "Yangyang Fei"}, {"name": "Zheng Shan"}], "featured_authors": [{"name": "Haoran Yang"}, {"name": "Fudong Liu"}, {"name": "Weilong Wang"}, {"name": "Yangyang Fei"}, {"name": "Zheng Shan"}], "author_count": 5}, {"id": "2607.05786", "category": "quant-ph", "title": "A Quantum-HPC Hybrid Workflow for Reaction-Center Electronic Dynamics: Application to a Cytochrome P450-Inspired Iron-Complex Model", "abstract": "We introduce population-transfer dynamics as a practical validation observable for active-space-derived reduced Hamiltonians in multistate reaction-center chemistry. Using a cytochrome P450-inspired Fe-complex model, we construct a reaction-coordinate-dependent effective Hamiltonian from state-averaged complete active-space self-consistent field (SA-CASSCF) calculations, map it to a quantum-circuit representation suitable for current hardware, and propagate dynamics from the reactant-side ground state. The reduced Hamiltonian reproduces the SA-CASSCF reference with an RMS deviation of 0.030 eV and a maximum absolute deviation of 0.143 eV. As a dynamics-based diagnostic, the product-manifold population p_P(t) identifies a pronounced near-degeneracy region around x = 0.3, where state mixing is strongest. Classical exact time evolution yields a product population of 0.488 at x = 0.3 after 10 fs, compared with 7.26 x 10^-2 at x = 0.2 and 5.90 x 10^-3 at x = 0.0. To enable execution on current trapped-ion hardware, we examine the trade-off between dynamical fidelity and circuit resources through coupling pruning and first-order Trotterization. A coupling cutoff of 0.02 eV reduces the non-zero coupling set from 32 to 7 while preserving the dominant transfer pathways, and M = 30 provides the best practical operating point. Finally, we demonstrate the workflow on Quantinuum's trapped-ion quantum computer Reimei. The hardware reproduces the key reaction-coordinate trend identified by the classical model, including the maximum at x = 0.3, where the measured product population is 0.42 on hardware and 0.43 on the matched emulator. This work establishes a dynamics-based framework for assessing active-space-derived reduced Hamiltonians and demonstrates chemically interpretable multistate electronic dynamics on current trapped-ion hardware.", "url": "https://arxiv.org/abs/2607.05786", "type": "理论+数值", "summary": "1. 该工作提出了一种量子-高性能计算混合工作流，用于反应中心电子动力学，并以细胞色素P450启发的铁络合物模型演示了该流程。\n2. 其技术亮点在于将产物布居数动力学作为活性空间导出哈密顿量的验证可观测量，通过耦合剪裁与一阶Trotter化在离子阱量子硬件上重现了x=0.3处的最强态混合区域。\n3. 这为化学反应中多态电子动力学的量子模拟提供了可操作的诊断框架，并展示了当前量子硬件对化学可解释趋势的复现能力。", "summary_source": "deepseek", "authors": [{"name": "Shintaro Maekawa"}, {"name": "Takao Otsuka"}, {"name": "Riku Masui"}, {"name": "Juan W. Pedersen"}, {"name": "David Muñoz Ramo"}, {"name": "Yasushi Okuno"}, {"name": "Kentaro Yamamoto"}], "feature
