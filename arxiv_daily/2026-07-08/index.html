<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-07-08 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

      <h1>Daily ArXiv Selection</h1>

        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。

  <script>
    const papers = [{"id": "2607.05470", "category": "cond-mat", "title": "Non Hermitian Tight Binding Bands in Graphene from Tan Bo Model: Strain Effects and Bernal Bilayer Extensions", "abstract": "Within the tight binding framework of graphenes {\\pi} electron nearest neighbors, the Tan Bo model parametrizes transition energies t(dr) based on bond lengths and angles via the Mobius transformation combined with exponential decay. Comparisons between isotropic , geometrically anisotropic , and Slater Koster scales reveal that B = 0 is equivalent to the SK scheme, with L(B) reaching its optimum at Bopt = 0. The Hermitian assembly maintains the Dirac cone at the K this http URL Tan Bo geometry dependent transition model and non Hermitian TB assembly scheme developed in this study provide a reproducible single particle benchmark and parameterization reference for future non Hermitian chemical calculations incorporating electron correlation effects in graphene systems.", "url": "https://arxiv.org/abs/2607.05470", "type": "理论+数值", "summary": "1. 该工作基于Tan Bo模型，通过莫比乌斯变换与指数衰减参数化键长与键角依赖的跃迁能，构建了石墨烯的非厄米紧束缚能带，并扩展至应变效应与Bernal双层结构。\n2. 其技术核心在于引入几何依赖的跃迁参数化方案，并验证了厄米组装在Bopt=0时等价于Slater-Koster方案且保持狄拉克锥，同时建立了非厄米紧束缚组装框架。\n3. 这为未来考虑电子关联效应的石墨烯系统非厄米化学计算提供了可重复的单粒子基准与参数化参考，并支持应变调控下的能带工程。", "summary_source": "deepseek", "authors": [{"name": "Maolin Bo"}, {"name": "Yaorui Tan"}, {"name": "Sunxin Fan"}, {"name": "Xiang Chen"}, {"name": "Yunhu Zhu"}, {"name": "Zhongkai Huang"}, {"name": "Chuang Yao"}], "featured_authors": [{"name": "Maolin Bo"}, {"name": "Yaorui Tan"}, {"name": "Sunxin Fan"}, {"name": "Yunhu Zhu"}, {"name": "Zhongkai Huang"}, {"name": "Chuang Yao"}], "author_count": 7}, {"id": "2607.05506", "category": "cond-mat", "title": "Anomalous suppression of quantum chaos between two integrable limits", "abstract": "Level statistics in non-integrable quantum many-body systems with time reversal symmetry are expected to follow the Gaussian Orthogonal Ensemble (GOE), a hallmark of quantum chaos. However, we show that the interacting Su-Schrieffer-Heeger model exhibits a clear suppression of the mean level-spacing ratio $\\langle r\\rangle$ from the GOE value $\\approx 0.535$, persisting deep in the nonintegrable regime. This challenges the conventional association between non-integrability and fully chaotic spectral statistics. Using exact diagonalization supported by semi-analytical arguments, we trace this anomaly to incomplete hybridization of many-body band states inherited from the noninteracting band structure. The resulting restructuring of the spectrum weakens level repulsion without restoring integrability. We show the robustness of this mechanism in extensions of the model which break chiral and inversion symmetry.", "url": "https://arxiv.org/abs/2607.05506", "type": "理论+数值", "summary": "1. 该工作通过精确对角化与半解析分析，报道了相互作用SSH模型中平均能级间距比⟨r⟩相对于GOE值的异常压制现象。\n2. 其核心发现是识别出非相互作用带结构导致的多体带态不完全杂化机制，该机制削弱能级排斥而不恢复可积性。\n3. 此发现挑战了非可积性必然导致完全混沌谱的传统认知，并为理解中间态量子多体混沌的起源与鲁棒性提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Roopayan Ghosh"}, {"name": "Henry Davenport"}, {"name": "Frank Schindler"}], "featured_authors": [{"name": "Roopayan Ghosh"}, {"name": "Henry Davenport"}, {"name": "Frank Schindler"}], "author_count": 3}, {"id": "2607.05634", "category": "cond-mat", "title": "Complete local expansion of the availability function in random sequential adsorption of aligned squares at low density: Termination at fourth order", "abstract": "We consider random sequential adsorption (RSA) of aligned squares and derive the low-coverage expansion of the availability function alpha(q), the fraction of positions accessible to an additional square, up to fourth order in the coverage q. At low coverage, the reduction of available space can be understood in terms of geometric overlap between exclusion regions created by previously deposited squares. A single square blocks a finite area; pairs of squares may have overlapping exclusion zones, reducing the total blocked area; similarly, three and four squares can share a common overlap region, leading to higher-order corrections. These contributions can be systematically accounted for through an inclusion-exclusion expansion based on the geometry of overlapping exclusion regions, with alternating signs dictated by inclusion-exclusion. The expansion terminates exactly at fourth order, since no more than four deposited squares can simultaneously overlap the exclusion region of a trial insertion. The coefficients are obtained by explicit enumeration of all such geometrically admissible configurations and are further confirmed by numerical simulations on a discrete lattice, showing agreement within statistical uncertainty.", "url": "https://arxiv.org/abs/2607.05634", "type": "理论+数值", "summary": "1. 该工作推导了对齐方形随机顺序吸附中可用性函数在低覆盖率下至第四阶的精确展开，利用包含-排除原理系统计入排除区域重叠的几何修正。\n2. 其核心在于发现最多四个沉积正方形的排除区域可同时重叠，导致展开准确终止于第四阶，系数由所有几何允许构型的枚举给出。\n3. 此严格局域展开方法为硬核颗粒吸附模型中高阶截断的普适性提供基准，并可推广至其他具有有限重叠几何的随机吸附过程。", "summary_source": "deepseek", "authors": [{"name": "F. Tolea"}, {"name": "M. Tolea"}], "featured_authors": [{"name": "F. Tolea"}, {"name": "M. Tolea"}], "author_count": 2}, {"id": "2607.05672", "category": "cond-mat", "title": "Modern view of activated rate processes: unidirectional fluxes at equilibrium, correlation functions, and splitting probabilities", "abstract": "More than 80 years ago Kramers published a paper calculating how fast a Brownian particle escapes from a potential well over an activation barrier. Since then Kramers' model has been widely adopted by nuclear physics, biophysics and chemical physics communities as a description of activated barrier crossing. From a chemical kinetics perspective, Kramers' theory provides a mapping from continuous dynamics to discrete-state chemical kinetics. Motivated by recent developments, this Perspective provides a rigorous way of performing such a mapping, explaining why and how Kramers' theory works from several points of view. Specifically, we consider transitions of a Brownian particle between two potential wells corresponding to the ``reactant'' and the ``product'' of a chemical reaction. A central unifying idea is to divide the equilibrium ensemble of possible states of the system into two sub-ensembles corresponding to the reactant and product states and then to consider fluxes between these sub-ensembles. Importantly, naive separation based on the location measured relative to the barrier top does not result in a mapping that is physically tenable, and instead the past of the trajectory should be considered. Thus constructed reactant and product ensembles provide an internally consistent description of the problem when also viewed from two different perspectives: one based on the definition of the rate as a conditional transition probability per unit time and the other based on the relaxation modes of the time-evolution operator governing the dynamics.", "url": "https://arxiv.org/abs/2607.05672", "type": "理论", "summary": "1. 本文提供了一个将布朗粒子在势阱间连续动力学严格映射为离散态化学动力学的理论视角，解释了Kramers活化速率理论成立的多种原因。\n2. 核心卖点在于揭示：基于穿越轨迹历史而非势垒顶部位置来划分平衡系综中的反应物与产物子系综，才能得到物理上自洽的单向通量、相关函数与分裂概率定义。\n3. 该工作统一了速率作为条件跃迁概率与时间演化算子弛豫模式两种观点，为理解活化过程的统计物理基础及改进速率理论提供了清晰启示。", "summary_source": "deepseek", "authors": [{"name": "Alexander M. Berezhkovskii"}, {"name": "Kevin Song"}, {"name": "Dmitrii E. Makarov"}], "featured_authors": [{"name": "Alexander M. Berezhkovskii"}, {"name": "Kevin Song"}, {"name": "Dmitrii E. Makarov"}], "author_count": 3}, {"id": "2607.05675", "category": "cond-mat", "title": "Ultrahigh-Entropy Compositionally Complex Ceramics: Fluorite-Pyrochlore Phase Stability and Order-Disorder Transitions", "abstract": "Three groups of 32 ultrahigh-entropy compositionally complex ceramics (CCCs) containing 16-19 components were synthesized and characterized. The first group of 15 CCCs forms single ultrahigh-entropy fluorite or pyrochlore phases in 12 compositions, while two compositions exhibit fluorite-fluorite dual phases, observed for the first time. Compared with ternary A2B2O7 pyrochlore, these ultrahigh-entropy CCCs are more prone to ordering (pyrochlore formation), surprisingly even more at higher size disorder (more lattice distortion), with suppressed dual-phase formation relative to five-component high-entropy ceramics. Two new 19-component series, denoted as \"19CCC-P|Fy\" and \"19CCC-P|Fz\", form single ultrahigh-entropy fluorite or pyrochlore phases. The 19CCC-P|Fy series, maintaining a 2:2 ratio of 3+ and 4+ cations, exhibits a pyrochlore-to-fluorite order-disorder transition (ODT) at y ~ 0.84, consistent with the linear projection of the pyrochlore superstructure peak intensity as an order parameter. In contrast, the 19CCC-P|Fz series with non-2:2 ratios of 3+ and 4+ cations show an abrupt ODT at z ~ 0.41-0.44, despite a projected transition at z ~ 0.64 from the order parameter.", "url": "https://arxiv.org/abs/2607.05675", "type": "理论", "summary": "1. 该工作合成了三组共32种16-19组分的超高熵成分复杂陶瓷，系统表征其萤石-烧绿石相稳定性与有序-无序转变。\n2. 主要技术发现是超高熵陶瓷比三元体系更易形成有序烧绿石相，且有序倾向随尺寸无序增大而增强，同时双相区被显著抑制。\n3. 这揭示了成分复杂性可非直观地促进有序化，为通过调控阳离子配比设计极端无序体系中的相行为提供了新的控制维度。", "summary_source": "deepseek", "authors": [{"name": "Keqi Song"}, {"name": "Jian Luo"}], "featured_authors": [{"name": "Keqi Song"}, {"name": "Jian Luo"}], "author_count": 2}, {"id": "2607.05719", "category": "cond-mat", "title": "Equivalence between the Axion Invariant and the $S_4$ Symmetry Indicator", "abstract": "The equivalence between the axion invariant and the $S_4$ symmetry indicator is established for three-dimensional $S_4$-symmetric axion insulators with vanishing three-dimensional Chern numbers. Starting from the Chern-Simons expression for the magnetoelectric polarizability, $2P_3=\\theta/\\pi$ is rewritten in terms of the $S_4$ sewing matrix. After stable reduction to determinant-one two-band blocks, the invariant is expressed as the degree of a map from the Brillouin zone to $SU(2)$. The degree modulo two is then evaluated from the $S_4$ eigenvalues at the four $S_4$-invariant momenta and is shown to coincide with the symmetry indicator $z_2$. A minimal tight-binding model verifies the correspondence between $2P_3$ and $z_2$. The result closes a gap between the topological-field-theory description of the axion response and the topological-band-theory classification by symmetry indicators. It also extends the known response-indicator equivalence from antiunitary settings such as $C_nT$ symmetry to the unitary, orientation-reversing rotoinversion symmetry $S_4$.", "url": "https://arxiv.org/abs/2607.05719", "type": "理论+数值", "summary": "1. 建立了三维S₄对称轴子绝缘体中轴子不变量与S₄对称性指标z₂的等价性。\n2. 从Chern-Simons表达式出发，通过S₄缝纫矩阵将磁电极化率化为从布里渊区到SU(2)的映射度模二，并由S₄不变量动量点的本征值直接计算。\n3. 该等价性弥合了轴子响应的拓扑场论描述与对称性指标能带分类之间的鸿沟，并将响应-指标对应从反幺正对称推广至幺正定向反转的S₄对称性。", "summary_source": "deepseek", "authors": [{"name": "Mengyao Zhang"}], "featured_authors": [{"name": "Mengyao Zhang"}], "author_count": 1}, {"id": "2607.05754", "category": "cond-mat", "title": "Magnon-Mediated Superconductivity in a 2D Itinerant Ferromagnet with Weak Easy-plane Magnetic Anisotropy", "abstract": "Motivated by recent observations of superconductivity in a quarter-metal state of spin- and valley- polarized graphene multilayers, we investigate pairing within a ferromagnetic phase of a single-valley model of itinerant two-dimensional (2D) electrons with Hubbard-type interaction and no artificial high-energy cutoff. In 2D, the Stoner transition is first-order into a fully-polarized state wherein the only gapless collective excitations are transverse magnons. We find that in a spin-SU(2) symmetric model, this magnon-mediated pairing interaction between equal-spin fermions vanishes at $T=0$. We show that a small easy-plane magnetic anisotropy $\\Omega_0 \\ll E_F$, where $E_F$ is the Fermi energy, breaks the SU(2) symmetry and generates an attractive interaction for equal-spin $p-$wave pairing. We explicitly derive the corresponding coupling constant $\\lambda_p$ as the scaling function of both the relative strength of the easy-plane anisotropy, $\\Omega_0/E_F$, and the proximity to the ferromagnetic transition. While $\\lambda_p$ is parametrically small in $\\Omega_0/E_F$ deep inside the ferromagnetic phase, it becomes enhanced near the ferromagnetic transition, reaching order unity regardless of how small $\\Omega_0/E_F$ is. This mechanism yields a sizable $T_c$, peaked near the onset of ferromagnetism.", "url": "https://arxiv.org/abs/2607.05754", "type": "理论", "summary": "1. 该工作理论研究了二维巡游铁磁体中磁振子介导的超导配对，聚焦弱易平面磁各向异性在破坏自旋SU(2)对称性后诱导等自旋p波吸引相互作用。\n2. 其物理卖点在于导出耦合常数λ_p作为易平面各向异性相对强度Ω₀/E_F及近铁磁转变参量的标度函数，证明在铁磁转变附近λ_p可增强至量级一，不受Ω₀/E_F多小限制。\n3. 这为理解具有弱磁各向异性的二维铁磁体系中超导与铁磁序共存提供了机制框架，并指明近铁磁转变区域是探索非常规超导体的关键参数窗口。", "summary_source": "deepseek", "authors": [{"name": "Vladimir Calvera"}, {"name": "Heqiu Li"}, {"name": "Yijie Wang"}, {"name": "B. Andrei Bernevig"}, {"name": "Andrey V. Chubukov"}], "featured_authors": [{"name": "Vladimir Calvera"}, {"name": "Heqiu Li"}, {"name": "Yijie Wang"}, {"name": "B. Andrei Bernevig"}, {"name": "Andrey V. Chubukov"}], "author_count": 5}, {"id": "2607.05827", "category": "cond-mat", "title": "Dynamical crossover from motor-dominated to drag-dominated transport in a minimal active transport network", "abstract": "Motor-driven intracellular transport is often described in terms of motor activity, but macroscopic transport also depends on how effectively motor-generated force is converted into coherent motion. Motivated by cytoplasmic streaming, a minimal active transport network is examined in which motor-driven transport competes with an effective slip-related dissipative resistance. The model is not intended as a quantitative reconstruction of Nitella cytoplasmic streaming, but as a minimal system for isolating the relation between motor activity, resistance, and transport output. A controlled scan over $\\gamma_{\\mathrm{Slip}}$ and $\\alpha_m$, with three independent seeds per condition, shows that increasing $\\gamma_{\\mathrm{Slip}}$ strongly suppresses mean transport speed while leaving the motor-bound fraction nearly unchanged. The mean load and motor force remain finite in the high-$\\gamma_{\\mathrm{Slip}}$ regime, indicating that motors remain mechanically active even when transport is suppressed. The dependence of transport speed on $\\alpha_m$ progressively disappears with increasing $\\gamma_{\\mathrm{Slip}}$: the motor dominance ratio decreases from $R\\approx1.69$ to $R\\approx1.01$, and the corresponding velocity difference decreases from $\\sim1.9~\\mu\\mathrm{m/s}$ to $\\sim0.003~\\mu\\mathrm{m/s}$. These results indicate a dynamical crossover from motor-dominated to drag-dominated transport. The minimal model provides a compact physical scenario in which active force generation persists while its contribution to net transport is suppressed by increased effective dissipative resistance.", "url": "https://arxiv.org/abs/2607.05827", "type": "理论", "summary": "1. 该工作构建了一个最小活性输运网络模型，研究马达驱动与滑移相关耗散阻力竞争下的输运行为。\n2. 通过扫描滑移阻力系数和马达活性参数，揭示从马达主导到阻力主导的动力学交叉，并发现高阻力下马达仍保持机械活性。\n3. 该最小模型为理解活性力生成与净输运解耦的物理场景提供了启发，可推广至胞质环流等复杂活性流体系统。", "summary_source": "deepseek", "authors": [{"name": "Kazuhiko Mitsuhashi"}], "featured_authors": [{"name": "Kazuhiko Mitsuhashi"}], "author_count": 1}, {"id": "2607.05853", "category": "cond-mat", "title": "Efficient Bethe-Salpeter Equation Calculations Based on Numerical Atomic Orbitals and Norm-Conserving Pseudopotentials: Dual-${\\boldsymbol k}$-Mesh Strategy", "abstract": "We present an efficient implementation of the Bethe--Salpeter equation (BSE) based on numerical atomic orbitals (NAOs) and norm-conserving pseudopotentials within the ABACUS+LibRPA framework. By exploiting the localized resolution-of-identity (LRI) technique, the screened Coulomb interaction is cast into a real-space, unit-cell-indexed form $W_{\\mu\\nu}(\\boldsymbol R)$ that is inherently short-ranged and well localized. This spatial locality enables an efficient Fourier interpolation of the BSE kernel from the coarse $\\boldsymbol k$-mesh used in the preceding $GW$ calculation to an arbitrarily dense $\\boldsymbol k$-mesh on which the BSE Hamiltonian is assembled and diagonalized, thereby giving rise naturally to a dual-$\\boldsymbol k$-mesh workflow. Building on this scheme, we systematically examine the convergence of the absorption spectra with respect to the NAO basis set, the auxiliary basis set, and the $\\boldsymbol k$-point sampling. Benchmark calculations for both molecular and periodic systems collectively validate the accuracy of the present implementation and establish the dual-$\\boldsymbol k$-mesh strategy as a practical and reliable approach for $GW$+BSE calculations.", "url": "https://arxiv.org/abs/2607.05853", "type": "理论+数值", "summary": "1. 该工作基于数值原子轨道和模守恒赝势，在ABACUS+LibRPA框架中实现了高效的Bethe-Salpeter方程计算。\n2. 其技术核心在于利用局域化分辨率恒等技巧将屏蔽库仑相互作用化为实空间短程形式，从而通过傅里叶插值自然实现粗细双k网格的GW+BSE工作流。\n3. 这为系统研究分子和周期体系的光学吸收谱提供了实用可靠的计算方案，并明确了基组与k点取样的收敛行为。", "summary_source": "deepseek", "authors": [{"name": "Ziqing Guan"}, {"name": "Yu Cao"}, {"name": "Min-Ye Zhang"}, {"name": "Peize Lin"}, {"name": "Ruiyi Zhou"}, {"name": "Xinguo Ren"}], "featured_authors": [{"name": "Ziqing Guan"}, {"name": "Yu Cao"}, {"name": "Min-Ye Zhang"}, {"name": "Peize Lin"}, {"name": "Ruiyi Zhou"}, {"name": "Xinguo Ren"}], "author_count": 6}, {"id": "2607.05854", "category": "cond-mat", "title": "Anomalous Piezoelectricity from Polarization-Dependent Electrostriction in Wurtzites", "abstract": "The piezoelectric coefficient is a third-rank tensor connecting the strain or stress with the electric field or polarization, whereas the electrostriction coefficient is a fourth-rank tensor relating the strain to the square of electric polarization. The electrostriction tensor components in the current literature are often treated as constants independent of polarization, resulting in piezoelectric tensor components that are linearly proportional to polarization and the dielectric susceptibility tensor. Here, we study the electrostriction and piezoelectricity in strongly polar wurtzites, including AlN, Al$_{1-x}$Sc$_x$N, Al$_{1-x}$B$_x$N, GaN, and ZnO. We discover that electrostriction and the elastic modulus in wurtzites are both strongly polarization-dependent, and the piezoelectric coefficient is highly nonlinear with respect to polarization, including the anomalous possibility that decreasing polarization increases the electromechanical strain response. These unusual dependencies of electrostriction and piezoelectric effects on polarization arise from the evolution of a layered reference nonpolar structure toward a tetrahedrally coordinated wurtzite network structure as the polarization increases. The findings have important implications in understanding the thermodynamics of the general class of wurtzite ferroelectrics and in manipulating their piezoelectric and ferroelectric behaviors.", "url": "https://arxiv.org/abs/2607.05854", "type": "理论", "summary": "1. 该工作系统研究了AlN、ScAlN、GaN等强极性纤锌矿中的电致伸缩与压电行为，发现电致伸缩系数及弹性模量均依赖于极化，导致压电系数表现出高度非线性，包括极化减小反而增强机电应变的反常压电现象。\n2. 其核心物理机制在于极化增大使体系从层状非极性参考结构向四面体配位网络结构连续演变，改变了电致伸缩系数的极化依赖性，从而产生非线性和反常的压电响应。\n3. 这一发现为理解一般纤锌矿铁电体的热力学性质及调控其压电与铁电性能提供了关键的理论框架和实验启发。", "summary_source": "deepseek", "authors": [{"name": "Guo-Dong Zhao"}, {"name": "Aiden Ross"}, {"name": "Yueze Tan"}, {"name": "Yujie Zhu"}, {"name": "Jia-Mian Hu"}, {"name": "Long-Qing Chen"}], "featured_authors": [{"name": "Guo-Dong Zhao"}, {"name": "Aiden Ross"}, {"name": "Yueze Tan"}, {"name": "Yujie Zhu"}, {"name": "Jia-Mian Hu"}, {"name": "Long-Qing Chen"}], "author_count": 6}, {"id": "2607.05858", "category": "cond-mat", "title": "Local moment magnon spectrum in conduction electron tunnelling", "abstract": "The surface tunnelling spectrum of a dual system consisting of localised moments with antiferromagnetic order coupled to conduction electrons by on-site exchange interaction is investigated. In the static approximation of the local moment order it is known that magnetic band reconstruction leads to an anomalous tunnelling spectrum at the magnetic ordering vector of local moments although the latter cannot contribute directly. In this work we consider dynamic effects by including the scattering of conduction electrons from the local moment magnon excitations. They lead to self energies and renormalisation of conduction states which in turn appreciably modify the tunnelling spectrum beyond the influence of static order, interpreted as the appearance of magnon sidebands.", "url": "https://arxiv.org/abs/2607.05858", "type": "理论", "summary": "1. 该工作研究了反铁磁局域磁矩通过在位交换耦合与传导电子耦合体系中，局域磁矩自旋波激发对表面隧穿谱的动态修正。\n2. 其物理核心在于传导电子受磁子非弹性散射导致自能重整化，产生标志磁子激发的边带结构，超越了静态磁能带重构引起的异常隧穿特征。\n3. 这为实验上利用隧穿谱直接探测磁子-电子耦合能谱，以及深入理解强关联界面电子态提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Peter Thalmeier"}, {"name": "Alireza Akbari"}], "featured_authors": [{"name": "Peter Thalmeier"}, {"name": "Alireza Akbari"}], "author_count": 2}, {"id": "2607.05860", "category": "cond-mat", "title": "Autoencoder-Based Unsupervised Identification of Nonequilibrium Phases in Sheared Binary Colloids", "abstract": "Identifying nonequilibrium phases in particle systems remains a major challenge because they often exhibit complex and spatially heterogeneous structures without long-range order. Here, we develop an unsupervised machine-learning framework for classifying such nonequilibrium phases by integrating Fourier-based preprocessing, an autoencoder, and a Gaussian mixture model (GMM). Specifically, we transform global spatial configurations into Fourier space and use the amplitudes of Fourier coefficients as inputs to the autoencoder. This preprocessing suppresses spatial noise while preserving phase-specific structural features and physical interpretability. We demonstrate the effectiveness of this framework using a binary charged colloidal system under steady shear flow, where the competition between Coulomb interactions and shear gives rise to three nonequilibrium phases characterized by distinct local structures. The encoded latent space reveals well-separated clusters that are robustly identified by the GMM, enabling the construction of a nonequilibrium phase diagram based on cluster membership probabilities. The resulting phase boundaries are consistent with those independently obtained from radial distribution function analysis and unsupervised anomaly detection. These results demonstrate that autoencoder-based unsupervised learning provides an effective framework for identifying nonequilibrium phases in complex particle systems.", "url": "https://arxiv.org/abs/2607.05860", "type": "理论+数值", "summary": "1. 该工作针对稳态剪切流下二元胶体系统，提出集成傅里叶预处理、自编码器与高斯混合模型的无监督框架，识别由库仑与剪切竞争产生的三个非平衡相。\n2. 其核心在于傅里叶变换将空间构型转为幅度特征，抑制噪声同时保留相特异结构，使自编码器潜在空间形成可被高斯混合模型稳健分离的物理聚类。\n3. 该方法无需标注数据，基于聚类隶属度概率构建的相图与径向分布函数分析一致，为复杂粒子系统中隐藏非平衡相的无监督识别提供可推广方案。", "summary_source": "deepseek", "authors": [{"name": "Yoshitaka Miyahara"}, {"name": "Taiki Haga"}], "featured_authors": [{"name": "Yoshitaka Miyahara"}, {"name": "Taiki Haga"}], "author_count": 2}, {"id": "2607.05900", "category": "cond-mat", "title": "Machine learning prediction of the convergence criterion for a topological invariant of finite non-Hermitian chains", "abstract": "A topological invariant based on polar-decomposition of matrices correctly captures the topology of finite non-Hermitian chains exhibiting the non-Hermitian skin effect, provided that an appropriate crop-length parameter is chosen. This parameter, which sets the cutoff used in the calculation of the invariant, is usually chosen empirically and becomes especially important near topological phase transitions, where finite-size effects are strongest. Here we show that the required crop-length is controlled by physical decay (localization) lengths. For nearest-neighbor and pure longer-range hopping Hatano-Nelson-type chains, the crop-length is set mainly by a single localization length and is well approximated by a scalar multiple of that length. For more general longer-range hopping models, it is governed instead by a multichannel root structure of the characteristic polynomial. Random-forest regression captures finite-size and near-boundary corrections while preserving this decay-length interpretation. Trained on one set of Hamiltonians, the predictor accurately generalizes to unseen Hamiltonians and complex base energies, reproducing crop-lengths across full phase diagrams. We further show that the predictions learned from clean nearest-neighbor hopping chains remain stable under moderate hopping disorder. These results provide a practical and physically interpretable way to choose the crop-length, which in turn determines when the real-space invariant can reliably capture the topology of finite non-Hermitian chains.", "url": "https://arxiv.org/abs/2607.05900", "type": "理论+数值", "summary": "1. 该工作利用随机森林回归预测有限非厄米链拓扑不变量收敛所需的截断长度参数。\n2. 其卖点在于揭示截断长度由物理衰减长度控制，并在近邻和长程跳跃模型中保持该物理可解释性，准确泛化至未见过哈密顿量。\n3. 这为有限非厄米系统中拓扑相变的可靠判别提供了基于物理量而非经验的定量准则。", "summary_source": "deepseek", "authors": [{"name": "Raghav Chaturvedi"}, {"name": "Viktor Könye"}, {"name": "Ewelina M. Hankiewicz"}], "featured_authors": [{"name": "Raghav Chaturvedi"}, {"name": "Viktor Könye"}, {"name": "Ewelina M. Hankiewicz"}], "author_count": 3}, {"id": "2607.05948", "category": "cond-mat", "title": "Modelling the mean inner potential of alloyed and strained materials", "abstract": "In this publication, we study the influence of strain and alloying on the mean inner potential (MIP) using density functional theory (DFT) within an augmented plane waves plus local orbitals basis set. Two major effects have been identified allowing to model the influence of strain and alloying on the mean inner potential with a reasonable accuracy. First, alloying for constant volume results in a linear relationship between the MIP and the concentration. Second, the MIP scales with changes in volume as we already pointed out in an earlier publication (M. Schowalter, D. Lamoen, A. Rosenauer, P. Kruse, and D. Gerthsen, Appl. Phys. Lett. 85, 4938-4940 (2004)). Specifically, a linear relationship between MIP and concentration x was found for AlGaAs (nearly no change in lattice parameter), whereas InGaP and GeSi (volume changes with concentration x) exhibits a clear bowing. The bowing can be modeled by taking the rescaling of the MIP with the varying volume additionally into account. The rescaling could be also used to model the dependence of the MIP on strained binary cells and the density dependence of e.g. amorphous materials.", "url": "https://arxiv.org/abs/2607.05948", "type": "理论+数值", "summary": "1. 该工作基于密度泛函理论，系统建模了合金化与应变对材料平均内势的影响。\n2. 其卖点在于揭示恒容下平均内势与浓度线性相关，而体积变化导致弯曲可通过体积缩放精确建模。\n3. 这为描述应变二元胞及非晶材料密度依赖的平均内势提供了可靠推广模型。", "summary_source": "deepseek", "authors": [{"name": "Marco Schowalter"}, {"name": "Peer Kruse"}, {"name": "Andreas Rosenauer"}], "featured_authors": [{"name": "Marco Schowalter"}, {"name": "Peer Kruse"}, {"name": "Andreas Rosenauer"}], "author_count": 3}, {"id": "2607.05954", "category": "cond-mat", "title": "The Ramsey community number as a renormalization-group crossing", "abstract": "The Ramsey community number $r_k$ is the smallest size at which a network is better described by communities than by none, under a Bayesian detection rule. On the diamond hierarchical lattice we show that $r_k$ is an exact renormalization-group crossing: the block-model sufficient statistics obey a linear map with eigenvalues $\\{bs,b\\}$, the degree-corrected evidence density flows to $\\ln K$ at a community fixed point, and $r_k$ is the generation at which the running evidence clears the detection threshold. Degree correction advances detection by two generations. We derive $r_k(b,s;q)$ in closed form for the whole family. Finally, placing on the lattice the Reichardt--Bornholdt community Hamiltonian -- whose ground state is the partition itself -- we find an exact community-ordered phase: below the ferromagnetic critical temperature the two hubs lock into opposite communities for any resolution $\\gamma>0$, a staggered order that persists as $n\\to\\infty$. Allowing each nested sub-community its own label, the optimal partition is a hierarchy of $q_{\\rm opt}\\sim\\sqrt{n}$ communities, so the number of Potts states that best describes the network grows with the network. This hierarchy orders thermally level by level, through a cascade of first-order transitions whose temperatures fall as $1/\\ln q$, so every stable level persists as $n\\to\\infty$: the emergent partition is detectable, optimal, and thermodynamically ordered.", "url": "https://arxiv.org/abs/2607.05954", "type": "理论", "summary": "1. 该工作证明在钻石层次晶格上，Ramsey社区数 \\(r_k\\) 是精确的重整化群交叉，并给出闭式解 \\(r_k(b,s;q)\\)。\n2. 其核心发现是块模型充分统计量服从特征值 \\(\\{bs,b\\}\\) 的线性映射，证据密度流向社区不动点 \\(\\ln K\\)，而Reichardt-Bornholdt哈密顿量在晶格上展示精确社区有序相：两枢纽在任意分辨率下锁定相反社区，最佳分区规模 \\(q_{\\rm opt}\\sim\\sqrt{n}\\)。\n3. 这为网络社区结构的可检测性、最优性和热力学有序性提供了重整化群理解，层次化有序通过温度按 \\(1/\\ln q\\) 衰减的一级相变级联实现，每个稳定层级在 \\(n\\to\\infty\\) 时持续存在。", "summary_source": "deepseek", "authors": [{"name": "Alexei Vazquez"}], "featured_authors": [{"name": "Alexei Vazquez"}], "author_count": 1}, {"id": "2607.05962", "category": "cond-mat", "title": "High temperature ferromagnetism in epitaxial monolayers of Co-doped Fe5GeTe2", "abstract": "Magnetic van der Waals materials have mainly been investigated in their bulk form or as few-layers flakes. Due to the challenges in producing atomically thin films, only a few have been isolated as monolayers, which typically exhibit long-range magnetic order below 150 K. In this work, we use molecular beam epitaxy to synthesize Co-doped Fe5GeTe2, achieving precise control over both thickness and composition. We demonstrate ferromagnetism well above room temperature in multilayer samples and present clear evidence of ferromagnetic ordering in monolayers up to $\\sim$200 K. The changes in Curie temperature and magnetic anisotropy with composition exhibit similar trends in both monolayers and thicker films, indicating that the magnetic properties are primarily governed by intralayer magnetic interactions. Through element-specific X-ray magnetic circular dichroism and density functional theory, we identify the substitution site of Co dopants and reveal the mechanism behind the Curie temperature enhancement induced by Co doping. Our findings suggest that, despite their weak magnetic moment, Co dopants strengthen the magnetic moments on neighboring Fe atoms and enhance the intralayer ferromagnetic exchange interactions.", "url": "https://arxiv.org/abs/2607.05962", "type": "理论+数值", "summary": "1. 该工作利用分子束外延技术精确控制薄膜厚度与Co掺杂浓度，成功制备了Co掺杂Fe5GeTe2外延多层膜与单层膜，并观测到单层膜中铁磁有序直至约200 K。\n2. 通过元素分辨X射线磁圆二色性谱与密度泛函理论计算，确定了Co原子取代特定Fe位，揭示了Co掺杂虽本身磁矩较弱，但通过增强邻近Fe原子磁矩并强化层内铁磁交换耦合，从而显著提升居里温度的物理机制。\n3. 多层膜与单层膜的磁各向异性和居里温度随组分呈现相似变化，表明层内磁相互作用决定其磁性，这为在二维原子层极限下实现高温乃至室温铁磁有序提供了明确的材料工程路径。", "summary_source": "deepseek", "authors": [{"name": "Jules Courtin"}, {"name": "Fatima Ibrahim"}, {"name": "Davide Benettin"}, {"name": "Djordje Dosenovic"}, {"name": "Roberto Sant"}, {"name": "Pâmella Vasconcelos Borges Pinho"}, {"name": "Vincent Polewczyk"}, {"name": "Alain Marty"}, {"name": "Isabelle G de Moraes"}, {"name": "Matthieu Jamet"}, {"name": "Denis Jalabert"}, {"name": "Fadi Choueikani"}, {"name": "Philippe Ohresser"}, {"name": "N. B. Brookes"}, {"name": "Hanako Okuno"}, {"name": "Mairbek Chshiev"}, {"name": "Frédéric Bonell"}], "featured_authors": [{"name": "Jules Courtin"}, {"name": "Fatima Ibrahim"}, {"name": "Davide Benettin"}, {"name": "Hanako Okuno"}, {"name": "Mairbek Chshiev"}, {"name": "Frédéric Bonell"}], "author_count": 17}, {"id": "2607.06028", "category": "cond-mat", "title": "Bose Einstein Condensation of Magnons in BaCuSi$_{2}$O$_{6}$: An experimental perspective", "abstract": "Han Purple, a pigment first obtained in ancient China, is one of the earliest known synthetic pigments. Also naturally occurring, as a mineral, it is known as colinowensite (Cwn). Its chemical formula is BaCuSi$_{2}$O$_{6}$, and its structure is a layered cyclosilicate in which magnetic Cu$^{2+}$ ions (S = 1/2) form dimers arranged on a square lattice, making it also the first known synthetic metal dimer compound. Most interesting magnetic properties arise from a strong intradimer spin coupling, accompanied by weaker interdimer interactions within and between Cu-dimer layers. In zero or small magnetic fields, BaCuSi$_{2}$O$_{6}$ remains a quantum paramagnet. However, under high magnetic fields between 23 and 49 Tesla -- about a million times stronger than Earth's magnetic field -- it undergoes magnetic ordering at subliquid Helium temperatures into an almost ideal easy-plane (XY) antiferromagnetic state regarded as a realization of a Bose-Einstein condensate of magnons. Within this experimentally accessible field range, BaCuSi$_{2}$O$_{6}$ serves as an extraordinary playground for testing predictions of quantum many-body physics.", "url": "https://arxiv.org/abs/2607.06028", "type": "实验", "summary": "1. 该工作从实验角度综述了BaCuSi₂O₆中磁振子玻色-爱因斯坦凝聚的实现。\n2. 卖点在于23–49 T磁场区间呈现近理想易面反铁磁态，成为稀有的磁振子BEC平台。\n3. 这为检验量子多体理论预言提供了明确启发，并拓展了合成量子磁体的研究方向。", "summary_source": "deepseek", "authors": [{"name": "Marcelo Jaime"}, {"name": "Franziska Weickert"}], "featured_authors": [{"name": "Marcelo Jaime"}, {"name": "Franziska Weickert"}], "author_count": 2}, {"id": "2607.06051", "category": "cond-mat", "title": "From Active to Odd to Smart Matter", "abstract": "The study of active matter has reshaped our understanding of collective states of matter far from equilibrium by proving that energy pumped into the microscopic scale leads to order on the macroscopic scale, collective motion, and anomalous mechanical responses. More recently, the discovery of odd elasticity and nonreciprocal mechanical couplings has extended these ideas to solid-like active systems, revealing materials with nonconservative elastic response. Simultaneously, innovative developments in swarm robotics , programmable metamaterials , and learning algorithms have led to the emergence of a new frontier in which collective behavior and mechanical response are no longer fixed by design, but adapted, optimized, and learned toward functional goals. This Perspective proposes a unifying trajectory, from active to odd to smart matter, organized along two intertwined axes: the traditional gas--liquid--solid progression of condensed matter, and the more recentparadigm shift from spontaneous collective dynamics to task-driven functionality. We try to highlight emerging principles, conceptual shifts, and open challenges that come along this trajectory, and argue that learning may play the role of a specific form of emergence, which could advantageously replace the more traditional view of control, at least in the realm of physics.", "url": "https://arxiv.org/abs/2607.06051", "type": "理论+数值", "summary": "1. 本展望沿凝聚态气体-液体-固体演化和从自发集体动力学到任务驱动功能两条轴线，提出了从活性物质经奇弹性物质到智能物质的统一发展轨迹。\n2. 其核心亮点在于揭示非互易力学耦合与学习算法如何将传统非平衡集体态转变为可适应、优化并实现功能目标的新型物相。\n3. 这一框架暗示学习可作为涌现的特殊形式，有望在未来替代传统控制范式，为活性固体与可编程超材料的原理设计提供根本启发。", "summary_source": "deepseek", "authors": [{"name": "Olivier Dauchot"}], "featured_authors": [{"name": "Olivier Dauchot"}], "author_count": 1}, {"id": "2607.06053", "category": "cond-mat", "title": "Deep-learning Hamiltonian reveals twist-tunable flat bands and nonlinear photocurrents in SrTiO3 moire bilayers", "abstract": "The extension of moire physics to complex oxides offers new ways to manipulate electronic states, but the large oxide moire supercells make systematic first-principles calculations demanding. Here, we combine density functional theory with the E(3)-equivariant deep-learning Hamiltonian framework DeepH-E3 to investigate the twist-angle-dependent electronic structure and optical responses of twisted bilayer SrTiO3. The model is trained on untwisted bilayers with different interlayer-sliding configurations and then applied to commensurate twisted bilayers with twist angles from 8.80 degrees to 53.13 degrees. Compared with the untwisted bilayer, decreasing twist angle systematically flattens the valence bands and leads to nearly dispersionless bands at the smallest angles studied. Based on the predicted Hamiltonians, we evaluate the dielectric response, second-harmonic generation (SHG), shift current, and spin Hall conductivity. The dielectric response and spin Hall conductivity remain close to those of the untwisted bilayer, whereas the nonlinear optical responses are more strongly affected by twisting. SHG is strongly enhanced relative to the weak untwisted response, and the shift current shows a clear twist-angle dependence within the response-calculation range (53.13 degrees-22.62 degrees). These results show that twist engineering can control electronic and optoelectronic responses in oxide moire systems.", "url": "https://arxiv.org/abs/2607.06053", "type": "理论+数值", "summary": "1. 该工作将密度泛函理论与E(3)等变深度学习哈密顿量框架结合，系统研究了扭转双层钛酸锶的转角依赖电子结构与光学响应。\n2. 其核心优势在于仅训练未扭转双层的滑动构型即可准确预测8.80°至53.13°转角下的能带结构，揭示价带随转角减小而变平直至近乎无色散。\n3. 这展示了扭转工程可在氧化物莫尔体系中显著增强二次谐波产生并调控位移电流，为设计转角可控的光电功能材料提供新路径。", "summary_source": "deepseek", "authors": [{"name": "Meiyang Yu"}, {"name": "Chen Shen"}, {"name": "Ruiwen Xie"}, {"name": "Jingwei Tao"}, {"name": "Lijun Zhang"}, {"name": "Hongbin Zhang"}], "featured_authors": [{"name": "Meiyang Yu"}, {"name": "Chen Shen"}, {"name": "Ruiwen Xie"}, {"name": "Jingwei Tao"}, {"name": "Lijun Zhang"}, {"name": "Hongbin Zhang"}], "author_count": 6}, {"id": "2607.06057", "category": "cond-mat", "title": "Stabilization of Stone-Wales Defects in Metal-supported Graphene", "abstract": "The characteristics of graphene-metal interfaces play a decisive role in their electronic, optoelectronic, and mechanical applications. Properties such as charge transfer across the interface become particularly significant in the presence of topological defects. The stability of Stone Wales (SW) defects in graphene is governed by the balance between three energy descriptors, the activation energy, formation energy, and restoration energy. By comparing the energy parameters obtained from first-principles density functional theory calculations, we show that SW defect formation is energetically more favorable on metal-supported graphene. Our calculations for SW defects in graphene/Cu(111) and graphene/Al(111) systems indicate only a little dependence of energy profile on the type of metal. The presence of the metal substrate leads to a $\\sim$ 12\\% increase in the formation energy and a $\\sim$ 20\\% reduction in the activation energy, which together favor the formation of Stone Wales defects. Although the restoration energy decreases by about $\\sim$ 35\\% in metal-supported graphene, it remains significantly higher to prevent self-healing. As a result, once formed, the Stone Wales defects are likely to remain stable, suggesting the possibility of terminal SW defect formation in metal-supported graphene.", "url": "https://arxiv.org/abs/2607.06057", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算，对比分析了金属支撑石墨烯中Stone-Wales缺陷的形成能、激活能与恢复能，阐明了其稳定性机制。\n2. 其核心发现是金属衬底使形成能增加约12%、激活能降低约20%，同时恢复能降低约35%但仍阻止自修复，从而协同促进缺陷稳定存在。\n3. 这暗示在金属支撑石墨烯中可实现终态Stone-Wales缺陷，为通过衬底工程调控石墨烯拓扑缺陷提供了可行思路。", "summary_source": "deepseek", "authors": [{"name": "Rob H. Mason"}, {"name": "Manuka M. S. Sinharage"}, {"name": "Hansika I. Sirikumara"}, {"name": "Sabrina Nilufar"}, {"name": "Thushari Jayasekera"}], "featured_authors": [{"name": "Rob H. Mason"}, {"name": "Manuka M. S. Sinharage"}, {"name": "Hansika I. Sirikumara"}, {"name": "Sabrina Nilufar"}, {"name": "Thushari Jayasekera"}], "author_count": 5}, {"id": "2607.06062", "category": "cond-mat", "title": "Universal self-similar evolution of two-dimensional Bose-Einstein condensates in the acoustic regime", "abstract": "When driven out of equilibrium, a Bose-Einstein condensate develops nonlinearly interacting density waves that trigger a turbulent cascade, transferring energy toward small scales. In this article, we investigate the nonstationary evolution of solutions to the two-dimensional Gross-Pitaevskii equation. Through numerical simulations of both the GPE and the corresponding Wave Kinetic Equation, we identify self-similar solutions relevant to atomic and polariton Bose-Einstein Condensates. These solutions exhibit characteristics of both first and second kind self-similarity. In particular, we show that the dynamics of the propagating front is universal, governed by a dimensionless universal constant $\\beta$, which we determine numerically.", "url": "https://arxiv.org/abs/2607.06062", "type": "理论+数值", "summary": "1. 该工作通过数值求解二维Gross-Pitaevskii方程及对应波动能方程，研究了非平衡玻色-爱因斯坦凝聚体在声学区域的自相似演化。\n2. 其核心发现是传播前沿动力学由无量纲普适常数β唯一决定，且自相似解兼具第一类与第二类自相似性特征。\n3. 这为理解原子与极化激元凝聚体中湍流级联的普适前驱行为，以及推动相关非稳态现象的理论建模提供了明确基准。", "summary_source": "deepseek", "authors": [{"name": "Guillaume Costa"}, {"name": "Sergey Nazarenko"}, {"name": "Giorgio Krstulovic"}], "featured_authors": [{"name": "Guillaume Costa"}, {"name": "Sergey Nazarenko"}, {"name": "Giorgio Krstulovic"}], "author_count": 3}, {"id": "2607.06110", "category": "cond-mat", "title": "Conditional Residence Times and Sequential Transition Dynamics of an Overdamped Dimere", "abstract": "We investigate the completion dynamics of an overdamped dimer moving in a bistable potential under thermal fluctuations and a weak periodic force. Both monomers start in one of the two wells separated by a barrier. The transition is initiated when the monomer closer to the barrier makes a jump across it. The completion dynamics refers to the next part of the dynamics where the second monomer has to wait for some time before it can follow up. We use the Conditional Residence Time (CRT) to study the delay between the successive barrier crossing of the two monomers. The CRT distributions highlight qualitatively different regimes formed by the competition between the escape times of the lagging monomer and the time period of the external drive. The effect is strongest in the weak coupling regime where the delayed completion is spread across multiple forcing cycles. By partitioning this process into three windows, i.e. the immediate, first cycle and later cycles, we show that the probability that the lagging monomer will make a transition in the said cycle is redistributed among these pathways as we change the frequency of the drive. This leads to a non-monotonic dependence of the mean CRT on the frequency of the drive. Our results demonstrate that transition initiation and completion in a coupled system are two separate processes and establish CRT as a useful measure to quantify the sequential barrier crossing dynamics in coupled stochastic systems.", "url": "https://arxiv.org/abs/2607.06110", "type": "理论", "summary": "1. 该工作利用条件停留时间（CRT）研究了过阻尼二聚体在双稳势中顺序跨越势垒的完成动力学。\n2. 其卖点在于揭示了弱耦合下滞后单体的延迟跨越可分布在多个驱动周期，且CRT均值随驱动频率呈非单调依赖。\n3. 这为耦合随机系统中顺序势垒跨越的量化分析提供了新工具，并将初始与完成过程视为分离事件。", "summary_source": "deepseek", "authors": [{"name": "Dhruv Agrawal"}, {"name": "W. L. Reenbohn"}], "featured_authors": [{"name": "Dhruv Agrawal"}, {"name": "W. L. Reenbohn"}], "author_count": 2}, {"id": "2607.06122", "category": "cond-mat", "title": "Multiscale modelling of diffusion and retention of hydrogen in multi-occupancy traps in irradiated bcc metals", "abstract": "We use molecular dynamics simulations to directly compute the effective diffusivity of hydrogen gas atoms in homogeneous distributions of monovacancies in tungsten and vanadium, and voids in tungsten. Rather than fitting the results to an Arrhenius law, we compare to an analytic approximation for the effective diffusivity recently derived for multi-occupancy traps [Kaur et al (2025), Phys. Rev. Mater. 9:125404]. We find good agreement between full atomistic simulation and our theory, validating the analytic model for diffusivity for materials containing nanoscale defects characteristic of radiation damage. There are no parameters fitted, only physically motivated quantities that can be computed with static density functional or atomistic potential calculations. In this study we prove rapid convergence of hydrogen trap occupation to the steady state using lattice kinetic Monte Carlo, the spontaneous emergence of voids in tungsten using atomistic simulation with empirical potentials, and molecular hydrogen formation in voids using molecular dynamics. We conclude with a prediction for diffusion and retention of hydrogen in voids in tungsten starting from first principles. This work shows that not only is the analytic form for diffusivity and retention in multi-occupancy traps a practical scheme for making predictive simulations of hydrogen isotope diffusion and retention in irradiated microstructures, derived and parameterized from first principles, it is superior to existing single-occupancy trap formalisms.", "url": "https://arxiv.org/abs/2607.06122", "type": "理论+数值", "summary": "1. 该工作通过分子动力学模拟直接计算氢在辐照bcc金属钨和钒中单空位及钨中空洞内的有效扩散率，并与多占据陷阱解析近似进行对比验证，确认了理论模型的准确性。\n2. 其技术卖点在于模型无任何拟合参数，仅依赖从第一性原理或原子势计算的物理量，且证明多占据陷阱形式在描述氢扩散与保留上优于传统单占据模型，并揭示了空洞内分子氢的形成与陷阱占据的快速稳态收敛。\n3. 这为从第一性原理出发预测辐照微结构中氢同位素的扩散与滞留提供了可靠且高效的多尺度模拟方案，对核材料中氢行为的研究具有重要启发。", "summary_source": "deepseek", "authors": [{"name": "Daniel Mason"}, {"name": "Sanjeet Kaur"}, {"name": "Samanyu Tirumala"}, {"name": "Prashanth Srinivasan"}, {"name": "Ville Jantunen"}, {"name": "Max Boleininger"}], "featured_authors": [{"name": "Daniel Mason"}, {"name": "Sanjeet Kaur"}, {"name": "Samanyu Tirumala"}, {"name": "Prashanth Srinivasan"}, {"name": "Ville Jantunen"}, {"name": "Max Boleininger"}], "author_count": 6}, {"id": "2607.06190", "category": "cond-mat", "title": "Uncertainty relations for arbitrary currents in coherent transport", "abstract": "We derive thermodynamic and kinetic uncertainty relations valid for arbitrary currents in coherent, strongly coupled, linear systems out of equilibrium. Exploiting properties of the transport statistics, in particular fluctuation theorems, we identify the relevant entropy production and activity that determine the cost of precision at the level of individual scattering events. The resulting bounds include higher-order fluctuations and remain valid far from equilibrium. We illustrate our results in normal and superconducting hybrid structures, and show that their predictiveness and validity range exceeds existing formulations.", "url": "https://arxiv.org/abs/2607.06190", "type": "理论", "summary": "1. 该工作推导了适用于相干输运中任意电流的热力学与动力学不确定关系。\n2. 其技术关键在于利用输运涨落定理识别熵产生与活性作为精度成本量，所获界包含高阶涨落且远离平衡仍有效。\n3. 在正常与超导混合结构中的验证表明，该关系预测力与适用范围超越现有理论。", "summary_source": "deepseek", "authors": [{"name": "Ludovico Tesser"}, {"name": "Janine Splettstoesser"}], "featured_authors": [{"name": "Ludovico Tesser"}, {"name": "Janine Splettstoesser"}], "author_count": 2}, {"id": "2607.06205", "category": "cond-mat", "title": "Thermodynamic phase transitions in lattice spin systems with severe kinetic constraints: Numerical simulation results", "abstract": "The Fredrickson-Andersen model with hyperparameter $K=1$ is a severely constrained kinetic lattice spin system, such that any site is temporarily blocked from changing its packing state (empty or occupied) if there is one or more occupied nearest neighbors. Starting from a completely random initial configuration with a fraction $\\rho$ of sites being occupied, some of the sites may be permanently frozen to their initial state under this severe kinetic constraint. The remaining sites can switch states at least occasionally, and they form the unfrozen subsystem associated with the given initial configuration. In the present work we investigate thermodynamic phase transitions in such unfrozen subsystems of the two-dimensional square lattice and the three-dimensional cubic lattice by extensive numerical simulations. We demonstrate that the giant connected component of the unfrozen subsystem collapses at certain critical value $\\rho_{c}$ of initial packing density, with $\\rho_c = 0.2475$ for the square lattice and $\\rho_c = 0.2809$ for the cubic lattice. This phase transition belongs to the same universality class of the conventional site percolation. We also observe that the ground states (densest packing configurations) experience a continuous crystal-to-glass phase transition at the critical value $\\rho^* = 0.1423$ of initial packing density for the cubic lattice. For the two-dimensional square lattice we argue that long-range crystalline order is destroyed in the ground states as long as the initial packing density $\\rho$ is positive.", "url": "https://arxiv.org/abs/2607.06205", "type": "理论+数值", "summary": "1. 该工作通过大规模数值模拟，研究了二维正方晶格与三维立方晶格上Fredrickson-Andersen严重动力学约束模型中未冻结子系统的热力学相变。\n2. 其核心发现是未冻结子系统巨大连通分量在临界初始密度处崩塌，该相变属于常规点位逾渗普适类，且立方晶格基态存在晶体-玻璃连续相变。\n3. 这为理解严重动力学约束下冻结与渗流行为的普适性提供了数值证据，并对相关玻璃化转变或动力学阻塞模型的研究具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Ruifeng Liu"}, {"name": "Jianwen Zhou"}, {"name": "Yejia Chen"}, {"name": "Jiahang Chen"}, {"name": "Hai-Jun Zhou"}], "featured_authors": [{"name": "Ruifeng Liu"}, {"name": "Jianwen Zhou"}, {"name": "Yejia Chen"}, {"name": "Jiahang Chen"}, {"name": "Hai-Jun Zhou"}], "author_count": 5}, {"id": "2607.06209", "category": "cond-mat", "title": "Piezoaxial coupling for strain-selected ferroaxial domain control", "abstract": "We formulate a symmetry-based hierarchy of strain-derived conjugate fields for ferroaxial order, and demonstrate strain-selected ferroaxial domain control using first-principles calculations. Since ferroaxial order is even under both spatial inversion and time reversal, ordinary electric and magnetic fields cannot serve as universal linear conjugate fields. Homogeneous strain, however, can generate symmetry-allowed piezoaxial fields whose leading order is determined by the parent point group and by the chosen ferroaxial-axis component. For basal-plane strain, the leading field is linear in orthorhombic systems, quadratic in tetragonal systems, and cubic in trigonal and hexagonal systems. Cubic parent groups further split into two classes: cubic-I groups, $23$ and $m\\bar{3}$, allow linear full-strain fields for selected axes, whereas cubic-II groups, $432$, $\\bar{4}3m$, and $m\\bar{3}m$, forbid linear fields and require quadratic or cubic strain combinations depending on the selected axis. In trigonal systems, the basal-plane deviatoric strain with signed amplitude $\\varepsilon_{\\rm u}$ and principal-axis angle $\\theta$ gives the single-axis field $h\\propto\\varepsilon_{\\rm u}^3\\sin6\\theta$. First-principles calculations for the trigonal ferroaxial compound Na$_2$BaMg(PO$_4$)$_2$ verify both the predicted angular dependence and cubic strain scaling of the ferroaxial domain splitting, and fixed-strain atomic relaxations show strain-selected evolution from the para-axial structure. These results establish static homogeneous strain as a symmetry-allowed conjugate field for ferroaxial order and suggest a route to ferroaxial domain control through strain-field cooling.", "url": "https://arxiv.org/abs/2607.06209", "type": "理论+数值", "summary": "1. 该工作基于对称性分析建立了应变衍生共轭场的层次结构，并利用第一性原理计算实现了铁轴畴的应变选择控制。\n2. 其核心在于揭示了均匀应变作为铁轴序的对称允许线性共轭场，其主导阶随母点群和铁轴分量从线性到三次变化，且三角晶系中基面偏应变产生正比于ε_u^3 sin6θ的单轴场。\n3. 这为通过应变场冷却实现铁轴畴定向控制提供了可行路径，并拓展了利用力学场操控反常序参量的普适框架。", "summary_source": "deepseek", "authors": [{"name": "Rikuto Oiwa"}, {"name": "Satoru Hayami"}], "featured_authors": [{"name": "Rikuto Oiwa"}, {"name": "Satoru Hayami"}], "author_count": 2}, {"id": "2607.06253", "category": "cond-mat", "title": "Local spin magnetization in itinerant non-collinear magnets: The local spin Berry curvature", "abstract": "Conventionally, the local spin magnetization in itinerant magnets is determined from the equilibrium local spin density. Here, we propose a thermodynamic approach in which the local spin magnetization is defined from the response of the system to an infinitesimal external magnetic field. The predictions of the two theories are identical for collinear magnets, but differ qualitatively and quantitatively for non-collinear magnets. In the present thermodynamic approach, the spin coherences determine an alternative distribution of local spin magnetization due to the field-induced deformation of the energy eigenstates. This effect is captured by a Berry-curvature-like contribution reminiscent of orbital magnetization and has several distinct observable consequences. We explore the differences between the conventional and thermodynamic approaches in several test cases.", "url": "https://arxiv.org/abs/2607.06253", "type": "理论", "summary": "1. 该工作提出了一种热力学方法，通过系统对外加磁场的响应定义局域自旋磁化强度，取代传统的局域自旋密度定义。\n2. 其核心在于揭示了自旋相干性导致的类贝里曲率贡献，该贡献来源于外场诱导的能态形变，对非共线磁体产生定性及定量差异。\n3. 这为理解非共线磁体中局域磁化的非常规分布及其可观测后果提供了新框架，并启发相关理论与实验研究。", "summary_source": "deepseek", "authors": [{"name": "Doru Sticlet"}, {"name": "Frédéric Piéchon"}], "featured_authors": [{"name": "Doru Sticlet"}, {"name": "Frédéric Piéchon"}], "author_count": 2}, {"id": "2607.06279", "category": "cond-mat", "title": "Bockstein Braiding Statistics Versus Three-Loop Braiding", "abstract": "Braiding statistics of $p$- and $q$-dimensional topological excitations is conventionally defined in $p+q+2$ spatial dimensions. We find a novel statistical process $W_N(X,Y)=(Y^{-1}X^{-1})^N(YX)^N$ for two order-$N$ excitations in $p+q+1$ dimensions, detecting the Bockstein response $A\\smile \\beta(B)$. This new statistics and fermionic loop statistics exhaust all loop statistics in three dimensions whose fusion rules form an Abelian group $G$, classified by $H^5(B^2G,U(1))$. Surprisingly, conventional three-loop braiding goes beyond this classification, so it must have non-Abelian fusion rules. We suggest viewing three-loop braiding as particle-loop braiding together with exotic fusion rules between loops and point-like defects. We also try to clarify the relationship between statistics and symmetry anomaly.", "url": "https://arxiv.org/abs/2607.06279", "type": "理论", "summary": "1. 该工作突破了编织统计通常所需的 p+q+2 维空间限制，在 p+q+1 维中定义了阶为 N 的 p 维与 q 维激发间的新型编织过程 W_N，并证明其物理内容为检测 Bockstein 上同调类 A∪β(B)。\n2. 主要技术卖点是：基于该过程与费米子环统计，实现了三维中所有具有阿贝尔融合规则 G 的环统计的完全分类，其分类由第五上同调群 H^5(B^2G,U(1)) 刻画，且传统三环编织因必须具有非阿贝尔融合规则而构成例外。\n3. 该工作建议将三环编织视为粒子-环编织与环-点缺陷奇异融合的组合，并为统一理解拓扑激发编织统计与对称性反常之间的内在联系提供了关键线索。", "summary_source": "deepseek", "authors": [{"name": "Hanyu Xue"}], "featured_authors": [{"name": "Hanyu Xue"}], "author_count": 1}, {"id": "2607.06303", "category": "cond-mat", "title": "From Valley Filtering to Superconducting Diode Effect in Spin-Orbit Coupled Graphene Junctions", "abstract": "We study the transport properties of proximitized graphene, which can acquire a spin-orbit coupling by the proximity effect with a substrate. We focus on the ballistic and zero temperature limits, making use of a tight-binding procedure based on the KWANT Python package. We first find key results on valley-filtering properties and asymmetric edge transport in spin-orbit coupled graphene single junctions, and then move to the analysis of the superconducting transport in a graphene Josephson junction, in the short junction limit. We study the relative contribution of edge modes for different edge terminations and some degree of edge disorder, and also analyze the magnetic interference pattern that arises when threading the junction with a perpendicular magnetic field. We find residual supercurrent at high magnetic fluxes, due to the localized nature of transport in the junction, and a strong non-reciprocal transport that leads to a significant Josephson diode effect.", "url": "https://arxiv.org/abs/2607.06303", "type": "理论", "summary": "1. 该工作利用紧束缚方法研究邻近效应诱导自旋轨道耦合的石墨烯结中从谷过滤到超导二极管的输运性质。\n2. 其核心发现在于短结极限下边缘无序和不同边缘终止导致的高磁通剩余超流及显著的约瑟夫森二极管效应。\n3. 这为基于自旋轨道耦合石墨烯的边缘态调控及非互易超导器件设计提供了具体物理机制参考。", "summary_source": "deepseek", "authors": [{"name": "F. Bonasera"}, {"name": "G. A. Falci"}, {"name": "E. Paladino"}, {"name": "F.M.D. Pellegrino"}], "featured_authors": [{"name": "F. Bonasera"}, {"name": "G. A. Falci"}, {"name": "E. Paladino"}, {"name": "F.M.D. Pellegrino"}], "author_count": 4}, {"id": "2607.06324", "category": "cond-mat", "title": "Robust q-negative Multifractal Detrended Cross-Correlation Coefficient", "abstract": "The multifractal detrended cross-correlation coefficient $\\rho_q(n)$ is widely used to investigate scale-dependent interactions, but its application to negative fluctuation orders is affected by numerical instabilities, unbounded values, and interpretational difficulties. We propose a Signed Multifractal Detrended Cross-Correlation Coefficient, $\\rho_{\\mathrm{SMFDCCA}}(n,q)$, an amplitude-conditioned correlation observable for multifractal detrended analysis, based on locally normalized detrended correlations and regularized fluctuation amplitudes. The proposed coefficient preserves the sign of local interactions, remains strictly bounded within $[-1,1]$ for both positive and negative values of $q$, and eliminates the corrective procedures required by previous approaches. Validation using independent fractional Gaussian noise confirms the absence of spurious cross-correlations and the numerical stability of the method. Applications demonstrate that the proposed observable resolves how cross-correlations evolve jointly with temporal scale and fluctuation amplitude, revealing scale- and amplitude-dependent correlation structures, including stronger synchronization during large fluctuations in stock-market indices and heterogeneous coupling patterns in temperature records.", "url": "https://arxiv.org/abs/2607.06324", "type": "理论+数值", "summary": "1. 该工作提出一个符号化多重分形去趋势交叉相关系数ρ_SMFDCCA(n,q)，解决原ρ_q(n)在负波动阶数下的数值不稳定与无界问题。\n2. 其技术核心在于基于局部归一化去趋势相关与正则化波动振幅，使系数严格有界于[-1,1]且保留局部相互作用符号，无需额外修正。\n3. 该方法可揭示交叉相关随尺度与振幅的联合演化，为股票指数大波动同步增强及温度记录异质耦合模式提供稳定分析工具。", "summary_source": "deepseek", "authors": [{"name": "Thiago B. Murari"}, {"name": "José Fernando F. Mendes"}, {"name": "Hernane B. B. Pereira"}, {"name": "Marcelo A. Moret"}], "featured_authors": [{"name": "Thiago B. Murari"}, {"name": "José Fernando F. Mendes"}, {"name": "Hernane B. B. Pereira"}, {"name": "Marcelo A. Moret"}], "author_count": 4}, {"id": "2607.06332", "category": "cond-mat", "title": "Anomalously high quasiparticle thermal conductivity in the underdoped cuprate superconductor HgBa$_{2}$CuO$_{4+δ}$", "abstract": "The single-layer cuprate superconductor HgBa$_{2}$CuO$_{4+\\delta}$ (Hg1201) is an ideal candidate for investigating many properties of cuprates with minimal disorder and without the complication of multiple CuO$_2$ layers. Here we measure the in-plane longitudinal thermal conductivity $\\kappa$ of underdoped Hg1201 ($T_c$ = 76 K, $p$ = 0.11) at dilution refrigerator temperatures to extract the nodal quasiparticle velocity ratio $v_F/v_\\Delta$. Assuming contributions from only a single line node per quadrant on the Fermi surface leads to a value of $v_F/v_\\Delta$ = $23 \\pm 3$, anomalously large compared to other cuprates at similar dopings. In conjunction with the anomalously high quasiparticle specific heat of Hg1201 in the normal state reported previously at a similar doping, this points to more than one Fermi surface sheet crossing the nodal line, suggesting the presence of more than the single small electron pocket detected by quantum oscillations.", "url": "https://arxiv.org/abs/2607.06332", "type": "理论", "summary": "1. 该工作测量了欠掺杂铜氧化物超导体HgBa₂CuO₄₊δ在稀释制冷温度下的面内纵向热导率，提取了节点准粒子速度比v_F/v_Δ。\n2. 其核心发现是v_F/v_Δ=23±3，显著高于其他同类掺杂的铜氧化物，暗示存在多于一个费米面条带穿过节点线。\n3. 这挑战了单一节点费米面图像，为理解欠掺杂铜氧化物中多个费米面片段的共存及其对热输运的影响提供了关键线索。", "summary_source": "deepseek", "authors": [{"name": "Jordan Baglo"}, {"name": "Quentin Barthélemy"}, {"name": "Étienne Lefrançois"}, {"name": "Anne Forget"}, {"name": "Dorothée Colson"}, {"name": "Cyril Proust"}, {"name": "Louis Taillefer"}], "featured_authors": [{"name": "Jordan Baglo"}, {"name": "Quentin Barthélemy"}, {"name": "Étienne Lefrançois"}, {"name": "Dorothée Colson"}, {"name": "Cyril Proust"}, {"name": "Louis Taillefer"}], "author_count": 7}, {"id": "2607.06378", "category": "cond-mat", "title": "Dynamical Simulation of Membrane Bending by Flexible Protein Assemblies", "abstract": "Membrane-deforming protein lattices play a key role in essential and pathogenic biological processes, including endocytosis and viral budding. Attaining the necessary length- and time-scales in simulation can be difficult for such large-scale membrane remodeling events. We present a model of a flexible protein lattice coupled to a Helfrich membrane propagated in Fourier space in the over-damped regime. We focus primarily on membrane-bound clathrin lattices, an essential part of the endocytic machinery. We quantify the material properties of our clathrin model lattices using buckling methods to measure the flexural rigidity as it varies with force constants of the coarse-grained potential energy function. By comparing this flexural rigidity to the effective rigidity observed when modeling the bending energy of a spherical clathrin coat using a Helfrich-like bending energy term, we show how the interpretation of the bending rigidity changes with the structure of the protein coat, resulting in an effective stiffening as the coat grows. This relatively common approximation thus must be applied with care, as it can over-estimate the stiffness of assembled lattices depending on the interpretation assumed. We validate our model by verifying that the tension of our simulated membrane results in changes to the geometry of the clathrin coat consistent with theoretical expectations. We conclude by demonstrating our newly available code for transferring structures assembled via rigid-body reaction-diffusion (using the NERDSS simulation package) into our flexible membrane-coupled dynamical framework, applying it to the membrane-bound HIV-1 immature Gag lattice.", "url": "https://arxiv.org/abs/2607.06378", "type": "理论+数值", "summary": "1. 该工作提出了一个将柔性蛋白晶格耦合至傅里叶空间过阻尼Helfrich膜的动力学期刊框架，用于模拟内吞作用与病毒出芽中的大尺度膜重塑事件。\n2. 其卖点在于通过屈曲方法测量晶格弯曲刚度随力常数的变化，并与球形衣壳的Helfrich有效刚度对比，揭示了蛋白晶格生长导致的刚度有效增大现象，指出常用近似可能高估组装晶格的实际柔韧性。\n3. 这为从粗粒度模拟中准确提取蛋白-膜相互作用的力学参数提供了方法基础，并可推广至其他膜结合蛋白复合物（如HIV-1 Gag晶格）的大尺度动力学研究。", "summary_source": "deepseek", "authors": [{"name": "Samuel L. Foley"}, {"name": "Margaret E. Johnson"}], "featured_authors": [{"name": "Samuel L. Foley"}, {"name": "Margaret E. Johnson"}], "author_count": 2}, {"id": "2607.06430", "category": "cond-mat", "title": "Instabilities of Fermi Liquids with Arbitrary Forward Scattering: Exact Approach", "abstract": "In this work, we consider $N$-fold degenerate $D$-dimensional electron gas with spherical Fermi surface and arbitrary forward-scattering density-density interaction transferring small momentum compared to the Fermi momentum $k_{\\mathrm{F}}$. The dimensional reduction that is mathematically equivalent to the Haldane patch construction and similar multidimensional bosonization techniques, provides a natural map of two-point $D$-dimensional correlation functions (fermion Green function, susceptibilities etc.) onto effective one-dimensional (1D) correlators with the same diagrammatic structure, which can be evaluated exactly within a 1D bosonizable (Gaussian) theory. We then apply this formalism to evaluate the fermion Green function, pair and charge/flavor susceptibilities, as well as the composite correlation functions for the case of a finite-range interaction, where the interaction range $R_{\\mathrm{s}} \\gg 1/k_{\\mathrm{F}}$ is large compared to the Fermi wavelength. First, we find that the single-particle spectral function remains Fermi-liquid-like which is fully consistent with the previous research. In contrast to the single-particle sector, the many-body channels are efficiently dressed by finite-range interactions, and this dressing is fully equivalent to the one-loop renormalization group (RG), which is also in line with previous multidimensional bosonization results. Within the forward-scattering model, stable long-range order is not possible, and relevant susceptibilities demonstrate singular power-law scaling with temperature $T$ at $T \\to 0$. The rest of the abstract is in the PDF.", "url": "https://arxiv.org/abs/2607.06430", "type": "理论+数值", "summary": "1. 该工作针对具有任意前向散射与球形费米面的D维简并电子气，基于维度约化建立精确映射，将多点关联函数转化为一维可玻色化高斯理论中的可解关联子。\n2. 其核心在于发现有限程相互作用下多体通道的修饰完全等价于单圈重整化群，且前向散射模型中无稳定长程序，导致配对与电荷磁化率在低温下呈现幂律发散标度。\n3. 这一精确形式为区分单粒子与多体通道对费米液体不稳定性的贡献提供了严格基准，并可推广至有限温度下非费米液体行为的系统性分析。", "summary_source": "deepseek", "authors": [{"name": "Dmitry Miserev"}, {"name": "Joel Hutchinson"}, {"name": "Herbert Schoeller"}, {"name": "Jelena Klinovaja"}, {"name": "Daniel Loss"}], "featured_authors": [{"name": "Dmitry Miserev"}, {"name": "Joel Hutchinson"}, {"name": "Herbert Schoeller"}, {"name": "Jelena Klinovaja"}, {"name": "Daniel Loss"}], "author_count": 5}, {"id": "2607.06448", "category": "cond-mat", "title": "Dimensional Crossover of Thermal Transport in Nanoconfined Liquids Driven by the Interplay of Quasi-One-Dimensional Structure and Wall Dissipation", "abstract": "Heat transport in nanoconfined liquids can deviate from ordinary Fourier behavior because confinement alters liquid structure and interfacial dissipation. Although such changes may lead to quasi-one-dimensional transport or overdamped sound relaxation, the conditions under which length-dependent transport persists remain unclear. Here we use molecular dynamics simulations of monatomic liquid argon confined in carbon nanotubes with systematically varied radii and lengths. We find a radius-controlled crossover: length-dependent axial thermal conductivity persists over long tube lengths in single-file and single-shell states, but is strongly truncated or nearly saturated once mixed-shell or multilayer packing develops. This crossover is accompanied by the loss of clear acoustic-like axial modes and enhanced wall--liquid friction. Thus, tube radius controls whether length-dependent heat transport persists or is truncated by coupling confined-liquid structure to wall-induced dissipation.", "url": "https://arxiv.org/abs/2607.06448", "type": "数值", "summary": "1. 该工作通过分子动力学模拟系统研究单原子氩在碳纳米管中的热输运，发现管半径调控长度依赖轴向热导率的维度交叉行为。\n2. 其核心物理在于单文件与单壳态下准一维声学输运持续，而混合壳或多层堆积时声学模式消失与壁摩擦增强共同截断热导长度依赖。\n3. 这揭示了受限液体结构-耗散耦合决定纳米尺度傅里叶失效条件，为设计基于限域结构调控热传导的人工流体系统提供明确依据。", "summary_source": "deepseek", "authors": [{"name": "Kenta Hisamoto"}, {"name": "Yusei Kobayashi"}, {"name": "Takahiro Ikeda"}, {"name": "Eiji Yamamoto"}, {"name": "Masashi Yamakawa"}], "featured_authors": [{"name": "Kenta Hisamoto"}, {"name": "Yusei Kobayashi"}, {"name": "Takahiro Ikeda"}, {"name": "Eiji Yamamoto"}, {"name": "Masashi Yamakawa"}], "author_count": 5}, {"id": "2607.06460", "category": "cond-mat", "title": "Correlation of maximum superconducting critical temperature with copper-oxygen energy distance and oxygen hole content in the Emery model", "abstract": "Identifying microscopic parameters that optimize the maximum superconducting critical temperature $T_c^{\\rm max}$ in the canonical model of the copper-oxygen plane of cuprates, the Emery model, remains challenging. Using cellular dynamical mean-field theory at finite temperature, we find that for a fixed charge gap size in the parent charge-transfer insulating state, $T_c^{\\rm max}$ unexpectedly increases with increasing the copper-oxygen energy distance, as this favors the transfer of electrons from oxygen to copper orbitals. We show that these findings emerge naturally in the Zaanen-Sawatzky-Allen scheme and capture observed trends in hole-doped cuprates. Overall, our study uncovers that $T_c^{\\rm max}$ is optimized in the Emery model under three conditions: upon doping a charge-transfer insulator, close to the charge-transfer insulator to metal boundary, and deep into the charge-transfer regime. This finding indicates new paths for optimizing $T_c^{\\rm max}$.", "url": "https://arxiv.org/abs/2607.06460", "type": "理论+数值", "summary": "1. 该工作通过有限温度胞动力学平均场理论系统研究了Emery模型中最大超导转变温度的微观优化条件。\n2. 核心发现是在固定电荷转移绝缘体母体能隙下，最大超导转变温度随铜氧能量距离增大而反常提升，其物理机制是促进了电子从氧向铜轨道的转移。\n3. 这揭示了最大超导转变温度在掺杂电荷转移绝缘体、接近绝缘体-金属相变边界且深入电荷转移区时达到最优，为高温超导材料的参数优化提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Eleanor M. O'Callaghan"}, {"name": "Nicolas Kowalski"}, {"name": "A.-M. S. Tremblay"}, {"name": "Giovanni Sordi"}], "featured_authors": [{"name": "Eleanor M. O'Callaghan"}, {"name": "Nicolas Kowalski"}, {"name": "A.-M. S. Tremblay"}, {"name": "Giovanni Sordi"}], "author_count": 4}, {"id": "2607.06463", "category": "cond-mat", "title": "Eclipsing Kitaev: off-diagonal exchange governs the correlated high-field phases of $β$-Li$_2$IrO$_3$", "abstract": "We report a high-field thermodynamic study of the hyperhoneycomb Kitaev material $\\beta$-Li$_2$IrO$_3$, using magnetotropic susceptibility to resolve its low-temperature field-angle phase diagram across the principal crystallographic planes in magnetic fields up to $60$ T. Rather than evolving directly from the low-field incommensurate state into a polarized regime, the system exhibits a strongly direction-dependent sequence of correlated phases. Most notably, for fields in the $ac$-plane, we identify an additional high-field phase that is absent in the other principal planes and exists only within a restricted region of field-angle space. This phase structure is naturally explained by the competition between magnetic field and bond-directional exchange interactions. Using a symmetry-based description supported by microscopic calculations within the $J$-$K$-$\\Gamma$ model, we show that off-diagonal $\\Gamma$ exchange couples the ferromagnetic and staggered magnetic orders and thereby stabilizes the observed correlated high-field phases. The measured angular dependence of the critical fields is quantitatively captured by this theory, identifying $\\Gamma$ exchange as the key interaction controlling the high-field response. These results clarify why the promise of a field-induced spin liquid -- the notion that suppressing magnetic order might reveal the underlying Kitaev physics -- remains unfulfilled in candidate materials: even when the Kitaev interaction is large, off-diagonal exchange stabilizes symmetry-constrained correlated phases that instead preempt the polarized state.", "url": "https://arxiv.org/abs/2607.06463", "type": "理论+数值", "summary": "1. 该工作利用磁化率测量，在β-Li2IrO3中解析了高达60 T磁场下跨越主晶面的低温场角相图，发现系统并非直接从低场非公度态进入极化态，而是在ac平面特定角度区间出现一个额外高场相关相。\n2. 借助J-K-Γ模型的对称性分析与微观计算，证明非对角Γ交换通过耦合铁磁序与交错磁序稳定了该受对称性约束的高场相，并定量复现了临界场的角度依赖。\n3. 这一结果表明，即使Kitaev相互作用占优，非对角交换仍会先于极化态稳定对称性约束的相关相，从而解释了为何场致自旋液体在候选材料中未能实现。", "summary_source": "deepseek", "authors": [{"name": "Vikram Nagarajan"}, {"name": "Ioannis Rousochatzakis"}, {"name": "Yuanqi Lyu"}, {"name": "Darian Hall"}, {"name": "Augusto Ghiotto"}, {"name": "Josue Rodriguez"}, {"name": "Koh Yamakawa"}, {"name": "James Analytis"}, {"name": "John Singleton"}, {"name": "Mun K. Chan"}, {"name": "Natalia B. Perkins"}, {"name": "K. A. Modic"}], "featured_authors": [{"name": "Vikram Nagarajan"}, {"name": "Ioannis Rousochatzakis"}, {"name": "Yuanqi Lyu"}, {"name": "Mun K. Chan"}, {"name": "Natalia B. Perkins"}, {"name": "K. A. Modic"}], "author_count": 12}, {"id": "2607.06511", "category": "cond-mat", "title": "Static vacancies as parametrized conformal defects in the critical $J_1$--$J_2$ transverse-field Ising chain", "abstract": "We revisit the problem of two static nonmagnetic vacancies in the transverse-field Ising chain with first- and second-neighbor couplings $J_1$ and $J_2$, now on the critical line, using density-matrix renormalization-group (DMRG) calculations in open chains of up to $N=300$ sites. In contrast to the gapped regime studied previously, where the vacancy-vacancy interaction decays exponentially, along the entire quantum critical line the interaction becomes algebraic, $|\\Delta_b(r)|\\sim r^{-\\alpha}$, with $\\alpha$ close to the universal Casimir value of unity and a weak but systematic dependence on the second-neighbor coupling, $\\alpha_\\infty \\simeq 1.070 + 0.091\\, J_2/J_1)$ across $J_2/J_1\\in[0.1,1.0]$. The transmission ratio of the spin correlator
