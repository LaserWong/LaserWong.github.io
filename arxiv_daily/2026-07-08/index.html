d_authors": [{"name": "Shintaro Maekawa"}, {"name": "Takao Otsuka"}, {"name": "Riku Masui"}, {"name": "David Muñoz Ramo"}, {"name": "Yasushi Okuno"}, {"name": "Kentaro Yamamoto"}], "author_count": 7}, {"id": "2607.05873", "category": "quant-ph", "title": "Fixing Divergence in Carleman Linearization via Analytical Continuation", "abstract": "Nonlinear differential equations play a crucial role in modeling a wide range of phenomena, yet their solutions remain notoriously difficult to obtain. With the rapid development of quantum computing, quantum algorithms for efficiently solving such equations are actively being explored. One promising approach is based on Carleman linearization, which transforms nonlinear differential equations into linear systems. However, this method suffers from exponential divergence beyond a certain time scale. By reformulating the solutions in terms of eigenvalues and eigenvectors, we identify that this divergence originates from the Laurent expansion outside its neighborhood of convergence. To address this issue, we insert a regularized function to the divergent solution hinted by analytical continuation. We validate this divergence-correction method on both the logistic equation and some other partial differential equations like KPP-Fisher equations and Phase-Field models under periodic conditions. We implement our method for the logistic equation using the Linear Combination of Unitaries (LCU) quantum algorithm, providing a detailed complexity and error analysis.", "url": "https://arxiv.org/abs/2607.05873", "type": "理论+数值", "summary": "1. 该工作提出一种基于解析延拓的正则化方法，用于修复Carleman线性化处理非线性微分方程时出现的指数发散问题。\n2. 其技术核心在于将发散归因于洛朗展开超出收敛邻域，并通过插入解析延拓提示的修正函数实现收敛恢复。\n3. 这为利用量子算法（如LCU）高效求解非线性方程提供了可控的误差与复杂度分析框架。", "summary_source": "deepseek", "authors": [{"name": "Mingshuo Zhu"}, {"name": "Hayato Higuchi"}, {"name": "Hokuto Iwakiri"}, {"name": "Kouki Nakamura"}, {"name": "Naohisa Sueishi"}, {"name": "Shih-Yen Tseng"}, {"name": "Shoichiro Tsutsui"}], "featured_authors": [{"name": "Mingshuo Zhu"}, {"name": "Hayato Higuchi"}, {"name": "Hokuto Iwakiri"}, {"name": "Naohisa Sueishi"}, {"name": "Shih-Yen Tseng"}, {"name": "Shoichiro Tsutsui"}], "author_count": 7}, {"id": "2607.05897", "category": "quant-ph", "title": "Strictly Local Tile-Code Architectures on Two-Dimensional Planar Lattices", "abstract": "Tile codes are a family of planar quantum low-density parity-check (qLDPC) codes with weight-6 stabilizers and open boundary conditions, offering an encoding efficiency $kd^2/n$ of up to four times that of the surface code. In this work, we develop an exhaustive search algorithm for finding SWAP-based routing schemes that implement syndrome extraction for four tile-code families using only nearest-neighbor interactions on a two-dimensional square lattice, matching the connectivity of the surface code. Using explicitly constructed routed syndrome-extraction circuits decoded with BP+OSD, we estimate the circuit-level thresholds of these code families. For the SI1000 noise model, the threshold without such a connectivity constraint is obtained in a range 0.23%-0.31%, while it decreases to 0.11%-0.13% with routing, representing a reduction factor of around two to three. Despite this threshold penalty, our resource-footprint analysis shows that routed tile codes require fewer physical qubits per logical qubit than the surface code at sufficiently low physical error rates: Under the SI1000 noise model, we find a crossover near $p^*\\approx 0.08\\%$, below which routed tile codes become more qubit-efficient, with an advantage that grows monotonically as the physical error rate decreases.", "url": "https://arxiv.org/abs/2607.05897", "type": "理论+数值", "summary": "1. 本文开发穷举搜索算法，为四类tile码族构建基于SWAP路由的症候提取线路，仅需二维正方晶格上的最近邻相互作用，匹配表面码的连通性约束。\n2. 技术卖点在于实现严格局域的tile码架构，并揭示路由代价导致SI1000噪声模型下的阈值从0.23%-0.31%降至0.11%-0.13%，但资源分析表明在物理错误率低于约0.08%时，路由tile码每位逻辑量子比特所需物理量子比特数少于表面码。\n3. 该工作启示低错误率区域下，牺牲阈值换取量子比特效率的折衷策略具有实用前景，为近邻约束量子平台的编码选择提供优化方向。", "summary_source": "deepseek", "authors": [{"name": "Yoonjin Bae"}, {"name": "Chae-Yeun Park"}], "featured_authors": [{"name": "Yoonjin Bae"}, {"name": "Chae-Yeun Park"}], "author_count": 2}, {"id": "2607.05959", "category": "quant-ph", "title": "Universal quantum cloning beyond noncontextual theory", "abstract": "Quantum theory fundamentally forbids the perfect copying of an arbitrary unknown quantum state, according to a principle known as the no-cloning theorem. Nevertheless, it is possible to construct a deterministic quantum map that produces multiple approximate copies of an unknown quantum state. This task is referred to as universal quantum cloning, further facilitating numerous quantum technologies such as quantum cryptography and quantum communication. In this work, we theoretically verify that the universal quantum cloning cannot be realized within a noncontextual theory, highlighting its intrinsically nonclassical nature. Our verification first {focuses on revealing that} $1\\rightarrow2$ cloning scenario {is fully contextual}, and {further covers general examples to observe the contextual behavior of} $N\\rightarrow M$ scenario. We believe that our results regarding quantum cloning serve a key role for understanding both quantum foundation and application.", "url": "https://arxiv.org/abs/2607.05959", "type": "理论", "summary": "1. 该工作理论上证实了通用量子克隆无法在非语境理论中实现，确立了其内在非经典性。\n2. 其核心在于通过1→2与N→M克隆场景的语境性分析，揭示了量子克隆对经典实在论的超越。\n3. 这为理解量子信息处理中克隆任务的根本限制提供了关键洞见，并推进了量子基础与应用交叉研究。", "summary_source": "deepseek", "authors": [{"name": "Min Namkung"}, {"name": "Hyang-Tag Lim"}], "featured_authors": [{"name": "Min Namkung"}, {"name": "Hyang-Tag Lim"}], "author_count": 2}, {"id": "2607.06040", "category": "quant-ph", "title": "Hybrid quantum floating-point method for sharp arithmetic", "abstract": "There are several possible ways to encode random variables in a quantum state. The basis encoding of bit strings has paramount importance because it allows to load the values of a random variable through the superposition of corresponding basis states, and to then exploit quantum parallelism in processing algorithms. The basis encoding offers a natural way to represent an unsigned integer random variable, and extends to signed integers, as well as to fixed-point and floating-point variables. Each quantum representation of fractional numbers, however, involves a trade-off between accuracy and depth of manipulation circuits. Here, an efficient hybrid quantum-classical representation of quantum floating points is introduced. It combines a quantum register containing the values, with a classical register storing global information about the variable, namely the range and approximation tolerances. The sum and product operations are defined, in such a way as to ensure they are performed without overflow. By taking advantage of the stored classical information, the precision degradation that occurs due to rounding after repeated data manipulations, can be significantly reduced compared to known strategies. Ad hoc examples show up to around $90\\%$ reduction in approximation, compared to previous techniques, after repeated additions. The method finds application in many algorithms of practical relevance and constitutes a significant advance in the design of arithmetic circuits with low depth and high accuracy.", "url": "https://arxiv.org/abs/2607.06040", "type": "理论+数值", "summary": "1. 该工作提出一种混合量子-经典浮点数表示方法，结合量子寄存器存储变量值与经典寄存器记录全局范围和容差。\n2. 其卖点在于通过经典信息的辅助，将重复运算后的舍入精度退化较已知策略降低约90%，且确保加法和乘积操作无溢出。\n3. 这为在低深度电路中实现高精度量子算术提供了可行方案，并可直接应用于众多实际量子算法。", "summary_source": "deepseek", "authors": [{"name": "Gabriele Agliardi"}, {"name": "Enrico Prati"}], "featured_authors": [{"name": "Gabriele Agliardi"}, {"name": "Enrico Prati"}], "author_count": 2}, {"id": "2607.06071", "category": "quant-ph", "title": "Quantization of the classical Mpemba effect", "abstract": "The Mpemba effect refers to the counterintuitive phenomenon that an initially hot system can freeze faster than an initially warm one. Recent years have brought major advances in both classical and quantum realizations, with the asymmetric bistable potential emerging as the paradigmatic classical benchmark because its mechanism is especially transparent and controllable. Yet for precisely this benchmark problem, the impact of quantization remains unexplored. Here we show that quantization shifts Mpemba behavior to qualitatively new regimes, moving it to ultra-cold temperatures that are orders of magnitude lower than those relevant for classical thermal barrier crossing. In addition, quantization produces inverse and double inverse Mpemba effects that are absent in the corresponding classical dynamics. Our results establish quantization as a robust route to quantum-enabled Mpemba effects inaccessible in classical regimes.", "url": "https://arxiv.org/abs/2607.06071", "type": "理论", "summary": "1. 该工作研究了经典Mpemba效应在量子化下的表现，发现量化将不对称双稳势阱中的Mpemba行为推至超冷温度新区域。\n2. 核心技术突破在于发现经典动力学中不存在的逆与双逆Mpemba效应，其温度量级远低于经典热势垒穿越的相关温度。\n3. 这提供了量化作为实现经典不可及量子Mpemba效应的稳健途径，为极端低温下反常热化动力学研究开辟了新方向。", "summary_source": "deepseek", "authors": [{"name": "Jannis Melles"}, {"name": "Hartmut Löwen"}, {"name": "Benno Liebchen"}, {"name": "Michael te Vrugt"}, {"name": "Giovanna Morigi"}, {"name": "Artur Widera"}, {"name": "Alexander P. Antonov"}], "featured_authors": [{"name": "Jannis Melles"}, {"name": "Hartmut Löwen"}, {"name": "Benno Liebchen"}, {"name": "Giovanna Morigi"}, {"name": "Artur Widera"}, {"name": "Alexander P. Antonov"}], "author_count": 7}, {"id": "2607.06215", "category": "quant-ph", "title": "Coherence Estimation Beyond the Liouvillian Gap in a Finite Nonequilibrium System", "abstract": "We investigate the estimation of bath-induced coherence in a finite quantum system interacting with thermal reservoirs. Enhancement of coherence estimation is transient and the estimation precision totally disappears at the steady state despite the system retaining finite coherence. By analyzing the full Liouvillian eigenspectrum, we demonstrate that the optimal sensing window emerges from the competition between identifiable contributory modes' temporal relaxation and statistical importance. Neither is the linear inverse scaling of Liouvillian gap with transient optimal time a signature of unimodal contribution to optimal sensing, nor is the existence of multimodal dynamics a signature of nonlinear scaling. The inverse Liouvillian gap does not obey any general scaling with the optimal sensing time of coherence and we prove our numerical results analytically using a general Markovian framework. We further show that coupling the finite system to a quantum cavity and maintaining a thermal bias, transforms the transient metrological optimization into a sustained steady-state resource.", "url": "https://arxiv.org/abs/2607.06215", "type": "理论+数值", "summary": "1. 该工作通过分析有限非平衡量子系统的全Liouvillian本征谱，揭示了浴诱导相干性估计的最优感知窗口由多个贡献模式的弛豫时间与统计权重竞争决定。\n2. 其核心技术结论是逆Liouvillian间隙与相干性最优感知时间无普适标度关系，且耦合腔与热偏置可将瞬态计量优化转变为稳态资源。\n3. 这为设计超越Liouvillian间隙限制的非平衡量子计量方案提供了理论依据，启发利用多模动力学而非单慢模来增强相干性估计。", "summary_source": "deepseek", "authors": [{"name": "Sonali Brahma"}, {"name": "Trishna Kalita"}, {"name": "Himangshu Prabal Goswami"}], "featured_authors": [{"name": "Sonali Brahma"}, {"name": "Trishna Kalita"}, {"name": "Himangshu Prabal Goswami"}], "author_count": 3}, {"id": "2607.06293", "category": "quant-ph", "title": "Calculating strongly correlated ground states from the non-Markovian dissipative dynamics of Gaussian fermions", "abstract": "We introduce a mapping between the ground state of interacting fermionic Hamiltonians and the non-equilibrium steady state of a purely dissipative open quantum system. Within the framework of third quantization, we map the Fermi-Hubbard Hamiltonian onto Lindblad jump operators acting on Majorana fermions. Remarkably, both hopping and interaction terms map onto jump operators that preserve the Gaussianity of Majorana fermions along individual quantum trajectories. As a result, the dynamics can be unravelled and each trajectory can be simulated efficiently using only two-point correlation functions, with a computational cost that scales polynomially with system size. We further show that finite particle number requires negative dissipative rates, leading to an intrinsically non-Markovian dynamics. The corresponding trajectory unravelling involves both positive and negative stochastic weights and exhibits a sign problem and large fluctuations, so that convergence requires an exponentially large number of trajectories. The overall computational cost remains exponential in system size despite the efficient Gaussian representation of individual trajectories, but is crucially dependent on the computational complexity of the non-Markovian unravelling, motivating further studies on the efficiency of such unravellings.", "url": "https://arxiv.org/abs/2607.06293", "type": "理论", "summary": "1. 该工作将强关联费米子哈密顿量基态映射为高斯费米子的非马尔可夫耗散稳态，通过第三量子化将费米-哈伯德模型转化为保持马约拉纳费米子高斯性的林德布拉德跳跃算符。\n2. 其技术要点在于利用单轨迹高斯性实现仅需两点关联函数的多项式级模拟，但有限粒子数必需负耗散率，导致本质上非马尔可夫的动力学及轨迹展开中的符号问题与指数级所需轨迹数。\n3. 这揭示了高斯费米子表示在强关联问题中的有效性与局限性，并激励对非马尔可夫展开计算复杂性与高效算法的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Giuliano Chiriacò"}], "featured_authors": [{"name": "Giuliano Chiriacò"}], "author_count": 1}, {"id": "2607.06307", "category": "quant-ph", "title": "Quantum Probabilistic Local Differential Privacy: Structural Properties and Sample Complexity Bounds", "abstract": "Differential privacy provides a rigorous framework for quantifying privacy leakage in data analysis, while its quantum extensions have become increasingly relevant with the development of quantum computing and quantum machine learning. In this work, we introduce and study quantum probabilistic local differential privacy, a relaxation of quantum local differential privacy in which the privacy constraint is allowed to fail on a spectral violation event with low probability. This quantity can be interpreted as the probability under the quantum superoperation of a quantum privacy-loss violation, and is closely related to the acceptance probability of the quantum Neyman-Pearson test at a small threshold. We investigate the basic structural properties of this privacy notion and clarify its relationship with existing forms of quantum differential privacy. We show the properties of quantum probabilistic local differential privacy under tensor-product composition and unitary post-processing, while it is in general neither convex nor closed under post-processing by arbitrary quantum channels. We further characterize when depolarizing noise satisfies quantum probabilistic local differential privacy under several representative scenarios. Finally, we connect quantum probabilistic privacy constraints with statistical inference by deriving a lower bound on probabilistically privatized contraction coefficients in terms of the hockey-stick divergence. As an application, we obtain sample complexity bounds of probabilistically privated asymmetric and symmetric quantum hypothesis testing. These results provide a systematic foundation for studying probabilistic privacy guarantees in quantum information processing and their operational consequences for private quantum statistical inference.", "url": "https://arxiv.org/abs/2607.06307", "type": "理论+数值", "summary": "1. 该工作引入并系统研究了量子概率局部差分隐私的概念，包括其结构性质及与现有量子差分隐私形式的关系。\n2. 核心在于将隐私约束的松弛刻画为谱违反事件的低概率，并建立其与量子Neyman-Pearson检验接受概率及hockey-stick散度的定量联系。\n3. 这为量子信息处理中概率隐私保障的理论分析以及私有量子假设检验的样本复杂度界提供了系统基础。", "summary_source": "deepseek", "authors": [{"name": "Xian Shi"}], "featured_authors": [{"name": "Xian Shi"}], "author_count": 1}, {"id": "2607.06404", "category": "quant-ph", "title": "Bosonic quantum error-correcting codes with finite stellar rank", "abstract": "Bosonic quantum error correction (QEC) relies on non-Gaussian bosonic encodings whose preparation cost is a central practical constraint. In this work, we use stellar rank as a resource measure to design and benchmark bosonic codes under finite non-Gaussian resources. For fixed cat and Gottesman--Kitaev--Preskill (GKP) code families, we show that finite stellar rank creates a trade-off among state approximability, energy, and logical protection under photon loss and photon-number dephasing, evaluated with optimal recovery. This trade-off implies that codewords with better ideal error-correction properties need not be optimal once finite-rank preparation constraints are imposed. Going beyond fixed-target codewords, we directly optimize bosonic encodings at fixed stellar rank, revealing noise-adapted code structures and concrete resource thresholds. Grid-like encodings emerge under photon loss, whereas approximately rotation-symmetric encodings arise under dephasing. In the optimized search, stellar rank k=2 suffices to surpass break-even for all dephasing strengths considered, while under photon loss the required rank increases with the loss rate. These results establish stellar rank as an operationally meaningful resource measure for bosonic QEC under practical state-preparation constraints.", "url": "https://arxiv.org/abs/2607.06404", "type": "数值", "summary": "1. 该文以恒星秩为资源度量，系统研究了有限非高斯资源下玻色量子纠错码的设计与性能基准。\n2. 核心发现是有限恒星秩在猫码与GKP码族中引入态可近似性、能量与逻辑保护间的权衡，并直接优化固定恒星秩的编码，揭示出噪声自适应结构与资源阈值。\n3. 这确立了恒星秩作为操作资源度量在考虑制备约束的玻色QEC中的实用性，并为实际编码选择提供了定量启发。", "summary_source": "deepseek", "authors": [{"name": "Rui Wang"}, {"name": "Adithi Udupa"}, {"name": "Timo Hillmann"}, {"name": "Ulysse Chabaud"}, {"name": "Alessandro Ferraro"}, {"name": "Giulia Ferrini"}], "featured_authors": [{"name": "Rui Wang"}, {"name": "Adithi Udupa"}, {"name": "Timo Hillmann"}, {"name": "Ulysse Chabaud"}, {"name": "Alessandro Ferraro"}, {"name": "Giulia Ferrini"}], "author_count": 6}, {"id": "2607.06472", "category": "quant-ph", "title": "Provable learning separation for predicting time-evolution of quantum many-body systems", "abstract": "Given that quantum computers are naturally suited to simulate the behavior of quantum many-body systems, an immediate question arises: can one formulate physically motivated quantum machine learning (QML) tasks that exhibit learning separations? We address this problem by studying the learnability of quantum many-body dynamics from the perspective of probably approximately correct (PAC)-learning. Concretely, we devise a supervised learning problem where the training set consists of specifications of randomized stabilizer probe states, evolution times sampled uniformly from a polynomially large time interval $[0,T]$, coupled with expectation values of certain observables evaluated on the resulting time-evolved state under an unknown Hamiltonian. For this learning task, we provide an efficient quantum procedure whose training phase learns the underlying Hamiltonian from short-time training samples, and whose deployment phase combines Hamiltonian simulation with the classical shadows protocol to perform inference on a newly given data point. By contrast, the existence of $O(\\mathsf{poly}(n))$-time instances ensures classical hardness: by embedding a $\\mathsf{BQP}$-complete computation into the polynomially long time-dynamics of a low-intersection variant of the Feynman-Kitaev clock Hamiltonian construction, we show that, for a certain family of input distributions, no randomized classical polynomial-time algorithm can fulfill our learning condition, unless $\\mathsf{BQP}\\subseteq\\mathsf{P/poly}$. Furthermore, we show that the classically hard instance maintains quantum learnability. We also give an interpretation of our results in learning-assisted certified quantum simulation. Taken together, our results demonstrate a rigorous learning separation for a natural ML task based on Hamiltonian evolution, while building connections between quantum learning theory, quantum simulation, and QML.", "url": "https://arxiv.org/abs/2607.06472", "type": "理论+数值", "summary": "1. 该工作从PAC学习角度研究量子多体系统时间演化的可学习性，构造了一个基于哈密顿演化的监督学习任务并证明量子算法与经典算法之间存在严格学习分离。\n2. 其技术核心在于量子过程利用短时训练数据高效学习未知哈密顿量，并结合哈密顿模拟与经典影协议进行推断，而经典困难性通过将BQP完全问题嵌入长时动力学来建立。\n3. 此连接量子学习理论与模拟的严格分离结果为辅助认证量子模拟提供了理论启发，并证实了基于物理动机的量子机器学习任务中实际优势的存在。", "summary_source": "deepseek", "authors": [{"name": "Rahul Bandyopadhyay"}, {"name": "Riccardo Molteni"}, {"name": "Jens Eisert"}, {"name": "Vedran Dunjko"}, {"name": "Sofiene Jerbi"}], "featured_authors": [{"name": "Rahul Bandyopadhyay"}, {"name": "Riccardo Molteni"}, {"name": "Jens Eisert"}, {"name": "Vedran Dunjko"}, {"name": "Sofiene Jerbi"}], "author_count": 5}, {"id": "2607.06474", "category": "quant-ph", "title": "Typical Entanglement of Superpositions", "abstract": "We investigate universal entanglement properties inherent to superpositions of randomized states. We find that an $m$-fold superposition of typical states may be classified into two distinct entanglement classes via the 2nd Rényi entropy density $s_2$. The maximally entangled regime is defined by $s_2 \\sim \\ln (2)$, for which superposition adds no additional entanglement. The sub-maximally entangled regime, $s_2<\\ln 2$, instead constrains the reduced density matrices of independent components to be orthogonal in the thermodynamic limit, which fixes the entanglement of the superposition to a logarithmic enhancement $\\Delta S(m)=\\ln (m)$. As a consequence, an exponentially large number of superpositions is required to transition from the sub-maximally entangled class to maximal entanglement. We explicitly calculate $s_2$ and the logarithmic enhancement, and demonstrate orthogonality for two canonical examples of the sub-maximally entangled regime (superpositions of pure Gaussian states and of random matrix-product states). We also examine the entanglement of superpositions of random stabilizer states, and discuss their relaxation to the Haar limit.", "url": "https://arxiv.org/abs/2607.06474", "type": "理论", "summary": "1. 该工作通过第二Rényi熵密度s2将随机态叠加的纠缠分为最大纠缠与次最大纠缠两类，并揭示了其内在的通用纠缠性质。\n2. 在次最大纠缠类中，独立组分的约化密度矩阵在热力学极限下正交，导致叠加纠缠出现确定的对数增强ΔS(m)=ln(m)，且需指数级多的叠加成分才能跃迁至最大纠缠类。\n3. 这一分类与对数增强机制对理解随机态叠加的纠缠结构、稳定子态向Haar极限的弛豫，以及量子多体系统中的典型纠缠行为提供了新的理论基准。", "summary_source": "deepseek", "authors": [{"name": "Damien Quinn"}, {"name": "Joshuah T. Heath"}, {"name": "Graham Kells"}], "featured_authors": [{"name": "Damien Quinn"}, {"name": "Joshuah T. Heath"}, {"name": "Graham Kells"}], "author_count": 3}, {"id": "2607.06500", "category": "quant-ph", "title": "Leveraging Metrologically Useful States in Quantum Reservoir Networks", "abstract": "Interest in using quantum computers for the purpose of predicting chaotic partial differential equations (PDEs) has been growing with the advent of newer low-error quantum computers and robust simulation tools. In this paper, we present a method that utilizes a quantum reservoir network (QRN) to predict latent space representations of the high-dimensional chaotic 1-D Kuramoto-Sivashinksy (KS) system. This hybrid approach takes advantage of advancements in classical machine learning (ML) through the use of a classical autoencoder as well as techniques from quantum metrology through the use of a unitary that creates metrologically-useful states. Through rigorous simulation and analysis, we show that the proposed method outperforms alternative QRN implementations without this metrologically-useful state preparation, and also show better performance than classical echo-state networks when weight regularization is not used. Finally, we bring to light potential issues that can arise when using autoencoders within QRC pipelines.", "url": "https://arxiv.org/abs/2607.06500", "type": "理论+数值", "summary": "1. 该工作提出一种混合量子储层网络方案，利用经典自编码器降维与量子计量学有用态制备，预测一维Kuramoto-Sivashinsky混沌系统潜空间表示。\n2. 技术核心在于通过构造产生计量学有用态的西正算符，显著提升量子储层预测性能，超越未采用该制备的同类方案及无正则化经典回波态网络。\n3. 研究同时揭示自编码器在量子储层计算管线中可能引入的偏差问题，为高维混沌系统量子-经典混合预测的实用化发展提供明确指引。", "summary_source": "deepseek", "authors": [{"name": "Erik L. Connerty"}, {"name": "Margarite LaBorde"}, {"name": "Ethan N. Evans"}], "featured_authors": [{"name": "Erik L. Connerty"}, {"name": "Margarite LaBorde"}, {"name": "Ethan N. Evans"}], "author_count": 3}, {"id": "2607.06539", "category": "quant-ph", "title": "Quantum state localization in dipole-dipole interacting disordered networks", "abstract": "We study the localization of excitations in positionally disordered spin or atom networks coupled via the realistic resonant dipole-dipole interaction (RDDI), which does not conform to a simple power law, as the spatial dependence and dissipative character distinguish it from conventional short or long-range models. Despite its partially long-ranged and radiative nature, positional disorder in the RDDI coupling leads to strong spatial localization of excitations. The interplay between coherent and dissipative couplings gives rise to nontrivial interference effects that stabilize localized modes even in open geometries. Our results uncover a photon wavelength-induced transition from extended to localized excitation dynamics, establishing RDDI networks as a unique setting to explore the emergence of localization in realistic quantum optical systems. Our analysis of the localized modes induced by RDDI has potential applications in coherent photovoltaics, excitonic circuits, quantum memory, and quantum sensors.", "url": "https://arxiv.org/abs/2607.06539", "type": "理论", "summary": "1. 该工作研究了位置无序自旋或原子网络中由共振偶极-偶极相互作用(RDDI)耦合的激发态局域化行为。\n2. 其物理卖点在于揭示RDDI虽具部分长程与辐射特性，但位置无序仍导致强空间局域化，且相干与耗散耦合的干涉效应稳定了开放几何中的局域模式。\n3. 这为探索光子波长诱导的从扩展到局域激发动力学转变提供了唯一平台，并启发了相干光伏、激子电路及量子存储与传感等应用。", "summary_source": "deepseek", "authors": [{"name": "Pritam Chattopadhyay"}, {"name": "Saikat Sur"}, {"name": "Avijit Misra"}, {"name": "David Petrosyan"}, {"name": "Arti Garg"}, {"name": "Gershon Kurizki"}], "featured_authors": [{"name": "Pritam Chattopadhyay"}, {"name": "Saikat Sur"}, {"name": "Avijit Misra"}, {"name": "David Petrosyan"}, {"name": "Arti Garg"}, {"name": "Gershon Kurizki"}], "author_count": 6}, {"id": "2607.06557", "category": "quant-ph", "title": "Quantum Channel Polynomial Processing", "abstract": "We introduce a quantum algorithmic framework based on probabilistic mixtures of unitary channels that, similar to the framework of quantum singular value transformations, enables the application of arbitrary polynomials of hermitian operators onto arbitrary initial states. We show that our framework supports a flexible tradeoff between sample- and query complexity ranging from optimal query complexity, meaning logarithmic in the error, and exponentially scaling sample complexity to sub-polynomial query complexity in the error and polynomial sample complexity. Combined with the considerably lower quantum circuit complexity, compared to quantum singular value transformations with a linear combination of unitaries block encoding, we argue that our framework can be seamlessly scaled from NISQ to fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2607.06557", "type": "数值", "summary": "1. 该工作引入基于概率混合酉通道的量子算法框架，实现了对任意初始态施加厄米算子的任意多项式变换。\n2. 其技术核心在于支持查询复杂度与样本复杂度间的灵活权衡，覆盖从误差对数最优查询至亚多项式查询，且电路复杂度显著低于基于线性组合酉块编码的量子奇异值变换。\n3. 这一框架有望实现从含噪中等规模量子到容错量子计算的平滑扩展，为量子算法设计提供新路径。", "summary_source": "deepseek", "authors": [{"name": "Tianhan Liu"}, {"name": "Fedor Simkovic IV"}, {"name": "Martin Leib"}], "featured_authors": [{"name": "Tianhan Liu"}, {"name": "Fedor Simkovic IV"}, {"name": "Martin Leib"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
