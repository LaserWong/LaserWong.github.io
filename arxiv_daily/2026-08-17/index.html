  <title>arXiv 2026-08-17 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2608.13579", "category": "cond-mat", "title": "Comment on: Microscopic signatures of an imaginary charge density wave in a kagome metal", "abstract": "In this Comment, exact diagonalization and quantitative analysis show that the reported signatures of loop currents in Ref. [ arXiv:2605.05101 ; this https URL ] can instead be explained by crystalline mosaicity and pre-transitional CDW fluctuations. Specifically: (i) the NQR linewidth tracks a standard Curie-Weiss (CW) law with no anomalies; (ii) the Zp-NQR asymmetric lineshapes stem from an angular mosaic spread, reproducing the spin-transition-dependent skewness; and (iii) the reported emergent field ($h_{\\rm loc}$) arises from particular fitting constraints and attributing the angular distribution to an internal field rather than mosaicity. Consequently, the data in Ref. [ arXiv:2605.05101 ; this https URL ] remain insufficient to establish TRSB due to loop currents or a phase transition at $T^* \\sim$ 120 K.", "url": "https://arxiv.org/abs/2608.13579", "type": "理论+数值", "summary": "1. 该评论通过精确对角化与定量分析，论证kagome金属中环电流的微观证据可被晶体镶嵌度及预转变CDW涨落所解释。\n2. 其核心卖点在于指出NQR线宽服从无异常的居里-外斯规律，非对称线形源于角向镶嵌展宽，而所谓内禀场仅为拟合约束的产物。\n3. 这表明相关数据尚不足以确立环电流导致的时间反演对称破缺或T*相变，为后续实验判据提出了更严格的结构效应排除要求。", "summary_source": "deepseek", "authors": [{"name": "Ilija K. Nikolov"}, {"name": "Adrien Rosuel"}, {"name": "Vesna F. Mitrović"}], "featured_authors": [{"name": "Ilija K. Nikolov"}, {"name": "Adrien Rosuel"}, {"name": "Vesna F. Mitrović"}], "author_count": 3}, {"id": "2608.13603", "category": "cond-mat", "title": "On first-order thermodynamic equilibrium conditions for fluid-fluid and solid-phase interfaces", "abstract": "Starting from the constrained variational formulation of Larché and Cahn for solids in contact with fluids, a unified thermodynamic framework for such systems is developed. Both bulk and interfacial equilibrium conditions arise as stationarity conditions of a single thermodynamic functional. While earlier theory neglects a full treatment of interfacial contributions and therefore cannot describe systems in which surface effects are significant, the present formulation incorporates interfacial thermodynamics directly into the variational principle. The framework is introduced first for fluid-fluid systems to establish the underlying mathematical structure, and is then extended to solid-fluid interfaces. Within this setting, classical equilibrium relations for heterogeneous systems emerge naturally from different classes of admissible variations, providing a common theoretical basis for bulk, interfacial, and configurational thermodynamics.", "url": "https://arxiv.org/abs/2608.13603", "type": "理论+数值", "summary": "1. 该文基于Larché-Cahn约束变分方法，推导了流体-流体与固相界面系统的一阶热力学平衡条件，建立了统一框架。\n2. 其技术卖点在于将界面热力学直接纳入单一泛函的驻点条件，使体相、界面与构型平衡关系由不同允许变分自然涌现，弥补了以往理论忽略界面贡献的不足。\n3. 这为表面效应显著的非均相系统提供了共同变分基础，可望推广到相场或数值模拟等复杂界面平衡问题，启发后续研究。", "summary_source": "deepseek", "authors": [{"name": "Nicodemo Di Pasquale"}, {"name": "Thomas Hudson"}], "featured_authors": [{"name": "Nicodemo Di Pasquale"}, {"name": "Thomas Hudson"}], "author_count": 2}, {"id": "2608.13658", "category": "cond-mat", "title": "Far-from-equilibrium topological phase transition in one dimension", "abstract": "We uncover a mechanism for far-from-equilibrium topological phase transitions, via a one-dimensional compact phase model evolving deterministically from random initial conditions. It rests on topology and symmetry rather than on phenomenological postulates: phase compactness permits vortices, and a homogeneous fixed point suppresses their nucleation, with the fixed point itself implied by phase-shift symmetry. The competition between vortex-induced disordering and relaxation toward homogeneity drives a continuous nonequilibrium transition, whose universality class we identify as directed percolation (DP). We demonstrate this by constructing the corresponding effective field theory and numerically confirming DP critical scaling through dynamical-scaling analysis.", "url": "https://arxiv.org/abs/2608.13658", "type": "理论+数值", "summary": "1. 该工作在一维紧致相位模型中揭示了远非平衡拓扑相变机制，系统从随机初态确定性演化。\n2. 其核心是相位紧致性允许涡旋，而相移对称性隐含的均匀不动点抑制涡旋成核；涡旋无序与均匀化弛豫竞争导致连续非平衡相变，并判定其普适类为有向渗流。\n3. 这一拓扑与对称性机制不依赖唯象假设，可望推广到其他受对称性保护的远离平衡动力学系统，并为有效场论与标度分析提供新平台。", "summary_source": "deepseek", "authors": [{"name": "Ze-Min Huang"}, {"name": "Gustav John"}, {"name": "Sebastian Diehl"}], "featured_authors": [{"name": "Ze-Min Huang"}, {"name": "Gustav John"}, {"name": "Sebastian Diehl"}], "author_count": 3}, {"id": "2608.13735", "category": "cond-mat", "title": "Ion-Pairing Enhancement under Osmotic Stress: Disentangling the Effects of Ion and Water Activities", "abstract": "The dependence of ion pairing on osmotic stress may strongly affect the performance of ionic materials and membranes whose interior is often osmotically stresses, yet quantitative understanding of this dependence and, specifically, the effects of water and ion activities is limited. Motivated by this gap, we analyze the enhancement of ion pairing with osmotic pressure for concentrated aqueous KCl, NaCl, and LiCl solutions using molecular dynamics simulations. Based on rigorous thermodynamic relations, we separate the contributions of ion non-ideality to the pairing constant, varying with osmotic pressure, from other effects including water release and type of ion-pair. Our analysis reveals that ion non-ideality indirectly generates a stronger effect on pairing than the direct one of water release. However, its effect is moderated and may even be reversed for more hydrated pairs by a similarly large and opposite effect of ion-pair non-ideality assigned to varying dielectric properties of the solution and water restructuring upon pairing. The interplay between these contributions, including large and pair type-specific hydration effects on the cost of pairing, explains the observed opposing trends: pairing decreases with osmotic pressure for more hydrated solvent-separated pair types while increasing for contact pairs. The trend becomes more pronounced for more hydrated smaller cations, but was fairly independent of the water model used. The results further suggest that dielectric effects enhanced in ionic materials-and, as a result, larger variations of ion-pair non-ideality, compared with aqueous solutions, should have a more significant impact on pairing than water release.", "url": "https://arxiv.org/abs/2608.13735", "type": "理论+数值", "summary": "1. 该工作利用分子动力学模拟并结合严格热力学关系，解析了渗透压胁迫下KCl、NaCl与LiCl水溶液中离子对缔合增强的机制。\n2. 其核心在于将离子非理想性效应与释水效应分离，发现前者虽通常起主导作用，却可被与介电性质及水结构重排相关的离子对非理想性部分抵消甚至逆转，从而解释接触型与溶剂分隔型配对的不同压力依赖。\n3. 这提示在离子材料等介电增强受限环境中，离子对非理想性变化对配对的影响可能比水释放更显著，值得后续实验与理论关注。", "summary_source": "deepseek", "authors": [{"name": "Jay Prakash Singh"}, {"name": "Viatcheslav Freger"}], "featured_authors": [{"name": "Jay Prakash Singh"}, {"name": "Viatcheslav Freger"}], "author_count": 2}, {"id": "2608.13795", "category": "cond-mat", "title": "Systematic extinctions in inelastic neutron scattering from molecular spin clusters", "abstract": "Inelastic neutron scattering on a single crystal resolves how the intensity of a magnetic transition of a molecular spin cluster varies with the momentum-transfer vector $\\mathbf{Q}$. The point group fixes that dependence completely when a single symmetry species mediates the transition and the local spin operators contain only one occurrence of that species. Functions for such universal $\\mathbf{Q}$ dependences have been tabulated. As we show here, even when these conditions are not fulfilled, the point group still fixes, at a given geometry, momentum transfers at which the intensity vanishes for every Hamiltonian that has the symmetry of the cluster. We call such momentum transfers extinctions and derive an equation whose every zero is an extinction, built from the symmetry species of the two levels and from the positions and scattering amplitudes of the magnetic sites. The extinctions follow in closed form in two cases: when each orbit of symmetry-equivalent sites contributes a single occurrence of the mediating species, and when the site phases recur under a subgroup up to one common factor.", "url": "https://arxiv.org/abs/2608.13795", "type": "理论", "summary": "1. 该工作研究分子自旋簇单晶非弹性中子散射中磁跃迁强度随动量转移矢量的变化，建立了系统消光现象的一般理论描述。\n2. 其核心在于，即使单对称种条件不满足，点群仍仅凭两个能级的对称性种类以及磁位点位置和散射振幅确定动量转移零点，并可在两类结构条件下给出闭式消光条件。\n3. 这为在不依赖簇哈密顿量细节的情况下，用非弹性中子散射识别分子簇激发对称性与磁几何提供了模型无关的判定工具和实验指引。", "summary_source": "deepseek", "authors": [{"name": "Shadan Ghassemi Tabrizi"}], "featured_authors": [{"name": "Shadan Ghassemi Tabrizi"}], "author_count": 1}, {"id": "2608.13838", "category": "cond-mat", "title": "Autferroics-based true random number generators with enhanced performance", "abstract": "Physical entropy-driven true random number generators are essential for emerging probabilistic computing paradigms, but conventional implementations based on magnetic tunneling junctions have reached their performance plateaus limited by inherent tradeoffs and weak tunability. Here, autferroics, a sister branch of multiferroics, is proposed to construct true random number generators. Benefiting from its unique energy landscape due to strong seesaw-type magnetoelectricity, the performance of true random number generation can be significantly enhanced in autferroic tunneling junctions, verified by passing standard statistical tests. Furthermore, autferroics-based random number generators can exhibit multi-field tunability and intrinsic multi-state randomness, opening an avenue for efficient hardware realization of the complex-number arithmetic and simulation of probability distributions of quantum mixed states within stochastic circuits.", "url": "https://arxiv.org/abs/2608.13838", "type": "数值", "summary": "1. 该工作提出基于autferroics隧穿结的物理熵真随机数发生器，以突破磁隧穿结性能瓶颈。\n2. 其核心是利用强跷跷板型磁电耦合带来的独特能量景观，增强随机性并实现多场调控与多态随机。\n3. 这为随机电路中复数运算及量子混合态概率分布的硬件模拟提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Jun-Jie Zhang"}, {"name": "Shuai Dong"}, {"name": "Boris I. Yakobson"}], "featured_authors": [{"name": "Jun-Jie Zhang"}, {"name": "Shuai Dong"}, {"name": "Boris I. Yakobson"}], "author_count": 3}, {"id": "2608.13855", "category": "cond-mat", "title": "Small-world structure of quantum computer hardware", "abstract": "We show that the network of quantum register states of a quantum computer (QC), coupled through residual two-body interactions between qubits, exhibits small-world properties analogous to those of complex networks found in human society. The most probable Erdős number between any two states is about 9, comparable to the six degrees of separation reported by Milgram for social networks. Using the $\\mathring{A}$berg criterion, which retains only interactions exceeding the local energy spacing, we construct an effective ($\\mathring{A}$berg) network and show that, above a critical coupling strength, this network percolates into a giant component spanning nearly the whole quantum register space. This percolation transition closely matches the onset of quantum chaos and dynamical thermalization established previously via costly exact diagonalization, while our approach extends the accessible system size up to $n_q=30$ qubits.", "url": "https://arxiv.org/abs/2608.13855", "type": "理论+数值", "summary": "1. 该工作将量子计算机中寄存器态通过残余两体相互作用形成的耦合网络视为复杂网络，证明了其具有与社会网络类似的小世界结构。\n2. 依据Åberg判据仅保留超过局域能级间距的有效耦合，发现态间最概然厄尔多斯数约9，接近六度分离；超过临界耦合时网络逾渗为覆盖几乎整个寄存器空间的巨连通分量，该转变与量子混沌及动力学热化起始相符，并将可研究系统扩展到30个量子比特。\n3. 这为不依赖精确对角化地诊断量子热化与混沌提供了可扩展的图论工具，也可能启发对量子硬件中信息传播宏观特性的深入理解。", "summary_source": "deepseek", "authors": [{"name": "S. J. da Silva Junior"}, {"name": "D. L. Shepelyansky"}, {"name": "J. Lages"}], "featured_authors": [{"name": "S. J. da Silva Junior"}, {"name": "D. L. Shepelyansky"}, {"name": "J. Lages"}], "author_count": 3}, {"id": "2608.13892", "category": "cond-mat", "title": "Anomalous Orbital Reconstruction Controlled by Interorbital Correlations and Hund's Coupling", "abstract": "The microscopic origin of anomalous orbital polarization in a class of low-dimensional correlated oxides remains unresolved due to the competition among crystal-field effects, electronic correlations, and orbital-dependent dimensionality. Using dynamical mean-field theory, we investigate a two orbital Hubbard model with orbital-dependent dimensionality and reveal the mechanism for anomalous orbital polarization through orbital reconstruction beyond the bare crystal-field picture. We identify interorbital Coulomb interaction-induced charge competition as a key microscopic mechanism responsible for the orbital redistribution, which leads first to an orbital-polarized correlated metal and subsequently to an orbital-polarized Mott insulator. We further find that Hund's coupling acts as a filling-dependent regulator of orbital reconstruction. It weakens the correlation-induced orbital redistribution at quarter filling by competing with interorbital charge fluctuations, while at half filling it completely suppresses the orbital-polarized state by stabilizing high-spin orbital-balanced configurations. These results provide a unified picture of correlation driven orbital reconstruction and highlight the relevance of interorbital interactions and Hund's coupling for understanding orbital phenomena in low-dimensional transition-metal oxides.", "url": "https://arxiv.org/abs/2608.13892", "type": "理论+数值", "summary": "1. 该工作利用动力学平均场理论，研究具有轨道依赖维度的双轨道Hubbard模型，以揭示低维关联氧化物中反常轨道极化的微观起源。\n2. 其核心发现是，轨道间库仑相互作用驱动的电荷竞争可实现超出晶体场图像的轨道重构，使体系依次进入轨道极化关联金属与轨道极化Mott绝缘体；Hund耦合则作为依赖填充的调控因素，在四分之一与半填充时分别削弱或完全抑制该轨道极化态。\n3. 这为关联驱动的轨道重构提供了统一物理图像，并突出轨道间相互作用与Hund耦合在理解低维过渡金属氧化物轨道现象中的关键作用。", "summary_source": "deepseek", "authors": [{"name": "Yu Ni"}, {"name": "Lvjin Wang"}, {"name": "Jinfeng Wang"}, {"name": "Yunkun Niu"}, {"name": "Zhaoming Fu"}, {"name": "Yun Song"}], "featured_authors": [{"name": "Yu Ni"}, {"name": "Lvjin Wang"}, {"name": "Jinfeng Wang"}, {"name": "Yunkun Niu"}, {"name": "Zhaoming Fu"}, {"name": "Yun Song"}], "author_count": 6}, {"id": "2608.13988", "category": "cond-mat", "title": "Single-impurity polarons in hard-core lattice bosons at low and intermediate fillings", "abstract": "We investigate a single mobile impurity in a two-dimensional hard-core Bose--Hubbard bath at low and intermediate fillings and determine how polaronic dressing evolves with bath filling for impurity--bath couplings ranging from weak to strong and ultimately to the two-component hard-core limit. Using large-scale, sign-problem-free worm-algorithm quantum Monte Carlo simulations, we extract momentum-space quasiparticle properties from the impurity Green's function and resolve the accompanying real-space bath rearrangement from an imaginary-time-averaged impurity-centered correlator. We also vary the impurity hopping $t_{\\rm imp}$ to assess how reduced mobility modifies dressing in the strong-coupling regime. For the fillings accessible at each coupling, the impurity remains a dressed quasiparticle whose ground-state energy, effective mass, and residue vary smoothly with filling $n_{\\rm b}$. In real space, increasing $n_{\\rm b}$ strengthens the short-range depletion while shifting the dominant response toward the impurity. In the two-component hard-core limit $U_{\\rm ib}/t_{\\rm b}\\!\\to\\!\\infty$, the large-distance recovery of the cumulative density deformation exhibits only weak filling dependence over the range considered here, whereas short-range core indicators continue to evolve. Our results quantitatively characterize strongly dressed polarons in a correlated, compressible lattice bath and resolve how filling and impurity mobility modify the near-core response and spatial extent of the dressing cloud.", "url": "https://arxiv.org/abs/2608.13988", "type": "理论+数值", "summary": "1. 该工作利用无符号问题的蠕虫算法量子蒙特卡洛，系统研究了二维硬核玻色子浴中单个移动杂质从弱耦合到双组分硬核极限的极化子修饰随填充的演化。\n2. 技术亮点在于从杂质格林函数提取动量空间准粒子属性，并借助虚时平均的杂质中心关联函数解析实空间浴的重排，同时考察了杂质跃迁强度的影响。\n3. 结果显示所及填充范围内杂质始终为有修饰的准粒子，其基态能、有效质量和残余随填充平滑变化，且近核响应与空间分布受填充和移动性调控。", "summary_source": "deepseek", "authors": [{"name": "Chao Zhang"}], "featured_authors": [{"name": "Chao Zhang"}], "author_count": 1}, {"id": "2608.14030", "category": "cond-mat", "title": "Periodicity-driven revision of the phase diagram of the generalized Baxter-Wu model with asymmetric complex couplings", "abstract": "The conventional self-dual lines of the generalized Baxter-Wu (GBW) model with asymmetric complex couplings are known to be $\\sinh(2K)=\\pm \\cos(2\\phi)$, where $K$ and $\\phi$ are the real and imaginary parts of the coupling. We demonstrate that these lines are incomplete: the periodicity of the partition function, encoded in the cosine factor of the bundled Boltzmann weight, generates additional self-dual lines $\\sinh(2K)=\\pm \\sin(2\\phi)$. Guided by the complete set of self-dual candidates, we perform Monte Carlo simulations using brute-force reweighting (Metropolis) and the Wang-Landau methods. Simulations indicate that the self-dual lines at the partition-function minima $\\phi_{\\mathcal{Z}_{\\min}}=(2n+1)\\pi/8$ constitute a critical threshold. They are genuine critical boundaries for $|K| \\ge \\frac{1}{2}\\operatorname{arsinh}(\\cos(\\pi/4)) \\approx 0.32924$, while for smaller $|K|$ they are not. At $\\phi_{\\mathcal{Z}_{\\min}}$, the sign problem is most severe and finite-size scaling corrections are largest; the local peak observed below the phase boundary in the temperature scan is thus a finite-size artifact, not a genuine new phase. We further clarify the capability and limitations of the average sign and its derivatives for detecting phase transitions. In particular, the negative peak of the average sign at $\\phi_{\\mathcal{Z}_{\\min}}$ does not correspond to a genuine phase transition. We also evaluate the Wang-Landau method, which, despite formally circumventing the sign problem, still faces the exponential barrier.", "url": "https://arxiv.org/abs/2608.14030", "type": "理论+数值", "summary": "1. 该工作重新考察具有非对称复耦合的广义Baxter-Wu模型，指出传统自对偶线不完备，并补充由配分函数周期性决定的另一组自对偶线。\n2. 通过Metropolis重加权与Wang-Landau模拟发现，配分函数极小处的自对偶线仅在|K|超过阈值时构成真实临界边界，低温峰及平均符号负峰均为有限尺寸或符号问题的伪影。\n3. 这为区分有限尺寸伪影与真实相变提供判据，并明确平均符号导数及Wang-Landau方法在强符号问题下的探测能力与指数屏障局限。", "summary_source": "deepseek", "authors": [{"name": "Yuting Wang"}, {"name": "Ye Ling"}, {"name": "Haihong Li"}, {"name": "Yuhai Liu"}], "featured_authors": [{"name": "Yuting Wang"}, {"name": "Ye Ling"}, {"name": "Haihong Li"}, {"name": "Yuhai Liu"}], "author_count": 4}, {"id": "2608.14072", "category": "cond-mat", "title": "Quantum Geometric Kondo Cloud", "abstract": "A magnetic impurity embedded in a metal is collectively screened by Fermi-surface quasiparticles into a many-body spin-singlet ground state, forming a Kondo cloud of size $\\xi_{\\rm K}\\sim\\hbar v_F/(k_B T_{\\rm K})$. This kinematic picture collapses in flat bands, where $v_F=0$ and the hierarchy of dispersive energy shells is absent. Here we show that the missing organizing principle is quantum geometry. A magnetic impurity coupled to an isolated flat band selects a single active bath mode: a coherent superposition of flat-band Bloch states weighted by the hybridization factor $v(\\mathbf{k})$, while all orthogonal flat-band modes remain dark. The resulting flat-band Kondo problem is a quantum geometric molecule, with an algebraic Kondo scale set by the total projected hybridization strength rather than a logarithmic-renormalization scale. In real space, the impurity-bath spin correlation defines a quantum geometric Kondo cloud. Its cloud-size tensor admits a gauge-invariant decomposition into a hybridization-weighted quantum metric, a dressed Berry-connection covariance, and a positive hybridization-gradient term, yielding the lower bound $\\xi_{\\rm K}^2\\geq \\sum_{\\mathbf{k}}\\rho(\\mathbf{k}){\\rm Tr}\\,g(\\mathbf{k})$, where $\\rho(\\mathbf{k})=|v(\\mathbf{k})|^2/\\sum_{\\mathbf{k}}|v(\\mathbf{k})|^2$. Our result reveals that, in flat bands, Kondo screening is governed by the quantum geometry and interference structure of the impurity-selected Bloch wave packet, rather than Fermi-surface kinematics.", "url": "https://arxiv.org/abs/2608.14072", "type": "理论", "summary": "1. 该工作研究磁性杂质耦合孤立平带时的近藤云，提出量子几何是替代费米面运动学的核心组织原理。\n2. 其物理卖点是杂质只选择由杂化因子加权的布洛赫态相干叠加作为唯一有源库模，近藤尺度由总投影杂化强度代数决定，云尺寸张量可分解为杂化加权量子度量、修饰贝里联络协方差和正的杂化梯度项。\n3. 这为在平带系统、莫尔材料与光晶格中探测近藤云的量子几何特征，并检验云尺寸下界不等式提供了明确理论指引。", "summary_source": "deepseek", "authors": [{"name": "Grant Z. X. Yang"}, {"name": "K. T. Law"}], "featured_authors": [{"name": "Grant Z. X. Yang"}, {"name": "K. T. Law"}], "author_count": 2}, {"id": "2608.14147", "category": "cond-mat", "title": "Accurate and efficient calculation of atomic forces in solids with non-self-consistent hybrid functionals", "abstract": "Hybrid functionals are routinely employed self-consistently within the generalized Kohn-Sham framework. The evaluation of the nonlocal Fock exchange operator makes hybrid functional calculations computationally expensive, in particular with plane-wave basis sets. Here, we investigate the advantages of non-self-consistent hybrid functional calculations, focusing on the evaluation of atomic forces. The analytical force terms that arise due to non-self-consistency are computed using density functional perturbation theory (DFPT), as implemented within the Quantum ESPRESSO distribution. A non-self-consistent hybrid force calculation thus consists of self-consistent DFPT calculations with a local or semi-local functional and a single evaluation of the Fock exchange operator. The overall computational cost is, thereby, reduced in general, especially for solids that require a dense Brillouin-zone sampling. Moreover, results for structural parameters are barely affected by self-consistency, and vibrational frequencies are typically agreeing within 0.5%, thus making non-self-consistent calculations an interesting alternative.", "url": "https://arxiv.org/abs/2608.14147", "type": "理论+数值", "summary": "1. 该工作提出并验证了固体中非自洽杂化泛函原子力计算方案，基于密度泛函微扰论在Quantum ESPRESSO中解析处理非自洽性带来的力项贡献。\n2. 其技术卖点在于仅需局域泛函的自洽微扰计算和单次Fock交换求值即可获得全部解析力，避免杂化泛函反复迭代，在密集布里渊区采样固体中显著降低总计算成本。\n3. 非自洽计算对结构参数几乎没有影响，振动频率偏差通常低于0.5%，这为固体结构优化和晶格动力学研究提供了兼具效率与可靠性的实用替代方案。", "summary_source": "deepseek", "authors": [{"name": "Damian Contant"}, {"name": "Maria Hellgren"}], "featured_authors": [{"name": "Damian Contant"}, {"name": "Maria Hellgren"}], "author_count": 2}, {"id": "2608.14153", "category": "cond-mat", "title": "Electrostatic Phenomenology Benchmarks for Machine-Learned Interatomic Potentials in Electrochemistry: Beyond the Energy-Force Metric", "abstract": "Accurate treatment of long-range interactions in machine learning interatomic potentials (MLIPs) is essential for electrochemical simulations. However, aggregate energy and force errors alone are insufficient to establish an MLIP's physical accuracy since they do not detect qualitative inconsistencies in the model such as the prediction of image-charge attraction, dielectric screening, or charge transfer. We introduce a benchmark suite EPhEct (Electrostatic Phenomena for Electrochemistry) of focused test cases designed to evaluate MLIPs on electrochemically relevant physical phenomena. The tests probe for image-charge attraction at a metal electrode, the splitting between longitudinal and transverse optical phonons as a probe of ionic and electronic screening, the dipole moment of interfacial water, and Fermi-level pinning during ion discharge. These tests establish a qualitative diagnostic routine complementary to aggregate energy-force metrics.", "url": "https://arxiv.org/abs/2608.14153", "type": "理论+数值", "summary": "1. 该工作针对电化学模拟中机器学习原子间势对长程静电相互作用的描述，提出了一套名为EPhEct的聚焦测试基准。\n2. 其技术卖点是以金属电极镜像电荷吸引、LO-TO声子劈裂、界面水偶极矩和离子放电费米能级钉扎等物理现象为定性判据，弥补能量-力聚合误差无法识别模型定性错误的不足。\n3. 该基准可作为与聚合误差指标互补的常规诊断工具，为修正MLIP的长程静电行为、推动电化学界面定量模拟提供基础。", "summary_source": "deepseek", "authors": [{"name": "Barbara Sumić"}, {"name": "Ria Vasdev"}, {"name": "Sudheesh Kumar Ethirajan"}, {"name": "Jing Yang"}, {"name": "Clotilde S. Cucinotta"}, {"name": "Richard G. Hennig"}, {"name": "Karsten Reuter"}, {"name": "Stefan Ringe"}, {"name": "Mira Todorova"}, {"name": "Christoph Freysoldt"}, {"name": "Jörg Neugebauer"}], "featured_authors": [{"name": "Barbara Sumić"}, {"name": "Ria Vasdev"}, {"name": "Sudheesh Kumar Ethirajan"}, {"name": "Mira Todorova"}, {"name": "Christoph Freysoldt"}, {"name": "Jörg Neugebauer"}], "author_count": 11}, {"id": "2608.14180", "category": "cond-mat", "title": "Topological phases and quantum criticality from $SU(2)$ Chern-Simons-matter theories", "abstract": "Motivated by recent numerical studies where various $SU(2)$ Chern-Simons-matter theories emerge, we analytically study topological phases and quantum criticality in two-dimensional systems described by such theories. First, we classify $SU(2)_k$ topological orders in all lattice spin systems with a $p4\\times SO(3)$ symmetry, where $k$ is an arbitrary nonzero integer. We find that for each odd $k$, the topological order can emerge in systems with an arbitrary Lieb-Schultz-Mattis (LSM) anomaly, and the symmetry cannot permute anyons. If the system has a nontrivial (respectively, trivial) LSM anomaly, then there is exactly one (respectively, nine) symmetry-enriched topological (SET) phases. On the other hand, $SU(2)_k$ topological order with any even $k$ can only emerge in systems with a trivial LSM anomaly. If $k\\notin\\{6, 10, 14, \\cdots\\}$, the symmetry cannot permute anyons, and there are 16 SET phases. If $k\\in\\{6, 10, 14, \\cdots\\}$, there are 4 different ways how the symmetry can permute anyons, and there are 64 SET phases. Next, we analyze the $SU(2)_k$ Chern-Simons theories coupled to $N_f$ flavors of gapless matter fields that can be either bosonic or fermionic. For both types of theories, we consider a joint large-$N_f$ and large-$k$ limit with $N_f/k$ fixed, and compute the scaling dimensions of the bilinear operators of the bosons or fermions to the order of $1/N_f$. These results sharpen our understanding of these emergent exotic topological phases and quantum criticality, and provide useful guidance to explore them further.", "url": "https://arxiv.org/abs/2608.14180", "type": "理论+数值", "summary": "1. 该工作解析研究了二维SU(2) Chern-Simons-matter理论中的拓扑相与量子临界，并分类了具有p4×SO(3)对称性的晶格自旋体系中SU(2)_k拓扑序的对称性富集拓扑相。\n2. 其核心在于给出任意非零整数k下SU(2)_k拓扑序与Lieb-Schultz-Mattis反常的相容性判据，证明k=6,10,14,…时可出现任意子置换，产生64种SET相，并在N_f/k固定的大N_f、大k极限下计算了双线性算符的1/N_f阶标度维度。\n3. 这深化了对涌现奇异拓扑相与量子临界的认识，为在数值模拟或实验平台中进一步探测此类SU(2)陈-西蒙斯物质理论提供了明确指引。", "summary_source": "deepseek", "authors": [{"name": "Yunchao Hao"}, {"name": "Yingcheng Li"}, {"name": "Kangle Li"}, {"name": "Liujun Zou"}], "featured_authors": [{"name": "Yunchao Hao"}, {"name": "Yingcheng Li"}, {"name": "Kangle Li"}, {"name": "Liujun Zou"}], "author_count": 4}, {"id": "2608.14292", "category": "cond-mat", "title": "Efficient simulation of second-order phase transitions in quantum anharmonic materials", "abstract": "When a crystal undergoes a second-order structural phase transition, such as in ferroelectrics, Peierls, and charge-density waves, the diverging fluctuations of the order parameter lead to the break- down of the standard phonon quasiparticle picture. Simulating these highly anharmonic regimes is notoriously challenging, as methods such as molecular dynamics suffer from a critical slowdown near the transition point, while the harmonic approximation fails dramatically at saddle points of the energy landscape stabilized by quantum or thermal ionic fluctuations. This work introduces a new approach, based on the variational free-energy principle, to predict critical long-range behavior and dynamical spectra in strongly anharmonic systems, even when quantum ionic fluctuations dominate. The proposed framework builds upon the stochastic self- consistent harmonic approximation but reduces its computational scaling with the number of atoms, N, from O(N^6) to O(N^2) and the memory requirement from O(N^4) to O(N). We benchmark the method on the prototypical lead-free metal-halide perovskite CsSnI3, a promising candidate for photovoltaic engineering, simulating its phase stability and Raman spectrum near the phase transition, where the breakdown of the quasiparticle picture becomes evident. We demonstrate the effectiveness of the method by computing the full free-energy Hessian and the critical temperature in a supercell with 1080 atoms. Such simulations would have required tens of thousands of years with the legacy approach; it is now feasible in a few hours on consumer hardware.", "url": "https://arxiv.org/abs/2608.14292", "type": "理论+数值", "summary": "1. 该工作提出了一个基于变分自由能原理的新框架，用于高效模拟量子离子涨落占主导的强非谐晶体中的二级结构相变，并选取无铅金属卤化物钙钛矿CsSnI3作为基准材料。\n2. 其核心技术亮点在于将随机自洽谐近似的计算复杂度由O(N^6)降到O(N^2)，内存需求由O(N^4)降到O(N)，从而在含1080原子的超胞中直接计算完整自由能Hessian和临界温度。\n3. 这使原本需数万年计算量的任务可在消费级硬件上数小时完成，为研究准粒子图像失效区域内的相变动力学及光伏钙钛矿等功能材料提供了可行且可扩展的新途径。", "summary_source": "deepseek", "authors": [{"name": "Andrea Baldanza"}, {"name": "Lorenzo Monacelli"}], "featured_authors": [{"name": "Andrea Baldanza"}, {"name": "Lorenzo Monacelli"}], "author_count": 2}, {"id": "2608.14383", "category": "cond-mat", "title": "Floquet Superlattices and Edge States in Graphene Nanoribbons", "abstract": "Structured light provides a route to imprint spatially patterned Floquet potentials onto quantum materials. As a particular example, we study a zigzag graphene nanoribbon driven by two coherent tilted beams, whose interference creates a periodic polarization pattern that gives rise to a photo-induced superlattice. The matching between the periodicity of the optical field and the nanoribbon width leads to two regimes in the quasienergy spectrum: matched profiles preserve degenerate edge branches, while mismatched profiles yield a boundary-induced gap that survives in wide ribbons. We propose a two-edge model that captures this splitting through residual hybridization and the boundary-sampled optical field. The quasienergy gap reverses between valleys, leading to a valley-selective boundary response. Our results establish light-induced superlattices as a flexible method for valley selectivity in finite-size Dirac-like materials through tunable edge-state quasienergy splitting.", "url": "https://arxiv.org/abs/2608.14383", "type": "理论", "summary": "1. 该工作理论研究了由两束相干倾斜光束干涉产生的周期性极化光场驱动锯齿石墨烯纳米带，发现光场周期与纳米带宽度的匹配决定弗洛凯准能谱的两类行为。\n2. 其卖点是提出双边缘模型，指出失配光场在边界处的采样使边缘态残余杂化并打开可在宽纳米带中存活的准能隙，且该能隙在谷间反向，产生谷选择性边界响应。\n3. 这为利用光诱导超晶格对有限尺寸狄拉克材料边缘态准能量劈裂进行可调控制，进而实现谷电子学器件提供了明确思路。", "summary_source": "deepseek", "authors": [{"name": "Siam Sarower"}, {"name": "Jonathon Dvorscak"}, {"name": "Nancy P. Sandler"}, {"name": "Mahmoud M. Asmar"}], "featured_authors": [{"name": "Siam Sarower"}, {"name": "Jonathon Dvorscak"}, {"name": "Nancy P. Sandler"}, {"name": "Mahmoud M. Asmar"}], "author_count": 4}, {"id": "2608.14476", "category": "cond-mat", "title": "A Fixed Universal Determinant is Variationally Complete for Continuum Fermions", "abstract": "How many Slater determinants does an accurate variational description of interacting fermions require? Exact expansions in a finite basis need combinatorially many, and state-of-the-art fermionic neural quantum states stack growing numbers of them. We prove that, in the norms that govern variational calculations, at most two are needed, independently of the number of particles and of the target accuracy. A single universal Slater determinant-specified in advance, independent of both the system and the state-multiplied by a smooth bosonic wave function approximates any fermionic wave function in up to three spatial dimensions in the first-order Sobolev norm, which controls the variational energy. Reaching the second-order Sobolev norm-for Coulomb interactions, the domain of the Hamiltonian, which bounds the variance of the local energy at the core of variational Monte Carlo-requires at most one additional fixed determinant, and only in three dimensions. Antisymmetry therefore costs at most two universal determinants and no expressiveness: generalized Slater-Jastrow neural quantum states are variationally complete.", "url": "https://arxiv.org/abs/2608.14476", "type": "理论+数值", "summary": "1. 该工作证明在至多三维连续空间中，任意相互作用费米子波函数可由单个预先指定的通用Slater行列式乘以光滑玻色型波函数，在一阶Sobolev范数下逼近，从而控制变分能量。\n2. 其核心在于严格表明反对称性最多只需两个通用行列式：若需进一步控制局域能量方差，即达到哈密顿量所在的二阶Sobolev范数，仅三维情形再增加一个固定行列式即可。\n3. 由此，广义Slater-Jastrow神经量子态具有变分完备性，为可扩展且不牺牲表达力的费米子变分蒙特卡罗方法奠定了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Giuseppe Carleo"}, {"name": "Riccardo Rossi"}], "featured_authors": [{"name": "Giuseppe Carleo"}, {"name": "Riccardo Rossi"}], "author_count": 2}, {"id": "2608.14480", "category": "cond-mat", "title": "Universal Signature of Hundness and Its Quantification", "abstract": "Hund's coupling $J$ induces fundamentally different correlation effects from Hubbard $U$. This leads to a violation of the Brinkman--Rice scenario and the emergence of a Janus-faced phase owing to its low-energy effectiveness, in which band renormalization is confined below a characteristic energy scale. We propose a quantitative framework to capture low-energy effectiveness through two correlation factors: $z_L$ for low-energy quasiparticle renormalization and $z_H$ for high-energy charge fluctuations, newly introduced in this study. The discrepancy between $z_L$ and $z_H$ reflects the Hund character of the correlation. By establishing a one-to-one correspondence between correlation factors and the spin and charge susceptibilities, we identify the spin-degree-of-freedom effectiveness as the microscopic origin of low-energy effectiveness. Our framework, validated across multiorbital models and real materials, provides a universal and quantitative measure of Hundness.", "url": "https://arxiv.org/abs/2608.14480", "type": "理论", "summary": "1. 该工作针对Hund耦合J与Hubbard U的差异，提出定量刻画低能有效性的关联因子框架，用z_L与z_H分别表征低能准粒子重整化与高能电荷涨落。\n2. 技术关键是发现z_L与z_H之差直接度量Hundness，并通过与自旋及电荷磁化率的一一对应，将自旋自由度有效性确立为低能有效性的微观起源，且已在多轨道模型和真实材料中验证。\n3. 这一框架为Hund金属等Janus-faced相的诊断提供了普适量化工具，也为关联电子体系的理论分类与材料预测建立了可操作基准。", "summary_source": "deepseek", "authors": [{"name": "Dongwook Kim"}, {"name": "Ina Park"}, {"name": "Bo Gyu Jang"}, {"name": "Ji Hoon Shim"}], "featured_authors": [{"name": "Dongwook Kim"}, {"name": "Ina Park"}, {"name": "Bo Gyu Jang"}, {"name": "Ji Hoon Shim"}], "author_count": 4}, {"id": "2608.14489", "category": "cond-mat", "title": "Quasi-periodicity enforces Berry phase discontinuity in crystals", "abstract": "The Berry phase of an isolated electronic state is evaluated for different integration paths in reciprocal space, thanks to Riemann-Bloch states providing a consistent description in the whole Brillouin zone. The relationship with the bounded position operator is investigated for the open-path Berry phase and with different form factors of the constituent Gaussian type atomic orbitals (GTOs). When the Berry phase is evaluated over a closed loop in reciprocal space, a regularisation procedure in the complex plane is adopted and additional \\textit{quasi}-symmetries are exploited here for the first time in order to rationalise the occurrence of non-analytical jumps as a function of the winding number or of the GTO broadening.", "url": "https://arxiv.org/abs/2608.14489", "type": "理论+数值", "summary": "1. 该工作利用Riemann-Bloch态在全布里渊区一致描述孤立电子态，系统考察不同倒空间积分路径下Berry相位及其与有界位置算符的关系。\n2. 其技术卖点是引入复平面正规化并首次利用准对称性，阐明Berry相位作为绕数或高斯型轨道展宽函数的非解析跳变机制。\n3. 这为理解准周期性与几何相位奇异性之间的联系，以及第一性原理计算中Berry相位的稳定处理提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Emanuele Maggio"}], "featured_authors": [{"name": "Emanuele Maggio"}], "author_count": 1}, {"id": "2608.14508", "category": "cond-mat", "title": "Universal aspects of bulk density of states in non-Hermitian lattices", "abstract": "Non-Hermitian lattice Hamiltonians generally exhibit strong boundary sensitivity, with periodic and open boundary conditions producing distinct density of states (DOS) in the complex-energy plane. This has led to the view that extended non-Hermitian systems lack a unique bulk DOS, with different prescriptions representing inequivalent bulk physics. Here, we show that this apparent ambiguity is largely illusory. For any finite-range tight-binding Hamiltonian, we establish a universal bulk structure: all DOS definitions arising as thermodynamic limits of finite systems share identical multipole moments and generate identical bulk dynamics at finite times and for observables measured far from boundaries. This universality is intimately tied to the thermodynamic Green's functions, which we show to be independent of the boundary condition for large enough complex frequencies. Among all equivalent descriptions, we identify the Brown measure - obtained via Hermitization and resolvent analysis - as a canonical and convenient representative of the bulk DOS, defined directly from the infinite-volume Hamiltonian. We further show that point-gap topology imposes additional universal constraints: boundary-dependent Green's functions are forced to coincide throughout topologically trivial point gaps. This, in particular, provides a systematic criterion, valid in arbitrary dimension, for determining where and how eigenvalues of different boundary truncations can accumulate in the complex plane, and precisely delineates the regime in which the DOS ambiguity retains physical significance.", "url": "https://arxiv.org/abs/2608.14508", "type": "理论", "summary": "1. 该工作建立了非厄米格点紧束缚模型体态密度的普适结构，证明热力学极限下不同边界方案对应的态密度具有相同多极矩，并产生相同的有限时间体动力学。\n2. 其技术核心是证明热力学格林函数在大复频率极限下独立于边界条件，从而将布朗测度确立为体态密度的规范代表，并进一步由点隙拓扑导出边界依赖格林函数在拓扑平凡点隙内必须重合。\n3. 该结果在任意维度上给出了不同边界截断本征值在复平面上累积位置的系统判据，同时精确划定了态密度模糊性仍具物理意义的边界。", "summary_source": "deepseek", "authors": [{"name": "Mykhailo Pavliuk"}, {"name": "Askar Iliasov"}, {"name": "Emil J. Bergholtz"}, {"name": "Tomáš Bzdušek"}], "featured_authors": [{"name": "Mykhailo Pavliuk"}, {"name": "Askar Iliasov"}, {"name": "Emil J. Bergholtz"}, {"name": "Tomáš Bzdušek"}], "author_count": 4}, {"id": "2608.14535", "category": "cond-mat", "title": "Skyrmion Fractional Chern Insulator: An Intrinsically Multiband Route to Fractionalization in Rhombohedral Graphene", "abstract": "We propose an unconventional microscopic origin for the fractional quantum anomalous Hall (FQAH) effect in rhombohedral graphene moiré superlattices: skyrmion fractionalization. We view the state at filling $\\nu<1$ as a metal of skyrmion vacancies, charge $+e$ objects formed by removing layer-pseudospin skyrmions from the interaction-generated skyrmion lattice Chern insulator at $\\nu=1$. These vacancies are intrinsically multiband degrees of freedom, absent in single Chern band-projected studies. Building on a recently proposed ideal limit, we first develop an effective field theory showing that skyrmion vacancies can themselves fractionalize, thereby inducing charge fractionalization. Focusing on $\\nu=\\frac{2}{3}$, we then construct explicit variational trial wavefunctions for the resulting skyrmion fractional Chern insulator and provide numerical evidence, together with general arguments, showing that this process is energetically favored. Our results establish a realistic route to the FQAH that does not rely on a partially filled Chern band, but instead arises from fractionalization of collective pseudospin textures.", "url": "https://arxiv.org/abs/2608.14535", "type": "理论+数值", "summary": "1. 该工作提出菱方石墨烯莫尔超晶格中分数量子反常霍尔效应的一种非常规微观起源：层赝自旋斯格明子的分数化。\n2. 其核心卖点在于将ν<1态理解为相互作用生成的ν=1斯格明子晶格Chern绝缘体移除斯格明子后形成的带正电空穴金属，空穴为本质多带自由度，并在ν=2/3构造变分波函数给出数值证据。\n3. 这为无需部分填充Chern带的FQAH机制提供了可行路线，可启发在多层石墨烯及其他莫尔平台中探测由集体赝自旋纹理诱导的分数化现象。", "summary_source": "deepseek", "authors": [{"name": "Julian May-Mann"}, {"name": "Tixuan Tan"}, {"name": "Patrick J. Ledwith"}, {"name": "Zhengyan Darius Shi"}, {"name": "Trithep Devakul"}], "featured_authors": [{"name": "Julian May-Mann"}, {"name": "Tixuan Tan"}, {"name": "Patrick J. Ledwith"}, {"name": "Zhengyan Darius Shi"}, {"name": "Trithep Devakul"}], "author_count": 5}, {"id": "2608.13643", "category": "hep-th", "title": "Quasinormal modes as exterior probes of black hole interiors in our Universe", "abstract": "We consider a scenario in which a black hole is enclosed in a reflecting timelike cavity and linearly perturbed. For the resulting quasinormal spectra of gravitational, electromagnetic, and other perturbations, in conjunction with our arXiv:2606.11297 , we establish a thermal product formula and derive a universal asymptotic expression for high quasinormal overtones. Both results hold in asymptotically flat, de Sitter, and Anti-de Sitter spacetimes (known previously). This spectral signature directly encodes information about the black hole interior and its singularity, and is, at least in principle, accessible to an observer outside the event horizon. We then propose a concrete observational setup in which accreting plasma plays the role of a partially transmissive mirror. For small, hypothetical, primordial black holes, we argue that one may thereby be able to extract concrete information about the black hole interior from electromagnetic waves in the radiowave spectrum.", "url": "https://arxiv.org/abs/2608.13643", "type": "理论", "summary": "1. 该工作研究置于反射类时腔中的黑洞受线性扰动后的拟正规模谱，并给出热乘积公式与高频泛音的普适渐近表达式。\n2. 其核心在于证明谱特征直接编码黑洞内部及奇点信息，且在渐近平坦、德西特与反德西特时空中均成立，原则上可被视界外观测者读取。\n3. 该结果启发利用吸积等离子体作为部分透射镜，有望从原初小质量黑洞的射电波段电磁波中提取其内部结构的可观测信息。", "summary_source": "deepseek", "authors": [{"name": "Sašo Grozdanov"}, {"name": "Vita Movrin"}, {"name": "Samuel Valach"}], "featured_authors": [{"name": "Sašo Grozdanov"}, {"name": "Vita Movrin"}, {"name": "Samuel Valach"}], "author_count": 3}, {"id": "2608.13647", "category": "hep-th", "title": "Localizing Momentum Waves on Mazes", "abstract": "We examine the proposal and analysis of arXiv:2404.14477 for putting momentum waves on mazes of intersecting M2 and M5 branes by computing a family of simple examples of momentum waves on pure M5 branes. We re-analyze the BPS equations for the near-brane M5-P system with the prescribed supersymmetry structure of the full M2-M5-P system and show that the general linear system obtained in arXiv:2404.14477 captures all of the null momentum waves on the simpler M5-P system. Despite the absence of explicit M2 branes in our examples, we find that the momentum waves still localize on an AdS$_3$ factor of the AdS$_7$ associated with M5 branes, showing that the supersymmetry prescription still reflects the M2-M5-P structure. This momentum localization takes two forms: explicit singular sources and smooth, localized bump functions reflecting ''momentum migration'' that is a feature of other microstate geometries. The simple, physical form of the momentum localization in our examples supports the broader proposal in arXiv:2404.14477 that independent momentum waves can localize at each brane intersection. We suggest further generalizations of momentum waves at brane intersections that could have important implications in holography.", "url": "https://arxiv.org/abs/2608.13647", "type": "理论", "summary": "1. 该工作通过计算纯M5膜上动量波的简单实例，检验了在交织M2与M5膜迷宫中局域化动量波的提议。\n2. 其核心在于重审近膜M5-P系统的BPS方程，证明完整M2-M5-P超对称结构导出的线性系统已捕获该简单系统中所有零动量波；尽管无显式M2膜，动量波仍局域于AdS7中与M5膜关联的AdS3因子，并呈现奇异源与光滑bump两类形式。\n3. 这一结果支持独立动量波可在各膜交点局域化的更广泛设想，并启发在膜交点构造推广的动量波以探索全息对偶中的新关联。", "summary_source": "deepseek", "authors": [{"name": "Tobi Ramella"}, {"name": "Nicholas P. Warner"}], "featured_authors": [{"name": "Tobi Ramella"}, {"name": "Nicholas P. Warner"}], "author_count": 2}, {"id": "2608.13731", "category": "hep-th", "title": "Properties of holographic superconductors from Machine Learning", "abstract": "We investigate holographic superconductors using modern optimisation techniques inspired by machine learning. The critical temperature is obtained by minimising the variational functional for the eigenvalue $\\lambda^2$ with two complementary trial functions: a simple cosine ansatz $F(z)=\\cos(a z)$ and a flexible exponential polynomial $F(z)=\\exp(\\sum_{n=2}^{N} a_n z^n)$, both of which automatically satisfy the standard boundary conditions. For the cosine ansatz, we perform a one-parameter minimisation and obtain $\\lambda^2(\\Delta)$ and $T_c/\\sqrt{\\rho}$ over a wide range of $\\Delta$, including the exact values at $\\Delta=1$ and $\\Delta=2$ to high accuracy. The exponential polynomial ansatz, with up to 19 coefficients, is optimised using a multi-start L-BFGS-B algorithm with warm-starting, yielding even better agreement with known exact results. Our numerical data for $\\lambda^2(\\Delta)$ and $T_c/\\sqrt{\\rho}$ match the analytical predictions from the literature, confirming the robustness of the variational approach. This work; therefore, demonstrates that a combination of analytic trial functions and modern numerical optimisation provides a powerful, flexible, and efficient tool for exploring holographic superconductors, and can be readily extended to include backreaction or other sectors in this field.", "url": "https://arxiv.org/abs/2608.13731", "type": "理论", "summary": "1. 该工作利用机器学习启发的变分优化方法研究全息超导体，通过最小化特征值λ²的泛函获得临界温度Tc/√ρ。\n2. 其技术核心是使用余弦与指数多项式两类试探波函数，自动满足边界条件，并以多起点L-BFGS-B算法配合热启动优化多达19个系数，高精度复现已知解析结果。\n3. 该方法可自然扩展至包含反作用或其他扇区，为全息超导体及相关模型提供灵活高效的变分研究工具。", "summary_source": "deepseek", "authors": [{"name": "Aliou Togo"}, {"name": "Yang Yu"}, {"name": "Kaniba Mady Keita"}, {"name": "Jian-Pin Wu"}, {"name": "Younouss Ham`eye Dicko"}], "featured_authors": [{"name": "Aliou Togo"}, {"name": "Yang Yu"}, {"name": "Kaniba Mady Keita"}, {"name": "Jian-Pin Wu"}, {"name": "Younouss Ham`eye Dicko"}], "author_count": 5}, {"id": "2608.13776", "category": "hep-th", "title": "Dependence of Critical Exponents Accuracy on the Number of Fields in the O(N) -Invariant ϕ^4 Model", "abstract": "The study of large-$N$ cases of the $O(N)$-symmetric model at criticality has attracted significant attention in recent years. In particular, a recent high-precision Monte Carlo study ( Physical Review B 105, 054428 (2022)) reported the most accurate estimates to date for the critical exponents $\\nu$, $\\eta$, and $\\omega$ for $N \\ge4$. Within the framework of the renormalization group (RG)---the cornerstone of the modern theory of critical phenomena---powerful computational approaches such as the $\\varepsilon$-expansion and non-perturbative RG are available. Since the effective expansion parameter in the $\\varepsilon$-expansion, $\\sigma = \\frac{3}{N+8}$, decreases with increasing N, one expects resummation techniques to become progressively more accurate in the large-N regime. To test this expectation, we apply the entire-hypergeometric resummation algorithm developed by Shalaby et al. to the recently obtained seven-loop divergent $\\varepsilon$-series for $N \\ge 4$, yielding high-precision estimates for $\\nu$, $\\eta$, and $\\omega$ . Our analysis confirms the anticipated improvement in accuracy with increasing N. To assess the significance of these results, we note that at the same seven-loop order the $O(2)$ case exhibits errors that are an order of magnitude larger than those obtained from experiment, Monte Carlo simulations, and conformal-field-theory analysis. In contrast, for sufficiently large N, the errors in the present work are of the same order of magnitude as those from Monte Carlo and non-perturbative RG methods, demonstrating the strong predictive power of our resummation approach in the large-N regime.", "url": "https://arxiv.org/abs/2608.13776", "type": "理论", "summary": "1. 该工作利用整超几何重求和算法处理 O(N) 对称 ϕ^4 模型的七圈 ε 展开，给出 N≥4 情形临界指数 ν、η、ω 的高精度估计。\n2. 其技术卖点在于证实重求和精度随场分量数 N 增加而提高：N 足够大时误差与蒙特卡洛及非微扰重正化群结果同量级，而 O(2) 同阶误差大一个量级。\n3. 这表明 ε 展开重求和在大 N 极限下具有强预测能力，可为大 N 临界指数提供独立于数值模拟的可靠交叉检验。", "summary_source": "deepseek", "authors": [{"name": "Abouzeid M. Shalaby"}], "featured_authors": [{"name": "Abouzeid M. Shalaby"}], "author_count": 1}, {"id": "2608.13801", "category": "hep-th", "title": "Unfolding the Exotic Supergravity Multiplet", "abstract": "We provide an unfolded formulation of linearised 6D exotic supergravity with manifest superconformal symmetry including conformal duality transformations. The construction is based on a superoscillator realisation of the metaplectic supergroup $MOSp(16|16)$ containing the Howe dual pair $MOSp(8^\\ast|8)\\times SU(2)$. Exotic graviton potentials arise in conformally dual pairs of two-forms in direct products of $SU(2)$-triplets and supertraceless graded-symmetric rank-two supertensors of $OSp(8^\\ast|8)$ generated from a hypercharge by the supercharges, providing an analogue of the adjoint representation of $\\mathfrak{psu}(2,2|4)$. The potentials are sourced via relative Chevalley-Eilenberg cocycles by a conformally dual pair of chiral and anti-chiral Weyl zero-forms valued in $SO(1,1)\\times Spin(1,5)\\times USp(8)$-covariant monomorphic restrictions of an extended supersingleton, i.e., an infinite-dimensional $SU(2)$-invariant Hermitian left-module of $MOSp(8^\\ast|8)$ containing various irreps associated with different boundary conditions, including the unitarizable exotic supergravity multiplet. Two natural quadratic observables are i) an on-shell closed zero-form built from the chiral Weyl zero-form and its dual, akin to the on-shell value of the second Chern class on the internal twistor $Z$-space of 4D Vasiliev systems; and ii) an off-shell topological six-form built from the conformally dual pair of two-form potentials, reducing on-shell to a generating function for chiral two-point functions in super-Poincaré backgrounds.", "url": "https://arxiv.org/abs/2608.13801", "type": "理论", "summary": "1. 该工作给出了线性化六维奇异超引力的展开形式表述，使超共形对称性与共形对偶变换得以明显实现。\n2. 其核心是基于MOSp(16|16)的超振子实现及其Howe对偶，将奇异引力子势构造为SU(2)三重态与超无迹对称二阶超张量构成的共形对偶二形式对，并由手征/反手征Weyl零形式的相对Chevalley-Eilenberg上闭链提供源。\n3. 文中的闭式零形式和离壳拓扑六形式分别类比四维Vasiliev系统的扭量Z空间第二陈类与手征两点函数生成函数，为高维展开形式和全息研究提供了新工具。", "summary_source": "deepseek", "authors": [{"name": "Carlo Iazeolla"}, {"name": "Per Sundell"}, {"name": "Brenno Carlini Vallilo"}], "featured_authors": [{"name": "Carlo Iazeolla"}, {"name": "Per Sundell"}, {"name": "Brenno Carlini Vallilo"}], "author_count": 3}, {"id": "2608.13943", "category": "hep-th", "title": "Investigation of the black-hole quantum atmosphere from the effective proper temperature", "abstract": "Hawking radiation may be regarded as originating at the event horizon; however, its spatial origin can instead be distributed over a finite region outside the horizon. In this paper, using an effective proper temperature, we investigate the quantum atmosphere within a tractable model based on the two-dimensional radial sector of $D$-dimensional Schwarzschild black holes. In the Hartle--Hawking state, the proper temperature is derived from the first law of thermodynamics in the presence of the conformal anomaly associated with Hawking radiation. In the Unruh state, we decompose the proper temperature into two chiral temperatures, $T_{\\rm L}$ and $T_{\\rm R}$, associated with the ingoing and outgoing fluxes, respectively. Demonstrating $T_{\\rm R}$ as the effective proper temperature characterizing the outgoing Hawking flux with the proper temperature in the Hartle-Hawking state, we define the atmospheric radius effectively as the radial position at which the effective proper temperature attains its maximum. We then numerically compute the atmospheric radius of the quantum atmosphere for various spacetime dimensions and show that it decreases monotonically as the number of spacetime dimensions increases. In the large-dimensional limit, we find that the atmospheric radius remains separated from the horizon by a finite radial factor, indicating that the quantum atmosphere can persist as an extended exterior region in any dimension.", "url": "https://arxiv.org/abs/2608.13943", "type": "理论", "summary": "1. 该工作利用有效固有温度研究D维史瓦西黑洞的量子大气，在可解二维径向模型中考察霍金辐射的空间起源。\n2. 其要点是由含共形反常的第一定律在Hartle-Hawking态确定固有温度，并在Unruh态将其分解为左右手征温度，以描述出射霍金通量的T_R定义有效固有温度及大气半径。\n3. 数值结果显示大气半径随维数单调下降，但在大维极限仍与视界保持有限距离，表明任意维数下量子大气均可作为扩展外部区域存在。", "summary_source": "deepseek", "authors": [{"name": "Sojeong Cheong"}, {"name": "Wontae Kim"}], "featured_authors": [{"name": "Sojeong Cheong"}, {"name": "Wontae Kim"}], "author_count": 2}, {"id": "2608.14193", "category": "hep-th", "title": "Dirac, Majorana, and Weyl Spinors in Arbitrary Dimension and Signature", "abstract": "Fermionic field types in arbitrary signature are often inferred from complex Spin representations alone, which obscures distinctions associated with real structures, disconnected spacetime reflections, and action-level bilinear constraints. We give a convention-explicit classification that treats the full real Clifford algebra and its even subalgebra separately, thereby distinguishing pinors from spinors and Pin-equivariant Majorana-type structures from structures that are only Spin-equivariant. Adjoint, complex-conjugation, and transposition intertwiners are combined with elementary and collective reflection lifts into a unified sign calculus. The resulting local Clifford classification is organised into thirty-two periodicity sectors determined by the Bott class and the total dimension modulo eight, without including theory-dependent gauge, anomaly, or global constraints. For each sector, we identify the available Dirac, Weyl, Majorana, symplectic Majorana, Majorana-Weyl, and symplectic Majorana-Weyl fields. The existence of an invariant pairing is distinguished from intertwiner compatibility, Grassmann and chiral selection rules, covariant index contraction, and Hermiticity of local bilinear operators.", "url": "https://arxiv.org/abs/2608.14193", "type": "理论", "summary": "1. 该工作针对任意维数与时空号差，系统分类了 Dirac、Weyl、Majorana、辛 Majorana 及相应手征组合等费米子场类型。\n2. 技术要点是将完整实 Clifford 代数与其偶子代数分开处理，严格区分 pinor 与 spinor、Pin 等变与仅 Spin 等变结构，并借助 Bott 类与总维数模 8 将局部分类归入三十二个周期扇区。\n3. 该分类厘清了双线性算子的不变配对与交错子兼容性、手征选择规则及厄米性等约束，为后续纳入规范、反常和整体限制的模型提供了可靠起点。", "summary_source": "deepseek", "authors": [{"name": "Jan Hajer"}], "featured_authors": [{"name": "Jan Hajer"}], "author_count": 1}, {"id": "2608.14267", "category": "hep-th", "title": "Classical gravitational scattering with a massive scalar mediator", "abstract": "We consider the classical scattering of two gravitating compact objects in the presence of a massive scalar mediator, providing a simple model of exotic phenomena. Through dimensional analysis, we argue that such a process can only be classical in the presence of gravity, a consequence of which is that perturbing in the coupling of the scalar to a worldline is not separate from the post-Minkowskian expansion. When computing asymptotic observables, the massive mediator complicates the Fourier transforms to impact-parameter space at next-to-leading order. We reduce these to univariate parametric integrals - amenable to numerical integration - and produce analytic results for the linear impulse and the scattering angle to the second post-Minkowskian order. The scattering angle exhibits a resonance when the range of the scalar-mediated force is comparable to the impact parameter, offering a distinctive signature of a massive mediator. In the opposite, large-mass regime we uncover a screening effect: the scalar cloud sourced by each compact object carries negative energy, reducing its gravitational mass by an amount linear in the scalar's mass. Both of these phenomena are next-to-leading-order effects.", "url": "https://arxiv.org/abs/2608.14267", "type": "理论", "summary": "1. 该工作研究了有质量标量中介子存在下两个致密天体经典引力散射，并给出线性冲量与散射角至第二后闵可夫斯基阶的结果。\n2. 其技术核心是将次领头阶的碰撞参数空间傅里叶变换化为单变量参数积分，并发现散射角在标量力程与碰撞参数相当处出现共振，以及大质量极限下负能量标量云使引力质量线性减小。\n3. 这为从引力散射观测中识别有质量标量场等奇异相互作用提供了特征信号，也表明标量耦合微扰与后闵可夫斯基展开不可分离这一结构性质。", "summary_source": "deepseek", "authors": [{"name": "Birgitta Biendarra"}, {"name": "Kays Haddad"}, {"name": "Jan Plefka"}], "featured_authors": [{"name": "Birgitta Biendarra"}, {"name": "Kays Haddad"}, {"name": "Jan Plefka"}], "author_count": 3}, {"id": "2608.14308", "category": "hep-th", "title": "Information Spreading in Diffusion Models from Effective Field Theory", "abstract": "We study score-matching diffusion models with a convolutional architecture. We argue that the inductive bias of locality means that the machinery of effective field theory from physics can be usefully applied to describe the denoising dynamics. We apply this formalism first to a simple toy example which permits an analytical description, and thereafter to MNIST, and show that in both cases, the mutual information between two points grows in a manner predicted by a simple effective field theory of Brownian motion.", "url": "https://arxiv.org/abs/2608.14308", "type": "理论", "summary": "1. 该工作研究卷积架构的得分匹配扩散模型，主张将物理中的有效场论框架引入其去噪动力学，以刻画信息如何在生成过程中传播。\n2. 其技术卖点在于利用卷积局域性的归纳偏差，将两点之间互信息随时间的增长映射为布朗运动有效场论的预言，并在可解析的玩具模型与MNIST数据上获得定量验证。\n3. 这一物理视角为扩散模型的信息传播机制提供了简洁的解析描述，并为其他深度生成模型或深层网络动力学的理论研究提供了可借鉴的框架。", "summary_source": "deepseek", "authors": [{"name": "Navonil Neogi"}, {"name": "Nabil Iqbal"}], "featured_authors": [{"name": "Navonil Neogi"}, {"name": "Nabil Iqbal"}], "author_count": 2}, {"id": "2608.14384", "category": "hep-th", "title": "Large lumps", "abstract": "We introduce a procedure to obtain lump solutions via the formation of a kink-antikink pair, consisting of the superposition of kinks whose distance from the origin is controlled by a single parameter $a$. For large values of $a$, a wide plateau appears in the solution, which we call a large lump. The procedure involves the use of a first-order equation that allows the construction of the potential associated with the lump solution. We then investigate several known scalar field models where the parent kinks are capable of giving rise to novel lumps. The lump inherits the tails of the parent kink, allowing for either short-range exponential profiles or long-range profiles characterized by distinct power-law decays. We also show how to verify if an arbitrary lump solution can be obtained via our method and illustrate this possibility with a novel vacuumless lump.", "url": "https://arxiv.org/abs/2608.14384", "type": "理论", "summary": "1. 该工作提出通过单参数 \\(a\\) 控制kink反kink对叠加，并借助一阶方程构造对应势能的方法，从而获得具有宽平台的新型大lump解。\n2. 其技术要点在于lump继承母kink的尾部行为，可实现指数短程或幂律长程衰减，同时给出判定任意lump是否可由该方法构造的判据及无真空lump实例。\n3. 这为标量场论中局域孤子的系统生成与分类提供了可操作框架，并可能启发对其他维度及相互作用模型中复合孤子的研究。", "summary_source": "deepseek", "authors": [{"name": "D. Bazeia"}, {"name": "I. Bezerra"}, {"name": "M.A. Marques"}, {"name": "R. Menezes"}], "featured_authors": [{"name": "D. Bazeia"}, {"name": "I. Bezerra"}, {"name": "M.A. Marques"}, {"name": "R. Menezes"}], "author_count": 4}, {"id": "2608.14449", "category": "hep-th", "title": "The Phase Space of Gravity on Null Hypersurfaces", "abstract": "We construct the bulk kinematical Poisson structure of general relativity on a caustic-free null segment, prior to imposing the Raychaudhuri and Damour constraints. We first show that shifts of the Ehresmann connection, also known as Carroll boosts, are pure gauge in gravity. This allows the Ehresmann connection to be fixed as a background structure and leads to the prime phase space of null gravitational data. The resulting phase space comprises of a spin-0 pair that includes the area and its conjugate, a spin-1 pair including the null direction and its conjugate, and the spin-2 sector encoded in the unimodular transverse metric. We then construct the brackets through a three-stage Dirac reduction implementing a normalization, horizontality, and shear constraints. We find that the spin-2 bracket is non-local and involves an antisymmetric Green kernel for a first-order transport operator along the null generators. The self-brackets of the spin-0 and spin-1 momenta involve, respectively, the vertical and horizontal derivatives of the transverse metric contracted with the spin-2 propagator. We finally provide an independent derivation of the brackets from the explicit realization of the Hamiltonian vector fields of the symplectic form. These results provide the classical canonical arena for studying the null constraint algebra, observables, and quantization.", "url": "https://arxiv.org/abs/2608.14449", "type": "理论", "summary": "1. 该工作在无焦散零切片上构建了广义相对论的体相空间运动学泊松结构，并在施加Raychaudhuri与Damour约束前完成。\n2. 其技术核心是将Ehresmann联络的Carroll平移视为纯规范并固定为背景，经归一化、水平性与剪切约束的三阶段Dirac约化，得到面积、零方向及单模横度规对应的自旋0、1、2扇区，其中自旋2括号非定域且含反对称格林核。\n3. 这为零约束代数、可观测量的经典正则描述及后续量子化研究提供了直接的正则舞台。", "summary_source": "deepseek", "authors": [{"name": "Luca Ciambelli"}, {"name": "Laurent Freidel"}, {"name": "Robert G. Leigh"}], "featured_authors": [{"name": "Luca Ciambelli"}, {"name": "Laurent Freidel"}, {"name": "Robert G. Leigh"}], "author_count": 3}, {"id": "2608.14451", "category": "hep-th", "title": "Four-point functions, Twistors and Supersymmetry in the Symplectic Bi-Grassmannian for CFT$_4$ and AdS$_5$", "abstract": "We initiate the study of four point functions in the symplectic bi-Grassmannian framework for four dimensional conformal field theories. We derive factorization formulae analogous to those for scattering amplitudes and bootstrap several examples of AdS$_5$ exchange correlation functions involving scalars, photons, fermions, gluons and gravitons. These correlators are rational functions of the minors of the Grassmannian matrices in contrast to their momentum space counterparts which are much more complicated. We then develop the $GL(2,\\mathbb{R})$ twistor space formalism, deriving the Penrose transform and the twistorial Grassmannian where we find remarkably simple expressions. We also find an elegant and natural extension to $\\mathcal{N}=1$ supersymmetry, deriving the supersymmetric Penrose transform and the super-twistor Grassmannian. Performing a half-Fourier transform from twistor space, we derive the supersymmetric symplectic bi-Grassmannian corresponding to spinor-helicity variables. We test our formalism in the context of AdS$_5$ $\\mathcal{N}=1$ super-Yang Mills theory where we impose consistent factorization and input the bootstrapped four-fermion correlator to obtain those involving gluons, scalars and fermions. Finally, we discuss the application to supergravity theories.", "url": "https://arxiv.org/abs/2608.14451", "type": "理论", "summary": "1. 该工作针对四维共形场论引入辛双格拉斯曼框架，推导四点半函数类散射振幅的因子化公式，并bootstrap了AdS5交换标量、光子、费米子、胶子与引力子的关联函数。\n2. 核心卖点是关联函数可表示为格拉斯曼矩阵子式的有理函数，同时发展GL(2,R)扭量空间及Penrose变换，并自然推广至N=1超对称，导出超扭量格拉斯曼与半傅里叶变换下的自旋螺旋辛双格拉斯曼。\n3. 通过在AdS5 N=1超Yang-Mills中由四费米子关联函数生成含胶子、标量与费米子的结果并讨论超引力应用，为超共形关联函数与振幅方法交叉提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Dhruva K.S"}], "featured_authors": [{"name": "Dhruva K.S"}], "author_count": 1}, {"id": "2608.14463", "category": "hep-th", "title": "Static and Dynamic perturbations of scalar DBI analogue of a black hole", "abstract": "Perturbations around a spherically symmetric solution of the scalar Dirac-Born-Infeld (DBI) theory obey the equation of motion of a massless scalar field in a curved background with black hole-like properties like finite temperature and an event horizon with zero speed of propagation of information (a black hole analogue). After reviewing some properties of the background geometry for the propagations, we investigate the solutions considering static and dynamic regimes. In the former case we obtain the so-called Love numbers, or more generally scalar polarizability. In the latter case, we employ boundary conditions analogous to the computation of quasi-normal modes, and argue that the background geometry acts as a classical high-pass filter. We therefore provide further evidence that the scalar black hole analogues can be analyzed similarly to a black hole.", "url": "https://arxiv.org/abs/2608.14463", "type": "理论", "summary": "1. 该工作研究了标量DBI理论球对称解的静态与动态微扰，并将其事件视界与有限温度视为黑洞类比背景。\n2. 静态情形下计算了Love数（标量极化率）；动态情形采用类似拟正规模的边界条件，揭示背景几何可作为经典高通滤波器。\n3. 这为利用标量黑洞类比在实验室模拟引力系统提供了进一步支持，也拓展了响应函数与拟正规模方法在类比模型中的应用。", "summary_source": "deepseek", "authors": [{"name": "Pedro Meert"}, {"name": "Horatiu Nastase"}], "featured_authors": [{"name": "Pedro Meert"}, {"name": "Horatiu Nastase"}], "author_count": 2}, {"id": "2608.14512", "category": "hep-th", "title": "Towards a Non-Perturbative Classical Double Copy", "abstract": "We construct an exact solution-generating correspondence between restricted ansatz sectors of quartic biadjoint scalar theory, complexified $SU(2)$ Yang--Mills theory and four-dimensional general relativity with conformally flat metrics and traceless energy-momentum. A factorised biadjoint field, a Corrigan--Fairlie--'t Hooft--Wilczek gauge potential and a conformal metric are generated by a common scalar seed. Their equations of motion reduce to the same equation of motion under the identification of couplings, which retains the nonlinear dynamics on all three legs of the correspondence. The scalar equation captures only the trace of the Einstein equations; deriving the trace-free part of the Einstein equation additionally yields a source relation between Gravity and Yang-Mills. From this, we construct a non-perturbative classical double copy for the restricted ansatz sectors between quartic biadjoint scalar theory, $SU(2)$ Yang--Mills theory and gravity. We illustrate the dictionary of mappable solutions with rational and constant profiles representing $AdS_4$, planar $dS_4$ and Minkowski space, and with Jacobi-elliptic profiles generating a positive-energy recollapsing branch for negative cosmological constant and a negative-energy bouncing branch for positive cosmological constant. Using these results, we provide a new example of the Kerr-Schild double copy.", "url": "https://arxiv.org/abs/2608.14512", "type": "理论", "summary": "1. 该工作建立了四双伴随标量理论、复化SU(2)杨-米尔斯理论与具有无迹能动张量的共形平坦引力在受限ansatz扇区间的精确解生成对应。\n2. 其核心在于耦合常数识别下三套运动方程约化为同一标量种子方程并保留非线性动力学；再由爱因斯坦方程无迹部分导出引力-杨-米尔斯源关系，给出涵盖AdS4、dS4、闵氏时空及Jacobi椭圆解的完整映射字典。\n3. 这为经典双拷贝提供了非微扰范例，并给出Kerr-Schild双拷贝的新实例，有望推广至更一般的时空与场论构型。", "summary_source": "deepseek", "authors": [{"name": "Kymani Armstrong-Williams"}], "featured_authors": [{"name": "Kymani Armstrong-Williams"}], "author_count": 1}, {"id": "2608.14541", "category": "hep-th", "title": "Building a Quantum Black Hole Microstate: A Bulk Path Integral for a Heavy Virasoro Primary", "abstract": "Consider level-$k$ $SL(2,R) \\times SL(2,R)$ Chern-Simons theory on a semi-infinite solid cylinder, with a Wilson line in the unitary principal continuous series inserted along the time direction at the center of the spatial disc. We argue that at the $\\tau=0$ cut, this Euclidean path integral prepares the bulk dual of a heavy Virasoro primary above the BTZ threshold, with Drinfel'd-Sokolov (DS) reduction playing a crucial role in converting the affine module into a Virasoro module. Semi-classically, the DS constraint turns into the DS gauge, familiar from asymptotically AdS$_3$ gravity. Together with boundary gravitons, these primaries provide a bulk construction of BTZ black hole microstates at finite $k$. In the large-$k$ WKB limit, the saddle that controls an $individual$ primary is the BTZ black hole with a $singular$ horizon. We study the (grand-)canonical partition function of the microstates with density of states dictated by modular invariance. The temperature and chemical potential then fix the holonomy saddle to be the Euclidean BTZ black hole with a $smoothly$ contractible thermal cycle. A density of heavy primaries growing as $e^{2\\pi\\gamma QP}$ would instead lead to a defect (or excess) saddle, except at the Cardy value $\\gamma=1$ fixed by modular invariance. After analytic continuation, the eternal Lorentzian black hole with a smooth horizon is therefore not just any thermal ensemble, but the ``modular ensemble\" of (semi-classically singular) horizonless microstates. We compute the thermal fluctuations in this ensemble, and reproduce the fluctuations in the area of the form expected from semi-classical general relativity. Ensembles of theories do not play a direct role in any of our discussions. We also note that these microstates, unlike fuzzballs, do $not$ break the isometries of the black hole.", "url": "https://arxiv.org/abs/2608.14541", "type": "理论", "summary": "1. 该工作在中心插入酉主连续序列 Wilson 线的半无限实心圆柱上，用 level-k SL(2,R)×SL(2,R) Chern-Simons 路径积分在 τ=0 截面制备重 Virasoro 初级态的体对偶。\n2. 技术要点是用 Drinfel'd-Sokolov 约化把仿射模化为 Virasoro 模，半经典下 DS 约束成为 AdS3 渐近 DS 规范，使单个初态的大 k WKB 鞍点为具有奇异视界的 BTZ 黑洞。\n3. 这给出不破坏黑洞等距、按模不变性配分函数加权的无视界微态系综，其解析延拓对应光滑视界永恒 BTZ，并可重现面积的热涨落。", "summary_source": "deepseek", "authors": [{"name": "Chethan Krishnan"}, {"name": "Rajdeep Mitra"}], "featured_authors": [{"name": "Chethan Krishnan"}, {"name": "Rajdeep Mitra"}], "author_count": 2}, {"id": "2608.14365", "category": "math-ph", "title": "Form factors of field exponentials in the 1+1 dimensional Sine-Gordon model", "abstract": "This work provides explicit expressions, in all sectors of the Fock space: soliton, antisoliton and breather, for the fundamental building blocks -the form factors- of the generalised integral kernels which represent the exponential of the field operator in the 1+1 dimensional Sine-Gordon quantum field theory. The obtained form factors reproduce the various results obtained earlier in the literature using, in particular, the free field approach.", "url": "https://arxiv.org/abs/2608.14365", "type": "理论", "summary": "1. 该工作给出1+1维正弦-戈登量子场论中指数场算符广义积分核的显式形状因子，覆盖孤子、反孤子与呼吸子全部Fock空间扇区。\n2. 其技术要点在于运用可积场论方法系统构造各扇区形状因子，并复现自由场途径的既有结果，表明公式的普适性与一致性。\n3. 这为后续计算Sine-Gordon模型关联函数、纠缠结构或求解广义热力学Bethe ansatz方程提供了可核验的解析基础。", "summary_source": "deepseek", "authors": [{"name": "Karol K. Kozlowski"}, {"name": "Alex Simon"}], "featured_authors": [{"name": "Karol K. Kozlowski"}, {"name": "Alex Simon"}], "author_count": 2}, {"id": "2608.14436", "category": "math-ph", "title": "A semiclassical limit of reduced Hartree-Fock theory at positive temperature", "abstract": "It is established that the reduced Hartree-Fock grand potential at positive temperature converges in the semiclassical limit to a Thomas-Fermi grand potential. In particular, a density-potential dual representation of the limiting functional is proposed for a general class of fermionic entropy functions. The corresponding dual problem has no duality gap and admits a maximizer. The resulting grand potential converges to the established zero-temperature grand potential as the temperature tends to zero and, for the Fermi-Dirac entropy, agrees with the standard positive-temperature Thomas-Fermi free-energy functional. The proof also establishes a semiclassical trace formula that is uniform over locally precompact families of potentials subject to a common confinement condition.", "url": "https://arxiv.org/abs/2608.14436", "type": "理论", "summary": "1. 该工作证明约化Hartree-Fock理论在正温度下的巨势于准经典极限收敛至Thomas-Fermi巨势。\n2. 其核心在于对一类费米子熵函数给出极限泛函的密度-势对偶表示，证明对偶问题无对偶间隙且有极大元，并建立对满足共同约束的局部预紧势族一致的准经典迹公式。\n3. 这为严格推导有限温度密度泛函理论提供了数学框架，且低温极限与零温Thomas-Fermi自由能自然衔接，可用于指导相关近似。", "summary_source": "deepseek", "authors": [{"name": "Dominic Shillingford"}], "featured_authors": [{"name": "Dominic Shillingford"}], "author_count": 1}, {"id": "2608.14523", "category": "math-ph", "title": "The Okinawa Lectures on Entropy", "abstract": "After a historical introduction, the most important classical and quantum entropies are introduced as constructions in classical and quantum probability theory. Classical entropies are studied from large deviation theory, including theorems of Sanov, Cramér, Gärtner-Ellis, and Varadhan, and are illustrated in some applications to both Boltzmannian and Gibbsian statistical physics. Quantum entropies superficially connect to classical entropies at the formula level, but more deeply do so via the crucial role of entropy in statistical hypothesis testing. The classical (relative) Kullback-Leibler entropy, its quantum counterpart introduced by Umegaki, as well as their deformations proposed by Renyi all fit naturally in this context. Quantum entropy faces the new problem of defining and computing the relative entropy of a pair of states on a subsystem, here formalized as a von Neumann algebra. This requires modular (aka Tomita-Takesaki) theory, which provides the framework for the relative quantum entropies introduced by Araki and Uhlmann (these encompass both the Kullback-Leibler and
