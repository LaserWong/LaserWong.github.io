Umegaki entropies as special cases). To (re)define and compute these entropies in terms of density operators and traces, further constructions are needed, namely Haagerup's noncommutative L^p spaces. Von Neumann algebras also provide the setting for the Connes-Stormer-Narnhofer-Thirring entropy, which is a quantum version of the Kolmogorov-Sinai entropy in dynamical systems and ergodic theory, to which we also provide an introduction. This course was originally inspired by, and should be relevant to, black hole thermodynamics, although we discuss neither this application nor the second law. The course tries to be both mathematically rigorous and interesting to theoretical physicists. Prerequisites are undergraduate probability theory, functional analysis, and quantum theory.", "url": "https://arxiv.org/abs/2608.14523", "type": "理论", "summary": "1. 该讲义系统梳理了经典与量子熵的数学构造，涵盖大偏差理论、假设检验中的相对熵及其Renyi形变。\n2. 其核心卖点是以von Neumann代数与Tomita-Takesaki模理论统一处理Araki-Uhlmann相对熵，并借助Haagerup非交换L^p空间重构密度算子表述。\n3. 该框架为量子动力学的CNT熵及黑洞热力学等物理情境提供了严格数学工具，但未涉及第二定律等具体应用。", "summary_source": "deepseek", "authors": [{"name": "Klaas Landsman"}], "featured_authors": [{"name": "Klaas Landsman"}], "author_count": 1}, {"id": "2608.13627", "category": "quant-ph", "title": "A scalable edge-pass Purcell filter for high-fidelity readout of superconducting qubits", "abstract": "High-fidelity readout with strong Purcell protection of qubit coherence is essential for scalable superconducting quantum processors, yet the finite passband and sizable footprint of conventional band-pass Purcell filters make them hard to scale. Here we introduce a scalable edge-pass Purcell filter that separates the readout band from the protected qubit band by a single transmission edge, freeing the readout resonators from bandwidth constraint. Depending on whether the transmitting band lies above or below the cutoff, the compact network is realized as a high-pass filter (HPF) or a low-pass filter (LPF). The HPF reaches an average readout fidelity of 99.46(4)% (up to 99.56%) with a 150-ns pulse, and the LPF reaches 99.49(3)% (up to 99.57%) with a 130-ns pulse. The average single-qubit gate fidelities are 99.94% (HPF) and 99.93% (LPF). Relative to the filter-free Purcell limit, the filters substantially extend the qubit lifetime, and the Purcell protection deepens at higher filter order. In addition, an intrinsic dissipation mode of the filter offers a qubit-reset channel. This leads to a compact architecture that unifies fast, high-fidelity readout, Purcell protection, and effective reset within a single filter for large-scale fault-tolerant quantum computation.", "url": "https://arxiv.org/abs/2608.13627", "type": "理论", "summary": "1. 该工作提出一种可扩展的边缘通过式Purcell滤波器，利用单一传输边沿将读出频带与受保护比特频带分离，可构成高通或低通紧凑网络。\n2. 其主要技术优势是解除读出带宽约束：高通/低通方案以150/130 ns脉冲实现99.46%/99.49%读出保真度，保持99.94%/99.93%单比特门保真度，更高阶数还可深化Purcell保护并延长比特寿命。\n3. 滤波器固有耗散模式提供比特复位通道，使单个无源器件同时完成快速高保真读出、Purcell保护与有效复位，为大规模容错量子计算提供紧凑架构。", "summary_source": "deepseek", "authors": [{"name": "Xudong Liao"}, {"name": "Yuan Li"}, {"name": "Sainan Huai"}, {"name": "Shuyi Pan"}, {"name": "Zhenxing Zhang"}, {"name": "Zhiwen Zong"}, {"name": "Kunliang Bu"}, {"name": "Yulei Ye"}, {"name": "Wen Zheng"}, {"name": "Xinsheng Tan"}, {"name": "Yang Yu"}, {"name": "Xiaopei Yang"}, {"name": "Tianqi Cai"}, {"name": "Shengyu Zhang"}], "featured_authors": [{"name": "Xudong Liao"}, {"name": "Yuan Li"}, {"name": "Sainan Huai"}, {"name": "Xiaopei Yang"}, {"name": "Tianqi Cai"}, {"name": "Shengyu Zhang"}], "author_count": 14}, {"id": "2608.13644", "category": "quant-ph", "title": "Heuristic Lookahead Distillation Protocol Search", "abstract": "Bipartite qubit entanglement distillation is the process of converting noisy ebits into pure ebits using only local operations and classical communication. This is a core operation for quantum repeaters, enabling such crucial tasks as long-distance quantum communication and distributed quantum computing. In this work, we introduce a method for searching for entanglement distillation protocols and, using this technique, distil qubit Werner states at a higher rate than could be achieved using previously discovered protocols. In particular, we demonstrate the advantage of our new distillation strategy by improving the best-known lower bound for the two-way-assisted quantum capacity of the qubit depolarising channel across a wide range of channel parameters, making progress in one of the long-standing problems of quantum information theory.", "url": "https://arxiv.org/abs/2608.13644", "type": "理论", "summary": "1. 该工作提出一种启发式前瞻搜索方法，用于发现二分量子比特纠缠蒸馏协议。\n2. 其技术卖点在于以更高速率蒸馏Werner态，并改进去极化信道双向辅助量子容量的已知下界。\n3. 这为量子中继及长距离量子通信中的蒸馏协议设计提供了新的优化途径。", "summary_source": "deepseek", "authors": [{"name": "Matthew Barber"}, {"name": "Stefano Pirandola"}], "featured_authors": [{"name": "Matthew Barber"}, {"name": "Stefano Pirandola"}], "author_count": 2}, {"id": "2608.13649", "category": "quant-ph", "title": "Tracking real-space quantum state breathing through Floquet-projector geometry", "abstract": "Periodic driving of spatially periodic quantum systems generates band structures that are absent in static crystals. We present a quantum geometric theory to characterize the Floquet-Bloch states at stroboscopic times and during micromotion on equal footing. Our framework builds upon time-evolved Floquet projectors that connect static quantum geometry, micromotion-operator geometry, and Floquet topology. To illustrate the formalism, we introduce the Floquet-projector quantum metric, which we employ to characterize the real-space breathing of localized states in a driven chiral-symmetric integrable spin chain. The Floquet-projector quantum metric, integrated over the Brillouin zone, captures the oscillatory variance during micromotion and, at symmetry-selected times, is bounded below by Floquet topological invariants. We further describe how the Floquet projector geometry enables a systematic investigation of micromotion dynamics in periodically driven lattice systems.", "url": "https://arxiv.org/abs/2608.13649", "type": "理论", "summary": "1. 该工作建立了一种基于时间演化Floquet投影算符的量子几何理论，将静态量子几何、微运动算符几何与Floquet拓扑联系起来，统一处理频闪时刻与微运动中的Floquet-Bloch态。\n2. 其核心工具为Floquet投影量子度规，可定量刻画手性对称可积自旋链中局域态的实空间呼吸，其布里渊区积分捕获微运动方差并在对称时刻受拓扑不变量约束。\n3. 这为周期驱动晶格系统中微运动动力学、Floquet拓扑响应及相关量子态操控的系统研究提供了可推广的几何框架。", "summary_source": "deepseek", "authors": [{"name": "Arpit Raj"}, {"name": "Johannes Mitscherling"}, {"name": "Björn Trauzettel"}], "featured_authors": [{"name": "Arpit Raj"}, {"name": "Johannes Mitscherling"}, {"name": "Björn Trauzettel"}], "author_count": 3}, {"id": "2608.13654", "category": "quant-ph", "title": "Entanglement Negativity in Noisy Quantum Volume Sampling", "abstract": "The Quantum Volume protocol uses scrambling random circuits to benchmark NISQ computers. Quantum Volume is generally well-regarded as a benchmark for small, noisy, quantum computers because it requires the quantum computer to implement many non-local entangling gates within a square-shaped circuit, which incentivizes high qubit count, long qubit coherence times, and low error rates on all hardware gates. Quantum Volume circuits inherently produce high-entanglement states that are fragile to errors and decoherence. The Quantum Volume benchmark measures an observable called heavy-output-probability (HOP), where an HOP of $0.5$ corresponds to complete loss of coherence, and in the limit of system size an HOP $\\approx 0.84$ for a fully coherent quantum processor. Here, we numerically study the tradeoff between depolarizing noise, entanglement as quantified by the bipartite negativity measure, and HOP in quantum volume circuits. Our results contextualize prior small scale quantum volume demonstrations on quantum computers and highlight that under depolarizing noise, due to finite system size effects heavy output probabilities can be greater than $0.5$ while the bipartite negativity entanglement has been destroyed. This implies, although improbable, that a NISQ computer could pass the Quantum Volume benchmark test threshold of $2/3$ while the underlying quantum computation has no global entanglement -- albeit only for small $n$.", "url": "https://arxiv.org/abs/2608.13654", "type": "理论+数值", "summary": "1. 该工作数值研究了噪声量子体积采样中退极化噪声、以二分负性度量的纠缠以及重输出概率（HOP）之间的相互制约关系，并阐明了有限尺寸效应的影响。\n2. 其主要技术结论是，在退极化噪声下即使二分负性纠缠已被完全破坏，有限系统尺寸仍可使HOP高于0.5，甚至使小规模NISQ设备越过2/3的量子体积通过阈值。\n3. 这为解释早期小规模量子体积演示提供了数值语境，并提示量子体积基准在小尺寸区间的通过不应被视为全局纠缠存在的充分证据，需谨慎对待其验证效力。", "summary_source": "deepseek", "authors": [{"name": "Elijah Pelofske"}, {"name": "Stephan Eidenbenz"}], "featured_authors": [{"name": "Elijah Pelofske"}, {"name": "Stephan Eidenbenz"}], "author_count": 2}, {"id": "2608.13664", "category": "quant-ph", "title": "Open system probes of renormalization group flow", "abstract": "Open system probes can provide an efficient means to characterize quantum many-body systems by employing them as engineered environments. The key idea is to map long-range spatial correlations of the environment onto dynamical correlations in the evolution of a simple quantum probe. Using the example of a qubit coupled to a transverse-field Ising model, we show how the non-Markovian rate or spectral flow can be used to identify stable and unstable fixed points, infer scaling dimensions of relevant fields, and deduce the renormalization group flow induced by deformations around any fixed point.", "url": "https://arxiv.org/abs/2608.13664", "type": "理论", "summary": "1. 该工作提出了用开放系统探针刻画量子多体系统的新方案，将系统视为工程化环境，并以耦合到横场伊辛模型链的量子比特为例展示其可行性。\n2. 其技术卖点在于把环境的实空间长程关联映射为探针演化的动力学关联，进而通过非马尔可夫速率或谱流识别稳定与不稳定不动点、标度维数及形变诱导的重整化群流。\n3. 这为实验上仅用单比特探针的动力学测量即可诊断量子临界性与普适类提供了可操作路径，并启发将开放系统方法推广至更高维或更复杂物相。", "summary_source": "deepseek", "authors": [{"name": "Andrew Keefe"}, {"name": "Brenden Bowen"}, {"name": "Saptarshi Biswas"}, {"name": "Albion Lawrence"}, {"name": "Nishant Agarwal"}, {"name": "Archana Kamal"}], "featured_authors": [{"name": "Andrew Keefe"}, {"name": "Brenden Bowen"}, {"name": "Saptarshi Biswas"}, {"name": "Albion Lawrence"}, {"name": "Nishant Agarwal"}, {"name": "Archana Kamal"}], "author_count": 6}, {"id": "2608.13691", "category": "quant-ph", "title": "Efficient Hamiltonian Truncation: Fast Matrix Construction and Quantum Krylov Diagonalization", "abstract": "Hamiltonian truncation offers a nonperturbative route to quantum field theory, yet its accuracy is limited by the rapid expansion of the truncated Hilbert space, which drives up computational cost. We tackle this bottleneck with a hybrid strategy that pairs classical and quantum algorithms: 1) we develop an efficient basis-generation scheme built on integer partitions; 2) we speed up the construction of the sparse Hamiltonian matrix using symmetry-aware algorithms; and 3) we explore quantum Krylov diagonalization as a route to the low-lying spectrum. Benchmarking against the free massive scalar and $\\phi^4$ theories in two spacetime dimensions, we achieve substantial gains in the computational efficiency of Hamiltonian truncation and chart a path toward future quantum implementations.", "url": "https://arxiv.org/abs/2608.13691", "type": "理论+数值", "summary": "1. 该工作针对哈密顿截断中截断希尔伯特空间膨胀导致的算力瓶颈，提出整数划分基组生成、对称性感知稀疏矩阵快速构造与量子Krylov对角化相结合的混合方案。\n2. 其技术要点是以经典算法高效完成基组与哈密顿矩阵元的构建，并将低能谱计算交给量子Krylov对角化，从而降低精确对角化的复杂性。\n3. 在二维时空自由有质量标量与φ^4理论上的基准测试显示出显著计算效率提升，为在未来量子硬件上实现非微扰量子场论模拟给出了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Rachel Houtz"}, {"name": "Marco Knipfer"}, {"name": "Konstantin Matchev"}, {"name": "Alexander Roman"}, {"name": "Mia West"}], "featured_authors": [{"name": "Rachel Houtz"}, {"name": "Marco Knipfer"}, {"name": "Konstantin Matchev"}, {"name": "Alexander Roman"}, {"name": "Mia West"}], "author_count": 5}, {"id": "2608.13764", "category": "quant-ph", "title": "Certified coherent, informative, and non-entanglement-breaking fixed points of future-referential quantum feedback", "abstract": "We study quantum processes in which information extracted from a forward simulation is returned as input to an earlier internal time of the simulated dynamics: externally the protocol is an ordinary causally ordered circuit, but internally it is future-referential. Contracting a process tensor with a leakage instrument and a controller induces a completely positive trace-preserving map on a message register, and we classify its fixed points by five operational properties: stability, informativeness, feedability, coherence, and preservation of quantum correlations. Four results separate notions that informal discussions of \"information from the future\" often conflate. A two-parameter unitary-dilation family yields a closed-form, globally attractive, coherent fixed point (Proposition 1), yet is entanglement breaking whenever future records are perfectly distinguishable (Lemma 1). Releasing that orthogonality, a four-parameter partial-swap family admits a nonempty open non-entanglement-breaking region (Proposition 2), with an explicit Choi partial-transpose neighborhood of half-width $0.0163\\pi$ (Proposition 3). Combining outward-rounded interval enclosures with perturbation bounds tracking the channel and its stationary-state drift, we certify an explicit parameter square of half-width $0.0013\\pi$ on which the feedback channel is simultaneously strictly contractive (margin $\\ge 0.237$), coherent ($\\ge 0.416$), informative about the designated future variable ($\\ge 0.172$ bits), and non-entanglement-breaking (NPT margin $\\ge 0.188$) (Proposition 4). Direct evaluation shows all four properties persisting over a region an order of magnitude larger, so the certified square is a proof of principle rather than a phase boundary. All enclosures and margins are confirmed by a machine-verified ball-arithmetic certificate, and the complete code and certificate accompany the paper.", "url": "https://arxiv.org/abs/2608.13764", "type": "理论+数值", "summary": "1. 该工作研究未来指涉量子反馈协议，其中前向模拟提取的信息被回送至更早内部时刻，并对外部因果有序电路诱导的完全正迹保持映射的固定点进行分类。\n2. 结合区间包络与扰动界，构造幺正膨胀族和部分交换族，证明存在显式参数方块，使固定点同时满足严格收缩（裕度>0.237）、相干（>0.416）、信息性（>0.172比特）及非纠缠破坏（NPT裕度>0.188）。\n3. 该机器验证结果说明多种操作属性可共存于有限参数区域而非相变边界，为未来指涉反馈的资源化及因果异常研究提供了基准实例与数值工具。", "summary_source": "deepseek", "authors": [{"name": "Eran Kopel"}], "featured_authors": [{"name": "Eran Kopel"}], "author_count": 1}, {"id": "2608.13781", "category": "quant-ph", "title": "Entanglement asymmetry characterization of the Chiral Anomaly", "abstract": "Shao et al. recently showed that the 1+1D staggered fermion Hamiltonian admits a whole algebra of lattice operators that flow to the same axial charge in the thermodynamic limit (TL). On the lattice the principal axial charge does not commute with the vector charge, although their commutator is expected to vanish in the TL, providing a lattice realization of the chiral anomaly. We investigate the effect of this anomaly on the ground state(s) using the entanglement asymmetry. Unexpectedly, the asymmetry remains nonzero in the TL, despite the vanishing of the commutator, and exhibits a novel scaling behavior.", "url": "https://arxiv.org/abs/2608.13781", "type": "理论", "summary": "1. 该工作研究了1+1维交错费米子格点模型中，整族格点算符在热力学极限下流向同一轴荷这一手征反常对基态的影响，并采用纠缠不对称性进行表征。\n2. 其核心发现在于，尽管格点上轴向荷与矢量荷之间的对易子在热力学极限下消失，基态的纠缠不对称性仍保持非零，并呈现新的标度行为。\n3. 这为在格点或量子模拟平台上以纠缠不对称性作为手征反常的探针提供了新途径，也提示反常效应可能以量子关联的非局域方式在热力学极限中存留。", "summary_source": "deepseek", "authors": [{"name": "Alfred Benedito German Sierra"}], "featured_authors": [{"name": "Alfred Benedito German Sierra"}], "author_count": 1}, {"id": "2608.13881", "category": "quant-ph", "title": "Nonorthogonal-state erasure as the resource behind apparent second-law violations", "abstract": "Perfect deterministic distinguishing of nonorthogonal quantum states is forbidden by the linear and unitary structure of quantum mechanics. It has often been assumed that, if such distinguishing were available, it would be the resource enabling work extraction from a single heat bath. We show that this expectation identifies the wrong thermodynamic operation and prove such hypothetical operation increases, rather than decreases, the joint entropy of system and detector. The entropy-decreasing resource is instead the inverse operation, which we call nonorthogonal-state erasure. Reanalyzing a Peres-type Szilard engine, we show that the apparent extracted work $W_{\\mathrm{ext}}=0.2766k_{\\mathrm{B}}T$ for an equal mixture of an atomic ensemble with spin state $\\left|\\uparrow\\right\\rangle $ and $\\left|\\rightarrow\\right\\rangle $. Thus the apparent second-law violation is supplied not by nonorthogonal-state distinguishing, but by a nonorthogonal quantum state erasure.", "url": "https://arxiv.org/abs/2608.13881", "type": "理论", "summary": "1. 该工作重新分析Peres型Szilard发动机，论证看似由非正交量子态完美区分导致的第二定律表观违反，实际源于另一热力学操作。\n2. 关键技术结论是：完美区分操作增加系统与探测器联合熵，而其逆操作——非正交态抹除——才是熵减资源，对等概率|↑⟩与|→⟩混合可提取功W_ext=0.2766 k_B T。\n3. 这一区分将量子测量资源核算从态区分转向态抹除，为量子热力学与信息擦除原理的关联提供了新的理论基准和实验检验方向。", "summary_source": "deepseek", "authors": [{"name": "Xinshu Xia"}, {"name": "Hui Hui Qin"}, {"name": "Yu-Han Ma"}, {"name": "Chang-Pu Sun"}, {"name": "Hui Dong"}], "featured_authors": [{"name": "Xinshu Xia"}, {"name": "Hui Hui Qin"}, {"name": "Yu-Han Ma"}, {"name": "Chang-Pu Sun"}, {"name": "Hui Dong"}], "author_count": 5}, {"id": "2608.13894", "category": "quant-ph", "title": "de Broglie-Bohm Dynamics with Schrödinger Source Fields: A Framework for Subquantum Theory", "abstract": "We extend de Broglie--Bohm (dBB) pilot-wave theory by introducing a complex source field into the Schrödinger equation and examining its effects on quantum equilibrium and nonequilibrium dynamics. In dBB theory, the physical particle distribution P, rather than the Born density $|{\\psi}|^2$, carries the ensemble probability, so a source term may modify the pilot wave without violating conservation of total particle probability. We derive the source-modified Hamilton--Jacobi and continuity equations, the transport equation for the nonequilibrium ratio $f=P/|{\\psi}|^2$, and an exact entropy-production formula. Three applications follow. First, suitably designed sources can drive exponential relaxation toward quantum equilibrium. Second, the entropy-production rate admits a Prigogine-type bilinear form, providing a basis for a subquantum thermodynamics with entropy-producing and entropy-extracting regimes. Third, a tuned source can exactly cancel the Bohmian quantum potential, yielding classical particle trajectories while the guiding wave retains nontrivial structure and the nonequilibrium ratio remains conserved. The resulting framework provides a unified setting for studying source-driven quantum nonequilibrium, entropy exchange, and classicalization, and motivates further investigation of the physical and ontological status of the source field.", "url": "https://arxiv.org/abs/2608.13894", "type": "理论", "summary": "1. 该工作将复值源场引入薛定谔方程，推广德布罗意-玻姆导航波理论，并系统研究其对量子平衡与非平衡动力学的影响。\n2. 其核心在于导出源修正的哈密顿-雅可比方程、连续性方程、非平衡比f=P/|ψ|^2的输运方程及精确熵产生公式，并展示源可驱动指数弛豫、实现Prigogine型双线性熵产生及抵消量子势使粒子轨迹经典化。\n3. 这为源驱动的量子非平衡、熵交换与经典化提供了统一框架，并推动对源场物理与本体论地位的进一步探讨。", "summary_source": "deepseek", "authors": [{"name": "Said Mikki"}], "featured_authors": [{"name": "Said Mikki"}], "author_count": 1}, {"id": "2608.13907", "category": "quant-ph", "title": "Robust Quantum Extremal Numbers", "abstract": "Absolutely maximally entangled states require every reduction of at most half of the parties to be maximally mixed, a condition that is both rigid and often impossible for qubit systems. Previous work introduced the quantum extremal number, which maximizes the number of exactly maximally mixed half-body marginals, and determined the exact value Qex(8,4)=56. The present work develops a robust extension of this extremal problem. For a subsystem $A$, the marginal maximal-mixing defect is defined by \\[ D_A=2^{|A|}\\operatorname{Tr}(\\rho_A^2)-1 =2^{|A|}\\left\\|\\rho_A-\\frac{I_A}{2^{|A|}}\\right\\|_2^2, \\] and $Q_{\\mathrm{ex},\\varepsilon}^{D}(n,k)$ is defined as the maximum number of $k$-body marginals satisfying $D_A\\leq\\varepsilon$ in an $n$-qubit pure state. This counting problem differs from approximate $k$-uniformity, which requires all $k$-body marginals to obey a common error bound. For pure states on $4m$ qubits, the following local stability inequality is established: \\[ \\sum_{i\\in T}D_{T\\setminus\\{i\\}}\\geq1 \\qquad (|T|=2m+1). \\] It follows that, whenever $\\varepsilon<1/(2m+1)$, the hypergraph of $\\varepsilon$-good $2m$-subsets is $K_{2m+1}^{(2m)}$-free. Combined with the known exact eight-qubit construction, this yields the stability plateau \\[ Q_{\\mathrm{ex},\\varepsilon}^{D}(8,4)=56, \\qquad 0\\leq\\varepsilon<\\frac15. \\] For odd systems of $2k+1$ qubits, the exact forbidden hypergraph $H_k$ is used to derive explicit finite-error stability radii. In particular, $Q_{\\mathrm{ex},\\varepsilon}^{D}(9,4)\\leq120$ for $0\\leq\\varepsilon<1/17$. These results turn exact quantum Turán obstructions into quantitative robustness statements and identify intervals on which quantum extremal numbers are stable under imperfect marginal mixedness.", "url": "https://arxiv.org/abs/2608.13907", "type": "理论", "summary": "1. 该工作将量子极值数推广为对 k 体约化最大混合缺陷的鲁棒计数，定义 Q_{ex,ε}^D(n,k) 并研究其稳定平台。\n2. 关键是用 4m 量子比特纯态满足的 Σ_{i∈T}D_{T\\setminus{i}}≥1（|T|=2m+1），证明 ε<1/(2m+1) 时好边缘超图不含 K_{2m+1}^{(2m)}，从而得到 Q_{ex,ε}^D(8,4)=56（ε<1/5）和 Q_{ex,ε}^D(9,4)≤120（ε<1/17）。\n3. 这些结果把精确量子Turán障碍变为定量鲁棒性结论，为含噪声平台中纠缠资源分类和非理想边缘混合下的量子关联制备提供了可行区间。", "summary_source": "deepseek", "authors": [{"name": "Wanchen Zhang"}, {"name": "Zicheng Han"}, {"name": "Xiande Zhang"}], "featured_authors": [{"name": "Wanchen Zhang"}, {"name": "Zicheng Han"}, {"name": "Xiande Zhang"}], "author_count": 3}, {"id": "2608.14002", "category": "quant-ph", "title": "Circuit Depth Compression via Spectral Gap Amplification in Quantum Phase Estimation", "abstract": "We show that quantum phase estimation (QPE) circuits can be significantly compressed in depth by preprocessing the input operator with a sigmoid spectral filter before estimation. For systems with small spectral gaps Delta_lambda, standard QPE requires m = ceil(log2(1/Delta_lambda)) precision qubits and depth Theta(2^m). Applying a soft-step transformation f(lambda; tau,w) amplifies the effective gap to Delta_f > Delta_lambda (for w < 1/4), reducing the required precision to m_f = ceil(log2(1/Delta_f)) and compressing circuit depth by 2^(alpha Delta_m), where alpha = 1 for the LMR density-matrix exponentiation framework and alpha is in [0.11,0.42] for controlled-phase-gate circuits. We prove that this compression is exact, bounded above by log2(1/(4w Delta_lambda)) + 1, and impossible for exactly degenerate spectra. We further show that the threshold parameter tau requires only O(w) accuracy, so classical preprocessing such as covariance diagonalisation or CASSCF avoids circularity. A net resource advantage occurs when 4w^2(2^Delta_m - 1) > Delta_lambda log(1/epsilon). Validation on LiH and BeH2 bond-stretch calculations, classical covariance datasets, and synthetic near-degenerate cases demonstrates depth reductions of up to 27x and CX-gate reductions of up to 21x. For LiH, QPE output fidelity improves from 0.66 to 0.98 at a 1% hardware error rate. The method preserves the principal subspace to machine precision, requires no modification of QPE, and can be combined with readout-stage and state-preparation filtering. Negative-control tests establish the benefit condition: m_raw >= 2 and Delta_lambda > 0.", "url": "https://arxiv.org/abs/2608.14002", "type": "理论+数值", "summary": "1. 该工作提出在量子相位估计(QPE)前对输入算子施加S形谱滤波器，通过放大有效能隙Δ_f来压缩所需精度比特数与电路深度。\n2. 其技术核心是严格证明压缩深度上限为log2(1/(4wΔ_λ))+1，并给出净资源优势条件4w^2(2^Δ_m−1)>Δ_λ log(1/ε)，同时排除完全简并能谱情形。\n3. 在LiH与BeH2键拉伸等算例中实现最高27倍深度与21倍CX门削减，且保真度由0.66升至0.98，为近段量子化学模拟提供了无需修改QPE的实用预处理路径。", "summary_source": "deepseek", "authors": [{"name": "Sk Mujaffar Hossain"}, {"name": "Satadeep Bhattacharjee"}], "featured_authors": [{"name": "Sk Mujaffar Hossain"}, {"name": "Satadeep Bhattacharjee"}], "author_count": 2}, {"id": "2608.14041", "category": "quant-ph", "title": "Non-Abelian geometry and globally inequivalent symmetry reductions of the cylindrical Dirac doublet", "abstract": "Different exact cylindrical Dirac constructions are locally related within the same two-dimensional positive-energy sector, suggesting that they might be merely alternative choices of basis. We show that this equivalence can fail globally. Treating the cylindrical Dirac doublet as a rank-two bundle over momentum space, we identify transverse helicity, a mass-dressed transverse integral, and helicity as distinct symmetry-selected rank-one reductions, whose normalized restrictions organize the internal doublet through a Pauli algebra. The positive-energy Dirac $SU(2)$ connection Abelianizes exactly on fixed-azimuth meridians in the transverse-helicity basis, while its full three-dimensional curvature remains genuinely non-Abelian for nonzero mass. We derive the corresponding azimuthal Wilson-loop spectrum in closed form. The three reductions then display sharply different global structures: the transverse-helicity splitting terminates on the momentum axis, the mass-dressed splitting extends smoothly and is Chern trivial for $m>0$, whereas helicity defines line bundles with opposite unit Chern numbers. Thus a single Dirac doublet admits symmetry resolutions that are locally equivalent but globally inequivalent.", "url": "https://arxiv.org/abs/2608.14041", "type": "理论", "summary": "1. 该工作研究了柱对称狄拉克双态作为动量空间秩二丛的三种对称约化，证明这些约化局域等价但在整体上不等价。\n2. 其要点在于正能区SU(2)联络在横向螺旋基的固定方位角子午线上精确阿贝尔化，而质量非零时三维曲率仍保持非阿贝尔；三种约化分别表现为动量轴截断、m>0时Chern平凡的平滑延拓以及相反单位Chern数的线丛结构。\n3. 这为区分局域基变换无法探测的全局几何效应、并以闭式Wilson圈谱判别非阿贝尔拓扑相提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Zhongze Guo"}, {"name": "Bei Xu"}, {"name": "Qiang Gu"}], "featured_authors": [{"name": "Zhongze Guo"}, {"name": "Bei Xu"}, {"name": "Qiang Gu"}], "author_count": 3}, {"id": "2608.14083", "category": "quant-ph", "title": "Information-Calibrated Quantum Diffusion: Aligning Forward Noise with Reverse Recoverability", "abstract": "Quantum diffusion models typically parameterize forward corruption by raw channel strength, even though equal parameter increments need not erase equal information or induce comparable inverse problems. We introduce the classical--quantum information decrement $\\Delta_t=I(X{:}Q_{t-1})-I(X{:}Q_t)$ as an intrinsic diffusion coordinate for labeled quantum ensembles. Along depolarization, equalizing $\\Delta_t$ yields the unique minimax discretization of the forward path, while universal recoverability gives the same quantity an operational reverse interpretation as an attainable expected log-fidelity budget for a label-independent CPTP recovery channel. Complementary continuity and pairwise-geometric converses lower-bound the optimal common-channel recovery error. We further show that local calibration is fundamentally insufficient for stochastic generation: even in a fixed noncommuting two-qubit system, identical local-fidelity laws and budget-feasible risks can coexist with macroscopically different output distributions. This motivates a stochastic learner combining theorem-scaled recovery constraints with distribution matching, for which we establish finite-sample calibration and compositional trace-Wasserstein control. On four-qubit TFIM, a controlled capacity extension reduces endpoint $\\Wtr$ from $.622$ to $.424$ on all ten matched seeds and achieves lower $\\Wtr$ than official QuDDPM ($.498$) with fewer trainable parameters.", "url": "https://arxiv.org/abs/2608.14083", "type": "理论", "summary": "1. 该工作提出以经典-量子信息递减量 Δ_t 为内禀扩散坐标来标定量子扩散前向噪声，并构建结合恢复约束与分布匹配的随机生成器。\n2. 技术要点是使 Δ_t 均等化给出前向路径的唯一极小极大离散化，使普适可恢复性成为对数保真度预算，并证明局部保真度校准不足以决定随机输出分布。\n3. 在四比特TFIM上，该方法以更少参数将终点的迹- Wasserstein 距离从0.622降至0.424，低于官方QuDDPM的0.498，为高效量子生成建模提供了明确参考。", "summary_source": "deepseek", "authors": [{"name": "Qipeng Qian"}, {"name": "Yuntao Qian"}], "featured_authors": [{"name": "Qipeng Qian"}, {"name": "Yuntao Qian"}], "author_count": 2}, {"id": "2608.14110", "category": "quant-ph", "title": "Entanglement certification via causal-order interferometry in a quantum switch", "abstract": "Entanglement certification is often performed on states that have already undergone noisy transmission or processing. Noise can reduce the surviving entanglement and can also cause a given criterion to fail even when entanglement remains. In this context, the quantum switch, a paradigmatic realization of indefinite causal order (ICO), coherently controls the orders in which two channels act and has been shown to offer advantages across a range of quantum information-processing tasks. Here we ask whether this coherent control enlarges the noise-parameter region in which entanglement remains certifiable. We regard the two order branches as the arms of a causal-order interferometer and insert a local unitary between the channel uses to tune their interference. For stochastic Pauli noise, a postselected ICO output can exhibit greater entanglement negativity than any classical mixture of the two definite orders; in particular, we identify regimes where its negativity remains nonzero while that of every classical mixture vanishes. A suitable local Pauli unitary substantially enlarges this ICO-only region, while an input-dependent path-difference indicator qualitatively links operator noncommutativity to the postselected negativity gain. Numerical examples extend the advantage to local amplitude-damping noise and two-qutrit Weyl noise. At a representative Weyl-noise point for the $3\\times 3$ positive-partial-transpose (PPT) Tiles bound-entangled state, a nondecomposable witness detects the postselected ICO output, whereas an analytic bound excludes detection of the definite-order outputs and their mixtures by the entire locally rotated witness family. These results identify causal-order interferometry as a strategy for enhancing entanglement certification across distinct noise models and dimensions.", "url": "https://arxiv.org/abs/2608.14110", "type": "理论+数值", "summary": "1. 本文利用量子开关中两个信道次序的相干控制构成因果序干涉仪，研究在噪声下通过后选择输出增强纠缠可认证性的可能性。\n2. 核心发现在于随机Pauli噪声下存在仅非定序输出保有负性的区域，且适当局域幺正可显著扩大该区域，并将算符非对易性与后选择负性增益联系起来。\n3. 数值上将该优势推广至振幅阻尼及双qutrit Weyl噪声，甚至可检测Tiles束缚纠缠态，为抗噪纠缠认证提供了新策略。", "summary_source": "deepseek", "authors": [{"name": "Haojie Wang"}, {"name": "Shuheng Liu"}, {"name": "Qiongyi He"}], "featured_authors": [{"name": "Haojie Wang"}, {"name": "Shuheng Liu"}, {"name": "Qiongyi He"}], "author_count": 3}, {"id": "2608.14134", "category": "quant-ph", "title": "Photonic Quantum Computing vs. Classical Solvers in Constrained Factor Portfolio Optimization", "abstract": "The authors present a rigorous empirical evaluation of three distinct optimization paradigms for institutional factor portfolio construction: an entropy-based photonic quantum annealer (Dirac-3, Quantum Computing Inc.), a commercial mixed-integer programming solver (Gurobi), and a model-free deep reinforcement learning agent (SAC). Evaluating these pipelines on the Jensen-Kelly-Pedersen 13-factor equity library across 164 months test window, we implement a full factorial penalty sweep comprising 48 hyperparameter configurations that govern return, volatility, and skewness trade-offs. Our findings demonstrate that while photonic hardware can locate superior risk-return topologies within a narrow operating range, classical mixed-integer programming remains superior for risk-constrained mandates requiring tight tail-risk control and cross-seed stability. Furthermore, we document structural failure modes in reinforcement learning factor allocators under unanchored higher-moment shaping. We translate these empirical results into actionable, mandate-specific guidelines for quantitative portfolio managers deploying advanced optimization engines.", "url": "https://arxiv.org/abs/2608.14134", "type": "理论+数值", "summary": "1. 该工作系统比较了光量子退火器、经典混合整数规划求解器与深度强化学习智能体在因子组合优化中的实证表现，基于13因子股票库与164个月回测窗口。\n2. 其主要技术发现是：光量子硬件仅在较窄参数区间内能定位更优风险-收益拓扑，而经典MIP在风险约束与跨随机种子稳定性上仍占优，且强化学习在高阶矩塑形中存在结构性失效模式。\n3. 这为量化组合管理按任务约束选择量子退火、经典求解器或强化学习引擎提供了明确的分工依据与可操作指南。", "summary_source": "deepseek", "authors": [{"name": "Nirvik Sahoo"}, {"name": "Chyng Wen Tee"}, {"name": "Paul Robert Griffin"}], "featured_authors": [{"name": "Nirvik Sahoo"}, {"name": "Chyng Wen Tee"}, {"name": "Paul Robert Griffin"}], "author_count": 3}, {"id": "2608.14199", "category": "quant-ph", "title": "Local geometry for Schmidt number witnesses", "abstract": "Suppose that $F_E$ is the face of the convex set of all $m\\otimes n$ bi-partite states which consists of states with ranges contained in a subspace $E$. For generic subspaces $E$ with a specific dimension, we use the result in [Phys. Rev. A 112 (2025), 032426] to see that there exists a number $\\kappa$, depending only on the dimension of $E$, such that there exist Schmidt number $\\ell$ witnesses outside of $F_{E^\\perp}$ if and only if $\\ell\\le\\kappa$. In this generic case, we show in this paper that there exist Schmidt number $\\ell$ witnesses for $\\ell>\\kappa$ around the projection states located at the center of $F_{E^\\perp}$.", "url": "https://arxiv.org/abs/2608.14199", "type": "理论", "summary": "1. 该工作研究两体量子态凸集上的 Schmidt 数见证者，在一般子空间 E 构成的面 F_E 与 F_{E^\\perp} 的局部几何中考察其存在范围。\n2. 它证明了存在仅由 E 维数决定的阈值 kappa：当 Schmidt 数 ell≤kappa 时见证者仅出现在 F_{E^\\perp} 外部；当 ell>kappa 时，可在 F_{E^\\perp} 中心的投影态附近构造见证者。\n3. 该结果揭示了高 Schmidt 数见证者在态空间中的局域分布规律，为纠缠维度的几何判别和见证者构造提供了新的理论途径。", "summary_source": "deepseek", "authors": [{"name": "Young-Hoon Kiem"}, {"name": "Seung-Hyeok Kye"}], "featured_authors": [{"name": "Young-Hoon Kiem"}, {"name": "Seung-Hyeok Kye"}], "author_count": 2}, {"id": "2608.14214", "category": "quant-ph", "title": "Exchange-only qubit stabilized by a single-spin qubit", "abstract": "Hybrid approaches that combine different spin qubit encodings offer promising advantages. In particular, the additional degrees of freedom available in exchange-only qubits and their extensions enable enhanced spin lifetimes and facilitate error detection through the use of auxiliary spins. We show that integrating Loss-DiVincenzo with exchange-only qubits provides a practical route to realizing these benefits while remaining compatible with spin-shuttling architectures. We further demonstrate how the singlet-only exchange-only qubit can be employed for error detection, and we present a fault-tolerant $\\pi$-rotation about each of the three control axes of the (singlet-only) exchange-only qubit. By enabling error detection at the lowest encoding level, our approach effectively converts charge and nuclear noise into erasures, thereby suppressing error propagation and potentially enhancing the performance of quantum error-correction schemes. More broadly, our work establishes a new perspective on the singlet-only exchange-only qubit as a logical encoding, opening the door to fault-tolerant gate constructions and spin-tailored quantum error-correction protocols for semiconductor-based quantum computing.", "url": "https://arxiv.org/abs/2608.14214", "type": "理论", "summary": "1. 该工作提出将Loss-DiVincenzo单自旋量子比特与交换型量子比特混合集成，以稳定自旋编码，并保持与自旋穿梭架构的兼容性。\n2. 其核心卖点在于利用单重态交换型量子比特在编码层实施错误检测，将电荷与核噪声转化为擦除误差，并实现绕三个控制轴的容错π旋转。\n3. 这为半导体自旋量子计算中的逻辑编码、容错门构建及自旋定制的量子纠错协议提供了新的设计基础与实现路径。", "summary_source": "deepseek", "authors": [{"name": "Irina Heinz"}, {"name": "Mira Sharma"}, {"name": "Joris Kattemölle"}], "featured_authors": [{"name": "Irina Heinz"}, {"name": "Mira Sharma"}, {"name": "Joris Kattemölle"}], "author_count": 3}, {"id": "2608.14263", "category": "quant-ph", "title": "SymQuPS: Symbolic Quantum Phase Space Algebra in Python", "abstract": "We present \\texttt{SymQuPS}, a SymPy-based algebra system in Python mainly aimed toward the phase space representation of quantum mechanics within the Cahill-Glauber formalism (including the Glauber-Sudarshan $P$, Wigner, and Husimi $Q$ representations). By extension, the package serves as an algebraic venue for canonical quantization. A key feature is the phase space representation of an arbitrary Lindblad master equation, which gives the phase space equation of motion of the quantum system. We describe the core functionalities of the package, consisting of $s$-ordered operators, the star products, and the phase space representation. Some examples of use are given to illustrate the application of the package, and the package's performance in typical use cases is discussed.", "url": "https://arxiv.org/abs/2608.14263", "type": "理论", "summary": "1. 该文发布SymQuPS，一个基于SymPy的Python符号代数系统，面向Cahill-Glauber形式的量子相空间表示，涵盖P、Wigner与Q分布，并可扩展至正则量子化。\n2. 核心卖点在于能将任意Lindblad主方程直接映射为相空间运动方程，同时以s参数化算符与星积为核心，实现符号化、系统化的相空间计算。\n3. 这为量子光学、开放量子系统及量子信息研究提供了可复用的符号计算平台，并为自动化处理复杂量子动力学问题提供了新的工具路径。", "summary_source": "deepseek", "authors": [{"name": "Hendry M. Lim"}, {"name": "Donny Dwiputra"}, {"name": "Ahmad R. T. Nugraha"}], "featured_authors": [{"name": "Hendry M. Lim"}, {"name": "Donny Dwiputra"}, {"name": "Ahmad R. T. Nugraha"}], "author_count": 3}, {"id": "2608.14325", "category": "quant-ph", "title": "Krylov complexity and Berry phase in quantum adiabatic dynamics", "abstract": "The connection between Krylov complexity and Berry phase in adiabatic dynamics is investigated under the instantaneous eigenstate basis of a slowly evolving spin system. Adiabatic dynamics force the Krylov complexity to vanish if the initial Krylov basis is an instantaneous eigenstate of the Hamiltonian. Nevertheless, we demonstrate that the Krylov complexity will be nonvanishing if the initial Krylov basis is a superposition state rather than an eigenstate. Time evolution of Krylov complexity will behave periodically or quasi-periodically depending on the controlling parameters. In particular, for a single qubit system with constant parameters, the Krylov complexity will oscillate harmonically in time with the frequency relevant to the combination of the strength of the external field and the geometric Berry phase.", "url": "https://arxiv.org/abs/2608.14325", "type": "理论", "summary": "1. 该工作以缓慢演化的自旋系统为例，在瞬时本征基下研究了Krylov复杂度与Berry相的关系。\n2. 结果表明初始Krylov基为叠加态时复杂度不再为零，单比特下呈现谐波振荡，频率由外场强度与Berry相的组合决定。\n3. 这为绝热过程中几何相位如何调控量子复杂度提供了一个可检验的理论联系。", "summary_source": "deepseek", "authors": [{"name": "Han-Qi Zheng"}, {"name": "Peng-Zhang He"}, {"name": "Lei-Hua Liu"}, {"name": "Hai-Qing Zhang"}], "featured_authors": [{"name": "Han-Qi Zheng"}, {"name": "Peng-Zhang He"}, {"name": "Lei-Hua Liu"}, {"name": "Hai-Qing Zhang"}], "author_count": 4}, {"id": "2608.14331", "category": "quant-ph", "title": "Equivalence Between Average-Case Hardness of Learning and Cryptography for Mixed Quantum States", "abstract": "The relationship between cryptography and learning theory has long been a central theme in the foundations of theoretical computer science: cryptographic primitives can imply hardness of learning, while hardness of learning can in turn be used to construct cryptographic schemes. Recent works have begun exploring analogous connections in the quantum setting, relating the average-case hardness of learning quantum states (AHL) to cryptographic primitives such as one-way state generators (OWSG). Despite recent progress exploring this for pure states, the relationship for mixed states has remained an open question. In this work, we prove that the existence of AHL for mixed quantum states is equivalent to the existence of inefficiently verifiable one-way state generators (IV-OWSGs). As a consequence, this relates mixed-state AHL to EFI pairs. Moreover, as a corollary of existing results, we obtain a separation between IV-OWSGs and OWSGs relative to the SWAP oracle.", "url": "https://arxiv.org/abs/2608.14331", "type": "理论", "summary": "1. 该工作证明了混合量子态平均情形学习困难（AHL）与不可有效验证的单向态生成器（IV-OWSGs）存在性之间的等价关系。\n2. 其核心在于将混合态AHL与带噪声或混合态密码原语直接挂钩，并进一步与EFI对建立联系，弥补了纯态情形的空白。\n3. 这为量子学习理论与量子密码学的统一图景提供了新桥梁，并借助SWAP预言机揭示了两类单向态生成器间的分离。", "summary_source": "deepseek", "authors": [{"name": "Alexandru Cojocaru"}, {"name": "Laura Lewis"}], "featured_authors": [{"name": "Alexandru Cojocaru"}, {"name": "Laura Lewis"}], "author_count": 2}, {"id": "2608.14387", "category": "quant-ph", "title": "Linearised quantum signal processing", "abstract": "Quantum functional programming has been developed through two distinct paradigms in the last few years: Quantum Signal Processing (QSP)-based methods, including the Quantum Singular Value Transformation (QSVT), and methods based on higher-order quantum transformations, such as the Universal Hamiltonian Eigenvalue Transformation (UHET). While UHET performs functional transformations of Hamiltonian dynamics, its relationship to QSP-based techniques has remained unclear despite evident structural similarities. In this work, we resolve this gap by establishing a connection between UHET and QSP-based frameworks; specifically, we show that UHET can be interpreted as a (randomised) linearisation of Generalised QSP (GQSP). Building on this result, we introduce a linearised variant of (Hamiltonian-based) QSVT, which we call Universal Hamiltonian Singular Value Transformation (UHSVT), that enables the efficient transformation of the singular values of any arbitrary matrix $A$ encoded in a block of a Hamiltonian, whose dynamics is accessible as a black box, by any sufficiently differentiable complex-valued function $f$. Our algorithm requires the sole condition that $f$ vanishes at the origin, in contrast to previous QSVT-based approaches that assumed either a lower bound on the singular values of $A$ or the ability to perform $X$-rotation gates on the induced two-dimensional 'qubitised' subspace.", "url": "https://arxiv.org/abs/2608.14387", "type": "理论+数值", "summary": "1. 该工作将通用哈密顿本征变换与广义QSP建立联系，并提出线性化奇异值变换UHSVT。\n2. 核心在于证明UHET是GQSP的随机线性化，使UHSVT仅需f(0)=0即可变换黑盒哈密顿量中任意矩阵的奇异值。\n3. 这为统一QSP与高阶量子变换提供框架，并放宽了对奇异值下界或额外旋转等先前条件的限制。", "summary_source": "deepseek", "authors": [{"name": "Marek Arsenault"}, {"name": "Hlér Kristjánsson"}], "featured_authors": [{"name": "Marek Arsenault"}, {"name": "Hlér Kristjánsson"}], "author_count": 2}, {"id": "2608.14469", "category": "quant-ph", "title": "Current fluctuations in a non-additive open quantum system: breakdown of the quantum-jump approach", "abstract": "Open quantum system dynamics is efficiently described by the quantum master equation formalism. Therein, quantum master equations in Lindblad form constitute an important subclass describing Markovian dynamics. When an open quantum system is in an out-of-equilibrium state, an exchange of particles between the open system and reservoirs takes place yielding to a non-zero average net current and associated current fluctuations, which can be characterised with the quantum jump formalism for quantum master equations expressed in Lindblad form. However, a large class of quantum master equations cannot be described by Lindblad dynamics. Here we assess the validity and the effectiveness of the quantum jump formalism when the dissipators in the quantum master equation describe a non-additive, open quantum system dynamics. We find that an additive unravelling of the non-additive quantum master equation does not generate a completely-positive dynamics in the scenario of perfect jump detection. Nevertheless, allowing for an imperfect jump detection scenario, we find that an additive unravelling is possible that reproduces the current and the fluctuations obtained via the Landauer-Büttiker formalism.", "url": "https://arxiv.org/abs/2608.14469", "type": "理论", "summary": "1. 该工作研究非可加开放量子系统中的粒子流与电流涨落，系统检验量子跳跃方法在此类非 Lindblad 主方程下的有效性，并揭示完美跳跃探测下标准加性分解的失效。\n2. 其主要技术贡献在于证明对非可加耗散子直接施加加性量子跳跃展开并不能保持完全正动力学，然而在不完美跳跃探测条件下，存在能够精确复现 Landauer-Büttiker 电流及涨落的加性展开方案。\n3. 这一结果为非 Lindblad 类主方程下的量子轨迹解释设立了明确限制，并启发发展考虑有限探测效率的电流统计方案，对非平衡输运测量具有参考意义。", "summary_source": "deepseek", "authors": [{"name": "Ilia Khomchenko"}, {"name": "Saulo V. Moreira"}, {"name": "Emanuel Schwarzhans"}, {"name": "Mark T. Mitchison"}, {"name": "Tony J. G. Apollaro"}], "featured_authors": [{"name": "Ilia Khomchenko"}, {"name": "Saulo V. Moreira"}, {"name": "Emanuel Schwarzhans"}, {"name": "Mark T. Mitchison"}, {"name": "Tony J. G. Apollaro"}], "author_count": 5}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
